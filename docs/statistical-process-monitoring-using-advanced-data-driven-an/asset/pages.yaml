- pgno: 123
  md: 'Phase I analysis. Peres and Foglia to [102] provide a broad recent review of
    30 VS methods integrated into multivariate statistical process monitoring. The
    limitations of existing methods that are addressed by each of the 30 papers is
    listed along with the goal of each one. They divide the methods into those that
    (i) pre-process variables by performing VS prior to process monitoring; (ii) postprocess
    variables by performing VS after process monitoring; or (iii) iterate between
    VS and process monitoring. They close with their own list of future research topics,
    some of which overlap with [101]. Additional unique problems include more work
    on batch processes and fault diagnosis methods, which Reis and Gins [66] also
    cite as an important area of future work. Indeed, Reis and Gins [66] provide a
    very nice high-level overview of the developments and future needs in industrial
    process monitoring that include both VS-based monitoring and isolation and classification
    methods. They observe that the speed with which a fault is detected is low relative
    to the time necessary to diagnosis a fault, so they advocate for researchers to
    focus on fault prognosis, which seeks to anticipate faults and intervene in the
    system to perform maintenance or repairs before faults occur. Finally, Qin [103]
    provides a more technical review with a focus on both PCA and PLS and the use
    of reconstruction plots for fault isolation in the context of controlled systems.


