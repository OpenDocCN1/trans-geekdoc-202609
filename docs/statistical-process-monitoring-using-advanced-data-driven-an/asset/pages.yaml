- pgno: 72
  md: 'by abnormal events, need to be monitored and detected promptly to improve system
    resilience. Here, the capacity of the PCA-based SPE, \( T^2 \), and residuals-based
    univariate chart in monitoring ICs are tested. For each scheme, parametric and
    nonparametric thresholds are adopted to improve anomaly detection. The nonparametric
    threshold is computed as the \((1 - \alpha)\)th quartile of the estimated distribution
    of the decision statistic (e.g., \( Q \) and \( T^2 \).) using the KDE technique.
    To quantitatively assess the detection efficiency of the proposed procedures,
    the following metrics will be used: true positive rate (TPR), false positive rate
    (FPR), accuracy, and area under the curve (AUC) [147]. Detection results of the
    five monitoring schemes are summarized in Table 2.4.


    | Algorithm | TPR | FPR | Precision | AUC |

    | :--- | :--- | :--- | :--- | :--- |

    | PCA-SPE\(^{np}\) | 0.853 | 0.057 | 0.939 | 0.898 |

    | PCA-\(T^2_p\) | 0.657 | 0.059 | 0.928 | 0.799 |

    | PCA-\(T^2_{np}\) | 0.402 | 0.005 | 0.969 | 0.699 |

    | PCA-Residuals\(_{np}\) | 0.765 | 0.533 | 0.480 | 0.616 |

    | PCA-SPE\(_p\) | 0.196 | 0.001 | 0.964 | 0.598 |


    From the detection results in Table 2.4, we realize that the PCA-based residuals
    scheme is ineffective for monitoring multivariate IM data. In this approach, each
    single PCA residual is monitored individually by a nonparametric univariate monitoring
    scheme. The joint monitoring scheme declares the presence of an abnormal event
    if at least one individual scheme signals’ anomalies. This approach does not consider
    the correlation among variables and thus results in weak detection results.


    As clearly shown, the detection capacity is greatly enhanced by using the PCA-based
    SPE with nonparametric threshold compared to the corresponding Gaussian distribution-based
    thresholds. Indeed, the decision thresholds of SPE and \( T^2 \) schemes are computed
    with the assumption that residuals are Gaussian distributed, which is invalid
    for IMs data (Table 2.4). Indeed, the PCA-based SPE scheme with nonparametric
    threshold outperforms the other methods (Table 2.4) by achieving an AUC up to
    0.898, which flags its ability to detect the vast majority of abnormal events
    reported by the operator, while avoiding raising false alarms at the same time.
    The lowest prediction performance was obtained for the PCA-based SPE scheme with
    parametric thresholds since SPE statistic, which is sensitive to model errors.


    The anomalies that are challenging to detect based on the overall outcome of our
    algorithms are related to “Water supply shutdown” and “Lift station maintenance/flushing”.
    This is because they may raise multiple latent effects in multiple variables (unlike
    others that would cause significant single variable shifting) and therefore were
    not easy to be captured.'
