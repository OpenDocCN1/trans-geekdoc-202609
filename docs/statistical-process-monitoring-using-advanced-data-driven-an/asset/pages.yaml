- pgno: 107
  md: 'The IC observations are assumed to be distributed as \(\mathbf{x}_i \sim N(\mathbf{0},
    \mathbf{\Sigma})\), but under OC conditions, the distribution becomes \(\mathbf{x}_i
    \sim N(\mu, \Sigma)\). Thus, the OC process’ PC scores will have distribution
    \(\mathbf{y}_i \sim N(\mathbf{\Lambda}''\mu, \mathbf{\Lambda})\), where \(\mathbf{\Lambda}
    = \text{diag}(\lambda_1, \lambda_2, \dots, \lambda_p)\). Then, monitoring is conducted
    using an EWMA statistic, similar to the one presented in Eq. (3.14) but modified
    to apply to the standardized PC scores as follows:


    \(u_{i,j} = \lambda \tilde{y}_{i,j} + (1 - \lambda)u_{i-1}, \quad i = 1, 2, \dots,
    \quad j = 1, 2, \dots, p,\)


    with \(u_0 = 0\), and \(\lambda \in (0, 1]\), as before. Note, a \(\lambda\) with
    no subscript denotes the weight in the EWMA statistic, but with a subscript, it
    denotes an eigenvalue. Then, an IC process will have \(u_{i,j} \sim N(0, \sigma^2
    = \frac{\lambda}{1-\lambda})\), and its squared standardized value is


    \(d_{i,j} = \left( \frac{u_{i,j}}{\sqrt{\frac{\lambda}{1-\lambda}}} \right)^2
    \sim \chi^2_{(1)}.\)


    In an OC process with a mean shift, some of the \(d_{i,j}\) will become large,
    but Ebrahimi et al. [55] recommend filtering out some of the PCs. They simply
    threshold the \(d_{i,j}\) using the \(\alpha\) upper-tail quantile from the \(\chi^2_{(1)}\)
    distribution and monitor the new statistic,


    \(R_i = \sum_{j=1}^p \left( d_{i,j} - \chi^2_{(1), \alpha} \right)_+, \quad\)


    where \((\cdot)_+ = \max(0, \cdot)\). When \(R_i\) exceeds some threshold, then
    an alarm is issued, and this threshold is obtained through simulation under IC
    conditions to achieve a prespecified ARL.


    Once a fault is detected, the second step is to integrate the PCs into the fault
    isolation. Assuming that each observation is measured with noise, the OC state
    can be represented as \(\mathbf{x}_i = \mu + \epsilon_i\) with \(\epsilon \sim
    (\mathbf{0}, \mathbf{\Sigma})\). Then, the OC PC scores are \(\mathbf{y}_i = \mathbf{A}\mathbf{x}_i
    = \mathbf{A}\mu + \tilde{\epsilon}\), with \(\tilde{\epsilon} = \mathbf{A}\epsilon\).
    The goal is to estimate a sparse \(\mu\), so this is done with adaptive lasso


    \(\mu^* = \text{argmin}_{\mu} \left( (\mathbf{y}_i - \mathbf{A}\mu)''(\mathbf{y}_i
    - \mathbf{A}\mu) + \gamma \sum_{j=1}^p \frac{1}{\tilde{x}_j} |\mu_j| \right),
    \quad\)


    where \(\tilde{x}_j\) the least squares mean of the \(j\)th variable. However,
    the covariance of each variable in \(\mathbf{y}_i\) varies, so the standardized
    PC scores and PCs are used, written in matrix form, as follows:


    \(\tilde{\mathbf{y}}_i = \mathbf{\Lambda}^{-1/2}\mathbf{y}_i, \quad \text{and}
    \quad \tilde{\mathbf{A}} = \mathbf{\Lambda}^{-1/2}\mathbf{A}.\)'
