    # 7.6 Discussion


    Anomaly detection has applications in various domains, such as air quality monitoring,
    intrusion detection, product quality monitoring, and system health monitoring.
    Recurrent deep learning models present new ways to model complex time series data
    due to their extended capability to capture nonlinear interdependencies, which
    goes beyond a traditional mindset. As discussed in this chapter, recurrent models
    such as RNN, LSTM, GRU are becoming well-reputed with the recent breakthrough
    in deep learning and they are very efficient in describing temporal dependencies
    in multivariate time series data. It should be noted that RNN units are subjected
    to the vanishing/exploding gradient issue, which degrades the model''s capacity
    to capture long-term dependencies. To alleviate these problems, LSTM and GRU units
    have been designed and yield improved results as described in Sects. 7.2 and 7.3.


    To uncover anomalies in time series data, recurrent models are used to extract
    relevant information from massive data and generate residuals which are then evaluated
    by existing monitoring tools (e.g., statistical monitoring schemes and clustering
    algorithms) that are proven effective. One of the major advantages of using these
    unsupervised deep recurrent models to detect anomalies is that they do not need
    hand-coded features and prior knowledge of anomalies to work. For the purpose
    of anomaly detection, residuals generated by the reference recurrent models can
    be checked by the statistical monitoring schemes such as univariate and multivariate
    CUSUM and EWMA or by using binary clustering algorithms. In this chapter, we discussed
    the general framework of recurrent deep learning based anomaly detection in Sect.
    7.4.


    In this chapter, to improve process monitoring in case of high-dimensional data,
    we have described some hybrid models integrating the benefits of recurrent models
    and energy-based models such as RBM and DBN. These recurrent hybrid models enjoy
    certain desirable properties when modeling high-dimensional time-series datasets.
    Here, three flexible hybrid models to capture temporal dependencies in a multivariate
    setting were discussed: RNN-RBM, LSTM-RBM,'
