  md: 'To conclude this section, note that the aforementioned univariate monitoring
    schemes are designed based on two essential assumptions: the process data are
    uncorrelated and normally distributed. However, measurements from environmental
    and modern industrial processes are usually autocorrelated and/or nonnormally
    distributed. The absence of verification of these two major assumptions degrades
    the monitoring performance of these conventional schemes. To monitor processes
    with serially correlated measurements, several monitoring schemes have been designed
    in the literature [72–77]. Two major monitoring approaches to consider correlation
    in the data can be distinguished [76,58]. The essence of the first approach, which
    is known as a residuals-based scheme, is to describe the autocorrelation in the
    data by using a mathematical model. Then, traditional monitoring schemes can be
    applied to the uncorrelated residuals obtained from the model. The efficiency
    of these approaches, however, is very sensitive to the prediction quality of the
    model, which is not always easy to build [78,76]. The essence of the second approach
    to monitoring the autocorrelated data is to apply the monitoring schemes on the
    original data, and adjust their decision thresholds suitably to consider the effect
    of the correlated measurements [76,58]. Many authors have investigated the influence
    of the violation of the normality assumption on the process monitoring schemes
    [56,79, 80]. In [79], the impact of a violation of the normality assumption on
    the Shewhart scheme has been studied by using various known distributions including
    the uniform, right triangular, gamma, and bimodal distributions. Also, in [81]
    the impact of skewed distribution on the Shewhart chart has been studied. Several
    works have designed process monitoring charts for non-Gaussian distribution when
    the form of the underlying distribution is known. The authors in [82, 83] have
    developed the EWMA monitoring scheme for multivariate Poisson-distributed data.
    Also, univariate monitoring charts were designed to monitor nonnormally chi-square
    distributed processes [84]. However, often in real data, the form of the underlying
    distribution is unknown, and then our choice may be to use the normal theory results
    [56]. In such a case, ignoring the nonnormality in the process data can impact
    the statistical performance of the designed monitoring scheme.


    # 2.4.2 Distribution-based process monitoring schemes


    The most commonly used monitoring techniques detect the changes in the mean or
    variance of the process. However, in many real applications, changes frequently
    affect the distribution of the inspected process while its mean or variance rests
    unchanged. This section presents the Kullback–Leibler and Hellinger distances,
    which are commonly utilized to quantify the deviation separating two distributions.
    The results of this section are essential in designing LVR-based approaches for
    monitoring the entire distribution of the process and to broaden the practical
    application.'
