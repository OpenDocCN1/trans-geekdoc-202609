    DAE training is performed as follows. At first, the input x is corrupted with
    noise by adding some random, x̂ ~ qD(x̂|x). Then, the corrupted input x̂ is encoded
    as in the conventional AE, the coded features of the hidden layer are given as
    y = fθ(x̂). Lastly, the obtained features in the hidden layer are decoded and
    the reconstruction of the input is expressed as z = gθ′(h) = gθ′(f(x̂)).


    The parameters of DAE are obtained in the training phase by minimizing the following
    loss function:


    ```

    arg min L(x, g(f(x̂))) θ,θ′ (6.15)

    ```


    where L refers to a loss function such as the Euclidean norm, and θ and θ′ are
    the DAE parameters.


    In summary, by introducing a penalty term to the cost function, the DAE learns
    robust features by changing the reconstruction error term of the loss function.
    The model parameters are optimized using the same procedure used in the autoencoder
    called stochastic gradient descent.


    # 6.4.1.3 Contrastive autoencoder


    The aim of the contrastive autoencoder (CAE) is to achieve a robust learned representation
    that is less sensitive to small variations in the data by introducing a penalty
    term to the loss function [64,65]. To this end, an explicit regularizer is added
    on the code h = f(x) for encouraging the derivatives of f to be as small as possible:


    ```

    || J_f(x) ||_F^2 = sum_ij ( partial h_j(x) / partial h_i )^2 (6.16)

    ```


    In other words, the loss function of the CAE is based on the penalty term, Frobenius
    norm of the Jacobian matrix, || J_f(x) ||_F^2, to make the encoding less sensitive
    to small variations in the training dataset. Indeed, Frobenius norm reduces the'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'sensitivity of representation learned towards the training input, where penalizing
    promotes the feature space mapping to be contractive in the neighborhood of the
    training data.


    The aim of the training phase of the CAE is to determine parameters \(\theta =
    \{W, b_h, b_y\}\) for which \(\mathbf{y}\) is the reconstructed version of \(\mathbf{x}\)
    that minimizes the reconstruction error on a training dataset \(D\), which corresponds
    to minimizing the objective function:


    ```

    \(\mathcal{J}_{CAE}(\theta) = \sum_{\mathbf{x} \in D} \left( \mathcal{L}(\mathbf{x},
    g(f(\mathbf{x}))) + \lambda \| J_f(\mathbf{x}) \|_F^2 \right)\)

    ```


    where \(\mathcal{L}\) refers to the reconstruction error, the cross-entropy loss
    when the activation function \(s_g\) used is the sigmoid and with inputs \(\mathcal{X}
    \in [0, 1]\). The term \(\mathcal{L}\) is expressed as follows: \(\mathcal{L}(\mathbf{x},
    \mathbf{y}) = -\sum_i \log(y_i) + (1 - x_i) \log(1 - y_i)\). To enforce robustness
    of the representation \(f(\mathbf{x})\) obtained for a training input \(\mathbf{x}\),
    the penalization is measured as the Frobenius norm of the Jacobian \(J_f(\mathbf{x})\)
    of the nonlinear mapping applied to the input. The mapping is contracting the
    data efficiently and hence the name contractive autoencoder. The central role
    of the Jacobian term is a mapping filter by ignoring low variations and focusing
    more on significant representations to allow reconstruction of the training with
    small errors.


    # 6.4.2 Probabilistic models


    In this subsection, we present two commonly used energy-based models Boltzmann
    machine (BM) and restricted Boltzmann machine (RBM) that can be used to build
    up deep learning models.


    # 6.4.2.1 Boltzmann machine


    A Boltzmann machine (BM) is a stochastic neural network that comprises visible
    and hidden units, where the visible units are the input data (Fig. 6.11) [66].
    In a BM, every unit is connected to all other units. The hidden units act as a
    set of latent variables (features) allowing BM to model distributions over visible
    state vectors (Fig. 6.11). The BM model aims to understand the distribution underlying
    the input data and regenerate the data using that distribution. It is represented
    by an undirected graph, part of Markov random field, which forms a network of
    symmetrically connected units (neurons), capable to make stochastic decisions
    or binary decision (0, 1).


    The joint probability distribution of BM, which is an energy-based model, is computed
    based on an energy function as a Boltzmann distribution [66]:


    ```

    \(P(\mathbf{v}) = \frac{1}{Z(\theta)} \exp(-E(\mathbf{v})),\)

    ```'
