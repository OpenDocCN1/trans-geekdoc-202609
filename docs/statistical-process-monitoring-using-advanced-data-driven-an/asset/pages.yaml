  md: 'applied to nonlinear biological processes [46]. By merging the desirable properties
    of fuzzy logic and neural networks, the ANFIS showed greater capacity to handle
    process nonlinearity [45]. It should be pointed out that the ANFIS parameters
    are optimized online by the self-learning ability of NN. ANFIS is a hybrid system
    that combines the subjective knowledge representation using fuzzy inference and
    the learning ability of artificial neural networks. Thus, it provides a greater
    ability to adapt its membership function of a fuzzy model to achieve the desired
    performance [48]. The fuzzy “if–then” rules with assigned membership functions
    have been used to relate the inner relationship of the PLS model. Using the idea
    of adaptive neural network-based fuzzy inference systems to develop a relationship
    of the inner model, it optimizes the parameters in the premise and consequent
    part of the fuzzy inference system in an adaptive framework [48–50].


    For reaping the advantages of both PLS and ANFIS, the outer model is kept as in
    a linear PLS and the ANFIS is applied to model the inner relation. The coupled
    ANFIS-PLS model combines the robust capacity of PLS to learn the relationship
    between input–output variables and the adaptive learning of ANFIS to deal with
    nonlinearity in inner relations. Details on ANFIS can be found in [51–53]. The
    schematic illustration of the ANFIS-PLS is given in Fig. 4.4. ANFIS is implemented
    to model the inner relation between each pair of the input and output LVs,


    ```

    U = f(T, Θ) + e, (4.8)

    ```


    where Θ represents the parameters of the model, and E the residual vector. Indeed,
    after getting the LVs (i.e., T_i and U_i) from the outer model, they will be used
    to train and estimate the ANFIS parameters.


