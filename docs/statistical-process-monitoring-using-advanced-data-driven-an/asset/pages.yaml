    \(T_1^2 = \left( \frac{x_{i,1} - \bar{x}_1}{s_1} \right)^2, \quad (3.4)\)


    where \(x_{i,1}\) is the first variable in the observation vector of \(\mathbf{x}_i\),
    and \(\bar{x}_1\) and \(s_1\) are the mean and standard deviation of the first
    variable, respectively. Then, the additional terms can be written in general as


    \(T_{j, 1, \dots, j-1}^2 = \left( \frac{x_{i, j} - \bar{x}_{j, 1, \dots, j-1}}{s_{j,
    1, \dots, j-1}} \right)^2, \quad (3.5)\)


    where


    \(\bar{x}_{j, 1, \dots, j-1} = \bar{x}_j + \mathbf{b}''_j \left( \mathbf{x}_i^{(j-1)}
    - \bar{\mathbf{x}}^{(j-1)} \right),\)


    with \(\bar{x}\) being the sample mean of \(n\) observations of the \(j\)th variable,
    and \(\mathbf{b}_j\) a \((j-1)\)-dimensional vector estimating the regression
    coefficients of the \(j\)th variable regressed on the prior \(j-1\) variables.
    Furthermore, \(\mathbf{x}_i^{(j-1)}\) is a \((j-1)\)-dimensional vector that excludes
    the \(j, \dots, p\) variables, and \(\bar{\mathbf{x}}^{(j-1)}\) is the sample
    mean of \(n\) observations of the first \(j-1\) variables.


    Because the order of the \(p\) variables is not unique, there exist \(p!\) possible
    orderings of the variables in Eq. (3.3), each with its own distinct partition.
    Thus, as \(p\) gets large, the number of partitions to examine becomes prohibitively
    large. Mason et al. [26] do note that the terms of greatest interest tend to be
    the terms of the unadjusted contribution of a single variable and the term containing
    the adjusted contribution of one of the variables after adjusting for the other
    \(p-1\) variables.


    When an observation''s \(T^2\) value exceeds the UCL, the following steps can
    be followed to isolate the shifted variables, as described by [25]:


    +   1. Compute the individual \(T_j^2\) statistic for each variable, as in Eq.
    (3.4).

    +      a. Classify variables whose \(T_j^2\) exceed the UCL as shifted.

    +      b. Remove shifted variables from the observation.

    +      c. Recompute \(T^2\) with \(k \le p\), and test it for significance. If
    it is still significant, proceed to the next step.


    +   2. Compute all \(T_{j, j''}^2\) terms for the remaining \(k\) variables, as
    in Eq. (3.5).

    +      a. If \(T_{j, j''}^2\) is high, then this indicates that the pairwise relationship
    between variables \(j\) and \(j''\) is unusual.

    +      b. Remove the pairs of variables with a significant \(T_{j, j''}^2\), leaving
    \(k''\) variables.

    +      c. Recompute \(T^2\) with \(k'' \le k\), and test for significance. If
    it is still significant, proceed to the next step.


    +   3. Repeat the prior step for higher-order terms, beginning with three-way
    terms, until either no variables are left in the reduced set or \(T^2\) based
    on the reduced set of variables is no longer significant.'
