    signs) systems, and to build intelligent roads equipped with sensors. This is
    intended to considerably reduce the risk of accidents and financial burden and
    improve human safety [4–10]. Obstacle detection and localization are the main
    challenges that must be overcome in designs for driving assistance systems (DASs).
    Over the last two decades, researchers and practitioners have made efforts to
    develop real-time obstacle detection techniques for autonomous vehicles. Currently,
    most automated decision-making systems that have been deployed are based on advanced
