  md: '![](img/aa2f42c739937b682075082233e335bb_208_0.png)


    # 6.2.3.1 Mean shift clustering


    Mean shift clustering is a nonparametric recursive hierarchy-based method. It
    is designed based on the concept of kernel density estimation (KDE). This scheme
    does not need a prefixed number of clusters. Essentially, the modes of a density
    estimate are used as indicators for the densest regions of the data, and these
    modes could be suitable cluster center estimates. The main idea of mean shift
    clustering is to shift all points belonging to the same region to the mean or
    the center of the area, and to repeat this task till convergence (Fig. 6.3). In
    KDE, the mean shift clustering is performed via a simple gradient procedure to
    estimate the modes of the KDE. There are different kernels to use in the mean
    shift clustering procedure, including Gaussian, exponential, Tophat, and Epanechnikov.
    Essentially, in the mean shift clustering, the kernel bandwidth plays a significant
    role in the clustering result. Indeed, if a large bandwidth is selected, then
    fewer clusters will be formed in the mean shift clustering, and vice versa. Accordingly,
    the bandwidth selection is a crucial step in the mean shift clustering procedure
    because it has a direct impact on the quality of the density estimation, and thus
    heavily impacts mean shift clustering. Specifically, selecting a poor bandwidth
    estimate leads to modes that do not appropriately represent the dense regions
    of the data. Various schemes have been designed to address the problem of bandwidth
    selection [36,39,40]. For more information about shift mean procedure, we refer
    to [37,38].


    The main steps needed for implementing mean shift clustering are the following:


    +   1. Define a window (i.e., bandwidth of the kernel) and place it on a data
    points

    +   2. Calculate the mean of all observations within the window

    +   3. Move the center of the window to the position of the mean

    +   4. Iterate steps 2 and 3 until convergence'
