    At the end of the cycle, the \( H_t \) hidden layer units which represent the
    output of the cycle and the \( C_t \) memory state are ready for the next cycle
    usage. In summary, in the LSTM model, the three gates are trained for learning
    what information can be maintained in the memory, how long it can be stored, and
    when it can be read out. Combining several memory cells into blocks permits them
    to share the same gates, and hence the number of adaptive parameters is reduced.


    # 7.2.3 Gated recurrent neural networks


    In this section we present another extended version of RNN, called a gated recurrent
    unit (GRU), which was primarily introduced by Cho et al. [9]. GRU can be considered
    as a reduced version of LSTM. It is also designed to alleviate the vanishing gradient
    problem, which is the main weakness of the standard RNN. GRU is built without
    a cell state and comprises only two gates instead of three, as in LSTM [9]. GRU
    models have demonstrated their efficiency during the last decade in several applications
    involving sequential or temporal data [11, 10, 12, 13]. Their successful application
    comes from their ability to model complex nonlinearity between data points and
    extract relevant features from time series data.


    In comparison with LSTM, GRU comprises two gates instead of three, i.e., update
    and forget (also called reset). Indeed, the update gate in GRU can be viewed as
    a combination of the forgetting gate and input gate in LSTM (Fig. 7.10). These
    two gates consist of a sigmoid layer and a pointwise multiplication operation
    represented by two vectors, resulting in values within the interval [0, 1]. Similar
    to LSTM, the impact of the previous historical information on the actual cycle
    is controlled by these gates. When the output of the reset gate is zero, the memory
    information is ignored; otherwise it will influence the evolution of the final
    response.


    ![](img/aa2f42c739937b682075082233e335bb_242_0.png)


    FIGURE 7.10 Gated recurrent unit.'
