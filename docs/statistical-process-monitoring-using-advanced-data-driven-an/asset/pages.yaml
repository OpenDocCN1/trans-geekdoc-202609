  md: 'such as DBN, RBM and DSA, were presented. To bypass the shortcoming of binary
    clustering methods when applied to high-dimensional data, we briefly presented
    hybrid methods that combine the benefits of deep learning models with the clustering
    approaches to reveal faults in monitored processes. Essentially, extracting relevant
    and compact information from large datasets using deep learning models improves
    the detection and discrimination capacity of binary clustering methods.


    Note that the above discussed deep learning models have been created using a single
    scale (i.e., time scale) as they relate process variables only at the scale of
    the sampling interval. This single-scale feature extraction is suitable for the
    data including contributions at one scale only. However, data from engineering
    and environmental processes are multiscale in nature. This is mainly because events
    can occur with different localization in time and frequency, and process variables
    can be gathered at different sampling rates or include missing values. Wavelet-based
    multiresolution is a powerful tool for the multiscale representation of data.
    Thus, in the future, an interesting research direction would be to develop multiscale
    deep-learning models and use them to further improve anomaly detection in complex
    processes.


