  md: 'Generally speaking, the forget or reset gate determines how to merge the new
    input with the previous memory [10]. In other words, this gate is employed to
    decide the amount of historical information to quash:


    ```

    r_t = \sigma(x_t U^r + h_{t-1} W^r). (7.9)

    ```


    On the other hand, the update gate, which is acting similarly to the forget and
    input gate of an LSTM, decides how much of the previous memory to keep and what
    new information to add:


    ```

    z_t = \sigma(x_t U^z + h_{t-1} W^z). (7.10)

    ```


    The new hidden state output at the current time point merges current and previous
    time points and can be computed as


    ```

    h_t = (1 - z_t) \cdot h_{t-1} + z_t \cdot \tilde{h}_t. (7.11)

    ```


    We can see that the complement of gate-update is utilized to decide the information
    to maintain from the h_{t-1} rather than creating a new gate for this purpose.
    The new candidate, \tilde{h}_t, for hidden layer output is computed as


    ```

    \tilde{h}_t = \tanh(x_t U^h + (r_t \cdot h_{t-1}) W^h). (7.12)

    ```


    Here, r_t is used to manage what part of h_{t-1} is needed to incorporate when
    computing a new candidate. Table 7.1 summarizes the main features of LSTM and
    GRU models.


    | LSTM | GRU |

    |---|---|

    | Three gates | Two gates |

    | Control the exposure of memory content (cell state) | Expose the entire cell
    state to other units in the network |

    | Has separate input and forget gates | Performs both of these operations together
    via update gate |

    | More parameters | Fewer parameters |


