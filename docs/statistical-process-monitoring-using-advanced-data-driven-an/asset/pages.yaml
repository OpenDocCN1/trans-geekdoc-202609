  md: 'To conclude this subsection, we note that utilizing the conventional multivariate
    monitoring schemes (i.e., multivariate Shewhart, MCUSUM, and MEWMA) for inspecting
    high-dimensional processes with collinearities may be ineffective.


    # 2.5 Linear LVR-based process monitoring strategies


    First, let us outline the reason why multivariate monitoring schemes including
    multivariate Shewhart, MCUSUM, and MEWMA schemes are not frequently used alone
    in applications with numerous correlated process variables. From the previous
    section, we note that the design of the decision statistics of these three multivariate
    schemes requires the calculation of the inverse covariance matrix. However, since
    collected multivariate data from engineering and environmental processes are correlated,
    the matrix inversion of the covariance matrix can frequently generate poor numerical
    results because of the ill-conditioning problem. Accordingly, it becomes obvious
    and particularly relevant to use projection-based monitoring methods, such as
    PCA and PLS, when the covariance matrix is ill-conditioned. As described in Sect.
    2.2.3, LVR models are well suited for multivariate monitoring as they mitigate
    the problem of ill-conditioning in other multivariate schemes including multivariate
    Shewhart chart, MCUSUM, and MEWMA schemes. For instance, to avoid the ill-conditioning
    problem, projection-based methods such as PCA can be used to decompose the covariance
    matrix of the raw data and generate transformed variables having better numerical
    characteristics that enable process monitoring via the conventional multivariate
    schemes (e.g., MEWMA and MCUSUM). In this section, the general framework combining
    the LVR models and univariate or multivariate monitoring techniques is described.


    # 2.5.1 Conventional LVR monitoring statistics


    The general framework of the data-based monitoring approaches such as input-space
    models (e.g., PCA) and input–output models (e.g., PLS) consists of two phases:
    (i) model construction and (ii) online monitoring as indicated in Fig. 2.7. The
    first phase focuses on designing a reference model based on data gathered from
    the inspected process when running within nominal conditions. Then the decision
    thresholds of the monitoring scheme are computed (e.g., T² or another chart).
    Generally, thresholds are defined in the subspace of the retained PCs or the subspace
    of the residuals. These two subspaces usually serve as a monitoring subspaces
