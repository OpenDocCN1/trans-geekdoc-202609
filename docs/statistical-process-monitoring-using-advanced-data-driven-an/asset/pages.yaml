  md: 'However, when several process variables are inspected based on a single multivariate
    scheme, the overall rate of false alarms will remain at 0.27%.


    Overall, the multivariate monitoring schemes that are constructed in the multivariate
    framework enable more effective fault detection than a joint monitoring scheme
    involving multiple univariate monitoring schemes (for details see [109, 59]).


    # 2.4.3 Multivariate process monitoring schemes with parametric and nonparametric
    thresholds


    To supervise multiple variables simultaneously, multivariate statistical monitoring
    schemes such as multivariate Shewhart, multivariate EWMA (MEWMA) and multivariate
    CUSUM (MCUSUM) have been designed as multivariate counterparts of their univariate
    schemes. In this section, the objectives of each monitoring schemes (i.e., multivariate
    Shewhart, MCUSUM, and MEWMA) and comment on their benefits and limitations are
    outlined.


    # 2.4.3.1 Multivariate Shewhart schemes


    The multivariate counterpart of the Shewhart monitoring scheme is one of the most
    popular multivariate monitoring techniques to inspect the mean shift of a normally
    distributed process. Suppose that we inspect a multivariate process \(\mathbf{X}_t
    = (X_1, X_2, ..., X_p)^T\), where \(X_i \in \mathbb{R}^m\), and the collected
    data are normally distributed with mean \(\mu\) and covariance matrix \(\Sigma\).
    A multivariate Shewhart scheme, also known as a \(T^2\) or as a \(\chi^2\) scheme
    [110], to monitor the process mean in multivariate data is based on the following
    monitoring statistic:


    \(T_t^2 = [(\mathbf{x}_t - \mu)^T \Sigma^{-1} (\mathbf{x}_t - \mu)]\) (2.58)


    where \(\mathbf{x}\) is a vector of \(p\) variables, and \(\mu\) is a vector of
    fault-free means of every variable. The decision threshold of this monitoring
    scheme, which is derived using fault-free data, is \(H = \chi^2_{\alpha,m}\).
    For new test measurements, the \(T^2\) scheme flags an anomaly if the value of
    \(T^2\) surpasses a threshold value, \(\chi^2_{\alpha,m}\) [25]. Since this scheme
    uses only the current observation and ignores all past data, it shows poor detection
    performance in the presence of small changes. Note that this scheme is designed
    under the assumptions of uncorrelated and multivariate Gaussian distributed measurements.


    # 2.4.3.2 Multivariate cumulative sum scheme (MCUSUM)


    As a remedy to the insensitivity of the Shewhart scheme to small changes, MCUSUM
    and MEWMA monitoring schemes have been designed [109]. The essence of the MCUSUM
    approach is to exploit information of all available data by computing the cumulative
    sum of the differences of each previously observed vector compared to the nominal
    value for monitoring the means of the'
