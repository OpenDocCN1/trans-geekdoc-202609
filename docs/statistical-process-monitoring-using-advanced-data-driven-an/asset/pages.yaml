    forward selection process, an additional shift at time step \(i=2, \dots, n-1\)
    is added to the model. This time step is chosen as that with the minimum residual
    sum of squares conditional on the previously identified \(k-1\) shifts, namely
    \(\sum_{i=1}^n ||\mathbf{u}_i - \hat{\mathbf{u}}_i^{(k)}||^2\), where \(\hat{\mathbf{u}}_i^{(k)}\)
    comes from a model fitted with a potentially different mean vector at each time
    point. Shifts within \(l_{\min}\) time steps of the \(k-1\) shifts already present
    are not considered. After each step, the explained variance is computed as


    ```

    \(T_k = \sum_{i=1}^n ||\hat{\mathbf{u}}_i^{(k)}||^2 - n||\bar{\mathbf{u}}||^2,\)

    ```


    where \(\bar{\mathbf{u}}\) is the overall mean of the signed ranks.


    +   3. Testing. Then, \(T_k, k=1, \dots, K\), test statistics are aggregated to
    form a single test statistic as follows:


    ```

    \(W_{\text{OBS}} = \max_{k=1, \dots, K} \frac{T_k - \text{E}_0(T_k)}{\sqrt{\text{Var}_0(T_k)}}.\)

    ```


