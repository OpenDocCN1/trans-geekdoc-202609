- pgno: 202
  md: '# # Unsupervised deep learning-based process monitoring methods


    # ## 6.1 Introduction


    Effective detection of anomalies in highly complex processes is indispensable
    for managing them efficiently, safely, and in a productive fashion. Essentially,
    early detection of anomalies is required to keep the desired performance of the
    monitored processes and avoid the progression of anomaly impacts that may cause
    a significant loss in process profitability. As major advancements are being made
    in areas, such as data acquisition, sensor technologies and the Internet-of-Things,
    high-dimensional data from monitored processes are generated. These available
    data should be exploited to timely detect typical behaviors that can be caused
    by either faulty sensors or process faults. Recently, machine learning and deep
    learning models have become a hotspot of recent research to better represent the
    data distribution features. Here, we review some of the unsupervised anomaly-detection
    methods based on binary clustering algorithms and unsupervised deep-learning models.


    The main challenge for unsupervised anomaly detection methods is that the anomaly
    detection methods should be constructed using unlabeled training data. In supervised
    learning, models are trained with labeled data, and when a new observation is
    present, the trained model assigns it to one of the preestablished classes. All
    over the years, numerous classification methods have been developed for fault
    classification, including support vector machine (SVM), neural networks (NN),
    and _k_-nearest neighbor (_k_NN). Nevertheless, if unknown faults had occurred
    and been incorporated in the data, the majority of the supervised classification
    models can be unsuccessful in detecting them. In other words, these methods require
    periodic training to preserve high detection performance. However, getting labeled
    data is extremely challenging and time-consuming, in particular for high-dimensional
    datasets; moreover, this cannot be performed in real-time. In other words, getting
    a large labeled dataset is generally a lot of work, and is very time-intensive.
    Furthermore, even with labeled data, we cannot guarantee that they contain all
    possible anomalies. All these challenges suggest that a reasonable solution is
    to use unsupervised monitoring techniques.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'To alleviate this difficulty, unsupervised anomaly detection techniques based
    on binary clustering methods play a significant role in anomaly detection without
    considering prior data labeling. The essence of clustering schemes for anomaly
    detection is to determine clusters characterizing normal behavior based on the
    anomaly-free data and then verify whether new unlabeled observations are within
    identified clusters or not. Observations that are not attributed to previosuly
    defined clusters are flagged out as anomalies. Essentially, the aim is to separate
    the given data into clusters that have high internal similarity and external dissimilarity,
    in the absence of prior knowledge. Several clustering techniques have been developed
    in the literature including algorithms based on density (e.g., mean-shift and
    DBSCAN), algorithms based on partitions (e.g., k-means and k-medoids) and algorithms
    based on hierarchy (e.g., BIRCH and agglomerative). Alternatively, there are two
    commonly used unsupervised machine learning algorithms for anomaly detection,
    namely one-class SVM and support vector data description (SVDD) [1–3]. These unsupervised
    methods use kernel functions for implicitly mapping the input data to higher-dimensional
    feature space to clearly separate normal from abnormal data. Of course, the main
    appeal of unsupervised anomaly detection methods has been their capability to
    detect unknown anomalies without any prior knowledge or data labeling.


    Practically, detecting anomalies in high-dimensional data using the above-mentioned
    methods is very challenging and time-intensive. In fact, high process variables
    lead in the course of dimensionality phenomenon that conducts to the generalization
    error of shallow methods, which grows with the number of irrelevant and redundant
    input variables [4–6]. For instance, SVMs are nonparametric algorithms, whose
    complexity increases quadratically with the number of observations [7]. In addition,
    shallow methods are limited to appropriately represent some types of function
    families [8].


    An alternative solution to avoid the limitations of the above-mentioned shallow
    methods to detect anomaly in high-dimensional data is to use a model that can
    describe the variability in the underlying data. Accordingly, a compacted representation
    of data can be used to bypass the problem of high-dimensionality and decrease
    the high-computationally cost and complexity in the implementation [8,9]. In other
    words, feature extraction is an essential step in unsupervised anomaly detection,
    in which data are summarized by a set of characteristics (called features) that
    are the most informative and less redundant. Various data representation methods
    have been developed to reduce data dimensionality and extract relevant features
    including principal component analysis (PCA) as an unsupervised approach, and
    partial least squares as a supervised approach. On the other hand, other methods
    use nonlinear dimensionality reduction to uncover the relevant information hidden
    in the high-dimensional data, such as kernel PCA [10] and locally linear embedding
    [11]. However, these learning methods, either linear or nonlinear, fall within
    a shallow learning framework that mainly depends on the features employed for
    building the prediction model.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Recently, much interest has been spurred on deep learning methods due to their
    great learning capability, in particular for large datasets. An additional appeal
    of deep learning methods is their strong flexibility and assumption-free nature.
    Unlike the shallow methods, deep learning-based methods can usually achieve improved
    abstractions of the input data [12]. In other words, deep learners possess great
    potential for extracting relevant features from the raw data to design improved
    models. Unsupervised deep-learning models, such as deep belief networks (DBNs),
    deep Boltzmann machine (DBM), and deep stacked autoencoder (DSA), discover features
    from one layer at a given time based on unlabeled data. The learned features are
    used to train the next layer, and so on. In [13], a hybrid stereovision approach
    combining deep Boltzmann machines (DBM) and the ability of autoencoders (AE) to
    reduce the dimensionality of data is designed to uncover obstacles in a road environment.
    The aim of this hybrid model is to extract relevant features with less redundancy
    that will be used as input by OCSVM for obstacle detection.


    As previously mentioned, there is a very challenging problem when using the shallow
    unsupervised methods to detect anomalies in complex and high-dimensional datasets.
    To alleviate this problem, deep learners can be used as feature extractors; unsupervised
    shallow algorithms, such as kNN and one-class SVMs, are then applied to these
    reduced features for anomaly detection purposes. A variety of hybrid methods have
    been developed [13] by merging the benefits of deep-feature extractors and clustering
    and unsupervised machine learning algorithms for improving the performance of
    anomaly detection in high-dimensional datasets. For instance, the method in [14]
    uses a deep-stacked autoencoder as a feature extraction phase for the k-nearest
    neighbor algorithm to give a hybrid anomaly detection. This stereovision-based
    method has been applied to detect obstacles in the road environment and showed
    better performance in comparison to standalone clustering methods. In [13], a
    hybrid unsupervised method is used merging the benefits of the DBM with the dimensionality
    reduction capability of the AE for stereovision-based obstacle detection in an
    urban environment. The aim of this hybrid model is to extract relevant features
    with less redundancy that are used by OCSVM for obstacle detection.


    First, we present a few binary clustering algorithms, and then briefly describe
    two common unsupervised anomaly detection schemes, namely one-class SVM and support
    vector data description (SVDD). Then, we present several deep-learning models
    with a focus on models based on autoencoders, and probabilistic models and introduce
    a hybrid framework merging the deep learning models and clustering algorithms
    for improving anomaly detection in high-dimensional complex processes. Lastly,
    we conclude with remarks and a perspective on future research.


    # 6.2 Clustering


    The essence of clustering is to find groups of data such that data points from
    the same group (cluster) are relatively more similar to each other than those
    in'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'other clusters. Clustering algorithms have been largely exploited in data analysis.
    Conventional clustering techniques can be classified into different categories
    of clustering algorithms including partition-based, density-based and hierarchy-based
    clustering. In this section, we briefly present the basic idea of common clustering.


    # 6.2.1 Partition-based clustering techniques


    The essence of the clustering techniques based on the partition concept consists
    of considering the center of data as the center of the correspondent cluster.
    The two commonly used partition-based clustering techniques are k-means [15] and
    k-medoids [16]. Generally speaking, in the k-means algorithm, the center of the
    cluster is updated iteratively in such a that a selected criterion for convergence
    is met. To handle discrete data, k-medoids has been developed as an enhancement
    of k-means. Various partition-based clustering algorithms have been developed,
    including partitioning around medoids (PAM) [17], clustering for large applications
    (CLARA) [17], and clustering large applications based on randomized search (CLARANS)
    [18]. More details about partition-based clustering can be found in [19–21].


    # 6.2.1.1 k-Means clustering


    The k-means procedure is an iterative, data-partitioning algorithm that aims to
    attribute n observations to one cluster of the k clusters characterized by centroids
    [22]. The number of clusters k is a priori selected in such a way that every cluster
    has its own centroid. Each observation is attributed to the cluster with the closest
    centroid, and each cluster updates its own centroid according to new included
    observations. The assignments and updates are repeated until stabilization of
    structure where no centroid updates are possible (Fig. 6.1). The principal steps
    of the algorithm are as follows:


    +   1. Take k observations randomly as centroids (cluster centers)

    +   2. Attribute each observation to the nearest cluster by computing its distance
    to each centroid

    +   3. Find a new cluster center by computing the average of the observations
    including the assigned points

    +   4. Iterate steps 2 and 3 until the assignment of clusters is not changing
    any more


