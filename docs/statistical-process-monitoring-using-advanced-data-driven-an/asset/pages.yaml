- pgno: 110
  md: '# 3.3 Fault classification


    As mentioned in the introduction, a different data structure of interest is when
    data streams from multiple copies of the same fault in the same system have been
    recorded and labeled. This produces a catalogue of data produced from historical
    faults. In new or unstudied systems, such a catalogue is unlikely to exist, but
    oftentimes, in processes that are very well-studied, a catalogue is available.
    Then, the goal is to take a new set of faulty observations and determine to which
    historical fault the new fault is most similar. This is the well-known classification
    problem.


    These methods are often only applied to a single set of data and are not conducive
    to repeated simulation studies and their corresponding metrics, such as those
    discussed in Sect. 3.4. The most commonly used dataset to illustrate the performance
    of these methods is the Tennessee Eastman (TE) chemical engineering process, and
    every work mentioned in this section uses data generated from the TE simulation
    model [77]. With well over 2,000 citations, this model simulates a large set of
    variables (over 50) that are nonlinearly related and change dynamically over time.
    Some variables are controlled to meet predetermined thresholds. MATLAB® code is
    available to simulate data under various control strategies and with many different
    types of faults [78].


    A multiclass support vector machine (SVM) is used in [79] to determine to which
    among a catalogue of historical faults the present set of observations is the
    closest. The dimension of the data is first reduced with PCA, and parameters in
    the SVM are optimized using a grid search. Zhang et al. [80] use kernel entropy
    component analysis (KECA) with one KECA classifier trained for each type of fault.
    The authors also seek to accommodate multiscale properties, so they implement
    a multiscale PCA as well. Ragab et al. [81] use Logical Analysis of Data (LAD)
    to classify faults, comparing their results to many other machine learning methods,
    such as ANN, decision trees, random forests, k nearest neighbors, quadratic discriminant
    analysis, and SVM,


    Reducing the dimensionality of variables input into classification methods has
    been shown to reduce errors here as well [20,79]. De Assis Boldt et al. [20] test
    several cascade feature selection methods to reduce the input features, and then
    they apply the Extreme Learning Machine (ELM), which is a feedforward NN with
    a single hidden layer and a linear activation function at the output. Zhao et
    al. [82] uses a type of recurrent NN, specifically a long short-term memory (LSTM)
    neural network, that will directly process the raw data without needing to perform
    feature extraction and classifier design. This model can also account for autocorrelation
    in the observations. Penalized regression is used in [58] showing that discriminant
    analysis is equivalent to penalized regression.


    While classification of the faults tends to be the focus of these methods, isolating
    variables is often done as a byproduct of fault identification. Some examples
    are in [83], where Chiang et al. use genetic algorithms combined with Fisher discriminant
    analysis to isolate variables, and de Assis Boldt et al. [20] identify variables
    that are frequently selected in their feature selection step.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 3.4 Fault isolation metrics


    The metrics used to assess the performance of fault detection methods are standardized
    and well-known. For example, there are several variations of Average Run Length
    (ARL) that measure the average time that a method requires before signaling a
    fault when a process is OC. Metrics for IC processes and both Phase I and Phase
    II settings also exist. Metrics for assessing fault isolation (FI) methods are
    not as standardized. FI is a multivariate binary classification problem, aiming
    to correctly classify variables as shifted or unshifted for a fault occurring
    at a particular time point. We let P be the set of all variables; S be the set
    of shifted variables; and U be the set of unshifted variables. We denote t* and
    t̂* as the time steps at which the fault occurs and is detected, respectively.
    Then, Ŝ is the set of variables identified as shifted, and Û is the set of variables
    identified as unshifted at t̂*.


    | | Classified as Shifted | Classified as Unshifted | p |

    |---|---|---|---|

    | Truly Shifted | s+ | s- | |S| |

    | Truly Unshifted | u- | u+ | |U| |

    | p = s- + u | |Ŝ| | |Û| | p+ = s+ + u+ |


    FI metrics can be framed in terms of the overlap between S and Ŝ or between U
    and Û. Table 3.2 summarizes the notation for a specific time step at which the
    fault occurs and is detected. Boxes shaded in blue (mid gray shaded in print version)
    indicate a correctly identified set, and boxes shaded in red (dark gray shaded
    in print version) indicate an incorrectly identified set. The total number of
    variables correctly identified as shifted is denoted s+, and the total number
    of variables incorrectly identified as shifted is denoted u-. Similarly, the total
    number of variables correctly identified as unshifted is denoted u+, and the total
    number of variables incorrectly identified as unshifted is denoted s-. Together,
    s+ + u- = |Ŝ| and s- + u+ = |Û| represent the total number of variables identified
    as shifted and unshifted, respectively. The total number of correctly identified
    variables is p+ = s+ + u+, and the total number of incorrectly identified variables
    is p- = s- + u-.


    The choice of FI metric depends on the number of monitored variables. In the low-dimensional
    setting, it is reasonable to expect every variable to be identified correctly,
    so some metrics only give a method credit if all shifted and unshifted variables
    are correctly identified [1,3,7,16,21,46,84,85]. The correctness rate (CR), or
    simply Correctness, is


    ```

    CR = \frac{1}{B} \sum_{k=1}^B I[\widehat{S}_k = \mathcal{S}] ,

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'where $B$ is the number of simulated datasets; $\widehat{S}_k$ is the set of
    variables identified as shifted for the $k$th dataset; and $I[\cdot]$ is an indicator
    function taking the value one if its argument is true and zero otherwise. In a
    high-dimensional setting, CR may be close to zero because it is difficult to perfectly
    identify all shifted variables.


    Some metrics give “partial credit” to a method when some but not all of the variables
    are correctly classified, which is often necessary when $p$ is large. Often, we
    are interested in the total number of incorrectly identified variables. In this
    case, Zou et al. [3] use the expected number of errors (ENE), which is defined
    as


    $$\text{ENE} = \frac{1}{B} \sum_{k=1}^B p_k^-.$$


    A related metric is the expected error rate ($EER$), which is simply ENE$/p$ [1,
    3, 55, 85].


    # ## 3.4.1 Fault isolation errors


    Typically, it is beneficial to determine *which* type of errors have been made.
    As in FD, there are two types of errors: (1) identifying unshifted variables as
    shifted and (2) failing to identify shifted variables as shifted. First, we present
    a collection of metrics related to the first type of error. The expected number
    of false positives (EFP) is the average number of unshifted variables identified
    as shifted [86], which can be written as


    $$\text{EFP} = \frac{1}{B} \sum_{k=1}^B u_k^-.$$


    In addition to averaging the *number* of unshifted variables identified as shifted,
    Li et al. [86] also report the expected number of false positives as a *proportion*
    of all variables, or EFP$/p$. However, this number may be close to zero if the
    number of shifted variables is small relative to $p$, which can suggest that the
    FI method performs better than it does in reality. A preferable metric is the
    false positive percentage (FP%) [1, 55], which is EFP$/|\mathcal{U}|$. [4] replace
    $\mathcal{U}$ in the denominator with $\mathcal{S}$ and call their metric the
    ratio of correct variable selection (RCVS).


    The second type of error is failing to identify shifted variables as shifted.
    The false negative percentage (FN%) is the proportion of shifted variables classified
    as unshifted [1, 55], represented as


    $$\text{FN\%} = \frac{1}{B} \sum_{k=1}^B \frac{s_k^-}{|\mathcal{S}|}.$$'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'A variant of the FN% is the weighted missed detection rate (wMDR), which also
    takes into account the *cost* of the error associated with misclassifying each
    variable using a severity function [86], given as


    wMDR = \frac{\sum_j I (j \in \mathcal{S} \cap \widehat{\mathcal{U}}) \cdot s_j(\delta_j)}{\sum_j
    I (j \in \mathcal{S}) \cdot s_j(\delta_j)} ,


    where \(s_j(\delta_j)\) is a user-defined severity function of the shift size
    for the \(j\)th variable. The wMDR weights each shifted variable classified as
    unshifted by the severity of the error, where severe errors are weighted more
    heavily than minor errors. Li et al. [86] require that \(s_j(0) = 1\) and that
    \(s_j(\delta_j)\) be a nondecreasing function as \(\delta_j\) moves away from
    zero. The severity function may be set based on knowledge of the system such as
    economical considerations, external covariates, or prior research [87–90]; if
    all variables are equally important or there is no information on the variables
    *a priori*, then the same severity function \(s(\cdot)\) may be used for all variables.
    Setting \(s_j(\delta_j) = 1\) for all \(j\) is equivalent to the FN%.


    # 3.4.2 Precision and recall


    Instead of measuring the frequency of errors, an alternative metric that measures
    the correct identification of shifted variables is \(1 - \text{FN}\%\), which
    we term Recall. This is also referred to as probability of correct identification
    and ratio of correct variable selection [6,81,91,4]. Using \(\widehat{\mathcal{S}}\)
    rather than \(\mathcal{S}\) in the denominator, the Precision is the proportion
    of variables *identified* as shifted that are truly shifted [81,91], or


    \text{Precision} = \frac{1}{B} \sum_{k=1}^B \frac{s_k^+}{|\widehat{\mathcal{S}}|}.


    The harmonic average of the Precision and Recall is termed the \(F_1\)-score [55,
    91], defined as


    \(F_1\text{-score} = 2 \cdot \frac{\text{Precision} \times \text{Recall}}{\text{Precision}
    + \text{Recall}}\).


    # 3.4.3 Phase I FI metrics


    All of the aforementioned metrics are useful when performing FI in Phase II settings,
    but Capizzi and Masarotto [8] propose a Phase I method that simultaneously performs
    FD and FI. Their simulation study introduces multiple faults, some of which involve
    multiple shifted variables. They consider the average number of exact and approximate
    detections, where each shifted variable at each time step at which a shift occurs
    is considered to be a separate detection. An *exact* detection is correctly identifying
    a shifted variable at exactly the true time step of the fault, while an *approximate*
    detection is identifying a shifted variable'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'as shifted within a certain window of the true time step of the fault. For
    both of these metrics, the closer the value to the true number of detections in
    the data set, the better the performance of the method. While the focus of [8]
    is FD&I, these two metrics focus on detection ability of their method.


    The detection accuracy and isolation rate (DAIR) proposed by [42] incorporates
    the accuracy of FD into an FI metric. The DAIR is defined as


    \(\text{DAIR} = \frac{1}{B} \sum_{k=1}^B K_\eta(t^*, \hat{t}_k^*) \left( \frac{p_k^+}{p}
    \right),\)


    which has two components: (1) the detection accuracy, which penalizes a method
    as \(\hat{t}^*\) gets farther from \(t^*\) using a kernel function \(K_\eta(t^*,
    \hat{t}^*)\), and (2) the isolation rate, which measures the proportion of correctly
    classified variables, or \(p_k^+ / p\). A simple kernel function is the rectangular
    kernel function, or


    \(K_\eta(t^*, \hat{t}^*) = \begin{cases} 1, & |t^* - \hat{t}^*| < \eta, \\ 0,
    & |t^* - \hat{t}^*| \ge \eta, \end{cases}\)


    which gives a method “full credit” if the fault is detected within \(\eta\) time
    steps of the true fault and “no credit” otherwise. Therefore, if the fault is
    detected more than \(\eta\) time steps from the true fault location, then DAIR
    will be zero even if all variables are correctly classified as shifted or unshifted.
    This metric assesses a method’s ability to both detect the fault within the correct
    timeframe and to isolate the correct variables.


    # 3.4.4 Discussion


    It is important to choose metrics that accurately reflect a method’s performance
    and that are based on knowledge of a system, including the number of variables
    being monitored and the economic costs of errors in FI. Poorly chosen metrics
    may provide an incomplete picture of a method’s performance. For example, a large
    ENE does not reveal whether false negatives or false positives are more prevalent;
    a small FP% is incomplete without knowledge of a method’s FN%; and even a small
    FN% is misleading if a shifted variable that the method failed to identify as
    shifted could cause catastrophic damage to a system or result in hefty fines and
    lost revenue. Careful consideration should be given so that sufficient insight
    is provided by the chosen metrics in a simulation study or case study.


    # 3.5 Case studies


    As the demand for water resources grows, a new paradigm of decentralized, potable
    reuse focuses on treating and reusing water at smaller, satellite facilities that
    collect water close to the source where it is produced. The historical solution
    has been to expand and upgrade existing, aging centralized treatment systems'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'that collect water and wastewater from an extensive geographic region, which
    requires costly maintenance and pumping. Furthermore, centralized facilities simply
    release treated wastewater back into the environment, but decentralized facilities
    can reuse the water locally for a variety of reuse applications, such as irrigation
    or drinking. However, decentralized facilities experience higher variability in
    the quality and quantity of the influent, and it is not cost-effective to have
    an operator on-site full-time to monitor and maintain the system. Moreover, there
    are inherent risks in advanced wastewater treatment for potable reuse, including
    a potential release of contaminants into water supplies, making precise and robust
    process monitoring imperative to protect human health, the environment, and the
    facility. Such processes have rarely been a focus of FD&I methods; instead, most
    such studies are concerned with full-scale wastewater treatment facilities with
    only a few monitored variables or data from simulation models [11,12,92,93].


    ![](img/aa2f42c739937b682075082233e335bb_115_0.png)


    FIGURE 3.8 A schematic of the SBR-MBR operating at Mines Park. Single and triple
    sensor dots indicate that single and multiple features, respectively, are being
    recorded at that point in the process. Features such as dissolved oxygen, pressure,
    flow, volume, total suspended solids, conductivity, and turbidity are automatically
    sensed every minute.


    The Mines Park Water Reclamation Test Site (Mines Park) located in Golden, CO
    treats approximately 7,000 gallons of municipal wastewater per day using a combination
    of physical, chemical, and biological processes. Continuously operating for the
