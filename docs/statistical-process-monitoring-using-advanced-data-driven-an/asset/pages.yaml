  md: 'data. Therefore, the selection of an appropriate threshold represents a core
    step for efficient denoising. Various thresholds have been developed in the literature
    including universal threshold, soft and hard thresholding, and adaptive thresholding
    rules [64,65]. There are many methods available in the literature for this purpose
    [65]. Generally speaking, in hard thresholding, the values of the coefficients
    exceeding the threshold are kept, whereas in soft thresholding they are set to
    zero. It should be noted that hard thresholding can lead to a larger variance
    in the reconstructed signal, with infrequent artifacts. However, they are suitable
    for representing discontinuities and peaks. On the other hand, soft thresholding,
    which results in a larger bias, provides an adequate visual quality of denoising.
    Bruce and Gao [66] introduced a threshold to get a compromise between variance
    and bias, using two threshold values and requiring more computation. Practically,
    the universal threshold is mainly based on the input measurements through the
    $\sigma_j$ estimate. Indeed, for large samples, this threshold is efficient to
    reduce noise; however, it can remove a portion of the underlying deterministic
    signal. To bypass this limitation, Donoho and Johnstone [65] proposed keeping
    coefficients of the first $j_0$ coarse scales irrespective of whether they exceed
    the decision threshold or not. However, the selection of $j_0$ impacts the MSE,
    and the selection should be based on the smoothness of the underlying data [58,67-69].


    The Visushrink method can be used to get better quality of the denoised signal
    [65],


    ```

    $t_j = \sigma_j \sqrt{2 \log n},$ (5.7)

    ```


    where $\sigma_j$ represents the standard deviation the errors at scale $j$ and
    $n$ is the length of the signal. Usually, the value of $\sigma_j$ is estimated
    based on the wavelet coefficients at that level based on the following formula:


    ```

    $\sigma_j = \frac{1}{0.6745} \text{median} \{ |d_{jk}| \}.$ (5.8)

    ```


    Numerous methods were introduced to find the value of the threshold and can be
    found in [70].


    # 5.3.3 Advantages of multiscale denoising


    The single scale denoising techniques are highly ranked due to their use and are
    simple in computation methods. Once proper tuning of the single scale filtering
    method has been achieved, it can then be used to identify the small shift in the
    mean. Thus, they are widely applied in statistical monitoring systems. The main
    drawback of single-scale filter parameters is their deficiency to adapt to the
    nature of the signal. If the signal contains features at a multiscale level, single-scale
    filters are strained for a trade-off of the extent of error removal with the quality
    of the maintained local features. Furthermore, if the signal errors are nonstationary
    or time-varying, single-scale rectification methods then fail'
