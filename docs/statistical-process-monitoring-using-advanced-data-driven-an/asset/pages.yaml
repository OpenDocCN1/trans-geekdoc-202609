    to the detection threshold for anomaly detection. Other approaches, to setup the
    kNN detection threshold, apply monitoring charts, such as EWMA and Shewhart, to
    the kNN distances [44]. In particular, the detection performance can be improved
    when using kNN with EWMA because it considers information from past and actual
    data in the decision process.


    # 6.2.4 Expectation maximization


    Expectation maximization (EM) scheme tries to approximate the input data distributions
    for solving the problem of maximum likelihood estimation for data in which some
    variables cannot be explicitly observed, called latent variables that can be inferred
    from the values of the other observed variables [45]. The main objective of EM
    clustering is to approximate the observed data distributions based on mixtures
    of different distributions in different clusters (see Fig. 6.5). Suppose that
    we have a data matrix X, the aim is to find the value of \(\Phi\) maximizing the
    log-likelihood, \(\mathcal{L}(\Phi) = \log P(x|\Phi)\). Using latent variables
    \(\mathbf{Z}\),


