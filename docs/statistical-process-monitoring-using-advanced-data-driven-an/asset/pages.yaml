- pgno: 165
  md: '# Multiscale latent variable regression-based process monitoring methods


    # 5.1 Introduction


    Accurate and flexible modeling of process variables based on implicit or explicit
    models is necessary for improving system performance monitoring and process control.
    In other words, the prediction accuracy of the designed model to mimic the nominal
    conditions of the inspected process or plant has a direct effect on the performance
    of fault detection and diagnosis. In various practical processes (including environmental,
    biological, and hydrological), data are collinear (or contain redundancy among
    the variables), tainted with noise, and nonstationary. However, data generated
    from multivariate processes are statistically challenging because they are highly
    dimensional, the relationships among variables are nonlinear, the variables themselves
    are non-Gaussian, and the processes change over time. Moreover, various types
    of fault can occur. Thus, the timely detection of abnormal conditions of complex
    systems using conventional monitoring methods can be challenging and ineffective.


    Fault detection is of great significance for operators to detect abnormal conditions
    timely, and to take effective measures to avoid adverse consequences. In general,
    the two essential assumptions underlying the design of most conventional process
    monitoring methods are that the process data need to be both independent and identically
    normally distributed. However, data collected from modern industrial processes
    often are autocorrelated and/or nonnormally distributed. The violation of these
    major assumptions can seriously affect the monitoring performance of these conventional
    charts. Due to its core role in industrial processes, fault detection is extensively
    studied in academia and industry. Various studies reported in the literature have
    focused on monitoring charts for monitoring processes with time-dependent data
    [1–5]. There are two main techniques used to monitor processes with autocorrelated
    data: residuals-based and adapting model-based methods [4,6]. Residuals-based
    methods to monitor processes with autocorrelated data are the pioneer in the fault-detection
    field, with a lot of impressive results reported in the literature. The basic
    idea behind'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'these approaches is to describe the autocorrelation in the data, using a mathematical
    model, and to then apply traditional control charts, using computed uncorrelated
    residuals obtained from the constructed model. The performance of residual-based
    monitoring charts, however, is very sensitive to the prediction quality of the
    model [4,7]. Other techniques monitor the autocorrelated data by adapting the
    model to each sampling time [4,6]. Nevertheless, due to the high complexity of
    the modern industry, designing an accurate model is not always an easy task [8].
    In reality, various chemical, environmental, and biological processes provide
    data that are not normally distributed. In such cases, the normality assumption
    underlying the conventional statistical monitoring chart is invalid. Many researchers
    have studied the impact of departure from normality on process monitoring charts
    [8–10]. For example, the author of [9] have investigated the impact of a violation
    of normality assumption on the Shewhart chart, by using various known distributions,
    namely uniform, right triangular, gamma, and bimodal distributions. Also, Burrows
    [11] studied the impact of skewed distribution on the Shewhart chart. Several
    works have designed process monitoring charts for non-Gaussian distribution when
    the form of the underlying distribution is known. The authors of [12,13] have
    developed an EWMA monitoring scheme for multivariate Poisson-distributed data.
    Also, univariate monitoring charts were designed to monitor nonnormally chi-square
    distributed processes [14]. However, we usually use the normal theory results
    in the absence of information regarding the form of distribution of the data [8].
    Then, ignoring the nonnormality in data can result in significant degradation
    of the detection quality of the designed monitoring approach [15].


    Most real processes, however, are multivariate in nature. The conventional multivariate
    fault-detection methods also rely on most of the assumptions made in univariate
    techniques, such as the normality, independence of the data or residuals. The
    collinearity in the data can lead to a large uncertainty of the model parameters
    and degrades the model prediction. The most commonly used strategy to reduce the
    effect of the collinearity on the model efficacy is to use latent variable regression
    (LVR) models. The basic idea behind the LVR models is that most of the information
    on the data is captured by transforming the variables into a smaller set of variables
    that are used for model development. The LVR model is developed using a smaller
    set of variables that linearly combine the original variables. This leads to improvements
    in prediction as well as well-conditioned models for estimation [16]. Some of
    the well-known LVR model techniques include principal component regression (PCR)
    [17,18] and partial least squares (PLS) [17,19,20].


    Another challenge in designing process monitoring schemes is to overcome the high
    noise embedded in the measured data. Most of the data measured from processes
    are corrupted with noise which is of different forms, including random and gross
    errors. These errors are largely due to disturbances, fluctuations, sensor degradation,
    and human errors. These errors may swamp the important features of the data that
    are essential to detect anomalies during the estima-'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'tion of the model parameters. Thus, measurement noise must be filtered to get
    an improved model prediction. Unfortunately, most practical data contain relevant
    features and noise that have contributions in time and frequency. This kind of
    data is multiscale in nature [21]. For example, slow change in the data covers
    a wide range in the time domain and a small range in the frequency domain. Similarly,
    a large change in the measured data covers a small range in the time domain and
    a wide range in the frequency domain. Conventional filtering techniques, such
    as a mean filter or exponentially weighted moving average filter, fail to separate
    the feature-noise due to the data being multiscale in nature. Convectional low
    pass filters classify the noise as a high-frequency feature and therefore filter
    data higher than a defined threshold. Therefore, to take care of the multiscale
    nature of the data, it requires the use of multiscale model estimation methods.
    Wavelet-based techniques are powerful tools to separate pertinent features from
    noise.


    Various researchers have applied multiscale methods to improve the accuracy of
    prediction of the estimated model [22–28]. For example, Palavajjhala et al. proposed
    the wavelet prefilters for modeling purposes using the multiscale representation
    of data [23]. Bhakshi [22] have demonstrated the benefits of data representing
    in multiscale for empirical modeling and shown that it can enhance the noise removal
    capability of the PCA model and its capacity for supervising multivariate processes.
    Other researchers showed that collinearity can be reduced by the multiscale representation
    of data and also that it is able to shrink the variations of FIR model parameters
    [25,26]. In system identification steps, wavelets have been used as a modulating
    function for control-relevant system identification [28]. Unfortunately, parameter
    estimation of LVR models using multiscale data has not been exploited much in
    the literature, which is the main focus of this chapter.


    Motivated by the above-mentioned challenges and hindrances limiting the mentioned
    conventional univariate and multivariate fault detection approach, the aim of
    this chapter is to present a set of wavelet-based multiscale monitoring and fault
    detection methods to address these challenges. In this chapter, we offer a brief
    review of the wavelets, present their benefits, and introduce the multiscale representation
    of data using wavelets. We then show the impact of ignoring the basic assumptions
    underlying the data structure on the detection performance of a univariate monitoring
    chart, and subsequently introduce the core idea of wavelet-based univariate monitoring
    charts, i.e., multiscale EWMA, CUSUM, and GLR fault detection methods, that can
    improve the performance of these techniques, especially when their assumptions
    are violated. An illustration of the concept of wavelet-based multivariate extension
    of LVR approaches is provided. In our last section, we highlight the major results
    obtained when applying multiscale monitoring approaches to monitor distillation
    columns. Lastly, we discuss the challenges that remain when using multiscale approaches.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 5.2 Theoretical background of wavelet-based data representation


    Conventional and well-known monitoring schemes, such as EWMA, CUSUM, and GLR,
    would not be effective in monitoring nonstationary, non-Gaussian, and correlated
    processes. Some have been improved to handle the possible correlation among process
    measurements by describing the correlation via a statistical model, such as the
    autoregressive integrated moving average (ARIMA), which is commonly used and also
    quite flexible time series model. However, most of these models are designed by
    assuming stationarity of the data and they are effective to detect anomalies only
    of a certain range. For this reason, we choose to use wavelet-based methods commonly
    used to alleviate the stationarity assumption and the limitations encountered
    in many conventional monitoring schemes.


    Let us first focus on the core idea and benefits of wavelets. Generally speaking,
    wavelet functions look at data on different scales or frequency components and
    are able to analyze every frequency component, via a level-matched resolution.
    For instance, if we look at the data with a large window, we can notice essential
    features. In the same manner, if we look into the data with a small window, we
    would notice the small features. Indeed, most of data-based empirical modeling
    approaches involve representing the data for each of the variables, using basis
    functions that represent all the measured variables individually. A large part
    of the methods are currently used to represent data at a single scale or fixed
    in time and frequency. This type of representation is useful only for data-containing
    contributions with a uniform localization everywhere in time and frequency. In
    practical situations, it is rare to find measured data with a uniform localization
    or a single scale. Measured data involve stochastic and deterministic events.
    Most of practical data that contain stochastic components of the measured data
    are a combination of scale and time-dependent parameters, whereas a deterministic
    component of the data is at multiple locations of the frequency and time. Also,
    measured variables sometimes may have different sampling rates or may have some
    missing segments.


    Indeed, each occurred event is linked with some frequency band. Wavelet methods
    are an efficient tool enabling the decomposition of the original data into multiple
    frequency bands and thus permitting the simultaneous analysis in time and frequency
    domains. Besides the limitation described above, the conventional monitoring methods
    have the other disadvantage of being single scale (time scale) and may not be
    able to efficiently handle multiscale data that are frequently present in modern
    industrial processes. Because of the multi-scale nature of the data from most
    engineering and environmental processes, it is necessary to include these features
    when designing monitoring methods. This means that some events occur at different
    localizations in time and frequency, such as processes for which the power spectrum
    changes with time and/or frequency, and for variables collected at different sampling
    rates. Most of the data-based empirical modeling approaches involve representing
    the data'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'for each of the variables using a basis function that, for example, represents
    each measured variable. Wavelet techniques have been shown to be highly competitive
    when data are multiscale, correlated, and do not follow a Gaussian distribution.
    Essentially, wavelet-based monitoring provides more desirable features than conventional
    methods for several reasons; it generates uncorrelated wavelet coefficients at
    different scales and decomposes signals into several frequency bands that enable
    the analysis of data in time and frequency domains simultaneously.


    # ## 5.2.1 Wavelet transform


    A time-series data can be represented using wavelets as coefficients that correspond
    to a specific time and frequency [29]. Wavelet decomposition has been extensively
    used in data compression, signal and image processing, speech discrimination,
    model prediction, and process monitoring. Wavelet decomposition is a sophisticated
    method that allows obtaining localized components, unlike other well-known decomposition
    methods such as the Fourier transform. In Fourier transform, data is decomposed
    as a combination of sines and cosines, where the different frequencies are calculated
    from the global period of the signal, thus maintain specificity in frequency alone.
    Contrary to the Fourier transform, a localized frequency analysis is obtained
    by the wavelet decomposition. Thus, it comes with information about the frequency
    components that exist in a signal and their time of occurrence [30]. Additionally,
    the wavelet filter can quickly capture high-frequency features and acquire slowly
    the low-frequency ones; this makes it very efficient to expose patterns with different
    magnitudes and durations in a signal, while preserving the timing very precise.


    Another aspect is the fact that the wavelet transform has the ability to distinguish
    the stochastic components from the deterministic components taken from the data.
    The deterministic components are captured by a relatively small number of large
    coefficients, whereas stochastic changes are distributed among all coefficients.
    The major advantage of the wavelet transform is that it represents the data in
    varying windows. It should be noted that to overcome the problem of discontinuity
    in the signal, very short basis functions are used, and to get detailed frequency
    analysis, long basis functions can be used. This way, one can achieve long low-frequency
    and high-frequency basis functions. In the following section, we shed more light
    on the multiscale representation based on wavelets and its advantages.


    # ## 5.2.2 Multiscale representation of data using wavelets


    Historically, multiresolution time-series decomposition was introduced as the
    quintessential mathematical tool for image decoding and compression [31]. In [31],
    Mallat employed orthogonal wavelets for image compression, because'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/aa2f42c739937b682075082233e335bb_170_0.png)


    FIGURE 5.1 Illustration of the dilation and translation mechanism in wavelets.


    of their capacity to easily adapt to patterns of images and to reconstruct them
    with reduced space. Nowadays, wavelets are used in numerous applications, including
    data compression, image analysis, time–frequency localization, and process monitoring
    [32–35]. Wavelets represent a set of mathematical functions that can offer a localized
    analysis in both time and frequency [34]:


    ```

    \(\psi_{a,b}(t) = \frac{1}{\sqrt{a}}\psi\left(\frac{t-b}{a}\right),\qquad (5.1)\)

    ```


    where a and b are respectively the dilation and translation parameters [32]. The
    function \(\psi(t)\) represents the mother wavelet, which becomes \(\psi\left(\frac{t-b}{a}\right)\)
    when stretched or shrunk. Fig. 5.1 shows how the mother wavelet is stretched and
    shrunk to capture features in time and frequency. In practice, the dyadically
    discretized version of the dilation and the translation parameters are commonly
    used: \(a = 2^m, b = 2^m k, (m, k) \in \mathbb{Z}^2\). Thus, the family of wavelets
    can be expressed as \(\psi_{mn}(t) = 2^{\frac{-m}{2}} \psi(2^{-m}t - m)\). Here,
    m and k respectively denote the dilation and translation parameters. Numerous
    families of basis functions are generated, based on their convolution with different
    filters, such as the Haar scaling function and the Daubechies filters [32,36,37].
    Generally speaking, the form of the wavelet function is related to the wavelet
    family; for instance, the Haar wavelet is discrete symmetrically square-shaped,
    and Daublets, symmlets, and Coiflets are almost symmetric (Fig. 5.2). It should
    be noted that the dyadic discretization imposes downsampling, which reduces the
    number of parameters dyadically at each decomposition. Indeed, with this discretization,
    decomposition of samples at nondyadic locations is performed with a certain time
    delay.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/aa2f42c739937b682075082233e335bb_171_0.png)


    FIGURE 5.2 Different form of wavelets: (A) Haar wavelet; (B) Daubelet of order
    12 wavelet; (C) Symmlet of order 12 wavelet; (D) Coiflet of order 12 wavelet.


    Discrete Wavelet Transform (DWT) is an efficient procedure for separating deterministic
    from stochastic components of the input signal [34,38]. Thus, it is widely used
    for denoising measurements and changing detection [39,40]. The essence of the
    DWT is to represent time series data as a combination of approximation and detail
    coefficients [38]. Using DWT, the time series can be decomposed as [28,41,42]:


    ```

    x(t) = \sum_{k=1}^{n2^{-J}} \mathbf{a}_{jk}\phi_{jk}(t) + \sum_{j=1}^{J} \sum_{k=1}^{n2^{-j}}
    \mathbf{d}_{jk}\psi_{jk}(t), \quad (5.2)

    ```


    where $A_J(t)$ and $D_J(t)$ are respectively the approximation and detail coefficients,
    and $J$ is the decomposition level.


    The detail coefficients are generated by projecting the original signal $x(t)$,
    using a set wavelet basis functions defined as $\psi_{j,k}(t) = \sqrt{2^{-j}}\psi(2^{-j}t
    - k), j = 1, \dots, J, k \in \mathbb{Z}$, where $k$ is the shift parameter; $\psi$
    is the mother wavelet used. In other words, the detailed signal $D_j(t)$ at scale
    $j$ can be obtained by ap-'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/aa2f42c739937b682075082233e335bb_172_0.png)


    FIGURE 5.3 Illustration of DWT of a heavy sine (approximations S_i and details
    d_i) using Haar wavelet; here, L = 3.


    plying a high-pass filter (g) on the original and scaled signals. In a similar
    way, the approximation coefficients are generated by projecting the signal on
    a set of orthonormal scaling functions given by \(\phi_{j,k}(t) = \sqrt{2}^{-j}\phi(2^{-j}t
    - k), j = 1, \dots, J, k \in \mathbb{Z}\). Similarly, the scale signals are computed
