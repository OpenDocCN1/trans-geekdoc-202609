    \\ \mathcal{H}_1 \text{ else.} \end{cases}\) (2.41)


    The GLR charting statistic, \(\mathcal{L}(Y)\), is given as


    \(\mathcal{L}(Y) = 2 \log \sup_\theta \left\{ \exp \left\{ - \frac{\|Y - \theta\|_2^2}{2\sigma^2}
    \right\} / \exp \left\{ - \frac{\|Y\|_2^2}{2\sigma^2} \right\} \right\},\) (2.42)


    where \(\| \cdot \|_2\) is the Euclidean norm and \(f_\theta(Y) = \frac{1}{(2\pi)^{\frac{n}{2}}
    \sigma^n} \exp \left\{ - \frac{1}{2\sigma^2} \|Y - \theta\|_2^2 \right\}\) is
    the pdf of \(Y\). Then, (2.42) can be expressed as


    \(\mathcal{L}(Y) = \frac{1}{\sigma^2} \left\{ \min_\theta \|Y - \theta\|_2^2 +
    \|Y\|_2^2 \right\} = \frac{1}{\sigma^2} \left\{ \|Y - \widehat{\theta}\|_2^2 +
    \|Y\|_2^2 \right\}.\) (2.43)


    After the estimation of \(\theta\) as \(\widehat{\theta} = \arg \min_\theta \|Y
    - \theta\|_2^2 = Y\), \(\mathcal{L}(Y)\) can be expressed as


    \(\mathcal{L}(Y) = \frac{1}{\sigma^2} \|Y\|_2^2.\) (2.44)


    The control limit, \(h(\alpha)\), is defined to achieve the desired probability
    of false alarms, selected a priori:


    \(\mathbb{P}_0 (\mathcal{L}(Y) \ge h(\alpha)) = \int_h^\infty f_0(y) dy = 1 -
    F_{\chi_1^2}(h) = \alpha.\) (2.45)


    The power function of the GLR approach is determined as


    \(\beta_{8^*}(c^2) = \mathbb{P}_\theta (\delta^*(Y) = \mathcal{H}_1) = 1 - F_{1,
    \gamma(\theta)}(h),\) (2.46)


    where \(F_{1, \gamma}(Y)\) is the non-central \(\chi^2(1, \gamma)\) distribution
    with one degree of freedom, and the noncentrality parameter \(\gamma (\theta)
    = \frac{1}{\sigma^2} \| P_H^\perp \theta \|_2^2\).


    In summary, a fault is flagged by the GLR approach when the decision statistic,
    \(\mathcal{L}(Y)\), exceeds the control limit, \(h(\alpha)\). Otherwise, the supervised
    process is performing normally.'
