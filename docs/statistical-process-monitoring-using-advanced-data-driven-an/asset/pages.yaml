  md: 'In a similar manner to the conventional PCA, the sample covariance matrix (with
    its elements are the inner product of all pairs of points \(\Phi(\mathbf{x}_i)\)
    and \(\Phi(\mathbf{x}_j)\)) in feature space, can be calculated as


    ```

    \(\mathbf{\Sigma}_{\mathbb{F}} = \frac{1}{n} \sum_{i=1}^n [\Phi(\mathbf{x}_i)
    - \mathbf{m}_{\Phi}] [\Phi(\mathbf{x}_i) - \mathbf{m}_{\Phi}]^T, \quad (4.13)\)

    ```


    where \(\mathbf{m}_{\Phi} = \sum_{i=1}^n \Phi(\mathbf{x}_i)/n\) is the sample
    mean in \(\mathfrak{F}\). Let us consider \(\overline{\Phi}(\mathbf{x}_i) = \Phi(\mathbf{x}_i)
    - \mathbf{m}_{\Phi}\) as the centered nonlinear mapping.


    The principal components are found by solving the eigenvalue problem in \(\mathfrak{F}\)
    as


    ```

    \(\lambda \mathbf{v} = \mathbf{\Sigma}_{\mathbb{F}} \mathbf{v} = \frac{1}{n} \sum_{i=1}^n
    \left[ \overline{\Phi}(\mathbf{x}_i)^T \mathbf{v} \right] \overline{\Phi}(\mathbf{x}_i),
    \quad (4.14)\)

    ```


    where \(\lambda\) is an eigenvalue, \(\lambda > 0\), and \(\mathbf{v}\) is the
    corresponding eigenvector of the covariance matrix \(\mathbf{\Sigma}_{\mathbb{F}}\).
    The first PC in \(\mathfrak{F}\), which shows the largest variability in the data,
    is given along the direction of \(\mathbf{v}\) with the greatest eigenvalue, and
    the PC indicates the direction of \(\mathbf{v}\) with the lowest eigenvalue.


    For nonzero \(\lambda\), \(\mathbf{v}\) could be expressed as a linear combination
    of \(\alpha_i, i = 1, \dots, n\), thus


    ```

    \(\mathbf{v} = \sum_{i=1}^n \alpha_i \overline{\Phi}(\mathbf{x}_i). \quad (4.15)\)

    ```


    Multiplying by \(\Phi(\mathbf{x}_j)\) on both sides of Eq. (4.14) gives


    ```

    \(\lambda (\Phi(\mathbf{x}_j) \mathbf{v}) = \Phi(\mathbf{x}_j) \mathbf{\Sigma}_{\mathbb{F}}
    \mathbf{v}. \quad (4.16)\)

    ```


    Now, expanding Eq. (4.14), we get


    ```

    \(\lambda \sum_{i=1}^n \alpha_i \overline{\Phi}(\mathbf{x}_i) \overline{\Phi}(\mathbf{x}_j)
    = \frac{1}{n} \sum_{i=1}^n \alpha_i \left( \overline{\Phi}(\mathbf{x}_i) \sum_{i=1}^n
    \alpha_i \overline{\Phi}(\mathbf{x}_j) \right) \left( \overline{\Phi}(\mathbf{x}_i)
    \overline{\Phi}(\mathbf{x}_j) \right). \quad (4.17)\)

    ```


    It should be noted that the eigenvalue problem in (4.14) can be solved using only
    scalar products of the mapped vector in \(\mathcal{F}\), and that it can be handled
    based on a kernel matrix. Therefore, the use of a kernel function can simplify
    the computational challenges in the higher-dimensional space \(\mathcal{F}\) to
    computing scalar products of vectors in \(\mathcal{F}\), which highlights the
    great power of kernel tricks [59].


    The kernel function allows determining in an implicit manner the nonlinear mapping
    in \(\mathfrak{F}\). The kernel matrix \(\mathbf{K} \in \mathbb{R}^{n \times n}\)
    is expressed as


    ```

    \(\mathbf{K}(\mathbf{x}_i, \mathbf{x}_j) = \Phi(\mathbf{x}_i)^T \Phi(\mathbf{x}_j).
    \quad (4.18)\)

    ```


    Then, from Eq. (4.17), we will get


    ```

    \(n \lambda \mathbf{K} \boldsymbol{\alpha} = \mathbf{K}^2 \boldsymbol{\alpha},
    \quad (4.19)\)

    ```'
