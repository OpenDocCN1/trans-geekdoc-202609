  md: '# 6.4 Deep learning models


    We present in this subsection the autoencoders that are among the most used algorithms
    to build up deep networks. We briefly present three commonly used variants of
    autoencoders, namely undercomplete variational autoencoders, denoising autoencoders,
    and contrastive autoencoders. For a more complete review, refer to [51].


    # 6.4.1 Autoencoders


    An autoencoder (AE) is basically a variant of a neural network that consists of
    three layers: input, hidden, and output layers that work in an unsupervised learning
    paradigm [9]. Essentially, an AE predicts the value of the output x̂ based on
    the input x through a hidden layer h (Fig. 6.8) [52–54]. They are frequently applied
    in dimensionality reduction and feature extraction. In fact, autoencoders consist
    of two components, an encoder and a decoder. The essence of the encoder function
    is to map the input data into the hidden layer, h = f(x). An AE with nonlinear
    encoder functions provides more flexibility to extract more features, in comparison
    to principal component analysis [9]. On the other hand, the role of the decoder
    component is reconstructing the input data based on the hidden layer representation,
    x̂ = g(h). Of course, in the encoding stage, the AE discovers a compacted representation
    (or latent variables) of the input data, while in the decoding stage, the AE tries
    to reconstruct the input based on encoded data.


    ![](img/aa2f42c739937b682075082233e335bb_215_0.png)


    FIGURE 6.8 Schematic illustration of an autoencoder.


    Assume that (x1, x2, ..., xk) are unlabeled data points, during the encoding process,
    the N-dimension input data, xi, are mapped to M-dimension vectors hi using the
    encoding function f. The hidden layer h is computed as


    h(x) = f(W1x + b1). (6.11)


    The term W1 refers to the weight matrix of the encoder, and b1 denotes the bias
    vector. In the decoding phase, the decoding maps every M-dimensional vector back
    for reconstructing the input vector, x, expressing the reconstructed'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'vector, \(\hat{\mathbf{x}}\), as


    \(\hat{\mathbf{x}} = g(\mathbf{W}_2 h(\mathbf{x}) + \mathbf{b}_2),\) (6.12)


    where \(\mathbf{W}_2\) is the weight matrix of the decoder, and \(\mathbf{b}_2\)
    denotes the bias vector.


    The reconstruction error, which is the difference between the original data, \(\mathbf{x}\),
    and the reconstructed data, \(\hat{\mathbf{x}}\), is usually in the form of a
    loss function in the training stage. Specifically, the training of an autoencoder
    is usually performed by minimizing the negative log-likelihood of the reconstruction,
    given the encoding \(f(\mathbf{x})\) [9]:


    Reconstruction error = \(-\log(P(\mathbf{x}|f(\mathbf{x}))),\) (6.13)


    where \(P\) denotes the probability assigned to the input vector \(\mathbf{x}\)
    by the model. The goal is that \(f(\mathbf{x})\) captures the main factors of
    variation in the data.


    In fact, the incorporation of latent variable models makes autoencoders behave
    like generative models. Stacked autoencoder models were largely employed in image
    denoising [55,56] and content-based image retrieval [57].


    # 6.4.1.1 Variational autoencoder


    A variational autoencoder (VAE) has a similar structure as that of a conventional
    AE in the way that it contains an encoder and a decoder network. The major shortcoming
    of the conventional AE is that the inputs are converted to discrete variables
    (not continuous) which makes the interpolation a challenging task. Specifically,
    as a generative model, the AE randomly takes samples from the latent space, and
    this is difficult if it is discontinuous or contains gaps. VAR is a variant of
    AE that is designed to estimate the distribution of the feature data [58–60].
    Its training is regularized to avoid overfitting and guarantee that the latent
    space possesses suitable properties that enable the generative process. VAE possesses
    a continuous latent space which makes it a powerful generative model. In fact,
    differing from the conventional AE, a VAE possesses an additional layer in charge
    of sampling the latent vector \(\mathbf{z}\), and its loss function contains an
    extra term that constrains the generation of a latent vector with a roughly predefined
    distribution, \(p(\mathbf{z})\), frequently considered as a standard Gaussian.
    Essentially, in the training phase, by using the input data, the encoder generates
    vectors of means, \(\mu\), and standard deviation, \(\sigma\) of the latent vector
    distribution. Then the decoder reconstructs the input data by using the latent
    variable, which is sampled from the latent vector distribution (Fig. 6.9).


    Generally speaking, VAEs are generative models that use latent space for mapping
    the input data to the feature spaces, making them able to generate new samples
    based on the learned model parameters [58–60]. In fact, the encoding procedure
    performed by the VAE is also known as approximate inference network, the \(q_\theta(\mathbf{z}|\mathbf{x})\)
    is used on the training to get \(\mathbf{z}\) (i.e., learn a probability distribution
    of the underlining input dataset), the next is the decoder transformation performed
    using \(p_\phi(\mathbf{x}|\mathbf{z})\) to reconstruct the input data.'
