    # ## 5.2.3 Advantages of multiscale representation


    Autocorrelation and non-Gaussianity of process variables present important challenges
    when designing and implementing monitoring techniques. Here, we show the great
    potential of wavelet-based multiscale representations to decrease the autocorrelation
    degree of autocorrelated process and make the distribution of wavelet coefficients
    close to Gaussian, even if input data have non-Gaussian distributions.


    # ### 5.2.3.1 Decorrelating autocorrelated measurements


    One main characteristic of the multiscale representation is its capacity for decorrelating
    autocorrelated measurements at a multiscale level, making it an elegant and flexible
    tool for presenting and supervising environmental and engineering processes over
    conventional monitoring methods [46]. Generally speaking, a white noise process,
    which is uncorrelated with its values at any lag, has an autocorrelation function
    (ACF) of zero at all lags except the value of unity at lag zero. In contrast,
    time-dependent processes including autoregressive (AR) or autoregressive moving
    average (ARMA) process have nonzero values at lags other than zero that show a
    correlation among different lagged measurements [47]. It should be noted that
    the monitoring quality of conventional fault-detection methods can be deteriorated
    in the presence of autocorrelated measurement noise [1,48,49]. In the literature,
    two main strategies can be distinguished to monitor autocorrelated data. In the
    first strategy, the decision thresholds are adjusted to consider the time dependence
    in the data by estimating the true variance of the process [50]. In the second
    strategy, a model is first constructed and'
