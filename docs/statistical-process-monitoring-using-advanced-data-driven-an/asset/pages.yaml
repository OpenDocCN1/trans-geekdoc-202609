    # ## 2.3 Dynamic LVR models


    From the above discussion, we have shown that LVR models such as PLS and PCR can
    be used to handle multivariate data with collinearity among the variables by designing
    a model from a reduced number of variables (which are a linear combination of
    the original variables) termed latent variables. These methods result in well-conditioned
    models. However, LVR models are static and ignore process dynamics, which make
    them unsuitable to catch the temporal evolution of data. In other words, the use
    of such methods to select the key variables is performed by assuming that the
    variables are uncorrelated in time. Since many practical data produced from engineering
    and environmental processes are correlated in time, it is necessary to have a
    model incorporating such information to deal with process dynamics.


    For dynamic processes such as engineering and chemical processes, frequently the
    actual observations of the process variable depend on past observations. The application
    of static LVR approaches (e.g., PLS and PCA) to dynamic data will not give accurate
    modeling of the relations among the variables, but just a linear static approximation.
    To remedy this limitation and consider the dynamic information, an augmented process
    dataset, including previously autocorrelated measurements, should be created.
    A commonly used approach to bypass such limitations is dynamic PCA (DPCA), which
    has been introduced in [46]. Basically, DPCA is the conventional PCA applied to
    augmented data including time-lagged measurements of process variables. Specifically,
    to de-'
