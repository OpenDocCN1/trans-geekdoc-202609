    # 3.2.2.4 Discussion


    There are some drawbacks of these traditional isolation techniques. For example,
    recomputing the monitoring statistics for all possible subsets of the monitored
    variables can become computationally infeasible when \( p \) is large. Furthermore,
    it is still difficult to associate the alarms triggered by MEWMA or MCUSUM charts
    with specific variables. Nevertheless, these methods still prove useful in applied
    problems [33]. Bersimis et al. [25] provide an overview of many of these methods
    and conduct an extensive comparison simulation study of them across several types
    of simulated data. However, this study still displays several shortcomings that
    should motivate additional research: (i) the study only simulates \( p = 3 \)
    or 5 variables; (ii) the only metric of interest reported is whether the method
    detected at least one of the shifted variables (which does not reveal if all shifted
    variables are isolated or if any unshifted variables are also flagged); and (iii)
    the overall percentages of identification of at least one shifted variable are
    still relatively low in most settings.


    # 3.2.3 Variable selection methods


    Some of the more recent works that propose methods to perform fault detection
    and isolation simultaneously frame the FD&I problem in terms of a multiple linear
    regression model and then use penalized regression variable selection methods
    [2,6,16]. To briefly review penalized regression, a multiple linear regression
    model takes the following form:


    ```

    \( y_i = \mathbf{x}_i \boldsymbol{\beta} + \epsilon_i, \quad i = 1, \dots, n,\)

    ```


    where \( y_i, \mathbf{x}_i, \boldsymbol{\beta}, \text{ and } \epsilon_i \) are
    the response variable, vector of predictors, vector of coefficients, and iid random
    errors with distribution \( N(0, \sigma^2) \), respectively. To perform variable
    selection and parameter estimation simultaneously, the following penalized least
    squares objective function is minimized with respect to \( \boldsymbol{\beta}
    \):


    ```

    \( \sum_{i=1}^n (y_i - \mathbf{x}_i \boldsymbol{\beta})^2 + \sum_{j=1}^p g_{\gamma_j}
    \left( \left| \beta_j \right| \right), \quad \text{(3.6)}\)

    ```


    where \( \beta_j \) is the \( j \)th coefficient of \( \boldsymbol{\beta} \),
    \( \gamma_j \) are regularization parameters, and \( g_{\gamma_j} (\cdot) \) is
    the penalty function. For an \( L_q \) penalty function with \( q \le 1 \), the
    variable selection is performed automatically by setting \( \beta_j \) equal to
    zero for those predictors with small estimated coefficients.'
