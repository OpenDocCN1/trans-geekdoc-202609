    The marginal distribution of the visible variables can be easily computed because
    hidden units are not connected to visible units:


    \( p(\mathbf{v}) = \frac{1}{Z} \sum_{\mathbf{h}} p(\mathbf{v}, \mathbf{h}). \)


    In the case of binary visible unit \(\mathbf{v} \in \{0, 1\}^m\) and hidden units
    \(\mathbf{h} \in \{0, 1\}^n\), the marginal probability distributions of the RBM
    can be compute as


    \( p(h_j=1|\mathbf{v}) = \sigma \left( \sum_{j=1}^m w_{ij}v_j + a_i \right), \quad
    p(v_i=1|\mathbf{h}) = \sigma \left( \sum_{j=1}^n w_{ij}h_i + b_j \right), \quad
    \sigma(x) = \frac{1}{1 + \exp(-x)} \)


    where \(\sigma(\cdot)\) refers to the logistic function. In [71], an improved
    version of RBM, called Gaussian–Bernoulli RBM, has been introduced to handle various
    data types, such as real data, rather than binary inputs, where \(\mathbf{v} \in
    \mathbb{R}^m\) and hidden units \(\mathbf{h} \in \{0, 1\}^n\).


    Generally speaking, the core purpose of model training is to tune the model parameters
    (weights matrix \(\mathbf{W}\)) to maximize the probability attributed to the
    training data under the model. Formally, proper parameters are obtained by maximizing
    the log-likelihood function, where the derivative of the log-likelihood is computed
    with respect to \(\mathbf{W}\) takes the following form [74–76]:


    \(\Delta w_{ij} = \alpha(E(v_i, h_j) - \hat{E}(v_i, h_j)).\)


    The term \(\alpha\) denotes the learning rate and \(\hat{E}(v_i, h_j)\) refers
    to the energy expected from the distribution learned by the model, which is intractable
    [71], Gibbs sampling is used to overcome this problem. In [77], a learning procedure
    called contrastive divergence (CD) that can avoid the expensive computation has
    been introduced by Hinton to train RBM. This CD procedure is becoming a standard
    way for training RBM and its extensions.


