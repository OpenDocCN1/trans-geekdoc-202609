    the nonzero components of the mean, which correspond to the shifted variables
    because the detrended data from the training window have been centered.


    Fig. 3.13 gives the monitoring statistics, \( T^2 \) and SPE, throughout the monitoring
    period. The nonparametric threshold is determined using a percentile of the kernel
    density estimate (KDE) of the monitoring statistic from the training period, which
    is given in red (mid gray in print). The two statistics tend to follow the same
    pattern, meaning, when one is large, the other is also large, and the monitoring
    statistics tend to be large when there is a shift in one or more of the variables
    in Fig. 3.12. There are three time periods during which the statistics consistently
    exceed their corresponding thresholds: (1) during the first downward shift in
    ras_ph between April 17–19; (2) during the fault in the MBR levels on April 22;
    and (3) beginning around April 24 through the end of the monitoring period as
    ras_ph and perm_cond become more and more OC.


    Now that the FD method has detected a fault in the system, the FI method to identify
    the shifted variables is applied. Fig. 3.14 plots the classification of each variable
    over the monitoring period as shifted or unshifted, where a black box indicates
    that the variable is identified as shifted at a given time point and is white
    otherwise. The variables that we strongly suspect have shifted are highlighted
    in yellow (light gray in print version). Termed a checkerboard plot, these figures
    are helpful in tracking changes in shifted variables over time [15,73] and show
    how faults can propagate from one variable to another over time, particularly
    in those systems with feedback control implemented [66].'
