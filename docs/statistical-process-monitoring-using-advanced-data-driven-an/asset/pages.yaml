- pgno: 109
  md: 'distributions. Li et al. [63] develop a robust self-starting monitoring approach
    for multivariate categorical processes that incorporates VS. Zhao and Gao [64]
    develop a process control method that monitors changes in the multivariate distribution
    of variables with VS in regression to isolate variables associated with changes
    in the distribution. Zarzo and Ferrer [65] use VS combined with partial least
    squares (PLS) in monitoring and isolating variables associated with changes in
    variability of a final output variable.


    Monitoring the mean and variance are important for processes inside of control
    loops. When faults occur in a control loop, the control strategy seeks to maintain
    the variables at their target levels and may mask any changes in the mean of the
    variable, but correlations among variables may change substantially, making monitoring
    of the covariance in addition to the mean very important in such settings [66].
    Capizzi and Masarotto [17] use VS to jointly monitor the mean and total dispersion.
    Wang et al. [67] also propose a method to monitor both the mean and covariance
    with penalized likelihood estimation. Wang and Tsung [22] use VS for adaptive
    dimension reduction, with a special focus on feedback-controlled processes.


    Batch processes are those that operate on a feed input for a given period of time
    before switching to the next batch. Some methods for variable isolation in batch
    processes have also been developed. Yan et al. [68] incorporate VS into PLS discriminant
    analysis. Chu et al. [24] propose a method for batch processes combined with a
    bootstrap-based variable selection. Yao et al. [69] use two-dimensional PCA for
    batch processes with a reduced support region.


    Some methods have been designed for very high-dimensional settings with variable
    numbers in the thousands. Kim et al. [70] developed a penalized likelihood-based
    fault detection approach that uses the L2-norm regularization with the goal of
    shrinking all of the variable means to zero. While it was not originally designed
    for fault isolation, it does perform well in isolating faulty variables in a case
    study with ten monitored variables. Turkoz et al. [71] develop a Bayesian approach
    designed for nonnormal and high-dimensional processes that is computationally
    efficient. Abdella et al. [72] propose a multivariate CUSUM chart that is designed
    to detect very small shifts in the mean and isolate variables in high dimensional
    settings.


    Bayesian methods have been used to handle a variety of problem-specific challenges.
    Yan et al. [73] adopt a Bayesian framework to handle the uncertainty in parameter
    estimation and to handle the choice of a tuning parameter. They apply the method
    to three faults in the Tennessee Eastman (TE) process and can show when the fault
    occurs, how long the fault persists, and which variables are shifted. Ge et al.
    [74,75] propose Bayesian methods to monitor processes with nonlinear and multimode
    features, with both applied to the TE process. Jiang and Huang [76] use a Bayesian
    fault diagnosis method for plant-wide process monitoring via local monitors. The
    TE process will be described in the next section.'
