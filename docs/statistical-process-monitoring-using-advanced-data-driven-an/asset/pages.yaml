    observation for the second layer. Now, the second layer is trained like an RBM
    by using the transformed data from the previous layer as training data. This process
    is repeated for the selected number of layers, each time propagating upward the
    transformed data. In practice, fine-tuning based on backpropagation and (stochastic)
    gradient descent is performed to optimize the DBN model. Then, the DBN model with
    the trained weights and biases can be used to predict new data [82–84].


    Deeper DBN architecture can be obtained by incorporating more layers in the network.
    Generally speaking, deep architectures could help improve learning algorithms
    to achieve a more accurate expression of energy. In addition, it can reduce the
    training time because of a one-step can be sufficient to reach the learning of
    maximum likelihood [85].


    # 6.4.4 Deep Boltzmann machine


    Here, we discuss another type of deep generative model based on the Boltzmann
    machine called deep Boltzmann machine [72]. The DBM model is formed of several
    layers of hidden variables with undirected connections in contrast to RBMs that
    have just one (Fig. 6.14). The visible layer acquires the input data, and the
    hidden layers aim to extract features. Similarly to the RBM, the variables are
    mutually independent within each layer and conditioned on the variables in the
    precedent layers. Unlike DBN, this model is a fully undirected model. Essentially,
    the DBM model can be viewed as the result of stacking RBM to form a fully undirected
    graph. To handle real-valued data, in [86], a Gaussian–Bernoulli DBM (GDBM) that
    employed the Gaussian neurons in the visible layer of the DBM was introduced.


    DBM has proven to be effective in automatically representing complex and nonlinear
    data and incorporating uncertainty related to ambiguous and missing or noisy inputs.
    In fact, every layer of DBM captures higher-order correlations between the hidden
    features in the precedent layer. DBMs are capable to learn complex statistical
    structures and have been applied to a variety applications including object recognition
    [87], document modeling [88], and computer vision [89].


    Considering a two-layer DBM (Fig. 6.14) with a single visible layer, $\mathbf{v}$,
    and two hidden layers, $\{\mathbf{h}_1, \mathbf{h}_2\}$, the DBM energy function
    of the state $\{\mathbf{v}, \mathbf{h}_1, \mathbf{h}_2\}$ in'
