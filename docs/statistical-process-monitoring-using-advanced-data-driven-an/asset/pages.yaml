- pgno: 102
  md: 'where the primary differences are that RSS(\(\lambda\)) is the residual sum
    of squares of Eq. (3.9), and \(np - p\) is the dimension of the searched parameter
    space, or the number of potential change point locations. There cannot be a change
    point detected at the first observation, \(t=1\), so change points can only be
    detected at a maximum of \(np - p\) locations.


    One problem with the EBIC in Eq. (3.10) is that using the sample size, \(n\),
    in it implies that the observations are independent. However, if \(\mathbf{x}_j\)
    are autocorrelated, then the effective sample size (ESS), or the equivalent number
    of independent observations, differs from \(n\). If positive autocorrelation is
    present, the ESS will be smaller than the actual sample size, and the stronger
    the positive autocorrelation, the smaller the ESS. Therefore, the ESS is calculated,
    which is denoted \(n''\), as follows:


    \(n'' = \frac{n}{1 + \frac{1}{n} \sum_{h>0} R(h)}, \quad (3.11)\)


    where \(R(h)\) is a user-selected function that models the autocorrelation when
    the process is IC between two distinct observations (i.e., \(h \neq 0\)) that
    are \(h\) time steps apart [52]. Confirming the presence of autocorrelation and
    determining the most appropriate \(R(h)\) can be done by investigating the sample
    autocorrelation function (ACF) and partial autocorrelation function (PACF) plots
    of each \(\mathbf{x}_j\) in the IC training period. This assumes that the strength
    and structure of the temporal dependence are the same for each variable. Replacing
    \(n\) with \(n''\) leads to the adjusted EBIC (aEBIC)


    \(\text{aEBIC}_\phi(\gamma) = n'' p \log \left( \frac{\text{RSS}(\gamma)}{n''
    p} \right) + v(\gamma) \log(n'' p) + 2\phi \log \binom{np - p}{v(\gamma)}.\)


    Then, \(\gamma\) is chosen such that aEBIC is minimized, yielding the estimated
    coefficients \(\hat{\boldsymbol{\beta}}_j\) for \(j=1, \dots, p\). Clearly, when
    the standardized residuals are independent, \(R(h) = 0\) for \(h > 0\), then \(n''
    = n\), so aEBIC can be used to select \(\gamma\) even in the absence of autocorrelation.


    Finally, the estimated coefficients must be converted into a list of times at
    which faults may have occurred and a list of shifted variables associated with
    each fault. A change point at time \(t+1\) is identified in variable \(j\) when
    the estimated \(\hat{\beta}_{j,t} \neq \hat{\beta}_{j,t+1}\). To reduce the number
    of faults detected within a few time steps of each other, change points are ordered
    from first to last and, if any additional change points are identified within
    \(\kappa\) time steps of the previous change point, they are combined into a single
    fault. The parameter \(\kappa\) is set to be relatively small so that shifts in
    multiple variables detected within a small window in time are associated with
    the same fault, but two distinct faults are not combined into a single fault.


    An estimate of the shift size and direction in the standardized residuals, \(\delta_{j,t}\),
    for the \(j\)th variable at time \(t\) is


    \(\hat{\delta}_{j,t} = \max_{t_1, t_2 \in \{t-l+1, ..., t+\kappa\}} |\hat{\beta}_{j,t_1}
    - \hat{\beta}_{j,t_2}| \cdot \text{sign}(\max \text{ difference}).\)'
