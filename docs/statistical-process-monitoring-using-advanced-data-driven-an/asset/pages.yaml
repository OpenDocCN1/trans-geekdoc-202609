    # ### 4.5.1 Application of plug flow reactor


    Here, the detection performance of NLPLS-based monitoring methods is assessed
    using simulated plug flow reactor (PFR) data. PFRs, or piston flow reactors, consist
    of a hollow pipe in which reactants travel [79]. Fig. 4.13 displays an example
    of a schematic representation of a PFR having tubular form wrapped with an acrylic
    mold that is encased in a tank. To keep a relatively stable reactant temperature,
    water at a controlled temperature is passed via the tank. PFRs are widely used
    in either gas or liquid-phase systems. Two first-order reactions are performed
    in the reactor, based on the reactant species, A:


    ```

    \(A \rightarrow B \rightarrow C\)

