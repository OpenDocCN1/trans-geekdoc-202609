    # 2.2.2.2 Principal component regression


    PCR is an alternative to OLS regression for addressing the issue of ill-conditioning
    or collinearity in multivariate linear regression, which results in a poor estimation
    of the model parameters. PCR is a linear regression approach that can handle highly
    correlated process variables by latent variables as regressors in the regression.
    It can be implemented in two steps. The first step in PCR consists of projecting
    the input variables via PCA to account for collinearity and reduce their dimensions.
    To this end, SVD is frequently employed to compute the PCs. In the second step,
    OLS regression is conducted between the retained PCs and the response [14, 11]
    (Fig. 2.2).


    To sum up, the key idea of PCR is to use uncorrelated l score vectors from the
    PCA instead of the l columns in **X**. Specifically, the multicollinearity among
    the predictor variables can be eliminated by using a subset of orthogonal PCs
    from the input data **X** via PCA. Then, OLS is performed between the response
    variable **Y** and the retained l PCs of **X**. From the PCA model, the matrix
    **X** can'
