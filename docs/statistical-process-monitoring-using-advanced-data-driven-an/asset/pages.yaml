- pgno: 321
  md: '# # STATISTICAL PROCESS MONITORING USING ADVANCED DATA-DRIVEN AND DEEP LEARNING
    APPROACHES

    Theory and Practical Applications


    Provides an in-depth understanding of fault detection and attribution in complex
    and multivariate systems


    Due to advances in technology, researchers today face chemical engineering and
    environmental processes that have become far more complex, with multiple key variables
    that need to be monitored simultaneously. *Statistical Process Monitoring using
    Advanced Data-Driven and Deep Learning Approaches* tackles multivariate challenges
    in process monitoring by merging the advantages of univariate and traditional
    multivariate techniques to enhance their performance and widen their practical
    applicability. The book proceeds with merging the desirable properties of shallow
    learning approaches—such as a one-class support vector machine and k-nearest neighbors
    and unsupervised deep learning approaches—to develop more sophisticated and efficient
    monitoring techniques. These developed approaches are applied to monitor many
    processes, such as wastewater treatment plants, detection of obstacles in driving
    environments for autonomous robots and vehicles, robot swarm, chemical processes
    (continuous stirred tank reactor, plug flow rector, and distillation columns),
    ozone pollution, road traffic congestion, and solar photovoltaic systems. *Statistical
    Process Monitoring using Advanced Data-Driven and Deep Learning Approaches* provides
    a concise guide for practitioners and researchers in academia and industry working
    in chemical and environmental engineering.


    # ## Key Features


    +   - Familiarizes the reader with the most suitable data-driven based techniques
    in statistical process modeling, including multivariate statistical techniques
    and deep learning-based methods

    +   - Provides an in-depth understanding of fault detection and attribution in
    complex and multivariate systems

    +   - Includes case studies and comparison of different methods


    **Fouzi Harrou** received his PhD in systems organization and security from the
    University of Technology of Troyes in Troyes, France. After holding many prior
    research positions, since 2015 he has been a post-doctoral fellow at the Division
    of Computer, Electrical, and Mathematical Sciences and Engineering at King Abdullah
    University of Science and Technology.


    **Ying Sun** received her PhD in statistics from Texas A&M University in 2011,
    followed by a two-year postdoctoral research position at the Statistical and Applied
    Mathematical Sciences Institute and at the University of Chicago. Previously an
    assistant professor at Ohio State University, she is currently a researcher at
    King Abdullah University of Science and Technology, where she founded and now
    leads an environmental statistics research group.


    **Amanda S. Hering** received her PhD from Texas A&M University in statistics
    in 2009 and is currently an associate professor at Baylor University in Waco,
    Texas. Her research interests are in modeling big, multivariate, spatial datasets;
    developing methods for categorical spatial data; and detecting outliers and faults
    for process and data control.


    **Muddu Madakyaru** received his PhD in process control from the Indian Institute
    of Technology in Mumbai, India and is an associate professor in the Department
    of Chemical Engineering at the Manipal Institute of Technology, Manipal Academy
    of Higher Education, India. His research interests are in advanced process control,
    including system identification, fault detection and diagnosis, model predictive
    control and latent variable regression modeling using wavelets.


    **Abdelkader Daiiri** received his PhD degree in computer science from University
    of Oran 1 Ahmed Ben Bella in Algeria. With over 20 years of programming experience,
    he has held positions such as senior Oracle database administrator (DBA) and enterprise
    resource planning (ERP) manager. His research interests include deep learning
    approach for autonomous robot navigation, computer vision, image processing, and
    mobile robotics.'
