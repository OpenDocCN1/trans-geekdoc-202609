  md: '# 6.2.3.2 k-Nearest neighbor clustering


    Here, we briefly present the k-nearest neighbor (kNN) method, which is a simple
    and effective nonparametric clustering procedure to cluster different features
    [41,42]. kNN is an assumption-free clustering procedure that does not consider
    a priori assumptions about the data structure [43]. This makes it very appealing,
    in particular to handle non-Gaussian or nonlinear features separation. Basically,
    kNN as a distance-based procedure rests on the following intuitive concept: for
    a new unlabeled observation, x, the kNN discovers the nearest observation in the
    training data and attributes x to the closest class and most frequently within
    the k-nearest neighbors.


    When kNN procedure is used for anomaly detection, we have only normal operation
    data available as training data (i.e., only one class of data). In this case,
    kNN computes the distance between the newly arrived unlabeled data point, x, and
    the k nearest neighbors in the training data, and if the distance is relatively
    close to zero, then the measurement is anomaly-free data. Otherwise, it is considered
    as a potential anomaly. Essentially, large kNN distances are used as an anomaly
    indicator. Euclidean and Minkowski distances are frequently used to compute the
    closeness in kNN-based procedures.


    Fig. 6.4 gives a simple example to illustrate the intuitive idea of the kNN procedure.
    Two different classes are present in the data represented respectively with blue
    circles and yellow squares (i.e., anomaly-free and anomalous); the green star
    is the observation to be classified using the kNN procedure. As an example, in
    the case when the number of the nearest neighbors is selected to be k = 1, then
    the green star is assigned to the yellow square class. Here we used Euclidean
    distance to identify nearest neighbors. On the other hand, if we fix k = 5, the
    green star will be attributed to the class with blue circles. This is because
    the number of blue circles is larger than the number of yellow squares in this
    case (within the dashed circles, k = 5). In fact, the kNN procedure does


