  md: 'multivariate process [111]. MCUSUM was first introduced in [112] as a natural
    version of the univariate CUSUM scheme to deal with multivariate data. Numerous
    extensions of MCUSUM have been developed [112–114]. In this subsection, to simplify
    the presentation, we only present the MCUSUM scheme, which received considerable
    consideration in the literature, developed in [112]. Let \(\mathbf{X}_t = (X_1,
    X_2, \dots, X_p)^T\), be a sequence of i.i.d. \(\mathcal{N}_p(\mu, \Sigma)\),
    where \(X_i \in \mathbb{R}^m\); \(m\) is the number of variables. The MCUSUM decision
    statistic to plot is


    ```

    \( S_t = \sqrt{L_t^T \Sigma^{-1} L_t}, \) (2.59)

    ```


    where


    ```

    \( L_t = \left\{ \begin{array}{ll} 0 \text{ if } C_t \le k, \\ (L_{t-1} + X_t
    - \mu_0)(1 - \frac{k}{C_t}) \text{ otherwise,} \end{array} \right. \) (2.60)

    ```


    and


    ```

    \( C_t = \sqrt{(L_{t-1} + X_t - \mu_0)^T \Sigma^{-1} (L_{t-1} + X_t - \mu_0)}.
    \) (2.61)

    ```


    Crosier [109], recommended using \(L_0 = 0\) and \(K = \frac{\sqrt{(\mu_1-\mu_0)^T
    \Sigma^{-1}(\mu_1-\mu_0)}}{2}\). The MCUSUM scheme signals faults when


    ```

    \( S_t = \sqrt{L_t^T \Sigma^{-1} L_t} > H, \) (2.62)

    ```


    where the decision threshold \(H\) is computed via simulation to reach the desired
    probability of a false alarm.


    # 2.4.3.3 Multivariate exponentially weighted moving average scheme (MEWMA)


    The MEWMA scheme was designed by Lowry et al. [115] as a multivariate extension
    of EWMA for detection faults occurring in the mean of multivariate data. The desirable
    characteristic of MEWMA is its capacity to detect small changes in multivariate
    correlated process variables by incorporating all information from the available
    datasets in the decision function. It has been widely used in several applications
    such as renewable energy [116,117], air quality monitoring [118], industrial processes,
    and medical healthcare.


    Let \(\mathbf{X}_t = (X_1, X_2, \dots, X_m)^T\) be an \(m\)-dimensional set of
    measurements at time \(t\). The MEWMA scheme designed by Lowry et al. [115] is
    given by


    ```

    \(\left\{ \begin{array}{ll} Z_0 = \mu_0, \\ \mathbf{Z}_t = \Gamma \mathbf{X}_t
    + (\mathbf{I}_{m \times m} - \Gamma)\mathbf{Z}_{t-1} \quad t=1, 2, \dots, n, \end{array}
    \right.\) (2.63)

    ```


    where \(\Gamma = \text{diag}(\gamma_1, \gamma_2, \dots, \gamma_m)\) is a diagonal
    matrix of smoothing parameters, and \(m\) is the number of process variables.
    Designing an MEWMA scheme needs'
