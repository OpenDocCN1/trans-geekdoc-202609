    million people are involved in a road accidents each year globally. Of these,
    20% to 30% are severely injured and 400,000 die. Hence, researchers and practitioners
    are working to design intelligent transportation systems and autonomous vehicles.
    Numerous technologies have been developed to effectively detect obstacles in road
    environments using advanced sensors, including RADAR and LIDAR systems and 3D
    and 360-degree cameras [1,2]. Reliable detection and localization of obstacles
    are central problems that need to be addressed in order to avoid collision during
    autonomous driving. Studies have examined several practical applications involving
    obstacle detection, including swarm robotics, unmanned aerial vehicles, agricultural
    applications, and smart wheelchairs [2,3]. The aim of this chapter is to detect
    obstacles faced by autonomous robots in indoor environments using stereovision.


