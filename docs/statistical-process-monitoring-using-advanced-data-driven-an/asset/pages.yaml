    ```


    Here \(\widehat{\mathbf{T}} \in \mathbb{R}^{n \times l}\) is the PC matrix (\(n
    \times l\)), which describes the values of variables in the transformed (\(n \times
    l\)) basic space spanned by \(\widehat{\mathbf{W}}\), while \(l\) is chosen to
    capture most of the variability in the data, and no relevant information is lost
    in \(\mathbf{E}\). The matrices \(\widetilde{\mathbf{W}}\widetilde{\mathbf{W}}^T\)
    and \((\mathbf{I}_m - \widetilde{\mathbf{W}}\widetilde{\mathbf{W}}^T)\) span the
