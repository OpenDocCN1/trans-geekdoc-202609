    # 2.4 Process monitoring methods


    Detecting anomalies in industrial processes plays a core role in developing efficient
    production systems that have acceptable performance and meet the desired requirements
    and specifications. Without an efficient detection procedure, chemical processes
    such as distillation columns would be damaged by unexpected faults and could result
    in financial losses and serious damages. Univariate statistical monitoring schemes
    are widely applied in numerous production processes as tools for checking product
    quality when the inspected variable is univariate. The goal of statistical process
    monitoring schemes is to uncover any deviation of the supervised process from
    the desired performance. For many decades, these univariate schemes were frequently
    applied in quality control applications, and now they have been extended to many
    other fields, such as air quality [29], cybersecurity [52], healthcare systems
    [53,54], and economics [53]. In this section, we describe the essence of some
    basic univariate monitoring schemes, such as Shewhart, CUSUM, EWMA, and GLR charts.


    # 2.4.1 Univariate chart for process monitoring


    In this subsection, we summarize univariate process monitoring charts including
    Shewhart, CUSUM, EWMA, and GLR.


    # 2.4.1.1 Shewhart-based monitoring scheme


    Shewhart introduced the Shewhart monitoring scheme in 1931 to supervise the product
    quality at different phases of a manufacturing process [55]. In practice, this
    monitoring chart is one of the most frequently applied statistical quality control
    schemes [55]. Instead of waiting to examine the quality of the final product,
    early inspection and monitoring would enable companies save costs with regards
    to inspection and rejection of the finished product [55]. This would help'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'ensure that uniform quality of products is maintained, thus leading to increased
    economic benefits and improved time efficiency. Statistical decisions in Shewhart
    schemes are based on current observations and no memory about the past is considered.
    Thus, they are suitable for detecting relatively large faults. The Shewhart chart
    is used online to evaluate the process performance based on the current measured
    data.


    Consider that $(x_1, x_2, \dots, x_n)$ are individual observations received from
    the supervised process. Shewhart schemes are designed under the assumption that
    the measurements are uncorrelated and the data under normal operating conditions
    are normally distributed [55]. If these two assumptions are verified, the control
    limits of the Shewhart chart are defined as [55,56]


    $$UCL, LCL = \mu_0 \pm z_{1-\frac{\alpha}{2}} \sigma_0, \tag{2.27}$$


    UCL and LCL denote the upper control limit (UCL) and the lower control limit (LCL)
    while $z_{1-\frac{\alpha}{2}}$ is the $(1 - \frac{\alpha}{2})$th quartile of the
    Gaussian distribution $\mathcal{N}(0, 1)$. Also $\mu_0$ and $\sigma_0$ represent
    the mean and standard deviation of the measurements without anomalies. The term
    $z_{1-\frac{\alpha}{2}}$ is usually called the width of the control limits and
    it is generally fixed to be 3, which is equivalent to a false alarm rate of 0.27%.


    $$x_t < LCL \text{ or } x_t > UCL. \tag{2.28}$$


    In summary, the performance of the Shewhart charts is limited when utilized to
    sense small changes in the process mean. They consider only the current measurement
    of the process, thus they are classified as detection charts without memory. To
    tackle this deficiency, improved mechanisms with increased process memory would
    be very helpful. Memory-type monitoring approaches, such as CUSUM, moving average,
    and EWMA charts, are designed to detect small changes.


    # 2.4.1.2 Cumulative sum (CUSUM)-based monitoring schemes


    Cumulative sum (CUSUM) monitoring schemes are well reputed in fault detection
    and were first introduced by Page [57]. Compared to Shewhart-type approaches,
    the CUSUM schemes are a suitable alternative for detecting small changes, which
    are often a major concern in process monitoring [57]. Instead of using only the
    current measurement, the CUSUM scheme exploits all the available information from
    previous and current measurements to uncover faults. The CUSUM statistic ($S_i$)
    is determined as [58]


    $$S_i = \sum_{j=1}^i (x_j - \mu_0), \tag{2.29}$$


    where $S_i$ is the cumulative sum of all available measurements including the
    current and previously received measurements, and $\mu_0$ is the fault-free process'
