    # 3.2.3.1 Phase I variable selection


    One of the primary goals of a Phase I analysis is to test whether a set of observations
    could reasonably be expected to come from an IC process. As such, data used in
    a Phase I analysis could be contaminated by multiple faults simultaneously. A
    secondary goal may be to retrospectively analyze a fault or multiple faults that
    occurred so that operators may begin to diagnosis them. We present an example
    of each type of analysis in this section.


    Example method 1, mphase1. Capizzi and Masarotto [8] developed a distribution-free
    retrospective change point detection method designed to test for multiple change-points
    over a given period of time, called mphase1. Their approach is designed to first
    test whether the period of time under consideration is IC; if not, then the shifted
    variables can be identified, along with their shift sizes and directions. Their
    method assumes that the observations are iid when the process is IC. It also allows
    for sub grouped data, in which multiple realizations of the process are present
    at a single time points. This allows the user to detect outlying observations
    at a single isolated time point in addition to detecting step shifts. For simplicity,
    we ignore the potential presence of sub grouped observations in our description
    of the method.


