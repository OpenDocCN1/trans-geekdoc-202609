  md: "presented an unsupervised deep learning approach for monitoring multivariate\
    \ process variables. In this approach, the DBN model is coupled with the OCSVM\
    \ algorithm to monitor the operation of a WWTP. The DBN model is used to learn\
    \ complex features from the WWTP data, and the OCSVM algorithm is used to achieve\
    \ good separation of normal and abnormal features. The DBN-OCSVM method showed\
    \ a good detection ability when applied to real data from a decentralized WWTP\
    \ in the USA.\n\n# 8.4.4 Conclusion\n\nIn this chapter, we described successful\
    \ applications of deep-learning-based methods for anomaly detection. In particular,\
    \ we focused on utilizing the advantages of deep learning models to learn features\
    \ and efficiently represent data in order to further improve anomaly detection.\
    \ We showed that deep learning models, as opposed to shallow models, are required\
    \ for efficient data representation. Three applications were used to demonstrate\
    \ the benefits of deep learning models for enhancing anomaly detection performance.\
    \ We merged shallow learning approaches with desirable properties, such as one-class\
    \ SVM, kNN, and unsupervised deep learning, with more sophisticated and efficient\
    \ monitoring techniques, applying the developed approaches to several processes:\
    \ detecting obstacles in driving environments for autonomous vehicles; monitoring\
    \ ozone pollution; and monitoring the operating conditions of wastewater treatment\
    \ plants in Golden, CO, USA.\n\n# References\n\n+   [1] A. Asvadi, C. Premebida,\
