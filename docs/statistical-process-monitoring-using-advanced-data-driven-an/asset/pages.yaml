    # ## 8.3.3 Ozone monitoring based on deep learning approaches


    As discussed previously, in cases in which an analytical model is not available
    to describe process variations, data-driven models can be applied. In this study,
    we used unsupervised deep-learning-based approaches to monitor ozone pollution.
    In this section, we describe the structure of the proposed DBN-OCSVM monitoring
    method (Fig. 8.18). DBN is employed to capture the relevant features of ozone
    concentrations, and OCSVM is applied to detect anomalies. This monitoring method
    is nonparametric because it does not require specification related to the distribution
    of process data, making it able to very flexibly handle ozone data.


    As mentioned above, DBN models are assumption-free, and they are able to extract
    important information from high-dimensionality data and reveal the nonlinearity
    of processes [82]. In the DBN model applied in this study, which contains five
    layers of RBMs, learning is based on greedy layerwise pretraining and the outputs
    of each layer are employed as inputs by the next layer [83]. This means that every
    layer of the DBN is trained independently. The data used to train the first layer
    are gathered from sensors. It is essential to use deep structures'
