- pgno: 233
  md: '# # Unsupervised recurrent deep learning scheme for process monitoring


    # ## 7.1 Introduction


    Recent advances in network and data acquisition technologies have enabled the
    automatic collection of large datasets in engineering and environmental processes.
    Such advances have made multivariate time series measurements ubiquitous in everyday
    life, such as data outputs from wind turbines plants, the effluent measurements
    in wastewater treatment plants (WWTP), and air quality data, to name just a few.
    In addition, data on process operations may also be very useful for prediction
    and supervision of the quality of end products.


    Handling and extracting the relevant features in multivariate time series data
    from real processes is challenging because of the dynamic dependencies between
    multiple variables. Vector autoregression (VAR) models are commonly used to capture
    correlations in multivariate time series data because of their simplicity [1,2].
    As a natural extension of univariate AR models, VAR models fail to recognize the
    dependencies among output variables. To address this, a variety of VAR models
    have been designed, such as structured VAR models, to provide a better description
    of the dependencies between a large number of variables [3]. However, the main
    limitation of using VAR for a large dataset is its linear growth with increasing
    temporal window size, and its quadratic growth with the increasing number of variables.
    Thus, VAR models are unsuitable and prone to overfitting when handling long-term
    temporal patterns. In other studies, linear regression models such as support
    vector regression and ridge regression LASSO [4] models have been used for modeling
    multivariate time series data. Similarly to VARs, these modeling approaches are
    not suitable for observing nonlinear relationships between process variables.
    Gaussian processes (GP) can also be applied to model multivariate time series
    [5]. However, the use of GP models is restricted by their high computational complexity.
    For instance, implementing GP models to forecast multivariate time series can
    have cubic complexity in the number of samples because of the inversion of the
    kernel matrix.


    Deep learning techniques have emerged in recent years as an efficient tool to
    extract pertinent information from large and complex datasets. Several deep learning
    techniques have been designed to address practical problems such as'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'pattern recognition and regression analysis and prediction [6–8]. Indeed, one
    of the major limitations of traditional neural networks is their feed-forward
    structure with no recurrence, which is inappropriate for handling input data with
    periodicity (sequence) and time dependencies. In analogy, the human brain, in
    order to better understand information from text, speech, or even video, can make
    use of both historical and actual received situations. In text or speech, for
    instance, previously received words help in understanding current words and predicting
    the following words. The output of the last cycle is used to feed the new cycle,
    forming a loop; hence the recurrent architecture. Recurrent neural networks’ (RNNs)
    architecture benefits from the inner loop and state (memory) to maintain information,
    making them suitable to address time-dependent learning problems. They were originally
    designed for language models, due to their capacity to memorize long-term dependencies.
    RNNs are considered to be deep in time, which becomes evident when they are unfolded
    in time. This property is helpful for the training phase, especially for updating
    weights (gradients error) based on backpropagation through time (BPTT). RNNs have
    been widely and successfully exploited by researchers for a wide range of real
    applications. Simple RNNs can deal with input data containing short-term dependencies
    very well, but they are unfortunately not efficient at learning and discovering
    dependencies over time when historical information becomes too large. Specifically,
    when time lags become too large, gradients of RNNs may disappear through unfolding
    RNNs into very deep feed-forward neural networks. In short, RNNs usually fail
    to capture very long-term dependencies due to gradient vanishing.


    A new extension of RNNs has been designed to address this problem, called long
    short-term memory network (LSTM) and gated recurrent unit (GRU), that incorporate
    two important mechanisms, the states (memory) and gate, into the conventional
    RNNs [9,10]. In LSTM and GRU, the memory cells have the ability to determine when
    certain information needs to be forgotten and determine the optimal time lags.
    In addition, gates provide a way to regulate the information flow-through, using
    a sigmoid neural network layer followed by a pointwise multiplication operation.
    RNNs-based algorithms have been demonstrated to be efficient in several applications,
    such as polyphonic music generation, intrusion detection, and gesture recognition.


    In recent years, enhanced extensions have been designed by merging the desirable
    features of RNN and LSTM with the function to delineate complex distributions
    from restricted Boltzmann machines (RBM) and deep belief networks (DBN). Here,
    we provide a brief description of hybrid RNN-RBM, LSTM-RBM, and LSTM-DBM methods.
    These deep learning hybrid models have shown promising results in modeling dependency
    in time series data. The purpose of this chapter is to design a reliable and flexible
    anomaly/fault detection scheme to uncover anomalies in multivariate time series
    data. To this end, we integrated the powerful RNNs-based models with various clustering
    algorithms to uncover temporal dependencies in multivariate time series. We employed
    the RNNs models for modeling under normal conditions, and we then'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'used the prediction errors to identify anomalies. We assessed the detection
    sensitivity of RNN, RBM, and hybrid models-based clustering algorithms using actual
    measurements from a coastal municipal WWTP.


    The chapter is structured as follows. Section 7.2 presents foundational concepts
    of RNN, LSTM, and GRU models and describes the hybrid deep learning techniques,
    including RNN-RBM, LSTM-RBM, and LSTM-DBN. Section 7.3 presents the anomaly detection
    problem by integrating recurrent deep learning with binary clustering algorithms.
    Section 7.4 verifies the effectiveness of the studied approaches using real data,
    and conclusions are summarized in Sect. 7.5.


    # ## 7.2 Recurrent neural networks approach


    Accurate modeling of serially dependent sequences is important because data from
    engineering and environmental processes are inherently sequential. In traditional
    neural networks, such as feedforward neural networks, modeling or decision-making
    is based on the actual inputs, and no memory on the past is considered. In other
    words, these networks ignore past data and assume the nonexistence of dependencies
    since there are no cycle loops in the network. However, in practice, the decision
    at time step t can be affected by the output of the network at time step t − 1.
    Thus, these models are not suitable for describing sequential dependent data.
    This limitation can be mitigated by incorporating the information from the actual
    and past measurements in the modeling process. RNNs can deal with temporal dependencies
    because their design permits the consideration of the actual input and also the
    previously received inputs, and the possibility of memorizing previous inputs
    due to its internal memory. Another important feature of the RNNs approach is
    the capability to predict and forecast the future of a sequence based only on
    historical data.


    # ## 7.2.1 Basics of recurrent neural networks


    As discussed above, RNNs are an efficient tool used to deal with complex and nonlinear
    dependencies in multivariate times series data. Generally speaking, RNNs are able
    to review information at each time point and choose the pertinent information
    to appropriately generate the outputs. RNNs can be trained to retain information
    in the long term through discovering features and modeling sequential (time) dependencies
    from the training dataset. The efficiency of RNNs has been proven over the last
    decade through several applications involving sequential or temporal data [11,10,12,13].
    This success can be attributed to their ability to extract complex nonlinearity
    between data point in the training dataset and project them onto a new feature
    space. RNNs have been widely exploited in speech recognition, natural language
    processing, and machine translation.


    The so-called simple RNNs, or vanilla RNNs, with a single hidden layer comprise
    a memory h that permits summarizing the past in order to predict the future. Generally
    speaking, RNNs predict the output Oₜ by using the input'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'vector, **x**_t_, and the memory state, **h**_t_. The memory state **h** of
    VRNNs is updated with the recurrence formula


    **h**_t_ = \(\sigma(\mathbf{V}\mathbf{h}_{t-1} + \mathbf{U}\mathbf{x}_t),\) (7.1)


    where \(\sigma\) is the activation function, and matrices **V** and **U** are
    trained to properly update the history vector **h**. Then, the predicted output
    **O**_t_ can be obtained by


    **O**_t_ = **Wh**_t_,\hfill (7.2)


    where the weight matrix **W** is trained to use the history **h** and predict
    the next output. The weights matrices, **V**, **U**, and **W**, represent the
    internal parameters of the RNN. The dynamic behavior and prediction of the RNN
    changes by updating these internal parameters, which can be computed by backpropagation.
    RNNs uncover and learn temporal dependencies in time series data by using the
    former output as inputs in addition to the actual input and recent past inputs
    to generate new outputs, as shown in Fig. 7.1. The architecture of the RNN model
    was designed using nonlinear stacked units, where links between units form a directed
    cycle (Fig. 7.1).


    ![](img/aa2f42c739937b682075082233e335bb_236_0.png)


    **FIGURE 7.1** A basic illustrative representation of RNN.


    Note that RNNs are very deep in time when unrolled [14]. The architecture of RNNs
    improves feature extraction and discovery of long-term dependencies from sequential
    time-series data. RNN is designed to model time varying or sequential patterns
    of input, where the input can have fixed or variable size, while the size of the
    RNN output is fixed. Of course, RNNs are characterized by feedback. RNN topology
    is represented as closed loop connections, equipped with a memory that captures
    and stores the information processed so far.


    The ability of multiple mapping schemes is not supported in the traditional neural
    network based on the feed-forward mechanism; this kind of network architecture
    supports only a fixed input and output size. Another desirable property of RNNs
    is their capability to handle input variables with various sizes, which makes
    them very useful for operating over sequences of vectors. In other words, RNNs
    are able to map input sequences to produce output sequences, where the length
    or size of the inputs depends on data nature and structure (Fig. 7.2). Below are
    a few examples to clarify this more concretely.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/aa2f42c739937b682075082233e335bb_237_0.png)


    FIGURE 7.2 Different configurations of the RNN model.


    **Single to multiple.** In the case of image captioning, the network takes the
    input pixels of an image and generates a sequence of words.


    **Multiple to single.** Such a situation appears in sentiment analysis, where
    the input is a sequence of words, while for the output the network generates a
    single Boolean classification of *true or false* (i.e., positive or negative sentiments).
    Another example is in voice classification which is based on a sequence of voice
    records, and the network identifies the speaker.


    **Multiple to Multiple (a).** This happens in the case of language translation,
    for instance, from English to Arabic.


    **Multiple to Multiple (b).** This case is of video captioning and video classification.


    RNNs have been widely exploited to capture relevant dependencies in time series.
    However, in training deep neural networks, RNNs can face two common problems of
    vanishing and exploding gradients, where the error gradients can increase to explosion
    or decrease to vanishing (close to zero). Indeed, the error gradients are employed
    for updating weights. The problem becomes more severe when increasing the depth
    of the network. Several techniques have been developed to alleviate the problem
    of exploding gradients: changing the network design to make it shallower, using
    a gradient clipping approach that aims to threshold the error gradients, and using
    weight regularization to reduce the severity through $L_1$ or $L_2$ penalties
    on the recurrent weights.


    # 7.2.2 Long short-term memory


    Machine learning has been researched extensively over the past three decades.
    Conventional neural networks are one such intensively used machine learning approach.
    As mentioned above, the main characteristics underlying these networks are the
    presence of full connections between adjacent layers and the absence of connections
    between the nodes within the same layer. Thus, this type of network is suited
    to handle sequential data and describe temporal dependencies in the data because
    it considers only the current measurement and without memorizing past measurements.
    As discussed above, to overcome this problem, the internal memory of an RNN has
    been used to handle sequential data by considering the actual and previously received
    measurements. In other'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'words, the hidden units in an RNN receive feedback from the previous state
    to the current state. Because the depth of the RNN is the time span, information
    can be lost through time and the error can propagate back. Accordingly, the accuracy
    of the RNN can be degraded when the time span becomes longer due to the vanishing
    gradient and exploding gradient problems. To address this issue, long short-term
    memory (LSTM), which is an extended version of RNN, was first introduced by Hochreiter
    and Schmidhuber [15] in 1997. LSTM models have been largely utilized in many applications,
    including handwriting recognition [16], language modeling [17] and translation
    [18,19], acoustic modeling of speech [20], speech synthesis [21,22], protein structure
    prediction [23–25], and analysis of audio and video data [26–30]. Moreover, in
    the modern LSTM architecture, there are peephole connections between internal
    cells and the gates in the same cell for learning the accurate timing of the outputs
    [31]. This section first provides an overview of LSTMs and then discusses how
    they can be used for modeling and process monitoring. We also describe gated recurrent
    units (GRU), another improved version of RNNs.


    The LSTMs are designed as an extension of simple RNNs to solve the vanishing gradient
    problem by explicitly incorporating a memory unit into the network. They are based
    on memories and gates making them suitable for learning long-term dependencies.
    Fig. 7.3 displays a schematic representation of an LSTM.


    ![](img/aa2f42c739937b682075082233e335bb_238_0.png)


    **Inputs:**

    - Input vector

    - Memory from previous block

    - Output of previous block


    **Outputs:**

    - Memory from current block

    - Output of current block


    **Nonlinearities:**

    - Sigmoid

    - Hyperbolic tangent


    **Vectors operations:**

    - Element-wise Summation/Concatenation

    - Element-wise multiplication


    FIGURE 7.3 A basic illustrative representation of an LSTM unit.


    The principal component of LSTM resides in its cell state, which is the horizontal
    chain shown in the top of the graph (Fig. 7.4). In LSTM, information can be removed
    or added to the cell by using structures called gates.


    We designed a common LSTM model as a concatenation of several cell units instead
    of conventional neural network layers. We now briefly investigate the properties
    of the LSTM unit. As shown in Fig. 7.3, an LSTM cell comprises three inputs: X<sub>t</sub>
    is the input observation at the current time point, h<sub>t-1</sub> represents
    the output generated from the preceding LSTM cell, and C<sub>t-1</sub> denotes'
