  md: '![](img/aa2f42c739937b682075082233e335bb_270_0.png)


    FIGURE 8.4 Diagrammatic illustration of a stacked autoencoder.


    A stacked autoencoder is formed of several layers (see Fig. 8.4), each of which
    is an autoencoder. The outputs of each layer feed the next layer in a greedy layerwise
    way. The encoding process is implemented by encoding each layer in a forwarding
    order, and the decoding process is performed in reverse order. Stacked autoencoders
    have been applied for different purposes, including content-based image retrieval,
    image denoising [43,44], and medical object recognition [45].


    # 8.2.1.2 The SDA-kNN obstacle detection approach


    Several advanced sensors have been designed for concise and effective obstacle
    detection in autonomous vehicles and robots, including RADAR and LIDAR systems
    and 3D cameras [46,1]. However, these sensors have a high cost and require continuous
    maintenance. In addition, it is sometimes challenging to synchronize data from
    different sources. To overcome these drawbacks, vision-based methods have been
    designed to automatically detect and localize obstacles [42,41,47]. Such methods
    primarily use multiple views based on visual sensors that are able to obtain depth
    information and see 3D components in a scene. Binocular stereovision, which uses
    two rectified images (left and right) to create a disparity map, has attracted
    much attention among researchers. This method mimics human eyes by observing one
    scene from two different viewpoints [42,41,40].


    An effective solution to all the above-mentioned challenges is to merge the benefits
    of deep learning models with nonparametric clustering methods to detect obstacles
    with stereovision. In this section, we present an approach that merges DSA modeling
    with the kNN algorithm. Essentially, the DSA model is used to model obstacle-free
    scenes, and the kNN algorithm is applied to the features extracted using DSA in
    order to reveal obstacles. This approach is advantageous because DSA is an assumption-free
    model, it captures relevant'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'features from a V-disparity map, and it has greedy learning properties and
    the capacity for dimensionality reduction. In addition, the kNN is an unsupervised
    and nonparametric clustering algorithm that does not require linear or Gaussian
    distribution of input data.


    The DSA-based kNN method detects obstacles as anomalies using a V-disparity map.
    The V-disparity of images perceived in urban environments without obstacles is
    relatively stable with weak fluctuations due to measurement noise [34,40], and
    significant variations in V-disparity can be observed when obstacles are present.
    The method includes two steps: first, the V-disparity dataset is used to provide
    unsupervised greedy layerwise training to the deep encoder, and second, kNN is
    used to reveal potential obstacles. The kNN scheme is trained using features extracted
    with the DSA model based on an obstacle-free scene. This allows the kNN scheme
    to separate free and busy scenes in the testing data.


    The objective of the monitoring system is to promptly detect any obstacles in
    front of an autonomous vehicle or mobile robot that can lead to dangerous accidents.
    In summary, in the DSA-kNN approach, obstacle detection is performed as anomaly
    detection based on features extracted from the DSA model. The kNN is used to identify
    deviations between obstacle-free features and newly extracted features. The DSA-kNN
    obstacle detection scheme is implemented in two stages: feature generation and
    feature evaluation:


    Stage 1. The objective of the first stage is to learn relevant information from
    the V-disparity map to generate features that are sensitive to the presence of
    obstacles. To this end, a normalized V-disparity map is used as an input for the
    DSA model. Then, a reference SDA model is constructed using unsupervised greedy
    layer-wise training with unlabeled data. This model has four layers. The role
    of each is to learn complex and hierarchical features, and the output of the $i$th
    layer feeds the next $(i + 1)$ layer. Additionally, each layer discovers useful
    features and reduces dimensionality through encoding. Then, the extracted features
    are utilized for monitoring. The main advantage of DSA is its capacity to learn
    pertinent information from complex distributed data and produce low-dimensionality
    outputs. One of the key purposes in training the DSA model is to minimize reconstruction
    errors computed through cross-entropy (represented by $\mathcal{L}$ in Eq. (8.3)).
    Cross-entropy is a commonly used metric for evaluating deep learning models. Optimization
    is achieved by minimizing cross-entropy by quantifying the mismatch between two
    probability distributions of the input data and the estimation of the DSA model.
    The DSA model is selected when the dissimilarity between the two distributions
    decreases, which means that cross-entropy converges near zero [44]:


    ```

    $$\mathcal{L}(X, \hat{X}) = - \sum_i^n \sum_j^m (\hat{x}_{ij} \log(x_{ij}) + (1
    - \hat{x}_{ij}) \log(1 - x_{ij})) \quad (8.3)$$

    ```'
