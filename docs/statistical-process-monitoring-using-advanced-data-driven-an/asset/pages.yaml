  md: '# 8.3 Detecting abnormal ozone measurements using deep learning


    # 8.3.1 Introduction


    In recent years, great attention has been paid to air quality monitoring worldwide,
    particularly after the 2015 United Nations Climate Change Conference (COP 21)
    [50,51]. Ozone (O₃) is a critical air pollutant that has a negative impact on
    human health [50,51]. It is created by a chemical reaction of volatile organic
    compounds (VOCs) and nitrogen [50,51]. High concentrations of ozone, which are
    usually observed in the summer under high temperatures and in bright sunlight
    conditions, can lead to an air quality issue called photochemical smog [52–54].
    High levels of ozone are frequently reported in urban zones, particularly in industrial
    countries, such as China and France [55,56]. Reliable detection of ozone pollution
    is crucial for informing and alerting people of the need to avoid exposure to
    severe pollution, protecting public health, and managing air quality [57,58].


    Over the years, several methods for detecting atypical ozone pollution have been
    developed. In [59], the multivariate Seasonal AutoRegressive Moving Average with
    eXogenous variable (SARMAX) method was used with a constrained generalized likelihood
    (CGLR) approach for detecting abnormal ozone levels, which may be caused by sensor
    faults or ozone pollution. SARMAX was used as a reference model to describe the
    ambient temperature and generate the residuals that were used by the CGLR approach
    for identifying abnormal measurements. Ozone measurements from the Upper Normandy
    region of France were used for validation. However, the SARMAX is a linear model
    and therefore was not appropriate to describe nonlinear features of ozone data.
    In [59,56], a statistical method for detecting abnormality in ozone concentrations
    was proposed. This method is based on the joint use of principal component analysis
    (PCA) and the multivariate exponentially weighted moving average (MEWMA). MEWMA
    was used to monitor the principal components with the smallest variances (i.e.,
    residuals). The sensitivity of MEWMA to incipient changes was investigated to
    improve the detection capability of the PCA-based approach. Since the PCA is a
    static model, it failed to describe dynamic features in data. Additionally, the
    MEWMA scheme was designed based on the assumption of Gaussianity, which limits
    the efficiency of this approach for detecting non-Gaussian data. The method described
    in [60] used stochastic modeling and a generalized likelihood ratio (GLR) test
    to detect biases in the sensors used to measure ozone concentrations and, in doing
    so, to improve the quality of the gathered ozone measurements. To obtain a reasonable
    ozone model, nitrogen dioxide concentrations and temperature values were used
    as input variables. The GLR detection threshold was determined based on Monte
    Carlo simulations. This kind of algorithm could be implemented to further improve
    the maintenance of air pollution monitoring sites by detecting faulty instruments,
    but it is not designed for promptly detecting abnormal ozone pollution. Other
    works focused on assess-'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'ing data quality to minimize the costs of managing ozone air-quality monitoring
    networks [61–63]. For instance, In [63], an approach using a winner filter and
    hypothesis testing was introduced to detect sensor malfunctions in air quality
    monitoring networks. Daily ozone measurements from the Houston air quality monitoring
    network were used for validation. The proposed method involves applying individual
    thresholds to every sensor so that the false alarm rate can be approximately fixed
    within a network. Based on the analysis performed in [63], studying real-time
    detection of abnormal ozone measurements is important for not only checking the
    accuracy of monitoring sensor networks and checking the quality of collected data
    but also for alerting the population when ozone pollution exceeds the warning
    limits.


    Real-time detection of atypical ozone measurements can prevent further damage
    to sensor networks and offer relevant information to people in order to improve
    human safety and avoid undesirable consequences. Ozone pollution can be detected
    using model-based or data-based monitoring techniques. Designing an accurate analytical
    model of ozone variation is not always feasible and is time-consuming due to the
    complex process through which ozone is produced in the troposphere and high measurement
    uncertainty [64,65]. In many studies, when an analytical model describing ozone
    variations was not available, data-driven methods were applied to predict ozone
    pollution. These methods include time-series models (e.g., the autoregressive
    moving average, or ARMA) [66,67], multiple linear regression methods [60, 69],
    and multivariate latent variable regression methods, such as PCA, partial least
    squares, and principal component regression [59,68]. Recently, modeling and predicting
    air pollutant concentrations using machine learning techniques have become popular
    research areas. Several shallow learning models, including support vector regression
    (SVR) [69,70], fuzzy logic modeling [71], classification and regression trees
    (CART) [72], and artificial neural networks (ANNs) [66,70], have been applied
    to improve the quality of ozone measurement predictions due to their ability to
    capture nonlinear features. However, as these methods have a one- or two-layer
    structure, they are limited in capturing relevant features from complex and high-dimensionality
    data [73,74].


    Due to the limitations of the above-mentioned shallow methods, deep learning methods
    such as stacked autoencoders [75] and DBNs have attracted increasing attention
    in recent years, becoming some of the most widely used methods for feature extraction
    and prediction. Unlike shallow methods, deep learning methods generally lead to
    an improved abstraction of the original data for modeling and prediction. A major
    advantage of deep learning models is their ability to learn the desired features
    from complex processes layer by layer. Furthermore, they are flexible, simple,
    and assumption-free. For these reasons, when extracting important characteristics,
    it is imperative to use deep structures [73, 74]. Successful large-scale applications
    of deep learning have improved traffic management [76,77], health informatics
    [78], pattern recognition [79], detection of cerebral microbleed voxels [80],
    and air quality modeling [81].'
