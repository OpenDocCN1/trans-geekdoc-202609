  md: 'where _m_ is the number of factors retained in the NLPLS model, and \(\lambda_i\)
    is the _i_th eigenvalue of the covariance matrix \(\Sigma\) of the input data
    matrix **X**. The _T_<sup>2</sup> flags out the presence of a possible anomaly
    to indicate that the performance of the process under monitoring is not running
    as designed if _T_<sup>2</sup> > _T_<sup>2</sup>\(_\alpha\), where _T_<sup>2</sup>\(_\alpha\)
    is a detection threshold defined in [55].


    In ANFIS-PLS, the outer model is similar to polynomial PLS, but instead of using
    polynomial functions, a more flexible nonlinear model based on ANFIS is used to
    learn the nonlinearity between input-output LVs.


    The SPE statistic quantifies the information in the data that is not considered
    by the model. It is defined as


    \(\text{SPE} = \|\mathbf{e}\|^2 = \|\mathbf{x} - \hat{\mathbf{x}}\|^2,\) (4.11)


    where **e** is the residual, and \(\hat{\mathbf{x}}\) is the prediction corresponding
    to the input data **x** using the designed NLPLS model. During the absence of
    fault, the value of the _Q_ statistic will be below the detection threshold, \(Q_\alpha\)
    at significance level \(\alpha\) given in [55]. However, if the _Q_ statistic
    exceeds the detection threshold, a fault is flagged out.


    These fault-detection charts are developed with the hypothesis that the underlying
    variables are uncorrelated and Gaussian. It is worth noting that the NLPLS model
    is efficient to monitor nonlinear processes. But using it with detection thresholds
    based on the Gaussian distribution can degrade its effectiveness. Numerous extensions
    of NLPLS-based monitoring have been devised recently, in order to extend its detection
    capabilities. In [44], nonlinear PLS monitoring based on ANFIS is proposed, and
    the kernel density estimation (KDE) is applied to estimate the detection thresholds.
    This makes it possible to not use the theoretical assumptions of _T_<sup>2</sup>
    and SPE detection thresholds and handling non-Gaussian data. In [56], an assumption-free
    ANFIS-PLS method is developed for fault detection in multivariate input-output
    processes. To escape assumptions of ANFIS-PLS''s _T_<sup>2</sup> and _Q_, a novel
    fault indicator with a _k_-nearest neighbor (kNN) and exponential smoothing scheme
    is developed. The exponentially smoothed kNN scheme is applied to residuals for
    the ANFIS-PLS model for detecting anomalies. Since kNN is able to separate anomalies
    from relevant features without making structural hypotheses on data yields, it
    is an elegant and flexible fault indicator, compared with traditional monitoring
    techniques (_T_<sup>2</sup> and _Q_). The key reason for choosing kNN, instead
    of conventional monitoring techniques, is that kNN overcomes the Gaussianity and
    absence of correlation assumptions that are the backbone of methods such as _T_<sup>2</sup>
    and _Q_ [57]. In [58], an approach merging polynomial PLS and Hellinger distance
    (HD)-based schemes has been suggested to improve the sensitivity of NLPLS-based
    methods to small faults in nonlinear processes. Here, HD was used because this
    metric is useful for assessing the deviation between two distributions. Indeed,
    the capacity for detecting small changes between two distributions could be improved
    by applying CUSUM or EWMA to the statistics _T_<sup>2</sup> and _Q_, after appropriately
    selecting the parameters of CUSUM and EWMA.'
