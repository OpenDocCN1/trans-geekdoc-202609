    the memory of the preceding cell. Also, each LSTM cell contains two outputs, \(h_t\)
    and \(C_t\), which are the output of the actual network and the memory of the
    current unit, respectively. It is composed of three kinds of gates, namely the
    input gate, the forget gate, and the output gate (Fig. 7.3). Each gate comprises
    a sigmoid neural net layer and a pointwise multiplication operation. LSTMs can
    be seen when unfolded as a chain-like structure. In other words, it is a loop
    repeating module with a different structure (Fig. 7.5). Depending on the input
    and the internal feedback (memory state), the output will be generated in a special
    manner based on gates and four embedded layers structure. The layers here have
    activation units based on sigmoid and tanh.


    This LSTM unit provides a decision based on the actual input, precedent output
    and memory, and then produces a new output and upgrades its memory.


    +   **Input gate** The key role of the input gate is to control the flow of input
    activation into the memory cell. Here, the sigmoid layer controls the flow by
    generating an output between 0 and 1 into the memory cell.


    +   **Output gate** The aim of the output gate is to control the output flow generated
    from cell activation to be injected into the network. This gate has the sigmoid
    layer that controls how much memory should be fed into the next LSTM unit.


