    hidden variable \(h_j\), and \(b_i\) and \(a_i\) denote respectively bias terms
    of visible and hidden units. The aim of the training is to determine the suitable
    values of these parameters based on some datasets.


    As an energy-based model, the joint probability distribution for the RBM model
    is defined based on energy function as follows:


