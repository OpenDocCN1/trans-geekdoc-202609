    values. On the other hand, observations with some coordinate values significantly
    larger than the others are impacted or related to the dimensional anchors closer
    to these observations. In other words, the larger the value for a specific dimension,
    the closer the projected observation to the associating anchor, and vice versa.
    It is this desirable characteristic that makes RadViz a useful tool to assist
    fault diagnosis. In Fig. 2.9, RadViz is utilized for visualizing multidimensional
    data in a four-dimensional space (Fig. 2.9). The yellow points (light gray in
    print version) in the circumference of the circle, which are called anchor points,
    represent the dimension of the data (e.g., process variables or latent variables).
    In this example, observation B has coordinates (1, 0, 0, 0) and it is placed at
    X1, which means that this observation is fully related to this anchor (variable)
    without any ambiguity. Observation C with coordinates (1, 1, 0, 0) has a large
    correlation with X1 and X2 and low correlation with X3 and X4. Finally, observation
    A with coordinates (1, 1, 1, 1) is placed in the center of the circle, meaning
    that it is impacted in a similar way by all anchors.


    Until now, the RadViz tool has not been well exploited in fault detection and
    diagnose to assist fault isolation. In Sect. 2.6.2, RadViz is used to diagnose
    anomalies in influent measurements at water resource recovery facilities.


