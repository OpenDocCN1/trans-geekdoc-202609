    # 5.8 Discussion


    Early detection of possible failure in complex engineering systems or monitoring
    networks has proven to be particularly challenging. Conventional fault detection
    methods, such as EWMA, CUSUM, and GLR, and their integrated'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'versions including the latent variable regression-based EWMA and the CUSUM
    methods, have shown greater capacity for fault detection, especially for small
    faults. These conventional monitoring schemes are designed on the statistical
    assumptions that the measurements are uncorrelated in time and that they follow
    a Gaussian distribution. However, in many industrial and environmental applications,
    generated measurements are autocorrelated, non-Gaussian, and noisy. Indeed, a
    high amount of noise in the data can hide the key features that are essential
    to detecting faults, ultimately deteriorating the fault detection capacity of
    the monitoring chart. Thus, conventional schemes are unsuited for monitoring autocorrelated
    or non-Gaussian and noisy processes. It has been shown in Sect. 5.4.1 that the
    effectiveness of fault detection in Shewhart charts is degraded when some or all
    of its basic assumptions are violated, such as the deviation from normality, autocorrelation
    in the data, and the presence of high noise levels.


    This flexible wavelet-based modeling approach has been shown to be appropriate
    for autocorrelated, non-Gaussian, and nonstationary processes while capturing
    important features. The wavelet-based multiscale monitoring framework presented
    in this paper can efficiently deal with time-dependent and non-Gaussian measurements.
    Here, it has been shown that the effectiveness of the Shewhart scheme has been
    improved by integrating the Shewhart fault detection scheme with multiscale wavelets.
    Most real processes, however, are multivariate in nature. Therefore, in this paper,
    multiscale LVR-based monitoring schemes have been discussed to handle multiple
    process variables simultaneously.


    It should be noted that the multiscale univariate and multivariate fault detection
    methods presented in this chapter are batches. In other words, they require the
    entire data set to be available a priori, which is due to the fact that multiscale
    representation can only be applied on datasets with a dyadic length, i.e., 2^J,
    where J is an integer. In real plants, however, measurements are continuously
    gathered, and in most cases, monitoring of their key variables is required online.
    Thus, it is necessary for developed multiscale monitoring methods to be extended
    to handle online processes. Also, the conventional (and multiscale) fault detection
    methods assume that the data or residuals are stationary, i.e., their characteristics
    do not change over time. Examples of nonstationarity include changes in the variance
    of residuals (which can be due to wearing or a change in the sensors used) and
    changes in the mean of residuals (which can be due to drifts from one operating
    condition to another). Applying fault detection methods to nonstationary data
    may not provide acceptable performance. Therefore, adaptive multiscale univariate
    and multivariate fault detection methods to deal with nonstationary processes
    are needed.


    Furthermore, the multiscale fault detection methods presented in this paper cannot
    be directly applied to monitor online processes as they require a dyadic set of
    data a priori. This is a limitation of the wavelet-based multiscale decomposition
    algorithm used in these methods. Accordingly, developing online multiscale univariate
    and multivariate monitoring approaches that extend the benefits of these multiscale
    techniques for processes where online monitor-'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'ing is required. One way to alleviate this challenge is to apply fault detection
    on a dataset within the moving window so that a fault captured from the most recent
    data sample can be used as a flag or an indicator of a fault in the process. An
    advantage of this approach is that it can be used to develop both univariate and
    multiscale fault detection methods. Also, from a fault detection point of view,
    since the moving window keeps the largest number of dyadic samples, a more accurate
    estimation of the control limits is expected, as more data become available. However,
    to avoid having a very large window size (which may result in computational burden),
    the size of the window can be fixed after a large enough window length is reached.
    Another issue to consider, when using this approach, is the case when a wavelet
    filter is not Haar. Accordingly, a boundary-corrected version of the filter is
    required to remedy the problem of inaccuracies at the boundaries. This could be
    useful because this online multiscale approach relies more heavily on the more
    recent data samples inside the moving window.


