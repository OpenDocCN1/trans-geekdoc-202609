- pgno: 217
  md: '![](img/aa2f42c739937b682075082233e335bb_217_0.png)


    FIGURE 6.9 Schematic illustration of VAE.


    The central idea behind the VAEs is that its training is performed by minimizing
    the loss function L(x; θ, ϕ) associated with data point x.


    ```

    L(x; θ, ϕ) = E_{q_ϕ(z|x)}[log(p_θ(x|z))] - D_{KL}(q_ϕ(z|x)||p_θ(z)).  (6.14)

    ```


    The first term in this loss function, E_{q_ϕ(z|x)}[log p_θ(x, z)], refers to the
    reconstruction error. It is basically the expectation of the log-likelihood that
    the input can be generated using the sampled values of the inferred distribution.
    It pushes the decoder to learn a reconstruction of the input. The key idea behind
    the VAE is to train a parametric encoder (called an inference network) that produces
    the parameters of q. The second term, D_{KL}(q_ϕ(z|x)||p_θ(z)), denotes the Kullback–Leibler
    divergence between the distribution of the encoded latent vectors q_ϕ(z|x) and
    the desired distribution p_θ(z) which is usually assumed as the standard Gaussian.
    This extra term can be viewed as an adjustment enforced in the feature space.
    It should be noted that to minimize the objective function and get x as close
    as possible to the input vector x̂, the term D_{KL}(q_ϕ(z|x)||p_θ(z)), enforces
    μ and σ towards the zero and the unity vectors, respectively.


    # 6.4.1.2 Denoising autoencoder


    In this section, we discuss denoising autoencoders (DAE), which are a stochastic
    version of conventional autoencoders [55,56,61]. In fact, in the case when the
    AE contains more nodes in the hidden layer than inputs, it can lead to learning
    identically the input and making the autoencoder useless. This is usually called
    learning of identity function that results in the output equaling the input. To
    overcome this difficulty, DAE introduces noise to the training data. Then, in
    DAE the raw input data are reconstructed from the noisy data after the encoding
    and decoding steps. Basically, the essence of the DAE is denoising the noisy input
    by reconstructing the original input in a clean version. Essentially, the DAE
