    where \( k \) is a parameter that is employed as a reference for detecting a change
    in the process mean. If \( S_t \) changes into a negative value, the CUSUM decision
    statistic is automatically set to zero. A fault is flagged out when the CUSUM
    statistic \( S_t \) overpasses the decision threshold, \( H \). In practice, the
    threshold \( H \) of \( 4\sigma \) or \( 5\sigma \), which results in good detection
    of a deviation of about \( 1\sigma \) in the process mean, is recommended [59].
    Here \( \sigma \) is the standard deviation of the monitored variable.


    Numerous variations of the CUSUM exist; one of the most common forms is the two-sided
    CUSUM (tabular) [56]. The recursive formula for high and low side shifts are:


    ```

    $$S_t^+ = \max [0, x_t - (\mu_0 + k) + S_{t-1}^+],$$ (2.32)

    ```


    ```

    $$S_t^- = \max [0, (\mu_0 - k) - x_t + S_{t-1}^-],$$ (2.33)

    ```


    where the statistics \( S^+ \) and \( S^- \) are respectively the upper and lower
    one-sided CUSUMs, and \( S_0^+ = S_0^- = 0, \mu_0 \). A fault is declared if either
    \( S_t^- \) or \( S_t^+ \) exceeds the decision threshold \( H = h\sigma \), where
    \( h \) relies on the shift to be detected.


    # 2.4.1.3 Exponentially weighted moving average (EWMA) schemes


    While CUSUM schemes consider all available measurements with equal weight in process
    monitoring, EWMA schemes exponentially weight the measurements based on their
    importance in characterizing the process [60]. The EWMA shows suitable performance
    in detecting small changes in the process mean. The EWMA scheme was first designed
    by Roberts [61], and was frequently applied in quality control and process monitoring
    [56]. The EWMA monitoring statistic is defined as follows:


    ```

    $$

    \begin{cases}

    z_0 = \mu_0, \\

    z_t = \gamma x_t + (1 - \gamma) z_{t-1},

    \end{cases}

    $$ (2.34)

    ```


    where \( z_0 = \mu_0 \) is the mean of fault-free data, \( \gamma \) is a weighting
    factor with the range \( 0 < \gamma \le 1 \), which defines the temporal memory
    of the EWMA scheme. Eq. (2.34) indicates that the EWMA statistic utilizes all
    the available information to sense small anomalies. To highlight this point, the
    EWMA statistic, \( z_t \),'
