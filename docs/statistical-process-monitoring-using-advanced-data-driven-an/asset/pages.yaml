    # 5.5 Multiscale LVR modeling


    # 5.5.1 Benefits of multiscale denoising in LVR modeling


    Most of the real-world data are multiscale in nature; therefore, a model estimation
    using such data needs to consider the multiscale modeling methods that take into
    account multiscale filtering, using wavelets to increase the efficacy of the latent
    variable regression models. In this section, we highlight the major benefits of
    using multiscale filtering in LVR modeling [76].


    +   * The presence of noise in the measured data degrades the model parameter
    estimation of the LVR models. The measured data are passed through low- and high-pass
    filters constructed from orthonormal basis functions, and subsequently reduce
    the noise embedded in the measurements and results, yielding in a more precise
    prediction.


    +   * Most of the measured data contain noise that are correlated in nature, because
    the source of noise is not independent and random, like the malfunctioning or
    error in sensor calibration, for example. Model parameter estimation becomes challenging
    with the presence of correlated data. Using wavelets for representing correlated
    data makes it decorrelated. This property is very helpful where measurement errors
    are not always random [24].


    The model is developed by making use of the above advantages, which integrate
    the LVR model parameter estimation and multiscale filtering to improve model prediction.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# ## 5.6 Multiscale LVR modeling


    In practice, industrial processes generate multiple time series that need to be
    monitored. Monitoring these process variables individually does not take into
    account the interrelations among the variables and faults that might occur in
    these relationships. Furthermore, the information in the multivariate data is
    important for early detection and high detection performance. Hence, in this section
    a wavelet-based technique to monitor multivariate processes will be discussed.


    The desirable features of wavelet-based multiscale representation are used to
    monitor multivariate processes. Indeed, the majority of monitoring methods, such
    as PCA and PLS, employ a single-time scale and are designed without consideration
    of the multiscale properties of the data. Moreover, most data from industrial
    processes frequently contain relevant features and measurement noise associated
    with both time and frequency. Also, several existing techniques assume uncorrelated
    input data, even though, in practice, time-dependent data are very common. Thus,
    combining wavelets and multivariate monitoring methods (e.g., LVR techniques)
    results in improved detection performance. Various multiscale monitoring methods
    have been applied in the literature for enhancing the prediction quality and the
    robustness of monitoring strategies [34,58,77,78]. For instance, Bayesian multiscale
    monitoring techniques need prior information about the nature of the occurred
    anomalies [79]. However, these methods are not frequently applied in industrial
    applications because of a lack of the required prior information [80]. Several
    methods have been designed in the literature based on information extracted from
    scale-based analysis using wavelets. In [81], an approach is introduced for defect
    detection in rotating equipment by clustering the wavelet coefficients calculated
    from the measured process data. In [82], a monitoring method is proposed to detect
    bearing anomalies of rotating equipment. This method generates features from the
    wavelet coefficients and then applies ANFIS to uncover bearing anomalies. In [83],
    the features generated from DWT are used as input to a neural network for anomaly
    detection and diagnosis of a gearbox system.


    For multivariate process monitoring, multiscale filtering of the raw data improves
    the FD performance of the conventional PCA method [84]; the multiscale PCA (MSPCA)
    algorithm from [34] that constructs multiple PCA models using the wavelet coefficients
    at different scales also shows better monitoring abilities. Indeed, multiscale
    PCA allows the removal of time-dependence by using wavelet decomposition and enables
    PCA to remove the cross-correlation between process variables. In MSPCA, each
    process variable is first decomposed using DWT, the details coefficients are obtained
    at each level from the thresholded coefficients, and then PCA of the details of
    all variables is performed for every level. The PCA scores are then supervised
    via T² and SPE charts to uncover the significant scales that indicate process
    abnormalities. Generally speaking, anomalies can be observed at the final levels,
    and if they persist, the coarser levels are able to sense them, too. The scaling
    coefficient of the coarsest'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'level is less sensitive to change because it is generated last in the decomposition
    procedure. To alleviate this detection delay, the multiscale techniques generally
    control the reconstructed data. After reconstructing data in the time domain,
    PCA is applied to monitor the data, with \(T^2\) and SPE schemes used respectively
    to monitor the principal components and residual subspaces.


    Also, several latent variable methods that use the synergy between the abilities
    of the LVR models are applied to describe the cross-correlation between the input–output
    process variables, and the DWT capability for decorrelating time-dependent processes
    and separating relevant features embedded in noisy data is also used [85,86].
    In [87,88], multiscale PLS models are developed for modeling and fault detection.
    The PLS model is designed using the denoised data obtained after eliminating the
    low-frequency scales characterizing low-frequency components. However, multiscale
    PCA and PLS are designed based on a linearity assumption, which limits their applications.
    To bypass this limitation, several multiscale nonlinear methods are used, such
    as multiscale KPCA and KPLS methods [89]. Specifically, in these methods, KPCA
    and KPLS are used to describe process variable correlations at different levels.
    Comprehensive studies of MSPCA and multiscale LVR can be found in [33,87,89,90].


    Data collected in many environmental and engineering processes exhibit complex
    structures and violate the basic assumptions of conventional approaches. Therefore,
    the need to design methods able to handle complex structures of data is required
    to overcome some so of the limitations of the conventional approaches. Here, we
    present the basic idea behind the multiscale latent variable regression models.
    The essence behind multiscale LVR models is to amalgamate the benefits of multiscale
    denoising and LVR models parameter estimation for extracting maximum information
    from multivariate data, improve the prediction quality and thus enhancing fault
    detection. This integrated framework makes it possible to handle complex data
    structures frequently generated by environmental and engineering processes (e.g.,
    multivariate input–output and multiresolution features), and for representing
    and analyzing data at different resolutions and time scales. Let the observed
    input–output data be **X** and **y**, and their multiscale filtered counterpart
    at a particular scale (\(p\)) be \(\mathbf{X}_p \in \mathbb{R}^{n \times m}\)
    and \(\mathbf{y}_p \in \mathbb{R}^{n \times 1}\), the LVR model based on the filtered
    data is obtained as


    \(\mathbf{y}_p = \mathbf{X}_p \mathbf{b}_p + \epsilon_p,\) (5.10)


    where \(\mathbf{b} \in \mathbb{R}^{m \times 1}\) is the estimated model parameter
    vector, and \(\epsilon_p \in \mathbb{R}^{n \times 1}\) is the model error when
    using the denoised data at scale (\(p\)).


    It should be noted that when filtering the data, using wavelets without considering
    the relationship between the input–output may result in eliminating important
    features that are crucial to the model construction. Thus, a multiscale filtering
    algorithm must be combined with LVR model parameter estimation to proper noise
    denoising. This can be achieved by the following steps schematically illustrated
    in Fig. 5.13:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/aa2f42c739937b682075082233e335bb_189_0.png)


    # FIGURE 5.13 Conceptual schematic of multiscale LVR models.


    +   - Split the given raw measurements in training and testing datasets

    +   - Scale the data to have zero mean and unit variance

    +   - Filter the input–output training data at different scales via wavelets as
    per the algorithm presented in Fig. 5.13

    +   - Develop an LVR model based on the filtered training data at each scale

    +   - Apply the cross-validation method to select the optimum number of principal
    components for the LVR model at each scale

    +   - Validate the estimated model using unseen data set and calculate the mean
    squared error

    +   - Choose the LVR model which gives the lowest cross-validation error


    The multiscale LVR model is first constructed using anomaly-free measurements
    and then used for process monitoring. As discussed above, in multiscale LVR methods,
    each time series data is first decomposed based on wavelet decomposition, and
    an LVR model is then constructed separately using the coefficients from all series
    at each scale (Fig. 5.13). Within the context of multivariate process monitoring
    based on multiscale LVR methods, two popular multivariate statistical schemes,
    the Hotelling T² and Q statistics, are generally used to monitor LV and residual
    subspaces, respectively. However, these two monitoring schemes are ineffective
    in sensing small changes and may lead to unreliable process monitoring [88]. As
    in single scale methods, it is also needed to uncover incipient changes. Several
    methods have been proposed to address this problem'
  merge: -1
