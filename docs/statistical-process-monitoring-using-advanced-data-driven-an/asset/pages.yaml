  md: 'The results show that the DSA-based clustering algorithms have higher detection
    performance than the DBN-based clustering algorithms. In other words, the features
    extracted using DSA based on the V-disparity map are more informative and sensitive
    to the presence of obstacles than the DBN model. This confirms the results obtained
    based on MSVUD and DUSD data sets. Furthermore, compared with the other types
    of machine learning, DSA-kNN has higher detection performance and achieved an
    AUC of 0.94. DBN-kNN achieved an AUC of 0.82. The obtained results demonstrate
    that DSA-kNN has a good capacity to detect obstacles in urban environments and
    crowded pedestrian zones, mainly due to the capability of DSA to extract relevant
    features from the input V-disparity data, which are sensitive to obstacles. In
    addition, the DSA is an assumption-free model that can very flexibly extract linear
    and nonlinear features from data using greedy learning properties, and it can
    reduce the dimensionality of input data. Interestingly, applying the kNN lazy
    learning procedure to the DSA-kNN method allowed us to handle nonlinear features,
    leading to greater performance than the other DSA-based binary clustering methods.
    Thus, overall, the combined DSA-kNN detection method outperformed the other alternatives.


    In summary, accurately detecting obstacles in an urban environment is indispensable
    for obstacle avoidance in several applications related to autonomous vehicles
    and mobile robots. We presented an unsupervised deep learning method for obstacle
    detection that integrated DSA as a modeling framework with the kNN detection scheme.
    V-disparity maps computed using the stereo image pairs were used as inputs for
    the deep learning model. This approach exploits the sensitivity of V-disparity
    maps to the presence of obstacles in order to improve obstacle detection accuracy.
    New features are constructed and learned by DSA to lower the dimensionality of
    the space and improve detection performance. In addition, kNN is used to identify
    abnormal features and flag potential obstacles in front of the autonomous vehicle.
    The experimental results were obtained with three publicly available datasets:
    MSVUD, DUSD, and the Bahnhof data set. Also, the DSA- and DBN-based binary clustering
    methods were compared. The verification results reveal that DSA-kNN is a promising
    approach to reliable obstacle detection in road environments. Since it achieved
    acceptable results when faced with real-time constraints (i.e., processing at
    least 10 frames per second using a PC), it is expected that the performance could
    be further improved by using a GPU and parallelization for real-time operation.


    In this study, obstacle detection in road environments and crowded pedestrian
    zones was performed under good weather conditions. However, changes in weather
    conditions and illumination could affect the quality of the collected stereovision
    images, reducing obstacle detection performance. Therefore, in future work, we
    will investigate the performance of the aforementioned methods under poor weather
    conditions and work to develop a stereovision-based obstacle detection method
    that effectively detects obstacles under such circumstances.'
