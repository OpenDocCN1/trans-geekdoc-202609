  md: 'In this section, we present only nonlinear PLS models, polynomial PLS and ANFIS-PLS,
    that both use the original iterative linear PLS framework.


    # 4.3.1.1 Polynomial PLS modeling algorithm


    As discussed above, it is possible to represent the inner model by any continuous
    nonlinear function linking u to t. Numerous models have been investigated in the
    literature to represent this nonlinear function, and include polynomial functions,
    smoothing splines, artificial neural networks, and kernel learning [17,34,16].
    This can be performed by changing only the detail of the nonlinear regression
    in step 4 of the algorithm. Here, we present the basic idea behind the polynomial
    PLS modeling, which provides simple and first nonlinear PLS models to capture
    the nonlinearity in the data by fitting the optimal polynomial function in the
    latent space of the PLS algorithm. The outer loop of the PLS model estimation
    is untouched. The main advantage of this method is that it will result in the
    multivariate problem reduction into a univariate regression problem.


    The core concept in a polynomial PLS is to replace the linear inner relation by
    a higher-order polynomial function in order to learn nonlinearity in data and
    achieve more flexibility. A general form of the inner model can be expressed as


    $$u = f(t, \gamma) + h,$$ (4.5)


    where \(f(\cdot)\) us a polynomial function with a selected degree and \(\gamma\)
    contains the coefficients of the polynomial to be estimated. The goal of this
    model is to capture nonlinear features and data with more complex curvature characteristics
    by using a polynomial function in the inner model of a linear PLS. For instance,
    the polynomial PLS method uses a simple quadratic function to describe the inner
    model (called Quadratic PLS) presented in [18] as


    $$u = \gamma_0 + \gamma_1 t + \gamma_2 t^2 + h.$$ (4.6)


    However, using a quadratic function may not be sufficient to learn the strong
    nonlinearity between LVs. Improved prediction capability could be anticipated
    by using polynomial functions of a higher-order [17]. For instance, in [17], a
    spline PLS model is proposed by using a cubic spline function for modeling the
    PLS inner model. Implementing polynomial PLS with high order will offer more flexibility
    to learn the nonlinearity between the PCs of the input and output variables; however,
    this makes the implementation of the algorithm challenging and cumbersome. Table
    4.2 summarizes the main steps of the polynomial PLS algorithm.


    Overall, the polynomial PLS, or PLS with a polynomial inner model, is basically
    using a polynomial or spline function in the inner model to enhance the prediction
    capability of the linear PLS [35]. However, the forms of the polynomial and spline
    are limited and computationally costly. In [36], fractional polynomials are used
    to model the inner relation in PLS. The main reason for'
