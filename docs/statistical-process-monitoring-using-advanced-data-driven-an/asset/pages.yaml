- pgno: 32
  md: '# ## 2.2.1 Full rank methods


    # ### 2.2.1.1 Ordinary least squares regression


    We regress the data matrix \(\mathbf{y} \in \mathbb{R}^n\) (the measured output)
    to \(\mathbf{X} \in \mathbb{R}^{n \times m}\) (selected group of process variables
    whose values are known precisely) as


    \(\mathbf{Y} = \mathbf{X}\beta + \epsilon,\) (2.1)


    where \(\beta \in \mathbb{R}^n\) is a vector of unknown constants to be estimated,
    and \(\epsilon \in \mathcal{N}(0, \sigma I_n)\) is a zero-mean Gaussian noise
    with the known variance. The essence of the ordinary least squares (OLS) regression
    is to estimate the model parameters by minimizing the following objective function
    [14,11]:


    \(\min_{\beta} \left( \| \mathbf{X}\beta - \mathbf{y} \|_2^2 \right).\) (2.2)


    The unbiased maximum likelihood estimate of \(\beta\), if the matrix \(\mathbf{X}^T\mathbf{X}\)
    is nonsingular and the elements of noise \(\epsilon\) are uncorrelated [15,16],
    is


    \(\widehat{\beta}_{OLS} = \left( \mathbf{X}^T \mathbf{X} \right)^{-1} \mathbf{X}^T
    \mathbf{y}.\) (2.3)


    When the input process variables are highly correlated, the variances of the OLS
    regression coefficients become very high, and the estimates may be inaccurate.
    In other words, the determinant of the matrix \(\mathbf{X}^T \mathbf{X}\) is then
    very close to zero, hence giving unstable values for the variance of the estimated
    regression parameters (\(V(b) = \sigma^2(\mathbf{X}^T \mathbf{X})^{-1}\)). Moreover,
    the parameter estimates change considerably if elements of **y** are changed slightly
    and thus **y** is poorly predicted when utilized with new **X** measurements.


    In summary, when (\(\mathbf{X}^T \mathbf{X}\)) is close to being singular, the
    variance of \(\hat{\beta}\) is inflated, which also results in increasing the
    uncertainty about its estimation. Even if numerical issues can be surpassed via
    methods such as pseudo-inverse, the statistical features of the model are not
    suited to inflated variance. One way to cope with this collinearity problem and
    the ill-conditioning of **X** is through regularization methods, such as ridge
    regression (RR), which is presented in the following.


    # ### 2.2.1.2 Ridge regression (RR)


    As discussed above, in cases when the input process variables are highly cross-correlated,
    the OLS method can result in a poor estimate of the regression coefficients. One
    way to mitigate this problem is to relax the condition that \(\widehat{\beta}_{OLS}\)
    should be an unbiased estimator. There are several methods in the literature to
    obtain biased estimators of regression coefficients. The RR approach, which was
    originally introduced by Hoerl and Kennard [17], is commonly used to alleviate
    the collinearity problem and tuned to obtain good prediction models'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'by trading-off bias and variance. The RR estimator is computed by minimizing
    the following objective function [17].


    $$\min_{\beta} \left( \|\mathbf{X}\beta - \mathbf{y}\|_2^2 + \lambda \|\beta\|_2^2
    \right),$$ (2.4)


    $$\hat{\boldsymbol{\beta}}_{RR} = \left( \mathbf{X}^T \mathbf{X} + \lambda \mathbf{I}
    \right)^{-1} \mathbf{X}^T \mathbf{y},$$ (2.5)


    where \(\lambda\) is a positive constant, and \(I \in \mathbb{R}^{m \times m}\)
    is the identity matrix. Note that from Eq. (2.5), the term \(\lambda \mathbf{I}\)
    added to \((\mathbf{X}^T \mathbf{X})\) enhances the conditioning of the estimation
    problem. Of course, the RR estimator, \(\hat{\boldsymbol{\beta}}_{RR}\), is basically
    a linear transformation of the OLS estimator \(\hat{\boldsymbol{\beta}}_{OLS}\).
    Eq. (2.5) can be rewritten as


    $$\hat{\boldsymbol{\beta}}_{RR} = \left( \mathbf{X}^T \mathbf{X} + \lambda \mathbf{I}
    \right)^{-1} (\mathbf{X}^T \mathbf{X}) \hat{\boldsymbol{\beta}}_{OLS} = \mathbf{Z}_{\lambda}
    \hat{\boldsymbol{\beta}}_{OLS}.$$ (2.6)


    Thus, the RR estimator is a biased estimator since


    $$\mathbb{E}(\hat{\boldsymbol{\beta}}_{RR}) = \mathbb{E}(\mathbf{Z}_{\lambda}
    \hat{\boldsymbol{\beta}}_{OLS}) = \mathbf{Z}_{\lambda} \boldsymbol{\beta}.$$ (2.7)


    The covariance matrix of \(\hat{\boldsymbol{\beta}}_{RR}\) is expressed as


    $$V(\hat{\boldsymbol{\beta}}_{RR}) = \sigma^2 \left( \mathbf{X}^T \mathbf{X} +
    \lambda \mathbf{I} \right)^{-1} \mathbf{X}^T \left( \mathbf{X}^T \mathbf{X} +
    \lambda \mathbf{I} \right)^{-1}.$$ (2.8)


    The basic concept when using RR is to select a value of \(\lambda\) that guarantees
    a greater decrease in the variance term than an increase in the squared bias.
    If this is accomplished, the MSE of \(\hat{\boldsymbol{\beta}}_{RR}\) will be
    less than the variance of \(\hat{\boldsymbol{\beta}}_{OLS}\). In [18], it has
    been demonstrated that there is a positive constant \(\lambda\) for which the
    MSE \(\hat{\boldsymbol{\beta}}_{RR}\) is less than the variance of \(\hat{\boldsymbol{\beta}}_{OLS}\).


    In practice, various procedures have been developed to choose the value of \(\lambda\).
    For instance, in [18] the authors proposed to determine a suitable value of \(\lambda\)
    by inspecting the ridge trace, which is a plot of elements of \(\hat{\boldsymbol{\beta}}_{RR}\)
    versus \(\lambda\), where \(\lambda \in [0 \ 1]\). The aim is to determine a reasonably
    small value of \(\lambda\) for which the ridge estimates are stable. In [19],
    an appropriate selection of \(\lambda\) is given as, \(\kappa = \frac{m \hat{\sigma}^2}{\hat{\boldsymbol{\beta}}_{OLS}^T
    \hat{\boldsymbol{\beta}}_{OLS}}\), where \(\hat{\boldsymbol{\beta}}_{OLS}\) and
    \(\hat{\sigma}^2\) are determined using a least squares solution.


    Of course, these models can be used as an alternative to mitigate the ill-conditioning
    problem. However, they are not easily interpretable, whereas an important purpose
    of data modeling is interpretability; see [15,16,18].


    # 2.2.2 Latent variable regression (LVR) models


    Multivariate statistical projection methods such as PCA, PCR, and PLS are commonly
    utilized to handle a high number of highly correlated process variables by conducting
    regression on a smaller number of transformed variables (i.e., latent'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'or principal components), which are linear combinations of the raw measurements.
    After computing the latent variables in the process being investigated, these
    fewer number of variables are then used instead of using the raw data. This latent
    variables regression (LVR) approach generally results in well-conditioned parameter
    estimates and reliable model predictions [20]. In this section, these LVR methods
    are briefly presented. For more details, refer to [21–23]. Before presenting PCR
    and PLS regression methods, we present PCA, which is a popular multivariate dimensionality-reduction
    approach.


    # ### 2.2.2.1 Principal component analysis


    # **Feature extraction with PCA**


    PCA, a dimensionality-reduction approach, is an increasingly popular modeling
    framework for discovering relevant and crucial features from multivariate data.
    The foundation of PCA can be tracked back to Pearson (1901) [24] and Hotelling
    (1933) [25]. By projecting process variables into a lower-dimensional subspace,
    PCA reveals the inherent cross-correlation among process variables [26]. In this
    regard, PCA latent variables or principal components (PCs) (also called scores),
    which consist of linear combinations of physical variables, can efficiently describe
    a process in a reduced subspace. PCA-based methods are currently more commonly
    applied in data compression [27], pattern recognition, data smoothing, classification
    [28], and fault detection [29].


    PCA does not differentiate between input data X and output data Y. It is applied
    to one data set that contains all the process variables involved in the problem.
    Here, X is used to represent the whole data set. Let X = [x_1^T, ..., x_n^T]^T
    \in R^{n x m} be a dataset gathered from a process having n observations and m
    variables.


    Let us first discuss an important point before going into any further in detail.
    When performing PCA on multivariate data, it is assumed that all the data are
    on a comparable scale. If scaling of the data is omitted, then certain variables
    in the data have to be adjusted to avoid the occurrence of misleading dominance.
    Scaling of data changes the covariance matrix and consequently affects the principal
    components. Scaling is important for both the variance and mean adjustments [30].
    When the process variables are measured with different units, the purpose of the
    usual scaling is to make the variance the same (i.e., to give standard units),
    which gives a correlation matrix. Other variance-stabilizing transformations,
    such as log transformation, are used in the literature. The most commonly used
    scaling converts the variables to zero mean and unit variance. Each variable x_j
    \in R^n, j = 1, ..., m, should be scaled to have zero mean and unit variance prior
    to using PCA:


    ```

    $$x_{j,s} = \frac{x_j - \mu_{x_j}}{\sigma_{x_j}}$$ (2.9)

    ```'
