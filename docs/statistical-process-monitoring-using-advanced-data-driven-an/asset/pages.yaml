  md: "The size of the shift in the standardized residuals is not the same as the\
    \ size of the shift in the original data. Because of the nonstationarity present\
    \ in the original data and the difference in scale of the features monitored,\
    \ the shift sizes should be compared in the standardized residuals rather than\
    \ the original data. The shift sizes may be used by the researcher to assess the\
    \ size of the contribution of each of the shifted variables to the fault and to\
    \ identify which variables to prioritize in the fault diagnosis step.\n\nIn simulation,\
    \ aFFI is able to accurately detect different types of faults (shift, drift, or\
    \ latent fault), and it also accurately isolates the shifted variables under a\
    \ variety of conditions (i.e., varying number of variables, nonstationarity, and\
    \ temporal dependence). Unlike some methods, there is also no a priori estimate\
    \ of the number or structure of the faults required. Such a method could be used\
    \ to catalogue and characterize faults from a historical data archive. An example\
    \ of this approach applied to a real problem is given in Sect. 3.5.1.\n\n# 3.2.3.2\
    \ Phase II variable selection\n\nMany more options for Phase II fault isolation\
    \ using variable selection methods are possible. Here, we will describe three\
    \ important developments that are more powerful than the decomposition approaches\
    \ described in Sect. 3.2.2, particularly when the number of variables is large.\
    \ We give references for additional works for more specialized cases.\n\nExample\
    \ method 1, VS-MSpc. In [2], the monitored observation, x_i, is assumed to follow\
    \ a p-dimensional N(\\mu, \\Sigma) distribution. A test of the hypotheses\n\n\
    ```\n{\n H_0 : \\mu \\in \\Omega_0 ,\n H_1 : \\mu \\in \\Omega_1\n}\n(3.12)\n\
    ```\n\ntests whether the process is IC for \\Omega_0 = (0, 0, ..., 0)' versus\
    \ OC for \\Omega_1 = {\\mu : \\mu = \\delta d, \\delta > 0}. As before, d is a\
    \ direction vector such that \\sqrt{d'\\Sigma^{-1}d} = 1, and \\delta is a scalar\
    \ indicating the size of the shift. A generalized likelihood ratio test statistic\
    \ is formed by writing out the likelihood under both hypotheses as\n\n```\n\\\
    lambda(x_i) = \\frac{\\max_{\\mu \\in \\Omega_0} L(x_i, \\mu)}{\\max_{\\mu \\\
    in \\Omega_1} L(x_i, \\mu)},\n```\n\nwhere L(x_i, \\mu) is the likelihood of x_i.\
    \ Substituting \\Omega_0 = (0, 0, ..., 0)' in the numerator, taking the log, and\
    \ using the assumption of normality for the likelihoods, the rejection region\
    \ of the test can be written as\n\n```\n\\Lambda(x_i) = \\min_{\\mu \\in \\Omega_1}\
    \ \\left( x_i' \\Sigma^{-1} x_i + (x_i - \\mu)' \\Sigma (x_i - \\mu) \\right)\
    \ < \\log c,\n```\n\nfor c some constant. However, the first term does not depend\
    \ on \\mu, so the focus rests on the second term, as follows:\n\n```\nS^2 = \\\
    min_{\\mu \\in \\Omega_1} \\left( (x_i - \\mu)' \\Sigma (x_i - \\mu) \\right),\
    \  (3.13)\n```"
