    # 2.4.1.4 Generalized likelihood ratio (GLR) hypothesis testing approach


    The above-described monitoring schemes (i.e., Shewhart, CUSUM, and EWMA) are more
    or less suited to some specific range of fault amplitudes. For instance, Shewhart-type
    approaches provide satisfactory detection of large faults, but they are insensitive
    to small changes in the process mean [54,59]. While CUSUM and EWMA schemes are
    effective in detecting small changes, they fail to detect large faults. However,
    in practice, the magnitude of occurring faults is unknown. Accordingly, it is
    desirable to automatically detect a large range of faults and thus reduce the
    rate of missed detection. To this end, one approach to achieve a reliable detection
    of different sizes of process anomalies is to base the monitoring scheme on a
    generalized likelihood ratio test (usually called GLR charts) [66]. The benefits
    of the GLR approach are its efficiency in separating composite hypotheses, simplicity,
    and absence of complex computations. Extensive literature has been dedicated to
    studying GLR properties. Significant efforts have been devoted to establishing
    different asymptotic optimality properties of this hypothesis testing approach
    and can found in [67–71]. The GLR detector is widely used in several applications
    including air quality monitoring [29] and train safety [66].


    Here, we consider problems related to binary composite hypothesis testing. When
    testing two composite hypotheses in which their corresponding data probability
    density functions (PDFs) comprise unknown parameters, the GLR approach is commonly
    utilized for separating the two possibilities. The null hypothesis generally defines
    the nominal operating situation, while the alternatives characterize departures
    whose presence should be either confirmed or discarded. The essence of the GLR
    approach is to maximize the likelihood ratio statistic over all possible faults
    to decide between two composite hypotheses [68–71]. In other words, the aim of
    the GLR approach is to separate two composite hypotheses, _H_<sub>0</sub> and
    _H_<sub>1</sub>, based on the observed data.


