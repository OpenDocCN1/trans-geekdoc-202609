    # 6.5 Deep learning-based clustering schemes for process monitoring


    As mentioned above, anomaly detection in high-dimensional data based on binary
    clustering procedures is challenging and time-consuming. For instance, OCSVM with
    a selected kernel function could encounter challenges to learn from complex datasets,
    whereas it can get robust decision hyperplanes when applied to reduced and well-structured
    features. To overcome this problem, here we present a hybrid framework by combining
    the advantages of deep learning models and unsupervised clustering procedures
    (Fig. 6.16). In this hybrid approach, an unsupervised deep learning model, such
    as DBN, DBM, and SAE, will be used to extract relevant features from complex and
    high-dimensional datasets. The considered deep learning model will be trained
    in such a way that the used clustering algorithm (e.g., OCSVM) can efficiently
    discriminate normal data from anomalies based on the learned feature space.


    Anomaly detection using hybrid methods can be done in two steps. The deep learning
    models are constructed through unlabeled training datasets that are devoid of
    anomalies. Then, the extracted features from the last layer of the considered
    deep learning model are passed to the used clustering or one-class machine learning
    algorithm for training purposes. In the testing step, the learned model is used
    to extract features from new arrival unlabeled data, and the clus-'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/aa2f42c739937b682075082233e335bb_227_0.png)


    FIGURE 6.16 Deep learning-based clustering schemes for process monitoring.


    tering approach is applied to extracted features to separate between normal and
    anomalies data points.


    Several hybrid methods have been developed to benefit from the complementary advantages
    of deep learning models and unsupervised binary clustering procedures. The method
    in [90] uses the DBN model and the OCSVM to detect anomalies in an actual wastewater
    treatment plant. It exhibits good detection performance in comparison to other
    hybrid methods including DBN-based KNN and k-means algorithms. Also, in [91],
    several hybrid models including DBNs-based, DSA-based and RBM-based clustering
    methods (i.e., k-means, BIRCH, and expectation maximization) have been compared
    when applied to abnormal ozone measurements. The results in [91] showed that hybrid
    models achieved better results in comparison to the stand-alone binary clustering
    algorithms. Also, it has been shown that the DBN-OCSVM outperformed the other
    hybrid models. Here, the DBN is constructed as a dimensionality-reduction procedure
    to generate a lower-dimensional set of features. The computed features are used
    as input to train the OCSVM. Subsequently, the established hybrid DBN-OCSVM is
    used for testing. Such methods are assumption-free and do not require any data
    labeling or assumption related to the distribution underlying the datasets. A
    hybrid anomaly detection algorithm merging DBM and AE models is employed for obstacle
    detection in road environments based on stereovision [13]. The extracted features
    form this hybrid model are used by OCSVM for anomaly detection. This model merges
    the greedy learning features of DBM with the AE''s dimensionality reduction capability.
    Results indicate that anomaly detection performance based on hybrid models is
    improved compared to the stand-alone models. In summary, coupling the extraction
    features capacity of deep learning models with the sensitivity to changes of the
    binary clustering methods is advantageous since it bypasses the complexity issues
    of clustering methods in particular when applied to large-scale datasets.


    # 6.6 Discussion


    This chapter reviewed the basic features of commonly used clustering algorithms
    and one-class algorithms (i.e., OCSVM and SVDD). Then, some of deep learning approaches
    that effectively analyze and model high-dimensional data,'
