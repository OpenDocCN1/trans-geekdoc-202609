- pgno: 251
  md: '![](img/aa2f42c739937b682075082233e335bb_251_0.png)


    Under normal conditions, residual values fluctuate closer to zero, whereas in
    the presence of an anomaly, residuals deviate importantly from zero. Univariate
    or multivariate monitoring charts (e.g., EWMA, CUSUM, and GLRT) can be applied
    to residuals to uncover anomalies. If the charting statistic exceeds the decision
    threshold, then it can be inferred that there is an anomaly in the inspected process.
    An unsupervised anomaly detection approach is required that needs only anomaly-free
    data to construct the recurrent model and no data labeling.


    # 7.4.2 Recurrent deep learning-based clustering schemes for process monitoring


    # 7.4.2.1 RNN-RBM clustering


    In Sect. 7.4.1, we explained that deep recurrent and hybrid deep models can be
    used for early detection of anomalies in multivariate time series data, where
    the detection is performed by using statistical monitoring charts. Since statistical
    monitoring charts generally require that the data must be Gaussian and uncorrelated,
    here we present an alternative and more flexible strategy. Specifically, we integrate
    the desirable features of RNN-based models with binary clustering algorithms.
    One major feature of binary clustering algorithms such as OCSVM is their ability
    to deal with nonlinear and non-Gaussian data. The primary objective of this approach
    is to exploit the deep recurrent models to accurately describe the anomaly-free
    time series data and use clustering algorithms to reliably detect the presence
    of anomalies.


    For the sake of simplicity, in this section we focus on early detection with an
    RNN-RBM model and an OCSVM clustering algorithm. Other recurrent models can be
    combined in a similar way with a binary clustering algorithm for anomaly detection.
    We first present the outline of the proposed method and the training procedure
    of the RNN-RBM model. Then, we explain the basic concept of combining OCSVM together
    with a RNN-RBM model to efficiently detect anomalies in multivariate time-series
    data.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/aa2f42c739937b682075082233e335bb_252_0.png)


    As described above, the major characteristic of an RNN-RBM is to simultaneously
    combine the desired features of RNNs and RBMs. This model is based on a powerful
    data distribution estimator, namely RBM, conditioned by the RNN to describe local
    and long-term dependence in the data. The training of RNN-RBM model is performed
    in an unsupervised manner where only anomaly-free data are needed. After the training
    of the RNN-RBM model has been accomplished by using anomaly-free data, a feature
    space is obtained with the capability of reconstructing the input with small error
    via encoding and decoding tasks. The designed RNN-RBM model can be then applied
    to predict the evolution of the inspected system (e.g., inflow characteristics
    of WRRFs). To design a suitable RNN-RBM model that captures temporal dependencies
    in the data well, minimizing cross-entropy error [49] is used as the cost function
    during the training phase. The aim of RNN-RBM is to recreate the inputs as accurately
    as possible. Here, the cross-entropy is used to quantify the accuracy of the designed
    RNN-RBM during the training phase, by showing the dissimilarity between the probability
    distributions of input and reconstruction from the RNN-RBM model. Then the designed
    RNN-RBM model in combination with OCSVM algorithm is adopted to detect abnormalities
    in multivariate time series data (see Fig. 7.16). Here, to detect anomalies, we
    used the extracted features from the RNN-RBM model as input to the OCSVM. Of course,
    the RNN-RBM-based OCSVM method consists of three main stages: (1) building RNN-RBM
    model based on training dataset without anomaly, (2) training in an unsupervised
    way the OCSVM with the features discovered by the RNN-RBM model, and (3) applying
    the constructed approach to new data for anomaly detection. This approach is outlined
    in Table 7.2.


