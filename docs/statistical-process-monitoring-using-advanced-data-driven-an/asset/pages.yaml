  md: 'where \(\sum_i w_i = 1\), and \(N\) is the filter length. Linear filters include
    moving average, CUSUM, Chebyshev, and EWMA filters. For instance, the mean filter
    is implemented by using equal weights, i.e., \(w_i = \frac{1}{N}\), whereas the
    EWMA filter proceeds by averaging all the past observations. The EWMA filter is
    performed in a recursive way as


    \(\hat{y}_k = \alpha y_k + (1 - \alpha)\hat{y}_{k-1},\) (5.6)


    where \(y_k\) and \(\hat{y}_k\) are respectively the observation and the filter
    output at time step \(k\) and \(\alpha \in [0, 1]\) is the smoothing parameter
    that defines the depth of the memory of EWMA. From the construction of the EWMA
    filter, its performance would depend on the value of the parameter \(\alpha\).
    Values of \(\alpha\) close to one would result in less smoothed data and smaller
    values of \(\alpha\) would result in more smoothed data [62].


    It should be noted that in a single scale filtering, the measured data represented
    by basis functions have a uniform temporal localization with respect to the sampling
    time. In the case of single scale data analysis, the basis functions have uniform
    time-frequency localization which results in a trade-off between temporally localized
    changes and capacity to temporally remove global noise [24]. In other words, the
    major limitation of single scale filtering is their fixed time–frequency localization,
    i.e., they explore data at a single frequency alone. Moreover, these filters are
    not suited when the data are time-dependent and non-Gaussian-distributed. Accordingly,
    accurate feature extraction and noise removal are not possible, in an effective
    manner, using single-scale filtering strategies [24].


    # 5.3.2 Multiscale filtering methods


    Recently, denoising techniques based on wavelet representation received considerable
    attention from researchers and engineers. The potential of these nonlinear denoising
    methods is still being investigated. Indeed, in multiscale denoising methods using
    wavelets, the deterministic components of the data (e.g., spikes, trends, and
    deviation in mean/variance) are represented by a small number of coefficients
    of a wavelet with a higher magnitude, whereas the random components of the signal
    are captured by the remaining coefficients [22,46,63,64]. This desirable characteristic
    of wavelets is used to denoise and detect features of the signals. Thus, the extraction
    of the stationary Gaussian noise can be performed by the following three steps
    [46]:


    +   - Transforming the raw data to the time–frequency domain by decomposing the
    input data, using a chosen set of orthonormal wavelet functions.

    +   - Ignoring coefficients that are smaller than the fixed threshold value.

    +   - Converting back the selected coefficients into the original time domain.


    In [64], it has been demonstrated that for the denoised signal of a noisy data
    with length \(n\) there is an error within \(O(\log n)\) between the noiseless
    data and the denoised data with a priori information about the smoothness of the
    underlying'
