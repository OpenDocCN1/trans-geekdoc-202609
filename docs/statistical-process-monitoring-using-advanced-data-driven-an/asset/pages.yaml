    # 4.5 Simulated synthetic data


    The aim of this example is to show the prediction performance of nonlinear PLS
    models, in comparison with linear PLS. Three PLS algorithms, including linear
    PLS, polynomial PLS, and ANFIS-PLS, were compared in terms of data fitting and
    prediction. Simulated nonlinear datasets with one response and ten input (predictor)
    variables were generated. The first two inputs were simulated using “randn” signals
    and the remaining eight inputs were computed as:


    ```

    x3 = x1 + x2, (4.34)

    x4 = x3^2, (4.35)

    x5 = \sqrt{x3}, (4.36)

    x6 = \frac{1}{\sqrt{x3}}, (4.37)

    x7 = 1 - e^{-x3}, (4.38)

    x8 = 1.4x2 - 1.2x7, x9 = 1.3x2 + 2.1x1, (4.39)

    x10 = 1.3x6 - 2.3x9. (4.40)

    ```'
