    from several real industrial processes. Accordingly, adopting these detection
    thresholds for process-monitoring based on the multivariate Gaussian assumption
    is not suitable, and may give wrong results [65,66]. An alternative solution to
    escape the Gaussian assumption in computing detection thresholds of KPCA''s \(T^2\)
    and \(Q\) charts is to compute these thresholds nonparametrically using the kernel
    density estimation (KDE) [64]. In this approach, at first, the KDE is used to
