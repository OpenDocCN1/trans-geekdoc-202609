    Furthermore, the LSTM-RBM can be understood as an extension of the recurrent temporal
    RBM (RTRBM), which combines a simple RNN cell and RBM in the same architecture
    [34]. As RNN is used in this combination, the RTRBM is not suited to memorize
    a long historical range of temporal data dependencies. Thus, LSTM-RBM was designed
    to overcome this problem by permitting the hybrid model to be more flexible and
    robust. The memory state, also known as internal feedback, of the recurrent neural
    networks makes them a suitable technique for modeling sequence or temporal dependencies,
    while, on the other hand, the hybrid model is able to generate new sequences.
    As discussed above, LSTM is designed to capture short-term memory with the possibility
    of deciding what information in the memory is irrelevant and must be replaced
    with new information by using the forget gate layer. The RBM make the sequence
    generation possible because of its nature as a probabilistic model used as a block
    to build a deep learning model such as deep belief networks (DBN) and deep Boltzmann
    machine (DBM).


