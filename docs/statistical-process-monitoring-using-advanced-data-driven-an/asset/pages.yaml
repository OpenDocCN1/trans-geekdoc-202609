- pgno: 74
  md: "pH, PC$_2$ anchor and PC$_4$, which is dominated by pH, alkalinity, and calcium\
    \ hardness anchor.\n\nNote that RadViz is helpful to understand and identify the\
    \ source of anomalies.\n\n# 2.7 Discussion\n\nPrediction, fault detection, and\
    \ diagnosis using LVR methods are effective for handling massive and high-dimensional\
    \ data. As explained in this chapter, the linear LVR models represent an important\
    \ tool and have a good capacity to extract relevant information from multivariate\
    \ data. These models are amalgamated with univariate and multivariate monitoring\
    \ schemes for detecting anomalies in multivariate data. However, these models\
    \ are designed to model linear relationships, and in practice, modern industry\
    \ and environmental processes exhibit nonlinear behaviors. This has been shown\
    \ in the WWTP case study, where the data collected is non-Gaussian distributed\
    \ and nonlinear. The linear PCA-based fault detection approach can achieve a detection\
    \ rate of around 90%, which may be improved by using nonlinear monitoring schemes.\
    \ Accordingly, the nonlinear LVR approach techniques that can describe and capture\
    \ nonlinearity in multivariate processes is needed. Chapter 4 will focus on nonlinear\
    \ process monitoring.\n\nAlthough $Q$ and $T^2$ and their contribution plots are\
    \ frequently employed in fault detection and isolation, they frequently lead to\
    \ the incorrect isolation of faults. Indeed, $Q$ reduces the degrees of freedom\
    \ of the test statistics. Commonly one-half to two-thirds of the diagnosis information\
    \ (redundancy) in the data is lost using $Q$. The $Q$ contribution plot method\
    \ does not possess a convincing statistical basis and, in fact, sometimes gives\
    \ an ambiguous diagnosis. Numerous lasso and forward variable selection methods\
    \ have been proposed for fault attribution. The next chapter will review these\
    \ techniques and present a new fused adaptive lasso fault attribution approach\
    \ that is designed for nonstationary, temporally dependent multivariate processes.\n\
