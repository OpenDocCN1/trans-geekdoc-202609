  md: 'In summary, the main appeal of the partition-based clustering methods is their
    high computational efficacy with moderate time-complexity. However, they are not
    suited for nonconvex data, sensitive to outliers, and easily fall into local optimum.
    In addition, in such methods, the number of clusters should be specified a priori
    defined, and the obtained results are highly sensitive to the number of clusters.


    # ## 6.2.2 Hierarchy-based clustering techniques


    As discussed above, the aim of clustering techniques as unsupervised learning
    techniques is to group a set of observations into distinguished subsets. Hierarchy-based
    clustering is one of the frequently used clustering techniques. The key concept
    of this type of clustering is based on the construction of the hierarchical relationships
    among data to cluster it [23]. At first, we assume that each of the observed data
    points represents a single cluster, we then merge the closest clusters in a new
    cluster until only one cluster is left. There are several existing hierarchy-based
    clustering procedures in the literature, such as balanced iterative reducing and
    clustering using hierarchies (BIRCH) [24,25], CURE [26], ROCK [27], and Chameleon
    [28]. Essentially, hierarchy-based clustering methods have the advantage of handling
    datasets having arbitrary shape and attributes of arbitrary type. In addition,
    the hierarchical relationship between clusters can easily be identified. However,
    the disadvantage of using hierarchy-based clustering is its high cost and the
    fact that the number of clusters should be a priori defined. For more details
    about hierarchy-based clustering methods, refer to [29–31].


    # ### 6.2.2.1 BIRCH (hierarchical)


    BIRCH is a hierarchy-based clustering procedure introduced to deal with streaming
    data or large datasets [25]. Basically, BIRCH clusters the data by building the
    clustering feature tree (CF tree), in which a subcluster is represented by one
    node. Specifically, the CF is a triple that summarizes the maintained information
    on a cluster. In fact, the CF tree will dynamically rise when a new observation
    arrives, and this incrementally improves the quality of subclusters. However,
    to obtain a good clustering performance, BIRCH needs the cluster count as input.
    More details about BIRCH algorithm can be found in [24,25].


    The following describes the main steps in implementing the BIRCH clustering approach:


    +   1. Construct a CF tree structure after a scan of the whole training data

    +   2. Optimize the initial CF tree and create a compressed version of it

    +   3. Perform global clustering by applying an existing clustering procedure
    on the leaves of the CF tree

    +   4. Refine and improve the clustering quality with an additional full scan'
