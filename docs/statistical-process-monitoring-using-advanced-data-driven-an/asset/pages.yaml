  md: 'the control chart signals a shift when


    $Q_f = \max_{k=1,\dots,q} \frac{W_{j,k} - \text{E}(W_{j,y})}{\sqrt{\text{Var}(W_{j,y})}}
    > L,$


    where \( L \) is a control limit chosen to give a particular IC ARL. This \( L
    \) can be determined through simulation and must be determined by a one-time computation
    prior to performing Phase II monitoring. In practice, the \(\frac{2-\lambda}{\lambda[1-(1-\lambda)^{2j}]}\)
    factor in \( W_{j,y} \) can be replaced with the asymptotic form \((2-\lambda)/\lambda\).
    LEWMA is evaluated through simulation, particularly with respect to its ARL in
    OC settings, for \( p=5 \) and \( p=15 \). It is compared to two other EWMA charting
    statistics across multiple shift sizes in varying numbers of variables. The results
    show that LEWMA provides well-rounded protection against a variety of shifts in
    terms of ARL. Furthermore, the authors assess the ability of the method to correctly
    identify all shifted variables in a set of 15 variables. For a single shifted
    variable out of the 15, LEWMA correctly identifies the shifted variable in approximately
    55 to 60% of simulations; however, as the number of shifted variables increases
    from 1 to 2 to 3, the highest proportion of simulations in which the correct shifted
    variables are identified drops from 60% to 37%, to 24%. Conversely, the proportion
    of simulations in which an error is made in identifying shifted variables (either
    a shifted variable is not identified or an un-shifted variable is selected) increase
    as the number of shifted variables in the simulation increase from 6% for 1 shifted
    variable to 22% for 2 shifted variables, to 34% for three shifted variables. Nevertheless,
    LEWMA still performs better than its competitors. This study is one of the first
    to assess the performance of fault isolation in addition to fault detection, and
    similarly to [25], the results indicate that fault isolation is a very challenging
    problem, and methods have room for improvement.


    Example method 3. APC-PCSR. Adaptive PC and PC-based Signal Recovery (APC-PCSR)
    adaptively chooses principal components (PCs), allowing them to vary over time,
    and then incorporates a diagnostic approach that exploits adaptive lasso [55].
    This method tends to works better in high-dimensional settings than [2,6,16,17],
    which are computationally burdensome as the dimension grows. It can be used when
    variables are dependent, and knowledge of the fault direction, size, and/or number
    of affected variables are not needed.


    To reduce the dimension of the data, PCA is performed. Here, \(\mathbf{A}\) is
    the \( p \times p \) matrix of eigenvectors of \(\mathbf{\Sigma}\), and \(\mathbf{y}_i
    = \mathbf{A}\mathbf{x}_i\) denotes the PC scores. The eigenvectors in \(\mathbf{A}\)
    are ordered such that the corresponding eigenvalues are in decreasing order with
    \(\lambda_1 \ge \lambda_2 \ge \cdots \ge \lambda_p\). Monitoring just the top
    \( l \) PCs (usually those with the largest eigenvalues) can sometimes miss the
    fault because the variance of the top PCs is larger, so the bottom PCs can be
    more sensitive to the fault. To account for this, the standardized PC scores are
    computed as


    \(\tilde{y}_{i,j} = \frac{y_{i,j}}{\sqrt{\lambda_j}}, \quad j=1,\dots,p.\)'
