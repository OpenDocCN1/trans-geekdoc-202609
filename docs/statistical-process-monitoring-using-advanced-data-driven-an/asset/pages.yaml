- pgno: 88
  md: '# 3.1.2 Shortcomings of contribution plots/scores


    A very common first approach to isolating the variables associated with a fault
    is to use contribution scores or plots that quantify the contribution of each
    variable to the monitoring statistic [11,12]. Then, those variables with the largest
    contribution are deemed shifted. With a small number of features and a single
    shifted variable, this approach is simple to implement and interpret, but it is
    not advisable for multiple reasons. First, contribution scores are subject to
    variable smearing. This occurs when variable i shifts, and its shift contaminates
    the contribution scores of all other variables. Secondly, even under IC conditions,
    the contributions of all variables are unequal, so misdiagnoses can occur when
    variables whose contributions are small under IC conditions still do not have
    the largest contribution in OC conditions.


    We will show the variable smearing effect for the Q statistic, using notation
    adapted from [13]. First, the covariance of X is estimated with S = (1/(n-1))X''X.
    Then, principal component analysis (PCA) decomposes S as follows:


    $$ \mathbf{S} = \mathbf{P}\mathbf{\Lambda}\mathbf{P}'' + \tilde{\mathbf{P}}\tilde{\mathbf{\Lambda}}\tilde{\mathbf{P}}''
    = \hat{\mathbf{S}} + \tilde{\mathbf{S}}, $$


    where \(\hat{\mathbf{S}} = \mathbf{P}\mathbf{\Lambda}\mathbf{P}''\); \(\tilde{\mathbf{S}}
    = \tilde{\mathbf{P}}\tilde{\mathbf{\Lambda}}\tilde{\mathbf{P}}''\); **P** is a
    matrix of size \(p \times l\) of eigenvectors termed principal loadings; \(\tilde{\mathbf{P}}\)
    is a matrix of size \(p \times (p-l)\) of eigenvectors termed residual loadings;
    \(l\) is the number of principal components (PCs) retained to explain the variability
    in **S**; and \(\mathbf{\Lambda}\) and \(\tilde{\mathbf{\Lambda}}\) are diagonal
    matrices containing the principal and residual eigenvalues, respectively. An individual
    measurement, \(\mathbf{x}_i\), can be rewritten as \(\mathbf{x}_i = \hat{\mathbf{x}}_i
    + \tilde{\mathbf{x}}_i = \mathbf{PP}''\mathbf{x}_i + \tilde{\mathbf{P}}\tilde{\mathbf{P}}''\mathbf{x}_i
    = \mathbf{Cx}_i + \tilde{\mathbf{C}}\mathbf{x}_i\), where \(\mathbf{C} = \mathbf{PP}''\)
    is the projection matrix into the principal component subspace (PCS), and \(\tilde{\mathbf{C}}
    = \tilde{\mathbf{P}}\tilde{\mathbf{P}}''\) is the projection matrix into the residual
    subspace (RS).


    The Q statistic, also commonly known as the Squared Prediction Error (SPE), measures
    the goodness of fit in the lower dimensional model (i.e., \(l < p\)) via the squared
    norm of the residual vector, \(\tilde{\mathbf{x}}_i\), computed as


    $$ Q = \|\tilde{\mathbf{x}}_i\|^2 = \mathbf{x}''_i\tilde{\mathbf{C}}\tilde{\mathbf{C}}\mathbf{x}_i
    = \mathbf{x}''_i\tilde{\mathbf{C}}\mathbf{x}_i = \|\tilde{\mathbf{C}}^{1/2}\mathbf{x}_i\|^2.
    $$


    The contribution of a variable to the Q statistic is called that variable''s *contribution
    score*, with variables with the largest contribution scores presumed to be those
    most likely to be shifted. The contribution scores for the Q statistic are


    $$ c_j^Q = \left( \mathbf{d}''_j \tilde{\mathbf{C}} \mathbf{x}_i \right)^2 , $$


    where \(\mathbf{d}_j\) is a vector of zeroes of length \(p\) except for a one
    in the \(j\)th row and is referred to as the direction vector.


    Now, consider that variable \(j\) is shifted, resulting in a faulty measurement
    with \(\mathbf{x}_i = \mathbf{x}^*_i + \mathbf{d}_j\delta\), where \(\mathbf{x}^*_i\)
    is the fault-free part of the measurement, and \(\mathbf{d}_j\delta\) is the faulty
    part. The faulty part is composed of the fault direction, \(\mathbf{d}_j\), and
    \(\delta\) is'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'the scalar magnitude of the fault. Then, the contribution of variable \(k\)
    to the \(Q\) statistic when there is a fault in variable \(j\) for the \(i\)th
    observation is as follows:


    ```

    \(\begin{aligned} c_k^Q &= \left(\mathbf{d}''_k \tilde{\mathbf{C}}\mathbf{x}_i\right)^2
    = \left[\mathbf{d}''_k \tilde{\mathbf{C}}(\mathbf{x}^*_i + \mathbf{d}_j\delta)\right]^2
    \\ &= \left[\mathbf{d}''_k \tilde{\mathbf{C}}\mathbf{x}^*_i + \mathbf{d}''_k \tilde{\mathbf{C}}\mathbf{d}_j\delta\right]^2
    = \left[\mathbf{d}''_k \tilde{\mathbf{C}}\mathbf{x}^*_i + \tilde{c}_{kj}\delta\right]^2,
    \end{aligned}\)

    ```


    where the first term in the brackets on the right-hand side of the equation depends
    on the observation itself and the contribution of variable \(k\) to the score,
    but the second term includes \(\tilde{c}_{kj}\), the \((k, j)\)th element of \(\tilde{\mathbf{C}}\).
    The term \(\tilde{c}_{kj}\) is not zero for \(j \neq k\), and therefore, the \(j\)th
    variable''s effect is *smeared* into the contribution of variable \(k\).


    For example, taking the covariance matrix from (3.1) and performing the eigenvalue-eigenvector
    decomposition results in


    ```

    \(\tilde{\mathbf{C}} = \begin{bmatrix} 0.10 & -0.21 & 0.22 \\ -0.21 & 0.43 & -0.45
    \\ 0.22 & -0.45 & 0.47 \end{bmatrix} .\)

    ```


    Thus, if the contribution score for variable 3 is desired, but a fault is present
    in variable 1, then \(\tilde{c}_{31} = 0.22\), which would inflate the contribution
    score for variable 3.


    Some proposals exist that reduce the smearing effect, such as [13,14] for reconstruction-based
    contribution (RBC) scores for PCA and kernel PCA (KPCA), respectively. For example,
    the RBC of variable \(k\) to \(Q\) for PCA is defined as


    ```

    \(c_k^{Q^\text{RBC}} = \frac{\left(\mathbf{d}''_k \tilde{\mathbf{C}}\mathbf{x}_i\right)^2}{\tilde{c}_{kk}}
    = \frac{c_k^Q}{\tilde{c}_{kk}},\)

    ```


    where \(\tilde{c}_{kk}\) is the \(k\)th diagonal element of \(\tilde{\mathbf{C}}\).
    The RBC only differs from the contribution score by scaling it with \(\tilde{c}_{kk}\)
    and still clearly exhibits the smearing effect. The question becomes whether the
    contribution scores will be largest for \(c_j^Q\) or \(c_j^{Q^\text{RBC}}\) for
    a fault in variable \(j\). Alcala and Qin [13] prove that \(c_j^{Q^\text{RBC}}\)
    is the largest RBC for a fault in variable \(j\), but the same does not hold for
    \(c_j^Q\). Even in the case of single sensor faults, correct variable isolation
    by \(c_j^Q\) cannot be guaranteed. Furthermore, the authors of [13] show in simulation
    that the combined index statistic, \(\phi\), which is a weighted linear combination
    of \(T^2\) and \(Q\), yields more accurate fault isolation than either \(T^2\)
    or \(Q\) alone with \(c_j^{Q^\text{RBC}}\).


    While we have defined \(\mathbf{d}_j\) as a vector of zeros with a one in the
    \(j\)th entry, it could also be a matrix of zeroes with a one in each column,
    representing a multidimensional fault in which multiple variables are shifted
    simultaneously.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Consequently, $\delta$ could be a vector in which each entry corresponds to
    the magnitude of the fault in the corresponding direction column. Thus, to compute
    the RBC, *a priori* information about the specific combination of potentially
    shifted variables is required. Simply testing a single fault direction at a time
    does not present this problem (such as a single sensor fault), but oftentimes
    complex faults will affect multiple variables simultaneously. Thus, one of the
    drawbacks of the RBC is that having knowledge of the fault directions is required
    to assess variable contribution. In spite of this drawback, RBC guarantees that
    the faulty variable for a single variable fault has the largest score and is a
    rapid approach for simple fault isolation. A paper by Yan and Yao [15] improves
    reconstruction-based contribution plots by incorporating variable selection.


    # ## 3.2 Fault isolation


    In this section, we will first discuss the premise of using variable selection
    as a tool for improving fault detection. Then, we review some of the traditional
    and historic approaches for fault isolation. More modern methods using various
    penalized regression techniques are covered in Sect. 3.2.3. Examples of both Phase
    I and Phase II methods will be presented.


    # ### 3.2.1 Variable thinning


    In some settings, what is referred to as variable isolation is primarily focused
    on *variable thinning*. Meaning, the greater the number of monitored variables,
    the more challenging it becomes to detect faults. Typically, only a small subset
    of the monitored variables actually shift, so including additional noisy features
    diminishes a method''s ability to detect faults. Thus, to improve the power of
    fault detection, variable thinning is employed to remove those variables that
    are unlikely to have changed [2,6,16–24]. Many of these works do not just perform
    variable thinning but also isolate the variables affected by the fault, estimating
    the direction and magnitude of the shift in each variable. However, the variable
    isolation abilities of these methods are oftentimes not evaluated, instead focusing
    on the improvement in fault detection that results when reducing the number of
    monitored variables.


