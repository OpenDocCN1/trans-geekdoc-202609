- pgno: 104
  md: 'with the solution of Eq. (3.13), denoted \(\mu^*\), being an estimator of \(\mu\).
    Assuming that most of the elements of \(\mu\) are zero, penalization can be used
    to force small coefficients to zero.


    The penalized version of Eq. (3.13) used by [2] uses the \(L_0\) penalty in order
    to constrain the absolute number of nonzero coefficients. Then, decomposing the
    positive-definite \(\Sigma\) using the Cholesky decomposition as \(\Sigma = \mathbf{L}\mathbf{L}''\),
    Eq. (3.13) with penalization can be rewritten as


    ```

    \left\{ \begin{aligned} \min_{\mu \in \Omega_1} ((\mathbf{z}_i - \mathbf{L}\mu)''(\mathbf{z}_i
    - \mathbf{L}\mu)) \\ \text{s.t.} \sum_{j=1}^p I(|\mu_j| \neq 0) \le s, \end{aligned}
    \right.

    ```


    where \(\mathbf{z}_i = \mathbf{L}\mathbf{x}_i\). Wang and Jiang [2] advocate the
    use of forward selection, starting with no predictors and adding the predictor
    that produces the largest decrease in the sum of squared errors. They use the
    "F-to-enter" rule whereby the following \(F\)-value is calculated for every predictor,
    and the one with the highest value enters the model,


    ```

    F = \frac{(R_{k+1}^2 - R_k^2)(n - k - 1)}{1 - R_{k+1}^2},

    ```


    where \(R_k^2\) is the \(R^2\) of the model with \(k\) predictors. No formal hypothesis
    test is performed, and once \(s\) variables have entered the model, no additional
    variables are added. When no prior knowledge of the number of shifted variables
    exist, the authors of [2] suggest the use of penalized or sparse PCA to find \(s\),
    which takes linear combinations of only a subset of variables [9,53,54].


    The control charting scheme proceeds as follows:


    +   1. As each new observation is collected, variable selection is performed,
    as described above, finding the solution, \(\mu^*\), to Eq. (3.13).


    +   2. Variables with nonzero coefficients identified in step 1 are charted using


    ```

    \Lambda(\mathbf{x}_i) = 2\mathbf{x}_i'' \Sigma^{-1} \mu^* - \mu^{* \prime} \Sigma^{-1}
    \mu^*.

    ```


    Values that exceed the preset control limit are deemed OC.


    +   3. After an OC alarm is issued, those variables with nonzero coefficients
    identified in the first step are classified as shifted.


    Wang and Jiang [2] test the Average Run Length (ARL) performance of VS-MSPC in
    both IC and OC settings with variable dimension ranging from \(p = 10\) to \(p
    = 100\) and find that it performs better than Hotelling’s \(T^2\) for detecting
    medium and large shifts. However, even if \(s\) is misspecified, the control chart
    still performs well. The performance of the method in detecting the shifted variables
    is not evaluated, but the method works well for a particular example.


    Example method 2, LEWMA. Zou and Qiu [16] propose an exponentially weighted moving
    average (EWMA) based charting statistic that gives less weight to older observations
    and uses the adaptive lasso penalty. Named'
