    where \(\mathbf{x}_j^{\text{M}}\), \(\boldsymbol{\beta}_j\), and \(\boldsymbol{\epsilon}_j\)
    are vectors of length \( n \), and the errors \(\boldsymbol{\epsilon}_j\) have
    mean zero and constant variance. The \(\mathbf{x}_j^{\text{M}}\) is the set of
    observations for variable \( j \) in the monitoring period. The mean of the response
    for the \( j \)th variable at time step \( t \) is \( \beta_{j,t} \), and a change
    in the mean of the process is indicated when \( \beta_{j,t} \neq \beta_{j,t+1}
    \). When \( \beta_{j,t} \neq \beta_{j,t+1} \), time \( t+1 \) is referred to as
    a *change point* for variable \( j \). A variable is classified as *shifted* at
    time \( t+1 \) if there is a change point at time \( t+1 \) versus *unshifted*
    if no change occurs at \( t+1 \). The \(\boldsymbol{\beta}_j\) for \( j=1, \dots,
    p \), are estimated with fused lasso.


    Fused lasso is used when there is a natural ordering to the parameters, such as
    parameters that are indexed by time [47]. Fused lasso penalizes the difference
    between adjacent coefficients rather than penalizing the coefficients themselves,
    driving the small changes between adjacent coefficients to zero [38]. Zhang et
    al. [48] also use fused lasso in a Bayesian framework to perform fault isolation
    by estimating the fault probability for each variable. The theoretical properties
    of change point detection using fused lasso are in [49].


    An algorithm to perform fused lasso [50] is implemented in the `R` package `genlasso`
    [51]. An estimate for \(\boldsymbol{\beta}_j\) for \( j=1, \dots, p \) is obtained
    by minimizing'
