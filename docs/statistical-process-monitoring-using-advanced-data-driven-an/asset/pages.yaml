  md: 'detection [49,50]. The essence of the SVDD procedure is to find a spherically
    shaped border surrounding the majority of the training datasets while discarding
    some observations that are excluded as potential anomalies. This makes it clearly
    different from the OCSVM procedure in terms of the shape of the discriminatory
    boundaries, where OCSVM uses hyperplane while SVDD uses spheres (hypersphere)
    for separating normal from abnormal features (Fig. 6.7).


    ![](img/aa2f42c739937b682075082233e335bb_213_0.png)


    FIGURE 6.7 SVDD vs OCSVM decision boundaries.


    Assume \(x_i \in \mathbb{R}^n, i = 1, ..., l\) is a set of training data, the
    goal of the SVDD algorithm as a kernel-based method is to find the most tightly
    fitting hypersphere that includes most of the data points in the kernel mapping
    space (Fig. 6.7). At first, the input data is transformed into the high dimensional
    space (called feature space) via the nonlinear mapping function \(\phi(\cdot)\).
    In this feature space, the SVDD scheme attempts to find a hypersphere with radius
    \(R\) and its center \(a\) to encompass the majority of the training data and
    exclude anomalous data points (outliers) as much as possible. Due to the possible
    presence of outliers in the data, in order to find the hypersphere using the SVDD
    scheme, we solve the following optimization problem with the help of slack variables
    \(\xi_i\):


    ```

    \min_{R, a, \xi} R^2 + C \sum_{i=1}^l \xi_i

    s.t. \|\phi(x_i) - a\|^2 \le R^2 + \xi_i, i = 1, ..., l,

    \xi_i \ge 0, i = 1, ..., l.

    (6.5)

    ```


    The role of parameter \(C\) is to control the size of the hypersphere and the
    amount of the training data excluded from the hypersphere (i.e., outliers). Usually,
    it is expressed as \(\frac{1}{\nu N}\), where \(\nu\) denotes the upper limit
    to the permitted outliers and lower limit on the number of support vectors that
    establish the hypersphere frontier, and \(N\) denotes the size of data. As the
    training data may'
