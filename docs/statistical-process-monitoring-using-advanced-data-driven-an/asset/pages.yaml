  md: 'LEWMA (Lasso EWMA), this approach tests the same overall hypotheses as the
    prior method, but they initially formulate a test statistic that is computed across
    many values of the tuning parameter, \(\gamma\). The penalized likelihood function
    is written as


    ```

    \( L(\boldsymbol{\mu}) = n(\bar{\mathbf{x}} - \boldsymbol{\mu})''\mathbf{\Sigma}^{-1}(\bar{\mathbf{x}}
    - \boldsymbol{\mu}) + n\gamma \sum_{j=1}^p \frac{1}{|\bar{x}_j|^a}|\mu_j|, \)

    ```


    in which each variable is shrunk by its respective sample mean, and, as is often
    recommended, \(a = 1\). The estimator that minimizes the likelihood is denoted
    \(\boldsymbol{\mu}^*_\gamma\), and a lasso-based test statistic for the hypotheses
    in Eq. (3.12) is


    ```

    \( T_\gamma = \frac{n((\boldsymbol{\mu}^*_\gamma)''\mathbf{\Sigma}^{-1}\bar{\mathbf{x}})^2}{(\boldsymbol{\mu}^*_\gamma)''\mathbf{\Sigma}^{-1}\boldsymbol{\mu}^*_\gamma}.
    \)

    ```


    The selection of the correct subset of variables depends on the correct selection
    of \(\gamma\), which can be chosen in a variety of ways, such as cross-validation
    or BIC. However, the best \(\gamma\) for estimation does not always produce a
    powerful hypothesis test; therefore, Zou and Qiu [16] borrow from the nonparametric
    testing framework and create a single test statistic based on several values of
    \(\gamma\), as follows:


    ```

    \( T = \max_{j=1,\dots,q} \frac{T_{\gamma_j} - E(T_{\gamma_j})}{\sqrt{\text{Var}(T_{\gamma_j})}},
    \)

    ```


    where \(E(T_{\gamma_j})\) and \(\text{Var}(T_{\gamma_j})\) are the sample mean
    and variance of \(T_{\gamma_j}\) under the null hypothesis. The authors of [16]
    recommend setting \(q = r + 1\) or \(q = r + 2\) if prior knowledge indicates
    that shifts occur in at most \(r\) variables. When such knowledge is unavailable,
    they show that \(q = p\) also performs well in practice.


    To construct the LEWMA, the multivariate EWMA sequence is defined as


    ```

    \( \mathbf{u}_i = \lambda\mathbf{x}_i + (1 - \lambda)\mathbf{u}_{i-1}, \quad i
    = 1, 2, \dots, \quad (3.14) \)

    ```


    where \(\mathbf{u}_0 = 0\) and \(\lambda \in (0, 1]\) is a weight. Then, the EWMA
    is combined with the lasso, and \(q\) lasso estimators of the following penalized
    likelihood function for various values of \(\gamma\) are computed as


    ```

    \( (\mathbf{u}_i - \boldsymbol{\mu})''\mathbf{\Sigma}^{-1}(\mathbf{u}_i - \boldsymbol{\mu})
    + \gamma \sum_{j=1}^p \frac{1}{|\mathbf{u}_j|}|\mu_j|. \)

    ```


    Then, using


    ```

    \( W_{j,\gamma} = \frac{2 - \lambda}{\lambda[1 - (1 - \lambda)^{2j}]} \frac{(\mathbf{u}''_j\mathbf{\Sigma}^{-1}\boldsymbol{\mu}^*_\gamma)^2}{(\boldsymbol{\mu}^*_\gamma)''\mathbf{\Sigma}^{-1}\boldsymbol{\mu}^*_\gamma},
    \)

    ```'
