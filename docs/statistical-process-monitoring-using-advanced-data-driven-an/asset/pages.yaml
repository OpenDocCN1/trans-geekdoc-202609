  md: 'Commonly chosen options for \( g_{\gamma_j}(\cdot) \) include


    +   * \( L_0 \) penalty. The \( L_0 \) penalty is \( g_{\gamma_j}(\cdot) = \gamma
    \cdot I(|\beta_j| \neq 0) \), making the second term in Eq. (3.6) equal to \(
    \gamma \sum_{j=1}^p I(\beta_j \neq 0) \). This penalty constrains the number of
    predictors that can enter the model to be less than a prespecified number, denoted
    \( s \).

    +   * \( L_1 \) penalty. The \( L_1 \) penalty is \( g_{\gamma_j}(\cdot) = \gamma
    \cdot |\beta_j| \), making the second term in Eq. (3.6) equal to \( \gamma \sum_{j=1}^p
    |\beta_j| \). This then corresponds to the least absolute shrinkage and selection
    operator (lasso) proposed by [34]. As \( \gamma \rightarrow 0 \), the estimator
    converges to the least squares estimator of \( \boldsymbol{\beta} \).

    +   * Weighted \( L_1 \) penalty. This penalty weights the coefficients by an
    initial estimate of the coefficients, as follows:

    +     \(\ g_{\gamma_j}(\cdot) = \gamma \frac{|\tilde{\beta}_j|}{|\tilde{\beta}_j|^\alpha},\)


    where \( \tilde{\beta}_j \) is the initial estimate of \( \beta_j \), which can
    be the least squares estimate, and \( \alpha > 0 \) is a prespecified constant.
    It is often recommended to set \( \alpha = 1 \) [35, 36]. This weighted penalty
    corresponds to what is called *adaptive lasso*, and the weight allows for different
    shrinkage to be applied to different predictors, forcing those with already small
    coefficients to be driven to zero even faster. Adaptive lasso produces asymptotically
    unbiased coefficient estimates and has oracle properties, meaning it identifies
    the correct subset of variables and has an optimal estimation rate [35,37].


