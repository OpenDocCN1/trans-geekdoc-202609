  md: '# 5.4.1.3 Impact of the violation of normality assumption on the conventional
    Shewhart chart


    In this case study, we investigate the ability of wavelet-based monitoring to
    deal with non-Gaussian data. Specifically, the detection performance of single
    and multiscale Shewhart schemes are compared when the normality assumption underlying
    the univariate monitoring charts is violated. In other words, we investigate the
    impact of violating the normality assumption on the conventional Shewhart monitoring
    chart. The statistical performance of the two schemes is investigated using the
    chi-square data, with different values of a fourth-order cumulant (or kurtosis).
    The kurtosis is used in this study to quantify the non-Gaussianity in the data.
    For univariate data x1, x2, ..., xN, the formula for kurtosis is computed as


    Kurtosis = \frac{\sum_{i=1}^N (X_i - \mu)^4}{(N - 1)\sigma^4}, \quad (5.9)


    where μ is the mean, σ is the standard deviation, and N is the number of data
    points. In fact, kurtosis quantifies the degree of peakedness of a distribution;
    it is 3 for a Gaussian distribution. Generally speaking, if it is greater than
    3, the distribution is termed “super-Gaussian”, i.e., spikier than Gaussian, and
    if it is less than 3, such distribution is termed “sub-Gaussian”, i.e., flatter
    than Gaussian. To investigate the detection performance when the Gaussianity assumption
    is invalid, 1024 random fault-free data samples with a chi-square nonnormal distribution
    were generated. After computing detection limits of the two charts using the training
    data, another testing dataset of 1024 random samples with a chi-square distribution
    was generated. A step anomaly is then injected into the testing data between samples
    201–250, 501–525, and 701–725. The magnitude of the considered step fault is 3σ.
    For different values of the kurtosis taken between 3 and 14, each simulation is
    repeated 5000 times to get more accurate results. The means of the 5000 missed
    detection rates and false alarm rates as functions of kurtosis are presented in
    Fig. 5.12. It shows that the missed detection rate significantly increased as
    the departure from Gaussianity increased (i.e., when we increased the kurtosis
    of data) while false alarm rate increased slightly when the kurtosis increased.
    Fig. 5.12, which shows the average of missed detection rate and false alarms rate
    as a function of kurtosis of these two charts, clearly illustrates the advantages
    of the multiscale Shewhart chart over the conventional chart. This case study
    shows that, in most instances, the performance of the multiscale Shewhart chart
    is superior to that of the conventional Shewhart chart in detecting process mean
    faults.


    In essence, the wavelet-based univariate monitoring approaches offer several advantages
    compared to single scale monitoring schemes including: (i) decorrelating time-dependent
    data while keeping a Gaussian distribution; (ii) obtaining Gaussian wavelet coefficients
    at each scale even with non-Gaussian input data; (iii) separating noise from relevant
    features in the data; and (iv) compacting the deterministic features in a small
    number of coefficients.'
  merge: -1
