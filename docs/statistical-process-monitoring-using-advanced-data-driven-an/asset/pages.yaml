    # 4.6 Discussion


    To maintain the product quality, efficiency, and reliability of modern and complex
    processes, anomaly detection is becoming extremely important for process monitoring.
    Effective and early detection of process anomalies is vital for avoiding the progression
    of anomalies and reducing productivity loss; this can help avoid serious degradations
    or system crashes. Hence, anomaly detection is a hot topic attracting the interest
    of industrial practitioners and researchers.


    Linear LVR methods, such as PLS and PCA, are popular tools for monitoring multivariate
    data with collinearity or redundancy among the variables. LVR techniques have
    been widely exploited in modeling and monitoring multivariate industrial data
    that exhibit correlated/collinear variables. They are, however, limited due to
    their ineffective handling of processes nonlinearity by extracting only linear
    information from the data. Of course, linear LVR methods are inappropriate for
    data analysis and monitoring from complex nonlinear processes. To remedy this
    issue, various nonlinear LVR methods have been designed to extract nonlinear features
    and learn any nonlinear relation among process variables. NLVR-based monitoring
    methods are generally performed in two main steps, offline model building and
    online anomaly detection. In the first step, an'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'empirical model of the inspected process is designed from data representing
    the nominal behavior of the process, and decision thresholds are computed using
    SPE and T² charts. Then, the designed model with the decision thresholds is used
    to check new testing measurements for anomaly detection purposes. Non-linear LVR-based
    monitoring methods, such as KPCA and nonlinear PLS, are effective tools due to
    their detection efficiency and ease of implementation.


    In this chapter, we showed that KPCA-based monitoring approaches compare favorably
    with the conventional PCA approach. The performance of these methods was assessed
    in terms of FAR and MDR, based on data from WWTP located in Saudi Arabia. KPCA-based
    lSVM method could reliably uncover abnormal events that occurred in influent flow
    measurements. Different kernels were investigated; when applied to WWTP data,
    KPCA-lSVM using RBF kernel performed better than the considered linear and nonlinear
    kernels.


    In many practical applications such as air quality monitoring, multiple times
    series data are collected from different spatial locations with necessary spatio-temporal
    dependence, which is rarely considered in monitoring and decision-making. One
    direction for improvement is to extend the developed LVR-based monitoring techniques
    to account for spatio-temporal evolution of data (i.e., including information
    from spatial lags in the monitoring), and to utilize these improvements in various
    applications. Specifically, for the time-dependent data matrix, Xn×m, the dynamic
    of the data are considered by incorporating lagged variables in X. For instance,
    the data matrix X could comprise the m variables observed at instant t and instant
    t − 1. Similarly, observations from different locations can also be included in
    X. Careful consideration should be given to which lags and variables to include.
    In spatial statistics, it is common to select the nearest neighbors only; however,
    the optimal choice depends on the correlation among variables and the dependence
    existing in the underlying spatiotemporal process. We will investigate how to
    adapt the nearest neighbor idea to multivariate spatio-temporal processes in order
    to borrow valuable information while controlling the dimensionality of X.


    In various practical processes (including environmental, biological, and hydrological),
    data are functional in nature. For example, dust measurements for air quality
    monitoring can be viewed as a function of time. It has been shown that PCA for
    multivariate observations is not suitable for functional data [80–83]. For functional
    data, functional PCA (FPCA), similar to PCA, captures the most variations in the
    data based on the first few orthogonal functional principal components [84,82,85].
    Although FPCA is a popular statistical method in functional data analysis, it
    has not been used for process monitoring, fault detection, and diagnosis. The
    challenge is that space-time data are highly correlated and very high dimensional;
    in such cases, existing multivariate methods often have limitations, and suitable
    methods (e.g., control chart methods based on functional PCA) to deal with functional
    data are needed. Also, it will be very beneficial to develop function latent variable
    methods to monitor functional data.'
