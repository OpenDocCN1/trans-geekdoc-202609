    squared error (MSE) is minimized


    using fractional polynomials is their ability to produce a better description
    of data with fewer terms than conventional polynomials [37]. Thus, they are relatively
    flexible and parsimonious, which makes them more suitable to use in NLPLS than
    the fixed order polynomials. To alleviate these limitations, other extensions
    of nonlinear PLS, for example, those based on neural networks (NN), have been
    developed in order to approximate a nonlinear function of the inner model with
    more flexibility and fewer assumptions [38]. By using NN to learn and construct
