    In this section, we present two approaches based on RNN models for anomaly detection
    in multivariate time series data, namely residuals-based monitoring approaches
    and RNN-based clustering approaches.


    # 7.4.1 Residuals-based process monitoring approaches


    Anomaly detection in multivariate time-series data from industrial and environmental
    processes is important to identify abnormal events and trends that reduce safety
    margins. Here, we briefly describe the basic idea behind the residuals-based anomaly
    detection methodology using recurrent models (e.g., RNN, LSTM, GRU, and RNN-RBM).
    As discussed above, the benefits of the RNN models are due to their simplicity
    and capability to appropriately capture time dependencies in multivariate time
    series data. The used recurrent model is trained based on anomaly-free data. Only
    the normal sequences collected from the supervised process under nominal conditions
    are used for training. As the recurrent model is used to model normal behavior,
    training only has to be done once offline. The constructed recurrent model is
    adopted for monitoring new test data. The model is used to generate residuals
    for anomaly detection (Fig. 7.15). The residuals are, \(\mathbf{E} = [e_1, e_2,
    \dots, e_n]\), are the difference between the real measurements, \(\mathbf{Y}
    = [y_1, y_2, \dots, y_n]\), and the prediction from the RNN model \(\hat{\mathbf{Y}}
    = [\hat{y}_1, \hat{y}_2, \dots, \hat{y}_n]\). The residuals are defined as


    \(\mathbf{E} = \mathbf{Y} - \hat{\mathbf{Y}}.\) (7.24)'
