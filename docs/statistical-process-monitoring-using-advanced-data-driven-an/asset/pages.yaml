    averages for smoothing and visualization, asymmetric unimodal distribution having
    positive skewness and positive kurtosis is clearly visible. It can be concluded
    that this dataset is non-Gaussian distributed. This heatmap was reordered by the
    hierarchical clustering and the process variables are reordered in rows. Indeed,
    palettes having a similar composition in rows imply positive correlations, whereas
