    # ## 8.2.1.1 Preliminary materials: autoencoders


    An autoencoder is an extended version of a neural network constituted of a visible
    (input) layer, v, and a hidden layer, h [33]. Autoencoders are extensively used
    in multivariate processes to resolve problems of dimensionality reduction and
    feature extraction (see Fig. 8.3). Generally speaking, an autoencoder is trained
    without labeled data (unsupervised), and the main goal is to reconstruct inputs
    via two function encoders, E and D. The encoder function is expressed as h = E(v),
    which can be either linear or nonlinear. When E is nonlinear, the autoencoder
    will discover and learn more complex data representation than linear PCA [33].
    Essentially, the decoder function is denoted by \hat{v} = D(h). Its main objective
    is to reconstruct inputs based on learned features. The aim of the learning process
    is to minimize the negative log-likelihood of the reconstruction,


    ```

    Reconstruction error = -log(P(v|E(v)), (8.2)

    ```


    where P denotes the probability attributed to the input vector v by the model.'
