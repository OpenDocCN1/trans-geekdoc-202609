    # 4.4 Cases study: monitoring WWTP


    The aim of this case study is to show the detection capabilities of an assumption-free
    approach based on the KPCA model and the OCSVM detector. Here, the amalgamated
    KPCA-OCSVM is applied to monitor influent measurements from an actual wastewater
    treatment plant located in Saudi Arabia. Also, we compared the KPCA-OCSVM methods
    with conventional PCA-based methods to detect anomalies in nonlinear multivariate
    time series data. The influent measurements contain seven years of the daily dataset
    of 21 variables that include different flow quantities and water quality values.
    Measurements were carried out on samples collected from the headwork of WWTP to
    keep conformity with local standards. The supervised WWTP was treated municipal
    wastewater. Even with extended efforts and duly inspection by the local technicians,
    over a hundred anomalous influent conditions were missed. These undetected anomalies
    have led to negative impacts on the process due to different reasons causes as
    claimed by the practitioners, which highlights the greater necessity of research
    on statistical process monitoring.


