- pgno: 51
  md: '# 2.4.2.1 Kullback–Leibler-based monitoring scheme


    The essence of Kullback–Leibler divergence is to compute the dissimilarity between
    two probability distributions. The KLD was originated in the information theory
    domain and has been applied to several disciplines, such as classification, speech
    and image recognition [85,86], transportation [87], telecommunication [88], industry
    [89,90], and medicine [91]. As reported in the literature, KLD has a core role
    in solving anomaly detection and change detection problems [89,92,93]. This section
    presents the basic idea of KL divergence and how it can be used as an anomaly
    detector.


    **Definition 2.1.** The Kullback–Leibler information between two probability density
    functions (PDFs) \(p_1(x)\) and \(p_2(x)\) is defined as


    ```

    I(p_1 : p_2) = \int_{\mathbb{R}^d dx} p_1(x) \log \left[ \frac{p_1(x)}{p_2(x)}
    \right] dx, \quad (2.47)

    ```


    and between \(p_2(x)\) versus \(p_1(x)\) is given by:


    ```

    I(p_2 : p_1) = \int_{\mathbb{R}^d dx} p_2(x) \log \left[ \frac{p_2(x)}{p_1(x)}
    \right] dx. \quad (2.48)

    ```


    The KLI is an asymmetric measure (i.e., \(I(p_1 : p_2) \neq I(p_2 : p_1)\)) and
    non-negative (i.e., \(I(p_1 : p_2) \ge 0\) and \(I(p_2 : p_1) \ge 0\)). Also,
    the equality \(I(p_1 : p_2) = 0\) is possible only if the two distributions are
    strictly equal. The KLD distance represents the symmetric form of KLI [89] and
    is expressed as


    ```

    KLD(p_1; p_2) = I(p_1 : p_2) + I(p_2 : p_1). \quad (2.49)

    ```


    For two Gaussian distributions, \(p_1 \sim \mathcal{N}(\mu_0, \sigma_0)\) and
    \(p_2 \sim \mathcal{N}(\mu_1, \sigma_1)\), characterized respectively by their
    means \(\mu_0, \mu_1\) and variances \(\sigma_0^2, \sigma_1^2\), the KLD distance
    has the following analytical expression [94]:


    ```

    KLD(p_1 \\ p_2) = \frac{1}{\sigma_0\sqrt{2\pi}} \int \exp \left( \frac{(x - \mu_0)^2}{2\sigma_0^2}
    \right)

    \cdot \left[ \log \frac{\sigma_1}{\sigma_0} - \frac{(x - \mu_0)^2}{2\sigma_0^2}
    + \frac{(x - \mu_1)^2}{2\sigma_1^2} \right] dx

    = \frac{(\mu_1 - \mu_0)^2}{2\sigma_1^2} + \frac{1}{2} \left( \log \frac{\sigma_1^2}{\sigma_0^2}
    + \frac{\sigma_0^2}{\sigma_1^2} - 1 \right). \quad (2.50)

    ```


    In the case when anomalies occur only in the mean (i.e., \(\sigma_0^2 = \sigma_1^2\)),
    Eq. (2.50) can be expressed as


    ```

    KLD(p_1 \\ p_2) = \frac{(\mu_1 - \mu_0)^2}{2\sigma_1^2}. \quad (2.51)

    ```'
