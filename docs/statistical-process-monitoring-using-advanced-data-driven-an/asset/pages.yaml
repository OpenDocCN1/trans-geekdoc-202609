- pgno: 311
  md: '# Conclusion and further research directions


    Developing efficient anomaly detection and isolation schemes that offer early
    detection of potential anomalies in the monitored process and identify and isolate
    the source of the detected anomalies is indispensable to monitor process operations
    in an efficient manner. This will further enhance availability, operation reliability,
    and profitability of monitored processes and reduce manpower costs. This book
    is mainly devoted to data-driven fault detection and isolation methods based on
    multivariate statistical monitoring techniques and deep learning methods.


    The focus of this book is to offer a recent overview of anomaly detection and
    isolation methods, and it provides some new methods for the process monitoring
    purposes. Specifically, in the first part of this book, the objective was to tackle
    multivariate challenges in-process monitoring by merging the advantages of univariate
    and traditional multivariate techniques to enhance their performance and widen
    their practical applicability. Univariate monitoring schemes, such as EWMA (exponentially-weighted
    moving average) and CUSUM (cumulative sum) control charts, are widely used univariate
    control charts. The key ingredient to apply such tools to multivariate data is
    to apply appropriate multivariate dimension reduction techniques (e.g., partial
    least squares (PLS) and canonical correlation analysis (CCA)), according to the
    features of a process, and use control charts to monitor more informative variables
    in a lower dimension. Particularly, we presented methods, when relationships among
    variables are linear by developing latent variable regression (LVR)-based univariate
    monitoring techniques (EWMA, generalized likelihood ratio (GLR) test, and CUSUM),
    especially for detecting small faults in highly correlated multivariate data.
    Most commonly used monitoring techniques detect the anomaly as a shift in the
    means or variances of the process. In many real processes, the presence of an
    anomaly may manifest itself by a change in the process distribution (quantiles/extremes)
    rather than an additive bias in the means or variances. Thus, distribution-based
    process monitoring schemes (e.g., Kullback–Leibler, Hellinger metrics) were briefly
    presented to improve the monitoring performance of LVR-based approaches. To handle
    processes nonlinearity, we used a nonlinear LVR modeling approach, which is a
    powerful tool for processing nonlinearities. In this direction, nonlinear functions
    using an adaptive network-based fuzzy inference system are used as the inner relation
    of the LVR model'
  merge: -1
  img_proc: true
- pgno: 312
  md: '(i.e., mapping nonlinear relation between latent variable and output). Also,
    the nonlinear process monitoring using kernel PCA has been presented. Nonlinear
    LVR-based univariate (EWMA, CUSUM, GLR, Hellinger distance (HD), and Kullback–Leibler
    distance (KLD)) and multivariate (multivariate CUSUM (MCUSUM) and multivariate
    EWMA (MEWMA)) monitoring approaches with parametric and nonparametric thresholds
    have been developed to further improve process monitoring and the profitability
    of the developed mechanisms in practice. However, data observed from environmental
    and engineered processes are usually noisy and correlated in time, which makes
    fault detection (FD) more difficult as the presence of noise degrades FD quality,
    and most methods are developed for independent observations. Thereby, wavelet-based
    multiscale representation of a process are used to decorrelate data and reduce
    noise and then combine with LVR-based EWMA and CUSUM for both linear and nonlinear
    processes. In addition, we have presented fault isolation, which is an important
    component in-process monitoring, to identify variables that have been affected
    by the occurred fault. In this book, both traditional and modern fault isolation
    methods have been reviewed. We also briefly reviewed some metrics that may be
    used to verify the efficiency of fault isolation approaches along with two case
    studies for illustration.


    In the second part of this book, we merged the desirable properties of shallow
    learning approaches, such as a one-class support vector machine and k-nearest
    neighbors and unsupervised deep learning approaches to develop more sophisticated
    and efficient monitoring techniques. First, we provide an overview of some shallow
    machine learning approaches used in anomaly detection and outlier detection in
    data mining, namely data clustering techniques. Afterwards, we introduced deep
    learning-based approaches to handle dependence in time series data. The efficiency
    of the RNN-RBM approach relies on the combination of a powerful type of deep learning
    model designed to handle dependence in time series data, namely RNN, with the
    well-known RBM model. Here, RNN plays the role of recurrent features extractor
    that learns from a high-dimensional sequence of complex temporal dependencies.
    It also relies on the detection capability of binary clustering schemes. Specifically,
    the output of the mixed RNN-RBM model is fed to the clustering algorithms for
    anomaly detection. Thereafter, we presented different energy-based deep learning
    models and stacked autoencoders. Furthermore, many monitoring approaches based
    on deep probabilistic models such as DBN and deep autoencoder have been presented.
    Later, we applied some of the presented approaches to monitor many processes,
    such as wastewater treatment plants at KAUST and Golden, CO, USA, detection of
    obstacles in driving environments for autonomous robots and vehicles, and ozone
    pollution.


    As discussed above, there is no doubt that machine learning and deep learning
    have obtained a significant position in the existing state-of-the-art in-process
    monitoring field. As demonstrated in the previous chapters, the greater learning
    ability and the flexibility to approximate nonlinear functions make deep learning'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'models a promising tool for modeling and monitoring multivariable linear and
    nonlinear processes. However, the work presented in this book raises a number
    of questions and provides some directions for future work. In particular, the
    following topics merit consideration from researchers:


    +   Widespread, successful applications of deep learning provide evidence that
    the depth of deep learning methods provides significant advantages for monitoring
    schemes. However, there are many problems with deep-learning-based monitoring
    frameworks. For instance, applications of deep learning have progressed faster
    than theory, which leads to some gaps and questions that must be addressed. For
    example, what is the optimal number of layers and hyper-parameters for deep structures?
    Much future research is required to furnish practical and theoretical guidelines
    that address such questions. Moreover, due to the rapid advancement of computational
    technologies, deep learning could involve various kinds of learning, such as unsupervised,
    transfer, and reinforcement learning. It would be interesting to research a way
    to combine different types of learning to design a unified learning framework,
    as this may improve the feature learning capability of deep learning and, in turn,
    improve anomaly detection performance.


    +   Data-based methods using deep learning have shown to be effective for large
    and complex monitoring processes. However, in various practical processes (e.g.,
    environmental processes, biology, and hydrology), data are functional in nature.
    For example, dust measurements for monitoring air quality can be viewed as a function
    of time. It has been shown that PCA for multivariate observations is not suitable
    for functional data [1–4]. For these data, functional PCA (FPCA) captures the
    most variation based on the first few orthogonal functional principal components
    [4–7]. Although FPCA is a popular statistical method for functional data analysis,
    it has not been used for process monitoring or fault detection and diagnosis.
    There are some existing monitoring charts that can handle functional data, but
    in order to design efficient methods to detect anomalies in functional data, much
    research is still required. For instance, in most existing charts for statistical
    monitoring of functional data, observations are assumed to be uncorrelated. However,
    they may be naturally autocorrelated over time or space (which is taken into consideration
    in conventional monitoring methods). Therefore, time-dependent information should
    be integrated when designing monitoring methods for functional data.


    +   Moreover, existing deep learning methods should apply a functional data structure
    for anomaly detection. To handle this issue, functional data analysis may be helpful
    as it can be integrated with deep learning to develop innovative methods for process
    monitoring. Future research should aim to develop deep-learning-based monitoring
    methods that integrate functional data.


    +   In this chapter, we proposed a deep-learning-based monitoring approach for
    detecting abnormal ozone measurements at the regional scale. We did not consider
    the spatiotemporal correlation in the air quality monitoring network.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'When monitoring approaches are used to monitor spatial data, the spatial data
    structure should be well accommodated in the monitoring method. There is a need
    to develop a more flexible deep learning model that considers spatiotemporal correlations,
    as such a model will be more accurate, able to capture spatiotemporal features,
    and exhibit improved anomaly detection performance. It is also important for researchers
    to extend existing deep-learning-based monitoring techniques to account for the
    spatiotemporal evolution of data (i.e., by including information from spatial
    lags in monitoring) and to utilize these improvements in various applications.


    +   - Traditionally, deep learning and machine learning models are designed to
    achieve suitable results under the condition that the training and testing datasets
    are drawn the same distribution. On the assumption that the distribution of data
    changes, then a new model needs to be designed. However, designing a new model
    every time gathering new training data is time-consuming. To alleviate this challenge,
    transfer learning can be used for reducing the requirement to gather a large amount
    of training data. Generally speaking, the essence of transfer learning is to store
    knowledge obtained when solving one problem and apply it to another related problem.
    For instance, a deep learning model used for one task could be applied for a different
    task or another domain. Recently, the reinforcement learning concept has been
    widely applied in many disciplines including game theory, autonomous vehicles,
    and swarm intelligence [8–10]. As future work, it is of interest to develop other
    sophisticated technologies for process monitoring based on transfer learning and
    extreme learning.


    +   - Few statisticians are engaged in this stream of research, but there is a
    need to understand and improve deep learning models based on the promising combination
    of a deep learning framework and statistical methods.


