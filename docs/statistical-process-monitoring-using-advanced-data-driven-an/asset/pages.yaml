    $W$, and the bias vectors for the hidden and visible layers, $b_h(t)$ and $b_v(t)$,
    at time step $t$. The RBM biases are computed at every time point based on the
    LSTM unit at the preceding time point, which can be understood as the LSTM transmitting
    temporal information. The RBM''s hidden and visible layer biases are updated via
    LSTM at time point $t$ as


    ```

    $b_h(t) = b_h + \mathbf{W}'' S_t, \quad (7.19)$


    $b_v(t) = b_v + \mathbf{W}'''' S_t, \quad (7.20)$

    ```


    where $S_t$ is the external state of LSTM hidden unit $U_t$.


