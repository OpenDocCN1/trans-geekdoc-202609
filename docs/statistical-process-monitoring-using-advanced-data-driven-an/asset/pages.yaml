  md: 'the log-likelihood, L, can be expressed as L(Φ|X, Z) = log P(X|Φ, Z). The elements
    of the observed data X are often assumed follow Gaussian distributions with the
    parameters Φ = {μ, σ}. Generally speaking, EM is an iterative procedure for obtaining
    solution to maximum likelihood estimation with latent variables. To this end,
    EM iteratively performs expectation (E) and maximization (M) steps. The role of
    the E step is to generate a function for the expectation of the log-likelihood
    that is assessed based on the actual estimate for the parameters. On the other
    hand, the M step consists of computing parameters that maximize the expected log-likelihood
    obtained in the previous E step. For each cluster, EM attempt to estimate both
    standard deviations and means of the observed data (distribution) in order to
    maximize the likelihood. Expectation maximization decides about memberships to
    a cluster through computing probabilities of Gaussian mixture distributions. Every
    observation can be considered as a member of each cluster with a certain probability
    but the probability maximizing the observed data likelihood is utilized to select
    the cluster.


    # 6.3 One-class classification


    Here, we briefly introduce the basic idea behind two commonly used one-class anomaly
    detection methods, SVM and SVDD.


    # 6.3.1 One-class SVM


    Supervised support vector machines (SVMs) that have been widely applied for data
    classification are not suited for anomaly detection because of their need for
    labeled data. To bypass this challenge, unsupervised methods, such as one-class
    SVMs (OCSVMs), are designed by building a model that describes only normal operating
    conditions and uses it to flag out data points that do not conform to the reference
    model [1,2,46]. Generally speaking, the OCSVM procedure uses a kernel function
    for projecting input data points to a higher-dimensional feature space, where
    the discrimination of normal from anomalous data becomes clearer and easier. Essentially,
    a kernel-based procedure has the capacity to model the process nonlinearity of
    normal behavior if appropriately used. OCSVM uncovers anomalies in the feature
    space based on the construction of a hyperplane that appropriately separates the
    data from the origin. In fact, the OCSVM procedure learns decision functions D(x)
    that return -1 or 1 to respectively show whether the data is an anomaly or normal.
    The detection function D(x) is given as


    ```

    D(x) = \begin{cases} +1, \ & \text{if } x \text{ belongs to the area including
    most of observations,} \\ -1, \ & \text{otherwise.} \end{cases}

    (6.1)

    ```


    Consider that x_1, ..., x_j ∈ D and j ∈ [1, k] represents the training data. OCSVM
    projects the data points into the high-dimensional feature space F'
