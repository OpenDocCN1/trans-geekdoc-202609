  md: '# # Nonlinear latent variable regression methods


    # ## 4.1 Introduction


    Anomaly detection in modern processes is indispensable for ensuring optimal operating
    conditions and enhancing safety and avoid system crashes. To monitor many key
    variables simultaneously in engineering and environmental processes, multivariate
    monitoring techniques exploit the high correlation and redundancy, and generate
    a reduced set of uncorrelated variables. Although data-driven methods have shown
    some successes in-process monitoring, their efficiency is mainly related to the
    quality of extracted features. In other words, the accuracy of the model plays
    an important role in fault detection.


    Generally speaking, developing a flexible model faces huge challenges which include
    collinearity among the measured variables, nonlinearity, and noise in the measured
    data. Latent variable regression (LVR) techniques have demonstrated good capacity
    for handling multivariate correlated data by exploiting a high degree of redundancy
    in data and generating a reduced number of uncorrelated variables. Such techniques
    lead to well-conditioned models [1]. Linear LVR methods have been extensively
    applied in statistical process monitoring, such as principal component analysis
    (PCA) [2,3], partial least squares (PLS) [2,4,5], and regularized canonical correlation
    analysis (RCCA) [6–9], and could handle multidimensionality and cross-correlations.
    The key idea in LVR methods is to apply appropriate multivariate dimension-reduction
    techniques according to the features of a process, and use control charts to monitor
    more informative variables in a lower dimension. However, this might not be adequate
    for environmental and engineering processes when nonlinearity prevails.


    Indeed, because most practical data from various industrial applications are statistically
    challenging, due to their high-dimensional character, relationships among variables
    are nonlinear, and thus a variety of fault types can occur. Despite the successful
    application of LVR methods, their use is limited to capture linear information
    in the data. Thus, they result in poor performance, misleading insights, and loss
    of relevant information when used for highly nonlinear processes modeling and
    monitoring [10]. Indeed, selecting the optimal number of LVs when applying the
    linear LVR-based schemes to nonlinear processes is not an easy task. This is mainly
    because of nonlinear effects that distribute in a nonuniform manner among the
    LVs (i.e., LVs considered as less rele-'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'vant) may actually have a significant impact. Accordingly, flexible methods
    are required for suitable feature extraction to handle nonlinear processes. To
    capture nonlinearities in data, numerous nonlinear LVR strategies exist in the
    literature. Various LVR models for nonlinearity are available, such as Kernel
    PCA (KPCA), locally linear embedding (LLE) [11–13], and models based on polynomial
    functions, smoothing splines, artificial neural networks, and kernel learning
    [14–17].


    Despite the successful application of LVR models (PLS and PCA), they are limited
    to describe only linear correlations in data and thus can result in a significant
    loss of substantial information when handling process nonlinearity [10]. To alleviate
    the limitations of linear LVR methods for nonlinear input–output processes, several
    nonlinear PLS (NLPLS) methods have been designed for improving the extraction
    of features in the nonlinear data. Various nonlinear extensions of the NLPLS have
    been designed in the literature, such as quadratic, neural network, fuzzy, and
    kernel PLS [18–22]. For instance, in [23,24], an improved NLPLS method has been
    introduced by applying both smoothers and spline-based additive nonlinear regression
    methods to the extracted LVs. In [18,25], QPLS is developed by modeling the inner
    relation using a quadratic function. Nevertheless, quadratic functions are not
    flexible enough for modeling complex processes. Similarly, several nonlinear extensions
    have been designed for modeling the inner relationship in PLS, such as neural
    network PLS [19,20] and fuzzy PLS [22,21]. In [26], Malthouse et al. proposed
    a nonlinear PLS method using an artificial neural network to model the inner relational.
    Different nonlinear methods are used to effectively describe the inner relation
    in PLS, such as the feed-forward neural network [19,20], the Takagi–Sugeno–Kang
    (TSK) relations [21], and the quadratic fuzzy function [22]. Another nonlinear
    PLS model, called kernel PLS, is designed by projecting the input data to a feature
    space using kernel functions where a linear PLS is performed [16].


    For input-space models (such as PCA), nonlinear PCA (NLPCA) is an extension of
    PCA that allows extracting nonlinear relationships among the process variables.
    This can be obtained by mapping the measured variables onto curves and surfaces
    rather than lines and planes, as in the case of linear PCA. Also, different forms
    of neural network models have been proposed to capture the nonlinearity among
    the principal components [27,28,14], where the NLPCA model parameters are determined
    by minimizing the mean-squared error between the model prediction and the measured
    data. Another way of dealing with nonlinearities in process data is by using kernel
    PCA (KPCA) [20,21,13]. The key concept of the KPCA is first to project the input
    space into a high-dimensional feature space (transformed space) using a nonlinear
    mapping, and then extract principal components (PCs) in the feature space [12,29].
    Essentially, KPCA can efficiently calculate PCs in feature spaces, using integral
    operators and nonlinear kernel functions [11,30]. The main advantage of the KPCA
    method over nonlinear PCA methods is that nonlinear optimization is totally avoided.'
