    \ The standardization can be either univariate or multivariate. The classical\
    \ univariate approach is simply\n\n```\n$$\\frac{\\mathbf{x}_j - \\hat{\\mu}_j}{\\\
    hat{\\sigma}_j},$$\n```\n\nfor $\\hat{\\mu}_j$ and $\\hat{\\sigma}_j$ the sample\
    \ mean and standard deviation of variable $j$, respectively, for $j = 1, \\dots,\
