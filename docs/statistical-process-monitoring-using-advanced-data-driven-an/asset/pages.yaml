- pgno: 13
  md: '# Chapter 1


    # Introduction


    # 1.1 Introduction


    # 1.1.1 Motivation: why process monitoring


    Recent decades have witnessed a huge growth in new technologies and advancements
    in instrumentation, industrial systems, and environmental processes, which are
    becoming increasingly complex. Diagnostic operation has become an essential element
    of these processes and systems to ensure their operational reliability and availability.
    In an environment where productivity and safety are paramount, failing to detect
    anomalies in a process can lead to harmful effects to a plant’s productivity,
    profitability, and safety. Several serious accidents have happened in the past
    few decades in various industrial plants across the world, including the Bhopal
    gas tragedy [1,2], the Piper Alpha explosion [3,4], the accidents at the Mina
    al-Ahmadi Kuwait refinery [5] and two photovoltaic plants in the US burned in
    2009 and 2011 (a 383 KWp PV array in Bakersfield, CA and a 1.208 MWp power plant
    in Mount Holly, NC, respectively) [6]. The Bhopal accident, also referred to as
    the Bhopal gas disaster, was a gas leak accident at the Union Carbide pesticide
    plant in India in 1984 that resulted in over 3000 deaths and over 400,000 others
    gravely injured in the local area around the plant [1,2]. The explosion of the
    Piper Alpha oil production platform, which is located in the North Sea and managed
    by Occidental Petroleum, caused 167 deaths and a financial loss of around $3.4
    billion [3,4]. In 2000, an explosion occurred in the Mina Al-Ahmadi oil refinery
    in Kuwait, killing five people and causing serious damage to the plant. The explosion
    was caused by a defect in a condensate line in a refinery. Nimmo [7] has estimated
    that the petrochemical industry in the USA can avoid losing up to $20 billion
    per year if anomalies in inspected processes could be discovered in time. In safety-critical
    systems such as nuclear reactors and aircrafts, undetected faults may lead to
    catastrophic accidents. For example, the pilot of the American Airlines DC10 that
    crashed at Chicago O’Hare International Airport was notified of a fault only 15
    seconds before the accident happened, giving the pilot too little time to react;
    this crash could easily have been avoided according to [8]. Recently, the Fukushima
    accident of 2011 in Japan highlighted the importance of developing accurate and
    efficient monitoring systems for nuclear plants. Essentially, monitoring of industrial
    processes represents the backbone for ensuring the safe operation of these processes
    and to ensure that the process is always functioning properly.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1.1.2 Types of faults


    Generally speaking, three main subsystems are merged to form a plant or system:
    sensors, actuators, and the main process itself. These systems'' components are
    permanently exposed to faults caused by many factors, such as aging, manufacturing,
    and severe operating conditions. A fault or anomaly is a tolerable deviation of
    a characteristic property of a variable from its acceptable behavior that could
    lead to a failure in the system if it is not detected early enough so that the
    necessary correction can be performed [9]. Conventionally, a fault, if it is not
    detected in time, could progress to produce a failure or malfunction. Note that
    there is a distinction between failure and malfunction; this distinction is important.
    A malfunction can be defined as an intermittent deviation of the accomplishment
    of a process''s intended function [10], whereas failure is a persistent suspension
    of a process''s capability to perform a demanded function within indicated operating
    conditions [10].


    In industrial processes, a fault or an abnormal event is defined as the departure
    of a calculated process variable from its acceptable region of operation. The
    underlying causes of a fault can be malfunctions or changes in sensor, actuator,
    or process components:


    +   - Process faults or structural changes. Structural change usually takes place
    within the process itself due to a hard failure of the equipment. The information
    flow between the different variables is affected because of these changes. Failure
    of a central controller, a broken or leaking pipe, and a stuck valve are a few
    examples of process faults. These faults are distinguished by slow changes across
    various variables in the process.


    +   - Faults in sensors and actuators. Sensors and actuators play a very important
    role in the functioning of any industrial process since they provide feedback
    signals that are crucial for the control of the plant. Actuators are essential
    for transforming control inputs into appropriate actuation signals (e.g., forces
    and torques needed for system operation). Generally, actuator faults may lead
    to higher power consumption or even a total loss of control [11]. Faults in pumps
    and motors are examples of actuator faults. On the other hand, sensor-based errors
    include positive or negative bias errors, out of range errors, precision degradation
    error, and drift sensor error. Sensor faults are generally characterized by quick
    deviations in a few numbers of process variables. Fig. 1.1 shows examples of the
    most commonly occurring sensor faults: bias, drift, degradation, and sensor freezing.


    We can also find in the literature another type of anomaly called gross parameter
    changes in a model. Indeed, parameter failure occurs when there is a disturbance
    entering the monitored process from the environment through one or more variables.
    Some common examples of such malfunctions include a change in the heat transfer
    coefficient, a change in the temperature coefficient in a heat exchanger, a change
    in the liquid flow rate, or a change in the concentration of a reactant.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/aa2f42c739937b682075082233e335bb_15_0.png)


    **FIGURE 1.1** Commonly occurring sensor faults. (A) Bias sensor fault. (B) Drift
    sensor fault. (C) Degradation sensor fault. (D) Freezing sensor fault.


    ![](img/aa2f42c739937b682075082233e335bb_15_1.png)


    **FIGURE 1.2** Fault types. (A) Abrupt anomaly. (B) Gradual anomaly. (C) Intermittent
    anomaly.


    Thus, sensor or process faults can affect the normal functioning of a process
    plant. In today’s highly competitive industrial environment, improved monitoring
    of processes is an important step towards increasing the efficiency of production
    facilities.


    In practice, there is a tendency to classify anomalies according to their time-variant
    behavior. Fig. 1.2 illustrates three commonly occurring types of anomalies that
    can be distinguished by their time-variant form: abrupt, incipient, and intermittent
    faults. Abrupt anomalies happen regularly in real systems and are generally typified
    by a sudden change in a variable from its normal operating range (Fig. 1.2A).
    The faulty measurement can be formally expressed as


    ```

    M(t) = \begin{cases} r(t), & t < t_a, \\ r(t) + F, & t \ge t_a, \end{cases} \quad
    \text{(1.1)}

    ```


    where _F_ is a bias that happens at the time instant _t<sub>s</sub>_.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The drift anomaly type can be caused by the aging or degradation of a sensor
    and can be viewed as a linear change of the magnitude of fault in time. Here,
    the measurement corrupted with a drift fault is modeled as


    ```

    m(t) = \begin{cases} r(t), & t < t_a, \\ r(t) + \theta(t - t_a), & t \ge t_s,
    \end{cases} (1.2)

    ```


    where \(\theta\) is a slope of the slow drift and \(t_a\) is the start time of
    the occured fault. Finally, intermittent faults are faults characterized by discontinuous
    occurrence in time; they occur and disappear repeatedly (Fig. 1.2C).


    Generally, industrial and environmental processes are exposed to various types
    of faults that negatively affect their productivity and efficiency. According
    to the form in which the fault is introduced, faults can be further classified
    as _additive and multiplicative faults_. Additive faults often appear as offsets
    of sensors or as additive bias, while multiplicative faults influence process
    parameters. Specifically, in an additive fault, the measurable variable \(Y(t)\)
    is corrupted by an additive fault, \(\theta_t\), as \(Y = Y_t + \theta_t\). On
    the other hand, a multiplicative fault influences a measurable variable \(Y\)
    by the product of another variable \(U\) with \(\theta_t\) (i.e., \(Y = (a + f)U_t\)),
    where \(U_t\) is the input variable.


    # 1.1.3 Process monitoring


    Before automation became commonplace in the field of process monitoring, human
    operators carried out important control tasks in managing process plants. However,
    the complete reliance on human operators to cope with abnormal events and emergencies
    has become increasingly difficult because of the complexity and a large number
    of variables in modern process plants. Considering such difficult conditions,
    it is understandable that human operators tend to make mistakes that can lead
    to significant economic, safety, and environmental problems. Thanks to advancements
    in technology over recent years, automation of process fault detection and isolation
    has been a major milestone in automatic process monitoring. Automatic process
    monitoring has been shown to respond very well to abnormal events in a process
    plant with much fewer mistakes compared to fault management by human operators.


    The demand for a monitoring system that is capable of appropriately detecting
    abnormal changes (sensor or process faults) has attracted the attention of researchers
    from different fields. The _detection and isolation_ of anomalies that may occur
    in a monitored system are the two main elements of process monitoring (Fig. 1.3).
    The purpose of the detection step is to detect abnormal changes that affect the
    behavior of the monitored system. Once the anomaly is detected, effective system
    operation also requires evaluation of the risk of a system shut-down, followed
    by fault isolation or correction before the anomaly contaminates the process performance
    [12,13]. The purpose of fault isolation is to determine the source responsible
    for the occurring anomalies, i.e., to determine which sensor or process component
    is faulty. In practice, sometimes it is also essential to'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/aa2f42c739937b682075082233e335bb_17_0.png)


    # FIGURE 1.3 Steps of process monitoring.


    assess the severity of the occurred fault, which is done by the fault identification
    step. Here, we will focus only on fault detection and isolation.

    There are two types of anomaly detection:


    +   Online fault detection. The objective of online anomaly detection is to set
    up a decision rule capable of detecting, as quickly as possible, the transition
    from a normal operating state to an abnormal operating state. Online detection
    is based on the idea that system evolution is considered a succession of stationary
    modes separated by fast transitions.


    +   Offline fault detection. The purpose of offline fault detection is to detect
    the presence of a possible anomaly outside of the use of the monitored system.
    The system is observed for a finite period (the system is in stationary mode),
    and then, based on these observations, a decision is made on the state of the
    monitored system. Offline detection methods rely on an observation number fixed
    a priori, where the observations also come from the same law.


    # 1.1.4 Physical redundancy vs analytical redundancy


    Process monitoring is essentially based on the exploitation of redundant sources
    of information. There are two types of redundancy in the process: physical redundancy
    and analytical redundancy (Fig. 1.4A–B). The essence of hardware or physical redundancy,
    which is a traditional method in process monitoring, consists of measuring a particular
    process variable using several sensors (e.g., two or more sensors). To detect
    and isolate simple faults, the number of sensors to use should be doubled. Specifically,
    under normal conditions, one sensor is sufficient to monitor a particular variable,
    but adding at least two extra sensors is generally needed to guarantee reliable
    measurements and monitoring under'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/aa2f42c739937b682075082233e335bb_18_0.png)


    faulty conditions. Typically, fault detection and isolation are achieved by a
    majority vote between all the redundant sensors. This strategy has been widely
    used in the industry because of its reliability and simplicity of implementation.
    In practice, the main disadvantage of hardware redundancy is the additional cost
    of equipment and maintenance, as well as the space needed to install the equipment
    that increases complexity considerably in the already very complex systems. In
    addition, this method is limited in practice to sensor faults and cannot detect
    faults in variables that are not measured directly. This approach is mainly only
    justified for critical systems, such as nuclear reactors and aeronautic systems.
    Unlike a physical redundancy, which is performed by adding more sensors (hardware)
    to measure a specific process variable, the analytical redundancy does not require
    additional hardware because it is based on using the existing relations between
    the dependent measured variables that are or are not of the same nature. Analytical
    redundancy is a more accessible strategy that compares the measured variable with
    the predicted values from a mathematical model of the monitored system. It thereby
    exploits redundant analytical relationships among various measured variables of
    the monitored process and avoids replicating every hardware separately.


    # ## 1.2 Process monitoring methods


    Today, engineering and environmental processes have become far more complex due
    to advances in technology. Anomaly detection and isolation have become necessary
    to monitor the continuity and proper functioning of modern industrial systems
    and environmental processes. Depending on the field of application, the repercussions
    of anomalies become binding and harmful if it concerns human safety, such as in
    aeronautical systems and nuclear reactors. Advancements in'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'the field of process control and automation over the last few years have yielded
    various methods for successful diagnosis and detection of abnormal events. To
    meet safety and productivity requirements, extensive theoretical and practical
    monitoring methods have been developed. These methods are generally divided into
    three families of approaches, depending on the nature of the knowledge available
    on the system: model-, knowledge-, and data-based methods. A thorough overview
    of process fault detection and diagnosis can be found in [5]. Fig. 1.5 shows a
    summary of various monitoring methods; this section presents a brief overview
    of these monitoring techniques.


    ![](img/aa2f42c739937b682075082233e335bb_19_0.png)


    FIGURE 1.5 A summary of various fault detection approaches.


    # 1.2.1 Model-based methods


    Over the past three decades, numerous monitoring methods to improve the safety
    and productivity of several environmental and engineering processes have emerged.
    Model-based methods have proven especially useful in industrial applications where
    keeping the desired performance is highly required. A model-based method involves
    comparing the process''s measured variables with the prediction from the mathematical
    model of the process. The conceptual schematic of the model-based fault detection
    is illustrated in Fig. 1.6. The


    ![](img/aa2f42c739937b682075082233e335bb_19_1.png)


    FIGURE 1.6 Conceptual schematics of model-based process monitoring.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'backbone of the model-based method is the generation of residuals by comparing
    the measurement data with their predictions from the analytical model of the monitored
    process. Indeed, the residuals play the role of a fault indicator. Ideally, in
    the absence of modeling uncertainties and errors, the residual will be zero and
    the model will perfectly fit the measurements. Thus, any departure of the residual
    from zero indicates the presence of faults. However, in practice, we cannot avoid
    the presence of modeling uncertainties and noise measurements. In other words,
    a perfectly precise analytical model of an inspected process is never available.
    Notice that there is a distinction between a deviation of the real measurement
    and its prediction from a reference model, even under no-fault conditions. Hence,
    instead of using the departure of residuals from zero as a fault indicator, detection
    can be done by constructing a detection threshold that distinguishes between fault-free
    residuals and anomalies. The detection performance is mainly related to the selected
    detection threshold. This means that if the value of the thresholds is too small,
    then we get repeat false alarms due to errors and uncertainties when the residuals
    overpass the threshold and are consequently flagged as faults; this scenario obviously
    must be avoided. The detection threshold should thus be computed so that the frequency
    of correct detection is maximized for a given small number of false alarms (e.g.,
    5% or 1%). To address this concern, several statistical schemes have been proposed
    to monitor the residuals vector, including the generalized likelihood ratio approach,
    cumulative sum (CUSUM) type schemes, and EWMA schemes. In the case of multivariate
    data, when the residuals matrix is generated, multivariate extensions of CUSUM
    and EWMA and T^2 are usually used to detect faults in the mean/variance of process.


    In summary, fault detection and isolation using model-based methods usually take
    place in two distinct steps:


    +   The first step consists of residual generation. Ideally, these residuals must
    be zero in normal operation and nonzero in the presence of an anomaly. However,
    the presence of noise and modeling errors make the residuals fluctuate around
    zero. A significant divergence of the residual from zero is an indication of faults.


    +   The second step concerns the evaluations of the residuals based on a decision
    procedure for detecting and isolating faults. This is done using statistical detection
    techniques such as EWMA, CUSUM, and generalized likelihood ratio (GLR) test [12].


    A substantial amount of research work has been carried out on model-based monitoring
    methods. Methods that fall into the model-based monitoring category include parity
    space approaches [14–17], observer-based approaches [18,19], and interval approaches
    [20]. A related discussion and a comprehensive survey on model-based fault detection
    methods can be found in [21–23].


    Essentially, the detection performance of model-based approaches is closely related
    to the accuracy of the reference model. The availability of an accurate'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'model that mimics the nominal behavior of the monitored process is very helpful
    for facilitating the detection of faulty measurements. However, for complex processes,
    such as those of many industrial and environmental processes with a large number
    of variables, deriving and developing accurate models is not always easy and can
    be time-consuming, which makes them nonapplicable for many applications. For instance,
    modeling the inflow measurements of wastewater treatment plants is very challenging
    because of the presence of a large number of variables that are nonlinearly dependent
    and autocorrelated. Additionally, modeling modern industrial and environmental
    processes is challenging because of the complexity and the absence of a precise
    understanding of these processes. The successful detection of faults using model-based
    approaches can, therefore, be considered a challenging and unsuitable approach.
    Alternatively, data-based methods are more commonly used.


    # 1.2.2 Knowledge-based methods


    The success of modern industrial systems relies on their proper and safe operation.
    Early detection of anomalies as they emerge in the inspected process is essential
    for avoiding extensive damage and reducing the downtime needed for reparation
    [24]. As discussed above, when the information available to understand the process
    under fault-free operation is insufficient to construct an accurate analytical
    model, analytical monitoring methods are no longer effective. Knowledge-based
    methods present an alternative solution to bypass this difficulty. In the following,
    we use artificial intelligence methods and available historical measurements,
    which inherently represent the correlation of the process variables, to extract
    the underlying knowledge and system characteristics. In other words, we utilize
    process characteristic values, such as variance, magnitude, and state variables,
    for extracting features under fault-free and faulty conditions based on heuristic
    and analytical knowledge. Fault detection is then performed in a heuristic manner.
    Specifically, the actual features from the on-line data are compared with the
    obtained under-lying knowledge. Methods that fall in this category include expert
    systems [25], fuzzy logic, Hazop-digraph (HDG) [5], possible cause and effect
    graphs (PCEG) [26], neuro-fuzzy based causal analysis, failure mode and effect
    analysis (FMEA) [27], and Bayesian networks [28]. The major drawback of these
    techniques is that they are more appropriate for small-scale systems and thus
    may not be suited to inspect modern systems.


    # 1.2.3 Data-based monitoring methods


    Engineering and environmental processes have undoubtedly become far more complex
    due to advances in technology. Consequently, designing an accurate model for complex,
    high dimensional and nonlinear systems has also become very challenging, expensive,
    and time-consuming to develop. Setting simplifications and assumptions on models
    leads to limits in their capacity to capture'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'certain relevant features and operation modes, and induces a modeling bias
    that significantly degrades the efficiency of the monitoring system. In the absence
    of a physics-based process model, data-driven statistical techniques for process
    monitoring have proved themselves in practice over the past four decades. Indeed,
    data-based implicit models only require an available process-data resource for
    process monitoring [5]. Data-based monitoring techniques are mainly based on statistical
    control charts and machine-learning methods.


    Essentially, these monitoring techniques rely on historical data collected from
    the monitoring system. The system is modeled as a black box with input and output
    data (Fig. 1.7). At first, a reference empirical model that mimics the nominal
    behavior of the inspected process is constructed using the fault-free data, and
    then this model is used for detecting faults in new data. In contrast to model-based
    methods, only historic process data is required to be available in the data-based
    fault detection methods, and they are classified into two classes: qualitative
    and quantitative methods.


    ![](img/aa2f42c739937b682075082233e335bb_22_0.png)


    FIGURE 1.7 Data-based methods.


    Unsupervised data-based techniques for fault detection and isolation do not use
    any prior information on faults affecting the process. Unsupervised data-based
    techniques cover a set of methods for monitoring industrial processes through
    tools such as statistical control charts (see Fig. 1.8). Univariate techniques,
    such as a Shewhart chart, exponentially weighted moving average (EWMA) [29], and
    cumulative sum (CUSUM), are used for monitoring only a single process variable
    at a given time instant. Monitoring charts have been extensively exploited in
    most industrial processes. CUSUM and EWMA schemes show good capacity in sensing
    small changes compared to the Shewhart chart. In [30], a spectral monitoring scheme
    is designed based on the information embedded in the coefficients of the signal
    Fourier. However, these conventional schemes are designed based on the hypotheses
    that the data are Gaussian and uncorrelated. To escape these basic assumptions,
    multiscale monitoring schemes using wavelets have been developed [31]. Furthermore,
    the above-discussed schemes use static thresholds computed using the fault-free
    data. Recently, several adaptive monitoring methods have been developed. These
    schemes are, in practice, more flexible and efficient than conventional schemes
    with fixed parameters. For more details, see [32–35]. These univariate monitoring
    schemes'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'examine a particular variable at a time instant by assuming independence between
    variables. When monitoring multivariate data using several univariates, even when
    the number of false alarms of each scheme is small, the collective rate could
    be very large [36–38]. In addition, measurements from modern industrial processes
    are rarely independent and present a large number of process variables. Since
    univariate schemes ignore the cross-correlation between variables, they consequently
    suffer from an inflated number of undetected issues and false alarms, which makes
    this monitoring scheme unsuitable [36–38].


    ![](img/aa2f42c739937b682075082233e335bb_23_0.png)


    FIGURE 1.8 Data-based monitoring techniques.


    To alleviate this difficulty and to handle high dimensional data effectively,
    multivariate monitoring schemes have been developed to take into account the correlations
    between the variables, and thus monitor processes with several variables. These
    schemes include Hotelling $T^2$ [39], multivariate EWMA [40], and multivariate
    CUSUM [41]. However, the performance of these multivariate schemes degrades as
    the number of variables monitored increases, which makes them unsuitable for high
    dimensional data.


    Multivariate monitoring methods for monitoring multivariate data have been designed
    to directly tackle the above limitations. Multivariate statistical methods are
    useful for compressing data and retaining relevant information, which is more
    appropriate to analyze than the original data. Moreover, these methods are efficient
    at handling noise and interactions between variables to effectively extract pertinent
    information. The most common multivariate methods for fault detection are principal
    component analysis (PCA) [22,42], partial least squares (PLS), principal component
    regression (PCR), canonical variate analysis (CVA), and independent component
    analysis (ICA) [43]. The essential element of multivariate statistical methods,
    such as PCA, is their ability to transform multivariate correlated variables to
    a reduced set of uncorrelated variables. In the past two decades, these techniques
    have been extensively used to monitor industrial processes. For fault detection
    purposes, the original data is first projected into a'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'latent subspace, where latent variables and residuals are monitored. PCA and
    PLS are the two most popular multivariate statistical methods that use latent
    variable methods for monitoring because they have a strong mathematical foundation
    that is available in the literature. Indeed, the PCA or PLS model is constructed
    based on historical normal process operations. This empirical model could be used
    to monitor the future behavior of the process. Any departure from the model should
    be flagged as a potential anomaly, such as sensor fault or process drift. PCA
    is used to reduce dimensionality in the process data and to retain important features
    of the data. PCA projects the observations from a higher dimension on to a lower-dimensional
    subspace and is optimal in terms of capturing the data variability. The PCA procedure
    is applied to a single data matrix only, whereas PLS models the relationship between
    two data matrices while compressing them simultaneously. The PCA technique is
    used to monitor and detect the faults in a multivariate process, along with the
    two fault detection indices, $T^2$ and the squared prediction error (SPE) statistics.
    The major advantage of latent variable approaches (i.e., PCA and PLS) is that
    a limited number of monitoring schemes are needed for monitoring multivariate
    data using monitoring indices of $T^2$ and SPE.


    However, data from modern industrial processes are time-dependent, non-stationary,
    nonlinear, non-Gaussian, and multiscale [44–47]. Most process monitoring methods
    assume that the process measurements at a given time are independent of the observations
    at a past sampling instant. Industrial processes are operated under dynamic conditions
    and variables have strong autocorrelation properties. Augmenting observations
    at a previous sampling time with observations at the present sampling time is
    referred to as Dynamic PCA (DPCA) [48,49]. For high-dimensional and time-dependent
    industrial data, using a fixed model monitoring approach could lead to poor diagnostic
    results [50]. However, process monitoring for such processes could be improved
    by updating the model using a recursive PCA and a moving window PCA technique
    [50]. Recursive PCA updates the model continuously online; similarly, online adaptive
    PCA updates the model using EWMA [50,51]. For nonlinear processes, a nonlinear
    version of data-based methods have been used, such as kernel PCA, kernel PLS,
    polynomial PLS and quadratic or fuzzy PLS, to reveal nonlinear relationships between
    variables [46]. In practice, most of the data need not be Gaussian in nature;
    to handle the non-Gaussian nature of the data, independent component analysis
    (ICA), the Gaussian mixture model (GMM), and its nonlinear variant have been used
    [47]. Other extensions have been developed, such as multiway PCA [45] that permits
    analyzing data from batch processes, and multiscale PCA that monitors processes
    at different frequency bands and denoises the data and reduces autocorrelation.
    Overall, these extensions are introduced based on an understanding of the nature
    of the data gathered from the inspected process. Accordingly, understanding the
    process characteristics is a central factor to meet practical expectations and
    construct an effective statistical monitoring system.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Other approaches that fall into this category are based on machine- and deep-learning
    methods, which have recently gained considerable attention from researchers due
    to their ability to learn from large and complex datasets. Under a machine-learning
    framework, support vector machines (SVM) [52–54] and artificial neural networks
    (ANNs) have become an important tool in fault detection literature. Recently,
    increasing process complexity has resulted in the development of several monitoring
    methods based on deep learning that can account for features such as time dependency,
    nonlinearity, and nonnormality. A major strategy has been to extract features
    from the data using deep learning models, such as Restricted Boltzmann Machine
    (RBM), Deep Belief Network (DBM), Deep Boltzmann Machine (DBM), Long Short-Term
    Memory (LSTM), and recurrent neural network (RNN), and to monitor the extracted
    features using binary clustering schemes or traditional monitoring charts. For
    instance, [55] introduced an approach that integrated an RNN-RBM model with clustering
    algorithms including k-means, spectral clustering, and OCSVM, for anomaly detection
    in WWTPs. In [56], several deep learning-based monitoring methods, such as DBN,
    deep-stacked auto-encoders, and restricted Boltzmann machines- based clustering
    procedures, were applied to detect abnormal ozone pollution. Deep-learning methods
    are appealing because of their flexibility to not make restricting assumptions
    on the underlying data. Also, applications using deep learning cover detection
    in complex data as multivariate time-series data [57], images and videos [58,59].


    # 1.3 Fault detection metrics


    To verify the performance of fault detection methods, several well-know metrics
    are commonly employed in the context of binary detection problems. Basically,
    many detection performance metrics are computed based on the 2 × 2 confusion matrix
    that reports the number of true positives (TP), false positives (FP), false negatives
    (FN), and true negatives (TN) [60]. The detection quality of the fault detection
    methods can be assessed using a false positive rate (FPR) (i.e., false alarm rate),
    a true positive rate (TPR) (i.e., detection rate, precision, accuracy, F-measure,
    recall, and the area under the curve (AUC). Fig. 1.9 displays a confusion matrix
    and recapitulate equations of the well-known related metrics that are frequently
    used to assess the performance of a binary decision method [60,61].


    Also, another metric called average run length (ARL), which is able to characterize
    both types of error, I and II, is usually used to evaluate detection quality.
    Specifically, there are two kinds of ARL: ARL0 and ARL1. ARL0 is the average number
    of data points a fault detection method takes to flag out an alarm when the process
    is under control. ARL1 refers to the number of data points it takes a monitoring
    method to uncover a fault under faulty conditions (i.e., speed of detection).'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# The confusion matrix


    | | True class Positive | True class Negative | Row Totals |

    |---|---|---|---|

    | **Predicted class Positive** | true positive (tp) | false positive (fp) | \(PP
    = tp + fp\) |

    | **Predicted class Negative** | false negative (fn) | true negative (tn) | \(PN
    = fn + tn\) |

    | **Column Totals** | \(RP = tp + fn\) | \(RN = fp + tn\) | |


    # Performance Metrics


    ```

    \(TPR = \frac{tp}{RP}\)


    \(FPR = \frac{fp}{RN}\)


    \(Accuracy = \frac{tp+tn}{RP+RN}\)


    \(Precision = \frac{tp}{PP}\)


    \(F_1Score = 2 * \frac{Precision \cdot TPR}{Precision + TPR}\)


    \(AUC = \frac{TPR - FPR + 1}{2}\)

    ```


    FIGURE 1.9 Fault detection metrics.


    # 1.4 Conclusion


    In summary, accurately detecting and isolating faults that can occur in industrial
    and environmental processes is essential to minimize downtime, increase safety,
    reduce maintenance costs, and extend equipment lifetime. Process monitoring is
    required to successfully detect, isolate, and remove the faults before they affect
    the process performance. Several aspects should be considered when designing or
    using a particular fault detection approach, including the type of fault, process
    dynamics, measured variables, available data, and complexity. The simplest and
    most common practice is to directly check the limit of a measurable variable.
    However, these techniques are limited when monitoring large-scale processes. This
    has led to the development of reliable techniques that incorporate information
    from not just one process variable, but that include more knowledge about the
    process such as process state and parameters. Some approaches rely on accurate
    process models whereas others use available historical process data. Process model-based
    monitoring that incorporates dynamics information is easy to implement for well-defined
    systems; however, process model-based monitoring needs accurate models that are
    not always easy to obtain, in particular for complex processes. On the other hand,
    when information on the reliance of faults and symptoms is available, knowledge-based
    approaches are preferable; however, these approaches are limited to small and
    simple processes. An alternative approach is to use data-based monitoring techniques,
    which are flexible and assumption-free. Of course, when a large amount of process
    data is available, and the process is too complex to be explicitly modeled, data-based
    techniques are more appropriate because of their flexibility to handle large,
    noisy, and nonlinear data.'
