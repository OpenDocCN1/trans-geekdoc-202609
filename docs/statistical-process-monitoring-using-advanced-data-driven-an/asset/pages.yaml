    # ## 7.3.2 RNN-RBM method


    The RNN-RBM model was introduced as a natural extension of RTRBM [33] by combining
    the RNN and RBM models [37]. RNN-RBM is an unsupervised generative model like
    traditional RBM, which means that it is suitable for directly modeling the probability
    distribution of a training dataset without the need for data labeling. We aimed
    to further exploit the prediction capacity of the RNN and RBM models and design
    a flexible model, allowing to uncover and predict the temporal dependencies in
    high-dimensional data [37]. As an energy-based model, the principle idea of RNN-RBM
    is to extend the RNN model by including an RBM at every time step [37]. The architecture
    is designed using an RBM whose parameters are computed from an ANN (Fig. 7.12).
    In other words, in the RNN-RBM model, the output layer of the RNN is laying the
    groundwork for the parameters for the RBM model, as illustrated in Fig. 7.12.
    Graphically, in the RNN-RBM architecture, the lower layer represents the RNN and
    the upper two layers represent the RBM model (Fig. 7.12). The RNN-RBM model comprises
    nine parameters: $W, b_v$ and $b_h, \hat{h}^{(0)}, W_2$ (RBM), $W_3$ and $b_{\hat{h}}$
    (RNN model), $W''$ and $W''''$ to link the two models. Usually, the matrices $W,
    W_2, W_3, W''$ and $W''''$ are initialized to small random normalized values,
    while $b_v, b_h$ and $\hat{h}^{(0)}$ are zero-initialized.


    Note that when combining RNN with RBM, the new hybrid model becomes deep in time
    when unfolded. An unfolded RNN-RBM can be represented as a series or chain of
    RBMs, where each time step instead of generating an output from sigmoid or tanh
    layer we invoke the learning of probability distributions'
