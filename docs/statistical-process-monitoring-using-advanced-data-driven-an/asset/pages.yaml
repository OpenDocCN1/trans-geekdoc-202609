- pgno: 9
  md: '# Preface


    Anomaly detection and isolation have a vital role in modern industrial processes
    to enhance productivity, efficiency, and safety, as well as to avoid expensive
    maintenance. Therefore, it is important to be able to detect and identify any
    possible anomalies or failures in the system as early as possible. Generally,
    anomalies in modern automatic processes are difficult to avoid and may result
    in serious process degradations. The role of detection is to identify any anomaly
    event and indicate a distance from the system behavior compared to its nominal
    behavior. Furthermore, anomaly isolation determines the probable source of the
    detected anomaly. To illustrate, an accidental or even deliberate contamination
    of a drinking water distribution network can lead to financial losses, as well
    as to serious health risks. Therefore, early detection of anomalies is crucial
    not only to maintain proper process operation but also for the sake of people’s
    health. Today engineered and environmental processes have become far more complex
    due to advances in technology. Multiple key variables need to be monitored simultaneously,
    and data may have both temporal and spatial aspects. New features of these processes
    require new and better statistical tools for process monitoring.


    Early detection and isolation of potential faults in complex engineering and environmental
    processes have proven to be particularly challenging. In the absence of a physics-based
    process model, data-driven statistical techniques for process monitoring have
    proved themselves in practice over the past four decades. These approaches use
    information derived directly from input data and require no explicit models for
    which development is usually costly or time-consuming. This book is intended to
    report recent developments in statistical process monitoring using advanced data-driven
    and deep learning techniques. The book is divided into nine chapters, and they
    are grouped into two parts. The objective of the first part is to tackle multivariate
    challenges in process monitoring by merging the advantages of univariate and traditional
    multivariate techniques to enhance their performance and widen their practical
    applicability. The second part aims to merge the desirable properties of shallow
    learning approaches, such as a one-class support vector machine, k-nearest neighbors,
    and unsupervised deep learning approaches to develop more sophisticated and efficient
    monitoring techniques. Throughout the book, the presented approaches are demonstrated
    using experimental data from many processes including wastewater treatment plants
    at KAUST and Golden, CO, USA, ozone air quality data,'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'and stereovision data for obstacle detection in driving environments. Thus,
    the reader will find illustrative examples from a range of environmental and engineering
    processes.


    The book should be of interest to engineering and academic readers from process
    chemometrics and data analytics, process monitoring and control, data scientists,
    applied statistics, and industrial statisticians. In fact, this book can be assimilated
    by advanced undergraduates and graduate students having knowledge of basic multivariate
    statistical analysis and machine learning.'
  merge: -1
  img_proc: true
