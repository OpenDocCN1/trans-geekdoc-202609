- pgno: 82
  md: '# # Fault isolation


    # ## 3.1 Introduction


    Monitoring univariate data does not require fault isolation because if a fault
    is detected, then the only variable affected is the one being monitored. However,
    multiple features are often monitored jointly in complex systems or processes,
    and multivariate fault detection does not necessarily provide the user with a
    list of the subset of variables that have been affected by the fault. Identifying
    the shifted variables is the second in a four-step process that begins with fault
    detection and ends with returning a system back to its in control (IC) state.
    First, fault detection is used to detect irregularities or anomalies in the system.
    The performance of a fault detection method is usually measured in terms of detection
    speed and occurs on the order of seconds, minutes, or hours depending on the temporal
    frequency of the measurements. Fault isolation is used to identify the variables
    within the system that have been affected by the fault. Oftentimes, the ability
    of methods to correctly identify the shifted variables is only loosely assessed,
    but we will review some of the common metrics in this chapter. Determining the
    cause of the fault occurs in the fault diagnosis step, and this could require
    expert input, especially in a new, understudied system. Finally, process recovery
    is a set of actions needed to return the system to its previous IC state. In some
    cases, manual intervention is necessary, for example, to make mechanical repairs,
    but in other cases, adjustments to the control of the system can compensate for
    the fault.


    In this chapter, we focus on presenting fault isolation methods, but fault isolation
    can occur in multiple contexts, often generated by distinct goals or available
    data, so the context and goals should be clarified during the initial analysis.
    For example, fault isolation can be done retrospectively, looking back in time
    at a period of historical data, or prospectively, analyzing observations as they
    are made available in real-time. These two goals are often called Phase I and
    Phase II monitoring, respectively. Phase I methods in the fault detection context
    are usually used to test if data are fault-free so that the fault-free data can
    be used to establish monitoring thresholds and optimal parameter settings for
    Phase II monitoring. Similar distinctions can be used in fault isolation, but
    a third option exists in which a period of historical data with a known fault(s)
    may be examined to determine the cause(s) of the fault without the purpose of
    carrying information forward into a Phase II analysis. This may occur im-'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'mediately after a fault has been observed or can be applied to historical data
    archives.


    In terms of available data, we have observed two common settings. In the first,
    a process may not be well-studied, and the types, number, and frequency of faults
    that will occur are unknown. This is the classic *unsupervised* setting in which
    multivariate observations are available, but the observations are not labeled
    as faulty or not, and the variables are also certainly not labeled as shifted
    or not. Alternatively, a very well-studied process may be monitored in which a
    wealth of historical data exists, and multiple copies of every type of fault that
    could occur have been observed. In such settings, observations are labeled as
    faulty or not, and the variables associated with each fault are also known. This
    is a *supervised* setting, so when a new fault is detected, the goal is to classify
    the new fault as closely as possible to one of the existing catalogued faults.


    Throughout this chapter, we attempt to standardize notation and nomenclature.
    For example, we termed variables that have been affected by the fault as shifted,
    but many other labels exist in the literature, such as faulty [1], OC [2], changed
    [3], responsible [4], abnormal [5], suspicious [6], and altered [7]. The variables
    themselves may simply reflect a change in an external input, so the terms faulty,
    OC, responsible, suspicious, and abnormal imply that the blame for the fault lies
    on those particular variables, which may not be the case. We prefer the label
    shifted, which implies that the variable has changed or altered in some way without
    assigning any diagnostic responsibility to the variable. Similarly, some methods
    that claim to perform fault isolation truly focus more on fault detection by removing
    unimportant variables, so we are very careful with terminology, and the vocabulary
    that we use may not match that of the original source material, but our goal is
    to be consistent within this text.


    Both statistical and machine learning approaches have been applied in fault isolation.
    In this chapter, we will present some of the classical approaches to fault isolation
    along with some more modern tools. Then, we will present some common metrics for
    evaluating fault isolation methods. Finally, we present two case studies to illustrate
    some of these methods in practice. However, before we delve into the details of
    fault isolation, we first point out some fundamental issues that often go overlooked
    in fault isolation.


    # 3.1.1 Pitfalls of standardizing data


    Standardizing variables prior to performing fault detection and isolation (FD&I)
    is necessary to ensure that those variables with greater ranges or variabilities
    do not overwhelm the others. Multiple approaches can be taken to standardize variables.
    We let X be an n × p dimensional matrix with n observations on the rows, and p
    variables on the columns. We may refer to either x_i for i = 1, ..., n, which
    is a p-dimensional set of variables for one observation, or x_j for j ='
  merge: -1
  img_proc: true
