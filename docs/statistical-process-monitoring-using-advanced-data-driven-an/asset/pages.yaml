  md: '# 7.4 Recurrent deep learning-based process monitoring


    Anomaly detection in multivariate processes such as modern industrial processes
    and environmental processes requires a model that efficiently learns and captures
    relevant information, thereby summarizing the evolution of the process under nominal
    operating conditions. Information learned from anomaly-free data enables to quantify
    the degree of deviation from the desired behavior and specification in the detection
    stage. An anomaly in an industrial plant can propagate very quickly to reach a
    critical point and the plant must be shut down to avoid catastrophic problems.
    Accordingly, anomaly detection in time series measurements of technological processes
    is vital for their reliability and efficiency.


    The improved ability of the RNN-based models described above to model dependencies
    and learn relevant features in complex multivariate sequences makes them a promising
    tool for anomaly detection. They can first be used to model normal behavior of
    the inspected process, then applied to detect deviations from normal behavior
    without any labeling of data. RNN-based approaches have become increasingly important
    to their capacity to extract complex nonlinear features, and have been employed
    for an early detection of anomalies in industrial multivariate time series data
    [40,41]. In the literature, RNN-based techniques show an effective performance
    in different applications including intrusion detection [41], anomalies in industrial
    processes [41–44], aircraft data monitoring [40]. In [40], an RNN-based anomaly
    detection approach has been introduced to uncover anomalies in multivariate time-series
    data from aircraft’s flight data records, which are very helpful to identify abnormal
    events that may reduce safety margins. In this approach, the RNN has been trained
    in a supervised manner. It has been shown that RNNs-based algorithms (a simple
    RNN, LSTM, and GRU) outperform the multiple kernel anomaly detection (MKAD) approach
    based on one-class SVM, data clustering algorithms, and machine learning models
    such as SVM. However, this anomaly detection system needs more tuning to improve
    its overall performance. An anomaly detector based on an LSTM method was developed
    in [41] for intrusion detection on a car’s controller area network (CAN) bus.
    The LSTM-based method has been applied in an unsupervised way to predict the next
    sequence of communication and classify it as malicious behavior or not. A deep
    LSTMs approach stacking several LSTM units is proposed in [45] for detecting anomalies
    (cardiac arrhythmias) in electrocardiography (ECG) signals, which are commonly
    utilized to check the health of the human heart. The proposed model here is built
    in unsupervised learning. Here, we base detection on the probability distribution
    of the prediction errors generated from the deep LSTM in case of normal or abnormal
    behavior. In [46], a multiscale LSTM (MS-LSTM) model is employed for detecting
