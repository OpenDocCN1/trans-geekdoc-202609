  md: 'The cell state is then passed via tanh (for normalizing values within the range
    -1 and 1) and multiplied by the output of the sigmoid gate; thus we keep only
    the portions we selected to output (Eq. (7.8)):


    ```

    $h_t = \tanh(C_t) \cdot o_t.$ (7.8)

