  md: '![](img/aa2f42c739937b682075082233e335bb_220_0.png)


    FIGURE 6.11 Schematic presentation of a Boltzmann machine.


    where P(v) refers to the energy function and Z is the partition function that
    guarantees that \sum_v P(v) = 1. The energy function of the BM is expressed as


    ```

    E(v) = -v^T Wv - b^T v, (6.19)

    ```


    where W denotes the weight matrix of model parameters and b refers to the vector
    of bias parameters.


    In the training stage, the parameters of the BM model (i.e., weights and biases)
    are determined so that the likelihood of the observed data is maximized. Specifically,
    the gradient descent on the log of the likelihood function is performed to find
    the BM parameters. In other words, the goal is to retrieve weights and biases
    that define a Boltzmann distribution in which the training vectors have high probability.


    BMs are unsupervised models, which involve learning a probability distribution
    from the training dataset. They are also known as generative models due to their
    capability to generate new samples from the learned data distribution. However,
    although with fewer nodes, too many connections are needed in a BM model to make
    effective computations. To alleviate this problem, numerous models have been introduced
    including conditional Boltzmann machines [67] and Restricted Boltzmann Machine
    (RBM) [68]. Next, we briefly describe the RBM model, in which they are no connections
    between units in the same layer.


    # 6.4.2.2 Restricted Boltzmann machine


    RBMs are a special form of Boltzmann machine that have no intralayer connections,
    that is, connections visible-to-visible and hidden-to-hidden are not available
    [69–71] (Fig. 6.12). RBMs are undirected probabilistic graphical models composed
    of two layers, namely visible and hidden layers. In RBMs, there are connections
    between each visible unit and every hidden unit. RBM is usually employed as a
    layerwise training model in the design of deeper models, such as deep belief networks
    (DBN) and the hierarchical probabilistic model deep Boltzmann machine (DBM), by
    stacking several RBMs [72]. Essentially, RBMs are stochastic neural networks that
    possess m visible units, v \in {0, 1}^m'
