- pgno: 53
  md: 'Note that the HD distance is a symmetric metric of \( p_2 \) and \( p_1 \)
    (i.e., \( HD^2(p_1, p_2) = HD^2(p_2, p_1) \)). It has all the properties of a
    metric and is bounded (i.e., the HD satisfies \( 0 \le HD^2(p_1, p_2) \le 1 \)),
    and the equality \( HD^2(p_2, p_1) = 0 \) is possible only if \( p_1 = p_2 \).


    The analytical form of HD between normal distributions \( p_1 \sim \mathcal{N}(\mu_0,
    \sigma_0) \) and \( p_2 \sim \mathcal{N}(\mu_1, \sigma_1) \) can easily be obtained
    as in [94],


    ```

    \( HD^2(p_1, p_2) = 1 - \sqrt{\frac{2\sigma_0\sigma_1}{\sigma_0^2 + \sigma_1^2}}
    \exp \left( - \frac{1}{4} \frac{(\mu_0 - \mu_1)^2}{\sigma_0^2 + \sigma_1^2} \right),
    \quad (2.55) \)

    ```


    where \( \mu_0, \mu_1 \) are the means and \( \sigma_0^2, \sigma_1^2 \) the variances
    for \( p_1 \) and \( p_2 \), respectively. In the case of only mean shift (i.e.,
    \( \sigma_1^2 = \sigma_0^2 \)), HD is given as


    ```

    \( HD^2(p_1, p_2) = 1 - \exp \left( - \frac{1}{8} \frac{(\mu_0 - \mu_1)^2}{\sigma_0^2}
    \right). \quad (2.56) \)

    ```


    Note that a small HD value indicates high similarity between two distributions,
    and a high value of HD reflects a significant dissimilarity between them. Similar
    to KLD, the HD metric can be used as an anomaly indicator. To conclude this subsection,
    we note that the analytical form of the HD metric exists for certain non-Gaussian
    distributions such as Weibull, Poisson, and Beta distributions. When the HD measure
    has no closed form, it can be approximated from the data sets using approaches
    like KDE [105].


    Note that the KLD and HD measures are a special case of the power divergence,
    which has been first defined in [106,107]. Also, it has been shown that these
    two measures are asymptotically identical, up to a constant factor, when the ratio
    between distributions \( p_1 \) and \( p_2 \), that is, \( p_1/p_2 \), is close
    to 1 [108].


    # 2.4.2.3 Limitations of univariate monitoring schemes


    Today, modern engineering and industrial processes have become more complex and
    contain several parts with an important number of measured variables. Despite
    the fact that these univariate monitoring schemes are successfully used in several
    applications, they are suited only when each monitored variable is independent
    of the others and thus such schemes ignore the interaction between correlated
    variables. However, in engineering and environmental processes, several variables
    require to be monitored simultaneously, which results in a misleading analysis
    when using univariate monitoring schemes. Applying a single monitoring scheme
    for each process variable is cumbersome and ineffective, in particular in the
    presence of a high number of variables. Of course, the use of multivariate schemes
    to monitor multivariate processes permits minimizing the total number of monitoring
    schemes compared to univariate schemes. For instance, assume that the inspected
    process comprises two variables \( X_1 \) and \( X_2 \). Fig. 2.6 illustrates
    the difficulty of using independent univariate monitoring schemes to monitor a
    bivariate process. It can be seen from Fig. 2.6 that the'
