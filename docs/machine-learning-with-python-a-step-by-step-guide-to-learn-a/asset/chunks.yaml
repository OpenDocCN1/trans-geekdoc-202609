    “类（cluster）”这一词并没有准确的定义。类描述一组点，其中类中的任何一点到类中其他任何点的距离都比到类之外某一点近。有时，会使用阈值来定义类中所有相互接近的点。划分方法会首先创建一个原始的
    `K` 划分集，其中 `k` 参数是待构建的划分数量。接下来，它应用一种迭代重定位方法，通过将对象从一个组移动到另一个组来增强划分。这些聚类技术有助于生成数据点的一级划分。有多种基于划分的聚类方法，如
    `K-means`、`fuzzy C-means` 和 `K-medoids`。本节将介绍 `K-mean` 聚类。


    ## K-mean 聚类


    1. 它以 `K` 作为输入。这指的是你想要找到的簇数量。在空间中的随机位置分配 `K` 个质心。

    2. 现在，如果你使用数据点与质心之间的 `Euclidean distance`，则将每个数据点分配给距离它最近的类。

    3. 重新计算类中心，作为分配给该类的数据点的平均值。

    4. 重复 `2` 和 `3` 直到不再发生变化。你可能好奇如何选择 `K` 的值。一种方法是“肘部法”（Elbow），它用于定义最佳簇数量。在这种情况下，你会运行一系列
    `K` 值，并在 Y 轴上绘制“解释方差百分比”，在 X 轴上绘制“K”。在下图中，在数字 `3` 之后添加了更多的类。这些额外的类会影响模型的显示。第一个类增加了更多信息，在某一个一点，边际收益将开始下降。![](img/image748.jpg)


    ## 层次聚类


    层次聚类开始于将所有数据点分配到属于它们自己的类中。正如其名所示，它创建了层级结构，在下一步中，它整合两个最近的数据点并将它们合并为一个类。


    1. 将每个数据点分配到其类中。

    2. 通过应用 `Euclidean distance` 确定类中最近的一对并将其合并为一个类。

    3. 确定两个最近的类之间的距离并整合它们，直到所有项目都被分组为一个类。在下一种方法中，你可以通过识别哪些垂直线被水平线截断且不影响类，并处理最大距离来选择最佳类数量。![](img/image758.jpg)


    ## 1. 基于聚类


    基于密度的聚类技术的基本概念提取自人类感知聚类方法。例如，如果你看下面的图片，你应该能看到四个类加上不同的噪声点![](img/image764.jpg)如上图所示，类是数据空间中的密集区域，由低密度点区域界定。简而言之，类中点的密度在某种程度上比类外点的密度高。基于密度的聚类算法取决于对“类”和“噪声”的直观感知。关键在于，对于每一个类，特定半径的邻域应该包含一个最小数量。`DBSCAN`
    需要的最重要参数包括 (`eps`) 和最小点数 (`MinPts`)。`eps` 参数决定了点 `x` 周围邻域的半径。`MinPts` 参数描述了 `eps`
    半径内最小邻居数量。数据集中计数大于或等于 `MinPts` 的任何点 `x` 被识别为核心点。


    ## 使用聚类分析进行客户细分


    公司的客户群可能有成千甚至数百万个不同的个体。对于大多数这些人来说，营销是一个巨大的问题，因为如果你试图向所有人营销，信息可能会是模糊的。然而，建立一个吸引每个个体的营销计划并不是常态的。


    ### 为什么客户细分很重要


    客户细分将帮助你理解区分不同客户的模式。以下是你能够通过细分分析实现的一些重要观点。


    * 增强对客户需求和喜好的理解。这可以提高销售额和客户满意度。

    * 创建吸引不同客户细分的产品。

    * 公司无法一直满足所有可能的客户。通过应用细分程序，公司有能力专注于满足那些被认为对其产品具有最佳吸引力的细分。

    * 建立忠诚关系。虽然你可以分析自己的客户群，但很快就会发现，有不同的群体具有定制化的需求。这允许你对客户有更深入的理解，并发现驱动他们的特因素。


    ### 如何细分


    细分不需要非常复杂。对于小型组织或公司，它可能只是发现你有两或三个具有不同需求的独特客户类型。用于细分客户的流行方法包括：


    * 人口统计学

    * 行为特征

    * 心理特征

    * 地理特征![](img/image788.jpg)在进行市场细分时，有不同的方法可以使用。一种准确且在统计上有效的方法之一是聚类分析的应用。


    '
