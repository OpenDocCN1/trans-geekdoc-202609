    # Chapter 7: Recommender Systems


    Most e-commerce and retail companies are taking advantage of the massive potential
    of data to boost sales by implementing a Recommender system on their particular
    websites. These systems focus on suggesting to the user’s items that they may
    like or have interest in. The data needed for recommendation engines comes from
    explicit user ratings to watch a movie or listen to a song from implicit search
    engine purchase histories and queries. Sites such as YouTube, Spotify, and Netflix
    have data to use to recommend playlists.


    ## Pros of using recommendation systems

    Companies which apply the Recommender system concentrate on raising the sales
    due to the personalized offers and improved customer experience. Recommendations
    usually increase searches and make it easy for users to access content which they
    are interested in, and surprise them with offers that they have never searched
    before. What is interesting is that companies can now gain and retain customers
    by sending out email links to new offers that fulfill the interests of their profiles.
    By creating an added advantage to users through suggesting products and systems,
    it creates a great feeling among buyers. This is a great thing because it will
    allow companies to stay ahead of their competitors.


    ## Types of Recommender Systems

    Recommender systems operate with two types of information:

    - User-item interactions

    - Characteristic information


    This helps us reach the first classification of recommender systems. This includes
    a content-based system that has a characteristic information and collaborative
    filtering which depends on user-item interactions. The hybrid systems shall combine
    both information with the goal to avoid problems generated when you work with
    only one specific type.


    ## Content-based Systems

    Content-based systems are built from the idea of applying the content of each
    product for purposes of recommendation. Below are some pros and cons of the content-based
    recommender system.


    ### Pros

    - It is simple to create a more transparent system. You use the same content to
    describe the recommendations.

    - Content representations are different and they open up the options to apply
    unique approaches like text processing techniques, inferences, and semantic information.

    - In case of items have enough descriptions, there is no need for the “new item
    problem”.


    ### Cons

    - The content-based `RecSys` seem to over-specialize. They will suggest items
    similar to that which is already consumed, with a notion to create a “filter bubble”.


    Another issue is that new users don’t have a defined profile not unless they are
    explicitly requested for information. Despite this, it is very simple to add new
    items to the system. You simply require to allocate them a group based on their
    features.


    ### Three principal components

    - A `content Analyzer`: This classifies items using a given type of representation.

    - A `profile Learner`: It creates a profile which represents every user’s preference.

    - A `filtering Component`:It accepts all the inputs and creates a list of recommendations
    for every user.


    ### How content is represented

    The content of a particular item is abstract and provides more options. You can
    use many different variables. For instance, for a book, you can include the genre,
    author, the text of the book and many other factors. Once you know which content
    you will factor. You need to convert all the data into a vector space model, which
    is an algebraic representation of text documents. You perform this using a `Bag
    of Words` model which represents documents disregarding the sequence of words.
    In this particular model, every document appears like a bag with some words. Therefore,
    this method will permit word modeling with respect to dictionaries, where every
    bag has some words from the dictionary.


    An exact implementation of a `Bag of Words` is the `TF-IDF` representation. In
    full, `TF` stands for Term Frequency and `IDF` stands for Inverse Document Frequency.
    This particular model combines the significance of the word in the document with
    the significance of the world in the corpus. This was just a general aspect of
    Content-based recommendation engines. It is important to recognize that a `Bag
    of Words` representation doesn’t factor in the context of words. If it is necessary
    to include that, `Semantic Content Representation` becomes useful. Below are two
    options that one has, just in case you want to know more about it.


    **Option 1: Explicit Semantic Representation**

    - `Wordnet`

    - `ConceptNet`

    - `Ontologies for Semantic Representation`


    **Option 2: Infer Semantic Representation**

    - `Latent Dirichlet Allocation`

    - `Latent Semantic Indexing`


    ## Collaborative filtering systems

    These types of recommendation engine implement user interactions to evaluate items
    of interest. You can visualize the set of interactions using a matrix where every
    entry `(I, j)` represents the interactions between user `i` and item `j`. One
    way of looking at collaborative filtering is to look at it as a generalization
    of regression and classification. In the following case, you aim to predict a
    variable directly which depends on other variables in the collaborative filtering.
    Visualizing a problem as a matrix allows us not only to predict the values of
    a unique column but also help us predict the values of any entry.


    ### Techniques to apply in collaborative filtering

    There is a lot of research that has been done on collaborative filtering, and
    most common techniques depend on low-dimensional factor models that depend on
    matrix factorization. The `CF` techniques are divided into 2 types:


    ![Types of collaborative filtering approaches](image848.jpg)

    (Note: Image represents types of collaborative filtering approaches)

    Reference: [Wikipedia](https://en.wikipedia.org/wiki/Collaborative_filtering)


    Below is a brief discussion of some of these techniques


    1. **Memory-based technique**

    This approach can further be divided into two sections: User-item filtering and
    item-item filtering. The user-item filtering selects a given user, searches for
    users that are similar to the user depending on the similarity of the ratings,
    and suggest items that the same users recommended. On the other hand, item-item
    filtering will identify an item, search users who liked an item and look for other
    products that the same users liked. In other words, this approach takes items
    and displays the items as recommendations. The major difference of memory-based
    technique from the model-based techniques is that no parameter is learned using
    gradient descent.


    2. **Model-based approach**

    In this particular approach, `CF` models are created using machine learning algorithms
    to predict the ratings of items unrelated to the user.


    ### Content-Based Filtering

    This system will suggest an item to users depending on their past history. The
    greatest advantage of content-based filtering is that it can start to suggest
    items immediately information related to items is available. A content-based system
    will work with information which the user provides, this can be explicitly or
    implicitly. Depending on data, a user profile is created that provides a lot of
    inputs or takes actions about recommendations.


    ![](image865.jpg)

    '
  trans: "\n\n# 第 7 章：推荐系统\n\n大多数电子商务和零售公司都在利用数据的巨大潜力，通过在其特定的网站上实现推荐系统来提升销售额。这些系统侧重于向用户推荐他们可能喜欢或感兴趣的项目。推荐引擎所需的数据来源广泛，从用户对电影的观看或歌曲的显式评分，到来自搜索引擎购买历史和查询的隐式数据。诸如\
    \ YouTube、Spotify 和 Netflix 等网站都拥有可用于推荐播放列表的数据。\n\n## 使用推荐系统的优点\n应用推荐系统的公司侧重于通过个性化优惠和改进客户体验来提高销售额。推荐通常会增加搜索，并使用户能够轻松访问他们感兴趣的内容，同时提供他们从未搜索过的优惠令他们感到惊喜。有趣的是，公司现在可以通过发送符合其用户画像兴趣的新优惠邮件链接来获取并留住客户。通过系统建议产品为用户创造额外优势，这在买家中营造了良好的氛围。这是一件非常有意义的事情，因为它能让公司保持领先竞争对手的。\n\
    \n## 推荐系统的类型\n推荐系统基于两类信息运行：\n- 用户-物品交互\n 特 特征信息\n\n这帮助我们完成了推荐系统的第一类分类。这包括基于内容的系统（具有特征信息）以及依赖于用户-物品交互的协同过滤。混合系统应结合这两种信息，目标是避免仅处理某一种特定类型时产生的问题。\n\
    \n## 基于内容的系统\n基于系统的系统建立在将每个产品的内容用于推荐目的的想法之上。以下是基于内容的推荐的一些优缺点。\n\n### 优点\n- 创建一个更透明的系统非常简单。你使用相同的内容来描述推荐。\n\
    - 内容表示是不同的，它们为应用独特的方法（如文本处理技术、推理和语义信息）提供了选择。\n- 如果物品有足够的描述，就不需要考虑“新物品问题”。\n\n\
    ### 缺点\n- 基于内容的 `RecSys` 似乎过于专门化。它们会推荐与已消费内容相似的物品，从而产生“过滤泡泡”的概念。\n\n另一个问题是，新用户没有定义的画像，除非显式请求其信息。尽管如此，向系统添加新物品非常简单。你只需要根据它们的特征为它们分配一个组。\n\
    \n### 三个主要组件\n- `content Analyzer`：使用给定的表示类型对物品进行分类。\n- `profile Learner`：创建一个代表每个用户偏好的画像。\n\
    - `filtering Component`：接受所有输入并为每个用户创建推荐列表。\n\n### 内容是如何表示的\n特定物品的内容是抽象的并提供了更多选择。你可以使用许多不同的变量。例如，对于一本书，你可以包括类型、作者、书籍文本以及许多其他因素。一旦你知道要考虑哪些内容，你需要将所有数据转换为向量空间模型，这是文本文档的代数表示。你使用\
    \ `Bag of Words` 模型执行此操作，该模型忽略了单词的顺序。在这个特定模型中，每个文档都像一个装有一些单词的包。因此，这种方法允许根据字典进行词建模，其中每个包都包含字典中的一些词。\n\
    \n`Bag of Words` 的精确实现是 `TF-IDF` 表示。完整来说，`TF` 代表词频（Term Frequency），`IDF` 代表逆文档频率（Inverse\
    \ Document Frequency）。这种特定模型将词在文档中的重要性与词在语料库中的重要性结合起来。这只是基于内容推荐引擎的一个通用方面。重要的是，`Bag\
    \ of Words` 表示没有考虑词的上下文。如果需要包含这一点，`Semantic Content Representation`（语义内容表示）就变得有用。以下是可选两个方案，以防你想了解更多信息。\n\
    \n**选项 1：显式语义表示**\n- `Wordnet`\n- `ConceptNet`\n- `Ontologies for Semantic Representation`\n\
    \n**选项 2：推断语义表示**\n- `Latent Dirichlet Allocation`\n- `Latent Semantic Indexing`\n\
    \n## 协同过滤系统\n这类推荐引擎通过用户交互来评估感兴趣的物品。你可以使用矩阵将交互集可视化，其中每个条目 `(I, j)` 代表用户 `i` 与物品\
    \ `j` 之间的交互。看待协同过滤的一种方法将其视为回归和分类的推广。在以下情况下，你的目标是直接预测一个依赖于协同过滤中其他变量的变量。将问题可视化为矩阵使我们不仅能够预测唯一列的值，还能帮助我们预测任何条目的值。\n\
    \n### 应用于协同过滤中的技术\n对协同过滤已经进行了大量的研究，最常见的技术依赖于基于矩阵分解的低维因子模型。`CF` 技术分为 2 类：\n\n![协同过滤方法的类型](img/image848.jpg)\n\
    （注：图片代表协同过滤的方法类型）\n参考：[维基百科](https://en.wikipedia.org/wiki/Collaborative_filtering)\n\
    \n以下是对这些技术的一些简要讨论\n\n1. **基于内存的技术**\n这种方法可以进一步分为两个部分：用户-物品过滤和物品-物品过滤。用户-物品过滤选择一个给定用户，根据评分的相似性搜索与该用户相似的用户，并推荐相同用户推荐的物品。另一方面，物品-物品过滤将识别一个物品，搜索喜欢该物品的用户，并寻找这些用户喜欢的其他产品。换句话之，这种方法获取物品并将物品作为推荐显示。基于内存的技术与基于模型的技术的主要区别在于，没有使用梯度下降学习任何参数。\n\
    \n2. **基于模型的方法**\n在这种特定方法中，使用机器学习算法创建 `CF` 模型，以预测与用户无关的物品评分。\n\n### 基于内容的过滤\n\
    该系统将根据用户过去的历史向用户推荐物品。基于内容的过滤最大的优点是，一旦有了有关物品的信息，它就可以开始推荐物品。基于内容的系统根据用户提供的信息工作，这些信息可以是显式的也可以是隐式的。根据数据，创建一个用户画像，为提供大量输入或对推荐采取行动。\n\
    \n![](img/image865.jpg)\n\n"
