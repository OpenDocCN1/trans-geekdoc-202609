    The phrase cluster doesn’t have an accurate definition. A cluster describes a
    set of points whereby any point in the cluster is close to any other point in
    the cluster than a point absent in the cluster. Sometimes, a threshold is used
    to define all points in a cluster close to one another . A partitioning method
    will first create an original set of `K`-partitions where `k` parameter is the
    number of partitions to construct. Next, it applies an iterative relocation approach
    which tries to enhance the partitioning by shifting objects from one group to
    another. These clustering techniques help generate a one-level partitioning of
    data points. There are various partitioning-based clustering like `K-means`, `fuzzy
    C-`, `means`, and `K-medoids`. This section will look at `K-mean` clustering.


    ## K-mean Clustering


    1. It begins with `K` as the input. This refers to the number of clusters that
    you want to find. Assign `K-centroids` in random positions in your space.

    2. Now, if you use the `Euclidean distance` between data points and centroids,
    allocate each data point to the cluster close to it.

    3. Re-compute the cluster centers as a mean of data points allocated to it.

    4. Repeat `2` and `3` till there are no more changes to happen. You might be wondering
    how you can select the value of `K`. One method is the “Elbow” that is used to
    define an optimal number of clusters. In this case, you’ll run the range of `K`
    values and plot the “percentage of variance explained,” on Y-axis and “K” on the
    “X” axis. In the diagram below, more clusters have been added after `3`. These
    additional clusters affect the display of the model. The first cluster adds more
    information, and at a certain point, the marginal gain will start to drop. ![](image748.jpg)


    ## Hierarchical clustering


    With the Hierarchical clustering, it begins by assigning all data points to belong
    to its own cluster. Just as the name implies, it creates the hierarchy and in
    the next step, it integrates the two closest data point and combines it together
    into a single cluster.


    1. Allocate every data point to its cluster.

    2. Determine the closest pair of the cluster by applying the `Euclidean distance`
    and combine it into a single cluster.

    3. Determine the distance between two nearest clusters and integrate them until
    when all items are grouped into a single cluster. In the next method, you can
    choose the best number of clusters by identifying which vertical lines are cut
    by a horizontal line without affecting a cluster and deals with the maximum distance.
    ![](image758.jpg)


    ## 1. Based Clustering


    The basic concept underlying density-based clustering technique is extracted from
    a human perception clustering method. For example, if you look at the images below,
    you should be able to see four clusters plus different points of noise. ![](image764.jpg)As
    shown in the above image, the clusters are dense regions in the data space that
    are delineated by regions of a lower density point. In short, the density of points
    in a cluster is somehow higher compared to the density of points located outside
    the cluster. The density-based clustering algorithm depends on an intuitive perception
    of “clusters” and “noise”. The point is that for every cluster, the neighborhood
    of a particular radius should have at least a minimum. The most important parameters
    are needed for `DBSCAN` include (`eps`) and minimum points (`MinPts`). The parameter
    `eps` determine the radius of the neighborhood around close to a point `x`. The
    parameter `MinPts` describes the minimum number of neighbors in the `eps` radius.
    Any point `x` that exists in the dataset that has a count higher than or equal
    to `MinPts` is identified as a core point.


    ## Customer Segmentation with Cluster analysis


    The customer base of a company can have thousands, if not millions, of different
    unique persons. Marketing, to most of these people, presents a big problem because
    if you attempt to market to everybody, the message can be ambiguous. However,
    building a marketing plan which attracts every individual is not normal.


    ### Why customer segments are important


    Customer segments will make you understand the patterns which distinguish your
    customers. Below are some important ideas that you can achieve with segmentation
    analysis.


    * Enhanced understanding of the customer needs and wants. This can lead to improved
    sales and customer satisfaction.

    * Create products that appeal to different customer segments .

    * Companies cannot fulfill all possible customers all the time. By applying segmentation
    procedure, companies have the ability to concentrate on fulfilling those segments
    which they examine to be the best attractions for their products.

    * Build loyal relationships. While you can analyze your own customer base, soon
    it shall be clear that there are different groups that have customized requirements.
    This allows you to build a deeper understanding of your customers and find out
    what makes them tick.


    ### How to segment


    Segmentation doesn’t need to be very complex. For a small organization or company,
    it can be about discovering that you have two or three unique customer types who
    have different needs. Some popular methods used to segment customers consist of:


    * Demographic

    * Behavioral

    * Psychographic

    * Geographic ![](image788.jpg)There are different ways which you can apply when
    it comes to segmentation of a market. One of the methods that are accurate and
    statistically valid is the application of cluster analysis.

