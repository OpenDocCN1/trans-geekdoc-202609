    that specific characters are supplied within a string. •    You want to apply
    specific interpretation to characters contained in a string that is often taken
    literally. You can do this by using the backslash (\\) character. A backslash
    character in a string implies that one or more characters which follow it must
    be uniquely treated. This is called an escape sequence because the backslash will
    make subsequent character sequence to “escape” its normal meaning. Boolean Type
    Python 3 has a Boolean data type. Objects of Boolean type may contain one or two
    values, False or True. ![](image123.jpg)Python expressions are evaluated in a
