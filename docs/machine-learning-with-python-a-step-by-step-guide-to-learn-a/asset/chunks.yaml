- raw: Conclusion With some knowledge of basic Python, machine learning skills, and
    Python libraries, you are now set to launch your first machine learning project
    with Python. Consider learning the open-source Python libraries. The scientific
    Python libraries will help you complete easy machine learning tasks. However,
    the choice of some of these libraries can be completely subjective and highly
    debatable by many people in the industry. All in all, we recommend you to start
    by exploring Scikit-learn library. Make sure you are familiar with its concepts
    and how to use it. Once you are done with it, you can dive deep into advanced
    machine learning topics such as complex data transformation and vector machines.
