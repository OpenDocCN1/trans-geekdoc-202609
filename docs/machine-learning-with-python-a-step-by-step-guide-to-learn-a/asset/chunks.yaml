    2: Introduction to Machine Learning The focus of Machine Learning is to learn
    the nature of data and apply it to specific models. Although ML is a field in
    computer science, it is not the same as the traditional computational methods.
    When you look at traditional computing, algorithms are described as a set of programmed
    instructions. These instructions provide solutions to a problem. ML algorithms
    make computers to learn from data inputs and apply statistical analysis to display
    values found in a given range. Therefore, ML allows computers to create a model
    from a data sample so that it can permit the automation of decisions based on
    the type of data entered. Nowadays, technology users hugely benefit from the idea
    of machine learning.  For example, the facial recognition technology provides
    opportunities to social media networks so that their users can tag and share photos
    with their friends. There is also the optical character recognition (OCR). This
    type of technology is applied in movies, shows, and e-commerce to suggest to users
    based on their preferences. If you know self–driving cars, they also depend on
    machine learning to move . This chapter will take you through some of the most
    common ML methods of supervised and unsupervised learning, as well as popular
    machine learning algorithms. Additionally, you’ll learn why you need machine learning
    and some of the programming languages used with machine learning besides Python.
    Furthermore, this chapter will also look at some of the biases associated with
    machine learning, and consider a few things to help reduce these types of biases
    when you build an algorithm. Machine Learning Methods When it comes to the field
    of machine learning, there are tasks which are categorized into different divisions.
    Most of these divisions depend on how learning is performed, or on the type of
    feedback delivered based on the system developed. The most popular machine learning
    methods include supervised learning and unsupervised learning. For supervised
    learning, algorithms learn from the example of input and output data labeled by
    humans. On the other hand, unsupervised learning does not supply to the algorithm
    any labeled data, but the algorithm has to find the structure within its input
    data by itself. Here’s a detail discussion of these methods. Supervised Learning
    For supervised learning, the computer has an example of input data to work on.
    The aim of this method is to allow the algorithm to “learn” by comparing actual
    output using a trained output to discover errors and alter the model. In other
    words, this method contains patterns which assist in predicting label values on
    extra data that is unlabeled . For example, in supervised learning, you can feed
    an algorithm data with shark images and label them as fish. Also, you can feed
    it with images of oceans and label it like water. After the algorithm is trained
    several times with this particular data, the algorithm must be able to differentiate
    unlabeled fish images and unlabeled ocean images. One of the most popular use
    cases of supervised learning is the application of historical data to help forecast
    the statistical chance of an event to happen. It can use historical stock market
    data to predict future changes in the market. Additionally, supervised learning
    can help in the filtering of spam emails. Supervised learning makes it possible
    to classify untagged photos of dogs by using photos of dogs that have been tagged
    already. Unsupervised learning Unlike supervised learning where data is labeled,
    with unsupervised learning, you deal with unlabeled data. This means that it is
    the task of the learning algorithm to identify similar features in the data that
    it is supplied. Since unlabeled data is very popular compared to labeled data,
    techniques of machine learning are among the most valuable in the industry.  The
    aim of unsupervised learning is very simple. The largest application of unsupervised
    learning is within the transactional data. There can be a massive data set made
    up of customers and the products which they purchase, but since you are a human,
    you can’t manage to extract meaning and similarity from customer profile and their
    purchase history . The best time to apply unsupervised machine learning is when
    you don’t have data on expected outcomes, like defining a target market for a
    new product that your business has never sold before, but if you are attempting
    to understand your consumer base, supervised learning is the right technique.
    Machine learning approaches Machine learning is highly linked to computational
    statistics. For that reason, if you have some knowledge of statistics, it is important
    to understand and apply machine learning algorithms. If you are new to statistics,
    here are some definition of terms which are popularly used in detecting the relation
    found in quantitative variables. Correlation. This describes the association that
    exists between two variables said not to be independent or dependent. Regression.
    At the lowest level, it is helpful at determining the relationship between one
    independent and dependent variable. The k-nearest neighbor This particular algorithm
    is applied in the pattern recognition model. Pattern recognition model is used
    in classification and regression. The k is a positive integer. In both regression
    and classification, the input contains k closest training example in a specific
    space. The KNN classification When it comes to this method, its output belongs
    to the class membership. This assigns a new object the most popular class in the
    k-nearest neighbors. Take for example, when k = 1, the object has to be assigned
    a class which has one nearest neighbor.  The diagram below describes this algorithm.
    The diagram has blue diamond objects and  orange star objects. Just remember that
    they belong to two different classes. That is the star and diamond classes. ![](image282.jpg)Once
    you introduce a new object to space such as a green heart, you’ll need the learning
    algorithm to assign the heart into a particular class. ![](image288.jpg)For k
    = 3, the algorithm will have to pick three nearest neighbors that belong to the
    green heart and assign it, either into the diamond or star class. In this case,
    the three nearest neighbors of the green heart consist of the diamond and two
    stars. Therefore, the algorithm can label the heart that contains the star class.
    ![](image296.jpg)The k-nearest neighbor algorithm is among the basic machine learning
    algorithms labeled as “Lazy learning”. Decision Tree In general, decision trees
    are important when you want to have a visual representation of decisions and display
    decision making. When working with ML and data mining, decision trees are key
    when it comes to a predictive model. The model contains observations and creates
    a summary related to the target value of the data. Learning in decision trees
    is important when you want to create a model that is useful at predicting a value
    depending on the input values. If you take a look at a predictive model, the features
    of the data have to be defined using observation and represented by branches.
    Additionally, conclusions related to the data’s target value are shown in the
    leaves. This example demonstrates the various conditions that can show whether
    a person is supposed to go fishing or not. ![](image306.jpg)This decision tree
    is classified by sorting. Then it can display which classification is associated
    with a particular leaf. In the following example, it is a yes or no. The tree
    can then divide the day’s condition based on whether it is correct to go fishing
    or not. A real classification tree dataset will contain a lot more features compared
    to what is shown in this tree. All in all, ‘relationship’ will be easy to select.
    Deep Learning With deep learning, it will always try to copy the human brain and
    how it succeeds in processing sound and light stimuli. The underlining architecture
    of deep learning is powered by biological neural networks. Additionally, it contains
    many different multiple layers. In the current machine learning algorithms, deep
    learning has succeeded in selecting most of the data as well as defeat humans
    in different cognitive tasks. Due to the following properties, deep learning is
    one of the best methods applied in AI . Programming Languages When a person wants
    to choose a language to use to learn with machine learning, there are few things
    that they may want to factor in such as the current status of job positions and
    the type of libraries available. Other languages that are used in machine language
    include C++, Java, and R. Human Biases While both data and computational analysis
    cause an individual to start to think like they aren’t being objective, being
    biased on a given data doesn’t mean that the output from the machine learning
    is neutral. The human bias affects the organization of data and algorithms that
    determine how ML should use data. If you decide to use historical photographs
    of scientists in your specific computer training, a computer might fail to classify
    scientists. Although machine learning is continuously applied in the business,
    biases that go unnoticed can lead to a systematic problem that can prevent people
    from receiving loans and many other things.  In short, human biases can negatively
    impact other people. This is very important to underline and work towards removing
    it as possible. One particular method which you can use to achieve zero biases
    is to ensure that several people work on a project. Since machine learning is
    an area which is continuously being improved, it is essential to remember that
    algorithms, approaches, and methods continue to change . Chapter 3: Data Processing,
    Analysis, and Visualization Understanding Data Processing Data processing is the
    act of changing the nature of data into a form that is more useful and desirable.
    In other words, it is making data more meaningful and informative. By applying
    machine learning algorithms, statistical knowledge, and mathematical modeling,
    one can automate this whole process. The output of this whole process can be in
    any form like tables, graphs, charts, images, and much more, based on the activity
    done and the requirements of the machine. This might appear simple, but for big
    organizations and companies like Facebook, Twitter, UNESCO, and health sector
    organizations, this whole process has to be carried out in a structured way. The
    diagram below shows some of the steps that are followed: ![](image327.jpg)Let’s
    look in detail at each step: Collection The most important step when getting started
    with Machine Learning is to ensure that the data available is of great quality.
    You can collect data from genuine sources such as Kaggle, data.gov.in, and UCI
    dataset repository. For example, when students are getting ready to take a competitive
    exam, they always find the best resources to use to ensure they attain good results.
    Similarly, accurate and high-quality data will simplify the learning process of
    the model. This means that during the time of testing, the model would output
    the best results. A great amount of time, capital, and resources are involved
    in data collection. This means that organizations and researchers have to select
    the correct type of data which they want to implement or research. For instance,
    to work on the Facial Expression Recognition requires a lot of images that have
    different human expressions. A good data will make sure that the results of the
    model are correct and genuine . Preparation The data collected can be in raw form.
    Raw data cannot be directly fed into a machine. Instead, something has to be done
    on the data first. The preparation stage involves gathering data from a wide array
    of sources, analyzing the datasets, and then building a new data set for additional
    processing and exploration. Preparation can be done manually or automatically
    and the data should be prepared in a numerical form to improve the rate of learning
    of the model. Input Sometimes, data already prepared can be in the form which
    the machine cannot read, in this case, it has to be converted into readable form.
    For conversion to take place, it is important for a specific algorithm to be present.
    To execute this task, intensive computation and accuracy are required. For example,
