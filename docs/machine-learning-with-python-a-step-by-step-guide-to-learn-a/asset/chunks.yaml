  trans: '

    网络等 IT 基础设施技术的大型企业会产生海量的警报消息。由于警报消息涉及运营问题，必须对其进行人工筛选和分类。数据聚类可以帮助提供警报类别的洞察，以及平均修复时间和支持预测。


    ## 7. 识别犯罪高发地区

    由于与犯罪相关的数据存在于特定的城市地区，犯罪类型、犯罪区域以及两者之间的关系可以为该城市或地区的最犯罪高发区域提供高质量的洞察。


    ## 人工神经网络

    人工神经网络 ![](img/image656.jpg)人工神经网络描述了一组连接的输入/输出，其中每个连接都链接到一个特定的权重。在学习阶段，网络会调整权重，以便能够预测输入元组的正确类别标签。现在存在许多网络架构，其中包括前馈、循环、卷积等。正确的架构取决于模型的应用场景。在大多数情况下，前馈模型提供相当准确的结果，且大多数情况下用于图像处理应用。根据模型要封装的函数的复杂性，模型中可以存在许多隐藏层。如果你有许多隐藏层，将有助于像深度神经网络等复杂关系的建模。然而，许多隐藏层的存在增加了训练和调整权重的时间。另一个缺点是与决策树等模型相比，其解释性较差。尽管如此，ANN
    在大多数现实应用中表现良好。它对噪声数据具有很强的韧性，并可以分类未训练的模式。通常，ANN 在连续值输入和输出方面效果更好。


    ### ANN 的优点

    - 它将信息存储在整个网络中。例如，传统的程序信息保留在整个网络中，而不是数据库中。这意味着给定位置某些信息的丢失不会停止网络运行。

    - 它具有容错性。ANN 中一个或多个单元的破坏不会影响它产生输出。因此，这一特定特征使得网络具有容错性。

    - 它可以处理不完整的知识。一旦 ANN 训练完成，可以使用不完整的信息产生输出。在这种情况下，性能的损失将取决于缺失的信息。

    - ANN 具有机器学习的能力。

    - 它具有并行处理能力。ANN 神经网络具有数值上的优势，可以同时完成多项任务。


    ### ANN 的缺点

    - 它依赖于硬件。ANN 需要根据其结构包含并行处理能力的处理器。对于这种情况，设备的实现是取决于依赖的。

    - 正确网络结构的确定。通常，没有固定的规则来确定人工神经网络的结构。正确的网络结构是通过试错获得的。

    - 持续时间未知。网络受限于训练完成时样本均值的特定误差值。该值不会产生最优结果。

    - 网络存在未解释的特性。这是 ANN 的主要问题之一。如果 ANN 生成了一个探测性解决方案，它不会显示任何线索。这总是降低对网络的信任。


    ## 朴素贝叶斯

    朴素贝叶斯算法是一种由贝叶斯定理驱动的概率分类器。它基于一个简单的假设，即属性之间是条件独立的。![](img/image678.jpg)分类通过提取最大后验概率（即在上述假设成立的情况下最大的
    `P(Ci|X )`）来工作。这一假设通过衡量计算成本总是降低了计算成本。尽管由于属性具有依赖性，该假设会多次失效。尽管如此，朴素贝叶斯继续运行良好。这是一种易于实现的算法，并可以在大多数情况下改进生成的结果。它可以扩展到海量数据集，因为它假设了线性时间。


    ### 朴素贝叶斯的优点

    - 它简单且易于实现。

    - 它需要极少的训练数据。

    - 它处理连续和离散数据。

    - 它可以建立概率预测。

    - 它具有良好的扩展性。


    ### 朴素贝叶斯的缺点

    - 它对数据分布有一个稳健假设。

    - 它面临数据稀缺的挑战。

    - 连续特征需要分箱处理将其离散化。


    ## 分类准确率指标

    这是正确预测的数量与输入总数量的比例。![](img/697.jpg)当每个类别的样本数量相等时，它的效果最好。准确率产生获得高准确率的假象。当你处理少数但危险的疾病时，误判少数类别的成本比检测健康人士的成本高得多。


    ## 对数损失

    这对于多分类运行良好。当你使用对数损失时，分类器必须为每个类别分配概率。例如，如果你有 `N` 个样本和 `M` 个类别，可以如下计算对数损失![](img/705.jpg)


    ## 混淆矩阵

    混淆矩阵正如其名，创建一个矩阵来解释模型的完整性能。假设你有一个二分类问题。那么有两个类别：YES 或 NO。此外，你有一个可以为特定输入样本预测类别的分类器。如果对
    165 个样本进行以下模型测试，将得到如下结果![](img/image712.jpg)存在四个术语：

    1. 真阳性：我们的预测为 YES 且结果为 YES。

    2. 真阴性：我们的预测为 NO 且结果为 NO。

    3. 假阳性：我们的预测为 YES 但结果为 NO。

    4. 假阴性：我们的预测为 NO 但结果为 YES。


    ## 曲线下面积

    这是评估中最广泛应用的指标之一。它适用于二分类问题。其他指标包括：

    - 平均绝对误差

    - 均方误差


    ## 第 6 章：聚类

    聚类是将具有相似特征的实体聚集的过程。这种技术属于无监督机器学习，其目标是识别数据点的相似性并将相同的数据点分在一起。


    ### 为什么要应用聚类？

    将相似的实体聚集在一起允许识别不同小组的属性。换句话说，这产生了对不同小组底层模式的洞察。无标记数据的分组有无数应用领域。例如，可以对客户进行分组，并对每个小组进行不同的营销以增加收入。另一个例子可能包括将属于相似主题的文件分在一起。

    '
