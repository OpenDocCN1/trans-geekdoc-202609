    # 第一章：Python 基础


    欢迎！这是你第一次编程吗？如果不是，那么我们假设你想学习如何使用 Python 进行机器学习。此外，你可能正在寻找关于为什么以及如何开始学习 Python
    的信息。如果你是任何语言的专家级程序员，对你来说，上手 Python 会非常快。在开始学习 Python 之前，你需要知道如何在你的计算机上安装 Python。接下来，你需要了解一些关于语言语法的概念，以便读取和理解
    Python 代码。本章将带你完成所有这些内容。所以，准备好学习 Python 语言中一些重要的内容。


    ## 安装


    如今，大多数 UNIX 和 Linux 发行版已经预装了最新版本的 Python。甚至一些 HP 微软计算机已经安装了 Python。


    ### 下载 Python


    在开始使用 Python 进行机器学习之前，你必须在计算机上安装 Python，不过你可能不需要下载它。因此，要做的第一件事是在命令行窗口中输入 `Python`
    来确认是否安装了 Python。当你看到 Python 解释器的响应时，它的原始显示中会包含一个版本号。通常，任何最新版本都可以运行，因为 Python 试图保持向后兼容性。如果你想安装
    Python，最好搜索最新的稳定版本。该版本将具有未标记为 alpha 或 beta 发布的最高数字。如果你运行的是 Windows OS，可以在 Python
    for Windows 页面找到最稳定的 Windows 下载。如果你运行的是 Windows XP，你可以在“Python on XP”中找到安装 ActivePython
    的完整指南。对于使用 Mac 的用户，你可以导航到“Python for Mac OS X 页面”。对于使用 Debian 或 Ubuntu 的用户，你应该安装
    `python2x` 和 `pythonn2.x-deve` 包。


    ### 语法


    Python 程序是使用文本编辑器编写的，并且必须具有扩展名 `.py`。Python 程序并不要求第一行和最后一行内容，但可以将 Python 的位置指定为第一行
    `#!/usr/bin/python` 并使其变为可执行。尽管如此，命令行提示符另一个环境，你可以通过输入 `python file.py` 运行 Python
    程序。在 Python 中，没有分号和花括号。它是一种高级语言。因此，代码块不是通过选择相同的缩进来选择的。


    ### 第一个 Python 程序


    通常，当你开始学习任何编程语言时，你写的第一个程序将是“Hello, World!”这是一个打印“Hello, World!”的简单程序。对于我们的第一个
    Python 程序，你将学习如何编写一个两个两个数字的程序。一个两个两个数字的程序 ![](img/image88.jpg)


    上面的程序是如何工作的？程序的第一行以注释开始。Python 编程中的注释以 `#` 开头。Python 解释器和编译器会忽略注释。在 Python 编程中应用注释的原因是描述代码的功能。此外，注释有助于任何其他程序员理解你代码的工作原理。


    ## 变量与数据类型


    数据类型，顾其名，是不同类型的数据类别。它定义了一个值的集合以及可以在这些值上执行的操作。我们在程序中使用的显式值是字面量（literal）。例如，11、30.22、‘pypi’
    都是字面量。每个字面量都有一个与其关联的类型。例如，11 是一个 `int`，30.22 是 `float` 类型，而‘pypi’ 是字符串类型。通常，字面量的类型将决定可以对其执行的操作类型。


    Python 包含一个内置函数 `type()`，用于定义字面量的数据类型 ![](img/image98.jpg)`<class ''int''>` 描述
    54 的类型是 `int`。同样，`<class ''str''>` 和 `<class ''float''>` 显示“a string”和 98 分别是
    str 和 float。起初，你可能会说“3.14”是 float 类型，但因为它被封装在双引号中，它显然是一个字符串。同样，“99”也是一个字符串。Python
    中的字符串类型称为 `str`。字符串字面量可以用单引号或双引号定义。起始和结束引号之间的所有字符都是字符串的一部分。


    ### 字符串中的转义序列


    有时你希望让 Python 以不同的方式解释字符序列。这可能通过两种方式发生：


    - 你希望抑制字符串内部提供的特定字符的特殊解释。

    - 你希望对字符串中包含的通常按字面处理的字符应用特定的解释。


    你可以通过使用反斜杠 `\` 字符来实现这一点。字符串中的反斜杠字符意味着其后的一个或多个字符必须被唯一对待。这被称为转义序列，因为反斜杠会让随后的字符“逃逸”其正常含义。


    ### 布尔类型


    Python 有一种布尔数据类型。布尔类型的对象可能包含两个值：False 或 True ![](img/image123.jpg)Python 表达式在布尔上下文中求值。这意味着真值被描述为“Truthy”（真），而假值被描述为“Falsy”（假）。布尔类型对象的真值是开放的。这意味着等于
    True 的对象是 Truthy，而等于 False 的对象是 Falsy。然而，非布尔类型的对象也可以被求值。


    ## 变量


    在第一个 Python 程序中，你接触了 Python 变量。你简要地看到了如何在 Python 中定义变量并为其赋值某些值。本节讨论了 Python 中更多的变量。变量与其他编程语言中的一样，用于存储值。此外，你可以使用变量来访问数据和操作数据。


    ### 创建变量


    如果你想在 Python 中创建一个变量，必须使用赋值运算符 `=`。所示的格式适用于你想创建一个变量时 ![](img/image134.jpg)一个示例可以包括：


    ```

    number = 12

    ```

