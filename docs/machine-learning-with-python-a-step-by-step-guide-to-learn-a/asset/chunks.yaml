    ## Introduction

    Do you want to learn how to do machine learning with Python but you have problems
    getting started? In this book, you’ll learn all the important topics that you
    need to know for you to implement machine learning with Python. You’ll learn how
    to download, install Python, and get the best package for machine learning in
    Python. You’ll also load a dataset and understand its structure using data visualization
    and summaries. If you are new to machine learning and looking to eventually launch
    a career in Python, this book was designed for you.


    Python is a powerful interpreted language. Unlike other languages such as `R`,
    Python is a complete language and platform where you can apply both research and
    development production. Still, there are many modules and libraries which you
    can select from and generate different ways to perform each task. Methods in machine
    learning are popularly used in a wide variety of fields such as engineering, sciences,
