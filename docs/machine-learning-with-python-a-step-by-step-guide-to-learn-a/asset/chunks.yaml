    以下是每个数据结构的详细描述。


    ### 列表 (List)

    列表描述了具有有序集合的数据结构。考虑一个包含多个你需要购买的物品的购物清单。唯一的区别是，你的购物清单每个物品都单独占一行。然而，在 `Python` 列表中，你只需要用逗号分隔项目即可。一旦你创建了列表，你就有权限在同一个列表中添加、删除或搜索项目。由于列表允许你添加和删除项目，因此它被视为一种可变变数据类型。这意味着你可以随时更改它。


    ### 对象和类的简要介绍

    为了进一步了解 `Python` 语言中的列表，最好向你快速介绍对象和类的概念。列表就是对象和类的一个示例。因此，如果你打算使用一个如 `j` 类的变量并为其分配一个值（例如整数
    `7`），那么将其看作是在创建对象 `j` 是重要的。


    类包含方法。方法和函数是类似的。但是，方法仅定义在类内部。因此，访问函数的唯一方法是在该类中拥有一个对象。例如，在 `Python` 语言中，你可以将一个方法连接到列表类，这允许该对象的类。`Python`
    语言为列表类提供了 `append` 方法，允许在列表末尾添加项目。


    `Python` 中的类具有字段，其形式为声明为仅在特定类中使用的变量。这意味着如果你想使用这些变量，你需要拥有该类的对象。你通过点符号符号访问字段。例如，`mylist.field`。


    ### 它的工作原理

    有一个变量 `shoplist`，它包含了关于一个计划去市场的人的信息。`shoplist` 允许你存储计划购买的物品的名称字符串。然而，你也可以添加任何类型的对象，如数字。此程序还有一个
    `for` 循环，它支持列表的迭代。你应该已经开始意识到列表类似于序列。注意结束参数是如何用于调用 `print` 函数的。这表明你想用空格而不是普通的换行来结束输出。


    接下来，你应该使用 `append` 方法向列表添加一个项目。使用 `print` 函数检查项目是否已添加。程序中还有一个排序方法，其目的是对列表进行排序。需要注意的是，这个特定方法影响列表本身，它不能返回一个修改后的列表。


    下一步是完成从市场购买物品。这个过程等同于从列表中删除项目。你通过 `del` 语句辅助操作。对于这种场景，你需要描述列表中想要删除的找到的项目。然后使用
    `del` 语句将其从列表中删除。之后，`del` 语句会将其从列表中移除。在 `Python` 中删除列表中的项目，你只需要写以下行：


    ```python

    del shoplist[0]

    ```


    ### 元组 (Tuple)

    元组存储多个对象。它们与列表相似，区别是它们没有像列表类那样的许多函数。元组的一个伟大特性是它像字符串一样是不可变的。这意味着很难更改元组。如果你想定义元组，必须描述项目并用逗号分隔它们。在值集合无法更改的情况下，最适合使用元组。


    ### 字典 (Dictionary)

    字典类似于地址簿，你可以通过姓名搜索其详情。在字典中，键（key）与值（value）相关。请记住，键必须是唯一的，你可以使用不可变对象作为字典的键。记住字典中的键值对没有固定的顺序。


    # 第 2 章：机器学习简介

    机器学习的重点是学习数据的本质并将其应用于特定的模型。虽然机器学习是计算机科学的一个领域，但它与传统方法不同。当你观察传统计算时，算法被描述为一组程序编写的指令。这些指令为问题提供了解决方案。机器学习算法让计算机从数据中学习，并应用统计分析来显示在给定范围内找到的值。


    机器学习允许计算机从数据样本中创建模型，以便它可以根据类型做出决策。如今，技术用户从机器学习的想法中受益匪浅。例如，面部识别为社交媒体网络提供了机会，使用户可以标记并与朋友分享照片。还有光学字符识别
    (`OCR`)。这种技术应用于电影、节目和电子商务中，以向用户提供建议。


    本章将带你了解一些最常见的机器学习方法：监督学习和无监督学习，以及流行的机器学习算法。此外，你将学习为什么除了 `Python` 之外你还需要机器学习。此外，本章还将探讨在构建算法时与机器学习相关的偏差。


    ## 机器学习方法

    在机器学习领域，任务被归类为不同的部门。这些部门的大多数取决于如何执行学习或所交付的反馈类型。最受欢迎的机器学习方法包括监督学习和无监督学习。对于监督学习，算法从人类标记的输入和输出数据中学习。另一方面，无监督学习不向算法提供任何标记数据，但算法必须在输入本身中找到结构。


    ### 监督学习

    对于监督学习，计算机有一个输入数据示例可供工作。这种方法的目的是允许算法通过使用已训练的输出比较实际输出来“学习”，以发现错误并更改模型。换句话说，这种方法包含了辅助预测的模式。例如，在监督学习中，你可以向算法输入数据并将其标记为鱼。此外，你可以喂给它海洋图像并将其标记为水。在算法经过多次训练后，它必须能够区分鱼和海洋。监督学习最流行的用例之一是使用历史数据来预测事件发生的概率。它可以使用历史数据来预测市场变化。此外，监督学习可以帮助过滤垃圾邮件。


    ### 无监督学习

    与数据标记的监督学习不同，无监督学习处理的是未标记数据。这意味着任务是识别提供数据中的相似特征。由于未标记数据与标记数据相比非常流行，机器学习的技术在行业中非常有价值。无监督学习的目标非常简单。无监督学习最大的应用是在交易数据中，由客户组成的海量数据，由于你是人类，你可以从客户资料和他们的购买历史中提取意义。在没有预期结果的情况下，应用机器学习时无监督学习是正确的技术。


    ## 机器学习方法

    机器学习与计算统计密切相关。因此，如果你具备统计学知识，理解并应用机器学习算法是非常重要的。这里是用于检测变量的一些定义：


    - 相关性 (Correlation)：描述独立变量或依赖变量之间的关联。

    - 回归 (Regression)：在最低水平，有助于确定独立变量和依赖变量之间的关系。

    - 最近邻 (k-nearest neighbor)：这种特定算法应用于模式识别。在分类和回归中，`k` 是一个正整数。


    ### KNN 分类

    当涉及到这种方法时，输出属于类别。这为新对象分配最流行的类别 `k`-最近邻。例如，当 `k = 1` 时，对象必须被分配一个最近邻。下面的图描述了这种算法。图中有蓝色对象和橙色对象，只需记住它们属于不同的类别。一旦你引入一个新对象（如绿色），你需要学习算法将其分配到特定类别。对于
    `k = 3`，算法将必须选取属于绿色和星色的三个最近邻。最近邻算法被标记为“懒惰学习”。


    ### 决策树 (Decision Tree)

    通常情况下，当你想要决策的视觉化表示时，决策树是重要的。在处理机器学习和数据挖掘时，决策树对于数据是关键的。在决策树中学习当你想要创建一个预测值的模型时是重要的。如果你观察预测模型，数据的特征必须通过分支定义并表示。此外，与数据目标值相关的结论显示在叶节点中。该决策树通过排序进行分类。然后它可以显示是否应该执行。总之，关系将很容易选择。


    ### 深度学习 (Deep Learning)

    通过深度学习，它将始终尝试模仿大脑如何成功处理。深度学习的架构由神经网络驱动。此外，它包含了许多不同的层。在当前的机器学习中，深度学习已成功处理大部分数据以及认知任务。它是应用的最佳方法之一。


    ### 编程语言

    当人们想要选择用于机器学习的语言时，有一些他们可能考虑的因素，例如可用的库。其他使用的语言包括 `C++`、`Java` 和 `R`。


    # 第 3 章：数据处理、分析与可视化

    ### 理解数据处理

    数据处理是将数据性质变为更有用且更理想的形式。换句话说，它是让数据更有意义和信息量。通过应用机器学习算法、统计知识和数学建模，可以实现整个过程的自动化。这整个过程的输出可以是任何形式，如表格、图形、图表、图像等，取决于所完成的操作和机器的要求。这可能看起来简单，但对于
    `Facebook`、`Twitter`、`UNESCO` 和健康部门等大型机构和公司，这整个过程必须以结构化的方式执行。


    ### 收集 (Collection)

    开始机器学习最重要的一步是确保可用数据具有高质量。你可以从真实的来源收集数据，如 `Kaggle`、`data.gov.in` 和 UCI 数据集仓库。例如，当学生准备参加竞争性考试时，他们总是寻找最好的资源来使用以确保获得良好结果。同样，准确且高质量的数据将简化模型的学习过程。这意味着在测试期间，模型将输出最佳结果。数据收集涉及大量的时间、资金和资源。机构和研究人员必须选择正确类型的数据。例如，从事面部识别需要大量具有不同人类表情的图像。良好的数据将确保模型的结果是正确且真实的。


    ### 准备 (Preparation)

    收集的数据可以是原始形式的。原始数据不能直接喂给机器。相反，必须先对数据进行某些处理。准备阶段涉及从广泛的来源收集数据、分析数据集，然后构建用于额外处理和探索的新数据集。准备可以手动或自动进行，数据应准备成数值形式以提高模型的学习率。

    '
