    该语句将创建一个名为 `number` 的变量并将其赋值为 `12`。当 Python 解释器遇到此语句时，它会执行以下操作：


    1. 存储变量 `12` 在内存中。

    2. 让变量 `number` 指向它。


    关键点是赋值运算符左侧的变量名。如果你没有这样做，将得到语法错误。描述这种的编程术语称为动态类型。这意味着你可以根据初始值使用不同的类型。当你给变量赋值新值时，旧值的引用将丢失。例如，如果变量
    `number` 被赋值为“ten”，对 12 的引用将丢失。在此处，Python 解释器将通过垃圾回收移除该值。如果你在赋值之前尝试访问变量，将得到 NameError。


    ## 控制流


    控制流强调了程序执行的顺序。在 Python 程序中，控制流通过函数调用、条件语句和循环来实现。本节将处理 If 语句、While 和 For 循环。


    ### If 语句


    有时你希望在某些条件下运行特定的语句，或者根据互斥条件决定运行的语句类型。Python 有由 `if`、`elif` 和 `else` 组成的 If 语句。这些复合语句允许你有条件地创建块。以下是
    If 语句的通用声明 ![](img/image154.jpg)在这里 `elif` 和 `else` 子句是可选的。作为提醒，Python 中没有 switch
