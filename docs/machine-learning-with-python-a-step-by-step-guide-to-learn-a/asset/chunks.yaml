    With eager learners, the classification model is created with respect to the type
    of training data before getting data for classification. It should be able to
    dedicate a single hypothesis that handles the whole instance space. Because of
    the construction of the model, eager learners will consume more training time
    and minimum time during prediction. Example of eager learners includes `Artificial
    Neural Networks`, `Naive Bayes` and `Decision Tree`.


    # Classification Algorithms There are many different kinds of classification algorithms
    developed, however, it is hard to pick on one which is better than the other.
    This is because of a few factors such as the application and nature of the existing
    data set. For instance, if you have linearly separable classes, the linear classifiers
    such as `Logistic regression`, `Fisher’s linear discriminant` can execute complex
    models.


    ## Decision Tree ![](image566.jpg)

    A decision tree creates regression models and classification models just like
    a tree structure. This tree works with the same concept as the `if-then` rule
    set that is mutually exclusive and exhaustive for classification. Rules are learned
    sequentially by applying the training data one at a time. Every time a rule is
    learned, the tuples which the rules handles are deleted. This process is repeated
    on the training set until a meeting termination condition is attained. The tree
    is built through a technique called `top-down recursive divide-and-conquer manner`.
    All the features must be categorical. Nonetheless, they need to be discretized
    in advance. With a decision tree, it is very easy for overfitting to take place.
    Overfitting will produce many branches which may indicate problems of noise and
    outliers. In an overfitted model, the performance is very poor on the unseen data
    although it provides the correct performance on training data. However, this is
    can be avoided by applying `pre-pruning`. `Pre-pruning` shall stop the tree construction
    early or `post-pruning` which eliminates branches from a complete tree.


    ### Pros of Decision trees

    1. Transparency: This is one of the most important advantages of the decision
    tree model. Unlike other models of the decision tree, the decision tree reveals
    all possible alternatives and traces each alternative to the end in a single view.
    This makes it easy to compare the different alternatives. The application of different
    nodes to represent user-defined decisions increases transparency in decision making.

    2. Specificity: Another major advantage of the decision tree in the analysis is
    the ability to allocate a given value to a problem and outcomes of every decision.
    This is important because it helps minimize vagueness in the decision making.
    Every possible case from a decision tree discovers a representation using a clear
    fork and node. This allows one to see all solutions in a clear view. The inclusion
    of monetary values to decision tree reveals the costs and benefits of taking a
    different course of action.

    3. Ease of use: The decision tree has a graphical representation of the problem
    and different alternatives in an easy and simple way to help any person understand
    without asking for an explanation.

    4. Comprehensive nature: The decision tree is one of the best predictive models
    because it has a comprehensive analysis of the results of every possible decision.
    That can include what the decision leads to, if it finishes in uncertainty or
    whether it results to new issues which the process may require repetition.

    5. They implicitly perform feature selection.

    6. Decision trees can deal with categorical and numerical data.

    7. Users have little to do with data preparation.

    8. Nonlinear relationships between parameters cannot affect the performance.


    ### Disadvantages of Decision trees

    1. There are times when decision trees can be unstable because of the little variations
    in the data that may lead to a totally different tree generated.

    2. The `greedy algorithm` cannot prove that it will return a universally optimal
    decision tree. This can be solved by training multiple trees where the samples
    and features have been randomly sampled with replacement.

    3. Learners of the decision tree can build advanced trees that don’t generalize
    the data.

    4. Decision tree learners can be biased if there are classes which dominate. For
    that reason, it is advised to balance the data set before fitting with the decision
    tree.


    ## K-Nearest Neighbor (KNN) ![](image597.jpg)

    The `k-nearest Neighbor` belongs to the lazy learning algorithm which holds all
    instances that match to training data points in `n-dimensional space`. In case
    there is an unknown discrete data, it has to make an analysis of the nearest `k`
    number of instances saved and display the most popular class as the prediction.
    For the real-valued data, it has to return the mean of `k-nearest neighbors`.
    In the case of the distance-weighted nearest neighbor algorithm, it measures the
    weight of every `k-nearest neighbor` based on their distance by applying the query
    below![](image603.jpg).Typically, `KNN` is very strong to noisy data because it
    averages the `k-nearest neighbors`.


    ### Pros of KNN

    - A simple algorithm to explain and understand

    - It doesn’t make any assumptions about data.

    - It has a higher accuracy that is not comparable to other better-supervised learning
    models.

    - It is versatile for classification and regression.


    ### Cons of KNN

    - Calls for a higher memory requirement

    - It is computationally expensive since the algorithm has all the training data.


    ### Quick features of KNN

    - This algorithm holds the whole training dataset that uses as a representation.

    - It doesn’t learn any model.

    - It performs timely predictions by calculating the similarity between sample
    input and instance training.


    ## Where Can You Apply K-means

    `K-means` is used with data that is numeric, continuous and has a small dimension.
    Imagine an instance where you would like to group similar items from a randomly
    spread collection of things such as `k-means`. This list has a few interesting
    areas where you can apply `K-means`


    1. Classification of documents: Clustering of documents in numerous categories
    depends on topics, tags, and the content of the document. This is a normal classification
    problem and `k-means` is a great algorithm for this function. The original document
    processing is important when you want to replace every document as a sector and
    applies the frequency term to use terms which classify the document. The vectors
    of the document have to be clustered so that they can select similarity in document
    groups.

    2. Delivery store Optimization: If you want to improve the process of delivery,
    you’ll need to enhance it by applying drones and integrating `k-means algorithm`
    to determine the optimal number of launch locations and a `genetic algorithm`
    to compute the route of the truck.

    3. Fantasy League Stat Analysis To analyze the stats of a player is one of the
    most critical features of the sporting world. With the rapid rise of competition,
    machine learning has an important function to offer here. As a great exercise,
    if you want to build a fantasy draft team and select similar players, `k-means`
    is a great option.

    4. Rideshare Data analysis: Information about `Uber` is available to the public.
    This dataset has an extensive size of valuable data about transit time, traffic,
    peak pickup localities, and many more. If you analyze this particular data, you
    will get insight into the urban traffic patterns and help plan for the cities
    in the future.

    5. Cyber-profiling criminals: This is the process of gathering data from people
    and groups to select important links. The concept behind cyber-profiling is extracted
    from criminal histories that provide information about investigation division
    to help categorize criminals present at the crime.

    5. Automatic clustering of IT Alerts

