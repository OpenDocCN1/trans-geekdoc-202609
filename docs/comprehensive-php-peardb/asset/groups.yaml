    # Figure 6: Output of DB_storage overview code.


    The DB_storage class provides the framework for developing extremely object-oriented
    database applications. While I personally advocate OO programming, I am not convinced
    that using DB_storage in PHP applications gains much when compared to using the
    array-based data provided by default from the PEAR::DB fetch methods. In large
    applications with long lifetimes, an OO approach to low-level data manipulation
    is probably preferred, but many (if not most) PHP applications are short lived
    and stateless, so this approach may be overkill.


    In any case, the methods of the DB_storage class are listed in Table 9 and detailed
    below.


    | Method | Description |

    |---|---|

    | _makeWhere() | Private method used to generate a WHERE clause to locate the
    record in the table representing this object. |

    | setup() | Initialize the DB_storage object from the configured table. |

    | insert() | Create a new, empty row in the table for this object. |

    | toString() | Output a simple description of this DB_storage object. |

    | dump() | Dump the contents of this object to standard output. |

    | create() | Static method used to create new DB_storage objects. |

    | set() | Modify an attribute of this object. |

    | get() | Fetch an attribute of this object. |

    | store() | Saves changes to this object to the database. |'
