    ```


    上述 DSN 在 Windows 上有效，但只需适当更新路径格式即可简单地适配到其他操作系统上。


    在基于 Windows 的 PHP 上安装 SQLite 轻而易举。只需从 **http://www.php.net/sqlite** 下载可用的 `php_sqlite.dll`
    文件，然后从 SQLite 网站 **http://www.sqlite.org/** 下载实际的 SQLite 引擎 DLL（`sqlite.dll`）。


    将 `sqlite.dll` 文件放置在 Windows 的搜索路径中（如 `system32` 目录），然后将 `php_sqlite.dll` 复制到
    PHP 扩展目录。然后通过在 `php.ini` 文件中添加 `extension=php_sqlite.dll` 来启用 SQLite。


    测试脚本运行没有任何错误或警告。

    然而，生成了一条通知：


    ```

    Notice: Undefined index: mode in C:\\temp\\PEAR\\php-4.3.4-Win32\\pear\\DB\\sqlite.php
    on line 185

    ```


    此警告基于这样一个事实：出于某种原因，SQLite 数据库对象期望解析后的 DSN 具有名为 *mode* 的成员，而该成员不存在。也许这将在 PEAR::DB
    的未来版本中添加。无论如何，如果您在典型配置的环境中运行，此通知将不会显示。然而，如果您在类 Unix 操作系统上运行 SQLite，*mode* 值指定文件模式（例如
    0644），您可能希望指定它。如果您这样做，则需要编辑 DB_sqlite 实现或使用基于数组的 DSN 并直接提供 *mode* 键。


    从 PHP 的角度来看，PEAR::DB 中对 SQLite 的支持对于这样一个新数据库来说出人意料地完整。在受限的托管环境中或不需要完整数据库后端的情况下，使用
    SQLite 可能更受青睐。SQLite 的开销非常小，且 SQL 语言支持非常完整。


    ## dBase


    PEAR::DB 中对 dBase 的支持极其有限。示例代码无法与 dbase 配合使用，因为接口的真正支持非常少。在 PHP 网站上稍微查看后，甚至 dBase
    本身也未得到完全支持：


    不支持索引或备注字段。也不支持锁定，两个并发

    '
