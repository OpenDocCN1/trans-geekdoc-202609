    某些数据库引擎原生支持序列（例如 Oracle）。其他数据库类型则仅仅提供上述自动递增列类型。在某些情况下，使用这种列类型会给数据恢复和导入带来挑战。通过使用\
    \ PEAR::DB 序列，代码更具可移植性和可维护性，并且 PEAR::DB 序列可以避免与自动递增字段相关的一些问题。\n\n下面代码清单 9 给出了一个使用序列的简单示例。\n\
    \n```php\n<?php\nrequire_once( 'DB.php' );\n\n// make a non-persistent connection\
    \ to a MySQL database\n$oDB = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n\
    false );\nif ( !DB::isError( $oDB ) )\n{\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n\n$idSeq2 = $oDB->nextId( 'sequence_2'\
    \ );\nprint( \"idSeq2 = $idSeq2<br>\" );\n\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n$oDB->disconnect();\n}\n?>\n```\n\n\
    ### 代码清单 9：使用序列\n\n管理。第 5 行的 DB::connect() 调用正是相关的更改。\n\n```php\n<?php\nrequire_once(\
    \ 'DB.php' );\n\n// make a non-persistent connection to a MySQL\ndatabase\n$oDB\
    \ = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\narray( 'seqname_format'\
    \ => 'seq_%s' ) );\nif ( !DB::isError( $oDB ) )\n{\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n\n$idSeq2 = $oDB->nextId( 'sequence_2'\
    \ );\nprint( \"idSeq2 = $idSeq2<br>\" );\n\n$idSeq1 = $oDB->nextId( 'sequence_1'\
    \ );\nprint( \"idSeq1 = $idSeq1<br>\" );\n\n$oDB->disconnect();\n}\n?>\n```\n\n\
    ### 代码清单 10：自定义序列表名称格式\n\n正如预期的那样，运行代码清单 10 中所示的代码会创建两个新表：seq_sequence_1 和 seq_sequence_2。请注意，虽然序列是一种可以让您的应用程序移植到各种数据库的通用机制，但不建议依赖该实现。例如，如果您出于单纯使用序列之外的任何目的，依赖\
    \ PEAR::DB 中 MySQL 类所实现的序列的表名信息，那么您的应用程序将不容易移植到 Oracle 后端。这是因为 Oracle 原生支持序列，因此\
    \ MySQL 实现所创建的表不会被 Oracle 实现所创建。\n\n作为开发者，我个人建议使用序列，而不是自动递增字段类型。根据底层数据库的不同，自动递增字段可能会引发一些问题。\n\
    \n## 准备和执行\n\n通过使用 PEAR::DB，数据库查询的 prepare 和 execute 方法同样也被推广到所有数据库。借助 prepare()、execute()\
    \ 和 executeMultiple() 方法，通用查询执行具备了更大的灵活性。这些方法的细节将在下文给出，但作为高层概述，下面代码清单 11 给出了一个简单示例。\n\
    \n```php\n<?php\nrequire_once( 'DB.php' );\n\n// make a non-persistent connection\
    \ to a MySQL\ndatabase\n$oDB = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n\
    array( 'seqname_format' => 'seq_%s' ) );\nif ( !DB::isError( $oDB ) )\n{\n$aInsertSQL\
    \ = 'INSERT INTO Employees ( id ,\nlast_name , first_name , phone_ext , mgr_id\
    \ ,\ndept_id ) VALUES ( ?, ?, ?, ?, ?, ? )';\n$hQuery = $oDB->prepare( $aInsertSQL\
    \ );\n\n$aData = array( $oDB->nextId( 'employees' ),\n'Schwendiman', 'Ryan', '123',\
    \ '1', '1' );\n$result = $oDB->execute( $hQuery, $aData );\nif ( DB::isError(\
    \ $result ) )\nprint( $result->getMessage() );\n\n$aData = array( $oDB->nextId(\
    \ 'employees' ),\n'Schwendiman', 'Scott', '234', '1', '1' );\n$result = $oDB->execute(\
    \ $hQuery, $aData );\nif ( DB::isError( $result ) )\nprint( $result->getMessage()\
    \ );\n\n$aData = array( $oDB->nextId( 'employees' ),\n'Schwendiman', 'Taylor',\
    \ '323', '1', '1' );\n$result = $oDB->execute( $hQuery, $aData );\nif ( DB::isError(\
    \ $result ) )\n    print( $result->getMessage() );\n\n$oDB->disconnect();\n}\n\
    ?>\n```\n\n### 代码清单 11：prepare() 和 execute() 使用概览\n\n首先，使用 prepare/execute 模型的查询必须先参数化，例如上面第\
    \ 8 行所示的查询。所有动态字段都由 '?' 字符替换。接下来，使用 prepare() 方法从数据库对象获取查询句柄，如第 9 行所示。该句柄稍后用于调用\
    \ execute() 或 executeMultiple()。替换 '?' 字段的数据由数组参数提供。上面第 11、16 和 21 行展示了如何设置这样的数组。参数的顺序必须与预处理查询中使用的顺序一致。最后，按照第\
    \ 12、17 和 22 行所示执行查询。\n\n来自其他编程/数据库背景的开发者会立即认出 prepare/execute 方法，并理解其优点。这些概念将在后面\
    \ DB_common 类的方法参考中详细讨论。\n\n## autoPrepare 和 autoExecute\n\nautoPrepare 和 autoExecute\
    \ 是上述 prepare 和 execute 机制的扩展。新增功能是完全消除创建参数化查询的需要。\n\n### 代码清单 12：使用 autoPrepare\n\
    \n```php\n<?php\nrequire_once( 'DB.php' );\n\n$oDB = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n\
    array( 'seqname_format' => 'seq_%s' ) );\nif ( !DB::isError( $oDB ) )\n{\n$aFields\
    \ = array( 'id', 'last_name',\n'first_name', 'phone_ext', 'mgr_id', 'dept_id'\
    \ );\n$oQuery = $oDB->autoPrepare( 'Employees',\n$aFields, DB_AUTOQUERY_INSERT\
    \ );\n\n$aData = array( $oDB->nextId( 'employees' ),\n'Schwendiman', 'Ryan', '123',\
    \ '1', '1' );\n$result = $oDB->execute( $oQuery, $aData );\nif ( DB::isError(\
    \ $result ) )\nprint( $result->getMessage() );\n\n$aData = array( $oDB->nextId(\
    \ 'employees' ),\n'Schwendiman', 'Scott', '234', '1', '1' );\n$result = $oDB->execute(\
    \ $oQuery, $aData );\nif ( DB::isError( $result ) )\nprint( $result->getMessage()\
    \ );\n\n$aData = array( $oDB->nextId( 'employees' ),\n'Schwendiman', 'Taylor',\
    \ '323', '1', '1' );\n$result = $oDB->execute( $oQuery, $aData );\nif ( DB::isError(\
    \ $result ) )\nprint( $result->getMessage() );\n\n$oDB->disconnect();\n}\n?>\n\
    ```\n\n代码清单 12 中的示例说明了 autoPrepare() 方法的使用。与代码清单 11 中演示的指定参数化 SQL 查询不同，这里只需指定表名和字段名。autoPrepare()\
    \ 方法使用表名、字段名和一个模式参数，在内部创建并准备适用于 INSERT 或 UPDATE 的 SQL 查询。\n\n此处的示例仅简要概述 autoPrepare()\
    \ 方法。autoExecute() 方法与此类似，这两种方法将在后面的章节中详细讨论。\n"
