    # DB_result::getRowCounter


    +   - `mixed getRowCounter( void )`


    The **getRowCounter()** method is intended to retrieve the current row number
    from the result set. This method relies on the `limit_from` and `limit_count`
    options described in the **setOptions()** method on page 11.


    > Because of the caveats mentioned in that section, I recommend against relying
    on the **getRowCounter()** method as well.


    Simulating a row counter in an application is trivial, so I recommending an application-specific
    row numbering system based on the needs of your specific application.


    +   - Returns an integer row number or NULL.


    # Class DB_Error


    The class DB_Error is a subclass of PEAR_Error which is a generic error object
    used throughout the PEAR classes. A complete description of the PEAR_Error class
    is out of the scope of this document, but a good example of using DB_Error is
    illustrated in Code Listing 20 on page 52.


    # Class DB_Warning


    Class DB_Warning has been deprecated and is no longer used in PEAR::DB.'
