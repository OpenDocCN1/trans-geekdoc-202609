    \ Listing 3) illustrates the common procedural method for retrieving data from\
    \ a MySQL database.\n\n```php\n<?php\n// connect to MySQL DB\n$link = mysql_pconnect(\
    \ '207.44.182.3',\n'bt_user','bt_pass' );\nif ( $link != FALSE )\n{\nif ( mysql_select_db(\
    \ 'book_test' ) )\n{\n/* Performing SQL query */\n$query = \"SELECT Employees.last_name\
    \ as\nemp_last_name, Employees.first_name as\nemp_first_name, Employees.phone_ext\
    \ as\nemp_phone_ext, Departments.name as dept_name,\nEmployees_1.last_name as\
    \ mgr_last_name,\nEmployees_1.first_name as mgr_first_name,\nEmployees_1.phone_ext\
    \ as mgr_phone_ext FROM\n(Departments INNER JOIN Employees ON Departments.id\n\
    = Employees.dept_id) LEFT JOIN Employees AS\nEmployees_1 ON Employees.mgr_id =\
    \ Employees_1.id\";\n$result = mysql_query($query);\nif ( $result != FALSE )\n\
