    \ return an error.\n\nThe methods described in this section are the common methods\
    \ available to all database server classes.\n\n| Method | Description |\n|---|---|\n\
    | `toString()` | String conversion. This method provides a string representation\
    \ of the DB_common object. |\n| `quoteString()` | Quotes a string so it can be\
    \ safely used within string delimiters in a query (preserved for compatibility\
    \ issues, `quote()` is preferred). |\n| `quote()` | Preferred method for quoting\
    \ a string for safe use within queries. |\n| `provides()` | Tell whether a DB\
    \ implementation or its backend extension supports a given feature. |\n| `errorCode()`\
    \ | Map native error codes to portable PEAR::DB codes. |\n| `errorMessage()` |\
    \ Map a DB error code to a textual message. This is actually just a wrapper |\n"
  mdcn: "\n\n关于 **DB_common** 类的内容如下。此外，第 66 页中关于 **autoExecute()** 方法的讨论也提供了一些限制和使用信息。\n\
    \n## 引言摘要\n\n至此，PEAR::DB 的引言部分结束。上述高层概述概括了 PEAR::DB 的主要概念。以下各节将详细介绍 PEAR::DB 的类及其方法和属性。\n\
    \n## DB 类\n\n**DB** 主类实际上只是一个容器类，包含一些通用的静态方法和工具函数，适用于 PEAR::DB。表 3 中列出的静态方法定义在\
    \ **DB** 类中。\n\n| 方法 | 描述 |\n|---|---|\n| `factory()` | 创建一个特定类型的新数据库连接对象。实际上并不建立连接。\
    \ |\n| `connect()` | 创建一个新的数据库连接对象，并建立与数据库服务器的连接。 |\n| `apiVersion()` | 返回 DB\
    \ API 版本。 |\n| `isError()` | 检查传入的参数是否为错误对象。 |\n| `isConnection()` | 检查传入的参数是否为数据库连接类型。\
    \ |\n| `isWarning()` | 检查传入的参数是否为警告对象。 |\n| `isManip()` | 检查传入的 SQL 语句是数据操作查询还是数据定义查询。\
    \ |\n| `errorMessage()` | 根据数字数据库错误代码或 DB_Error 对象返回文本错误消息。 |\n| `parseDSN()`\
    \ | 从 DSN 字符串返回完全解析后的 DSN。此方法不太可能被直接使用，通常可视为私有方法。 |\n| `assertExtension()` | 根据需要动态加载特定的\
    \ PHP 扩展。此方法不太可能被直接使用，通常可视为私有方法。 |\n\n表 3：DB 类方法\n\n### DB::factory\n\n`mixed\
    \ factory( string $type )`\n\n创建一个新的数据库连接对象，但不连接数据库服务器。*type* 参数是一个字符串值，仅包含要创建的数据库对象的类型。有效值显示在第\
    \ 19 页表 1 的 *phptype* 列中。\n\n返回新创建的 DB 对象或 **DB_Error** 对象。\n\n通常不使用此方法，因为 **connect()**\
    \ 方法同时执行数据库对象创建和连接。但是，在某些情况下，创建一个不连接的数据库对象可能更可取。\n\n请注意，如果您选择使用 **factory()**\
    \ 方法获取数据库对象，然后使用该对象的 **connect()** 方法，则需要手动设置数据库对象的选项。此外，您还需要直接调用 **parseDSN()**，因为实例化的数据库对象期望的是已解析的\
    \ DSN，而不是 DSN 字符串。代码清单 13 中显示了一个示例。\n\n```php\n<?php\nrequire_once( 'DB.php' );\n\
    \n// create an unconnected MySQL DB object\n$oDB = DB::factory( 'mysql' );\nif\
    \ ( DB::isError( $oDB ) )\n{\n    print( 'Unable to create MySQL DB object<br>'\
    \ );\n    exit;\n}\n\n$oDB->setOption( 'optimize', 'portability' );\n\n$result\
    \ = $oDB->connect( DB::parseDSN(\n'mysql://bt_user:bt_user:bt_password@207.44.182.3/book_test'\n\
    ) );\nif ( DB_OK == $result )\n{\n    // do DB work, then disconnect\n    //$oDB->disconnect();\n\
    }\nelse\n{\n    // $result is a DB_Error object\n    print( 'Unable to connect\
    \ to MySQL' . $result->getMessage() . '<br>' );\n    exit;\n}\n?>\n```\n\n###\
    \ 代码清单 13：DB::factory\n\n在代码清单 13 中，对象在第 5 行创建。通过调用 **factory()** 仅指定了数据库类型。检查结果的有效性，然后在第\
    \ 12 行设置选项。在第 14 行，实际连接到数据库服务器。注意，传递给 **parseDSN()** 方法的 DSN 字符串包含数据库类型。这是解析成功所必需的（有关有效\
    \ DSN 字符串格式的列表，请参阅第 18 页的代码清单 7）。确保 **factory()** 方法中使用的数据库类型与用于建立实际连接的 DSN 中指定的数据库类型一致。\n\
    \n再次强调，在几乎所有情况下都建议使用 **connect()** 方法。\n\n### DB::connect\n\n`mixed connect( mixed\
    \ $dsn, mixed $options = false )`\n\n这是创建新数据库对象并同时连接数据库服务器的首选方法。\n\n*dsn* 参数可以是\
    \ DSN 字符串，也可以是已解析的 DSN（从 **DB::parseDSN** 返回）。*options* 参数可以是布尔值或数组。当 *options*\
    \ 是数组时，它必须是关联数组，其名称/值对可以传递给数据库对象的 **setOption()** 方法。当前使用的默认选项显示在第 20 页的表 2 中。当\
    \ *options* 是布尔值时，它被解释为\n\n| 元素 | 默认值 | 描述 |\n|---|---|---|\n| dbsyntax | false\
    \ | 关于 SQL 语法等所使用的数据库 |\n| username | false | 登录用户名 |\n| password | false | 登录密码\
    \ |\n| protocol | false | 要使用的通信协议（tcp、unix 等） |\n| hostspec | false | 主机规范（主机名[:端口]）\
    \ |\n| port | false | 要连接的端口 |\n| socket | false | 要连接的套接字 |\n| database | false\
    \ | 在 DBMS 服务器上使用的数据库 |\n\n表 4：DSN 数组元素\n\n每个后端数据库服务器可能以不同方式使用 DSN 元素。有关每个数据库服务器的有效\
    \ DSN 示例，请参阅下面专门介绍这些数据库服务器的章节。\n\n### DB::assertExtension\n\n`boolean assertExtension(\
    \ string $name )`\n\n根据传入的 name 参数加载 PHP 扩展。在 PEAR::DB 中，这些扩展是数据库扩展（例如 mysql、oci8\
    \ 等）。\n\n如果扩展已加载，则返回 true。\n\n```php\n<?php\nrequire_once( 'DB.php' );\n$aExtensions\
    \ = array( 'mysql', 'pgsql', 'ibase',\n'msql', 'mssql', 'oci8', 'odbc', 'sybase',\
    \ 'ifx',\n'fbsql', 'sqlite', 'dbase' );\nforeach( $aExtensions as $aExt )\n{\n\
    \    if ( DB::assertExtension( $aExt ) )\n        print( $aExt . ' extension loaded<br>'\
    \ );\n    else\n        print( $aExt . ' extension not loaded<br>' );\n}\n?>\n\
    ```\n\n### 代码清单 15：DB::assertExtension 示例\n\n代码清单 15 中显示的示例代码演示了如何检查所有受支持的 PEAR::DB\
    \ 数据库服务器。我的基于 Windows 的安装的输出如输出 5 所示。\n\n```\n1 mysql extension loaded\n2 pgsql\
    \ extension not loaded\n3 ibase extension not loaded\n4 msql extension not loaded\n\
    5 mssql extension not loaded\n6 oci8 extension not loaded\n7 odbc extension loaded\n\
    8 sybase extension not loaded\n9 ifx extension not loaded\n10 fbsql extension\
    \ not loaded\n11 sqlite extension not loaded\n12 dbase extension not loaded\n\
    ```\n\n输出 5：DB::assertExtension 示例输出\n\n## DB 类总结\n\n在一般的开发项目中，DB 类通常只使用两个成员：**connect**\
    \ 和 **isError**。其他方法在某些情况下有帮助，但很少使用。通常，DB 类方法将以静态方式使用；无需创建 **DB** 类型的对象。\n\n##\
    \ DB_common 类\n\n**DB_common** 类是所有数据库服务器特定类的父类。**DB_common** 的目的是为所有具体实现类提供公共接口定义。在某种程度上，**DB_common**\
    \ 可以看作抽象基类，因为 **DB_common** 中定义的许多方法除了返回错误之外什么都不做。\n\n本节描述的方法是对所有数据库服务器类都可用的通用方法。\n\
    \n| 方法 | 描述 |\n|---|---|\n| `toString()` | 字符串转换。此方法提供 DB_common 对象的字符串表示形式。 |\n\
    | `quoteString()` | 对字符串进行引号处理，以便可以在查询的字符串分隔符内安全使用（为兼容性而保留，首选 `quote()`）。 |\n\
    | `quote()` | 对字符串进行引号处理以在查询中安全使用的首选方法。 |\n| `provides()` | 告知某个 DB 实现或其后端扩展是否支持给定功能。\
    \ |\n| `errorCode()` | 将原生错误代码映射为可移植的 PEAR::DB 代码。 |\n| `errorMessage()` | 将 DB\
    \ 错误代码映射为文本消息。这实际上只是一个包装器 |\n\n"
