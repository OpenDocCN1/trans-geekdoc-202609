    ## PEAR 与数据库

    ### *本文档的动机*

    PEAR 的核心是代码重用。这就是本文档的主要动机。如果您是一名 PHP 程序员并且开发过任何数据库项目，PEAR::DB 就是为你准备的。在 PHP 的生命周期中，开发出了几种优秀的数据库抽象，有的面向对象，有的不是。PEAR::DB
    是标准的面向对象数据库抽象。


    随着 PHP 的不断发展和用户群的增长，越来越多的开发者将被聘请来维护和修改现有代码。通过标准化 PEAR，维护和升级将集中在业务特定代码上，而不是诸如数据库访问之类的通用代码。


    ### *入门*

    本书对您作为程序员的能力做了很多假设。首先，您必须在 Web 服务器上安装并运行 PHP。其次，本书假设您对 PHP 有一般的实践知识。如果您需要更多关于安装和使用
    PHP 的一般信息，外面有许多很棒的 *入门* 文档。第三，假设您已安装、配置并运行了数据库服务器。


    ### 本书不是什么

    本书不是最佳实践书籍或软件工程入门读物。此处提供的示例在正确的 HTML、错误处理和输出方面大多不完整。示例通常旨在说明用法，因此篇幅较短——侧重于任务，而非完整解决方案。


    ### 安装 PEAR

    根据您的 PHP 版本和计算平台，可能需要一些步骤来安装和配置 PEAR。


    如果您运行的是 4.3 版本之前的 PHP，您可能需要手动安装 PEAR 包管理器。更高版本的 PHP（4.3 及以上）自带 PEAR 包管理器或默认构建包管理器。如果您在
    PHP 配置中添加了 **--without-pear** 标志，您也需要获取 PEAR 包管理器。


    对于 Unix、Linux 和 BSD，您可以使用命令行获取 PEAR 包管理器：


    ```

    lynx -source http://go-pear.org/ | php

    ```


    上述命令行要求您已安装 lynx（在某些 Linux 发行版中它可能称为 links）。同时假设您已构建并安装了 PHP 二进制文件。


    对于 Windows 用户，标准源分发中有一个类似的工具，名为 **go-pear.bat**。


    运行此批处理文件将引导您完成 PEAR 安装过程。此批处理文件非常完整，将执行更新 Windows 系统以使用 PEAR 所需的几乎所有任务。运行批处理文件后唯一需要执行的操作是向
    PATH 环境变量添加条目。


    第一步是找到 **pear.bat** 文件。它位于运行 **go-pear.bat** 批处理文件时您指定的目录中。找到 **pear.bat** 文件后，将其目录添加到
