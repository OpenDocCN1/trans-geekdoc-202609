    \ connection.\n\nThe example uses MySQL as the database backend, but could conceivably\
    \ be any PHP-supported database.\n\nFor the examples, a simple four-table database\
    \ will be used to illustrate a small employee and department data set. The four\
    \ tables are *Employees*, *Paychecks*, *EmployeesToDepartments*, and *Departments*.\
