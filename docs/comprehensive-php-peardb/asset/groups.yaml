    ## 结论


    PEAR::DB 是一个功能强大的面向对象抽象层，由 PHP 核心开发团队成员支持和维护。PEAR::DB 是任何支持数据库的 PHP 应用的正确工具，无论其规模大小。使用
    PEAR::DB 的主要原因是通过代码复用实现快速（或更快速）应用开发和应用可维护性。虽然 PEAR::DB 可以实现数据库可移植性，但大多数中大型应用将会依赖底层数据库，以至于很可能会使用特定于引擎的
    SQL。


    随着 PHP 的成熟，PEAR::DB 也将随之成熟。认真考虑应用长期可维护性的开发者，应该认真考虑将 PEAR::DB 作为其数据库抽象层。


