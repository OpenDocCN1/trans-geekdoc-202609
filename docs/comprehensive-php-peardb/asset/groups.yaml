    \n```\nvoid setFetchMode( integer $fetchmode, string $object_class = null )\n\
    ```\n\nSets which fetch mode should be used by default on queries on this connection.\
    \ Valid values for the fetchmode parameter are\nDB_FETCHMODE_ORDERED,\nDB_FETCHMODE_ASSOC\
    \ (possibly bit-wise OR'ed with DB_FETCHMODE_FLIPPED) and DB_FETCHMODE_OBJECT.\
    \ If fetchmode is DB_FETCHMODE_OBJECT, then object_class specifies the class of\
    \ the object to be returned by the fetch methods. If DB_FETCHMODE_OBJECT is used\
    \ and object_class is null, a default cast to object from the associative array\
    \ will be done.\n\nThe default fetchmode is DB_FETCHMODE_ORDERED. The example\
    \ in Code Listing 21 illustrates this.\n\n```php\n<?php\nrequire_once( 'DB.php'\
    \ );\n$oDB = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n\
    false );\nif ( DB::isConnection( $oDB ) )\n{\n  $sSQL = 'select id, first_name,\
    \ last_name from Employees limit 3';\n  $oRows = $oDB->query( $sSQL );\n  if (\
    \ !DB::isError( $oRows ) )\n  {\n    while ( $aData = $oRows->fetchRow() )\n \
    \   {\n      print( '<pre>' );\n      print_r( $aData );\n      print( '</pre><br><br>'\
    \ );\n    }\n  }\n  $oDB->disconnect();\n}\n?>\n```\n\n### Code Listing 21: DB_common::setFetchMode\
