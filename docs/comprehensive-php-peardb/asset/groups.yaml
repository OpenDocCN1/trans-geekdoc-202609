    \ this method if you hope to have a database-portable implementation. Rather,\
    \ consider the databases that you hope to support and build a pagination or limiting\
    \ solution that will work for your application.\n\nReturns a DB_result object,\
    \ DB_OK or a DB_Error object.\n\n## DB_common::getOne\n\n```php\nmixed getOne(\
    \ string $query, array $params = array() )\n```\n\nThe getOne() method is used\
    \ to return the first column of the first row of data returned for the SQL string,\
    \ query. As with the query() method, if params are specified, query is expected\
    \ to be a parameterized query string.\n\nThis method is useful in cases where\
    \ there is a single value returned by a query such as may be returned from an\
    \ aggregate SQL function. The example in Code Listing 37 shows how to return the\
    \ total number of rows in a table using the getOne() method and the equivalent\
    \ using the query() method.\n\n```php\n<?php\n    require_once( 'DB.php' );\n\n\
    \    $DB = DB::connect(\n        'mysqli://bt_user:bt_pass@207.44.182.3/book_test',\n\
    \        true );\n    if ( DB::isConnection( $DB ) )\n    {\n```\n\nThe sample\
    \ in Code Listing 38 illustrates general use of the **getOne()** method. Lines\
    \ 7 – 12 show basic usage. Lines 14 – 18 illustrate the same but use the **DB_FETCHMODE_ASSOC**\
    \ value. The output (reformatted for readability) is shown in **Output 14**.\n\
    \n```text\narray(6) {\n    [0]=>\n    string(1) \"1\"\n    [1]=>\n    string(11)\
    \ \"Schwendiman\"\n    [2]=>\n    string(5) \"Blake\"\n    [3]=>\n    string(3)\
    \ \"204\"\n    [4]=>\n    string(1) \"2\"\n    [5]=>\n    string(1) \"1\"\n}\n\
    array(6) {\n    [\"id\"]=>\n    string(1) \"1\"\n    [\"last_name\"]=>\n    string(11)\
    \ \"Schwendiman\"\n    [\"first_name\"]=>\n    string(5) \"Blake\"\n    [\"phone_ext\"\
    ]=>\n    string(3) \"204\"\n    [\"mgr_id\"]=>\n    string(1) \"2\"\n    [\"dept_id\"\
    ]=>\n    string(1) \"1\"\n}\n```\n\n**Output 14:** Output of the getRow() method.\n\
    \n- Returns a DB_Error object, DB_OK or the returned value of the query.\n\n##\
    \ DB_common::getCol\n\n```php\narray getCol( string $query, mixed $col = 0, array\
    \ $params = array() )\n```\n\nThis method is similar in concept to the **getRow()**\
    \ method. The **getCol()** method returns the values in the column specified by\
    \ *col* for all rows of the result set obtained from the query string, _query_.\
    \ As with the **query()** method, if _params_ is an array, it is assumed that\
    \ _query_ is a parameterized query, and _params_ are the actual parameters to\
    \ use in a prepare/execute query.\n\nThe **getCol()** method does not use a _fetchmode_\
    \ parameter and it does not respect the internal fetchmode set by **setFetchMode()**.\
    \ If the value of _col_ is an integer, **getCol()** uses **DB_FETCHMODE_ORDERED**\
    \ internally. If _col_ is a string (column name) then **DB_FETCHMODE_ASSOC** is\
    \ used internally.\n\n```php\n<?php\n    require_once( 'DB.php' );\n\n    $oDB\
    \ = DB::connect(\n    'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n    true\
    \ );\n    if ( DB::isConnection( $oDB ) )\n    {\n        $aSQL    = \"select\
    \ * from Employees limit 5\";\n        $aValue  = $oDB->getCol( $aSQL, 'first_name'\
    \ );\n        if ( !DB::isError( $aValue ) )\n        {\n            var_dump(\
    \ $aValue );\n        }\n\n        $aValue = $oDB->getCol( $aSQL, 1 );\n     \
    \   if ( !DB::isError( $aValue ) )\n        {\n            var_dump( $aValue );\n\
    \        }\n\n        $oDB->disconnect();\n    }\n?>\n```\n\n### Code Listing\
    \ 39: Using getCol().\n\nThe example in Code Listing 39 shows general use of the\
    \ **getCol()** method. Line 10 illustrates making the call with a string column\
    \ name, while line 16 shows its use with an integer column index (column 1 is\
    \ the _last_name_ column in this table). The output of the example code (reformatted\
    \ for readability) is shown in Output 15.\n\n```text\narray(5) {\n    [0]=>\n\
    \    string(5) \"Blake\"\n    [1]=>\n    string(7) \"Jeffrey\"\n    [2]=>\n  \
    \  string(4) \"Kate\"\n    [3]=>\n    string(4) \"Ryan\"\n    [4]=>\n    string(4)\
    \ \"Ryan\"\n}\narray(5) {\n    [0]=>\n    string(11) \"Schwendiman\"\n    [1]=>\n\
    \    string(3) \"Cox\"\n    [2]=>\n    string(7) \"McNulty\"\n    [3]=>\n    string(11)\
    \ \"Schwendiman\"\n    [4]=>\n    string(11) \"Schwendiman\"\n}\n```\n\n**Output\
    \ 15: Output of the getCol() method.**\n\n- Returns an indexed array with the\
    \ data from the column specified by the *col* parameter or DB_Error.\n\n## DB_common::getAssoc\n\
    \n```php\narray getAssoc( string $query, boolean\n    $force_array = false, array\
    \ $params = array(),\n    integer $fetchmode = DB_FETCHMODE_DEFAULT,\n    boolean\
    \ $group = false )\n```\n\nThe **getAssoc()** method returns the entire result\
    \ set of a query as an associative array using the first column as the array key.\
    \ If the result set contains more than two columns, the value of each element\
    \ in the return array will be an array of values from columns 2 through *n*. If\
    \ the result set contains only 2 columns, the value of each element in the return\
    \ array will be a scalar value unless the *force_array* parameter is true. If\
    \ the result set contains less than two columns, a DB_ERROR_TRUNCATED error is\
    \ returned.\n\n```text\n[0] =>\n    string(7) \"McNulty\"\n[1] =>\n    string(4)\
    \ \"Kate\"\n[2] =>\n    string(3) \"214\"\n[3] =>\n    string(1) \"2\"\n[4] =>\n\
    \    string(1) \"2\"\n```\n\nOutput 16: Output of getAssoc() related to Code Listing\
    \ 40.\n\nNote that the **array** shown in Output 16 is an associative array where\
    \ the key is the *id* field of each row of the result set and the values are the\
    \ other fields of the result set.\n\nThe *fetchmode* parameter can be specified\
    \ to override any global setting made using **setFetchMode()**.\n\nI prefer to\
    \ use the **setFetchMode()** method, so the example in Code Listing 41 shows this.\
    \ The output from this change is shown in Output 17.\n\n```php\n<?php\n    require_once\
    \ ('DB.php');\n\n    $oDB = DB::connect(\n    'mysql://bt_user:bt_pass@207.44.182.3/book_test',\n\
    \    true );\n    if ( DB::isConnection( $oDB ) )\n    {\n        $oDB->setFetchMode(\
    \ DB_FETCHMODE_ASSOC );\n\n        $aSQL   = \"select * from Employees limit 3\"\
    ;\n        $aValue = $oDB->getAssoc( $aSQL );\n        if ( ! DB::isError( $aValue\
    \ ) )\n        {\n            print( '<pre>' );\n            var_dump( $aValue\
    \ );\n            print( '</pre>' );\n        }\n\n        $oDB->disconnect();\n\
    \    }\n?>\n```\n\n### Code Listing 41: Using getAssoc() – Example with setFetchMode().\n\
    \n```text\narray(3) {\n  [1]=>\n  array(5) {\n    [\"last_name\"]=>\n    string(11)\
    \ \"Schwendiman\"\n    [\"first_name\"]=>\n    string(5) \"Blake\"\n    [\"phone_ext\"\
    ]=>\n    string(3) \"204\"\n    [\"mgr_id\"]=>\n    string(1) \"2\"\n    [\"dept_id\"\
    ]=>\n    string(1) \"1\"\n  }\n  [2]=>\n  array(5) {\n    [\"last_name\"]=>\n\
    \    string(3) \"Cox\"\n    [\"first_name\"]=>\n    string(7) \"Jeffrey\"\n  \
    \  [\"phone_ext\"]=>\n    string(3) \"225\"\n    [\"mgr_id\"]=>\n    string(1)\
    \ \"0\"\n    [\"dept_id\"]=>\n    string(1) \"1\"\n  }\n  [3]=>\n  array(5) {\n\
    \    [\"last_name\"]=>\n    string(7) \"McNulty\"\n    [\"first_name\"]=>\n  \
    \  string(4) \"Kate\"\n    [\"phone_ext\"]=>\n    string(3) \"214\"\n    [\"mgr_id\"\
    ]=>\n    string(1) \"2\"\n    [\"dept_id\"]=>\n    string(1) \"2\"\n  }\n}\n```\n\
    \nOutput 17: Output of getAssoc() related to Code Listing 41.\n\nTo illustrate\
    \ the *force_array* parameter, a query returning only two columns is required.\
    \ The example in Code Listing 42 shows this.\n\n```php\n<?php\n    require_once('DB.php');\n\
    \n$oDB = DB::connect(\n'mysql://bt_user:bt_pass@207.44.182.3/book_test',\ntrue\
    \ );\nif ( DB::isConnection( $oDB ) )\n{\n$oDB->setFetchMode( DB_FETCHMODE_ASSOC\
    \ );\n\n$aSQL = \"select id, last_name from Employees\nlimit 3\";\n$aValue = $oDB->getAssoc(\
    \ $aSQL );\nif ( !DB::isError( $aValue ) )\n{\nprint( '<pre>' );\nvar_dump( $aValue\
    \ );\nprint( '</pre>' );\n}\n\n$oDB->disconnect();\n}\n?>\n```\n\n### Code Listing\
    \ 42: Using getAssoc() – Illustrating *force_array* parameter (set to *false*).\n\
    \nAs can be seen in the output, Output 18, the default behavior of **getAssoc()**\
    \ when there are only two columns in the result set, the resulting array is indexed\
    \ by the first column and the second column contains atomic values.\n\n```text\n\
    array(3) {\n[1]=>\nstring(11) \"Schwendiman\"\n[2]=>\nstring(3) \"Cox\"\n[3]=>\n\
    string(7) \"McNulty\"\n}\n```\n\nOutput 18: Output of getAssoc() related to Code\
    \ Listing 42.\n\nThe advantage of using the *force_array* parameter is that you\
    \ can write more generic code to handle the result array, rather than have special\
    \ case code for a result array containing values that are arrays and other code\
    \ for a result array containing values that are atomic.\n"
