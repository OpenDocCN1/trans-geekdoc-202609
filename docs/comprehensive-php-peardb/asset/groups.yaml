    # # PEAR and Databases


    # ## *Motivation for this Document*


    PEAR is about code reuse. That’s the primary motivation for this document. If
    you’re a PHP programmer and you’ve developed any database projects, PEAR::DB is
    for you. Over the lifetime of PHP there have been several great database abstractions
    developed, some OO, some not. PEAR::DB is the standard object oriented database
    abstraction.


    As PHP continues to evolve and grow in its user base, more and more developers
    will be hired to maintain and modify existing code. By standardizing on PEAR,
    maintenance and upgrades will focus on business-specific code and not general-purpose
    code such as database access.


    # ## *Getting Started*


    This book assumes a great deal about you as a programmer. First, you must have
    PHP installed and running on your web server. Second, this book assumes that you
    have a general working knowledge of PHP. There are many fantastic *getting started*
    documents available out there if you need more information about installing and
    using PHP in general. Third, it is assumed that you have a database server installed,
    configured and running.'
  - '[PAGE 11]


    # ## What This Book is Not


    This book is not a best practices book or a software engineering primer. Most
    of the examples provided herein are incomplete in terms of proper HTML, error
    handling and output. The examples are typically intended to illustrate usage and
    are therefore short — focusing on tasks, not complete solutions.


    # ## Installing PEAR


    Depending on your PHP version and your computing platform, there may be some steps
    needed to install and configure PEAR.


    If you are running a version of PHP prior to version 4.3, you will likely need
    to manually install the PEAR package manager. Later versions of PHP (4.3 and higher)
    come with the PEAR package manager or the package manager is built be default.
    If you added the **--without-pear** flag to your configuration of PHP, you will
    also need to get the PEAR package manager.


    For Unix, Linux and BSD you can obtain the PEAR package manager using the command
    line:


    ```

    lynx -source http://go-pear.org/ | php

    ```


    The above command line requires that you have lynx installed (it may be called
    links on some Linux distributions). It is also assumed that you have your PHP
    binary built and installed.


    For Windows users, there is a similar tool in the standard source distribution
    called **go-pear.bat**.'
  - '[PAGE 12]


    Running this batch file will walk you through the PEAR installation process. This
    batch file is very complete and will perform almost all of the necessary tasks
    of updating your Windows system to use PEAR. The only step required after running
    the batch file is to add to the PATH environment variable.


    The first step is to locate the **pear.bat** file. It will be located in the directory
    you specified when running the **go-pear.bat** batch file. After locating the
    **pear.bat** file, add its directory to the PATH environment variable in Windows.
    This is done by right-clicking the *My Computer* icon. Select *Properties* from
    the context menu, and then click the *Advanced* tab. A screen shot (Windows XP)
    is shown below in Figure 1.'
  - '[PAGE 13]


    ![](img/73cfc83029178a27381cd5f89348f7bf_13_0.png)


