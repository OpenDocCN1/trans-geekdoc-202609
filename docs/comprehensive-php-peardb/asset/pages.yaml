    \n```\nmixed limitQuery( string $query, integer $from,\n    integer $count, array\
    \ $params = array() )\n```\n\nThe **limitQuery()** method generates a limited\
    \ query. The most important note for this method is that it is an experimental\
    \ method and is not currently supported by all database back ends. The database\
    \ types fully supporting the **limitQuery()** method are *ibase*, *mysql*, *oci8*,\
    \ *pgsql* and *sqlite*.\n\nThe concept of the **limitQuery()** method is to modify\
    \ a SQL statement so that its effect is limited to a certain number of data rows.\
    \ An example (using the MySQL SQL syntax) is shown in Code Listing 35.\n\n```\n\
    select * from Employees\nselect * from Employees limit 5, 5\n```\n\n**Code Listing\
    \ 35: Limiting a MySQL query using SQL.**\n\nIn line 1 of Code Listing 35, the\
    \ unlimited query is shown. The result of that query is to return all matching\
    \ rows (or all rows in this case). The statement in line 2 of Code Listing 35\
    \ illustrates the MySQL syntax for limiting the query to return just 5 data rows,\
    \ starting from the 6ᵗʰ row in the database (index is zero-based for MySQL)."
