    # DB_common::executeEmulateQuery


    mixed executeEmulateQuery( resource $stmt, array $data )


    The executeEmulateQuery() method is technically a private method intended to be
    used internally by the class. Its function is to convert a parameterized query
    and its related data into a fully-qualified SQL string. This method is used only
    by database objects whose back-end server does not natively support the prepare/execute
    methodology.


    Since PHP 4 doesn’t actually support private methods, the example in Code Listing
    32 shows what the results of the executeEmulateQuery() are internally. Note, you
    should not rely on the existence of this method as PHP 5 will support truly private
    class methods and properties.


