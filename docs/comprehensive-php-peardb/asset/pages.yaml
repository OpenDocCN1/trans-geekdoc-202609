    # Class DB_result


    The class DB_result provides methods for working with the results generated by
    queries on a database. DB_result objects are not likely to be created by your
    applications directly.


    | Method | Description |

    |---|---|

    | setOption() | Sets options on the DB_result object. |

    | fetchRow() | Fetch and return a row of data. Uses fetchInto internally. |

    | fetchInto() | Fetch a row of data into an existing variable. |

    | numCols() | Returns the number of columns in a result set. |

    | numRows() | Returns the number of rows in a result set. |

    | nextResult() | Returns the next result if a batch of queries was executed. |

    | free() | Free the resources allocated for this result set. |

    | tableInfo() | Returns metadata about the result set. |

    | getRowCounter() | Returns the actual row number. |


