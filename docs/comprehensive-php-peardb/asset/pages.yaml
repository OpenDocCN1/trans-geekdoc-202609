- pgno: 47
  md: 'Class **DB_common** is the parent class of all of the database-server specific
    classes. The purpose of **DB_common** is to provide a common interface definition
    for all the concrete implementation classes. **DB_common** can be thought of,
    in a way, as an abstract base class since many of the methods defined in **DB_common**
    do nothing but return an error.


    The methods described in this section are the common methods available to all
    database server classes.


    | Method | Description |

    |---|---|

    | `toString()` | String conversion. This method provides a string representation
    of the DB_common object. |

    | `quoteString()` | Quotes a string so it can be safely used within string delimiters
    in a query (preserved for compatibility issues, `quote()` is preferred). |

    | `quote()` | Preferred method for quoting a string for safe use within queries.
    |

    | `provides()` | Tell whether a DB implementation or its backend extension supports
    a given feature. |

    | `errorCode()` | Map native error codes to portable PEAR::DB codes. |

    | `errorMessage()` | Map a DB error code to a textual message. This is actually
    just a wrapper |'
