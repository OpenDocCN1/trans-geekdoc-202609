  md: 'Several factors are assumed in the example script. First, it is assumed that
    the database is running and PHP is configured with the appropriate code/drivers
    to access the database. Second, it is assumed that the user specified in the DSN
    has appropriate database privileges to perform the tasks in the script. Third,
    it is assumed that a database called *book_test* exists on the target database
    server. This section of the book is intended to primarily provide very high-level
    information about each of the supported databases and not to be a primer on installing
    and configuring each database. As appropriate, I may mention some interesting
    configuration or setup information identified in my testing. For the most part,
    this book was developed running PHP on Windows, so little of the database-specific
    information will be based on Linux (or other unix-like) operating systems.


    The test program is divided into three files. The first file is the main script
    shown in Code Listing 66. The second file is the included file, *err_popup.php*
    which is just the functions from the example shown in Code Listing 20 on page
    52. These functions popup a separate browser window and display the DB_Error object
    information. The third file (*db_specific.php*) is a set of database specific
    strings shown in Code Listing 67.


    It should be obvious to any reader that not all SQL servers provide the same features
    or even the same syntax for SQL statements. The *db_specific.php* file contains
    those SQL statements that create the *Employees* table since table creation is
    typically very different between database servers. Other information stored in
    the *db_specific.php* file includes the DSN information and the full name of the
    database server for display.'
