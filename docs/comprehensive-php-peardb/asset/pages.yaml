- pgno: 157
  md: 'am left to make some assumptions about the general state of the project.


    My suggestion to a PHP developer looking for a small database backend is to check
    out SQLite. I had no problems setting it up and there were no problems with the
    PEAR::DB test code.


    # Microsoft SQL Server


    Microsoft SQL Server is extremely simple to set up in a Windows-based PHP install.
    For testing, I simply installed the latest PHP binaries available from the PHP
    web site. After configuring PHP at the most basic level to begin testing, it is
    necessary to load the MS SQL extension by editing the *php.ini* file.


    Simply remove the semicolon comment character preceding the line *extension=php_mssql.dll*
    in the configuration file and it works.


    Configuration of non-Windows PHP for use with a MS SQL database is slightly more
    complicated, but still possible. See **http://www.php.net/mssql** for setup instructions.


    Once running, PHP works great with MS SQL server and the PEAR::DB implementation
    is very complete. The test script works perfectly for MS SQL server as tested
    against MS SQL Server 2000 (version 8.00.760 SP3).


    # Oracle 7/8/8i'
