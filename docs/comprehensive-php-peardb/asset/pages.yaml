    # Connect


    Establishing a connection to any supported database is most easily accomplished
    using **DB::connect()**. There are two parameters: the connect DSN and a mixed
    value containing either a Boolean value or an array of values – this will be discussed
    further in this section. The return value of a call to **DB::connect()** is either
    a valid instance of a database class or an error or warning object. To check for
    errors and warnings, use the **DB::isError()** and **DB::isWarning()** class methods.
    To disconnect from the database, use the **disconnect()** method of the database
    object that is returned.


    The second parameter to **DB::connect()** is important to understand, because
    it controls database specific options. Each database class type contains a **setOption()**
    method that is used to set various database specific optional values. The parent
    class of all the database classes, DB_common, defines the options shown in by
    default.'
