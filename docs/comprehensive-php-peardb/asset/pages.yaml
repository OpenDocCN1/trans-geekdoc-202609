  md: '# PEAR::DB In Depth


    This section is the detailed reference section intended to provide the in-depth
    coverage of PEAR::DB and its classes.


    # Introduction


    Before detailing the classes themselves, it is important to gain a high-level
    perspective of some of the concepts of using PEAR::DB. These concepts include
    the Data Source Name (DSN) and generally the methods need to connect to databases
    and retrieve or modify data. Another high-level concept covered in this section
    is sequences.


    # DSN


    To connect to a database using PEAR::DB, you must first create a valid Data Source
    Name (DSN). For Windows users, it is important to distinguish between a PEAR::DB
    DSN and an ODBC DSN. An ODBC DSN may be used with a PEAR::DB DSN, but for most
    database types, the PEAR::DB DSN has nothing at all to do with an ODBC DSN. For
    details about using an ODBC database with PEAR::DB, see the ODBC section in the
    detailed examples starting on page 134.


    A PEAR::DB DSN is formatted after the fashion of a Universal Resource Identifier.
    The format, in its fullest form is shown below in Code Listing 6.


    ```

    ```text

    phptype(dbsyntax)://username:password@protocol+host

    spec/database

    ```

    ```'
  merge: -1
  img_proc: true
