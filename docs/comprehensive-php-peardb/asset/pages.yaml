- pgno: 160
  md: '`php_fsql.dll` and configure PHP via the `php.ini` file to use FrontBase. The
    general PEAR::DB test script ran without any trouble the first time it was tried.


    Considering that I have had no previous experience with FrontBase, this is very
    encouraging. If you are considering using FrontBase with your PHP application,
    there are a development licenses available so you can test your application before
    making the financial commitment to deploy.


    # ## SQLite


    SQLite is an interesting database engine that will be shipping (according to recent
    online sources) with PHP by default starting in version 5 of PHP. SQLite is a
    file-based database engine that is (as its name implies) very lightweight. The
    DSN specification is something like:


    ```

    sqlite:///c:/temp/PEAR/sqlite_employees.dat

    ```


    The above DSN works on Windows, but it can be simply adapted for use on other
    operating systems by simply updating the path format appropriately.


    Installing SQLite on a Windows-based PHP is a snap. Simply download the `php_sqlite.dll`
    file available from **http://www.php.net/sqlite** and then download the actual
    SQLite engine DLL (`sqlite.dll`) from the SQLite web site at **http://www.sqlite.org/**.
    Place the `sqlite.dll` file in the search path of Windows (such as the `system32`
    directory), then copy `php_sqlite.dll` to your PHP extensions directory. Then
    enable SQLite by adding `extension=php_sqlite.dll` to your `php.ini` file.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The test script runs without any errors or warnings.\nThere is, however, a
    single notice generated:


    ```

    Notice: Undefined index: mode in C:\\temp\\PEAR\\php-4.3.4-Win32\\pear\\DB\\sqlite.php
    on line 185

    ```


    This warning is based on the fact that for some reason, the SQLite database object
    expects the parsed DSN to have a member called *mode* which does not exist. Perhaps
    this will be added in a future version of PEAR::DB. In any case, this notice will
    not be displayed if you are running in a typically configured environment. However,
    if you are running SQLite on a unix-like operating system, the *mode* value specifies
    the file mode (e.g. 0644) which you may wish to specify. If you do, you will need
    to edit the DB_sqlite implementation or use an array-based DSN and provide the
    *mode* key directly.


    The SQLite support in PEAR::DB is surprisingly complete for such a new database
    (from the PHP perspective). Using SQLite may be preferred in restricted hosting
    environments or in situations where a full database backend is not required. The
    overhead of SQLite is very small and the SQL language support is very complete.


    # dBase


    dBase support in PEAR::DB is extremely limited. The example code will not work
    with dbase because so little of the interface is truly supported. After looking
    a bit on the PHP web site, even dBase itself is not fully supported:


    There is no support for indexes or memo fields. There is no support for locking,
    too. Two concurrent'
  merge: -1
