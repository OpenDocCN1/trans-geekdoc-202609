    # MySQL


    MySQL is likely to be the most commonly-used database for PHP programmers. All
    versions of PHP 4 enable built-in support for MySQL databases. For either the
    Windows or unix-like platforms, MySQL support is typically on by default.


    The DSN format for MySQL is illustrated in most of the examples in this book.
    The most common DSN format for a MySQL database is likely to be:


    ```

    phptype://username:password@hostspec/database_name

    ```


    The *hostspec* portion can contain just a hostname or IP address, or a *host:port*
    formatted host specification.


    The general test script shown above worked without any problems for my MySQL installation
    (*MySQL 4.0.15-Max*).'
