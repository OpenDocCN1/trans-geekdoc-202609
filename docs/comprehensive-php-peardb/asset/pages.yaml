- pgno: 163
  md: '# Conclusion


    PEAR::DB is a powerful, object-oriented abstraction layer that is supported and
    maintained by members of the core PHP development team. PEAR::DB is the right
    tool for any database-enabled PHP application, no matter its size. The primary
    reasons to use PEAR::DB are to enable rapid (or more rapid) application development
    and application maintainability through code reuse. While PEAR::DB can enable
    database portability, most medium to large applications will rely on the underlying
    database to the point that engine-specific SQL will likely be used.


    As PHP matures, so will PEAR::DB. Developers serious about maintainability of
    their applications over the long-term should seriously consider PEAR::DB as their
    database abstraction layer.'
  merge: -1
  img_proc: true
