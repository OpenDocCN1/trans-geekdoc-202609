  md: 'Next, in lines 103 – 132, the current list of tables in the database is retrieved
    and displayed. If a table exists with the name *Employees*, it is dropped.


    Next, the *Employees* table is created using the database-specific creation SQL
    statements in lines 134 – 144. Rows of data are then added to the table in lines
    146 – 156.


    On line 158, the **DoSelectQueries()** function is called. The **DoSelectQueries()**
    function is internal to this script and does some interesting work. The source
    for the function is listed in lines 74 – 93. For each of the SQL queries in the
    *$aSelectQueries* array, the query is execute and the result (if not an error)
    is passed to the **DisplayResults()** function. The **DisplayResults()** function
    displays the number of rows in the result set, then if the number of rows is more
    than 0, it loops through the results using the **fetchRow()** method. On the first
    iteration of the loop, the **DisplayHeader()** function is called which displays
    the column names of the result set in an HTML table. This is a nice workaround
    to the problem that not all database back ends provide an implementation of the
    **tableInfo()** method. Then the data itself is displayed as the **fetchRow()**
    loop continues.


    After the initial data is populated and displayed, the script then runs a set
    of update queries in lines 160 – 169. The **DoSelectQueries()** function is called
    again to display the data in the table.


    Finally, the script runs a set of delete queries in lines 173 – 182 and the results
    are again displayed.


