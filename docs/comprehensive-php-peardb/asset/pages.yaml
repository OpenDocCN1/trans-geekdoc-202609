    # Code Listing 19: DB_common::errorCode, DB_common::errorMessage, DB_common::errorNative()
    Example


    The example in Code Listing 19 illustrates usage of the **errorCode()** method.
    For some types of error handling, the PEAR::DB error code or the native database
    error code may provide valuable information. For example, you may want to test
    if the current user has some type of permissions. By checking the actual error
    codes, the program can continue providing the right user experience.


    For many error conditions, however, the DB_Error object returned by most PEAR::DB
    methods provides the right level of detail such that the error codes are simply
    redundant information.


