- pgno: 17
  md: '# Installing PEAR::DB


    If you do not have the DB package installed, using the following command to install
    DB:


    ```

    ```bash

    pear install DB

    ```

    ```


    If you do not have the most current version of DB or if you need to check for
    an upgrade and install it, use:


    ```

    ```bash

    pear upgrade DB

    ```

    ```


    Note that the above will cause an upgrade to be installed if one exists. If you
    simply wish to check for upgrades, use the **pear list-all** or **pear list-upgrades**
    commands.


    For the purposes of this document, it will be assumed that the version of PEAR::DB
    is 1.5.0RC2.


    # Overview of PEAR::DB


    To begin, this section illustrates the core concepts of PEAR::DB by providing
    a comparison of procedural database access in PHP and OO database access using
    PEAR::DB.


    # Procedural DB Access vs. PEAR::DB


    This section shows the similarities and the differences between using procedural
    database access and PEAR::DB. The example is deliberately simple, showing how
    to establish a database connection, retrieve a small recordset and close the connection.'
  merge: -1
  img_proc: true
- pgno: 18
  md: "The example uses MySQL as the database backend, but could conceivably be any\
    \ PHP-supported database.\n\nFor the examples, a simple four-table database will\
    \ be used to illustrate a small employee and department data set. The four tables\
    \ are *Employees*, *Paychecks*, *EmployeesToDepartments*, and *Departments*. The\
    \ MySQL queries to create and populate the tables are shown below in Code Listing\
    \ 1.\n\n```\n```sql\n#\n# Table structure for table `Departments`\n#\n\nCREATE\
    \ TABLE `Departments` (\n  `id` int(11) NOT NULL default '0',\n  `name` varchar(50)\
    \ NOT NULL default '',\n  PRIMARY KEY (`id`)\n) TYPE=MyISAM;\n\n#\n# Dumping data\
    \ for table `Departments`\n#\n\nINSERT INTO `Departments` VALUES (1, 'Web Development');\n\
    INSERT INTO `Departments` VALUES (2, 'QA');\n\n# --------------------------------------------------------\n\
    #\n# Table structure for table `Employees`\n#\n\nCREATE TABLE `Employees` (\n\
    \  `id` int(11) NOT NULL default '0',\n  `last_name` varchar(50) NOT NULL default\
    \ '',\n  `first_name` varchar(50) NOT NULL default '',\n  `phone_ext` varchar(5)\
    \ NOT NULL default '',\n  `mgr_id` int(11) NOT NULL default '0',\n  `dept_id`\
    \ int(11) NOT NULL default '0',\n  PRIMARY KEY (`id`),\n  KEY `mgr_id` (`mgr_id`),\n\
    \  KEY `dept_id` (`dept_id`)\n) TYPE=InnoDB;\n\n#\n# Dumping data for table `Employees`\n\
    #\n\nINSERT INTO `Employees` VALUES (1, 'Schwendiman', 'Blake', '204', 2, 1);\n\
    ```\n```"
