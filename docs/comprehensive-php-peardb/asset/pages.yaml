  md: 'This method is used to communicate an error and invoke error callbacks etc.
    It is basically a wrapper for PEAR::raiseError without the message string.


    The **raiseError()** method is mostly used internally, but you may wish to use
    it in your programs. For more information about this method, investigate the PEAR::raiseError
    method.


    The *code* parameter is an integer error code or a PEAR error object. If an object,
    all other parameters are ignored. The *mode* and *options* parameters are specific
    to the PEAR::raiseError implementation and are not discussed here. The *userinfo*
    and *native* parameters are used to represent the database specific error message
    and native error code, respectively.


    +   - Returns a PEAR error object.


    Most of the examples in this book show generally how to use the **DB_Error** object
    as it is returned. In most production environments, only the very basic information
    about failures will likely be displayed. However, for development, it is handy
    to have detailed information displayed in the event of an error.


