  md: '# DB_result::setOption


    ```

    `void setOption( string $key, mixed $value = null )`

    ```


    The **setOption()** method sets the option specified by _key_ to the value specified
    by _value_. There are two options that can be set, ‘limit_from’ and ‘limit_count’,
    both of which are integer values. These options are used internally by the fetch
    functions and may be dependant on the back end database. In my tests with the
    _odbc_ and _mysql_ databases, I found that the ‘limit_from’ option only works
    correctly with _odbc_.


    > As the usefulness of these options is questionable, I recommend thorough testing
    of any application that makes use of these options and recommend that you avoid
    these options if the goal of your application is database portability.


    Returns nothing.


    # DB_result::fetchRow


    ```

    `mixed fetchRow( int $fetchmode = DB_FETCHMODE_DEFAULT, int $rownm = NULL )`

    ```


    The **fetchRow()** method is the primary method used to actually retrieve a row
    of data into a result variable. Internally the **fetchRow()** method calls **fetchInto()**
    to perform the actual database-level data retrieval.


    The _fetchmode_ parameter is one of the pre-defined values: DB_FETCHMODE_ORDERED,
    DB_FETCHMODE_ASSOC or DB_FETCHMODE_OBJECT. Details about the _fetchmode_ parameter
    can be found in the documentation of **DB_common::setFetchmode()**'
