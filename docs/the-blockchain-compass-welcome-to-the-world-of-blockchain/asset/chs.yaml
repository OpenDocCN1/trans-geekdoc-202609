- "## 区块链指南针：欢迎来到区块链世界\n\n\n\n## 简介\n\n我们一生都在使用一种在完全**中心化环境**中运作的全球数据结构模型。该系统灵活性极低，且始终处于公私部门少数个人的控制与监督之下，各利益相关方之间仅有少数主动协作。但随着许多能够改变我们毕生所知的中心化模型的技术倡议的出现，这一局面正在迅速改变。\n\
  \n\n\n\n\n## 分布式账本技术与区块链\n\n分布式账本技术，尤其是区块链技术，能够挑战那些曾被视为*“不可触碰”*的法规，并为每个人带来令人惊叹的益处。你是否曾发现自己在思考如下问题：\n\
  \n- 区块链技术正如某些人所描绘的那样是个骗局，还是说它能解决世界上所有的问题？\n- 如果我们距离从中心化、僵化、陈旧的系统向全新的、完全协作的去中心化模式发生剧烈转变，仅有一步之遥，会怎样？\n\
  - 是否有可能拥有一种新的去中心化模式，确保所有交易的透明性、安全性与防篡改性？\n- 你是否在好奇为何众多全球性公司正在不断加大对区块链技术的投资？\n\n\
  好吧，本文将为你解答这些问题以及其他更多疑问！\n\n你极有可能听说过区块链技术几乎能解决我们在社会和环境中面临的每一个挑战。围绕分布式账本或区块链技术，无疑存在着过多的炒作。促使我撰写本文的因素之一，就是要提供尽可能真实、可靠的内容。因此，以下是你将在本文中发现的一些内容：\n\
  \n- 你将准确理解区块链的含义、历史及发展阶段。\n- 许多人常认为比特币等加密货币与区块链是一回事，因此你将学习二者的区别。\n- 区块链的应用案例日益增多，你将发现该技术以惊人的方式助力我们现有的系统。\n\
  - 我们还将展望该技术的潜力及区块链领域的未来趋势。\n- 正如其他任何技术一样，区块链也面临挑战，本文将揭示其中一些挑战，以及为解决这些*“成长的烦恼”*所做的努力。\n\
  - 区块链的一个有潜力改变各个领域的方面是智能合约，你将发现这项技术带来的可能性。\n\n当然，区块链技术并非一些作者所宣称的那样神奇。如果你正在寻找关于区块链的信息，不想要炒作，而是基于该领域已发生的实际事件，以及不同领域专家做出的合理预测，那么这本书正是你一直在寻找的。你准备好迎接去中心化的世界了吗？这是你的指南针！让我们开始吧！\n\
  \n# 第一部分：区块链技术的发现与发展\n\n![Image](img/Image00001.jpg)\n\n## 第一章：一切是如何开始的：区块链技术的历史\n\
  \n我们在 21 世纪见证的最重大创新之一，便是区块链技术的出现。在短短时间内，它已在不同领域——金融行业、商业、教育、供应链管理等——产生了涟漪效应。然而，鲜有人知区块链技术早在\
  \ 1990 年代就已被识别。每一位区块链的追随者和爱好者都有必要了解区块链的历史。早在 1991 年，两位学者 Stuart Haber 和 W. Scott\
  \ Stornetta 便构想了我们现在所认为的区块链。\n\n他们的首个项目是一个由密码学保护的区块链，旨在确保没有任何个人或团体能够篡改文档的时间戳。有趣的是，他们在\
  \ 1992 年更进一步，通过引入默克尔树升级了他们的系统。这提高了效率，并允许将更多文档添加到一个区块中。这是区块链技术中大多数人（包括区块链爱好者）鲜为人知的一个方面。通读全书，你将不断遇到数字账本技术、节点、分布式账本技术等术语，随着阅读深入，你将了解它们的含义。我将交替使用“区块链”和“数字账本技术”这两个术语。\n\
  \n### Hal Finney 与可重复使用的工作量证明\n\n在学习区块链和加密货币的过程中，你将经常遇到的一个名字是 Harold Thomas Finney\
  \ II，通称 Hal Finney。2004 年，他推出了一种名为`Reusable Proof of Work (RPoW)`的系统，该系统通过接收一种不可交换或非同质化的基于\
  \ Hashcash 的工作量证明代币，并作为回报生成一种人们可以在彼此间转移的 RSA 签名代币来运作。\n\n早期数字货币面临的问题之一是双重支付问题，而`RPoW`通过在一个注册且受信的服务器上维护代币所有权记录，简单地解决了这一问题。该服务器的设计允许全球用户轻松验证记录的完整性和准确性。这被许多人视为现有加密货币的早期原型，也是帮助中本聪构建比特币区块链的概念之一。\n\
  \n然而，区块链的普及始于 2008 年，当时一个名为中本聪的个人或团体推出了比特币。目前，我们公认中本聪是区块链技术的缔造者，因为他们推出了比特币，这也是该技术的首个主要应用。在\
  \ 2008 年构想出第一个区块链后，事态发展迅速，其他人开始探索*“该技术在加密货币之外的杰出应用。”*\n\n中本聪并未长久地处于聚光灯下，而是将比特币的开发工作移交给其他开发者并退出了视线。此后，数字账本技术不断演进，现在已有许多属于该技术历史的应用。因此，我们可以从技术上说，区块链诞生于\
  \ 1991 年，并因中本聪于 2008 年创建比特币而普及。\n\n在深入探讨区块链发展的各个阶段之前，我需要指出，随着阅读深入，你将看到“bitcoin”一词的两种版本。一种为小写，另一种为大写。它们含义不同。我指的是`Bitcoin`区块链和使用`Bitcoin`区块链的`bitcoin`加密货币。我想你现在明白了。此外，`Ethereum`指代`Ethereum`区块链，而`ether`是`Ethereum`区块链的原生加密货币。\n\
  \n### 区块链演进的阶段\n\n#### 第一阶段：中本聪与区块链\n\n对许多人来说，比特币和区块链只是同一回事，但这并不正确。事实是，区块链仅仅是基础，或我们可以称之为多种应用的底层技术。比特币等加密货币仅仅是由区块链技术驱动的应用之一。我想你现在明白了！\n\
  \n当中本聪发布那份如今被称为比特币白皮书的文档时，他解释说该技术是一种电子点对点系统。此外，中本聪还创建了第一个被称为*“创世”*区块的区块，它也作为后续挖掘出的其他区块的基础。比特币的出现为新应用打开了大门，其中大多数开始探索利用区块链的原则和能力的方法。我们可以认为，区块链的历史涉及利用数字账本技术演进而来的各种应用的创建。\n\
  \n#### 区块链演进的第二阶段：智能合约\n\n\n\n\n\n# 区块链历史与智能合约\n\n我们将在第 5 章详细探讨智能合约，但简要谈论智能合约至关重要，因为它们构成了区块链历史的主要部分。创新在我们的世界中每天都在发生，而在数字账本技术历史上产生巨大影响的人之一是\
  \ Vitalik Buterin（维塔利克·布特林）。他是一群开发者中的一员，这些开发者认为比特币尚未发挥其全部潜力，特别是在利用数字账本技术能力方面。\n\n\
  比特币的局限性是促使 Buterin 专注于创建一种区块链的主要因素之一，这种区块链除了作为点对点网络外，还能执行除加密货币以外的其他功能。这促成了 2013\
  \ 年以太坊区块链的诞生，它更进一步增加了其他功能。这一发展成为了区块链历史的转折点。有了以太坊区块链，人们现在可以做其他事情，比如记录其他资产和合约，这与比特币主要专注于作为比特币交易的数据库形成对比。\n\
  \n这一新颖独特的功能为以太坊网络的功能敞开了大门，它不仅是一种加密货币，还是一个人们可以开发去中心化应用（dApps）的平台。以太坊区块链最终于 2015 年正式推出，支持智能合约，该区块链网络成功吸引了一个非常活跃的开发者社区，并创建了一个惊人的生态系统。\n\
  \n#### 第三阶段：应用时代\n\n如果不提及涌现出的若干项目，区块链技术的历史就不算完整，这些项目发现了利用数字账本技术能力的聪明方法。大多数新项目探索了解决比特币和以太坊若干局限性的方法，同时增加了利用区块链技术的新颖独特功能。NEO\
  \ 就是一个这样的区块链应用。尽管该国禁止加密货币，它仍是一个来自中国的去中心化开源区块链平台。\n\n其他区块链应用也是在这个阶段创建的，其中一些涉及公共区块链网络，允许世界上任何个人访问网络内容。此时，多家企业开始采用数字账本技术以帮助提高运营效率，微软就是探索区块链用途的公司之一。这个时代见证了三种不同类型区块链的诞生：公有链、私有链和联盟/混合链。\n\
  \n### 区块链技术及其三代演进总结\n\n![Image](img/Image00002.jpg)\n\n目前，区块链共有三代，比特币属于第一代。第一代区块链的主要目的和设计是增强金融系统；这解释了为什么该时代创建的大多数加密货币都专注于金融应用。既然比特币的设计仅是为了促进金融交易，那添加诸如交易条款和条件之类的东西又该如何处理？\n\
  \n这里有一个简单的解释。James 从一位名叫 Jenifer 的女士那里在线订购了一块腕表，并提供了他的付款条件：*\"只有当她交付我订购的腕表时，我才支付\
  \ Jenifer 5 个比特币？\"*\n\n在这种情况下，比特币无法处理此类交易。这就是第二代区块链（如以太坊）发挥作用的地方。以太坊引入的两个显著特性是智能合约，它现在可以确保\
  \ Jenifer 只有在交付腕表时才能自动收到款项。以太坊引入的第二个特性是一个平台，开发者可以在其中创建他们的去中心化应用（dApps）并发行他们的代币。\n\
  \n这使得以太坊区块链成为一个不同项目可以运行的数字生态系统。有趣的是，随着去中心化金融（DeFi）、游戏、供应链管理、非同质化代币（NFT）等各种功能用例的引入，情况已显著改善。\n\
  \n第三代区块链涉及 Cardano、以太坊 2.0（以太坊的升级版）、Polkadot 等项目。当中本聪和 Vitalik Buterin 推出各自的区块链项目时，它们仍存在若干初期问题。这也限制了它们的能力，其中一个问题就是它们的容量，通常被称为可扩展性问题。\n\
  \n当过多个体试图在空间有限的区块链上执行交易时，会出现严重拥堵。因此，第三代区块链的设计主要不仅关注提供第一代和第二代区块链的大多数功能，还关注解决它们面临的问题，特别是可扩展性问题。第三代区块链解决的另一个问题是互操作性。\n\
  \n### 加密货币的基石\n\n我们可以简单地将区块链技术定义为*\"密码学保护的分布式账本\"*。它基本上是一个数据库，参与者可以随时查看其中包含的信息。数据不是存储在一个中心化服务器上（这在传统组织中很常见），而是分散在世界各地的各种计算机或\"\
  节点\"上。这确保了所有参与节点都能访问该数据库。人们常混淆区块链和加密货币。此外，一些人认为比特币就等同于区块链，但它们完全是不同的事物。\n\n区块链作为底层技术，确保我们记录的所有交易透明公开。另一方面，加密货币只是一种数字价值存储，我们可以用于购买房产、商品和服务等各种用途。比特币是加密货币的一个流行例子。\n\
  \n中本聪引入密码学作为一种保障加密货币免受伪造和法币相关其他安全挑战的方式。因此，创建区块链技术的主要原因是为了促进比特币的存在和使用。它作为去中心化账本，包含了点对点网络中每一笔加密货币交易。你可以称区块链为加密货币的*\"\
  内部银行系统\"*，且是去中心化的。然而，正如之前所解释的，区块链的用途现已超越金融交易，我们稍后将探讨若干用例。\n\n## 第 2 章：区块链与分布式账本技术\n\
  \n![Image](img/Image00003.jpg)\n\n对大多数人来说，区块链技术就等同于分布式账本技术。事实真是这样吗？本书的目标之一是简化区块链技术，帮助你理解其含义及其彻底改变我们处理数据方式的潜力。区块链、去中心化和分布式账本技术等术语常用于各个领域，人们往往对这些术语感到困惑。\n\
  \n不熟悉这些技术的大多数人经常交替使用这些词汇。缺乏关于这两种技术的正确信息是导致一些人退出的主要原因之一。这是因为在数字时代，新技术往往被炒作成流行词，而这些流行词通常生命不长。但区块链和\
  \ DLT 并非如此，因为它们有潜力改变我们未来处理数据的方式。好吧，分布式账本技术和区块链技术并不完全相同。\n\n### 理解分布式账本\n\n\n\n\n\
  \n![Image](img/Image00004.jpg)\n\n我们可以简单地将分布式账本视为“一个去中心化的数据库”，这意味着它是一个存储在数百或数千台计算机或节点中的数据库。分布式账本中的所有节点都维护该账本，一旦有任何数据被添加，账本也会随之更新。账本的更新发生在每个参与节点上，并且是独立完成的。在这种设置下，所有参与节点享有同等权限，没有单个服务器或中心化机构负责管理数据库。\n\
  \n这也是确保该技术高度透明的原因。在分布式账本上更新和验证数据存在的过程非常直接，节点可以根据账本现有的共识算法验证每一笔交易。在某些情况下，只有少数选定的节点可以参与验证交易，而在其他情况下，则允许所有节点参与该过程。当所有节点都给予批准时，交易将在账本中占据一席之地，账本的状态也将随之更新。\n\
  \n除了分布式账本提供的更高透明度外，它还提供了极佳的安全性，因为不存在像传统数据库那样的中心化机构。该技术中不存在单点腐败。所有参与节点都有机会验证交易，这解释了为什么金融行业处于采用该技术的最前沿。\n\
  \n### 区块链技术\n\n![Image](img/Image00005.jpg)\n\n要解决区块链是否等同于 DLT 这个问题，你可以将 DLT 视为区块链的母技术。区块链技术只是分布式账本的一种类型，但它比母技术更受欢迎。有趣的是，一些核心开发者开始走出区块链的阴影，这也解释了为什么对理解两者差异感兴趣的人数也在增加。\n\
  \n正如其母技术一样，区块链上的所有参与节点都拥有账本的副本。每当添加一笔新交易时，任何给定区块链网络上账本的每一个副本都会得到更新。在将交易追加到账本之前，必须对其进行加密。同样也不需要像\
  \ DLT 那样由中心化机构来管理系统。这解释了为什么它是一个去中心化系统。区块链将存储在其中的数据排列为区块，这也是其名称的由来。\n\n所有区块相互连接，并且出于安全目的也进行了加密。区块链的特性之一是无法删除或修改现有数据。区块链仅允许添加操作，这与传统数据库不同。记录在区块链中的所有交易都存在于历史记录中，没有人可以修改或删除其中任何一笔。因此，与\
  \ DLT 类似，区块链极其透明，这也是为什么有预测称区块链市场将在 2024 年增长到 160 亿美元。\n\n### DLT 与区块链技术的区别\n\n尽管这两种技术有许多相似之处，但也存在一些差异。正如我之前提到的，分布式账本技术简单来说就是区块链的母技术。我们也可以将区块链视为\
  \ DLT 的一个进阶版本。区块链技术只是分布式账本的一个版本，这解释了为什么两者经常被互换使用。然而，将每一个分布式账本都视为区块链是错误的。\n\n这类似于某些产品变得极其流行，甚至比其母公司名称更知名的情况。区块链仅仅是获得了自己的身份，也许原因是它随着比特币和其他加密货币的创建而普及。在\
  \ DLT 的工作方式上也存在几个差异。\n\n共识对于分布式账本技术至关重要，但在区块链中，开发者实际上可以采用各种策略来达成共识，如工作量证明、权益证明、委托权益证明等。区块链的其他特性是你在分布式账本中可能找不到的，包括：\n\
  \n*   **顺序：** 区块链中的所有区块通常按特定顺序排列。DLT 则不然，因为不需要数据的特定顺序。区块的顺序是区分区块链与其他 DLT 平台的因素之一。\n\
  *   **区块结构：** 这或许是区块链与 DLT 之间最显著的区别。在区块链中，你会找到数据区块，但分布式账本并非如此。分布式账本只是一个分布在各个节点上的数据库。可以用多种方式表示分布式账本中的数据。\n\
  *   **高能耗共识：** 埃隆·马斯克最近的爆料导致比特币价格大幅下跌，这是由于比特币矿工的能源使用问题，而世界正在竞相应对全球变暖问题。区块链技术使用工作量证明共识和其他机制，但这通常消耗大量能源。分布式账本则不同，因为它不需要此类共识，且具有相对更好的可扩展性。\n\
  \n现在你对这两者有了更好的了解。区块链技术带来了额外的功能，并超越了传统分布式账本。区块链技术可以执行某些分布式账本无法执行的功能，如互操作性。我们可以自信地说，区块链技术正将分布式账本技术推向一个新的水平。\n\
  \n### 区块链的类别\n\n在区块链推出几年后，要写出超过 20,000 字关于区块链和加密货币的内容将会很困难。然而，现在你可以写一本超过 10 万字的关于区块链和加密货币的书。这是因为区块链和加密货币领域发展迅速，变得非常广阔。始于中本聪推出比特币的公共区块链（也称为第一类区块链）的事物，已经转变为多种用例。\n\
  \n通常，比特币的区块链被视为第一代区块链技术，但事态发展如此之快，我们现在已经有了三种不同类别的区块链技术。现存的每种区块链都是为了解决一组特定问题而创建的。我们现在看到越来越多的公司正在探索如何尽可能多地利用区块链技术的优势。\n\
  \n在深入探索区块链的不同类别之前，我们需要了解为什么首先需要不同的类型。区块链的第一个流行用例是 2008 年它随比特币一同推出时。中本聪的意图仍然难以确定，但将公共区块链用于比特币也为人们探索去中心化账本技术的概念打开了大门。\n\
  \n分布式账本技术的出现也改变了我们解决业务问题的方式，因为组织开始发现可以在不需要中心化实体的情况下执行多笔交易。虽然分布式账本技术帮助解决了中心化的几个挑战，但它也带来了新的挑战，我们在将区块链技术应用于其他用例时需要解决这些挑战。\n\
  \n\n\n\n\n#### 区块链类型概述\n\n一个典型的例子是比特币的共识算法（PoW），它效率相当低下，因为它需要所有参与节点或矿工解决复杂的数学计算。解决这些计算的过程需要消耗大量的能源。在比特币早期，工作量证明共识并不是真正的问题。但随着计算难度的显著增加，解决计算所需的能源和时间也随之激增。\n\
  \n这种算法的低效性会随着时间的推移而加剧，从长远来看，无论它表面上看起来多么有吸引力，都会使整个系统变得没有吸引力。一个实际的例子是银行使用这种共识算法。鉴于银行的高交易量，这样的系统对它们来说将非常不合适。比特币和以太坊等第一代区块链面临的其他挑战还包括可扩展性等。\n\
  \n#### 另一个视角\n\n除了公共区块链的高能源需求和工作量证明共识问题外，还有另一个视角需要考虑。请记住，公共区块链正如其名——交易是公开的。因此，任何人都可以轻松查看发生的交易。事实上，我们并不都需要公共区块链，尤其是组织。大多数公司不愿意通过使用公共区块链向公众披露其业务交易。它们可能有兴趣隐藏一些确保其业务成功的关键数据，因为竞争对手可能会利用它们的商业机密或策略。\n\
  \n这最终暴露了对不同种类区块链的需求。为了解决这个问题，出现了两种新型区块链——私有链和联盟链。因此，第一代区块链的多重缺陷（如可扩展性和低效性）导致了其他类型区块链的发现。此外，公共区块链并不适用于所有目的，因为有些人不愿意向公众披露他们的数据。\n\
  \n#### 区块链类型\n\n![Image](img/Image00006.jpg)\n\n由于我们刚才讨论的问题，区块链技术现在大约有四种不同的类型：\n\
  \n*   公有链\n*   私有链\n*   混合链\n*   联盟链/联邦链\n\n##### 公有链\n\n这是第一种已知的区块链类型，被视为一种“无许可”分布式账本技术，因为我们都可以自由参与并进行交易。我们可以将其视为区块链的非限制版本，作为一个点对点网络，任何人都可以拥有账本的副本。既然任何人都可以自由拥有账本副本，只要有互联网连接，我们都可以访问公共区块链。\n\
  \n比特币公共区块链无疑是最早进入我们世界的区块链之一，它授予每个人以去中心化方式执行交易的权限，只要有互联网连接。如果公共区块链无法获得解决交易所需的参与节点，它将无法运行。\n\
  \n尽管许多区块链平台仍然使用公共区块链，但它们都创建了额外的功能来区别于其他平台。公共区块链的优秀例子包括 `Litecoin`、`Bitcoin`、`NEO`\
  \ 和 `Ethereum`。\n\n###### 公有链的优势\n\n尽管存在一些缺点，但公共区块链也有显著的优势：\n\n*   加入公共区块链是免费的。\n\
  *   不需要中介机构来使系统运行。\n*   公共区块链在整个用户社区中建立信任。\n*   由于可用数据开放供验证，它也促进了整个网络的透明度。\n*  \
  \ 公共网络中的所有参与者都有动力确保系统持续改进。\n*   取决于参与节点的数量，公共区块链通常非常安全。\n\n###### 公有链的劣势\n\n就像地球上的其他事物一样，公共区块链也有其挑战。第一个与交易速度有关。通常需要几分钟，在某些情况下甚至需要几小时才能完成一笔交易。例如，作为中心化支付平台的\
  \ `VISA` 每秒可处理 24,000 笔交易，而比特币每秒仅能处理约 7 笔交易，相比之下，比特币的容量极低。交易速度慢的原因与必须在完成交易前解决的数学问题有关。\n\
  \n可扩展性是公共区块链的一个大问题。由于其工作原理，公共区块链无法扩展，因为随着更多节点加入，网络会变得越来越笨拙，这也使网络变慢。不同的区块链网络正以不同方式解决这个问题。以太坊正在考虑采用权益证明（`PoS`）共识机制，而比特币则在开发闪电网络，这最终将交易移至链下。一旦完成，主比特币网络将更具可扩展性且更快。\n\
  \n公共区块链的另一个劣势与其共识方法的能源使用有关。目前，比特币仍在使用 `PoW`，这需要更多能源。如前所述，以太坊正试图通过致力于使用 `PoS` 来部分解决这一挑战。\n\
  \n###### 公有链的用例\n\n尽管公共区块链面临许多挑战，但它有几个惊人的用例，其中之一是投票。由于投票需要高度的透明度和信任，政府实际上可以使用公共区块链进行投票。这也是渴望提高信任和透明度的组织和倡议进行筹款的绝佳解决方案。\n\
  \n##### 私有链\n\n![Image](img/Image00007.jpg)\n\n正如其名，这种类型的区块链纯粹是私有的，在限制性环境中运行——一个封闭的网络。此外，私有区块链通常被称为“有许可”区块链，这意味着其控制权掌握在特定实体手中。私有区块链最好的用例之一或许是希望在内部使用它的私营公司。当一个组织决定使用私有区块链时，他们将允许一定数量的参与者访问网络。公司甚至可以进一步指定网络上每个用户的授权级别、可访问性等。\n\
  \n究竟是什么主要特征将公共区块链和私有区块链区分开来？两者的主要区别在于可访问性。除了访问方式不同外，这两种区块链为用户提供的功能相似，因为两者都可以为参与者提供安全性、信任和透明度。\n\
  \n有许可区块链与无许可区块链的区别在于，它似乎有点中心化。由于将有一个负责网络的权威机构，它是中心化的，这在理论上也意味着它不是去中心化的。我需要指出，虽然你可以称私有区块链为有许可区块链，但有许可区块链的概念非常广泛，甚至可以用于公共区块链。私有区块链的优秀例子包括\
  \ `Hyperledger Fabric`、`Corda`、`Multichain` 和 `Hyperledger Sawtooth`。\n\n######\
  \ 私有链的优势\n\n*   这种区块链的一个显著优势是速度——它们很快。私有区块链速度的提高是由于参与者很少。网络可以在更短的时间内轻松达成共识，从而实现更快的交易。\n\
  \n\n\n\n\n## 私有区块链的优势\n\n私有区块链的另一个显著优势是其更具可扩展性。在私有区块链中，只有少数节点被授予验证交易的权利，这使其更具可扩展性。因此，无论网络增长到何种规模，它都将继续以初始的效率和速度运行。此处的主要决定因素是中心化权威，它确保了更快的决策制定。\n\
  \n###### 私有区块链的劣势\n\n当然，它也伴随着一些缺点。它们并非真正的去中心化区块链，这被许多人视为私有区块链面临的最大挑战。其非去中心化的特性违背了区块链或分布式账本技术的理念。在私有区块链中建立信任往往颇具挑战，因为最终拍板的人是中心化节点。\n\
  \n私有区块链面临的另一个挑战与节点数量的影响有关。节点数量极少，这降低了此类区块链的安全性水平。如果特定数量的节点变得恶意或停止运行，这可能会危及私有区块链网络所使用的共识机制，并最终导致安全问题。\n\
  \n###### 私有区块链的用例\n\n私有区块链有许多用例，以下是其中一些：\n\n*   **内部投票：** 它适用于组织内部的投票。\n*   **供应链管理：**\
  \ 公司可以采用私有区块链来帮助处理其供应链，我们将在第 10 章探讨区块链改变供应链的各种方式。\n*   **资产所有权：** 我们也可以利用私有区块链来追踪和验证资产。\n\
  \n##### 联盟/联邦区块链\n\n区块链技术的第三类是联盟区块链或联邦区块链。这一类区块链的出现，是为了以一种创新方式解决组织的需求，特别是在组织需要公有链和私有链结合功能的场景下。因此，虽然公司的某些方面被公开，但公司可以将其他方面设为私有。此外，该类区块链的共识流程由预设节点处理。\n\
  \n尽管它并非完全对公众开放，但它仍然享有去中心化的结构。之所以仍能保持去中心化系统，是因为有许多组织参与管理联盟区块链。因此，没有任何单一或中心化的实体可以做出决策。联盟区块链确保正常运行的另一个特性是验证节点的存在，该节点可执行两项不同任务——发起或接收交易，以及验证交易。\n\
  \n另一方面，成员节点可以发起和接收交易。现在你可以看到，联盟区块链为用户提供了私有区块链的所有独特功能，如效率、隐私和透明度，同时又不将控制权交给中心化实体。此类区块链的示例包括\
  \ IBM Food Trust、Marco Polo 和 Energy Web Foundation。\n\n###### 联盟区块链的优势\n\n当然，这种类型区块链的用户可以享受私有区块链所提供的优势。其中一些包括：\n\
  \n*   它们提供更好的可扩展性且更安全。\n*   联盟区块链还提供卓越的可定制性和对资源的控制。\n*   它们在既定的治理结构下正常运行。\n*   与公有区块链网络相比，联盟网络已被证明更高效。\n\
  \n###### 联盟区块链的挑战\n\n另一方面，联盟区块链面临诸多挑战，其中之一关乎其透明度。它不如公有区块链透明。尽管它是安全的，但由于成员的诚信问题，整个网络仍有可能被攻破。整个网络的功能也可能受到法规和审查的影响。最后，与其他类型的区块链相比，它的匿名性较低。\n\
  \n###### 联盟区块链的用例\n\n联盟区块链的优秀用例包括：\n\n*   **研究：** 我们可以在协作工作中使用联盟区块链来共享研究数据和结果。\n\
  *   **银行与支付：** 例如，多家金融机构可以建立一个联盟，并就哪些节点将验证所有交易达成一致。\n*   **食品溯源：** 联盟区块链的另一个优秀用例是食品溯源。\n\
  \n##### 混合区块链\n\n这是我们将要讨论的最后一种区块链类型，在某些方面（因为它们有许多共同点），这种类型的区块链可能看起来像联盟区块链，但它们有几个不同之处。你可以将混合区块链简单地视为私有区块链和公有区块链的结合。它常被那些尚未准备好部署公有区块链或私有区块链，但只对部署两者的优势感兴趣的组织所使用。混合区块链的两个好例子是\
  \ XinFin 的混合区块链和 Dragonchain。\n\n###### 混合区块链的主要优势\n\n该区块链的主要优势包括：\n\n*   参与者可以根据其需求更改网络规则。\n\
  *   它在封闭的生态系统中运行，这意味着并非所有内容都公开。\n*   在仍与公有区块链网络保持连接的同时，混合区块链依然提供隐私。\n*   这种类型的区块链可防范\
  \ 51% 攻击。\n*   与公有网络相比，它提供卓越的可扩展性。\n\n###### 混合区块链的缺点\n\n尽管拥有诸多优势，它仍有一些缺点，其中之一是它并非完全透明。升级到混合网络通常极具挑战性。最后，参与节点因对网络维护做出贡献而获得激励的情况并不真实存在。\n\
  \n###### 混合区块链的用例\n\n混合区块链可在以下领域大显身手：\n\n*   **房地产：** 使用混合网络的一种方式是用于房地产目的。在这种情况下，房地产公司可以利用混合区块链的私有功能运行其内部系统，而公有功能将用于向公众展示信息。高度监管的市场（如金融市场）会发现混合区块链非常有用。\n\
  *   **零售：** 此外，零售业也可以利用混合区块链简化其流程。\n\n#### 哪种区块链适合你？\n\n这个问题并没有简单直接的答案，因为每种区块链都有独特的功能。不过，这里有一份简单的指南帮助你做出决定。\n\
  \n##### 何时考虑公有区块链\n\n由于任何人都被允许加入公有区块链网络并访问信息，这种类型的区块链适合极其重视透明度和信任的公司。社会团体或非政府组织（NGO）等组织可以享受公有区块链的用途。\n\
  \n然而，该网络的公开性质也意味着它不适合在私营部门运营的企业。原因显而易见，因为没有公司愿意向公众展示其私密信息。此外，公有区块链昂贵的特性使其对有兴趣削减成本和增加利润的公司缺乏吸引力。对于那些渴望创建像比特币这样的全球性加密货币的人来说，这种类型的区块链是一个绝佳选择。\n\
  \n##### 私有区块链如何？\n\n\n\n\n\n# 区块链类型与关键组件\n\n##### 私有链\n\n这种类型的区块链与公有链截然相反，因此网络的首要特性是隐私性。任何希望维护私有网络，同时又想享受分布式账本技术独特优势的企业，都会发现私有链非常有用。考虑到私有链的中心化本质，使用这种类型区块链的公司将掌控网络，并防止公众访问敏感信息。\n\
  \n使用私有链网络的公司也可以享受分布式账本技术的主要特性，并为组织成员提供通过安全性和不可篡改性建立信任的绝佳机会。公司还可以根据其特定需求制定规则并协调公司活动。\n\
  \n## 联盟链网络\n\n控制联盟链运营的不是去中心化网络或中心化节点，而是一组组织或节点。使其成为绝佳选择的原因在于它拥有预选节点，这使其成为寻求需要协作解决方案者的理想之选。供应链公司、医药、食品等行业就是一些很好的例子，它们应考虑使用联盟链，因为这些行业需要全方位的协作。\n\
  \n## 混合链\n\n您是否有兴趣在以最小劣势的情况下享受公有链和私有链的优势？如果您的回答是肯定的，那么混合链是您的最佳选择。尽管它像其他事物一样仍有一些缺点，但其缺点相当小。对于新兴业务模式来说，这是一个完美的选择。\n\
  \n## 第 3 章：区块链的关键组件\n\n![Image](img/Image00008.jpg)\n\n正如我之前所解释的，区块链只是一种分布式账本技术。没有数据的中心化管理；相反，数据是基于网络中每个参与节点的共识被接受的。有几个组件构成了区块链，了解这些组件及其各自的角色，将让您对区块链的工作原理有更清晰的认识，无论区块链的类型如何。\n\
  \n### 节点\n\n![Image](img/Image00009.jpg)\n\n它们是区块链网络的一个基本方面，因为它们确保数字数据在点对点网络上的适当分发。正如我之前提到的，它们只是拥有区块链数据库副本的计算机。然而，节点有两种变体；我们有验证节点（或全节点）和成员节点（或轻节点）。验证节点是维护给定区块链网络上每笔交易的完整且更新的副本的节点。验证节点可以验证、接受甚至拒绝网络上的任何交易。\n\
  \n另一方面，部分节点或成员节点不维护区块链账本的完整副本。轻量级节点仅维护交易的哈希值，并且只能通过哈希值访问这些交易。与验证节点不同，成员节点的存储和计算能力较低。\n\
  \n### 账本\n\n我们要讨论的第一个组件是账本。它就像大多数人熟知的常见“账本”一词，但区块链账本是多笔交易的电子记录。虽然资产构成交易的关键部分，但账本仍不是资产的集合。相反，它记录资产的每一笔交易。因此，我们可以使用分布式账本记录涉及比特币等资产的每一笔交易，而不仅仅是记录比特币本身。要创建账本，区块链技术构建了一条连续且按时间顺序排列的区块链。此外，就像以太坊和\
  \ Hyperledger 的情况一样，它还可以记录称为智能合约的代码集合。\n\n### 交易、区块与链\n\n![Image](img/Image00010.jpg)\n\
  \n在此背景下，我们可以看到交易具有以下特点：\n\n*   记录（如事件）\n*   按时间顺序排列\n*   经过加密验证和保护\n*   打包以创建区块\n\
  \n如前所述，区块仅包含一组交易，所有交易在添加到其他区块的链之前被分组在一起。这就是“区块链”名称的由来。由于所有区块链接在一起，每个新区块都将被分配一个来自前一个区块的特殊标识符引用，这被称为加密哈希。您可以向一个区块添加一笔或多笔交易，这意味着我们实际上可以将多笔交易批量打包到单个区块中。\n\
  \n批量处理交易的目标是提高具有特定区块吞吐率的各种区块链平台的交易吞吐率。您将在每个区块中找到的详细信息包括：\n\n*   **时间戳：** 这指的是添加到链上的每个区块的时间戳。\n\
  *   **前一个加密哈希：** 我们可以将其视为一个称为哈希的唯一标识符，它引用自前一个区块。\n*   **Nonce（随机数）：** 仅使用一次的数字是所有参与节点为了有资格提议新区块而求解的加密挑战数字。Nonce\
  \ 实际上是一个经过哈希的区块；一旦重新哈希，它将满足难度级别限制。\n*   **Merkle 根哈希：** 区块还包含添加到该区块的每笔交易的 Merkle\
  \ 树根哈希。\n\n![Image](img/Image00011.jpg)\n\n### 钱包\n\n在区块链领域，钱包是指一种软件，它使用户能够存储其加密货币的详细信息。因此，网络上的每个节点也需要一个钱包，而钱包的安全性由公钥和私钥保证。加密货币领域有两类钱包：\n\
  \n*   **热钱包：** 这指的是我们日常用于各种交易的钱包。热钱包连接互联网，这也使它们暴露在黑客面前，黑客可以通过互联网访问钱包。热钱包有不同种类，包括在线/网页钱包。\n\
  \    *   这类钱包基于云端，这意味着只要您有互联网接入，就可以用智能手机连接。MetaMask 和 MyEther Wallet 是在线钱包的两个很好的例子。此外，桌面钱包和移动钱包也属于这一类。您可以在笔记本电脑或智能手机上下载此类钱包，这也意味着您完全控制钱包。Mycelium\
  \ 和 Coinomi 是软件钱包的两个例子。\n*   **冷钱包：** 第二类钱包通常被称为冷存储或冷钱包，因为它们以任何方式都不连接互联网。冷钱包通常是最安全的一类钱包，因为黑客极难访问它们。冷钱包可以是硬件钱包或纸钱包。纸钱包完全离线，钱包详细信息存储在一张纸上。纸钱包的详细信息包括加密货币地址以及以二维码形式存储的私钥。硬件钱包不同于纸钱包，它是一种电子设备。它利用与钱包关联的随机数生成器。\n\
  \n### Nonce（随机数）\n\nNonce 是区块链的一个方面，它通过密码学确保区块链的安全性。它只是“number only used once”（仅使用一次的数字）的缩写。它指添加到区块链中加密或哈希区块的一个数字，该数字在重新哈希后满足难度级别限制。事实上，矿工在比特币区块链等区块链中求解的就是\
  \ nonce，一旦他们发现 nonce，矿工将因其付出的努力获得加密货币形式的奖励。当矿工解决数学计算时，他们将因其技能和时间获得奖励。\n\n\n\n\n\n\
  ### 密码学\n\n区块链技术中的信任无需像传统机构那样依赖中央权威机构即可实现。相反，信任是通过密码学和共识建立的。密码学的功能是将信任的负担从第三方转移到密码学算法上。密码学有助于对数据进行编码或加密，并确保第三方或外部行为者无法破译任何给定的消息。因此，我们可以说密码学提供了一种保密的双向交换，在访问消息负载之前，每一方都可以自由地对密文进行加密或解密。\n\
  \n密码学还有助于验证区块链中的数据完整性。要创建消息的加密版本（也称为密文），密码学算法会利用消息和密钥。发送方和接收方可以交换消息的加密版本或密文。\n\n\
  #### 公钥密码学\n\n公钥密码学在分布式账本技术中的功能除了通过数字签名进行用户认证外，还用于数据验证。我们可以通过用户公钥和私钥的组合，利用所谓的“公钥基础设施”（PKI）框架来实现用户认证。在密码学中，公钥代表用户的公开身份，他们可以将其与网络上的其他用户共享。\n\
  \n任何区块链平台上的每个用户都持有一个存储在数字钱包中的私钥。私钥保存着用户的私有凭证详情。数学算法被用于帮助生成这些公钥和私钥的配对，并确保我们可以对消息进行加密和解密。也可以以一种有助于保护用户匿名性的方式使用公钥和私钥。\n\
  \n所有各方通常都知道公钥——发送方和接收方。但只有发送方知道私钥，当向接收方发送消息时，发送方将使用数学公式通过加密使消息变得不可读（密文）。这是为了确保数据得到充分保护，接收方只能使用私钥解密“密文”并将其转换为可读文本。\n\
  \n![Image](img/Image00012.jpg)\n\n#### 哈希函数\n\n区块链技术利用一种称为加密哈希的特定密码学。数学函数通过获取数字对象并生成一串固定的数字和字母（32\
  \ 字符）来表示哈希码，从而创建哈希码，一个很好的例子是表示为 `d7w0993waty9n33234qw949g02b9o34238878501032ff2si04d3d99sq93jzwa9`\
  \ 的交易。\n\n密码学在加密哈希中的用途之一是单向转换，从而创建编码数据或哈希。参与任何交易的各方可以共享创建的哈希，但无法对其进行解码。在数学上，没有任何人能够成功解密或逆向工程编码的哈希。这也使得从哈希码本身推导出用于创建哈希码的输入消息变得不切实际。\n\
  \n分布式账本技术利用加密哈希来确保在不真正共享数据内容的情况下证明数据。因此，通过匹配和验证计算出的哈希相互匹配，交易中涉及的所有利益相关者或各方都可以证明数据。事实上，哈希的核心功能之一是帮助维护区块链的不可篡改特性。很容易检测到对任何区块链的更改，因为对原始对象所做的任何更改最终都会生成一个新的哈希。\n\
  \n每个区块都是一个哈希码，它是作为区块数据和前一个区块哈希码的组合计算得出的。这就是哈希码链接的方式。计算哈希码并不困难，所有参与者都可以轻松验证没有人对数据进行任何篡改。当尝试删除或修改任何给定区块上的数据时，哈希码链将立即变得无效，参与者可以轻松检测到此类更改。\n\
  \n#### 默克尔树\n\n默克尔树的功能是减少任何区块链网络中的数据量，并确保区块链上数据的高效验证。每个区块存储一个默克尔根哈希，它是通过哈希交易数据创建的。交易数据也将成为区块的一部分。默克尔根哈希的作用之一是使交易验证更加高效。无需验证区块中的每一条数据，而是可以发送一笔交易以及相关的哈希值。任何验证计算机或节点现在都可以计算数据的哈希值，并确认交易的有效性，而不需要区块中的所有数据。\n\
  \n### 理解区块链网络\n\n![Image](img/Image00013.jpg)\n\n每个区块链网络由网络参与者组成，参与者是存储、定期更新和维护数字账本的计算机或节点。贯穿全书，你一定会遇到“节点”一词，它简单地指区块链网络中的计算机。网络中每个参与节点都拥有账本的共享副本，并不断与网络中的每个其他节点同步。\n\
  \n节点网络的最终目标是提供共识，并确保跨各个节点的每个共享账本副本都是一致且有效的。它们还验证添加到账本的每个新区块。每个网络都由特定的共识算法或协议管理，这些算法或协议有助于定义网络中每个节点与其他节点通信和交互的方式。随着共识的达成，每个节点都必须根据区块链网络既定的共识协议同步其共享账本的副本。\n\
  \n任何网络的特定共识协议通常由用于实施该网络的平台决定。网络的共识保证了参与节点上每个区块链副本的一致性和有效性。区块链网络有不同类型，我们稍后将简要介绍其中一些。\n\
  \n那么，为什么像比特币区块链这样的区块链被称为“点对点”网络？分布式账本技术中的“分布式”一词表明该技术利用点对点网络结构。与中央服务器网络不同，P2P 网络上的节点彼此相连，而不是连接到中央服务器。不需要像清算所或银行这样的第三方来处理交易。\n\
  \n#### 分布式存储\n\n关于区块链技术的一个重要事实是，它本质上是一种数据存储，不同于我们大多数人熟知已久的传统数据库。此外，它的特性也不像我们熟知的流行数据库那样。在考虑区块链技术的各种用例时，理解传统数据库和分布式存储之间的差异至关重要。这是确定分布式账本技术是否适合您需求的绝佳方式。\n\
  \n\n\n\n\n### 数字账本与区块链分叉\n\n数字账本旨在帮助存储我们的交易，以便我们稍后可以查询每个区块的不同特征。那么，数据是如何维护和存储的？它通过在不同节点间拥有共享数字账本的多个副本，实现了数据的妥善存储与维护。网络上的每个参与节点都拥有共享账本的一份副本。\n\
  \n网络节点只能通过网络共识协议就有效的交易区块达成一致。任何网络使用的共识协议都是该平台独有的，只有当节点一致同意某个区块的有效性时，它们才会将其添加到共享账本中，并相应地同步账本的每一个副本。正是这种独特的架构增强了技术的弹性，因为即使多个节点发生故障，只要关键数量的节点仍在运行，共享账本数据的完整性就不会受到影响。\n\
  \n#### 区块链分叉\n\n该术语对大多数读者来说可能显得复杂，但我将提供一个简单易懂的解释。在区块链技术中，它是一个说明从当前代码或软件分离或切离的术语。但这个词现在有了更广泛的含义，你可以将其视为区块链分裂成两条潜在路径的那一刻，或导致协议变更的分歧。分叉也意味着网络需要对代码进行重大更改或技术更新的节点。\n\
  \n请记住，以太坊或比特币等一些区块链网络是去中心化的，这也意味着网络上的所有参与者都需要就网络状态达成一致——包括共享的区块链协议、区块等。当然，当所有参与者都同意区块链网络的结果及其运营的各个方面时，区块链将保持不变。\n\
  \n这也意味着网络将拥有一条单一的区块链，维护着由参与者验证并确认为正确的交易记录。然而，情况并非总是如此，有时节点可能无法就区块链网络的未来状态达成一致共识。这会导致分歧，最终引发分叉——即一条“单一”链分裂成至少两条或更多条均保持有效的链。请查看下面的插图，以充分理解分叉的含义。\n\
  \n![Image](img/Image00014.jpg)\n\n在区块链中，分叉过程会导致现有规则转变为一组新的预定规则。在某些情况下，并非所有网络成员都能支持规则的变更，但这并不改变规则的独特性。对于运行在区块链网络上的节点来说，识别这些规则至关重要。如果某个节点拒绝遵守规则的修改，该节点将被允许继续运行，但这一决定也会带来若干后果。这引出了分叉的两种主要类型——硬分叉和软分叉。\n\
  \n##### 硬分叉\n\n在区块链领域，这种类型的分叉被视为对现有区块链的“非向后兼容”升级。在硬分叉的情况下，区块链网络上的节点要么遵守软件协议的更新，要么决定坚持使用过时的协议，从而导致出现一个独立的区块链实体。硬分叉的一个好例子是以太坊和以太坊经典。此外，比特币也经历过硬分叉，如比特币和比特币现金的出现。\n\
  \n##### 软分叉\n\n你可以将其视为硬分叉的对立面。它指的是区块链网络的“向后兼容”升级，其中已升级的节点仍可与未升级的节点通信。因此，软分叉中新创建的规则不会以任何方式与现有规则冲突。例如，以太坊和比特币都曾利用软分叉来执行通常具有向后兼容性的新更新。有时，软分叉的发生是由于区块链的暂时性偏移，即矿工使用未升级的节点违反了新的共识规则。然而，这种情况非常罕见，此类事件极不可能发生。\n\
  \n一旦发生硬分叉，仍在使用旧规则集的节点上的所有更改都将无效。这意味着尝试创建和验证区块的旧节点将不被视为有效。硬分叉过程中发生的每一项更改，在分叉完成后都无法删除或修改。另一方面，在软分叉中，选择创建和验证区块的旧节点将被网络上的每个节点视为有效，无论其状态是旧还是新。\n\
  \n## 第 4 章：去中心化网络与中心化网络\n\n![Image](img/Image00015.jpg)\n\n在第一章中，我承诺你将理解本书中反复出现的一些术语的含义。因此，解释它们的含义至关重要，以确保你不会感到困惑。之前，我们讨论了区块链与分布式账本技术的区别。我相信你现在已理解这两个概念的含义。让我们来看看两个常用词——去中心化和中心化网络的区别，并了解每种网络类型的优缺点。\n\
  \n### 中心化网络\n\n![Image](img/Image00016.jpg)\n\n主要而言，中心化网络的控制权完全掌握在一个中心化服务器或所谓的主节点手中。该中心化服务器管理整个网络的所有数据处理任务，并存储数据以及其他网络用户可访问的用户信息。客户端节点连接到中心化服务器，客户端节点不执行直接数据请求，而是需要向主服务器提交数据请求。\n\
  \n运营中心化网络的公司的典型例子包括大多数网络服务，如你的网上银行账户、YouTube、Google、移动应用商店等。这些公司的运营由中心化网络所有者协调，这意味着此类网络中的每笔数据交易都需要第三方权威机构的验证。\n\
  \n目前，最常见的网络类型是中心化网络，因为大多数传统公司和组织都维持着中心化结构。在连接其他用户和设备之前，它们需要一个中心网络所有者，这也意味着此类网络存在单点故障，恶意行为者可以蓄意利用此类缺陷。\n\
  \n#### 中心化网络的优势\n\n中心化网络有几个优势，这也是它们仍在使用的原因。以下是这种网络类型的一些优点。\n\n*   **维护成本低**：在所有不同类型的网络中，中心化网络的成本最低，尤其是对于小型系统，且它们不需要大量资源来建立。如果网络管理员想要更新网络，只需更新中心服务器即可，这减少了维护最新网络所需的时间浪费和间接成本。\n\
  *   **部署简单快捷**：在中心化网络中，指挥链定义明确，且在网络内授权相对容易。从网络的中心服务器添加或移除客户端节点也是一项简单的任务，因为只需切断主服务器与客户端节点之间的连接即可。但你应该记住，这并不会增加网络的算力。\n\
  \n\n\n\n\n# 网络架构：中心化、去中心化与分布式\n\n### 中心化网络\n\n#### 优点\n*   **一致性：** 考虑到中心化网络的层级结构——自上而下，客户端节点与主服务器之间的交互可以轻松实现标准化。这最终会带来更流畅、更一致的最终用户体验。根据网络的优先级识别并消除网络中的无关活动也并不困难，因为跟踪和收集网络中的数据过程非常直接。\n\
  \n#### 缺点\n中心化网络的一些缺点也促使个人和企业探索其他类型的网络。以下是一些主要缺点：\n\n*   **安全风险增加：** 单点故障的存在增加了因网络安全威胁（如\
  \ DDoS 攻击）导致安全中断或漏洞的可能性。原因在于，恶意行为者只需攻击一个源头——即主服务器。此外，用户数据存储在单个服务器上意味着中心化网络经常会遇到隐私问题。当主服务器损坏或离线时，可能会发生永久性数据丢失。\n\
  *   **停机时间增加的风险：** 中心化网络的主服务器也会导致长时间停机的问题。服务器崩溃会发生什么？当然，会导致整个网络关闭。这将影响整个网络，因为客户端节点可能无法发送或接收信息。此外，每当需要进行服务器维护时，公司可能会暂时关闭其主服务器。这种临时关闭可能会导致服务中断，从用户的角度来看，进一步降低了整个网络的可靠性，尤其是随之而来的不便。\n\
  *   **可扩展性限制：** 通常很难将中心化网络扩展到特定点之外。原因在于，公司需要增加服务器的存储容量、处理能力，甚至为中心服务器添加更多存储，然后才能超越其现有节点进行扩展。但当网络流量急剧增加——超过网络容量时会发生什么？在中心化网络中发生这种情况时，可能会出现信息瓶颈，用户可能需要从经历延迟增加的主服务器中移出。\n\
  \n### 去中心化网络\n\n![Image](img/Image00017.jpg)\n\n你可以将其视为我们刚才讨论的第一种网络类型的对立面。它是一种将信息处理工作负载分散到多个设备上，而不是仅依赖单个中央服务器的网络。去中心化网络上的每个设备都充当一个微型中心单元，也与其他节点进行独立交互。\n\
  \n这种安排的含义是，即使其中一个主节点受到攻击或崩溃，其他节点仍将继续为用户提供数据访问。因此，一个或多个节点的故障不会阻碍去中心化网络的运行，因为其运行不会中断。促使使用去中心化网络的因素之一是近期技术的进步，赋予了大多数设备和计算机巨大的处理能力。\n\
  \n同步这些新设备中的大多数并将其用于分布式处理很容易。尽管去中心化网络与中心化网络有显著差异，但数据存储和处理并未在整个网络中均匀分布。这种类型的网络仍然依赖主服务器，但每个网络通常有不止一个此类主服务器。\n\
  \n#### 优点\n*   **隐私：** 去中心化网络的显著优点之一是增强了用户隐私，因为网络上的数据存储分布在各个点上，而不是通过一个主点。当然，此类网络中的数据流并不总是容易在整个网络中追踪。由于没有特定的攻击目标，恶意行为者也会发现攻击很困难。\n\
  *   **增强的可扩展性/灵活性：** 与主服务器故障时可能停止运行的中心化网络不同，去中心化网络中不存在单点故障。这也意味着即使主节点关闭或受到攻击，正常操作也将继续。此外，扩展去中心化网络并不难，因为它们可以简单地增加网络上的设备数量并提升其计算能力。在网络维护期间，通常不需要完全关闭网络。\n\
  *   **速度提升：** 由于网络管理员可以在用户活动频繁的位置设置主节点，而不是将连接路由到遥远的单个中心化主服务器，因此用户请求在去中心化网络中能快速完成。\n\
  \n#### 缺点\n*   **高昂的维护成本：** 就去中心化网络和中心化网络哪个更具容错性而言，去中心化网络占上风。但这也伴随着成本，因为维护它们通常更费人力且成本更高。去中心化网络的基础是系统中的多个设备，这最终给组织的\
  \ IT 资源增加了相应的负担。因此，去中心化网络可能不适合需要小型系统的公司。对于此类公司而言，使用去中心化网络的成本/收益比将不划算。\n*   **协调问题：**\
  \ 大公司可能会遇到协调挑战，甚至在使用去中心化网络指导和完成集体任务时遇到一些困难。这是由于去中心化网络中的主节点独立运行，实际上可能无法与其他节点通信。\n\
  \n### 分布式网络\n\n![Image](img/Image00018.jpg)\n\n这种类型的网络与去中心化网络有一些相似之处，其中之一是它不使用中心化的主服务器，而是有多个网络所有者。但两者的一个主要区别在于，与存在主节点的去中心化网络不同，分布式网络由地位平等的互联节点组成。因此，数据所有权以及网络的计算资源在网络中的所有节点之间均等分布。\n\
  \n有时，“分布式网络”一词指的是采用自上而下节点层级结构的地理分布式网络。但在大多数使用场景中，它适用于一种将计算资源均匀分布在不同节点位置的网络类型。\n\n\
  分布式网络中不存在单独的主节点类别或中心化服务器，这意味着数据处理的任务是网络中所有用户的责任——众包。网络上的每个节点都享有平等的数据访问权。在分布式网络中，所有参与节点都参与所有决策过程，因为它们可以投票允许新状态。所有节点决策的聚合结果将决定整个系统的最终行为。\n\
  \n网络的共识机制还负责确定参与者在分布式网络中投票和决策的具体过程。然而，至关重要的是要了解，由于其真正的去中心化本质，分布式网络具有高度的容错性和安全性。虽然它们与去中心化网络具有相似的优点和缺点，但在两种情况下程度都更高。\n\
  \n#### 分布式网络的优点\n\n\n\n\n\n#### 优势\n\n*   **速度与可扩展性：** 与中心化和去中心化网络相比，分布式网络具有更强的可扩展性。由于网络处理能力和数据均匀分布，此类网络提供低延迟。\n\
  \n*   **极高的容错性：** 当分布式网络中的一个节点发生故障时，不会影响整个系统。发生这种情况时，整个网络会立即在其他活跃节点之间重新平衡计算工作负载。这使得分布式网络比通常依赖自上而下节点结构的许多其他网络结构更加健壮。\n\
  \n*   **透明度提升：** 由于数据在分布式网络中均匀分布于整个网络，因此要成功审查、篡改或擦除网络上的任何信息极其困难。这也意味着分布式网络比其他系统更透明，尤其是在它们通过加密方式保护数据时。\n\
  \n#### 劣势\n\n虽然它提供了多项优势，但就像生活中的大多数事物一样，它也有一些缺点：\n\n*   **维护成本高：** 就像去中心化网络一样，希望使用分布式网络系统的公司将需要更多资源来重新配置或维护它。原因在于任何合理的更改都要求更新所有现有节点。考虑到不使用同一时钟的分布式节点会有不同的延迟，网络管理员无法临时对命令或日志进行排序。这使得为这种类型的网络设计和调试算法变得极其困难。\n\
  \n*   **协调挑战：** 这种类型的网络中没有节点层级，这也意味着没有单个节点负责监控下属节点的活动。这意味着系统上的单个节点可能无法得到妥善监管。这也意味着在分布式网络中，完成大规模任务或做出及时决策通常并非易事。对于系统中的节点而言，在考虑网络中其他节点状态的情况下做出明智决策甚至更加困难，因为任何单个节点要获取整个网络的全局视图通常都很难。\n\
  \n## 第 5 章：区块链的核心特性及其重要性\n\n![Image](img/Image00019.jpg)\n\n区块链技术受欢迎程度显著上升的主要原因之一与其众多特性有关。虽然该技术已存在十多年，但它仍处于聚光灯下。当然，像每一种新技术和现象一样，人们对区块链褒贬不一，但没有人能成功低估它在全球经济领域正在并将要发挥的作用。\n\
  \n虽然比特币引发了巨大争议，并遭到世界各国政府和经济学家的反对，但它成功地将世界的目光吸引到了其底层技术——区块链上。因此，它不再仅仅是数字货币的后盾，而是能做更多的事情。本节将探讨区块链的各种特性，以及它为何变得极具吸引力。您可以通过查看下面的信息图大致了解我们即将讨论的内容。\n\
  \n![Image](img/Image00020.jpg)\n\n### 不可篡改性\n\n区块链技术令人兴奋且卓越的特性之一是其不可篡改性。它是该技术的核心特性之一。您现在可能会问：为什么这项技术难以被破坏？要得到一个好的答案，让我们先理解“不可篡改性”一词的含义。当某物是不可变的，意味着您无法更改或篡改它。因此，区块链无法被更改或修改——记录是永久且不可篡改的。这是如何做到的？\n\
  \n与传统银行系统不同，区块链不依赖中心化权威，而是依赖如前所述的多个节点。由于系统上的所有节点都拥有数字账本的副本，节点必须在添加新交易前验证其有效性。一旦它们都同意某笔交易有效，就会将其添加到账本中。节点将新交易区块添加到数字账本的那一刻，任何人都无法再更改它。网络上的任何用户——甚至不是中本聪、Vitalik\
  \ Buterin 或美国总统——都无法擦除、编辑或更新信息。\n\n#### 这如何帮助解决腐败问题？\n\n我们一直听说每年有大量资金通过大多数传统渠道被黑客窃取。为了保护企业免受网络攻击和其他恶意行为者的侵害，全球公司每年花费数万亿美元。但我们经常忽视的一个领域是由腐败的权威和个人引起的内部网络安全风险。大多数黑客攻击之所以成功，往往是因为有内部人员完全了解组织的大多数安全措施。\n\
  \n来自 `idwatchdog` 的可用数据显示，60% 的数据泄露的主要原因是内部威胁。自 2018 年以来，内部安全事件增加了 47%，导致内部威胁成本大幅增加了\
  \ 31%。为了确保您理解什么是内部威胁：*“内部人员是指拥有组织资产合法访问权限，并可能故意或无意损害业务的任何人。”* 这可能是公司的承包商、员工、合作伙伴或前员工。\n\
  \n这意味着公司最终将为信任某些员工付出代价。此外，我们几乎不信任银行等金融机构，这凸显了无信任环境的重要性。当然，区块链技术为世界提供了解决信任问题所需的无信任环境。它提供了一个无腐败的环境，企业可以利用它来确保其内部网络系统的完美运行。通过集成区块链技术，恶意行为者将难以入侵公司数据库、更改或窃取有用信息。\n\
  \n提供这种无腐败环境的区块链的完美示例之一是我们在第二章讨论的公有链。在公有链上，所有参与者都可以看到交易，这使其极其透明。私有链、混合链和联盟链适合那些有兴趣在员工间促进透明度，同时保护其敏感信息不被公众知晓的组织。\n\
  \n### 分布式账本\n\n任何公共账本参与者的交易通常都可通过分布式账本获得。信息几乎无处遁形。但对于其他类型的区块链，存在一些差异。尽管存在这些差异，但拥有适当访问权限的人可以看到账本中发生的所有事情。原因在于系统上的用户维护网络，而跨所有节点分布的计算能力保证了卓越的结果。\n\
  \n这也解释了为什么分布式账本被视为区块链技术的主要特性之一。它确保了更高的效率，能提供比传统中心化账本更多的优势。以下是分布式账本成为区块链主要特性的更多原因？\n\
  \n*   **验证权的归属：** 在分布式网络中，所有节点均充当验证者，这意味着它们都必须在将交易添加到数字账本之前对其进行验证。该系统确保了每个人的公平参与。\n\
  \n\n\n\n\n### 核心特性\n\n#### 管理权\n所有活跃节点都需要参与维护账本，并参与验证，以确保区块链功能正常运作。\n\n#### 无特殊特权\n\
  网络参与者不能享受来自他人的特殊优待。每个参与者必须通过正规渠道添加区块。没有人拥有更多权力，因此也没有人能享受比其他人更多的特权。\n\n#### 实时响应恶意篡改\n\
  因为没有人可以修改账本，分布式账本对篡改或可疑活动响应极佳。随着参与节点的快速更新，很容易追踪账本中发生的事情。\n\n### 去中心化\n\n我们在本章前面讨论了去中心化网络的含义。这也是区块链技术最显著的特征之一，它确保没有单个人掌控网络。\n\
  \n#### 去中心化的重要性\n\n如果你想知道去中心化的本质为何有益，以下是主要原因：\n\n*   **用户控制权**：去中心化网络确保用户对其资产拥有更多控制权。无需中介协助他们维护财产。\n\
  *   **更低的故障率**：两个显著特征有助于降低该系统的故障率，使其具有极强的容错性。首先，区块链中的所有事务都经过妥善组织，无需人工计算。在此系统中，意外故障极为罕见。\n\
  *   **高度抗崩溃**：这种网络具备抵御恶意攻击的能力。它能轻松抵御恶意攻击的一个重要原因是，黑客攻击成本极高，这使得系统具有抗崩溃能力。\n*   **无欺诈**：由于系统运行的算法，恶意行为者无法在任何区块链网络中欺骗其他参与者。没有任何单个个人或群体能利用区块链谋取私利。\n\
  \n### 安全性\n\n你在本文中反复读到区块链没有中央权威，这也意味着没有人能为了任何利益而篡改区块链网络的任何特性。加密为系统提供了另一层安全保障。那么，它是否比我们习惯的传统技术提供更多安全性？当然，密码学的使用确保了其极高的安全性。密码学与去中心化的结合为每个用户提供了多层防护。\n\
  \n如果你不确定密码学的含义，它是一种极其复杂的数学算法，可作为抵御任何攻击的卓越防火墙。在区块链网络上，所有信息都经过加密哈希处理，或者分布式账本中记录的信息隐藏了数据的真实性质。在此过程中，所有输入必须通过一个数学算法。这最终会产生一个长度固定、形式完全不同的值。\n\
  \n另一种理解方式是：网络为所有数据提供唯一标识。区块链中的每个区块都拥有其唯一的哈希值以及前一个区块的哈希值。试图修改分布式账本中的数据，也意味着要修改所有哈希\
  \ ID，这实际上是不可能做到的。\n\n### 共识\n\n使区块链蓬勃发展的因素之一是共识算法。区块链的设计结构巧妙，而共识算法正是这一架构的核心。每个区块链算法中的共识功能，是协助网络进行决策过程。共识涉及给定网络中所有参与节点的决策过程。它确保节点尽可能快、相对更快地达成一致。\n\
  \n如果你仍不确定其含义，只需将共识视为一种投票系统，确保多数派获胜，同时获得少数派的支持。正是网络的共识使其成为“无需信任”的，因此网络上的所有参与节点并不真正需要相互信任。系统运行所需的只是网络核心的算法。此外，由于共识的存在，网络上做出的所有决策都是区块链网络的双赢局面，也是区块链特性的一大优势。\n\
  \n全球各地的区块链拥有各种类型的共识算法，每种算法都有其独特的决策流程，有助于修正最初的错误。这是一种在互联网上创造公平环境的架构。同样至关重要的是，如果没有共识算法，区块链网络的核心价值将丧失，其去中心化特性可能不再有效。\n\
  \n### 哈希\n\n在区块链技术中，哈希因极其复杂而具有不可逆和不可篡改的特性。任何个人都无法通过公钥推导出私钥。事实上，输入的微小变化可能导致完全不同的\
  \ ID。在该系统中，微小的变化绝非小事。恶意行为者若要修改或破坏网络，必须修改网络中所有节点上存储的每一条数据——这可能是成千上万个节点，或是所有持有账本副本的网络参与者。\n\
  \n你考虑过同时黑入成千上万台计算机的成本吗？成本高得惊人，几乎不可能。这也解释了为什么哈希仍是区块链技术最显著的特征之一。由于极难绕过，区块链网络上的用户可以放心，没有人能轻易黑入他们的数字资产。但请记住，黑客在区块链网络中还有其他窃取资产或资金的方式。例如，如果恶意行为者窃取了你的私钥，他们就能轻易利用它窃取你的资产。\n\
  \n### 区块链技术的优势\n\n![Image](img/Image00021.jpg)\n\n区块链的优势与其特性直接相关。虽然我们在讨论特性时已看到其中一些优势，但最好看看那些跨越各行各业的优势。如果你的组织正在探索区块链的实施或已在使用区块链，则应了解该技术提供的优势。请查看下方的信息图，以了解这些优势。\n\
  \n#### 增强透明度\n\n为提高透明度，许多组织制定了更多规则和法规。然而，对于任何组织而言，在中心化系统下可能永远无法实现完全的透明度。拥抱区块链技术的组织实际上可以从中心化网络转变为完全去中心化的网络（前提是不需要中心化权威）。这将显著提升公司的透明度。\n\
  \n对于组织而言，透明度至关重要。世界各国政府也可在治理或选举过程中提高透明度。关于区块链在投票中的应用，我们将在后续讨论区块链技术的不同用例时详细介绍。\n\n\
  #### 极速结算\n\n\n\n\n我们都知道传统银行系统的性质非常缓慢。在某些情况下，处理交易需要在完成所有结算后耗时数天。此外，传统银行系统非常容易被篡改。这就是区块链发挥作用的地方，因为它确保了更快的结算，并对传统银行系统进行了显著改进。有了它，用户可以相对更快地转移资金，并在一天结束时节省大量时间。\n\
  \n这是使区块链成为外籍工人绝佳解决方案的功能之一，这些工人居住并工作在另一个国家，而他们的家人生活在祖国。他们的资金往往需要很长时间才能到达家人手中，尤其是在急需用钱的时候。有了区块链，向亲人汇款变得极快，并且借助智能合约，各种形式的结算都能比传统系统更快地进行。我们将在第\
  \ 12 章更深入地探讨区块链技术如何影响金融领域。\n\n#### 区块链降低成本\n\n为了管理现有系统，企业花费了大量资金，这也是他们越来越多地寻找方法、不仅将资金用于业务管理，还用于改进其系统流程的独特方式的主要原因之一。区块链有潜力降低企业成本，因为第三方供应商构成了企业额外成本的主要来源。由于区块链不需要中心化参与者，实际上不需要供应商成本。此外，在验证交易时，所需的交互更少，这甚至消除了执行最基本任务时花费更多资金的必要性。\n\
  \n### 区块链的劣势\n\n围绕区块链优势的炒作可能会让许多人认为它没有任何劣势，但事实并非如此。就像地球上的其他事物一样，区块链也有一些劣势。\n\n####\
  \ 51% 攻击\n\n其中之一是 51% 攻击。当然，在过去十年中，工作量证明共识机制成功保护了比特币区块链免受黑客攻击。但区块链容易受到一些潜在攻击，这些攻击可能会影响其运行，其中之一就是\
  \ 51% 攻击。当一个人或一群人设法控制了某个区块链网络超过 51% 的算力时，就会发生 51% 攻击。这最终会赋予他们以任何他们想要的方式影响网络的权力，通过故意修改或排除交易的排序。\n\
  \n比特币区块链尚未遭受成功的 51% 攻击，尽管这在理论上是可能的。这是因为对于矿工来说，试图攻击比特币区块链将变得越来越困难，因为他们仍在因在网络中的诚实行为而获得奖励。但你应该记住，如果\
  \ 51% 攻击成功，攻击者可以更改最近的交易——这将仅限于一段时间，因为所有区块都通过加密证明相互链接。因此，将需要极高水平的计算能力。\n\n#### 数据难以轻易修改\n\
  \n第二个挑战也是区块链技术的优点之一，那就是其不可篡改特性。一旦数据被添加到区块链，就极难修改它。当然，这种稳定性特征并不总是好的，因为可能需要更改记录，而这将是一项艰巨的任务。要更改区块链代码或数据，网络可能不得不选择硬分叉。硬分叉涉及一个过程，即网络放弃旧链并采用新链。硬分叉的一个好例子是以太坊和以太坊经典。以太坊经典是以太坊社区部分成员选择保留的旧链，而被采用的新链就是我们现在所知道的以太坊。\n\
  \n#### 私钥\n\n区块链中公钥和私钥的使用保证了个人对加密货币单位或存储在区块链中的任何数据的所有权。每个公钥都有一个对应的私钥。公钥可以共享，但私钥不行，因为它需要被安全地保管，远离公众视线。虽然黑客极难攻破区块链，但黑客获取人们的私钥通常并不困难。\n\
  \n由于私钥授予任何人访问资金或资源的权限，它们就像个人银行一样。一旦私钥落入不法分子手中，资金就会丢失。此外，也发生过许多人丢失或忘记私钥的案例，这意味着该账户中的所有资金都将丢失，且绝无任何人能做任何事情来找回它们。\n\
  \n#### 存储\n\n请记住，我们将区块链描述为一个存储条目的数字账本。然而，随着存储在区块链中的信息越来越多，它将变得非常庞大。这一问题的一个很好的例子是比特币区块链，它需要约\
  \ 200 GB 的存储空间。区块链体积的当前增长似乎对我们大多数人的硬盘来说变得太大了。这意味着，一旦区块链变得太大，参与者无法下载和存储，网络将面临失去大量节点的风险。\n\
  \n尽管存在缺点，但区块链技术的优势远大于其劣势，这就是它不仅会长期存在，而且将改变我们存储文件方式的原因。了解优势和劣势将使您能够就最适合您业务的区块链做出正确决策。在下一节中，我们将介绍区块链有潜力彻底变革的一些领域。\n\
  \n## 第 6 章：智能合约的出现\n\n![Image](img/Image00022.jpg)\n\n显然，人们对区块链技术实用性的乐观情绪高涨。2019\
  \ 年，一家全球咨询公司对来自全球约 12 个不同国家的 1,386 名高管进行了调查。调查揭示了关于区块链的有趣事实；例如，它显示超过 80% 的受访者同意区块链确实具有引人注目的商业用例。他们还相信该技术将实现主流采用。\n\
  \n但在 2018 年至 2019 年间，实施区块链部署的受访者人数有所下降。2018 年约为 34%，第二年下降至 23%。有趣的是，约 95% 的受访者认为，区块链技术中中等或高度重要的一个方面是智能合约。我们将在本章讨论智能合约，我在第一章中简要介绍过它。请记住，智能合约是在比特币创建后，作为第二代区块链的一部分出现的。\n\
  \n### 智能合约的历史与基础\n\n智能合约已经存在了二十多年，但许多人是在以太坊区块链推出时才了解它的。20 世纪 90 年代中期，尼克·萨博发表了几篇论文，成功构想了智能合约的概念。这位计算机科学家在论文中将其描述为：\n\
  \n> “一组以数字形式指定的承诺，包括履行这些承诺的协议。”\n\n智能合约的目标是捕捉合同中具有算法性质的关键要素，并通过密码学防止协议被篡改。简单直接地说，我们可以将智能合约视为一种自动化且可强制执行的协议。虽然智能合约因计算机而可自动化，但其某些方面可能需要人工输入或控制。通过查看萨博对智能合约的定义，我们可以找到智能合约的关键要素。\n\
  \n\n\n\n### 智能合约：定义与运作\n\n智能合约包含*“一组承诺”*，这些承诺可能是合同性的，也可能是非合同性的——这取决于智能合约的模型。此外，这些承诺可能包含基于规则的操作和/或为执行业务逻辑而确立的合同条款。\n\
  \n定义中的第二个要素是“以数字形式指定”。这也意味着智能合约主要以电子形式运行，由若干行代码以及有助于规定正确条件和结果的软件组成。所有合同条款和/或功能性结果均以代码形式添加到软件中。\n\
  \n此外，萨博定义中使用的“协议”以算法的形式出现，该算法确立了管理所有利益相关者处理与智能合约相关数据方式的特定规则。它还指基于规则和技术赋能的操作，允许执行某些动作，如释放付款。智能合约的核心组成部分之一与自动履行有关。\n\
  \n我们也可以考察国际金融公司（IFC）提供的智能合约定义。他们将其定义为*“运行在区块链上的自执行软件代码。”* 根据这一定义，我们将主要关注基于区块链的智能合约。当智能合约与分布式账本技术结合时，有可能提供一种高效、自动化且透明的方式来执行多种合同流程，特别是在无需依赖中介机构的情况下跟踪协议履行情况。\n\
  \n因此，基于我们迄今看到的两个定义，我们可以得出结论：智能合约简单来说就是基于区块链的计算机协议。这些协议以数字方式促进两方或多方之间协议的控制、验证和实际执行——绝对不需要中介机构。\n\
  \n#### 智能合约如何运作\n\n![Image](img/Image00023.jpg)\n\n起点是合同双方达成一致。此时，所有参与方需要识别商业机会和预期结果。他们识别的机会通常是以某种方式使所有参与方受益。在这种情况下，协议可能包括资产互换、权利转让、业务流程等。\n\
  \n一旦合同双方识别了机会领域和期望结果，下一阶段涉及设定智能合约的条件。智能合约的参与方可以自行发起，也可以在满足特定条件时发起，例如自然灾害、金融市场指数或任何特定事件。此外，时间条件实际上可以在宗教节日、生日或假期发起智能合约。\n\
  \n下一阶段涉及编写业务逻辑代码，如果双方无法自行处理，开发人员可以负责智能合约的这一方面。它涉及一个计算机程序，以确保在满足条件参数的那一刻自动执行安排的方式编写。然后消息将通过区块链加密传递，以帮助验证和认证智能合约中所有利益相关者之间的消息。一旦开发人员编写好智能合约，则所有利益相关者同意的一方将验证智能合约，并继续将协议记录在区块链上。\n\
  \n托管智能合约的区块链类型也将决定智能合约的性质。如果托管在以太坊等公共/无许可区块链上，智能合约中的交易将对公众可见。\n\n第四步涉及执行和处理。在区块链迭代中，节点就智能合约的认证和验证达成共识后，智能合约将被写入区块。此时，智能合约评估数据并自动执行或失效——协议条款将决定结果。然后网络将在智能合约执行后更新所有节点以反映新状态。一旦智能合约经过验证并发布到区块链网络，其记录就无法被篡改。\n\
  \n托管在区块链上的智能合约的第三阶段涉及智能合约通过数据库服务（如金融机构账户或数据源）连接外部数据源。智能合约中包含的最常见语句是简单的*“如果/当……那么……”*语句。这些语句随后被编写为首选区块链网络上的代码。一旦预定条件得到满足并验证，节点网络将执行相应动作。\n\
  \n动作示例包括登记汽车、向正确个人释放资金、发行票据，甚至发送特定通知。一旦节点执行动作，该信息将在区块链上更新以显示已完成。只要需要说服参与者任务已成功完成，智能合约中可能存在多项约定。\n\
  \n在确立条款的过程中，所有各方需要确定其数据和交易在所选区块链平台上如何表示。他们还需要就将管辖其所有交易的*“如果/当……那么……”*规则达成一致。合同各方需要就之一下重要因素达成一致，即所有可能的例外情况，并在出现争议时，就适当的争议解决指南达成一致。\n\
  \n除了可以协助编写智能合约的开发人员外，随着行业的发展，正在出现更多选择。例如，越来越多将区块链用于业务的公司现已开发出模板、精美的 Web 界面以及其他在线工具，有助于简化和构建智能合约。\n\
  \n#### 智能合约的效率与优势\n\n随着技术的不断改进，智能合约的优势数量在未来可能会进一步增加。与传统安排相比，智能合约提供了多项优势，例如：\n\n\
  *   **准确性提高：** 智能合约的前提之一是详细显式记录合同的所有条款和条件。单一遗漏可能导致交易错误，因此自动化合约有助于防止手工填表的弊端。\n* \
  \  **沟通清晰：** 由于陈述合同条款需要准确性，一切都是显式的。这消除了沟通不畅或误解的可能性。因此，合同双方可以降低因沟通鸿沟导致的低效率。\n*  \
  \ **速度：** 与涉及文书工作的传统合同不同，智能合约运行在软件代码上，并在互联网上实时进行。这也意味着我们可以快速轻松地执行它们。智能合约的执行速度有助于减少传统业务流程浪费的工时。*有了智能合约，无需手工处理文档，因为一切都以数字化方式完成*。由于智能合约执行速度的提高，企业将以更高的效率运营。更高的效率将进一步导致单位时间内处理更多创造价值的交易。\n\
  \n\n\n\n\n#### 无需纸质文档\n\n全球大多数政府和组织面临的主要问题之一是气候变化。我们越来越意识到自身活动对地球的影响。这也凸显了无纸化交易的必要性，因为智能合约支持“go-green”环保运动。所有交易均在虚拟世界中进行，通常无需使用大量纸张。\n\
  \n#### 存储与备份\n\n交易的每一个关键细节都会在智能合约中被妥善记录。智能合约的不可篡改性意味着，交易双方任何时候若需使用合约细节，均可随时调取，因为记录是永久的。与依赖纸张且未来可能丢失的传统存储方式不同，即使一方丢失数据，交易的所有属性也能轻松恢复。\n\
  \n当智能合约经过妥善编码，且所有条款条件清晰列出时，它有潜力显著减少甚至消除对法院和诉讼的需求。当各方使用自执行合约时，即承诺遵守底层代码的所有规则。\n\n\
  #### 降低交易成本\n\n> “智能合约所解决的成本，被经济学家归入‘交易成本’这一统称之下。” —— Nick Szabo\n\n智能合约有助于降低的交易成本，是指在经济交换过程中产生的衡量、执行和讨价还价成本。智能合约的显著特点在于，它们减少了组织和企业对现有传统机构（如金融机构和第三方执行机制）的依赖，而这些机构原本是促进经济交换所必需的。执行成本或许是智能合约帮助降低的最常见交易成本类型。那么，什么是执行成本？\n\
  \n这些成本与维护和使用第三方执行机制的服务有关，此外还包括持续监控和验证经济协议的过程。智能合约通过三种方式尝试削减执行成本，其中之一是通过自执行和不可篡改性提高违约成本。这有助于降低不确定性、违约可能性，并最终减少维护和使用昂贵中介机构作为执行机制的需求。智能合约还可以通过利用自动化协议来降低执行成本，同时提高监控和验证的速度与准确性。\n\
  \n智能合约降低成本的另一种方式是利用区块链技术，它提供了一个透明的交易监控平台，且所有利益相关者均可访问，从而消除了昂贵复制的需求。通过增强对合约履约的信心和透明度，智能合约还可以降低讨价还价和结算成本。\n\
  \n#### 为企业和消费者创造价值\n\n企业和个人均可通过自执行、自动化、分布式访问、验证和不可篡改性从智能合约中获益。它可为金融机构带来多项效率提升，如改进风险管理、降低运营成本、增强协调等。例如，增强自动化可为金融机构减少实体文档、操作风险和运营成本。\n\
  \n不可篡改性和自执行可降低对手方风险和操作风险。对于金融机构的客户而言，他们可享受多项益处，可能表现为服务成本降低、时效性提升、获取各类产品和服务的机会增加、交易透明化等。但请注意，只有当金融机构同意与客户分享效率增益时，客户才能享受到智能合约带来的这些红利。\n\
  \n### 主流智能合约平台\n\n智能合约虽具通用性，但企业也可从头设计以满足特定需求。从零设计智能合约要求开发者编写代码。但也有公司允许企业和个人在其平台上建立智能合约，并通过收取费用获利。使用这些区块链网络的费用取决于智能合约所需的处理复杂度。因此，流程更复杂的智能合约支付更多费用，反之亦然。\n\
  \n若您打算使用区块链领域的智能合约平台，应根据所需的独特功能考虑以下平台。\n\n#### Ethereum\n\n可以大胆地说，Ethereum 是全球领先的智能合约平台，且一直是大多数开发者的首选。自\
  \ 2015 年推出以来，尽管面临诸多挑战，Ethereum 仍保持稳定增长。许多人通过其代币 Ether 了解 Ethereum，但鲜有人知其为领先的智能合约平台。Ethereum\
  \ 智能合约的有趣之处在于其标准化程度之高，以及平台提供的卓越支持。\n\n该平台制定了一套明确规则，供开发者在开发智能合约时遵循。在所有现存的智能合约平台中，Ethereum\
  \ 网络拥有最大的市值，核心开发团队在改进智能合约的创建和运行方面展现了高度承诺。这也是他们推出智能合约编程语言 Solidity 的原因。有趣的是，随着 Ethereum\
  \ 2.0 的全面部署，平台还将允许其他流行编程语言，使开发者编写智能合约更加容易。\n\n##### Ethereum 平台面临的挑战\n\nEthereum\
  \ 平台面临一些挑战。英国和新加坡的研究人员进行的一项调查发现，Ethereum 网络上有 34,000 个智能合约存在漏洞。不过，Ethereum 开发团队已迅速处理了大部分漏洞。另一个主要问题是容量。\n\
  \n该平台多次满负荷运行，这困扰着希望确保合约处理不延迟的开发者。使用 Ethereum 网络的开发者可享受以下特性：\n\n*   为开发者提供直观的指南\n\
  *   智能合约部署免费，但交易手续费（以 Gas 形式）另计\n*   拥有支持性的开发社区\n*   Ethereum 代币标准（ERC-20）\n*  \
  \ 提供面向用户的文档/帮助\n*   许多智能合约开发者拥有使用 Ethereum 区块链的经验\n\n在考虑是否使用 Ethereum 网络时，应注意该网络经常过载，尽管团队正努力从\
  \ Proof-of-Work 向 Proof-of-Stake 共识机制过渡，这应能使网络更具扩展性。此外，该平台成本高于其他平台。\n\n#### Hyperledger\
  \ Fabric\n\n\n\n\n#### Hyperledger Fabric\n\nHyperledger Fabric 无疑是以太坊的竞争对手之一，且该平台近年来人气大增。该智能合约平台由\
  \ Linux 基金会于 2015 年创立，作为一个开源项目。该平台的目标是成为一个开源项目，支持基于区块链的分布式账本的开发。目前该平台正在开发的框架包括 `Hyperledger\
  \ Sawtooth`、`Hyperledger Burrow`、`Hyperledger Indy` 和 `Hyperledger Fabric`。\n\n\
  对于正在探索使用哪个智能合约平台的开发者来说，Hyperledger 可能是一个绝佳选择，原因有几点。随着时间的推移，该平台已被证明是以太坊的可靠替代方案。`Hyperledger\
  \ Fabric` 是一个许可制区块链基础设施，支持智能合约的执行。因为它是许可制网络，所有参与者都具有已知身份，这使其成为组织在创建智能合约的同时，遵守要求身份已知的数据保护法律的理想解决方案。\n\
  \n使 Hyperledger 独特且更灵活的功能之一是，开发者只需安装合适的模块，即可使用 JavaScript 以及其他常见编程语言创建智能合约。因此，在该平台上，开发者无需像依赖\
  \ `Solidity` 那样仅依赖一种语言就能编写智能合约。\n\n##### Hyperledger Fabric 的挑战\n\n与以太坊不同，该平台缺乏自己的代币系统，虽然此功能提供了诸多优势，但也有其缺点。例如，它限制了可在该平台上开发的智能合约类型。对于希望开发需要支付转账的智能合约（如\
  \ ICO）的公司或组织来说，以太坊将是更好的选择。您将在 Hyperledger 中发现的其他主要功能包括：\n\n*   许可制成员资格\n*   可靠性能\n\
  *   支持插件组件\n*   开源且免费使用\n*   开发者可使用多种语言编写智能合约\n*   由 IBM 支持\n\n如前所述，该平台的一个主要缺点是缺乏代币系统。\n\
  \n#### Nem\n\n一些开发者偏爱 Nem 的原因之一是它是用 Java 编写的，而 Java 是一门广为人知的编程语言。因此，无需专门为区块链平台学习一门新编程语言（如\
  \ `Solidity`）。一些开发者偏爱该平台的另一个充分理由是 Java 实际上更成熟，因此与较新的编程语言相比，安全漏洞更少。\n\n大多数安全专家透露，Nem\
  \ 发布的 `Mijin V.2` 更新使该区块链网络成为区块链领域最安全的智能合约平台。除了改进 NEM 区块链外，该更新被视为一个行业里程碑，开启了分布式账本数据库功能新可能性的时代。Nem\
  \ 最大的卖点或许在于其高度可扩展。例如，以太坊每秒处理约 15 笔交易 (TPS)，而 Nem 每秒可处理数百笔交易。这就是为什么越来越多的开发者被 Nem\
  \ 吸引。请看 Nem 关键特性的总结：\n\n*   卓越性能\n*   Java 语言使其易于使用\n*   可扩展\n*   无平台专用语言\n\n尽管有其优势，但也存在一些缺点，其中之一是工具不多。由于其使用的代码并非基于区块链，该平台去中心化程度较低。最后，与其他平台相比，Nem\
  \ 的开发者社区也较小。\n\n### 选择智能合约平台时需考虑的因素\n\n如果您有兴趣选择一个智能合约平台，区块链领域有很多可供选择。我们刚刚探讨了其中几个，但在选择之前，有几件事您需要考虑。\n\
  \n#### 考虑平台的声誉\n\n多年来，对于想要创建加密代币的人来说，以太坊已比其他智能合约区块链平台更受欢迎。以太坊的开发者团队创建了 `Ethereum\
  \ Virtual Machine` (EVM)。它是一个图灵完备系统，任何人都可用于开发区块链应用。以太坊拥有丰富的生态系统，使开发者创建去中心化应用 (dApps)\
  \ 更轻松。\n\n如果您需要通过去中心化实现安全性，以太坊也是最佳选择，这是因为它使用了 `PoW` 共识机制。目前，大量去中心化金融项目使用以太坊平台。随着向\
  \ `Ethereum 2.0` 的过渡，这也将把区块链从 `PoW` 过渡到 `PoS`，可扩展性问题将得到缓解，平台安全性将进一步提高。\n\n#### 如果您不需要代币\n\
  \n事实是，并非所有项目都需要加密代币。如果您的项目属于这一类，那么您很可能对需要许可制区块链的用例感兴趣。例如，如果您正在尝试开发供应链保障系统，则不需要加密代币。适合您项目的最佳智能合约平台类型是企业级区块链解决方案，此类平台之一是\
  \ `Hyperledger Fabric`。像 `Quorum` 这样的智能合约平台将适合对金融科技特定用例感兴趣的公司。`Quorum` 也是一个企业级区块链平台，在\
  \ JP Morgan 的协助下开发。2020 年，ConsenSys 收购了该公司。\n\n## 第 7 章：区块链技术及其挑战\n\n![Image](img/Image00024.jpg)\n\
  \n多年来，有兴趣进入区块链领域的公司名单持续增长。尽管分布式账本技术有许多优势，但在普遍采用之前，它仍需克服几大障碍。这些挑战范围从缺乏适当监管到可扩展性低，以及合格人员不足。在本节中，我们将梳理区块链技术面临的技术和组织挑战，并了解第三代解决方案为应对其中一些挑战所做的实施。\n\
  \n### 区块链技术的主要挑战\n\n多年来，区块链技术主流采用面临的挑战之一关乎声誉。目前，大多数人将区块链技术等同于比特币和加密货币。不幸的是，世界仍将加密货币（并由此关联区块链）视为欺诈、投机者、黑客和恶意行为者的代名词。我们将同时探讨非技术或组织层面的挑战，以及技术层面的挑战，如缺乏互操作性、与遗留系统集成困难、可扩展性问题、分布式账本技术的复杂性以及人才短缺。\n\
  \n企业层面的一些组织挑战包括对技术缺乏足够的认知和理解、缺乏良好的治理、缺乏用户体验等。我们将探讨大多数挑战，以及区块链领域为应对其中大多数挑战所做的努力。\n\
  \n#### 形象挑战\n\n\n\n\n# 区块链技术面临的挑战\n\n#### 形象问题\n\n事实上，区块链技术面临的主要挑战之一是形象问题。正如第一章所述，中本聪发布比特币白皮书使区块链因比特币而普及。这为更多区块链项目打开了大门，随后区块链便与加密货币联系在了一起。我们也见证了多个诈骗加密项目掠夺人们的辛苦钱。许多人认为涉足加密货币的人都是利用该技术从事犯罪活动的骗子和黑客。\n\
  \n加密货币领域的负面形象正反映在区块链技术上，导致许多组织和个人在采用该技术前慎重考虑。大众需要理解比特币、以太坊、莱特币等加密货币与比特币区块链、以太坊区块链等区块链之间的区别。本书的目的之一是进一步启迪人们了解区块链的含义，以及如果更多个人和公司采用它，将对我们的世界产生何种影响。\n\
  \n区块链不同于加密货币，事实上，加密货币只是分布式账本技术的一个应用示例。在下一节中，我们将探讨区块链在全球不同行业的其他用例。随着更多人获得启迪，我们将见证人们对区块链负面看法的显著减少，这反过来将增加他们拥抱区块链的意愿。\n\
  \n值得欣慰的是，不同行业在区块链领域的多项合作倡议正带来积极变化，此类倡议和相互依存是推动区块链领域走向全球主流采用的绝佳方式。\n\n#### 主流企业恐惧区块链的颠覆性\n\
  \n大多数组织对区块链的颠覆性感到不适。对于一些觉得会因区块链技术而失去市场份额或最终被淘汰的企业来说，这甚至成了一种噩梦。区块链涉及 80% 的业务流程变革和\
  \ 20% 的技术实施。这意味着从传统任务执行方式的彻底转变。这也适用于多年来见证数字技术显著变革的大多数行业。\n\n请记住，区块链技术消除了对中心化权威的依赖，将信任和权威置于去中心化网络中。强大中心机构失去控制权令人不安，许多人宁愿对抗这种趋势。当然，我们可能无法完全知晓区块链实施将颠覆哪些行业和机构，以及将影响业务的哪些领域。这意味着*需要一种富有想象力的方法，以帮助发掘分布式账本技术提供的巨大机遇，以及它将如何改变我们的生活。*\n\
  \n#### 成本与效率\n\n毫无疑问，区块链网络能高效快速地执行点对点交易，但这伴随着高昂的总成本，尽管不同区块链的成本各异。以目前采用 PoW 共识的比特币区块链为例，运行验证交易并在公共账本间共享交易的节点成本巨大。估算显示，比特币网络验证和共享交易的年成本约为\
  \ 6 亿美元，且该数字持续增加。事实上，该估算不包括购买专用挖矿硬件的成本。\n\n除了成本，比特币价格下跌的部分原因是对比特币挖矿对环境影响的担忧。这意味着任何希望实施区块链解决方案的组织都需要在做决定前仔细权衡。这一挑战通常被称为*“区块链悖论。”*\n\
  \n#### 安全与隐私\n\n尽管比特币等区块链提供假名性（因为网络上的交易与钱包而非人关联），但许多潜在应用更倾向于明确与人身份关联的智能合约和交易。这将导致存储和访问分布式账本上数据的隐私及安全问题。提高区块链技术的接受度还要求利益相关者基于信任、安全和价值的概念，主动解决隐私问题。每个希望使用区块链的组织都必须审视隐私和安全如何影响区块链解决方案的设计。\n\
  \n#### 既得利益集团的既得利益\n\n区块链创新者必须克服的最大障碍是现有法规。因为大多数现有法规主要偏向现任者及其既得利益，而非新进入者——区块链公司。信息数字化进程正在高强度的监管环境下进行。这并不奇怪，因为政府长期确立的权威主要是为了保护消费者和财产权。\n\
  \n全球监管机构因分布式账本技术面临新挑战，正在探索保护消费者和市场的方法。遗憾的是，全球主要经济体监管机构的僵化做法仅抑制了该领域的增长和创新。然而，随着政府对区块链的价值产生兴趣，监管机构的观点正逐渐转变。\n\
  \n越来越多的国家正在探索创建央行数字货币（CBDC），中国处于领先地位，已在部分城市测试数字人民币。随着政府看到区块链技术的更多益处，最终将建立支持创新理念和项目同时保护消费者的监管模式。该领域法规的建立将进一步改善公众对区块链技术的看法，并促进采用。\n\
  \n#### 法规\n\n法规在应对技术进步时总是滞后，比特币区块链等许多技术在试图解决传统系统固有的低效做法时，设法规避了监管。然而，区块链解决问题的方法减少了监管，这实际上是其诞生的动因之一。中心化系统在面临自身问题时，始终充当某种*“减震器”*。\n\
  \n另一方面，去中心化网络可能不如中心化系统对冲击具有韧性，如果在解决方案设计中不加以充分考虑，这会直接影响参与者。这解释了为什么许多人建议区块链应用应在现有监管框架内运行，而非绕过它们。这意味着不同行业的监管机构必须清晰理解分布式账本技术及其对各领域消费者和企业的影响。\n\
  \n#### 与遗留系统集成\n\n\n\n\n##### 区块链与遗留系统的集成\n\n企业组织面临的挑战之一是将区块链与遗留系统集成。对于希望使用区块链的公司而言，它们需要对原有系统进行彻底重构，或者想出一种同时集成这两种技术的方案。但这种集成面临的挑战是缺乏熟练的开发人员，因为大多数公司无法获得所需的区块链人才来协助完成这一过程。\n\
  \n当然，它们可以通过聘请外部服务来应对这一局面；然而，区块链领域的大多数解决方案要求有意向的公司投入大量资源和时间，才能实现成功的过渡。\n\n另一个令大多数组织望而却步的因素是，在向分布式账本技术过渡期间，数据泄露和丢失的发生率很高。大多数公司在修改数据库时通常非常谨慎和保守，他们这样做是有充分理由的。他们试图避免数据损坏或丢失的风险，因为这可能会对其运营产生负面影响。区块链领域也在致力于开发解决方案，以允许遗留系统连接到区块链后端。\n\
  \n此类解决方案的一个杰出范例是 `Modex Blockchain Database`。该产品旨在帮助缺乏相关技术显著知识的个人享受分布式账本技术的诸多优势，并消除因敏感信息丢失而可能面临的任何障碍。\n\
  \n#### 分布式账本技术仍不成熟\n\n区块链和 DLT 总体而言仍是一项不成熟的技术，这也解释了为什么它面临着多项实施挑战。这引出了区块链技术面临的一些技术挑战。\n\
  \n##### 可扩展性\n\n可扩展性无疑是区块链领域面临的最困难障碍之一。你可以将其简单视为缺乏规模；其含义是，与传统平台相比，分布式账本处理交易的速率受到限制。目前，大多数传统企业每秒处理数千笔交易，但大多数顶级区块链网络仍远远落后。对于私有链而言，可扩展性通常不是问题，因为受信任的参与方参与了此类网络中节点的活动，这是一种极佳的商业策略。由于网络结构的原因，`Bitcoin`\
  \ 和 `Ethereum` 等顶级区块链网络一直无法有效处理其网络上的交易量。\n\n我们能在链上处理的交易数量是有限的，这种缺乏规模的问题对于需要网络在保持低延迟的同时促进高交易吞吐量的组织来说是一个主要挑战。那么，针对可扩展性问题，有哪些可用的区块链解决方案呢？\n\
  \n###### 1. 链下解决方案\n\n许多区块链平台认为，链下解决方案将提升区块链网络的交易速度，同时去中心化和安全性也应在数字账本上得到最大化保障。如果你不理解什么是链下扩容解决方案，它是指允许在不给区块链造成过重负担的情况下执行交易的解决方案。因此，任何采用链下扩容解决方案的协议都允许其平台上的用户发送和接收资金，而交易详情不会出现在主链上。目前，许多区块链项目正在探索各种链下解决方案，试图解决可扩展性问题，我们将了解其中一些。\n\
  \n###### 2. 加速芯片\n\n`Skynet Core` 是加速芯片领域的先驱，该解决方案可提高确认速度和交易速度。该项目专注于解决区块链技术采用面临的挑战以及物联网\
  \ (`IoT`) 的功能性问题。`Skynet` 的核心目标之一是提供一个端到端系统，这包括一个极具扩展性的 `IoT` 区块链网络和一个免许可的区块链 `IoT`\
  \ 芯片，称为 `Skynet Core`。\n\n该项目旨在提供数十亿个免许可的区块链芯片，它们将被部署到全球各地的设备上，并通过公司的区块链网络进行连接。这种免许可的区块链芯片旨在取代我们目前使用的\
  \ `CPU`，它拥有为分布式账本技术和 `IoT` 优化的核心。借助该硬件，`Skynet Core` 设备能够为数字货币防盗提供充分保护，并轻松运行高吞吐量的区块链网络。\n\
  \n###### 3. 侧链\n\n解决可扩展性问题最有前景的解决方案之一是使用侧链。它本质上是一条独立的区块链，但不是一个独立的平台，因为它以某种方式锚定在主链上。因此，侧链和主链具有互操作性——资产可以在两条链之间自由流动。创建侧链的主要原因是减轻区块链网络所承受的负载。实现这一点的方法是将交易通过所有关联的侧链发送，并将交易的最终状态添加到主区块链上。这种机制有助于减轻主区块链处理大量交易的负担。\n\
  \n为了确保资金转移，存在多种侧链解决方案。例如，某些解决方案将数据从主链移动到一个特殊地址，同时在侧链上发行等量的资产。另一种选择是将资金发送给托管方，由其将存入的资金兑换为侧链上的资金。\n\
  \n###### 4. 分片\n\n`Ethereum` 是探索使用分片作为扩容解决方案的区块链网络之一。分片简单来说就是将计算和存储需求从单一区块链网络分散到单个节点上。采用分片的网络会将其区块链分割成多个独立的区域，称为分片。网络会为每个分片分配一小组节点进行维护。\n\
  \n这意味着网络上的节点不必处理整个网络的交易负载。每个节点只需维护与其分片或分区相关的信息。分片的使用消除了区块链网络中每个节点都必须参与交易的必要性。\n\n\
  ###### 5. 多层结构\n\n这也是区块链项目正在致力于的解决方案之一，旨在帮助提升规模。它指的是将区块链技术的两个独立方面——交易处理和数据存储——进行隔离。`Cardano`\
  \ 就是致力于该解决方案的区块链网络之一。该项目通常被视为第三代区块链，是一个去中心化的开源区块链项目，具有分层结构。其结构包含两个关键要素：`Cardano\
  \ Computational Layer (CCL)` 和 `Cardano Settlement Layer (CSL)`。\n\n该项目的双层架构使 `Cardano`\
  \ 独树一帜，因为大多数现有的区块链网络都在单层上运行，这最终会导致网络拥堵、降低交易速度并导致费用飙升。`Cardano` 的结算层处理交易确认以及原生代币的流动。另一方面，网络的计算层负责维护网络安全。此外，它还处理智能合约的部署，核心开发人员将其编程为能够识别数据的身份。\n\
  \n##### 因缺乏标准化而导致的有限互操作性\n\n\n\n\n\n###### 互操作性：区块链面临的重大挑战\n\n互操作性是区块链领域面临的一大挑战。目前有超过\
  \ 6,500 个项目利用不同的区块链平台（其中大多数是独立平台）和解决方案，它们拥有不同的编码语言、协议、隐私措施和共识机制。由于存在许多不同的网络，且缺乏一个通用标准来允许这些网络之间进行适当通信，区块链领域无疑处于一种混乱状态。\n\
  \n由于各种区块链协议缺乏统一性，诸如安全性等基本流程缺乏一致性。这使得该技术的大规模采用变得非常困难。建立针对不同区块链协议的行业标准，有助于企业验证概念验证、协作开发应用程序并共享区块链解决方案。这也将有助于使区块链平台与现有系统的集成变得轻而易举。好消息是，许多区块链项目已经在提供各种区块链网络之间的互操作性。\n\
  \n####### 主要互操作性项目\n\n目前，大多数区块链网络允许创建侧链，正如我之前提到的，侧链就是沿主区块链并行运行的区块链。但最近区块链领域的互操作性项目数量有所增加。这是为了响应不同区块链相互通信并提升技术潜力的需求。我们将看看三个优秀的互操作性项目示例。\n\
  \n######## 1. Polkadot\n\n该项目是一个高知名度的多链技术，致力于改善区块链的互操作性。Polkadot 的核心目标之一是促进智能合约数据在不同区块链平台间的传输。该项目的生态系统拥有多条“平行链”，它们本质上是独立的区块链。这些平行链在特性上各不相同，但它们仍属于\
  \ Polkadot 生态系统。\n\n考虑到网络的链数量，Polkadot 区块链上的交易分布在广泛区域。连接所有平行链的是一条中继链，Polkadot 区块链项目的目标是使公共网络、私有链以及预言机和无许可接口能够无缝连接。该互操作性项目背后的团队希望构建一个互联网，让独立的区块链解决方案能够利用\
  \ Polkadot 的中继链来交换信息。\n\n######## 2. Cosmos 区块链\n\n这个区块链互操作性项目是区块链领域最有趣的项目之一，它运行在称为\
  \ Tendermint Byzantine 的容错协议上。该项目的目标之一是成为多个项目的枢纽。其结构由多条独立区块链（称为“分区”）组成，这些分区连接到一条称为“枢纽”的中心区块链。这些分区接入\
  \ Cosmos 网络，并得益于 Cosmos 枢纽可以相互通信。此外，还可以连接新的分区。\n\nCosmos 网络互操作性项目的一个显著特点是，它允许分区保留其共识机制。在这种情况下，为每个分区提供动力的是\
  \ Tendermint Core，它除了提供安全且一致的共识引擎外，还提供了增强的性能。得益于 IBC 连接，Cosmos 区块链可以轻松连接从公共到私有项目的各种分区。\n\
  \n######## 3. 区块链工业联盟 (BIA)\n\n越来越多的区块链项目聚集在一起，授权其区块链相互通信。一个极好的例子是 BIA，这是由三个区块链项目（AION、WANChain\
  \ 和 ICON）组成的联盟，旨在允许它们的区块链相互通信。该联盟的主要目标是解决区块链孤岛问题。团队成员有一个共同的目标，即促进各个孤立区块链之间的互联互通。\n\
  \n他们主要关注跨链交易和通信的研究。他们还将专注于制定通用的行业标准，BIA 中的每个参与区块链都在致力于连接区块链协议。\n\n在我们看到区块链技术大规模实施之前，我们讨论过的现有区块链平台面临的主要问题必须得到解决。有趣的是，在短时间内，区块链在其结构和功能方面经历了快速改进。这是一项相对年轻的技术，旨在解决这些问题的新项目不断涌现，这表明区块链确实有潜力颠覆各行各业。这些障碍肯定会比我们大多数人想象的更早得到解决。\n\
  \n# 第二部分：区块链用例：区块链的趋势与发展\n\n本书并非那种声称区块链一旦被所有人全面采用就能解决我们所有问题的书籍。事实上，我必须指出，过度宣传分布式账本技术正在对该技术的长期前景产生负面影响。该技术的创新部署要求分布式账本技术的特定优势与能够促进这些优势落地的用例之间实现恰当匹配。\n\
  \n这也需要大量的辛勤工作和奉献，才能实现将被全球各行业采用的正确解决方案。这一整个过程需要相当长的时间，不可能一蹴而就。你是否属于那些被告知区块链能解决你在商业或生活中所有问题的人群？好吧，如果是，那你现在应该明白了。\n\
  \n正如我所承诺的，本部分将深入探讨区块链已被使用以及正在探索使用该技术的不同行业。大多数区块链用例仍处于构想阶段，就像一些已经处于实施阶段的用例一样。在未来几年，关于全球公司利用该技术的不同方式的某些预测将会实现，同时也会涌现出新的用例。\n\
  \n## 第 8 章：变革医疗保健行业\n\n![Image](img/Image00025.jpg)\n\n医疗保健行业（公共和私营）面临着巨大的压力，既要控制成本，又要为患者提供高质量的服务。在这种压力下，医疗保健行业要在降低成本的同时，仍提供患者期望的服务水平，并应对颠覆性技术的出现，变得越来越困难。这种日益增加的压力，就是医疗服务提供商持续寻求削减成本并同时提升护理质量方法的原因。\n\
  \n如果不利用适合医疗保健行业的正确技术进步，他们将极难跟上市场变化。一个有潜力支持医疗保健行业的技术的绝佳例子是分布式账本技术，而区块链是最佳选择。区块链技术具备解决行业面临的最大挑战之一的能力，即在不损害安全性和隐私的前提下实现患者数据传输。确实，区块链有潜力对健康管理产生积极影响。也许开始本章的最佳方式是审视其现有的挑战。\n\
  \n### 医疗保健行业面临的现有挑战\n\n\n\n\n\n### 区块链为医疗行业带来的价值\n\n新冠疫情揭示的一点是医疗行业的低效性，以及医疗保健领域急需改进。例如在美国，据估计，2017\
  \ 年医疗总支出约为 3.55 万亿美元，预计到 2025 年将超过 5.5 万亿美元。医疗保健不仅在美国，在其他国家也是一个巨大的市场。\n\n不幸的是，这一关乎我们生活的重要领域被认为效率极低。医学研究所的估算显示，医疗总支出中有\
  \ 20% 至 30% 要么是浪费性的，要么导致不良结果。那么，医疗机构是如何产生这些成本的？部分过高成本包括：\n\n*   价格虚高的医疗检测\n*   医疗欺诈\n\
  *   高昂的行政费用\n*   错失的预防机会\n*   无效的治疗\n\n据估计，医疗行业每年因医院和医生之间沟通不畅导致的服务重复，支出约 9750 亿美元。在英国，尽管\
  \ NHS（英国国家医疗服务体系）拥有价值超过缺口的未充分利用数据资产，却仍面临 300 亿英镑的资金缺口。区块链技术有助于提高医疗服务的交付效率。它还有潜力释放\
  \ NHS 数据资产的研究潜力，并带来社会效益。\n\n大多数医疗机构将患者数据孤立地存储在私立医疗机构和 NHS 信托机构的孤岛中。实际上，数据集成或共享的水平很低，无法帮助提高护理质量，也无法进一步提供更高的生产力、更快的获取途径、医学突破创新以及成本节约等其他效益。医学信息学和分析领域已见证显著增长，这也是当前向数据驱动的医学研究转变的原因之一。\n\
  \n然而，医疗领域的授权机制相当复杂，因为医疗专业人员在未获得所需同意的情况下，无法使用患者的医疗数据，而这一重复过程极其浪费时间且令人焦虑。通过利用区块链技术的优势，可以释放医疗数据的价值并享受社会效益。这需要开发一套区块链同意/授权基础设施，允许两方或多方在无需信任的环境中协作。目前数据分散在各个系统中，缺乏足够的集成或跨系统共享。\n\
  \n医疗行业面临的挑战总结如下：\n\n*   缺乏以通用病历形式维护健康数据的流线型系统。这影响了患者从医疗机构获得的治疗标准。\n*   健康数据组织混乱，处理过程往往涉及金钱并浪费时间。\n\
  *   数据意外丢失或损坏、欺诈性篡改等问题影响健康数据。\n*   由于救援活动或健康宣传活动的数据分散在各个机构中，其管理和追踪十分繁琐。\n*   医疗专业人员在工作中遇到诸多问题，其中之一是获取患者病史。这最终增加了重新诊断的工作量和时间。\n\
  *   医院及其他医疗机构在收取患者付款方面也存在问题。它们面临少付款、理赔管理和汇款管理的难题。\n*   从生产环节到患者手中，许多个人和组织参与药品流转。这导致难以辨别真伪处方与假冒药品，使患者健康面临风险。\n\
  *   为确定新药在预防、检测和管理不同疾病方面的疗效，医疗研究人员测试新疗法，并记录和存储此类临床试验的结果。然而，他们常面临记录系统不统一、研究数据被窃取的担忧、腐败、海量数据追踪困难以及数据自然损坏的可能性等问题。\n\
  \n#### 1. 区块链与临床试验\n\n通常，临床试验涉及在受控环境中测试新药以确定其有效性。这一过程往往耗时数年，对制药公司至关重要，因此它们在试验上投入巨资。事实是，制药公司在其中利害攸关，这也解释了临床试验为何面临欺诈案件。\n\
  \n在临床试验过程中，公司会提供大量数据，如医学影像、调查问卷、统计数据、血液检测等。但负责临床试验的团队面临的最大挑战之一是，他们必须妥善管理获取的数据。在中心化系统和人为因素的影响下，数据管理往往困难重重，导致错误。\n\
  \n还有欺诈问题，表现为数据篡改。系统中的恶意行为者隐瞒永远不会进入系统的关键信息，而篡改其他信息以获得期望的结果。不幸的是，大多数从事临床试验的公司永远不会披露信息篡改案例。临床试验面临的其他问题还包括甚至在试验开始前就未能共享关键信息。\n\
  \n像区块链这样的分布式账本技术可以在许多方面提供帮助。它可以通过提供数据完整性，并在验证文档真实性的过程中充当证明。区块链的分布式网络将有助于维护数据完整性，并确保未经授权访问无人能修改数据。实施这些用例的解决方案包括\
  \ Sanofi、Pfizer 和 Amgen 等。\n\n#### 2. 以患者为中心的假名健康建议\n\n区块链技术在医疗领域一个令人振奋的潜在用例，是提供假名化的、以患者为中心的，或加密的健康预警和建议。这意味着在保障患者身份安全的前提下，其健康详情实际上可以贡献给分布式账本中的数据集合。借此，可以提供针对特定患者的加密健康建议，并安全地发送给患者。发送给匿名患者的这些信息，将严格基于患者的数据、风险因素等。\n\
  \n医疗领域近期的发展越来越侧重于更以社区为中心、主动预防的护理模式，这使得上述场景更具相关性。如果您不确定什么是预防性护理模式，它旨在在伤害或疾病发生前进行预防。借助区块链技术，可以安全地以加密形式共享医疗记录，这将为理解人口健康开辟新机遇。区块链是去中心化的，这与传统医疗系统形成对比，后者有中介机构充当患者信息的巨型仓库。\n\
  \n#### 3. 理赔与账单\n\n\n\n\n\n### 区块链在医疗保健领域的应用\n\n#### 理赔与账单管理\n\n医疗保健领域面临理赔问题，事实上，账单和理赔中存在高比例的欺诈行为，其中账单受影响最严重。医院遭受这一挑战最深，因为它们经常向患者收取从未提供的服务费用，或定价高于行业标准。大多数欺诈活动都是为了增加利润，而不考虑患者利益。\n\
  \n在大多数情况下，医生和医院通过不当呈报患者健康状况加剧了这一局面。负责核实理赔的第三方往往不愿履行职责，这最终使最终用户处于医疗机构的控制之下。通常，理赔处理需要大量时间，在处理完成前，个人必须亲自前往办公室。\n\
  \n区块链技术有潜力高效管理账单和理赔流程。通过将账单流程与区块链连接，医疗服务提供商将不再因从未提供的服务而向患者超额收费或欺诈性地包含服务。由于整个流程的自动化，将不再需要第三方，理赔管理的整个流程将更快。\n\
  \n#### 4. 医疗保健中的身份管理\n\n医疗行业需要建立改进的身份管理系统。为了享受医疗领域的改进服务交付，医疗机构需要准确验证个人（包括提供商和患者）甚至组织（如学术机构、研究机构、医院和药房）的身份。区块链将为医疗领域的身份管理增加完整性和透明度。\n\
  \n这将有助于处理身份的差异版本控制，并最终促进安全识别。随着更多数据开始流入——来自物联网、可穿戴医疗设备等——医疗机构准确地将个人与其电子病历匹配将变得越来越重要。\n\
  \n对于医疗服务提供商（组织和个人）而言，提供关于其服务可用性和位置的更新和准确信息也至关重要，以便例如认证机构识别他们、付费方正确报销以及患者找到他们。通过区块链，我们可以实际提高正确信息的真实性和准确性。通过使用分布式账本，利益相关者可以创建数据记录被修改或访问的所有时间的不可变日志。\n\
  \n目前，爱沙尼亚已经通过区块链上的 `KSI` 应用程序保护政府数据（包括电子健康记录）免受内部滥用和外部网络攻击。在提供安全性的同时，`KSI` 技术也不违反数据隐私。他们将记录的任何修改与单独的电子日志进行交叉核对，这使他们能够快速验证任何可疑访问并防止潜在的恶意活动。区块链的功能就像安装在高犯罪风险地点的闭路电视摄像头。\n\
  \n当有人犯罪时，区块链不会干预；相反，它提供透明度，并使恶意行为者无法中断或修改记录（不可变性）。在健康信息系统中，当区块链技术与物联网等其他技术结合使用时最为有用。\n\
  \n2020 年，韩国旅游胜地济州岛透露，他们正在部署一个支持区块链的解决方案，以帮助追踪可能对 COVID-19 呈阳性的岛屿访问者的接触情况。访问该岛的个人需要在智能手机上下载一个应用程序，用于扫描他们在岛上停留期间使用的所有商业和服务的二维码。\n\
  \n用户一旦下载应用程序，就需要通过公共区块链确认身份，后者将颁发证书。接下来，应用程序用户将在移动设备上设置数字指纹认证和 PIN 码，私有区块链将记录所有凭证的证书。用户智能手机上的应用程序将存储这两个证书，而他们的身份详细信息不会与他们访问的所有服务和商业记录存储在同一位置。除非需要进行\
  \ COVID-19 病例的接触者追踪，否则智能手机用户的所有信息将保持私密。\n\n#### 5. 管理患者对其数据访问的同意与许可\n\n正如我们之前讨论的，医疗保健领域面临诸多挑战，其中至关重要的一项是保护患者数据及其隐私。不幸的是，由于不良做法、低效流程以及中心化系统对网络攻击的脆弱性等挑战，医院未能成功管理医疗数据。通过采用分布式账本技术，医疗机构可以应对大多数这些挑战。它们可以利用区块链驱动的系统存储和共享医疗记录的解决方案来抵御黑客。此类基于区块链的解决方案还可以帮助患者控制其健康记录。\n\
  \n区块链技术的一个极佳用例是为人们（使用其唯一凭证和加密密钥）提供一种可审计且透明的方式，授予其他方访问其健康数据的权限。他们可以授予访问其医疗记录以及其他个人信息的权限，主要用于直接医疗服务交付、数据的统计或二次用途或研究，对象包括服务提供商、医疗专业人员和该领域的所有其他相关参与者。\n\
  \n电子数据的性质决定了我们可以重复使用它们，随着新的研究问题和数据使用理由不断出现，区块链可以实现增量或“动态”同意，这将成为中心化系统常见的“一次性”同意系统的极佳替代方案。每当一个人选择修改同意条款或权限时，所有修改将作为新区块添加，从而覆盖链上最初记录的指令。\n\
  \n这一用例的一个极佳例子是马耳他生物库项目，它利用名为 `Dwarna` 的区块链技术管理人们为研究目的使用其生物标本的动态同意。他们使用 `Dwarna`\
  \ 网络门户将个人的同意存储在区块链中，这使记录永久/不可变。这种设置有助于增加信任，并激励个人向生物库捐赠样本。参与者实际上完全控制他们想要参与的具体研究，并被允许撤回同意或要求销毁其生物标本。\n\
  \n区块链如何帮助管理患者同意和数据访问权限的另一个极佳例子是 `MedRec`。它是由麻省理工学院（`MIT`）媒体实验室开发的区块链驱动系统。该系统将医疗记录与查看权限以及外部数据库的数据检索说明相关联。为了记录患者-提供商交互，该项目使用智能合约，一旦提供商创建记录，它将被验证，然后患者将授权其他人查看它。\n\
  \n\n\n\n获取新信息的人员也会收到通知（自动生成），以及指向新病历的加密指针。该系统旨在授予患者管理其数据的权限，权限存储在区块链上。该项目在疫苗接种史、用药记录、治疗干预和血液检测等领域取得了积极成果。\n\
  \n#### 6. 显著降低成本\n\n随着区块链技术的应用，医疗企业和患者将享受到显著的成本降低。当然，随着供应链效率的提高、假冒药品和产品的消除、盗窃和其他欺诈行为的预防，成本下降是顺理成章的。当医疗机构利用智能合约时，它们可以与合作伙伴有效地进行直接交易，从而省去昂贵的中介机构。\n\
  \n例如，BIS Research 2018 年的一份报告估计，随着区块链技术的广泛应用，到 2025 年，医疗保健行业最多可节省 1000 亿美元。这些成本涉及运营成本、支持职能和人员成本、IT\
  \ 成本、数据泄露相关成本、保险欺诈和假冒相关欺诈。\n\n#### 7. 实现大规模合作\n\n影响医疗保健行业的大多数根本问题，源于其对多个要素的依赖——政府、监管机构、公共和私营组织以及其他多方，仅为了维持运转。因此，整个行业通常对快速变化的状况反应迟缓。一个很好的例子是美国采用的模式，该模式高度碎片化，主要由市场力量驱动。这种模式可能会给需要变更居住地的患者带来挑战。\n\
  \n欧洲等地区也主要依赖全民医疗模式，这也有其自身的挑战。主要问题（在全球范围内）在于在各服务提供商之间、以及国家和政府之间建立无摩擦的合作。这就是区块链发挥作用的地方，因为它可以增强网络中的信息分发，促进透明度，并使合规程序变得简单明了。\n\
  \n像区块链这样的分布式账本技术可以促进行业范围内的举措，例如实施新的行业标准，并帮助协调全球力量应对 COVID-19 大流行等健康危机。事实上，跨链系统的不断发展和互操作性项目的日益增多，最终将为在全球范围内加强合作引入独特的方式。\n\
  \nCOVID-19 的爆发暴露了我们医疗机构的现状，这证实了全球各国政府和卫生组织需要一种更有效的方式来管理此等规模的健康危机。这也解释了为什么医疗保健领域的一些组织正在探索基于区块链的解决方案。例如，世界卫生组织正与\
  \ Oracle、IBM 和 Microsoft 等主要区块链和技术公司合作，推出 MiPasa。该项目是一个基于 DLT 的平台，旨在共享大流行信息。据 Cointelegraph\
  \ 披露，该平台运行在 Hyperledger Fabric 上，并致力于实现“COVID-19 病毒携带者及其热点地区的早期检测”。\n\n## 第 9 章：区块链与制药行业\n\
  \n![Image](img/Image00026.jpg)\n\n在我们所处的社会中，我们经常会质疑遇到的一切。每当我们从杂货店购买东西时，通常都有兴趣知道是否真正物有所值。这解释了为什么当你发现你在杂货店买的东西在网上甚至更便宜时，你会感到难过。我们也渴望知道我们购买的产品来自哪里、由什么制成以及由谁制造。这些是我们在购买时想了解的一些情况。\n\
  \n有趣的是，这些在医疗保健领域至关重要，因为药剂师和其他医护人员努力寻找正确的药物。不幸的是，制药供应链面临诸多挑战，药剂师必须只从信誉良好的来源采购或销售他们购买的药物。药品的信誉良好的来源必须是遵循正确分销流程的来源。药剂师还必须确保药品适合其生产的特定用途。但在制药领域采购产品通常是一项具有挑战性的任务，特别是在必须充分信任供应商以提供正确药物的情况下。\n\
  \n此外，药剂师需要确定他们购买的药品适合其生产目的，并且已得到妥善储存和运输。但由于市场上假冒药品日益增多，以及药品标签错误等问题，供应链已成为每个人的严重问题。\n\
  \n医疗保健的重点正转向更以社区为中心的模式，患者对自己健康的照料责任日益加重。这也意味着，对于渴望透明度并希望确信所接受的医疗产品质量上乘的患者来说，供应链是一个关键因素。\n\
  \n### 制药行业的现状\n\n制药行业是医疗保健最关键的部分之一。该行业估值约 4820 亿美元，没有该行业，药物开发、分销和发现将不复存在。制药行业涉及三个关键流程：发现、开发和分销。\n\
  \n![Image](img/Image00027.jpg)\n\n该行业的现状不佳，亟需彻底改革该行业的运营。行业的不佳现状也解释了为什么十个药物中有九个无法进入临床试验阶段。\n\
  \n美国的世界级医院早已面临基本医疗设备短缺的挑战。面罩、防护服和口罩等物品供应不足，为获取这些物品，医院员工被迫四处寻找可靠供应商。事态的突然升级迫使员工放弃长期建立的传统采购方式。这也意味着他们需要新供应商，寻找他们，并尽快重新分配物资。\n\
  \n这种压力暴露了困扰制药供应链已久的挑战。在美国，美国政府、FDA 和 CDC 官员曾发出警告，称当时有欺诈性呼吸器被分发，以及欺诈性 COVID-19 检测套件在网上出售。政府甚至不得不以极高的价格从未经验证的供应商处订购\
  \ N95 口罩。\n\n当然，医疗供应链面临的挑战并不罕见或新鲜，原因也不难理解。大多数药品通过复杂的全球供应链流转，其中大部分文档工作仍基于纸质和人工处理。它们经常在各个节点和边境口岸堆积，使这些医疗物资面临多种质量问题。这导致监管机构和分销商在识别进入系统的标准医疗物资方面举步维艰。\n\
  \n\n\n\n### 区块链为制药行业提供的解决方案\n\n根据世界卫生组织（WHO）的估计，全球低收入和中等收入国家每十种医疗产品（诊断试剂盒、疫苗和药丸）中就有一种是伪劣或不合格的。在某些地区，挑战在于盗窃，正如英国国家标准机构\
  \ BSI 集团所披露的，涉及医药货物的盗窃案件每年超过 10 亿美元。英国和美国实际上占所有记录在案盗窃案件的一半左右。这种情况最终可能成为医疗保健供应链的一种演练，后者未来可能面临更大的集中压力。这解释了为什么该行业更加关注分布式账本技术。\n\
  \n#### 制药行业的供应链问题\n\n医疗行业的一些专家认为，维护供应链是制药行业面临的最大障碍之一。这是一个非常复杂且充满风险的过程。与供应链相关的问题之一是假药。当有人去药房取处方药时，他们假定该药品质量上乘、在适宜条件下妥善储存、真实有效且未被篡改。不幸的是，有多起假药进入供应链的案例，这严重威胁用户的健康。为了更清楚地说明，假药包括：\n\
  \n*   成分错误的药物\n*   被盗窃的药品\n*   含有极少或无活性成分的药品\n*   被篡改的药品\n*   包装造假的药品。\n\n这里的大问题是：患者或用户如何判断他们购买的药品在运往药房的过程中是否在适宜条件下储存？用户如何判断药品是否含有正确强度和数量的药物？基于现有架构，药剂师所能做的只是依赖制造商、批发商和快递公司等各方利益相关者建立正确的程序。\n\
  \n当药品最终到达目的地（药房或医院）时，药剂师在向患者发放前，还必须确保药品真正符合相应标准。你会同意我的观点，即整个流程不够透明，因为药剂师可能需要通过审计追踪来确保药品的质量和标准，这需要相当长的时间。药房供应链中有多方参与，其中任何一方都可能显著影响最终产品的质量。\n\
  \n例如，制造商需要确保每片药片含有正确的配方、强度，并经过妥善储存。制造商还必须确保药品适合人类服用。批发商、物流公司或供应商在整个过程中也发挥着作用，他们必须确保药品质量不受湿度或温度等因素影响。他们还必须防止罪犯拦截或篡改药品，以及防止药品被盗窃。\n\
  \n#### 制药行业的区块链解决方案\n\n> “区块链在制药行业的主要用途是作为‘真相账本’，用于与监管机构、药房、福利管理者、合同制造商、医生、患者、学术研究人员以及研发合作者等共享复杂信息。”\
  \ —— Arun Ghosh（毕马威分析师）\n\n![Image](img/Image00028.jpg)\n\n正如我之前提到的，COVID-19 大流行的爆发暴露了全球医疗行业面临的挑战。受严重影响的领域之一是制药行业的全球供应链，因为在连接性和数据交换方面存在严重问题。这些都是区块链技术可以轻松解决的挑战。事实上，顶级制药巨头（辉瑞、赛诺菲和安进）正在探索有效利用区块链技术进行数据安全存储的方法，这将加快临床试验的速度，并最终降低药物研发成本。这是由于区块链显著改善制药供应链的能力所致。\n\
  \n##### 制药行业的数据差异\n\n制药行业的开发阶段也是行业的核心，因为这是公司进行实验需要数据的阶段。这将帮助他们理解并研发出治疗各种疾病的新药。但大多数制药公司在试图解决特定疾病时面临的挑战是数据差异。数据差异的成因源于长期存储的数据孤岛，这些孤岛通过链接其他平台来运作。\n\
  \n数据差异成为制药公司的主要问题的原因在于，它们必须依赖各种数据来源，却无法妥善验证不同来源共享的上传数据。导致数据差异的因素包括各数据来源和部门采用的不同结构和模型。\n\
  \n##### 制药供应链中的区块链解决方案\n\n区块链技术可以从多方面改造整个制药供应链。由于行业涉及不同的阶段和流程，可以在流程的所有阶段扫描条形码，并将详细信息存储在分布式账本中。像区块链这样的分布式账本将记录并创建药品全程的审计追踪。还可以在供应链中添加传感器，以帮助在数字账本中记录温度或湿度。这对于需要特定温度冷藏储存的药物（如胰岛素或其他特制药物）至关重要。\n\
  \n致力于利用区块链使医疗供应链更高效的项目之一是 MediLedger。基于区块链的平台的优势之一是，竞争对手可以轻松在同一平台上协作，以确保实现共同目标，例如确保药品安全或消除假冒药品。他们可以放心协作，而无需共享敏感信息。\n\
  \nMediLedger 网络是一个联盟，由包括 Genentech、Gilead、AmerisourceBergen、辉瑞、McKesson 和安进在内的 20\
  \ 多家组织支持。该项目的底层技术来自一家名为 Chronicled 的初创公司，联盟的重点在于制药供应链。MediLedger 的首个主要解决方案是一个验证系统，可简化验证正品药品真实性的流程。正如医疗分销联盟（Healthcare\
  \ Distribution Alliance）披露的，每年有超过 6000 万单位可销售药品被退回，这一流程通常非常困难。\n\n在退回药品重新销售给批发商之前，必须验证其真实性，现有流程要求批发商联系制造商协助追踪药品序列号。此过程可能长达\
  \ 48 小时才能完成。通过利用区块链，批发分销商只需使用条形码扫描器，即可在不到一秒的时间内完成相同的验证工作。\n\n这反过来会使药品立即具备商业分销资格，同时所有制造商仍保持对其数据的控制。医院和药剂师也可以使用这种快速序列号验证。医院或药房的工作人员在上架药品时验证其真实性，只需一台条形码扫描器和一个网页浏览器即可。他们不需要任何其他复杂或昂贵的基础设施。\n\
  \n\n\n\n事实上，造假者实际上可以复制条形码，试图将其冒充为合法药品；然而，分布式账本会标记此类药品，并将其记录为可疑活动。MediLedger 项目的下一阶段是利用区块链技术，帮助识别药品的具体位置，并通过“追踪与溯源”掌握药品在任何时间点所处的位置。此外，借助区块链技术，还可以在不向生态系统中的其他方泄露机密商业情报的情况下执行这一过程。\n\
  \n另一家正在探索利用区块链技术为医疗保健和制药行业提供解决方案的组织是 United Health care（优健保险）。该公司与 Optum（奥普特）一起，参与了一个制药区块链联盟，该联盟还涉及\
  \ Quest Diagnostics（奎斯特诊断）、Humana（休谟纳）和 Multiplan。该制药项目的主要目标是削减各种行政任务带来的总体成本。\n\n\
  区块链技术具备简化整个流程的能力，并能进一步协助比现有系统更频繁地更新数据库。作为制药行业的头部企业之一，Roche（罗氏）也毫不例外，他们正通过其 Genentech（基因泰克）部门与\
  \ Pfizer（辉瑞）和 Abbvie（艾伯维）合作，以改善供应链。\n\n#### 区块链与 COVID-19 疫苗分发\n\n目前，许多国家缺乏 COVID-19\
  \ 疫苗，且需要公平地分发疫苗。然而，疫苗的公平分发要求就其分发达成全球共识，并建立一个透明、及时且可验证的供应链管理系统。毫无疑问，区块链技术是处理这一极具挑战性任务的最合适技术，它能确保全球所有参与国家都是网络中的节点。这些节点有权查看所有记录，这些记录不仅会实时更新，而且不可篡改。\n\
  \n基于区块链的供应链系统可以帮助监控主要因素，如疫苗生产、分发，以及所有参与国不仅疫苗库存，还包括玻璃、冷藏设备、针头、安瓿瓶等所有其他相关物资的库存。该系统甚至可以通过查看温度控制、有效期、批次号和生产商等信息来追踪疫苗质量。该系统还能确定损耗和浪费的程度，以帮助将其降至最低。\n\
  \n毫无疑问，区块链技术备受炒作，但这丝毫不减其彻底变革各行业的潜力。要实现利用区块链技术优化制药供应链的目标，关键在于将其与其他技术以及卓越的健康信息系统一同部署。当区块链与其他技术协同工作时，它有能力提供最佳解决方案，帮助解决医疗保健行业的挑战。\n\
  \n## 第 10 章：区块链技术赋能的供应链革命\n\n![Image](img/Image00029.jpg)\n\n我们生活在一个日益数字化的世界中，各种新兴技术为在不同领域推动商业价值打开了大门。分布式账本技术正扩展至各个行业，供应链便是其中之一。我们可以通过利用数字账本技术显著增强供应链能力，从而提升绩效水平。当区块链技术与人工智能\
  \ (AI)、智能合约或物联网 (IoT) 等其他下一代技术相结合时，它可以成为一种极其有效的赋能技术。要探讨区块链如何彻底改变供应链管理，关键在于审视该行业的现状。\n\
  \n### 供应链面临的当前挑战\n\n在审视该行业面临的挑战之前，有必要先解释什么是供应链管理，以确保您对我们讨论的内容有清晰的认识。供应链管理涉及规划产品、服务和货物（包括资金和数据）流动的过程。这涵盖了从原材料采购、制造阶段，到最终将产品分发给消费者（即最终目的地）的所有活动。为方便起见，我将使用\
  \ SCM 作为供应链管理的缩写。\n\n大多数 SCM 方面的处理方式，对公司在服务感知、产品成本、上市速度和营运资金需求等不同领域的竞争定位有重大影响。由于业务全球化日益加剧，公司正在寻找独特的方法来精简其供应链，以提高效率，满足消费者需求不断变化的本质。\n\
  \n然而，根据 2016 年发布的一篇德勤文章，相当多的公司认为，它们尚未准备好应对这些数字化趋势将在各行业引发的颠覆。许多组织认为，约 40% 的《财富》500\
  \ 强企业可能在十年内因这种颠覆而不复存在。2016 年调查结果的含义是一个强烈的信号，表明商业领袖面临着越来越大的压力，必须转型其现有供应网络，降低成本，在竞争日益激烈的世界中增加价值和效率。\n\
  \n供应链行业的专业人士将该行业面临的大多数挑战归纳为四大核心痛点。这些问题不仅影响少数行业或特定地区，而是遍布全球。它们也存在于不同行业中，必须在供应链领域的任何公司释放行业隐藏价值之前得到解决。痛点包括：\n\
  \n*   **可追溯性：** 这涉及监控事件以及与产品相关的元数据的能力。\n*   **合规性：** 作为符合监管条件证据的适当控制和标准。\n*   **利益相关者管理：**\
  \ 建立适当的治理，以促进所有利益相关者之间的风险降低、沟通和信任。\n*   **灵活性：** 组织快速适应面临的事件或挑战，并在不大幅增加运营成本的情况下运行不同场景的能力。\n\
  \n### 区块链特性对供应链的影响\n\n在讨论各种区块链供应链用例之前，让我们简要了解一下该技术一些最独特的特性，这些特性使其极其适用于 SCM。我们之前讨论了四大供应链痛点，现在让我们看看这些区块链技术特性如何帮助解决它们。这四大特性包括：\n\
  \n*   **不可篡改性：** 区块链的分布式特性确保网络中不存在单点故障。由于每笔交易都防篡改且带有时间戳，交易具有不可篡改性，无法被更改，这有助于消除欺诈案件。\n\
  *   **可审计性：** 在许可型区块链中，所有授权方可以即时查看所有交易。这意味着没有任何个人或团体可以修改、隐藏或擦除已添加到数字账本中的任何数据。\n\
  *   **智能合约：** 智能合约能够实现跨供应链的数据实时追踪。\n*   **去中介化：** 分布式账本技术允许通过数字签名进行可信的点对点交互。\n\n\
  ### 区块链技术为供应链管理提供的价值\n\n\n\n\n\n### 区块链技术在供应链管理中的应用\n\n一般来说，分布式账本技术有潜力显著改进或变革任何信任是主要挑战的行业。从本章开头我所做的解释来看，很明显信任是供应链管理的主要挑战之一，因为它涉及的交易中，成百上千的利益相关者试图高效地开展业务。以下是区块链技术可以在该领域发挥作用的一些方式。\n\
  \n#### 替代缓慢的手工流程\n\n正如我之前提到的，供应链管理中涉及的许多流程，尤其是在较低供应层级的流程，相当缓慢，且通常主要依赖纸质文件。借助分布式账本技术，该流程将被一个端到端的数字化流程所取代，该流程提供更高程度的透明度和可见性。\n\
  \n#### 改善可追溯性\n\n2018 年全球品牌假冒报告的估算显示，由于网络假冒，公司在全球范围内遭受了总计 3230 亿美元的损失。为了回应消费者和监管机构日益增长的溯源信息需求（这目前正推动该行业进行变革），区块链技术给出了答案。分布式账本技术使透明化成为可能，这也是许多公司拥抱它的原因。区块链在供应链中最流行的用途之一是其追踪和溯源风格的应用。\n\
  \n随着供应链透明度的提高，供应链运营的可见性也将大幅增强，这将带来质量提升、库存利用率改善、因假冒产品导致的收入损失大幅减少以及交付时间缩短。\n\n####\
  \ 降低供应链交易成本\n\n由于基于区块链的数字货币可以在没有银行等中介机构的情况下促进跨境资金转移，该技术可以显著加快支付速度，同时削减产生的费用。随着`Ethereum`等智能合约的引入，供应链运营可以通过智能合约自动触发。因此，智能合约可能会规定特定产品交付的各种条款、约定的交付时间、交付失败或延迟交付的后果。\n\
  \n此外，智能合约可以追踪产品的交付，一旦条款被违反，自动触发约定的行动。有了这一功能，在旧的传统系统中由第三方产生的各种成本将大幅降低。\n\n#### 提升整个供应链流程\n\
  \n理论上，区块链技术有潜力保护每笔交易和信息的完整性，从而减少错误和争议。由于减少了重新填补缺货订单或产品召回的需求，整个流程显著加快。此外，有了智能合约，对第三方或中介机构的需求将会减少。\n\
  \n### 供应链管理中的区块链用例\n\n正如我之前提到的，区块链技术在信任成为问题的交易中极其有用。供应链无疑是一个信任在成百上千笔交易中至关重要的行业，因为合作伙伴试图高效地开展业务。以下是分布式账本技术可以在该领域产生重大影响的主要方式。\n\
  \n#### 1. 溯源与增强的可追溯性\n\n将经历显著“区块链化”的供应链领域之一是食品供应链，特别是在鲜活农产品分销领域。多年来，该行业面临的一个昂贵问题是召回问题。但食源性细菌爆发事件的增加促使更多公司探索分布式账本技术能提供什么，以增加商品的可见性和可追溯性。来自消费者的压力也在增加，他们越来越要求了解商品的真实性、上架前的生命周期和溯源。\n\
  \n当然，只要消费者购买的是可持续且合乎道德生产的商品和服务，他们就愿意支付巨额资金。事实上，尼尔森的数据显示，约 45%的购物者愿意为质量上乘、安全标准卓越的产品支付更多费用。在该领域，沃尔玛与\
  \ IBM 合作，是探索基于区块链的可追溯性解决方案有效性的顶尖公司之一，他们可以轻松地将这些方案应用于整个食品供应链。\n\n他们测试的系统使零售商能够几乎实时地追踪从农场到商店的进货食品供应。他们不仅探索了其增强的可见性，还探索了分布式账本技术如何用于控制和监测食源性细菌的传播，这将进而大幅降低昂贵召回的比率。OriginTrail\
  \ 与 TagItSmart 之间的合作专注于测试区块链技术与物联网的结合，以帮助防止葡萄酒欺诈。\n\n在中国，每小时约有 30,000 瓶假冒葡萄酒被售出。不幸的是，其中一些假冒葡萄酒含有有害添加剂，消费者饮用后可能导致严重健康问题。该公司基于区块链的协议支持从葡萄园到各个商店的所有酒瓶的监控。防伪技术利用独特二维码和变色油墨的组合来验证每瓶酒的溯源和真伪。\n\
  \n福布斯报道显示，分布式账本技术正协助验证供应链中钻石的溯源、监管链和真伪。Everledger 是一个基于 Hyperledger 平台开发的钻石供应链区块链解决方案。它旨在帮助消除欺诈和非法的全球钻石贸易。每颗钻石都拥有被视为“指纹”的标识，根据\
  \ Everledger 的数据，目前约有 160 万颗钻石存储在区块链上。\n\n#### 2. 采购\n\n为了解释区块链将为供应链增加的价值，让我们考虑下面的图示。\n\
  \n![Image](img/Image00030.jpg)\n\n该示例展示了区块链技术在整个供应链中将发挥的重要作用。消费者对有机食品且具有清晰溯源的需求日益增加。零售商满足这一需求的一种方式是通过应用程序向消费者提供多项产品相关数据。消费者只需使用智能设备扫描二维码，即可验证牛肉经由供应链的每一个步骤。然后他们可以决定该产品的历程是否符合他们的预期。作为一致且单一事实来源的区块链数据库，实时提供猪肉产品的各类历史数据。信息可能涉及诸如以下内容：\n\
  \n*   肉类的来源、饲料或繁育情况。\n*   时间信息，如运输时间、熟成时长和最佳食用日期。\n*   农场的位置以及肉类在整个供应链中的位置。\n* \
  \  其他信息，如食谱或葡萄酒搭配建议。\n*   零售商实际上可以通过葡萄酒搭配建议或独特食谱等多种增值服务，推动除肉类以外产品的销售。\n\n#### 3.\
  \ 汽车供应链\n\n\n\n\n\n# 区块链在供应链与保险行业的应用\n\n##### 汽车行业供应链\n\n汽车行业是亟待转型的领域之一，专家认为其潜力巨大。Frost\
  \ and Sullivan 预测，到 2025 年，区块链技术在租赁零售、智能制造和供应链物流等多个功能领域的采用率将达到 37.2%。EY 预测区块链将应用于整个汽车市场交易中——所有权、注册、融资、保险以及服务交易。\n\
  \n在汽车行业供应链方面，通过确定溯源，可以减少供应链中的假冒零件。分布式账本技术在供应链物流中的应用，解决了大多数原始设备制造商（OEM）面临的持久问题——假冒零件。追踪每个零件在供应链每个步骤的流向，确保发运的零件就是交付的零件。IBM\
  \ 指出，这一特性不仅适用于汽车行业，也适用于其他依赖零部件的行业。\n\n![Image](img/Image00031.jpg)\n\n#### 供应链金融\n\
  \n许多公司对区块链和供应链金融解决方案的兴趣日益增加。这是因为分布式账本技术可以提高发票处理效率，提供安全透明的交易。传统发票付款期限通常为 30 天甚至更长。数字账本技术、供应链金融和智能合约的结合，可在收件人签收产品后自动执行即时付款。\n\
  \n#### 冷链溯源\n\n在大多数情况下，食品和药品的存储和运输需求相同。区块链技术与产品上的物联网传感器相结合，可帮助追踪湿度、温度、振动以及各种环境指标。由于这些信息存储在应用了智能合约的区块链上，当读数超出推荐范围时，便于及时处理可能的变化。Walmart\
  \ 在食品供应链中创新性地使用分布式账本技术，无疑是追踪溯源以及从中国运输的猪肉产品状况的明智之举。\n\n#### 供应商支付\n\n据 American Express\
  \ 称，数字账本技术有潜力通过加密分布式账本促进低成本、安全、快速的国际支付处理服务。这些加密账本将提供可信的现实交易验证，无需清算所和代理行等中介机构。咖啡行业是利用分布式账本技术进行供应商支付的绝佳案例。\n\
  \n咖啡供应链急需改革，因为整个生产过程分散碎片化。例如，原材料通常种植在偏远和发展中地区。气候变化等因素威胁着这些地区的种植者，价格波动大。人权组织报告也披露了多起虐待劳工案件。区块链技术虽无法解决所有这些挑战，但在咖啡供应链中，它有潜力提高透明度和效率。\n\
  \nBext360 公司利用区块链技术追踪全球咖啡贸易的各个方面，从农民到消费者。该策略旨在提高供应链生产力。通过采用加密货币并在供应链中应用数字账本技术，农民在售出产品后可直接立即收到款项。\n\
  \nBext360 利用区块链技术提高生产力，并确保所有种植者获得更公平的交易。这在一个不公平的行业中带来了透明度的显著提升。此外，咖啡爱好者还能方便地验证他们所饮咖啡的确切来源。\n\
  \n#### 食品安全\n\n追踪和隔离交叉污染等食品问题往往很困难。原因在于缺乏适当的数据，加上供应链可见性差。因此，此类问题出现时行动迟缓，更因不必要的时间浪费而雪上加霜。所有这些导致经济和声誉影响，尤其是在产品召回时。\n\
  \n由于追踪污染源或确定特定产品受污染的确切节点需要数周甚至数月，更多人会生病，这往往导致收入损失和食物浪费。CDC 记录显示，在 2017 年沙门氏菌爆发事件中，追踪受污染木瓜的农场来源耗时两个多月。根据世界卫生组织（WHO）数据，每\
  \ 10 人中就有 1 人因食用受污染食品而生病，每年导致约 42 万人死亡。\n\n目前，一个联盟正利用分布式账本技术进行供应链追踪，确保每个产品流动和产品状态的透明度。在缩短追踪和消除供应链中食源性疾病潜在来源所需时间方面，Nestle、Unilever\
  \ 和 Walmart 等公司走在前列。\n\n#### 海鲜验证\n\n关于海鲜标签错误的报道屡见不鲜，尽管 2016 年曾受到广泛关注，但此类情况仍在发生。利用分布式账本技术追踪鱼类和各种海鲜从栖息地到市场的全过程，可解决这一问题。目前多家公司正努力利用区块链技术实现这一目的。其中之一是“区块链供应链可追溯性项目”，由\
  \ Pacific Tuna 项目发起。\n\n该项目追踪金枪鱼从渔船到市场的全过程。项目目标（主要聚焦于太平洋岛国金枪鱼产业）是消除非法捕捞和侵犯人权行为。\n\
  \n随着区块链技术日趋成熟，供应链开发可能会持续探索将区块链引入运营的各种方式，特别是在最适用的领域。要转型供应链行业，必须开发更多能提升所有交易效率和信任的区块链平台。毫无疑问，我们尚未完全达成，但有非常积极的迹象表明，许多供应链公司已看透区块链技术的炒作，正在探索区块链为其业务带来非凡效益的途径。\n\
  \n## 第 11 章：区块链在保险行业催生独特方法\n\n保险行业最早记录可追溯至一千年前。记录显示，中国商船船员将货物集资汇集在一起，用于抵消任何成员船只倾覆造成的损失。尽管技术在过去十年深刻影响了其他行业，但保险行业在客户体验方面仍保留着过时的系统。\n\
  \n我们熟知了几十年的传统保险模式，随着时间的推移表现出相当强的韧性。但正如我们所知，变化终将在某个时刻发生。传统保险正逐渐受到新兴技术的影响，这些技术改变了人们与企业互动的方式，以及产品和服务的交付方式。区块链就是其中一项新兴技术。\n\
  \n\n\n\n\n### 像 IBM 这样的公司正在提出很棒的实施策略，使区块链技术给保险体验带来了压力\n\n像保险业这样一个行业已经存在了几个世纪。然而，它是一个其流程未经历任何重大改进的行业。\n\
  \n### 保险行业目前面临的挑战\n\n![Image](img/Image00032.jpg)\n\n我们大多数人对人寿、医疗账单和车辆保险非常熟悉。事实上，保险业作为一个数万亿美元的行业，目前覆盖了我们生活的各个方面。例如，布鲁斯·斯普林斯汀花费\
  \ 600 万美元为他的嗓音投保，现在我们拥有各种各样的保险——我们的宠物可投保，还有旅行保险涵盖与绑架相关的所有费用，以及其他若干类型。这可能描绘出一个根基稳固且价值巨大的行业形象，这在一定程度上是正确的。\n\
  \n但事实是，保险行业正面临着若干挑战。该行业面临的挑战榜首是人为错误、低效、欺诈，或许最大的问题是网络攻击。有多份报告称数据泄露是由网络攻击引起的，安泰保险也未能幸免，该公司披露发生了一起数据泄露事件，导致敏感数据暴露，7880\
  \ 万客户受到影响。除了因身份欺诈造成的不可估量的损失外，它还影响了整个行业。\n\n#### 再保险的现状\n\n如果您不知道再保险公司是做什么的，它们为保险公司提供保险，然而，这通常是在一个晦涩且效率极低的系统中进行的，该系统由人工流程和一次性合同决定。根据公司购买的具体再保险类型，它可能在特定时期内覆盖保险公司风险的某些方面，在某些情况下，它可能仅覆盖特定风险，如自然灾害。不幸的是，现有的再保险流程不仅复杂，而且效率极低。\n\
  \n在任意再保险中，合同中包含的每一项风险都必须单独承保。现在考虑一下这样一个事实：合同通常需要所有相关方经过约三个月的角力，最终才得以签署。这就是我说该流程出了名的低效的意思。通常，保险公司会聘请不止一家再保险公司的服务，这也意味着它们在处理理赔时会交换数据。各方总是存在不同的数据标准问题，这导致对合同实施方式有不同的解读。\n\
  \n### 区块链技术能提供什么\n\n最初，区块链技术在企业界的应用基本上是为了帮助降低成本，保险行业也不例外。然而，除了为企业降低成本的好处外，它还为保险行业提供了其他显著的好处，我们将快速浏览其中一些。\n\
  \n#### 1. 区块链增强的再保险\n\n区块链技术具备颠覆当前再保险流程的能力。它通过在分布式账本（由所有各方共享）上简化再保险公司和保险公司之间的信息传递来实现这一点。区块链技术可以使保险公司和再保险公司能够在其计算机上同时拥有保费和损失交易的详细记录。\n\
  \n因此，各公司之间将不再需要为每一笔理赔对账。凭借共享的不可篡改账本上的数据，再保险公司将能妥善配备资源，近乎即时地为理赔拨付资金。这还将使它们不仅能处理理赔，还能更快地结算理赔，而无需依赖原保险公司为每笔理赔提供的数据。普华永道的估算表明，再保险公司通过区块链技术提高运营效率，最多可节省高达\
  \ 100 亿美元。\n\n这些节省的影响最终可能导致消费者保费的降低，因为再保险实际上占现有保险费的 5% 到 10%。区块链在再保险中应用的一个绝佳例子是\
  \ B3i，其成员包括瑞士再保险、安联、美亚保险和安盛等行业巨头。\n\n#### 2. KYC 成本\n\n公共和私营部门在编制利益相关者和客户文档时，强制要求之一是“了解你的客户”（KYC）。然而，该流程通常耗时且成本高昂，但区块链技术可以为这一问题提供绝佳的解决方案。每个组织都需要为其客户编制多份文件，且必须在不交换客户信息的前提下完成这一工作。不幸的是，由于目前使用的中心化模式，大多数组织容易受到各种问题的困扰。\n\
  \n网络攻击的数量显著增加，在这些攻击中，数百万客户的信息被盗。例如，以下是我们过去见证的一些重大数据泄露事件：\n\n*   2014 年，约 5 亿个雅虎账户被黑。\n\
  *   2014 年，1.45 亿个 eBay 账户也被黑。\n*   2014 年，摩根大通约 700 万机构客户和 7600 万零售客户被黑。\n*   领英也未能幸免，2012\
  \ 年有 1.17 亿个领英账户被黑。\n\n所有这些组织有一个共同点——它们都是中心化的，这意味着它们有一个单一故障点。这一单点故障使得黑客很容易访问其服务器。通过一个加密的共享数据库汇集多个流程，区块链技术实际上带来了显著的收益。事实上，高盛认为，银行业通过协调一致地使用区块链技术，每年可在\
  \ KYC 及反洗钱（AML）相关成本上节省 30 亿至 50 亿美元。\n\n目前，Z/Yen 公司与 PwC KYC 卓越中心的联合倡议已促成一个区块链驱动的\
  \ KYC 数据库原型的诞生。这一概念的主要思想是存储和加密客户数据，同时验证进行各种文档记录和修改（如死亡、结婚、改名等情况）的所有客户。每位客户将获得一个独立的加密密钥，他们有自由将该密钥提供给金融机构。\n\
  \n当客户向金融机构提供密钥时，机构就能访问部分数据和文档。因此，该项目使组织能够以可靠且安全的方式识别客户。这也意味着，想要购买保险或开设账户的客户可以即时完成，无需经历传统\
  \ KYC 系统中耗时、繁琐且充满风险的流程。该新项目将有助于大幅削减保险公司的成本，因为银行、保险公司和经纪人之间将不再需要汇集数据。\n\n总之，区块链技术可以通过以下方式改进\
  \ KYC/AML 流程：\n\n*   它有助于创建一个防篡改的所有客户数据存储库，且该数据可在组织间安全共享。\n*   它将有助于降低错误风险以及重复劳动，通过节省时间、资源和协作来实现。\n\
  *   增强对客户在各机构间各项活动的可见性，从而改善合规性和监管监督。\n\n#### 3. 区块链技术有助于降低欺诈和被保险财产被盗的风险\n\n\n\n\n\
  \n### 区块链技术在保险行业的应用\n\n#### 防欺诈\n\n主要保险公司为防止欺诈，会从公共领域和私营组织获取数据，以进行预测和分析各类欺诈活动。尽管利用公共数据可从过往交易中识别个人的欺诈模式，但因不同组织间信息共享的挑战，该数据通常不一致。阻碍建立全行业反欺诈系统的最主要限制，在于共享个人身份信息（如出生日期、地址等）的问题。\n\
  \n区块链在此极具用处，但需要各保险公司高度协调。根据 IBM 提出的反欺诈区块链实施项目，利用区块链技术打击欺诈的工作可从相关方共享欺诈理赔信息开始。这将有助于识别犯罪行为模式，为保险公司带来三大主要收益：\n\
  \n*   有助于消除同一事故的多重理赔或重复预订问题。\n*   可通过数字证书轻松确立所有权，从而减少伪造行为。\n*   有助于减少保费挪用，典型例子是无证经纪人销售保险并私吞保费。\n\
  \n区块链技术将帮助公司处理欺诈案件。一个旨在打击欺诈的优秀项目是 Everledger（前文已提及），让我们深入了解其运作方式。该项目源于保险公司 Allianz\
  \ France 执行的初创加速器计划，专为奢侈品打造了一套结合公有链和私有链的认证系统。该项目利用区块链创建了一个主要针对贵重宝石的全球注册库。\n\n为实现这一目标，Everledger\
  \ 为每颗记录在案的宝石录入 40 项特征（包括净度、切工、颜色等）。这些记录信息构成 40 个元数据组件，用于生成唯一序列号。每颗宝石将通过激光雕刻该序列号，并录入相应区块链。一旦数据库积累足够数据（截至\
  \ 2016 年底，已记录超 100 万颗钻石），卖家若无法提供想售宝石的加密所有权证明，将极难出售钻石。\n\n所有缺少序列号、或序列号不清（难以辨认）的宝石，将大幅贬值。Everledger\
  \ 通过开发全球防篡改注册库，无疑为行业打击欺诈和盗窃做出了贡献。据估计，此类问题每年给保险公司造成约 500 亿美元损失。\n\n以下是区块链技术对高价值物品及保修影响的回顾：\n\
  \n*   有助于为所有相关方建立可信、不可篡改的产品溯源记录。\n*   通过提供优质数据和数据共享，显著提升全行业降低欺诈案件的力度。\n*   有助于实时、跨境追踪产品所有权及理赔情况。\n\
  \n#### 4. 任务自动化/理赔处理\n\n区块链技术给保险行业带来的另一显著优势是流程自动化。该技术不仅能自动化流程，还能通过省去多个人工干预环节，使流程更安全。自然灾害保险是这一用例的绝佳范例。此类保险可通过智能合约安排，Allianz\
  \ 集团已于 2016 年成功实施该用例。\n\n该集团的结算系统仅需两项信息植入程序：一是事件须被宣布为自然灾害；二是投保事件的地点须与记录在案的自然灾害发生地点相符。该策略的首要目标是防止\
  \ 2010 年 2 月 \"Xynthia 风暴\" 事件重演。\n\n事发时，大多数受害者丢失了提交理赔所需的所有文件，导致他们不得不等待一年多才能获得赔付。此类事件不仅周期长、成本高，还损害保险公司声誉，使客户对整个保险行业的活动产生怀疑。\n\
  \n通过使用基于智能合约的再保险系统（自然灾害互换），Allianz 集团显著改善了理赔处理，并进一步减少了人工干预，因为智能合约是自动化的。一旦事件发生并满足所有约定条件，每一份符合条件的灾害保险将由代码自动执行。\n\
  \n此外，代码强制直接触发保险赔付，客户无需进行传统文书工作。但需指出的是，当保险事故发生时，防止受益人不当得利的原则仍将适用。\n\n在理赔处理和任务自动化方面，区块链技术的关键影响包括：\n\
  \n*   客户可享有对其数据的更多控制权，包括访问权限。\n*   区块链有助于创建防篡改、可信的全行业理赔记录。\n*   通过消除数据孤岛，减少欺诈案件。\n\
  \n#### 6. 定价优化\n\n观察定价领域的最新发展，可发现静态和动态风险均受行为因素影响，保险公司正越来越多地关注这些行为。通过联网设备可采集大部分行为数据并汇编。这些信息可在区块链上交换，基于区块链实时报告的最新现实世界信息，实现价格的近实时调整和优化。\n\
  \n尽管该项目极具创新性，仍需更多分析和研究，以发掘执行所需的最佳平台和工具。无论是否使用区块链技术，保险行业必将在瞬息万变的世界中演进，自愿数据共享及我们持续获取客户行为和风险概况的能力，将推动灵活、个性化、动态的保险产品和风险管理实现改进和更新的定价。\n\
  \n基于区块链的动态定价系统虽短期内难以完全实现，但我们将比预期更早体验其对价格的影响。只需在智能合约中部署规则，承保、定价及理赔管理流程即可变得更高效、更快捷，这将最终显著影响所提供解决方案的竞争力。\n\
  \n#### 7. 区块链技术助力创造新市场\n\n\n\n\n\n# 区块链技术在保险行业的应用与金融工具数字化的影响\n\n随着区块链技术在保险行业的采用，新的保险业务线将被创建或扩展，且更容易触达新兴市场。目前，全球约\
  \ 40% 的人口缺乏银行账户和保险，尤其是在南美、非洲和亚洲。\n\n区块链技术将为保险行业打开各种产品和服务的大门。它将使保险公司能够更快地创建个性化产品和服务，以增强其保险供给。在旅游保险中，最常见的趋势之一是在发生承保理赔时提供实时赔付。例如，这一价值主张实际上由\
  \ `Berkshire Hathaway Travel Protection` 提供。\n\n这种定位意味着，保险公司在从航空公司获取信息（如航班延误和取消）之前，必须将其系统与航空公司的系统连接，并识别航空公司数据库中受特定航班影响的客户。一旦发生这种情况，就会主动开启理赔，使客户有权获得及时赔付。区块链技术将确保这一价值主张以完全自动化的方式得到良好管理，并降低成本。\n\
  \n在该领域定位的一个优秀区块链项目示例是 `InsurETH`。该项目是 2015 年发起的一场黑客马拉松的产物，利用 `Ethereum` 智能合约。在该项目中，理赔数据、合同以及客户文件的结合将使区块链能够促进个性化保险的快速开发。\n\
  \n在新兴市场保险行业的增长方面，区块链无疑将发挥重要作用。该技术将做的一件事是使组织能够触达非洲和亚洲等发展中地区的新地理市场。得益于智能合约相关的低增量成本，新的独特保险产品现在可以触达大多数发展中地区。\n\
  \n非洲大多数国家的保险渗透率相当低，然而，过去几年移动电话市场的增长显著。在撒哈拉以南非洲，约 70% 的人拥有手机，这导致通过电信运营商的移动支付呈爆发式增长。这些电信运营商正迅速接管银行等金融机构的大量角色。这一发展的一个流行例子是\
  \ 2007 年在肯尼亚推出的 `M-Pesa` 项目。\n\n已有超过 2000 万用户使用该基于手机的支付系统，每天通过该网络转账超过 1970 万美元。这为保险行业提供了绝佳机会，他们可以利用新技术的繁荣在非洲创造卓越产品。借助区块链技术，他们可以简化信息收集和承保流程，因为个人无需提供银行详细信息或身份证件即可拥有账户。可以为链接到客户移动数据的区块链设置智能合约，一旦发生保险事故，这将立即触发自动结算流程。\n\
  \n显而易见，`InsurTechs` 正在利用分布式账本技术创造的机会，正如我之前分享的一些例子。事实上，`PwC` 一项专注于 `InsurTech` 如何改变保险行业的研究记录显示，来自\
  \ `InsurTechs` 的竞争让约 90% 的保险公司感到担忧。正如 `PwC` 全球保险主管 `Stephen O'Hearn` 所解释的：\n\n>\
  \ “错失良机的风险在于，无法为客户提供他们已从零售和科技公司获得的类似体验。`InsurTech` 将成为选择拥抱它的人的游戏规则改变者。保险公司拥有无与伦比的消费者数据访问权，利用尖端技术彻底分析这些数据，可能会给公司带来显著收益。”\n\
  \n保险行业的现有企业正试图通过建立合作伙伴关系来应对这一竞争威胁。例如，`Allianz France` 已投资一个名为 `SmartAngels` 的项目。该项目是众筹专家，利用区块链技术维护组织在平台上融资发行的证券记录。`AXA`\
  \ 也不甘示弱，他们推出了一个名为 `Kamet` 的 1 亿欧元 `InsurTech` 孵化器。毫无疑问，由区块链使用发展而来的新竞争格局应予以考虑，保险业需要重新思考治理结构。\n\
  \n确实，区块链在以多种方式变革保险行业方面展现了巨大潜力。然而，关键在于指出它仍处于起步阶段。目前关于我们可以用区块链做什么，还有很多东西有待发现，但这正是许多初创公司正在做的，它们正在推出多种利用区块链应对保险行业挑战的方法。\n\
  \n行业内更多现有企业已经在努力不掉队，以跟上该领域的最新趋势和产品。有一点是确定的，基于区块链的点对点保险系统有潜力创建一个自主和自我监管的商业模式。将没有控制机构，这将促进行业的透明度。\n\
  \n## 第 12 章：区块链金融工具数字化对金融的重大影响\n\n![Image](img/Image00033.jpg)\n\n也许见证区块链技术影响最大的行业是金融行业。关于区块链对金融行业影响有多种预测，但我最喜欢的是\
  \ `Jupiter Research` 提供的预测。根据报告，到 2030 年底，银行将因部署区块链而在跨境结算交易上节省约 270 亿美元。\n\n在此期间部署区块链还将使银行削减\
  \ 11% 以上的成本。这非常显著，本章将探讨分布式账本技术将如何以多种方式变革金融部门及其服务质量。多年来，`Ethereum` 区块链成功展示了颠覆性经济学，与现有技术相比带来了\
  \ 10 倍以上的成本效益。\n\n目前，金融行业的大玩家已承认，区块链具备在未来十年为银行和其他金融机构节省数十亿美元的能力。分布式账本技术消除了单点故障，从而减少了对消息系统运营商、过户代理和其他几种低效垄断服务等第三方的需求。在\
  \ `Hyperledger`、`Ethereum` 等一些区块链平台上执行智能合约增强了金融部门的信任和效率。那么，金融工具数字化以何种方式影响金融机构？\n\
  \n### 金融工具数字化及其对金融的影响\n\n当谈到金融工具数字化时，我们指的是智能合约、可编程货币和数字资产，这甚至通过在资产、产品、服务和持仓之间建立卓越的可编程性和连通性水平，增加了区块链技术的收益。\n\
  \n\n\n\n\n当然，商业和金融市场的流程将由这些数字化工具重新定义，这将开创一个人们在每个节点都能享受价值的新时代。以下是数字化工具提供的一些商业优势：\n\
  \ni. **可编程能力：** 它们提供处理合规、治理、身份（`KYC/AML` 属性）、数据隐私和系统激励等问题的代码。它们还支持添加处理利益相关者参与（如投票）等功能到资产中。\n\
  \nii. **为新产品和市场敞开大门：** 它们为安全且可扩展的快速转账、代币化微观经济、现实资产的份额化所有权等新产品敞开了大门。\n\niii. **有助于简化流程：**\
  \ 自动化程度提高带来的部分好处是运营效率的提升。自动化的其他显著好处包括实现实时结算、审计和报告，缩短处理时间，以及减少与各种流程相关的错误和延迟程度。它还有助于减少在现有中心化流程中获得同等信心水平所需的步骤和第三方数量。\n\
  \niv. **促进数据真实性和稀缺性：** 数字化不仅确保数据完整性，还实现资产溯源，并在单一共享事实来源中提供完整的交易历史。\n\nv. **市场响应速度：**\
  \ 与标准化证券相比，数字证券允许更多定制，且能在更短的时间框架内轻松发行。借助数字化，我们现在拥有资源开发完美契合投资者需求的独特数字金融工具。\n\n###\
  \ 资本市场与区块链技术\n\n资本市场行业正在多个领域见证一场卓越的变革，尤其是在业务动态方面。这是由新技术、法规以及核心业务领域经修正的经济模型所造成的颠覆所致。数字化已改变各个行业，资本市场也不例外，该行业经历了主流思维模式的剧烈变化。2008\
  \ 年危机后，许多公司花了近十年时间试图稳定下来，但不久后便面临着由数字革命带来的新商业交易方式的期望。\n\n这些新期望的含义也转化为对行业现有规范的修改，特别是面临以下挑战：\n\
  \n*   实施 `Basel III` 和 `Dodd-Frank` 等法规后，抵押品成本（非常高）。\n*   结算周期——杠杆贷款等工具结算交易可能需要数周时间。\n\
  *   对账等各种流程中的低效率。\n*   资产管理、支付等多个领域的中介机构活动往往导致高昂的交易成本。\n\n区块链技术的出现也对资本市场产生多重影响，因为它们现在面临另一阶段的颠覆。但这应当是一个受欢迎的发展，因为分布式账本技术在资本市场的采用将有助于解决该行业面临的一些最大挑战。资本市场可以从区块链技术的影响中获益良多，尤其是消除或减少中介机构所扮演的角色。让我们来探讨区块链在资本市场中的各种用例。\n\
  \n#### 实时交易结算\n\n由于缺乏一种能够对不同金融工具头寸进行实时监控的机制，交易双方将始终面临固有的交易违约风险。目前承担这些违约风险的是同时充当中介的清算所。但由于中介的存在，交易结算周期时间线被延长了。区块链驱动的系统确保交易在交易所执行的那一刻，关于该交易的所有关键信息将被传递给智能合约，并维护在私有或许可区块链网络上。\n\
  \n此外，智能合约将与维护在区块链上的所有工具的账本头寸进行同步。它还会进行实时检查，以确定交易工具是否可用。请查看下面的插图，以更清晰地了解整个流程。\n\n\
  ![Image](img/Image00034.jpg)\n\n当然，无法篡改已写入智能合约的规则。因此，这为所有交易实体保证了透明度和信任，并最终导致交易实时结算。\n\
  \n得益于区块链技术带来的近实时结算，对手方风险（兑换风险、信用风险等）将大幅降低。此外，它将有助于消除结算过程中的通信障碍、对账问题和错误。\n\n####\
  \ 三方抵押品管理\n\n为了协助管理抵押品和对手方风险敞口，金融机构需要三方代理的服务。现有的传统系统仅支持日终查看抵押品头寸，这导致更高的抵押品存款。最终，可用抵押品未得到最优利用，这显著增加了融资成本。区块链为抵押品管理问题提供了一个极佳的解决方案。\n\
  \n对于区块链解决方案，分配逻辑被编码在智能合约中，该合约包含旨在严格监管机制的规则——反向风险、资格检查和集中度限制。考虑到其易变性，信用支持附件条款等隐私规则不会上链。相反，它们将保持在链下——在私有规则引擎上。智能合约将在完成分配前与长箱（long\
  \ boxes）以及隔离账户头寸进行通信。\n\n分布式账本作为平台，用于实时维护已分配的抵押品头寸，所有利益相关者均可轻松查看。请查看下面的插图，以更好地了解其运作方式。使用基于区块链的解决方案管理抵押品将促进由三方代理管理的每个账户持有者的超额抵押品释放回流通中。这将有助于增加流动性并为所有利益相关者实现抵押品的合理优化。\n\
  \n![Image](img/Image00035.jpg)\n\n资本市场公司采用区块链技术的前进道路不是大爆炸式的采用和实施。相反，为资本市场公司实施区块链用例的最佳方法应是循序渐进的策略。采用这种方法的原因是该行业相当复杂。因此，该行业的公司应首先明确定义用例，且所采用的用例应严格基于成本效益分析和采用可行性。下面的插图可作为资本市场任何公司采用路径的蓝图。\n\
  \n![Image](img/Image00036.jpg)\n\n对于该行业的公司而言，采用概念验证（`PoC`）方法评估各种区块链用例至关重要。这是因为区块链技术仍面临可扩展性以及与传统/中心化系统集成的问题。希望随着更多区块链项目探索实现互操作性和提升容量的方法，这不再是问题。\n\
  \n\n\n\n\n### 区块链在资本市场与资产管理中的应用\n\n#### 资本市场的采用\n\n世界上最大的金融交易所之一是澳大利亚证券交易所（ASX），其全球排名实际上位列第\
  \ 16 位。有趣的是，该交易所正致力于采用基于分布式账本技术的替代方案，以取代其现有的 CHESS 清算结算系统。他们与一家名为 Digital Asset\
  \ Holdings 的区块链咨询公司合作开发了该系统。请注意，ASX 持有该公司的股份。\n\n目前，ASX 已安排行业测试环境（ITE），以支持在平台上线前进行充分的全行业范围测试。另一个利用区块链为资本市场带来益处的举措，其规模甚至大于第一个项目。这是一项合作伙伴关系，将推动存托信托清算公司（DTCC）价值\
  \ 11 万亿美元的交易信息仓库迁移至 Axoni 的 Axcore 区块链——一家纽约初创公司。\n\nDTCC 拥有世界上最大的金融基础设施。该公司每年处理约\
  \ 1.6 千万亿美元（1.6 quadrillion）的证券交易。此外，该公司的交易信息仓库为全球几乎所有衍生品交易商以及约 2,500 家买方机构提供服务。DTCC\
  \ 在推动区块链融入资本市场方面的严肃态度，有力地表明该行业正在摒弃沿用数十年的传统系统。\n\n以下是资本市场采用该技术后区块链将发挥的作用总结：\n\n*\
  \   得益于其去中心化结构，将有助于消除单点故障。\n*   随着工作流和流程的数字化，人为操作风险、对手方风险和欺诈风险将显著降低。\n*   将促进资本市场活动的流程简化，有助于缩短结算时间并降低成本。\n\
  \n#### 区块链与资产管理\n\n![Image](img/Image00037.jpg)\n\n我们已经探讨了区块链如何颠覆多个行业，以及它如何以多种方式改变我们的做事方式。分布式账本技术已经改变了客户在线上和线下购买各类商品和服务的方式。此外，随着\
  \ ICO 的出现，区块链也颠覆了企业融资方式。但该技术能显著颠覆的一个领域是我们管理资金的方式——资产管理。采用分布式账本技术的公司将获得惊人的回报，因为区块链可以改造资产管理价值链。\n\
  \n尽管该技术仍处于早期阶段，但它具备改造并延伸资产管理业务价值链的潜力。资产管理公司需要认真对待区块链的另一个原因是，我们仍处于分布式账本技术发展的早期阶段，这预示着机遇。\n\
  \n资产管理人不再仅仅向客户提供产品，而是可以借助区块链管理数据，为客户提供长期解决方案。该技术可以通过多种方式协助管理人增加收入、削减成本。有了区块链技术，将不再需要中介机构来协助处理、验证和保管金融资产。\n\
  \n##### 1. 遵守 KYC/AML 法规\n\n每家金融机构都有责任对客户信息进行适当核查，并了解其业务交易目的。借助存储在分布式账本上的数字身份，公司可以实现新账户创建和验证流程的自动化。它还能促进快速合规验证，并通过分布式账本使交易监控流程变得简便高效。然而，资产管理公司可能面临的一个挑战与升级其集中式基础设施的成本有关。\n\
  \n在客户准入流程（准备客户使用特定平台及产品）期间，必须采取若干步骤。首要任务是确认客户确实是他们声称的那个人。不幸的是，随着数据泄露、恶意软件攻击和黑客攻击案例的增加，高效验证个人身份变得愈发困难。然而，分布式账本技术可以显著减少甚至消除大多数此类问题。事实上，区块链对资产管理公司的主要应用在于身份管理和数据安全。\n\
  \n##### 2. 资金分配\n\n在将资本利得及基金收益分配给投资者时，分布式账本技术也能在多方面提供帮助。由于交易现可记录在区块链上，将不再需要分发和过户代理职能。此外，还可以将基金特性及执行条款植入智能合约中。这将显著提高分配流程的效率和速度。\n\
  \n##### 3. 智能合约\n\n在确认客户身份并妥善设置账户后，客户即可开始下单。区块链实际上可以接收交易请求，随后激活包含交易特定条款条件的智能合约。然后，它还将自动化审批和清算计算流程。一旦客户请求满足智能合约中规定的所有条件，区块链将安全传输文档，甚至通过自动化支付通道为新的投资头寸提供资金。所有这些将在几分钟内执行完毕，而传统系统需要资产管理人花费数小时，在某些情况下甚至需要数天才能完成。\n\
  \n##### 4. 提升运营效率\n\n在一个众多公司投入数亿资金仅为将交易执行时间从毫秒级降低至微秒级的行业中，一个至关重要的因素是数据传输速度。更快的数据传输时间不仅意味着缩短订单处理所需时间，还意味着更多。这意味着管理者（可能是人工智能，也可能是人类）将第一时间获知可能影响客户投资组合的突发新闻，并协助他们应对出现的挑战。\n\
  \n金融科技移动应用的出现、提供零佣金证券交易的在线平台以及移动支付采用率的提高等多重因素，将日益暴露资本市场，并最终吸引全球数百万投资者进入资产管理领域。如果资产管理公司必须应对激增的交易量以及复杂的请求和订单，则必须提高数据传输速度。\n\
  \n##### 5. 监管合规\n\n在管理报告、投资者沟通和监管合规方面；分布式账本技术编译交易数据的安全、透明且严谨的方式将极其有用。当然，资产管理人清楚区块链在简化和自动化报告及监控职能方面提供的益处。在致力于妥善遵守信息安全规则、反洗钱法规及隐私法律的过程中，他们只需利用区块链技术而非依赖人工，即可显著降低成本、提高生产力，并减少欺诈活动和错误的风险。\n\
  \n##### 6. 资产代币化\n\n\n\n\n\n这指的是对名画、知识产权和其他高价值商品等事物进行证券化。得益于区块链提供的更高速度、效率和安全性，投资者实际上可以从任何地点投资资产。在扩大投资者基础、降低再销售风险和增加流动性的过程中，资产代币化是为资产管理者创造新的准入门槛的绝佳工具。\n\
  \n代币化所有权意味着投资者可以在低成本和几分钟内直接进行交易和结算。这有可能将管理者排除在外。为了对现有投资者保持相关性，同时吸引越来越多的首次投资者的新业务，许多公司现在正在推出替代产品和服务。精明的管理者总会对任何有潜力大幅增加潜在投资者和资金的新技术感兴趣。\n\
  \n以下是区块链为资产管理行业所能做的事情的总结：\n\n*   它支持与数字化资产和服务进行无缝的利益相关者互动。\n*   通过启用可定制的内置隐私设置，促进交易保密性。\n\
  *   它支持自动化基金发行。\n*   借助区块链，多项股东权利和义务的行使（如投票）可以被编程到数字资产中。这降低了人为错误的风险，并带来无缝的用户体验。\n\
  *   它允许对投资组合和当前持仓进行数字化，以增加市场准入、实现份额化和流动性。\n*   借助区块链，投资者和利益相关者将享受改进的治理和透明度。\n* \
  \  将有可能创建和执行激励机制，以增加参与度，同时惩罚恶意行为。\n\n#### 资产管理的未来是什么样的？\n\n我们已经超越了人们怀疑区块链技术仅仅是一时热潮的时代。事实是，相当数量的资产管理者以及整个金融行业正在利用该技术的诸多优势。随着数字化转型持续颠覆资产管理行业，基金管理者需要制定部署区块链的步骤。这将有助于提高运营效率，改善数据和身份安全，并简化监管合规。\n\
  \n未能拥抱该技术的公司可能会落后，因为数字化转型的影响导致行业竞争日益激烈。事实上，大多数创新公司正凭借区块链在机会领域确立其利基市场。这些新的利基市场包括\
  \ STO（证券型代币发行）、加密资产管理和资产代币化。现在是采取行动的最佳时机。\n\n### 支付与汇款\n\n![Image](img/Image00038.jpg)\n\
  \n2019 年 8 月，世界银行发布新闻稿称，中低收入国家的全球汇款额增加至 5290 亿美元。与 2017 年 4830 亿美元的前纪录高点相比，这表示增长了\
  \ 9.6%。此外，包括中低收入国家和高收入国家在内的全球汇款总额从 6330 亿美元跃升至 6890 亿美元。该行披露，银行是成本最高的汇款渠道，因为它们在\
  \ 2019 年第一季度平均收取高达 11% 的费用。记录还显示，邮局是第二昂贵的渠道，成本超过 7%。\n\n咨询公司毕马威在其 2019 年全球支付报告中估计，2018\
  \ 年 B2B 跨境支付规模高达 15.5 万亿美元。这一数据有力地表明了国际支付行业的规模，以及它如何影响企业、个人和资金接收国。事实上，世界银行预测汇款正在成为最大的外部融资来源，尤其是在发展中国家。\n\
  \n这也意味着它可以影响这些国家的增长和发展。这也解释了为什么联合国 2030 年可持续发展目标旨在大幅降低移民汇款相关成本，目前平均为 7.1%，目标降至 3%\
  \ 以下。\n\n![Image](img/Image00039.jpg)\n\n除了高昂的费用，大多数汇款公司依赖第三方服务和金融机构的服务。导致当前系统极其低效的原因是需要多个中介机构的服务。这些服务不仅昂贵，而且通常耗时较长，资金转账可能需要数天，在某些情况下甚至需要数周。分布式账本技术可以为汇款行业提供更高效的替代方案。当前汇款行业的另一个问题与资金接收者有关。\n\
  \n许多接收者生活在发展中国家，他们无法使用银行账户。不幸的是，大多数汇款是通过正规银行系统发送的。即使这些人有银行账户，他们可能也需要长途跋涉才能从最近的银行网点取款。有些人缺乏适当的身份证明，而这可能是银行服务所要求的。这就是为什么许多汇款通过非正规渠道进行。\n\
  \n随着区块链技术和数字钱包的出现，这种情况正在迅速改变。区块链有潜力彻底改变现有的全球汇款渠道。借助移动钱包，任何拥有智能手机和互联网接入的人都可以享受多种功能，这包括国际转账的能力。\n\
  \n更多基于区块链的汇款项目正在加密领域涌现，它们的重点是简化整个流程。它们消除了对不必要的第三方服务的需求，创造了无摩擦且近乎即时的支付服务。区块链网络不依赖像传统服务那样缓慢的交易审批流程，传统服务通常需要经过不同的中介机构，涉及大量人工操作。\n\
  \n区块链解决方案可以通过利用分布式节点网络，在任何地点执行金融交易。传统银行系统不如区块链技术快，因为该技术可以以大幅降低的成本实现更可靠、更快速的支付解决方案。毫无疑问，区块链拥有解决汇款行业面临的主要挑战——漫长的交易时间和高昂费用——的正确方案。\n\
  \n#### 汇款行业的用例\n\n几家公司正作为基于区块链的汇款公司涌现，并提供令人振奋的方案。\n\n![Image](img/Image00040.jpg)\n\
  \n1. 加密货币项目\n\n一般来说，任何人都可以轻松地在几分钟内将 `Tether` 等稳定币转账到全球任何地点。与我们习惯的国际转账方式相比，这是一个显著的改进。也许\
  \ `Ripple` 是利用分布式账本技术进行汇款的首屈一指的公司。`Ripple` 主要专注于旨在取代现有银行系统的跨境支付解决方案。该项目通过在多个支付解决方案之间建立互操作层，提供快速、低费用的交易。马来西亚是流入孟加拉国和南亚的汇款前五大来源国之一——孟加拉国从马来西亚接收的资金流入量位居第三。\n\
  \n`Ripple` 正与孟加拉国的 `bKash` 和马来西亚的 `Mobile Money` 达成协议，为这两国建立一个钱包到钱包的汇款渠道。新渠道将利用\
  \ `RippleNet` 基于 DLT 的全球支付网络，促进 `bKash` 和 `Mobile Money` 之间的钱包到钱包交易。将执行汇款结算的孟加拉国本地银行合作伙伴是\
  \ `Mutual Trust Bank`。\n\n\n\n\n\n#### 2. 区块链与 ATM\n\n汇款行业的另一个有趣解决方案是将区块链技术与 ATM\
  \ 相结合。这种组合可以为全球汇款的个人提供有效的解决方案。借助该方案，中介机构和中央机构的影响将被减少甚至消除，从而降低结算所需的周转时间。\n\n####\
  \ 3. 移动钱包\n\n加密钱包正变得越来越普及，有趣的是它们基于区块链。一旦安装在智能手机上，移动加密钱包即提供多种功能。任何人都可以进行国际转账，其中一些钱包允许在数字货币与法币之间快速兑换。通过移动钱包发送资金的接收方不需要银行账户，因为资金是从一个钱包直接发送到另一个钱包。他们只需要一部智能手机、互联网接入以及一个兼容的移动钱包。常见的移动钱包示例包括\
  \ Luno、Coinomi 等。\n\n毫无疑问，汇款仍然是发展中国家数百万人民的重要资金来源。尽管汇款有可能促进这些国家的发展，但高昂的成本是其最大的挑战。智能手机的普及以及新商业模式的创造，为现有渠道提供了更好的替代方案。但加密货币及其底层的分布式账本技术提供了点对点交易，从而带来更多优势，并实现从全球任何地点更快地收发资金。\n\
  \n### 银行业与借贷\n\n极易遭受攻击的行业是银行业。这就是为什么许多银行投入巨资来保障其运营安全。可以消除银行面临的大多数威胁，或银行业务各方面的欺诈风险，这甚至适用于交易平台。基于\
  \ DLT 的银行系统还可以解决的其他问题包括管理成本和运营风险，因为它可以使系统具有不可篡改性和透明性。\n\n请记住，区块链技术的特性之一是可追溯性，以及区块链上每一笔交易的永久历史记录。这意味着区块链可以为银行发生的所有交易提供备份。一般来说，银行业务的核心方面包括抵押贷款、交易、支付服务和贷款。但正如我们所知，这些服务大多通过传统的中心化系统执行。\n\
  \n这也解释了为什么这些服务往往缓慢且低效，因为银行运营中存在大量中介机构。一个很好的例子是信息验证、信用评分、贷款处理和放款流程，在某人成功获得抵押贷款前可能需要\
  \ 30 到 60 天。事实上，中小企业获得商业贷款可能需要 60 到 90 天。DLT 可以帮助解决银行业的关键方面，我们现在将探讨它们。\n\n#### 欺诈预防\n\
  \n银行业面临的主要挑战之一是不断上升的欺诈率和网络攻击。从全球范围来看，就网络犯罪相关成本而言，2018 年平均成本最高的行业是银行业。2017 年，网络犯罪给该行业造成了约\
  \ 1670 万美元的损失，这一数字在 2018 年增加到 1840 万美元。请参阅下方来自消费者哨兵网络 2016 年至 2020 年的身份盗窃和欺诈数据。\n\
  \n![Image](img/Image00041.jpg)\n\n* 消费者可以自由举报多种类型的身份盗窃。\n* 2020 年报告的所有身份盗窃案件中，15%\
  \ 包含不止一种形式的身份盗窃。\n* 该数据包括电子邮件、网上购物和支付账户欺诈、社交媒体欺诈、证券、保险和医疗服务欺诈。\n\n就像其他中心化系统一样，银行账本存储在中心化服务器中，这意味着它们更容易遭受网络攻击。所有关键银行信息都存储在单一位置，这造成了单点故障。黑客和网络犯罪分子日益高超的技术使他们能够绕过大多数安全系统，从事欺诈和数据泄露。当然，这个问题不仅存在于银行业，石油天然气甚至肉类加工公司等其他行业也受到了影响，就像最近在美国发生的事件一样。\n\
  \n得益于其去中心化结构，区块链为欺诈问题提供了独特的解决方案。区块链的去中心化架构使其更不易受欺诈侵害。它提供完全的透明度和实时支付执行。组织只需利用区块链，即可降低风险和管理负担，节省资金和时间。\n\
  \n#### KYC\n\n与其他用例一样，区块链也可以帮助解决银行交易延迟的问题。银行交易中涉及银行和中介机构之间大量重复工作的一个方面是 KYC 流程。尽管合规成本高昂，但未能妥善遵守\
  \ KYC 准则的银行面临巨额罚款。近期汤森路透调查的数据显示，银行每年花费高达 4000 万英镑仅用于遵守 KYC 准则。借助区块链，可以将 KYC 数据存储在区块链上，银行甚至可以利用新兴的数字身份解决方案来处理\
  \ KYC 合规问题。\n\nSWIFT 实际上已经创建了 KYC 注册库，相当数量的银行（约 1125 家）现在共享 KYC 文档，但仍有大量工作要做，因为这仅代表其网络上\
  \ 7000 家银行的 16%。虽然 KYC 详情的安全性和隐私性存在一些挑战，但如果信息存储在私有区块链上，则隐私和安全问题将大幅减少。\n\n#### 区块链如何颠覆借贷\n\
  \n替代借贷平台承销的贷款数量激增。记录显示，金融科技消费借贷平台 Experian 的消费贷款在四年内翻了一番多。2015 年，其个人贷款发放份额从 22.4%\
  \ 增长到 2019 年的 49.4%。事实是，不仅是银行失去了阵地；传统金融公司和信用合作社也受到了影响，因为它们也在持续让出市场份额。\n\n这一新趋势的主要原因是新进入者凭借其聪明的方法以及面临的监管限制较少而具备创新能力。这些借贷领域的新参与者正利用区块链和数据分析，使其产品更透明、更快捷、更高效、更易获取。如果银行要保持相关性，就需要创造新的竞争方式，特别是随着非银行借贷平台日益普及。\n\
  \n更多由区块链驱动的平台正在涌现，而金融科技公司提供的产品更加多样化。有趣的是，许多银行现在正在增强其数字化能力，以应对来自金融科技和去中心化金融（DeFi）平台的威胁。然而，他们的努力仍显不足，因为银行需要大幅降低运营成本、拥抱合作伙伴关系，并彻底改造其借贷流程以反映新的技术发展。\n\
  \n\n\n\n\n#### 银行可以利用区块链管理、批准并即时记录任何交易\n\n银行可以利用区块链管理、批准并即时记录任何交易，这与涉及缓慢且人工的身份验证和核实流程，以及大多数贷方不得不依赖的缓慢数据共享工作流的传统流程截然不同。区块链技术给贷款行业带来的另一项优势是灵活性。它为点对点贷款以及多种贷款结构打开了大门。\n\
  \n### 银行业的一些区块链项目\n\n随着 DeFi 多年来人气显著上升，更多区块链项目正进入银行和借贷领域。我们可以看看该领域的几个顶级项目，以及它们打算为银行业带来什么。\n\
  \n#### Paxos\n\n该项目实际上是首个利用 DLT 同时进行资产和支付结算的区块链信托。拥有与传统银行类似的信托权力，该项目的代币（`PAX`）是一种基于以太坊的稳定币，与\
  \ 1 美元挂钩，并能实现数字交易的即时结算。加密货币领域有许多稳定币，而 Paxos 是少数获得了最严格、最强硬的监管机构——纽约州金融服务部批准的稳定币之一。\n\
  \n德勤的一项研究详情显示，每年诸如网络攻击增加、成本上升和全球支付处理成本等因素让金融业损失数十亿美元。借助分布式账本技术，可以改进现有的银行业务模式，并升级贷款产品、信用监控、国际支付和融资。此外，在同一研究中，银行被鼓励采用区块链提供的惊人解决方案，如不可篡改的智能合约、争议解决技术和实时金融追踪，以在传统银行业务中占据优势。\n\
  \n借贷领域的其他区块链项目包括 `BlockFi`、`Binance`、`Celsius`、`CoinLoom` 和 `YOUHODLER`。其中一些借贷平台不要求用户拥有最低金额，`Celsius`\
  \ 就是此类项目的一个典型例子。此外，一些平台主要专注于提供数字货币的高回报，而另一些则更关注稳定币的回报。\n\n### 去中心化金融（DeFi）与金融业\n\
  \n你可以将 DeFi 视为一个专为互联网时代设计的全球金融系统。它只是一个高度受控、不透明且主要依赖几十年前的旧基础设施和流程的系统的绝佳替代方案。有了 DeFi，你现在可以掌控并查看你的资金，接触全球市场，并拥有替代你的银行选择和本地货币的优秀方案。\n\
  \n世界各地的人们要想从任何地点访问 DeFi 产品，只需要一个互联网连接，当然，许多智能手机用户都能访问互联网。目前，价值数十亿美元的数字货币已被注入各种 DeFi\
  \ 应用程序，且这一数字每天都在持续增加。\n\n#### 理解 DeFi\n\nDeFi 是一个统称，旨在涵盖各种金融产品和服务。在传统金融机构中缓慢且常受人为错误影响的所有服务，在\
  \ DeFi 应用程序中现在都已完全自动化且更安全。它们不由中心化机构和人类处理，而是由我们所有人都可以轻松审查的代码处理。蓬勃发展的加密经济允许任何人借贷、赚取利息、买卖，并做更多事情。许多组织现在用数字货币支付员工工资，许多人无需个人身份识别即可借出并偿还百万美元贷款。这是金融行业的一项惊人发展。\n\
  \n总体而言，DeFi 利用智能合约和数字货币在无第三方的情况下提供服务。我们世界中的金融机构充当各种交易的担保人，但这赋予了它们对你资金的控制权，因为你的资金始终流经它们。但\
  \ DeFi 已成功用智能合约取代了每笔交易中的金融机构。智能合约可以持有用户资金，并在特定条件下发送或退还资金。一旦智能合约上线，任何一方都无法修改条款；它将严格按编程运行。\n\
  \n#### 为什么选择 DeFi？\n\n通过观察传统金融行业面临的问题，你可以轻易识别出 DeFi 的潜力。首先，由于身份识别问题，一些人无法创建银行账户或使用各种金融服务。此外，由于多重瓶颈，一些金融服务可能阻碍人们获得报酬。当人们无法获得金融服务时，他们可能实际上无法就业。中心化机构和政府也可以随意关闭市场，这将影响用户。由于各种人工流程，资金转账通常需要数天。\n\
  \n想从人们的钱中抽成的中介机构的存在，给金融服务增加了溢价。与传统金融相关的问题清单很长。那么，与传统金融相比，DeFi 表现如何？这里有一个表格来清晰地展示两者的区别。\n\
  \n![Image](img/Image00042.jpg)\n\n##### 使用 DeFi 可以做的事情\n\n对于现有的每一项金融服务，都有一个去中心化的替代方案。以太坊和其他智能合约平台为开发者和企业家提供了开发全新独特金融产品的机会，DeFi\
  \ 服务的清单也在持续增加。\n\ni. **全球汇款服务：** DeFi 让向任何地点汇款变得非常容易。这就像从手机或笔记本电脑发送电子邮件一样简单，收款人将在几分钟内收到资金。\n\
  \nii. **全球流式支付：** 借助以太坊区块链等平台，你可以进行流式支付。此功能使你能在几秒钟内支付员工工资，并允许他们在需要时随时获取资金。除了流式支付\
  \ `ETH`，如果你担心加密货币的波动性，还可以流式支付其他稳定币。有几种惊人的替代方案适合广泛的客户需求。\n\niii. **DeFi 提供稳定币：**\
  \ 吸引世界各国政府关注的区块链方面之一是稳定币。它们的创建是为了帮助缓解波动的加密货币市场的影响。加密货币的波动性影响大多数金融产品和服务，而针对这一问题的完美\
  \ DeFi 解决方案是创建稳定币。稳定币的价值通常与其他有价值的资产和货币挂钩。例如，一枚 `USDT` 挂钩 1 美元，而 `USDC` 或 `DAI` 等其他稳定币的价值保持在\
  \ 1 美元的几美分范围内。这也为用户提供了赚钱的机会，拉丁美洲的许多个人以及尼日利亚等一些非洲国家的人们，正因其国家法币价值的不确定性而利用稳定币保护储蓄。\n\
  \niv. **借贷：** 去中心化提供商提供两种借款方式：\n\na. **池式系统或平台**，想要借贷的个人向资金池提供流动性（资金）。然后人们可以从提供的流动性中借款，而提供流动性的人赚取佣金。\n\
  \nb. **点对点系统**，借款人可以直接从其选择的任何贷款人那里借款。\n\n\n\n\n\n## v. 隐私\n\nDeFi 借贷的另一个方面是隐私问题。在传统借贷中，银行和其他机构在借贷给你之前，希望确信你有能力偿还贷款。这意味着作为借款人的你，身份并非隐藏。在去中心化借贷中，所有参与方可以在不透露身份的情况下相互交易。在借款人获得贷款之前，必须提供抵押品，如果违约，抵押品将自动归放贷人所有。部分抵押品以非同质化代币（NFT）的形式存在——即艺术品等独特资产。去中心化借贷让你无需经过常规信用检查或泄露个人信息即可借贷。\n\
  \n## vi. 增长你的投资组合\n\n在以太坊等区块链平台上，你可以使用多种基金管理产品，让你按任何想要的策略增长投资组合。一切皆自动化，且任何人都可以使用这些服务。没有想要分走你利润的中介机构——你保留全部利润。\n\
  \nDeFi 的未来前景光明，潜力深远，尽管在可能性方面仍处于早期阶段。DeFi 有潜力赋予投资者更多独立性，这也将使他们能以传统金融系统无法实现的惊人方式利用其资产。去中心化金融影响深远的一个领域是大数据领域。\n\
  \n当 DeFi 最终成熟时，它可以为我们将数据商品化提供明智的途径。然而，尽管拥有所有惊人的功能和承诺，DeFi 前路漫漫，特别是在大规模采用方面。关键在于尽可能多地教育人们了解区块链和加密货币领域，这也是我创作本书的原因——让尽可能多的人了解区块链的优势。\n\
  \n## 第 13 章：区块链可以促进更好的政府流程\n\n![Image](img/Image00043.jpg)\n\n区块链技术不仅对个人和企业组织有用；它还能变革政府服务，并确立公平透明的公民权利。分布式账本技术可以增强各种政府流程，并为共享提供一个安全且理想的平台。任何国家的公民都将享受到建立在区块链上的众多应用——有些人实际上已经在享受这些\
  \ dApps。但政府应拥抱区块链技术的原因之一是，它将消除官僚主义，减少浪费，提供不同且独特的服务，并防止逃税案件。\n\n许多国家正在探索的数字现金的使用具有多重益处。它将促进政府制定的大额交易政策，并使其能够修改当前的金融交易。首先，理解中心化政府服务的含义至关重要。几乎所有公共机构都高度中心化，只有极少数服务未受这一腐败体系影响。当然，中心化系统本身没有可怕的错误；然而，它们导致当局利用政治权力助长不公。\n\
  \n大多数中心化当局拥有巨大权力，几乎没有批评的余地。中心化当局助长专制，导致掌权者对待他人不公。世界各地，被统治者与统治者之间的关系正在疏远。这是因为政府服务未能提供其设立初衷所应提供的服务。政府服务的大多数方面都易受腐败和低效的影响。\n\
  \n大多数人害怕与政府系统打交道，因为大多数政府系统声誉不佳。你可能不得不在长队中等待仅仅为了填写简单的表格，报税通常也是一个非常缓慢的过程。人们现在认为政府雇员在管理国家事务上没有尽全力。\n\
  \n政府系统面临的挑战主要与数据管理有关。就像其他大型组织一样，政府负责协调不同参与方之间的流程。但它们被期望向公众确保公平、问责和透明——甚至比私营部门的大多数组织要求更高。如果政府要在应对这些挑战中取得成功，特别是在数字时代，则需要妥善的数据管理。\n\
  \n旧的中心化数据管理工具缺乏解决政府面临挑战的资源。例如，数据安全常因标准客户端-服务器系统常见的单点故障而受到威胁。由于政府数据库是中心化的，因此难以实现透明度。\n\
  \n在强调区块链对政府系统的影响时，同样重要的是要补充指出，仅靠分布式账本技术无法防止恶意行为者、犯罪，也无法使政府系统更高效。它能够补充现有的社会结构和法律框架。事实上，如果执法不力、技术知识匮乏、信息输入不准确、缺乏社会善意，以及缺乏合作的政治精英，基于区块链的治理可能无法遏制腐败，就像现有的系统、法律和政策一样。在继续阅读前，请务必牢记这一点。\n\
  \n### 政府流程中的主要区块链用例\n\n部署时，有若干用例展示了区块链应对现有系统弱点的明智方式。\n\n![Image](img/Image00044.jpg)\n\
  \n#### 1. 公共采购\n\n在政府活动方面，公共采购或与政府合同相关的事务是各级政府支出的最大市场。它同样是大规模腐败的最大渠道。这一特定政府流程在高收入国家和发展中国家都变得极易滋生高度腐败，原因有几点。请记住，我们确定的政府系统痛点之一是运作不透明，而供应商选择过程不透明且极其复杂。\n\
  \n它在很大程度上涉及人为自由裁量权的使用。此类漏洞最终导致严重的财务浪费，减少健康竞争，扭曲市场价格，在大多数情况下导致服务低效和项目执行中使用劣质商品。那么，分布式账本技术如何提供帮助？通过使用基于区块链的流程，可以直接解决整个政府采购流程的腐败风险因素。\n\
  \n基于区块链的流程可以提供交易的第三方监督，留下所有活动的指纹记录。这通过自动化智能合约促进了统一性和客观性，以及交易和官员的问责制和透明度。我需要补充的是，此用例存在一定局限性。区块链平台无法捕捉人际互动的所有方面。因此，如果贿赂、串通和常规供应商选择仍在线下进行，基于区块链的反腐败潜力将受到限制。\n\
  \n#### 2. 土地所有权登记\n\n一些国家在实施基于区块链的土地所有权登记方面走在前列。瑞典是在此领域进行实验以提高效率的国家之一，该行业涉及大量交易。印度和洪都拉斯等其他国家也在努力提高房地产领域的透明度，该领域极易受到各种腐败行为的侵害。\n\
  \n\n\n\n\n### 区块链在政府中的应用\n\n#### 1. 土地登记\n\n利用分布式账本技术的土地登记系统，可以建立一个去中心化、安全、不可篡改且公开可验证的记录系统，使人们能够证明其土地权利。区块链为该领域提供的特性，不仅能增强土地所有权的韧性，还能大幅降低为私利操纵土地权利的机会。但仅靠区块链可能不足以在土地登记错误、不存在或不完整的国家正式确立财产所有权。此类国家可能需要在享受基于区块链的土地权属登记带来的红利之前，先收集、清洗并数字化其土地所有权信息。\n\
  \n#### 2. 区块链与智慧城市\n\n智慧城市利用信息技术与数据的结合来整合和管理基础设施（商业、社会、物理基础设施），以简化为居民提供的服务，同时确保可用资源得到最优和高效的利用。世界各国政府可以通过结合物联网、分布式账本技术和云计算，为市民及地方政府提供创新解决方案和服务。\n\
  \n政府可以利用区块链建立安全基础设施，以帮助管理各项职能。借助区块链驱动的互操作基础设施，智慧城市的职能和服务可超越当前的预期。目前，ConsenSys 已在迪拜等国开展项目，以推动智慧城市倡议的落地。由谢赫·穆罕默德·本·拉希德·阿勒马克图姆领导的“智慧迪拜”倡议，旨在借助物联网、人工智能和区块链技术，确保迪拜成为世界上最幸福的城市。\n\
  \n#### 3. 中央银行业务\n\n全球各国政府反复从事的一项活动是实时全额结算。它涉及在中央银行记录中结算银行间支付，由于区块链能显著提高网络韧性和交易量，中央银行可以更快、更安全地处理实时全额结算。在第\
  \ 16 章中，我们将探讨央行数字货币及其如何改变政府处理货币的方式。\n\n#### 4. 投票\n\n无论你持有何种信念，大多数人都同意的一点是：试图影响投票系统是一种由来已久的做法，且仍是各国面临的最大问题之一。大多数人因政治环境的性质而试图通过欺骗手段获取权力。人们对选民登记的完整性、投票率、选举安全性和投票可及性的担忧日益增加。\n\
  \n这些问题促使各国政府探索基于区块链的投票平台的可行性，以提高参与度和对民主进程的信任。区块链特性可通过在整个选举过程中促进不可篡改性和透明度来支持投票。区块链等分布式账本技术的去中心化、加密、透明和不可篡改特性，能大幅减少选举舞弊案件，同时提高投票可及性。\n\
  \nHorizon State 是一个主要为满足厌倦了昂贵缓慢的纸质选票和不安全的电子投票服务的组织及个人需求而建立的项目。该项目的安全数字投票箱为现有投票程序面临的挑战提供了智能解决方案，且具有成本效益。\n\
  \n参与者只需 Horizon 的数字代币 (HST) 即可从笔记本电脑或智能手机上投票。投票会即时记录在不可篡改的区块链上，作为验证选举结果的可靠数据库。有了这套拟议系统，记录错误、操纵或篡改结果将变得极其困难。除了用于投票外，该平台对其他用途也非常有用。在权力和资源共享的环境中，它将有助于决策并能激励人们参与。\n\
  \n投票中的另一个常见问题是选民冷漠——即选民不去投票的情况。这一问题近期有所加剧，但有了 Horizon 等项目，任何人都能方便地通过智能手机投票。担心在投票中心遭受袭击或恐吓的人们可以放心地投票。\n\
  \n#### 5. 区块链与证书验证\n\n基于区块链的证书验证系统是该技术在政府流程中的另一个绝佳用例。个人可借助区块链技术，将学历和专业证书存储在加密身份钱包中，从而更好地控制对其数据的访问。该系统还能帮助学校、雇主和大学轻松验证员工和学生所获工作和课程的“证明”。\n\
  \n#### 6. 疫苗分发\n\n基于区块链的疫苗分发网络将确保疫苗制造商主动监控其应用以应对潜在挑战，并享受改进的召回管理。此外，分布式账本技术可为分销商提供实时可见性，并增强其应对供应链潜在中断的能力。分发方也不例外，区块链可帮助他们改进库存管理并有效监控疫苗安全。有了区块链，人们能更信任疫苗，这反过来将有助于提振全球经济。\n\
  \n#### 7. 利用区块链追踪学生贷款和助学金\n\n政府可编程智能合约以帮助管理贷款和助学金申请。它也可用于发放贷款，并监控对贷款所有条款和条件的遵守情况。借助分布式账本技术，政府机构有可能实现绩效追踪自动化，进而产生实时数据，并提高合规性和安全性。\n\
  \n#### 8. 税收征管\n\n当然，税收征管流程将因智能合约而经历显著变革。借助智能合约，政府可通过将税务数据与收入交易匹配、计算社保和税务扣除，轻松简化整个税收征管流程。可以自动向每个接收方转发税后工资和税款，从而提高流程的速度、效率和安全性。\n\
  \n在我们应对恶意行为者的探索中，肯定会涌现更多区块链用例。随着更多用例的发现，区块链在打击政府腐败方面的独特性和未开发潜力不应阻碍政策制定者将区块链部署到公共领域。该技术有潜力使政府流程变得高效、快速、安全和透明。\n\
  \n# 第三部分：区块链的未来——区块链驱动的数字化转型 去中心化世界在向我们招手\n\n## 第 14 章：区块链对商业与经济的未来影响\n\n普华永道 (PwC)\
  \ 于 2020 年 10 月发布的一项新分析显示，在未来十年内，区块链技术有望使全球国内生产总值 (GDP) 增加 1.76 万亿美元。该报告题为《*信任时刻：重新思考区块链的万亿美元理由*》，其中的实用发现评估了区块链技术当前的使用情况以及该技术将以各种方式影响全球经济。报告分析了分布式账本技术的五大用例（本书也涵盖了这些用例），并估算了它们创造经济价值的潜力。\n\
  \n![Image](img/Image00045.jpg)\n\n\n\n\n\n### PwC 关于区块链经济潜力的报告\n\n此外，PwC 报告确定了区块链技术在各个行业创造显著价值的潜力——公共服务、政府、物流、制造、零售和金融。正如报告所指出的，区块链一直被视为对以太坊等数字货币有用，但该技术能提供的远不止于此，特别是在私营和公共组织共享、使用和保护数据的方式方面。\n\
  \n当各组织应对全球 COVID-19 大流行的影响时，大量颠覆性趋势获得了提振。这一分析至关重要，因为它揭示了区块链帮助行业和组织重建甚至重新配置其运营的潜力，其特点是在社会和各行业中实现了透明度、效率和信任的巨大提升。\n\
  \n#### 将从区块链应用中受益的五大行业\n\n![Image](img/Image00046.jpg)\n\n来源：PwC\n\n报告的部分内容利用经济分析和行业研究，评估了区块链有潜力提供经济价值的五大主要应用领域。根据他们的分析，预计\
  \ 2025 年将是一个转折点，届时分布式账本技术预计将在全球经济中得到更广泛的采用。\n\n- **供应链管理**：榜首是供应链管理，这是我们之前讨论过的。该行业拥有最大的经济潜力，约为\
  \ 9620 亿美元。区块链技术的应用可以产生深远影响，支持时尚品牌、采矿等重工业。\n- **支付和金融服务**：第二大行业是支付和金融服务，这包括加密货币的使用或通过汇款支付支持金融普惠。报告认为，该行业拥有第二大经济潜力，达\
  \ 4330 亿美元。\n- **身份管理**：身份管理位列将享受区块链技术红利的第三大行业，其经济潜力估计为 2240 亿美元。该行业包括个人身份证、证书、专业资质等，有助于降低身份盗窃和欺诈案件。\n\
  - **合同与争议解决**：区块链的第四大用例是利用智能合约在合同中的应用，以及在争议解决中的应用，其经济潜力为 730 亿美元。\n- **客户互动**：在客户互动方面，区块链有潜力达到\
  \ 540 亿美元，这包括在忠诚度计划中使用区块链技术。\n\n#### 区块链在全球各地区的影响\n\n![Image](img/Image00047.jpg)\n\
  \n区块链技术的成功程度将很大程度上取决于政策环境的支持力度。一个愿意利用区块链技术提供的新机遇、且拥有合适的产业组合的商业生态系统，是最大化技术效益的关键要素。\n\
  \n据信，从分布式账本技术中获得最高经济效益的大洲是亚洲。事实上，PwC 报告显示，就不同国家而言，中国有望获得约 4400 亿美元的净收益。紧随其后的是美国，潜在净收益为\
  \ 4070 亿美元。预计其他将享受超过 500 亿美元净收益的国家包括英国、法国、德国、印度和日本。然而，这些国家将从分布式账本技术中享受不同类型的收益。\n\
  \n例如，以制造业为主导的经济体如德国和中国，将从溯源和追踪中获益最大。另一方面，预计美国将从在证券化、支付、身份和凭证领域应用区块链技术中获益最大。\n\n\
  #### 行业层面的情况如何？\n\n根据 PwC 报告，基于行业层面，享受区块链技术红利的最大受益者可能是医疗保健、公共管理和教育部门。报告预计，这些部门将利用区块链在身份和凭证管理方面的效率，到\
  \ 2030 年实现约 5740 亿美元的增长。通信和媒体以及商业服务也将享受更广泛的收益，而建筑服务、零售商、制造商和批发商将通过区块链技术吸引消费者并满足其对可追溯性和溯源的需求而受益。\n\
  \n报告审视的另一个视角是区块链成为组织未来战略一部分的潜力。根据 PwC 与商业领袖开展的研究结果，约三分之二（61%）的 CEO 透露，在从 COVID-19\
  \ 大流行的影响中复苏的过程中，核心业务流程和运营的数字化转型将成为前三大优先事项之一。\n\n事实是，公司在实施区块链、AI 和 IoT 等新兴技术时，能犯的最大错误之一就是将其仅留给团队中的爱好者。为了发挥最佳作用，识别此类技术的战略机遇和价值，甚至在行业中激发适当程度的协作，都需要\
  \ C-Suite（高层管理人员）的支持。考虑到大多数企业目前面临的经济动荡程度，能够成功建立甚至可扩展延伸的概念验证用例，将帮助组织不仅发现新兴技术的价值，还能帮助它们在利用区块链潜力提供的任何解决方案中建立信任和透明度。\n\
  \n为确保实现区块链技术的经济影响潜力，妥善管理其能源开销至关重要。对我们活动对地球影响的日益关注（如气候变化问题）意味着，公司必须探索整合和共享资源的新模式，同时减少对中心化数据库的依赖以及总体能源使用量。\n\
  \n## 第 15 章：区块链身份时代\n\n虽然数字身份的概念对你来说可能显得有点复杂，但它并不难理解。它基本上是指存在于网络上且可轻松追溯到所有者的任何个人数据。根据国际电信联盟的定义，数字身份是关于特定个人或组织的数据的数字化表现。所以，以照片为例，当你在社交媒体上传照片，无论是在你评论的帖子、你自己的帖子，还是在线银行账户中，它们都构成了你数字身份的一部分，因为任何人都可以凭此类照片轻松在线下识别出你。数字身份有时被视为用户现实生活身份的数字化等价物，包含若干属性：\n\
  \n![Image](img/Image00048.jpg)\n\n它可以超越我刚列出的常见属性，如年龄、姓名、物理地址或电子邮件地址，甚至包括银行账户详情和健康相关信息等敏感信息。\n\
  \n不过，你应该记住，数字身份不再被严格视为仅包含相同数据的延伸护照或身份证。当涉及到我们全球数字经济的增长和生存能力时，有一点是确定的：数字身份不可或缺。它是全球所有行业中每一个组织的基础。\n\
  \n世界实际上正在进入由数据和机器学习驱动的智能自主系统时代。电子商务、人工智能、物联网等领域的最新趋势表明，技术正日益与网络物理系统交织在一起。这也引起了主要利益相关者对数据隐私和数字身份重要性的关注。\n\
  \n\n\n\n数字空间在过去几十年里见证了巨大的技术进步，这反过来又彻底改变了我们的生活——从与身在另一大洲的家庭成员保持联系，到娱乐、与同事协作，甚至购物。人们现在比以往任何时候都更多地使用互联网在线执行多项任务，COVID-19\
  \ 的爆发进一步增加了我们的在线活动，数字身份的概念不容忽视。事实上，为了增强隐私、可用性和安全性，已投入数十亿美元。无论在管理数字身份上投入多少资金和投资，无疑都遇到了诸多挑战。\n\
  \n### 数字身份管理模型\n\n![Image](img/Image00049.jpg)\n\n让我们看看数字身份管理的模型。第一种模型是孤岛型，在这种模型下，每个组织为其用户提供数字身份凭证。这允许用户访问其平台上的各种服务。因此，对于用户接触的每个新组织，都需要拥有一个新的数字身份凭证，这提供了糟糕的用户体验。想象一下，为想要访问的每个网站注册并创建新的登录详细信息和密码。\n\
  \n由于第一种数字身份管理模型的糟糕用户体验，第二种模型应运而生，称为“联邦”模型。第三方开始提供数字身份凭证，使用户能够登录服务和不同的网站。该模型的一个典型例子是“使用\
  \ Google 登录”或“使用 Facebook 登录”功能。因此，许多组织将公司的身份管理外包给了在收集用户个人数据方面有经济利益的公司。\n\n不幸的是，这最终在全球范围内引发了隐私和安全问题，并引发了多起诉讼。Google\
  \ 和 Facebook 等公司成为了信任的中介。但随着区块链技术、可验证凭证和去中心化标识符的引入，我们现在看到了第三种身份管理模型。这允许创建自主身份，我们将在本章后面进行探讨。那么，可验证凭证、去中心化标识符和区块链身份管理之间有什么关系呢？\n\
  \n可验证凭证作为发行者以尊重隐私和防篡改的方式做出的声明。它们通过公钥加密和隐私保护策略的组合，为声明数据的数字水印提供了空间，以避免关联。这确保了物理凭证可以安全地数字化，凭证持有者可以透露其凭证中的特定信息，而无需透露实际数据。因此，您可以轻松证明您年满\
  \ 18 岁，而无需出示身份证，在第三方可以验证此特定数据而无需发行者关注的情况下。\n\n第二种是去中心化标识符，它们是唯一的、持久的和全局的标识符。DID\
  \ 完全由身份所有者控制，并且完全独立于权威机构、中心化注册表和身份提供者。分布式账本充当可验证数据注册表，您可以将其视为“电话簿”，人们可以查阅以验证特定公共\
  \ DID 所属的组织。在身份管理方面，区块链技术允许网络上的所有参与者访问关于有效凭证以及证明其有效性的实体的相同事实来源，而无需披露真实信息。\n\n利用分布式账本技术进行身份管理时，基本上有三个参与者：所有者、发行者和验证者。\n\
  \n![Image](img/Image00050.jpg)\n\n这三个参与者在利用数字账本技术进行身份管理时发挥着关键作用。身份发行者是指政府机构等受信任方，它们发行身份所有者的个人凭证。身份发行者通过发行凭证即时证明用户个人数据的有效性。然后身份所有者可以选择将凭证保存在其个人身份钱包中，随后在交易中用于向第三方（验证者）证明其身份的有效性。您可以将凭证视为多个身份属性，而身份属性是指关于任何给定身份的一条数据，例如出生日期、年龄、姓名等。\n\
  \n### 身份当前的运作方式\n\n让我们从三个不同的角度来看看身份是如何运作的。首先，让我们看看它对公司和组织是如何运作的。这些公司获取关于其用户的敏感数据，然后将其与不太敏感的常规业务数据一起保存。这种设置并不理想，因为它导致了新的业务风险，尤其是随着以用户隐私为中心的法规（如\
  \ GDPR）日益增加。考虑到行业对企业 IT 责任的关注点日益转移，这也不理想。\n\n![Image](img/Image00051.jpg)\n\n当这些数据被归入高度安全的数据保管库时，它们对于各种用途（如帮助更好地了解客户或帮助推动产品改进）也将变得不那么有用。大多数专家认为，在公司能够在业务需求和数据安全之间找到适当的平衡之前，它们可能已经面临巨额罚款，或者设法开发出了更强大的\
  \ IT 能力。\n\n第二个视角与物联网有关。联网设备的数量多年来急剧增加，2021 年估计为 138 亿台。\n\n然而，预计到 2025 年，这一数字将增加到\
  \ 309 亿台。物联网技术总体上是一个新兴行业，大多数公司尚未能创建适当的身份和访问管理能力。对于相互连接的物联网设备和物体来说，识别监视器、传感器和设备至关重要。\n\
  \n它们还应能够安全地管理对敏感和非敏感信息的访问。为了解决这一差距，主要 IT 供应商已经提供物联网管理系统，以帮助解决大多数服务缺口。例如，您可以轻松发现一家公司拥有数千个物联网设备，而传统服务器和用户设备仅有几十或几百个。但如此大量的物联网设备面临的一个挑战是跨多个设备的标准不匹配。在这个规模下，安全问题往往是事后才考虑的，尤其是实现简单管理能力的任务非常具有挑战性。\n\
  \n第三个视角与个人的身份管理有关。没有身份，我们的社会和经济无法正常运转——它是生活不可或缺的一部分。只有当我们正确识别自己及我们的财产时，我们繁荣的社会和全球市场才能运作。当我们从最基本的层面来看身份概念时，它涉及关于个人、地点或事物的一系列声明。对于个人而言，这通常包括我们的名、姓、国籍、出生日期和其他国家标识符，如社会安全号码\
  \ (SSN)、护照号码或驾驶执照。\n\n\n\n政府或中心化实体通常负责发布这些数据点，随后将其存储在中心化数据库（中心化政府服务器）中。尽管存在某种形式的物理身份识别需求，但有一点是确定的——由于多种原因，它并未广泛地为人们所用。现有数据表明，全球约有\
  \ 11 亿人缺乏主张其身份所有权所需的资源。\n\n这暴露了世界七分之一人口的脆弱程度，因为这些人可能无法拥有财产、在本地或全球范围内寻找就业、参与选举投票，甚至无法开设银行账户。这意味着，由于无法获得适当的身份证明文件，此类人群接入金融体系的能力受到威胁。这最终限制了他们的自由。\n\
  \n拥有某种官方批准身份证明的个人，也面临着无法对其身份拥有正确控制权和完全所有权的问题。他们的在线身份识别体验是碎片化的，且通常在不知情的情况下失去了其数据产生的价值。正如我们在雅虎、Facebook\
  \ 及其他多起案例中所见，大多数存储用户数据的公司经常遭到黑客攻击。这迫使最终用户不得不长期生活在持续的欺诈防范之中。\n\n### 为什么要用区块链进行身份管理？\n\
  \n![Image](img/Image00052.jpg)\n\n整个身份管理流程饱受诸多问题困扰，深入了解其中一些挑战将有助于我们认识到去中心化数字身份管理系统的必要性。早前，我们讨论过个人和公司正在探索区块链技术的其他用途。身份管理便是其中一项应用。考虑到区块链技术的特性和优势，有可能消除身份管理面临的大多数现有问题。区块链有助于解决身份不可及的问题。在缺乏身份证明的\
  \ 11 亿人中，45% 属于全球最贫穷的 20% 人口。\n\n无法获得官方认可的物理身份形式，通常是由多重障碍造成的，如涉及的费用、对个人身份缺乏认知、繁琐的身份证件办理流程以及缺乏获取渠道。这些因素阻碍了十亿多人融入传统身份识别体系。没有物理身份，任何人都难以入学、享受各类政府和非政府组织服务、办理护照，甚至找到一份好工作。\n\
  \n在当前全球化经济背景下，拥有身份对于接入现有金融体系至关重要。目前，全球有超过 27 亿无银行账户人口，其中 60% 拥有手机。这为基于区块链的移动身份解决方案创造了机会，能够满足全球最脆弱人群的需求。\n\
  \n#### 1. 数据不安全性\n\n我们需要区块链的主要原因之一，是为了帮助解决数据不安全的问题。你是否注意到，我们大多数宝贵的身份识别信息通常存储在由遗留软件支持的中心化政府数据库中？遗憾的是，其运作方式制造了多个单点故障。黑客和心怀不轨者发现，包含数百万用户个人可识别信息（PII）账户的大型中心化系统极具吸引力。\n\
  \n根据 2019 年美国消费者数据泄露报告，2018 年约有 28 亿消费者数据记录遭泄露；黑客最常攻击的消费者信息类型是个人可识别信息（PII），最频繁的泄露原因是未经授权的访问。仅在\
  \ 2018 年，尽管企业努力并出台了旨在改善网络安全的监管法规，泄露消费者数据记录的总成本估计仍超过 6540 亿美元。\n\n当然，我们都知道数据泄露的长期影响，包括受影响公司客户忠诚度下降、声誉受损，甚至各种难以估量的软性成本。2019\
  \ 年约有 3800 起公开披露的泄露事件，暴露的记录总数达 41 亿——比 2018 年的数字增长了 54% 以上。\n\n#### 2. 欺诈性身份\n\n\
  对许多用户而言，其数字身份环境相当碎片化，因为大多数人需要在各个网站上同时管理多个与其用户名关联的身份。目前，仍无标准方法将任一平台生成的数据用于其他平台。由于数字身份与线下身份之间的薄弱关联，创建虚假身份相对容易。虚假身份引发诸多挑战，因为它为伪造交互提供了温床，进而助长欺诈，并导致数字膨胀和收入损失。这种漏洞对社会产生负面影响，因为它往往助长虚假新闻等弊端的产生和传播，正如在美国大选中所见，这已对世界各地的民主构成显著潜在威胁。\n\
  \n#### 3. 糟糕的密码组合\n\n这或许是身份管理流程中最常见的挑战。目前，大多数应用程序在用户获得账户访问权前，提供基于密码的登录认证系统。但这一过程也涉及多重风险。事实是，该过程很复杂，因为所有应用程序的密码都有特定的过期日期。此外，新密码的具体要求往往随时间变化，这使得跟踪新密码甚至重置旧用户密码变得更加困难。\n\
  \n整个过程导致用户经历所谓的“密码疲劳”，从而诉诸于在多个应用程序中使用相同的密码。事实上，他们反复使用以前用过的密码，这最终增加了其身份的安全风险。还需补充一点：每当我们使用通用密码时，都给了黑客毫无困难地窃取用户数据的机会。\n\
  \n区块链技术的设计使其能够以不可篡改和加密的方式维护数据，并通过密码学保障安全。这确保了所有 ID 可追溯且受保护。此外，分布式账本技术平台消除了与密码保护相关的漏洞。\n\
  \n#### 4. 手动配置与取消配置流程导致的故障\n\n一旦个人受雇于某组织，公司 IT 部门便负责授予员工访问公司核心服务器、文件服务器、电子邮件账户及各类内部网络系统的权限。整个配置流程通常在部门层面执行。这也意味着在大多数情况下，授予员工访问权限的人是部门管理员。但考虑到涉及的手动流程，这往往容易导致多种人为错误。\n\
  \n当员工离职时，员工的访问权限将立即被限制。这是取消配置流程，通常也是手动进行的。这正是一些员工离职后仍保留对中心服务器访问权限的一个重要原因。这可能成为由人为错误引发的重大问题，因为黑客不难在组织员工毫无察觉的情况下渗透服务器并窃取宝贵信息。\n\
  \n\n\n\n#### 5. 访问限制缺乏法规约束\n\n任何组织的数字身份管理系统都必须知晓每一个有权访问特定类型应用程序或数据的个人。系统应能确定用户访问这些应用程序和数据时所使用的特定设备。当涉及云服务时，这一问题变得更加严峻。\n\
  \n不幸的是，大多数身份管理系统缺乏充分的法规约束，这导致大量用户很容易访问他们本不应访问的数据。因此，在缺乏配备正确法规的适当控制时，要提供全面的安全保障极其困难。结果，许多用户遭受重大损失，甚至丢失其最宝贵的信息。这一问题在中心化系统中更为普遍。\n\
  \n#### 6. 浏览器和设备中身份安全级别低下\n\n浏览器已成为我们生活中不可或缺的一部分，因为我们做的大多数事情现在都在互联网上进行。因此，我们可以轻松地使用笔记本电脑、智能手机和各种小工具访问各类应用。但问题出在当你对同一个应用拥有太多访问入口时。你可以通过笔记本、台式机、智能手机甚至平板电脑登录一个应用，有时还是通过浏览器进行。\n\
  \n这导致用户为任何给定账户设置了多个风险点。现实情况是，黑客往往更容易访问你的设备或浏览器，并控制你的密码以及个人数据。这解释了为你使用的所有设备建立良好安全系统的重要性；没有有效的身份管理系统，你的任何\
  \ ID 都无法得到保障。\n\n#### 7. 应用程序未及时更新\n\n大多数人可能不知道，更新应用程序与识别风险之间存在关联。当然，当开发者创建应用程序时，他们也会建立良好的安全措施，以帮助保护用户免受恶意人士的侵害。现实中，绝对不存在完美的应用程序，这意味着必然会存在漏洞和缺陷，尤其是当大量用户开始使用该应用程序时。因此，一旦应用程序用户发现漏洞并提交报告，开发者的响应就是发布安全补丁。但开发者往往不会足够快地更新应用程序。\n\
  \n另一方面，用户往往也无法及时更新其应用程序，以便在最新版本发布的那一刻就使用上。这种延迟为黑客利用漏洞和缺陷窃取身份信息提供了可乘之机。这不仅适用于使用智能手机和其他小工具的个人；也适用于企业。企业需要不断使用适当的安全补丁更新其应用程序，以避免此类风险。\n\
  \n#### 8. BYOD 场景下缺乏与身份绑定的良好设备管理\n\n身份管理系统面临的最大挑战之一，是某些 BYOD 场景下缺乏良好的设备管理。如果你不确定\
  \ BYOD 的含义，它简单来说就是“自带设备”。随着智能手机和其他设备的普及，许多组织允许员工自带设备上班并在办公室使用，这已成为常见做法。\n\n当然，这种做法有益于多个方面，其中之一是员工也可以用同一设备在家完成任务。但一些企业未考虑到与此做法相关的风险。公司内员工使用的每台设备，通常都受到防火墙或其他安全服务的保护。个人设备通常并非如此，因为它们大多缺乏办公室设备同等级别的安全措施。\n\
  \n允许员工使用自有设备工作的后果是，一旦他们连接到组织网络，就面临身份暴露给黑客的风险。一旦黑客访问了此类组织中单个员工的设备，将危及整个网络的安全。企业真正需要的是一种系统，确保连接到服务器的仅为已注册的个人设备。\n\
  \n#### 9. 重复注册或 KYC 流程\n\n你开过银行账户吗？你还记得填写表格并提供所有要求的详细信息吗？好吧，你最终会为了不同目的——保险、贷款等——重复做这件事好几次。当我们卷入这些相同\
  \ KYC 协议的重复过程中时，我们为黑客获取我们的信息创造了多个切入点。重复的 KYC 流程无疑是身份管理系统的一大难题。你每次需要服务时都要注册的所有平台，都有各自独立的服务器。这不仅使数字身份更容易遭遇隐私泄露，而且每次想使用服务都要重复相同流程，着实浪费时间。\n\
  \n那么，要回答为什么区块链非常适合身份管理，我们见证了现有智能手机复杂程度的显著提升和密码学的巨大进步。区块链技术与这两者的结合，创造了构建独特且新型身份管理系统所需的正确组合和工具。因此，这就是区块链成为身份管理挑战的绝佳解决方案的原因。开发者可以利用去中心化标识符（DID）的概念构建数字身份框架。\n\
  \n通过提供防篡改、统一且互操作的基础设施，区块链技术能够安全地管理和存储数字身份，同时为用户、物联网管理系统和企业带来显著优势。区块链数字身份管理解决方案日益受到探索的主要原因在于，其特性（包括透明性、信任和用户控制）都是有效数字身份管理的关键因素。\n\
  \n### 区块链技术与企业和政府的身份管理\n\n我们不再能说去中心化数字身份（DDID）仅仅是一个流行词。事物正在快速变化，DDID 有潜力将现有的物理和数字身份生态系统（目前是中心化的）重构为民主化和去中心化的架构。为了确保你了解去中心化身份的含义：\n\
  \n> “它指的是一种信任框架，我们习惯的常用标识符（如用户名）可以被独立的、自主拥有的 ID 所取代，并允许通过区块链和分布式账本技术交换数据。”\n\n使用去中心化身份的目标主要是保障在线交易安全并确保隐私。\n\
  \n### 去中心化数字身份：它是什么及如何工作\n\n解释去中心化身份含义的另一种简单方式是：不再会有中心化机构能对任何形式的身份拥有主张权。有了去中心化身份，你的身份将完全由你自己掌控。此外，去中心化身份提供的额外安全级别无疑会让你惊叹。它提供了一种系统，使得没有任何单个个人、组织或第三方能滥用你的数字身份。\n\
  \n每个使用区块链进行身份管理的企业，都将解决第三方组织滥用数字信息相关的挑战。区块链可以通过多种方式帮助数字身份管理。\n\n#### 创建 DID\n\n\n\
  \n\n它将有助于创建数字身份标识符（DID）。请记住，区块链地址非常独特，但也可以使用此类地址来创建 DID。这些区块链地址受加密保护，且仅由所有者生成。数字身份区块链平台的另一个重要用途是将其用作数字身份注册表。因此，通过这种设置，用户可以方便地将其\
  \ ID 中包含的所有数据存储到不可篡改的账本存储中。有了此功能，任何人几乎都不可能窃取您的信息或随时访问您的 ID。\n\n#### 凭证公证\n\n您可以将其视为在您的\
  \ ID 上盖章。数字身份区块链平台可以将您数据的哈希地址放置在数字身份区块链平台上。这并不意味着存储在账本上的仅仅是您的凭证。相反，哈希地址将充当时间戳并提供某种电子印章。因此，每当学生毕业时，机构可以选择在平台上为学位提供哈希值。\n\
  \n有了提供的哈希值，学生将知晓学位的颁发时间，并拥有学位证书的证明。每当毕业生想要使用学位证书工作时，他都可以凭借大学提供的哈希值轻松证明资格的真实性。这是改变我们处理知名大学认证方式的绝佳途径。它还有助于消除许多组织在招聘新员工时面临的伪造证书问题。\n\
  \n#### 同意与访问权控制\n\n数字身份区块链平台还可以帮助控制对您凭证的访问。在某些情况下，您可能希望仅在有限时间内在不同平台上共享您的个人信息。您可以授予您想要合作的组织临时访问权限，仅用于确认您是否真正拥有经过公证的凭证。要实现这一点，您可以将其设为一种具有过期日期的交易。一旦访问权限过期，一切将恢复到之前的状态，他们将失去对信息的访问权。对于被临时授予访问您凭证权限的公司或组织而言，他们将被要求删除该信息，并在平台上提供已删除的证据。\n\
  \n##### 自主身份（SSI）\n\n![Image](img/Image00053.jpg)\n\n解释 SSI 的含义可能听起来有点棘手。实际上，它的意思是一个人将成为其身份的模拟版和数字版的唯一所有者。这也意味着组织也可以享受这种特权。拥有自主身份的每个用户都有权决定谁可以访问其数据。他们可以使用\
  \ SSI 在线验证身份，并负责维护它。考虑到这种身份的性质，最适合它的技术将是分布式账本技术。\n\n这是因为区块链的去中心化特性确保了没有任何第三方的存在。但要使系统全面且成功地运行，将需要若干原则。基于区块链的自主身份平台可以通过使用这些指导原则与\
  \ GDPR 法律协同运作。每个平台都必须提供 SSI 的十项基本原则。那么，这些原则是什么？\n\n1.  **存在性：** 平台上的用户应具有独立的存在性，且也应以数字形式存在。\n\
  2.  **访问性：** 每个自主身份都应为用户提供完全访问权。这意味着平台上的用户可以访问其信息，也可以访问其他声明，而无需依赖任何第三方。然而，由于数据具有无法修改的签名验证，用户可能无法修改所有数据。\n\
  3.  **控制权：** 此原则意味着用户完全控制其身份。控制权原则还有另一个角度，因为存在若干实例，用户可能不完全拥有自主身份的所有权。然而，在这种情况下，用户仍有机会限制其他方如何处理其身份。\n\
  4.  **透明度：** 处理身份的所有算法或系统都需要透明度。如果没有开放的系统，用户将无法确保自主身份平台正在妥善管理其身份。\n5.  **可移植性：**\
  \ 平台上的用户应能随时轻松传输其身份。实际上，此功能意味着用户可以轻松导出其身份，并在不同场景中使用它们。\n6.  **持久性：** 优秀的自主身份平台将确保所有身份的长久性。因此，如果系统正在进行升级，平台上的用户仍可像升级前一样保留其先前的数据。\n\
  7.  **互操作性：** 缺乏出色的互操作性会消除身份的灵活性。因此，为了使自主身份平台有效，它应在任何地点均被接受。\n8.  **最小化：** 此原则意味着尽可能在第三方想要访问用户身份时，不应完全暴露用户身份。例如，当第三方需要访问用户的年龄时，系统向该特定用户披露的应仅为年龄，而非用户的确切出生日期。确实没有必要过度暴露用户的身份。\n\
  9.  **同意权：** 无论出于何种原因，第三方均不得访问用户信息。如果第三方想要访问任何用户的信息，必须获得该用户的完全同意。未经用户许可，任何人都无法访问用户身份。\n\
  10. **保护权：** 无论发生什么，用户都应拥有其自主身份的全部权利。这意味着所有 SSI 平台必须无论面临何种压力都维持这一标准。\n\n### 每个基于区块链的去中心化身份解决方案的五大支柱\n\
  \n目前识别数据泄露的估计时间约为七个月。但凭借区块链固有的特性（确保透明度、信任和用户控制），许多组织和政府正日益探索其潜力。然而，每个基于区块链的去中心化数字身份解决方案都应具备五大支柱，这些是确保此类解决方案可行性的关键。\n\
  \n![Image](img/Image00054.jpg)\n\n1.  **隐私：** 区块链加密与数字签名的结合保证了“隐私设计”，这得益于假名化。通过为用户进行的每一笔交易添加数字签名，交易也将变得万无一失。\n\
  2.  **简易性：** 平台上的用户应能随时轻松传输其身份。实际上，此功能意味着用户可以轻松导出其身份，并在不同场景中使用它们。\n3.  **安全性：**\
  \ 无论发生什么，用户都应在自主身份平台上拥有全部权利。这意味着所有 SSI 平台必须无论面临何种压力都维持这一标准。\n4.  **完整性：** 就完整性而言，与传统身份系统不同，去中心化数字身份应为用户提供在网络中各个节点上维护其身份的能力。不应存在单点故障，这确保了黑客无法轻易破坏数据的完整性。\n\
  \n\n\n\n#### 5. 信任\n\n由于基于区块链的系统中用于通信的元数据维护在数字账本中，数据真实性验证通过多个节点进行。在数字身份的背景下，这种去中心化极其有用，特别是在国家标识符常跨多个机构使用的情况下。\n\
  \n以下是用户使用自主身份（Self-Sovereign Identity）可执行操作的总结：\n\n*   用户可以控制自己的身份。\n*   他们可以轻松访问并更新其信息（在某些情况下，可能需要第三方验证某些声明）。\n\
  *   如果他们迁移，可以将数据传输到其他组织或司法管辖区。\n*   如有需要，可擦除身份。\n*   选择他们想要保密的具体信息。\n\n任何能够提供这些服务的系统都必须建立特定机制。它们必须：\n\
  \n*   确保身份拥有长久的生命周期——永久是最好的。\n*   使用极其强大的算法来帮助验证用户身份及声明。\n*   保护用户权利。\n*   确保互操作性。\n\
  *   确保数据共享严格基于用户同意。\n\n### 去中心化身份的优势\n\n政府法规（如欧盟《通用数据保护条例》（EU GDPR））多年来一直在努力加强身份标准，特别是那些需要现代身份解决方案的标准。各国政府正日益探索利用区块链技术为尚未拥有身份的个人提供身份标识，并保护公民的个人可识别信息。那么，区块链在哪些方面有益于去中心化数字身份？它提供了三大核心优势，将助力政府和组织实现创建去中心化身份的目标。\n\
  \n#### 去中心化公钥基础设施 (DPKI)\n\n去中心化身份的核心是 **DPKI**，数字账本技术通过建立一个受信且防篡改的媒介，适合分发身份持有者的非对称验证密钥和加密密钥，从而实现了\
  \ **DPKI**。借助 **DPKI**，任何人都可以以防篡改且按时间顺序的方式在分布式账本上创建或锚定加密密钥。这些密钥的用途是授予他人访问权限以验证数字签名，或为任意身份持有者加密数据。\n\
  \n最初，传统证书颁发机构负责为用户提供数字证书。然而，借助分布式账本技术，不再需要中心化的证书颁发机构（**CA**）。除了是去中心化身份不可或缺的一部分外，**DPKI**\
  \ 还是其他用例的赋能者——可验证凭证（**VC**）。当人们提到可验证凭证（**VCs**）这一短语时，通常指的是附带加密证明的数字凭证。\n\n#### 去中心化存储\n\
  \n一般来说，存储在分布式账本上的数字身份比锚定在各种中心化服务器上的身份更安全。当加密安全的区块链（如以太坊区块链）与分布式数据存储系统（如 **OrbitDB**\
  \ 或 **InterPlanetary FileSystem**）相结合时，我们便可以在保持信任和数据完整性的同时，去除现有的中心化数据存储系统。\n\n为防篡改而设计的去中心化存储解决方案的优势之一在于，它们显著降低了实体为窃取或牟利而未经授权访问用户机密信息的能力。毫无疑问，去中心化存储是安全身份数据管理的核心方面之一。在去中心化框架中，凭证通常存储在用户的设备上，如平板电脑、智能手机、台式机，或存储在私有身份存储中。这些私有身份存储通常称为身份中枢，典型例子包括\
  \ **3Box** 或 **uPort's TrustGraph**。\n\n当身份主要处于用户控制之下时，即被视为自主身份。这也意味着用户能够控制对其数据的访问，而无需担心访问权限被撤销。当用户数据处于其控制之下时，信息将更具互操作性，这使用户能够跨多个平台、为多种目的使用数据，而不局限于单一平台。\n\
  \n#### 可管理性与控制权\n\n在中心化身份系统中，提供身份的组织主要负责保护身份数据安全。在去中心化身份设置中情况并非如此，因为确保身份数据安全的责任将落在用户身上。借助去中心化身份框架，用户可自由实施其特定的安全措施，也可将任务外包给外部服务，如密码管理器应用或数字银行保险箱。由于由区块链技术驱动的去中心化身份解决方案迫使黑客攻击单个数据存储，而这成本高昂且通常无利可图，因此黑客往往会因此望而却步。\n\
  \n### 去中心化数字身份及其用例\n\n我们周围有许多行业或领域将从去中心化数字身份中获益匪浅。事实上，其中一些领域已开始使用区块链技术。让我们看看去中心化数字身份的一些用例。\n\
  \n#### 电子商务\n\n为防止电子商务欺诈，需要适当的身份识别。电子商务行业最常见的欺诈类型之一是欺诈性商品销售。买家往往愿支付高价购买正品，但最终收到的却与电商网站宣传的完全不同。发生这种原因之一是，在任何电商平台注册时缺乏适当的协议。电商领域亟需充分的验证机制来保障安全，去中心化身份可为此提供正确的基础。\n\
  \n#### 银行业\n\n银行业已处于使用去中心化数字身份的领先地位。当然，你会同意银行业处理大量与用户身份相关的问题，如反复发生的身份盗窃、**KYC**\
  \ 协议、虚假身份识别等。通过使用去中心化数字身份，银行可轻松解决其基于身份的问题。有了该解决方案，用户在开户时无需应对繁杂流程。只需授权银行访问你的身份并验证你的凭证即可。\n\
  \n#### 政府\n\n政府部门是去中心化身份基础公司最大的服务对象之一。世界各国政府负责向公民签发官方身份证件，但整个流程需升级以满足当前需求和标准。因为该流程往往缓慢且充满错误。政府签发身份证件的挑战之一在于公民缺乏对其身份的完全所有权访问。这解释了为何政府服务需要去中心化数字身份，因为它将大幅减少腐败、文书工作，并提供充分的安全保障。\n\
  \n#### 游戏\n\n\n\n\n\n### 去中心化数字身份：用例与平台\n\n#### 游戏行业\n您会同意我的观点，游戏行业是一个庞大的产业，而该行业处理的事项之一就是玩家的身份。遗憾的是，在大多数情况下，该行业未能为玩家提供足够的安全保障。另一点是，大多数游戏应用还具备应用内购买功能。这进一步增加了对充分安全性的需求，因为此类应用会要求输入信用卡号。去中心化数字身份能够提供去中心化身份基础设施及相应法规，从而规范整个流程，进而消除信用卡详情被盗的案件。\n\
  \n#### 医疗保健\n事实是，大多数医疗机构未能妥善保护患者的个人和健康信息。因此，这些数据大多被用于私人研究，而其他医疗机构则在未经患者必要授权的情况下访问其敏感信息。有了去中心化身份基础设施，患者现在可以享受他们应得的完全控制权和隐私，医疗机构也能保护与患者健康相关的所有数据。\n\
  \n### 适用于去中心化身份的理想企业级平台\n\n区块链领域已有多个优秀的企业级区块链平台，它们非常适合管理去中心化身份管理平台。它们为各种身份问题提供卓越的服务。\n\
  \n#### Hyperledger\n这是一个企业级区块链项目，已有多个项目运行在该平台上。Hyperledger 实际上提供了适合去中心化身份管理的优秀项目，其中之一称为\
  \ `Hyperledger Indy`。这是一个主要用于数字身份的分布式账本。该分布式账本还附带创建去中心化身份管理系统所需的库、组件和工具等其他功能。\n\n\
  此外，还可以在不同平台上使用您的身份。Hyperledger 推出的项目之一称为 `Aries`，该项目于 2021 年初从孵化状态毕业为活跃状态。该项目作为一个工具包，就像您在模块上使用各种功能创建自己的平台一样。`Aries`\
  \ 的功能包括：\n\n*   高性能和更强的可扩展性。\n*   提供许可型区块链平台以及开源工具包。\n*   数据可用性严格遵循“仅按需知晓”原则。\n\
  *   提供增强的安全措施，以确保敏感信息的安全。\n*   提供查询语言以帮助搜索账本。\n*   提供即插即用的模块化结构。\n\n#### Ethereum\n\
  也许，`Ethereum`（以太坊）是仅次于比特币的第二大热门区块链网络，多年来该项目的采用率不断提高。该项目的核心开发者之一是 `Vitalik Buterin`（V\
  \ 神），他在加密货币牛市期间，因 `Ether`（以太币）触及历史高点，成为最年轻的加密货币亿万富翁。`Ethereum` 区块链的目标是面向企业级用途，但它是无许可的。这可能会导致多种挑战，特别是对于去中心化身份管理系统而言，因为隐私是大多数用户的首要需求。然而，`Ethereum`\
  \ 通过 `Enterprise Ethereum Alliance`（企业以太坊联盟）为企业提供了私有版本。借助其平台的私有版本，任何人都可以开发安全的去中心化身份管理系统。您将从该平台享受到的显著特性包括：\n\
  \n*   开源平台。\n*   来自公共版本的持续更新。\n*   用户将获得来自 `Enterprise Ethereum Alliance (EEA)`\
  \ 的权威支持，用于 `Ethereum` 平台上的各类项目。这对于完成指南和标准很有用。\n*   该平台提供多项标准，使任何人都能简单直接地开发不同类型的平台。\n\
  *   `Enterprise Ethereum Alliance` 还为在其旗下开发的所有项目提供政府支持。这意味着，如果您发现另一个组织开发了您所需的多项吸引人功能，`EEA`\
  \ 也将为您提供相同的功能。\n\n### 数字身份领域的项目\n\n多年来，已涌现出多个现实生活中的数字身份解决方案，且仍在不断开发中。以下是一些正在研究这一独特身份模型结构的热门数字身份公司：\n\
  \n#### Civic\n该项目是一个个人身份验证流程，利用分布式账本技术提供数字身份。使用该平台时，不仅可以创建您的虚拟身份，还可以存储其他信息。但在将信息存储到数字身份解决方案之前，您需要验证所有凭证。希望在这些数字身份公司发展业务的人士，可以使用以下四种不同解决方案中的任意一种：\n\
  \n*   可重复使用的 `KYC`，有助于管理各种形式的 `KYC` 要求。\n*   “无密码”登录。\n*   安全 ID 平台，允许用户通过安全身份访问任何网站。\n\
  *   自动化零售授予用户访问智能售货机的权限。\n\n所有形式的咨询、投资和业务关系都有各自的 ID 代码。\n\n#### Sovrin\n另一个为用户提供自主身份（Self-Sovereign\
  \ Identity）的热门项目是 `Sovrin`。这家非营利组织致力于去中心化数字身份解决方案，使用户能够享受信任、控制以及易于使用的数字身份。该项目以提供数字身份的新标准为荣，用户可以获取其身份证和驾照的数字副本。该项目是一个元系统，让个人和组织有机会使用任何应用程序，而无需担心身份问题。\n\
  \n#### uPort\n通过 `uPort` 项目，用户可以享受对其身份的完全控制自由。该项目构建在 `Ethereum` 区块链上，正如前文所述，它是去中心化数字身份的顶级平台之一。在\
  \ `uPort` 平台上，用户只需创建其数字身份解决方案。可以请求或发送凭证、签署交易、管理其数据和密钥，并执行其他多项任务。该平台为用户提供凭证——一个身份凭证生态系统。您可以轻松通过您的应用程序索取其他用户的凭证，但这取决于他们的批准——即他们是否愿意与您共享。此外，该平台的开发工具采用模块化结构，使用起来并不困难。这类数字身份公司还为您提供访问多种协议和消息传递选项的权限。\n\
  \n### 结论\n随着我们的世界经历一个杰出的数字化转型时代，我们正逐渐看到物理世界和数字世界融合为单一现实。毫无疑问，现在迫切需要更好的方式来维护我们日益增长的数字身份。随着越来越多的项目进入去中心化数字身份领域，脱颖而出的将是那些在各方面都具备安全性和隐私性的项目。去中心化数字身份赋予用户对其身份权利的完全控制，同时使其易于管理。未来，我们很可能会见证去中心化身份数量的增加。\n\
  \n## 第 16 章：未来区块链趋势\n\n![Image](img/Image00055.jpg)\n\n\n\n\n我们许多人都对 2020 年的结束感到兴奋，并寄希望于\
  \ 2021 年情况会好转。从历史角度看，2020 年对我们大多数人来说是艰难的一年，发生了多起意想不到的事件，正如你在 2020 年前的许多预测中所见，尤其是关于区块链技术方面。有趣的是，2020\
  \ 年的 COVID-19（新冠疫情）挑战不仅加剧了已在进行中的大多数区块链趋势，甚至创造了新的趋势。那么，在后疫情时代的未来，我们期待在区块链和加密货币领域看到什么？这将是我们在逐步收尾时的重点。你会同意我的看法，探索分布式账本技术的各个方面是一段美妙的旅程。那么，让我们深入了解吧！\n\
  \n### CBDC 与稳定币的未来\n\n区块链和加密货币领域的未来趋势之一是央行数字货币数量的增加。引发全球经济危机的 COVID-19 大流行无疑改变了我们做事的方式。它显著影响的一个方面是加速了向数字支付采用增加的转变，因为越来越多的人因担心传播病毒而避免使用现金。越来越多的零售商正通过将业务转移到线上来适应这一变化。\n\
  \n世界面临的挑战的含义在于，它为尝试新的数字支付手段创造了合适的条件。事实是，不同国家如何协调独特且具有潜在颠覆性的技术，将在很大程度上决定我们是否能在降低风险的同时，利用区块链等新技术提供的卓越机遇。\n\
  \n当然，央行数字货币（`CBDC`）和稳定币是新发展的一部分。近期，认真探索使用 `CBDC` 的央行数量有所增加，尼日利亚政府透露将于 2021 年底前测试该国的数字货币，从而增加了对其感兴趣的国家数量。\n\
  \n国际清算银行（`BIS`）进行的一项调查发现，超过 85% 的央行正在研究 `CBDC`，但在许多情况下，数字货币的发行尚未落实。例如，新加坡完成了其 Ubin\
  \ 项目，这是一项多年的调查，旨在探究将 `CBDC` 用于批发业务的潜在益处。中国实际上一直处于对 `CBDC` 感兴趣国家的最前沿，因为他们已经对其面向零售的数字人民币进行了一段时间的高级测试。\n\
  \n其他正在积极研究 `CBDC` 的央行包括英格兰银行和欧洲央行。已全面启动使用 `CBDC` 的国家包括巴哈马和东加勒比货币联盟。\n\n另一方面，稳定币并非由货币当局发行；相反，它们由私人实体提供。它们被视为一种运行在区块链上的加密货币。稳定币与加密货币的区别在于，它们受特定稳定机制控制，有助于稳定其相对于各种资产（如其他加密货币、法币或大宗商品）的价格。\n\
  \n简单来说，稳定币的价值与其他资产挂钩，如美元、欧元、大宗商品（如黄金），甚至其他加密货币。与比特币等数字货币不同，稳定币波动性较小，这使它们作为交换媒介和极佳的价值存储手段相对更有用。稳定币的良好示例包括\
  \ Tether（`USDT`）、`USDC`、`BUSD` 等。\n\n那么，为什么是 `CBDC` 和稳定币？\n\n或许，使用这类新货币最显著的吸引力在于，它们有潜力促进更廉价、更快速的跨境交易。它们还能大幅降低消费者成本，促进贸易并推动全球经济一体化。公共和私人数字货币的显著机遇之一是促进金融普惠。数字货币有助于降低低收入人群以及难以触及人群在获取多种金融服务时面临的大多数障碍。\n\
  \n为确保涉及数字货币的所有交易的完整性，可以在这些货币中设计和编程各种功能。我必须指出，尽管这些发展有许多好处，但它们仍面临一些挑战。数字货币需要受到监管，随着越来越多国家对该领域产生兴趣，尤其是疫情期间比特币价值飙升，这一进程正逐步发生。\n\
  \n专家认为，在宏观经济层面，获得主要货币支持的 `CBDC` 以及稳定币实际上可能构成金融和货币稳定风险，尤其是对发展中经济体。由于居民获得了通胀低、经济基本面强的主要经济体的\
  \ `CBDC` 访问权，我们可能会看到资本外逃率增加以及汇率波动。\n\n世界经济论坛一直参与探索利用数字货币的途径，并为与数字货币使用相关的关键政策和治理问题的全球理解和决策做出贡献。该组织联合其他\
  \ 80 家组织正在审视优先事项并提出解决方案。以下是 2020 年成立的联盟确定的主要关注领域：\n\n*   需要国际合作，以帮助克服与跨境数字货币流动相关的问题。\n\
  *   数据隐私的重要性，因为政府需要建立正确的实践来拥有、共享或获取账户数据。这是为了确保用户数据安全同时保护隐私。\n*   需要公私部门合作。\n*  \
  \ 至关重要的是要考虑技术互操作性，以确保 `CBDC` 和稳定币能连接到现有及新系统，无论是跨境还是国内。\n\n### CBDC、稳定币与政府监管的影响\n\
  \n我们可能将见证央行数字货币与稳定币之间的监管博弈，而对于所有美元支持的项目而言，为确保其独立性，它们还有大量工作要做。数字资产在不同领域（尤其是金融领域）的使用持续增加。未来，我们肯定将进入私人拥有的稳定币与\
  \ `CBDC` 真正竞争的阶段。\n\n专家认为，这一时代将标志着数字资产隔离的开始，主要基于其监管吸引力，而不仅仅是功能性。在未来三到五年内，主要的无许可区块链平台（如\
  \ Polkadot、Ethereum、Solana 等）将在金融领域获得动力。这意味着金融科技初创公司、保险公司、银行、资产管理公司和各种中心化组织等机构将在这些区块链基础设施上向其同行/客户/顾客提供服务。\n\
  \n因此，私有平台和许可平台之间将存在显著张力。密码学和分布式基础设施使得任何人都能相当简单地拥抱新的去中心化平台并抛弃传统金融系统，而无需担心现有法规。这一立场得到了加密货币日益普及的有力确认，因为互联网原生金融服务正变得越来越流行。大多数人现在希望在一个无国界的环境中进行各种交易。\n\
  \n\n\n人们正在寻找投资资金的方式，以便在拥有来自全球各地资产（而非其本地金融市场提供的资产）的同时，获得最佳回报。世界各国政府不应因自我审查而置身于这场惊人且具有历史意义的运动之外，这场运动最终将改变全球金融结构，使其更加高效。这场运动是不可避免的，正如我们经历过的其他形式的进步一样，例如从易货制度转向使用硬币、黄金支持的货币和法定货币。\n\
  \n每一个明智的政府都不会犹豫采用 DeFi 以及无许可区块链，此外还有非金融应用。这场斗争是我们无法避免的，正如我们之前见证的每一次重大变革一样。大多数禁止数字资产的政府最终将经历数次阵痛，才会发现这场运动是他们无法对抗的。但对于储备货币既得利益者（如日本、欧盟、美国，当然还有中国）来说，这场斗争可能是有理据的。对于新的稳定币项目而言，提供强有力的差异化以区别于即将涌现的新型\
  \ CBDC（央行数字货币）至关重要。\n\n当涉及真正的去中心化机制时，人为干预极少，因为它们纯粹基于算法。一些关键利益相关者可能会辩称，在应用程序部署到以太坊等区块链网络后，无法停止其运行。好吧，如果政府有意阻碍此类应用的开发和维护，这是可能的。政府仍可追究其运营者、创始人以及非常活跃的社区成员的责任。\n\
  \n事实上，著名监管者、亲加密货币且亲政府的 Brian Brooks 此前曾就此发表过直截了当的言论。COVID-19 的影响进一步增加了对某些法定货币数字版本的需求，这无疑将强化这样一个论点：政府可能希望阻碍稳定币的发展以保护其\
  \ CBDC。这也意味着美国等国家的某些项目（如 Maker DAO）可能面临风险。当然，政府可能不会针对这些项目，但它们很可能会对其团队、创始人以及去中心化社区实施某种形式的控制。\n\
  \n这也意味着，为了在监管打击中生存，稳定币必须尽可能独立于所有人为干预形式。尽管团队领导者的化名身份是次要的，但仍然非常重要，因为这将有助于将关注点集中在技术本身上。我们已经看到了这方面的一些有趣实验，例如\
  \ Gambit、Lien 以及 Basis Cash 团队采用的治理最小化方法。目前，大多数稳定币以不同方式锚定全球货币——美元的价值。\n\n只要它们是基于抵押品或算法的，这并不关键——基于这样一个事实：政府可能会尝试制裁、控制甚至冻结资产。另一方面，对于由美元和一篮子全球法定货币直接或间接支持的资产，这意味着显著的脆弱性水平。请记住，美联储掌管所有以美元计价的银行账户。当美元价值发生剧烈变化时会发生什么（这可能在短时间内发生，或根据历史和宏观经济理论分几个步骤发生）？\n\
  \n当然，此类资产很可能变得不稳定，这解释了为什么从长远来看，原生加密稳定币将是更好的选择。目前，Float、Lien、Reflexer 等多个项目均由 ETH（一种去中心化资产）支持。事实上，Float\
  \ 和 Reflexer 实际上正在放弃对美元的严格锚定，转而致力于确保其代币的稳定性和购买力。\n\n请注意，这些思考纯粹是长期视角，并非我们近期可能预期的情况——尽管事态发展可能比我们想象的更快。\n\
  \n但有一点是确定的；由美元支持的稳定币仍然是区块链和加密货币领域的首选流动性来源，并将在一段时间内保持这一地位。然而，随着私人稳定币与 CBDC 之间紧张局势的加剧，国家行为体最终可能会出现，利用大多数此类项目对法币的依赖。这种情景是不可避免的，因为没有任何政府会坐视私人拥有的数字资产取代其国家货币。*“做好准备并参与大多数新兴的替代实验，而不是只是等待看接下来会发生什么，这将是一个明智之举。”*\
  \ 就影响力和规模而言，这无疑是 DeFi 最大的板块。\n\n### 区块链技术可助力疫苗追踪与分发\n\n在我们见证 COVID-19 大流行之前，政府和大多数组织普遍认为，将区块链等分布式账本技术用于疫苗溯源，该技术尚未成熟到可立即使用的程度。然而，在初期，人们并未意识到从第一剂到最后一剂，疫苗分发问责制的关键性。\n\
  \n#### 推动 DLT 在疫苗分发中增加使用的因素\n\n当涉及商品分发时，我们有多个利益相关者以不同程度参与其中。这进一步导致了溯源和真实性方面的诸多问题，特别是在制药、葡萄酒和钻石等多个行业中。我们之前讨论过区块链在供应链管理中的应用。区块链技术在疫苗分发中的用例与我们之前讨论的制药供应链用例密切相关。政府和医疗机构在测试、生产和分发数十亿剂疫苗上投入了大量资金和精力。\n\
  \n不幸的是，COVID-19 疫苗分发工作极其复杂且受到高度审视。构成重大挑战的因素包括剂量推广的规模和数量。也许数字账本必不可少的最大原因之一，是这些疫苗必须在全球范围内以极快的速度进行分发。为所有相关方创建和访问所有活动的单一记录，最简单有效的方法就是利用区块链技术。这无疑将建立信任，不仅是对疫苗本身，也是对整个流程。\n\
  \n在第一十亿剂疫苗已接种的同时，我们已经记录到当局查获了数千支假冒疫苗瓶。专家预测，假冒疫苗的数量将增加，并最终进入供应链。这一预测促使各地政府官员投入更多资源，用于调查、管理和拦截任何假冒供应。\n\
  \n#### 区块链在疫苗分发中的应用\n\n有几个因素导致专家预测区块链技术可能会加速采用。这些因素包括 COVID-19 疫苗推广的规模和时间压力，以及涌入市场的假冒疫苗案例不断增加。许多利益相关者现在认为，区块链等分布式账本技术可能是政府和医疗组织证明疫苗真实性所需的工具，这将恢复对疫苗供应链的信心和信任。\n\
  \n\n\n\n# 区块链与其他新兴技术的融合\n\n有趣的是，区块链的核心价值与当前商品验证和认证解决方案的需求完美契合——透明性、不可篡改性和安全性。分布式账本技术（DLT）促进快速流转和建立信任的能力，正推动着众多组织对这些技术日益增长的兴趣。当我们考虑到许多\
  \ COVID-19 疫苗在到达使用地点前需要跨越的距离，以及从生产点到药物接种点之间将发生的多次交接，你会发现区块链解决方案不仅能显著提高问责制，还能简化认证流程。\n\
  \n区块链技术将确保疫苗分发以及从疫苗生产点到接种点的监管链的实时可视性。这意味着跨越公私实体的盲区将被消除。此外，它将通过预防性检测和提供供应链中断、不良反应案例、变质、欺诈及任何非计划事件的实时通知，显著降低风险。区块链技术还可协助监控存储条件和召回追溯，这将进一步提高疫苗功效，并增强所有利益相关者之间的信任。\n\
  \n## 第 17 章：区块链与其他新兴技术的融合\n\n> “当区块链与其他新兴技术结合时，其力量才得以充分展现。” —— Carla La Croce\n\n\
  ![Image](img/Image00056.jpg)\n\n各行业的大多数专家一致认为，区块链技术不是孤岛。它需要其他技术才能发挥其全部潜力。事实是，大多数新兴技术都能以多种方式改变我们的生活方式——我们如何工作、工作的含义、商业、全球经济等。这不仅是一段旅程，更是一段需要频繁实验和改进的持续旅程。确实，我们正处于一场技术革命的边缘，得益于新兴技术，这场革命将影响数十亿台联网设备和相连的人们。\n\
  \n尽管有 COVID-19 大流行及其对经济的影响，但有一点是确定的：未来十年的创新将主要由各种不同技术要素的独特组合所驱动。我们有望从融合多种技术中获得的累积价值是乘数级的。新兴技术（如区块链技术、人工智能、云技术和物联网）的组合对企业、政府和各行业的影响，远比单一技术带来的影响更为深远。本节将探讨一些新兴技术及其组合效应对我们生活的影响。你准备好了吗？\n\
  \n### 区块链与物联网的融合\n\n在将改变我们处理数据和在数字世界中运作方式的顶级新技术中，包括物联网、人工智能，当然还有区块链技术。它们各自都是强大的技术，但企业实际上可以通过结合这些技术（如物联网和区块链）来实现令人难以置信的杠杆效应。一些专家称之为“万物区块链”（BIoT）。Aftrex\
  \ Market Research 于 2018 年进行的一项研究数据显示，到 2026 年，物联网与区块链的结合市场将达到 2543.1 亿美元。\n\n电信、医疗、汽车、油气和制造等多个行业和企业将从物联网与区块链技术的结合中获得显著收益。研究结果表明，结合这两种技术具有革命性，许多企业已经开始参与其中。随着区块链领域的成熟，我们将看到更强大的功能集和大量用例研究，这将增强组织参与的信心。毫无疑问，物联网与区块链的结合将提供多重益处，但我将重点关注最显著的几个。\n\
  \n#### 降低运营成本\n\n这是该结合为大多数企业带来的最受欢迎的益处之一——降低运营成本。由于它支持点对点的数据传输，因此无需中央控制，这有助于削减业务成本。去中心化为我们提供了一种以更低成本应对物联网规模的方式，同时消除了单点故障问题。\n\
  \n#### 有助于简化会计流程\n\n组织中最先能立即享受到物联网与区块链结合所提供的透明度优势的部门之一是会计部门。知晓所有利益相关者在带时间戳的线性链上共享和发送的内容，是企业的绝佳解决方案。就会计目的而言，拥有任何人都无法篡改的记录对公司来说是一项显著优势。\n\
  \n#### 加速数据变更\n\n根据 Aftrex Market Research 的研究发现，加速数据变更是结合这两种技术的主要优势之一。我们需要一种更具企业级的方法，可能涉及基于许可的区块链，以应对物联网设备的数量、涉及的数据量以及所有参与方之间的交易速度。这意味着，一种能够最大限度地减少处理交易所需时间（得益于可信节点）的区块链，对于满足物联网的性能需求极为有用。区块链应具备处理物联网数据交换速度的能力。\n\
  \n#### 提高安全性\n\n物联网技术市场将越来越关注安全问题，因为可能会出现更复杂的安全挑战。安全挑战的复杂性源于物联网技术的分布式和多样化特性。目前，我们已拥有超过\
  \ 260 亿台联网设备。这意味着随着这一数字的持续上升，黑客攻击的比率将增加。为了阻止恶意行为者实施破坏活动，物联网将需要一种不同于其现有中心化架构的结构，而中心化架构恰好是物联网网络最大的漏洞之一。\n\
  \n安全性是区块链的固有特性之一，考虑到物联网中设备数量的增加，这将非常有用。结合这些技术可以促进安全通信，同时加强隐私协议。就安全性而言，它不仅涉及设备，还涉及人机交互、设备间交互和人际交互。\n\
  \n![Image](img/Image00057.jpg)\n\n拥有一个受信的分布式账本，能透明地揭示访问权限、交易以及记录，这是区块链与物联网集成的一大优势。大多数已经实施物联网与区块链结合的企业通常依赖设备认证等安全技术，但就物联网和区块链的安全问题而言，这仅仅是个开始。\n\
  \n### 区块链与人工智能\n\n当人工智能出现在科幻书籍或电影中时，我们大多数人都深感着迷，并惊叹于人类想象力的广度。计算机科学的发展速度如此之快，以至于几十年前我们仅作为科幻小说了解的智能计算机不再是虚构。其中大多数现在已成为现实，甚至有更多事物正在被构想。随后，2008\
  \ 年中本聪发布比特币区块链白皮书，区块链技术应运而生。\n\n\n\n\n\n#### AI 与区块链：强强联合\n\n我们现在面临的是几项前沿技术的快速发展，事态演变确实迅猛。我们正处于人工智能、分布式账本技术、物联网以及其他多项技术同时爆发的时代。当区块链正在改变我们对互联网能力的认知，并使我们能够透明且大幅地提升互联网交易速度时，AI\
  \ 也正在为商业的多个方面打开新的大门。\n\nAI 已在优化日常工作，并将人类精力的焦点转向更复杂、更重要的任务。如果您不确定人工智能的含义，它通常用来指代那些在需要人类参与的任务中执行工作的计算机。实现这一目标的技术包括深度学习、机器学习和神经网络。那么，我们如何从\
  \ AI 与区块链的结合中获益？\n\n#### 区块链比人类能更好地解释 AI 的行为\n\n人类能够创建人工神经网络，在机器学习算法的协助下，我们还能根据经验训练计算机算法以拓展其能力范围。然而，引发全球关注的一个问题是，开发者缺乏确定\
  \ AI 行为的能力，甚至无法解释其思维过程。此外，运行复杂决策树的 AI 系统对人类智能而言，就像是“黑箱”。\n\n上述解释的总结是：我们缺乏对人工智能思维方式的深入理解。我们无法理解\
  \ AI 如何思考的主要原因在于，我们无法想象计算机分析海量数据的能力。普通计算机的存储容量包含的信息远超有史以来最聪明的个体。机器的存储器还需要定义每条信息的重要性等级。\n\
  \n诚然，我们具备创建算法来训练计算机完成此项工作的条件，但我们也无法确定这类算法将如何演变。\n\n当 AI 系统的每一个决策都被记录在像区块链这样的分布式账本中时，我们便能获得一个广泛的数据库，它将为我们提供检查\
  \ AI 所有决策及解释其逻辑所需的充足信息。区块链还将确保数据安全，因为无法篡改存储在区块链中的信息。\n\n#### AI 可提升区块链的效率\n\n验证区块链交易的是矿工，他们利用算力组合不同字符以猜中正确答案从而获得奖励，尤其是在工作量证明共识机制下。尽管众多矿工竞争率先解谜获取奖励，但只有一个矿工能获得奖励。那么，其他矿工在过程中消耗的能量怎么办？全都白白浪费了。我们很可能会看到这样一个未来：AI\
  \ 可通过机器学习算法训练，智能地猜测代码，而非在盲目猜测中浪费能源和时间。这最终将提高验证过程的速度并大幅降低成本。\n\n数据规模也是在日常生活中使用区块链面临的挑战之一，这一点同样重要。我们在区块链中记录每一条信息，网络上的每个节点也都拥有数据副本。然而，随着区块数量增加，链会变得越来越庞大，这正是\
  \ AI 大显身手的地方。我们实际上可以利用机器学习算法优化区块链的数据存储技术。\n\n事实是，去中心化 AI 的功能将依赖于一个并行计算系统，该系统由位于全球不同城市的各种独立节点组成。这个分布式网络将确保其所有计算能力得到最优利用，从而快速分析海量数据集。数据集将被划分为可由不同节点分析的较小单元，最终结果将汇总在一个整体数据库中。一家主导公司可以控制这个全球数据库，网络中的每个成员都将有权访问该信息。\n\
  \n我们最终可以用这海量数据训练先进的 AI 算法。这两项技术的结合无疑将彻底改变我们开展业务的方式，并蕴含无限可能。随着区块链技术与 AI 共同成熟，我们很可能会见证更好的用例，以及它们集成的其他实用方式。\n\
  \n## 第 18 章：互操作性、NFT、区块链即服务及其他\n\n过去几年里，我们见证了区块链领域不同项目的建立。除了创建我们在传统环境中习惯使用的某些服务的独特数字化版本外，这些项目清晰地展示了区块链技术的可能性。将表情包、艺术品、域名等事物数字化、不同区块链与链下资源之间的互操作性，以及区块链即服务项目的涌现，这些都是我们正在见证的令人振奋的发展趋势。那么，我们该从这些新区块链平台期待什么？我将尝试梳理它们已取得的成就，以及我们未来可能看到的前景。\n\
  \n### 互操作性为更多可能性与灵活性敞开大门\n\n走到这一步，我相信您已确信分布式账本技术（如区块链）有潜力显著改善业务流程，为价值链提供安全性和透明度。在第七章中，我们已探讨过互操作性及该领域的一些项目。所有这些新成就的影响将降低运营成本。然而，您也会同意，尽管加密货币繁荣，我们尚未见证区块链的大规模采用。\n\
  \n那么，是什么因素阻碍了这项惊人技术的大规模采用？已有多个因素被认定为阻碍这一预期大规模采用的原因，其中之一是规模问题。但互操作性是被最广泛认定为最棘手的挑战——即缺乏互操作性。现在让我们详细探讨互操作性的概念。\n\
  \n### 高度孤岛化的区块链生态系统\n\n区块链被设计为去中心化技术，但这并不意味着各个区块链项目能与其他区块链网络正常通信。目前，我们拥有许多公有链和私有链网络，但它们都具有不同的特性，如哈希算法、共识模型、交易类型等，且都专注于特定领域。由于不同网络和金融机构均使用完全不同的区块链版本、治理规则和监管框架，这一问题愈发严重。\n\
  \n所有这些差异导致了一组互不连接的区块链生态系统，每个网络虽与其他网络并行运行，却与彼此隔绝（孤岛化）。这阻碍了区块链行业发挥其全部潜力。根据 ConsenSys\
  \ 研究报告，*“如果现有区块链网络继续各自为政、互不通信，那么我们将拥有一堆分散的孤岛化区块链，它们由薄弱的节点网络维护，且容易中心化、遭受攻击和操纵。”*\n\
  \n### 理解互操作性\n\n\n\n\n### 区块链互操作性\n\n您在区块链领域很可能会听到的一个术语是**互操作性**。由于其重要性，该词正变得越来越流行，它是释放分布式账本技术全部潜力的关键。互操作性是指两个或多个独立的区块链网络能够相互通信的概念。互操作性使区块链能够彼此无缝通信。\n\
  \n互操作性企业级区块链的目标取决于多项功能和能力，例如：每个区块链网络发起其他网络上交易的能力、与现有系统的集成、执行跨链交易，以及通过集成应用程序并能够轻松将一种底层平台切换为另一种，在给定链上的不同部署之间进行交易。\n\
  \n#### 为什么需要互操作性？\n\n不难理解，区块链互操作性为何至关重要且备受青睐，尤其是考虑到大多数组织越来越依赖协作和交互。在任何软件系统中，互操作性都是高度必要的；缺乏互操作性的软件系统可能无法发挥其全部功能，也无法与其他软件协同工作。实现企业级区块链全部效益的唯一途径就是互操作性。它将促进信息的顺畅共享和智能合约的更轻松执行。此外，互操作性将提供更友好的用户体验、解决方案共享，甚至提供建立合作伙伴关系的机会。\n\
  \n互操作性在多个领域均有需求，其中之一是价值链至关重要的领域，如贸易金融、航空、供应链、医疗保健等。单一区块链无法满足一笔交易的所有需求。这解释了为何需要多个网络，因为每个网络提供不同的价值，同时能与其他网络正常通信，确保私有网络数据可路由至相关网络以执行不同交易。\n\
  \n这将无需进行一对一集成即可执行。以全球供应链为例，实物商品可在参与者之间以更少摩擦流转。区块链领域也需要这一特性——即在区块链网络之间转移数字资产，而无需创建冗余数据或为第三方开辟新市场。\n\
  \n借助区块链技术，脱节的供应链管理系统实际上可以以更低成本、更安全的方式实现互操作。振兴供应链的迫切需求是利益相关者利用区块链技术的驱动因素之一，因为该技术具备这些特性。已有多篇有趣的论文致力于互操作性研究，其中最详尽的是由世界经济论坛（WEF）发布的。他们用“孤岛化的巴尔干化”来形容区块链现状。\n\
  \n#### 区块链互操作性的几种方法\n\n区块链互操作性主要有两种方法——**网络模型**和 **API**。组织可以通过一种称为“混搭”应用的方法，让区块链网络相互连接。区块链网络无需与每个网络的应用程序编程接口（API）交互，只需与一个统一的\
  \ API 接口交互即可。混搭应用可在智能合约和数据模型中定义多种能力。\n\n然而，从根本上说，它将作为连接所有网络的粘合因素。但从长远来看，混搭可能不是组织互操作性的最佳选择，尽管它们不预设治理结构，这反而使其便捷且灵活。\n\
  \n##### 网络的网络模型\n\n许多专家认为，构建互操作性的最佳方法之一是采用**网络的网络模型**。这涉及共同制定行业标准，并探索一种网络的网络架构，允许其他行业网络围绕其汇聚。您可以将区块链网络组织视为一个相互连接的网络“网”。这种结构使公司能够连接并与各种解决方案执行交易，开启跨解决方案的互操作性市场，而不受单一网络的限制。\n\
  \n目前大多数互操作性解决方案主要提供跨无许可区块链的链互操作性。它们使用加密导向工具，如中继链（或侧链）、时间哈希锁和公证人方案。但关注点正日益从无许可区块链间的链互操作性，转向私有网络与公共区块链之间、或不同私有网络之间的互操作性解决方案。\n\
  \n区块链项目实现互操作性的一种策略是使用一个独立的区块链，作为桥接器实现跨链通信。您可以将其视为位于两个区块链网络中间的第三条区块链。该第三方区块链维护两个独立区块链之间消息传递和交易活动的带时间戳且加密保护的账本。使用链下或中间件系统也是促进不同系统间互操作性的另一优秀策略。这是一种非区块链解决方案，利用状态通道、预言机和原子交换等工具。我们之前已讨论过几种流行的互操作性解决方案。\n\
  \n日益增多的互操作性解决方案最终将改变人们对区块链的看法。这种态度转变将有助于说服网络认识到无缝数据交换对区块链领域成功的重要性。互操作性无疑将成为区块链领域的颠覆性变革。关于提供互操作性解决方案的不同区块链项目的更多信息，请翻阅第七章。\n\
  \n### 企业级区块链解决方案数量激增\n\n随着区块链成熟，我们也将见证企业级区块链解决方案数量的显著增加。如果您不确定企业级区块链的含义，它是私有区块链的另一种称呼，指中心化所有者部署分布式账本。随着加密货币影响力持续扩大并获得更高知名度，企业也在探索区块链为其业务运营带来的效益。\n\
  \n全球各地的公司正在证明，借助区块链技术，它们可以降低日常运营成本、提高效率并确保数据安全。预计到 2023 年，企业对数字账本技术的投资将达到 160 亿美元。将这一数字与\
  \ 2019 年约 27 亿美元的支出相比，您会同意区块链领域在未来几年将见证剧烈增长。\n\n正如许多专家预测，将引领企业级区块链解决方案的行业是银行和金融服务业。这显然归因于数字账本在其会计运营中的适用性，以及数字货币的颠覆性影响。除了银行和金融服务，分布式账本技术的应用在其他行业也日益普及，我们已经讨论过其中一些——医疗保健、制药供应链、供应链管理等。\n\
  \n\n\n技术信心的增长呈现稳步上升趋势。事实上，Gartner 调查数据显示，2020 年有 14% 的企业区块链项目进入生产阶段，与 2019 年记录的\
  \ 5% 相比有了显著提升。\n\n### 非同质化代币（NFT）时代\n\n虽然我们大多数人现在将比特币视为法币的完美数字化答案，但 NFT 也正成为收藏品的数字化回应。通过出售\
  \ NFT 致富的人名单持续增长，例如 Jack Dorsey 出售其第一条推文获得高达 290 万美元。或许 Beeple 的艺术品以 6900 万美元售出，是迄今为止售价最高的\
  \ NFT 之一。许多人认为 NFT 只是某种没有现实价值事物的怪异首字母缩写。另一方面，许多投资者缺乏对其含义的良好理解。未来我们可能会看到的趋势之一是 NFT\
  \ 的流行度将进一步提升。那么，NFT 到底意味着什么？\n\n它只是**非同质化代币**的另一个名称，与存储在数字账本中、代表某种有形事物的数据有关。它可以代表一张音乐专辑、一件艺术品以及不同种类的数字文件。这是对\
  \ NFT 含义的直接定义。因此，如果你购买了一个 NFT，你本质上购买的是一个代币的数字记录所有权，你可以将其转移到数字钱包中。区块链是确认任何给定代币作为所有权证明的数字账本。与其他区块链中代币可能代表货币单位（如以太坊区块链上的\
  \ `Ether`）不同，NFT 中的代币代表完全不同的东西。\n\n例如，当有人购买 Beeple 的艺术品时，买家支付的是一枚授予其拥有该特定艺术品权利的代币。但同样重要的是要知道，实际版权仍归原始所有者所有。那么，最初为什么要购买它呢？有人购买艺术品有几个原因。可能是买家只是想在艺术品变得更受欢迎时立即转手。其他人可能只是买入并转售，以从投资中获利。\n\
  \n你现在应该已经了解的一点是，NFT 与加密货币完全不同。两者唯一的主要共同点是它们都存储在数字账本——区块链上。这正是相似之处的终点。就 NFT 而言，每个代币都具有独特的价值，你无法用另一个同等价值的代币来交换它。加密货币的价值就像法币一样是统一的，这意味着牙买加的一张\
  \ 100 美元钞票，其价值与法国或英国的一张相同。你可以在世界任何地方以相同的价格交换一枚比特币。但两个 NFT 代币的价值可能不同。\n\n同质化资产被视为可以轻松互换其单位的物品，货币就是同质化资产的完美例子。你甚至可以用两张\
  \ 50 美元纸币兑换一张 100 美元纸币，其价值保持不变。但非同质化资产的情况并非如此，根据同质化资产的定义，你可以轻松猜出其含义。非同质化资产具有独特特征，这也意味着我们无法用其他任何东西互换它们。NFT\
  \ 的示例包括：\n\n*   游戏内物品\n*   域名\n*   限量版时尚系列拥有的特殊运动鞋\n*   数字形式的独特艺术品\n*   授予所有者参加活动权限的优惠券\n\
  *   数字收藏品\n*   文章\n*   体育精彩集锦\n*   表情包\n*   发布的专栏\n*   病毒式传播的照片\n\n#### 为什么 NFT\
  \ 如此流行？\n\n它们不仅仅是即将很快消退的新潮流。有趣的是，它们已经存在了大约半个十年，尽管其流行是近期的发展。为什么 NFT 最近的流行度增加了？导致\
  \ NFT 流行度增加的因素之一是疫情。此外，比特币和其他加密货币价值的上升在 NFT 的流行中发挥了重要作用。\n\n自 2020 年以来，`ETH` 的价格飙升，任何人都可以用\
  \ `ETH` 购买 NFT 的一部分，在某些情况下甚至可以购买完整的一个。但随着 `ether` 价值的持续增加，所有者的购买力也随之增加。NFT 的独特性是它们将在未来几年继续存在的主要原因。事实上，任何购买\
  \ NFT 的人都将拥有一件没有其他人能够拥有的物品，除非所有者刻意复制它。\n\n任何人都可以购买棒球卡、绘画以及其他他人可以轻易复制的类似作品。但 NFT\
  \ 的不同之处在于，它们为买家提供了对艺术品或任何其他物品的真正唯一所有权，这对许多人极具吸引力。事实是，随着区块链技术也成为一种首选的所有权证明手段，NFT\
  \ 的流行度将继续增加。\n\n寻求接触不同资产组合的投资者应关注该资产类别中的更多机会，无论是通过单个 NFT 还是管理基金。但同样重要的是，要考虑选择 NFT\
  \ 涉及的风险，以避免选错。如果你有兴趣购买 NFT，那么你应该做好功课，也可以等待并观察 NFT 领域成熟后再参与。\n\n以下是 NFT 是什么以及如何工作的总结：\n\
  \n*   每个铸造的 NFT 代币都拥有唯一标识符。\n*   每个代币都归某人所有，且很容易验证此信息。\n*   与加密货币和法币不同，NFT 代币无法直接与其他代币互换。\n\
  *   如果你拥有一个 NFT，你可以轻松证明所有权。\n*   其他人无法操纵它。你可以选择永远持有你的 NFT 代币，因为区块链技术保证了你的资产安全。\n\
  *   如果你决定出售，作为原始创作者，你将享受转售版税。\n*   当你决定创建一个 NFT 时，也很容易证明是你创建的。\n*   每当你出售你的 NFT，你都能获得版税。\n\
  *   作为 NFT 的创作者，你也可以决定其稀缺性。\n*   可以在点对点或 NFT 市场上出售你的 NFT。你完全不受限于单一平台，也不需要中介。\n\n\
  流行的 NFT 平台包括 `OpenSea`、`Superfarm`、`Rarible`、`Ethernity` 等。\n\n### 区块链即服务（BaaS）\n\
  \n我们一直在讨论不同的区块链趋势和区块链行业的未来。正如《福布斯》2020 年第二届“区块链 50 强”榜单所强调的，区块链即服务软件和平台是极具前景的区块链趋势之一。大量提供区块链即服务的项目已进入该领域，这实际上包括\
  \ `IBM`、`Amazon` 和 `Microsoft` 等大牌。这些第三方服务的出现是一个相对较新的发展，特别是在同样处于早期阶段的区块链领域。\n\n\
  这些第三方服务的创建无疑是由于对托管去中心化软件服务的需求不断增加，以促进行业增长。`Fortune Business Insights` 的可用数据显示，BaaS\
  \ 行业有望在 2027 年达到约 250 亿美元的估值。这清楚地表明了增长，因为 2019 年这一数字为 19 亿美元——在 2020 年至 2027 年的预测期内，复合年增长率（CAGR）为\
  \ 39.5%。\n\n事实上，记录显示零售和电子商务细分市场很可能采用 BaaS 解决方案，且最高增长率很可能发生在同一预测期内。\n\n#### 理解 BaaS\n\
  \n\n\n\n#### BaaS（区块链即服务）概述\n\nBaaS 的一个直观定义是：它是一种基于云的服务，允许用户在利用区块链技术的同时创建其数字产品。你也可以将\
  \ BaaS 视为软件即服务的分布式账本版本，全球各地的企业订阅此服务并获得对基于云的软件的访问权限。数字产品的示例包括去中心化应用，以及其他无需完整区块链平台的设置要求即可运行的服务。\n\
  \n##### BaaS 工作原理详解\n\n这涉及一个流程，即第三方公司为其他用户安装、托管甚至维护区块链网络。这一方（也被视为外部服务提供商）决定建立所有必需的区块链技术以及基础设施，并以此收取费用。外部服务提供商将处理维护和基础设施问题。\n\
  \n事实是，区块链即服务提供商的角色就像网络托管提供商一样。它们提供一个平台，让客户可以利用其基于云的解决方案。此外，BaaS 协助各类组织在云服务提供商管理和运维的区块链平台上开发和托管区块链应用以及智能合约。它们提供支持服务，如合适的资源分配、带宽管理、数据安全功能和托管要求。\n\
  \n这项服务的优势在于，企业无需烦恼管理和运营区块链的日常复杂性。相反，它们现在可以主要专注于核心业务活动，而由 BaaS 提供商处理底层技术的顺畅运行。\n\n\
  ##### 区块链即服务的重要性\n\n企业利用区块链技术的兴趣与日俱增，然而，大多数企业面临着创建、配置甚至运营区块链所涉及的运营开销和技术复杂性。此外，区块链基础设施的维护通常是一大障碍。就搭建和维护基础设施而言，区块链需要巨额投资，与其他传统数据库相比，它通常更加消耗资源。\n\
  \n我还要补充一点：区块链需要巨大的带宽和大量的能源。因此，BaaS 为全球企业提供了巨大价值，并最近因多种原因获得了显著的关注。对于大多数组织而言，将云服务与\
  \ BaaS 结合可能会非常有价值。企业可以通过定制集成，凭借 BaaS 的个性化灵活性，解决其大部分痛点。BaaS 解决方案可以帮助它们以一种直接的方式解决围绕成本、效率和透明度的复杂挑战。\n\
  \n这将显著降低企业级区块链应用的准入门槛。公司可以轻松利用区块链技术的所有优势——问责制、信任最小化、透明度提升和数据安全。它们将享受这些益处，而无需开发自己的区块链生态系统。事实上，它们甚至不必投资所需的计算资源。那么，BaaS\
  \ 领域的主要参与者是谁呢？\n\nBaaS 的流行吸引了一些最大科技公司的注意，因为其中大多数现在都已设立专门部门，专注于 BaaS 的集成和推广。进入区块链即服务领域的其他公司还包括一些最成功的云服务提供商。在\
  \ BaaS 领域运营的公司名单中位居前列的包括：\n\n*   Microsoft\n*   Corda\n*   Accenture\n*   Stratis\n\
  *   Amazon\n*   Baidu\n*   IBM\n*   Alibaba\n*   SAP\n*   Huawei\n*   Oracle\n*\
  \   Infosys\n\n除了这些大玩家，我们还有一些较小的创新型区块链即服务公司，其中许多目前总部设在美国。这些创新的 BaaS 公司将分布式账本集成到其日常技术中，其中一些包括\
  \ Factom、Blockstream、Dragonchain、PayStand 以及其他若干公司。\n\n### 区块链专家需求激增\n\n分布式账本技术仍是一项新技术，该领域需要更多的启蒙和教育。区块链已扩展至不同行业，每天都在涌现更多用例。这也意味着将需要更多的人了解这项技术。\n\
  \n当然，区块链专家的数量正在增加，但区块链实施的增长迅速，这将导致对区块链专家的需求急剧上升。许多大学和学院正在加大力度以满足这一需求。此外，全球各地的组织也不甘落后，它们正通过专门针对区块链平台开发和管理的培训计划，努力开发现有人才。\n\
  \n然而，具备正确技能的毕业生产出速度不足以满足需求。像 IBM 这样的公司已表达了对区块链人才数量不足的担忧，甚至将这种情况称为现有公司采用区块链技术的“重大阻碍”。Coin\
  \ Rivert 于 2018 年透露，区块链专家的需求同比增长了 2,000%，该数据源自 Upwork.com。\n\n### 在日益去中心化的世界中的政府监管\n\
  \n审视区块链技术的架构，无疑能解释其对传统机构以及传统监管和治理方法固有的挑战原因。从我们迄今为止的讨论中可以看到，企业级区块链显著增加。这迄今为止使得传统治理和监管机制成为可能。\n\
  \n然而，随着无许可或公共分布式账本技术的使用增加，我们可能会面临更多挑战。监管区块链是不可能的，试图监管它们就像试图监管人们系统上（无论在线还是离线）的所有账本。然而，区块链技术的底层用例肯定会受到监管。世界各国政府将与来自不同司法管辖区的各种监管机构及其他相关方合作来实施这一点。\n\
  \n尽管目前尚无针对区块链技术的精确治理机制组合，但当有可用方案时，它极有可能涉及“监管杠杆”的组合，通过拉动这些杠杆来确定适当的平衡。\n\n区块链监管面临一些关键两难困境。例如，我们都知道监管对于保护用户同时确保安全至关重要。然而，过度监管最终可能会扼杀创新，尤其是在金融领域。这也解释了为什么目前关于区块链监管的对话应当持续进行，以确保其治理的各个方面得到妥善解决，尤其是涉及隐私和安全时。渴望采用去中心化商业模式的国家可能会对其现有法律框架进行若干修改。\n\
  \n### 结论\n\n\n\n\n\n如果您读到了这一页，我相信您会真诚地同意我的观点：这是一段精彩的旅程。我们探讨了区块链技术的起源、它多年来如何演变为一项极其有用的技术，以及它对各个领域的影响——商业、新兴技术、政府、供应链、金融、汇款等。我必须指出，分布式账本技术周围存在大量炒作，但我设法以较少炒作的方式呈现了该技术的细节，使本文更多基于事实而非炒作。\n\
  \n无论您是企业主、企业家、员工、学生、失业者、政府官员等，您能利用我分享的信息做的最好的事情，就是找出区块链技术如何或已经在直接或间接地影响您的生活。一旦您找到了这一点，请继续探索定位自己的方法，以确保您能从我们即将见证的这场不可避免的变革中获得最大收益。\n\
  \n因此，作为学生，您可以考取区块链认证，以增加获得好工作的机会，因为对区块链专家的需求持续增加。作为员工，了解区块链并获得认证不仅可以增加保住工作的机会，还能让您有机会在组织中晋升。那企业家和企业主呢？利用该技术的最佳方式是探索您的业务或公司如何从区块链技术中受益。\n\
  \n我实际上提供了一个简单的指南，帮助您做出能将业务推向新高度的决策。您应该考虑最适合您业务的区块链平台，或者它如何增加您的利润、降低您的成本、缩短产品交付时间、消除对中介的需求等。\n\
  \n有些人实际上通过加密货币、NFT 和 DeFi 赚了很多钱，如果您目前处于失业状态，可以探索创建 NFT 赚钱的方法。从 DeFi 赚钱有极好的途径，您只需多阅读以找到最佳选项。事实是，该领域的机会巨大，成功所需的是采取行动的决心，而不受传统机构和政府机构观点的影响。我必须补充的是，加密货币领域容易面临多种风险，因为它极其波动。因此，我最好的建议是决策时要谨慎，并在采取任何行动前寻求财务顾问的帮助。衷心希望您有所收获，并期待您的成功！\n\
