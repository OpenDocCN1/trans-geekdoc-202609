- raw: '*   **Speed and scalability:** When compared to centralized and decentralized
    networks, the distributed network is more scalable. This type of network offers
    low latency as a result of the network processing power and data that is evenly
    distributed.


    *   **Extreme fault-tolerant** : When a node fails in a distributed network, it
    cannot affect the entire system. When this happens, the entire network will instantly
    rebalance the computational workload among other active nodes. This makes distributed
    network remarkably more robust than many other network structures that usually
    depend on top-down node structure.


    *   **Increased transparency:** Since data is evenly distributed across the whole
    network in a distributed network, it is extremely more difficult to censor, alter
    or erase any information on the network successfully. This also implies that a
    distributed network is more transparent than other systems, especially when they
    secure their data cryptographically.


    Demerits


    While it provides several benefits, it also has some drawbacks just like most
    things in life:


    *   **Maintenance cost is high:** Just like decentralized networks, companies
    that desire to use the distributed network system will need more resources to
    reconfigure or maintain it. The reason for this is that any reasonable change
    requires that you update all the existing nodes. Considering the fact that there
    will be different latencies for distributed nodes that do not work with the same
    clock, it is not possible for network administrators to temporarily order commands
    or logs. This makes it extremely hard to design and debug algorithms for this
    type of network.


    *   **Coordination challenges:** There is no node hierarchy in this type of network
    and this also means that no single node is responsible for monitoring the activities
    of subordinate nodes. What this implies is that individual nodes on the system
    may not be properly regulated. It also implies that achieving large-scale tasks
    or making timely decisions may not often be an easy thing to do in distributed
    networks. It is even more difficult for nodes in the system to make well-informed
    decisions while considering the state of the other nodes in the network because
    it is often hard for any single node to acquire a global view of the whole network.


    ## Chapter 5: The Core Features of Blockchain & Their Importance


    ![Image](Image00019.jpg)


    One of the major reasons for the significant increase in the popularity of blockchain
    technology has to do with its numerous features. While the technology has been
    in existence for over a decade now, it is still actively in the spotlight. Of
    course, like every new technology and phenomenon, there are mixed feelings toward
    blockchain, but no one has come out to successfully underestimate the role it
    is playing and will play in the global economic space.


    While bitcoin attracts so much controversy and is being opposed by governments
    and economists around the world, it has successfully drawn the attention of the
    world to its underlying technology – blockchain. It is therefore no more a backup
    for digital currencies but can do so much more than that. This section will look
    at the various features of blockchain and why it has become highly irresistible.
    You can get an idea of what we are about to discuss by looking at this infographic
    below.


    ![Image](Image00020.jpg)


    Immutability


    Among the exciting and remarkable features of blockchain technology is its immutability.
    It is among the core features of the technology. One question you may have right
    now is; why is it difficult to corrupt this technology? To get a good answer to
    the question, let''s first understand what the term immutability means. When something
    is immutable, it implies that you cannot alter or change it. So, it is impossible
    to alter or modify blockchain – the records are permanent and unalterable. How
    is this possible?


    Unlike the traditional banking system, blockchain does not depend on centralized
    authorities but on several nodes as earlier mentioned. Since there is a copy of
    the digital ledger for all the nodes on the system, the nodes must verify the
    validity of each new transaction before adding it. Once they all agree that a
    transaction is valid, then they will add it to the ledger. The moment the nodes
    add a new transaction block to the digital ledger, it is now impossible for anyone
    to alter it. No user on the network – not even Satoshi Nakamoto, Vitalik Buterin,
    or the President of the United States can erase, edit or update the information.


    In what ways does this help to deal with the issue of Corruption?


    We have always heard of the significant amount of funds that are stolen each year
    by hackers via most of the traditional channels. In a bid to protect businesses
    from cyberattacks and other malicious actors, companies around the world spend
    trillions of dollars every year. But one of the areas we often fail to consider
    is that of internal cybersecurity risks that are caused by corrupt authorities
    and individuals. Most hacks often succeed because of an internal link that fully
    understands most of the security measures of the organization.


    Available data from *idwatchdog* reveals that the primary cause of 60 percent
    of data breaches are insider threats. Since 2018, there has been an increase of
    47 percent in insider security incidents leading to a dramatic increase of 31
    percent in the cost of insider threats. Just to be sure you understand what insider
    threats mean; *“an insider is anyone who has legitimate access to an organization''s
    assets and can intentionally or unintentionally harm the business.”* This could
    be contractors, employees, partners or former employees of the company.


    This implies that companies will eventually pay the price for trusting some employees.
    Also, we hardly trust our financial institutions such as banks and this highlights
    the importance of a trustless environment. Of course, blockchain technology offers
    the world the trustless environment that is needed to solve the issue of trust.
    It provides a corruption-free environment that businesses can leverage to ensure
    the perfect functioning of their internal networking system. By integrating blockchain
    technology, it would be difficult for malicious actors to hack into a company''s
    database, change or steal useful information.


    One of the perfect examples of blockchains that offer this corrupt-free environment
    are public blockchains which we discussed in chapter two. On a public blockchain,
    all those involved can see the transactions and this makes it extremely transparent.
    Private, hybrid and federated blockchains are suitable for organizations that
    are interested in fostering transparency among their employees while protecting
    their sensitive information from the public.


    Distributed Ledgers


    Transactions involving the participants of any public ledger are usually available
    courtesy of a distributed ledger. The information has virtually no place to hide.
    But when it comes to other types of blockchain, there are some differences. Despite
    the differences, those with the right access can see all the things happening
    in the ledger. The reason for this is that the users on the system maintain the
    network and the distributed computational power across all the nodes guarantees
    remarkable results.


    This also explains why distributed ledger is seen as one of blockchain technology''s
    major features. It ensures increased efficiency that can provide more benefits
    than the traditional centralized ones. Here are more reasons why distributed ledger
    is among blockchain''s main features?


    *   **Ownership of verification:** In a distributed network, all nodes serve as
    verifiers which means that they all would have to verify any transaction before
    adding it to the digital ledger. This system ensures fair participation for everyone.'
