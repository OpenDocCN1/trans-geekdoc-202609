    技术信心的增长呈现稳步上升趋势。事实上，Gartner 调查数据显示，2020 年有 14% 的企业区块链项目进入生产阶段，与 2019 年记录的 5% 相比有了显著提升。


    ## 非同质化代币（NFT）时代


    虽然我们大多数人现在将比特币视为法币的完美数字化答案，但 NFT 也正成为收藏品的数字化回应。通过出售 NFT 致富的人名单持续增长，例如 Jack Dorsey
    出售其第一条推文获得高达 290 万美元。或许 Beeple 的艺术品以 6900 万美元售出，是迄今为止售价最高的 NFT 之一。许多人认为 NFT 只是某种没有现实价值事物的怪异首字母缩写。另一方面，许多投资者缺乏对其含义的良好理解。未来我们可能会看到的趋势之一是
    NFT 的流行度将进一步提升。那么，NFT 到底意味着什么？


    它只是**非同质化代币**的另一个名称，与存储在数字账本中、代表某种有形事物的数据有关。它可以代表一张音乐专辑、一件艺术品以及不同种类的数字文件。这是对 NFT
    含义的直接定义。因此，如果你购买了一个 NFT，你本质上购买的是一个代币的数字记录所有权，你可以将其转移到数字钱包中。区块链是确认任何给定代币作为所有权证明的数字账本。与其他区块链中代币可能代表货币单位（如以太坊区块链上的
    `Ether`）不同，NFT 中的代币代表完全不同的东西。


