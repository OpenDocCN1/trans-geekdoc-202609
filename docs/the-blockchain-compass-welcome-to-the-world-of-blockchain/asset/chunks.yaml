    know has to do with capacity.


    The platform has on several occasions run at full capacity and this is one of
    the issues that bother developers who want to be certain that the processing of
    their contracts will not be delayed. Some of the features that developers stand
    to enjoy when they use the Ethereum network include:


    *   Provides straightforward guidelines for developers


    *   Set up of smart contracts is free, however, there will be fees for transaction
    charges which are in the form of gas.


    *   A supportive development community


    *   Ethereum token standard (ERC-20)


    *   Available literature/help for users


    *   Many smart contract developers have experience using the Ethereum blockchain.


