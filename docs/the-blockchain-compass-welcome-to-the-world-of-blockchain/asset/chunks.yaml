  trans: '

    我们许多人都对 2020 年的结束感到兴奋，并寄希望于 2021 年情况会好转。从历史角度看，2020 年对我们大多数人来说是艰难的一年，发生了多起意想不到的事件，正如你在
    2020 年前的许多预测中所见，尤其是关于区块链技术方面。有趣的是，2020 年的 COVID-19（新冠疫情）挑战不仅加剧了已在进行中的大多数区块链趋势，甚至创造了新的趋势。那么，在后疫情时代的未来，我们期待在区块链和加密货币领域看到什么？这将是我们在逐步收尾时的重点。你会同意我的看法，探索分布式账本技术的各个方面是一段美妙的旅程。那么，让我们深入了解吧！


    ## CBDC 与稳定币的未来


    区块链和加密货币领域的未来趋势之一是央行数字货币数量的增加。引发全球经济危机的 COVID-19 大流行无疑改变了我们做事的方式。它显著影响的一个方面是加速了向数字支付采用增加的转变，因为越来越多的人因担心传播病毒而避免使用现金。越来越多的零售商正通过将业务转移到线上来适应这一变化。


    世界面临的挑战的含义在于，它为尝试新的数字支付手段创造了合适的条件。事实是，不同国家如何协调独特且具有潜在颠覆性的技术，将在很大程度上决定我们是否能在降低风险的同时，利用区块链等新技术提供的卓越机遇。


    当然，央行数字货币（`CBDC`）和稳定币是新发展的一部分。近期，认真探索使用 `CBDC` 的央行数量有所增加，尼日利亚政府透露将于 2021 年底前测试该国的数字货币，从而增加了对其感兴趣的国家数量。


    国际清算银行（`BIS`）进行的一项调查发现，超过 85% 的央行正在研究 `CBDC`，但在许多情况下，数字货币的发行尚未落实。例如，新加坡完成了其 Ubin
    项目，这是一项多年的调查，旨在探究将 `CBDC` 用于批发业务的潜在益处。中国实际上一直处于对 `CBDC` 感兴趣国家的最前沿，因为他们已经对其面向零售的数字人民币进行了一段时间的高级测试。


    其他正在积极研究 `CBDC` 的央行包括英格兰银行和欧洲央行。已全面启动使用 `CBDC` 的国家包括巴哈马和东加勒比货币联盟。


    另一方面，稳定币并非由货币当局发行；相反，它们由私人实体提供。它们被视为一种运行在区块链上的加密货币。稳定币与加密货币的区别在于，它们受特定稳定机制控制，有助于稳定其相对于各种资产（如其他加密货币、法币或大宗商品）的价格。


    简单来说，稳定币的价值与其他资产挂钩，如美元、欧元、大宗商品（如黄金），甚至其他加密货币。与比特币等数字货币不同，稳定币波动性较小，这使它们作为交换媒介和极佳的价值存储手段相对更有用。稳定币的良好示例包括
    Tether（`USDT`）、`USDC`、`BUSD` 等。


    那么，为什么是 `CBDC` 和稳定币？


    或许，使用这类新货币最显著的吸引力在于，它们有潜力促进更廉价、更快速的跨境交易。它们还能大幅降低消费者成本，促进贸易并推动全球经济一体化。公共和私人数字货币的显著机遇之一是促进金融普惠。数字货币有助于降低低收入人群以及难以触及人群在获取多种金融服务时面临的大多数障碍。


    为确保涉及数字货币的所有交易的完整性，可以在这些货币中设计和编程各种功能。我必须指出，尽管这些发展有许多好处，但它们仍面临一些挑战。数字货币需要受到监管，随着越来越多国家对该领域产生兴趣，尤其是疫情期间比特币价值飙升，这一进程正逐步发生。


    专家认为，在宏观经济层面，获得主要货币支持的 `CBDC` 以及稳定币实际上可能构成金融和货币稳定风险，尤其是对发展中经济体。由于居民获得了通胀低、经济基本面强的主要经济体的
    `CBDC` 访问权，我们可能会看到资本外逃率增加以及汇率波动。


    世界经济论坛一直参与探索利用数字货币的途径，并为与数字货币使用相关的关键政策和治理问题的全球理解和决策做出贡献。该组织联合其他 80 家组织正在审视优先事项并提出解决方案。以下是
    2020 年成立的联盟确定的主要关注领域：


    *   需要国际合作，以帮助克服与跨境数字货币流动相关的问题。

    *   数据隐私的重要性，因为政府需要建立正确的实践来拥有、共享或获取账户数据。这是为了确保用户数据安全同时保护隐私。

    *   需要公私部门合作。

    *   至关重要的是要考虑技术互操作性，以确保 `CBDC` 和稳定币能连接到现有及新系统，无论是跨境还是国内。


    ## CBDC、稳定币与政府监管的影响


    我们可能将见证央行数字货币与稳定币之间的监管博弈，而对于所有美元支持的项目而言，为确保其独立性，它们还有大量工作要做。数字资产在不同领域（尤其是金融领域）的使用持续增加。未来，我们肯定将进入私人拥有的稳定币与
    `CBDC` 真正竞争的阶段。


    专家认为，这一时代将标志着数字资产隔离的开始，主要基于其监管吸引力，而不仅仅是功能性。在未来三到五年内，主要的无许可区块链平台（如 Polkadot、Ethereum、Solana
    等）将在金融领域获得动力。这意味着金融科技初创公司、保险公司、银行、资产管理公司和各种中心化组织等机构将在这些区块链基础设施上向其同行/客户/顾客提供服务。


    因此，私有平台和许可平台之间将存在显著张力。密码学和分布式基础设施使得任何人都能相当简单地拥抱新的去中心化平台并抛弃传统金融系统，而无需担心现有法规。这一立场得到了加密货币日益普及的有力确认，因为互联网原生金融服务正变得越来越流行。大多数人现在希望在一个无国界的环境中进行各种交易。

    '
