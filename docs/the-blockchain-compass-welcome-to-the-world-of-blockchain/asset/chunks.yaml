- raw: 'One of the terms you will are likely going to hear in the blockchain space
    is interoperability. The word is becoming popular due to its importance and it
    holds the key to maximizing the full potential of distributed ledger technology.
    Interoperability has to do with the idea that two or more separate blockchain
    networks can communicate with one another. Interoperability enables blockchains
    to seamlessly communicate with themselves.


    The goal of interoperable enterprise blockchains depends on several functionalities
    as well as abilities such as the ability of each blockchain network to initiate
    transactions on other networks, integration with the existing systems, carry out
    transactions with other chains, and also transact between deployments on a given
    chain by integrating apps and being able to easily switch one underlying platform
    for any other one.


    #### Why Interoperability?


    It is not hard to understand the reason why interoperability for blockchain is
    very critical and desirable especially when we consider the fact that most organizations
    depend more on collaboration and interaction. In any software system, interoperability
    is highly needed and any software system that lacks it may not function at its
    full capacity or with other software. The only way to realize the full benefits
    of enterprise blockchain is through interoperability. It will facilitate the smooth
    sharing of information and easier execution of smart contracts. Also, interoperability
    will provide a more user-friendly experience, sharing of solutions and even offer
    the opportunity to establish partnerships.


    Interoperability is needed in several areas. One of them is in areas where the
    value chain is vital such as trade finance, aviation, supply chain, healthcare
    and several others. A single blockchain will not be capable of providing all the
    needs of a transaction. This explains why multiple networks are needed as each
    one of them will be providing a different value while communicating properly with
    other networks to ensure that it would be possible for private network data to
    be routed to relevant networks for different transactions.


    This will be executed without the need to carry out a one-to-one integration.
    Consider the global supply chain, physical goods can easily move from one participant
    to another with less friction. This same feature is needed in the blockchain space
    - where we move digital assets from one blockchain network to another without
    having to create redundant data or a new market for third parties.


    With blockchain technology, disconnected supply chain management systems can actually
    interoperate at a lower cost and in a secure way. The urgent need for revitalizing
    supply chain is one of the factors motivating stakeholders to take advantage of
    blockchain technology since it possesses these features. There ha  ve been several
    interesting papers that have been working on interoperability and the most elaborate
    one is by the World Economic Forum (WEF). In their exact words, they described
    blockchain as “balkanized in silos.”


    Some Approaches to Blockchain Interoperability


    There are two approaches to blockchain interoperability – network models and APIs.
    It is possible for blockchain networks to connect with each other for organizations
    through an approach known as “mashup” application. The blockchain networks are
    not required to interact with an application programming interface (API) for every
    network, but with just one consistent API interface. A mashup application may
    have several capabilities defined in smart contracts and data models.


    However, it will fundamentally serve as a binding factor between all the networks.
    But in the long run, mashups may not be the best choice for organizing interoperability
    though they do not presuppose a governance structure which actually makes them
    expedient and flexible.


    Network of Networks Model


    Many experts believe that one of the best approaches to building interoperability
    is the use of the network of networks model. It involved the joint efforts of
    creating industry standards and discovering a network of networks architecture
    that permits other industry networks to converge around. You can see organizations
    of blockchains network as a “web” of networks that are interconnected. This structure
    enables a company to connect and execute transactions with various solutions and
    open up a market of interoperability across solutions without suffering the limitations
    of one network.


    Most of the interoperability solutions that exist now are providing chain interoperability
    mainly across permissionless blockchains. They use crypto-directed tools such
    as relay chains (or sidechains), time hash-locks and notary schemes. But there
    is an increasing shift in focus from chain operability across permissionless blockchains
    to solutions for interoperability between private networks and public blockchains
    and/or between different private networks.


    One of the strategies that blockchain projects can use in achieving interoperability
    is by using a separate blockchain which will serve as a form of bridge that will
    enable cross-communication. You can see this as a third blockchain that is positioned
    in the middle of two blockchain networks. The third blockchain maintains a timestamped
    and cryptographically secured ledger of messaging and transactional activity between
    two separate blockchains. The use of off-chain or middleware systems is also another
    excellent strategy for facilitating interoperability between different systems.
    This approach is a non-blockchain solution that utilizes tools such as state channels,
    oracles and atomic swaps. We have earlier discussed several popular interoperability
    solutions.


    The increasing number of interoperability solutions will eventually transform
    the current attitudes that people have toward blockchain. This change in attitude
    will help persuade networks about the importance of a seamless exchange of data
    in ensuring the success of the blockchain space. Interoperability will undoubtedly
    be a game-changer for the blockchain space. For more on the different blockchain
    projects providing interoperability solutions, flip to chapter seven.


    ### Increased Number of Enterprise Blockchain Solutions


    We are also going to see a remarkable increase in the number of enterprise blockchain
    solutions even as blockchain matures. In case you are unsure of what enterprise
    blockchain means, it is another name for private blockchains and has to do with
    the deployments of the distributed ledger by centralized owners. As cryptocurrencies
    continue to expand their influence and gain increased popularity, businesses are
    also exploring the benefits of blockchain for their business operations.


    Companies around the world are proving that with blockchain technology, they can
    drive down the cost of their daily operations, increase efficiency and ensure
    data security. The forecast for investment in digital ledger technology by companies
    is estimated to hit $16 billion by 2023. When we compare this figure to the spending
    in 2019 which was about $2.7 billion, then you will agree with me that the blockchain
    space will witness dramatic growth in the next few years.


    As predicted by many experts the industry that will lead the way in enterprise
    blockchain solutions is the banking and financial services sector. This is obviously
    due to the suitability of a digital ledger in their accounting operations in addition
    to the disruptive influence of digital currencies. Apart from the banking and
    financial services, the application of distributed ledger technology is increasingly
    gaining grounds in other industries and we have already discussed some of them
    – healthcare, pharmaceutical supply chain, supply chain management, etc.'
