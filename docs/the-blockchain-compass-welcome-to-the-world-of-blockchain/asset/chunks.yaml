- raw: 'Hyperledger Fabric is undoubtedly one of Ethereum''s competitors and the platform
    has witnessed increased popularity in recent times. The smart contracts platform
    was established by the Linux Foundation back in 2015 as an open-source project.
    The goal of the platform is to be an open-source project that would support the
    development of blockchain-based distributed ledgers. Some of the frameworks currently
    being developed under the platform include Hyperledger Sawtooth, Hyperledger Burrow,
    Hyperledger Indy and Hyperledger fabric.


    For developers who are exploring the smart contract platform to use, there are
    several reasons why Hyperledger could be an excellent option. The platform has
    over time shown to be a reliable alternative to Ethereum. Hyperledger Fabric is
    a permissioned blockchain infrastructure that aids the execution of smart contracts.
    Since it is a permissioned network, all participants have known identities and
    this makes it an ideal solution for organizations that desire to create smart
    contracts while being compliant with data protection laws that require them to
    be known.


    One of the features that make Hyperledger unique and more flexible is that developers
    can create smart contracts in JavaScript as well as other common programming languages
    by just installing the right modules. So, on this platform, there is no need for
    developers to depend on just one language like Solidity before they can code their
    smart contracts.


    Challenges of Hyperledger Fabric


    Unlike Ethereum, the platform lacks its token system and while this feature offers
    several benefits, it also has its drawback. For instance, it limits the type of
    smart contracts that you can develop on the platform. For companies or organizations
    that desire to develop smart contracts that require payment transfer such as an
    ICO, Ethereum will be a better option. Other major features you will find in Hyperledger
    include:


    *   Permissioned membership


    *   Reliance performance


    *   Supports plug-in components


    *   Open source and free to use


    *   Developers can code smart contracts in several languages


    *   It is supported by IBM


    As I mentioned before, one major drawback of the platform is the fact that it
    lacks a token system.


    Nem


    One of the reasons why some developers prefer Nem is that it is written in Java
    which is a well-known programming language. So, there is no need to learn a new
    programming language specifically meant for a blockchain platform such as Solidity.
    Another good reason why some developers prefer this platform is that Java is actually
    more developed so there are fewer security vulnerabilities compared to newer programming
    languages.


    Most security experts have disclosed that the release of the Mijin V.2 update
    by Nem has made the blockchain network the most secure smart contract platform
    you can find in the blockchain space. Apart from improving the NEM blockchain,
    the update is seen as an industry milestone that has ushered us into an era of
    new possibilities for distributed ledger database functionality. Perhaps Nem''s
    greatest selling point is that it is highly scalable. For instance, while Ethereum
    handles about 15 transactions per second (TPS), Nem can handle hundreds of transactions
    per second. This is why more developers are getting increasingly attracted to
    Nem. Take a look at a summary of the key features of Nem:


    *   Excellent performance


    *   Java language makes it easy to use


    *   Scalable


    *   Absence of a platform-specific language


    Despite its benefits, it also has a few drawbacks and one of them is that it does
    not have many tools. Since it uses codes that are not blockchain-based, the platform
    is less decentralized. Finally, when compared to other platforms, Nem also has
    a smaller development community.


    ### Factors to Consider when Selecting a Smart Contract Platform


    If you are interested in choosing a smart contract platform, there are many of
    them in the blockchain space. We have just explored a few of them, but there are
    things you need to consider before choosing one.


    Consider the Platform''s Reputation


    Over the years, Ethereum has become more popular than other smart contract blockchain
    platforms for those who want to create a cryptographic token. The team of developers
    on Ethereum created the “Ethereum Virtual Machine” (EVM). It is a Turing complete
    system that anyone can use in developing blockchain applications. Ethereum has
    a rich ecosystem that makes it less stressful for developers to create decentralized
    applications dApps.


    Ethereum would also be the best option for you if you need security through decentralization
    and this is because of its use of the PoW consensus mechanism. Presently, a good
    number of decentralized finance projects utilize the Ethereum platform. With the
    transition to Ethereum 2.0 which will also transition the blockchain from PoW
    to PoS, the scalability issues will be reduced and the platform will further increase
    its security.


    If you do not need your Token


    The truth is that not all projects will require a cryptographic token. If your
    project belongs to this class, then it is most likely that you are interested
    in use cases that need a permissioned blockchain. If you are trying to develop
    a supply chain assurance system for instance, then you do not require a cryptographic
    token. The best type of smart contract platform for your project is an enterprise
    blockchain solution and one of such platforms is Hyperledger Fabric. A smart contract
    platform like Quorum will be ideal for a company that is interested in a FinTech-specific
    use case. Quorum is also an enterprise blockchain platform that was developed
    with assistance from JP Morgan. In 2020, ConsenSys acquired the company.


    ## Chapter 7: Blockchain Technology & Its Challenges


    ![Image](Image00024.jpg)


    The list of companies interested in entering the blockchain space has continued
    to grow over the years. Despite the numerous benefits of distributed ledger technology,
    it still has several major hurdles to overcome before it becomes generally embraced.
    Some of these challenges range from the lack of proper regulation to low scalability
    as well as inadequate qualified personnel. In this section, we shall go through
    the technical and organizational challenges facing blockchain technology and also
    look at what third-generation solutions are implementing to deal with some of
    these challenges.


    ### The Major Challenges of Blockchain Technology


    One of the challenges that the mainstream adoption of blockchain technology has
    witnessed over the years has to do with reputation. Presently, most people see
    blockchain technology as the same with bitcoin and cryptocurrency. Unfortunately,
    the world still sees cryptocurrency as (and by association blockchain) fraudulent,
    speculators, hackers and malicious actors. We shall be looking at both non-technical
    or organizational challenges as well as the technical ones such as the lack of
    interoperability, difficulty in integrating with legacy systems, scalability issues,
    the complexity of distributed ledger technology and the lack of talents.


    Some of the organizational challenges at the corporate levels include lack of
    adequate awareness and understanding of the technology, absence of good governance,
    lack of user experience and several others. We shall be looking at most of the
    challenges and what the blockchain space is doing to tackle most of them.


    Challenges with Image'
