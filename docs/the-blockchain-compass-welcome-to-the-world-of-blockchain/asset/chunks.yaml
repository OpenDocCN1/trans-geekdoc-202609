- raw: 'Governments or centralized entities are often responsible for issuing these
    data points and they are then stored in centralized databases (centralized government
    servers). Despite the need for some form of physical identification, one thing
    is certain – it is not widely available to people for several reasons. Available
    data suggests that about 1.1 billion people around the globe lack the resources
    needed to claim ownership of their identity.


    This exposes the level of vulnerability of one-seventh of the world''s population
    because these individuals may not be able to own property, find employment locally
    or globally, vote in elections or even open a bank account. What this means is
    that the ability to access the financial system for such persons is jeopardized
    as a result of their failure to get proper identification documentation. This
    eventually limits their freedom.


    Individuals who have some form of officially approved identification also face
    the issue of not being able to have the right control and complete ownership of
    their identities. Their online identification experience is a fragmented one and
    they usually lose the value generated by their data unknowingly. Most companies
    storing user data are often hacked as we have seen in the case of Yahoo, Facebook
    and several others. This compels the end-user to live a life of constant fraud
    mitigation.


    ### Why Blockchain for Identity Management?


    ![Image](Image00052.jpg)


    The Entire process of identity management is plagued with so many issues and having
    a good understanding of some of these challenges will help us identify the need
    for a decentralized digital identity management system. Earlier, we talked about
    individuals and companies exploring other uses of blockchain technology. One of
    such applications is in identity management. Considering the features and benefits
    of blockchain technology, it is possible to eliminate most of the existing issues
    facing identity management. Blockchain can help deal with the issue of inaccessibility
    of identity. Out of the 1.1 billion individuals that lack a proof of identity,
    45 percent of them are among the poorest 20 percent on earth.


    The failure to obtain an officially recognized physical form of identity is usually
    caused by several roadblocks such as the expenses involved, the lack of knowledge
    about personal identity, the cumbersome processes involved in identification paperwork
    and also a lack of access. These factors prevent more than a billion people from
    being a part of the traditional identification systems. It is also difficult for
    anyone to enroll in a school, access different government and NGO services, get
    a passport, or even get a good job without having physical identities.


    With the current globalized economy in existence, having an identity is extremely
    vital to accessing the current financial systems. Presently, there are over 2.7
    billion unbanked persons in the world and 60 percent of them currently have mobile
    phones. This creates the opportunity for mobile identity solutions that are blockchain-based
    and suitable for the needs of the most vulnerable individuals around the globe.


    **1.** Insecurity of Data


    One of the primary reasons why we need blockchain is to help deal with the issue
    of insecurity of data. Have you observed that most of our valuable identification
    information are usually stored on centralized government databases with support
    from legacy software? Unfortunately, the way they function creates several single
    points of failure. Hackers and individuals with bad intentions find large centralized
    systems with millions of accounts containing the personally identifiable information
    of users very appealing.


    According to the US Consumer Data Breach Report for 2019, about 2.8 billion consumer
    data records were exposed in 2018; the kind of consumer information that hackers
    targeted the most was Personally Identifiable Information (PII) and the cause
    of the most frequent breaches was unauthorized access. In 2018 alone, despite
    the enterprise efforts and regulatory legislation aimed at improving cybersecurity,
    the cost of the total number of exposed consumer data records was estimated to
    be over $654 billion.


    Of course, we all know the long-term impact of data breaches which includes reduced
    customer loyalty for the affected companies, loss of reputation, and even various
    soft costs that are difficult to estimate. There were about 3,800 publicly disclosed
    breaches in 2019 and the total number of records exposed was 4.1 billion – representing
    an increase of over 54 percent from the figure in 2018.


    **2.** Fraudulent Identities


    For many users, their digital identity environment is quite fragmented as most
    of them would need to juggle several identities connected to their usernames on
    various websites. Presently, there is still no standard method for making use
    of data that is generated from any given platform on any other platform. Creating
    fake identities is relatively easy as a result of the weak link between digital
    and offline identities. Fake identities lead to many challenges as it serves as
    a fertile ground for counterfeit interaction which in turn helps in fostering
    fraud and further leads to inflated numbers as well as lost revenue. This kind
    of vulnerability influences society negatively as it often fosters the creation
    and spread of evils such as fake news that has remarkably posed as a potential
    threat to democracies around the world as seen in the United States election.


    **3.** Bad Password Combination


    This is perhaps the most common challenge with the identity management process.
    Presently, what most applications offer users is a password-based login authentication
    system before they can gain access to their accounts. But this process also involves
    several risks. The truth is that the process is complex because there is a specific
    expiration date for passwords for all applications. In addition, the specific
    requirements for new passwords often changes with time and this makes it more
    difficult keeping track of new passwords and even resetting old users'' passwords.


    This entire process causes users to experience what is regarded as “password fatigue,”
    and they simply resort to using the same password for several applications. In
    fact, they make use of the ones they have used before repeatedly and this eventually
    increases the security risks for their identities. One more point to add here
    is that whenever we use generic passwords, we give hackers the opportunity to
    steal users'' data without any difficulty.


    The design of blockchain technology enables it to maintain data in an immutable
    and encrypted way while being secure via cryptography. This ensures that all IDs
    are traceable and protected. Also, distributed ledger technology platforms eliminate
    the vulnerability linked to password protection


    **4.** Failure Caused by the Process of Manual Provisioning and De-Provisioning


    The moment an individual gets employed by an organization, then the IT department
    of the company is responsible for granting the employee access to the company''s
    core server, file servers, email accounts and various internal networking systems.
    The entire provisioning process is usually carried out at the department level.
    This also implies that in most instances, the person who grants access to the
    employee is the department administrator. But considering the manual process involved,
    this often makes it prone to several human errors.


    When an employee leaves the organization, then the employee''s access will be
    restricted immediately. This is the de-provisioning process and it is usually
    a manual process. This is one good reason why some employees manage to leave an
    organization and still retain access to their central server. This can become
    a big issue caused by human error since it would not be difficult for hackers
    to penetrate the server without any employee of the organization noticing and
    steal valuable information.'
