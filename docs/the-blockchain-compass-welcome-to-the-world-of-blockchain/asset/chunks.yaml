- raw: 'This type of blockchain is the opposite of the public blockchain, so the first
    major feature of the network is privacy. Any business that wants to maintain a
    private network but still desires to enjoy the unique benefits of distributed
    ledger technology will find the private blockchain very useful. Considering the
    centralized nature of private blockchains, a company using this type of blockchain
    will be in charge of the network and will prevent the public from gaining access
    to sensitive information.


    A company that makes use of the private blockchain network can also enjoy the
    major features of distributed ledger technology and offer members of the organization
    a great opportunity to build trust via security and immutability. It is also possible
    for the company to establish rules and coordinate the activities of the company
    based on their specific needs.


    Who is Consortium Blockchain Network For?


    Those who control the operations of consortium blockchain are a collection of
    organizations or nodes instead of a decentralized network or a centralized node.
    What makes it an excellent choice is the fact that it has pre-selected nodes and
    this is what makes it an excellent choice for those who are searching for a solution
    that demands collaboration. Supply chain companies, medicine, food, etc., are
    some good examples of industries that should consider using consortium blockchain
    since it needs collaboration across board.


    Hybrid Blockchain


    Are you interested in enjoying the benefits of public and private blockchain with
    the least level of disadvantages? If you answered yes, then hybrid blockchain
    is the best option for you. Although it still has some disadvantages just like
    everything else, its disadvantages are quite low. For upcoming business models,
    this is a perfect choice.


    ## Chapter 3: Key Components of Blockchain


    ![Image](Image00008.jpg)


    As I explained before, blockchain is simply a type of distributed ledger technology.
    There is no centralized administration of data; instead, data is accepted based
    on consensus by every participating node in the network. Several components make
    up a blockchain and understanding each of these components and their roles will
    give you a clearer picture of how the blockchain works regardless of the type
    of blockchain.


    Nodes


    ![Image](Image00009.jpg)They are an essential aspect of a blockchain network since
    they ensure the appropriate distribution of digital data on a peer-to-peer network.
    As I earlier mentioned, they are simply computers that have a copy of the blockchain
    database. However, there are two variants of nodes; we have validator or full
    nodes and member or partial nodes. The validator nodes are the ones that maintain
    a complete and updated copy of every single transaction on a given blockchain
    network. The validator node can validate, accept or even reject any transaction
    on the network.


    On the other hand, partial or member nodes do not maintain the complete copy of
    the blockchain ledger. The lightweight node simply maintains just the hash value
    of transactions and can only access these transactions only with the hash value.
    The storage and computational strength of member nodes is low, unlike the validator
    nodes.


    Ledger


    The first component we shall be discussing is the ledger. It is just like the
    common word ledger most people know, but a blockchain ledger is an electronic
    record of several transactions. Although assets form a crucial part of transactions,
    the ledger is not still a collection of assets. Instead, it keeps a record of
    every transaction of the assets. So, we can record every transaction involving
    an asset like bitcoin with a distributed ledger and not just bitcoin. To create
    the ledger, blockchain technology builds a consecutive and chronological chain
    of blocks. Also, just like the case of Ethereum and Hyperledger, it can record
    a collection of codes known as smart contracts.


    Transactions, Blocks and Chains


    ![Image](Image00010.jpg)


    In this context, we can see transactions that are:


    *   Records such as an event


    *   Chronologically ordered


    *   Verified and secured cryptographically


    *   Bundled to create a block


    As mentioned before, a block simply comprises a set of transactions all grouped
    before being added to a chain of other blocks. This is how we derived the name
    blockchain. As all the blocks are chained together, every new block will be assigned
    a reference to a special identifier from the previous block and this is known
    as a cryptographic hash. You can add one or more transactions to a block, which
    implies that we can actually batch several transactions to a single block.


    The goal of batching transactions is to enhance the throughput rate of transactions
    for various blockchain platforms with a specific block throughput rate. Details
    you will find in each block are:


    *   **Timestamp:** This refers to the timestamp of every single block that is
    added to the chain.


    *   **Previous cryptographic hash:** We can see this as a unique identifier known
    as hash and it is referenced from the previous block.


    *   **Nonce:** Number only used once (Nonce) is the cryptographic challenge number
    that all participating nodes are solving for to enable them to propose a new block.
    The nonce is actually a hashed block; once rehashed, it will meet the difficulty
    level restrictions.


    *   **Merkle root hash:** A block also contains the Merkle tree root hash for
    every transaction that was added to the block.


    ![Image](Image00011.jpg)


    Wallet


    In the blockchain space, a wallet refers to a software that enables users to store
    the details of their cryptocurrency. So, each node on the network also requires
    a wallet and the security of the wallet is guaranteed with the public and private
    keys. There are two categories of wallets in the cryptocurrency space:


    *   **Hot wallet:** This refers to wallets we use on a daily basis for various
    transactions. Hot wallets are linked to the internet and this also exposes them
    to hackers who can gain access to the wallets via the internet. There are different
    varieties of hot wallets and they include online/web wallets.


    *   This class of wallets is cloud-based which implies that as long as you have
    access to the internet you can connect with your smartphone. MetaMask and MyEther
    Wallet are two good examples of online wallets. Also, desktop and mobile wallets
    belong to this class. You can download this type of wallet on your laptop or smartphone
    which also implies that you have full control of the wallet. Mycelium, Coinomi
    are two examples of software wallets.


    *   **Cold Wallet:** The second class of wallets is often called cold storage
    or wallets and that is because they are not in any way connected to the internet.
    Cold wallets are generally the safest class of wallets since it is extremely difficult
    for hackers to access them. Cold wallets can come as hardware or paper wallets.
    Paper wallets are completely offline and the details of the wallet are stored
    on a piece of paper. The details of the paper wallet include the cryptocurrency
    address as well as a private key which is stored as a QR code. A hardware wallet,
    unlike a paper wallet, is an electronic device. It utilizes a random number generator
    linked to the wallet.


    Nonce


    Nonce is one of the aspects of blockchain that ensures its safety courtesy of
    cryptography. It is simply a shortened way to say “number only used once.” It
    refers to a number that is added to an encrypted or hashed block in a blockchain
    that satisfies the difficulty level restrictions once rehashed. In fact, what
    miners are solving for in a blockchain like the Bitcoin blockchain is the nonce
    and the moment they discover the nonce, then miners will get rewards in the form
    of cryptocurrency for their efforts. When a miner solves the mathematical computations,
    they are rewarded for their skill and time.'
