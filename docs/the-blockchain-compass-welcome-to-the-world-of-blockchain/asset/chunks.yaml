    and things are really moving fast. We are in the era of artificial intelligence,
    distributed ledger technology, the Internet of Things, and several others all
    happing at the same time. While blockchain is transforming our perception regarding
    the internet''s capabilities and enabling us to transparently and dramatically
    increase the speed of internet transactions, AI is also opening new doors to several
    aspects of business.


    AI is already optimizing routine work and shifting the focus of human efforts
    toward more complex and important tasks. In case you are not sure what artificial
    intelligence means, it is often used to denote computers that execute their tasks
    where human contribution is required. The technologies that make this possible
    include deep learning, machine learning and neural networks. So, how can we benefit
    from the combination of AI and blockchain?


    Blockchain Offers Us a Better Explanation of AI Actions than Humans


    Humans are capable of creating artificial neural networks and we can also educate
    the computer algorithms to increase the scope of what they can do based on our
    experience with assistance from machine learning algorithms. However, one issue
    that has raised concerns around the world is the fact that developers lack the
    ability to determine the actions of AI and they cannot even explain how it thinks.
    Also, the AI systems that operate complex decision trees are just like black boxes
    for human intelligence.


    The summary of this explanation is that we lack a deep understanding of how artificial
    intelligence thinks. The primary reason why we are unable to understand how artificial
    intelligence thinks is that we cannot imagine the capability of the computer to
    analyze enormous amount of data. The average memory of a computer contains far
    more information than that of the most intelligent individuals that have ever
    existed. The machine''s memory also needs to define the level of importance of
    each piece of information.


    Well, we have what it takes to create an algorithm that can educate the computer
    to do this, but we also cannot ascertain how this kind of algorithm will develop.


    When every decision of the AI system is recorded in a distributed ledger like
    blockchain, we can get an extensive database that will provide us with sufficient
    information needed to check all the decisions that AI will take and also explain
    their logic. Blockchain will also ensure the security of the data because it is
    not possible to falsify the information stored in the blockchain.


    AI can Increase Blockchain''s Efficiency


    Those who validate blockchain transactions are miners who utilize their computing
    power as they combine different characters to guess the right one before being
    rewarded, especially with proof of work consensus. Although many miners are competing
    to answer the puzzle first and get the reward, only one miner will get the reward.
    So, what happens to the energy other miners used in the process? It will all be
    wasted. We are likely going to see a future where AI can be trained by machine
    learning algorithms to guess the code intelligently rather than waste energy and
    time in guessing the right one. This will eventually increase the speed of the
    validation process and drastically reduce cost.


    It is also important to talk about the size of data which is one of the challenges
    of using blockchain in our daily lives. We record every piece of information in
    the blockchain and every node on the network also has a copy of the data. However,
    the chain will become heavier as the number of blocks increase and this is where
    AI comes in. We can actually optimize the data storing techniques of blockchain
    with machine learning algorithms.


    The truth is that the function of decentralized AI will depend on a parallel computing
    system that comprises various independent nodes that are positioned in different
    cities around the globe. This distributed network will ensure optimum usage of
    all its computational power to quickly analyze huge data sets. The dataset will
    be divided into smaller units that can be analyzed by different nodes and the
    final results will be combined in an integral database. A dominant company can
    control this worldwide database and every member of the network will have access
    to the information.


    We can eventually train the advanced AI algorithms with this immense data. The
    combination of the two technologies will undoubtedly revolutionize how we conduct
    business and there are many possibilities. As blockchain technology continues
    to mature alongside AI, we are likely going to witness better use cases and other
    ways their integration can be useful.


    ## Chapter 18: Interoperability, NFTs, Blockchain as a Service & Others


    Within the past few years, we have witnessed the establishment of different projects
    in the blockchain space. Apart from creating unique and digitized versions of
    some of the services we are used to in traditional settings, these projects are
    a clear indication of the things that are possible with blockchain technology.
    Trends such as the digitization of things like memes, artwork domain names, etc.,
    interoperability between different blockchains and off-chain resources, and the
    emergence of blockchain-as-a service projects are some exciting developments that
    we are already witnessing. So, what should we expect from these new blockchain
    platforms? I will attempt to go through what they have already achieved and what
    we may likely see in the future.


    ### Interoperability Opens the Door to Greater Possibilities & Flexibility


    Having come this far, I am sure you are convinced of the potential of distributed
    ledger technology like blockchain to significantly improve business processes,
    provide security and transparency in the value chain. Earlier in chapter seven,
    we looked at interoperability and some of the projects working in that sector.
    The impact of all these new achievements will cut down on operational cost. However,
    you will also agree with me that we are yet to witness the mass adoption of blockchain
    despite the cryptocurrency boom.


    So, what are the factors slowing down the mass adoption of this amazing technology?
    Several factors have been identified to hinder this expected mass adoption and
    one of them is the issue of scale. But interoperability is one challenge that
    is most widely identified as the most problematic – the lack of interoperability.
    Let’s examine the concept of interoperability in detail now.


    ### A Highly Siloed Blockchain Ecosystem


    Blockchain was designed to be a decentralized technology, however, this does not
    imply that individual blockchain projects can communicate properly with other
    blockchain networks. Presently, we now have many public and private blockchain
    networks but they all have different features such as hashing algorithms, consensus
    models, types of transactions, etc. all focused on a specific area. This issue
    is even worsened by the fact that different networks and financial institutions
    all utilize totally different blockchain versions, governance rules and regulatory
    frameworks.


    The outcome of all these differences is a collection of unconnected blockchain
    ecosystems where each network functions alongside the other ones but is siloed
    from others. This has prevented the blockchain industry from attaining its full
    potential. According to a ConsenSys research paper, *“If the existing blockchain
    networks continue to operate separately without communicating with each other,
    then we would have a scattered collection of siloed blockchains that are assisted
    by a weak network of nodes and prone to centralization, attack, and manipulation.”*


    ### Understanding Interoperability'
