  trans: "\n\n# 区块链类型与关键组件\n\n## 私有链\n\n这种类型的区块链与公有链截然相反，因此网络的首要特性是隐私性。任何希望维护私有网络，同时又想享受分布式账本技术独特优势的企业，都会发现私有链非常有用。考虑到私有链的中心化本质，使用这种类型区块链的公司将掌控网络，并防止公众访问敏感信息。\n\
    \n使用私有链网络的公司也可以享受分布式账本技术的主要特性，并为组织成员提供通过安全性和不可篡改性建立信任的绝佳机会。公司还可以根据其特定需求制定规则并协调公司活动。\n\
    \n## 联盟链网络\n\n控制联盟链运营的不是去中心化网络或中心化节点，而是一组组织或节点。使其成为绝佳选择的原因在于它拥有预选节点，这使其成为寻求需要协作解决方案者的理想之选。供应链公司、医药、食品等行业就是一些很好的例子，它们应考虑使用联盟链，因为这些行业需要全方位的协作。\n\
    \n## 混合链\n\n您是否有兴趣在以最小劣势的情况下享受公有链和私有链的优势？如果您的回答是肯定的，那么混合链是您的最佳选择。尽管它像其他事物一样仍有一些缺点，但其缺点相当小。对于新兴业务模式来说，这是一个完美的选择。\n\
    \n# 第 3 章：区块链的关键组件\n\n![Image](img/Image00008.jpg)\n\n正如我之前所解释的，区块链只是一种分布式账本技术。没有数据的中心化管理；相反，数据是基于网络中每个参与节点的共识被接受的。有几个组件构成了区块链，了解这些组件及其各自的角色，将让您对区块链的工作原理有更清晰的认识，无论区块链的类型如何。\n\
    \n## 节点\n\n![Image](img/Image00009.jpg)\n\n它们是区块链网络的一个基本方面，因为它们确保数字数据在点对点网络上的适当分发。正如我之前提到的，它们只是拥有区块链数据库副本的计算机。然而，节点有两种变体；我们有验证节点（或全节点）和成员节点（或轻节点）。验证节点是维护给定区块链网络上每笔交易的完整且更新的副本的节点。验证节点可以验证、接受甚至拒绝网络上的任何交易。\n\
    \n另一方面，部分节点或成员节点不维护区块链账本的完整副本。轻量级节点仅维护交易的哈希值，并且只能通过哈希值访问这些交易。与验证节点不同，成员节点的存储和计算能力较低。\n\
    \n## 账本\n\n我们要讨论的第一个组件是账本。它就像大多数人熟知的常见“账本”一词，但区块链账本是多笔交易的电子记录。虽然资产构成交易的关键部分，但账本仍不是资产的集合。相反，它记录资产的每一笔交易。因此，我们可以使用分布式账本记录涉及比特币等资产的每一笔交易，而不仅仅是记录比特币本身。要创建账本，区块链技术构建了一条连续且按时间顺序排列的区块链。此外，就像以太坊和\
    \ Hyperledger 的情况一样，它还可以记录称为智能合约的代码集合。\n\n## 交易、区块与链\n\n![Image](img/Image00010.jpg)\n\
    \n在此背景下，我们可以看到交易具有以下特点：\n\n*   记录（如事件）\n*   按时间顺序排列\n*   经过加密验证和保护\n*   打包以创建区块\n\
    \n如前所述，区块仅包含一组交易，所有交易在添加到其他区块的链之前被分组在一起。这就是“区块链”名称的由来。由于所有区块链接在一起，每个新区块都将被分配一个来自前一个区块的特殊标识符引用，这被称为加密哈希。您可以向一个区块添加一笔或多笔交易，这意味着我们实际上可以将多笔交易批量打包到单个区块中。\n\
    \n批量处理交易的目标是提高具有特定区块吞吐率的各种区块链平台的交易吞吐率。您将在每个区块中找到的详细信息包括：\n\n*   **时间戳：** 这指的是添加到链上的每个区块的时间戳。\n\
    *   **前一个加密哈希：** 我们可以将其视为一个称为哈希的唯一标识符，它引用自前一个区块。\n*   **Nonce（随机数）：** 仅使用一次的数字是所有参与节点为了有资格提议新区块而求解的加密挑战数字。Nonce\
    \ 实际上是一个经过哈希的区块；一旦重新哈希，它将满足难度级别限制。\n*   **Merkle 根哈希：** 区块还包含添加到该区块的每笔交易的 Merkle\
    \ 树根哈希。\n\n![Image](img/Image00011.jpg)\n\n## 钱包\n\n在区块链领域，钱包是指一种软件，它使用户能够存储其加密货币的详细信息。因此，网络上的每个节点也需要一个钱包，而钱包的安全性由公钥和私钥保证。加密货币领域有两类钱包：\n\
    \n*   **热钱包：** 这指的是我们日常用于各种交易的钱包。热钱包连接互联网，这也使它们暴露在黑客面前，黑客可以通过互联网访问钱包。热钱包有不同种类，包括在线/网页钱包。\n\
    \    *   这类钱包基于云端，这意味着只要您有互联网接入，就可以用智能手机连接。MetaMask 和 MyEther Wallet 是在线钱包的两个很好的例子。此外，桌面钱包和移动钱包也属于这一类。您可以在笔记本电脑或智能手机上下载此类钱包，这也意味着您完全控制钱包。Mycelium\
    \ 和 Coinomi 是软件钱包的两个例子。\n*   **冷钱包：** 第二类钱包通常被称为冷存储或冷钱包，因为它们以任何方式都不连接互联网。冷钱包通常是最安全的一类钱包，因为黑客极难访问它们。冷钱包可以是硬件钱包或纸钱包。纸钱包完全离线，钱包详细信息存储在一张纸上。纸钱包的详细信息包括加密货币地址以及以二维码形式存储的私钥。硬件钱包不同于纸钱包，它是一种电子设备。它利用与钱包关联的随机数生成器。\n\
    \n## Nonce（随机数）\n\nNonce 是区块链的一个方面，它通过密码学确保区块链的安全性。它只是“number only used once”（仅使用一次的数字）的缩写。它指添加到区块链中加密或哈希区块的一个数字，该数字在重新哈希后满足难度级别限制。事实上，矿工在比特币区块链等区块链中求解的就是\
    \ nonce，一旦他们发现 nonce，矿工将因其付出的努力获得加密货币形式的奖励。当矿工解决数学计算时，他们将因其技能和时间获得奖励。\n\n"
