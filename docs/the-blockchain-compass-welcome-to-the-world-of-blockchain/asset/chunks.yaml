    from low-and middle-income countries increased to $529 billion. This indicates
    an increase of 9.6 percent compared to its previous record high of $483 billion
    back in 2017. Also, the total global remittances that include both low-and middle-income
    countries and high-income countries jumped from $633 billion to $689 billion.
    The Bank disclosed that the most expensive channels of remittances were banks
    as they charged fees that were as high as 11 percent averagely within the first
    quarter of 2019. Records also show that the next most expensive were post offices
    as they cost over 7 percent.


