    # What Blockchain Has to Offer the Health Sector


    One of the things that the COVID-19 pandemic revealed was how inefficient the
    health sector was and the need for an urgent improvement in the healthcare sector.
    In the United States, for instance, it is estimated that total healthcare expenditure
    was about $3.55 trillion in 2017 and there are predictions that in 2025, it will
    exceed $5.5 trillion. Healthcare is generally a huge market not just in the US
    but in other countries as well.


    Unfortunately, this crucial aspect of our lives is considered to be highly inefficient.
    Estimates from the Institute of Medicine show that between 20-30 percent of the
    total funds spent on healthcare is either wasteful or results in poor outcomes.
    So, how do healthcare organizations incur these costs? Some of these excessive
    costs include:


    *   Overpriced medical tests

    *   Medical fraud

    *   High administrative fees

    *   Missed prevention opportunities

    *   Useless treatments


    Some estimates show that the healthcare industry spends about $975 billion on
    duplicating services which is caused by poor communication between hospitals and
    doctors. In the UK the NHS faced a £30 billion funding shortfall despite having
    underutilized data assets that exceeded this value. Blockchain technology can
    help to increase the efficiency of healthcare delivery. It has the potential to
    also unlock the research potential of NHS data assets and provide social benefits.


    Most healthcare institutions store patients'' data in silos in private healthcare
    and NHS Trusts. There is actually a low level of integration or data sharing in
    a way that can help to improve the quality of care and further provide other benefits
    like higher productivity, accelerated access, innovation in new medical breakthroughs
    as well as cost savings. The medical informatics and analytics sector has witnessed
    significant growth and this is one of the reasons why there is now a shift toward
    medical research that is data-driven.


    However, consent in healthcare is quite complex since healthcare professionals
    cannot make use of a patient''s healthcare data without getting the required consent
    and this repetitive process is really a waste of time and stressful. By leveraging
    the benefits of blockchain technology, it would be possible to unlock the value
    of healthcare data and enjoy social benefits. This would require the development
    of a blockchain consent/permissioning infrastructure that allows two or more parties
    to work together in a trustless environment. Data is currently held in various
    systems without sufficient integration or cross-sharing.


    The summary of the challenges facing the healthcare industry include:


    *   There is no streamlined system for maintaining health data in the form of
    universal medical records. This affects the standard of treatment that patients
    get from healthcare institutions.

    *   Health data is poorly organized and handling it often involves money and it
    wastes time.

    *   Issues such as accidental loss or damage to data and fraudulent alterations
    affect health data.

    *   The management and tracking of data of relief activities or health campaigns
    is cumbersome because it is divided among various agencies.

    *   Medical professionals encounter several problems while doing their job and
    one of them has to do with accessing their patient''s medical history. This eventually
    increases the effort and time spent in re-diagnosing.

    *   Hospitals as well as other healthcare institutions also have issues with getting
    payments that patients make. They face the problem of underpayments, managing
    claims and remittances.

    *   Many individuals and organizations handle pharmaceutical products – from production
    points to patients. This leads to the problem of making real prescriptions with
    counterfeit drugs and places the patient''s health at risk.

    *   To ascertain the efficiency of a new drug in preventing, detecting and managing
    different medical conditions, healthcare researchers test new treatments, then
    record and store the results of such clinical trials. However, they often encounter
    issues of dissimilar record systems, the fear that research data could be stolen,
    corruption, tracking large volumes of data and the possibility of natural data
    damaging.


    ## 1. Blockchain and Clinical Trials


    Generally, clinical trials involve testing new drugs to ascertain how effective
    they are in a controlled environment. This process often takes years to complete
    and it is extremely crucial for pharmaceutical companies and that is why they
    invest heavily in trials. The truth is that a lot is at stake for these pharmaceutical
    companies and this also explains why the clinical trials face cases of fraud.


    In the course of a clinical trial, the companies provide tons of data such as
    medical imagery, surveys, statistics, blood tests, etc. But one of the greatest
    challenges facing the team in charge of the clinical trials is that they are expected
    to take good care of the data they obtained properly. With centralized systems
    and the human factor, it is often difficult to manage data and this results in
    mistakes.


    There is also the issue of fraud which comes as manipulation. Malicious actors
    in the system conceal vital information that will never reach the systems while
    the other ones are altered to get the desired outcome. Unfortunately, most companies
    working on clinical trials can never disclose the cases of manipulation of information.
    Other issues facing clinical trials include failure to share critical information
    even before the commencement of the trials.


    A distributed ledger technology like blockchain can help in many ways. It can
    help by providing data integrity and acting as proof in the process of verifying
    the authenticity of a document. Blockchain''s distributed network will help maintain
    the integrity of data and ensure that no one modifies the data without the authorized
    access. Among the solutions implementing the use cases are Sanofi, Pfizer and
    Amgen.


    ## 2. Pseudonymous Health Recommendations Focused on Patients


    One of the exciting potential use cases of blockchain technology in healthcare
    is providing health recommendations that are pseudonymous, patient-focused or
    encrypted health warnings and advisories. What this means is that while a patient''s
    identity is secure, their health details can actually be contributed to a collection
    of data in a distributed ledger. With this, it would be possible to provide encrypted
    health recommendations that are patient-specific which would be sent to the patient
    securely. This information (that would be sent to an anonymous patient) would
    strictly be based on the patient''s data, risk factors, etc.


    The recent development in the healthcare sector that is now increasingly focusing
    on a more community-focused and proactive preventive care model of treatment makes
    this scenario more relevant. In case you are unsure what the preventive care model
    is all about, it has to do with preventing the occurrence of an injury or a disease
    before it happens. With blockchain technology, it would be possible to securely
    share medical records in encrypted form and this would unlock a new opportunity
    of understanding for population health. Blockchain is not centralized, unlike
    traditional healthcare systems that have intermediaries serving as giant warehouses
    of patient information.


    ## 3. Claims and Billing

