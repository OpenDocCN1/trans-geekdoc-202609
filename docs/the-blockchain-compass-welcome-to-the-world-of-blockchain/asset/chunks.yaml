    A consensus is vital for distributed ledger technology, but in blockchain, developers
    can actually adopt various strategies to achieve consensus like Proof-of-work,
    Proof-of-Stake, Delegated Proof of Stake and several others. Other features of
    blockchain that you may not really find in distributed ledgers include:


    *   **Sequence:** All blocks in the blockchain are often arranged in a specific
    sequence. This is not the case for DLT as there is no need for a particular sequence
    of data. One of the things that distinguish blockchain from other DLT platforms
    is the sequence of blocks.

    *   **Block Structure:** This is perhaps the most remarkable difference between
    blockchain and DLT. In Blockchain, you will find blocks of data and this is not
    the case with distributed ledgers. A distributed ledger is just a database that
    is distributed across various nodes. It is possible to represent the data in a
    distributed ledger in various ways.

    *   **Energy Consuming Consensus:** The recent outburst by Elon Musk that resulted
    in a significant drop in the price of bitcoin is as a result of the energy usage
    of bitcoin miners even as the world is racing to deal with the issue of global
    warming. Blockchain technology makes use of the proof-of-work consensus and other
    mechanisms but this usually consumes a lot of energy. This is different for a
    distributed ledger since it does not require such kind of consensus and they are
    relatively more scalable.


    Now you have a better view of the two. Blockchain technology comes with extra
    functionality and exceeds that of the traditional distributed ledgers. Blockchain
    technology can execute several functionalities that some distributed ledgers cannot
    perform like interoperability. We can confidently say that blockchain technology
    is moving distributed ledger technology to the next level.


    ### Categories of Blockchain


    Few years after the launching of blockchain, it would be difficult to write over
    20,000 words about blockchain and cryptocurrency. However, you can write over
    100k words of a book on blockchain and cryptocurrency now. This is because the
    blockchain and cryptocurrency space is evolving fast and has become very broad.
    What began with Satoshi Nakamoto''s launching of Bitcoin with a public blockchain
    which is also known as the first class of blockchain has transformed into multiple
    use cases.


    Generally, Bitcoin''s blockchain is seen as the first generation of blockchain
    technology but things have changed so fast and we now have over three different
    classes of blockchain technology. Every type of blockchain in existence was created
    to deal with a specific set of issues. We are now seeing more companies exploring
    ways to take advantage of the benefits of blockchain technology as much as possible.


    Before we dive into exploring the different categories of blockchain, we need
    to understand why we need different types in the first place. The first popular
    use case of blockchain was when it was launched alongside bitcoin back in 2008.
    The intention of Satoshi Nakamoto is still difficult to ascertain, but the use
    of the public blockchain for bitcoin also opened the door for people to explore
    the concept of decentralized ledger technology.


    The emergence of distributed ledger technology also transformed how we solve issues
    in our businesses as organizations started discovering that it is possible to
    execute several transactions without requiring a centralized entity. While distributed
    ledger technology helped deal with several challenges of centralization, it also
    brought with it new challenges that we need to solve when applying blockchain
    technology to other use cases.

    '
  trans: '


    ![Image](img/Image00004.jpg)


    我们可以简单地将分布式账本视为“一个去中心化的数据库”，这意味着它是一个存储在数百或数千台计算机或节点中的数据库。分布式账本中的所有节点都维护该账本，一旦有任何数据被添加，账本也会随之更新。账本的更新发生在每个参与节点上，并且是独立完成的。在这种设置下，所有参与节点享有同等权限，没有单个服务器或中心化机构负责管理数据库。


    这也是确保该技术高度透明的原因。在分布式账本上更新和验证数据存在的过程非常直接，节点可以根据账本现有的共识算法验证每一笔交易。在某些情况下，只有少数选定的节点可以参与验证交易，而在其他情况下，则允许所有节点参与该过程。当所有节点都给予批准时，交易将在账本中占据一席之地，账本的状态也将随之更新。


    除了分布式账本提供的更高透明度外，它还提供了极佳的安全性，因为不存在像传统数据库那样的中心化机构。该技术中不存在单点腐败。所有参与节点都有机会验证交易，这解释了为什么金融行业处于采用该技术的最前沿。


    ### 区块链技术


    ![Image](img/Image00005.jpg)


    要解决区块链是否等同于 DLT 这个问题，你可以将 DLT 视为区块链的母技术。区块链技术只是分布式账本的一种类型，但它比母技术更受欢迎。有趣的是，一些核心开发者开始走出区块链的阴影，这也解释了为什么对理解两者差异感兴趣的人数也在增加。


    正如其母技术一样，区块链上的所有参与节点都拥有账本的副本。每当添加一笔新交易时，任何给定区块链网络上账本的每一个副本都会得到更新。在将交易追加到账本之前，必须对其进行加密。同样也不需要像
    DLT 那样由中心化机构来管理系统。这解释了为什么它是一个去中心化系统。区块链将存储在其中的数据排列为区块，这也是其名称的由来。


    所有区块相互连接，并且出于安全目的也进行了加密。区块链的特性之一是无法删除或修改现有数据。区块链仅允许添加操作，这与传统数据库不同。记录在区块链中的所有交易都存在于历史记录中，没有人可以修改或删除其中任何一笔。因此，与
    DLT 类似，区块链极其透明，这也是为什么有预测称区块链市场将在 2024 年增长到 160 亿美元。


    ### DLT 与区块链技术的区别


    尽管这两种技术有许多相似之处，但也存在一些差异。正如我之前提到的，分布式账本技术简单来说就是区块链的母技术。我们也可以将区块链视为 DLT 的一个进阶版本。区块链技术只是分布式账本的一个版本，这解释了为什么两者经常被互换使用。然而，将每一个分布式账本都视为区块链是错误的。


    这类似于某些产品变得极其流行，甚至比其母公司名称更知名的情况。区块链仅仅是获得了自己的身份，也许原因是它随着比特币和其他加密货币的创建而普及。在 DLT 的工作方式上也存在几个差异。


    共识对于分布式账本技术至关重要，但在区块链中，开发者实际上可以采用各种策略来达成共识，如工作量证明、权益证明、委托权益证明等。区块链的其他特性是你在分布式账本中可能找不到的，包括：


    *   **顺序：** 区块链中的所有区块通常按特定顺序排列。DLT 则不然，因为不需要数据的特定顺序。区块的顺序是区分区块链与其他 DLT 平台的因素之一。

    *   **区块结构：** 这或许是区块链与 DLT 之间最显著的区别。在区块链中，你会找到数据区块，但分布式账本并非如此。分布式账本只是一个分布在各个节点上的数据库。可以用多种方式表示分布式账本中的数据。

    *   **高能耗共识：** 埃隆·马斯克最近的爆料导致比特币价格大幅下跌，这是由于比特币矿工的能源使用问题，而世界正在竞相应对全球变暖问题。区块链技术使用工作量证明共识和其他机制，但这通常消耗大量能源。分布式账本则不同，因为它不需要此类共识，且具有相对更好的可扩展性。


    现在你对这两者有了更好的了解。区块链技术带来了额外的功能，并超越了传统分布式账本。区块链技术可以执行某些分布式账本无法执行的功能，如互操作性。我们可以自信地说，区块链技术正将分布式账本技术推向一个新的水平。


    ### 区块链的类别


    在区块链推出几年后，要写出超过 20,000 字关于区块链和加密货币的内容将会很困难。然而，现在你可以写一本超过 10 万字的关于区块链和加密货币的书。这是因为区块链和加密货币领域发展迅速，变得非常广阔。始于中本聪推出比特币的公共区块链（也称为第一类区块链）的事物，已经转变为多种用例。


    通常，比特币的区块链被视为第一代区块链技术，但事态发展如此之快，我们现在已经有了三种不同类别的区块链技术。现存的每种区块链都是为了解决一组特定问题而创建的。我们现在看到越来越多的公司正在探索如何尽可能多地利用区块链技术的优势。


    在深入探索区块链的不同类别之前，我们需要了解为什么首先需要不同的类型。区块链的第一个流行用例是 2008 年它随比特币一同推出时。中本聪的意图仍然难以确定，但将公共区块链用于比特币也为人们探索去中心化账本技术的概念打开了大门。


    分布式账本技术的出现也改变了我们解决业务问题的方式，因为组织开始发现可以在不需要中心化实体的情况下执行多笔交易。虽然分布式账本技术帮助解决了中心化的几个挑战，但它也带来了新的挑战，我们在将区块链技术应用于其他用例时需要解决这些挑战。


    '
