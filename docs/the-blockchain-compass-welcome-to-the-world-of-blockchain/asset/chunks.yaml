- raw: 'Digital ledgers are designed to help store our transactions which we can then
    later query regarding different characteristics of each of the blocks. So, how
    is data maintained and stored? It achieves proper storage and maintenance of data
    by having multiple copies of the shared digital ledger across different nodes.
    Every participating node on the network has a copy of the shared ledger.


    Network nodes can only agree on the valid transaction blocks via a network consensus
    protocol. The consensus protocol used by any network is unique to the platform
    and it is only when the nodes unanimously agree on the validity of a block that
    they will add it to the shared ledger and also synchronize every single copy of
    the ledger accordingly. It is this unique architecture that adds to the resilience
    of the technology because even when several nodes fail, the impact on the integrity
    of the data of the shared ledger will not be affected as long as a critical mass
    of nodes still functions.


    #### Blockchain Fork


    The term may appear complex to most readers, but I will provide a simple explanation
    that you can understand. In blockchain technology, it is a term that illustrates
    divergence or cutting off from the current code or software. But this word now
    has a broader meaning and you can see it as what occurs the moment a blockchain
    splits into two potential paths or a divergence that results in a change of protocol.
    Forking also means the point where the network requires significant changes or
    technical updates in codes.


    Remember, some blockchain networks such as Ethereum or Bitcoin are decentralized
    and this also implies that all participants on the network need to agree on the
    state of the network – including the shared blockchain protocol, blocks, etc.
    Of course, when all participants agree on the results of the blockchain network
    as well as all aspects of its operations, then the blockchain will stay unchanged.


    This also means that the network will have a single blockchain that maintains
    transaction records that are verified and confirmed by participants to be correct.
    However, this is not always the case as there may be moments when the nodes fail
    to unanimously come to a consensus about the future condition of the blockchain
    network. This results in disagreements that eventually lead to forks – a point
    where a “single” will split into at least two or more chains that will all remain
    valid. Check out the illustration below to fully understand what forking means.


    ![Image](Image00014.jpg)


    In blockchain, the process of forking leads to a shift in the existing rules to
    a set of new and predetermined rules. In some cases, not all members of the network
    can support the changes in the rules but this does not change the uniqueness of
    the rules. It is crucial for the rules to be identified by the nodes running on
    a blockchain network. In the event that a node refuses to adhere to the modifications
    to the rules, the node will be allowed but this decision also comes with several
    consequences. This brings us to the two major types of fork – hard and soft fork.


    Hard Fork


    This type of fork is regarded in blockchain space as a “non-backward compatible”
    upgrade to a blockchain that already exists. In the case of a hard fork, the nodes
    on the blockchain network either comply with the update to the software protocol
    or decide to stay with the outdated protocol and this leads to a separate blockchain
    entity. A good example of a hard fork is that of Ethereum and Ethereum Classic.
    Also, Bitcoin has experienced hard forks like the existence of Bitcoin and Bitcoin
    Cash.


    Soft Fork


    You can see this as the opposite of the hard fork. It refers to a “backward-compatible”
    upgrade of a blockchain network where the nodes that are upgraded can still communicate
    with the ones not upgraded. So, the newly created rules in a soft fork do not
    in any way clash with the ones already in existence. For instance, Ethereum and
    Bitcoin have used soft forks to execute new updates that are usually backward
    compatible. There are occasions where a soft fork takes place as a result of a
    temporary shift in the blockchain whenever miners make use of nodes that are not
    upgraded in violation of the new consensus rules. However, this scenario is very
    rare and such events are very unlikely to happen.


    Once a hard fork occurs, all the changes on a node that is still making use of
    the old set of rules will not be valid. This implies that an old node that tries
    to create and verify a block will not be considered as valid. Every single change
    that occurs in the course of a hard fork cannot be deleted or modified upon the
    completion of the fork. On the other hand, an old node that chooses to make and
    verify a block in a soft fork will be seen as valid by every single node on the
    network regardless of its state – old or new.


    ## Chapter 4: Decentralized vs. Centralized Networks


    ![Image](Image00015.jpg)


    In the first chapter, I promised that you will understand the meaning of some
    of the terms you will come across repeatedly in this book. So, it is crucial to
    explain what they all mean to ensure that you do not get confused. Earlier, we
    discussed the difference between blockchain and distributed ledger technology.
    I believe you now understand what both concepts mean. Let''s take a look at the
    difference between two commonly used words – decentralized and centralized networks
    and understand the pros and cons of each of these types of networks.


    ### Centralized Networks


    ![Image](Image00016.jpg)


    Primarily, the control of centralized networks rests purely on one centralized
    server or what you can call a master node. This centralized server manages all
    the data processing tasks of the entire network and also stores data as well as
    user information that other users on the network can access. Client nodes connect
    to the centralized server and instead of carrying out direct data requests, client
    nodes need to submit their data requests to the main server.


    Excellent examples of companies that operate a centralized network include most
    web services such as your online banking account, YouTube, Google, mobile app
    store and several others. The operations of these companies are coordinated by
    a centralized network owner which implies that there is a need for verification
    by a third-party authority for every data transaction in such networks.


    Currently, the most common type of network is the centralized network as most
    traditional companies and organizations maintain a centralized structure. Before
    they can connect other users and devices, they require a central network owner
    and this also means that a single point of failure exists in such networks and
    malicious actors can deliberately exploit such flaws.


    Advantages of Centralized Networks


    Centralized networks have several advantages and that is why they are still in
    use. Here are some of the merits of this type of network.


    *   Low maintenance cost: Of all the different types of networks, centralized
    networks are the least expensive, especially for small systems and they do not
    need a lot of resources to set up. In the event that a network administrator wants
    to carry out an update of the network, they can simply update the central server
    and this reduces time wastage and overhead cost required to maintain an up-to-date
    network.


    *   Deployment is straightforward and fast: In centralized networks, command chains
    are explicitly defined and it is relatively easy to delegate within the network.
    Adding or removing client nodes from the centralized server of the network is
    also an easy task because all that is required is to cut off the connections between
    the main server and the client node. But you should bear in mind that this does
    not increase the computing power of the network.'
