    # SECTION I: THE DISCOVERY & DEVELOPMENT OF BLOCKCHAIN TECHNOLOGY


    ![Image](Image00001.jpg)


    ## CHAPTER 1: HOW IT ALL BEGAN: THE HISTORY OF BLOCKCHAIN TECHNOLOGY


    One of the most significant innovations that we have witnessed in the 21st century
    is the emergence of blockchain technology. Within a short time, it has already
    established a ripple effect on different sectors – the financial industry, businesses,
    education, supply chain management, etc. However, many are not aware that blockchain
    technology has been identified as early as the 1990s. Every blockchain aspirant
    and enthusiast needs to understand the history of blockchain. Back in 1991, two
    individuals, Stuart Haber and W. Scott Stornetta conceptualized what we now regard
    as blockchain.


    Their first project was a cryptographically secured chain of blocks that would
    ensure that no individual or group of persons could make changes to the timestamps
    of documents. Interestingly, they took it a step further in 1992 by upgrading
    their system and incorporating Merkle trees. This helped to enhance efficiency
    and also allowed the addition of more documents to one block. This is the aspect
    of blockchain technology that most people, including blockchain enthusiasts hardly
    know about. All through this book, you will be coming across terms like digital
    ledger technology, nodes, and distributed ledger technology and as you read on,
    you will learn more about what they mean. I will be using blockchain and digital
    ledger technology interchangeably.


    Hal Finney and Reusable Proof of Work


    One of the names that you will often come across while learning about blockchain
    and cryptocurrency is Harold Thomas Finney II, popularly known as Hal Finey. In
    2004, he came out with a system regarded as Reusable Proof of Work (RPoW) which
    functioned by receiving a token that is a non-exchangeable or non-fungible Hashcash-based
    proof of work and in return produced an RSA-signed token that people can transfer
    between themselves.


    One of the problems that early digital currencies faced was the issue of double-spending
    and the RPoW was able to resolve the issue simply by maintaining the records of
    ownership of tokens on a server that is registered and trusted. The server was
    designed to permit users around the globe to easily verify the integrity and accuracy
    of records. This is seen by many as an early prototype of the existing cryptocurrencies
    and also forms part of the concepts that helped Satoshi Nakamoto to build the
    Bitcoin blockchain.


    The popularity of blockchain however began in 2008 when an individual or a group
    of persons with the name Satoshi Nakamoto came out with Bitcoin. Presently, we
    credit Satoshi Nakamoto as the brain behind blockchain technology after they came
    out with Bitcoin which is also the first major application of the technology.
    After conceptualizing the first blockchain in 2008, things started happening so
    fast as other individuals started exploring *“outstanding applications of the
    technology beyond cryptocurrencies.”*


    Satoshi Nakamoto did not remain in the spotlight for too long as he handed the
    development of Bitcoin over to other developers and exited the scene. Well, digital
    ledger technology has since evolved and there are now many applications that belong
    to the history of the technology. So, we can say that blockchain technically came
    into existence in 1991 and was popularized by Satoshi Nakamoto with the creation
    of Bitcoin in 2008.


    Before we go into the various phases of the development of blockchain, I need
    to point out that you will be seeing two versions of the word “bitcoin” as you
    read further. One will be in lowercase while the other one is in uppercase. They
    mean two different things. I am referring to “Bitcoin” blockchain and “bitcoin”
    cryptocurrency which makes use of the Bitcoin blockchain. I guess you understand
    what I mean now. Also, Ethereum refers to the Ethereum blockchain while ether
    is the native cryptocurrency of the Ethereum blockchain.


    ### The Phases of Blockchain Evolution


    Phase I Satoshi Nakamoto and Blockchain


    For many out there, bitcoin and blockchain are simply the same thing but this
    is not true. The truth is that blockchain is simply the foundation or what we
    might refer to as the underlying technology for several applications. Cryptocurrencies
    like bitcoin are simply one of the applications powered by blockchain technology.
    I guess you understand the point now!


    When Satoshi Nakamoto published the document, which is now known as the Bitcoin
    Whitepaper, he explained that the technology is an electronic peer-to-peer system.
    Also, Satoshi went ahead to form the first block known as the *“genesis”* block
    which also served as the basis for other blocks being mined. The emergence of
    bitcoin opened the door to new applications and most of them started exploring
    ways to take advantage of the principles as well as the capabilities of blockchain.
    We can say that the history of blockchain involves the creation of various applications
    that have evolved leveraging digital ledger technology.


    Phase II of Blockchain Evolution: Smart Contracts'
