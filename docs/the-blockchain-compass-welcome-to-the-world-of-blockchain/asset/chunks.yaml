    things you need to consider before choosing one.


    ## Consider the Platform''s Reputation


    Over the years, Ethereum has become more popular than other smart contract blockchain
    platforms for those who want to create a cryptographic token. The team of developers
    on Ethereum created the `Ethereum Virtual Machine` (EVM). It is a Turing complete
    system that anyone can use in developing blockchain applications. Ethereum has
    a rich ecosystem that makes it less stressful for developers to create decentralized
    applications dApps.


    Ethereum would also be the best option for you if you need security through decentralization
    and this is because of its use of the `PoW` consensus mechanism. Presently, a
    good number of decentralized finance projects utilize the Ethereum platform. With
    the transition to `Ethereum 2.0` which will also transition the blockchain from
    `PoW` to `PoS`, the scalability issues will be reduced and the platform will further
    increase its security.


    ## If You Do Not Need Your Token


    The truth is that not all projects will require a cryptographic token. If your
    project belongs to this class, then it is most likely that you are interested
    in use cases that need a permissioned blockchain. If you are trying to develop
    a supply chain assurance system for instance, then you do not require a cryptographic
    token. The best type of smart contract platform for your project is an enterprise
    blockchain solution and one of such platforms is `Hyperledger Fabric`. A smart
    contract platform like `Quorum` will be ideal for a company that is interested
    in a FinTech-specific use case. `Quorum` is also an enterprise blockchain platform
    that was developed with assistance from JP Morgan. In 2020, ConsenSys acquired
    the company.


    # Chapter 7: Blockchain Technology & Its Challenges


    ![Image](Image00024.jpg)


    The list of companies interested in entering the blockchain space has continued
    to grow over the years. Despite the numerous benefits of distributed ledger technology,
    it still has several major hurdles to overcome before it becomes generally embraced.
    Some of these challenges range from the lack of proper regulation to low scalability
    as well as inadequate qualified personnel. In this section, we shall go through
    the technical and organizational challenges facing blockchain technology and also
    look at what third-generation solutions are implementing to deal with some of
    these challenges.


    ## The Major Challenges of Blockchain Technology


    One of the challenges that the mainstream adoption of blockchain technology has
    witnessed over the years has to do with reputation. Presently, most people see
    blockchain technology as the same with bitcoin and cryptocurrency. Unfortunately,
    the world still sees cryptocurrency as (and by association blockchain) fraudulent,
    speculators, hackers and malicious actors. We shall be looking at both non-technical
    or organizational challenges as well as the technical ones such as the lack of
    interoperability, difficulty in integrating with legacy systems, scalability issues,
    the complexity of distributed ledger technology and the lack of talents.


    Some of the organizational challenges at the corporate levels include lack of
    adequate awareness and understanding of the technology, absence of good governance,
    lack of user experience and several others. We shall be looking at most of the
    challenges and what the blockchain space is doing to tackle most of them.


    ## Challenges with Image

