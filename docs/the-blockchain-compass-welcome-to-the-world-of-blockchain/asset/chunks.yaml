    has recently been gaining remarkable traction for many reasons. For most organizations,
    pairing cloud services with BaaS may turn out to be very valuable. Businesses
    can deal with most of their pain points by tailoring integrations courtesy of
    the personalized flexibility of BaaS. The BaaS solution can help them resolve
    complex challenges around cost, efficiency and transparency in a straightforward
    way.


    This will significantly lower the barriers to entry for enterprise blockchain
    applications. Companies can easily leverage all the merits of blockchain technology
    – accountability, minimization of trust, improved transparency and data security.
    They will enjoy these benefits without the need to develop their blockchain ecosystem.
    In fact, they do not even have to invest in the required computing resources.
    So, who are the big players in the BaaS space?


    The popularity of BaaS has drawn the attention of some of the biggest tech companies
    as most of them have now set aside special departments to focus on integrating
    and promoting BaaS. Other companies that have also entered the Blockchain as a
    service space include some of the most successful cloud service providers. Top
    on the list of companies operating in the BaaS space include:


    *   Microsoft

    *   Corda

    *   Accenture

    *   Stratis

    *   Amazon

    *   Baidu

    *   IBM

    *   Alibaba

    *   SAP

    *   Huawei

    *   Oracle

    *   Infosys


    Apart from these big players, we also have smaller innovative blockchain as a
    service firms and many of them are presently based in the US. These innovative
    BaaS companies integrate digital ledgers into their daily technology and some
    of them include Factom, Blockstream, Dragonchain, PayStand and several others.


    ## A Surge in Demand for Blockchain Experts


    Distributed ledger technology is still a new technology and there is a need for
    more enlightenment and education in this field. Blockchain is already spreading
    to different industries and more use cases are emerging every day. This also means
    that there would be a need for more individuals to learn about the technology.


    Of course, the number of blockchain experts is on the increase, but blockchain
    implementation is growing rapidly and this will lead to a sharp rise in the demand
    for blockchain experts. Many universities and colleges are making more efforts
    to catch up with this need. Also, organizations around the world are not left
    out as they are making efforts to develop their existing talents through training
    programs specifically meant for the development and management of blockchain platforms.


    However, the rate at which students with the right skills are graduating is insufficient
    to meet the demand. Companies like IBM have shown their concern over the inadequate
    number of blockchain talents and even referred to the situation as a "significant
    inhibitor" to the adoption of blockchain technology by existing companies. Coin
    Rivert, in 2018 revealed that there was a 2,000 percent year-on-year growth in
    the demand for blockchain experts and this data was obtained from Upwork.com.


    ## Government Regulation in a World that is Increasingly Getting Decentralized


    A look at the architecture of blockchain technology will undoubtedly explain the
    reasons for its inherent challenges to legacy institutions and traditional regulation
    and governance approaches. We have seen from our discussion so far that there
    is a remarkable increase in enterprise blockchains. This has so far allowed for
    traditional governance and regulation mechanisms.


    However, we will likely experience more challenges with an increase in the use
    of permissionless or public distributed ledger technology. It is impossible to
    regulate blockchains and trying to regulate them is like attempting to regulate
    all ledgers people have on their system – both online and offline. However, the
    underlying use cases of blockchain technology will certainly be regulated. Governments
    around the world will do this in collaboration with different regulators from
    several jurisdictions and others involved.


    Although there is presently no precise combination of governance mechanisms for
    blockchain technology, when one is available, it is most likely to involve the
    combination of "regulatory levers" that may be pulled to identify the appropriate
    balance.


    The regulation of blockchain faces some key dilemmas. For instance, we all know
    that regulation is essential to help protect users while ensuring security. However,
    when there is excessive regulation, it may eventually stifle innovation, especially
    in the financial sector. This also explains why the current dialogue on blockchain
    regulation should be sustained to ensure proper resolution to every aspect of
    its governance, especially when it has to do with privacy and security. States
    that desire to adopt decentralized business models may carry out several modifications
    to their existing legal frameworks.


    ## Conclusion

