    size of B2B cross-border payments would be as much as $15.5 trillion in 2018.
    The statistics is simply a strong indication of the size of the international
    payment sector as well as how it affects businesses, people and the countries
    where the funds are received. In fact, the World Bank predicted that remittances
    are on course to becoming the largest means of external financing, especially
    in developing nations.


    This also means that it can influence the growth and development of these countries.
    This also explains why the United Nation’s Sustainable Development Goals target
    for 2030 is to drastically lower costs associated with remittances made by immigrants
    which is currently an average of 7.1 percent to as low as 3 percent.


    ![Image](Image00039.jpg)


    Apart from the high fees, majority of remittance firms depend on the services
    of third-party services as well as financial institutions. What really renders
    the present system grossly inefficient is the need for the services of several
    intermediaries. These services are not only expensive but it often takes time
    as money transfers could take days and in some cases weeks. Distributed ledger
    technology can provide the remittance industry with more efficient alternatives.
    One other issue with the current remittance industry has to do with the recipients
    of the funds.


    Many of these recipients live in developing countries and they do not have access
    to a bank account. Unfortunately, most remittances are sent through formal banking
    systems. Even when these individuals have a bank account, they may need to travel
    long distances to collect their money from the nearest branch of the bank. Some
    lack proper means of identification which might be required for banking services
    too. This is why many remittances are carried out via informal means.


    This situation is fast changing with the emergence of blockchain technology and
    digital wallets. Blockchain has the potential to completely transform the existing
    global remittance channels. With mobile wallets, anyone with a smartphone and
    access to the internet can enjoy several functionalities and this includes the
    ability to transfer funds internationally.


    More blockchain-based remittance projects are emerging in the crypto space and
    their focus is on simplifying the whole process. They are eliminating the need
    for unnecessary third-party services to create frictionless and almost instant
    payment services. The blockchain network does not depend on a slow transaction
    approval process like traditional services that often pass through different mediators
    with so much manual work involved.


    Blockchain solutions can execute financial transactions in any location by making
    use of a distributed network of nodes. The traditional banking system is not as
    fast as blockchain technology because the technology can enable more reliable
    and faster payment solutions at a significantly reduced cost. Undoubtedly, blockchain
    has the right solutions to the major challenges facing the remittance industry
    – long transaction time and high fees.


