- raw: '![Image](Image00004.jpg)We can see a distributed ledger simply as “ *a decentralized
    database”* which means that it is a database that is stored in hundreds or thousands
    of computers or nodes. All the nodes in distributed ledger maintain the ledger
    and the moment any data is added, the ledger will also be updated. The update
    of the ledger happens at each participating node and this is done independently.
    In this setting, all participating nodes enjoy the same level of authority and
    no single server or centralized authority is in charge of managing the database.


    This is what also ensures that the technology is very transparent. The process
    of updating and validating the existence of data on a distributed ledger is very
    straightforward and the nodes can verify every single transaction based on the
    existing consensus algorithm of the ledger. In some cases, just a few selected
    nodes can participate in verifying transactions while others allow all nodes to
    participate in the process. The transaction will secure a place in the ledger
    when all nodes give the approval and the status of the ledger will also be updated.


    Apart from the increased level of transparency for a distributed ledger, it also
    offers an excellent level of security because there is no central authority like
    traditional databases. A point of corruption does not exist in this technology.
    All participating nodes get the chance to verify a transaction and this explains
    why the financial industry is at the forefront of adopting this technology.


    ### Blockchain Technology


    ![Image](Image00005.jpg)


    To address the question of whether blockchain is the same as DLT, you can see
    DLT as the parent technology of blockchain. Blockchain technology is just one
    type of distributed ledger that managed to become more popular than the parent
    technology. Interestingly, some core developers are beginning to come out of the
    blockchain shadow and this explains why there is also an increase in the number
    of people interested in understanding the difference between the two.


    Just like its parent technology, all participating nodes on the blockchain have
    a copy of the ledger. Whenever a new transaction is added, every single copy of
    the ledger on any given blockchain network will get updated. Before appending
    the transactions to the ledger, they must be encrypted. There is also no need
    for a central authority who manages the system just like DLT. This explains why
    it is a decentralized system. Blockchain arranges the data stored in it as blocks
    and this is the reason for its name.


    All the blocks are connected and for security purposes, they are also encrypted.
    One of the features of blockchain is the fact that it is impossible to delete
    or modify existing data. The blockchain only permits adding operation, unlike
    traditional databases. All transactions that are recorded in the blockchain exist
    in history and no one can modify or delete any of them. So, similar to DLT, blockchain
    is extremely transparent and this is why there are predictions that the blockchain
    market will increase to $16 billion in 2024.


    ### So, what is the Difference Between DLT and Blockchain Technology?


    Although the two technologies share so many similarities, there are some differences.
    As I mentioned before, distributed ledger technology is simply a parent technology
    of blockchain. We can also see blockchain as simply an advanced version of the
    DLT. Blockchain technology is just one version of distributed ledger which explains
    why the two are often used interchangeably. However, it is wrong to regard every
    distributed ledger as a blockchain.


    It is similar to a situation where some products turn out to be extremely popular
    and become more popular than their parent company name. Blockchain has simply
    gained its identity and perhaps the reason is that it became popularized with
    the creation of bitcoin and other cryptocurrencies. There are several differences
    in the way DLT works too.


    A consensus is vital for distributed ledger technology, but in blockchain, developers
    can actually adopt various strategies to achieve consensus like Proof-of-work,
    Proof-of-Stake, Delegated Proof of Stake and several others. Other features of
    blockchain that you may not really find in distributed ledgers include:


    *   **Sequence:** All blocks in the blockchain are often arranged in a specific
    sequence. This is not the case for DLT as there is no need for a particular sequence
    of data. One of the things that distinguish blockchain from other DLT platforms
    is the sequence of blocks.


    *   **Block Structure:** This is perhaps the most remarkable difference between
    blockchain and DLT. In Blockchain, you will find blocks of data and this is not
    the case with distributed ledgers. A distributed ledger is just a database that
    is distributed across various nodes. It is possible to represent the data in a
    distributed ledger in various ways.


    *   **Energy Consuming Consensus:** The recent outburst by Elon Musk that resulted
    in a significant drop in the price of bitcoin is as a result of the energy usage
    of bitcoin miners even as the world is racing to deal with the issue of global
    warming. Blockchain technology makes use of the proof-of-work consensus and other
    mechanisms but this usually consumes a lot of energy. This is different for a
    distributed ledger since it does not require such kind of consensus and they are
    relatively more scalable.


    Now you have a better view of the two. Blockchain technology comes with extra
    functionality and exceeds that of the traditional distributed ledgers. Blockchain
    technology can execute several functionalities that some distributed ledgers cannot
    perform like interoperability. We can confidently say that blockchain technology
    is moving distributed ledger technology to the next level.


    ### The Categories of Blockchain


    Few years after the launching of blockchain, it would be difficult to write over
    20,000 words about blockchain and cryptocurrency. However, you can write over
    100k words of a book on blockchain and cryptocurrency now. This is because the
    blockchain and cryptocurrency space is evolving fast and has become very broad.
    What began with Satoshi Nakamoto''s launching of Bitcoin with a public blockchain
    which is also known as the first class of blockchain has transformed into multiple
    use cases.


    Generally, Bitcoin''s blockchain is seen as the first generation of blockchain
    technology but things have changed so fast and we now have over three different
    classes of blockchain technology. Every type of blockchain in existence was created
    to deal with a specific set of issues. We are now seeing more companies exploring
    ways to take advantage of the benefits of blockchain technology as much as possible.


    Before we dive into exploring the different categories of blockchain, we need
    to understand why we need different types in the first place. The first popular
    use case of blockchain was when it was launched alongside bitcoin back in 2008.
    The intention of Satoshi Nakamoto is still difficult to ascertain, but the use
    of the public blockchain for bitcoin also opened the door for people to explore
    the concept of decentralized ledger technology.


    The emergence of distributed ledger technology also transformed how we solve issues
    in our businesses as organizations started discovering that it is possible to
    execute several transactions without requiring a centralized entity. While distributed
    ledger technology helped deal with several challenges of centralization, it also
    brought with it new challenges that we need to solve when applying blockchain
    technology to other use cases.'
