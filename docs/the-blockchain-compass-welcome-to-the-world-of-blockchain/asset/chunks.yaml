- raw: 'One of the sectors that is ripe for transformation is the automotive industry
    and experts believe that the potential is staggering. Frost and Sullivan actually
    predict that by 2025, the rate of adoption of blockchain technology in several
    functional areas like leasing and retailing, smart manufacturing and supply chain
    logistics will hit 37.2 percent. EY has predicted that there would be the use
    of blockchain across the entire automotive marketplace transactions – ownership,
    registration, financing, insurance as well as servicing transactions.


    But when it comes to the supply chain in the automotive sector, it is possible
    to cut down the level of counterfeit parts within the supply chain by determining
    provenance. The use of distributed ledger technology for supply chain logistics
    deals with a persistent issue for most original equipment manufacturers which
    is that of counterfeit parts. Tracing every single part through each step of the
    supply chain ensures that all shipped parts are the ones that were delivered.
    IBM points out that this feature can apply not just to the automotive industry
    but also to other industries that depend on parts.


    ![Image](Image00031.jpg)


    2.Supply Chain Finance


    There has been an increase in the interest of many companies in blockchain and
    supply chain finance solutions. This is because distributed ledger technology
    can enhance the efficiency of invoice processing, provide secure and transparent
    transactions. Traditional invoice payment terms often last for about 30 days or
    more in some cases. The combination of digital ledger technology, supply chain
    finance, and smart contracts can automatically execute instant payments immediately
    after the delivery of a product that the recipient has signed for.


    3.Cold Chain Traceability


    In most cases, the same storage and shipping needs apply to food and pharmaceutical
    products. The combination of blockchain technology with IoT sensors on various
    products can help track humidity, temperature, vibration as well as various environmental
    metrics. Since this information is stored on a blockchain with smart contracts
    applied to it, it would be easy to attend to possible changes in the readings
    especially when they are out of the recommended range. Walmart''s innovative use
    of distributed ledger technology for the food supply chain is undoubtedly a smart
    way to track provenance as well as the conditions of pork products that are being
    shipped from China.


    4.Supplier Payments


    According to American Express, digital ledger technology has the potential to
    facilitate low-cost, secure, and fast international payment processing services
    via encrypted distributed ledgers. These encrypted ledgers will offer trusted
    real-life transaction verification without requiring intermediaries like clearing
    houses and correspondent banks. An excellent example of the use of distributed
    ledger technology for supplier payment is in the coffee industry.


    There is an urgent need to reform the coffee supply chain because the entire production
    process is fragmented. For instance, the raw material is usually cultivated in
    remote and developing areas. Factors such as climate change threaten growers in
    such regions and the prices are volatile. Reports from human rights organizations
    have also disclosed that there have been several cases of abuse of laborers. Of
    course, it is not possible for blockchain technology to solve all these challenges,
    however, when it comes to the coffee supply chain, it has the potential to increase
    transparency and efficiency.


    A company known as Bext360 is tracking all aspects of the global coffee trade
    starting from the farmer to the consumer with blockchain technology. This strategy
    is meant to enhance supply chain productivity. By adopting cryptocurrencies and
    applying digital ledger technology in the supply chain, farmers receive payment
    for their products directly immediately after they sell them.


    Bext360''s use of blockchain technology is to increase productivity and also ensure
    a fairer deal for all growers. This engenders a dramatic increase in transparency,
    especially in an unfair industry. This is in addition to the ability of coffee
    lovers to conveniently verify the exact source of the coffee they drink.


    5.Food Safety


    It is often difficult to track and isolate food issues like cross-contamination.
    The reason for this is that there is a lack of appropriate data in addition to
    poor supply chain visibility. Consequently, it results in slow action anytime
    such issues come up which is even compounded by the unnecessary waste of time.
    All this leads to economic and reputational implications especially when products
    are recalled.


    Since it will take several weeks and, in some cases, months to track the source
    of contamination or identify the exact point where a particular product was contaminated,
    more people would get sick and this often leads to lost revenue and wasted food.
    Records from CDC indicate that in a 2017 salmonella outbreak, it took over two
    months to track the farm source of papayas that were contaminated. According to
    World Health Organization (WHO), one in ten individuals become ill as a result
    of contaminated food and it causes the death of about 420,000 people.


    Presently, a consortium is making use of distributed ledger technology in supply
    chain tracking to ensure transparency of every single product movement as well
    as product status. Among the companies cutting down the time required to track
    and eliminate possible sources of foodborne illness in the supply chain include
    Nestle, Unilever and Walmart.


    6.Seafood Verification


    There have been countless reports of mislabeled seafood and even though it received
    a lot of coverage back in 2016, it is still happening. It is possible to resolve
    this issue with distributed ledger technology by tracking fish and various seafood
    right from habitat to the market. Presently several companies are making efforts
    to leverage blockchain technology for this purpose. One of such efforts is the
    Pacific Tuna project that launched “The Blockchain Supply Chain Traceability Project.”


    The project tracks tuna starting from vessel to market. The goal of the project
    (which is actually focusing mainly on the Pacific Islands tuna industry) is to
    eradicate the issue of illegal fishing as well as human rights abuses.


    With blockchain''s increasing technical maturity, supply chain development will
    likely keep examining various ways to introduce blockchain into operations especially
    in areas where it makes sense the most. To transform the supply chain industry,
    more blockchain platforms that can boost efficiency and trust in all transactions
    must be developed. Undoubtedly, we are not yet there, but there are very positive
    indications that many supply chain companies are seeing past the hype associated
    with blockchain technology and are now exploring ways that blockchain can deliver
    extraordinary benefits to their businesses.


    ## Chapter 11: Blockchain Fosters Unique Approaches in The Insurance Industry


    One of the earliest records of the insurance industry was a thousand years ago.
    Records reveal that Chinese merchant seafarers pooled their wares together in
    a collective fund that they can use in offsetting damages to any member whose
    ship capsized. Despite the influence of technology on other industries, especially
    in the past decade, the insurance industry has retained its outdated systems in
    customer experience.


    The traditional insurance model that we all have known for decades has shown over
    time to be quite resilient. But as we all know; change is one thing that is bound
    to happen at some point in our lives. Traditional insurance is gradually experiencing
    the effects of emerging technologies as they alter the way people interact with
    businesses as well as different ways products and services are delivered. Blockchain
    is one of such emerging technologies.'
  fmt: '

    # 区块链在供应链与保险行业的应用


    ## 汽车行业供应链


    汽车行业是亟待转型的领域之一，专家认为其潜力巨大。Frost and Sullivan 预测，到 2025 年，区块链技术在租赁零售、智能制造和供应链物流等多个功能领域的采用率将达到
    37.2%。EY 预测区块链将应用于整个汽车市场交易中——所有权、注册、融资、保险以及服务交易。


    在汽车行业供应链方面，通过确定溯源，可以减少供应链中的假冒零件。分布式账本技术在供应链物流中的应用，解决了大多数原始设备制造商（OEM）面临的持久问题——假冒零件。追踪每个零件在供应链每个步骤的流向，确保发运的零件就是交付的零件。IBM
    指出，这一特性不仅适用于汽车行业，也适用于其他依赖零部件的行业。


    ![Image](Image00031.jpg)


    ## 供应链金融


    许多公司对区块链和供应链金融解决方案的兴趣日益增加。这是因为分布式账本技术可以提高发票处理效率，提供安全透明的交易。传统发票付款期限通常为 30 天甚至更长。数字账本技术、供应链金融和智能合约的结合，可在收件人签收产品后自动执行即时付款。


    ## 冷链溯源


    在大多数情况下，食品和药品的存储和运输需求相同。区块链技术与产品上的物联网传感器相结合，可帮助追踪湿度、温度、振动以及各种环境指标。由于这些信息存储在应用了智能合约的区块链上，当读数超出推荐范围时，便于及时处理可能的变化。Walmart
    在食品供应链中创新性地使用分布式账本技术，无疑是追踪溯源以及从中国运输的猪肉产品状况的明智之举。


    ## 供应商支付


    据 American Express 称，数字账本技术有潜力通过加密分布式账本促进低成本、安全、快速的国际支付处理服务。这些加密账本将提供可信的现实交易验证，无需清算所和代理行等中介机构。咖啡行业是利用分布式账本技术进行供应商支付的绝佳案例。


    咖啡供应链急需改革，因为整个生产过程分散碎片化。例如，原材料通常种植在偏远和发展中地区。气候变化等因素威胁着这些地区的种植者，价格波动大。人权组织报告也披露了多起虐待劳工案件。区块链技术虽无法解决所有这些挑战，但在咖啡供应链中，它有潜力提高透明度和效率。


    Bext360 公司利用区块链技术追踪全球咖啡贸易的各个方面，从农民到消费者。该策略旨在提高供应链生产力。通过采用加密货币并在供应链中应用数字账本技术，农民在售出产品后可直接立即收到款项。


    Bext360 利用区块链技术提高生产力，并确保所有种植者获得更公平的交易。这在一个不公平的行业中带来了透明度的显著提升。此外，咖啡爱好者还能方便地验证他们所饮咖啡的确切来源。


    ## 食品安全


    追踪和隔离交叉污染等食品问题往往很困难。原因在于缺乏适当的数据，加上供应链可见性差。因此，此类问题出现时行动迟缓，更因不必要的时间浪费而雪上加霜。所有这些导致经济和声誉影响，尤其是在产品召回时。


    由于追踪污染源或确定特定产品受污染的确切节点需要数周甚至数月，更多人会生病，这往往导致收入损失和食物浪费。CDC 记录显示，在 2017 年沙门氏菌爆发事件中，追踪受污染木瓜的农场来源耗时两个多月。根据世界卫生组织（WHO）数据，每
    10 人中就有 1 人因食用受污染食品而生病，每年导致约 42 万人死亡。


    目前，一个联盟正利用分布式账本技术进行供应链追踪，确保每个产品流动和产品状态的透明度。在缩短追踪和消除供应链中食源性疾病潜在来源所需时间方面，Nestle、Unilever
    和 Walmart 等公司走在前列。


    ## 海鲜验证


    关于海鲜标签错误的报道屡见不鲜，尽管 2016 年曾受到广泛关注，但此类情况仍在发生。利用分布式账本技术追踪鱼类和各种海鲜从栖息地到市场的全过程，可解决这一问题。目前多家公司正努力利用区块链技术实现这一目的。其中之一是“区块链供应链可追溯性项目”，由
    Pacific Tuna 项目发起。


    该项目追踪金枪鱼从渔船到市场的全过程。项目目标（主要聚焦于太平洋岛国金枪鱼产业）是消除非法捕捞和侵犯人权行为。


    随着区块链技术日趋成熟，供应链开发可能会持续探索将区块链引入运营的各种方式，特别是在最适用的领域。要转型供应链行业，必须开发更多能提升所有交易效率和信任的区块链平台。毫无疑问，我们尚未完全达成，但有非常积极的迹象表明，许多供应链公司已看透区块链技术的炒作，正在探索区块链为其业务带来非凡效益的途径。


    # 第 11 章：区块链在保险行业催生独特方法


    保险行业最早记录可追溯至一千年前。记录显示，中国商船船员将货物集资汇集在一起，用于抵消任何成员船只倾覆造成的损失。尽管技术在过去十年深刻影响了其他行业，但保险行业在客户体验方面仍保留着过时的系统。


    我们熟知了几十年的传统保险模式，随着时间的推移表现出相当强的韧性。但正如我们所知，变化终将在某个时刻发生。传统保险正逐渐受到新兴技术的影响，这些技术改变了人们与企业互动的方式，以及产品和服务的交付方式。区块链就是其中一项新兴技术。

    '
