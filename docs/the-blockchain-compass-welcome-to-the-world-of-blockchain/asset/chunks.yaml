- raw: 'Many of us were excited that 2020 ended with the hopes that things will get
    better in 2021. Historically, 2020 was a tough year for most of us with several
    events that were never expected as you can see in many forecasts made before 2020,
    especially regarding blockchain technology. It is interesting to note that the
    COVID-19 challenges of 2020 did not just intensify most of the blockchain trends
    that were already on course, but even created new trends. So, what are we expecting
    to see in the blockchain and cryptocurrency space in the post-pandemic future?
    This will be our focus as we gradually wrap things up. You would agree with me
    that it has been a wonderful journey as we explored various aspects of distributed
    ledger technology. So, let''s dive in!


    ### The Future of CBDCs and Stablecoins


    One of the future trends in the blockchain and cryptocurrency space is the increase
    in the number of central bank digital currencies. The COVID-19 pandemic which
    caused a global economic crisis has undoubtedly changed the way we do things.
    One aspect of our lives it impacted significantly is that of accelerating the
    movement toward the increased adoption of digital payments even as more people
    are now avoiding the use of cash due to the fears of spreading the virus. More
    retailers are increasingly adapting to this change by moving their operations
    online.


    The implication of the challenges facing the world is that it has created the
    right conditions for experimenting with new digital means of making payments.
    The truth is that the way different nations coordinate the unique and potentially
    disruptive technologies will to a great extent determine if we will leverage the
    outstanding opportunities new technologies like blockchain offer while mitigating
    the risks involved.


    Of course, central bank digital currencies (CBDC) and stablecoins are part of
    the new developments. There has been a recent increase in the number of central
    banks that are seriously exploring the use of CBDC with the Nigerian government
    revealing that by the end of 2021, they will be testing a digital currency for
    the country thereby increasing the number of countries interested in it.


    A survey carried out by the bank for International Settlements (BIS) discovered
    that over 85 percent of central banks are researching CBDC, however, the issuance
    of the digital currency in many cases has not been concluded. For instance, Singapore
    finalized its Project Ubin which was a multi-year investigation into the potential
    benefits of using CBDC for wholesale business. China has actually been at the
    forefront of countries interested in CBDC as they have for some time been carrying
    out advanced testing of their digital yuan which is meant for retail use.


    Other central banks that are actively researching CBDC include the Bank of England
    and the European Central Bank. One country that has gone ahead to fully commence
    the use of CBDC is the Bahamas and the Eastern Caribbean Monetary Union.


    On the other hand, stablecoins are not issued by monetary authorities; instead,
    they are provided by private entities. They are regarded as some kind of cryptocurrency
    that operates on the blockchain. The difference between stablecoins and cryptocurrency
    is that they are controlled by certain stabilization mechanisms that help in stabilizing
    their prices relative to various assets like other cryptocurrencies, fiat money
    or commodities.


    In simple terms, the value of stablecoins is pegged to other assets like the US
    dollars, euro, commodities such as gold and even other cryptocurrencies. Unlike
    digital currencies like bitcoin, stablecoins are less volatile and this is what
    makes them relatively more useful as means of exchange and excellent store of
    value. Good examples of stablecoins are Tether (USDT), USDC, BUSD, etc.


    So, why CBDC and stablecoins?


    Perhaps, the most significant appeal of using this new class of money is that
    they have the potential to facilitate cheaper and faster cross-border transactions.
    They can also significantly cut down on costs for consumers, enhance trade and
    boost global economic integration. One of the remarkable opportunities of public
    and private digital currencies is that they foster financial inclusion. Digital
    currencies can help lower most of the barriers facing low-income individuals as
    well as those that are hard to reach in accessing several financial services.


    To ensure the integrity of all transactions involving digital currencies, it is
    possible to design and program various features into these currencies. I must
    also point out that despite the numerous benefits of these developments, they
    still have some challenges. There is a need for digital currencies to be regulated
    and this is gradually happening even as more countries are becoming more interested
    in this sector, especially with the surge in the value of bitcoin during the pandemic.


    Experts believe that CBDCs as well as stablecoins that enjoy the backing of major
    currencies, on the macroeconomic level could actually pose financial and monetary
    stability risks, most especially for developing economies. We could see an increased
    rate of capital flight as well as volatility of exchange rates due to residents
    gaining access to CBDCs of major economies that have low inflation and strong
    economic fundamentals.


    The World Economic Forum has been involved in exploring ways to harness and make
    contributions to the global understanding and decision-making for crucial policies
    and governance issues connected to the use of digital currencies. The organization
    alongside 80 other organizations is looking at priorities and also coming up with
    solutions. Here are the major areas of focus which the consortium that was created
    in 2020 identified:


    *   There was a need for international cooperation to help overcome the issues
    connected to cross-border digital currency flows.


    *   The importance of data privacy as governments need to set up the right practices
    for owning, sharing or acquisition of account data. This is to ensure the security
    of user data while protecting privacy.


    *   There is a need for public and private sector collaboration.


    *   It is crucial to consider technical interoperability to ensure that CBDC and
    stablecoins connect to existing as well as new systems, across borders and domestically.


    ### CBDCs, Stablecoins and the Impact of Government Regulations


    We are likely going to witness a regulatory battle between central bank digital
    currencies and Stablecoins and for all dollar-backed projects to ensure their
    independence, they have a lot of work to do. There is a continued increase in
    the use of digital assets in different sectors and especially in finance. In the
    future, we will certainly enter a phase of real competition between privately-owned
    stablecoins and CBDCs.


    Experts believe that this era will be the beginning of segregation of digital
    assets mainly based on their regulatory appeal and not just by functionality.
    In the next three to five years to come, major permissionless blockchain platforms
    such as Polkadot, Ethereum, Solana and several others are going to gain momentum
    in finance. This implies that organizations such as fintech startups, insurance
    firms, banks, asset managers and different centralized organizations are going
    to offer their services to their counterparts/clients/customers on these blockchain
    infrastructures.


    So, there is going to be significant tension between private and permissioned
    platforms. Cryptography as well as distributed infrastructure has made it quite
    straightforward for anyone to embrace new decentralized platforms and abandon
    traditional financial systems without being bothered about existing regulations.
    This position is strongly confirmed by the increasing popularity of cryptocurrencies
    as internet-native financial services are becoming more popular. Most people now
    desire to carry out various transactions in a borderless environment.'
