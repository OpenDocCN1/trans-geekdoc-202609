- raw: 'Banks can leverage blockchain''s ability to manage, approve and instantaneously
    record any transaction, unlike the traditional processes that involve slow and
    manual authentication and verification processes as well as slow data sharing
    workflows most lenders are meant to depend on. Another benefit that blockchain
    technology brings to the lending industry is that of flexibility. It has opened
    the door for peer-to-peer loans as well as a variety of loan structures.


    Some Blockchain Projects in the Banking Industry


    More blockchain projects are entering the banking and lending space as DeFi has
    seen a significant increase in popularity over the years. We can look at a few
    top projects in this space and what they intend to bring into the banking sector.


    Paxos


    This project is actually the first blockchain-enabled trust leveraging DLT for
    settling assets and payments at the same time. With similar trust powers just
    like traditional banks, the token for the project (PAX) is an Ethereum-based stablecoin
    that is pegged to $1 and it enables instant settlement in digital transactions.
    There are many stablecoins in the crypto space and Paxos is among the few stablecoins
    that have received the approval of the strictest and toughest regulators – the
    New York Department of Financial Services.


    Details of a Deloitte''s study shows that on an annual basis, factors such as
    increased cyberattacks, rising costs and cost of global payment processing cost
    the finance sector billions of dollars. With decentralized ledger technology,
    it is possible to improve existing banking methods and upgrade loan offerings,
    credit monitoring, international payments and fundraising. Also, in the same study,
    banks have been encouraged to embrace amazing solutions from blockchain such as
    immutable smart contracts, dispute settlement technology and real-time finance
    tracking to have an edge over traditional banking.


    Other blockchain projects in the lending space include BlockFi, Binance, Celsius,
    CoinLoom and YOUHODLER. Some of these lending platforms do not require users to
    have a minimum amount and one good example of such projects is Celsius. Also,
    some focus mainly on offering high returns on digital currencies while other ones
    are more interested in returns on stablecoins.


    ### Decentralized Finance (Defi) and the Financial Sector


    You can see DeFi as a global financial system that was designed specifically for
    the internet age. It is simply an excellent alternative to a system that is tightly
    controlled, opaque and largely depends on old infrastructure and processes that
    are several decades old. With DeFi, you now have control as well as visibility
    over your funds as well as exposure to global markets, and excellent alternatives
    to your banking options and local currency.


    All that people need to gain access to DeFi products from any location around
    the globe is an internet connection and of course, many smartphone users can access
    the internet. Presently, several billions of dollars worth of digital currencies
    have been injected into various DeFi applications and this amount has continued
    to increase every day.


    Understanding DeFi


    DeFi is an umbrella term meant for various financial products and services. All
    the services on DeFi applications that are slow and often affected by human error
    in traditional financial institutions are now fully automated and safer. They
    are not handled by centralized institutions and humans, but by code that we all
    can scrutinize easily. The booming crypto economy allows anyone to lend, borrow
    earn interest, buy, sell, and do so many things. Many organizations are now paying
    their employees with digital currencies and many people have taken and paid out
    million-dollar loans without personal identification. This is an amazing development
    in the finance industry.


    Generally, DeFi makes use of smart contracts and digital currencies to render
    services without third parties. Financial institutions in our world act as guarantors
    of various transactions but this grants them power over your funds since your
    money always flows through them. But DeFi has successfully replaced financial
    institutions with smart contracts for every transaction that takes place. Smart
    contracts can hold users'' funds and send or refund the money under specific conditions.
    Once a smart contract is live, no party can modify the terms; instead, it will
    run strictly as it was programmed.


    Why DeFi?


    You can easily identify the potential of DeFi by looking at the problems facing
    the traditional finance industry. First, due to identification issues, some individuals
    are unable to create a bank account or make use of various financial services.
    Also, some of these financial services can hinder people from getting paid due
    to several bottlenecks. When people lack access to financial services, they may
    not really be employable. Centralized institutions and governments can also shut
    down markets at will which will affect the users. Money transfers often take several
    days as a result of various human processes.


    The presence of intermediary institutions that want to get a cut of people''s
    money adds a premium to financial services. The list of issues associated with
    traditional finance is much. So, how does DeFi perform when compared to traditional
    finance? Here is a table to properly show the difference between the two.


    ![Image](Image00042.jpg)


    #### Things you can do with DeFi


    For every financial service out there, there is a decentralized alternative to
    it. Ethereum and other smart contract platforms offer the chance for developers
    and entrepreneurs to develop unique financial products that are entirely new and
    the list of DeFi services has continued to increase.


    i. **Global money transfer services:** DeFi Makes it quite easy to send funds
    to any location. It''s as simple as sending an email from your phone or laptop
    and the recipient will get the funds within minutes.


    ii. **Stream money globally:** With platforms like the Ethereum blockchain, you
    can stream money. This feature enables you to pay your employees their wages within
    seconds and also allow them to access their funds whenever they require it. Apart
    from streaming ETH, you can also stream other stablecoins if you are concerned
    about the volatility of the cryptocurrency. Several amazing alternatives suit
    a wide range of customer needs.


    iii. **DeFi offers Stablecoins:** One of the aspects of blockchain that has drawn
    the attention of governments around the world is stablecoins. They were created
    to help cushion the effect of the volatile crypto market. The volatility of cryptocurrencies
    affects most financial products and services but the perfect DeFi solution to
    this issue is the creation of stablecoins. The value of stablecoins is often pegged
    to other valuable assets and currencies. For instance, one USDT is pegged to $1
    while the value of others like USDC or DAI remains within a few cents of a dollar.
    This also provides users the chance to earn and a good number of individuals in
    Latin America, as well as some African countries like Nigeria, are protecting
    their savings due to uncertainty in the value of fiat currencies in their countries.


    iv. **Borrowing:** Decentralized providers offer two varieties for borrowing funds:


    a. Pool-based systems or platforms where individuals who want to lend provide
    liquidity (funds) to the pool. Then people can borrow from the liquidity provided
    while those who provide liquidity earn a commission.


    b. Peer-to-peer systems where a borrower can borrow funds directly from any lender
    of their choice.'
