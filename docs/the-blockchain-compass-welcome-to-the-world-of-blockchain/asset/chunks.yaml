    development in these countries, high cost is its greatest challenge. The emergence
    of smartphones as well as the creation of new business models have provided better
    alternatives to the existing channels. But cryptocurrency as well as the underlying
    distributed ledger technology offers peer-to-peer transactions which results in
    more benefits and faster ways of sending and receiving funds from any location
    around the globe.


    ## Banking and Lending


    The industry that is highly prone to attacks is the banking industry. This is
    why many banks invest huge sums of money to secure their operations. It is possible
    to eliminate the majority of the threats facing the banks or the risks of fraud
    in all aspects of banking which can even apply to a trading platform. Other issues
    that a DLT-based banking system can resolve include administrative cost and operational
    risks since it can render the system immutable and transparent.


    Remember, one of the features of blockchain technology is traceability as well
    as a permanent historical record of every single transaction on the blockchain.
    This implies that blockchain can back up all transactions that take place in the
    bank. Generally, the core aspects of banking include mortgage, transactions, payment
    services and loans. But as we all know, most of these services are executed with
    traditional centralized systems.


    This also explains why the services are often slow and wasteful since there are
    so many intermediaries in the operations of banks. A good example is the process
    of information verification, proper credit scoring, processing of loans and the
    release of funds which could take between 30 to 60 days before someone can successfully
    secure a mortgage. In fact, for small or medium enterprises to obtain a business
    loan, it could take between 60 to 90 days. There are key aspects of the banking
    industry that DLT can help resolve and we shall explore them now.


    ### Fraud Prevention


    Among the leading challenges facing the banking industry is that of the increasing
    rate of fraud and cyber-attacks. Globally, when it comes to the costs associated
    with cybercrime, the industry with the highest average cost in 2018 was the banking
    industry. In 2017, cybercrime cost the industry about $16.7 million and this figure
    increased to $18.4 million in 2018. Find below data on identity theft and fraud
    between 2016 and 2020 from the Consumer Sentinel Network.


    ![Image](Image00041.jpg)


    * Consumers are free to report several types of identity theft.

    * Of all the identity theft cases reported in 2020, 15 percent of them included
    more than one form of identity theft

    * This data includes email, online shopping and payment account fraud, social
    media fraud, securities, insurance and medical services fraud.


    Just like other centralized systems, bank ledgers are stored in centralized servers
    and this implies that they are more prone to cyberattacks. All the vital banking
    information are stored in a single location which creates a single point of failure.
    The increasing skills of hackers and cybercriminals enable them to bypass most
    of these security systems and engage in fraud and data breaches. Of course, this
    issue is not only being experienced by the banking industry as other industries
    such as the oil and gas and even meat companies have been affected just like the
    recent one that took place in the United States.


    Blockchain offers unique solutions to the issue of fraud, thanks to its decentralized
    structure. The decentralized architecture of blockchain makes it less susceptible
    to fraud. It offers complete transparency and real-time execution of payments.
    Organizations can lower their risk as well as administrative burden, save money
    and time simply by making use of blockchain.


    ### KYC


    Just like other use cases, blockchain can also help to solve the issue of delays
    in banking transactions. One of the aspects of banking transactions that involves
    a lot of duplication of effort between banks and intermediaries is the KYC process.
    Despite the high compliance costs, banks that fail to properly adhere to the KYC
    guidelines are faced with large penalties. Data from a recent Thomas Reuters Survey
    indicates that banks spend as much as £40 million annually just to comply with
    KYC guidelines. With blockchain, it is possible to store KYC data on the blockchain
    and banks can even leverage digital identity solutions that are also emerging
    to deal with KYC compliance issues.


    SWIFT has actually created a KYC Registry and a good number of banks (about 1,125
    banks) now share KYC documentation but there is still so much to do since this
    represents just 16 percent of the 7,000 banks on their network. While there are
    some challenges with security and privacy of KYC details, if the information is
    stored on a private blockchain, then issues of privacy and security will be drastically
    reduced.


    ### How Blockchain is Disrupting Lending


    There has been a spike in the number of loans underwritten by alternative lending
    platforms. Records show that consumer lending by the fintech consumer lending
    platform, Experian has more than doubled within four years. In 2015, it grew from
    22.4 percent share of personal loan originations to 49.4 percent in 2019. The
    truth is that banks are not just the only firms losing grounds here; traditional
    finance companies and credit unions are also affected as they continuously cede
    market share too.


    The main reason for this new trend is the ability of new industry entrants to
    innovate courtesy of their smart approaches as well as the less complicated regulatory
    restrictions they encounter. These new players in the lending space are taking
    advantage of blockchain and data analytics to make their products more transparent,
    faster, more efficient and easier to access. If banks must remain relevant, then
    they need to create new ways to compete, especially as non-bank lending platforms
    are increasingly becoming popular.


    More blockchain-powered platforms are emerging while fintechs are providing more
    diverse products. Interestingly many banks are now increasing their digital capabilities
    in response to the threats from fintech and decentralized finance (DeFi) platforms.
    However, their efforts are still insufficient as banks need to aggressively lower
    their operating costs, embrace partnerships and completely overhaul their lending
    processes to reflect new technological developments.

