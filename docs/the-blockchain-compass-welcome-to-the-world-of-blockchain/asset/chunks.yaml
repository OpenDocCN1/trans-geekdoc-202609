- raw: 'Generally, distributed ledger technology has the potential to significantly
    improve or transform any industry where trust is a major challenge. From the explanations
    I have made at the beginning of this chapter, it is clear that trust is one of
    the major challenges of supply chain management since it involves transactions
    where hundreds and thousands of stakeholders attempt to execute business efficiently.
    Here are some ways blockchain technology can make a difference in this sector.


    Replacing Slow Manual Processes


    Just like I mentioned earlier, many processes involved in supply chain management,
    especially in the lower supply tiers are quite slow and usually depend mostly
    on paper. With distributed ledger technology, the process will be replaced with
    an end-to-end digital process that offers a greater level of transparency and
    visibility.


    Improves Traceability


    Estimates from the Global Brand Counterfeiting report in 2018 shows that companies
    suffered a total loss of $323 billion globally due to online counterfeiting. In
    response to the increasing consumer and regulatory request for provenance information
    which is currently driving the need for a change in the sector, blockchain technology
    has the answer. Transparency is possible with distributed ledger technology and
    that is why many companies are embracing it. One of the most popular usefulness
    of blockchain in supply chain is its track and trace style of application.


    With increased supply chain transparency, there will also be greater visibility
    across supply chain operations and this will result in improved quality, inventory
    utilization, drastic reduction in loss of revenue due to counterfeit products
    and better delivery times.


    Cuts Down Transaction Costs of Supply Chain


    Since blockchain-based digital currencies can facilitate the transfer of funds
    across borders without intermediaries such as banks, the technology can significantly
    speed up payments and at the same time cut down the incurred fees. With the introduction
    of smart contracts like Ethereum and several others, it would be possible for
    supply chain operations to automatically trigger via smart contracts. So, a smart
    contract may spell out various terms of the delivery of a given product, the agreed
    time it should be delivered, the implication of a failed or late delivery.


    Also, a smart contract can track the delivery of a product and trigger agreed
    actions automatically once the terms are breached. With this feature, various
    costs associated with third parties that were incurred during the old traditional
    system will be significantly reduced.


    Enhances the Entire Supply Chain Process


    Theoretically, blockchain technology has the potential to protect the integrity
    of every transaction and information and this results in fewer errors and disagreements.
    Since there is less need for re-filling a missed order or product recalls, the
    whole process is significantly accelerated. Also, with smart contracts, there
    will be a reduction in the need for third parties or intermediaries.


    ### Some Blockchain use Cases in Supply Chain Management


    As I earlier mentioned, blockchain technology is extremely useful in transactions
    where trust is an issue. Supply chain is undoubtedly one industry where trust
    is essential in hundreds and thousands of transactions as partners try to execute
    their businesses efficiently. Here are the major ways distributed ledger technology
    can make a significant impact in this sector.


    1\. Provenance and Enhanced Traceability


    One of the sectors in supply chain that will experience a significant “ *blockchainization*
    ” is the food supply chain, especially in the area of distributing fresh produce.
    For several years, one costly issue facing the industry is the issue of recalls.
    But the increased number of food-borne bacteria outbreaks have pushed more firms
    to explore what distributed ledger technology has to offer to increase the visibility
    and traceability of goods. More pressure is also coming from consumers who are
    increasingly demanding insights regarding goods'' authenticity, life before hitting
    the shelves and provenance.


    Of course, consumers are prepared to give out huge amounts of money as long as
    they are paying for sustainable and ethically produced goods and services. In
    fact, data from Nielsen reveals that about 45 percent of shoppers are prepared
    to pay more for high-quality products with excellent safety standards. In this
    sector, Walmart, in partnership with IBM is among the top companies exploring
    the effectiveness of blockchain-based traceability solutions that they can easily
    apply across their food supply chain.


    The system they tested enabled the tracking of incoming food supplies by retailers
    starting from the farm to the store almost in real-time. They did not just explore
    its increased visibility, but also how distributed ledger technology can be used
    for controlling and monitoring the spread of food-borne bacteria which will in
    turn drastically reduce the rate of costly recalls. A partnership between OriginTrail
    and TagItSmart focused on testing the combination of blockchain technology and
    IoT to help prevent the issue of wine fraud.


    Every hour, about 30,000 counterfeit wine bottles are being sold in China. Unfortunately,
    some of these counterfeit wines contain additives that are harmful and can result
    in terrible health issues when consumers drink them. The blockchain-based protocol
    of the company enables the monitoring of all wine bottles starting from the vineyard
    to different stores. The anti-counterfeit technology makes use of a combination
    of unique QR codes and photochromic ink to verify every bottle''s provenance and
    authenticity.


    Forbes report shows that distributed ledger technology is assisting with the verification
    of the provenance, custody and authenticity of diamonds in supply chain. Everledger
    is a blockchain solution developed for the diamond supply chain using the Hyperledger
    platform. It was designed to help eliminate fraud and illicit global diamond trading.
    Every single stone comes with what is regarded as a fingerprint and according
    to Everledger, there are about 1.6 million diamonds currently residing on the
    blockchain.


    2.Procurement


    To explain the value blockchain will add to supply chain, let''s consider the
    illustration below.


    ![Image](Image00030.jpg)


    The example shows the significant role blockchain technology will play in the
    entire supply chain. There has been an increase in the demand of consumers for
    organic foods that also have a clear origin. One way retailers can meet this demand
    is to provide consumers with several product-related data via an application.
    All that consumers have to do to validate each step the beef has taken via the
    supply chain is to scan a QR code using their smart devices. Then they can decide
    if the journey of the product is in line with their expectations. The blockchain
    database which serves as a consistent and single source of truth, provides in
    real-time, all kinds of historical data regarding the pork product. It could be
    information relating to things such as:


    *   The origin of the meat, its feed or breeding.


    *   Timing such as time in transport, aging duration, and best before date.


    *   Location of the farm as well as the meat all through the supply chain.


    *   Other information like recipes or wine suggestions.


    *   Retailers can actually drive the sales of products other than meat through
    several value-added services such as wine suggestions or several unique recipes.


    1.Automotive Supply Chain'
