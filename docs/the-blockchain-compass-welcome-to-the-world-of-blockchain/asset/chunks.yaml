- raw: 'Of course, the processes of commercial and financial markets will be redefined
    by these digitized instruments and this will lead to the creation of a new era
    where people enjoy value at every point. Here are some of the business benefits
    digital instruments offer:


    i. **Programmable capabilities:** They provide codes that handle issues of compliance,
    governance, identity (KYC/AML attributes), data privacy, and system incentives.
    They also enable features that handle stakeholder involvement (such as voting)
    to be added to the assets.


    ii. **Open the door to new products and markets:** They open the door to new products
    such as rapid transfers that are secure and scalable, tokenized micro-economies,
    fractionalized ownership of real-world assets, etc.


    iii. **Help to streamline processes:** Part of the benefits of an increased level
    of automation is an increase in operational efficiency. Other excellent benefits
    of automation include the enablement of real-time settlement, audit as well as
    reporting, a reduction in processing time and the level of error and delays associated
    with various processes. it also helps to reduce the number of steps and third
    parties needed to get the same levels of confidence in existing centralized processes.


    iv. **Fosters Data Authenticity and Scarcity:** Digitization does not only ensure
    data integrity but also enables asset provenance and provides a complete history
    of transactions all in one shared source of truth.


    v. **Market reactivity:** When compared to standardized securities, digital securities
    give room for more customization and can easily be issued in shorter timeframes.
    With digitization, we now have the resources to develop unique digital financial
    instruments perfectly designed to suit the demand of investors.


    ### Capital Market and Blockchain Technology


    The capital markets industry is witnessing an outstanding transformation in several
    areas, especially in business dynamics. This is as a result of the disruptions
    by new techs, regulations as well as modified economics of core areas of the business.
    Digitization has transformed various industries and the capital market is not
    left out as the industry has experienced dramatic changes to the prevailing mindset.
    After the 2008 crisis, many companies spent almost a decade trying to stabilize
    but it was not long before they were faced with expectations of new methods of
    business transactions courtesy of the digital revolution.


    The implication of these new expectations also translates to making changes to
    the existing norms in the industry especially with challenges such as:


    *   The cost of collateral (which is very high) after implementing regulations
    such as Basel III and Dodd-Frank.


    *   The settlement cycles - instruments such as leveraged loans can take several
    weeks to settle trades.


    *   Inefficiencies in various processes such as reconciliation.


    *   The activities of intermediaries in asset management, payments, and several
    others often result in high transaction costs.


    The emergence of blockchain technology also has several implications for the capital
    markets as they are now faced with another phase of disruptions. But it should
    be a welcome development because the adoption of distributed ledger technology
    in the capital markets will help solve some of the biggest challenges facing the
    industry. The capital markets can benefit immensely from the impact of blockchain
    technology, especially with the elimination or reduction of the roles that intermediaries
    play. Let''s examine the various use cases of Blockchain in the capital markets.


    Trade Settlements in Real-Time


    As a result of the absence of a mechanism that can carry out real-time monitoring
    of the positions of different financial instruments, trading parties will always
    experience an inherent trade default risk. Those who currently absorb these default
    risks are clearinghouses that also act as intermediaries. But the trade settlement
    cycle timelines have been extended as a result of intermediaries. A blockchain-powered
    system ensures that the moment a trade gets executed on an exchange, every crucial
    information about the trade will be passed to a smart contract and it will be
    maintained on a private or permissioned blockchain network.


    Also, the smart contract will synchronize with the ledger positions of all the
    instruments that are maintained on the blockchain. It also carries out a real-time
    check to ascertain if the traded instruments are available. Check the illustration
    below to get a clearer picture of the entire process.


    ![Image](Image00034.jpg)


    Of course, it is impossible to tamper with the rules already written on smart
    contracts. So, this guarantees transparency and trust for all trading entities
    and eventually leads to the settlement of trades in real-time.


    Things like counterparty risks (exchange risk, credit risk and several others)
    will drastically reduce due to near-real-time settlements courtesy of blockchain
    technology. Also, it will help to eliminate challenges in communication, reconciliation
    and errors associated with settlement.


    The Tri-Party Collateral Management


    To help in the management of collateral and counterparty exposure, financial institutions
    require the services of tri-party agents. What works with the present traditional
    system only enables an end-of-the-day view of collateral positions which causes
    higher collateral deposits. Eventually, the available collateral is not utilized
    optimally and this dramatically increases the cost of funding. Blockchain has
    an excellent solution to the collateral management issue.


    For the blockchain solution, the allocation logic is coded on a smart contract
    and the contract has rules that are strictly meant to help regulate mechanisms
    – Wrong Way Risk, Eligibility Check, and Concentration Limit. Due to their volatile
    nature, privacy rules such as credit support annex terms and conditions will not
    be on-chain. Instead, they will be off-chain – on a private rules engine. The
    smart contract will communicate with the long boxes as well as segregated account
    positions before completing the allocation.


    The distributed ledger serves as the platform where the allocated collateral positions
    will be maintained on a real-time basis and all stakeholders can easily view them.
    Check the illustration below to get a better picture of how it will work. The
    use of a blockchain-based solution for managing collateral will facilitate the
    release of excess collateral of every single account holder that is being managed
    by tri-party agents into circulation. This will help to increase liquidity and
    proper optimization of the collateral for all stakeholders.


    ![Image](Image00035.jpg)


    The way forward for the adoption of blockchain technology for capital markets
    firms is not a big bang type of adoption and implementation. Instead, the best
    approach for implementing blockchain use cases for capital markets firms should
    be a step-by-step strategy. The reason for this kind of approach is that the industry
    is quite complex. So, firms in this industry should begin by having a clear definition
    of the use case and the use case they adopt should strictly be based on cost-benefit
    analysis and adoption feasibility. The illustration below can serve as a blueprint
    for the adoption path for any firm in the capital markets.


    ![Image](Image00036.jpg)


    It is crucial for companies in this industry to adopt the Proof of Concept (PoC)
    approach in evaluating the various blockchain use cases. This is because blockchain
    technology is still faced with issues of scalability and integration into traditional/centralized
    systems. Hopefully, with more blockchain projects exploring ways to enable interoperability
    and increase their capacity, this should not be an issue anymore.'
