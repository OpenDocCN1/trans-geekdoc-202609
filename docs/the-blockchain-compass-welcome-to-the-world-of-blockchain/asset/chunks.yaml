- raw: 'The truth is that one of the major challenges facing blockchain technology
    is image issue. Earlier in chapter one, we saw that blockchain was popularized
    by bitcoin when Satoshi Nakamoto launched the Bitcoin whitepaper. Well, this opened
    the door to more blockchain projects and subsequently, blockchain became associated
    with cryptocurrency. We have also witnessed several scam crypto projects that
    have robbed people of their hard-earned money. Many people believe that those
    involved with cryptocurrency are fraudsters and hackers who leverage the technology
    for criminal activities.


    The negative image of the cryptocurrency space is now reflecting on blockchain
    technology and this is causing many organizations and individuals to give it a
    serious thought before adopting the technology. The general public needs to understand
    the difference between cryptocurrencies like bitcoin, ether, Litecoin, etc., and
    blockchains such as the Bitcoin blockchain, Ethereum blockchain, and several others.
    One of the reasons for this book is to further enlighten people about what blockchain
    means and its impact on our world if more individuals and companies can adopt
    it.


    Blockchain is different from crypto, in fact, cryptocurrencies are just one example
    of the application of distributed ledger technology. In the next section, we shall
    explore other use cases of blockchain in different industries around the globe.
    When more people get enlightened, we will witness a significant reduction in the
    negative perception of people about blockchain and this will, in turn, increase
    their willingness to embrace blockchain.


    It is good to know that several collaborative initiatives in the blockchain space
    by different industries are leading to positive changes in this regard and such
    initiatives and interdependence are an excellent way to move the blockchain space
    forward toward global mainstream adoption.


    Major Corporations are Scared of Blockchain''s Disruptive Nature


    Most of these organizations are the ones that are not very comfortable with the
    disruptive nature of blockchain. It has even become a kind of nightmare for some
    corporations that feel they will lose their market share or eventually become
    obsolete due to blockchain technology. Blockchain involves 80 percent change in
    business processes and 20 percent technology implementation. This translates into
    a total shift from the traditional methods of carrying out tasks. This also applies
    to most industries that have over the years witnessed a remarkable transformation
    from digital technologies.


    Remember, blockchain technology eliminates dependence on centralized authorities
    and places trust and authority in a decentralized network. The loss of control
    by powerful central institutions is quite unsettling and many would rather fight
    against such trends. Of course, we may not fully know all the industries and institutions
    that blockchain implementation will disrupt as well as the areas of businesses
    it will affect. This implies that *there is a need for an imaginative approach
    to help discover the vast opportunities that distributed ledger technology has
    to offer and how it will transform our lives.*


    Cost and Efficiency


    There is no doubt that blockchain networks execute peer-to-peer transactions efficiently
    and fast but this comes with a high aggregate cost, though this cost differs among
    various blockchains. Consider the Bitcoin blockchain which is currently making
    use of PoW consensus; the cost of running the nodes that validate transactions
    and share transactions across the public ledger is huge. Estimates reveal that
    each year, the cost of validating and sharing transactions in Bitcoin''s network
    is about $600 million and this figure keeps increasing. In fact, this estimate
    excludes the cost of purchasing specialized mining hardware.


    Apart from the cost, part of the reason why the price of bitcoin dropped is as
    a result of concerns about the impact of bitcoin mining on our environment. This
    means that any organization that desires to implement blockchain solutions needs
    to think through the process carefully before making decisions. This challenge
    is commonly known as the *“blockchain paradox.”*


    Security and Privacy


    Although blockchains like Bitcoin offer pseudonymity (because transactions on
    the network are not connected to people but wallets) several potential applications
    will prefer smart contracts and transactions that are clearly connected to people.
    This will lead to issues regarding the privacy as well as security of the data
    stored and accessed on the distributed ledger. Increasing the acceptance of blockchain
    technology would also require that stakeholders should proactively address the
    issue of privacy based on concepts of trust, security and value. Every organization
    that desires to use blockchain must take a look at various ways privacy and security
    can influence the design of the blockchain solution.


    The Vested Interest of Incumbent Groups


    The most significant hurdle that blockchain innovators will have to overcome are
    the existing regulations. This is because most of the existing regulations mainly
    favor incumbents as well as their vested interests over the newcomers – blockchain
    companies. The process of information digitization is happening under an intense
    regulatory environment. Well, this is not a strange development since the long-established
    authority of governments were established mainly to protect consumer and property
    rights.


    Regulators around the world are now facing new challenges courtesy of digital
    ledger technology as they explore ways to protect consumers and markets. Unfortunately,
    the rigid approach of regulators in most of the major economies around the globe
    toward blockchain has only managed to stifle growth and innovation in this sector.
    However, there is a gradual change in the views of regulators even as governments
    are becoming interested in what blockchain has to offer.


    The increasing number of countries that are already exploring the creation of
    central bank digital currencies (CBDCs) has increased recently with China at the
    top as they are already testing the digital Renminbi in some cities. As governments
    continue to see more benefits of blockchain technology, they will eventually establish
    a regulatory model that will support innovative ideas and projects while also
    protecting consumers. The establishment of regulations in this space will further
    improve other people''s views about blockchain technology and further increase
    adoption.


    Regulations


    Regulations have always played catch up when it comes to advances in technology
    and a good number of technologies like Bitcoin blockchain have managed to evade
    regulation while trying to resolve most of the inefficient practices and methods
    inherent in traditional systems. However, blockchain''s approach to solving issues
    reduces oversight and this was actually one of the motivating factors that led
    to its creation. Centralized systems have always served as some form of *“shock
    absorbers”* amid the problems they also face.


    On the other hand, decentralized networks may not be as resilient as centralized
    systems to shocks and this can directly affect participants if adequate care is
    not taken in the design of such solutions. This explains why many have suggested
    that blockchain applications need to function within the available regulatory
    structures rather than bypass them. This means that regulators in different industries
    must clearly understand distributed ledger technology as well as its impact on
    consumers and businesses in various sectors.


