- raw: 'People are looking at ways to invest their funds in places where they can
    get the best returns while having possession of assets from different locations
    around the globe and not the ones their local financial markets have for them.
    Governments around the world should not censor themselves out of this amazing
    and historic movement that will eventually transform the global financial structure
    and render it more efficient. This movement is inevitable just like other forms
    of progress that we have ever made like the switch from the barter system to the
    use of coins, gold-backed money and fiat currency.


    Every smart government will not hesitate to adopt DeFi as well as permissionless
    blockchains in addition to non-financial applications. This struggle is one that
    we cannot avoid just like every other remarkable change we have witnessed before.
    Most governments banning digital assets will eventually experience several pains
    before they discover that this movement is one they cannot oppose. But this fight
    may be well justified for reserve currency incumbents such as Japan, the European
    Union, the United States and of course China. It is crucial for new stablecoin
    projects to provide strong differentiation to the new CBDCs that are soon going
    to erupt.


    There is minimal human intervention when it has to do with truly decentralized
    mechanics because they are purely based on algorithms. Some key stakeholders may
    argue that it is not possible to halt the operations of an app after its deployment
    to a blockchain network such as Ethereum. Well, if governments are interested
    in hampering the development and maintenance of such apps, it is possible. Governments
    can still go after their operators, founders as well as very active community
    members.


    In fact, the well-known regulator, crypto-friendly and pro-government Brian Brooks
    had previously made straightforward comments along such lines. The impact of COVID-19
    has further increased the drive for digital versions of some fiat currencies and
    this will undoubtedly strengthen the argument that governments may desire to hamper
    the development of stablecoins to protect their CBDCs. This also means that some
    projects in countries like the US such as Maker DAO may be at risk. Of course,
    governments may not go after such projects, but they are likely going to enforce
    certain control over their team, founders as well as the decentralized community.


    What this also implies is that for a stablecoin to survive such regulatory clampdowns,
    it has to be as independent as possible from all forms of human intervention.
    Although the pseudonymity of leaders of a team is secondary, it is still very
    essential since it will help channel focus on the technology itself. We have already
    seen some interesting experiments in this direction with the emergence of governance-minimized
    approaches adopted by teams at Gambit, Lien as well as Basis Cash. Most stablecoins
    are presently pegged to the value of the global currency – the U.S dollar in different
    ways.


    As long as they are collateral or algorithmic-based, this is not critical – based
    on the fact that governments may attempt to sanction, control or even freeze assets.
    On the other hand, for assets that are backed by US dollars and a basket of global
    fiat currencies, either directly or indirectly, this means a significant level
    of vulnerability. Remember, the US Federal Reserve is in charge of all USD-denominated
    bank accounts. What happens when there is a drastic change in the value of the
    US dollars (this may take place for a short time or even in several steps in line
    with history and macroeconomic theory)?


    Of course, such assets are likely to become unstable and this explains why in
    the long run, a crypto-native stablecoin will be a better option. Presently, several
    projects like Float, Lien, Reflexer, etc., are all backed by ETH which is a decentralized
    asset. In fact, Float and Reflexer are actually leaving a strict peg to the USD
    and instead, they are working toward ensuring the stability and purchasing power
    of their tokens.


    Please take note that these musings are purely a long-term view and not what we
    may expect soon – though things may change faster than we can imagine.


    But one thing is certain; stablecoins that are backed by the US dollar remain
    the go-to source of liquidity in the blockchain and cryptocurrency space and will
    retain this position for a while. However, with the increasing tension between
    private stablecoins and CBDCs, state actors may eventually emerge to exploit the
    fiat dependencies of most of such projects. This scenario is inevitable because
    no government would sit back and watch as privately owned digital assets replace
    their national currencies. *“It would be a smart move to be prepared and participate
    in most of the emerging alternative experiments instead of just waiting to see
    what happens next.”* In terms of impact and size, this is certainly the biggest
    sector of DeFi.


    ### Blockchain Technology Can Help with Vaccine Tracking and Distribution


    Before we witnessed the COVID-19 pandemic, the general perception of governments
    and most organizations regarding the use of distributed ledger technology such
    as blockchain for vaccine traceability was that the technology was not yet matured
    enough for immediate use. However, at the initial stage people were not aware
    of the critical nature of accountability in vaccine distribution from the first
    to the last dose.


    Factors Behind the Increased Use of DLT in Vaccine Distribution


    When it comes to the distribution of goods, we have several stakeholders who are
    involved to varying degrees. This further leads to several issues in provenance,
    and authenticity, especially within several industries such as the pharmaceutical,
    wine and diamonds industries. We have earlier discussed the use of blockchain
    in supply chain management. The use of blockchain technology in vaccine distribution
    is closely related to the pharmaceutical supply chain use case which we earlier
    talked about. Governments and healthcare institutions have invested a lot of funds
    and efforts in testing, producing and distributing billions of vaccines.


    Unfortunately, the COVID-19 vaccination distribution efforts are quite complex
    and highly scrutinized. Among the things that have posed significant challenges
    is the scale and volume of the rollout of the doses. Perhaps one of the greatest
    reasons why a digital ledger is essential is the speed at which the distribution
    of these vaccines must take place around the globe. The easiest and most effective
    way to create and also access a single record of all activities for all parties
    involved is to leverage blockchain technology. This will certainly build trust
    not just in the vaccine but also in the process.


    While the first billion doses of the vaccine have been administered, we have already
    recorded thousands of counterfeit vials that authorities have seized. Predictions
    from experts point to an increase in the number of counterfeit vaccines which
    will eventually enter the supply chain. This prediction has motivated government
    officials in various locations to invest more resources toward investigating,
    managing and intercepting any fake supply.


    Blockchain in Vaccine Distribution


    Several factors have made experts to forecast that there may likely be an increase
    in the rapid adoption of blockchain technology. Some of these factors include
    the magnitude and time pressure of COVID-19 vaccine rollout along with the increasing
    cases of counterfeit vaccines that are flooding the market. Many stakeholders
    now believe that distributed ledger technologies like blockchain may be what governments
    and healthcare organizations require to prove the authenticity of vaccines which
    will restore confidence and trust in the vaccine supply chain.'
