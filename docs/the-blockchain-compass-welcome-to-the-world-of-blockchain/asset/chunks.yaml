- raw: 'Interoperability is one big challenge facing the blockchain space. There are
    over 6,500 projects making use of different blockchain platforms (most of which
    are standalone platforms) and solutions that have different coding languages,
    protocols, privacy measures and consensus mechanisms. The blockchain space is
    undoubtedly in a state of disarray due to the existence of many different networks
    and the absence of a universal standard that would permit each of these networks
    to communicate properly.


    Since there is no uniformity across various blockchain protocols, basic processes
    such as security lack consistency. This renders the mass adoption of the technology
    a very difficult one. One of the things that could help enterprises to validate
    proofs of concept, collaborate on application development and share blockchain
    solutions is the establishment of industry-wide standards for different blockchain
    protocols. It will also help in making the integration of blockchain platforms
    with existing systems an easy task. The good news is that many blockchain projects
    are already offering interoperability among various blockchain networks.


    Major Interoperability Projects


    Presently, most blockchain networks allow the creation of sidechains and as I
    mentioned before, sidechains are simply blockchains running alongside the main
    blockchain. But the number of interoperability projects in the blockchain space
    has increased recently. This is in response to the need for different blockchains
    to communicate with one another and increase the potential of the technology.
    We shall look at three examples of great interoperability projects.


    1. Polkadot


    This project is a high-profile multi-chain technology that is working toward improving
    interoperability in blockchain. Part of the core goals of Polkadot is to facilitate
    the transfer of smart contract data through different blockchain platforms. The
    project''s ecosystem has multiple “parachains” that are simply individual blockchains.
    These parachains are different in terms of their characteristics, however, they
    still belong to the Polkadot ecosystem.


    Transactions in the Polkadot blockchain are distributed over a wide area considering
    the network''s number of chains. What serves as a connector of all the parachains
    is a relay chain and the goal of the Polkadot blockchain project is to enable
    public networks, private chains as well as oracles and permissionless interfaces
    to connect seamlessly. The team behind the interoperability project wants to enable
    an internet where independent blockchain solutions can leverage Polkadot''s relay
    chain to exchange information.


    2. Cosmos Blockchain


    This blockchain interoperability project is one of the interesting ones in the
    blockchain arena and it runs on the fault tolerance protocol known as Tendermint
    Byzantine. One of the goals of the project is to be the hub of several projects.
    Its structure is made up of various independent blockchains (known as Zones) that
    are attached to a central blockchain called the “Hub.” These Zones are plugged
    into the Cosmos Network and can communicate with one another courtesy of the Cosmos
    Hub. Also, it is possible to connect new ones.


    One striking feature of the Cosmos Network interoperability project is that it
    allows zones to retain their consensus mechanism. What powers every zone, in this
    case, is the Tendermint Core which provides enhanced performance in addition to
    its secure and consistent consensus engine. Courtesy of the IBC connection, the
    Cosmos blockchain can easily connect various zones from public to private projects.


    3. Blockchain Industrial Alliance (BIA)


    There is also an increasing number of blockchain projects coming together to grant
    their blockchains the permission to communicate with one another. One excellent
    example is BIA which is an alliance formed by three blockchain projects (AION,
    WANChain, and ICON) to allow their blockchains to communicate with one another.
    The primary goal of this alliance is to deal with the issue of blockchain isolation.
    Members of the team have a common purpose of promoting interconnectivity between
    various isolated blockchains.


    Their major area of focus is on research into interchain transactions as well
    as communication. They will also focus on creating common industry standards and
    every participating blockchain in BIA is working toward connecting blockchain
    protocols.


    Before we can see the implementation of blockchain technology on a larger scale,
    major issues facing the existing blockchain platforms that we have discussed must
    be resolved. It is quite interesting to know that within a short time, blockchain
    has experienced rapid improvement in its structure and features. This is a relatively
    young technology and the launching of new projects that are attempting to proffer
    solutions to these issues is a sign that blockchain indeed has the potential to
    disrupt industries. These barriers will certainly be resolved sooner than most
    of us think.


    # SECTION II: BLOCKCHAIN USE CASES: TRENDS AND DEVELOPMENT IN BLOCKCHAIN


    This book is not one of the books that claim that blockchain can solve all our
    problems once it is fully adopted by everyone. In fact, I must point out that
    the tendency to over-promote the distributed ledger technology is affecting the
    long-term prospects of the technology negatively. The innovative deployment of
    the technology demands a proper match between the specific merits of distributed
    ledger technology and use cases that will facilitate the actualization of these
    benefits.


    It also requires a lot of dedication to hard work to achieve the right solutions
    that will be utilized by industries around the world. This entire process takes
    quite some time and cannot happen overnight. Are you among those who have been
    informed that blockchain can solve all the problems you have in your business
    or life? Well, if yes, then you should know better by now.


    Just as I promised, this section will dig deep into the different industries where
    blockchain is already being used and those that are exploring the use of the technology.
    Most use cases of blockchain are still in the imaginative stage just like some
    that are already at the implementation stage. In the coming years, some of the
    forecasts regarding the different ways companies around the world can leverage
    the technology will be achieved and new ones will emerge.


    ## Chapter 8: Transforming the Health Care Sector


    ![Image](Image00025.jpg)


    There is a significant level of pressure on the healthcare industry (public and
    private) to control their costs and also deliver high-quality service to patients.
    Amid the pressure, it is getting increasingly hard for the healthcare industry
    to keep costs down and still deliver the level of service that patients expect
    alongside the emergence of disruptive technologies. This increasing pressure is
    the reason why healthcare providers have continued to search for ways to cut costs
    and still enhance the quality of care they deliver.


    It would be extremely difficult for them to keep up with the market changes without
    leveraging the right technological advancement that is suitable for the healthcare
    industry. An excellent example of a technology that has the potential to support
    the healthcare industry is distributed ledger technology and blockchain is the
    best option. Blockchain technology has what it takes to resolve one of the biggest
    challenges the industry is facing which is patients'' data transmission without
    compromising its security and privacy. Indeed, blockchain has the potential to
    impact health management positively. Perhaps the best way to start this chapter
    is to examine its existing challenges.


    ### Existing Challenges Facing the Healthcare Sector'
