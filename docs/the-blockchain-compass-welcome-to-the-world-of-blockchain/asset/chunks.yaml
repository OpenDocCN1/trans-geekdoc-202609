    ## Chapter 17: Integration of Blockchain and Other Emerging Technologies


    “The power of blockchain is fully revealed when it is combined with other emerging
    technologies.”- Carla La Croce


    ![Image](Image00056.jpg)


    Most experts across various industries unanimously agree that blockchain technology
    is not an island. It needs other technologies to function at its full capacity.
    The truth is that most emerging technologies can alter our lifestyle in so many
    ways – how we work, what work means, businesses, the global economy, etc. This
    is not just a journey but an ongoing one that requires frequent experimentation
    and refinements. Indeed, we are at the edge of a technological revolution that
    will impact billions of internet-enabled devices and connected people courtesy
    of emerging technologies.


    Despite the COVID-19 pandemic and its impact on our economy, one thing is certain,
    innovation within the next ten years will be predominantly propelled by a combination
    of various elements of different technologies in unique ways. The cumulative value
    that we are likely going to enjoy from merging several technologies is multiplicative.
    The impact of the combination of emerging technologies (like blockchain technology,
    AI, Cloud technology, and the Internet of Things) on businesses, governments,
    and different industries is far more profound than what we can experience from
    a single technology. This section will explore some emerging technologies and
    their combinatorial effects on our lives. Are you ready?


    ### Integration of Blockchain and Internet of Things (IoT)


    Among the top new technologies that will transform the way we handle data and
    function in a digital world include the Internet of Things (IoT), Artificial Intelligence
    and of course, blockchain technology. They are all powerful technologies, on their
    own, but enterprises can actually leverage the combination of some of these technologies
    like IoT and blockchain in an incredible way. Some experts call this the Blockchain
    of Things (BIoT). Available data from a study carried out in 2018 by Aftrex Market
    Research discovered that by 2026, the combination of the IoT and blockchain market
    will reach $254.31 billion.


    Several industries and businesses such as telecommunications, healthcare, automotive,
    oil & gas and manufacturing will enjoy remarkable benefits from the combination
    of IoT and blockchain technology. The findings of the study suggest that combining
    both technologies is revolutionary and many enterprises are already getting involved.
    As the blockchain space matures, we are going to see more robust feature sets
    and numerous use case studies that will boost the confidence of organizations
    to get involved. Undoubtedly, the combination of IoT and blockchain will provide
    several benefits but I will be focusing on the most remarkable ones.


    Lower Operational Costs


    This is one of the most popular benefits that the combination holds for most enterprises
    – a reduction in operational costs. Since it enables the transmission of data
    on a peer-to-peer basis, there is no need for central control and this helps cut
    down on the cost of doing business. Decentralization offers us a less expensive
    way to deal with the scale of IoT while eradicating the issue of a single point
    of failure.


    Helps to Streamline Accounting


    One of the first departments of an organization that could immediately begin to
    enjoy the benefits of transparency offered by the combination of IoT and blockchain
    is the accounting department. Being aware of what all stakeholders are sharing
    and sending across a timestamped and linear chain is an excellent solution for
    businesses. For accounting purposes, having records that cannot be altered by
    anyone is a remarkable benefit for companies.


    Accelerated Data Change


    According to the findings made by Aftrex Market research, accelerated data changes
    is among the leading benefits of combining the two technologies. There is a need
    for a more enterprise-grade approach that could involve a permission-based blockchain
    to help deal with the number of IoT devices, the amount of data involved as well
    as the speed of transaction between all parties involved. This implies that a
    blockchain that is capable of minimizing the time required to handle transactions
    – courtesy of trusted nodes – is extremely useful to help meet the performance
    needs of IoT. The blockchain should have the capacity to handle IoT data exchange
    speed.


    Improved Security


    The IoT tech market will increasingly focus on issues of security since there
    is likely going to be more complex security issues that will arise. The complexities
    of the security challenges will emanate from the distributed and diverse nature
    of IoT technology. Already, we now have over 26 billion internet-connected devices.
    What this means is that there will be an increase in the rate of hacking as this
    number continues to rise. To stop malicious actors from performing their evil
    activities, IoT will need a structure that is different from its existing centralized
    architecture which happens to be among the greatest vulnerabilities of IoT networks.


    One of the innate features of blockchain is security and this will be very useful
    considering the increased number of devices within IoT. Combining these technologies
    could foster secure communications while strengthening privacy agreements. When
    it comes to security, it does not just involve devices; it also involves human
    to device, device to device and human to human interactions.


    ![Image](Image00057.jpg)


    Having a trusted distributed ledger that will transparently reveal those with
    access, transactions, as well as records, is a major benefit of blockchain integration
    with IoT. Most enterprises that have already implemented a combination of IoT
    and blockchain usually depend on security techniques like device authentication
    but when it comes to issues of security of IoT and blockchain, this is simply
    the beginning.


    ### Blockchain and Artificial Intelligence


    Most of us were highly fascinated when artificial intelligence appeared in sci-fi
    books or movies and we marveled at the extent of human imagination. Well, the
    speed of development of computer science is so rapid that the intelligent computers
    we all knew as fiction a few decades ago are no longer fiction. Most of them are
    now reality even as more things are being imagined. Then blockchain technology
    emerged in 2008 when Satoshi Nakamoto published Bitcoin blockchain''s whitepaper.'
