    你现在应该已经了解的一点是，NFT 与加密货币完全不同。两者唯一的主要共同点是它们都存储在数字账本——区块链上。这正是相似之处的终点。就 NFT 而言，每个代币都具有独特的价值，你无法用另一个同等价值的代币来交换它。加密货币的价值就像法币一样是统一的，这意味着牙买加的一张
    100 美元钞票，其价值与法国或英国的一张相同。你可以在世界任何地方以相同的价格交换一枚比特币。但两个 NFT 代币的价值可能不同。


    同质化资产被视为可以轻松互换其单位的物品，货币就是同质化资产的完美例子。你甚至可以用两张 50 美元纸币兑换一张 100 美元纸币，其价值保持不变。但非同质化资产的情况并非如此，根据同质化资产的定义，你可以轻松猜出其含义。非同质化资产具有独特特征，这也意味着我们无法用其他任何东西互换它们。NFT
    的示例包括：


