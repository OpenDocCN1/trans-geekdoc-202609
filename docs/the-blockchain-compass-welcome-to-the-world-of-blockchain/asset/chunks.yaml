- raw: 'Companies such as IBM are coming up with awesome implementation strategies
    that have made blockchain technology mount pressure on the insurance experience.
    A sector like the insurance industry has been in existence for centuries. however,
    it is one industry that has not experienced any significant improvements to its
    processes.


    ### Challenges Currently Facing the Insurance Industry


    ![Image](Image00032.jpg)


    Most of us are very familiar with having insurance for our lives, medical bills
    and vehicles. In fact, the insurance sector which is a multi-trillion-dollar industry
    currently covers various aspects of our lives. For instance, Bruce Springsteen
    spent $6 million to insure his voice and we now have all kinds of insurance cover
    – our pets are insurable, there is also traveler''s insurance which covers all
    costs associated with kidnapping and several others. This might paint a picture
    of an industry that is well-established and valuable and this is correct to some
    extent.


    But the truth is that the insurance industry is facing several challenges. Top
    on the list of challenges facing the industry are issues of human error, inefficiency,
    fraud and perhaps the greatest problem facing the industry is cyberattacks. There
    are several reports of data breaches caused by cyberattacks and Anthem Insurance
    was not left out as the company disclosed there was a data breach that resulted
    in the exposure of sensitive data and 78.8 million customers were affected in
    that incident. Apart from the inestimable losses as a result of identity fraud,
    it affected the entire industry.


    The Present State of Reinsurance


    In case you do not know what reinsurers do, they insure the insurers, however,
    this is often done in an arcane and highly inefficient system which is determined
    by manual processes and one-off contracts. Based on the specific kind of reinsurance
    a company purchases, it may cover some aspects of the insurer''s risk within a
    specific period and in some cases, it may just cover certain risks like natural
    disasters. Unfortunately, the existing reinsurance process is not only complex
    but highly inefficient.


    With facultative reinsurance, every single risk contained in a contract has to
    be underwritten. Now consider the fact that contracts often require about three
    months of wrangling between all the parties involved before they are eventually
    signed. This is what I mean when I said the process is notoriously inefficient.
    Generally, insurers usually hire the services of more than one reinsurer and this
    also implies that they exchange data while processing claims. There is always
    the issue of parties having different data standards and this results in different
    interpretations of ways to implement a contract.


    ### What Blockchain Technology has to Offer


    Initially, the use of blockchain technology in the corporate world was basically
    to help lower costs and the insurance industry is not left out. However, apart
    from the benefit of lowering costs for businesses, it also offers other remarkable
    benefits to the insurance industry and we shall quickly go through some of them.


    1.A blockchain-Enhanced Reinsurance


    Blockchain technology has what it takes to upend current reinsurance processes.
    It achieves this by streamlining the transfer of information between reinsurers
    and insurers on a distributed ledger (which is shared by all parties). Blockchain
    technology can enable both insurers and reinsurers to have a detailed record of
    transactions of premiums and losses on their computers simultaneously.


    Consequently, there would not be a need to reconcile books between various firms
    for every single claim. Reinsurers will be properly equipped to allocate funds
    for claims almost instantly with shared data on an immutable ledger. This will
    also enable them to not only process claims but also settle them faster without
    depending on data for each claim from primary insurers. Estimates made by PricewaterhouseCoopers
    indicate that reinsurers can enjoy up to $10 billion savings by increasing operational
    efficiencies courtesy of blockchain technology.


    The impact of these savings could eventually lead to a reduction in insurance
    premiums for consumers since reinsurance actually accounts for between 5-10 percent
    of existing insurance premiums. An excellent example of blockchain use in reinsurance
    is B3i which comprises some of the big players in the industry like Swiss Re,
    Allianz, AIG, and Aegon.


    2.KYC Costs


    One of the compulsory requirements that the public and private sector require
    while compiling documentation on stakeholders and customers is “Know Your Customer”
    (KYC). However, the process is usually time-consuming and costly but blockchain
    technology can provide an excellent solution to this issue. Every organization
    is expected to compile several documents for their customers and they have to
    achieve this without exchanging their customers'' information in the process.
    Unfortunately, most organizations are vulnerable to various problems due to the
    current centralized model being used.


    There has been a significant increase in the number of cyberattacks and during
    these attacks, millions of customers'' information are stolen. For instance here
    are some major data breaches which we have witnessed in the past:


    *   In 2014, about 500 million Yahoo accounts got hacked.


    *   145 million eBay accounts were also hacked in 2014.


    *   In 2014, about 7 million institutional customers and 76 million retail customers
    of JP Morgan were hacked.


    *   LinkedIn was not spared too as 117 LinkedIn accounts got hacked in 2012.


    All these organizations have one thing in common – they are all centralized which
    implies that they have a single source of failure. This single point of failure
    made it easy for hackers to gain access to their servers. By pooling several processes
    through an encrypted and shared database, blockchain technology actually delivers
    remarkable gains. In fact, Goldman Sachs is of the view that the banking sector
    could save from $3 billion to $5 billion annually in costs associated with KYC
    as well as anti-money laundering (AML) through coordinated and consistent use
    of blockchain technology.


    Already, a joint initiative between a company known as Z\\Yen and PwC KYC Center
    of Excellence has resulted in the creation of a blockchain-powered KYC database
    prototype. The idea of this concept is mainly to store and encrypt customer data
    while also verifying all customers carrying out various forms of documentation
    and modifications (such as cases of death, marriage, change of name, etc.). Every
    customer will be provided with an individual encryption key and they have the
    freedom to provide the key to financial institutions.


    When customers make the key available to financial institutions, it would be possible
    for the institutions to access some data and documents. So, the project enables
    organizations to identify a customer in a reliable and secure way. This also means
    that customers who want to contract insurance or open an account can do so instantly
    without the time-consuming, stressful and risky processes involved in traditional
    KYC systems. The new project will help to significantly cut costs for insurance
    companies as there would not be the need for pooling data between banks, insurers
    and brokers.


    In summary, blockchain technology can improve KYC/AML processes in the following
    ways:


    *   It can help to create a tamper-proof repository of all clients'' data and
    this data can easily be shared among organizations safely.


    *   It will help to lower the risk of error as well as duplication of effort by
    saving time, resources and through cooperation.


    *   Enhances visibility of the various activities of customers across institutions
    which will improve compliance as well as regulatory oversight.


    3\. Blockchain Technology can help to Reduce the Risk of Fraud and Theft of Insured
    Property'
