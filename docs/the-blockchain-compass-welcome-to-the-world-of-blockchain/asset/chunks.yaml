    systems is maintained in the digital ledger, data authenticity verification is
    carried out via several nodes. In the context of digital identities, this decentralization
    is extremely useful especially in the situation where national identifiers are
    often used on several agencies.


    Here is a summary of the things that users are allowed to do with Self-Sovereign
    Identity:


    *   Users can control their identities.


    *   They can easily access and update their information (in some cases, there
    may be a need for third-party verifications with some claims).


    *   They can transport their data to other organizations or jurisdictions in case
    they relocate.


    *   Erase the identity if they need to.


    *   Select the specific information they want to keep private.


    Any system that can provide these services must put certain things in place. They
    must:


    *   Ensure that identities have a long shelf life – forever is the best.


    *   Extremely powerful algorithms that will help validate users'' identities as
    well as claims.


    *   Protection of the rights of users.


    *   Ensure interoperability


    *   Data sharing is strictly based on user consent.


    ### Merits of Decentralized Identity


    Government regulations like the EU General Data Protection Regulation (EU GDPR)
    have for several years made efforts to strengthen identity standards, especially
    those that need modern identity solutions. Governments are increasingly exploring
    ways to leverage blockchain technology to provide identities to individuals who
    are yet to be identified and also protect the personally identifiable data of
    their citizens. So, in what ways can blockchain be beneficial to decentralized
    digital identity? It offers three key benefits that will help government and organizations
    achieve their goal of creating decentralized identities.


    Decentralized Public Key Infrastructure (DPKI)


    At the core of decentralized identity is DPKI and digital ledger technology enables
    DPKI simply by establishing a trusted and tamper-proof medium suitable for the
    distribution of the asymmetric verification as well as the encryption keys of
    the identity holders. With DPKI, it would be possible for anyone to create or
    anchor cryptographic keys on the distributed ledger in a manner that is tamper-proof
    and chronologically ordered. The purpose of these keys is to grant other individuals
    access to verify digital signatures or even encrypt data to any given identity
    holder.


    Initially, traditional certificate authorities were responsible for providing
    users with digital certificates. However, with distributed ledger technology,
    a centralized Certificate Authority (CA) is no longer required. Apart from being
    indispensable to decentralized identity, DPKI is also an enabler for other use
    cases – verifiable credentials (VC). When people mention the phrase verifiable
    credentials (VCs) they often talk about digital credentials that are accompanied
    by cryptographic proofs.


    Decentralized Storage


    Generally, digital identities that are stored on distributed ledgers are quite
    safer than the ones anchored on various centralized servers. When blockchains
    that are cryptographically secure such as the Ethereum blockchain are combined
    with distributed data storage systems such as OrbitDB or InterPlanetary FileSystem,
    then we can disintermediate centralized data storage systems already in existence
    and still maintain trust and data integrity.


    One of the advantages of decentralized storage solutions that are designed to
    be tamper-proof is that they significantly lower the ability of an entity to gain
    unauthorized data access just to exploit or even make money from users'' confidential
    information. Undoubtedly, one of the core aspects of secure identity data management
    is decentralized storage. Credentials in a decentralized framework are often stored
    on the devices of users like their tablets, smartphones, desktops or private identity
    stores can also store them. These private identity stores are usually known as
    identity hubs and excellent examples include 3Box or uPort''s TrustGraph.


    Identities are regarded as self-sovereign when they are mainly under the user''s
    control. What this also means is that the user is capable of controlling access
    to their data without being bothered that their access may be revoked. When a
    user''s data is under their control, then the information will be more interoperable
    and this enables a user to utilize the data on several platforms for multiple
    purposes and not limited to just a single platform.


    Manageability and Control


    The organizations providing the identity in centralized identity systems are mainly
    in charge of securing the identity data. This is not the case in a decentralized
    identity setup because it will now become the user''s responsibility to ensure
    the security of the identity data. With the decentralized identity framework,
    the user is free to implement their specific security measures and they can also
    outsource the task to an external service like a password-manager application
    or digital bank vault. Since decentralized identity solutions that are powered
    by blockchain technology compels hackers to attack individual data stores, they
    tend to be discouraged from doing so since it is quite expensive and often unprofitable.


    ### Decentralized Digital Identity and its Use Cases


    All around us, we can see several sectors or industries that will benefit immensely
    from decentralized digital identity. In fact, some of these sectors are beginning
    to use blockchain technology. Let''s take a look at some of the use cases of decentralized
    digital identity.


    eCommerce


    To prevent cases of fraud in eCommerce, you would require proper identification.
    One of the most common types of fraud issues in the eCommerce industry is that
    of fraudulent product selling. Most times, buyers are prepared to pay good money
    just to purchase authentic products. Unfortunately, they end up getting something
    entirely different from what was advertised on the eCommerce website. One of the
    reasons why this happens is as a result of the absence of appropriate protocols
    while signing up in any given eCommerce platform. There is a need for adequate
    verification to help safeguard the eCommerce sector and decentralized identity
    can serve as the right foundation for this purpose.


    Banking


    Already, banks are at the forefront in terms of sectors that are making use of
    decentralized digital identity. Of course, you would agree with me that the banking
    sector handles a lot of issues related to user identity like repetitive identity
    thefts, KYC protocols, false identifications, etc. By making use of decentralized
    digital identity, banks can enjoy an easy solution to their identity-based issues.
    With this solution, users would not have to deal with so many issues whenever
    they want to open an account. All that is required is to give the bank permission
    to access your identity and also verify your credentials.


    Government


    One of the biggest sectors for decentralized identity foundation companies is
    the government sector. Governments around the world are responsible for issuing
    their citizens with official identification documents but the entire process needs
    to be upgraded to meet current demands and standards. This is because it is often
    a slow process and one that is full of mistakes. One of the challenges of government-issued
    identification documents is that citizens lack full ownership access to their
    identity. This explains why government services need decentralized digital identity
    since it would drastically cut down on corruption, paperwork and provide adequate
    security.


