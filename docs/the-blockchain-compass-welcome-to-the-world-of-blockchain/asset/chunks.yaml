- raw: 'Those getting new information also get a notification (that is automated)
    as well as an encrypted pointer to the new medical record. The system is designed
    to grant patients access to manage their data and permissions are stored on the
    blockchain. This project has yielded positive results in areas such as vaccination
    histories, medications, therapeutic interventions and blood tests.


    6. Significant Reduction in Costs


    Health businesses and patients will enjoy a significant reduction in cost with
    the use of blockchain technology. Of course, it is only natural for costs to drop
    with increased efficiency in supply chain, elimination of counterfeit drugs and
    products, prevention of theft and other fraudulent acts. When health institutions
    utilize smart contracts, they can effectively carry out direct transactions with
    their partners and this cuts off expensive intermediaries.


    For instance, a report by BIS Research in 2018 estimated that when there is widespread
    use of blockchain technology, the healthcare industry could save as much as $100
    billion by 2025. These are costs related to operation costs, support function
    and personnel costs, IT costs, data breach-related costs, insurance frauds and
    counterfeit-related frauds.


    7. Enabling Large-Scale Cooperation


    Majority of the fundamental issues affecting the healthcare industry emanate from
    its dependence on several elements – governments, regulators, public and private
    organizations and several others just to function. Consequently, the entire sector
    is usually slow to react to conditions that are changing rapidly. A good example
    is a model used in the United States which is highly fragmented and primarily
    driven by market forces. This model is likely to create challenges for patients
    who may be changing their residence.


    Regions such as Europe also depend mainly on universal healthcare models which
    has its challenges too. The major issue (on a global scale) rests on establishing
    frictionless cooperation between various service providers as well as between
    nations and governments. This is where blockchain comes in since it can enhance
    the distribution of information across a network, promote transparency and make
    regulatory compliance procedures straightforward.


    A distributed ledger technology like blockchain can facilitate industry-wide initiatives
    such as implementing new industry standards and helping to coordinate global efforts
    toward dealing with health crises such as the COVID-19 pandemic. In fact, the
    increasing development of cross-chain systems and the increasing number of interoperability
    projects will eventually introduce unique ways for enhancing cooperation on a
    global dimension.


    The outbreak of COVID-19 revealed the state of our health institutions and it
    is a confirmation that governments and health organizations around the globe require
    a more efficient way to manage health crises of this magnitude. This also explains
    why some organizations in the healthcare sector are exploring blockchain-based
    solutions. For instance, the World Health Organization is partnering with major
    blockchain and technology companies such as Oracle, IBM, and Microsoft to launch
    MiPasa. The project is a platform on DLT designed for sharing information on the
    pandemic. As revealed by Cointelegraph, the platform runs on Hyperledger Fabric
    and is working toward enabling “early detection of carriers of COVID-19 and its
    hotspots.”


    ## Chapter 9: Blockchain & The Pharmaceutical Industry


    ![Image](Image00026.jpg)


    In the society we live in, we often question everything that comes our way. Whenever
    we buy something from the grocery store, we are usually interested in knowing
    if truly we are getting our money''s worth. This explains why you may feel bad
    when you discover that what you purchased at a grocery store was even cheaper
    online. We also desire to know where the products we purchase come from, what
    they are made of and who made them. These are some of the things we want to know
    about when making purchases.


    Interestingly, these are very crucial points in healthcare as pharmacists and
    other health workers strive to source the right medication. Unfortunately, the
    pharmaceutical supply chain has several challenges and pharmacists must supply
    or sell drugs they buy only from reputable sources. The reputable sources of the
    medicines must be the ones that adhered to the right distribution processes. Pharmacists
    must also ensure that the medicines are fit for the specific purpose they were
    produced. But sourcing products in the pharmaceutical sector is often a challenging
    task, especially where it is essential to trust the supplier enough to supply
    the right medicines.


    Also, pharmacists need to be certain that the medicines they purchased are suitable
    for the purpose they were produced and that they were properly stored and transported.
    But supply chain has become a serious issue for everyone due to the increasing
    rate of counterfeit drugs in the market in addition to incorrect labeling of medicines
    among other issues.


    The focus of healthcare is now shifting toward a more community-focused setting
    and patients are becoming increasingly responsible for taking care of their health.
    This also implies that one key factor for patients who desire transparency and
    want to be convinced that the healthcare product they are receiving is of the
    highest quality is supply chain.


    ### Present State of the Pharmaceutical Industry


    One of the most critical parts of healthcare is the pharmaceutical industry. The
    industry is estimated to be worth $482 billion and without the sector, things
    like drug development, distribution and discovery would not exist. The pharmaceutical
    industry involves three crucial processes; discovery, development and distribution.


    ![Image](Image00027.jpg)


    The present state of the industry is poor and there is a need to overhaul the
    operations of this sector. The poor state of the industry also explains why nine
    out of ten drugs fail to get to the clinical trial stage.


    World-class hospitals in the United States were already struggling with challenges
    like the shortages of basic hospital equipment. Things like face shields, gowns,
    and masks were not sufficient and efforts to get these items forced hospital staff
    to scamper in search of reliable suppliers. The sudden escalation of the situation
    compelled staff to abandon the long-established and traditional means of procuring
    the items they needed. This also implies that they needed new vendors, search
    for them and reallocate supplies as quickly as possible.


    This pressure exposed the long-festering challenges affecting the pharmaceutical
    supply chain. In the US, there were warnings from the US government, FDA and CDC
    officials regarding fraudulent respirators being distributed at the time as well
    as fraudulent COVID-19 test kits that were sold online. The government even had
    to order N95 masks at very high rates from vendors that were not verified.


    Of course, the challenges facing the medical supply chain are not uncommon or
    new and the reason is not difficult to understand. Most of these pharmaceutical
    products are moved through complex global supply chains where most of the documentations
    are still paper-based and manual. They often pile up at various points and border
    crossing which exposes these medical supplies to several quality issues. This
    has caused regulators and distributors to struggle in their efforts to identify
    standard medical supplies that enter the system.'
