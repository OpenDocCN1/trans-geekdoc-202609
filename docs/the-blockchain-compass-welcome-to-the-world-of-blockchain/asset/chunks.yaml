- raw: '*   Another excellent advantage of private blockchains is that they are more
    scalable. Just a few nodes are granted the right to validate transactions in private
    blockchains and this makes it more scalable. So, regardless of how much the network
    grows, it will continue to function with its initial efficiency and speed. The
    major determining factor here is the centralized authority that ensures faster
    decision-making.


    Are there disadvantages?


    Of course, it also comes with some demerits. They are not really decentralized
    blockchains and this is seen by many as the greatest challenge of private blockchain.
    The fact that it is not decentralized is against the philosophy of blockchain
    or distributed ledger technology. It is often challenging to achieve trust within
    the private blockchain since those who make the last call are the centralized
    nodes.


    One more challenge with private blockchain has to do with the impact of the number
    of nodes. There are just a few nodes and this lowers the level of security of
    this type of blockchain. If a specific number of nodes goes rogue or fails to
    function, this may compromise the consensus mechanism being used by the private
    blockchain network and will eventually lead to security issues.


    Use Cases


    There are numerous use cases for private blockchains and here are some of them:


    *   **Internal voting:** It is useful for internal voting in an organization.


    *   **Supply chain management:** It is possible for companies to adopt the private
    blockchain to help handle their supply chain and we shall be looking at various
    ways blockchain can transform supply chain in chapter 10.


    *   **Asset ownership:** We can also track and verify assets with a private blockchain.


    Federated/Consortium Blockchain


    The third class of blockchain technology is consortium or federated blockchain.
    This class of blockchain came into existence as a creative approach to resolving
    the needs of an organization, especially where an organization requires the combined
    features of public and private blockchain. So, while some aspects of a company
    are made public, the company can make other aspects private. Also, the consensus
    procedures of this category of blockchain are handled by the preset nodes.


    Although it is not completely accessible to the public, it still enjoys a decentralized
    structure. The reason why it still maintains a decentralized system is that many
    organizations are involved in managing a consortium blockchain. So, no single
    or centralized body can make decisions. Another feature of a consortium blockchain
    that helps to ensure proper functionality is the presence of a validator node
    that can perform two different tasks – initiate or receive transactions and also
    validate transactions.


    On the other hand, a member node can initiate and receive transactions. Now you
    can see that a consortium blockchain offers users all the unique features of a
    private blockchain such as efficiency, privacy and transparency without also placing
    control in the hands of a centralized entity. Examples of this type of blockchain
    include IBM Food Trust, Marco Polo, and Energy Web Foundation.


    Some Benefits of Consortium Blockchain


    Of course, users of this type of blockchain can enjoy the advantages that a private
    blockchain has to offer. Some of them include:


    *   They offer better scalability and are more secure.


    *   Consortium blockchains also provide excellent customizability and control
    over resources.


    *   They function properly with established governance structures.


    *   When compared to public blockchain networks, consortium networks have proven
    to be more efficient.


    On the flip side, consortium blockchain has several challenges and one of them
    has to do with its transparency. It is not as transparent as the public blockchain.
    Even though it is secure, it is possible to compromise the entire network as a
    result of the integrity issue of a member. The functionality of the entire network
    could also be influenced by regulations and censorship. Finally, when compared
    to other types of blockchains, it is less anonymous.


    Use Cases


    Examples of excellent use cases of consortium blockchain include:


    *   Research - We can use consortium blockchain in collaborative work to share
    research data and results.


    *   Another area of use is in banking and payments. For instance, it is possible
    for several financial institutions to establish a consortium and agree on the
    nodes that will validate all the transactions.


    *   One more excellent use case of the consortium blockchain is in food tracking.


    Hybrid Blockchain


    This is the last type of blockchain we shall be discussing and, in some ways,
    (since they share many things in common), this type of blockchain might appear
    like consortium blockchain but they have several differences. You can see the
    hybrid blockchain as simply a combination of the private and public blockchain.
    It is often used by organizations that are not ready to deploy a public blockchain
    or a private one but are just interested in deploying the best of the two. Two
    good examples of hybrid blockchain are XinFin''s Hybrid blockchain and Dragonchain.


    Key Advantages of Hybrid blockchain


    Among the major benefits of this blockchain include:


    *   The participants can change the rules of the network in line with their needs.


    *   It functions in a closed ecosystem which implies that everything is not made
    public.


    *   While still being connected with a public blockchain network, hybrid blockchain
    still offers privacy.


    *   This type of blockchain is protected from 51 percent attacks.


    *   When compared to a public network, it provides excellent scalability.


    Despite its numerous benefits, it still has some drawbacks and one of them is
    that it is not entirely transparent. It is often very challenging to upgrade to
    the hybrid network. Finally, participating nodes are not really incentivized for
    contributing to the maintenance of the network.


    Use Cases


    There are areas where hybrid blockchain can perform well:


    *   **Real estate:** One of the ways to use a hybrid network is for real estate
    purposes. In this instance, real estate firms can run their internal systems with
    the private feature of hybrid blockchain while the public feature will be used
    to display information to the public. Markets that are highly regulated like financial
    markets will find hybrid blockchains very useful.


    *   **Retail:** Also, retail can streamline their processes with hybrid blockchain.


    ### Which Blockchain is Ideal for you?


    There is really no straightforward answer to this question since each of them
    has unique features. However, here is a simple guide to help you make the decision.


    When to Consider Public Blockchain


    Since anyone is permitted to join the public blockchain network, and access the
    information, this type of blockchain is suitable for companies that place so much
    emphasis on transparency and trust. Organizations such as social groups or NGOs
    can enjoy the use of a public blockchain.


    However, the public nature of this network also implies that it is not suitable
    for businesses that operate in the private sector. The reason for this is obvious
    since no company would love to show their private information to the public. Also,
    the expensive nature of public blockchains makes it less attractive to companies
    that are interested in cutting cost and increasing profits. For those who desire
    to create a global cryptocurrency like bitcoin, this type of blockchain is a great
    option.


    What About Private Blockchain?'
