- raw: 'A smart contract comprises *“a set of promises”* that may either be contractual
    or non-contractual – this depends on the model of the smart contract. Also, such
    promises may comprise of rule-based operations and/or contractual terms that are
    established to execute business logic.


    The second element in the definition is “specified in digital form.” This also
    implies that a smart contract mainly operates in an electronic form consisting
    of several lines of code and the software that helps to prescribe the right conditions
    as well as outcomes. All the contractual clauses and/or functional outcomes are
    all added to the software as code.


    Also, “protocols” as used in Szabo''s definition comes in the form of an algorithm
    that establishes specific rules that govern the way all stakeholders process data
    in relation to a smart contract. It also refers to rule-based and technology-enabled
    operations that allow certain actions to be executed like the release of payment.
    One of the core components of smart contracts has to do with automated performance.


    We can also examine the definition of smart contracts provided by the International
    Financial Corporation (IFC). They defined it as, *“Self-executing software code
    that runs on a blockchain.”* In line with this definition, we shall focus mainly
    on blockchain-based smart contracts. Smart contracts have the potential to provide
    an efficient, automated and transparent way to execute several contractual processes
    when paired with distributed ledger technology, especially in keeping track of
    the performance of agreements without depending on intermediaries.


    So, based on the two definitions we have seen so far, we can conclude that smart
    contracts are simply blockchain-based computer protocols. These protocols digitally
    facilitate the control, verification and actual execution of an agreement between
    two or more parties – there is absolutely no need for intermediaries.


    ### How Smart Contracts Work


    ![Image](Image00023.jpg)


    The starting point is for the contracting parties to come to an agreement. At
    this point, all the parties involved will need to identify a corporate opportunity
    and expected results. The opportunity they identify is usually something that
    may benefit all parties involved in one way or another. Agreements, in this case,
    could include asset swaps, the transfer of rights, business processes and several
    others.


    Once the parties to the contract have identified areas of opportunity and desired
    results, the next phase involves setting the conditions of the smart contract.
    It is possible for parties involved in a smart contract to initiate it by themselves
    or it could also be initiated when specific conditions are satisfied such as natural
    disasters, financial market indices or any given event. Also, temporal conditions
    could actually initiate smart contracts on religious events, birthdays or holidays.


    The next phase involves coding the business logic and a developer can handle this
    aspect of the smart contracts if the parties are unable to do it. It involves
    a computer program that is written in a manner that ensures the automatic performance
    of the arrangement the moment the conditional parameters are satisfied. Then the
    message will pass through blockchain encryption to help verify and authenticate
    the message between all stakeholders in the smart contract. Once the developer
    has coded the smart contract, then a party that all stakeholders agree upon will
    validate the smart contract and proceed to record the agreement on a blockchain.


    The type of blockchain that hosts the smart contract will also determine the nature
    of the smart contract. Transactions in a smart contract will be visible to the
    public if it is hosted on a public/permissionless blockchain like Ethereum.


    The fourth step involves the execution and processing. In blockchain iteration,
    the smart contract will be written to a block after the nodes reach a consensus
    on the authentication and verification of the smart contract. At this point, the
    smart contract evaluates data and self-executes or expires – the terms of the
    agreement will determine the outcome. Then the network will update all nodes after
    the performance of the smart contract to reflect the new state. The record of
    the smart contract cannot be altered once it has been verified and posted to the
    blockchain network.


    The third phase of smart contracts hosted on blockchain involves the smart contract
    connecting with external data sources and this is through database services such
    as accounts at financial institutions or a data feed. The most common statements
    included in smart contracts are simple ones like *“if/when...then...”* These statements
    are then written into code on the preferred blockchain network. Once the predetermined
    conditions are met and verified, then a network of nodes will execute the actions.


    Examples of the actions include registering a car, the release of funds to the
    right individual, issuing a ticket or even sending a specific notification. Once
    the nodes execute the actions, then this information will be updated on the blockchain
    to show that it is completed. Several stipulations may exist within a smart contract
    as long as they are required to convince the participants of the successful completion
    of the task.


    In the course of establishing the terms, all parties need to ascertain how their
    data and transactions are represented on their chosen blockchain platform. They
    need to also agree on the *"if/when...then..."* rules that will govern all their
    transactions. One more important factor that the parties to the contract need
    to agree on are all possible exceptions and in the event that disputes arise,
    they must agree on the appropriate guidelines for dispute resolution.


    Apart from developers who can help in programming the smart contract, more options
    are emerging with the development of the sector. For instance, more firms using
    blockchain for business have now developed templates, nice web interfaces as well
    as other online tools that can help to simplify and structure smart contracts.


    ### Efficiencies and Benefits of Smart Contracts


    The number of benefits of smart contracts may eventually increase in the future
    even as the technology continues to improve. Smart contracts offer several benefits
    over traditional arrangements such as:


    *   **Increased accuracy:** One of the prerequisites of smart contracts is to
    explicitly record all terms and conditions of the contract in detail. A single
    omission could lead to transaction errors and that is why automated contracts
    help to prevent the demerits of filling forms manually.


    *   **Clear communication:** Everything is explicit because of the need for accuracy
    in stating the terms of the contract. This eliminates the possibility of miscommunication
    or misinterpretation. So, parties to a contract can lower the rate of inefficiency
    as a result of communication gaps.


    *   **Speed:** Unlike traditional contracts that involve paperwork, smart contracts
    run on software code and this takes place live on the internet. This also means
    that we can quickly and easily execute them. The speed of execution of smart contracts
    helps to reduce the number of hours that are wasted by traditional business processes.
    *With smart contracts, manual processing of documents is not necessary because
    things are done digitally* . As a result of the increased speed of execution of
    smart contracts, businesses will operate with more efficiency. Higher efficiency
    will further lead to more value-generating transactions that will be processed
    per unit of time.'
