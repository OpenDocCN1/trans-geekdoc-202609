- raw: 'With the adoption of blockchain technology in the insurance industry, new
    lines of insurance will either be created or expanded and it would be easier to
    reach emerging markets. Presently about 40 percent of the global population lacks
    a bank account as well as insurance, especially in South America, Africa, and
    Asia.


    One of the things blockchain technology will do is to open the door to a great
    variety of products and services in the insurance industry. It will enable insurers
    to create personalized products and services more quickly to boost their insurance
    offer. In travel insurance, one of the most common trends is offering insurance
    payouts in real-time in case of a covered claim. For example, this value proposition
    was actually provided by Berkshire Hathaway Travel Protection.


    This kind of positioning implies that before an insurer can get information from
    airline companies (such as flight delays as well as cancellation of flights) they
    must connect their systems to that of airline firms and recognize the customers
    in the airline''s database that were affected by the specific flight. Once this
    happens, then it would proactively open a claim that entitles the customer to
    receive prompt payout. Blockchain technology will ensure that this value proposition
    is well managed in a completely automated way and cut down on costs.


    An excellent example of a blockchain project that has positioned itself in this
    field is InsurETH. The project is a product of a hackathon that was launched back
    in 2015 and leverages the Ethereum smart contracts. In this project, the combination
    of data from claims, contracts as well as customer documents will enable the blockchain
    to facilitate the quick development of personalized insurance.


    When it comes to the growth of the insurance industry in emerging markets, blockchain
    will certainly play a significant role. One of the things the technology will
    do is to enable organizations to reach new geographical markets in developing
    regions like Africa and Asia. New and unique insurance products can now reach
    most of the developing regions courtesy of the low incremental costs associated
    with smart contracts.


    Insurance penetration in most countries in Africa is quite low, however, there
    has been a significant increase in the growth of the mobile telephony market in
    the past few years. In sub-Saharan Africa, about 70 percent of the people own
    a mobile phone which has resulted in an explosive growth in mobile-based payments
    through telecom operators. These telecom operators are fast taking over a large
    chunk of the roles of financial institutions like banks. A popular example of
    this development is the M-Pesa project that was launched back in 2007 in Kenya.


    Over 20 million users are already using the payment system that is mobile phone-based
    and on a daily basis, over $19.7 million have been transferred via the network.
    This serves as an excellent opportunity for the insurance industry as they can
    take advantage of the boom in new technologies to create outstanding products
    in Africa. With blockchain technology, they can simplify the process of information
    gathering and underwriting since there would not be a need for individuals having
    an account to present their bank details or an ID. It is possible to set up a
    smart contract for a blockchain linked to the mobile data of a customer and this
    will instantly trigger an automatic settlement process once the insured event
    happens.


    It is obvious that InsurTechs are taking advantage of opportunities created by
    distributed ledger technology like some of the examples I earlier shared. In fact,
    records from a PwC study that focused on ways InsurTech is changing the insurance
    sector reveals that competition from InsurTechs actually bothers about 90 percent
    of insurance firms. As explained by PwC Global Insurance Leader, Stephen O''Hearn:


    “There is a risk of missing an opportunity to deliver customers a similar experience
    to one they already receive from retail and technology companies. InsurTech will
    be a game-changer for those who choose to embrace it. Insurers have unrivaled
    access to consumer data and using cutting-edge technology to thoroughly analyze
    it could result in significant benefits for the company.”


    Incumbents in the insurance industry are trying to beat this competitive threat
    by setting up partnerships. For instance, Allianz France has already invested
    their funds in a project called “SmartAngels.” The project is a crowdfunding specialist
    that maintains records of securities issued by organizations raising funds on
    the platform courtesy of blockchain technology. AXA is not left out as they have
    also come out with a €100 million InsurTech incubator known as Kamet. Undoubtedly,
    the new competitive landscape that will be developed from the use of blockchains
    should be considered and there is a need to rethink governance structures in the
    insurance sector.


    Indeed, blockchain has shown tremendous promise in transforming the insurance
    industry in various ways. However, it is also crucial to point out that it is
    still in its infancy. Presently there are so many things to discover about what
    we can do with blockchain, but this is exactly what many start-ups are doing even
    as they are coming out with several ways to leverage blockchain in dealing with
    the challenges of the insurance industry.


    More incumbents in the industry are already making efforts not to be left out
    of the race to stay up-to-date with the latest trends and offerings in the sector.
    One thing is certain, a blockchain-based Peer-to-peer insurance system has the
    potential to create an autonomous and self-regulated business model. There would
    be no controlling authority and this will foster transparency in the industry.


    ## Chapter 12: The Major Impact of Blockchain’s Digitization of Financial Instruments
    on Finance


    ![Image](Image00033.jpg)


    Perhaps the industry that has witnessed the greatest impact of blockchain technology
    is the finance industry. There are several forecasts regarding the impact of blockchain
    on the finance industry but one that I like the most is the one provided by Jupiter
    Research. According to the report, by the end of 2030, banks will enjoy savings
    on cross-border settlement transactions estimated to be about $27 billion courtesy
    of blockchain deployment.


    The deployment of blockchain within this period will also enable banks to cut
    down more than 11 percent of their costs. This is quite significant and this chapter
    will explore various ways distributed ledger technology will transform the financial
    sector and its quality of service. Over the years, the Ethereum blockchain has
    successfully demonstrated disruptive economics which has led to more than ten
    times cost benefits compared to existing technologies.


    Presently, big players in the financial industry have acknowledged that blockchain
    has what it takes to save banks and other financial institutions billions of dollars
    in the next decade. Distributed ledger technology eliminates a single point of
    failure which ends up diminishing the need for their parties like messaging system
    operators, transfer agents and several inefficient monopolistic services. The
    execution of smart contracts in some blockchain platforms like Hyperledger, Ethereum
    and several others enhances trust and efficiency in the financial sector. So,
    in what ways are financial institutions affected by the digitization of financial
    instruments?


    ### Financial Instruments Digitization and Its Impact on Finance


    When it comes to the digitization of financial instruments, we are talking about
    smart contracts, programmable money and digital assets and this even increases
    the benefits of blockchain technology by establishing outstanding levels of programmability
    and connectivity between assets, products, services and holdings.'
  fmt: '

    # 区块链技术在保险行业的应用与金融工具数字化的影响


    随着区块链技术在保险行业的采用，新的保险业务线将被创建或扩展，且更容易触达新兴市场。目前，全球约 40% 的人口缺乏银行账户和保险，尤其是在南美、非洲和亚洲。


    区块链技术将为保险行业打开各种产品和服务的大门。它将使保险公司能够更快地创建个性化产品和服务，以增强其保险供给。在旅游保险中，最常见的趋势之一是在发生承保理赔时提供实时赔付。例如，这一价值主张实际上由
    `Berkshire Hathaway Travel Protection` 提供。


    这种定位意味着，保险公司在从航空公司获取信息（如航班延误和取消）之前，必须将其系统与航空公司的系统连接，并识别航空公司数据库中受特定航班影响的客户。一旦发生这种情况，就会主动开启理赔，使客户有权获得及时赔付。区块链技术将确保这一价值主张以完全自动化的方式得到良好管理，并降低成本。


    在该领域定位的一个优秀区块链项目示例是 `InsurETH`。该项目是 2015 年发起的一场黑客马拉松的产物，利用 `Ethereum` 智能合约。在该项目中，理赔数据、合同以及客户文件的结合将使区块链能够促进个性化保险的快速开发。


    在新兴市场保险行业的增长方面，区块链无疑将发挥重要作用。该技术将做的一件事是使组织能够触达非洲和亚洲等发展中地区的新地理市场。得益于智能合约相关的低增量成本，新的独特保险产品现在可以触达大多数发展中地区。


    非洲大多数国家的保险渗透率相当低，然而，过去几年移动电话市场的增长显著。在撒哈拉以南非洲，约 70% 的人拥有手机，这导致通过电信运营商的移动支付呈爆发式增长。这些电信运营商正迅速接管银行等金融机构的大量角色。这一发展的一个流行例子是
    2007 年在肯尼亚推出的 `M-Pesa` 项目。


    已有超过 2000 万用户使用该基于手机的支付系统，每天通过该网络转账超过 1970 万美元。这为保险行业提供了绝佳机会，他们可以利用新技术的繁荣在非洲创造卓越产品。借助区块链技术，他们可以简化信息收集和承保流程，因为个人无需提供银行详细信息或身份证件即可拥有账户。可以为链接到客户移动数据的区块链设置智能合约，一旦发生保险事故，这将立即触发自动结算流程。


    显而易见，`InsurTechs` 正在利用分布式账本技术创造的机会，正如我之前分享的一些例子。事实上，`PwC` 一项专注于 `InsurTech` 如何改变保险行业的研究记录显示，来自
    `InsurTechs` 的竞争让约 90% 的保险公司感到担忧。正如 `PwC` 全球保险主管 `Stephen O''Hearn` 所解释的：


    > “错失良机的风险在于，无法为客户提供他们已从零售和科技公司获得的类似体验。`InsurTech` 将成为选择拥抱它的人的游戏规则改变者。保险公司拥有无与伦比的消费者数据访问权，利用尖端技术彻底分析这些数据，可能会给公司带来显著收益。”


    保险行业的现有企业正试图通过建立合作伙伴关系来应对这一竞争威胁。例如，`Allianz France` 已投资一个名为 `SmartAngels` 的项目。该项目是众筹专家，利用区块链技术维护组织在平台上融资发行的证券记录。`AXA`
    也不甘示弱，他们推出了一个名为 `Kamet` 的 1 亿欧元 `InsurTech` 孵化器。毫无疑问，由区块链使用发展而来的新竞争格局应予以考虑，保险业需要重新思考治理结构。


    确实，区块链在以多种方式变革保险行业方面展现了巨大潜力。然而，关键在于指出它仍处于起步阶段。目前关于我们可以用区块链做什么，还有很多东西有待发现，但这正是许多初创公司正在做的，它们正在推出多种利用区块链应对保险行业挑战的方法。


    行业内更多现有企业已经在努力不掉队，以跟上该领域的最新趋势和产品。有一点是确定的，基于区块链的点对点保险系统有潜力创建一个自主和自我监管的商业模式。将没有控制机构，这将促进行业的透明度。


    ## 第 12 章：区块链金融工具数字化对金融的重大影响


    ![Image](Image00033.jpg)


    也许见证区块链技术影响最大的行业是金融行业。关于区块链对金融行业影响有多种预测，但我最喜欢的是 `Jupiter Research` 提供的预测。根据报告，到
    2030 年底，银行将因部署区块链而在跨境结算交易上节省约 270 亿美元。


    在此期间部署区块链还将使银行削减 11% 以上的成本。这非常显著，本章将探讨分布式账本技术将如何以多种方式变革金融部门及其服务质量。多年来，`Ethereum`
    区块链成功展示了颠覆性经济学，与现有技术相比带来了 10 倍以上的成本效益。


    目前，金融行业的大玩家已承认，区块链具备在未来十年为银行和其他金融机构节省数十亿美元的能力。分布式账本技术消除了单点故障，从而减少了对消息系统运营商、过户代理和其他几种低效垄断服务等第三方的需求。在
    `Hyperledger`、`Ethereum` 等一些区块链平台上执行智能合约增强了金融部门的信任和效率。那么，金融工具数字化以何种方式影响金融机构？


    ### 金融工具数字化及其对金融的影响


    当谈到金融工具数字化时，我们指的是智能合约、可编程货币和数字资产，这甚至通过在资产、产品、服务和持仓之间建立卓越的可编程性和连通性水平，增加了区块链技术的收益。

    '
  trans: '


    # 区块链技术在保险行业的应用与金融工具数字化的影响


    随着区块链技术在保险行业的采用，新的保险业务线将被创建或扩展，且更容易触达新兴市场。目前，全球约 40% 的人口缺乏银行账户和保险，尤其是在南美、非洲和亚洲。


    区块链技术将为保险行业打开各种产品和服务的大门。它将使保险公司能够更快地创建个性化产品和服务，以增强其保险供给。在旅游保险中，最常见的趋势之一是在发生承保理赔时提供实时赔付。例如，这一价值主张实际上由
    `Berkshire Hathaway Travel Protection` 提供。


    这种定位意味着，保险公司在从航空公司获取信息（如航班延误和取消）之前，必须将其系统与航空公司的系统连接，并识别航空公司数据库中受特定航班影响的客户。一旦发生这种情况，就会主动开启理赔，使客户有权获得及时赔付。区块链技术将确保这一价值主张以完全自动化的方式得到良好管理，并降低成本。


    在该领域定位的一个优秀区块链项目示例是 `InsurETH`。该项目是 2015 年发起的一场黑客马拉松的产物，利用 `Ethereum` 智能合约。在该项目中，理赔数据、合同以及客户文件的结合将使区块链能够促进个性化保险的快速开发。


    在新兴市场保险行业的增长方面，区块链无疑将发挥重要作用。该技术将做的一件事是使组织能够触达非洲和亚洲等发展中地区的新地理市场。得益于智能合约相关的低增量成本，新的独特保险产品现在可以触达大多数发展中地区。


    非洲大多数国家的保险渗透率相当低，然而，过去几年移动电话市场的增长显著。在撒哈拉以南非洲，约 70% 的人拥有手机，这导致通过电信运营商的移动支付呈爆发式增长。这些电信运营商正迅速接管银行等金融机构的大量角色。这一发展的一个流行例子是
    2007 年在肯尼亚推出的 `M-Pesa` 项目。


    已有超过 2000 万用户使用该基于手机的支付系统，每天通过该网络转账超过 1970 万美元。这为保险行业提供了绝佳机会，他们可以利用新技术的繁荣在非洲创造卓越产品。借助区块链技术，他们可以简化信息收集和承保流程，因为个人无需提供银行详细信息或身份证件即可拥有账户。可以为链接到客户移动数据的区块链设置智能合约，一旦发生保险事故，这将立即触发自动结算流程。


    显而易见，`InsurTechs` 正在利用分布式账本技术创造的机会，正如我之前分享的一些例子。事实上，`PwC` 一项专注于 `InsurTech` 如何改变保险行业的研究记录显示，来自
    `InsurTechs` 的竞争让约 90% 的保险公司感到担忧。正如 `PwC` 全球保险主管 `Stephen O''Hearn` 所解释的：


    > “错失良机的风险在于，无法为客户提供他们已从零售和科技公司获得的类似体验。`InsurTech` 将成为选择拥抱它的人的游戏规则改变者。保险公司拥有无与伦比的消费者数据访问权，利用尖端技术彻底分析这些数据，可能会给公司带来显著收益。”


    保险行业的现有企业正试图通过建立合作伙伴关系来应对这一竞争威胁。例如，`Allianz France` 已投资一个名为 `SmartAngels` 的项目。该项目是众筹专家，利用区块链技术维护组织在平台上融资发行的证券记录。`AXA`
    也不甘示弱，他们推出了一个名为 `Kamet` 的 1 亿欧元 `InsurTech` 孵化器。毫无疑问，由区块链使用发展而来的新竞争格局应予以考虑，保险业需要重新思考治理结构。


    确实，区块链在以多种方式变革保险行业方面展现了巨大潜力。然而，关键在于指出它仍处于起步阶段。目前关于我们可以用区块链做什么，还有很多东西有待发现，但这正是许多初创公司正在做的，它们正在推出多种利用区块链应对保险行业挑战的方法。


    行业内更多现有企业已经在努力不掉队，以跟上该领域的最新趋势和产品。有一点是确定的，基于区块链的点对点保险系统有潜力创建一个自主和自我监管的商业模式。将没有控制机构，这将促进行业的透明度。


    ## 第 12 章：区块链金融工具数字化对金融的重大影响


    ![Image](img/Image00033.jpg)


    也许见证区块链技术影响最大的行业是金融行业。关于区块链对金融行业影响有多种预测，但我最喜欢的是 `Jupiter Research` 提供的预测。根据报告，到
    2030 年底，银行将因部署区块链而在跨境结算交易上节省约 270 亿美元。


    在此期间部署区块链还将使银行削减 11% 以上的成本。这非常显著，本章将探讨分布式账本技术将如何以多种方式变革金融部门及其服务质量。多年来，`Ethereum`
    区块链成功展示了颠覆性经济学，与现有技术相比带来了 10 倍以上的成本效益。


    目前，金融行业的大玩家已承认，区块链具备在未来十年为银行和其他金融机构节省数十亿美元的能力。分布式账本技术消除了单点故障，从而减少了对消息系统运营商、过户代理和其他几种低效垄断服务等第三方的需求。在
    `Hyperledger`、`Ethereum` 等一些区块链平台上执行智能合约增强了金融部门的信任和效率。那么，金融工具数字化以何种方式影响金融机构？


    ### 金融工具数字化及其对金融的影响


    当谈到金融工具数字化时，我们指的是智能合约、可编程货币和数字资产，这甚至通过在资产、产品、服务和持仓之间建立卓越的可编程性和连通性水平，增加了区块链技术的收益。


    '
