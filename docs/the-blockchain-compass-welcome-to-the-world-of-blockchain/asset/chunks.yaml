    focused on cross-border payment solutions that are designed to replace existing
    banking systems. The project is providing fast transactions with lower fees by
    establishing an interoperability layer between several payment solutions. Malaysia
    is among the top five countries of remittance flows into Bangladesh and in South
    Asia – Bangladesh receives the third-largest inflows from Malaysia.


    Ripple is involved in a deal with Bangladesh’s bKash and Malaysia''s Mobile money
    to establish a wallet-to-wallet remittance channel for the two countries. The
    new channel will utilize the DLT-based global payments network of RippleNet to
    facilitate wallet-to-wallet transactions between bKash and Mobile Money. Bangladesh’s
    local banking partner that will execute the remittance settlement is Mutual trust
    Bank.'
