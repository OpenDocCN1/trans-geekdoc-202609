    # Blockchain in Capital Markets and Asset Management


    ## Capital Markets Adoption


    One of the largest financial exchanges in the world is the Australian Securities
    Exchange (ASX) and it is actually ranked 16th in the world. Interestingly, the
    exchange is working toward adopting a distributed ledger technology-based alternative
    to replace its current CHESS clearing and settlement system. They have developed
    the system in collaboration with a blockchain consultancy known as Digital Asset
    Holdings. Bear in mind that ASX has a stake in the company.


    Presently, ASX has scheduled an Industry Test Environment (ITE) to support adequate
    industry-wide testing before the platform will go live. Another effort to leverage
    the benefits of blockchain for the capital markets is a project that is even bigger
    than the first one. It is a partnership that will lead to the movement of the
    $11 trillion Trade Information Warehouse of the Depository Trust and Clearing
    Corporation (DTCC) to Axoni''s Axcore blockchain – a New York startup.


    The largest financial infrastructure in the world is owned by DTCC. The company
    handles securities transactions worth about $1.6 quadrillion each year. Also,
    the Trade Information Warehouse of the company services almost all global derivatives
    dealers around the world in addition to about 2,500 buy-side firms. The seriousness
    of DTCC in championing the integration of blockchain into capital markets is a
    strong indication that the industry is departing from its traditional systems
    that has been in use for decades.


    Here is a summary of what blockchain will do when the capital markets adopt the
    technology:


    *   It will help eradicate the single point of failure courtesy of its decentralized
    structure.

    *   With the digitization of workflows and processes, there will be a significant
    reduction in operational risks of human error, counterparty risk and risks of
    fraud.

    *   It will foster the streamlining process of the activities of the capital markets
    and this will help to decrease settlement times and costs.


    ## Blockchain and Asset Management


    ![Image](Image00037.jpg)


    We have discussed how blockchain has disrupted several industries and several
    ways it can transform the way we do things. Distributed ledger technology has
    already transformed the way customers purchase various goods and services online
    and offline. Also, fundraising for companies has been disrupted by blockchain
    with the emergence of ICO. But one area that the technology can significantly
    disrupt is the way we manage our funds – asset management. Firms that adopt distributed
    ledger technology will enjoy amazing rewards because blockchain can transform
    the asset management value chain.


    Despite the fact that the technology is still new, it has what it takes to transform
    and extend the business value chains of asset management businesses. Another reason
    why asset management firms need to take blockchain seriously is that we are still
    in the early stages of the development of distributed ledger technology and this
    signals opportunity.


    Instead of providing clients with mere products, asset managers can manage data
    and offer their clients long-term solutions courtesy of blockchain. There are
    various ways the technology can assist managers in increasing their revenues while
    cutting costs. With blockchain technology, there will not be a need for intermediaries
    to assist with processing, verifying and safeguarding financial assets.


    ### 1. Compliance with KYC/AML Regulations


    It is the duty of every financial institution to carry out proper checks on the
    information of their clients and understand the purpose of their business transactions.
    With digital identification that is stored on a distributed ledger, companies
    can automate the process of creating and verifying new accounts. It can also facilitate
    speedy compliance verification and make the process of monitoring transactions
    easy and efficient via the distributed ledger. However, one of the challenges
    assets management firms may face has to do with the cost of upgrading their centralized
    infrastructure.


    During the process of client onboarding (preparing a client to make use of any
    given platform as well as products), several steps must be taken. The first thing
    is to confirm that clients are exactly who they claim to be. Unfortunately, it
    is becoming more difficult to efficiently verify people''s identity, especially
    with the increasing cases of data breaches, malware attacks and hacking. However,
    distributed ledger technology can significantly reduce or eradicate most of these
    issues. In fact, blockchain''s major application for asset management firms has
    to do with identity management and data security.


    ### 2. Distribution of Funds


    When it comes to allocating capital gains as well as income from funds to investors,
    distributed ledger technology can also help in several ways. There will no longer
    be a need to distribute and transfer agent functions since transactions can now
    be recorded on the blockchain. Also, it would be possible to implement fund characteristics
    as well as terms of execution into a smart contract. This will significantly improve
    the efficiency and speed of the distribution process.


    ### 3. Smart Contracts


    Clients can start placing orders after the confirmation of their identity and
    their account has been properly set up. Blockchain can actually receive transaction
    requests and then activate a smart contract with the specific terms and conditions
    of the transactions. Then it will also automate the processes of approval and
    clearing calculations. Once a client''s request satisfies all the stipulated conditions
    in the smart contract, then the blockchain will transmit documentation securely
    and even secure funding for the new investment position via payment channels that
    are automated. All this will be executed within a few minutes, unlike the traditional
    system that takes asset managers several hours and, in some cases, days to complete.


    ### 4. Foster Operational Efficiency


    In an industry where many companies invest hundreds of millions just to lower
    the execution time for trades from milliseconds to microseconds, one factor that
    is extremely important is data transmission speed. Faster data transmission times
    does not just mean reducing the time required for processing orders, it also means
    several other things. It means managers (this could be artificial intelligence
    and human beings) will be informed of breaking news that may affect the portfolio
    of their clients and can help them in dealing with challenges as they arise.


    Several factors like the emergence of fintech mobile apps, online platforms that
    offer zero-commission securities trading and also the increased adoption of mobile
    payments, will increasingly expose the capital markets and eventually attract
    millions of investors from around the world to asset management. If asset management
    firms must handle the increased volume as well as the complex nature of requests
    and orders, then data transmission speed must be increased.


    ### 5. Regulatory Compliance


    In terms of management reporting, investor communication and regulatory compliance;
    the secure, transparent and meticulous way that distributed ledger technology
    compiles transaction data will be extremely useful. Of course, asset managers
    are aware of the benefits offered by blockchain in streamlining and automating
    reporting and monitoring functions. In their quest to properly comply with information
    security rules, anti-money laundering regulations as well as privacy laws, they
    can significantly lower cost, enhance productivity and cut down on their risk
    of fraudulent activities and errors simply by leveraging blockchain technology
    instead of depending on people.


    ### 6. Asset Tokenization

