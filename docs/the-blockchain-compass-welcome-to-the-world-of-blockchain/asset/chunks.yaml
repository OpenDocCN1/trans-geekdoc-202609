- raw: 'We all are aware of the nature of traditional banking systems that are very
    slow. In some cases, processing of transactions should require days after finalizing
    all settlements. Also, it is very easy to corrupt traditional banking systems.
    This is where blockchain comes in as it ensures faster settlement and a significant
    improvement to traditional banking systems. With this, users can easily transfer
    funds relatively faster and at the end of the day saves a lot of time.


    This is one of the features that make blockchain an excellent solution for foreign
    workers who reside and work in another country while their families live in their
    home country. It often requires so much time for their fund to get to their families
    especially when it is needed desperately. With blockchain, it is extremely fast
    to send loved ones funds and with smart contracts, settlements of all forms can
    take place faster than traditional systems. We will take a deeper look at how
    blockchain technology can impact the financial sector in chapter 12.


    Blockchain cuts Cost


    In a bid to manage existing systems, businesses spend so much money and that is
    also one of the major reasons why they are increasingly searching for ways to
    spend their funds not just on the management of their businesses but also on unique
    ways to improve the processes of their systems. Blockchain has the potential to
    cut the cost of business since third-party vendors form a major avenue for added
    costs to businesses. There is practically no need for vendor costs since blockchain
    does not require centralized players. Furthermore, when validating transactions,
    less interaction is needed and this even eliminates the need to spend more funds
    in executing the most basic tasks.


    ### Disadvantages of Blockchain


    The hype surrounding the benefits of blockchain might lead many to believe that
    it does not have any disadvantages, but that is not true. Just like every other
    thing on earth, blockchain also has some disadvantages.


    51 Percent Attacks


    One of them is the 51 percent attacks. Of course, over the past decade, the proof
    of work consensus has successfully protected Bitcoin blockchain from hacks. But
    blockchains are susceptible to a few potential attacks that can affect their operations
    and one of such attacks is 51 percent attacks. A 51 percent attack takes place
    when a person or group of persons manage to have more than 51 percent of the hashing
    power of any given blockchain network. This would end up giving them the power
    to influence the network in any way they desire by intentionally modifying or
    excluding the ordering transactions.


    The Bitcoin blockchain has not suffered a successful 51 percent attack even though
    it is theoretically possible. This is because it will always become increasingly
    difficult for miners to spend their funds in attempting to attack the Bitcoin
    blockchain since they are still receiving rewards for their honest dealings in
    the network. But you should bear in mind that if a 51 percent attack is successful,
    those behind the attack can make changes to the most recent transactions – this
    will be for a limited time since all blocks are chained to each other via cryptographic
    proofs. So, there would be a need for extremely high levels of computing power.


    Data cannot be Modified Easily


    The second challenge is also one of the merits of blockchain technology and that
    is its immutability feature. Once data is added to the blockchain, it is extremely
    hard to modify it. Of course, this stability feature is not often a good one since
    there may be a need to make changes to records which would be a difficult task.
    To make changes to the blockchain code or data, the network may have to opt for
    a hard fork. A hard fork involves a process where the network abandons an old
    chain and adopts a new one. One good example of a hard fork is Ethereum and Ethereum
    Classic. Ethereum Classic is the old chain that some members of the Ethereum community
    chose to retain while the new chain that was adopted is what we now know as Ethereum.


    Private Key


    The use of public and private key in blockchain guarantees the ownership of cryptocurrency
    units or any data stored in blockchain by individuals. Every public key also has
    a corresponding private key. The public can be shared but that is not the case
    for the private key as it needs to be safely kept away from the public. While
    it is extremely hard to hack the blockchain, it is not often difficult for hackers
    to gain access to people''s private keys.


    Since the private key grants anyone access to funds or resources, they are just
    like individual banks. Once this private key falls into the hands of the wrong
    individuals, the funds will be lost. Also, there have been numerous cases of people
    who either lost their private key or forgot them and what that means is that all
    the funds in that account will be lost and there is absolutely nothing anyone
    can do to retrieve them.


    Storage


    Remember, we described blockchain as a digital ledger that stores entries. However,
    as more information is stored in the blockchain it will become very large. A good
    example of this issue is the Bitcoin blockchain which needs about 200 GB of storage
    space. The present growth in the size of the blockchain appears to be getting
    too large for most of our hard drives. What this means is that the network will
    stand the risk of losing a large chunk of its nodes once it becomes too large
    for participants to download and store.


    Amid its drawbacks, blockchain technology''s advantages are far more than its
    disadvantages and that is why it is not just here to stay but will transform the
    way we store files. Understanding the benefits and disadvantages will enable you
    make the right decisions on the best blockchain needed for your business. In the
    next section, we shall be going through some of the sectors where blockchain has
    the potential to revolutionize.


    ## Chapter 6: The Emergence of Smart Contracts


    ![Image](Image00022.jpg)


    It is obvious that the optimism about the usefulness of blockchain technology
    is high. In 2019, a global consulting company surveyed 1,386 executives from about
    12 different countries around the globe. The survey revealed interesting facts
    about blockchain; for instance, it revealed that more than 80 percent of respondents
    agreed that indeed blockchain has compelling business cases. They also believe
    that the technology will attain mainstream adoption.


    But there was a decline in the number of respondents who carried out blockchain
    deployment between 2018 and 2019. In 2018, it was about 34 percent and dropped
    to 23 percent the following year. Interestingly, about 95 percent of respondents
    believe that one of the aspects of blockchain technology that is moderately or
    highly important is smart contracts. What we will be discussing in this chapter
    is smart contracts which I briefly introduced in the first chapter. Remember,
    smart contracts emerged as part of the second-generation blockchains after the
    creation of bitcoin.


    ### History and Basics of Smart Contract


    Smart contracts have been around for over two decades, but many came to know about
    it when the Ethereum blockchain was launched. During the mid-1990s, Nick Szabo
    came out with several papers where he successfully conceptualized smart contracts.
    The computer scientist described it in his papers as


    “A set of promises, specified in digital form, including protocols within which
    the parties perform on these promises.”


    The goal of smart contracts is to capture key elements of a contract that are
    algorithmic and also prevent agreements from being tampered with through cryptography.
    In a straightforward manner, we can see a smart contract as an automated and enforceable
    agreement. While a smart contract is automatable courtesy of a computer, some
    aspects of it may need human input or control. Taking a look at Szabo''s definition
    of a smart contract, we can find key elements of a smart contract.'
