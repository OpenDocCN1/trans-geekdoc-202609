- raw: 'One good example is Bitcoin''s consensus algorithm (PoW) which is quite inefficient
    as it needs all participating nodes or miners to solve complex mathematical calculations.
    The process of solving the calculations demands an enormous amount of energy.
    In the early days of Bitcoin, the proof-of-work consensus was not really an issue.
    But with the significant increase in the level of difficulty of the calculation,
    the energy and time needed to resolve the calculations also jumped.


    The inefficiency of this algorithm which would increase with time made the entire
    system unattractive in the long-term regardless of how attractive it may appear.
    A practical example is the use of this consensus algorithm by banks. With the
    high volume of transactions of these banks, such a system would be quite unsuitable
    for them. Other challenges facing first-generation blockchains such as Bitcoin
    and Ethereum include scalability, etc.


    ### A Different Angle


    Apart from the issue of high energy needs of the public blockchain and the proof
    of work consensus, there is also another viewpoint to consider. Remember, public
    blockchains are exactly as the name applies – the transactions are public. So,
    anyone can easily view the transactions that took place. Well, the truth is that
    we all may not need a public blockchain, especially organizations. Most companies
    would not want to disclose their business transactions to the public by using
    a public blockchain. They may be interested in concealing some critical data that
    ensures the success of their businesses because their competitors may take advantage
    of their trade secrets or strategies.


    This eventually exposed the need for a different kind of blockchain. To help deal
    with this issue, two new kinds of blockchains emerged - private and federated
    blockchain. So, the multiple drawbacks of the first-generation blockchains such
    as scalability and inefficiency led to the discovery of other types of blockchain.
    Also, public blockchain is not suitable for all purposes as some people are not
    ready to disclose their data to the public.


    ### Tyes of Blockchain


    ![Image](Image00006.jpg)Due to the issues we just discussed, blockchain technology
    now comes in about four different types:


    *   Public


    *   Private


    *   Hybrid


    *   Consortium/Federated


    Public Blockchain


    This is the first known type of blockchain and it is regarded as a “permissionless”
    distributed ledger technology since we all are free to get involved and carry
    out our transactions. We can see it as a non-restrictive version of blockchain
    and as a peer-to-peer network, anyone can own a copy of the ledger. Since anyone
    is free to own a copy of the ledger, we can all also access the public blockchain
    as long as there is an internet connection.


    The Bitcoin public blockchain is undoubtedly among the first ones to enter our
    world and it granted everyone permission to execute transactions in a decentralized
    way as long as there is an internet connection. A public blockchain will not be
    functional if it fails to get the required participating peers who solve the transactions.


    Although many blockchain platforms still make use of a public blockchain, they
    all create additional features to distinguish themselves from other platforms.
    Excellent examples of public blockchains are Litecoin, Bitcoin, NEO and Ethereum.


    Benefits of Public Blockchain


    Despite some of their shortcomings, the truth is that public blockchains also
    have remarkable benefits:


    *   Becoming a part of the public blockchain is free.


    *   There is no need for intermediaries to make the system work.


    *   Public blockchain engenders trust among the entire community of users.


    *   Since the available data is open for verification purposes, it also fosters
    transparency for the entire network.


    *   All participants in the public network are incentivized to ensure the system
    keeps improving.


    *   Depending on the number of participating nodes, public blockchains are often
    very secure.


    What are the Demerits?


    Just like every other thing on earth, public blockchain also has its challenges.
    The first one has to do with transaction speed. It usually requires a few minutes
    and, in some cases, hours before the completion of a transaction. For instance,
    VISA which is a centralized payment platform can process 24,000 transactions per
    second and when we compare this to Bitcoin which manages about seven transactions
    per second, then you will agree with me that Bitcoin’s capacity is extremely low.
    The reason for the slow transaction speed has to do with the mathematical problems
    that must be solved before completing a transaction.


    Scalability is a big issue with a public blockchain. As a result of how they work,
    public blockchains cannot scale because the network will keep getting clumsy as
    more nodes join and this also makes the network slower. This issue is being addressed
    in different ways by different blockchain networks. While Ethereum is looking
    at embracing the Proof of Stake (PoS) consensus mechanism, Bitcoin is networking
    on lighting the network and this eventually takes transactions off-chain. When
    this is finally completed, the main Bitcoin network will be more scalable and
    faster.


    One more demerit of public blockchain has to do with the energy usage of their
    consensus method. Presently, Bitcoin still uses the PoW which requires more energy.
    As I mentioned earlier, Ethereum is attempting to solve this challenge partially
    by working toward the use of PoS.


    Public Blockchain Use Cases


    Despite the many challenges of the public blockchain, it has several amazing use
    cases and one of them is in voting. Since voting requires a significant level
    of transparency and trust, governments can actually use public blockchains for
    voting. It is also an excellent solution for fundraising for organizations and
    initiatives that desire to improve trust and transparency.


    Private Blockchain


    ![Image](Image00007.jpg)


    Just like the name, this type of blockchain is simply private and functions in
    a restrictive environment – a closed network. Also, a private blockchain is commonly
    known as “permissioned” blockchain which implies that its control is in the hands
    of a specific entity. Perhaps one of the best use cases of private blockchains
    is in private companies that desire to use it internally. When an organization
    decides to use a private blockchain, then they will permit a certain number of
    participants to access the network. The company can even take it a step further
    by specifying the levels of authorization, accessibility, etc., for every user
    on the network.


    What exactly are the major features that separate the public and private blockchain?
    The major difference between the two is based on accessibility. Apart from the
    way they are accessed, both types of blockchain offer users similar features since
    the two can provide security, trust and transparency to participants.


    A permissioned blockchain differs from the permissionless one based on the fact
    that it appears to be a bit centralized. Since there will be an authority in charge
    of the network, it is centralized and this also means theoretically that it is
    not decentralized. I need to point out that although you can call a private blockchain
    a permissioned one, the concept of permissioned blockchain is quite broad and
    can even be used in public blockchains too. Some excellent examples of private
    blockchain include Hyperledger Fabric, Corda, Multichain and Hyperledger Sawtooth.


    Merits of Private Blockchain


    *   One of the striking benefits of this type of blockchain is speed – they are
    fast. The increased speed of private blockchains is as a result of the few participants
    involved. The network can easily reach consensus in less time and this leads to
    faster transactions.'
  fmt: '

    # 区块链类型概述


    一个典型的例子是比特币的共识算法（PoW），它效率相当低下，因为它需要所有参与节点或矿工解决复杂的数学计算。解决这些计算的过程需要消耗大量的能源。在比特币早期，工作量证明共识并不是真正的问题。但随着计算难度的显著增加，解决计算所需的能源和时间也随之激增。


    这种算法的低效性会随着时间的推移而加剧，从长远来看，无论它表面上看起来多么有吸引力，都会使整个系统变得没有吸引力。一个实际的例子是银行使用这种共识算法。鉴于银行的高交易量，这样的系统对它们来说将非常不合适。比特币和以太坊等第一代区块链面临的其他挑战还包括可扩展性等。


    ## 另一个视角


    除了公共区块链的高能源需求和工作量证明共识问题外，还有另一个视角需要考虑。请记住，公共区块链正如其名——交易是公开的。因此，任何人都可以轻松查看发生的交易。事实上，我们并不都需要公共区块链，尤其是组织。大多数公司不愿意通过使用公共区块链向公众披露其业务交易。它们可能有兴趣隐藏一些确保其业务成功的关键数据，因为竞争对手可能会利用它们的商业机密或策略。


    这最终暴露了对不同种类区块链的需求。为了解决这个问题，出现了两种新型区块链——私有链和联盟链。因此，第一代区块链的多重缺陷（如可扩展性和低效性）导致了其他类型区块链的发现。此外，公共区块链并不适用于所有目的，因为有些人不愿意向公众披露他们的数据。


    ## 区块链类型


    ![Image](Image00006.jpg)


    由于我们刚才讨论的问题，区块链技术现在大约有四种不同的类型：


    *   公有链

    *   私有链

    *   混合链

    *   联盟链/联邦链


    ### 公有链


    这是第一种已知的区块链类型，被视为一种“无许可”分布式账本技术，因为我们都可以自由参与并进行交易。我们可以将其视为区块链的非限制版本，作为一个点对点网络，任何人都可以拥有账本的副本。既然任何人都可以自由拥有账本副本，只要有互联网连接，我们都可以访问公共区块链。


    比特币公共区块链无疑是最早进入我们世界的区块链之一，它授予每个人以去中心化方式执行交易的权限，只要有互联网连接。如果公共区块链无法获得解决交易所需的参与节点，它将无法运行。


    尽管许多区块链平台仍然使用公共区块链，但它们都创建了额外的功能来区别于其他平台。公共区块链的优秀例子包括 `Litecoin`、`Bitcoin`、`NEO`
    和 `Ethereum`。


    #### 公有链的优势


    尽管存在一些缺点，但公共区块链也有显著的优势：


    *   加入公共区块链是免费的。

    *   不需要中介机构来使系统运行。

    *   公共区块链在整个用户社区中建立信任。

    *   由于可用数据开放供验证，它也促进了整个网络的透明度。

    *   公共网络中的所有参与者都有动力确保系统持续改进。

    *   取决于参与节点的数量，公共区块链通常非常安全。


    #### 公有链的劣势


    就像地球上的其他事物一样，公共区块链也有其挑战。第一个与交易速度有关。通常需要几分钟，在某些情况下甚至需要几小时才能完成一笔交易。例如，作为中心化支付平台的
    `VISA` 每秒可处理 24,000 笔交易，而比特币每秒仅能处理约 7 笔交易，相比之下，比特币的容量极低。交易速度慢的原因与必须在完成交易前解决的数学问题有关。


    可扩展性是公共区块链的一个大问题。由于其工作原理，公共区块链无法扩展，因为随着更多节点加入，网络会变得越来越笨拙，这也使网络变慢。不同的区块链网络正以不同方式解决这个问题。以太坊正在考虑采用权益证明（`PoS`）共识机制，而比特币则在开发闪电网络，这最终将交易移至链下。一旦完成，主比特币网络将更具可扩展性且更快。


    公共区块链的另一个劣势与其共识方法的能源使用有关。目前，比特币仍在使用 `PoW`，这需要更多能源。如前所述，以太坊正试图通过致力于使用 `PoS` 来部分解决这一挑战。


    #### 公有链的用例


    尽管公共区块链面临许多挑战，但它有几个惊人的用例，其中之一是投票。由于投票需要高度的透明度和信任，政府实际上可以使用公共区块链进行投票。这也是渴望提高信任和透明度的组织和倡议进行筹款的绝佳解决方案。


    ### 私有链


    ![Image](Image00007.jpg)


    正如其名，这种类型的区块链纯粹是私有的，在限制性环境中运行——一个封闭的网络。此外，私有区块链通常被称为“有许可”区块链，这意味着其控制权掌握在特定实体手中。私有区块链最好的用例之一或许是希望在内部使用它的私营公司。当一个组织决定使用私有区块链时，他们将允许一定数量的参与者访问网络。公司甚至可以进一步指定网络上每个用户的授权级别、可访问性等。


    究竟是什么主要特征将公共区块链和私有区块链区分开来？两者的主要区别在于可访问性。除了访问方式不同外，这两种区块链为用户提供的功能相似，因为两者都可以为参与者提供安全性、信任和透明度。


    有许可区块链与无许可区块链的区别在于，它似乎有点中心化。由于将有一个负责网络的权威机构，它是中心化的，这在理论上也意味着它不是去中心化的。我需要指出，虽然你可以称私有区块链为有许可区块链，但有许可区块链的概念非常广泛，甚至可以用于公共区块链。私有区块链的优秀例子包括
    `Hyperledger Fabric`、`Corda`、`Multichain` 和 `Hyperledger Sawtooth`。


    #### 私有链的优势


    *   这种区块链的一个显著优势是速度——它们很快。私有区块链速度的提高是由于参与者很少。网络可以在更短的时间内轻松达成共识，从而实现更快的交易。

