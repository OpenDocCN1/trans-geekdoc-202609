- raw: 'The digital space has witnessed tremendous technological advancements in the
    past few decades and this has, in turn, revolutionized our lives – from keeping
    in touch with members of our family who may be in another continent to entertainment,
    collaborating with our coworkers, and even shopping. People are now using the
    internet more than ever before to carry out several tasks online and the outbreak
    of COVID-19 has further increased our online activities and the concept of digital
    identity cannot be overlooked anymore. In fact, in a bid to enhance privacy, usability
    and security, several billions of dollars have been spent. Regardless of the amount
    of funds and investment in managing digital identities, it has undoubtedly encountered
    several challenges.


    ### Models of Digital Identity Management


    ![Image](Image00049.jpg)


    Let''s take a look at the models of digital identity management. The first model
    is a siloed type and with this model, every organization provides a digital identity
    credential for their users. This allows their users to access various services
    on their platform. So, for every new organization a user engages with, they are
    expected to have a new digital identity credential and this offered a terrible
    user experience. Imagine registering and creating new login details and passwords
    for every website you want to access.


    As a result of the awful user experience of the first model of digital identity
    management, a second model emerged known as a “Federated” one. Third parties started
    providing digital identity credentials that enable every user to log in to services
    and different websites. An excellent example of this model is “login with Google”
    or “login with Facebook” functionalities. Consequently, many organizations outsourced
    their company''s identity management to firms with economic interests in collating
    the personal data of users.


    Unfortunately, this has eventually raised privacy and security issues around the
    world with several lawsuits. Companies like Google and Facebook turned out to
    be intermediaries of trust. But we are now seeing a third model of identity management
    with the introduction of blockchain technology, verifiable credentials and decentralized
    identifiers. This permitted the creation of the Self-Sovereign Identity which
    we shall be looking at later in this chapter. So, what is the relationship between
    verifiable credentials, decentralized identifiers and blockchain identity management?


    Well, verifiable credentials serve as statements that an issuer makes in a privacy-respecting
    and tamper-proof way. They give room for the digital watermarking of claims data
    via a mix of public-key cryptography and privacy-preserving strategies to avoid
    correlation. This ensures that physical credentials can be turned digital safely
    and such credential holders can reveal particular information from their credential
    without revealing the actual data. So, you can easily prove that you are above
    18 without revealing your ID in cases where third parties can verify this specific
    data without requiring the attention of the issuer.


    The second is decentralized identifiers and they are unique, persistent and global
    identifiers. DIDs are entirely under the control of the identity owner and are
    completely independent of authorities, centralized registries and identity providers.
    The distributed ledger serves as a verifiable data registry or you can see it
    as a “phonebook” which people can look up to verify the organization a particular
    public DID belongs to. When it comes to identity management, what blockchain technology
    does is to allow all participants on the network to have access to the same source
    of truth regarding the valid credentials as well as those who attested to its
    validity without disclosing the real information.


    There are basically three actors when it comes to identity management with distributed
    ledger technology and they are owners, issuers and verifiers.


    ![Image](Image00050.jpg)


    These are the three actors that play a crucial role when leveraging digital ledger
    technology for identity management. The identity issuer refers to trusted parties
    like government institutions and the government that issue identity owners’ personal
    credentials. The identity issuer instantly testifies to the validity of a users’
    personal data by issuing a credential. Then the identity owner can choose to keep
    the credentials in their personal identity wallet which they can now use in subsequent
    transactions to prove the validity of their identity to third parties (verifiers).
    You can see credentials as several identity attributes while an identity attribute
    refers to a piece of data regarding any given identity such as date of birth,
    age, name, etc.


    ### How Identity Works Presently


    Let''s take a look at how identity works from three different perspectives. First,
    let''s examine how it works for companies and organizations. These corporations
    obtain sensitive data regarding their users then go ahead to keep them alongside
    routine business data that is less sensitive. This setup is not an ideal one because
    it leads to new business risks, especially with the increasing user privacy-focused
    regulations like GDPR. It is not also ideal considering the increasing change
    of focus by industries toward corporate IT responsibility.


    ![Image](Image00051.jpg)


    These data will also become less useful for various uses such as helping to understand
    the customers better or helping in driving product improvements when they are
    relegated to data vaults that are highly secured. Most experts believe that before
    companies can properly strike the right balance between business needs and data
    security, they might have received large fines or managed to develop stronger
    IT capabilities.


    The second perspective has to do with the Internet of Things (IoT). The number
    of internet-connected devices has witnessed a dramatic increase over the years
    and the number is estimated to be 13. 8 billion in 2021.


    However, this number is projected to increase to 30.9 billion by 2025. The IoT
    technology is generally a nascent industry and most of these companies have not
    been able to create the proper identity and access management capabilities. It
    is extremely crucial for interconnected IoT devices and objects to identify monitors,
    sensors and devices.


    They should also be able to securely manage access to both sensitive and non-sensitive
    information. To deal with this gap, major IT vendors are already providing IoT
    management systems that would help address most of these service gaps. For instance,
    you can easily find one company possessing thousands of IoT devices compared to
    a few dozens or hundreds of the traditional servers and user devices. But one
    challenge with this volume of IoT devices is that of mismatching standards across
    several devices. At this scale, the issue of security is often an afterthought
    especially with the task of implementing simple management capabilities which
    is very challenging.


    The third perspective has to do with identity management for individuals. Our
    society and economy cannot function properly without identity – it is an integral
    part of life. Our thriving societies and global markets can only function when
    we properly identify ourselves as well as our possessions. When we look at the
    concept of identity at its most basic level, it has to do with a collection of
    claims regarding an individual, a place or thing. When it comes to individuals,
    this often comprises our first name, last name, nationality, date of birth and
    other national identifiers like social security number (SSN), passport number
    or driving license.'
