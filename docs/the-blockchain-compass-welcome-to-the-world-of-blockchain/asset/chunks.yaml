- raw: 'However, it is often very hard to find the nonce and in blockchain technology,
    this difficulty is one strategy for dropping cryptocurrency miners that are not
    very talented. Getting involved in the mining process demands exceptional computational
    power that can solve the nonce. Apart from blockchain and cryptocurrency, other
    fields that use nonce include several computer networking applications such as
    the popular two-factor authentication, authentication for purchases, electronic
    signatures and other forms of account recovery and identification.


    Cryptography


    Trust in blockchain technology is achieved without a central authority like traditional
    institutions. Instead, trust is established via cryptography and consensus. The
    function of cryptography is to move the burden of trust from third parties to
    cryptographic algorithms. Cryptography helps to encode or encrypt data and ensure
    that third parties or external actors are unable to decipher any given message.
    So, we can say that cryptography provides a confidential two-way exchange where
    every party can freely encrypt or decrypt the cipher before they can access the
    message payload.


    Cryptography also helps in the validation of data integrity in blockchain. To
    create an encrypted version of a message also known as cipher, the cryptographic
    algorithm makes use of the message and the key. A sender and receiver can exchange
    the encrypted version of the message or the cipher.


    Public Key Cryptography


    The function of public-key cryptography in distributed ledger technology is for
    data validation in addition to user authentication via digital signatures. We
    can achieve user authentication via a combination of the public and private keys
    of a user through what is known as the “Public Key Infrastructure” (PKI) framework.
    In cryptography, a public key is a representation of a user''s public identity
    and they can share it with other users on the network.


    Every user on any blockchain platform holds a private key that is stored in a
    digital wallet. A private key keeps the details of the private credentials of
    a user. Mathematical algorithms are employed to help generate the pairing of these
    public and private keys and they ensure that we can encrypt and decrypt a message.
    It is also possible to use the public and private keys in a manner that can help
    preserve users'' anonymity.


    All parties are often aware of the public key – the sender and receiver. But only
    the sender knows the private key and when sending a message to the recipient,
    the sender will render the message unreadable (ciphertext) via encryption using
    mathematical formulas. This is to ensure adequate protection of the data and the
    recipient can only decrypt the “ciphertext” and transform it into a readable text
    with the private key.


    ![Image](Image00012.jpg)Hash Functions


    Blockchain technology utilizes a particular kind of cryptography known as cryptographic
    hashing. A mathematical function creates a hash code by taking a digital object
    and generating a fixed string of numbers and letters (32-character) to represent
    the hash code and a good example is a transaction represented as *d7w0993waty9n33234qw949g02b9o34238878501032ff2si04d3d99sq93jzwa9.*


    One of the things that cryptography is used for in cryptographic hashing is for
    one-way conversion which leads to the creation of encoded data or hash. Parties
    involved in any transaction can share the hash that is created but they cannot
    decode it. Mathematically, there is no way anyone can successfully decrypt or
    reverse engineer the encoded hash. This also makes deriving the input message
    that was used in creating a hash code from the hash code itself impractical.


    Distributed ledger technology leverages cryptographic hashing to ensure that it
    is possible to prove data without really sharing what the data contains. So, by
    matching and validating that the calculated hash matches each other, all stakeholders
    or parties involved in the transaction can prove the data. In fact, one of the
    core functions of hashes is to help in maintaining the immutable qualities of
    blockchains. It is quite easy to detect changes to any blockchain because any
    change made to the original object will eventually generate a new hash.


    Every single block is a hash code that is computed as a combination of the block''s
    data and the previous block''s hash code. This is how hash codes are chained.
    It is not difficult to compute hash codes and all participants can easily verify
    that no one has made any kind of alteration to the data. The chain of hash codes
    will instantly become invalid when there is an attempt to delete or modify the
    data on any given block and participants can easily detect such changes.


    Merkle Trees


    The function of Merkle trees is to reduce the volume of data in any blockchain
    network and also ensure the efficient validation of data on the blockchain. Each
    block stores a Merkle root hash which is created by hashing transactional data.
    The transactional data will also become a part of the block. One of the things
    that the Merkle root hash does is to make transaction validation more efficient.
    Instead of validating every single data in a block, it is possible to send one
    transaction in addition to the relevant hash values. Any validating computer or
    node can now calculate the hash values for the data and also confirm the validity
    of a transaction without requiring all the data in the block.


    ### Understanding Blockchain Networks


    ![Image](Image00013.jpg)


    Every blockchain network comprises network participants and the participants are
    computers or nodes where the digital ledger is generally stored, updated from
    time to time and maintained. All through this book, you will certainly come across
    the word “node,” and it simply refers to computers in a blockchain network. Every
    participating node in the network has a shared copy of the ledger and constantly
    synchronizes with every other node across the network.


    The ultimate goal of the network of nodes is to provide consensus and also make
    sure that each copy of the shared ledger across various nodes is consistent and
    valid. They also validate every new block that is added to the ledger. Every network
    is regulated by certain consensus algorithms or protocols that help to define
    the way every node in the network communicates and interacts with others. As consensus
    is achieved, every node will have to synchronize their copy of the shared ledger
    based on established consensus protocols of the blockchain network.


    The specific consensus protocol of any network is usually determined by the platform
    that was used in implementing the network. It is the consensus of a network that
    guarantees the consistency and validity of every copy of the blockchain on the
    participating nodes. Blockchain networks are of different types and we shall be
    looking at some of them shortly.


    So, why are blockchains like Bitcoin blockchain called a “peer-to-peer” network?
    The phrase “distributed” in distributed ledger technology shows that the technology
    utilizes a peer-to-peer network structure. Unlike a central server network, nodes
    on a P2P network are all linked to one another instead of connecting to a central
    server. There is no need for third parties like a clearinghouse or banks to process
    a transaction.


    Distributed Storage


    One of the important facts about blockchain technology is that it is essentially
    a kind of data storage that differs from the traditional database most of us have
    known for so long. Also, its characteristics are not the same as the popular databases
    we all know. When considering the various use cases of blockchain technology,
    it is crucial to understand the differences between traditional databases and
    a distributed storage. This is an excellent way to determine whether the distributed
    ledger technology is the appropriate one for your needs.'
