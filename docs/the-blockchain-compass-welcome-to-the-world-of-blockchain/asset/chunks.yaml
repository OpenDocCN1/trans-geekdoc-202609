    数字空间在过去几十年里见证了巨大的技术进步，这反过来又彻底改变了我们的生活——从与身在另一大洲的家庭成员保持联系，到娱乐、与同事协作，甚至购物。人们现在比以往任何时候都更多地使用互联网在线执行多项任务，COVID-19
    的爆发进一步增加了我们的在线活动，数字身份的概念不容忽视。事实上，为了增强隐私、可用性和安全性，已投入数十亿美元。无论在管理数字身份上投入多少资金和投资，无疑都遇到了诸多挑战。


    ### 数字身份管理模型


    ![Image](Image00049.jpg)


    让我们看看数字身份管理的模型。第一种模型是孤岛型，在这种模型下，每个组织为其用户提供数字身份凭证。这允许用户访问其平台上的各种服务。因此，对于用户接触的每个新组织，都需要拥有一个新的数字身份凭证，这提供了糟糕的用户体验。想象一下，为想要访问的每个网站注册并创建新的登录详细信息和密码。


    由于第一种数字身份管理模型的糟糕用户体验，第二种模型应运而生，称为“联邦”模型。第三方开始提供数字身份凭证，使用户能够登录服务和不同的网站。该模型的一个典型例子是“使用
    Google 登录”或“使用 Facebook 登录”功能。因此，许多组织将公司的身份管理外包给了在收集用户个人数据方面有经济利益的公司。


    不幸的是，这最终在全球范围内引发了隐私和安全问题，并引发了多起诉讼。Google 和 Facebook 等公司成为了信任的中介。但随着区块链技术、可验证凭证和去中心化标识符的引入，我们现在看到了第三种身份管理模型。这允许创建自主身份，我们将在本章后面进行探讨。那么，可验证凭证、去中心化标识符和区块链身份管理之间有什么关系呢？


    可验证凭证作为发行者以尊重隐私和防篡改的方式做出的声明。它们通过公钥加密和隐私保护策略的组合，为声明数据的数字水印提供了空间，以避免关联。这确保了物理凭证可以安全地数字化，凭证持有者可以透露其凭证中的特定信息，而无需透露实际数据。因此，您可以轻松证明您年满
    18 岁，而无需出示身份证，在第三方可以验证此特定数据而无需发行者关注的情况下。


    第二种是去中心化标识符，它们是唯一的、持久的和全局的标识符。DID 完全由身份所有者控制，并且完全独立于权威机构、中心化注册表和身份提供者。分布式账本充当可验证数据注册表，您可以将其视为“电话簿”，人们可以查阅以验证特定公共
    DID 所属的组织。在身份管理方面，区块链技术允许网络上的所有参与者访问关于有效凭证以及证明其有效性的实体的相同事实来源，而无需披露真实信息。


    利用分布式账本技术进行身份管理时，基本上有三个参与者：所有者、发行者和验证者。


    ![Image](Image00050.jpg)


    这三个参与者在利用数字账本技术进行身份管理时发挥着关键作用。身份发行者是指政府机构等受信任方，它们发行身份所有者的个人凭证。身份发行者通过发行凭证即时证明用户个人数据的有效性。然后身份所有者可以选择将凭证保存在其个人身份钱包中，随后在交易中用于向第三方（验证者）证明其身份的有效性。您可以将凭证视为多个身份属性，而身份属性是指关于任何给定身份的一条数据，例如出生日期、年龄、姓名等。


    ### 身份当前的运作方式


    让我们从三个不同的角度来看看身份是如何运作的。首先，让我们看看它对公司和组织是如何运作的。这些公司获取关于其用户的敏感数据，然后将其与不太敏感的常规业务数据一起保存。这种设置并不理想，因为它导致了新的业务风险，尤其是随着以用户隐私为中心的法规（如
    GDPR）日益增加。考虑到行业对企业 IT 责任的关注点日益转移，这也不理想。


    ![Image](Image00051.jpg)


    当这些数据被归入高度安全的数据保管库时，它们对于各种用途（如帮助更好地了解客户或帮助推动产品改进）也将变得不那么有用。大多数专家认为，在公司能够在业务需求和数据安全之间找到适当的平衡之前，它们可能已经面临巨额罚款，或者设法开发出了更强大的
    IT 能力。


    第二个视角与物联网有关。联网设备的数量多年来急剧增加，2021 年估计为 138 亿台。


    然而，预计到 2025 年，这一数字将增加到 309 亿台。物联网技术总体上是一个新兴行业，大多数公司尚未能创建适当的身份和访问管理能力。对于相互连接的物联网设备和物体来说，识别监视器、传感器和设备至关重要。


    它们还应能够安全地管理对敏感和非敏感信息的访问。为了解决这一差距，主要 IT 供应商已经提供物联网管理系统，以帮助解决大多数服务缺口。例如，您可以轻松发现一家公司拥有数千个物联网设备，而传统服务器和用户设备仅有几十或几百个。但如此大量的物联网设备面临的一个挑战是跨多个设备的标准不匹配。在这个规模下，安全问题往往是事后才考虑的，尤其是实现简单管理能力的任务非常具有挑战性。


    第三个视角与个人的身份管理有关。没有身份，我们的社会和经济无法正常运转——它是生活不可或缺的一部分。只有当我们正确识别自己及我们的财产时，我们繁荣的社会和全球市场才能运作。当我们从最基本的层面来看身份概念时，它涉及关于个人、地点或事物的一系列声明。对于个人而言，这通常包括我们的名、姓、国籍、出生日期和其他国家标识符，如社会安全号码
    (SSN)、护照号码或驾驶执照。

    '
