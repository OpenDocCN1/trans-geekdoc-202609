  trans: '

    它将有助于创建数字身份标识符（DID）。请记住，区块链地址非常独特，但也可以使用此类地址来创建 DID。这些区块链地址受加密保护，且仅由所有者生成。数字身份区块链平台的另一个重要用途是将其用作数字身份注册表。因此，通过这种设置，用户可以方便地将其
    ID 中包含的所有数据存储到不可篡改的账本存储中。有了此功能，任何人几乎都不可能窃取您的信息或随时访问您的 ID。


    ## 凭证公证


    您可以将其视为在您的 ID 上盖章。数字身份区块链平台可以将您数据的哈希地址放置在数字身份区块链平台上。这并不意味着存储在账本上的仅仅是您的凭证。相反，哈希地址将充当时间戳并提供某种电子印章。因此，每当学生毕业时，机构可以选择在平台上为学位提供哈希值。


    有了提供的哈希值，学生将知晓学位的颁发时间，并拥有学位证书的证明。每当毕业生想要使用学位证书工作时，他都可以凭借大学提供的哈希值轻松证明资格的真实性。这是改变我们处理知名大学认证方式的绝佳途径。它还有助于消除许多组织在招聘新员工时面临的伪造证书问题。


    ## 同意与访问权控制


    数字身份区块链平台还可以帮助控制对您凭证的访问。在某些情况下，您可能希望仅在有限时间内在不同平台上共享您的个人信息。您可以授予您想要合作的组织临时访问权限，仅用于确认您是否真正拥有经过公证的凭证。要实现这一点，您可以将其设为一种具有过期日期的交易。一旦访问权限过期，一切将恢复到之前的状态，他们将失去对信息的访问权。对于被临时授予访问您凭证权限的公司或组织而言，他们将被要求删除该信息，并在平台上提供已删除的证据。


    ### 自主身份（SSI）


    ![Image](img/Image00053.jpg)


    解释 SSI 的含义可能听起来有点棘手。实际上，它的意思是一个人将成为其身份的模拟版和数字版的唯一所有者。这也意味着组织也可以享受这种特权。拥有自主身份的每个用户都有权决定谁可以访问其数据。他们可以使用
    SSI 在线验证身份，并负责维护它。考虑到这种身份的性质，最适合它的技术将是分布式账本技术。


    这是因为区块链的去中心化特性确保了没有任何第三方的存在。但要使系统全面且成功地运行，将需要若干原则。基于区块链的自主身份平台可以通过使用这些指导原则与 GDPR
    法律协同运作。每个平台都必须提供 SSI 的十项基本原则。那么，这些原则是什么？


    1.  **存在性：** 平台上的用户应具有独立的存在性，且也应以数字形式存在。

    2.  **访问性：** 每个自主身份都应为用户提供完全访问权。这意味着平台上的用户可以访问其信息，也可以访问其他声明，而无需依赖任何第三方。然而，由于数据具有无法修改的签名验证，用户可能无法修改所有数据。

    3.  **控制权：** 此原则意味着用户完全控制其身份。控制权原则还有另一个角度，因为存在若干实例，用户可能不完全拥有自主身份的所有权。然而，在这种情况下，用户仍有机会限制其他方如何处理其身份。

    4.  **透明度：** 处理身份的所有算法或系统都需要透明度。如果没有开放的系统，用户将无法确保自主身份平台正在妥善管理其身份。

    5.  **可移植性：** 平台上的用户应能随时轻松传输其身份。实际上，此功能意味着用户可以轻松导出其身份，并在不同场景中使用它们。

    6.  **持久性：** 优秀的自主身份平台将确保所有身份的长久性。因此，如果系统正在进行升级，平台上的用户仍可像升级前一样保留其先前的数据。

    7.  **互操作性：** 缺乏出色的互操作性会消除身份的灵活性。因此，为了使自主身份平台有效，它应在任何地点均被接受。

    8.  **最小化：** 此原则意味着尽可能在第三方想要访问用户身份时，不应完全暴露用户身份。例如，当第三方需要访问用户的年龄时，系统向该特定用户披露的应仅为年龄，而非用户的确切出生日期。确实没有必要过度暴露用户的身份。

    9.  **同意权：** 无论出于何种原因，第三方均不得访问用户信息。如果第三方想要访问任何用户的信息，必须获得该用户的完全同意。未经用户许可，任何人都无法访问用户身份。

    10. **保护权：** 无论发生什么，用户都应拥有其自主身份的全部权利。这意味着所有 SSI 平台必须无论面临何种压力都维持这一标准。


    ## 每个基于区块链的去中心化身份解决方案的五大支柱


    目前识别数据泄露的估计时间约为七个月。但凭借区块链固有的特性（确保透明度、信任和用户控制），许多组织和政府正日益探索其潜力。然而，每个基于区块链的去中心化数字身份解决方案都应具备五大支柱，这些是确保此类解决方案可行性的关键。


    ![Image](img/Image00054.jpg)


    1.  **隐私：** 区块链加密与数字签名的结合保证了“隐私设计”，这得益于假名化。通过为用户进行的每一笔交易添加数字签名，交易也将变得万无一失。

    2.  **简易性：** 平台上的用户应能随时轻松传输其身份。实际上，此功能意味着用户可以轻松导出其身份，并在不同场景中使用它们。

    3.  **安全性：** 无论发生什么，用户都应在自主身份平台上拥有全部权利。这意味着所有 SSI 平台必须无论面临何种压力都维持这一标准。

    4.  **完整性：** 就完整性而言，与传统身份系统不同，去中心化数字身份应为用户提供在网络中各个节点上维护其身份的能力。不应存在单点故障，这确保了黑客无法轻易破坏数据的完整性。

