- raw: 'It will help in creating digital IDs (DIDs). Remember, blockchain addresses
    are very unique, but it is even possible to also use such addresses for creating
    DIDs. These blockchain addresses are cryptographically secured and are only generated
    by the owners. Another significant usefulness of the digital identity blockchain
    platform is its use as a digital identity registry. So, with this setup, users
    can conveniently store all the data contained in their IDs to the immutable ledger
    storage. With this feature, it would be almost impossible for anyone to steal
    your information or access your ID anytime.


    Credential Notarization


    You can see this as putting seals on your ID. It is possible for an identity blockchain
    platform to put a hash address to your data on the digital identity blockchain
    platform. This does not also imply that what will be stored on the ledger will
    only be your credentials. Instead, the hash address will serve as a timestamp
    and provide some kind of electronic seal. So, an institution can choose to provide
    the hash for a degree on the platform whenever a student graduates.


    With the hash provided, a student will be aware of when the degree was issued
    as well as proof of his degree certificate. Whenever the graduate now wants to
    work with the degree certificate, he can easily prove the authenticity of the
    qualification courtesy of the hash provided by the university. This is an excellent
    way to transform the way we handle certification from a respected university.
    It also helps to eliminate the issue of falsified certificates that many organizations
    face whenever they are hiring a new worker.


    Control of Consent and Access Rights


    A digital identity blockchain platform can also help to control access to your
    credentials. There are cases where you would prefer sharing your personal information
    on different platforms only for a limited time. You can grant an organization
    you want to work with temporary access just to confirm whether you truly have
    the notarized credentials or not. To achieve this, you can make it a kind of transaction
    that has an expiry date. Once the access expires, then things would be back the
    way they were before and they would lose access to the information. On the part
    of the company or organization that was temporarily given access to your credentials,
    they would be required to delete the information and provide a piece of evidence
    that they did so on the platform.


    #### Self-Sovereign Identity (SSI)


    ![Image](Image00053.jpg)


    It may sound a little bit tricky to explain the meaning of SSI. What it means,
    in reality, is that a person would be the sole owner of the analog and digital
    versions of their identity. This also implies that an organization can enjoy this
    kind of privilege too. Every user that has a Self-Sovereign Identity has the power
    to determine who would have access to their data. They can verify their identities
    online using SSI and are also responsible for maintaining it. Considering the
    nature of this kind of identity, the most suitable technology for it would be
    distributed ledger technology.


    This is because blockchain''s decentralized nature ensures the absence of any
    third party. But for the system to function fully and successfully, it would require
    several principles. Blockchain-enabled Self-Sovereign Identity platforms can function
    alongside GDPR Law by using these guiding principles. Every platform will have
    to offer ten basic principles of SSI. So, what are the principles?


    **1.** **Existence:** Users on the platform should have an independent existence
    and should also be in digital form too.


    **2.** **Access:** Every Self-Sovereign Identity should offer users fill access.
    This implies that users on the platform can access their information and also
    access other claims without depending on any third parties. However, since the
    data has signed verification that cannot be modified, users may not be able to
    modify all the data.


    **3.** **Control:** This principle means that users are in complete control of
    their identities. There is another angle to the principle of control since there
    are several instances where users may not have complete ownership of the Self-Sovereign
    Identity. However, the user still gets the chance to limit how their identity
    is handled by other parties in such instances.


    **4.** **Transparency:** There is a need for transparency for all algorithms or
    systems handling the identities. It would be impossible for users to ensure that
    the Self-Sovereign Identity platform is properly managing their identities without
    an open system.


    **5.** **Portability:** It should be easy for users on the platform to transport
    their identity anytime they need it. What this feature implies, in reality, is
    that users can easily export their identities and also make use of them in different
    scenarios.


    **6.** **Persistence:** A good Self-Sovereign Identity platform will ensure the
    longevity of all identities. So, in the event that the system is going through
    an upgrade, users on the platform can still maintain their previous data just
    as they were before the upgrade.


    **7.** **Interoperability:** The absence of excellent interoperability eliminates
    the flexibility of identities. So, for a Self-Sovereign Identity platform to be
    effective, then it should be acceptable in any location.


    **8.** **Minimization:** This principle means that as much as possible, users''
    identities should not be completely exposed whenever third parties want to access
    them. For instance, when a third party requires access to a user''s age, all the
    system should disclose to that particular user is the age and not the user''s
    exact birth date. There is really no need to overexpose the identity of a user.


    **9.** **Consent:** Third parties cannot access the information of users regardless
    of the reasons. In a situation where a third party wants to access the information
    of any user, the user must grant the third-party full consent. Without obtaining
    the permission of a user, no one can access the user''s identity.


    **10.** **Protection:** Users should have full rights to their Self-Sovereign
    Identity regardless of what happens. This means that all SSI platforms must maintain
    this standard no matter the pressure.


    Five Pillars of Every Blockchain-Based Decentralized Identity Solution


    The current estimate for the identification of data breaches is about seven months.
    But with the inherent characteristics of blockchain which ensures transparency,
    trust and user control, many organizations and governments are increasingly exploring
    its potentials. However, every blockchain-based solution for decentralized digital
    identity should possess five pillars and these are the things that ensure the
    viability of such solutions.


    ![Image](Image00054.jpg)


    **1\. Privacy:** The combination of blockchain encryption with digital signature
    guarantees “Privacy by Design” courtesy of pseudonymization. By adding the digital
    signature to every single transaction that a user makes, transactions will also
    be foolproof.


    **2\. Simplicity:** It should be easy for users on the platform to transport their
    identity anytime they need it. What this feature implies, in reality, is that
    users can easily export their identities and also make use of them in different
    scenarios.


    **3\. Security:** Users should have full rights on the Self-Sovereign Identity
    platforms regardless of what happens. This means that all SSI platforms must maintain
    this standard no matter the pressure.


    **4\. Integrity:** When it comes to integrity, then unlike traditional identity
    systems, the decentralized digital identity should provide users the ability to
    maintain their identity on various nodes in the network. There should not be a
    single point of failure which ensures that hackers cannot easily break the integrity
    of the data.'
