- raw: 'We shall be looking at smart contracts in detail in chapter five but it is
    crucial to talk briefly about smart contracts since it forms a major part of blockchain
    history. Innovation is a daily occurrence in our world and one of those who have
    made tremendous impacts in the history of digital ledger technology is Vitalik
    Buterin. He was part of a group of developers who believed that Bitcoin was yet
    to attain its full potential in terms of taking advantage of the capabilities
    of digital ledger technology.


    The limitations of Bitcoin were part of the major factors that motivated Buterin
    to focus on creating a blockchain that is capable of carrying out functions other
    than cryptocurrency in addition to also being a peer-to-peer network. This led
    to the creation of the Ethereum blockchain in 2013 which went a step further to
    add other functionalities. This development became a turning point in the history
    of blockchain. With the Ethereum blockchain, people can now do other things like
    recording other assets and contracts, unlike Bitcoin that focused mainly on serving
    as a database for bitcoin transactions.


    This new and unique feature opened the door to the functionalities of the Ethereum
    network and it was not just a cryptocurrency but also a platform where people
    can develop decentralized applications (dApps). Ethereum blockchain was eventually
    launched officially in 2015 with its support for smart contracts and the blockchain
    network has successfully attracted a very active developer community and created
    an amazing ecosystem.


    Phase III The Era of Applications


    The history of blockchain technology is not complete without mentioning the emergence
    of several projects that have discovered smart ways to leverage the capabilities
    of digital ledger technology. Most of these new projects explored ways to deal
    with a number of limitations of Bitcoin and Ethereum while adding new and unique
    features that take advantage of blockchain technology. NEO is one of such blockchain
    applications. It is a decentralized and open-source blockchain platform from China
    despite the ban on cryptocurrencies by the country.


    Other blockchain applications were created during this phase and some of them
    involved public blockchain networks that grant any individual around the world
    access to the network''s content. But at this point, several corporations began
    to adopt the digital ledger technology to help boost operational efficiency, and
    one of the companies to explore the use of blockchain was Microsoft. This era
    saw the creation of three different types of blockchain – public, private and
    federated/hybrid blockchains.


    ### A Summary of Blockchain Technology and Its Three Generations


    ![Image](Image00002.jpg)


    Presently, there are three generations of blockchain and Bitcoin belongs to the
    first generation. The primary purpose and design of the first-generation blockchains
    was to enhance the financial systems and this explains why most of the cryptocurrencies
    that were created during this era were all focused on financial application. Since
    Bitcoin''s design was just to facilitate financial transactions, what about adding
    things like terms and conditions to the transactions?


    Here is a simple explanation. James orders a wristwatch online from a lady called
    Jenifer and he provides his condition for making payment, *“I can only pay Jenifer
    her 5 bitcoins when she delivers the wristwatch I ordered?”*


    In this case, it is not possible for Bitcoin to handle this type of transaction.
    This is where second-generation blockchains such as Ethereum come in. The two
    striking features that Ethereum introduced were smart contracts which can now
    ensure that Jenifer can only get paid automatically when she delivers the wristwatch.
    The second feature that Ethereum introduced was a platform where developers can
    create their decentralized applications (dApps) and also launch their tokens.


    This makes the Ethereum blockchain a digital ecosystem where different projects
    can operate on. Interestingly, things have improved significantly with the introduction
    of a variety of functional uses such as decentralized finance (DeFi), gaming,
    supply chain management, non-fungible tokens (NFTs), etc.


    The third-generation blockchain involves projects such as Cardano, Ethereum 2.0
    which is an upgraded version of Ethereum, Polkadot and several others. When Satoshi
    Nakamoto and Vitalik Buterin came out with their various blockchain projects,
    they still had several teething problems. This also limited their capabilities
    and one of such issues is their capacity or what is commonly known as scalability
    problem.


    When there are too many individuals attempting to execute their transactions in
    a blockchain that has small space, there will be serious congestion. So, the design
    of third-generation blockchains was primarily focused not just on providing most
    of the functionalities of the first and second-generation blockchains, but also
    resolving the issues they had, especially that of scalability. One other issue
    that third-generation blockchains are solving is that of interoperability.


    ### The Foundation of Cryptocurrencies


    We can define blockchain technology simply as *“cryptographically secured distributed
    ledgers.”* It is basically a database where participants can view the information
    it contains at any time. Rather than store the data on one centralized server
    which is common among traditional organizations, the data is spread across various
    computers or “nodes” around the world. This ensures that all participating nodes
    can access the database. It is common to see people confuse blockchain and cryptocurrency.
    Also, some people feel that bitcoin is the same as blockchain, but they are all
    different things.


    Blockchain serves as the underlying technology that ensures the transparency of
    all transactions we record. On the other hand, cryptocurrency is simply a digital
    store of value that we can use for various purposes like the purchase of properties,
    goods and services. Bitcoin is a popular example of a cryptocurrency.


    Satoshi Nakamoto introduced cryptography as a way to secure the cryptocurrency
    against counterfeit and other security challenges associated with fiat money.
    So, the primary reason for creating blockchain technology was to facilitate bitcoin''s
    existence and use. It serves as the decentralized ledger containing every cryptocurrency
    transaction across any network regarded as peer-to-peer. You can call blockchain
    the *“internal banking system”* of cryptocurrencies that is decentralized. However,
    the use of blockchain has now grown beyond financial transactions just as I explained
    before and we shall look at several use cases later.


