- raw: 'According to estimates from WHO, one in ten medical products (diagnostic kits,
    vaccines and pills) are either falsified or substandard in low- and middle-income
    nations of the world. In some locations, the challenge is that of theft and as
    disclosed by the BSI Group, the national standards body of the UK estimates that
    thefts involving pharmaceutical cargo are more than $1 billion annually. The UK
    and US actually account for about half of all the theft recorded. This situation
    may eventually be some kind of practice run for the health care supply chains
    that may likely face even more concentrated pressure. This explains why the industry
    is focusing more on distributed ledger technology.


    ### Supply Chain Issues in Pharma Industry


    Some experts in the healthcare industry believe that maintaining the supply chain
    is one of the biggest obstacles facing the pharmaceutical industry. It is a very
    complex and risky process. One of the issues linked to supply chain is falsified
    drugs. When someone goes to a pharmacist to obtain a prescription, they assume
    that the medicine is of the highest standard, stored appropriately in the right
    conditions, authentic and was never tampered with. Unfortunately, there are several
    cases where falsified drugs entered the supply chain and this is a serious threat
    to the health of the users. Just to make things clearer, a falsified medicine
    includes:


    *   Medications with the wrong ingredients


    *   Drugs that were stolen


    *   Medicines with little or no active ingredient


    *   Tampered drug


    *   Medicines with fake packaging.


    The big question here is how can patients or users determine if the medicines
    they are buying were stored in the appropriate conditions while they were moved
    to a pharmacy? How can users determine if the medicines contain the right strength
    and quantity of the medicine? Based on the existing structures, all that a pharmacist
    needs to do is to depend on the various stakeholders like the manufacturer, wholesaler
    and courier to put in place the correct procedures.


    When the drugs finally arrive at their destination (a pharmacy or hospital), the
    pharmacist must also make sure that the medicines are truly the appropriate standard
    before releasing them to patients. You will agree with me that the entire journey
    is not transparent enough because a pharmacist may need to go through an audit
    trail to ensure the quality and standard of the medicines and this takes quite
    some time. There are several parties in the pharmacy supply chain and just one
    of them can significantly influence the quality of the final product.


    For instance, the manufacturers need to ensure that each tablet contains the right
    formulation, strength and was properly stored. Manufacturers must also ensure
    that the drugs are suitable for human consumption. Wholesalers, logistics companies
    or suppliers also play a role in the entire process as they must ensure that the
    quality of the medicines is not affected by things like humidity or temperature.
    They must also prevent criminals from intercepting or tampering with the medicines
    and that they are not stolen by criminals.


    ### Blockchain Solutions for the Pharma Industry


    *“The primary use for blockchain within the pharma industry is to serve as a*
    ‘ledger of truth’ *for sharing complex information with regulators, pharmacy,
    benefit managers, contract manufacturers, physicians, patients, academic researchers,
    and R&D collaborators, among others.”- Arun Ghosh (KPMG Analyst)*


    ![Image](Image00028.jpg)


    As I mentioned before, the outbreak of the COVID-19 pandemic exposed the challenges
    facing the global healthcare industry. One of the areas that was seriously affected
    was the global supply chain in the pharma industry as there were serious issues
    with connectivity as well as data exchange. These are challenges that blockchain
    technology can easily resolve. In fact, top pharmaceutical conglomerates (Pfizer,
    Sanofi and Amgen) are exploring ways to effectively use blockchain technology
    for the safe storage of data which will increase the speed of clinical trials
    and eventually lower the cost involved in developing drugs. This is as a result
    of blockchain''s ability to dramatically improve pharma supply chain.


    Data Disparity in Pharma Industry


    The development stage of the pharma industry is also the core of the industry
    since it is the stage where companies require data for experiments. This will
    help them to understand and come up with new medicines that will help cure various
    diseases. But the challenge most pharmaceutical companies experience is data disparity
    as they attempt to solve a specific disease. The cause of data disparity emanates
    from the silos of data that have been stored over time which functions by linking
    other platforms.


    The reason why data disparity has become a major issue for pharmaceutical companies
    is that they have to depend on various sources for data and they are unable to
    properly verify the uploaded data that different sources share. Among the factors
    that lead to data disparity is the different structure and models adopted by various
    data sources and departments.


    #### Blockchain Solution in Pharmaceutical Supply Chain


    Blockchain technology can transform the entire pharmaceutical supply chain in
    multiple ways. Since there are different stages and processes involved in the
    industry, it is possible to scan barcodes at all stages of the process and the
    details would be stored in a distributed ledger. The distributed ledger like blockchain
    will record and create an audit trail of the entire journey of a drug. It is also
    possible to add sensors to the supply chain to help record temperature or humidity
    in the digital ledger. This aspect is extremely vital for medicines that need
    a specific temperature for storage in the fridge like insulin or other specially
    produced drugs.


    One of the projects that is working on ways to leverage blockchain in making medical
    supply chain more efficient is MediLedger. One of the merits of blockchain-based
    platforms is that competitors can easily collaborate on the same platform to ensure
    the realization of a common goal such as ensuring the safety of drugs or eliminating
    counterfeit drugs. They can comfortably collaborate without having to share sensitive
    information.


    The MediLedger Network is a consortium that is backed by more than 20 organizations
    including Genentech, Gilead, AmerisourceBergen, Pfizer, McKesson, and Amgen. The
    underlying technology behind the project is a startup called Chronicled and the
    focus of the consortium is on pharma supply chains. MediLedger''s first major
    solution is a verification system that simplifies the process of verifying the
    authenticity of a verified drug. This process is often a very difficult one especially
    when we consider that over 60 million units of saleable medicines are returned
    each year as revealed by Healthcare Distribution Alliance.


    Before returned drugs are resold to wholesalers, they must be verified as authentic
    and the existing process requires wholesalers to contact manufacturers to assist
    them in tracking down the drug''s serial number. This process could require as
    much as 48 hours before it can be completed. By leveraging blockchain it would
    be possible for wholesale distributors to carry out the same verification exercise
    in less than a second simply by making use of a barcode scanner.


    This will in turn qualify the drug for commercial distribution immediately while
    all manufacturers maintain control over their data. Hospitals and pharmacists
    can also make use of this rapid serial number verification. All that a staff of
    a hospital or pharmacy needs to verify the authenticity of a drug while placing
    it on a shelf is a barcode scanner and web browser. They do not require any other
    sophisticated or expensive infrastructure.'
