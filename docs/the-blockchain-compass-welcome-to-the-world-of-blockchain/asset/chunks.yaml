  fmt: '

    # Network Architectures: Centralized, Decentralized, and Distributed


    ## Centralized Networks


    ### Merits

    *   **Consistency:** Considering the hierarchical structure of centralized networks
    – from the top-down, the interactions between the client nodes and the main server
    can easily be standardized. This eventually results in an end-user experience
    that is more streamlined and consistent. It is also not difficult to identify
    and eliminate extraneous activity within the network in line with the priorities
    of the network because the process of tracking and collecting data across the
    network is quite straightforward.


    ### Demerits

    Some of the demerits of a centralized network have also motivated individuals
    and businesses to explore other types of networks. Here are some major disadvantages:


    *   **Increased security risks:** The fact that there exists a single point of
    failure increases the possibility of security disruptions or breaches due to cybersecurity
    threats like DDOS attacks. The reason for this is that all a malicious actor needs
    to do is to target one source which is the main server. In addition, the existence
    of a single server where users'' data are stored implies that centralized networks
    will often experience privacy issues. There may be a permanent loss of data when
    the main server gets corrupted or is no longer online.

    *   **Risk of increased downtime:** The main servers of centralized networks also
    lead to the issue of prolonged downtime. What happens when the server crashes?
    Of course, it will cause the whole network to shut down. This will affect the
    entire network since client nodes may not send or receive information. Furthermore,
    whenever there is a need for server maintenance, the company may power off their
    main server temporarily. This temporary shutdown may likely lead to interruptions
    in service which further lowers the reliability of the entire network from the
    view of users, especially with the associated inconvenience.

    *   **Scalability limitations:** It is usually more challenging to scale centralized
    networks beyond specific points. The reason for this is that the company will
    need to increase the storage capacity of the server, its processing power and
    even add more storage to the central server before scaling beyond its existing
    point. But what happens when the network witnesses a sharp increase in traffic
    – exceeding the capacity of the network? When this occurs in centralized networks,
    there may be information bottlenecks and users may need to be taken out from the
    main server that is experiencing increased latency.


    ## Decentralized Network


    ![Image](Image00017.jpg)


    You can see this as the opposite of the first type of network which we just discussed.
    It is a network that spreads information-processing workloads to several devices
    rather than depending on just one central server. Every single device on the decentralized
    network serves as a mini central unit that also engages in independent interaction
    with other nodes.


    The implication of this arrangement is that even when one of the master nodes
    gets compromised or crashes, others will keep providing users with access to data.
    So, the failure of one or more nodes does not impede the operation of a decentralized
    network as there will be no disruptions in their operation. One of the factors
    that motivated the use of decentralized networks is the recent advancements in
    technology that empowered most devices and computers with enormous processing
    power.


    It is easy to sync most of these new devices and use them for distributed processing.
    Although decentralized networks differ significantly from centralized ones, data
    storage and processing is not uniformly distributed across the whole network.
    This type of network still depends on main servers, but there are usually more
    than one of such main servers for each network.


    ### Merits

    *   **Privacy:** One of the striking merits of decentralized networks is that
    it enhances user privacy because data storage on the network is distributed across
    various points rather than passing through one main point. Of course, data flow
    in such a network is not always easy to track across the network. Malicious actors
    would also find it difficult to attack since there is no particular target they
    can attack.

    *   **Enhanced scalability/flexibility:** Unlike centralized networks that could
    halt their operations when their main server fails, a single point of failure
    does not exist in decentralized networks. This also means that normal operations
    will continue even if a master node shuts down or gets compromised. Also, scaling
    decentralized networks is not hard because they can simply increase the number
    of devices on the network and boost their computing power. There is often no need
    for complete network shutdown during the network''s maintenance.

    *   **Increased speed:** Since it is possible for network administrators to set
    up master nodes in locations where there is high user activity instead of routing
    connections over great distances to one centralized main server, user requests
    are quickly completed in a decentralized network.


    ### Demerits

    *   **High cost of Maintenance:** When it comes to the network that is more fault-tolerant
    between decentralized networks and centralized networks, the decentralized network
    has an upper hand. But this also comes with a cost as it is often more labor-intensive
    and costly to maintain them. The foundation of decentralized networks are the
    multiple devices in the system and this eventually adds a corresponding burden
    on the IT resources of an organization. So, decentralized networks may not be
    ideal for companies that need a small system. The cost/benefit ratio of making
    use of a decentralized network will not favor such companies.

    *   **Issues of Coordination:** Bigger companies may experience coordination challenges
    and even some difficulty in directing and accomplishing collective jobs with decentralized
    networks. This is as a result of the fact that the master nodes within a decentralized
    network operate independently and may actually fail to communicate with the others.


    ## Distributed Network


    ![Image](Image00018.jpg)


    This type of network shares some similarities with the decentralized network and
    one of such things is that it does not utilize a centralized main server and instead
    has several network owners. But one major difference between the two is that,
    unlike the decentralized network where there are master nodes, the distributed
    network comprises interconnected nodes that are all equal. So, data ownership
    as well as the network''s computational resources are distributed across all nodes
    in the network equally.


    Sometimes, the phrase "distributed network" is referred to as a network that is
    distributed geographically while adopting a top-down node hierarchy structure.
    But in most cases where it is used, it applies to a type of network that evenly
    distributes computational resources across different node locations.


    The absence of a separate class of master nodes or a centralized server in a distributed
    network implies that the task of data processing is the responsibility of all
    users in the network – crowdsourced. Every node on the network enjoys equal access
    to data. In a distributed network, all participant nodes partake in all decision-making
    processes as they can vote to allow a new state. The aggregate results of the
    decisions of all nodes will determine the final behavior of the entire system.


    The network''s consensus mechanism is also responsible for determining the particular
    processes by which participants vote and make decisions in a distributed network.
    However, it is crucial to know that distributed networks are highly fault-tolerant
    and secure as a result of their truly decentralized nature. While they have similar
    merits and demerits with decentralized networks, it is at a higher level in both
    cases.


    ### Merits of Distributed Networks

    '
  trans: '


    # 网络架构：中心化、去中心化与分布式


    ## 中心化网络


    ### 优点

    *   **一致性：** 考虑到中心化网络的层级结构——自上而下，客户端节点与主服务器之间的交互可以轻松实现标准化。这最终会带来更流畅、更一致的最终用户体验。根据网络的优先级识别并消除网络中的无关活动也并不困难，因为跟踪和收集网络中的数据过程非常直接。


    ### 缺点

    中心化网络的一些缺点也促使个人和企业探索其他类型的网络。以下是一些主要缺点：


    *   **安全风险增加：** 单点故障的存在增加了因网络安全威胁（如 DDoS 攻击）导致安全中断或漏洞的可能性。原因在于，恶意行为者只需攻击一个源头——即主服务器。此外，用户数据存储在单个服务器上意味着中心化网络经常会遇到隐私问题。当主服务器损坏或离线时，可能会发生永久性数据丢失。

    *   **停机时间增加的风险：** 中心化网络的主服务器也会导致长时间停机的问题。服务器崩溃会发生什么？当然，会导致整个网络关闭。这将影响整个网络，因为客户端节点可能无法发送或接收信息。此外，每当需要进行服务器维护时，公司可能会暂时关闭其主服务器。这种临时关闭可能会导致服务中断，从用户的角度来看，进一步降低了整个网络的可靠性，尤其是随之而来的不便。

    *   **可扩展性限制：** 通常很难将中心化网络扩展到特定点之外。原因在于，公司需要增加服务器的存储容量、处理能力，甚至为中心服务器添加更多存储，然后才能超越其现有节点进行扩展。但当网络流量急剧增加——超过网络容量时会发生什么？在中心化网络中发生这种情况时，可能会出现信息瓶颈，用户可能需要从经历延迟增加的主服务器中移出。


    ## 去中心化网络


    ![Image](img/Image00017.jpg)


    你可以将其视为我们刚才讨论的第一种网络类型的对立面。它是一种将信息处理工作负载分散到多个设备上，而不是仅依赖单个中央服务器的网络。去中心化网络上的每个设备都充当一个微型中心单元，也与其他节点进行独立交互。


    这种安排的含义是，即使其中一个主节点受到攻击或崩溃，其他节点仍将继续为用户提供数据访问。因此，一个或多个节点的故障不会阻碍去中心化网络的运行，因为其运行不会中断。促使使用去中心化网络的因素之一是近期技术的进步，赋予了大多数设备和计算机巨大的处理能力。


    同步这些新设备中的大多数并将其用于分布式处理很容易。尽管去中心化网络与中心化网络有显著差异，但数据存储和处理并未在整个网络中均匀分布。这种类型的网络仍然依赖主服务器，但每个网络通常有不止一个此类主服务器。


    ### 优点

    *   **隐私：** 去中心化网络的显著优点之一是增强了用户隐私，因为网络上的数据存储分布在各个点上，而不是通过一个主点。当然，此类网络中的数据流并不总是容易在整个网络中追踪。由于没有特定的攻击目标，恶意行为者也会发现攻击很困难。

    *   **增强的可扩展性/灵活性：** 与主服务器故障时可能停止运行的中心化网络不同，去中心化网络中不存在单点故障。这也意味着即使主节点关闭或受到攻击，正常操作也将继续。此外，扩展去中心化网络并不难，因为它们可以简单地增加网络上的设备数量并提升其计算能力。在网络维护期间，通常不需要完全关闭网络。

    *   **速度提升：** 由于网络管理员可以在用户活动频繁的位置设置主节点，而不是将连接路由到遥远的单个中心化主服务器，因此用户请求在去中心化网络中能快速完成。


    ### 缺点

    *   **高昂的维护成本：** 就去中心化网络和中心化网络哪个更具容错性而言，去中心化网络占上风。但这也伴随着成本，因为维护它们通常更费人力且成本更高。去中心化网络的基础是系统中的多个设备，这最终给组织的
    IT 资源增加了相应的负担。因此，去中心化网络可能不适合需要小型系统的公司。对于此类公司而言，使用去中心化网络的成本/收益比将不划算。

    *   **协调问题：** 大公司可能会遇到协调挑战，甚至在使用去中心化网络指导和完成集体任务时遇到一些困难。这是由于去中心化网络中的主节点独立运行，实际上可能无法与其他节点通信。


    ## 分布式网络


    ![Image](img/Image00018.jpg)


    这种类型的网络与去中心化网络有一些相似之处，其中之一是它不使用中心化的主服务器，而是有多个网络所有者。但两者的一个主要区别在于，与存在主节点的去中心化网络不同，分布式网络由地位平等的互联节点组成。因此，数据所有权以及网络的计算资源在网络中的所有节点之间均等分布。


    有时，“分布式网络”一词指的是采用自上而下节点层级结构的地理分布式网络。但在大多数使用场景中，它适用于一种将计算资源均匀分布在不同节点位置的网络类型。


    分布式网络中不存在单独的主节点类别或中心化服务器，这意味着数据处理的任务是网络中所有用户的责任——众包。网络上的每个节点都享有平等的数据访问权。在分布式网络中，所有参与节点都参与所有决策过程，因为它们可以投票允许新状态。所有节点决策的聚合结果将决定整个系统的最终行为。


    网络的共识机制还负责确定参与者在分布式网络中投票和决策的具体过程。然而，至关重要的是要了解，由于其真正的去中心化本质，分布式网络具有高度的容错性和安全性。虽然它们与去中心化网络具有相似的优点和缺点，但在两种情况下程度都更高。


    ### 分布式网络的优点


    '
