    \ the health sector was and the need for an urgent improvement in the healthcare\
    \ sector. In the United States, for instance, it is estimated that total healthcare\
    \ expenditure was about $3.55 trillion in 2017 and there are predictions that\
    \ in 2025, it will exceed $5.5 trillion. Healthcare is generally a huge market\
    \ not just in the US but in other countries as well.\n\nUnfortunately, this crucial\
    \ aspect of our lives is considered to be highly inefficient. Estimates from the\
    \ Institute of Medicine show that between 20-30 percent of the total funds spent\
    \ on healthcare is either wasteful or results in poor outcomes. So, how do healthcare\
    \ organizations incur these costs? Some of these excessive costs include:\n\n\
    *   Overpriced medical tests\n\n*   Medical fraud\n\n*   High administrative fees\n\
    \n*   Missed prevention opportunities\n\n*   Useless treatments\n\nSome estimates\
    \ show that the healthcare industry spends about $975 billion on duplicating services\
    \ which is caused by poor communication between hospitals and doctors. In the\
    \ UK the NHS faced a £30 billion funding shortfall despite having underutilized\
    \ data assets that exceeded this value. Blockchain technology can help to increase\
    \ the efficiency of healthcare delivery. It has the potential to also unlock the\
    \ research potential of NHS data assets and provide social benefits.\n\nMost healthcare\
    \ institutions store patients' data in silos in private healthcare and NHS Trusts.\
    \ There is actually a low level of integration or data sharing in a way that can\
