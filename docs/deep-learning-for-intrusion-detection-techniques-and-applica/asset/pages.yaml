    ANNs are well-known ML techniques that mimic the mechanism of learning in living
    organisms [4]. According to Arthur Samuel, ML is a field of study in which algorithms
    infer, from the input data, how to perform a specific task, without being specifically
    programmed for the task [5]. ML—a subdomain of AI that refers to machines or systems
    resembling human intelligence—emphasizes the development of a system (built upon
    data) that learns or improves performance. It is a data-driven technology that
    works on large amounts of data—which is crucial for ML—and helps organizations
    make better decisions. It identifies various patterns on available data [2].


    ML empowers the computer with the capability to learn without being programmed
    explicitly. It is a system wherein the machines/computers learn models without
    human supervision—known as unsupervised learning where “algorithms are tasked
    with finding patterns and relationships within the data without any prior knowledge
    of the data’s meaning.” The purpose of such a process is to understand the structure
    beneath the data, and analyze and cluster datasets with the help of ML algorithms
    that help find hidden patterns and data [2].


    DL is a complex subnetwork of ML that can learn hierarchical feature representations
    and hidden sequential relationships bypassing the TCP/IP (Transmission Control
    Protocol/Internet Protocol—a fundamental framework for networking) information
    onto several hidden layers. It has achieved substantial results in long-standing
    AI tasks in the fields of speech recognition, image processing, natural language
    processing (NLP), and many others [6].


    The idea of DL is rooted in ML research starting from the mid-1940s and early
    stages of cybernetics to the contemporary research on AI and neural networks in
    the brain. DL refers to attempts to develop AI in machines to learn from experience
    and operate in terms of conceptual hierarchy. It means multiple singular experiences
    are logically linked together, revealing overreaching dimensions that were hidden
    behind these singularities. It creates connects between different fields of knowledge
    like the neurons do in the brain [7]. In DL techniques, which are a subset of
    ML, the algorithm interprets data like humans do by using ANNs; for example, virtual
    assistants, remote switches, automated cars, voice recognition, and personalized
    e-commerce recommendations are some of its key features [8].


    # 5.2.1 Neural Network Architectures


    Neural networks are a well-known subset of ML algorithms, which are inspired by
    the human brain. Here biological neurons (nerve cells) respond to the activation
    of other neurons that they are connected to [9].'
