    # 3.2.4 Artificial Neural Networks (ANNs) as the Core of Deep Learning


    ANNs form the foundation of deep learning, drawing inspiration from the architecture
    of the human brain. These networks consist of interconnected processing units,
    known as neurons or nodes, which are organized into distinct layers. Each neuron
    performs computations on the received input data and transmits the results to
    the subsequent layer. The fundamental capability of ANNs lies in their ability
    to automatically identify complex patterns and relationships within data by adjusting
    internal parameters through a learning process [29].


    # 3.2.4.1 Structure of ANNs


    A typical ANN is composed of three primary types of layers as follows:


    +   1) **Input Layer**: This layer receives raw data and forwards it to the subsequent
    layers without performing any transformation. Each neuron in this layer represents
    a feature or attribute of the data input.

    +   2) **Hidden Layers**: These intermediate layers extract meaningful features
    by applying weighted computations and activation functions. The depth and number
    of hidden layers define the complexity of the model. Deep learning models contain
    multiple hidden layers, enabling them to learn hierarchical representations of
    data [17].

    +   3) **Output Layer**: The final layer generates predictions or classifications
    based on the learned features from the hidden layers. The number of neurons in
    this layer depends on the nature of the problem, such as binary classification,
    multiclass classification, or regression [1].


    # 3.2.4.2 Working Mechanism of ANNs


    The core functionality of ANNs relies on mathematical computations involving weights,
    biases, and activation functions. Each neuron computes a weighted sum of its inputs
    and applies an activation function to introduce nonlinearity, allowing the network
    to learn complex patterns. The learning process is governed by an optimization
    technique called backpropagation, which adjusts the weights using gradient descent
    to minimize the error between predicted and actual outputs [30].


    The power of ANNs stems from their ability to approximate complex functions and
    generalize well to unseen data. Variants such as CNNs and RNNs extend'
