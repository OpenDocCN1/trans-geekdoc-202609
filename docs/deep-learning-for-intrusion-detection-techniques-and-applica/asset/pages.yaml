- pgno: 304
  md: 'abnormal instances, identifying patterns of similarity or dissimilarity, often
    using sophisticated mathematical techniques. Achieving robust generalization is
    a core objective of DL systems.


    DL approaches can be broadly divided into two main types: supervised and unsupervised
    learning [14].


    +   • Supervised Deep Learning: Relies on a training dataset where data instances
    are labeled, typically by human experts, which can be time-consuming and expensive.
    In this context, a label may represent a class or category a data instance belongs
    to.


    +   • Unsupervised Deep Learning: Seeks to discover hidden structures or groupings
    in data by evaluating the similarity between instances, without relying on pre-existing
    labels. It uses metrics to measure similarity or distance between data points.


    +   • Semi-Supervised Deep Learning: Combines small amounts of labeled data with
    large amounts of unlabeled data, making it useful when labeling is limited. For
    instance, a model may have labeled data only for a “yes” class while needing to
    learn from both “yes” and “no” instances.


    Based on how data is grouped, DL algorithms are further categorized into classification
    and clustering techniques.


    Classification: Identifies the category or class a new data instance belongs to,
    based on learning from labeled examples. DL models designed for classification
    are known as classifiers, but not all supervised DL models are classifiers.


    Clustering: Divides data into groups, or clusters, where items within a cluster
    are more similar to one another than to items in different clusters. This is an
    unsupervised learning technique.


    These diverse techniques, when applied in DL systems, significantly improve intrusion
    detection and decision-making processes by automating the discovery of sophisticated
    attack patterns and anomalies in vast, dynamic datasets.


    # 13.5 Vulnerabilities in Hardware and Software


    Vulnerabilities are inherent weaknesses in the design, implementation, or management
    of networked systems that expose them to potential security threats. These vulnerabilities
    typically stem from one of three primary causes [27, 28]:


    +   • Poor Design: Design flaws in hardware or software can compromise security.
    An example is the sendmail vulnerability in early UNIX versions, which allowed
    attackers to gain unauthorized privileged access to hosts.


    +   • Poor Implementation: Misconfigurations often result from inexperience, inadequate
    training, or careless work. For instance, failing to set restricted access on
    critical executable files may allow unauthorized users to tamper with them.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   - **Lack of Proper Management:** Weak policies, poor oversight, and insufficient
    monitoring are major contributors. Secure systems require structured processes
    to ensure that no single individual can control critical resources entirely, and
    that security protocols are consistently followed.


    # 13.6 Network Configuration Vulnerabilities


    Improper network configuration is a significant source of vulnerabilities [29,
    30]. The major types include:


    +   - **Weak Network Architecture:** Small organizations often begin with simple
    networks that prioritize functionality over security. As the network expands,
    unaddressed security flaws can create backdoors for attackers.

    +   - **Inadequate Data Flow Controls:** Weak or poorly implemented access control
    mechanisms, such as improperly configured access control lists (ACLs), can grant
    unauthorized access to sensitive resources.

    +   - **Poor Security Equipment Configuration:** Default settings on security
    devices like routers and firewalls often leave networks exposed. Unnecessary services
    running on hosts further increase the risk of exploitation.

    +   - **Insufficient Backup of Configuration Settings:** Without clear procedures
    for restoring device configurations, recovering from security breaches or accidental
    failures can become difficult and time-consuming.

    +   - **Unprotected Password Transmission:** Transmitting passwords over insecure
    channels allows attackers to intercept them, potentially compromising the entire
    network.

    +   - **Extended Use of Passwords:** Allowing passwords to remain unchanged for
    long periods makes them susceptible to brute force or dictionary attacks.


    # 13.7 Network Hardware Vulnerabilities


    Lapses in physical security and equipment management lead to hardware vulnerabilities:


    +   - **Inadequate Physical Protection:** Unsecured network hardware increases
    the risk of damage, theft, or tampering.

    +   - **Insecure Physical Ports:** Open USB and PS/2 ports can be exploited to
    introduce unauthorized devices or connections.

    +   - **Environmental Control Failures:** Poor temperature and humidity management
    may cause equipment failures or shutdowns to prevent damage.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   - **Weak Physical Access Controls:** Unrestricted access to network equipment
    increases the risk of tampering, theft of sensitive data, or hardware damage.

    +   - **Lack of Backup for Critical Networks:** Failure to periodically back up
    network data can result in catastrophic data loss or prolonged downtime.


    # 13.8 Network Perimeter Vulnerabilities


    A poorly defined security perimeter exposes networks to external threats [31,
    32]:


    +   - **Undefined Security Perimeter:** Without clear boundaries, controlling
    access and applying security policies become challenging, leading to unauthorized
    access.

    +   - **Misconfigured Firewalls:** Incorrect firewall settings can allow malicious
    traffic to infiltrate the network, compromising sensitive data and enabling unauthorized
    monitoring.

    +   - **Shared Control and Non-Control Traffic:** Mixing control and general traffic
    on a single network complicates configuration and compromises the reliability
    of control systems.


    # 13.9 Network Monitoring and Logging Vulnerabilities


    Inadequate logging and monitoring reduce a network''s ability to detect and respond
    to threats [33]:


    +   - **Inaccurate or Incomplete Logging:** Poor logging practices hinder post-incident
    analysis and delay mitigation efforts.

    +   - **Insufficient Security Monitoring:** Failure to continuously monitor for
    unusual activities can allow intrusions to go unnoticed until significant damage
    has occurred.


    # 13.10 Communication Vulnerabilities


    Communication pathways are prone to several vulnerabilities [34]:


    +   - **Lack of Monitoring and Control Path Identification:** Unauthorized connections
    can create hidden entry points for attackers.

    +   - **Use of Publicly Documented Protocols:** Standard protocols, such as FTP
    or Telnet, are easily analyzed and exploited using protocol analyzers.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - **Weak Authentication Mechanisms:** Inadequate verification of users,
    devices, and data enables replay attacks, spoofing, and data manipulation.

    +   - **Insufficient Integrity Checking:** Failure to verify data integrity allows
    undetected tampering during communication.


    # 13.11 Wireless Connection Vulnerabilities


    Wireless networks are particularly susceptible to the following [35]:


    +   - **Weak Authentication:** Poor mutual authentication between clients and
    access points can lead to rogue access points, allowing attackers to impersonate
    legitimate systems.

    +   - **Inadequate Data Encryption:** Unencrypted wireless data is vulnerable
    to interception, enabling adversaries to gain unauthorized access to sensitive
    information.


    By addressing these vulnerabilities with robust design, rigorous implementation,
    and consistent management practices, organizations can significantly enhance the
    security and resilience of their networked systems.


    # 13.12 Cyberattacks That Exploit Vulnerabilities


    An attack or intrusion is a sequence of operations that compromises the security
    of a network or computer system. Various classification schemes for network attacks
    have been proposed in the literature. A taxonomy or classification of attacks
    aims to provide a structured approach to understanding relationships among attacks,
    their classes, and subclasses. Attacks can generally be categorized into seven
    primary groups based on their methods of execution [36]:


    +   - **Infection:** This category includes attacks that infect the target system
    by tampering with files or installing malicious software.

    +   - **Exploiting:** These attacks overwhelm the target system with bugs or exploit
    vulnerabilities to cause system failure.

    +   - **Probe:** Attacks in this category gather information about the target
    system using reconnaissance tools. Coordinated scans are particularly dangerous
    forms of this attack.

    +   - **Cheating:** These attacks involve the use of fake identities or credentials.

    +   - **Traversal:** This category includes attacks that attempt to break into
    a system by trying all possible keys or passwords.'
