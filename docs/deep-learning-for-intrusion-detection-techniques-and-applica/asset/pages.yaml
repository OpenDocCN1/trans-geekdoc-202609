    Lavale, Pune, Maharashtra, India




    Smart environments—which include smart homes, cities, and industrial Internet
    of Things (IoT) systems—create a new way of life by integrating a comprehensive
    network of interconnected and intercommunicating devices and sensors that exchange
    data in real time. These systems are specially designed to improve efficiency,
    convenience, and sustainability. In smart homes, the heating, lighting, and security
    systems can be automated, while in smart cities, sensors monitor traffic, air
    quality, and public services (Figure 9.1). On an industrial level, industrial
    IoT optimizes manufacturing processes by collecting data about machines and production
    lines to increase productivity and safety [1]. These smart environments rely on
    a continuous data exchange system whereby devices interact with each other and
    centralized cloud platforms. Interconnectivity is a primary enabler of performance
    optimization, energy efficiency, and innovative services that drive their use.
    The vast amount of connected devices creates significant security issues. A breached
    IoT device in one aspect of the system can eventually lead to cascading failures
    across the entire ecosystem, further exposing sensitive personal, financial, and
    operational data to malicious parties. It is important to secure this environment
    against potential cyberattacks [2].


    > Deep Learning for Intrusion Detection: Techniques and Applications, First Edition.

    > Edited by Faheem Syed Masoodi and Alwi

