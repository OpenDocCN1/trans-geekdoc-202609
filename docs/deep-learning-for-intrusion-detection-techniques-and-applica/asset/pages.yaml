    # 8.5 Deep Reinforcement Learning Anomaly Detection


    Deep reinforcement learning combines the decision-making ability of RL with DL.
    DRL techniques such as DQN, double DQL, deep autoencoder Q-learning, policy gradient,
    actor-critic models, deep deterministic policy gradient (DDPG), TD3 DPG (Twin
    delayed deep DPG), meta-policy active AD, RL with CNN, and RNN are leveraged for
    smart and reliable AD specifically for video surveillance AD, network ID, finance
    AD, medical AD, textual AD, fraud detection, industrial damage detection, and
    manufacturing AD systems. Literature review reveals that there are a very few
    applications that leveraged the DRL [19].


    The deep Q-learning network method is suitable only for discrete action space
    and moreover, it overestimates action values in some circumstances. In order to
    address this overestimation issue of DQN, the double DQN method was developed
    [20]. Double deep Q-learning performs action assessment before the Q-value update
    phase. The actor-critic DRL techniques optimizes DNN integrators via concurrent
    gradient descent and the actor-learners stabilize learning.


    The literature review illustrates seventeen distinct DRL models that are leveraged
    in thirteen different applications such as general AD, ID, network AD, NID, video
    AD, cloud ID, wireless network security, building AD, industrial network control,
    temporal AD, adversarial attack detection cyberattack AD, and the internet of
    things (IoT) AD [21]. The performance of the DRL models is analyzed with fifty
    different datasets applied in experiments on AD. In smart video surveillance,
    anomalous activity detection is a vital component as it recognizes abnormal activity
    when observing a continuously changing scene [22].


    Recent research works investigated the application of RCNN with DRL for real-time
    smart video AD and classification. DRL is well suited for video surveillance AD
    as the high dimensional video dataset contains raw and unlabeled anomalies, which
    are hard to handle using conventional and classical ML AD models [23].


    Generally AD can be implemented with deep reinforcement neural networks (DRNNs)
    with partially labeled anomalies and meta-policy active AD. Application of deep
    deterministic policy gradient DRL methods can be leveraged for building AD, cloud
    ID, and cyberattack detection. Cyberattack detection can be performed using DD
    PG, DQN. For NID, DQL network, DDQN, AE-DQN, DAEQ-N,'
