    \ by one neuron becomes the input for other neurons in the next layer of the network;\
    \ and this continues until the final layer produces the output of the network.\
    \ The neural network, which exists in layers, transforms the input data that exists\
    \ in a series of nonlinear transformations and allows the network to learn patterns\
    \ and complex representations of the input data [1].\n\nA neural network architecture\
    \ characterizes the structure and organization of an ANN, which is a computational\
    \ model (artificial) based on the human brain. This explains the process of data\
    \ flow through the network, connectivity of artificial neurons (units), and the\
    \ learning of the network to make predictions. The ANN architecture symbolizes\
    \ the structural arrangement of nodes (neurons) and the multiple layers that define\
    \ how an ANN processes and learns from data. The design of the ANN influences\
    \ its ability to learn complex patterns and perform tasks efficiently. [10].\n\
    \nThe key components of a neural network architecture are as follows [11]:\n\n\
    +   a) Layers—layers of neurons, i.e., input layers, hidden layers, and output\
    \ layers.\n+   \n+   b) Neurons (nodes)—basic computational units that perform\
    \ a weighted sum of their inputs, apply a bias, and pass the result through an\
    \ activation function.\n+   \n+   c) Weights and biases—weights constitute the\
    \ strength of the connections among neurons and biases allow neurons to predict\
    \ even when all inputs are zero.\n+   \n+   d) Activation function—nonlinear functions\
    \ (like ReLU and sigmoid) are used to introduce nonlinearity into the network,\
    \ empowering it to model complex relationships.\n\n# **5.2.2 Types of Neural Networks**\n\
    \nThe most widely used models in DL are (i) Feed-forward neural networks (FNNs),\
    \ (ii) convolutional neural networks (CNNs), and (iii) recurrent neural networks\
