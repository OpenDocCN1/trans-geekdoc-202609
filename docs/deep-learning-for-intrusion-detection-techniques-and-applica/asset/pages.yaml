    Historically, RNNs posed challenges in training due to their large number of parameters
    and issues such as the vanishing gradient problem. However, advancements in network
    architectures, optimization techniques, and computational capabilities have significantly
    improved their scalability. Two groundbreaking developments in 1997 shaped modern
    RNN architectures. The first, LSTM networks, introduced by Hochreiter and Schmidhuber
    [45], were specifically designed to mitigate the vanishing gradient issue, allowing
    them to learn long-term dependencies more effectively. LSTM networks incorporate
    gating mechanisms that regulate the retention and updating of information, making
    them particularly useful for detecting anomalies over extended timeframes. Unlike
    traditional RNNs, LSTM networks feature memory cells that replace standard artificial
    neurons in the hidden layer, improving their training stability.


    The second major development, bidirectional recurrent neural networks (BRNNs),
    introduced by [46], allows information from both past and future inputs to influence
    the current output. This contrasts with conventional RNNs, which rely solely on
    past inputs, making BRNNs highly effective for sequence labeling tasks in fields
    such as natural language processing. Another significant variation of RNNs is
    Gated recurrent units (GRUs), which share LSTMs’ ability to model long-term dependencies
    but with reduced computational complexity. GRUs use a simplified gating mechanism,
    which lowers computational overhead while maintaining strong performance in tasks
    such as network traffic analysis.


    Several studies have explored the application of RNNs for intrusion detection
    [47] applied a DL-based RNN approach to the NSL-KDD dataset to detect various
    network attacks. Their results demonstrated that RNN-based IDSs outperformed traditional
    classification models such as support vector machines (SVMs) and ANNs in both
    binary and multi-class classification. However, to improve'
