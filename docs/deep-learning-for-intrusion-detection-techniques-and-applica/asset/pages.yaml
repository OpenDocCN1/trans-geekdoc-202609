    # 11.5 Applications of Deep Learning-Based IDS


    The fast-paced development of wireless networks, especially IoT, 5G, and MANETs
    has thrown up new security challenges that require sophisticated intrusion detection
    solutions [20]. The problem is that we can no longer rely on the old security
    mechanisms that were built into our computers. Why? Because we no longer have
    computers the way we used to. Instead, we now have decentrally distributed networks
    that we access through a wide variety of devices, many of which are under our
    direct control—mainly smartphones and tablets, but also smart TVs, home routers,
    and a growing number of other devices that are “smart” in one way or another.
    Moreover, all of these devices have their own operating systems, software, and
    built-in security imperatives. So, in a very real way, we are all inside the IoT
    [12].


    This section covers DL techniques and their applications in IDSs. It focuses mainly
    on IoT security, 5G network security, and man-portable MANET security. It delves
    into effective DL methods and their corresponding challenges. It ranges from security
    vulnerabilities and the newly minted attack surfaces for the connected world of
    things to the potential for DL methods to offer not only improved performance
    for IDSs but also for the connected world of things.


    # 11.5.1 IDSs in IoT Security


    The IoT ecosystem consists of billions of interconnected smart devices, from wearable
    technology to industrial sensors. Often, these devices are in'
  merge: -1
  img_proc: true
