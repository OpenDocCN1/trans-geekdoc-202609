  md: 'exhaustion attacks), Exploits (system vulnerability exploitation), Generic
    (attacks on cryptographic systems), Reconnaissance (network scanning for vulnerabilities),
    Shellcode (malicious code injection), and Worms (self-replicating malware). Each
    attack type is labeled, providing a well-structured dataset suitable for training
    and evaluating intrusion detection and prevention systems (IDS/IPS). Compared
    to KDD99 and NSL-KDD, UNSW-NB15 offers significant improvements, including a balanced
    dataset, modern attack vectors, diverse network protocols (HTTP, FTP, SSH, DNS),
    and a larger feature set (49 attributes vs. 41 in NSL-KDD and 42 in KDD99). Additionally,
    it eliminates redundancy and reflects contemporary low-footprint cyber threats.


    Despite its strengths, UNSW-NB15 has some limitations. The dataset does not include
    encrypted traffic (SSL/TLS-based attacks), which is crucial in modern cybersecurity.
    Furthermore, while it covers a wide range of attack types, some behaviors remain
    simulated rather than captured from real-world incidents, which may affect generalizability.
    Another limitation is its fixed collection period (31 hours in total), which may
    not fully capture evolving attack strategies over time. However, despite these
    constraints, UNSW-NB15 remains one of the most widely used benchmark datasets
    for network security research and ML-based intrusion detection. It provides researchers
    with structured CSV files containing labeled attack data, and raw PCAP files are
    also available for deeper analysis. Overall, UNSW-NB15 represents a significant
    advancement in intrusion detection datasets, offering a more realistic and diverse
    representation of modern cyber threats compared to earlier benchmarks like KDD99
    and NSL-KDD. Different attack categories in the UNSW-NB15 are shown in Table 6.6.


