    # 11.7 Conclusion


    DL-based IDSs have emerged as a powerful new way to secure wireless networks,
    the IoT, and next-generation communication infrastructures (5G, 6G). These systems
    are not the signature-happy but mostly ineffective wired IDSs of the past that
    struggled to identify evolving cyber threats. Powering the current generation
    of our next-level IDSs are DL algorithms. Unsupervised, semi-supervised, and fully
    supervised learning strategies are used to train the systems. The key advantage
    of using DL models to perform next-generation anomaly detection is that they are
    less brittle than traditional detectors and work much better when real-world adversaries
    are up to no good. To ensure that the AI-driven (IDS is effective and practical,
    the researchers devised a multipronged approach. They developed adversarial-resistant
    DL models that counter evasion techniques and that now constitute improved security
    defenses. They optimized the models for low-power and resource-constrained environments,
    ensuring that they could be deployed in such venues as the IoT, edge computing,
    and mobile networks. They slowed down the exponential growth of the number of
    parameters in the models, thereby enhancing computational efficiency. The improved
    explainability of the models through the use of an XAI framework now ensures that
    security personnel will have an interpretable reasoning process in which to place
    their trust. They leveraged FL and edge computing to ensure that the AI-driven
    IDSs will serve privacy-preserving, decentralized solutions that are effective
    across the large and distributed architecture of the next generation of the Internet.
    This architecture—a construct of 5G and 6G, IoT, and cloud-edge systems—will serve
    as a much larger target for the penetration of even more sophisticated cyberspace
    threats.


