  md: 'Deployment of sensor nodes in the target area represents the first of several
    coordinated steps forming the operation of a WSN. Sensor nodes can be dispersed
    randomly or intentionally, depending on an application. Having placed the nodes,
    they start monitoring the ambient factors identified motion, vibrations, and changes
    in temperature. Sensors on each node convert physical phenomena into electrical
    signals, which are then converted into digital numbers by the ADCs. For this raw
    data, preliminary processing is carried out in the node to cut communication overhead
    and redundant information. This processed data can be sent over single-hop or
    multi-hop toward the sink node. In the case of single-hop communication, data
    directly moves from the sensor node to the sink node. But in the case of multi-hop
    communication, where nodes are vast in number for large-scale networks and may
    be located far away from the sink, it implies intermediate nodes forward the data.
    WSN routing protocols, like Geographical Adaptive Fidelity (GAF) and Low-Energy
    Adaptive Clustering Hierarchy (LEACH), are developed to provide energy efficiency
    and low latency while ensuring delivery. This is because sensor nodes often work
    with less battery and are difficult to replace or recharge for a time period in
    many applications. The first priority is energy efficiency. Aggregated data from
    multiple sensor nodes is processed and transmitted outside to other systems to
    be further scrutinized at the sink node. Advanced WSNs can use cloud-based platforms
    and machine learning (ML) algorithms to analyze and make decisions in real time.
    WSNs operate in domains that may pose challenges like interference, physical obstructions,
    and extreme weather. High network architecture and flexible communication schemes
    are required for these challenges to be met. In addition, WSNs are susceptible
    to attacks such as DoS, data manipulation, and eavesdropping, making security
    a significant issue.


    # 10.2 The Importance of Security in Wireless Networks


    Wireless networks are essential parts of modern communication systems and form
    the base for applications in healthcare, industry, defense, smart cities, and
    the IoT. These networks minimize the need for physical infrastructure, making
    them more flexible, scalable, and cost-effective. However, the same characteristics
    that make wireless networks attractive such as their reliance on open communication
    channels, decentralized architecture, and mobility also make them susceptible
    to a variety of security risks. The security of the wireless networks is of paramount
    importance for the following reasons:


    +   1) **Protection of Sensitive Data:** Personal, financial, or government information
    is often conducted over wireless networks. In the absence of adequate protection,
    such data may be intercepted, stolen, or changed in ways that violate privacy
    and confidentiality.'
