    c) Semi-Supervised Method in IDS: Semi-supervised learning occupies a middle ground
    between fully labeled training data in supervised learning and the absence of
    labeled data in unsupervised learning. Research has demonstrated that semi-supervised
    learning can improve the effectiveness of IDS by leveraging a limited amount of
    labeled data, thereby mitigating the associated time and cost. This becomes particularly
    advantageous in situations where obtaining labeled data is challenging or infrequent
    within various IDS scenarios.


    The use of ML in IDS brings forth various benefits, such as enhanced performance,
    adaptability, flexibility, and the capability to identify emerging attack types.
    However, there are associated challenges with deploying an ML-based IDS [18].
    Firstly, ML algorithms rely on assumptions about the data, making them susceptible
    to biases originating from historical data or prior knowledge. Dealing with outliers
    can impact the effectiveness of ML algorithms, and the detection and prevention
    of unknown attacks pose challenges due to the evolving complexity of cyber threats
    over time. The continuous growth in the complexity of attacks presents an ongoing
    challenge for ML-based IDS, and handling large datasets with millions of network
    connections can be cumbersome. High dimensionality, characterized by hundreds
    of dimensions, poses difficulties for ML algorithms, and data preprocessing is
    intricate, requiring transformation from monitoring system data to a format suitable
    for analysis. Effective detection may demand contextual characteristics beyond
    reliance solely on IP addresses. ML algorithms may not always incorporate domain-specific
    knowledge crucial for accurate intrusion detection. Lastly, the process of feature
    engineering and parameter selection may prove more critical than the actual choice
    of algorithm.


    # 1.1.5 Need for Deep Learning Based IDS


    The utilization of deep learning for intrusion detection is motivated by the limitations
    of traditional methods, such as signature-based IDS and anomaly-based IDS [19].
    While signature-based IDS excels in detecting known attacks, it struggles with
    unknown or novel threats due to pre-installed rule limitations. On the other hand,
    anomaly-based IDS is adept at identifying new attacks but often generates high
    false-positive rates [20]. Challenges in feature selection for anomaly detection
    arise from the evolving nature of attack scenarios, where features effective for
    one class may not generalize well. Additionally, the absence of labeled datasets
    from real networks hampers NIDS development. Deep learning, a subset of ML, addresses
    these challenges by employing hierarchical information-processing layers for feature
    learning. Although commonly'
