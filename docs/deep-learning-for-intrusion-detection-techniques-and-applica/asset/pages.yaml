    # 6.1 Introduction


    The increasing prevalence of security threats across the internet and computer
    networks necessitates highly dependable security measures. Intrusion detection
    systems (IDSs) and intrusion prevention systems (IPSs) are essential components
    in safeguarding modern networks, as they help in identifying and preventing a
    wide range of cyber attacks. To ensure the effectiveness of these systems, reliable
    benchmark datasets are essential for testing and evaluating their performance.
    Several well-known datasets, such as DARPA98, NSLKDD, and ISCX2012, have been
    widely used by researchers to assess IDS and IPS solutions. However, many of these
    datasets have become outdated, lack diversity in attack types, and fail to reflect
    current network threats. Additionally, some datasets suffer from limited traffic
    volume, anonymized packet payloads, or missing metadata, making them less effective
    for modern cybersecurity research. The expanding network infrastructures and the
    advancing complexity of cyber threats emphasize the necessity for high-quality,
    realistic, and publicly accessible datasets. This chapter explores the existing
    intrusion detection datasets, their strengths, and limitations. Furthermore, it
    discusses the evaluation of network traffic features and various attack categories.
    Datasets for intrusion detection include labeled data, such as network activity,
    system behaviors, and traffic logs, categorized as either malicious or benign.
    This labeling allows researchers to effectively train and test IDS models. These
    datasets encompass various domains, including conventional'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'networks, internet of things (IoT) environments, and host-based systems. Below
    are some widely used datasets for intrusion detection:


    +   1) DARPA 1998 Dataset

    +   2) KDD Cup 1999 Dataset

    +   3) NSL-KDD Dataset

    +   4) Kyoto 2006+ Dataset

    +   5) ISCX 2012 Dataset

    +   6) UNSW-NB15 Dataset

    +   7) CICIDS2017 Dataset

    +   8) CSE-CIC-IDS2018 Dataset

