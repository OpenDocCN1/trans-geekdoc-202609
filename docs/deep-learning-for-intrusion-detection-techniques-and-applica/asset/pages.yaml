    # 3.3.2.2 Neuron Activation Function


    In ANNs, the activation function plays a crucial role in determining whether a
    neuron should be activated based on the input it receives. This function introduces
    nonlinearity, allowing the network to capture intricate patterns and relationships
    within data. The mathematical representation of a neuron''s output is given by:


    $$y = f\left(\sum_{i=1}^{n} w_i x_i + b\right)$$


    where:


    +   - **x_i (Inputs):** These represent the features or signals received by the
    neuron. For instance, in an IDS, inputs might include packet size, protocol type,
    or source IP address.

    +   - **w_i (Weights):** Each input has an associated weight that determines its
    importance in the computation. During training, the model adjusts these weights
    to minimize the error.

    +   - **b (Bias):** The bias term allows the neuron to shift its activation function,
    improving the model''s adaptability to data distributions.

    +   - **∑_{i=1}^n w_i x_i + b (Weighted Sum):** Represents the total signal received
    by the neuron before activation.

    +   - **f (Activation Function):** This function introduces nonlinearity to the
    model, allowing it to learn complex data representations [19].


    # 3.3.2.3 Types of Activation Functions


    Different activation functions are used in neural networks depending on the type
    of problem being solved as follows:


    1) **Rectified Linear Unit (ReLU):**


    $$f(z) = \max(0, z)$$


    +   - Used in deep networks due to its simplicity and effectiveness.

    +   - Helps mitigate the vanishing gradient problem.

    +   - Commonly applied in CNNs [20].


    2) **Sigmoid Function:**


    $$f(z) = \frac{1}{1 + e^{-z}}$$'
