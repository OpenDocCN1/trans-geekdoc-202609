    techniques to crack passwords and detect unencrypted text, causing harm to the
    system. This highlights the significance of security of the network, both private
    and public. The firewall technique is the most common protection technique that
    is used for the protection of the private network from the public network, whereas
    IDS is used for network-related activities, credit card frauds, medical applications,
    insurance agencies, etc. [9]. The primary aim of an IDS is the identification
    of different kinds of malware at the earliest possible time, which is unachievable
    by a traditional firewall [5].


    IDS observes network traffic for prevention of malicious transactions and immediately
    sends alerts once it is observed. It is software that observes a network or system
    for malicious activities or violation of policy. Each illegal activity or violation
    is mostly recorded either centrally using a security information and event management
    tool (SIEM) system—that helps improve security by identifying potential risks,
    analyzing security incidents to understand their impact, and automating responses
    to threats—or notifying an administration. It monitors a network or system for
    prevention of malicious activity and secures a computer network from unauthorized
    use and access, including perhaps insiders. Its task is to build a predictive
    model—a classifier—capable of distinguishing between “good (normal) connections”
    and “bad connections” (attacks/intrusion) [6].'
