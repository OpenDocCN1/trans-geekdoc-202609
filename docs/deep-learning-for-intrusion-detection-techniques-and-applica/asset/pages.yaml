    This comprehensive approach to feature engineering made the DARPA dataset and
    its derivatives a valuable resource for intrusion detection research. However,
    challenges remain, particularly in mining unstructured data portions of packets
    and identifying subtle patterns in complex attacks. These limitations highlight
    the ongoing need for innovation in algorithm development and feature extraction,
    ensuring that IDSs can keep pace with the ever-evolving landscape of cyber threats.


