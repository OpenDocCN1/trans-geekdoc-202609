    # 11.2 Wireless Network Security and IDS Challenges


    Wireless networks differ from wired networks due to their unique characteristics
    and security vulnerabilities. These networks operate over open communication mediums,
    making them more susceptible to various forms of cyber threats [7]. Key challenges
    include as following:


    +   - **Limited Physical Security:** Unlike wired networks, which benefit from
    physical security measures such as controlled access, wireless networks are exposed
    to threats like rogue access points, unauthorized interception, and signal jamming.

    +   - **Decentralized and Dynamic Architecture:** Wireless networks, particularly
    IoT and MANETs, lack centralized control, making it challenging to establish consistent
    security measures across all nodes [8].

    +   - **Resource Constraints:** Many wireless devices operate with limited power
    and computational resources, reducing the feasibility of implementing complex
    security mechanisms like cryptographic encryption and DL-based IDS.

    +   - **High False Positive Rates in Traditional IDSs:** Conventional signature-based
    IDS struggle to detect novel and evolving threats, while anomaly-based IDS often
    produce false alarms due to the dynamic nature of wireless traffic [9].

    +   - **Scalability Issues:** The expansion of wireless networks, especially with
    5G and IoT, results in increased data traffic that IDS solutions must process
    in real time without degrading performance.'
