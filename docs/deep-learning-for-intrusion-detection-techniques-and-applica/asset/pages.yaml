    e) Training: The process of minimizing the discrepancy between the desired values
    and the model''s predictions by modifying the weights of the connections. Usually,
    optimization algorithms such as the Stochastic gradient descent (SGD), Adam, and
    RMSprop are used.


    # 10.5.2 Artificial Neural Networks (ANNs)


    Artificial neural networks (ANNs) are the underlying architecture for DL. At its
    core, an ANN is made up of interconnected nodes that include an input layer, one
    or more hidden layers, and an output layer. Figure 10.5 shows that information
    flows are unidirectional, from the input layer via the hidden levels to the final
    output. Each node in the network is equivalent to a neuron and connected to nodes
    in the subsequent layer. The connections are weighted, representing their strength.
    Input data is propagated through the network, and as it passes through each layer,
    the weighted sum is calculated, with an activation function controlling the output
    of each node. This continues until the last layer generates the network''s output.
    The backpropagation method optimizes the accuracy and performance of the model
    afterward. Backpropagation, the fundamental concept, facilitates learning by modifying
    weights based on prediction errors. Input data is propagated through the network,
    with weighted sums building up in each layer, where activation functions regulate
    node outputs.


    ![](img/a13b588839130d750aecd8a32b6143d9_253_0.png)


    Figure 10.5 Architecture of an ANN. Source: Ref. [27] / Soft Computing Research
    Society.'
