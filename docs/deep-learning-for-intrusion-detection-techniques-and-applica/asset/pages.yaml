    # 3.4.2.3 Deep Learning Models Commonly Used for IDSs


    +   - **Convolutional Neural Networks (CNNs)**: CNNs are particularly effective
    for analyzing traffic patterns and identifying anomalies in network data. These
    models are inspired by the visual cortex and are well-suited for processing structured
    data, such as network packets. CNNs can automatically extract spatial features
    from the data, making them highly effective at detecting patterns associated with
    attacks such as DDoS or malware [57].

    +   - **Recurrent Neural Networks (RNNs) and Long Short-Term Memory (LSTM) Networks**:
    RNNs and LSTM networks are designed to handle sequential data, such as time-series
    data or network logs. These models are particularly effective at detecting attacks
    that involve repeated patterns over time, such as brute force attacks or insider
    threats. LSTM networks are capable of learning long-term dependencies in the data,
    making them well-suited for detecting subtle anomalies that may indicate an attack
    [58].

    +   - **Autoencoders**: Autoencoders are a type of neural network used for unsupervised
    learning and anomaly detection. These models work by learning a compressed representation
    of normal data and then reconstructing it. When presented with anomalous data,
    the autoencoder struggles to reconstruct it accurately, allowing the system to
    flag it as a potential threat. Autoencoders are particularly effective for detecting
    insider threats, as they can model normal user behavior and identify deviations
    that may indicate malicious activity [59].


