    track changes in signals. An LSTM block typically has a memory cell with three
    gates: an input gate, an output gate, and a forget gate, and a hidden layer.


    +   - **Memory cell state:** The core element of the LSTM architecture is the
    memory cell. It is responsible for storing long-term data that can be carried
