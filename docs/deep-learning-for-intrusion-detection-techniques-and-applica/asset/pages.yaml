- pgno: 148
  md: 'There methodologies applied for intrusion detection are categorized into three
    major categories: (a) signature-based detection (SD) (also known as knowledge-based
    detection or misuse detection), (b) anomaly-based detection (AD), and (c) stateful
    protocol analysis (SPA) [18].


    +   a) SD uses known attacks and threats to study the patterns that act like a
    signature, the process compares patterns against captured events to identify possible
    intrusions.

    +   b) AD focuses on normal or expected behaviors as against the known behaviors
    and monitors regular activities, network connections, users, and hosts over a
    span of time. The profiles monitored can be static or dynamic and developed from
    many attributes, like failed login attempts, the count of e-mails sent, and processor
    usage. Attempted break-ins, penetration by legitimate users, masquerading, DOS,
    Trojan horse, etc. are a few examples of AD. To recognize significant attacks,
    it compares normal profiles with events observed. As it studies behaviors, it
    is also called “behaviour-based detection” by some scholars.

    +   c) SPA is considered to be the most powerful detection method, it acts on
    different layers like the network layer, application layer, and transport layer.
    “It uses the predefined vendors specification settings to detect the deviations
    of appropriate protocols and applications” [10]. Stateful indicates its ability
    to know and trace the protocol states like pairing requests with replies. The
    SPA network protocol models are originally based on protocol standards from international
    standard organizations, e.g., IETF. It is also known as specification-based detection
    [20].


    For extensive and accurate detection, IDSs apply multiple methodologies, and these
    methodologies complement each other.


