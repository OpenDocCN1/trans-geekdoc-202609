- pgno: 167
  md: '# 6 Dataset for Evaluating Deep Learning-Based Intrusion Detection


    The NSL-KDD detection dataset is much smaller in comparison to the full KDDCup99
    dataset, despite being widely used, had several flaws, including a high number
    of duplicated records (approximately 78% in the training set and 75% in the test
    set), which caused ML models to become biased toward frequent attack types and
    prevented them from effectively learning rare but critical attacks such as R2L
    and U2R intrusions. Additionally, KDD99 had an unbalanced distribution of attack
    types, where some attacks dominated the dataset, making it less suitable for realistic
    intrusion detection research. To address these issues, NSL-KDD was introduced
    as a refined dataset that removes duplicate records, balances the attack categories,
    and provides a better evaluation framework for IDS models [15, 16].


    The NSL-KDD dataset retains the same 41 network traffic features used in KDD99
    but ensures a more balanced attack representation to avoid learning bias. These
    features are divided into three main categories: basic features (such as protocol
    type, service, and duration), content-based features (such as the number of failed
    login attempts and root access requests), and traffic-based features, which analyze
    network behavior over time to detect anomalies. The dataset is structured into
    a training set (KDDTrain+) with 125,973 instances and a testing set (KDDTest+)
    with 22,544 instances, along with an additional challenge test set (KDDTest-21)
    containing 11,850 instances. NSL-KDD includes four main categories of attacks:
    DoS, which floods systems to exhaust resources (e.g., Smurf, Neptune, Teardrop);
    U2R, where attackers gain administrative access (e.g., Rootkit, Buffer Overflow);
    R2L, where unauthorized access is obtained remotely (e.g., Guess_Password, Warezclient);
    and probing (Reconnaissance), which involves scanning networks for vulnerabilities
    (e.g., Satan, Nmap, Portsweep) [17, 18]. In total, the dataset contains 39 attack
    types.


    One of the significant advantages of the NSL-KDD is its cleaner and more realistic
    dataset structure. Removing redundant records ensures that IDS models do not become
    biased toward common attack types, allowing them to generalize better to different
    forms of attacks. Additionally, the dataset contains a more balanced selection
    of difficult and easy attack records, making it challenging enough for ML models
    to improve their detection accuracy without being overly simplified. The reduction
    in dataset size compared to KDD99 also makes it computationally efficient, enabling
    researchers to train and test models more effectively without requiring massive
    processing power [19].


    Despite these improvements, NSL-KDD still has some limitations. It does not include
    modern cyber threats such as ransomware, advanced persistent threats (APTs), or
    encrypted traffic-based attacks, which are crucial for evaluating today''s IDS
    models. Additionally, because it is still based on a simulated dataset, it lacks
    the full complexity and diversity of real-world network traffic, meaning that
    models trained on NSL-KDD may not always perform well in real-life scenarios.'
  merge: -1
  img_proc: true
