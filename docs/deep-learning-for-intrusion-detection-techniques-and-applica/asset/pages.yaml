    # 1.1.4.1 Intrusion Detection Technologies


    ID technologies are generally classified into four types:


    +   - An intrusion detection system based on network.

    +   - An intrusion detection system based on host.

    +   - An intrusion detection system based on wireless technology.

    +   - An intrusion detection system based on network behavioral analysis.


    # *An Intrusion Detection System Based on Network*


    Network-based IDS (NIDS), as shown in Figure 1.4, is tasked with overseeing network
    traffic to ensure the security of network devices [11]. These systems scrutinize
    various protocols, including application, transport, and network protocols. The
    analysis in NIDS primarily occurs at the application layer, although hardware
    layer analysis is also possible. Typical components of NIDS include management
    servers, sensors, multiple consoles, and database servers. With the exception
    of sensors, these components are commonly found in other IDS technologies. Sensors
    play a crucial role in monitoring and analyzing network activities. These network
    IDSs are usually distinct physical devices separate from the systems under surveillance,
    strategically located upstream on the network. Their design is intended to monitor
    multiple systems on a shared network. NIDSs often operate covertly, escaping'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# **Table 1.1**  Difference between IDS and IPS.


    | Feature | Intrusion detection system (IDS) | Intrusion prevention system (IPS)
    |

    |---|---|---|

    | *Objective* | Detect and monitor unauthorized activities, but do not take direct
    action to prevent them. | Actively identify and prevent unauthorized activities
    by taking immediate actions, such as blocking or dropping malicious traffic. |

    | *Action Taken* | Passive: generates alerts and reports to notify administrators
    of potential threats. | Active: takes automated actions to prevent identified
    threats, such as blocking malicious packets, resetting connections, or alerting
    administrators. |

    | *Placement* | Positioned strategically to monitor network traffic but not directly
    in the traffic flow. | Placed inline within the flow of network traffic, actively
    participating in the traffic flow between the source and destination. Usually
    positioned just behind the firewall. |

    | *Manual Intervention* | Requires manual intervention from administrators to
    investigate and respond to alerts. | Minimizes manual intervention by automatically
    taking actions based on predefined security policies. |

    | *Prevention Capability* | Primarily focused on detection and reporting; does
    not actively prevent threats. | Actively prevents threats by taking immediate
    actions to block or drop malicious traffic. |

    | *Use Cases* | Suitable for environments where detection and reporting are the
    primary concerns, and immediate prevention is not critical. | Ideal for environments
    where real-time threat prevention is crucial to mitigate potential risks promptly.
    |


    ![](img/a13b588839130d750aecd8a32b6143d9_41_0.png)


    **Figure 1.3**  Intrusion detection system classification.'
