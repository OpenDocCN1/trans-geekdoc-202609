- pgno: 20
  md: '# About the Editors


    **Faheem Syeed Masoodi** is an Associate Professor of Cybersecurity at Bahrain
    Polytechnic University. He has previously served as a Senior Assistant Professor
    at the University of Kashmir, India; an Assistant Professor at the Jazan University,
    Saudi Arabia; and a Research Scientist for the NMEICT-EDRP project, sponsored
    by the Ministry of HRD, Government of India.


    Dr. Masoodi holds a PhD in Network Security and Cryptography from Aligarh Muslim
    University and completed his Master’s and Bachelor’s degrees in Computer Science
    from the University of Kashmir. His research focuses on Cryptography and Network
    Security, Intrusion Detection, Post-Quantum Cryptography, Financial Security,
    and the Internet of Things (IoT).


    Dr. Masoodi, an active contributor to the global research community, has authored
    and edited several books, book chapters, and high-impact publications with reputed
    publishers. He is also an active member of professional cryptology associations.
    His work has been recognized through prestigious fellowships, including the CEMSAC-2014
    Fellowship (Centre Henri Lebesgue, University of Rennes, France), SP-ASCRYPTO-2011
    Fellowship (Advanced School of Cryptography, University of Campinas, Brazil),
    Maulana Azad National Fellowship (MANF-2010), and the INTI Research Fellowship
    (2024), Malaysia.


    **Alwi Bahmdi** is an Associate Professor in the Department of Computer Sciences,
    College of computing (Al Qunfudhah), at Umm Al-Qura University, Saudi Arabia.
    He received his BSc (2008) degree in Computer Science from King Abdul Aziz University
    in Jeddah, Saudi Arabia, and his MSc (2010) and PhD (2014) in Computer Science,
    respectively, from Heriot-Watt University, Scotland, UK. His research interests
    include Computer Networking, Mobile Ad Hoc Networks, Wireless Sensor Networks,
    Internet of Things, Cloud Computing, Information & Cyber Security, Digital Investigations
    & Forensics, Blockchain Technology, Computer Vision, Software Engineering, Performance
    Evaluation and Automation of Accounting Procedures. He has published many papers
    in his specialized areas of MANETs as well as in other areas of Computer Science
    and Information Technology within the scope of his research and teaching activities.'
  merge: -1
