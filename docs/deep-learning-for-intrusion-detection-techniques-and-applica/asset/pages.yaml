  md: '# 5


    # Intrusion Detection Through Deep Learning: Emerging Trends and Challenges


    Achyutananda Mishra


    School of Law, Christ University, Bangalore, Karnataka, India


    # 5.1 Introduction


    Internet technology has brought the world closer than ever seamlessly connecting
    all parts of the world. Its increasing use has exposed the world to cyberattacks
    (malicious attacks)—manual or machine-generated—compromising the data and system/network
    security of individuals and institutions. Malicious cyberattacks are a serious
    security threat; malware attacks are dynamic in nature; they keep changing so
    does their methodology of attacking [1]. Cybercrime is on the rise, cybercriminals
    operate internationally with ease disrupting businesses and services, and malware
    is intentionally created, compromising the security of computer systems [2].


    The intrusion detection system (IDS) has emerged as a network security tool to
    monitor computer networks or systems for malicious attacks and detect intrusion.
    It can be a network intrusion detection system (NIDS), a host intrusion detection
    system (HIDS), or a cloud intrusion detection system. IDSs commonly employ techniques
    like signature-based detection, anomaly-based detection, and stateful protocol
    analysis. It is a software that observes network traffic to detect intrusion,
    and if it detects any unusual activity or policy violation, then it immediately
    sends an alert or blocks it. It is built on a predictive model (a classifier)
    to distinguish between “bad connections” (intrusion/attacks) and “good (normal)
    connections.” These techniques discover algorithms permitting machines to learn
    without human intervention.


    Deep learning is a breakthrough technology transforming various domains like computer
    vision, autonomous driving, healthcare, and finance. Deep learning (DL)—a cutting-edge
    and revolutionizing technology—brings substantial transformation to the IDS; it
    enables machines to understand, learn, and interact with data. It is a branch
    of machine learning based on artificial neural'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'network architecture—that simulates the learning mechanism of biological organisms—and
    the complex model and an advanced subset of machine learning algorithms to overcome
    a few shallow networks’ limitations. DL artificial intelligence (AI) mimics the
    innate neural network embedded in the human brain, enabling computers to discover
    patterns automatically and arrive at decisions from a vast amount of unstructured
    data. It can be supervised learning and unsupervised learning. In supervised learning
    the machine is trained with labeled data whereas in unsupervised learning the
    machine self-learns. Supervised learning can be a convolutional neural network
    (CNN) or a recurrent neural network (RNN), and unsupervised can be an autoencoder
    (AE), and deep belief network (DBN). It has a lot of potential to shape the future
    of the planet.


    # 5.2 Deep Learning


    DL is a branch of machine learning (ML). It works on an artificial neural network
    (ANN) architecture—a network constituted in line with the structural and operational
    principles of human neurons. These are also known as neural nets or neural networks,
    and they employ layers of interconnected nodes called neurons as shown in Fig.
    5.1. Such a network of neurons processes and learns from the data injected into
    it. Artificial neurons, known as units, are found throughout ANNs. An ANN has
    three layers namely (i) input layer, (ii) output layer, and (iii) hidden layers
    [1]. ANNs are inspired by the “nervous system of living being,” which have the
    ability of acquiring and maintaining information-based knowledge. It “can


