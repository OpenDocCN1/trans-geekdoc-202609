    # 5.7 Limitations


    Application DL for IDS has its own limitations. It can result in injustices as
    courts and the police do not know how to interpret the results of the software.


    # 5.7.1 Mr. William’s Case


    Image recognition by AI assists law enforcement agencies in the investigation
    process and complements it; police accept the hints of the computer as formal
    allegations and are not considered as evidence in a court of law. Relying on a
    piece of information from the AI image recognition software that suggested Mr.
    Williams was a shoplifter in a shop, the police were convinced and arrested him.
    Police ignored all mandatory legal and procedural safeguards and relied upon the
    facial recognition software while formally charging Mr. Williams. After this,
    IBM, Microsoft, and Amazon withdrew their facial recognition software from police
    use.


    Based on the facial recognition algorithm, Mr. Williams was arrested and made
    an accused of a crime by the police that he had not committed. According to technology
    and law experts, Mr. Williams’ case may be the first known case of an American
    being arrested wrongfully based on a defective facial match from a facial recognition
    technology. This led to debate across America leading to the announcement of the
    withdrawal of this technology by Amazon, IBM, and Microsoft from use by law enforcement
    agencies.


    According to studies by M.I.T. and the National Institute of Standards and Technology,
    or NIST, the technology works differentially for different demographics such that
    its results are relatively good for white men, whereas it is less accurate for
    other demographics; this may be partly due to lack of diversity in the images
    used to develop the underlying databases [19].'
