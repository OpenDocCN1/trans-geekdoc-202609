  md: '# # 8 Exploring Advanced Artificial Intelligence for Anomaly Detection


    There are three different GAN architectures used for AD as follows:


    +   - Standard GANs

    +   - Deep convolutional GANs

    +   - Conditional GANs


    Performance metrics to assess the GAN are as follows:


    +   - Ability to generate synthetic/realistic-looking data (either by data augmentation
    or by representation learning)

    +   - Structural similarity indices

    +   - Peak signal-to-noise ratio (SNR)

    +   - Area under the receiver operating characteristics curve (AUC-OCR)


    # ## 8.3.2 Working Principle of GANs


    The general framework of GAN has two deep neural networks(DNN) models such as
    follows:


    +   - Generative DNN (G-GAN) model

    +   - Discriminator DNN (D-DNN) model


    The G-GAN is provided with a random noise vector as input and is trained to learn
    the real normal data distribution and to generate real-looking fake examples that
    are indistinguishable from the real normal data. The D-DNN is provided with the
    fake examples generated by the G-DNN and the real normal data. The D-DNN performs
    a binary decision by comparing its inputs and generates the classification error
    as output. Both the G-DNN and D-DNN are iteratively trained to tune their weights
    and biases until reaching a Nash equilibrium [13].


    The iterative training process includes two loops namely the inner loop and the
    outer loop. In the inner loop, the D-DNN parameters are tuned to maximize classification
    accuracy in predicting correct labels for the real data and generated fake examples,
    whereas in the outer loop, the G-DNN parameters are tuned to generate the real-looking
    fake examples as indistinguishable from the real normal data [14]. The training
    of GAN is considered a zero-sum game problem in which the Nash equilibrium is
    reached once neither of the players can improve the situation. That is, the fake
    examples generated could not be distinguished from the real normal data by the
    D-DNN [15].


    The semi-supervised AD systems leverage standard GANs, deep convolutional GANs,
    and unsupervised GANs for AD, whereas the unsupervised AD systems prefer to use
    standard GANs and compare its performance with AE-based AD approaches. The supervised
    AD systems use GANs to augment the dataset for the anomalous class [16].


    GANs are leveraged for AD in applications with image datasets such as medicine,
    surveillance, and ID.'
