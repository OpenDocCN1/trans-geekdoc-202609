    posing challenges for IDSs to conduct accurate analyses. These methods come with
    drawbacks, including the need for complex analysis and substantial resource consumption
    as they track multiple sessions simultaneously. Additionally, stateful protocol
    analysis systems may not identify certain types of attacks that align with expected
    protocol behavior, such as DoS attacks involving numerous normal actions executed
    within a short period.


    Another limitation is the potential variance in the implementation of the model,
    depending on the operating system version or the type of client/server in use.


    # 1.1.4.3 Intrusion Detection Approaches


    +   - IDS based on statistics.

    +   - IDS based on rule.

    +   - IDS based on heuristics.

    +   - IDS based on pattern.

    +   - IDS based on cloud.

    +   - IDS based on machine learning.

    +   - IDS based on deep learning.


    # IDS Based on Statistics


    A statistical-based IDS functions by observing regular transactions to establish
    an authentic profile, identifying deviations from this profile as potential attacks.
    Each transaction is assigned a score measuring its deviation from normal traffic,
    triggering an alarm when the score surpasses a predetermined threshold value.
    This threshold is determined based on the count of events within a defined timeframe,
    considering various packet metrics like mean, median, mode, and standard deviation.
    The IDS monitors each packet individually to detect deviations from the expected
    flow, tracking the flow fingerprint rather than examining data traffic content.


    Statistical IDS techniques can be categorized into three main types: time series,
    multivariate, and univariate.


    # a) Univariate:


    This technique focuses on analyzing data with a single variable, creating a normal
    profile based on that metric. Univariate IDS identifies anomalies by detecting
    abnormalities in each individual metric.


    # b) Multivariate:


    This model analyses relationships between two or more measures, proving useful
    when analyzing correlated measures together enhances classification. Challenges
    in the multivariate approach include difficulty in estimating distributions for
    high-dimensional data.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'c) **Time Series:** Time series involves a sequence of measurements taken over
    a specific time period, considering an observation unusual if its likelihood of
    occurring at that time is exceptionally low.


    Statistical-based IDS offers benefits, such as detecting previously unknown attacks
    without relying on signatures, simplified maintenance without frequent updates,
    and effectiveness in detecting DoS and DDoS attacks. However, drawbacks include
    the time required to create a legitimate profile, potential changes in the legitimate
    profile over time, and the necessity for accurate and effective statistical distributions
    to ensure precision and efficiency.


    ***IDS Based on Rule***  An IDS utilizing a rule-based approach employs pre-established
    rules to recognize potential intrusions within network traffic. These rules can
    be perceived as patterns, created through artificial intelligence techniques based
    on attack patterns. Unlike signature-based IDS, which demands thousands of signatures
    to detect various attacks, a rule-based IDS can identify multiple attacks using
    a single rule. This approach requires fewer rules in comparison, making the management
    of the IDS simpler. Furthermore, this system is adept at identifying new attacks,
    as alterations in attack patterns may not be significant enough to completely
    change intrusion patterns. Employing multiple rules in an IDS might be necessary
    to ensure the identification of all potential network attacks.


    ***IDS Based on Heuristic***  The heuristic-based IDS operates by recognizing
    malicious behaviors, establishing a model for detecting acceptable behaviors,
    and flagging any deviations. This approach depends on knowledge and experience
    to effectively distinguish between normal and attack behaviors. Analysis of collected
    execution traces is conducted to identify suspicious patterns, triggering an alert
    upon detection. This method is capable of identifying both unknown (zero-day)
    attacks and known attacks, with the ability to discover and include new attack
    types in the list of malicious behaviors. However, the heuristic engine may be
    susceptible to evasion by certain attacks employing hiding techniques.


    ***IDS Based on Pattern***  The IDS employing a pattern-based approach identifies
    attacks by extracting characters, strings, and structures from collected data
    to recognize significant patterns. This approach specifies the malicious instruction
    sequences in attacks, and the identified patterns within the IDS are termed signatures.
    While the pattern-based approach is adept at swiftly and effectively detecting
    known attacks, it is less efficient in identifying most zero-day attacks due to
    the unknown nature of their patterns or signatures. The implementation of a pattern-based
    detection system is straightforward. Pattern-matching algorithms are categorized
    as multiple pattern matching and single pattern matching.'
