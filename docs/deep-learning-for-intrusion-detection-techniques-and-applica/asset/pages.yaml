    various sensitive data of users who are prone to various attacks—both internal
    and external intruders. These attacks may be manual or machine-generated, are
    becoming more diverse, and are gradually advancing in the dark, resulting in data
    breaches that go undetected. For instance, a data breach caused a $350 M loss
    to Yahoo and an estimated $70 M loss occurred because of the Bitcoin breach. Such
    cyberattacks backed by sophisticated algorithms are evolving constantly with the
    advancement of software, hardware, and network topologies including the current
    developments in the internet of things (IoT). Malicious cyberattacks pose a serious
    threat to network security that requires a reliable, flexible, and novel IDS [10].
