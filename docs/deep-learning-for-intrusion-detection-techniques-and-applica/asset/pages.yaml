  md: 'to predict which actions might go undetected. Anomaly-based methods can generate
    alerts by flagging deviations, providing a foundation for misuse detection systems.
    However, this approach is prone to high false-positive rates, as novel yet benign
    traffic patterns may also be classified as anomalies [11].


    Intrusion detection systems (IDSs) are among the most prevalent methods for detecting
    zero-day attacks. While IDSs have demonstrated effectiveness in tackling the exponential
    rise of zero-day threats, they still exhibit limitations when compared to detecting
    previously known attacks [12]. Zero-day exploits capitalize on novel vulnerabilities
    or manipulate known vulnerabilities in unforeseen ways, rendering signature-based
    IDSs ineffective since these exploits do not match existing known patterns. The
    rapid expansion of internet-connected devices further increases exposure to new
    types of attacks, raising the probability of encountering zero-day vulnerabilities
    [13]. To enhance IDS performance, researchers have increasingly turned to DL techniques.
    These approaches enable the IDS to identify previously unseen patterns and behaviors
    indicative of sophisticated attacks. This paper focuses specifically on artificial
    intelligence (AI)-based algorithms for zero-day attack detection. It reviews prior
    methodologies and introduces contemporary techniques that have emerged in recent
    years. By providing insights into various approaches and evaluating their performance,
    the work addresses a gap in comparative research on zero-day detection strategies,
    offering an up-to-date perspective on advancements in this critical area of cybersecurity.
    Zero-day attacks pose one of the most significant challenges in cybersecurity.
    These attacks exploit vulnerabilities in software or systems that are unknown
    to the vendor or security community, rendering traditional IDSs ineffective. DL,
    a subset of AI, offers a promising approach to tackling this complex problem by
    leveraging advanced algorithms capable of learning patterns and detecting anomalies
    without relying on predefined signatures [14]. Zero-day attacks are characterized
    by their novel nature and stealthy behavior. Since the vulnerabilities they exploit
    are undiscovered, there are no existing signatures or rules that can be used for
    detection. Attackers often obfuscate their payloads to bypass conventional security
    measures, increasing the difficulty of detection. The impact of zero-day attacks
    can be devastating, affecting critical infrastructure and compromising sensitive
    data before a patch is available. DL brings a paradigm shift to intrusion detection
    by focusing on data-driven pattern recognition. Unlike traditional machine learning,
    where features are manually selected, DL automates feature extraction, making
    it more adaptable to complex data. Its ability to detect anomalies and model intricate
    relationships in data positions it well for identifying previously unseen attack
    patterns. Moreover, DL models excel in handling non-linear and high-dimensional
    data, making them suitable for modern network environments [15].'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Various DL architectures are effective in zero-day attack detection. Convolutional
    neural networks (CNNs) are commonly used in image processing but can also be adapted
    for visualizing network traffic to identify spatial patterns indicative of malicious
    behavior [16]. Recurrent neural networks (RNNs) and long short-term memory networks
    (LSTMs) are tailored for sequential data, making them suitable for analyzing time-series
    data like network logs [17, 18]. Autoencoders, which learn compact representations
    of data, are ideal for anomaly detection, focusing on deviations from normal patterns
    [19]. Generative adversarial networks (GANs), comprising a generator and a discriminator,
    enhance detection by simulating potential attack scenarios [20]. Effective feature
    engineering is a cornerstone of DL-based intrusion detection. Important features
    can be extracted from network packets, including protocol types, payload sizes,
    and source-destination pairs. Flow-level features, such as duration and inter-arrival
    times, and system-level logs, capturing events and user activities, are crucial
    for building comprehensive models [21]. Preprocessing steps like normalization
    and encoding ensure data is in a suitable format for training [7].


    Several datasets are used to train and evaluate intrusion detection models. NSL-KDD,
    CICIDS 2017, CICIDS 2018, and UNSW-NB15 provide diverse and realistic traffic
    patterns that include modern attack scenarios [8, 14, 21]. Custom datasets generated
    by organizations reflect environment-specific behaviors and improve model relevance.
    DL models for intrusion detection can be trained using supervised approaches,
    which rely on labeled data, or unsupervised methods that detect anomalies without
    labels. Hybrid models combining these methods offer robust performance for identifying
    zero-day attacks. Model training and optimization involve techniques such as hyperparameter
    tuning, regularization to prevent overfitting, and cross-validation for reliable
    evaluation. Performance metrics include accuracy, precision, recall, and the F1
    score, which balance false positives and false negatives. Tools like receiver
    operating characteristic (ROC) curves and area under the curve (AUC) scores help
    visualize model performance [22]. Deploying DL models in real-world environments
    introduces additional considerations. Real-time processing capabilities, scalability
    to handle large data volumes, and mechanisms for continuous updating are critical.
    Despite their power, DL models face challenges, including data imbalance, adversarial
    attacks, and a lack of explainability. Innovations such as transfer learning,
    federated learning, and explainable AI are emerging to address these issues. DL
    offers significant advancements in detecting zero-day attacks by automating feature
    extraction, modeling complex patterns, and adapting to evolving threats. By integrating
    DL into IDS, organizations can enhance their cybersecurity posture and protect
    against sophisticated exploits. Ongoing research will continue to refine these
    techniques, making them more resilient, interpretable, and effective in safeguarding
    digital ecosystems.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 13.2 Network Vulnerabilities


    Networks are vulnerable to attacks and intrusions, both from external sources
    and within the network, due to inherent weaknesses in their design, configuration,
    or implementation. These vulnerabilities can be exploited by security threats,
    often stemming from flaws in hardware or software design. Improper configuration
    of systems, often caused by inexperience, inadequate training, or incomplete work
    by responsible personnel, further increases the risk of attack. Additionally,
    poor management of networked systems contributes to vulnerabilities. This includes
    the absence of clear policies and procedures that define who has access to resources
    and when. Insufficient monitoring and infrequent traffic checks also create opportunities
    for malicious activity to go undetected. Weaknesses in security protocols, lack
    of regular updates, and inadequate oversight all exacerbate a network’s susceptibility
    to compromise [23].


    # 13.3 Anomalies and Anomalies in Networks


    In large datasets, nonconforming patterns are commonly referred to as anomalies,
    outliers, exceptions, aberrations, surprises, peculiarities, or discordant observations,
    depending on the application domain. Among these terms, “anomalies” and “outliers”
    are frequently used in the context of anomaly-based intrusion detection in networks.
    The study of detecting these anomalies has extensive applications, including credit
    card fraud detection, healthcare claims monitoring, cybersecurity, and military
    surveillance. For example, an unusual traffic pattern in a computer network may
    indicate that a compromised system is transmitting sensitive data to an unauthorized
    destination [24]. A computer network is a complex system composed of interconnected
    entities working together to provide communication services. Any malfunction or
    compromise within these entities can lead to network anomalies, which are deviations
    from expected behavior and are often indicative of security threats. Anomalies
    can generally be categorized into two primary types: performance-related and security-related.
    Performance-related anomalies may arise from equipment malfunctions, such as router
    misconfigurations, while security-related anomalies result from malicious actions
    aimed at disrupting normal operations.


    Security-related anomalies are classified into six major categories: infection,
    exploding, probe, cheat, traverse, and concurrency.


    +   - **Infection:** Involves compromising a target system by installing malicious
    files or modifying system configurations. Examples include viruses and worms.

    +   - **Exploding:** Seeks to overwhelm a system by exploiting software bugs,
    such as buffer overflow attacks.'
