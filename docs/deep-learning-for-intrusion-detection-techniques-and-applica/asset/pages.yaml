    # 8.2  Autoencoder-Based Anomaly Detection


    Autoencoder (AE) is a powerful technique that combines generative and probabilistic
    variational modeling with deep architecture. An AE aims to learn the'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'underlying data distribution to generate consequential sample data [8]. A standard
    AE has encoder and decoder parts that can be either recurrent neural networks
    (RNNs) when dealing with time series sequential datasets or convolutional neural
    networks (CNNs) when dealing with image datasets. The encoder part has an input
    layer and a hidden layer with bottleneck a.k.a latent space layer as the final
    hidden layer. The raw input data is given to the input layer and the hidden layer
    progressively compresses the dimensionality of the input and captures important
    features and patterns. The decoder reconstructs the input by demapping the code
    to an output [9].


    The AE’s representation learning strategy can be used for dimensionality reduction,
    denoising, or even generative applications. The architecture is generally trained
    end-to-end by optimizing the input reconstruction, i.e., by minimizing a loss
    that measures a difference between the model’s output and the input. It can be
    trained with any unlabeled data. AEs can be used as techniques for unsupervised
    or semi-supervised AD. The AE has a very high receiver operating characteristic
    area under the curve (AUC ROC) without making any use of labeled datasets during
    training [10].


    # 8.2.1  Types of Autoencoders


    +   - Classical AE

    +   - Denoising AE (DAE)

    +   - Stacked convolutional AE (scAE)

    +   - Robust deep AE (RDA)

    +   - Variational AE (VAE)


    # Classical Autoencoder Models


    The input and output layers are of the same dimension as the data, while intermediate
    layers introduce smaller dimensions to create a bottleneck. This bottleneck forces
    the network to learn a compressed representation of the input data, capturing
    its essential features.


    # Denoising Autoencoder (DAE)


    Denoising AEs are designed to reconstruct clean data from corrupted inputs, making
    them robust to noise and enhancing their generalization capabilities.


    # Stacked Convolutional Autoencoder (scAE)


    It uses convolutional layers to capture spatial dependencies and hierarchical
    features in the input data, making them particularly effective for image-related
    tasks.


    # Robust Deep Autoencoder (RDA)


    An RDA aims to enhance the robustness of AE models to outliers and anomalies in
    the input data.'
