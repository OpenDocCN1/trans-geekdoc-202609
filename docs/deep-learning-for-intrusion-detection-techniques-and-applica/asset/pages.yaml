  md: '# Variational Autoencoder (VAE)


    A VAE represents a class of generative probabilistic models that extend the functionality
    of classical AEs and offer an elegant solution by simultaneously compressing data
    into a latent space and reconstructing it from its compressed form, effectively
    capturing tangled data distributions while maintaining interpretability. A VAE
    operates by encoding input data into a latent space and then reconstructing it.
    Variational AEs introduce a probabilistic interpretation of the latent space,
    enabling them to generate new data samples by sampling from the learned latent
    distribution [11].


    A VAE with GAN has a remarkable ability to learn complex latent representations
    and reconstruct original inputs using the principles of generative modeling. Variational
    AEs can learn latent representation and thereby reconstruct data samples accurately.
    Variational AEs are robust and versatile in handling complex datasets and data
    distribution. They are easier to train and do not suffer from the mode collapse
    phenomenon. But they may be less accurate than GANs.


    # 8.3 Generative Adversarial Networks Anomaly Detection


    Generative adversarial networks (GANs) can generate hard-to-acquire anomalous
    data points as it has the ability of data augmentation and representative learning
    [12]. To overcome the difficulty of unavailability of data that represents anomalous
    behavior, GANs have recently been leveraged in application domains where AD is
    applied to images, such as the health sector, industrial manufacturing, video
    surveillance, etc.


    # 8.3.1 Features of GANs


    +   - They can generate new realistic-looking data and be used for data augmentation.

    +   - They can perform representation learning.

    +   - They learn the distribution of normal data so that it can be used to detect
    outliers or anomalous ones.

    +   - They can be trained in an unsupervised manner to learn the real data distribution.

    +   - They can also be used in semi-supervised and supervised AD processes, and
    for data augmentation.

    +   - They leverage implicit density models.

    +   - GANs use image datasets for AD processes.


    The image datasets need to be pre-processed before being given as input to GANs.
    The data processing steps involve resizing, normalization, and cropping.'
