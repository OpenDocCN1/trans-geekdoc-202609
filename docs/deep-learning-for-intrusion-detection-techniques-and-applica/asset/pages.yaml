  md: '# 10.6  Deep Learning-Based Solutions for the Challenges of Intrusion Detection
    in MANETs and WSNs


    Mobile ad hoc networks (MANETs) and WSNs present significant intrusion detection
    concerns mainly because of their decentralized structure, scarce resources, dynamic
    topology, and sensitivity to various ranges of threats. Deep learning (DL) offers
    improved ways to address these issues successfully. A detailed description of
    these issues, as well as the DL-based solutions, is presented below, followed
    by a summary table.


    # 10.6.1  Use Case for Autoencoders in Resource-Constrained Wireless Networks


    Autoencoders have been quickly becoming popular in recent years, especially in
    research and practice. In wireless networks, AEs can provide an effective and
    efficient basis for intrusion detection. One way of achieving this uses AEs for
    anomaly detection [14]. Even AEs can be used to catch zero-day exploits in the
    early stages before vendors can patch software mitigating such attacks. With AE,
    we can tabulate expected error in ingested data for intrusion detection with stronger
    estimating skills. An AE is a neural network that can compress incoming data and
    learn how to reconstruct it. It learns the compressed form of the data, which
    will be used to reconstruct the original data when needed. Abnormalities in the
    data, such as noise and missing values, can cause the AE to fail to generate an
    error score. By incorporating the dimensional reduction strategy, we can achieve
    SMART IDS by means of an AE that uses hidden node values as feature vectors for
    capturing incoming threat data along with adding more sensors on nodes beyond
    the local area.


    This method uses the power of the AE to create effective data visualizations,
    which helps to reduce the computing load on devices with limited resources [3].
    By focusing on spotting odd activity instead of complex classification, the AE
    can identify harmful actions using less energy and fewer computing resources [17].
    This is key for building better security protocols in areas like IoT and sensor-based
    systems that have limited resources. Pruning, quantizing, and compressing the
    model can boost the performance of AEs further. These techniques decrease the
    size of the model and the complexity of computations, making them fit for use
    on devices with limited resources. With the natural advantages of AEs and these
    optimization methods, we can enhance the security of resource-limited wireless
    networks without greatly impacting their limited resources [15]. Similarly, some
    unsupervised AE frameworks were proposed that mitigate DDoS and zero-day attacks
    in IoT networks [16]. To detect the anomalous data patterns on mobile'
  merge: -1
  img_proc: true
