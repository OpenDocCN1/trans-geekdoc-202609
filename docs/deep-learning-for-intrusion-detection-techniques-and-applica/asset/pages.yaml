    that it cannot offer accurate detection and is ineffective for the attacks of
    the present day [21].


    To identify intrusions in networks, the intrusion detection method uses software
    and hardware. The data available online are used to extract features for classification-based
    intrusion detection models. ML methods—supervised and unsupervised, and DL models—are
    frequently utilized in IDSs. Hybrid techniques developed by scholars combining
    algorithms like support vector machines (SVM), particle swarm optimization (PSO),
    and k nearest neighbor (KNN) have enhanced the efficiency of IDSs enhancing the
    performance of ML models. The NSLKDD enhancing the performance of ML models. The
    NSLKDD'
