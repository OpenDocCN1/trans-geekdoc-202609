    # 3.3.4 Gradient Descent: The Backbone of Learning in Neural Networks


    To optimize the parameters of an ANN, gradient descent is employed. This iterative
    optimization algorithm seeks to minimize the loss function by updating model parameters
    in the direction of the negative gradient. The general weight update rule in gradient
    descent is given by:


    $$w_{ij}^{(t+1)} = w_{ij}^{(t)} - \eta \frac{\partial E}{\partial w_{ij}}$$


    +   - $w_{ij}^{(t)}$, represents the weight at iteration $t$.

    +   - $w_{ij}^{(t+1)}$, is the updated weight.

    +   - $\eta$ (learning rate) controls the step size of updates.

    +   - $\frac{\partial E}{\partial w_{ij}}$, is the gradient of the loss function
    with respect to the weight.


    Gradient descent has several variants to improve convergence efficiency as follows:


    +   1. **Batch Gradient Descent (BGD)**: Updates weights after computing the gradient
    using the entire dataset. While stable, it is computationally expensive for large
    datasets [40].

    +   2. **Stochastic Gradient Descent (SGD)**: Updates weights after processing
    each training sample. This introduces noise but allows faster convergence and
    escapes local minima more easily [41].

    +   3. **Mini-Batch Gradient Descent (MBGD)**: A compromise between BGD and SGD,
    where updates are performed after computing the gradient over small batches of
    data. This approach balances efficiency and stability [42].'
