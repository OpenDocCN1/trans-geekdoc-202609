  md: '# 5.7.2 Challenges


    Intrusion detection frameworks suffer from significant challenges due to high-dimensionality
    of data in the face of an increasing number of attacks and incursions; reduction
    of dimension helps achieve better results in terms of accuracy, for example, by
    “removing dimensions from correlation and information gain, ANN is applied to
    the KDD99 dataset produced better results” [29]. The scope of intrusion detection
    mechanism becomes very limited as datasets (existing or proposed) are either contrived
    or biased and there is no standard validation mechanism for it, and complete accuracy
    is difficult to accomplish [22].


    The process of DL has some inherent challenges such as (i) for training and efficient
    performance it needs a lot of data which has inherent risks; (ii) the agent involved
    in deep reinforcement learning self-learns and explores to achieve rewards, and
    maintaining a balance between is difficult; (iii) maintaining safety and ethics
    is a cause of concern, as the agent, by learning unintended behaviors may result
    in wrong actions; and (iv) real-life situations are often unpredictable and uncertain,
    which can impact the efficiency of a model [30].


    DL is a very significant tool for intrusion detection, but it has its own share
    of challenges to address that can be as follows:


    +   - Maintaining accuracy.

    +   - Self-learning may become insufficient in the light of new forms of attack
    as it may work on outdated data.

    +   - Generalization becomes a challenge as labeling all problems into algorithms
    is difficult.

    +   - How the neural network arrives at a conclusion/solution.

    +   - It consumes a lot of power and is costly.

    +   - Legal and regulatory as it has cross-border ramifications.


    # 5.8 Conclusion


    Like any other tool, DL, to serve greatest benefit and avoid harm must be used
    with diligence and responsibility. DL has considerably improved the IDSs. Given
    the diversity and complexity of threats, it is very difficult to design a comprehensive
    IDS. The increased threat to the national and international network system is
    a cause of concern. As the entire intrusion detection mechanism relies upon datasets,
    based on scientific principles, there is a need to have a validation/authentication
    mechanism for it.'
