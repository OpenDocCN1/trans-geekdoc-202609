    # *IDS Based on Cloud*


    Cloud computing technology offers efficient delivery of online services with advantages
    such as 24/7 data access, pay-as-you-go, and cost reduction. It encompasses three
    primary service categories: IaaS (Infrastructure as a Service), PaaS (Platform
    as a Service), and SaaS (Software as a Service). IaaS provides infrastructure
    resources like networks, computing devices, and storage, PaaS offers a platform
    for utilizing various algorithms, and SaaS enables users to perform tasks online.
    Building IDS in cloud environments has multiple benefits, allowing the detection
    of malicious network actions from diverse viewpoints and overcoming limitations
    of traditional intrusion detection methods. Public and private clouds enable simultaneous
    detection of various network attacks with high efficiency.


    The IDS based on cloud technology comprises three main components: the user''s
    data collector, the cloud IDS, and the cloud service. The user''s data collector
    gathers network packets, which are then sent to the cloud service for filtering,
    standardization, and validation. The cloud service processes and standardizes
    the collected data before transmitting it to the cloud intrusion detection component.
    This component includes an analysis engine, a signature database, and a service
    console. The analysis engine examines packets to detect intrusions. Although this
    approach is in its early stages, future integration with IDS is essential to enhance
    model performance.


    # *IDS Based on Machine Learning*


    Machine learning (ML) involves the automated analysis of data using algorithms,
    eliminating the need for human intervention. It encompasses various methods, including
    unsupervised learning that utilizes unlabeled data, supervised learning that relies
    on labeled data, and semi-supervised learning, which combines both labeled and
    unlabeled data [16]. These methods aim to automate the data analysis process through
    algorithmic approaches. In the realm of intrusion detection, the application of
    ML is a recent development, with numerous algorithms and techniques available
    for IDS . Examples include support vector machines, k-nearest neighbors, Bayesian
    algorithms, neural networks, genetic algorithms, decision trees, and fuzzy logic.


    Machine learning methods, empowered by training data, can recognize intricate
    patterns due to their advanced pattern-matching capabilities. ML involves the
    extraction of insights and knowledge from large datasets. ML models encompass
    a collection of techniques, procedures, or intricate transfer functions that can
    be employed to identify significant patterns in the data or predict behaviors.'
