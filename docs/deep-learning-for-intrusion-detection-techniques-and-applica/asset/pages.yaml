- pgno: 164
  md: 'Despite its widespread use, the DARPA IDS evaluation dataset has faced some
    criticism. One significant limitation is the lack of publicly available traffic
    generation software, which makes it difficult to assess the accuracy of the background
    traffic used in the evaluation. Additionally, the evaluation criteria did not
    consider factors such as system resource usage, ease of use, or the type of system
    being used, which are important for real-world applications. Critics like McHugh
    and Mahoney and Chan have pointed out other flaws, such as the use of synthetic
    background traffic that lacks the complexity of real-world network conditions,
    including packet storms and anomalous traffic. McHugh also criticized the reliance
    on scripts and programs for generating attacks, and the simple models used for
    background traffic, which do not adequately simulate real-world noise, potentially
    leading to an inflated detection rate. Mahoney and Chan further highlighted issues
    such as inconsistencies in packet TTL values between normal and attack traffic,
    which could make detection easier even for basic IDSs. The dataset’s isolation
    from the internet also means it misses anomalous but non-malicious traffic commonly
    seen in real-world scenarios, which could affect the realism of the dataset’s
    evaluations. While these limitations have led to ongoing discussions about the
    adequacy of the dataset for real-world testing, the DARPA dataset remains a foundational
    resource in IDS research. The inclusion of detailed system logs and file system
    snapshots in addition to network traffic allows for a more in-depth analysis of
    attack scenarios. As a result, the DARPA 1998 dataset remains a crucial resource
    for the continued advancement of network security, offering valuable insights
    for researchers and practitioners working to improve the accuracy and effectiveness
    of IDSs.


    # 6.4.2 KDD 1999


    The KDD Cup is an annual data science competition that has been running since
    1997, organized by the knowledge, discovery, and data mining (KDD) community.
    The competition provides a platform for researchers and practitioners to apply
    ML and data mining techniques to real-world datasets, focusing on challenging,
    large-scale problems. The KDDCup99 is the dataset created in 1999, based on a
    DARPA intrusion detection dataset that simulated network traffic, including both
    normal and malicious (intrusive) activities. The competition aimed to develop
    models that could classify connections as either “good” or “bad.” The motivation
    behind the dataset’s creation was to improve the capability of IDSs.


    To enhance the dataset’s utility, Stolfo et al. [7] introduced derived features
    that aid in distinguishing between normal and malicious connections. These features
    fall into several categories. Time-based traffic features, such as “same host”
    and “same service” features, analyze connections within a short time window'
  merge: -1
  img_proc: true
