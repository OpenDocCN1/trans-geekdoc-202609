    isolation and diminishes susceptibility to interference from potential attackers.


    However, their effectiveness is constrained by a restricted view of the internal
    state of the monitored systems, presenting a potential challenge in the detection
    process [12]. NIDSs frequently experience a significant number of false negatives
    and false positives. Initially, many of these IDSs rely on signature-based detection
    techniques to identify known and straightforward attacks. While network-based
    IDSs possess advanced capabilities for detecting attacks, they also come with
    limitations. For instance, they are unable to identify attacks occurring on encrypted
    network traffic and may struggle to perform comprehensive analysis during periods
    of high network traffic. Additionally, the use of stateful protocol analysis by
    IDS sensors introduces the possibility of certain events going undetected.


