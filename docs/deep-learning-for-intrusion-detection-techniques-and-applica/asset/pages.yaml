    that operate over extended intervals. Content-based features were also included
    to detect suspicious behaviors within the data portions of packets, such as failed
    login attempts, particularly useful for R2L and U2R attacks, which are often embedded
    in packet data rather than reflected in sequential patterns. Table 6.2 describes
