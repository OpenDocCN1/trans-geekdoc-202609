    In conclusion, NSL-KDD remains a widely used and improved alternative to KDD99,
    offering a more balanced, efficient, and effective dataset for evaluating intrusion
    detection systems. While it addresses several shortcomings of KDD99, its lack
    of modern attack scenarios and real-world network diversity limits its effectiveness
    in contemporary cybersecurity research.


    # 6.4.4 ISCX-2012


    The ISCX 2012 [20] intrusion detection evaluation dataset was developed by the
    Information Security Centre of Excellence (ISCX) at the University of New Brunswick
    (UNB) to address limitations in existing network security datasets. Many earlier
    datasets, such as DARPA 1998, KDD 1999, etc., were criticized for being outdated,
    unrealistic, or heavily anonymized, making them less effective for modern intrusion
    detection research. To overcome these issues, ISCX 2012 was designed using a systematic
    dataset generation approach that ensures realistic, diverse, and labeled network
    traffic, making it highly suitable for ML and IDS research.


    The dataset consists of both normal and malicious traffic, covering various network
    protocols, including HTTP, SMTP, SSH, IMAP, POP3, and FTP. It was collected over
    seven days (June 11–18, 2012) in a controlled testbed environment with 21 interconnected
    Windows workstations. Unlike many previous datasets, ISCX 2012 provides full packet
    captures (PCAP files) as well as preprocessed CSV files with labeled features.
    The dataset was designed to ensure total interaction capture, meaning that all
    network activities, including packet payloads, were recorded without anonymization,
    providing a more detailed and realistic dataset for cybersecurity research.


    A unique feature of ISCX 2012 is its profile-based traffic generation methodology.
    Instead of relying on synthetic attack insertions post-capture, the dataset was
    created by simulating real-world user and attack behaviors. Normal network traffic
    was carefully modeled based on real user activities, while attack traffic was
    executed in real time using various cybersecurity tools. This approach resulted
    in a dataset that closely resembles real-world attack scenarios.


    The dataset includes different types of attacks, such as Brute Force SSH, DDoS,
    SQL Injection, HTTP DoS (Slowloris), and Infiltration Attacks. For instance, the
    Brute Force SSH attack involved repeated login attempts to break into an SSH server,
    while the DDoS attack was executed using an IRC botnet to flood the target with
    HTTP requests. Similarly, the SQL Injection attack exploited vulnerabilities'
