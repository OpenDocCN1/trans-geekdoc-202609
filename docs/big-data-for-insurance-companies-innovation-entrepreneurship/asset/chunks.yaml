- raw: "According to the same site, the use of tools in the “Hadoop/Big data” category\
    \ is becoming more accessible. Almost half of professionals use these tools (39%\
    \ in 2016 compared to 29% in 2015 and 17% in 2014). This development is primarily\
    \ due to the growth of Apache Spark, MLlib and H2O (see [Table 1.2](#chapter01.xhtml#tab1-2)).\n\
    \n**[Table 1.2](#chapter01.xhtml#itab1-2).** *Usage statistics for big data tools\
    \ according to a survey of 2,895 respondents from the data analytics community\
    \ and vendors. The respondents were from US/Canada (40%), Europe (39%), Asia (9.4%),\
    \ Latin America (5.8%), Africa/Middle East (2.9%) and Australia/NZ (2.2%). They\
    \ were asked about 102 different tools, including the “Hadoop/big data tools”\
    \ shown here \\[PIA 16\\]*.\n\n| **\uFEFFTool** || **2016** || **2015** || **2015\
    \ –> 2016** |\n\n| --- | --- | --- | --- |\n\n| **Hadoop** || 22.1% || 18.4% ||\
    \ +20.5% |\n\n| --- | --- | --- | --- |\n\n| **Spark** || 21.6% || 11.3% || +91%\
    \ |\n\n| **Hive** || 12.4% || 10.2% || +21.3% |\n\n| **MLlib** || 11.6% || 3.3%\
    \ || +253% |\n\n| **SQL on Hadoop tools** || 7.3% || 7.2% || +1.6% |\n\n| **H2O**\
    \ || 6.7% || 2.0% || +234% |\n\n| **HBase** || 5.5% || 4.6% || +18.6% |\n\n| **Apache\
    \ Pig** || 4.6% || 5.4% || –16.1% |\n\n| **Apache Mahout** || 2.6% || 2.8% ||\
    \ –7.2% |\n\n| **Dato** || 2.4% || 0.5% || +338% |\n\n| **Datameer** || 0.4% ||\
    \ 0.9% || –52.3% |\n\n| **Other Hadoop/HDFS-based tools** || 4.9% || 4.5% || +7.5%\
    \ |\n\nContinuing to look at the data from KDnuggets \\[PIA 16\\], R appears to\
    \ be the preferred tool of data scientists for data analytics. Usually used on\
    \ an office machine with datasets of reasonable size, this language originally\
    \ designed for statisticians is perfect for exploratory analysis, because it comes\
    \ with libraries rich in algorithms for machine learning, evaluation, producing\
    \ graphs, etc. Combined with offers such as H2O (or Rserver), it is now transferrable\
    \ to the big data environment. However, Python, a computer programming language,\
    \ is growing in popularity. Being ﬂexible and open, and a generalist programming\
    \ language, it is well suited to integrating analysis tasks with Web applications\
    \ or with specific unconventional architectures. Its dedicated data science libraries\
    \ make it a serious competitor to R.\n\n### 1.4.2. *Migration towards a data-oriented\
    \ strategy*\n\nThere are still very few companies who can boast of having migrated\
    \ towards a data-oriented strategy. The specialist Internet press, informed by\
    \ digital transformation consultants with a wide overview of these changes, agrees\
    \ on four identifiable phases of big data adoption \\[DEM 16\\]:\n\n1.  1) experimentation\
    \ with the big data platform;\n\n2.  2) implementation: developing first use cases;\n\
    \n3.  3) expansion: deployment in multiple use cases;\n\n4.  4) optimization:\
    \ integration with the business IT system.\n\nThe experimentation phase is when\
    \ the potential of using a big data infrastructure is explored. The aim at this\
    \ phase is to deal with installation and configuration. The main objective is\
    \ to see how compatible the technology is with existing architecture. Such experimentation\
    \ need not cost much because all that is required are a few bottom-of-the-range\
    \ servers kitted out with open source software such as Hadoop/Spark. This experimentation\
    \ phase very often results in the use of a data storage layer with pre-existing\
    \ data, upon which a new layer of data handling is added, such as database queries.\n\
    \nOnce the technical platform has been mastered, during the second implementation\
    \ phase, the business tackles a use case that demonstrates the value of big data.\
    \ This consists of developing a data processing chain for pre-existing data, then\
    \ deploying this proof of concept in a production context. Common use cases at\
    \ this stage include detecting fraud, log analysis for improved understanding\
    \ of use patterns, predicting churn or, closer to the user experience, introducing\
    \ recommendation systems. Data analytic libraries, such as MLib for Spark \\[SPA\
    \ 16\\], have long lists of native (and optimized) algorithms for addressing these\
    \ types of problems. The objective here is to demonstrate the value added and\
    \ the economic impact of setting up a big data architecture.\n\nThe third phase\
    \ is of course generalizing use cases to different levels of the business’s value\
    \ chain. The teams in charge of big data will by now have examples of early successes\
    \ to help convince the different stakeholders in the business, and the cost of\
    \ developing a new use case will be reduced since the infrastructure already exists.\
    \ This is where business applications see the light of day, each service seizing\
    \ upon technology to optimize existing analysis, extending it, proposing new analysis\
    \ or simply gaining a better understanding of their field. A financial service\
    \ will seek to improve risk management or fraud detection, a health service will\
    \ launch targeted prevention programs, aim to reduce readmission or analyze internal\
    \ processes to improve their coordination.\n\nFinally, the last phase consists\
    \ of true integration of data analytics and its insights into the overall strategy\
    \ of the business. The improvement in business procedures and/or economic benefits\
    \ is turned into competitive advantages. Results from predictive analysis inform\
    \ decision-making. At this stage, the decision makers consult someone with responsibility\
    \ for data (the job title Chief Data Officer is starting to appear) and a dedicated\
    \ data team maintains the infrastructure and sets about solving new, ad-hoc problems\
    \ specific to the business. The data analyst, a specialist in statistics, helps\
    \ to produce dashboards displaying the data and to make best use of data processing\
    \ chains, whereas the data scientist, with expertise in mathematics, statistics\
    \ and computing, produces new data processing chains and unlocks new opportunities,\
    \ while also making sure to maintain real-time visualization of the company’s\
    \ performance.\n\n### 1.4.3. *Is migration towards a big data architecture necessary?*\n\
    \nCompanies are inevitably considering whether or not to migrate towards a big\
    \ data architecture. Does the existing business intelligence (BI) system need\
    \ replacing? As a simplification, this type of system consists of two main parts:\n\
    \n*   – the ETL process (extracting, transforming and loading data), which consists\
    \ of extracting from the company’s operational data sources all the (heterogeneous)\
    \ data that could help respond to the decision makers’ questions. The data is\
    \ then processed (cleaned, normalized, aggregated, etc.) and integrated so that\
    \ it can be loaded into the data warehouse following predefined protocols;\n\n\
    *   – the data warehouse allowing all of a company’s data to be consolidated and\
    \ integrated and hence offering a cross-cutting and integrated overview of all\
    \ aspects of the company’s business. It can be made up of several subsets called\
    \ datamarts which each characterize a defined business procedure. This data is\
    \ structured in the form of multidimensional logical schemas allowing access to\
    \ predefined indicators to be prepared, to fulfill a reporting requirement for\
    \ example, while still allowing their analysis in several dimensions (for example,\
    \ analyzing the “revenue” indicator “by region”, “by period” or “by shop”). This\
    \ modeling can be used to build multidimensional cubes (or hypercubes) on OLAP\
    \ servers, allowing significant interactivity when searching. Graphical BI tools\
    \ for analysis and reporting, like Excel, Table or Business Object, are often\
    \ used to build dashboards and reports in consultation with the warehouse.\n\n\
    The arrival of big data has been accompanied by the emergence of new analytical\
    \ processes (or workloads) that classical ETL or storage technologies would struggle\
    \ to complete:\n\n*   – exploratory analysis of raw, unmodeled and unstructured\
    \ data;\n\n*   – real-time processing, in contrast to ETL processes that run in\
    \ batches;\n\n*   – accelerated batch processing for large data volumes;"
