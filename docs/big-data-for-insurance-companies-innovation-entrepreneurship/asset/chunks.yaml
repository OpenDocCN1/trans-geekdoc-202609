    nature of these new data flows. Most articles agree on the basic three Vs (see
    \[FAN 13, FAN 14, CHE 14\]), to which the fourth V of `veracity` (attributed to
    `IBM` \[IBM 16\]]), as well as the fifth V, `value`, are added. The term “veracity”
    focuses on the reliability of the various data. Indeed, data can be erroneous,
    incomplete or too old for the intended analysis. The fifth V conveys the fact
    that data must above all create value for the companies involved, or society in
    general. In this respect, just as certain authors remind us that small volumes
    can create value (“small data also may lead to big value”, see \[GU 14\]), we
    should not forget that companies, through adopting practices suited to big data,
    must most of all store, process and create intelligent data. Perhaps we should
    be talking about `smart data` rather than big data?


    ## 1.3. Characterizing big data with the five Vs


    In our initial assessment of the big data phenomenon, it should be noted that
    the 3 Vs framework of `volume`, `velocity` and `variety`, popularized by the research
    firm `Gartner` \[LAN 01\], is now standard. We will thus start with this classical
    scheme, shown in [Figure 1.2](#chapter01.xhtml#fig1-2), before considering other
    Vs, which will soon prove to be the initial.


    ![Figure 1.1. Evolution of the interest in big data](images/fig1-1.jpg)


    **[Figure 1.1](#chapter01.xhtml#ifig1-1).** *Evolution of the interest in big
    data*


    ![Figure 1.2. The three Vs](images/fig1.2.jpg)


    **[Figure 1.2](#chapter01.xhtml#ifig1-2).** *The three Vs*


    ### 1.3.1. Variety


    In a break with tradition, we will start by focusing on `variety`, rather than
    `volume`. We refer here to the different types of data available:


    - texts

    - messages

    - calls

    - photos

    - location

    - audio

    - video

    - social statuses

    - recordings


    The explosion in data, particularly in, has brought about a variety of data. This
    is the variety of the heterogeneous nature of these new data. Today, most of data
    is not structured.


    ### 1.3.2. Volume


    If you ask a range of people to define big data, most will bring up the `volume`,
    or `quantity`. The explosion in data usage, particularly in, searches, has led
    to unstoppable growth in units: gigabytes, terabytes, petabytes, exabytes, and
    even zettabytes (a zettabyte is $10^{21}$ bytes!).


    [Figure 1.3](#chapter01.xhtml#fig1-3) shows an almost exponential growth in the
    interest of people using the search engine.


    **[Figure 1.3](#chapter01.xhtml#ifig1-3).** *Internet usage has also exploded
    in just years*


    #### Table 1.1. Google statistics [STA 16]


    | Year | Annual number of searches | Average searches per day |

    | :--- | :--- | :--- |

    | 2014 | 2,095,100,000 | 5,740,000 |

    | 2013 | 2,161,530,000 | 5,992,000 |

    | 2012 | 1,873,910,000 | 5,134,000 |

    | 2011 | 1,722,070,000 | 4,717,000 |

    | 2010 | 1,324,670,000 | 3,627,000 |

    | 2009 | 953,700,000 | 2,610,000 |

    | 2008 | 637,200,000 | 1,745,000 |

    | 2007 | 438,000,000 | 1,200,000 |

    | 2000 | 22,000,000,000 | 60,000 |

    | 1998 | 3,600,000 | 9,800 |

