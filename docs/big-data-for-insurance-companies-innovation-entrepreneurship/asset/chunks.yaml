    \ these values (`u*[1]`, … ,*u[n]*).\n    - adjust a basic model ![images](images/psicirc.jpg)*[m]*(.)\
    \ on {(*x*[1], *u*[1]), … , (*x[n]*, *u[n]*)};\n    - deduce a new model ![image](images/tetacap.jpg)*[m]*(.)\
    \ = ![image](images/tetacap.jpg)[*m−*1](.) + `λ` ![images](images/psicirc.jpg)*[m]*(.).\n\
    \    End For\n4. The output is the model ![image](images/tetacap.jpg)*[M]*(.).\n\
    \nThe choice of the parameter `λ` is relatively insignificant. It is often recommended\
    \ to take it in the order of 0.1. This choice is related to that of the optimal\
    \ number of iterations: a small `λ` value will require a large number of iterations\
    \ and vice versa.\n\nThe boosting algorithm is implemented in R in the `gbm` and\
    \ `h2o` packages.\n\n### 3.5.4. Stacking\n\nStacking (also called blending) is\
    \ an approach that involves using as input to a statistical learning algorithm\
    \ the output values given in a first step by different models. This is therefore\
    \ a metamodel, which aggregates basic models in a more complex way than does the\
    \ bagging method. The original idea was developed by Wolpert [WOL 92], and this\
    \ method was then adopted in many applications. A particular case is where the\
    \ metamodel is a linear model, while the basic models are nonlinear, such as neural\
    \ networks (see [FRI 92]). The contribution of the `GBM` is that the successive\
    \ modifications are determined by applying a gradient optimization method on a\
    \ loss function `Q` to be minimized.\n\nThe stacking method is implemented in\
    \ R in the `h2o` and other related packages.\n\n## 3.6. Kohonen algorithm\n\n\
    The Kohonen algorithm is an unsupervised learning method used for the automatic\
    \ formation of maps. It was conceived in 1982 by Teuvo Kohonen as a modeling of\
    \ sensory areas, for example, the nerve connections of retinal cells towards the\
    \ cerebral cortex. If we imagine the retina as a grid of two dimensions, an important\
    \ fact is that the topology of the retina is preserved in the sense that two close\
    \ cells on the retina are connected to two close cells in the cortex.\n\nTwo families\
    \ of classification can be distinguished:\n\n- Hierarchical classification: the\
    \ number of classes is fixed a priori. We consider the `n`-group until a single\
    \ class is obtained. This gives rise to a tree.\n- Non-hierarchical classification:\
    \ the number of classes is determined by the selection of `n` elements to form\
    \ a representation.\n\n### 3.6.1. Notations and definition of the model\n\nThe\
    \ network is formed of `n` units (or neurons) arranged according to a determined\
    \ topology:\n\n[content]\nd = 1, 2 or 3 dimensions: a line, a square or a cube.\n"
  trans: "\n在此算法中，损失函数 `Q` 可以是二次的、指数的或绝对值，回归中的通常选择是二次函数。在最后一步中，中位数的使用消除了极异常预测变量的影响\
    \ [GEY 06]。\n\n1999 年，Breiman 提议将提升（boosting）视为一种全局优化算法。根据这一观点，Hastie *等* 证明了分类情况可以被看作是一种通过逐步构建的加法模型进行的近似方法，该算法最小化定义在学习基上的指数损失函数（详见\
    \ [HAS 09]）。这一原理由 Friedman 开发，最初使用的缩写为 `MART`（多重加法回归树），随后又缩写为 `GBM`（梯度提升机）[FRI\
    \ 01]。至于 `AdaBoost` 算法，它是一个通过迭代构建一系列模型的问题，使得后续模型不断改进，最终的聚合提供了一个良好的解决方案。`GBM` 的贡献在于，连续的修改是通过对待最小化的损失函数\
    \ `Q` 应用梯度优化方法来确定的（详见 [FRI 01] 或 [HAS 09]）。\n\n## GBM 算法 – 基于函数梯度下降的提升\n\n1. 选择\
    \ `∈` ![images](img/upn.jpg)^∗，`λ` ∈]0,1]。\n2. 定义：![image](img/tetacap.jpg)0 =\
    \ `argmin[*c*]` ![image](img/i0073-01.jpg)\n3. 对于 `m = 1 to M:`\n    - 计算点 (`z[i]`)\
    \ = ![image](img/tetacap.jpg)*m−*1 处梯度的反方向 ![images](img/i0073-02.jpg)。我们记这些值为\
    \ (`u*[1]`, … ,*u[n]**)\n    - 在 {(*x*[1], *u*[1]), … , (*x[n]*, *u[n]*)}; 上调整基础模型\
    \ ![images](img/psicirc.jpg)*[m]*(.)；\n    - 推导出一个新模型 ![image](img/tetacap.jpg)*[m]*(.)\
    \ = ![image](img/tetacap.jpg)*m−*1 + `λ` ![images](img/psicirc.jpg)*[m]*(.)。\n\
    \    结束循环\n4. 输出是模型 ![image](img/tetacap.jpg)*[M]*(.)。\n\n参数 `λ` 的选择相对不重要。通常建议取\
    \ 0.1。这个选择与最优迭代次数有关：较小的 `λ` 值需要大量的迭代，反之亦然。\n\n提升算法在 R 语言的 `gbm` 和 `h2o` 包中实现。\n\
    \n### 3.5.4. Stacking（叠加）\n\n叠加（也称为混合）是一种利用第一步不同模型的输出值作为统计学习算法输入的方法。因此，这是一个元模型，以比\
    \ bagging 方法更复杂的方式聚合基础模型。原始思想由 Wolpert [WOL 92] 开发，该方法随后被应用于许多场景中。一种特殊情况是元模型是线性模型，而基础模型是非线性的，例如神经网络（详见\
    \ [FRI 92]）。`GBM` 的贡献在于，连续的修改是通过对待最小化的损失函数 `Q` 应用梯度优化方法来确定的。\n\n叠加方法在 R 语言的 `h2o`\
    \ 和其他相关包中实现。\n\n## 3.6. Kohonen 算法\n\nKohonen 算法是一种用于自动形成映射的无监督学习方法。它由 Teuvo Kohonen\
    \ 于 1982 年提出，作为感官区域的建模，例如视网膜细胞指向大脑皮层的神经连接。如果我们将视网膜想象成一个二维网格，那么一个重要的事实是，视网膜的拓扑结构得到了保留，即视网膜上的两个相邻细胞与皮层上的两个相邻细胞相连接。\n\
    \n可以区分出两类分类：\n\n- 层次分类：类别的数量是预先固定的。我们考虑 `n` 组，直到获得单个类别。这产生了一棵树。\n- 非层次分类：类别的数量通过选择\
    \ `n` 个元素来形成表征来决定。\n\n### 3.6.1. 符号和模型定义\n\n网络由根据确定拓扑结构排列的 `n` 个单元（或神经元）组成：\n\n\
    d = 1, 2 或 3 维：一条线、一个正方形或一个立方体。\n"
