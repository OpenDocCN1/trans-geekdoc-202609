- raw: 'In effect, in this time of collaborative economy, another option would be
    possible for insurers: re-enchanting insurance by returning to the basics of the
    business and re-establishing mutualization on new bases. An avenue is provided
    by the current peer-to-peer trend, which encourages consumers to gather into pressure
    groups (petitions) or groups of buyers in order to generate spontaneous demands
    for tailor-made insurance products for constituted groups, or to recruit (local
    communities or communities recruited on social networks, for example). Start-ups
    have invested in this niche, which requires a good combination of leading-edge
    expertise in actuarial science and data science. These new forms of mutualization
    seem to adequately respond to clients’ needs to be recognized in their specificity,
    as well as to another societal movement for a collective search of solutions and
    collective intelligence. The approach is virtuous and emphasizes the accountability
    that will result from belonging to an identified group and will contribute in
    some kind of prevention. Even if the contribution base should logically be reduced
    (raising the thresholds of franchises and negotiating capacity for price reductions),
    insurers could find an advantage in the development of this new distribution method
    and technical mutualization. A strategy could involve promoting this development
    by being proactive with communities or creating them via the Web and social networks
    according to criteria that could facilitate the technical homogeneity of constituted
    groups. Is it necessary to accompany the peer-to-peer movement at the risk of
    accelerating the loss of insurable assets, or is it necessary to counter this
    tendency, which may be temporary?


    This active approach would counteract the loss of confidence of some with regard
    to trusted third parties and prevent them from building solutions to dispense
    with insurers, for example, the projects of certain communities that use blockchain
    technology, combined with artificial intelligence and collective intelligence,
    to replace certain insurance contracts (Dynamis PP and Teambrella in the USA),
    and this is out of any guarantee and supervision of prudential solvency. Insurers
    are very attentive to the creativity that surrounds blockchain technology, as
    it provides many opportunities to test innovative ideas that could be taken up
    within the framework of an insurance company.


    Digital transformation can be envisaged in several ways: by an in-depth reorganization
    of the company, with the training and maintenance of substantial staff, or by
    extensive robotization leading to downsizing. The extraordinarily rapid progress
    of artificial intelligence in voice and text analyses as well as in image analysis
    will soon make it possible to generalize conversational bots capable of understanding
    context and thus responding appropriately to questions. Similarly, real-time translation
    software tools are becoming more efficient. Text classification and summaries
    as well as software for extracting key information in texts convert some of the
    work of legal and management services.


    Some insurers can back away in view of difficulties they need to overcome in order
    to internally carry out a real digital transformation. The burden of managing
    their portfolios, the accumulation of outdated historical strata, habits of organizations
    and staff who are sometimes poorly responsive to the digital world, all stand
    as impediments. Why not create a new digital company in parallel with existing
    companies? Moreover, the regulations encourage new entrants: privacy by design,
    the ability to instantly provide clients with all the data the company has on
    them, the ease to meet portability requirements–everything that is so complicated
    for a historical insurer becomes simple, it is the by design of a new company
    created intentionally for this.


    Another evolution scenario, “as-a-service prevention” model, is based on the idea
    that technology will significantly reduce risks, which are the rationale behind
    insurers: autonomous cars, connected homes, etc., would drastically reduce the
    number of claims and the need for insurance. In fact, even in this scenario, there
    will be a strong need for cyber risk coverage, which will replace the risks which
    are disappearing. However, the idea of strategy in this hypothesis would be that
    the insurer becomes a “prevention specialist”, striving to lower the cost of risk
    and thus the insurance premium, by selling prevention services. The economic model
    would be completely modified, with the insurer becoming a service company, with
    an increasingly low share of “promise”. One challenge would be charging the service,
    because consumers are not used to it and have been very unfamiliar with platforms
    that provide apparently “free” services, whereas in reality, they handsomely pay
    themselves with the collected data; real digital currency.


    ### 4.7.3. *Unavoidable developments*


    Regardless of the strategic choice of the insurer, several indispensable actions
    must be carried out in governance, HR and management: the training of employees,
    new managerial methods, a change of culture to create an open data of data, a
    charter on data usage, training on good practices and rules to observe for data
    security.


    Structural reorganizations are essential not only for many insurers to streamline
    information flows between clusters and break down silos, but also for a more cooperative
    and cross-functional management, adapted to the new agility needs of companies
    and operating mode of new generations. Within the new context where strategic
    risk is increasing and time is accelerating, we must learn to navigate in uncertainty,
    innovate at the Fintech speed, accept we might make mistakes and change direction
    very quickly. We need to work on innovation with test and learn practices: failure
    must no longer be taboo, but be quickly noticed, analyzed and recognized as a
    building component for the future. Digital transformation has an important social
    aspect. Some trades will change or even disappear. Employees must be trained to
    switch to new positions or even train themselves in other occupations and improve
    their employability. One of the essential points for the security of the insurer’s
    information assets and their image is to involve all staff in the fight against
    cyber risk. This is not the subject of isolated specialists at the DIS or a DPO
    or CDO. It is the subject of every corporate “citizen”. Not only does it help
    in reducing insurers’ vulnerability to hackers and reduce cyber risk, but it is
    also the way to make everyone aware of the importance of the heritage of data
    for the company, of which each is custodian. This is an essential step to understand
    that everyone must become an actor of their valuation.


    ## 4.8. Bibliography


    \[ACP 16\] ACPR, “Autorité de contrôle prudentiel et de résolution”. Available
    at: [https://acpr.banque-france.fr/lacpr.html](https://acpr.banque-france.fr/lacpr.html),
    consulted 16 December 2016.


    \[CNI 17\] CNIL, “Commission nationale de l’informatique et des libertés”. Available
    at: [www.cnil.fr](http://www.cnil.fr), consulted 12 February 2017.


    \[CNN 17\] CNNUM, “Conseil national du numérique”. Available at: [www.cnnumerique.fr](http://www.cnnumerique.fr),
    consulted 26 February 2017.


    \[COU 16\] COUROT P., FOLLY K.A., *Big Data : opportunité ou menace pour l’assurance*,
    RB Editions, Paris, 2016.


    \[DUP 15\] DUPUIS M., BERTHELÉ E., *Big Data dans l’assurance*, Argus Editions,
    Paris, 2015.


    \[FFP 16\] FFA, “Chiffres clés”. Available at: [http://www.ffa-assurance.fr/chiffre-cle](http://www.ffa-assurance.fr/chiffre-cle),
    consulted 28 November 2016.


    \[INS 16\] INSTITUT DES ACTUAIRES. Available at: [www.institutdesactuaires.com](http://www.institutdesactuaires.com),
    consulted 25 September 2016.'
