    we will resort to regularization methods, or otherwise to sparse methods.


    ### 2.6.1. Regularized regressions


    They proceed either by projection onto subspaces or by constraining the coefficient
    vector. The estimators are biased and properties invariant under change of scale
    are lost. The data will be centered and reduced prior to the application of methods.


    ### 2.6.1.1. Principal component regression


    This is undoubtedly the oldest method, applied in econometrics by Edmond Malinvaud
    in 1964 to solve multicollinearity problems. It involves reducing the space of
    the predictors by using `q < p` principal components and then regressing `Y` response
    on these components by ordinary least squares. The principal components being
    linear combinations of predictors, we ultimately obtain a combination of predictors:


    \[2.5\] ![image](images/eq2-5.jpg)


    Coefficient ![images](images/alcirc.jpg)and ![images](images/btcirc.jpg)vectors
    are obtained simply by using the reconstruction formula `q` (truncated SVD) **X**
    = **CU***’ where **C** is the principal component matrix and **U** is the principal
    factor orthogonal matrix:


    \[2.6\] ![image](images/eq2-6.jpg)


    The symbol `+` refers to the Moore–Penrose inverse.


    Here


    \[2.7\] ![image](images/eq2-7.jpg)


    and


    \[2.8\] ![image](images/eq2-8.jpg)


    In general, `q` is selected by cross-validation, but the regression on principal
    components has the following drawback: the principal components depend only on
    the predictors and not on the response, and their ranking does not necessarily
    reflect the correlations with this response.


    ### 2.6.1.2. PLS regression


    Developed by H. and S. Wold, PLS regression resembles principal component regression,
    since data are also projected onto linear uncorrelated combinations of predictors.
    The main difference is that the PLS components are optimized to also be predictive
    of `Y`, whereas the principal components only extract the maximum variance of
    predictors without taking `Y` into account. The criterion used to obtain the first
    PLS component `t = Xw` is Tucker’s criterion:


    \[2.9\] ![image](images/eq2-9.jpg)


    As


    \[2.10\] ![image](images/eq2-10.jpg)


    we have a compromise between maximizing the correlation between `t` and `y` (regression)
    and maximizing the variance of `t` (PCA of predictors).


    The solution is as follows: for the first PLS component, the `w[j]` coefficient
    of each variable is, up to a multiplicative constant, equal to the covariance
    between `x[j]` and `y`, which ensures the consistency of signs. The following
    components are obtained by deflation, that is, by iterating the process on the
    residuals of `Y` and predictors after regression on `t`. The simplicity of the
    algorithm, which requires neither diagonalization nor matrix inversion, makes
    it possible to process massive data. We will refer to [TEN 98] for more details.


    ### 2.6.1.3. Ridge regression


    Invented by Hoerl and Kennard in the 1970s, this is a particular case of Tikhonov
    regularization: to avoid unstable coefficients, we add a constraint on their norm:


    \[2.11\] ![image](images/eq2-11.jpg)


    This is equivalent to adding a constant to the diagonal elements of **X’X** to
    “facilitate” the inversion:


    \[2.12\] ![image](images/eq2-12.jpg)


    The constant `k` is determined by cross-validation.


    ### 2.6.2. Sparse methods


    The preceding methods make it possible to obtain a function of all the variables,
    which becomes a disadvantage when `p` is very large: how can a linear combination
    of several hundreds or several thousands of variables be interpreted? Rather than
    resorting to stepwise selection techniques, the use of constraints in L[1] norm
    effectively solves the problem by enabling both selection and regularization.


    ### 2.6.2.1. The Lasso


    Lasso or least absolute shrinkage and selection operator introduced in [TIB96]
    consists of minimizing the residual sum of squares, with a bound on the sum of
    the absolute values of regression coefficients (L[1] penalty):


    \[2.13\] ![image](images/eq2-13.jpg)


    which is equivalent to:


    \[2.14\] ![image](images/eq2-14.jpg)


    When `c` decreases, the regression coefficients reduce and some are canceled due
    to the use of the L[1] norm. The parameter `c` is generally obtained by cross-validation,
    with the aim of having the best predictor of `Y`.


    Many developments followed: sparse variants of PLS regression, and also the group
    Lasso which applies in the case where the predictors are divided into blocks:
    the method then helps to eliminate entire blocks of variables.


    ### 2.6.2.2. Sparse principal component analysis (PCA) and multiple correspondence
    analysis (MCA)

