    * – 高斯（或径向）核：![image](img/i0066-01.jpg)\n\nSVM 然后扩展到了多分类情况，并在多个 R 包中开发：`e1071`、`kernlab`、`klaR`\
    \ 和 `svmpath`（这些包介绍参见 Hornik *et al.* 的文章 \\[HOR 06\\]）。\n\n## 3.5. 模型聚合方法\n\n\
    在之前的章节中，我们介绍了不同的监督学习方法，它们提供了许多可能的模型，但通常很难确定保留哪一个。与其只选择这些模型中的一个，聚合方法（或集成方法）的般原理是构建预测器集合，然后聚合它们的所有预测。在回归中，最终预测可能是不同模型给出的预测的平均值；而在分类框架内，我们可以对各种预测器提供的类别进行多数投票。这种技术仅在所选的不同基础模型给出显著不同结果时才有意义，例如决策树和神经网络等非线性方法，这些方法在复杂问题上比线性方法具有更小的偏差，但方差更高。对不同模型的聚合可以降低方差，从而降低基础模型的不稳定性。基础模型可以是不同性质，但使用决策树的方法最为成熟，包括特别的“随机森林”。我们现在介绍常用的聚合方法，重点关注两类：\n\
    \n* – 并行方法，独立地汇集基础模型，例如 bagging 和随机森林\n* – 自适应方法，每个基础模型都依赖于前一个模型。这些方法被称为 boosting。这些不同的方法被用于精算科学，特别是财产和责任保险，用于预测个人理赔和欺诈检测。\n\
    \n### 3.5.1. Bagging\n\nBagging 方法由 Breiman \\[96\\] 引入。Bagging 是自助（bootstrap）和聚合（aggregating）的缩写。给定学习样本\
    \ `L[n]` 和一个基础方法，bagging 原则是是独立地抽取 `B` 个自助样本 `L[n]`，并在每个样本上校准基础方法。与 `x[i]` 相关的预测为：\n\
    \n*\n![image](img/i0067-01.jpg) \n\n在分类上下文中，我们采用多数投票。第一情况下，它只是不同估计值的平均值。\n\n通常使用两种技术来生成自助样本：\n\
    \n* – 样本 `L[n],b]` 通过在 `L[n]` 中有放地抽取 `n` 个观测值获得，每个观测值的抽取概率为 `1/n`；\n* – 样本 `L[n],b]`\
    \ 通过在 `L[n]` 中抽取 `l < n` 个观测值（有放或不有回）获得。\n\nBagging 让弱基础方法变得有效。Biau 和 Devroye\
    \ \\[BIA 10\\] 在一个特定示例上通过数学证明了这一点：以 1-最近邻方法作为基础方法（该方法并非一致一致的），大小为 `l[n]` 的自助样本如\
    \ ![image](img/i0068-01.jpg)![image](img/i0068-02.jpg)，证明了渐近 bagged 估计是一致一致的。\n\
    \n可以使用袋外方法（out-of-bag method）来估计在测试样本上获得的模型的预测误差：这特别允许检查该误差如何随 `B` 演变，以便选择足够数量的基础模型。在\
    \ bagging 的情况下，不需要独立于 `L[n]` 的额外样本。事实上，并非所有的基础模型都包含所有观测值。因此，为了对 `L[n]` 中的观测值 (`x[i]`,\
    \ `y[i]`) 获取独立学习的预测，我们限制在基础模型集 ![images](img/capm.jpg) 中不使用该观测值进行校准的模型，则与 `x[i]`\
    \ 相关的预测为：\n\n\\[3.33\\]![image](img/eq3-33.jpg)\n\n在分类上下文中，我们采用多数投票。袋外误差则定义为：\n\
    \n* ![image](img/i0068-04.jpg)用于回归；\n* ![image](img/i0068-05.jpg)用于分类。\n\n"
