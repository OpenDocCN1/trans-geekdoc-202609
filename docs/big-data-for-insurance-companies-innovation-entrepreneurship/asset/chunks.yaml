    ## 3.5. Model aggregation methods


    In the previous sections, we have presented different methods of supervised learning,
    which offer a multitude of possible models, but it is often difficult to know
    which one to retain. Rather than selecting just one of these models, the general
    principle of aggregation methods (or ensemble methods) is to construct a collection
    of predictors and then aggregate all of their predictions. In regression, the
    final prediction may be an average of the predictions given by the different models,
    whereas within the framework of classification, we can proceed with a majority
    vote among the classes provided by the various predictors. This technique is only
    of interest if the different basic models selected give significantly different
    results, which is the case for nonlinear methods such as decision trees and neural
    networks for example, which have less bias than linear methods on complex problems,
    but a higher variance. The aggregation of different models then makes it possible
    to reduce the variance and thus the instability of basic models. The basic models
    can be of different natures, but the methods using decision trees have been the
    most developed, including specifically “random forests”. We will now present the
    usual aggregation methods, focusing on two categories:


    *   – parallel methods that bring together basic models constructed independently
    of each other, such as bagging and random forests;


    *   – adaptive methods where each basic model included in the model depends on
    the previous one and is constructed according to the latter’s performance on the
    learning set. These methods are known as boosting.


    These different methods are being used in actuarial science, particularly in property
    and casualty insurance, for predicting individual claims amounts, fraud detection
    or development of zones (see, for example, \[LEB 16\]).


    ### 3.5.1. *Bagging*


    The bagging method was introduced by Breiman \[BRE 96\]. The word bagging is a
    contraction of the words bootstrap and aggregating. Given a learning sample *L[n]*
    and a basic method, the bagging principle is to independently draw *B* bootstrap
    samples *L*[*n*,1], … , *L*[*n*,B] in *L[n]*, to calibrate the basic method on
    each of them to construct *B* predictors ![image](images/tetacap.jpg)[1](.), …
    ![image](images/tetacap.jpg)[*B*](.). The final estimator is then:


    *   − ![image](images/tetacap.jpg)(.) = ![image](images/i0067-01.jpg)in regression;


    *   − ![image](images/tetacap.jpg)(.) = *argmax [j] card* ∶ ![image](images/tetacap.jpg)*[b]*(.)
    = *j*}, in classification.


    In the first case, it is simply the average value of the different estimates,
    and in the second case, a majority vote on the *B* predictions.


    Two techniques are generally used to generate bootstrap samples:


    *   – the samples (*L*[*n*,*b*]) are obtained by drawing *n* observations with
    replacement in *L[n]*, each observation being drawn with 1/*n* probability;


    *   – the samples (*L*[*n*,*b*]) are obtained by drawing *l* observations (with
    or without replacement) in *L[n]*, with *l* < *n*.


    Bagging makes it possible to render weak basic methods more effective. This was
    demonstrated mathematically on a particular example by Biau and Devroye \[BIA
    10\]: taking the 1-nearest neighbor method as the basic method (which is not universally
    consistent) and bootstrap samples with size *l[n]* such as ![image](images/i0068-01.jpg)and
    ![image](images/i0068-02.jpg)they demonstrated that the asymptotic bagged estimator![image](images/i0068-03.jpg)is
    universally consistent.


