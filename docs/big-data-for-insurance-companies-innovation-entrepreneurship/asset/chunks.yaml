- raw: 'Insurers are often criticized for writingInsurers are often criticized for
    writing disclaimers of warranties and other important details as minor items.
    Insurers attempt to remedy this, but the very nature of the transaction, which
    takes the form of a contract, that is, a legal act, and not a tangible object,
    which makes it difficult to be simplified. The contracts of Anglo-Saxon digital
    actors are more burdensome and incomprehensible than insurance contracts, but
    the service is immediate and usually free, which simplifies the relationship,
    even if, with time, clients get “committed”, often without their knowledge.


    This undeniable legal dimension of the insurance business is a handicap in the
    client’s experience that needs to be overcome.


    ### 4.1.5. *An economic model based on data and actuarial expertise*


    Although privately owned, insurance companies play a fundamental role in social
    utility, particularly for health and welfare contracts, in addition to compulsory
    schemes. They are therefore subject to incentives or constraints from public authorities,
    through fiscal or regulatory measures.


    In health insurance, for example, the tax rate is differentiated depending on
    whether the health contracts are qualified as responsible or not responsible,
    whilst taking into account the fact that it is the public authorities who define
    the terms of reference and the basket of care that the contracts must conform
    with in order to be validated as “responsible”.


    Obviously, clients mostly choose contracts with the most competitive prices, that
    is, responsible contracts, since they are less taxed.


    In other cases, by laws or regulations, for reasons of non-discrimination or for
    the sake of solidarity, the insurer’s pricing freedom is limited by the prohibition
    of the use of certain criteria, such as gender, although it is quite discriminating
    in terms of life expectancy, or regarding medical history, via the right to oblivion
    which prevents it from being taken into account.


    The insurance business, which consists of a promise to pay an amount, usually
    unknown, if a random event occurs in the future, is based on statistics. This
    information is carefully collected and stored in structured databases. The pooling
    of different clients’ risks allows the insurer to rely on the law of large numbers
    to model its own risk by mathematical laws of probability using a few criteria
    summarizing most of the information. It also measures the risk of error of this
    modeling, which is used by the regulator to pronounce its capital mobilization
    requirement with respect to the promises of coverage made by insurers. Data is
    therefore the raw material for insurers. It is the job of the actuaries to choose
    and use them to assess and control risks, and calculate the provisions to be entered
    in the accounts while prospectively and stochastically projecting over several
    years into the future the various technical and commercial parameters to ensure
    the company’s sustainability and commitments. So far with a limited amount of
    data, insurers have effectively assessed their risks and have, in due course,
    faced the promised regulations in the event of disasters. It is obvious that the
    explosion of the digital industrial revolution data we know, called big data,
    comes to shake this established order.


    What is the usefulness of this new large amount of data for insurers?


    ## 4.2. Big data context: new uses, new behaviors and new economic models


    It is a banality to observe the digital explosion and big data phenomenon characterized
    by the 5Vs: volume, variety, velocity, veracity and value.


    The most visible manifestation of big data is the explosion of the “volume” of
    data, exponentially growing due to the power of computers and the generalization
    of the Web, smartphones, social networks, connected objects, cloud accessibility,
    etc.


    However, big data also profoundly modifies the context by the “variety” of data
    exchanged: numbers of course, as well as text, image, sound and video. Another
    characteristic is “velocity”, the speed at which information instantly and simultaneously
    reaches all corners of the planet, emanating from all sorts of issuers, individuals
    sending their vacation photos or collecting claims information by satellite. In
    the digital age, everything is instantaneous and the technologies made available
    to individuals become quite similar to those of companies.


    “Veracity” remains a focus point because data is collected without knowledge of
    their context, and this must be kept in mind in the uses that are subsequently
    made of it. All these data, shared using new algorithms and artificial intelligence,
    constitute the new source of energy of the 21st century, generating “value”.


    All economy actors are making great efforts towards extracting value from all
    these data, taking their share of the enrichment and succeeding in their digital
    transformation, notably towards taking advantage of this new data for marketing
    purposes.


    ### 4.2.1. *Impact of big data on insurance companies*


    How are insurance companies affected by big data? What impact does the digital
    world have on the activities of insurers?


    Due to their original economic model, the reverse cycle, insurers are particularly
    concerned by this digital industrial revolution since data is their raw material.
    In view of an expensive random event (a disaster), an individual or a company
    has the choice between taking up the challenge to take the risk and incur the
    cost or deciding to transfer that risk to a trusted third party for an initial
    paid price. Vendors of “promises”, who have been carefully evaluated based on
    proven methods regarding the use of statistics, are data professionals who convert
    individual risks that are difficult to bear into a controlled overall risk. In
    this regard, the provision of new data can only help insurers to do their job
    better.


    But is the impact of digital technology not of a very different nature? Is it
    not in the process of not only modifying the way the insurance business is exercised,
    but also insurance business itself?


    Insurance activities support economic and financial activities and are therefore
    largely dependent on these activities. They are at the service of individuals
    to help them face the dangers of their way of life. If the economy changes and
    people live differently, insurance needs will be different too.


    Insurance companies must therefore understand and adapt to changing needs and
    even anticipate them.


    ### 4.2.2. *Big data and digital: a profound societal change*


    Big data and the ongoing digital industrial revolution are bringing about a profound
    societal change.


    Each individual has become the node of a network and all networks are interconnected.
    This increase in the volume of communication speeds up time. A mail must be processed
    during the day. Exchanges take place through mobiles, tweets and other ultra-short
    message systems. Information is quickly outdated. This is done by headlines and
    shocking images that leave little room for feature articles, nuanced and argued
    exchanges. Everything goes fast. We no longer bear waiting. The site must give
    the information quickly without requiring a long questionnaire. The product must
    be delivered the same day or the next day. We live in the present instant, without
    much projection into the future. Digital speeds up time.


    And we get used to the service of digital platforms like Amazon, which look after
    their “client experience” and set the bar high for traditional actors.


    The insurer’s long time and its reverse cycle do not naturally fit into this new
    world of the present moment. The insurer’s rare traditional contact opportunities
    with clients (contributions and claims) cannot allow them to meet their needs
    adequately. To exist, one must be in contact. Therefore, the insurer will seek
    for contact opportunities and the digital will provide it: site, smartphone alerts,
    etc.'
