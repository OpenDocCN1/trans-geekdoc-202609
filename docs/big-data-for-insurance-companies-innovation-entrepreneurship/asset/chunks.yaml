    \ we attribute to *x* the class *i*^∗ such that:\n\n\\[3.34\\]![image](images/eq3-34.jpg)\n\
    \nwhere ∥. ∥ is a norm on ![image](images/upr.jpg)*^p*. Let us now study the Kohonen\
    \ algorithm, which determines *W[i]* vectors by a learning method.\n\n### 3.6.2.\
    \ *Kohonen algorithm*\n\nIt is an iterative learning algorithm that modifies the\
