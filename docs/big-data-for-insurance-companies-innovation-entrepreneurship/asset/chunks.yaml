- raw: 'Changes in lifestyle and consumption significantly contribute to the increase
    in the volume of available data. The digitalization of activities is only permitted
    by the adoption by policyholders of a way of life where all services must be permanently
    available, regardless of the location and in multichannel.


    This transition to an economy of immediacy is accompanied by the development of
    collaboration and continuous assessment of goods consumed. Insurance is no exception
    to the trend and is increasingly becoming a consumer good for which the valuations
    provided by insured clients will allow a greater adaptation of the guarantees
    and services offered.


    Similar to the trend observed in other sectors, insured clients tend to increasingly
    seek tailor-made services and guarantees that are perfectly adapted to their needs.
    In this context, they seem more and more inclined to make their data available
    if this can allow a greater personification of the proposals made by insurance
    companies.


    The growth in the volume of product data is exponential, each year the volume
    of data produced is more than twice the volume produced the previous year such
    that 90% of the existing data were generated over the past 2 years.


    ### 5.1.3. *Multiplication of data sources of potential interest*


    #### 5.1.3.1. *Data directly available to the insurer*


    Current developments do not call into question the acquisition of certain data
    traditionally collected by insurers:


    *   – data relating to policyholders, although pricing restrictions may exist
    in this area (for example, after the gender directive, in car insurance, gender
    can no longer be discriminatory as regards pricing, although it may continue to
    be as such with regard to reserving);


    *   – data related to insured persons or property;


    *   – data related to contracts and guarantees subscribed;


    *   – data related to premiums paid and previous claims incurred by the policyholder
    and more generally to the different financial flows existing between the insurer
    and the insured.


    The digitalization of activities, however, creates two antagonistic tendencies:


    *   – the simplification of the underwriting processes tends to limit the data
    requested from policyholders when underwriting. However, the ability to match
    external data will compensate for the loss of information generated;


    *   – the multiplication of contact channels (particularly, websites and mobile
    applications) and the adaptation of insurance offerings to the economy of use
    multiply opportunities for contacts between insured persons and insurers and contribute
    to the increase of exploitable data by insurers, both in terms of frequency of
    data acquisition and diversity (connection logs on the insurer’s website in particular
    or telephone exchanges that can be valued via the use of speech to text and semantic
    analysis).


    These two trends do not offset each other. The volume of data available to policyholders
    and their exposure to insured risks are significantly increasing such that insurers
    implement technological and financial means to make use of them.


    #### 5.1.3.2. *Connected objects data*


    Although the data derived from connected objects is considered an important source
    of information as regards the behavior of the insured, and because they allow
    a very detailed analysis over time of how they use the connected object, their
    use for insurance purposes still remains marginal.


    Data related to the quantified self cannot at this stage be considered as usable
    for insurance purposes because of existing regulatory restrictions and a limited
    desire by the insured to make them available to insurers. Data related to connected
    cars, although already being collected, are still underexploited.


    However, the strong development of these objects and their generalization to all
    types of objects planned by 2020 should make them sufficiently incorporated into
    ways of life and consumption habits so that regulatory changes and a more natural
    way of making the data available are envisaged.


    The issue for insurers to settle will rather concern the direction of their investments
    in this area, since not all the developed objects will witness the same level
    of success, the connection tendency of certain objects may sometimes lead to something
    ridiculous and the insured could adopt these objects to make primary use of the
    objects themselves and not for their secondary use for insurance purposes.


    #### 5.1.3.3. *Social network data*


    Given their massive adoption by the population and the considerable volume of
    information they carry, personal and professional social networks, at first impression,
    appeared to be an important source of data to insurers, and at the time of awareness
    of the potential contribution of big data to the market, some insurers envisaged
    to value them.


    At present, the enthusiasm for this potential repository of data has, to a large
    extent, abated. Although the available data are indeed numerous and potentially
    varied, they are, beyond the problems related to the use of personal data, also
    largely biased, many of them reflecting what the user wishes to communicate to
    its network. They are, in fact, more representative of appearance than reality
    and difficult to use for the purpose of studying behavior or analyzing risk.


    #### 5.1.3.4. *External data made available*


    Beyond the data directly available through the relationships between insurers
    and their insured and data from connected objects, external data sources can be
    of substantial interest to both banking and insurance stakeholders.


    In this context, the data made available by certain public bodies such as the
    INSEE or certain climatology/meteorological websites in particular may be of great
    interest for the understanding of the typology of the insured or exposure to the
    risks of insured property.


    The data made available, subject to the payment, by some private organizations
    such as Bloomberg or certain aggregators could also be valued, in particular for
    the purpose of understanding the macroeconomic environment and behavioral changes
    it engenders over time as regards policyholders.


    Given the existing incentives for making data available (French Lemaire Law, for
    example), financial sector stakeholders are logically led to consider their use
    and the implementation of a monitoring system dedicated to the supervision over
    time of data made available.


    NOTE.– Even if the volume of data available and the capacities induced in price
    refinement increase considerably, price personalization is neither fully feasible
    nor desirable for insurers, insured persons and society in general.


    ## 5.2. Examples of application in different insurance activities


    This section aims to highlight existing examples, examples under development or
    potential examples of the application of big data relevant in insurance within
    the meaning of the interest of the service and guarantees for the insured, gain
    in competitiveness or for risk management for insurers.


    These examples, while varied, are in no way an exhaustive list of possible applications
    of big data in insurance, and it is up to each insurer to analyze the potential
    contribution:


    *   – of its own data, as regards both already used data and data not yet valued
    or data which may be collected but is yet to be;


    *   – of external data accessible through open data, the purchase of data from
    external partners or implementation of sensors within the framework of a connected
    insurance offer.


    The matching of the various data, beyond the intrinsic interest specific to each
    of them, makes it possible to generate new data that may be of significant interest
    through feature engineering and to implement a real data-driven approach limiting
    the cognitive biases on the explanatory character of the different variables in
    the explanation of a given behavior.'
