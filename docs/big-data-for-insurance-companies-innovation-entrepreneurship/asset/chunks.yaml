    models is then applied to the validation set to select the best according to the
    criterion (R2, misclassification rate, etc.). The best model is then applied to
    the test set to estimate its performance, which is overvalued in the previous
    phase since one takes the `sup` of a set. We thus distinguish the evaluation of
    the performance of a model, from the choice of this model. Once the model is chosen,
    it must be re-estimated using all available before putting it into production.


    Ideally, in order to avoid risks due to random splitting in learning, validation
    and test, it would be necessary to iterate this step, but this is not done for
    very large datasets. For small size sets, it will be preferable to subdivide the
