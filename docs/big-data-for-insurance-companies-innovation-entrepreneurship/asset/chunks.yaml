  trans: '

    - – 敏捷性与快速数据归档，能够快速重复更新数据仓库数据所需的处理；

    - – 复杂分析，例如在数百万个银行账户上并行应用数百万个评分模型以检测欺诈等。


    好消息是，可以将这两个世界结合起来，并将 `Hadoop` 作为针对特定工作负载数据的高效且可扩展的 ETL（提取、转换、加载）解决方案。一旦数据在 `Hadoop`
    中提取并加载，就可以通过编写 `MapReduce` 或 `Spark` 任务，或使用 `HiveQL` 或 `Pig` 等高级语言，对数据进行批处理复杂转换。可以分析（解析）非结构化或半结构化数据的语法，并进行计算、连接和聚合，以整合来自不同源的数据，或者对其进行结构化处理，以便按照经典的业务流程将其插入数据仓库中。


    `Hadoop` 还可以用于构建一个灵活且可扩展的数据仓库，并将其与传统的 BI 工具对接（例如用于报表）。然而，大多数数据仓库解决方案发布商（如 `Oracle`
    或 `Teradata`）更倾向于仅在 ETL 层集成 `Hadoop`，这使得他们的解决方案得到增强而非被取代。相反，开源解决方案的支持者推崇工作负载管理，其中分布式
    `Hadoop` 环境充当数据枢纽的角色，公司生态系统中的所有数据在馈入多个分析平台之前都会通过该枢纽进行传输。


    分析所有这些方法是复杂的。一些作者制作了比较不同技术选择需求的图表，例如数据分析算法的属性 [LAN 15]，以及它们的潜在影响，例如关于技能和人力资源的影响
    [CHA 13]。


    ## 1.5. 保险领域面临的挑战与机遇


    数据是保险的核心。它是评分模型的原材料，允许对投人进行细分，以便更好地了解他们并提供定制化产品，更好地估算其当前和未来的风险并做出决策。因此，大数据和数字化转型正在深刻地改变保险业。与所有经济经营者一样，保险公司无疑将面临组织、文化和竞争方面的变化。我们将通过两个大数据发挥核心作用的例子来说明这一发展：第一个说明了共享经济发展的影响，第二个说明了行为改变对细分的影响。


    保险已经是共享经济的一部分 [LAC 15]。新的参与者（不一定来自保险领域）正在创建具有特定保险需求的个人社区，以便从保险公司处为他们谈判高度个性化的合同，并在过程中降低成本。如果社区平台允许个体表达他们的需求，那么大数据则允许这些新参与者主动寻找那些在网上积累了不满情绪的小型客户群体。事实上，这只需要分析搜索引擎的查询、博客和社交网络来确定特定的保险需求。这些新参与者因此正在改变被保险人与其保险公司之间的关系，同时也促进了创新，因为这些（非常）个性化的解决方案要么是现有合同的调整，要么是完全全新的合同。尽管这种类型的市场仍是小众的，但这种利基市场很可能会增长。这对于持续发展的商品或服务共享实践（如共享汽车、个人之间的车辆/公寓租赁等）尤为如此。这些做法正在改变风险评估的方式，并且再次必须提供特定的、甚至是定制的保单
    [INC 14]。本质上，这些做法正在发生范式从“一物一主”到“一物多用”的转变。这种从所有权向使用权的转变带来了新类型的风险，并对保险公司构成了挑战 [LAC
    15]。


    大数据还能够易于获取定价所需的部分信息，并将逐步减少传统纸质问卷的使用。因此，它允许更快的决策。更好的是，通过提供以前无法获取的信息，并将减少被保险人（他们几乎知道所有关于自己的信息）与保险公司（仅拥有部分信息）之间现有的信息不对称
    [EWA 13]。因此，大数据使得对被保险人及其相关风险的了解有了更深入的认知，从而优化了投保选择和更公平的保费价格。由于保险公司获取了更多知识，这也为保险公司带来了新类型的风险。被保险人如果这符合他们的利益，可以提供其生活方式的非常私密的数据。对于消费者和监管机构来说，对这种方法的接受程度显然至关重要
    [THO 15]。“按需付费（pay as you live, drive 等）”口号已经出现，特别是在汽车保险中。例如，联网驾驶可以对驾驶风格（加速、刹车、转弯等）进行精确分析，并取决于道路和天气状况。这种趋势在健康保险中也正在发展，通过联网设备可以衡量被保险人的身体状况（心率、睡眠等）和活动情况（步数、参加运动等）。其日常生活的质量可以使用外部和开放数据进行评估。然而，“超个性化”的保费定价可能会挑战现有的细分和风险共同模式
    [HOU 15]、定价的基础原则，以及关于风险组合如何构建的问题 [CHA 15]。保险公司对个人生活的入侵显然带来了数据保护问题。还存在新做法将如何发展以及它们可能对社会产生什么影响的问题。通过这两个例子，我们展示了大数据提供的某些机遇（新市场、创新和减少信息不对称）。提高广告活动的有效性以及目标定位和减少欺诈是其他例子。新的挑战正在出现（中间者的进入、保险基础的受到质疑、数据安全、精算挑战），同时也引发了伦理、安全和法律问题。


    ## 1.6. 结论


