    The quality of a forecasting model cannot be judged solely by the fact that it
    appropriately fits to the data: it has to provide good forecasts in the future,
    what is called the capacity of generalization. Indeed, it is easy to see that
    the more complex a model, for example a higher degree polynomial, the better it
    will fit to the data until it passes through all points, but this apparent quality
    will degrade for new observations: this is the overfitting phenomenon.


    ![Figure 2.1. From underfitting to overfitting ¶ (source: available at http://datascience.stackexchange.com/questions/361/when-is-a-model-underfitted)](images/fig2-1.jpg)


    **Figure 2.1.** *From underfitting to overfitting* ¶ *(source: available at [http://datascience.stackexchange.com/questions/361/when-is-a-model-underfitted](http://datascience.stackexchange.com/questions/361/when-is-a-model-underfitted))*


    It is therefore appropriate to seek models that behave in a comparable way on
    available data (or learning data) and on future data. But this is not a sufficient
    criterion, since, for example, the constant model ![images](images/ycirc.jpg)\=
    *c* verifies this property! Forecasts must also be of good quality.


    ### 2.4.1. Elements of learning theory


    The inequalities of the learning statistical theory make it possible to find bounds
    for the difference between learning error and generalization error (future data)
    according to the number of observations in learning and the complexity of the
    family of models. Let us illustrate one of these inequalities in the case of supervised
    classification in two classes. A classifier is then a function of `f(x)` predictors
    such that if `f(x) > 0` we classify x observation in one group, and if `f(x) <
    0` in the other group. Points such as `f(x) = 0` define the boundary.


    ![Figure 2.2. A linear and nonlinear classifier (according to \[HAS 09\]). For
    a color version of the figure, see www.iste.co.uk/corlosquet-habart/insurance.zip](images/fig2-2.jpg)


    **Figure 2.2.** *A linear and nonlinear classifier (according to \[HAS 09\]).
    For a color version of the figure, see [www.iste.co.uk/corlosquet-habart/insurance.zip](http://www.iste.co.uk/corlosquet-habart/insurance.zip)*


    The classifier error rate, which is a random variable because it depends on the
    sample, is the proportion of wrongly classified observations. Its expectation
    is called empirical risk, and denoted as `R[emp]`. For future observations coming
    from the same unknown distribution, it will be denoted as `R`. Let us consider
    families of classifiers, such as fixed degree `d` polynomial functions, with or
    without constraints on the coefficients, or that of the `k`-nearest neighbors
    (we allocate to the majority class among the `k` neighbors of a “member”). The
    learning theory has shown that the complexity of these models does not depend
    on the number of parameters, but on the ability to separate points by the boundary
    `f(x):` it is VC dimension or Vapnik– Chervonenkis dimension, denoted as `h` thereafter.
    For example, the linear boundaries of ![images](images/upr.jpg)^(*p*) allow us
    to separate `p` + 1 points belonging to different groups but not `p` + 2 points:
    more precisely, there are always configurations of `p` + 2 non-separable points,
    even if there are sometimes configurations of `p` + 1 non-separable points. VC
    dimension is `h = p + 1`.


    One of the most famous inequalities states that, with a probability 1 – `α`:


    \[2.3\] ![image](images/eq2-3.jpg)


    For fixed `n`, the increase of `h` leads `R[emp]` to 0 (overfitting) but the radical
    increases thus the existence of an optimal complexity `h*`.


    ![Figure 2.3. In a plane, some configurations of four points are not linearly
    separable](images/fig2-3.jpg)


    **Figure 2.3.** *In a plane, some configurations of four points are not linearly
    separable*


    ![Figure 2.4. Optimal VC dimension. For a color version of the figure, see www.iste.co.uk/corlosquet-habart/insurance.zip](images/fig2-4.jpg)


    **Figure 2.4.** *Optimal VC dimension. For a color version of the figure, see
    [www.iste.co.uk/corlosquet-habart/insurance.zip](http://www.iste.co.uk/corlosquet-habart/insurance.zip)*


    It should be noted that the gap between empirical risk and risk depends only on
    the ratio `n/h` and that if `n` is increased faster than `h`, there is convergence.
    This result shows that the more data we have, the more complex models we can use.


    The statistical learning theory abounds with such inequalities, but unfortunately
    they are not very convenient in practice to choose a model because VC dimension
    is difficult to obtain. Cross-validation methods are therefore indispensable:
    they consist of setting aside one or more parts of the data in order to simulate
    the behavior of algorithms or models in the presence of future data.


    We must strongly reiterate that the validation of a model or algorithm in big
    data can only be carried out on “new” data, which make it possible to ensure the
    reproducibility of results. This is an essential difference from standard statistical
    practice, although some so-called leave-one-out methods have been used for a long
    time in discrimination. Nevertheless, removing an observation when `n` is large
    is of little effect.


    ### 2.4.2. Cross-validation


    To choose between several models, the practice involves randomly dividing the
