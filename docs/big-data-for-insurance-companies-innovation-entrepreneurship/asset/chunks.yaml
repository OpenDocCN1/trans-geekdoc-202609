- raw: 'In some ways, the development of comparators favored by digital technology
    and the measures taken by public authorities to facilitate competition, which
    put insured persons in a position of choice, give insurers new contact and market
    promotion opportunities. However, insurers’ client experience is more difficult
    to achieve than for a product seller because of the reverse cycle, which delays
    the “delivery of the product”, which the client will not really want to receive
    since it would mean that a disaster has happened.


    In the context of economic crisis and declining purchasing power, as well as ecological
    awareness, individuals are seeking consumer solutions, rather than the possession
    of the useful object. The “vélib’” flourish in many cities as well as the “Autolib’”.
    Have we permanently entered into a society of usage more than property? In any
    case, clients, natural persons or legal entities increasingly pay attention to
    prices, at times to the detriment of quality.


    However, price has lost its economic value significance. Digital has accustomed
    individuals to “free” Google, Facebook and other services, and settlement is being
    done indirectly by the free input of all user data, which are then the subject
    of an intense commercial activity. It also allowed airlines and SNCF (National
    Society of French Railways) to charge very different prices depending on the filling
    rate at the time of booking (and sometimes other more questionable criteria),
    which may lead to passengers traveling together, under the same conditions, whilst
    paying prices ranging from 1 to 10. Users no longer have any reference and are
    tempted to think that big companies make excessive margins, waste and charge too
    much and that it is always possible to find lower prices. On the one hand, users
    are better informed about market insurance rates by comparators and about their
    own risk through open data (or soon to access their genome); on the other hand,
    they no longer have stable references on prices, the formation of which they do
    not understand. Reducing information asymmetry between clients and insurers, brought
    about by digital technology, does not really enhance confidence.


    In this new digital world, pampered by platforms and armed with their smartphone,
    individuals are becoming aware of their power: with a feeling of complete power,
    they give their opinion by tweet regarding television programs, act as journalists
    by filming news scenes and directly question politicians. Somewhat like teenagers,
    they have more confidence in unknown Internet users, in forums or platforms, than
    in recognized specialists.


    This partly explains the success of so-called “collaborative” platforms (BlaBlaCar,
    Airbnb, etc.) that bring individuals together for the exchange of services: car-pooling,
    lending houses or garden tools, as well as the temporary rental of apartments,
    cars, etc. The economic argument is also strongly put forward since it has been
    calculated that the economic gain of a collaborative economy would bring an average
    of € 495 to each.


    Thanks to a relaxation of regulations, this collaborative economy has also reached
    financial activities, such as crowdfunding.


    Some consumers are also starting to get rid of platforms by relying on both blockchain
    technology and social networks. Calling into question experience, skills and institutions,
    there are emerging trends among Internet users to organize themselves via peer-to-peer
    networks. Communities are created and, thanks to social networks, collective intelligence
    and blockchain technology, they are planning transactions that were until entrusted
    to trustworthy third parties that are regulated and controlled by public authorities.
    In the United States, a community of this type, peer-to-peer dynamics, proposes
    to carry out the unemployment insurance of a community via LinkedIn. Another one,
    “Teambrella”, is interested in the car insurance coverage of its members and determines
    the insurance price and entry of new members by vote.


    After the time of B2C (business to customers) and B2B (business to business),
    is this the time of C2C (consumer to consumer)?


    ### 4.2.3. *Client confidence in algorithms and technology*


    The public is developing the habit of having to deal with robots and is properly
    adapting to it: automatic cashouts, airports, banks, supermarkets, automatic subways.
    Algorithms are considered more reliable than humans and many prefer to be guided
    by a robot than a human. The robot, which is never tired, has no physiological
    needs or moods and no emotions need to reassure it. Due to its rationality, it
    is even perceived as objective, even though it has been coded by humans and depends
    on the culture they transmitted to it, which differs, especially from one continent
    to another. The algorithm is not objective. On the contrary, it risks being normative
    and impose criteria and values.


    The confidence individuals have in technology also concerns encryption technologies:
    the Bitcoin blockchain appears to be totally safe and the code is law for the
    Ethereum blockchain which says everything in the way some humans now rely on technology
    rather than institutions. Thanks to technology, some prefer trust shared with
    strangers rather than with institutions – “trusted third parties” – established
    for centuries. This tendency to discredit, which affects all institutions, notably
    politicians and journalists, does not spare banks and insurers, although it is
    not yet reaching them head-on.


    This tendency is partially offset by the need for human contact in some purchasing
    processes (despite the growing purchase of consumer products online). In insurance,
    there has been an increase in the need for contact with a manager to manage a
    claim.


    Moreover, resistance is beginning to emerge with regard to “black boxes”, as shown,
    for example, by the protest movement concerning the post-bac APB algorithm for
    the allocation of students to universities.


    ### 4.2.4. *Some sort of negligence as regards the possible consequences of digital
    traces*


    This loss of confidence in “institutions” contrasts with the lack of mistrust
    regarding the possible use of digital traces left by connected objects and via
    platforms as well as with regard to cyber risk. These connected objects develop,
    although they may take a while to start.


    The connected Apple Watch, for example, regularly progresses and is now sold more
    than Swatch watches. Bank cards, store cards, Navigo passes, web browsing, smartphones,
    connected cars, geolocation, connected meters, alarms, home automation, medical
    objects, etc. trace their users in a sustainable manner without apparently moving
    them.


    Yet the multiplication of traces and their crossing, especially with deep-learning,
    makes everyone traceable, even those who are not very active on digital networks,
    because they are networked with others who are connected. It suffices, for example,
    to have a parent or friend who is a Facebook user, so that via deep learning,
    Facebook can know everything about us, our tastes, our interests, our habits,
    etc.


    Until now, digital technology has been developing without the public expressing
    too much fears of misuse of the masses of information that are permanently provided.
    Similarly, it is only recently that there is an emerging awareness of the value
    of data freely provided in exchange for free services as well as the economic
    imbalance of this exchange and that some voices are being raised to claim a remuneration.


    However, in France, the data are not the property of the persons concerned. They
    are subject to regulations similar to those of the authorities and therefore cannot
    be sold by the persons themselves. On the contrary, paradoxically, these data
    can be traded elsewhere.


    ### 4.2.5. *New economic models*'
