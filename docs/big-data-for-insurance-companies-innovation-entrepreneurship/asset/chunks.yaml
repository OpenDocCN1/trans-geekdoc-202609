    \ 6 January 2017.\n\n\\[SFD 17\\] SFDS, “Société française de statistique”. Available\
    \ at: [www.sfds.asso.fr](http://www.sfds.asso.fr), consulted 1 March 2017.\n\n\
    Chapter written by Florence PICARD.\n\n# 5  \n\nUsing Big Data in Insurance\n\n\
    ## 5.1. Insurance, an industry particularly suited to the development of big data\n\
    \n### 5.1.1. *An industry that has developed through the use of data*\n\n####\
    \ 5.1.1.1. *Long-standing computerized industry*\n\nThe last 60 years have been\
    \ the occasion for a rapid and comprehensive development of information technology\
    \ and its uses in all sectors.\n\nThe period 1960–1970 was characterized by the\
    \ adoption of information technology for back-office management purposes in order\
    \ to record, process and restore large volumes of information previously processed\
    \ in paper format. Information technology was applied by a very limited number\
    \ of users, but it already enabled a considerable reduction in processing times\
    \ and substantial savings.\n\nThe development of machines, programming languages\
    \ and programs during 1970–1980 allowed the development of customized management\
    \ applications and adoption by a greater number of users. The use of information\
    \ technology has therefore gradually extended to all areas of management: accounting\
    \ and management control, execution of payments and cash management, operational\
    \ and financial planning, payroll management and more generally human resource-related\
    \ issues, monitoring and measure of business activity. This democratization of\
    \ information technology use within companies has gradually led to the development\
    \ of internal IT services and the diversification of profiles within these services.\
    \ It should be noted that feedback and some constraints (notably regulatory) are\
    \ specific to the French market.\n\nThe period 1980–1990 was characterized by\
    \ the diversification of programming languages, progressive miniaturization and\
    \ standardization of equipment, the development of interoperability between systems\
    \ and gradual implementation of master plans within companies in order to rationalize\
    \ investments and adopt a strategic vision for the development of IT resources.\
    \ At the same time, the number of users within companies continued to increase,\
    \ and IT was used for almost all current operations, regardless of the size of\
    \ the company concerned, though at this stage it was not sufficiently developed\
    \ as regards individuals to constitute a distribution channel.\n\nDuring 1990–2000,\
    \ the further development of solutions dedicated to the various information technology\
    \ uses and the improvement of ergonomics were accompanied by a drop in the cost\
    \ of equipment. These developments gradually encouraged individuals to equip themselves.\
    \ For companies, the development of solutions dedicated to storage and data processing\
    \ contributed to the implementation of data warehouses and the development of\
    \ data mining methods.\n\nThe rapid development of the Internet, despite the explosion\
    \ of the Internet bubble in 2000, from the second half of the decade greatly contributed\
    \ to the efforts toward expanding information technology to commercial relationships\
    \ between companies and also between companies and individuals. Moreover, the\
    \ emergence of web applications in the period 2000–2010 and the spread of data\
    \ led to more fragmented modes of urbanization of information systems. In response,\
    \ the development of methodologies and capacities regarding distributed computing\
    \ led to increasing flow requirements and the development of a solution-oriented\
    \ ecosystem.\n\nSince 2010, the development of Internet use through smartphones\
    \ and the development of social networks have also contributed to the increase\
    \ in the need for available resources and the diversity of uses of information\
    \ technology and related services. In addition to data directly generated by users,\
    \ government incentives for open data contributed to the multiplication and diversification\
    \ of available data and to the development of stakeholders through their valuation.\n\
    \nThe insurance industry was one of the first to make extensive use of information\
    \ technology, an ideal tool for carrying out numerous, successive and segmented\
    \ tasks. This adoption has profoundly altered the relationship between insurance\
    \ companies and their clients, and optimization of management has gradually given\
    \ way to a real commercial struggle, gradually making insurance a consumer product,\
    \ in which the positioning of stakeholders has become paramount because of an\
    \ increasingly competitive environment.\n\nThe coming years are moving towards\
    \ the explosion of the Internet of Things (IoT) and artificial intelligence. The\
    \ most advanced insurers are already investing heavily on these technologies;\
    \ therefore, there is no doubt that some of them will gain competitive advantages\
    \ by improving the quality of their client relationships, increasing their margins\
    \ and offering their prospects and client guarantees and services that are always\
    \ more suited to their needs.\n\nThe development of Internet accessibility in\
    \ some developing countries will also help to increase the volume of data generated\
    \ annually and exploitable in different areas. As their present IT systems are\
    \ virtually non-existent, they will be able to adopt state-of-the-art technologies\
    \ directly, especially because the costs associated with these technologies have\
    \ considerably dropped and, in view of their legal and demographic environments,\
    \ they witness rapidly developing companies springing up.\n\n#### 5.1.1.2. *An\
    \ industry whose data is raw material*\n\nFrom the advent of information technology\
    \ within the industry, data represent a fundamental asset for insurance companies,\
    \ the latter being necessary for product pricing, reserving and claims management.\n\
    \nData are at the heart of the relationship between policyholders and insurers\
    \ and help in establishing the conditions for their mutual commitment. Insurers\
    \ conduct their business and manage the risks to which they are subject by anticipating\
    \ in particular the probability of occurrence of future claims. Knowledge of risk\
    \ and client behavior is *de facto* a key component in ensuring the sustainability\
    \ of insurance business, as well as the competitive positioning of insurers and,\
    \ by extension, the maintenance and development of their market shares.\n\nAs\
    \ regards prevention and claims management, access to an increasing volume of\
    \ information and the ability to process these data in real time or near real\
    \ time contribute to a better support of the policyholder and a reduction in claims\
    \ cost.\n\nMachine learning algorithms, by their ability to process large volumes\
    \ of data in a data-driven approach and, after industrialization, in an automated\
    \ manner, logically constitute essential tools in terms of data valuation. They\
    \ allow the optimal use of data made available through open data and, beyond the\
    \ data previously collected by insurers, data gathered by the latter through the\
    \ increasing digitalization of their processes.\n\n#### 5.1.1.3. *An industry\
    \ whose regulatory framework is an incentive in the area*\n\nArticle 82 of Directive\
    \ 2009/138/EC (Solvency II) introduces data quality requirements for the calculation\
    \ of technical provisions. Under this Article, insurance and reinsurance companies\
    \ are required to implement internal processes and procedures to ensure the appropriateness,\
    \ completeness and accuracy of the data used within this framework.\n\nArticles\
    \ 19 to 21 of [Chapter III](#chapter03.xhtml), Section 2 of the Delegated Regulation\
    \ specify these requirements."
