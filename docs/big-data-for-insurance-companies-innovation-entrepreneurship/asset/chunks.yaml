    ## 3.4. 支持向量机 (SVM)


    支持向量机（SVM）是一类监督学习算法，最初定义用于两分类。它们被推广到多分类问题和定量变量的预测。在两类分类的情况下，它们基于寻找最优间隔超平面，以尽可能地分离两个观测子集。在这里，我们找到了简单感知机（见第
    3.2 节）的原理，其思想是寻求一个最优解，即泛化能力最好的解。这种方法源于 Vapnik 在 1995 年关于统计学习理论中对模型复杂性与其泛化能力之间联系的研究。


    ### 线性分类器


    当观测值线性可分时，我们已经看到 Rosenblatt 的简单感知机及其学习算法使得确定分离超平面的方程成为可能。我们将寻求最优解来阐述这一概念，并将这一概念可以扩展到非线性情况。


    让我们考虑学习集 `L[n]` = {(`x[i]`, `y[i]*) ∈ ![image](img/upr.jpg)^`p` × {-1, +1},`i`
    = 1, … , `n`}, 其中 `y[i]` 表示由变量 `x[i]` = (`x[i]`, … `x[i]`) 表征的个体属于两类中的哪一。我们为 ![image](img/upr.jpg)^`p`
    提供一个标量积，记为“。” ![image](img/upr.jpg)^`p` 的超平面 `H` 由其方程定义：`w . x + b = 0`，其中 `w`
    是垂直于 `H` 的向量。


    如果存在向量 `w` ∈ ![image](img/upr.jpg)^`p`，满足 `∥w∥=1` 且常量 `b` ∈ ![image](img/upr.jpg)，使得以下不等式对于
    `i` = 1, … , `n` 成立：


    ![images](img/f063-01.jpg)


    这等价于 `yi ≥ 1`，对于 `i` = 1, … , `n`。在这种情况下，`f(x) = w . x + b` 的符号指示了点 `x` 在超平面的哪一侧以及与
    `x` 相关的类别。


    常量 1 的选择是任意的，因为超平面是在范围内定义的。`L[n]` 的元素集合被认为是线性可分的，如果存在上述的 `w` 和 `b`。

