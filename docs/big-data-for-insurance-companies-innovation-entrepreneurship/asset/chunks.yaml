- raw: 'It is necessary to move the entire organization towards more agility, with
    test and learn experiments and the right to make mistakes, with more internal
    transversal and collaborative working, including cooperations with partners: start-ups
    for example, as well as wholesale brokers and even co-construction with clients.


    This requires a major effort with regard to staff training and profound changes
    in management trends.


    ## 4.5. Ethical and trust issues


    In the reverse cycle economic model of insurance, client trust is fundamental.
    It is obviously based on the insurer’s solvency, their full respect of the confidentiality
    of data, as well as the quality of their reputation. Regarding client data, the
    insurance principle has always been based on trust: clients provide the insurer
    with sincere information about their situation, thus enabling the insurer to evaluate
    their commitment and propose a contract. The insurer promises to keep the collected
    information confidential.


    This asymmetry of information is called into question by the digital world. On
    the one hand, in some cases the digital world changes the asymmetry and gives
    advantage to the client. The genome is a good example since clients will soon
    be able to use it for a small fee, whereas the insurer will not know the predictions
    it contains and in any case would not have the right to use the information. On
    the other hand, via connected objects such as bracelets or cars, the insurer directly
    collects data without a need for the client’s validation. The insurer assumes
    a share of responsibility regarding the relevance of the data they use to assess
    risk and set the price.


    In the new digital world, the basis of trust between the client and the insurer
    are therefore modified in a number of cases.


    Moreover, in the age of social networks, a grain of sand can destroy an image,
    any incident can be greatly amplified and everyone can be informed within minutes.
    Insurance companies are very attentive to this risk.


    ### 4.5.1. *Ethical charter and labeling: proof of loyalty*


    There are many dangers, including cyber attacks, which insurers may experience
    despite all their efforts.


    However, through the insurer’s ethics and way of getting employees to adhere,
    dangers can be limited. By neglecting these precautions, they may put themselves
    in a situation of failing as regards the loyalty they owe to their clients, with
    disastrous consequences on their reputation should this be revealed. This requires
    a special effort, because, if we are not careful, big data and algorithms can
    lead to such failure.


    Indeed, beyond the responsibility of some employees whose naivety and negligence
    facilitate the intrusion of hackers into systems, big data and machine learning
    algorithms generate in themselves risks to the protection of people’s privacy.
    Big data leads individuals to provide platforms with all sorts of behavioral information
    that is often insignificant and which, processed by the power of machine learning,
    makes it possible to unwittingly attribute a profile to them, in a legal way,
    without needing to know their identity.


    This has the following advantages: better informed about clients, the insurer
    can give them better advice, offer them a contract more suited to their needs
    and a more refined price. However, this can also lead to re-identifications and
    discriminatory practices.


    Even if regulations (CNIL law, European GDPR, Lemaire law) are working to protect
    individuals, the right is struggling to capture digital technology. This is why
    the legislator does not precisely define what is authorized, but lays down guiding
    principles. These principles are decisive: the principle of privacy by design
    so that all precautions are taken for the confidentiality of client data from
    product design, as well as the principle of accountability that empowers the company
    and gives the regulator the freedom to appreciate *ex post* if there has been
    a fault, and the principle of loyalty whose application is very difficult to prove
    objectively.


    For insurers, it is this loyalty that must convince clients. There is a relationship
    of trust. Convincing is a difficult task. It is not enough to announce one’s good
    intentions: it is necessary to be able to show the measures taken to implement
    them and, if possible, to make their effectiveness validated by an independent
    third party.


    Insurers can be assisted by the establishment of an ethical charter, a commitment
    relating to the training of their staff testifying the resources mobilized and
    the precautions taken, by total transparency with regard to clients concerning
    data held on them. Many insurers have taken this direction.


    They may also have a third party to testify the precautions taken: labeling of
    their processes or even their algorithms, choice of algorithms that ban “black
    boxes” and allowing the interpretability of results.


    This requires ethical training of the teams so that, from the design of algorithms
    and throughout the processing chain, each employee is attentive to loyalty as
    regards clients: strictly respecting the regulations on data (personal, sensitive,
    health), using information classification CIA (confidentiality, availability,
    integrity and proof) criteria, without introducing cultural bias that may lead
    to discrimination, using data adapted to the purpose in a parsimonious way.


    It is also necessary to formalize the Chinese walls between organizations authorized
    to process personal data in compliance with regulations (purpose of processing,
    informed consent of the client, etc.) and insurers. They can, for example, work
    from scores without access to personal data.


    It is essential to be careful about the quality of the data used. For example,
    are the data provided by connected bracelets reliable? Taking personalized pricing
    decisions, based on inaccurate data, may be very counterproductive to an insurer
    and damaging to their reputation. Wrong personalization is in general more hard-felt
    than a standard price.


    ### 4.5.2. *Price, ethics and trust*


    Big data makes some economic actors, such as SNCF, airlines or hoteliers, practice
    yield management, a pricing management system for available capacities, which
    aims at optimizing filling and turnover. This leads them to price differentiations,
    which correspond to their own financial interest at a given moment, in line with
    their marginal economic balance sheet at that moment, rather than the average
    cost for all their clients or even homogeneous segments of clients (same periods
    or schedules). They thus practice extremely different prices for the same service,
    according to their criteria, which are often not related to clients.


    Some of these actors go further and use the information they have on clients to
    increase the prices of those who can afford it. This practice, carried out without
    transparency, raises ethical questions. For insurers, it would be technically
    possible to practice yield management, for example, by differentiating prices
    from online subscriptions based on the profiles of clients already in the portfolio
    in order to distribute and balance the risks.


    How would this practice, accepted for trains, planes and hotel rooms, be welcomed
    by clients if insurers offered it to them? Because what clients are asking their
    insurers for today are “fair prices”. This requirement seems far removed from
    the practice of yield management.


    But what is a “fair price?” Would price differentiation made without the knowledge
    of clients on the basis of their wealth (detected thanks to these data) not appear
    “fair” to some less affluent clients? Is this “technical correctness” (cost of
    service)? Or “justness” in the sense of “value of service rendered?” Or “moral
    justice?”'
