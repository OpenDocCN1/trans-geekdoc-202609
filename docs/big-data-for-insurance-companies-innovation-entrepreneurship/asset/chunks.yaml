    预测模型的质量不能仅根据其对数据的恰当拟合来判断：它必须在未来提供良好的预测，这所谓的泛化能力。事实上，显而易见，模型越复杂（例如更高阶的多项式），它对数据的拟合程度就越好，直到它通过所有点，但这种表面的质量对于新的观测值将会下降：这就是过拟合现象。


    ![图 2.1. 从欠拟合到过拟合 ¶ (来源: 可访问 http://datascience.stackexchange.com/questions/361/when-is-a-model-underfitted)](img/fig2-1.jpg)


    **图 2.1.** *从欠拟合到过拟合* ¶ *(来源: 可访问 [`datascience.stackexchange.com/questions/361/when-is-a-model-underfitted`](http://datascience.stackexchange.com/questions/361/when-is-a-model-underfitted))*


    因此，寻求在可用数据（或学习数据）和未来数据上表现相似的模型是合适的。但这并不是一个充分的标准，因为例如，常数模型 ![images](img/ycirc.jpg)\=
    *c* 证实了这一属性！预测也必须是高质量。


    ### 2.4.1. 学习理论元素


    统计学习理论的不等式使得根据学习中观测值的数量和模型族的复杂度，找到学习误差与泛化误差（未来数据）之间差异的界限成为可能。让我们二类监督分类的情况下说明这些不等式之一。分类器是一个
    `f(x)` 预测器的函数，使得如果 `f(x) > 0`，我们将观测值 x 分为一组；如果 `f(x) < 0`，则分为另一组。`f(x) = 0` 等点定义了边界。


    ![图 2.2. 线性和非线性分类器（根据 [HAS 09]）。该图的彩色版本，请见 www.iste.co.uk/corlosquet-habart/insurance.zip](images/fig2-2.jpg)


    **图 2.2.** *线性和非线性分类器（根据 [HAS 09]）。该图的彩色版本，请见 [www.iste.co.uk/corlosquet-habart/insurance.zip](http://www.iste.co.uk/corlosquet-habart/insurance.zip)*


    分类器错误率是一个随机变量，因为它依赖于样本，它是分类错误的观测值的比例。它的期望被称为经验风险，记为 `R[emp]`。对于来自相同未知分布的未来观测值，它将被标记为
    `R`。让我们考虑分类器族，例如固定阶数 `d` 多项式函数（无论对系数是否有约束），或者 `k`-最近邻（我们根据“成员”的最近 `k` 个邻居中的多数派类进行分配）。学习理论已经表明，这些模型的复杂度不取决于参数的数量，而取决于通过边界
    `f(x):` 分离点的能力：这就是 VC 维或 Vapnik–Chervonenkis 维，后文记为 `h`。例如，![images](img/upr.jpg)^(*p*)
    的线性边界允许我们分离 `p` + 1 个属于不同组别的点，但不能分离 `p` + 2 个点：更准确地说，总是存在 `p` + 2 个不可分点的配置，即使有时存在
    `p` + 1 个不可分点的配置。VC 维为 `h = p + 1`。


    最著名的不等式之一规定，在概率 1 – `α` 下：


    \[2.3\] ![image](img/eq2-3.jpg)


    对于固定的 `n`，`h` 的增加导致 `R[emp]` 趋于 0（过拟合），但根号的增加增加了最优复杂度 `h*` 的存在。


    ![图 2.3. 在平面上，某些四个点的配置不是线性可分的](img/fig2-3.jpg)


    **图 2.3.** *在平面上，某些四个点的配置不是线性可分的*


    ![图 2.4. 最优 VC 维。该图的彩色版本，请见 www.iste.co.uk/corlosquet-habart/insurance.zip](img/fig2-4.jpg)


    **图 2.4.** *最优 VC 维。该图的彩色版本，请见 [www.iste.co.uk/corlosquet-habart/insurance.zip](http://www.iste.co.uk/corlosquet-habart/insurance.zip)*


    应该注意的是，经验风险与风险之间的差距仅取决于比例 `n/h`，且如果 `n` 的增长速度比 `h` 快，则存在收敛。这一结果表明，我们拥有的数据越多，就可以使用越复杂的模型。


    统计学习理论充满了此类不等式，但遗憾的是它们在实践中选择模型并不方便，因为 VC 维很难获得。因此，交叉验证是必不可少的：它们通过留出数据部分来模拟算法或模型在未来数据上的行为。


    我们必须强调，大数据中模型或算法的验证只能在“新”数据上进行，这确保了结果的可重复性。这与标准的统计实践有本质区别，尽管留一法长期以来用于判别。


    ### 2.4.2. 交叉验证


    为了在几个模型之间进行选择，实践涉及将可用数据随机分为三个子集：学习、验证和测试。这三个子集的典型值为 50%、25% 和 25% \[HAS 09]。学习集用于估计（或校准）每个模型的参数。然后将每个模型应用于验证集，以根据标准（R2、误分类率等）选择最佳模型。然后将最佳模型应用于测试集以估计其性能，之前的阶段由于取了
    `sup` 会被高估。因此我们区分了模型的性能评估与模型选择。一旦选择了模型，在投入生产之前必须使用所有可用数据重新估计。


    理想情况下，为了避免学习、验证和测试随机划分带来的风险，需要迭代此步骤，但对于非常大的数据集并不这样做。对于小型集合，最好将其细分为 5 或 10 个等数量的部分：以旋转的方式，通过移除
    5 或 10 个部分之一（5 折或 10 折交叉验证）来估计模型，并在部分集上评估其性能，然后取平均值。


    ## 2.5. 模型组合


    与其在 `M` 个模型或算法中选择最好的，将它们组合通常要有效得多。我们称之为集成方法；提升（boosting）、装袋（bagging）、随机森林属于此类类，但它们只组合相同族类的分类器或回归器。贝叶斯模型平均也是如此，它线性组合相同族类的子模型，并以已知数据的模型后验概率为系数。在忠实于数据分析原则的同时，我们不讨论为了应用而需要约束假设的贝叶斯模型平均。


    '
