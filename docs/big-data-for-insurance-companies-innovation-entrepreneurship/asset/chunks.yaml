- raw: 'As has been mentioned already, the essence of the big data phenomenon lies
    in the limitation of “classical” tools and the need to upgrade them so that they
    can collect, store and analyze new types of ever greater volumes of data. As for
    data collection and storage, although all data combined together are usually high
    volume, each data source produces a “reasonable” volume that can still be managed
    by “classical” storage and analysis tools. An intelligent distribution of databases
    is often sufficient for the collection and storage of data in different physical
    servers, and if the need is felt to put them on the network, it is “sufficient”
    to use a distributed, robust and fault-tolerant storage system. Big data architectures
    are needed when each data source produces volumes incompatible with the analysis
    tools. We thus turn to parallelization, which expresses itself in two ways:


    *   – data parallelism, where a single dataset is divided into subsets distributed
    over different machines;


    *   – task parallelism, where the algorithms and different sub-procedures are
    executed concurrently on different processors.


    Currently, the best-known big data architecture is probably Hadoop. Contrary to
    the myth attributing the creation of Hadoop to Yahoo, the project really started
    at Google. Doug Cutting was working on web content indexing there and needed a
    framework that would allow large numbers of operations to run in parallel over
    large collections of servers. The “MapReduce” principle of processing data spread
    over multiple servers, which is the programming model that Hadoop is based on,
    was published in 2004 by Google Labs. Doug Cutting joined Yahoo in 2008 and launched
    the first major Hadoop project, the Yahoo! Search Webmap, which runs on a cluster
    of 10,000 Linux cores. Today, Hadoop is an open source project managed by the
    Apache foundation \[HAD 16\], and its ecosystem is developing day by day with
    numerous projects optimizing or adding different components. In 2016, the major
    Web actors like Twitter and Facebook stored and searched through their tens of
    petabytes^([2](#chapter01.xhtml#fn2)) of data on Hadoop.


    The Hadoop *framework* can be broken down into three main modules:


    *   – the Hadoop distributed file system (HDFS): the system of files is distributed
    over different nodes of a cluster. These data nodes are machines networked using
    a master-slave model. The machines themselves can be relatively modest (and hence
    inexpensive) servers, it is the number of them that guarantees the big data capacity
    of the cluster. Every file is split up into blocks. The blocks are distributed
    across several machines, which allow large volumes of files to be stored, including
    volumes exceeding the storage capacity of each of the servers. One particular
    node, the name node, tracks the location of the different blocks and allows access
    to the data. Each block is replicated at least three times over three different
    data nodes to ensure redundancy. This principle of horizontal distribution (sharding)
    enjoys the advantage of being easily re-scaled, since more data nodes can be added
    to increase the data storage capacity. Overall, HDFS is an efficient, fault-tolerant
    and scalable file system, which undoubtedly contributed substantially to its success;


    *   – the MapReduce data processing engine: a MapReduce job (a processing task)
    is completed in two stages, a mapping step that transforms raw data into a key/value
    format, and a reducing step that combines all of the values for each of the keys.
    Data handling generally gives rise to a chain of several MapReduce jobs;


    *   – the YARN (Yet Another Resource Negotiator) resource manager: this module
    was introduced in the second version of Hadoop and allows the infrastructure management
    to be completely dissociated from the MapReduce data processing model. Thus, while
    MapReduce describes the data manipulation processes, YARN calls on the name nodes
    and deals with launching these processes on the different data nodes. At the simplest
    level, YARN orchestrates the parallel management of the different processes to
    optimize the distribution of the processing work over the different machines.


    A range of projects supplementing these core modules enhance the services provided
    to users, some of which are shown in [Figure 1.4](#chapter01.xhtml#fig1-4). Examples
    of these services include database management (Hbase) and searches (Hive), real-time
    data ﬂow processing (Storm), high-level data manipulation scripts (Pig), Web interfaces
    facilitating data processing (Hue) and, of course, data analysis and search libraries
    (Mahout).


    ![Figure 1.4. Hadoop and its ecosystem (non-exhaustive)](images/fig1-4.jpg)


    **[Figure 1.4](#chapter01.xhtml#ifig1-4).** *Hadoop and its ecosystem (non-exhaustive)*


    The Spark framework has been growing in reputation since 2014^([3](#chapter01.xhtml#fn3)).
    Originally developed in 2009 by AMPLab, from the University of California, Berkeley,
    the project became an Apache open source project in 2010. Spark, built on Hadoop
    and MapReduce, improves upon MapReduce by taking advantage of the nodes’ random
    access memory when possible (via Resilient Distributed Datasets or RDD) and chaining
    together multiple processing steps without systematically reading and writing
    to the hard disk as MapReduce does. This clever trick significantly speeds up
    the majority of data handling processes, such as sorting, word counting, unsupervised
    k-means classification or calculating PageRank centrality in a graph, by up to
    a factor of 5 \[SHI 15\]. Nevertheless, we note that according to \[SHI 15\],
    MapReduce performs better at managing the processes between the mapping and reducing
    phases. Furthermore, Spark comes with a complete environment, allowing (like MapReduce
    and Storm) real-time data ﬂow problems as well as background (batch) tasks to
    be processed, for different types of data (text, graph, etc.). Applications can
    be written in Java, Scala or Python, and the MLib library (Spark Machine Learning
    Library), which comes from the data search library Mahout, from MapReduce, updates
    on the ﬂy, all while offering an increasingly high-level data interface (RDDs
    have now been expanded into DataFrames, data displays that allow the data to be
    grouped in columns like in a table from a relational database).


    Platforms specializing in decision-making solutions are also rapidly developing.
    They are offering more and more solutions for interfacing with open source tools.
    For example, SAS has offered SAS® Data Loader to interface with Hadoop, and since
    2015 has clearly positioned itself with the main themes in the sector, such as
    cybersecurity or the Internet of Things. As another example, IBM is extending
    its IBM Cloud Bluemix platform with their Data Science Experience offering, based
    on Apache Spark. More specifically, this offering allows data scientists and developers
    access to 250 datasets, all powered by Spark and equipped with different open
    source software, like H2O, a Machine Learning solution. This data analysis software
    is not only compatible with big data platforms like Spark, but also claims to
    allow machine learning models developed in Python, Java or R to be easily deployed
    on these platforms. H2O is offered by a Californian start-up, H2O.ai.


    According to KDnuggets \[PIA 16\], a site specializing in current affairs in business
    analytics, big data, data science and data mining, there are not many professionals
    who use only proprietary or indeed only open source solutions. A large majority
    of them use both families of tools. The dynamism of the open source community
    has made its technologies very popular to use. According to a 2013 survey run
    by O’Reilly, looking at data scientist salaries, the median salary of a data scientist
    who uses open source tools is 130,000 $US compared to 90,000 $US for those who
    only use proprietary tools.'
