- raw: 'If the insurance business did not require strong capitalization and proven
    expertise (such as the ability to convince the ACPR to issue an authorization),
    it is likely that several new companies would have been created on new technological
    bases with products, customer communication methods and an information system
    perfectly adapted to big data context.


    The strengthening of regulations aimed at enhancing data security and the privacy
    of policyholders is also moving in the direction of benefiting new insurance companies.


    For example, the principle of privacy by design, which is one of the guiding principles
    of the GDPR (General Data Protection Regulation), is not favorable to well-established
    insurance companies whose portfolios have accumulated several generations of contracts
    for more than half a century. The legal dimension and reverse cycle of insurance
    business solidify the commitments made and the products that support them. It
    is not easy to move clients from a former contract to a new one because of the
    commercial and management costs involved and the risk of losing the client’s incentive
    to reopen the contract.


    Similarly, the newfound obligation for companies to provide clients with all the
    data held on them is easy for a new company, but this is difficult for an “old”
    company whose large databases were structured in a completely different context.


    In fact, the entry barrier is high. As proof, so far, only one new digital company,
    Alan, was created in October 2016 to cover health, the primary target being the
    clients of start-ups.


    ### 4.4.5. *The risk of reduction in the scope of property insurance*


    Societal evolutions are changing consumption habits.


    Is preference for usage at the expense of property a basic tendency or a temporary
    consequence of the economic crisis? If it persists, it profoundly alters several
    important branches of property insurance, including car insurance. The development
    of usage shifts “damage” risk from individuals to companies (renters, manufacturers,
    etc.) and can considerably reduce the volume, since companies have a high self-insurance
    capacity, especially when they are well placed for maintenance and repair.


    This risk of shift from B2C to B2B is increased by the emergence of wholesale
    brokers under a collaborative economy (peer-to-peer) who design new offerings
    adapted for the digital world, for organized communities; aiming at lower prices
    and better service. Inspeer, Otherwise and Wecover are good French examples.


    This reduces the insured volume because communities have a more comfortable financial
    base than an individual and can assume higher deductibles.


    Some are relevant regarding accountability and prevention which justifies lower
    prices.


    The insurer’s profit margin can be retained, but the turnover may be threatened.
    This will require adjusting the size of the commercial and management mechanisms.


    The recent media success of blockchain technology releases creativity and opens
    up many opportunities, including some fantasies. Some envisage a mutualization
    between individuals, outside of any insurance company, within a blockchain: in
    the United States, Teamumbrella, for example, manages automobile risk in a “community”
    without a legal structure, outside prudential regulation, which exposes them to
    insufficient resources to cover large claims.


    Others go further and come out of any mutualization: they consider insurance a
    bet between two individuals. A bet for the “insured” individual who will not have
    recourse in the event of a serious disaster if the partner is insolvent in due
    course. And a bet for the partner if the amount of the loss is greater than expected.
    Betting preset amounts would not solve the problems.


    ### 4.4.6. *The risk of non-access to data or prohibition of use*


    In today’s big data world, for insurers, access to the data of policyholders is
    not as natural as it seems. In the case of distribution by brokers, the client
    is that of the broker and not of the insurer. Multichannel distribution complicates
    organization. As policyholders are increasingly mobile, one policyholder can be
    client of the insurer by underwriting with an employee of the insurer or, for
    another risk, client of a broker. It is difficult for the insurer to consolidate
    all this information: data governance is an issue of real importance.


    Moreover, regulatory changes, which aim at protecting consumers, fall in line
    with a restriction of the choice of pricing criteria, notably for non-discriminatory
    reasons. The European ban on the use of gender, which is nevertheless discriminatory
    for certain risks, is a glaring example.


    The right to oblivion, for the benefit of patients who have suffered from certain
    serious illnesses, came into force in mid-February 2017. In order to underwrite
    a credit insurance contract, persons who suffered from cancer, without relapse
    for 5 years, are no longer required to declare their former disease.


    In addition, the law provides for a reference grid that defines, by pathology,
    the periods within which people can underwrite an insurance without premium or
    disclaimer of warranty (AERAS). The ACPR ensures compliance with this right to
    oblivion.


    Here, we notice contradictory wishes: on the one hand, the authorities’ concern
    to ensure the protection of individuals’ privacy and combat discrimination, a
    precaution to which the public adheres; on the other hand, the wish of individuals
    to be treated within their particularism and benefit from personalized offers.
    This does not facilitate insurers’ tasks, especially as the client experience
    of other economic activities, based on tangible products, is not hampered by the
    same measures and controls on the use of data.


    ### 4.4.7. *The risk of cyber attacks and the risk of non-compliance*


    Like any technological revolution, big data and algorithms can generate the best
    and the worst. If digital “increases” insurers and clients, criminals also increase.
    And since the law does not move as fast as technology, hackers and criminals constantly
    take advantage of the power of data and algorithms.


    The explosion of the number of connected objects, which constitute “computers”
    (even the most modest, like light bulbs), multiplies the risks of attacks. Connected
    objects are not very secure when designed and especially do not benefit from security
    maintenance. They are really the weak links in the digital world.


    Companies are bound by security obligations that are an obstacle to their creativity.
    Not only do they have to comply with the law, which is normal, it is equally up
    to them to prove their compliance. In this respect, the new European GDPR is very
    demanding: companies have to take the blame if, victim of data theft, they cannot
    prove that they had taken all the necessary security measures, including their
    subcontractors. Established sanctions are very heavy (up to 4% of global turnover)
    and can lead companies to bankruptcy.


    As consumers, we all enjoy this protection. However, our security is threatened
    by hackers who do not hesitate to deploy their creativity to steal and hold insurers’
    data for ransom.


    This situation poses a double risk to insurers: the risk of not being able to
    ensure compliance and that of not countering all hackers’ attacks. Their reputation
    and the confidence that clients place in them depend on doing something about
    it.


    ### 4.4.8. *Risks of internal rigidities and training efforts to implement*


    Finally, one of the main risks lies in the difficulty of successfully achieving
    internal digital transformation. It is not just about making the right technical
    decisions at the top of the company and having highly specialized data specialists.
    It is the entire company that has to take ownership of the new digital world.'
