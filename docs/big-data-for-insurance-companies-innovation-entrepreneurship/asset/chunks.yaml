- raw: "Moreover, given the current context conducive to the emergence and increasingly\
    \ rapid adoption of technological innovations, it goes without saying that these\
    \ contributions are still limited at this stage and will be amplified by the cross-matching\
    \ of big data with other emerging innovations, including:\n\n*   – blockchain\
    \ and smart contracts;\n\n*   – artificial intelligence and the emergence of bots\
    \ and chatbots.\n\nOther innovations will contribute to the exponential generation\
    \ of new data sources, including:\n\n*   – the development of connected objects;\n\
    \n*   – the emergence of platforms for the collection of personal data.\n\nFinally,\
    \ if the data generated so far are mainly due to mature markets, the contribution\
    \ of emerging countries is set to explode from 2017.\n\n### 5.2.1. *Use for pricing\
    \ purposes and product offer orientation*\n\nThrough the matching of external\
    \ data with relative data, products and guarantees, policyholders and their claims,\
    \ it is possible, using machine learning algorithms, to identify the most discriminatory\
    \ variables for pricing purposes in a data-driven manner.\n\n![Figure 5.1. Classical\
    \ data science process ¶ (source: DataSquare)](images/fig5-1.jpg)\n\n**Figure\
    \ 5.1.** *Classical data science process* ¶ *(source: DataSquare)*\n\nThe studies\
    \ carried out may have different purposes:\n\n*   – offering products and guarantees\
    \ adapted to client targets on which an insurer wishes to develop;\n\n*   – challenging\
    \ the previously used price variables, the latter most often established on the\
    \ basis of the only available data in the portfolio;\n\n*   – simplifying the\
    \ underwriting process: increasingly, the simplicity of underwriting insurance\
    \ contracts is a factor promoting the transformation of online estimates into\
    \ duly underwritten insurance contracts (Lemonade, for example, greatly complements\
    \ the data requested within the framework of its underwriting process with matched\
    \ external data);\n\n*   – establishing a refined price in terms of price zoning\
    \ (micro-zoning, review of existing zones), where the price applied depends on\
    \ the location of the insured, as can be the case for car or home insurance.\n\
    \nIn terms of pricing, process optimization and orientation of insurers product\
    \ offers, possibilities are numerous and experiments and projects multiply under\
    \ constraints, however, of meeting compliance requirements with regard to the\
    \ use of personal data and data matching. The cross-matching of insurance and\
    \ banking data by bank insurers, for example, although it may be carried out for\
    \ research and experimentation purposes, requires the implementation of a data\
    \ exchange protocol that is legally binding at the group level.\n\nOrientation\
    \ of offerings is one of the areas in which the reciprocal expertise of actuaries\
    \ and data scientists will be the most complementary and source of both mutual\
    \ enrichment and value-adding for insurance companies. Insurance fundamentals\
    \ such as pricing and reserving, due to the technical and regulatory requirements\
    \ they raise, will logically remain, for the time being, the sole preserve of\
    \ actuaries.\n\n### 5.2.2. *Automobile insurance and telematics*\n\nTelematic\
    \ data collected through sensors connected to the diagnostic socket of insured\
    \ vehicles (a more reliable and more informative means of collecting data than\
    \ collection via mobile phones, within a given timeframe) allow a spatio-temporal\
    \ analysis of the risk borne by policyholders, in view of their driving behavior\
    \ and the environment in which they operate (weather, traffic, road conditions,\
    \ etc.).\n\nAt this stage, the data collected make it possible to establish driving\
    \ scores which allow policyholders to change their behavior while driving and\
    \ they also take the gamification of driving more into consideration than preventive\
    \ action. This information is also used to provide the insured with a discount\
    \ on their car insurance premium in contracts that are progressively evolving\
    \ to better match the risk incurred. The latest major changes as regards pay as\
    \ you drive and pay how you drive are presented in [Table 5.2](#chapter05.xhtml#tab5-2).\n\
    \n**[Table 5.2](#chapter05.xhtml#itab5-2).** *Existing pay “X” you drive guarantees*\n\
    \n| **\uFEFFPay X you drive**  |\n\n| --- |\n\n| **X** || **Description of the\
    \ guarantee** || **Initiators** |\n\n| **X = As** || Annual modulation of the\
    \ insurance price according to the mileage || Amaguiz (2008) Axa and Allianz (2009)\
    \ |\n\n| --- | --- | --- |\n\n| **X = How** || Monthly modulation of the insurance\
    \ price according to the driver’s driving behavior  \n\nCurrently, driving scoring\
    \ and premium modulation “determined by an expert” || Axa and Allianz (2015) |\n\
    \nFrom the data collected so far, it is difficult to objectively provide reductions\
    \ granted according to the claims observed, since France lags behind the development\
    \ of these types of products compared to other European countries such as Germany\
    \ or Italy. Also, the reductions granted are attributed on the basis of expert\
    \ judgments, both concerning the percentages of reduction and the identification\
    \ of driving behaviors likely to limit the risk of accident.\n\nMoreover, in addition\
    \ to the study of driving behavior, the data collected must make it possible,\
    \ through matching with external geospatial data, to obtain a better knowledge\
    \ of the environment in which the insured operates, which beyond simple price\
    \ modulation allows the development of new services and preventive actions, for\
    \ example:\n\n*   – informing policyholders in case of risk of hail and incentive\
