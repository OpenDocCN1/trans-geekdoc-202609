- raw: 'Digital technology has brought in new actors (Amazon, La Fourchette, TripAdvisor,
    Uber, etc.), which, by interposing between the producer and the client and offering
    clients an irreproachable and personalized service, cut off the producer from
    their clients. Once installed, these platforms reduce the producer to a subcontractor
    role and make the law on prices, reducing producers’ margins without always actually
    reducing prices for consumers.


    Today, all economic actors are increasingly worried about being “uberized” as
    it was done, at varying extents, with taxi drivers, booksellers and restaurateurs.
    Insurance companies also fear the arrival of new digital actors, namely insurance
    “ubers” or “free”, which would bring both a drop in prices and an agile digital
    service, not hampered by the historical weight of complex portfolios.


    Insurance companies understand that clients do not want to “pay for others”, that
    high-performing platforms have accustomed them to personalization of service and
    they want to find it in all their suppliers. They closely observe and often associate
    with Fintech and Insurtech, which flourish under the creative impulse of millennia,
    those young graduates who embark on their business, ready to hasten everything,
    far from the comfort and constraints of their elders’ careers in the large corporations.


    For insurance companies, the issue is to analyze the opportunities and risks of
    the new digital context of our big data world and to define their strategic approach
    in this rapidly changing universe.


    ## 4.3. Opportunities: new methods, new offers, new insurable risks, new management
    tools


    Insurers are data professionals. On a technical level, to ensure solvency and
    meet commitments, their risk assessment is based on the observation of past results
    and sets of hypotheses for the future in a meticulous hypothetico-deductive approach.
    The stochastic models used by actuaries, including the generalized linear model
    (GLM), are hypothesis-driven. The Solvency II  prudential regulation is itself
    based on these methods, and the ACPR regulator exercises its control over the
    data and used internal models and requires interpretability.


    The conventional statistical and probabilistic methods of actuaries are therefore
    far from being obsolete.


    ### 4.3.1. *New data processing methods*


    In big data world, new methods enrich the capacities of risk assessment, construction
    of offers and contacts with clients.


    The approach is different from that of modeling. The number of variables is too
    high to be able to apply the same techniques. However, these are not *a priori*
    selected variables, but newly available existing data, which will often prove
    to be of no explanatory value in the subject under study. However, the work precisely
    consists of detecting cases where these new data are explanatory or predictive
    and it is in these situations that the data add value. To extract relevant information
    from large masses of data, it is therefore necessary to view the data from a data-driven
    perspective, with learning algorithms: decision trees, neural networks, random
    forests and even unsupervised classification algorithms.


    Actuaries knew some algorithms of this type but so far, before big data, they
    had few opportunities to use them. Neuronal algorithms and classification methods
    were valuable for refining homogeneous pricing groups. However, they were only
    used on internal, numerical data from subscriptions, claims or other internal
    data databases, which limited their predictive power.


    Data-driven is thus a new approach to data, without *a priori*, which helps to
    discover unsuspected correlations and proximities. However, we should not forget
    the business experience, especially as correlation does not equal causality. It
    is important to understand the context in order to properly use big data and algorithms.
    In this respect, due in particular to its reverse cycle and different relationship
    to time, the insurer’s business differs from many of big data businesses. Algorithm
    results must be interpretable and it must be possible to explain the decisions
    taken.


    Unlike many leading-edge activities in big data, most traditional insurance activities,
    apart from interactions with clients, do not require instant processing in the
    nanosecond. At present, it is rarely the rapidity of processing that takes priority
    over the interpretability of results. Within the framework of current insurance
    contracts, which are concluded for fairly long terms, usually 1 year, the scope
    of prediction falls within a much longer timescale than in most digital businesses,
    and situations are less repetitive than those of e-commerce actors.


    Even with mass data, input data have limitations and must be taken into account
    at the output level. Letting the data speak does not mean letting algorithms do
    the work and taking the result without thinking. To take a simple example, if
    a machine learning algorithm study is based on a history of data from a socio-occupational
    profession that was closed to women, it should not be surprising that the prediction
    would contain a gender criterion even though this criterion will not be relevant
    in the prediction, given the initial bias.


    Big data does not dispense with the need to think before making an action decision.
    In the decision-making process typical of human beings, which goes from data to
    “information”, then from “information” to “knowledge” and finally from “knowledge”
    to “action decision”, business experience should help to enrich and interpret
    predictions. Would it not be dangerous for our civilization to blindly rely on
    algorithms’ predictions by forgetting the “knowledge” box, without trying to understand?


    The situation is different in terms of pattern recognition due to deep learning.
    In this case, even if it is not yet possible to explain mathematically “why it
    works”, it is possible to let the algorithm go directly to the result. The comparison
    between prediction and reality, carried out in prior studies, showed the strength
    and validity of the method. However, in insurance, concerning prices and provisions,
    the truth of the facts will come too late to correct an accumulation of prediction
    errors uncorrected over time: the insurer risks not being able to meet their commitments.
    Moreover, the regulator will not allow it and will require that regular reporting,
    established according to proven methods, explain the decisions by interpretable
    modeling.


    For insurance companies, the new data-driven methods thus enrich risk assessment
    and claims to enrich techniques, but they cannot replace them.


    On the contrary, as with any other economic activity, the new data of big data
    and new techniques are a great opportunity, especially for marketing, client relations
    and management. By knowing clients better, they will help to build offers that
    are more adapted to new needs.


    The predictive dimension of algorithms can also enable insurers to add value through
    a real accountability and prevention role, as they did in the 20th Century for
    road safety and industrial risks.


    ### 4.3.2. *Personalized marketing and refined prices*


    Clients are demanding personalization and “fair prices”. This demand is somewhat
    contradictory to the principle of mutualization of insurance: it is because, for
    a group of clients, each person pays a price agreed in advance, that everyone
    will be sure to be compensated if he/she is unlucky to have a claim. In order
    to establish their prices, insurers divide their clients into risk groups that
    are assumed to be “homogeneous”, defined according to the statistics they have
    on the past and some simple criteria concerning clients or what is insured. It
    is obvious that, at the end of the insurance period (usually 1 year), some clients
    will have paid “for nothing” and others will have been compensated well beyond
    their contribution. By construction, insurance makes losers and winners.'
  fmt: '

    Digital technology has brought in new actors (Amazon, La Fourchette, TripAdvisor,
    Uber, etc.), which, by interposing between the producer and the client and offering
    clients an irreproachable and personalized service, cut off the producer from
    their clients. Once installed, these platforms reduce the producer to a subcontractor
    role and make the law on prices, reducing producers’ margins without always actually
    reducing prices for consumers.


    Today, all economic actors are increasingly worried about being “uberized” as
    it was done, at varying extents, with taxi drivers, booksellers and restaurateurs.
    Insurance companies also fear the arrival of new digital actors, namely insurance
    “ubers” or “free”, which would bring both a drop in prices and an agile digital
    service, not hampered by the historical weight of complex portfolios.


    Insurance companies understand that clients do not want to “pay for others”, that
    high-performing platforms have accustomed them to personalization of service and
    they want to find it in all their suppliers. They closely observe and often associate
    with Fintech and Insurtech, which flourish under the creative impulse of millennia,
    those young graduates who embark on their business, ready to hasten everything,
    far from the comfort and constraints of their elders’ careers in the large corporations.


    For insurance companies, the issue is to analyze the opportunities and risks of
    the new digital context of our big data world and to define their strategic approach
    in this rapidly changing universe.


    ## 4.3. Opportunities: new methods, new offers, new insurable risks, new management
    tools


    Insurers are data professionals. On a technical level, to ensure solvency and
    meet commitments, their risk assessment is based on the observation of past results
    and sets of hypotheses for the future in a meticulous hypothetico-deductive approach.
    The stochastic models used by actuaries, including the generalized linear model
    (`GLM`), are hypothesis-driven. The `Solvency II` prudential regulation is itself
    based on these methods, and the `ACPR` regulator exercises its control over the
    data and used internal models and requires interpretability.


    The conventional statistical and probabilistic methods of actuaries are therefore
    far from being obsolete.


    ### 4.3.1. New data processing methods


    In big data world, new methods enrich the capacities of risk assessment, construction
    of offers and contacts with clients.


    The approach is different from that of modeling. The number of variables is too
    high to be able to apply the same techniques. However, these are not `a priori`
    selected variables, but newly available existing data, which will often prove
    to be of no explanatory value in the subject under study. However, the work precisely
    consists of detecting cases where these new data are explanatory or predictive
    and it is in these situations that the data add value. To extract relevant information
    from large masses of data, it is therefore necessary to view the data from a data-driven
    perspective, with learning algorithms: decision trees, neural networks, random
    forests and even unsupervised classification algorithms.


    Actuaries knew some algorithms of this type but so far, before big data, they
    had few opportunities to use them. Neuronal algorithms and classification methods
    were valuable for refining homogeneous pricing groups. However, they were only
    used on internal, numerical data from subscriptions, claims or other internal
    data databases, which limited their predictive power.


    Data-driven is thus a new approach to data, without `a priori`, which helps to
    discover unsuspected correlations and proximities. However, we should not forget
    the business experience, especially as correlation does not equal causality. It
    is important to understand the context in order to properly use big data and algorithms.
    In this respect, due in particular to its reverse cycle and different relationship
    to time, the insurer’s business differs from many of big data businesses. Algorithm
    results must be interpretable and it must be possible to explain the decisions
    taken.


    Unlike many leading-edge activities in big data, most traditional insurance activities,
    apart from interactions with clients, do not require instant processing in the
    nanosecond. At present, it is rarely the rapidity of processing that takes priority
    over the interpretability of results. Within the framework of current insurance
    contracts, which are concluded for fairly long terms, usually 1 year, the scope
    of prediction falls within a much longer timescale than in most digital businesses,
    and situations are less repetitive than those of e-commerce actors.


    Even with mass data, input data have limitations and must be taken into account
    at the output level. Letting the data speak does not mean letting algorithms do
    the work and taking the result without thinking. To take a simple example, if
    a machine learning algorithm study is based on a history of data from a socio-occupational
    profession that was closed to women, it should not be surprising that the prediction
    would contain a gender criterion even though this criterion will not be relevant
    in the prediction, given the initial bias.


    Big data does not dispense with the need to think before making an action decision.
    In the decision-making process typical of human beings, which goes from data to
    “information”, then from “information” to “knowledge” and finally from “knowledge”
    to “action decision”, business experience should help to enrich and interpret
    predictions. Would it not be dangerous for our civilization to blindly rely on
    algorithms’ predictions by forgetting the “knowledge” box, without trying to understand?


    The situation is different in terms of pattern recognition due to deep learning.
    In this case, even if it is not yet possible to explain mathematically “why it
    works”, it is possible to let the algorithm go directly to the result. The comparison
    between prediction and reality, carried out in prior studies, showed the strength
    and validity of the method. However, in insurance, concerning prices and provisions,
    the truth of the facts will come too late to correct an accumulation of prediction
    errors uncorrected over time: the insurer risks not being able to meet their commitments.
    Moreover, the regulator will not allow it and will require that regular reporting,
    established according to proven methods, explain the decisions by interpretable
    modeling.


    For insurance companies, the new data-driven methods thus enrich risk assessment
    and claims to enrich techniques, but they cannot replace them.


    On the contrary, as with any other economic activity, the new data of big data
    and new techniques are a great opportunity, especially for marketing, client relations
    and management. By knowing clients better, they will help to build offers that
    are more adapted to new needs.


    The predictive dimension of algorithms can also enable insurers to add value through
    a real accountability and prevention role, as they did in the 20th Century for
    road safety and industrial risks.


    ### 4.3.2. Personalized marketing and refined prices


    Clients are demanding personalization and “fair prices”. This demand is somewhat
    contradictory to the principle of mutualization of insurance: it is because, for
    a group of clients, each person pays a price agreed in advance, that everyone
    will be sure to be compensated if he/she is unlucky to have a claim. In order
    to establish their prices, insurers divide their clients into risk groups that
    are assumed to be “homogeneous”, defined according to the statistics they have
    on the past and some simple criteria concerning clients or what is insured. It
    is obvious that, at the end of the insurance period (usually 1 year), some clients
    will have paid “for nothing” and others will have been compensated well beyond
    their contribution. By construction, insurance makes losers and winners.

    '
  trans: '

    数字技术引入了新的参与者（亚马逊、La Fourchette、TripAdvisor、Uber 等），这些参与者通过在生产者和客户之间进行介入，并为客户提供无懈可击且个性化的服务，切断了生产者与其客户的联系。这些平台一旦建立，就把生产者降低为外包商的角色，并掌握了定价权，削减了生产者的利润空间，但并不总是能真正降低消费者的价格。


    如今，所有经济参与者都日益担心被“Uber 化”，正如这在不同程度上已在出租车司机、书店主和餐厅经营者身上发生的那样。保险公司也担心新数字参与者的到来，即保险领域的“Uber
    型”或“免费型”公司，它们将带来价格的下降和灵活的数字化服务，且不会受到复杂投资组合历史负担的阻碍。


    保险公司深知，客户并不希望“为他人买单”，高性能平台已经让他们习惯了服务的个性化，而他们希望在所有的供应商处都能获得这种服务。他们紧密观察并经常与金融科技（Fintech）和保险科技（Insurtech）合作。这些领域在千年创意冲动的驱动下蓬勃发展，其背后是那些投身创业的年轻毕业生，他们准备好加速一切，远离他们长辈在大型企业职业中的舒适与束缚。


    对于保险公司来说，问题在于分析我们大数据世界这一新数字背景所带来的机遇与风险，并在这一快速变化的宇宙中定义它们的战略方法。


    ## 4.3. 机会：新方法、新产品、新可保风险、新管理工具


    保险经营者是数据专业人士。在技术层面，为了确保偿付能力并履行承诺，他们的风险评估基于对过去结果的观察，并通过严谨的假设-演绎法对未来设定了一系列假设。精算师使用的随机模型（包括广义线性模型
    `GLM`）是由假设驱动的。《偿付能力 II》（`Solvency II`）监管本身也基于这些方法，而监管机构 `ACPR` 对数据和使用的内部模型进行控制，并要求具有可解释性。


    因此，精算师传统的统计和概率方法远未过时。


    ### 4.3.1. 新的数据处理方法


    在大数据世界，新方法丰富了风险评估、产品构建和与客户接触的能力。


    这种方法与建模方法不同。变量数量过高，无法应用相同的技术。然而，这些并非 `a priori`（先验）选择的变量，而是新获得的现有数据，这些数据往往被证明对所研究的主没有解释价值。然而，工作恰恰在于检测这些新数据具有解释性或预测性的情况，而在这些情况下，数据才会产生价值。为了从海量数据中提取相关信息，因此必须从数据驱动的角度来看数据，并使用学习算法：决策树、神经网络、随机森林甚至是无监督分类算法。


    精算师过去已知这类某些算法，但在此之前的大数据时代，他们很少有机会使用它们。神经算法和分类方法对于精炼同质化定价群体很有价值。然而，它们仅被用于投保、理赔或其他内部数据数据库的内部数值数据，这限制了它们的预测能力。


    因此，数据驱动是一种处理数据的新方法，不预设（`a priori`），有助于发现未被察觉的相关性和相似性。然而，我们不应忘记业务经验，特别是相关性并不同于因果关系。理解背景对于正确使用大数据和算法至关重要。在这方面，由于其特殊的反向周期和与时间的不同关系，保险公司的业务与许多大数据业务有所不同。算法结果必须是可解释的，并且必须能够解释所做的决策。


    与大数据中的许多前沿活动不同，大多数传统的保险活动（与客户的互动外）并不需要纳秒级的即时处理。目前，处理速度很少优先于结果的可解释性。在现行保险合同的框架内，合同期限通常较长（通常为
    1 年），预测的跨度比大多数数字业务长得多，且情况的重复性也没那么高。

    '
