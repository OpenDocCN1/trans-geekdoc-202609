  trans: '

    在某些方面，数字技术所青睐的比较工具的发展以及公共机构为了促进竞争而采取的措施（使被保险人处于选择地位），为保险公司带来了新的接触和市场推广机会。然而，由于存在反向周期，保险公司的客户体验比产品销售商更难实现，因为这种周期延迟了“产品的交付”，而客户实际上并不真正想要接收这种产品，因为这意味着灾难的发生。


    在经济危机、购买力下降以及生态意识的背景下，个人正在寻求消费解决方案，而非拥有实用物品。许多城市盛起了“vélib’”（共享自行车）以及“Autolib’”（共享汽车）。我们是否已经永久性地进入了一个“使用重于所有”的社会？无论如何，客户（无论是自然人还是法人）日益关注价格，有时甚至以质量为代价。


    然而，价格已经失去了其经济价值上的意义。数字技术让个人习惯了 `Google`、`Facebook` 以及其他“免费”服务，而结算通过免费投入所有用户数据来间接完成，这些数据随后成为激烈商业活动的对象。这还允许航空公司和
    `SNCF`（法国国家铁路公司）根据预订时的上座率（有时是其他更可疑的标准）收取完全不同的价格，这可能导致乘客在相同的条件下一起旅行，却支付着从 1 到 10
    不等的价格。用户不再有任何参考，并倾向于认为大公司获取了过高的利润、浪费资源并收费过高，而且总能找到更低的价格。一方面，用户通过比较工具更了解市场保险费率，通过开放数据（或即将访问的基因组）更了解自己的风险；另一方面，他们对价格不再有稳定的参考标准，而他们并不理解这些价格的形成机制。数字技术带来的客户与保险公司之间信息不对称的减少，并没有真正增强信任。


    在这个被平台宠溺、并以智能手机武装的新型数字世界中，个人正在意识到自己的力量：带着一种完全掌控的感觉，他们通过推文对电视节目发表意见，通过拍摄新闻现场充当记者，并直接向政治家提问。有点像青少年一样，他们对未知的网络用户、论坛或平台的信任超过了对公认专家的信任。


    这在一定解释了所谓“协作”平台（`BlaBlaCar`、`Airbnb` 等）的成功，这些平台将个人聚集在一起交换服务：拼车、借用房屋或园艺工具，以及公寓、汽车等的临时租赁。经济论点也被强力提出，因为据计算，协作经济带来的经济收益平均每人可达
    495 欧元。


    得益于监管放宽，这种协作经济也延伸到了金融活动，例如 `crowdfunding`（众筹）。


    一些消费者也开始依靠 `blockchain` 技术和社交网络来摆脱平台。通过对经验、技能和机构提出，网络用户中出现了一种通过点对点网络进行组织的趋势。社区正在建立，并且得益于社交网络、集体智能和
    `blockchain` 技术，他们正在规划以往委托给受公共机构监管和控制的信誉第三方的交易。在美国，这种类型的社区（点对点动态）提议通过 `LinkedIn`
    执行社区的失业保险。另一个名为“Teambrella”的社区对其成员的汽车保险范围感兴趣，并通过投票决定保险价格和新成员的加入。


    在 `B2C`（企业对消费者）和 `B2B`（企业对企业）时代之后，现在是 `C2C`（消费者对消费者）的时代吗？


    ### 4.2.3. 客户对算法和技术的信任


    公众正在养成与机器人打交道的习惯，并正在很好地适应：自动取款机、机场、银行、超市、自动地铁。算法被认为比人类更可靠，许多人倾向于接受机器人引导而非人类。机器人永不疲倦，没有生理需求或情绪，也没有情感。由于其理性，它被认为是客观的，尽管它是由人类编写的，并取决于传递给它的文化，且这种客观性在不同国家之间存在差异。算法并非客观的。相反，它具有规范性并强加标准和价值观。个人对技术的信任还涉及加密技术：`Bitcoin
    blockchain` 似乎是安全的，而 `code is law`（代码即法律）适用于 `Ethereum blockchain`。人们现在倾向于信任技术而非建立了几几个世纪的机构——“信誉第三方”。这种不信任的趋势影响着所有机构，特别是政治家和记者，尽管它尚未完全触及他们。这种趋势在一定程度上被人类接触的需求所抵消（尽管在线购买产品日益增加）。在保险领域，与经理接触以处理理赔的需求增加了。


    此外，针对“黑箱”也开始出现抵制，例如针对大学录取的 `APB` 算法的抗议运动。


    ### 4.2.4. 对数字足迹可能后果的某种忽视


    这种对“机构”信任的缺失，与对连接物体和平台留下的数字足迹可能产生后果的不信任形成了对比。这些连接物体正在发展，尽管它们可能需要一段时间。


    例如，连接的 `Apple Watch` 经常进步，现在的销量已超过了 `Swatch` 手表。银行卡、会员卡、`Navigo` 卡、网页浏览、智能手机、联网汽车、定位、智能电表、报警器、家居自动化、医疗设备等都在以可持续的方式追踪用户，表面上并没有移动他们。


    然而，足迹的增加和交叉（特别是通过深度学习）使每个人变得可追踪，即使是那些在数字网络上不活跃的人也是如此，因为他们与其他连接的人联网。例如，只要有一个 `Facebook`
    用户的父母或朋友，`Facebook` 就能通过深度学习了解我们的一切，我们的喜好、兴趣、习惯等。

    '
