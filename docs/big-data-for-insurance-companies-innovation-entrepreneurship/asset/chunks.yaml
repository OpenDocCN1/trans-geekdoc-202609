  trans: "\n\n- 根据某种网格，其邻域结构由邻域函数决定。单位由 `^d*` 的子集 `I` 表示，邻域函数是定义在 `I × I` 上的 `Λ` 函数，其满足：\n\
    \    - 对称性（即 `Λ(i, j) = Λ(j, i)`），\n    - 仅取决于 `I` 上的距离，\n    - 随距离增加而减小：当 `(i,\
    \ j) ⟶ ∞` 时，`Λ(i, j) ⟶ 0`。\n\n通常认为 `Λ(i, i) = 1`。\n\n当 `Λ(i, j) = 1` 时，我们说 `i`\
    \ 和 `j` 是强连接的；当 `Λ(i, j) = 0` 时，`i` 和 `j` 是完全不连通且没有交互。\n\n每个单位 `i` 都提供一个指向数据空间的状态向量\
    \ `Wi ∈ ^p*`，并且可以被修改。网络在 `t` 刻的状态由 `(Wi, i ∈ I)` 给出。\n\n目标是找到具有以下属性的 `W[i]` 向量：\n\
    \    - 量化：`capx` 中区域 `A` 内 `W[i]` 向量的数量近似正比于 `μ(A)`；\n    - 组织：两个靠近的单位 `i` 和 `j`（即\
    \ `Λ(i, j) ≈ 1`）具有接近的 `W[i]` 和 `W[j]` 向量。\n\n一旦了这些 `W[i]` 向量，它们被用于定义任何元素 `x ∈\
    \ capx` 的类别：我们将类别 `i∗` 归于 `x`，使得：\n\n\\[3.34\\]\n\n其中 `∥. ∥` 是 `^p*` 上的范数。现在让我们研究\
    \ Kohonen 算法，它通过一种学习方法确定 `W[i]` 向量。\n\n### 3.6.2 Kohonen 算法\n\n这是一种迭代学习算法，根据输入它的数据修改\
    \ `W[i]` 状态向量：\n    - 向量 `Wi` 随机初始化；\n    - 如果在 `t ∈ upn` 刻，网络状态由 `W(t) = {Wi,\
    \ i ∈ I}` 给出，那么 `t + 1` 刻的状态将如下确定：从数据空间 `capx` 中随机选择一个向量 `x(t + 1)`。\n\n随后，“竞争阶段”指定获胜单位：\n\
    \n\\[3.35\\]\n\n在多个单位最小化该距离的情况下，会约定一种规则，例如对于 `^d*` 字典序取第一个索引 `i`。\n\n“协作阶段”修改\
    \ `W[i]` 向量：\n\n\\[3.36\\]\n\n其中 `Λ[t]` 是邻域函数，它可以随时间变化，且 `ε[t] ∈ [0,1]` 是自适应参数。\n\
    \n只要 `t` 小于预先的阈值 `M`，算法就会继续，否则可以施加一个备选或额外的停止条件，在没有明显改进时停止算法。算法的关键参数是数据空间的维度 `p`、概率分布\
    \ `μ`（它刻画了观测值在数据空间中的分布方式）、网络拓扑、常数或随时间变化的邻域函数 `Λ[t]`，以及自适应参数 `ε[t]`（取值在 `[0,1]`，可能随\
    \ `t` 恒定或减小）。\n\n邻域函数在这里起着重要作用：只有靠近获胜单位 `i∗` 的单位，其 `W[i]` 向量会被显著修改：因此有了协作的概念。以下是一些邻域函数的常见示例：\n\
    \    - `i0076-01`（其中 `k` 是固定值，例如 `k = 1` 或 `k = 2`）；\n    - `Λt = g(capd(i, j))`，其中\
    \ `g` 是钟形函数；\n    - `Λt = g(capd(i, j))/λ(t)`，当 `t ⟶ ∞` 时，`λ(t) ⟶ 0`。\n\n一个常见的示例是\
    \ `Λt = exp(−capd(i, j)²2σ(t)²)`，其中：\n    - `σ(t) = σi((t/M))`，对于 `σ[i] > σ[f]\
    \ > 0`（例如 `σ[i] = 5` 且 `f = 0.2`）。\n\n自适应参数 `ε[t]` 在算法收敛中起着重要作用。例如，我们可以选择 `ε[t]`\
    \ 使得 `∑[t≥0] ε[t] = + ∞` 且 `∑t≥0² < + ∞`，如 `ε[t] = 1/t`（来自随机算法的 Robbins–Monro\
    \ 条件）。\n\n另一个常见的示例是 `ε(t) = εi((t/M))`，对于 `ε[i] > ε[f] > 0`（例如 `ε[i] = 0.1` 且\
    \ `ε[f] = 0.005`）。\n\n该算法的收敛性分析是一个复杂的数学问题。尽管大多数 Kohonen 算法应用至少涉及 2 维数据空间并表现出自组织现象。\n\
    \n### 3.6.3 应用\n\n该算法及其变体已被提出。特别是，它是可以应用的。大多数 Kohonen 算法应用至少涉及 2 维数据空间并表现出自组织现象。\n\
    \nKohonen 算法在 `kohonen` 包中特别有实现。\n\n### 3.7 参考文献\n\n- `AUI12`\n- `BAR07`\n- `BIA10`\n\
    - `BIA16a`\n- `BIA16b`\n- `BRE84`\n- `BRE96a`\n- `BRE96b`\n- `BRE01`\n- `CAR08`\n\
    - `CHA05`\n- `COR95`\n\n"
