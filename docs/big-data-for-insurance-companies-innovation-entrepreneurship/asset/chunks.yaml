- raw: "*   – the weak development of test and learn culture and valuation of failure:\
    \ if in the United States failure is often considered a prerequisite for success,\
    \ in Europe, this culture is less widespread and insurers often wish to identify,\
    \ prior to their implementation, uses of machine learning likely to have a substantial\
    \ contribution.\n\nThe implementation of experiments, regularly designated as\
    \ proof of concept or proof of value, makes it possible to highlight the contribution\
    \ of data science approaches prior to their industrialization. However, although\
    \ the algorithms implemented are often designed to be scalable, the ROI (return\
    \ on investment) obtained is not always scalable.\n\n### 5.4.3. *Constraints,\
    \ according to the purposes, with regard to the types of algorithms used*\n\n\
    The auditability requirements relating to certain processes (calculation of technical\
    \ provisions and pricing in particular) imply that certain algorithms cannot be\
    \ used to their full potential. It is thus possible to use them for the identification\
    \ of discriminatory variables, but the final calibration must ultimately be carried\
    \ out using algorithms allowing greater auditability (generalized linear model,\
    \ for example).\n\nThus, random forests or gradient boosting algorithms, while\
    \ providing convincing prediction results, cannot generally be used for pricing\
    \ or risk management purposes. More marketing- and distribution-oriented approaches\
    \ are less constrained and can benefit from them, and beyond insurers’ initial\
    \ desire to optimize their business processes, these constraints partly explain\
    \ the delay in the adoption of data science in risk management.\n\nThe growing\
    \ adoption and dissemination of data science methodologies may ultimately lead\
    \ to a relaxation of constraints subject to a documented justification of the\
    \ strong predictive capacities of these algorithms and highlighting of their utility.\n\
    \n### 5.4.4. *Scarcity of profiles and main differences with actuaries*\n\nThe\
    \ French need for data scientists is estimated between 2000 and 3000 persons per\
    \ year, in all sectors. Despite the development of adapted training in recent\
    \ years, it is clear that this need is, at this stage, far from being covered.\n\
    \nTraining courses to acquire skills in data science and insurance are even fewer.\
    \ In addition, the French Institute of Actuaries has implemented a training program\
    \ dedicated to the application of data science in insurance, accessible to both\
    \ actuaries and actuarial researchers.\n\nOther training courses are now available,\
    \ but there are still very few of them, and the acquisition of business knowledge\
    \ necessary for data scientists to reveal the full potential of their know-how\
    \ is most often done directly in companies.\n\nThus, data scientists, logically,\
    \ at least have to first work with actuaries to benefit from their knowledge of\
    \ the processes related to insurance, product specificities and guarantees. However,\
    \ although the collaboration between figure-lovers is easily established and the\
