    对于海量数据，一种特别合适的方法是**堆叠**（stacking），它在机器学习竞赛中取得了卓越成果，其中最著名的百万美元 Netflix 挑战赛。2009
    年，两个最优方案根据 [WOL 92] 和 [BRE 96] 引入的堆叠技术结合了许多模型。让我们从回归的背景开始。考虑 `M` 个预测：![images](img/ycirc.jpg)`[m]`
    = `f[m]`(x) `m` = 1,… `M`，这些是通过使用 `M` 个模型或不同的算法得到的，可以是任何类型：线性或非线性、神经网络、回归树等。非常简单的想法是寻找一个线性组合：![images](img/i0035-01.jpg)，该组合提供了最小平方误差之和。在原始版本中，为了避免更复杂的模型因为在学习中预测更好而获得更大的权重，对标准进行了修改，使得每个
    `y[i]` 的预测是通过移除观测值 `i` 完成的（预测残差）：


    \[2.4\] ![image](img/eq2-4.jpg)


    但当 `n` 很大时，其影响很其微。


    相反，如 [NOC 16] 所示，一旦这些模型有效，不同模型之间的预测值高度相关，这会导致权重 `w[i]` 的估计变得不稳定。因此，必须对最小二乘法进行正则化。一种可能性是在不含常数项的情况下对
    `m` 个预测值进行回归，约束是权重 `w[i]` 为正且之和等于 1，类似于贝叶斯模型平均。另一种更简单的解决方案是进行 PLS 回归（见 section
    2.6.1.2）：由于 `M` 个预测值正相关，单个 PLS 分量通常足够了，并能确保权重的正性。


    扩展到监督分类时，将 ![images](img/ycirc.jpg)`[m]` 值取为属于感兴趣的类别的概率。由于 `y[i]` 是二分类的，我们将使用
    PLS 逻辑回归代替 PLS 回归来估计权重。


    预测变量扩展到几何平均值的建议已被提出，此外还对每个预测变量或某些预测变量组合的优势区域进行了搜索。然而，在实践中，堆叠被证明是非常有效的，因为根据构造方式，`M`
    个预测值的最优线性组合必然优于其中任何一个。


    ## 2.6. 高维情况


    数据也可能是海量的，意义上 `p`（变量数量）远大于 `n`（观测值数量）。网络数据或生物学数据就是如此情况，在这些领域中计算数千个变量并不罕见。当 `p>>n`
    时，无法应用回归类型的预测方法，因为最小二乘估计量不存在。如果我们想保留所有的预测变量，将求助于正则化方法，或者使用稀疏方法。


    ### 2.6.1. 正则化回归


    它们通过投影到子空间或约束系数向量来运行。估计量是有偏的，并且丢失了尺度变化下的不变性性质。在应用这些方法之前，将对数据进行中心化和降维。


    ### 2.6.1.1. 主成分回归


    这无疑是最老的方法，由 Edmond Malinvaud 在 1964 年应用于计量经济学以解决多重共线性问题。它涉及通过使用 `q < p` 个主成分来减少预测变量的空间，然后通过最小二乘法对这些成分进行响应值
    `Y` 的回归。由于主成分是预测变量的线性组合，我们最终得到了预测变量的组合：


    \[2.5\] ![image](img/eq2-5.jpg)


    系数 ![images](img/alcirc.jpg) 和 ![images](img/btcirc.jpg) 向量通过使用重构公式 `q`（截断 SVD）**X**
    = **CU*** 直接得到，其中 **C** 是主成分矩阵，**U** 是正交主因子矩阵：


    \[2.6\] ![image](img/eq2-6.jpg)


    符号 `+` 指 Moore–Penrose 逆。


    在这里


    \[2.7\] ![image](img/eq2-7.jpg)


    以及


    \[2.8\] ![image](img/eq2-8.jpg)


    通常情况下，`q` 通过交叉验证选择，但对主成分的回归有以下缺点：主成分仅取决于预测变量而不取决于响应值，且它们的排序并不一定反映与该响应值的相关性。


    ### 2.6.1.2. PLS 回归


    由 H. 和 S. Wold 开发的 PLS 回归类似于主成分回归，因为数据也被投影到预测变量的线性不相关组合上。主要区别在于，PLS 分量经过优化以也对
    `Y` 具有预测，而主成分只提取预测变量的最大方差，而不考虑 `Y`。用于获取第一个 PLS 分量 `t = Xw` 的标准是 Tucker 标准：


    \[2.9\] ![image](img/eq2-9.jpg)


    由于


    \[2.10\] ![image](img/eq2-10.jpg)


    我们在最大化 `t` 与 `y` 之间的相关性（回归）和最大化 `t` 的方差（预测变量的 PCA）之间取得了折中。


    解决方案如下：对于第一个 PLS 分量，每个变量的 `w[j]` 系数在乘常数范围内，等于 `x[j]` 与 `y` 之间的协方差，这确保了符号的一致性。后续分量是通过赤化得到的，即在对
    `t` 进行回归后，对 `Y` 和预测变量的残差迭代该过程。该算法不需要对角化或矩阵求逆，简单简单使得处理海量数据成为可能。更多细节参考 [TEN 98]。


    ### 2.6.1.3. 岭回归（Ridge regression）


    由 Hoerl 和 Kennard 在 70 年代发明，这是 Tikhonov 正则化的特殊情况：为了避免系数不稳定，我们对它们的范数施加约束：


    \[2.11\] ![image](img/eq2-11.jpg)


    这等同于在 **X’X** 的对角元素上加上常数以“便于”求逆：


    \[2.12\] ![image](img/eq2-12.jpg)


    常数 `k` 通过交叉验证确定。


    ### 2.6.2. 稀疏方法


    前面的方法能够获得所有变量的函数，这当 `p` 很大时是一个缺点：如何解释数百或数千个变量的线性组合？与其诉助于逐步选择技术，在 L[1] 范数中使用约束通过允许选择和正则化有效地解决了问题。


    ### 2.6.2.1. Lasso


    Lasso 或最小绝对收缩选择算子由 [TIB96] 引入，由最小化残差平方并加上回归系数绝对值和的限制（L[1] 惩罚）：


    \[2.13\] ![image](img/eq2-13.jpg)


    这等同于


    \[2.14\] ![image](img/eq2-14.jpg)


    当 `c` 减小时，由于使用了 L[1] 范数，回归系数减小且某些被消除。参数 `c` 通常通过交叉验证获得，目标是获得最佳的 `Y` 预测。


    随后出现了许多开发：PLS 回归的稀疏变，以及适用于预测变量分为块的组 Lasso：该方法有助于消除整个变量块。


    ### 2.6.2.2. 稀疏主成分分析 (PCA) 和多重对应分析 (MCA)


