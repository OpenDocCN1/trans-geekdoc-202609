    \ functions from* ![image](images/upr.jpg)*to* ![image](images/upr.jpg), *W*¹\
    \ = (![images](images/iw1ij.jpg),*i* = 1, … , *p* + 1, *j* = 1, … *m*) *and W*²\
    \ = (![images](images/iw2ij.jpg), *j* = 1, … , *m* + 1, *j* = 1, …. *q*) *real\
    \ matrices*\n\n*The function:*\n\n![images](images/f0054-01.jpg)\n\n*is called\
    \ Perceptron with hidden layer synaptic weights* (![images](images/iw1ij.jpg))\
    \ *and* (![images](images/iw2ij.jpg)) *of* *activation functions* *ϕ[c] and ϕ[s]\
    \ with the convention:*\n\n![images](images/f0054-02.jpg)\n\nThe activation functions\
    \ are the same for all the units of the same layer, that is, *ϕ[c]* for those\
    \ of the hidden layer and *ϕ[s]* for those of the output. In practice, these functions\
    \ are generally the Heaviside step function, linear functions or sigmoid functions.\
    \ However, we can imagine other choices such as trigonometric functions.\n\nTo\
    \ simplify the notations, we have limited ourselves to the definition of a network\
    \ with a hidden layer. This construction is easily generalized in the case of\
    \ networks with several hidden layers. This idea is at the origin of deep learning\
    \ methods (LeCun, Hinton, Bengio) (see, for example, the article by J. Schmidhuber\
    \ \\[SCH 15\\]).\n\nAs early as 1969, Minsky and Papert showed that a multilayer\
    \ network could surpass the limitations of the simple Perceptron. However, it\
    \ was not until the works of Le Cun (1985), McClelland and Rumelhart (1986), including\
    \ the famous learning algorithm of “gradient backpropagation” that the connectionist\
    \ methods were actually used. This algorithm is in fact a generalization of an\
    \ algorithm proposed by Widrow–Hoff (1960) and the gradient method used is a relatively\
    \ classical method to solve variational problems in optimal control (Courant (1943),\
    \ Kelley (1960), Dreyfus (1962), Bryson and Ho (1969) to name a few). This algorithm,\
    \ which transforms the Perceptron from the classifier status (approximator of\
    \ functions ![image](images/upr.jpg)*^l* in {0,1}) to that of universal approximator,\
    \ will be justified mathematically by the results of Hornik (1989, 1992), Cybenko\
    \ (1989) and Barron (1993), which show, for example, that any function of ![image](images/upr.jpg)*^l*\
    \ in ![image](images/upr.jpg)*^n* having a finite number of discontinuities can\
    \ be approached with arbitrary precision by some networks with a hidden layer.\
    \ Let us set forth one of these fundamental theorems in the case of functions\
