    Chapter written by Franck VERMET.


    # 4 Current Vision


    ## 4.1 The insurance market: structured, regulated and long-term


    In France, the insurance market is essentially composed of large companies, often
    of international size, powerful and strong, resulting from combination of structures
    often created more a century ago, or subsidiaries of large banking groups.


    Several types of structures coexist: for-profit limited insurance companies, mutual
    insurance companies with non-profit status, provident institutions. Traditionally
    specialized in health insurance, many mutual insurers have grouped together or
    moved closer to provident institutions. Since the implementation of Solvency II
    prudential regulation, which applies to all of these structures’ activities, historical
    differences are partially erased, although differences in culture and values remain
    as well as mutual insurers, for example, selection.


    Insurance business requires an authorization. The authorization is issued by the
    `ACPR` Autorité de contrôle prudentiel et de resolution after reviewing a file
    providing all the project’s details, which must guarantee the financial strength
    as well as the skills of the management team. Authorization agreements are rare.
    However, in October 2016, an authorization was granted to a new digital insurance
    company, Alan.


    Insurance companies play a fundamental economic role. They allow companies to
    take risks, over time smooth the cost of accidents that can disrupt their operations
    and deal with serious claims that they would not be able to bear without the security
    provided by the insurers. Similarly, for individuals, they offer a pooling of
    everyday life risks (car, fire, disease, etc.) which, by spreading the cost of
    accidents on a large number of people, in space and time, makes it acceptable
    for everyone.

