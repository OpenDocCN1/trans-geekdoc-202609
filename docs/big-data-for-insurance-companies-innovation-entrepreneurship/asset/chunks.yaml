    \ to the GDPR constitute an important normative update. The current reference\
    \ framework for the use of personal data is the Data Protection Act of January\
    \ 6, 1978.\n\nIn addition to specifying new definitions around personal data,\
    \ the Regulation introduces new obligations and responsibilities for stakeholders.\n\
    \n**Table 5.5.** *New definitions distinguishing the data sensitivity level*\n\
    \n| **Terms** || **Definitions** |\n\n| --- | --- |\n\n| **Sensitive data** ||\
    \ Data that directly or indirectly reveal racial or ethnic origins, political,\
    \ philosophical or religious opinions, trade union membership of persons or relating\
    \ to health or sex life |\n\n| --- | --- |\n\n| **Health data** || Any information\
    \ relating to the physical or mental health of a person or to the provision of\
    \ health services to that person |\n\n| **Medical data** || Data that reveal or\
    \ are likely to reveal the pathological condition of persons, produced or collected\
    \ during a prevention, diagnosis or care activity |\n\nThus, the data processing\
    \ officer must ensure the implementation of proactive measures aimed at preventing\
    \ as early as possible the infringement of human rights.\n\n**Table 5.6.** *Data\
    \ security requirements*\n\n*(Source: Optimind Winter, GDPR publication of September\
    \ 2016 \\[OPT 16\\])*\n\n| **\uFEFFRequirements** || **Definitions** |\n\n| ---\
    \ | --- |\n\n| **Data protection from the design stage** || “The data processing\
    \ officer must implement, both at the time of determining the processing means\
    \ and at the time of processing itself, appropriate technical and organizational\
    \ measures, such as pseudonymization, which are intended to implement the principles\
    \ relating to data protection, for example, the minimization of data in an effective\
    \ manner and to match the processing of the necessary guarantees to meet the requirements\
    \ of these Regulations as well as to protect the rights of the data subject”.\
    \ |\n\n| --- | --- |\n\n| **Data protection by default** || The data processing\
    \ officer shall implement the appropriate technical and organizational measures\
    \ to ensure that, by default:  \n\n– only the personal data necessary for each\
    \ specific processing purpose are processed. This applies to the amount of personal\
    \ data collected, the extent of their processing, their shelf life and accessibility\
    \ (data minimization principle);  \n\n– personal data are not made accessible\
    \ to an undetermined number of natural persons without the involvement of the\
    \ natural person concerned (personal data access limitation principle). |\n\n\
    | **Risk analysis and impact study** || Prior to any processing likely to present\
    \ a high risk, carrying out a privacy impact study. This includes processing that\
    \ present specific risks such as “the processing of information relating to \\\
    […\\] health”.  \n\nThroughout the data’s lifecycle, carrying out an objective\
    \ assessment of risk with respect to the processing nature, scope, context and\
    \ objectives. |\n\nSome public and private sector organizations are obliged to\
    \ appoint a data protection officer (DPO) in charge of enhancing the observance\
    \ of constraints as regards data protection by the various parties involved, by\
    \ specifically using a data dictionary and a register of processing activities\
    \ identifying, for each processing, the internal or external stakeholders, purposes,\
    \ categories of data and persons concerned including the deletion periods.\n\n\
    Given the new requirements stipulated by the GDPR, all banking and insurance stakeholders\
    \ must logically, following an impact assessment measuring the compliance deviation,\
    \ implement a review of their current personal data protection mechanism by the\
    \ deadline of May 25, 2018, date of immediate implementation of the Regulation.\
    \ In addition to the appointment of the DPO, various organizational and governance\
    \ projects are being initiated or are to be quickly considered for all banking\
    \ and insurance stakeholders.\n\nAs a complement to the GDPR, the French Military\
    \ Planning Act also defines specific constraints for organizations of vital importance.\
    \ Some banking and insurance stakeholders may therefore be subject to additional\
    \ requirements to those laid down by the GDPR.\n\nFinally, the Digital Republic\
    \ Act, which emphasizes a proactive policy with regard to open data at the level\
    \ of national public services, the right to oblivion and data portability, must\
    \ still be the subject of implementing decrees. It constitutes both a constraint\
    \ and a source of opportunity given the new data sources that will be made available\
    \ and the additional requirements that it entails.\n\nNOTE.– Within the meaning\
    \ of Law No. 78-17 of January 6, 1978 relating to information technology, files\
    \ and freedoms (version consolidated on June 2, 2016), personal data means “all\
    \ information relating to an identified natural person or which may be directly\
    \ or indirectly identified, by reference to an identification number or to one\
    \ or more of its own elements”.\n\n#### 5.4.2.2. *Cultural constraints*\n\nThere\
    \ may exist different cultural constraints in the adoption of data valuation and\
    \ the use of machine learning:\n\n*   – beyond normative constraints, sensitivity\
    \ to the collection and use of personal data: policyholders seem more inclined\
    \ to allow insurers to use their data, provided they have price offers or services\
    \ adapted to them. Significant differences may exist between populations or population\
    \ segments, so this wealth of data remains logically underexploited;\n\n*   –\
    \ development of open data: in France, a proactive policy exists, but this is\
    \ not necessarily the case in other countries;"
