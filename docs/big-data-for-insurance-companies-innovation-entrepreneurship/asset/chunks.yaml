- raw: "This definition of the big data phenomenon presents an interesting point of\
    \ view. It focuses on the loss of capability of classical tools to process such\
    \ high volumes of data. This point of view was put forward in a report from the\
    \ consulting firm McKinsey and Company that describes big data as data whose scale,\
    \ distribution, diversity and transience require new architectures and analysis\
    \ techniques that can unlock new sources of value added \\[MAN 11\\]. Of course,\
    \ this point of view prevails today (in 2016, as these lines are being written)\
    \ and a universal definition must use more generic characteristics that will stand\
    \ the test of time. However, like many new concepts, there are as many definitions\
    \ as there are authors on the subject. We refer the reader to \\[WAR 13\\] for\
    \ an interesting discussion on this theme. To date the genesis of big data, why\
    \ not make use of one of their greatest suppliers, the tech giant Google? Hence,\
    \ we have extracted, with the help of the Google Trends tool, the growth in the\
    \ number of searches for the term “big data” on the famous search engine. [Figure\
    \ 1.1](#chapter01.xhtml#fig1-1) shows an almost exponential growth in the interest\
    \ of people using the search engine from 2010 onwards, a sign of the youth of\
    \ the term and perhaps a certain degree of surprise at a suddenly uncontrollable\
    \ volume of data, as the Wikipedia definition, still relevant in 2016, suggests.\
    \ However, articles have widely been using this concept since 1998, to relate\
    \ a future development of data quantities and databases towards larger and larger\
    \ scales \\[FAN 13, DIE 12\\]. The reference article, widely cited by the scientific\
    \ community, dates from 2001 and is attributed to Doug Laney from the consultancy\
    \ firm Gartner \\[LAN 01\\]. Curiously, the document never mentions the term big\
    \ data, although it features the reference characterization of three Vs: *volume,\
    \ velocity* and *variety*. “Volume” describes the size of the data, the term “velocity”\
    \ captures the speed at which it is generated, communicated and must be processed,\
    \ while the term “variety” refers to the heterogeneous nature of these new data\
    \ ﬂows. Most articles agree on the basic three Vs (see \\[FAN 13, FAN 14, CHE\
    \ 14\\]), to which the fourth V of *veracity* (attributed to IBM \\[IBM 16\\]),\
    \ as well as the fifth V, *value*, are added. The term “veracity” focuses on the\
    \ reliability of the various data. Indeed, data can be erroneous, incomplete or\
    \ too old for the intended analysis. The fifth V conveys the fact that data must\
    \ above all create value for the companies involved, or society in general. In\
    \ this respect, just as certain authors remind us that small volumes can create\
    \ value (“small data also may lead to big value”, see \\[GU 14\\]), we should\
    \ not forget that companies, through adopting practices suited to big data, must\
    \ most of all store, process and create *intelligent* data. Perhaps we should\
    \ be talking about *smart data* rather than big data?\n\n## 1.3. Characterizing\
    \ big data with the five Vs\n\nIn our initial assessment of the big data phenomenon,\
    \ it should be noted that the 3 Vs framework of volume, velocity and variety,\
    \ popularized by the research firm Gartner \\[LAN 01\\], is now standard. We will\
    \ thus start with this classical scheme, shown in [Figure 1.2](#chapter01.xhtml#fig1-2),\
    \ before considering other Vs, which will soon prove to be useful for developing\
    \ this initial description.\n\n![Figure 1.1. Evolution of the interest in the\
    \ term big data for Google searches (source: Google Trends, 27th September 2016)](images/fig1-1.jpg)\n\
    \n**[Figure 1.1](#chapter01.xhtml#ifig1-1).** *Evolution of the interest in the\
    \ term big data for Google searches (source: Google Trends, 27th September 2016)*\n\
    \n![Figure 1.2. The three Vs of big data](images/fig1-2.jpg)\n\n**[Figure 1.2](#chapter01.xhtml#ifig1-2).**\
    \ *The three Vs of big data*\n\n### 1.3.1. *Variety*\n\nIn a break with tradition,\
    \ we will start by focusing on the variety, rather than volume, of data. We refer\
    \ here to the different types of data available today. As we illustrated in the\
    \ introduction, data originates everywhere, for example:\n\n*   – texts, photos\
    \ and videos (Internet, etc.);\n\n*   – spatio-temporal information (mobile devices,\
    \ smart sensors, etc.);\n\n*   – metadata on telephone messages and calls (mobile\
    \ devices, etc.);\n\n*   – medical information (patient databases, smart objects,\
    \ etc.);\n\n*   – astronomical and geographical data (satellites, ground-based\
    \ observatories, etc.);\n\n*   – client data (client databases, sensors and networked\
    \ objects, etc.).\n\nThe handful of examples listed above illustrate the heterogeneity\
    \ of sources and data – “classical” data like that seen before the era of big\
    \ data, evidently, and also video signals, audio signals, metadata, etc.\n\nThis\
    \ diversity of content has brought about an initial paradigm shift from structured\
    \ to non-structured data. In the past, much data could be considered to be structured\
    \ in the sense that they could be stored in relational databases. This was how\
    \ client or commercial data was stored. Today, a large proportion of data is not\
    \ structured (photos, video sequences, account updates, social network statuses,\
    \ conversations, sensor data, recordings, etc.).\n\n### 1.3.2. *Volume*\n\nIf\
    \ you ask a range of different people to define big data, most of them will bring\
    \ up the concept of size, volume or quantity. Just close your eyes and imagine\
    \ the amount of messages, photos and videos exchanged per second globally. In\
    \ parallel to the developing interest for the concept of big data on the search\
    \ engine Google ([Figure 1.1](#chapter01.xhtml#fig1-1)), Internet usage has also\
    \ exploded in just a few years, as the annual number of Google searches bears\
    \ witness ([Table 1.1](#chapter01.xhtml#tab1-1)).\n\nThe explosion in Internet\
    \ usage, and in particular mobile Internet as made possible by smartphones and\
    \ high-speed standards, has led to an unstoppable growth in data volumes, towards\
    \ units that our oldest readers have surely recently discovered: gigabytes, terabytes,\
    \ petabytes, exabytes and even zettabytes (a zettabyte is 10^(21) bytes!), as\
    \ shown in [Figure 1.3](#chapter01.xhtml#fig1-3).\n\n**[Table 1.1](#chapter01.xhtml#itab1-1).**\
    \ *Annual Google statistics \\[STA 16b\\]*\n\n| **\uFEFFYear** || **Annual number\
    \ of searches** || **Average searches per day** |\n\n| --- | --- | --- |\n\n|\
    \ **2014** || 2,095,100,000,000 || 5,740,000,000 |\n\n| --- | --- | --- |\n\n\
    | **2013** || 2,161,530,000,000 || 5,922,000,000 |\n\n| **2012** || 1,873,910,000,000\
    \ || 5,134,000,000 |\n\n| **2011** || 1,722,071,000,000 || 4,717,000,000 |\n\n\
    | **2010** || 1,324,670,000,000 || 3,627,000,000 |\n\n| **2009** || 953,700,000,000\
    \ || 2,610,000,000 |\n\n| **2008** || 637,200,000,000 || 1,745,000,000 |\n\n|\
    \ **2007** || 438,000,000,000 || 1,200,000,000 |\n\n| **2000** || 22,000,000,000\
    \ || 60,000,000 |\n\n| **1998** || 3,600,000 || 9,800 |\n\n![Figure 1.3. Development\
    \ of data volumes and their units of measure](images/fig1-3.jpg)\n\n**[Figure\
    \ 1.3](#chapter01.xhtml#ifig1-3).** *Development of data volumes and their units\
    \ of measure*"
