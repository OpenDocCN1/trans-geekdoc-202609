  trans: "\n\n-   测试与学习文化的薄弱以及对失败的重视不足：如果说在美国失败通常被视为成功的先决条件，那么欧洲这种文化并不普及，保险公司往往希望在实施之前，就能识别出可能产生重大贡献的机器学习应用。\n\
    \n实验的实施（通常称为概念证明或价值证明）使得在数据科学方法工业化之前突出其贡献成为可能。然而，尽管所实施的算法通常是为可扩展性而设计的，但所获得的投资回报率（ROI）并不总是是可扩展的。\n\
    \n### 5.4.3. 根据用途对所用算法类型的限制\n\n针对某些流程（特别是技术准备金的计算和定价）的审计要求意味着，某些算法无法充分发挥潜力。因此，可以使用这些算法来识别歧视性变量，但最终的校准必须使用具有更高可审计性的算法（例如广义线性模型）来进行。\n\
    \n因此，随机森林或梯度提升算法虽然提供了具有说服力的预测结果，但通常不能用于定价或风险管理。更偏向营销和分销的方法限制较少，并从中获益；除了保险公司最初优化业务流程的意愿外，这些限制也部分解释了数据科学在风险管理中采用的延迟。\n\
    \n数据科学方法的日益采用和传播，最终可能在对这些算法的强大预测能力进行记录证明并强调其效用的前提下，导致限制放宽。\n\n### 5.4.4. 人才短缺与精算师的主要区别\n\
    \n据估计，法国各行业对数据科学家的需求每年在 2000 到 3000 人之间。尽管近年来开发了适应性培训，但显然，这种需求在现阶段远未得到。\n\n获取数据科学和保险技能的课程更为稀少。此外，法国精算师学会实施了一项针对数据科学在保险领域应用的培训计划，精算师和精算研究人员均可参加。\n\
    \n现在还有其他课程，但仍然非常少，而且数据科学家充分发挥其专业知识所需的业务知识大多数是直接在公司内部获取的。\n\n因此，逻辑上，数据科学家至少首先必须与精算师合作，以利用他们对保险相关流程、产品特性和保障的知识。然而，尽管这些“数字爱好者”之间的合作很容易建立，且不同双方的技能可以在某些方面逐渐汇合，但正如表\
    \ 5.7 所示，这两个职业的平均特征仍然保持相对独立。\n\n由于任何稀缺的东西都会变得昂贵，接受过充分培训的数据科学家往往有权获得最具竞争力的薪包。此外，一些利益相关者尽管意识到数据价值的战略性质以及可能出现的机遇，但仍然不愿将其薪酬方案与市场标准对齐，因此发现招聘困难。数据科学领域保险专用产品的成熟化，以及针对数据科学家职业的培训课程的增加，应该使得逐渐克服这些困难成为可能。\n\
    \n**表 5.7。** 精算师和数据科学家的预期技能\n\n*来源：Optimind Winter, 《Big Data Book in Insurance,\
    \ 2014》*\n\n| **精算师** | **数据科学家** |\n| :--- | :--- |\n| **主要职能** | |\n| 定价 | |\n\
    | 准备金提取 | |\n| 执行盘点 | |\n| 遵守监管和审慎限制 | 数据源监控 |\n| 实施和使用预测模型 | 商业智能解决方案监控 |\n|\
    \ | 实施和使用预测算法 |\n| | 客户行为识别 |\n| | 客户价值优化 |\n| 对产品创建的贡献 | 对风险管理的贡献 | 数据质量管理 |\n\
    | **所需主要技能的预期水平** | |\n| 内部数据知识 | +++ | +++ |\n| 对外部数据的敏感性 | + | +++ |\n| 产品知识\
    \ | +++ | ++ |\n| 客户知识 | ++ | +++ |\n| 会计技能 | + | – |\n| 技术和财务技能 | +++ | + |\n\
    | 商业智能技能 | + | +++ |\n| 预测算法 | + | +++ |\n| 前瞻性建模及专用工具 | +++ | + |\n| 法律限制 | +\
    \ | + |\n| 战略管理 | ++ | – |\n| 遵守决策/治理流程 | ++ | ++ |\n\n*注：不同职能的权重和预期水平仅供参考；它们可能根据组织而异（主要取决于其规模和所从事的保险活动）*。\n\
    \n### 5.5. 参考文献\n\n[ARG 17] ARGUS DE L’ASSURANCE, “Métiers : l’assurance indicielle,\
    \ une solution prometteuse”, 访问：[`www.argusdelassurance.com/metiers/metiers-l-assurance-indicielle-une-solution-prometteuse.98859`](http://www.argusdelassurance.com/metiers/metiers-l-assurance-indicielle-une-solution-prometteuse.98859),\
    \ 2017 年 2 月 2 日。\n\n[CHA 15] CHARPENTIER A., DENUIT M., ROMUALD ELIE R., “Segmentation\
    \ et mutualisation: Les deux faces d’une même pièce?”, *Risques*, no. 103, pp.\
    \ 19–23, 2015 年 11 月。\n\n[CNI 17] CNIL, “Assurance: création d’un club conformité”,\
    \ 访问：[`www.cnil.fr/fr/assurance-creation-club-conformite`](http://www.cnil.fr/fr/assurance-creation-club-conformite),\
    \ 2017 年 2 月 2 日。\n\n[DAT 16] DATASQUARE, Optimind Winter, Retour d’expérience\
    \ comparé de 100% Data Science, L’Argus Editions, Antony, 2014.\n\n[OPT 16] OPTIMIND\
    \ WINTER, Entrée en vigueur du règlement européen sur la protection des données\
    \ personnelles, 2016 年 9 月。\n\n章节由 Emmanuel 撰写。\n\n# 作者列表\n\nEmmanuel Berthelé,\
    \ Optimind Winter, Paris, France\n\nRomain Billot, IMT Atlantique, Brest, France\n\
    \nCécile Bothorel, IMT Atlantique, Brest, France\n\nMarine Corlos-Habart, EURIA,\
    \ Brest, France\n\nJacques Janssen, Solvay Business School, Brussels, Belgium\
    \ \n\nPhilippe Lenca, IMT Atlantique, Brest, France\n\nFlorence Picard, Institut\
