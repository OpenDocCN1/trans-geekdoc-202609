    Gilbert Saporta, CNAM, Paris, France\n\nFranck Vermet, EURIA, Brest, France\n\n\
    # 索引\n\n## A, B, C\n\n* 精算师 (actuary)\n* 人工智能 (artificial intelligence)\n* 袋法\
    \ (bagging)\n* 提升法 (boosting)\n* 分类 (classification)\n* 客户关系 (client relationship)\n\
    * 商业保单 (commercial policy)\n* 交叉验证 (cross-validation)\n\n## D, E, F\n\n* 数据 (data)\n\
    \    * 驱动的 (driven)\n    * 挖掘 (mining)\n    * 职业 (professions)\n    * 科学 (science)\n\
    \    * 科学家 (scientist)\n    * 估值 (valuation)\n    * 仓库 (warehouse)\n* 决策树 (decision\
    \ trees)\n* 数字 (digital)\n* 数字化 (digitalization)\n* 分布式计算 (distributed computing)\n\
    * 经验风险 (empirical risk)\n* 伦理 (ethics)\n* 特征工程 (feature engineering)\n* 反欺诈 (fight\
    \ against fraud)\n\n## G, H, I, K\n\n* GDPR\n* Hadoop\n* 保险包 (insurance package)\n\
    * 霍宁算法 (Kohonen algorithm)\n\n## L, M, N\n\n* Lasso\n* 机器学习 (machine learning)\n\
    * MapReduce\n* 匹配 (matching)\n* 神经网络 (neural networks)\n\n## P, R, S\n\n* 泛欧洲产品\
    \ (pan-European products)\n* 惩罚似然 (penalized likelihood)\n* PLS\n* 定价 (pricing)\n\
