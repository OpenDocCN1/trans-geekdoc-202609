- raw: 'These new offerings certainly attract some interest, but to date, they have
    not resulted in massive cancellations of classical contracts, while the pricing
    advantage is not small for “good” drivers: AXA Global Direct promises a reduction
    of up to 50%. This advantage probably creates a bias in the recruitment of good
    drivers because, according to the company, the average rate of reduction would
    be 21% in 2017. The portfolio and its actuarial balance is monitored on a daily
    basis and the individualization of contributions is approached with caution.


    The fairly moderate level of success to date regarding these offerings may also
    be explained by the reluctance of consumers to submit their data to their insurer.
    Insurers take care, however, to make parsimonious use of the data and only access
    those that are useful to them. At Allianz, for example, geolocation is only accessible
    in the event of an accident.


    This fear of misuse by the insurer strongly emerged when Generali announced the
    launch of its Vitality offer in France. This is a complementary health offer,
    which gives gifts in the form of advantages to the insurer’s partners (Decathlon,
    Fnac, Club Med, etc.) to persons who commit to a lifestyle program, monitored
    by balance or connected bracelet, corresponding to their personal situation, which
    is established from an online questionnaire. The offer is included in a collective
    contract, underwritten by a company, in which employees are protected by regulations:
    the price must be the same for all the underwriter’s employees and any exclusion
    is prohibited.


    Within the insurance contract, adherence to the Vitality program is not compulsory.
    For employees who have joined the program, the data are collected and processed
    by an external body. The employer and insurer only have access to a score calculated
    by the body; the employee is guaranteed that this score will be used for nothing
    other than this Vitality program.


    However, all these guarantees do not seem to fully reassure clients. It seems
    indeed that in France, clients, already a little reluctant to communicate their
    data to car insurers, are even more reluctant when it comes to health insurers.


    However, according to a study conducted by Accenture, this situation could change:
    at the global level, 67% of people surveyed are willing to pass on personal data
    to their banks or wealth management companies in order to benefit from better
    services. This rate drops to 57% for insurance contracts. The same observation
    is recorded outside of France. For banking services, 59% of French people may
    submit personal data. For an insurance contract, they are, however, fewer in number
    (49%). However, for valuable advice on financial investments, they are 64%.


    The tendency for the provision of data in return for advantages is expected to
    increase in the future as the younger generation differs from that of its elders
    by a very different attitude. Not only are young people addicted to digital offers,
    but for them, traditional insurers are not their privileged interlocutors. Their
    priority is speed and ease of access; they do not project into the future, do
    not really trust promises and are not sure of the protection that institutions
    can offer them. “Our future competitors are Amazon, Apple or Facebook,” Thomas
    Buberl, Chief Executive Officer of AXA Group, told Echos in 2017.


    ### 4.6.5. *Insurtech and collaborative economy press for innovation*


    From the first breakthroughs of collaborative economy in the area of mobility,
    insurers positioned themselves to accompany the start-ups that support them: car-pooling
    (BlaBlaCar, TravelCar) and private rental types such as OuiCar have entered into
    partnerships with insurers.


    However, real insurance offer innovations appeared recently in the context of
    collaborative economy, under the pressure of young Assurtechs. InsPeer, Otherwise
    and WeCover worked to establish suitable offers to communities. The techniques
    and offers are different but the general idea of these offers is almost the same:
    bringing to the insurer groups of clients who wish to pool their risks. These
    groups cover a first level of claims and subscribe to contracts beyond a high
    deductible amount. The common interest of group members is to adopt reasonable
    behavior, which tends to reduce claims. The coverage guaranteed by insurers is
    lower than those with individual subscriptions, but on the one hand, they are
    spared small-scale claims, which reduce their management costs, and on the other
    hand, the community is supposed to put a virtuous pressure on its members that
    would normally reduce claims.


    These start-ups usually operate as a brokerage firm: Otherwise’s solutions are
    underpinned by several insurers, including Thélem; the insurance company Suravenir
    Assurances will carry contracts designed by WeCover in its balance sheet.


    Co-construction is a new area of development that falls within the context of
    collaborative societal evolution and is based on collective intelligence. Reaching
    out to the client community to co-create, gather opinions and design future products
    and services is an ongoing trend. Many insurers, such as AXA, Covea and BNP Paribas
    Cardif, also work in partnership with prestigious universities, sometimes within
    the framework of Research Chairs.


    ## 4.7. Strategy avenues for the future


    Big data left insurers with the fear of a head-on entry into the market of a major
    competitor like Google, which, knowing all the clients, could greatly attract
    the “good” clients with attractive prices and marginalize existing insurers in
    difficult and unprofitable sub-markets.


    Google has made several attempts to enter the market in France and Britain, notably
    as a broker, but, for the moment, has given up on pursuing this path.


    If it occurs, the disruption will likely take another form.


    Big data, algorithms and progress in artificial intelligence are changing the
    world dramatically. The third industrial revolution, which is underway, makes
    any projection in the future very difficult: the strategic risk is increasing.


    ### 4.7.1. *Paradoxes and anticipation difficulties*


    The current situation is paradoxical in many respects. Mass data and predictive
    algorithms provide prediction flows. However, it has never been so risky to predict
    what place insurance would have in the future, in a new world which today is greatly
    evolving, with new economic models for industries and services and new consumption
    habits.


    Clients want to be treated for what they are, which requires knowing them individually,
    but they are reluctant to have their insurer use their data and even access such
    data.


    On the one hand, they need security, which the legislator is striving to satisfy
    by increasingly reinforcing insurers’ constraints; on the other hand,  they overtly
    surrender their most intimate data to the platforms and engage without guarantee
    in more or less improvised communities.


    Big data dumps masses of data, but the regulator tends to restrict the ability
    of insurers to use them, as is the case with the right to oblivion, which marks
    a setback in insurers’ freedom to price according to costs.


    The world of big data and artificial intelligence allows the emergence of solutions
    that can robotize many complex tasks and alleviate management costs. However,
    the more connected objects develop, the more the cyber risk increases, bringing
    with it a threat of disasters of considerable magnitude.'
