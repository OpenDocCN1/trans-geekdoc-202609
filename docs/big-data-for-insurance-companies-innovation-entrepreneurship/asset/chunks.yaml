    `4.7.3. Unavoidable developments`


    在当前背景下，让所有员工参与应对网络风险的斗争，是保险公司信息资产安全及其形象的一个重要步骤。这并不是 `DPO` 或 `CDO` 等孤立专家的课题，而是每个企业`公民`的主题。这不仅有助于减少保险公司对黑客的脆弱性并降低网络风险，也是让每个人意识到数据资产对公司重要性的方式，而每个人都是这些数据的守护者。理解每个人都必须成为其价值实现的行动者是关键一步。


