    \ excessively long driving periods;\n\n*   – calling of emergency services in\
    \ the event of an accident or real-time assistance in case of a breakdown;\n\n\
    *   – informing policyholders of the risks associated with their itinerary.\n\n\
    If initially insured persons were reluctant to share their data with their insurer,\
    \ it seems that the acceptance to share such data would be facilitated by the\
    \ development of such services and preventive actions. Furthermore, the latter\
    \ will constitute a lever of growth and retention ability for the insurers proposing\
    \ them and will contribute to an improvement of their image. Indeed, where automobile\
    \ insurers mainly intervened in the past in the event of a claim, or under tragic\
    \ circumstances, they were able to intervene upstream of their realization by\
    \ allowing their policyholders to protect themselves without witnessing inconvenience.\n\
    \nBeyond this desire to improve their image among their policyholders, insurers\
    \ may also contribute to the improvement of road safety policies by indicating,\
    \ for example, the most accidental locations.\n\n### 5.2.3. *Index-based insurance\
    \ of weather-sensitive events*\n\nIndex-based insurance allows the protection\
    \ of income related to weather-sensitive activities. This type of insurance is\
    \ logically destined to develop because of the following:\n\n*   – evolution of\
    \ the hazard linked to climate change;\n\n*   – evolution of stakes: increase\
    \ in insured amounts.\n\nThis type of insurance has a notable feature insofar\
    \ as compensation is triggered when a generally meteorological index exceeds a\
    \ previously established threshold. Insurance thus covers a return more than it\
    \ covers actual damages suffered.\n\nIt may not be enforced against index-based\
    \ insurance as the policy is not really in the nature of an insurance in the sense\
    \ that it does not necessarily compensate for a loss. In reality, index-based\
    \ insurance checks the insurability criteria for a risk (defined in [section 5.1.2.1](#chapter05.xhtml#sec5-1-2-1)),\
    \ the insured risk being in this case the attaining of the criterion defined as\
    \ trigger of the insurance benefit, such as living benefit guarantees in life\
    \ insurance."
