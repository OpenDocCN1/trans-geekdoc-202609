  trans: '


    如前所述，大数据现象的本质在于“经典”工具的局限性，以及对它们进行升级的需求，以便能够收集、存储和分析规模不断增长的新型大规模数据。对于数据收集和存储，虽然所有数据合并后通常是海量的，但每个数据源产生的数据量通常是“合理的”，仍然可以通过“经典”存储和分析工具进行管理。数据库的智能分布通常足以在不同的物理服务器上进行收集和存储，如果需要将它们置于网络上，使用分布式、健壮且具有容错能力的存储系统就已经是“足够”的。当每个数据源产生量与分析工具不兼容时，就需要大数据架构。因此，我们转向并行化，它以两种方式表现出来：


    - 数据并行：将单个数据集划分为多个子集并分布在不同的机器上；

    - 任务并行：在不同的处理器上并发执行算法和不同的子程序。


    目前，最为人知的大数据架构可能是 `Hadoop`。与将 `Hadoop` 的创建归功于 Yahoo 的说法相反，该项目实际上始于 `Google`。Doug
    Cutting 当时在那里负责网络内容索引，需要一个框架允许大量操作在大量服务器集群上并行运行。处理分布在多个服务器上的数据的 `MapReduce` 原则（这是
    `Hadoop` 的编程模型）由 `Google Labs` 于 2004 年发布。Doug Cutting 于 2008 年加入 Yahoo，并启动了第一个主要的
    `Hadoop` 项目——`Yahoo! Search Webmap`，它运行在一个包含 10,000 个 `Linux` 核心的集群上。今天，`Hadoop`
    是由 `Apache` 基金管理的开源项目 [HAD 16]，其生态系统随着众多优化或添加不同组件的项目而日益发展。2016 年，Twitter 和 Facebook
    等主要的 Web 厂商在 `Hadoop` 上存储和检索了它们数十 PB 级的数据。


    `Hadoop` 框架可以分为三个主要模块：


    - `Hadoop 分布式文件系统 (HDFS)`：文件系统分布在集群的不同节点上。这些数据节点是使用主从模型连接网络的机器。机器本身可以是相当简易（因此不便宜）的服务器，是它们的数量保证了集群的大数据容量。每个文件都被拆分成块。这些块分布在几台机器上，允许存储海量文件，包括超过每台服务器存储容量的文件量。一个特定的节点
    `name node` 跟踪不同块的位置并允许访问数据。每个块在三个不同的数据节点上至少复制三次，以确保冗余。这种水平分布（分片）原理具有易于重新扩展的优势，因为可以添加更多数据节点来增加数据存储容量。总体而言，`HDFS`
    是一个高效、容错且可扩展的文件系统，这无疑为其成功做出了巨大贡献；


    - `MapReduce` 数据处理引擎：一个 `MapReduce 任务`（一个处理任务）分两个阶段完成：将原始数据转换为键/值格式的映射步骤（mapping），以及合并每个键的所有值的归约步骤（reducing）。数据处理通常会产生一系列多个
    `MapReduce` 业任务；


    - `YARN (又一个资源调度器)` 资源管理器：该模块在 `Hadoop` 第二版本中引入，允许基础设施管理与 `MapReduce` 数据处理模型完全分离。因此，当
    `MapReduce` 描述数据操作过程时，`YARN` 调用 `name nodes` 并处理在不同的数据节点上启动这些进程。在最简单的层面，`YARN`
    协调不同进程的并行管理，以优化处理工作在不同机器上的分布。


    一系列补充这些核心模块的项目增强了提供的用户服务，其中一些如图 1.4 所示。这些服务的示例包括数据库管理 (`Hbase`) 和搜索 (`Hive`)、实时数据流处理
    (`Storm`)、高层数据操作脚本 (`Pig`)、促进数据处理的 Web 界面 (`Hue`) 以及当然的，数据分析和搜索库 (`Mahout`)。


    ![图 1.4 Hadoop 及其生态系统（非完整)](img/fig1-4.jpg)


    **[图 1.4]。** Hadoop 及其生态系统（非完整）


    `Spark` 框架自 2014 年以来声誉日益增长。该项目最初由加州大学伯克利分校的 `AMPL` 于 2009 年开发，并于 2010 年成为 `Apache`
    开源项目。`Spark` 构建在 `Hadoop` 和 `MapReduce` 之上，通过尽可能利用随机访问（通过弹性分布式数据集 `RDD`）来改进 `MapReduce`，而不需要像
    `MapReduce` 那样读写硬盘。这个聪明的技巧显著加快了大多数数据处理过程，例如排序、词频统计、无监督 k-means 分类或计算图中的 PageRank
    中心性。此外，`Spark` 自带一个完整的环境，允许处理实时流问题以及批任务。应用程序可以用 `Java`、`Scala` 或 `Python` 编写，并且
    `MLib` 库（Spark 机器学习库）来自 `MapReduce` 的数据搜索库 `Mahout`。RDD 现在已扩展为 `DataFrames`，即允许数据像关系型数据库中的表一样按列分组的数据显示。


    专门从事决策解决方案的平台也在快速发展。它们正在提供越来越多与开源工具接口的解决方案。例如，`SAS` 提供了 `SAS® Data Loader` 来与
    `Hadoop` 接口，并自 2015 年以来明确定位于该领域的主题中，如网络安全或物联网。另一个例子是，`IBM` 通过其 `Data Science Experience`
    服务扩展了 `IBM Cloud Bluemix` 平台。具体来说，这项服务允许数据科学家和开发者访问 250 个数据集，所有这些都由 `Spark` 驱动并配备了不同的开源软件，如
    `H2O`（一种机器学习解决方案）。这种数据分析软件不仅与 `Spark` 等大数据平台兼容，还声称允许在 `Python`、`Java` 或 `R` 中开发的机器学习模型轻松部署在这些平台上。`H2O`
    由一家加州初创公司 `H2O.ai` 提供。


    根据 `KDnuggets`（一个专注于业务分析、大数据、数据科学和数据挖掘领域动态的网站），并没有多少专业人士仅使用专有工具或仅使用开源解决方案。大多数人同时使用这两大类工具。开源社区的活力使得其技术非常受欢迎。根据
    O’Reilly 开展的一项 2013 年调查，查看数据科学家薪资时，使用开源工具的数据科学家中位数工资为 130,000 美元，而仅使用专有工具的人员为
    90,000 美元。


    '
