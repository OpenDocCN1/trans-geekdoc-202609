- raw: 'There is a great need for companies to cover these new risks. Not only are
    their data essential to the exercise of their business, but any loss of data presents
    corporate image risks and loss of confidence. In this respect, as regards personal
    data, the new European regulation (entry into force and mandatory application
    in May 2018) tightens the requirements: it provides for very severe financial
    sanctions in case of data theft if all security measures have not been taken.


    Cyber security insurance is essential to the new economic world. It constitutes
    a new market requiring strong growth, for which much is to be constructed. This
    field of development falls within the context of data privacy, which makes risk
    assessment very difficult. Data scarcity requires new suitable modeling, which
    needs research in actuarial mathematics.


    The generalization of algorithms and robotization perspective of many intellectual
    tasks open a new field of insurance needs. How to secure them depends on the legal
    framework that will be set for robots. The European Parliament is currently working
    on this subject, and for the time being, the creation of a specific status for
    robots is being rejected, which makes it possible to remain within the current
    insurance framework.


    It is likely that accidents that will occur with autonomous cars will require
    adjustments in the current contracts. There is also the probability that pedestrians’
    behavior as well as that of other users of the public space will be modified by
    taking the robots’ rationality into account. Will pedestrians, now in a state
    of inferiority compared to cars, change their behavior? Is it sure that autonomous
    cars will be programmed to let them pass, will they be very daring and cross the
    streets anyhow?


    Risk assessment will therefore be different, but the need for coverage will not
    be eliminated. Autonomous cars will not escape certain classical disasters and
    will also generate new risks, including cyber threats.


    ### 4.3.5. *New methods to better serve and manage clients*


    Big data and the exploitation of heterogeneous data (emails, telephone exchanges,
    email complaints, amicable declarations, site visits, satellite images, etc.)
    are valuable sources for improving management, reducing time and cost as well
    as for data quality.


    A faster sorting of claims files, providing better service for clients including
    a more accurate evaluation of provisions, detection of attrition, anticipation,
    fraud deterrence and detection, improvement and harmonization of databases, are
    all enormous works to be properly carried out in order to serve and retain clients
    by way of safe, efficient and economical management.


    To make the reality of this big data world more perceptible, data visualization
    techniques help to visualize results in a synthetic, but also dynamic and multifaceted
    way, by making them move according to certain parameters: time, place, etc.


    These techniques are of great help insofar as they do not give rise to a skillful
    presentation that comes close to the point of manipulation.


    ## 4.4. Risks weakening of the business: competition from new actors, “uberization”,
    contraction of market volume


    Although big data revolution places insurers at risk, it also generates many fantasies.


    ### 4.4.1. *The risk of demutualization*


    The first risk mainly depends on the insurers themselves: these are the risks
    of demutualization and exclusion of certain policyholders. If some major insurers
    engage in extreme hyper-segmentation, with price reductions as the key to ensuring
    “good risks”, they are likely to initially achieve commercial success. It will
    be difficult for other insurers to resist this trend, especially as the possibly
    poor financial results will not be immediately apparent. It should be borne in
    mind that the detection of “good risks” is not as easy as it seems and that technical
    balances are a real business, well-controlled by existing insurers with traditional
    techniques.


    However, once the dynamism is triggered, the market would be permanently destabilized
    and remedying the situation would become problematic. Will the ACPR protect the
    market from such a drift? This is for the safety of all. The exclusion of policyholders
    who are considered to be “bad risks”, who would be offered only prohibitive high
    prices in the absence of solidarity, would put the community at risk.


    The same is true for the overall solvency of the market and durability of the
    insurance business. It is the sustainability of these major financial market investors,
    needed to finance debt and the economy, that is at stake.


    Without going as far as this extreme hypothesis, we must remember that hyper-segmentation
    mechanically increases the uncertainty on insurance companies’ results, hence
    the capital requirements to ensure solvency, and in turn increasing the cost for
    insurers and therefore prices.


    ### 4.4.2. *The risk of “uberization”*


    The economic model of digital platforms has demonstrated its effectiveness and
    destructive impact on existing actors.


    GAFA (Google, Apple, Facebook and Amazon), and especially NATU (Netflix, Airbnb,
    Tesla and Uber), are experiencing tremendous growth at the expense of existing
    companies: hotel groups, central taxi services, etc.; in 2016, Airbnb’s sales
    increased by 80%, and Uber by 267%. Traditional models are hampered by these digital,
    agile newcomers, with little or no employees, with no hardware assets other than
    computers, which give access to higher-quality and cheaper services, by interposing
    between businesses and their clients without taking the risks of these businesses
    but by taking a large part of the financial margin.


    After bookshops, restaurants, hotels, taxis, etc., will insurers fall victim to
    digital platforms and let them cut them off from their traditional clients and
    distributors? Will they be intermediated, become technical and management subcontractors,
    carry all the risks in their balance sheets, but lose their clients, strategic
    latitude and part of their profitability?


    In some way, the multiplicity of insurance distribution channels (employees, agents,
    brokers, IAM), which complicates the digitization of insurers but roots client
    relationship in physical networks, has the advantage of making it more difficult
    for a possible predator “platform” to take power.


    ### 4.4.3. *The risk of an omniscient “Google” in the dominant position due to
    data*


    The most feared potential competitor would be Google or another major digital
    actor having a large amount of fine data on clients and their privacy.


    Indeed, the specificity of the reverse cycle of insurance requires that, in order
    to be effective, a new insurer should offer more attractive prices and be able
    to direct its offerings to the appropriate client segments. This requires that
    it has the information (and skills) to identify “good risks”. In this respect,
    GAFA and NATU are ideally placed: they know more about insurers’ clients than
    the insurers themselves.


    It is true that, thanks to all the information we give them about us without being
    aware of it, they know everything about us. But is that enough to assess the risk?
    Is it really that easy to detect “good risks?” And what is a good risk? Is the
    insurer’s profession so simple? Is behavior enough to prevent the future? Is life
    “just?”


    After several small trials in France and Great Britain in particular, as a broker,
    Google has not (yet?) launched an attack.


    ### 4.4.4. *The risk of competition with new companies created for a digital world*


    One of the difficulties of traditional insurance companies lies in digital transformation.
    The issue is to make the complexity of managing the multitude of existing contracts,
    which are very diverse and not designed for the digital world, compatible with
    the new requirements of client experience.'
