- raw: "At 7 am on a Monday like any other, a young employee of a large French company\
    \ wakes up to start her week at work. As for many of us, technology has appeared\
    \ everywhere in her daily life. As soon as she wakes up, her connected watch,\
    \ which also works as a sports coach when she goes jogging or cycling, gives her\
    \ a synopsis of her sleep quality and a score and assessment of the last few months.\
    \ Data on her heartbeat measured by her watch are transmitted by WiFi to an app\
    \ installed on her latest generation mobile, before her sleep cycles are analyzed\
    \ to produce easy-to-handle quality indicators, like an overall score, and thus\
    \ encourage fun and regular monitoring of her sleep. It is her best night’s sleep\
    \ for a while and she hurries to share her results by text with her best friend,\
    \ and then on social media via Facebook and Twitter. In this world of connected\
    \ health, congratulatory messages ﬂood in hailing her “performance”! During her\
    \ shower, online music streaming services such as Spotify or Deezer suggest a\
    \ “wake-up” playlist, put together from the preferences and comments of thousands\
    \ of users. She can give feedback on any of the songs for the software to adapt\
    \ the upcoming songs in real time, with the help of a powerful recommendation\
    \ system based on historical data. She enjoys her breakfast and is getting ready\
    \ to go to work when the public transport Twitter account she subscribes to warns\
    \ her of an incident causing serious disruption on the transport network. Hence,\
    \ she decides to tackle the morning traffic by car, hoping to avoid arriving at\
    \ work too late. To help her plan her route, she connects to a traffic information\
    \ and community navigation app that obtains traffic information from GPS records\
    \ generated by other drivers’ devices throughout their journeys to update a real-time\
    \ traffic information map. Users can ﬂag up specific incidents on the transport\
    \ network themselves, and our heroine marks slow traffic caused by an accident.\
    \ She decides to take the alternative route suggested by the app. Having arrived\
    \ at work, she vents her frustration at a difficult day’s commute on social media.\
    \ During her day at work, on top of her professional activity, she will be connected\
    \ online to check her bank account balance and go shopping on a supermarket’s\
    \ “drive” app that lets her do her shop online and pick it up later in her car.\
    \ Her consumer profile on the online shopping app gives her a historical overview\
    \ of the last few months, as well as suggesting products that are likely to interest\
    \ her. On her way home, the trunk full with food, some street art painted on a\
    \ wall immediately attracts her attention. She stops to take a photo, edits it\
    \ with a color filter and shares it on a social network similar to Instagram.\
    \ The photo immediately receives about 10 “likes”. That evening, a friend comments\
    \ on the photo. Having recognized the artist, he gives her a link to an online\
    \ video site like YouTube. The link is for a video of the street art being painted,\
    \ put online by the artist to increase their visibility. She quickly watches it.\
    \ Tired, she eats, plugs in her sleep app and goes to bed.\n\nBetween waking up\
    \ and going to sleep, our heroine has generated a significant amount of data,\
    \ a volume that it would have been difficult to imagine a few years earlier. With\
    \ or without her knowledge, there have been hundreds of megabytes of data ﬂow\
    \ and digital records of her tastes, moods, desires, searches, location, etc.\
    \ This *homo sapiens*, now *homo numericus*, is not alone – billions of us do\
    \ the same. The figures are revealing and their growth astonishing: we have entered\
    \ the era of big data. In 2016, one million links were shared, two million friend\
    \ requests were made and three million messages were sent every 20 minutes on\
    \ Facebook \\[STA 16a\\]. The figures are breathtaking:\n\n*   – 1,540,000,000\
    \ users active at least once a month;\n\n*   – 974,000,000 smartphone users;\n\
    \n*   – 12% growth in users between 2014 and 2015;\n\n*   – 81 million Facebook\
    \ profiles;\n\n*   – 20 million applications installed on Facebook every day.\n\
    \nSince the start of computing, engineers and researchers have certainly been\
    \ confronted with strong growth in data volumes, stored in larger and larger databases\
    \ that have come to be known as data warehouses, and with ever improving architectures\
    \ to guarantee high quality service. However, since the 2000s, mobile Internet\
    \ and the Internet of Things, among other things, have brought about an explosion\
    \ in data. This has been more or less well managed, requiring classical schemes\
    \ to be reconsidered, both in terms of architecture and data processing. Internet\
    \ traffic, computer backups on the cloud, shares on social networks, open data,\
    \ purchase transactions, sensors and records from connected objects make up an\
    \ assembly of markers in space and/or time of human activity, in all its dimensions.\
    \ We produce enormous quantities of data and can produce it continuously wherever\
    \ we are (the Internet is accessible from the office, home, airports, trains,\
    \ cars, restaurants, etc.). In just a few clicks, you can, for example, describe\
    \ and review a meal and send a photo of your dish. This great wealth of data certainly\
    \ poses some questions, about ethics and security among other things, and also\
    \ presents a great opportunity for society \\[BOY 12\\]. Uses of data that were\
    \ previously hidden or reserved for an elite are becoming accessible to more and\
    \ more people.\n\nThe same is true for the open data phenomenon establishing itself\
    \ at all administrative scales. For big companies, and insurance companies in\
    \ particular, there are multiple opportunities \\[CHE 12\\]. For example, data\
    \ revealing driving styles are of interest to non-life insurance, and data concerning\
    \ health and lifestyle are useful for life insurance. In both cases, knowing more\
    \ about the person being insured allows better estimation of future risks. Storing\
    \ this data requires a ﬂexible and tailored architecture \\[ZIK 11\\] to allow\
    \ parallel and dynamic processing of “voluminous”, “varied” data at “velocity”\
    \ while evaluating its “veracity” in order to derive the great “value” of these\
    \ new data ﬂows \\[WU 14\\]. Big data, or megadata, is often presented in terms\
    \ of these five Vs.\n\nAfter initial reﬂection on the origin of the term and with\
    \ a view to giving a reliable definition ([section 1.2](#chapter01.xhtml#sec1-2)),\
    \ we will return to the framework of these five Vs, which has the advantage of\
    \ giving a pragmatic overview of the characteristics of big data ([section 1.3](#chapter01.xhtml#sec1-3)).\
    \ [Section 1.4](#chapter01.xhtml#sec1-4) will describe current architecture models\
    \ capable of real-time processing of high-volume and varied data, using parallel\
    \ and distributed processing. Finally, we will finish with a succinct presentation\
    \ of some examples from the world of insurance.\n\n## 1.2. How is big data defined?\n\
    \n> “Big data is like teenage sex: everyone talks about it, nobody really knows\
    \ how to do it, everyone thinks everyone else is doing it, so everyone claims\
    \ they are doing it.”\n\n> \n\n> Dan Ariely\n\nIt is difficult to define a term\
    \ as generic, widely used and even clichéd as big data. According to Wikipedia^([1](#chapter01.xhtml#fn1)):\n\
    \n> “Big data is a term for datasets that are so large or complex that traditional\
    \ data processing application software is inadequate to deal with them.”"
  fmt: "\nAt 7 am on a Monday like any other, a young employee of a large French company\
    \ wakes up to start her week at work. As for many of us, technology has appeared\
    \ everywhere in her daily life. As soon as she wakes up, her connected watch,\
    \ which also works as a sports coach when she goes jogging or cycling, gives her\
    \ a synopsis of her sleep quality and a score and assessment of the last few months.\
    \ Data on her heartbeat measured by her watch are transmitted by `WiFi` to an\
    \ app installed on her latest generation mobile, before her sleep cycles are analyzed\
    \ to produce easy-to-handle quality indicators, like an overall score, and thus\
    \ encourage fun and regular monitoring of her sleep. It is her best night’s sleep\
    \ for a while and she hurries to share her results by text with her best friend,\
    \ and then on social media via `Facebook` and `Twitter`. In this world of connected\
    \ health, congratulatory messages flood in hailing her “performance!”. During\
    \ her shower, online music streaming services such as `Spotify` or `Deezer` suggest\
    \ a “wake-up” playlist, put together from the preferences and comments of thousands\
    \ of users. She can give feedback on any of the songs for the software to adapt\
    \ the upcoming songs in real time, with the help of a powerful recommendation\
    \ system based on historical data. She enjoys her breakfast and is getting ready\
    \ to go to work when the public transport `Twitter` account she subscribes to\
    \ warns her of an incident causing serious disruption on the transport network.\
    \ Hence, she decides to tackle the morning traffic by car, hoping to avoid arriving\
    \ at work too late. To help her plan her route, she connects to a traffic information\
    \ and community navigation app that obtains traffic information from `GPS` records\
    \ generated by other drivers’ devices throughout their journeys to update a real-time\
    \ traffic information map. Users can flag up specific incidents on the transport\
    \ network themselves, and our heroine marks slow traffic caused by an accident.\
    \ She decides to take the alternative route suggested by the app. Having arrived\
    \ at work, she vents her frustration at a difficult day’s commute on social media.\
    \ During her day at work, on top of her professional activity, she will be connected\
    \ online to check her bank account balance and go shopping on a supermarket’s\
    \ “drive” app that lets her do her shop online and pick it up later in her car.\
    \ Her consumer profile on the online shopping app gives her a historical overview\
    \ of the last few months, as well as suggesting products that are likely to interest\
    \ her. On her way home, the trunk full with food, some street art painted on a\
    \ wall immediately attracts her attention. She stops to take a photo, edits it\
    \ with a color filter and shares it on a social network similar to `Instagram`.\
    \ The photo immediately receives about 10 “likes”. That evening, a friend comments\
    \ on the photo. Having recognized the artist, he gives her a link to an online\
    \ video site like `YouTube`. The link is for a video of the street art being painted,\
    \ put online by the artist to increase their visibility. She quickly watches it.\
    \ Tired, she eats, plugs in her sleep app and goes to bed.\n\nBetween waking up\
    \ and going to sleep, our heroine has generated a significant amount of data,\
    \ a volume that it would have been difficult to imagine a few years earlier. With\
    \ or without her knowledge, there have been hundreds of megabytes of data flow\
    \ and digital records of her tastes, moods, desires, searches, location, etc.\
    \ This *homo sapiens*, now *homo numericus*, is not alone – billions of us do\
    \ the same. The figures are revealing and their growth astonishing: we have entered\
    \ the era of big data. In 2016, one million links were shared, two million friend\
    \ requests were made and three million messages were sent every 20 minutes on\
    \ Facebook [STA 16a]. The figures are breathtaking:\n\n* 1,540,000,000 users active\
    \ at least once a month;\n* 974,000,000 smartphone users;\n* 12% growth in users\
    \ between 2014 and 2015;\n* 81 million Facebook profiles;\n* 20 million applications\
    \ installed on Facebook every day.\n\nSince the start of computing, engineers\
    \ and researchers have certainly been confronted with strong growth in data volumes,\
    \ stored in larger and larger databases that have come to be known as data warehouses,\
    \ and with ever improving architectures to guarantee high quality service. However,\
    \ since the 2000s, mobile Internet and the Internet of Things, among other things,\
    \ have brought about an explosion in data. This has been more or less well managed,\
    \ requiring classical schemes to be reconsidered, both in terms of architecture\
    \ and data processing. Internet traffic, computer backups on the cloud, shares\
    \ on social networks, open data, purchase transactions, sensors and records from\
    \ connected objects make up an assembly of markers in space and/or time of human\
    \ activity, in all its dimensions. We produce enormous quantities of data and\
    \ can produce it continuously wherever we are (the Internet is accessible from\
    \ the office, home, airports, trains, cars, restaurants, etc.). In just a few\
    \ clicks, you can, for example, describe and review a meal and send a photo of\
    \ your dish. This great wealth of data certainly poses some questions, about ethics\
    \ and security among other things, and also presents a great opportunity for society\
    \ [BOY 12]. Uses of data that were previously hidden or reserved for an elite\
    \ are becoming accessible to more and more people.\n\nThe same is true for the\
    \ open data phenomenon establishing itself at all administrative scales. For big\
    \ companies, and insurance companies in particular, there are multiple opportunities\
    \ [CHE 12]. For example, data revealing driving styles are of interest to non-life\
    \ insurance, and data concerning health and lifestyle are useful for life insurance.\
    \ In both cases, knowing more about the person being insured allows better estimation\
    \ of future risks. Storing this data requires a flexible and tailored architecture\
    \ [ZIK 11] to allow parallel and dynamic processing of “voluminous”, “varied”\
    \ data at “velocity” while evaluating its “veracity” in order to derive the great\
    \ “value” of these new data flows [WU 14]. Big data, or megadata, is often presented\
    \ in terms of these five Vs.\n\nAfter initial reflection on the origin of the\
    \ term and with a view to giving a reliable definition ([section 1.2](#chapter01.xhtml#sec1-2)),\
    \ we will return to the framework of these five Vs, which has the advantage of\
    \ giving a pragmatic overview of the characteristics of big data ([section 1.3](#chapter01.xhtml#sec1-3)).\
    \ [Section 1.4](#chapter01.xhtml#sec1-4) will describe current architecture models\
    \ capable of real-time processing of high-volume and varied data, using parallel\
    \ and distributed processing. Finally, we will finish with a succinct presentation\
    \ of some examples from the world of insurance.\n\n## 1.2. How is big data defined?\n\
    \n> “Big data is like teenage sex: everyone talks about it, nobody really knows\
    \ how to do it, everyone thinks everyone else is doing it, so everyone claims\
    \ they are doing it.”\n\n> \n\n> Dan Ariely\n\nIt is difficult to define a term\
    \ as generic, widely used and even clichéd as big data. According to Wikipedia^([1](#chapter01.xhtml#fn1)):\n\
    \n> “Big data is a term for datasets that are so large or complex that traditional\
    \ data processing application software is inadequate to deal with them.”\n"
  trans: "\n在像往常一样的周一早上 7 点，某法国大公司的一位女员工醒来开始她一周的工作。对于我们许多人来说，技术已经出现在她生活的每一个角落。她一醒来，她的智能手表（在她跑步或骑行时还会兼当运动教练）就向她提供了睡眠质量摘要，以及对过去几个月的评分和评估。她手表测量的心率数据通过\
    \ `WiFi` 传输到安装在她最新款手机上的应用程序中，随后对其睡眠周期进行分析，以生成易于处理的质量指标（如总分），从而鼓励人们对睡眠进行趣味且规律的监测。这是她一段时间以来睡得最好的一晚，她急于通过短信将结果分享给好友，然后通过\
    \ `Facebook` 和 `Twitter` 发布在社交媒体上。在这个连接健康的世界里，祝贺信息纷至沓来，赞美她的“表现！”在她洗澡时，`Spotify`\
    \ 或 `Deezer` 等在线音乐流媒体服务推荐了一个根据数千用户偏好和评论汇的“唤醒”播放列表。她可以对任何一首歌提供反馈，在基于历史数据的强大推荐系统的帮助下，实时调整随后的歌曲。她享受着早餐，正准备上班，此时她订阅的公共交通\
    \ `Twitter` 账号警告她发生了一个导致交通网络严重中断的事件。因此，她决定开车应对早高峰交通，希望避免上班得太晚。为了帮助她规划路线，她连接了一个交通信息和社区导航应用，该应用从其他驾驶员设备在整个行程产生的\
    \ `GPS` 记录中获取交通信息，以更新实时交通地图。用户可以自己标记交通网络上的特定事件，我们的女主角标记了因事故导致的拥堵。她决定采取应用程序建议的备用路线。到达公司后，她在社交媒体上发泄了对艰难通勤的沮丧情绪。在工作期间，除了专业活动外，她还会连接在线检查银行账户余额，并在超市的“自提”应用上购物，该应用让她让她在线在线选购，稍后直接开车在车里取货。她在在线购物应用上的消费者画像提供了她过去几个月的历史概览，并推荐了她可能感兴趣的产品。在回家的路上，后备箱装满了食物，墙上画的一些街头艺术立即吸引了她的注意力。她停下来拍照，用色彩滤镜进行编辑，并分享到类似于\
    \ `Instagram` 的社交网络上。这张照片立即收到了约 10 个“赞”。那天晚上，一位朋友给照片留了评论。认出艺术家后，他给了她一个类似于 `YouTube`\
    \ 的在线视频网站的链接。该链接是艺术家为了增加曝光率而发布的一段街头艺术创作过程的视频。她很快看完。疲惫的她吃饭、插上睡眠应用便上睡觉了。\n\n从醒来到睡觉之间，我们的女主角产生了大量数据，这种量在几年前是难以想象的。无论她是否知情，都有数百兆字节的数据流以及关于她的品味、心情、欲望、搜索、位置等的数字记录。这种\
    \ *homo sapiens*（智人），现在的 *homo numericus*（数字人），并不孤单——我们十亿人都在这样做。这些数字令人震惊，其增长速度惊人：我们已经进入了大数据时代。在\
    \ 2016 年，Facebook 上每 20 分钟就有百万个链接被分享、两百万个好友请求和三百万条消息被发送 [STA 16a]。这些数字令人叹为观止：\n\
    \n*   每月至少活跃一次的用户达 1,540,000,000 名；\n*   974,000,000 名智能手机用户；\n*   2014 年至 2015\
    \ 年间用户增长了 12%；\n*   8100 万个 Facebook 档案；\n*   每天有 2000 万应用程序安装在 Facebook 上。\n\n\
    自从计算开始以来，工程师和研究人员确实面临着数据量的巨大增长，数据存储在越来越大的数据库中（这些数据库被称为数据仓库），并依靠不断改进的架构来保证高质量的服务。然而，从\
    \ 21 世纪 20 年代以来，移动互联网和物联网等事物带来了数据的爆炸。这在多多程度上得到了良好的管理，但需要从架构和数据处理两个方面重新考虑经典方案。互联网流量、云端计算机备份、社交网络上的分享、开放数据、购买交易、传感器以及连接对象的记录，构成了人类活动在所有维度上的空间和/或时间上的标记集合。我们产生海量数据，并且随时随地持续产生数据（互联网可以在办公室、家里、机场、火车、汽车、餐厅等地方访问）。只需点击几次，你就可以描述和评价一餐饭，并发送一张菜肴的照片。这种巨大的数据财富无疑带来了一些关于伦理和安全等方面的问题，同时也为社会提供了巨大的机会\
    \ [BOY 12]。此前隐藏或保留给精英阶层的数据用途正变得越来越多的人可以触及。\n\n在所有行政层级建立起来的开放数据现象也是如此。对于大公司，特别是保险公司来说，存在多种机会\
    \ [CHE 12]。例如，揭示驾驶风格的数据对非寿险有利，而有关健康和生活方式的数据对人寿险有用。在这两种情况下，更多地了解被保险人可以更好地估计未来风险。存储这些数据需要一种灵活且定制的架构\
    \ [ZIK 11]，以便在保持“速度”的同时对“海量”的、“多样化”的数据进行并行和动态处理，同时评估其“真实性”，从而得出这些新数据流的巨大“价值” [WU\
    \ 14]。大数据（或称巨数据）通常用这五个 V 来描述。\n\n在对该术语起源进行初步反思后，并给出一个可靠的定义（第 1.2 节），我们将回到这五个 V\
    \ 的框架，该框架的优势是提供了大数据特征的务实概述（第 1.3 节）。第 1.4 节 将描述能够利用并行和分布式处理实时处理海量多样化数据的当前架构模型。最后，我们将对保险领域的一些示例进行简要介绍并结束全文。\n\
    \n## 1.2. 大数据是如何定义的？\n\n> “大数据就像青春期的性：每个人都在谈论它，没人真正知道怎么做，大家都认为别人在做，所以每个人都声称自己在做。”\n\
    \n> \n\n> 丹·阿里莱利（Dan Ariely）\n\n要定义一个像大数据这样通用、被广泛使用甚至陈词滥调的术语是很困难的。根据维基百科^(1)：\n\
    \n> “大数据是一个术语，指规模如此大或如此复杂的数据集，以至于传统的数据处理应用程序软件无法对其处理。”\n\n"
