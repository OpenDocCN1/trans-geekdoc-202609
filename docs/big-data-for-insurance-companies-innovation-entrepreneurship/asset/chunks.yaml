- raw: "The data quality requirements relating to Solvency II potentially constitute\
    \ a strong limitation on the use of big data for the purpose of calculating technical\
    \ provisions, particularly in view of the strict requirements with respect to\
    \ audit trail and complementary requirements dedicated to the use of external\
    \ data also set out in Article 19 of the Delegated Regulation referred to above.\
    \ This limitation is one of the factors inducing the use of big data at this limited\
    \ stage for actuarial purposes.\n\n**Table 5.1.** *Solvency II requirements regarding\
    \ data quality used for the purpose of calculating technical provisions*\n\n|\
    \ Criteria || Expected as regards data used in the calculation of technical provisions\
    \ (TPs) |\n\n| --- | --- |\n\n| Completeness || The data include sufficient historical\
    \ information to assess the characteristics of the underlying risks and identify\
    \ trends in these risks.  \n\nThey are available for each of the relevant homogeneous\
    \ risk groups. |\n\n| Accuracy || The data are free of material errors.  \n\n\
    They are consistent over time if used for the same estimate.  \n\nThey are recorded\
    \ in a regular and coherent manner. |\n\n| Appropriateness || The data are consistent\
    \ with the use made of them.  \n\nTheir volume and nature are such as to ensure\
    \ that the estimates made on their basis for the calculation of technical provisions\
    \ are free of any significant estimation error (that is likely to influence the\
    \ decision-making or judgment of users of the calculation result, including the\
    \ supervisory authorities).  \n\nThey are consistent with the assumptions underlying\
    \ the actuarial and statistical techniques applied to them in the calculation\
    \ of technical provisions.  \n\nThey adequately reflect the risks to which the\
    \ insurance or reinsurance company is exposed with regard to its insurance or\
    \ reinsurance commitments.  \n\nThey are collected, processed and applied in a\
    \ transparent and structured manner on the basis of a documented procedure.  \n\
    \nInsurance or reinsurance companies ensure that their data are used consistently\
    \ over time for the calculation of technical provisions. |\n\nThe establishment\
    \ of uniform standards at the European level (Solvency II constitutes only one\
    \ part of this tendency towards normative standardization, which concerns the\
    \ entire financial system) and insurance coverage needs of certain segments of\
    \ the European population should tend towards a standardization of products and\
    \ the emergence of pan-European products. The behavioral analysis allowed by data\
    \ science makes it possible for us, within this context, to objectify the formation\
    \ of new homogeneous risk groups through a data-driven approach.\n\nA first initiative\
    \ can be put forward regarding the development of pan-European products: at the\
    \ end of September 2016, Axa Art launched the commercialization of Tailormade,\
    \ a home insurance product covering real estate, works of art, legal protection,\
    \ cyber risks and assistance, targeting high-end clients. Upon launching, the\
    \ product was offered in four European countries (France, Germany, Belgium and\
    \ the United Kingdom). Four new countries will be introduced in early 2017 (Spain,\
    \ Italy, Switzerland and the Netherlands).\n\n### 5.1.2. *Link between data and\
    \ insurable assets*\n\n#### 5.1.2.1. *Insurability*\n\nRisk, which is the raw\
    \ material of insurance, is the confrontation of hazards with human, material\
    \ and, by extension, financial stakes.\n\nDEFINITION.– *To be insurable, a risk\
    \ must be random, futural, lawful, independent of the will of the policyholder\
    \ and sufficiently common to be subject to calculation of its probability of occurrence\
    \ without being almost certain*.\n\nThe digitalization of the relationship between\
    \ insurers and policyholders significantly increases the frequency of data collection,\
    \ the matching capacities of data collected with external data increase the diversity\
    \ of the available information and the machine learning methods make it possible\
    \ to identify the most discriminatory variables in order to predict a behavior\
    \ or the occurrence of a given risk. In effect, the vision of risks tends to be\
    \ refined and price variations may occur:\n\n*   – infra-annual variations related\
    \ to changes in the consumption habits of policyholders during the year (for example,\
    \ seasonality of automobile use or occupation of a secondary residence). Externally,\
    \ pricing and, by extension, insurance to the act, based on data from connected\
    \ objects, could be envisaged;\n\n*   – refined segmentation of guarantees within\
    \ a contract and ability of the policyholder to underwrite only a part of the\
    \ guarantees offered (for example, home insurance contracts often include lump-sum\
    \ guarantees that may be unsuitable for young clients).\n\nBeyond the modulation\
    \ of existing products and guarantees, the development of guarantees for risks\
    \ hitherto considered as uninsurable could be envisaged due to the availability\
    \ of new data sources. Finally, the insurance of emerging risks (for example,\
    \ cyber risk) is also facilitated.\n\n#### 5.1.2.2. *Concept of pooling*\n\nPooling\
    \ is a key insurance principle. It involves apportioning the cost of claims arising\
    \ from the occurrence of a hazard between the members of a group potentially subject\
    \ to it and having, in fact, taken out insurance to protect themselves.\n\nInsurance\
    \ organizes with fairness financial solidarity between persons constituting a\
    \ homogeneous risk group with regard to the hazard considered: mutuality. Prices\
    \ adjust according to the evolution of risk, and mutuality is penalized in case\
    \ of fraud from its members.\n\nA better knowledge of risk relating to the different\
    \ insured homogeneous risks groups allows the refinement of the price of proposed\
    \ guarantees by making it correspond exactly to the risk to which the insurer\
    \ is subject because of the commitments undertaken.\n\n#### 5.1.2.3. *The fantasy\
    \ of personalized prices*\n\nThe advent of big data in insurance has given rise\
    \ to a belief in the ability of insurers to have a very precise knowledge of risk\
    \ such that the price of guarantees could be personalized.\n\nAlthough the idea\
    \ of price personalization may seem attractive at first sight, several points,\
    \ however, run counter to it.\n\nFirst, personalization implies full and complete\
    \ knowledge of the risk factors constituting the hazard. However, the acquisition\
    \ of such a level of knowledge is impossible (influence of the environment, instability\
    \ in behavior of policyholders, etc.), and a pooling, possibly finer, but minimal\
    \ within a homogeneous risk group, will always be technically necessary to ensure\
    \ the viability of products and proposed guarantees.\n\nMoreover, since this personalization\
    \ eliminates pooling between policyholders making up a homogeneous risk group,\
    \ only temporal pooling, policyholder by policyholder, of the risk incurred would\
    \ remain, and would have two main consequences:\n\n*   – some policyholders may\
    \ be inclined to privately organize their own temporal pooling of assets without\
    \ resorting to insurance but by prioritizing financial products;\n\n*   – others,\
    \ for whom the price would have become prohibitive, would be inclined not to underwrite\
    \ an insurance which, beyond the potentially dramatic consequences for them in\
    \ the event of claims, poses a real societal problem because of the resulting\
    \ inability of policyholders to pay potential damages inflicted on third parties.\n\
    \nFinally, as demonstrated in an article by Charpentier *et al*. \\[CHA 15\\]\
    \ over-segmentation (and by extension, price personalization), although leading\
    \ to an increase in the per capita profitability of policyholders maintained in\
    \ portfolio, results in a competitive market for the creation of a niche market,\
    \ and the insured population being reduced to a given insurer (policyholders most\
    \ penalized by the price changes opting for an insurer with a less fine segmentation)\
    \ leads to a decrease in its turnover and overall profitability in the entire\
    \ insured portfolio.\n\n#### 5.1.2.4. *Adaptation of insurance to uses thanks\
    \ to the available data*"
