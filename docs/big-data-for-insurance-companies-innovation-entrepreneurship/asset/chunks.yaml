- raw: '*   – agility and rapid data archiving, with the ability to rapidly repeat
    the processing necessary to update the warehouse data;


    *   – complex analysis, such as the parallel application of many millions of scoring
    models on millions of bank accounts to detect fraud, for example.


    The good news is that it is possible to bring the two worlds together and to use
    Hadoop as an efficient and scalable ETL solution for data that requires specific
    workloads. Once the data has been extracted and loaded in Hadoop, it can be subjected
    to complex transformations in batches by programming MapReduce or Spark jobs,
    or using high-level languages like HiveQL or Pig. It is possible to analyze (parse)
    the syntax of unstructured or semi-structured data, and to carry out calculations,
    joins and aggregations in order to integrate  data from diverse sources, or to
    structure them so that they can be inserted into data warehouses following classical
    business workﬂows.


    Hadoop can also be used to build a ﬂexible and scalable data warehouse and to
    interface it with classical BI tools, for reporting for example. However, the
    majority of data warehousing solution publishers such as Oracle or Teradata prefer
    to integrate Hadoop at the ETL level only, which allows their solutions to be
    augmented rather than replaced. Conversely, proponents of open source solutions
    champion workload management in which the distributed Hadoop environment plays
    the role of a data hub through which all the data in the company ecosystem transits,
    before being fed into multiple analytical platforms.


    Analyzing all of these approaches is complex. Some authors have produced grids
    comparing the requirements of different technical choices, such as the properties
    of the data analysis algorithms \[LAN 15\], as well as their potential implications,
    for example, regarding skills and human resources \[CHA 13\].


    ## 1.5. Challenges and opportunities for the world of insurance


    Data lies at the heart of insurance. It is the raw material for scoring models,
    allowing segmentation of premium holders, to know them better and offer them bespoke
    products, to better estimate their current and future risk and to make decisions.
    Big data and the digital transition are hence profoundly changing the insurance
    sector. As for all economic actors, insurers will of course face changes of organization,
    culture and competition. We will illustrate this development with two examples
    in which big data plays a central role: the first illustrates the impact of the
    development of the sharing economy and the second the impact of changing behaviors
    on segmentation.


    Insurance is already part of the sharing economy \[LAC 15\]. New actors, not necessarily
    from the world of insurance, are creating communities of individuals with specific
    insurance needs in order to negotiate highly personalized contracts for them from
    insurers, and reducing costs as they do so. If community platforms are allowing
    individuals to articulate their needs, big data is allowing these new actors to
    be proactive in finding small groups of clients whose frustration accumulates
    online. Indeed, all that is required is to analyze search engine enquiries, blogs
    and social networks to determine specific insurance needs. These new actors are
    thus changing the relationship between the insured and their insurers, but are
    also facilitating innovation since the (very) personalized solutions are either
    adaptations of existing contracts or completely new contracts. Although this type
    of market is still marginal, it seems likely for such a market of niches to be
    able to grow. This is particularly the case for the collaborative practices for
    sharing goods or services (carsharing, vehicle/apartment hire between individuals,
    etc.) which continue to develop. These are changing how risks are assessed and
    again specific, or even bespoke, warranties must be offered \[INC 14\]. Essentially,
    these practices are changing the paradigm from “one good for one owner” to “a
    multitude of users for one good”. This shift from ownership towards usage is bringing
    about new types of risks and represents a challenge for insurers \[LAC 15\].


    Big data also gives easy access to some of the information necessary for pricing
    and will gradually reduce the use of classical paper questionnaires. Hence, it
    allows faster decision-making. Even better, by giving access to previously inaccessible
    information, it will enable reduction in the existing information asymmetry \[EWA
    13\] between the person being insured, who knows virtually all the information
    concerning them, and the insurer who has only partial information. Hence, big
    data allows greater knowledge of the insured and the risks associated with them,
    more precise evaluation of behavior and hence optimized selection of who to insure
    and fairer premium prices. Those being insured can, particularly if it is in their
    interest, give access to very private data about their way of life. The acceptability
    of such an approach, for consumers and regulators, is evidently critical \[THO
    15\]. The slogan “pay as you live, drive etc.” is already here, especially in
    automobile insurance. For example, connected driving allows precise analysis of
    driving style (speed, acceleration, braking, cornering, etc.), according to the
    road and weather conditions. This trend is also developing in health insurance
    with connected objects, allowing the physical condition (heart rate, sleep, etc.)
    and activity (number of steps taken, participation in sports, etc.) of the person
    being insured to be measured. The quality of their everyday environment can be
    evaluated using external and open data. However, “hyper-individualized” premium
    pricing could challenge the current model of segmentation and mutualization of
    risk \[HOU 15\], the underlying principle of how prices are set, and questions
    how risk portfolios will be structured \[CHA 15\]. The intrusion of insurers into
    the heart of individuals’ private lives obviously poses the problem of data protection.
    There are also questions regarding how new practices will develop and how they
    might impact society.


    Through these two examples, we have demonstrated some of the opportunities offered
    by big data (new markets, innovation and reduction in information asymmetry).
    Improving the effectiveness of advertising campaigns and of targeting and reducing
    fraud are further examples. New challenges are appearing (the entrance of intermediaries,
    the fundamentals of insurance under question, data security, actuarial challenges)
    while ethical, security and legal questions are also being raised. Regulators
    may restrict the use of personal data or data that leads to segmentation considered
    to be discriminatory. Markets for fraudulent profiles could develop, and alert
    premium holders will create different profiles for private and public use, thus
    challenging the benefit of the reduction in information asymmetry. Finally, if
    big data represents a profitable investment, it risks destabilizing the whole
    insurance market. On the one hand, companies without the means to access big data
    and the necessary technologies and workforce skills will see their competitivity
    unravel. They therefore risk disappearing or being bought out. On the other hand,
    intermediary platforms, notably GAFA (Google, Apple, Facebook, Amazon), who control
    the whole data value chain (collection, the technology for storage and calculations,
    relevant expertise), could seek to take a significant proportion of the profits,
    or could even be tempted to become insurers themselves. Buying out weakened companies
    could thus allow them to enter the insurance market. A new form of asymmetry,
    of control over data, is probably already in place.


    ## 1.6. Conclusion'
