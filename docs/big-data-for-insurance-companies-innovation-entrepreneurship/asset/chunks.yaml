    Moreover, given the current context conducive to the emergence and increasingly
    rapid adoption of technological innovations, it goes without saying that these
    contributions are still limited at this stage and will be amplified by the cross-matching
    of big data with other emerging innovations, including:


    *   – blockchain and smart contracts;

    *   – artificial intelligence and the emergence of bots and chatbots.


    Other innovations will contribute to the exponential generation of new data sources,
    including:


    *   – the development of connected objects;

    *   – the emergence of platforms for the collection of personal data.


    Finally, if the data generated so far are mainly due to mature markets, the contribution
    of emerging countries is set to explode from 2017.


    ### 5.2.1. `Use for pricing purposes and product offer orientation`


    Through the matching of external data with relative data, products and guarantees,
    policyholders and their claims, it is possible, using machine learning algorithms,
    to identify the most discriminatory variables for pricing purposes in a data-driven
    manner.


    ![Figure 5.1. Classical data science process ¶ (source: DataSquare)](images/fig5-1.jpg)


    **Figure 5.1.** `Classical data science process` ¶ `(source: DataSquare)`


    The studies carried out may have different purposes:


    *   – offering products and guarantees adapted to client targets on which an insurer
    wishes to develop;

    *   – challenging the previously used price variables, the latter most often established
    on the basis of the only available data in the portfolio;

    *   – simplifying the underwriting process: increasingly, the simplicity of underwriting
    insurance contracts is a factor promoting the transformation of online estimates
    into duly underwritten insurance contracts (`Lemonade`, for example, greatly complements
    the data requested within the framework of its underwriting process with matched
    external data);

    *   – establishing a refined price in terms of price zoning (`micro-zoning`, `review
    of existing zones`), where the price applied depends on the location of the insured,
    as can be the case for car or home insurance.


    In terms of pricing, process optimization and orientation of insurers product
    offers, possibilities are numerous and experiments and projects multiply under
    constraints, however, of meeting compliance requirements with regard to the use
    of personal data and data matching. The cross-matching of insurance and banking
    data by bank insurers, for example, although it may be carried out for research
    and experimentation purposes, requires the implementation of a data exchange protocol
    that is legally binding at the group level.


    Orientation of offerings is one of the areas in which the reciprocal expertise
    of actuaries and data scientists will be the most complementary and source of
    both mutual enrichment and value-adding for insurance companies. Insurance fundamentals
    such as pricing and reserving, due to the technical and regulatory requirements
    they raise, will logically remain, for the time being, the sole preserve of actuaries.


    ### 5.2.2. `Automobile insurance and telematics`


    Telematic data collected through sensors connected to the diagnostic socket of
    insured vehicles (a more reliable and more informative means of collecting data
    than collection via mobile phones, within a given timeframe) allow a spatio-temporal
    analysis of the risk borne by policyholders, in view of their driving behavior
    and the environment in which they operate (weather, traffic, road conditions,
    etc.).


    At this stage, the data collected make it possible to establish driving scores
    which allow policyholders to change their behavior while driving and they also
    take the gamification of driving more into consideration than preventive action.
    This information is also used to provide the insured with a discount on their
    car insurance premium in contracts that are progressively evolving. This information
    is also presented in `Table 5.2`.


    `Table 5.2.` `Existing guarantees`


    | `X drive` | `Description of the guarantee` | `Initiators` |

    | :--- | :--- | :--- |

    | `X = As` | Annual modulation of insurance price according to mileage | `Amaguiz
    (2008)`, `Axa and Allianz (2009)` |

    | `X = How` | Monthly modulation of insurance price according to driving behavior
    | `Axa and Allianz (2015)` |


    From the data collected so far, it is difficult to objectively provide reductions
    according to the claims, since France lags behind the development of such products
    compared to other countries. Also, the reductions granted are attributed on the
    basis of expert judgments. Moreover, in addition to the study of driving behavior,
    the data collected must make it possible, through matching with external data,
    to obtain a better knowledge of the environment which beyond simple price modulation
    allows the development of new services and preventive actions, for example:


    *   – informing policyholders in case of risk of hail and incentive to return
    their car;

    *   – encouraging policyholders to take a break after excessively driving periods;

    *   – calling of emergency services in the event of an accident or real-time assistance
    in case of breakdown; own*   – informing policyholders of the risks associated
    with their itinerary.


    If initially insured persons were reluctant to share their data with their insurer,
    it seems that the acceptance to share such data would be facilitated by the development
    of such services and preventive actions. Furthermore, the latter will constitute
    a lever of growth and retention ability for the insurers proposing them and will
    contribute to an improvement of their image. Indeed, where automobile insurers
    mainly intervened in the past in the event of a claim, or under tragic circumstances,
    they were able to intervene upstream of their realization by allowing their policyholders
    to protect themselves.


    Furthermore, insurers may also contribute by indicating the most accidental locations.


    It may not be enforced against index-based insurance as the policy is not really
    in the nature of an insurance in the sense that it does not necessarily compensate
    for a loss. In reality, index-based insurance checks the insurability criteria
    for a risk (defined in `section 5.1.2.1`), the insured risk being in this case
    the attaining of the criterion defined as trigger of the insurance benefit, such
    as living benefit guarantees in life insurance.

