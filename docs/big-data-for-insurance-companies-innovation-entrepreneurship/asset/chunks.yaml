    神经计算基本单元的最早神经形态构建之一可归于 1943 年的 McCulloch 和 Pitts [MAC 43]。真实的神经元非常图式化的工作原理如下：


    - – 通过树突和突触，对其连接的神经元产生的神经脉冲（抑制性或兴奋性）进行加权求和；

    - – 如果输入总和超过激活阈值，则在轴突中发射流入。


    McCulloch 和 Pitts 的形式神经元重现了这两个属性。对于一个 `x` ∈ ![image](img/upr.jpg)*^p* 输入，突触权重单位：`w`
    ∈ ![image](img/upr.jpg)*^p* 和激活阈值：`θ` ∈ ![image](img/upr.jpg) 计算得出：


    - – 加权和：![images](img/i0051-01.jpg)

    - – 输出 `Pw = Φ(w .*x − θ) = ![images](img/upi.jpg)[{*w*.*x*≥*θ*}]；


    ```

    其中函数 ![images](img/upi.jpg)[{*A*}] 在 `A` 为实数时为 1，否则为 0。函数 `Φ` 被称为激活函数或响应函数。我们通过设定
    `w[l+1] = θ` 并考虑额外的输入：`x[p+1] = -1` 来简化符号，使得我们可以写成 `Pw = ![images](img/upi.jpg){*w*.![images≥*θ*}],其中
    ![images](img/i0051-02.jpg) 和 `![images](img/sxtilde.jpg)* = (x[1], … , x[p+1])`。


    注意，这种神经元执行的是 {0,1} 中的 ![image](img/upr.jpg)*^p* 函数。没有理由局限于 Heaviside 的响应函数 `Φ(u)
    = ![images](img/upi.jpg)[{*u*≥0}]`，在许多应用中，其他函数已相应取代了它：


    - – `Φ(u) = u`（线性神经元或 Widrow–Hoff 方法）；

    - – `ΦT = ![images](img/i0051-03.jpg)`，称为温度 `T` sigmoid，当 `T` ⟶ 0 时简单地收敛于 `Φ0
    = ![images](img/upi.jpg)[{*u*≥0}]`。这种激活函数与 Heaviside 响应函数相比的优势之一是它是处处连续且可微的，这对于大多数学习算法都是至关重要的；

    - – `ΦT,a,b = a + (b − a) ΦT`，值在 `[a, b]` 中的 sigmoid，特别是 `ΦT,-1,1 = tanh![images](img/i0051-04.jpg)`


    McCulloch 和 Pitts 的早期工作诞生了连接主义学。然而，直到 1960 年才观察到第一个应用：Rosenblatt 的 [ROS 62] 感知机。感知机由心理学家
    Rosenblatt 于 1962 年引入，指代一组连接的形式神经元。Rosenblatt 的目标是模拟图像视觉识别，其灵感源于生物学结构：视网膜、投影和关联区域通过输入向量和相互连接的连续神经元层进行建模。我们将在下文中看到人工多层神经网络重现了这种结构。在研究神经网络之前，让我们看看简单的感知机（即
    McCulloch 和 Pitts 的简单神经元）实际上可以计算什么函数。我们遵循连接主义学校的历史方法。


    ### 3.3.2. 作为线性可分器的简单感知机


    我们关注函数：`Pw = ![images](img/upi.jpg){*w*.![images≥*θ*}]`，从 ![image](img/upr.jpg)*^p*
