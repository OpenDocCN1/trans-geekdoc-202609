- raw: 'The indexes make it possible to materialize the jeopardy of return and to
    define the level of compensation. The latter is automatically triggered on their
    basis through a simplified declaration and settlement process. In this sense,
    the functioning is comparable to smart contracts, which are called upon to develop
    through blockchains.


    Given the functioning of these guarantees, it is noted, however, that if compensation
    without damage is possible, an incorrect calibration of the index trigger level
    may result in non-compensation for actual damage suffered. In this sense, data
    science can prove to be a valuable tool for defining the thresholds for triggering
    the guarantees proposed on the basis of a history of claims and satellite data
    or derived from weather stations.


    Some operators, such as Meteo Protect, develop these types of insurance solutions
    and progressively extend their range to various weather-sensitive activities (energy,
    transport, tourism, etc.). For example, the agricultural industry has been able
    to benefit from guarantees suited to the operating losses potentially generated
    as a result of weather variations.


    More traditional stakeholders in the insurance industry (Swiss Re, Allianz, Axa
    Corporate Solutions, Pacifica, etc.) have also positioned themselves in recent
    years to offer these types of guarantees. Given the expertise still required at
    this stage, the proposed guarantees concern a diversity of risks and limited geographical
    coverage, but the possible automation of calibration of this type of guarantees
    through the use of data science should contribute to their development.


    Beyond the weather-sensitive economic activities, growing urbanization as well
    as population growth and densification, human and financial stakes associated
    with climate and weather tend to increase. A better understanding of their impacts
    helps to improve risk management in terms of insurance as well as the development
    of suitable risk prevention and mitigation policies at the level of public authorities.


    ### 5.2.4. *Orientation of savings in life insurance in a context of low interest
    rates*


    In the current low interest rate context, insurers offering savings products such
    as life insurance are naturally interested in achieving an in-depth understanding
    of the behavioral dynamics of unit-linked investment of their policyholders.


    Data science, through the valorization of both internal and external data, and
    the use of machine learning algorithms can make it possible to obtain such an
    understanding. However, depending on the accessibility of data, the level of progress
    of stakeholders and the product and portfolio characteristics, approaches to be
    implemented, results achieved and the uses that can be made of them differ.


    The added-value brought about by the matching of external data, notably relating
    to the economic environment, varies according to the cyclical nature of the various
    predicted acts. Thus, although the contribution is limited for the prediction
    of total surrenders, it is, however, increasing according to whether partial surrenders,
    premiums or switches are involved.


    The pitch of the prediction model is also significant. Indeed, if few insurers
    have been able to record the realization of cyclical trade-offs through classical
    modeling carried out with an annual pitch, a monthly prediction made using data
    science and matching external economic data helps to better capture such behavior.
    While the interest may be considered limited, although existing, with a view to
    feeding a prospective model, it is different for marketing interest, such a prediction
    enabling the identification of efficient incentives and taking them into account
    in commercial policy.


    ![Figure 5.2. Type of matched data for the study of behaviors in life insurance
    ¶ (source: DataSquare)](images/fig5-2.jpg)


    **Figure 5.2.** *Type of matched data for the study of behaviors in life insurance*
    ¶ *(source: DataSquare)*


    Beyond a precise use that allows an understanding of the historical behavior of
    policyholders, it is appropriate that it should be possible to easily reuse the
    implemented algorithms. For example, the past decade has witnessed an almost continuous
    drop in interest rates and an unprecedented financial crisis. In effect, the future
    cyclical behavior of policyholders may potentially differ from the past behaviors
    apprehended on history via a recourse to supervised learning. The regular reuse
    of algorithms makes it possible to capture behavioral changes, evolutions which
    will not fail to occur with the rise in interest rates expected due to the actions
    of the Federal Reserve in the United States and the progressive stoppage of quantitative
    easing scheduled for 2017 at the level of the ECB.


    Similarly, data science allows the analysis and prediction of banking behaviors
    regarding deposits, partial or total prepayments or renegotiations. The studies
    carried out can allow a better feeding of bank ALM models and, through the use
    of appropriate metrics, a more efficient orientation of the commercial policy
    through better client targeting.


    ### 5.2.5. *Fight against fraud*


    As regards insurance, there are almost as many types of fraud as there are types
    of commitments. However, two instances are logically more sensitive: underwriting
    and submissions of claims.


    Underwriting may be an opportunity for a declaration overestimating the insured
    property, in particular with regard to multi-risk home insurance. Submissions
    of claims may be an opportunity for overestimating the claim incurred or even
    of the declaration of a claim not actually incurred.


    Fraud can be individual or networked and, where appropriate, the identification
    of the network as a whole, which can be realized through interaction graphs between
    stakeholders, contributes greatly to the effectiveness of the anti-fraud mechanism.


    The stakes in the fight against fraud are numerous:


    ![Figure 5.3. Stakes in the fight against fraud ¶ (source: Optimind Winter \[OPT
    16\])](images/fig5-3.jpg)


    **Figure 5.3.** *Stakes in the fight against fraud* ¶ *(source: Optimind Winter
    \[OPT 16\])*


    As regards anti-fraud measures, even if the ability to process data in real time
    or near real time is paramount, it must be pointed out that algorithms cannot
    be the only tools used to identify fraudsters: they allow the identification of
    profiles of potential fraudsters for which investigations must be carried out.


    Two main approaches can be explored to take advantage of data science in the fight
    against fraud:


    *   – a classical approach involving the implementation of a traditional fraud
    detection process (where fraudsters’ profiles are based on intuitive drivers),
    identification of cases of proven fraud, use of supervised learning to refine
    the identification of profiles of fraudsters/non-fraudsters and reiteration;


    *   – the initialization of the traditional approach process can be replaced by
    an alternative approach to identify the profiles for which the submitted claims
    vary significantly from the theoretical claims. The identification of profiles
    may be done within this framework through a data-driven approach. The rest of
    the process is comparable to the traditional approach.


    ### 5.2.6. *Asset management*


    Machine learning algorithms are already used in different high-frequency trading
    algorithms. At this stage, however, their use for asset management purposes for
    insurance is very marginal, as the investment objectives of insurance do not respond
    to the same temporality.


    Despite this observation, various uses that may contribute to the management of
    investments can be envisaged:


    *   – regarding strategic allocation (for example, managing an intersectoral allocation
    of corporate investments);


    *   – regarding tactical allocation (for example, managing an intrasectoral allocation
    of corporate assets by anticipating credit rating migrations).'
