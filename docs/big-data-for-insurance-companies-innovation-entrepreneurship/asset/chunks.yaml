    - decreasing with the distance: Λ(*i*, *j*) ⟶ 0 when ![images](images/capd.jpg)(*i*,\
    \ *j*) ⟶ ∞.\n\nIt is often agreed that Λ(*i*,*i*) = 1.\n\nWhen Λ(*i*, *j*) = 1,\
