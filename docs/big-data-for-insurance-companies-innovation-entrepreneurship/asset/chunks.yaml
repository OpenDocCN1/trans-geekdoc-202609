    \ 241–259, 1992.\n\nChapter written by Franck VERMET.\n\n# 4  \n\nCurrent Vision\
    \ and Market Prospective\n\n## 4.1. The insurance market: structured, regulated\
    \ and long-term perspective\n\nIn France, the insurance market is essentially\
    \ composed of large companies, often of international size, powerful and strong,\
    \ offering to private clients and companies the guarantee of solvent and sustainable\
    \ third parties and the ability to appropriately address disasters and financial\
    \ crises. In general, these companies are old, resulting from combination of structures\
    \ often created more than a century ago, or subsidiaries of large banking groups.\n\
    \nSeveral types of structures coexist: for-profit limited insurance companies,\
    \ mutual insurance companies with non-profit civil society status, provident institutions\
    \ and mutual insurers. Traditionally specialized in individual health insurance,\
    \ many mutual insurers have grouped together or moved closer to provident institutions\
    \ specialized in health and collective welfare insurance for corporate clients.\
    \ Regrouping trends have also affected provident institutions and there are now\
    \ only a handful of groups, which may also include public limited companies.\n\
    \nSince the implementation of the Solvency II prudential regulation, which applies\
    \ to all of these structures’ activities, historical differences in governance\
    \ are partially erased, although differences in culture and values remain as well\
    \ as mutual insurers and provident institutions, for example, not having, the\
    \ initial vocation to select policyholders.\n\n### 4.1.1. *A highly regulated\
    \ and controlled profession*\n\nInsurance business requires an authorization.\
    \ The authorization is issued by the (ACPR) Autorité de contrôle prudentiel et\
    \ de resolution (Prudential Supervision and Resolution Authority) after reviewing\
    \ a file providing all the project’s details, which must guarantee the financial\
    \ strength (shareholders and business plan) as well as the skills of the management\
    \ team. Authorization agreements are rare. However, in October 2016, an authorization\
    \ was granted to a new digital insurance company, Alan, which offers health coverage\
    \ primarily targeting start-up clients and whose main shareholder is CNP Assurances.\
    \ However, in general, entrepreneurs wishing to invest in the insurance market\
    \ are encouraged to work as brokers to build offerings, find clients and bring\
