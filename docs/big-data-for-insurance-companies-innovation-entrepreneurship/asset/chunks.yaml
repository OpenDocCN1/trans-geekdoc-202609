- raw: 'They are major financial actors. A significant part of French savings is entrusted
    to them, via life and death insurance contracts, whose funds are invested in the
    stock markets, in particular for the financing of national debt. They are also
    entrusted by public authorities with the collection of several taxes and solidarity
    levies, such as those intended to supply the compensation fund, for which a fixed
    amount is deducted from each property insurance contract. Clients are often unaware
    of this: they often assimilate these levies to management fees or price increases,
    which does not contribute to the readability of the prices or to a kind impression
    as regards the insurers.


    Given the importance of the economic role played by insurance institutions regarding
    society, such institutions are highly regulated and monitored. They are strongly
    capitalized and follow the European Solvency II prudential regulation. They are
    subject to multiple laws and regulations, many of which are intended to ensure
    clients that the insurer will meet their obligations. Furthermore, the regulations
    aim at protecting insured persons such that insurers do not abuse clients’ information,
    which they acquire by virtue of their occupation. Insurers are assumed to be placed
    in a situation of information asymmetry that gives them a position of strength
    relative to clients and are therefore limited to using pricing criteria. The regulations
    also stipulate that the use of personal data must be carried out whilst respecting
    privacy, without discrimination, in a parsimonious and equal manner, and that
    the insurer will take all the necessary security measures to protect themselves
    from data theft or leakage, under penalty of severe sanctions.


    The role of actuaries is to make judicious use of data relevant to risk assessment
    and control, including the calculation of claims provisions. The data quality
    must have been previously verified.


    Insurance companies are mainly controlled by the Prudential Supervision and Resolution
    Authority (ACPR), which carries out close supervision of their activities, supported
    by frequent and highly documented reporting. The organization and governance of
    insurance companies are supervised by the ACPR. The appointment of executives
    and key functions officials (actuarial function, risk management, compliance and
    audit) is subject to declarations and authorizations from the ACPR.


    As major data users, insurance companies are also in frequent contact with the
    CNIL (National Commission on Informatics and Liberty) through their CIL (Data
    Protection Correspondent) and now their DPO (data privacy officer), a function
    that must have been created around May 2018, with a deadline for compliance with
    the GDPR, the General Data Protection Regulation.


    ### 4.1.2. *A wide range of long-term activities*


    The guarantees issued by insurance companies cover all economic fields: coverage
    of property held by individuals or companies, coverage of the consequences of
    natural events, civil liability insurance, health, retirement, death and welfare
    insurance as well as life insurance and savings, etc.


    Their exploits fall within a long-term perspective, particularly for pension and
    personal protection insurance as well as public liability insurance, especially
    product and construction insurance. With regard to retirement, in view of survivor
    pension, the duration of a contract can exceed one century.


    As a result, insurers are required to manage product portfolios, with old contracts
    still active, while, over time, new contracts, more adapted to changing needs,
    are added to the existing portfolios.


    The strength and solidity of insurance companies are therefore inseparable from
    a certain amount of management burden, with layers of processes and computer devices
    that are difficult to absorb, especially as, on the one hand, these insurers are
    the result of numerous mergers of companies, and on the other hand, tax and social
    regulations are constantly changing, which renders processing more complex.


    The wide range of areas of insurance practice actually corresponds to different
    trades, with distinct markets and often different distribution channels.


    Personal insurance is sold to a large extent as B2C (business to consumer), but
    client contact is not always the responsibility of the insurance company. Traditional
    companies (Axa, Allianz, Aviva, etc.) offer many distribution channels: employee
    networks that directly link the client with the insurer, as well as general agents
    who act with a certain independence on behalf of the insurer for which they are
    agents, and also brokers who have an autonomy of action, put insurers in competition
    and provide personalized advice, and independent asset management advisors (IAM)
    who place savings contracts and intervene in the arbitrage of financial supports.
    However, individuals can also turn to the banking networks that distribute the
    contracts of insurance companies, which are subsidiaries of banks. These companies
    which have recently come into existence now account for two-thirds of the life
    insurance market and the growing shares of car and home insurance for individuals.


    All these companies as well as their distributors have telephone platforms including
    sites and online sales as well as smartphone applications, with sale means increasingly
    appreciated by the French for all their expenditures.


    Henceforth, multichannel marketing must enable clients to use all means of information
    and advice on products, including all modes of distribution. Clients want to be
    able to use all these channels to inquire, receive advice and buy, when they desire,
    with the need to be recognized everywhere, with all their history, including the
    most recent one, regardless of the different distribution channels used and the
    different insurance areas covered. Thanks to Hamon law, nowadays individuals can
    change insurers more easily. They are helped in this regard by the rapid growth
    of comparators that allow them to have a global vision of the market and find
    the offer and price best suited to their needs. Concerning corporate clients,
    certain lines of insurance that require a technical approach, such as companies’
    operating risks, resort to underwriter engineers with advanced skills in the insured
    domain.


    The commercial approaches, guarantees offered and skills adapted to the various
    insurance domains and to the different client segments are therefore varied and
    equally require a wide variety of organizations and methods.


    ### 4.1.3. *A market related to economic activity*


    Insurance supports and secures entrepreneurs and individuals in their activities.
    The market volume is thus linked to that of the activities. With regard to the
    economic context, the French market is generally mature in a large number of sectors,
    notably the volume of property insurance: car and home insurance. In car insurance,
    the tendency of urban youth to opt for one-time rental rather than the purchase
    of a vehicle is not neutral for insurers if it is confirmed. This reduces the
    market and switches it from B2C to B2B (business-to-business and fleet contracts
    with renters).


    ### 4.1.4. *Products that are contracts: a business based on the law*


    Regarding contractual relationships between the insurer and their client, it is
    the law that governs mutual obligations. In property insurance, the contract is
    established for a given period by the signing of documents describing the object
    of the insurance and the insurer’s commitments on the basis of the insured’s declarations.
    If a claim occurs during the insurance period, the insurer must fulfill their
    obligations on the basis of this contract.'
