  trans: '


    大数据应用的另一个重要领域（也是大幅节省成本的来源）是反欺诈。`FFA`（法国保险协会）及其 `Alpha` 结构自 2014 年起一直与初创公司 `Shift
    Technology` 一起致力于此工作。一些市场参与者使用了 `IBM Watson` 系统。`Watson` 为 `ProBTP` 在光学牙科领域建立了一个实时运营反欺诈平台
    `Solon`。它旨在震慑、检测和预防欺诈。


    为了改善与客户的关系，一些计划旨在让客户掌握保险合同法律语言的钥匙，这些语言通常被个人认为是旨在混淆被保人的专业术语。因此，`Aviva` 利用亚马逊的智能助手
    `Alexa` 来让保险词汇变得易于理解。


    实时简化和精简客户关系是保险公司持续关注的问题。


    随着智能手机成为消费者购物的首选工具，人们正投入巨大努力开发移动应用程序。预防性警报会被发送给客户，以告知他们风暴等风险。正如`MetLife` 一样，“360°”客户视野是保险公司的目标。在这方面，`MMA`（营销管理分析）例如在
    2016 年部署了一个工具，使客户关系人员在建立联系时能够轻松访问客户的全部数据。


    另一个发展领域涉及协助合规管理。一波创新潮来自亚洲，其被称为 `Regtech` 的初创公司提出了解决方案，以方便保险公司约束条件和客户知识（`KYC`）的管理。


    其他参与者专注于促进其客户储蓄的财务管理。`SwissLife` 作为一家大型寿险公司，尽管对新技术持谨慎态度，但投资了 `BudgetInsight` 的
    `Fin Box API`，该应用程序让个人对其财务资产拥有全球视野，以鼓励其 800 名财富管理专家团队的活动。财富管理咨询也是大数据和 `AI`（人工智能）使用的特权领域。机器人投顾（`Robo-advisors`）提供资产配置和自动化管理，可以提供等同于
    `WMC`（财富管理顾问）且触手可及的服务，无需人工干预。它们在亚洲非常成功，并开始出现在法国。


    人工智能也通过为客户经理提供的推荐工具引入分销领域。`Crédit Mutuel` 了 `Watson` 来为其网络配备，让客户经理在调整和决策方面保留一定的灵活性。


    `Chatbots`（对话机器人）正在兴起，继 `Facebook Messenger` 以及其他领域的成功实验之后：`Voyages SNCF`、`PMU`（城市博彩）、`Accor
    Hotels`、`Meetic`、`Air France KLM` 等。这些对话机器人全天 24 小时可用，其巨大优势是改善客户体验，同时最终为降低成本开辟道路。机器人仍然相当原始，无法管理客户从
    A 到 Z 的路径。但随着 `NLP`（神经语言学中的自然语言处理）的惊人进展，这些机器人似乎将普及并确实取代应用程序。


    ## 4.6.3 组织与管理的变更以及即将进行的重大培训工作


    这种职业转变对员工产生了直接影响。无疑，榜样必须来自上方。我们必须发明新的管理方法，变得更加集体化和包容。在这方面，`AXA` 集团首席执行官 `Thomas
    Bubbler` 表达了保险公司的心态：“将创新局限于技术是一个错误，因为它必须渗透到我们的整个企业中……在公司最高层，我的第一个决策之一是改变高层开会的方式，为对话创造新空间，并让高管成为真正的伙伴。”


    保险公司的人力总监（`HRDs`）正动员团队向更具跨越性和协作性的工作模式演进，并就数字技术的新方面对员工进行培训：内部数字技术培训、可能导致资质认证的外部培训，以获取
    `R` 编码或 `Python` 技能，或者计算机架构、数学算法，以及合规所需的培训。


    培训还必须涵盖对个人数据和隐私保护新法规的合规。通常，在企业或职业层面已制定了章程，例如对于精算师协会（`Institute of Actuaries`）成员的精算师，必须确保遵守道德准则。


    `HRDs` 与首席信息官（`CIOs`）及经理合作，传播计算机安全文化。网络攻击往往是因为员工的天真和无知，他们落入了黑客摆设的陷阱。良好的培训将极大限制这些风险，这些风险是保险公司面临的最运营风险之一。


    ## 4.6.4 一种新的保险：“连接型”保险


    经常被宣布的保险产品巨大颠覆仍然很遥远。目前，数字技术的影响与保险业务的核心及其互助的精算基础关系不大。


    发展最明显的领域是通过连接对象进行的保险（`IoT`）：这似乎是未来合同创新的途径。许多保险公司已与连接对象制造商建立合作伙伴关系，其想法特别是与客户建立紧密关系，而不是被处于数据源的连接对象制造商隔绝这种接触。


    竞争和战略合作目前正在保险公司、汽车制造商、电信运营商之间进行。


    已经推出了多种针对老年人居家护理的远程援助服务：`Groupama`、`Harmonie Mutuelle`、`Mondial Assistance`、`Allianz`
    和 `AXA`。然而，到目前，他们都在抱怨这个市场还没有启动。


    根据 `Accenture` 2015 年在多个国家进行的一项研究，在 400 家保险公司中，50%的人认为这种新型保险是未来几年的新收入来源，其中 40%已经推出了至少一种基于连接对象的方案。其应用范围最初局限于汽车保险和特定的生活方式（连接手环），现在扩展到房屋和公司建筑、预防以及健康。在法国，推出基于
    `IoT` 产品的保险公司比例仅为 26%，这可以用法国市场的情况来解释：法国的传统合同汽车险比其他国家便宜，这为基于行为的保险为“良好风险”提供定价优势留下的空间较小。


    至于健康保险，保险公司的范围比其他国家要窄得多，因为社会保障的重要性以及法国在该领域盛行的文化使客户对保险公司产生怀疑。


    至于汽车保险，`Allianz` 和 `AXA` 创建了价格取决于驾驶行为的产品：按你的驾驶习惯付钱。由连接车辆数据标记的加速或突然刹车、过度剧烈的转弯和速度过快都不是良好指标，应予以避免以获得折扣。


    '
