- raw: "1.  1) Set a learning base *L[n]* = {(*x[i]*, *y[i]*) ∈ ![image](images/upr.jpg)*^p*\
    \ × ![image](images/upr.jpg)*^q*,*i* = 1, … , *n*}, a number of learning steps\
    \ *M* and learning constants *η*(*t*), *t* = 1, … , *M*.\n\n2.  2) Initialize\
    \ weights *W*¹(0) and *W*²(0).\n\n3.  3) For *t* = 1 to *M*:\n\n    ![images](images/i0058-01.jpg)for\
    \ *i* = 1, … ,*p* + 1,*j* = 1,…,*m*\n\n    ![images](images/i0058-02.jpg)for *j*\
    \ = 1, … ,*m* + 1, *k* = 1, … , *q*\n\n    End For\n\n4.  4) End.\n\nSome remarks\
    \ and avenues can be explored from the literature:\n\n*   – Here, the stop criterion\
    \ is a fixed number of learning steps. In practice, learning is generally carried\
    \ out in a hundred steps. We can imagine an additional or alternative condition\
    \ on the error ε*[a]*, for example, stopping the algorithm if ε*[a]* no longer\
    \ varies (learning is finished). However, this latter condition is not always\
    \ appropriate. The network can sometimes improve until it reaches a near-perfect\
    \ modeling of the learning base, but subsequently prove unable to give suitable\
    \ values on another sample: this is called “overlearning”. To avoid this, we assume\
    \ to know a finite disjoint set *V[n[v]]* = {(*u[i]*, *v[i]*) ∈ ![image](images/upr.jpg)*^p*\
    \ × ![image](images/upr.jpg)*^q*,*i* = 1, … , *n[v]*} of *L[n]*, called the “verification\
    \ base”. The observations (*u[i]*, *v[i]*) of *V[n[v]]* are assumed to be independent\
    \ and derived from random variables of the same law as that of *L[n]*. At each\
    \ step *t* of learning on *L[n]*, we also evaluate the mean squared error on *V[n[v]]*:\n\
    \n\\[3.15\\]![image](images/eq3-15.jpg)\n\nIn general, this error initially decreases\
    \ over time, similar to what happens on *L[n]*, and then stabilizes or increases\
    \ when the network reaches the overlearning phase. This gives a stopping criterion\
    \ for the learning algorithm: it suffices to stop when ε*[v]*(t) reaches its minimum.\
    \ In addition, a third sample, disjoint of *L[n]* and *V[n[v]]* , called “test\
    \ base” or “validation”, is often retained, on which the model selected after\
    \ learning is tested. To be useful in prediction, the model must give an error\
    \ of the same order on the three sets. A model that gives the best results on\
    \ *L[n]* will not always be the most highly-performing in prediction.\n\nOverlearning\
    \ is very sensitive to the complexity of the model and therefore to the number\
    \ of hidden units: what are the links between the size of the network, the size\
    \ of the learning base and the confidence that one can have in its generalization\
    \ capacities? We can find theoretical results on learning in Vapnik and Chervonenkis\
    \ (1971) \\[VAP 00\\], but the experimental results give much better results than\
    \ theoretical bounds that impose gigantic learning bases to obtain correct generalization\
    \ results. Some results were achieved: for a fixed-size learning corpus, the generalization\
    \ error increases with the number of hidden neurons, because the network is progressively\
    \ less constrained by the learning base. It is known in practice that, for equal\
    \ performance, small networks tend to generalize better than large ones. By analogy,\
    \ we can think of the approximation of real functions by polynomials: choosing\
    \ high-degree polynomials is not always the best solution! There is always the\
    \ dilemma between bias and variance: with a more complex model, we can gain precision\
    \ on the learning set, but to the detriment of greater uncertainty in prediction.\
    \ This is especially true if the variable to be predicted is poorly explained\
    \ by the input variables. It is preferable to start with simple models, with *m*\
    \ of a few units. In recent years, a theoretical approach to statistics has been\
    \ developed, which makes it possible to obtain theoretical criteria for choosing\
    \ the number of hidden units from a Perceptron with a hidden layer \\[RYN 12\\\
    ]. The choice of the “best” model is a delicate problem: comparing the models\
    \ cannot be limited to comparing average risks, since the complexity of the different\
    \ models must also be taken into account. Different statistical criteria have\
    \ been developed, in particular for linear models (adjusted *R*², AIC and BIC,\
    \ for example). It is also possible to use these criteria to compare different\
    \ models of neural networks (see the articles by Ingrassia and Morlini \\[ING\
    \ 05, ING 09\\] and Rynkiewicz \\[RYN 12\\]).\n\n*   – The choice of *ϕ[c]* and\
    \ *ϕ[s]* activation functions is directly related to the considered problem and\
    \ to the nature of the data. In the case of regression, a current choice is the\
    \ identity function for *ϕ[s]* and the sigmoid function: ![images](images/i0059-01.jpg)for\
    \ *ϕ[c]*. We can choose the fixed learning constant (0.01 ≤ *η* ≤ 1) or slowly\
    \ decreasing towards 0; for example: *η*(*t*) = *λ^t*, with *λ* ≈ 1, *λ* < 1.\n\
    \n*   – As in data analysis, it is sometimes necessary to preprocess the data:\
    \ for example, in the case of a classification based on numerical explanatory\
    \ variables, it is preferable to center and reduce the variables if they are very\
    \ disparate.\n\n*   – The algorithm is easily generalized in the case of networks\
    \ with several hidden layers. The method is the same, only the calculations are\
    \ slightly complicated.\n\n*   – There are many variants and extensions of this\
    \ algorithm just as there are variants improving the gradient algorithm: conjugate\
    \ gradient method, second-order methods (involving second partial derivatives\
