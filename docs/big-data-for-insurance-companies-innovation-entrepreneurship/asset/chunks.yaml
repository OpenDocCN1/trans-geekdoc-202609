- raw: "In order to simplify, assuming that all the basic predictors have as theoretical\
    \ variance *σ*² and that two basic predictors constructed by the bootstrap method\
    \ have as correlation coefficient *ρ*, then it is easy to see that the predictor\
    \ obtained by bagging has as variance ![image](images/i0068-06.jpg)Thus, it appears\
    \ that the variance decreases with the number *B* of basic models used and also\
    \ that the correlation between the basic models quantifies the gain of the aggregation\
    \ procedure: the more decorrelated the basic models are (small|*ρ*|, the smaller\
    \ the variance of the final model will be. This stands as a justification for\
    \ taking basic models sensitive to the learning sample, such as trees or neural\
    \ networks: otherwise, the basic models will be strongly correlated and aggregating\
    \ them will not result in any improvement.\n\nBagging is very easy to program.\
    \ There is an R package, *ipred*, which offers efficient implementations of this\
    \ method.\n\n### 3.5.2. *Random forests*\n\nIn the case of CART models, Breiman\
    \ \\[BRE 01\\] proposed an improvement in bagging by the addition of randomization.\
    \ The aim is to make the basic models less correlated by adding randomness in\
    \ the choice of variables used in the different basic models. We have seen the\
    \ value in the preceding section: using less correlated basic models helps to\
    \ reduce the predictor variance obtained by aggregation. To this end, Breiman\
    \ proposed to randomly select, at each stage of the construction of a tree, *m*\
    \ variables among the *p* explanatory variables and to determine the corresponding\
    \ split by taking only these variables into account. Note the *L[n]* = {(*x[i]*,\
    \ *y[i]*) ∈ ![image](images/upr.jpg)*^p* × ![images](images/capg.jpg), *i* = 1,…,*n*}\
    \ learning set, where ![images](images/capg.jpg)\\= ![image](images/upr.jpg)in\
    \ the case of regression and ![images](images/capg.jpg)\\= 1,…,*k*} in that of\
    \ classification. The algorithm is as follows:\n\nRandom forest algorithm:\n\n\
    1.  1) Choose *B*, *m* ∈ ![images](images/upn.jpg)^∗.\n\n2.  2) For b = 1 to B:\
    \ \n\n    *   *– draw a Bootstrap sample L*[*n*,*b*] *in L[n];*\n\n    *   *–\
    \ with the sample L*[*n*,*b*]*, construct a CART tree, which defines a predictor\
    \ ![image](images/tetacap.jpg)[b](.). Each split of the tree is determined by\
    \ restricting to a set of m variables randomly drawn among the q explanatory variables,\
    \ the draws being independent for the different splits*.\n\n    *   End For\n\n\
    *   3) Define ![image](images/i0069-01.jpg)(or ![image](images/tetacap.jpg)(.)\
    \ = *argmax [j] card* {*b : ![image](images/tetacap.jpg)b*(.) = *j*})\n\nThe value\
    \ of this approach has been demonstrated when the number of *p* explanatory variables\
    \ is very significant (see, for example, \\[CAR 08\\]). The number of randomly\
    \ drawn variables *m* can be a sensitive parameter. The classical choices are\
    \ *m* = ![image](images/rp.jpg)in classification and *m* = *p*/3 in regression.\
    \ This is the default choice in the R *randomforest* library. As with bagging,\
    \ the out-of-bag error evaluation is used to control the value of *B* and possibly\
    \ to optimize the value of *m*.\n\nSince its publication in 2001, this method\
    \ has been extensively studied and used, due to its very good prediction qualities\
    \ (see, for example, the comparative article by M. Fernandez-Delgado *et al*.\
    \ \\[FER 14\\] and the article by Biau and Scornet \\[BIA 16a\\]). From a theoretical\
    \ point of view, convergence results, which are difficult to obtain, were demonstrated\
    \ in 2015 by Scornet *et al*. \\[SCO 15\\]. Also note the recent article by Biau\
    \ *et al*. \\[BIA 16b\\], which establishes an interesting link between random\
    \ forests and neural networks.\n\n### 3.5.3. *Boosting*\n\nThe boosting method\
    \ was introduced in 1996 by Freund and Schapire \\[FRE 96\\], and it has a common\
    \ characteristic with bagging in that it uses basic models to deduce a final predictor\
    \ by aggregation. However, the essential difference is that boosting constructs\
    \ the basic models iteratively and adaptively, in order to gradually correct the\
    \ mistakes made. The initial idea was to improve the performance of models having\
    \ performance barely better than a random classifier for predicting a binary variable.\
    \ This resulted in the AdaBoost algorithm \\[FRE 97\\], which is the most popular\
    \ boosting algorithm. Let us note *L[n]* = {(*x[i]*, *y[i]*) ∈ ![image](images/upr.jpg)*^p*\
    \ × {−1,1},*i* = 1, … , *n*} learning set. The algorithm is therefore as follows:\n\
    \nAdaBoost algorithm:\n\n1.  1) Choose *M* ∈ ![images](images/upn.jpg)^∗.\n\n\
    2.  2) *Initialize the weights: w* = (*w[i]* = 1/*n*,*i* = 1, … *n*).\n\n3.  3)\
    \ For *m = 1 to M*:\n\n    *   \\- adjust a basic model ![image](images/tetacap.jpg)*[m]*(.)\
    \ on weighted *L[n]* by the weights *w*[1], … , *w[n]*;\n\n    *   \\- calculate\
    \ the apparent error rate on *L[n]* for the model ![image](images/tetacap.jpg)*[m]*(.):\
    \ ![image](images/imm2.jpg)\n\n    *   \\- calculate: *α[m]* = *log*((1 − ε*[m]*)/ε*[m]*);\n\
    \n    *   \\- modify the weights: ![image](images/i0071-01.jpg)\n\n    End For\n\
    \n4.  4) Define: ![image](images/i0071-02.jpg)\n\nAll the observations are equally\
    \ weighted for the first model; then, at each iteration, the weight of an observation\
    \ remains unchanged if it is well classified and increases otherwise. The final\
    \ predictor is a weighted aggregation of the basic models, the weighting being\
    \ a function of the adjustment qualities of each model. Basic models may be weak,\
    \ but it should be ensured in practice that they are better than a random predictor\
    \ (one in two chances of being mistaken): we must have ε*[m]* > 0.5, otherwise\
    \ *α[m]* becomes negative.\n\nThe basic model calibration step with the weights\
    \ (*w*[1], … , *w[n]*) offers several possibilities. For example, weights *w[i]*\
    \ can be used to weigh the empirical error to be minimized:\n\n![image](images/f0071-02.jpg)\n\
    \nThe basic model can also be adjusted on a subsample of size n of *L[n]*, by\
    \ randomly drawing observations (with replacement) according to the weights (*w*[1],\
    \ … , *w[n]*).\n\nThe AdaBoost algorithm has been widely used with CART trees\
    \ as basic models. It has also been extensively studied from a theoretical perspective\
    \ (see, for example, the article by Bartlett and Traskin \\[BAR 07\\], which shows\
    \ properties of universal consistency).\n\nMultiple variations have also been\
    \ proposed to adapt it to the case of multiclass or quantitative output variables\
    \ (see, for example, \\[SCH 01\\]). In 1997, Drucker proposed a version of boosting\
    \ for regression (see, for example, \\[GEY 06\\] for performance analysis in the\
    \ case of CART trees). Note: *L[n]* = {(*x[i]*, *y[i]*) ∈ ![image](images/upr.jpg)*^p*\
    \ × ![image](images/upr.jpg),*i* = 1, … , *n*} learning set. Drucker’s algorithm\
    \ is as follows:\n\nBoosting algorithm for regression:\n\n1.  1) Choose *M* ∈\
    \ ![images](images/upn.jpg)^∗.\n\n2.  2) Define: *p*[1] = (*p*[1,*i*] = 1/*n*,*i*\
    \ = 1, … *n*). The uniform law on {1, … , *n*}.\n\n3.  3) For m = 1 to M: \n\n\
    \    *   \\- draw an ![image](images/clbar.jpg)*[n]* sample of size *n* with replacement\
    \ in *L[n]* following the law *p[m]*;\n\n    *   \\- adjust a basic model ![image](images/tetacap.jpg)*[m]*(.)\
    \ on ![image](images/clbar.jpg)*[n]*;\n\n    *   \\- calculate on *L[n]* for model\
    \ ![image](images/tetacap.jpg)*[m]*(.):\n\n    *   \\- ![image](images/i0072-01.jpg)for\
    \ i = 1, …, n, where *Q* is a loss function;\n\n    *   \\- ![image](images/i0072-02.jpg)\n\
    \n    *   \\- ![image](images/i0072-03.jpg)\n\n    *   \\- ![image](images/i0072-04.jpg)\n\
    \n    *   \\- ![image](images/i0072-05.jpg)\n\n    *   \\- if ε*[m]* < 0.5 ![image](images/icl.jpg)*[m]*,\
    \ then define ![image](images/i0072-07.jpg)\n\n    *   \\- Otherwise define *w*[*m*+1]\
    \ = *p*[1].\n\n    *   \\- modify the probabilities: ![image](images/i0072-06.jpg)\n\
    \n        End For\n\n1.  4) Calculate ![image](images/tetacap.jpg)(.), mean or\
    \ median of weighted ![image](images/tetacap.jpg)*[m]*(.) predictions by the coefficients\
    \ (*log*(1/*β[m]*), *m* = 1, … , *M*)."
