    在这种情况下，待解释变量 `Y` 的存在是基础性的：通过在个体样本上联合观测变量 `Y` 变量和解释变量，我们的目标是构建一个模型，以便能够预测与新输入相关的输出
    `Y`。这就是监督统计学习的数学框架。我们定义一个学习样本：`L[n]` = {(`X[1]`, `Y[1]`), … , (`X[n]`, `Y[n]`)},，即一组独立同分布（i.i.d.）的随机向量，它们与随机向量
    (`X`, `Y`) 具有相同的分布。(`X`, `Y`) 耦合对的分布是未知的，监督统计学习的目标是通过观测学习基 `L[n]` 来学习这一分布。随机变量
    `X` 和 ` `Y` 向量的作用并不相同：在实践中，`X`指的是输入变量（通常是一个由解释变量组成的向量），而 `Y`指的是输出变量（也称为待解释变量）。`Y`
    变量也可以是多维的。监督学习的目的是学习 `X` 和 `Y` 变量之间的联系：注意，仅知道 `X` 和 `Y` 的边缘分布不足以获知 (`X`, `Y`)
    耦合对的分布。通过基于观测 `L[n]` 的统计方法，我们将获得信息，从而能够预测与输入的新观测值 `x` 相关的值 `ŷ`，而此时待解释的 `y` 变量是未。根据输出变量
    `y` 的性质，我们可以区分两种监督统计学习框架：回归和分类。


    ## 回归


    在回归的情况下，输出变量 `Y` 是具有实值的定量变量。其标准框架如下：


    \[3.1]![image](img/eq3-1.jpg)


    其中 `f` 是未知函数，被称为我们寻求估计的回归函数。变量 `ε` 是一个期望为零的实值随机变量：它代表噪声，并使得考虑到 `Y` 变量仅由 `X` 变量部分解释的事实。学习基随后由耦合对组成：(`X[i][]`,
    `Y[i]` = f(`X`) + `ε[i]`)，其中 `ε[i]` 是独立同分布的随机变量。


    我们还假设噪声变量 `ε` 关于 `X` 是条件中心化的。我们有：![images](img/upe.jpg)\[`Y` | `X`\] = f(`X`)，这以唯一的方式定义了函数
    `f`。在对函数 `f` 没有任何额外约束的情况下，我们可以考虑非参数回归模型，它由由从学习基 `L[n]` 构建一个预测器 `![images](img/ifcirc.jpg)`，以便更好地预测与输入
    `x` 相关的输出 `y`。`![images](img/ifcirc.jpg)` 的质量可以通过由以下公式定义的泛化均方误差来衡量：E\ (![images(X)-Y)²]。由于
    (`X`, `Y`) 耦合对的分布是未知的，在实践中，预测器的性能通常通过经验平方误差来衡量：


    \[3.2]![image](img/eq3-2.jpg)


    其定义在测试样本上：![images](img/ltilde.jpg)`[m]` = {(!images](images/xtilde.jpg)[1], ![images](img/ytilde.jpg)[1]),
    … , (!images](images/ytilde.jpg)`[m]}`，大小为 `m`，且独立于 `L[n]`，其中 (![images](img/xtilde.jpg)`[i]`
    与 (`X`, `Y`) 具有相同的分布。


    为了实际实现监督学习方法，必须限制所考虑的回归类，确定预测器的技术将取决于这一选择。一个我们不讨论的常规选项是线性回归，其中 `f(X)` 被假设为解释变量的线性组合。在这种情况下，在学习集上计算的经验平方误差的最小化会导致线性方程组的求解，从而提供显式解。对于更复杂的模型（大多是非线性的），选择和寻找“最佳”模型将不再那么简单，正如我们在后续章节中将看到的。


    ## 分类


    在分类的情况下，输出变量 `Y` 是离散的，代表观测值所属的类别。如果 `K` 表示类别数，我们可以认为 `Y` 的值在 `{1, … ,K}` 中。目标是构建一个模型，为每个输入向量
    `X` 关联 `{1, … ,K}` 中的一个类别。一种常用方法是分两步进行：模型实际估计量：P\[Y = k | X = x]，对于 `k` ∈ `{1,
    … ,K}`，从中选择与观测值 `x` 相关的类别。


    我们将介绍以下监督学习方法：决策树、分层神经网络、SVM（支持向量机）和模型聚合方法（bagging、随机森林、stack）。


    ### 无监督学习


    在这种情况下，没有待解释的变量，因此涉及到一个聚类问题。目标是构建同质类，将最相似的个体（相对于变量）聚集在一起，并且这些类之间尽可能不相似。目标是组织数据中包含的信息，使其更直观且易于利用。在常规方法中，我们有层次分类和动态重新分配算法（k-means）。在
    section 3，我们将看到霍夫南自组织映射，它的优势是可以在小空间内表示类别。


    ## 决策树


    决策树的原理是将解释变量的值空间划分为矩形，在矩形内待解释变量是常数。这种简单的想法由 Breiman 等 [84] 开发，缩称为 CART（分类回归树），能够获得一个易于可视化和解释的模型，从而成为决策的真实工具。此外，这种以二分方式划分空间的方法既适用于回归也适用于分类。


