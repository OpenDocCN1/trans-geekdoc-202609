- raw: 'The imprecise nature of the current demand for personalization, which runs
    counter to mutualization, which is the basis of insurance, is in fact an embarrassing
    unknown in defining the insurer’s strategy. What pricing ethics do consumers expect
    from their insurers? To what extent is the insurer constrained in their ability
    to innovate prices by the unformulated expectations of their clients? How can
    trust be strengthened or on the contrary undermined? Do insurers have to hold
    on to their mutualization base or abandon themselves to the digital marketing
    trend that flatters consumers in the short term? Should insurance become a consumer
    good like any other? Follow the fashion? Or, on the contrary, preserve an image
    of “institution” not really fun, but solid, protective and lasting.


    This should not prevent insurers from taking advantage of big data to obtain the
    value of data, modernize its products and services, lower management and fraud
    costs, listen to clients, keep up with changing needs, adapt and even anticipate
    them.


    ## 4.6. Mobilization of insurers in view of big data


    As early as 2011, MetLife, a long-established insurance company (149 years in
    2017), was the first insurer to embark on big data. A leading life insurance company
    in the United States, present in 60 countries, within 3 months, thanks to its
    big data project “The Wall”, which implemented an all-channel synthetic and unique
    “360° client view”, breaking the boundaries between the “business” silots, which
    is standard among all insurers. This project, which had been included in the strategic
    plan for several years, was not implemented due to the lack of suitable technologies,
    until big data made it possible with a Facebook approach.


    In France, it was in 2013 and especially in 2014 that insurers took the arrival
    of this third industrial revolution very seriously. However, at the time big data
    was still considered by some as a fashion phenomenon. Other insurers were, in
    contrast, quite concerned, fearing the upcoming competition from an “insurance
    free”, Google or other GAFA, whose financial strength and masses of data could
    come and “uberize” existing insurers.


    ### 4.6.1. *A first-phase “new converts”*


    First, the impetus was given by the Directorates-General and quite substantial
    budgets were granted for the hiring of eminent data scientists and marketers of
    the distribution sector, supported by communication. Data lakes, Hadoop computer
    architectures and datalabs were mounted, and chief data officers were appointed.


    Actuaries mobilized to acquire the new skills needed in data science (Python code
    language, random forest algorithms, etc.) in addition to their traditional skills,
    to exploit all types of data. A training exercise on data science for actuarial
    purposes was set up by the Institute of Actuaries for active actuaries. Despite
    the significant mobilization of actuarial means required by the implementation
    of Solvency II, existing professionals began to invest in the digital field.


    To disseminate digital culture in all the teams, chief digital officers were appointed
    to promote the necessary digital evolution, foster cross-functionalities and recognize
    creativity and initiative. Despite the digital days and other events intended
    for company employees, digital penetration in the entire processing chain has
    often proved difficult. It must be noted that it is very difficult to carry out
    the tasks of existing activities, complicated by the profound changes in regulations,
    and the efforts needed for digital transformation.


    The first orientations mainly concerned marketing, following the example of companies
    in the consumer and telephony sector. KYC (Know Your Customer), which has become
    known as “client experience” and client knowledge, was at the center of the action.


    However, from 2015, some were interested in the benefits of obtaining data for
    management. BNP Paribas Cardif, for example, launched the “Kaggle” competition
    in that respect (international competition of algorithms based on real anonymized
    data).


    In the study services, a lot of work was being done to try to take advantage of
    the data, notably weather data, geolocation data and more generally data of open
    data to enrich the internal data. A large number of actuarial papers were thus
    submitted in order to get required diplomas. Many POCs (proofs of concept) have
    been developed in marketing and actuarial services, the new order inducing the
    two professions to cooperate in multi-skills teams, instead of working sequentially
    as usual.


    A certain confidentiality surrounds this work. It is difficult to know the exact
    level of progress of insurance companies. However, it appears that, to date, few
    of these prototypes have been transformed into products or services. One of the
    explanations often put forward is the difficulty of integrating these innovations
    into existing processes.


    ### 4.6.2. *A phase of appropriation and experimentation in different fields*


    Big data gives rise to entrepreneurship: many young Assurtechs are created, full
    of enthusiasm and new ideas. This movement is particularly noticeable in insurance:
    while the amount of capital invested in Fintech decreases in finances, it has
    been multiplied by 20 in 5 years for Assurtech in insurance (source: CB *Insights*).


    Insurers have a great interest in the activity of these young fledgling entrepreneurs
    and their capacity for disruptive innovation. They support them in various ways:
    incubators, partnerships, equity investments, etc. Some are trying to integrate
    them to revitalize their organizations; others prefer to leave them aside so as
    to avoid polluting their creativity by being too close to everyday constraints.
    Some invest in equity; others provide resources or participate alongside them
    with the Unique Interministerial Fund (projects financed by the State through
    competitiveness clusters).


    The input of external data is often done with the help of specialized start-ups.


    Thus, Covea, in collaboration with BlueDME, has launched a platform giving access
    to thousands of external data, with a recommendation engine, making it easier
    for its employees to search for relevant datasets for a given purpose.


    In fact, big data is not henceforth confined to data lab data scientists’ teams.
    The digital world is gradually progressing at the heart of companies, often with
    minor adjustments, in different sectors.


    In the actuarial field, it already helps in improving and accelerating the calculation
    of provisions. Disaster management is better organized and accelerated by sorting
    files using text data or other heterogeneous data, but much remains to be done
    as artificial intelligence progresses. The assessment of severe claims is subject
    to processing by algorithms with data enriched by external data and their assessment
    is refined. This allows for better provisioning and less capital requirements.


    Thus, improving management has several advantages: management costs are lowered
    and provisioning amounts are adjusted. This tends to reduce capital requirements
    and clients are compensated faster. In the future, will it be possible to go as
    far as advanced robotization of claims management, as recently experienced in
    Japan, where a company will replace 34 employees (25%) from one of its services
    by artificial intelligence (Watson explorer)?


    The refinement of prices is a significant study topic for actuaries, but not necessarily
    focused on a lower level of mutualization.


    One of the key issues for insurers is combating attrition: it is an important
    issue for profitability because it costs a lot more trying to win a new client
    than striving to develop client loyalty as regards those in the portfolio.


    In life insurance, the prediction of total and partial redemptions is also improved
    by big data, in particular by knowing the clients’ moments of life.'
