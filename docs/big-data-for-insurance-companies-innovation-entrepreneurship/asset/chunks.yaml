- raw: "In the same vein, sparse versions of principal component analysis have been\
    \ proposed since the 2000s. There are several versions, but the most widely used\
    \ is inspired by the Lasso and ridge regression, noting that the SVD can be interpreted\
    \ as a ridge regression of components on the variables because the main factors\
    \ are bounded. We obtain “components” that are combinations of a small number\
    \ of initial variables, which facilitate interpretation, but at the expense of\
    \ the loss of orthogonality properties of the components and/or factors.\n\n\\\
    [BER 12\\] developed a sparse version of multiple correspondence analysis as follows:\
    \ the MCA being a PCA of blocks of indicators, the authors adapted the group Lasso\
    \ to sparse PCA defined previously.\n\n## 2.7. The end of science?\n\nBig data\
    \ processing requires new tools (we have briefly presented some), and a new attitude\
    \ towards models that are just algorithms, based on validation with data set aside.\n\
    \nThese new tools can be useful to specialists in a field, as \\[VAR 14\\] advises\
    \ econometricians.\n\nIn a provocative article, \\[AND 08\\] claimed that the\
    \ data deluge renders the scientific approach obsolete and declared in essence\
    \ that: “correlations are enough, we can stop modeling. Let us load the data in\
    \ larger computers and allow statistical algorithms to find structures where science\
    \ cannot.”\n\nIt is clear that correlation is not causality: a model that accurately\
    \ predicts statistically does not necessarily allow for action. It is too often\
    \ believed that the influence of a variable can be measured by its coefficient\
    \ in the simple case of a linear model, or by elimination in complex cases: as\
    \ in sensitivity analysis, we study the variation of a quality criterion (R²,\
    \ % of accurately classified observations, etc.) by removing the variable considered.\
    \ This may be interesting but is still insufficient: on the one hand, to vary\
    \ a variable “all things being equal” is an illusion, for the modification of\
    \ a variable can entail modifications on those that are correlated to it, and\
    \ thus on the response. On the other hand, without a pattern of causality, we\
    \ cannot know how the other variables react in view of an intervention.\n\nIf\
    \ we can often forecast without understanding, can we not better forecast if we\
    \ do understand? This subject has been discussed in numerous meetings and studies\
    \ by learning and causality specialists who introduce experimentation in big data\
    \ (see \\[BOT 13\\]).\n\n## 2.8. Bibliography\n\n\\[AND 08\\] ANDERSON C., “The\
    \ end of theory: the data deluge makes the scientific method obsolete”, *Wired\
    \ Magazine*, available at: [https://www.wired.com/2008/06/pb-theory/](https://www.wired.com/2008/06/pb-theory/),\
    \ (last visited on April 15, 2017), 2008.\n\n\\[ANS 67\\] ANSCOMBE F.J., “Topics\
    \ in the investigation of linear relations”, *Journal of the Royal Statistical\
    \ Society*, vol. B 29, pp. 1–52, 1967.\n\n\\[BEN 72\\] BENZÉCRI J.P., *L’Analyse\
    \ des Données*, *Tome 2*, Dunod, Paris, 1972.\n\n\\[BER 12\\] BERNARD A., GUINOT\
    \ C., SAPORTA G., “Sparse principal component analysis for multiblock data and\
    \ its extension to sparse multiple correspondence analysis”, in COLUBI A. (ed.),\
    \ *Compstat Proceedings*, 2012.\n\n\\[BOT 13\\] BOTTOU L. *et al*., “Counterfactual\
    \ reasoning and learning systems: the example of computational advertising”, *Journal\
    \ of Machine Learning Research*, no. 14, pp. 3207–3260, 2013.\n\n\\[BRE 96\\]\
    \ BREIMAN L., “Stacked regressions”, *Machine Learning*, no. 24, pp. 49–64, 1996.\n\
    \n\\[BRE 01\\] BREIMAN L., “Statistical modeling: The two cultures”, *Statistical\
    \ Science*, vol. 16, no. 3, pp. 199–215, 2001.\n\n\\[DON 15\\] DONOHO D., 50 years\
    \ of Data Science, Tukey Centennial workshop, available at: [http://courses.csail.mit.edu/18.337/2015/docs/50YearsDataScience.pdf](http://courses.csail.mit.edu/18.337/2015/docs/50YearsDataScience.pdf),\
    \ (consulted April 15, 2017), 2015.\n\n\\[HAN 99\\] HAND D., “Why data mining\
    \ is more than statistics write large”, *ISI*, Helsinki, available at: [http://www.stat.fi/isi99/proceedings/arkisto/varasto/hand0490.pdf](http://www.stat.fi/isi99/proceedings/arkisto/varasto/hand0490.pdf),\
    \ (consulted April 15, 2017), 1999.\n\n\\[HAS 09\\] HASTIE T., TIBSHIRANI R.,\
    \ FRIEDMAN J., *The Elements of Statistical Learning*, 2nd edition, Springer,\
    \ New York, 2009.\n\n\\[NEL 85\\] NELDER J.A., Discussion of CHATFIELD C., “The\
    \ initial examination of data”, *Journal of the Royal Statistical Society*, Series\
    \ A, no. 148, pp. 214–253, 1985.\n\n\\[NOC 16\\] NOÇAIRI H., GOMES C., THOMAS\
    \ M. *et al*., “Improving stacking methodology for combining classifiers; applications\
    \ to cosmetic industry”, *Electronic Journal of Applied Statistical Analysis*,\
    \ vol. 9, no. 2, pp. 340–361, 2016.\n\n\\[SAP 08\\] SAPORTA G., “Models for understanding\
    \ versus models for prediction”, in BRITO I. (ed.), *Compstat Proceedings*, Physica\
    \ Verlag, 2008.\n\n\\[SAP 11\\] SAPORTA G., *Probabilités, Analyse des données\
    \ et statistique*, 3rd^() edition, Technip, Paris, 2011.\n\n\\[SHM 10\\] SHMUELI\
    \ G., “To explain or to predict?”, *Statistical Science*, no. 25, pp. 289–310,\
    \ 2010.\n\n\\[TEN 98\\] TENENHAUS M., *La régression PLS*, Technip, Paris, 1998.\n\
    \n\\[TIB 96\\] TIBSHIRANI R., “Regression shrinkage and selection via the Lasso”,\
    \ *Journal of the Royal Statistical Society*, Series B, no. 58, pp. 267–288, 1996.\n\
    \n\\[VAP 06\\] VAPNIK V., *Estimation of Dependences Based on Empirical Data*,\
    \ 2nd edition, Springer, New York, 2006.\n\n\\[VAR 14\\] VARIAN H., “Big Data:\
    \ New Tricks for Econometrics”, *Journal of Economic Perspectives*, no. 28, pp.\
    \ 3–28, 2014.\n\n\\[WOL 92\\] WOLPERT D., “Stacked generalization”, *Neural Networks*,\
    \ no. 5, pp. 241–259, 1992.\n\nChapter written by Gilbert SAPORTA.\n\n# 3  \n\n\
    Statistical Learning Methods\n\n## 3.1. Introduction\n\nThe objective of this\
    \ chapter is to present the statistical learning methods most commonly used in\
    \ actuarial science. These are complementary methods to the more conventional\
    \ statistical models, such as linear and logistic regression, which have long\
    \ been applied in actuarial science. With the massive influx of digital data,\
    \ it becomes convenient to implement more sophisticated data-processing and prediction\
    \ methods. Examples of possible applications include:\n\n*   – estimation of the\
    \ amounts and frequencies of individual property claims and casualty insurance;\n\
    \n*   – estimation of individual medical expenses in health insurance;\n\n*  \
    \ – detection of fraud upon declaration of property and claims insurance;\n\n\
    *   – detection of borrowers at risk of default;\n\n*   – development of insurance\
    \ zones taking into account geographical information, such as open data;\n\n*\
    \   – taking into account data collected in real time on vehicles for the purpose\
    \ of establishing a more targeted car insurance rate (pay-how-you-drive concept).\n\
    \nBefore presenting different learning methods more precisely, a general distinction\
    \ should be made between supervised and unsupervised methods.\n\n### **3.1.1.\
    \ *Supervised learning***"
