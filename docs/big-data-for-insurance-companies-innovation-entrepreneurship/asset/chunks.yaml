    As mentioned earlier, one of the advantages of decision trees is the readability
    and ease of interpretation of results, thanks to the tree graph that provides
    a natural understanding of the model. Another advantage is that this method can
    address raw data. Moreover, unlike generalized linear models, it is possible to
    take into account linearly related explanatory variables, and the link between
    the output variable and the other variables can be nonlinear.


    However, this method has some disadvantages: for example, the models obtained
    are not particularly reliable because they depend largely on the learning sample.
    Minor changes in the learning base can significantly alter the model obtained.
    This is one of the reasons why decision trees are now used as blocks of more sophisticated
    methods using a large number of models in parallel: model aggregation methods
    (random forests, bagging, boosting) will be presented in [section 3.5](#chapter03.xhtml#sec3-5).
    We also note that the decision trees do not give an overall segmentation for each
    explanatory variable: it is possible for a variable to appear several times in
    different paths.


    The CART method admits variants \[BRE 84\] and there are also other methods for
    constructing decision trees, such as the C4.5 algorithm introduced by Quinlan
    \[QUI 93\] and widely used within the IT community. It is also possible to construct
    predictors based on more regular recursive partitioning than decision trees, which
    define constant functions piecewise (see, for example, Friedman’s \[FRI 91\] MARS
    algorithm).


    Decision trees have applications in many fields. They can be used in actuarial
    science, for example, in non-life pricing, as the article by A. Paglia and M.P.
    Guinvarc’h \[PAG 11\] illustrates.


    It should be noted that the CART algorithm is implemented in R language in the
    r*part* package.


    ## 3.3. Neural networks


    This section is an introduction to “neural networks” or “connectionist methods”,
    which can be defined as the set of numerical problem-solving methods using models
    derived from neurobiology. The first major reflections were around 1940, and some
    names can be cited such as von Neumann, Turing, Wiener, McCulloch and Pitts. The
    objective then was to use the new knowledge brought by biology and cognitive sciences
    on the brain to design computer systems having some of its properties such as
    adaptive learning by successive local modifications and relocation of information
    storage, with the effect, for example, of robustness in cases of partial destruction.
    Two schools of thought emerged from these initial works. The first one (von Neumann,
    Turing, etc.) adopted a symbolic approach and was at the origin of concepts still
    used in our computers (memory, processors) and in “traditional” artificial intelligence.
    The second one (McCulloch, Pitts, Minsky, etc.) voluntarily followed a “connectionist”
    approach closer to biological description (neuromimetism). This approach saw a
    revival when the difficulties of traditional artificial intelligence came to light
    in the 1980s. The results have sometimes been spectacular and give rise today
    to highly advanced practical applications (forms and writing recognition, speech
    synthesis, time series prediction, medical diagnostic assistance, etc.), but the
    mathematical analysis of these nonlinear models remains very complex.


    Neural networks constitute a vast field of research from a theoretical perspective
    and as regards applications (see, for example, the comprehensive book of K.-L.
    Du and M. Swamy \[DU 14\]). We will focus on layered networks and the well-known
    gradient backpropagation algorithm, which offer very interesting applications
    in supervised learning and are complementary methods to simpler and more conventional
    statistical models (linear and logistic regression). Recently, there has been
    renewed interest in these methods, followed by the development of even more efficient
    learning methods: deep learning, in particular, is already revolutionizing the
    world of artificial intelligence.


    Note that the Kohonen algorithm and SVM methods, which will be presented in the
    subsequent sections, also derive their origins from neural modeling. The development
    of SVM, for example, was initially influenced by Rosenblatt’s work on Perceptron
    in 1962 \[ROS 62\].


    ### **3.3.1. *From real to formal neuron***'
