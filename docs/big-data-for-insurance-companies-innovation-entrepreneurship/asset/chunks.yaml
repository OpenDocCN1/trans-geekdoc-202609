    Big data is here. Without doubt, the flood of data should continue, if not grow.
    If properly stored, managed and exploited, big data offers numerous opportunities.
    Computing has laid down a gauntlet: new architectures and a new ecosystem have
    been developed and are continually evolving. Insurance has not been spared from
    this phenomenon. Big data will allow new opportunities to be seized and also brings
    new risks. The final three chapters of this book will shed light on these developments.


    However, big data cannot do everything, all the time. One famous example, among
    others, is the failure of Google’s flu forecasting system (since abandoned) [LAZ
    14]. Good predictions sometimes rely upon good understanding, and data science,
    despite inevitable changes to make and challenges to face, has bright days ahead
    of it. These issues as well as the main machine learning algorithms will be presented
    in the next two chapters.


