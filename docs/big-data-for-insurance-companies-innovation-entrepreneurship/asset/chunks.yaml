    One of the first neuromimetic constructions of the basic unit of neural computation
    is attributable to McCulloch and Pitts [MAC 43] in 1943. The real neuron, very
    schematically, works as follows:


    - – weighted summation of nerve impulses (inhibitors or exciters) from the neurons
    to which it is connected, via dendrites and synapses;

    - – emission in the axon of an influx if input summation exceeds an activation
    threshold.


    McCulloch and Pitts’ formal neuron reproduces these two properties. For an `x`
    ∈ ![image](images/upr.jpg)*^p* input, the unit of synaptic weights: `w` ∈ ![image](images/upr.jpg)*^p*
    and activation threshold: `θ` ∈ ![image](images/upr.jpg)calculates:


    - – the weighted sum: ![images](images/i0051-01.jpg)

    - – the output `P[w](x) = Φ(w .*x − θ) = ![images](images/upi.jpg)[{*w*.*x*≥*θ*}];


    ```


    where the function ![images](images/upi.jpg)[{*A*}] is 1 if `A` is real and 0
    if not. The function `Φ` is called the activation function or the response function.
    We simplify the notations by posing `w[l+1] = θ` and by considering an additional
    input: `x[p+1] = -1` such that we can write `P[w](x) = ![images](images/upi.jpg)[{*w*.![images](images/subxt.jpg)≥*θ*}],
    where ![images](images/i0051-02.jpg)and `![images](images/sxtilde.jpg)* = (x[1],
    … , x[p+1]).


    Note that such a neuron carries out a function of ![image](images/upr.jpg)*^p*
    in {0,1}. There was no reason to limit oneself to Heaviside’s response function
    of `Φ(u) = ![images](images/upi.jpg)[{*u*≥0}]`, and other functions have appropriately
    replaced it in many applications:


    - – `Φ(u) = u` (linear neuron or Widrow–Hoff method);

    - – `Φ[T](u) = ![images](images/i0051-03.jpg)`called temperature `T` sigmoid,
    converging simply to `Φ[0](u) = ![images](images/upi.jpg)[{*u*≥0}]` when `T` ⟶
    0. One of the advantages of this activation function, with respect to Heaviside’s
    response function, is that it is continuous and differentiable everywhere, which
    will be essential for the majority of learning algorithms;

    - – `Φ[T,a,b](u) = a + (b − a) Φ[T](u)`, sigmoid with values in `[a, b]`, in particular
    `Φ[T,-1,1](u) = tanh![images](images/i0051-04.jpg)`


    These early works of McCulloch and Pitts gave birth to the connectionist school.
    However, it was not until 1960 that the first application was observed: Rosenblatt’s
    [ROS 62] Perceptron. Introduced in 1962 by the psychologist Rosenblatt, the Perceptron
    designates a set of connected formal neurons. Rosenblatt’s objective was to model
    the visual recognition of images, inspired by the biological structure of vision:
    the retina, the projection and associative areas are modeled by an input vector
    and successive layers of neurons connected to one another. We will see below that
    artificial multilayer neural networks reproduce this structure. Before studying
    neural networks, let us look at what functions the simple Perceptron, that is,
    the simple neuron of McCulloch and Pitts, can actually compute. We follow the
    historical approach of the connectionist school.


    ### 3.3.2. Simple Perceptron as linear separator


    We focus on the function: `P[w](x) = ![images](images/upi.jpg)[{*w*.![images](images/subxt.jpg)≥*θ*}]`,
    from ![image](images/upr.jpg)*^p* to {0,1}, defined by the synaptic weights: `w`
    ∈ ![image](images/upr.jpg)^(p+1). Let us introduce the next notion.


    DEFINITION.– **Two sets A, B ⊂ ![image](images/upr.jpg)*^l** are said to be linearly
    separable if there exists: `w` ∈ ![image](images/upr.jpg)^(p+1) `such that:*


    - – every `x` in `B` verifies: ![images](images/i0052-01.jpg);

    - – every `x` in `A` verifies: ![images](images/i0052-02.jpg).


    *Similarly, a function `f : D ⊂ ![image](images/upr.jpg)*^p* ⟶ {0,1}` is said
    to be linearly separable if the sets `A = {x ϵ D: f(x) = 1}` and `B = {x ϵ D:
    f(x) = 0}` are linearly separable*.


    By definition, a given `f : D ⊂ ![image](images/upr.jpg)*^p* ⟶ {0,1}` function
    is linearly separable if and only if there exists a `P[w]` function defined as
    above.


    ### 3.3.3. Multilayer Perceptron as a function approximation tool


    Let us introduce the mathematical formalism of layer structured neural networks,
    which are models very much used in practice in neural network approximation problems.

