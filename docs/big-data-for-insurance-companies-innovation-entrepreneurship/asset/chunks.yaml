- raw: "These examples are not exhaustive, and the wealth and diversity of the available\
    \ financial information and the ability to link the consideration of ALM constraints\
    \ with the latter should enhance the development of the use of data science for\
    \ investment management purposes.\n\n### 5.2.7. *Reinsurance*\n\nTraditionally,\
    \ insurers wishing to market new guarantees can rely on the support of reinsurance\
    \ stakeholders. The latter, with data from different insurers and significant\
    \ resources, can develop a refined vision of risk compared to what would be that\
    \ of non-supported insurers wishing to enter a new market or under the cover of\
    \ emerging risks (cyber risk, for example).\n\nThere should be renewed interest\
    \ in this relatively widespread approach regarding development of new guarantees\
    \ given the new ability of reinsurers to match the data of different insurers\
    \ with each other and to match all of these data with external data, which help\
    \ to refine the understanding of the influence of risk factors in the triggering\
    \ of claims.\n\nThus, reinsurers should assert their position as support to insurers\
    \ in the development and commercialization of new types of guarantees and products.\n\
    \nNOTE.– Data science allows the optimization of available data to be used for\
    \ a wide variety of purposes, particularly in the identification of risk factors\
    \ and the understanding of behaviors. Given the large number of potential use\
    \ cases, their identification and prioritization must be in the hands of the trades\
    \ (marketing/distribution, actuarial product, risk management, etc.) so as to\
    \ maximize the added-value for the insurance company.\n\n## 5.3. New professions\
    \ and evolution of induced organizations for insurance companies\n\n### 5.3.1.\
    \ *New professions related to data management, processing and valuation*\n\nDeveloping\
    \ the valuation of data and data science tends to generate new needs for insurers\
    \ and new professions:\n\nAlthough several companies have in recent years implemented\
    \ a chief digital officer function to support the digitalization of their activities,\
    \ the latter logically will eventually disappear once the digital culture has\
    \ been sufficiently implanted within the different business departments.\n\nThe\
    \ success of the chief digital officer results in the disappearance of this function.\n\
    \n**Table 5.3.** *Main data professions (the list is not necessarily exhaustive\
    \ but the name may vary according to organizations)*\n\n| **\uFEFFFunctions**\
    \ || **Prerogatives** |\n\n| --- | --- |\n\n| ***Chief data officer*** || – coordination\
    \ of data collection (identification of data relevant to the company, financing\
    \ of action plans, purchase of software packages or data, etc.);  \n\n– organization\
    \ of data sharing with the different departments, in particular the business departments;\
    \  \n\n– production of business-oriented recommendations;  \n\n– ensuring the\
    \ observance of ethics as regards data use. |\n\n| --- | --- |\n\n| ***Data scientist***\
    \ || – contribution to the assessment of business needs;  \n\n– identification,\
    \ cleaning and preparation of internal and external data, structured or unstructured;\
    \  \n\n– implementation of algorithms or assemblies of machine learning algorithms;\
    \  \n\n– formulation of hypotheses to be tested via the developed algorithms;\
    \  \n\n– supporting the industrialization of experiments carried out. |\n\n| ***Big\
    \ data architect*** || – construction of distributed computer architectures, data\
    \ integration, easing of data accessibility and optimization of performance; \
    \ \n\n– adaptation of IT architecture to processing needs (real time, for example).\
    \ |\n\n| ***Data visualization expert*** || – using data visualization tools to\
    \ implement renditions (dashboards, mappings, synthetic indicators, etc.) allowing\
    \ the understanding of information and decision-making. |\n\n| ***Data analyst***\
    \ || – organization, summarizing and translation of massive information. |\n\n\
    | ***Master data manager*** || – acquisition and optimization of the information\
    \ available within the company in order to enhance its optimal use (data related\
    \ to products, guarantees and services offered, client and contract data, regulations,\
    \ etc.);  \n\n– ensuring the legitimate use of data and their proper integration\
    \ into information systems. |\n\n| ***Data protection officer*** || – ensuring\
    \ the protection of personal data and supporting those responsible for processing\
    \ (cross-cutting function requiring computer, law and communication skills). |\n\
    \n### 5.3.2. *Development of partnerships between insurers and third-party companies*\n\
    \nRecent progress in technological development is such that insurance companies\
    \ may not be able to invest on all the technologies developed. Insurance companies\
    \ committed to their objective of securing the stakes associated with the risks\
    \ related to the lives of policyholders support the development of consumption\
    \ habits, in particular the development of collaborative economy.\n\nThus, some\
    \ insurers have established partnerships with different stakeholders (for example,\
    \ almost all car-pooling websites have a privileged partnership with an insurer),\
    \ set up seed capital or take part in round-table meetings organized by innovative\
    \ companies.\n\nBeyond the laboratories and the many experiments they implement\
    \ directly, these partnerships are an important lever to take advantage of the\
    \ evolutions in progress while limiting and diversifying the risk associated with\
    \ their investments.\n\n## 5.4. Development constraints\n\n### 5.4.1. *Constraints\
