  trans: '


    这种对大数据现象的定义提供了一个有趣的视角。它关注的是经典工具在处理如此大量数据时能力的丧失。这一观点出现在麦肯锡咨询公司 `McKinsey and Company`
    的一份报告中，该报告将大数据描述为其规模、分布、多样性和瞬态性需要新的架构和分析技术，而这些技术可以释放新的增值来源 [MAN 11]。当然，这种观点在今天（即写下这些文字的
    2016 年）占据主地位，而且一个通用的定义必须使用更通用、经得起时间考验的特征。然而，与许多新概念一样，关于该主题的作者有多少，定义就有多少。我们建议读者参考
    [WAR 13] 中关于这一主题的有趣讨论。要追溯大数据的起源，为什么不利用其最大的供应商之一——科技巨头 `Google` 呢？因此，我们借助 `Google
    Trends` 工具，提取了在该著名搜索引擎上对“大数据”一词的搜索次数的增长情况。图 1.1 显示，从 2010 年开始，使用该搜索引擎的人们的兴趣呈近指数级增长，这表明该术语还很年轻，可能反映了人们对突然无法控制的数据量的某种程度的惊讶，正如在
    2016 年仍然有效的 `Wikipedia` 定义所示的那样。然而，自 1998 年以来，文章已广泛使用这一概念来描述数据量和数据库向更大规模发展的未来趋势
    [FAN 13, DIE 12]。这篇被科学界广泛引用的参考文章于 2001 年，归于咨询公司 `Gartner` 的 `Doug Laney` [LAN
    01]。奇的是，该文档从未提到“大数据”这一术语，尽管它包含了著名的三个 Vs 特性表征：`volume`（量）、`velocity`（速度）和 `variety`（多样性）。“Volume”描述数据的大小，“Velocity”捕捉了数据生成、传输和必须处理的速度，而“Variety”则指的是这些新数据流的异质性。大多数文章认同基本的三个
    Vs（见 [FAN 13, FAN 14, CHE 14]），在此基础上增加了第四个 V —— `veracity`（真实性，归于 `IBM` [IBM 16]）以及第五个
    V —— `value`（价值）。“Veracity”一术语关注各种数据的可靠性。事实上，数据可能是错误的、不完整的或对于预期的分析而言太旧了。第五个 V
    传递了这样一个事实：数据必须首先为相关公司或整个社会创造价值。在这方面，正如某些作者提醒我们小量数据也可以创造价值（“小数据也可能带来大价值”，见 [GU
    14]），我们不应忘记公司通过采用适用于大数据的实践，最重要的是存储、处理和创建智能数据。也许我们应该讨论的是 `smart data` 而不是大数据？


    ## 1.3. 用五个 Vs 描述大数据


    在我们对大数据现象的初步评估中，应该注意到由研究公司 `Gartner` [LAN 01] 普及的 `volume`、`velocity` 和 `variety`
    的 3 Vs 框架现在已成为标准。因此，我们将从图 1.2 所示的这一经典方案开始，然后考虑其他的 Vs，这些维度很快将被证明是基础性的。


    ![Figure 1.1. Evolution of the interest in big data](img/fig1-1.jpg)


    **图 1.1。** *对大数据兴趣的演变*


    ![Figure 1.2. The three Vs](img/fig1.2.jpg)


    **图 1.2。** *三个 Vs*


    ### 1.3.1. Variety（多样性）


    与传统不同，我们将从关注 `variety`（多样性）而不是 `volume`（量）开始。这里指的是各种数据类型：


    - 文本

    - 消息

    - 通话

    - 照片

    - 位置

    - 音频

    - 视频

    - 社交状态

    - 录音


    数据的爆炸（特别是在互联网方面）带来了数据的多样性。这是这些新数据流异质性质的多样性。今天，大多数数据是非结构化的。


    ### 1.3.2. Volume（量）


    如果你让一群人定义大数据，大多数人会提到 `volume`（量）或数量。数据使用的爆炸（特别是在搜索方面）导致了单位的不可阻挡的增长：千字节（gigabytes）、太字节（terabytes）、拍字节（petabytes）、艾字节（exabytes），甚至泽字节（zettabytes，一个泽字节是
    $10^{21}$ 字节！）。


    图 1.3 显示了使用该搜索引擎的人们的兴趣呈近指数级增长。


    **图 1.3。** *互联网在使用在短短几年也发生了爆炸*


    #### 表 1.1. Google 统计 [STA 16]


    | 年份 | 年度搜索次数 | 日均搜索次数 |

    | :--- | :--- | :--- |

    | 2014 | 2,095,100,000 | 5,740,000 |

    | 2013 | 2,161,530,000 | 5,992,000 |

    | 2012 | 1,873,910,000 | 5,134,000 |

    | 2011 | 1,722,070,000 | 4,717,000 |

    | 2010 | 1,324,670,000 | 3,627,000 |

    | 2009 | 953,700,000 | 2,610,000 |

    | 2008 | 637,200,000 | 1,745,000 |

    | 2007 | 438,000,000 | 1,200,000 |

    | 2000 | 22,000,000,000 | 60,000 |

    | 1998 | 3,600,000 | 9,800 |


