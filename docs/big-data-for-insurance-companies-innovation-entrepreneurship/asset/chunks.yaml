    \ 1) vector of the data space ![images](images/capx.jpg)is randomly chosen.\n\n\
    The “competition phase” then appoints the winning unit:\n\n\\[3.35\\]![image](images/eq3-35.jpg)\n\
    \nIn the case where several units minimize this distance, one rule is agreed upon,\
    \ for example, the first index *i* for the lexicographic order on ![images](images/upz.jpg)*^d*.\n\
    \nThe “cooperation phase” modifies the *W[i]* vectors:\n\n\\[3.36\\]![image](images/eq3-36.jpg)\n\
    \nwhere Λ*[t]* is a neighborhood function, which can be time dependent, and *ε[t]*\
