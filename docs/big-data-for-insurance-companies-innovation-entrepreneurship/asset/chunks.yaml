  trans: "\n\n为了简化起见，假设所有基础预测器的理论方差为 `σ`²，且通过自助法（bootstrap）构建的两个基础预测器的相关系数为 `ρ`，那么很容易看出，通过\
    \ bagging 方法得到的预测器方差为 ![image](img/i0068-06.jpg)。因此，方差似乎随着使用的基础模型数量 `B` 的增加而减少，而且基础模型之间的相关性量化了聚合过程的增益：基础模型的相关性越低（|`ρ`\
    \ 越小），最终模型的方差就越小。这为选取对样本敏感的基础模型（如决策树或神经网络）提供了依据：否则，基础模型之间将强相关，将它们聚合将不会产生任何改进。\n\
    \nBagging 的编程非常简单。有一个 R 语言包 `ipred`，它提供了该方法的有效实现。\n\n### 3.5.2 随机森林\n\n在 CART\
    \ 模型的情况下，Breiman [BRE 01] 引入了随机化对 bagging 进行了改进。其目标是通过在选择不同基础模型所使用的变量时引入随机性，降低基础模型之间的相关性。我们在上一节中已经看到了其价值：使用相关性较低的基础模型有助于减少聚合所获得的预测器方差。为此，Breiman\
    \ 提议在构建树的每个阶段，从 `p` 个解释变量中随机选择 `m` 个变量，并仅考虑这些变量来确定相应的划分点。请注意学习集 `L[n]` = {(`x[i]`,\
    \ `y[i]`) ∈ ![image](img/upr.jpg)^p × ![images](img/capg.jpg), `i` = 1,…`,`n`*}，其中在回归情况下\
    \ ![images](img/capg.jpg)= ![image](img/upr.jpg)，在分类情况下 ![images](img/capg.jpg)=\
    \ 1,…k*}。该算法如下：\n\n随机森林算法：\n\n1. 1) 选择 `B`, `m` ∈ ![images](img/upn.jpg)^*。\n\
    2. 2) 对于 `b` = 1 到 `B`:\n    * – 在 `L[n]` 中抽取一个自助样本 `L[n,b]`；\n    * – 使用样本 `L[n,b]`\
    \ 构建一个 CART 树，定义一个预测器 ![image](img/tetacap.jpg)b。树的每一次划分都是通过限制在 `q` 个解释变量中随机抽取的\
    \ `m` 个变量集中决定的，不同划分之间的抽取是独立的。\n    * 结束循环\n3. 3) 定义 ![image](img/i0069-01.jpg)(或\
    \ ![image](img/tetacap.jpg)(.) = `argmax [j]` {`b` : ![image](img/tetacap.jpg)(.)\
    \ = `j`})\n\n当解释变量 `p` 的数量显著时，这种方法的价值已经得到证明（例如参见 [08]）。随机抽取的变量数 `m` 可以作为一个参数。经典的选择是\
    \ `m` = ![image](img/rp.jpg)（分类中）和 `m` = `p*/3`（回归中）。这是 R `randomforest` 库中的默认选择。与\
    \ bagging 类似，袋外误差（out-of-bag error）用于控制 `B` 的值，并可能优化 `m` 的值。\n\n自 2001 年发表以来，由于其非常优秀的预测性能（例如参见\
    \ Fernandez-Delgado 等人 [14] 和 Scornet 的 [16a]），该方法已被广泛研究和使用。从理论角度来看，Scornet 在\
    \ 2015 年证明了难以获得的收敛性。另外注意 Biau 等人最近发表的文章 [16b]，该文章建立了随机森林与神经网络之间有趣的联系。\n\n### 3.5.3\
    \ Boosting\n\nBoosting 方法由 Freund 和 Schapire 在 1996 年引入 [FRE 96]，它与 bagging 有一个共同点，即使用基础模型通过聚合来推导出最终预测器。然而，本质区别在于\
    \ boosting 是迭代且自适应地构建基础模型，以便逐渐修正错误。最初的想法是提高那些性能优于随机分类器的二分类变量预测模型。这产生了 `AdaBoost`\
    \ 算法 [FRE 97]，它是最流行的 boosting 算法。记学习集 `L[n]` = {(`x[i]`, `y[i]`) ∈ ![image](img/upr.jpg)^p\
    \ × {-1,1}, `i` = 1, …,`,`n`*}。因此，算法如下：\n\nAdaBoost 算法：\n\n1. 1) 选择 `M` ∈ ![images](img/upn.jpg)^*。\n\
    2. 2) 初始化权重：`w` = (`w[i]` = 1/*n*,`i` = 1, …,n)。\n3. 3) 对于 `m` = 1 到 `M`:\n  \
    \  * – 通过权重 `w[1]`, …,`w[n]` 调整加权 `L[n]` 的基础模型 ![image](img/tetacap.jpg)m；\n \
    \   * – 计算模型 ![image](img/tetacap.jpg)m 在 `L[n]` 上的表面误差率：![image](img/imm2.jpg)\n\
    \    * – 计算：`α[m]` = `log((1 − ε[m])/ε[m])`；\n    * – 修改权重：![image](img/i0071-01.jpg)\n\
