    These examples are not exhaustive, and the wealth and diversity of the available
    financial information and the ability to link the consideration of ALM constraints
    with the latter should enhance the development of the use of data science for
    investment management purposes.


    ### 5.2.7. Reinsurance


    Traditionally, insurers wishing to market new guarantees can rely on the support
    of reinsurance stakeholders. The latter, with data from different insurers and
    significant resources, can develop a refined vision of risk compared to what would
    be that of non-supported insurers wishing to enter a new market or under the cover
    of emerging risks (cyber risk, for example).


    There should be renewed interest in this relatively widespread approach regarding
    development of new guarantees given the new ability of reinsurers to match the
    data of different insurers with each other and to match all of these data with
    external data, which help to refine the understanding of the influence of risk
    factors in the triggering of claims.


    Thus, reinsurers should assert their position as support to insurers in the development
    and commercialization of new types of guarantees and products.


    NOTE.– Data science allows the optimization of available data to be used for a
    wide variety of purposes, particularly in the identification of risk factors and
    the understanding of behaviors. Given the large number of potential use cases,
    their identification and prioritization must be in the hands of the trades (marketing/distribution,
    actuarial product, risk management, etc.) so as to maximize the added-value for
    the insurance company.


    ### 5.3. New professions and evolution of induced organizations for insurance
    companies


    #### 5.3.1. New professions related to data management, processing and valuation


    Developing the valuation of data and data science tends to generate new needs
    for insurers and new professions:


    Although several companies have in recent years implemented a chief digital officer
    function to support the digitalization of their activities, the latter logically
    will eventually disappear once the digital culture has been sufficiently implanted
    within the different business departments.


    The success of the chief digital officer results in the disappearance of this
    function.


    **Table 5.3.** Main data professions (the list is not necessarily exhaustive but
    the name may vary according to organizations)


    | **Functions** || **Prerogatives** |


    | --- | --- |

    | **Chief data officer** || – coordination of data collection (identification
    of data relevant to the company, financing of action plans, purchase of software
    packages or data, etc.); – organization of data sharing with the different departments,
    in particular the business departments; – production of business-oriented recommendations;
    – ensuring the observance of ethics as regards data use. |

    | **Data scientist** || – contribution to the assessment of business needs; –
    identification, cleaning and preparation of internal and external data, structured
    or unstructured; – implementation of algorithms or assemblies of machine learning
    algorithms; – formulation of hypotheses to be tested via the developed algorithms;
    – supporting the industrialization of experiments carried out. |

    | **Big data architect** || – construction of distributed computer architectures,
    data integration, easing of data accessibility and optimization of performance;
    – adaptation of IT architecture to processing needs (real time, for example).
    |

    | **Data visualization expert** || – using data visualization tools to implement
    renditions (dashboards, mappings, synthetic indicators, etc.) allowing the understanding
    of information and decision-making. |

    | **Data analyst** || – organization, summarizing and translation of massive information.
    |

    | **Master data manager** || – acquisition and optimization of the information
    available within the company in order to enhance its optimal use (data related
    to products, guarantees and services offered, client and contract data, regulations,
    etc.); – ensuring the legitimate use of data and their proper integration into
    information systems. |

    | **Data protection officer** || – ensuring the protection of personal data and
    supporting those responsible for processing (cross-cutting function requiring
    computer, law and communication skills). |


    #### 5.3.2. Development of partnerships between insurers and third-party companies


    Recent progress in technological development is such that insurance companies
    may not be able to invest on all the technologies developed. Insurance companies
    committed to their objective of securing the stakes associated with the risks
    related to the lives of policyholders support the development of consumption habits,
    in particular the development of collaborative economy.


    Thus, some insurers have established partnerships with different stakeholders
    (for example, almost all car-pooling websites have a privileged partnership with
    an insurer), set up seed capital or take part in round-table meetings organized
    by innovative companies.


    Beyond the laboratories and the many experiments they implement directly, these
    partnerships are an important lever to take advantage of the evolutions in progress
    while limiting and diversifying the risk associated with their investments.


    ### 5.4. Development constraints


    #### 5.4.1. Constraints specific to the insurance industry


    ##### 5.4.1.1. Constraints related to the regulation of the insurance industry


    The implementation of Solvency II, although having brought substantial progress
    and market standardization in terms of risk management, constitutes an impediment
    to the adoption of big data because of the constraints they impose regarding the
    use of data.


    Pillars 1 and 3 induce strong constraints on audit trails and data used for behavioral
    modeling purposes.


    Within the framework of the ORSA, on the other hand, greater use of big data could
    be envisaged such as to accurately represent the risk profile of insurance or
    reinsurance companies by resorting to behavior laws established through machine
    learning algorithms that are more effective though less auditable than traditional
    GLMs. In this context, the differential of laws used would have to be taken into
    account in the ORSA third assessment: deviation of the risk profile.


    ##### 5.4.1.2. Constraints related to the French CNIL


    On November 12 2014, the Commission Nationale de l’Informatique et des Libertés
    (National Commission on Information Technologies and Freedom) (CNIL) and all the
    professional federations concerned presented the compliance package for the insurance
    industry. A dedicated “compliance club” has also been created to ensure that remains
    operational over time.


    The compliance package is a tool for regularizing the use of personal data, which
    covers:


    * – a working method allowing the collaboration of insurance and public actors
    as well as potentially related users and the CNIL such as to bring out good practices
    and respond to issues specific to the insurance industry;


    * – a regulation method for the CNIL aimed at establishing a sectoral reference
    framework for the processing of personal data around rules and good practices,
    expressed through legal means (simplified standards, single authorizations, recommendations,
    etc.) and operational procedures as well as organizational processes.


    Overall, it aims at providing legal protection to professionals by giving tangible
    incentives on how to comply with specific texts and procedures and to simplify
    formalities as far as current law permits, using exemptions, simplified standards
    and single authorizations.


    The insurance package integrates various practical sheets on specific topics:


    **Table 5.4.** Practical sheets falling within the CNIL insurance package


    | **Practical sheets** || **Topic** |


