    # 2 From Conventional Data Analysis Methods to Big Data Analytics


    ## 2.1. From data analysis to data mining: exploring and predicting


    Data analysis here mainly means descriptive and exploratory methods, also known
    as unsupervised. The objective is to describe as well as structure a set of data
    that can be represented in the form of a rectangular table crossing *n* statistical
    units and *p* variables. We generally consider *n* observations as points in *p*
    dimensional vector space, which, if provided with a distance, is a Euclidean space.
    Numerical variables are vectors of an *n* dimensional space. Data analysis methods
    are essentially dimension reduction methods that are divided into two categories:

