- raw: "In this algorithm, the loss function *Q* can be quadratic, exponential or\
    \ the absolute value, the usual choice in regression being the quadratic function.\
    \ In the last step, the use of the median eliminates the influence of overly atypical\
    \ predictors \\[GEY 06\\].\n\nIn 1999, Breiman proposed to consider boosting as\
    \ a global optimization algorithm. According to this idea, Hastie *et al*. showed\
    \ that the binary case can be seen as an approximation method by a stepwise constructed\
    \ additive model, the algorithm minimizing an exponential loss function defined\
    \ on the learning base (see \\[HAS 09\\]). This principle was developed by Friedman\
    \ under the acronym MART (multiple additive regression trees) and then under the\
    \ acronym GBM (gradient boosting machine) \\[FRI 01\\]. As for the AdaBoost algorithm,\
    \ it is an issue of iteratively constructing a series of models such that the\
    \ successive models improve and the final aggregation provides a good solution.\
    \ The contribution of the GBM is that the successive modifications are determined\
    \ by applying a gradient optimization method on a loss function *Q* to be minimized\
    \ (see \\[FRI 01\\] or \\[HAS 09\\] for details).\n\nGBM algorithm – Boosting\
    \ by functional gradient descent:\n\n1.  1) Choose ∈ ![images](images/upn.jpg)^∗,\
    \ *λ* ∈\\]0,1\\].\n\n2.  2) Define: ![image](images/tetacap.jpg)[0](.) = *argmin*[*c*]\
    \ ![image](images/i0073-01.jpg)\n\n3.  3) For *m = 1 to M:*\n\n    *   \\- calculate\
    \ the opposite of the gradient ![images](images/i0073-02.jpg)at the points (*z[i]*)\
    \ = ![image](images/tetacap.jpg)[*m−*1](*x[i]*). Let us note these values (*u*[1],\
    \ … ,*u[n]*).\n\n    *   \\- adjust a basic model ![images](images/psicirc.jpg)*[m]*(.)\
    \ on {(*x*[1], *u*[1]), … , (*x[n]*, *u[n]*)};\n\n    *   \\- deduce a new model\
    \ ![image](images/tetacap.jpg)*[m]*(.) = ![image](images/tetacap.jpg)[*m−*1](.)\
    \ + *λ* ![images](images/psicirc.jpg)*[m]*(.).\n\n    End For\n\n4.  4) The output\
    \ is the model ![image](images/tetacap.jpg)*[M]*(.).\n\nThe choice of the parameter\
    \ *λ* is relatively insignificant. It is often recommended to take it in the order\
    \ of 0.1. This choice is related to that of the optimal number of iterations:\
    \ a small *λ* value will require a large number of iterations and vice versa.\n\
    \nThe boosting algorithm is implemented in R in the *gbm* and *h2o packages*.\n\
    \n### 3.5.4. *Stacking*\n\nStacking (also called blending) is an approach that\
    \ involves using as input to a statistical learning algorithm the output values\
    \ given in a first step by different models. This is therefore a metamodel, which\
    \ aggregates basic models in a more complex way than does the bagging method.\
    \ The original idea was developed by Wolpert \\[WOL 92\\], and this method was\
    \ then adopted in many applications. A particular case is where the metamodel\
    \ is a linear model, whereas the basic models are nonlinear, such as neural networks\
    \ or trees (see, for example, \\[BRE 96a\\]). In classification, a logistic regression\
    \ model can be used as a metamodel to combine the predictions of basic models\
    \ of different types (logistic regression, decision tree, neural network, etc.).\
    \ This method is therefore relatively old but has proved very efficient in solving\
    \ complex problems, such as the competition proposed on the Kaggle website (see,\
    \ for example, \\[SIL 01\\] regarding the Netflix Prize).\n\nThe stacking method\
    \ is implemented in the R *h2oEnsemble* package.\n\n## 3.6. Kohonen unsupervised\
    \ classification algorithm\n\nThe analysis of multidimensional data typically\
    \ focuses on the study of *n* individuals determined by p variables (quantitative\
    \ or qualitative): an individual is an element of a *p*\\-dimensional space.\n\
    \nThe factorial methods (ACP and derivatives), which are in fact methods of projection\
    \ of the linear algebra, allow graphical “representations” of the data in dimensions\
    \ 1, 2 or 3. It is however difficult to construct proximity classes from projections\
    \ if the individuals are not represented without loss of information in a dimensional\
    \ space ≤ 3. Two individuals whose projections are close are not always close\
    \ in the initial *p*\\-dimensional space.\n\nOn the other hand, the following\
    \ two families of “classification” methods can be distinguished:\n\n*   – hierarchical\
    \ classification: iterative aggregation process of the nearest-neighbor classes.\
    \ Initially, each individual is a class. We consider the *n* classes and group\
    \ the two closest classes (for a chosen distance) to form a new class (of two\
    \ individuals). And we iterate on the *n* − 1 obtained classes until a single\
    \ class is obtained. This gives rise to a representation by a tree. We can then\
    \ choose the number of classes that seems better adapted by selecting a grouping\
    \ level;\n\n*   – non-hierarchical classification: the number of classes is fixed\
    \ *a priori* and one class is attributed to each individual by an algorithm converging\
    \ towards a distribution minimizing the intra-class inertia (that is, the sums\
    \ of distances of each individual of a class to the center of the class). A classic\
    \ example is the moving average algorithm.\n\nFor these classification methods,\
    \ two points of the same class are close in the initial space, but how can the\
    \ classes be globally represented while preserving the initial topology of the\
    \ data? There is no notion of neighborhood of classes.\n\nKohonen algorithm attempts\
    \ to match representation and classification. In 1982, Teuvo Kohonen \\[KOH 82,\
    \ KOH 96\\] proposed an algorithm whose main function is to match the elements\
    \ of inputs space with ordinate units on a map giving a graphic representation\
    \ (of dimension 1, 2 or 3), where each unit is surrounded by its neighbors (for\
    \ a predefined distance). The result is a function of the input space to the set\
    \ of units, such that the images of two neighboring elements in the sense of a\
    \ certain distance in the input space are the same unit or neighboring units on\
    \ the map.\n\nEven if the algorithm proposed by Kohonen may only be considered\
    \ as an unsupervised classification algorithm, it is initially related to neural\
    \ modeling. It was conceived in 1982 as a modeling of the automatic formation\
    \ of maps in the sensory areas of the cortex, although since then the mathematical\
    \ study of the algorithm and its applications in particular in data analysis have\
    \ distanced it from its original biological framework. For example, let us consider\
    \ the nerve connections of retinal cells towards the cerebral cortex processing\
    \ visual information (the tectum). If we imagine the retina as a grid of two dimensions,\
    \ an important fact is that the topology of the retina is preserved by the set\
    \ of connections in the sense that two close cells on the retina are connected\
    \ to two close cells in the cortex. There is no reason for this to happen spontaneously\
    \ at birth, and we may assume that this phenomenon is due to self-organization\
    \ and selection process governed by the spontaneous activities of cerebral neurons.\
    \ It is precisely this idea that T. Kohonen wanted to adapt when he defined his\
    \ self-organization algorithm, adding an important concept to previous connectionist\
    \ models that he knew very well (associative memory models of D. Gabor, J.  Hopfield,\
    \ etc.). From an algorithmic point of view, the self-organization process is carried\
    \ out by a local updating of connections according to complementary rules of competition\
    \ and cooperation, at each presentation of a prototype.\n\n### 3.6.1. *Notations\
    \ and definition of the model*\n\nThe data space is a convex bounded subset ![images](images/capx.jpg)⊂\
    \ ![image](images/upr.jpg)*^p*, provided with the Euclidean distance. We consider\
    \ a sample (*x*(1), … , *x*(*t*)) from successive observations in ![images](images/capx.jpg)(statistical\
    \ approach) or realizations of a sequence of independent random variables of the\
    \ same probability law *μ* with values in ![images](images/capx.jpg)(probabilistic\
    \ approach).\n\nThe network is formed of *n* units (or neurons) arranged according\
    \ to a determined topology:\n\n*   – with *d* = 1, 2 or 3 dimensions: a line,\
    \ a square or a cube;"
