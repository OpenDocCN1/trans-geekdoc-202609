    \ the absolute value, the usual choice in regression being the quadratic function.\
    \ In the last step, the use of the median eliminates the influence of overly atypical\
    \ predictors [GEY 06].\n\nIn 1999, Breiman proposed to consider boosting as a\
    \ global optimization algorithm. According to this idea, Hastie *et al.* showed\
    \ that the binary case can be seen as an approximation method by a stepwise constructed\
    \ additive model, the algorithm minimizing an exponential loss function defined\
    \ on the learning base (see [HAS 09]). This principle was developed by Friedman\
    \ under the acronym `MART` (multiple additive regression trees) and then under\
    \ the acronym `GBM` (gradient boosting machine) [FRI 01]. As for the `AdaBoost`\
    \ algorithm, it is an issue of iteratively constructing a series of models such\
    \ that the successive models improve and the final aggregation provides a good\
    \ solution. The contribution of the `GBM` is that the successive modifications\
    \ are determined by applying a gradient optimization method on a loss function\
    \ `Q` to be minimized (see [FRI 01] or [HAS 09] for details).\n\n## GBM algorithm\
    \ – Boosting by functional gradient descent\n\n1. Choose `∈` ![images](images/upn.jpg)^∗,\
    \ `λ` ∈]0,1].\n2. Define: ![image](images/tetacap.jpg)[0](.) = `argmin[*c*]` ![image](images/i0073-01.jpg)\n\
    3. For `m = 1 to M:`\n    - calculate the opposite of the gradient ![images](images/i0073-02.jpg)at\
