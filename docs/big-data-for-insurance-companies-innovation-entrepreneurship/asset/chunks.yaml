  trans: '


    -   一方面，因子方法（针对数值变量的主成分分析、针对分类变量的对应分析）会产生新的数值变量或原始变量的组合，允许在低维空间中表示。在数学上，这些是数据表奇异值分解的变体；

    -   另一方面，无监督分类方法或聚类将观测值或变量分为同类组。主要算法是层次类的（通过连续聚类单元逐步构建类别）或通过 k-means 进行直接划分搜索。


    许多工作致力于诸如 [SAP 11] 等先有方法。


    然而，数据分析也是一种态度，其在于通过对生成机制不加任何（或极少）`a priori` 先验假设来实现“让数据说话”。让我们回想一下 [BEN 72] 中述的原则：“模型必须遵循数据，而不是相反”。数据分析在
    20 世纪 60 年代和 70 年代是对形式化滥用的反应而发展起来，参见 [ANS 67] 关于约翰·图基（John Tukey）的内容：“他似乎将统计学与通常被称为数学统计学的怪异现象等同起来，并认为必要用数据分析来取代统计学。”


    数据挖掘是一于 20 世纪 90 年代统计学与信息技术（数据库、人工智能、机器学习等）交叉领域的运动，也旨在发现大型数据集中的结构，并促进新工具（如关联规则）。数据挖掘的隐喻意味着数据山下隐藏着宝藏或金矿，可以通过专门工具被发现。数据挖掘是知识发现过程中的一步，涉及应用数据分析算法。[HAN
    99] 将其定义为：“我将数据挖掘定义在大型数据集中发现有趣的、意外或有价值的结构。”数据分析分析为其他目的而收集的数据：它通常是对数据库的二次分析，旨在管理个人数据，且不担心如何有效地收集数据（如问卷调查、实验设计）。


    数据挖掘还寻求表示为响应变量 `Y` 的预测模型，但其视角与传统建模完全不同。模型无非是一个算法，而不是生成数据的机制的表示。我们随后通过探索一组线性或非线性算法（无论显式或隐式）来选择最优算法，即能提供最准确预测且不落入过拟合陷阱的算法。我们区分了
    `Y` 为定量的回归方法，以及 `Y` 为类别的（通常有两种模态）有监督分类方法（也称为判别方法）。海量数据处理强化了数据挖掘中已经存在的趋势。


    ## 2.2. 过时方法


    推断统计是在数据稀缺的背景下发展的，以至于超过 30 个单元的样本就被认为是大型的！数据的规模从根本上改变了统计学实践。以下是一些例子：


    -   任何与理论值的偏差都变成了“显著的”。因此，在百万次观测之间计算出的两个变量之间的相关系数 0.01（读者很容易验证甚至更低）将被宣布与零有显著差异。这是一个有用的结果吗？

    -   模型参数的置信区间变为零宽度，因为后者通常处于 ![image](img/imm.jpg)。这意味着模型将被确定地获知吗？


    通常情况下，不再存在一种适用于大量数据的生成模型，正如那些成为众多文献主题的惩罚似然模型选择规则一样。


    需要注意的是，以下类型标准：


    [2.1] ![image](img/eq2-1.jpg)


    和


    [2.2]![image](img/eq2-2.jpg)


    在比较预测算法时（如决策树和下一章讨论的更复杂方法）是无效的，因为在这些情况下，似然和参数数量都是未知的，`k` 是参数数量，`L` 是似然。注意，正如常见所示，同时使用
    `AIC` 和 `BIC` 是不符合逻辑的，因为它们来自两个不兼容的理论：第一个是 Kullback–Leibler 信息，第二个是贝叶斯先等概率模型选择。


    大量数据可以作为支持 `BIC` 渐近性质的理由（如果它可以计算的话），因为已经证明当观测数趋于无穷时，选择真实模型的概率趋于 1。然而，真实模型必须是研究家族的一部分，而且这种“真实”模型的存在是虚构的：模型（从生成的意义上说）仅仅是现实的简化表示。三十年前，远在我们谈论大数据之前，乔治·鲍克斯（George
    Box）就宣布：“所有模型都是错误的，但有些是有用的。”


    所谓传统统计滥用被广义线性模型共同发明者约翰·内尔德（John Nelder）[NEL 85] 在这篇 1985 年讨论 Chatfield 文章中严厉指责：“统计学与科学技术密切相关，很少有数学家有经验或理解其中任何一种方法。我相信这正是各种统计课程中对显著性检验进行怪异强调背后的原因；建立了一套由功效、一致最强检验、一致最强无偏检验等概念构成的数学体系等等，并将其教给人们，这些人们如果离开时没有学到其他概念，也会记得统计学是关于显著差异的[]。构建他们统计学课程所依据的这套体系往往比无关更糟糕，它在检查数据和做出推断的重要性方面具有误导性。”


    ## 2.3. 理解还是预测？


    学习算法的使用导致了“黑箱”方法，这些方法从经验上证明了为了预测并不非要理解。这一事实令科学家感到不安，但被学习理论者明确主张，例如 [VAP 06]，他写道：“有时通过刻意避免复制真实机制获得更好的模型。”


    [BRE 01] 在其于《统计科学》上名为“统计建模：两种文化”的著名文章证实了这一点：“现代统计思维在统计模型与世界之间有着明确的区分。数据底层的实际机制被认为是未知的。统计模型不需要复制这些机制来模拟可观测数据。”因此，Breiman
    对比了两种从数据得出结论的建模文化：一种假定数据是由给定的随机模型生成的，另一种则将生成机制视为未知并使用算法。


    [DON 15] 最近通过讨论生成建模文化和预测建模文化延续了这一讨论。用于理解的模型与用于预测的模型之间的区别在 [SAP 08] 和 [SHM 10]
    中也是明确的。


    ## 2.4. 预测模型的验证


