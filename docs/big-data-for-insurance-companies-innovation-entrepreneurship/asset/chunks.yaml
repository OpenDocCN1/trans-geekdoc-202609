- raw: 'According to an annual report on the Internet of Things \[GSM 15\], by the
    end of 2015, there were 7.2 million mobile connections, with projections for smartphones
    alone reaching more than 7 million in 2019. This expansive volume of data is what
    brought forth the big data phenomenon. With current data stores unable to absorb
    such growth in data volumes, companies, engineers and researchers have had to
    create new solutions, notably offering distributed storage and processing of these
    masses of data (see [section 1.4](#chapter01.xhtml#sec1-4)). The places that store
    this data, the famous data centers, also raise significant questions in terms
    of energetic consumption. One report highlights the fact that data centers handling
    American data consumed 91 billion kWh of electricity in 2013, equivalent to the
    annual output of 34 large coal-fired power plants \[DEL 14\]. This figure is likely
    to reach 140 billion in 2020, equivalent to the annual output of 50 power plants,
    costing the American population $13 billion per year in electricity bills. If
    we add to this the emission of 100 million metric tons of CO[2] per year, it is
    easy to see why large organizations have very quickly started taking this problem
    seriously, as demonstrated by the frequent installation of data centers in cold
    regions around the world, with ingenious systems for recycling natural energy
    \[EUD 16\].


    ### 1.3.3. *Velocity*


    The last of the three historic Vs, the V for *velocity*, represents what would
    probably more naturally be called *speed*. It also covers multiple components,
    and it is intrinsic to the big data phenomenon. This is clear from the figures
    above regarding the development of the concept and volume of data, like a film
    in fast-forward. Speed can refer to the speed at which the data are generated,
    the speed at which they are transmitted and processed, and also the speed at which
    they can change form, provide value and, of course, disappear. Today, we must
    confront large waves of masses of data that must be processed in real time. This
    online-processed data allow decision makers to make strategic choices that they
    would not have even been aware of in the past.


    ### 1.3.4. *Towards the five Vs: veracity and value*


    An enriched definition of big data quickly took shape with the appearance of a
    fourth element, the V of veracity, attributed to IBM \[IBM 16\]. The word veracity
    brings us back to the quality of the data, a vital property for all data search
    processes. Again, this concept covers different aspects, such as imprecision,
    incompleteness, inconsistency and uncertainty. According to IBM, poor data quality
    costs on average $3.1 trillion per year. The firm adds that 27% of questionnaire
    respondents are not sure of the information that they input and that one in three
    decision makers have doubts concerning the data they base their decision on. Indeed,
    the variety of data ﬂows, which are often unstructured, complicates the process
    of certifying data. This brings to mind, for example, the quality of data on the
    social network Twitter, whose imposed 140 character format does not lend itself
    to precise prose that can be easily identified by automatic natural language processing
    tools. Certifying data is a prerequisite for creating value, which constitutes
    the fifth V that is well established in modern practices. The capacity to store,
    understand and analyze these new waves of high-volume, high-velocity, varied data,
    and to ensure reliability while integrating them into a *business intelligence*
    ecosystem, will undoubtedly allow all companies to put in place new decision advice
    modules (for example, predictive analysis) with high added value. One striking
    example concerns American sport and ticket sales that are currently based on dynamic
    pricing methods enhanced by historical and real-time data. Like many other American
    sports teams, the San Francisco Giants baseball team has thus adapted its match
    ticketing system to make use of big data. They engaged the services of the company
    QCUE to set up algorithmic trading techniques inspired by airline companies. The
    ticket prices are updated in real time as a function of supply and demand. In
    particular, historical data on the quality of matches and attendances are used
    to adjust ticket prices to optimize seat/stadium occupation and the company’s
    profits. On their website, QCUE report potential profit growth of up to 46% compared
    to the previous system.


    Globally, big data represents a lucrative business. The McKinsey Institute has
    suggested that even the simple use of client location data could yield a potential
    annual consumer surplus of $600 billion \[MAN 11\]. The consulting group Wikibon
    estimates that the big data market, encompassing hardware, software and related
    services, will grow from $19.6 billion in 2013 to $84 billion in 2026 \[KEL 15\].


    ### 1.3.5. *Other possible Vs*


    Skimming through the immense number of articles dedicated to the subject, the
    reader soon realizes that each author is tempted to add their own personal V,
    each making their own contribution to the various aspects of big data. Thus, the
    terms variability and validity, which relate directly back to the previous concepts
    of variety and veracity, can also be added to the list. The word variability focuses
    on the versatile (yet another V!) nature of data, which can change over time,
    whereas validity is a more explicit reference to a certification process of classical
    data. Finally, without degenerating into unhelpful one-upmanship, it seems worthwhile
    to mention one last V, for visualization. The V of visibility is sometimes tied
    in with this. Big data, with all of its characteristics as described so far, calls
    for new forms of visualization to make the data understandable and presentable
    for decision makers. This can range from simple reporting tools offering an overarching
    view of the main data characteristics to more advanced methods combining visualization
    and data analysis. For example, visualization techniques with graphs demonstrating
    the complex relationships between contributors on social networks, clients, communities
    or naturally forming groups, are now commonplace.


    ## 1.4. Architecture


    The era of big data is persuading enterprises of all sizes to implement processes
    to help make decisions based on data analysis. Predicting what will satisfy a
    client, optimizing processes and, more generally, generating value from data have
    now become essential for any business that wants to remain competitive. Although
    these have always been central challenges for insurers, they are no less affected
    by the more complex environment of the data economy. Growing volumes of data,
    of various different natures, with variable lifetimes and of disparate quality,
    which we want to interrogate in real time, are inﬂuencing the tools used, which
    continue to evolve.


    We will see in this section that the scientific and technical environment is becoming
    richer and more complex by the day. New algorithms are dreamt up to address problems,
    and new tools are created to test and apply them. In this context, the main task
    for companies is to incorporate these innovations alongside existing tools in
    order to integrate new predictive data analysis processes with existing business
    procedures. This takes time and expertise, for the project to be defined, to get
    it running and then to maintain and update it.


    ### 1.4.1. *An increasingly complex technical ecosystem*'
