  trans: '

    根据一份物联网年度报告 [GSM 15]，到 2015 年底，全球已有 720 万个移动连接，预计仅智能手机的数量在 2019 年就会超过 700 万个。这种海量数据催生了大数据现象。由于目前的数据存储无法吸收这种数据量的增长，公司、工程师和研究人员不得不创建新的解决方案，特别是为这些海量数据提供分布式存储和处理（参见第
    1.4 节）。存储这些数据的场所——著名的数据中心，在能源消耗方面引发了重大问题。一份报告指出，2013 年处理美国数据的数据中心消耗了 910 亿千度电，相当于
    34 座大型燃煤发电厂的年发电量 [DEL 14]。这一数字在 2020 年可能会达到 1400 亿千度，相当于 50 座发电厂的年发电量，每年给美国人带来
    130 亿美元的电费支出。如果再加上每年 1 亿公吨 CO[2]的排放，就可以看出为什么大型机构已经迅速开始重视这个问题，正如世界范围内寒冷地区频繁建立数据中心，并采用精的自然能源回收系统一样
    [EUD 16]。


    ### 1.3.3. 速度 (Velocity)


    三个历史 V 中的最后一个，即速度（Velocity），代表了可能更自然被称为“速率”的概念。它还涵盖了多个组成部分，大数据现象的内在属性。从上述关于数据概念发展和规模的数字可以清楚地看到这一点，就像快进电影一样。速度可以指数据生成的速度、传输和处理的速度，以及它们改变形式、提供价值并当然消失的速度。今天，我们必须面对必须实时处理的海量数据浪。这些在线处理的数据让决策者能够做出在过去甚至无法察觉的战略选择。


    ### 1.3.4. 迈向五个 V：真实性与价值


    随着第四个元素——IBM 归的真实性（Veracity）V 的出现 [IBM 16]，大数据的一个更丰富的定义迅速成型。“真实性”一词将我们带回数据质量，这是所有数据搜索过程中至关重要的属性。同样，这一概念涵盖了不同方面，例如不精确、不完整、不一致和不确定性。根据
    IBM 的数据，糟糕的数据质量平均每年造成 3.1 万亿美元的损失。该公司补充说，27%的问卷调查者对他们输入的信息并不确定，三分之一的决策者对他们所依据的数据表示怀疑。事实上，数据流的多样性（这些通常是非结构化的）增加了数据认证的复杂性。这让人想到社交网络
    Twitter 上的数据质量，其强制的 140 字符格式并不利于生成被自动自然语言处理工具轻松识别的精确散文。数据认证是创造价值的前提，而价值（Value）构成了现代实践中确立的第五个
    V。即存储、理解和分析这些新出现的大容量、高速度、多样化数据浪潮的能力。


    ### 1.3.5. 其他可能的 V


    在快速浏览大量关于该主题的文章时，读者会很快发现，每位作者都想添加自己的 V，每个人都对列表做出自己的贡献。因此，可变性（Variability）和有效性（Validity）这两个直接关系之前多样性（Variety）和真实性（Veracity）的概念也可以加入列表。“可变性”一词关注数据的多功能（另一个
    V！）属性，这种属性会随时间而改变；而“有效性”则是对经典数据认证过程更明确的引用。最后，在不沦于毫无帮助的自说自话的情况下，提到最后一个 V 似乎是值得的，即可视化（Visualization）。可见性（Visibility）V
    有时与此联系在一起。大数据凭借其目前为止描述的所有特征，要求新的可视化形式，以便让决策者能够理解并直观地展示数据。其范围可以从提供主要特征概览的简单报告工具，到结合了可视化和数据分析的更先进的方法等。


    ## 1.4. 架构


    大数据时代正在说服各种规模的企业实施流程，以帮助基于数据分析做出决策。


    '
