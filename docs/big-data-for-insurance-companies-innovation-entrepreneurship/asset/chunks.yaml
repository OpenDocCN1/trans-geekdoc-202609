- raw: 'Will the desire for personalization call this principle into question? Is
    it selfish individualism on the part of clients? It would be the profession itself
    that would be threatened. Unless mutualization is done differently, big data gives
    clients an opportunity to carry it out outside of regulated and capitalized insurance
    companies.


    Clients’ new demand is pushing some insurers towards finer price segmentation.
    In compliance with regulations and ethics, the digital traces left by clients
    can allow insurers to better do their job and refine price classes in the same
    way as the current price classes without disruption. However, is this understandable
    for clients? Does this correspond to their demands? It should be accompanied by
    appropriate marketing segmentation, which could be finer than price segmentation.
    It is through marketing and communication with clients that insurers will be able
    to make a difference. In this improvement process that is not really disruptive,
    it is marketing segmentation that makes it possible to meet demand, and there,
    data contribution is essential for the insurer, as for all companies. Because
    marketing segmentation does not have to be justified in any way other than by
    its efficiency, it can benefit from all innovation possibilities brought by machine
    learning, by the contribution of external data – particularly with open data,
    data-driven learning, and even “black box” algorithms. Insurers can push the offers
    to the right client segments with the right arguments and the right associated
    services, without prices being different.


    Client data make it possible to follow their moments of life and to anticipate
    their needs (change of car or housing upon the birth of a child, for example).
    This enables them to be profiled for a specific purpose (always in compliance
    with regulations) and to better understand the type of relationship and services
    they want. For example, do they like receiving information alerts or advice on
    their smartphone or not?


    For clients who accept, a connected relationship via a bracelet or home automation
    objects for example, it can lead to reductions in prices or gifts, in a spirit
    of prevention as a reward for virtuous behavior.


    These practices have the disadvantage of being normative and not always based
    on scientifically relevant criteria. Why should one walk 10,000 steps a day? Why
    not 9,000 or 12,000? And if I only walk 5,000 steps a day, but I swim 10 laps,
    am I not a “good” risk?


    In effect, are these changes, which are based on client relationship and not prices,
    sufficient to meet expectations?


    We see ideas of price differentiation emerging here and there, pushed to extremes
    that would undermine the current economic model and would probably lead to unbearable
    prices for some clients, thus excluding them from the insurance system, with serious
    consequences for the community.


    Market dynamics would change the portfolios in a way that is difficult to predict
    since it involves multi-actor games. An insurer implementing very low prices for
    the supposed “good” risks and high prices for the supposed “bad” risks, may lose
    a good part of their portfolio and unbalance their accounts by a decrease in revenue
    that has not been netted because their staff, management and premises’ fixed costs
    are being contained.


    The overall solvency of the insurance market could be undermined by such practices.


    Moreover, a refining of prices, which could go as far as individualization, would
    have another “perverse” technical effect. It is clear that the finer the segmentation,
    the more likely the insurer may be mistaken in the evaluation of their commitments.
    The insurer is obliged to take a wider safety margin and therefore to globally
    implement technical prices higher than what is necessary and with a larger pooling.


    In this situation, the regulation and regulator require a higher capitalization,
    which calls for a return on capital. An extremely refined segmentation would require
    a greater mobilization of capital, which could be costly and would therefore generally
    run counter to collective interest.


    A balance must therefore be found in the level of mutualization of insurance to
    take into account the acceptability of the solidarity dimension contained in the
    current pooling and to meet the aspirations of a portion of clients for the personalization
    of prices.


    ### 4.3.3. *New offers based on new criteria*


    Another way of meeting the demand for individualization is to link the insurance
    price directly to an objective index of the insured risk or behavior of the client
    that is supposed to account for this risk level.


    New insurance criteria thus emerged: in car insurance, for example, where the
    motorist’s driving behavior is “scored” according to parameters such as braking,
    acceleration, pace, change of direction, geolocation and driving times, a calibration
    is necessary with the usual pricing methods.


    In the new digital world, one does not wait to know everything to act. We learn
    by acting: test and learn. The approach is inference. It is the data that dictate
    the trajectory, which is permanently rectified according to each acquisition of
    relevant information. Even though portfolio monitoring requires that all instants
    are actuarially sound, actuarial bases are not called into question.


    Big data and open data are also very useful for the development of parametric
    insurance such as storm insurance whose prior agreed indemnity is triggered solely
    on the basis of a wind index, regardless of any possible damage caused. Mixed
    insurance, partly parametric and partly compensational, is also envisaged, particularly
    in agricultural insurance. Beyond weather data, insurers can use drones and satellites
    to measure the field’s dryness or grass height.


    Numerous one-time card insurances can also be found. Offers can be available on
    mobile devices in applications, but can also be “shifted” to smartphones, thanks
    to geolocation, for clients who want it (while being very attentive to regulations).
    There are many opportunities: insurance to be underwritten just before borrowing
    a vehicle from a friend, or before skiing, etc.


    In these situations, similar to those of organizations that grant credits related
    to the purchase of objects, machine learning and big data are essential because
    prices must be made as quickly as possible. Pricing is of course difficult and
    actuarial monitoring is arduous, but for small sums, the technical safety margin
    can no doubt be found.


    Therefore, a vast field of possibilities is open to insurers, marketers and actuaries
    who will have a creative freedom. It will be necessary to ensure that claims occurrence
    is in line with risk assessments and it will also be important to measure whether
    the additional cost of using these technologies will be well-compensated by the
    gains in underwriting and disaster expertise.


    ### 4.3.4. *New risks to be insured*


    Any new technology has its setbacks. In view of the tremendous opportunities of
    digital and big data, a quite impressive piracy industry is developing, which
    profits from everything-connected.


    IT security has become an ongoing concern of the DIS, as all companies are hacked
    and often repeatedly, and individuals are demanded ransoms for their PC data to
    be restored after attack. In 2015, according to the Global Economic Crime Survey
    – PwC, cybercrime cost French companies 3.36 billion euros. Frauds affecting the
    president, phishing, data theft, individuals, by their naivety or negligence as
    regards cyber risks, are the vectors of the success of cyber attacks in half of
    the cases. Connected objects are the other weak link in the devices. They are
    not properly secured when designed, are not subject to maintenance and are a preferred
    entry point for hackers.'
