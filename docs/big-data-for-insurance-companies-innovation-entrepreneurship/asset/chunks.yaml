- raw: 'The old legal framework is not suited to the new world: the authorities and
    civil society are working to redefine rules in order to establish a new order
    in a society that has lost its benchmarks, particularly in the use of algorithms
    and data. However, this poorly defined environment poses a risk of heavy financial
    sanctions if insurers suffer from a personal data disaster even though they believe
    to have made every effort to protect their clients but failed on one point of
    the processing chain (for example, one of its subcontractors). On the one hand,
    the insurer must take its share in the added value brought by big data. On the
    other hand, they are retrained in their capacity for innovation by these uncertainties.


    Technology is evolving very quickly and agility is becoming a quality essential
    to survival, while the management of portfolio contracts is mobilizing increasingly
    significant resources to meet the growing requirements of solvency, competition
    and data security regulations.


    In this context, it is not easy for insurers, who are long-term actors, to define
    the right strategy for the future.


    Of all the possible hypotheses for the evolution of society, what are the most
    probable? Should each insurer choose the most effective strategy in the most probable
    hypothesis or most robust strategy regardless of the future, which will leave
    it with more degrees of freedom and the ability to adapt?


    ### 4.7.2. *Several possible choices*


    In the new context of collaborative economics and preference for usage, at the
    expense of property ownership, part of the insurance so far subscribed by private
    individuals in B2C should move to B2B (underwriting by companies). When a company
    makes its own property available to individuals, it does not need the same type
    of insurance as individuals. As regards damage to property, the company, which
    is often the manufacturer, can self-insure itself, at least in part: the size
    of its risk portfolio is sufficient to avoid pooling them with other actors. The
    insurable base would be severely contracted. The market would be much more concentrated
    than today and would probably eliminate small actors in the concerned insurance
    areas. The margin rate could be maintained, but the volume of business and staffing
    requirements would be greatly impacted.


    The hypothesis of a generalization of the IoT seems plausible: future arrival
    of autonomous cars, acceleration of home automation, connected cities, hygiene
    and health prevention via connected objects. This is the opinion of some insurers
    such as AXA and Allianz: they believe the future market will largely pass through
    the IoT. One of the risks of this scenario for the insurer is to be cut off from
    the source of the information that is captured by the manufacturer of connected
    objects, thus to be cut off from the client relationship and eventually their
    freedom of action, especially for their products and for controlling the level
    of their margin. A parry could consist of forging partnerships or acquiring companies
    that manufacture connected objects. This strategy may also allow for cross-agreements
    in B2B2C in order to offer manufacturers’ clients other insurance contracts than
    those linked to the connected object. Insurers are indeed working in this direction.


    However, in this scenario, another consequence is feasible: the establishment
    of conglomerates dedicated to a given function, such as mobility, health or connected
    home. In this case, for insurers, the danger of being marginalized and cut off
    from clients is great. Extensive partnerships should be forged with large groups
    in order to become the main trusted third party of these conglomerates – connected
    home integrator or care coordinator, for example. This would prevent insurance
    being diluted in multi-service offerings. The economic weight of insurers would
    be strengthened by the power of all members of the conglomerate. In this case,
    there would be little room for only one actor per major function (mobility, home,
    etc.), as is the case for web platforms where the dynamics of economic models
    exclude less efficient and less powerful actors.


    In this hypothesis regarding the impact of the generalization of IoT as in the
    one where it would not seem the most determinant, the hypothesis of a hyper-price
    segmentation is plausible if clients’ demand for a real personalization of prices
    is strong. But how far can price segmentation go? At what degree of homogeneity
    of risk level should one stop in the price schedules? From a technical point of
    view, the smaller the size of the “homogeneous” group, the less reliable the risk
    probability law of this group. Uncontrolled competition in this sense could present
    serious risks of destabilization of the market and jeopardize its solvency. It
    would be difficult for many actors on the ground to resist the movement if one
    of the major insurers ventured into it. The actuarial balance could lose its bearings:
    it would be difficult to rebalance the situation in the event of poor results.
    Depending on their position, clients, company culture and the communication policy
    carried out to date, insurers would have more or less flexibility in choosing
    the fineness of their segmentation and price difference between segments. They
    could choose to stand out despite the pressure and take the risk of losing some
    clients by maintaining a comfortable mutualization. Or, they could follow the
    trend by substantially lowering the prices of those identified as “good” risks
    and significantly increasing others, with no consideration other than financial
    efficiency for their insurance company. This situation would present a real likelihood
    of exclusion of persons who have become uninsurable by an unbearable price level.
    The consequences would be far-reaching for the community, which would have to
    assume in one way or the other the cost of claims incurred by third-party victims.
    Moreover, in the long term, the benefits for policyholders would be limited by
    an inevitable overall price increase due to greater volatility of results requiring
    a higher solvency margin. Would the regulator intervene to limit price differences,
    as it did in the past for the young drivers’ car insurance price?


    Insurance is above all a demutualization activity: people gather around a trusted
    third party to address possible future risks. Marketing and advertising have often
    damaged the “collaborative” image of insurance and this is especially unfortunate
    at this time when collaborative economy is becoming a reality. Is forgetting this
    basis not detrimental to the cohesion of our society? Insurance plays a fundamental
    social and economic role in society by allowing everyone to act and take life-related
    risks with the guarantee of being rescued in the event of a problem. Over-personalization
    of prices would risk calling this essential function into question. But will insurers
    have a choice if a major actor engages in the path of hyper-segmentation and thus
    disrupts market mechanisms?'
