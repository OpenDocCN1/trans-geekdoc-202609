    ### 1.4.2 Migration towards a data-oriented strategy


    There are still few companies who can boast of migrated data-oriented strategy.
    The migration consists of four phases:


    1. experimentation

    2. implementation

    3. expansion

    4. optimization


    The experimentation phase is to identify the potential use cases. The implementation
    phase is to build the initial solution. The expansion phase is to scale the solution.
    The optimization phase is to improve the solution.

