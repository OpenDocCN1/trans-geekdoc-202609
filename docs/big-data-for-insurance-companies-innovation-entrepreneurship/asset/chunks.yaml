    ## 3.4. Support vector machines (SVM)


    Support vector machines (SVM) constitute a class of supervised learning algorithms
    initially defined for the discrimination between two classes. They were then generalized
    for multiclass problems and for the prediction of quantitative variables. In the
    case of discrimination between two classes, they are based on the search for an
    optimal margin hyperplane, separating as best as possible the two subsets of observations.
    Here, we find the principle of the simple Perceptron ([section 3.3.2](#chapter03.xhtml#sec3-3-2)),
    with the idea of seeking an optimal solution, the best one to generalize.


    This method’s approach stems from Vapnik’s work in the theory of statistical learning
    from 1995 on the links between the complexity of a model and its generalization
    capacities \[COR 95, VAP 00\].


