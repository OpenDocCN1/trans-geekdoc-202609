- raw: 'Another important area of application of big data, a source of substantial
    savings, is the fight against fraud. The FFA (French Federation of Insurance)
    and its Alpha structure have been entirely working on this since 2014, with the
    start-up Shift Technology. Some market actors use the IBM Watson system. Watson
    has set up a real-time operational anti-fraud platform in the optical and dental
    sector for ProBTP: Solon. It aims at deterring, detecting and preventing fraud.


    To improve the relationship with clients, some initiatives are aimed at giving
    them the keys to the legal language of insurance contracts, often considered by
    individuals as jargon intended to confuse policyholders. Thus, Aviva utilise Alexa,
    the intelligent assistant of Amazon, to make the insurance vocabulary readable.


    Simplifying and streamlining client relationships in real time is a constant concern
    for insurance companies.


    Since the smartphone has become the preferred tool of consumers for their purchases,
    great efforts are being made to develop applications for mobiles. Prevention alerts
    are sent to clients to inform them of the risks of storms, for example.


    Like MetLife, the “360°” client vision is an objective for insurers. In this regard,
    MMA (Marketing Management Analytics), for example, deployed in 2016 a tool enabling
    client relationship actors to easily access a client’s entire data when establishing
    contact.


    Another area of development concerns assistance to compliance with regulations.
    A wave of innovations comes from Asia with start-ups (called Regtech) that propose
    solutions to facilitate the management of insurers’ constraints and client knowledge
    (KYC).


    Other actors focus on facilitating the financial management of their clients’
    savings. SwissLife, a major life insurer, cautious about new technologies, nevertheless
    invested in Budget Insight’s Fin Box API, an application that gives individuals
    a global vision of their financial assets, in order to encourage the activity
    of its team of 800 specialists in wealth management. Wealth management consultancy
    is also a privileged area for the use of big data and AI (artificial intelligence).
    Robo-advisors, offering asset allocations and automated management, can bring
    services that are equivalent to those of WMC (Wealth Management Consultants) within
    everyone’s reach, without human intervention. They are very successful in Asia
    and are beginning to appear in France.


    Artificial intelligence is also introduced in distribution through recommendation
    tools provided to account managers. Crédit Mutuel called in Watson to equip its
    network, with account managers retaining some flexibility with regard to adjustments
    and decisions.


    Chatbots (conversational robots) are emerging, following Facebook Messenger and
    successful experiments in other sectors: Voyages SNCF, PMU (Pari Mutuel Urban),
    Accor Hotels, Meetic, Air France KLM, etc. These conversational robots, which
    are available 24 h a day, 7 days a week, have the huge advantage of improving
    client experience while eventually opening the way to lower costs. Bots are still
    quite rudimentary and cannot manage clients’ path from A to Z. But with the stunning
    progress of NLP (natural language processing in Neuro-Linguistic Programming),
    it seems quite probable that these bots are going to generalize and indeed replace
    applications.


    ### 4.6.3. *Changes in organization and management and major training efforts
    to be carried out*


    Such changes of trades have a direct impact on employees. Certainly, the example
    must come from above. We must invent new management methods and be more collective
    and more inclusive. In this regard, Thomas Bubbler, CEO of the AXA group, expresses
    insurers’ state of mind: “limiting innovation to technology would be a mistake
    because it must permeate our entire corporate culture \[…\] At the highest level
    of the company, one of my first decisions was to change the way top management
    meets, to create new spaces for dialogue and make senior executives real partners.”


    The HRDs of insurance companies are mobilized to make the teams evolve towards
    a more transversal and collaborative mode of work and for the training of staff
    on new aspects of digital technology: training on digital techniques internally,
    external training that will possibly lead to a qualification, to acquire skills
    in R coding or Python, or in computer architecture, or mathematical algorithms,
    as well as training required for compliance.


    The training must also cover compliance with the new regulations on personal data
    and the protection of privacy. In general, charters have been put in place at
    the corporate or skilled trade level, such as, for actuaries who are members of
    the Institute of Actuaries who must ensure compliance with the code of ethics.


    It is also the responsibility of HRDs, in collaboration with CIOs and managers,
    to disseminate a culture of computer security. Cyber attacks are very often facilitated
    by the naivety and ignorance of employees who fall into traps set by hackers.
    Good training would greatly limit these risks, which are among the most significant
    operational risks for insurance companies.


    ### 4.6.4. *A new form of insurance: “connected” insurance*


    The great disruption of insurance offerings, often announced, is still a long
    way off. For the moment, the impact of digital technology has little to do with
    the core of the insurance business and its actuarial basis for mutualization.


    The area in which developments are most evident is that of insurance through connected
    objects (IoT): it seems to be the way of future contracts innovation. Many insurers
    have entered into partnerships with manufacturers of connected objects, the idea
    being, in particular, to create a close relationship with clients and not to be
    cut off from this contact by manufacturers of connected objects that are at the
    source of the data.


    Struggles and strategic collaborations are currently taking place at this level
    between insurers, car manufacturers, telephony operators, etc.


    Different tele-assistance offers intended for home care of the elderly have been
    launched: Groupama, Harmonie Mutuelle, Mondial Assistance, Allianz and AXA. However,
    for now, they are all complaining that this market is not taking off.


    According to a study conducted by Accenture in 2015 in several countries, out
    of 400 insurance companies, 50% see in this new type of insurance a new source
    of income in the years to come, of which 40% have already launched at least one
    offer based on a connected object. The scope of application, limited initially
    to car insurance and to a certain lifestyle (connected bracelets), extends to
    houses and company buildings, prevention as well as health. In France, the rate
    of insurers having launched an offer based on IoT is only 26%, which can be explained
    by the situation of the French market: car insurance with classical contracts
    is cheaper in France than in other countries, leaving less margin for pricing
    advantages to be granted to “good risks” for behavior-based insurance.


    As for health insurance, the scope of insurers is much more limited than in other
    countries because of the importance of social security, and the culture that prevails
    in France in this area makes clients suspicious of insurers.


    As regards car insurance, Allianz and AXA have created offers whose pricing depends
    on driving behavior: pay how you drive. Acceleration or sudden braking, excessively
    sharp turns and a too fast pace, marked by connected vehicle data, are not good
    indicators and should be avoided in order to obtain price reductions.'
