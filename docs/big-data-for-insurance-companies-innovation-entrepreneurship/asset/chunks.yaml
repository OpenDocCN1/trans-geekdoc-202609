    因此，我们寻求最小化得到的两个子树的方差。在分类情况下，要最小化的函数为：


    \[3.8\]![image](img/eq3-8.jpg)


    其中 ![images](img/i0047-03.jpg)是集合`n`中类别`k`的观测值比例 1,±。在这种情况下，我们尝试最小化每个集合的基尼指数（Gini
    index），从而获得尽可能同质的子树（如果所有观测值属于同一类别，则该集合是完全同质的）。


    一旦树的根被划分，就会在得到的两个子树上重复迭代，再次为所选代价函数寻找最佳划分点，直到达到停止准则。经典的停止准则包括不再划分包含少固定数量观测值的树节点。不再进行划分的终端节点被称为树的叶节点。注意，纯节点（即仅包含相同输出值观测值的节点）不会被划分。通过此程序得到的`T[max]`
    树被称为极大树，对于属于叶节点`n`的观测值，该模型预测的回归输出值为平均值：![images](img/i0048-01.jpg)(在分类中，则为叶节点中存在的`L[n]`观测值的多数类别)。


    CART 算法的第二步是修剪步骤，它将极大树`T[max]`中选择出最佳修剪树（从泛化误差的角度）。这一步是必要的，因为`T[max]`由于其结构非常精细，偏差较低但方差可能极大：它非常依赖于使用的观测值，而且容易过拟合。因此，必须选择一个精确度稍低但能够为新观测值提供等质量预测的模型。与极大树相比，仅由根节点组成的树具有零方差，但有显著偏差。因此目标是在这两个极端之间找到一个中间树。为了实现这一点，我们首先构建一个从`T[max]`开始相互修剪的子树序列（`T[j]`)[1≤`j`≤`J]`，该序列对应于一组嵌套划分。让我们在回归的情况下描述该过程：我们通过最小化一个针对`T[max]`的每个修剪子树`T`以及所有`α`
    ≥ 0 定义的惩罚准则来获得该序列（`T[j]`)[1≤`j`≤`J]`：


    \[3.9\]![image](img/eq3-9.jpg)


    其中`|T|`是`T`的叶节点数量，`ŷ[T,i]`是与`T`相关的模型对输入`x[i]`的预测值。通过逐渐增加`α`，`Crit[α]`的最小化提供了一个叶节点越少越少的序列（`T[j]`)[1≤`j`≤`J]`。接下来只需在由此得到的序列中选择一个候选者。Breiman
    *等.* 基本上提出了两种方法：使用测试样本或通过交叉验证。第一方法假设存在可用的测试库：*![images](img/ltilde.jpg)[n[t]]*
    = {(*![images](img/sxtilde.jpg)[i]*, *![images](img/sytilde.jpg)[i]*) ∈ ![image](img/upr.jpg)*^p*
    × ![images](img/capg.jpg),*i* = 1, … , *n[t]*}独立于`L[n]`，其中 (*![images](img/sxtilde.jpg)[i]*,
    *![images](img/sytilde.jpg)[i]*)是与(*X*, *Y*)具有相同分布的随机变量的独立实现。我们然后选择索引为的(`T[j]`)[1≤`j`≤`J]`子树：


    \[3.10\]![image](img/eq3-10.jpg)


    其中`ŷ[T[j]]`[,*i*]是与*![images](img/sxtilde.jpg)[i]*相关的输出。


    如前所述，决策树的优点之一是结果的可读性和易解释性，这得益于树图提供的模型自然理解。另一个优势是该方法可以处理原始数据。此外，与广义线性模型不同，它可以考虑线性相关的解释变量，且输出变量与其他变量之间的关系可以是线性的。


    然而，该方法也有一些缺点：例如，得到的模型并不特别可靠，因为它们在很大程度上取决于学习样本。学习库的微小变化可能会显著改变得到的模型。这就是决策树现在被用作更复杂方法的模块的原因之一，这些方法并行使用大量模型：模型聚合方法（随机森林、Bagging、Boosting）将在
    3.5 节中介绍。我们还注意到，决策树没有为每个解释变量提供整体划分：一个变量可能出现在不同的路径中。


    CART 方法允许变体 [BRE 84]，而且还有其他构建决策树的方法，例如 Quinlan [QUI 93] 引入的 C4.5 算法，该算法在 IT 社区中被广泛使用。还可以基于比决策树更规则的递归划分来构建预测器，这些预测器分段定义常数函数（参见
    Friedman [91] MARS）。


    决策树在许多领域都有应用。它们可以用于精算科学，例如 Paglia 和 M.P. [PAG 11]的文章所示。应该注意的是，决策树在 R 语言中通过`part`包实现。


    ## 3.3. 神经网络


    本节是对“神经网络”或“连接主义方法”的介绍，这些方法可以定义为源自神经生物学的数值求解方法。最早的反思出现在 1940 年左右，可以引用的名字有冯·诺依曼、图灵、维纳、麦卡伦和皮茨。当时的目标是利用生物和认知科学关于大脑的新知识，设计出具有某些特性的计算机系统，例如通过局部修改和信息存储的重新来实现自适应学习，在部分破坏的情况下具有鲁棒性。从这些早期工作中产生了两个学派。第一学派（冯·诺依曼、图灵等）采用了符号方法，是我们计算机中仍使用的概念（内存、处理器）的起源。第二个学派（麦卡伦、皮茨、明斯基等）自愿遵循更贴近生物描述的“连接主义”方法（神经模拟）。当传统人工智能在
    20 世纪 8 年代遇到困难时，这种方法经历了复兴。其结果有时是惊人的，并催生了如今许多先进的应用。


    神经网络在理论视角和应用方面都构成了一个巨大的研究领域（参见 Du 和 Swamy 的综合著作[DU 14]）。我们将关注分层网络和众知的梯度反向传播算法，它们在监督学习中提供了非常有趣的应用，并且是更简单、更传统的统计模型（线性和逻辑回归）的补充方法。最近，人们对这些方法产生了新的兴趣，随后是更高效的学习方法的出现：特别是深度学习，已经在改变人工智能的世界。


    ### 3.3.1. *从真实到形式神经元***


    '
