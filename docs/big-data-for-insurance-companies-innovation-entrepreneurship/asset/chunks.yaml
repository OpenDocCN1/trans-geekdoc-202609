    having jointly observed the *Y* variable and explanatory variables on a sample
    of individuals, the objective is to construct a model that will allow the output
    *Y* associated with a new input to be predicted. The mathematical framework of
    supervised statistical learning is this. We define a learning sample: *L[n]* =
    {(*X*[1], *Y*[1]), … , (*X[n]*, *Y[n]*)}}, that is, a sequence of independent
    and identically distributed random vectors (i.i.d.), having the same law as a
    random vector (*X*, *Y*). The law of the (*X*, *Y*) couple is unknown, and the
    objective of supervised statistical learning is to learn it by observing the learning
    base *L[n]*. The random variables or *X* and *Y* vectors do not play the same
    role: in practice, *X* refers to the input variable (usually a vector consisting
    of explanatory variables) and *Y* refers to the output variable (also called the
    variable to be explained). The *Y* variable can also be multidimensional. The
    purpose of supervised learning is to learn the link between the *X* and *Y* variables:
    note that the knowledge of the marginal laws of *X* and *Y* is not sufficient
    to know the law of the (*X*, *Y*) couple. It is by a statistical approach based
    on the observation of *L[n]* that we will obtain information, making it possible
    to predict a value *ŷ* associated with a new observation of the input variable
    *x*, for which the *y* variable to be explained is unknown. Depending on the nature
    of the output variable *y*, we can distinguish two supervised statistical learning
    frameworks: regression and classification.


    In the case of regression, the output variable *Y* is a quantitative variable,
    with real values. The standard framework is then:


    \[3.1\]![image](images/eq3-1.jpg)


    where *f* is the unknown function, called the regression function that we seek
    to estimate. The variable *ε* is a zero-expectation real random variable: it represents
    the noise and makes it possible to take into account the fact that the *Y* variable
    is only partially explained by the *X* variable. The learning base is then made
    up of couples: (*X[i]*[], *Y[i]* = f(*X*) + *ε[i]*), where *ε[i]* are independent
    random variables and of the same law.


    We also assume that the noise variable *ε* is conditionally centered on *X*. We
    then have: ![images](images/upe.jpg)\[*Y* | *X*\] = *f*(*X*), which defines the
    function *f* in a unique manner. Without any additional constraint on the function
    *f*, we can consider a nonparametric regression model, which therefore consists
    of constructing a predictor *![images](images/ifcirc.jpg)* from the learning base
    *L[n]*, making it possible to better predict the output *y* associated with an
    input *x*. The quality of *![images](images/ifcirc.jpg)* can be measured, for
    example, by the mean squared error of generalization defined by: E\[ (![images](images/fcirc.jpg)(X)-Y)²\].
    Since the law of the (*X*, *Y*) couple is unknown, in practice, the performance
    of the predictor is rather measured by an empirical mean squared error:


    \[3.2\]![image](images/eq3-2.jpg)


    defined on a test sample: ![images](images/ltilde.jpg)*[m]* = {(![images](images/xtilde.jpg)[1],
    ![images](images/ytilde.jpg)[1]), … , (![images](images/xtilde.jpg)*[m]*, ![images](images/ytilde.jpg)*[m]*)}
    of size *m*, independent of *L[n]*, where (![images](images/ixtilde.jpg)*[i]*,
    ![images](images/iytilde.jpg)*[i]*) are of the same law as (*X*, *Y*).


    To practically implement a supervised learning method, it is necessary to restrict
    the class of regression functions considered, and the techniques for determining
    a predictor will then depend on this choice. A conventional option that we will
    not discuss here is linear regression, where *f*(*X*) is assumed to be a linear
    combination of explanatory variables. In this case, the minimization of the empirical
    mean squared error calculated on the learning set leads to the resolution of a
    system of linear equations, which provides an explicit solution. For more sophisticated
    models, mostly nonlinear, the choice and the search for the “best” model are no
    longer quite simple as we will see in the subsequent sections.


    In the case of classification, the output variable *Y* is discrete and represents
    the class to which the observation belongs. If *K* denotes the number of classes,
    we can consider that *Y* has values in {1, … , *K*}. The objective is to construct
    a model which associates to each input vector *X* a class in {1, … , *K*}. A common
    approach is to proceed in two steps: the model actually estimates the quantities:
    P\[Y = k | X = x\], for *k* ∈ {1, … , *K*}, from which the class associated with
    the observation *x* is chosen.


    We will present the following supervised learning methods in the subsequent sections:
    decision trees, layered neural networks, SVM (support vector machines) and model
    aggregation methods (bagging, random forests, boosting, stacking).


    ### **3.1.2. *Unsupervised learning***


    In this case, there is no variable to be explained, which therefore rather concerns
    a clustering problem. The objective is to construct homogeneous classes that group
    together the most similar individuals (relative to the variables describing them),
    and the classes have to be as dissimilar as possible. The goal is to organize
    the information contained in the data, in order to make it more visible and better
    exploitable. Among the conventional methods, we have the ascending hierarchical
    classification and algorithms by dynamic reallocation (k-means). In [section 3.6](#chapter03.xhtml#sec3-6),
    we will see the Kohonen self-organizing map method, which has the advantage of
    allowing a graphical representation of the classes in a small space.


    ## 3.2. Decision trees


    The principle of decision trees is to partition the space of the values of the
    explanatory variables into rectangles, on which the variable to be explained is
    constant. This very simple idea, which was developed by Breiman *et al*. \[BRE
    84\] under the acronym CART (classification and regression tree), makes it possible
    to obtain an easy-to-visualize and simple-to-interpret model, which thus constitutes
    a genuine tool for supporting decision-making. Moreover, this method, which consists
    of recursively partitioning the input space in a dyadic way, can be applied in
    regression as well as in classification.


