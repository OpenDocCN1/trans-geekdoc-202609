    \ examples of neighborhood function:\n\n*   – ![images](images/i0076-01.jpg)(where\
    \ *k* is a fixed value, for example): *k* = 1 or *k* = 2);\n\n*   – Λ*[t]*(*i*,\
    \ *j*) = *g*(![images](images/capd.jpg)(*i*, *j*)), where *g* is a bell-shaped\
    \ function;\n\n*   – Λ*[t]*(*i*, *j*) = *g*(![images](images/capd.jpg)(*i*, *j*)/*λ*(*t*)),\
    \ where *λ*(*t*) ⟶ 0, when *t* ⟶ ∞.\n\n    A common example is: Λ*[t]*(*i*, *j*)\
    \ = *exp*(−![images](images/capd.jpg)(*i*, *j*)²/2*σ*(*t*)²), where:\n\n*   –\
    \ *σ*(*t*) = *σ*[*i*](*σ*[*f*]/*σ[i]*)^((*t*/*M*)), with *σ* *[i]* > *σ*[*f*]\
    \ > 0 (for example *σ[i]* = 5 and *f* = 0.2).\n\nThe adaptation parameter *ε[t]*\
    \ plays a significant role in the convergence of the algorithm. For example, we\
    \ can choose *ε[t]* such that ∑[*t*≥0] *ε[t]* = + ∞ and ∑[*t*≥0](*ε[t]*)² < +\
    \ ∞, as *ε[t]* = 1/*t* (Robbins–Monro conditions derived from stochastic algorithms).\n\
    \nAnother common example is: *ε*(*t*) = *ε[i]* (*ε[f]* / *ε[i]* )^((*t*/*M*)),\
    \ with *ε[i]* > *ε[f]* > 0 (for example, *ε[i]* = 0.1 and *ε[f]* = 0.005).\n\n\
    Analysis of the convergence of this algorithm poses difficult mathematical problems.\
    \ Although the vast majority of the Kohonen algorithm applications use at least\
    \ dimension 2 data spaces and show the phenomenon of self-organization, the great\
    \ majority of mathematical results satisfactorily describing it are only valid\
    \ in dimension 1 (string topology and dimension 1 data space)! For an overview\
    \ of known mathematical results, reference can be made to the synthesis article\
    \ by M. Cottrell, J.C. Fort and G. Pagès \\[COT 98\\]. This article also contains\
    \ a very extensive list of references on the subject.\n\n### 3.6.3. *Applications*\n\
    \nThis algorithm and its numerous variants have a wide range of applications.\
    \ In particular, the article \\[COT 03\\] can be consulted, where some examples\
    \ are presented: analysis and comparison of countries identified by socioeconomic\
    \ variables; electricity consumption curves; demography in municipalities of the\
    \ Rhone valley; consumer profiles in Canada; segmentation of the labor market\
    \ in France, etc. The advantage of this classification method is that it makes\
    \ it possible to graphically represent the observations while respecting the network\
    \ topology. The observations belonging to this class are thus associated with\
    \ each unit. When the data and classes are very numerous, it is possible to carry\
    \ out a second classification on the vectors representing the classes, in order\
    \ to obtain a coarser classification level, which will be easier to interpret.\n\
    \nMany variants of this algorithm have been proposed. In particular, it is possible\
    \ to apply it in the case of qualitative variables, by associating it with a factorial\
    \ correspondence analysis \\[COT 03\\].\n\nThe Kohonen algorithm is particularly\
    \ implemented in the R *kohonen* package.\n\n## 3.7. Bibliography\n\n\\[AOU 12\\\
