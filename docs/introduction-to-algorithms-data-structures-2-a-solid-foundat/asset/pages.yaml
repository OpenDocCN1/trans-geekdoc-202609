  md: '# 2.3. Building a Linked List


    Despite having powerful collection types built in to most languages, we often
    have a need for custom data structures that store data in different ways. In this
    section we''ll take a look at what a linked list is.


    # 2.3.1. What Is a Linked List?


    Over the next few sections, we''re going to build a data structure that you may
    have worked with before: a linked list. Before we get into what a linked list
    is, let''s talk about why we build data structures instead of just using the ones
    that come built into our languages.


    Each data structure solves a particular problem. We just went over the basics
    of the array data structure and looked at the cost of common operations that we
    carry out on arrays. We found that arrays were particularly good at accessing.
    Reading values happens in constant time. But arrays are pretty bad at inserting
    and deleting, both of which run in linear time.


    Linked lists on the other hand, are somewhat better at this, although there are
    some caveats. If we''re trying to solve a problem that involves far more inserts
    and deletes than accessing, a linked list can be a better tool than an array.


    So, what is a linked list? A linked list is a linear data structure where each
    element in the list is contained in a separate object called a node. A node models
    two pieces of information: an individual item of the data we want to store and
    a reference to the next node in the list. Figure 2.3.1.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_26_0.png)


    Figure 2.3.1: Identifying a node in a linked list


    The first node in the linked list (5 in the screenshot) is called the head of
    the list. While the last node (6 in the screenshot) is called the tale. The head
    and the tail nodes are special. The list only maintains a reference to the head,
    although in some implementations it keeps a reference to the'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'tail as well. This aspect of linked list is very important and, as you''ll
    see, most of the operations on the list need to be implemented quite differently
    compared to an array. The opposite of the head, the tail, denotes the end of the
    list. Every node other than the tail points to the next node in the list, but
    tail doesn''t point to anything. This is basically how we know it''s the end of
    the list.


    Nodes are what are called **self referential objects**. Figure 2.3.2.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_27_0.png)


    *Figure 2.3.2: Nodes in a linked list have heads and a tails*


    The definition of a node includes a link to another node and self-referential
    here means the definition of node includes the node itself. Linked lists often
    come in two forms: a **singly linked list** where each node stores a reference
    to the next node in the list, or a **doubly linked list** where each node stores
    a reference to both the node before and after.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_27_1.png)


    *Figure 2.3.3: A singly linked list*'
