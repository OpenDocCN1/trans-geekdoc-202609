  md: '# 2.4. Circularly Linked lists


    # 2.4.1. Representation


    A circularly linked list, circular linked list or simply a circular list is a
    type of data structure that consists of a collection of nodes, where each node
    contains a data element and a pointer to the next node in the list. In a circularly
    linked list, the last node in the list points back to the first node, forming
    a circle or loop.


    This circular linking structure has a number of advantages over a standard linked
    list discussed earlier, such as the ability to traverse the list in a circular
    manner without having to restart at the beginning of the list. It also allows
    for easy insertion and deletion of nodes at any position in the list.


    Circular linked lists can be implemented in a variety of programming languages,
    and are commonly used in various applications such as music playlists, computer
    game data structures, and memory management algorithms


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_41_0.png)


    Figure 2.4.1: Illustration of circularly linked list


    # 2.4.2. Advantages of circularly linked lists over singly linked lists


    There are several advantages of circularly linked lists over singly linked lists:


    +   1. **Traversing the list**: In a circular linked list, it is easy to traverse
    the entire list, as the last node is connected to the first node. This means that
    you can start at any node in the list and move in either direction to traverse
    the entire list.

    +   2. **Insertion and deletion**: Circular linked lists make it easy to insert
    or delete nodes anywhere in the list. This is because you only need to update
    the pointers of the neighboring nodes, whereas in singly linked lists, you need
    to find the previous node to update its pointer.

    +   3. **Efficient use of memory**: Since the last node in a circular linked list
    points back to the first node, there is no need to allocate memory for a separate
    "null" pointer. This can lead to more efficient use of memory.

    +   4. **Applications**: Circular linked lists are useful in various applications,
    such as music'
