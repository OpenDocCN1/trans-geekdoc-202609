    To highlight why that matters, let''s consider how lists in Python work. In Python
    when we create a list, the list doesn''t know anything about the size of the list
    and how many elements we''re going to store.


    Creating a new list like


    ```

    numbers = []

    ```


    creates a list and allocates a space of size n + 1. Since n here is zero, there
    are no elements in this array. So, in this list, space is allocated for a one
    element list to start off. Because the space allocated for the list and the space
    used by the list are not the same, what do you think happens when we use the following
    code to ask Python for the length of this list?


    ```

    print(len(numbers))

    ```


    We correctly get 0 back.


    0


    This means that the list doesn''t use the memory allocation as an indicator of
    its size. This is because, as I mentioned earlier, it has allocated space for
    a one element list, but it returns zero. So numbers in this list currently has
    space for one element. Now, let''s use the append method defined on the type to
    insert a number at the end of the list.


    ```

    numbers.append(2)

    ```


    Now, the memory allocation and the size of the list are the same since the list
    contains one element. What if I were to do something like this?


    ```

    numbers.append(200)

    ```'
