  md: '# 2.5.4. Multiply Linked List


    A multiply linked list is a type of linked list in which each node has multiple
    pointers, allowing for more complex data structures to be created.


    As explained earlier, in a singly linked list, each node has only one pointer
    to the next node in the list. In a doubly linked list, each node has two pointers,
    one to the previous node and one to the next node. But in a multiply linked list,
    each node can have multiple pointers to other nodes, allowing for more complex
    relationships between nodes.


    A common use case for a multiply linked list is in a graph data structure. Each
    node in the graph can be represented as a node in the multiply linked list, with
    pointers to other nodes representing the edges in the graph.


    Another use case for a multiply linked list is in a hierarchical data structure
    such as a tree. Each node in the tree can be represented as a node in the multiply
    linked list, with pointers to child nodes representing the hierarchy.


    In general, multiply linked lists allow for more complex and flexible data structures
    to be created, but they can be more complex to implement and maintain than simpler
    linked list structures.


    A general node structure of a multiply linked list is shown in Figure 2.6.3. Since
    each link field connects a group of nodes representing the data elements of a
    global list L, the multiply linked representation of the list L is a network of
    nodes that are connected to one another based on some association. The link fields
    may or may not render their respective lists to be circular, or may or may not
    possess a head node.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_46_0.png)


    *Figure 2.5.3: The node structure of a multiply linked list*


    # 2.5.5. Unrolled Linked List


    An unrolled linked list is a type of linked list that stores multiple elements,
    or keys, in each node. In an unrolled linked list, each node consists of a fixed-sized
    array that can hold a certain number of elements, as well as a pointer to the
    next node in the list.


    The idea behind an unrolled linked list is to reduce the overhead of allocating
    and deallocating memory for each individual element in the list. By storing multiple
    elements in each node, the number of allocations and deallocations required is
    reduced, which can improve performance.'
