- pgno: 11
  md: '# 2.2. Exploring Arrays


    # 2.2.1. Array Basics


    A common data structure built into nearly every programming language is the array.
    Arrays are a fundamental data structure and can be used to represent a collection
    of values. But it is much more than that. Arrays are also used as building blocks
    to create even more custom data types and structures. In fact, in most programming
    languages, text is represented using the *string* type and, under the hood, strings
    are just a bunch of characters stored in a particular order in an array.


    # What is a Data Structure?


    Before we go further and dig into arrays, what exactly is a data structure? A
    data structure is a way of storing data when programming. It''s not just the collection
    of values and the format they''re stored in, but the relationship between the
    values in the collection as well as the operations applied on the data stored
    in the structure.


    An array is one of very many data structures in general. An array is a data structure
    that stores a collection of values where each value is referenced using an **index**
    or a **key**. An example is shown in Figure 2.2.1.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_11_0.png)


    *Figure 2.2.1: An example of an array with its values (a, b, c) and keys (0, 1,
    2)*


    A common analogy for thinking about arrays is as a set of train cars. Each car
    has a number, and these cars are ordered sequentially. Inside each car (the array
    in this analogy) some data are stored. While this is the general representation
    of an array, it can differ slightly from one language to another, but for the
    most part, all these fundamentals remain the same. In a language like Swift or
    Java, arrays are **homogenous structures**, which means they can only contain
    values of the same type. If you use an array to store integers in Java, it can
    only store integers.


    In other languages like Python, arrays are **heterogeneous structures** because
    they can store any kind of value. So, in Python for example, you can mix numbers
    and text with no issues. Now,'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'regardless of this nuance, the fundamental concept of an array is the index.
    This index value is used for every operation on the array, from accessing values
    to inserting, updating and deleting.


    In Python, the language we''re going to be using for this course, is a little
    bit confusing. The type that we generally refer to as an array in most languages
    is best represented by the **list** type in python. Python does have a type called
    array as well, but it''s something different, so we''re not going to use it. While
    Python calls it a list, when we use a list in this course, we''ll be talking about
    concepts that apply to arrays as well in other languages, so definitely don''t
    skip any of this.


    There''s one more thing. In computer science, a list is actually a different data
    structure than an array, and in fact, we''re going to build a list later on in
    this course. Generally, though, this structure is called a linked list as opposed
    to just list, so hopefully the terminology isn''t too confusing. To properly understand
    how arrays work, let''s take a peek at how arrays are stored under the hood.


    An array is a contiguous data structure. This means that the array is stored in
    blocks of memory that are right beside each other with no gaps. The advantage
    of doing this is that retrieving values is very easy. In a non-contiguous data
    structure, and we''re going to build one soon, the structure stores a value as
    well as a **reference** to where the next value is.


    To retrieve that next value, the language has to follow that reference, also called
    a **pointer**, to the next block of memory. This adds some overhead, which, as
    you''ll see, increases the runtime of common operations. A moment ago, I mentioned
    that depending on the language, arrays can either be homogenous (containing the
    same type of value) or heterogeneous where any kind of value can be mixed. This
    choice also affects the memory layouts of the array.


    For example, in a language like C, swift or Java, where arrays are homogenous,
    when an array is created, since the kind of value is known to the language **compiler**,
    and you can think of the **compiler** as the brains behind the language, it can
    choose a contiguous block of memory that fits the array size and values created.


    If the values were integers, assuming an integer took up space represented by
    one block, then for a five-item array, the compiler can allocate five blocks of
    equally sized memory. Figure 2.2.2.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_13_0.png)


    Figure 2.2.2: Illustration of how a compiler allocates 5 blocks of equally sized
    memory


    In Python, however, this is not the case. We can put any value in a Python list.
    There''s no restriction. The way this works is a combination of contiguous memory
    and the pointers or references I mentioned earlier. When we create a list in Python,
    there is no information about what will go into that array, which makes it hard
    to allocate contiguous memory of the same size.


    There are several advantages to having contiguous memory. Since the values are
    stored beside each other, accessing the values happens in almost constant time.
    This is a characteristic we want to preserve. The way Python gets around this
    is by allocating contiguous memory and storing in it, not the value we want to
    store, but a reference or a pointer to the value that''s stored somewhere else
    in memory. Figure 2.2.3.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_14_0.png)


    *Figure 2.2.3: Illustration of how a Python compiler allocates 5 blocks of equally-sized
    memory using pointers or references*


    By doing this, it can allocate equally sized contiguous memory since regardless
    of the value, size, the size of the pointer to that value is always going to be
    equal. This incurs an additional cost in that when a value is accessed, we need
    to follow the pointer to the block of memory where the value is actually stored.
    But Python has ways of dealing with these costs that are outside of the scope
    of this course.


    Now that we know how an array stores its values, let''s look at common operations
    that we execute on an array.


    # 2.2.2. Accessing a Value in an Array


    Regardless of the kind of data structure you work with, all data structures are
    expected to carry out four kinds of operations.


    # Operations on Data Structure


    At minimum,


    +   1. we need to be able to **access and read** values stored in the structure.

    +   2. we need to be able to **search** for an arbitrary value.

    +   3. we also need to be able to **insert** a value at any point into the structure,
    and finally,

    +   4. we need to be able to **delete** structures.


    Let''s look at how these operations are implemented on the array structure in
    some detail, starting with **access**. Elements in an array are identified using
    a value known as an index. We use this index to access and read the value. Most
    programming languages follow a zero-based numbering'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'system when it comes to arrays. All this means is that the first index value
    is equal to **0**, not 1. Figure 2.2.4.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_15_0.png)


    *Figure 2.2.4: Illustration of a zero-based numbering system in an array*


    Generally speaking, when an array is declared a base amount of contiguous memory
    is allocated as the array storage. Computers refer to memory through the use of
    an address, but instead of keeping a reference to all the memory allocated for
    an array, the array only has to store the address of the first location because
    the memory is contiguous. Using the base address, the array can calculate the
    address of any value by using the index position of that value as an offset. If
    you want to be more specific, think of it this way.


    Let''s say we want to create an array of integers, and then each integer takes
    up a certain amount of space in memory that we''ll call **M**. Let''s also assume
    that we know how many elements we''re going to create, so the size of the array
    is some number of elements we''ll call **N**. So, the total amount of space that
    we need to allocate is **N** times the space per item **M**: **Space = N * M**.
    See Figure 2.1.5.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_16_0.png)


    Figure 2.2.5: Illustration of how memory is allocated in an array using address
    system


    If the array keeps track of the location in memory where the first value is held
    (let''s label that M0), then it has all the information it needs to find any other
    element in the list. When accessing a value in an array, we use the index. So,
    to get the first element in the list, we use the 0th index. To get the second,
    we use the index value 1, and so on.


    Given that the array knows how much storage is needed for each element, it can
    get the address of any element by starting off with the address for the first
    element, and adding to that the index value times the amount of storage per element.
    For example, to access the second value, we can start with M0 and to that add
    M times the index value 1 (Space = 1 * M), giving us M1 as the location and memory
    for the second address.


    This is a very simplified model, but that''s more or less how it works. This is
    only possible because we know that array memory is contiguous with no gaps. Let''s
    switch over to some code. As I mentioned earlier, and also in volume one of the
    course, we''re going to be using Python and Pycharm IDE (Integrated development
    environment) for writing our code. Feel free to use any other IDE you like, such
    as a notepad or even the Python interpreter you installed. While the code will
    be in Python, the concepts are universal, and more importantly, simple enough
    that you should have no issue following along in aby of your favorite programming
    languages.


    Now, open Pycharm and create a new file. Name this file arrays.py. Figure 2.2.6.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_17_0.png)


    Figure 2.2.6: Screenshot of a new file created in Pycharm. The workspace is where
    will write our Python code


    Creating a list in Python is quite simple. Here’s an example:


    ```

    new_list = [1, 2, 3]

    ```


    This allocates a base amount of memory for the array to use. When I say array,
    know that in Python, I mean a list. Since this is Python, the values aren''t stored
    directly in memory. Instead, the values 1, 2, and 3 are stored elsewhere in memory,
    and the array stores references to each of those objects. To access a value, we
    use a subscript along with an index value. So, to get the first value, we use
    the index 0. If we were to assign this to another variable, we would say


    ```

    result = new_list[0]

    ```


    We write out new_list since this is the array that we''re accessing the value
    from, and then a subscript notation, which is two square brackets, and then the
    index value 0. As you saw earlier, since the array has a reference to the base
    location in memory, the position of any element can be determined pretty easily.
    We don''t have to iterate over the entire list. All we need to do is a simple
    calculation of an offset from the base memory since we''re guaranteed that the
    memory is contiguous. For this reason, access is a constant time operation on
    an array or a Python list. This is also why an array crashes if you try to access
    a value using an index that is out of bounds of what the array stores, such as
    new_list[3] or new_list[10].


    If you''ve used an array before, you''ve undoubtedly run into an error or a crash
    where you try to access a value using an index that was larger than the number
    of elements in the array. Since the array calculates the memory address on the
    fly, when you access a value with an out-of-bounds index, as it''s called, the
    memory address returned is not one that''s part of the array structure and therefore
    cannot be read by the array.


    Now in Python, this is represented by an index error, and we can make this happen
    by using an index we know our array won''t contain. Now if we add


    ```

    print (result)

    ```


    and run our code in Pycharm, you''ll see that we get the value 1, which is the
    value stored at the 0th index. Figure 2.2.7.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_18_0.png)


    Figure 2.2.7: Screenshot showing the result of our Python code


    Now to highlight that index error, we can do new list and, inside the square brackets,
    we can provide an index that we know our array doesn''t contain. So, change the
    second line of your code to


    ```

    result = new_list[10]

    ```


    If you save and then run the updated code, you''ll get the error shown in Figure
    2.2.8.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_18_1.png)


    Figure 2.2.8: Screenshot showing a different result when we used an out-of-bounds
    index value


    Now Python says IndexError: list index out of range.


    Those are the basics of how we create and read values from an array. In the next
    section, we’ll take a look at searching but first here’s some practice exercise.'
  merge: -1
  img_proc: true
