- pgno: 7
  md: '# 0. What You Will Learn in Volume 2


    This book is the second volume of a four-part series titled *Introduction to Algorithms
    & Data Structures*. The design of an efficient algorithm for the solution of the
    problem calls for the inclusion of appropriate data structures. In the field of
    computer science, data structures are used to store and organize data in a way
    that is easy to understand and use. They are used to organize and represent data
    in a way that will make it easier for computers to retrieve and analyze it. These
    are the fundamental building blocks that any programmer must know how to use correctly
    in order to build their own programs.


    # 0.1. Benefits of learning about algorithms and data structures


    First, they will help you become a better programmer. Another benefit is that
    they will make you think more logically. Furthermore, they can help you design
    better systems for storing and processing data. They also serve as a tool for
    optimization and problem-solving.


    As a result, the concepts of algorithms and data structures are very valuable
    in any field. For example, you can use them when building a web app or writing
    software for other devices. You can apply them to machine learning and data analytics,
    which are two hot areas right now. If you are a hacker, algorithms and data structures
    in Python are also important for you everywhere.


    Now, whatever your preferred learning style, I''ve got you covered. If you''re
    a visual learner, you''ll love my clear diagrams and illustrations throughout
    this book. If you''re a practical learner, you''ll love my hands-on lessons so
    that you can get practical with algorithms and data structures and learn in a
    hands-on way.


    # 0.2. Course Structure


    There are three volumes in this course. This is volume two. In volume one, I took
    a deep dive into the world of algorithms. I covered what **algorithms** are, how
    they work, and where they can be found (real life applications).


    In this part of the series (volume two), we''ll work through an introduction to
    data structures. You''re going to learn about two introductory data structures
    - **arrays** and **linked lists**. You''ll look at common operations and how the
    runtimes of these operations affect our everyday code.


    In the third volume, you''re going to bring your knowledge of algorithms and data
    structures together to solve the problem of sorting data using the Merge Sort
    algorithm. We will look at algorithms in two categories: **sorting** and **searching**.
    You''ll implement well-known sorting algorithms like Selection Sort, Quicksort,
    and Merge Sort. You''ll also learn basic search algorithms like Sequential Search
    and Binary Search.


    At the end of many sections of this course, short practice exercises are provided
    to test your'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'understanding of the topic discussed. Answers are also provided so you can
    check how well you have performed in each section. At the end of the course, you
    will find a **link to download more helpful resources, such as codes and screenshots
    used in this book, and more practice exercises**. You can use them for quick references
    and revision as well. My **support link is also provided** so you to contact me
    any time if you have questions or need further help.


    By the end of this course, you will understand what algorithms and data structures
    are, how they are measured and evaluated, and how they are used to solve real-life
    problems. So, everything you need is right here in this book. I really hope you’ll
    enjoy it. Are you ready? Let''s dive in!'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 2. Introduction to Data Structures


    In this part of the course, I will introduce data structures. First, we''re going
    to answer one fundamental question: **why do we need more data structures than
    a programming language provides?** This question will be answered in section 2.3.1.
    For now, let’s do some housekeeping.


    In this course, we''re going to rely on the concepts we learned in volume one
    (*Introduction to Algorithms & Data Structures 1*), namely big O notation, space
    and time complexity, and recursion. If you''re unfamiliar with those concepts
    or just need a refresher, check out volume one. In addition, this course does
    assume that you have some programming experience.


    We''re going to use data structures that come built into nearly all programming
    languages as our point of reference. While we will explain the basics of how these
    structures work, we won''t be going over how to use them in practice. If you''re
    looking to learn how to program in Python before digging into this content, check
    out the following book that completely simplifies Python programming language
    for beginners:


    https://www.scribd.com/book/513773394/Python-Programming-from-Beginner-to-Paid-Professional-Part-1-Learn-Python-for-Automation-IT-with-Video-Tutorials
    (or use this BIT.LY short link: http://bit.ly/3ZKREhB).


    Even if you know nothing about Python, as long as you understand the fundamentals
    of programming, you should be able to follow along pretty well. If you''re good
    to go, then awesome.


    # 2.1. Course Overview


    Let''s start with an overview of this course. The first thing we''re going to
    do is to explore a data structure we are somewhat already familiar with: arrays.
    If you''ve written code before, there''s a high chance you have used an array.
    In this course, we''re going to spend some time understanding how arrays work,
    what are the common operations on an array, and what are the run times associated
    with those operations.


    Once we''ve done that, we''re going to build a data type of our own called a **linked
    list**. In doing so, we''re going to learn that there''s more than one way to
    store data. In fact, there''s way more than just one way. We''re also going to
    explore what motivates us to build specific kinds of structures and look at the
    pros and cons of these structures. We''ll do that by exploring four common operations:
    accessing a value, searching for a value, inserting a value, and deleting a value.


    After that, we''re going to circle back to algorithms and implement a new one:
    a sorting algorithm. In the introduction to algorithms course (volume one), we
    implemented a binary search algorithm. A precondition to binary search was that
    the list needed to be sorted. We''re'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'going to try our hand at sorting a list and open the door to an entirely new
    category of algorithms. We''re going to implement our sorting algorithm on two
    different data structures and explore how the implementation of one algorithm
    can defer based on the data structure being used.


    We''ll also look at how the choice of data structure potentially influences the
    runtime of the algorithm. In learning about sorting, we''re also going to encounter
    another general concept of algorithmic thinking called divide and conquer. Along
    with recursion, divide and conquer will be a fundamental tool that we will use
    to solve complex problems, all in due time. In the next section let''s talk about
    arrays.'
