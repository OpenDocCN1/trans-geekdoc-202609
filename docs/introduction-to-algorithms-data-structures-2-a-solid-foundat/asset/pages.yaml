- pgno: 23
  md: 'Now, since the list only has an allocation for one item at this point, before
    it can add the new element to the list, it needs to increase the memory allocation
    and thereby the size of the list. It does this by calling a list-resize operation.
    List resizing is quite interesting because it shows the ingenuity in solving problems
    like this.


    Python doesn''t resize the list to accommodate just the element, say 5, that we
    want to add. Instead, in this case, to add one element 5, it would allocate four
    blocks of memory to increase the size to a total of four contiguous blocks of
    memory. It does this so that it doesn''t have to resize the list every single
    time we add another element like 1, but at very specific points. The growth pattern
    of the list type in Python is 0, 4, 8, 16, 25, 35, 46 and so on. Figure 2.2.12.
    This means that as the list size approaches these specific values, list-resize
    operation is called again.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_23_0.png)


    Figure 2.2.12: Python allocates 4 blocks of memory even though only three elements
    have been added


    If you look at when the size of the list is four, this means that when appending
    four more values until the size of eight, each of those append operations do not
    increase the amount of space taken at specific points. However, when resizing
    is triggered, space required increases as memory allocation increases. Figure
    2.2.13.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/225e78c1e15afa64fe5c5ef7710b7b57_24_0.png)


    *Figure 2.2.13: Allocation of 16 blocks of memory is triggered when the 9th element
    4 is added*


    This might signify that the append method has a non-constant space complexity,
    but it turns out that, because some operations don''t increase space and others
    do, when you average all of them out, append operations take constant space. We
    say that it has an **Amortized Constant Space Complexity**.


    This also happens with insert operations. If we had four-element array, we would
    have four elements and a memory allocation of four. An insert operation at that
    point, it doesn''t matter where it happens on the list, it would trigger a resize.
    Inserting is still more expensive though because after the resize, every element
    needs to be shifted over one.


    The last (third) insert operation that is supported in most languages is the ability
    to **add one list to another**. In Python, this is called an **extend**. Now,
    let’s clear your workspace and start writing a new code. We will begin with an
    empty list.


    ```

    numbers = []

    ```


    ```

    numbers.extend([4, 5, 6])

    ```


    In the second line, as an argument, I just passed in (added) a new list (4, 5,
    6) entirely. Now, to print out *numbers*, we write


    ```

    print(numbers)

    ```


    If you run this code, you''ll see that our list now contains the values 4, 5,
    and 6.


    ```

    [4, 5, 6]

    ```


    So, *extend* takes another list to add. Extend effectively makes a series of append
    calls on each of the elements in the new list until all of them have been appended
    to the original list. This operation has a runtime of Big O(k) where k represents
    the number of elements in the list that we''re adding to our existing list.'
