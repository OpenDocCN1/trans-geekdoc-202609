  md: '# 2.5. Doubly Linked Lists


    A doubly linked list is a type of data structure that consists of a collection
    of nodes, where each node contains a data element and two pointers: one to the
    previous node in the list and one to the next node in the list.


    In a doubly linked list, you can traverse the list in both forward and backward
    directions, as each node has a pointer to both the previous and the next nodes.
    This makes it easier to insert or delete nodes at any position in the list, as
    you can move in either direction to find the node you want to modify.


    The first and last nodes in a doubly linked list are called the **head** and **tail**,
    respectively. They are special nodes that do not have a previous or next node,
    respectively. A doubly linked list can also be circular, in which case the tail
    node points back to the head node, forming a loop.


    Doubly linked lists are used in various applications, such as music playlists,
    computer game data structures, and text editors. However, they require more memory
    than singly linked lists, as each node needs to store two pointers instead of
    one. Additionally, implementing a doubly linked list can be more complex than
    implementing a singly linked list, as you need to update two pointers when inserting
    or deleting a node.


