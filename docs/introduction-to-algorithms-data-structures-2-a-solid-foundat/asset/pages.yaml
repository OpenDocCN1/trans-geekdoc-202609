- pgno: 20
  md: "read a value using an index. In this section, we're going to look at how the\
    \ remaining data structure operations work on arrays. If you took the introduction\
    \ to algorithms course (volume one of this book), we spent time learning about\
    \ two search algorithms: linear search, and binary search. While arrays are really\
    \ fast at accessing values, they're pretty bad at searching. Taking an array as\
    \ is, the best we can do is use linear search for a worst-case linear runtime.\n\
    \nLinear search works by accessing and reading each value in the list until the\
    \ element in concern is found. If the element we're looking for is at the end\
    \ of the list, then every single element in the list will have been accessed and\
    \ compared. Even though accessing and comparing are constant time operations,\
    \ having to do this for every element results in an overall linear time. Now,\
    \ let's look at how search works in code.\n\nIn Python, we can search for an item\
    \ in an array in one of two ways. We can use the in operator to check whether\
    \ a list contains an item. For example, we can add the following line to our previous\
    \ code:\n\n```\nif 1 in new_list: print(True)\n```\n\nThe in operator actually\
    \ calls a contains method that is defined on the list type, which runs a linear\
    \ search operation. In addition to this, we can also use a for loop to iterate\
    \ over the list manually and perform a comparison operation. So, I can say\n\n\
    ```\nfor n in new_list:\n    if n==1:\n        print(True)\n        break\n```\n\
    \nAfter printing the result then after that break out of the loop. This is more\
    \ or less the implementation of linear search. If the array were sorted, however,\
    \ we could use binary search. But because sort operations incur a cost of their\
    \ own, languages usually stay away from sorting the list and running binary search\
    \ since for smaller arrays linear search on its own may be faster.\n\nSo, if you\
    \ run the following code, you’ll see that Python prints True.\n\n```\nnew_list\
    \ = [1, 2, 3]\nif 1 in new_list: print(True)\n```\n\nNow because we've already\
    \ learned about linear and binary search in a previous course, there's nothing\
