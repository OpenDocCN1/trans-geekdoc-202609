- pgno: 21
  md: 'Figure 2.2.9.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_21_0.png)


    Figure 2.2.9: The element 4 is to be inserted into the first position with index
    value 0


    When we insert into the first position (index position 0), what happens to the
    item that is currently in that spot? Well, it has to move to the next spot at
    index position 1. What happens to the second item at index position 1? That one
    moves to the next spot at index position 2. This keeps happening until all elements
    have been shifted forward by one index position. Figure 2.2.10.


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_21_1.png)


    Figure 2.2.10: The element 4 is inserted into the first position and one index
    value is added to the array


    So, in the worst-case scenario, inserting at the 0th position of an array, every
    single item in the array has to be shifted forward and we know that any operation
    that involves iterating through every single value means a linear runtime.


    Now the second type of insert is called appending. Although appending is technically
    an insert operation in that it inserts an item into an existing array, it doesn''t
    incur the same runtime cost because it simply adds the item to the end of the
    list. We can simplify and say that this is constant time operation, but it depends
    on the language implementation of the array.'
