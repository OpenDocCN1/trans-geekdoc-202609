- pgno: 25
  md: '# Array Deleting


    The last type of operation we need to consider are delete operations. Deletes
    are similar to inserts in that when a delete operation occurs, the list needs
    to maintain correct index values. So, where an insert shifts every element to
    the right, a delete operation shifts every element to the left. Just like an insert
    as well, if we delete the first element in the list, every single element in the
    list needs to be shifted to the left. Delete operations have an upper bound of
    Big O(n), also known as a linear runtime.


    Now that we''ve seen how common operations work on a data structure that we''re
    quite familiar with, let''s switch tracks and build our own data structure.


    # 2.2.6. Practice Exercise 2


    Q1. Adding one array to another in a series of append operations has a runtime
    of O(k). What does k represent here?


    +   A. The size of the array being added

    +   B. The size of the original array

    +   C. The runtime of an append operation


    Q2. Why do array inserts and deletes have a linear runtime in the worst case?
    Choose the correct answer below:


    +   A. With insert operations, the array needs to read every value to ensure it
    doesn''t insert the same value twice

    +   B. With deletes the array needs to search for the element before it can delete
    it and this can take an n number of read operations

    +   C. Every element in the array has to be shifted to either the left (deletes)
    or right (inserts)


    Q3. What do we use to access values in an array? Choose the correct answer below:


    +   A. Node

    +   B. Index

    +   C. Key


    # 2.2.7. Answers to Practice Exercise 2


    +   1. A

    +   2. C.

    +   3. B'
