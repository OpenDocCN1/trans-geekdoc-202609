    The last (third) insert operation that is supported in most languages is the ability
    to **add one list to another**. In Python, this is called an **extend**. Now,
    let’s clear your workspace and start writing a new code. We will begin with an
    empty list.


    ```

    numbers = []

    ```


    ```

    numbers.extend([4, 5, 6])

    ```


    In the second line, as an argument, I just passed in (added) a new list (4, 5,
    6) entirely. Now, to print out *numbers*, we write


    ```

    print(numbers)

    ```


    If you run this code, you''ll see that our list now contains the values 4, 5,
    and 6.


    ```

    [4, 5, 6]

    ```


    So, *extend* takes another list to add. Extend effectively makes a series of append
    calls on each of the elements in the new list until all of them have been appended
    to the original list. This operation has a runtime of Big O(k) where k represents
    the number of elements in the list that we''re adding to our existing list.'
