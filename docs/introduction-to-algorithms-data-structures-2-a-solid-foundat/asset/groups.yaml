    我们需要考虑的最后一种操作类型是删除操作。删除与插入类似，因为当删除操作发生时，列表需要保持正确的索引值。因此，插入将每个元素向右移动，删除操作将每个元素向左移动。就像插入一样，如果我们删除列表中的第一个元素，列表中的每个元素都需要向左移动。删除操作的上限为
    Big O(n)，也称为线性运行时间。


    现在我们已经看到了我们相当熟悉的数据结构上的常见操作是如何工作的，让我们转换轨道并构建我们自己的数据结构。


