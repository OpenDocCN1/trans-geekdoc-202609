    ## 2.2. 探索数组


    ### 2.2.1. 数组基础


    几乎每种编程语言中都内置了一种常见的数据结构，即数组。数组是一种基本的数据结构，可用于表示一组值。但它远不止于此。数组还被用作构建更自定义数据类型和结构的构建块。事实上，在大多数编程语言中，文本使用
    *string* 类型表示，而在底层，字符串只是一组按特定顺序存储在数组中的字符。


    ### 什么是数据结构？


    在我们进一步深入研究数组之前，数据结构到底是什么？数据结构是在编程时存储数据的一种方式。它不仅仅是值的集合及其存储格式，还包括集合中值之间的关系以及对存储在结构中的数据应用的操作。


    数组是众多数据结构中的一种。数组是一种数据结构，它存储一组值，每个值都使用 **index** 或 **key** 引用。示例见图 2.2.1。


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_11_0.png)


    *图 2.2.1：一个数组的示例，其值（a, b, c）和键（0, 1, 2）*


    思考数组的一个常见类比是火车车厢组。每个车厢都有一个编号，这些车厢按顺序排列。在每个车厢内（在此类比中为数组）存储了一些数据。虽然这是数组的一般表示，但它会因语言而略有不同，但总体而言，所有这些基础都保持不变。在
    Swift 或 Java 等语言中，数组是 **homogenous structures**，这意味着它们只能包含相同类型的值。如果你用 Java 中的数组存储整数，它只能存储整数。


    在 Python 等其他语言中，数组是 **heterogeneous structures**，因为它们可以存储任何类型的值。因此，在 Python 中，例如，你可以混合数字和文本而没有任何问题。现在，无论这种细微差别如何，数组的基本概念是索引。此索引值用于数组上的每个操作，从访问值到插入、更新和删除。


    在 Python 中，我们将在本课程中使用的语言，有点令人困惑。大多数语言中通常称为数组的类型最好由 python 中的 **list** 类型表示。Python
    也有一个名为 array 的类型，但它是不同的东西，所以我们不会使用它。虽然 Python 称其为列表，但在本课程中使用列表时，我们谈论的概念也适用于其他语言中的数组，所以绝对不要跳过任何内容。


    还有一件事。在计算机科学中，列表实际上与数组是不同的数据结构，事实上，我们将在本课程后面构建一个列表。一般来说，这个结构被称为链表而不是仅仅列表，所以希望术语不会太令人困惑。为了正确理解数组的工作原理，让我们看看数组在底层是如何存储的。


    数组是一种连续的数据结构。这意味着数组存储在彼此相邻且没有间隙的内存块中。这样做的优点是检索值非常容易。在非连续数据结构中，我们很快就会构建一个，该结构存储一个值以及指向下一个值的
    **reference**。


    要检索下一个值，语言必须遵循该引用，也称为 **pointer**，到下一个内存块。这会增加一些开销，而正如你将看到的，这会增加常见操作的运行时间。刚才我提到，根据语言的不同，数组可以是同构的（包含相同类型的值）或异构的，其中可以混合任何类型的值。这种选择也会影响数组的内存布局。


    例如，在 C、swift 或 Java 等数组是同构的语言中，当创建数组时，由于语言 **compiler** 知道值的种类，而你可以将 **compiler**
    视为语言的大脑，它可以选择一个适合数组大小和所创建值的连续内存块。


    如果值是整数，假设一个整数占据一个块表示的空间，那么对于一个包含五项的数组，编译器可以分配五个大小相等的内存块。图 2.2.2。


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_13_0.png)


    图 2.2.2：编译器如何分配 5 个大小相等的内存块的说明


    在 Python 中，情况并非如此。我们可以把任何值放在 Python 列表中。没有限制。这种方式的工作原理是连续内存和我之前提到的指针或引用的结合。当我们在
    Python 中创建列表时，没有关于将要放入该数组的内容的信息，这使得很难分配相同大小的连续内存。


    具有连续内存有几个优点。由于值彼此相邻，访问值几乎以恒定时间发生。这是我们想要保留的特性。Python 解决这个问题的方法是分配连续内存并在其中存储的不是我们想要存储的值，而是指向存储在内存其他地方的值的引用或指针。图
    2.2.3。


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_14_0.png)


    *图 2.2.3：Python 编译器如何使用指针或引用分配 5 个大小相等的内存块的说明*


    通过这样做，它可以分配大小相等的连续内存，因为无论值的大小如何，指向该值的指针的大小总是相等的。这会带来额外的成本，即当访问值时，我们需要遵循指针到值实际存储的内存块。但
    Python 有处理这些成本的方法，这些方法超出了本课程的范围。


    现在我们知道了数组如何存储其值，让我们看看我们在数组上执行的常见操作。


    ### 2.2.2. 在数组中访问值


    无论你使用哪种数据结构，所有数据结构都期望执行四种操作。


    ### 数据结构上的操作


    至少，


    - 1. 我们需要能够 **access and read** 存储在结构中的值。

    - 2. 我们需要能够 **search** 任意值。

    - 3. 我们还需要能够在结构中的任何位置 **insert** 一个值，最后，

    - 4. 我们需要能够 **delete** 结构。


    让我们详细看看这些操作如何在数组结构上实现，从 **access** 开始。数组中的元素使用称为索引的值来标识。我们使用此索引来访问和读取值。大多数编程语言在处理数组时遵循零基编号系统。这只意味着第一个索引值等于
    **0**，而不是 1。图 2.2.4。


    ![](img/225e78c1e15afa64fe5c5ef7710b7b57_15_0.png)


    *图 2.2.4：数组中零基编号系统的说明*


    一般来说，当声明一个数组时，会分配一个基础量的连续内存作为数组存储。计算机通过地址引用内存，但由于内存是连续的，数组只需存储第一个位置的地址，而无需保留为数组分配的所有内存的引用。使用基地址，数组可以通过使用该值的索引位置作为偏移量来计算任何值的地址。如果你想更具体地思考，可以这样想。


    假设我们想要创建一个整数数组，然后每个整数在内存中占据一定的空间，我们称之为 **M**。我们还假设我们知道要创建多少个元素，所以数组的大小是某个元素数量，我们称之为
    **N**。因此，我们需要分配的总空间是 **N** 乘以每项的空间 **M**：**Space = N * M**。见图 2.2.5。

