    to get the first element in the list, we use the 0th index. To get the second,
    we use the index value 1, and so on.


    Given that the array knows how much storage is needed for each element, it can
    get the address of any element by starting off with the address for the first
    element, and adding to that the index value times the amount of storage per element.
    For example, to access the second value, we can start with M0 and to that add
    M times the index value 1 (Space = 1 * M), giving us M1 as the location and memory
    for the second address.


    This is a very simplified model, but that''s more or less how it works. This is
    only possible because we know that array memory is contiguous with no gaps. Let''s
