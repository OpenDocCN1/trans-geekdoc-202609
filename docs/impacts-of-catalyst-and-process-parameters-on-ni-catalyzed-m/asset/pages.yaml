    syngas ratio are taken. |

    | | GHSV (ML/gcat·h)d | Gas hourly space velocity of the reaction, defined as
    the total volumetric feed flow rate per unit mass of catalyst per hour. |

    | Catalyst characteristics | Pore size (nm)e | Pore diameter of the catalyst support.
    |

    | | Pore Volume (cm3/g)c | Specific pore volume of the catalyst support. |

    | | Surface Area (m2/g)f | Specific surface area of the fresh catalyst. |

