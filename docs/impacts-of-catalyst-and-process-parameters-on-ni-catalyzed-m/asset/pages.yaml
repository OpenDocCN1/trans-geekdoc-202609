    # 3. Results and discussion


    # 3.1. Data analysis and visualization


    We begin our analysis by obtaining correlation coefficients between each pair
    of features to better understand our dataset. The heat map of the correlation
    matrix is shown in Fig. 2a, in which a dark red hue represents a strong positive
    correlation coefficient, a dark blue hue represents a strong negative correlation
    coefficient, and a light-yellow hue represents a weak correlation coefficient.
    As is ideal for training ML models, most of the features possess weak cross-correlations,
    except


    for (1) a strong positive correlation between surface area and pore volume, and
    (2) a moderate negative correlation between surface area and pore size. These
    correlations agree with what is generally understood about the textural properties
    of catalyst supports: highly porous materials with small pores tend to have larger
    specific surface areas arising from the interstitial voids within the pores. Although
    such multicollinearity can potentially underestimate the importance of correlated
    features [50], we nevertheless retained all features to avoid the potential loss
    of important information for model training.


    The distributions of the raw data collected for our targets, namely CH4 conversion,
    CO2 conversion and syngas ratio, are shown in Fig. 2b. Further, a summary of their
    descriptive statistics such as mean, median, standard deviation and skewness of
    each distribution is provided in Supplementary Information Table S2. The reactant
    (i.e., CH4 and CO2) conversions within the dataset range from 0% to nearly 99%
    with average values of 59.9% and 67% respectively. The slightly higher conversions
    for CO2 than CH4 are consistent with CO2 being consumed in multiple side reactions,
    such as RWGS and coke gasification, in addition to DRM. After the removal of outliers
