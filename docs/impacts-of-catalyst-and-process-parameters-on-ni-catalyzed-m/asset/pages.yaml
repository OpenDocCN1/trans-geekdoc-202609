    costs [16]. Within the open literature, there are relatively few papers that discuss
    the effects of catalyst properties on the syngas ratio and, more importantly,
    how they can be tuned to increase the syngas ratio [17,18]. While it is sometimes
    postulated that the syngas ratio is largely governed by the thermodynamics of
    the RWGS reaction rather than the nature of the catalyst itself [19,20], this
    is inconsistent with several reported observations of significantly different
    syngas ratios over different catalysts even at the same reaction conditions [21],
    which points to the possibility of targeted catalyst engineering to increase the
    selectivity of the DRM reaction over the RWGS reaction in a manner similar to
    how the thermodynamically favorable coking reaction can be inhibited over coking-resistant
    materials.


    H2 + CO2 <=> H2O + CO, ΔH298 K = +41 kJ/mol (2)


    Machine learning (ML) has seen widespread use in materials design and discovery
    for its ability to uncover correlations across large datasets [22]. Within the
    field of heterogeneous catalysis, ML models have often been employed to overcome
    computational bottlenecks associated with density functional theory (DFT) calculations
    [23] by predicting computable physical properties [24] (e.g., adsorption energies
    and reaction mechanisms [25] (i.e., based on estimated activation energies of
    possible elementary steps) from electronic or structural fingerprints. In a complementary
    approach, ML models can also be trained on experimental data, either extracted
    from published literature [26–28] or generated from high-throughput experimentation
    [29,30], to predict catalytic performance from process parameters and measurable
    catalyst properties [26,31]. This latter approach is particularly useful for multicomponent
    materials with complex architectures that cannot be accurately modeled by presently
    available computational methods (e.g., DFT). In all of these studies, model interpretability
    [31], as can be achieved by feature importance analyses of black-box ML model
    output, is crucial for developing qualitative scientific insights [28] that can
    in turn be leveraged by experimentalists to help develop improved catalysts and
    processes. Compared to inherently interpretable ML methods such as symbolic regression-based
    approaches [32–34], this two-step “gray-box” approach typically offers increased
    prediction accuracy across large and complex datasets [31].


    In this work, we develop interpretable ML models to unearth structure-property
    relationships from the vast body of literature on Ni-catalyzed DRM. Specifically,
    we first gather from the open literature a comprehensive, high-quality dataset
    of catalyst properties, process parameters, and reactivity data, on which we then
    train tree regressor models (random forest – RF [35], gradient boosted regressor
    – GBR [36] and categorical tree regressor – CatBoost [37]) to predict reactant
    conversions and syngas ratios using catalyst properties and process parameters
    as features. We then apply posteriori model interpretation techniques [38] to
    illustrate how each feature influences syngas ratio and reactant conversions.
    In addition to reproducing the well-known effects of temperature, space velocity,
    and feed dilution on DRM performance, the partial dependence plots applied in
    our study also reveal Ni particle size as a potential handle for controlling syngas
    ratio independently of the effects of process operating conditions.


    # 2. Method


    # 2.1. Overall approach


    We select three commonly used quantitative metrics of DRM catalyst performance,
    namely CH4 conversion, CO2 conversion, and syngas ratio (defined as the ratio
    of H2 formation rate to CO formation rate), as our targets. Catalyst stability
    is implicitly accounted for by recording the target values at the end of the reaction
    or after every 10 h on stream (see below). We select 11 input features, comprising
    5 process parameters and 6 catalyst properties, that could be relevant to the
    prediction of the


    targets (Table 1), and later perform feature analyses to identify the features
    most relevant to target prediction. Our focus on catalyst properties that can
    be measured for any material, instead of more commonly employed structural, electronic,
    or compositional descriptors [27,29], maximizes the generality of our framework
    across catalyst architectures and formulations.


    Our overall approach is illustrated in Fig. 1. We begin our data curation process
    by searching the Scopus database for all journal articles related to Ni-catalyzed
    DRM published within the past 20 years (search string shown in Supplementary Information
    Text S1). The search returned 1810 articles which were manually reviewed to exclude
    studies that did not report at least one complete data point (i.e., complete set
    of target properties and input features as described above). For instance, purely
    computational studies and studies with incomplete catalyst characterization were
    excluded from the dataset.


    Table 1

    Summary of features selected for machine learning model.


    | Type | Features (Units) | Description |

    | :--- | :--- | :--- |

