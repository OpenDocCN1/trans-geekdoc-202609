    # #### Machine learning algorithms


    The main types of machine learning algorithms that we considered are ensemble
    models, which combine the predictions made by multiple base estimators, particularly
    decision trees, to improve the overall generalizability and accuracy of the ensemble
    over a single estimator [64]. In this work, we adopted tree-based ensemble as
    decision trees are able to learn trends in complex and non-smooth feature space
    by partitioning the feature space into smaller subsets, which offers higher performance
    compared to simpler models such as logistic regression [65]. Compared to more
    popular deep'
