    # 3.2. Prediction of syngas ratio


    We then train RF, GBR, and CatBoost models on the training set to predict the
    syngas ratio of the test set. The performance of each model is evaluated based
    on the coefficient of determination (model score; R^2) and RMSE between the actual
    and predicted syngas ratios. All three models demonstrate good R^2 values of 0.87–0.91,
    among which the CatBoost model exhibited the highest R^2 value of 0.91 and the
    lowest RMSE of 0.053 (see Fig. 3).


    To determine the importance of different features in affecting syngas ratio, we
    perform a feature importance analysis using the SHAP bee swarm plots (see Fig.
    4). The three most important features are reaction temperature, gas hourly space
    velocity (GHSV) and Ni particle size, which have the greatest variance in SHAP
    values as illustrated on the horizontal axis. The bee swarm plot also illustrates
    the expected effects of feature values (represented by the color hue of the points
    in Fig. 4) on the target SHAP value (as shown on the x-axis in Fig. 4). Particularly,
    a higher value of reaction temperature, as indicated by the “swarm” of points
    in pink, results in a higher SHAP value, and thus a higher predicted syngas ratio.
    The model predicts that a lower GHSV and smaller Ni particle size, illustrated
    by the clusters of points in dark blue in Fig. 4, result in a higher SHAP value
    and predicted syngas ratio. Accordingly, higher values of surface area, Ni loading,
    pore volume, H2-TPR peak


    temperature and pore size generally result in a higher predicted syngas ratio,
    whereas a higher CH4 feed fraction results in the opposite. The effects on reaction
    time and modifier electronegativity are less significant on the SHAP values and
    are deemed to be least important. The feature importance determined by Gini importance
    and permutation importance (see Supplementary Information Fig. S4) are largely
    in agreement with our SHAP analysis.


    # 3.3. Effect of process parameters on syngas ratio


    Among the process parameters, the SHAP plots shown above (see Fig. 4) illustrate
    that temperature and GHSV have the most significant effects on the syngas ratio.
    High temperatures thermodynamically favor the strongly endothermic DRM reaction
    over the RWGS side reaction, thus leading to a higher syngas ratio, which is also
    observed in our partial dependence plots (PDPs) (see Fig. 5a) and confirmed by
    thermodynamic simulations in Aspen Plus (see Supplementary Information Fig. S5).
    However, if syngas ratio were fully determined by thermodynamics, then one would
    not expect to observe a change in syngas ratio with the GHSV, but the corresponding
    one-way PDP (see Fig. 5b) instead shows that the syngas ratio initially decreases
    with increasing GHSV before leveling off. Above a reaction temperature of ca.
    800 °C, the model shows that syngas ratio does not change notably in value since
    the RWGS reaction is favored [16]. Such behavior is consistent with a reactions-in-series
    model in which the RWGS rate is dependent on the concentrations of the DRM products
    (i.e., H2), and thus increases as the GHSV is reduced and overall conversions
    increase [53]. Additionally, syngas ratio decreases slightly as CH4 feed fraction
    increases until a value of 0.3, and subsequently appears to level off (see Fig.
    5c). Within our dataset, CH4 feed fraction is a proxy for the extent of feed dilution
    (see Table 1), which, according to Le Chatelier’s principle, should shift the
    equilibrium in favor of DRM while also hindering the forward RWGS reaction. Experimental
    results have also shown that lower CH4 feed ratios in feed lead to a syngas ratio
    that is closer to unity [54]. The PDP of reaction time, which does not have a
    significant effect on syngas ratio, is depicted in Supplementary Information Fig.
    S6. The negligible effect of reaction time, which is intended to capture the effect
    of deactivation, may be due to a bias against the publication of rapidly deactivating
    catalysts.


    From two-way PDPs, we can draw useful interpretations of the effects of two features
    simultaneously on the syngas ratio (see Fig. 6). In particular, they definitively
    exclude the presence of confounding cross-correlation effects between each feature,
