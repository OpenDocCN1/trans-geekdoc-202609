    # 2.2. Data curation


    In this work, we leveraged previously published data to bypass the many time-consuming
    experiments that would otherwise be required. Though the idea of automatically
    extracting the information through text mining may be promising [39,40], we observed
    that published studies on DRM often vary in terms of characterization techniques
    and experimental conditions, which may compromise the interpretability of the
    model [31]. Furthermore, data that is presented graphically (e.g., in a graph
    or figure) instead of textually (e.g., in a table) is often more difficult to
    automatically extract [41]. Therefore, instead of utilizing automated data retrieval
    methods, we manually scanned and extracted data from each article to reduce the
    erroneous data collection incurred by text mining methods. Where necessary, required
    numerical values from graphs presented in literature were extracted from figures
    using a graph reader tool. This procedure resulted in a smaller list of 221 papers
    (Supplementary Information Fig. S1), from which a total of 1637 complete data
    points were extracted by hand.


    The NumPy [42] and pandas [43] software libraries in Python were used to prepare
    the data for visualization and model training. For pre-dicting syngas ratio, outliers
    from the top and bottom 0.5 percentile of the target values for the prediction
    of syngas ratio are removed. These are extreme values and exceptional cases that
    have very few sample points and can therefore compromise the model accuracy. The
    top 0.5 percentile represents catalysts which produce syngas ratio above 1.3,
    which is significantly greater than the expected syngas ratio (less than 1) in
    a DRM process with RWGS as a side reaction. We discuss some reasons for syngas
    ratios greater than unity later in Section 3.1. Conversely, the bottom 0.5 percentile
    represents poor performing catalysts that produce syngas ratios between 0 and
    0.15, demonstrating low, almost negligible, activity for DRM. In both cases, these
    points fall outside the sample space of active Ni catalysts that are of interest,
    and thus may be detrimental to our exploration of properties that lead to a close-to-unity
    syngas ratio. The points removed are indicated in Supplementary Information Table
    S1. Following the convention of the train-test split, the data set was randomly
    partitioned to assign 90% of data points to the train set and 10% to the test
    set. We provide further information on our machine learning workflow in the Appendix.


    # 2.3. Model evaluation and data analysis


    Our work evaluates three ensemble tree models, namely Random Forest (RF) [35],
    Gradient-Boosting Regressor (GBR) [36] and Cat-e-gorical Boosting Regressor (CatBoost)
    [37]. We provide additional details on the implementation of the different models
    in the Appendix


    (and an introduction to their algorithms in Text S2). The scikit-learn library
    [44] was used to apply the RF and the GBR models, and the CatBoost library for
    Python was used to apply the CatBoost Regressor The model performance was evaluated
    using the default root-mean-square error (RMSE) criterion, and the model scores
    determined by the coefficient of determination value R2. For model testing, regression
    plots of the predicted target values against the actual target values were presented
    to illustrate the prediction performance of the trained model. The matplotlib
    library [45] was used for plotting histograms, scatter plots and other data visualization
    methods. The seaborn library [46] was also used to plot heatmaps of the correlation
    matrix for the features to visualize the correlation coefficient between the pairs
    of input features in our dataset. For model interpretation, line plots of one-way
    partial dependence plots (PDP) for each feature variable provided by the scikit-learn
    library were used to visualize the interaction between an input feature and the
    target response. Two-way PDPs were presented as three-dimensional (3D) surface
    plots to visualize the effects of a pair of input features on the target response
    [47]. The trajectory plots used to illustrate the effect of tuning each feature
    value on the partial dependence values on two target variables are obtained by
    first computing the partial dependence values from the trained models, then plotting
    the partial dependence values on a scatterplot with a colormap that illustrates
    the range of feature values. The points depicted consti-tute the 5th to the 95th
    percentiles in the dataset, with a lighter color representing a feature value
    that obtained lower percentile in the dataset and a darker color representing
    a feature value obtained at a higher percentile in the dataset.


    # 2.4. Model Interpretation Techniques


    After model training, we applied model interpretation tools to analyze and visualize
    the different effects of our feature inputs on the target responses. Feature importance
    can be computed based on three different methods, namely the Gini importance,
    permutation importance, and Shapley Additive exPlanations (SHAP) values [48].
    Feature importance plots based on the first two methods (Gini importance and permutation
    importance) were provided by the scikit-learn library, while SHAP plots were implemented
    using the SHAP software library [49]. In particular, the bee swarm plot in the
    SHAP library was applied to visualize the importance of each feature to the model
    and how variance in each feature affects the model output. The Shapley value is
    based on fair allocation results from cooperative game theory to allocate importance
    or credit for a model’s output to its input features, which ranks the impact of
    each feature on the trained model. Theoretical background on the computations
    of feature importance, permutation'
