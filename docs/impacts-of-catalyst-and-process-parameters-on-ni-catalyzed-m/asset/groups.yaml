  mdcn: "\n\n## 基于可解释机器学习的镍催化甲烷干式重整中催化剂与工艺参数的影响\n\nKeerthana Vellayappan, Yifei Yue,\
    \ Kang Hui Lim, Keyu Cao, Ji Yang Tan, Shuwen Cheng, Tianchang Wang, Terry Z.H.\
    \ Gani, Iftekhar A. Karimi, Sibujing Kawi\n\n新加坡国立大学化学与生物分子工程系，新加坡 119260，新加坡\
    \  \n东北大学冶金学院，沈阳 100819，中国\n\n## 文章信息\n\n- 机器学习\n- 非均相催化\n- 甲烷干式重整\n- 合成气\n- 催化剂设计\n\
    \n## 摘要\n\n甲烷干式重整（DRM）是一种利用两种强效温室气体（即 CO2 和 CH4）的有前景技术。尽管活性且稳定的催化剂设计原则已确立，但预测\
    \ DRM 在改变产物 H2/CO 比的竞争性副反应中的选择性仍然具有挑战性。在这里，我们从发表的文献中策划了一组 1638 个数据点，并训练树回归模型，将\
    \ H2/CO 比作为 11 个催化剂和工艺参数的函数进行预测。CatBoost 回归器实现了最佳预测性能，R2 = 0.91。特征重要性分析表明，除了工艺参数对\
    \ DRM 性能的已知影响外，Ni 粒子尺寸和负载量可能在调节 H2/CO 比方面发挥作用，且不受反应物转化率影响。我们的探索性研究凸显了数据驱动 ML 模型在非均相催化中发掘结构-性质关系的能力，通过隔离单个设计参数的影响来实现，这种方法在实验中难以实现。\n\
    \n## 1. 引言\n\n全球变暖的不利影响促使国际社会加大力度应对其有害影响并促进可持续发展，例如协调努力将升温限制在工业化前温度以上 1.5 °C [1]。能够将\
    \ CO2 等温室气体转化为有用化学产品的工艺因此近年来备受关注，作为脱碳化学工业的可能手段 [2]。例如，甲烷干式重整（DRM）（Eq. 1）是生产合成气（即\
    \ CO 和 H2 的混合物）[3] 的蒸汽甲烷重整的一种有前途的替代方法。由于理论 H2/CO 比接近 1，所产生的合成气非常适合通过后续加工制成醋酸或醛类\
    \ [4]，或通过菲希尔-托普谢反应制造柴油和喷气燃料等高值液态烃产品 [5,6]。\n\nCH4 + CO2 ⇌ 2 H2 + 2 CO, ΔH298 K\
    \ = +247.3 kJ/mol (1)\n\n除了作为 DRM 高效催化剂的贵金属（如 Pt）外，某些地球富集元素（如 Ni）也表现出合理的活性，但容易积炭和烧结，从而导致催化剂失活和反应器压力升高等有害影响\
    \ [7, 8]。因此，通过提高地球富集 DRM 催化剂的抗积炭和抗烧结性能来改善其活性和稳定性的策略已得到广泛探索 [4,5,9]。例如，通过高氧迁移率的氧化还原活性氧化物（如\
    \ CeO2 或 ZrO2）进行表面改性，可通过促进 CO2 解离及随后由活性氧物种气化沉积碳来提高抗积炭能力 [10]，而通过介孔通道内的限域可物理抑制烧结\
    \ [11]。值得注意的是，通过将催化剂包覆于多孔可还原氧化物外壳中，可以同时实现这两个优势，其中核-壳结构既能物理防止烧结，又能最大化活性于 CO 形成的\
    \ Ni-可还原氧化物界面位点比例 [12–14]。\n\n与基于 Ni 的 DRM 催化剂相关的另一个挑战——即产物合成气比（H2/CO 比）因副反应逆水煤气变换（RWGS）而低于\
    \ 1 的趋势——受到的关注要少得多。该反应会消耗 H2 并产生 H2O 作为不需要的副产物 [15]。低合成气比是不理想的，因为合成气流在用于下游应用前必须补充\
