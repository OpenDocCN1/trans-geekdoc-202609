    ## 附录：模型细节


    ### 数据和代码可用性


    完整数据集和代码可在 GitHub 上获取（https://github.com/yifei-1021/DRM-ML-Project），需在手稿接受后提供。


    ### 机器学习算法


    我们考虑的主要机器学习算法类型是集成模型，这些模型结合多个基估计器（特别是决策树）所作出的预测，以提高集成模型相对于单个估计器的整体推广性和准确性[64]。在本工作中，我们采用基于树的集成模型，因为决策树能够通过将特征空间划分为更小的子集来学习复杂和非平滑特征空间中的趋势，与逻辑回归等更简单的模型相比，这提供了更高的性能[65]。与更流行的深度学习模型（如多层感知机（MLP））相比，集成模型通常对表格数据表现更好[66]：与
    MLPs 不同，基于树的集成模型不表现出对非平滑目标函数的偏差，且基于树的集成模型对非信息性和共线性特征更稳健[66,67]。此外，基于树的集成模型更容易实现和调优（例如，集成树允许特征直接作为输入到集成模型，而无需进行归一化）。


    基于树的集成模型使用两种主要集成方法，特别是袋装法和提升法。在袋装法中，集成中的每个决策树使用随机采样的训练数据子集进行训练。在梯度提升法中，集成中的基决策树通过与另一个决策树依次拟合来解决之前决策树产生的不准确预测[68]。RF、GBR
    和 CatBoost 算法的更多详细信息载于补充信息文本 S2 中，每个集成树模型的超参数载于补充信息表 S5 中。


    ### 机器学习工作流


    我们的机器学习工作流详细如下：（1）我们执行了一次训练-测试划分（90%-10% 训练-测试）。（2）我们在训练集上使用网格交叉验证来寻找最优超参数。（3）模型在初始划分的训练集上进行训练。（4）模型性能根据测试集进行评估和比较。


    ### Aspen Plus 热力学模拟


    在任何给定温度（即 500°C–800 °C）和大气压（即 1 bar）下，甲烷干重整（DRM）的热力学平衡计算基于最小化多组分系统的吉布斯自由能。假设整个系统包含主要的
    DRM 反应（即 CH4 + CO2 ⇌ 2 H2 + 2CO）及其最突出的副反应，即逆水煤气变换反应（RWGS，即 H2 + CO2 ⇌ H2O + CO）。整个化学系统的总吉布斯自由能（Gtotal）是所涉及各物种化学势之和（即
    CH4、CO2、H2、CO、H2O 和 He，后者用作稀释剂）：


    ```

    $G^{total} = \sum_{i=1}^N n_i \mu_i$ (1)

    ```


    其中 $n_i$ 是物种 $i$ 的摩尔数，$\mu_i$ 是物种 $i$ 的相应化学势。化学势可定义为：


    ```

    $\mu_i = \Delta G_{f_i}^0 + RTln(\gamma_i \hat{\varphi}_i \frac{P}{P_0})$ (2)

    ```


    其中 $\Delta G_{f_i}^0$ 是物种 $i$ 在标准条件下的标准生成吉布斯自由能。$R$ 是摩尔气体常数，$T$ 是温度，$y_i$ 是物种
    $i$ 的摩尔分数，$\widehat{\varphi}_i$ 是物种 $i$ 的逸度系数，$P$ 是操作压力，$P_0$ 是标准条件下的压力。逸度系数 $\widehat{\varphi}_i$
    可以从气相的状态方程建模中估计。根据 Carlson 的状态方程选择决策树，Peng-Robinson 状态方程是非极性化学系统中估计逸度系数的最佳选择，因此被选用于我们的热力学计算[69]。分析在
    Aspen Plus V12 中使用 RGibbs 反应器进行。


    采用相同的模型进行不同温度下不同 DRM 反应程度的热力学模拟，以确定合成气比趋势。使用转化反应器来指定反应程度，并使用 RWGS 的吉布斯平衡反应器来确保
    RWGS 处于平衡转化率。模拟进料是在 1 bar 压力下的未稀释等摩尔 CH4 和 CO 混合物。


