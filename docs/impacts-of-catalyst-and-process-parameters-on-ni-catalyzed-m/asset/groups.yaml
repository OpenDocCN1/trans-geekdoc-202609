    Fig. 6: 成对工艺参数对合成气比影响的双向偏依赖图：（a）反应温度和 GHSV，（b）CH4 进料分数和 GHSV，以及（c）CH4 进料分数和反应温度。表面根据其相对合成气比值着色（蓝色：低，黄色：高）。


