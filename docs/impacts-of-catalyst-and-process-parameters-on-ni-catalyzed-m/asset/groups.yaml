    的已发表研究在表征技术和实验条件方面往往存在差异，这可能会影响模型的可解释性 [31]。此外，以图形方式（例如，在图表或图中）而不是以文本方式（例如，在表格中）呈现的数据，通常更难以自动提取
    [41]。因此，我们没有利用自动数据检索方法，而是手动扫描并从每篇文章中提取数据，以减少文本挖掘方法导致的错误数据收集。在必要时，从文献中呈现的图表中提取所需的数值，使用图形读取工具从图中提取。该程序得到了
    221 篇论文的较小列表（补充信息 Fig. S1），从中手动提取了总共 1637 个完整数据点。


    在 Python 中使用了 NumPy [42] 和 pandas [43] 软件库来准备用于可视化和模型训练的数据。对于合成气比预测，移除了合成气比预测目标值顶部和底部
    0.5 百分位的异常值。这些是极端值和特殊案例，样本点很少，因此可能会影响模型精度。顶部 0.5 百分位代表产生高于 1.3 的合成气比的催化剂，这明显大于在以
    RWGS 为副反应的 DRM 过程中预期的合成气比（小于 1）。我们将在 3.1 节稍后讨论合成气比大于 1 的一些原因。相反，底部 0.5 百分位代表性能较差的催化剂，产生
    0 到 0.15 之间的合成气比，显示出对 DRM 低且几乎可忽略的活性。在这两种情况下，这些点都落在感兴趣的活性 Ni 催化剂样本空间之外，因此可能对我们探索导致接近一的合成气比的特性不利。移除的点在补充信息
    Table S1 中指示。遵循训练-测试划分惯例，数据集被随机划分，将 90% 的数据点分配给训练集，10% 分配给测试集。我们在附录中提供了关于机器学习工作流的更多信息。


    ### 2.3. 模型评估与数据分析


    我们的工作评估了三种集成树模型，即随机森林（RF）[35]、梯度提升回归器（GBR）[36] 和类别提升回归器（CatBoost）[37]。我们在附录中提供了不同模型实现的更多细节（以及它们算法的介绍在
    Text S2）。scikit-learn 库 [44] 用于应用 RF 和 GBR 模型，CatBoost Python 库用于应用 CatBoost 回归器。模型性能使用默认的均方根误差（RMSE）准则进行评估，模型得分由决定系数值
    R2 决定。对于模型测试，展示了预测目标值与实际目标值的回归图，以说明训练模型的预测性能。matplotlib 库 [45] 用于绘制直方图、散点图和其他数据可视化方法。seaborn
    库 [46] 也用于绘制特征相关矩阵的热图，以可视化数据集中输入特征对之间的相关系数。对于模型解释，使用 scikit-learn 库提供的每个特征变量的单向部分依赖图（PDP）折线图来可视化输入特征与目标响应之间的交互作用。双向
    PDP 作为三维（3D）曲面图展示，以可视化一对输入特征对目标响应的影响 [47]。用于说明调整每个特征值对两个目标变量的部分依赖值的影响的轨迹图，是通过先从训练模型计算部分依赖值，然后在带有说明特征值范围的
    colormap 的散点图上绘制部分依赖值得到的。所描绘的点构成数据集中第 5 到第 95 个百分位，颜色较浅代表在数据集中获得较低百分位的特征值，颜色较深代表在数据集中获得较高百分位的特征值。


    ### 2.4. 模型解释技术


    模型训练后，我们应用模型解释工具来分析和可视化特征输入对目标响应的不同影响。特征重要性可以基于三种不同的方法计算，即基尼重要度、排列重要度和夏普利附加解释（SHAP）值
    [48]。基于前两种方法（基尼重要度和排列重要度）的特征重要性图由 scikit-learn 库提供，而 SHAP 图使用 SHAP 软件库实现 [49]。特别是，SHAP
    库中的蜂群图被应用来可视化每个特征对模型的重要性以及每个特征的方差如何影响模型输出。夏普利值基于合作博弈论的公平分配结果，为模型输出分配重要性或信用给其输入特征，从而对每个特征对训练模型的影响进行排序。特征重要性、排列重要度和
    SHAP 值计算的理论背景在补充信息 Text S3 中提供。


    scikit-learn 库中实现的单向和双向 PDP 被用于显示目标值与一组感兴趣的输入特征之间的依赖关系，同时将其他特征的值保持在其均值。换句话说，PDP
    是一种可视化一组特征对训练机器学习模型预测目标响应的边际效应的方法。可以从 PDP 分析说明的趋势中分析工艺参数和催化剂特性对合成气比、CH4 转化率和 CO2
    转化率的预测影响。我们还将 PDP 中观察到的趋势与当前文献中的推理相联系，以突出我们结果的可解释性。


