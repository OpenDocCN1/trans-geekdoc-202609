    To the best of our knowledge, there have not been any studies in the published
    literature that have elucidated the precise effect of metal nanoparticle size
    on syngas ratios over realistic DRM catalysts. Experimentally, it can be difficult
    to isolate the effect of particle size from that of other catalyst parameters
    while also keeping the conversion and extents of coking and sintering unchanged.
    To this end, the approach of Han et al., in which pre-synthesized Ni nanoparticles
    of different sizes are deposited onto an inert support and coated with different
    oxide overlayers to minimize coking and sintering [21], could be promising. On
    the other hand, first-principles computational studies are complicated by the
    need to calculate product yields at high reactant concentrations to match experimental
    conditions, which would necessitate a full microkinetic model in addition to a
    realistic depiction of the working catalyst surface under reaction conditions,
    which can be challenging to obtain for complex catalyst architectures. Nevertheless,
    our present results suggest that such studies are warranted, and work along these
    lines is currently ongoing in our laboratory.


