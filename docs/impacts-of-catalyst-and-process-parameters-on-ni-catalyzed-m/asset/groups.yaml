    # # Impacts of catalyst and process parameters on Ni-catalyzed methane dry reforming
    via interpretable machine learning


    Keerthana Vellayappan , Yifei Yue , Kang Hui Lim , Keyu Cao , Ji Yang Tan , Shuwen
    Cheng , Tianchang Wang , Terry Z.H. Gani , Iftekhar A. Karimi , Sibujing Kawi


    Department of Chemical and Biomolecular Engineering, National University of Singapore,
    Singapore 119260, Singapore

    School of Metallurgy, Northeastern University, Shenyang 100819, PR China


    # ## ARTICLE INFO


    +   - Machine Learning

    +   - Heterogeneous catalysis

    +   - Dry reforming of methane

    +   - Syngas

    +   - Catalyst design


    # ## ABSTRACT


    Dry reforming of methane (DRM) is a promising technology for valorizing two potent
    greenhouse gases, namely CO2 and CH4. Although design principles for active and
    stable catalysts are well-established, predicting selectivity of DRM over competing
    side reactions that alter product H2/CO ratio remains challenging. Here, we curate
    a set of 1638 data points from published literature and train tree regressor models
    to predict H2/CO ratio as a function of 11 catalyst and process parameters. The
    CatBoost regressors achieved best prediction performance with R2 = 0.91. Feature
    importance analysis reveals, in addition to well-known effects of process parameters
    on DRM performance, the potential roles of Ni particle size and loading in tuning
    H2/CO ratio independently of reactant conversions. Our exploratory study highlights
    ability of data-driven ML models to unearth structure–property relationships in
    heterogeneous catalysis by isolating effects of individual design parameters in
    a manner that would be difficult to achieve experimentally.


    # ### 1. Introduction


    The adverse effects of global warming have prompted vigorous international efforts
    to counteract its harmful effects and foster sustainable development, such as
    the coordinated efforts to limit warming to 1.5 °C above pre-industrial temperatures
    [1]. Processes that can convert greenhouse gases such as CO2 into useful chemical
    products have thus received intense interest in recent years as a possible means
    of decarbonizing the chemical industry [2]. For instance, the dry reforming of
    methane (DRM) (Eq. 1) is a promising alternative to steam methane reforming for
    the production of syngas (i.e., a mixture of CO and H2) [3]. With a theoretical
    H2/CO ratio of near unity, the syngas produced is well-suited for subsequent processing
    via oxo chemistry into acetic acid or aldehydes [4], or via Fischer-Tropsch chemistry
    into high-value liquid hydrocarbon products such as diesel and jet fuels [5,6].


    CH4 + CO2 ⇌ 2 H2 + 2 CO, ΔH298 K = +247.3 kJ/mol (1)


    In addition to noble metals such as Pt that are highly active catalysts for DRM,
    certain earth-abundant elements such as Ni also show reasonable activity but are
    prone to coking and sintering which cause


    deleterious effects such as deactivation and reactor pressure buildup [7, 8].
    Hence, strategies for improving the activity and stability of earth-abundant DRM
    catalysts by targeting their coking and sintering resistance have been broadly
    explored [4,5,9]. For instance, surface modification by redox-active oxides such
    as CeO2 or ZrO2 with high oxygen mobility can improve coke resistance by promoting
    the dissociation of CO2 and subsequent gasification of deposited carbon by reactive
    oxygen species [10], and sintering can be physically inhibited by confinement
    within mesoporous channels [11]. Notably, both of these advantages can be simultaneously
    realized via encapsulation within a porous reducible oxide shell, in which the
    core-shell morphology plays a dual role of physically preventing sintering while
    also maximizing the fraction of Ni-reducible oxide interfacial sites that are
    active for CO formation [12–14].


    Another challenge associated with Ni-based DRM catalysts that has received much
    less attention is the tendency for the product syngas ratio (i.e., H2/CO ratio)
    to fall below unity because of the parasitic reverse water-gas shift (RWGS) reaction
    (Eq. 2) that consumes H2 and produces H2O as an unwanted by-product [15]. A low
    syngas ratio is undesirable because the syngas stream must then be replenished
    with H2 before it'
  - '[PAGE 1]


    can be used in downstream applications, leading to increased pre-treatment costs
    [16]. Within the open literature, there are relatively few papers that discuss
    the effects of catalyst properties on the syngas ratio and, more importantly,
    how they can be tuned to increase the syngas ratio [17,18]. While it is sometimes
    postulated that the syngas ratio is largely governed by the thermodynamics of
    the RWGS reaction rather than the nature of the catalyst itself [19,20], this
    is inconsistent with several reported observations of significantly different
    syngas ratios over different catalysts even at the same reaction conditions [21],
    which points to the possibility of targeted catalyst engineering to increase the
    selectivity of the DRM reaction over the RWGS reaction in a manner similar to
    how the thermodynamically favorable coking reaction can be inhibited over coking-resistant
    materials.


    H2 + CO2 <=> H2O + CO, ΔH298 K = +41 kJ/mol (2)


    Machine learning (ML) has seen widespread use in materials design and discovery
    for its ability to uncover correlations across large datasets [22]. Within the
    field of heterogeneous catalysis, ML models have often been employed to overcome
    computational bottlenecks associated with density functional theory (DFT) calculations
    [23] by predicting computable physical properties [24] (e.g., adsorption energies
    and reaction mechanisms [25] (i.e., based on estimated activation energies of
    possible elementary steps) from electronic or structural fingerprints. In a complementary
    approach, ML models can also be trained on experimental data, either extracted
    from published literature [26–28] or generated from high-throughput experimentation
    [29,30], to predict catalytic performance from process parameters and measurable
    catalyst properties [26,31]. This latter approach is particularly useful for multicomponent
    materials with complex architectures that cannot be accurately modeled by presently
    available computational methods (e.g., DFT). In all of these studies, model interpretability
    [31], as can be achieved by feature importance analyses of black-box ML model
    output, is crucial for developing qualitative scientific insights [28] that can
    in turn be leveraged by experimentalists to help develop improved catalysts and
    processes. Compared to inherently interpretable ML methods such as symbolic regression-based
    approaches [32–34], this two-step “gray-box” approach typically offers increased
    prediction accuracy across large and complex datasets [31].


    In this work, we develop interpretable ML models to unearth structure-property
    relationships from the vast body of literature on Ni-catalyzed DRM. Specifically,
    we first gather from the open literature a comprehensive, high-quality dataset
    of catalyst properties, process parameters, and reactivity data, on which we then
    train tree regressor models (random forest – RF [35], gradient boosted regressor
    – GBR [36] and categorical tree regressor – CatBoost [37]) to predict reactant
    conversions and syngas ratios using catalyst properties and process parameters
    as features. We then apply posteriori model interpretation techniques [38] to
    illustrate how each feature influences syngas ratio and reactant conversions.
    In addition to reproducing the well-known effects of temperature, space velocity,
    and feed dilution on DRM performance, the partial dependence plots applied in
    our study also reveal Ni particle size as a potential handle for controlling syngas
    ratio independently of the effects of process operating conditions.


    # 2. Method


    # 2.1. Overall approach


    We select three commonly used quantitative metrics of DRM catalyst performance,
    namely CH4 conversion, CO2 conversion, and syngas ratio (defined as the ratio
    of H2 formation rate to CO formation rate), as our targets. Catalyst stability
    is implicitly accounted for by recording the target values at the end of the reaction
    or after every 10 h on stream (see below). We select 11 input features, comprising
    5 process parameters and 6 catalyst properties, that could be relevant to the
    prediction of the


    targets (Table 1), and later perform feature analyses to identify the features
    most relevant to target prediction. Our focus on catalyst properties that can
    be measured for any material, instead of more commonly employed structural, electronic,
    or compositional descriptors [27,29], maximizes the generality of our framework
    across catalyst architectures and formulations.


    Our overall approach is illustrated in Fig. 1. We begin our data curation process
    by searching the Scopus database for all journal articles related to Ni-catalyzed
    DRM published within the past 20 years (search string shown in Supplementary Information
    Text S1). The search returned 1810 articles which were manually reviewed to exclude
    studies that did not report at least one complete data point (i.e., complete set
    of target properties and input features as described above). For instance, purely
    computational studies and studies with incomplete catalyst characterization were
    excluded from the dataset.


    Table 1

    Summary of features selected for machine learning model.


    | Type | Features (Units) | Description |

    | :--- | :--- | :--- |

    | Process parameters | Ratio of CH4 in feed/ CH4 feed fractiona | Ratio of volumetric
    flow rate of CH4 to the total volumetric flow rate of feed to the catalytic reactor.
    Also equivalent to the CH4 partial pressure. |

    | | Reaction temperature (°C) | Reaction temperature at which the DRM experiment
    was conducted. |

    | | Nickel loading (%)b | Weight percentage of nickel present in the prepared
    catalyst. |

    | | Reaction time (h)c | Reaction time at which the readings for conversions and
    syngas ratio are taken. |

    | | GHSV (ML/gcat·h)d | Gas hourly space velocity of the reaction, defined as
    the total volumetric feed flow rate per unit mass of catalyst per hour. |

    | Catalyst characteristics | Pore size (nm)e | Pore diameter of the catalyst support.
    |

    | | Pore Volume (cm3/g)c | Specific pore volume of the catalyst support. |

    | | Surface Area (m2/g)f | Specific surface area of the fresh catalyst. |

    | | H2-TPR peak temperature (°C)g | Temperature of maximum H2 uptake during temperature
    programmed reduction (TPR). |

    | | Ni particle size (nm)h | Average diameter of Ni nanoparticles on the reduced
    catalysts. |

    | | Modifier electronegativityi | The Pauling electronegativity of the modifiers,
    dopants, or promoters used in the catalyst preparation. |


    a: The CH4:CO2 ratio was always equal to 1 across the entire dataset, while the
    diluent fraction in the feed differed.

    b: Weight loadings determined by inductively coupled plasma (ICP) analysis were
    taken if reported, else the nominal weight loading was used.

    c: The last data point was collected if time-on-stream data is available. For
    experiments exceeding 20 h, multiple data points from the time stream were taken
    at 10-hour intervals.

    d: GHSV is calculated as follows: GHSV (mLgcat⁻¹h⁻¹) = Feed Flow Rate (mLh⁻¹)
    / Catalyst Weight (gcat)

    e: Pore size and distributions are commonly measured using the Barrett-Joyner-Halenda
    (BJH) method, and author-reported average pore diameters and total pore volumes
    were taken.

    f: Values taken were measured using Brunauer-Emmett-Teller (BET) analysis of N2
    physisorption data.

    g: The largest peak was taken if multiple peaks were identified in the reduction
    profile.

    h: Values taken were measured by transmission electron microscopy (TEM) if available,
    otherwise from x-ray diffraction (XRD) data using the Scherrer equation.

    i: A weighted average value was taken if multiple modifiers were present in different
    amounts.'
