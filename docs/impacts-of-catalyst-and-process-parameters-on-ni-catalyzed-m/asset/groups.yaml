    # ## 4. Conclusions


    In this work, we performed an exploratory interpretable ML analysis, trained on
    a comprehensive dataset curated from recent literature, of the effects of process
    parameters and catalyst properties on reactant conversions and syngas ratios in
    Ni-catalyzed DRM. By applying posteriori interpretation methods to the black-box
    ML model results, we were first able to reproduce basic trends concerning process
    parameters that are in accordance with overall thermodynamic analysis of the DRM
    process: higher syngas ratios are favored by higher reaction temperatures, lower
    GHSVs and dilute feeds.


    In terms of catalyst parameters, we observed that the preference for a smaller
    Ni particle size is the primary determinant of high syngas ratios. Furthermore,
    syngas ratio and reactant conversions are moderately correlated and the residual
    variance can largely be attributed to the divergent effects of Ni particle size
    and Ni loading: while syngas ratio decreases with Ni particle size and increases
    with Ni loading, their corresponding effects on reactant conversions are far more
    muted. Thus, in contrast to previous studies on silica-supported catalysts concluding
    that syngas ratio is thermodynamically controlled, our present results that were
    derived over a comprehensive dataset covering diverse catalyst formulations and
    morphologies suggest that the RWGS and DRM reactions can be partially decoupled.
    Our findings also suggest the possibility of designing catalysts, using the metal
    loading, particle size, and pore size as potential handles, that are particularly
    selective for DRM and able to achieve high product syngas ratios at any reactant
    conversion: in particular, our model suggests a combination of smaller particle
    sizes, higher metal loadings and, to a lesser extent, larger pore sizes to be
    beneficial in this regard. At the same time, our exploratory study also highlights
    the potential of data-driven ML models to complement experimental and theoretical
    studies in heterogeneous catalysis by uncovering structure-property relationships
    that can then be investigated in greater detail. Crucially, these models facilitate
    the isolation of the individual effects of the various design parameters, which
    would otherwise be difficult to observe in experimental studies. Subsequently,
    we also anticipate extending our study to predicting optimal DRM catalyst formulations
    by applying global optimization methods that simultaneously consider material
    synthesizability in addition to the effects of different features on target values,
    and leveraging our dataset and similar datasets as training sets for the development
    of automated text mining approaches tailored towards the heterogeneous catalysis
    literature.


    The limitations of our model are primarily related to the bias of published data
    towards high-performing catalysts, which results in a relatively sparse traversal
    of feature space that is not conducive to ML model training. Understandably, this
    bias limits the model from interpreting the effect of the feature over the entire
    range of its values,


    especially at the tail ends of the feature and target distributions. Therefore,
    though the overall trend and the general understanding of feature effect may hold
    true, the accuracy of model interpretation techniques may be less reliable for
    those ranges of feature or target values. Further limitations include the inability
    of electronegativity as a sole descriptor to fully capture the electronic effects
    exerted by catalyst promoters, and the limited generalizability of the PDP trends
    in a large general catalyst dataset to a specific smaller subset of catalyst data
    due to the Simpson’s paradox – in which a trend is observed in several subsets
    of data but the reverse trend is observed for the general dataset [63]. Future
    work will focus on addressing these limitations by incorporating a well-designed
    high-throughput experimental dataset to supplement the sparsely traversed regions
    of our model, and identifying improved descriptors for heteroatom promoters that
    can better describe the interactions between promoter and active metal.


