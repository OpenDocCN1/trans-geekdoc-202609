    while keeping the other features at their average values; in other words, they
    assume that the features are decoupled from each other. Thus, our model points
    to a synergistic effect between higher Ni loadings, and small particle sizes in
    achieving optimal syngas ratios, which is further confirmed by two-way PDPs (see
    Fig. 8a). In practice, high Ni loadings and small particle sizes can be simultaneously
