    ## 4. Conclusions


    在本工作中，我们进行了一项探索性可解释机器学习分析，该分析基于从近期文献中整理的综合数据集训练，研究了工艺参数和催化剂性能对镍催化干重整（DRM）中反应物转化率和合成气比的影响。通过将后验解释方法应用于黑箱机器学习模型结果，我们首次能够复制关于工艺参数的基本趋势，这些趋势与
    DRM 工艺的整体热力学分析一致：更高的反应温度、更低的 GHSV 和稀释进料有利于更高的合成气比。


    在催化剂参数方面，我们观察到偏好较小的镍粒径是高合成气比的主要决定因素。此外，合成气比和反应物转化率呈中度相关，残差方差很大程度上可以归因于镍粒径和镍负载量的不同影响：虽然合成气比随镍粒径增大而降低，随镍负载量增加而升高，但它们对反应物转化率的相应影响要弱得多。因此，与以往得出合成气比由热力学控制的二氧化硅载体催化剂研究相反，我们基于涵盖多种催化剂配方和形貌的综合数据集得出的当前结果表明，RWGS
    和 DRM 反应可以部分解耦。我们的研究结果还表明，有可能利用金属负载量、粒径和孔径作为潜在控制手段，设计出对 DRM 具有特殊选择性且能在任何反应物转化率下实现高产品合成气比的催化剂：特别是，我们的模型表明，较小的粒径、较高的金属负载量以及（在较小程度上）较大的孔径对此有利。同时，我们的探索性研究也凸显了数据驱动机器学习模型在揭示结构-性质关系方面补充多相催化中实验和理论研究的潜力，这些关系随后可以更详细地研究。关键的是，这些模型有助于隔离各种设计参数的个别影响，这些影响在实验研究中否则难以观察。随后，我们还期望将研究扩展到通过应用全局优化方法来预测最佳
    DRM 催化剂配方，这些方法在考虑不同特征对目标值的影响的同时，也同时考虑材料可合成性，并利用我们的数据集和类似数据集作为训练集，开发针对多相催化文献量身定制的自动文本挖掘方法。


    我们模型的局限性主要与发表数据偏向高性能催化剂有关，这导致特征空间遍历相对稀疏，不利于机器学习模型训练。可以理解的是，这种偏差限制了模型对特征在其整个值范围内效应的解释，


    尤其是在特征和目标分布的尾端。因此，尽管整体趋势和特征效应的一般理解可能成立，但模型解释技术对特定特征或目标值范围的准确性可能较不可靠。进一步的局限性包括仅电负率作为单一描述符无法完全捕获催化剂助剂产生的电子效应，以及由于
    SIMPSON 悖论（即在数据的几个子集中观察到一种趋势，但在整体数据集中观察到相反趋势[63]），PDP 趋势在大型通用催化剂数据集中的有限推广性到特定较小催化剂数据子集。未来工作将着重于通过纳入设计良好的高通量实验数据集来补充模型中遍历稀疏的区域，并识别异原子助剂的改进描述符，以更好地描述助剂与活性金属之间的相互作用。


