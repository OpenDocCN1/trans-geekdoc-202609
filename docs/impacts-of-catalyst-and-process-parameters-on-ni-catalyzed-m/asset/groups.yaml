    已有文献提出了解释这些异常高合成气比的机制。首先，在高 CO 浓度下，布杜阿尔反应（2CO <=> CO2 + C）可能更有利，这将降低 CO 的相对浓度并从而提高合成气比
    [51]。其次，特别容易发生甲烷直接分解（CH4 <=> 2 H2 + C）的催化剂会因该副反应产生额外的 H2 [52]。因此，尽管生产 H2/CO 比大于
    1 的合成气在名义上颇具吸引力，但这种行为总伴随着显著的碳沉积，无论是通过布杜阿尔反应还是甲烷分解，都对整体 DRM 过程极为不利。还值得注意的是，转化率和合成气比的分布向右偏斜，最可能指出已发表文献中存在固有偏见，即不愿报告性能较差（会导致较低数值）的催化剂。特征分布的偏度（见补充信息图
    S2 和表 S3）也可能出于同样的原因得到解释。


    最后，我们还可以观察到合成气比与反应物转化率之间存在中等程度的正线性关系（见补充信息图 S3），以合成气比为因变量、反应物转化率为自变量进行线性回归得到的调整
    R^2 为 0.46，RMSE 为 0.14。如果假设在不同 DRM 转化率下 RWGS 步骤均达到完全平衡，则这种关系可以由反应温度对每个参数的共同潜在影响来解释，此前已在
    Ni/SiO2 催化剂 [20] 上得到证实，并通过我们自己的 Aspen 模拟得到确认（模拟细节见附录；结果表提供补充信息表 S4）。从最佳拟合直线的斜率来看，平均反应物转化率每增加
    1%，合成气比约增加 0.005。然而，相关性相对较弱，这促使我们更仔细地审查是否可以识别出独立于反应转化率影响合成气比的特征，我们将在 3.5 节中再次讨论这一点。


    ![](img/16422e279462b2d8ffa23c6682aa47a2_4_0.png)


    Fig. 3: 使用以下回归器预测合成气比的回归图（网格线上显示 R^2、RMSE 和数据分布）及残差分布图：（a-b）随机森林回归器，（c-d）梯度提升回归器和（e-f）CatBoost
    回归器。残差计算为实际目标值与预测目标值之差。


    ## 3.2. 合成气比预测


    我们在训练集上训练 RF、GBR 和 CatBoost 模型，以预测测试集的合成气比。每个模型的性能基于实际合成气比与预测合成气比之间的决定系数（模型得分；R^2）和
    RMSE 进行评估。三种模型均表现出良好的 R^2 值（0.87–0.91），其中 CatBoost 模型表现出最高的 R^2 值 0.91 和最低的 RMSE
    0.053（见图 3）。


    为确定不同特征对合成气比影响的重要性，我们使用 SHAP 蜂群图进行特征重要性分析（见图 4）。三个最重要的特征是反应温度、气体小时空速（GHSV）和 Ni
    粒径，其 SHAP 值在水平轴上表现出最大方差。蜂群图还说明了特征值（由图 4 中点的颜色色调表示）对目标 SHAP 值（如图 4 的 x 轴所示）的预期影响。特别是，反应温度较高（由粉色点“群”表示）会导致较高的
    SHAP 值，从而导致较高的预测合成气比。模型预测，较低的 GHSV 和较小的 Ni 粒径（由图 4 中深蓝色点簇表示）会导致较高的 SHAP 值和预测合成气比。因此，比表面积、Ni
    负载量、孔体积、H2-TPR 峰温和孔径值较高，通常会导致较高的预测合成气比，而较高的 CH4 进料分数则产生相反效果。反应时间和助剂电负性的影响对 SHAP
    值不那么显著，被认为是最不重要的。基于基尼重要性和置换重要性（见补充信息图 S4）确定的特征重要性与我们的 SHAP 分析基本一致。


    ![](img/16422e279462b2d8ffa23c6682aa47a2_5_0.png)


    Fig. 4: 显示合成气比预测特征重要性的 SHAP 蜂群图。


    ## 3.3. 工艺参数对合成气比的影响


    在工艺参数中，上述 SHAP 图（见图 4）表明温度和 GHSV 对合成气比具有最显著的影响。高温度从热力学上有利于强吸热的 DRM 反应而非 RWGS 副反应，从而导致较高的合成气比，这一结果也在我们的偏依赖图（PDP）（见图
    5a）中得到观察，并由 Aspen Plus 中的热力学模拟证实（见补充信息图 S5）。然而，如果合成气比完全由热力学决定，则不应预期会观察到合成气比随 GHSV
    的变化，但相应的单向 PDP（见图 5b）反而显示合成气比在 GHSV 增加时最初降低，随后趋于平稳。当反应温度高于约 800 °C 时，模型显示合成气比数值无显著变化，因为
    RWGS 反应受到青睐 [16]。这种行为与一系列反应模型一致，其中 RWGS 速率取决于 DRM 产物（即 H2）的浓度，因此随着 GHSV 降低和总转化率升高而增加
    [53]。此外，随着 CH4 进料分数增加至 0.3，合成气比略有下降，随后似乎趋于平稳（见图 5c）。在我们的数据集中，CH4 进料分数是进料稀释程度的代理指标（见表
    1），根据勒夏特列原理，这应使平衡向有利于 DRM 的方向移动，同时阻碍正向 RWGS 反应。实验结果还表明，进料中较低的 CH4 进料比会导致更接近 1
    的合成气比 [54]。反应时间的 PDP（对合成气比无显著影响）在补充信息图 S6 中描述。反应时间的可忽略影响（旨在捕捉失活效应）可能是由于对快速失活催化剂发表结果的偏见所致。


    通过双向 PDP，我们可以得出两个特征同时对合成气比影响的有用解释（见图 6）。特别是，它们明确排除了各特征间存在混淆交叉相关效应的可能性，从而证实了我们从单向
    PDP 得出的结论：较低的 GHSV 和增加的进料稀释有利于获得较高的合成气比，这些可作为工艺控制手段，用于实现接近 1 的合成气比。


    ![](img/16422e279462b2d8ffa23c6682aa47a2_6_0.png)


    Fig. 5: 工艺参数对合成气比影响的单向偏依赖图，使用第 1 到第 99 百分位的特征值构建。x 轴上的黑线指示我们数据集中特征的近似分布，每条线表示从最左侧线（第
