    reaction temperatures [60] thus causing conversions and syngas ratios to decrease.


    For textural properties, we observe that syngas ratio increases with surface area
    (see Fig. 7d), pore size (see Fig. 7e) and pore volume (see Fig. 7f) until critical
    values of ca. 400 m²/g, 40 nm, and 1 cm³/g respectively. The effects of pore volume
    and surface area, which are strongly correlated (see Fig. 2), can be attributed
    to increased Ni dispersion which indirectly favors smaller Ni particle sizes.
    The effect of pore size is subtler because it is usually difficult to introduce
    very small pores to common support materials such as mixed oxides, hydroxyapatite,
    and layered double hydroxides. Thus, the observed correlation between pore size
    and syngas ratio may not imply causation and is more likely because the best-performing
    supports for achieving high syngas ratios are difficult to synthesize with very
    small pore sizes.


    Finally, the remainder of the two-way PDPs illustrating the effect of catalyst
    parameters on syngas ratio are shown in Fig. 8d-b. These plots together show that
    the preference for a smaller particle size dominates the determination of syngas
    ratio, with the other catalyst parameters playing relatively minor roles.


    ## 3.5. Decoupling syngas ratios and reactant conversions


    The same process used for the prediction of syngas ratio is used to train a tree
    regressor model to predict CH4 and CO2 conversions. The CatBoost model demonstrates
    good prediction accuracy with test scores (R2) of 0.895 and 0.875 for CH4 and
    CO2 conversions, as shown by the regression plots in Supplementary Information
    Fig. S7. SHAP plots are again used to evaluate the feature importance for predicting
    CH4 and CO2 conversions (see Supplementary Information Fig. S8), and show that
    process parameters, particularly reaction temperature, GHSV and CH4 feed fraction,
    are the most important features for predicting both CH4 and CO2 conversions. However,
    catalyst properties such as pore volume, H2-TPR peak temperature, Ni particle
    size, surface area, and pore size are also of mild importance for predicting conversions,
    in agreement with the relevance of catalyst design for achieving high reactant
    conversions in DRM.


    As discussed in Section 3.1 above, considering the moderate correlation between
    syngas ratio and reactant conversions in our dataset, we focus only on identifying
    where the effects of each feature on reactant conversions and syngas ratio diverge.
    The one-way PDPs of the effects of each feature on reactant conversions are shown
    in Supplementary Information Fig. S9-S10, and two-way PDPs for important feature
    pairs are provided in Supplementary Information Fig. S11-S14. To visualize each
    feature''s simultaneous effect on conversion and syngas ratio, we plot the PDP-predicted
    CH4 conversions and syngas ratios across the range of feature values on the same
    axes (see Fig. 9). The corresponding plots for CO2 conversion are very similar
    and presented in Supplementary Information Fig. S15. In this manner, each feature''s
    contribution to the overall positive correlation between syngas ratio and conversion
    can be decoupled and compared independently.


    With several exceptions, the predicted syngas ratios and CH4 conversions are strongly
    correlated across most features, with slopes that are in general agreement with
    the overall trend (i.e., a ca. 0.005 unit increase in syngas ratio per 1% increase
    in CH4 conversion). The Ni particle size and Ni loading exert much stronger effects
    on syngas ratio than on CH4 conversion. By varying Ni particle size across the
    5th to the 95th percentile of the dataset (ca. 3–26 nm) while holding all other
    features constant at their average values, the predicted syngas ratio decreases
    by ca. 0.011 units for every 1% decrease in the predicted CH4 conversion. Similarly,
    the predicted syngas ratio increases from ca. 0.82–0.85 as Ni loading increases
    from ca. 3–20%, while the predicted CH4 conversion remains almost unchanged (ca.
    61%) across the same range of Ni loadings. These PDP correlation analyses are
    corroborated by the SHAP plots (see Fig. 4 and Supplementary Information Fig.
    S8), which show Ni particle size and Ni loading as the 3rd and 5th most important
    features respectively for predicting syngas ratio, but only the 5th and 9th most
    important features for predicting CH4 conversion. In contrast, pore size affects
    reactant conversions more strongly than syngas ratio: for pore sizes between ca.
    4 and 27 nm, the predicted CH4 conversion varies between ca. 55% and 62% while
    the predicted syngas ratio remains nearly constant (ca. 0.83). Overall, our observations
    highlight the possibility of designing catalysts, using the metal loading, particle
    size, and pore size as potential handles, to tune product syngas ratios at any
    reactant conversion.


    The low importance of Ni loading in predicting conversions may be particularly
    surprising considering that, all else being equal as assumed in the PDP analysis,
    increasing the metal content should increase the number of active sites for the
    DRM reaction. We believe that this could be a result of the current trend in the
    published literature towards highly-dispersed, single-atom catalysts [61] that
    demonstrate excellent DRM activity at relatively low Ni loadings. Our study nevertheless
    points to an independent positive effect of Ni loading on syngas ratio, which
    could motivate future global optimization studies [62] that take into account
    tradeoffs between the synthetic accessibilities of multiple


