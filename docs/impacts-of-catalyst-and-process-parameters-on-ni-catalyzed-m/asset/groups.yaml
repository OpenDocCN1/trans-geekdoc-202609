    ## 3.5. Decoupling syngas ratios and reactant conversions


    The same process used for the prediction of syngas ratio is used to train a tree
    regressor model to predict CH4 and CO2 conversions. The CatBoost model demonstrates
    good prediction accuracy with test scores (R2) of 0.895 and 0.875 for CH4 and
    CO2 conversions, as shown by the regression plots in Supplementary Information
    Fig. S7. SHAP plots are again used to evaluate the feature importance for predicting
    CH4 and CO2 conversions (see Supplementary Information Fig. S8), and show that
    process parameters, particularly reaction temperature, GHSV and CH4 feed fraction,
    are the most important features for predicting both CH4 and CO2 conversions. However,
    catalyst properties such as pore volume, H2-TPR peak temperature, Ni particle
    size, surface area, and pore size are also of mild importance for predicting conversions,
    in agreement with the relevance of catalyst design for achieving high reactant
    conversions in DRM.


    ## 3.5. 解耦合成气比例和反应物转化率


