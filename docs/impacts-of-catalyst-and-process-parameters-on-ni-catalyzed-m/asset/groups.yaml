    除少数例外外，预测的合成气比例和CH4转化率在大多数特征上强相关，斜率总体上与整体趋势一致（即，CH4转化率每增加1%，合成气比例约增加0.005个单位）。Ni粒子尺寸和Ni负载量对合成气比例的影响远大于对CH4转化率的影响。通过将Ni粒子尺寸在数据集的第5到第95百分位（约3–26
