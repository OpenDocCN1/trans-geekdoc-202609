    NeuN (Abcam17787, USA). The immunohistochemistry sections were then photographed
    using a microscope to analyze the electrode-tissue interface.


    # 4. Experimental Section


    Fabrication of uECG Array. The high-density uECG electrodes were fabricated using
    a sandwich structure with electrodes embedded in flexible polyimide (PI), which
    follows a similar process as previously described for the investigation of electrophysiological
    array activities and multimodal neural decoding (2021). A 7 $\mu$m PI layer was
    deposited, followed by the deposition of gold. After sputtering an adhesion layer
    (A S5214, USA), each electrode was etched to define the recording sites. It was
    then spin-coated and covered with an additional 13 $\mu$m PI layer to encapsulate
    the array.


    Intraoperative. Participants in the study were only involved when a clinical necessity
    arose for safe surgery to treat the motor and M1 area. Each participant, confirmed
    that their involvement in the research was voluntary and were informed of the
    risks. They received comprehensive information and provided written consent. The
    study received approval from the Wuhan Hospital Institutional Review Board (Application
    No: YY-2022-09118) and followed the guidelines of the Helsinki Declaration.


    We designed two tasks: the ping-pong-game and the Shake-game. In the ping-pong
    game, the participant used on the left and right sides of the screen to catch
    a ping-pong ball at a constant speed. The paddle could only be moved up or down.
    The game ended when the ball fell off the screen. In the Shake-game, the ball
    moved randomly, and the participant had to move the paddle in four directions
    to catch the ball. The uECG signals were transformed into two features, and the
    game score increased.


    Implantation. The implanted device comprises four components: a uECG array, an
    electrode, a package system, and a connector unit. The connector used was the
    uECG block, which was connected to the electrode array. The electrode array was
    then bonded to the package to facilitate signal transmission and allow simultaneous
    acquisition of all channels. Finally, a customized enclosure serves as the encapsulation
    for the package and is fixed to the skull.


    Post-operative. To evaluate the long-term stability and functionality of the uECG
    block, we performed an in vivo experiment in a control animal. A male lab dog
    was used. The animal was provided by Phaseega Diagnostic Laboratories (Shanghai,
    China), Co., a laboratory institution accredited by the Chinese National Accreditation
    Committee. The experimental protocol was approved by the Animal Care and Use Committee
    (IACUC) of this institution, with application number PJC-22-0184-1. Post-operative
    recordings were collected for six months and determined to monitor long-term physiological
    changes.


    Participants. In the study, eight participants were recruited for the research.
    Prior to the procedure, each participant was informed that the involvement in
    the research was voluntary and the task was to perform in gait analysis. Kinematic
    features were assessed using two methods: by sensing an inertial measurement unit
    (IMU) on the dog''s knee, which was fixed to the leg, and by extracting features
    from multiple joints using video data, deploying motion capture and DeepLabCut
    [9].


    Neural recording. High-resolution uECG signals were amplified and filtered by
    a digital processing unit connected to a 24-channel data acquisition system, the
    Cspur NeuroServer (NeuralCI, USA). In the in vivo experiment, the signals were
    recorded from the dura and skin, and similarly, in the intraoperative experiment,
    the reference and ground electrodes were placed on the dura motor cortex.


    The uECG signals were recorded at a sampling rate of 1000 Hz. All sessions were
    timestamped with start and end times to facilitate data analysis. To calculate
    the data, the high and low state features of the uECG were extracted and the ratio-to-peak
    value of the high state to the low state were calculated [11].


