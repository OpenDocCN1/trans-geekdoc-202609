  md: '# # Chronically Stable, High-Resolution Micro-Electrocorticographic Brain-Computer
    Interfaces for Real-Time Motor Decoding


    Erda Zhou, Xiner Wang, Jizhi Liang, Yang Liu, Qinrong Wang, Xingchen Ran, Lei
    Xia, Xiang Zhou, Changjiang Liu, Liuyang Sun, Li Peng, Liang Chen, Ying Mao, Zehan
    Wu,* Tiger H. Tao,* and Zhithao Chao*


    Brain-computer interfaces (BCIs) enable communication between individuals and
    computers or other devices by decoding brain activity, by reconstructing speech
    and motor functions for patients with neurological disorders. This study presents
    a high-resolution micro-electrocardiography (µECG) based on a flexible, high-density
    µECG electrode array, capable of chronically stable and real-time motor decoding.
    Leveraging micro-manufacturing technology, the µECG achieved a 64-fold increase
    in electrode density compared to conventional electrode arrays, enhancing spatial
    resolution while featuring scalability. Over a 23-day experiment, high-resolution
    µECG fine spatial specificity demonstrated to improve decoding performance while
    reduced implanted devices. These advancements provide a pathway to overcome the
    limitations of conventional BCI. During waking, the µECG enabled stable control
    after 7 min of model training. Furthermore, during 19.8 h, the participant achieved
    robust control with a rate of 1.1 bits per second (bps) under full voluntary control,
    and the rate reached up to 4.5 bps with enhanced user interface. These results
    show that the µECG achieves comparable performance to intracortical electroencephalography
    (iEEG) BCIs without such invasiveness, making a breakthrough in the clinical flexibility
    of BCIs.


    # ## 1. Introduction


    Motor impairments caused by neurological disorders such as stroke, spinal cord
    injury, and amyotrophic lateral sclerosis limits patients'' independence and mobility,
    which drastically affects their quality of life and expectancy. While some computer-aided
    technologies offer potential, they are often inefficient and difficult to use,
    providing less-than-satisfactory experience [1]. BCI allows patients to interact
    with devices directly by their brain activity, offering more effective approaches
    to reconstruct motor function and regain safe independence in daily life [2–5].
    The overall performance of BCI depends on the acquisition methods used for signals,
    such as electroencephalography (EEG), iEEG, and ECo, which suffer from signal
    attenuation across the cortical surface, dura, skull, and scalp [6,7]. Due to
    suboptimal signal quality (to-noise ratio,


