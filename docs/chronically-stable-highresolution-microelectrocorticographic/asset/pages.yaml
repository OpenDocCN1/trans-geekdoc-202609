    Feature Extraction and Motor Decoder. After decomposing the muECG signals, channels
    greater than 1 m were excluded and processed using a Butterworth filter with a
    frequency of 50 Hz and its harmonics. A common reference was used across all channels
    to reduce artifacts and common noise. The muECG signals were bandpass filtered
    and aliased to reduce the time required for analysis to bin 100 ms. The muECG
    signals were extracted (S22 and S23, Supporting Information). Mean values of the
    HAEG features were calculated using sliding window aliasing to provide a continuous
    representation of motor events (S24 and S23, Supporting Information) [34]). By
    feeding the training data into the decoder, the real and kinematic features (events)
    were extracted and classified.


    It employed a recurrent neural network (RNN) with three LSTM layers for motor
    decoding. The input to the decoder was kinematic features at each time step. Each
    of the LSTM layers had 300, 100, and 50, fully connected units as layer. The output
    of the decoder was the predicted kinematic parameters. It used L2 penalty as the
    function, with an initial learning rate of 0.1. The dataset was used for training
    and test in a 2:3 ratio. Performance was evaluated using decayed time and accuracy
    to show the robustness of the decoder (S26, S27, Supporting Information). In short-term
    view, it was used to interpret the motor imagery and motor imagery decoding (S25,
    S27, Supporting Information).


    Performance Indicators of Motor and Motor Imagery Decoding. The performance was
    evaluated based on the kinematic features extracted from muECG within 100 ms.
    To quantify the accuracy of motor decoding, we calculated Correlation coefficients
    between predicted and actual movements. For a more detailed view of accuracy,
    we evaluated the performance of various subsets at different intervals. A sliding
    window was used, resulting in an in-accuracy curve to analyze the short-term stability
    of motor decoding.


    For motor imagery decoding, the hit (BR) was calculated for each trial, according
    to the follows:


    ```

    BR = \frac{\max(S,0)}{T}

    ```


    Where, S is the number of selectable targets, successful trials, failed trials,
    and T is the time for the paradigms, respectively excluding the time that were
    considered failed, with the content demanded in the decoding.


    Decoder Selection for Motor Decoding. The contribution of muECG decoders was assessed
    to evaluate the spatial organization of electro-decoder features. We implemented
    a two-stage approach of electro-decoder selection. In the first stage, we constructed
    decoders using only kinematic features and linked- features. The feature importance
    for each electrode channel was calculated based on the reduction of Gini index.
    In the second stage, we selected a decoder with five channels that had high importance.
    This was used for motor decoding, and additional electrode channels were added.
    This process was repeated for motor decoding as the number of electrode channels
    increased in the subset. The results according to the response of each channel
    were considered to have contributed to decoding in stage.


    Statistics. To assess the significance of muECG electrodes, we calculated the
    cross-correlation function[36] of the cross-signals divided into two segments,
    and the peaks of the cross-correlation were compared with a random distribution.


    for performing tests, we assessed the samples for normality and variance. The
    paired-test was applied to groups of samples that followed a normal distribution
    with equal variances; the Wilcoxon rank-sum test was used. All data analyses were
    performed using MATLAB (R2024, MathWorks).


