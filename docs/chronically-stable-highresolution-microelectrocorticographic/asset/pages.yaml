    Immunochemistry Studies. At the conclusion of the observation, the brain samples
    were collected in vitro. The brain slices were trimmed to 10 x 10 x 0.2 mm and
    placed into labeled bottles. The slices were then dried using a dehydator, to
    a gradient of alcohol, and finally embedded in paraffin. The paraffin sections
    were stained with glial fibrillary acidic protein (GFAP) to identify astrocytes,
