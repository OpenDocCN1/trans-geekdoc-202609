    500 µm）。c) 持续 7 周的长期实验中的电极植入。蓝色标记和红线表示每个会话的平均值，蓝色阴影区域表示标准差。d) 长期实验期间每个会话 µECoG
    信号的信噪比（SNR）。所有会话的准确率（相关系数，CC）。对于每个会话，箱线图表示带有位数（蓝色线）和平均值（红色方形标记）的分位数，须线表示最小值和最大值。显示了运动内准确率的拟合正态分布。
    203 天的纵向分析证明了一致的准确率：X 方向 0.87，Y 方向 0.82，Z 方向 0.83；速度方面 Y 方向为 0.86，Z 方向为 0.78。此外，性能表现出高可靠性，X
    方向的标准差为 0.03，Y 方向 0.02，Z 方向 0.04；速度方面 Y 方向为 0.03，Z 方向为 0.06（图 1e，补充信息）。值得注意的是，Y
    电极表现出足够的稳定性来应对更大的运动幅度。实验后，进行了免疫组织化学分析。病理组织学分析（图 11，补充信息）定量地证实了与对照组（中矢状面基准）相比，没有神经丢失或炎症的证据。定量分析证实没有明显的萎缩/小胶质细胞增殖炎症标记（图
    1g）。这些发现证实了 µECG 电极的稳定性。


    在吞吐量。为了消除由植入区域引起的影响，具有不同网格的电极子集逐渐向 µECG 电极阵列中心收缩，以探索这一问题（图 2）。为了评估密度对运动性能的影响，在皮层区域内固定了不同密度的均匀分布子集。宏观上，随着密度的增加，解码准确率和变异性增加，表明更高的密度可以提高解码性能。所有通道的解码准确率在密度
    64 cells/cm² 时达到最大值。为了确定电极密度的饱和点，解码进一步降低。准确率随采样量的减少而逐渐下降，并在网格大小为 60 cells 时出现下降（图
    2d）。这些发现表明高密度 µECG 在自然运动期间记录提供了最佳性能。


    之前的研究表明 ECoG 具有稳定的空间配置，特别是在 70-350 Hz 范围内，受益于子采样和空间分辨率。然而，为了提高解码性能，少数研究对运动解码进行了研究
    [27]。因此为了阐明电极密度在解码性能中的关键作用，我们增加了电极密度并在 2 x 2 cm 区域获得了每个电极更高的功率。随着电极密度的增加，神经活动以更高的分辨率表示，能够更精确地识别皮层区域（图
    2a）。功能区域也通过相邻电极密度更容易定位。解码性能在三维空间中的投影轨迹与报告的真实轨迹一致（图 2f, 图 13 和补充信息）。解码性能的增强提高了预测运动与真实运动之间的一致性。在合成应用中，这可能会提高用户的反馈、易用性和整体性能。此外，发现增加电极密度和减少伪影可以提高机器学习性能。在体内实验后，对植入电极和对照位（与植入位相邻的中矢状面）的组织进行了免疫组织化学染色（比例尺为
    100 μm）。细胞计数（数据归一化到对照位）和统计分析（对于遵循正态分布的数据，使用了双侧配对检验，否则使用 Wilcoxon 符号检验进行显著性分析，p
    < 0.05，n = 16）显示了神经元（Neuron）、小胶质细胞（Iba）和其他（GAP）。目前基于 ECoG 的运动解码侧重于收集运动皮层（M1）的神经活动，以解码多关节和多方向运动。由于分辨率不足，神经活动的采样一致性仍然有限。Adv.
