  mdcn: "\n\n# 高级科学\n\nwww.advancedscience.com\n\n特征提取与运动解码器。在分解 muECG 信号后，排除了通道大于\
    \ 1 m 的通道，并使用频率为 50 Hz 及其谐波的巴特沃滤波器进行处理。所有通道均使用共同参考以减少伪迹和共同噪声。muECG 信号经过带通滤波和混叠，以将分析所需的时间缩短至\
    \ 100 ms 一个桶。提取了 muECG 信号（S22 和 S23，补充信息）。使用滑动窗口混叠计算 HAEG 特征的平均值，以提供运动事件连续表示（S24\
    \ 和 S23，补充信息）[34]。通过将训练数据输入解码器，提取并分类了真实特征和运动特征（事件）。\n\n它采用了一个具有三个 LSTM 层的循环神经网络（RNN）用于运动解码。解码器的输入是每个时间步的运动特征。每个\
    \ LSTM 层分别具有 300、100 和 50 个全连接单元作为层。解码器的输出是预测的运动参数。它使用 L2 惩罚作为函数，初始学习率为 0.1。数据集按\
    \ 2:3 的比例用于训练和测试。使用衰减时间和准确率评估性能，以展示解码器的鲁健性（S26, S27，补充信息）。短期，它用于解释运动想象和运动想象解码（S25,\
    \ S27，补充信息）。\n\n运动与运动想象解码的性能指标。基于 100 ms 内从 muECG 提取的运动特征进行评估。为了量化运动解码的准确性，我们计算了预测运动与实际运动之间的相关系数。为了更详细地查看准确性，我们评估了不同间隔下子集的性能。使用滑动窗口得到了不准确曲线，以分析运动解码的短期稳定性。\n\
    \n对于运动想象解码，根据以下公式计算每次试验的命中率（BR）：\n\n```\nBR = \\frac{\\max(S,0)}{T}\n```\n\n其中，S\
    \ 分别代表可选目标数、成功试验数、失败试验数，T 是范式时间，排除了被视为失败的且符合解码内容要求的时间。\n\n运动解码的解码器选择。通过评估 muECG\
    \ 解码器的贡献来评价电极解码器特征的空间组织。我们实现了两阶段电极解码器选择方法。在第一阶段，我们仅使用运动特征和链接特征构建解码器。根据 Gini 指数的减少量计算每个电极通道的重要性。在第二阶段，我们选择了一个具有五个高性通道的解码器。用于运动解码，并添加额外的电极通道。随着子集中电极通道数量的增加，重复此运动解码过程。根据每个通道的响应认为其对阶段性解码做出了贡献。\n\
    \n统计学。为了评估 muECG 电极的显著性，我们计算了分为两个部分的交叉信号的互相关函数[36]，并将互相关峰值与随机分布进行比较。\n\n为了进行测试，我们评估了样本的正态性和方差。对符合正态分布且方差相同的样本组应用配对检验；使用\
    \ Wilcoxon 秩和检验。所有数据分析均使用 MATLAB (R2024, MathWorks) 完成。\n\n# 补充信息\n\n补充信息可从 Wiley\
