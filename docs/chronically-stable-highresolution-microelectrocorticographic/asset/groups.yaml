    in throughput. To eliminate the effects induced by the implanted regions, subsets
    of electrodes with varying grids gradually contracted toward the center of the
    muECG electrode array to explore this issue (Figure 2). To evaluate density effect
    on motor performance, uniformly distributed subsets of varying densities were
    fixed within a cortical area. Macroscopically, as density increased, decoding
    accuracy and variability decreased, suggesting that higher density can enhance
    decoding performance. The decoding accuracies in all channels reached their maximum
    at an electrode density of 64 cells/cm². To identify the point where electrode
    density saturates, decoding was further reduced. Reduced accuracy showed a gradual
    decline with diminishing connectivity and a sharp drop at a sampling grid size
    of 60 cells (Figure 2d). These findings demonstrate that high-density muECG offers
    optimal performance for recording cortical activity during natural movements.


    Previous studies have demonstrated that ECoG exhibits stable spatial configurations
    with complex temporal dynamics, particularly in the 70-350 Hz range, benefiting
    from sub-sampling and spatial resolution. However, to improve decoding performance,
    in-few studies on motor decoding have been conducted [27]. Therefore, elucidating
    the critical role of electrode density in decoding performance, we increased the
    electrode density and in a 2 x 2 cm area, we gained higher power of the signal
    from each electrode. As electrode density increased, neural activity was represented
    with greater resolution, enabling more precise identification of cortical regions
    (Figure 2a). Functional areas were also easily located between adjacent electrodes
    by electrode-cell density.


    In decoding performance, the projected trajectories in three-dimensional space,
    aligned the real trajectories reported (Figure 2f, Figure 13 and Supporting Information).
    Enhancement in decoding performance improved the consistency between predicted
    and real movements. In applications motion synthesis or prosthetic control, this
    may improve users'' feedback, enhancing ease of use and overall performance. Furthermore,
    it has been found that machine learning performance improves from increasing electrode
    density and reducing artifacts.


