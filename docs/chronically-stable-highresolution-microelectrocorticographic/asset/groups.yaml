    \ 和 Z. W. 执行了 muECG 提取。Z. W., L. C. 整合了数据。Y. L., J. Y., K. R., L. X., Z. W. 执行了实验。E.\
    \ Z., Q. R., K. X., L. C. 分析了数据。E. Z., Z. T., 和 H. T. 撰写了论文。所有作者讨论了结果并提供了意见。\n\
