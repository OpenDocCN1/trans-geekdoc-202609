    in electrode density compared to conventional electrode arrays, enhancing spatial
    resolution while featuring scalability. Over a 23-day experiment, high-resolution
    µECG fine spatial specificity demonstrated to improve decoding performance while
    reduced implanted devices. These advancements provide a pathway to overcome the
    limitations of conventional BCI. During waking, the µECG enabled stable control
    after 7 min of model training. Furthermore, during 19.8 h, the participant achieved
    robust control with a rate of 1.1 bits per second (bps) under full voluntary control,
    and the rate reached up to 4.5 bps with enhanced user interface. These results
    show that the µECG achieves comparable performance to intracortical electroencephalography
    (iEEG) BCIs without such invasiveness, making a breakthrough in the clinical flexibility
    of BCIs.


    ## 1. Introduction


    Motor impairments caused by neurological disorders such as stroke, spinal cord
    injury, and amyotrophic lateral sclerosis limits patients'' independence and mobility,
    which drastically affects their quality of life and expectancy. While some computer-aided
    technologies offer potential, they are often inefficient and difficult to use,
    providing less-than-satisfactory experience [1]. BCI allows patients to interact
    with devices directly by their brain activity, offering more effective approaches
    to reconstruct motor function and regain safe independence in daily life [2–5].
    The overall performance of BCI depends on the acquisition methods used for signals,
    such as electroencephalography (EEG), iEEG, and ECo, which suffer from signal
    attenuation across the cortical surface, dura, skull, and scalp [6,7]. Due to
    suboptimal signal quality (to-noise ratio, SNR) and spatial resolution, EEG BCIs
    are typically restricted to simple decoding tasks and suffer from high latency[8–10].
    In contrast, iEEG acquired via microelectrode arrays (MEAs) exhibit excellent
    (signal and neural) multiresolution, but are constrained by invasive techniques
    and limited brain coverage[11–13]. CoEEG recorded by electrode arrays on the cerebral
    cortex balances signal quality and waviness, which has shown great potential for
    motor and imagery decoding (Table S1, Supporting Information).


    ## 2. Results


    The workflow of the high-resolution µBCG we proposed is outlined in Figure 1.
    During each session, high-spatial µBCG signals are acquired by an implanted interface
    (Figure 1b; S2, Supporting Information). Subsequently, the neural data undergoes
    preprocessing where the spectral power density (PSD) of the high-gamma (HG) band
    is extracted as feature vectors per electrode channel. Short-term memory (LSTM)
    networks with attention-mechanism (Figure 2; S3, Supporting Information) are designed
    to predict actual movements or sensory intentions from the feature matrix. Additionally,
    an interactive interface provides visual feedback to enhance functional learning
    through a cloud-to-edge architecture, orchestrating raw data to edge devices,
    thereby preserving high-resolution features for model training and neural computing
    tasks.


    However, the density and throughput of conventional BCIs are inherently limited
    due to manufacturing constraints, impeding decoding. Recent high-throughput high-density
    µBCGs represent a technology that remains promising in this address[23–24]. Nevertheless,
    clinical validation necessitates large craniotomies.


    The electrode array, serving as the core component of the BCI, features an electrode
    density of 850 µm and electrode-spacing of 1250 µm. Performance was characterized
    by low impedance (< 1 MΩ at 1 kHz) and root-mean-square (RMS) noise < 2 µV in
    phosphate-buffered solution (S4, Supporting Information). The µBCG signal is recorded
    during data acquisition.


    In this study, we developed a flexible µBCG electrode array with 64 channels.
    The array''s flexibility, mesh-constructed design covers substantial cortical
    area (S1, Supporting Information), while thickened traces provide sufficient mechanical
    robustness for stability, stable acquisition of high-fidelity neural signals.
    A single session is acquired through a flexible printed circuit (FPC).


    The experimental results revealed impressive stability with only a 5.49% decrease
    in decoding efficiency over 20 days in a lab (S5, Supporting Information). For
    each session, we evaluate the PSD to assess the signal quality. Frequency characteristics
    of signals from each channel remain consistent across sessions (S6, Supporting
    Information), and the SNR at >20 Hz (Figure 1d), comparing the stability of the
    µBCG. By comparing the two methods, we demonstrate that the µBCG accurately captured
    and tracked the trends of its capabilities, and this stability was maintained
    throughout the entire experiment.


    The decoding performance was evaluated using real-time motor and imagery-based
    decoding. We conducted a 20-day in-vivo experiment, where real-time motor decoding
    with an accuracy of 0.84 was achieved in a laboratory dog. Following 7 days of
    data collection and decoder training, the participant performed tasks such as
    evoked Ping-Pong and some games which showed brain activity during awake-up state.
    In a 12-day in-vivo paradigm, but paradigms were tested with accumulation, iEEG-BCG-level
    metrics were evaluated with reduced duration[14]. These results provide evidence
    for the feasibility of leveraging high-resolution µBCGs with neural plasticity
    to achieve chronical stable motor reconstruction.


    For imagery decoding, a progressive calibration approach was used to ensure all
    participants could attain full control within 30 days.

