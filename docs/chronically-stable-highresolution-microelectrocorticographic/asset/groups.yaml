    # 用于实时运动解码的长期稳定高分辨率微电极脑机接口


    Erda Zhou, Xiner Wang, Jizhi Liang, Yang Liu, Qinrong Wang, Xingchen Ran, Lei
    Xia, Xiang Zhou, Changjiang Liu, Liuyang Sun, Li Peng, Liang Chen, Ying Mao, Zehan
    Wu,* Tiger H. Tao,* and Zhithao Chao*


    脑机接口（BCIs）通过解码脑活动、重建神经系统疾病患者的语音和运动功能实现个体与计算机或其他设备的通信。本研究介绍了一种基于柔性高密度 µECG 电极列的高分辨率微电极图（µECG），能够实现长期稳定的实时运动解码。利用微制造技术，µECG
    的电极密度比传统电极列提高了 64 倍，在具有扩展性的同时提高了空间分辨率。在为期 23 天的实验中，高分辨率 µECG 的精细空间特异性证明在减少植入设备的同时提高了解码性能。这些进展为克服传统
    BCI 的局限性提供了途径。在清醒期间，µECG 在经过 7 min 模型训练后实现了稳定控制。此外，在 19.8 小时内，参与者在完全自主控制下实现了 1.1
    位/秒（bps）的稳健控制，在增强用户界面后，该速率达到了 4.5 bps。这些结果表明，µECG 在没有此类侵入性的情况下实现了与皮层内电图（iEEG）BCI
    相当性能，在 BCI 的临床灵活性方面取得了突破。


    ## 1. 引言


    中风、脊髓损伤和肌萎侧索硬化症等神经系统疾病导致的运动障碍限制了患者的独立性和活动能力，严重影响了他们的生活质量和寿命。虽然一些计算机辅助技术具有潜力，但它们通常效率低下且难以使用，提供的体验并不理想
    [1]。BCI 允许患者通过其脑活动直接与设备交互，为重建运动功能和在日常生活中恢复安全独立提供了更有效的方法 [2–5]。BCI 的整体性能取决于用于信号采集的方法，如脑电图（EEG）、皮层内电图（iEEG）和皮层电（ECo），这些信号在跨皮层表面、硬膜、颅骨和头皮时会发生衰减
    [6,7]。由于信号质量（信噪比，SNR）和空间分辨率欠佳，EEG BCI 通常局限于简单的解码任务，并存在高延迟问题 [8–10]。相比之下，通过微电极列（MEAs）采集的
    iEEG 表现出优的（信号和神经）多分辨率，但受限于侵入性技术和有限的脑覆盖范围 [11–13]。通过在大脑皮层的电极列记录的 CoEEG 平衡了信号质量和柔性性，这在运动和想象解码方面显示出巨大潜力（表
    S1，补充信息）。


    ## 2. 结果


    我们提出的高分辨率 µBCG 工作流程如图 1 所示。在每个会话中，通过植入式接口采集高空间 µBCG 信号（图 1b；S2，补充信息）。随后，神经数据经过预处理，提取每个电极通道的高伽马（HG）频谱功率密度（PSD）作为特征向量。设计了带有注意力机制的长短期记忆（LSTM）网络（图
    2；S3，补充信息），用于从特征矩阵中预测实际运动或感官意图。此外，交互式界面通过云边协同架构提供视觉反馈，将原始数据调度到边缘设备，从而为模型训练和神经计算任务保留高分辨率特征。


    然而，由于制造限制，传统 BCI 的密度和吞吐量受到限制，阻碍了解码。最近的高吞吐量高密度 µBCG 代表在该领域仍具前景的技术 [23–24]。然而，临床验证需要大型开颅术。


    电极列作为 BCI 的核心组件，其电极密度为 850 µm，电极间距为 1250 µm。性能特征为低阻抗（1 kHz 下 < 1 MΩ）和磷酸盐缓冲溶液中的方根（RMS）噪声
    < 2 µV（S4，补充信息）。在数据采集期间记录 µG 信号。


    在本研究中，我们开发了一个具有 64 通道的柔性 µBCG 电极列。该阵列的柔性和网格结构设计覆盖了大量的皮层区域（S1，补充信息），而加厚的迹线提供了足够的机械稳健性，以稳定采集高保真神经信号。单个会话通过柔性打印电路（FPC）进行采集。


    实验结果显示了令人印象深刻的稳定性，在实验室中 20 天的解码效率仅下降了 5.49%（S5，补充信息）。对于每个会话，我们评估 PSD 以衡量信号质量。每个通道的信号频率特性在不同会话之间保持一致（S6，补充信息），并比较
    >20 Hz 处的 SNR（图 1d）了 µBCG 的稳定性。通过比较两种方法，我们证明了 µBCG 准确捕捉并跟踪了其能力的趋势，且这种稳定性在整个实验过程中得到了维持。


    使用实时运动和基于想象的解码评估了性能。我们进行了为期 20 天的体内实验，在实验室狗中实现了准确率为 0.84 的实时运动解码。在经过 7 天的数据收集和解码器训练后，参与者执行了如诱发乒乓球和某些游戏任务，显示了清醒状态下的脑活动。在
    12 天的体内范式中，范式通过累积进行测试，并在缩短时长的情况下评估了 iEEG-BCG 级指标 [14]。这些结果为利用具有神经可塑性的高分辨率 µBCG
    实现长期稳定的运动重建的可行性提供了证据。


    对于想象解码，使用了渐进式校准方法以确保所有参与者在 30 天内达到完全控制。


    '
