    SNR and spatial resolution, EEG BCIs are typically restricted to simple decoding
    tasks and suffer from high latency[8–10]. In contrast, iEEG acquired via microelectrode
    arrays (MEAs) exhibit excellent (signal and neural) multiresolution, but are constrained
    by invasive techniques and limited brain coverage[11–13]. CoEEG recorded by electrode
    arrays on the cerebral cortex balances signal quality and waviness, which has
    shown great potential for motor and imagery decoding (Table S1, Supporting Information).


    # 2. Results


    The workflow of the high-resolution µBCG we proposed is outlined in Figure 1.
    During each session, high-spatial µBCG signals are acquired by an implanted interface
    (Figure 1b; S2, Supporting Information). Subsequently, the neural data undergoes
    preprocessing where the spectral power density (PSD) of the high-gamma (HG) band
    is extracted as feature vectors per electrode channel. Short-term memory (LSTM)
    networks with attention-mechanism (Figure 2; S3, Supporting Information) are designed
    to predict actual movements or sensory intentions from the feature matrix. Additionally,
    an interactive interface provides visual feedback to enhance functional learning
    through a cloud-to-edge architecture, orchestrating raw data to edge devices,
    thereby preserving high-resolution features for model training and neural computing
    tasks.


    However, the density and throughput of conventional clinical BCIs are inherently
    limited due to manufacturing constraints, impeding neural decoding advancements.
    Additionally, device miniaturization necessitates large craniotomies, excisional
    surgery. Recent high-throughput and high density µBCG electrode arrays represent
    a technology that remains promising in this address[23–24]. Nevertheless, clinical
    vivo and clinical validation of flexible µBCGs for motor or imagery decoding remains
    the main challenge terms of electrode density, stability, and decoding performance.


    The electrode array, serving as the core component of the BCI system, features
    an electrode density of 850 µm and electrode-interface spacing of 1250 µm. Performance
    was characterized by low impedance (< 1 MΩ at 1 kHz) and root-mean-square (RMS)
    noise < 2 µV in phosphate-buffered solution (Figure S4, Supporting Information).
    The µBCG signal is recorded during neural data acquisition. A single session is
    acquired by the electrode array through a flexible printed circuit (FPC).


    In this study, we developed a flexible µBCG electrode array with 64 channels.
    The array''s flexibility, mesh-constructed design covers substantial cortical
    area (Figure S1, Supporting Information), while thickened traces provide sufficient
    mechanical robustness for stability, stable acquisition of high-fidelity neural
    signals. We conducted a 20-day in-vivo experiment, where real-time motor decoding
    with an accuracy of 0.84 was achieved in a laboratory dog.


    For imagery decoding, a progressive calibration approach was used to ensure all
    participants could attain full voluntary control within 30 days.


    The decoding performance was evaluated using real-time motor and imagery-based
    decoding. Following 7 days of data collection and decoder training, the participant
    performed tasks such as evoked Ping-Pong and some games which showed brain activity
    during awake wake-up state. In a 12-day in-vivo paradigm, but days paradigms were
    tested with accumulation, iEEG-BCG-level metrics were evaluated with reduced duration[14].
    These results provide evidence for the feasibility of leveraging high-resolution
    µBCGs with neural plasticity to achieve chronical stable motor reconstruction.


    The experimental results revealed impressive stability with only a 5.49% decrease
    in decoding efficiency over 20 days in a lab (Figure S5, Supporting Information).
    For each session, we evaluate the PSD to assess the signal quality.


    Frequency characteristics of signals from each channel remain consistent across
    sessions (Figure S6, Supporting Information), and the SNR at >20 Hz (Figure 1d),
    comparing the stability of the µBCG. By comparing the two methods, we demonstrate
    that the µBCG accurately captured and tracked the trends of its capabilities,
    and this stability was maintained throughout the entire experiment.


