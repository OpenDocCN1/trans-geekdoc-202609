  \ (3.15)。看看这里发生了什么，非线性函数内部是什么？非线性函数的输入是什么？\n\n`ỳ` = `g(1+3*x[1]-2*x[2])`\n\n(3.15)\n\
  \n嗯，这仅仅是一条二维线，我们可以在我们称为特征空间中绘制这条二维线。在 X 轴上，我们可以看到 `x[1]`，它是第一个输入；`x[2]`，它是第二个输入信号。网络有两个输入，我们可以绘制当等于零时的线。我们可以在这里的特征空间中看到它，如果我们有一个新点，即给这个神经网络的新输入，我们也可以在同一个特征空间中绘制这个新点\
