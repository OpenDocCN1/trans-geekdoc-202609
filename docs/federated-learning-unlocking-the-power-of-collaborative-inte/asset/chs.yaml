  在过去的十年中，人工智能（AI）取得了显著的发展和进步 [1]。首次问世就脱颖出的 AI 系统包括深蓝（Big Blue）、ImageNet 和 Alpha Go。它们促进了更新软件应用的创建，如\
  \ `ChatGPT`、`DALL·E 2` 和特斯拉自动驾驶。深度学习模型和计算机已经能够完成许多人类能力范围内的工作。它们具备感知视觉和听觉刺激、创作视觉艺术、驾驶车辆、参与互动式电子娱乐以及更多活动的能力。人工智能最引人入目的方面曾是增强其速度和智能。然而，现在，仅有智能是不够的。近年来，事故数量显著增加，其他人工智能（AI）犯错导致个人伤害的情况增加。用于预测审判前再犯率的机器学习/深度学习（ML/DL）算法正面临问题。同样，AI\
  \ 驱动的应用可能会对基础性问题提供不准确的回答并面临挑战 [2]，而自动驾驶车辆原型可能缺乏处理罕发但致命场景所需的训练或准备就 [3]。由于上述情况，负责任的人人工智能（RAI）[4]\
  \ 的可靠性有所降低，引发了人们的担忧。如“强人工智能”、“公平人工智能”、“伦理人工智能”、“可解释人工智能”（XAI）等术语已经存在于 [5]。可靠的人工智能是由\
  \ RAI 的一种创新理念。欧盟于 2021 年制定了《人工智能法案》（`AI Act）） [6]。此目的是为 AI 系统开发人员提供指导，说明他们为了获得信任所需的目标和方法\
  \ [7]。这些规则概述了 AI 系统必须持续执行的三项基本活动。首先，人工智能（AI）必须通过政府批准并遵守特定规则。第二个目标应该是确保个人遵守价值观。最后，AI\
  \ 在现实世界场景和数字接口中都有良好的表现至关重要。在扩展这三个基本概念的基础上，可靠的 AI 系统应遵守四项伦理准则：保护个人隐私、尊重其隐私权、确保公平对待以及提供解释。欧盟委员会制定了以下七项标准，旨在增强人们对\
  \ AI 的信心 [5, 8]：\n\n*   人类决策与监督；\n*   增强的耐用性以及对潜在风险的防范；\n*   数据治理与机密性；\n*   透明度；\n\
  *   公平、公正和包容性原则；\n*   地球及其居民的健康；\n*   承担责任。\n\n除了欧盟委员会提供的建议外，专家们还制定了详细的建议，以确保 AI\
  \ 系统的可靠运行并建立其合法性。对可靠 AI 的广泛研究 [8, 5] 确定了可信 AI 的基本属性为解释能力、稳健性、谨慎性和问责制。虽然在今天的背景下，对\
  \ AI 的信任不是唯一决定因素，但它仍然至关重要。个人还希望保持其个人数据的机密性和安全。由于这一状况，开发了新的法规。近期数据保护立法的两个显著例子是欧盟的《通用数据保护条例》（`GDPR`）和美国加利福尼亚州的《加州消费者隐私法》（`CCPA`）\
  \ [9]。若干 `ML/DL` 模型利用分布在不同组并由这些组织在孤岛中独立更新的数据进行训练。因此，AI 系统受到了这些立法进展的影响。`Google` 于\
  \ 2016 年引入了联邦学习（FL）作为保护 AI 数据的一种。`FL` 是一种为机器学习设计的独立模型。虽然联邦的成员有能力与 `FL` 协作，但每个成员对自己的机密信息拥有控制权，这些信息保留在联邦内部。目前，法律禁止公开传播数据，每个个人都必须拥有的信息的个人副本\
  \ [10]。这些原则可能会加剧数据孤岛和碎片化问题。佛罗里达为这些问题提供了一个可行的答案。在佛罗里达，处理隐私问题、保护聚合过程、促进合作、维持责任和监督以及建立用户信任，可靠性至关重要。通过遵守这些标准，个人可以参与协作机器学习项目，通过各种手段有效保护隐私。将维持最高标准的机密性和可靠。评估深度学习、联邦学习（`FL`）和集中式机器学习的可靠性至关重要。机器学习（`ML`）与深度学习（`DL`）的融合带来了对抗攻击、算法偏见、数据泄露和操作挑战等风险。然而，庞的用户群、大量的用户、信息传播以及\
  \ `FL` 的脆弱区域增加了复杂性。这需要对可信度进行调查。此外，佛罗里达在制定开发策略、确保遵守法规、维护公平以及传播机器学习无法实现的信息方面面临困难 [11]。目前为止，关于性支柱的存在、`FL`\
  \ 特定指标以及分析 `FL` 模型可靠性的方法尚不清楚。此外，验证联邦学习的可靠性并使用最新的联邦学习技术至关重要。本章通过解决知识空白做出贡献。\n\n##\
  \ 9.2 相关工作\n\n本节分析了专注于可靠联邦学习（`FL`）的方法论，并定义了可信人工智能（AI）的关键属性，如解释能力、可靠性、隐私、公平性和责任 [8]。另一方面，关于公平\
  \ `FL` 还有更多待发现的证据。与本章使用的方法相似的是 `FedEval` [12]。它深入分析了几个对人工智能可靠性至关重要的因素。\n\n\n\n\n\
  \n一种用于评估联邦学习系统的工具被称为 `FedEval`，它是开源的。该工具对 `FL` 和统一训练在实现预期结果方面的有效性进行了评估。隐私衡量措施研究了新型逻辑攻击对用户的影响。最后，稳定性测量评估了在使用\
  \ fact 非独立同分布（non-IID）数据时不同数据采集技术的性能。文中提出了一种验证 `AL` 模型精度的创新方法，详见 [13, 14]。使用表格化数据评估监督机器学习和深度学习模型的可靠性可能是一个简单、多功能且适应性强的的过程。这涉及到评估模型承担责任、维护公平性和处理错误的能力。这项工作最局限的方面是无法使用\
  \ `FL` 模型。`FL` 高度重视隐私，因为保护整个用户群的数据是其职责。如果你认可 `FL` 模型的发现，则必须严谨且谨慎地收集数据。加密工作包含了一个显著的子集工作和程序。此外还有两种分类：扰动用户和匿名化用户。为了防止只说部分真相的攻击破坏隐私，[15]\
  \ 使用了同态加密、秘密共享和三元梯度等技术。不同个人在不同计算机上执行的模型参数修改可以通过 [16] 实现并保持兼容以便集成。如 [17] 所述，全局差分隐私的使用在\
  \ `FL` 环境下成功保护了隐私健康信息，尽管遇到了中断。这种情景提供了足够的隔离。此外，他们还讨论了利用差分隐私技术混淆客户端训练模型来源的策略。基于匿名化的方法与基于扰动的方法在于，后者在不损害数据可用性的情况下维护了隐私。提出了一种创新方法，用于估计每个训练过程中批处理输入数据差异与本地梯度之间交换的信息。\n\
  \n据我们所知，本章是首次识别、说明并讨论实现有效 `FL` 的基本思想、原则和衡量标准的章节。此外，它提出了一个以前未考虑过的突破性概念：联邦。这一支柱分析了\
  \ `FL` 系统的复杂模式和元素，以评估其可靠性程度。\n\n## 9.3 隐私\n\n`FL` 由于其对保护信息的承诺而日益增长。为了获得公众的信任，`FL`\
  \ 模型必须持续保护用户信息。佛罗里达目前有现有的隐私标准，但对于涉及的公司和人员的可靠性仍存在担忧。对于每个人来说，获取准确信息是重要的，而不仅仅是服务供应商。因此，修改模型参数不应泄露任何数据。确保组内部完全隔离，防止成员之间的任何形式的通信。目前，这种方法是保持机密最有效的方法。即使在启动外部攻击的情况下，信息仍有泄露的可能性。此点的核心思想是使用保护隐私的方法来减轻系统对隐私风险的脆弱性。考虑到整个\
  \ `FL` 过程中信息泄露的可能，信息获取或丢失的程度达到何种？\n\n目前，存在从客户端修改中获取信息的可能性。关于保护您的数据的指导。这一概念探讨了在佛罗里达保护数据的基本方法。\n\
  \n## 9.4 稳定性与强度\n\n对于欧盟委员会而言，破解 `AI` 的挑战是使其可靠的三个属性之一。另外两个属性是遵循既定的标准和行为准则。为了降低攻击或恶意利用的风险，设备必须具备卓越的速度和智能。在过去，已使用了三种不同的方法来研究这一主题。为了评估\
  \ `FL` 模型的稳定性，本文引入了第四种方法。如 [5] 所述，`FL` 模型需要处理威胁的能力。此外，确保训练者和用户拥有韧性的硬件和软件以防止未经授权的访问。这项工作的最终考虑因素是建立数据信任。事实证明，具有强大数据的\
  \ `FL` 模型更可能是可靠的。下面你可以找到有关每个想法的更多信息。具备管理和应对潜在危险情况的能力。佛罗里达允许任何人向 `FL` 模型中引入污染物，可能会损害其教育价值。危害分为两类：对数据的危害和对模型的危害。通常标签会被反转，使得训练数据在被“投毒”后变得危险。为了扩大模型中毒的影响，我们希望以另一种方式进行训练。如果这是一个\
  \ `FL` 攻击，它能够更改梯度或导致不准确的模型更新。这可以通过管理参与者在初始构建或模型替换时的修改来实现。在评估该策略之前，要确定 `FL` 模型具有任何防御机制。通过使这些机制遭受攻击来评估其有效性。\n\
  \n\n\n\n随着用户数量的增加，过程的置信度会降低。为了训练你的联邦学习（FL）模型，你需要精确的设备、网络连接和模型参数。这体现在用户数量上。随着用户数量增加，网络的计算能力和安全性得到了增强。随着客户端数量增加，利用联邦学习（FL）技术变得更加安全。\n\
  \n公司的认可度被作为评估声誉的新颖标准。声誉分使用主逻辑模型对从客户接收的每条通信进行计算。服务器可以验证客户端的本地更新，并确定经过的时间。\n\n用户与其他良好的互动（如提供可靠的更新）会提升其声誉。对于不利的遭遇也是如此。与声誉值低的用户合作是不明智的。\n\
  \n*   以字节（bytes）计算的文件大小\n\n每次，都会使其针对现有的全局模型进行训练，以评估新的本地修改是优是劣。每个用户都有一个特定的数字，代表在一个周期后，客户端的训练对全局模型性能提升的程度。\n\
  \n## 9.5 公平性\n\n数据是 AI 缺乏公平性的根本原因。佛罗里达的用户可能提供不同数量和类型的信息。数据中对全人口的代表性不足可能会导致研究参与者的选择偏差。如果存在选择偏差，可能会导致名称或属性分布不均\
  \ `[11]`。佛罗里达在处理这些每一个问题方面面临着巨大挑战。这部分需要考虑的主要因素是客户的谨慎选择。公平 AI 有两种公平：用户级公平和网络级公平。属于特定网络的用户不应受到不公正对待，这似乎是逻辑性的。无论哪个网络，通过与具有相似特征的人平等对待，为所有用户提供公平对待是重要的。如果你搬到佛罗里达，不受这些规则的约束。在分析性能公平性和类别分布时，我们可能会看到用户层面的现象。然而，该理论考虑了网络的观点。性能公平保证了用户的收益与其提供的信息量直接正比。此外，类别分布彻底检查了所有参与者的数据，以识别标记中的任何不一致之处。\n\
  \n*   退化错误\n\n考试的成功可以根据此数值来确定。对每个用户全局模型的数据进行测试和聚合，以确定测试的准确性。为了获得最高效率，必须让所有用户在考试中获得相同的分数。\n\
  \n*   分数差异\n\n该程序计算特定用户组 `π` 与整个网络之间 F1 分数的差异。此整数的值在 1 到 –1 之间。区分数字应尽可能接近 0。如果将此指数推到全球范围内，它将提供有关客户人口统计的实性数据和机密细节。数据集从每个样本的\
  \ F1 评分将为：\n\n`术语 F1 (Xv−) 特指安全组的 F1 分数。“π”的值计算方式为 F1 (w(X+) – F1 (w (X−)).`\n\n\
  *   劳动力分配的变化-\n\n该值代表数据点与特定集合之间的差异程度。用于指此的术语是变异系数 (`CV`)。\n\n*   准备课程\n\nML/DL 模型的训练集被划分为不同的类别，称为\
  \ `classes`（类）。这决定了选择的数据是否合适，以对完整人口提供精确的描述。\n\n*   分类是不公正的\n\n在观察类别之间的差距时，需要考虑两个不同的视角。识别联邦学习中类别不匹配的更全面的方法是要求每个用户向服务器提供他们自己的类别分布。通过使用额外的平衡样本和神经网络模型的梯度，这种方法允许实现与给定目标的高水平接近。\n\
  \n## 9.6 可解释性\n\nAI 的运行必须严格遵守透明和真实的规范。当涉及到它可以做什么以及时，AI 应该是清晰的。决策对于所有受其影响的人来说是可理解的至关重要。用“可解释性”（interpretability）代替“可解释性”（explainability）是错误的。可解释性的概念处于此层次结构的顶端。该术指的是以被动的方式轻松地理解模型。然而，“可解释性”涉及到理解\
  \ AI 系统内部机制的能力。检查一个基础模型以理解它。事后方法可以增强最初难以理解的复杂模型的解释性。\n\n由于 FL 是使用 ML/DL 模型训练的，计算模型必须能够提供解释。然而，由于需要维护隐私，直接评估未处理的数据或加密的模型特征面临着困难。\n\
  \n*   精确算法\n\n如果一个概念无需任何进一步解释就能很容易理解，那么它可能被认为是清晰的。对这一术语的解释可能根据个人的 IQ 而异。在被计算机感知之前，需要在模型上运行若干次数学检查和方法。此之后，测试通过考虑组件和链接的数量以及每个组件的理解易用程度来评估模型的简单性。人们可以理解决策树、决策规则、逻辑回归、`k-nearest\
  \ neighbors (KNN)` 和 `Bayesian`（贝叶斯）模型。显而易见的成本是什么？有很多方法可以确定模型的维度。\n\n简化模型涉及首先减少其包含的组件或元素数量。这有助于理解。简化模型的有效方法是消除对冗余信息的需求。\n\
  \n由于所有参与者共享相同的综合特征空间，有几种方法可以有效描述一个可能易于用于水平联邦学习的模型。然而，你务必避免向服务器发送任何特征相关的数据，以便进行特征值评分的计算。由于在特征空间上没有完全重叠，因此无法立即应用\
  \ `Shapley Additive explanations (SHAP)` 进行垂直特征学习。`SHAP` 的另一种变体被另一个用户用于评估垂直联邦学习中不同部分的事重要性。\n\
  \n*   生成视觉表示\n\n一些人建议实现一种基于服务器的实时仪表板，从客户端生成到训练和发布的整个生命周期内展示数据。该系统展示了参与每个训练周期的用户列表，以及模型状态。\n\
  \n## 9.7 问责制\n\n\n\n\n欧盟指南 \\[7\\] 列出了 AI 被认为可信赖的七个先决条件。问责是其中之一。在考虑自身责任的同时，优先完成活动至关重要。IBM\
  \ 的研究开创了“事实表”概念的首次迭代。这将被用于记录整个 `ML/DL` 过程中的全面信息。警惕是劳动领域的另一个基本原则。尽管文档非常丰富，但仍需要所有参与者付出巨大努力，以确保生成的\
  \ `FL` 模型严格遵守设计、开发和部署计划。\n\nIBM 通过增强 `FL` 的能力来强化了这一策略。为了生成包括项目、参与人员、数据、模型配置和结果在内的详尽文档，您可以使用\
  \ `FL` 事实表模板。该事实表应仅提供有关额外设置层次的细节，而应避免包含任何有关相关用户的敏感信息，因为 `FL` 的设计非常复杂且优先考虑隐私。继续阅读以发现事实表所审查的内容。\n\
  \n### 项目计划\n\n事实表提供了有关项目历史背景、主要目标和详细时间表的细节。可以在此处获取有关项目的更多信息。项目的目标在主要目标中得到了明确概述，而历史背景提供了有关现有知识和促成该倡议的情况的细节。\n\
  \n包含了 `FL` 员工列表。为了验证填写表单的个人，将确认其身份及其雇主名称。\n\n它记录了与使用 `FL` 技术相关的数据。它由两部分组成：为处理准备准备数据而执行的方法以及数据来源。\n\
  \n只需提供 `FL` 模型设置的详细描述即可。第一步涉及 `ML/DL` 模型的选择和优化策略。随后，聚合器给出全局超参数，包括轮数的上限、最长等待时间和关闭的精度。最后，但同样重要的是，\n\
  \n### 什么是该方法或流程？\n\n事实表的这部分提供了有关您需要获取的特定方法的全面信息。模型的维度、以字节计算的数据上传速率、平均训练时长以及以字节计算的数据下载速率均可见。\n\
  \n### 自动化审计过程\n\n此统计数据有多种用途。可能的方法包括功能测试、用户反馈测试、速度测试或其他方法。它也可能警惕错误或攻击。一些公司甚至会雇佣或补偿经验丰富的黑客来主动寻找安全漏洞，以保持警惕监控。\n\
  \n## 9.8 联邦\n\n指建立一种政治体系，权力在中央机构与各个州或地区之间分配。\n\n`FL` 通过赋予其更多能力来增强这一策略。`FL` 会遇到安全担忧、资源限制和通信困难等挑战性问题。全局模型可能需要更多时间。虽然去中心化可以缓解瓶颈、单点故障和信任问题，但有时会增加网络的复杂性。如果模型训练不当，可能会损害。此外，对\
