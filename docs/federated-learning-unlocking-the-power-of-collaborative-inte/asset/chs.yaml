  \ Tools and Applications, vol. 44, no. 10, pp. 3697–3708, 2022.\n13. 13. H. Boukraichi,\
  \ N. Akkari, F. Casenave, and D. Ryckelynck, “用于波仿真器的卷积神经网络先验压缩，” pp. 1–23, 2023,\
  \ [Online]. Available: [`arxiv.org/abs/2304.04964`](http://arxiv.org/abs/2304.04964).\n\
  14. 14. K. Kishor, “量子计算中密码与机器学习的述与意义，” Quantum-Safe Cryptography Algorithms and\
  \ Approaches: Impacts of Quantum Computing on Cybersecur, pp. 159–175, 2023, doi:\
  \ [10.1515/9783110798159-012](http://doi.org/10.1515/9783110798159-012).\n15. 15.\
  \ D. Berardini, L. Migliorelli, A. Galdelli, E. Frontoni, A. Mancini, and S. Moccia,\
  \ “一种运行在边缘设备上的用于室内视频监控摄像头手枪和刀检测的深度学习框架，” Multimedia Tools and Applications, 2023,\
