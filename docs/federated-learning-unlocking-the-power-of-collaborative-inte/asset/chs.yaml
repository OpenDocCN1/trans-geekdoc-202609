  \n\n\n\n为了进行比较，我们使用了未使用迁移学习（TL）的基准模型以及配置词级迁移的模型，如 `word2vec` 和 `doc2vec`。表 4.6 展示了传统机器学习方法与我们使用的一些\
  \ TL 方法以及词级迁移模型的对比。然而，多项朴素贝叶斯模型（`NBMM`）在准确率、精确率和召回率方面表现良好。这符合 NB 模型的定义，即其在小数据集上的表现预期更好\
  \ [48]。其他模型提供了线性支持向量机（`LSVM`）和逻辑回归（`LR`）。还尝试了结合 `word2vec` 和 `doc2vec` 的 `LR`。两种组合都降低了模型的准确率。`USE`\
  \ 提供了更好的整体召回率和 f1 分数，而 `USE-trained` 提供了最佳的准确率。结果与 Joshi 等人的文献一致 [49]，该研究表明基于句的向量表示性能优于词级模型。\n\
