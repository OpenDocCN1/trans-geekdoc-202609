  \n# 深度学习史\n\nSyed Atif Shah and Nasir Algeani, DOI: 10.1201/9781003466581\n\n##\
  \ 3.1 深度学习\n\n深度学习是一种机器学习（ML），它接收输入数据并产生输出。正如在机器学习中所讨论的，其区别在于它不需要输入数据特征的显式信息。相反，它会自动提取特征，因此，它非常“渴数据”。获取更多数据可以提高它的效率并帮助它变得准确。深度学习算法由神经网络组成。与其他机器学习技术一样，它有一个用于收集待处理信息\
  \ `x` 的输入层，然后是一个或多个隐藏层，最后是一个产生输出（即 `y`）的输出层。在这里，隐藏层设计得更为密集。这些隐藏层负责整个模型的运行功能。\n\n\
  ## 3.2 感知机\n\n构成神经网络的构建单元是神经元。那么深度学习中的神经元是什么呢？我们称之为感知机以及它的工作原理。感知机或单个神经元的思想非常简单。让我们从讨论和描述信息的正向传播开始。\n\
  \n```y = g(\\sum_{i=1}^{m} x_i w_i)\n```\n(3.1)\n\n通过这个模型，我们定义了一组通过 `m` 的输入 `x`。这可以在公式\
  \ (3.1) 中看到。这些输入中的每一个都通过 `n` 与相应的权重 `w` 相乘。我们可以想象如果我们有 `x`，我们乘以 `w`，`x` 乘以 `w`，依此类推。将所有这些乘法相加。它们汇聚在一个和中，然后将此加权和通过非线性激活函数产生最终输出\
  \ `y`；这可以在公式 (3.1) 中看到。现在我们还有另一个项，即偏差项。这允许激活函数向左或向右移动。现在等式的右侧以公式 (3.2) 中的数学公式的形式所示。\n\
  \n```y = g(w + X)\n```\n(3.2)\n\n它可以使用线性代数中的点积和矩阵进行重写，如公式 (3.3) 所示。`X` 是一个 `x` 的输入向量。`X`\
  \ 是一个 `m` 的输入向量，`W` 是一个 `n` 的权重向量。\n\n```\nX = \\begin{bmatrix} x_1 \\\\ \\vdots\
  \ \\\\ x_m \\end{bmatrix}, W = \\begin{bmatrix} w_1 \\\\ \\vdots \\\\ w_m \\end{bmatrix}\n\
  ```\n(3.3)\n\n我们可以通过对这两个向量取点积简单地得到它们的加权和。然后加上我们的偏差。然后应用非线性项。应用该非线性项将标量输入转换为另一个输出\
  \ `y`。\n\n## 3.3 激活函数\n\n激活函数有几种不同的名称，首先是激活函数。非线性激活函数的常见例子是 sigmoid 函数，如公式 (4.4)\
  \ 所示。我们也可以在公式 (3.5) 中看到一个，这是一个接收任何实数并输出零到一之间新数字的函数。\n\n```g = δ(z)\n```\n(3.4)\n\
  \n```\n\\delta(z) = \\frac{1}{1 + e^{-x}}\n```\n(3.5)\n\n它本质是将输入压缩到 0 到 1 的范围内。这只是激活函数的一个例子，但许多激活函数使用神经网络。\n\
  \n## 3.4 常见激活函数\n\n这里有一些常见的，在整个讨论中，我们将看到这些 TensorFlow 代码。最常用的是 sigmoid、双曲函数和正线性单元（ReLU）。我们将使用这些作为一种方式，通过一些来自\
  \ TensorFlow 的基础代码来弥合理论与实践之间的差距。TensorFlow 代码和数学公式分别显示在 TC 3.1 到 TC 3.3 以及公式 (3.6)\
  \ 到公式 (3.12) 中。\n\n```\n\\delta(z) = \\frac{1}{1 + e^{-x}}\n```\n(3.6)\n\n```\n\
  g(z) = g(z)(1 - g(z))\n```\n(3.7)\n\n```tf.nn.sigmoid(z)\n```\nTC 3.1\n\n如上述，sigmoid\
  \ 函数对建模概率非常有用。因为它因为它一样，它将输入压缩在零到一之间。由于概率是在零到一之间建模的，因此这是完美的激活函数。\n\n\n\n\n\n`tanh(z)`\n\
  \nTC 3.2\n\n`δ(z)` = `max(0,z)`\n\n(3.10)\n\n$$\\\\overset{}{g}\\\\left( z \\\\\
  right) = \\\\left\\{ \\\\begin{matrix} {1,\\\\,\\\\\\,\\,\\\\\\,\\,\\\\,\\\\,\\\\\
  ,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\,, z > 0} \\\\\\\\ {0,\\\\,\\\\, otherwise\\\
  \\operatorname{}} \\\\ \\\\end{matrix} \\\\right. \\quad \\text{(3.11)}$$\n\n(3.11)\n\
  \n`relu(z)`\n\nTC 3.3\n\n对于神经网络的末端，如果我们想要预测概率分布。在最后，另一个流行的选择是它们的激活函数 `ReLu`。这个函数的计算极其简单，它是分段线性的，而且非常受欢迎。因为它非常容易计算，所以它在\
  \ `Z` = 0 处具有非线性。当小于零时，该函数等于零；大于零时，它就等于输入。由于这种非线性特性，它仍然能够捕捉激活函数的所有优秀特性，同时保持计算极其简单。\n\
  \n## 3.5 激活函数重要性\n\n我们需要激活函数，但首先应该想到的是我们为什么需要激活函数。激活函数的目的是向网络中引入非线性 [4]。这在深度学习或一般的机器学习中至关重要。在现实生活中，数据几乎总是是非线性的。事实上，如果我们在神经网络中使用线性激活函数，无论网络有多深或多宽，无论它有多少神经元，由于它使用了线性激活函数，我们就无法引入非线性激活函数来让我们近似任意复杂的函数并绘制任意复杂的决策边界。\n\
  \n让我们通过一个简单的例子来理解这一点，即方程 (3.12) 给出的值。想象一个顶部有权重 `W` 的网络，这里 `w[0]` 是 1，`W` 向量是 3,\
  \ –2。这是一个训练好的神经网络，向这个网络输入一个新输入时，我们如何计算输出？记住之前的，我们是点积，我们有偏置，然后计算非线性，共有三个步骤。取我们的基础方程\
  \ (3.13)，然后代入对应的值。\n\n`ỳ` = `g(w[0]+X^(T)*W*)`\n\n(3.12)\n\n$$\\\\grave{y} = g\\\
  \\left( {1 + \\\\begin{bmatrix} x\\_{1} & \\\\\\\\ x\\_{2} & \\\\\\\\end{bmatrix}^{T}\\\
  \\begin{bmatrix} 3 & \\\\\\\\ {- 2} & \\\\\\\\end{bmatrix}} \\\\right) \\quad \\\
  text{(3.13)}$$\n\n(3.13)\n\n`ỳ` = `g(1+3*x[1]-2*x[2])`\n\n(3.14)\n\n我们有 `w[0]`\
