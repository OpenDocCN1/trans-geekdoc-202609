  \n# 4 联邦学习中的用户参与与激励\n\nMuhammad Ali Zeb and Samina Amin\n\nDOI: [10.1201/9781003466581-4](https://doi.org/10.1201/9781003466581-4)\n\
  \n## 4.1 引言\n\n确保机器学习模型用于预测的长期有效性是一项挑战性任务。数据会随时间变化。使用在某些数据上训练的模型对未来数据进行预测可能由于未来数据模式的变化而不再有效。这种情况被称为概念漂移。学习模型需要适应数据的变化才能在长期预测中保持有效。本章讨论了确保自适应学习过程的一些可能技术，包括联邦学习方法的使用。\n\
  \n利用社交媒体平台维持用户对某些问题或产品的兴趣对于公司和政治组织至关重要。本章研究了用户情感的漂移，以及分类模型如何适应 `X` 上不断变化的政治叙事，以应对随时间推对某些政治问题的框架构建。构建政治话语框架和维护用户情绪对于选举和公投等政治活动的结果可能很重要。框架构建是塑造公众对问题或产品认知的重要因素。它是分享关于世界的故事，而不是将其作为知识或信息呈现，这些信息可能包含也不包含事实元素。这些故事通常经过框架构建，以围绕特定问题建立政治叙事。\n\
  \n\n\n\n情感分析可以解释为对在线社交媒体内容或文本中所传的情的情、倾向和意见的计算分析 \\[1, 2\\]或多模态情感分析 \\[3\\]]。社交媒体平台为用户分享他们对政治问题、商业产品（物品）、国家和全球事件以及其他用户感兴趣的领域的观点提供了巨大机会。这些意见展示了用户社区的集体情感。本章利用自然语言处理（`NLP`）和传统的深度学习（`DL`）方法，研究了用户对某一问题随时间以及应对外部事件表达的情感变化。用户情感可能会随推移而变化，因此大多数基于静态情感和主题建模的方法可能不足以提供长期的情感洞察。尽管在处理用户生成的数据时需要考虑隐私问题\
  \ \\[4\\]，但这项工作重点关注探索社交媒体情感的可变性对塑造政治话语的影响。该分析可用于衡量用户对关键政治政策和问题的反馈。一些工作已经总结了用户对特定主题（如电影）的意见\
  \ \\[5\\]。Gamson 等 \\[6\\]提供的数据显示，用户会主动选择与其所属主题组（主题社区）相关的媒体内容，这些内容与普遍意见相关，或将其置于一个对应框架中。这被认为是一种故意的“回声室”或“支柱化”。`NLP`\
  \ 在在线社交媒体文本上的其他应用包括灾害预测 \\[7\\]、疾病检测 \\[8, 9, 10\\]、政治选举 \\[11, 12\\]以及情感分析 \\[13\\\
  ]。虽然可以使用 Aziz、Gul 和 Uddin 提出的方法通过社交网络分析来研究这些复杂网络中的概念漂移 \\[14\\]，但本章仅探索了推文文本来检测漂移的用户意见。\n\
  \n目前已经探索了多种技术，这些技术可以分析社交媒体上政治问题的塑造，以及用户关系如何随时间对某些政治主题和实体发生变化。本章研究了社交媒体用户语言使用模式的变化。本章重点关注以下主要要点：\n\
  \n*   研究如何自动化新数据的情感标记过程，探索与基于词典的方法结合或替代的方法。我们研究了集成分类器的使用，特别是借助词嵌入技术的帮助测试了 `DL` 和\
  \ `TL` 技术的结合。\n*   负面和正面感知取决于用户对某一问题的态度，我们意图识别基于上下文的主题/问题评估，而非仅仅是文本的词义意义。一个人的负面可能是另一个人的正面，反之亦亦然。\n\
  *   结合基于上下文的技术，实现情感分析和文本分类的新数据探索过程的自动化。\n*   通过自动识别对某一问题的负面和正面情感的感知，来识别基于社区的问题评估。\n\
  \n在情感分析和分类过程中发现的一个挑战是缺乏训练集的可访问性。在分类过程中，搜索关键词被用作每个类别的代表，大多数文本都包含这些关键词。另一方面，情感分析可以通过经常用于表达特定类型情感的词汇含义相似性来泛化。例如，文献已将负面词汇归类为负面词典，将正面词汇归类为正面词典\
  \ \\[15\\]已探索了用于关键词提取影响分析的上下文嵌入技术。然后使用不同的评分机制，根据负面和正面词的计数和频率，将新到达的文本分类为负面、正面或中性类。高度偏向的词在文本分类到某个类别时可能有更大的权重。因此，现有的某些词典可以作为起点，以一定程度的准确性为新文本标记情感标签。\n\
  \n本章的目标是识别在数据集较小且缺乏许多训练示例运行时更高效的算法。这项工作从优化具有不同特征的某些监督学习技术开始。我们比较了先进技术与某些迁移学习技术的性能。比较是在传统模型结合如\
  \ `word2vec` 和 `doc2vec` 等深度特征提取方法的模型上进行的。对一些 `TL` 模型进行了实验，并与传统技术的结果进行了比较。叙述提取和分类已用于该组实验。从实验中，我们得出结论：在具有独特特征的大型数据集上，大多数传统模型在分类任务中表现良好。然而，随着训练数据的增加，`DL`\
  \ 技术的表现优于传统模型。当提供少量训练集时，深度 `TL` 方法的表现相对更好。\n\n本章其余部分的结构如下：第 `4.2` 节提供了相关工作背景研究的简要概述。第\
  \ `4.3` 节讨论了自然语言处理流水线和系统设计，第 `4.4` 节概述了深度学习技术，而第 `4.5` 节讨论了结果和评估。\n\n## 4.2 文献综述\n\
  \n关于人们在社交媒体活动中对事件表达的情感文献有很多。一些研究人员从近期情感分析中语言组成部分的成功建模中汲取灵感。本节介绍了以下方面的相关工作：1）情感分析，2）政治框架和叙述提取与分类，以及\
  \ 3）神经网络语言模型——分布式表示。\n\n### 4.2.1 情感分析\n\n年来，情感分析一直用于不同的目的，例如产品推荐 \\[16\\]、位置推荐\
  \ \\[17\\]、用户推荐 \\[18, 19\\]、压力检测 \\[20, 21\\]、以及电影推荐 \\[22\\]。各种方法被用于分析文本中的情感，例如概率图模型\
  \ \\[23\\]、监督学习 \\[24\\]、`NLP` \\[25\\]，等。一些研究人员使用了上下文感知的主题情感建模。Vanzo 等 \\[27\\\
  ]在分析 X 上的情感时考虑了对话语境。\n\n\n\n\n\nHussein 等人 `[28]` 提出了一项调查，强调了情感分析技术评估中面临的挑战所产生的影响。该比较从两个维度进行。在第一次比较中，将评论的情感结构与情感分析挑战之间的关系被视为一种评估挑战。这种比较突显了**领域依赖性**这一核心要素是评估情感分析技术的一项重大挑战。否定句也被强调为另一项挑战，它可能会根据文本结构隐式或显式地改变文本含义。主题的性质和文本结构可能成为情感评估中的重大挑战。\n\
  \nHeikal 等人 `[29]` 完成了另一项有趣的工作，该工作利用深度学习方法，通过社交推文数据对阿拉伯语进行情感分析预测。同样，El Alaoui 等人\
  \ `[30]` 提出了一种新颖自适应方法，针对 2016 年美国大选利用大规模社交媒体数据进行情感分析。他们提出的方法可以检索用户情感并实时分析社交媒体帖子。他们通过将与\
  \ 2016 年美国大选相关的推文数据分类为正面和负面情感，验证了所提方法的实验结果。\n\n短文本分类已使用多种方法，例如集成技术 `[31]`，而本章侧重于深度神经网络和迁移学习方法。尽管本章关注的是政党为其竞选活动生成的叙事分类，以及这些叙事在在线社交媒体（X）上的覆盖和回应，但一些比较政治竞选信息传递与在传统媒体上对这些竞选活动报道的相关研究对本工作至关重要。在进行传统媒体和社交媒体报道的同时对政治竞选进行情感分析，可能允许我们从经验上评估通过负面竞选信息是否可以吸引媒体关注，这是一个由\
  \ `[32]` 研究过的假设。比较政党通过其信息所设定的情感框架（或调性）以及新闻媒体对这些竞选活动的报道，可能使我们能够测试政党通常假设新闻媒体对他们表现出的“负面偏见”。另一个政治方面是，情感分析对于研究和理解负面竞选信息以及负面媒体报道对投票行为的影响是非常有用的。\n\
  \nAmin、Alharbi 和 Uddin `[33]` 执行了其中这样一项工作，其目的是通过应用递归神经网络（RNN）框架来识别句子所指示的政治立场。他们利用众包数据对带有政治意识形态的短语和句子进行标注，以证明对子句内元素进行建模的重要性。关系建模网络（一种基于深度神经网络的方法）最近被用于研究在线社区中的用户社交角色\
  \ `[34]` 以及寻找小说与小说人物之间的关系 `[35]`。\n\n## 4.2.2 政治框架与叙事提取\n\n社交媒体数据可以是研究政党和影响力人物对政治问题进行框架影响的良好资源。这些数据提供了用户感知和意见的描述。对某些问题进行较长时间的持续观察，可以让我们对用户对这些问题的反应、感知和理解普及提供有用的见解。坚持可能可能是让用户对某一问题的感知产生决定性转变的关键。尽管某些领域使用了先进方法来解决隐私担忧\
  \ `[36, 37]`，本工作仅利用用户生成数据的文本，因此尝试避免使用个人用户的身份。\n\n尽管政治框架已被一些研究人员作为社交媒体（特别是 X）的一种现象进行了研究，但通过计算方法从文本中识别框架的工作相对较少。人们通常将经历框架化为特定的感知，以进行有意义的互动。\n\
  \n在文献中，政治框架已从社会和计算的角度得到了研究。社会科学家利用现有的计算方法，利用大量社交和传统在线媒体内容的可用性，来分析和突出社会及政治现象。该领域受益于使用计算方法处理和分析大量数据以研究社会模式。另一方面，研究框架的计算机科学家专注于开发和改进计算语言学和\
  \ NLP（自然语言处理）方法，以提高现有分类器、预测和提取算法的性能。\n\n基于在线社交媒体的叙事分类是一项挑战，尚未被探索，因为缺乏大规模训练数据集且词汇具有非通用性特征，这与情感分析不同。大多数现有研究集中在政治意识形态和倾向已知的政党或人物上。所提出的工作研究用户对政治问题框架的回应。这里的重点是利用用户建模和在线用户社区研究政治情感随时间演变的适应性。尽管传统的机器学习模型仍用于高级分类应用（例如\
  \ Naseem 等人 `[38]` 中），本章探索了深度学习和迁移学习方法，以适应用户情感和用户叙事随时间推的概念偏移。\n\n## 4.3 自然语言处理流程与系统设计\n\
  \n本节介绍了用于分析给定的推文数据以分类社交媒体上政治竞选情感的 NLP 流水线。所提框架由以下六部分组成：`1) 数据获取`、`2) 数据预处理`、`3)\
  \ 特征选择`、`4) 分类`、`5) 优化`以及 `6) 评估模块`。所提模型的解释和验证将在后续章节中讨论。\n\n### 4.3.1 数据获取\n\n本工作的重点是分析社交媒体用户讨论的具有政治意义的主题。我们通过\
  \ X 应用程序接口（API）收集了超过 240 万条推文，涵盖多个主题，如巴拿马文件、停电、政治集会、联合调查小组（JIT）报告等。在收集的 240 万条推文中，有\
  \ 966,201 条进行了情感分析。具体分类见表 4.1。\n\n表 4.1 分布在巴拿马文件、停电、政治集会、JIT、PSL 和登热的推文收集\n\n| 主题\
  \ | 推文数量 |\n| --- | --- |\n| 停电/能源 | 459,757 |\n| 巴拿马文件 | 517,992 |\n| 巴拿马判决 | 274,661\
  \ |\n| 政治集会、聚会 | 784,475 |\n| 伊斯拉兰封锁 | 60,625 |\n| PSL 决赛 | 27,713 |\n| 登热 | 275,000\
  \ |\n| 总计 | 2,400,223 |\n\n### 4.3.2 数据预处理\n\n\n\n\n\n尽管传统信息检索从业者建议将分词、词干提取、词还原和停用词过滤作为预处理步骤\
  \ [39, 40]，但社交媒体文本通常需要更多形式的清洗，如去除噪声、移除或解释标签、表情符号、缩写、链接、提及、回复、点赞/点踩或收藏活动，以及拼写纠正或解释\
  \ [41]。使用了自然语言处理工具包 (NLTK) ^() 等库。\n\n治理期间收集的数据包含超过 240 万条未清洗的推文。在删除非英语和重复推文后，剩余的推文为\
  \ 966,202 条。其中，389,836 条推文关于停电（loadshedding），242,034 条关于马拿马文件（Panama Papers），222,625\
  \ 条关于中巴经济廊（CPEC），83,829 条关于登革热，27,877 条关于马拿马判决。我们还通过关键词搜索删除了与巴基斯坦选举无关的推文，例如来自南非、尼泊尔和其他国家的停电推文，以及斯里兰卡和印度的登革热推文，尽管可能仍然存在一些。某些推文似乎超过了推文规定的\
  \ 140 个字符限制（近期推文为 280 个字符）。仔细观察发现，超文本标记语言 (HTML) 编码尚未转换为文本。\n\n在数据准备的第一步，使用 Python\
  \ 库 `BeautifulSoup` 将 HTML 解码为普通文本。在第二步中，从推文中删除“@”提及。虽然推文中的提及可能带有有关用户间相互作用的有用信息，但我们当前的分析中没有使用这些细节，因此它们对我们没有用。第三步删除了\
  \ URL。与提及一样，URL 也可以有用，但在本分析中并未使用。下一步解码了通用转换格式 – 8 字节字节顺序标记 (UTF-8 BOM)。最后，从推文中删除了数字和\
  \ `#` 符号，保留了带有 `#` 符号的标签文本。`have’nt` 和 `can’t` 等缩写被扩展为 `have not` 和 `cannot`，因为否定词在清洗过程中会被拆分为两部分，句子含义可能会改变。数据清洗过程产生的空条目被删除。\n\
  \n### 4.3.3 文本分类\n\n我们展示了实验，以发现将推文分为五类的优化算法和参数组合。然后配置优化后的分类器，以估计新到达数据的类别。本研究的目标是双重的。在第一阶段，算法在选举前期间（2018\
  \ 年 7 月 25 日，巴基斯坦选举）收集的数据上进行训练，该时间范围大约从一到五年不等，取决于观察的主题以及该主题在社交媒体上的出现情况。为此，我们选择了五个主题，即：马拿马文件、马拿马判决、停电、中巴经济廊\
  \ (CPEC) 和登革热。训练数据由选举前两个月的数据组成。我们将选举前的两个月视为竞选期，因为选举在预定日期整两个两个月宣布，且政府任期被视为已结束。竞选期收集的数据是通用的，使用的查询词包括主要政党名称、政治领袖姓名和地点（即省份名称）。其理念是衡量在持续了一年以上或在现任政府五年期间内某个时间是主要问题的主题中，有多少反映在政党的竞选活动中。在这项工作的第二阶段，使用在政府时期数据数据上训练的优化分类器对竞选期的数据进行分类。这里，政府时期是指选举宣布之前的政府持续时间，在本例中为\
  \ 2013 年 7 月至 2018 年 5 月。这将让我们了解哪些主题随时间推移而流行，并进入政党的竞选口号或政纲。\n\n### 4.3.4 叙事提取 –\
  \ 小规模训练数据\n\n监督学习方法的一个挑战是缺乏训练数据。虽然情感分析等某些领域可以从表情符号和词汇意义等元数据中获益，但在某些领域，词的意图会随着上下文或目标对象而改变。政治叙事是一个高度主观的领域，无法应用基于表情符号或词汇的通用标记。大多数学习算法在大量训练数据、充足的计算资源和适当的参数优化下表现良好。问题在于，当我们训练数据有限，且人工标记既昂贵又极易偏见（特别是在标记政治叙事时）。在这组实验中，我们已经，尽管某些现有算法在有充足数据的情况下表现得更好，但在较少示例数据上训练时，它们难以达到同样的准确水平。在某些情况下，准确率会下降许多倍。本工作的案例研究是\
  \ 2016 年 4 月马拿马文件发布引发法律程序后在巴基斯坦宣布的马拿马判决。该判决导致了该国当时总理的下台，判决被下台总理的支持者和反对者广泛讨论。总理政党将马拿马文件及产生的判决定性为阴谋，而反对者则将其定性为腐败丑闻。我们收集了与问题相关的推文，以分析社交媒体公众的认知。少量高度极化的推文根据所使用的文本和标签进行了标记。标记过程面临若干挑战，例如由于缺乏\
  \ Amazon Turk 等全球标记平台导致资源有限、缺乏精通领域的人员等。标签被视为一种可能的标记方案，但由于使用标签的推文极少，无法应用于整个数据集。另一种用于标记大量社交媒体数据的技术是使用表情符号。由于给定主题的性质，使用表情符号进行标记不可行的，因为带有表情符号的推文数量微乎其微。此外，问题的性质与情感分析不同。表情符号可以是某些积极或负面情绪的清晰表达，但很难从表情符号中提取用户的政治感知。使用负面词汇的用户如果她认为它是阴谋，则可能针对判决；如果她认为它是腐败的证据，则可能针对总理。因此，感知检测问题无法像情感分析那样泛化。这个问题与立场检测和框架构建更相关。\n\
  \n## 4.4 深度学习技术\n\n### 4.4.1 词嵌入技术\n\n\n\n\n\n文本数据通过词嵌入技术被嵌入到数值中进行计算。由于机器学习和深度学习技术无法直接处理文本数据，另一种方法是将文本数据转换为数值向量进行计算。词嵌入是一种基于计数的方法，它通过生成词汇共现矩阵并执行某些降维操作来获取词向量，这优于传统的词频-逆文档频率（TF–IDF）方法[42]。在提出的方法中，使用了由\
  \ Mikolov 等 [43] 提出的 `word2vec` 和 `doc2vec`（文档到向量）[44] 两种嵌入技术。然而，`word2vec` [43]\
  \ 是一种更先进的技术，它利用浅层神经网络将词汇嵌入到低维向量空间中。`word2vec` 模型根据词在句子中出现的情况，得出语料库中每个词的向量数量（维度）。`doc2vec`\
  \ 是一种词嵌入技术，其中每个文档被表示为一个向量。我们使用了 Mikolov 等 [43] 提出的 `doc2vec` 的不同变体，来从每条推文中生成向量。我们将这些向量与机器学习、深度学习和迁移学习模型进行拟合以进行进一步处理。正如\
  \ Lau 和 Baldwin [44] 所建议的，由于 `doc2vec` 的无监督性质，整个数据集被用于训练 `doc2vec`。\n\n目前已开发了多种词嵌入方法，并将\
  \ TF–IDF 作为基准方法。词嵌入方法包括 `doc2vec`、`word2vec`、`fast-text` 和 `glove` 等。在接下来的子节中，将对本工作使用的词嵌入方法进行如下说明。\n\
  \n#### 4.4.1.1 Word2Vec\n\n本工作中使用的另一种词嵌入方法是 Mikolov 等 [43] 开发的 `word2vec`，这是一种更先进的方法，利用浅层神经网络将词嵌入到低维向量空间中。`word2vec`\
  \ 方法根据词在陈述或句子中的出现方式，得出检查语料库中每个词语义和合成意义的维度。在 `word2vec` 中，向量空间中所有具有共同含义的词都会彼此相邻。\n\
  \n本工作利用了 `word2vec` 方法的这些架构，例如连续词袋模型（CBOW）和跳词模型（skip gram (SG)）。先前的研究表明，`SG` 模型是为大规模数据设计的，而\
  \ `CBOW` 模型主要是为中等规模的数据设计的。这些模型的描述如下。\n\n#### 4.4.1.2 连续词袋模型 (CBOW)\n\n`CBOW` 尝试根据周围的上下文词来预测目标词[8]。为了适应词与词之间的关联，这是一个在较小（即中等规模）训练数据上表现更好的核心模型。为了理解\
  \ `CBOW` 模型的视角，考虑一条推文：“all properties leak in Panama”（所有财产在巴拿马泄露）。`CBOW` 模型将尝试学习如图\
  \ 4.1 所示的周围词，然后它将预测在随机选择的与 `leak` 相关的词中，`leak`、`spill`、`drip` 或 `escape` 是最可能的词。像\
  \ `table` 或 `chair` 等词获得的模型关注较少，因为它正在学习预测概率最大的词（图 4.1）。\n\n![FIGURE 4.1 Architecture\
  \ of the CBOW model](img/fig4.1.jpg)\n\nFIGURE 4.1 CBOW 模型架构\n\n#### 4.4.1.3 跳词模型\
  \ (Skip Gram)\n\n`SG` 技术的实现尝试执行与 `CBOW` 实现相反的操作[8]。它的目标是根据目标词来预测上下文词。周围词由窗口大小决定。\n\
  \n为了理解 `SG` 实现的视角，给了一个推文示例，例如：“all properties leak in Panama”，我们选择窗口大小为二，源词（目标词）是\
  \ `leak`。在这种情况下，上下文词为 (all, properties, in, panama)，因此源词组合或集合为 (leak, all), (leak,\
  \ properties), (leak, in), (leak, panama)。研究表明，在样本中，词到源词的距离没有显著作用。然而，上下文词 (all,\
  \ properties, in, panama) 被保留用于训练模型。`SG` 模型在图 4.2 中可视化可视化，其中红色高亮的词是源词，上下文词也显示在输出端（图\
  \ 4.2）。\n\n![FIGURE 4.2 Architecture of the SG model](img/fig4.2.jpg)\n\nFIGURE\
  \ 4.2 SG 模型架构\n\n### 4.4.2 循环神经网络 (RNN)\n\n`RNN` 是一种人工神经网络（ANN）架构[33]，可以处理句子的语法和语义组成。由于文本语料库的顺序结构，研究人员广泛使用循环神经网络进行文本挖掘和分类。`RNN`\
  \ 是一种处理形式为 `x¹)`, …, `x^(T))` 的顺序数据的网络，对序列的前数据点分配更高的权重，使其成为文本数据分类的强大技术。对之前节点的考虑允许对数据集结构进行更好的语义分析。循环神经网络对更长序列的可扩展性使其成为比非序列专门化方法（如卷积网络）更实用的顺序数据分类方法。图\
  \ 4.3 展示了用于顺序数据的 RNN 架构。\n\n![FIGURE 4.3 RNN architecture for sequential data](img/fig4.3.jpg)\n\
  \nFIGURE 4.3 顺序数据的 RNN 架构\n\n### 4.4.2.1 迁移学习（基于上下文的学习）\n\n\n\n\n\n当数据集较大时，上述模型运行良好。然而，当我们没有大量的标注数据时，它们的性能会显著下降。其中一个挑战是从推文中提取叙事叙事。对政治问题的感知可能是主观的，因此无法像情感分析那样通过词汇表进行泛化。我们使用通用句子编码器（`USE`）和神经网络语言模型（`NNLM`）`[45]`，通过对包含\
  \ 500 条推文的小数据集进行标记来解决政治叙事提取问题。使用了两个类别：将巴拿马判决视为阴谋论部分的推文标记为阴谋推文，而将其视为腐败的推文标记为腐败。与词嵌入相比，`USE`\
  \ 可以与单词一起嵌入短语和句子。模型的实现已在 `[46]` 中进行了解释。在这个过程中，变长度文本被配置为输入，输出则生成一个 512 维向量。神经网络语言模型（`NNLM`）由\
  \ Bengio 等人 `[45]` 提出，作为解决维度问题的解决方案。它学习单词的分布式表示，使得每个训练句子都能让模型了解指数级数量的语义相邻句子。该模式同时学习每个单词的分布式表示，以及用这些表示表示的词序列概率函数。如果一个新词序列由单词组成，这些单词与模型已经过的句子单词在分布式表示上相似，则模型通过为该新序列赋予高概率来获得泛化能力。对于这种比较，我们使用了一个在英语\
  \ Google News 200B 语料上训练的预训练模型，并计算出 128 维的向量。该模型可以在 Tensorflow hub ^() 获取。\n\n####\
  \ 4.4.2.2 优化技术\n\n优化深度学习（DL）算法是一项重大挑战。学习算法优化的重点是最小化误差函数（代价函数），这可以提高分类算法的效率。然而，代价函数通常定义为训练阶段的平均值\
  \ `[8]`。在这项工作中，我们整合了以下超参数来优化深度学习模型的性能。\n\n一个优化的文本分类器对于根据现有文本示例实时预测新到达文本的类别至关重要。在训练文本分类的学习算法时，会遇到许多挑战。文本数据可能包含或排除重要的句法和语义细节，这些细节会显著影响分类器的结果和所执行的特定\
  \ NLP 任务。某些任务（如情感分析和政治话语分析）对生成数据的上下文有更深入的洞察。因此，需要整合大量的变量及其组合，以理解并突出显著特征。\n\n最初，算法从两个角度进行优化：推文数据的分类以及相关的情感。推文的类别是用于搜索和收集推文数据的查询词。这种优化的目的是让分类器能够将新到达的推文归类到类别中。这对于理解话语随时间和事件的持续性是一项重要措施。算法在随时间的五个类别上进行训练，新数据被用作未见的测试集将其归类到这五个类别。\n\
  \n## 4.5 结果与评估\n\n本节通过对推文中的政治叙事和情感分析进行分类，评估了所提工作的效率和潜力。所展示的结果是通过遵循标准评估方法 `[47]`\
  \ 执行各种实验实现的，以验证所有研究目标。实验和结果使用 Python (3.6 版本) 和 Anaconda 框架 ^() 进行。\n\nTABLE 4.2\
