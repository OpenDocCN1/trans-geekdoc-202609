  \ w_i x_i + b$$\n\n\n\n\n现在我们已经熟悉了感知器，并且知道了如何组合它们来创建非常复杂的深度神经网络。让我们来看看如何应用它们。在获取了关于神经网络及其工作原理的基础知识后，现在是时候向实现迈出更深的一步了。让我们从一个简单的双输入特征模型开始。为了简单起见并理解过程，我们将一个特征设定为参加课程的次数，另一个特征设定为花费在最终项目的小时\
  \ [7]。\n\n现在，如果我们想知道这门课是及格还是不及格……我们也可以应用自己创建的这张地图。我们无法承担既不去听课又在最终项目上花费五个小时，却想知道自己是否能及格。我们想构建一个神经网络来学习这一点。通过观察以前（之前）获得分数的人，并判断他们是否及格或不及格。这时我们有两个输入，一个是\
  \ 4，另一个是 5。这些输入被馈到一个具有三个隐藏单元的单层神经网络中，我们看到了最终输出。我们通过这门课程的概率是 0.1 或 10%，这真的是个坏消息。我们能猜到为什么处于特征空间这一部分的这个人会在那儿吗？看起来他们实际上处于这个特征空间的一个很好的部分。看起来他们将会通过这门课程。为什么这个神经网络在这里给出了如此糟糕的预测？这个网络没有经过训练，本质上，这个网络就像一个刚出生的婴儿，它不知道什么是课程。它不知道什么是最终实验，对这个世界一无所知。\n\
  \n## 3.8 经验损失 (Empirical Loss)\n\n这些数字是随机初始化的，对问题一无所知，所以我们必须训练它。我们必须教它如何获得正确答案。因此，我们要做的第一件事是在网络犯错时告诉它，以便我们将来可以纠正它。在神经网络中如何做到这一点？神经网络的损失实际上定义了网络何时做出错误的预测。它接收输入并预测输出。\n\
  \n$$J\\left( w \\right) = \\left( {\\frac{1}{n}\\sum\\limits\\_{i = 1}^{n}\\mathcal{L}(f(x\\\
  _{}{}\\}^{(i)};W),y\\_{}{}\\}^{(i)})} \\right)$$ \n\n(3.19)\n\n然后将真实值（ground truth）实际输出与预测输出组合在一起。如果预测输出和真实输出相互接近，这本质上意味着损失将非常低。它没有犯错，但如果真实输出与预测输出相远，这意味着它应该有非常高的损失。它应该有很多错误，这个网络应该纠正这一点。现在假设我们不仅有来自一个学生的数据，还有来自许多不同的及格和不及格这门课程的学生的数据。因此，我们关心这个模型不仅适用于某一个学生，而且适用于整个学生群体。我们称之为**经验损失**，它只是所有单个学生损失的平均值。我们可以通过使用公式\
  \ (3.19) 计算这些每个学生的损失并取其平均值来完成。在训练网络时，我们想要做的不是最小化任何特定学生的损失，而是想要最小化整个训练集的损失。现在，我们想要使用不同的损失函数，因为我们神经网络的输出是不同的。\n\
  \n## 3.9 均方损失 (Mean Square Loss)\n\n这是一个二分类问题，我们的输出是 0 或 1。我们已经学过，当分类器为 1 时，我们可能会使用\
  \ softmax 输出。对于那些不熟悉交叉熵的人来说，这个想法实际上是 50 多年前在麻省理工学院的一篇硕士论文中引入的。它被广泛应用于热力学等不同领域，现在被应用于机器学习和整个信息理论\
  \ [8]。它在这里做的本质上是计算这个 0, 1 输出与真实输出之间的损失，即学生及格或不及格。让我们假设现在不是计算 0 或 1 输出，而是想计算实际的成绩，即通常在课程中给出的。现在它不是\
  \ 0, 1，而是成绩，可以是任何数字。\n\n$$J\\left( w \\right) = \\left( {\\frac{1}{n}\\sum\\limits\\\
  _{i = 1}^{n}{(y\\_{}{}\\}^{(i)} - f(\\_{}x\\_{}{}\\}^{(i)};W))}^{2}} \\right)$$\
  \ \n\n(3.20)\n\n所以我们必须定义问题。在这个例子中，我们不再只优化 0 或 1 损失，而是优化任何实数，因此我们使用均方误差损失；使用公式 (3.20)，并在\
  \ TC 3.9 中了 TensorFlow 代码。\n\n```\nloss = tf.reduce_mean(tf.square(tf.subtract(model.y,\
  \ target)))\n```\n\n## 3.10 训练神经网络\n\n现在我们想要使用不同的损失函数，因为我们神经网络的输出是不同的。而且定义损失是深度学习中的门艺术。\n\
