  \n## 8.1 引言\n\n近年来，人工智能（AI）已逐渐影响了人类生活的方方面面。集成海量数据的现代深度学习（DL）算法提供了深度学习（DL）技术，这是解决现实世界问题的一种具价值的工具。但随着新增和额外的深度学习（DL）应用开始出现，保护信息机密性正成为一个关注的问题\
  \ [1]。为了训练模型，旧的深度学习（DL）技术总是需要大量的信息，其中许多信息包含复杂数据。训练过程通常在联邦服务器上进行。\n\n\n\n\n\n许多研究人员已经提出了解决隐私和安全关注问题的解决方案，包括同态加密\
  \ [2]、差异隐私 [3]以及联邦学习。Google 最初在 2016 年展示了联邦学习原型 [4]$。根据 Google 的说法，联邦学习最初在 `Google\
  \ Keyboard` 上实现，主要有两个原因：保护输入法者的私有信息，以及提高语音模型的质量 [5]$。\n\n在当今数据驱动的世界中，大多数应用程序和服务（如与医疗健康、自动驾驶和金融相关的服务）都是由人工智能（AI）技术和复杂的机器学习（ML）算法驱动的。根据预测，人工智能将“比人类历史上任何事物都更改变世界”，并且在人类生存的各个方面已经取得了进展。集中式存储和计算是\
  \ AI 技术尚未实现其完全可能性、以及此类应用实现一直面临持续困难的主要原因之一。\n\n绝大多数现实情况涉及在数据孤岛中生成和存储数据（尤其是个人数据），这些数据孤岛可能是服务提供者的数据中心或终端用户的设备。由于大多数传统的机器学习是以集中方式跟踪的，因此训练数据必须在数据服务器上进行合并。从本质上说，通过稳定管理处理信息，对分散在多个信息基础的异构数据进行收集、聚合和整合需要大量工作。在组织之间传输高速、真实且海量的异构数据面临着诸多挑战，其中由于行业竞争、复杂的行政流程，以及最重要的是信息安全规则和准则（例如欧盟的《通用数据保护条例》GDPR）。在经典机器学习算法中，在强大的云服务器上进行重要信息的收集和分发，存在着单点故障和严重数据泄露的风险。首先，由于集中数据处理和管理导致的系统透明度和溯源性差，可能会终端用户对系统失去信任，并使符合\
  \ GDPR 变得更有挑战性。\n\n联邦学习（FL）作为解决这些问题的潜在手段，引起了学术界和工业界的关注。通常来说，FL 是在去中心化的协作学习环境中实现机器学习算法的方法。算法不是在中央数据服务器上收集和处理训练数据，而是运行在各个数据源或本地节点上的本地数据集上，如\
  \ `PCs`、可穿戴设备、平板电脑和智能手机。FL 将训练数据集和计算留在内部站点，同时允许本地节点协作训练共享的 ML 模型。需要一个中央服务器来协调训练过程（集中式\
  \ FL），或使用点对点的底层网络基础设施（去中心化 FL）来聚合训练结果并计算全局模型，因为只以特定的频率交换训练结果（即参数） [6]$。\n\n由于遵守监管大量个人数据收集和处理的严格保护法存在困难，传统的以云为中心的机器学习算法在许多情况下不再适用。\n\
  \n### 8.1.1 分布式学习背景\n\n在大数据的背景下，分布式学习系统和方法一直是许多研究的主题。为了缩短模型训练的总时间，之前的的研究要么关注实际系统特征，要么关注理论收敛速度。最早的分布式学习算法之一是批量同步并行\
  \ (`BSP`) 算法。一种更可行的方案是异步同步并行 (`SSP`) 算法，它允许工作节点在预定时间内处于不同步。实际上，`SSP` 现在是许多正在使用的分布式参数服务器设计的核心。\n\
  \n根据任务的不同：\n\n- **数据共享 – 0 级**：每个用户在本地收集并准备数据后，将其私有或匿名化的数据上传到中央服务器。服务器确定合并的数据以完成任务。\n\
  - **模型共享 – 1 级**：每个用户设备 (`UE`) 能够使用自己的数据创建本地机器学习模型，然后将训练好的模型共享到服务器。\n- **信息交换 –\
  \ 2 级**：在处理本地信息后提取的知识（例如各种属性之间的关系）被进一步共享，这与共享机器学习模型不同。\n- **结果共享 – 3 级**：每个模型仅传输结果或输出到主服务器，任务训练完全在本地处理。\n\
  \n### 8.1.2 现有的分布式学习框架\n\n存在几种现有的分布式学习框架，可以促进跨设备或服务器的机器学习模型训练。该领域是动态的，可能会出现新的框架。\n\
  \n**表 8.1** 市场上的分布式学习框架\n\n| 框架 | 目的 |\n| --- | --- |\n| TensorFlow Federated (`TFF`)\
  \ | 由 Google 建立，`TensorFlow` 是一个专门为联邦学习设计的开源框架。它允许在分散的设备上计算机器学习模型，同时解决机密性担忧。 |\n\
  | Apache Spark MLlib | `Apache Spark MLlib` 是 Apache Spark 项目的一部分，提供了分布式机器学习能力。它允许在集群上进行可扩展的机器学习，并支持多种用于分类、回归和聚类的算法。\
  \ |\n\n\n\n\n\n| PySyft | `PySyft` 是一个用于加密、隐私保护机器学习的 Python 库。它提供了安全多方计算和联邦学习的能力，并构建在\
  \ `PyTorch` 和 `TensorFlow` 等著名的深度学习框架之上。 |\n| Leaf | `Leaf` 是一个开源联邦学习框架，为研究人员和开发者提供了一个简单的接口，用于实验和部署联邦学习系统。\
  \ |\n| PaddleFL | `PaddleFL` 是由 `PaddlePaddle`（一个开源深度学习平台）开发的联邦学习框架。它在保护数据隐私的同时支持协作模型训练。\
  \ |\n| SyferText | `SyferText` 是 `PySyft` 的扩展，是一个隐私保护的自然语言处理（NLP）库。它允许通过联邦学习在跨去中心化数据源上训练\
  \ NLP 模型。 |\n| FLAME | 联邦学习框架（`FLAME`）是一个开源联邦学习框架，支持多种机器学习模型，并为边缘计算环境而设计。 |\n| PyTorch/Federated\
  \ | `PyTorch/Federated` 是 `PyTorch` 的扩展，能够实现联邦学习。它允许用户为跨设备的去中心化训练定义模型和训练程序。 |\n\
  | Microsoft Federated Learning (MS FL) | 由微软开发，该框架侧重于实现联邦学习场景。它与微软机器学习框架集成，并提供隐私保护机器学习的工具。\
  \ |\n| Horovod | `Horovod` 是由 Uber 开发的开源分布式深度学习框架。它旨在通过诸如 `ring-all` 等高效通信技术，在多个\
  \ GPU 和服务器上扩展深度神经网络的训练规模。 |\n\n## 8.2 文献综述\n\n隐私漏洞是传统机器学习中最受关注的问题之一。工业领域的企业会投入资金来保护其知识产权。然而，传统的机器学习（ML）和深度学习模型优化经常会违反这些隐私准则。为了对模型进行训练、验证和测试，必须将大量的海量数据保留在强大的处理能力附近。为了防止数据泄露或攻击，这些关键数据集需要在高安全级别上进行协调和整合\
  \ [7]。但威胁依然存在。因此，典型的机器学习技术中存在安全风险，使得必须寻找替代方案。联邦学习提出了一种新架构作为这些问题的解决方案，以限制数据传输，从而减少数据足迹。尽管联邦学习已应用于大多数情况，但研究人员表明仍有许多问题需要解决。例如，大量研究表明，在许多现实世界中，最初设计用于保护隐私的联邦学习比传统的深度学习框架更容易受到恶意节点的攻击。由于参数是联邦学习服务器收集的唯一信息——客户端的身份保持私密——因此匿名客户端可能由攻击者组成，攻击者会向服务器上传恶意数据\
  \ [8]。\n\n通过采用基于环上误差学习（`RLWE`）的加密，可以提供保护隐私的机器学习。然而，在现实应用中实施这一策略面临着许多困难。其中一个困难是基于\
  \ `RLWE` 的加密具有显著的计算和通信开销，这会导致训练时间过长。此外，对于机器学习应用的特定设置，尚未对基于 `RLWE` 加密的安全性保障进行彻底的分析\
  \ [9]。对于无人机网络（IoD）背景，Pu 等人 [10] 引入了 `PMAP`，一种轻量级的隐私保护相互认证和密钥协商系统。为了在设备网络（IoD）系统的通信实体之间提供相互认证和安全会话密钥，`PMAP`\
  \ 使用物理不可克隆函数（`PUF`）和混沌系统。与当前的认证密钥算法（`AKA`）和 `IBE-Lite`（一种标准策略或方案）相比，评估表明 `PMAP`\
  \ 在计算成本、能量消耗、通信开销以及对安全攻击的韧性方面具有优越的性能 [11]。\n\nSala 等人利用延迟微分单元（`DD-Cell`）作为熵 [12]\
  \ 提出了一种可重构架构，该架构在现场可门阵列（`FPGAs`）平台上将物理不可克隆函数（`PUF`）与真随机数生成器（`TRNG`）相结合。与之前的 `PUF+TRNG`\
  \ 架构相比，他们的工作在 `PUF` 和 `TRNG` 性能之间提供了良好的权衡，在紧凑性和 `TRNG` 吞吐量方面展示了竞争性的结果。另一方面，我们的研究通过提出一种既轻量又保护隐私的多密钥加密，解决了物联网安全的一个不同方面。这确保了数据在不可信环境的传输和聚合过程中保持机密\
  \ [13]。\n\n## 8.3 分布式学习中的隐私挑战\n\n### 8.3.1 联邦学习中的隐私保护\n\n隐私保护是联邦学习的一个关键方面，联邦学习允许在持有本地数据样本的去中心化设备或服务器上进行模型训练，而无需交换数据。以下是联邦学习中隐私保护的一些关键技术和考虑。\n\
  \n#### 同态加密 (HE)\n`HE` 通过在加密机制内交换参数来保护用户隐私。在 `HE` 中，处理原始数据的过程被用于将其加密为密文。该过程在不需要解密的情况下操作明文；类似于线性代数运算。模型或数据不共享，且无法从对方模型的数据中推断出来。\n\
  \n#### 安全多方计算 (SMC)\n`SMC` 与多个双方或客户端工作，它们提供私有输入以协作计算单个数据或输入，同时保持完全机密。通过使用安全方计算（`2PC`），`SecureML`\
  \ 允许数据所有者在两个不合意的服务器上加密、处理并秘密分发其数据。它属于双服务器模型类别，允许每个客户端在合并后的数据上训练不同的模型，而除了结果外不共享任何内容。然而，这样做会带来巨大的处理和通信负担，可能会阻碍参与者的合作。这种方法是一种用于安全聚合的快速、安全、容错的协议，由\
  \ [3] 提出。\n\n#### 秘密共享\n秘密共享是一种密码学技术，它保证了秘密由 `N` 份份额组成，并且只有当足够数量的份额连接时才能重建。这些方法已应用于传统方法。该方法展示了如何将数据（或秘密）`S`\
  \ 分为 `n` 个部分，使得从任何 `m` 个部分都可以轻松重建 `S`；然而，即使知道任何 `m` − 1 个部分的所有细节，也不会透露关于 `S` 的任何信息。\n\
  \n### 8.3.2 隐私攻击\n\n\n\n\n\n虽然分布式学习提供了许多优势，但它也带来了独特的隐私挑战。在分布式学习中，“隐私攻击”是指可用于从机器学习模型或数据训练集中获取未经授权的私有数据的访问方法或策略。试图为了非法目的访问敏感或机密数据的恶意行为者，或者可能无意中危害数据隐私的合法用户，都可能实施此类攻击。在接下来的章节中，我们将介绍与分布式学习相关的几种常见的隐私威胁。以下是与分布式学习相关的一些关键隐私攻击。\n\
  \n### 8.3.2.1 模型反转攻击\n\n该技术涉及首先在目标模型（即你的模型）的输出上训练一个反转模型——另一种类型的机器学习模型。预测目标模型的输入数据或原始数据集是反转模型的职责。通过分析反转模型做出的预测结果，攻击者可能会发现关于数据主体的细节，而这些细节是你并不希望目标模型披露的。\n\
  \n差分隐私、联邦学习和安全多方计算是可以阻止此类攻击的几种安全机制：\n\n*   `Differential privacy`：这通过向数据中引入噪声来保护个人隐私的方法。该方法确保模型结果中不会泄露任何个人身份数据点。差分隐私通过在数据中引入噪声，为数据隐私的保护提供了统计保障。\n\
  *   `Federated learning`：通过使用这种安全方法，多个设备可以协作训练机器学习模型，而无需向单个服务器披露其个人信息。联邦学习涉及设备加密更新其本地模型并将其发送到中央服务器，由服务器合并这些修改并传输新的全局模型。这种方法通过确保数据留存在设备上且不被中央服务器访问，从而保护数据隐私。\n\
  *   `Safe multi-party computing`：通过使用这种方法，多方可以在其私有数据上协作计算某个函数，而不向对方泄露任何信息。在安全多方计算中，每个参与者在与他人共享数据之前都会对其进行加密。为了获得预期结果，各方在不泄露任何个人信息的情况下计算加密数据。\n\
  \n### 8.3.2.2 模型窃取攻击\n\n模型窃取攻击技术用于机器学习即服务（ML-as-a-service），以破解秘密机器学习模型。Orekondy\
  \ 等人（2019）提出了伪造攻击（knockoff attack）框架，攻击者攻击模型的架构、采样方法和数据分布，这些可能与受害者的选择有所不同。作者证明，当攻击者利用与受害者模型相当的训练数据，以及学习能力高于受害者模型的模型时，攻击模型的预测性能会提高。[14]]\
  \ 的最新研究表明，一种新型的模型窃取攻击可以增强攻击模型的预测性能，在这种攻击中，攻击者可以利用受害者的预测输出及其解释。\n\n训练模型是非常昂贵的，因为它需要收集大量的相关样本、准备数据以解决特定问题、识别高效的机器学习模型并为其提供所需的计算能力。如果竞争对手无需任何努力，就能直接拿走你刚刚设计的模型呢？这种攻击被称为模型提取攻击或模型盗取攻击。与实践中的几种对抗攻击类似，它通过利用样本查询目标模型，并利用模型的回复创建一个复制模型。在黑盒设置下使用时，它可以：\n\
  \n*   以合理的成本复制一个功能且高效的模型。\n*   复制模型以便更容易开发替代性攻击（对抗性重编程、成员推断、对抗性采样等）。\n\n### 8.3.2.3\
  \ 成员推断攻击\n\n识别用于训练机器学习模型的数据的一种方法是“成员推断”。通过仅仅查看机器学习模型的输出，攻击者通常可以在不获取模型参数的情况下频繁发起成员推断攻击。当目标模型在敏感数据上进行训练时，成员推断可能会引发安全和隐私问题。\n\
  \n### 8.3.2.4 数据外泄\n\n数据外泄通常涉及网络犯罪利用多种网络攻击技术从业务或个人设备（如计算机和手机）中获取数据。从设备中盗取或非法移除或传输任何数据是数据外泄的典型定义。组织除了识别可能的威胁并保护人员、系统和数据免受安全漏洞的影响外，还应该能够阻止数据外泄。随着现代劳动力中远程和移动办公的兴起，这变得越来越困难。因此，组织需要确保私有信息不会出现在网络攻击常见的匿名服务器上。它们还应该阻止数据非法传输到第三方服务器，这些服务器正越来越多地成为现代网络攻击的来源。\n\
  \n### 8.3.2.5 数据投毒攻击\n\n随着恶意行为者获得新工具和更多的处理能力，数据中毒已成为一种日益常见的攻击。尽管数据中毒最早出现在 15 多年前，但它随后演变为人工智能和机器学习中最致命的弱点。例如，谷歌的反垃圾邮件系统曾多次被攻破。恶意个人操纵了垃圾邮件定义并污染了算法，允许恶意邮件绕过过滤器。鉴于新的机器学习和人工智能技术的日益普及和使用，公司应该预见到\
  \ 2024 年数据投毒攻击的增加。考虑到这一点，让我们更详细地检查这个问题，并讨论企业可以如何做好准备。\n\n### 8.3.3 分布式机器学习中的隐私风险\n\
  \n### 8.3.3.1 威胁建模\n\n威胁建模在联邦学习中至关重要，有助于识别和解决对分布式学习系统隐私和安全的潜在风险。分布式机器学习的参与者可能是敌意的或好奇的\
  \ [15]]。例如，一个用户属性少的汽车保险供应商可能旨在通过添加其他公司的特征（如银行、税务局等）来增强其风险评估模型。其他参与唯一的责任是贡献更多的特征细节，而不向其他玩家提供个人信息，以获得金钱或信誉形式的奖励。另一方面，竞争对手可能会伪装成盟友，然后破坏训练模型或窃取机器学习模型。以下是联邦学习中威胁模型的一些关键组件：\n\
  \n1.  `Attackers`：\n    *   `Outsider attack`（外部攻击）：在联邦学习系统之外运行的恶意方或黑客，试图非法访问、危害模型隐私或干扰学习过程。\n\
  \    *   `Insider attack`（内部攻击）：具有恶意意图利用漏洞或泄露隐私信息的联邦学习系统用户，例如设备所有者或组织。\n\n2.  `Sybil\
  \ Attacks`（女巫攻击）：\n\n\n\n\n\n女巫攻击（Sybil attack）是在点对点网络中的单个节点上并发运行多个活跃的虚假身份（也称为女巫身份）。通过在网络中获得大多数的影响力，这种攻击试图削弱可靠系统中的权威性或权力。这种影响是由这些虚假身份提供的。如果女巫攻击成功，威胁行为者就可以访问系统并实施非法活动。例如，它使得单个实体（如计算机）能够建立并管理多个身份，包括用户账户和基于\
  \ IP 地址的账户。这些虚假身份欺骗用户和系统，让他们认为它们是真实的。可以通过身份验证（直接验证和间接验证）、社交信任图谱等来防止女巫攻击。\n\n###\
  \ 3. 共谋风险\n\n- **参与者之间的共谋：** 参与者采取协调一致的行动汇总数据并获取比计划中更多的见解，这可能以牺牲隐私为代价。\n\n### 8.3.3.2\
  \ 对抗模型\n\n一种被称为对抗机器学习（adversarial machine learning）的方法试图通过提供错误数据来欺骗模型。因此，它同时解决了敌性样本的生成和识别，即专门设计用于欺骗分类器的输入。这些攻击被称为对抗机器学习，包括垃圾邮件检测和图像分类在内的许多领域已对其进行了大量的研究。对对抗机器学习最广泛的研究是在图像识别领域进行的，通过对图像进行修改，导致分类器提供错误的预测。企业发现，随着机器学习迅速成为其价值提供的不可或缺的一部分，保护它正变得越来越关重要。因此，对抗机器学习正成为软件行业中一个重要的问题。\n\
  \nGoogle、微软和 IBM 已开始投资机器学习系统的安全性。谷歌、亚马逊、微软、特斯拉等近期在人工智能领域投入了巨额资金的企业也遭遇了激进的攻击。针对机器学习系统的对抗攻击存在大量的变体。传统的机器学习技术包括线性回归和支持向量机\
  \ (`SVMs`)，它们通常被用于深度学习系统。对抗机器学习的这部分关注的是旨在降低分类器在特定任务上有效性的攻击。大多数对抗攻击分为三类：\n\n1. 投毒攻击\n\
  2. 逃逸攻击模型\n3. 提取攻击\n\n#### 8.3.3.2.1 投毒攻击\n\n攻击者操纵标签或训练数据，使模型在部署时性能糟糕。因此，中毒是指污染训练数据的行为。由于运行数据可以用于重新训练机器学习\
  \ (`ML`) 系统，攻击者可以通过添加恶意样本来污染数据，从而破坏或损害重训练。\n\n#### 8.3.3.2.2 逃逸攻击\n\n逃逸攻击是最常见且研究最广泛的攻击类型。攻击者在部署期间操纵数据，以欺骗以前经过训练的分类器。由于它们发生在部署阶段，因此这些是最有效的攻击类型，也是在恶意软件和入侵场景中最常用的类型。攻击者通常会隐藏垃圾邮件或恶意软件的内容，以试图规避检测。由于样本被归类为合法且对训练集没有影响，因此它们被修改以规避检测。逃逸攻击的典型案例是尝试欺骗生物识别系统。\n\
  \n#### 8.3.3.2.3 提取攻击\n\n攻击者可以探测黑箱机器学习系统，以检索其用于训练的数据或重构模型。这种技术被认为是模型提取或模型窃取。如果模型本身或训练数据是的，这一点就尤为重要。攻击者可能利用模型提取攻击，例如利用股票市场预测模型并将其用于自己的财务收益。\n\
  \n## 8.4 差分隐私技术\n\n差分隐私是数据分析和机器学习中的一种概念，用于在保护隐私的同时允许从数据中提取价值信息。其主要目标是提供坚实的保证，即任何个人数据的包含或排除都不会实质性地影响模型或统计分析的结果。以下是差分隐私运行的概述。\n\
  \n差分隐私的核心思想是对函数或分析的输出添加受控制的噪声，确保任何个人数据的影响在特定的隐私参数范围内是不可区分的。该机制定义如下：\n\n`Pr[M(D)∈S]≤\
  \ eϵ × Pr [M(D')∈S]` (8.1)\n\n其中：\n\n- `M` 是应用于数据的函数或分析。\n- `D` 和 `D'` 在最多一个人的数据上存在差异。\n\
  - `S` 是可能输出的集合。\n- `ϵ` 是隐私参数，代表隐私保护强度（`ϵ` 越小提供的隐私越强）。\n\n### 8.4.1 实现差分隐私的步骤\n\n\
  **步骤 1 – 确定敏感性：** 分析在数据上进行的函数或分析的敏感性，以确定其敏感度。\n\n![图 8.1 实现差分隐私的步骤](img/fig8.1.jpg)\n\
  \n**图 8.1** 实现差分隐私的步骤\n\n**步骤 2 – 噪声生成：** 为了减少任何个人数据的影响，添加针对计算经过精确调优的随机噪声。\n\n**步骤\
  \ 3 – 选择隐私参数：** 根据所需的隐私程度选择合适的隐私参数 (`ϵ`)。`ϵ` 的值越小，提供的隐私越强，但可能产生噪声更大的输出。\n\n**步骤\
  \ 4 – 组合定理：** 为了确保总隐私保持在预期的约束范围内，对系列计算应用组合定理。\n\n联邦学习是一种机器学习方法，通过在跨去中心化的边缘设备（如智能手机或物联网设备）上训练模型，而不交换原始数据样本。差分隐私在联邦学习中起着至关重要的作用，以确保用户数据的隐私。\n\
  \n以下是一些应用于联邦学习的差分隐私技术：\n\n1. **差分隐私联邦平均 (DP-FedAvg)：**\n- 差分隐私的概念被用于机器学习和数据分析，在保护隐私的同时能够从数据中提取有用信息。主要目标是提供确定的保证，特定个人数据的包含或排除不会显著影响计算或统计分析的结果。\n\
  \n2. **联邦学习中的差分隐私随机梯度下降 (DP-SGD)：**\n- 差分隐私可以集成到联邦学习使用的优化算法中，例如随机梯度下降 (`SGD`)。DP-SGD\
  \ 在更新全局模型之前，对每个本地设备计算的梯度添加噪声。这有助于在训练过程中实现差分隐私。\n\n3. **隐私保护聚合技术：**\n- 采用安全聚合等技术在聚合阶段保护本地更新的隐私。这涉及在将本地模型更新发送到中央服务器进行聚合之前对其加密，防止服务器学习到个体更新。\n\
  \n4. **带洗牌的差分隐私联邦学习**\n\n\n\n\n\n-   在聚合之前打乱模型更新的顺序有助于提供额外的隐私保护。这可以防止中央服务器将特定的更新与单个设备相关起来，从而增加推断有关单个数据点信息的难度。\n\
  \n### 5. 联邦学习中的同态加密\n- 同态加密允许在不解密的情况下对加密后的模型更新进行聚合。这确保了中央服务器在联邦学习过程中永远看不到原始模型更新或单个用户数据。\n\
  \n### 6. 联邦学习中的本地差分隐私\n- 本地差分隐私技术可以在数据与中央服务器共享之前，应用在每个设备的本地层。这确保了个人贡献在被用于更新全局模型之前就得到了保护。\n\
  \n### 7. 模型更新中的噪声注入\n- 与 `DP-SGD` 类似，在更新模型前直接向模型添加噪声有助于实现联邦学习中的差分隐私。这可以通过向模型参数添加拉普拉斯噪声或高斯噪声来实现。\n\
  \n### 8. 动态隐私预算分配\n- 在联邦学习场景中，隐私预算的动态分配确保了每个参与设备的贡献都得到适当保护。这涉及调整本地更新之前添加的噪声量并维护隐私。\n\
  \n### 9. 异步联邦学习算法\n- 在创建新的异步联邦学习算法时，需要考虑若干标准，包括对异步的鲁棒性、通信效率和收敛速度。\n\n### 10. 安全多方计算\
  \ (SMPC)\n- SMPC 允许多个参与者对输入共同计算一个函数，从而保护他们的隐私。各方协作完成计算而不共享任何个人信息。\n\n联邦学习中差分隐私技术的选择取决于应用的需求、所需的隐私水平以及涉及数据的特征。平衡隐私与模型准确性是一个持续的挑战，研究人员继续探索该领域的新方法和改进。\n\
  \n## 用于保护模型的安全聚合\n在联邦学习 (FL) 中，当参与者将其本地模型贡献给中央服务器时，安全聚合是保证模型更新隐私的一项基本技术。其目标是在允许模型更新聚合的同时，保持每个成员原始贡献的隐藏。客户端通过在个人数据上训练本地模型并将更新发送到中央服务器来参与联邦学习。在传统的聚合中，通过对这些更新取平均值来更新全局模型。\n\
  \n### 8.5.1 挑战\n如果以明文发送模型更改，访问通信通道或中央服务器的攻击者可能会推断出特定用户本地数据的敏感信息。\n\n- **计算开销：**\
  \ 使用完全同态加密可能会导致计算开销大幅增加。有效的优化和实现至关重要。\n- **通信开销：** 在发送和处理加密数据时，通信开销可能会增加。需要有效的程序来减轻这种影响。\n\
  - **密钥管理**：确保加密和解密过程的安全性需要适当的密钥管理。\n\n### 8.5.2 联邦学习中的安全聚合步骤\n联邦学习中的安全聚合涉及确保单个设备贡献的模型更新以某种方式聚合，使得中央服务器无法学习任何单个更新的细节。可以使用安全多方计算\
  \ (SMPC) 或同态加密等技术进行安全聚合，如图 5.1 所示。\n\n![images/fig8.2.jpg] 安全聚合\n\n**图 8.2** 安全聚合\n\
  \n#### 8.5.2.1 在本地设备上训练模型\n每个参与设备（如 IoT 设备或智能手机）使用自己的数据训练本地模型。\n\n#### 8.5.2.2 本地模型更新\n\
  所有设备在本地训练后，使用其本地数据创建模型更新。训练阶段的模型参数调整通常包含在此次更新中。\n\n#### 8.5.2.3 加密\n使用加密方法，每个参与者对其模型更新进行加密。对于此类应用，经常采用同态加密。同态加密保护了每个更新的隐私，允许在加密信息上直接完成计算，而无需先进行解码。\n\
  \n#### 8.5.2.4 在加密数据上进行聚合\n中央服务器收集加密模型更新的同时，直接在加密数据上执行聚合（如取平均值）。服务器可以计算聚合结果，而无需对每个单独更新进行解码。\n\
  \n#### 8.5.2.5 聚合数据的解密\n- 解密密钥被安全存储，以防止中央服务器发现单个更新的细节。聚合完成后，对聚合结果进行解密以获得最终的全局模型更新。\n\
  - 得益于同态加密，可以在加密数据上执行数学操作，同时保持结果信息的加密状态。\n- 由于完全同态加密允许在加密数据上执行加法和乘法，因此它尤其强强大。\n\n\
  #### 8.5.2.6 同态加密\n- **部分同态加密 (PHE)：** 确认加密数据上只能执行一种操作（乘法或加法）。\n- **有限同态加密 (SHE)：**\
  \ 允许在加密数据上评估受限的加法和乘法操作。\n- **全同态加密 (FHE)：** 加密数据可以进行无限次加法和乘法操作。虽然 FHE 需要更多的计算，但它也强大。\n\
  \n#### 8.5.2.7 区块链技术\n- 区块链技术的去中心化、安全性、信誉和防篡能力使其能够监控联邦学习服务器或设备的有害行为，并确保训练过程的透明度，为隐私保护提供了一种新方法。\n\
  - 文献中提出了深度链架构。它将区块链与安全聚合协议相结合，以跟踪和审计整个联邦学习过程，并保证通信过程中本地参数的秘密性和准确性。\n- 价值驱动的系统鼓励每个人公平地参与协作训练。然而，区块链技术本身仍然存在扩展性差和吞吐量低的问题，使得这些方法在现实环境的大规模应用中面临挑战，并对其有效性产生怀疑。\n\
  \n## 8.6 结论\n\n\n\n\n分布式系统中不断增长的数据可以被飞速发展的分布式学习技术领域进行有效利用。然而，这项技术的发展也加剧了用户在参与学习过程中对安全和隐私的担忧。因此，在研究中，我们首先关注了随分布式机器学习带来的安全和隐私问题。随后，我们对文献中提出的所有应对此类攻击的保护策略进行了彻底分析。此外，该评估还描定了攻击者在分布式学习系统多个层级中的不同属性，阐明了多个研究障碍以及该领域进一步探索的可能途径。随着分布式学习的推进，持续的创新和研究对于改进隐私保护方法至关重要，以确保机器学习模型在去中心化环境中负责且符合道德的使用。\n\
  \n我们通过理论分析发现，我们的方法实现了密文计算功能，解决了基础系统安全问题，并实现了两个撤销功能。与之前的系统相比，在实现用户隐私的同时，其计算复杂度更好。此外，通过将部分解密工作卸载到云服务器，我们的技术可以有效减少发送到用户处的请求数量。因此，我们的方案可以在保证隐私的同时提高生产效率。\n\
  \n接下来，我们希望结合区块链匿名性和去中心化的优势，在分布式存储环境中保护物联网中的海量数据。差异隐私是一个关键概念，它确保聚合的模型修改不会无意中暴露个人贡献。安全聚合方法（如同态加密和安全多方计算）能够在不泄露原始数据的情况下进行协作学习。得于联邦平均算法和本地模型更新，设备只需计算并交换必要的模型更新，从而最大限度地减少敏感数据的暴露。综之，与分布式学习相关的隐私问题是在个人数据输入的安全性与协作模型训练之间的仔细平衡。为了解决这些问题，差分隐私、安全聚合方法和本地模型更新技术是核心要素。未来，隐私保护算法可以使用中央保护、本地保护以及本地本地结合保护技术。\n\
