  \ 3.1`\n\n我们可以不断地重复这个过程。在每个时间点重新计算梯度，并持续向那个最低点移动。我们可以用伪代码来总结这种称为梯度下降的算法。通过 `PC 1`\
  \ 中的这段伪代码，我们从初始化一个权重并随机计算该梯度开始。然后，通过在梯度的反方向上更新我们的权重，我们使用了少量的数据。这可以在这里看到，这本质上就是我们所说的学习率。它决定了我们迈出的步幅有多大以及我们信任它的程度。通过这种方式，我们对计算出的梯度进行更新。\n\
  \n## 3.12 梯度下降\n\n如何计算这一项？这是深度学习和神经网络的关键部分。在通用计算中，这一项本质上是唯一重要的。当我们尝试优化网络时，它也是训练过程中计算量最大的部分，被称为反向传播。我们将从一个具有一个隐藏层和一个输出的简单网络开始。计算损失关于\
  \ `W` `[2]` 的梯度，相当于告诉我们 `W` `[2]` 的微小变化如何影响我们的输出或损失。\n\n如果我们将其视为一个导数，可以开始通过简单使用链式法则来计算它，如方程\
  \ (3.24) 所示。\n\n$$\\frac{\\\\partial J\\left( W \\right)}{\\partial W_{2}} = \\\
  frac{\\\\partial J\\left( W \\right)}{\\partial\\grave{y}}\\*\\frac{\\partial\\\
  grave{y}}{\\partial W_{2}}$$  \n\n(3.24)\n\n从损失通过输出反向，现在看起来像方程 (3.25)。\n\n$$\\frac{\\\
  \\partial J\\left( W \\right)}{\\partial W_{1}} = \\frac{\\\\partial J\\left( W\
  \ \\right)}{\\partial\\grave{y}}\\*\\frac{\\partial\\grave{y}}{\\partial W_{1}}$$\
  \  \n\n(3.25)\n\n我们不断重复这一操作。通过所有这些路径进行反向传播，我们就得到了梯度。我们无法保证这不是全局最小值。随机梯度下降的整个训练是一个贪心优化算法。我们只是采取这种贪心方法并仅优化局部最小值，如方程\
  \ (3.26) 所示。\n\n$$\\frac{\\\\partial J\\left( W \\right)}{\\partial W_{1}} = \\\
  frac{\\\\partial J\\left( W \\right)}{\\partial\\grave{y}}\\*\\frac{\\\\partial{\\\
  grave{y}}\\_{}}{\\partial z\\_{1}}\\*\\frac{\\\\partial z\\_{1}}{\\partial W_{1}}$$\
  \  \n\n(3.26)\n\n随机梯度下降有不同的扩展方式，它们不采用贪心方法。它们采用自适应方法，稍微观察四周。这些计算随机梯度的成本通常更昂贵，而在实践中计算随机梯度实际上非常廉价。这就是使用它的原因之一，另一个原因是，实践中局部最小值往往是足够的。\n\
  \n## 3.13 实践中的神经网络优化\n\n在实践中训练这些网络的见解使其变得极其复杂，这回到了之前提出的问题：在实践中训练神经网络是极其困难的。这是实践中神经网络损失地图的可视化\
  \ `[11`。这是大约年前的一篇论文，作者可视化了深度神经网络最后一个地图的形状，你可以在这里看到许多局部最小值。管理这种损失并找到最优真值是极其困难的。现在回想我们之前为梯度下降定义的更新方程。\n\
  \n$$\\left. W\\\\leftarrow\\\\operatorname{}W - \\\\eta\\\\frac{\\\\partial J\\\\\
  left( W \\right)}{\\\\partial W} \\right.$$  \n\n(3.27)\n\n考虑方程 (3.27)，在这里我们取权重并减去，向负梯度方向移动。在该方向上更新我们的权重。这就是我们说的学习率，它本质上决定了我们在每次迭代中迈出多大步。在实践环境中，学习率可能非常困难且对于确保你再次避免局部最小值非常重要。所以，如果我们设置的学习率太慢，模型可能会陷入局部最小值。像这样，即使在达到全局最小值的情况下，收敛也会非常缓慢。如果我们将学习率设置太大，梯度基本上会爆炸，并且偏离损失本身。将学习率设置为正确的数值也是糟糕的，这在实践中可能极其枯燥。现在，我们应该跳过某些局部最小值并进入一个合理的局部全局最小值？然后在全局最小值内收敛。我们如何巧妙地做到这一点？一种方案我们可以尝试许多不同的可能的学习率，看看哪种在实践中效果最好\
  \ `[12]`。在实践中，这是一个非常常用的技术，很多人只是尝试许多学习率并看哪个最好，让我们更聪明一点。设计一种根据上一次结果调整其学习率的自适应算法如何？\n\
  \n## 3.14 优化器\n\n在损失中，可以考虑此时梯度有多大。但现在由于我们的学习率对于所有迭代不是固定的，我们在学习上有了更多的灵活性。TensorFlow\
  \ 中提供了许多不同的优化方案：\n\n*   `Momentum`: `TC 10`\n*   `Adagrad`: `TC 11`\n*   `Adadelta`:\
  \ `TC 12`\n*   `Adam`: `TC 13`\n*   `RMSprop`: `TC 14`\n\n这也被广泛研究，并且许多不同的优化方案。这些存在于\
  \ TensorFlow 中，我们在讨论中展示了其中一些。尝试这些不同的优化器并看看它们有什么不同是有益的。它们本质上都是自适应的 `[13]`。\n\n##\
  \ 3.15 小批量 (Mini Batches)\n\n现在为了继续讨论实践中训练这些网络的技巧，我们将关注梯度下降批量和通用数据批量这一非常强大的想法。\n\
  \n| 算法 | `PC 3.2` |\n| --- | --- |\n| * 随机权重 `[~] Ɲ(0,ẟ²)` | |\n| * 循环直到收敛 | |\n\
  | a. 计算梯度，`\\frac{\\partial J\\left( W \\right)}{\\\\partial W}` | |\n| b. 更新权重，`\\\
  left. W\\operatorname{}\\leftarrow W - \\eta\\frac{\\\\partial J\\left( W \\right)}{\\\
  \\partial W} \\right.` | |\n| * 返回权重 | |\n\n\n\n\n梯度的计算非常复杂。如果我们像 `PC 3.2` 中描述的那样，对训练数据集中的所有数据样本计算这种反向传播算法，在现代数据集中这可能是海量的。这本质上等同于对所有这些数据点进行求和。在大多数现实问题中，这种计算开销极大，在每次迭代中进行计算是不可行的。相反，人们提出了随机梯度下降（stochastic\
  \ gradient descent）的想法。这涉及到从我们的数据集中选取单个点，计算该点的梯度，然后用它来更新我们的权重。这非常棒，因为计算单个点的梯度比计算许多个点的梯度要容易得多。但同时，由于我们只观察一个点，这可能会产生极大的噪声。因此，我们每次都会选取不同的点，但尽管如此，当我们移动时沿着该方向迈一步。在那一点，我们迈出的步并不一定代表整个数据集。是否存在某种折中方案，让我们不必使用随机的？虽然它是随机梯度，但在这种意义上我们仍然可以保持某种程度上的效率，而不是计算单个点的噪声梯度。\n\
  \n## 3.16 随机梯度下降\n\n| 算法 || `PC 3.3` |\n| --- | --- |\n| 随机初始化权重 `~ Ɲ`循环直到收敛 |\n\
  | 选取批量 `B` 数据点 |\n* 计算梯度，$\\frac{\\\\partial J\\left( W \\right)}{\\partial W} =\
  \ \\sum\\_{k = 1}^{B}\\frac{\\\\partial J_{k}\\left( W \\right)}{\\partial W}$\n\
  * 更新权重，$\\left. W\\operatorname{}\\\\leftarrow\\\\operatorname{}W - \\eta\\frac{\\\
  \\partial J\\left( W \\right)}{\\partial W} \\right.$\n* 返回权重 |\n| ||   |\n\n此时，我们尝试通过将数据分成小批量（mini-batches）即\
  \ `B` 个数据点来获得更好的估计。现在通过对这些中每个点的梯度取平均值，得到了对真实梯度的估计。这非常棒，因为现在计算比全量梯度下降容易得多。伪代码在 `PC\
  \ 3.3` 中提到。\n\n少于 100 个或大约在该范围内的顺序比随机梯度下降准确得多，因为我们还考虑了更大的群体。这种梯度估计准确度的提高允许允许能够更快地收敛。这意味着我们可以增加学习率，并在每一步中更信任我们的梯度。这最终意味着我们可以更快地训练。然而，这允许大规模的并行计算，因为我们可以将批量分到各个\
  \ `GPU` 上。将批量发送到所有 `GPU` 同时计算梯度，然后将它们聚合回来进一步加速。\n\n## 3.17 正则化\n\n在这里我们讨论深度神经网络的正则化。深度正则化是我们可以引入网络中的一种技术\
  \ `[14]`。它将抑制学习复杂模型的产生。正如我们之前看到的，我们的模型不仅能够泛化训练集之外的数据，还要泛化测试集中的数据。深度学习中最流行的正则化技术是一种非常简单的想法，称为\
  \ `dropout`。\n\n\n\n\n随着讨论的结束，显而易见，深度学习的复杂性远超理论框架。对这些见解的吸收不仅丰富了我们对该主题的理解，还为我们提供了必要的工具，以应对不断发展的深度学习领域中常见的动态挑战。这些知识涵盖理论基础和实践策略，为任何不仅希望进入而且在深度学习动态格局中蓬足发展的人奠定了坚实的基础。\n\
