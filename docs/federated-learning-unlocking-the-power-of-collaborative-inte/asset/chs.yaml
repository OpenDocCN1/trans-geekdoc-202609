  \ 3 – 4，对吧，等于 –6，这就是我们激活函数的输入。然后我们再次使用 sigmoid 将其馈过激活函数。例如，我们的最终输出是 0.002。这个数字意味着什么？让我们再次回到特征空间的插图，特征空间的作用是什么？\n\
  \n## 3.6 使用感知器构建神经网络\n\n感知器背后的思想是单个神经元。让我们从使用一个神经元从零开始构建神经网络，看看这一切是如何结合的。从这次讨论中我们回忆了几件事。计算感知器的输出有三个步骤\
  \ [6]。点积、偏置、取非线性，带有一个简化的示意图，三个步骤。为了消除偏置，移除权重以保持简单。在此处，我们写下 `Z`。\n\n`z = w * x +\
  \ b`\n\n`y = activation(z)`\n\n`z = \\sum(w_i * x_i) + b`\n\n`y = f(z)`\n\n$$z =\
  \ \\sum_{i=1}^{n} w_i x_i + b$$\n\n$$z = \\sum_{i=1}^{n} w_i x_i + b$$\n\n$$y =\
