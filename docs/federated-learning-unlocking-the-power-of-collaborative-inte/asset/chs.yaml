  \ 0, 1 输出与真实输出之间的损失，即学生及格或不及格。让我们假设现在不是计算 0 或 1 输出，而是想计算实际的成绩，即通常在课程中给出的。现在它不是 0,\
  \ 1，而是成绩，可以是任何数字。\n\n## 3.11 损失优化\n\n现在我们想要使用不同的损失函数，因为我们神经网络的输出是不同的。而且定义损失是深度学习中的门艺术。\n\
  \n这些数字是随机初始化的，对问题一无所知，所以我们必须训练它。我们必须教它如何获得正确答案。因此，我们要做的第一件事是在网络犯错时告诉它，以便我们将来可以纠正它。在神经网络中如何做到这一点？神经网络的损失实际上定义了网络何时做出错误的预测。它接收输入并预测输出。\n\
