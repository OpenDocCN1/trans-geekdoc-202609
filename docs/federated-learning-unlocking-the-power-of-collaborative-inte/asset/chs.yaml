  \n## 10.1 引言\n\n一种名为联邦学习 (`FL`) 的训练范式允许多个客户端在不交换各自数据的情况下协作训练一个全局模型。分布式学习 (`DL`)\
  \ 最初是为了优化在由服务器与计算机交互构成的星型网络中的给定模型，它是联邦学习的基础。`DL` 中的数据集由服务器所有，并由其分发到计算机。联邦学习系统中服务器与客户端之间处理能力的差异是一个显著现象，而上述方法忽略了这一点。我们意识到，在现实环境中，客户端的计算能力相对较低。现实环境中，客户端的计算能力相对较低。\n\
  \n现实环境中，客户端的计算能力相对较低。现实环境中，客户端的计算能力相对较低。\n\n因此，由于其广泛的应用潜力和通信特性，联邦学习非常适用于下一代无线系统。最常见的例子是用于单词预测的循环神经网络\
  \ (`RNN`)。`FL` 经常被用于语音识别业务。为了采样，服务器聚合全局模型的收敛性。这种方法关注客户端的损失函数。\n\n## 10.2 文献综述\n\n\
  目前，大多数研究人员通过采样客户端并修改其损失函数，试图减少异构性的负面影响。需要训练神经网络。为了实现这一点，必须使用无线网络从所有客户端收集数据。这种方法伴随着隐私和传输成本的担忧。\n\
  \n本章将 `FL` 的隐私保护和传输特性与一系列研究课题相结合。它最小了梯度或模型传输的开。例如，卷积神经网络 (`CNN`) VGG-16 的大小为 552\
  \ MB，而 AlexNet `CNN` 为 240 MB。使用神经网络 (`NN`) 模型对客户端来说仍然带有高昂成本，特别是在通信不足的情况下。\n\n\n\
  \n\n\n通常被称为梯度参数剪枝，这种神经网络是最原始的压缩方法。在 \\[8\\] 中，基于参数剪枝的模型压缩策略可以通过在神经网络中配置一些不那么重要的过滤器来减少神经网络模型参数的数量，从而大幅减小神经网络模型的大小。Guo\
  \ 等人 \\[9\\] 引入了一种多维剪枝策略，该策略从时空、空间和通道冗余方面压缩 CNN 模型。在时空模型压缩后，移除了相关性得分低的通道。使用人工学习的评分评估了每个通道中产出张量的位置。\n\
  \n通过将神经网络模型中的不相关参数设置为零，第一种模型压缩技术仅侧重于那些至关重要的参数 \\[10\\]。这种策略的优点是其操作简单。尽管如此，它也忽略了细微特征的重要性。\n\
  \n其次，可以通过量化进行压缩。 \\[11\\] 中采用了一种现实的分层架构，将随机梯度分解为归一化的块梯度，这些梯度分别使用低维格拉斯曼夫流形码本和均匀量化器进行量化。在这种情况下，引入了位分配技术来减少失真。量化随机梯度下降（`QSGD`）是一类具有收敛保证的梯度更新压缩方法，由\
  \ Alistarh 等人在 \\[12\\] 中首次提出。通过 `QSGD`，用户可以轻松地在通信带宽和收敛时间之间进行权。\n\n通过这种方法减少神经网络参数后，用于存储、部署和传输的模型负担会减轻减轻。然而，使用这种策略会导致准确率远降低。此外，与之前的方法类似，攻击者可以立即访问模型并启动一系列攻击，因为当执行精通的量化技术时，模型没有发生结构变化，准确率也没有明显的损失。最后一种压缩技术是权重共享，它通过增加模型参数的重用程度来减小模型的大小。\n\
  \n知识蒸馏 \\[13\\] 是模型压缩领域一种较新的技术，它通过提取模型信息来降低大型已训练模型的复杂度。然而，它与 `FL` 不兼容，因为其目标是降低构建复杂模型的成本。\n\
  \n目前许多研究已经表明，梯度或神经网络的大多数模型参数是冗余或多余的。因此，如何减少和压缩传输的额外特征数量引起了极大兴趣。在凸优化表述中，提出了一些快速简单的方法来获得近似解，并具有稀疏性的理论保证，以减少随机梯度的编码长度并有效解决最优稀疏化\
  \ \\[14\\]。\n\n## 10.3 机器学习中的联邦平均与模型聚合\n\n### 10.3.1 联邦学习与模型聚合的架构\n\n得益于联邦学习（`FL`）的去中心化机器学习架构，模型训练发生在客户端设备而不是中央服务器上。通常，架构由以下元素组成：\n\
  \n1. **中心化数据库**：\n   联邦学习过程由中央服务器协调，全局模型由其初始化。它将第一个模型发送给参与的客户端设备。\n2. **客户端设备**：\n\
  \   模型训练在每个客户端设备上本地进行，每个设备都有自己的本地数据集。\n3. **通信协议**：\n   一套系统的指导方，规定了如何发送或接收数据。\n\
  4. **聚合器**：\n   通过合并本地创建的模型来保护用户数据。\n\n通过这种方法减少神经网络参数后，用于存储、部署和传输的模型负担会减轻。然而，使用这种策略会导致准确率远降低。此外，与之前的方法类似，攻击者可以立即访问模型并启动一系列攻击，因为当执行精通的量化技术时，模型没有发生结构变化，准确率也没有明显的损失。最后一种压缩技术是权重共享，它通过增加模型参数的重用程度来减小模型的大小。\n\
  \n知识蒸馏是模型压缩领域一种较新的技术，它通过提取模型信息来降低大型已训练模型的复杂度。然而，它与 `FL` 不兼容，因为其目标是降低构建复杂模型的成本。\n\
  \n目前许多研究已经表明，梯度或神经网络的大多数模型参数是冗余或多余的。因此，如何减少和压缩传输的额外特征数量引起了极大兴趣。在凸优化表述中，提出了一些快速简单的方法来获得近似解，并具有稀疏性的理论保证，以减少随机梯度的编码长度并有效解决最优稀疏化\
  \ \\[14\\]。\n\n### 10.3.2 模型聚合的方法\n\n1. **初始化**：\n   全局模型在中央服务器上初始化，随后将其发送给所有客户端设备。\n\
  2. **本地模型训练**：\n   每个客户端设备在其本地数据集上训练全局模型。训练通常执行固定数量的 epoch。\n3. **模型更新传输**：\n  \
  \ 本地训练后，每个客户端设备计算本地训练模型与初始全局模型之间的差异。该更新（以模型参数的形式存在）随后传输到中央服务器。\n4. **聚合**：\n   中央服务器收集所有客户端的更新，并使用平均法进行聚合，创建一个新的全局模型。\n\
  5. **模型分发**：\n   将更新后的全局模型分发给所有客户端设备以进行下一轮训练。\n6. **迭代过程**：\n   重复步骤 2 到 5，以迭代方式改进全局模型。\n\
  \n### 10.3.3 关键组件与考量\n\n* **通信协议**：\n   用于评估收敛性并决定何时停止联邦学习。\n* **联邦平均**：\n   在每一轮中，通过平均所有模型来创建全局模型。\n\
  * **隐私保护**：\n   由于仅与中央服务器交换模型更改，单个客户端数据留在设备上。\n* **异构设备**：\n   为了实现高效协作，架构应考虑设备能力的差异，例如处理器速度或内存。\n\
  * **收敛监控**：\n   设备与中央服务器之间的模型通信。\n\n\n\n\n如前所示，联邦学习促进了边缘设备上的本地模型计算，并在服务器上合并这些模型，以生成一个新的通用模型并发送给每个消费者。客户端通过这种新方法重新学习，最终它们将其发送到服务器进行新的聚合。这种特化与泛化的循环持续进行，直到生成了合适的模型。通信周期通常指这种特化与泛化的循环。如果在第一个模型收敛后获得了新信息或有客户端加入，可能需要更多的轮次。\n\
  \n联邦学习很大程度上依赖于服务器汇总特化模型的方式。在深度学习背景下，可以考虑两类实现了不同技术的算法族。第一种策略强调泛化能力。通过将本地模型视为一个整体（所有层和神经元），聚合方法创建了一个可能挑战与神经元相关的所有层和权重的新模型。我们将详细讨论\
  \ `FedAvg` 和 `FedMA` 算法，作为这种方法论的说明。我们还应该讨论 `FedProx` 算法，该算法为了防止离群值，会对偏离正态太多的客户端进行惩罚。\n\
  \n### 10.3.8 联邦模型聚合\n\n本章的主要贡献是基于 `NN` 的模型聚合。通过使用模型聚合技术为 `n` 个客户端创建模型，生成手写体识别的全局模型。使用基于梯度的优化算法来优化学习过程，并在本地和全局模型更新上收敛。联邦随机方差算法和联邦平均法被等同以减少梯度。结果发现平均法优于其他传统策略。强化学习展示了定制的联邦学习场景和积极结果。然而，这些结果仅微优于联邦平均法，这表明这是一个潜在的研究课题。独立同分布的数据集\
  \ `24` 使用了相同的平均技术。当使用 `FedAvg` 模型聚合非独立同分布（non-IID）和不平衡数据时，模型权重发散的影响被减轻了。受这些显著成就的激励，我们决定坚持模型聚合方法和联邦学习框架。在这里，我们提出了联邦学习实验的通用结构。此外，利用改进后的模型聚合技术，我们的研究部分调查了三个定制的联邦学习框架。还讨论了三种使用神经网络模型系数平均值的主要模型聚合技术（见图\
  \ 10.1）。\n\n![图 10.1 联邦学习概述](img/fig10.1.jpg)\n\n图 10.1 联邦学习概述\n\n### 10.3.9 联邦学习框架\n\
  \n联邦学习的主要工作机制是：\n\n1. **客户端：** 在我们的实验中，我们考虑了四个客户端。本论文选择了与乳腺癌、手写体和指纹相关的数据集。训练、测试和验证数据分别分给每个客户端。\n\
  2. **中心服务器：** 中心服务器是该模型主要工作的地方。在联邦学习环境中，中心服务器在合并模型以创建更新或全局模型方面起着至关重要的作用。\n3. **获取全局模型：**\
  \ 每个客户端都被认为是活跃的，这意味着每个客户端都参与了联邦学习框架。中心服务器向客户端发送全局模型。相应地，全局模型 `M ≡ G(M)` 从中心服务器送到所有客户端。\n\
  4. **本地模型训练：** 每个客户端在获取全局模型 `M ≡ G(M)` 后开始训练数据模型。在本地模型训练期间，每个客户端计算 `M ← M −σ 5f\
  \ n (M; b)`，这决定了其本地数据上的平均梯度。\n\n## 10.4 机器学习中的梯度压缩与量化\n\n### 10.4.1 梯度压缩\n\n梯度压缩是用于深度学习（DL）和机器学习（ML）的术语，旨在降低分布式模型训练过程中的通信开销。在分散模型训练期间，节点之间传输梯度更新的操作会导致显著阻塞，特别是对于巨大的模型而言。以下是一些用于梯度压缩的常用技术：\n\
  \n1. **以均值为中心的压缩：** 只发送均值和相对于均值的方差，而不是发送单个梯度值。这样做可以在发送较少数据的同时保留完整的信息量。\n2. **量化：**\
  \ 这涉及降低梯值的精确度。例如，可以将梯度量化为低精度整数或固定点值，而不是交付需要更多位来表示的浮点数。因此，传输的数据更小。\n3. **误差反馈压缩：**\
  \ 只发送实际梯度与预期梯度之间的差异，而不是精确的梯度。通过将此差异添加到预期梯度中，接收方随后可以重建梯度。这种方法利用了连续梯度之间的重叠部分。\n4.\
  \ **稀疏化：** 通过这种方法，所有梯度被设置为零，仅传输部分具有意义值的梯度。这是基于这样一个观点：大量的梯度值是可以忽略不计的且对模型更新的影响很小。\n\
  5. **Top-k 压缩：** 使用这种技术，只传输幅度最大的 `top-k` 个梯度。其概念是保留最重要的梯度并拒绝较不重要的梯度。\n\n梯度压缩方法在传输能力有限的情况下（例如通过网络或多个\
  \ GPU 进行的分布式训练）中非常有帮助。这些方法减少了整个系统中梯度更新所需的时间和资源，有助于加速训练过程。\n\n### 10.4.2 梯度压缩类型\n\
  \n在分布式训练的背景下，梯度压缩模型通常用于描述旨在在机器学习模型训练期间压缩梯度的特定方法或技术。以下是一些流行的梯度压缩模型或方法：\n\n1. **梯度量化模型：**\
  \ 这些模型专门针对梯度的量化。通过量化，可以使用更少的位表示梯度值，从而降低其精确度。这减少了通信阻塞并有助于以更小的尺寸发送数据。\n2. **通信高效随机梯度下降\
  \ (CESGD)：** 为了提高通信效率，CESGD 是一种使用梯度压缩方法的分布式训练方法。它结合了稀疏化和量化，以最小化训练期间设备之间传输的数据量。\n\
  3. **低秩分解模型：** 这些模型的主要目标是使用低秩分解来近似梯度矩阵。通过将梯度分解为低秩矩阵，可以大幅减少必须发送的信息。\n4. **残差量化方法：**\
  \ 这种方法将梯度量化与残差网络（ResNets）的概念相结合。为了给模型提供压缩优势并使其保留更多更新信息，它尝试维护梯度中的高频信息。\n\n\n\n\n\
  梯度压缩算法必须通过更改深度学习模型的训练循环，使其包含压缩方法来实现。在第 10.4.4 节提供了一个 Python 的简练示例，该示例使用了著名的深度学习库\
  \ `PyTorch`。请记住，具体的实现方式可能会根据特定压缩技术的需求而变化。\n\n### 表 10.1 聚合模型或方法\n\n| 方法 | 描述 |\n\
  | --- | --- |\n| 加权平均 (Weighted averaging) | 通过根据设备的可靠性或性能给模型赋予不同的权重，来减少性能不佳或可能存在恶意的设备的影响。\
  \ |\n| 联邦平均 (Federated averaging) | 是一种迭代过程，涉及聚合建模、本地模型训练以及随后的更新模型返回。 |\n| 安全聚合\
  \ (Secure aggregation) | 为了确保在不泄露特定模型更新的情况下完成聚合过程，使用了如同态加密和多方计算等方法。 |\n| 自适应方法 (Adaptive\
  \ methods) | 自适应方法指的是根据单个设备的可靠性或性能实时修改聚合过程的策略。 |\n\n梯度量化方法使用较少的比特来编码梯度值，从而降低其精度。这可以加速机器学习模型的收敛，并降低分布式训练中的通信开销。\n\
  \n### 表 10.4 梯度量化算法及其收益\n\n| 算法 | 描述 | 收益 |\n| --- | --- | --- |\n| 随机量化 (Stochastic\
  \ quantization) | 随机量化在量化过程中引入了受控的随机性。它不是确定地将梯度舍入到最近的量化级别，而是根据概率分布随机舍入。 | 随机元素可以引入噪声，可能产生正则作用并帮助模型更好地泛化。\
  \ |\n| 均匀量化 (Uniform quantization) | 在均匀量化中，整个梯度范围被划分为多个量化级别，每个梯度都被量化到最近的级别。这是一个确定过程，量化级别间距相等。\
  \ | 简单易于实现，提供了直接的精度降低。 |\n| 二幂量化 (Power of two quantization) | 二幂量化将梯度舍入最近的 2 的幂。这可以通过操作浮点表示的指数来实现。\
  \ | 减少了需要传输的唯一值数量，实现了高效压缩 |\n| 三值量化 (Ternary quantization) | 在三值量化中，梯度被量化为三个值之一：-1、0\
  \ 或 1。接近 0 的值被舍入为 0，从而降低了精度。 | 压缩率高，减少了需要通信的信息量。 |\n| 量化感知训练 (QAT) | QAT 不是在训练后应用量化，而是在训练过程中结合量化过程。这涉及在训练期间对梯度进行量化。\
  \ | 允许模型在训练期间适应降低的精度，可能减轻对性能的影响。 |\n| 自适应量化 (Adaptive quantization) | 自适应量化根据梯度值动态调整量化精度。幅度较大的梯度可能以更高的精度量化，而较小的梯度可能以较低的精度量化。\
  \ | 适应梯度不同的重要性，可能提高压缩效率。 |\n| 增量量化 (Incremental quantization) | 增量量化涉及在训练过程中逐渐降低梯度精度。可以通过逐步减少用于量化的比特数来实现。\
  \ | 允许平滑过渡到更低精度，可能减轻对模型性能的影响。 |\n\n### 10.4.5 何时利用梯度压缩\n\n梯度压缩对于训练模型带有大型全连接组件的模型非常有用。对于循环神经网络和更大的模型，通信成本变得至关重要。梯度压缩为此类模型提供了许多优势。梯度量化和压缩技术通常用于在多个设备或节点上训练机器学习模型的分布式训练场景。这些技术旨在减少设备间交换梯度更新时的上述陈述量，随着模型尺寸的增大或训练参数数量的增加，这一点变得至关重要。\n\
  \n需要注意的是，虽然梯度量化和压缩可以带来更快的通信并缩短训练时间，但它们也可能引入噪声或近似误差。因此，选择使用这些技术时应充分考虑模型的精确特征、训练数据和可用资源。在代表性数据集上进行实验和验证，对于确保压缩模型保持可接受的性能至关重要。\n\
  \n以下是使用梯度量化和压缩的一些情况和考虑因素：\n\n### 表 10.5 何时使用压缩算法\n\n| 算法 | 何时使用 |\n| --- | --- |\n\
  | 通信带宽有限 | 在设备间通信带宽受限的场景下（例如，跨 GPU 或通过网络进行分布式训练时），梯度量化和压缩可以显著减少传输的数据量并加速训练过程。 |\n\
  | 模型尺寸大 | 对于具有大量参数的大规模模型，通信成本可能成为瓶颈。 |\n| 分布式训练 | 梯度量化和压缩在跨多个设备或节点进行训练的分布式训练设置中特别相关。例如，在\
  \ GPU 集群上训练、跨不同服务器训练或在联邦学习场景中训练。 |\n| 通信成本主导 | 当训练时间由传输成本而非计算决定时，压缩方法对于加速收敛至关重要。\
  \ |\n| 通信频率 | 如果设备之间的通信频率很高（例如在同步训练设置中），梯度压缩的优势将更加明显。 |\n| 对精度降低的容忍度 | 当优化问题和模型对梯度更新精度的下降具有容忍度时。某些模型可能需要更多考虑，但其他模型对准确性较低的梯度更有韧性。\
  \ |\n\n此示例演示了梯度量化的基本方法。请记住，更高级的方法（如自适应压缩或稀疏化）需要额外的思考，并可能需要更详细的调整。\n\n### 10.4.4\
  \ 梯度量化算法\n\n#### CPU 对比 GPU\n\n这种梯度压缩在采用多节点（单 GPU 或多 GPU）分布式训练时效果最好。与 GPU 每个计算节点巨大的计算密度相比，在\
  \ CPU 上训练提供的每个计算节点计算密度较低。因此，在训练期间，基于 CPU 的节点所需的通信带宽少于基于 GPU 的节点。因此，基于 CPU 的节点从梯度压缩中获得的收益少于基于\
  \ GPU 的节点。\n\n#### 网络延迟\n\n在利用连接节点进行分布式训练时，梯度压缩具有优势。模型的大小和节点之间的网络延迟都可能导致性能下降；在这种情况下，梯度压缩可能会加快速度。如果网络通信的延迟较低，你可能并不想使用梯度压缩。\n\
  \n#### 模型维度\n\n\n\n权重同步是分布式训练中每个批次后的必要要求。由于较大的模型在训练过程中需要更多的通信，因此梯度压缩对这些模型将产生更大的积极影响。在分布式训练中使用梯度压缩时，会使用\
  \ `OpenMP` API 在 CPU 上对量化和反量化过程进行并行化。\n\n## 10.5 分布式系统中的自适应学习与资源分配\n\n使用数据驱动的教育来修改并定制以适应每个学生独特需求的学习过程被称为自适应学习。通过使用自适应学习，可以预见潜在的缺陷或系统故障。系统可以从过去的事件中汲取经验（见图\
  \ 10.2），采取主动措施来减轻或防止问题，从而确保高可用性和可靠性。\n\n![图 10.2 自适应学习系统架构](img/fig10.2.jpg)\n\n\
  自适应学习系统架构资源分配过程由以下六个基本组件组成：\n\n1.  **设定目标和目的。** 任务、愿景和一般机构目标有助于决策。组织的长期运输计划（`LRTP`）和或运输资产管理计划（`TAMP`）可能包含目标和目的。资源分配的方法应当有助于这些目标的实现。\n\
  2.  **确定限制条件。** 决定哪些资源需要分配以及在什么限制下分配。通常，这指的是可用资金的限制，也可以指对人员、承包商能力、设备、供应或其他资源的限制。此外，可能存在与过程相关的其他限制，包括对特定资源使用精度的限制，或在不同地区或地点之间公平分配资金的限制。\n\
  3.  **计算你的目标。**（注：已纠正拼写错误）将意图和目标转换为精确的标准，以支持分配选择。尽可能建立指示完成程度的性能衡量指标。为重要指标设定目标值，并确定所需的服务水平。\n\
  4.  **分配资源。** 将资金和额外资源分配给各种程序类别或工作类型。不同类别或类型动力之间的资源分配由分配方案指定。所分配的资源细节、所检查的资产以及所考虑的投资类型将决定该过程的如何执行。\n\
  5.  **预测性能。** 在假设已知已分配资源和优先级的情况下，预测未来的性能并与预设目标进行对比。这可能导致对之前提到的步骤的限制、目标或结果进行更改。在已为资产状况指定目标的情况下，使用生命周期分析技术来预测未来的资产状况。\n\
  6.  **完成计划和分配。** 分配完成后，通过文档记录向利益相关者解释产生的目标、预测和投资优先级。在正式程序结束后，可能需要更多工作，例如根据授权项目列表创建维护计划。\n\
  \n### 10.5.1 资源分配中的风险考虑\n\n交通部门的决策者必须处理不确定性。在分配资源时始终存在某种程度的不确定性。面临不确定性的因素包括资产状态和性能信息、预测的资金水平和支出、交通系统和特定资产的性能，以及可能需要重新分配资源的潜在外部事件或其他情况。这种不可预测性使得未来规划变得更加困难，并使机构更具适应性，以应对突发情况和变化的环境。\n\
  \n交通部门与其他行业一样，近年来在开发处理不确定性的更好方法方面取得了显著进展，以减少不利影响并最大化有利影响。根据部门和应用，“风险”一词可以有完全不同的含义。例如，财务分析师主要的两个关注点是遭受巨大财务损失的危险以及财务回报的不可预测性。另一方面，核能部门的风险管理重点在于减少核电站遭受灾难性破坏的可能性。根据\
  \ `ISO` 的定义，本书将风险描述为“不确定性对目标的影响”。这一概念承认了不确定性具有积极和负面影响性，并涵盖了风险管理的整个领域。\n\n## 10.6\
  \ 结论\n\n在本章中，我们总结了处理客户端漂移问题的联邦学习优化技术组。联邦学习中客户端漂移的未来方向可能是通过对后续梯度进行平均，从而产生对最佳更新方向的无无偏的估计。本综述概述了围绕联邦学习模型优化策略的问题和驱动因素，并分析了旨在解决这些问题的最先进技术和算法。本章概述了机器学习中的联邦平均和模型聚合、梯度下降算法以及联邦学习中的资源分配。\n\
