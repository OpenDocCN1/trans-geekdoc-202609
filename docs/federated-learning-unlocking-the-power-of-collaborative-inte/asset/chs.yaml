  \ `backpropagation` 算法。这一进步结合计算能力的提升，推动了研究的激增，使深度学习进入了 AI 革命的核心 [2].]。\n\n然而，通向广泛应用的道路并非一帆风顺。批评者对深度学习模式缺乏解释性和可解释性表示担忧，对其在安全任务程序中的可靠性产生。此外，神经网络的计算需求构成了巨大的障碍。尽管面临这些严峻的状况，硬件的快速发展和高效深度学习算法的改进为深度学习的黄金时代铺平了道路。该领域在多个领域取得了重大突破，从计算机视觉、预测和自然语言处理到自动驾驶汽车和医疗诊断\
  \ [2].]。\n\n本章深入探讨了这些成功背后的原理，揭示了神经网络、激活特征、损失函数以及引导学习之旅的优化算法的复杂性。通过掌握这些基础知识，读者将获得认真评估深度学习规模和不断演变的格局的工具，为其未来几年负责任且伦理的发展做出贡献。\n\
  \n## 2.3 神经网络及其架构\n\n人工神经元被用于创建称为神经网络的复杂结构，它可以处理多个输入并产生单个输出。神经网络的主要功能是将输入转换为可用的输出。神经网络通常由一个输入层、一个输出层和一个或多个隐藏层组成。人工神经网络或\
  \ `ANN` 是它的另一个名称。`ANN` 设计对于神经网络精确地像人类大脑一样运行是必要的 [2].]。\n\n在神经网络中，每个神经元通过相互作用连接到其他神经元。网络能够识别和观察手中信息的每个组件，以及不同数据元素之间任何潜在的相关性。神经网络可以通过这种方式在海量数据中搜索极其复杂的模式\
  \ [2].]。\n\n信息通过神经网络传输的方式有两种：\n\n* **前向传播网络 (Feedforward network)**：数据逐层以前向模式馈送到神经网络。每一层在将其发送到下一层之前都会输入进行修改。输入处理过程是简单的，并产生输出的预测。\n\
  * **反馈网络 (Feedback networks)**：`Backpropagation`（反向传播）或反馈要复杂得多。首先由网络做出预测，并计算预测结果与实际结果之间的差异。为了减少未来的预测错误，使用此误差对网络的内部参数（权重和偏置）进行系统的调整。正是通过这种参数修改、误差计算和预测的迭代过程，网络不断学习并随着时间的推移变得更加高效\
  \ [3] 图 2.1。\n\n![图 2.1 神经网络架构](img/fig2.1.jpg)\n\n图 2.1 神经网络架构\n\n### 2.3.1 神经网络架构的主要组件\n\
  \n神经网络架构由输入层、输出层和隐藏层组成。\n\n#### 2.3.1.1 输入层\n\n神经网络接收原始输入数据的第一层称为输入层。该层中的每个神经元代表输入数据的一个特征或组件。输入数据的维度决定了输入层中存在多少神经元。例如，每个神经元可以代表图像识别中的一个像素。输入层是神经网络的接入因子，其基本工作是将数据从此残留切换到随后的层进行额外的处理和学习\
  \ [3].]。\n\n#### 2.3.1.2 隐藏层\n\n神经网络输入层和输出层之间的中间阶段被称为隐藏层。这些层的神经元执行复杂的计算，将输入记录转换为有助于网络做出正确预测的格式。在接收到上一层的输入后，隐藏层中的每个神经元都会为每个输入分配一个权重，然后通过激活特征发送结果。网络学习和泛化的能力基本上取决于每层和隐藏层中神经元的数量。网络可以通过隐藏层学习层次化表示并理解统计方式中的复杂模式\
  \ [3].]。\n\n#### 2.3.1.3 输出层\n\n神经网络的输出层生成最终结果或预测。根据正在处理的任务，此残留的神经元数量可能从二分类的一个到多类分类的多个不等，每个神经元代表一类。输出层中的神经元通常使用适用于任务的激活函数。通常用于二分类的\
  \ `sigmoid` 函数的输出类似于概率。`softmax` 函数在多类背景下经常被用于将输出归一化为跨类别的概率分布。输出层的工作是使用之前的层提供网络做出的最终预测\
  \ [2].]。\n\n### 2.3.2 神经网络的类型\n\n重要的神经网络有：\n\n* `卷积神经网络 (CNN)`\n* `循环神经网络 (RNN)`\n\
  * `长短期记忆 (LSTM)`\n* `生成对抗网络 (GAN)`\n\n#### 2.3.2.1 卷积神经网络 (CNN)\n\n一种用于处理结构化网格数据（如照片）的特殊神经网络被称为卷积神经网络\
  \ (`CNN`)。它自动和自适应地学习空间层次特征；使用了卷积层。这种布局通过捕捉数据中的模式和空间相关性减少了对人工函数工程的需求，使其照片识别等软件包非常有益\
  \ [2].]。\n\n##### 2.3.2.1.1 卷积神经网络：架构\n\n卷积神经网络由四层组成：输入层、池化层、卷积层和全连接层。\n\n######\
  \ 2.3.2.1.1.1 输入层\n\n卷积神经网络 (`CNN`) 的第一层是获取首次输入的地方，通常是像素形状的原始统计。`CNN` 的输入层设计用于处理类似于网格的信息。层的强度显示了颜色通道的数量（对于\
  \ RGB 像素为三个），输入层中的每个神经元等于图像中的一个像素。\n\n接受照片统计并将其通过随后的卷积层（在这些层中执行过滤器和池化操作以从输入图像中提取层次化特征）是输入层的主要工作。\n\
  \n###### 2.3.2.1.1.2 卷积层\n\n\n\n\n\n卷积操作通过卷积神经网络（CNN）的卷积层应用于输入数据上。为了识别输入图像中的模式、边缘和特征，这些过程涉及到在图像上滑动微小的过滤器（也称为卷积核，`kernels`）[3]。\n\
  \n### 2.3.2.1.1.3 最大池化层\n\n卷积神经网络（CNN）的最大池化层 是一种下采样过程，它可以降低输入张量的空间维度。它通常位于卷积层之后。其核心概念是从一组值中保留最相关的细节。通过使用最大池化，网络能够抵御特征位置、大小和方向上的变化。此外，它通过关注特征图中最重要的数据，减轻了处理负担并有助于避免过拟合\
  \ [1]。\n\n### 2.3.2.1.1.4 输出层\n\n卷积神经网络（CNNs）利用从输入数据中提取的层次化特征在输出层中构建其最终预测。输出层的配置取决于创建\
  \ CNN 的特定目的。\n\n通过输出层提供从在 CNN 某些层中某一点发现的特征和模式中得出的最终预测或分类 [2]。\n\n### 2.3.2.2 循环神经网络\
  \ (RNN)\n\n循环神经网络（RNNs）是用于研究统计序列的人工神经网络。对于那些必须理解记录之间的时间关系和顺序的任务，它特别别有益。RNN 的基本思想是它们具有循环结构，这允许信息保留在某一区域内，并从方法的一个阶段传递到后续阶段\
  \ [3]。\n\n#### 2.3.2.2.1 循环神经网络：架构\n\nRNN 的架构由以下层组成。\n\n#### 2.3.2.2.1.1 （隐藏状态）循环神经元\n\
  \n循环神经元（有时被称为隐藏状态或记忆单元）是 RNN 的主要部分。这些神经元接收输入、生成输出，并在每个时间步（`t`）保留一个内部状态或记忆。网络可以保留顺序信息，因为每个时间步的内部状态取决于上一个时间步的内部状态和当前输入\
  \ [1]。\n\n#### 2.3.2.2.1.2 输入层\n\nRNN 在每个时间步（`t`）接收一个输入向量（通常表示为 `x(t)`）。该输入向量可以代表许多格式的信息，以及字符时间数据点、句子中的单词和序列因子。\n\
  \n#### 2.3.2.2.1.3 隐藏状态更新\n\n循环神经网络（RNN）更新隐藏状态的过程涉及根据当前输入和上一个隐藏状态计算新的隐藏状态。\n\n由于递归过程，RNN\
  \ 还通过通过持有来自高级时间步信息的隐藏状态来捕捉数据中的顺序依赖 [2]。\n\n#### 2.3.2.2.1.4 输出层\n\n循环神经网络（RNN）输出层在记录通过循环连接处理后产生最后的预测或输出。创建\
  \ RNN 的精确原因决定了输出层必须如何配置。\n\n输出层通过合成通过循环连接处理的记录，为给定的输入序列创建最终输出或预测 [2]。\n\n### 2.3.2.3\
  \ 长短期记忆 (LSTM)\n\n长短期记忆（LSTM）类型的循环神经网络（RNN）是一种学习序列数据中长期依赖关系的改进方法，它是为了解决梯度消失问题而设计的。为了控制信息流，LSTM\
  \ 具有门和记忆单元 [1]。\n\n### 2.3.2.3.1 长短期记忆：架构\n\n#### 2.3.2.3.1.1 单元状态\n\nLSTM 网络在它的内部内存中跟踪一个单元状态，该状态由一组门进行更新和管理。单元状态适用于具有长距离依赖的任务，因为从理论上讲，它可以跨越长序列信息\
  \ [3]。\n\n#### 2.3.2.3.1.2 隐藏状态\n\nLSTM 网络中的每个时间步（`ht`）都有一个隐藏状态，类似于传统的 RNN。额外的 LSTM\
  \ 隐藏状态提供了从单元状态中选择性地存储或检索统计数据的潜力 [2]。\n\n#### 2.3.2.3.1.3 门\n\nLSTM 使用三种主要的门来控制数据流动：遗忘门、输入门和输出门。\n\
  \n- **遗忘门 (Forgot gate):**\n- 遗忘门是 LSTM 的关键部分。它决定需要保留还是销毁单元中的哪些记录。它利用当前输入以及之前的状态作为输入，并使用\
  \ sigmoid 激活产生 0 到 1 之间的值。1 表示“保留此记录”，而 0 表示“遗弃”。这种门使得 LSTM 能够通过选择性地记忆更有效地处理顺序项\
  \ [1]。\n\n- **输入门 (Input gate):**\n- 确定是否将当前输入和之前的状态保存在单元中是长短期记忆（LSTM）输入门的重要功能。其工作方式如下：\n\
  1. **Sigmoid 激活：** 两个输入被馈输入门：之前的隐藏状态和当前输入。这些输入通过 sigmoid 激活产生 0 到 1 之间的值。这些值作为门改变了统计数据。接近\
  \ 1 的数量表示“保留此事实”，而接近 0 的范围表示“丢弃此信息”。\n2. **逐元素乘法：** 接下来，通过 sigmoid 输出提升使用新单元状态产生的新候选值。这种乘法决定了哪些新候选值必须引入单元状态。\n\
  \n输入门允许 LSTM 通过选择性地允许或阻塞信息来处理长时间依赖关系并理解序列统计中的相关样式 [2]。\n\n\n\n\n随后，通过前一个细胞状态的构建和输入门的补充（1\
  \ – 输入门输出）增加输出。通过保留长期依赖关系并选择性地添加新记录，这种混合修改了移动状态。\n\n#### 2.3.2.3.1.5 输出状态\n\n基于更新后的细胞状态，长短期记忆（`LSTM`）网络中的输出门决定了后续隐藏状态。以下是输出门特征的证据：\n\
  \n- `Sigmoid 激活`：输出门的输入由之前的隐藏状态和当前输入组成。这些输入经过 sigmoid 激活函数的处理，生成 0 到 1 之间的值。这些值充当门的作用，决定了更新后的细胞状态中有多少量应该输出到输出。接近\
  \ 1 的值表示“暴露这些记录”，而接近 0 的值则意味着“掩盖这些数据”。\n- `逐元素相乘`：经过 `tanh` 变换的更新细胞状态随后通过 sigmoid\
  \ 输出进行精细化缩放。进入下一个隐藏状态的值通过这种乘法确定。\n\n输出门通过从更新的细胞状态中选择性地显示相关信息，创建相应的隐藏状态。通过这种技术，LSTM\
  \ 能够从序列事实中识别并提取关键模式，以产生独特的预测 [3\\]。\n\n### 2.3.2.4 生成对抗网络 (GAN)\n\n一种称为生成对抗网络（`GAN`）的深度学习架构由两个对抗训练的神经网络组成：判别器和生成器。使用\
  \ GAN 可以产生模拟特定数据集的新数据样本 [1\\]。\n\n##### 2.3.2.4.1 生成对抗网络 (GAN)：架构\n\n###### 2.3.2.4.1.1\
  \ 生成器\n\n生成器的任务是产生与实际数据分布相似的虚假数据样本（如照片）。它使用随机噪声作为输入，在训练过程中创建越来越好的数据样本。生成器通常包含一个或多个层，为了提高数据空间分辨率，经常使用转置卷积层\
  \ [1\\]。\n\n###### 2.3.2.4.1.1.1 生成器架构\n\n- `输入层`：从随机噪声向量（`z`）中随机采样的类高斯基础分布。\n-\
  \ `隐藏层`：一系列隐藏层，通常是转置卷积层或全连接层，逐渐将输入中的噪声转换为类似于真实数据的数据。\n- `输出层`：最后一层生成创建的数据样本，例如图像。\n\
  \n###### 2.3.2.4.1.2 判别器\n\n判别器的任务是区分真实数据样本和虚假样本。在接受来自生成器的数据以及真实数据样本后，它为每个输入分配一个真实概率。判别器接受训练以增强其区分真数据和伪数据的能力\
  \ [1\\]。\n\n###### 2.3.2.4.1.2.1 判别器架构\n\n- `输入层`：数据样本，可能是真实的（来自原始数据集）或伪造的（由生成器创建）。\n\
  - `隐藏层`：判别器像生成器一样，使用隐藏层处理输入数据，经常利用卷积层或全连接层。\n- `输出层`：最后一层生成一个概率分数，显示输入是否真实。通常，它使用\
  \ sigmoid 激活函数生成 0 到 1 之间的值。\n\n###### 2.3.2.4.1.3 训练过程（对抗训练）\n\n在训练期间，生成器和判别器之间进行着游戏。生成器试图提供与真实数据几乎相同的数据以欺骗判别器。判别器的目标是区分真实和错误数据。这种竞争动态使得每个网络随着时间的推移不断改进\
  \ [1\\]。\n\n## 2.4 激活函数和损失函数\n\n### 2.4.1 激活函数\n\n深度学习神经网络的一个至关重要的部分是激活能力。它们提供了非线性版本，有助于理解复杂的模式并提供额外的准确预测。在深度学习中，通过激活能力可以实现以下目标：\n\
  \n- `定义非线性`：\n- 如果没有激活能力，神经网络可能仅仅是其输入的线性组合。用于影响神经元输出并引入非线性的数学操作被称为激活能力。如果没有这种非线性，网络无法近似记录中复杂的非线性能力。\n\
  - `促进复杂的表示`：\n- 借助激活函数，神经网络可以检查并构建记录中复杂的能力和分层抽象。图像识别中的边缘、纹理、形状和更高级的思维，或自然语言处理中的抽象模式，都应该是这些能力的示例。\n\
  \n#### 2.4.1.1 常见激活函数\n\n1. i. `Sigmoid 函数（逻辑激活）`\n- Sigmoid 平滑 0 到 1 范围内的输入值。它经常被用作神经网络的激活函数，为二分类问题添加非线性\
  \ [5\\]。\n- `输出范围`：(0, 1)\n- `公式`：`1 / (1 + e(-x))`\n- 具有用于二分类输出的历史。\n- 一种将输入限制在\
  \ 0 到 1 之间的 S 形曲线。\n- 存在梯度消失问题。\n\n2. ii. `双曲正切函数`\n- 双曲正切将输入值压缩在 -1 到 1 之间，功能与\
  \ sigmoid 相似。它经常用于 LSTM 和 RNN 中处理以零为中心的数据。\n- `输出范围`：(-1, 1)\n- `公式`：`tanh(x) =\
  \ (e(x) - e(-x)) / (e(x) + e(-x))`\n- 其零中心特征使其与 sigmoid 相似。\n- 也存在梯度消失问题 [4\\]。\n\
  \n3. iii. `ReLU（线性单元）`\n- 当 ReLU 被激活时，直接输出正输入；否则输出零。它的流行源于对稀疏表示的促进以及易于使用。\n- `输出范围`：0,\
  \ ∞)\n- `公式`：`ReLU(x) = max(0, x)`\n- 由于其有效性和简单性，它是最常用的激活函数。\n- 实验观察到它可以加速训练收敛。\n\
  - 然而，当某些神经元死亡时，可能会遇到“死亡 ReLU”问题。\n\n4. iv. `Leaky ReLU（带漏的线性单元）`\n- 通过允许负输入产生产生微小的正梯度，Leaky\
  \ ReLU 避免了神经元输出零的死亡 ReLU 问题。它在处理负输入值的同时解决了 ReLU 的缺点。\n- `输出范围`：(-∞, ∞)\n- `公式`：`Leaky\
  \ ReLU(x) = x if x > 0, else a * x`（其中“a”是一个较小的正常数，通常为 0.01）\n- 允许负输入产生微小梯度，这解决了死亡\
  \ ReLU 问题。防止了神经元完全失活 [[5\\]。\n\n### 2.4.2 损失函数\n\n\n\n\n\n一种通常被称为代价函数或目标特征的损失特性（loss\
  \ characteristic），是小工具设备学习中深度神经网络社区模型训练方法的重要部分。真实目标值（地面真值）与期望值（模型输出）之间的不准确性或差异就是测量的对象。这种损失特征通过显示版本运行的好坏程度来告知掌握方式，因此，最小化它到目前是训练过程中的首要目标\
  \ [6]。让我们仔细观察损失能力：\n\n### ## 2.4.2.1 损失函数的用途\n\n- **衡量误差：** 特别用于区分真实目标值与模型预测值之间差异的损失特征。损失将随误差成比例增加。\n\
  - **引导优化：** 在学习过程中，通过修改版本的权重和偏置来限制损失。这些修改是通过使用梯度下降等优化技术完成的，这些技术计算损失函数相对于参数的梯度。\n\
  - **指定目标：** 根据任务的类型（例如，分类、回归或生成式建模），损失函数的选择设定了模型的特定学习目标。\n\n### ## 2.4.2.2 损失函数的类型\n\
  \n#### ### 2.4.2.2.1 回归损失函数\n\n当目标是预测连续数值时，会使用回归损失函数。\n\n1. i. **均方误差 (MSE) 损失：**\n\
  2. MSE 是一种额外的指标，用于计算预测值与观测值之间平方差的平均值。虽然它比 MAE 对离群值（异常）更敏感，但它对较大误差的惩罚更严厉，这通常会导致训练优化景观更加平滑。\n\
  \   - **公式：** `MSE = (1/n) * Σ (yᵢ – ŷᵢ)²`，其中 `n` 是数据点数量，`ŷᵢ` 是预测值，`yᵢ` 是真实值。\n\
  \   - 常用于常见的回归问题。\n   - 突出了较大的误差并关注离群值 [6]。\n\n3. ii. **平均绝对误差 (MAE) 损失：**\n   MAE\
  \ 指标衡量了预测值与实际值之间的平均绝对差异。它提供了一个直观、易懂的平均预测误差指标。\n   - **公式：** `MAE = (1/n) * Σᵢ –\
  \ ŷᵢ|`，其中 `n` 是数据点数量，`ŷᵢ` 是预测值，`yᵢ` 是真实值。\n   - 衡量预测值与值之间的平均绝对差。\n   - 与 MSE 相比，较不受离群值影响\
  \ [7]。\n\n#### ### 2.4.2.2.2 分类损失函数\n\n这些用于分类任务，其目标是将数据点分配到离散类别。\n\n1. i. **二分类交叉熵损失（对数损失）：**\n\
  2. 二分类问题使用的损失函数之一是二分类交叉熵。它通过衡量预测概率与实际二分类结果之间的差异，鼓励模型减少每个实例期望值与实际值之间的差异。\n   - **公式：**\
  \ `BCE = –Σ (yᵢ * log (ŷᵢ) + (1 – yᵢ) * log (1 – ŷᵢ))`，其中 `ŷᵢ` 代表类别 1 的期望概率，`yᵢ`\
  \ 代表真实类别（0 或 1）。\n   - 用于需要二分类任务的任务。\n   - 计算期望类别概率与实际类别分布之间的差异 [7]。\n\n3. ii. **分类交叉熵损失（Softmax\
  \ 损失）：**\n4. 涉及多个类别分类的任务使用分类交叉熵。它通过衡量期望类别概率与实际类别分布之间的差异，鼓励模型分配更高的概率概率。\n   - **公式：**\
  \ `CCE = –Σ (yᵢ * log (ŷᵢ))`，其中 `yᵢ` 是 one-hot 编码的真实类别，`ŷᵢ` 是预测类别概率。\n   - 用于多类别任务。\n\
  \   - 惩罚 [7]。\n\n#### ### 2.4.2.2.3 生成损失函数\n\n这些用于如生成对抗网络（GAN）和变分自编码器（VAE）等生成模型。\n\
  \n1. i. **GAN 损失：**\n2. GAN 使用两部分损失函数：\n3. **生成器损失：** 指示生成器欺骗判别器的能力。\n4. **判别器损失：**\
  \ 指示判别器区分人工真实样本的能力。\n5. ii. **变分自编码器 (VAE) 损失：**\n6. VAE 使用组合损失：\n   - **重建损失：**\
  \ 为了鼓励模型准确重建输入，重建损失衡量输入与重建输出之间的差异。\n   - **KL 散损失：** 当潜变量偏离指定分布（通常为高斯分布）时惩罚潜空间 [7]。\n\
  \n取决于问题的性质和使用的数据类型，必须选择合适的损失函数。选择最佳损失函数需要在解释性、稳健性和数据集特性之间进行权衡。不同的损失函数突出了性能的各个方面。通常通过实验和领域知识来选择合适的损失函数。\n\
  \n## ## 2.5 反向传播与梯度下降\n\n### ### 2.5.1 反向传播\n\n深度学习的一个重要部分是熟悉被称为反向传播的方法，有时称为“误差反向传播”，它用于训练神经网络。为了提供可靠的预测，最小化目标损失特征并修改社区的权重和偏置至关重要\
  \ [6]。以下是反向传播规则的详细说明：\n\n1. i. **前向传播：**\n前向传播是反向传播的初步阶段。在此期间，神经网络接收输入并通过将其传递到输出层来做出预测。每一层通过计算其输入的加权和并使用激活特性产生其输出。6]\n\
  \n2. ii. **计算损失：**\n在前向跳跃后，将神经网络的输出与精确目标值进行比较。使用损失特征（也称为代价特性）来确定预测与实际目标之间的误差或差异。根据具体处理的任务，可能会选择包含均方误差的回归或交叉熵的分类的损失函数。\n\
  \n3. iii. **后向传播（反向传播）：**\n反向传播（也称为后向传播）反向传播技术的第一部分是后向传播，包括从输出层返回输入层时计算损失的梯度（导数），并考虑版本的参数（权重和偏置）。\n\
  \n4. iv. **链式法则：**\n使用链式法则来计算梯度。它指出复合特征的导数等于其因子函数导数的乘积。在神经网络的上下文中，损失相对于单层参数的梯度可以通过链式后续层的梯度来计算。\n\
  \n\n\n\n\n## v. 梯度计算：\n\n对于每一层，梯度的计算分两个步骤进行：\n\n*   **局部梯度计算：**\n    局部梯度是应用于该层的激活函数的加权和加权导数。它衡量了该层输出对加权和变化的变化的敏感程度。\n\
  *   **误差反向传播：**\n    损失相对于加权和的梯度通过将局部梯度与损失相对于该层输出的梯度（在上一层中计算）相乘得到。\n*   **权重和偏置更新：**\n\
  \    在计算梯度后，每一层的权重和偏置将以最小化损失的方向进行更新。通常使用如梯度下降等优化算法来执行此更新。控制优化过程中步长的学习率超参数也控制了更新的大小。\n\
  \n## vi. 迭代过程：\n\n步骤 1 到 6 会针对预定义的轮次（epochs）数量反复重复执行，或者直到损失收敛到可以接受的水平。随着模型不断获得使用训练数据改进其预测的能力，它会不断调整参数以最小化损失。[8]\n\
  \n## vii. 随机梯度下降 (SGD)：\n\n随机梯度下降是实践中确实被使用的梯度下降的一个版本。它被频繁使用，在每个新发布时计算梯度，并随机选择一个微批（mini-batch）训练示例。在优化过程中引入随机性有助于防止陷入局部最优。\n\
  \n这是神经网络领域的核心规则；反向传播的有效性使得深度和复杂模型的训练成为可能。它是许多程序中深度获取有效性知识的关键，包括强化学习、自然语言处理和图像流行化。\n\
  \n### 2.5.2 梯度下降\n\n在训练期间，神经网络的权重和偏置通过一种称为梯度下降的基础优化方法进行更新。其核心目标是限制一个确定的损失特征，该特征衡量了模型版本的预测输出与数据集实际目标值之间的差异。关于用于深度学习的梯度下降算法的详细解释见下文\
  \ [10]。\n\n### i. 初始化：\n\n参数（权重和偏置）在整个学习过程中首先初始化为较小的随机值。神经网络的行为通过这些参数来定义。\n\n###\
  \ ii. 前向传播\n\n前向传播是在整个学习过程中将输入信息通过神经网络传输的技术。每一层都会计算网络输入的加权和，然后使用激活特征生成该层的输出。层层递进，前向传播一直持续直到获得理想的输出。[10]。\n\
  \n### iii. 计算损失：\n\n前向传播完成后，将神经网络的输出与真实目标值进行比较。在比较预期输出与真实目标时，使用损失特征（也称为代价函数）计算误差或差异。均方误差（MSE）是回归中常见的损失特征，而交叉熵（原文为\
  \ move entropy）用于分类 [10]。\n\n### iv. 梯度计算：\n\n梯度计算，即损失函数相对于模型参数的导数，是梯度下降的基础。梯度展示了改变参数将如何改变损失。由于它允许将复合函数的导数写为各个分函数导数之和，因此使用微积分中的链式法则来计算梯度。梯度显示了为了减少损失而对神经网络应做的每个参数修改的大小和方向\
  \ [11, 12]。\n\n### v. 更新参数：\n\n在计算梯度后，神经网络的权重和偏置将以最小化损失的方向进行更新。通常使用如梯度下降等优化算法来执行此更新。控制优化过程中步长的学习率超参数也控制了更新的大小。\n\
  \n## vi. 迭代过程：\n\n步骤 1 到 6 会针对预定义的轮次（epochs）数量反复重复执行，或者直到损失收敛到可以接受的水平。随着模型不断获得使用训练数据改进其预测的能力，它会不断调整参数以最小化损失。\n\
  \n## vii. 随机梯度下降 (SGD)：\n\n随机梯度下降是实践中确实被使用的梯度下降的一个版本。它被频繁使用，在每个新发布时计算梯度，并随机选择一个微批（mini-batch）训练示例。在优化过程中引入随机性有助于防止陷入局部最优。\n\
  \n深度学习中使用的许多优化技术，结合微批梯度下降、adam、RMSprop 等，都是构建在梯度下降的概念之上的 [16, 17]。优化方法和超参数（包括学习率）的选择在深度神经网络中是非常重要的。\n\
  \n## 2.6 总结\n\n总结，本章通过针对重要的基础原理，探索了现代人工智能的复杂性。通过揭示神经网络的设计原理、研究激活特征和损失特征，并以对梯度下降的深入研究结束，本章为深度学习的理解提供了启发。\n\
  \n显然，掌握这些基础原理对于对于在这个快速发展的人工智能领域至关重要。无论是想要进入该领域的学者，还是想要刷新知识的专业人士，都可以将这次基础之旅作为跳石。\n\
