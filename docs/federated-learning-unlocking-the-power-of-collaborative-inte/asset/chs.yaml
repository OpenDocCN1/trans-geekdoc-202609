  \ S. Babu 和 B. Sahoo, “使用深度协同过滤方法改进小组推荐”,Int. J. Inf. Technol., vol. 15, no. 3,\
  \ pp. 1489–1497, 2023.\n\n\n\n\n人工智能（AI）和机器学习（ML）的进展 [1\\]正引导我们走向一个非常充满前景的未来。特别是当我们研究目前在深度学习这一特定领域所取得的进展，以及我们与过去相比的现状时。但这仅仅是一个未来的开始，未来我们将能够为患者提供临床级的决策和罕见病预测。为了达到这种程度的准确性和精度，我们需要访问大量的医疗记录。我们目前遵循的方法阻碍了我们实现这一点并获得所需的进展。之所以如此，是因为我们无法访问存储在不同机构数据孤岛中的医疗数据。目前，这些数据没有得到充分利用，只是静地待在那里毫无毫无处。联邦学习（FL）是一个包含多种隐私保护技术的框架，我们应用这些技术来克服经典机器学习模型的问题。以一个基于\
  \ AI 的肿瘤检测器为例，它要求我们为模型提供包含不同数据类型、解剖结构和病理肿瘤医疗记录的大型数据集。这样我们就能训练出一个能够根据不同患者的记录检测肿瘤的检测器。这并不容易，因为获取这类数据几乎是不可能的。这类数据具有高度敏感性，机构对这些数据的管理非常严格，确保不会由于法律和伦理影响导致任何一个人的数据泄露。我们可能可以使用计算机乳造检查或磁共振成像数据来生成患者的面部\
  \ [2, 3, 4, 5, 6]]。\n\n机构之间或机构与可能访问数据的不同类型服务之间，缺乏一种系统化的数据协作方法，这不仅仅是因为需要安全和治理，而是因为存在隐私问题。机构之间或机构与可能访问数据的不同类型服务之间缺乏一种系统化的数据协作方法，还存在对数据安全和隐私的额外担忧。维护这些数据、清理数据并确保数据具有意义的信息也是很有成本的，这样一旦共享或协作，需要研究这些数据的方就可以轻松使用。此类数据也总是具有某些业务价值\
  \ [7]]。\n\n联邦学习是解决我们在传统机器学习方面遇到的这些问题的解决方案。它是为了各种用例开发的，但在医疗领域引起了广泛关注。它为我们提供了一种解决方案，允许我们在不同机构数据孤岛中的各种医疗记录上训练机器学习模型；通过联邦学习，我们可以安全地访问数据并保护患者的隐私。数据不需要离开参与方的数据中心，而是我们将模型发送到这些实体，并在那里训练模型，然后将模型更新传回我们的中央服务器，服务器对这些模型取平均值，并创建一个通过所有允许访问数据进行模型训练的参与方协作训练的全局模型。这不会发送任何敏感信息或泄露任何患者的身份，事实上，数据没有离开参与方，因此他们在保持完全控制权的同时也确保了安全和隐私。在全球范围内成功实施联邦学习，可以为医疗提供者提供精准医疗、更好的治疗和决策等解决方案。在患者的生活方式、行为和选择上训练\
  \ AI 模型使我们能够预测可能导致轻微后果的罕见病，并避免进一步的伤害。这还可以通过使用那些接受过类似症状和疾病治疗的人所提供的信息来帮助诊断患者，同时确保患者数据是私私的、安全的且匿名的。\n\
  \n虽然联邦学习的未来看起来很好，但仍有一些我们必须考虑和解决的挑战。我们需要确保这些模型的性能是非常高效的，并且这些模型提供的预测和建议要达到临床级水平。这一切在不损害患者隐私或安全的情况下实现。我们将讨论联邦学习在医疗保健中的关键作用。我们如何在医疗保健这一非常特定的领域充分利用联邦学习。我们将介绍可以使用的各种隐私保护技术，以保证患者的隐私和数据安全，以便所有协作患者数据的参与方保留对其数据的完全访问权和控制权，而研究人员和训练者无法直接访问数据，他们只获得所需的内容，直到双方对联邦学习实施所产生的输出都满意。这并非没有我们在联邦学习中面临的新挑战，以及在此过程中必须考虑的某些事量\
  \ [2, 6, 8]\\]。\n\n## 6.1.1 背景\n\n机器学习模型是大型数据集，帮助我们训练这些模型，直到这些模型能够提供可以在现实场景中使用的更好的预测和建议。垃圾邮件过滤器和推荐系统等服务是这些机器学习模型的常见示例。你可能会好奇这些模型是如何训练的，为什么表现得如此，以及这些海量数据从哪里来。电子邮件、音乐流媒体和我们享用的其他各种免费服务是以我们的数据交换的，这些数据随后被收集并用于训练模型。2016\
  \ 年，Google 引入了联邦学习。与此同时，当剑桥分析公司丑闻发生时，我们看到对个人数据使用和误用的担忧日益增加。当 Facebook 的数据泄露时，引起了全球关注，世界意识到用用户数据交换免费服务可能会导致现实后果。联邦学习是一种在去中心化数据上训练模型的方法，而不是将数据收集在一个地方。联邦学习为用户提供了一个在用户设备上训练的基础模型，然后传回更新进行迭代，直到我们获得一个平均模型。一旦我们有了优化的模型，就可以进入下一步，即部署\
  \ [9, 10]\\]。\n\n![图 6.1 多机构协作系统架构](img/fig6.1.jpg)\n\n**图 6.1** 多机构协作系统架构\n\n联邦学习是训练模型和执行机器学习任务的一种天才方法。然而，我们通过其对医疗保健的影响来衡量其效率。由于其性质，医疗数据等个人数据高度敏感且机密。然而，将这些数据与第三方共享并不容易。这样做可能会导致潜在风险，例如缺乏安全、数据泄露和对数据的控制减少。\n\
  \n### 6.1.2 目标\n\n\n\n本章旨在讨论联邦学习（FL）在医疗保健领域的核心目标。我们将讨论如何利用联邦学习在保护隐私的同时，通过分布式协作的方法进行数据分析和医学研究。机器学习（ML）广泛应用于日常任务，但在医疗保健领域的应用受限，而\
  \ FL 解决了这一问题，释放了机器学习的全部潜力。然而，尽管听起来很迷人，但要实现这一目标需要多种技术的结合，我们将详细讨论这些各种技术，例如数据匿名化、差分隐私、安全多方计算和同态加密。\n\
  \n将这些技术与机器学习相结合是 FL 的核心，它帮助我们构建更稳健的模型，以实现更好的预测和疾病诊断。尽管这看起来非常有前景，但在采用这种方法时我们也必须考虑挑战和因素，例如：我们是否信任某些参与者？我们是否应该追求无信任（trustless），并朝着一个不需要参与者和不同实体之间信任的方向发展？或者如何确保数据没有偏差且公平，并克服缺乏标准的问题？我们将在后的章节中详细研究这些内容。\n\
  \n## 6.2 隐私保护型医学研究与分析\n\n隐私保护学习技术是帮助保护用户隐私的合并技术。机器学习算法在设计之初就是为了处理和分析数据，这被称为训练。在所有医院中，都会生成医疗记录，患者记录及其诊断历史被存储在计算机中，并产生大量数据。手动分析这些数据并从中得出结论可能是昂贵的、耗时的，并且容易产生人为错误。如果我们在这些数据上训练机器学习模型，并让机器学习模型可以使用这些数据，就可以提高准确性，帮助医疗提供者做出更好的决策。\n\
  \n从模型或给定结果中研究这些有意义的见解，可以为进一步的医学研究和分析铺平道路。对于研究人员来说，研究医疗数据产生更好的结果以帮助医疗提供者一直是一个重要课题；然而，由于缺乏数据可用性和互操作性，要在这些记录上进行操作并利用每个医院每个科部门产生的数据并不容易。\n\
  \n主要的担忧是医疗保健提供者侵犯了患者的身份、尊严和信任。同时，我们也知道将数据提供给机器学习以训练更好的模型、从而产生更好的结果并帮助医疗提供者是多么重要的。我们不能忽视保持所有信息私密性的需求，这些担忧也是导致至今没有多少机构与研究人员共享数据进行医学分析或学术研究的主要原因，这些担忧是真实的，并带有法律影响和法律后果。FL\
  \ 是解决所有这些问题的解决方案。\n\nFL 的核心概念是解决这一问题，特别是在医疗保健领域。这可能是一个改变生活的实施方案。医疗部门将不必与任何他们不信任的第三方共享数据，也不必面临当局或患者的任何法律后果。某些技术允许我们在其数据上训练模型，而无需了解个人信息或有关他们的任何特定细节。数据永远不会离开这些医疗部门的存储中心，我们将详细研究这些允许我们保护患者隐私、并让我们能够在数据上进行训练、同时帮助研究人员和医疗提供者的技术。\n\
  \n### 6.2.1 隐私保护技术\n\n隐私保护技术是 FL 的基石。我们假设参与者的数量很大，假设可能达到数百万，且所有人都都在以不同的规模对不同类型的医疗记录进行协作。我们无法确保所有这些参与者都是完全合法的，并且没有意图在训练过程中破坏或产生错误。\n\
  \n模型在 FL 中是本地训练的，因此我们还需要确保对于那些参与训练过程的人，其数据不会被泄露，或者在模型训练过程中模型参数不会发生信息泄漏。为了防止此类问题，我们拥有隐私保护技术，它们是\
  \ FL 的主要构建模块。它们保证了数据的隐私性，确保没有信息被泄露，确保协作者的身份保持完全匿名，且用于训练的数据与个人身份之间没有关系。这些技术包括数据匿名化、差分隐私、安全多方计算和数据同态加密。这些技术充当基石，我们可以看到它们是\
  \ FL 中隐私保护的四大主要支柱 [8, 11]。\n\n### 6.2.2 数据匿名化\n\n医疗健康记录包含患者的详细信息，如社会安全号码、地址、姓名或任何属于患者身份的其他信息。此类信息始终附带在医疗记录中，滥用这些信息可能会危及患者隐私，并为为了训练机器学习算法而与他人协作这些数据的组织带来法律后果。\n\
  \n数据匿名化是一种隐私保护技术，我们通过添加噪声或对数据进行伪匿名化，并更改任何与患者身份相关的信息。这些信息因不同的数据集而异，但主要对于医疗记录而言，它包括姓名、地址以及不同类型的个人记录，这些记录可以识别患者，或帮助识别医疗提供者及其患者，并根据其身份对患者进行分类。\n\
  \n数据匿名化将所有这些信息转换为假名或基本上无用或无法用于识别患者的无意义信息。该协议用于 FL，并允许我们在为了训练所需的数据上执行计算并训练模型，同时移除不需要的信息，我们仍然可以在不需要这些信息的情况下训练模型。当我们需要为特定的用用例（如精准医疗）训练模型时，我们可以在不知道患者姓名或家庭地址的情况下训练模型，因此匿名化患者身份变得更容易，并为在不冒隐私风险的情况下在数据上训练模型开启了大门。\n\
  \n### 6.2.3 差分隐私 (DP)\n\n当我们访问数据集时，我们需要对其进行分析，并且必须在不损害患者隐私的情况下进行。这只能通过差分隐私来实现，因为它允许我们在不泄露个人信息的情况下分析数据集。这在\
  \ FL 中与其他隐私保护技术结合使用，这样一旦数据匿名化且没有关于个人的信息被泄露，我们就可以在无法访问个人隐私信息的情况下分析数据。\n\n\n\n\n这允许在不获取用户任何特定信息的情况下进行模型训练，并用于保护算法的输出。这涉及到将统计查询替换为添加随机噪声的算法。这种随机噪声被添加到算法中，以确保所有分析都具有隐私性。然而，随着数据集的增加或如果我们必须分析大型数据集，它可能会变成性能的负担。为了避免这种情况，我们可以将其与安全多方计算相结合，以同时兼顾隐私和性能并高效工作\
  \ [12]。\n\n### 6.2.4 安全多方计算 (SMC)\n\n`SMC` 完全适用于联邦学习（FL）场景，在这种场景下，每个参与方持有其拥有的信息并在数据上进行计算，而不泄露任何隐私信息或与数据相关的信息。`SMC`\
  \ 有两个主要目标，基本上是准确性和隐私性。`SMC` 确保在执行计算时信息保密，且不会发生信息泄露。当双方协作其数据时，这可以防止他们共享信息，并确保所有方共享的都是真实信息，且该协议提供的结果是完全正确的。\n\
  \n当存在大量协作方且难以确定方数量时，从假设上讲，我们无法仅仅保证所有方都是法的。将这些数据集合并为单一数据集也会产生某些问题，再次导致问题。`SMC` 允许我们仅共享来自数据的计算洞察，并隐藏任何敏感信息，且该协议负责安全性。由于\
  \ `SMC` 的特性，它可以被用于获取有关数据集的洞察，并将权重更新发送到中央服务器，而无需知道隐私信息或参与方不想泄露或发送给中央服务器的任何信息。这样，中央服务器获取了协作方的权重，但无法从该输出中推导出输入，随后组合所有这些权重得到一个平均输出，该输出可以供模型使用\
  \ [13]。\n\n### 6.2.5 同态加密\n\n所有组织都存储数据，并且需要数据协作，但组织并不希望提供明文记录的访问权限。需要将这些记录转换为只有该组织可以读取的格式。任何其他尝试访问这些记录的人都不应该能够读取它们，或者即使他们读取，对第三方来说也完全没有意义。将明文记录或不同类型的记录转换为密文被称为加密。现在你可能想这是否可以是保障数据安全的解决方案；我们可以在服务器上拥有数据，然后使用普通技术对这些数据进行加密。适当加密意味着数据可以使用公钥加密，与原始数据没有关系，并且只能由原始加密数据的权威机构拥有的私钥解密。\n\
  \n这可能会引发与隐私相关的问题。我们知道，通过加密几乎不可能暴露任何信息，但当组织本身解密数据时，这可能会暴露信息，从而带来从用户处泄露信息的风险。因为当我们必须训练模型并将模型发送给参与方时，该模型需要对数据的某些访问权限，如果这些数据对任何人来说都是不可读或无意义的，那么对模型来说也是没用的，这是合情合理的。模型将无法从完全加密的数据中学习任何东西，如果参与方尝试提供数据访问权限，那么它必须使用其私钥，这可能会危及其私钥。一旦密钥泄露，可能会导致隐私风险和对数据的非法访问。如果有人拿到了该密钥，组织可能会失去对其数据的访问权限，并暴露为数百万患者持有的所有信息。\n\
  \n解决此问题的更好方案是同态加密，它允许将数据加密为密文，并在这些数据上执行计算。这消除了损害隐私的风险，因为你仍然可以执行计算并从数据中获得有意义洞察。一旦数据集被加密且我们要在该数据上训练模型，参与方完全不必担心泄露任何信息。我们的模型将能够学习并执行计算，这些信息对于模型而言不是无意义的，相反，它对其具有某些有用意义。如果不需要解密数据，意味着不需要共享私钥，这保证了顶级的安全和隐私。然而，这并不是没有局限性的，对于大型且复杂的计算，始终存在性能开销，这意味着这可能会变成计算密集型且缓慢的\
  \ [13, 14, 15, 16]。\n\n## 6.3 联邦学习\n\n这是一个构建在多种隐私保护技术之上的复杂框架，它不仅允许我们进行机器学习和计算，还能维护数据的隐私和机密性。数据始终保持去中心化，并在迭代过程中发送模型更新，不断重复此过程，直到模型完全训练完成并准备好部署。\n\
  \n![图 6.2 联邦学习 (FL) 工作流示例与在集中式数据湖上学习的区别 [11]。](images/fig62.jpg)\n\n**图 6.2** *联邦学习\
  \ (FL) 工作流示例与在集中式数据湖上学习的区别 [11]。\n\n这是 `FL` 步进机制的工作方式，旨在确保隐私并执行 `ML`。`ML` 成为我们日常生活，研究人员一直在优化这些模型并提供更好的性能。语音助手和机器人都在海量数据上进行训练。这需要数据存在中央服务器上并对这些数据进行训练。一个常见的例子是电动汽车，这些车辆每天产生数百万\
  \ GB 的数据。这些数据随后存储在中央服务器上，然后使用这些数据实施 `ML`，为电动汽车制造商提供更好的服务 [11]。\n\n\n\n\n\n如果有人能够访问中央服务器，他们不仅可以访问基于这些数据训练的模型，还可以访问整个数据集。通过这些数据，他们可以识别车辆并对其进行黑客攻击或追踪其移动轨迹，从而对车辆或车主造成损害。然而，在某些非常基础的场景下，传统的\
  \ `ML` 可以工作的，例如 `Google Photos`，它将你的数据存储在云端，并继续在这些数据上训练模型，同时允许你执行某些操作，如整理照片或检测人脸，并让你找到不同人的照片。现在我们可能会认为在这种用法下也存在潜在危险，但现在我们理解到传统的\
  \ `ML` 确实存在风险，不过这种隐私风险的程度取决于所涉及的用例。\n\n这就是 `FL` 发挥巨大作用的地方，我们可以从电动和云应用（如 `Google\
  \ Photos`）两个例子来看。让我们先研究电动的例子，我们之前讨论过它在经典模型中是如何工作的；然而，如果我们在这个用例中应用 `FL`，我们就不需要每天向第三方服务器上传数百万\
  \ GB 的数据，它消除了隐私风险问题，从而带来了更好的体验。\n\n我们只需向这些车辆发送一个全局模型，让其在车辆产生的数据上进行训练，并确保模型更新被传回，一旦更新后的模型准备就绪即可部署。车主可以继续享受以前的益处，而无需担心隐私，也不必一直面临被黑客攻击并遭受某种损害的风险。这还为制造商节省了带宽和存储空间，并且不需要大量的计算力，他们可以利用车辆来训练模型。\n\
  \n现在，在像 `Google Photos` 这样的云应用中，如果应用了 `FL`，它将消除任何隐私问题，例如第三方无法访问你的数据；如果第三方服务器遭到破坏，你的数据将不受影响，而用于整理照片或检测地点的\
  \ `ML` 将依然存在，并让你在无任何隐私担忧的情况下使用这些功能。\n\n### 6.3.1 在疾病诊断和预测中的应用\n\n`FL` 是一种通用的学习范式，但它在医疗保健领域有多个用例，并消除了模型训练和开发汇总数据的需求。它跨越了整个医疗领域，并在每可能的方式提供了效率。例如，由于缺乏可用数据集，预测或检测肿瘤并不容易。这有充分的原因，因为可以使用计算机断层扫描\
  \ (`CT`) 或磁共共振成像 (`MRI`) 数据重建患者的脸部。这种检测需要不同的参数，如解剖结构、病理学和不同的数据类型，这些数据很难从管理这些数据的机构处获得。然而，如果这类数据能够容易地提供和共享，不同的组织可以简单地参与训练或测试阶段，它们就可以为\
  \ `FL` 的这种全球规模扩展做出贡献，并通过高质量的疾病诊断和预测为所有患者带来利益。这为所有人提供了平等，无论某人位于偏远地区还是大城市的医院，他们都能享受相同质量的治疗，而这一切都是通过\
  \ `FL` 实现的。\n\n由于 `FL` 使得使用去中心化分散的健康数据训练模型成为可能，它在医疗保健领域具有巨大的潜力。如果患者隐私得到维护，这可以促进更精确、更定制化的模型开发，以及对更大数量数据的分析。此外，`FL`\
  \ 可以促进使用难以获取和难以聚合的数据进行模型训练，例如来自农村或欠发达地区的数据。此外，通过促进许多企业之间的数据共享和分析，`ML` 可以帮助消除医疗数据孤岛。此外，`FL`\
  \ 现在更有效地从分散在多个站点且无法合并为单一数据集的数据中学习。诊断是通过检查症状来识别疾病。这种技术被用于各个领域以研究因果关系。一些现实世界的用例包括药物发现、`COVID-19`\
  \ 预测以及广泛使用 `EHRs` 来预测死亡率 [7, 8, 11, 16]（注：原文引用处保留了格式）。\n\n#### 6.3.1.1 COVID-19\
  \ 诊断\n\n`COVID-19` 是 2020 年研究的重点。当世界卫生组织 (`WHO`) 将其宣布为大流行时，这成为了研究的优先级。针对诊断、预防或预测此类疾病的各种活动正在进行。期间，医疗系统未被充分利用，没有发挥出潜力。这些系统未充分利用的主要原因是它们无法访问这些信息，而管理数据的机构拥有访问权限但没有正确使用。还存在限制访问的隐私政策以及法律影响。一些患者可能不同意使用其数据或公开其身份。这种问题或此类问题可以通过\
  \ `FL` 轻松解决。\n\n开发全球性的 `FL` 系统将允许对 `COVID-19` 进行预测的预防。由于无法有效地预测这种疾病或分析可用信息，大流行几乎失控，并在财务和人类生命方面造成了巨大损害。如果使用了\
  \ `FL`，情况就不会如此，因为人们的数据将是安全的且在自己的控制之下，并且对该疾病有全球意识，并提供更好、更有效的治疗方法。\n\n#### 6.3.1.2\
  \ 血压估计\n\n慢性心脏病被世界卫生组织 (`WHO`) 确定为 2000 年至 2019 年全球死亡的主要原因，这凸显了它对个人和公共医疗系统的深刻影响。理解健康与受损心血管系统之间动态的需求促使医生依赖心电图\
  \ (`ECG`) 和血压 (`BP`) 数。\n\n然而，获取连续动脉血压 (`ABP`) 值的侵入性以及相关的成本，促使人们寻找更高效、更保护隐私的方法。`FL`\
  \ 可用于基于患者数据进行分析和发现。\n\n\n\n\n诊所位于不同的地点，为每个城镇、城市或村庄的患者提供医疗保健服务。它们独立运行，并产生了大量数据，但这些数据并没有被充分利用。诊所都有自己的治疗方法，某些方法可能与众不同；它们都拥有各种经验，这可能导致诊断中的偏差并产生截然不同的结果。这可以通过\
  \ `FL`（联邦学习）作为中间方来解决，它可以帮助消除决策过程中的偏差，让临床医生能够做出更好的决策，并以更有效的方式诊断患者。\n\n### 6.3.1.4\
  \ 患者\n\n使用 `FL`，所有患者都可能获得平等的治疗。如果我们对在偏远地区或大城市医院治疗的患者实施 `FL`，这种情况就会发生。例如，所有患者都在当地接受治疗，如果我们在大范围内实施\
  \ `FL`，我们就可以建立一个系统，无论患者位于何处，都能更容易且一致地对所有患者的治疗做出准确且相似的决策。大规模全球 `FL` 系统将确保所有治疗患者的诊所都能访问该系统，从而为他们提供更好的决策并允许他们采取合理的行动。然而，可能存在某些不常见的疾病，这可以成为在疾病早期阶段预防这些疾病并确保给出适当诊断的方法，从而使面临的后果尽可能减轻。\n\
  \n### 6.3.1.5 医疗提供者\n\n精准医疗是医疗提供者利用健康数据和个人生活（例如他们居住的环境或他们可能做的生活选择）为患者提供更好治疗的方法。这样做是为了提供更好的治疗并防止进一步伤害，或预测哪种治疗方法对哪些人群最有效。这可以帮助医疗提供者做出高度准确的决策，并让患者以对他们有效的方式接受治疗，而无需经历严谨的实验过程来寻找什么方法有效，这会对患者及其周围人员的生活产生巨大影响。\n\
  \n### 6.3.1.6 癌症研究\n\n`FL` 在癌症研究和预测中非常有用，因为它解决了与敏感医疗数据相关的隐私问题。它允许对乳腺检查、计算机断层扫描（CT）、磁共振成像（MRI）和\
  \ X 射线进行扫描和分析，有助于获取训练模型所需的信息和知识，使模型能够部署并应用于高效的治疗过程和疾病预测中。这让患者和医生都能做出更好的治疗和决策。通过在各种数据集上训练癌症预测模型，这种去中心化的方法提高了泛化能力和鲁棒性。`FL`\
  \ 还减少了传输大量医疗数据的需求，降低了隐私顾虑并确保了法律合规性。该系统支持为各种机构定制模型，而实时更新功能允许对新趋势进行持续适应。`FL` 是一种很有前景的方法，因为它允许以去中心化的方式进行自适应学习。\n\
  \n## 6.4 健康数据协作中的挑战与考虑\n\n尽管 `FL` 具有这些优势，但在与 `FL` 合作时，我们必须考虑某些挑战和事宜。无论是基于 `FL` 还是基于\
  \ `NON-FL` 的学习，这两者都会面临这些挑战。我们必须考虑这些挑战，例如`数据质量`、`标准化`和`偏差`。我们必须采取措施来解决这些问题，例如仔细的研究设计、通用的数据获取协议、结构化报告，以及发现偏差和隐藏分层的先进方法论。在下文中，我们讨论了这些挑战和考虑因素\
  \ [3]。\n\n### 6.4.1 数据异构性\n\n数据异构性意味着数据的多样性，涵盖了极其多样的数据类型，并来自各种来源，如数据库、不同的医疗记录、电子健康记录系统和不同类型的日志。由于数据质量、模态、分布和标记的问题，数据异构性使得训练决策算法变得困难。它可能导致决策偏差，或提供没有太大用的低质量预测，或者这些预测由于数据异构性而错误到完全无用的地步。\n\
  \n应对和解决这一问题可以带来更好的算法训练和开发。获取不受数据异构性影响的数据并成功减轻数据异构性的影响，是 `FL` 在全球范围内扩展规模的关键步骤。这一进展可以增强该框架及其技术对每个用户的效用性和有效性。\n\
  \n### 6.4.2 数据可追溯性\n\n`FL` 涉及涉及多种硬件、软件和网络的多方计算，这对于安全关键型应用是必须的。我们在这方面面临的主要挑战包括 `FL`\
  \ 运行环境的多样化，使得系统可重复性难以实现。资产的强制追溯性（特别是在非信誉联邦中）构成了执行完整性的挑战。确定参与者贡献的确切数量并建立公平的补偿模型并不是一项容易完成或实现的任务。由于研究人员缺乏直接访问训练数据的权限，隐私顾虑随之产生，这影响了他们理解意外结果的能力。`FL`\
  \ 的分布式特性也阻碍了全局模型的解释和解释性，因此需要安全的查看设施。解决这些挑战对于 `FL` 在医疗领域的成功部署至关重要。\n\n### 6.4.3 数据安全与隐私\n\
  \n医疗数据高度敏感。因此，必须用高安全性对其进行保护，并用良好的结构化协议收紧数据隐私，以确保数据隐私。一些关键考虑因素是关于 `FL` 保护隐私能力的权衡、策略和剩余风险。`FL`\
  \ 并不是万能的解决方案。它比传统的 `ML`（机器学习）效率得多，但它仍然有自己的风险和隐私问题。这些模型提供了更好的隐私，但在实现这种隐私水平时存在权衡，而这种权衡的代价是性能，这些技术会影响模型的性能。例如，这可能会极大地影响模型的准确性。\n\
  \n我们还会遇到信任或完全不信任的问题。如果我们选择信任，那么我们必须将所有参与协作的方视为信任方。这可以通过达成共同协议并确保所有参与方都是值得信赖的，而那些想要破坏模型或滥用信息的人会被这种方法排除。这减少了在隐私方面做出额外努力的需求，但这再次变成了一个信任问题，这与任何方法或技术无关，完全基于人类互动。\n\
  \n这也有其优点和缺缺点。如果我们实施一种不需要建立信任的不信任流程，就可以包含所有想要参与并为模型训练做出贡献的方。我们可能会消除之前的问题，但引入了许多需要处理的新问题，如故意的数据泄露、数据损坏或故意的模型性能下降。为了克服这些问题，我们必须遵循严格的政策，并改进加密技术，采取帮助我们验证所有参与方及其身份的策略。\n\
  \n### 6.4.4 伦理考量\n\n\n\n\n\n在使用 `FL` 的时候，我们需要确保它是公平的、无偏见的、透明的，并且你对自己的数据拥有完全的所有权。假设你和你任何与你相似的人使用同一个模型，尽管你们拥有相同的模型，但针对相同的问题你们却没有得到相同的结果，这意味着这其中缺乏公平性，而且在伦理上是错误的。无论如何，每个人都应该获得相同的服务，无论其位置、种族或性别。同样重要的是，训练出的模型不能包含任何偏见。提供的结果不偏袒也不反对特定主题或某个非常具体的讨论。所有参与方都有权了解其数据是如何被使用和利用的。模型如何利用他们提供的数据进行训练，以及整个\
  \ `FL` 工作的所有细节，这些被称为透明性 [2, 3, 11, 18]。\n\n## 6.5 结论与未来方向\n\n`ML` 在解决我们面临的许多问题方面非常有潜力，特别是在医疗领域。由于缺乏数据，`ML`\
  \ 受限，我们无法实现其全部潜力。可以通过 `FL` 来解决，它试图解决 `ML` 访问数据的问题。然而，由于隐私考量和协作相关问题，直接访问数据是不可能的。`FL`\
  \ 使用组合技术保护隐私，并允许在参与方的设备上训练模型，并将更新发送到中央服务器，直到训练出全局模型并准备好部署。这同时也伴随着风险和挑战，我们必须考虑并相应地应对这些挑战，以便将其扩展到全球范围内。\n\
  \n尽管研究人员和贡献者在 `FL` 方面取得了所有进展，它仍然面临许多挑战，并且未来需要进一步改进，我们可以将其视为 `FL` 的未来方向。这包括研究更好的隐私保护技术，这些技术不仅擅长保护用户隐私，还要具有高效的性能。在医疗领域，数据获取仍然是一个需要改进的挑战。从大型到小型的组织仍持有大量数据，它们要么是留着不愿贡献，要么没有高效获取数据的方法。\n\
  \n数据获取迫切需要解决方案，特别是在医疗领域，这样任何参与方都不必担心系统架构或 `FL`，只需让他们贡献或通信即可 [3, 7, 19]。除了隐私之外，安全性也带来了风险，因此我们不仅需要保护隐私的系统和框架，还需要安全的往来通信。在所有这些之上，伦理考量又增加了复杂性，我们也需要对此进行调查。建立一个确保信任、公平和问责的治理框架将确保\
  \ `FL` 在医疗领域的全球扩展。\n\n# 参考文献\n\n1. 1. Y. LeCun, Y. Bengio, and G. Hinton, “Deep\
