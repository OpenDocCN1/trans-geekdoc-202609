  md: journals. He has received two best paper awards given by the Malviya National
    Institute of Technology, Jaipur, and by Droncharya College of Engineering, Gurgoan,
    India. He twice received a Hackerank Topper for Python & Advanced CPP held at
    VIT, Chennai, FDP, India. He was also the topper of a java quiz held at FDP, organized
    by VIT, Chennai, India. He has received a Certification of Recognition as a SPOC
    during GUVI's RPA SKILL-A-THON 2020. He has also served as the Indian Institute
    of Remote Sensing (IIRS) Co-ordinator for Department of Electronics and Communication.
    He has received other awards for his work as well. Mr. Singh served as a TPC/PC
    member for several conferences, including ICSC 2019, MRCN 2020, SPTM 2020, and
    ICCCIS 2021. His areas of interest are optical networking and communication, wireless
    communication, IoT machine learning, and image processing. He earned his MTech
    in Digital Electronics & Communication from NMAM Institute of Technology Nitte
    and his BE in Electronics and Communication Engineering at Srinivas School of
    Engineering, Mukka, Mangaluru, India.
