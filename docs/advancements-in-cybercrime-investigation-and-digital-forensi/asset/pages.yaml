    # 10.9 THE CHALLENGES DURING THE INVESTIGATION OF DARK WEB


    Cybercrime investigations are a comparatively recent development. Techniques being
    applied by the investigators are still being an improvement process. Though efforts
    have been made to develop a method on how to perform this new way of investigations,
    the procedure for conducting an investigation is still different from the jurisdiction.
    In reality, cybercrime investigations are still in their teething stages and yet
    to be improved with the passage of time. There are several challenges in the cybercrime
    investigation mechanism. Some of the challenges are due to the inadequacy of law,
    and few are due to the rapid evolution of technologies. Due to rapid technological
    advancement, cybercrime investigators must persistently upgrade their expertise
    and knowledge. The present ways to combat crime often nonfunctional in the online
    world. The development of a holistic manner to address various aspects of cyber-related
    crimes are new challenges for legislators as well as for investigation agencies.'
