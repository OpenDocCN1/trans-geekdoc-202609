- pgno: 5
  md: '# About the Editors


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_5_0.png)


    **A. Harisha**

    *Assistant Professor, Department of Computer Science and Engineering, SCEM, Sahyadri
    College of Engineering and Management, Karnataka, India*


    A. Harisha is an Assistant Professor in the Department of Computer Science and
    Engineering at Sahyadry College of Engineering and Management, Karnataka, India.
    He has published about nine research papers indexed in DBLP, Scopus, and SCI.
    He has presented his research findings at various international conferences and
    is an active member of several professional organizations, such as Indian Society
    for Technical Education (ISTE), Association for Computing Machinery (ACM), and
    Computer Society of India. He is also a web developer and application team member
    for Techno-Medicare. He is a Co-Principal Investigator of Project Digital Forensics
    and Intelligence, funded by the Government of Karnataka, Department of Science
    and Technology, under the Vision Group on Science and Technology (VGST) scheme.
    The Indian patent office has published his patent application on “Enhanced Detection
    of Attacks on Network Based on Pattern Recognition with Decision Stump.” He also
    has two international innovation patents: “Feed Forward Neural Networks Combined
    with Extreme Learning Machine Approach for Large Weather Data” and “An Improved
    Cyber Security System with Digital Watermarking Using Combined Transformation
    Approach.” He has served as a committee member for several international conferences.
    Mr. Harisha completed his master’s degree with specialization in Wireless Communication
    and Computing from the Indian Institute of Information Technology, Allahabad,
    India, and his bachelor’s degree with specialization in Computer Science and Engineering
    from Visvesvarayya Technological University Belagavi, Karnataka, India.'
  merge: -1
  img_proc: true
