  md: '# INVESTIGATION ALGORITHM


    # Recognition


    Recognition is the first step carried out during any type of investigation process.
    It involves the recognition of all potential digital sources which have the capacity
    to store digital information. It could be utilized as a source of evidence. Initially,
    it is compulsory to be aware of the devices which can be beneficial in the investigation
    procedure.


    # Collection


    Digital appliances, which are probable sources of evidence are confiscated and
    appropriately accumulated from the felony scene. Authenticity of evidence is a
    major priority.


    # Volatile Data Collection


    It comprises the compendium of all the implementing records such as time, date,
    and RAM data. For the duration of the examination procedure, the system should
    be powered ON


    # Live System Imaging


    It comprises of the tomography action achieved on data in the course of the investigation.
    For the duration of the examination procedure, the system should be powered ON


    # Forensic Imaging


    Precise photo copy of the initial device is designed to execute alterations. Hashing
    techniques are used to guarantee the confidentiality aspect. For the duration
    of the examination procedure, the system should be powered ON


    # Capture Digital Devices Physically


    When the three stop techniques working, then this method proceeds to the salvage.
    Here, the digital gadgets are confiscated and then all evidences are gathered.
    For the duration of the examination procedure, the system may be powered ON/OFF.


    # Preservation


    Preservation is an essential measure to protect the area where the felony has
    occurred. Besides this, it is crucial to conserve all the ‘Electronically Stored
    Information’ (ESI) which can be acquired from the crime scene.


    # Analysis


    Analysis includes in-depth analysis of all the digital proof. Proper tomography
    is accomplished to guarantee that the original proof do not lose the genuineness.
    The analysis and research of the criminal situation aids the examiner to determine.


    # Reporting


    It is the decisive phase performed during the scrutiny. Reports are means of displaying
    all the details crime linking in a methodical manner. These reports are then displayed
    as the source of proof in the court of law to explain the felony.


    FIGURE 7.3 Schematic of investigation algorithm.'
