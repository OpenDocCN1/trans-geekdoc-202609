    their selfless service in conducting the reviews and providing us with sound advice
    to improve the accepted book chapters. Lastly, we would like to thank our students,
    family and friends, management, principal, research director, and faculty fraternity
    of our respective organizations; Sahyadri College of Engineering & Management,
