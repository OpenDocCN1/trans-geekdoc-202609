    # 7.3.1 DIGITAL FORENSIC TERMINOLOGY DATABASE (DFTD)


    A DFTD or “term-base” is a catalog comprising of model-tailored terminological
    records and associated info in polyglot design (Wright & Budin, 2001). It is a
    potent means of promoting uniformity and reliability in the use of terminology.
    The jargons of the term base may incorporate, among other specifics, the meaning,
    origin, context-of-use, and domain area. The growth and progress of an ontological
    method to solve the connotation of digital forensic lingoes commences with a lexicon
    archive. With the evolution in technological innovations in digital forensics,
    creative, and new terms are regularly proposed into the domain and new connotations
    are assigned to existing terms. Establishment of a lexicon archive will thereby
    ensure uniformity and precision of terminology in a digital forensic analysis
    procedure. An expertly designed lexicon archive will assist detectives to reduce
    costs, save time, maintain consistency and improve quality during examinations.


