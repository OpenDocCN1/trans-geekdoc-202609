- pgno: 357
  md: '# 16.6.3.4 CLIENT PROFILE


    The OAuth 2.0 signifies many necessary client profiles:


    +   1. **Server-Side Web Application:** The web server where an OAuth client application
    is running. A resource owner is able to access the web application, and the application
    utilizes a server-side programming language to make the required API calls. The
    user will not have any access to the OAuth client secret or any authorization
    server’s access tokens.

    +   2. **Web Browsers Running a Client-Side Program/Application:** An OAuth client
    that runs in the user’s web browser and gives the users access to the application
    program and/or API queries. The application might be embedded into a web page
    as JavaScript, as a browser extension, or by using a plug-in technology like Flash.
    Certain API providers will not give client secrets to apps that utilize this profile
    because the OAuth credentials are untrustworthy and must be kept secret from the
    resource owner (Kaur & Aggarwal, 2013).

    +   3. **Native Application:** An OAuth client that is practically identical to
    the client’s program is used since the credentials cannot be trusted to be kept
    secret. Furthermore, the application is readily installed, and it may not have
    access to all of the web browser’s capabilities.


    # 16.6.3.5 CLIENT AUTHENTICATION


    If the client characteristic is exclusive, both the client and the authorization
    server must agree on a client authentication process. The authorization server’s
    security requirements. Any type of client authentication that fulfills the permission
    server’s requirements is acceptable. Security requirements shall be confidential,
    and clients are frequently configured with the client credentials required to
    authenticate with the authorization system server (for example, a password or
    a public/private key pair). A client authentication mechanism may be established
    by the authorization server with the general public. The authorization server,
    on the other hand, must not rely on public client authentication in order to identify
    the client. In each request hence, the client may not employ more than one authentication
    mechanism.'
  merge: -1
  img_proc: true
