  md: 'The storage method of the solid-state hard disk is more similar to the U disk.
    Data storage and reading and writing are performed in the flash memory chip. The
    flash memory itself is an erasable programmable read-only memory (EEPROM), which
    can quickly complete three basic operating modes: read, write, and erase. The
    flash memory in the solid-state drive is divided into blocks, and many pages (Pages)
    are divided into blocks (Hepi & Priyanka, 2021). When reading and writing data,
    the computer converts the binary digital signal into a composite binary digital
    signal (addition of instructions for allocation, verification, stacking, etc.),
    and sends it to the hard disk adapter interface, and then writes it to the flash
    memory page after being distributed by the main control chip to realize data storage.


    # 2. Data Cannot be Recovered Due to Garbage Collection:


    Whether it is a mechanical hard disk or a solid-state hard disk, after receiving
    the OS write data instruction, it will delete the old data and then write the
    new data. When receiving the instruction to delete the data, the hard disk only
    makes a delete able mark at the corresponding position and is deleted when the
    write operation is to be performed. The problem is that the mass plane is the
    smallest unit of data writing and the block is the smallest unit of data deletion
    in solid-state drives. If you want to delete the AI page data in the A block,
    you must first copy all the data in the block except the AI page to another block,
    and then clear the A block. This will cause a significant delay in the write operation
    of the SSD.


    To reduce latency, solid-state hard drive manufacturers have introduced a garbage
    collection mechanism. To put it simply, garbage collection uses the free time
    of the system to scan all valid pages and merge them into a block containing all
    valid pages, and those invalid pages and blocks will be completely cleared, and
    the reclaimed space will be returned. Perform a write operation.


    The impact of garbage collection on forensics is that it automatically performs
    clean-up operations from time to time, resulting in complete data deletion.


    Due to the limited number of reads and writes of the flash memory, the data is
    always stored in a certain block, which will inevitably lead to the early scrapping
    of this block. To ensure the balanced use of blocks and avoid the premature wear
    of some blocks and affect the use of the entire hard disk, the weekly hard disk
    adopts a wear-leveling mechanism. It can evenly distribute'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'files to each block as much as possible to ensure that the number of erasing
    and writing (P/E) times for each flash block is the same and to avoid excessively
    repeating the erase operation of a certain part of the block. Effectively prolong
    the service life of the solid-state drive. The impact of balanced wear on forensics
    is that each block will be used in a balanced manner, which also means balanced
    erasure.


    The OS has also optimized the solid-state drive. The most representative one is
    that the TRIM command enables the OS to notify the solid-state drive which blocks
    are no longer in use so that the solid-state drive can directly perform garbage
    collection. The close cooperation between pressure RIM and garbage collection
    and balanced wear mechanism has indeed greatly improved the performance of solid-state
    drives and effectively extended the service life of solid-state drives. The impact
    of the TRIM instruction on forensics is that it ensures that garbage collection
    is completed quickly, that is to say, if one data is deleted in the OS, the solid-state
    drive will quickly erase all content.


    For electronic data forensics, the consequences of garbage collection, equalization
    of wear and tear, and pressure RIM instructions are disastrous: because of the
    garbage collection mechanism, after the user deletes the data, the solid-state
    drive will empty that block instead of just deleting the index and retaining it.
    Data balanced wear can ensure that garbage collection “equally” erases blocks
    of the hard disk. The TRIM instruction can ensure the efficient execution of garbage
    collection. The final result of the combination of these three is: on solid-state
    hard disks, traditional data recovery cannot be performed, and the feasibility
    of finding evidence file fragments through unallocated clusters is almost non-existent.
    Therefore, for solid-state drives, the focus of forensics should be focused on
    undeleted data.


    # 9.7 CONCLUSION


    Solid-state drive data recovery mainly includes three aspects:


    +   1. **Logical Layer:** Hard disks that belong to the real-time garbage collection
    mechanism can recover a large amount of deleted data without rewriting, but there
    is no way to restore complete data in the case of secondary writing; hard disks
    that belong to the idle garbage collection mechanism, files are the initial recovery
    of the deletion is more likely. After the power-on time is too long, the data
    will be erased slowly and cannot be recovered.'
