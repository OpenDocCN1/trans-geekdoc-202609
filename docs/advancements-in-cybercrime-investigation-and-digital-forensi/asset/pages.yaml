    +   d. Analysis of cybercrime to understand their social, financial, cultural,
    and political dynamics can be very helpful in deterrence and better control cybercrimes.
    But, owing to the fast-changing profile of cybercrimes and their modi operandi,
    building tools, and techniques for cybercrime analysis are very challenging.

    +   e. Security in cyberspace and privacy often have conflicting goals. The human
    race has evolved to share its emotions and activities through socialization in
    the real world or cyberspace. Sharing of a user’s what, when, where, etc., on
    social media has been used by cybercriminals to their benefit. Striking a balance
    between these two very important aspects of the user profile is a very daunting
    and challenging task.


    Having reviewed the cybersecurity-related challenges discussed in various research
    articles and technical reports, a comprehensive discussion on the cybercrime investigation
    challenges in the Indian context follows.


    # 1.4.1 CHALLENGES RELATED TO CYBERCRIME REPORTING


    In a study based on 630 adolescent respondents of Delhi and NCR published on the
    portal ‘Business Insider India’ on March 16, 2020, Prerna Sindwani has reported
    that 9.2% of respondents have been victims of online harassment, but half of them
    have never reported it.


    On August 30, 2019, the Ministry of Home Affairs, GoI, has launched the National
    Cybercrime Reporting Portal (https://cybercrime.gov.in) to report cybercrimes
    incidents online. Law enforcement agencies of the concerned'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'State/UT shall investigate the crimes reported on the portal. The portal allows
    for reporting of cybercrime in two categories, namely, ‘cybercrimes against child/woman,’
    and ‘other cybercrimes.’ Additionally, the crime can be reported anonymously or
    with a “report and track” feature. In the latter category, the reporting individual/entity
    shall have to create an account on the server by sharing certain personal details.


    Further, the portal is bilingual and supports the menus and command buttons in
    English and Hindi. But, in a huge country with about 74% literacy rate, only about
    44% Hindi speaking population, and about 12% population speaking/understanding
    English, the only bilingual portal automatically excludes a majority of victim
    population out to fend on their own.


    In addition, given the social stigma associated with reporting crimes against
    children and women in India, only a very small fraction of cybercrimes is reported.
    In a news report titled “Cybercrime cases in India are under-reported” published
    on June 5, 2021, the Mint has quoted Pavan Duggal, a Supreme Court of India lawyer
    practicing in cyber laws as saying, “the reporting of cybercrimes may be as low
    as mere 1% of actual cases.” In another post-demonetization⁴ news story published
    in Times of India dated January 10, 2021, the newspaper has claimed that 80% of
    cybercrimes are unreported. Loopholes in the Indian cyber laws and long-drawn
    legal battles and social stigma are the ingredients of vastly underreported cybercrimes
    in India.


    # 1.4.2 CHALLENGES RELATED TO FIRST RESPONSE TO CYBERCRIME


    A ‘first responder,’ as the very nomenclature suggests, is an official or a private
    investigator, to whom a reported crime is assigned for investigation. Typical
    jobs that a first responder is entrusted with are identification, gathering, preservation,
    and transportation of electronic evidence. In criminal investigations, the first
    responders have entrusted the job of securing evidence at the crime scene. Cybercrime
    is no exception in regard. Depending on the category of the cybercrime, the evidence
    might include the ‘target’ device(s) [for cyber-dependent crime] or the ICT infrastructure
    [cyber-enabled crime]. Depending on the cybersecurity policy and the victim’s
    profile, the first responder can be a police officer [for a common citizen], a
    digital forensics expert working in the security division of an


    ⁴On November 8, 2016, the currency bills of ₹500 and ₹1000 denomination were withdrawn
    by a Government of India edict.'
