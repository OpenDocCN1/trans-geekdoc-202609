  md: '# 16.4 CONS AND SOLUTION FOR THE EXISTING PROTOCOL


    The OAuth protocol has a number of lies. If a hacker or other unauthorized individual
    obtains this token, he or she may use it for malicious purposes. In the URL parameter
    and attributes field, an intermediary party may access the token, shared secret,
    and other client data. To address this issue, tokens may be signed with digital
    signatures and their duration can be extended. To make token security more secure.
    If we are able to use digital signatures to sign the tokens. The attacker will
    subsequently be unable to access and modify the token.


    When Google first introduced the Google Calendar API, which allowed application
    developers to access and edit the consumer’s Google Calendar, the flaws were mirrored.
    Giving the application his or her account login and password was the only option
    to grant delegate access, and Google’s exclusive ClientLogin protocol would then
    be used by the application, because of these exclusive protocols like Client Login
    and standard protocols like HTTP Basic authentication, both small and large programmers
    have had to ask users for passwords in order to access their data. This wasn’t
    limited to desktop programs; it was happening all over the Web, demanding certain
    certificates. Flickr, a photo-sharing website, was one such application. Flickr,
    an independent firm, was acquired by Yahoo! a few years after Google purchased
    Blogger. The prospect of Yahoo! requesting Google user passwords alarmed both
    companies, prompting the creation of new exclusive protocols to address the issue.


    If an app sought access to user information, these new protocols, such as Google’s
    AuthSub and Yahoo’s BBAuth, would send users to an authorization page on the provider’s
    site. Meanwhile, developers who were integrating numerous API providers had to
    learn and apply a variety of web-based authentication methods in their applications.
    Startups developing new APIs were not comfortable utilizing proprietary authentication
    systems or establishing their own authentication technology, which would have
    introduced many security issues. Rather, these start-ups and big API providers
    agreed that a uniform protocol named OAuth was needed to ensure consistency for
    these web-based authentication operations (Boyd, 2012).


