- pgno: 54
  md: 'Antonio et al. (2014) used supervised ML techniques for multi-class classification
    like decision tree and Bayes classifiers. Depending upon the rules ANN (artificial
    neural network) and nearest neighboring algorithms, the classifiers are evaluated
    based on performances like accuracy and Cohen’s kappa. This experiment is designed
    based on 4-cross validation with 30 repetitions for non-deterministic algorithms.
    In order to get reliable results, the result averaging is performed by 120 runs.
    An analysis is done by comparing each pair of algorithms with the support of t-tests
    using both accuracy and Cohen’s kappa metrices.


    Xiaoyong et al. (2017) used a deep learning method for Denial-of-Service attacks.
    They compared performance with conventional ML. Here ML is another method for
    improving performance for static features. But this algorithm is limited by shallow
    representation models. They proposed deep learning based on a DDoS attack detection
    approach called deep defense. The main aim of using deep learning is to learn
    patterns from sequence of network traffic and trace network attack activities
    by using DNNs. The experiment result gave better performance compared to conventional
    ML models. They also reduced the error rate from 7.517% to 2.103% compared with
    conventional ML methods in larger datasets.


    Sumaiya et al. (2013) used to evaluate different tree-based classification algorithms
    that are used to classify network events for the IDS. They used NSL-KDD 99 datasets
    for their experiment. The dataset dimensionality is reduced. The result shows
    that Random Tree models more accuracy and also reduced the false rate of alarm.
    To compare a better predictive accuracy the Random Tree model is evaluated by
    making a comparison with other intrusion detection models.


    Meng Jianliang et al. (2009) used K-means algorithm for detecting intrusion. They
    used KDD-99 as a dataset. The main reason to use this dataset is it will give
    a stable accuracy and efficiency for the algorithms. By different setting rate,
    the detection rate gave more than 96% and false rate of alarm gave less than 4%.
    The time complexity is very less. By comparing with other algorithms, K-means
    methods are more effective algorithm for partitioning a huge set of data. For
    the intrusion detection K-means algorithms are most widely used compared to other
    algorithms.


