  md: '# 17.3.4 SEX TRAFFICKING


    The method of stealing someone’s freedom to acquire profits is called trafficking,
    and when humans of all ages, nationalities, and gender are trafficked all over
    the world to gain profits in exchange for labor and sex is called human trafficking
    or sex trafficking. These types of criminal act not only harm human, social, physical,
    and psychological but also erodes the social, economic, and political facet of
    a nation where these types of crime occur.


    According to the International Organization of Migration Data, crime rates are
    four to five times higher in destination countries like the Czech Republic, the
    UAE, Yugoslavia, the Netherlands, Greece, Germany, and Hungary. Such types of
    destination countries generate sex and labor demands of women and minors, which
    are accomplished by traffickers who trade victims by using uneven means. Approximately
    20% of women are recruited through fake advertisements of foreign jobs and others
    through marriage agencies which help pimps to reach those women who want to travel
    and emigrate (Aronowitz & Research, 2001). When traffickers acquire control over
    victims by any kind of means, either by threatening or blackmailing them, then
    they exploit them to gain huge profits. Control over victims is easily possible
    as exploits face language barriers, limited knowledge, fear, and lack of money
    that prevent them from breaking out of the jail of sex trafficking.


    Traffickers exploit victims both physically and emotionally to retain trafficking
    profitable as it is the third-largest income generated in organized crime after
    narcotics and arms sales. The global sex trade is the fastest increasing form
    of business, which costs worth $32 billion annually. In an estimation, 1 million
    people are trafficked across international borders annually, out of which 70%
    are women and the remaining 30% are minors and others. Only want to break out
    from sex traffic rings is a Police raid which, results in expulsion. The legalization
    of prostitution makes it difficult to prove pimps guilty are accountable for their
    crimes. Traffickers elude prosecution by speaking that woman had their own choices,
    they know what they are getting into, and prosecutors face difficulty in proving
    the difference between optional and forced prostitution.


    Victims face moderate to severe physical, psychological, social, mental, and emotional
    abuses/tortures. In most cases rescued victims suffer from sexually transmitted
    infectious diseases like gonorrhea, syphilis, urinary tract infections, and AIDS,
    victims feel pelvic pain, vaginal/anal tearing, rectal trauma, and/or urinary
    difficulties (Deshpande, Nour, & Gynecology, 2013).'
