    # 4.1 INTRODUCTION


    The adoption of wearable devices is increasing widely, and it is undoubtedly becoming
    an integral part of our lives. Wearable devices are revolutionizing the way we
    track our daily life activities. Such type of technology is very advantageous
    for busy professionals to stay informed with notifications while on the go, fitness
    enthusiasts track their workouts, and even the elderly and infirm by alerting
    emergency personnel if the device senses an unpleasant medical event. However,
    in order for these gadgets to function properly, they must collect information
    about the wearer, such as their location, biometric data, social media, calendar,
    and other information.


    The geographical information, user’s physical and health statistics, different
    activity logs (e.g., sleeping, walking, calories burnt, etc.), and other sensitive
    information such as account details of social media communication and notifications
    of instant messaging applications, media files, etc., that are collected by these
    devices can play a huge role in forensic investigations (Kasukurtu & Patil, 2019).
    The devices are worn as accessories, embedded in clothing, and might even be implanted
    in human bodies and are a new emerging class of technology. These devices incorporate
    sensors, operating systems (OS), communications interfaces and numerous software
    applications that provide rich features like human-biometric monitoring, location
    tracking, video recording, navigation, calling, messaging, secretarial tasks,
    cardless payments and music streaming, among others. Such devices need to be connected
    to either a Wi-Fi or a cellular data network so that the recorded information
    can be synchronized with the cloud. The types of sensitive user information that
    may possibly be extracted from wearable devices are expected to play an important
    role in the future of digital forensics. The users have a close connection to
    the wearable devices which is continuously keeping track of what the user is doing,
    with large amounts of personally identifiable data being stored to a device to
    which it is relayed after being generated.


    # 4.1.1 WEARABLE DEVICE TECHNOLOGY


    Wearable device technology is a class of electronic device, which is used to track,
    analyze, and transmit personal data. These devices are physically'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'carried as accessories, fixed somewhere in the body wear, implanted in the
    users’ body or sometimes may even be tattooed on the skin in order. Such smart
    technology can track heart rates, sleep patterns, calls, e-mails, messages, etc.
    Some of the most commonly used wearable devices are– Apple Watches, Fitbit, Samsung
    Galaxy Watch, Garmin Activity Tracker, Huawei Watch, etc. (Hayes, 2020).


    These wearable devices usually rely on a short-range wireless technology such
    as Bluetooth, Wi-Fi or a login account to pair with a companion device. During
    setup, a wearable device is registered with the manufacturer and may be linked
    to a cloud server account, which is used to back up the user’s configuration,
    on board sensor data and logged activities. A smartphone application may also
    be used to manipulate the local configuration settings of the wearable device,
    update its firmware, load additional features, synchronize data with the cloud
    and visualize the collected data.


    There is a wide range of wearable devices. However, the devices characteristically
    have similar engineering design constraints due to their small form factors. Without
    the assistance of paired devices, they may be unable to operate for long hours,
    store large quantities of data or provide rich applications and features. To mitigate
    these downsides, manufacturers design wearables with custom chips that consume
    low amounts of energy, and their sensors and applications are usually put in a
    standby mode when they are not needed. Storage capacity limitations are usually
    resolved by compressing and offloading data to cloud servers or paired smartphones.
    Strong transport protocols are engaged to increase the synchronization speed of
    the data. Some wearable devices even slot in cellular chipsets for increased mobility
    and performance (Loomis, 2019).


    Smart glasses, fitness trackers and smartwatches collect large amounts of user
    data and store the data across the wearable devices, companion smartphones and
    cloud storage. Since these devices collect data continuously, they contain considerable
    amounts of digital evidence that are valuable in forensic investigations. A wearable
    OS is designed to work seamlessly across various wearable devices. It varies based
    on the type of wearable device and its specifications. These wearable devices
    are typically operated using two predominant operational methods. Some wearable
    devices operate unaided in an autonomous mode, whereas the others typically require
    internet-connected smartphones.


    For instance, most smartwatches have built-in features that allow them to connect
    to the user’s smartphone to create a web interface. In such cases, the wearable
    OS acts similar to a mobile OS. This OS is designed to enable the'
