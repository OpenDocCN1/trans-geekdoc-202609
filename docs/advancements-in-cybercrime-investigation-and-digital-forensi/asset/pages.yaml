    # 2.1.1 REGRESSION IN DIGITAL FORENSICS


    Some of the value depends on the values of independent features with the help
    of existing data based on the past events. And this knowledge helps to handle
    new events. In digital forensics, fraud detection can be solved by using this
    method. Once the model is learnt based on the previous transaction database, by
    observing the features of current transactions the fraud transactions are identified.
    The AI ML provides support vector machine (SVM), linear regression, polynomial
    regression, decision tree and other regression methods for the analysis of regression.


    # 2.1.2 CLASSIFICATION


    Classification is done based on supervised machine learning (ML) techniques. In
    digital forensics the spam detection is done by using AI ML algorithms. In order
    to categorize whether the given mail is spam or not the AI and ML algorithms plays
    the main role. Some of the algorithms are used for the classification like logistic
    regression, K-nearest neighbor (K-NN), and SVM.'
