    The Standing Committee on Information and Technology of Indian Parliament’s lower
    house (Lok Sabha), in its ‘52nd Report on Cybercrime, Cyber Security and Right
    to Privacy’ has noted that in India, multiple agencies are working towards securing
    its cyberspace. The report has recommended to minimize responsibility overlays
    between such agencies and adopting a public-private partnership mechanism for
    realizing a secure cyber ecosystem in India.


    # 1.4.4 CHALLENGES RELATED TO TECHNICAL SKILLS


    Since both the target and the means of the cybercrime involve technology and the
    criminals involved in the high impact cybercrimes are invariably cyber geeks,
    investigating officials, public prosecutors, judicial officers dealing with cybercrimes
    must possess specialized knowledge, skills, and abilities (KSA), beyond those
    required to deal with traditional offline crimes. Characteristics of cybercrime
    that warrant KSA are discussed in subsections.


    # 1.4.4.1 ANONYMITY


    The Internet offers very strong anonymizing services to internet users free of
    cost. And user anonymity presents a big obstacle in the investigation'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'of cybercrimes. Anonymity empowers individuals to communicate and prowl on
    the Internet without revealing their identity to others. Proxy server connects
    a client machine to a server. An anonymous proxy server is one such user anonymizing
    technology that hides users’ identity tokens by masking their IP addresses and
    substituting them with a different set of IP addresses (Maras, 2016).


    The likes of TOR, I2P, and Freenet are also used by cybercriminals to conceal
    their internet identities by hiding the IP address of the sender. In TOR network,
    the machine at any level is in the possession of the IP address of the next-level
    recipient machine only and at no level the recipient machine knows the address
    of the sender machine, thereby making it impossible to trace back the communication
    (Maras, 2016).


    # 1.4.4.2 ATTRIBUTION


    Another impediment faced during cybercrime investigations is attribution, i.e.,
    mapping a cybercrime to who and/or what is responsible for it. This process involves
    mapping the cybercrime to a user, a device, an organization, a state, or any other
    entity in cyberspace. Attribution can become a herculean task owing to rampant
    use of anonymity services and botnets and zombie machines–machines that are highjacked
    and used to commit cybercrimes, unbeknownst to the owner of the machine (Lin,
    2016).


    # 1.4.4.3 TRACEBACK


    It is the process of tracing cyber activities back to their source after the occurrence,
    reporting, and detection of a cybercrime. Internet log files help to reveal important
    information (including IP addresses of the devices used) about the modus operandi
    of the cybercrime. But traceback may be quite time-consuming and depends on the
    KSA attributes of both–the perpetrators and the investigators. Having known the
    IP address of the device used in cybercrime, the relevant Regional Internet Registry
    (RIR)⁵ can be requested to identify the internet service provider (ISP) associated
    with the IP address under question. Backed by proper legal documents, the cybercrime


    ⁵Regional Internet Registries (RIR) are mechanisms for registration of IP addresses
    in their respective regions. The world has been divided into five regions for
    this purpose, namely: (i) Africa; (ii) Asia Pacific; (iii) America; (iv) Latin
    American; and Caribbean; and (v) Europe.'
