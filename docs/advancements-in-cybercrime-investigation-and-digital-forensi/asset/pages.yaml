  md: '# 3.1 PREAMBLE


    Internet usage has increased the multimedia exchange many folds, which makes it
    necessary to safeguard the confidentiality of the details being shared, from any
    forbidden access. Security contravention have invaded the solitude and reputation
    of user. Often the data being exchanged are textual details, image, audio and
    video information. Different category of multimedia statistics has different characteristics,
    and different methods are adopted to maintain confidentiality and avoid unauthorized
    access. Hence means of hiding information are essential for securing it when transmitting
    over open networks like the web, wherein the applications of multimedia are rapidly
    increasing. Cryptography comprises studying techniques related to encryption,
    authentication, and key distribution algorithms provides secured communication
    even in the presence of an adversary. Image encryption algorithms provides security
    by transforming the images into an image of unreadable form. Applications of image
    encryption vary from multimedia entertainment, military communication, internet
    communication, telemedicine to life and health sciences.


    # 3.2 IMAGE ENCRYPTION


    The raw method of encrypting images involves transforming an image of two dimension
    into a one-dimensional data stream and this stream was used to encrypt any text-based
    information (Ali, Zulkarnain, & Jan, 2012). This method of image encryption is
    applicable for texts, audio with smaller bit rates, images, and videos that may
    be transmitted over dedicated channels. Such algorithms are not suitable for various
    image data formats like BMP, GIF, JPEG, PNG, TIFF, etc. Use of basic cryptographic
    techniques for image encryption may not be suitable as image are more voluminous
    in contrast to textual data. Also, when the textual data is decrypted, complete
    recovery is mandatory, but for image data, this is not critical as the decrypted
    image contains a small amount of perturbations which is typically acceptable due
    to the persistence of vision.


    Generally, encryption techniques for images may be categorized on the methods
    adopted to set up encryption scheme as: Chaotic maps oriented and Non-chaotic
    maps. Alternatively, there are also grouped as partial and full encryption, in
    consistent with the share of the information being encrypted. Literature survey
    provides many selective methods for image and video'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'encryption, which describe the techniques that have been developed so far (Sankpal
    & Vijaya, 2014).


    # 3.2.1 CHAOS THEORY FOR CRYPTOGRAPHY


    A chaotic dynamic system is deterministic in nature which possess random behavior.
    Their sensitive dependence on initial conditions makes them random in nature.
    The changes created in output for small changes in input cannot be predicted with
    finite precision. This makes the behavior of chaotic systems completely unpredictable
    that mimics noise and is a desirable feature for cryptography. This striking relationship
    between chaotic systems and cryptography makes chaos-based cryptographic algorithms
    as preferred choice for secured communication over open networks. Chaotic system
    and cryptographic algorithms have identical properties of long periods of periodic
    orbits that are unstable, behavior that is pseudo-random and sensitive dependence
    on initial and control parameters. Chaos-based image encryption involves the basic
    principle of generating random sequence numbers that are used for encrypting the
    messages (Alireza & Abdolrasoul, n.d.). This makes the system output to be pseudo-random
    in nature, thereby making the system output to appear as random in the opponent’s
    eye, though it is revealed as well-defined to the recipient and correct decryption
    is achieved (Somaya, Afnan, & Turki, n.d.). Traditional encryption transformations
    deal with finite sets, whereas chaotic systems deal with real numbers (Alireza
    & Abdolrasoul, n.d.). Chaotic systems have parameters that resemble the secret/
    encryption key used in cryptography. Comparison between cryptographic algorithms
    and chaotic systems with various parameters as indicated in Figure 3.1.


    There are two ways, a chaotic system may be used for implementing a cryptosystem
    system:


    +   - Pseudo random key generation using random sequences of chaotic maps; and

    +   - Control parameters and initial conditions are replaced as secret keys.


    # 3.2.2 ARCHITECTURE FOR IMAGE ENCRYPTION


    The architecture of image encryption gleaned from chaotic system mainly comprises
    of two levels: the Confusion and the Diffusion levels. The graphical'
  merge: -1
  img_proc: true
