    # 4.1.2 DESIGN PRINCIPLE OF WEARABLE DEVICES


    The design of wearable devices is a complicated task. It is because of the various
    types of sensors working within an essentially interconnected system. Adebayo
    (2020) classified the sensors into three categories:


    +   1. **Biosensors:** These comprise glucose, blood pressure, ECG, EMG, temperature,
    and brain wave sensors.

    +   2. **Motion Sensors:** Examples include acceleration, gyroscope, geomagnetic,
    and atmospheric pressure sensors.

    +   3. **Environmental Sensors:** For example, temperature and humidity, gas,
    PH, ultraviolet, ambient light, dust particles, and pressure sensors, as well
    as microphones (Adebayo, 2020).


    The data to the CPU or display processor is sent by sensor. These sensors are
    coupled with a microcontroller, which is the most important component that facilitates
    the operation of the wearable technology. Microcontroller is'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'a common component in small computers that enables the integration of the internet
    of things (IoT) with desired devices and applications. Most importantly, they
    help in performing different functions on a single component. Due to the ease
    in programming, low cost, small size, great connectivity with other sensors and
    the competency to handle complex functions, including graphic displays, microcontrollers
    are almost a must-use in wearable technology. A typical architecture of a device
    includes hardware to hold all the components, an allied applications running in
    the users’ phone and a cloud server, apart from the wearable device itself (Aroganam,
    Manivannan, & Harrison, 2019).


    Figure 4.2 depicts how fitness wearable technology could be used to track various
    lifestyle activities such as weight, calories burned, heart rate, GPS location,
    and so on (Chan et al., 2012). Sensors monitor the lifestyle activities of the
    users. The users input some of the data themselves, such as their food intake.
    These datasets are then conveyed to a smart phone and the cloud service. The data
    is then processed, making it suitable so that the user can understand it. Depending
    on the type of display, this processed data is then sent back to the paired smart
    mobile device or the wearable itself (Aroganam, Manivannan, & Harrison, 2019).
    Apart from the architectural design, the other design challenges that are important
    in the context of a wearable device are:


    +   1. **Network Connectivity:** The architectural design of systems described
    above clearly shows that connectivity is the dominant feature in terms of connection
    of system elements with each other via different networks (Ngu et al., 2008; Stelvaga
    & Fortin, 2017).

    +   2. **Limited Resources:** To make the device compact and to be carried it
    comfortably, several restrictions are obligatory such as, and a wearable device
    is created lightweight so as the user can easily use it. Secondly, the overall
    size is relatively small. The functions including computing capability, powering
    sensors and network connectivity suffer from the lack of energy resources and
    the design is highly constrained by this requirement (Nirjon, Gummeson, Gelb,
    & Kyu-Han, 2015; Stelvaga & Fortin, 2017).

    +   3. **Asynchrony:** As stated by Rowland, for smartphones and desktops, it
    is attainable to handle network outages gracefully and assume that the flow of
    interactions will be moderately smooth. However, with wearables, the entire system
    becomes primarily asynchronous. A wearable device cannot maintain continuous connectivity
