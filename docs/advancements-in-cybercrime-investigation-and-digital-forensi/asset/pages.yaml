  md: '# 6.4 DATA MINING (DM) TECHNIQUES FOR DIGITAL FORENSIC


    Data mining (DM) is the technique of obtaining information from vast amounts of
    data in the database in order to identify significant data, trends, and patterns
    that will aid the investigator in making a data-driven decision. The goal of DM
    is to make data-driven judgments based on massive data sets. DM is associated
    with Data Science, which is performed by a person in a specific situation, on
    a specific data set, and with a specific goal in mind. DM technique comprises
    video and audio mining, social media mining, graphical DM, text, and web mining,
    among other services. It’s done with either simple or extremely specific software
    (Quick et al., 2014). Although there is a huge amount of information available
    on multiple platforms, there is a scarcity of expertise. Therefore, the most difficult
    task in digital forensics is to evaluate data in order to extract essential information
    that may be used to solve cases.


    DM can also be defined as a tool for examining data patterns that pertain to specific
    perspectives. It aids us in classifying the data and turning it into meaningful
    knowledge and information. This vital information is then captured, either for
    storage in database systems or for DM and to assist in making a decision. There
    are various procedures involved in DM implementation in digital forensics. The
    various DM procedures involved in Digital forensic is depicted in Figure 6.2.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_145_0.png)


    FIGURE 6.2 Data mining procedures involved in digital forensic.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Before we start, we must have in-depth knowledge about the current scenarios,
    objectives, and resources available that meet the criteria of forensics. Then,
    it would help you develop a precise data extraction plan to meet the digital forensic
    goals efficiently. In order to ensure that no data integration bottleneck exists,
    data must be revised and compared as it is acquired from numerous sources. Before
    mining, quality assurance examines any underlying data anomalies, such as misplaced
    data interpolation, to ensure the data is in good shape. Prior to mining, the
    selection, cleaning, structuring, and encryption of data are estimated at 80%
    of the effort. The steps involved in data transformation, which consists of six
    sub-stages, prepare data for final data sets (Suaib et al., 2020): (a) smoothing;
    (b) retrieving; (c) summary; (d) generalization; (e) normalization; and (f) data
    attribute construction is all part of it. Various mathematical models are used
    in the data set to help find data patterns based on a range of conditions.


    # 6.4.1 TYPES OF DATA


    DM can be applied to the following types of data (Ch et al., 2021). They are:


    +   1. **Transactional Database:** It is a database that stores record that has
    been captured as transactions. Flight bookings, consumer purchases, website clicks,
    and other transactions are examples of these types of transactions. A unique ID
    is assigned to each transaction record. It also includes a list of all the elements
    that made the transaction possible.

    +   2. **Data Warehouse:** It is a single data storage site that gathers data
    from various sources and organizes it into a coherent strategy. Data is cleaned,
    integrated, loaded, and refreshed before being stored in a data warehouse. A data
    warehouse’s data is divided into numerous sections. We can obtain the summary
    of the information stored in the data warehouse even after a very long time.

    +   3. **Data Stored in the Database:** Every database management system (DBMS)
    holds data connected in some way. It also features a suite of software packages
    for managing data and facilitating access to it. These programs are used for various
    tasks, including designing database structure, ensuring that stored data is consistent
    and secure, and managing various types of data access, such as concurrent, distributed,
    and shared. A relational database contains tables with names and properties that
    hold rows or records from massive data collections. A unique key is assigned to
    each record in a table.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '4. **Additional Data Types:** Other kinds of data are known for their adaptability,
    semantical significance, and structure. They’re employed in a variety of situations.
    Spatial data, multimedia data, graph data, sequence data, data streams, engineering
    design data, and more are just a few of the data types available.


    # 6.4.2 VARIOUS DATA MINING (DM) TECHNIQUES


    DM is the process of using advanced data analysis technologies to find previously
    unknown, valid patterns and linkages in big data sets. This technology can make
    use of mathematical methods like neural networks, statistical models, and ML approaches
    like decision trees altogether. As a result, DM is used to make predictions as
    well as data analysis. Different fundamental DM techniques have been created and
    used for contemporary DM applications, including association, sequential patterns,
    clustering, prediction, classification, and regression (Han et al., 2011). Figure
    6.3 represents the major DM techniques.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_147_0.png)


    FIGURE 6.3 Major data mining techniques.'
