    # 12.5 CONCLUSION


    The implementation and testing of three decision tree-based algorithms are presented
    in this chapter. The motive was to get higher accuracy as possible on this dataset
    and comparison of their results. Although these three algorithms follow ensemble
    learning, we have again ensembled these three models to get a better result. The
    MCC metric is used for the final prediction measure. The best score of 0.99 is
    achieved using Random Forest, XGBoost, and Ensemble. The accuracy of the Ensembled
    model was 99% similar to Random Forest and XGBoost. We found that if you spent
    more time on feature engineering rather than on model training results could be
    better, which we have done. We have successfully learned and implemented these
    four different models and got an accuracy of 99%. This chapter can give you a
    brief introduction to credit card frauds and different ML algorithms. It also
    tells you about different aspects of ML like feature engineering, evaluation metrics,
    etc. Credit card fraud is a topic of concern for everybody, and continuous progress
    has been made in detecting frauds through ML.'
