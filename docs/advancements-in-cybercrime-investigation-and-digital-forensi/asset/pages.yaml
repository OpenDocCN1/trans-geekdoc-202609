    # ABSTRACT


    Healthcare essential’s delivery has changed drastically with the use of information
    technology. The adoption of digital health information is transforming healthcare
    from a paper-pushed device to a new era where fitness records are instantly transmitted
    and shared. The overall requirements for healthcare delivery are that it must
    be kept personal, possess integrity, critically accurate, accessible round the
    clock and in every location it’s needed.


    The digital fitness document system contains huge quantities of facts. These sensitive
    records must tour to the multiple sites of care through laptops, mobile phones
    and tablets which are largely used by healthcare experts/assistants. This raises
    substantial protection issues due to the human intervention and data risks over
    the mobile devices. This makes information security vital on mobile and storage
    devices.


    Information security intends to provide protection to the information in terms
    of “confidentiality, integrity, and availability” (CIA triad). In case of a security
    breach, it is certain that the confidentiality, integrity, and availability of
    information needs to be protected via information security mechanism tools.'
  merge: -1
