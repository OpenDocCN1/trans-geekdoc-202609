  md: 'competitiveness, consumer demand, and data availability. It is mostly used
    to determine the exact link between two or more variables in a data set.


    4. Outer Detection: This DM technique is concerned with identifying data elements
    within a data set that do not conform to expected behavior or pattern. This technique
    applies to various fields, including fraud detection, intrusion detection, and
    surveillance. Furthermore, it is referred to as Outlier mining or Outlier Analysis.
    Outliers are data points that deviate significantly from the remainder of the
    data set. An outlier exists in the vast majority of real-world data sets. Thus,
    in the realm of DM, outlier detection is crucial. Outlier detection is useful
    in various sectors, including recognizing outliers in wireless sensor network
    data, detecting credit or debit card fraud, detecting network interruptions, and
    so on.


    5. Prediction: This persuasion DM technique, as the name implies, assists investigators
    in matching patterns based on current and past data records in order to forecast
    future studies. In addition, this approach predicts the relationship between dependent
    and independent variables. Prediction, in general, involves a combination of various
    DM techniques, including classification, trends, clustering, trends, and so on.
    While some solutions rely on ML and AI, others can be completed using simple algorithms.
    To forecast a future event, it examines prior events or instances in the correct
    order.


    6. Sequential Patterns: It is a technique that examines the database to find sequential
    patterns. This method encompasses discovering unique subsequences inside a set
    of sequences. The value of a sequence is quantified using various characteristics
    such as length, occurrence frequency, time, etc. In other words, this technique
    aids in the discovery or recognition of similar patterns in historical transaction
    data.


    7. Association: Out of most of the techniques in DM, it is one of the most frequently
    employed. The relationship and transaction between its elements are employed to
    find a pattern in this technique. That’s why it is often referred to as a relationship
    technique. It also aids in the discovery of a connection between two or more items.
    In the data set, it uncovers a hidden pattern. Association rules are if-then statements
    that help to indicate the likelihood of data item interconnections in large data
    sets across different databases. It is a widely used technique to enhance sales
    correlations in data or medical data sets, and it serves a multitude of purposes.'
