  md: '# 12.3.2 ALGORITHMS


    # 12.3.2.1 RANDOM FOREST


    Random Forest algorithm is used ensemble learning that trains several decision
    trees in parallel; this process is known as bagging. It divides the training dataset
    into n samples and uses these samples to train n different decision trees (Lin,
    2017). This division of dataset into samples is known as Bootstrapping. In simple
    words, it trains multiple decision trees in parallel on different subsets of the
    dataset. Finally, it aggregates the decisions of individual trees using the ensemble
    technique of max voting. The final prediction is an output of voting from these
    decision trees. This algorithm is really good for structured data.


    # 12.3.2.2 AdaBOOST


    AdaBoost is also a type of ensemble modeling in which multiple lower accuracy
    classifiers are combined to gain higher accuracy classifier. Steps of Ada-Boost
    are, firstly it selects a training dataset randomly and then trains a model on
    this random dataset then predictions are made through this model (Cao Ying, 2019)
    and errors are calculated between actual and predicted values then it assigns
    weights to observations predicted wrong and the models whose overall accuracy
    is high and then the process is repeated, for final prediction max-voting is used
    among all the classifiers you have made.


    # 12.3.2.3 XGBoost


    XGBoost is one of the most frequently used ML algorithms in competitions in Kaggle
    for structured or tabular data. It is also an Ensemble learning algorithm that
    uses boosting techniques. It is made of gradient-boosted decision trees, which
    have high speed and performance. It uses an approach where new models are created
    which can predict the errors of the previous model and then combine them to make
    final predictions (Mitchell, 2017). Other boosting algorithms increase weights
    of weak classifiers, but in gradient boosted algorithms they try to optimize the
    loss function. It uses the gradient descent algorithm to reduce the loss while
    adding new models. Its'
  merge: -1
  img_proc: true
