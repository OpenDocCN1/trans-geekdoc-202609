  md: '# 9.1 INTRODUCTION


    # 9.1.1 COMPOSITION STRUCTURE OF SSD


    The solid-state drive is mainly composed of the main control chip, flash memory
    particles, a cache chip, and a SATA interface chip (Chang, 2007). Solid state
    disk (SSD) is a large-capacity memory that uses solid-state semiconductor chips
    as storage media. According to the semiconductor chip used, it can be divided
    into flash memory (NAND flash) and volatile storage (DRAM)-based solid-state drives
    (Hepi & Priyanka, 2021). The latter requires an independent power supply and can
    only be used in very special equipment. It is beyond the scope of this chapter
    (Figure 9.1).


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_210_0.png)


    FIGURE 9.1 Solid state drive.


    # 9.1.1.1 MAIN CONTROL CHIP


    The main control chip is the core device of the entire solid-state hard drive.
    Its role is to accept instructions from the system and rationally allocate the
    data load on each flash memory chip; the other is to undertake the entire data
    transfer, connecting the flash memory chip and the external SATA interface (Micron
    Technology (2008). The main control chip is connected to the flash'
  merge: -1
  img_proc: true
