  md: 'intermittent connectivity. For example, the wearable device can be linked to
    a phone using a low-power protocol, such as Bluetooth low energy (Rowland, Goodman,
    Charlier, Light, & Lui, 2015; Stelvaga & Fortin, 2017).


    4. **Sustainability:** According to Lee et al., the conception of wearable device
    is that an individual ought to carry it for extended periods of time. The device
    should even be resistant to the jolting, possible physical damage, and environmental
    changes. These factors, for example, have a significant impact on sensor readings,
    as do factors such as humidity, which can result in an increased skin conductivity
