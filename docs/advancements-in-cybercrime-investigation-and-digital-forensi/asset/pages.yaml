    # 10.1 INTRODUCTION


    > "One of the main cyber-risks is to think they don’t exist. The other is to try
    to treat all potential risks."

    > —Stephane Nappo


    As a result of the tremendous growth in criminal behavior performed via the internet,
    the scenery of law enforcement has transformed. While huge technological improvements
    may lead one to consider that track cyber criminals on the internet is a different
    possibility. But at the same time, the truth is that cybercrime is prospering
    on the internet in new ways (Gehl, 2018). This is due to criminals using new technology
    to preserve secrecy on the Internet and allowing them to easily escape from the
    law enforcement.


    # 10.2 MEANING OF DARK WEB


    For a variety of technical reasons, the phrase “Deep Web” signifies as a form
    of Internet content that is not indexed through any search engines. The Dark Web
    is a section of the Deep Web which can be deliberately secreted and is hard to
    find by using any web browser (Gehl, 2018). For content uncovered on the black
    web, the Tor network is a relatively well-known source. Tor with other related
    networks allows users to pass through the Web in complete secrecy by way of encryption
    and transmit them through various networks known as onion routers. Some people,
    on the other hand, use the dark web’s online anonymity to engage in illegal activities
    like drug trafficking, identity theft, unlawful financial transactions, and so
    on (Eddison, 2018). Because the Dark Web is different from the visible Web, it
    is crucial to develop methods to efficiently monitor it. Limited monitoring can
    be accomplished now using the mapping of the unknown services, customer data monitor,
    social site monitor, hidden service monitor, and semantic analysis. The Dark Web
    is the type of the World Wide Web which is hosted on dark nets. These are networks
    that need a special software to configurations, or authorization to access. Private
    computer networks can correspond and transact business secretly on the dark web.'
