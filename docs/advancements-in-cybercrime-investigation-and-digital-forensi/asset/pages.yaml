    Type of retrieved data differs depending on the investigation, for example, e-mail,
    chat logs, images, contact numbers, confidential information, order history, financial
    information, our identity cards and marksheets in Digi lockers and much more.


    The data can be recovered and reproduced from different things associated with
    the devices and also from different types of software and memory (Spector, 1989).


