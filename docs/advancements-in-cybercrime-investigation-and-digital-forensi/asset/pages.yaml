  md: 'Idle garbage collection is to perform garbage collection operations when the
    solid-state drive is idle. The advantage of this is that it will not occupy additional
    master control resources and can keep the solid-state drive as high as possible;
    the disadvantage is that it will increase additional writes. Into zoom. Generally
    speaking, if new data is being stored or deleted, this mechanism will work automatically.
    The WD SSD of 120 GB SSD tested above belongs to real-time garbage collection.
    Therefore, during the test, it was found that the GC trigger was when data was
    written.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_222_0.png)


    # FIGURE 9.6 Free space location.


    Passive garbage collection is doing garbage collection while users are also performing
    data input/output actions. This mechanism is also called “real-time garbage collection.”
    Since this mechanism occupies a large number of master control resources, it will
    have a certain impact on the “response time” when there is a data request.


    After the solid-state disk is full, delete it all permanently (Shift + delete),
    and you will find that the file has been marked by the TRIM command. After writing
    512 MB of data, it was found that four original files were processed by GC, that
    is, the data was erased by the SSD master after writing. Explain that when the
    hard disk is full when the deleted part of the data is written again, the computer
    will GC process the data larger than the written part, and then take out a part
    to store the written data, and the rest as free memory; if the hard disk If it
    is not full, the written part will be stored in the original free memory, and
    then the deleted part will be GC processed (Cha et al., 2015).'
