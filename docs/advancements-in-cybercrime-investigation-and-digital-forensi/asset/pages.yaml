- pgno: 25
  md: '# CHAPTER 1


    # Challenges to Cybercrime Reporting,

    Investigation, and Adjudication in India


    VIKRAM SINGH,¹ VARUN MALIK,² and RUCHI MITTAL²


    ¹Department of Computer Science and Engineering,

    Chaudhary Devi Lal University, Sirsa, Haryana, India


    ²Chitkara University Institute of Engineering and Technology,

    Chitkara University, Punjab, India


    # ABSTRACT


    The Internet infrastructure is not ‘secure by design.’ And in recent times, fueled
    by cheap internet data and affordable smart mobile devices, digital technologies
    have been adopted at an exponential rate. Given the above facts, lately, the world
    has seen an unprecedented rise in cybercrime cases. And, owing to the novelty
    of tools, means, targets, and modi operandi of cybercrime, an altogether new approach
    to investigation and prosecution is required on this front. A radically different
    approach is required to discover (and preserve) evidence from the crime scene,
    analysis of evidence, and mapping them to judicial procedure. Cybercrime investigators,
    prosecutors, and adjudicators face a multitude of challenges in performing their
    respective duties and deliverance of justice in cybercriminal cases. In this background,
    the present chapter discusses the challenges of different types as faced at different
    levels of administration and governance of cyberspace.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.1 INTRODUCTION


    With each passing day, the world is hooking itself more and more on the Internet.
    Today, entities in large numbers–be they individuals, or institutions, or transnational
    corporates, or governments, or NGOs, or even the crime cartels–depend on computer
    networks for their daily chores. This makes them vulnerable to criminal attacks–popularly
    called cybercrime or cyberattack–which are perpetrated using network infrastructure.
    A cyber geek sitting in the safety of his home in a far-off place can cripple,
    paralyze or even destroy the infrastructure being controlled by computer networks.
    As much as that, the inimical use of this potential technology has added a new
    (fifth) dimension of warfare, namely, cyber warfare; the other four dimensions
    of warfare being land, sea, air, and space.


    A globally accepted definition of cybercrime is elusive; it has changed with time;
    and means differently in different domains. This definitional and taxonomical
    heterogeneity arises from the viewpoint-heterogeneity of understanding a cybercrime.
    Four different and popular viewpoints identified by Wall (2007) are: (i) the technical
    discourse–where experts work to understand the dynamics of cybercrimes to find
    solutions to precarious situations in the cyberspace; (ii) the academic discussion–where
    the cybercrime phenomenon is studied through research techniques of different
    disciplines like computer science, sociology, and economics; (iii) the legislative
    perspective–where legal framework defining the boundaries for legit conduct in
    the cyberspace is discussed; and (iv) the common man’s perspective–where the common
    man’s understanding of cybercrime is pondered upon.


    The terms ‘computer crime,’ ‘ICT crime,’ and ‘cybercrime’ convey a similar meaning
    in that they describe the use of computer and communication networks that know
    no geographical bounds and share data–an intangible and volatile artifact. Victims
    of cybercrime and law enforcing framework (police and judiciary) experience an
    all-new turf in terms of: (i) plundering of assets through manipulation of intangible
    entities like data; (ii) falling victim to unconventional weaponry like hacking;
    (iii) a virtual crime scene that may encompass machines physically located thousands
    of miles apart and in different legal jurisdictions; (iv) the divergent criminal
    behavior where theft of asset (read data) may not mean the disappearance of an
    asset from the owner’s possession; (v) radically different (from traditional crime)
    forms of crime where the brute processing power of modern computing machine is
    used to perpetrate misdeeds; and (vi) an investigative approach and judicial trial
    synchronized to the novelty of the crime.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Having emphasized the absence of a universal definition of cybercrime, Aiyengar
    (2010) has presented a somewhat largely agreed-upon description of cybercrime
    in the legal domain an accumulation of computer-related crimes, conventional crimes
    committed using computers, and content-related crimes.


    Roshan (2008) has presented a general definition of cybercrime as any illegal
    activity in which the computer is used either as a tool in committing the crime
    or becomes the target of the crime or both. Govil (2007) has observed that sometimes
    flimsy and many a time very real anonymity of the Internet provided by ‘virtual
    private network’ (VPN) and ‘the onion router’ (TOR) provides an ideal playfield
    for unsuspecting net users falling prey to net hawks.


    Although, often cybercrime and computer crime are used interchangeably, yet Ajayi
    (2016) has attempted to distinguish cybercrime from computer crime. He has argued
    that although the two are similar but different. Computer crimes comprise the
    crimes perpetrated against the computer system, including hardware and non-hardware
    components (data and software). Cybercrime, on the other hand, encompasses criminal
    acts committed in cyberspace—a virtual space created by computer networks. McGuire
    & Dowling (2013) has described two types of cybercrimes: (i) cyber-enabled crimes;
    and (ii) cyber-dependent crimes. Whereas cyber-enabled crime comprises traditional
    crimes whose potency and scale are increased by employing the computing and communication
    power of modern computer networks, cyber-dependent crime, however, can happen
    only by using computers and their networks.


    The tenth UN Congress’ Report on the Prevention of Crime has placed cybercrime
    in two categories, namely, computer crime and computer-related crime. The former
    type of crime compromises the security of a computer system to gain unlawful access
    to computing resources, including data, software, and hardware. A computer-related
    crime, on the other hand, is an otherwise illegal activity carried out with the
    help of or using a computer system/network.


    Indian cyber law or for that matter any other Indian law does not define ‘cybercrime.’
    But, the legal literature mentions cyber-terrorism as a kind of premeditated crime
    that is politically motivated against the information technology infrastructure
    of a nation-state resulting in violence against public property and people (Kumar
    et al., 2015). Swaathi & Kannappan (2018) have defined cybercrime as an offense
    wherein a computer or a network is either the target, the intermediary, or the
    means for commissioning of an act that is otherwise criminal under law.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.2 CYBER FORENSICS


    Etymologically, the word ‘forensic’ relates to the Latin word ‘forensis’ which
    means: “public, to the forum or public discussion; argumentative, rhetorical,
    belonging to debate or discussion.” Merriam-Webster gives a topical and modern
    definition of ‘forensic’ as: “relating to, used in, or suitable to a court of
    law.” Accordingly, a science used in the court of law to push a point of law is
    called ‘forensic science.’


    Digital or cyber forensics can be understood as the extension of ‘traditional’
    forensics in cyberspace. Clancy (2011) has defined cyber forensics as the scientific
    discipline of identification, collection, preservation, transportation, analysis,
    and reporting of digital evidence in a format that is admissible in a court of
    law. As a corollary, it can be used in the detection, trial, and adjudication
    of cybercrime. It involves scientific techniques for the recovery, authentication,
    analysis, and interpretation of residual or reconstructed digital data.


    And, in cybercrime cases, the signature and trail of the crime could be traced
    back to data–called ‘digital evidence’–that is stored/residual on digital devices
    like computers, routers, smartphones, gateways, servers, tablets, smart televisions,
    peripheral storage devices like hard drives, USB flash sticks, and other such
    devices that have digital memory capacity. Rishi (2018) has bifurcated the cyber
    evidence into two forms: (i) active content–written text, audio, files, videos,
    e-mail texts, text messages, instant messages, and social media posts; and (ii)
    passive metadata–data about the active content, e.g., user credentials, geolocation
    of user, transactional data, etc.


    Cyber forensics is the use of computer science and related technologies in the
    investigation of cybercrime cases. It may involve the collection, preservation,
    transportation, and analysis of digital evidence for legal purposes. Cyber forensics
    work upon the ‘digital evidence’–the footprints left behind when somebody consumes
    information and communication technology resources (Albert & Venter, 2017). The
    digital evidence may reveal varied but important information about the person
    using the ICT resource.


    Digital evidence is the digital footprints of users’ online behavior. Internet
    architecture allows for (and keeps a record of) many user actions, such as posts
    (e.g., emoticons, text comments, video clips, images), likes, forwards, dislikes,
    favorites, followings, search queries, browsing histories, geolocation information,
    and purchase preferences. All these pieces of users’ activity-related information
    contribute to digital evidence. The evidence is bifurcated into two categories,
    namely: active and passive (Micheli et al., 2018):'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   1. **Active Digital Footprints:** Digital footprints created (and left
    behind) by the users, such as comments, videos, and images posted on social media
    platforms, weblogs, RSS, and BBS, etc., are termed as ‘active digital footprints.’

    +   2. **Passive Digital Footprints:** The ancillary data that are created (and
    left behind) by the Internet and social media users are called ‘passive digital
    footprints.’ This may include the users’ internet browsing trail and weblog data.


    Data can be acquired and used as digital evidence in a court of law. Digital evidence
    is paramount in the adjudication of cybercrime cases and can be used as evidence
    in a courtroom. These data can be used to: (i) refute or support the testimony
    of a victim, witness, or suspect; (ii) prove or disprove a matter being asserted;
    and (iii) implicate or exculpate a suspect of a crime.


    But acceptance of a digital device by a court of law as either direct or circumstantial
    evidence requires it to be authenticated. Authentic evidence includes: (i) content
    created by a user (e.g., a word processing document created by any person); (ii)
    content created by a digital device without any kind of user intervention (e.g.,
    internet browsing history, Google search history, weblogs); and (iii) content
    created by a combination of (i) and (ii) above (e.g., a spreadsheet wherein some
    data were input by the users and others were generated through calculations made
    by spreadsheet software).


    User-created content is admissible as evidence in the court of law if it can be
    attributed to a person and device-created content shall be admissible as evidence
    if: (i) its creation can be demonstrated; (ii) possibility of alteration of data
    so created can be ruled out; and (iii) for the content created both by device
    and user, its fidelity and reliability needs to be established.


    Contrary to traditional evidence like weapons and paper documents, digital evidence
    poses singular challenges, for its following characteristics: volume, velocity,
    volatility, and fragility. Some jurisdictions have created specific digital evidence
    authentication rules while others treat the digital evidence at par with traditional
    evidence in respect of authentication requirements. Several cyber forensics models
    have been proposed and used in different jurisdictions.


    # 1.2.1 DIGITAL FORENSIC RESEARCH WORKSHOP MODEL 2001


    In 2001, Digital Forensic Research Workshop (DFRW2001) has worked out a model
    based on US FBI’s physical crime scene search protocol, wherein the following
    seven phases have been listed–Table 1.1 (Palmer, 2001).'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# TABLE 1.1 Investigation Phases in DFRW2001 Model


    | SL. No. | Phase | Activity Carried Out/Artefact Used |

    |---|---|---|

    | 1. | Identification | It involves the detection of cybercrime and the creation
    of the profile of the cybercrime/cybercriminals. |

    | 2. | Preservation | It involves the preservation of digital evidence using imaging
    technologies. |

    | 3. | Collection | The collection involves a mechanism of recovery and lossless
    compression of digital evidence from the crime scene. It is required that the
    evidence is preserved during collection. |

    | 4. | Examination | The examination involves trace-back, pattern matching, and
    validation of evidence. Preservation of evidence is required. |

    | 5. | Analysis | Analysis of digital evidence involves trace-back, data mining,
    statistical testing, and evidence preservation. A timeline of events is established.
    |

    | 6. | Presentation | The presentation involves documentation of findings and
    clarification by domain experts followed by the testimony by legal experts in
    courtrooms. |

    | 7. | Decision | Pronounce the decision. |


    Source: Palmer (2001).


    # 1.2.2 NATIONAL INSTITUTE OF JUSTICE (NIJ) 2001/2008 MODEL


    The National Institute of Justice (NIJ) of the US Department of Justice proposed
    an investigative model of cybercrimes in 2011 (revised in 2008). NIJ’s First Responder
    Guide to Electronic Crime Scene Investigation focuses on counterpart actions of
    physical crime scene procedures, namely:


    +   - Identification of digital and other devices possibly holding the digital
    evidence;

    +   - Documentation of the crime scene;

    +   - Collection of relevant digital and other related devices; and

    +   - Transporting the devices possibly holding the digital evidence. It requires
    packaging and safeguarding the devices involved.


    # 1.2.3 THE ABSTRACT DIGITAL FORENSICS (ADF) MODEL 2002


    In the year 2002, the Digital Forensic Research Workshop extended its 2001 model
    (Reith et al., 2002) and named it the abstract digital forensics model (ADF).
    The model has nine phases as in Table 1.2.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# TABLE 1.2 Investigation Phases in ADF2002 Model


    | SL. No. | Phase | Activity |

    |---|---|---|

    | 1. | Identification | Observe the indicators to identify the incident and its
    category. |

    | 2. | Preparation | Suitable tools and requisite search warrants and authorization.
    |

    | 3. | Approach strategy | Case-specific strategy is prepared to maximize the
    collection of ‘pure’ evidence with minimum impact to the victim. |

    | 4. | Preservation | Isolation of digital evidence followed by its secure preservation.
    |

    | 5. | Collection | The crime scene is recorded, and a copy of digital evidence
    is created for further examination and analysis. |

    | 6. | Examination | Evidence is examined to establish relationships with the
    crime. |

    | 7. | Analysis | The significance of evidence is determined, and the conclusion
    is drawn. |

    | 8. | Presentation | Summary of investigation with explanatory notes is presented.
    |

    | 9. | Returning evidence | Confiscated devices are returned to the owner. |


    Source: Reith et al. (2002).


    # 1.2.4 INTEGRATED DIGITAL INVESTIGATION (IDI) MODEL 2003


    Carrier & Spafford (2004) have suggested the integrated digital investigation
    model (IDI) comprising five stages with each stage having its phases (Table 1.3).


    # 1.2.5 NATIONAL INSTITUTE OF STANDARDS AND TECHNOLOGY 2006


    In 2006, the United States National Institute of Standards and Technology suggested
    a digital forensics model (Grance et al., 2006). The model comprises four phases
    listed in Table 1.4.


    # 1.2.6 CYBER FORENSIC FIELD TRIAGE PROCESS MODEL 2009


    Rogers et al. (2006) has pointed out a common drawback of the aforementioned five
    models. They have pointed out that all these models assume that all the steps
    of the respective model are carried out for each crime investigation. Nowadays,
    practically every criminal investigation requires digital'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'device(s) as evidence. Count of digital devices figuring in criminal cases
    and the volume of data are increasing at an exponential rate, thereby making it
    increasingly impractical to deeply examine all the concerned digital devices.


    # TABLE 1.3 Stages in IDI2003 Model


    | SL. No. | Stage | Phase/Activity |

    |---|---|---|

    | 1. | Readiness | Readiness of investigative tools assessed |

    | 2. | Deployment | a. Incident detected; b. Requisite personnel notified; c.
    Authority to investigate obtained; d. Search warrants obtained. |

    | 3. | Investigation of physical crime scene | a. The physical crime scene is
    secured; b. Relevant physical evidence are identified; c. The crime scene is documented;
    d. Physical evidence is collected from the scene; e. Physical evidence is examined;
    f. Crime scene events are reconstructed; g. Findings are presented in court proceedings.
    |

    | 4. | Investigation of digital crime scene | a. Digital evidence secured; b.
    Relevant digital evidence identified; c. Digital evidence documented, acquired,
    and analyzed; d. Events reconstructed; e. Findings presented in court. |

    | 5. | Review | a. Investigation concluded; b. Assessment made to identify lessons
    learnt. |


    Source: Carrier & Spafford (2004).


    # TABLE 1.4 Phases in NIST Model (2006)


    | SL. No. | Phase | Activity |

    |---|---|---|

    | 1. | Collection | Evidence at the scene identified, labeled, collected, and
    documented. |

    | 2. | Examination | Forensic tools/techniques to extract relevant digital evidence
    determined. |

    | 3. | Analysis | Digital evidence extracted and evaluated, and their applicability
    in the instant case determined. |

    | 4. | Reporting | Cyber forensic activities documented and findings presented.
    |


    Source: Grance et al. (2006).'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Rogers et al. (2006) have proposed ‘an onsite’ digital forensics process model
    for quick identification, analysis, and interpretation of digital evidence. This
    model has no requirement of transporting the digital equipment to the cyber forensic
    facility for the examination of digital evidence. Casey et al. (2009) has argued
    that some cyber forensics establishment can afford to create a copy of every piece
    of digital evidence and analyze them deeply, but for most instances, examination
    and analysis of only a handful of digital evidence can provide sufficient support
    to the prosecutors. Authors have proposed trifurcation of forensic examination
    for use in both settings–field and lab:


    +   1. **Survey Forensics Inspection:** Conducted to quickly identify potential
    sources of evidence and prioritize them for examination based on their volatility
    and relative importance.

    +   2. **Preliminary Forensic Examination:** Conducted on the digital evidence
    identified during the survey forensics inspection phase to search the information
    that provides direct, or circumstantial evidence. For some cases, no further examination
    is required.

    +   3. **In-Depth Forensic Examination:** Conducted on the whole body of digital
    evidence. This kind of examination might be necessitated when: (a) evidence destruction
    is not ruled out; (b) earlier examination has raised new questions; or (c) case
    trial is about to start.


    # 1.3 CYBERLAW IN INDIA


    In India, the Information Technology Act (2000) as amended in 2008 along with
    the statutes, rules, and guidelines invoked under its proviso provides for primary
    legal infrastructure and safeguard against cybercrimes. 2008 amendment in the
    IT Act 2000 has provided for the digital signature, among other things. Other
    additional provisions made in the amended act included Sections 66A and 69, for
    dealing with offensive messages and interception of any information through any
    computer resource. 2008 amendments also took note of pedophilia (child porn),
    cyber terrorism, and voyeurism. But, in a 2015 landmark decision delivered by
    India’s apex court in Shreya Singhal v. Union of India case, Section 66A of the
    IT Act was struck down as unconstitutional.


    In this communication, the unlawful cyber activities punishable under the IT Act
    (2000) have been bifurcated on the ground whether the act draws a fine or a jail
    term plus a fine. Accordingly, the former kind of unlawful acts has been termed
    as the ‘cyber offense’ and the latter type the ‘Cybercrime.’'
  merge: -1
  img_proc: true
