    to solve the crime. A few examples of the noteworthy case investigations which
    involved Fitbit fitness trackers that provided law enforcement agencies with evidence
    vital to prosecution includes the Mollie Tibbetts missing person case, the Richard
    Dabate murder case and a few others.


    In the mid of 2015, a murder case was reported where the accused claimed that
    his wife was killed by an assailant. He gave a detailed account of the events
    leading up to his wife’s death. According to the statement given, the accused
    heard his wife scream from the garage before he saw an intoxicated man inside
    his home. He tried to counter attack and save his wife, but the assailant was
    eventually able to kill her. The assailant then left the house and walked away.
    Even though accused was partially tied up, he was still able to activate their
    alarm system. After obtaining the accused’s statement, the police searched for
    evidence related to the events that led to his wife’s murder, which included his
    and his wife’s cell phone records, computer records, and Facebook records, text
    messages sent to and from his wife and his girlfriend and Fitbit records of his
    wife, which included data from home’s alarm system, geo-location, activities,
    and her last movements. They also gathered various electronic records from all
    of his devices. The final analysis of all the digital evidence contradicted with
    the statement given by the deceased’s husband. The evidence proved that the statement
    given by the husband differed from the detailed records and geographical locations
    identified from their personal digital devices (Black, 2017).


