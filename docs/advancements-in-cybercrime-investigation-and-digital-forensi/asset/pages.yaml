  md: 'Dhupdale (2010) has mentioned the following challenges by cybersecurity teams
    during investigation and prosecution:


    +   - A global dearth of cyber experts;

    +   - Securing cyberspace goes against privacy requirements;

    +   - Cybersecurity teams are required to keep pace with fast-changing digital
    businesses;

    +   - Cyberspace is becoming more complex with each passing day.


    Iqbal & Beigh (2017) have underlined the following challenges to cybercrime investigation:


    +   i. **No Physical Boundaries:** Cybercrimes know no physical boundaries and
    their investigation requires international cooperation–an unlikely proposition.

    +   ii. **Lack of Cyber-Criminal Statutes:** Several countries either don’t have
    a cybercrime law in place or lack effective and updated cyber laws.

    +   iii. **Lack of Tools and Technology for Investigation:** In general, there
    is a dearth of tools for the conduct of a proper investigation into cybercrimes
    in India.

    +   iv. **Lack of Enforceable Mutual Assistance Provisions:** Cybercrimes, possibly
    being transnational, may require several jurisdictions to assist in trying and
    prosecuting the cybercriminals. India’s being out of the Budapest convention may
    be seen in this light apart from the fact that the convention seeks to undermine
    the sovereignty of its signatories.


    MEITY (2021) report has listed a comprehensive but incomplete list of challenges
    to the cybercrime investigation:


    +   a. Analysis of fake information/content is a singular type of challenge in
    the fight against the spread of disinformation on the Internet in general and
    social media platforms in particular. Time and again it has come to light that
    social bots² are increasingly used for manipulating the trends on social media.

    +   b. Organized terror outfits and state actors make incremental use of cyber
    technology to pose advanced threats to national security.'
