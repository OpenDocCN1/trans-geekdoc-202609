    # 13.5 CARBANK ATTACK CASE


    This attack was one such which illustrates the complete profile of modern-day
    frauds and monetary or financial crime. This series of attacks began in the year
    2013 which caused a monetary loss which was amounting to be more than $1 billion.
    The criminals who were part of a planned perpetrator organization gained access
    to the systems with the help of phishing attacks and shipped balances to their
    bank accounts, and they programmed banking machines (ATMs) to withdraw cash. The
    offense was noticeable and it was been notified that this attack is being done
    on multiple banking companies which took place in a coordinated and simultaneous
    way. The offenders showed a high level of understanding and knowledge of the computer-related
    crimes and digital environment which include operations linked with banking systems,
    their controls, and even the faults (Hasham, Joshi& Mikkelsen, 2019). They used
    banking machines (ATM), transaction cards (i.e., credit and debit cards), and
    transferring of wire among other methodologies. This assault proved that there
    are no longer differences between computer-related crimes, primitive frauds, and
    criminality against finance.


