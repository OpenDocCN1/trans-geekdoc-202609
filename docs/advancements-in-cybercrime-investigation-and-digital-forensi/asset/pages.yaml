    # ABSTRACT


    In today’s world, mobile devices have become the utmost priority of every individual.
    A mobile phone or cell phone is a portable telephone with an access of cellular
    radio system hence it can be used worldwide. Mobile phones are considered as portable
    computers as they can do all things that a computer can do. But nowadays, it plays
    a vital role in several crimes and become an important investigative tool in forensics
    for tracing the crime. Mobile forensics (MF) is just another part of digital forensics
    which involves collection and preservation of evidence in the digital format in
    order to proof or disproof a crime. Steps involve in MF are identification, preservation,
    acquisition, analysis, documentation, and preservation. Prior to examination and
    analysis of digital evidence, seizure is done. Certain classification tools are
    present which are being used for extracting information required which is present
    in the digital format from the devices these are manual, physical, and'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'logical extraction. Various challenges may impact the collection and examination
    of data from the mobile devices. These can be differences in hardware, legal issues,
    anti-forensic techniques, alteration of device, accidental reset, lack of resources
    and dynamic nature of evidence. Android data acquisition and iPhone data acquisition
    both follows distinct procedure. Both android data acquisition and iPhone data
    acquisition access logical extraction and creates a backup copy of data.


    # 11.1 INTRODUCTION


    In this era of modern science and technology, the use of mobile phones is merging
    at an alarming rate and at an exponential speed, mobile forensics (MF) develops
    an important aspect as mobile devices are often found at the places where crime
    took place (Ayers, Jansen, Moenner, & Delaitre, 2007). The extensive use of forensics
    widely plays an important role in the criminal investigations, internally from
    a corporate auditing frauds and accounting case to a criminal investigation carried
    out at law enforcement agencies. Many crimes took place which one way or other,
    involve any kind of mobile device or any other form of digital evidence (Bates,
    1998). Thus, this field of forensics is emerging as an important tool in tracing
    crime, criminal, and their reason for criminality in order to make the world a
    better place.


    On the basis of, information given by NSD or commonly known as National Security
    Database, digital forensics is an emerging branch of computer forensics that deals
    with the crimes often done digitally or involve any such crime of digital devices
    which help us to proof or disproof a statement (Carrier, 2001; Casey, 2010). Being
    a branch of Digital forensics, Mobile device forensics deals with the recovery
    and gathering of digital evidence or data from mobile phones and similar devices
    from our daily life. These smart phones these days have pre-installed operating
    system (OS), software applications thus, make the interaction with the user convenient
    and very hands-on. In the modern era, certain cybercrimes such as cyber bullying,
    fraud, espionage, and other cross-border crimes are done through mobiles (Conder
    & Darcey, 2009). Mobile is a digital device having both internal storage memory
    and external memory cards are used for the storage of data (Garber, 2001; Garfinkel,
    2010; Garner, 2011). External memory storage devices such as memory cards, pen
    drives, etc. Subscriber identity module or SIM is a major identity module, separates
    the phones numbers, names of the contacts and network settings from the personal
    information present in the mobile phone (Halderman, Schoen, Heninger, & Felten,
    2008).'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Mobile devices can be used as a minicomputer as they can save our personal
    information such as contacts, photos, notes, chats, passwords, user account credentials,
    internet browsing history, messages, etc. (Al-Mutawa, Baggili, & Marrington, 2012).
    It is the easy source for the criminal to attain your personal information and
    fraud a person. The application of MF is of great use not only in the law enforcement
    investigations, but also in the corporate investigations and their auditing criteria
    for information security and managing different kinds of risk involved with the
    functioning of the organization, private investigations for personal use, criminal,
    and civil defense, military intelligence and electronic discovery of some confidential
    information that may have some value (Park, Chung, & Lee, 2012; Jansen, & Ayers,
    2007). Numerous businesses may turn to mobile evidence if they believe their intellectual
    property is being stolen or any of their employee is engaged in fraudulent activity.


    # 11.2 MOBILE FORENSICS (MF)


    Mobile devices play a major role in the collection of evidence in the form of
    digital data. MF is a very interesting and less explored branch of digital forensics
    that focuses on forensically sound examination of digital evidence collected from
    a cell phone found at the crime scene. It allows for the systematic gathering
    and processing of proof stored on a smartphone, such as text messages, personal
    chats, call recording, MP3 and MP4 files, browser history, location, and so on,
    without compromising with the integrity of the data (Dasari, Nandagiri, & Satish,
    n.d.). One of the most important things to be prioritize is to gain access to
    intentionally erased and deleted data from mobile phones.


    # 11.3 LITERATURE SURVEY


    There is not much history associated with MF because it is a newly emerging field
    and it has still to go a very long route to develop. It all started in 1990s and
    2000s when there were a lot of advancement took place in mobile phones and when
    smartphones were starting to emerge but at that time only few and wealthy people
    own mobile phones. Later on in 2000s when a large population start using them
    it become quite popular among people, and everyone used it for storing their important
    data and documents and mobile phones become the most personal form of storage
    so when any crime took place the first commodity that meant to checked so in this
    way MF came into action.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Forensics or forensic science in the branch of science that deals with the
    use of scientific techniques to solve the criminal cases. In MF we use tools or
    techniques to analyze the mobile devices found at the crime scene which may have
