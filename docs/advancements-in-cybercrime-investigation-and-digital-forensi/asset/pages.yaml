- pgno: 44
  md: 'investigators may approach the ISP associated with the IP address to supply
    the information about the person or the body who has subscribed to the IP address
    under question. Legal and constitutional frameworks governing the liabilities
    of ISPs in these respect vary from land to land (Lin, 2016).


    # 1.4.4.4 THE VOLATILITY OF EVIDENCE


    Digital evidence needs to be handled properly, for it is volatile and fragile.
    Digital evidence handling protocols are important to ensure its integrity and
    safety against any alteration or damage while accessing, packaging, transporting,
    or storing it. Such evidence is collected in order of its volatility. Accordingly,
    the most volatile evidence is collected first and the least volatile is collected
    last. Brezinski & Killalea (2002) have provided the following ordering of devices
    based on their volatility:


    +   - Internal registers, cache memory;

    +   - The routing table, process table, kernel statistics, memory;

    +   - Temporary internet files;

    +   - Disk media;

    +   - Remote logs;

    +   - Physical configuration, network topology;

    +   - Archival media.


    Digital evidence relevant to cybercrime may be resident on a diverse array of
    devices and may span several services and jurisdictions. Digital evidence can
    thus be stored in part or whole by several service providers at multiple. Collecting
    evidence from multiple devices, multiplayer, and possibly in multiple jurisdictions
    is quite a challenging task.


    # 1.4.4.5 DELETED CONTENT


    Digital evidence that has been deleted from the file system records poses another
    challenge for cyber forensics. Normally, files deleted from a computer are not
    deleted physically, but merely marked for deletion and are placed in what is called
    a Recycle Bin or Trash Bin. Their entries remain in the system’s registry, i.e.,
    the file allocation table. In case the Bin is emptied, the deleted files’ entries
    from the file allocation table are deleted and the space occupied by the deleted
    files is marked ‘free’ for allocation'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'to new files. Chances of recovery of files whose entries have been deleted
    from the Bin as well depend on whether the particular storage space freed by those
    files has been taken up by some newly created file thereafter or not. In case
    the space freed by deleted files has still not been taken up by any other file,
    the contents of the deleted file are recoverable, otherwise not (Maras, 2016).


    # 1.4.4.6 MOBILE NUMBER PORTABILITY


    Mobile number portability is a service enforced by telecom regulators and provided
    by telecom operators to the customers where any subscriber can switch between
    mobile services of different operators in a hassle-free manner, even without changing
    the subscriber information module (SIM) card. Although the service is very beneficial
    for the customers, it adds to the difficulties of cybercrime investigation and
    poses a challenge to track the cyberspace activities of criminals.


    # 1.4.5 CHALLENGES RELATED TO JURISDICTION


    The continuously evolving digital technologies coupled with the ambiguous and
    inefficient cyberlaws pose a challenge to all involved in the investigation, prosecution,
    and adjudication of cybercrimes cases. Issue of the jurisdiction in cybercrime
    cases has come to the fore in the discussions in courtrooms, techno-legal professionals
    and academicians, bureaucrats, and senior management of tech companies. A single
    internet operation may span the jurisdictions of several countries, e.g.: (a)
    laws of the land where the user is located; (b) laws of the land hosting the services;
    and (c) laws of the land where the merchant is registered. So, to investigate
    cybercrimes effectively, updated international laws must exist and the more importantly,
    the international community must cooperate to enforce these laws. However, under
    the garb of sovereignty, some nation-states provide heaven to cybercriminals.


    In India, u/s 75 of Information Technology Act (2000), there exist provisions
    to try any person, irrespective of his nationality, for the cybercrimes committed
    outside India, provided that such offense involves a computer resource located
    in India. Despite such provisions in the Indian cyber laws, extradition of foreign
    citizens remains a far-fetched dream.'
