    # 11.5.3 EXAMINATION AND ANALYSIS


    The examination and analysis of recovered mobile phone evidence is done by cyber
    analysts with the help of various tools and techniques which can acquire the data,
    store the data, extract the data and various other things that are need to be
    carried out. Prior use of specialized tools (EnCase, ILOOKIX, FTK, etc.), is done
    by the investigators or examiners to support with inspecting and recuperating
