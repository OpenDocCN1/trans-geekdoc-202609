- pgno: 150
  md: '# 6.4.3 DATA MINING (DM) ARCHITECTURE


    The actual data sources are text files, the World Wide Web, data warehouses, databases,
    and other documents. To be successful, DM necessitates a significant volume of
    historical data. Organizations commonly store data in data warehouses or databases.
    Spreadsheets, text files, one or more databases, and other data repositories may
    be found in data warehouses. The data must be selected, integrated, and cleansed
    before being sent to the data warehouse or database server. Because the data originates
    from various sources and in a variety of formats, all of that can’t be used immediately
    for DM because it’s not always complete and accurate. As a result, the initial
    data must be homogenized and cleaned. The necessary amount of data will be acquired
    from a large number of sources. Then just the most relevant and appropriate data
    is chosen and sent to the server. As a result, in response to a user request,
    the server is responsible for retrieving appropriate data from the database based
    on DM.


    Any DM system must include a DM engine. It contains modules for DM tasks such
    as time series analysis, prediction, clustering, classification, characterization,
    and association. To put it another way, DM is the bedrock of our DM architecture.
    It is made up of software and tools that are used to extract information and insights
    from data gathered from various sources and stored in a database. The Pattern
    evaluation unit is primarily in charge of quantifying the pattern using a given
    threshold. It collaborates with the DM engine to reduce the results down to distinct
    and unique patterns. Stakeholder analysis is frequently used in conjunction with
    DM modules in this industry to narrow the search to important trends. For example,
    it may employ a stake threshold to eliminate previously observed patterns.


    The DM system and the user communicate through the graphical user interface (GUI)
    module. It allows the user to use the system quickly and effectively without grasping
    the process’s intricacies. This module interfaces with the DM system to send the
    results when the user submits a task or a query. The knowledge base is beneficial
    throughout the DM process. The knowledge base also contains user opinions and
    data from user experiences. It could be useful for directing the search or determining
    the significance of the pattern results. To enhance the trustworthiness and accuracy
    of the outcome, the DM engine may leverage inputs from the knowledge base (Gampala
    et al., 2020). Figure 6.4 depicts the architecture of DM.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/46a7ed74d391bf69db3c36e9484e1be4_151_0.png)


    FIGURE 6.4 Architecture of data mining.


    # 6.5 MACHINE LEARNING (ML) TECHNIQUES FOR DIGITAL FORENSIC


    The process of discovering algorithms that have improved as a result of data-driven
    experience is known as ML. The process of creating, examining, and developing
    algorithms that allow machines to learn with no need for human involvement is
    known as algorithm development. ML and DM are both part of data science, making
    sense considering that they both use data. Many people unintentionally use the
    phrases interchangeably because both approaches are used to address complex problems,
    given the fact that ML is occasionally used to undertake useful DM (Mohri et al.,
    2018). Data from DM, on the other hand, can be utilized to train machines.


    Furthermore, both processes employ the same fundamental data pattern detection
    algorithms. ML teaches a computer how to learn and interpret the parameters that
    are given to it, whereas DM is used to derive rules from massive amounts of data.
    Figure 6.5 shows the relationship between AI, statistics, DM, and ML.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/46a7ed74d391bf69db3c36e9484e1be4_152_0.png)


    FIGURE 6.5 Relationship between AI, DM, ML, and statistics.


    Without being explicitly designed, ML allows a machine to learn from data, improve
    performance based on previous experiences, and predict future events. ML algorithms
    create a mathematical model using past data samples, referred to as training data,
    which helps them make judgments or predictions without being explicitly programmed.
    The life cycle of ML is a cyclical method for designing and implementing a successful
    ML project. The primary goal of the life cycle of ML is to find a solution to
    the problem (Ashmore et al., 2021). Figure 6.6 depicts the seven major steps in
    the ML life cycle.


    Collecting data is the first phase in the life cycle process of ML. Data could
    be collected from different sources, including mobile devices, the internet, databases,
    and files. Therefore, we must first find the various data sources. The output’s
    efficiency will be determined by the quality and quantity of the data collected.
    The more data there is, the more accurate the prediction will be. This process
    entails: (a) identifying multiple data sources; (b) collecting data; and (c) combining
    data from diverse sources. Next, we must prepare the data for further processing
    after it has been collected. Data preparation comprises storing our data in the
    right place and preparing it for ML training. That whole phase will get categorized
    into two different sections. They are Data exploration and data pre-processing.'
  merge: -1
  img_proc: true
