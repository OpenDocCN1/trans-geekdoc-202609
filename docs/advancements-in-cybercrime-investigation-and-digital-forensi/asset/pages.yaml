- pgno: 74
  md: 'In this chapter, specific security mechanisms such as encryption and watermarking
    are explored and investigated for information protection and transmission over
    open networks. In the proposed method, the information protection techniques are
    analyzed for “digital imaging and communications in medicine (DICOM) images.”
    The information of the patient is made secured by using fusion techniques of image
    encryption and watermarking. Two sets of images related to the patient are transmitted
    securely by hiding one image into the other. One of the images is addressed as
    cover image (CI) and the second is addressed as a watermark image (WM). WM, which
    contains sensitive patient information is made unreadable by encryption followed
    by embedding or insertion into the CI which enhances security. Chaotic map image
    encryption technique is used to encrypt WM. “Discrete wavelet transform (DWT)
    along with singular value decomposition (SVD)” are employed for embedding the
    encrypted WM into the CI.


    Choice of chaotic maps for encryption is mainly due to their sensitive dependency
    on initial conditions, which is an essential aspect of encryption. The patient
    information is embedded into the DICOM image using DWT along with SVD. DWT converts
    image pixels into wavelet coefficients. These wavelets coefficients are used for
    image compression and coding. DWT captures input frequency content along with
    temporal content. The patient data is encrypted using a combination of logistic
    and skew tent maps. This encrypted information is embedded into the DICOM image
    using DWT and SVD.


    The performance evaluation of implemented encryption and embedded algorithms are
    investigated using objective evaluation metrics such as the “number of changing
    pixel rate (NPCR), unified averaged changed intensity (UACI) for encryption techniques,
    mean square error (MSE), peak signal to noise ratio (PSNR), correlation coefficient
    (CC), normalized correlation coefficient (NCC) and structural similarity index
    (SSIM)” for watermark embedding process (Nguyen, Marie, & Azeddine, 2010; Silpa
    & Aruna, 2012). Performance of the proposed chapter is accessed by tracking the
    minute changes of the objective metrics when subjected to watermarking artifacts.
    With the implementation of the proposed scheme, it can be inferred that PSNR can
    be considered as a good metric for watermarking embedding strength variation.
    However, PSNR fails to measure image quality for different watermarking artifacts.
    It is observed that SSIM serves as a better metric for measuring image quality.'
  merge: -1
  img_proc: true
