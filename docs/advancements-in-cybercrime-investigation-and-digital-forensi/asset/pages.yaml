    and cybercrimes (Powell & Haynes, 2020). Conventional crimes leave behind various
    clues such as fingerprints, DNA, footprints, and witnesses for the investigators
    to examine and investigate. Similarly, any kind of digital activity on electronic
    devices leaves a trail of data for cyber investigators to investigate and inspect
    the crimes to find the perpetrators. In all the cybercrime cases, it is very crucial
    to acquire the digital evidence, and they should be handled properly so that they
    can be further admissible in the court of law.


