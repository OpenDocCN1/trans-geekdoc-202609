    # 14.8 CONCLUSIONS AND FUTURE SCOPE


    In this work, an authentication for online payment was created, which is a mobile
    application-based authentication using biometrics that allows users to complete
    financial transactions. The data used for authentication is face identification
    or verification which is used to grant transaction authorization. The method entails
    using an AES algorithm that uses 256-bit for the biometric encryption and decryption
    of face in conjunction with QR (quick response) biometric authentication for online
    payment. The transaction licenses used to counterfeit biometric face data include
    QR Code and also face authentication cards. The face data information has been
    stored on the cloud server so that it is easier to control and succeed. The Android
    OS with a minimal portion of API (application programmable interface) and to build
    mobile app authentication Level 22 Lollipop is used. As a result, it was determined
    that there are two key implementation processes: registration and transaction.
    Here, double authentication is used because of this operation and it can help
    to prevent cybercrime and provide a safe payment transaction.


    Mobile application-based online transaction authentication are utilized for commercial
    transactions and consecutively online access. For transactional purposes, dual
    authentication was implemented. The first uses a QR code, and the second uses
    facial recognition. The 256-bit AES method is used to encrypt and decrypt biometric
    facial authentication data. This application had a 95% accuracy rate. Each transaction
    takes about 53.21 seconds to process. Incorporating blockchain technology for
    secure and encrypted data storage could improve this strategy in the future. This
    ensures that the transaction will not be tampered with. In the current situation,
    the person must proceed to the counter and place his or her face in front of the
    computer or any other electronic device where the database is stored. This work
    could be expanded by including it in a shopping mall where payments for items
    purchased are made automatically. In the exit, the face may be checked and authenticated,
