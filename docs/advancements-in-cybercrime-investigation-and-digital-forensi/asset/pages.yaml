  md: '2. **Modus Operandi:** The procedure to investigate cybercrime cases needs
    to be radically different, for cybercrime is potentially different from a traditional
    crime. Accordingly, the examination and analysis of evidence and its presentation
    in the courtroom need to be in sync with the law and nature of the crime.


    3. **Means of Investigation:** An altogether different set of artifacts is required
    to obtain evidence, justify arrest warrants for the accused, and bring the case
    to a just end.


    Cybercrime Investigation Handbook for Police Officers prepared by the Ministry
    of Home Affairs, Government of India, has presented the following generic list
    of challenges faced during cybercrime investigation:


    +   - Prompt, hassle-free, and victim-friendly reporting of cybercrimes;

    +   - Adequate and proper ‘first response’ when cybercrime is reported;

    +   - Properly trained human resources are required to investigate cybercrime;

    +   - Capacity building education and training programs and institutes;

    +   - Understanding and appreciation of cyber forensics by judicial officers;

    +   - An inadequate and up-to-date legal framework to try and punish cybercrime;

    +   - Availability of state of art hardware and software tools and technologies
    required for cybercrime investigation;

    +   - Standardization of cybercrime investigative framework wherein required and
    desirable skill sets are mentioned.


    Poonia (2014) has compiled the following list of challenges in the fight against
    cybercrimes in the Indian context:


    +   - There is a stark lack of awareness regarding the security of cyberspace
    at an individual, societal, organizational, and government level.

    +   - There is a huge deficit of human resources with proper education and training
    to counter cybercrimes and cyberattacks.

    +   - Absence of e-mail account policy for government officials in general and
    security forces in particular.

    +   - State-sponsored cyber terror attacks are a major concern for securing national
    cyberspace.

    +   - An overwhelming majority of police personnel are cyber-illiterate, for there
    is no cyber-proficiency requirement for recruitment in the police force.

    +   - Cyber technology changes at a very fast pace and cybercriminals outpace
    the cybersecurity agencies in the innovative use of modern technology.'
