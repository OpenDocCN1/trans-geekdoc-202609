    FIGURE 3.1 Difference between chaotic and cryptographic systems.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_77_1.png)


    FIGURE 3.2 The confusion and diffusion levels of image encryption architecture.


    The confusion level comprises of permutating pixels, where the pixel positions
    are distributed over the entire image. Only pixel positions are'
  merge: -1
