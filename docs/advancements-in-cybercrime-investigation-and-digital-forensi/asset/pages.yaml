    # 13.1 INTRODUCTION


    Crime is not a new word. It can be heard in our day-to-day life; while defining
    crime, it can be defined as any illegitimate work that bears a punishment from
    a court of law (The Institute of Company Secretaries of India, 2016). This punishment
    can be in the form of a fine or imprisonment. Crime was certainly existing for
    ages, but with this advancement in technology, and communication emergence of
    a new mode of crime has occurred, which is termed cybercrime. If anyone wants
    to know, what cybercrime is, one should first go for the concept of crime and
    then what cybercrime is? As such, there is no definition of cybercrime that will
    comprehend every aspect of it. We can say that it is a type of crime that involves
    internet fraud, hacking, cyber terrorism, etc., or any illegitimate action that
    is committed by the use of computer or computer devices or networks (Sarmah, Sarmah,
    & Baruah, 2017).


    One of the major categorizations of cybercrime is financial cybercrime. These
    days with an increase in the use of the internet for various purposes has invited
    a new way to an existing crime that is having a direct threat to the finance,
    i.e., money, property of an individual. According to a study by the World Economic
    Forum in 2018, it was observed that cheating and financial crime is an industry
    that is to be considered as a trillion-dollar industry and the private companies
    spent a lot of money for anti-money laundering (AML) which is approximately $8.2
    billion (in 2017) (Hasham, Joshi, & Mikkelsen, 2019).


    Financial computer-related offenses can be defined as the offenses that bear the
    inclusion of systems for the commission of offenses against someone’s property,
    illegally withdrawing the money from someone else’s bank account, and many more
    for their personal use. E-banking, online buying, and other forms of electronic
    commerce are commonly used to carry out'
