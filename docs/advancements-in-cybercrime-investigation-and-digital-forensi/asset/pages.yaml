    # 3.4.1 KEY SPACE


    It is the total attempts required in determining the decryption key by doing an
    exhaustive search of all combinations of keys. Key space and key size are exponentially
    related. Increasing the key size, increases the key space of the algorithm many
    folds. As an example, for a key size of 128 bits, the key space would be 2^128
    even with the use of high performance computers. Therefore, for a cryptosystem
    can sustain a brute force attack with an exceptionally large key size.'
