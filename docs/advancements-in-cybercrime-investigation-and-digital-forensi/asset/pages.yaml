    # 4.1.3 WEARABLE DEVICES FORENSICS


    Wearable device forensics focuses on the data recovery and its analysis from various
    types of wearable devices. The goal of the investigation process is to extract
    and analyze the data that is stored on a wearable device without altering/ modifying
    the data present on the device in a manner that is acceptable by the'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'law (Loomis, 2019). Although the concept of wearable device forensics has been
    around for a while, but it is still in its infancy. Due to the wide variety of
    devices and their varying characteristics, forensic investigations are still challenging.


    Potential information of evidentiary value that can be recovered from wearable
    devices include:


    +   - Global positioning system (GPS);

    +   - Heart rate;

    +   - Biological data;

    +   - Near field communication (NFC) devices;

    +   - Bluetooth information;

    +   - e-mail;

    +   - CDR (call detail records);

    +   - Messages;

    +   - Application data, etc.


    # 4.2 BACKGROUND AND RELATED WORK


    Digital forensics is a branch of forensic science that deals with the type of
    investigation that is conducted when evidence of an event must to be found. It
    can be performed in various ways, such as by analyzing a particular time of day
    or determining if a particular individual has committed a crime. Because of the
    importance of the investigation, digital forensics has grown into a thriving academic
    field. It entails gathering and analyzing digital evidence in order to answer
    questions about a case. In conventional digital forensics, data is acquired in
    the order of volatility, i.e., from the most volatile to the least volatile. Whereas
    data stored on the secondary storage devices have less possibilities to be corrupted
    or lost and may be acquired and recovered later. Digital forensics tools such
    as write blockers are used to prevent any alterations or modifications being made
    to the original evidence connected to the forensic workstation (Yoon & Karabiyik,
    2020).


    Digital forensics research also scrutinizes the development of new models and
    procedures for investigation, which raises new challenges and gaps in existing
    ones. Various studies in digital forensics have attempted to refine the way that
    forensic evidence is stored. Currently, most software platforms such as EnCase,
    Cellebrite UFED or AccessData’s FTK are able to store digital copies of devices
    in various formats. The way these formats are structured can affect the speed
    at which they are processed and the information they'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'contain. Various analytical and investigative models have been developed time
    and again to provide the investigators and law enforcement agencies with a clear
    and concise workflow in order to conduct digital forensics investigations with
    the least amount of error.


    The wearable devices are inextricably conjugated with mobile device forensics
    because these mobile devices typically use an application that manages and reports
    data collected by the wearable devices. There are several studies already been
    conducted that focuses on formulating models for mobile forensic investigations
    depending on how and where data is stored by various applications. Numerous studies
    have also been conducted on the security of various application stores for smartphones.
    These studies were conducted in response to the growing number of security issues
    that are affecting the operation of these apps. Due to the nature of these applications,
    forensic examiners have to deal with the storage and analysis of data in order
    to extract usable data. For instance, social media applications like Facebook
    have to store user data in a way that is difficult to extract. Due to the pervasiveness
    of iOS devices, forensic investigations had been performed on them. Previous research
    found out where and how important portions of records are saved on Apple mobile
    devices. Data from Facebook and Skype have additionally been analyzed to discover
    wherein crucial information inclusive of contacts and login occasions are saved.


    Various studies on wearable tracking devices including Fitbit, Smartwatches, etc.,
    have provided us with a framework for safely extracting data from such devices.
    Although the available tools are still robust and have been approved by authorities,
    they are not yet suitable for extracting data directly from the wearable devices
    as the data extraction from the memory of such devices is a complex procedure
    and requires necessary equipment’s and skills (Yoon & Karabiyik, 2020).


    # 4.3 ADMISSIBILITY OF WEARABLE DEVICES AS DIGITAL EVIDENCE


    Digital evidence is evidence that is collected and transmitted in binary form.
    This includes data such as the timestamp, connection type, IP addresses, user
    profiles, etc. It includes all such information that has evidential value and
    can help the investigators in pinning down the culprit. Every technology innovation
    has some risks associated with it. These wearable devices are no exception. There
    are several challenges associated with wearable devices, particularly when the
    court of law comes into the picture. Although the value'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'of evidence obtained from these devices has been identified as potential evidence
    in several cases previously. Most jurisdictions have specific legal requirements
    for the admissibility of digital evidence in legal proceedings. For example, Sections
    65A and 65B of the Indian Evidence Act (IEA) establish the criterion for the admissibility
    of electronic records as digital evidence in courts. These requirements equally
    apply to all sources of digital evidence including evidence extracted from wearable
    devices (Khairallah, 2018). The requirements included are:


    +   1. **Admissible:** For the evidence to be admissible, it must be related to
    the fact being proved.

    +   2. **Authentic:** For the evidence to be admissible, it should be proven with
    none doubt that the evidence comes from the claimed source. Moreover, it must
    be real and concerning the incident directly.

    +   3. **Complete:** The evidence must be complete, which means it must either
    prove or disprove the consensual fact in the litigation.

    +   4. **Reliable:** To prove the evidence as admissible, there must be no doubt
    about the authenticity or veracity of the evidence. The evidence should be handled
    carefully while maintaining the chain of custody record.

    +   5. **Believable:** The submitted evidence must be clear, comprehensible, and
    easily understandable by the judges (Khairallah, 2018; EC-Council’s Computer Hacking
    Forensic Investigator v9, Module 1).


    # 4.4 METHODOLOGY


    # 4.4.1 DIGITAL FORENSICS INVESTIGATION PROCESS AND ITS IMPORTANCE


    The digital forensics investigation process is a set of methodological approaches
    for preparing for digital evidence investigation including identification, collection,
    and analysis (Karie & Venter, 2015), and managing the case right from the time
    of reporting to the conclusion. Forensic investigations are conducted in various
    circumstances, such as, but not limited to, establishing proof for legitimate
    procedures, and investigating security arrangement infringement. There are a variety
    of strategies and devices utilized for this type of investigation. However, due
    to day-to-day advancements in the digital world, acquiring, analyzing, and preserving
    information in a forensic manner becomes very challenging. This is especially
    so when it comes to'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'extracting data for a trial. There are various proposed models for digital
    forensics investigations but in most of the cases, the model including three investigative
    phases namely, pre-investigation phase, investigation phase and post-investigation
    phase is utilized (EC-Council’s Computer Hacking Forensic Investigator v9, Module
    4).


    # 4.4.2 PROCESS OF WEARABLE DEVICE FORENSIC INVESTIGATIONS


    Generally, the wearable device forensic examination goes through the following
    three investigative phases. This investigative process ensures that the steps
    are repeatable, defensible, reliable, and forensically sound. The step-by-step
    description of investigative phases are detailed in subsections (Figure 4.3).


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_104_0.png)


    FIGURE 4.3 Image depicts phases of investigation involved in wearable device forensic
    investigation.


    # 4.4.2.1 PRE-INVESTIGATION PHASE


    The pre-investigation phase deals with the preparations before the commencement
    of the actual investigation process. The investigators cannot jump into action
    immediately after receiving a complaint or report of a security incident, but
    they have to follow a specific protocol that includes gathering of essential information
    about the incident, e.g., type of incident and obtaining permissions and warrants
    for taking further action. It consists of building a forensic workstation, the
    wearable devices investigation toolkit, the investigation team, getting necessary
    approvals and consent from the relevant authorities and stakeholders. It includes
    the following steps:'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   1. **Preparation:** Completion of the proper intake paperwork as well as
    the chain of custody log.

    +   2. **Reception:** Receiving the wearable device for the forensic examination;
    identifying the device (e.g., make/model and serial number); recording the presence
    of paired and companion devices.

    +   3. **Evaluation:** Setting the goals of the examination; document the physical
    and operating state of the wearable device.


    # 4.4.2.2 INVESTIGATION PHASE


    The investigation phase involves analyzing and securing the evidence collected
    by various means, such as by acquiring and preserving the data collected from
    wearable digital devices. Each step in this process is crucial for acceptance
    of the evidence in a court of law and prosecution of the perpetrators. It includes
    the implementation of the technical skills and expertise to identify and inspect
    the evidence, examine, document, and preserve the findings as well as the evidence
    by professionals trained to analyze wearable digital devices upholding the quality
    and integrity of the findings to the highest level.


    Some noteworthy points to consider before conducting the investigation are as
    follows:


    +   1. **Examination/Investigation Goals:**

    +      - Before an investigator embarks on an examination, they should have a
    clear idea of the goals of the investigation.

    +      - They should have an in-depth technical understanding about the inner
    workings of what is being examined.

    +      - The investigators should have the capability to take a systematic approach
    to examine evidence based on the request made.

    +   2. **Hypothesis Formulation:** In order to successfully carry out a case,
    the investigator must formulate a hypothesis that will prove or disprove the main
    ideas of the case.

    +   3. **Experimental Design:**

    +      - The investigators should first draw up their hypothesis before carrying
    out the experiment. They should then test the methodology as well as the test
    results.

    +      - The test system should have an environment like that of the suspect machine
    to yield accurate results.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 4. Tool Selection:


    +   - Each case is different, and the tools used for it will vary depending on
    the platform and OS used.

    +   - Digital forensics tools can be: hardware or software, commercial or open
    source and designed for specific purposes or with broader functionality.

    +   - No single tool is all-inclusive thus; it is suggested to have multiple tools
    at hand (EC-Council’s Computer Hacking Forensic Investigator v9, Module 4).


    The investigation phase includes the following steps:


    +   1. **Identification:** Identifying the potential data that is of probative
    value and the acquisition method(s) supported by the wearable device as well as
    the paired and the companion devices; determining the forensic equipment and tools
    that are required/supported.

    +   2. **Documentation:** Documenting each detail about the digital crime scene
    and evidence is necessary to maintain a record of all the forensic investigation
    process applied to identify, acquire, analyze, and preserve the evidence. The
    details should include the identification information including make, model, serial
    numbers of the digital evidence, status of the evidence, type of cable/interface
    needed to connect it with forensic workstation, etc. It should also include the
    different steps involved in the forensic investigation. The commonly used methods
    for documentation include photography, videography, and notetaking.

    +   3. **Acquisition:** The investigation and analysis process can have both positive
    and negative impact over the evidential data, and sometimes these processes can
    alter this data in such a way that it is no longer acceptable in the court. Therefore,
    the investigators should make copies of the evidence and work on it to prevent
    any damage to the original data in cases of accidents or mishaps. Data acquisition
    includes bit-by-bit copying of the original evidence using a software or hardware
    tool. The acquired data should be an exact copy of the original evidence. The
    common digital forensic used for this purpose include Cellebrite UFED, EnCase,
    FTK, Magnet Axiom, etc.

    +   4. **Verification:** Or validation of digital evidence is one of the most
    important aspects of digital forensics. It is essential to ensure that the evidence
    is not altered or modified. Validating the digital evidence requires hashing algorithm
    utility, which was developed to create'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'a binary or hexadecimal number, called digital fingerprints, which represents
    the uniqueness of a file or acquired image (Panhalkar, n.d.). Examples of hash
    values include MD5, SHA-1, SHA-256, CRC-32, etc.


    +   5. **Preservation:** It entails securely storing the forensic data as read-only,
    as well as maintaining duplicate copies across multiple systems and storage media.

    +   6. **Data Filtering and Examination:** Data filtering is a technique that
    enables the investigator to sort through all of the information extracted. It
    is utilized to pick a portion of it that investigator would like to review or
    examine. Moreover, the examination involves the assessment of the reliability
    and significance of the data, ascertaining if the data meets the goals and the
    requirements of the examination.

    +   7. **Analysis:** It includes evaluation of the examined data for relevance
    as evidence; understanding, structuring, relating, and reasoning about the data
    from a holistic perspective. The evidence is evaluated based on the type of incident,
    the objectives required to be performed and fulfilled, the loopholes discrepancies
    that exist for incident occurrence, etc. (Panhalkar, n.d.).

    +   8. **Presentation:** Includes preparing and formatting the analyzed evidence.


    # 4.4.2.3 POST-INVESTIGATION PHASE


    The post-investigation phase includes the preparation of reports that details
    all the actions undertaken and findings during the course of the investigation.
    It is important that the report is legally sound, easy to understand and meets
    the requirements of the applicable jurisdiction. It includes the following steps:


    +   1. **Reporting:** Documenting the examiner, date/time, processes/tools, analysis,
    and the results and findings.

    +   2. **Documentation:** Compiling all the examination deliverables (e.g., reports,
    videos, presentations, and exhibits) in legally acceptable formats.

    +   3. **Dissemination:** Distribution of evidence, case reports and deliverables
    to the authorities through forensically sound and secure channels (Loomis, 2019;
    EC-Council’s Computer Hacking Forensic Investigator v9, Module 4).'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 4.5 DATA EXTRACTION METHODOLOGY


    We can extract the data from wearable devices using one of the methods which are
    discussed in succeeding subsections.


    # 4.5.1 MANUAL DATA EXTRACTION


    Manual data collection involves navigating a wearable device via its LCD display
    to inspect the active user content visually, generally capturing screenshots of
    the) display. The content may include pictures, call logs, messages, fitness activities
    and other user-accessible data. Manual data collection methods are limited and
    time-consuming in the amount of data they can provide. Unintentional modifications
    of the system and user data may occur during manual data collection, e.g., inadvertently
    deleting files, modifying timestamps, update metadata, etc. Manual data collection
    should be performed only when more sophisticated collection methods are not available.


    # 4.5.2 LOGICAL EXTRACTION


    Logical data collection involves taking out data using interfaces such as USB
    or wireless in an automated manner in the original format. However, if the device
    encodes the data, encoded data is extracted. The collected data is often stored
    in a readable format in the forensic examination machine, allowing for immediate
    analysis. Additionally, a wearable device may have an associated SDK (software
    development kit) which can be installed on a forensic examination workstation.
    The SDK provides manufacturer-level access to the hardware and software of the
    device via specialized commands.


    # 4.5.3 PHYSICAL EXTRACTION


    Physical data extraction method involves the acquisition of a bit-by-bit copy
    of wearable devices storage using software and hardware techniques. The extracted
    data is stored in a bit stream image file, which may comprise of more than one
    nested system of files which can be mounted on a forensic'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'examination tool for subsequent analysis. Other bit stream images must be processed
    using advanced data reconstruction techniques to obtain individual data files,
    deleted data and fragments. A data reconstruction technique searches for different
    file signatures. Once the file signatures are recognized, the associated data
    is extracted from the bit stream image to produce separate files with their corresponding
    file extensions. After processing the entire binary image for active, deleted,
    and fragmented data, the results may be analyzed by a forensic examiner (Loomis,
    2019).


    # 4.5.4 INVASIVE DATA EXTRACTION


    Invasive data collection involves exposing the internal hardware components of
    a wearable device to enable access to the data and is only used when other methods
    of data collection are ineffective. Such techniques may also be applied to severely
    damaged or inoperable devices or to correlate the data retrieved using other data
    collection techniques. Invasive data collection techniques require specialized
    equipment and training, which may involve soldering wires, removing memory chips,
    repairing damaged hardware and applying cutting-edge computer engineering methods.
    Invasive data collection enables the subsequent use of logical and/or physical
    data collection techniques. An invasive data collection technique is time-consuming,
    but it provides access to data that is otherwise unobtainable (Loomis, 2019; Rainwater,
    2014).


    # 4.6 WEARABLE DEVICE FORENSICS VS. MOBILE FORENSICS (MF)


    A mobile device is typically a device that is created to be carried on the user’s
    body or is reasonably portable and can provide computing and communications functionality.
    It is normally capable of providing access to commercial mobile services. A wearable
    device, for instance, is designed to be carried on the user’s body; it would not
    fall within the mobile device category if it cannot provide access to commercial
    mobile data services (Chauriye, 2016). The data extracted from mobile devices
    are admissible in the court of law as an evidence under certain laws and regulations
    but the admissibility of wearable device’s data as a crucial evidence in court
    still requires an extensive research, which can prove the legitimacy and accuracy
    of the data directly retrieved from such devices.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 4.7 CHALLENGES AND OPPORTUNITIES


    The forensics of Wearable devices is challenging because it requires specialized
    techniques. The challenges include device diverseness, operational, and legal
    functionalities, artifact characteristics, device security, anti-forensic features,
    inadvertent data modifications, and the need of specialized tools and resources
    for forensic analysis (Loomis, 2019).


    # 4.7.1 LEGAL CHALLENGES


    Digital evidences are highly fragile in nature and require utmost care while handling
    and processing, and not every police or law enforcement agency has the necessary
    skills and expertise to properly collect, secure, and store digital data collected
    from Wearable devices, which often leads to data loss or contamination.


    # 4.7.2 OPERATIONAL CHALLENGES


    The time-stamp on the wearable devices can be altered to an incorrect time, which
    will prevent the events from being recorded accurately, and causing an inability
    to correlate with other digital devices. These devices rely upon GPS for data
    transmission and tracking, and the GPS requires a direct communication with the
    satellite, which it is using for data transmission. Therefore, if the GPS signal
    is lost, blocked or jammed due to any of the reasons such as the user is out of
    range, underground or in bad weather conditions, then the data collected will
    no longer be accurate. Moreover, not all devices provide the same functionality
    and interpretation of users’ movement. For example, some device models will not
    distinguish arm movement from actual steps, and hence their data records will
    be unreliable. In addition, this can have an effect on the data collected and
    the reliability of the reports.


    # 4.7.3 MISUSE CHALLENGE


    It is possible that multiple people will be wearing the same wearable device.
    That means the data records from these devices are accurate only if the user is
    wearing it properly. For example, wearing the device on the ankle instead of the
    wrist will produce inconsistent data (Ferrar oa, 2011).'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 4.7.4 DEVICE DIVERSITY


    Wearable devices are ubiquitous and heterogeneous. They have rapid evolution cycles,
    which lead to new models being released by more than a dozen major manufacturers
    every year. The explosion of new devices and models is problematic to forensic
    examiners because each device requires extensive research. Wearable devices also
    lack standardization. Manufacturers leverage diverse hardware components, sensors,
    OS, software applications and file systems. Devices often incorporate specialized
    debugging interfaces, proprietary data formats, support for specific brands of
    companion mobile devices, cloud interoperability and communications mechanisms.
    In order to develop the most accurate and comprehensive forensic capabilities,
    forensic examiners need to conduct extensive research on the various features
    and software versions of devices (Loomis, 2019).


    # 4.7.5 DATA CHARACTERISTICS


    Data stored in wearable devices is in various formats (e.g., databases, raw binaries
    and pictures). Even when data is readable, its meaning may not be apparent, or
    the data might not be accurate. In a criminal trial, sleep data from a Fitbit
    device was determined to be inadmissible due to its inherent inaccuracy. The lifetime
    of data stored on wearable devices is a challenge. Since wearable devices generate
    data continuously and the devices have limited storage capacities, data is overwritten
    or deleted frequently. Data synchronized to mobile devices or cloud servers, on
    the other hand, may last longer. However, additional search warrants would be
    required to obtain the data residing in these platforms. Additionally, wearable
    devices are often designed for single users. However, some wearable devices support
    multiple users, making it important to identify whether or not a particular device
    supports multiple users.


    # 4.7.6 SECURITY FEATURES


    Wearable devices implement security features by design, typically in hardware
    and in the OS. Hardware components may provide protection features such as restricting
    memory readout and bypassing such protection requires advanced techniques involving
    expensive micro-probing stations or focused ion beams to modify fuse bits (Helfmeier
    et al., 2013). Other'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'wearable device security features include secure boot chains, mandatory code
    signing, sandbox environments, dedicated security processors, kernel patch protection
    and data protection (Loomis, 2019). Bypassing such techniques to collect evidence
    requires significant resources and advanced techniques. OS used in wearable devices
    are updated frequently along with updates to core system libraries, utilities,
    and software applications including security patches that address newly discovered
    vulnerabilities which often limit data collection.


    # 4.7.7 ANTI-FORENSICS (AF)


    Wearable devices often incorporate anti-forensic measures to hinder data collection
    and analysis either by obfuscating data using proprietary formats or by obfuscating
    data by XOR-ing it with a key or by using a data encoding such as Base64. Wearable
    devices may support robust encryption algorithms. Data in flash memory or read-only
    memory (ROM) at rest, as well as data in motion between a wearable device and
    a companion device or cloud service may also be encrypted. Wearable devices that
    incorporate open-source data formats and OS may be more susceptible than devices
    without publicly disclosed designs. Open-source data formats enable malicious
    users to create fabricated datasets that might appear to be legitimate. Wearable
    devices with sophisticated anti-forensic features may support secure wiping which
    may be triggered by initiating a particular button sequence on the device during
    the boot process, by failing to enter the correct lock screen pin code or upon
    installing specialized forensic tools. Note that some wearable devices may delete
    user data, but this data can still be recovered via a physical data collection
    technique.


    # 4.7.8 ACCIDENTAL DATA MANIPULATION


    Wearable devices are compact by design. Their touchscreen displays are small,
    and their buttons are close together. A forensic examiner can accidentally interact
    with such a device and contaminate the evidence by introducing new data. Therefore,
    wearable devices should be handled and maintained carefully by forensic examiners
    throughout the investigative process and beyond. These devices should be packaged
    safely during their transportation to a forensic laboratory. At the laboratory,
    the devices should be safely secured using clamps (holders) to mitigate accidental
    user interactions. A'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'best practice is to remove lithium-ion batteries, when possible, to ensure
    that no accidental modifications are made.


    # 4.7.9 FORENSIC RESOURCES AND TOOLS


    Forensic examiners are expected to achieve high case turnover rates. Since wearable
    device forensics is a new practice, forensic examiners typically acquire wearable
    data only from paired mobile devices and cloud service providers. It is relatively
    rare to leverage physical access to wearable devices. Regardless of the source
    of wearable data, the analysis of the data and its significance in forensic investigations
    are not well-established. Other challenges include inadequate personnel training,
    equipment, and tools. Forensic examiners may not be able to replicate techniques
    described in the literature because of their lack of experience or training. Furthermore,
    forensic techniques frequently necessitate the use of specialized equipment and
    software tools that are not readily available. A few forensic tools have been
    developed to automate wearable device data collection and analysis. These tools
    target specific wearable devices (e.g., Shattered developed for Google Glasses)
    (Loomis, 2019; Khairallah, 2018).


    # 4.8 DISCUSSION


    Wearable devices are a new form of technology that could be worn as accessories,
    embedded in clothing, or implanted in humans. Due to their increasing popularity,
    forensic investigators have been working on developing tools and techniques to
    analyze the data stored by these devices. However, the advancement of new devices
    that store such sensitive data has been strenuous to forensic analysts as well
    as the law enforcement agencies. Computers, mobile devices and different types
    of digital data storage devices (e.g., USB drives, thumb drives, etc.), are a
    few common sources of digital evidences; however, it has been proven from a many
    legal cases that wearable devices are becoming more prevalent digital evidence
    source. Wearable devices store immense amounts of user data including the geo-location,
    calories burnt, eating patterns, and sleeping and moving habits; thereby creating
    a detailed record of the users’ day-to-day life. Due to varying reliability and
    accuracy concerns, wearable devices have not been widely used in court proceedings.
    Furthermore, their reliability, verifiability, and authenticity are improving
    with new age technology and data retrieval through various software tools'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'hence, increasing the admissibility of such evidence in legal proceedings.
    Digital evidence such as smart wearable devices hold the potential to be used
    in investigations. Once ascertained that the digital evidence is valid to be used
    as an evidence in the court of law, it may become a crucial breakthrough in cases
    involving wearable devices (Khairallah, 2018).


    # 4.9 CASE STUDIES


