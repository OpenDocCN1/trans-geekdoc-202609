    # 5.4 CYBER FORENSICS TOOLS USED IN INVESTIGATION


    As serious problems such as cyber terrorism, cyber stalking, and spam increase,
    cyber forensic tools can help you investigate these criminal cases, draft evidence,
    and create them. Some of these tools are:


    +   1. **First on Scene (FOS):** It is a basic visual script code. It also works
    with other tools like PS Tools, Login Sessions, FPort, NTLast, PromiscDetect,
    and File Hasher to generate evidence log reports. This can be additionally analyzed
    by forensic professionals to extract important information.

    +   2. **X-Ways WinHex:** Used for low level data processing, file scanning, digital
    camera card recovery, corrupted file system, original file recovery, etc. This
    is a powerful tool used to collect digital evidence.

    +   3. **Rifiuti:** It is a tool that helps you find the last details of your
    system’s Recycle Bin. Helps collect all files that have not been deleted or deleted.

    +   4. **Galleta:** This means “cookie.” Galleta helps you check the contents
    of the cookie file on your computer. Cookie files are temporary internet files
    used to keep their own logs for purposes such as tracking from websites.

    +   5. **Pasco:** This means “ball” in Latin. Pasco helps analyze all searches
    run on your computer. In other words, it is useful for collecting a record of
    internet activity executed on the target computer.'
