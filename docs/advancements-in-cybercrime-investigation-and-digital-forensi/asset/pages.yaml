    # ABSTRACT


    Forensics science provides the information needed for the investigation and evaluation
    for identifying the origin and life history of human beings. Digital forensics
    is a branch of forensics science which investigates the material found in digital
    devices which is related to computer crime. There are different kinds of digital
    forensics that is mobile forensics (MF), social forensics, drone forensics and
    networks forensics. These different kinds of forensics are used to investigate
    and solve the different kinds of cases such as intellectual property theft, industrial
    espionage, fraud investigations, forgeries related matters and Bankruptcy investigations.
    The digital forensics helps to provide the integrity of the computer system, provides
    evidence in the court that leads to punishment of culprit, provides the efficiency
    to track cybercriminals and also helps in protecting the organization’s money
    and valuable time. Here artificial intelligence (AI) and machine learning (ML)
    are combined with digital forensics, which helps in the investigation process
    at different stages of investigation and provides the significant potential for
    the digital investigators.'
  merge: -1
  img_proc: true
