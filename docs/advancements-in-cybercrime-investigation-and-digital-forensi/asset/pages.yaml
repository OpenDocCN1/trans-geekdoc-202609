    # Amarnath Mishra, PhD


    *Professor (Forensic Science) & Director,

    Lloyd Institute of Forensic Science,

    Greater Noida, Uttar Pradesh

    (affiliated to the National Forensic Sciences University,

    University, Gandhinagar, Gujarat), India*


    Prof. (Dr.) Amarnath Mishra has been working as a Professor (Forensic Science)
    and Director at the Lloyd Institute of Forensic Science, Greater Noida, Uttar
    Pradesh (affiliated to the National Forensic Sciences University, Gandhinagar,
    Gujarat), India, since October 2022. Prior to this, he worked as an Associate
    Professor (Forensic Science) at the School of Forensics, Risk Management and National
    Security, Rashtriya Raksha University, Gandhinagar, Gujarat (An Institution of
    National Importance) (Pioneering National Security and Police University of India);
    Ministry of Home Affairs, Government of India; Amity Institute of Forensic Sciences,
    Amity University, Noida, Uttar Pradesh, India; Department of Forensic Science,
    School of Humanities, Arts & Applied Sciences, Amity University Dubai Campus,
    United Arab Emirates; and as an Associate Professor (Forensic Medicine) at the
    Department of Forensic Medicine, National Medical College, Birgunj, affiliated
    to Tribhuvan University; and College of Medical Sciences, Bharatpur, affiliated
    to Kathmandu University, recognized by Nepal Medical Council and approved by the
    Government of Nepal, Ministry of Education. He has over 15 years of experience
    in research, academics, administration, forensic practice, and casework.


    Prof. Mishra has been awarded a PhD degree in Forensic Science with a specialization
    in Forensic and Analytical Toxicology from the Sam Higginbottom University of
    Agriculture, Technology & Sciences, Prayagraj (formerly SHIATS, Allahabad) in
    collaboration with the Central Forensic Science Laboratory, Chandigarh, DFS, MHA,
    Govt. of India. He completed his MPhil degree in Biochemistry with a specialization
    in Forensic Biochemistry from Vinayaka Missions University, Salem, Tamilnadu,
    India. He has completed his MSc degree in Forensic Science with a specialization
    in Forensic Serology & DNA Fingerprinting from the Sam Higginbottom University
    of Agriculture, Technology & Sciences, Prayagraj (formerly AAIDU, Allahabad) in
    collaboration with the Central Forensic Science Laboratory, Hyderabad, DFS, MHA,
    Govt. of India. He has worked as'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Research Scholar for the pilot study on “Non-registration of F.I.R.” at Police
    Stations, conducted by the Bureau of Police Research and Development (BPR&D),
    MHA, Govt. of India. He has qualified UGC-NET Exam. June 2007 for Lectureship
    in Forensic Science.


    Prof. Mishra has supervised three PhD students in the area of issue and perspective
    of DNA typing, method development for the analysis of anaesthetic drugs, and detection
    of fire accelerants in arson cases. He has guided more than 150 undergraduate
    and postgraduate students in various programs, i.e., BSc, BTech, MSc, MBBS, and
    MD, for their major projects and dissertations. He has more than 100 publications
    and attended about 100 national and international events. He has granted/awarded
    four national and international patents.


    Prof. Mishra is a recipient of an Academic Excellence Award. He is an NABL-empanelled
    Technical Assessor for ISO/IEC17025. He is a paper setter and an external examiner
    for various academic institutions and recruitment agencies. He is an editorial
    board member in different reputed national and international journals. He has
    organized more than 15 events.


    Prof. Mishra is a Freelance Forensic Expert and Medico-legal Consultant for the
    Court of Law under section 45 and section 65B of the Indian Evidence Act 1872.
    He has also contributed his knowledge and experiences in TV and radio programs
    as a Forensic Expert & Subject Specialist. He is the founder of Aspire Forensics
    and Amar Educational and Social Welfare Trust. In addition to his above assignments,
    he is serving many professional bodies along with lifetime membership.


