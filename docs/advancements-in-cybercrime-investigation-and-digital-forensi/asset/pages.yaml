  md: '# 10.9.4 THE ISSUES CONCERNING TO BORDERS OF THE COUNTRY


    Criminal law and investigations of a country have always been an issue for national
    sovereignty, “while the protocols applied for internet data transfers are based
    on the most optimal routing meaning that data transfer processes go through more
    than one country (Sofaer & Goodman, 2001, p. 7).” As the cyber world has no specific
    limits, both the offender and the victims of such cybercrime may be situated in
    various jurisdiction, which demands mutual cooperation between the countries concerned
    into an international investigation (Putnam & Elliott, 2001, p. 35 et seq.; Sofaer
    & Goodman, 2001, p. 1 et seq.). Nevertheless, the authorization of the concerned
    government is necessary by the principle of national sovereignty which required
    time to meet basic formalities. The states, which lack proper frameworks for such
    cooperation become a security zone for cybercriminals and, consequently, that
    obstruct the investigation process.


    # 10.9.5 STRONG ENCRYPTION


    Strong encryption is a fundamental element of the digital world which helps to
    secure the protection of the basic fundamental rights (https://economic-times.indiatimes.com/wealth/personal-finance-news/cyber-criminals-stole-rs-1-2-trillion-from-indians-in-2019-survey/articleshow/75093578.cms?from=mdr).
    But at the same time, the effective utilization of the technologies also assists
    the scope for cyber-criminals. An increasing number of “Electronic Service Providers”
    apply encryption by default through their services. However, tools which facilitate
    personal encryption and/or anonymity concerning communications are widely encouraged.
    As a result, the current investigation mechanism, such as the lawful interception
    of communication, are becoming least significant and technically unfeasible.


    # 10.9.6 LACK OF EXPERTISE IN LAW ENFORCEMENT AGENCIES


    Besides this, non-reporting cybercrime, privacy, anonymity, and the development
    of emerging forms of cybercrimes, the inadequacy of techno-legal expert, lawyer,
    and high-tech savvy judicial officers, issues are some of the prominent concerns
    to beat for the appropriate implementation of cyber laws. The function that the
    cyber investigators are bound to play in pursuance of combating cybercrime, is
    impaired with the above-mentioned factors.'
