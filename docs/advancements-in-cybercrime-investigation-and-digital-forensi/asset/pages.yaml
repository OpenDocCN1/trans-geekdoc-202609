  md: 'might be a unique identifier for locating authorization data, or it could be
    self-contained authorization data in a verifiable format (which means the token
    string is made up of some data and a signature). The access token functions as
    an abstraction layer, substituting several authorization constructs (such as username
    and password) with a single token that the resource server recognizes. This abstraction
    facilitates the issue of access tokens that are more restricted than the authorization
    grant that was used to get them, as well as removing the requirement for the resource
    server to understand a broad range of authentication methods. Access tokens can
    come in a number of forms, structures, and methods of use, depending on the resource
    server’s security requirements (e.g., cryptographic properties) (Jones & Hardt,
    2012).


    # 16.6.3.2 REFRESH TOKEN


    Refresh tokens are the credentials required to acquire access tokens. Clients
    receive refresh tokens from the authorization server, which can be used to obtain
    a new access token if the current one becomes invalid or expires, as well as additional
    access tokens with the same or narrower scope that must be approved by the resource
    owner. A refresh token can be issued by the authorization server. If the authorization
    server issues one, the refresh token is included in the access token. A refresh
    token is a string that represents the resource owner’s authorization to the client.
    For the most part, To the client, the string is meaningless. The token is a unique
    identifier that is used to retrieve permission information. Refresh tokens, unlike
    access tokens, are only transmitted to authorization servers and are never forwarded
    to resource servers (Emil et al., 2001).


    # 16.6.3.3 CLIENT CREDENTIALS


    Client credentials could be used as an authorization permit when the permission
    scope is restricted to protected resources under the client’s control or protected
    resources previously set up with the authorization server. Client credentials
    are often used as an authorization grant when the client is operating on its own
    behalf (the client is also the resource owner) or when seeking access to protected
    resources based on an authorization agreement with the authorization server.'
  merge: -1
