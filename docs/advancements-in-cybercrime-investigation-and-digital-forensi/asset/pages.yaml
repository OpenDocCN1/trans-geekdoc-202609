    apps and data (Chen, Pei, Chen, Tian, Kotcher, & Tague, 2014).


    # 16.6.4 PROTOCOL COMPLICATIONS


    Although, with the implementation of the new OAuth Protocol 2.0, simplification
    and speed have improved.


    Nevertheless, numerous constraints of OAuth 2.0 were added into existence:


    1. **Unbounded Tokens:** For each protected resource request in OAuth 1.0, the
    client must provide two sets of credentials: token credentials and client credentials.
    Client credentials are no longer used in the latest version. Tokens are no longer
    restricted to a specific client type or instance.


    2. **Bearer Tokens:** At the protocol level, OAuth 2.0 abolished all signatures
    and encryption. Instead, it entirely depends on the TLS (transport layer security)
    (Jones & Hardt, 2012).'
