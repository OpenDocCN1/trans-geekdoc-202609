  md: '# 1.5 CONCLUSIONS


    The thesis of this chapter can be concluded by stating that acknowledging and
    identification of the problem is the first step to solve the problem. Here, the
    endeavor was to identify and understand the challenges faced by the community
    of investigators, prosecutors, and adjudicators in solving, trying, and delivering
    justice in cybercrime cases. Essentials of cyber forensics, Indian cyber laws,
    various models of cybercrime investigation, and the challenges, in general, were
    discussed, followed by an India-specific discussion. Accordingly, the challenges
    were classified into five categories, namely, crime reporting, first response,
    multiple agencies, technical, and jurisdictional.


    It may be held that, of late, most countries have enacted the laws to administer
    cyberspace but cybercriminals’ technical profile and handsome dividends accruing
    from cybercrimes, criminals are encouraged to espouse the latest technology in
    innovative ways to misuse and abuse it to achieve their vicious goals. Most cybersecurity
    professionals approach cybercrime as a reaction to an incident of cyberattack
    instead of a proactive approach. The research body has suggested the use of machine
    learning (ML) techniques to train the security systems to identify and block malicious
    traffic by launching fake but harmless cyberattacks. This approach works the same
    way as vaccines works in the human body.


    In addition, challenges of law enforcement also assume gravity in the absence
    of a globally accepted description of cybercrime, inadequate access and seizure
    authority to investigators, the difference in investigation procedure followed
    by agencies in different countries, and complex extradition process for cross-border
    criminals. Further, international events need to be organized to provide a platform
    for sharing the best practices in cybercrime investigations.


