- pgno: 80
  md: '# 3.4.2 KEY SENSITIVITY


    The secret or encryption key used in an efficient image encryption approach must
    be sensitive to changes in the secret. For every minor modification in the encryption
    key, the encrypted and/or decrypted image is completely different.


    # 3.4.3 STATISTICAL ANALYSIS


    Investigation of image statistics exhibit connections linking the actual and the
    encrypted image. As a result, an efficient encryption technique requires the image
    being encrypted to differ from the actual image. Various methods are used to see
    if the encrypted image reveals any details about the actual image. Histogram analysis
    and Correlation co-efficient analysis make use of pixels within the actual and
    encrypted image as statistical analysis tools for judging the encryption algorithm
    (Sankpal & Vijaya, 2014). The distribution of pixels at different levels of intensity
    is represented by the histogram of an image. The statistical nature of the image
    may be understood from the image histogram. The encrypted and original image histograms
    are identical, indicating that the encryption algorithm is resistant to statistical
    attacks. Histogram of encrypted image needs to have steady distribution of pixels
    at all the intensity levels.


    # 3.4.4 CORRELATION CO-EFFICIENT ANALYSIS


    Another tool adopted for performing statistical analysis is the correlation coefficient
    (CC). It is an indicative measure of neighboring pixel correlation in all directions,
    i.e., horizontal, vertical, and diagonal of the actual image as well as encrypted
    image. For actual image, the neighboring pixels will have very high correlation
    in all directions with correlation value close to unity. Unlike to this, in encrypted
    images neighboring pixels are highly uncorrelated with correlation value nearly
    equal to zero indicating the good balance of confusion and diffusion process which
    enable in thwarting the statistical attacks. Correlation value close to unity
    of encrypted image implies failure of the algorithm. Correlation value close to
    zero implies the similarity between the actual and decrypted image.


    Cov(x, y) = E(x − E(x)) E(y − E(y))


    r = cov(x, y) / √D(x) √D(y) (3.3)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 3.4.5 INFORMATION ENTROPY ANALYSIS


    For access the ruggedness of the algorithm, additionally entropy analysis is adopted.
    Ruggedness of encryption algorithm refers to the sustaining ability of the algorithm
    for various attacks. This may be measured by performing entropy analysis of the
    encrypted image.


    In general, a system that is truly random generates all symbols with equal probability.
    Original and encrypted image entropies are compared, and it should be close to
    8 indicating stubbornness of algorithm to entropy attack.


    H(m) = - Σ_{i=0}^{2^N -1} P(m_i) log₂[P(m_i)]  (3.4)


    where; P(m_i) is the probability of a pixel, and N is the bit-depth of each pixel.


    # 3.4.6 DIFFERENTIAL ANALYSIS


    It is an indicative measure of sensitiveness of the encryption algorithm for very
    minor changes in the input to the algorithm. If an attacker is able to observe
    drastic changes in the encrypted image by making a minuscule change to the algorithm
    input, then he will able to determine a valid link between the encrypted and original
    images. If the opponent is successful, then the algorithm is not sustainable to
    differential attacks. Differential attacks may be thwarted with tools such as:
    “number of pixels change rate (NPCR) and unified average changing intensity (UACI).”


    The sensitiveness of the algorithm is tested using NPCR and UACI for a one-bit
    modification in the actual image. NPCR is a metric for difference in the pixels
    in total of two encrypted images when their plain images differ by one pixel.
    UCAI gives the measure of average pixel intensity of the number of pixel differences
    between two images of the same category, i.e., two same actual image or the two
    same encrypted images. With a high UACI value, even the tiniest modification in
    the actual image causes the encrypted image to exhibit significant modification.


    In all, if the encryption algorithm exhibits high values of NPCR and UACI, then
    it can sustain any differential attacks.


    # 3.5 IMAGE WATERMARKING


    In the digital era, quick access to the internet and image processing, solitude,
    and security of knowledge are paramount concern. In maintaining the'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'upcoming threats to digital information, Digital image watermarking provide
    aide in tamper resistance, ownership, content authentication and protection of
    information. When implementing a watermarking scheme, different requirements got
    to be considered to support the applications involved. The essential requirements
    of watermarking schemes are imperceptibility, payload, and robustness. These requirements
    play a pivotal function in evaluating watermarking system performance. Often these
    requirements are conflicting, and trade-offs between them are considered based
    on the watermarking system applications. A watermarking scheme is claimed to be
    effective when there’s a balance between these requirements. Research literature
    during this area has discussion of various transformation techniques that satisfy
    requirements of watermarking system. One of the most preferred combinations for
    watermarking process is the “discrete wavelet transforms (DWT) and singular values
    decomposition (SVD)” (Begum & Uddin, 2020).


    # 3.5.1 DISCRETE WAVELET TRANSFORMS (DWTS)


    Discrete wavelet transform (DWT) is a wavelet transform that breaks down a signal
    into wavelets rather than frequencies. In DWT, wavelets are sampled discretely.
    In terms of temporal resolution, DWT outperforms another Fourier transforms such
    as “discrete cosine transform (DCT) and discrete Fourier transform (DFT).” DWT
    captures multiple information, such as time and frequency location. DWT-based
    image watermarking techniques break down the image into different frequency subband
    levels. The sub-bands frequencies cover the entire image spectrum (Begum & Uddin,
    2020).


    # 3.5.2 SINGULAR VALUE DECOMPOSITION (SVD)


    Singular values are the useful tools of linear algebra that finds application
    in various signal processing operations including image watermarking. Singular
    values of any image (of the dimension, i.e., m × n), is given as:


    Image = U * S * Vᵀ  (3.5)


    where; the orthogonal elements are represented by “U and V” and diagonal elements
    by “S.”


    Choice of SVD for image watermarking applications is especially because, they
    represent an outsized portion of the signal energy, are fairly resistant to noise,
    i.e., when a small uncertainty is added to the intensity of'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'the image, there is no significant changes in the image singular values and
    theses values are often used with square and rectangular images. SVD based watermarking
    techniques robustness is found to be fairly good when utilized in combination
    with transform domain techniques (Akshya & Mehul, 2012).


    # 3.6 PERFORMANCE PARAMETERS FOR IMAGE WATERMARKING


    To measure the performance of watermarking algorithms, characteristics of the
    watermarked cover image (CI) is compared with the actual CI in terms of image
    degradation or distortions. This is can be done with various quality assessment
    metrics which broadly fall under two categories: Subjective and Objective evaluation
    metrics. Subjective evaluation involves measuring the variations in statistics
    between the original and watermarked CIs, in terms of visual impairments. Subjective
    evaluation does not have a standardized process. Pooja & Biju (2013) described
    the watermarking process as comprising of distortions and evaluating the same
    by physical observance. Observers rated the impairments on a five scale as: imperceptible
    (value 5), perceptible though not annoying (value 4), slightly annoying (scale
    value 3), annoying (scale value 2) and very annoying (scale value 1). Watermarking
    algorithms with scale value higher than 4, perform fairly with regard to robustness
    and imperceptibility. However, Subjective evaluation process is expensive, tedious,
    time taking and as a result, they are unsuitable for real-time applications. Objective
    evaluation process assesses the standard of the watermarking algorithms by using
    automatic tools such as: “peak signal to noise ratio (PSNR), mean square error
    (MSE), normalized correlation efficient (NCC), structural similarity (SSIM), universal
    quality index (UQI), komparator, reduced reference image quality assessment (RRIQA)
    and C4.” The suggested nested watermarking system is evaluated using objective
    picture quality metrics, namely: PSNR, NCC, and SSIM in this section (Nguyen,
    Marie, & Azeddine, 2010).


    # 3.6.1 MEAN SQUARED ERROR (MSE)


    Error linking the CI and the watermarked image is accessed using MSE. It is defined
    as cumulative of the squared error of the images under consideration, as below.
    An efficient watermarking algorithm exhibits a very small value of MSE:


    $MSE = \frac{1}{N \times M} \sum_{i=0}^{N-1} \sum_{j=0}^{M-1} [X(i,j) - Y(i,j)]^2
    \quad (3.6)$


    where; “M and N” represent the rows and columns of the image.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 3.6.2 PEAK SIGNAL-TO-NOISE RATIO (PSNR)


    The PSNR along with MSE are collectively adopted for comparing the image compression
    quality after the embedding process. The PSNR is a measure of the image’s PSNR.
    The greater the PSNR value for a particular image, the better the watermarked
    image and/or restored image quality.


    PSNR = 10*log(255*255/MSE)  (3.7)


    # 3.6.3 STRUCTURAL SIMILARITY INDEX (SSIM)


    The virtue of watermarking algorithm may be measured using SSIM. It calculates
    the degree of resemblance between the cover and watermarked images. The similarity
    is calculated in terms of image characteristics such as: structure, contrast,
    and luminance.


    SSIM(x, y) = [(2μxμy + c1)(2σxy + c2)] / [(μx² + μy² + c1)(σx² + σy² + c2)]  (3.8)


    where; μx is the average of x; μy is the average of y; σx² is the variance of
    x; σy² is the variance of y; σxy² is the covariance of x and y; c1 = (κ1 L)²,
    c2 = (κ2 L)² two variables used for stabilizing the division for weak denominator;
    ‘L’ is the dynamic range of the pixel values; κ1 = 0.01 and κ2 = 0.03 by default
    (Priya & Vijaya, 2021).


