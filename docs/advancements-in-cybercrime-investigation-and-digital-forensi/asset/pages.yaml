  md: '# 7.2 DIGITAL FORENSICS


    Digital forensics provides means to deal with cybercrimes using technically proven
    systems to exhume “potential digital data” that can be presented in the Judiciary.
    Besides this, it delivers an analytical configuration that empowers criminal detectives
    to bridge a bond between the perpetrator and the offense. Digital forensics is
    the fastest growing scientific discipline which stems from many branches. The
    different branches (https://recfaces.com/articles/digital-forensics#:~:text=Digital%20forensics%20tools%20can%20be%20divided%20into%20several,Mac%20OS%20analysis%20tools%3B%20Database%20forensics%20tools)
    of digital forensics are discussed in subsections.


    # 7.2.1 COMPUTER FORENSICS


    ‘Computer forensics’ specializes in compendium, recognition, conservation, and
    evaluation of records from an individual’s computer, laptop, and storage computing
    devices. A computer forensic expert is primarily implicated in the analysis of
    computer violations. However, their services are often required in civil cases
    pertaining to data recovery.


    # 7.2.2 MOBILE DEVICE FORENSICS


    ‘Mobile Devise Forensics’ specializes in retrieving information’s from cellular
    devices, SIM cards, tablets, GPS devices, game consoles and PDAs. The specialist
    retrieves audial and graphical information’s, call lists and contacts from the
    devices to be served as evidence.


    # 7.2.3 NETWORK FORENSICS


    ‘Network forensics’ specializes in monitoring, registering, and analyzing network
    activities. A network professionals analyzes activities in case of defense contraventions
    and cyber-attacks.


    # 7.2.4 FORENSIC DATA ANALYSIS


    A division of forensics which specializes in analyzing organized and defined statistics.
    An FDA (forensic data analyst) is principally concerned in probing into business
    violations and frauds.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 7.2.5 DATABASE FORENSICS


    A DFA (database forensic analyst) investigates any unauthorized access to a data
    bank and accounts for the alterations made in the data. This division of forensics
    can be used to authenticate business-related treaties and to scrutinize substantial
    monetary misdeeds.


    # 7.2.6 E-MAIL FORENSICS


    An EFA (e-mail forensics analyst) expertise in retrieving pertinent records from
    electronic mail. The retrieved data ranges from the ‘despatchers’ and ‘acceptors’
    identification to the substance of the messages, metadata, timestamps, and sources.
    “E-mail forensics” tools are extensively applied on a company suspected of e-mail
    forgery.


    # 7.2.7 MALWARE FORENSICS


    A specialist in this area detects, analyzes, and investigates various malwares
    to hunt down accused and motives behind the incident. He/she also evaluates the
    harm caused by the attack and determines the malware code.


    # 7.2.8 MEMORY FORENSICS


    ‘Memory Forensics’ or ‘Live Acquisition’ specializes in retrieving data from the
    Random-Access Memory. At present criminals abstain from any digital footprints
    on the hard drives. In cases such as these, ‘Memory Forensics’ aids in tracking
    down the attack and the hacker.


    # 7.2.9 WIRELESS FORENSICS


    ‘Wireless Forensics’ employs specialized instruments and procedures to analyze
    and scrutinize traffic in a wireless world. This branch of Forensics helps in
    analysis when digital violations are committed through the infringement of safety
    conventions in wireless networks.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 7.2.10 DISK FORENSICS


    A Disk Forensics Analyst specializes in retrieving and recovering records from
    the physical storage devices, such as servers, memory cards, external USB sticks
    and flash drives. He/she works in recovering any files pertinent to the investigation,
    analyzes it, and presents as a testimony in the court.


    # 7.3 ONTOLOGY


    It has been observed that during an ongoing “Digital Forensic Investigation,”
    investigators often must deal with new technical and non-technical terminologies.
    This therefore requires an ontological (thefreelibrary.com) point-of-view to determine
    the significance of digital forensic jargons in present digital forensic instruments.
    In the words of Uschold & Gruninger (1996) ontology refers to a mutual appreciation
    and knowledge of some area of concern which is used as a coalescing structure
    in unraveling challenges. Appearing in the journal of Karrie & Venter (2014) the
    concept of Ontology is extensively applied in various areas as a procedure for
    demonstrating and rationalizing about the field information. Thus, it implies
    that the field of ontology has predictably matured to cover disparate fields of
    interest among various stages. Despite, pervasive ontology applications in several
    spheres, the growth and advancement of ontology and their functions in digital
    forensics is an ever-growing need. In a supportive statement Noy & Musen (2004)
    states that ontology has become a semasiological network spine and a universal
    proposition in evidence collection systems that accelerates varied functions.
    It comprises of c an action or process of forming a concepts or ideas of that
    are targeted at coding particular fragments of expertise simultaneously so that
    easy and uncomplicated conclusions can be drawn for solving problem. Besides,
    as per Benjamín, Chandrasekaran & Josephson’s, ontology can be utilized to deliver
    evaluation of the composition of intelligence and understanding beyond the establishment
    of the main frame of any system of information interpretation for that sphere
    (Chandrasekaran, Josephson, & Benjamins, 1999). For reasons such as the ones rendered
    above, it is essential to create ontologies that will classify and distinguish
    the standard expressions in which the combined expertise in this subject can be
    exemplified (Gruber, 1993). The ontological tactics for deciding the meaning of
    “Digital Forensic” terminologies has been divided into four parts exhibited in
    Figure 7.1.'
