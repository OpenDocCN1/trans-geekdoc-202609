    # 11.4 CHAIN OF CUSTODY AND THEIR DIFFERENT PHASES


    Chain of custody involves all the steps and procedure followed from recovery of
    an evidence till its presentation in the court of law. In mobile forensic and
    its related investigation, maintaining chain of custody is the most important
    aspect to maintain the integrity of an evidence. Chain of custody of MF includes
    various phases as in subsections (Kostadinov, 2019).


    # 11.4.1 THE EVIDENCE INTAKE PHASE


    The initial stage of investigation is evidence intake phase, which includes all
    the sort of paperwork or documentation of the type of information the investigator
    is seeking for. It also includes developing objectives for the investigation.


    # 11.4.2 THE IDENTIFICATION PHASE


    The investigator should identity certain details before examining any device like:


    +   - The legal issues associated with the investigation;

    +   - Objectives of investigation;

    +   - Identifying information that needs to be yield from the device;

    +   - Data storage both removable and internal;

    +   - Other potential evidence.


    # 11.4.3 THE PREPARATION PHASE


    After identification, this phase involves preparation of methods and techniques
    that will be used in acquiring data from that particular device basically it is
    the preparatory phase where we identify the techniques that should be used for
    that particular device.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 11.4.4 THE ISOLATION PHASE


    The tendency of mobile to obtain other inappropriate data by connecting with Bluetooth,
    Wi-Fi, or by another means is very high, so in order to get only relevant data
    for investigation, isolation techniques and instruments are used like faraday
    bag.


    # 11.4.5 THE PROCESSING PHASE


    This method is all about acquisition techniques like which method or which technique
    should be used to acquire a particular sort of information in a forensic way.


    # 11.4.6 THE VERIFICATION PHASE


    After the processing phase is completed comes to the verification phase in which
    up to what extent the data is accurate has been verified. There are several methods
    of verifying the data like:


    +   1. Comparing Extracted Data to the Handset Data: This method usually involves
    the comparison of the data to the data displayed on the device.

    +   2. Using Multiple Tools and Comparing the Results: Using different techniques
    to obtain the similar results.

    +   3. Using Hash Values: After acquisition techniques are applied all the data
    like images are hashed so as to ensure there is no any changes in the data and
    whenever that image is open or any changes are made then hash value become different
    this is imp to maintain the integrity of the evidences.


    # 11.4.7 THE DOCUMENT AND REPORTING PHASE


    The documentation plays a major role throughout the case because it helps to keep
    a record of all the events that took place during that course of time. It should
    include the following:


    +   - Date and time of examination;

    +   - Condition at the time of recovering the evidence;'
  merge: -1
  img_proc: true
- pgno: 259
  md: '+   - Photos and individual data;

    +   - Phone power status;

    +   - Model no and name;

    +   - Tools and techniques used for processing.


    # 11.4.8 THE PRESENTATION PHASE


    The last step that comes under chain of custody is the presentation of evidence
    in the court of law. It involves all the evidence linked to the case, forensic
    reports obtained and other clues so as to reach the final conclusion of the case
    and provide justice.


    # 11.4.9 THE ARCHIVING PHASE


    As cases went on to many years before getting a final decision and in the process
    of that it becomes quite a difficult to retain the evidences like images, etc.,
    so as to preserve the data all the images and the data is archived and used as
    and when required.


    # 11.5 PROCESS OF MOBILE FORENSICS (MF)


    Our aim of using MF is to recover, preserve, analyze, and to present the digital
    evidence from a mobile device found at the crime scene. Certain specific rules
    are set out for collection, preservation, and transporting the data obtained as
    evidence (Raghav & Saxena, 2009). Steps of collection and preservation of an evidence
    in MF are as follows:


    +   - Seizure;

    +   - Acquisition;

    +   - Examination and analysis;

    +   - Reporting.


    # 11.5.1 SEIZURE


    Prior to the process of acquisition and examination, seizure of digital evidence
    should be taken as an priority. As this is one of the most important steps which
    influences the other steps such as acquisition, examination, and'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'reporting (Sannella, 1994). Important points that should be followed while
    seizing the mobile evidence. They are as follows:


    # 1. Documentation of the Environment:


    +   - Always take photographs of the evidence along with the surroundings.

    +   - Take all the additional things (cable, charger, hard drive, adapters, docking
    stations, etc.), which the investigator found at the crime scene.

    +   - Do not turn off the mobile phone, collect it as you found.


    # 2. Seizure Isolation Technique:


    +   i. **Faraday’s Bag:** A faraday bag is made up of a double layer of conductor,
    and it is the best method to isolate the mobile phones found at the crime scenes.
    In some cases, mobile found at the crime scene have low battery and in order to
    keep them on and also to maintain their connectivity they are kept in faraday’s
    bag because it has cord with the help of that it awakes the phone.

    +   ii. **Jamming:** This technique is basically used to interrupt connection
    of a mobile phone with other devices. It is done by matching the frequency of
    radio waves of jammer with the device in order to avoid any unnecessary data to
    interrupt in the investigation.

    +   iii. **Airplane Mode:** This mode can be obtained from the mobile setting
    it doesn’t involve any tools and it helps to block any transmission radio signals
    from the mobile phone.

    +   iv. **Enable Stay Awake Settings:** If the device found at the crime scene
    is without a lock we can directly go to the settings and enable stay awake setting
    in order to keep the device on and it utilizes the minimum battery possible of
    the device. Document the state in which the investigator found the mobile as running/not
    running, locked/unlocked, etc.


    # 3. Documentation of IMEI:


    +   - International mobile station equipment identity (IMEI) is used in the smartphones
    as an identifier.

    +   - Always try to obtain the IMEI as it is meant to identify a device in a cellular
    network.


    # 4. Handling Locked Mobile Phones:


    +   - Not to lock the mobile phone, if found to be in unlock state.

    +   - Try to detect the passcodes.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 5. Disconnecting Mobile Device from the Network Connection:


    +   - Put the mobile phone on airplane mode for disconnecting it from a network
    connection.

    +   - Potential use of faraday bag, it will help in draining out the battery from
    the mobile phone.

    +   - Remove the sim card if you cannot be able to access the airplane mode and
    faraday bag (Forman, 2003; Brown, Hua, & Gao, 2003).


    # 11.5.2 ACQUISITION


    Retrieving the data from the mobile device is done by using right passcodes, PIN,
    pattern, etc. Once we have successfully done the seizure of the evidence we never
    work our original evidence we usually make multiple copies to work on it, a process
    referred to as Imaging or Acquisition. Various tools and software such as hard-drive
    duplicating software or software imaging tools, such as FTK Imager, DCFLdd, IX
    imager, Guy Mager, True Back, encase are used for duplicating the data. To prevent
    the original file from tampering it is stored carefully (Yu & Lau, 2005). After
    the proper retrieval of data, analysis of data is done by using appropriate approach
    (Sathe & Dongre, 2018).


    # 11.5.2.1 ACQUISITION TOOLS VENDORS


    +   1. **MSAB:** It is a Sweden-based company which has created a software named
    XRY in 2003 which is used to extract data from mobile phones when they are connected
    to the computers, it can even recover the deleted files. This software is used
    by the army, law enforcement agencies, forensic labs. Its reliability is also
    even checked by many government agencies and data produced from this software
    is also accessible in the court of law.

    +   2. **Cellebrite:** It is an Israeli company which creates software and hardware
    for phone-to-phone data transfer, it also creates backups. It is accessible to
    law enforcement agencies and forensic teams in most of the cases. This company
    was established in 2007 (Sathe & Dongre, 2018).

    +   3. **BlackBag Technologies:** These make software for extraction of data from
    Apple devices. It has software like:'
