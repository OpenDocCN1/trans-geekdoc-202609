  md: '+   3. **Data Extraction:** It is where data is analyzed minutely to recover
    relevant information from data bank (like a database) in a specific manner. Further
    data processing involves data integration, adding metadata and another process
    in the data workflow.

    +   4. **Encryption:** The process of converting information or data into a code,
    especially to prevent unauthorized access.

    +   5. **File Format:** It is a structure by which data is structured in a file.

    +   6. **Forensic Wipe:** It is a confirmable technique used for sterilizing a
    well-defined region of digital media by over-writing each byte with a well-known
    value. This prevents adulteration of data.

    +   7. **Handheld (Mobile) Devices:** These are handy data storage devices that
    deliver digital photography, entertainment, navigation systems, etc.

    +   8. **Hash or Hash Value:** It is a function that can be utilized to navigate
    data of an arbitrary size onto data of a fixed size.

    +   9. **Log File:** It is a record of events, activities, and associated data.

    +   10. **Media:** These are entities on which information can be saved. It includes
    thumb drives, hard drives, floppy discs, CD/DVD, SIM cards, etc.

    +   11. **Metadata:** A set of data that describes and gives information about
    other data.

    +   12. **Partition:** It is the user-defined section of electronic media. Partitions
    can be used to isolate and obscure information in a hard drive.

    +   13. **Source-Code:** A text containing a list of commands to be collected
    into an executable computer program.

    +   14. **Work Copy:** A replication of a tape or records that can be used for
    consequent processing and/or evaluation.

    +   15. **Write Block/Write Protect:** Hardware and/or software methods of thwarting
    alteration of substance on a media storage devise like a CD or thumb drive.'
