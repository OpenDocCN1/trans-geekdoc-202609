- pgno: 246
  md: 'Some of the major challenges which the cyber investigators are facing are discussed
    in subsections.


    # 10.9.1 EXPANSION OF INTERNET USERS


    With the expansion of internet user in people’s everyday life is one of the biggest
    challenges for the cyber world. In the year 2005, the number of people who for
    the first time experienced the internet in an advanced economy exceeded their
    number more than in industrialized states. The enhanced number of internet users
    who were inter-connected through the worldwide connectivity networks signify a
    challenging task for the cyber investigators as one of the main shortcomings which
    enable a chance to the criminals is the “lack of the understanding of individual
    security online along with the application of social engineering techniques (Rash
    et al., 2009)”; and, secondly, “while identity theft, spam, and phishing activities
    can be performed automatically (Berg, 2007; Ealy, 2003) without investing much
    money or effort, it is very hard to automate the process of investigation (Gercke,
    2009, p. 65).”


    # 10.9.2 THE ACCESSIBILITY OF MEANS AND INFORMATION


    The internet was intended as an unrestricted access communication network for
    obtaining information, but this beneficial function becomes a tool in the hands
    of criminals by finding an easy way to gather information to commit cybercrime
    (Richard, 2005). The easy accessibility of various software and equipment are
    allowing the hackers to hack even protected password and increasing the possibility
    of utilizing search engines for unlawful means “(Long, Skoudis, & van Eijkelenborg,
    2005; Dornfest, Bausch, & Calishain, 2006).”


    # 10.9.3 CHALLENGES IN TRACKING THE OFFENDERS


    Several possibilities for concealing identity in the Information and Communication
    Technology and the availability of various methods for unidentified access and
    browsing make it tough for police to trace offenders. Especially where the criminal
    activities become inter-states, it is extremely difficult to investigate.'
