- pgno: 353
  md: 'One of the most major security issues with standard username/password authentication
    is that a user cannot easily remove access or permissions from a third-party application.
    In most cases, users are left with only one option: to reset their password.


    Moreover, if a vulnerability or security bug is discovered in a third-party application
    and made public, the developers of a platform or service like Twitter can (temporarily)
    suspend/revoke/disable that third-party application (OAuth Client) to protect
    all of their users who may be using it until a security patch is released. Another
    security issue with simple authentication is the ability to limit resource and
    information access. There’s no way to limit how much data the third-party program
    has access to. It’s either everything or nothing.


    Users want and deserve the option to grant selective access while also having
    the ability to revoke any unauthorized access at any time without having to enter
    their password. Developers want to give their users this functionality and give
    them access to and from a range of popular web services and platforms, but there
    are so many distinct authentication and authorization protocols that it’s difficult.
    OAuth provides a standards-based solution to the table, which all community developers
    can and have accepted. It’s the first step toward a unified, standardized specification
    for password-free authorization in web, desktop, and mobile apps (https://medium.com/security-operations/what-is-OAuth-and-why-should-i-use-it-5aa2f27ce387).


    # 16.6 SYSTEM ARCHITECTURE AND DESIGN


