- pgno: 41
  md: 'organization [for a work-related cybercrime being reported by an employee],
    a military police officer [for an army sepoy], or even a private investigator,
    so entitled under law of land. But notwithstanding who is the first responder,
    the procedure of collection of evidence needs to be valid and admissible in a
    courtroom (UN, 2000).


    Hinduja (2007) has emphasized the profile of the officer who responds first to
    a cybercrime report. (S)he is entitled the critical importance, for, very often
    than not, the cybercrime evidence is intangible. It is paramount that the data
    stored on a mobile phone, a computer, a network device, or removable media are
    not deleted or changed in the process. Even the powering down of the gadget can
    alter the important attributes of the files such as the date and time of the last
    modification or last access. Any investigative experimentation with such intangible
    evidence must be done with a copy of the evidence so that the public prosecutor’s
    charge(s) and the veracity of the evidence are not challenged during prosecution.
    Accordingly, to defend the prosecutor’s stand, the first respondent officer must
    exercise due care while examining the crime scene. The following challenges have
    been assorted from the viewpoint of the first responder:


    +   - Identification of electronic evidence relevant to the prosecution of the
    crime;

    +   - Collection of electronic evidence without causing any change to the evidence;

    +   - Preservation of electronic evidence to support the claim of prosecution;

    +   - Examination of electronic evidence to conclude the findings of the investigation;

    +   - Documentation of complete investigation of cybercrime.


    # 1.4.3 CHALLENGES RELATED TO THE MULTIPLICITY OF AGENCIES


    In several jurisdictions, multiple agencies may be entrusted with the investigation
    of the same cybercrime. The individual agencies involved in the investigation
    of cybercrime depend on the type of cybercrime being investigated. In India also,
    there are multiple central and state bodies that deal with cybercrimes, and each
    has a different reporting structure. Different central government ministries and
    departments thereunder deal with different aspects of cybersecurity. A description
    of the agencies involved in security against cybercrimes follows in Table 1.9.'
