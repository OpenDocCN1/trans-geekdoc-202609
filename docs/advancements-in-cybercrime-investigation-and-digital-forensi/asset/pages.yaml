  md: '# 2.1.3 CLUSTERING


    Clustering is an unsupervised ML model which takes general patterns from a dataset
    even though there is no labeling in datasets. Groups of similar events which constitute
    a cluster as they share common features and define a particular pattern. In cyber
    security clustering is used for forensics analysis, anomaly detection, for the
    analysis of malware, etc. Some of the ML clustering algorithms like K-means, K-Medoids,
    DBSCAN, Gaussian Mixture Model, Agglomerative clustering are used in cyber security
    (Sharma et al., 2018).


    # 2.2 LITERATURE SURVEY


    Shailendra Singh et al. (2009) has introduced a method for ensemble approach feature
    selection of cyber-attack dataset. They used a dataset called DARPA KDDCUP99.
    This consists of two phases. Phase one is filter phases that are used to select
    the information that has the highest gain and also has appropriate guidance for
    the sake of initialization for the search process for the phase of rapping output.
    These kinds of outputs are the final subset features. The feature subset of final
    is then passed by using some supporting algorithms such as K-NN classifier. This
    algorithm helps for the classification of different kinds of attacks.


    Quamar Niyaz et al. (2016) has worked on network intrusion detection systems (IDS)
    with the help of deep learning approach for efficient and flexible NIDS. Here
    they used NSL-KDD datasets which is benchmark dataset for network intrusion. They
    utilized a validation method called 10-fold cross in order to train a data for
    the evaluation to classify accuracy. They used STL (self-taught learning) for
    the classes like two classes, five class and 23 class. They made a comparison
    on the performance with the regression called SMR (soft max regression) without
    any feature learning. By comparing STL gave a good classification accuracy rate
    of around 98% compared to all other types of classification.


    Govindarajan et al. (2009) introduced a new K-NN classifier and applied it on
    IDS. They evaluated performance based on Run time and Error rate for malicious
    and normal datasets. The new K-NN classifier gave more accurate accuracy compared
    to existing K-NN classifiers.


    Mohammadreza Ektela et al. (2010) used two techniques for intrusion detection
    in networks that are classification tree data mining (DM) and SVM techniques.
    They made a comparison with C4.5 and SVM. By comparing these two algorithms C4.5
    algorithm gave the best performance'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'for identifying the rate and false alarm rate compared to SVM. In case of U2R
    attack SVM gave good performance.


    Deepthy et al. (2010) implemented various types of DM techniques for detecting
    the intrusions. They have given a brief description about the functioning of IDS
    classifications and how this kind of classification is working for the IDS. For
    the large amount of traffics which is caused by the networks by comparing classification
    the clustering will be more efficient for the identification of intrusions. The
    main aim is for classification purpose, a huge bulk of data is required by comparing
    with clustering.


    Amudha et al. (2011) introduced DM techniques for intrusion detection. They used
    KDD CUP’99 as datasets. They evaluated the performance of DM classification algorithms
    such as C4.5, Naïve Bayes, NBTree, and Random Forest. In this work they mainly
    gave importance to correlation feature selection (CFS) measures. Based on the
    accuracy and detection rate NB tree and Random Forest is best outperformance by
    analyzing with other two algorithms.


    China et al. (2017) implemented three techniques for DM, such as SVM, Ripper rule
    and C5.0 tree for the identifications of intrusions for the identifications of
    intrusions. By experimentation result, the C5.0 decision tree gave more efficiency
    compared to other algorithms. All three DM techniques are given higher accuracy
    around 96% detection rate.


    Nahla et al. (2004) used algorithms for intrusion detection, i.e., Naive Bayesian.
    They considered the dataset called KDD’99 intrusion. Finally, they compared winning
    strategy, decision trees, and Naive Bayes. Naive Bayesian gave good accuracy compared
    to the other two algorithms.


    Rahul et al. (2018) focused on predicting the attacks on network IDS. They used
    KDDCup-99 and epochs datasets for training and benchmarking the networks. In order
    to perform comparison training is done by using the same datasets with several
    classical algorithms and using deep neural networks (DNNs) of layers which range
    from 1 to 5. By considering the result the DNN of 3 layers gave the best performance
    compared to classical ML algorithms.


    Praneet et al. (2021) introduced a method for edge node detection against multitudes
    of cyber-attacks on the internet of things (IoT). This process can be done with
    the support of deep learning methods. The evaluation of the model is done by deploying
    actual edge nodes with the representation of Raspberry Pi by using current cyber
    security datasets, i.e., UNSW2015. By comparing the convolution Deep learning
    method techniques from the previous result, this experimental result gave the
    best accuracy of 99% approximation.'
