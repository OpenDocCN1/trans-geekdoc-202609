    the authorization code in compliance with the user permissions to the client,
    and the client use the redirection URL, authorization code and Access token to
    process the requests to the resource server.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_358_0.png)


    FIGURE 16.3 OAuth 2.0 client-server authorization flow.


    +   1. **Resource Owner Password-Based Grant:** With this grant type, a resource
    owner’s login and password may be exchanged for an OAuth access token. Mobile
    applications produced by API providers, except for extremely trustworthy customers,
    are permitted to utilize it. While the client may still see the user’s password,
