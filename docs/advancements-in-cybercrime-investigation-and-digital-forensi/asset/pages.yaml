  md: '# CHAPTER 11


    # Tools and Protocols for the Analysis of Mobile Phones in Digital Forensics


    AKANKSHA,¹ VAISHALI TYAGI,¹ CHINTAN SINGH,²

    SOURABH KUMAR SINGH,² and AMARNATH MISHRA³


