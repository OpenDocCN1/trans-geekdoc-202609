- pgno: 139
  md: '# CHAPTER 6


    # Clustering and Classification of Digital Forensic Data Using Machine Learning
    and Data Mining Approaches


    E. FANTIN IRUDAYA RAJ


    *Assistant Professor, Department of Electrical and Electronics Engineering, Dr.
    Sivanthi Aditanar College of Engineering, Tamil Nadu, India*


    # ABSTRACT


    Nowadays, crime investigators collect a more significant amount of potential digital
    evidence from suspects, necessitating the use of digital forensic techniques.
    This evidence is commonly in the form of mostly unlabeled and unstructured data
    and seemingly unrelated information. Manually sorting and comprehending this type
    of data is a significant challenge, sometimes even a psychological burden, or
    at the very least, a prohibitively time-consuming activity. As a result, forensic
    research should investigate and leverage the development of robust and autonomous
    analysis tools for investigators confronted with this situation. With the advent
    of machine learning (ML) algorithms and data mining (DM) Tools, numerous autonomous
    systems are realized in the present modern world. The method of extracting usable
    information, patterns, and trends from a given data set is known as DM. The aim
    of DM is to make data-driven judgments from extensive data collection. ML is the
    process by which computers learn how to perform tasks without being explicitly
    programmed to do so. ML is trained using a trained data set, which teaches the
    computer to make decisions and find new patterns in the new data set. By adopting
    these two techniques in digital forensic research,'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'the investigators can easily classify and cluster the digital data and make
    some quick decisions. It is also very helpful in creating autonomous forensic
    analysis tools for more accurate and quick analysis. The present work discusses
    various ML techniques and DM tools employed in digital forensic research to more
    effectively cluster and classify digital forensic data.


    # 6.1 INTRODUCTION


    Computers and networks have become so established in our culture, so much a part
    of our daily lives, that digital evidence will almost certainly be used in any
    investigation or legal dispute. Electronic discovery has become increasingly common
    in property litigation, and countries are changing their judicial systems to handle
    electronic evidence. In addition, computers are increasingly used in crimes such
    as homicide, terrorism, drug trafficking, fraud, and child abuse. In investigations
    of breaches into government and corporate information technology systems, digital
    evidence is becoming more crucial, yet obtaining it is becoming more complex as
    criminals get more adept at obscuring their tracks. Lawbreakers are growing more
    familiar with digital investigative and forensic skills, and they are increasingly
    employing networks and computers to commit crimes. A few are working on “anti-forensic”
    tactics and technology to hide their actions, erase forensic evidence, and undermine
    digital investigators in general.


    Practitioners and researchers in the field of digital forensics have made great
    progress in recent years. Our technology expertise has grown, and now we’ve earned
    the essential experience to improve our techniques. We overcome key technical
    obstacles, facilitating practitioners’ access to digital evidence easier. New
    forensic methodologies and techniques are being developed to aid network traffic
    analysis, remote system inspection, and forensic capture of volatile data. These
    breakthroughs hold great promise, but they also lay new digital investigations
    and forensics requirements, shifting the field’s topography and allowing new approaches
    to flourish.


    Today’s crime investigators collect an increasing amount of potential digital
    evidence from suspects, necessitating the use of digital forensics procedures.
    Unfortunately, Digital evidence is frequently in the form of mostly unlabeled
    and unstructured data and information that appears to be unrelated. Manually organizing
    and comprehending this type of data is a significant challenge, sometimes even
    a psychological strain, or at the very least an activity that takes an excessive
    amount of time. As a result, forensic research should'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'investigate and use cluster algorithms and unsupervised machine learning (ML)
    capabilities in order to develop independent and robust analysis tools for criminal
    investigators confronted with this predicament.


    Data mining (DM) tools and ML (ML) methodologies have grown significantly and
    become more common in recent years. DM is a technique for extracting useful information,
    patterns, and trends from a set of data. The primary purpose of DM is to make
    data-driven decisions from large data collections. The process by which computers
    learn to do tasks without being explicitly programmed is known as ML. A trained
    data set is used to train ML, which teaches the computer how to draw conclusions
    and discover hidden patterns in new data. As a result, investigators can efficiently
    classify and cluster digital data and make speedy findings using these two digital
    forensic research strategies. The present work explores the various ML and DM
    strategies used in digital forensic research to better cluster and classifies
    digital forensic data.


    # 6.2 REVIEW OF LITERATURE


    Forensic information stored and created on computers is a double-edged sword,
    giving solid evidence in a wide range of investigations while also presenting
    complexity that can trip up even the most experienced investigators (Casey et
    al., 2009). Basic questions regarding a crime can be answered using digital evidence,
    such as who interacted with whom (linkage), who was accountable (attribution),
    when something occurred (sequencing), and where something came from (origins and
    source evaluation) (Kim et al., 2021). Simultaneously, the complexity of computer
    systems needs knowledge that individual components of digital evidence may be
    subject to alternative interpretations and that further evidence may be required
    to get the desired outcome (Razaque et al., 2021). Therefore, forensic investigators
    must regularly understand and use the scientific process for making the most of
    digital evidence. In combination with digital forensics technologies and methods,
    the scientific technique enables us to adapt to a wide range of scenarios and
    requirements while also ensuring that the results obtained are factually sound
    (Soltani et al., 2021).


    The practitioner’s thoroughness, expertise, experience, knowledge, and, in some
    cases, curiosity are all crucial factors in digital evidence forensic analysis
    (Rafique et al., 2013). Although each forensic investigation will change in certain
    ways depending on the resources, objectives, data set, and'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'other circumstances, but the basic procedure remains the same (Chopade et al.,
    2021). Compared with traditional crimes, modern digital crimes have electronic
    exchange tools, money laundering, and leftovers. All these are put together to
    make a crime investigation more difficult for the investigators. In addition,
    digital forensic investigators have access to a wide variety of tools, both open-source
    and commercial. The main goal of the investigation is to collect the evidence
    using acceptable methods to make it accepted and admitted from a legal point of
    view (Sindhu et al., 2012).


    Artificial intelligence (AI) is a well-established field of current computer science
    that may help solve complex and computationally huge issues in a reasonable amount
    of time (Mitchell et al., 2010). Digital forensics is a rapidly expanding area
    of computing that frequently requires the cognitive assessment of large amounts
    of complicated data (Costantini et al., 2019). As a result, AI looks to be a viable
    technique for addressing many of the current digital forensics challenges (Sikos
    et al., 2021). DM is a method for extracting meaningful facts, patterns, and trends
    from data collection. The primary goal of DM is to make data-driven judgments
    based on big data sets (Ageed et al., 2021; Tan et al., 2016). DM is also called
    knowledge discovery in database (KDD). It is one of the most important approaches
    for assisting entrepreneurs, researchers, investigators, and individuals in extracting
    vital data and making quick decisions (Nirkhi et al., 2012; Tallón-Ballesteros
    et al., 2014). Thus, DM techniques can be applied in digital forensics and help
    crime investigators investigate digital evidence.


    ML employs a set of algorithms to analyze and interpret data, learn from it, and
    make the best judgments possible based on those learning (Usman et al., 2021;
    Raj et al., 2013; Qadir et al., 2021). Deep learning (DL), on the other hand,
    divides algorithms into numerous layers to build an “artificial neural network
    (ANN).” This neural network is capable of self-learning and making intelligent
    decisions (Ulloa et al., 2021; Chouhan et al., 2021; Shen et al., 2021). Moreover,
    ML and DL are both subsets of AI. Using these two methodologies in digital forensic
    investigation, investigators can efficiently classify and cluster digital data
    and arrive at quick conclusions.


    We may infer from the literature that digital forensics deals with a substantial
    amount of data on a daily basis. Therefore, investigators desperately need automatic
    forensic analysis technologies for more accurate and speedy analysis. They can
    readily identify and cluster the massive amount of digital data and draw speedy
    conclusions using DM and ML algorithms. The present study gives insight into the
    important DM and ML approaches utilized in forensic analysis.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 6.3 DIGITAL FORENSIC TOOLS


    Digital forensic tools play a vital role in data collection for forensic analysis.
    These tools are divided into several categories, so the tool you choose will determine
    where and how you intend to utilize it. Here are some broad categories to give
    you a sense of the wide range of digital forensics tools available (Richard et
    al., 2006): (a) digital image forensics; (b) computer forensics; (c) disk and
    data capture; (d) file analysis; (e) memory forensics; (f) network forensics;
    (g) internet browsing analysis; (h) video/audio forensics; (i) E-mail analysis;
    and (j) database forensics. While this is not a full list, it provides an overview
    of what digital forensics tools are and what they can be used for. In addition,
    many tools are occasionally packed together into a single toolkit to help you
    tap into the possibilities of related tools. It’s also worth noting that the lines
    between these groups can blur depending on the skill set of the employees, contractual
    requirements, current regulations, equipment availability, and lab circumstances.
    Regardless of these differences, digital forensics technologies provide a large
    array of options for gathering data throughout an investigation. It’s also worth
    noting that the digital forensics arena is constantly changing, with new tools
    and capabilities being introduced on a regular basis to keep up with device updates.
    Figure 6.1 depicts the Digital Forensic process in detail.


    The digital forensic process (Kohn et al., 2013) involves: (i) identification;
    (ii) preservation; (iii) collection; (iv) examination; (v) analysis; (vi) interpretation;
    (vii) documentation; and (viii) evidence presentation. The basic behind all these
    steps is a proper data forensic tool to collect digital evidence and manage the
    huge volume of collected data. It isn’t easy to choose the best tool for our needs
    among so many possibilities. When making a decision, there are a few things to
    consider: (a) skill level; (b) output; (c) cost; and (d) focus are the factors
    to take into account. When it comes to choosing a digital forensics tool, the
    skill level is crucial. Some tools require rudimentary expertise, while others
    may necessitate extensive knowledge. A good rule of thumb is to compare your talents
    to what the tool requires, so you may select the most powerful tool you can use.
    Because tools are not all treated fairly, outputs will vary even within the same
    category. Some tools will only return raw data, while others will generate a complete
    report that can be shared with non-technical personnel right away. In some circumstances,
    raw data is sufficient because your information will be processed further anyhow;
    however, in others, having a structured report would make your task easier. Cost
    is, of course, a major consideration, as most departments are'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'on a tight budget. One thing to bear in mind is that the cheapest tools may
    not have all of the functionality you desire because that is how developers keep
    costs down. Instead of choosing a tool only based on price, consider finding a
    balance between price and features. Another important consideration is the tool’s
    focus area, as different jobs normally necessitate distinct tools. Tools for evaluating
    a database, for example, are significantly different from those required to study
    a network. Before purchasing, it is best to make a comprehensive list of feature
    requirements. As previously stated, some tools may perform many functions in a
    single kit, which may be a more cost-effective option than purchasing separate
    equipment for each operation. These tools will acquire a vast amount of digital
    data, which will be stored in a cloud database. From the investigator’s standpoint,
    there is critical to evaluate such huge amounts of data and uncover meaningful
    patterns and information. DM and ML techniques are being used to accomplish this
    goal.


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_144_0.png)


    FIGURE 6.1 Digital forensic process.'
  merge: -1
  img_proc: true
