    # Chandra Singh


    Assistant Professor, Department of Electronics and Communication Engineering,
    Sahyadri College of Engineering & Management, Karnataka, India


    Chandra Singh is an Assistant Professor at Sahyadri College of Engineering and
    Management, Karnataka, India. He has co-authored a textbook titled Survivability
    Techniques in Optical Network, published by Studiuim Press. He has published more
    15 papers indexed in Scopus & Web of Science'
