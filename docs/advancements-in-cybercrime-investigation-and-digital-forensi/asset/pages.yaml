    # 10.10 CONCLUDING REMARKS


    In the final analysis, the time has come for the INTERPOL and police force in
    national level to renovate and reform investigating mechanism for the successful
    trial of cybercrime case. Prompt reaction to the Interpol directions and requests
    for bilateral treaties, mutual cooperation between the countries regarding cyber
    forensic technology and more inter-country training programs are some of the suggestive
    measures to curb the jurisdictional issues. In some situation, when it is tough
    for the police to investigate cases, they can take the assistance of private agencies
    having more expertise with cybercrime investigations. This way the burden of the
    police department can be minimized and better result better performance due to
    expertise. In the United States, a private agency, “identity ecosystem steering
    group (IDES)” has been established to support the “National Strategy for Trusted
    Identities in Cyberspace (NSTIC)” (Lawnn.com., 2021). The outcome of various experimentation
    lead to the conclusion that, the transnational nature of cyberspace, the strategy
    calls for global cooperation and state authorities to take responsibility, collaborate,
    and communicate with industry and academia.'
