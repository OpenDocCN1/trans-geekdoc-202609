  md: '# 10.8.1.1 MINISTRY OF ELECTRONICS AND INFORMATION TECHNOLOGY


    This is one of the prime government bodies towards the successful application
    of the IT Act. The Ministry is accountable to issue suitable directions, rules,
    and regulations on account of the Central Government for the effective implementation
    of the IT Act. The Ministry also functions as an appointment authority for the
    smooth functioning of the IT Act (Meity.gov.in., 2021).


    Under Section 69 of the IT Act authorizes the Central Government to:


    > “Order or give directions to any agency of the government to interpret, monitor
    or decrypt any information received or stored through any computer source (IT
    Act, 2000; Section 69). Issue direction for blocking of access by public any information
    generated, transmitted, received, stored or hosted in any computer resources (IT
    Act, 2000; Section 69A(1)). Prescribed procedures and safeguard for blocking access
    to any information” (IT Act, 2000; Section 69A(2)).


    # 10.8.1.2 INDIAN COMPUTER EMERGENCY TEAM


    The IT Acts authorizes the “Indian Computer Emergency Team” to act as the national
    agency for incident response. They are performed by the team (http://202.62.95.70:8080/jspui/bitstream/123456789/13788/1/Module%2020%3%20%26%204.pdf):


    > “Forecast and alerts of cybersecurity incidents, Collection, analysis, and dissemination
    of information on cyber incidents, Issue guidelines, advisories, vulnerability
    notes and white papers relating to information security practices, Emergency measures
    for handling cybersecurity incidents, procedures, prevention, response, and reporting
    of cyber incidents.”


