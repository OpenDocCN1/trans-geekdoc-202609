    +   3. **JTAG Method:** It helps us to recover data from all the different types
    of software this method is used when the device is damaged or corrupted. This
    is done via connecting device with TAPs (test access ports) that can obtain raw
    data from the device.

    +   4. **Hex Dump:** It is similar to JTAG that can recover raw data which is
    present in the flash memory. But the major difference between the two is that
    the result obtained in this method is in the binary form which later need to be
    translated into the original data.


    # 11.8.2 INVASIVE METHODS


    +   1. **Chip-Off:** It is an expensive method of extracting data. In this method
    first chip is removed from the device and under investigation the data is recovered
    the data obtained through this method is raw data when which is later on decoded
    and analyzed. This method is only advisable to use when other non-invasive methods
    have already been applied to extract data.

    +   2. **Micro-Read:** This method is more technical because in this method with
    the help of microscope, data is meant to be located on the chip with the help
    of gates. It requires high expertise to exercise this method. It is highly expensive
    and time-consuming and is only done in cases of national security.


    # 11.9 MOBILE FORENSIC CHALLENGES


    As MF has helped us to solve many a number of cases, but it has its limitations
    too; in some cases, because of certain factors, it is quite difficult to obtain
    information, and this is because of certain challenges that every examiner faces:


    +   1. **Hardware Differences:** Because of increasing advancement in hardware,
    it becomes difficult for the examiner to adapt all the types of hardware present
    in the market because every hardware has different features and it becomes quite
    difficult for the examiner to testify them.

    +   2. **Mobile Operating System (OS):** Just like hardware every device has its
    own mobile OS and these systems has their own security issues which also create
    hindrance in testifying them.'
