  md: '# 7.5 TYPES OF DIGITAL FORENSICS INVESTIGATION


    ![](img/46a7ed74d391bf69db3c36e9484e1be4_170_0.png)


    # 7.5.1 PUBLIC SECTOR INVESTIGATION


    These are investigations performed against alleged individuals to uncover the
    scene of crime. Normally, government organizations perform such types of inquiries
    under criminal investigations.


    # 7.5.2 PRIVATE SECTOR INVESTIGATION


    These are investigations performed against violations associated to office and
    corporate. Any breach of the provisions and guidelines of private sectors falls
    under this investigation.


    # 7.6 OBJECTIVES OF DIGITAL FORENSICS


    ‘Digital Forensics’ safeguards and strengthens digital security in the private/
    public sector and supports investigators to investigating criminal cases (https://recfaces.com/articles/digital-forensics#:~:text=Digital%20forensics%20tools%20can%20be%20divided%20into%20several,Mac%20OS%20analysis%20tools%3B%208%20Database%20forensics%20tools).
    The essential objectives include:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   - Expediting the retrieval, evaluation, conservation, and protection of
    the information. It helps in preparing digital proof for presentation in the court.

    +   - Ensuring proper implementation of all the essential procedures of assembling
    proofs as the digital data must not be tainted.

    +   - Recovering erased or concealed data from any digital devices if the data
    is specifically important for the case.

    +   - Aiding in the identification of a suspect and instituting a purpose for
    the felony.

    +   - Producing a digital forensic report for swift investigation.


    # 7.7 ALGORITHM OF INVESTIGATION


    The inquiry procedure in digital forensics is a stepwise technique, carried out
    diligently to guarantee that no original evidence is ruined in the course of action
    while preserving the chain of custody (http://www.forensicscience-simplified.org/digital/DigitalEvidence.pdf).
    Digital investigation of such a nature incorporates an algorithm which commences
    from retrieval and analysis of the data to a probable source of proof acceptable
    in the court (Karie & Venter, 2012).


    The algorithm for the digital forensics’ investigation procedure is as in Figure
    7.3.


    # 7.8 DIGITAL FORENSIC TOOLS


    Digital Forensic Tools (https://www.guru99.com/computer-forensics-tools.html#:~:text=Best%20Computer%20Forensics%20Tools.%201%201%29%20ProDiscover%20Forensic.,4%204%29%20PALADIN.%205%20%205%29%20EnCase.%20More%20items)
    are the digital modes and methodologies that assist to protect, detect, obtain,
    and document digital evidence for legal actions. Besides, making the digital forensic
    procedure easy and straightforward, they also provide complete reports for legal
    actions.


    The subsequent issues should be considered while selecting a digital forensic
    instrument:


    +   - Protection;

    +   - Assistance for numerous platforms;

    +   - Customer-friendly application;'
