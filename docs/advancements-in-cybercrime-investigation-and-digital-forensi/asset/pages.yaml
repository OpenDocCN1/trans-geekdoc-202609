    # 3.10 CONCLUSION


    Security contravention has been of paramount aspect in designing security measures
    for transmitting vital information over open networks. When information is being
    shared over open networks, integrity, and confidentiality have to be maintained.
    Fusion of security mechanisms such as encryption and watermarking were explored
    for protection of vital information. In the implemented algorithm, one image is
    embedded into another image. Embedded image is encrypted to provide additional
    security. Fusion algorithm implementation was discussed with performance parameters
    used for evaluating the same. Implemented fusion algorithm was able to sustain
    statistical and differential attacks with 86% NPCR and 31% UACI. The watermarking
    also exhibited good imperceptibility. In the future, this algorithm may be extended
    for multiple watermarks being embedded into a single CI.


