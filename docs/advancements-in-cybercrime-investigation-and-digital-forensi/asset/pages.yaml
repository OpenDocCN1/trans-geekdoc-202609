    +   - State and public-sponsored research and development projects in cybersecurity
    are not up to the mark.

    +   - Law enforcement personnel including public prosecutors and judiciary are
    not well trained to address cybercrimes.

    +   - Prevailing cybercrime investigation protocols are quite up to mark to investigate
    transnational cybercrimes.

    +   - Budgetary allocation for cyberspace security at local, provincial, and union
    levels are dismally low.


    Ajayi (2016) has discussed several challenges faced by mankind while dealing with
    cybercrimes:


    +   - The identity of cybercriminals is rather difficult to establish, for there
    is no prerequisite of disclosing the real identity and location of the user for
    using the Internet.

    +   - Jurisdictional challenges are faced in the trial and adjudication of cybercrimes,
    for the principles of sovereignty and territorial integrity restrict the scope
    of laws to lands.

    +   - Extradition process-related challenges are not unique to the deliverance
    of justice for criminal acts culpable in cyberspace only, but unlike traditional
    crimes, cybercrimes could be transnational even the criminal without knowing it.

    +   - The nature of evidence applicable to cyberspace is volatile, easy to alter,
    and un-established acceptability in courtrooms.

    +   - Owing to the complexity of the investigation process and the degree of technical
    expertise required, the cost, time, and efforts spent in cybercrime investigation/prosecution
    are exorbitant.

    +   - In several jurisdictions, the legislative framework to investigate and adjudicate
    the cybercrimes are inadequate, ineffective, and out of sync with new developments
    in cyberspace.

    +   - International legal mechanisms to investigate and try the cybercrimes are
    truly global and lack commitment and enforcement.

    +   - Law enforcement agencies’ personnel are not properly trained, are not paid
    handsomely, and are protected from retaliation.

    +   - There is a huge deficit of competent private and public prosecutors and
    adjudicators for cybercrimes.'
