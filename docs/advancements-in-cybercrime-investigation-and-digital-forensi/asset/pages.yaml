    Noida, Uttar Pradesh, India


    # ABSTRACT


    A credit card is an easy and most beneficial target for hackers. On the other
    hand, it is a huge threat to the financial industry. Thousands of people suffer
    great losses from this problem every year. Although it is not an easy problem,
    machine learning (ML) has given us hope and played an important role in the fraud
    detection of online transactions. Online fraud detection is facing difficulties
    like having unbalanced data, not having confidential data, non-availability of
    analyzed data, etc. The processed and analyzed data can significantly improve
    the performance of ML algorithms. In this chapter, we analyzed and compared the
    performance of Random Forest, AdaBoost Classifier, XGBoost Classifier and finally
    ensembled them to get better results.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'We have evaluated their performances based on their Matthews correlation coefficient
    (CC) score, AUC-ROC score, and their confusion matrix. The result analysis shows
    the order of importance of features for selected ML algorithms. The results indicate
    that the Random Forest has the best score in both the evaluation metrics which
    comes out to be 0.9981.


    # 12.1 INTRODUCTION


    Fraud in credit card transactions is the usage of an account by an unauthorized
    user or some fraudster (Sahin, 2013). It is a criminal activity that brings serious
    consequences to financial industries. To avoid fraud activities there are two
    measures: fraud detection and prevention. Fraud prevention means anticipating
    and stopping the fraud before it happens. Fraud detection means detecting the
    fraud and stopping it if the fraud is attempted.


    The world is filled with companies, clients, and fraudsters. Whenever a client
    suffers a fraud, the company must also suffer both financially and reputation-wise
    (Awoyemi, 2017). To provide quality service to customers, companies keep on hiring
    new schemes. They use data analysts to understand their customers. They use techniques
    to detect and prevent fraud and machine learning (ML) is one of the solutions.
    Using different ML techniques, we can identify fraudulent transactions and avert
    them from happening (Pozzolo, 2018). As e-commerce is rising the credit card transactions
    are also rising rapidly (Srivastava, 2008). This rise has made a serious impact
    on financial industries. The number of credit card users in 2019 in India was
    around 47 million and rise to 52 million in 2020. Numerous authorization techniques
    are not much effective in credit card fraud cases. Fraudsters use the internet
    to hide their identity and location. The global credit card fraud in 2018 reached
    24.26 billion USD (Nilson Report, 2018).


    In this chapter, the ML techniques are utilized for identifying frauds in credit
    card transactions, i.e., Random Forest, AdaBoost Classifier, and XGBoost Classifier.
    The real datasets are occupied from Kaggle, and it is generated by a python simulator
    PaySim through automation. The dataset has further divided into train, validation,
    and test datasets. The algorithms are trained over the testing data set, then
    validated through the validation dataset, and finally tested through the testing
    dataset. For the assessment of the models, evaluation metrics AUC-ROC and MCC
    (Matthew’s correlation coefficient) have been used, and a comparison has been
    made between them.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 12.2 RELATED WORK


    In this section, the efforts of different researcher’s has-been reviewed. Credit
    card fraud is very common nowadays and a lot of research has been done already.
    Few researchers have made some serious contributions but still fraudsters find
    new ways to challenge them and therefore we should keep learning and find better
    ways to stop them.


    Bhanusri et al. (2020) have investigated ML algorithms like random forest with
    boosting, logistic regression, and naive bayes. They detect fraudulent transactions
    and reduce the number of false alerts. According to their comparative analysis,
    the random forest with boosting technique outperforms the other techniques used
    for credit card fraud detection. However, they could not be able to differentiate
    the fraud and non-fraud transactions.


    Researchers Randhawa et al. (2018) have used both single and hybrid models. They
    have used a publicly available dataset for both types of models and they have
    added noise to data so that the robustness of the algorithms can be measured.
    At first, they used some classical single algorithms like naïve-bayes, decision-trees,
    random-forest, multilayer perceptron, support vector machine (SVM), feed forward
    neural network, linear-regression, and logistic-regression. After that, they combined
    these models with adaptive boosting and finally made different combinations of
    these algorithms making hybrids like naïve bayes combined with gradient boosting
    and more. They used the MCC score for their final evaluation. The best MCC score
    they got is 0.823, using majority voting.


    Lakshmi & Kavila (2018), have used three ML techniques like Random-Forest, Logistic-Regression,
    and Decision-Tree for fraud detection. Around 70% of the dataset is used for training
    and 30% is used for testing and validation for evaluation. The accuracy, error
    rate, sensitivity, and specificity are utilized to evaluate distinct variables
    for three algorithms. The suggested system’s performance is measured using accuracy,
    sensitivity, error rate, and specificity. The accuracy of logistic regression,
    random forest classifiers, and decision tree, respectively, is 90.0, 95.5, and
    94.3. Random forest classifier outperformed the decision tree and logistic regression
    when compared.


    Chen et al. (2014) used hybrid classifier ensembling and clusters for fraud handling.
    Raghavan et al. (2019) have compared various machine-learning and deep-learning
    models in their research. They got the best results when SVM was combined with
    CNN. CNN was best in all deep-learning algorithms as a fraud detector. Another
    deep learning-related work is Habibpour et al. (2021), who researched the value
    of uncertainty related to the predictions of'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'DNN (deep neural network). They used three deep UQ techniques (EMCD, MCD, and
    ensemble).


    Domashova & Zabelina (2021) also used ensemble methods for analysis but with dimensionality
    reduction techniques to examine. They implemented the model on the cloud-based
    platform SAS (statistical analysis system) Viya, which is a popular anti-fraud
    system.


    A comprehensive analysis of various machine-learning methods was presented in
    Pooja et al. (2021) paper with pros and cons. They worked on various algorithms
    like the Hidden Markov model, SVM, Random Forest, ANN, LSTM, and Genetic algorithms
    out of which ANN gave them the best results but its training process was very
    expensive. Here, we learned that fraud detection should not be too much costly
    both in time and money.


    Sara Alqethami et al. (2021) showed various optimization methods of first and
    second-order learning algorithms like Backpropagation, Steepest Descent, Quickprop,
    and Gauss-Newton. First-order methods use gradients to construct further training
    iterations and second-order methods use Hessian to calculate further iterations.
    They used these algorithms to enhance the accuracy of various Neural-Network algorithms
    and got the highest score of 96%.


    Fenila et al. (2021) used BiGRU (bi-directional gated repeated unit) and BiLSTM
    (long bi-directional memory) and got 80% and 81% AUC scores. They also used undersampling,
    oversampling, and SMOTE to handle imbalanced data and it also helped in increasing
    the accuracies of models. As we knew the dataset was highly unbalanced, we also
    used these techniques to reduce the side-effects of imbalanced data.


    Bocheng Liu et al. (2021) created two fraud-detection models using Fully Connected
    Neural Network and XGBoost and got an AUC value of 0.912 and 0.969, respectively.
    They also build an interactive online fraud transactions detection system. After
    all, the purpose of all this research is to detect frauds in real-world transactions
    systems.


