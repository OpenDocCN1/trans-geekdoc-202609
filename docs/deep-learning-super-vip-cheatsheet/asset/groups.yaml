    | 1-hot representation | Word embedding |

    |---|---|

    | [1-hot 3D diagram with book, soft, teddy bear] | [Word embedding 3D diagram
    with book, soft, teddy bear] |

    | - Noted o_w

    - Naive approach, no similarity information | - Noted e_w

    - Takes into account words similarity |


    Embedding matrix – For a given word w, the embedding matrix E is a matrix that
    maps its 1-hot representation o_w to its embedding e_w as follows:


    ```

    e_w = E o_w

    ```


    > *Remark: learning the embedding matrix can be done using target/context likelihood
    models.*


    # 2.3.2 Word embeddings


    Word2vec – Word2vec is a framework aimed at learning word embeddings by estimating
    the likelihood that a given word is surrounded by other words. Popular models
    include skip-gram, negative sampling and CBOW.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_7_0.png)


    Skip-gram – The skip-gram word2vec model is a supervised learning task that learns
    word embeddings by assessing the likelihood of any given target word t happening
    with a context word c. By noting θ_t a parameter associated with t, the probability
    P(t|c) is given by:'
  - '[PAGE 8]


    ```

    $P(t|c)=\frac{\exp(\theta_t^T e_c)}{\sum_{j=1}^{|V|}\exp(\theta_j^T e_c)}$

    ```


    *Remark: summing over the whole vocabulary in the denominator of the softmax part
    makes this model computationally expensive. CBOW is another word2vec model using
    the surrounding words to predict a given word.*


    ☐ **Negative sampling** – It is a set of binary classifiers using logistic regressions
    that aim at assessing how a given context and a given target words are likely
    to appear simultaneously, with the models being trained on sets of k negative
    examples and 1 positive example. Given a context word c and a target word t, the
    prediction is expressed by:


    ```

    $P(y=1|c,t)=\sigma(\theta_t^T e_c)$

    ```


    *Remark: this method is less computationally expensive than the skip-gram model.*


    ☐ **GloVe** – The GloVe model, short for global vectors for word representation,
    is a word embedding technique that uses a co-occurence matrix X where each X_{i,j}
    denotes the number of times that a target i occurred with a context j. Its cost
    function J is as follows:


    ```

    $J(\theta)=\frac12\sum_{i,j=1}^{|V|}f(X_{ij})(\theta_i^T e_j + b_i + b''_j - \log(X_{ij}))^2$

    ```


    here f is a weighting function such that $X_{i,j}=0 \Longrightarrow f(X_{i,j})=0$.


    ```

    $e_w^{(final)}=\frac{e_w+\theta_w}{2}$

    ```


    *Remark: the individual components of the learned word embeddings are not necessarily
    interpretable.*


    # 2.4 Comparing words


    ☐ **Cosine similarity** – The cosine similarity between words w1 and w2 is expressed
    as follows:


    ```

    $\text{similarity}=\frac{w_1\cdot w_2}{||w_1||\,||w_2||}=\cos(\theta)$

    ```


    *Remark: θ is the angle between words w1 and w2.*


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_8_0.png)


    ☐ **t-SNE** – t-SNE (t-distributed Stochastic Neighbor Embedding) is a technique
    aimed at reducing high-dimensional embeddings into a lower dimensional space.
    In practice, it is commonly used to visualize word vectors in the 2D space.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_8_1.png)


    # 2.5 Language model


    ☐ **Overview** – A language model aims at estimating the probability of a sentence
    P(y).


    ☐ **n-gram model** – This model is a naive approach aiming at quantifying the
    probability that an expression appears in a corpus by counting its number of appearance
    in the training data.


    ☐ **Perplexity** – Language models are commonly assessed using the perplexity
    metric, also known as PP, which can be interpreted as the inverse probability
    of the dataset normalized by the number of words T. The perplexity is such that
    the lower, the better and is defined as follows:


    ```

    $PP=\prod_{t=1}^{T}\left(\frac{1}{\sum_{j=1}^{|V|} y_j^{(t)}\cdot \hat{y}_j^{(t)}}\right)^{\frac1T}$

    ```


    *Remark: PP is commonly used in t-SNE.*


    # 2.6 Machine translation


    ☐ **Overview** – A machine translation model is similar to a language model except
    it has an encoder network placed before. For this reason, it is sometimes referred
    as a conditional language model. The goal is to find a sentence y such that:


    ```

    $y=\arg\max_{y^{<1>},...,y^{<T_y>}} P(y^{<1>},...,y^{<T_y>}|x)$

    ```


    ☐ **Beam search** – It is a heuristic search algorithm used in machine translation
    and speech recognition to find the likeliest sentence y given an input x.


    +   - Step 1: Find top B likely words y^{<1>}

    - Step 2: Compute conditional probabilities y^{<k>}|x,y^{<1>},...,y^{<k-1>}

    - Step 3: Keep top B combinations x,y^{<1>},...,y^{<k>}


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_8_2.png)'
