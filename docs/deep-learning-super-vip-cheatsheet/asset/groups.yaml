    □ Beam width – The beam width $B$ is a parameter for beam search. Large values
    of $B$ yield to better result but with slower performance and increased memory.
    Small values of $B$ lead to worse results but is less computationally intensive.
    A standard value for $B$ is around 10.


    □ Length normalization – In order to improve numerical stability, beam search
    is usually applied on the following normalized objective, often called the normalized
    log-likelihood objective, defined as:


    Objective = $\frac{1}{T_y^{\alpha}} \sum_{t=1}^{T_y} \log \left[ p(y^{<t>}|x,y^{<1>},...,y^{<t-1>})
    \right]$


    *Remark: the parameter $\alpha$ can be seen as a softener, and its value is usually
    between 0.5 and 1.*


    □ Error analysis – When obtaining a predicted translation $\hat{y}$ that is bad,
    one can wonder why we did not get a good translation $y^*$ by performing the following
    error analysis:


    | Case | $P(y^*|x) > P(\hat{y}|x)$ | $P(y^*|x) \leqslant P(\hat{y}|x)$ |

    |---|---|---|

    | **Root cause** | Beam search faulty | RNN faulty |

    | **Remedies** | Increase beam width | - Try different architecture

    - Regularize

    - Get more data |


    □ Bleu score – The bilingual evaluation understudy (bleu) score quantifies how
    good a machine translation is by computing a similarity score based on $n$-gram
    precision. It is defined as follows:


    bleu score = $\exp\left( \frac{1}{n} \sum_{k=1}^{n} p_k \right)$


    where $p_n$ is the bleu score on $n$-gram only defined as follows:


    $p_n = \frac{\sum_{\text{n-gram}\in\hat{y}} \text{count}_{\text{clip}}(\text{n-gram})}{\sum_{\text{n-gram}\in\hat{y}}
    \text{count}(\text{n-gram})}$


    *Remark: a brevity penalty may be applied to short predicted translations to prevent
    an artificially inflated bleu score.*


    # 2.7 Attention


    □ Attention model – This model allows an RNN to pay attention to specific parts
    of the input that is considered as being important, which improves the performance
    of the resulting model in practice. By noting $\alpha^{<t,t''>}$ the amount of
    attention that the output $y^{<t>}$ should pay to the activation $a^{<t''>}$ and
    $c^{<t>}$ the context at time $t$, we have:


    $c^{<t>} = \sum_{t''} \alpha^{<t,t''>} a^{<t''>}$ with $\sum_{t''} \alpha^{<t,t''>}
    = 1$


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_9_0.png)


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_9_1.png)


    □ Attention weight – The amount of attention that the output $y^{<t>}$ should
    pay to the activation $a^{<t''>}$ is given by $\alpha^{<t,t''>}$ computed as follows:


    $\alpha^{<t,t''>} = \frac{\exp(e^{<t,t''>})}{\sum_{t''''=1}^{T_x} \exp(e^{<t,t''''>})}$


    *Remark: computation complexity is quadratic with respect to $T_x$.*


