    # 3.5 Good practices


    ☐ Overfitting small batch – When debugging a model, it is often useful to make
    quick tests to see if there is any major issue with the architecture of the model
    itself. In particular, in order to make sure that the model can be properly trained,
    a mini-batch is passed inside the network to see if it can overfit on it. If it
    cannot, it means that the model is either too complex or not complex enough to
    even overfit on a small batch, let alone a normal-sized training set.


    ☐ Gradient checking – Gradient checking is a method used during the implementation
    of the backward pass of a neural network. It compares the value of the analytical
    gradient to the numerical gradient at given points and plays the role of a sanity-check
    for correctness.


    | | Numerical gradient | Analytical gradient |

    |---|---|---|

    | **Formula** | $\frac{df}{dx}(x) \approx \frac{f(x+h)-f(x-h)}{2h}$ | $\frac{df}{dx}(x)
    = f''(x)$ |

    | **Comments** | - Expensive; loss has to be computed two times per dimension

    - Used to verify correctness of analytical implementation

    -Trade-off in choosing $h$ not too small (numerical instability) nor too large
    (poor gradient approx.) | - ''Exact'' result

    - Direct computation

    - Used in the final implementation |


    * * *'
