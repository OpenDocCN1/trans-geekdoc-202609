    # 1 Convolutional Neural Networks


    # 1.1 Overview


    Architecture of a traditional CNN – Convolutional neural networks, also known
    as CNNs, are a specific type of neural networks that are generally composed of
    the following layers:


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_0_0.png)


    The convolution layer and the pooling layer can be fine-tuned with respect to
    hyperparameters that are described in the next sections.


    # 1.2 Types of layer


    Convolutional layer (CONV) – The convolution layer (CONV) uses filters that perform
    convolution operations as it is scanning the input I with respect to its dimensions.
    Its hyperparameters include the filter size F and stride S. The resulting output
    O is called feature map or activation map.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_0_1.png)


    Remark: the convolution step can be generalized to the 1D and 3D cases as well.


    Pooling (POOL) – The pooling layer (POOL) is a downsampling operation, typically
    applied after a convolution layer, which does some spatial invariance. In particular,
    max and average pooling are special kinds of pooling where the maximum and average
    value is taken, respectively.'
  - '[PAGE 1]


    | | Max pooling | Average pooling |

    |---|---|---|

    | Purpose | Each pooling operation selects the maximum value of the current view
    | Each pooling operation averages the values of the current view |

    | Illustration | max pooling illustration | avg pooling illustration |

    | Comments | - Preserves detected features

    - Most commonly used | - Downsamples feature map

    - Used in LeNet |


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_1_0.png)


    Zero-padding – Zero-padding denotes the process of adding P zeroes to each side
    of the boundaries of the input. This value can either be manually specified or
    automatically set through one of the three modes detailed below:


    | | Valid | Same | Full |

    |---|---|---|---|

    | Value | P = 0 | P_start = [ S⌈I/S⌉ - I + F - S / 2 ]  P_end = [ S⌈I/S⌉ - I +
    F - S / 2 ] | P_start ∈ [0,F-1]  P_end = F - 1 |

    | Illustration | zero padding valid illustration | zero padding same illustration
    | zero padding full illustration |

    | Purpose | - No padding

    - Drops last convolution if dimensions do not match | - Padding such that feature
    map size has size ⌈I/S⌉

    - Output size is mathematically convenient

    - Also called ''half'' padding | - Maximum padding such that end convolutions
    are applied on the limits of the input

    - Filter ''sees'' the input end-to-end |


    Fully Connected (FC) – The fully connected layer (FC) operates on a flattened
    input where each input is connected to all neurons. If present, FC layers are
    usually found towards the end of CNN architectures and can be used to optimize
    objectives such as class scores.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_1_1.png)


    # 1.3 Filter hyperparameters


    The convolution layer contains filters for which it is important to know the meaning
    behind its hyperparameters.


    Dimensions of a filter – A filter of size F × F applied to an input containing
    C channels is a F × F × C volume that performs convolutions on an input of size
    I × I × C and produces an output feature map (also called activation map) of size
    O × O × 1.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_1_2.png)


    *Remark: the application of K filters of size F × F results in an output feature
    map of size O × O × K.*


    Stride – For a convolutional or a pooling operation, the stride S denotes the
    number of pixels by which the window moves after each operation.


    # 1.4 Tuning hyperparameters


    Parameter compatibility in convolution layer – By noting I the length of the input
    volume size, F the length of the filter, P the amount of zero padding, S the stride,
    then the output size O of the feature map along that dimension is given by:


    $$O = \frac{I - F + P_{start} + P_{end}}{S} + 1$$


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_1_3.png)


    *Remark: often times, P_start = P_end ≡ P, in which case we can replace P_start
    + P_end by 2P in the formula above.*'
  - '[PAGE 2]


    Understanding the complexity of the model – In order to assess the complexity
    of a model, it is often useful to determine the number of parameters that its
    architecture will have. In a given layer of a convolutional neural network, it
    is done as follows:


    | | CONV | POOL | FC |

    |---|---|---|---|

    | Illustration | F×F filter ×K ⊗C | F max | N_in → N_out |

    | Input size | I×I×C | I×I×C | N_in |

    | Output size | O×O×K | O×O×C | N_out |

    | Number of parameters | (F×F×C+1)·K | 0 | (N_in+1)×N_out |

    | Remarks | - One bias parameter per filter

    - In most cases, S<F

    - A common choice for K is 2C | - Pooling operation done channel-wise

    - In most cases, S=F | - Input is flattened

    - One bias parameter per neuron

    - The number of FC neurons is free of structural constraints |


    Receptive field – The receptive field at layer k is the area denoted R_k × R_k
    of the input that each pixel of the k-th activation map can ''see''. By calling
    F_j the filter size of layer j and S_i the stride value of layer i and with the
    convention S_0 = 1, the receptive field at layer k can be computed with the formula:


    R_k = 1 + Σ_{j=1}^{k} (F_j - 1) Π_{i=0}^{j-1} S_i


    In the example below, we have F_1 = F_2 = 3 and S_1 = S_2 = 1, which gives R_2
    = 1+2·1+2·1 = 5.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_2_0.png)


    # 1.5 Commonly used activation functions


    Rectified Linear Unit – The rectified linear unit layer (ReLU) is an activation
    function g that is used on all elements of the volume. It aims at introducing
    non-linearities to the network. Its variants are summarized in the table below:


    | ReLU | Leaky ReLU | ELU |

    |---|---|---|

    | g(z)=max(0,z) | g(z)=max(εz,z) with ε≪1 | g(z)=max(α(e^z-1),z) with α≪1 |

    | Plot | Plot | Plot |

    | Non-linearity complexities biologically interpretable | Addresses dying ReLU
    issue for negative values | Differentiable everywhere |


    Softmax – The softmax step can be seen as a generalized logistic function that
    takes as input a vector of scores x ∈ R^n and outputs a vector of output probability
    p ∈ R^n through a softmax function at the end of the architecture. It is defined
    as follows:


    ```

    p = [p1; ...; pn]   where   p_i = e^{x_i} / Σ_{j=1}^{n} e^{x_j}

    ```


    # 1.6 Object detection


    Types of models – There are 3 main types of object recognition algorithms, for
    which the nature of what is predicted is different. They are described in the
    table below:


    | Image classification | Classification w. localization | Detection |

    |---|---|---|

    | Teddy bear image | Teddy bear with bounding box | Teddy bear with bounding box
    and label |

    | - Classifies a picture

    - Predicts probability of object | - Detects object in a picture

    - Predicts probability of object and where it is located | - Detects up to several
    objects in a picture

    - Predicts probabilities of objects and where they are located |

    | Traditional CNN | Simplified YOLO, R-CNN | YOLO, R-CNN |


    Detection – In the context of object detection, different methods are used depending
    on whether we just want to locate the object or detect a more complex shape in
    the image. The two main ones are summed up in the table below:'
