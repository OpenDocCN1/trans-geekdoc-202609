    # 3.3 Parameter tuning


    # 3.3.1 Weights initialization


    □ Xavier initialization – Instead of initializing the weights in a purely random
    manner, Xavier initialization enables to have initial weights that take into account
    characteristics that are unique to the architecture.


    □ Transfer learning – Training a deep learning model requires a lot of data and
    more importantly a lot of time. It is often useful to take advantage of pre-trained
    weights on huge datasets that took days/weeks to train, and leverage it towards
    our use case. Depending on how much data we have at hand, here are the different
    ways to leverage this:


    | Training size | Illustration | Explanation |

    |---|---|---|

    | Small |  | Freezes all layers, trains weights on softmax |

    | Medium |  | Freezes most layers, trains weights on last layers and softmax |

    | Large |  | Trains weights on layers and softmax by initializing weights on pre-trained
    ones |


    # 3.3.2 Optimizing convergence


    □ Learning rate – The learning rate, often noted α or sometimes η, indicates at
    which pace the weights get updated. It can be fixed or adaptively changed. The
    current most popular method is called Adam, which is a method that adapts the
    learning rate.


    □ Adaptive learning rates – Letting the learning rate vary when training a model
    can reduce the training time and improve the numerical optimal solution. While
    Adam optimizer is the most commonly used technique, others can also be useful.
    They are summed up in the table below:


    | Method | Explanation | Update of w | Update of b |

    |---|---|---|---|

    | Momentum | - Dampens oscillations

    - Improvement to SGD

    - 2 parameters to tune | $w - \alpha v_{dw}$ | $b - \alpha v_{db}$ |

    | RMSprop | - Root Mean Square propagation

    - Speeds up learning algorithm by controlling oscillations | $w - \alpha \frac{dw}{\sqrt{s_{dw}}}$
    | $b \leftarrow b - \alpha \frac{db}{\sqrt{s_{db}}}$ |

    | Adam | - Adaptive Moment estimation

    - Most popular method

    - 4 parameters to tune | $w - \alpha \frac{v_{dw}}{\sqrt{s_{dw}} + \epsilon}$
    | $b \leftarrow b - \alpha \frac{v_{db}}{\sqrt{s_{db}} + \epsilon}$ |


    Remark: other methods include Adadelta, Adagrad and SGD.


    # 3.4 Regularization


    □ Dropout – Dropout is a technique used in neural networks to prevent overfitting
    the training data by dropping out neurons with probability p > 0. It forces the
    model to avoid relying too much on particular sets of features.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_11_0.png)


    Remark: most deep learning frameworks parametrize dropout through the ''keep''
    parameter 1 − p.


    □ Weight regularization – In order to make sure that the weights are not too large
    and that the model is not overfitting the training set, regularization techniques
    are usually performed on the model weights. The main ones are summed up in the
    table below:


    | LASSO | Ridge | Elastic Net |

    |---|---|---|

    | - Shrinks coefficients to 0

    - Good for variable selection | Makes coefficients smaller | Tradeoff between
    variable selection and small coefficients |

    | $... + \lambda ||\theta||_1$ $\lambda \in \mathbb{R}$ | $... + \lambda ||\theta||_2^2$
    $\lambda \in \mathbb{R}$ | $... + \lambda \big[(1-\alpha)||\theta||_1 + \alpha||\theta||_2^2\big]$
    $\lambda \in \mathbb{R}, \alpha \in [0,1]$ |'
