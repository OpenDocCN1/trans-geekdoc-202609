  md: '# 3 Deep Learning Tips and Tricks


    # 3.1 Data processing


    Data augmentation – Deep learning models usually need a lot of data to be properly
    trained. It is often useful to get more data from the existing ones using data
    augmentation techniques. The main ones are summed up in the table below. More
    precisely, given the following input image, here are the techniques that we can
    apply:


    | Original | Flip | Rotation | Random crop |

    |---|---|---|---|

    | - Image without any modification | - Flipped with respect to an axis for which
    the meaning of the image is preserved | - Rotation with a slight angle

    - Simulates incorrect horizon calibration | - Random focus on one part of the
    image

    - Several random crops can be done in a row |


    | Color shift | Noise addition | Information loss | Contrast change |

    |---|---|---|---|

    | - Nuances of RGB is slightly changed

    - Captures noise that can occur with light exposure | - Addition of noise

    - More tolerance to quality variation of inputs | - Parts of image ignored

    - Mimics potential loss of parts of image | - Luminosity changes

    - Controls difference in exposition due to time of day |


    Batch normalization – It is a step of hyperparameter γ,β that normalizes the batch
    {x_i}. By noting μ_B, σ_B² the mean and variance of that we want to correct to
    the batch, it is done as follows:


    ```

    x_i ← γ (x_i - μ_B) / sqrt(σ_B² + ε) + β

    ```


    It is usually done after a fully connected/convolutional layer and before a non-linearity
    layer and aims at allowing higher learning rates and reducing the strong dependence
    on initialization.


    # 3.2 Training a neural network


    # 3.2.1 Definitions


    Epoch – In the context of training a model, epoch is a term used to refer to one
    iteration where the model sees the whole training set to update its weights.


    Mini-batch gradient descent – During the training phase, updating weights is usually
    not based on the whole training set at once due to computation complexities or
    one data point due to noise issues. Instead, the update step is done on mini-batches,
    where the number of data points in a batch is a hyperparameter that we can tune.


    Loss function – In order to quantify how a given model performs, the loss function
    L is usually used to evaluate to what extent the actual outputs y are correctly
    predicted by the model outputs z.


    Cross-entropy loss – In the context of binary classification in neural networks,
    the cross-entropy loss L(z,y) is commonly used and is defined as follows:


    ```

    L(z,y) = - [ y log(z) + (1 - y) log(1 - z) ]

    ```


    # 3.2.2 Finding optimal weights


    Backpropagation – Backpropagation is a method to update the weights in the neural
    network by taking into account the actual output and the desired output. The derivative
    with respect to each weight w is computed using the chain rule.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_10_0.png)


    Using this method, each weight is updated with the rule:


    ```

    w ← w - α ∂L(z,y)/∂w

    ```


    Updating weights – In a neural network, weights are updated as follows:


    +   - Step 1: Take a batch of training data and perform forward propagation to
    compute the loss.

    - Step 2: Backpropagate the loss to get the gradient of the loss with respect
    to each weight.

    - Step 3: Use the gradients to update the weights of the network.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_10_1.png)'
