  md: '# 1.6.1 Face verification and recognition


    Types of models – Two main types of model are summed up in table below:


    | Face verification | Face recognition |

    |---|---|

    | - Is this the correct person?

    - One-to-one lookup | - Is this one of the K persons in the database?

    - One-to-many lookup |

    | Query / Reference diagram with bear illustrations | Query / Database diagram
    with bear illustrations |


    One Shot Learning – One Shot Learning is a face verification algorithm that uses
    a limited training set to learn a similarity function that quantifies how different
    two given images are. The similarity function applied to two images is often noted
    d(image 1, image 2).


    Siamese Network – Siamese Networks aim at learning how to encode images to then
    quantify how different two images are. For a given input image x^(i), the encoded
    output is often noted as f(x^(i)).


    Triplet loss – The triplet loss ℓ is a loss function computed on the embedding
    representation of a triplet of images A (anchor), P (positive) and N (negative).
    The anchor and the positive example belong to a same class, while the negative
    example to another one. By calling α ∈ ℝ⁺ the margin parameter, this loss is defined
    as follows:


    ℓ(A,P,N) = max(d(A,P) − d(A,N) + α, 0)


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_4_0.png)


    # 1.6.2 Neural style transfer


    Motivation – The goal of neural style transfer is to generate an image G based
    on a given content C and a given style S.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_4_1.png)


    Activation – In a given layer l, the activation is noted a^[l] and is of dimensions
    n_H × n_w × n_c


    Content cost function – The content cost function J_content(C,G) is used to determine
    how the generated image G differs from the original content image C. It is defined
    as follows:


    J_content(C,G) = ½ ||a^[l](C) − a^[l](G)||²


    Style matrix – The style matrix G^[l] of a given layer l is a Gram matrix where
    each of its elements G^[l]_kk'' quantifies how correlated the channels k and k''
    are. It is defined with respect to activations a^[l] as follows:


    G^[l]_kk'' = Σ_{i=1}^{n_H^[l]} Σ_{j=1}^{n_w^[l]} a_{ijk}^[l] a_{ijk''}^[l]


    > Remark: the style matrix for the style image and the generated image are noted
    G^[l](S) and G^[l](G) respectively.


    Style cost function – The style cost function J_style(S,G) is used to determine
    how the generated image G differs from the style S. It is defined as follows:


    J_style^[l](S,G) = 1/(2 n_H n_w n_c)² ||G^[l](S) − G^[l](G)||_F² = 1/(2 n_H n_w
    n_c)² Σ_{k,k''=1}^{n_c} (G^[l]_kk''(S) − G^[l]_kk''(G))²


    Overall cost function – The overall cost function is defined as being a combination
    of the content and style cost functions, weighted by parameters α,β, as follows:


    J(G) = α J_content(C,G) + β J_style(S,G)


    > Remark: a higher value of α will make the model care more about the content
    while a higher value of β will make it care more about the style.


    # 1.6.3 Architectures using computational tricks


    Generative Adversarial Network – Generative adversarial networks, also known as
    GANs, are composed of a generative and a discriminative model, where the generative
    model aims at generating the most truthful output that will be fed into the discriminative
    which aims at differentiating the generated and true image.'
  merge: -1
  img_proc: true
