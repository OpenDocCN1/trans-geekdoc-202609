  md: '![](img/e11aa9dcca4472d1c8c95c92f84913a5_5_0.png)


    Remark: use cases using variants of GANs include text to image, music generation
    and synthesis.


    ResNet – The Residual Network architecture (also called ResNet) uses residual
    blocks with a high number of layers meant to decrease the training error. The
    residual block has the following characterizing equation:


    ```

    a^{[l+2]} = g(a^{[l]} + z^{[l+2]})

    ```


    Inception Network – This architecture uses inception modules and aims at giving
    a try at different convolutions in order to increase its performance. In particular,
    it uses the 1 × 1 convolution trick to lower the burden of computation.


