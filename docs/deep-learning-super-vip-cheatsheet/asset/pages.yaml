    # 2.2 Handling long term dependencies


    □ Commonly used activation functions – The most common activation functions used
    in RNN modules are described below:


    | Sigmoid | Tanh | RELU |

    |---|---|---|

    | $g(z) = \frac{1}{1 + e^{-z}}$ | $g(z) = \frac{e^{z} - e^{-z}}{e^{z} + e^{-z}}$
    | $g(z) = \max(0,z)$ |

    | [Graph] | [Graph] | [Graph] |


    □ Vanishing/exploding gradient – The vanishing and exploding gradient phenomena
    are often encountered in the context of RNNs. The reason why they happen is that
    it is difficult to capture long term dependencies because of multiplicative gradient
    that can be exponentially decreasing/increasing with respect to the number of
    layers.


    □ Gradient clipping – It is a technique used to cope with the exploding gradient
    problem sometimes encountered when performing backpropagation. By capping the
    maximum value for the gradient, this phenomenon is controlled in practice.


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_6_0.png)


    □ Types of gates – In order to remedy the vanishing gradient problem, specific
    gates are used in some types of RNNs and usually have a well-defined purpose.
    They are usually noted $\Gamma$ and are equal to:


    ```

    $$\Gamma = \sigma(W x^{<t>} + U a^{<t-1>} + b)$$

    ```


    where $W, U, b$ are coefficients specific to the gate and $\sigma$ is the sigmoid
    function. The main ones are summed up in the table below:


    □ Loss function – In the case of a recurrent neural network, the loss function
    $\mathcal{L}$ of all time steps is defined based on the loss at every time step
    as follows:


    ```

    $$\mathcal{L}(\widehat{y},y) = \sum_{t=1}^{T_y} \mathcal{L}(\widehat{y}^{<t>},
    y^{<t>})$$

    ```


    □ Backpropagation through time – Backpropagation is done at each point in time.
    At timestep $T$, the derivative of the loss $\mathcal{L}$ with respect to weight
    matrix $W$ is expressed as follows:'
