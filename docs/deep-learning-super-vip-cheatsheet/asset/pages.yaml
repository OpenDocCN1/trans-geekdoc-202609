    # 2 Recurrent Neural Networks


    # 2.1 Overview


    Architecture of a traditional RNN – Recurrent neural networks, also known as RNNs,
    are a class of neural networks that allow previous outputs to be used as inputs
    while having hidden states. They are typically as follows:


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_5_1.png)


    For each timestep t, the activation a^{<t>} and the output y^{<t>} are expressed
    as follows:


    ```

    a^{<t>} = g1(W_aa a^{<t-1>} + W_ax x^{<t>} + b_a)   and   y^{<t>} = g2(W_ya a^{<t>}
    + b_y)

    ```


    where W_ax, W_aa, W_ya, b_a, b_y are coefficients that are shared temporally and
    g1, g2 activation functions


    ![](img/e11aa9dcca4472d1c8c95c92f84913a5_5_2.png)


    The pros and cons of a typical RNN architecture are summed up in the table below:


    | Advantages | Drawbacks |

    |---|---|

    | - Possibility of processing input of any length

    - Model size not increasing with size of input

    - Computation takes into account historical information

    - Weights are shared across time | - Computation being slow

    - Difficulty of accessing information from a long time ago

    - Cannot consider any future input for the current state |


    Applications of RNNs – RNN models are mostly used in the fields of natural language
    processing and speech recognition. The different applications are summed up in
    the table below:'
