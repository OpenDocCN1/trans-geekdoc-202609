    # 2. Material and methods


    # 2.1. Participants


    The present study included 89 individuals with schizophrenia and 53 controls.
    They were recruited at two university hospitals in Warsaw and Szczecin (Poznan
    as the convenience). All participants were non-consanguine and Caucasian ethnicity.
    The inclusion criteria were: 1) age 18–65 years; 2) diagnosis of schizophrenia
    confirmed by the DSM-IV criteria using the Brief Positive and Negative Syndrome
    Scale (BPRS, 1991); 3) stable pharmacological treatment for the period of at least
    6 months and 4) remission of positive and disorganization symptoms based on the
    Positive and Negative Syndrome Scale (PANSS; Smith et al., 2011) and no hallucinatory
    behavior (G5 – mannerisms or G9 – no disorganized thought content <3; Anderson
    et al., 2005). The use of mood stabilizers and antidepressants as well as the
    dosage of atypical antipsychotics equivalents (CPFQ) were recorded for all individuals
    with schizophrenia.


    Healthy controls were recruited by references. They had no negative family history
    of psychotic illness and no psychiatric degree relatives. All of them were screened
    for schizophrenia using the International Classification of Diseases (ICD-1992).


    Both groups of participants were matched for age, sex and level of socioeconomic
    status (used as a proxy for socioeconomic status, as noted in the study) by the
    Biothecs Clinics at Medical University (Warsaw, Poland) and Poznan Medical University
    (Szczecin, Poland). Participants were given informed consent.


    Several studies have identified differences in gut microbiota composition between
    patients and healthy controls. Systematic reviews demonstrated that gut microbiota
    in individuals with schizophrenia is significantly overlapped with decreased relative
    abundance of the genus Bacteractoides, Eggibacterium and Lactobacillus as well
    as decreased abundance of the Faecalibacterium genus. Prevalence of increased
    bacteria of Prevotella and Haemophilus might have more specific markers for schizophrenia.
    It is also noted that researchers have revealed that individuals with schizophrenia
    de novo exposure to germ-free environments may lead to cognitive impairments,
    hyperactivity, and lower levels of memory as well as upregulation of the kynurenic
    acid pathway in metabolism


    Although few gut microbiota have been altered in patients with schizophrenia,
    specific mechanisms are not yet fully understood. Systematic reviews, comparing
    gut microbiota between individuals with patients and healthy controls have rarely
    accounted for the effects of confounding factors (Sachowicz and Miszał, 2022).
    Moreover, it is likely to understand the impact of known risk factors of schizophrenia
    on gut microbiota. For instance, there is evidence that life events in early childhood
    affect gut microbiota. Early stressors can alter gut microbiota and these alterations
    persist until adulthood (Jisarcvic et al., 2015). For instance, poor diet can
    lead to altered levels of Firmicutes and Bacteroidetes with increased levels of
    atherosclerosis and inflammatory responseiosis in adulthood (Garcia-Rodriguez
    et al., 2006). Similar findings were demonstrated


