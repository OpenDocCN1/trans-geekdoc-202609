    # 2.4. Statistical analysis


    Between-groups in the general characteristics of the sample were assessed using
    the t² or Fisher''s exact test (in categorical variables) and the Mann-Whitney
    U or t-tests (in continuous variables). These analyses tested the null hypothesis
    that groups of participants did not differ significantly in the observed characteristics.
    Significance in bivariate variables of characteristics was set at p < 0.05. Data
    analysis was performed using the SPSS, version 28.


    To examine differences in alpha diversity between groups we calculated the Shannon
    (Chao index) and compared with the Kolmogorov-Smirnov test (using the RDP version
    18) Amzaeta et al., (2020). Considering confounding effects of age, BMI, and the
    level of education in alpha diversity were measured using generalized linear regression.
    Each model was validated by comparing models with different variables of characteristics
    (Wang, 2007).


    As reported by Neiring et al., (2022), to identify features that provide the best
    differentiation between healthy and obese subjects, we performed the differential
    abundance analysis between patients with schizophrenia and healthy controls, using
    11 various tools: the LEFa, the metagenose, the ANCOM, the ANCOMBC, the ALDE2,
    the ED-seq2, and the MaAsLin.


    # 2.3. Assessment of exposure


    Cigarette smoking was assessed using the Questionnaire for Frequency of Dependence
    (FTND)(Pomerauer et al., 1989). It includes items that assess the quantity of
    cigarettes smoked per day, the time to consume nicotine and preference. Items
    are scored from 0 to 1, while multiple-choice items are scored from 0 to 3. The
    total score ranges from 0 to 30 with higher scores indicating greater addiction
    to nicotine.


    # 2.6. Biological material


    The Perceived Stress Scale was measured to record stress of the preceding month
    (Cohen et al., 1988). It includes 10 items on a 5-point Likert scale (0–never
    to very often). The total score ranges from 0 to 40; higher scores indicating
    greater level of perceived stress.


    The Traumatic Event Checklist (TEC) was used to record history of trauma (Vrijbek
    et al., 2002). It consists of 30 statements referring to various features of stressful
    events. In this study, we analyzed consumption of emotional abuse, physical and
    sexual abuse. The last one was categorized based on the scales of ''sexual harassment''
    and ''sexual abuse''. History of ACEs was analyzed as exposure under the age of
    18 years.


    # 2.7. Microbiome data


    Biochemical markers were determined in serum samples and included: 1) glucose;
    2) total cholesterol; 3) low-density lipoprotein (LDL); 4) high-density lipoproteins
    (HDL); 6) non-HDL; 7) triglycerides and 8) high-reactive C-protein (CRP). Serum
    samples were collected using the automated laboratory method to perform measure
    biochemical parameters and obtain microbiome data via Supplementary Material.


    Paired-end 16S gene sequencing was carried out using the MiSeq Kit v3 (300 cycles).
    The sequencing was carried out using the adapter (3'') and sequence from the DADA2
    package (version 2.2.0) (Callahan et al., 2016). Processing of raw reads was performed
    using QIME2 for V4–V3 region and denoising. DADA2 generated filters producing
    ASVs which were used for taxonomic assignment. Quality control, filtering, error
    correction, denoising and chimera filtering were performed using the DADA2. DADA2
    filtering settings were produced based on Reimer et al. (2011). The ASVs were
    classified using the Bayesian classifier with the maximum confidence bootstrap
    set at 0.8 for the assigning taxonomic level (Wang et al., 2007). Our reference
    sequences used: SILVA, version 138; Shannon and Qian (2001); The Genome Taxonomic
    Database (GTDB), version 2027 (All et al., 2021); the RefSeq combined with RDP,
    version 16 (All et al., 2021); and the Ribosomal Database Project (RDP, version
    18). Subsequences that could not be classified at the genus level were removed.
