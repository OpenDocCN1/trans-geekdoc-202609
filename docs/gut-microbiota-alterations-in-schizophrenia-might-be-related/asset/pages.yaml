    To our knowledge, previous studies investigated dietary habits contribute to microbiota
    alterations in subjects with schizophrenia. It is now widely known that patients
    with schizophrenia show poor dietary habits with high intake of refined carbohydrates,
    processed foods, and low intake of certain vitamins and minerals (Asoucin et al.,
    2020). Our study demonstrated that dietary intake of certain food products might
    be related to microbiota alterations in schizophrenia. Greater abundance of *Parapivotella*
    was related to lower intake of fish, while lower abundance of *Faecalibacterium*
    was also associated with lower levels of HDL. Moreover, the consumption of both
    food products was significantly associated with schizophrenia, differentiated
    between different groups of patients with autism. It has been reported that lactic
    acid producing bacteria (including *Lactobacillus* and *Bifidobacterium*) species
    can exert a number of biological activities that might be beneficial in terms
    of modulating cholesterol metabolism (Vonesky et al., 2021). Similarly, it has
    been reported that polyphenols and fiber that are typical


    components of plant foods increase the abundance of lactic acid bacteria (Tonova
    et al., 2019). However, the *Lactobacillus* genus is also heterogeneous with certain
    species having pro-inflammatory properties (Rocha-Rameriz et al., 2017). Also,
    Zhou et al. (2020) identified different *Lactobacillus* species in patients with
    schizophrenia that did not occur in the healthy gut environment. Therefore, our
    findings indicate the necessity to explore the abundance of specific strains of
    *Lactobacillus* and *Limosillactobacillus* that differantly associated with clinical
    features in patients with schizophrenia from our sample. The abundance of *Lactobacillus*
    and *Limosillactobacillus* was negatively correlated with performance of the RBANS
    attention domain. Moreover, individuals with schizophrenia showed significantly
    lower attention domain. Additionally, it should be noted that the RBANS attention
    score is the sum of scores from two tasks – digit coding and digit spin. The first
    measures processing speed, while the other measures working memory. Therefore,
    it is concluded that greater abundance of *Lactobacillus* and *Limosillactobacillus*
    might be related to better cognitive functions in terms of attention, processing
    speed and working memory. However, the relevance and specific mechanisms of these
    correlations should be interpreted with caution. Indeed, these correlations are
