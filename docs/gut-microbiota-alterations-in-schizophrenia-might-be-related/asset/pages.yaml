    # Gut microbiota alterations in schizophrenia may be related to stress exposure:
    Findings from the machine learning analysis


    Paweł Karpinski $^{a,b}$, Paulina Żebrowska-Różańska $^{a,b}$, Dorota Kujawa $^{b}$,
