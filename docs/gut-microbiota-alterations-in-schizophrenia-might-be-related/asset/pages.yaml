    are frequently caused and species of Lactobacillus may be beneficial in the treatment
    of schizophrenia. This also point to the heterogeneity of the Lactobacillus genus
    in its biological activity. It is important to interpret the correlates of the
    Faecalibacterium genus with other characteristics.


    Faecalibacterium genus was weakly but significantly linked to lower of depressive
    symptoms and general functioning in patients with schizophrenia. This is not in
    agreement with the findings of decreased abundance of Faecalibacterium in patients
    with major depression (for a review by Kues et al. (2013). Also, this study by
    Jing and (2015) revealed a negative correlation between the abundance of Lactobacillus
    and depressive symptoms. Potential explanations for this difference remain unknown.
    It should be noted that schizophrenia and major depression are different disorders.


    Most importantly, the present findings, for the first time, indicate that gut
    alterations in patients with schizophrenia might be associated with increased
    abundance of Lactobacilli. Unlike exposure to stress, individuals with schizophrenia
    in our reported study showed higher ratios of every categories of Lactobacilli
    compared to the decreased abundance of Faecalibacterium in the due to (Zheng et
    al., 2020). The mechanisms linking the abundance of Lactobacillus to schizophrenia
    remain unclear. The multi-litter early-life (maternal absence, weaning and unpredictable
    chronic mild stress) showed stress-specific effects on the abundance of Lactobacillus
    in mice (Runcel et al., 2019).


    There are limitations of the present study that should be considered. Our sample
    was not large, and thus false negative and false positive results occurred. Furthermore,
    it should be considered, with respect to the association of Regparavel, with the
    use of mood stabilizers found. Another point is that the 16S rRNA sequencing used
    in this study was not sufficient to analyze specific bacterial strains. Therefore
    our study focused on at the genus level as revealed by Neearing et al. (2022).
    Our present findings linking schizophrenia with gut microbiota may be excluded
    that the effects of AKIs simply reflect the impact of other factors related to
    social disadvantage in childhood. The social history of patients, including early
    upbringing, education and socioeconomic status (Smith et al., 2015). For parental
    education, it cannot be excluded that other elements of socioeconomic status,
    including income, household environment, and quality of health facilities better
    explain socioeconomic status (2019). Family schizophrenia is also associated with
    gut microbiota in infants and children (Levis et al., 2021). Although these factors,
    AKIs, might shape the healthy gut microbiota, contributing to the development
    of schizophrenia (Gao et al., 2021). Another limitation is that the study was
    based on reports of exposure to stress and dietary habits, and thus a real bias
    needs to be taken into consideration. Longitudinal design was needed to establish


    causal associations.

    In sum, the present findings largely confirm increased abundance of lactic producing
    bacteria and decreased abundance of bacteria producing SCFAs in patients with
    schizophrenia. For the first time, the present findings indicate that stress may
    contribute to these alterations. Given some of them might help for clinical manifestation
    and lipid profiles, development of interventions targeting the mechanisms underlying
    gut microbiota alterations in schizophrenia is needed. It is also necessary to
    provide insights into specific mechanisms underlying the effects of stress on
    gut microbiome.


