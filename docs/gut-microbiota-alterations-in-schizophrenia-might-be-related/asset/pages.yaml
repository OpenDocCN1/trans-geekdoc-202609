    Specific mechanisms gut microbiota alterations in schizophrenia remain unknown.
    We aimed to compare microbiota between patients with schizophrenia and controls,
    taking into account exposure stress levels including 89 patients with schizophrenia
    and 25 controls. Microbiota was analyzed using the 16S rRNA sequencing. Additionally,
    biochemical parameters related to glucose homeostasis, lipid profile and inflammation
    were assessed. Increased abundance of Lactobacillus and Lactobacillus as well
    as decreased abundance of Faecalibacterium and Parvimonella were observed. We
    found that patients with history of childhood trauma, greater cumulative exposure
    to stress across longer lifespan and higher lipid profile alterations (lower levels
    of high-density lipoprotein) and poorer cognitive function were detected. Our
    findings indicate that gut microbiota alterations in patients with schizophrenia,
    including increased abundance of lactic acid bacteria (Lactobacillus and Lactobacillales)
    and decreased abundance of bacteria producing butyrate might be associated with
    exposure to stress, dietary habits, lipid profile alterations and cognitive impairment.


    # 1. Introduction


    Schizophrenia represents one of severe mental disorders associated with significant
    impact on social functioning and life expectancy (Correll et al.,2021). From the
    clinical perspective, it is a mental disorder characterized by psychotic symptoms
    such as hallucinations, delusions, negative and positive moods as well as cognitive
    impairment (Jahar et al., 2022). Accumulated evidence shows that schizophrenia
    is a multi-system neurodevelopmental disorder (Miśniak et al., 2014; Plinger et
    al., 2021). Indeed, there are various or clinically relevant observations in the
    peripheral blood and cerebral


    fluids. These include multifluids (Miller et al.,2011), lipid distributions (Miśniak
    et al.,2017), altered glucose metabolism (Peery et al.,2016), altered hormonal
    regulation of the hypothalamic-pituitary-adrenal axis (Li et al., 2020) and dysfunction.
    Importantly, most antipsychotic drugs administered to patients with schizophrenia-even
    or those at clinical risk of psychosis. However, specific mechanisms underlying
    these observations are the subject of intensive research activity.


    The recognition of the gut-brain axis has provided another perspective that might
    help to understand the pathophysiology of schizophrenia


