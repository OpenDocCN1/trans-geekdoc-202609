    # 4. Discussion


    In this study, we used multiple methods of differential analysis and taxonomic
    databases to detect differentially abundant patterns in patients with schizophrenia
    compared to healthy controls (Nearing et al., 2022; Wallen, 2021). This study
    indicates that individuals with schizophrenia show greater abundance of Faecalibacterium
    and Limnobacillus with lower abundance of mood stabilizers. Our findings regarding
    the differential abundance of Faecalibacterium and Lactobacillus are consistent
    with findings from recent scientific reviews showing altered microbiota composition
    in patients with schizophrenia (Parprevotella and Faecalibacterium) represent
    butyrate production of SCFAs - butyrate. (Borkensen et al., 2022); SCFAs are produced
