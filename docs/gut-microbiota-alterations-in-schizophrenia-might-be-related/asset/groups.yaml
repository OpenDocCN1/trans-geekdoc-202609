  mdcn: '

    之前的研究结果显示，分裂症患者体内乳杆菌（Lactobacilli）丰度增加（Li et al., 2019; Zhou et al., 2021），来自临床前和临床试验的几条证据表明，这些益生菌经常被调节，且乳杆菌属可能对分裂症的治疗有益。这进一步指向了乳杆菌属在生物活性上的异质性。解释粪歧杆菌属（Faecalibacterium
    genus）与其他特征的相关性至关重要。


    粪歧杆菌属与分裂症患者较低的抑郁症状和整体功能之间存在微弱但显著性。这与重度抑郁症患者粪歧杆菌丰度降低的发现不一致（参见Kues等人，2013年的综述）。此外，Jing和Wang（2015）的研究还揭示了乳杆菌丰度与抑郁症状之间存在负相关。这种差异的潜在解释尚不清楚。需要注意的是，分裂症和重度抑郁症是不同的疾病。


    最重要的是，目前的结果首次表明，分裂症患者的肠道变化可能与乳杆菌丰度的增加有关。与压力暴露不同，我们报告的研究中，分裂症患者每一类乳杆菌的比例均更高，而由于（某种原因）粪歧杆菌的丰度下降（Zheng
    et al., 2020）。将乳杆菌丰度与分裂症联系起来的机制尚不清楚。多重早期生活（母亲缺失、断奶和不可预测的慢性微应激）对小鼠乳杆菌的丰度显示出压力特异性影响（Runcel等.,
    2019）。


    本研究存在需要考虑的局限性。我们的样本量不大，因此出现了假阴性和假阳性结果。此外，关于Regparavel与情绪稳定剂使用之间的关联也应予以考虑。另一点是，本研究使用的16S
    rRNA测序不足以分析特定的细菌菌。因此，正如Neearing等（2022）所示，我们的研究重点在属水平。我们目前将分裂症与肠道微生物群联系起来的发现，可能排除掉：AKIs的影响仅仅反映了与童年社会劣势相关的因素的影响。患者的社会史，包括早期养、教育和社会经济地位（Smith
    et al., 2015）。对于父母教育，不能排除社会经济地位的其他因素（包括收入、家庭环境和医疗设施质量）能更好地解释社会经济地位（2019）。家族性分裂症与婴儿和儿童的肠道微生物群有关（Levis
    et al., 2021）。尽管这些因素，AKIs可能会塑造健康的肠道微生物群，从而导致分裂症的发展（Gao et al., 2021）。另一个局限性是，研究基于对压力暴露和饮食习惯的报告，因此需要考虑真实的偏差。建立因果关系需要纵向性设计。


    总之，目前的结果在很大程度上证实了分裂症患者中乳酸菌丰度增加和产生SCFAs的细菌丰度降低。目前的结果首次表明压力可能导致这些变化。鉴于某些变化可能对临床表现和脂质谱有所帮助，需要开发针对分裂症肠道微生物群变化底层机制的干预措施。也有必要对压力对肠道微生物群影响的特定机制提供见解。


