    使用 t² 或 Fisher 精确检验（用于分类变量）以及 Mann-Whitney U 检验或 t 检验（用于连续变量）评估样本一般特征的组间差异。这些分析测试了零假设，即参与者组在观察到的特征上没有显著差异。双变量特征的显著性设定为
    p < 0.05。数据分析使用 SPSS 版本 28 进行。


    为了检查组间 $\alpha$ 多样性的差异，我们计算了 Shannon（Chao 指数）并与 Kolmogorov-Smirnov 检验（使用 RDP 版本
    18）对比（Amzaeta et al., 2020）。考虑到年龄、BMI 和教育水平对 $\alpha$ 多样性的混杂影响，使用广义线性回归进行测量。每个模型都通过比较具有不同特征变量的模型进行了验证（Wang,
    2007）。


    正如 Neiring 等人（2022）报告的那样，为了识别区分健康和肥胖受试者的最佳特征，我们在精神分裂症患者与健康对照组之间进行了差异丰分析，使用了 11
    种不同的工具：LEFa、metagenose、ANCOM、ANCOMBC、ALDE2、ED-seq2 和 MaAsLin。


    ## 2.3. 暴露评估


    使用成瘾频率问卷（FTND）（Pomerauer et al., 1989）评估了吸烟情况。它包括评估每天吸烟数量、尼古丁摄入时间和偏好的项目。项目评分为
    0 到 1 分，而多选题评分为 0 到 3 分。总分范围从 0 到 30 分，分数越高表示对尼古丁的瘾性越强。


    ## 2.6. 生物材料


    测量了感知压力表以记录上个月的压力情况（Cohen et al., 1988）。它包含 10 个基于 5 点 Likert 量表的项目（0–从不到非常经常）。总分范围从
    0 到 40 分；分数越高感知压力水平越高。


    使用创伤事件检查表（TEC）记录创伤史（Vrijbek et al., 2002）。它由 30 个关于压力事件各种特征的陈述组成。在本研究中，我们分析了情感虐待、身体虐待和性虐待的发生。后者根据“性骚扰”和“性侵待”量表进行分类。不良童年经历（ACEs）史被作为18
    岁前的暴露进行分析。


