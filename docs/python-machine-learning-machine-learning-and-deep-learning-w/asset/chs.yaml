  我们选择了用黑色绘制质心点。\n\n# 第 7 章 - 支持向量机\n\nSVM 属于监督机器学习算法的范畴，被广泛应用于分类和回归问题。它以其处理非线性输入空间的能力而闻名。它在入侵检测、人脸检测、新闻文章、电子邮件和网页的分类、手写识别以及基因分类等应用中被广泛使用。\n\
  \n该算法通过尽可能地分离数据点来工作。最近点之间的距离被称为 `margin`（间隔）。目标是在给定数据集中选择一个在支持向量之间具有最大可能间隔的超平面。\n\
  \n为了最好理解该算法如何工作，让我们先在 Scikit-Learn 库中实现它。我们的目标是预测银行钞票是伪钞还是真。我们将使用钞票的属性，包括图像的方差、图像的偏度、峰度和熵。\n\
  \n\n\n\n\n所有数据属性都如上所示为数值。即使最后一个属性也是数值，因为它的值是 0 或 1。\n\n## 数据预处理\n\n现在是时候将上述数据分为属性、标签以及训练集和测试集了。以下代码将帮助我们把数据划分为属性和标签：\n\
  \n```python\nX = dataset.drop('Class', axis=1) \ny = dataset['Class']\n```\n\n上述第一行帮助我们将数据集中的除类别列以外的所有列存储到变量\
  \ `X` 中。`drop()` 函数帮助我们从中排除了 `Class` 列。第二行则帮助我们将 `Class` 列存储到变量 `y` 中。现在，变量 `X`\
  \ 拥有属性，而变量 `y` 拥有对应的标签。\n\n我们已经实现了将数据集划分为属性和标签的目标。下一步是将数据集划分为训练集和测试集。Scikit-learn\
  \ 有一个名为 `model_selection` 的库，它为我们提供了一个名为 `train_test_split` 的方法，我们可以用它将数据分为训练集和测试集。\n\
  \n首先，让我们导入 `train_test_split` 方法：\n\n```python\nfrom sklearn.model_selection import\
  \ train_test_split\n```\n\n接下来的脚本将帮助我们执行划分：\n\n```python\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y, test_size = 0.20)\n```\n\n### 训练算法\n\n现在数据已经分为训练集和测试集，我们现在应该在训练集上训练\
  \ SVM。Scikit-Learn 自带一个名为 `svm` 的库，其中包含用于各种 SVM 算法的内置类。\n\n在这种情况下，我们将执行一个分类任务，因此我们将使用支持向量分类器类\
  \ (`SVC`)。它接受一个参数，即内核类型。对于简单的 SVM，该参数应设置为“linear”，因为简单的 SVM 只能分类线性可分的数据。\n\n我们将调用\
  \ `SVC` 的 `fit` 方法在我们的训练集上训练算法。训练集应该作为参数传递给 `fit` 方法。让我们先从 Scikit-Learn 导入 `SVC`\
  \ 类：\n\n```python\nfrom sklearn.svm import SVC\n```\n\n现在运行以下代码：\n\n```python\n\
  svc_classifier = SVC(kernel='linear') \nsvc_classifier.fit(X_train, y_train)\n```\n\
  \n## 进行预测\n\n我们应该使用 `SVC` 类来进行预测。注意，预测将在测试数据上进行。以下是进行预测的代码：\n\n```python\npred_y\
  \ = svc_classifier.predict(X_test)\n```\n\n## 评估算法的准确性\n\n在分类任务中，我们使用混淆矩阵、召回率、精确率和\
  \ F1 作为指标。Scikit-Learn 有一个 `metrics` 库，它为我们提供了 `confusion_matrix` 和 `classification_report`\
  \ 方法，可以帮助我们找到这些指标的值。以下代码可以帮助我们找到这些指标的值：\n\n首先，让我们从 Scikit-Learn 库导入上述方法：\n\n```python\n\
  from sklearn.metrics import confusion_matrix, classification_report\n```\n\n这里是帮助进行评估的代码：\n\
  \n```python\nprint(confusion_matrix(y_test,pred_y)) \nprint(classification_report(y_test,pred_y))\n\
  ```\n\n代码返回了以下：\n\n![](img/Image00029.gif)\n\n输出返回了以下：\n\n\n\n\n如果你的网络单元是线性的，那么这个算法对你来说很容易理解。为了获取算法权重的误差导数，它首先应该确定随着单元活动水平的变化，误差的变化率。对于输出单元的情况，误差导数是通过确定真实输出与目标输出之间的差异获得的。要找到输出层之前层中隐藏单元的误差变化率，必须确定该隐藏单元与其连接的所有输出单元之间的权重。然后，我们可以将权重与误差导数相乘，并将这些乘积相加。你得到的和将等于该隐藏单元的误差变化率。一旦你获得了输出层前一层隐藏层权重中的误差变化率，我们就能计算其他层的误差变化率。这些层的计算将从一层到下一层进行，其方向与活动通常在网络中传输的方向相反。这解释了“反向传播（back\
  \ propagation）”名称的由来。计算出某个单元的误差变化率后，就可以更容易计算该权重所有输入连接的权重误差导数。权重导数可以通过误差变化率与输入连接的活动相乘得到。\n\
  \n## 实现\n\n我们需要在 Python 中使用 Scikit-Learn 实现神经网络。我们将使用鸢尾花（iris）数据集来完成这项任务。我们将从以下链接获取此数据集：\n\
