  \n# 第 3 章- 使用 Scikit-Learn\n\n现在你已经完成了安装，可以开始使用这些库了。我们将从 Scikit-Learn 库开始。\n\n要在代码中使用\
  \ scikit-learn，你应该先通过运行此语句来导入它：\n\n```python\nimport sklearn\n```\n\n## 加载数据集\n\n\
  机器学习的核心在于分析数据集。在此之前，我们应该首先将数据集加载到工作区中。该库自带了许多我们可以加载和处理的数据集。我们将通过使用名为 `Iris` 的数据集来演示。这是一个花类的数据集。以下代码展示了如何使用\
  \ scikit-learn 加载数据集：\n\n```python\n## Import scikit-learn library\nfrom sklearn\
  \ import datasets\n\n## Load iris dataset\niris = datasets.load_iris()\n\n## Confirm\
  \ by printing the shape of the data\nprint(iris.data.shape)\n```\n\n代码返回以下内容：\n\n\
  ![](img/Image00004.gif)\n\n上面的输出显示数据集有 150 行 4 列。若要在 Python 终端上打印所有数据，请运行以下语句：\n\
  \n```python\nprint(iris.data)\n```\n\n![](img/Image00005.gif)\n\n# 第 4 章- 使用 Scikit-Learn\
  \ 进行线性回归\n\n我们需要详细讨论线性回归，并查看如何使用 scikit-learn 库来实现它。\n\n在线性代数中，“线性”一词被用于表示两个甚至多个变量之间的关系。如果这种关系在二维空间中表示，我们就会得到一条直线。\n\
  \n考虑一种情况：我们需要确定学生学习考试的小时数与学生在考试中得分百分比之间的线性关系。如果我们已知学生准备考试的小时数，我们需要能够判断学生可以获得的分百分比。如果将自变量（`hours`）绘制在\
  \ x 轴上，而将因变量（`percentage`）绘制在 y 轴上，线性回归将给出一条代表点最佳拟合的直线。\n\n直线的方程由以下公式给出：\n\n`y =\
  \ mx + b`\n\n在上述方程中，`m` 代表斜率，而 `b` 代表截距。这意味着线性回归算法为我们提供了斜率和截距的最优值。（此处重复内容已省略）\n\n\
  \n\n`X` 变量将存储属性。注意，我们使用了 `-1`，因为我们需要将除最后一列（即 `Marks`）之外的所有列都分配给属性。`y` 变量将存储标签。在这里，我们使用了\
  \ `1`，因为 `Marks` 所在的列索引为 `1`。请记住列索引是从 `0` 开始的。\n\n此时，我们已经拥有了数据集的属性和标签。我们需要将数据分为两个部分，即训练集和测试集。Scikit-Learn\
  \ 库为我们提供了一个名为 `train_test_split()` 的方法，可以用于此操作。它可以像下面所示使用：\n\n首先，从 Scikit-Learn\
  \ 导入上述方法：\n\n```\nfrom sklearn.model_selection import train_test_split \n```\n\n\
  现在，运行以下语句：\n\n```\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=0)\n```\n\n注意参数 `test_size` 使用了 `0.2`。这意味着 20% 的数据将用作测试集，而其余 80%\
  \ 的数据将用作训练集。\n\n### 训练算法\n\n我们将使用从 Scikit-Learn 导入的 `LinearRegression` 类来训练算法。导入方式如下：\n\
  \n```\nfrom sklearn.linear_model import LinearRegression \n```\n\n现在我们已经导入了该类，我们需要实例化它并给该实例命名为\
  \ `linear_regressor`。下文所示：\n\n```\nlinear_regressor = LinearRegression() \n```\n\
  \n现在让我们调用 `fit()` 方法并将训练数据传递给它：\n\n```\nlinear_regressor.fit(X_train, y_train) \n\
  ```\n\n正如我们之前所说，线性回归通过寻找斜率和截距的最佳值来工作。这正是我们上面所做的。这两个值已经计算出来，我们只需要查看它们的值。\n\n要查看截距，请运行以下命令：\n\
  \n```\nprint(linear_regressor.intercept_) \n```\n\n这将返回以下内容：\n\n![](img/Image00010.gif)\n\
  \n我们现在可以通过运行以下命令查看斜率的值：\n\n![](img/Image00011.gif)\n\n这意味着如果学生多学习一小时，他们的分数将增加 9.91%。\n\
  \n## 预测\n\n在上面的训练中，我们创建了一个线性回归模型，即该方程。斜率和截距的值是已知的。我们可以根据保留的训练集数据进行预测。以下语句帮助我们从测试数据进行预测：\n\
  \n```\npred_y = linear_regressor.predict(X_test ) \n```\n\n我们简单地创建了一个名为 `predict_y`\
  \ 的 `numpy` 数组。它将包含来自 `X_test` 系列中输入值的所有 `y` 的预测值。\n\n现在我们既有 `X_test` 的实际值，也有了预测值。我们需要比较这二者，查看它们之间的相似程度或差异。只需运行以下代码即可：\n\
  \n```\ndf = pd.DataFrame({'Actual': y_test, 'Predicted': pred_y}) \nprint(df)\n\
  ```\n\n它返回了以下结果：\n\n模型并不准确，但数值彼此接近。\n\n## 评估准确性\n\n我们现在需要评估算法的准确性。我们需要确定算法在数据集上的表现如何。在涉及回归算法时，会使用三种评估指标。这些包括：\n\
  \n1. `MAE`（平均绝对误差）- 这是误差绝对值的均值。\n2. `MSE`（均方误差）- 这是误差平方的均值。\n3. `RMSE`（均方根误差）- 这是均方误差的平方根。\n\
  \n为了计算这些指标，我们通常使用 `sklearn.metrics` 模块。\n\n以下是这些指标的计算方法示例：\n\n1. `MAE`: `metrics.mean_absolute_error`\n\
  2. `MSE`: `metrics.mean_squared_error`\n3. `RMSE`: `np.sqrt(metrics.mean_squared_error)`\n\
  \n\n\n\n\n`X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=0)` \n\n我们现在有了训练集和测试集。\n\n### 训练算法\n\n现在我们需要训练算法。这可以通过像之前一样调用 `fit()`\
  \ 方法来实现。让我们先从 Scikit-Learn 库中导入 `LinearRegression` 类：\n\n```python\nfrom sklearn.linear_model\
  \ import LinearRegression\n```\n\n接下来，创建上述类的实例，然后使用它调用 `fit()` 方法：\n\n```python\n\
  linear_regressor = LinearRegression()\nlinear_regressor.fit(X_train, y_train)\n\
  ```\n\n注意，这是一个多元线性回归，我们有许多变量。线性回归模型必须为每个属性找到最优系数。你可以通过运行以下命令来查看选定的系数：\n\n```python\n\
  coeff = pd.DataFrame(linear_regressor.coef_, X.columns, columns=['Coefficient'])\n\
  print(coeff)\n```\n\n代码返回以下内容：\n\n![](img/Image00016.gif)\n\n这意味着燃油税（fuel Tax）每增加一个单位，燃油消耗量就会减少\
  \ 4002 万加仑。此外，拥有驾照的人口比例每增加一个单位，燃油消耗就会增加 13.4 亿加仑。结果还显示，平均收入（Income）和公路（Highways）对燃油消耗的影响非常小。\n\
  \n## 预测\n\n我们将使用测试数据进行预测。以下脚本可以帮助我们完成操作：\n\n```python\npred_y = linear_regressor.predict(X_test)\n\
  ```\n\n此时，你已经有了实际的 `X_text` 值以及预测值。我们需要对这二者进行比较，以确定它们的相似性和差异。这可以通过运行以下脚本来实现：\n\n\
  ```python\ndf = pd.DataFrame({'Actual': y_test, 'Predicted': pred_y})\nprint(df)\n\
  ```\n\n脚本返回以下输出：\n\n![](img/Image00017.gif)\n\n## 评估算法的准确性\n\n现在我们需要从性能角度评估算法。这可以通过确定各种类型错误的值来实现。这些错误包括\
  \ MAE、RMSE 和 MSE。这要求我们如下所示从 Scikit-Learn 导入 `metrics` 类：\n\n```python\nfrom sklearn\
  \ import metrics\n```\n\n然后可以使用以下脚本计算误差值：\n\n```python\nprint('MAE:', metrics.mean_absolute_error(y_test,\
  \ pred_y))\nprint('MSE:', metrics.mean_squared_error(y_test, pred_y))\nprint('RMSE:',\
  \ np.sqrt(metrics.mean_squared_error(y_test, pred_y)))\n```\n\n代码返回以下内容：\n\n![](img/Image00018.gif)\n\
  \n如上所示，均方根误差（root means square error）值为 68.31。这略大于所有州燃油消耗平均值的 10%。确实，我们的算法并不十分准确，但我们仍然可以使用它做预测。\n\
  \n巨大的误差可能是由多种因素造成的。也许需要更多的数据。我们只使用了一年的数据。收集多年的数据可能有助于帮助我们提高模型的准确性。此外，我们假设数据之间存在线性关系。事实可能并非如此，因此导致了巨大的误差。我建议你对数据进行可视化以查看是否真实。此外，我们使用的特征之间可能并不相关。\n\
  \n# 第 5 章 - K 近邻算法\n\n`KNN` 算法被广泛用于构建更复杂的分类器。它是一种简单的算法，但它的性能优于许多强大的分类器。这就是为什么它被应用于数据压缩、经济预测和遗传学等众多领域。\n\
  \n`KNN` 是一种监督学习算法，这意味着我们得到了一个由训练观测值 (`x`, `y`) 组成的标记数据集，我们的目标是确定 `x` 和 `y` 之间的关系。这意味着我们应该找到一个将\
  \ `x` `maps` 到 `y` 的函数，使得当我们给定输入值 `x` 时，能够预测出对应的 `y` 值。\n\n`KNN` 算法的原理非常简单。它计算新数据点到所有其他训练数据点的距离。距离可以是多种类型，包括曼哈顿距离、欧几里得距离等。选择\
  \ K 个最近的数据点，其中 `K` 可以是任意整数。最后，将数据点分配给大多数 `K` 个数据点所属的类别。\n\n我们将使用一个名为 `Iris` 的数据集。我们之前探索过它。我们将用它来演示如何实现\
  \ `KNN` 算法。该数据集由四个属性组成，即 `sepal-width`（花萼宽）、`sepal-length`（花萼长）、`petal-width`（瓣宽）和\
  \ `petal-length`（瓣长）。每种鸢尾花都有特定的属性。我们的目标是预测植物所属的类别。数据集有三个类别：`Iris-setosa`、`Iris-versicolor`\
