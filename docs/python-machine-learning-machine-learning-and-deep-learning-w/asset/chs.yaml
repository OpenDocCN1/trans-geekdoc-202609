  \ `K` 值，并观察它对预测准确性的影响。\n\n# 第 6 章 - K-Means 聚类\n\n聚类属于无监督机器学习算法的范畴。它通常在数据没有标签时应用。该算法的目标是识别数据中的簇或组。\n\
  \n聚类的核心思想是：同一个簇中的对象彼此之间与其他簇中的对象更相关。相似性是反映两个数据对象之间关系强度的指标。聚类在探索性数据挖掘中应用非常广泛。它应用于模式识别、机器学习、信息检索、图像分析、数据压缩、生物信息学和计算机图形等多个领域。\n\
  \n算法根据数据值之间的相似性形成数据簇。你需要指定 `K` 值，即你期望算法从数据中产生的簇数量。算法首先为每个簇选择一个质心值。然后，以迭代的方式执行三个步骤：\n\
  \n1. 计算每个数据实例与所有簇质心之间的欧几里得距离。\n2. 将数据实例分配给距离最近质心所在的簇。\n3. 根据相应簇数据实例坐标的平均值计算新的质心值。\n\
  \n在在 Scikit-Learn 上实现之前，让我们先手动演示一下该算法是如何工作的：\n\n假设我们有如下的二维数据实例并命名为 `D`：\n\n`D =\
  \ { (5,3), (10,15), (15,15) }`\n\n\n\n\n现在我们应该准备要使用的数据。我们将创建一个总共 10 行 2 列的 numpy\
  \ 数组。那么，为什么要选择使用 numpy 数组呢？因为 Scikit-Learn 库可以直接处理 numpy 数组数据输入，而无需预处理。让我们创建它：\n\
  \n```\nX = np.array([[5,3], [10,15], [15,12], [24,10], [30,45], [85,70], [71,80],\
  \ [60,78], [55,52], [80,91]])\n```\n\n## 数据可视化\n\n现在我们有了数据，可以创建一个图表并观察数据点的分布情况。然后我们将能够判断目前是否存在聚类：\n\
  \n```python\nplt.scatter(X[:,0],X[:,1], label='True Position')\nplt.show()\n```\n\
  \n代码输出了下面的图表：\n\n![](img/Image00022.gif)\n\n如果我们仅用肉眼观察，可能会从上述数据中看出两个聚类：底部有五个点，顶部也有五个点。现在我们需要调查一下是否这就是\
  \ K-Means 聚类算法所做的。\n\n## 创建聚类\n\n我们已经看到从数据点中形成两个聚类，因此 `K` 的值现在为 2。这两个聚类可以通过运行以下代码来创建：\n\
  \n```python\nkmeans_clusters = KMeans(n_clusters=2)\nkmeans_clusters.fit(X)\n```\n\
  \n我们创建了一个名为 `kmeans_clusters` 的对象，并将 `2` 作为参数 `n_clusters` 的值。然后我们在该对象上调用了 `fit()`\
  \ 方法，并将 numpy 数组中的数据作为参数传递给该方法。\n\n现在我们可以查看算法为最终聚类创建的质心值：\n\n```python\nprint (kmeans_clusters.cluster_centers_)\n\
  ```\n\n这返回了以下内容：\n\n![](img/Image00023.gif)\n\n上面的第一行给出了第一个质心的坐标，即 (16.8, 17)。第二行给出了第二个质心的坐标，即\
  \ (70.2, 74.2)。如果你按照手动过程计算这些值，结果应该是相同的。这将表明 K-Means 算法运行良好。\n\n以下脚本将帮助我们查看数据点的标签：\n\
  \n```python\nprint(kmeans_clusters.labels_)\n```\n\n这返回了以下内容：\n\n![](img/Image00024.gif)\n\
  \n上面的输出显示了一个包含 10 个元素的一维数组，对应分配给 10 个数据点的聚类。你可以清楚地看到，首先有一串零，显示前 5 个点被聚类在一起，而最后 5\
