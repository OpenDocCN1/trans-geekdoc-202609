  \n机器学习源于模式识别以及计算机能够从数据中学习的理论。人工智能领域的研究想要确定计算机是否能够从数据中学习。机器学习是一种迭代方法，这就是为什么模型在接触新数据时能够进行适应。模型从它们之前的计算中学习，以便提供可重复、可靠的结果和决策。\n\
