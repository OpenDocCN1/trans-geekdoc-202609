  \ 参数。该参数的目的是设置网络运行的迭代次数或轮数（epochs）。默认使用“relu”激活函数配合“adam”代价优化器。然而，这些函数可以通过 `activation`\
  \ 和 `solver` 参数分别更改。\n\n然后我们调用了 `fit` 方法，在我们的训练数据（即 `X_train` 和 `y_train`）上训练算法。\n\
  \n现在算法已经在训练数据上训练完成，我们可以在测试数据上进行预测。这可以通过运行下面的脚本来实现：\n\n```python\npredictions = mlp_classifier.predict(X_test)\n\
  ```\n\n\n\n\n## 算法准确性评估\n\n算法已经过训练，并在测试数据上进行了预测。现在是时候评估一下它的性能如何了。评估将使用混淆矩阵、精确率、召回率和\
  \ F1 分数等指标进行。我们应该将预测得到的值与收集到的实际值进行比较。\n\n首先，让我们从 Scikit-Learn 的指标库导入 `classification_report`\
