  \ 创建查找表\n    zero = tf.constant(0, dtype=tf.float32)\n    where = tf.not_equal(input_layer,\
  \ zero)\n    ## 返回查找表\n    indices = tf.where(where)\n    values = tf.gather_nd(input_layer,\
