  trans: "\n\n## 算法准确性评估\n\n算法已经过训练，并在测试数据上进行了预测。现在是时候评估一下它的性能如何了。评估将使用混淆矩阵、精确率、召回率和\
    \ F1 分数等指标进行。我们应该将预测得到的值与收集到的实际值进行比较。\n\n首先，让我们从 Scikit-Learn 的指标库导入 `classification_report`\
    \ 和 `classification_matrix` 方法：\n\n```python\nfrom sklearn.metrics import confusion_matrix,\
    \ classification_report\n```\n\n然后，可以通过运行以下脚本完成评估：\n\n```python\nprint(confusion_matrix(y_test,predictions))\
    \ \nprint(classification_report(y_test,predictions)) \n```\n\n该脚本返回以下结果：\n\n![](img/Image00035.gif)\n\
    \n上述结果良好。混淆矩阵显示，在所有 30 植物中，只有一植物被分类错误了。我们的 F1 分数为 0.97，考虑到我们只有 150 个实例来训练神经网络，这是一个非常不错的。每当你得到的准确率达到\
    \ 90% 及以上时，你就可以认为性能良好。\n\n# 第 9 章 - 随机森林算法\n\n这是一种基于集成学习（ensemble learning）的监督学习算法。集成学习是指将不同类型的算法或同一种算法多次组合，以获得更强大的预测模型。随机森林算法是许多相似类型算法的组合，即多棵决策树，形成了一片树森林，这解释了“随机森林”名称的来源。随机森林算法既可以应用于回归问题也可以应用于分类问题。\n\
    \n## 工作原理\n\n随机森林算法在工作时遵循以下基本步骤：\n\n1. 从数据集中随机选择 `N` 条随机记录。\n2. 根据这些 `N` 条随机记录构建一个决策树。\n\
    3. 选择算法中需要的树的数量，并重复上述两个步骤。\n4. 如果是回归问题，对于一条新记录，森林中的每棵树都将为 `Y`（输出）预测一个值。我们可以通过取森林中所有树的所有预测值的平均值来计算最终值。或者，对于分类问题，森林中的每棵树都应该预测新记录所属的类别。新记录最终被分配给获得多数票的类别。\n\
    \n## 随机森林与回归问题\n\n在本章中，我们将向你如何使用 Scikit-Learn 中的随机森林解决回归问题。我们将使用之前用过的燃料消耗数据集。燃油消耗将根据燃料税（分）、人均收入（美元）、铺设过的公路（英里）和持有驾驶执照的人口比例等因素进行预测。\n\
    \n首先，让我们导入 `numpy` 和 `pandas` 库：\n\n```python\nimport pandas as pd \nimport numpy\
    \ as np \n```\n\n我已经将数据集保存在与 Python 脚本相同的目录下，名为 `fuel_consumption.csv`。运行以下命令将其导入\
    \ Pandas 数据帧：\n\n```python\ndataset = pd.read_csv('fuel_consumption.csv') \n```\n\
    \n通过对数据运行 `head()` 函数来查看数据集中包含的内容：\n\n```python\nprint(dataset.head())\n```\n\n\
    这可能会给你一个错误。像通常一样解决错误，直到你得到以下代码：\n\n```python\nimport pandas as pd \nimport numpy\
    \ as np \nimport sys\n\nsys.__stdout__=sys.stdout\n\ndataset = pd.read_csv('fuel_consumption.csv')\
    \ \nprint(dataset.head())\n```\n\n这返回了以下：\n\n![](img/Image00036.gif)\n\n上述数据显示数值没有很好地缩放。我们稍后必须这样做。\n\
    \n### 数据准备\n\n现在是时候将数据集分为我们需要的内容了。首先，我们将数据集分为所需的部分。现在我们需要将数据和标签分为训练集和测试集。我们将使用以下代码来划分属性和标签：\n\
    \n```python\nX = dataset.iloc[:, :4]\ny = dataset.iloc[:, 4]\n```\n\n我们现在将数据分为训练集和测试集。80%\
    \ 的数据用于训练，20% 用于测试。\n\n让我们先导入 `train_split` 方法：\n\n```python\nfrom sklearn.model_selection\
    \ import train_split\n```\n\n接下来的代码将完成划分：\n\n```python\nX_train, X_test, y_train,\
    \ y_test = train_split(X, y, test_size=0.2, random_state=0)\n```\n\n### 特征缩放\n\
    \n此时数据还没有缩放。我们需要使用 Scikit-Learn 提供的 `StandardScaler` 类来完成。让我们先导入这个类：\n\n```python\n\
    from sklearn.preprocessing import StandardScaler\n```\n\n现在我们可以创建该类的实例并使用它来缩放数据集：\n\
    \n```python\nscaler_scaler = StandardScaler()\nX_train = scaler_scaler.fit_transform(X_train)\n\
    X_test = scaler_scaler.transform(X_test)\n```\n\n### 训练算法\n\n数据现在已经缩放。我们现在应该训练随机森林来帮助解决回归问题。让我们先导入\
    \ `RandomForestRegressor` 类：\n\n```python\nfrom sklearn.ensemble import RandomForestRegressor\n\
    ```\n\n现在现在创建该类的实例并在测试数据集上进行预测：\n\n```python\nrf_regressor = RandomForestRegressor(n_estimators=20,\
    \ random_state=0)\nrf_regressor.fit(X_train, y_train)\npred_y = rf_regressor.predict(X_test)\n\
    ```\n\n当你需要使用随机森林解决回归问题时，可以使用 `RandomForestRegressor`。注意上述示例中的 `n_estimators`，它仅仅指定了树的数量。我们使用了\
    \ 20 棵树。\n\n### 评估算法性能\n\n现在是时候评估算法的表现如何了。这是一个回归问题，所以我们使用的指标包括平均绝对误差 (MAE)、均方误差\
    \ (MSE) 和均方根误差 (RMSE)。\n\n首先，从 Scikit-Learn 导入指标：\n\n```python\nfrom sklearn import\
    \ metrics\n```\n\n接下来的脚本将帮助你获得上述指标的值：\n\n```python\nprint('MAE:', metrics.mean_absolute_error(y_test,\
    \ pred_y)) \nprint('MSE:', metrics.mean_squared_error(y_test, pred_y)) \nprint('RMSE:',\
    \ np.sqrt(metrics.mean_squared_error(y_test, pred_y))) \n```\n\n代码返回以下输出：\n\n\
    ![](img/Image00037.gif)\n\n我们使用了 20 棵树，给出的均方根值为 64.93。这个值大于平均燃料消耗的 10%。这表明我们使用的树不够。\n\
    \n你应该知道，随着树或估计器数量的增加，误差值会减少。\n\n## 随机森林与分类问题\n\n我们需要演示如何使用随机森林解决分类问题。我们将使用银行票数据集来预测银行票是否为真。我们将取决于钞票的四个属性，包括图像波变换图像的方差、熵、偏度和峰度。虽然这是一个二分类问题，但我们将使用随机森林分类器来解决它。首先，让我们导入解决问题所需的库：\n\
    \n```python\nimport numpy as np\nimport pandas as pd \n```\n\n我已将数据集命名为 `bank_note.csv`\
    \ 并保存在与 Python 脚本相同的目录下。以下脚本可以帮助我导入数据集：\n\n```python\ndataset = pd.read_csv(\"\
    bank_note.csv\")\n```\n\n"
