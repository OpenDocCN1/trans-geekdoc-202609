    Chapter 5- k-Nearest Neighbors Algorithm


    The KNN algorithm is highly used for building more complex classifiers. It is
    a simple algorithm but it has outperformed many powerful classifiers. That is
    why it is used in numerous applications data compression, economic forecasting,
    and genetics.


    KNN is a supervised learning algorithm, which means that we are given a labeled
    dataset made up of training observations (x, y) and our goal is to determine the
    relationship between x and y . This means that we should find a function that
    x to y such that when we are given an input value for x , we are able to predict
    the corresponding value for y .


    The concept behind the KNN algorithm is very simple. It calculates the distance
    of the new data point to all the other training data points. The distance can
    be of various types including Manhattan, Euclidean etc. The K-nearest data points
    are chosen, in which K can be any integer. Finally, the data point is assigned
    to the class in which most of the K data points belong to.


    We will use a dataset named Iris. We had explored it previously. We will be using
    this to demonstrate how to implement the KNN algorithm. This dataset is made up
    of four attributes namely sepal-width, sepal-length, petal-width and petal-length
    . Each type of the iris plant has certain attributes. Our goal is to predict the
    class to which a plant belongs to. The dataset has three classes Iris-setosa ,
    Iris-versicolor , and Iris-virginica .


