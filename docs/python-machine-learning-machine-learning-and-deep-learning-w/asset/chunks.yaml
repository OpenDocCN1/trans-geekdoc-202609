    \ command:\n\nconda create -n tensorenviron\n\nYou will be asked whether to allow\
    \ the process of creating the environment to continue or not. Type “y” and hit\
    \ the enter key on the keyboard. The installation will continue successfully.\n\
    \n![](Image00002.gif)\n\nAfter creating an environment, we should activate it\
    \ so that we may be able to use it. The activation can be done using the activate\
    \ command followed by the name of the environment as shown below:\n\nactivate\
    \ tensorenviron\n\nNow that you have activated the TensorFlow environment, you\
    \ can go ahead and install TensorFlow package in it. You can achieve this by running\
    \ the following command:\n\nconda install tensorflow"
  toc: []
  trans: '

    Scikit-learn 通过一致的 Python 接口为用户提供了许多监督和无监督学习算法。它最初由 David Cournapeau 在 2007 年作为
    Google Summer of code 项目开发。Scikit-learn 适用于学术和商业用途。


    Scikit-learn 一直作为 Python 中的机器学习库被使用。它包含了许多分类、回归和聚类算法，包括梯度提升、支持向量机 (SVMs)、随机森林、k
    均值和 DBSCAN。Scikit-learn 设计用于与包括 `Numpy` 和 `SciPy` 在其他 Python 库一起使用。


    该库本身用 Python 编写，其中一些算法用 `Cython` 编写以提供更好的性能。Scikit-learn 是构建机器学习模型的良好库。该库是开源的，并采用
    BSD 协议许可。


    # 什么是 TensorFlow？


    TensorFlow 是 Google 的一个框架，用于创建深度学习模型。TensorFlow 依赖数据流图进行数值计算。TensorFlow 让机器学习变得简单。它让获取数据、训练机器学习模型、做出预测和修改未来结果的过程变得容易。


    该库由 Google 的 Brain 团队开发，用于大规模机器学习。TensorFlow 将机器学习和深度学习算法及模型结合在一起，并通过一个共同的比喻使它们变得非常有用。TensorFlow
    使用 Python 为用户提供了一个前端 API，可用于构建应用程序，而应用程序在高性能 `C++` 中执行。


    TensorFlow 可用于构建、训练和运行用于图像识别、手写数字分类、循环神经网络、词嵌入、自然语言处理等领域的深度神经网络。


    # 第 2 章- 环境搭建


    在进入机器学习和深度学习的实践部分之前，我们需要安装两个库，即 Scikit-Learn 和 TensorFlow。


    ## 安装 Scikit-Learn


    Scikit-learn 支持 `Python 2.7` 及以上版本。在安装 Scikit-learn 之前，确保你已经安装了 `Numpy` 和 `SciPy`
    库。此外，确保你拥有这些库的最新版本。一旦安装了这些，你就可以在你的机器上安装 Scikit-learn。


    这些库的安装可以使用 `pip` 完成。`Pip` 是 Python 自带的工具，这意味着安装 Python 后，你就获得了 `pip`。要安装 scikit-learn，请在操作系统的终端上运行以下命令：


    ```

    pip install scikit-learn

    ```


    安装应该运行并完成。


    你也可以使用 `conda` 来安装 scikit-learn。这可以通过运行以下命令来实现：


    ```bash

    conda install scikit-learn

    ```


    一旦 `sckit-learn` 安装完成，你需要将其导入到 Python 程序中以使用它的算法。这可以通过如下所示的 `import` 语句来实现：


    ```python

    import sklearn

    ```


    如果命令运行且没有错误，则说明 scikit-learn 安装成功。如果命令生成了错误，请注意安装未成功。你现在可以使用 scikit-learn 创建你自己的机器学习模型了。


    ## 安装 TensorFlow


    TensorFlow 提供了适用于 `C++`、`Haskell`、`Go`、`Java`、`Rust` 等编程语言的 API，并带有一个名为 `tensorflow`
    的 R 语言第三方包。我们将指导你如何在 Windows 上安装 TensorFlow。在 Windows 上，可以使用 `pip` 或 `Anaconda`
    安装 TensorFlow。


    原生的 `pip` 将把 TensorFlow 安装在你的系统上，而无需经过虚拟环境。

    '
