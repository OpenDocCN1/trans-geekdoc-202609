    \ an underscore\n\nprint(clf.coef\\_ )\n\nThe code will return the following output:\n\
    \n![](Image00030.gif)\n\nWe now have the predicted values for our data. Note that\
    \ we imported both datasets and svm from the scikit-learn library. After loading\
    \ the dataset, a model was fitted/created by learning patterns from the data.\
    \ This was done by calling the fit() method. Note that the LinearSVC() method\
    \ helps us to create an estimator for the support vector classifier, on which\
    \ we are to create the model. We have then passed in new data for which we need\
    \ to make a prediction.\n\nChapter 8- Neural Networks with Scikit-learn \n\nNeural\
    \ networks are a machine learning framework that tries to mimic the way the natural\
    \ biological neural networks operate. Humans have the capacity of identifying\
    \ patterns with a very high degree of accuracy. Anytime you see a cow, you can\
    \ immediately recognize that it is a cow. This also applies to when you see a\
    \ goat. The reason is that you have learned over a period of time how a cow or\
    \ a goat looks like and what differentiates between the two.\n\nArtificial neural\
    \ networks refer to computation systems that try to imitate the capabilities of\
    \ human learning via a complex architecture that resembles the nervous system\
    \ of a human being.\n\n## The structure of Neuron\n\nA neutron is made up of the\
    \ cell body, having a number of extensions from it. Majority of these are in the\
    \ form of branches commonly known as “dendrites”.\n\nA long process or a branching\
    \ exists, and this is referred to as the “axon”. The transmission of signals begins\
    \ at a region in this axon, and this region is known as the “hillock”.\n\nThe\
    \ neuron has a boundary which is known as the “cell membrane”. A potential difference\
    \ exists between the inside and the outside of the cell membrane. This is known\
    \ as the “membrane potential”.\n\nIf the input becomes large enough, some action\
    \ potential will be generated. This action potential then travels will then travel\
    \ down the axon and away from the cell body.\n\nA neuron is connected to another\
    \ neuron by synapses.  The information leaves the neuron via an axon and is then\
    \ passed to the synapses and to the neuron which is expected to receive it. Note\
    \ that a neuron will only fire once the threshold exceeds a certain amount. The\
    \ signals are very important as they are received by the other neurons. The neurons\
    \ use the signals or the spikes for communication. The spikes are also responsible\
    \ for encoding the information which is being sent.\n\nSynapses can either be\
    \ inhibitory or excitatory. When spikes arrive at the excitatory synapse, the\
    \ receiving neuron will be caused to fire. If the signals are received at an inhibitory\
    \ synapse, then the receiving neuron is inhibited from firing.\n\nThe synapses\
    \ and the cell body usually calculate the difference the incoming inhibitory and\
    \ excitatory inputs. If this difference is found to be too large, the neuron will\
    \ be made to fire.\n\n## Back Propagation\n\nFor you to train a neural network\
    \ to perform a task, the units of each unit must be adjusted so that we can reduce\
    \ the error between the actual output and the target output. This means that the\
    \ derivative of the weights must be computed by the network. To make it simple,\
    \ the network has to monitor the changes in error as the weights are being increased\
    \ or decreased. The backpropagation algorithm is the one which is widely used\
    \ in the calculation of this error."
