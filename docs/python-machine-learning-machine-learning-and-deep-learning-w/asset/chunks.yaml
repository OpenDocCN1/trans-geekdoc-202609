    import numpy as np 


    import pandas as pd


    import matplotlib.pyplot as plt 


    We now need to load the dataset into our working environment. Download it from
    the following URL:


    [https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data](https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data)


    We need to load the dataset from the above URL and store it in a Pandas data frame.
