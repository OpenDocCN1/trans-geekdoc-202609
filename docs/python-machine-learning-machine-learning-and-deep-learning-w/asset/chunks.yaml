    We have just used three lines of code to create a neural network. That is great!
    Notice the use of the hidden\_layer\_sizes parameter. We have used it to create
    three hidden layers for the network each with 10 nodes. There is no rule that
    limits from choosing only a certain number of layers and nodes for your neural
    network. These vary depending on the nature of the problem in question. You can
    try a number of different combinations and see what works best for you.


    We have also used the max\_iter parameter. The purpose of this parameter is to
    set the number of iterations or epochs that you need your network to run. The
    “relu” activation function is used by default together with the “adam” cost optimizer.
    However, these functions can be changed using activation and solver parameters
    respectively.


    We have then called the fit method which trains the algorithm on our training
    data, that is, X \_train and y \_train.


    Now that algorithm has been trained on the training data, we can make predictions
    on the test data. This can be done by running the script given below:


    predictions = mlp\_classifier.predict(X\_test) '
