    If you are having your network units being linear, then this algorithm will be
    easy for you to understand. For the algorithm to get the error derivative of the
    weights, it should first determine the rate at which the error is changing as
    the unit’s activity level is being changed. For the case of the output units,
    the error derivative is obtained by determining the different between the real
    and the target output. To find the error change rate for the hidden unit in a
    layer which id before the output layer, all weights between the hidden unit and
    the output units which it has been connected to have to be determined. We can
    then go ahead and multiple the weights by error derivatives in the weights and
    then the product is added together. The sum you get will be equal to the error
    change rate for the hidden unit. Once you have obtained the error change rate
    in the weights of the hidden layer which is just before the output layer, we will
    be capable of calculating the error change rate for the other layers. The calculation
    of this for these will be done from layer to the next layer, and in a direction
    which is opposite to the direction in which the activities are usually transmitted
    through the network. This explains where the name back propagation” comes from.
    After the error change rate has been calculated for some unit, the error derivative
    for the weights for all the incoming connections of the weight can be calculated
    more easily. The error derivative for the weights can be obtained by multiplying
    the rate of error change with the activity via the incoming connection.


    ## Implementation


    We need to implement a neural network with Scikit-Learn in Python. We will use
    the iris dataset for this task. We will be getting this dataset from the following
    link:


    [https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data](https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data)


    First, import the necessary libraries into your workspace:


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    Next, let us load the data from the above URL into the pandas data frame:


    ```python

    # create a variable for the dataset url

    iris_url = "https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data"


    # Assign column names to the dataset

    names = [''Slength'', ''Swidth'', ''Plength'', ''Pwidth'', ''Class'']


    # Load the dataset from the url into a pandas dataframe

    dataset = pd.read_csv(iris_url, names=iris_names)

    ```


    Note that the dataset has been loaded into a pandas data frame named `dataset`
    and columns have also been assigned to the dataset. Let us call the `head()` function
    on the data to be sure it has been loaded:


    ```python

    print(dataset.head())

    ```


    You may get an error. Solve it by writing the code as follows:


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    import sys


    sys.__stdout__ = sys.stdout


    # create a variable for the dataset url

    iris_url = "https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data"


    # Assign column names to the dataset

    iris_names = [''Slength'', ''Swidth'', ''Plength'', ''Pwidth'', ''Class'']


    # Load the dataset from the url into a pandas dataframe

    dataset = pd.read_csv(iris_url, names=iris_names)


    print(dataset.head())

    ```


    The code will return the following:


    ![](Image00031.gif)


    This shows that the data was loaded successfully.


    ## Preprocessing the Data


    The dataset has 5 columns, and our goal is to predict the fifth column, that is,
    Class. Let us subdivide the dataset into attributes and labels:


    ```python

    X = dataset.iloc[:,, 0:4]

    y = dataset.select_dtypes(include=[object])

    ```


    The data in the first four columns have been assigned to the variable `X`. These
    are the attributes. The data in the fifth column has been assigned to variable
    `y`. This forms the label.


    You can have a look of how variable `y` looks like by running the following command:


    ```python

    y.head()

    ```


    ![](Image00032.gif)


    You can see that the variable `y` has categorical values. However, the neural
    networks are known to work well with numerical data, hence we should convert the
    above into numerical values. First, let us see the number of unique values that
    we have in variable `y`:


    ```python

    y.Class.unique()

    ```


    ![](Image00033.gif)


    The above output shows that we have three unique categories, that is, Iris-versicolor
    and Iris-virginia. We should now convert these into numerical values. This can
    be done using Scikit-Learn’s class `LabelEncoder`.


    ```python

    from sklearn import preprocessing

    lab = preprocessing.LabelEncoder()

    y = lab.fit_transform(y)

    ```


    ```python

    y.Class.unique()

    ```


    ![](Image00034.gif)


    It is now clear that the categorical values have been converted into numerical
    values. We should now split the data into the training and test sets. This will
    help us prevent the problem of overfitting. That is:


    ```python

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)

    ```


    80% of the data will be used for training while 20% of the data will be used for
    testing.


    ## Feature Scaling


    Before we can make the actual predictions, it is recommended that we first scale
    the features so that they can be evaluated uniformly. Note that feature scaling
    should only be done on the training data but not on the test data. The reason
    is that real world data should be kept as possible.


    Let us first import the `StandardScaler` class from Scikit-Learn:


    ```python

    from sklearn.preprocessing import StandardScaler

    feature_scaler = StandardScaler()

    feature_scaler.fit(X_train)

    X_train = feature_scaler.transform(X_train)

    X_test = feature_scaler.transform(X_test)

    ```


    ## Training the Algorithm and Making Predictions


    We now need to train the neural network that will be able to be used for making
    predictions. We should first import the `MLPClassifier` from the neural network
    library of Scikit-Learn. This can be done as follows:


    ```python

    from sklearn.neural_network import MLPClassifier

    mlp_classifier = MLPClassifier(hidden_layer_sizes=(10, 10, 10), max_iter=1000)

    mlp_classifier.fit(X_train, y_train.values.ravel())

    ```


    We have just used three lines of code to create a neural network. That is great!
    Notice the use of the `hidden_layer_sizes` parameter. We have used it to create
    three hidden layers for the network each with 10 nodes. There is no rule that
    limits from choosing only a certain number of layers and nodes for your neural
    network. These vary depending on the nature of the problem in question.


    We have also used the `max_iter` parameter. The purpose of this parameter is to
    set the number of iterations or epochs that you need your network to run. The
    “relu” activation function is used by default together with the “adam” cost optimizer.
    However, these functions can be changed using `activation` and `solver` parameters
    respectively.


    We have then called the `fit` method which trains the algorithm on our training
    data, that is, `X_train` and `y_train`.


    Now that algorithm has been trained on the training data, we can make predictions
    on the test data. This can be done by running the script given below:


    ```python

    predictions = mlp_classifier.predict(X_test)

    ```

