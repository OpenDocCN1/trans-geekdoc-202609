    X\_batch = np.array(\[


            \[\[0, 2, 3, 5\], \[7, 8, 6, 4\]\], # First batch


            \[\[3, 6, 5, 1\], \[0, 0, 0, 0\]\], # Second batch


            \[\[6, 7, 8, 4\], \[6, 3, 4, 2\]\], # Third batch


        \])


    We can decide to build the network with a placeholder for our data, recurrent
    stage, and the output. Let us first define a placeholder for the data:


    X = tf.placeholder(tf.float32, \[None, n\_timesteps, n\_inputs\])


    We have the following in the above definition:


    *   None- this is unknown and it will take the size of the batch.


    *   n\_timesteps- this is the number of times that the network will send the output
    back to the neuron.


    *   n\_inputs- this is the number of inputs for each batch.


    We can no define the recurrent network. As we stated earlier, the network will
    have 6 neurons and it will compute a two dot product:


    *   The input data with the first set of weights that is 6 which is equal to the
    number of neurons.


    *   Previous output with the second set of weights that is 6 which correspond
    to the number of output.


    In the first feed forward, the values of previous output will be equal to zeroes
    since there are no available values. To build an RNN, we use the tf.contrib.rnn.BasicRNNCell
    object. The argument to this object will be num\_units   which define the number
    of inputs. This is shown below:


    basic\_cell = tf.contrib.rnn.BasicRNNCell(num\_units=n\_neurons)


    Now that the network has been defined, we can compute the states and the outputs.
    This can be done as follows:


    outputs, states = tf.nn.dynamic\_rnn(basic\_cell, X, dtype=tf.float32)


    The above object will use an internal loop to multiply the matrices for the right
    number of times.


    What you should not forget is that the recurrent neuron is a function of all inputs
    of previous time steps. The network uses this to build its own memory. The information
    obtained from previous time can be propagated in future time. This is the magic
    of the RNN:


    \## Define the tensor shape


    X = tf.placeholder(tf.float32, \[None, n\_timesteps, n\_inputs\])


    \## Network definition


    basic\_cell = tf.contrib.rnn.BasicRNNCell(num\_units=n\_neurons)


    outputs, states = tf.nn.dynamic\_rnn(basic\_cell, X, dtype=tf.float32)


    init = tf.global\_variables\_initializer()


    init = tf.global\_variables\_initializer()


    with tf.Session() as sess:


        init.run()


        outputs\_val = outputs.eval(feed\_dict={X: X\_batch})


    print(states.eval(feed\_dict={X: X\_batch}))


    You print the values obtained from the previous state. The output that you get
    will be showing what you obtained from the previous state. You can now print the
    entire output, and you will realize that the results are previous output of every
    batch. This means that the previous output has the information regarding the whole
    sequence.


    You just have to run the following print statements:


    print(outputs\_val)   


    print(outputs\_val.shape) 


    The statements will return the following output:


    ![](Image00045.jpg)


    At the bottom of the above figure, it is clear that the output has a shape of
    (3, 2, 6) which means the following:


    *   3: the total number of batches


    *   2: the total number of the timestep


    *   6: the total number of neurons


    You can see that the process of optimizing a recurrent neural network is similar
    to the process of optimizing a traditional neural network.


    RNNs are widely applied especially in predicting future events. They are widely
    used in business to predict the price of stocks and the direction that a market
    will take.


    ## RNN in Time Series


    RNN can be used with a time series data. Time series depend on previous time meaning
    that past values include very relevant information from which the network can
    learn. Time series prediction is used to estimate the future value of the series
    such as temperature, stock price, GDP etc.


    It may be a bit tricky to prepare the values of a time series data. The goal is
    to predict the next value for a series, which means that the past information
    is very important as far as the prediction, is concerned. Consider the code given
    below:


    import matplotlib.pyplot as plt


    import matplotlib


    import numpy as np


    import pandas as pd


    def create\_ts(start = ''2001'', n = 201, freq = ''M''):


        rng = pd.date\_range(start=start, periods=n, freq=freq)


        a = pd.Series(np.random.uniform(-18, 18, size=len(rng)), rng).cumsum()


        return a


    a= create\_ts(start = ''2001'', n = 222, freq = ''M'')


    print(a.tail(5))


    We have created a function to return a dataset with random values for every day
    between the specified periods of time. The last 5 values of the output are as
    follows:


    ![](Image00046.jpg)


    Let us create a plot from the data:


    a = create\_ts(start = ''2001'', n = 222)


    #On the Left Side


    plt.figure(figsize=(11,4))


    plt.subplot(121)


    plt.plot(a.index, a)


    plt.plot(a.index\[90:100\], a\[90:100\], "b-", linewidth=3, label="Training instance")


    plt.title("A time series (generated)", fontsize=14)


    #On the Right Side


    plt.subplot(122)


    plt.title("Training instance", fontsize=14)


    plt.plot(a.index\[90:100\], a\[90:100\], "b-", markersize=8, label="instance")


    plt.plot(a.index\[91:101\], a\[91:101\], "bo", markersize=10, label="target",
    markerfacecolor=''red'')


    plt.legend(loc="upper left")


    plt.xlabel("Time")


    plt.show()


    On the right part of the graph, you should see all the series.


    ## Predictions with RNN


    We can build an RNN to predict the series that we have above. We should first
    define hyper parameters for the model including the following:


    *   The number of inputs: 1


    *   The time step: 10


    *   The number of neurons: 120


    *   The number of outputs: 1


    We need the network to learn from a sequence of 10 days and have 120 recurrent
    neurons. The model should be fed with one input, that is, one day. You can change
    the values if you need to see whether the model made an improvement or not.


    As usual, before training the model, we should split the dataset into training
    and test sets. Since the entire dataset has 222 points, let us use the first 201
    of them as the training set and the last 21 data points as the test set.'
