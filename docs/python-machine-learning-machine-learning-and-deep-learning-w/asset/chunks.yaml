    \ the accuracy of this classifier, try to vary the other parameters other than\
    \ the number of trees/estimators.\n\nChapter 10- Using TensorFlow \n\nTensorFlow\
    \ is a library for dataflow programming. It makes it easy for us to work with\
    \ mathematical expressions. Now that you have installed TensorFlow, we need to\
    \ use it.\n\nTo see whether TensorFlow has been installed on your system, try\
    \ to import it by running the following command:\n\nimport tensorflow as tf\n\n\
    If it is not installed, you will get an error, otherwise, the installation as\
    \ successful. If not installed, follow the steps we discussed earlier to install\
    \ the library.\n\n## DataFlow Graphs\n\nIn TensorFlow, computation is based on\
    \ graphs. The graphs provide us with an alternative to soling mathematical problems.\
    \ Consider the expression given below:\n\nx = ( y+z ) ∗ ( z+4 )\n\nThe above expression\
    \ may also be expressed as follows:\n\np=y + z\n\nq= z + 4\n\nx= p \\* q\n\nWhen\
    \ represented as above, it becomes easy to express the expression in the form\
    \ of a graph. Initially, we had a single expression but we now have two expressions.\
    \ The two expressions can be performed in parallel. We can gain from this in terms\
    \ of computation time. Such gains are very important in deep learning and big\
    \ data applications, especially in Convolutional Neural Networks (CNNs) and Recurrent\
    \ Neural Networks (RNNs) which are all complicated neural network architectures.\n\
    \nThe goal of TensorFlow is to implement graphs and help in the computation of\
    \ operations in parallel which will lead to efficiency gains. In TensorFlow, the\
    \ graph nodes are known as tensors and they are simply multi-dimensional data\
    \ arrays. The graph begins with the input layer where we find the input tensor.\
    \ After the input layer, we get the hidden layer which has rectified linear units\
    \ as the activation function.\n\n## Constants\n\nIn TensorFlow, we create constants\
    \ using the function constantly. This function constant has a signature constant\
    \ (value, dtype=None, shape=None, name='Const', verify\\_shape=False) , in which\
    \ value is the actual constant value to be used for further computation, dtype\
    \ is a data type parameter such as int8/16, float32/64, shape denotes optional\
    \ dimensions, name is optional name for the tensor while the last parameter is\
    \ a Boolean indicating the verification of the shape of the values.\n\nIf you\
    \ need constants with specific values in the training model, use the constant\
    \ object as shown in the example given below:\n\nk = tf.constant(5.2, name=\"\
    x\", dtype=tf.float32)\n\n## Variables\n\nIn TensorFlow, variables refer to in-memory\
    \ buffers with tensors that should be initialized explicitly and used in-graph\
    \ to maintain state across the session. When the constructor is called, the variable\
    \ is added to the computational graph.\n\nVariables are mostly used when starting\
    \ with training models, and they are used for holding and updating parameters.\
    \ The initial values that is passed as the argument to the constructor represents\
    \ the tensor or object that is to be converted or returned as a tensor. This means\
    \ that if we need to fill a variable with some predefined or random values that\
    \ are to be used later in the training process and updated over the iterations,\
    \ it can be defined in the following way:\n\nm = tf.Variable(tf.zeros(\\[1\\]),\
    \ name=\"m\")\n\nIn TensorFlow, variables can also be used in calculations whereby\
    \ the variable is not trainable and it is definable as follows:\n\nm = tf.Variable(tf.add(x,\
    \ y), trainable=False)\n\n## Sessions\n\nFor us to evaluate the nodes, the computational\
    \ graph must be run within a session. The purpose of a session is to encapsulate\
    \ the state and control of a TensorFlow runtime. If the session doesn’t have parameters,\
    \ it will use the default graph that was created in the current session; otherwise,\
    \ the session class will accept the graph parameter, which is used in the session\
    \ to be executed.\n\nLet us run the hello code in TensorFlow:\n\nimport tensorflow\
    \ as tf\n\nh = tf.constant('Hello, this is TensorFlow!')\n\ns = tf.Session()\n\
    \nprint(s.run(h))\n\nThe code returns the following:\n\n![](Image00040.gif)\n\n\
    In the example given below, we are using all the terms defined above to calculate\
    \ a very simple linear function in TensorFlow:\n\nimport tensorflow as tf\n\n\
    y = tf.constant(-2.0, name=\"y\", dtype=tf.float32)\n\na = tf.constant(5.0, name=\"\
    a\", dtype=tf.float32)\n\nb = tf.constant(13.0, name=\"b\", dtype=tf.float32)\n\
    \nz = tf.Variable(tf.add(tf.multiply(a, y), b))\n\ninit = tf.global\\_variables\\\
    _initializer()\n\nwith tf.Session() as session:\n\n    session.run(init)\n\n   \
    \ print session.run(z)\n\nThe code returns the following:\n\n![](Image00041.gif)\n\
    \n## Placeholders\n\nSuppose we are not aware of the value of array y during declaration\
    \ phase of our TensorFlow problem, that is, before the stage for tf.Session()\
    \ as ses . In such a case, TensorFlow expects us to declare basic structure of\
    \ our data by use of tf.placeholder variable declaration. We can use it for y\
    \ as shown below:\n\n\\# creating TensorFlow variables\n\ny = tf.placeholder(tf.float32,\
    \ \\[None, 1\\], name='y')"
