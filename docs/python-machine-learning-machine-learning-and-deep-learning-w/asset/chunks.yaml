    如果你的网络单元是线性的，那么这个算法对你来说很容易理解。为了获取算法权重的误差导数，它首先应该确定随着单元活动水平的变化，误差的变化率。对于输出单元的情况，误差导数是通过确定真实输出与目标输出之间的差异获得的。要找到输出层之前层中隐藏单元的误差变化率，必须确定该隐藏单元与其连接的所有输出单元之间的权重。然后，我们可以将权重与误差导数相乘，并将这些乘积相加。你得到的和将等于该隐藏单元的误差变化率。一旦你获得了输出层前一层隐藏层权重中的误差变化率，我们就能计算其他层的误差变化率。这些层的计算将从一层到下一层进行，其方向与活动通常在网络中传输的方向相反。这解释了“反向传播（back
    propagation）”名称的由来。计算出某个单元的误差变化率后，就可以更容易计算该权重所有输入连接的权重误差导数。权重导数可以通过误差变化率与输入连接的活动相乘得到。


    ## 实现


    我们需要在 Python 中使用 Scikit-Learn 实现神经网络。我们将使用鸢尾花（iris）数据集来完成这项任务。我们将从以下链接获取此数据集：


    [`archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data)


    首先，将必要的库导入到工作区：


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    接下来，让我们从上面的 URL 加载数据到 pandas 数据帧（dataframe）中：


    ```python

    # 为数据集 url 创建一个变量

    iris_url = "https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data"


    # 为数据集分配列名

    names = [''Slength'', ''Swidth'', ''Plength'', ''Pwidth'', ''Class'']


    # 从 url 加载数据集到 pandas dataframe

    dataset = pd.read_csv(iris_url, names=iris_names)

    ```


    请注意，数据集已加载到名为 `dataset` 的 pandas 数据帧中，并且也为数据集分配了列名。让我们对数据调用 `head()` 函数以确保它已加载：


    ```python

    print(dataset.head())

    ```


    你可能会遇到错误。通过如下所示编写代码来解决：


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    import sys


    sys.__stdout__ = sys.stdout


    # 为数据集 url 创建一个变量

    iris_url = "https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data"


    # 为数据集分配列名

    iris_names = [''Slength'', ''Swidth'', ''Plength'', ''Pwidth'', ''Class'']


    # 从 url 加载数据集到 pandas dataframe

    dataset = pd.read_csv(iris_url, names=iris_names)


    print(dataset.head())

    ```


    代码将返回以下内容：


    ![](img/Image00031.gif)


    这说明数据已成功加载。


    ## 数据预处理


    该数据集有 5 列，我们的目标是预测第五列，即 `Class`（类别）。让我们数据集划分为属性和标签：


    ```python

    X = dataset.iloc[:, 0:4]

    y = dataset.select_dtypes(include=[object])

    ```


    前四列的数据已分配给变量 `X`。这些是属性。第五列的数据已分配给变量 `y`。这构成了标签。


    你可以通过运行以下命令查看变量 `y` 的样子：


    ```python

    y.head()

    ```


    ![](img/Image00032.gif)


    你可以看到变量 `y` 具有分类值。然而，众所周知神经网络在数值数据上表现良好，因此我们应该将上述内容转换为数值。首先，让我们看看变量 `y` 中我们多少个唯一值：


    ```python

    y.Class.unique()

    ```


    ![](img/Image00033.gif)


    上面的输出显示我们有三个唯一的类别，即 Iris-versicolor 和 Iris-virginia。我们现在应该将这些转换为数值。这可以使用 Scikit-Learn
    的类 `LabelEncoder` 来完成。


    ```python

    from sklearn import preprocessing

    lab = preprocessing.LabelEncoder()

    y = lab.fit_transform(y)

    ```


    ```python

    y.Class.unique()

    ```


    ![](img/Image00034.gif)


    现在很清楚分类值已经转换为数值了。我们现在应该将数据划分为训练集和测试集。这将帮助我们防止过拟合问题。即：


    ```python

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)

    ```


    80% 的数据将用于训练，20% 的数据将用于测试。


    ## 特征缩放


    在进行实际预测之前，建议先对特征进行缩放以便进行评估。注意，特征缩放应在训练数据上进行，而不是在测试数据上。原因是现实数据应该尽可能保持原样。


    让我们先从 Scikit-Learn 导入 `StandardScaler` 类：


    ```python

    from sklearn.preprocessing import StandardScaler

    feature_scaler = StandardScaler()

    feature_scaler.fit(X_train)

    X_train = feature_scaler.transform(X_train)

    X_test = feature_scaler.transform(X_test)

    ```


    ## 训练算法并进行预测


    我们现在需要训练用于预测的神经网络。我们应该先从 Scikit-Learn 的神经网络库导入 `MLPClassifier`。可以如下操作：


    ```python

    from sklearn.neural_network import MLPClassifier

    mlp_classifier = MLPClassifier(hidden_layer_sizes=(10, 10, 10), max_iter=1000)

    mlp_classifier.fit(X_train, y_train.values.ravel())

    ```


    我们刚刚用三行代码创建了一个神经网络。这太棒了！注意 `hidden_layer_sizes` 参数的使用。我们使用它为网络创建了三个隐藏层，每层有 10
    个节点。并没有规则限制选择特定数量的层和节点。这些取决于问题的性质。


    我们还使用了 `max_iter` 参数。该参数的目的是设置网络运行的迭代次数或轮数（epochs）。默认使用“relu”激活函数配合“adam”代价优化器。然而，这些函数可以通过
    `activation` 和 `solver` 参数分别更改。


    然后我们调用了 `fit` 方法，在我们的训练数据（即 `X_train` 和 `y_train`）上训练算法。


    现在算法已经在训练数据上训练完成，我们可以在测试数据上进行预测。这可以通过运行下面的脚本来实现：


    ```python

    predictions = mlp_classifier.predict(X_test)

    ```

