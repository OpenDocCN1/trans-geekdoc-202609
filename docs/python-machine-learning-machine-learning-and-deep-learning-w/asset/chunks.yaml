  trans: "\n\n在该操作之后，我们将得到一个 ( m x 1 ) 的张量。为了获取张量的平均值并完成交叉熵损失计算，我们应该调用 TensorFlow\
    \ 的 `tf.reduce_mean` 函数。该函数将取你提供的任何张量的平均值。现在我们有了一个可以用于训练目的的代价函数。\n\n首先，让我们设置优化器：\n\
    \n# 添加优化器\n\n```python\noptimizer = tf.train.GradientDescentOptimizer(learning_rate=learning_rate).minimize(cross_entropy)\n\
    ```\n\n我们使用了 TensorFlow 提供的梯度下降优化器。它应该用学习率进行初始化，然后定义它要做什么，简单就是最小化我们创建的交叉熵损失操作。该函数反过来将代表你执行梯度下降和反向传播。\n\
    \n在进入运行操作的主步骤之前，让我们先从设置变量初始化操作和一个负责衡量预测准确率的操作开始。这可以如下所示完成：\n\n# 设置初始化操作\n\n```python\n\
    init_op = tf.global_variables_initializer()\n```\n\n# 创建准确率评估操作\n\n```python\n\
    correct_prediction = tf.equal(tf.argmax(b, 1), tf.argmax(b_, 1))\naccuracy = tf.reduce_mean(tf.cast(correct_prediction,\
    \ tf.float32))\n```\n\n预测预测的操作，即 `correct_prediction` 使用了 TensorFlow 提供的 `tf.equal`\
    \ 函数，该函数根据所提供的参数是否相等来返回 True 或 False。`tf.argmax` 函数通常返回张量/向量中最大元素的索引。`correct_prediction`\
    \ 操作将返回一个大小为 (m * 1) 的包含 True 和 False 值的张量，显示神经网络是否正确预测了数字。我们的目标是确定张量平均值的准确率。我们应该首先将\
    \ `correct_prediction` 操作类型从布尔型转换为 TensorFlow 浮点型，以便执行 `reduce_mean` 操作。在此之后，我们将得到可以用于评估神经网络性能的准确率操作。\n\
    \n### 准备训练\n\n我们现在可以准备神经网络的训练了。完整的代码如下：\n\n# 启动会话\n\n```python\nwith tf.Session()\
    \ as ses:\n  # 初始化变量\n  ses.run(init_op)\n  total_batch = int(len(mnist.train.labels)\
    \ / batch_size)\n  for epoch in range(epochs):\n      avg_cost = 0\n      for\
    \ x in range(total_batch):\n          batch_a, batch_b = mnist.train.next_batch(batch_size=batch_size)\n\
    \          _, z = ses.run([optimiser, cross_entropy],\n                      \
    \    feed_dict={a: batch_a, b: batch_b})\n          avg_cost += b / total_batch\n\
    \      print(\"Epoch:\", (epoch + 1), \"cost =\", \"{:.3f}\".format(avg_cost))\n\
    \  print(ses.run(accuracy, feed_dict={x: mnist.test.images, b: mnist.test.labels}))\n\
    ```\n\n`with` 操作已经设置完毕且初始化操作已经运行。第三行是关于将为神经网络运行的小批量（mini-batch）训练方案。在第三行中，我们计算了每个\
    \ epoch 将运行的批数量。然后我们遍历每个 epoch，并初始化 `avg_cost` 变量以跟踪每个 epoch 的平均交叉熵损失。在下一行中，我们从训练数据集中提取了随机样本批次\
    \ `batch_a` 和 `batch_b`。MNIST 数据集有一个名为 `next_batch` 的实用函数，它方便提取训练所需的数据批次。\n\n\
    在下一行中，我们正在运行两个操作。`ses.run` 可以接受一个操作列表并将其作为第一个参数运行。在一种情况下，当 `[optimiser, cross_entropy]`\
    \ 作为列表提供时，这两个操作将被执行。这将为我们提供两个输出，然后它们将被赋值给变量 `_` 和 `z`。我们并不太关心从优化器操作得到的输出，但我们关心从\
    \ `cross_entropy` 操作得到的输出，该输出被赋值给了变量 `z`。优化器操作应该在批次样本上运行。随后 `z` 被用于计算该 epoch 的平均损失。\n\
    \n随后我们打印了平均损失的进度，然后一旦训练完成，就会执行准确率操作，以显示训练模型在测试集上的准确率。\n\n你现在应该拥有以下代码：\n\n```python\n\
    import tensorflow as tf\nfrom tensorflow.examples.tutorials.mnist import input_data\n\
    \nmnist = input_data.read_data_sets(\"MNIST_data/\", one_hot=True)\n\n# 优化变量\n\
    learning_rate = 0.5\nepochs = 10\nbatch_size = 100\n\n# 创建训练数据的占位符\n# 输入 a - 28\
    \ x 28 像素 = 784\na = tf.placeholder(tf.float32, [None, 784])\n# 现在为输出数据创建占位符 -\
    \ 10 个数字\nb = tf.placeholder(tf.float32, [None, 10])\n# 我们可以连接输入到隐藏层的权重\nW1 =\
    \ tf.Variable(tf.random_normal([784, 300], stddev=0.03), name='W1')\ny1 = tf.Variable(tf.random_normal([300]),\
    \ name='y1')\n# 然后连接隐藏层到输出层的权重\nW2 = tf.Variable(tf.random_normal([300, 10], stddev=0.03),\
    \ name='W2')\ny2 = tf.Variable(tf.random_normal([10]), name='y2')\n# 获取隐藏层的输出\n\
    hidden_out = tf.add(tf.matmul(a, W1), y1)\nhidden_out = tf.relu(hidden_out)\n\
    b_ = tf.softmax(tf.matmul(hidden_out, W2))\nb_clipped = tf.clip_by_value(b_, 1e-10,\
    \ 0.99999)\ncross_entropy = -tf.reduce_mean(tf.reduce_sum(b * tf.log(b_clipped),\
    \ axis=1))\n```\n"
- fmt: "\nHowever, there is a problem with this model in that it has no memory. This\
    \ means that the input and output are independent. What this means is that the\
    \ model doesn’t care about what happened before. This raises a number of questions\
    \ as when you need to predict sentences or time series since the network will\
    \ need to have information about past words or historical data.\n\nTo solve this\
    \ problem, a new architecture by the name Recurrent Neural Network (`RNN`) was\
    \ developed.\n\nIn terms of structure, an `RNN` is the same as an ordinary neural\
    \ network with the exception that it has some memory state added to the neurons.\
    \ The computation for adding the memory is simple.\n\nConsider a simple model\
    \ having only one neuron that is fed by a batch of data. For the case of a traditional\
    \ neural network, the model will produce the output by multiplying the input and\
    \ the weight and the activation function. In an `RNN`, the output will be sent\
    \ back to itself for a number of times. The timestep is the amount of time that\
    \ the output becomes the input of the next matrix multiplication.\n\nWe need to\
    \ code a simple `RNN` in `TensorFlow`. The network will be made up of the following:\n\
    \n*   Four inputs\n*   Six neurons\n*   2-time steps\n\nThis type of network is\
    \ known as recurrent since it does a similar operation in every activate square.\
    \ The network computes the weights of the inputs and the previous output then\
    \ uses an activation function:\n\n```python\nimport tensorflow as tf\nimport numpy\
    \ as np\n\nn_inputs = 4\nn_neurons = 6\nn_timesteps = 2\n\n#our data is a sequence\
    \ of numbers, ranging between 0 and 9 and put in 3 batches\nX_batch = np.array([\n\
    \    [[0, 2, 3, 5], [7, 8, 6, 4]], # First batch\n    [[3, 6, 5, 1], [0, 0, 0,\
    \ 0]], # Second batch\n    [[6, 7, 8, 4], [6, 3, 4, 2]], # Third batch\n])\n```\n\
    \nWe can decide to build the network with a placeholder for our data, recurrent\
    \ stage, and the output. Let us first define a placeholder for the data:\n\n```python\n\
    X = tf.placeholder(tf.float32, [None, n_timesteps, n_inputs])\n```\n\nWe have\
    \ the following in the above definition:\n\n*   `None`- this is unknown and it\
    \ will take the size of the batch.\n*   `n_timesteps`- this is the number of times\
    \ that the network will send the output back to the neuron.\n*   `n_inputs`- this\
    \ is the number of inputs for each batch.\n\nWe can no define the recurrent network.\
    \ As we stated earlier, the network will have 6 neurons and it will compute a\
    \ two dot product:\n\n*   The input data with the first set of weights that is\
    \ 6 which is equal to the number of neurons.\n*   Previous output with the second\
    \ set of weights that is 6 which correspond to the number of output.\n\nIn the\
    \ first feed forward, the values of previous output will be equal to zeroes since\
    \ there are no available values. To build an `RNN`, we use the `tf.contrib.rnn.BasicRNNCell`\
    \ object. The argument to this object will be `num_units` which define the number\
    \ of inputs. This is shown below:\n\n```python\nbasic_cell = tf.contrib.rnn.BasicRNNCell(num_units=n_neurons)\n\
    ```\n\nNow that the network has been defined, we can compute the states and the\
    \ outputs. This can be done as follows:\n\n```python\noutputs, states = tf.nn.dynamic_rnn(basic_cell,\
    \ X, dtype=tf.float32)\n```\n\nThe above object will use an internal loop to multiply\
    \ the matrices for the right number of times.\n\nWhat you should not forget is\
    \ that the recurrent neuron is a function of all inputs of previous time steps.\
    \ The network uses this to build its own memory. The information obtained from\
    \ previous time can be propagated in future time. This is the magic of the `RNN`:\n\
    \n## Define the tensor shape\n\n```python\nX = tf.placeholder(tf.float32, [None,\
    \ n_timesteps, n_inputs])\n```\n\n## Network definition\n\n```python\nbasic_cell\
    \ = tf.contrib.rnn.BasicRNNCell(num_units=n_neurons)\noutputs, states = tf.nn.dynamic_rnn(basic_cell,\
    \ X, dtype=tf.float32)\ninit = tf.global_variables_initializer()\ninit = tf.global_variables_initializer()\n\
    \nwith tf.Session() as sess:\n    init.run()\n    outputs_val = outputs.eval(feed_dict={X:\
    \ X_batch})\nprint(states.eval(feed_dict={X: X_batch}))\n```\n\nYou print the\
    \ values obtained from the previous state. The output that you get will be showing\
    \ what you obtained from the previous state. You can now print the entire output,\
    \ and you will realize that the results are previous output of every batch. This\
    \ means that the previous output has the information regarding the whole sequence.\n\
    \nYou just have to run the following print statements:\n\n```python\nprint(outputs_val)\n\
    print(outputs_val.shape)\n```\n\nThe statements will return the following output:\n\
    \n![](Image00045.jpg)\n\nAt the bottom of the above figure, it is clear that the\
    \ output has a shape of (3, 2, 6) which means the following:\n\n*   3: the total\
    \ number of batches\n*   2: the total number of the timestep\n*   6: the total\
    \ number of neurons\n\nYou can see that the process of optimizing a recurrent\
    \ neural network is similar to the process of optimizing a traditional neural\
    \ network.\n\n`RNNs` are widely applied especially in predicting future events.\
    \ They are widely used in business to predict the price of stocks and the direction\
    \ that a market will take.\n\n## RNN in Time Series\n\n`RNN` can be used with\
    \ a time series data. Time series depend on previous time meaning that past values\
    \ include very relevant information from which the network can learn. Time series\
    \ prediction is used to estimate the future value of the series such as temperature,\
    \ stock price, GDP etc.\n\nIt may be a bit tricky to prepare the values of a time\
    \ series data. The goal is to predict the next value for a series, which means\
    \ that the past information is very important as far as the prediction, is concerned.\
    \ Consider the code given below:\n\n```python\nimport matplotlib.pyplot as plt\n\
    import matplotlib\nimport numpy as np\nimport pandas as pd\n\ndef create_ts(start\
    \ = '2001', n = 201, freq = 'M'):\n    rng = pd.date_range(start=start, periods=n,\
    \ freq=freq)\n    a = pd.Series(np.random.uniform(-18, 18, size=len(rng)), index=rng).cumsum()\n\
    \    return a\n\na = create_ts(start = '2001', n = 222, freq = 'M')\nprint(a.tail(5))\n\
    ```\n\nWe have created a function to return a dataset with random values for every\
    \ day of time. The last 5 values of the output are as follows:\n\n![](Image0046.jpg)\n\
    \nLet us create a plot from the data:\n\n```python\nplt.figure(figsize=(11,4))\n\
    plt.subplot(121)\nplt.plot(a.index, a)\nplt.plot(a.index[90:100], a[90:100], \"\
    b-\", linewidth=3, label=\"Training instance\")\nplt.title(\"A time series (generated)\"\
    , fontsize=14)\n\n#On the Right Side\nplt.subplot(122)\nplt.title(\"Training instance\"\
    , fontsize=14)\nplt.plot(a.index[90:100], a[90:100], \"b-\", markersize=8, label=\"\
    instance\")\nplt.plot(a.index[91:101], a[91:101], \"bo\", markersize=10, label=\"\
    target\", markerfacecolor='red')\nplt.legend(loc=\"upper left\")\nplt.xlabel(\"\
    Time\")\nplt.show()\n```\n\nOn the right part of the graph, you should see all\
    \ the series.\n\n## Predictions with RNN\n\nWe can build an `RNN` to predict the\
    \ series that we have above. We should first define hyper parameters for the model\
    \ including the following:\n\n*   The number of inputs: 1\n*   The time step:\
    \ 10\n*   The number of neurons: 120\n*   The number of outputs: 1\n\nAs usual,\
    \ before training the model, we should split the dataset into training and test\
    \ sets. Since the entire dataset has 222 points, let us use the first 201 of them\
    \ as the training set and the last 21 data points as the test set.\n"
