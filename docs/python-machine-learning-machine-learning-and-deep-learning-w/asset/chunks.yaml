    Scikit-learn provides its users with a number of supervised and unsupervised learning
    algorithms through a consistent Python interface. It was initially developed by
    David Cournapeau in 2007 as a Google Summer of code project. Scikit-learn is suitable
    for both academic and commercial use.


    Scikit-learn has been in use as a machine learning library in Python. It comes
    with numerous classification, regression and clustering algorithms including gradient
    boosting, support vector machines (SVMs), random forests, k-means, and DBSCAN.
    Scikit-learn was designed to be used with other Python libraries including `Numpy`
    and `SciPy`.


    The library itself was written in Python and some of its algorithms were written
    in `Cython` to offer a better performance. Scikit-learn is a good library for
    building machine learning models. The library is open source and it is under BSD
    license.


    # What is TensorFlow?


    TensorFlow is a framework from Google used for the creation of deep learning models.
    TensorFlow relies on data-flow graphs for numerical computation. TensorFlow has
    made machine learning easy. It makes the processes of acquiring data, training
    machine learning models, making predictions and modifying future results easy.


    The library was developed by Google’s Brain team for use in large-scale machine
    learning. TensorFlow brings together machine learning and deep learning algorithms
    and models and it makes them much useful via a common metaphor. TensorFlow uses
    Python to give its users a front-end API that can be used for building applications,
    with the applications being executed in high-performance-C++.


    TensorFlow can be used for building, training and running deep neural networks
    for image recognition, handwritten digit classification, recurrent neural networks,
    word embedding, natural language processing etc.


    # Chapter 2- Environment Setup


    Before getting into the practical part of machine learning and deep learning,
    we need to install our two libraries, that is, Scikit-Learn and TensorFlow.


    ## Installing Scikit-Learn


    Scikit-learn is supported in `Python 2.7` and above. Before installing Scikit-learn,
    ensure that you have `Numpy` and `SciPy` libraries already installed. Also, ensure
    that you have the latest versions of these libraries. Once you have installed
    these, you can go ahead to install Scikit-learn on your machine.


    The installation of these libraries can be done using `pip`. `Pip` is a tool that
    comes with Python, meaning after installing Python, you get `pip`. To install
    scikit-learn, run the following command on the terminal of your operating system:


    ```

    pip install scikit-learn

    ```


    The installation should run and come to a completion.


    You can also use `conda` to install scikit-learn. This can be done by running
    the following command:


    ```bash

    conda install scikit-learn

    ```


    Once the installation of `sckit-learn` is complete, you need to import it into
    your Python program in order to use its algorithms. This can be done by using
    the `import` statement as shown below:


    ```python

    import sklearn

    ```


    If the command runs without an error, know that the installation of scikit-learn
    was successful. If the command generates an error, note that the installation
    was not successful. You can now use scikit-learn to create your own machine learning
    models.


