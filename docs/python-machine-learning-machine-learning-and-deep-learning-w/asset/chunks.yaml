    \n[Training the Classifier](#text00000.html#_Toc529382907)\n\nChapter 1- Getting\
    \ Started \n\n## What is Machine Learning?\n\nMachine learning is a branch of\
    \ artificial intelligence that provides systems with the ability to learn from\
    \ experience without being programmed explicitly. Machine learning is concerned\
    \ with the development of computer applications that can access data and learn\
    \ from it on themselves.\n\nThe learning process begins with data or observations,\
    \ like instruction, direct experience or examples to extract patterns from the\
    \ data and use these patterns to make predictions in the future. The primary goal\
    \ of machine learning is to allow computers to learn automatically without intervention\
    \ by humans and adjust accordingly.\n\nWith machine learning, we can analyze large\
    \ quantities of data. Machine learning gives us profitable results but we may\
    \ need a number of resourcess to reach this point. Additional time may be needed\
    \ to train the machine learning models.\n\n## Classification of Machine Learning\
    \ Algorithms\n\nThe Machine Learning algorithms can fall either in the supervised\
    \ or unsupervised or reinforced learning.\n\n###  Supervised Learning\n\nFor the\
    \ case of supervised learning, the human is expected to provide both the inputs\
    \ and the outputs which are desired and furnish the feedback based on the accuracy\
    \ of the predictions during training. After completion of the training, the algorithm\
    \ will have to apply what was applied to the next data.\n\nThe concept of supervised\
    \ learning can be seen to be similar to learning under a teacher’s supervision\
    \ in human beings. The teacher gives some examples to the student, and the student\
    \ then derives new rules and knowledge from these examples so as to apply this\
    \ somewhere else.\n\nIt is also good for you to know the difference between the\
    \ regression problems and classification problems. In regression problems, the\
    \ target is a numeric value, while in classification, the target is a class or\
    \ a tag. A regression task can help determine the average cost of all houses in\
    \ London, while a classification task will help determine the types of flowers\
    \ based on the length of their sepals and petals.\n\n###  Unsupervised Learning\n\
    \nFor the case of unsupervised learning, the algorithms do not expect to be provided\
    \ with the output data. An approach called deep learning, which is an iterative\
    \ approach is used so as to review the data and arrive at new conclusions. This\
    \ makes them suitable for use in processing tasks which are complex compared to\
    \ the supervised learning algorithms. This means that the unsupervised learning\
    \ algorithms learn solely from examples without responses to these. The algorithm\
    \ finds patterns from the examples on its own.\n\nSupervised learning algorithms\
    \ work similarly to how humans determine any similarities between two or more\
    \ objects. Majority of recommender systems you encounter when purchasing items\
    \ online work based on unsupervised learning algorithms. In this case, the algorithm\
    \ derives what to suggest to you for purchase from what you have purchased before.\
    \ The algorithm has to estimate the kind of customers whom you resemble, and a\
    \ suggestion is drawn from that.\n\n###  Reinforcement Learning\n\nThis type of\
    \ learning occurs when the algorithm is presented with examples which lack labels,\
    \ as it is the case with unsupervised learning. However, the example can be accompanied\
    \ by a positive or a negative feedback depending on the solution which is proposed\
    \ by the algorithm. It is associated with applications in which the algorithm\
    \ has to make decisions, and these decisions are associated with a consequence.\
    \ It is similar to trial and error in human learning.\n\nErrors become useful\
    \ in learning when they are associated with a penalty such as pain, cost, loss\
    \ of time etc. In reinforced learning, some actions are more likely to succeed\
    \ compared to others.\n\nMachine learning processes are similar to those of data\
    \ mining and predictive modelling. In both cases, searching through the data is\
    \ required so as to draw patterns then adjust the actions of the program accordingly.\
    \ A good example of machine learning is the recommender systems. If you purchase\
    \ an item online, you will get an ad which is related to that item, and that is\
    \ a good example of machine learning.\n\n## What is Deep Learning?\n\nDeep learning\
    \ is a subfield of machine learning involving algorithms that are inspired by\
    \ the function and structure of the brain known as artificial neural networks.\
    \ It teaches computers to do what is natural to humans, that is, learn by example.\
    \ It is the technology behind the concept of the driverless car.\n\nIt is through\
    \ deep learning that a computer is able to learn to perform classification tasks\
    \ directly from text, images or sound. Deep learning models are able to achieve\
    \ a state-of-the-art accuracy, which in some cases exceeds human-level performance.\
    \ Large sets of labelled data and neural network architectures are used to train\
    \ models in deep learning.\n\n## What is Scikit-Learn?"
