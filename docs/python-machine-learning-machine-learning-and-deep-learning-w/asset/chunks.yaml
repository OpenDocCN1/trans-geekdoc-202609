    现在我们应该准备要使用的数据。我们将创建一个总共 10 行 2 列的 numpy 数组。那么，为什么要选择使用 numpy 数组呢？因为 Scikit-Learn
    库可以直接处理 numpy 数组数据输入，而无需预处理。让我们创建它：


    ```

    X = np.array([[5,3], [10,15], [15,12], [24,10], [30,45], [85,70], [71,80], [60,78],
    [55,52], [80,91]])

    ```


    ## 数据可视化


    现在我们有了数据，可以创建一个图表并观察数据点的分布情况。然后我们将能够判断目前是否存在聚类：


    ```python

    plt.scatter(X[:,0],X[:,1], label=''True Position'')

    plt.show()

    ```


    代码输出了下面的图表：


    ![](img/Image00022.gif)


    如果我们仅用肉眼观察，可能会从上述数据中看出两个聚类：底部有五个点，顶部也有五个点。现在我们需要调查一下是否这就是 K-Means 聚类算法所做的。


    ## 创建聚类


    我们已经看到从数据点中形成两个聚类，因此 `K` 的值现在为 2。这两个聚类可以通过运行以下代码来创建：


    ```python

    kmeans_clusters = KMeans(n_clusters=2)

    kmeans_clusters.fit(X)

    ```


    我们创建了一个名为 `kmeans_clusters` 的对象，并将 `2` 作为参数 `n_clusters` 的值。然后我们在该对象上调用了 `fit()`
    方法，并将 numpy 数组中的数据作为参数传递给该方法。


    现在我们可以查看算法为最终聚类创建的质心值：


    ```python

    print (kmeans_clusters.cluster_centers_)

    ```


    这返回了以下内容：


    ![](img/Image00023.gif)


    上面的第一行给出了第一个质心的坐标，即 (16.8, 17)。第二行给出了第二个质心的坐标，即 (70.2, 74.2)。如果你按照手动过程计算这些值，结果应该是相同的。这将表明
    K-Means 算法运行良好。


    以下脚本将帮助我们查看数据点的标签：


    ```python

    print(kmeans_clusters.labels_)

    ```


    这返回了以下内容：


    ![](img/Image00024.gif)


    上面的输出显示了一个包含 10 个元素的一维数组，对应分配给 10 个数据点的聚类。你可以清楚地看到，首先有一串零，显示前 5 个点被聚类在一起，而最后 5
    个点也被聚类在一起。注意，0 和 1 没有数学意义，它们仅仅被用来表示聚类 ID。如果我们有三个聚类，那么最后一个将用数字 2 来表示。


    现在我们可以绘制数据点的图并查看它们是如何被聚类的。我们需要将数据点与其分配的标签一起绘制，以便区分聚类。只需执行下面提供的脚本：


    ```python

    plt.scatter(X[:,0],X[:,1], c=kmeans_clusters.labels_, cmap=''rainbow'')

    plt.show()

    ```


    脚本返回了下面的图表：


    ![](img/Image00025.jpg)


    我们简单地将名为 `X` 的数组的第一列相对于第二列进行了绘图。同时，我们将 `kmeans_labels_` 作为参数 `c` 的值传递，它对应于标签。注意参数
    `cmap=''rainbow''` 的使用。该参数帮助我们为不同的数据点选择颜色。


    正如你预期的那样，前五个点聚类在左下方并分配了相似的颜色。剩下的五个点聚类在右上方并被分配了一个唯一的颜色。


    我们可以选择将点与每个聚类的质心坐标一起绘制，以观察质心的位置如何影响聚类。让我们使用三个聚类来看看它们如何影响质心。以下脚本将帮助你创建图表：


    ```python

    plt.scatter(X[:,0], X[:,1], c=kmeans_clusters.labels_, cmap=''rainbow'')

    plt.scatter(kmeans_clusters.cluster_centers_[:,0],kmeans_clusters.cluster_centers_[:,1],
    color=''black'')

    plt.show()

    ```


    脚本返回了下面的图表：


    ![](img/Image00026.jpg)


    我们选择了用黑色绘制质心点。


    ## 第 7 章 - 支持向量机


    SVM 属于监督机器学习算法的范畴，被广泛应用于分类和回归问题。它以其处理非线性输入空间的能力而闻名。它在入侵检测、人脸检测、新闻文章、电子邮件和网页的分类、手写识别以及基因分类等应用中被广泛使用。


    该算法通过尽可能地分离数据点来工作。最近点之间的距离被称为 `margin`（间隔）。目标是在给定数据集中选择一个在支持向量之间具有最大可能间隔的超平面。


    为了最好理解该算法如何工作，让我们先在 Scikit-Learn 库中实现它。我们的目标是预测银行钞票是伪钞还是真。我们将使用钞票的属性，包括图像的方差、图像的偏度、峰度和熵。


