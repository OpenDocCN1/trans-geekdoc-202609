  trans: "\n然而，这种模型存在一个问题，因为它没有记忆。这意味着输入和输出是相互独立的。也就是说模型并不关心之前发生了什么。当你需要预测句子或时间序列时，这会引发很多问题，因为网络需要关于过去词汇或历史数据的信息。\n\
    \n为了解决这个问题，开发了一种名为循环神经网络（`RNN`）的新架构。\n\n从结构上来说，`RNN` 与普通神经网络相同，不同之处在于它在神经元中添加了一些记忆状态。添加记忆的计算非常简单。\n\
    \n考虑一个仅有一个神经元的简单模型，它由一个批数据输入。对于传统的神经网络情况，模型将通过输入、权重和激活函数的乘积来产生输出。在 `RNN` 中，输出将多次传回给自身。时间步（timestep）是指输出成为下一次矩阵乘法输入的时间长度。\n\
    \n我们需要在 `TensorFlow` 中编写一个简单的 `RNN`。该网络将由以下部分组成：\n\n*   四个输入\n*   六个神经元\n*   2\
    \ 个时间步\n\n这种网络被称为循环网络，因为它在每个激活单元中都执行相似的操作。网络计算输入和上一个输出的权重，然后使用激活函数：\n\n```python\n\
    import tensorflow as tf\nimport numpy as np\n\nn_inputs = 4\nn_neurons = 6\nn_timesteps\
    \ = 2\n\n#我们的数据是一组数字序列，范围在 0 到 9 之间，并放入 3 个批次中\nX_batch = np.array([\n    [[0,\
    \ 2, 3, 5], [7, 8, 6, 4]], # 第一批\n    [[3, 6, 5, 1], [0, 0, 0, 0]], # 第二批\n  \
    \  [[6, 7, 8, 4], [6, 3, 4, 2]], # 第三批\n])\n```\n\n我们可以决定使用一个我们的数据、循环阶段和输出的占位符来构建网络。让我们先为数据定义一个占位符：\n\
    \n```python\nX = tf.placeholder(tf.float32, [None, n_timesteps, n_inputs])\n```\n\
    \n在上面的定义中，我们有以下内容：\n\n*   `None`——这是未知的，它将取决于批次的大小。\n*   `n_timesteps`——这是网络将输出传回给神经元的次数。\n\
    *   `n_inputs`——这是每个批次的输入数量。\n\n现在我们可以定义循环网络。正如我们之前提到的，网络将具有 6 个神经元，并且它将计算两个点积：\n\
    \n*   输入数据与第一组权重的乘积，权重为 6，等于神经元的数量。\n*   上一个输出与第二组权重的乘积，权重为 6，对应输出的数量。\n\n在第一次前向传播中，上一个输出的值将等于零，因为没有可用的值。为了构建一个\
    \ `RNN`，我们使用 `tf.contrib.rnn.BasicRNNCell` 对象。该对象的参数将是 `num_units`，它定义了输入的数量。所示：\n\
    \n```python\nbasic_cell = tf.contrib.rnn.BasicRNNCell(num_units=n_neurons)\n```\n\
    \n现在网络已经定义，我们可以计算状态和输出。可以如下操作：\n\n```python\noutputs, states = tf.nn.dynamic_rnn(basic_cell,\
    \ X, dtype=tf.float32)\n```\n\n上面的对象将使用内部循环来按正确的次数进行矩阵乘法。\n\n你不应该忘记的是，循环神经元是所有之前时间步输入的函数。网络利用此来构建它自己的记忆。网络使用此来构建自己的记忆。\n\
    \n## 定义的形状\n\n```python\nX = tf.placeholder(tf.float32, [None, n_timesteps, n_inputs])\n\
    ```\n"
