  trans: "\n使用 Scikit-Learn 库，我们可以很容易地训练 KNN 算法。让我们先从 Scikit-Learn 库导入 `KNeighborsClassifier`：\n\
    \n```python\nfrom sklearn.neighbors import KNeighborsClassifier \n```\n\n以下代码将帮助我们训练该算法：\n\
    \n```python\nknn_classifier = KNeighborsClassifier(n_neighbors=5) \nknn_classifier.fit(X_train,\
    \ y_train)\n```\n\n注意，我们创建了之前定义的类的实例，并将其命名为 `knn_classifier`。在实例化时我们使用了一个参数，即\
    \ `n_neighbors`。我们使用 `5` 作为该参数的值，这基本上代表了 `K` 的值。注意，`K` 没有特定的固定值，它是在测试和评估后选择的。不过，对于初学者，`5`\
    \ 是大多数 KNN 应用中最常用的值。\n\n然后我们可以使用测试数据进行预测。这可以通过运行下面提供的脚本来实现：\n\n```python\npred_y\
    \ = knn_classifier.predict(X_test) \n```\n\n## 评估算法的准确性\n\nKNN 算法的评估方法与线性回归算法的准确性评估不同。我们之前使用的是\
    \ `RMSE`、`MAE` 等指标。在这种情况下，我们将使用混淆矩阵、`precision`（精确率）、`recall`（召回率）和 `f1 score`\
    \ 等指标。\n\n我们可以使用 `classification_report` 和 `confusion_matrix` 方法来计算这些指标。让我们先从\
    \ Scikit-Learn 库导入它们：\n\n```python\nfrom sklearn.metrics import confusion_matrix,\
    \ classification_report\n```\n\n运行以下脚本：\n\n```python\nprint(confusion_matrix(y_test,\
    \ pred_y)) \nprint(classification_report(y_test, pred_y))\n```\n\n![](img/Image00020.gif)\n\
    \n上面的结果显示，KNN 算法对测试集中 30 条记录的分类表现良好。结果显示算法在数据集上的平均准确率约为 90%。这是一个很不错的的百分比。\n\n\
    ## 比较 K 值与错误率\n\n我们之前提到，没有一个特定的 `K` 值可以说第一次就能给出最好的结果。我们选择 `5` 是因为它是 `K` 最常用的值。找到最佳\
    \ `K` 值的最好方法是绘制 `K` 值与数据集对应误差的图表。\n\n让我们使用测试集预测值的平均误差，为 1 到 40 之间的所有 `K` 值创建一个图表。我们应该从计算\
    \ `K` 在 1 到 40 之间预测值的平均误差开始。只需运行下面的脚本：\n\n```python\nerror = []\n\n# K 值范围在 1\
    \ 到 40 之间\nfor x in range(1, 40): \n    knn = KNeighborsClassifier(n_neighbors=x)\n\
    \    knn.fit(X_train, y_train)\n    pred_x = knn.predict(X_test)\n    error.append(np.mean(pred_x\
    \ != y_test))\n```\n\n代码将运行从 1 到 40 的循环。在每次迭代中，计算测试集预测值的平均误差，并将结果添加到 `error` 列表中。\n\
    \n我们现在应该将 `error` 值相对于 `K` 值绘图。可以通过运行下面的脚本创建图表：\n\n```python\nplt.figure(figsize=(12,\
    \ 6)) \nplt.plot(range(1, 40), error, color='blue', linestyle='dashed', marker='o',\
    \ \n         markerfacecolor='blue', markersize=10)\nplt.title('Error Rate for\
    \ K') \nplt.xlabel('K Values') \nplt.ylabel('Mean Error')\nplt.show()\n```\n\n\
    代码生成了下面的图：\n\n![](img/Image00021.jpg)\n\n图表显示，当我们使用 1 到 17 之间的 `K` 值时，将获得 `0`\
    \ 的平均误差。之后，你可以尝试调整 `K` 值，并观察它对预测准确性的影响。\n\n## 第 6 章 - K-Means 聚类\n\n聚类属于无监督机器学习算法的范畴。它通常在数据没有标签时应用。该算法的目标是识别数据中的簇或组。\n\
    \n聚类的核心思想是：同一个簇中的对象彼此之间与其他簇中的对象更相关。相似性是反映两个数据对象之间关系强度的指标。聚类在探索性数据挖掘中应用非常广泛。它应用于模式识别、机器学习、信息检索、图像分析、数据压缩、生物信息学和计算机图形等多个领域。\n\
    \n算法根据数据值之间的相似性形成数据簇。你需要指定 `K` 值，即你期望算法从数据中产生的簇数量。算法首先为每个簇选择一个质心值。然后，以迭代的方式执行三个步骤：\n\
    \n1. 计算每个数据实例与所有簇质心之间的欧几里得距离。\n2. 将数据实例分配给距离最近质心所在的簇。\n3. 根据相应簇数据实例坐标的平均值计算新的质心值。\n\
    \n在在 Scikit-Learn 上实现之前，让我们先手动演示一下该算法是如何工作的：\n\n假设我们有如下的二维数据实例并命名为 `D`：\n\n`D\
    \ = { (5,3), (10,15), (15,15) }`\n"
