    print(''MSE:'', metrics.mean\_squared\_error(y\_test, pred\_y)) 


    print(''RMSE:'', np.sqrt(metrics.mean\_squared\_error(y\_test, pred\_y))) 


    ## Multiple Linear Regression


    You now know how to do Linear Regression when you have two variables. However,
    this is not a true reflection of what we have in the real world. Most of the problems
    the world is facing involve more than two variables. This explains why you need
