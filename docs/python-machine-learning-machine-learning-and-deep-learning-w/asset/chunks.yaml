    \n巨大的误差可能是由多种因素造成的。也许需要更多的数据。我们只使用了一年的数据。收集多年的数据可能有助于帮助我们提高模型的准确性。此外，我们假设数据之间存在线性关系。事实可能并非如此，因此导致了巨大的误差。我建议你对数据进行可视化以查看是否真实。此外，我们使用的特征之间可能并不相关。\n\
    \n# 第 5 章 - K 近邻算法\n\n`KNN` 算法被广泛用于构建更复杂的分类器。它是一种简单的算法，但它的性能优于许多强大的分类器。这就是为什么它被应用于数据压缩、经济预测和遗传学等众多领域。\n\
    \n`KNN` 是一种监督学习算法，这意味着我们得到了一个由训练观测值 (`x`, `y`) 组成的标记数据集，我们的目标是确定 `x` 和 `y` 之间的关系。这意味着我们应该找到一个将\
    \ `x` `maps` 到 `y` 的函数，使得当我们给定输入值 `x` 时，能够预测出对应的 `y` 值。\n\n`KNN` 算法的原理非常简单。它计算新数据点到所有其他训练数据点的距离。距离可以是多种类型，包括曼哈顿距离、欧几里得距离等。选择\
    \ K 个最近的数据点，其中 `K` 可以是任意整数。最后，将数据点分配给大多数 `K` 个数据点所属的类别。\n\n我们将使用一个名为 `Iris` 的数据集。我们之前探索过它。我们将用它来演示如何实现\
    \ `KNN` 算法。该数据集由四个属性组成，即 `sepal-width`（花萼宽）、`sepal-length`（花萼长）、`petal-width`（瓣宽）和\
    \ `petal-length`（瓣长）。每种鸢尾花都有特定的属性。我们的目标是预测植物所属的类别。数据集有三个类别：`Iris-setosa`、`Iris-versicolor`\
    \ 和 `Iris-virginica`。\n\n首先，导入所有需要的库：\n\n```python\nimport numpy as np\nimport\
    \ pandas as pd\nimport matplotlib.pyplot as plt\n```\n\n现在我们需要将数据集加载到我们的工作环境中。从以下\
    \ URL 下载：\n\n[`archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data)\n\
    \n我们需要从上述 URL 加载数据集并将其存储在 dataframe。以下脚本将帮助我们实现这一点：\n\n```python\n# 创建数据集变量\n\
    iris_url = \"https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data\"\
    \n\n# 为数据集分配列名\niris_names = ['Slength', 'Swidth', 'Plength', 'Pwidth', 'Class']\n\
    \n# 读取数据集到 dataframe\ndataset = pd.read_csv(iris_url, names=iris_names)\n```\n\
    \n我们可以查看数据集的前几行：\n\n```python\nprint(dataset.head())\n```\n\n![](img/Image00019.gif)\n\
    \n`S` 代表花萼（Sepal），`P` 代表花瓣（Petal）。例如，`S length` 代表花长，`Plength` 代表瓣长。\n\n如果你遇到错误，请记住导入\
    \ `sys` 包并如下所示使用：\n\n```python\nimport numpy as np\nimport pandas as pd\nimport\
    \ matplotlib.pyplot as plt\nimport sys\n\nsys.__stdout__ = sys.stdout\nurl = \"\
    https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data\"\n\n\
    # 为我们的数据集分配列名\nnames = ['Slength', 'Swidth', 'Plength', 'Pwidth', 'Class']\n\n\
    # 读取数据集到 dataframe\ndataset = pd.read_csv(url, names=names)\n```\n\n通常情况下，我们应该将数据集分为属性和标签。可以通过运行以下代码来实现：\n\
    \n```python\nX = dataset.iloc[:, :-1].values\ny = dataset.iloc[:, 4].values\n\
    ```\n\n变量 `X` 将持有数据集的前四列（即属性），而变量 `y` 将持有标签。\n\n```"
- fmt: "\nWith the Scikit-Learn library, it is easy for us to train the KNN algorithm.\
    \ Let us first import the `KNeighborsClassifier` from the Scikit-Learn library:\n\
    \n```python\nfrom sklearn.neighbors import KNeighborsClassifier \n```\n\nThe following\
    \ code will help us train the algorithm:\n\n```python\nknn_classifier = KNeighborsClassifier(n_neighbors=5)\
    \ \nknn_classifier.fit(X_train, y_train)\n```\n\nNote that we have created an\
    \ instance of the class we have created and named the instance `knn_classifier`.\
    \ We have used one parameter in the instantiation, that is, `n_neighbors`. We\
    \ have used `5` as the value of this parameter, and this basically denotes the\
    \ value of `K`. Note that there is no specific value for `K` and it is chosen\
    \ after testing and evaluation. However, for a start, `5` is used as the most\
    \ popular value in most KNN applications.\n\nWe can then use the test data to\
    \ make predictions. This can be done by running the script given below:\n\n```python\n\
    pred_y = knn_classifier.predict(X_test) \n```\n\n## Evaluating the Accuracy of\
    \ the Algorithm\n\nEvaluation of the KNN algorithm is not done in the same way\
    \ as evaluating the accuracy of the linear regression algorithm. We were using\
    \ metrics like `RMSE`, `MAE` etc. In this case, we will use metrics like confusion\
    \ matrix, `precision`, `recall`, and `f1 score`.\n\nWe can use the `classification_report`\
    \ and `confusion_matrix` methods to calculate these metrics. Let us first import\
    \ these from the Scikit-Learn library:\n\n```python\nfrom sklearn.metrics import\
    \ confusion_matrix, classification_report\n```\n\nRun the following script:\n\n\
    ```python\nprint(confusion_matrix(y_test, pred_y)) \nprint(classification_report(y_test,\
    \ pred_y))\n```\n\n![](Image00020.gif)\n\nThe results given above shows that the\
    \ KNN algorithm did a good job in classifying the 30 records that we have in the\
    \ test dataset. The results show that the average accuracy of the algorithm on\
    \ the dataset was about 90%. This is not a bad percentage.\n\n## Comparing K Value\
    \ with the Error Rate\n\nWe earlier said that there is no specific value of `K`\
    \ that can be said that it gives the best results on the first go. We chose `5`\
    \ because it is the most popular value used for `K`. The best way to find the\
    \ best value of `K` is by plotting a graph of `K` value and the corresponding\
    \ error for the dataset.\n\nLet us create a plot using the mean error for predicted\
    \ values of the test set for all the `K` values that range between 1 and 40. We\
    \ should begin by calculating the mean of error for the predicted value with `K`\
    \ ranging between 1 and 40. Just run the script given below:\n\n```python\nerror\
    \ = []\n\n# K values range between 1 and 40\nfor x in range(1, 40): \n    knn\
    \ = KNeighborsClassifier(n_neighbors=x)\n    knn.fit(X_train, y_train)\n    pred_x\
    \ = knn.predict(X_test)\n    error.append(np.mean(pred_x != y_test))\n```\n\n\
    The code will run the loop from 1 to 40. In every iteration, the mean error for\
    \ the predicted value of the test set is calculated and the result is appended\
    \ to `error` list.\n\nWe should now plot the values of `error` against the values\
    \ of `K`. The plot can be created by running the script given below:\n\n```python\n\
    plt.figure(figsize=(12, 6)) \nplt.plot(range(1, 40), error, color='blue', linestyle='dashed',\
    \ marker='o', \n         markerfacecolor='blue', markersize=10)\nplt.title('Error\
    \ Rate for K') \nplt.xlabel('K Values') \nplt.ylabel('Mean Error')\nplt.show()\n\
    ```\n\nThe code generates the plot given below:\n\n![](Image00021.jpg)\n\nThe\
    \ graph shows that we will get a Mean Error of `0` when we use values of `K` between\
    \ 1 and 17. It will then be good for you to play around with the value of `K`\
    \ and see its impact on the accuracy of the predictions.\n\n## Chapter 6- K-Means\
    \ Clustering\n\nClustering falls under the category of unsupervised machine learning\
    \ algorithms. It is often applied when the data is not labeled. The goal of the\
    \ algorithm is to identify clusters or groups within the data.\n\nThe idea behind\
    \ the clusters is that the objects contained one cluster is more related to one\
    \ another than the objects in the other clusters. The similarity is a metric reflecting\
    \ the strength of the relationship between two data objects. Clustering is highly\
    \ applied in exploratory data mining. In have many uses in diverse fields such\
    \ as pattern recognition, machine learning, information retrieval, image analysis,\
    \ data compression, bio-informatics, and computer graphics.\n\nThe algorithm forms\
    \ clusters of data based on the similarity between data values. You are required\
    \ to specify the value of `K`, which are the number of clusters that you expect\
    \ the algorithm to make from the data. The algorithm first selects a centroid\
    \ value for every cluster. After that, it performs three steps in an iterative\
    \ manner:\n\n1. Calculate the Euclidian distance between every data instance and\
    \ the centroids for all clusters.\n2. Assign the instances of data to the cluster\
    \ of centroid with the nearest distance.\n3. Calculate the new centroid values\
    \ depending on the mean values of the coordinates of the data instances from the\
    \ corresponding cluster.\n\nLet us manually demonstrate how this algorithm works\
