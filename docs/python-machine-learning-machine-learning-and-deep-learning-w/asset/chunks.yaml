    Chapter 12- Linear Classifier


    In supervised learning, the most popular tasks are the linear regression and linear
    classifier. Linear regression works by predicting a value while linear classifier
    works by predicting a class. We will be focusing on a linear classifier.


    Classification tasks form 80% of machine learning tasks. The aim of classification
    is to predict the probability of every class when you are given a set of inputs.
    The label is usually a discrete value known as a class .


    If the label is made up of two classes only, the learning algorithm is referred
    to as a binary classifier . If the label has more than two classifiers, it is
    known as a multiclass classifier.


    We will be using a census dataset to implement a linear classifier in TensorFlow.
    We need to use the variables in the dataset to predict the level of income. The
    income is a binary variable:


    *   A value of 1 if income > 50k


    *   0 if the income < 50k .


    This means the income will be the label.


    Here are the 8 categorical variables for the dataset:


    *   workplace


    *   education


    *   marital


    *   occupation


    *   relationship


    *   race


    *   sex


    *   native\_country


    Here are six continuous variables for the dataset:


    *   age


    *   fnlwgt


    *   education\_num


    *   capital\_gain


    *   capital\_loss


    *   hours\_week


    You will learn how to train a linear classifier in TensorFlow estimator and improve
    its accuracy metric. Let us start:


    ## Importing the Data


    Let us begin by importing the libraries that are needed:


    import tensorflow as tf


    import pandas as pd


    We need to import the data from the UCI repository then define its column names:


    \## Defining the path data


    COLUMNS = \[''age'',''workclass'', ''fnlwgt'', ''education'', ''education\_num'',
    ''marital'',


               ''occupation'', ''relationship'', ''race'', ''sex'', ''capital\_gain'',
