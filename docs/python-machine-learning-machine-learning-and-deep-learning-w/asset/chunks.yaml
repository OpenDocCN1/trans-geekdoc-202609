    Machine learning is a branch of artificial intelligence that provides systems
    with the ability to learn from experience without being programmed explicitly.
    Machine learning is concerned with the development of computer applications that
    can access data and learn from it on themselves.


    The learning process begins with data or observations, like instruction, direct
    experience or examples to extract patterns from the data and use patterns from
    the data.


