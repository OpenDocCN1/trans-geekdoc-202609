    \ before taking tests || • A patient can take tests without initial consultation\
    \ |\n|  ||  |\n| A patient must pay for consultation/treatment before leaving\
    \ the SPC || • A patient can make payment after leaving the SPC  \n• A patient\
    \ can make payments in instalments |\n|  ||  |\n| A patient can only fix the next\
