    | Project Organization and Grouping


    The next step after idea generation is for the team to organize the list into
    meaningful groups of related ideas, which will eventually become projects. These
    projects are made of consistent and interdependent ideas built around a central
    theme. This will allow an individual project to be implemented independent of
    each other. The following questions are helpful in grouping the ideas together
    into projects. These questions are intended to guide the staff in grouping projects
    together.


    1. What ideas are similar or seem to be based on the same theme? For example,
    some ideas may be built on outsourcing.


    2. In what way is each project different?


    If there is any overlapping of ideas between projects, it may be better to regroup
    them under different criteria.


    3. What about ideas that do not seem to fit anywhere?


    There will always be some ideas that do not fit into any of the projects and it
    is fine to leave them out.


    4. Are there any projects that are related to each other?


    This is discouraged, as the main objective is to allow any project to be implemented
    individually.


