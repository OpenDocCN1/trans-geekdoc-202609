    in a straightforward, structured way. Using this canvas will lead to insights
    about the customers you serve, what value propositions are offered through various
    channels, and how your company makes money. You can also use the business model
    canvas to determine the key processes and technologies that can transform the
    business (the authors’ client made use of the business model canvas to map their
    current business, as seen in Appendix 1, and future businesses, as illustrated
    in Appendix 2).


    The business model canvas can be extended to finalize program scope, objectives,
    and timing in the context of the company supply chain’s strengths and weaknesses.
    Assess the external threats and opportunities in the supply chain to create a
    logical framework for comparing the strengths and weaknesses of the various alternative
    sources of supply and demand. What are the external threats and opportunities
    in developing the supply chain?


    ### 4. Coordination and planning across supply chain partners

    create and maintain relationships in order to develop long-term trust and support.
    Planning has two levels: buyer–supplier coordination and production–distribution
    coordination.


    Level 1: Buyer–supplier coordination — attain steady supply of raw materials and
    resources for the project.


    Level 2: Product-distribution coordination — link development to product transfer
    to the customer. How can the firm optimally structure the supply chain to ensure
    cost and resource flow efficiently?


    The core team needs to conduct a series of program kick-off meetings to engage
    stakeholders, align expectations, and gather support for the program within its
    own organization and with participating supply chain partners. This is also the
    stage to create and socialize the overall program plan across all stakeholders
    in terms of the responsibilities of the key people and milestones to be achieved
    by accomplishing tasks over a feasible timeline.


    ### 5. Establish governance and control mechanism

    identify and agree on ways to measure performance for all business processes in
    the scope of the digital supply chain transformation and adjust the flow of resources
    or mix of suppliers as needed. How can the company be sure that it is getting
    maximum performance (for example, highest efficiency in a process as applicable)
    from its supply chain? How can the company improve it?


    Historical data as a representation of the anomalies and outliers in supply chain
    processes is of paramount importance in establishing the improvement opportunities
    based on true facts. Hence, an approach to the collection of historical data along
    with very clearly defined and agreed accountability for the same needs to be established
    right at the start. This is especially so in the context of digital transformation,
    where most digital evangelists the world over have said, it is all about “data,
    data, data”.


    The goal of most digital supply chain transformation programs is to create a coordinated
    supply chain planning and execution network that allows for optimal material acquisition,
    production, shipping, and distribution of goods and services among supply chain
    members. Digital supply chain transformation is not an easy process, nor should
    it be approached without sufficient understanding of the steps involved and the
    organization-wide commitment to a methodology that is required for it to work.
    Its benefits are obvious: integrated, logical supplier networks; clear links to
    customers; a streamlined flow of materials (raw, financial, and human) to the
    project planning; and significant expansion.


    Traditionally, project planning often means simply scheduling, with a bit of risk
    analysis or work breakdown structure included sometimes. In digital supply chain
    transformation, it means that planning takes a whole new level of complexity.
    Planning begins outside of the project and the project organization; it begins
    with suppliers, customers, logistics providers, and others. It analyzes each of
    their potential contributions, selects those that will best benefit the project
    organization, and coordinates their deliveries. Hence, the new project planning
    is no longer an internal process simply involved in project development; it is
    a totally coordinated exercise with explicit links to the rest of the organization,
    suppliers, and customers. As an important prerequisite, a complete list of deliverables
    and program governance mechanisms should be jointly agreed upon by all supply
    chain and other cross-functional stakeholders at this stage of initiating the
    digital transformation program. When properly established and continually monitored
    and upgraded, digital supply chain transformation offers companies a new and powerful
    way of reconfiguring its supply chain. The initial time spent up-front establishing
    the supply chain will pay off for itself downstream as projects come to the market
    cheaper and with more direct customer feedback and acceptance. Below, we highlight
    the initial steps towards digital supply chain transformation recently undertaken
    by a construction services company in the Asia-Pacific region.

    '
  trans: '


    ## 快速成效、战术收益、战略成功


    - “快速成效”是一组可以在投入最少的时间和成本的情况下完成以获得快速回报的举措（~ `McCormack Maturity Level 3` 或 `4`）

    - “战术收益”可以通过中期范围的举措来实现，这将很大程度上改善核心供应链流程能力（~ `McCormack Maturity Level 4`）

    - “战略成功”将通过致力于显著改善供应链绩效的举措来实现，从而积极影响组织的长期目标（~ `McCormack Maturity Level 5`）


    关于变革需求以及变革将把我们带向何处的清晰商业论证，对于成功地向供应链的每个合作伙伴（例如供应商、客户、物流提供商等）推销数字化供应链转型是必要的。本阶段的关键目的是动员项目资源并建立对项目范围、活动、里程碑和责任的共同理解。


    为了确保供应链项目成功，创建数字化供应链转型项目需要五个基本步骤。


    ### 1. 建立核心团队

    确定并宣布供应链转型项目的业务负责人。业务负责人随后将提名项目经理和一名供应链流程 SME 来开始准备活动。


    ### 2. 共同目标设定

    为组织及其供应链合作伙伴建立目标。从内部和合作伙伴组织中确定项目参与者。确认所有利益相关者的角色和职责并制定项目治理结构。强调集成供应链的根本目标是希望提高运营效率或比竞争对手更有效地管理成本。举办跨职能和跨合作伙伴的工作坊来回答一个主题问题：这一流程将如何改善供应链绩效？目标设定的示例示意图在此处
    Figure 3 中显示。


    ![](img/fig3.jpg)


    **Figure 3.** Goal setting


    ### 3. 商业模式画布

    使用商业模式画布（由 Strategyzer 的联合创始人 Alexander Osterwalder 创建）识别并评估可能影响项目的利益相关者。商业模式画布是有用的工具，可帮助您以简单、结构化的方式理解商业模式。使用此画布将带来关于您服务的客户、通过各种渠道提供的价值主张以及贵公司如何赚钱的见解。您还可以使用商业模式画布来确定可以转型业务的关键流程和技术（作者的客户利用商业模式画布绘制了其当前业务，如附录
    1 所示，以及未来业务，如附录 2 所示）。


    商业模式画布可以扩展以在公司供应链优势和劣势的背景下最终确定项目范围、目标和时间。评估供应链中的外部威胁和机会，以创建比较各种替代供应和需求来源的优势和劣势的逻辑框架。开发供应链时外部威胁和机会是什么？


    ### 4. 跨供应链合作伙伴的协调与规划

    创建并维持关系以发展长期信任和支持。规划有两个层级：买方-供应商协调和生产-分销协调。


    Level 1: Buyer–supplier coordination — attain steady supply of raw materials and
    resources for the project.


    Level 2: Product-distribution coordination — link development to product transfer
    to the customer. How can the firm optimally structure the supply chain to ensure
    cost and resource flow efficiently?


    核心团队需要进行一系列项目启动会议，以吸引利益相关者、协调期望，并在其自身组织内以及参与的供应链合作伙伴中为项目争取支持。这也是创建并在所有利益相关者中推广整体项目计划的阶段，说明关键人员的职责以及通过在可行的时间范围内完成任务而应实现的时间节点。


    ### 5. 建立治理和控制机制

    确定并同意对数字化供应链转型范围内的所有业务流程绩效进行衡量的方式，并在需要时调整资源流动或供应商组合。公司如何确保其供应链获得最大绩效（例如，流程的最高效率等）？公司如何改进它？


    历史数据作为供应链流程中异常值和离群值的代表，在基于真实事实建立改进机会方面至关重要。因此，在一开始就需要建立历史数据收集的方法以及对此的非常明确且商定的责任。这在数字化转型的背景下尤其如此，世界各地的数字化倡导者都说，这一切都关乎“data,
    data, data”。


    大多数数字化供应链转型项目的目标是创建一个协调的供应链规划和执行网络，允许供应链成员之间实现最佳的材料采购、生产、运输和商品及服务分销。数字化供应链转型不是一个容易的过程，也不应在没有充分理解所涉及的步骤以及使其发挥作用所需的全组织对方法论的承诺的情况下进行。其益处是显而易见的：集成、合理的供应商网络；与客户的明确联系；材料（原材料、财务和人力）向项目规划的顺畅流动；以及显著的扩张。


    传统上，项目规划往往只是简单的排程，有时包含一点风险分析或工作分解结构。在数字化供应链转型中，这意味着规划进入了全新的复杂性水平。规划始于项目和项目组织之外；它始于供应商、客户、物流提供商和其他方。它分析他们各自的潜在贡献，选择最有利于项目组织的贡献，并协调其交付。因此，新的项目规划不再是仅涉及项目开发的内部流程；它是一个与组织其余部分、供应商和客户具有明确联系的完全协调的练习。作为重要前提，交付成果的完整清单和项目治理机制应在此启动数字化转型项目的阶段由所有供应链和其他跨职能利益相关者共同商定。当得到妥善建立并持续监控和升级时，数字化供应链转型为企业提供了一种重新配置其供应链的新颖而强大的方式。最初在前端投入建立供应链的时间将在下游得到回报，因为项目以更低的成本进入市场，并获得更直接的客户反馈和认可。下面，我们重点介绍了亚太地区一家建筑服务公司最近采取的迈向数字化供应链转型的初始步骤。


    '
