- raw: "Aversion factor relates to the negative impact of an initiative or project\
    \ that reduces its attractiveness. Criteria for aversion factors include cost\
    \ of implementing the project, difficulty of implementing the project, and risk\
    \ of implementing the project.\n\nOnce the staff have set the criteria to evaluate\
    \ each project, they add weightage to each criterion from 0 to 1 based on importance.\
    \ The coordinator (person leading the evaluation process) will then ask the team\
    \ members to score each project against each attribute for customer and organization\
    \ benefits based on a score of –3 to 3 (–3 denotes erosion of contribution, 0\
    \ denotes no effect, and 3 denotes significant contribution). In the case of the\
    \ aversion factor, the scoring is based on a score of –3 to 0 since all the criteria\
    \ refer to the negative impact of performance. [Figure 19](#chapter7.xhtml#fig19)\
    \ shows a template that can be used by staff to conduct the evaluation.\n\n![](images/fig19.jpg)\n\
    \n**Figure 19.** Template to evaluate initiatives/projects for digital supply\
    \ chain transformation\n\nThe team members understand that this is not a scientific\
    \ tool. Rather, it is based on individual opinion and its strength lies in its\
    \ simplicity. Even though the criteria are clear, the projects defined are not\
    \ easy for comparison and, in this case, more deliberation about each project\
    \ does not necessarily produce better results. For the rating of each attribute,\
    \ every participant must question the impact each project has against the rest.\n\
    \nOnce the staff have classified all the ideas against every criterion, the coordinator\
    \ will then create a final table recording the total score of each project. Using\
    \ the final score, average the score and multiple by each criterion’s weight (if\
    \ any), and add the result for each column to compute the weighted score or each\
    \ project.\n\nAfter these steps are taken, they now have some quantitative evaluation\
    \ of the projects against each criterion that are deemed important. Therefore,\
    \ they have passed from individual and subjective perceptions to common numeric\
    \ conclusions. Now it is time to study the values obtained in the tables.\n\n\
    **Finalizing Enabling Digital Technologies**\n\nTechnology is essential for the\
    \ new process so that it can meet the digital transformation objectives and goals.\
    \ Examples of how technologies can help in transforming processes are shown in\
    \ [Table 5](#chapter7.xhtml#tab5).\n\nIdentification, evaluation, and adoption\
    \ of digital enablers further helps in achieving the supply chain transformation\
    \ vision. The ability of the new supply chain process design to meet its performance\
    \ targets and yield its expected business benefits is possible by applying the\
    \ latest digital technology to the new process. During detailed process design,\
    \ determining the types of technologies that are required to support the new business\
    \ processes is needed. The following example will illustrate how to exploit potential\
    \ digital levers to support each activity in the new process. This illustration\
    \ involves importers who are importing poultry into a country from overseas. Importers\
    \ can obtain the import permit from a government agency once their poultry pass\
    \ the inspection test. The key activities involved in the application for the\
    \ poultry import permit, in this case, are shown in [Figure 20](#chapter7.xhtml#fig20).\n\
    \n**Table 5.** Digital technologies for enabling supply chain processes (McKinsey,\
    \ 2016)\n\n| **Old Rule** || **Digital Enabler** || **New Perspective** |\n\n\
    | --- | --- | --- |\n\n| Information can appear in only one place at a time ||\
    \ Cloud Application || Information can appear simultaneously in as many places\
    \ as needed |\n\n| Only experts can perform complex work || Artificial Intelligence\
    \ || A generalist may be able to do the work of an expert system |\n\n| Businesses\
    \ must choose between centralization and decentralization || 5G Telecommunication\
    \ networks || Businesses can simultaneously reap the benefits of centralization\
    \ and decentralization |\n\n| Managers make all decisions || Big Data || Decision\
    \ making is part of data analytics |\n\n| Field personnel need offices — where\
    \ to receive, store, retrieve and transmit information || Wireless communication\
    \ and Mobile applications || Field personnel can send and receive information\
    \ on the go, anytime, anywhere |\n\n| The last contact with a potential buyer\
    \ is personal contact || Interactive chatbot || The best contact with a potential\
    \ buyer is effective dialogue |\n\n| People must find where things are || Internet\
    \ of things || IoT tell you where they are |\n\n| Plans get revised periodically\
    \ || High performance computing || Plans can get revised instantaneously |\n\n\
    ![](images/fig20.jpg)\n\n**Figure 20.** Import process for poultry\n\n**Table\
    \ 6.** Identifying Digital enablers for value-add activities\n\n| **Key Activities**\
    \ || **Value-add Activity?** || **Potential Digital/Technology Application (If\
    \ Any)** |\n\n| --- | --- | --- |\n\n| Apply for poultry permit || Value add ||\
    \ Online or mobile channels |\n\n| Evaluate application || Value add || Verify\
    \ with database of countries banned from import of poultry using blockchan |\n\
    \n| Approve or reject application. || Value add || Online or mobile channels |\n\
    \n| Import poultry || Not applicable || Not applicable |\n\n| Inspect poultry\
    \ for disease and other potential infection || Non-value add || Internet of Things\
    \ (IoT) |\n\n| Draw blood sample for the lab || Non-value add || Not applicable\
    \ |\n\n| Test blood sample for infection || Value add || Extract test procedures\
    \ from laboratory information management system using TOT  \n\nLink testing equipment\
    \ with laboratory information management system to update test results |\n\n|\
    \ Make decision (approve or reject permit) || Value add || Decision support tool\
    \ to assist manager to approve permit based on blood sample result and inspection\
    \ result |\n\n| Inform applicant of the outcome || Value add || Online or mobile\
    \ channels |\n\n| Collect payment || Non-value add || Using e-banking or VISA\
    \ |\n\nThese activities can be classified as value adding or non-value adding,\
    \ and potential digitalization can be identified for each activity, as shown in\
    \ [Table 6](#chapter7.xhtml#tab6).\n\nAs a result of this exercise, four potential\
    \ levels of technology and digital enablement are identified for this process.\
    \ They are as follows:\n\n• An enterprise system on the cloud to store and retrieve\
    \ information regarding the test procedures and test results\n\n• An advanced\
    \ predictive analytics-based decision support tool to assist the manager in approving\
    \ permits\n\n• An online or mobile connection to the enterprise system to request\
    \ for testing\n\n• An online payment system linking to the enterprise system\n\
    \nWhile the identification of digital technology enablers for the new process\
    \ is critical, one needs to be mindful in terms of the benefits or value in implementing\
    \ such technology to support the new process. Keeping in mind how expensive the\
    \ cost of digitalization can be, it is imperative to look upon technology not\
    \ only for the benefits provided to the customer, but also how large its contribution\
    \ will be on process performance. Through the application of a simple assessment\
    \ test, one would be prevented from the fallacy of rushing into a passion for\
    \ an information technology application that might be futile for the organization."
