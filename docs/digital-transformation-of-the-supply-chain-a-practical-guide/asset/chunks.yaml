    | 患者必须在诊所等候，以便在叫到其名字时能够到场（进行诊治/治疗），从而确保 `SPC` 的资源得到高效利用 | • 患者可以在更舒适的环境中等待，或在等待呼叫时做其他事情，而不会对效率产生不利影响
