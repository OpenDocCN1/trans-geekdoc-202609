    \ the next appointment while paying for treatment/consultation  \n• A patient\
    \ can fix the next appointment from home (after leaving the SPC) |\n|  ||  |\n\
    | **WHY Template** ||  |\n|  ||  |\n| Patient records must be retrieved the day\
    \ before to ensure availability at the SPC on appointment day || • Patient records\
    \ should be available anytime/all the time |\n|  ||  |\n| A patient must wait\
    \ at the clinic so that she/he is available when her/his name is called (for consulting/treatment)\
    \ so that the SPC’s resources are efficiently utilized || • A patient can wait\
