- raw: 'Having successfully redesigned supply chain processes with an alignment to
    a digital future, the actual implementation of process changes and technology
    solutions begins. It is imperative to consider four different dimensions coming
    together for the successful implementation of the digital strategy. The first
    dimension is related to business processes and the second is concerned with structures
    of jobs and the people needed to fill them. The third area of interaction refers
    to the role of managers, the working relationships, and the measurement systems,
    and, finally, the fourth dimension is related to employees’ values and beliefs.
    Consequently, transforming a company’s processes affects all aspects of that company,
    as shown in [Figure 18](#chapter7.xhtml#fig18).


    The implementation of digital supply chain transformation is then carried out
    by the following activities.


    **Defining New Organizational Structure**


    The new process design for the organization should include necessary job positions,
    required skills and knowledge, number of people required to fill these positions,
    workgroups and teams, and the most effective supporting management structure.
    In principle, if these steps are followed, then an ideal (e.g. properly fitting)
    organization can be designed for transformed supply chain processes. The organization
    structure should have the following characteristics:


    ![](images/fig18.jpg)


    **Figure 18.** Alignment for successful digital strategy


    • Minimal number of interfaces to suppliers and customers


    • Optimal span of control for the number of direct reports per manager, given
    the type of work


    • Minimal number of layers


    • Clear roles and responsibilities


    • The avoidance of overlapping or fuzzy responsibilities


    According to the advocates of digital supply chain transformation, modern organizations
    must abandon the old control mechanisms that characterize the hierarchical and
    bureaucratic organization as these control mechanisms are obsolete. There are
    three reasons to support this claim. First, digitally-enabled information systems,
    expert systems, and decision-support systems can provide workers with information
    that enables them to make better decisions themselves. It is no longer necessary
    to separate thought and action. Decisions should be made where the work is performed.


    Second, the modern workforce is well-educated and capable of assuming responsibility.
    Modern workers expect more autonomy and selfcontrol and, moreover, expect to have
    a say in how a supply chain is run. People do not want to simply follow rules;
    they want to make their own rules and decisions. Third, the supply chain environment
    has changed. It is much more dynamic and competitive than before. The old bureaucratic
    system, which was geared towards efficiency and control, is out of place in an
    age where flexibility, variety, and customer satisfaction are the keys to success.
    It is necessary to design organizations that mirror the increased differentiation
    of consumer demand, and the flexibility and power of the technology.


    One important element for any transformative thinking is the role of management.
    Digital supply chain transformation emphasizes the value of reducing management
    levels and the number of managers within organizations. Hierarchical structures
    should be flattened, and a manager should have a greater span of control. In addition,
    the role of managers should be changed. A manager should become a consultant,
    advisor, and coach, and not necessarily a supervisor and controller. Workers should
    manage and control themselves. The job of a manager is to help their employees
    to do richer and more demanding work.


    Since processes cross-functional borders, the traditional department structure
    is becoming obsolete for a transformed organization. Instead, people will be organized
    in multidisciplinary teams. These teams could replace the functional department
    structure, and each member in the process team is “collectively responsible for
    process results”.


    **Redefining Performance Measurement**


    Performance measurements will have to align to the new process in order for workers
    to change to the new process. Otherwise, they will soon revert to their old process.
    [Tables 2](#chapter7.xhtml#tab2), [3](#chapter7.xhtml#tab3), and [4](#chapter7.xhtml#tab4)
    show role-wise process flow for the application of a business license in Singapore,
    followed by the performance measurement for each department, and finally the measurement
    for each job and its target setting.


    **Table 2.** Process representation by roles


    ![](images/tab2.jpg)


    **Table 3.** Performance targets for functions across processes


    ![](images/tab3.jpg)


    **Table 4.** Performance measurement criterion/targets for processes


    ![](images/tab4.jpg)


    **Evaluating and Defining Implementation Options**


    Having designed and tested the new process, an organization will be faced with
    considerable challenge of migrating from the current process environment to the
    radically new design. A full “cutover” may be difficult or impossible. If the
    new process involves customers, revenue, or valued employees, or if the process
    change will be highly visible internally or externally, the firm may not want
    to risk a full, abrupt transition. Alternatives to full cutover include a phased
    introduction, creating a pilot, or creating an entirely new business unit.


    A pilot is a smaller scale, but fully operational, implementation of a new process
    in a relatively small unit of the organization based on a particular geography,
    product, or set of customers. Although pilots are often viewed as a means of testing
    a new process (or other type of intervention), the goal should be to achieve success
    rather than a merely objective test. Thus, the unit selected should be the one
    most capable of achieving successful change.


    Another approach is to begin with a pilot and follow with a phase by phase implementation.
    A company might, for example, implement new system capabilities and skills as
    they become available. A phased approach may be the most economically feasible,
    in that companies can derive some financial benefit from the process change earlier
    than might otherwise be possible, but it is not necessarily less disruptive than
    a full cutover. In fact, the sense of constant change and instability may be difficult
    for some employees to handle. At this stage it is prudent to also evaluate all
    potential initiatives or projects identified for setting up the digital supply
    chain transformation, in a scientific way, considering each initiative’s impact.


    This step involves selecting one or more identified initiatives/projects based
    on their impact on customers and the organization. The decision is not to reject
    or eliminate alternatives, but to establish priorities instead. All identified
    initiatives/projects could be impactful, but they must prioritized because of
    the limited amount of resources available. The objective of this step is thus
    to allow the team involved to obtain a consensus on which proposed initiatives/projects
    (or ideas) must be given what priority.


    Before the evaluation can start, staff participating in the evaluation and selection
    process must share a clear vision of the ideas to be evaluated: objectives, implications,
    feasibilities, etc. The selection criteria must be established for evaluation
    and are built on three dimensions: customer benefits, organization benefits, and
    aversion factor. Criteria for customer benefits include improving quality and
    effectiveness; increased speed, responsiveness, and reduced wait; and enhancing
    convenience, accessibility, and comfort. Criteria for organization benefits include
    operational savings, increased productivity and efficiency, increased capacity,
    strategic advantage, and enhanced image and reputation.'
