- raw: 'As stated earlier, change happens within supply chain processes due to internal
    and external factors. As an organization, you have to anticipate quickly and be
    flexible. Our organizations work the way they do because of how we think and interact.
    Only by changing how we think can we change deeply-embedded policies and practices.
    Only by changing how we interact can shared visions, shared understandings, and
    new capacities for coordinated action be established.


    ***Shared Vision***


    The practice of shared vision involves the skills of unearthing shared “pictures
    of the future” that foster genuine commitment and enrollment rather than compliance.
    The major aspect with change is motivating and educating people and creating a
    shared vision. It is important for success that this vision is carried by an idea
    held by your employees. They have to believe that the change is necessary to make
    it happen! Therefore, we always start with investigating what kind of people we
    have to manage (awareness) and creating a shared vision with the management team.
    The process of building a shared vision is done with the supply chain conceptual
    approach. With this aid, we are able to include every internal and external condition
    that influences the vision of the organization.


    ***System Thinking***


    System thinking is a discipline to gain a better view of the situation. It is
    a framework for seeing interrelationships rather than things, for seeing patterns
    of change rather than static snapshots. System thinking offers a language that
    begins by restructuring how we think. Doing obvious things does not produce the
    obvious, desired outcome. Real leverage lies in understanding dynamic complexity,
    not detail complexity. System thinking will allow the company to see the whole
    picture and set the company direction together as part of team learning to achieve
    its objectives.


    ***Business Development***


    The ultimate objective is to develop the organization as a whole in the right
    direction (as stated in the shared vision) and, in this way, increase revenue
    and margins.


    ***Personal Mastery***


    Personal mastery is the discipline of continually clarifying and deepening our
    personal vision, focusing our energies, developing patience, seeing reality objectively,
    and being able to adopt change.


    ***Mental Models***


    “Mental models” are deeply ingrained assumptions, generalizations, or even pictures
    or images that influence how we understand the world and how we take action.


    ***Team Learning***


    The discipline of team learning starts with “dialogue”, the capacity of members
    in a team to suspend assumptions and enter into a genuine “thinking together”.
    The discipline of dialogue also involves learning how to recognize the patterns
    of interaction in teams that undermine learning. The patterns of defensiveness
    are often deeply ingrained in how a team operates. If unrecognized, they undermine
    learning. If recognized and surfaced creatively, they can actually accelerate
    learning.


