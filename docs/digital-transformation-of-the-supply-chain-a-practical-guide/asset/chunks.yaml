- raw: 'Over the years in the business, ECU has invested heavily in software to upgrade
    its systems to meet customers’ growing demands for visibility and ease of doing
    business. “We are glad to share that the entire network is on same IT platform,
    which makes the operations more uniform and also offers customers similar experiences
    in service across the world,” as commented by Shetty.


    ***Nature of the LCL Business***


    Shetty explained in detail the logistics industry. He observed that competition
    in this industry is extremely high, and the business is quite fragmented. The
    market can be broadly segmented into local forwarder and global forwarders (such
    as Dalsey, Hillblom and Lynn International GmbH (DHL), Kuehne + Nagel International
    AG (K&N), DB Schenker , etc.).


    The LCL business modus operandi is quite different from the FCL business. While
    FCL operations and costing are done based on demand and supply, LCL business costing
    is subjected to the client’s requirement. For instance, if clients prefer to have
    lower ocean freight and higher destination charges, an arrangement can be done
    accordingly.


    Hence the market is segmented into local forwarder and global forwarder business.
    While local forwarders focus on business, where customers require the lowest possible
    freight rates (even rebates) and higher destination charges (destination lading
    charges (DLC)), global forwarders have a balanced approach to keep DLC lower so
    that consignees are not upset and transactions are hassle-free.


    Consolidation operators or competition for ECU is also segmented into local players
    or regional operators and global players. Local or regional operators mainly focus
    on the business from smaller forwarders, while global players work with large
    multinational corporations such as DHL, K&N, and others.


    ECU has a fair share of business from both local and global forwarders. Global
    consolidators have an advantage over smaller operators given the former’s network
    strength (coverage, single identity), visibility, and reliability, but on the
    other hand, they are faced with niche operators who can offer extremely low rates,
    given their low-cost operations.


    ***Company Structure***


    [Figure 29](#chapter12.xhtml#fig29) shows ECU’s organization structure. The chief
    executive officer of the Asia-Pacific (APAC) region is headed by Mr. Udaye Kumar
    Shetty, and each Country Manager reports to the Regional Heads (Southeast Asia
    and North Asia). At the country level, ECU has Branch Managers and Product Managers
    (for FCL and LCL), and they have dotted line reporting to the Regional Product
    Heads, who are responsible for strategies development and business development
    for their regions.


    ![](images/fig29.jpg)


    **Figure 29.** Organization chart of ECU Worldwide


    The two main departments in a forwarding business are the import and export departments,
    while other supporting functions such as Finance, Human Resource, Administration,
    and Information Technology help to ensure smooth operations.


    *Import department*


    The import operations team is responsible for two products: LCL and FCL. For LCL
    operations, the team has the following responsibilities:


    1. Receiving the pre-alert documents of the expected consolidation container


    2. Checking the document for correctness, and, in case of any discrepancy, coordinate
    with the origin office to correct the documents timely to avoid any customs penalty
    and inconvenience to the customers at destinations


    3. Filing of customs manifest either directly on the customs system or through
    a third-party vendor


    4. Issuing cargo arrival notices to consignees so that they can file the import
    declaration timely with the customs for clearance of their goods


    5. Coordinating with the Container Freight Station (CFS) and carrier for collection
    of documents, cargo release, arranging devanning of containers, and returning
    empty container back to the carriers


    6. Invoicing customers and closure of file, as per the internal key performance
    indicators


    The process for the FCL import team is similar to LCL import, except that for
    FCL customers, they have the choice to receive the container at their factory
    premises to carry out devanning and return the empty container to the carrier
    yard once they have devanned the cargo contents, as shown in [Figure 30](#chapter12.xhtml#fig30).


    ![](images/fig30.jpg)


    **Figure 30.** Import LCL Process at ECU Worldwide


    *Export department*


    LCL export operations have a greater workload as compared to imports. For LCL
    export operations, the team has the following responsibilities:


    1. Preparing the export tariff rate card and sharing with the sales department
    before updating the system


    2. Creating the sailing schedule in the system and share with customers on request


    3. Receiving bookings from customers and, depending on the cargo receiving date,
    assigning the shipment to a particular sailing date and providing the booking
    to customers accordingly


    4. Coordinating with the carrier and customer or customer-appointed customs broker
    to


    a. Follow up on booking confirmation


    b. Confirm cargo receipt with CFS


    c. Arrange 20-feet or 40-feet container(s) based on the total volume


    d. Place booking with carriers


    e. Coordinate with carrier for empty pick up from carrier yard


    5. Completing vanning (stuffing) of the container and also ensuring that CFS has
    taken pictures outside and inside the container while loading the container to
    confirm there is no container damage and to confirm that the cargo is loaded in
    good condition at the origin


    6. Submitting manifest to local and overseas customs and carrier to ensure compliance
    with the regulation


    7. Sending pre-alerts to overseas office and closing the file


    FCL exports are similar to LCL exports except that the shipper has the option
    to load the container at their factory and send the loaded container straight
    to the port for vessel loading, as shown in [Figure 31](#chapter12.xhtml#fig31).


    ***The Future***


    Uday Shetty is committed to improving the whole operation of the present company.
    He would like the current operating procedures to be redesigned such that it is
    more customer-centric with the help of a new information system for the company.
    He is keen to use blockchain with Internet of things (IoT) to transform the LCL
    industry.


    ![](images/fig31.jpg)


    **Figure 31.** Export LCL process at ECU Worldwide


    ***Proposed Framework for LCL Business***


    Based on the requirements from ECU Worldwide, a new framework is proposed based
    on the following principles and is recommended for any exporters, importers, carriers,
    and related parties in the seaborne commerce that use containers to transport
    cargo.


    *Principle 1. Organize work around outcomes, not tasks*


    The idea of using blockchain is to bring added convenience to businesses. It is
    therefore important that the process is not merely one that transfers data online.
    Users would be able to enter information and blockchain will help store information
    on a common cloud server as encrypted records.


    *Principle 2. Let those who use the process perform the process*


    The relevant supply chain partner in the ecosystem can enter the information into
    the blockchain-enabled system as part of the process and the smart contract will
    validate the information.


    *Principle 3. Capture information once at the source*


    With the integrated form, common information will be filled in only once and recorded
    in blockchain. Data stored in the blockchain will be made available to anyone
    who has access to these data.


    *Principle 4. Link or convert sequential activities into parallel activities*


    All parties involved will concurrently receive the same transaction information
    with blockchain-distributed ledger technology. Such information allows parallel
    processing by each party and allows dependencies to be coordinated through the
    system, thus ensuring that applications are processed in a timely fashion.'
