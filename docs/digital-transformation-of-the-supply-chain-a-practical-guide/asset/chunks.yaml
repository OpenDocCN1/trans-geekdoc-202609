    ## **Chapter 10**


    ## **SUCCESS STORY IN BUSINESS LICENSING TRANSFORMATION**


    **Transforming Business Licensing in Singapore**


    This case that we have studied involved investigating the implementation of a
    key public service process and related processes, and system integration issues
    in business licensing. Starting a business in Singapore used to be a complicated
    and tedious process. An applicant needed to first register her/his business as
    a legal entity. Registration alone could cost up to thousands of dollars. The
    agency in charge would then “advise” the applicant on the “likely” licenses that
    she/he would need from other agencies to start her/his business.


    A license is a permission to do something that otherwise is forbidden. For instance,
    a childcare center license is needed before anyone is allowed to run a childcare
    center. A license is therefore a government privilege. It presumes that the activity
    in question is a privilege, not a right. A license also involves the policing
    power of the state. That is, if one violates the licensing law, either by acting
    without a license or failing to uphold the conditions governing the license privilege,
    one is subjected to prosecution under the civil or criminal laws of the governing
    body. As such, admittedly or not, licensing is to restrict entry and control a
    profession or activity.


    Class licensing is another form of licensing involving a significant reduction
    in administration as compared to licensing. Under this regime, conditions are
    stated upfront so that the applicant can declare that she/he is aware of these
    conditions of the license and proceed to apply for it. Agencies can conduct inspections
    after the license has been issued. If the applicant were found to have breached
    the conditions, the agencies could then act against her/him. Evidently, the main
    difference between class licensing as compared to the “conventional” licensing
    regime is the absence of pre-screening. The conditions that are favorable for
    implementation of class licensing are as follows:


    • There is still a need to actively regulate the business environment because
    of high costs involved.


    • Pre-screening is not necessary and the business activity as a whole is seen
    to be beneficial to the populace.


    • Control as well as meeting of the policy objectives is enforcementbased.


    • Extensive information about the business is necessary to enforce licensing rules.


    Obtaining or renewing a business-related license in Singapore was a time consuming
    and complex process until recently. This was especially true for new businesses
    and others unfamiliar with the licensing process. Even if an applicant had the
    required knowledge regarding a license application, she/he still had to deal with
    multiple agencies and repeatedly filling up application forms with the same information,
    as illustrated in [Figure 27](#chapter10.xhtml#fig27). For example, the setting
    up of a public entertainment outlet required licenses or permits from at least
    two agencies.


    The applicant could confirm her/his business registration or wait for the results
    of License X and Y before confirming the business registration. Payment signified
    the applicant’s acceptance or confirmation of the approved application. If License
    X or Y were not approved, she/he could terminate the business registration. If
    the business registration were not approved, she/he could similarly terminate
    the license application. The entire process could take up to a few months. In
    the worst-case scenario, the applicant might be denied a critical license without
    which she/he could not start the business, despite having forked out a significant
    amount of time and money for registration and other licenses.


    The case of a restaurant start-up in Singapore illustrates this situation: the
    license application for converting a warehouse into a restaurant was approved
    by one agency and the fee was collected, but the start-up had to be abandoned
    as another agency later rejected the application because of potential traffic
    problems.


    ![](images/fig27.jpg)


    **Figure 27.** Original business licensing process


    **OASIS: The Transformation Project**


    The Online Application System for Integrated Services (OASIS) project was started
    in August 2001 to focus on a particularly important form of red tape for start-ups:
    *licenses*. This is because start-ups are likely to be most disadvantaged by red
    tape due to their lack of resources. The project was led by the Ministry of Trade
    and Industry (MTI) and involved more than 30 other government agencies and their
    154 licenses that are relevant for start-ups. The most important and unique element
    of the OASIS project was the review of rules and licenses related to the setting
    up of businesses. At least 10% of licenses were committed by agencies for removal,
    and the average processing time of these licenses was reduced from 3 weeks to
    12.5 days.'
