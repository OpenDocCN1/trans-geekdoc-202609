    # Supply Chain Maturity Model


    A supply chain maturity model was proposed by Archie Lockamy and Kevin McCormack
    in 2004 to determine how integrated a company’s supply chain is, as shown in [Figure
    1](#chapter2.xhtml#fig1). The model conceptualizes how process maturity relates
    to the Supply Chain Operations Reference (`SCOR`) model framework, which was developed
    by the Supply Chain Council, an independent non-profit organization considered
    as a benchmark and standards defining entity for supply chain management. It was
    designed for effective communication among supply chain partners and can be used
    to describe, measure, and evaluate supply chain configurations. The current version
    of the model is owned by the Association for Supply Chain Management. As we know,
    `SCOR` is based on five distinct management processes: `plan`, `source`, `make`,
    `deliver`, and `return`.


    ## Maturity Levels


    The model consists of five maturity levels:


    ### Level 1 — Ad hoc

    The supply chain and its practices are unstructured and ill-defined. Processes,
    activities, and organizational structures are not based on horizontal processes,
    while process performance is unpredictable. Supply chain management costs are
    high, customer satisfaction is low, and cross-functional cooperation is also low.


    ![](images/fig1.jpg)


    **Figure 1.** Maturity model for supply chain process integration (Lockamy & McCormack,
    2004)


    ### Level 2 — Defined

    Basic supply chain processes are defined and documented, but the activities and
    organization basically remain traditional. Supply chain management costs remain
    high and customer satisfaction has improved but is still low. Representatives
    from functions meet regularly to coordinate with one another concerning process
    activities, but only as representatives of their traditional functions.


    ### Level 3 — Linked

    This level represents the breakthrough. Cooperation between intra-company departments,
    suppliers, and customers is established. Cross-functional and cross-company teams
    that share common process measures and goals are formed. Supply chain costs begin
    decreasing, and customer satisfaction begins to show a marked improvement.


    ### Level 4 — Integrated

    The company, its customers, and suppliers cooperate on the process level. Organizational
    structures are based on supply chain management procedures; supply chain management
    performance measures and management systems are applied. Advanced supply chain
    management practices such as collaborative forecasting with other members of a
    supply chain are formed. Consequently, supply chain costs are markedly reduced.


    ### Level 5 — Extended

    Competition is based on supply chains or “multi-firm networks”. Collaboration
    between companies is on the highest level — multi-firm supply chain management
    teams with common processes, goals, and broad authority form a horizontal working
    group. Customerfocused, collaborative culture is in place.


    ## Digital Supply Chain Transformation


    Digital supply chain transformation focuses on supply chain maturity level 4 and
    level 5 where cross-organization processes are fundamental to their businesses.
    What it means is that an organization must be at a maturity level 3 or above in
    the above framework to even initiate a digital transformation of the supply chain.
    A few examples are illustrated here:


    The company could collaboratively engage with its channel partners or resellers
    in joint demand forecasting and sales planning. A step further, another company
    could involve suppliers in collaborative product design and engineering. Another
    company would undertake the path of a refreshed inventory optimization and distribution
    channel management initiative to redefine parameters and policies. Yet another
    initiative for an organization would be to review and redesign the global supply
    chain network and carry out renewed financial planning. Another company would
    simply want to refresh the human talent for digital supply chain transformation
    through human resources acquisition, deployment, and optimization.


    The maturity level tells us one criterion by which a company should consider defining
    the process scope of a particular digital supply chain transformation initiative.
    However, that is more of an inward-looking assessment of what processes we can
    pick up based on where we are currently. In our view, we also need to juxtapose
    this with external market trends or industry peer group initiatives. This helps
    the candidate company ensure that they are ready from a pre-requisites standpoint
    to embark on the digital supply chain transformation journey, and at the same
    time identify a scope of processes for digital transformation based on relevant
    industry initiatives. This kind of overlaying helps us to also make sure that
    the scope of processes for supply chain transformation is relevant to the needs
    of our customers and therefore high in relevance. We notice some digital initiatives
    that have seen the most traction in recent years and are being implemented by
    quite a few companies across industries.


    Quite a few companies are establishing relevance for smart contracts using blockchain
    to better identify suppliers and negotiate better prices and service levels. Others
    are carrying out advanced predictive spend analysis to redefine procurement and
    sourcing strategies. Most manufacturing organizations are defining criteria and
    parameters for a procurement visibility control tower. Some of them are going
    a few steps back to first identify scenarios and business processes for exception
    handling through advanced analytics powered by machine learning and artificial
    intelligence. We are also aware of many companies moving towards automated requisition
    to purchase order creation and release to supplier, learning the buyer’s routine
    activities through robotic process automation (`RPA`). Companies are also reviewing
    and enhancing purchasing processes in their enterprise resource planning (where
    available) to enable automated reminders to suppliers on non-receipt of acknowledgment
    or advanced shipping notice as expected. Many companies are now implementing automated
    goods receipt processing and invoice reconciliation leveraging optical character
    recognition. With advanced maturity in sourcing processes established, organizations
    are also moving towards consolidation of purchase requirement quantities from
    different sources to align to minimum order quantity of suppliers.


    Even prior to the COVID-19 pandemic and its effects on the demand for goods and
    services, the economic situation in many countries had already prompted companies
    to implement segmented demand and supply planning for maintaining optimum inventory.
    Many of them also started to improve their supply chain monitoring by sales and
    operations planning dashboard creation and publishing by roles. Consensus demand
    planning workflow activities are now being established by those companies that
    have already matured on the consensus process. And some are going the next step
    of implementing demand sensing by incorporating external factors into demand plan
    leveraging artificial intelligence/ machine learning algorithms. Quite a few organizations
    are now collaborating in real-time with channel partners or resellers in joint
    demand forecasting and sales planning, leveraging a cloud-based supply chain collaboration
    platform.


    In the outbound logistics realm, almost all leading companies in every industry
