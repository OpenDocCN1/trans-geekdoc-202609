- raw: 'The targeted customers are start-ups in any sector, as well as existing companies
    venturing into new sectors. OASIS offers users an online one-stop service to meet
    their regulatory obligations prior to starting their business. The key value propositions
    of OASIS include:


    • Reducing the inconvenience of manual applications


    • Consolidating, integrating, and making various processes transparent


    • Allowing the applicant to enter essential information only once to concurrently
    register the business and apply for multiple licenses and permits (information
    will automatically be relayed to the backend systems of relevant agencies)


    • Making it less costly and much quicker to start up a business


    • Fostering a more pro-enterprise environment in Singapore


    ***Vision of OASIS***


    The vision of OASIS has been to enable its customers to meet the regulatory requirements
    needed to start a business in a hassle-free manner, entirely through the Internet.
    While it has defined its niche within the scope of critical regulatory requirements
    to start a business, OASIS has the potential to be eventually scaled up as a one-stop
    business center encompassing sales tax registration, employee retirement fund
    registration, etc.


    ***OASIS Project Team***


    The OASIS team comprised of a high-level steering committee (SC), the core team,
    and the authorized agency officers (AAOs). The OASIS SC, chaired by the Deputy
    Secretary of MTI and co-chaired by the Deputy Secretary of the Ministry of Finance
    (MOF), consists of representatives from the key ministries with license and permit
    activities. The OASIS SC provides a channel to surface issues for higher-level
    decisions. The OASIS SC meets once every month, but should expedited resolutions
    be needed, discussions and decisions are done through electronic means. The core
    team, comprising MTI and Infocomm Media Development Authority (IMDA) officers,
    plays the role of co-coordinator and facilitator to help ensure that all aspects
    of the project are competently executed. The core team reports to the SC on the
    status of the project and seeks directions on difficult issues. The AAOs are appointed
    by their respective licensing agencies to maintain their license content in the
    OASIS website, ensuring that license information and business rules are promptly
    and accurately created and updated.


    **Table 13.** Project phases for the OASIS transformation


    ![](images/tab13.jpg)


    The transformation project requirements were broad, covering many agencies and
    licenses, and spread over a number of years. The total cost, estimated at between
    US$3.5 million and US$5 million, was funded by MOF. The size, complexity, and
    cost of the project warranted a phased approach to mitigate inherent risks and
    benefit from progressive experience and learning while engaging the various stakeholders
    when and where they were needed. Key activities were also defined for the various
    phases to direct and control the project (see [Table 13](#chapter10.xhtml#tab13)).
    While MTI and IMDA committed its officers to manage the project, the respective
    agencies provided the necessary manpower and information technology (IT) professionals
    to implement the necessary changes on their end and to ensure system compatibility
    with OASIS.


    ***Phase 1: Review Licensing Process***


    This initial phase involved an extensive government-wide review of agency licenses
    to validate the need for the license. Furthermore, it included a review of compliance
    cost and licensing fees for businesses and an examination of flexible licensing
    systems. The team’s initial efforts in getting agencies to review their licensing
    policies encountered some difficulties:


    • Agencies have little incentive or motivation to get rid of a license, particularly
    if revenues are collected from the issuance of the license.


    • Agencies are concerned that without the license, effective regulation or enforcement
    cannot be assured, thus compromising safety and quality standards.


    • Agencies cite some “difficulties” in revoking licenses.


    • There may be hidden or additional requirements that are not so apparent on paper.


    However, these statements tend to be indicative of general inertia and resistance
    to change, particularly since many agencies may feel that an existing system is
    already working well (at least, for administrative convenience) and generating
    substantial revenue. Furthermore, there is a tendency toward being agency-centric
    in carrying out a regulatory function as opposed to being customer-centric.


    To change the mindset of these agencies, a broad principle was recommended by
    the OASIS SC in rethinking current policies toward customer-centricity: process
    re-engineering focusing on customer-centricity, yet tempered with the basic regulatory
    needs. Minimal regulatory costs in terms of time and money expended should be
    imposed on the customer in order to fulfil the regulatory requirements. Government
    agencies have to put business customers first and plan the processes around their
    needs, looking at innovative and cost-effective solutions. These agencies must
    adopt a mindset that the licensing system is to be customer-centric and pro-enterprise
    while meeting regulatory requirements. This approach is a sheer contrast from
    the previous approach where delivery of the licensing services was organized along
    agencies’ silo regulatory processes, leading to cumbersome and costly red tape
    for businesses. At the same time, various requirements and processes should be
    made as transparent as possible.


    ***Phase 2: Challenge Assumptions and Generate Ideas***


    The review of existing licensing regulations and policies required agencies to
    re-examine various facets of the licensing regime through a series of questions,
    enabling agencies to challenge assumptions they had taken for granted:


    • What is the rationale of the license?


    • What is the fee charged to the applicant?


    • What was the initial cost incurred by the agency for the purpose of administering
    the regulation?


    • What is the cost incurred by the agency for each additional applicant?


    • What are the requirements for approval of this license?


    • Are these requirements waived occasionally? If so, how often?


    • Do you usually need to have applicants meet with your agency to provide additional
    information face to face?


    • Is there a regulatory check before the license is issued?


    • How often is the application rejected and usually for what reasons?


    • How often is enforcement conducted after the license is issued?


    • How often have offenders been caught in violation of the rules?


    ***Phase 3: Apply Redesign Principles***


    It is pertinent that the license process is redesigned to align with key business
    objectives. The core team recommended the following key redesign principles for
    the new license process:


    *Principle 1. Organize work around outcomes, not tasks*


    The idea of e-enabling the license application process is to bring added convenience
    to businesses. It is therefore important that the process is not merely one that
    transfers bureaucracy online. With OASIS, the applicant only needs to log-on once
    to apply for several approvals in one session. If the applicant chooses to apply
    for more than one license, all relevant data fields pertaining to each license
    will be pulled together into a single set of forms so that the applicant can apply
    for the various approvals in a single form-filling process.


    *Principle 2. Let those who use the process perform the process*


    The Online Business License Profiler generates a list of licenses for the applicant
    based on her/his desired business activity using rule-based technology, allowing
    her/him to select the licenses to be applied for. The applicant can also search
    for licenses from the listing of government agencies or by using the search engine.


    *Principle 3. Capture information once — at the source*'
