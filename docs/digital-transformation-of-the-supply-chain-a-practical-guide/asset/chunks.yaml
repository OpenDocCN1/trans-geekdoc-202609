    Founded in 1987, Belgium, ECU Worldwide (ECU) is a global leader in non-vessel
    operating common carrier services. Backed by a rich legacy, passion, and agility,
    the company has brought in world-class innovations in LCL and set several benchmarks
    in the industry over the last two decades.


    Allcargo Logistics Ltd., India’s largest integrated logistics solutions provider
    in the private sector, acquired the company in 2006, which resulted in further
    efficiency improvements in operations. In May 2016, the company was rebranded
    as ECU Worldwide and consolidated their global presence by bringing all the offices
    under a single name to denote well-knit offices and highly-coordinated operations.
    The quest to bring geographies closer to their customers has remained unchanged,
    thus etching the philosophy of ‘Geography Simplified’.


    As more countries are industrializing and manufacturing sectors are expanding
    their businesses, they would normally outsource their logistics requirements to
    be handled by third-party logistics providers. Therefore, the expected demand
    in the logistics sector would be expected to grow as countries were able to maintain
    an average growth of seven to eight percent annually.


    Led by a strong management team, and offices in 160 countries, the company is
    now offering LCL and FCL (full container load) services across the globe. Its
    wide variety of value-added services and logistics solutions make them excel in
    handling and transporting complex cargo to anywhere in the world in a seamless
    way.


    ### Mission of ECU Worldwide


    To simplify geographies with the expertise of their human resources through seamless
    integration of their offices and world-class technology.


    ### Vision of ECU Worldwide


    The vision for the company is “To be the global leader in our business, through
    customer delight by innovations, agility and sustainable business model.” Uday
    Shetty, the Regional Chief Executive Officer (CEO) for APAC, described that ECU
    had grown from a small small and mediumsized enterprise to be one most reputed
    LCL providers in the world over the past 30 years. As a result of forward integration,
    ECU had evolved from LCL business to also venture into related industries in the
    logistics area, such as transportation, warehousing, and distribution.


    Presently, ECU’s head office is based in Mumbai, India, as explained by Shetty.
    However, its online system can be accessible anywhere in the world to provide
    booking and tracking services for their customers.

