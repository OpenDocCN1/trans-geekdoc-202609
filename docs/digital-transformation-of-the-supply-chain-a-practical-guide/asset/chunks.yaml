  trans: "\n\n公司 PQR 是一家总部位于印度的多亿美元建筑公司。该组织期望采购职能更具前瞻性而非被动性。公司的首席体验官级别领导层期望看到采购职能参与公司的重大决策。组织首先着手制定政策以根除采购绕行问题，其中各部门在日常和计划需求采购中习惯于忽视采购建议和研究。因此，他们开展了一项采购和采购流程评估，以识别可引入数字杠杆的潜在领域，例如人工智能/机器学习（AI/ML）、机器人流程自动化（RPA）和区块链，以及其他适用技术。一些已识别并列入数字供应链转型路线图的关键业务需求如下所示。\n\
    \n首先，公司确定了采购职能已在使用的核心业务系统和解决方案：电子采购和电子拍卖、电子目录、合同管理、供应商信息管理、电子采购、电子发票和支出分析。\n\n\
    以此为基础，公司开始了他们所称的“人工智能发现之旅”。确定了以下杠杆：\n\n• 利用数字云平台的协作供应商网络\n\n• 由前瞻性风险建模驱动的供应商风险管理，基于内部和外部参数，利用预测分析\n\
    \n• 机器人流程自动化被确定用于自动化采购的运营采购到付款环节。此处的流程在数量上庞大，本质上高度交易化，需要投入时间和资源。RPA 预期带来的主要益处包括最大限度减少人工接触点，从而增强采购订单管理，并为未来保持强大的审计追踪。\n\
    \n一旦负责采购的人员对采购做出决定，她期望 RPA 向组织的各个部门触发警报，例如工厂（规划产出和资源利用）、营销（规划促销活动）、销售（根据产出和促销预订订单）以及财务（损益分析、运营成本）。在上述情况下，采购流程将对组织更具战略意义。\n\
    \n• 认知计算和人工智能：买方面临的主要问题之一是确定构建成品的成本因素。当买方对原材料进行战略评估时，她需要借助人工智能了解影响材料价格的因素。当买方选择产品及其联合国标准产品和服务代码时，人工智能应能够提取有关依赖材料的可用性、历史价格、当前供应商、全球市场可用性、最佳采购地点、质量标准、最佳交付路线、到工厂的交期以及到市场的交期的数据。\n\
    \n• 通过人工智能的预测/高级分析：对于从市场采购服务，公司期望借助人工智能，买方能够查明不同劳工委员会设定的技能费率、市场上的熟练劳动力可用性以及当前市场费率。\n\
    \n• 直观易用的可视化工具\n\n此后，数字创新团队确定了可能在未来影响采购和采购的新兴解决方案和数字技术：\n\n• 区块链：目前纸质合同存在以下明显且众所周知的问题：\n\
    \  ○ 耗时耗力的合同起草、工作流、审批、文件和签名流程\n  ○ 内在的安全风险\n  ○ 不断增加的高额管理成本\n  ○ 需要物理存储空间\n\n\
    区块链在采购中的应用将是实现无差错且值得信赖的业务交易的一项举措。不再需要发票对账，不再需要付款审批，不再需要货物收据的三方匹配。\n\n• 3D 打印\n\
    • 传感器/可穿戴设备\n• 网络追踪\n• 虚拟现实/空间分析\n\n## 第 4 章\n\n### 建立组织和人员准备度\n\n从实际执行角度来看，建立组织结构、工作方式以及明确的职责和责任分配，应是启动我们在\
    \ 第 3 章 中讨论的数字供应链转型的重要组成部分。同时，这一主题对数字供应链转型项目的预期成功至关重要，因此值得单独设立一章。\n\n该项目将根据我们在\
    \ 第 2 章 中概述的方面确定的范围而形成。根据供应链管理流程范围，将有一位项目发起人，已由公司领导层确定，代表公司整体供应链职能。此人将指定供应链管理职能或部门的一名高级员工来领导这一数字化转型项目。此人可称为项目总监、项目经理、转型负责人或数字供应链转型项目的转型经理。最终，重要的是该角色、职责范围和交付成果，此人将是唯一的责任归属点。我们稍后会回到定义这一至关重要的角色。首先，让我们谈谈如何为这样一项关键的业务举措构建组织结构：必然对公司收入和盈利能力产生影响的数字供应链转型项目。\n\
    \n过去多年中，不同组织为任何类型的业务转型、数字实施或类似项目采用了许多结构。传统做法是建立一个核心项目团队，如附录 3 所示。这通常涉及从流程角度对项目有利益关系的部门代表。此外，信息技术部门将为每个在范围内的流程区域提供专注代表，以便在项目的每个阶段引入数字应用或数字技术视角。核心项目团队将向指导委员会或指导小组汇报。指导小组将由部门主管和/或公司执行领导团队成员组成。供应链转型的领先实践是让首席供应链官或其等同职位担任该指导委员会的负责人，并担任项目发起人。根据数字转型项目的战略重要性，首席财务官、首席信息官和/或首席数字官以及首席执行官也将成为指导委员会的一部分。核心团队随后从其他部门、咨询或数字服务组织、数字应用或技术提供商招募额外的项目或项目成员，并根据启动的供应链流程转型范围，招募渠道合作伙伴或供应商等合作组织。因此，我们建议采用以下方法和结构来建立数字供应链转型项目的组织。\n\
    \n首先，项目发起人需要组建一个规模为五至七名成员的核心团队，这似乎运作最有效。虽然更大的团队规模并不罕见，但研究表明，核心团队成员超过 10 人可能难以达成共识并实现目标。关键选择原则如下：\n\
    \n"
