- raw: 'Technology has been breaking down geographical barriers through virtual co-location
    with supply chain partners. Geographically distributed resources should not constrain
    the operational team to only consider decentralized approaches to process harmonization.
    Companies need to leverage digital information and use the Internet as a powerful
    engine for digital collaboration to break geographical barriers. An example of
    such redesign includes the depot repair operations for used containers, as shown
    in [Figure 12](#chapter6.xhtml#fig12). In this case, the damages on the container
    are captured digitally and stored in a cloud server, and the owner of the container
    can approve or reject the repair immediately. All parties collaborate information
    in real time to maximize efficiency in the process.


    ![](images/fig12.jpg)


    **Figure 12.** Container depot global repair process


    **Principle 6. Link or Convert Sequential Activities into Parallel Activities**


    If sequential activities are operated independently, operational errors may not
    be detected until the end of the process. Parallel activities reduce delay and
    overall lead time. The concept of leveraging historical patterns by extensive
    process data mining has evolved in recent times into a digital value-stream mapping
    exercise that helps companies eliminate waste in processes and optimize lead times.
    An example of such redesign includes concurrent product design, as shown in [Figure
    13](#chapter6.xhtml#fig13). In this case, new product development can be achieved
    concurrently by various departments, including the customers and suppliers.


    ![](images/fig13.jpg)


    **Figure 13.** Concurrent product design


    **Principle 7. Design Process for the Dominant Flow, not for the Exceptions**


    The concept of process mining has evolved multiple times with the advent of technology-based
    enablers. Advanced process mining techniques nowadays capture dominant flows by
    running through years of historical transaction data from an enterprise resource
    planning (ERP) system. Once the baseline process flow is established based on
    the dominant flow, further value addition will include designing separate processing
    streams for different transaction types (e.g. different needs, complexities, exceptions,
    etc.). The key benefit of this principle is that it helps to reduce the risk of
    fragmentation and overly complex processes with inherent coordination problems.
    An example of such redesign includes designing service programs for different
    customer segments, as shown in [Figure 14](#chapter6.xhtml#fig14). Each customer
    segment has its own service expectation and needs to be fulfilled by contextualized
    services.


    ![](images/fig14.jpg)


    **Figure 14.** Differentiated services for each customer segment


    **Principle 8. Look for Ways to Postpone the Final Product**


    ![](images/fig15.jpg)


    **Figure 15.** Postponement strategy for different types of products


    In the last few decades, exemplary leading businesses in different industry sectors
    have successfully practiced “postponement” in manufacturing strategy, also known
    as “delayed differentiation”. Essentially, this strategy involves delaying the
    final product form as late as possible to reduce inventory and forecast errors.
    The manufacturing company would keep the product or service in generic form and
    customize it when the customer confirms the order. An example of such redesign
    includes paint retailers keeping generic white master batch and blending the chosen
    color to match each customer requirement on the spot, as shown in [Figure 15](#chapter6.xhtml#fig15).
    In this case, the retailer will not have to keep every product’s stock-keeping
    unit and color listed in the brochure but still be able to blend any color that
    the customer wants as long as the color pigment is available. Thus, postponement
    will reduce inventory costs and increase the customer service level at the same
    time.


    **Principle 9. Exploit Resource Pooling to Avoid Suboptimization**


    Companies can consolidate resource requirements to achieve economies of scale.
    Resource pooling will result in reduced inventory holding costs and improved forecast
    accuracy. An example of such process redesign includes centralizing the procurement
    process in hospitals, as shown in [Figure 16](#chapter6.xhtml#fig16). In this
    case, the hospitals will outsource the procurement of supplies to a third-party
    logistics provider, who will procure in bulk quantities and customize the products
    for these hospitals. Furthermore, hospitals will convert their storerooms into
    wards, thus generating more revenues.


    ![](images/fig16.jpg)


    **Figure 16.** Resource pooling by centralizing procurement process


    **Principle 10. Avoid Duplicating Tasks with Supply Chain Partners**


    With the advent of collaborative thinking across supply chain partners in different
    forms during the last few decades, companies and their supply chain partners should
    be reviewing how work should be shared across their collaborative functions so
    that redundancies or duplication are eliminated. The key guiding principle to
    make this a win-win for both partners is to carry out work where it makes the
    most sense to do it. An example of such redesign includes the elimination of quality
    control in a just-in-time production system. In this case, only the supplier will
    perform the quality check and send the raw material directly to the customer’s
    production floor. The results from the quality check are sent to the manufacturer
    for process and quality control.


    **Principle 11. Outsource Non-Core Processes**


    The outstanding success of business process outsourcing as a concept, and also
    as a business model, in the last three decades or so definitely underlines this
    principle. Fundamentally, companies can start with outsourcing processes that
    cost more to operate as compared to other service providers. More importantly,
    it helps the company to tap into external expertise that the company does not
    own. Another criteria could be, if demand for a company’s selling products is
    uncertain or fluctuating while the product has a stable consumption pattern at
    the market level, outsource the manufacturing process to another supplier who
    can scale up or down their operations according to the demand pattern or who are
    also supplying as contract manufacturers to the company’s peers.


    An example of such redesign includes digital archival of records in medical or
    law companies, as shown in [Figure 17](#chapter6.xhtml#fig17). In this case, the
    hard copies are scanned and indexed for searching purposes, and these hard copies
    are then moved to another location with lower storage costs. This process will
    speed up the document search and reduce the storage costs of documents since most
    of these companies operate in expensive downtown premises.


    ![](images/fig17.jpg)


    **Figure 17.** Digital archival of records for compliance


    Finally, for the implementation of the new process design, a detailed plan should
    be developed for moving the supply chain process from its present state to that
    envisioned in the new process design.


    This is when the program core team will classify all improvement opportunities
    and associated process redesign initiatives into quick wins, tactical gains, and
    strategic success opportunities, as explained in [Chapter 3](#chapter3.xhtml).
    The next step is prioritization of these initiatives and detailed business case
    preparation for each business opportunity. The recommended time period is to draw
    a five-year roadmap and timeline for realizing all the identified business benefits
    of the digital supply chain transformation program. In a later chapter of this
    book, readers will find a case study of a specialist patient clinic which successfully
    applied concepts discussed in this chapter to drive processes transformation and
    thereby improve efficiency and effectiveness in operations.


    ## **Chapter 7**


    ## **IMPLEMENTING THE DIGITAL SUPPLY CHAIN TRANSFORMATION**'
