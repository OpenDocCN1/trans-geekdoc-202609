    \nDesk Editor: Lai Ann\n\nTypeset by Stallion Press\n\nEmail: enquiries@stallionpress.com\n\
    \nPrinted in Singapore\n\n本书通过逐步、通俗易懂的方式解释了供应链流程转型的复杂性，从基础到如何实施这一复杂任务所需的成功要素。本书提供了如何领导转型项目以及如何在内部和外部管理变革的见解。作者在实地通过应用研究的实践经验在案例研究中得到了清晰的体现，为读者提供了实施供应链转型项目所面临的挑战和收益的实际范例。所有供应链专业人士必备之书。\n\
    \n**Professor Cedwyn Fernandes**  \nPro-Vice Chancellor, Middlesex University,\
    \ Dubai\n\n供应链流程转型已成为全球经济竞争中不可或缺的一部分。本书基于扎实的研究和实际案例，对这一再造过程提供了富有洞察力的方法。我们已学习并应用了一些概念来简化我们的流程。\n\
    \n**Mr. Teh Wee Chye**  \nManaging Director, Malayan Flour Mills Bhd, Malaysia\n\
    \n成功的公司能够在正确的时间以正确的价格向正确的客户交付正确的产品。本书对实现数字化供应链的转型艺术提供了简洁清晰的解释。它挑战了供应链中旧有的做法，并帮助您为盈利能力和可持续性转型您的供应链。\n\
    \n**Mr. Hsiao Chink Tang**  \nSenior Economist, East Asia Department, Asian Development\
    \ Bank, Philippines\n\n公司的供应链管理不应再局限于物流部门的一小群人。它是一个跨职能问题。就像现在公司将销售责任推给每一位员工一样，每个部门在供应链流程中都扮演着关键角色，就像复杂行为链中的环节一样。挑战在于改变公司员工的思维或文化，从孤立的、“我们对他们”的心态转变为真正的团队合作。本书是供应链流程转型的必备《如何操作》指南，应被视为任何希望保持竞争优势的公司的指南。\n\
    \n**Mr. Raymond Yee**  \nVice President of Customs & Regulatory Affairs, DHL Express\
    \ Singapore Pte Ltd, Singapore\n\n## PROLOGUE\n\n在过去几十年里，最新的技术改善了企业内部四面墙内的流程，电子商务帮助弥合了企业与供应商之间的沟通，而其他供应链系统比以往任何时候都更快、更高效地将产品推向市场。但演变并未止步于此。今天，供应链数字化正在引领一种全新的商业模式，在这种模式下，实时连接、更大可见性、实时响应能力和预测能力将成为我们业务的底层特征。但这不会一夜之间发生。企业需要在此基础上构建过去解决方案提供的增量进步，同时努力实现网络化、数字连接的未来。\n\
    \n公司及其延伸的供应链需要踏上数字之路。这不是简单或直接的旅程。对每个企业来说也不相同。但这是一次值得进行的旅程——不仅是为了最终目标，也是为了途中带来的所有益处。虽然没有通往成功的单一路径，但在各个行业中，领导者之间都有几个共同的特征。从这些例子中，我们开始看到构成成功数字化转型基础的具体数字构建模块，无论是技术还是流程。本书试图汇集新的见解，说明如何领导数字化供应链转型项目以及如何在内部和外部管理变革。\n\
    \n## CONTENTS\n\n*Prologue*\n\nChapter 1 Relevance of Digital Transformation for\
    \ Supply Chains\n\nChapter 2 Identifying Processes for the Digital Transformation\
    \ of the Supply Chain\n\nChapter 3 Initiating the Digital Transformation of the\
    \ Supply Chain\n\nChapter 4 Establishing Organization and People Readiness\n\n\
    Chapter 5 Supply Chain Process Assessment for Digital Transformation\n\nChapter\
    \ 6 Supply Chain Process Redesign for Digital Transformation\n\nChapter 7 Implementing\
    \ the Digital Supply Chain Transformation\n\nChapter 8 Supply Chain Transformations\
    \ in the Healthcare Industry\n\nChapter 9 Managing Process Change with Supply\
    \ Chain Partners\n\nChapter 10 Success Story in Business Licensing Transformation\n\
    \nChapter 11 Criteria for Success in Digital Supply Chain Transformation\n\nChapter\
    \ 12 Success Story in Digital Supply Chain Transformation Success Story in Digital\
    \ Supply Chain Transformation\n\n*Appendices*\n\n*Glossary*\n\n*Bibliography*\n\
