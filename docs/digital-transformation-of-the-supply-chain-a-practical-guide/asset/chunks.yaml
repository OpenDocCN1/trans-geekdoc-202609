    ## Time analysis for original process


    Time taken to collect, repair, and return to customers was too long. Customers
    expect shorter duration regardless of location.


    • Time taken to collect, repair, and return the defective equipment to customers
    in Bangkok was taking about 6 to 11 days


    • Time taken to collect, repair, and return the defective equipment to customers
    in other provinces would take about 12 to 40 days


    ## Cost analysis for original process


    Customers are not willing to pay for the transport cost from the service center
    back to their home. Neither are they willing to pay to collect it from the service
    center themselves.


    • Cost to collect the defective equipment from the customer and deliver it to
    the service center is US$0.20 to US$0.79 using the company’s own truck and US$0.75
    to US$1.75 using a third-party truck


    • Cost to deliver the repaired equipment back to the customer is US$0.20 to US$0.79
    using the company’s own truck and US$2.50 to US$3.75 using the National Postal
    Service


    ## Quality analysis for current process


    Customers complained about the poor level of service using the centralized service
    center. Sometimes the repair quality gets affected during transportation from
    centralized service center. The turnaround time is long and customers are not
    willing to collect the equipment after it has been repaired.


