- raw: 'We are undergoing the next great industrial revolution and judging by the
    speed at which we’ve seen digital disruption tear through industries, today’s
    technology may be more disruptive than the revolutions driven by steam power,
    assembly lines, and the first computers. The rise of digital, data-driven technology
    has transformed entire industries, helping the smallest start-ups quickly establish
    a presence, scale in record time, and pave the way for entirely new business models.
    On the other hand, established brands that have turned a blind eye to the digital
    age, too satisfied with the status quo to change, are being toppled at alarming
    rates. While new technologies and digital solutions have slowly been introduced
    to different areas of business, many of those designed for supply chain have focused
    on solving well-known problems.


    Today, all industry supply chains are at a cusp of innovation. 2020 has been a
    watershed year in terms of supply chain strategies across all industries without
    exception. Majority of companies across industries had some supply chain strategies
    pre-COVID-19 and quite a few digital supply chain initiatives in different stages
    of planning or execution. In the post-COVID-19 world, all these strategies are
    already being reconsidered. Supply chain visibility needs to take another step
    forward using real-time data integration across end-to-end entities and partners
    to enable more effective decision-making and boost cash flow benefits, measured
    by working capital improvements. Truly, disruption is turning out to be the mother
    of innovation. So how to be the innovative supply chain and stay ahead to generate
    those cash flow benefits?


    Adopting a digitally enabled transformation strategy will allow supply chains
    to take advantage of the upsides and maintain an agile and flexible cost base.
    Leading analysts and top Fortune 100 companies are already talking of digitally
    enabled themes that could be transforming supply chains in the near-term and medium-term
    future. So first we talk about what is the current situation and what supply chains
    can do today to be “rightly” prepared for disruptions, which are now understood
    as frequent norms. Supply chains need to realign their objectives in the face
    of:


    • Changing population demographics based on increasingly urbanized population
    and new migrations that will happen once economic activity revives


    • Constant pressure yet again to reduce costs and increase access to information
    across not just direct supply chain partners but across the ecosystem of partners


    • Increased customer awareness with online information availability and real-time
    response expectations


    • Renewed focus on resilience in supply chains, which is naturally linked to improving
    visibility across multi-tiers of supply chain partners


    • Government reform programs and regulations influencing or dictating most industries.


    Today, companies need to prepare supply chains for tomorrow’s necessary digitalization
    by establishing the right foundation of processes. The 2020 situation, with the
    COVID-19 pandemic, highlighted the fact that levels of automation and digitalization
    are varying from above medium to quite low across industries such as pharmaceutical,
    retail, consumer goods, automotive, general manufacturing, oil and gas, and construction.
    Despite the supply and demand crisis which most companies have been put into,
    it makes for a good time to actively experiment and start on a path of agile and
    continuous improvement.


    With customer centricity as a renewed focus of business strategy, the current
    global situation demands that companies across industries innovate and make their
    supply chains more agile and flexible. This need is also required to support key
    business tenets for improvements in efficiency, sustainability, customer centricity
    and reduction in material or resource waste. To achieve this, companies must focus
    on and tackle key business problems and current vulnerabilities like:


    • Lack of visibility into the complex globally dispersed supply chain beyond direct
    suppliers


    • Inability to accurately track the level of current and incoming material or
    finished product inventories to be sold


    • No information on demand fluctuations, which will now vary with huge spikes
    and valleys


    • Too much reliance on the workforce for more manual and time-intensive activities
    like data gathering and reporting


    • Longer lead times and dependency on partners for production or supply of critical
    materials


    In effect, 2020 has reinforced the need for businesses to embark on digital transformations
    of supply chains. It is also worthwhile to consider industry-specific imperatives.
    Let us take the example of the oil and gas industry. Decline in oil prices spells
    a supply chain optimization opportunity for the industry. With worldwide production
    outpacing demand, oil prices have fallen precipitously in recent years. Led by
    “lockdowns” where stay-at-home orders were imposed globally in efforts to curb
    the spread of COVID-19, the downturn in oil demand has been a moment of reckoning
    for the oil and gas industry. And on the other side, the demand will start increasing
    as people prefer personal to public transport in a post-pandemic world in a bid
    to reduce contact with others. The ability of the oil and gas industry to address
    a number of operational challenges will be critical in ensuring that future demand
    is met with adequate supply.


    In the context of the oil industry, important precursors to a digital transformation
    will therefore look like this:


    • Supply chain operating model design, i.e. a quick assessment of the existing
    situation and design and definition of the future state of digital operations


    • Redefining the sales and operations planning process across organizational functions
    covering process, technology, software applications, roles and responsibilities,
    skill sets, reporting, key performance indicators (KPIs), and governance


    • Software system enablement comprising of digital technology implementation,
    systems integration, useful business analytics, and relevant automation


    Every industry presents unique supply chain challenges, and the oil and gas sector
    has its own share of complexity. Transporting products requires special equipment,
    working under very strict regulatory compliances, and need extensive safety procedures.
    Very often, oil and gas operations are carried out at remote locations, and run
    24 hours, 7 days a week, for 365 days a year.


    Supply chain management in the oil and gas industry often involves multiple modes
    and multiple tasks such as supplying materials for oil rigs to moving extremely
    heavy equipment and hazardous materials. At another level, we are talking about
    the hydrocarbon value chain. At one end, we have petroleum and petrochemical sources,
    and at the consumer end, we have gasoline and liquified petroleum gas. Along this
    path, there are multitudes of hydrocarbon products as direct products, by-products,
    and many chemical reagents, catalysts, and solvents. Oil and gas industry leaders
    have been working on following supply chain improvement levers:


    • Rationalization of very complex supply chain networks to improve visibility
    and integration of the supply chain across different organizations in the hydrocarbon
    value chain. There will be many buyer–supplier relationships across these networks
    which demand simplification. We are now seeing companies even choosing to represent
    the supply chain network “radially” connected across partners — a massive shift
    from the linear representations of the past.


    • Implementation of global cross-industry standards in processes, digital technologies,
    and people practices referencing oil and gas, chemical, and consumer industry
    characteristics to enable central source of mission critical data and associated
    ability to rapidly respond to real world scenarios, such as a worldwide panic
    which can very quickly turn the demand and supply situation upside down.'
