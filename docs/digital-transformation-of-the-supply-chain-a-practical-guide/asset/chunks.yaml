  trans: "\n\n# 供应链成熟度模型\n\n供应链成熟度模型由 Archie Lockamy 和 Kevin McCormack 于 2004 年提出，用于确定公司供应链的集成程度，如\
    \ Figure 1 所示。该模型概念化了流程成熟度与供应链运营参考 (`SCOR`) 模型框架之间的关系，该框架由供应链委员会开发，供应链委员会是一个独立的非营利组织，被视为供应链管理基准和标准制定机构。它旨在实现供应链合作伙伴之间的有效沟通，可用于描述、衡量和评估供应链配置。模型的当前版本由供应链管理协会拥有。众所周知，`SCOR`\
    \ 基于五个不同的管理流程：`plan`、`source`、`make`、`deliver` 和 `return`。\n\n## 成熟度等级\n\n该模型包含五个成熟度等级：\n\
    \n### Level 1 — Ad hoc\n供应链及其实践是无结构的且定义不清。流程、活动和组织结构并非基于横向流程，而流程绩效不可预测。供应链管理成本高，客户满意度低，跨职能合作也低。\n\
    \n![](img/fig1.jpg)\n\n**Figure 1.** 供应链流程集成成熟度模型 (Lockamy & McCormack, 2004)\n\
    \n### Level 2 — Defined\n基础供应链流程已定义并记录，但活动和组织基本保持传统。供应链管理成本仍然很高，客户满意度有所改善但仍低。各职能代表定期会面以协调彼此的流程活动，但仅作为其传统职能的代表。\n\
    \n### Level 3 — Linked\n该等级代表突破。公司内部部门、供应商和客户之间的合作得以建立。形成跨职能和跨公司的团队，共享共同的流程指标和目标。供应链成本开始下降，客户满意度开始显著改善。\n\
    \n### Level 4 — Integrated\n公司、其客户和供应商在流程层面进行合作。组织结构基于供应链管理程序；应用供应链管理绩效指标和管理系统。形成先进的供应链管理实践，如与供应链其他成员进行协作预测。因此，供应链成本显著降低。\n\
    \n### Level 5 — Extended\n竞争以供应链或“多企业网络”为基础。企业之间的协作处于最高水平——多企业供应链管理团队拥有共同的流程、目标和广泛的权限，形成横向工作组。以客户为中心、协作的文化已建立。\n\
    \n## 数字供应链转型\n\n数字供应链转型聚焦于供应链成熟度等级 4 和等级 5，在这两个等级中，跨组织流程对其业务至关重要。这意味着，一个组织必须在上述框架中达到成熟度等级\
    \ 3 或以上，才能启动供应链的数字化转型。以下是一些示例：\n\n公司可以与渠道合作伙伴或经销商协作进行联合需求预测和销售规划。更进一步，另一家公司可以让供应商参与协作产品设计和工程。另一家公司将开展库存优化和分销渠道管理举措的更新，以重新定义参数和政策。另一个组织举措将是审查和重新设计全球供应链网络并进行更新的财务规划。另一家公司可能只想通过人力资源获取、部署和优化来为数字供应链转型更新人才。\n\
    \n成熟度等级告诉我们一个标准，即公司在定义特定数字供应链转型举措的流程范围时应考虑的标准。然而，这更多是内向型评估，即基于我们目前所处的位置可以挑选哪些流程。在我们看来，我们还需要将其与外部市场趋势或行业同行举措并列。这有助于候选公司确保他们从先决条件角度准备好踏上数字供应链转型之旅，同时根据相关行业举措确定数字化转型的流程范围。这种叠加也有助于我们确保供应链转型的流程范围与客户需求相关，因此具有高度相关性。我们注意到近年来获得最多关注并被众多跨行业公司实施的一些数字举措。\n\
    \n quite a few companies are establishing relevance for smart contracts using\
    \ blockchain to better identify suppliers and negotiate better prices and service\
    \ levels. Others are carrying out advanced predictive spend analysis to redefine\
    \ procurement and sourcing strategies. Most manufacturing organizations are defining\
    \ criteria and parameters for a procurement visibility control tower. Some of\
    \ them are going a few steps back to first identify scenarios and business processes\
    \ for exception handling through advanced analytics powered by machine learning\
    \ and artificial intelligence. We are also aware of many companies moving towards\
    \ automated requisition to purchase order creation and release to supplier, learning\
    \ the buyer’s routine activities through robotic process automation (`RPA`). Companies\
    \ are also reviewing and enhancing purchasing processes in their enterprise resource\
    \ planning (where available) to enable automated reminders to suppliers on non-receipt\
    \ of acknowledgment or advanced shipping notice as expected. Many companies are\
    \ now implementing automated goods receipt processing and invoice reconciliation\
    \ leveraging optical character recognition. With advanced maturity in sourcing\
    \ processes established, organizations are also moving towards consolidation of\
    \ purchase requirement quantities from different sources to align to minimum order\
    \ quantity of suppliers.\n\n即使在 COVID-19 大流行及其对商品和服务需求的影响之前，许多国家的经济状况已促使公司实施分段需求和供应规划以保持最佳库存。其中许多公司还开始通过按角色创建和发布销售与运营计划仪表板来改善其供应链监控。共识需求规划工作流程活动现在正由那些已在共识流程上成熟的公司建立。而有些公司则更进一步，通过利用人工智能/机器学习算法将外部因素纳入需求计划来实现需求感知。\
    \ quite a few organizations are now collaborating in real-time with channel partners\
    \ or resellers in joint demand forecasting and sales planning, leveraging a cloud-based\
    \ supply chain collaboration platform.\n\n在出境物流领域，几乎所有行业中的领先公司都开始将运输计划和日程转换为有意义的汇总仪表板，使用高级分析汇总关键绩效指标，如满载卡车和准时交付。也有最近的举措，利用物联网实现对仓库和配送中心内搬运设备和其他设备的实时跟踪。许多组织现在利用机器人流程自动化来支持仓库运营中材料的搜索和其他服务，而在物理层面，大多数公司正在仓库中实施机器人拣选、包装、分拣和装载货物。\n\
    \n"
