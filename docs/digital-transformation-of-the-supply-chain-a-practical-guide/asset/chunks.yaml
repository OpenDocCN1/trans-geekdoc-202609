    \ without adversely affecting efficiency |\n|  ||  |\n"
  trans: "\n\nSPC 的首席执行官发起此转型项目，目标和目的是提升其服务。\n\n目标是设计一个门诊流程，识别质量护理、患者服务和患者满意度的新成果。为实现目标，提出了以下目标：\n\
    \n• 彻底简化并精简职能和流程\n• 消除患者的常规排队\n• 改善访问 SPC 时的整体体验\n\n首席执行官为此项目精心挑选了一个项目团队，由医生、护士以及信息技术（IT）和相关支持人员组成。\n\
    \n## 假设浮现\n\n乍一看，似乎很容易说在决定做出哪些改变时，会以客户的需求作为基准。但，客户是谁；而且关于客户想要或需要什么所做的假设是否合理？感知的客户不一定与真正的客户一致。很可能涉及许多利益相关者，而最重要的利益相关者不一定是最终客户。\n\
    \n员工开始识别利益相关者并浮现假设。假设往往在不再成立很久之后仍然存在，并且是“不可见的”，除非有意尝试识别和审视它们。过时的假设是改变旧流程的重大障碍。SPC\
    \ 员工在浮现假设时使用了简单的模板，如下表所示。\n\n| WHAT 模板 |\n| --- |\n| 治愈对我们的患者很重要 |\n| 收取付款对我们很重要\
    \ |\n| 实验室检查需要专用设备 |\n| WHO 模板 |\n| --- |\n| 需要医生进行诊断/开具治疗方案 |\n| 患者必须在生病后才访问\
    \ SPC |\n| 患者必须从一个检查站移动到另一个检查站 |\n| WHERE 模板 |\n| --- |\n| 患者只能在 SPC 接受诊断 |\n\
    | 患者必须亲自领取药物 |\n| 医生必须在 SPC 进行诊断/治疗 |\n| WHEN 模板 |\n| --- |\n| 患者必须在接受治疗前先被诊断\
    \ |\n| 患者必须在做检查前先进行初步咨询 |\n| 患者必须在离开 SPC 前支付咨询/治疗费用 |\n| WHY 模板 |\n| --- |\n|\
    \ 患者必须接受检查以确定其状况 |\n| 必须知道患者的状况才能给予治疗 |\n| 需要初步咨询来确定适当的检查 |\n| HOW 模板 |\n| ---\
    \ |\n| 患者只能通过检查来接受诊断 |\n| 患者只能通过取样或做扫描等方式接受检查 |\n\n这些模板旨在作为员工浮现假设的指南，不必严格使用。在此阶段，有用的是纳入未参与此流程的团队成员。这些成员将能够质疑可能被他人视为理所当然的非常根本的假设。如果这些根本假设能被成功挑战，可以对绩效产生质的飞跃。\n\
    \n一些模板在视角上存在重叠，这是可以的，只要它们被列在任何一个模板中。是否纳入一个假设的决定是评估该假设是否可被视为障碍，以及如果被成功挑战，能否实现转型目标。\n\
    \n在通过利益相关者分析识别潜在客户后，接下来重要的是质疑对利益相关者群体所做的假设。在某些情况下，没有必要询问客户他们想要什么，员工反而对他们认为对客户重要的事情做出一些假设。假设浮现将为转型在浮现和挑战假设这一关键领域带来进一步的严谨性。在浮现所有假设之后，下一步是员工挑战假设，要么质疑这些假设在当今背景下的相关性，要么通过反驳它们来实现绩效的根本性改善。这在下表中有所说明。\n\
    \n### 表 11. 私人诊所的假设与挑战\n\n| **假设** || **挑战** |\n| --- | --- |\n| **WHAT 模板** ||\
    \  |\n| 治愈对我们的患者很重要 || • 保持健康对我们的患者很重要  \n• 快速治愈且成本最低、风险最小、麻烦最少对我们的患者很重要 |\n|\
    \  ||  |\n| 收取付款对我们很重要 || • 获得报酬对我们很重要  \n— 用金钱？用其他形式？来自其他地方？  \n• 继续运营并提供服务对我们很重要\
    \ |\n|  ||  |\n| 实验室检查需要专用设备 || • 一些检查可以用常见设备进行 |\n| **WHO 模板** ||  |\n|  || \
    \ |\n| 需要医生进行诊断/开具治疗方案 || • 一些诊断和治疗处方可以由 SPC 以外的其他员工/医生完成 |\n|  ||  |\n| 需要专科技术人员进行某些检查/扫描（如\
    \ X 光） || • 某些检查/扫描可以由普通护理人员或 SPC 以外的员工进行 |\n|  ||  |\n| 患者必须在生病后才访问 SPC || •\
    \ 患者可以在除生病以外的其他场合访问 SPC |\n|  ||  |\n| 患者必须从一个检查站移动到另一个检查站 || • 患者可以在一个地点完成所有检查\
    \  \n• 患者在各站点的移动应最小化  \n• 检查可以带到患者身边  \n• 患者可以在不费力的情况下从一个检查站移动到另一个检查站 |\n|  ||\
    \  |\n| **WHERE 模板** ||  |\n|  ||  |\n| 患者只能在 SPC 接受诊断 || • 患者可以在家中/靠近家或方便她/他到达的地点接受诊断\
    \ |\n|  ||  |\n| 患者只能在 SPC 接受治疗 || • 患者可以在家中/靠近家或方便他到达的地点接受治疗 |\n|  ||  |\n| 患者必须亲自领取药物\
    \ || • 药物可以送到患者处/从方便的地点领取 |\n|  ||  |\n| 医生必须在 SPC 进行诊断/治疗 || • 医生可以在 SPC 内或外的其他地点对患者进行诊断和治疗\
    \  \n• 医生可以在患者访问 SPC 之外的其他时间对患者进行诊断或治疗 |\n|  ||  |\n| **WHEN 模板** ||  |\n|  ||\
    \  |\n| 患者必须在接受治疗前先被诊断 || • 患者可以同时接受诊断和治疗  \n• 患者可以在未诊断的情况下接受治疗 |\n|  ||  |\n\
    | 患者必须在做检查前先进行初步咨询 || • 患者可以在未进行初步咨询的情况下接受检查 |\n|  ||  |\n| 患者必须在离开 SPC 前支付咨询/治疗费用\
    \ || • 患者可以在离开 SPC 后付款  \n• 患者可以分期付款 |\n|  ||  |\n| 患者只能在支付治疗和咨询费用后预约下次就诊 || •\
    \ 患者可以在支付治疗/咨询费用的同时预约下次就诊  \n• 患者可以在家中（离开 SPC 后）预约下次就诊 |\n|  ||  |\n| **WHY 模板**\
    \ ||  |\n|  ||  |\n| 必须在预约日前一天调取患者记录以确保在 SPC 预约日可用 || • 患者记录应随时/全天候可用 |\n|  ||\
    \  |\n| 患者必须在诊所等待，以便在叫到名字时（用于咨询/治疗）可用，从而高效利用 SPC 资源 || • 患者可以在更愉快的环境中等待或在等待叫号时做其他事情，而不会对效率产生不利影响\
    \ |\n|  ||  |\n\n"
