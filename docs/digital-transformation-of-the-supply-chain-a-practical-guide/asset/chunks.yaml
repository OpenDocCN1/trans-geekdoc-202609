  trans: "\n\n## 规避因子\n\n规避因子与一项倡议或项目带来的负面影响有关，从而降低其吸引力。规避因子的标准包括项目的实施成本、项目的实施难度以及项目的实施风险。\n\
    \n一旦员工设定了评估每个项目的标准，他们会根据重要性为每个标准分配 0 到 1 的权重。协调员（负责评估流程的人员）随后会要求团队成员根据 -3 到 3\
    \ 的评分，对每个项目在客户和组织收益方面的每个属性进行评分（-3 表示贡献受损，0 表示无影响，3 表示显著贡献）。对于规避因子，评分基于 -3 到 0\
    \ 的分数，因为所有标准都涉及绩效的负面影响。Figure 19 显示了一个员工可用于进行评估的模板。\n\n![](img/fig19.jpg)\n\n\
    **Figure 19.** 用于评估数字化供应链转型的倡议/项目的模板\n\n团队成员明白这不是一个科学工具。它基于个人意见，其优势在于其简单性。即使标准很明确，定义的项目也不易进行比较，在这种情况下，对每个项目的更多审议并不一定会产生更好的结果。对于每个属性的评级，每位参与者都必须质疑每个项目相对于其他项目的[content]\n\
    \n## 规避因子\n\n规避因子与一项倡议或项目带来的负面影响有关，从而降低其吸引力。规避因子的标准包括项目的实施成本、项目的实施难度以及项目的实施风险。\n\
    \n一旦员工设定了评估每个项目的标准，他们会根据重要性为每个标准分配 0 到 1 的权重。协调员（负责评估流程的人员）随后会要求团队成员根据 -3 到 3\
    \ 的评分，对每个项目在客户和组织收益方面的每个属性进行评分（-3 表示贡献受损，0 表示无影响，3 表示显著贡献）。对于规避因子，评分基于 -3 到 0\
    \ 的分数，因为所有标准都涉及绩效的负面影响。Figure 19 显示了一个员工可用于进行评估的模板。\n\n![](img/fig19.jpg)\n\n\
    **Figure 19.** 用于评估数字化供应链转型的倡议/项目的模板\n\n团队成员明白这不是一个科学工具。它基于个人意见，其优势在于其简单性。即使标准很明确，定义的项目也不易进行比较，在这种情况下，对每个项目的更多审议并不一定会产生更好的结果。对于每个属性的评级，每位参与者都必须质疑每个项目相对于其他项目的冲击。\n\
    \n一旦员工根据每个标准对所有想法进行了分类，协调员将创建一个最终表格，记录每个项目的总分。使用最终分数，对分数取平均值并乘以每个标准的权重（如有），然后将各列的结果相加以计算每个项目的加权分数。\n\
    \n完成这些步骤后，他们现在对项目相对于被认为重要的每个标准有了一些定量评估。因此，他们已从个人和主观的感知转变为共同的数值结论。现在是时候研究表格中获得的值了。\n\
    \n## 明确数字化使能技术\n\n技术对于新流程至关重要，以便其能够满足数字化转型目标和目标。技术如何帮助转变流程的示例显示在 Table 5 中。\n\n\
    识别、评估和采用数字化使能器进一步有助于实现供应链转型愿景。通过将最新的数字技术应用于新流程，新供应链流程设计能够满足其绩效目标并产生预期的业务效益成为可能。在详细流程设计期间，需要确定支持新业务流程所需的技术类型。以下示例将说明如何利用潜在的数字杠杆来支持新流程中的每个活动。此说明涉及从海外进口家禽进入某国的进口商。进口商在禽类通过检验后可从政府机构获得进口许可。在这种情况下，申请家禽进口许可涉及的关键活动显示在\
    \ Figure 20 中。\n\n### Table 5. 数字化使能供应链流程的数字技术（McKinsey, 2016）\n\n| **Old Rule**\
    \ || **Digital Enabler** || **New Perspective** |\n| --- | --- | --- |\n| Information\
    \ can appear in only one place at a time || Cloud Application || Information can\
    \ appear simultaneously in as many places as needed |\n| Only experts can perform\
    \ complex work || Artificial Intelligence || A generalist may be able to do the\
    \ work of an expert system |\n| Businesses must choose between centralization\
    \ and decentralization || 5G Telecommunication networks || Businesses can simultaneously\
    \ reap the benefits of centralization and decentralization |\n| Managers make\
    \ all decisions || Big Data || Decision making is part of data analytics |\n|\
    \ Field personnel need offices — where to receive, store, retrieve and transmit\
    \ information || Wireless communication and Mobile applications || Field personnel\
    \ can send and receive information on the go, anytime, anywhere |\n| The last\
    \ contact with a potential buyer is personal contact || Interactive chatbot ||\
    \ The best contact with a potential buyer is effective dialogue |\n| People must\
    \ find where things are || Internet of things || IoT tell you where they are |\n\
    | Plans get revised periodically || High performance computing || Plans can get\
    \ revised instantaneously |\n\n![](img/fig20.jpg)\n\n**Figure 20.** 家禽进口流程\n\n\
    ### Table 6. 识别增值活动的数字化使能器\n\n| **Key Activities** || **Value-add Activity?**\
    \ || **Potential Digital/Technology Application (If Any)** |\n| --- | --- | ---\
    \ |\n| Apply for poultry permit || Value add || Online or mobile channels |\n\
    | Evaluate application || Value add || Verify with database of countries banned\
    \ from import of poultry using blockchan |\n| Approve or reject application. ||\
    \ Value add || Online or mobile channels |\n| Import poultry || Not applicable\
    \ || Not applicable |\n| Inspect poultry for disease and other potential infection\
    \ || Non-value add || Internet of Things (IoT) |\n| Draw blood sample for the\
    \ lab || Non-value add || Not applicable |\n| Test blood sample for infection\
    \ || Value add || Extract test procedures from laboratory information management\
    \ system using TOT  \nLink testing equipment with laboratory information management\
    \ system to update test results |\n| Make decision (approve or reject permit)\
    \ || Value add || Decision support tool to assist manager to approve permit based\
    \ on blood sample result and inspection result |\n| Inform applicant of the outcome\
    \ || Value add || Online or mobile channels |\n| Collect payment || Non-value\
    \ add || Using e-banking or VISA |\n\n这些活动可以被分类为增值或非增值，并且可以为每个活动识别潜在的数字化，如 Table\
    \ 6 所示。\n\n通过此练习，为该流程确定了四个潜在的技术和数字化使能层级。它们如下：\n\n• 一个企业云系统，用于存储和检索有关测试程序和测试结果的信息\n\
    \n• 一个基于先进预测分析的决策支持工具，帮助经理批准许可\n\n• 与企业系统在线或移动连接以请求测试\n\n• 与企业系统链接的在线支付系统\n\n\
    虽然为新流程识别数字技术使能器至关重要，但需要谨慎考虑实施此类技术以支持新流程的收益或价值。考虑到数字化成本可能非常昂贵，迫切需要将技术不仅视为为客户提供的收益，还要考虑其对流程绩效的贡献程度。通过应用简单的评估测试，可以避免仓促投入可能对组织无用的信息技术应用的谬误。\n\
    \n"
