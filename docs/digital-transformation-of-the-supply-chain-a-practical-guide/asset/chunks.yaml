- raw: "A simple assessment test for illustration is the example of an automatic teller\
    \ machine (ATM) technology in serving its customers. An initial problem faced\
    \ is how to be able to serve customers at any time, and ATMs make it possible\
    \ to serve customers outside office hours. Some of the questions that need to\
    \ be addressed to justify this technology include: how much manpower is needed\
    \ for processing cash replenishment? How much is the financial profit derived\
    \ from utilizing ATMs? What are the targets, set in numerical terms, for the growth\
    \ of funds and the increase of the customer base that are expected to be derived\
    \ from employing ATM services? How large is the actual number of potential customers\
    \ wishing to conduct transactions outside office hours? How about the stock management\
    \ of customer ATM cards?\n\nBy raising these critical questions, the impact of\
    \ applying ATM technology becomes clearer, e.g. whether the ease provided to customers\
    \ for fund withdrawal conflicts with any potential problems concerning bank liquidity\
    \ and third-party funds. When all these questions have been answered, the results\
    \ will make clear whether there is a real need for the application of ATMs at\
    \ the present moment to support the new process, or other alternatives should\
    \ be considered.\n\n## **Chapter 8**\n\n## **SUPPLY CHAIN TRANSFORMATIONS IN THE\
    \ HEALTHCARE INDUSTRY**\n\nIn this chapter, we will discuss two unique case studies,\
    \ both pertaining to the healthcare industry. The first case study that follows\
    \ focuses on the highly strategic importance of business process analysis and\
    \ redesign as precursors to any digital initiative towards a larger supply chain\
    \ transformation.\n\n**Case Study 1: Transforming the Reverse Logistics Operations\
    \ for a Medical Equipment Company**\n\nThis project involves a factory based in\
    \ Bangkok with products distributed through their central distribution center\
    \ located in Bangkok. Customer orders are fulfilled based on the geographical\
    \ location of customers. For customers in Bangkok, the company will use its own\
    \ truck to deliver the order to the retailer. For customers in other provinces,\
    \ the selected means of transportation will depend on the volume of the order.\
    \ If the volume is large enough for a full truckload (FTL), the company will use\
    \ its own truck to deliver the order. However, if the order is less than truckload\
    \ (LTL), a third-party transportation service provider will be used to deliver\
    \ the order. The lead time for delivery is dependent upon truck routing, scheduling,\
    \ availability, as well as final destinations.\n\nCustomers can use the company’s\
    \ reverse logistics channel to repair their products. However, customers will\
    \ be required to send the products to the main service center based in Bangkok\
    \ for repair. The regional service center and retailer are only capable of being\
    \ used as a consolidation point to send the products back to the Bangkok center.\
    \ Another difficulty is the low frequency and lack of trucks that are returning\
    \ to the Bangkok service center. These issues result in a long lead time before\
    \ any repairs can be done to the faulty products. The process map (see [Figure\
    \ 21](#chapter8.xhtml#fig21)) depicts the swim-lane diagram for original reverse\
    \ logistics process.\n\nUnder the original reverse logistics channel structure,\
    \ the company had received many complaints on repair service lead time caused\
    \ by long periods of waiting time. Another problem was the costs of transport\
    \ (to and from the manufacturer), which are considered a burden for both the company\
    \ and its customers. It is normal practice for the company to pay a third-party\
    \ transportation service provider for returning a product from its retailer to\
    \ its service center. Customers also had to bear freight charges from the Bangkok\
    \ service center to their home as the manufacturer does not pay for these charges.\
    \ The only solution for the customer was to collect the goods himself at the Bangkok\
    \ service center. The lead time comparison for returns in Bangkok, other provinces\
    \ with full load, and less than full load trucking can be seen in [Table 7](#chapter8.xhtml#tab7).\n\
    \n![](images/fig21.jpg)\n\n**Figure 21.** Original process flow\n\n**Table 7.**\
    \ Lead time comparison for returns in Bangkok and outside Bangkok\n\n![](images/tab7.jpg)\n\
    \nIn this company, the only difference in cost that can be quantified is the transportation\
    \ costs for the company’s major products: laboratory equipment and electrocardiogram\
    \ (ECG) equipment. The transportation costs for these two products back to the\
    \ central service center in Bangkok, by the company’s own truck, are US$0.20 and\
    \ US$0.79 per box, respectively, and US$0.75 and US$1.75 per box, respectively,\
    \ if a third-party service provider is involved. In addition, the costs of freight\
    \ to return the repaired products to customers are US$2.50 and US$3.75 per box,\
    \ respectively. Returns are usually sent through the National Postal Service.\
    \ [Table 8](#chapter8.xhtml#tab8) provides a comparison in terms of annual cost\
    \ involved with regards to the transportation of returned items.\n\nThe company\
    \ has set up a centralized service center to support returned products in order\
    \ to keep their costs down. However, the most frequently cited problem with a\
    \ centralized service center is the relatively poor level of customer service.\
    \ In order to cope with return uncertainty and provide good customer service,\
    \ some companies have tried to increase their ability, flexibility, and agility\
    \ to respond to customer needs against a backdrop of increasing customer service\
    \ cost. One way is to set up service centers near customers, in contrast to near\
    \ the main factory or main distribution center, that could be able to help minimize\
    \ customers inconvenience in terms of time and cost involved with regards to access\
    \ to aftersales or repair services. However, this will increase their reverse\
    \ logistics costs. A three–phase methodology was followed to define the supply\
    \ chain process transformation needed.\n\n**Table 8.** Annual transportation cost\
    \ based on existing reverse logistics process\n\n| **Item** || **Laboratory Equipment**\
    \ || **ECG Equipment** ||  |\n\n| --- | --- | --- | --- |\n\n| Number of products\
    \ sold annually || 300,000 || 10,000 ||  |\n\n| Average number of products returned\
    \ and repaired at service shop || N/A || N/A ||  |\n\n| Average number of products\
    \ returned to service center || 10,000 || 300 ||  |\n\n| — via customer || 1,000\
    \ || 30 ||  |\n\n| — via company’s own truck || 7,000 || 210 ||  |\n\n| — via\
    \ transportation service provider || 2,000 || 60 ||  |\n\n| — Costs of using company’s\
    \ own truck || US$0.20 per box || US$0.79 per box ||  |\n\n| Costs charged by\
    \ transportation service provider || US$0.75 per box || US$1.75 per box ||  |\n\
    \n| Total costs for product returned to service center || US$2,900 || US$271 ||\
    \  |\n\n| **Subtotal** || **US$3,171** || **US$3,171** ||  |\n\n| Average number\
    \ of repaired products returned to customers || 10,000 || 300 ||  |\n\n| — via\
    \ customer pick-up at service shop || N/A || N/A ||  |\n\n| — via customer pick-up\
    \ at service center || 1,000 || 30 ||  |\n\n| — via shipment by National Postal\
    \ Service || 9,000 || 270 ||  |\n\n| Costs charged by National Postal Service\
    \ (freight collected) || US$2.50 per box || US$3.75 per box ||  |\n\n| Number\
    \ of repaired products shipped from service center to service shop || N/A || N/A\
    \ ||  |\n\n| Costs of using company’s own truck || US$0.20 per box || US$0.79\
    \ per box ||  |\n\n| Total costs for product returned to customers || US$22,500\
    \ || US$1,013 ||  |\n\n| **Subtotal** || **US$23,513** ||  ||  |\n\n| **Total\
    \ annual cost of transportation in the reverse logistics process** || **US$26,684**\
    \ ||  ||  |\n\n***Phase 1: Project Initiation***\n\n| Vision || A highly responsive\
    \ reverse logistics center for after-sales |\n\n| --- | --- |\n\n| Goal || Short\
    \ response time without increasing reverse logistics costs |\n\n| Target || •\
    \ Reduce respond time by 70%  \n\n• Reduce operations costs by 50% |"
  fmt: "\nA simple assessment test for illustration is the example of an automatic\
    \ teller machine (ATM) technology in serving its customers. An initial problem\
    \ faced is how to be able to serve customers at any time, and ATMs make it possible\
    \ to serve customers outside office hours. Some of the questions that need to\
    \ be addressed to justify this technology include: how much manpower is needed\
    \ for processing cash replenishment? How much is the financial profit derived\
    \ from utilizing ATMs? What are the targets, set in numerical terms, for the growth\
    \ of funds and the increase of the customer base that are expected to be derived\
    \ from employing ATM services? How large is the actual number of potential customers\
    \ wishing to conduct transactions outside office hours? How about the stock management\
    \ of customer ATM cards?\n\nBy raising these critical questions, the impact of\
    \ applying ATM technology becomes clearer, e.g. whether the ease provided to customers\
    \ for fund withdrawal conflicts with any potential problems concerning bank liquidity\
    \ and third-party funds. When all these questions have been answered, the results\
