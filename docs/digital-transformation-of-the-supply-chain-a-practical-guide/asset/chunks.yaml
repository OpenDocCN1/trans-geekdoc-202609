    Organizational challenges refer to working in silos as opposed to working in a
    team; culture challenges refer to a mindset change from a regulatory perspective
    to a customer-centric view. This shift will require a high level of process harmonization
    and systems interoperability between different internal functions and external
    organizations to enable better online, real-time communication and information
    exchange. While this research has identified one example of process inefficiencies
    for one of the business processes, we can argue that there will be many other
    inefficient processes existing as well. Therefore, to realize more customerfocused
    service delivery in the country, public sector agencies will require a substantial
    level of integration of backend information systems such as tax systems, retirement
    systems, company registers, and land and property systems. According to one of
    the directors from `MTI` who manages the `OASIS` portal, it is important to maintain
    the balance between the need to regulate the activities and the interests of businesses.
    The team adopted a system-thinking approach, conducting regular focus group sessions
    with businesses to obtain feedback on their start-up experiences. Such feedback
    sessions drove the team to constantly seek ways to improve the design and features
    of the `OASIS` portal.


    In order to overcome these challenges when integrating processes from multiple
    agencies, it requires policy reviews, business process re-engineering, and system
    changes. These changes will not happen without top management being seen championing
    them, thus sending a positive signal to agency staff to dedicate themselves to
    the success of `OASIS`. The team had to manage concerns faced by individual agencies
    to secure buy-in and commitment from agencies. The team learned to recognize,
    acknowledge, and manage specific concerns of agencies through regular consultations
    and meeting sessions held with agencies. It is therefore important to secure commitment
    from senior management of agencies from the outset to ensure smoother implementation.
    Top management support will assist to allocate appropriate resources and to resolve
    conflicting priorities. Therefore, it is understandable that for the public sector,
    these changes will be even more severe in an environment that can be described
    as bureaucratic, functionally oriented, and a legacy system.


    Lack of synergy among different government agencies and private agencies’ business
    processes proves that much more needs to be done in terms of fundamentally rethinking
    and radically re-engineering these processes if joint services are to be delivered
    through a single point of access. The `OASIS` team learned the importance of having
    in place a mechanism to refer unresolved matters to higher authorities. In cases
    where problems or issues cannot be resolved at the working level, the team escalates
    the issue to committees that are chaired by senior civil service leaders. Agencies
    would generally try to resolve issues without the intervention of these high-level
    committees.


    As the implementation of these licenses in `OASIS` involves in excess of 20 agencies,
    close cooperation and coordination is vital. Agencies would have to closely adhere
    to the schedules drawn up in order for the licenses to be implemented in a timely
    fashion. From an organizational perspective, the paradigm shift that needs to
    be realized to change these processes would mean that the government will need
    to breakdown their departmental or silo culture and overcome resistance to change,
    as seen in other forms of organizational change such as business process re-engineering.


    Lastly, the website for this project is now online at `https://www.bizfile.gov.sg/`
    and it is managed by the Accounting and Corporate Regulatory Authority (`ACRA`),
    which is the regulator of business registration, financial reporting, public accountants,
    and corporate service providers.


