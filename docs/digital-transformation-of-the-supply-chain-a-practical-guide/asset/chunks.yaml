- raw: "Is this the best way or are there alternatives? |\n\n| How? Much? || Cost\
    \ || How much does it currently cost?  \n\nWhat would be the projected cost after\
    \ improvement? |\n\nA good starting point for supply chain improvements is the\
    \ 5W2H framework, as shown in [Table 1](#chapter6.xhtml#tab1). 5W2H is a good\
    \ tool that provides guiding questions when assessing a process. The five Ws —\
    \ who, what, when, where, and why, and the two Hs — how and how much, force us\
    \ to consider various facets of the situation being analyzed. It can also be used\
    \ to understand an existing process before it is redesigned.\n\nTransformation\
    \ is concerned with changing old ways of doing and thinking, and to achieve this,\
    \ assumptions will need to be surfaced and challenged. At first sight, it seems\
    \ easy to say that one will use the customer’s needs as a benchmark when deciding\
    \ what changes to make. But who is the customer (using the 5W2H framework), and\
    \ are the assumptions made about what the customer wants or needs reasonable?\
    \ The perceived customer is not necessarily coincident with the real customer.\
    \ It is likely that there will be many stakeholders involved and the most important\
    \ stakeholder is not necessarily the ultimate customer. Furthermore, assumptions\
    \ tend to persist long after they are no longer true and are “invisible” unless\
    \ a deliberate attempt is made to identify and examine them. Outdated assumptions\
    \ are a major obstacle to making radical changes in the way we do things.\n\n\
    After identifying potential customers through stakeholder analysis, it is then\
    \ important to question the assumptions that have been made by supply chain partners.\
    \ In some cases, it is not necessary to ask the customer what they want. Team\
    \ members will instead need to make some assumptions about what they think is\
    \ important to their customers. After surfacing all possible assumptions, the\
    \ next step is to validate the assumptions in today’s context and to generate\
    \ new ideas through brainstorming to improve the process performance if those\
    \ assumptions are still valid today.\n\nBrainstorming is one method to keep ideas\
    \ flowing fast and freely. It is a lateral thinking process and is designed to\
    \ help individuals break out of their thinking patterns into new ways of looking\
    \ at things. It works by focusing on the issues faced in the digital supply chain\
    \ transformation or the outdated assumptions identified, and then coming up with\
    \ many radical solutions. Ideas should deliberately be as broad and odd as possible.\n\
    \nGroup brainstorming can be very effective as it uses the experience and creativity\
    \ of all members of the group. When individual members reach their limit on an\
    \ idea, another member’s creativity and experience can take the idea to the next\
    \ stage. Therefore, group brainstorming tends to develop ideas in more depth than\
    \ individual brainstorming.\n\nDuring brainstorming sessions, there should be\
    \ no criticism of ideas. You are trying to open up possibilities and break down\
    \ wrong assumptions about the limits of the process. Judgments and analysis at\
    \ this stage will stunt idea generation. Ideas should only be evaluated once the\
    \ brainstorming session has finished, but do not spend time embellishing ideas\
    \ or trying to build complete solutions. Valuable but unusual suggestions may\
    \ appear stupid at first sight. As such, care must be taken to ensure some team\
    \ members do not crush these new ideas and leave others feeling embarrassed.\n\
    \nBelow are 11 redesign principles commonly used for transforming supply chain\
    \ processes.\n\n**Principle 1. Organize Work Around Outcomes not Tasks**\n\nWe\
    \ need to focus on horizontal integration of activities. We should eliminate unnecessary\
    \ handoff and control steps and reduce the need for extensive interfacing with\
    \ other supply chains. Process transformation teams need to keep in mind that\
    \ process complexity is reduced while activity complexity grows. An example for\
    \ such redesign is the integrated import and export process in Singapore with\
    \ the help of information technology (IT) to interface with all parties in the\
    \ supply chain, as shown in [Figure 8](#chapter6.xhtml#fig8).\n\n**Principle 2.\
    \ Let Those Who Use the Process Perform the Process**\n\nThe fundamental questions\
    \ to ask here are, can the company take on more work presently undertaken by customers\
    \ or suppliers? Would customers or suppliers mind taking up some work presently\
    \ undertaken by the company? An example of such redesign includes supplier-managed\
    \ inventory, as shown in [Figure 9](#chapter6.xhtml#fig9). In this case, the manufacturer\
    \ will plan and replenish the stocks on behalf of the retailer to ensure that\
    \ the goods are always available on the shelf. Sales forecast will improve as\
    \ the manufacturer will be using the retailer’s point of sales data instead of\
    \ the anticipated sales from the retailer.\n\n**Principle 3. Capture Information\
    \ Once — At the Source**\n\nAs mentioned earlier, the importance of accuracy in\
    \ information or data is especially high when we are executing process redesign\
    \ for the purpose of digital transformation of the supply chain. Identifying the\
    \ original source of information and capturing it from there reduces costly re-entry\
    \ and frequent cleansing or processing of erroneous data. Doing it this way will\
    \ speed up the overall process, increase the quality of information, and reduce\
    \ costs. An example of such redesign includes the re-export process, as shown\
    \ in [Figure 10](#chapter6.xhtml#fig10). In this case, the information obtained\
    \ from import documentation is reused to prepare export documentation since 70%\
    \ to 80% of the information is similar.\n\n![](images/fig8.jpg)\n\n**Figure 8.**\
    \ Integrated import and export process in Singapore\n\n![](images/fig9.jpg)\n\n\
    **Figure 9.** Vendor managed inventory for retailer\n\n![](images/fig10.jpg)\n\
    \n**Figure 10.** Re-export process\n\n**Principle 4. Put the Decision Point Where\
    \ the Work is Performed and Build Control in the Process**\n\nEssentially, with\
    \ improved visibility of processes and operations to different levels of process\
    \ owners and business management, the topic of empowered decision-making has gained\
    \ significant importance in the last few years. Companies can look at this perspective\
    \ as an important principle of process transformation by determining the extent\
    \ to which operational workers take over part of management responsibilities.\
    \ This helps to answer if and how processes can be integrated horizontally and\
    \ employee empowerment integrated vertically. From an efficiency or productivity\
    \ standpoint, we could rationalize whether there is a need for an individual to\
    \ coordinate the tasks undertaken by several specialists.\n\n![](images/fig11.jpg)\n\
    \n**Figure 11.** Fourth-party logistics organization\n\nAn example of such redesign\
    \ includes a fourth-party logistics provider (4PL) who manages the performance\
    \ of third-party service providers to achieve continuous improvement, as shown\
    \ in [Figure 11](#chapter6.xhtml#fig11). In this case, 4PL is the single interface\
    \ to clients and logistics service providers to ensure that the services offered\
    \ are matched with clients’ expectations. From a process perspective, this is\
    \ a leading practice that becomes the foundation for digital supply chain collaboration.\n\
    \n**Principle 5. Treat Geographically Dispersed Resources as Though They Were\
    \ Centralized**"
