    这是最好的方法还是有其他替代方案？ |


    | 如何做？多少？ || 成本 || 目前成本是多少？


    改进后的预计成本是多少？ |


    供应链改进的一个良好起点是 `5W2H` 框架，如表 1 所示。`5W2H` 是一项很好的工具，在评估流程时提供引导性问题。五个 W（谁 who、什么 what、何时
    when、何处 where、为什么 why）两个 H（如何 how、多少 how much）迫使我们考虑分析情况的各个方面。它也可以被用于在重新设计之前理解现有流程。


    变革涉及改变旧的工作和思维方式，为了实现这一点，需要揭示并挑战各种假设。乍上看，在决定做出哪些变化时，以客户需求为基准似乎是很容易的。但谁是客户呢（使用 `5W2H`
    框架）？对客户想要或需要的假设是否合理？感知的客户并不一定等同于真实的客户。可能会有许多利益相关者参与，而最重要的利益相关者并不一定是最终客户。此外，假设在不再真实后，往往会长期存在，除非刻意尝试识别并检查它们，否则它们是“隐形的”。过时的假设是我们工作方式发生彻底变革的主要障碍。


    在通过利益相关者分析识别潜在客户后，质疑供应链伙伴所做的假设变得非常重要。在某些情况下，没有必要询问客户想要什么。相反，团队成员需要对他们认为客户重要的事情做出一些假设。在揭示所有可能的假设后，下一步是在当今背景下验证这些假设，并通过头脑风暴产生新想法，如果这些假设在今天仍然有效，改进改进性能。


    头脑风暴是保持想法快速、自由流动的方法之一。这是一种发散思维过程，旨在帮助个人突破思维模式，以新的方式看待问题。它通过关注数字供应链转型中面临的问题或识别出的过时假设，然后提出许多激进的解决方案。想法应该刻意尽可能宽而奇。


    小组头脑风暴非常有效，因为它利用了小组所有成员的经验和创造力。当个人成员在某个想法上达到极限时，另一个成员的创造力和经验可以将该想法推向下一个阶段。因此，小组头脑风暴比个人头脑风暴能产生更深层次的想法。


    在头脑风暴会议期间，不应对想法进行批评。你正在试图开启可能性，并打破关于流程限制的错误假设。此阶段的判断和分析会阻碍想法的产生。想法应在头脑风暴结束后再进行评估，但不要花时间修饰想法或尝试构建完整的解决方案。价值但不寻常的建议看起来可能很愚蠢。因此，必须确保某些团队成员不会扼杀这些新想法并让其他人感到尴尬。


    ### 以下是用于转型供应链流程的常用的 11 项重新设计原则。


    ### 原则 1. 围绕结果而非任务组织工作


    我们需要关注活动的水平整合。我们应该消除不必要的交接和控制步骤，并减少与其他供应链进行大量接口的需求。流程转型团队需要记住，流程复杂性在降低的同时，活动复杂性在增加。这种重新设计的一个例子是新加坡的集成进出口流程，借助信息技术
    (`IT`）与供应链中的所有方建立接口，如图 8 所示。


    ### 原则 2. 让使用流程的人执行流程


    这里要问的基本问题是：公司目前可以承担更多由客户或供应商承担的工作吗？客户或供应商是否介意承担目前由公司承担的工作？这种重新设计的一个例子包括供应商管理库存，如图
    9 所示。在这种情况下，制造商将代表零售商计划并补充库存，以确保货架始终有货。由于制造商将使用零售商的销售数据而不是零售商的预期销售额，销售预测将得到改进。


    ### 原则 3. 信息仅采集一次——在源头


    如前所述，当我们为了供应链数字化转型而执行流程重新设计时，信息或数据的准确性显得尤为重要。识别信息的原始源头并从那里捕获，可以减少昂贵的重复输入以及对错误数据的频繁清洗或处理。这样做将加快整个流程，提高信息质量并降低成本。这种重新设计的一个例子包括转口流程，如图
    10 所示。在这种情况下，从进口单据中获得的信息被复用于准备出口单据，因为 70%到 80%的信息是相似的。


    ![](img/fig8.jpg)


    **图 8.** 新加坡的集成进出口流程


    ![](img/fig9.jpg)


    **图 9.** 针对零售商的供应商管理库存


    ![](img/fig10.jpg)


    **图 10.** 转口流程


    ### 原则 4. 将决策点置于工作执行地并在流程中建立控制


    本质上，随着流程和操作对不同级别的流程所有者和业务管理层可见性的提高，赋权决策的话题在过去几年中变得至关重要。公司可以通过确定运营人员接管部分管理职责的程度，将这一视角视为流程转型的一项重要原则。这有助于回答是否以及如何实现流程的水平整合，以及员工赋权如何实现垂直整合。从效率或生产力的角度来看，我们可以合理化是否需要个人来协调几位专家所承担的任务。


    ![](img/fig11.jpg)


    **图 11.** 第四物流组织


    这种重新设计的一个例子包括第四方物流提供商 (`4PL`)，它管理第三方服务提供者的绩效以实现持续改进，如图 11 所示。在这种情况下，`4PL` 是客户与物流服务提供商之间的单一接口，以确保提供的服务与客户预期匹配。从流程的角度来看，这是一种领先实践，是数字供应链协作的基础。


    ### 原则 5. 将地理分散的资源视为同集化的


