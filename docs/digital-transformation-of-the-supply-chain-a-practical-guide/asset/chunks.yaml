- raw: '• Companies must identify a high-caliber, multidisciplinary core team which
    will bring a right mix of domain and technology expertise to deliver the digital
    supply chain assessment outcomes


    • The core digital transformation team should collectively have many man-years
    of experience in supply chain process and business applications thought leadership


    • Ideally, the core team’s experience should pan across process and discrete industries
    or across manufacturing and retail scenarios. Essentially, we are talking about
    diverse experience types.


    • The core team’s focus should be on maximizing the positive impact of supply
    chain improvements to revenue growth and profitability improvements


    • Considering that the digital supply chain transformation must bring about innovation
    and improve agility for the organization, it will be very useful to have one or
    two people with design thinking knowledge and an Agile certification as part of
    the core team


    Second, the program sponsor needs to set up the steering committee, which includes
    himself and peers. As mentioned above, this would comprise the functional or department
    leaders and chief experience officers, as applicable to the strategic nature of
    the supply chain transformation program. The program sponsor needs to also have
    a formal meeting with these identified steering committee members and introduce
    the program director as the single point of contact to them.


    Thirdly, an operating committee needs to be set up as an optional team driving
    towards program success. This is an optional part of the digital supply chain
    transformation program structure and is required to be instilled purely depending
    on the scope and timelines of the program. The operating committee should ideally
    include business process leads for the supply chain process areas in scope, the
    program director and digital technology leads from the information technology
    department, and the program manager or equivalent lead from the consulting or
    technology partner organization. As a general guide, two criteria for the need
    for an operating committee in the program structure are the overall program duration
    and number of supply chain process areas in scope. If the defined digital supply
    chain transformation scope is for end-to-end supply chain planning (demand planning,
    sales and operation planning, inventory planning and optimization, supply and
    procurement planning, production scheduling, distribution planning, transportation
    planning and optimization) and the program duration is at least six months, we
    definitely need an operating committee in place as a fortnightly progress review
    team, which is empowered to make tactical decisions for sustained progress. The
    steering committee then reviews once every four to six weeks and provides strategic
    direction and decisions and conflict resolutions.


    Next, we set up the overall project teams at the operational level. Traditionally,
    project teams operate at the periphery of the organization, pulling human, technical,
    and monetary resources away from the functional areas, suppliers, or customers
    for their own needs. In some cases, it has been seen that a digital transformation
    project being driven by the information technology or supply chain department
    will have team members assigned from other departments by managers choosing subordinates
    who are currently available. Those people are put on the digital transformation
    program regardless whether they possess the technical qualifications, people skills,
    or administrative abilities to perform effectively. In some examples, members
    have been assigned to supply chain transformation projects as a method for getting
    them out of their current departments, for some background reasons, and making
    them someone else’s problem. We strongly recommend not to follow this thought
    process.


    The choice of team members for the digital supply chain transformation program
    should be largely governed by the area of the core business process to be transformed.
    Since activities at any point in a process impact the activities throughout the
    process, project team members must be selected from all key points and interfaces
    throughout the process. This ensures that both knowledge of the total process
    and multiple perspectives are developed at different points along the way. As
    an example, when we talk about the order fulfillment process that is cross-functional
    in nature, the company’s customers can also be involved as part of the team to
    provide vital perspectives in enhancing the new process design.


    Now let us discuss in more details about the responsibilities and deliverables
    of the program director or equivalent, chosen by the program sponsor to lead the
    digital supply chain transformation program. At a minimum, he or she will have
    the following responsibilities:


    • Reach a common understanding with the steering committee on the objectives and
    goals of the digital supply chain transformation program


    • Schedule and lead a series of thoroughly prepared and well-structured program
    kick-off sessions


    • Schedule and run core team meetings and steering committee and operating committee
    reviews


    • Arrange for all types of resources, program budgeting, and funding


    • Decide how much time the team will devote to the program


    • Communicate with the steering committee and operating committee on the progress
    of the projects and any obstacles faced


    • Launch data collection activities as part of program kick-off itself. (e.g.
    process models, information technology architecture diagrams, operational data)


    • Schedule business interviews, working sessions, and review meetings with internal
    as well as external stakeholder groups


    • Create and deliver the completed program plan with governance structure, milestones,
    dependencies, and resource loading


    • Create and deliver data request templates to respective business and technology
    teams for data extraction from incumbent systems of record


    A kick-off workshop should be carried out with the steering committee of the program
    or with the staff planning function to agree on the implementation schedule. During
    this workshop, each digital application and process needs to be assessed based
    on a variety of criterion. These criterion can be proposed by facilitators, but
    should be verified by business managers. It is important to identify and agree
    on the criteria before supply chain process assessment begins. Once a consensus
    on the priority of applications has been reached, facilitators, taking into consideration
    the business and policy developments, will need to drive the program plan.


    Finally, setting up a structure and methods of interactions among all these groups
    within the program organization is of paramount importance and recommended as
    an integral step to setting up the program for success, even though this is not
    a group by itself. The core team should also establish a series of cadence meetings
    with the overall program team, the operating committee, the steering committee,
    and with the overall business community for the supply chain function.


    ## **Chapter 5**


    ## **SUPPLY CHAIN PROCESS ASSESSMENT FOR DIGITAL TRANSFORMATION**


    The first step in process assessment for digital supply chain transformation is
    process mapping. Let us begin by defining “process” once again, in our context.
    A process is defined as a system of interdependent steps to deliver a desired
    output or service. Components of a process consist of:


    • Process objective: specifies what is to be achieved by the process for the customer
    or organization


    • Process owner: a person who has responsibility and authority for the running
    and management of the process


    • Starting/ending activity within a process: key tasks or steps within a process
    that will consume time and utilizes some resources


    • Inputs: information, goods, and services that are supplied for the process


    • Outputs: goods and services produced by a process for the internal or external
    customers'
