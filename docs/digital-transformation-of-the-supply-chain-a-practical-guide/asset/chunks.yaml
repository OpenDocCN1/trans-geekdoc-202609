- raw: 'Talent management includes recruitment, selection, and training of the necessary
    personnel for the program implementation team. In many situations, personnel chosen
    for the digital supply chain transformation project team have inadequate skills
    necessary to actively contribute to implementation success. One research study
    has defined “people” as a situational variable whose knowledge, skills, goals,
    and personalities must be considered in assessing the environment of the organization
    for successful project implementation. Hence, personnel, as a factor, is concerned
    with developing an implementation team with the requisite skills and commitment
    to perform their function.


    **Technical Feasibility for Digitalization**


    Technical feasibility is the availability of technology and expertise to accomplish
    the specific technical action steps to bring each digitalization project “live”.
    The team refers to the need of ensuring that the necessary personnel of the implementation
    team possess the required digital technology skills and have adequate technology
    infrastructure to perform their tasks. The decision to initiate a new digital
    supply chain transformation project must be affirmed on the organization’s ability
    to both staff the team with competent individuals and provide the technical means
    for the project to succeed.


    **Supply Chain Partner Buy-in**


    Supply chain partner buy-in is the selling of the final process to its ultimate
    intended users. It refers to the final stage in the implementation process, at
    which time the overall usefulness and worth of the digital supply chain transformation
    project is to be determined. Some researchers even proposed the use of intermediaries
    to act as a liaison between the designer, or implementation team, and the project’s
    potential users to aid in client acceptance. The sequence of operations concerned
    with the client follows this pattern:


    • Consult to determine specific needs


    • Sell the ideas (including the benefits of the project), budgets, and time frame
    for completion


    • Perform a final verification of client acceptance once the project has been
    completed


    The verification may be in the form of a series of formal interviews or follow-up
    conversations with clients who are intending to use the process.


    **Monitoring and Feedback**


    Monitoring and feedback refers to the timely provision of comprehensive control
    information at each stage in the implementation process. It is the control process
    at each stage of the digital supply chain transformation project implementation
    where key personnel receive feedback on how the project is comparing to initial
    projections. Making allowances for adequate monitoring and feedback mechanisms
    gives the program manager the ability to anticipate problems, oversee corrective
    measures, and ensure that no deficiencies are overlooked. Program managers need
    to emphasize the importance of constant monitoring and fine-tuning implementation.
    Hence, monitoring and feedback refers not only to the project schedule and budget,
    but also monitoring performance of members of the project schedule and budget,
    as well as the project team.


    **Communication**


    Communication refers to the provision of an appropriate network and necessary
    information dissemination to all key actors in the project implementation process.
    The need for adequate communication channels is extremely important in creating
    an atmosphere for successful digital supply chain transformation implementation.
    Communication is not only essential within the project team itself, but also between
    the team and both the rest of the organization and the external supply chain.
    Hence, the feedback mechanism is a necessity for exchanging information with external
    supply chain partners and the rest of the organization concerning the project’s
    capabilities, the goals of the implementation process, the changes in policies
    and procedures, the status reports, and so on.


    **Troubleshooting**


    Troubleshooting is the ability to handle unexpected crises and deviations from
    the plan. Problem areas exist in every digital supply chain transformation. The
    measure of a successful project implementation effort is not the avoidance of
    problems but knowing the correct steps to take once problems develop. The program
    manager should make adequate initial arrangements for troubleshooting mechanisms
    to be included in the implementation plan. Such mechanisms would make it easier
    not only to react to problems as they arise, but also to foresee and possibly
    forestall potential problem areas in the implementation process.


    ## **Chapter 12**


    ## **SUCCESS STORY IN DIGITAL SUPPLY CHAIN TRANSFORMATION**


    In [Chapter 8](#chapter8.xhtml), we discussed a case study with an excellent example
    of processes assessment that established the foundation for transformation. In
    the same chapter, we also read about the specialist clinic which went on a very
    exhaustive path of comprehensive process redesign that led into the technology
    transformation stage. In [Chapter 10](#chapter10.xhtml), we saw an end-to end
    transformation case study which started with process analysis and redesign through
    to a digital platform implementation. Finally, we provide here a complete case
    study which leverages on futuristic digital levers while starting with a solid
    foundation of business process transformation of the supply chain.


    **Case Study: Transforming the Less than Container Load (LCL) Business using Blockchain
    and Internet of Things**


    Founded in 1987, Belgium, ECU Worldwide (ECU) is a global leader in non-vessel
    operating common carrier services. Backed by a rich legacy, passion, and agility,
    the company has brought in world-class innovations in LCL and set several benchmarks
    in the industry over the last two decades.


    Allcargo Logistics Ltd., India’s largest integrated logistics solutions provider
    in the private sector, acquired the company in 2006, which resulted in further
    efficiency improvements in operations. In May 2016, the company was rebranded
    as ECU Worldwide and consolidated their global presence by bringing all the offices
    under a single name to denote well-knit offices and highly-coordinated operations.
    The quest to bring geographies closer to their customers has remained unchanged,
    thus etching the philosophy of ‘Geography Simplified’.


    As more countries are industrializing and manufacturing sectors are expanding
    their businesses, they would normally outsource their logistics requirements to
    be handled by third-party logistics providers. Therefore, the expected demand
    in the logistics sector would be expected to grow as countries were able to maintain
    an average growth of seven to eight percent annually.


    Led by a strong management team, and offices in 160 countries, the company is
    now offering LCL and FCL (full container load) services across the globe. Its
    wide variety of value-added services and logistics solutions make them excel in
    handling and transporting complex cargo to anywhere in the world in a seamless
    way.


    ***Mission of ECU Worldwide***


    To simplify geographies with the expertise of their human resources through seamless
    integration of their offices and world-class technology.


    ***Vision of ECU Worldwide***


    The vision for the company is “To be the global leader in our business, through
    customer delight by innovations, agility and sustainable business model.” Uday
    Shetty, the Regional Chief Executive Officer (CEO) for APAC, described that ECU
    had grown from a small small and mediumsized enterprise to be one of most reputed
    LCL providers in the world over the past 30 years. As a result of forward integration,
    ECU had evolved from LCL business to also venture into related industries in the
    logistics area, such as transportation, warehousing, and distribution.


    Presently, ECU’s head office is based in Mumbai, India, as explained by Shetty.
    However, its online system can be accessible anywhere in the world to provide
    booking and tracking services for their customers.'
