    ## 作者简介


    ![image](img/author.jpg)


    **Tan 博士**是位于新加坡的交大太平洋学院院长，也是马萨理工学院交通与物流中心的研究员。在此之前，他在迪拜、马来西亚和新加坡的海外大学担任供应链管理和物流管理硕士项目的主任。他的研究成果发表在国际期刊上，并担任多个国际期刊的编辑委员会成员。


    Tan 博士此前曾在政府机构担任主管，负责提升制造业和物流业的技术能力。这涉及对化工和物流行业的技术的规划和评估。在技术供应商工作期间，他还为亚洲的离散型和流程型企业提供了大量的
    ERP 和重构咨询服务，以优化其供应链。

