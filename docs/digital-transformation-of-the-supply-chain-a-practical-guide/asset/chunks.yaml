- raw: 'The new process for a SPC is mapped out after integrating the selected projects,
    as shown in [Figure 26](#chapter8.xhtml#fig26). In the new process, patients can
    now perform simple testing and diagnostics in a polyclinic before going to a SPC.
    At the SPC, the patient can pre-register online or register himself at the kiosk
    and proceed to the test center with the shortest queue. Once the tests are completed,
    he is free to shop or eat at a nearby shop. 15 minutes before the actual consultation,
    he will be alerted from the mobile application. After the consultation, he will
    either receive treatment or go directly to the pharmacy to collect his medication.
    He will end his visit by paying all his bills in one go and make his next appointment
    if necessary. The new process was validated to ensure that it is feasible and
    to solicit a buy-in.


    ***Benefits of Using the New System***


    • Quick response (QR) codes on mobile phone that are also paperless Environment
    friendly


    • Online pre-registration to schedule or change appointment


    ![](images/fig26.jpg)


    **Figure 26.** New process flow for the specialist private clinic


    • Quick visitor registration process in the SPC


    • Smooth and productive operations derived from real-time integration


    • Cost savings from reduced manpower in the SPC


    The entire system is to be user friendly and simple to use as most of the patients
    are quite old in age. Nurses may need to assist them if they are not able to move
    around easily and the streamline layout helps to minimize movement. The system
    needs to operate in real-time mode to capture the patient’s information from the
    laboratory results before the doctor can diagnose the patient. The technology
    used needs to be stable and reliable so that patients and doctors can reply on
    them. Furthermore, since most of the information about the patient is confidential,
    patients’ records need to be securely stored.


    ## **Chapter 9**


    ## **MANAGING PROCESS CHANGE WITH SUPPLY CHAIN PARTNERS**


    As we have seen through [Chapters 2](#chapter2.xhtml) to [7](#chapter7.xhtml),
    the digital supply chain transformation (DSCT) principles, framework, and methodology
    have implicit changes in business processes, technology, and the ways of working
    of staff associated with the supply chain functions undergoing transformation.
    In this chapter, we will highlight the nuances for managing and ensuring the required
    change is readily adopted not only within the organization that has embarked on
    DSCT, but also the supply chain partners. Managing change itself has at least
    two meanings.


    The first meaning of managing change refers to the making of changes in a planned
    and managed or systematic fashion. The aim is to implement new methods and systems
    more effectively in an ongoing organization. The changes to be managed lie within
    the supply chain ecosystem and are controlled by the organization. However, these
    internal changes might have been triggered by events originating outside the organization(s)
    participating in DSCT from either their suppliers or customers.


    Hence, the second meaning of managing change is the response to changes over which
    the organization exercises little or no control (e.g. legislation, social and
    political upheaval, the actions of competitors, national disasters, and so on).


    The underlying motive for change management is to make it part of the company
    culture. However, the culture within the company is frequently underestimated.
    According to Carly Fiorina, ex-chief executive officer of Hewlett-Packard, “Culture
    is the company’s software”, and “the soft stuff is the hard stuff”. Culture is
    a vital aspect within change management and the crucial factor for success or
    disaster. Managing the kinds of changes encountered by and instituted within organizations
    requires a set of comprehensive skills.


    **Critical Skills for Change Management**


    Political skills: organizations are, first and foremost, social systems. Without
    people there can be no organization. Lose sight of this fact and any would-be
    change agent will likely lose his or her head, especially in Asia’s context. Organizations
    are hotly and intensely political. Change agents dare not join in this game, but
    they had better understand it. This is one area where you must make your own judgments
    and keep your own counsel; no one can do it for you.


    Analytical skills: make no mistake about it, those who would be change agents
    had better be very good at something, and that something had better be analysis.
    Insight is nice, even useful, and sometimes shines with brilliance, but it is
    difficult to sell and almost impossible to solicit buy-in. A clear, rational,
    and well-argued process analysis can certainly justify the business process re-engineering
    efforts and discomfort over the duration. If not, then the political issues have
    not been adequately addressed. Two particular sets of skills are very important
    here: (1) workflow operations or systems analysis and (2) financial analysis.


    Change agents must learn to take apart and reassemble operations and systems in
    novel ways, and then determine the financial and political impacts of what they
    have done. Conversely, they must be able to start with some financial measure
    or indicator, or goal, and make their way quickly to those operations and systems
    that, if reconfigured a certain way, would have the desired financial impact.


    People skills: as stated earlier, people are part of an organization. Moreover,
    they become characterized by all manner of sizes, shapes, colors, intelligence
    and ability levels, gender, sexual preferences, national origins, first and second
    languages, religious beliefs, attitudes toward life and work, personalities, and
    priorities — and these are just a few of the dimensions along which people vary,
    especially in Asia. We have to deal with them all. The skills most needed in this
    area are those that typically fall under the heading of communication or interpersonal
    skills.


    To be effective, we must be able to listen actively, restate, reflect, clarify
    without interrogating, draw out the speaker, lead or channel a discussion, and
    plant ideas, and develop them. This is especially so in Asia, where most people
    tend to keep information to themselves and are not keen to share with one another.
    So, we have to learn to see things through the eyes of these other inhabitants
    of the organizational world. A situation viewed from a manager’s frame of reference
    is an entirely different situation when seen through the eyes of an operator.
    Part of the job of a change agent is to reconcile and resolve the conflict between
    and among disparate (and sometimes desperate) points of view.


    Leadership skills: leadership is the act of creating organizational vision, alignment,
    and deployment. Once the organization is clearly committed to its core vision,
    a vision specific for the transformation effort should be created. After a process
    has been chosen for transformation, a vision describing its purpose must be developed.
    This is critical for focusing the transformation team on its goal. This vision
    must then be communicated through the entire organization to achieve commitment
    to the transformation effort and the changes that will ensue.


    The responsibility of creating the process vision in most cases falls upon the
    senior management but can be revised after the more “micro” and complex work of
    transformation teams has taken place. Therefore, the skill most needed in this
    case is communicating the process vision to everyone effectively and guiding team
    members in the right direction to reach the vision.


    **Leading Change Model**'
