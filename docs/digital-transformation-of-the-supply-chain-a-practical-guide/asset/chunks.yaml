- raw: '• Improvements in real time information visibility, which in turn would provide
    the right foundation for any ability to perform “what if ” simulation scenarios
    in the realm of supply chain planning to quickly adjust operating plans without
    throwing the core operational or production teams into a state of confusion.


    • Digital collaboration across maximum supply chain partners to achieve the twofold
    objectives of making the supply chain initiative a mutually beneficial agenda
    and, with better information sharing, to improve basic efficiency of goods movement
    across the network.


    We considered the oil and gas industry as an example above so that all possible
    industry supply chain characteristics are taken into consideration by a company
    while preparing for digital supply chain transformation. It may be interesting
    to note that, with some variations, the above recommendations will apply across
    all goods and services industries.


    Retailers are finally acknowledging the customer as the center of their universe
    rather than the store. Following the lead of disruptive innovators like Amazon
    and Alibaba, and established giants like Walmart, retailers are evolving to give
    consumers the products they want, when they want them, wherever they may be. Meanwhile,
    in the consumer products industry, major players like Unilever and Procter & Gamble
    are blurring the lines between retail and online business models through new subscription
    services or Amazon Dash. Fashion and apparel brands such as Zara and H&M are investing
    in speed-enhancing the supply chain to drastically shorten the time it takes to
    go from concept to consumer. And automotive and industrial companies are working
    to reduce friction in the supply chain and enhance collaboration among suppliers.
    Businesses everywhere are starting to recognize the value of supply chain visibility,
    tying digital information to the real world, and turning insights into action.


    As digital transformation progresses through supply chains, it becomes clear that
    certain supply chains are more mature than others. But none have achieved full
    digital maturity according to analyst reports globally. The digital journey takes
    companies, and by extension their supply chains, through a series of ordered stages.
    Each stage contains specific competencies and technologies necessary to build
    a platform for continued digital evolution.


    Change is incremental. But as businesses gain proficiency within each stage, their
    supply chains become better-equipped to meet the demands of today’s complex, networked,
    and global business environment. And while certain steps may seem small, it adds
    up to some truly transformative opportunities throughout the supply chain. For
    example, shipping companies must track their containers in real time, which have
    long been tracked using manual processes. Manual tracking is no longer acceptable
    and must be digitally transformed in order to be competitive. According to a futuristic
    technology vision report published by a leading management consulting firm in
    2019, 45% of companies surveyed responded that the pace of innovation in their
    organizations had significantly accelerated over the preceding three years due
    to emerging digital technologies.


    ## **Chapter 2**


    ## **IDENTIFYING PROCESSES FOR THE DIGITAL TRANSFORMATION OF THE SUPPLY CHAIN**


    In the 1990s, many companies adopted business process re-engineering to obliterate
    functional silos and create cross-functional, integrated, and process-based organizations.
    Despite multiple rounds of such attempts at process transformation, many supply
    chains are still not operating at the level of interconnections and collaborations
    that most industry leaders are adopting. Today, supply chain managers at the average
    performing company in any industry confront a new challenge of eliminating process
    disconnects and making yet another attempt to synchronize across process silos
    to unlock value. And COVID-19 exposed these shortcomings in supply chains to the
    world. Add to it the supply chain crisis across industries, unleashed by a 1,300
    feet long container ship blocking the Suez Canal in 2021.


    Digital supply chain transformation is a recommended approach to enable mutual
    adjustment of processes across different business functions or stakeholder groups
    to align key information, material, and cash flows across business processes to
    maximize returns and minimize losses. As we propound digital supply chain transformation
    in this chapter, we will focus on supply chain processes and transformation opportunities
    that companies need to imbibe as soon as they can. It is not harsh to say that
    survival for some will be based on these immediate actions. Oftentimes, failures
    of improvement across five key business functions can be costly and limit the
    true potential of organizations. Connecting across the supply chain, product development,
    distribution and sales, customer service and delivery, and financial functions
    to ensure that the right product is delivered to the right customer at the right
    time and at the right margin remains a challenge. Failures to synchronize across
    these core business functions can create direct losses or, even worse, eliminate
    opportunities to realize new growth. In contrast, companies that are already collaborating
    internally across functions are ready to collaborate externally as well with supply
    chain partners and thus outperform their competition with strategies that are
    seemingly difficult to imitate and execute.


    Adopting key tenets of our recommended digital supply chain transformation has
    the potential for companies to radically change the work environment. Individual
    processes of disparate functions are combined to gain effectiveness, efficiency,
    and productivity. Shop floor workers are empowered and allowed to make decisions
    on the spot to eliminate process roadblocks or multiple hierarchy of approvals
    and increase speed to market. Not only is this beneficial for overall supply chain
    performance but it can also increase employee satisfaction and loyalty.


    As we go beyond the COVID-19 pandemic, supply chains around the world will evolve
    to be completely different. In subsequent chapters, we talk about supply chain
    process transformation in a more general way so that readers are able to appreciate
    this beyond 2021. The real value of any supply chain transformation lies in the
    positive impact to people in an organization. Companies should consider digital
    supply chain transformation as fully successful when employees can expand their
    skill and knowledge into other areas and have the ability to make decisions that
    affect supply chain performance.


    A few words on what digital supply chain transformation is NOT. It is not about
    reorganizing, restructuring, downsizing, automation, or cost cutting. All of these
    things may be a result of a well-thought-out, wellplanned, and well-executed business
    process improvement project. However, the company’s listed goals, mission, and
    vision should not be the sole reason for a company to justify a business transformation
    program. Of course, these are guiding principles.


    In our experience, business transformations are typically carried out as complex,
    time-sensitive, large-scale, multi-million-dollar projects focused on designing
    and implementing fundamentally restructured supply chain processes. Improvement
    involves information management, technology, and people at every organization
    level and in a variety of functions, including engineering, manufacturing, supply
    chain, sales, product management, finance, human resources, information technology,
    and marketing.'
