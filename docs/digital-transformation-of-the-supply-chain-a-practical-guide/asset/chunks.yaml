- raw: 'The company PQR is a multi-billion-dollar construction company headquartered
    in India. The organization expected the procurement function to be more proactive
    than reactive. The company’s chief experience officer-level leadership expected
    to see the procurement function being involved in major decisions for the company.
    The organization started with structuring policies to eradicate procurement bypass
    wherein divisions used to ignore procurement suggestions and research in their
    day-today and planned requirements purchases. As such, they carried out a sourcing
    and procurement process assessment to identify potential areas wherein they could
    bring in digital levers such as artificial intelligence/ machine learning (AI/ML),
    robotic process automation (RPA) and blockchain, and others as applicable. Some
    of the key business needs that were identified and placed on a digital supply
    chain transformation roadmap are listed below.


    First, the company identified core business systems and solutions that were already
    being used by procurement functions: e-sourcing and e-auctions, electronic catalogs,
    contract management, supplier information management, e-procurement, e-invoicing,
    and spend analytics.


    Using these as the foundation, the company started on what they called an “artificial
    intelligence discovery mission”. The following levers were identified:


    • Collaborative supplier networks leveraging a digital cloud-based platform


    • Supplier risk management enabled by futuristic risk modeling based on internal
    and external parameters, leveraging predictive analytics


    • Robotic Process Automation was identified to automate the operational procure-to-pay
    side of procurement. The processes herein are heavy in volume, highly transactional
    in nature, and need investment of both time and resources. Key benefits envisaged
    from RPA include minimizing human touchpoints, leading to enhanced purchase order
    management, and maintaining a strong audit trail for the future.


    Once a person in charge of procurement makes a decision on the purchase, she expects
    RPA to trigger alerts to different departments of the organization, such as plant
    (to plan the output and resource utilization), marketing (plan for promotional
    activities), sales (to book orders based on the output and promotions), and finance
    (analysis of profit and loss, operating cost). With the above situation, the procurement
    process will be more strategic to the organization.


    • Cognitive computing and AI: one of the major issues faced by buyers has been
    determining the cost factors in building a finished product. When a buyer does
    a strategic assessment of the raw materials, she needs to understand the price
    influencers of the material with the help of AI. When a buyer chooses a product
    and its United Nations Standard Products and Services Code, AI should be able
    to pull data regarding the availability of the dependent material, its historical
    pricing, current suppliers, global market availability, best possible location
    to procure from, quality standards, best available route for delivery, lead time
    to plant, and lead time to market.


    • Predictive/advanced analytics via AI: for procurement of services from the market,
    the company expects that with the help of AI, buyers would be able to find out
    the skillset rates fixed by different labor boards, skilled workforce availability
    in the market, and current market rates.


    • Intuitive user-friendly visualization tools


    Thereafter, the digital innovation team identified emerging solutions and digital
    technologies that could impact sourcing and procurement in the future:


    • Blockchain: the current situation with paper-based contracts have the following
    obvious and well-known problems:


    ○ Time consuming contract authoring, workflow, approvals, and documentation and
    signatures process


    ○ Inherent security risks


    ○ High administrative costs that keep increasing


    ○ Need for physical storage space


    Blockchain in procurement would be one of the initiatives for errorfree and trustworthy
    business deals. No more invoice reconciliation, no more approval for payments,
    no more three-way match required for goods receipts.


    • 3D printing


    • Sensors/wearables


    • Cyber tracking


    • Virtual reality/spatial analytics


    ## **Chapter 4**


    ## **ESTABLISHING ORGANIZATION AND PEOPLE READINESS**


    From a practical execution perspective, setting up the organization structure,
    ways of working, and a clear distribution of responsibilities and accountabilities
    should be a very integral part of initiating the digital supply chain transformation
    that we discussed in [Chapter 3](#chapter3.xhtml). At the same time, this topic
    is extremely important and critical to the expected success of a digital supply
    chain transformation program and therefore, it merits a complete chapter of its
    own.


    The program would take shape based on the identification of scope from aspects
    we outlined in [Chapter 2](#chapter2.xhtml). Based on the process scope of supply
    chain management, there would be a program sponsor, already identified by the
    company leadership, representing the overall supply chain function for the company.
    This person would have identified one of the senior employees of the supply chain
    management function or department to lead this digital transformation program.
    This person can be called the program director, program manager, transformation
    leader, or transformation manager for the digital supply chain transformation
    program. Ultimately, it is the role, set of responsibilities, and deliverables
    that this person will be the single point of ownership for, that is important.
    We will come back to define this all-important role later. First of all, let us
    talk about how to structure the organization for such a critical business initiative:
    the digital supply chain transformation program that is bound to have both revenue
    and profitability impact on the company.


    There are many structures that have been employed by different organizations in
    the past many years for any kind of business transformation, digital implementation,
    or similar programs. The traditional approach has been to establish a core team
    for the program, as shown in Appendix 3. This would typically involve representatives
    of the departments that have a stake in the program from a process standpoint.
    Also, there would be focused representatives from the information technology department
    for each process area in scope to bring in the digital application or digital
    technologies perspective into every stage of the program. This core program team
    would report to a steering committee or steering group. The steering group would
    comprise department heads and/or executive leadership team members of the company.
    The leading practice for supply chain transformation is to have the chief supply
    chain officer or equivalent as the head of this steering committee, and also the
    program sponsor. Depending on the strategic importance of the digital transformation
    program, the chief financial officer, chief information officer, and/or chief
    digital officer and chief executive officer would also be a part of the steering
    committee. The core team then enlists additional program or project members from
    other departments, from a consulting or digital services organization, digital
    application or technology provider, to partner organizations such as channel partners
    or suppliers depending on the scope of the supply chain process transformation
    being initiated. Thus, we are recommending the following approach and structure
    to setup the program organization for a digital supply chain transformation.


    First, the program sponsor needs to set up the core team with a size of five to
    seven members, which seems to function most effectively. While a larger team size
    is not uncommon, studies have shown that core teams with more than 10 members
    may have trouble reaching consensus and achieving objectives. Key selection principles
    are as follows:'
