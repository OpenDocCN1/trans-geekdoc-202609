    ## **Chapter 11**


    ## **CRITERIA FOR SUCCESS IN DIGITAL SUPPLY CHAIN TRANSFORMATION**


    Finally, we would like to discuss key elements of success in driving towards a
    digital supply chain transformation. Critical success factors remain within the
    control of the program manager who is responsible for implementing the digital
    supply chain transformation project. Rather than being held captive to a chain
    of events beyond their control, program managers have a strong capacity to influence
    and improve their teams’ chances of implementation success by attending to the
    critical success factors as listed below.


    **Project Goals and Mission**


    Goals, as well as the ultimate benefits, must be clearly defined at the outset
    of a digital supply chain transformation project. Project mission refers to a
    condition where the goals of the project are clear and understood not only by
    the project team involved, but also by the other organizations in the supply chain.


    **Top Management Commitment**


    Obtaining stakeholders commitment: top management or sponsors from each company
    must set the stage for both the design project and subsequent implementation.


    Top management commitment refers to the willingness of top management and supply
    chain leaders to provide the necessary resources and authority or power for implementation
    success. Management commitment for digital supply chain transformation projects,
    or indeed for any implementation effort, has been considered of great importance
    in distinguishing between their ultimate success and failure. The degree of management
    support for a digital supply chain transformation project will lead to significant
    variations in the degree of acceptance or resistance to that project or product.
    Top management’s support of such project may involve aspects such as allocation
    of sufficient resources (including financial, manpower, time, etc.) as well as
    the project management’s confidence in their support in the event of crisis.


    **Detailed Schedule**


    A detailed schedule or plan is a detailed specification of the individual action
    steps for digital technologies implementation. Project schedule must be driven
    by the importance of creating a detailed plan of the required stages in the digital
    transformation process. Schedule or plan refers to the degree to which time schedules,
    milestones, manpower, and equipment requirements are specified. The schedule should
    include a satisfactory measurement system as a way of judging actual performance
    against budget and time allowances. Schedules and plans are not the same. Planning
    is a more broad-range process, encompassing resource assessments, work breakdown
    structures, and other forms of project monitoring mechanisms. Scheduling is generally
    understood to refer to the tasks of creating specific time and task-interdependent
    structures, such as critical path and Gantt charts.


    **Stakeholder Feedback**


    Stakeholder feedback is the communication, consultation, and active listening
    to all parties impacted by the proposed digital supply chain transformation project.
    A stakeholder is anyone who will ultimately make use of the results of the project
    either as a customer or supplier outside the company. The degree to which stakeholders
    are personally involved in the implementation process will lead to great variation
    in their support for that project. Hence, the program manager must determine whether
    stakeholders for the project have been identified, onboarded, continuously updated,
    and their needs met.


