- raw: '**Robotics** is the interdisciplinary technology that combines artificial
    intelligence and engineering to conceive, build, and operate machines with various
    purposes.


    A **sensor** is an electronic device that measures and monitors environmental
    conditions. The data recorded by these devices is usually collected by a computer,
    which then uses the information to take action. Sensors measure physical qualities
    such as speed and are built into many devices that you use regularly.


    **Social media** is any digital tool that allows users to quickly create and share
    content with the public. Social media encompasses a wide range of websites and
    applications. For example, Twitter specializes in sharing links and short written
    messages.


