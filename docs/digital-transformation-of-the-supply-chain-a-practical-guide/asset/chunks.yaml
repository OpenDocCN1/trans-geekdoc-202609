    \ Data redundancies across sub-processes within the process\n   • Excessive hand-offs\
    \ within this process or with either processes\n   • Long queuing time\n   • Redundant\
    \ checking and control\n   • Frequent rework and iteration\n   • Extra complexity,\
    \ frequent exceptions, and special handling needs\n\n3. Feasibility: is the process\
    \ feasible for transformative change? Parameters by which we can determine feasibility\
    \ include the following:\n   • Manageable scope and scale\n   • Affordable to\
    \ change\n   • Digital technologies readily available\n   • Supportive management\n\
    \   • Acceptable culturally\n   • Viable politically\n\n4. Potential for new digital\
    \ technology: can new technology dimensions, such as the below, be introduced\
    \ to improve the process?\n   • Cloud-based shared databases and blockchain\n\
    \   • Latest-generation telecommunication networks powering Internet of things\
    \ (IoT)\n   • Advanced decision support tools powered by artificial intelligence\
    \ or machine learning\n   • Wireless data communication and portable computing\
    \ devices as small as mobile phones\n   • Automatic identification and tracking\
    \ technology including hightech sensors\n   • Geographical information systems\
    \ powered by real-time connected Global Positioning System\n\nBased on past experience,\
    \ the scope of the digital transformation program for the supply chain should\
    \ be based on an organization’s capabilities, the different types of available\
    \ resources, as well as the level of interest from suppliers, customers, or other\
    \ partners. Even if given a clear need to transform, most organizations would\
    \ lack sufficient resources, such as people, funds, and time, to do so. It is\
    \ best to organize and start the overall digital supply chain transformation program\
    \ with small projects for organizations that have not done any transformation\
    \ before. Once people demonstrate that they can handle simple changes to processes,\
    \ more complicated ones can be tackled subsequently. Thus, each successful initiative\
    \ becomes a model for future efforts.\n\n7-Eleven ([www.7-eleven.com](http://www.7-eleven.com))\
    \ in Japan has transformed its supply chain to quickly respond to sudden changes\
    \ in demand instead of fast or cheap deliveries. By investing in proprietary real-time\
    \ systems for visibility into customer demographics, preferences, and sales at\
    \ every store, the company is able to identify new sales opportunities and alert\
    \ suppliers to potential shifts in requirements, to reallocate inventory among\
    \ stores, and ensure that the company restocks at the right time. Having strong\
    \ partnerships with its suppliers and by using a variety of transportation modes,\
    \ including trucks, motorcycles, boats, and even helicopters, the company is able\
    \ to resupply and replenish stores three or more times a day. This allows the\
    \ company to cater to different consumer segments and demands at different hours,\
    \ from delivering bento boxes for lunch to other fresh food for breakfast and\
    \ dinner.\n\n## Chapter 3\n\n## INITIATING THE DIGITAL TRANSFORMATION OF THE SUPPLY\
    \ CHAIN\n\nWe recommend that companies must think about a digital transformation\
    \ for their supply chain by starting with a comprehensive assessment of supply\
    \ chain processes and the various skill sets required for key roles in the organization\
    \ that would be required to drive this kind of initiative. The expected outcome\
    \ is to recommend improvement opportunities and a roadmap for future investments\
    \ based on extensive research that will improve operational efficiency and digital\
    \ supply chain experience for individual supply chain functions, as well as stakeholders\
    \ from other business functions who need supply chain information. Some examples\
    \ of leading practices that are already being adopted to initiate a digital supply\
    \ chain transformation by companies are as follows:\n\n• Identify opportunities\
    \ and levers to optimize “spend” via strategic sourcing and contract management\n\
    • Leverage subject matter experts at the supplier end. For the buying organization,\
    \ this helps procurement managers and buyers to focus on value creation, rather\
    \ than consuming time in mundane work.\n• Engage internal “customers” in the decision-making\
    \ process\n• Identify levers for supply chain velocity improvement\n• Carry out\
    \ thorough assessment for fitment of advanced digital supply chain planning solutions\
    \ available in the market with the best in-class automation and analytics capabilities\n\
    • Holistically re-engineer demand sensing and demand planning to incorporate aspects\
    \ of all potential market dynamics and newer causes of variability\n• Establish\
    \ policy and procedures so that we can enable suppliermanaged inventory\n• Define\
    \ and execute centralized inventory management processes for enterprise-wide visibility\n\
    • Constantly review inventory policy and parameters, leveraging a digital twin\
    \ that can do this much more frequently\n\nCompanies looking to execute this kind\
    \ of assessment as the right process foundation for a digital supply chain transformation\
    \ must leverage a holistic framework approach, focusing on supply chain maturity\
    \ assessment covering end to end supply chain planning, sourcing to contracting\
    \ to operational procurement, collaboration with all supply chain partners, and\
    \ end to end logistics comprising warehousing and transportation. This approach\
    \ to supply chain performance assessment would run over three stages:\n\nStage\
    \ 1: Supply chain process evaluation\nFocused on evaluating existing processes,\
    \ the integration of supply chain functions, roles, and responsibilities, and\
    \ alignment with strategic goals.\n\nStage 2: Exploring emerging technology for\
    \ breakthrough performance\nFocused on evaluating the usage of existing applications’\
    \ capabilities and what best can be done by enhancing them to meet the desired\
    \ outcomes.\n\nStage 3: Digital transformation of the supply chain\nFocused on\
    \ assessing the various technologies and applications that currently exist and\
    \ are planned in the digital strategy roadmap, and what further actions need to\
    \ be taken to become among the leaders in the industry for supply chain excellence.\n\
    \nWhile establishing the roadmap for supply chain transformation, it is important\
    \ to keep in mind that outcomes need to be realized over time, where\n"
  trans: "\n\n在制定供应链转型的路线图时，需要牢记随着时间的推移需要实现的目标，如图 2 所示。设定可量化的目标是第一步，也是必要的步骤，并且基于既定的目标和期望结果，公司应进一步调查变革的确切范围——哪些流程必须进行转型。最后，值得模拟拟议的变革将如何影响业务，并比较追求该变革的风险与回报。\n\
    \n![](img/fig2.jpg)\n\n**图 2.** 将目标与业务影响保持一致\n\n在供应链转型项目中，将会有许多流程可以考虑重新设计并向数字化提升。因此，由于资源限制，重要的是从长名单中选择其中几个流程。选择改进流程的起点是获取利益相关者关于他们对特定供应链流程和子流程的满意或不满意以及关键业务痛点的信息。流程选择中需要考虑的关键标准包括：\n\
    \n1. 重要性：该流程是否具有战略相关性？它是否支持公司战略和业务的整体关键成功因素之一？它是否对公司的客户或供应商和渠道合作伙伴的绩效产生显著积极影响？从核心来看，该流程是否可能定期改善业务绩效？\n\
    \n2. 绩效：该流程是否存在以下绩效缺陷？\n   • 重复或频繁的内部和外部客户投诉\n   •  extensive information exchange\n\
    \   • 流程内子流程之间的数据冗余\n   • 该流程内部或与其他流程之间过多的交接\n   • 长等待时间\n   • 重复的检查和控制\n   •\
    \ 频繁返工和迭代\n   • 额外复杂性、频繁异常和特殊处理需求\n\n3. 可行性：该流程是否适合进行转型性变革？我们可以通过以下参数来确定可行性：\n\
    \   • 可管理的范围和规模\n   • 负担得起的变更成本\n   • 数字技术 readily available\n   • 管理层支持\n   •\
    \ 文化上可接受\n   • 政治上可行\n\n4. 新数字技术的潜力：是否可以引入以下等新技术维度来改进流程？\n   • 基于云的共享数据库和区块链\n\
    \   • 为物联网提供动力的最新一代电信网络\n   • 由人工智能或机器学习驱动的先进决策支持工具\n   • 无线数据通信和便携式计算设备，小到手机大小\n\
    \   • 自动识别和跟踪技术，包括高科技传感器\n   • 由实时连接的全球定位系统驱动的地理信息系统\n\n根据过往经验，供应链数字化转型项目的范围应基于组织的\
    \ capabilities、不同类型的可用资源，以及供应商、客户或其他合作伙伴的兴趣程度。即使有明确的转型需求，大多数组织也缺乏足够的人力、资金和时间等资源来做到这一点。对于从未进行过转型的组织，最好将整体数字化供应链转型项目组织并从小型项目开始。一旦人们证明他们能够处理流程的简单变更，随后就可以处理更复杂的变更。因此，每一次成功的举措都成为未来工作的[content]\n\
    \n在制定供应链转型的路线图时，需要牢记随着时间的推移需要实现的目标，如图 2 所示。设定可量化的目标是第一步，也是必要的步骤，并且基于既定的目标和期望结果，公司应进一步调查变革的确切范围——哪些流程必须进行转型。最后，值得模拟拟议的变革将如何影响业务，并比较追求该变革的风险与回报。\n\
    \n![](img/fig2.jpg)\n\n**图 2.** 将目标与业务影响保持一致\n\n在供应链转型项目中，将会有许多流程可以考虑重新设计并向数字化提升。因此，由于资源限制，重要的是从长名单中选择其中几个流程。选择改进流程的起点是获取利益相关者关于他们对特定供应链流程和子流程的满意或不满意以及关键业务痛点的信息。流程选择中需要考虑的关键标准包括：\n\
    \n1. 重要性：该流程是否具有战略相关性？它是否支持公司战略和业务的整体关键成功因素之一？它是否对公司的客户或供应商和渠道合作伙伴的绩效产生显著积极影响？从核心来看，该流程是否可能定期改善业务绩效？\n\
    \n2. 绩效：该流程是否存在以下绩效缺陷？\n   • 重复或频繁的内部和外部客户投诉\n   • 大量信息交换\n   • 流程内子流程之间的数据冗余\n\
    \   • 该流程内部或与其他流程之间过多的交接\n   • 长等待时间\n   • 重复的检查和控制\n   • 频繁返工和迭代\n   • 额外复杂性、频繁异常和特殊处理需求\n\
    \n3. 可行性：该流程是否适合进行转型性变革？我们可以通过以下参数来确定可行性：\n   • 可管理的范围和规模\n   • 变更负担得起\n   • 数字技术\
    \ readily available\n   • 管理层支持\n   • 文化上可接受\n   • 政治上可行\n\n4. 新数字技术的潜力：是否可以引入以下等新技术维度来改进流程？\n\
    \   • 基于云的共享数据库和区块链\n   • 为物联网提供动力的最新一代电信网络\n   • 由人工智能或机器学习驱动的先进决策支持工具\n   •\
    \ 无线数据通信和便携式计算设备，小到手机大小\n   • 自动识别和跟踪技术，包括高科技传感器\n   • 由实时连接的全球定位系统驱动的地理信息系统\n\
    \n根据过往经验，供应链数字化转型项目的范围应基于组织的 capabilities、不同类型的可用资源，以及供应商、客户或其他合作伙伴的兴趣程度。即使有明确的转型需求，大多数组织也缺乏足够的人力、资金和时间等资源来做到这一点。对于从未进行过转型的组织，最好将整体数字化供应链转型项目组织并从小型项目开始。一旦人们证明他们能够处理流程的简单变更，随后就可以处理更复杂的变更。因此，每一次成功的举措都成为未来工作的模型。\n\
    \n7-Eleven（[www.7-eleven.com](http://www.7-eleven.com)）在日本已将其供应链转型，以快速响应需求的突然变化，而非追求快速或廉价的交付。通过投资专有的实时系统来了解每家商店的客户人口统计、偏好和销售情况，公司能够识别新的销售机会并提醒供应商潜在的需求变化，以在商店之间重新分配库存，并确保公司在正确的时间补货。公司与供应商保持强大的合作伙伴关系，并使用多种运输方式，包括卡车、摩托车、船只甚至直升机，能够每天三次或更多次对商店进行补给和补充。这使公司能够在不同时间满足不同消费者细分市场的需求，从午餐配送便当到早餐和晚餐的其他新鲜食品。\n\
    \n## 第 3 章\n\n## 启动供应链的数字化转型\n\n我们建议公司必须通过对供应链流程进行全面评估以及组织中关键岗位所需的各种技能组合来思考供应链的数字化转型，这些岗位将推动此类举措。预期成果是基于广泛研究提出改进机会和未来投资的路线图，从而提高运营效率和供应链各职能的数字化供应链体验，以及需要供应链信息的其他业务职能的利益相关者。一些公司已采用以启动数字化供应链转型为目的的领先实践示例如下：\n\
    \n• 通过战略采购和合同管理识别优化“支出”的机会和杠杆\n• 利用供应商端的 subject matter experts。对采购组织而言，这有助于采购经理和买家专注于价值创造，而非在琐碎工作中消耗时间。\n\
    • 让内部“客户”参与决策过程\n• 识别供应链速度提升的杠杆\n• 对市场上具有最佳自动化和分析能力的先进数字化供应链规划解决方案的适用性进行彻底评估\n\
    • 全面重新设计需求感知和需求规划，以纳入所有潜在市场动态和新的变异原因\n• 建立政策和程序，以便我们能够实现供应商管理库存\n• 定义并执行企业范围可见性的集中库存管理流程\n\
    • 不断审查库存政策和参数，利用数字孪生可以更频繁地做到这一点\n\n希望将此类评估作为数字化供应链转型正确流程基础的公司必须利用整体框架方法，重点关注供应链成熟度评估，涵盖端到端供应链规划、从采购到合同再到运营采购、与所有供应链合作伙伴的协作，以及涵盖仓储和运输的端到端物流。这种供应链绩效评估方法将分为三个阶段：\n\
    \n阶段 1：供应链流程评估\n重点评估现有流程、供应链职能的整合、角色和职责，以及与战略目标的契合度。\n\n阶段 2：探索突破性绩效的新兴技术\n重点评估现有应用程序\
    \ capabilities 的使用情况，以及通过增强它们以满足期望成果可以做到的最佳效果。\n\n阶段 3：供应链的数字化转型\n重点评估当前存在并计划在数字化战略路线图中的各种技术和应用程序，以及需要采取哪些进一步行动才能成为供应链卓越行业的领导者之一。\n\
    \n在制定供应链转型的路线图时，需要牢记成果需要在一段时间内实现，其中\n\n"
