    `EMR` 中 |


    ## HOW 模板


    | `HOW` 模板 | ||  |  |

    | 患者只能通过采集样本或进行扫描等方式接受检测 | • 患者可以进行远程检测 | • 患者可以自己进行检测 | • 远程诊断设备 | • 用于自主检测的测试剂盒
