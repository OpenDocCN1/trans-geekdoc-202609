    # The Next Industrial Revolution and Supply Chain Disruption


    We are undergoing the next great industrial revolution and judging by the speed
    at which we’ve seen digital disruption tear through industries, today’s technology
    may be more disruptive than the revolutions driven by steam power, assembly lines,
    and the first computers. The rise of digital, data-driven technology has transformed
    entire industries, helping the smallest start-ups quickly establish a presence,
    scale in record time, and pave the way for entirely new business models. On the
    other hand, established brands that have turned a blind eye to the digital age,
    too satisfied with the status quo to change, are being toppled at alarming rates.
    While new technologies and digital solutions have slowly been introduced to different
    areas of business, many of those designed for supply chain have focused on solving
    well-known problems.


    ## Supply Chain at a Cusp of Innovation


    Today, all industry supply chains are at a cusp of innovation. 2020 has been a
    watershed year in terms of supply chain strategies across all industries without
    exception. Majority of companies across industries had some supply chain strategies
    pre-COVID-19 and quite a few digital supply chain initiatives in different stages
    of planning or execution. In the post-COVID-19 world, all these strategies are
    already being reconsidered. Supply chain visibility needs to take another step
    forward using real-time data integration across end-to-end entities and partners
    to enable more effective decision-making and boost cash flow benefits, measured
    by working capital improvements. Truly, disruption is turning out to be the mother
    of innovation. So how to be the innovative supply chain and stay ahead to generate
    those cash flow benefits?


    ## Preparing for Disruptions


    Adopting a digitally enabled transformation strategy will allow supply chains
    to take advantage of the upsides and maintain an agile and flexible cost base.
    Leading analysts and top Fortune 100 companies are already talking of digitally
    enabled themes that could be transforming supply chains in the near-term and medium-term
    future. So first we talk about what is the current situation and what supply chains
    can do today to be “rightly” prepared for disruptions, which are now understood
    as frequent norms. Supply chains need to realign their objectives in the face
    of:


    • Changing population demographics based on increasingly urbanized population
    and new migrations that will happen once economic activity revives

    • Constant pressure yet again to reduce costs and increase access to information
    across not just direct supply chain partners but across the ecosystem of partners

    • Increased customer awareness with online information availability and real-time
    response expectations

    • Renewed focus on resilience in supply chains, which is naturally linked to improving
    visibility across multi-tiers of supply chain partners

    • Government reform programs and regulations influencing or dictating most industries.


    Today, companies need to prepare supply chains for tomorrow’s necessary digitalization
    by establishing the right foundation of processes. The 2020 situation, with the
    COVID-19 pandemic, highlighted the fact that levels of automation and digitalization
    are varying from above medium to quite low across industries such as pharmaceutical,
    retail, consumer goods, automotive, general manufacturing, oil and gas, and construction.
    Despite the supply and demand crisis which most companies have been put into,
    it makes for a good time to actively experiment and start on a path of agile and
    continuous improvement.


    ## Customer Centricity and Current Vulnerabilities


    With customer centricity as a renewed focus of business strategy, the current
    global situation demands that companies across industries innovate and make their
    supply chains more agile and flexible. This need is also required to support key
    business tenets for improvements in efficiency, sustainability, customer centricity
    and reduction in material or resource waste. To achieve this, companies must focus
    on and tackle key business problems and current vulnerabilities like:


    • Lack of visibility into the complex globally dispersed supply chain beyond direct
    suppliers

    • Inability to accurately track the level of current and incoming material or
    finished product inventories to be sold

    • No information on demand fluctuations, which will now vary with huge spikes
    and valleys

    • Too much reliance on the workforce for more manual and time-intensive activities
