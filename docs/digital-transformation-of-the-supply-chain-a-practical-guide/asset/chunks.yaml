    • Degree of flexibility, responsiveness, or customization required


    • Minimum quality or standards of the product/service that the customer is willing
    to accept (and hence the price that the customer is willing to pay for it)


    • The urgency with which the customer views the completion of the service or delivery
    of the product. This would be measured in terms of the lead time that the customer
    is able to agree to for the selling company to commit to for delivering the service
    or product


    • The quantity of the product demanded or volume of work generated by the customer’s
    needs


    • The location at which the service is to be performed or delivery of products
    is to be made


    These differences may give rise to the need for:


    • Staff with different levels of skill or knowledge to handle different customer
    groups


    • The speed with which certain tasks need to be undertaken or priority/ attention
    given


    • The familiarity of staff with specific customers and their needs and the amount
    of initiative required of staff


    • The ability to handle variable workloads, and hence perform load balancing and
    resource scheduling (e.g. some segments might provide a steady stream of work,
    while others might be “lumpy” or show seasonality)


    • Performing certain tasks or taking certain measures for some customer groups
    (and not others)


    • Selecting different quality versus productivity or cost trade-off combinations
    for different customer segments.


    The contribution of each segment to total profitability (or other appropriate
    measures of gain to the organization or its mission) should be determined. This
    should guide the amount of resources to be committed in serving each customer
    segment.


    ![](images/fig6.jpg)


    **Figure 6.** Customize process for each customer segment


    Segmentation may eventually imply exceptional tasks or specialized staff to handle
    certain customer segments or a process with multiple channels at some points.
    In the extreme case, completely separate (duplicated) process streams may need
    to be established to handle each segment. By referring to [Figure 6](#chapter5.xhtml#fig6),
    we can offer personalized services to highly profitable customers, while we can
    advise non-profitable customers to use online banking to reduce the cost to serve
    them. The marginally profitable customers can still make use of the automated
    teller machine or the bank teller, which provide some form of assistance for them.


    Standardization promotes productivity and cost efficiency. Having differences
    in customer segments tends to work against standardization, and hence productivity
    and cost efficiency. This will have to be weighed against the gains expected in
    better satisfying the needs of each customer group.


    A performance evaluation matrix is a convenient tool to evaluate the importance
    of each customer’s needs versus the performance of the current process, as shown
    in [Figure 7](#chapter5.xhtml#fig7).


    ![](images/fig7.jpg)


    **Figure 7.** Matrix of customer importance versus process performance


    The use of such a matrix may help to avoid the common problem of continuing to
    improve in areas that a company is already strong in, or to prevent working on
    something that is not important to the customer. Improvement should focus on quadrant
    A where the customer’s need is important, but the current process is performing
    poorly as compared to competitors.


    ### Value-Added Analysis


    This technique involves identifying different types of activities within the processes.


    Value-added activities: an activity will add value if it satisfies all three of
    the following requirements:


    (a) Customer is willing to pay for the activity


    (b) Activity physically changes the product or service


    (c) Activity is performed correctly the first time it is undertaken


    Control activities: activities required by businesses for risk control but not
    necessarily value adding to customers. Examples of such control activities include
    auditing, approving, and reviewing applications.


    Non-value added activities: activities that do not add value to the final output.
    Examples of such activities include moving, filing, and storing documents. Recording
    the average cost for each activity permits ranking non-value added activities
    by cost incurred.


    In addition, one can easily develop summary statistics showing the percentage
    devoted to each of the three categories: value added, control, and non-value added
    activities. It is important to eliminate non-value added activities as well as
    control activities whenever possible to improve the process performance since
    these activities do not provide value for the customer and yet add cost to the
    operations.


    ### Quality Analysis and Benchmarking


    This technique involves understanding how the processes are satisfying customers.
    Some of the questions used in this analysis include:


    • Do the processes meet conformance standards?


    • How reliable are the processes?


    • What is the competence of the staff?


    • How do customers respond to the service provided?


    Benchmarking is about comparing the firm’s or process’s activities and performance
    with what others are doing within the same company, in the same industry, or across
    industries. Every benchmarking relationship involves two parties:


    • The initiator firm which initiates contact and observes


    • The target firm (or benchmark) which is being observed


    The main purpose of benchmarking is to assess the firm’s or process’s performance
    relative to the competition and to identify performance gaps and goals. The underlying
    idea is to learn and be inspired by the best.


    ## Chapter 6


    ## SUPPLY CHAIN PROCESS REDESIGN FOR DIGITAL TRANSFORMATION


    Designing new processes is more of an art than science; it cannot be achieved
    through a formalized method. Most existing processes were not designed; they just
    emerged as new parts were iteratively added to satisfy immediate needs. The end
    result of any such design is very much dependent on the order in which information
    becomes available. Inefficient processes are thus created when iterative design
    methods are applied. A new design for the selected supply chain process is derived
    based on opportunities for improvement identified in process analysis. Major concerns
    about feasibility and acceptability are also taken into consideration.


    One of the most important activities for process redesign with a digital transformation
    perspective will be to ensure focused workshops with process owners from business
    are carried out to run through findings, hypotheses, improvement areas, and possible
    benefits. During these workshops, the program team validates the hypotheses and
    improvement areas with business process owners and function heads in the steering
    Committee to gain alignment and agreement. These sessions are very critical and
    should be detail oriented. Each opportunity must be evaluated against ease of
    implementation and hard financial benefits in the form of working capital or revenue
    impact. The program core team has a very important role to play in terms of removing
    conflicts and ensuring that all stakeholder groups arrive at an agreement on improvement
    opportunities.


    **Table 1.** 5W2H framework


    | **5W2H** || **Improvement Dimension** || **Description** |

    | --- | --- | --- |

    | What? || Subject Matter || What is being done in this activity? Can this part
    of the process be eliminated if it is a waste? |

    | Why? || Purpose || Why is this activity needed? Clarify the purpose of the activity
    and the overall process. |

    | Who? || People || Who is performing this activity? Are they the best fit for
    the required role? Could/Should someone else perform the activity? |

    | When? || Sequence || When is the best time to perform this activity? Does it
    have to be done at a certain specific time of day? |

    | Where? || Location || Where is this activity carried out? Does it have to be
    done at this location only? |

    | How? || Method || How is the activity carried out? |

