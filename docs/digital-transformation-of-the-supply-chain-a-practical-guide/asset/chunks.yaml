  trans: '


    技术通过与供应链伙伴的虚拟共址打破了地理壁垒。地理分布的资源不应限制运营团队仅考虑流程协调的分散化方法。企业需要利用数字信息并将互联网作为强大的引擎，用于数字协作以打破地理壁垒。此类再设计的示例包括二手集装箱的仓库维修作业，如
    Figure 12 所示。在这种情况下，集装箱的损坏以数字方式捕获并存储在云服务器中，集装箱所有者可以立即批准或拒绝维修。所有各方实时协作信息，以最大化流程效率。


    ![](img/fig12.jpg)


    **Figure 12.** 集装箱仓库全球维修流程


    ## Principle 6. Link or Convert Sequential Activities into Parallel Activities


    如果顺序活动独立运行，操作错误可能要到流程结束时才会被发现。并行活动可减少延迟和整体提前期。通过广泛的流程数据挖掘利用历史模式的概念在最近几年发展成为数字价值流映射练习，有助于企业消除流程中的浪费并优化提前期。此类再设计的示例包括并发产品设计，如
    Figure 13 所示。在这种情况下，新产品开发可以由包括客户和供应商在内的各个部门并发完成。


    ![](img/fig13.jpg)


    **Figure 13.** 并发产品设计


    ## Principle 7. Design Process for the Dominant Flow, not for the Exceptions


    随着基于技术的使能因素的出现，流程挖掘的概念已多次演进。如今先进的流程挖掘技术通过运行企业资源规划（`ERP`）系统多年的历史交易数据来捕捉主导流程。一旦基于主导流程建立了基线流程，进一步的价值增加将包括为不同交易类型（例如不同的需求、复杂性、例外等）设计单独的处理流。该原则的关键好处是它有助于降低碎片化和过度复杂流程的风险，这些流程存在固有的协调问题。此类再设计的示例包括为不同客户细分市场设计服务计划，如
    Figure 14 所示。每个客户细分市场都有其自身的服务期望，需要通过情境化服务来满足。


    ![](img/fig14.jpg)


    **Figure 14.** 为每个客户细分市场提供差异化服务


    ## Principle 8. Look for Ways to Postpone the Final Product


    ![](img/fig15.jpg)


    **Figure 15.** 不同类型产品的延期策略


    在过去几十年中，不同行业领域的优秀领先企业已成功实践了制造战略中的“延期”，也称为“延迟差异化”。本质上，该策略涉及尽可能晚地延迟最终产品形式，以减少库存和预测错误。制造公司将产品或服务保持在通用形式，并在客户确认订单时进行定制。此类再设计的示例包括油漆零售商保留通用的白色母料，并在现场混合所选颜色以匹配每个客户要求，如
    Figure 15 所示。在这种情况下，零售商无需保留产品手册中列出的每种产品的库存单位和颜色，仍能够混合客户想要的任何颜色，只要颜色颜料可用即可。因此，延期将同时降低库存成本并提高客户服务水平。


    ## Principle 9. Exploit Resource Pooling to Avoid Suboptimization


    企业可以通过整合资源需求来实现规模经济。资源池化将导致库存持有成本降低和预测准确性提高。此类流程再设计的示例包括医院集中采购流程，如 Figure 16 所示。在这种情况下，医院将供应品的采购外包给第三方物流提供商，后者将批量采购并为这些医院定制产品。此外，医院将把储藏室改造成病房，从而产生更多收入。


    ![](img/fig16.jpg)


    **Figure 16.** 通过集中采购流程实现资源池化


    ## Principle 10. Avoid Duplicating Tasks with Supply Chain Partners


    随着过去几十年供应链伙伴以不同形式出现的协作思维，企业及其供应链伙伴应审查如何在协作职能之间共享工作，以便消除冗余或重复。使之成为双方共赢的关键指导原则是在最有意义的地方开展工作。此类再设计的示例包括准时制生产系统中质量控制的消除。在这种情况下，只有供应商会执行质量检查并将原材料直接发送到客户的生产车间。质量检查的结果发送给制造商用于流程和质量控制。


    ## Principle 11. Outsource Non-Core Processes


    在过去三十年左右，业务流程外包作为一种概念和商业模式的卓越成功无疑强调了这一原则。从根本上说，企业可以首先外包运营成本高于其他服务提供商的流程。更重要的是，它有助于企业利用企业不拥有的外部专业知识。另一个标准可能是，如果公司销售产品的需求不确定或波动，而产品在市场层面的消费模式稳定，则将制造流程外包给另一家供应商，该供应商可以根据需求模式扩大或缩小运营规模，或同时作为合同制造商为公司的同行供货。


    此类再设计的示例包括医疗或法律公司中的记录数字化归档，如 Figure 17 所示。在这种情况下，纸质副本被扫描并编入索引以便搜索，然后这些纸质副本被转移到存储成本较低的另一个地点。此过程将加快文件搜索速度并降低文件存储成本，因为大多数这些公司都在昂贵的市中心经营。


    ![](img/fig17.jpg)


    **Figure 17.** 用于合规的记录数字化归档


    最后，对于新流程设计的实施，应制定详细计划，将供应链流程从其当前状态转移到新流程设计中设想的状态。


    这时，项目核心团队将把所有改进机会和相关的流程再设计举措分类为快速获胜、战术收益和战略成功机会，如 Chapter 3 中所述。下一步是对这些举措进行优先排序，并为每个业务机会准备详细的商业案例。建议的时间段是绘制五年路线图和时间表，以实现数字供应链转型项目所确定的所有业务收益。在本书的后面章节中，读者将找到一个专科患者诊所的案例研究，该诊所成功应用了本章讨论的概念来推动流程转型，从而提高运营效率和效果。


    # Chapter 7


    ## IMPLEMENTING THE DIGITAL SUPPLY CHAIN TRANSFORMATION


