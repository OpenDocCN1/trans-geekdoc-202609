    # Process measurements

    `metrics` in terms of `cost`, `time`, and `quality` as part of key performance
    indicators


    ## Business process definition


    Michael Hammer and James Champy (1993) offer the following definition of a business
    process: “A collection of activities that takes one or more kinds of input and
    creates an output that is of value to the customer”. A supply chain process is
    different from a function or a department. Some processes might be contained within
    a departmental function, while others cut across organizational boundaries to
    serve the customer. They operate horizontally through a company, in contrast to
    the vertical division of labor in traditional functional groupings. A supply chain
    process often involves multiple users and activities that take place at different
    timings. Not only do we need to examine the activities in which inputs are converted
    into outputs but we also need to be able to identify the correct sequence of activities.
    A common approach is to attempt some form of function decomposition, peeling the
    layers of the process onion, until one reaches the core components in that process.


    Some organizations find it difficult to correctly determine their supply chain
    processes because they tend to think in terms of departments or functions, not
    in terms of the work they actually do, and the manner in which this work is performed.
    Cross-functional processes often go unmanaged because rarely is there an identified
    process owner — a person responsible for ensuring that the process is well-defined
    and capable of achieving its intended results.


    ## Naming and classifying processes


    One useful technique for naming processes is to identify their beginning and their
    end. For example, the order-fulfillment process could be called the “order to
    payment process”. This will allow us to include steps that are not structurally
    housed in the sales department. Naming the processes in this way helps to break
    the structures, usually the functional paradigm, and to focus on the work of people.
    Processes can be classified into three types:


    ### Management processes

    these processes are meant for the organization to ensure that proper planning
    and management of long-term organization goals are developed and executed. Examples
    of management processes include setting vision/goals, product planning, marketing
    and sales, and supply chain management.


    ### Primary or operational processes

    these are the main supply chain processes that will provide value addition to
    the customers. There may be four to five primary processes, and examples include
    product line planning and management, product development, customer acquisition,
    demand and supply planning, sourcing and procurement, order fulfillment, logistics
    and transportation, customer servicing, licensing, etc.


    ### Support or enabling processes

    these supporting processes are required to enable primary processes to operate.
    Examples of such processes include human resource management, information technology
    development, facilities management, and corporate accounting.


    ## Process mapping


    A process map shows all the processes within the organization chart and encompasses
    the first level of processes that typically yield 5 to 10 core processes that
    define the business. The process map shown in [Figure 4](#chapter5.xhtml#fig4)
    is a high-level representation of the core processes for a telecom company. This
    map shows the core processes and their relationship to each other and the customer.
    It has only seven core supply chain processes, and it includes the customer as
    its focus.


    At the next level, approximately 20 or more processes are identified. These are
    still at a relatively high level and have clear owners, usually comprising senior
    managers. The process details can be drawn using a flow chart or a swim-lane diagram
    (see [Figure 5](#chapter5.xhtml#fig5)).


    Supply chain processes traditionally cut across organizations and, consequently,
    suffer from a lack of coordination. Over time, this lack of coordination gives
    rise to practices that foster functional interests at the expense of process objectives,
    resulting in a loss of efficiency and customer focus. The key purpose of the process
    mapping phase is to review processes in order to refocus on customer needs and
    achieve quantum improvements in process efficiency at, possibly, reduced operating
    costs. Another key purpose of this phase is to get an understanding of the existing
    capabilities of processes for long-term, mid-term, and short-term planning and
    execution for the supply chain with a magnifier focus on sales and operations
    planning and sales and operations execution handoff. It is also important to understand
    existing roles and responsibilities of different supply chain functions, current
    system capabilities implemented, and further technological enablement planned
    in line with strategic directions by reviewing necessary documentation and artefacts.
    The next step is to identify opportunities for process improvement by means of
    conducting focused discussions and workshops across stakeholders for supply chain
    business processes and technology.


    Each key supply chain process is mapped to understand how they interact with other
    supply chain partners and their relationship or dependency. The key processes
    are analyzed in detail so as to understand their limitations and performance.
    Opportunities for improvement are identified. It would be very useful to leverage
    a formal supply chain process maturity model assessment questionnaire (for example,
    based on Lockamy and McCormack’s framework) as a tool for process mapping.


    ![](images/fig4.jpg)


    **Figure 4.** Core processes of a telecom company


    ![](images/fig5.jpg)


    **Figure 5.** Swim-lane representation of business processes


    The key activities to be performed to successfully accomplish process mapping
    are listed here:


    1. Carry out evaluation of supply chain processes in terms of people or function
    owning the process steps

    2. Review business strategy and planning documents, and current business and technology
    initiatives, and identify their implications to the supply chain

    3. Read through the process flows, standard operating procedure documents, reporting
    and monitoring processes, manuals etc.

    4. Prepare questionnaires for detailed stakeholder discussions/workshops

    5. Read through the current strategy and process documentations, current technology
    platforms, information technology strategy roadmap with tools/technology, and
    implementation plans

    6. Review documentation on various commercial off-the-shelf (COTS) applications
    for supply chain functions to understand their futuristic digital capabilities
    and how it can drive benefits for supply chain planning and collaboration with
    internal and external partners


    ## Process analysis


    Once we have completed the supply chain business process mapping, the next step
    is to carry out detailed process analysis. The key processes will need to be analyzed
    in detail in order to determine the performance gap, and opportunities for improvements
    will be identified. The following techniques are commonly used for process analysis.


    ### Customer Analysis: Identification and Segmentation of Customers


    Not all customers have the same needs. If these needs are sufficiently diverse,
    it may be necessary to segment the customer base according to differing needs
    and to analyze each segment separately. The implications of these differences
    would then have to be taken into account in process design to ensure that the
    needs of each segment are adequately catered for. Segmentation is the process
    of identifying groups of customers with enough common characteristics to enable
    the design of a product or service for each group’s needs. Customer needs may
    differ in terms of:


    - Emphasis, inclusion, or exclusion of different elements of the service/ product
    provided by the organization

    - Requirements or preferences in different elements or features of the service/product
    provided by the organization (which give rise to differences in difficulty or
    complexity in providing these elements)

