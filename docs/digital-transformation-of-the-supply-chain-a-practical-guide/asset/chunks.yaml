    \n|  ||  |\n\n| A patient can only be tested by taking a sample or doing a scan\
    \ etc. || • A patient can be tested remotely  \n\n• A patient can conduct the\
    \ test himself |\n\n***Idea Generation***\n\nFor each challenge posed, the staff\
    \ generate as many ideas as possible to satisfy it. Challenges specify what is\
    \ to be achieved while ideas specify how they are to be achieved. Brainstorming\
    \ is one method to keep ideas flowing fast and freely. It is a lateral thinking\
    \ process and is designed to help staff break out of their thinking patterns into\
    \ new ways of looking at things. It works by focusing on a challenge and then\
    \ coming up with many radical solutions to it.\n\nDuring brainstorming sessions,\
    \ the staff try to open up possibilities and break down assumptions about the\
    \ limits of the process. Judgments and analysis at this stage will stunt idea\
    \ generation. Ideas should only be evaluated once the brainstorming session has\
    \ finished, and they should ensure that they do not spend too much time embellishing\
    \ ideas or trying to build complete solutions. Valuable but unusual suggestions\
    \ may appear stupid at first sight. As such, care must be taken to ensure the\
    \ staff do not crush these new ideas and leave group members feeling embarrassed.\
    \ Some of the suggestions during the brainstorming session include:\n\n• Relocate\
    \ work to/from customers/suppliers\n\nCan the organization do more work on behalf\
    \ of customers?\n\nCan the organization get the customers to do some of their\
    \ work? Can the organization do more work on behalf of suppliers?\n\nCan the organization\
    \ get the suppliers to do some of their work?\n\n• Minimize interface\n\nCan interfaces\
    \ with customers be reduced by automating some of the standard enquiries and simple\
    \ transactions using automated voice response systems and information kiosks?\n\
    \n• Task compression and integration\n\nCan hand-offs be reduced so that there\
    \ will be fewer delays and errors?\n\n• Natural parallelism\n\nCan activities\
    \ be done concurrently instead of sequentially?\n\n• Standardization versus diversity\n\
    \nCan components of products or services be standardized so that they are capable\
    \ of being combined together to provide products or services with a customer focus?\n\
    \n• Case manager\n\nCan a disaggregated collection of diverse experts be coordinated\
    \ together?\n\n• Increased/decreased alternatives\n\nCan the process be made less\
    \ complex by varying the number of alternative inputs?\n\n• Early/deferred decision-making\n\
    \nCan process costs be reduced by changing the sequence of decisionmaking?\n\n\
    The generated ideas are listed in [Table 12](#chapter8.xhtml#tab12).\n\n**Table\
