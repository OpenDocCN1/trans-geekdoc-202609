  trans: "\n\n多年来，ECU 在软件方面投入了巨资以升级其系统，以满足客户对透明度和业务便利性日益增长的需求。Shetty 评论道：“我们很高兴能分享，整个网络都处于相同的\
    \ IT 平台上，这使得运营更加统一，并为全球范围内的客户提供了相似的服务体验。”\n\n## LCL（拼箱）业务的性质\n\nShetty 详细解释了物流行业。他观察到该行业的竞争异常激烈，且业务非常碎片化。市场可以大致分为本地货代和全球货代（例如：Dalsey、Hillblom\
    \ and Lynn International GmbH (DHL)、Kuehne + Nagel International AG (K&N)、DB Schenker\
    \ 等）。\n\nLCL 业务的操作模式与 FCL（集箱）业务大不同。FCL 的运营和成本计算是基于供需的，而 LCL 业务的成本则取决于客户的需求。例如，如果客户倾向于较低的海运费和更高的目的港费用，可以据此进行安排。\n\
    \n因此，市场被细分为本地货代和全球货代业务。本地货代侧重于业务，客户需要最低的运费（甚至回返点）和更高的目的港费用（目的港舱单费用 DLC）；而全球货代则采取平衡的方法，保持较低的\
    \ DLC，以确保收货人不会不满并确保交易顺畅。\n\nECU 的拼箱业务或竞争对手也分为本地经营者或区域运营商以及全球性玩家。本地或区域运营商主要关注来自小型货代的业务，而全球性玩家则与\
    \ DHL、K&N 等大型跨国公司合作。\n\nECU 在本地和全球货代中都拥有相当的份额。鉴于全球拼箱商在网络实力（覆盖范围、统一身份）、透明度和可靠性方面的优势，他们比小型运营商更有优势；但另一方面，他们面临着能够低成本运营提供极低费率的小众运营商。\n\
    \n## 公司结构\n\n图 29 显示了 ECU 的组织结构。亚太地区（APAC）首席执行官由 Udaye Kumar Shetty 先生领导，每个国家经理向区域负责人（东南亚和北亚）汇报。在国家层面，ECU\
    \ 设有分支经理和产品经理（负责 FCL 和 LCL），他们向区域产品负责人进行虚线汇报，后者负责相应区域的战略制定和业务开发。\n\n![](img/fig29.jpg)\n\
    \n**图 29.** ECU Worldwide 组织架构\n\n货运业务中的两个主要部门是进口部和出口部，而财务、人事、行政和信息化等支持部门有助于确保运营顺畅。\n\
    \n### 进口部\n\n进口运营团队负责两个产品：LCL 和 FCL。对于 LCL 运营，团队承担以下职责：\n\n1. 接收预计拼箱集装箱的预通告文件\n\
    2. 检查文件的准确性，如有任何差异，与原地办公室协调及时纠正文件，以避免任何海关罚款和给目的地客户带来不便\n3. 直接在海关系统或通过第三方供应商提交海关舱单\n\
    4. 向收货人发布货物到货通知，以便他们及时向海关申报进口以清关货物\n5. 与集装箱堆（CFS）和承运人协调收集文件、释放货物、安排集装箱拆并将空箱还给承运人\n\
    6. 根据内部关键绩效指标（KPI）向客户开开发票并关闭案卷\n\nFCL 进口团队的流程与 LCL 进口类似，不同之处在于 FCL 客户可以选择在自己的工厂现场接收集装箱进行拆箱，并在拆完货物内容后将空箱还给承运人场，如图图\
    \ 30\n\n**图 30.** ECU Worldwide 进口 LCL 流程\n\n### 出口部\n\n与进口相比，LCL 出口运营的工作量更大。对于\
    \ LCL 出口运营，团队承担以下职责：\n\n1. 准备出口运费表并在更新系统前与销售部门共享\n2. 在系统中创建航次计划并根据要求与客户分享\n3.\
    \ 接收客户的订舱，并根据货物收货日期将货物分配给特定的航次，并相应向客户提供订舱单\n4. 与承运人及客户或客户指定的报关行协调，以：\n    a. 跟进订舱确认\n\
    \    b. 与 CFS 确认收到货物\n    c. 根据总体积安排 20 英尺或 40 英尺集装箱\n    d. 向承运人下订舱\n    e. 与承运人协调从承运人场提空箱\n\
    5. 完成集装箱装箱，并确保 CFS 在装箱期间拍摄集装箱内外的照片，以确认集装箱无损坏并确认货物在原地装状态良好\n6. 向本地和海外海关及承运人提交舱单以确保符合规定\n\
    7. 向海外办公室发送预通告并关闭案卷\n\nFCL 出口与 LCL 出口类似，发货人可以选择在自己的工厂装箱，并将装箱的集装箱直接发往港口装船，如图图 31\n\
    \n**图 31.** ECU Worldwide 出口 LCL 流程\n\n## 未来\n\nUday Shetty 致力于改进目前公司的整体运营。他希望重新设计当前的运营程序，通过公司新的信息系统使其变得更加以客户为中心。他渴望将区块链结合物联网（IoT）以转型\
    \ LCL 行业。\n\n## 建议的 LCL 业务框架\n\n根据 ECU Worldwide 的需求，提出了一个基于以下原则的新框架，并建议任何使用集装箱运输货物的海运出口商、进口商、承运人及相关方采用。\n\
    \n### 原则 1：围绕结果组织工作，而非任务\n\n使用区块链的理念是为业务带来更多便利。因此，流程不仅仅是在线传输数据至关重要。用户可以输入信息，区块链将帮助以加密记录的形式存储在公共云服务器上。\n\
    \n### 原则 2：让使用流程的人执行流程\n\n生态系统中相关的供应链伙伴可以在流程过程中将信息输入区块链系统，并由智能合约进行进行验证。\n\n###\
    \ 原则 3：在源头采集信息\n\n通过集成表单，公共信息只需填写一次并记录在区块链中。存储在区块链中的数据将供任何拥有这些数据的人使用。\n\n### 原则\
    \ 4：将顺序活动转换为并行活动\n\n所有参与方将通过区块链分布式账本技术同时接收相同的交易信息。此类信息允许各方进行并行处理，并允许通过系统协调依赖关系，确保应用程序得到及时处理。\n\
    \n"
