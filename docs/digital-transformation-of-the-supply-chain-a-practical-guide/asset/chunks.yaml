    - Standardization versus diversity: Can components of products or services be
    standardized so that they are capable of being combined together to provide products
    or services with a customer focus?

    - Case manager: Can a disaggregated collection of diverse experts be coordinated
    together?

    - Increased/decreased alternatives: Can the process be made less complex by varying
    the number of alternative inputs?

    - Early/deferred decision-making: Can process costs be reduced by changing the
    sequence of decisionmaking?


    The generated ideas are listed in [Table 12](#chapter8.xhtml#tab12).


    **Table 12.** Ideas generated for a private clinic


    | Assumptions | Challenges | Ideas |

    | :--- | :--- | :--- |

    | **WHAT Template** | | |

    | Getting cured is important to our patients | • Staying well is important to
    our patients | |

    | Getting cured quickly and with the least cost, risk, and hassle is important
    to our patients | • Establish preventive care program — new line of business |
    • Better patient education and counselling regarding treatment projects |

    | Collecting payment is important to us | • Being remunerated is important to
    us — in money? In other terms? | |

    | Continuing to exist and be of service is important to us | • What are the alternatives
    for funding? | Project for direct charges to credit cards |

    | | • Establish health care for patients | |

    | | Specialized equipment is required | | |


    | WHO Template | | |

    - A doctor is required to perform diagnosis/treatment.

    - A specialist technician is required to perform tests/scans (e.g., `X-rays`).

    - Specialized equipment is required for tests.

    - A patient must be ill before visiting the SPC.


    | WHERE Template | | |

    - A patient can only be diagnosed at the SPC.

    - A patient can only be treated at the SPC.

    - A patient must collect medication in person.


    | WHEN Template | | |

    - A patient must be diagnosed before she/he can be treated.

    - A patient must undergo initial consultation before taking tests.

    - A patient must pay for consultation/treatment before leaving the SPC.


    | WHY Template | | |

    - Patient records must be retrieved the day before to ensure availability at the
    SPC on appointment day.

