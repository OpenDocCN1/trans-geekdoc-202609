- raw: 'The proposed framework in [Figure 32](#chapter12.xhtml#fig32) shows how blockchain
    and IoT can cooperate with each other. Generally, IoT technology will help to
    track the movement of the container at all times. When it reaches a certain point,
    blockchain will record and update the activities and information in one integrated
    system. There will be only one fully integrated logistics ecosystem based on the
    blockchain. All documents and information, either public or private such as invoices,
    bills of lading, customs documentation, license, and data sheets, will be stored
    in the blockchain for all parties to access without the need for a human coordinator
    to tackle or generate the document. In addition to the above framework, the full
    shipping information in the form of documents in the process from exporting a
    cargo from a country to importing that cargo in another country will be shown
    clearly in real time to the relevant authorized person in the value chain. [Figure
    33](#chapter12.xhtml#fig33) depicts the various types of documents needed to be
    transferred according to the cargo when shipping over sea. By using blockchain
    and IoT, manual processes for all supply chain and trading partners will be minimized
    by leveraging the paperless trade blockchain network.


    ![](images/fig32.jpg)


    **Figure 32.** Framework of implementing blockchain and IoT LCL business


    ***Potential Benefits for ECU Worldwide in using the New Platform***


    Generally, when applying the convergence of IoT and blockchain system, there will
    be potential benefits in the entire ecosystem besides authenticity assurance.
    In another words, it is the improvements in each process of the supply chain that
    help every party strictly control the quality and status of their cargo on the
    journey transported by container, as shown in [Table 15](#chapter12.xhtml#tab15).


    In terms of the entities involved in a container shipment, great benefits are
    accrued to each participant by implementing a new framework. Besides the fact
    that each party is only concerned about the authenticity of cargo they want to
    export, there are other overall benefits that they will also perceive in this
    new advanced configuration.


    ***Potential Risks and Challenges in using the New Platform***


    It is true that this platform has great merits for connecting every party related
    to the container conveyance, from seller, buyer, port authorities, carrier, shipper,
    etc. This framework also provides improvement since most of the previous ones
    were designed based on a centralized framework. However, there are some challenges
    and risks with this new convergence of blockchain and IoT. Blockchain alone contains
    many difficulties in executing and operating the system. The current lack of knowledge
    of ECU staff to plan, execute, and maintain the new system, which is a combination
    of blockchain and IoT, will have its own learning curve lead time. Moreover, the
    full adoption of integrated systems still lacks standards and interoperability.
    Security is always a concern in implementing any open and sharing platform. The
    more complicated the platform is, the more easily it can be attacked. Along with
    the advancement of new technology, attackers can find gaps and cause threats to
    the system.


    ![](images/fig33.jpg)


    **Figure 33.** Detailed documentation in global trade digitization and the paperless
    trade blockchain network


    **Table 15.** Benefits of IoT and blockchain for all the stakeholders


    | **Procedure** || **Original** || **Implementing Blockchain and IoT** |


    | --- | --- | --- |


    | Intermodal transport || Issues related to delay, low-quality vehicle, and unlicensed
    logistics provider. Causing risks to cargo quality. || Provide operational planning
    and control of the transport network. For example, get access to the distributed
    system to know information on the disposition of shipments carried on trucks,
    rail, barges, etc. |


    |  || Personal digital assistant helps drivers get notifications immediately when
    the containers are available for pick up. || In case disruptions occur, all parties
    will be notified, and decisions and actions can be expedited quickly to minimize
    the impact of the disruption (reschedule the pick-up and delivery of container)
    |


    | Loading/Unloading || Labor workers have to perform loading operations manually,
    which took many hours to complete. The cargo is also not fully assured to be untouched
    and secure. || Use IoT devices to track the movement and location of the containers
    and store this information in the blockchain database. Any abnormal event will
    be triggered, and a notification will be sent to the relevant parties immediately.
    This helps to enhance yard operations and save time. |


    | Information transfer || The information from different actors in the journey
    may be inconsistent. Moreover, it takes more time to transfer information from
    one party to other. This results in the wasting of time in core container movement.
    || The information is transmitted constantly and easily across all trade partners.
    Hence, the container is quickly and accurately dispatched from shipper to the
    final consignee. |


    | Port and terminal service || Long lead time and lack of coordination in organizing
    the container. || Provide information about disposition of shipment along with
    a network of smart sensors, actuators, and wireless devices. Data centers make
    up the key infrastructure of the smart port, which allow the port authorities
    to provide essential services in a faster and more efficient manner. |


