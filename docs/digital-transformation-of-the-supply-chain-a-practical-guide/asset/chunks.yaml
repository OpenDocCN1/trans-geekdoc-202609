- raw: 'With the integrated form, common information will be filled in only once.
    Data housed within common government databases will be utilized to populate fields
    asking for standard information. Where the information requested is common across
    agencies, the data labels will be standardized where possible (for example, manager,
    key executive, authorized person, contact person, etc.). The applicant will be
    updated of changes to the application status through e-mail and/or short message
    service (SMS) alerts. Alternatively, the applicant can check the status of all
    transactions online on the OASIS website.


    *Principle 4. Put the decision point where the work is performed and build control
    in the process*


    Instead of signing and declaring the authenticity of information multiple times,
    OASIS allows the applicant to make an electronic declaration just once. This single
    declaration will be accepted by all agencies involved.


    *Principle 5. Link or convert sequential activities into parallel activities*


    All agencies involved will concurrently receive the same transaction information.
    The agencies will know which other licenses the applicant is concurrently applying
    for and the results of the relevant applications. Such information allows parallel
    processing by agencies and allows dependencies to be coordinated through OASIS.
    As OASIS works toward shortening the entire process of starting up, agencies need
    to adhere to certain levels of service standards, thus ensuring that the applications
    are processed in a timely fashion.


    *Principle 6. Look for ways to postpone the final product*


    At any point in time, the applicant has the flexibility to terminate applications
    and accept approved applications. For example, should the applicant wish to register
    the business first with the approved licenses for her/his main activity while
    waiting for some other license approvals, he is able to do so. On the other hand,
    in the event that the license is not approved, the applicant can terminate his
    business registration (within a 14-day window).


    *Principle 7. Avoid duplicating task with supply chain members*


    The applicant is able to pay for all her/his license and processing fees through
    a consolidated payment. All funds would be paid into a central account before
    being disbursed to the appropriate agencies.


    ***Phase 4: Implement the New Process***


    During implementation, internal approval processes for licenses need to be redesigned
    by each agency and streamlined to allow businesses to obtain approvals quickly.
    Standardization of forms and utilizing the strategic application of information
    and communications technology (ICT) for integration and concurrent processing
    are needed to bring about time and costs saving for businesses. The following
    steps briefly describe the new business licensing process of OASIS (shown in [Figure
    28](#chapter10.xhtml#fig28)) and how it interacts with the respective government
    agencies involved.


    1. The applicant needs to log-on to the online system to apply for one or more
    licenses to get the respective agency approvals in a single signon session.


    2. The applicant needs to complete an integrated standardized form with common
    information from common government databases populating fields asking for standard
    information.


    3. Upon completing data entry, the applicant will make an electronic declaration
    just once, which is accepted by all government agencies involved.


    4. The submitted transaction information from the applicant will be concurrently
    received by agencies involved in approving the relevance business license(s).


    5. Once an agency approves (or rejects) an application, an e-mail and/or an SMS
    will be automatically sent to inform the applicant.


    ![](images/fig28.jpg)


    **Figure 28.** The new business licensing process


    The applicant whose license(s) has been approved can then make a consolidated
    payment through the system.


    The OASIS transformation project resulted in the development and delivery of the
    OASIS portal to allow businesses to apply for licenses needed to start their businesses
    without resorting to over-the-counter (offline) means. The OASIS portal is part
    of the whole government solution to create a more pro-enterprise environment in
    Singapore, particularly for new entrepreneurs who do not have the resources and
    expertise to navigate the current licensing systems.


    ***Project Outcomes from OASIS***


    The following is a summary of key benefits realized from the implementation of
    the OASIS portal gathered by the transformation core team (MTI, Singapore, 2007):


    • *24 by 7 one-stop shop for licenses*: The OASIS portal provides a onestop licensing
    shop (‘‘many agencies, one government’’) which is convenient for business users
    to apply for new licenses and update/ renew/terminate existing licenses, and provides
    a consolidated payment mechanism. The applicant would only need to complete one
    integrated form for multiple licenses and make a one-time payment. Previously,
    applicants would need to complete one form after another at different government
    agencies, often providing the same information and making separate payments.


    • *Removal of irrelevant and obsolete licenses*: More than 260 licenses were reviewed.
    In all, about 10% of start-up licenses were removed or merged with other licenses
    or converted into once-off lifetime licenses to reduce compliance costs and burden
    to businesses. Examples of irrelevant licenses include the Hatchery and Stable
    Licenses and the license for private parking space.


    • *Faster application and processing time*: Since business license appliation
    processes were simplified, the average processing time for licenses was reduced
    from 21 days to 8 days, allowing applicants to obtain the necessary approvals
    earlier, as shown in [Table 14](#chapter10.xhtml#tab14). Applicants also experienced
    a reduction in the average time spent to apply for licenses from five hours to
    one hour or less.


    **Table 14.** Benefits to the applicants and agency after the transformation


    | **Licenses** || **Over-The-Counter** || **Online (OASIS Portal)** |


    | --- | --- | --- |


    | Incorporate a new company || Cost: US$720 to US$12,600 depending on company
    size || Cost: Flat fee of US$180 |


    |  || Processing time: 5 days || Processing time: 2 hours |


    | Application for change of use (Urban Redevelopment Authority) || Cost: US$720
    || Cost: US$480 |


    | Application for swimming pool license || Renew license annually || One-off lifetime
    registration (No need for renewal) |


    | Application for pet shop license || Processing time: 2 months || Processing
    time: 3 days |


    | Application for food shop license || Photocopy of company business profile,
    floor plan, and fire safety certificate as supporting documents || No need for
    these documents during application process |


    Managing cross-agency or supply chain projects for online e-services has never
    been easy. The OASIS project has provided valuable insights into how business
    licenses can be re-engineered in an effective manner, notwithstanding the challenges
    faced when integrating information from multiple agencies.'
