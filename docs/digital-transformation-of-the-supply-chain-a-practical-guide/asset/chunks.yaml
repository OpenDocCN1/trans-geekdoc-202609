- raw: 'While establishing the roadmap for supply chain transformation, it is important
    to keep in mind the goals that need to be realized over time, as shown in [Figure
    2](#chapter2.xhtml#fig2). Setting quantifiable goals is the first necessary step,
    and based on the stated goal and desired outcome, the company should further investigate
    the exact scope of change — what process must undergo the transformation. Finally,
    it is worth simulating how the proposed change will impact the business and compare
    the risks versus rewards of pursuing it.


    ![](images/fig2.jpg)


    **Figure 2.** Aligning goals with business impacts


    In a supply chain transformation project, there will be a number of processes
    that can be considered for redesign and upliftment towards digitalization. It
    is therefore important to select a few of these processes from the long list due
    to resource constraints. The starting point in selecting a process for improvement
    is to obtain information from stakeholders about their satisfaction or dissatisfaction
    and key business pain points with the specific supply chain processes and sub-processes
    that they are handling. Key criteria to consider in the process selection include:


    1. Importance: does the process have strategic relevance? Does it support corporate
    strategy and any of the overall critical success factors for the business? Does
    it have significant positive impact on the company’s customers or the performance
    of suppliers and channel partners? At its core, does this process potentially
    improve business performance on a periodic basis?


    2. Performance: does the process have the following performance deficiencies?


    • Repeated or frequent internal and external customer complaints


    • Extensive information exchange


    • Data redundancies across sub-processes within the process


    • Excessive hand-offs within this process or with either processes


    • Long queuing time


    • Redundant checking and control


    • Frequent rework and iteration


    • Extra complexity, frequent exceptions, and special handling needs


    3. Feasibility: is the process feasible for transformative change? Parameters
    by which we can determine feasibility include the following:


    • Manageable scope and scale


    • Affordable to change


    • Digital technologies readily available


    • Supportive management


    • Acceptable culturally


    • Viable politically


    4. Potential for new digital technology: can new technology dimensions, such as
    the below, be introduced to improve the process?


    • Cloud-based shared databases and blockchain


    • Latest-generation telecommunication networks powering Internet of things (IoT)


    • Advanced decision support tools powered by artificial intelligence or machine
    learning


    • Wireless data communication and portable computing devices as small as mobile
    phones


    • Automatic identification and tracking technology including hightech sensors


    • Geographical information systems powered by real-time connected Global Positioning
    System


    Based on past experience, the scope of the digital transformation program for
    the supply chain should be based on an organization’s capabilities, the different
    types of available resources, as well as the level of interest from suppliers,
    customers, or other partners. Even if given a clear need to transform, most organizations
    would lack sufficient resources, such as people, funds, and time, to do so. It
    is best to organize and start the overall digital supply chain transformation
    program with small projects for organizations that have not done any transformation
    before. Once people demonstrate that they can handle simple changes to processes,
    more complicated ones can be tackled subsequently. Thus, each successful initiative
    becomes a model for future efforts.


    7-Eleven ([www.7-eleven.com](http://www.7-eleven.com)) in Japan has transformed
    its supply chain to quickly respond to sudden changes in demand instead of fast
    or cheap deliveries. By investing in proprietary real-time systems for visibility
    into customer demographics, preferences, and sales at every store, the company
    is able to identify new sales opportunities and alert suppliers to potential shifts
    in requirements, to reallocate inventory among stores, and ensure that the company
    restocks at the right time. Having strong partnerships with its suppliers and
    by using a variety of transportation modes, including trucks, motorcycles, boats,
    and even helicopters, the company is able to resupply and replenish stores three
    or more times a day. This allows the company to cater to different consumer segments
    and demands at different hours, from delivering bento boxes for lunch to other
    fresh food for breakfast and dinner.


    ## **Chapter 3**


    ## **INITIATING THE DIGITAL TRANSFORMATION OF THE SUPPLY CHAIN**


    We recommend that companies must think about a digital transformation for their
    supply chain by starting with a comprehensive assessment of supply chain processes
    and the various skill sets required for key roles in the organization that would
    be required to drive this kind of initiative. The expected outcome is to recommend
    improvement opportunities and a roadmap for future investments based on extensive
    research that will improve operational efficiency and digital supply chain experience
    for individual supply chain functions, as well as stakeholders from other business
    functions who need supply chain information. Some examples of leading practices
    that are already being adopted to initiate a digital supply chain transformation
    by companies are as follows:


    • Identify opportunities and levers to optimize “spend” via strategic sourcing
    and contract management


    • Leverage subject matter experts at the supplier end. For the buying organization,
    this helps procurement managers and buyers to focus on value creation, rather
    than consuming time in mundane work.


    • Engage internal “customers” in the decision-making process


    • Identify levers for supply chain velocity improvement


    • Carry out thorough assessment for fitment of advanced digital supply chain planning
    solutions available in the market with the best in-class automation and analytics
    capabilities


    • Holistically re-engineer demand sensing and demand planning to incorporate aspects
    of all potential market dynamics and newer causes of variability


    • Establish policy and procedures so that we can enable suppliermanaged inventory


    • Define and execute centralized inventory management processes for enterprise-wide
    visibility


    • Constantly review inventory policy and parameters, leveraging a digital twin
    that can do this much more frequently


    Companies looking to execute this kind of assessment as the right process foundation
    for a digital supply chain transformation must leverage a holistic framework approach,
    focusing on supply chain maturity assessment covering end to end supply chain
    planning, sourcing to contracting to operational procurement, collaboration with
    all supply chain partners, and end to end logistics comprising warehousing and
    transportation. This approach to supply chain performance assessment would run
    over three stages:


    Stage 1: Supply chain process evaluation


    Focused on evaluating existing processes, the integration of supply chain functions,
    roles, and responsibilities, and alignment with strategic goals.


    Stage 2: Exploring emerging technology for breakthrough performance Focused on
    evaluating the usage of existing applications’ capabilities and what best can
    be done by enhancing them to meet the desired outcomes.


    Stage 3: Digital transformation of the supply chain


    Focused on assessing the various technologies and applications that currently
    exist and are planned in the digital strategy roadmap, and what further actions
    need to be taken to become among the leaders in the industry for supply chain
    excellence.


