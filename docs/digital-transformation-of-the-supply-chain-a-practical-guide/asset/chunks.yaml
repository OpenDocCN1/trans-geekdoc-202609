- raw: "• Degree of flexibility, responsiveness, or customization required\n\n• Minimum\
    \ quality or standards of the product/service that the customer is willing to\
    \ accept (and hence the price that the customer is willing to pay for it)\n\n\
    • The urgency with which the customer views the completion of the service or delivery\
    \ of the product. This would be measured in terms of the lead time that the customer\
    \ is able to agree to for the selling company to commit to for delivering the\
    \ service or product\n\n• The quantity of the product demanded or volume of work\
    \ generated by the customer’s needs\n\n• The location at which the service is\
    \ to be performed or delivery of products is to be made\n\nThese differences may\
    \ give rise to the need for:\n\n• Staff with different levels of skill or knowledge\
    \ to handle different customer groups\n\n• The speed with which certain tasks\
    \ need to be undertaken or priority/ attention given\n\n• The familiarity of staff\
    \ with specific customers and their needs and the amount of initiative required\
    \ of staff\n\n• The ability to handle variable workloads, and hence perform load\
    \ balancing and resource scheduling (e.g. some segments might provide a steady\
    \ stream of work, while others might be “lumpy” or show seasonality)\n\n• Performing\
    \ certain tasks or taking certain measures for some customer groups (and not others)\n\
    \n• Selecting different quality versus productivity or cost trade-off combinations\
    \ for different customer segments.\n\nThe contribution of each segment to total\
    \ profitability (or other appropriate measures of gain to the organization or\
    \ its mission) should be determined. This should guide the amount of resources\
    \ to be committed in serving each customer segment.\n\n![](images/fig6.jpg)\n\n\
    **Figure 6.** Customize process for each customer segment\n\nSegmentation may\
    \ eventually imply exceptional tasks or specialized staff to handle certain customer\
    \ segments or a process with multiple channels at some points. In the extreme\
    \ case, completely separate (duplicated) process streams may need to be established\
    \ to handle each segment. By referring to [Figure 6](#chapter5.xhtml#fig6), we\
    \ can offer personalized services to highly profitable customers, while we can\
    \ advise non-profitable customers to use online banking to reduce the cost to\
    \ serve them. The marginally profitable customers can still make use of the automated\
    \ teller machine or the bank teller, which provide some form of assistance for\
    \ them.\n\nStandardization promotes productivity and cost efficiency. Having differences\
    \ in customer segments tends to work against standardization, and hence productivity\
    \ and cost efficiency. This will have to be weighed against the gains expected\
    \ in better satisfying the needs of each customer group.\n\nA performance evaluation\
    \ matrix is a convenient tool to evaluate the importance of each customer’s needs\
    \ versus the performance of the current process, as shown in [Figure 7](#chapter5.xhtml#fig7).\n\
    \n![](images/fig7.jpg)\n\n**Figure 7.** Matrix of customer importance versus process\
    \ performance\n\nThe use of such a matrix may help to avoid the common problem\
    \ of continuing to improve in areas that a company is already strong in, or to\
    \ prevent working on something that is not important to the customer. Improvement\
    \ should focus on quadrant A where the customer’s need is important, but the current\
