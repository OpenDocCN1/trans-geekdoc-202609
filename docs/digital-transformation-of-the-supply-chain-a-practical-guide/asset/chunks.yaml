    *Time analysis for original process*


    Time taken to collect, repair, and return to customers was too long. Customers
    expect shorter duration regardless of location.


    • Time taken to collect, repair, and return the defective equipment to customers
    in Bangkok was taking about 6 to 11 days


    • Time taken to collect, repair, and return the defective equipment to customers
    in other provinces would take about 12 to 40 days


    *Cost analysis for original process*


    Customers are not willing to pay for the transport cost from the service center
    back to their home. Neither are they willing to pay to collect it from the service
    center themselves.


    • Cost to collect the defective equipment from the customer and deliver it to
    the service center is US$0.20 to US$0.79 using the company’s own truck and US$0.75
    to US$1.75 using a third-party truck


    • Cost to deliver the repaired equipment back to the customer is US$0.20 to US$0.79
    using the company’s own truck and US$2.50 to US$3.75 using the National Postal
    Service


    *Quality analysis for current process*


    Customers complained about the poor level of service using the centralized service
    center. Sometimes the repair quality gets affected during transportation from
    centralized service center. The turnaround time is long and customers are not
    willing to collect the equipment after it has been repaired.


    ***Phase 2: Challenge Assumptions to Generate Ideas***


    | **Organization** |


    | --- |


    | **Assumptions** || **Challenges** || **Ideas** |


    | Defective equipment are cheaper to repair than replace || Some of the equipment
    are cheaper to be replaced || Replace obsolete equipment with new models |


    | Centralized service center will save repair costs || Transportation cost can
    increase the overall repair cost || Explore decentralized service center |


    | Centralized service center will have all the necessary equipment || Some tests
    can be performed with commonly available equipment || Explore decentralized service
    center for those tests |


    | It is cheaper to outsource transportation to third party || Transportation providers
    charge much more than the cost to use in-house trucking || Consider buying a fleet
    of trucks for better control |


    | **Customer** |


    | --- |


    | **Assumptions** || **Challenges** || **Ideas** |


    | Customers are willing to pay for transporting their equipment back to their
    home || Customers expect the company to send the equipment back to them for free
    || Customers can pick up the equipment from a nearby store |


    | Customers are willing to collect the equipment from the service center || Customers
    expect the company to deliver the equipment back to them || Customers can pick
    up the equipment from a nearby store or 7-Eleven convenience store |


    | Customers are willing to wait two to three weeks for the equipment to be repaired
    || Customers expect faster turnaround time to repair their equipment || Improve
    the repair process |


    | Equipment belonging to customers outside Bangkok take a longer time to be repaired
    || All customers expect their equipment to be repaired as soon as possible regardless
    of location || Treat all customers the same regardless of location |


    ![](images/fig22.jpg)


    **Figure 22.** Redefined process with self-drop and pickup by customer


    ***Phase 3: Process Selection and Transformation***


    In order to improve efficiency of the manufacturer’s reverse logistics channel,
