  trans: '


    图 32 中提出的框架展示了区块链与物联网如何相互协作。通常，物联网技术将帮助随时跟踪容器的移动。当到达某个特定点时，`blockchain`将在一个集成系统中记录并更新活动和信息。届将仅存在一个基于`blockchain`的完全集成的物流生态系统。所有文档和信息（无论是公开的还是私有的，如发票、运单、海关文件、许可证和数据表）都将存储在`blockchain`中，供所有方访问，而无需人工协调员来处理或生成文档。除了上述框架外，从一个国家出口货物到另一个国家进口该货物的过程中以文档形式显示的完整货运信息，将实时清晰地向价值链中的相关授权人员展示。图
    33 描绘了海运时根据货物类型需要传输的各种类型文档。通过使用`blockchain`和`IoT`，可以利用无纸化贸易区块链网络，最大限度地减少所有供应链和贸易伙伴的人工流程。


    ![](img/fig32.jpg)


    **图 32.**** 实施区块链和物联网的 LCL 业务框架


    ### ECU Worldwide 使用新平台的潜在收益


    通常情况下，在应用`IoT`和`blockchain`系统的融合时，除了真实性保证外，整个生态系统中都存在潜在的效益。换句话说，供应链每个环节的改进有助于每方严格控制其货物在集装箱运输途中的质量和状态，如表
    15 所示。


    在集装箱运输涉及的实体方面，实施新框架将为每个参与者带来巨大的收益。除了每个方只关心其想要出口的物的真实性外，他们还会在这种新的先进配置中感知到其他整体收益。


    ### 使用新平台的潜在风险与挑战


    确实，该平台对于连接与集装箱运输的所有方（从卖家、买家、港口当局、运人、发货人等）具有巨大的优点。该框架也提供了改进，因为之前的大多数框架都是基于集中化框架设计的。然而，`blockchain`和`IoT`的新融合存在一些挑战和风险。单区块链本身在执行和操作系统方面存在许多困难。目前
    ECU 员工缺乏计划、执行和维护这种结合了`blockchain`和`IoT`的新系统的知识，这将带来自身的学习曲线周期。此外，集成系统的全面采用仍然缺乏标准和互操作性。在实施任何开放和共享平台时，安全性始终是一个问题。平台越复杂，越容易受到攻击。随着新技术的进步，攻击者可以发现漏洞并对系统造成威胁。


    ![](img/fig33.jpg)


    **图 33.** 全球贸易数字化的详细文档和无纸化贸易区块链网络


    **表 15.** 物联网和区块链对所有利益相关者的收益


    | **流程** | **原始** | **实施区块链和物联网** |


    | --- | --- | --- |

    | 多式联运 | 与延迟、低质量车辆和无证照物流提供商有关的问题。对货物质量造成风险。 | 提供运输网络的运营规划和控制。例如，访问分布式系统以获取有关卡车、铁路、驳船等承运货物处置情况的信息。
    |

    | | | 个人数字助理帮助驾驶员在集装箱可以进行提货时立即收到通知。 | 如果发生中断，所有方都将收到通知，并可以迅速采取决策和行动，以最大限度地减少中断的影响（重新安排集装箱的提货和交付）。
    |

    | 装卸货 | 工人必须手动执行装卸操作，这需要几个小时才能完成。货物也无法完全保证未触碰且安全。 | 使用`IoT`设备跟踪集装箱的移动和位置，并将这些信息存储在`blockchain`数据库中。任何异常事件都会触发，并立即向相关方发送通知。这有助于增强堆场作业并节省时间。
    |

    | 信息传输 | 途中不同参与者的信息可能不一致。此外，从一方传输信息到另一方需要更多时间。这导致核心集装箱移动中的时间浪费。 | 信息在所有贸易伙伴之间不断且地传输。因此，集装箱从发货人快速准确地发往最终收货人。
    |

    | 港口和码头服务 | 组织集装箱周期长且缺乏协调。 | 通过智能传感器、执行器和无线设备网络提供货物处置信息。数据中心构成智能港的关键基础设施，使港口能够以更快、更高效的方式提供基本服务。
    |


