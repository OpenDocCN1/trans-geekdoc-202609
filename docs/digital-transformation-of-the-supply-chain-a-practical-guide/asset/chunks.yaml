    \nDesk Editor: Lai Ann\n\nTypeset by Stallion Press\n\nEmail: [enquiries@stallionpress.com](mailto://enquiries@stallionpress.com)\n\
    \nPrinted in Singapore\n\nThis book unravels the complexities of supply chain\
    \ process transformation by explaining step by step, and in simple terms, what\
    \ are the requirements for success right from the basics to how to implement this\
    \ complicated task. The book provides insights into how to lead the transformation\
    \ project and how to manage the change internally and externally. The authors’\
    \ hands-on experience in the field via applied research is clearly illustrated\
    \ in the case studies which provide the reader with practical examples of the\
    \ challenges and benefits of implementing a supply chain transformation project.\
    \ A must-have book for all supply chain professionals.\n\n**Professor Cedwyn Fernandes**\
    \  \n\nPro-Vice Chancellor, Middlesex University, Dubai\n\nSupply chain process\
    \ transformation has become an essential part of competition in the global economy.\
    \ This book provides an insightful approach on this re-engineering process based\
    \ on solid research and practical examples. We have learned and applied some of\
    \ the concepts to streamline our processes.\n\n**Mr. Teh Wee Chye**  \n\nManaging\
    \ Director, Malayan Flour Mills Bhd, Malaysia\n\nSuccessful companies deliver\
    \ the right product to the right customer at the right time and at the right price.\
    \ This book provides a concise and clear explanation on the art of transformation\
    \ towards enabling a Digital Supply chain. It challenges you on the old ways of\
    \ doing thing in the supply chain and helps you to transform your supply chain\
    \ for profitability and sustainability.\n\n**Mr. Hsiao Chink Tang**  \n\nSenior\
    \ Economist, East Asia Department, Asian Development Bank, Philippines\n\nSupply\
    \ chain management in a company should no longer be relegated to a select group\
    \ of people sitting in a logistics department. It is a cross-functional issue.\
    \ Much like how companies nowadays thrust sales responsibilities to every employee,\
    \ every division plays a key role in a supply chain process, like links in a complex\
    \ chain of behaviours. The challenge is to change the mindset or culture of a\
    \ company’s employees from a silo, ‘us versus them’ mentality, to one of true\
    \ team work. This book is an essential ‘How To’ guide to supply chain process\
    \ transformation and should be seen as the guide to any company wanting to stay\
    \ ahead of the competition.\n\n**Mr. Raymond Yee**  \n\nVice President of Customs\
    \ & Regulatory Affairs, DHL Express Singapore Pte Ltd, Singapore\n\n## **PROLOGUE**\n\
    \nThrough the last few decades, latest technologies have improved processes within\
    \ the four walls of a business, e-commerce has helped bridge communications between\
    \ businesses and suppliers, and other supply chain systems are moving products\
    \ to the market faster and more efficiently than ever. But the evolution hasn’t\
    \ stopped there. Today, supply chain digitalization is ushering in a whole new\
    \ business model, one where real-time connectivity, greater visibility, real-time\
    \ responsiveness, and anticipation will become the underlying characteristics\
    \ of our businesses. But it won’t happen overnight. It’s up to businesses to build\
    \ upon the incremental advancements offered by past solutions while working towards\
    \ a networked, digitally connected future.\n\nCompanies, and by extension their\
    \ supply chains, need to embark on a path down the digital road. It’s not a simple\
    \ or straightforward journey. Nor is it the same for every business. But it’s\
    \ a journey worth taking — not only for the sake of an end goal, but for all the\
    \ benefits that come along the way. And while there’s no single path to success,\
    \ there are several shared traits among the leaders, no matter which industry\
    \ they represent. From these examples, we begin to see specific digital building\
    \ blocks, either technologies or processes, that comprise the foundation of a\
    \ successful digital transformation. This book is an attempt to bring together\
    \ new insights into how to lead a digital supply chain transformation project\
    \ and how to manage the change internally and externally.\n\n## **CONTENTS**\n\
    \n[*Prologue*](#prologue.xhtml)\n\n[Chapter 1 Relevance of Digital Transformation\
    \ for Supply Chains](#chapter1.xhtml)\n\n[Chapter 2 Identifying Processes for\
    \ the Digital Transformation of the Supply Chain](#chapter2.xhtml)\n\n[Chapter\
    \ 3 Initiating the Digital Transformation of the Supply Chain](#chapter3.xhtml)\n\
    \n[Chapter 4 Establishing Organization and People Readiness](#chapter4.xhtml)\n\
    \n[Chapter 5 Supply Chain Process Assessment for Digital Transformation](#chapter5.xhtml)\n\
    \n[Chapter 6 Supply Chain Process Redesign for Digital Transformation](#chapter6.xhtml)\n\
    \n[Chapter 7 Implementing the Digital Supply Chain Transformation](#chapter7.xhtml)\n\
    \n[Chapter 8 Supply Chain Transformations in the Healthcare Industry](#chapter8.xhtml)\n\
    \n[Chapter 9 Managing Process Change with Supply Chain Partners](#chapter9.xhtml)\n\
    \n[Chapter 10 Success Story in Business Licensing Transformation](#chapter10.xhtml)\n\
    \n[Chapter 11 Criteria for Success in Digital Supply Chain Transformation](#chapter11.xhtml)\n\
    \n[Chapter 12 Success Story in Digital Supply Chain Transformation Success Story\
    \ in Digital Supply Chain Transformation](#chapter11.xhtml)\n\n[*Appendices*](#appendices.xhtml)\n\
    \n[*Glossary*](#glossary.xhtml)\n\n[*Bibliography*](#bibliography.xhtml)\n\n[*About\
    \ the Authors*](#author.xhtml)\n\n## **Chapter 1**\n\n## **RELEVANCE OF DIGITAL\
    \ TRANSFORMATION FOR SUPPLY CHAINS**"
