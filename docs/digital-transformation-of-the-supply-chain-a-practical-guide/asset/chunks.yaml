  trans: "\n\n一个用于说明的简单评估测试的例子是自动取款机（ATM）技术为客户提供服务的情况。最初面临的问题是如何能够随时为客户提供服务，而 ATM\
    \ 使在办公时间之外为客户提供服务成为可能。需要解决以证明该技术合理性的一些问题包括：现金补给处理需要多少人力？利用 ATM 所获得的财务利润是多少？采用\
    \ ATM 服务所期望获得的资金增长和客户群增加的目标，设定为数值形式是多少？实际有多少潜在客户希望在办公时间之外进行交易？客户 ATM 卡的库存管理情况如何？\n\
    \n通过提出这些关键问题，应用 ATM 技术的影响变得更加清晰，例如，为客户提供的取款便利是否与银行流动性和第三方资金相关的任何潜在问题相冲突。当所有这些问题都得到解答后，结果将明确表明目前是否真的需要应用\
    \ ATM 来支持新流程，或者应考虑其他替代方案。\n\n# 第 8 章\n\n# 医疗保健行业中的供应链转型\n\n在本章中，我们将讨论两个独特的案例研究，均涉及医疗保健行业。以下第一个案例研究重点关注业务流程分析和再设计作为任何面向更大供应链转型的数字化举措的前奏的高度战略重要性。\n\
    \n## 案例研究 1：医疗设备公司逆向物流运营的转型\n\n该项目涉及一家位于曼谷的工厂，其产品通过位于曼谷的中央配送中心进行分销。客户订单的履行基于客户的地理位置。对于曼谷的客户，公司将使用自己的卡车将订单交付给零售商。对于其他省份的客户，所选运输方式将取决于订单量。如果订单量足够大，可装满一整车（FTL），公司将使用自己的卡车交付订单。然而，如果订单小于整车装载量（LTL），则将使用第三方运输服务提供商交付订单。交付的交货时间取决于卡车路线、调度、可用性以及最终目的地。\n\
    \n客户可以使用公司的逆向物流渠道维修其产品。然而，客户将被要求将产品送至位于曼谷的主服务中心进行维修。区域服务中心和零售商仅能够作为将产品送回曼谷中心的集结点使用。另一个困难是返回曼谷服务中心的频率低且缺乏卡车。这些问题导致在对故障产品进行任何维修之前存在很长的交货时间。流程图（见\
    \ 图 21）描述了原始逆向物流流程的泳道图。\n\n在原始逆向物流渠道结构下，公司收到了许多关于维修服务交货时间的投诉，这是由长时间的等待时间造成的。另一个问题是往返制造商的运输成本，这被视为公司及其客户的负担。公司为第三方运输服务提供商支付将产品从零售商返回其服务中心的费用是正常做法。客户还必须承担从曼谷服务中心到其住所的运费，因为制造商不支付这些费用。客户唯一的解决方案是自行到曼谷服务中心提货。曼谷、其他省份满载以及不满载卡车运输的退货交货时间比较可在\
    \ 表 7 中看到。\n\n![](img/fig21.jpg)\n\n**图 21.** 原始流程图\n\n**表 7.** 曼谷及曼谷以外地区退货交货时间比较\n\
    \n![](img/tab7.jpg)\n\n在这家公司中，唯一可以量化的成本差异是公司主要产品的运输成本：实验室设备和心电图（ECG）设备。由公司自己的卡车将这两种产品运回位于曼谷的中央服务中心的运输成本分别为每箱\
    \ 0.20 美元和 0.79 美元，如果涉及第三方服务提供商，则分别为每箱 0.75 美元和 1.75 美元。此外，将维修后的产品退回给客户的运费分别为每箱\
    \ 2.50 美元和 3.75 美元。退货通常通过国家邮政服务发送。表 8 提供了与退回物品运输相关的年度成本比较。\n\n公司已设立中央服务中心以支持退回产品以保持成本低廉。然而，中央服务中心最常被引用的问题是客户服务水平相对较差。为了应对退货的不确定性并提供良好的客户服务，一些公司试图在客户服务成本不断增加的背景下提高其响应客户需求的能力、灵活性和敏捷性。一种方法是设立靠近客户的服务中心，而不是靠近主要工厂或主要配送中心，这可以帮助最大限度地减少客户在时间和成本方面的不便，以便获得售后或维修服务。然而，这将增加其逆向物流成本。采用了三阶段方法来定义所需的供应链流程转型。\n\
    \n**表 8.** 基于现有逆向物流流程的年度运输成本\n\n| **项目** || **实验室设备** || **ECG 设备** ||  |\n| ---\
    \ | --- | --- | --- |\n| 每年销售的产品数量 || 300,000 || 10,000 ||  |\n| 平均返回并在服务店维修的产品数量\
    \ || N/A || N/A ||  |\n| 平均返回服务中心的产品数量 || 10,000 || 300 ||  |\n| — 经客户 || 1,000\
    \ || 30 ||  |\n| — 经公司自有卡车 || 7,000 || 210 ||  |\n| — 经运输服务提供商 || 2,000 || 60\
    \ ||  |\n| — 使用公司自有卡车的成本 || 每箱 US$0.20 || 每箱 US$0.79 ||  |\n| 运输服务提供商收取的费用 ||\
    \ 每箱 US$0.75 || 每箱 US$1.75 ||  |\n| 产品返回服务中心的总成本 || US$2,900 || US$271 ||  |\n\
    | **小计** || **US$3,171** || **US$3,171** ||  |\n| 平均维修后产品退回客户的数量 || 10,000 ||\
    \ 300 ||  |\n| — 经客户在服务店自提 || N/A || N/A ||  |\n| — 经客户在服务中心自提 || 1,000 || 30\
    \ ||  |\n| — 经国家邮政服务发货 || 9,000 || 270 ||  |\n| 国家邮政服务收取的费用（运费代收） || 每箱 US$2.50\
    \ || 每箱 US$3.75 ||  |\n| 从服务中心运往服务店的维修产品数量 || N/A || N/A ||  |\n| 使用公司自有卡车的成本\
    \ || 每箱 US$0.20 || 每箱 US$0.79 ||  |\n| 产品退回客户的总成本 || US$22,500 || US$1,013 ||\
    \  |\n| **小计** || **US$23,513** ||  ||  |\n| **逆向物流流程中的年度运输总成本** || **US$26,684**\
    \ ||  ||  |\n\n### 阶段 1：项目启动\n\n| 愿景 || 售后服务的高度响应式逆向物流中心 |\n| --- | --- |\n| 目标\
    \ || 在不增加逆向物流成本的情况下缩短响应时间 |\n| 目标 || • 将响应时间减少 70%  \n• 将运营成本减少 50% |\n\n"
