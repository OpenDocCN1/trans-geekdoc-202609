    ## 原始流程的时间分析


    收集、维修并返还给客户所需的时间过长。客户期望无论地点如何，耗时都更短。


    • 收集、维修并将缺陷设备返还给曼谷客户所需的时间约为 6 至 11 天


    • 收集、维修并将缺陷设备返还给其他省份客户所需的时间约为 12 至 40 天


    ## 原始流程的成本分析


    客户不愿意为从服务中心运回家的运输费用买单。他们也不愿意自己从服务中心取回设备。


    • 使用公司自有卡车从客户处收集缺陷设备并运送到服务中心的成本为 0.20 至 0.79 美元，使用第三方卡车则为 0.75 至 1.75 美元


    • 使用公司自有卡车将维修好的设备送回客户的成本为 0.20 至 0.79 美元，使用国家邮政服务则为 2.50 至 3.75 美元


    ## 当前流程的质量分析


    客户抱怨使用集中式服务中心提供的服务水平较差。有时在从集中式服务中心运输过程中维修质量会受到影响。周转时间很长，客户不愿意在维修后自行取回设备。


    ### 第二阶段：挑战假设以产生创意


    | **组织** |


    | --- |


    | **假设** || **挑战** || **创意** |


    | 缺陷设备维修比更换便宜 || 其中一些设备更换更便宜 || 用新型号更换过时设备 |


    | 集中式服务中心将节省维修成本 || 运输成本可能增加整体维修成本 || 探索分散式服务中心 |


    | 集中式服务中心将拥有所有必要的设备 || 一些测试可以用常见设备进行 || 探索对这些测试采用分散式服务中心 |


    | 外包运输给第三方更便宜 || 运输提供商收取的费用远高于使用内部卡车的成本 || 考虑购买卡车车队以获得更好的控制 |


    | **客户** |


    | --- |


    | **假设** || **挑战** || **创意** |


    | 客户愿意为将设备运回家的运输费用买单 || 客户期望公司免费将设备寄回给他们 || 客户可以从附近商店取回设备 |


    | 客户愿意从服务中心取回设备 || 客户期望公司将设备送回给他们 || 客户可以从附近商店或 7-Eleven 便利店取回设备 |


    | 客户愿意等待两到三周维修设备 || 客户期望更快的设备维修周转时间 || 改进维修流程 |


    | 曼谷以外客户的设备维修时间更长 || 所有客户都期望无论地点如何都能尽快维修设备 || 无论客户地点如何，都一视同仁 |


    ![](img/fig22.jpg)


    **图 22.** 客户自行投递和取件的重新定义流程


    ### 第三阶段：流程选择和转型


    为了提高制造商逆向物流渠道的效率，提出了如 图 22 和 23 所示的重新定义流程。在未来的逆向物流流程下，制造商在所有零售商门店设立服务店。这些服务店作为客户需求波动的解耦点。结合服务店的设立，还提出建立区块链系统以跟踪所有信息更新，例如每个备件的总需求和库存水平以及每个服务店的库存水平、订单数量和到达提前期等。


    ![](img/fig23.jpg)


    **图 23.** 重新定义流程，采用公司配送


    **表 9.** 再造对逆向物流流程的影响


    |  || **逆向物流流程** |


    | --- | --- |


    | **项目** || **现状** || **未来** |


    | 退回产品的年度运输成本 || 26,684 美元 || 224 美元 |


    | 客户满意度 || 低 || 高 |


    | 对客户需求的响应能力 || 低 || 高 |


    | 产品维修提前期（95% 案例） || 6 至 40 天 || 1 天 |


    在重新定义的逆向物流流程中，95% 的退回产品在服务店进行维修，从而消除了大部分运输。其余退回物品如果被视为困难案例且提前期不太关键，则会送至曼谷的中央服务中心。表
    9 说明了将再造应用于逆向物流流程的影响。


    未来的逆向物流流程将有助于缓解现有问题，例如维修提前期过长。在大多数情况下，退回产品可在服务店维修。这将导致提前期和等待时间减少，如 表 10 所示。


    **表 10.** 再造前后提前期比较


    ![](img/tab10.jpg)


    与当前流程相比，新流程能够节省超过 65% 的成本，并将提前期从 6 至 40 天缩短至 1 至 3 天。


    总之，数字转型供应链流程评估应确保项目核心团队已汇总来自文件审查、详细流程分析和利益相关者讨论的结构化信息和发现。我们已通过与行业领先实践进行基准比较，确定了流程改进机会领域。通过一系列头脑风暴会议，我们制定并创建了通过数字化杠杆赋能的流程改进假设。这些假设已根据量化的潜在业务收益进行排序和优先处理。


    现在我们来看另一个案例研究，其中纳入了更多数字供应链转型（DSCT）方面。不同公司的数字供应链转型团队鼓励对前一个案例研究和以下案例研究进行比较练习。前一个案例研究在供应链流程分析、基准测试和再设计概念方面更为详细。前面章节讨论的一些原则可以很好地付诸实践。当组织中的
    DSCT 团队阅读下一个案例研究时，他们可以尝试将前一个案例中应用的原则应用于此案例，反之亦然。


    ## 案例研究 2：专科诊所门诊运营转型


    新加坡一家专科私立诊所（SPC）致力于转型其门诊流程，以最大限度地减少患者的等待时间。此前，SPC 的患者需要在同一医院为不同服务在不同柜台办理登记。即使患者已与专科医生预约，她/他可能仍需先进行
    X 光检查。因此，她/他必须前往 X 光室、登记并等待轮到自己。这至少需要 30 分钟。拍摄完 X 光片后，她/他需要携带结果并等待轮到看医生。这又需要 30
    分钟。看完医生后，她/他将支付咨询费并在必要时预约下次就诊。然后她/他将携带医生的处方并交给药房取药。她/他最终在医院花费半天时间，如 图 24 所示。


    ![](img/fig24.jpg)


    **图 24.** 专科私立诊所的原始流程图


    ### 目标设定和目标


