    通过集成表单，通用信息仅需填写一次。存储在政府公共数据库中的数据将用于填充要求标准信息的字段。对于在各机构间通用的请求信息，其数据标签将尽可能实现标准化（例如：`manager`、`key
    executive`、`authorized person`、`contact person` 等）。申请人将通过电子邮件和/或短信服务（`SMS`）接收申请状态变更的通知。或者，申请人也可以在
    `OASIS` 网站上查看所有交易的状态。


    ### 原则 4：将决策点置于工作执行地，并在过程中建立控制


    与其多次签署和声明信息的真实性，`OASIS` 允许申请人仅需一次电子声明。这一单一声明将获得所有相关机构的认可。


    ### 原则 5：将顺序活动串联或转换为并行活动


    所有相关机构将同时接收相同的交易信息。各机构将知晓申请人同时申请的其他执照以及相关申请的结果。此类信息允许机构进行并行处理，并允许通过 `OASIS` 协调依赖关系。由于
    `OASIS` 致力于缩短整个创业流程，各机构需要遵守某些水平的服务标准，从而确保申请得到及时处理。


    ### 原则 6：寻找推迟最终产品的方法


    在任何时间点，申请人都有灵活地终止申请和接受已批准的申请。例如，如果申请人希望在等待其他执照审批的同时，先根据已批准的主营活动执照注册业务，他们可以这样做。另一方面，如果执照未获批准，申请人可以终止其业务注册（在
    14 天窗口期内）。


    ### 原则 7：避免与供应链成员重复任务


    申请人能够通过统一支付支付所有的执照费和处理费。所有资金将先汇入中央账户，然后分发给相应的机构。


    ### 阶段 4：实施新流程


    在实施期间，各机构需要对执照的内部审批流程进行重新设计并精简，以便企业能够快速获得审批。表单标准化以及战略性地利用信息技术（`ICT`）进行集成和并行处理，有助于为企业节省时间和成本。以下步骤简要描述了
    `OASIS` 的新业务许可流程（如图 28 所示）以及它如何与相关的政府机构进行交互。


    1. 申请人需要登录在线系统，在单次登录会话中申请一个或多个执照，以获得相应机构的批准。

    2. 申请人需要完成一份集成标准化表单，来自政府公共数据库的通用信息将填充要求标准信息的字段。

    3. 完成数据输入后，申请人仅需进行一次电子声明，该声明将被所有相关的政府机构所接受。

    4. 申请人提交的交易信息将被批准相关业务执照的机构同时接收。

    5. 一旦机构批准（或拒绝）申请，系统将自动发送电子邮件和/或 `SMS` 通知申请人。


    ![](img/fig28.jpg)


    **图 28。** 新的业务许可流程


    执照获得批准的申请人随后可以通过系统进行统一支付。


    `OASIS` 转型项目实现了 `OASIS` 门户的开发与交付，允许企业无需通过柜台（线下）方式即可申请创业所需的执照。`OASIS` 门户是整个政府解决方案的一部分，旨在为新加坡创造一个更亲企业的环境，特别是对于那些没有资源和专业知识应对当前执照体系的新创业者。


    ### OASIS 项目成果


    以下是转型核心团队（MTI，新加坡，2007 年）收集的实施 `OASIS` 门户后实现的关键效益总结：


    - **24/7 一站式执照服务**：`OASIS` 门户提供了一站式执照服务（“多个机构，一个政府”），方便企业用户申请新执照以及更新/续期/终止现有执照，并提供了统一支付机制。申请人只需为多个执照填写一份集成表单并进行一次性付款。此前，申请人需要在不同的政府机构逐一个地填写表单，通常需要提供相同的信息并分别付费。

    - **消除无关和过时的执照**：审查了 260 多种执照。总计约 10% 的创业执照被删除或与其他执照合并，或转换为一次性的终身执照，以减少企业的合规成本和负担。无关执照的示例包括
    `Hatchery`（孵场）、`Stable Licenses`（马场）以及私人停车位执照。

    - **更快的申请和处理时间**：由于业务执照申请流程的简化，执照的平均处理时间从 21 天缩短到 8 天，允许申请人更早获得必要的批准，如表 14 所示。申请人申请执照的平均时间从五个小时减少到一小时或更短。


    **表 14。** 转型后申请人和机构获得的收益


    | **执照类型** | **柜台办理** | **在线 (OASIS 门户)** |

    | --- | --- | --- |

    | 注册新公司 | 费用：根据公司大小为 US$720 至 US$12,600 | 费用：固定费用 US$180 |

    | | 处理时间：5 天 | 处理时间：2 小时 |

    | 用途申请（市区重建局） | 费用：US$720 | 费用：US$480 |

    | 游泳池执照申请 | 每年续期 | 一次终身注册（无需续期） |

    | 宠物店执照申请 | 处理时间：2 个月 | 处理时间：3 天 |

    | 食品店执照申请 | 证明材料包括公司业务概况复印件、平面图和消防安全证明 | 申请过程中无需这些文件 |


    管理用于在线服务的跨机构或供应链项目从未如此易。。尽管在整合来自多个机构的信息时面临挑战，`OASIS` 项目为如何有效地重新工程业务执照提供了宝贵的见解。

