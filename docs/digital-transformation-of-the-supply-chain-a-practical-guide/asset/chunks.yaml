  fmt: "\nThe CEO of the SPC initiated this transformation project with the following\
    \ goals and objectives to enhance its services.\n\nThe goal was to design an outpatient\
    \ process that identifies new outcomes for quality care, patient services, and\
    \ patient satisfaction. To meet the goal, the following objectives were suggested:\n\
    \n• Radically simplify and streamline functions and processes\n• Eliminate routine\
    \ patient queuing\n• Improve overall experience when visiting the SPC\n\nA project\
    \ team was handpicked by the CEO for this project, consisting of doctors, nurses,\
    \ and information technology (IT) and related support staff.\n\n## Assumption\
    \ Surfacing\n\nAt first sight, it seems easy to say that one will use the customer’s\
    \ needs as a benchmark when deciding what changes to make. But, who is the customer;\
    \ and are the assumptions made about what the customer wants or needs reasonable?\
    \ The perceived customer is not necessarily coincident with the real customer.\
    \ It is likely that there will be many stakeholders involved and the most important\
    \ stakeholder is not necessarily the ultimate customer.\n\nThe staff started identification\
    \ of stakeholders and the surfacing of assumptions. Assumptions tend to persist\
    \ long after they are no longer true and are “invisible” unless a deliberate attempt\
    \ is made to identify and examine them. Outdated assumptions are a major obstacle\
    \ to making radical changes to the old process. The SPC staff made use of simple\
    \ templates in surfacing assumptions as shown in the following tables.\n\n| WHAT\
    \ Template |\n| --- |\n| Getting cured is important to our patients |\n| Collecting\
    \ payment is important to us |\n| Specialized equipment is required for lab tests\
    \ |\n| WHO Template |\n| --- |\n| A doctor is required to perform diagnosis/prescribe\
    \ treatment |\n| A patient must be ill before visiting the SPC |\n| A patient\
    \ must move from one test station to another |\n| WHERE Template |\n| --- |\n\
    | A patient can only be diagnosed at the SPC |\n| A patient must collect medication\
    \ in person |\n| A doctor must be at the SPC to perform diagnosis/treatment |\n\
    | WHEN Template |\n| --- |\n| A patient must be diagnosed before he can be treated\
    \ |\n| A patient must undergo initial consultation before taking tests |\n| A\
    \ patient must pay for consultation/treatment before leaving the SPC |\n| WHY\
    \ Template |\n| --- |\n| A patient must undergo tests in order to determine his\
    \ condition |\n| A patient’s condition must be known in order to give him treatment\
    \ |\n| Initial consultation is required to determine what tests are appropriate\
    \ |\n| HOW Template |\n| --- |\n| A patient can only be diagnosed by going through\
    \ tests |\n| A patient can only be tested by taking a sample or doing a scan,\
    \ etc. |\n\nThese templates are meant as a guide in surfacing assumptions for\
    \ the staff and need not be used in the strictest manner. It is useful at this\
    \ stage to include team members who were not involved in this process for assumption\
    \ surfacing. These members will be able to question very fundamental assumptions\
    \ that could have been taken for granted by others. These fundamental assumptions\
    \ can make a quantum improvement to performance if they can be challenged successfully.\n\
    \nSome of the templates were overlapping with perspectives and this is fine as\
    \ long as they get listed in any of the templates. The decision to include an\
    \ assumption is to assess if this assumption can be perceived as an obstacle and,\
    \ if challenged successfully, can achieve the transformation objectives.\n\nAfter\
    \ identifying potential customers through stakeholder analysis, it is then important\
    \ to question the assumptions that have been made about the stakeholder group.\
    \ In some cases, it is not necessary to ask the customer what they want, and the\
    \ staff instead are making some assumptions about what they think is important\
    \ to their customers. Assumption surfacing will bring a further degree of rigor\
    \ to transformation in the key area of surfacing and challenging assumptions.\
    \ After surfacing all the assumptions, the next step is to challenge assumptions\
    \ by staff either in questioning the relevance of these assumptions in today’s\
    \ context or in contradicting them to achieve radical improvement in performance.\
    \ This is illustrated in the following table.\n\n### Table 11. Assumptions and\
    \ challenges for a private clinic\n\n| **Assumptions** || **Challenges** |\n|\
    \ --- | --- |\n| **WHAT Template** ||  |\n| Getting cured is important to our\
    \ patients || • Staying well is important to our patients  \n• Getting cured quickly\
    \ and with the least cost, risk, and hassle is important to our patients |\n|\
    \  ||  |\n| Collecting payment is important to us || • Being remunerated is important\
    \ to us  \n— In money? In other terms? From elsewhere?  \n• Continuing to operate\
    \ and be of service is important to us |\n|  ||  |\n| Specialized equipment is\
    \ required for lab tests || • Some tests can be performed with commonly available\
    \ equipment |\n| **WHO Template** ||  |\n|  ||  |\n| A doctor is required to perform\
    \ diagnosis/prescribe treatment || • Some diagnoses and treatment prescriptions\
    \ can be done by other staff/doctors not within the SPC |\n|  ||  |\n| A specialist\
    \ technician is required to perform certain tests/scans (e.g., X-rays) || • Certain\
    \ tests/scans can be performed by ordinary nursing staff or staff not within the\
    \ SPC |\n|  ||  |\n| A patient must be ill before visiting the SPC || • A patient\
    \ can visit the SPC on occasions other than when she/he is ill |\n|  ||  |\n|\
    \ A patient must move from one test station to another || • A patient can perform\
    \ all his tests in one location  \n• A patient’s movement through all stations\
    \ should be minimized  \n• Tests can be brought to the patient  \n• A patient\
    \ can be moved from one test station to another without effort |\n|  ||  |\n|\
    \ **WHERE Template** ||  |\n|  ||  |\n| A patient can only be diagnosed at the\
    \ SPC || • A patient can be diagnosed at home/a location close to home or conveniently\
    \ accessible to her/him |\n|  ||  |\n| A patient can only be treated at the SPC\
    \ || • A patient can be treated at home/a location close to home or conveniently\
    \ accessible to him |\n|  ||  |\n| A patient must collect medication in person\
    \ || • Medication can be delivered to the patient/collected from a convenient\
    \ location |\n|  ||  |\n| A doctor must be at the SPC to perform diagnosis/ treatment\
    \ || • A doctor can diagnose as well as treat patient from another location within\
    \ or outside the SPC  \n• A doctor can diagnose or treat patient at a time outside\
    \ of the patient’s visit to the SPC |\n|  ||  |\n| **WHEN Template** ||  |\n|\
    \  ||  |\n| A patient must be diagnosed before she/he can be treated || • A patient\
    \ can be diagnosed and treated at the same time  \n• A patient can be treated\
