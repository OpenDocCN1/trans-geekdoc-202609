    ## **GLOSSARY**


    **Artificial intelligence** is the branch of computer science that deals with
    the creation of machines or systems capable of performing functions that would
    normally require human intelligence. These machines interact with the environment
    and behave according to the information they receive about it without any human
    intervention.


    A **blockchain** is, in the simplest of terms, a time-stamped series of immutable
    records of data that is managed by a cluster of computers not owned by any single
    entity. Each of these blocks of data (i.e. block) is secured and bound to each
    other using cryptographic principles (i.e. chain).


    A **chatbot** is a software application that uses artificial intelligence natural
    language processing capabilities to converse with customers, usually through a
    chat program. Such conversations may appear convincingly real that you may not
    realize you are conversing with a machine and not with another person.


    **Cloud computing** is the delivery of on-demand computing services — from applications
    to storage and processing power — typically over the Internet and on a pay-as-you-go
    basis. One benefit of using cloud computing services is that firms can avoid the
    upfront cost and complexity of owning and maintaining their own information technology
    infrastructure, and instead simply pay for what they use, when they use it.


    A **decision support system (DSS)** is a computerized program used to support
    determinations, judgments, and courses of action in an organization or a business.
    A DSS sifts through and analyzes massive amounts of data, compiling comprehensive
    information that can be used to solve problems and in decision making.


    The **Internet of things** (IoT) is a system that connects any electronic device,
    gadget, machine, microchip, sensor, appliance, building — anything — to the Internet.
    As a result, all these things can collect information and then share it with each
    other. Such interconnection of devices and machines allows people to monitor,
    control, and improve the overall environment.'
