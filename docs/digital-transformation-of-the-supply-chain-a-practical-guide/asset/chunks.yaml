    # 第 10 章


    # 商业许可转型的成功案例


    ## 新加坡商业许可的转型


    我们所研究的这个案例涉及调查一项关键公共服务流程及相关流程的实施，以及商业许可中的系统集成问题。在新加坡创业曾是一个复杂繁琐的过程。申请人需要首先将其业务注册为法律实体。仅注册的费用就可能高达数千美元。负责的机构随后将向申请人“建议”其启动业务时“可能”需要从其他机构获得的许可证。


    许可是执行某项原本被禁止活动的许可。例如，在允许任何人经营托儿中心之前，需要托儿中心许可证。因此，许可是一种政府特权。它假设相关活动是一项特权，而非权利。许可还涉及……

