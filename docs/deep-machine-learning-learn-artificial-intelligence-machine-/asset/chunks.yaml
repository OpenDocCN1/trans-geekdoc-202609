- fmt: "\n# Chapter Eight Convolutional Neural Networks\n\nConvolutional layers are\
    \ considered the key building blocks of convolutional neural networks or CNN.\
    \ A convolution is the simplest application of a filter to get an input that would\
    \ result in a kind of activation. Recurrent application of a filter yields a map\
    \ of activations that are called a feature map. This indicates the exact locations\
    \ and the strengths of a certain feature in the input. This can be an image.\n\
    \nWhy convolutional neural networks differ from simple neural networks is from\
    \ the fact that they can learn by themselves about different filters that are\
    \ specific to a particular training dataset within the constraints of a particular\
    \ modeling problem like the classification of images. The result is highly specific\
    \ features that you can detect anywhere. A convolutional neural network is known\
    \ as a specialized kind of neural network model that is specifically designed\
    \ to work with two-dimensional data. However, they also can be used with three-dimensional\
    \ and two-dimensional data-types.\n\nThe core of a convolutional neural network\
    \ is the convolutional layer which gives this network its peculiar name. This\
    \ particular layer would like to perform a specific operation popularly known\
    \ as a convolution. It is a kind of linear operation that includes multiplication\
    \ of weights with the input you feed to the network. Here it acts just like a\
    \ traditional network. This technique was particularly designed for 2D input.\
    \ The filter in the convolutional neural networks is smaller than the size of\
    \ the input data. There is a dot product in convolutional neural networks which\
    \ is an element-wise multiplication process between the filter and input. Their\
    \ sum is drawn which always yields a single value. The full operation can be referred\
    \ to as a scalar product.\n\nIf you use a filter that is smaller in size than\
    \ the input, it would allow the filter to go through the process of multiplication\
    \ by the input array at more than one point. The filter is systematically applied\
    \ to different overlapping parts of the input data. If you have designed the filter\
    \ to spot a particular feature inside the input, the application of the same filter\
    \ across the input image gives filter the power to find the same feature at any\
    \ point in the same image. It can be said that the filter takes that feature as\
    \ a reference point to detect it at other places in the image. This makes convolutional\
    \ neural networks highly precise and trustworthy.\n\nThe output from the multiplication\
    \ of the filter with an input array will be a single value. As the filter runs\
    \ through the process of multiplication more than once, the result will be a 2D\
    \ array, containing the output values. The array is also known as a feature map.\
    \ Once the feature map is created, you will be able to pass each value through\
    \ the process of nonlinearity. The concept of applying this convolutional operation\
    \ to the image data is nothing new for convolutional neural networks. It has already\
    \ been implemented in computer vision technology. Computer vision experts design\
    \ filters by hand, which are then applied to a particular image inside of a feature\
    \ map.\n\nConvolutional neural networks don’t usually learn by a single filter.\
    \ Multiple features run in parallel for specific input. It is quite common for\
    \ the convolutional layer to educate itself from 32 to 512 filters in parallel\
    \ for a certain input. Color images consist of more than one channel for each\
    \ color channel like red, blue, and green. From a data perspective, it means that\
    \ a single image that is fed as input to a model is in reality a combination of\
    \ three images. A filter ought to have the same number of channels as the input\
    \ has. This is often referred to as the depth of the convolutional neural network.\
    \ If the image you are feeding to the model as input consists of three models,\
    \ then you need to apply a filter to the image that also has three channels. If\
    \ a convolutional layer consists of 32 filters, they are not just 2D but they\
    \ also are in 3D form. Each of these filters results in one feature map. This\
    \ means that the depth of the output of a particular convolutional layer that\
    \ has 32 filters is 32.\n\nConvolutional layers not only are applied to the input\
    \ data but they are also applied to the output of each layer. When you stack up\
    \ the layers, it shapes up a hierarchical decomposition of your input. Consider\
    \ the fact that the filters will gradually learn the extraction process of features\
    \ such as lines. The filters that generally operate on the output of each layer\
    \ may extract different features that form the combinations of certain low-level\
    \ features that contain more than one line to express different types of shapes.\
    \ The process carries one until ultra-deep layers start extracting animals, faces,\
    \ houses, etc.\n\n## Building a CNN\n\nIn this section, I will explain to you\
    \ how you can build an MNIST handwritten digit classification model with the help\
    \ of deep learning and computer vision. MNIS is the short form of the Modified\
    \ National Institute of Standards and Technology dataset. It has about 60,000\
    \ small square grayscale images that have handwritten digits from 0 to 9. The\
    \ job of the model is to classify a particular image of the handwritten digit\
    \ into integers from 0 to 9. The MNIST deep learning model is widely used across\
    \ different systems in the world. Some top-performing models are called deep learning\
    \ convolutional neural networks that would go on to achieve an accuracy percentage\
    \ of 99%. You can use the dataset to develop and practice the method of solving\
    \ image classification tasks with the help of convolutional neural networks.\n\
    \nThe first step is to load the dataset. Then I will prepare the pixels for the\
    \ images that exist in the dataset. You will have to rescale the images to the\
    \ range of `[0,1]`. This involves the conversion of the data type from integers\
    \ to floats and then dividing the value of pixels by the maximum value. Then comes\
    \ the process of defining the deep learning model. The model will be trained for\
    \ 10 training epochs that have a default size of 32 examples.\n\n```python\n#\
    \ This is the baseline convolutional neural network model for mnist dataset\n\
    from numpy import mean\nfrom numpy import std\nfrom matplotlib import pyplot\n\
    from sklearn.model_selection import KFold\nfrom keras.datasets import mnist\n\
    from keras.utils import to_categorical\nfrom keras.models import Sequential\n\
    from keras.layers import Conv2D\nfrom keras.layers import MaxPooling2D\nfrom keras.layers\
    \ import Dense\nfrom keras.layers import Flatten\nfrom keras.optimizers import\
    \ SGD\n```\n\n### In this step I will load the dataset, train it and then test\
    \ it\n\n```python\ndef load_dataset():\n    # Here the dataset is about load on\
    \ the system\n    (trainX, trainY), (testX, testY) = mnist.load_data()\n    #\
    \ I will not attempt to reshape the dataset so that I will have solitary channel\n\
    \    trainX = trainX.reshape((trainX.shape[0], 28, 1))\n    testX = testX.reshape((testX.shape[0],\
    \ 28, 1))\n    # Here you will see single hot encode and target values\n    trainY\
    \ = to_categorical(trainY)\n    testY = to_categorical(testY)\n    return trainX,\
    \ trainY, testX, testY\n```\n\n### It is time to start scaling the pixels of the\
    \ images in the dataset\n\n```python\ndef prep_pixels(train, test):\n    # I will\
    \ kick off the conversion of integers into floats\n    train_norm = train.astype('float32')\n\
    \    test_norm = test.astype('float32')\n    # This step will show how you normalize\
    \ the model into range 0-1\n    train_norm = train_norm / 255.0\n    test_norm\
    \ = test_norm / 255.0\n    # Here we have normalized images\n    return train_norm,\
    \ test_norm\n```\n\n### I will define the convolutional neural network model in\
    \ the following step\n\n```python\ndef define_model():\n    model = Sequential()\n\
    \    model.add(Conv2D(32, (3, 3), activation='relu', kernel_initializer='he_uniform',\
    \ input_shape=(28, 28, 1)))\n    model.add(MaxPooling2D((2, 2)))\n    model.add(Flatten())\n\
    \    model.add(Dense(100, activation='relu', kernel_initializer='he_uniform'))\n\
    \    model.add(Dense(10, activation='softmax'))\n    # Now that the convolutional\
    \ neural network model has been defined. We can start compilation of the model\n\
    \    opt = SGD(lr=0.01, momentum=0.9)\n    model.compile(optimizer=opt, loss='categorical_crossentropy',\
    \ metrics=['accuracy'])\n    return model\n```\n\n### I will evaluate the convolutional\
    \ neural network model with the help of k-fold cross-validation technique\n\n\
    ```python\ndef evaluate_model(dataX, dataY, n_folds=5):\n    scores, histories\
    \ = list(), list()\n    # I am now preparing for the cross validation of the convolutional\
    \ neural network model\n    kfold = KFold(n_folds, shuffle=True, random_state=1)\n\
    \    # I will start enumeration of the splits in the convolutional neural network\
    \ model\n    for train_ix, test_ix in kfold.split(dataX):\n        # Once again\
    \ am defining the convolutional neural network model\n        model = define_model()\n\
    \        # I will now select different rows to train and to test\n        trainX,\
    \ trainY, testX, testY = dataX[train_ix], dataY[train_ix], dataX[test_ix], dataY[test_ix]\n\
    \        history = model.fit(trainX, trainY, epochs=10, batch_size=32, validation_data=(testX,\
    \ testY), verbose=0)\n        # I will now start evaluation of the convolutional\
    \ neural network model\n        _, acc = model.evaluate(testX, testY, verbose=0)\n\
    \        print('> %.3f' % (acc * 100.0))\n        # The next code snippet will\
    \ store the scores\n        scores.append(acc)\n        histories.append(history)\n\
    \    return scores, histories\n```\n\n### This will run a plot diagnostic learning\
    \ curves\n\n```python\ndef summarize_diagnostics(histories):\n    for i in range(len(histories)):\n\
    \        # I will explain in it the plot loss in the convolutional neural network\
    \ model\n        pyplot.subplot(2, 1, 1)\n        pyplot.title('Cross Entropy\
    \ Loss')\n        pyplot.plot(histories[i].history['loss'], color='blue', label='train')\n\
    \        pyplot.plot(histories[i].history['val_loss'], color='orange', label='test')\n\
    \        # I will explain in this step the level of plot accuracy in the convolutional\
    \ neural network model\n        pyplot.subplot(2, 1, 2)\n        pyplot.title('Classification\
    \ Accuracy')\n        pyplot.plot(histories[i].history['accuracy'], color='blue',\
    \ label='train')\n        pyplot.plot(histories[i].history['val_accuracy'], color='orange',\
    \ label='test')\n        pyplot.show()\n```\n\n### It is about time to summarize\
    \ the performance of the convolutional neural network model\n\n```python\ndef\
    \ summarize_performance(scores):\n    # Now I am going to print the summary of\
    \ the convolutional neural network model\n    print('Accuracy: mean=%.3f std=%.3f,\
    \ n=%d' % (mean(scores)*100, std(scores)*100, len(scores)))\n    # In this step\
    \ I will box and also whisker different plots of results\n    pyplot.boxplot(scores)\n\
    \    pyplot.show()\n```\n\n### You can now start running the test harness in order\
    \ to run an evaluation of the convolutional neural network model\n\n```python\n\
    def run_test_harness():\n    # Once again you will have to load the dataset for\
    \ convolutional neural network model\n    trainX, trainY, testX, testY = load_dataset()\n\
    \    # I will not initiate the preparation process of the pixel data to test the\
    \ convolutional neural network model\n    trainX, testX = prep_pixels(trainX,\
    \ testX)\n    # Once again I will run a thorough evaluation of the convolutional\
    \ neural network model\n    scores, histories = evaluate_model(trainX, trainY)\n\
    \    # I am now initiating the learning curves for the convolutional neural network\
    \ model\n    summarize_diagnostics(histories)\n    # I am now summarizing the\
    \ estimated performance of the convolutional neural network model\n    summarize_performance(scores)\n\
    \n# Now this is the entry point. Here you can run the test harness for your convolutional\
    \ neural network model\nrun_test_harness()\n```\n"
