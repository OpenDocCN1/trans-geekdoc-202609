    to define a particular feature set for a cat. Simply put, you have to define the
    feature set yourself while in deep learning, the program itself builds this feature
    without any kind of supervision. This makes the process faster and highly accurate.
    The process is largely smooth. The computer program is fed with training data
    which is a bunch of images that are labeled with a cat or not cat. The labels
    are known as meta tags. The computer program uses this initial dose of information
    for training the model. Then it receives a constant feed of data while the model
    trains itself. The very first form of the model is known as the predictive model.
    The first model may predict that anything that has four legs is known as a cat.
    It will label it a cat even if it is a dog because it will match the images by
    looking for different pixels in the data. Each iteration makes the model complex
    and highly accurate. A toddler may take months to decipher and digest the concept
    of a cat but a deep learning model will take a fraction of that time to learn
    how a cat looks as it will be able to iterate through millions of images in a
    short time. Some people question the accuracy of the model. If a model is not
    accurate, it is a matter of much concern. Deep learning programs need access to
    a bulk of processing power and training data. Deep learning models are accurate
    because they can easily create highly complex statistical models from an iterative
    output. Constant iterations help the model build accurate models out of unlabeled
    and unstructured data.   Deep Learning Model Examples Deep learning models are
    deployed in automated driving and medical devices. Automotive researchers use
    these models for the detection of different objects such as traffic lights and
    lampposts that are installed along the side of roads. These models are being used
    in driverless cars to detect pedestrians and discriminate them from moving cars
    and still objects. That’s how developers expect to lower the number of accidents.
    These models are also used in defense and aerospace to detect objects and discriminate
    them from satellites. That’s how experts can declare different zones as safe or
    unsafe. These models also are being used in the medical field. Cancer researchers
    are using these systems to detect cancer cells in the human body. Deep learning
    models are also used to improve the safety of workers as they automatically detect
    when objects and people come close to machines and are likely to fall into danger.
    This technology is also being used for translation of speech and automated hearing.
    Deep learning models work on the back of neural network architectures, which is
    why these models are often labeled as deep neural networks. The ‘deep’ in deep
    learning means the total number of layers in each neural network. Traditionally,
    a neural network only had two to three layers while deep neural networks may contain
    as many as 150 layers. Once you have created these models, you will have to train
    them with the help of neural network architectures and labeled data. Deep learning
    has brought remarkable achievements for human beings and these achievements are
    visible in the form of automated cars. However, some highly awaited applications
    such as human-level translation, human-level dialogue systems, and human-level
    language understanding are largely elusive. However, AI has been through cycles
    of expectations and disappointments in the past. '
