    # 第六章 数学术语详解 ![](img/image_rsrc1YZ.jpg)


    如果你想理解深度学习技术，你应该熟悉不同的数学概念，例如梯度下降、张量、微分和张量操作。为了构建深度学习模型，你需要一个充满数据的多维 `Numpy` 库。库中的数据存储在
    `Numpy` 数组中，即张量（tensors）。目前所有的机器学习模型都使用这些张量作为数据的基础结构。如果你分析一个张量，我们会发现张量是一个存储数据的容器。你必须知道它存储的数据是数值。


    ## 标量 (Scalar)

    某些矩阵是 2D 张量。维度也被称为 `axis`（轴）。如果一个张量只包含一个数字，它被称为 `scale` 或 `scaler` 量张量。它也被称为 `0D`
    张量。`Numpy` 库中的 `float64` 和 `float32` 就是标量张量。标量张量没有任何 `axes`。张量中 `axes` 的数量也被标记为
    `rank`（秩）。


    ## 向量 (Vectors)

    多个数字组成的数组被称为 `vector`（向量）。有些人也称其为 1D 张量。正如其名，它包含单一的 `axis`。如果一个向量有五个条目，它将被标记为
    5 维向量。请记住，`5D` 向量不等同于 `5D` 张量。根本区别在于，`5D` 向量在 `axis` 上有五个维度，而 `5D` 张量总共有五个 `axes`。它们沿着各个
    `axes` 的维度数量可能不同。维度既可以是张量内 `axes` 的数量，也可以是单个 `axis` 上的条目数量。


    ## 矩阵 (Matrices)

    包含向量的数组被称为 `matrix`（矩阵）。它的另一个名称是 2D 张量。两个 `axes` 通常被称为 `columns`（列）和 `rows`（行），你可以将
    `matrix` 定义为数字矩形网格。第一个 `axis` 上的条目被称为 `rows`，第二个 `axis` 上的条目被称为 `columns`。


    ## 3D 张量 (3D Tensors)

    如果你以新数组的形式封装不同的矩阵，你将得到一个 `3D` 张量，你可以将其解释为数字立方体。如果你在数组内部封装 `3D` 张量，你就可以创建一个 `4D`
    张量。以此此类推。


    通常由三个关键属性定义一个张量：

    1. 第一个是 `axes` 的数量。例如，一个 `3D` 张量可能有三个 `axes`，而 `matrix` 拥有两个 `axes`。这在 `Numpy`
    中也被称为张量的 `ndim`。

    2. 张量的 `shape`（形状）是一种整数元组，描述了每个张量沿着特定 `axis` 拥有多少维度。

    3. 然后是用于 `Python` 库中用 `dtype` 符号表示的数据类型。这是包含在张量中的特定类型的数据。张量的类型可以是 `unit8`、`float64`
    和 `float32`。在某些情况下你也会看到 `char` 张量。你必须注意，几乎不存在 `string` 张量。


    ## 向量数据集 (Vector Dataset)

    这是数据方面最常见的情况之一。在这类数据集中，单个数据点可以很容易地编码为 `vector` 形式。因此，一批数据被编码为 `2D` 张量形式，即向量数组。这里第一个
    `axis` 被称为 `samples axis`（样本轴），第二个 `axis` 被称为 `features axis`（特征轴）。


    以一个人员数据集为例，你需要考虑特定某人的年龄、收入和 `ZIP code`（邮政编码）。数据集中的每个人都应该被描述为一个包含三个值的 `vector`。因此，由
    300,000 人组成的整个数据集可以很容易地封装在形状为 `(300000, 3)` 的 `2D` 张量中。


    还有一个文本文档数据集，我们根据某个单词在文中出现的次数来呈现每份文档。你可以在一个包含 10,000 个单词的字典中计算此。每份文档都必须编码为具有 10,000
    个值的 `vector`，其中每个值对应字典中每个单词的计数。因此， 400 份文档的整个数据集可以很容易地存储在形式为 `(400, 10000)` 的张量中。


    ## 序列数据 (Sequence Data)

    当数据中的时间很重要时，将数据存储在具有显式 `3D` 结构的张量中更为明智。在这里，每个样本都应该被编码为 `3D` 张量形式。按照传统，`time axis`（时间轴）始终被视为第二个
    `axis`。


    来看几个例子。假设有一个股票价格数据集。随着每一分钟过去，必须存储特定股票的当前价格，以及最低价和最高价。这样，每分钟都被被编码为 `3D` 向量。当一天结束时，如果交易日总共有
    350 分钟，整个交易日被编码为 `(350, 3)`。


    你还可以形成一个多个推文的数据集，你可以编码包含 250 个字符的单个推文。推文的每个字符都可以编码为大小为 128 的二进制向量——字母表数量为 128。然后你可以每条推文编码为形式为
    `(250, 128)` 的 `2D` 张量。如果你必须创建一个 100,000 条推文的数据集，它看起来将是 `(100000, 250, 128)`。


    ## 图像 (Images)

    通常，图像由三个维度组成，即颜色的 `width`、`height` 和 `depth`。类似的 `MNIST` 数字灰度图像具有单一颜色通道。它们可以存储在
    `2D` 张量中。按照传统，图像被封装在 `3D` 张量中。灰度图像具有一维颜色通道。如果你有一批 256 张大小为 `128, 128` 的灰度图像，你可以将它们存储在形式为
    `(256, 128, 128, 1)` 中。当我们讨论图像张量的约定时，有两种，即 `channels-first`（通道优先）约定和 `channels-last`（通道最后）约定。


