    \ is generally performed after measuring the similarity of the input to different\
    \ data points in the training set where neurons store a certain prototype. When\
    \ an input vector must be classified, each neuron in the network measures the\
    \ Euclidean distance between the prototype and input. If there are two classes,\
    \ namely `X` and `Y`, the new input will be closer to class `X` than to class\
    \ `Y`. Hence, it is classified as class `X`.\n\n### Recurrent Neural Networks\n\
    Recurrent Neural Networks (`RNNs`) are popular among programmers because they\
    \ add an intriguing twist to a simple neural network. This twist makes them unique.\
    \ `RNNs` are generally designed to absorb a series of input without any restrictions\
