- fmt: "\n# Chapter Seven: Artificial Neural Network ![](image_rsrc1YZ.jpg)\n\nThis\
    \ chapter will walk you through the building procedure of an artificial neural\
    \ network. I will start by introducing an artificial neural network and then I\
    \ will explain what kind of installation packages are relevant to the procedure.\
    \ You will learn about different types of neural networks.\n\n## History of Artificial\
    \ Neural Networks\nThe history of artificial neural networks dates back to the\
    \ 1940s when Walter Pitts and Warren McCullough built an algorithm-based system\
    \ that was built to function like the human brain. With the conception of the\
    \ `perceptron`, an algorithm, there was progress in the field of building artificial\
    \ neural networks. `perceptron` was capable of performing some complex operations\
    \ such as recognition tasks.\n\nArtificial neural networks (`ANNs`) are revolutionizing\
    \ businesses and everyday life. ANNs have brought AI to the next level. Machines\
    \ can be trained to learn and recognize different patterns. They can make predictions\
    \ which previously only humans could do. That’s how they also can solve different\
    \ problems that humans come across every day. ANNs are computational models that\
    \ are essentially algorithms. They have the unique ability to carve out meaning\
    \ from complex or imprecise data to locate patterns and also detect trends that\
    \ appear to be too convoluted for the human brain.\n\nArtificial neural networks\
    \ have eased off different difficulties of humans. You can spot them in Gmail,\
    \ Uber, and Amazon. Once they are trained effectively, they don’t need your assistance\
    \ from onwards. They will learn from whatever data comes their way.\n\nThe human\
    \ brain consists of neurons that make the fundamental blocks of the brain. Artificial\
    \ neural networks are the same as the human brain in the sense that they too contain\
    \ many neurons that process information and transmit it as per needs. Artificial\
    \ neural networks behave just as the human brain does. Be it human brain or artificial\
    \ neural networks, neurons have to adjust to how on they react based on stimuli.\
    \ If everything works perfectly well, you will receive positive feedback which\
    \ will be more likely to trigger in the future. In the case of negative feedback,\
    \ the artificial neural network system will learn and will be less likely to trigger\
    \ in a similar situation.\n\nArtificial neural networks are statistical models\
    \ that are created to self-program based on learning algorithms. The basic aim\
    \ is to sort out and understand or recognize different concepts and photographs.\
    \ The input can be compared to the dendrites that exist in the human brain while\
    \ the hidden layer can be compared to the cell body. The hidden layer remains\
    \ sandwiched between the input layer and the output layer.\n\nOnce you have constructed\
    \ a network, you can use supervised learning or unsupervised learning techniques\
    \ to train the same. One of the most important aspects behind the popularity of\
    \ Artificial Neural Networks is building machines that would perform the tasks\
    \ that only humans can do. Simply put, they are designed to have an intelligence\
    \ that matches humans only. A human brain is wonderful in terms of learning new\
    \ things and adapting to changing situations. Artificial neural networks are designed\
    \ in such a way that they tend to identify certain patterns and educate themselves.\
    \ These systems can be used for the sake of classification, segmentation, and\
    \ regression. You ought to convert a given data into a numerical form before you\
    \ feed it to a neural network.\n\n## Anatomy of a Neural Network\nA neural network\
    \ consists of layers that are combined to form a network or a network model. The\
    \ input data is one layer. Then there are corresponding targets. There also is\
    \ a `loss function` which by default would define the feedback signal which is\
    \ used to learn. The `optimizer` in a neural network usually determines how the\
    \ learning process proceeds. The network that is made up of different layers maps\
    \ out the input data for making predictions about a certain activity.\n\nThe `loss\
    \ function` moves on to run those predictions through a comparison with the targeted\
    \ values. This helps the model produce a particular `loss value`, which is a measure\
    \ of how well the predictions are matching the expectations. This also paves the\
    \ way for the next steps in the fine-tuning of the model. The `optimizer` makes\
    \ use of the `loss value` for updating the weights of the network.\n\n### Layers\n\
    These are named as the building blocks when you are making a model in deep learning.\
    \ A `layer` is the fundamental data structure inside neural networks. It is a\
