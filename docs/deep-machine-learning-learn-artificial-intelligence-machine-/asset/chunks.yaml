    # 引言 ![](img/image_rsrc1YZ.jpg)


    这本关于人工智能的书包含了经过验证的步骤和策略，教你如何构建一个比人类表现得更好的深度学习模型。曾有一段时间，我以为人工智能只是一个梦想，没有什么好担心的。但随着时间的推移，尘埃落定，一切都变得清晰可见，宛如流水一般。然而，随着我的成长，人工智能已经接管了许多曾经属于人类领域的普通事务。至少可以说，这非常令人恐惧。我最恐惧和担心的事情之一就是对失去工作的恐惧。人们议论纷纷，杂志文章也散布恐慌，称人工智能将接管人类曾经拥有的工作。


    一天晚上，我做了一个梦。梦中我看到一家公司开发的巨型机器人，用于吊起沉重的钢材来建造桥梁。这个机器人名为 `Humongousteel`，它体型巨大，需要二十个个人垂直排成一排才能与之等高。梦中的每个人都很开心，因为机器人通过减轻沉重负担，让人们的工作变得轻松了。`Humongousteel`
    由人工智能系统驱动，这些系统根据人类程序员的指令行动。`Humongousteel` 的主要工作是从仓库搬运钢木并将其运往建筑桥梁的工地。`Humongousteel`
    由十几个男人控制，他们在现场协调机器人的移动和动作。有一辆大拖车会将 `Humongousteel` 从仓库运到工地，在那里 `Humongousteel`
    会自行卸下货物并开始工作。至少可以说，当机器人开始工作时，现场景象非常壮观。它会搬运钢件、安装并连接它们。在它在某个工地出错之前，每个人都赞赏它。


    一天，`Humongousteel` 在工地工作时，失去了与以前接收指令的控制室的联系。我们原以为机器人在与控制室恢复联系之前不会移动，但事实并非如此。联系从未丢失。是其他东西接管了
    `Humongousteel` 的控制权。这是我们的第一个假设。然而，后来被发现驱动机器人的人智能系统已经变得自主了。机器人摧毁了它建造的桥，并让现场变得一片混乱。直到救援队到达并成功切断连接电池与神经系统的电源线，它才无法被控制。一旦机器人被控制，每个人都松了一口气。梦结束了，我感谢上帝这只是发生在梦里。


    从那个晚上开始，我开始学习人工智能系统，为了消除我的好奇心。自从我进入这个世界起，我意识到人工智能系统并没有什么可怕的。它们的出现不是为了消除工作，而是为了促进创造性工作。机器只能执行我们命令它们做的事情。它们不会创造性地思考。创造力是人类天生的特性。它也应该保持如此。当机器处理无聊的任务时，人类可以专注于讲故事和开发角色等创造性事务。因此，这开启了我通往人工智能系统的旅程。我学会了如何开发它们，以及如何使用它们来减轻艰巨的任务。事实证明很有趣。


    这本书是写给对人工智能好奇的人的。人工智能系统由 `Python` 编程语言构建的深度学习模型支持。因此，如果你渴望进入人工智能和机器学习的世界，那么你必须成为
    `Python` 代码编写的专家。


    为了方便阅读，本书分为不同的章节，每个章节又进一步分为不同的小节，以便你能够快速浏览并轻松阅读。


    ## Python 语言基础


    书的第一章介绍 `Python` 的基础知识。我将带你回顾一遍 `Python` 编程的基础，这是深度学习模型的构建基石。本章的第一节将向你解释 `Python`
    变量是什么以及你如何在代码中使用它们。这些变量是编程的基础特征，因为你必须使用它们来存储不同类型的信息，如 `text`、`float` 和 `integer`。一旦存储了它们，你稍后就可以使用。


    书的下一节将侧重于创建 `string`（字符串）变量并在 `set` 中使用它们。下一节将介绍语法错误主题。最常见的语法错误是使用单引号。一旦你看到错误长什么样，你在编写程序时就能避免它们。


    本章的下一节将介绍 `lists`（列表）。我将向你解释 `list` 是什么样的、你如何在 `Python` 中开发 `list`、`list` 的限制是什么，以及你如何通过添加、删除和编辑列表内部的元素来修改它。`list`
    的妙之处在于它允许你向程序提供尽可能的信息。删除元素最常用且有趣的方法是 `del` 和 `pop`。同样，添加元素最有趣的方法是 `append` 和 `insert`。本章以解释
    `tuple`（元组）是什么以及你如何创建和使用它而结束。


    ## Python 高级编程


    书的第二章侧重于 `Python` 中的高级编程。本章的第一节将关注 `input()` 函数，这在 `Python` 中成为最重要的学习内容，因为没有这个函数，你所做的只是定义函数、填充
    `parameters`（参数）并输入 `arguments`（实参）。你可以在相同代码的任何点进行 `call()` 并让函数运行。这是最简单的编码方式，也是最有效的方式。


    下一节围绕 `python functions`（Python 函数）展开。Python 函数是帮助你定义程序并在稍后使用的某种工具，你只需要定义函数、填充
    `parameters` 并输入 `arguments`。


    本章最后的一节回顾 Python 类以及你如何创建它们。


    ## 深度学习


    在学习了 `Python` 的特性之后，下一章将带你了解什么是深度学习以及它如何影响世界。第一节是对人工智能系统的简要介绍。我将解释它们是什么以及它们如何影响我们周围的世界。本章的下一节将解释机器学习以及它是如何影响世界的。


    书的下一节涉及深度学习模型的解释。深度学习模型为人工智能系统和机器学习注入了生命。我将在下一节解释深度学习模型是如何工作的、其背后的驱动因素是什么以及推动它们的机制是什么。最重要的章节是解释深度学习模型与传统机器学习模型的区别。本章以对深度学习模型示例的详细介绍作终。这很有趣，因为你将了解到深度学习模型驱动系统。


    ## 智能系统


    书的第四章讨论人工智能系统。在章节开头，我将解释你为什么要进入人工智能的世界。学习人工智能和机器学习就像你自己成为一名老师，教机器以某种方式行动。这是关于让机器运行高效且有效的。


    在深入解释人工智能之后，我将继续解释不同类型的人工智能：

    - **人工智能**：低级的人工智能，被 `Tesla` 用于自动驾驶汽车，被 `Amazon` 用于驱动 `Alexa`。

    - **通用人工智能**：更强大的人工智能版本，可以在不同的工作领域超越人类。它们拥有接近人类的智能。

    - **超级人工智能**：虽然是假设性的，但是人工智能最强大的形式。它能够在智能上超越人类并完成各种任务。


    ## 人工智能的应用


    下一章为你提供了人工智能和不同机器学习模型的全面视角。第一节非常重要，因为它涉及人工智能在医疗健康领域的作用。我将解释人工智能如何帮助人们进行医学成像。人工智能系统不仅比人类系统更快，而且在交付结果方面也是高效的。


    接下来是虚拟护士的构建和使用，这降低了疾病和细菌向患者传播的风险。它还让药物和医疗保健变得高效。我随后将解释人工智能如何帮助医疗专业人员进行针对性诊断。


