    \ the previous output while they generate outputs. `RNNs` tend to take multiple\
    \ input vectors and then produce multiple output vectors. In `RNNs`, only weights\
    \ don’t influence outputs; state vectors also influence them.\n\n## Building a\
    \ Neural Network\nA neural network works just like the human brain. You can consider\
