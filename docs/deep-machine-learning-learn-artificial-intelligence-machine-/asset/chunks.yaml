    this caused the start of my journey toward artificial intelligence systems. I
    learned how to develop them and how to use them to ease off tough tasks. It turned
    out to be fun. This book is for those who are curious about artificial intelligence.
    An artificial intelligence system is backed by deep learning models that are built
    by Python programming language. Therefore, it is necessary that if you are looking
    forward to entering the world of artificial intelligence and machine learning,
    you should be an expert in writing code in Python language. This book, for the
    ease of reading, is divided into different chapters that are then further divided
    into different sections so that you will be able to skim it and read it fast and
    easily. The first chapter of the book deals with the basics of Python language.
    I will give you a run through the basics of Python programming which is a building
    block of deep learning models. The first section of the chapter will explain to
    you what Python variables are and how you can use them in coding different programs.
    These variables are the basic features of programming because you will have to
    use them for storing different types of information such as texts, floats, and
    integers. Once you have stored them, you can use them later on while you develop
    real programs. I will focus on creating string variables and using them in a set
    of codes. The next section of the book will shed light on the topics of whitespaces
    and syntax errors. The most common syntax errors are using single quotes while
    at the same time using apostrophes. Once you see how an error looks like, you
    will be able to avoid them while you are writing a program. The next section of
    the chapter will shed light on Python lists. I will explain to you how a list
    looks like. How you can develop a list in Python, what is the limit of a list
    in Python, and how you should modify it by adding, removing, and editing elements
    inside the list. A list is wonderful in the sense that it allows you to feed the
    program with as much information as you can. You can build a list of a million
    elements and yet be able to access each element in the blink of an eye. I will
    state different methods for removing the elements. The most common and the most
    interesting methods are the del method and the pop method. Similarly, the most
    interesting methods to add elements are the append method and the insert method.
    The chapter ends on the explanation of what a Python tuple is how you can create
    and use it. The second chapter of the book focuses on advanced level programming
    in Python. The first section of this chapter will focus on the input() function
    which in Python 2.7 becomes Raw\_Input() function. This is the most important
    thing to learn because without this function you cannot invite the users to feed
    a particular program with the information you desire from them. You may ask them
    to enter their date of birth, name, or email address. These kinds of programs
    need an input() function. The next comes the break keyword. I will explain how
    you can use the break keyword to put a stop on a Python program while it has yet
    to complete its run. The next section of the chapter revolves around python functions.
    A python function is something that helps you define a program once and then use
    it later on without going through the process of coding later on. All you have
    to do is to define the function, fill it in with the parameters, and enter the
    arguments. You can make a function call at any point in the same code and make
    the function run its course. This is the easiest way to code and the most effective
    way as well. The next and the last section of the chapter reviews what Python
    classes are and how you can create them. Python classes are the building blocks
    of object-oriented programming. They are used to create real-life objects such
    as cars, cats, dogs, and peacock. In this book, I will create a peacock which
    will tell its name and age, and which will stand up and fly away when it is instructed.
    Python classes are the most wonderful features of this language as they allow
    you to create complex programs. After you have gone through the highlight features
    of Python, the next chapter will walk you through the explanation of what deep
    learning is and how it affects the world. The first on the line is a brief explanation
    of artificial intelligence systems. I will explain what they are and how they
    are leaving an impact on the world around us. The next section of the chapter
    will explain what machine learning is and how it is affecting the world. The next
    section of the book deals with the explanation of deep learning models. Deep learning
    models are what infuses life into artificial intelligence systems and machine
    learning models. I will explain in the next section how deep learning models work
    like what are the driving factors behind these models and what is the mechanism
    that pushes them through. The most important section is the one that explains
    how deep learning models differ from traditional machine learning models. The
    chapter ends on a thorough explanation of different deep learning model examples.
    This is interesting as you will come to know what systems around you deep learning
    models power. The fourth chapter of the book deals with artificial intelligence
    systems. At the start of the chapter, I will explain why you should enter the
    world of artificial intelligence. Learning artificial intelligence and machine
    learning is just like developing yourself as a teacher who teaches machines to
    act in a certain way. It is about making machines efficient and effective in their
    operations. After I have explained artificial intelligence to the depths, I will
    then proceed toward explaining different types of artificial intelligence. The
    first one the line is artificial narrow intelligence which is a low-grade artificial
    intelligence, in use by Tesla for self-driving cars and by Amazon to power Alexa.
    The second that must be explained is artificial general intelligence which is
    a stronger version of artificial intelligence and can surpass humans in different
    fields of work. They possess intelligence that comes real close to that of humans.
    The last on the line is artificial superintelligence which is yet hypothetical
    but the strongest form of artificial intelligence. It is capable of surpassing
    humans in intelligence and in wrapping up different tasks. The next chapter gives
    you a comprehensive view of the applications of artificial intelligence and different
    machine learning models. The first section is highly important as it deals with
    the role of artificial intelligence in the healthcare sector. I will explain how
    artificial intelligence is helping people in conducting medical imaging. An artificial
    intelligence system is not only faster than a human system but it also is the
    most efficient in terms of delivering results. The next in line is the building
    and use of virtual nurses which lowers the transmission of diseases and bacteria
    to patients. It also makes the process of medication and healthcare highly efficient.
    I will then go on to explain how artificial intelligence can help healthcare professionals
    in conducting a targeted diagnosis, which is something that has not been perfectly
    achieved by human healthcare professionals. The next section of the chapter sheds
    light on how artificial intelligence is helping businessmen that are in the retail
    sector. This section is comprehensive as it will help you understand the different
    sections which will be covered by artificial intelligence systems if you install
    them in your business facility. The uses of artificial intelligence systems may
    surround the preparation of inventories, use of chatbots, and personalization
    of the sales process, engagement of customers, giving customers conversational
    support in real-time, receiving predictions about the price of the product so
    that you can adjust your price, and setting up the supply chain at will. It can
    also help a retail business when it comes to eliminating the need of a cashier,
    conducting visual research, and setting up artificial intelligence modeled fitting
    rooms to save the time of your customers and increasing production. In the next
    section, I will explain the importance of artificial intelligence in the world
    of banking. You can use artificial intelligence models to detect fraud in financial
    transactions. You also can use to cut operational costs. Other sections in which
    you use artificial intelligence in the banking sector is by powering customer
    service. You can use artificial intelligence models to minimize risks so that
    you can raise profits. You also can use artificial intelligence models to power
    internet banking. Without a doubt, it will be a fast model. The next section of
    the chapter deals with the use of artificial intelligence in the manufacturing
    sector. You can use artificial intelligence models to install a foolproof quality
    control system in the manufacturing sector. Where human inspectors can become
    a burden on your budget and yet cannot achieve super efficiency, artificial intelligence
    models can help you maintain the quality of products. An artificial intelligence
    system can also help you in the prediction of failure in the manufacturing industry.
    The chapter ends on a brief explanation of how artificial intelligence models
    can revolutionize the travel industry. You will learn how you can use artificial
    intelligence models in planning a trip, make bookings, and get assistance. The
    sixth chapter of the book will explain to you a bunch of mathematical terms that
    you might come across while studying deep learning models. The first term that
    demands explanation is scaler. The next terms that I will explain are vectors,
    matrices, 3D tensors, datasets, images, and videos. After you have gone through
    this chapter, you will be able to understand the different terms that come your
    way. The seventh chapter of the book deals with the building of artificial neural
    networks. The first section of the book focuses on the history of artificial neural
    networks. I will trace it back to where it started in a crispy and brief manner
    so that your focus can remain on the ingredients of artificial neural networks.
    The next section of the chapter will state the anatomy of artificial neural networks.
    I will give in detail what layers in artificial neural networks are and what does
    a loss function means. The next topic on the line is Keras which is a Python library
    that is the hot favorite for building artificial neural networks. I will explain
    how you can build a deep learning workstation. The next topic on the line is Jupyter
    Notebooks. Different types of artificial neural networks will come into the discussion.
    I will explain in detail different systems such as multiplayer perceptron, recurrent
    neural networks, convolutional neural networks, and radial basis function neural
    networks. The last section of the chapter will explain in detail where artificial
    neural networks should be applied. The two most favorite applications are the
    signature verification system that you can see installed in financial institutions
    such as banks and speech recognition systems that you can see installed in vaults
    and secret rooms in intelligence headquarters. The second to last chapter deals
    with the building of a convolutional neural network. I will explain in detail
    the process of building a convolutional layer, which is the building block of
    a convolutional neural network. I cover the step by step process of how you can
    build a convolutional neural network. The process will be delineated in a step
    by step format and the code will have comments that will explain what is packed
    inside the code. As you have prior knowledge of Python programming language, it
    should not be a problem for you to decipher the code in this section. You can
    use the code to build a system. The last chapter of the book revolves around the
    concept of business intelligence. I will explain what business intelligence is
    and how it is similar to the concept of machine learning and artificial intelligence.
    You will get an insight into the processes of business intelligence. Then I will
    go on to explain different functions of business intelligence. You will learn
    how you can benefit by using these functions. Then I will move on to explaining
    the importance of business intelligence. You will learn the infrastructure of
    the working process of business intelligence. You will also learn who uses business
    intelligence in the present day. The chapter ends on a comprehensive explanation
    of the different advantages of business intelligence. I don’t expect you to be
    a master in Python programming to be able to read and understand this book. You
    should know the basic knowhow of Python programming. For ease of use, I have included
    in this book two chapters on Python programming. You can use that knowledge to
    build simple and object-oriented programming before you move on to building a
    deep learning model. I recommend that you keep a diary by your side to note down
    each important point and code snippet that you think you need to practice more.
    Once you have documented everything in the diary, you can move on to enter the
    practical phase. The more you practice, the better you get at building programs
    and understanding how deep learning models work and what their benefits are. The
    best method for this deep learning madness is to read the book while keeping a
    computer operating system turned on so that you can practice and research whatever
    interesting item comes your way. Don’t forget to install Python 2.7 or Python
    3 on your system. Most of the code in the book is written in Python 2.7. Wherever
    there is a difference in the code between Python 2.7 and Python 3, I have mentioned
    it. Installing both versions will help you understand the nuances. '
