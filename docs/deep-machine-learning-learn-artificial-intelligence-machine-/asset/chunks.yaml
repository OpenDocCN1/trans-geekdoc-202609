  trans: "\n\n# 第一章：Python 基础\n\n本章将带你了解 Python 编程的基础知识，因为你需要的这些知识来使用深度学习技术构建人工智能和机器学习模型。Python\
    \ 是深度学习模型的构建基石。\n\n第一步是检查你的计算机系统中是否安装了 Python。如果没有，你需要在你的计算机操作系统上安装一个 Python 编辑器。文本编辑器是动态的，它们识别\
    \ Python 代码，并在你编写时高亮不同的部分。这使得代码的结构变得易于理解。\n\n第一步是理解 Python 环境。Python 在不同的操作系统上可能略有不同。通常情况下，市面上有两个版本的\
    \ Python：`Python 2` 和 `Python 3` 在不同系统中很容易识别。Python 仍在处于进化过程中，因为随着新思想和技术的不断出现，每种编程语言都在尝试成长。Python\
    \ 的开发者让这种语言变得强大且多功能。大多数变化被认为是难以察觉的。随着操作系统不断演进，旧版本的 Python（如 `Python 2`）功能可能不如最新的\
    \ `Python 3` 那么强大。\n\n如果你在系统中都预装了这两个版本，建议你使用 `Python 3`。`Python 3` 中有一个解释器，也被称为终端窗口。这允许你尝试不同版本的\
    \ Python，而无需起初先保存再运行程序。Python 是一种跨平台语言，这意味着你可以根据需要在不同的操作系统上运行它。Windows 系统没有预装\
    \ Python，因此你必须下载并将其安装到系统中。完成这些后，你将需要下载并安装文本编辑器。\n\n## 安装 Python\n\n你需要检查系统是否已经安装了\
    \ Python。打开命令行窗口，并在“开始”菜单中输入命令。在终端窗口中输入小写的 `python`。如果你看到以下符号 `>>>`，说明系统已安装了 Python。如果系统中没有安装\
    \ Python，你可能会在屏幕上看到一条错误信息。\n\n如果系统中没有预装 Python，你需要访问 [www.python.org](http://www.python.org)\
    \ 下载并安装 Python。当你打开该网站时，会有系列 Python 版本供你下载。选择你想要安装到系统中的版本并点击下载。文件下载到系统后，你应该开始启动安装过程。你还应该确保在安装过程的结束处勾选\
    \ `Add Python to PATH` 选项。这将使你的系统配置过程变得简单顺畅。\n\n## Python 变量\n\n你将在本节中学习在 Python\
    \ 程序中可以不同数据类型。你还将学习在变量中存储数据的过程，以及如何在程序中使用变量。Python 最基本的特性之一就是变量。\n\n在接下来的代码中，我将在\
    \ Python 中创建一个变量并给它赋值。\n\n```python\n>>> x = \" I am reading a book on deep learning\
    \ techniques to build AI models. \"\n>>> print(x)\nI am reading a book on deep\
    \ learning techniques to build AI models.\n```\n\n当我打印程序时，赋值给变量 `x` 的相同行已显示在我的计算机屏幕上。Python\
    \ 中的每个变量都持有某个特定的值，这个值基本上是与变量关联的信息。\n\n现在我将进入 Python 编辑器，你将需要在那里编写实际代码。我将使用相同的变量和值，并创建一个新变量并分配另一个值，看看\
    \ Python 是如何处理它们的。\n\n```python\n>>> x = \" I am reading a book on deep learning\
    \ techniques to build AI models. \"\n>>> y = \" AI is revolutionizing different\
    \ fields in the business world.\"\n>>> print(x)\n>>> print(y)\n```\n\n你可以通过点击“File”菜单并点击“New”来启动\
    \ Python 编辑器。会弹出一个窗口，你可以将其作为 Python 编辑器。你可以在编辑器中编写代码，然后点击 `F5` 运行。代码的结果将显示在 IDLE\
    \ 中。\n\n当你在 Python 中处理变量时，你需要注意一些规则。如果你违反了这些规则，将会导致错误。其他指南将帮助你写出更易读的代码。变量名可能包含数字、字母和下划线。它们可以以下划线开头，但不能以数字开头。例如，你可以将变量命名为\
    \ `x_1` 而不是 `1_x`。变量名中没有空格。然而，下划线应用于分隔不同的单词。例如，`print` 在 Python 中是内置。变量名必须简短但具有描述性。如果你在创建一个变量来描述，必须写完整的单词而不是单个字母。使用大写字母通常不会触发错误。\n\
    \n## 数据类型\n\n大多数程序定义了不同类型的数据并使用它们。收集不同类型的数据。Python 允许你分类不同类型的数据。我们将讨论的第一数据类型是\
    \ `strings`（字符串）。字符串非常简单。单引号或双引号内的任何内容都被视为字符串。\n\n```python\n>>> x = \" I am reading\
    \ a book on deep learning techniques to build AI models. \"\n>>> y = ' AI is revolutionizing\
    \ different fields in the business world.'\n>>> print(x)\n>>> print(y)\n```\n\n\
    在字符串中做的最简单的事情之一是更改单词的大小。查看以下代码并尝试如何更改单词和短语的大小。\n\n```python\n>>> x = \" I am reading\
    \ a book on deep learning techniques to build AI models. \"\n>>> y = ' AI is revolutionizing\
    \ different fields in the business world.'\n>>> print(x.upper())\n>>> print(y.title())\n\
    >>> print(x.lower())\n```\n\n你可以看到我使用了三种方法来更改字符串的大小写。Python 允许对不同的字符串进行简单拼接。我们可以使用\
    \ `title` 方法来格式化字符串拼接的结果。\n\n### 空格\n\n你可以向制表符、空格和行尾符号添加空白。空白可以让你更容易地组织输出并使其易于理解。\n\
    \n```python\n>>> x = \"\\tI am reading a book on deep learning techniques to build\
    \ AI models.\"\n>>> y = '\\nAI is revolutionizing different fields\\n in the business\
    \ world.'\n>>> print(x)\n>>> print(y)\n```\n\n### 语法错误\n\n你遇到的常见错误类型之一是语法错误。语法错误通常发生在\
    \ Python 无法识别程序的特定部分为有效代码时。例如，如果你在单引号内部使用撇号，将触发错误。\n\n```python\n>>> x = \" I\
    \ am reading a book on deep learning techniques to build AI models. \"\n>>> y\
    \ = ' AI is revolutionizing different fields in the business world.'\n>>> print(x)\n\
    >>> print(y)\n```\n\n你可能认为结果中没有错误信息，因为如果对字符串使用双引号，一切正常。如果你对字符串使用单引号，结果将是语法错误。\n\
    \n```python\n>>> x = 'I am reading a book on deep learning techniques to build\
    \ AI models.'\n>>> y = \"AI is revolutionizing different fields in the business\
    \ world.\"\n>>> print(x)\n>>> print(y)\n```\n\n你可以使用 IDLE 进行简单的计算，如：\n\n```python\n\
    >>> 2 + 4\n>>> 2 * 4\n>>> 2 / 4\n>>> 2 - 2\n>>> 4 % 2\n```\n\n由于 Python 中有不同类型的数据，因此在编写代码时极有可能遇到某些错误。更多情况下，你必须在\
    \ `message` 中使用变量的值。例如，你不能简单地将其写为字符串。\n\n```python\n>>> time = 1\n>>> message\
    \ = \"It is \" + time\n>>> print(message)\n```\n\n```\nTraceback (most recent\
    \ call last):\n  File \"C:/Users/saia computers/Desktop/p\", line 2, in <module>\n\
    \    message = \"It is \" + time\nTypeError: cannot concatenate 'str' and 'int'\n\
    ```\n\n运行代码将显示上述错误。这意味着 Python 无法识别你所使用的信息类型。Python 不确定该如何解释你正在使用的整数值（`int`）。你必须将数字转换为字符串。\n\
    \n```python\n>>> time = 1\n>>> message = \"It is \" + str(time)\n>>> print(message)\n\
    ```\n\n## 列表\n\nPython 列表是项的集合，你可以按照特定的顺序将它们放在在一起。列表是非常有用的，你可以轻松地构建它们，向它们添加元素，并在程序运行时从它们中删除元素。方括号始终表示列表。\n\
    \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    >>> print(computer_accessories)\n```\n\n### 访问列表\n\n当你在 Python 中构建列表时，可以通过索引轻松访问列表内部的元素。列表通常是排序的，并且每个项都有一个索引。\n\
    \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    >>> print(computer_accessories[0])\n>>> print(computer_accessories[2])\n>>> print(computer_accessories[4])\n\
    >>> print(computer_accessories[5])\n>>> print(computer_accessories[7])\n>>> print(computer_accessories[11])\n\
    ```\n\n```\nTraceback (most recent call last):\n  File \"C:/Users/saia computers/Desktop/p\"\
    , line 7, in <module>\n    print(computer_accessories[11])\nIndexError: list index\
    \ out of range\n```\n\n错误消息的出现是因为你在最后输入的索引不属于列表中的任何元素。你可以根据特定需求对列表应用不同的方法来格式结果。\n\
    \n### 修改\n\n你可以通过添加、更改和删除元素来修改列表。列表是动态的，因此在程序运行时，你可以轻松地构建它们、向它们添加元素并从它们删除元素。例如，你可能创建一个游戏，玩家在游戏中构建并移除列表中的配件。每次他买一个，它就会被添加到列表中。\n\
    \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    >>> print(computer_accessories)\n>>> computer_accessories[1] = 'biometric scanner'\n\
    >>> print(computer_accessories)\n```\n\n```\n['mouse', 'biometric scanner', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    ```\n\n你可以很好地向列表添加元素。简单的方法是使用 `append` 方法。通过这种方法，你将项附加到列表的末尾。我将向同一个列表中添加项。\n\n\
    ```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    >>> computer_accessories.append('biometric scanner')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.append('jockey')\n>>> print(computer_accessories)\n>>>\
    \ computer_accessories.append('gaming keyboard')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.append('printer')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.append('scanner')\n>>> print(computer_accessories)\n\
    ```\n\n你可以从列表中使用单个值。\n\n```python\n>>> computer_accessories = ['mouse', 'keyboard',\
    \ 'monitor', 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet',\
    \ 'webcam']\n>>> x = \"I will have to buy from the computer \" + computer_accessories[2].title()\n\
    >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[0].title()\n\
    >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[3].title()\n\
    >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[5].title()\n\
    >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[7].title()\n\
    >>> print(x)\n```\n\n使用 `insert` 方法可以在特定索引处添加元素。\n\n```python\n>>> computer_accessories\
    \ = ['mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam']\n>>> print(computer_accessories)\n>>>\
    \ computer_accessories.insert(0, 'biometric scanner')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.insert(2, 'jockey')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.insert(4, 'gaming keyboard')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.insert(6, 'printer')\n>>> print(computer_accessories)\n\
    >>> computer_accessories.insert(8, 'scanner')\n>>> print(computer_accessories)\n\
    ```\n\n你可以使用 `del` 语句从列表中删除元素。如果你知道列表内元素的位置，可以删除它。\n\n```python\n>>> computer_accessories\
    \ = ['mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam']\n>>> print(computer_accessories)\ndel\
    \ computer_accessories[0]\n>>> print(computer_accessories)\ndel computer_accessories[2]\n\
    >>> print(computer_accessories)\ndel computer_accessories[5]\n>>> print(computer_accessories)\n\
    del computer_accessories[6]\n>>> print(computer_accessories)\ndel computer_accessories[7]\n\
    >>> print(computer_accessories)\n```\n\n另一种广为人知的方法是 `pop()` 方法，用于从列表中删除项。有时从列表中移除元素后你需要使用它的值。在这种情况下，可以使用\
    \ `pop()` 方法。例如，玩家需要记住哪些元素被销毁了，以便可以使用 `pop()` 方法而不是 `del()` 方法。`pop()` 方法接收一个栈形式的列表。每当你使用该方法时，项将从列表的顶部弹出。列表将这样变空。\n\
    \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
    >>> print(computer_accessories)\n>>> popped_computer_accessories = computer_accessories.pop()\n\
    >>> print(computer_accessories)\n>>> print(popped_computer_accessories)\n>>> popped_computer_accessories\
    \ = computer_accessories.pop()\n>>> print(computer_accessories)\n>>> print(popped_computer_accessories)\n\
    >>> popped_computer_accessories = computer_accessories.pop()\n>>> print(computer_accessories)\n\
    >>> print(popped_computer_accessories)\n>>> popped_computer_accessories = computer_accessories.pop()\n\
    >>> print(computer_accessories)\n>>> print(popped_computer_accessories)\n>>> popped_computer_accessories\
    \ = computer_accessories.pop()\n>>> print(computer_accessories)\n>>> print(popped_computer_accessories)\n\
    >>> popped_computer_accessories = computer_accessories.pop()\n>>> print(computer_accessories)\n\
    >>> print(popped_computer_accessories)\n```\n\n```\nRESTART RESTART\n>>> []\n\
    Traceback (most recent call last):\n  File \"C:/Users/saia computers/Desktop/p\"\
    , line 45, in <module>\n    computer_accessories.pop()\nIndexError: pop from empty\
    \ list\n```\n\n你也可以使用 `pop()` 方法从列表的任何位置删除项。\n\n```python\n>>> computer_accessories\
    \ = ['mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam']\n>>> print(computer_accessories)\n>>>\
    \ computer_accessories.pop(1)\n>>> print(computer_accessories)\n>>> computer_accessories.pop(4)\n\
    >>> print(computer_accessories)\n>>> computer_accessories.pop(2)\n>>> print(computer_accessories)\n\
    >>> computer_accessories.pop(0)\n>>> print(computer_accessories)\n```\n\n```\n\
    RESTART RESTART\n>>> ['mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth\
    \ connector', 'wi-fi', 'modem', 'internet', 'webcam']]\n>>> ['keyboard', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']]\n\
    >>> ['cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet',\
    \ 'webcam']]\n>>> ['charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet',\
    \ 'webcam']]\n>>> ['wi-fi', 'modem', 'internet', 'webcam']]\n>>> ['modem', 'internet',\
    \ 'webcam']]\n>>> ['internet', 'webcam']]\n>>> ['webcam']]\n```\n\n"
- fmt: "\n# Chapter Two: Advanced Python Programming\n\nProgramming also involves\
    \ a set of conditions. Sometimes you have to test different conditions. The `if`\
    \ statements allow you to test certain conditions and respond rightly. This chapter\
    \ will walk you through the advanced level programming in Python. You will learn\
    \ to write `if` statements. You will also learn how you can create complex statements.\n\
    \n```python\ncomputer_accessories = ('mouse', 'keyboard', 'monitor', 'cables',\
    \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam')\n\
    print(computer_accessories)\nfor computer_accessory in computer_accessories:\n\
    \    if computer_accessory == 'keyboard':\n        print(computer_accessory.upper()\
    \ + \" has been completely destroyed! It can never be rebuilt. \")\n    else:\n\
    \        print(computer_accessory.title() + \" has been completely destroyed!\
    \ It can never be rebuilt. \")\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> ('mouse', 'keyboard', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam')\n\
    Mouse has been completely destroyed! It can never be rebuilt.\nKEYBOARD has been\
    \ completely destroyed! It can never be rebuilt.\nMonitor has been completely\
    \ destroyed! It can never be rebuilt.\nCables has been completely destroyed! It\
    \ can never be rebuilt.\nCharger has been completely destroyed! It can never be\
    \ rebuilt.\nBluetooth Connector has been completely destroyed! It can never be\
    \ rebuilt.\nWi-Fi has been completely destroyed! It can never be rebuilt.\nModem\
    \ has been completely destroyed! It can never be rebuilt.\nInternet has been completely\
    \ destroyed! It can never be rebuilt.\nWebcam has been completely destroyed! It\
    \ can never be rebuilt.\n```\n\nI will use the same list of elements and use an\
    \ `if-else` statement to test different conditions.\n\n```python\ncomputer_accessories\
    \ = ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\nprint(computer_accessories)\nif 'mouse'\
    \ in computer_accessories:\n    print('destroying mouse')\nif 'monitor' in computer_accessories:\n\
    \    print('destroying monitor')\nif 'keyboard' in computer_accessories:\n   \
    \ print('destroying keyboard')\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> ('mouse', 'keyboard', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam')\n\
    destroying mouse\ndestroying monitor\ndestroying keyboard\n```\n\nSee the following\
    \ example that includes an `if-else` statement.\n\n```python\ncomputer_accessories\
    \ = ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\nprint(computer_accessories)\nfor computer_accessory\
    \ in computer_accessories:\n    if computer_accessory == 'mouse':\n        print('Mouse\
    \ has been destroyed.')\n    else:\n        print('Destroying ' + computer_accessory\
    \ +'.') \nprint ('\\n I have destroyed everything.')\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> ('mouse', 'keyboard', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam')\n\
    Mouse has been destroyed.\nDestroying keyboard.\nDestroying monitor.\nDestroying\
    \ cables.\nDestroying charger.\nDestroying bluetooth connector.\nDestroying wi-fi.\n\
    Destroying modem.\nDestroying internet.\nDestroying webcam.\nI have destroyed\
    \ everything.\n```\n\n## The `raw_input()` Function\n\nThis also is one of the\
    \ most important functions in the world of Python. Some programs demand that you\
    \ get input from the user. This function can help you with that. It pauses the\
    \ program and waits until the user fills it in some information. Once it receives\
    \ it, it then goes to store it inside a variable to make it more convenient for\
    \ the programmer to work with. The following program will repeat whatever you\
    \ enter as input. See the example.\n\n```python\nprompt = \"You need to say something\
    \ to me and I will repeat it for you:\"\nprompt += \"\\nYou must enter q if you\
    \ want to exit out of program....\"\nmessage = \"\"\nwhile message != 'q':\n \
    \   message = raw_input(prompt)\n    print(message)\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> You need to say something to me\
    \ and I will repeat it for you:\nJ\n...\nJohny\n...\nLisa\n...\nCherrypicking\n\
    ...\nOrchard\n...\nBlossoms\n...\nHunza\n...\nq\n```\n\nSee another example of\
    \ the `input` function. The code mentioned above works perfectly well but the\
    \ only problem is that it prints out the word `q` in the form of an actual message.\
    \ By adding a simple `if` statement we can fix it.\n\n```python\nprompt = \"You\
    \ need to say something to me and I will repeat it for you:\"\nprompt += \"\\\
    nYou must enter q if you want to exit out of program....\"\nmessage = \"\"\nwhile\
    \ message != 'q':\n    message = raw_input(prompt)\n    if message != 'q':\n \
    \       print(message)\n```\n\n## The Break Break Keyword\n\nYou can use the `break`\
    \ keyword in a `while` loop to exit the loop at any point. The `break` statement\
    \ regulates the flow of the program. You can add it to control the lines of code\
    \ to see which are executed and which are not. That’s how the program only executes\
    \ the code that you desire it to.\n\n```python\nprompt = \"\\nName the city you\
    \ have been to:\"\nprompt += \"\\nYou must enter q if you want to exit out of\
    \ this program....\"\nwhile True:\n    message = raw_input(prompt)\n    if message\
    \ == 'q':\n        break\n    else:\n        print(\"I'd plan to visit \" + message.title()\
    \ + \"!\")\n```\n\n```text\n===============================\nRESTART ================================\n\
    >>> Name the city you have been to: You must enter q if you want to exit out of\
    \ this program....\nParis\nI'd plan to visit Paris!\nName the city you have been\
    \ to: You must enter q if you want to exit out of this program....\nLondon\nI'd\
    \ plan to visit London!\n...\n```\n\nThe `raw_input` function will become `input()`\
    \ function if you are using Python 3.\n\n## Python Functions\n\nLet’s create a\
    \ simple function by using `def`.\n\n```python\ndef greetings_user():\n    print(\"\
    Hello!\")\ngreetings_user()\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> Hello!\n```\n\nA function has certain\
    \ parameters and arguments. Parameters are usually defined in the start while\
    \ arguments are passed to the function later.\n\n```python\ndef describing_pet(animals_type,\
    \ pets_name):\n    print(\"\\nI keep my house a \" + animals_type + \".\")\n \
    \   print(\"My \" + animals_type + \"s is called \" + pets_name.title() + \".\"\
    )\n\ncribing_pet('horse', 'harry')\ndescribing_pet('beaver', 'will')\ndescribing_pet('cat',\
    \ 'Tommy')\ndescribing_pet('cow', 'Tin')\n```\n\nYou can see that the best thing\
    \ about a function is that you write the code once and then keep calling the function\
    \ as many times as you want.\n\n## Classes\n\nA class in Python acts like a prototype\
    \ which helps programmers build objects from scratch. They provide the way for\
    \ pairing functionality and data. Whenever you build a new class, you are building\
    \ an object which can be anything from a human to an animal or any other artificial\
    \ object. I will explain in detail the concept of adding instances to a class\
    \ which, in simple words, give your object a kind of spirit. Each class instance\
    \ can be filled with methods as well.\n\nThe most important thing in classes,\
    \ just like other features of python, is that you cannot use class to name a class\
    \ because it is a designated keyword. Spare it for good. You can use different\
    \ attributes that belong to classes. Each instance in a python class represents\
    \ an object. You can say that a class is original while an instance is its copy.\
    \ A class object may have its unique identity. When you create an object, the\
    \ process is dubbed as instantiation. You can add as many instances to a Python\
    \ class as like.\n\n```python\nclass Peacock:\n    \"\"\"This is a simple try\
    \ to build a model of a peacock.\"\"\"\n    def __init__(self, namep, agep):\n\
    \        \"\"\"This will initialize the name and age attributes.\"\"\"\n     \
    \   self.namep = namep\n        self.agep = agep\n    def sit(self):\n       \
    \ \"\"\"This will simulate a peacock standing in response to a particular command.\"\
