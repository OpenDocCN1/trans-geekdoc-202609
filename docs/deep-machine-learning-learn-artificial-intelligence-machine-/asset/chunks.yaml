- fmt: "\n# Chapter Four: Artificial Intelligence\n\nThis chapter will walk you through\
    \ Artificial Intelligence (AI) and its applications in the real world. Presently,\
    \ we are surrounded by smart systems in our everyday lives. A smart system can\
    \ be in the form of internet search, conversion of spoken words into text, and\
    \ biometric face recognition. Whatever it is, artificial intelligence remains\
    \ at the heart of these systems. These systems are complex applications. AI runs\
    \ these applications with the help of algorithms and mathematics.\n\n## Why AI?\
    \ \n\nArtificial intelligence, the term, came into existence in 1956. However,\
    \ it only gained popularity today due to advanced algorithms, availability of\
    \ volumes of data, improved storage capacities, and fast computing power. In the\
    \ 1950s, AI dealt with problem-solving techniques. In the next decade of the 1960s,\
    \ AI grabbed the attention of the US Department of Defense, which started training\
    \ computers so that it can mimic the human power of reasoning. Defense Advanced\
    \ Research Projects (`DARPA`) finished several street mapping projects during\
    \ the 1970s. This early period of research shaped the future of automation that\
    \ you can see in present-day computers.\n\nAI became the subject of science fiction\
    \ novels and Hollywood movies. Hollywood, in the movies, depicted AI as super\
    \ robots who have more powers than humans and who eventually take over the world.\
    \ However, the present-day evolution of AI has not turned out to be that much\
    \ scary. These systems are not that much smart that they can control humans. On\
    \ the contrary, AI has evolved positively and has brought great benefits to every\
    \ industry.\n\nAI has the power to leave deep impacts on our lives. AI as a field\
    \ attempts at deciphering the behaviors and patterns of different entities. With\
    \ the help of AI, we attempt at building smart systems. The human brain is a marvel\
    \ in itself. We wonder how the human brain does lots of thinking with such ease.\
    \ We easily identify objects, learn new things and languages, communicate with\
    \ different people by responding to their questions, and perform several sophisticated\
    \ tasks that we might not have imagined ever. AI helps machines learn from experience,\
    \ tune them to new inputs, and perform the tasks that only humans have performed.\
    \ Most of the AI examples that we come across in our everyday lives usually rely\
    \ heavily on natural language processing (`NLP`) and deep learning. Computers,\
    \ by using the latest technologies, are trained to achieve certain tasks after\
    \ they have processed big amounts of data and recognized certain patterns that\
    \ exist in the data.\n\n## Importance of Artificial Intelligence\n\nAI is beneficial\
    \ because it offers to automate repetitive learning. However, it is different\
    \ from robotic and hardware-backed automation. Instead of the automation of manual\
    \ tasks, AI attempts to perform frequent, computerized, and high-volume tasks\
    \ without the slightest of fatigue. This sort of automation demands human inquiry\
    \ if you want to set up an efficient system that carves out and asks the right\
    \ questions.\n\nArtificial intelligence makes products intelligent. It is not\
    \ sold within an individual status. Rather, it improves products. Take the example\
    \ of `Siri` which was added a new feature to Apple products. Artificial intelligence\
    \ revolves around learning algorithms that allow the data to the program. AI attempts\
    \ at detecting various structures and regularities in data so that algorithm learns\
    \ some skills. The algorithm keeps learning and turns into a predictor. Take the\
    \ example of an automated chess player. The algorithm learns to make moves in\
    \ a game of chess. It also can learn what product to recommend to you after you\
    \ have made one purchase. Ever wondered why you see similar products on your computer\
    \ screen after you buy one from an online eCommerce store.\n\nThe models adopt\
    \ when they are consistently fed with new data. The learning technique is known\
    \ as `backpropagation` that permits a model to adjust itself if answer is wrong.\
    \ AI attempts at analyzing deeper data by using `neural networks` that possess\
    \ lots of hidden layers. Built in the past because the computing power was slow\
    \ and big data were absent, AI models demand ample amounts of data so that they\
    \ can encompass all features of model. For example, if the model is designed to\
    \ detect a stop sign, you should feed the model with thousands of pictures, taken\
    \ from different angles and in different sizes, colors, dimensions, and shapes\
    \ of stop signs. The higher the amount of data is, the more accuracy you will\
    \ have. AI can be highly accurate if you design and train it well. Deep learning\
    \ models like `Alexa` and `Google Assistant` keep on improving as they are exposed\
    \ to new data.\n\n## Types of AI\n\nIf I could tell you about something that has\
    \ brought a revolution to 21st century, it would be artificial intelligence. Artificial\
    \ intelligence models have entered our lives and you must understand different\
    \ types of artificial intelligence that exist today which detect objects, make\
    \ decisions that are wiser than that of humans.\n\n### Narrow Intelligence\n\n\
    Narrow Intelligence is one type of artificial intelligence also known as weak\
    \ artificial intelligence. These machines can perform low level narrowly defined\
    \ set of tasks. The machine doesn’t have the power to think and just performs\
    \ a certain set of pre-defined functions. Examples are `Alexa`, `Google Assistant`,\
    \ `Siri`, and `Tesla’s self-driving cars`. They are weak in the sense that their\
    \ developers have made them as such.\n\n### General Intelligence\n\nGeneral Intelligence\
    \ is a relatively stronger artificial intelligence compared to the previous type.\
    \ `AGI` is considered the stage from which artificial intelligence is likely to\
    \ evolve where machines possess the ability to think themselves and make decisions\
    \ without any external interference. This brings artificial intelligence closer\
    \ to the human brain. At the moment, there are no examples of this kind of artificial\
    \ intelligence, However there are debates that these systems will soon be developed\
    \ and brought to life. There will be machines as smart as humans are, and they\
    \ will produce more work in a short time compared to humans.\n\nElon Musk, the\
    \ Executive Officer of `Tesla`, and Mark Zuckerberg, the Executive Officer of\
    \ `Facebook`, have been caught in verbal duel over the future of artificial intelligence.\
    \ Although the former is considered the pioneer of bringing artificial intelligence\
    \ to life by infusing them into `Tesla cars`, yet he is the one who fears most\
    \ the revolution in artificial intelligence. He would not expect anyone to develop\
    \ an artificial intelligence system that could surpass humans. He is against the\
    \ development of a super-intelligent machine that would wreak havoc on humans.\
    \ However, Mark believes that artificial intelligence is the future and the progress\
    \ in this field is inevitable. He is looking forward to launching a smart artificial\
    \ intelligence system that would control the house by acting on the speech of\
    \ the owner. For example, the house would run on verbal instructions of the owner:\
    \ if he says ‘light the stove’, the fire will start heating up the house; if he\
    \ orders to turn the lights off, there will be dark; if the owner directs the\
    \ artificial intelligence system to draw the curtains, the curtains will cover\
    \ the windows; if he times the artificial intelligence system to remove the curtains\
    \ at a specific time in the morning, the system will act accordingly.\n\nThis\
    \ is super smart but yet is not something that humans should be afraid of. What\
    \ Elon Musk is afraid of is the race in the field of defense. He indirectly wants\
    \ that the military should stay away from artificial intelligence systems. He\
    \ fears the advent of artificial intelligence weapons programmed to kill the enemy.\
    \ He says there is never a surety that an artificial intelligence system would\
    \ be so efficient that it would easily differentiate between an enemy and a friend.\
    \ Even if it learns to differentiate between the two, who would educate it about\
    \ when to fire or hold off? This is something that is still under debate. However,\
    \ it is not hard to imagine how much damage an unbridled artificial intelligence\
    \ system can cause if it gets out of control during a war scenario. What if it\
    \ starts killing its comrade? What if it wipes out an entire army from the face\
    \ of the earth? How would it shape up the future course of war? Will it push the\
    \ world into a new race of autonomous weapons? Whatever the future has in its\
    \ pack, artificial intelligence weapons can be highly lethal for humans. They\
    \ would destroy the earth and kill every species that come their way if the situation\
    \ slips out of control. Elon Musk is right when he says that artificial intelligence\
    \ models should be handled with the utmost care. A powerful artificial intelligence\
    \ system is without a doubt a threat to the existence of humans. Stephen Hawking\
    \ once alerted the world that if artificial intelligence developed, it would herald\
    \ the end of humans. It would take control, redesign itself at a great pace while\
    \ humans, due to their biological limitations, would fail to complete them let\
    \ alone supersede them.\n\n### Artificial Super Intelligence\n\nArtificial Super\
    \ Intelligence is considered the next stage of Artificial General Intelligence.\
    \ It is the stage when artificial intelligence systems will surpass human intelligence.\
    \ At the present moment, this kind of artificial intelligence is just a figment\
    \ of human imagination. You only can see this kind of scenario in Hollywood movies\
    \ and science fiction novels, where you would see a bunch of machines taking control\
    \ of the world. However, for how long this type of artificial intelligence will\
    \ remain our figment of the imagination is not yet known. Machines that are powered\
    \ by artificial intelligence will not take long to reach this point. They will\
    \ ultimately reach this point. Take the example of the movie `I, Robot`. The movie\
    \ in which Will Smith has played the role of a detective who would not accept\
    \ that the doctor who built a powerful artificial intelligence system had committed\
    \ suicide. A big organization develops the artificial intelligence system to make\
    \ robots that would serve humans as servants. They had sold many versions to consumers.\
    \ It happens one day that the artificial intelligence systems go out of control\
    \ and all the robots that are serving in common households come under its control\
    \ instead of human control. The artificial intelligence develops its thinking\
    \ and directs all the robots to whom it is connected to take hostages. That’s\
    \ how servants take over the world and the robots hold the humans' hostage.\n"
