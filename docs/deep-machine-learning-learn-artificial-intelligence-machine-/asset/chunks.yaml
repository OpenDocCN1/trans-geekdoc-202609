    # Chapter Three: What Is Deep Learning?


    ![](image_rsrc1YZ.jpg)


    Deep learning educates computers to do the chores that humans do naturally. Deep
    learning systems stand out to be efficient because, just like humans, they learn
    by following an example. If you take a glance around you, you will see driverless
    cars or at least hear about them in magazines or on TV. The technology behind
    these cars is known as deep learning systems. These cars amaze people by detecting
    a stop sign and discriminating between a lamppost and a pedestrian. The same technology
    can be spotted in your tablets, wireless speakers, smartphones, and tablets.


    Deep learning has gained and is gaining tremendous attention for quite some time.
    It has achieved results that were never possible before. A computer model attempts
    to classify sounds, images, and pieces of text. Deep learning modes have the potential
    to achieve top-level accuracy that could match humans. Labeled data trains deep
    learning models. Another thing that is crucial to the training of the models is
    neural network architectures that possess multiple layers. In simple words, you
    can say that deep learning is a certain type or branch of artificial intelligence
    (AI) or machine learning (ML) that imitates the whole process of learning abilities
    of humans. It is considered an important aspect of data science, which includes
    predictive modeling.


    Artificial intelligence (AI) has remained a subject of extreme hype across the
    media houses. There have been countless articles on the pros and cons of machine
    learning, AI, and deep learning. Even celebrities got themselves embroiled in
    verbal duels and Twitter fights over the future of AI and its dangers to the human
    race. Elon Musk, the Chief Executive Officer (CEO) of Tesla, is one of the few
    celebrity billionaires who advocated against an unbridled race to achieve brilliance
    in artificial intelligence. Whatever the facts are, presently we have been promised
    a fresh and evolved race of intelligent chatbots and Virtual Assistants (VAs).


    Some argue that deep learning systems will paint the human future in a grim picture.
    Those will be utopian times where humans will lose jobs in mass quantity and robots
    will handle most of the economic activity. Well, there is a silver lining as well.
    In my opinion, media releases and debates are overhyped. AI will only improve
    the quality of human lives. It will help us survive in a better way. It will facilitate
    humans in maximizing their work output by easing off tough tasks and by aiding
    in wrapping up physically exhausting jobs in a fast yet efficient manner. AI is
    the future and you must play an active role in this revolutionary future. You
    might hear different identical terms like artificial intelligence, machine learning,
    and deep learning. This chapter will walk discuss these terms so that you have
    a clear concept of what each means and their significance.


    ## Artificial Intelligence


    Artificial Intelligence came into existence in the 1950s when some pioneers of
    computer science began asking the crucial question if computers could think as
    humans did. The ramifications of that question are still being explored today.
    Artificial Intelligence, as a field, can be defined as the effort to so automation
    of certain intellectual tasks that are inherent to humans. While AI is a general
    field, deep learning and machine learning are the sub-fields. However, the field
    also encompasses those fields for which little learning was needed. For example,
    chess programs involved hardcoded rules that were written by programmers. They
    didn’t fall into the category of machine learning. Experts opine that human-level
    AI can only be achieved if programmers handcraft explicit rules for the sake of
    manipulation of knowledge. The approach can be dubbed as symbolic AI and it dominated
    during the 1950s through the 1980s.


    ## Machine Learning


    A machine learning system is generally trained rather than programmed. Programmers
    present different examples that are relevant to a certain task. If you are planning
    to automate the task of form a collection of the pictures of your spouse, you
    can feed the machine learning system with different examples of her pictures.
    The system learns statistical rules for linking several pictures to particular
    tags. Machine learning systems developed in the 1990s and since then it has fast
    become a highly popular and successful subfield of AI. As the datasets and hardware
    got faster and more efficient, machine learning gained popularity and success.


    Mathematical statistics drives machine learning. Unlike mathematical statistics,
    machine learning deals with complex and large datasets like the dataset of millions
    of pictures. Machine learning demands certain input data points. For example,
    if the task is recognition of speech, the data points can be speeches by the people.
    If the task is the recognition of pictures, the data points can be images of people.
    For a speech recognition task, the expected output can be human-generated transcripts
    of audio files while in the image task, the outputs can be tags like humans or
    animals. You also can measure the performance of an algorithm.


    A machine learning model transforms the input data into something meaningful.
    The main problem in the processes of deep learning and machine learning is the
    meaningful transformation of data. A color image can be easily encoded into RGB
    format which includes red-green-blue colors. It can also be encoded into HSV format
    which is the short form of hue-saturation-value. These are considered as the two
    different representations of the same type of data. If a task appears to be difficult
    with one representation, you can easily do that with another. The objective of
    machine learning models are to locate the appropriate representation for the input
    data.


    ## Deep Learning Models


    Deep learning is a branch of machine learning. You can see it as a new take on
    educating a system with the help of data that tries to emphasize leaning successive
    layers of different meaningful representations. Deep learning is not a reference
    to any type of deep understanding that you can achieve by this approach. It denotes
    the idea of different types of layers of representations. The higher the number
    of layers is the more the depth of the model is. Other names for the field can
    be hierarchical representations learning and layered representations learning.
    Presently, deep learning systems have tens even hundreds of successive layers
    of representations. They tend to learn from exposure to training data. The machine
    learning systems that focus on just a couple of layers of representations are
    called shallow learning systems. The models in deep learning systems are...


