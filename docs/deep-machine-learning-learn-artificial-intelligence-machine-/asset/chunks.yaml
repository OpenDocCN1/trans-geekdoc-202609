    How Deep Learning Differs From Traditional Models Deep learning models are considered
    superior because they are stacked hierarchically. On the other hand, traditional
    machine learning algorithms are linear. A hierarchical order boosts abstraction
    and complexity. If you want to understand deep learning models, you ought to imagine
    a toddler who learns the first-word ‘cat.’ She learns what a cat is by pointing
    toward an object and uttering the word ‘cat.’ If she is right, her mother would
    say, ‘Yes, it is a cat.’ Otherwise, she would tell her that it is not a cat. As
    she points to more objects, she educates her brain about the different features
    that a cat possesses such as her color, shape, and paws. She is, unintentionally,
    clarifying a somewhat complex abstraction. The toddler would build a hierarchy
    of knowledge in her mind. In the hierarchy, each abstraction level is formed on
    the foundation of knowledge gained from the previous layer. The computer programs
    that are backed by deep learning models go through a similar process like the
    one the toddler’s brain has gone through. Each algorithm in this hierarchy uses
    the knowledge it has gained to build a statistical model. Iterations through the
    layers continue until the output reaches an acceptable level of accuracy. Traditional
    machine learning is different in the sense that the learning process is largely
    supervised. The programmer needs to be very specific when educating the computer
    on what types of things it must be looking for to decide whether a certain image
    is of a cat or a dog or any other animal. The process is dubbed as feature extraction.
