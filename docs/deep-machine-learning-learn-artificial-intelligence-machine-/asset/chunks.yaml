    \ be an output layer which you can name `t`. There should also be a particular\
    \ set of biases and weights between each hidden layer. You can denote them as\
    \ `b` and `W` respectively. Make sure you have Python installed on your computer\
    \ system as building a neural network in Python is relatively easy.\n\n```python\n\
    class MyNeuralNetwork:\n    def __init__(self, s, t):\n        self.input = s\n\
    \        self.weights1 = np.random.rand(self.input.shape[1],4)\n        self.weights2\
    \ = np.random.rand(4,1)\n        self.t = t\n        self.output = np.zeros(t.shape)\n\
    \n    def ThisIsfeedforward(self):\n        self.layer1 = sigmoid(np.dot(self.input,\
    \ self.weights1))\n        self.output = sigmoid(np.dot(self.layer1, self.weights2))\n\
    \n    def backprop(self):\n        error2 = (self.output - self.t) * sigmoid_derivative(self.output)\n\
