- fmt: "\n# Introduction ![](image_rsrc1YZ.jpg)\n\nThis book on artificial intelligence\
    \ contains proven steps and strategies on how to build a deep learning model that\
    \ can work better than humans. There was a time when I thought that artificial\
    \ intelligence was just a dream and that there was nothing to be worried about.\
    \ Over time, the dust settled down and everything became crystal clear, like flowing\
    \ water. However, as I grew up artificial intelligence grabbed hold of many ordinary\
    \ things that were once in the domain of humans. That was scary, to say the least.\
    \ One of the things I feared and worried about the most is the fear of losing\
    \ my job. People said and magazine articles spun the scare that artificial intelligence\
    \ was going to take over the jobs that humans once had. \n\nOne night I had a\
    \ dream. I saw in the dream that there was a giant robot that was developed by\
    \ a company to lift heavy pieces of steel to build bridges. The robot, named `Humongousteel`,\
    \ was so big that it would take a vertical chain of twenty humans to match its\
    \ height. Everyone in the dream was happy because the robot had made it the job\
    \ easy for humans by easing off the heavy burdens. `Humongousteel` was powered\
    \ by artificial intelligence systems that acted on the orders of human programmers.\
    \ The main job of `Humongousteel` was to pick up logs of steel from the warehouse\
    \ and carry it toward the site where a bridge was to be built. `Humongousteel`\
    \ was controlled by a dozen men who would coordinate its movements and actions\
    \ on the site. There was a big trailer that would transport `Humongousteel` from\
    \ the warehouse to the site where `Humongousteel` would unload itself and get\
    \ to work. The site, to say the least, was spectacular when the robot started\
    \ working. It would carry the steel pieces and install them and connect them.\
    \ Everyone appreciated it until it messed up at a working site. \n\nOne day `Humongousteel`\
    \ was working at the site when it lost contact with the control room from where\
    \ it used to receive instructions. We expected that the robot would not move until\
    \ the contact with the control room resumed, but that was not the case. The contact\
    \ was never lost. Something else had taken over the control of `Humongousteel`.\
    \ This was our first assumption. However, later on it was revealed that the artificial\
    \ intelligence system that powered the robot had become autonomous. The robot\
    \ destroyed the bridge that it had built and made the site a mess. It could not\
    \ be controlled until the rescue team arrived and successfully cut off the power\
    \ cords that connected the batteries to the neural system. Everyone had a sigh\
    \ of relief once the robot was brought under control. The dream ended and I thanked\
    \ God that it happened in a dream. \n\nSince that night, I started studying artificial\
    \ intelligence systems just to end my curiosity. Since the day I entered this\
    \ world, I realized that there was nothing scary about artificial intelligence\
    \ systems. They are not here to eliminate jobs but they are here to facilitate\
    \ creative jobs. Machines can only do the things which we order them to do. They\
    \ don’t think creatively. Creativity is something that is native to humans. And\
    \ it should stay like that. While machines do the boring stuff humans can focus\
    \ on the creative stuff like storytelling and developing characters. So, this\
    \ caused the start of my journey toward artificial intelligence systems. I learned\
    \ how to develop them and how to use them to ease off tough tasks. It turned out\
    \ to be fun. \n\nThis book is for those who are curious about artificial intelligence.\
    \ An artificial intelligence system is backed by deep learning models that are\
    \ built by `Python` programming language. Therefore, it is necessary that if you\
    \ are looking forward to entering the world of artificial intelligence and machine\
    \ learning, you should be an expert in writing code in `Python`. \n\nThis book,\
    \ for the ease of reading, is divided into different chapters that then further\
    \ divided into different sections so that you will be able to skim it and read\
    \ easily.\n\n## Basics of Python Language\n\nThe first chapter of the book deals\
    \ with the basics of `Python`. I will give you a run through the basics of `Python`\
    \ programming which is building block of deep learning models. The first section\
    \ of the chapter will explain to you what `Python` variables are and how you can\
    \ use them in coding. These variables are basic features of programming because\
    \ you will have to use them for storing different types of information such as\
    \ `text`, `float`, and `integer`. Once you have stored them, you can use them\
    \ later on. \n\nThe next section of the book will focus on creating `string` variables\
    \ and using them in `set`. The next section will shed light on topics of syntax\
    \ errors. The most common syntax errors are using single quotes. Once you see\
    \ how error looks, you will be able to avoid them while you are writing a program.\
    \ \n\nThe next section of the chapter will shed light on `lists`. I will explain\
    \ to you how `list` looks like, how you can develop `list` in `Python`, what is\
    \ the limit of `list`, and how you should modify it by adding, removing, and editing\
    \ elements inside the list. `list` is wonderful in the sense that it allows you\
    \ to feed the program with as much information as you can. The most common and\
    \ interesting methods for removing elements are `del` and `pop`. Similarly, the\
    \ most interesting methods to add elements are `append` and `insert`. The chapter\
    \ ends on the explanation of what `tuple` is how you can create and use it.\n\n\
    ## Advanced Programming in Python\n\nThe second chapter of the book focuses on\
    \ advanced level programming in `Python`. The first section of this chapter will\
    \ focus on `input()` function which in `Python` becomes the most important thing\
    \ to learn because without this function, all you have to do is to define the\
    \ function, fill it in with `parameters`, and enter `arguments`. You can make\
    \ `call()` at any point in the same code and make the function run its course.\
    \ This is the easiest way to code and the most effective way as well. \n\nThe\
    \ next section revolves around `python functions`. A Python function is something\
    \ that helps you define a program once and then use it later on without going\
    \ through the process of coding. All you have to do is define the function, fill\
    \ it in with `parameters`, and enter `arguments`. \n\nThe next and last section\
    \ of the chapter reviews what `Python classes` are and how you can create them.\
    \ `Python classes` are the building blocks of object-oriented programming. They\
    \ are used to create real-life objects such as cars, cats, and dogs. In this book,\
    \ I will create `peacock` which will tell its name and age, which will stand up\
    \ and fly away when instructed. `Python classes` are the most wonderful features\
    \ of this language as they allow you to create complex programs.\n\n## Deep Learning\n\
    \nAfter you have gone through the features of `Python`, the next chapter will\
    \ walk you through the explanation of what deep learning is and how it affects\
    \ the world. The first on the line is a brief explanation of artificial intelligence\
    \ systems. I will explain what they are and how they are leaving an impact on\
    \ the world around us. The next section of the chapter will explain what machine\
    \ learning is and how it is affecting the world. \n\nThe next section of the book\
    \ deals with the explanation of deep learning models. Deep learning models are\
    \ what infuse life into artificial intelligence systems and machine learning models.\
    \ I will explain in the next section how deep learning models work, what are the\
    \ driving factors behind these models and what is the mechanism that pushes them\
    \ through. The most important section is the one that explains how deep learning\
    \ models differ from traditional machine learning models. The chapter ends on\
    \ a thorough explanation of different deep learning model examples. This is interesting\
    \ as you will come to know what systems around you deep learning models power.\n\
    \n## Intelligence Systems\n\nThe fourth chapter of the book deals with artificial\
    \ intelligence systems. At the start of the chapter, I will explain why you should\
    \ enter the world of artificial intelligence. Learning artificial intelligence\
    \ and machine learning is just like developing yourself as a teacher who teaches\
    \ machines to act in a certain way. It is about making machines efficient and\
    \ effective in their operations. \n\nAfter I have explained artificial intelligence\
    \ to the depths, I will then proceed toward explaining different types of artificial\
    \ intelligence:\n- **Artificial Narrow Intelligence**: A low-grade artificial\
    \ intelligence, in use by `Tesla` for self-driving cars and by `Amazon` to power\
    \ `Alexa`.\n- **Artificial General Intelligence**: A stronger version of artificial\
    \ intelligence that can surpass humans in different fields of work. They possess\
    \ intelligence that comes real close to that of humans.\n- **Artificial Superintelligence**:\
    \ Yet hypothetical but the strongest form of artificial intelligence. It is capable\
    \ of surpassing humans in intelligence and in wrapping up different tasks.\n\n\
    ## Applications of Artificial Intelligence\n\nThe next chapter gives you a comprehensive\
    \ view of the applications of artificial intelligence and different machine learning\
    \ models. The first section is highly important as it deals with the role of artificial\
    \ intelligence in the healthcare sector. I will explain how artificial intelligence\
    \ is helping people in conducting medical imaging. An artificial intelligence\
    \ system is not only faster than a human system but it also is the most efficient\
    \ in terms of delivering results.\n\nThe next in line is the building and use\
    \ of virtual nurses which lowers the transmission of diseases and bacteria to\
    \ patients. It also makes the process of medication and healthcare highly efficient.\
    \ I will then go on to explain how artificial intelligence can help healthcare\
    \ professionals in conducting a targeted diagnosis.\n"
