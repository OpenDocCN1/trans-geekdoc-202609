    of historical data for tracking performance against a set of goals. The performance
    metrics are generally displayed on a customized dashboard. The next process is
    known as descriptive analytics and it uses multiple primary data analysis to sort
    out what has happened. Other processes that come into play are data visualization,
    visual analysis, and data preparation.


