  trans: "\n\n# 第二章：高级 Python 编程\n\n编程也涉及一组条件。有时你必须测试不同的条件。`if` 语句允许你测试某些条件并做出正确的响应。本章将带你了解\
    \ Python 的高级编程。你将学习编写 `if` 语句。你还将学习如何创建复杂的语句。\n\n```python\ncomputer_accessories\
    \ = ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\nprint(computer_accessories)\nfor computer_accessory\
    \ in computer_accessories:\n    if computer_accessory == 'keyboard':\n       \
    \ print(computer_accessory.upper() + \" has been completely destroyed! It can\
    \ never be rebuilt. \")\n    else:\n        print(computer_accessory.title() +\
    \ \" has been completely destroyed! It can never be rebuilt. \")\n```\n\n```text\n\
    ===============================\nRESTART ================================\n>>>\
    \ ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\nMouse has been completely destroyed!\
    \ It can never be rebuilt.\nKEYBOARD has been completely destroyed! It can never\
    \ be rebuilt.\nMonitor has been completely destroyed! It can never be rebuilt.\n\
    Cables has been completely destroyed! It can never be rebuilt.\nCharger has been\
    \ completely destroyed! It can never be rebuilt.\nBluetooth Connector has been\
    \ completely destroyed! It can never be rebuilt.\nWi-Fi has been completely destroyed!\
    \ It can never be rebuilt.\nModem has been completely destroyed! It can never\
    \ be rebuilt.\nInternet has been completely destroyed! It can never be rebuilt.\n\
    Webcam has been completely destroyed! It can never be rebuilt.\n```\n\n我将使用相同的元素列表并使用\
    \ `if-else` 语句来测试不同的条件。\n\n```python\ncomputer_accessories = ('mouse', 'keyboard',\
    \ 'monitor', 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet',\
    \ 'webcam')\nprint(computer_accessories)\nif 'mouse' in computer_accessories:\n\
    \    print('destroying mouse')\nif 'monitor' in computer_accessories:\n    print('destroying\
    \ monitor')\nif 'keyboard' in computer_accessories:\n    print('destroying keyboard')\n\
    ```\n\n```text\n===============================\nRESTART ================================\n\
    >>> ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\ndestroying mouse\ndestroying monitor\n\
    destroying keyboard\n```\n\n参见下方包含 `if-else` 语句的示例。\n\n```python\ncomputer_accessories\
    \ = ('mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
    \ 'wi-fi', 'modem', 'internet', 'webcam')\nprint(computer_accessories)\nfor computer_accessory\
    \ in computer_accessories:\n    if computer_accessory == 'mouse':\n        print('Mouse\
    \ has been destroyed.')\n    else:\n        print('Destroying ' + computer_accessory\
    \ + '.') \nprint ('\\n I have destroyed everything.')\n```\n\n```text\n===============================\n\
    RESTART ================================\n>>> ('mouse', 'keyboard', 'monitor',\
    \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam')\n\
    Mouse has been destroyed.\nDestroying keyboard.\nDestroying monitor.\nDestroying\
    \ cables.\nDestroying charger.\nDestroying bluetooth connector.\nDestroying wi-fi.\n\
    Destroying modem.\nDestroying internet.\nDestroying webcam.\nI have destroyed\
    \ everything.\n```\n\n## `raw_input()` 函数\n\n这也是 Python 世界中最重要的函数之一。某些程序要求你从用户获取输入。这个函数可以帮助你。它会暂停程序并等待用户填写某些信息。一旦接收信息，它就会将其存储在变量中，方便程序员处理。以下程序将重复你输入的任何内容。参见示例。\n\
    \n```python\nprompt = \"You need to say something to me and I will repeat it for\
    \ you:\"\nprompt += \"\\nYou must enter q if you want to exit out of program....\"\
    \nmessage = \"\"\nwhile message != 'q':\n    message = raw_input(prompt)\n   \
    \ print(message)\n```\n\n```text\n===============================\nRESTART ================================\n\
    >>> You need to say something to me and I will repeat it for you:\nJ\n...\nJohny\n\
    ...\nLisa\n...\nCherrypicking\n...\nOrchard\n...\nBlossoms\n...\nHunza\n...\n\
    q\n```\n\n参见 `input` 函数的另一个示例。上述代码运行得完美，但唯一的问题是它以实际消息的形式打印单词 `q`。通过添加一个简单的 `if`\
    \ 语句我们可以修复它。\n\n```python\nprompt = \"You need to say something to me and I will\
    \ repeat it for you:\"\nprompt += \"\\nYou must enter q if you want to exit out\
    \ of program....\"\nmessage = \"\"\nwhile message != 'q':\n    message = raw_input(prompt)\n\
    \    if message != 'q':\n        print(message)\n```\n\n## `break` 关键字\n\n你可以在\
    \ `while` 循环中使用 `break` 关键字在任何时候退出循环。`break` 语句调节程序的流。你可以添加它来控制代码行，查看哪些行被执行，哪些没有执行。这样程序就只执行你想要的代码。\n\
    \n```python\nprompt = \"\\nName the city you have been to:\"\nprompt += \"\\nYou\
    \ must enter q if you want to exit out of this program....\"\nwhile True:\n  \
    \  message = raw_input(prompt)\n    if message == 'q':\n        break\n    else:\n\
    \        print(\"I'd plan to visit \" + message.title() + \"!\")\n```\n\n```text\n\
    ===============================\nRESTART ================================\n>>>\
    \ Name the city you have been to: You must enter q if you want to exit out of\
    \ this program....\nParis\nI'd plan to visit Paris!\nName the city you have been\
    \ to: You must enter q if you want to exit out of this program....\nLondon\nI'd\
    \ plan to visit London!\n...\n```\n\n如果你使用的是 Python 3，`raw_input` 函数将变为 `input()`\
    \ 函数。\n\n## Python 函数\n\n让我们使用 `def` 创建一个简单的函数。\n\n```python\ndef greetings_user():\n\
    \    print(\"Hello!\")\ngreetings_user()\n```\n\n```text\n===============================\n\
