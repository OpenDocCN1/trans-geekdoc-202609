    # 第四章：人工智能


    本章将带你领略人工智能（AI）及其在现实世界中的应用。目前，我们在日常生活中被智能系统所包围。智能系统可以是互联网搜索、语音转文字以及生物识别脸识别等形式。无论形式如何，人工智能都是这些系统的核心。这些系统是复杂的应用程序。AI
    通过算法和数学的帮助运行这些应用程序。


    ## 为什么选择 AI？


    “人工智能”这个词出现于 1956 年。然而，由于先进的算法、海量数据的可用、存储容量的提高以及快速计算能力，它直到今天才获得普及。在 20 世纪 50 年代，AI
    处理的是问题解决技术。在之后的 1960 年代，AI 引起了美国国防部的关注，开始训练计算机以模仿人类的推理能力。国防高级研究计划局（`DARPA`）在 20
    世纪 70 年代完成了几个街道地图项目。这段早期的研究塑造了你在今天计算机中看到的自动化未来。


    AI 成为了科幻小说和好莱坞电影的主题。好莱坞电影中将 AI 描绘成比人类更有力量、并最终接管世界的超级机器人。然而，如今 AI 的演变并没有变得那么可怕。这些系统并没有聪明到可以控制人类。相反，AI
    正朝着积极的方向进化，并为每个行业带来了巨大的利益。


    AI 有能力对我们的生活产生深度影响。人工智能作为一个领域，试图破解不同实体的行为和模式。在 AI 的帮助下，我们尝试构建智能系统。人类大脑本身就是一个奇迹。我们惊叹人类大脑如何如此轻松地进行思考。我们能轻松识别物体、学习新事物和新语言、通过回答问题与不同的人交流，并执行许多我们可能从未想象过的复杂任务。AI
    帮助机器从经验中学习，使其适应新的输入，并执行以前只有人类才能完成的任务。我们在日常生活中遇到的大 AI 示例通常高度依赖自然语言处理（`NLP`）和深度学习。计算机通过使用最新技术，在处理大量数据并识别出数据中存在的某些模式后，被训练以完成特定的任务。


    ## 人工智能的重要性


    AI 是有益的，因为它提供了自动化重复学习。然而，它与机器人和硬件支持的自动化不同。AI 并不是试图实现手动工作的自动化，而是尝试执行频繁、计算机化且高量的任务，而不会产生一丝疲劳。如果你想建立一个挖掘并提出正确问题的高效系统，这种自动化需要人类的探究。


    人工智能让产品变得智能。它不是以个体状态销售的，而是改进了产品。以`Siri`为例，它为苹果产品增加了一个新功能。人工智能围绕着学习算法展开，这些算法允许数据进入程序。AI
    试图检测数据中的各种结构和规律，以便算法学习某些技能。算法不断学习并变成一个预测器。以一个自动下棋手为例。算法学习在国际象棋游戏中移动棋子。它还可以在在你完成一次购买后学习向你推荐什么产品。你是否想过，为什么在在线电子商务商店买完东西后，会在你的电脑屏幕上看到相似的产品。


    模型在持续获得新数据输入时会被采用。这种学习技术被称为`反向传播`（backpropagation），它允许模型在答案错误时进行调整。AI 试图通过使用具有许多隐藏层的`神经网络`（neural
    networks）来分析更深层的数据。由于计算能力缓慢且缺乏大数据而建立的 AI 模型现在需要大量的数据以便涵盖模型的所有特征。例如，如果模型被设计用于检测停止牌，你应该向模型投喂成千上万张不同角度、不同尺寸、颜色、维度和形状的停止牌照片。数据越多，你的准确性就越高。如果你设计和训练得当，AI
    可以非常准确。像`Alexa`和`Google Assistant`（谷歌助理）这样的深度学习模型在接触到新数据时不断改进。


    ## AI 的类型


    如果我能告诉你某种给 21 世纪带来革命的东西，那将是。人工智能模型已经进入了我们的生活，你必须了解现有的不同类型人工智能，它们能够识别物体，做出比人类更聪明的决策。


    ### 狭义智能（Narrow Intelligence）


    狭义智能是人工智能的一种，也被称为弱人工智能。这些机器可以执行低级的、狭义定义的任务集。机器没有思考能力，只执行一组预定义的函数。例如有`Alexa`、`Google
    Assistant`、`Siri`和`特斯拉的自动驾驶汽车`。它们之所以是弱，是因为开发者将它们设计成这样。


    ### 通用智能（General Intelligence）


    与之前的类型相比，通用智能是一种相对更的人工智能。`AGI`被认为是人工智能可能演化的阶段，在该阶段，机器拥有在没有任何外部干预的情况下独立思考和决策的能力。这让人工智能更接近人类大脑。目前，还没有这种人工智能的例子，但有争论认为这些系统很快就会开发出来并赋予生命。将会像人类一样聪明的机器，它们在短时间内产生将比人类更多的工作。


    `特斯拉`的执行官埃隆·马斯克和`Facebook`的执行官马克·扎克伯格曾就人工智能的未来陷入了口舌战。尽管前者被认为是通过将人工智能注入`特斯拉汽车`来赋予其生命的先驱，但他却是最担心人工智能革命的人。他并没有预料到人工智能革命会发生。他会有像人类一样聪明的机器，它们在短时间内产生将比人类更多的工作。


    埃隆·马斯克和马克·扎克伯格在人工智能的未来上陷入了争论（注：马克·扎克伯格认为人工智能的未来是不可避免的）。他担心人工智能系统会根据主人的指令来控制房屋。例如，如果他说“点炉”，炉火就会加热房屋；如果他命令关灯，房间就会变暗；如果他指示人工智能系统拉上窗帘，窗帘就会遮挡窗户。这种是超级智能，但并不是人类应该害怕的。马斯克担心的是人工智能系统的出现。他认为这种系统会毁灭人类。斯蒂芬·霍金曾警告世界，如果人工智能发展，将预示着人类的终结。它将夺控制并快速重新设计自己，而人类由于生物局限将无法完成，更不用取代它们。


    ### 人工超智能（Artificial Super Intelligence）


    人工智能被认为是通用人工智能的下一个阶段。这是人工智能系统将超越人类智能的阶段。目前，这种人工智能只是人类想象的产物。你只能在好莱坞电影和科幻小说中看到这种场景，在那里你会看到一群机器控制世界。然而，这种类型的人工智能作为我们的想象还能持续多久尚未知。由人工智能驱动的机器很快就会到达这一点。它们最终将到达这一点。以电影《机械机器人》为例。在这部电影中，威尔·史密斯饰演的是一个侦探的角色，他不相信制造强大人工智能系统的医生自杀了。一个大型组织开发了人工智能系统来制造作为仆人的机器人。他们已经向消费者出售了许多版本。有一天，人工智能系统失控了，所有在普通家庭服务的机器人都进入了它的控制而非人类的控制。人工智能产生了自己的思想，并指挥它连接的所有机器人劫人质。这就是仆人接管世界，机器人劫持人类的方式。


