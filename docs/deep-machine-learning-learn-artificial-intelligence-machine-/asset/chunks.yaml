    A feedforward is a basic calculus. You will have to add a feedforward function
    to the Python code. def ThisIsfeedforward(self): self.layer1 = sigmoid(np.dot(self.input,
    self.weights1)) self.output = sigmoid(np.dot(self.layer1, self.weights2)) You
    can calculate the goodness of the predictions by using the Loss Function. See
    how to use that function in the code. There are a number of loss functions and
    the nature of the problem must dictate the choice of the loss function. def Thisbackprop(self):
    d\_weights2 = np.dot(self.layer1.T, (2\*(self.t - self.output) \* sigmoid\_derivative(self.output)))
    d\_weights1 = np.dot(self.input.T,  (np.dot(2\*(self.t - self.output) \* sigmoid\_derivative(self.output),
    self.weights2.T) \* sigmoid\_derivative(self.layer1))) self.weights1 += d\_weights1
    self.weights2 += d\_weights2 Applications of Artificial Neural Networks If I must
    explain an artificial neural network, I can easily do that by taking the example
    of a human being. A child learns things when you teach him or her. Parents and
    teachers play a crucial role in educating them. Later on, the learning process
    goes on through self-learning and practicing. Researchers and scientists are struggling
    to make machines intelligent just like humans and ANNs are playing an important
    role due to the below-mentioned reasons. With the help of neural networks, you
    can find the solution to different problems that are impossible to be solved by
    algorithmic methods. Neural networks learn by example; hence you don’t have to
    program them on end. All they take is the initial dose of coding and they keep
    on learning and educating themselves. They are highly accurate and they speedier
    than a traditional machine learning network. Speech Recognition This is one of
    the most frequent uses of Artificial Neural Networks. Speech occupies a visible
    and vital role in human to human interaction. Therefore, it is natural for people
    to feel the need to expect speech interfaces with machines. However, even as the
    world has immensely progressed, humans still require some sophisticated languages
    to communicate with machines. These languages are hard to learn. To ease off the
    communication barrier and to flatten the learning curve, there is a simple solution
    to the problem. Communication should be done in a medium that is easy for the
    machine to understand. And there has been great progress in this field as well.
    However, problems such as limited vocabulary and grammar pop up off and on and
    try to sabotage the progress. ANNs are considered as the game-changer in the field
    of communications with machines. You can use multiplayer networks, self-organizing
    feature maps, and multiplayer networks that have recurrent connections for the
    purpose. The most important network is Kohonen''s self-organizing feature map.
    This network will map out similar kinds of phonemes in the form of an output array,
    which is dubbed as a feature extraction technique. After the network has extracted
    the features with the help of acoustic models, it will start recognizing the speech.
    Signature Verification Signature verification is one of the most important ways
    to stay secure while authenticating a person during legal transactions. This is
    a non-vision based technique. The first approach is the extraction of a geometrical
    feature set that represents a particular signature. When you have got these feature
    sets, you can train the artificial neural networks by writing a neural network
    algorithm. The trained neural network will label signatures as fake or genuine. '
