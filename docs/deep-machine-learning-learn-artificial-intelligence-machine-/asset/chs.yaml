  \ 循环中使用 `break` 关键字在任何时候退出循环。`break` 语句调节程序的流。你可以添加它来控制代码行，查看哪些行被执行，哪些没有执行。这样程序就只执行你想要的代码。\n\
  \n```python\nprompt = \"\\nName the city you have been to:\"\nprompt += \"\\nYou\
