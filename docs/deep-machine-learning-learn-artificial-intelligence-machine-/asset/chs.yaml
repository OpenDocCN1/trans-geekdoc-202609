- "# 深度机器学习：使用高级深度机器学习技术与方法学习人工智能与机器学习算法\n\n\n\n![](img/image_rsrc1YX.jpg)\n\n![](img/image_rsrc1YY.jpg)\n\
  \n\n![](img/image_rsrc1YZ.jpg)\n\n\n\n\n\n\n# 引言 ![](img/image_rsrc1YZ.jpg)\n\n\
  这本关于人工智能的书包含了经过验证的步骤和策略，教你如何构建一个比人类表现得更好的深度学习模型。曾有一段时间，我以为人工智能只是一个梦想，没有什么好担心的。但随着时间的推移，尘埃落定，一切都变得清晰可见，宛如流水一般。然而，随着我的成长，人工智能已经接管了许多曾经属于人类领域的普通事务。至少可以说，这非常令人恐惧。我最恐惧和担心的事情之一就是对失去工作的恐惧。人们议论纷纷，杂志文章也散布恐慌，称人工智能将接管人类曾经拥有的工作。\n\
  \n一天晚上，我做了一个梦。梦中我看到一家公司开发的巨型机器人，用于吊起沉重的钢材来建造桥梁。这个机器人名为 `Humongousteel`，它体型巨大，需要二十个个人垂直排成一排才能与之等高。梦中的每个人都很开心，因为机器人通过减轻沉重负担，让人们的工作变得轻松了。`Humongousteel`\
  \ 由人工智能系统驱动，这些系统根据人类程序员的指令行动。`Humongousteel` 的主要工作是从仓库搬运钢木并将其运往建筑桥梁的工地。`Humongousteel`\
  \ 由十几个男人控制，他们在现场协调机器人的移动和动作。有一辆大拖车会将 `Humongousteel` 从仓库运到工地，在那里 `Humongousteel`\
  \ 会自行卸下货物并开始工作。至少可以说，当机器人开始工作时，现场景象非常壮观。它会搬运钢件、安装并连接它们。在它在某个工地出错之前，每个人都赞赏它。\n\n\
  一天，`Humongousteel` 在工地工作时，失去了与以前接收指令的控制室的联系。我们原以为机器人在与控制室恢复联系之前不会移动，但事实并非如此。联系从未丢失。是其他东西接管了\
  \ `Humongousteel` 的控制权。这是我们的第一个假设。然而，后来被发现驱动机器人的人智能系统已经变得自主了。机器人摧毁了它建造的桥，并让现场变得一片混乱。直到救援队到达并成功切断连接电池与神经系统的电源线，它才无法被控制。一旦机器人被控制，每个人都松了一口气。梦结束了，我感谢上帝这只是发生在梦里。\n\
  \n从那个晚上开始，我开始学习人工智能系统，为了消除我的好奇心。自从我进入这个世界起，我意识到人工智能系统并没有什么可怕的。它们的出现不是为了消除工作，而是为了促进创造性工作。机器只能执行我们命令它们做的事情。它们不会创造性地思考。创造力是人类天生的特性。它也应该保持如此。当机器处理无聊的任务时，人类可以专注于讲故事和开发角色等创造性事务。因此，这开启了我通往人工智能系统的旅程。我学会了如何开发它们，以及如何使用它们来减轻艰巨的任务。事实证明很有趣。\n\
  \n这本书是写给对人工智能好奇的人的。人工智能系统由 `Python` 编程语言构建的深度学习模型支持。因此，如果你渴望进入人工智能和机器学习的世界，那么你必须成为\
  \ `Python` 代码编写的专家。\n\n为了方便阅读，本书分为不同的章节，每个章节又进一步分为不同的小节，以便你能够快速浏览并轻松阅读。\n\n## Python\
  \ 语言基础\n\n书的第一章介绍 `Python` 的基础知识。我将带你回顾一遍 `Python` 编程的基础，这是深度学习模型的构建基石。本章的第一节将向你解释\
  \ `Python` 变量是什么以及你如何在代码中使用它们。这些变量是编程的基础特征，因为你必须使用它们来存储不同类型的信息，如 `text`、`float`\
  \ 和 `integer`。一旦存储了它们，你稍后就可以使用。\n\n书的下一节将侧重于创建 `string`（字符串）变量并在 `set` 中使用它们。下一节将介绍语法错误主题。最常见的语法错误是使用单引号。一旦你看到错误长什么样，你在编写程序时就能避免它们。\n\
  \n本章的下一节将介绍 `lists`（列表）。我将向你解释 `list` 是什么样的、你如何在 `Python` 中开发 `list`、`list` 的限制是什么，以及你如何通过添加、删除和编辑列表内部的元素来修改它。`list`\
  \ 的妙之处在于它允许你向程序提供尽可能的信息。删除元素最常用且有趣的方法是 `del` 和 `pop`。同样，添加元素最有趣的方法是 `append` 和 `insert`。本章以解释\
  \ `tuple`（元组）是什么以及你如何创建和使用它而结束。\n\n## Python 高级编程\n\n书的第二章侧重于 `Python` 中的高级编程。本章的第一节将关注\
  \ `input()` 函数，这在 `Python` 中成为最重要的学习内容，因为没有这个函数，你所做的只是定义函数、填充 `parameters`（参数）并输入\
  \ `arguments`（实参）。你可以在相同代码的任何点进行 `call()` 并让函数运行。这是最简单的编码方式，也是最有效的方式。\n\n下一节围绕 `python\
  \ functions`（Python 函数）展开。Python 函数是帮助你定义程序并在稍后使用的某种工具，你只需要定义函数、填充 `parameters`\
  \ 并输入 `arguments`。\n\n本章最后的一节回顾 Python 类以及你如何创建它们。\n\n## 深度学习\n\n在学习了 `Python` 的特性之后，下一章将带你了解什么是深度学习以及它如何影响世界。第一节是对人工智能系统的简要介绍。我将解释它们是什么以及它们如何影响我们周围的世界。本章的下一节将解释机器学习以及它是如何影响世界的。\n\
  \n书的下一节涉及深度学习模型的解释。深度学习模型为人工智能系统和机器学习注入了生命。我将在下一节解释深度学习模型是如何工作的、其背后的驱动因素是什么以及推动它们的机制是什么。最重要的章节是解释深度学习模型与传统机器学习模型的区别。本章以对深度学习模型示例的详细介绍作终。这很有趣，因为你将了解到深度学习模型驱动系统。\n\
  \n## 智能系统\n\n书的第四章讨论人工智能系统。在章节开头，我将解释你为什么要进入人工智能的世界。学习人工智能和机器学习就像你自己成为一名老师，教机器以某种方式行动。这是关于让机器运行高效且有效的。\n\
  \n在深入解释人工智能之后，我将继续解释不同类型的人工智能：\n- **人工智能**：低级的人工智能，被 `Tesla` 用于自动驾驶汽车，被 `Amazon`\
  \ 用于驱动 `Alexa`。\n- **通用人工智能**：更强大的人工智能版本，可以在不同的工作领域超越人类。它们拥有接近人类的智能。\n- **超级人工智能**：虽然是假设性的，但是人工智能最强大的形式。它能够在智能上超越人类并完成各种任务。\n\
  \n## 人工智能的应用\n\n下一章为你提供了人工智能和不同机器学习模型的全面视角。第一节非常重要，因为它涉及人工智能在医疗健康领域的作用。我将解释人工智能如何帮助人们进行医学成像。人工智能系统不仅比人类系统更快，而且在交付结果方面也是高效的。\n\
  \n接下来是虚拟护士的构建和使用，这降低了疾病和细菌向患者传播的风险。它还让药物和医疗保健变得高效。我随后将解释人工智能如何帮助医疗专业人员进行针对性诊断。\n\
  \n\n\n\n\n# 第一章：Python 基础\n\n本章将带你了解 Python 编程的基础知识，因为你需要的这些知识来使用深度学习技术构建人工智能和机器学习模型。Python\
  \ 是深度学习模型的构建基石。\n\n第一步是检查你的计算机系统中是否安装了 Python。如果没有，你需要在你的计算机操作系统上安装一个 Python 编辑器。文本编辑器是动态的，它们识别\
  \ Python 代码，并在你编写时高亮不同的部分。这使得代码的结构变得易于理解。\n\n第一步是理解 Python 环境。Python 在不同的操作系统上可能略有不同。通常情况下，市面上有两个版本的\
  \ Python：`Python 2` 和 `Python 3` 在不同系统中很容易识别。Python 仍在处于进化过程中，因为随着新思想和技术的不断出现，每种编程语言都在尝试成长。Python\
  \ 的开发者让这种语言变得强大且多功能。大多数变化被认为是难以察觉的。随着操作系统不断演进，旧版本的 Python（如 `Python 2`）功能可能不如最新的\
  \ `Python 3` 那么强大。\n\n如果你在系统中都预装了这两个版本，建议你使用 `Python 3`。`Python 3` 中有一个解释器，也被称为终端窗口。这允许你尝试不同版本的\
  \ Python，而无需起初先保存再运行程序。Python 是一种跨平台语言，这意味着你可以根据需要在不同的操作系统上运行它。Windows 系统没有预装 Python，因此你必须下载并将其安装到系统中。完成这些后，你将需要下载并安装文本编辑器。\n\
  \n## 安装 Python\n\n你需要检查系统是否已经安装了 Python。打开命令行窗口，并在“开始”菜单中输入命令。在终端窗口中输入小写的 `python`。如果你看到以下符号\
  \ `>>>`，说明系统已安装了 Python。如果系统中没有安装 Python，你可能会在屏幕上看到一条错误信息。\n\n如果系统中没有预装 Python，你需要访问\
  \ [www.python.org](http://www.python.org) 下载并安装 Python。当你打开该网站时，会有系列 Python 版本供你下载。选择你想要安装到系统中的版本并点击下载。文件下载到系统后，你应该开始启动安装过程。你还应该确保在安装过程的结束处勾选\
  \ `Add Python to PATH` 选项。这将使你的系统配置过程变得简单顺畅。\n\n## Python 变量\n\n你将在本节中学习在 Python\
  \ 程序中可以不同数据类型。你还将学习在变量中存储数据的过程，以及如何在程序中使用变量。Python 最基本的特性之一就是变量。\n\n在接下来的代码中，我将在\
  \ Python 中创建一个变量并给它赋值。\n\n```python\n>>> x = \" I am reading a book on deep learning\
  \ techniques to build AI models. \"\n>>> print(x)\nI am reading a book on deep learning\
  \ techniques to build AI models.\n```\n\n当我打印程序时，赋值给变量 `x` 的相同行已显示在我的计算机屏幕上。Python\
  \ 中的每个变量都持有某个特定的值，这个值基本上是与变量关联的信息。\n\n现在我将进入 Python 编辑器，你将需要在那里编写实际代码。我将使用相同的变量和值，并创建一个新变量并分配另一个值，看看\
  \ Python 是如何处理它们的。\n\n```python\n>>> x = \" I am reading a book on deep learning\
  \ techniques to build AI models. \"\n>>> y = \" AI is revolutionizing different\
  \ fields in the business world.\"\n>>> print(x)\n>>> print(y)\n```\n\n你可以通过点击“File”菜单并点击“New”来启动\
  \ Python 编辑器。会弹出一个窗口，你可以将其作为 Python 编辑器。你可以在编辑器中编写代码，然后点击 `F5` 运行。代码的结果将显示在 IDLE\
  \ 中。\n\n当你在 Python 中处理变量时，你需要注意一些规则。如果你违反了这些规则，将会导致错误。其他指南将帮助你写出更易读的代码。变量名可能包含数字、字母和下划线。它们可以以下划线开头，但不能以数字开头。例如，你可以将变量命名为\
  \ `x_1` 而不是 `1_x`。变量名中没有空格。然而，下划线应用于分隔不同的单词。例如，`print` 在 Python 中是内置。变量名必须简短但具有描述性。如果你在创建一个变量来描述，必须写完整的单词而不是单个字母。使用大写字母通常不会触发错误。\n\
  \n## 数据类型\n\n大多数程序定义了不同类型的数据并使用它们。收集不同类型的数据。Python 允许你分类不同类型的数据。我们将讨论的第一数据类型是 `strings`（字符串）。字符串非常简单。单引号或双引号内的任何内容都被视为字符串。\n\
  \n```python\n>>> x = \" I am reading a book on deep learning techniques to build\
  \ AI models. \"\n>>> y = ' AI is revolutionizing different fields in the business\
  \ world.'\n>>> print(x)\n>>> print(y)\n```\n\n在字符串中做的最简单的事情之一是更改单词的大小。查看以下代码并尝试如何更改单词和短语的大小。\n\
  \n```python\n>>> x = \" I am reading a book on deep learning techniques to build\
  \ AI models. \"\n>>> y = ' AI is revolutionizing different fields in the business\
  \ world.'\n>>> print(x.upper())\n>>> print(y.title())\n>>> print(x.lower())\n```\n\
  \n你可以看到我使用了三种方法来更改字符串的大小写。Python 允许对不同的字符串进行简单拼接。我们可以使用 `title` 方法来格式化字符串拼接的结果。\n\
  \n### 空格\n\n你可以向制表符、空格和行尾符号添加空白。空白可以让你更容易地组织输出并使其易于理解。\n\n```python\n>>> x = \"\\\
  tI am reading a book on deep learning techniques to build AI models.\"\n>>> y =\
  \ '\\nAI is revolutionizing different fields\\n in the business world.'\n>>> print(x)\n\
  >>> print(y)\n```\n\n### 语法错误\n\n你遇到的常见错误类型之一是语法错误。语法错误通常发生在 Python 无法识别程序的特定部分为有效代码时。例如，如果你在单引号内部使用撇号，将触发错误。\n\
  \n```python\n>>> x = \" I am reading a book on deep learning techniques to build\
  \ AI models. \"\n>>> y = ' AI is revolutionizing different fields in the business\
  \ world.'\n>>> print(x)\n>>> print(y)\n```\n\n你可能认为结果中没有错误信息，因为如果对字符串使用双引号，一切正常。如果你对字符串使用单引号，结果将是语法错误。\n\
  \n```python\n>>> x = 'I am reading a book on deep learning techniques to build AI\
  \ models.'\n>>> y = \"AI is revolutionizing different fields in the business world.\"\
  \n>>> print(x)\n>>> print(y)\n```\n\n你可以使用 IDLE 进行简单的计算，如：\n\n```python\n>>> 2 +\
  \ 4\n>>> 2 * 4\n>>> 2 / 4\n>>> 2 - 2\n>>> 4 % 2\n```\n\n由于 Python 中有不同类型的数据，因此在编写代码时极有可能遇到某些错误。更多情况下，你必须在\
  \ `message` 中使用变量的值。例如，你不能简单地将其写为字符串。\n\n```python\n>>> time = 1\n>>> message =\
  \ \"It is \" + time\n>>> print(message)\n```\n\n```\nTraceback (most recent call\
  \ last):\n  File \"C:/Users/saia computers/Desktop/p\", line 2, in <module>\n  \
  \  message = \"It is \" + time\nTypeError: cannot concatenate 'str' and 'int'\n\
  ```\n\n运行代码将显示上述错误。这意味着 Python 无法识别你所使用的信息类型。Python 不确定该如何解释你正在使用的整数值（`int`）。你必须将数字转换为字符串。\n\
  \n```python\n>>> time = 1\n>>> message = \"It is \" + str(time)\n>>> print(message)\n\
  ```\n\n## 列表\n\nPython 列表是项的集合，你可以按照特定的顺序将它们放在在一起。列表是非常有用的，你可以轻松地构建它们，向它们添加元素，并在程序运行时从它们中删除元素。方括号始终表示列表。\n\
  \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
  \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n>>>\
  \ print(computer_accessories)\n```\n\n### 访问列表\n\n当你在 Python 中构建列表时，可以通过索引轻松访问列表内部的元素。列表通常是排序的，并且每个项都有一个索引。\n\
  \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
  \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n>>>\
  \ print(computer_accessories[0])\n>>> print(computer_accessories[2])\n>>> print(computer_accessories[4])\n\
  >>> print(computer_accessories[5])\n>>> print(computer_accessories[7])\n>>> print(computer_accessories[11])\n\
  ```\n\n```\nTraceback (most recent call last):\n  File \"C:/Users/saia computers/Desktop/p\"\
  , line 7, in <module>\n    print(computer_accessories[11])\nIndexError: list index\
  \ out of range\n```\n\n错误消息的出现是因为你在最后输入的索引不属于列表中的任何元素。你可以根据特定需求对列表应用不同的方法来格式结果。\n\
  \n### 修改\n\n你可以通过添加、更改和删除元素来修改列表。列表是动态的，因此在程序运行时，你可以轻松地构建它们、向它们添加元素并从它们删除元素。例如，你可能创建一个游戏，玩家在游戏中构建并移除列表中的配件。每次他买一个，它就会被添加到列表中。\n\
  \n```python\n>>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables',\
  \ 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n>>>\
  \ print(computer_accessories)\n>>> computer_accessories[1] = 'biometric scanner'\n\
  >>> print(computer_accessories)\n```\n\n```\n['mouse', 'biometric scanner', 'monitor',\
  \ 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n\
  ```\n\n你可以很好地向列表添加元素。简单的方法是使用 `append` 方法。通过这种方法，你将项附加到列表的末尾。我将向同一个列表中添加项。\n\n```python\n\
  >>> computer_accessories = ['mouse', 'keyboard', 'monitor', 'cables', 'charger',\
  \ 'bluetooth connector', 'wi-fi', 'modem', 'internet', 'webcam']\n>>> computer_accessories.append('biometric\
  \ scanner')\n>>> print(computer_accessories)\n>>> computer_accessories.append('jockey')\n\
  >>> print(computer_accessories)\n>>> computer_accessories.append('gaming keyboard')\n\
  >>> print(computer_accessories)\n>>> computer_accessories.append('printer')\n>>>\
  \ print(computer_accessories)\n>>> computer_accessories.append('scanner')\n>>> print(computer_accessories)\n\
  ```\n\n你可以从列表中使用单个值。\n\n```python\n>>> computer_accessories = ['mouse', 'keyboard',\
  \ 'monitor', 'cables', 'charger', 'bluetooth connector', 'wi-fi', 'modem', 'internet',\
  \ 'webcam']\n>>> x = \"I will have to buy from the computer \" + computer_accessories[2].title()\n\
  >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[0].title()\n\
  >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[3].title()\n\
  >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[5].title()\n\
  >>> print(x)\n>>> x = \"I will have to buy from the computer \" + computer_accessories[7].title()\n\
  >>> print(x)\n```\n\n使用 `insert` 方法可以在特定索引处添加元素。\n\n```python\n>>> computer_accessories\
  \ = ['mouse', 'keyboard', 'monitor', 'cables', 'charger', 'bluetooth connector',\
  \ 'wi-fi', 'modem', 'internet', 'webcam']\n>>> print(computer_accessories)\n>>>\
  \ computer_accessories.insert(0, 'biometric scanner')\n>>> print(computer_accessories)\n\
  >>> computer_accessories.insert(2, 'jockey')\n>>> print(computer_accessories)\n\
