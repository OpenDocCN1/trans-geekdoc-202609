  \ in Healthcare”之后的段落出现了多次重复。以下是基于原文中不重复部分的逻辑翻译：)*\n\n## 医疗保健中的 AI\n人工智能为医疗行业提供了多项优势。随着人工智能进入医疗领域，我们现在可以安全地将临床决策和传统分析放在一边。学习算法可以非常精确，因为它们与海量涌入的数据进行交互。它们扫描和筛选大块数据的能力让医疗专业人员能够对各种治疗、多种诊断、医疗流程及其各自的结果产生深刻见解。\n\
  \n### 医学影像中的 AI\n人工智能在进行医学影像诊断方面可以提供巨大的帮助。在放射领域，人工智能的进入在过去几年中引起了广泛关注。这一方向的大额投入证明了，当涉及到将人工智能整合到医疗行业时，医学影像是多么处于议程之中。随着人工智能进入医学影像领域，医疗专业人员现在可以进行个性化治疗并顺畅地传输结果。医生现在能够诊断各种心血管疾病、骨折和深层伤。说人工智能已经转型并彻底改变了医疗行业并不夸张。\n\
  \n### 虚拟护士\n人工智能可用于构建虚拟护士，高效地协助和监控患者。它们还可以监测和调节随访期间的用药时间表。你可以为这些护士提供各种数据以使它们变得更强大。这些护士拥有的百科全书知识越多，它们与不同患者的互动就越好。一个强大的知识库可以使他们能够在没有医生调介的情况下为患者提供必要信息。这将节省医疗行业的时间资源。你可以对\
  \ AI 进行建模以理解不同类型的文本和图像。你还可以将其与人类的情感相结合，以个性化患者的体验。\n\n### 目标诊断\n随着来自不同方面的多元医疗数据涌入，人工智能必须先对数据进行分类，然后利用它来教育自己并形成网络。在医疗数据的宇宙中，AI\
  \ 可以分类结构化或非结构化数据。结构化学习涉及`Neural Network System`、`Machine Learning (ML)`和`Modern\
  \ Deep Learning`。然而，所有非结构化数据都使用了`Natural Language Processing (NLP)`。\n\n在机器学习技术中，系统使用分析算法来检测特定的患者特征，包括在患者拜诊医生时收集的信息。这些特征包括身体状况、实验室检查、药物详情、症状、诊断、诊断影像和特定疾病相关的数据。机器学习技术帮助医疗专业人员确定患者治疗的各种结果。例如，神经网络技术被用于乳腺癌的诊断过程。最常见的机器学习被称为监督学习，在该学习中，系统获取患者的数据库信息并将其与患者的身体特征配对，以使结果更具针对性。现代深度学习与深度学习采用相同的输入，并将其引导至神经网络，神经网络可以被定义为简化输出的隐藏层。最终，这一过程帮助医疗专业人员总结和简化多次诊断的结果。这为诊断的确定性结论增加了支持。\n\
  \n自然语言处理类似于结构化数据处理。它专注于临床环境中的非结构化数据。当医生对患者进行检查时，这类数据从临床笔记流向文本处理。这些数据涵盖了实验室报告和体检叙述。该过程扫描充斥着相关关键词的历史数据库，这使得诊断变得快速高效，节省了医疗专业人员的时间。癌症和心血管疾病在大规模影响人类方面处于首位。因此，在早期检测和治疗方面必须不缺资源。人工智能在早期检测和治疗方面的资源不会短缺。\n\
  \n## 零售\n随着来自不同方面的多元医疗数据涌入，人工智能必须先对数据进行分类，然后利用它来教育自己并形成网络。在医疗数据的宇宙中，AI 可以分类结构化或非结构化数据。结构化学习涉及`Neural\
  \ Network System`、`Machine Learning (ML)`和`Modern Deep Learning`。然而，所有非结构化数据都使用了`Natural\
  \ Language Processing (NLP)`。\n\n*(此处省略由于原文重复导致的重复翻译段落，以符合“不要重复输出原文”的要求)*\n\n\n\n\
  \n\n# 第六章 数学术语详解 ![](img/image_rsrc1YZ.jpg)\n\n如果你想理解深度学习技术，你应该熟悉不同的数学概念，例如梯度下降、张量、微分和张量操作。为了构建深度学习模型，你需要一个充满数据的多维\
  \ `Numpy` 库。库中的数据存储在 `Numpy` 数组中，即张量（tensors）。目前所有的机器学习模型都使用这些张量作为数据的基础结构。如果你分析一个张量，我们会发现张量是一个存储数据的容器。你必须知道它存储的数据是数值。\n\
  \n## 标量 (Scalar)\n某些矩阵是 2D 张量。维度也被称为 `axis`（轴）。如果一个张量只包含一个数字，它被称为 `scale` 或 `scaler`\
  \ 量张量。它也被称为 `0D` 张量。`Numpy` 库中的 `float64` 和 `float32` 就是标量张量。标量张量没有任何 `axes`。张量中\
  \ `axes` 的数量也被标记为 `rank`（秩）。\n\n## 向量 (Vectors)\n多个数字组成的数组被称为 `vector`（向量）。有些人也称其为\
  \ 1D 张量。正如其名，它包含单一的 `axis`。如果一个向量有五个条目，它将被标记为 5 维向量。请记住，`5D` 向量不等同于 `5D` 张量。根本区别在于，`5D`\
  \ 向量在 `axis` 上有五个维度，而 `5D` 张量总共有五个 `axes`。它们沿着各个 `axes` 的维度数量可能不同。维度既可以是张量内 `axes`\
  \ 的数量，也可以是单个 `axis` 上的条目数量。\n\n## 矩阵 (Matrices)\n包含向量的数组被称为 `matrix`（矩阵）。它的另一个名称是\
  \ 2D 张量。两个 `axes` 通常被称为 `columns`（列）和 `rows`（行），你可以将 `matrix` 定义为数字矩形网格。第一个 `axis`\
  \ 上的条目被称为 `rows`，第二个 `axis` 上的条目被称为 `columns`。\n\n## 3D 张量 (3D Tensors)\n如果你以新数组的形式封装不同的矩阵，你将得到一个\
  \ `3D` 张量，你可以将其解释为数字立方体。如果你在数组内部封装 `3D` 张量，你就可以创建一个 `4D` 张量。以此此类推。\n\n通常由三个关键属性定义一个张量：\n\
  1. 第一个是 `axes` 的数量。例如，一个 `3D` 张量可能有三个 `axes`，而 `matrix` 拥有两个 `axes`。这在 `Numpy` 中也被称为张量的\
  \ `ndim`。\n2. 张量的 `shape`（形状）是一种整数元组，描述了每个张量沿着特定 `axis` 拥有多少维度。\n3. 然后是用于 `Python`\
  \ 库中用 `dtype` 符号表示的数据类型。这是包含在张量中的特定类型的数据。张量的类型可以是 `unit8`、`float64` 和 `float32`。在某些情况下你也会看到\
  \ `char` 张量。你必须注意，几乎不存在 `string` 张量。\n\n## 向量数据集 (Vector Dataset)\n这是数据方面最常见的情况之一。在这类数据集中，单个数据点可以很容易地编码为\
  \ `vector` 形式。因此，一批数据被编码为 `2D` 张量形式，即向量数组。这里第一个 `axis` 被称为 `samples axis`（样本轴），第二个\
  \ `axis` 被称为 `features axis`（特征轴）。\n\n以一个人员数据集为例，你需要考虑特定某人的年龄、收入和 `ZIP code`（邮政编码）。数据集中的每个人都应该被描述为一个包含三个值的\
  \ `vector`。因此，由 300,000 人组成的整个数据集可以很容易地封装在形状为 `(300000, 3)` 的 `2D` 张量中。\n\n还有一个文本文档数据集，我们根据某个单词在文中出现的次数来呈现每份文档。你可以在一个包含\
  \ 10,000 个单词的字典中计算此。每份文档都必须编码为具有 10,000 个值的 `vector`，其中每个值对应字典中每个单词的计数。因此， 400 份文档的整个数据集可以很容易地存储在形式为\
  \ `(400, 10000)` 的张量中。\n\n## 序列数据 (Sequence Data)\n当数据中的时间很重要时，将数据存储在具有显式 `3D` 结构的张量中更为明智。在这里，每个样本都应该被编码为\
  \ `3D` 张量形式。按照传统，`time axis`（时间轴）始终被视为第二个 `axis`。\n\n来看几个例子。假设有一个股票价格数据集。随着每一分钟过去，必须存储特定股票的当前价格，以及最低价和最高价。这样，每分钟都被被编码为\
  \ `3D` 向量。当一天结束时，如果交易日总共有 350 分钟，整个交易日被编码为 `(350, 3)`。\n\n你还可以形成一个多个推文的数据集，你可以编码包含\
  \ 250 个字符的单个推文。推文的每个字符都可以编码为大小为 128 的二进制向量——字母表数量为 128。然后你可以每条推文编码为形式为 `(250, 128)`\
  \ 的 `2D` 张量。如果你必须创建一个 100,000 条推文的数据集，它看起来将是 `(100000, 250, 128)`。\n\n## 图像 (Images)\n\
  通常，图像由三个维度组成，即颜色的 `width`、`height` 和 `depth`。类似的 `MNIST` 数字灰度图像具有单一颜色通道。它们可以存储在\
  \ `2D` 张量中。按照传统，图像被封装在 `3D` 张量中。灰度图像具有一维颜色通道。如果你有一批 256 张大小为 `128, 128` 的灰度图像，你可以将它们存储在形式为\
  \ `(256, 128, 128, 1)` 中。当我们讨论图像张量的约定时，有两种，即 `channels-first`（通道优先）约定和 `channels-last`（通道最后）约定。\n\
  \n\n\n\n\n# 第七：人工神经网络 ![](img/image_rsrc1YZ.jpg)\n\n本章将带你了解人工神经网络的构建过程。我将首先介绍什么是人工神经网络，然后解释与该过程相关的哪些安装包。你将学习到不同类型的神经网络。\n\
  \n## 人工神经网络的历史\n人工神经网络的历史可以追溯到 20 世纪 40 年代，当时沃尔特·皮茨斯（Walter Pitts）和沃伦·麦卡卡洛（Warren\
  \ McCullough）构建了一个基于算法的系统，旨在模拟大脑的功能。随着感知器（`perceptron`）算法的出现，构建人工神经网络的领域取得了进展。`perceptron`能够执行一些复杂的操作，如识别任务。\n\
  \n人工神经网络（`ANNs`）正在改变业务和日常生活。神经网络将人工智能（AI）推向了新的水平。机器经过训练可以学习并识别不同的模式。它们可以做出以前只有人类才能完成的预测。这就是它们也能解决人类每天遇到的各种问题的原因。神经网络本质上是基于算法的计算模型。它们具有独特的能力，可以从复杂或不精确的数据中提取意义，以定位模式并检测出人类大脑可能认为过于复杂的趋势。\n\
  \n人工神经网络减轻了人类面临的各种困难。你可以在 Gmail、Uber 和 Amazon 中发现它们。一旦经过有效训练，它们以后就不再需要你的帮助。它们将从遇到的任何数据中进行学习。\n\
  \n人类大脑由神经元组成，神经元是大脑的基本单元。人工神经网络与人类大脑相似之处在于，它们也包含许多根据需要处理并传输信息的神经元。人工神经网络的行为与人类大脑一致。无论是大脑还是人工神经网络，神经元都必须根据刺激调整其反应。如果一切运行良好，你将收到正反馈，这在未来更有可能触发。在负反馈的情况下，人工神经网络系统将进行学习，并且在类似的情况下不太可能触发。\n\
  \n人工神经网络是根据学习算法创建自我程序的统计模型。其基本目标是分类和理解或识别不同的概念和照片。输入可以比作人类大脑中的树突，而隐藏层可以比作细胞体。隐藏层夹在输入层和输出层之间。\n\
  \n一旦你构建了网络，就可以使用监督学习或无监督学习技术来训练它。人工神经网络之所以流行，最重要的因素之一是构建执行只有人类才能完成的任务的机器。简单来说，它们被设计为具有与人类相当的智能。人类大脑在学习新事物和适应变化环境方面非常奇妙。人工神经网络的设计方式使它们倾向于识别某些模式并自我教育。这些系统可以用于分类、分割和回归。在将给定数据输入神经网络之前，你必须将其转换为数值形式。\n\
  \n## 神经网络的解剖\n神经网络由多个层组合成一个网络或网络模型。输入数据是一层。然后是相应的目标。还存在一个损失函数（`loss function`），它在默认情况下定义了用于学习的反馈信号。神经网络中的优化器（`optimizer`）通常决定学习过程如何进行。由不同层组成的网络对输入数据进行映射，以便对某项活动进行预测。\n\
  \n`loss function`将运行这些预测并与目标值进行比较。这有助于模型产生特定的`loss value`（损失值），它是衡量预测结果与预期之间匹配程度的指标。这也为模型微调的下一步铺平了道路。优化器利用`loss\
  \ value`来更新网络的权重。\n\n### 层\n当你在深度学习中构建模型时，这些层被称为构建块。`layer`（层）是神经网络内部的基础性数据结构。它是一种数据处理结构，以张量（`tensors`）的形式接收输入并产生张量。某些层没有状态，但大多数层都有状态。不同的层被认为适用于多种格式的`tensor`和多种数据处理形式。\n\
  \n例如，向量数据被封装在 2D 张量中。这由全连接层（也称为`dense layers`，密集层）处理。更复杂的数据形式（也称为序列数据）被封装在包含样本、特征和时间步等属性的\
  \ 3D 张量中。这些通常以循环层的形式处理，例如图像数据和`LSTM`层。\n\n层（Layers）可以被看作深度学习世界的乐高积木。深度学习模型在`Keras`中构建，通过将不同的兼容层连接在一起来形成多个数据转换流水线。层的兼容性想法是指每个层只接受特定形状的输入张量，并返回特定形状的输出张量。如果你在`Keras`\
  \ 中工作，你不必担心兼容性问题，因为你想添加到模型中的所有层都可以为了匹配传入的层而动态构建。\n\n深度学习模型是层层叠加的神经网络。它们是由多个层组成的有向图。最常见的实例之一是不同层的线性堆叠，它可以将单个输入映射到特定的单个输出。随着模型的深入，你将遇到各种网络拓扑。一些常见的网络模型如下：列表顶端是双分支网络模型。然后是多头网络模型，最后是`inception\
  \ blocks`（起始区块）。网络的拓扑结构会尝试定义一个假设空间。选择正确的网络结构是一门艺术。该领域存在一些最佳实践，如果你想为模型找到合适的网络架构，还必须遵循某些原则。\n\
  \n## 损失函数\n一旦定义了网络架构，你就必须选择其他内容。我们将在下一节讨论的损失函数（`loss function`）是在期间需要最小化的特定数量。通过使用`loss\
  \ function`，你可以衡量任务的成功率。优化器根据损失函数决定你的网络如何更新。优化器将实现随机梯度下降（`stochastic gradient descent`，`SGD`）。具有多个输出的神经网络也可能有多个损失函数。为你的问题选择一个准确的目标函数非常重要。这意味着你的网络可能会采取任何捷径来减少损失。如果目标与成功不相关，它将弊大于利。AI\
  \ 训练是为了最大化全球人类的整体福祉。为了解决回归、分类和序列预测问题，有一系列必须遵循的简单准则。例如，你将使用`binary cross-entropy`（二分类交叉熵）来解决分类。要解决多分类问题，你必须使用`categorical\
  \ cross-entropy`（分类交叉熵）。\n\n## Keras\n`Keras` 是一种特定的深度学习 Python 系统，提供了一种易于定义目标的方法。它最初是为了让研究人员进行实验而开发的。`Keras`\
  \ 仍然非常有需求，因为它提供了在 GPU 和 CPU 上无缝运行相同代码的优势。`Keras` 用户友好，允许用户以快速高效的方式创建深度学习模型。`Keras`\
  \ 内置了卷积网络的支持，这是计算机视觉、循环神经网络的任何组合的基础。`Keras` 还支持多输入或多输出模型以及层共享。这意味着`Keras`非常适合构建从对抗到图灵的任何深度学习模型。由于`Keras`通常在\
  \ MIT 许可证下发布，即使商业活动也可以免费使用。你可以将其与 `2.7` 到 `3.6` 的任何 Python 版本相结合。`Keras` 拥有超过 200,000\
  \ 名用户，从学术研究人员到初创公司都有。如果你想知道在哪里实现了 `Keras`，你应该查看 `CERN`、`Google` 和 `Netflix`。几乎每个参赛的模型都是由\
  \ `Keras` 构建的。`Kaggle` 是一个进行机器学习竞赛的热门网站。`Keras` 是一个管理良好的库，通常为高层深度学习模型提供构建块。你必须将其用于张量操作和其他低级活动。`Keras`\
  \ 有一个经过优化的库来支持模型。\n\n## 深度学习工作站\n在设置工作站之前，建议在现代`NVIDIA GPU`上运行深度学习代码。某些如序列处理和图像处理的应用可能在中央处理器（CPU）甚至多核\
  \ CPU 上运行缓慢。在 GPU 上运行良好。如果你不想在电脑上安装 GPU，可以考虑在 Google 等云平台上运行深度学习实验。然而，你需要知道 GPU\
  \ 在你的口袋中可以发挥作用。无论你是在云端还是本地机器上运行，必须使用 Unix 系统（如 Ubuntu）。从技术上，可以使用 `Keras` 在任何情况下运行。对于\
  \ Ubuntu 用户，解决问题的简单方法是安装 Ubuntu。Ubuntu 将减少运行时间并让你免麻烦。\n\n## Jupyter Notebooks\n\
  `Jupyter Notebooks` 是运行深度学习实验最高效的方法。它们在数据科学和机器学习社区中被广泛使用。深度学习系统中的笔记本类似于 Jupyter\
  \ 应用生成的文件。你可以在浏览器中编辑文件。它允许用户将长时间实验分解分解小的部分并独立执行。这使得开发具有交互性。如果某个实验出现错误，你不需要重新运行之前的代码。\n\
  \n如果你没有 GPU 或不想在机器上安装一个，仍然可以在云端构建深度学习模型。`Jupyter Notebook` 提供了开始构建深度学习系统的简单方法。如果你打算购买一个，现代深度学习系统只能在这些显卡上运行。`NVIDIA\
  \ TITAN X` 被认为是深度学习的最佳显卡。对于预算有限的人，应该考虑 `GTX 1060`。\n\n## 神经网络的类型\n以下是不同神经网络类型的概述：\n\
  \n### 多层感知器\n这种神经网络用于三个目的：分类、语音识别和机器翻译。神经网络中的每个节点都连接到下一层的所有神经元。这些连接使得网络成为全连接。存在输入层和输出层，并且有隐藏层，这意味着总共有三层或更多。神经网络中还有反向传播；输入首先相乘，然后输入激活函数。当进行反向传播时，输入会被损失。简单来说，神经网络中的权重通常是学习得到的值。它们倾向于根据训练输入和预测输出之间的差异进行自我调整。\n\
  \n### 卷积神经网络\n卷积网络（`CNN`）包含多维神经元模式，而不是传统的二维模式。网络的第一层被称为卷积层。该层中的每个神经元处理来自视野较小部分的信息。输入特征以滤波的形式接收。网络扫描并理解图像的一部分，然后进行多次操作以完成完整图像的处理。处理涉及图像从\
  \ `RGB` 比例转换为灰度。增加像素值可能有助于网络检测图像中的任何变化。然后它将图像分为多个类别。卷积网络中的传播是单向的。`CNN` 可能包含单个或多个卷积层。网络的输出引导连接神经网络，然后由对图像进行分类。有过滤器提取图像的不同部分。`CNNs`\
  \ 被认为适用于图像分类、视频识别和语义解析。\n\n### 径基函数神经网络\n这种神经网络包含一个输入向量，后面是一层 `RBF` 神经元。输出层每个类别有一个节点。分类通常在测量输入与训练集中不同数据点的相似性后进行，在这些神经元存储了特定的原型。当需要对输入向量进行分类时，神经网络中的每个神经元会测量原型和输入之间的欧式距离。如果有两个类，即\
  \ `X` 和 `Y`，新输入将靠近类 `X`。因此，它被归类为 `X`。\n\n### 循环神经网络\n循环神经网络（`RNNs`）在程序员中非常流行，因为它们为简单的神经网络增加了一个有趣的技巧。这种技巧使得它们是独特的。`RNNs`\
  \ 通常设计用于在没有任何尺寸限制的情况下吸收一系列输入。`RNNs` 与普通神经网络不同，因为它们拥有强大的记忆并记得过去发生过什么。它们对过去的学习通常影响它们的决策。有些人可能会说基础的前馈网络也记得过去的事情，但它们记得的是在训练阶段学到的东西。例如，神经网络在训练阶段学习了分类。然后神经网络在生产阶段使用这些知识。\n\
  \n\n\n\n\n# 第八章 卷积神经网络\n\n卷积层被认为是卷积神经网络（CNN）的核心构建模块。卷积是滤波器的一种最简单应用，用于获得产生某种激活的输入。滤波器的反复应用会生成一张激活图，称为特征图（feature\
  \ map）。这指示了输入中某个特定特征的确切位置和强度。这可以是一张图像。\n\n卷积神经网络与简单神经网络的不同之处在于，它们可以在特定建模问题（如图像分类）的限制下，通过自我学习适用于特定训练数据集的各种滤波器。其结果是产生高度特异性的特征，你可以在任何地方检测到这些特征。卷积神经网络被认为是一种特殊的神经网络模型，专门设计用于处理二维数据。然而，它们也可以用于三维和二维数据类型。\n\
  \n卷积神经网络的核心是卷积层，这正是它使得该网络有了其独特的名称。这一特定层会执行一种通俗称为卷积的特定操作。它是一种线性操作，包括将权重与你输入网络的数据进行乘法。在这里，它的作用就像传统网络。这种技术是专为\
  \ 2D 输入设计的。卷积神经网络中的过滤器尺寸小于输入数据的大小。卷积神经网络中存在点积，它是过滤器和输入之间的逐元素乘法过程。它们的和被绘制出来，始终产生一个单一值。整个操作可以称为标量积。\n\
  \n如果你使用的过滤器比输入尺寸小，它将允许过滤器在输入数组的多个点通过乘法过程。过滤器被系统地应用到输入数据的不同重叠部分。如果你设计了过滤器来识别输入内部的特定特征，那么在整个输入图像上应用同一个过滤器将赋予过滤器在同一张图像的任何点找到相同特征的能力。可以说，过滤器将该特征作为参考点，以检测图像中其他地方的特征。这使得卷积神经网络非常精确且可靠。\n\
  \n过滤器与输入数组相乘的输出将是一个单一值。由于过滤器运行了多次乘法过程，因此结果将是一个包含输出值的 2D 数组。该数组也被称为特征图。一旦创建了特征图，你就可以将每个值通过非线性过程。将此卷积操作应用于图像数据这一概念对于卷积神经网络来说并不是新事。它已经在计算机视觉技术中得以实现。计算机视觉专家通过手动设计过滤器，然后将它们应用于特征图内部的特定图像。\n\
  \n卷积神经网络通常不通过单个过滤器进行学习。对于特定的输入，多个特征并行运行。卷积层对于某个输入并行学习 32 到 512 个过滤器是非常常见的。彩色图像每个颜色通道（如红、蓝、绿）包含多一个通道。从数据的角度来看，这意味着作为模型输入的单个图像实际上是三张图像的组合。滤波器的通道数必须与输入的通道数相同。这通常被称为卷积神经网络的深度。如果你作为模型输入的图像由三个模型组成，那么你需要对图像应用一个同样具有三个通道的过滤器。如果一个卷积层包含\
  \ 32 个过滤器，它们不仅是 2D 的，而且是 3D 形式的。每个过滤器都会产生一个特征图。这意味着具有 32 个滤波器的特定卷积层的输出深度为 32。\n\n\
  卷积层不仅应用于输入数据，还应用于每层的输出。当你堆叠这些层时，它构成了对你输入的的层次化分解。考虑这样一个事实：过滤器将逐渐学习诸如线条等特征的提取过程。通常作用在每层输出\
  \ 的过滤器可能会提取不同的特征，这些特征形成了某些低级特征的组合，而这些特征包含多条线以表达不同类型的形状。这个过程一直持续，直到超深层开始提取动物、脸部、房屋等。\n\
  \n## 构建 CNN\n\n在这一节中，我将向你解释如何借助深度学习和计算机视觉构建一个 MNIST 手写数字分类模型。MNIST 是修改国家标准技术研究所（National\
  \ Institute of Standards and Technology）数据集的缩写。它包含大约 60,000 张小型正方形灰色图像，带有从 0 到 9\
  \ 手写数字。模型的工作是将特定的手写数字图像分类为 0 到 9 的整数。MNIST 深度学习模型广泛应用于全球系统。一些顶级模型被称为深度学习卷积神经网络，它们可以达到\
  \ 99% 的准确率。你可以使用该数据集开发并练习利用卷积神经网络解决图像分类任务的方法。\n\n第一步是加载数据集。然后，我将为数据集中存在的图像准备像素。你必须将图像缩放到\
  \ `[0,1]` 范围。这涉及到将数据类型从整数转换为浮点数，然后将像素值除以最大值。接下来的是定义深度学习模型的过程。该模型将训练 10 个训练轮次（epochs），默认大小为\
  \ 32 个样本。\n\n```python\n## 这是针对 mnist 数据集的基准卷积神经网络模型\nfrom numpy import mean\nfrom\
  \ numpy import std\nfrom matplotlib import pyplot\nfrom sklearn.model_selection\
  \ import KFold\nfrom keras.datasets import mnist\nfrom keras.utils import to_categorical\n\
  from keras.models import Sequential\nfrom keras.layers import Conv2D\nfrom keras.layers\
  \ import MaxPooling2D\nfrom keras.layers import Dense\nfrom keras.layers import\
  \ Flatten\nfrom keras.optimizers import SGD\n```\n\n### 在这一步中，我将加载数据集、训练并测试它\n\n\
  ```python\ndef load_dataset():\n    # 这里是加载到系统的数据集\n    (trainX, trainY), (testX,\
  \ testY) = mnist.load_data()\n    # 我不会尝试重塑数据集以便获得单个通道\n    trainX = trainX.reshape((trainX.shape[0],\
  \ 28, 1))\n    testX = testX.reshape((testX.shape[0], 28, 1))\n    # 在这里你将看到独热编码和目标值\n\
  \    trainY = to_categorical(trainY)\n    testY = to_categorical(testY)\n    return\
  \ trainX, trainY, testX, testY\n```\n\n### 是时候开始缩放数据集中图像的像素了\n\n```python\ndef prep_pixels(train,\
