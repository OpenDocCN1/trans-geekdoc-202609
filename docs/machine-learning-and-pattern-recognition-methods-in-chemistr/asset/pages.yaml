- pgno: 44
  md: '# 1.4 Other regression techniques


    Although for many chemical problems the use of a linear regression model is often
    sufficient to provide reliable predictions and, in these cases, the large majority
    of the applications involve the use of one of the three techniques discussed above,
    sometimes the functional relation to be approximated by more complex and non-linear
    methods can be adopted. Since artificial neural networks (ANN) (Marini, Bucci,
    Magri, & Magri, 2008) and support vector machines (SVM) (Brereton & Lloyd, 2010)
    are described in other chapters of this book, here we will briefly mention how
    to implement non-linearities in the context of the models described so far.


    In the case of PCR, a non-linear relation between the Y- and X-block can be accomplished
    by augmenting the scores matrix with quadratic and interaction terms, for putting
    it estimating for the MLR model. For instance, if three PCs are extracted from
    the X-block, the scores matrix can be augmented as follows:


    ```

    $T_{aug} = [t_1 \ t_2 \ t_3 \ t_1^2 \ t_2^2 \ t_3^2 \ t_1\circ t_2 \ t_1\circ
    t_3 \ t_2\circ t_3] \quad (2.33)$

    ```


    where the symbol $\circ$ indicates Hadamard (element-wise) product of the two
    vectors. Then, the predicted response is estimated as a linear combination of
    the columns of $T_{aug}$.


    On the other hand, in the case of PLS (Berglund & Wold, 1997), non- can be imposed
    at the level of the inner relation, instead of Eq. (2.28), any non-linear function
    $f$ can be used to approximate the Y-scores from the X-scores (Wold, Kettah-Wold,
    & Skagerberg, 1989):


    ```

    $$\hat{u}_a = f(t_a). \quad (2.34)$

    ```


    Moreover, the same kernel trick used in the context of support vector machines
    (SVM) can also be coupled to PLS regression, leading to kernel PPS (Rosipal, 2003).


    # 2. Classification


    In chemometrics, “classifying” refers to the possibility of creating models that
    allow assigning samples to classes (or categories) on the basis of the chemical
    data for this purpose. The aims of classification are manifold; just to mention
    some, in the context of quality control, classifiers can be applied to establish
    whether samples deviate from compliant batches or not; otherwise, in forensic
    science, classification approaches are widely used in order to prevent frauds
    (e.g., food or drug adulteration).'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Classifiers belong to the pattern recognition methodologies, which can either
    be unsupervised, when they do not need any priori information about class-membership
    of samples, or supervised, when a training set of objects, whose actual class-belonging
    is known, is needed. In particular, classification techniques fall within the
    latter category of methods, for more information on unsupervised approaches the
    reader is addressed to [Albalate & Minkowski, 2013].


    Classification methods can be divided into two main families: discriminant and
    class-modeling approaches (Cocchi, Biancolillo, & Marini, 2018). The main difference
    between these two categories lies in the hyperspace of samples is divided into
    regions associated with the various classes. Applying discriminant approaches,
    the entire sample space is divided in many regions as the number of classes present
    in the investigated data set. Fig. 2.1 depicts how the sample hyperspace is divided
    when a three-class problem is solved by a discriminant (left plot) or a class-modeling
    (right plot) approach. In the former case, training samples belong to class A,
    class B, and class C, and the sample space is divided into three regions. As a
    consequence, each object will be uniquely assigned to the class-region it falls
    into. On the other hand, using class-modeling methods (right plot), each category
    is individually modeled, with the consequence that class-regions overlap and/or
    not cover all the samples'' space. A direct consequence of this is that some individuals
    fall in one class-region and they will be assigned to that class, some other could
    fall in an overlapping region, and they will be accepted by more than one class-model
    (confused samples), and eventually, some individuals will be rejected by all the
    class-models (i.e., they fall outside any class-region) and being labeled as outliers
    for all the categories.


    A brief description of some of the most common classifiers is provided in the
    subpar below.


    # 2.1 Linear discriminant analysis (LDA)


    One of the first, but still widely used, discriminant linear analysis is proposed
    by Fisher (1936). LDA is a discriminant parametric approach seeking the linear
    hyperplanes which allow dividing the samples'' space in an appropriate number
    of regions. As a parametric approach, it lays on the Bayes'' rule, and it is based
    on two main postulations:


    +   Each investigated individual should be assigned to the class it is most probable
    it belongs to


    +   Within each category, observations are normally distributed'
  merge: -1
  img_proc: true
