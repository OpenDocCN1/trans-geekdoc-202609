- pgno: 123
  md: '# 5. Future work


    NIR-HSI is gaining traction as a feasible technique for the detection and classification
    of microplastics directly in sand, soil, and marine sediments, which is an exciting
    prospect given the labor-intensive nature of separating microplastics from heterogeneous
    solid matrices. Given that this is a relatively new application of NIR-HSI, it
    is important to understand the limits and uncertainty associated with it. The
    results obtained clearly indicate that:


    +   (1) The NIR radiation penetrates the microparticle, suggesting a “translectance”
    effect between the sand and the plastic. This not only amplifies the signal of
    the microplastic, but also amplifies the signal of the sand, which appears to
    have high reflectivity power. The small size of the microparticle, together with
    its low thickness, suggests that even the spectra de located in the middle of
    the microparticle suffer from the high influence of the spectra of the sand.


    +   (2) The spectra of the edges of the microplastic are certainly highly affected
    by the scattering of the sand. This suggests uncertainty in the characterization
    of those pixels as microplastics, creating an uncertainty boundary that must be
    further studied.


    As before, this work is an introduction to a more complex topic where different
    theories and algorithms will be tested to calculate the spatial and spectral limits
    of detection.


    From a more general perspective, these results call into question the strategy
    of constructing libraries containing only the spectra of pure plastic and sand
    (or different varieties of sand). This chapter demonstrates that classification
    models using standardized signals might create too narrow of boundaries in the
    classification models, impeding their ability to find microplastics in environmental
    media.


    This last theory presented here about the limits of detection in the spatial and
    spectral domains requires further study. The proposal is not finished, since there
    are many aspects that should be considered. Concepts like analyte signal and linearity
    of NIR radiation will be evaluated to fully understand the capabilities of NIR-HSI
    and to assess the extent to which NIR-HSI, together with chemometrics, is able
    to give an accurate and reliable answer.


