    Let''s consider $A_{IF}$, $B_{JF}$, and $C_{KF}$ component matrices of a three-way
    array and $k$ stands Kruskal''s rank of the components matrices, and F is an array
    ranking. According to the Harshman''s, it is sufficient for uniqueness to have
    $A_{LF}$ and $B_{JF}$ of full-column, and $C_{KF}$ of k-rank 2 or higher (Harshman,
    1970). Kruskal proved that uniqueness is definite when:


    ```

    $K_A + K_B + K_C \geq 2F+2$

    ```


    Despite the Harshman sufficient condition, Kruskal has illustrated that a PARAFAC
    solution may be unique even none of the component matrices have a full-column.


    When $F=1$, the Kruskal condition cannot be achieved. However, Harshman has already
    proved uniqueness condition for the mentioned case (Harshman, 1970). An intuitive
    and accessible proof of Kruskal condition is provided by Steagem and Sidipoulos
    (2007). Sidipoulos and Bro generalized Kruskal result about the uniqueness of
    the trilinear decomposition (triadic decomposition) of the three-way array to
    the cases with multilinear decomposition of higher-order arrays (Sidipoulos &
    Bro, 2000). Sajjadi et. al. have visualized the rotational ambiguity in the PARAFAC
    model for the two-component array (Abdollahi & Sajjadi, 2010). Omidikia et. al.
    have investigated the uniqueness property of different three-component systems
    by direct visualization of feasible bands.


    # 3.1 Theoretical basis (Ghaffari & Abdollahi, 2018)


