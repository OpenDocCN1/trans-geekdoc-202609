  md: '# The analytical/measurement sources of multivariate errors 97


    ranging from zooplankton to marine mammals, and including filter feeders such
    as Mytilus edulis. The plastics themselves are not the only cause for concern,
    as their large surface area invites the adsorption of persistent organic pollutants
    (POP) and persistent, bioaccumulative, and toxic (PBT) chemicals (Kershaw, 2015).
    Lacking quantitative methods means little is known about the co-accumulation of
    microplastics with toxins, which are known to include polycyclic aromatic hydrocarbons
    and heavy metals (Xu Ma, Ji, Pan, and Miao, 2020).


    In the oceans, the problem extends to all five of the main ocean compartments—the
    surface, the water column, the seafloor, biota, and on the shoreline or buried
    in intertidal sediments (Kershaw & Rochman, 2015). Following 680 nets on 24 separate
    expeditions across the Atlantic, Pacific, and Indian Oceans, as well as the Mediterranean
    Sea, Eriksen et al. (2014) estimate that there are over 5 trillion plastic particles
    floating in the ocean. Concentrations as high as 890,000 pieces of plastic per
    square kilometer were measured in the Mediterranean Sea (Eriksen et al., 2014).


    However, there is a gap in the understanding of the exchange between compartments
    and a lack of knowledge of the quantity of plastic in each of compartments, except
    surface waters. Though the concentrations of plastics observed at surface are
    concerning, 4–23 more plastic is deposited on land than into oceans each year
    (Horton, Walton, Spurgeon, Lahive, & Svendsen, 2017). Beaching, or the deposition
    of plastics on beaches by tides and waves, is one process by which this occurs.
    In most cases, plastics with lower density than seawater float in surface waters
    and wash up on shores, especially at times of high wind speed, waves and daily
    river flow in estuaries (Lefebvre et al., 2021). Even so, there is an enormous
    mismatch between the amount of plastic believed to the natural environment and
    the amounts observed by scientists, in what is called the “missing plastic problem”
    (Cressey, 2016). The previously mentioned sampling expeditions found an order
    of magnitude more microplastic than predicted in their pre-estimation (Eriksen
    et al., 2014). As such, understanding terrestrial impacts and refining the techniques
    to identify and quantify plastic litter on land is of the utmost importance. Furthermore,
    this undercount of microplastic undermines the efforts to calculate the risk arising
    from plastics in the natural environment, because it is difficult to provide a
    confident measure of exposure levels (Kershaw, 2015).'
