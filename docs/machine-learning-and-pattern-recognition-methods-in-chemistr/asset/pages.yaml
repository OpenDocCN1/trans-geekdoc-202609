- pgno: 51
  md: 'example, in the case of asymmetric classification, i.e., when the focus is
    not on assigning all samples to one of the possible classes, but on modeling a
    specific category of interest, class-modeling methods may be more appropriate
    than the discriminant ones. In fact, these methods allow the individual modeling
    of the category of interest, and then all the investigated individuals can be
    accepted (and, therefore, predicted as belonging to the class without any further
    cogitation on its possible class-membership) by the model. Soft independent modeling
    of class analogies (SIMCA) Soft independent modeling of class analogies (SIMCA)
    is probably the most well-known class-modeling approach; it has been proposed
    by Wold in 1977 (Wold, 1976; Wold & Sjöström, 1977), and since then, various modifications
    have been proposed to its original formulation, in order to improve its efficiency
    (Derde & Massart, 1988; Pomerantsev & Rodionova, 2020).


    Basically, SIMCA starts from the assumption that the main characteristics of the
    samples belonging to the class of interest can be captured by a principal component
    analysis (PCA) model of proper dimensionality. Consequently, the first step of
    the algorithm consists of calculating a PCA model on the training individuals
    belonging to the class of interest:


    ```

    $$\mathbf{X}_g = T_g P_g^T + E_g$$

    ```


    where the symbols have the same meaning as in Eq. (2.18), while the subscript
    g indicates that the model is calculated only on the training samples of class
    g. $E_g$ indicates the residuals after approximating the matrix $X_g$ with $A_g$
    principal components. This parameter is a meta-parameter which should be optimized.
    This is usually accomplished by testing models with an increasing number of components
    and selecting the dimensionality, which leads to the highest classification efficiency
    (usually in cross-validation, see Section 3).


    Based on the projection expressed by Eq. (2.47), a distance of any individual
    to the model is calculated as a combination of its orthogonal distance (i.e.,
    the residuals after PCA projection, indicated as $Q_j$) and its (usually Mahalanobis)
    distance to the center of the scores space (indicated as $T_j^*$). The various
    implementations of SIMCA proposed in the literature differ in the way they combine
    scores and orthogonal distances into a single distance to the model, and as it
    will be discussed below, in the way they set a threshold in order to define acceptance
    or rejection by the class model (Pomerantsev & Rodionova, 2020).'
