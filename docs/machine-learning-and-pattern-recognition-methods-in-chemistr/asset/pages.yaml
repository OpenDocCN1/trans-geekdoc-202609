  md: '# 1. Regression


    related to the nature of the dependent variable(s) and will be discussed individually
    in the remainder of this chapter.


    Regression methods deal with modeling real-valued (quantitative) responses. In
    their simplest version, they postulate the functional relationship between the
    response(s) and the independent variables (predictors) is a linear one. Assuming
    the case of a single dependent variable y and x is a J-dimensional vector


    ```

    x = [x_1 x_2 ... x_j ... x_J] (2.2)

    ```


    can be expressed as:


    ```

    y = ŷ + e = b_0 + b_1 x_1 + b_2 x_2 + ... + b_j x_j + ... + b_j x_j + e (2.3)

    ```


    where ŷ is the approximation (predicted value) of the response provided by the
    linear function, which is univocally determined by the values of the coefficients
    b_1, b_2, ... by and of the intercept b_0 . On the other hand, e indicates the
    residual, i.e., the difference between the true and predicted value of the response.
    Here, it should be stressed that if centering between both x and y is assumed,
    the intercept becomes zero, in the remainder of the text, it will not be included
    in the models, i.e.,


    ```

    ŷ = b_1 x_1 + b_2 x_2 + ... + b_j x_j + ... + b_j x_j (2.4)

    ```


    As preliminarily introduced above, model building corresponds to estimating the
    values of the coefficients b_1, b_2, ... b_j given the training data, i.e., exploiting
    the fact that there is a set of observations for not only the x, but also the
    y is known. The aim of predictive modeling is to obtain accurate approximations
    of the dependent variable(s), in the majority of the cases, the definition of
    the optimal value of the coefficients involves some minimization of the residuals
    (least-squares criterion).


    As N training samples are available, the mathematical relationship described by
    Eqs. (2.3) and (2.4) should be valid for each of them and can then be generalized,
    in the case of the ith X-Y pair (x_i, y_i) as:


    ```

    y_i = ŷ_i + e_i = b_1 x_i1 + b_2 x_i2 + ... + b_j x_ij + ... + b_j x_ij + e_i
    = x_i^T b + e (2.5)

    ```


    where x_i^T is a row vector made up of the values of the independent variables
    for the ith sample, while the model (regression) coefficients are collected in'
  merge: -1
