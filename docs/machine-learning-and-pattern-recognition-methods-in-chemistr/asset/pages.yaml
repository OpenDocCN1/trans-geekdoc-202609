    \ & Neymeyer, 2014) can be applied for this purpose in three-component systems\
    \ by the use of a cost function that has the ability to apply soft constraints.\
    \ The idea behind the polygon algorithm is to approximate numerically each isolated\
    \ area of feasible solutions (AFS) by a successive increase in the size of predefined\
    \ polygons. The feasibility of a certain concentration or spectral profile with\
    \ the corresponding coordinates in the abstract space (1, $\\alpha$, $\beta$)\
    \ is checked by solving a computationally expensive minimization problem. In this\
    \ problem, a submatrix P ($2 \\times 2$) in T would be found to solve the factorization\
    \ problem with the considered constraints.\n\n```\n$$\\mathbf{T} = \\begin{bmatrix}\
