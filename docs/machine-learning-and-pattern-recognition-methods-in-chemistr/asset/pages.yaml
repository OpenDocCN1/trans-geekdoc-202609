  md: '# Machine learning and pattern recognition methods in chemistry


    zero and one, to assign a label to sample $x^{(i)}$, we need to use a thresholding
    method. A common choice for threshold value is $0.5$; therefore, if $h(x^{(i)});\theta)\geq
    0.5$, the sample is assigned to one; otherwise, it is assigned to class zero.
