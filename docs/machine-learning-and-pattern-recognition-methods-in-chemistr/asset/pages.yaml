    ```

    $q_{\phi}(\mathbf{z}|\mathbf{x}) = \mathcal{N}(\mathbf{z};\boldsymbol{\mu}, \text{diag}(\mathbf{s}))
    \quad (6.17)$

    ```


    The optimization objective of the variational autoencoder is the evidence lower
    bound, abbreviated as ELBO (or lower bound). For any choice of inference model
    $q_{\phi}(\mathbf{z}|\mathbf{x})$, including the choice of variational parameters
    $\phi$, we have:


    ```

    $$\log p_{\theta}(\mathbf{x}) = \mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})} \left[
    \log p_{\theta}(\mathbf{x}) \right] \left[ \frac{p_{\theta}(\mathbf{x}, \mathbf{z})}{p_{\theta}(\mathbf{z}|\mathbf{x})}
    \right]$\n\n$\mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})} \left[ \frac{p_{\theta}(\mathbf{x},
    \mathbf{z})q_{\phi}(\mathbf{z}|\mathbf{x})}{q_{\phi}(\mathbf{z}|\mathbf{x})p_{\theta}(\mathbf{z}|\mathbf{x})}
    \right]$\n\n$\mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})} \left[ \log \frac{p_{\theta}(\mathbf{x},
    \mathbf{z})}{q_{\phi}(\mathbf{z}|\mathbf{x})} \right] + \mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})}
    \left[ \log \frac{q_{\phi}(\mathbf{z}|\mathbf{x})}{p_{\theta}(\mathbf{z}|\mathbf{x})}
    \right] \quad (6.18)$

    ```


    The second term in above is the Kullback-Leibler (KL) divergence between $q_{\phi}(\mathbf{z}|\mathbf{x})$
    and $p_{\theta}(\mathbf{z}|\mathbf{x})$, which is non-negative


    ```

    $D_{KL}(q_{\phi}(\mathbf{z}|\mathbf{x})||p_{\theta}(\mathbf{z}|\mathbf{x})) \geq
    0 \quad (6.19)$

    ```


    and zero if, and only if, $q_{\phi}(\mathbf{z}|\mathbf{x})$ equals $p_{\theta}(\mathbf{z}|\mathbf{x})$.
    The first term in above is the evidence lower bound (ELBO)


    ```

    $$\mathcal{L}_{\phi} (\mathbf{x}) = \mathbb{E}_{q_{\phi}(\mathbf{z}|\mathbf{x})}
    \left[ \log p_{\theta}(\mathbf{x}, \mathbf{z}) - \log q_{\phi}(\mathbf{z}|\mathbf{x})
    \right] \quad (6.20)$

    ```'
