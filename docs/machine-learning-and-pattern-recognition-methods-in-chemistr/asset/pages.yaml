  md: '# The analytical/measurement sources of multivariate errors 115


    image was rescaled in both directions (using bicubic interpolation). By doing
    so, the spectral resolution is not affected, since the neighbor pixels are interpolations
    of the real pixels. Nevertheless, a better spatial resolution is obtained (Fig.
    5.8).


    Observing the raw spectra of the selected area (Fig. 5.8), it can be observed
    how the scattering of the pixels containing sand is much larger than the scattering
    of the pixels containing any trace of ABS spectrum. When the scattering is corrected
    (with SNV), it looks evident that the signal of the ABS in the pixels belonging
    to the microparticle is several degrees smaller than the signal of the pure plastic.
    The spectra of sand influence the spectra of the pixels containing the microplastic
    and leading to increased differences between their spectra and those of reference
    ABS.


    These observations, together with the previous results, point to answers to the
    questions posted at the very beginning of this chapter. Not only does the chemometric
    strategy play a fundamental role, it is of utmost importance to be aware of the
    effects of the chemometric strategy, the nature of the microparticle, the nature
    of the background, and the suitability of the instrument:


    +   - The instrument used in this study might not be the most adequate for this
    task. Better said, the limit of detection (spatial and spectral) of the instrument
    was not good enough.

    - It might also be that the chemometric strategies were not the most adequate
    ones. This opens up endless space for improvement. Nevertheless, the chemometric
    strategy is strongly linked to the database quality that is used. In this case,
    the strategy used for building the database is the most common strategy. This
    suggests that any spectrum in the sample should resemble to a certain degree to
    the spectra in the library.

    - It has been demonstrated that the multicomponent character of the sand (surroundings
    of the microparticle) also plays a fundamental role, especially if the NIR beam
    penetrates the microparticle and if the reflection intensities of the sand are
    much larger than the reflection intensity of the microparticle.

    - The microparticle is composed by the same material as the pellets used for building
    the database. Moreover, microparticles were measured at the same time and under
    the same conditions. Nevertheless, the spectrum of the microparticle is much smaller
    than the spectrum of the pure plastic. This demonstrates that there is a strong
    interaction between the spectra of the microparticle and the scattering effects
    of the spectra of the sand.'
