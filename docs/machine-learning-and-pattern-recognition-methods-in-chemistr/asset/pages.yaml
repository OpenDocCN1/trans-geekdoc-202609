    unseen data $x^*$ from the input space to the output space. The overall schematic
    of the machine learning approaches is shown in Fig. 3.1. As it is represented,
    the first step of machine learning algorithms is feature extraction in which and
    discriminative knowledge from the raw data is extracted. After extracting features
