    # 3. Trilinearity constraint


    Trilinearity constraint, which is based on the chemical information, guarantees
    the accuracy of unique profiles in the most favorite cases. Due to the trilinearity
    constraint, data arrays should contain some similar factors in their slices/modes,
    while the factors should be independent from experimental conditions. Thus, factors
    change proportionally (Cattell, 1944). Trilinearity is a very strong constraint
    that enforces trilinear decompositions to have unique solutions under mild conditions
    (Alier, Felipe, Hernández, & Tauler, 2011).


    In the most second-order data sets with trilinear structure, it is possible to
    extract the trilinear profile of the generic analyte. In this case, the trilinear
    behavior of the specific profile is the available real information, and knowing
    this information depends on the primary knowledge of the studied system. Applying
    this information in the qualified-way data resulted in a unique solution for the
    profile of the component of interest.


    Matrix-multivariate curve-alternating least square, MACR-ALS, as an extension
    of MCR-ALS, can be easily adapted to the trilinear analysis of the three-way data
    sets generated from data matrices with the same row or column and taken the advantages
    of their structure. Trilinearity constraint is incorporated into the MACR-ALS
    as a constraint, profiles of a component in data matrices are forced to have common
    shape during each ALS optimization and they may differ by a scaling factor. When
    this constraint is inserted into the ALS iterative optimization procedure, it
    forces the shape of the loading vectors to be the same in all matrices. A wonderful
    aspect of the trilinearity constraint in the ALS is that the application of this
    constraint for each component can be optional.


    Accuracy of the measurement is the main goal of analytical chemists. Programmers
    and mathematicians have been developing algorithms, which may produce “unique
    solution” based on the available information. Most of the algorithms provide only
    a solution at the end of the procedure but might not be necessarily the true solution
    (Rajkó, 2010). Trilinearity constraint, which is based on the chemical information,
    guarantees the accuracy of the resolved profiles due to the uniqueness property.
