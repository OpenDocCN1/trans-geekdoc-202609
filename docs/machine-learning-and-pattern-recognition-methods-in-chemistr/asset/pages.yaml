    chemical model. In addition, the feasible region of one unknown component was
    reduced. By incorporating a hard modeling constrain to soft modeling methods,
    and incorporating knowledge about some of the species, generally superior results
    can be obtained.


    It should be noted that the hard modeling constraint acts like the equality constraint
    and the rules of both are comparable. Only, exact mathematical functions are placed
    instead of a specific profile.


    # 6.1 Spectral curve-fitting constraint


    Hard modeling constraints can also be applied for spectral profiles if mathematical
    functional forms are imposed (peak-shaped models). Spectral hard modeling is also
    known as curve fitting or peak fitting. Curve-fitting methods have an old history
    in the literature and are used for quantitative resolution of systems. In these
    methods, spectra are fitted to sums of peak-shaped curves, e.g., Gaussian or Lorentzian
    shapes or combinations of Gaussian and Lorentzian functions, which are known as
    Voigt functions (Thorne, 1974).


    The effect of spectral hard modeling constraints on the feasible solutions of
    soft methods for simulated and real data sets was investigated. For each data
    set, the area of feasible solutions (AFS) were calculated. The AFS was transformed
    into real profiles and fitted to the summation of Voigt functions. All points
    in the feasible region fit the model well; thus, one can conclude that the peak-shaped
    models did not reduce the range of feasible bands. The data sets were adequately
    fitted to different Voigt models with the minimum number of peaks that gave a
    statistically sufficient model.


    Achieving an accurate, precise model of concentration profiles with hard modeling
    methods requires a significant amount of chemical information about the studied
    system. When sufficient chemical information is known, applying models for concentration
    profiles in SMCR methods can result in real, unique solutions. Lacking this type
    of information in the peak-shaped models of spectra results in non-unique solutions
    for spectral fitting. There are laws that govern the shapes of concentration profile
    models, i.e., the law of mass action, but there are no strong laws about spectra.
    We can only approximate them with a selection of Gaussian, Lorentzian, or Voigt
    functions. Applying a Voigt peak-shaped model without additional information as
    constraints on spectroscopic signals does not have any effect on rotational ambiguity
    in resolving bilinear data.'
