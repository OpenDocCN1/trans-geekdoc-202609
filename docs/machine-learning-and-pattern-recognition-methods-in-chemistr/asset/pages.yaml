    \ (i.e., latent variables) are also known as *canonical variances* (Krzanowski,\
    \ 2000).\n\nThe same reasoning can also be extended for the solution of multi-class\
    \ problems; for $G>2$, a sample is predicted as belonging to one category only\
    \ if its posterior probability of belonging to that class is higher than the probability\
