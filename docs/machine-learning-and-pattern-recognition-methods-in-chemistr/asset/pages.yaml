    Variational autoencoders are the marriage of directed probabilistic graphical
    models and neural networks. An effective method for understanding the general
    mechanisms of a system is using probabilistic modeling. These models formalize
    the notion of knowledge in a mathematically rigorous manner. Generally speaking,
    in probabilistic viewpoint, we allow a controlled level of ambiguity and randomness
    in the model. Using the concept of'
