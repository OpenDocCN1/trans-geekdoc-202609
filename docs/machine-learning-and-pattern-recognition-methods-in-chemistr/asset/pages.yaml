    The Unified Parkinson''s Disease Rating Scale (UPDRS) has four parts. Each part
    has multiple points that are individually scored, using zero for normal or no
    problems, 1 for minimal problems, 2 for mild problems, 3 for moderate problems,
    and 4 for severe problems. These scores are tallied to indicate the severity of
    the disease, with 199 points being the worst and total disability and 0 meaning
    no disability.


    Kazak (2019) used a dataset containing 5875 records from 42 patients diagnosed
    with early-stage Parkinson''s disease: 28 men and 14 women (about 200 records
    per patient). Each observation is described with the following variables: patient
    number, age, gender, time interval from baseline recruitment date, 16 vocal attributes
    based on biomedical measures, and Unified Parkinson''s Disease Rating Scale (UPDRS)
    scores, used for tracking symptom progression. The results show that this method
    is more effective than traditional linear methods.


