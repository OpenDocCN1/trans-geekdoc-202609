    where $z=g(\epsilon, \phi, \mathbf{x})$.\nAs a result, we can form a simple Monte
    Carlo estimator $\widetilde{\mathcal{L}}_{\theta,\phi}(\mathbf{x})$ for the individual-datapoint
    ELBO where we use a single noise sample $\epsilon$ from $p(\epsilon)$:


    ```

    $$\epsilon \sim p(\epsilon) \quad (6.30)\nz = g(\phi, \mathbf{x}, \epsilon) \quad
    (6.31)\n\widetilde{\mathcal{L}}_{\theta,\phi}(\mathbf{x}) = \log p_{\theta}(\mathbf{x},
    \mathbf{z}) - \log q_{\phi}(\mathbf{z}|\mathbf{x}) \quad (6.32)$

    ```


    The resulting gradient $\nabla{\mathcal{L}}_{\theta,\phi}(\mathbf{x})$ is used
    to optimize the ELBO using minibatch SGD. Detailed explanation, more examples,
    and pros and cons of VAE can be found in Kingma (2017).


    # ## 2. Applications


    In this section, we will present some utilizations of autoencoders in chemistry,
    biological and medical sciences. Of course, applications are not limited to these,
    and the basic idea in the previous section is suitable for other potential uses.


    # ## 2.1 De novo molecular design


    One of the most exciting fields in computational chemistry is the design and discovery
    of new molecules with desirable chemical and pharmaceutical'
