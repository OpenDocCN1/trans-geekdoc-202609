    # 4. Conclusions


    By applying soft constraints in SMCR methods, small deviations from the constraint
    settings are allowed. Apart from the algorithm used, this approach may yield more
    accurate results in many circumstances than obtained by applying hard constraints.
    The estimated profiles of the SMCR methods with soft constraints are more likely
    to have fewer active constraints and distortions. These advantages can be attributed
    to the increased control and flexibility in the implementation of the constraints.
    Several software implementations are available to users for incorporating a variety
    of soft constraints, most of which are described in the text. Among them, those
    who calculate the whole range of feasible solutions under soft constraints are
    especially helpful. Soft constrained AFSs often have fewer active constraints
    and are more likely to fit the original research hypothesis in comparison with
    hard constrained AFS segments. The boundaries can be tuned to allow acceptable
    levels of noise in a data set to propagate as small deviations into estimated
    profiles and estimate spectra that would otherwise not be allowed with hard constraints.
