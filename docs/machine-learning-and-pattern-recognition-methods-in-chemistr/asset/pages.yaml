  md: '# Preface


    Human has always been looking for a way to do two things: to count and to measure.
    Humanity owes the knowledge of the definitions of coordinates, distance, and,
    in principle, the very existence of quantitative measurements in the sciences
    to the invaluable efforts of the French mathematician and philosopher René Descartes.
    In most cases, measuring requires a tool that can be used to characterize an object
    or thing. At first, an object is stimulated by a variable and then its response
    is recorded. In other words, all beings have a minimum of characteristics that
    are either common or unique to them. That is to say, measurement aims to recognize
    differences and similarities between individuals. Observations and measurements
    create a large amount of data designated to each member of a statistical population.
    Now, by projecting these features in a coordinate system, we create a space where
    each target population member occupies a specific position. Let us not forget
    that objects in such a space can be close or far apart. Their distinction or essentially
    defined in terms of distances. Depending on the nature of the discipline, for
    instance whether it is natural or social sciences, a study demands a particular
    interpretation of space, distance, and similarity in regard to the members, objects,
    or individuals of the target community. In experimental sciences such as chemistry,
    measurements and observations, and any monitoring and investigation of objects
    in space, are to uncover the existence of buried relationships, patterns, and
    distribution and to find a quantitative mathematical relation that relates the
    attributes and properties of objects to responses or sometimes their characteristics.
    The former leads to subjects such as pattern recognition, classification, and
    clustering, and the latter results in concepts such as regression and calibration.


    Machine learning methods and artificial intelligence can perhaps be traced back
    to the work of the eminent English scientist Alan Turing. Then, tremendous advances
    in the development of new and powerful techniques in all scientific and technical
    disciplines have led to the provision of tools that have contributed significantly
    to the correct understanding of many phenomena.


    The use of machine learning and artificial intelligence methods in solving chemical
    problems to measure multiple species, despite the considerable overlap in the
    response and the identification of new compounds, is inevitable. Considering the
    explosive growth of low-cost devices and the large'
