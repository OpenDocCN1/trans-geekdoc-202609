    # 2. Basic concepts and theory


    # 2.1 Penalty alternating least-squares (P-ALS) algorithm


    The P-ALS algorithm (Gemperline & Cash, 2003) was developed as a strat-

    emy minimize the effects of noise and nonideal factors by enabling user

    control in the implementation of constraints. To achieve this goal, P-ALS

    follows the same steps discussed before to alternatively estimate the conc-

    tration profiles, C, and pure spectra, S, of the components; however, it

    applies a user-defined least-squares optimization approach to implement

    the constraints. The P-ALS algorithm can be summarized in the following

    steps as shown in Fig. 1.1.


    ![](img/1aed977a858463e62fc6af1793e4677c_12_0.png)


    ![](img/1aed977a858463e62fc6af1793e4677c_12_1.png)


    Fig. 1.1 Schematic representation of P-ALS algorithm for (top) finding the rows
    of the

    spectral matrix, S, and (bottom) finding the rows of the concentration matrix,
    C. (From

    Gemperline, P. J. & Cash, E. (2003). Advantages of soft versus hard constraints
    in self-

    modeling curve resolution problems. Alternating least squares with penalty functions.

    Analytical Chemistry, 75(16), 4236–4243.)'
