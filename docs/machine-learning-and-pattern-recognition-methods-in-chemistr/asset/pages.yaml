  md: '# Soft constraints in curve resolution problems 3


    no further improvement is seen in the estimated concentration or spectral profiles
    or when the maximum number of iterations is reached.


    Normally, the spectroscopic techniques that are employed do not give a selective
    response for each chemical species present in a mixture, and the chemical separation
    techniques (for example, chromatography) cannot isolate one or more species from
    the mixture in a pure state; thus, the applied constraints do not add sufficient
    information to completely resolve the curve resolution problem. In such cases,
    in most MCR fits, nonunique solutions are obtained. In such cases, it is recommended
    to calculate the whole range of feasible solutions for both identification and
    quantification purposes. There are different SMCR techniques for calculating the
    range of feasible solutions either by determining a useful approximation or by
    defining exact ranges. The interested reader is referred to a good review on this
    subject (Golshan, Maeder, and Abdollahi, 2013). However, in some circumstances,
    unique solutions can be obtained in SMCR under the implied constraints. The conditions
    that are required for getting unique solutions have been the subject of several
    papers (Karimvand et al., 2020; Lakeh, Abdollahi, and Rajkö, 2022; Rajko, Abdollahi,
    Beyramsoltan, and Omidikia, 2015).


    **Hard soft constraints.** One of the important factors that can affect the reliability
    of the MCR solutions is how the constraints are applied. Generally, there are
    two ways for introducing physicochemical information to the MCR model: hard and
    soft constraints. “Hard” constraints are strictly imposed on the model, while
    “soft” constraints accept small deviations from the previously known information.
    For example, small negative deviations are permitted when applying soft non-negative
    constraints. In practice, soft constraints are useful to allow for the effects
    of noise and ideal behaviors of chemical mixtures and responses. Several studies
    illustrate that applying soft constraints in SMCR models usually favors fewer
    active constraints and lower lock-of-fit in comparison with hard constraints.
    Thus, soft constraints are more likely to fit the original research hypothesis
    discussed before. Several algorithms have been proposed for implementing soft
    constraints in SMCR methods and also for studying the effect of these constraints
    on the range of feasible solutions. The main algorithms for imposing soft constraints
    are penalty alternating least squares (P-ALS) (Gemperline & Cash, 2003; Richards,
    Miller, & Gemperline, 2008), polygon inflation (Rahimdoust Mojdehi, Sawall, Neymeyr,
    & Abdollahi, 2016; Sawall et al., 2015), and grid search algorithm (Lakeh, Abdollahi,
    & Gemperline, 2020; Tavakkoli, Abdollahi, & Gemperline, 2020). The constraints
    that are implemented softly so far are non-negativity,'
