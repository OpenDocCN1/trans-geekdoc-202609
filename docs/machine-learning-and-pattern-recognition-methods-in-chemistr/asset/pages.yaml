  md: '# Table 5.1 Definitions of size ranges of plastics proposed by the MSFD technical
    subgroup on marine litter.


    | Plastic nomenclature | Size range |

    |---|---|

    | Macroscopic | >2.5 cm |

    | Mesoplastic | 5 mm–2.5 cm |

    | Large microplastic | 1 mm–5 cm |

    | Small microplastic | 1 µm–1 mm |

    | Nanoplastic | <1 µm |


    Gutow, Thompson, & Thiel, 2012). To the end of monitoring and characterizing microplastics
    in sediments, some protocols recommend a lower size limit of 100 µm based on sampling
    capabilities (Frias et al., 2018). Microplastics are further categorized according
    to their origin. Primary microplastics are those manufactured to microscopic sizes,
    whereas secondary microplastics are derived from the breakdown of larger particles
    in the environment (Frias & Nash, 2019). With the persistence of hundreds of thousands
    of years, all of the plastic introduced into the environment remains unmineralized;
    instead, plastics fragment is due to ultraviolet (UV) degradation, oxidation,
    and abrasion (Barnes, Galgani, Thompson, & Barlaz, 2009). This degradation means
    methods of characterization that depend on spectral libraries are expected to
    fall short, given the spectra of weathered plastics differ greatly from those
    of standard plastics (Dong et al., 2020). Taking all into account, the very characteristics
    that make plastics useful—persistent, inexpensive, water-resistant, versatile—make
    them worrisome in marine and terrestrial environments.


    # 1.2 Persistent, ubiquitous—And miscounted?


    The persistence of plastics contributes to their ubiquity in the natural environment.
    Even the most seemingly pristine and far-flung sites are not safe from plastic
    pollution. Thanks to long-range transport, plastics can be found in places as
    remote as polar ecosystems (Haland & Hercke, 2019). Their size, meanwhile, allows
    for uptake by living organisms. The recent (and undiscovered) of microplastics
    in human placentas is one concerning example of this phenomenon (Ragusa et al.,
    2021).


