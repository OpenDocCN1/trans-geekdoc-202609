- pgno: 26
  md: '# 3. Applications


    Gemperline and Cash used the P-ALS algorithm for comparing the results of applying
    hard and soft constraints in the SMCR analysis of four different experiments (one
    simulated HPLC-DA data set and three experimental data sets) (Gemperline & Cash,
    2003). They demonstrated that the results of the SMCR methods under hard constraints
    are distorted in many cases, and this can significantly affect the quantitative
    accuracy of the results. The average peak area errors for simulated HPLC-DA with
    soft constraints using a penalty weight of 1.0 were less (~2%), whereas the errors
    with hard constraints, using a penalty weight of 20, were significantly larger
    (>12%). In the analysis of experimental data sets, a larger fraction of the total
    variance of data was modified with soft constraints, and the resolved profiles
    were less noisy. In addition, applying soft constraints allowed a reasonable model
    with improved profiles in comparison with the hard constraints. Gemperline and
    coworkers (Lake et al., 2022) also demonstrated the impact of using soft constraints
    in the analysis of three-way data. The results revealed that the application of
    the NWAY P-ALS algorithm with soft constraints allows a reduction in the number
    of influential active constraints and enables monotonic and smooth convergence.


    Neymeer, Abdollahi, and their coworkers demonstrated the impact of soft constraints
    on the range of feasible solutions for three-component systems using FAC-PACK
    software (Sawall et al., 2013; Sawall & Neymeer, 2014). They investigated the
    effect of soft constraints on the AFs, namely, constraints on non-negativity,
    equality, closure, unimodality, and windowing. Several simulated and experimental
    data sets were used for showing the advantages of applying soft hard constraints.
    In the case of non-negativity constraints, different levels of the control parameter,
    e, were checked. Since larger e allow larger negative entries in the resolved
    profiles, the AFs segments were inflated by increasing the value of e. In practice,
    real concentration or spectral profiles that show deviations from non-negativity
    constraints. As it is shown in Rahimdoust Mojdehi et al. (2016), applying hard
    non-negativity constraints in such cases may not include the coordination of real
    noise concentration or spectral profiles. This means that the accuracy of the
    feasible bands in the presence of noise is reduced. However, by applying the soft
    non-negativity constraints, the feasible regions could be expanded and the real
    known noise profiles have the chance to be included in AFs. Accordingly, the obtained
    results'
  merge: -1
