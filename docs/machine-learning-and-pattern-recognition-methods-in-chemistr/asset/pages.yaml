    # 2.4 Cancer subtype classification


    Hematopoietic is a malignant malignant in immune system cells. Park, Batbaatar,
    Piao, Theera-Umpon, and Ryu (2021) used an autoencoder model to find salient features
    and build predictive models for hematopoietic cancer classification. They also
    used the oversampling method SMOTE (Chawla, Boyer, Hall, & Kegelter, 2002) to
    resolve the difficulty of unbalanced datasets. Another advantage of this study
    was that the SHAP (Lundberg & Lee, 2017) method was used to interpret the predictive
    model and explain primary genes and proteins for each cancer subtype. The dataset
    was gene expression data of 2457 patients with hematopoietic cancer, classified
    into five subtypes. They summed the reconstruction on variational autoencoder
    and classification loss in the cost function and used various machine learning
    classifiers (e.g., ANN, RF, KNN, SVM). Observations show autoencoder has a better
    performance in dimension reduction compared to PCA and NMF.


    # 2.5 Dimensionality reduction in spectrometry imaging


    The spectrometry method has become a dominant and efficient method in chemistry,
    pharmacy, and biology. New experiments in this field can generate hundreds of
    gigabytes of data, and as a result, their analysis requires powerful algorithms.
    Most methods of analyzing this data begin with a dimension reduction step. Linear
    methods have been used to reduce the size of this data, but the use of nonlinear
    methods helps reduce information in this process. Thomas, Race, Steven, Gilmore,
    and Bunch (2016) used an autoencoder to decrease the size of over 165,000 pixels
    and more than 7000 spectral channels to a much smaller number of essential features.
    In order to avoid overfitting the training data, they employ a standard L2 weight
    regularization. They applied this to mouse brain data, and encoder has shown higher
    performance than PCA and NMF.


