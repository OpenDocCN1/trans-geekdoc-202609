  md: '# The analytical/measurement sources of multivariate errors 103


    This chapter gives some answers to the aforementioned questions and sets the basis
    for understanding the extent to which NIR-HSI and classification methods can be
    used to detect microplastics. The hypothesis is that NIR-HSI, together with the
    proper classification method, is a viable technique to identify microplastics
    and measure their size directly in the sand, avoiding time-consuming separation
    techniques. For this aim, we collect a NIR-HSI image of a well-standardized microparticle
    of known identity (butadiene styrene) standardized sand (acting as marine sediment)
    to assess the realm of classification chemometric techniques. This will help us
    understand the extent to which the spectra of microplastics are influenced by
    their surroundings.


    This chapter is the beginning of a series of research actions developed at our
    research group. Therefore, the experimental setups and the results are just the
    starting point that sets the basis for future chemometric-elaborated answers.


    # 2. Materials and methods butadiene styrene (ABS) pellet


    The polymer used was the acrylonitrile butadiene styrene (ABS). It was in the
    form of pellets of approximately 5mm in diameter. ABS was chosen from the list
    of polymers produced in the greatest quantities in Europe (Plastics Europe, 2020).
    Microparticles ranging in size from 100um to 2mm were produced from the pellet
    using mechanical abrasion.


    The identity and size of ABS were confirmed using Raman microscopy. An Invia confocal
    Raman spectrometer coupled to a DMLM Leica microscope (Renishaw, Gloucestershire,
    UK) was used to measure the size and confirm the identity of the polymer. A still
    image of each microparticle on a glass plate was collected with $20×$ magnification.
    The still image collected of each individual microplastic particle was used to
    calculate the dimensions. A 785-nm excitation laser was used with 350mW output
    power and 150mW as 100% laser power.


    # 2.2 Sample preparation


    Samples of sand were collected from the top surface layer (approximately 2cm deep)
    of Plentzia Beach 1h after high tide in Plentzia, Spain (43° 24''40″N 2°56''46″W).
    The sand was rinsed with tap water, and any'
