- pgno: 42
  md: '# 1.3.1 PLS for a single response (PLS-1)


    The PLS-1 approach deals with the possibility of predicting a univariate response
    ($y$). Scores along the different components are then extracted to have maximum
    covariance with the response vector and forced to be orthogonal to one another:


    ```

    $\argmax_{r_a} \mathbf{y}^T \mathbf{t}_{r_a} = \argmax_{r_a} \mathbf{y}^T \mathbf{X}
    \mathbf{r}_{r_a} \quad (2.22)$

    ```


    where the weight vector $r_a$ is used to extract scores from the independent matrix
    ($t_a = \mathbf{X} \mathbf{r}_a$) and the subscript $a$ indicates that the condition
    is applied component-wise (i.e., the $a$th latent variable). The $X$-scores $(\mathbf{T}
    = [t_1 t_2 \dots t_a]$, being the number of components) are then used as predictors
    for the response through least-squares fitting:


    ```

    $\hat{\mathbf{y}} = \mathbf{Tq} \quad (2.23)$

    ```


    where the regression coefficients $q$ relating the X-scores to the Y are usually
    called $Y$-loadings, in analogy with the multivariate case. Similarly to what
    already highlighted for PCR, by exploiting the linear relation between the X-scores
    and the predictor matrix, it is possible to explicitly express the predicted response
    in terms of the original variable through linear projection, Eq. (2.19) can be
    rewritten in terms of the original variables:


    ```

    $\hat{\mathbf{y}} = \mathbf{Tq} = \mathbf{XRq} = \mathbf{X b}_{PLS} \quad (2.24)$

    ```


    where $\mathbf{b}_{PLS} = \mathbf{Rq}$, being the matrix connecting the weights
    for the calculation of the different components $(\mathbf{R} = [r_1 \ r_2 \ \dots
    \ r_a \ \dots \ r_A])$.).


    # 1.3.2 PLS for a multivariate response (PLS-2)


    When the Y data are multivariate, the PLS algorithm is modified to account for
    the hypothesis that both blocks share the same latent structure, i.e., that they
    can be described by the same low-rank approximation, which, in turn, the $X$-
    and $Y$-scores lie in the same column subspace. Mathematically speaking, these
    assumptions can be translated to assuming the relevant variance in X can be summarized
    by the X-scores $(\mathbf{T} = [t_1 \ t_2 \ \dots \ t_a \ \dots])$ and that the
    systematic variation in Y can be approximated by the Y-scores $(\mathbf{U} = [u_1
    \ u_2 \ \dots \ u_a \ \dots])$, with $\mathcal{A}$ being the number of extracted
    components:


    ```

    $\mathbf{T} = \mathbf{XR} \quad (2.25)$

    ```'
