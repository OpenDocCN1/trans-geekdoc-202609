  md: 'Therefore,


    ```

    $$K_C'' = K_C \frac{1 + K_{C,I}[I]}{1 + K_{A,I}[I]} \quad (4.8)$

    ```


    In this system of complete and apparent reaction schemes, an analytical relationship
    between the real and the apparent constants can be established. According to Eq.
    (4.8), the value of the apparent constant is defined by the constants of the complete
    model $K_C$, $K_{A,I}$ and $K_{C,I}$ as well as the free [I] of the interferent
    I. Eq. (4.8) also shows that the influence of [I] on $K_C''$ is more prominent
    if the equilibrium constants $K_{A,I}$ and $K_C$ are dissimilar. If the interferent
    is added in large excess, its free concentration is approximately constant and
    thus also the value for the apparent constant $K_C''$. If just the reaction A
    gets involved in the side reaction, $K_{C,I}$ would be zero, and in the situation
    where only the product (C) is involved in the side reaction, $K_{A,I}$ is zero.


    Now, this question can be asked under what situation, the apparent model and the
    related constant $K_C''$ are applicable in an equilibrium system. By involving
    the side reaction(s), total concentrations of all components can be applied as
    controllable variables for changing [I]. Thus, Eq. (4.5) is applicable, where
    [I] is independent of the total concentrations of all involved components (A,
    B, and I).


    The question is, “under what circumstances the apparent model and the related
    constant $K_C''$ be applied to an equilibrium system?” By involving the side reaction(s),
    the total concentrations of all components will influence [I]. Thus, Eqs. (4.5)
    and (4.8) are applicable where [I] is independent of the total concentrations
    of all involved components (A, B, and I). In this section, we investigate situations
    where the apparent model is valid.


    Here, the effect of concentration of interferent I (which is introduced to the
    system and can be used to tune the apparent constant on [I] and as a result, the
    stability of the apparent constant during a typical titration is investigated.
    As an example, in Fig. 4.3, the value of [I] as a function of $C_I$ during the
    titration for $K_C = 10^6$, $K_{A,I} = 10^{-4.5}$, and $K_{C,I} = 10^{-1.2}$ has
    been shown. It is clearly manifested that in the low total concentrations of the
    interferent I, the free concentration of [I], and thus the apparent constant are
    not independent of the equilibrium situation (Part A in Fig. 4.3), while Part
    B shows the region where $C_I$ and [I] are independent. Therefore, since [I] in
    each titration is approximately constant in a certain range of total concentrations
    of I, (the percent change of [I] during the system under study is $\le1\%$), this
    range of $C_I$ can be applicable for applying the apparent model.'
