    \ that aims in discriminating samples between two classes by a hyperplane (see\
    \ Fig. 3.4), which is called a separator hyperplane. Samples are assigned to their\
    \ corresponding classes based on which side of the separator hyperplane is placed.\
    \ It should be noted that the multiclass version of the logistic regression also\
    \ exists.\n\nIn logistic regression, the loss function is defined based on the\
    \ binary cross-entropy, which is as follows:\n\n```\n$L\\left(\\theta;{x^{(i)},\
    \ y^{(i)}\\}_{i=1}^N\\right) = \\sum_i y^{(i)} \\log\\left(h\\left(\\phi(x^{(i)});\\\
    theta\\right)\\right) + \\left(1-y^{(i)}\right) \\log\\left(1-h\\left(\\phi(x^{(i)});\\\
    theta\\right)\\right) \\quad (3.8)$\n```\n\nwhere $h(\\phi(x^{(i)});\\theta)$\
    \ is defined as follows:\n\n```\n$h(\\phi(x^{(i)});\\theta) = \\alpha\\left(\\\
