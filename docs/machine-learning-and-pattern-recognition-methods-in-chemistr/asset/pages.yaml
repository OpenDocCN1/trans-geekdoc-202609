    K'' is the conditional formation constant, which describes the action quantitatively
    as long as the pH is constant (Tammelin & Mogensen, 1952), and its value is pH
    dependent. In other words, there is a range of the apparent equilibrium constant,
    K'', which can be tuned by adjusting the pH in a predefined value. However, the
    color of solution of indicator depends on two factors: the kind of metal ion and
    the pH of solution.


    The concept of equilibrium reactions is extremely important in chemistry as many
    main applications of chemistry processes are based on the laws that govern the
    equilibrium reactions. In a typical equilibrium reaction, the amount of activities
    of involved components is determined by the relevant thermodynamic constant. As
    the activities of involved components in the equilibrium reaction are controlled
    by the thermodynamic parameters, tuning the relevant equilibrium constants can
    control the efficiency of the equilibria-based process like chemical sensing.
    The main goal of this chapter is to quantitatively investigate the effects of
    side equilibria in order to find the tunable range of the apparent or conditional
    constants of different chemical equilibrium systems.


    # 2. General strategy for tuning the apparent constant (Karimvand, Maeder, and
    Abdollahi, 2019)


    To further investigate the issues of using apparent equilibrium constants, quantitatively
    analyze a simpler equilibrium system.


    ```

    A + B \rightleftharpoons C^{Kc} = \frac{[C]}{[A][B]}

    ```


    Consider a situation where both the reactant and the product are involved in competitive
    equilibrium reactions with an interferent I, which is represented in Fig. 4.2.'
