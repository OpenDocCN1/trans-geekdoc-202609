    +   * Total cost function


    When several soft constraints are desired to be applied, the total cost function
    can be defined as the weighted sum of all the objective functions that are needed.
    If the four constraints from the previous sections are considered, then the total
    cost function can be described as follows:


    ```

    $f(\alpha, \beta, P) = f_{non-neg}(\alpha, \beta, P) + \gamma_{um}f_{um}(\alpha,
    \beta, \omega) + \gamma_{do}(\alpha, \beta, \delta) + \gamma_{eq}f_{eq}(\alpha,
    \beta, \theta) \quad (1.12)$

    ```


    where $\gamma_{um}, \gamma_{do}, \gamma_{eq}$ are the weights that can vary between
    zero and one. As shown before, each pair of $(\alpha, \beta)$ defines a certain
    point of the AFS if $\min f(\alpha, \beta, P)$ is less than a control parameter.


    ```

    $f(\alpha, \beta, P) = \min_{P}(\alpha, \beta, P) \le \varepsilon_{f} \quad (1.13)$

    ```


    The value of the control parameter, $\varepsilon_{f} > 0$, should be chosen with
    caution especially for noisy experimental data. The control parameter for each
    constraint $(\varepsilon, \omega, \delta, \text{ and } \theta)$ should be selected
    based on the acceptable amount of noise and deviations from the ideal resources.
    Details on the impact of the tunable parameters and the way to compute them are
    explained briefly in Sawall et al. (2015).


    # 2.3 Grid search algorithm for applying soft constraints


    The grid method was proposed for numerically approximating the area of feasible
    solutions (AFs) for 2-, 3-, and 4-component systems (Golshan, Abdollahi, & Maeder,
    2011; Golshan et al., 2013; Vosough, Mason, Tauler, Jalali-Heravi, & Maeder, 2006).
    The most informative part of the AFS is its boundary, which is a contiguous polygon,
    a simplex algorithm was employed to define the border and thus the complete AFS.
    The grid search algorithm can deal with noisy data sets and different restrictions
    coming from prior information of the system. In addition, this algorithm can be
    applied for studying the effect of various soft constraints'
