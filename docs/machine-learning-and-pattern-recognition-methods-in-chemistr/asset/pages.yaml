    # 3. The application of proposed strategy in practice


    There are several examples in the chemistry literature where the apparent equilibrium
    constants have been adjusted by variable such as solvent, micelle concentration,
    or some interfering chemical species (Adam, Bravo, & Mancini, 2014). One application
    in analytical chemistry is to study the pH indicators in order to shift the chemical
    equilibrium and therefore the pKa (Caselli, Mangone, Paolillo, & Traini, 2002;
    Love, Habatta, & Dorsey, 1984; Rostami, Karimvand, & Abdollah, 2019). Garcia and
    Medal studied the mechanism of surfactant-surface interactions in micelles in
    solution and deat in Garcia and Sanz-Model (1986). Safavi and Abdollah (2001)
    observed a significant shift in equilibrium and the apparent acidity of acid-base
    equilibria of indicators was reported by several works (Adam et al., 2014; Kidani
    & Imura, 2010; Safavi, Abdullahi, Maleki, & Zeunai, 2009). Also, it has been shown
    that the investigation of equilibrium constants has been possible by adjusting
    the equilibrium constants under certain chemical-physical conditions (Okada, 1995;
    Woolley, Tomkins, & Hepler, 1972). Herein, the proposed strategy is applied for
    tuning the apparent equilibrium constants using controllable variables, which
    can have many applications in designing efficient sensors for the determination
    and quantification of analytes. It is clear that the affinity for tuning the equilibrium
    constants can be effective in the application of many equilibrium-based chemical
    processes.


    Fundamentally, a chemical sensor is defined as device that has selective response
    to a analyte through a physical or chemical interaction and can be used for the
    qualitative or quantitative determination of the analyte. For pH determination,
    the device can be a pH meter or chemical compounds such as pH indicators in a
    solution (Hulanicki, Glab, & Ingman, 1991; Lim, Musto, Park, Zhong, & Suslick,
    2008; Wencel, Abel, & McDonagh, 2014).'
