    # 7.2 Partial least-squares


    Partial least-squares (PLS) is a well-known technique of regression. This technique
    is used when the number of correlated independent variables is high. It is widely
    noted that, in this case, the ordinary least square is failed. This situation
    is so common in chemometrics; hence, it is widely used in this research area.
    In this section, an example for PLS is given. In this example, physicochemical
    properties of protein tertiary dataset are utilized. This dataset is available
    in the machine learning repository. In the following, a python code is written
    to fix the PLS model on this dataset.


    In the first step, the necessary libraries should be imported as follows:


    ```

