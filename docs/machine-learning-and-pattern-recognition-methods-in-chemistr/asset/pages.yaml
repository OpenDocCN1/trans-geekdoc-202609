- pgno: 156
  md: 'With correct information on the zero concentration regions of components, Manne’s
    theorems will be successfully applied to produce the unique solution(s) provided
    that the necessary conditions were fulfilled. However, these conditions regard
    the properties of the most unknown true profiles of the components. This is why,
    we can call the perceived phenomenon as the profile-based uniqueness instead of
    using the term “data-based uniqueness” (Rajkó et al., 2015).


    In the literat of chemometrics, resolution theorems of Manne are discussed and
    explained by local-rank information. But, recently, it was noted that local rank
    is a mathematical concept that is not necessarily in concordance with chemical
    information (Akkari Lakh et al., 2017).


    In what follows, the concordance of the local-rank information is pursued with
    the presence of windows in a simulated bilinear data set. The SMCR calculations
    for obtaining the Borgen plots and feasible solutions were made by the FAC-PACK
    software (version 1.20—the generalized Borgen plots module). This software can
    be freely downloaded at http://www.math.uni-roostock.de/facpack/


    Simulated example is a typical noise-free data, which is used for basically evaluating
    the concordance of the local-rank with the presence window of chemical species.
    The simulated data set is obtained from the chromatograms and spectra shown in
    Fig. 7.3, corresponding to a mixture of three co-eluting components in a chromatographic
    system monitoring with a diode array detector. As it can be deduced the dimension
    of the simulated data set is 34 rows (elution times) by 51 columns (wavelengths).
    As it can be deduced from the elution and spectral profiles, there are three different
    local-rank windows on the rows of the data matrix comprising windows with rank
    one, two, and three.


    Now, the concordance of the local-rank information with the presence of windows
    in the simulated data is investigated. The agreement of the local-rank information
    with actual presence windows of the components in noise-free matrices is of great
    importance because the local-rank constraint is applied based on the correctness
    of this concordance. For instance, when selectivity is applied as a constraint,
    it is forced that just one component participate to reconstruct the rows or columns
    with local-rank-one. The main question arises here: Is there any possibility that
    more than one component participates in the local-rank window? Alternatively,
    in general, may rank deficiency be present in the subwindows of a data matrix?'
  merge: -1
