  md: '# Machine learning and pattern recognition methods in chemistry


    developed for sequence modeling. There are lots of RNN variants. based on RNN.
    The most famous architectures are long-term memory (LSTM) (Hochreiter & Schmidhuber,
    1997), gated recurrent unit (GRU) (Chung, Gulcehre, Cho, & Bengio, 2014), and
    bidirectional RNN (Schuster & Paliwal, 1997).


    When we want to model a time series, the system''s behavior should be dependent
    on past events, so the model should have some memory. RNN architectures provide
    a mechanism for memorizing valuable information across sequences. In these models,
    there is a recurrent formula that updates the system state at each time step.


    ```

    h_t = f_{IW}(h_{t-1}, x_t) (6.3)

    ```


    ```

    y_t = Wh h_t (6.4)

    ```


    when $h_t$ is a new state, $f_W$ is a function with parameters $W$, $h_{t-1}$
    is an old state, $x_t$ is an input vector at some time step, and $y_t$ is a sequence
    of outputs.


    Historically, recurrent neural nets had a significant obstacle in the training
    process. When the network''s output is fed back to the input, vanishing gradient
    problem occurs. Long-term memory (LSTM) (Hochreiter & Schmidhuber, 1997) network
    was a solution for this problem. This architecture uses a gating mechanism for
    managing this.


    In natural language processing, RNNs are widely used (Bengio, Daucharme, Vincent,
    & Janvin, 2003; Socher, Huang, Pennin, Manning, & Ng, 2011). Also, in the machine
    translation problem, a sequence-to-sequence (Seq2Seq) model was used (Kohlbrenner
    et al., 2017).


    In this model, the main idea is to train an encoder that learns a continuous representation
    of words and sentences. Representations represent the semantic and syntactic structure
    of source language as much as feasible. The decoder maps this representation to
    equivalent words and sentences in the target language (Cho et al., 2014; Sutskever,
    Vinyals, & Le, 2014) (see Fig. 6.6).


