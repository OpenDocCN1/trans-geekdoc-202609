    mathbf{w}^T \\mathbf{x} = 0$ (2.40)$\n```\n\nThis latter equation unveils that\
    \ LDA is a projection method seeking for the directions which maximize the distance\
    \ between the class-centroids (*inter-class variability*) and minimize the within-variability\
