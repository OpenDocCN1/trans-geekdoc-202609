    data sets are represented for conditions which will lead to uniquely resolved
    profiles under non-negativity constraint. Figs. 7.1 and 7.2 depict the examples
    of Borgen plot patterns for data sets where data-based uniqueness occurs. Specific
    property of these geometries is the


