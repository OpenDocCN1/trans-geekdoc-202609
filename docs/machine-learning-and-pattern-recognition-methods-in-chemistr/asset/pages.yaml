    # 4.1 Advanced topics


    In deep learning, CNNs are investigated more, and some architectures for many
    tasks are given by (He, Zhang, Ren, & Sun, 2015; Krizhevsky et al., 2012; Szegedy
    et al., 2015). Also, new concepts are introduced, which act successfully in many
    research areas, including generative adversarial-network (GAN) (Goodfellow et
    al., 2014), capsule network (Hinton, Sabour, & Frost, 2018; Sabour, Frostst, &
    Hinton, 2017), graph representational learning (Fey & LeSenn, 2020; Wang et al.,
    2018), and deep reinforcement learning (Henderson et al., 2018). GAN is an unsupervised
    method that learns the distribution of the input space. GAN contains two subnetworks:
    generator and discriminator; these two subnetworks learn throughout the adversarial
    learning. Hence, it could generate a new sample from the learned generator. The
    capsule network is designed that it addresses the most drawback of the CNN. CNN
