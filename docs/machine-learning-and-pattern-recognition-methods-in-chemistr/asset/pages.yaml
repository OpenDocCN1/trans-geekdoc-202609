    debris was removed and dried in an oven at 100°C overnight. The sand was then
    placed in an oven at 450°C for 1 h to remove any remaining traces of organic material.
    The sand was stored in a glass container.

    Spiked samples were prepared by filling Petri dishes with the sand to a depth
    of 0.5cm and placing one microparticle on the surface of the sand (Fig. 5.2).
    Reference pellets of ABS were placed alongside the petri dish on the sample tray
    to provide reference spectra.


    # 2.3 Near infrared hyperspectral imaging


    Near infrared (NIR) hyperspectral images were collected using a Headwell Photonics
    NIR hyperspectral camera (Model 1002A-00371, Fitchburg, MA, USA). X-Control software
    was used to calibrate the camera settings, and Hyperspec Rev. A.11.13.1 software
    was used to set the acquisition parameters. Images were collected in the spectral
    resolution of 4.85 nm and 142 bands with an acquisition time of 100,000µs, a temperature
    of 260K°, and a focal distance of 30 cm. The spatial resolution was set to to
    10µm. The light source was aimed at the sample at a 45° angle. Calibration was
    performed by taking a 0% reflectance measurement with the objective closed and
    100% reflectance measurement with a Spectralon plate. The camera measures in line-scan
    modality. Scan length was adjusted as necessary to record all of the samples (Fig.
    5.2).'
