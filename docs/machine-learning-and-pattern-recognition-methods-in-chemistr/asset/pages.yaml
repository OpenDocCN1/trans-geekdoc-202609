  md: '# 7. General rule for uniqueness (GRU) (Karimvand et al., 2020)


    In research, the duality concept is applied to propose a general rule for unifying
    all the different information and constraints that can produce a unique solution
    in SMCR methods. This general rule for uniqueness (GRU) describes how different
    information about a chemical component can help to resolve its corresponding profile
    uniquely. Moreover, GRU provides a better understanding about the uniqueness concept
    and can be a guide for developing new constraints in SMCR to get more accurate
    solutions.


    The duality concept is a powerful tool in explaining and interpreting numerous
    features of MCR methods. Based on this concept, a general rule was employed to
    explain the unique solutions of MCR methods as a result of applying different
    constraints. The GRU states that any information able to fix the subspace of all
    complementary components in space results in a unique solution for the analyte
    in the other space. This generalization is presented for constraints such as trilinear,
    equality, zero concentration region, local rank, non-negativity under DBU conditions,
    and even to the NAS. GRU is a proper index to find the conditions and information
    in different chemical systems probably leading to a unique solution in applying
    MCR methods. Hence, by fulfilling the proposed rule of uniqueness, it is possible
    to successfully introduce new constraints and apply different constraints to achieve
    a unique solution.


    # 7.1 Generalized rule for uniqueness (GRU)


    Based on the Bouguer-Lambert-Beer law, a spectroscopic data set can be written
    as a product of two matrices, C and A, containing the concentration and spectral
    profiles of individual species, respectively. Hence, a bilinear decomposition
    of a given data set is


    ```

    D = CAᵀ (7.27)

    ```


    where D is the measured data matrix with I rows (observations) and J columns (variables).
    Additionally, a bilinear data can be decomposed by singular value decomposition
    (SVD):


    ```

    D = USVᵀ = XVᵀ = UYT ≥ 0

    Dᵀ = VSUᵀ = YUT = VXᵀ ≥ 0 (7.28)

    ```


    In Eq.(7.28), U and V represent the left and right eigenvectors of D (I×J), respectively,
    and S is a diagonal matrix of singular values. Also, X and Y are the coordinates
    of the row and column vectors of the data set in the'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Uniqueness in resolving multivariate chemical data 169


    row (V-space) and column space (U-space); in turn, 0 is a matrix containing zeroes
    with the suitable dimension ($I \times J$ or $J \times I$). Moreover, Eq. (7.28)
    shows a natural duality between row and column vectors of a data matrix using
    the only non-negativity property of the data set. Each point defined by t in the
    considered space conforms to the duality relation. Thus, it is easy to derive
    the coefficients to create the hyperplane corresponding to this point in another
    space (dual space).


    ```

    $n = tS^{-1}$

    ```


    where t represents the coordinates of a fixed point, S is the matrix of singular
    values, and n is the hyperplane coefficients vector. Point t in one space of matrix
    has a certain hyperplane defined by Eq. (7.30) in another space (dual space).


    ```

    $n^T z = 0$

    ```


    In the equation of hyperplane, z is a general variable representing the coordinates
    of an arbitrary point in V- or U-spaces and 0 is a scalar.


    Hence, a certain point in the abstract space corresponds to a unique hyperplane
    in its dual space. A unique profile in the result of an MCR method is equivalent
    to a certain point in the corresponding abstract vector space of the profile.
    In fact, the duality concept states that a proper hyperplane should be defined
    in the dual space to achieve a unique solution for any analyte (the correct and
    sufficient meaningful physical/chemical information can define the correct and
    proper hyperplane corresponding to true solution). Therefore, accurate information
    must be used to determine the hyperplane by the subspace related to all complementary
    compounds (this specific hyperplane is a subspace of all complementary (interfering)
    compounds without the contribution of the analyte). Thus, the information of the
    profile constraints resulting in a unique solution in the vector space of the
    data would lead to fix a hyperplane in its dual space. Therefore, a general rule
    for the uniqueness of MCR solutions is based on the duality concept:


    > The necessary condition to get a unique solution for the analyte is the possibility
    of the definition of the hyperplane related to all interfering components in the
    dual space by implementing adequate physical/chemical constraints (or information).


    Indeed, for a (N) component system, a unique solution always fixes a point in
    one space and an (N–1)-dimensional hyperplane of component components in the dual
    space. This is a general rule of uniqueness in SMCR methods.'
  merge: -1
