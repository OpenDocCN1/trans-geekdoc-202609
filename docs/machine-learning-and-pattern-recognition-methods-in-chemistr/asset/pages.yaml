- pgno: 108
  md: '# 1.6 Classification


    In contrast with exploratory techniques such as PCA, classification refers to
    supervised multivariate analytical methods that are designed to sort samples into
    classes based on a series of measurements or theoretical values (Marini, 2010).
    These measurements or theoretical values define the classes, groups, of objects,
    and can be referred to as training sets (Marini, 2010). A validation step (internal
    cross-validation or external validation) is necessary to ensure the reliability
    of a model (Amigo, 2020).


    Two of the primary categories of classification techniques are pure classification
    (discriminant) techniques, wherein the focus is on differences between samples
    of different classes, and class-modeling techniques, wherein the focus is on the
    similarities among samples of the same class (Marini, 2010). This introduction
    will focus on linear classification methods, but it is worth commenting that non-linear
    classification methods (e.g., artificial neural networks and k-means clustering)
    are also used to a certain extent.


    # 1.6.1 SIMCA


    Soft independent modeling by class analogy (SIMCA) is a classification method
    based on the use of principal component models to describe each of the classes
    (Marini, 2010). Each class in a training set is a quantitatively defined group
    of objects. The model for each class (e.g., Category 1) is then described by a
    set number, $A$, of principal components, according to:


    ```

    $D_1 = T_A P_A^T + E$

    ```


    where $D_1$ is the submatrix of the full data set containing only the samples
    of Category 1. $T_A$ and $P_A$ are the matrices composed of the first $A$ scores
    and loading vectors, respectively, and $E$ is the residuals (Marini, 2010).


    # 1.6.2 PLS-DA


    As its name implies, partial least-squares discriminant analysis (PLS-DA) is a
    discriminant classification technique based on partial-squares (PLS) algorithm.
    In the case of hyperspectral imaging, PLS-DA treats each pixel as if it were a
    sample and assigns it to a class by the regression model developed from the training
    set. Each pixel is projected onto a regression model and the probability of the
    pixel corresponding to each class is calculated, and a threshold determines which
    class pixel is assigned to'
  merge: -1
  img_proc: true
- pgno: 109
  md: '(Amigo et al., 2015). The sample is then assigned to the class it has the highest-probability
    of belonging to (Marini, 2010).


    # 1.6.3 Validation


    The validation parameters used in a classification model are sensitivity, specificity,
    and error rate, all of which are generally expressed in percentages. These parameters
    are based on the number of true positives (TP), false positives (FP), true negatives
    (TN), and false negatives (FN) during the internal cross-validation or external
    validation (Amigo et al., 2015).


    ```

    $Sensitivity = \frac{TP}{TP + FN}\nSpecificity = \frac{TN}{FP + TN} \quad (5.3)\nError
    rate = 1 - \frac{(Sensitivity + Specificity)}{2}$$

    ```


    Sensitivity refers to the ability of the model to confirm that a sample belongs
    to the class to it has been assigned, and is the ability of the model to confirm
    that a sample does not belong to the classes to which it has not been assigned
    (Amigo et al., 2015).


    # 1.7 Objectives of this book chapter


    Despite the aforementioned promising benefits of NIR-HSI, there are important
    analytical concerns that require a deep understanding of the interactions between
    NIR radiation, microplastics, and the matrices in which microplastics are located.
    These concerns beg a series of questions:


    +   - Signal interference: Will the spectrum of the microplastic be the same as
    the spectrum of pure plastic? If so, to what extent can the signal of a microplastic
    be differentiated from the signals of the surrounding elements?


    +   - Scattering: Will the spectrum of a pixel containing microplastic be affected
    by the scattering promoted by the surrounding elements? If so, to what extent
    will this change the microplastic spectrum relative to the spectrum of pure plastic?


    +   - Spatial resolution: What is the smallest spatial level at which we can be
    confident that the microplastic signal will still be visible?


    +   - Spectral resolution: Is there a combination of wavelengths in the spectra
    that remain selective for the microplastic?'
  merge: -1
  img_proc: true
