  md: '# 2.4 Data hyperspectral analysis and software


    The hyperspectral images were analyzed in Matlab (MathWorks, Natick, MA, USA)
    using HYPER-Tools (Mobaraki & Amigo, 2018) to perform spectral preprocessing.
    PCA, SIMCA, and PLS-DA. The data were preprocessed using two strategies: standard
    normal variate (SNV) and first derivative.


    To create training sets for classification, 200 spectra from pure sand and 200
    spectra from the reference ABS pellet were extracted to form a final spectral
    library of 400 spectra. The pure sand and reference ABS pellet were measured simultaneously
    with the samples to avoid problems with variability (light conditions, focal distance,
    or spatial accuracy of the camera). All models (SIMCA with SNV; SIMCA with first
    derivative; PLS-DA with SNV; and PLS-DA with first derivative) were validated
    by randomsubset cross-validation and external validation (using 75% of the spectra
    for training and cross-validation, and 25% of the spectra for external validation).
    The datasets for training and external validation were randomly split.


    # 3. Results and discussion


    # 3.1 Raman microscopy


    Prior to measurement with NIR-HSI, the identity and the dimensions of the microplastic
    were confirmed via Raman microscopy (Fig. 5.3).


    The area of the ABS microparticle was calculated to be 437,250±649µm² with a major
    axis of 922±6µm. The characteristic peaks present in the Raman spectra confirmed
    the identity of the microparticles to ABS based on comparison with the Raman spectra
    of reference ABS pellets.


    # 3.2 NIR-HSI spectra


    Given that the microparticle of ABS was manually placed on top of the sand, its
    general location was approximately known and the region of interest (RoI) was
    selected to include this location and the surrounding sand as background (Fig.
    5.4A), while the microparticle is located inside the red (dark gray in the printed
    version) circle.


    The principal peaks for ABS occur at 1145, 1198, and 1412 nm, as seen in the average
    spectrum derived from the spectra of the reference ABS pellet (Fig. 5.4B and C).
    In contrast to the spectra of the reference ABS, there is more baseline shift
    and scattering in the spectra corresponding to regions known to contain only sand
    (Fig. 5.4D).'
