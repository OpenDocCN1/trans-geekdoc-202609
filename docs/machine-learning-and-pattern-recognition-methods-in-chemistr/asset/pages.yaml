    # 2.2 Feature extraction in virtual metrology


    In semiconductor manufacturing, one of the most extensively employed data–driven
    applications is virtual metrology, where a costly or unmeasurable variable is
    estimated by means of cheap and easy to obtain measures that are already available
    in the system. Maggipinto, Masiero, Beghi, and Susto (2018) present a deep learning
    method for unsupervised feature extraction based on convolutional autoencoders.
    The proposed method is tested on a real dataset for etch rate estimation.


    # 2.3 Chemometric data analysis


    A classic problem in chemometric data analysis is the curse of dimensionality.
    To reduce the dimension of the data, Bilal, Ullah, and Ullah (2019) used an L2-regularized
    autoencoder. Also, in this study, the Gaussian process has been used to build
    a regressor model on hidden space. Finally, the results of the model are evaluated
    on orange juice and wine datasets. Usually, in'
