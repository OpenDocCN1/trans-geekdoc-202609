  md: '# Machine learning and pattern recognition methods in chemistry


    necessary conditions for a partially unique resolution based on the non-negativity
    constraint were proposed with the so-called data-based uniqueness (DBU) theorem.
    DBU can predict the unique profiles when imposing only the non-negativity constraint
    by investigating the selectivity and zero values of the resolved profiles.


    Manne (1995) proposed "resolution theorems" that describe the conditions for getting
    unique concentration and spectral profiles under local-rank information (Manne,
    1995). However, successful prediction of the unique profiles based on the resolution
    subjects is to the implementation of the zero-region constraint in iterative curve
    resolution methods (Tavakkoli, Rajkó, & Abdollahi, 2018). Trilinearity is another
    powerful constraint for exploiting the trilinear profile over a multiset data
    analysis (Ghaffari & Abdollahi, 2018). Trilinearity constraint can be imposed
    when experiments are repeated under different initial conditions. It follows a
    trilinear model which can be expressed as the product of a triad of linear vectors.
    In addition to the mentioned constraints, entering the information about the shape
    of a specific profile to the SMCR methods as the equality constraint leads to
    a unique solution (Beyramsoltan, Rajkó, & Abdollahi, 2013).


    The other group of constraints that is used for narrowing the feasible band is
    information about the absence of a chemical species in a part of the contribution
    (or spectral) profile. This information can be applied as zero-region constraint
    when analyzing a single data matrix in iterative curve resolution methods. In
    case of multiset data analysis, the information about the presence/absence of
    each component in the matrices analyzing together is considered as the correspondence
    of species.'
