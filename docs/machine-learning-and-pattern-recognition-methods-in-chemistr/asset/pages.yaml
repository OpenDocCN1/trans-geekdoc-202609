  md: '# Machine learning and pattern recognition methods in chemistry


    non-negativity, unimodality, equality, known-value constraints, etc. There is
    an implied research hypothesis in SMCR applications (Gemperline & Cash, 2003)
    that should be recognized and considered carefully: “There exists an unconstrained
    bilinear model with unimodal, non-negative pure component concentration profiles
    and pure component non-negative spectra that fits the data matrix of measurements
    obtained from the evolving system (Gemperline & Cash, 2003).” Normally, this hypothesis
    is examined through an iterative process of applying hard constraints, i.e., strictly
    forced constraints, to fit the data until convergence is achieved. In cases where
    the SMCR research hypothesis is true, the final model contains no active constraints.
    However, in many cases, due to noise and nonlinear behaviors of chemical and/or
    spectroscopic response, active constraints are present in the resultant SMCR model.
    The detection of active constraints is important from both a theoretical and from
    a practical point of view. Tests for active constraints can be simply done by
    turning the constraints off at the solution point and then comparing the constrained
    fit with the unconstrained one. In the case of strong active constraints, when
    the difference between the two fits is greater than what might be expected from
    noise, a significant deviation from the original hypothesis may occur. The research
    hypothesis is rejected if many strong active constraints are present at the final
    solution. It worth noting that in most cases, instead of producing a unique solution,
    these methods produce a range of feasible solutions, which fulfill the constraints.
    Therefore, if one gets a lack-of-fit with no active constraints, one cannot prove
    that the hypothesized model is correct, as in testing all scientific hypotheses.


    Most often, the first step in fitting SMCR models is to select some initial starting
    point followed by iterative refinement while considering physicochemical limitations
    in the form of constraints to converge to a meaningful solution. The starting
    point or “guess” can be selected using different methods, including the “needle
    search” method (Gemperline, 1984, 1986) or evolving factor analysis (EFA). Gampp,
    Mayer, Meyer & Zuberbhler, 1987; Maeder, 1987; Maeder & Zuberbhler, 1986), when
    good information is available about the concentration profiles, or selection methods
    to approximate the pure component spectra or pure variables. The method of constrained
    alternating least squares is used to iteratively refine the “unconstrained” estimates
    to yield better “constrained” solutions. In solving SMCR problems, the constraints
    are applied during the fitting process to ensure a smooth and monotonic convergence
    of the initial solution to the final result. The iterative process by the application
    of alternating least-squares steps is repeated until'
