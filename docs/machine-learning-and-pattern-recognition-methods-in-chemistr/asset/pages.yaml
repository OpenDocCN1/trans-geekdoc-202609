    # $U = YQ \quad (2.26)$


    where the X-weights have the same meaning as in Eq. (2.24), while Q ($=[q_1 \quad
    q_2 \quad \dots \quad q_A]$) are the Y-loadings, which define the projection,
    leads to the Y-scores U. Component-wise, the X- and Y-scores are extracted to
    have maximum covariance with one another:


    ```

    $$\argmax_{r_{Q,a}} \{u_d^T t_d\} = \argmax_{r_{Q,a}} \{q_d^T X r_a\} \quad (2.27)$

    ```


    Here, it is important to stress that, in PLS, the linear dependence between the
    Y- and the X-blocks is imposed at the so-called inner relationship, where it is
    assumed that the Y-scores can be linearly approximated (component-wise) by the
    X-scores:


    ```

    $$\hat{u}_d = t_d \ c_{PLS} \quad (2.28)$

    ```


    with $c_{a, PLS}$ being the proportionality constant (which is estimated by univariate
    least squares) and the hat, indicating that the Y-scores are predicted from the
    X ones. In the matrix form, Eq. (2.28) can be rewritten as:


    ```

    $$\hat{U} = T \ C_{PLS} \quad (2.29)$

    ```


    with $C_{PLS}$ being a diagonal matrix, whose elements are the various $c_{a,PLS}$.
    Predicted responses are then obtained from the estimated Y-scores by inverting
    the relation expressed by Eq. (2.26), i.e., through the Y-loadings:


    ```

    $$\hat{Y} = \hat{U} Q^T \quad (2.30)$

    ```


    Also in the case of a multivariate Y, it is possible to express the overall regression
    model in terms of the original X variables, by properly combining the terms in
    Eqs. (2.25), (2.29), and (2.30):


    ```

    $$\hat{Y} = \hat{U} Q^T = T \ C_{PLS} Q^T = XR \mathbf{X} \ B_{PLS}, \quad (2.31)$

    ```


    where the regression matrix relating the Y- and the X-block is given by:


    ```

    $$\B_{PLS} = R \ C_{PLS} Q^T. \quad (2.32)$

    ```


