  md: '# 1.3 Hyperspectral imaging as a method for microplastics detection


    One major challenge in microplastics research is the lack of standardized analytical
    and quantification techniques, making it difficult to compare results across studies
    (Horton et al., 2017). Many of the common methodologies include density separation
    of plastics from solid matrices by filtration, which is time-consuming and can
    lead to the loss of material, especially when polymers differ and separation solutions
    are present (Frias et al., 2018). There are several chemical analytical methods
    that rely on thermal degradation and visual analysis. Two common thermoanalytical
    methods are pyrolysis chromatography coupled with mass spectrometry and thermogravimetric,
    but these will not be discussed here as they are destructive and provide a measurement
    of polymer weight rather than particle dimensions or amount of particles (Käppler
    et al., 2016). Visual analysis is a valid technique to identify particle particles
    as small as 0.25–2 mm based on their physical features, but this method is highly
    subject to error and variation greatly between observers (Ruggera, Gori, & Lubello,
    2020). Stereomicroscopy is capable of analyzing samples in the micron order of
    magnitude and providing physical characteristics and abundance; however, it does
    not provide information on composition (Yang, Zhang, Kang, Kang, & Wu, 2021).


    Given the limitations of methodologies based on thermodegradation and visual analysis,
    hyperspectral imaging has emerged as a reliable, non-destructive, non-invasive
    technique to characterize microplastic waste, thereby expanding the possibilities
    for plastic monitoring (Serranti, Palmieri, Bonifazi, & Cázar, 2018). For the
    purposes of characterizing and identifying microplastics, the spectra can be collected
    by Raman, FTIR, and NIR—although a wide variety of other techniques are possible.
    Hyperspectral imaging reveals in such a way that a spectrum in a full wavelength
    range is collected for each pixel. The spectral resolution, then, refers to the
    interval between each wavelength in the selected wavelength range, with a smaller
    interval corresponding to a higher spectral resolution (Amigo, 2020).


    In this context, an image will be defined as a two-dimensional representation
    of a surface. Images are collected by an instrument capable of obtaining X-Y information
    correlated with the surface in question. Subsequently, the term "pixel" must be
    defined. A pixel is the smallest individual spatial subdivision of an image. Following
    this definition, spatial resolution can'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The analytical/measurement sources of multivariate errors 99


    be expressed as X × Y for a given image, where X is the number of pixels per row
    and Y is the number of pixels per column. However, when discussing the spatial
    resolution, it is important to remember that each pixel represents a given surface
    area within the image, as X and Y correspond to physical distances (Amigo, 2020).
    The visual representation of a hyperspectral image is a hypercube defined in three
    dimensions: the X and Y spatial directions and the spectral (λ) dimensions. As
    such, the mathematical notation to represent a hypercube D is X × Y × λ (Amigo,
    Babamoradi, & Elcleroastizabal, 2015) (Fig. 5.1).


    # 1.4 Chemometrics


    Given the overwhelming amount of spectral and spatial information produced, advanced
    machine learning methods [a.k.a. chemometrics (Massart, 1997)] are required to
    glean meaningful from the quantities of data produced by the instruments used
    in analytical chemistry. In the context of microplastic studies, classification
    strategies are the most used chemometric methodologies (Da Silva, Murphy, Amigo,
    Stedmon, & Strand, 2020).


    # 1.5 Principal component analysis


    Principal component analysis (PCA) is an unsupervised exploratory chemometric
    tool. That is to say, it explores variation within the multivariate datasets,
    but it is not a method of classification. Applied correctly, PCA can provide an
    overview of multivariate data, shed light on the interrelated of variables and
    samples, and quantify patterns (Bro & Smilde, 2014). More specifically, PCA attempts
    to decrease the dimensionality of complex data sets by finding orthogonal directions
    in the multivariate space of describing the maximum variance as:


    ```

    D = TP^T + E

    ```


    Using the hyperspectral image in Fig. 5.1 as an example, D is the unfolded matrix
    with dimensions of XY × λ, containing the data for XY pixels and λ variables.
    T, the score vector or scores, has dimensions of (XY × R), and P, the loading
    vector or loads, has dimensions of (λ × R), where R refers to the number of principal
    components (Da Silva et al., 2020). E is the residual vector (Bro & Smilde, 2014).'
  merge: -1
  img_proc: true
