    data matrices due to the bilinear structure. Based on the Bouger-Lambert-Beer
    law, any bilinear data matrix can be decomposed as


    ```

    $\mathbf{D} = \mathbf{C}\mathbf{A}^T + \mathbf{E} \qquad (7.1)$

    ```


    where $\mathbf{D}$ is a measured data matrix, $\mathbf{E}$ contains the residual
    parts of the data that has not been modeled by a decomposition procedure, and
    $\mathbf{C}$ and $\mathbf{A}$ contains concentration and spectral profiles, respectively.
