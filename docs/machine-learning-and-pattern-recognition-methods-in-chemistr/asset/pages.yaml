  md: "Known-value constraints about the contribution or signal of a chemical species\
    \ can be applied as known-value constraints in SMCR methods. Implementing soft-value\
    \ constraints in the grid search method (Lakeh et al., 2020), in each cycle of\
    \ the algorithm, profiles with prior information available are scaled according\
    \ to the true values. The scaling step is important because the ratio of known-values,\
    \ and their intensity, is important when comparing the estimated and true values.\
    \ In the next step, the percent relative error between the estimated and true\
    \ values should be calculated as a criterion for accepting the estimated profile\
    \ as a feasible solution.\n\n```\nRE = 100 \\times \\sqrt{\frac{\\sum(v_t - v_i')^2}{\\\
    sum v_i'^^2}} \\quad (1.16)\n```\n\nIn the above equation, RE is the percent relative\
    \ error, $v_t$ is the true value, and $v_i$ are the calculated or estimated values\
    \ in each cycle of the grid search algorithm. Feasible solutions are found at\
    \ grid points where their percent error is less than a predefined constant, e.g.,\
    \ 1%. This predefined constant controls the range of the accepted deviations from\
    \ the known-values.\n\n+   - Trilinearity constraints Soft trilinearity constraints\
    \ were implemented in the grid search algorithm (Tavakkoli et al., 2020) for allowing\
    \ small deviations in the shape and position of the peak profiles of interest\
    \ from sample to sample. Implementing soft trilinearity constraints in the grid\
    \ search algorithm is described using the following procedure.\n\n+   At each\
    \ cycle of the grid search algorithm:\n1. Fold the estimated concentration profile\
    \ for the desired component into a matrix,\n2. Apply PCA on the obtained matrix,\n\
    \n+   3. Calculate $k = \\frac{\\sum_{ij} c_{ij}}{\\sum_{ij} c_{ij}'} \\times\
    \ 100$, where $nf$ is the number of augmented matrices\n4. If $k \\leq \\alpha$,\
    \ then\n$\\delta_{\\alpha} = 0$\\nelse\n$\\mathbf{R} = \\mathbf{C} - \\mathbf{\\\
    hat{C}}$, where $\\mathbf{\\hat{C}} = |U_c(:, 2:nf) \\times \\mathbf{S}((:, 2:nf)\
    \ \\times \\mathbf{V}_c^T(:, 2:nf)|$\\n\\n$\\delta_{\\alpha} = \\sum \\sum(\\\
