    science needs and minimize the effort for deployment, maintenance, and support
    are the solution. Such platforms should be built around common algorithmic patterns
    in the social impact space that you start seeing by conducting several projects
    over a lifecycle.

    +   - All the attributes of trustworthy machine learning are essential in applying
    machine learning for social impact, including fairness, robustness, explainability,
