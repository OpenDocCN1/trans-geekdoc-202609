    assumption in causal inference is similar to the independent and identically distributed
    (i.i.d.) assumption in machine learning, introduced in Chapter 3. This causal
    inference assumption, the stable unit treatment value assumption, simply says
    that the outcome of one client only depends on the treatment made to that client,
    and is not affected by treatments to other clients. There are two important assumptions:


    +   1. *No unmeasured confounders* also known as *ignorability*. The dataset needs
    to contain all the confounding variables within X.

