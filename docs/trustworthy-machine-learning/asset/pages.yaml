    must take a value strictly greater than 0 and strictly less than 1. This definition
    explains the name positivity because the probability has to be positive, not identically
    zero. Another perspective on the assumption is that the probability distribution
    of X for the treatment group and the probability distribution of X for the control
    group should overlap; there should not be any support for one of the two distributions
    where there isn’t support for the other. Overlap and the lack thereof is illustrated
