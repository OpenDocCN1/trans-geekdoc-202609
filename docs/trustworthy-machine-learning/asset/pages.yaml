  md: 'Although d-separation among two sets of nodes can be checked by checking all
    three-node motifs along all paths between the two sets, there is a more constructive
    algorithm to check for d-separation.


    +   1. Construct the *ancestral graph* of $S_1$, $S_2$, and $S_3$. This is the
    subgraph containing the nodes in $S_1$, $S_2$, and $S_3$ along with all of their
    ancestors and all of the edges among these nodes.

    +   2. For each pair of nodes with a common child, draw an undirected edge between
    them. This step is known as *moralization*.

    +   3. Make all edges undirected.

    +   4. Delete all $S_3$ nodes.

    +   5. If $S_1$ and $S_2$ are separated in the undirected sense, then they are
    d-separated.


    An example is shown in Figure 3.5.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_49_0.png)


    **Figure 3.5** *An example of running the constructive algorithm to check for
    d-separation.* Accessible caption. The original graph has edges from $A_1$ and
    $A_2$ to $A_3$, from $A_3$ to $A_4$ and $A_5$, and from $A_4$ to $A_6$. $S_1$
