    # 17.3 A Data Science for Social Good Platform


    A foundation model, algorithm, or algorithmic toolkit that applies broadly to
    the problems faced by many social change organizations is an excellent start,
    but it is not enough to satisfy your theory of change. These technological artifacts
    alone do not empower social change organizations because they require a level
    of skill and infrastructure in data science and engineering that the organizations
    typically lack. Incongruously, social change organizations are typically low-resourced
    just like the people they serve, especially in comparison to private corporations
    embracing machine learning with large data science teams. You can say that social
    change organizations are at the ‘bottom of the pyramid’ among organizations. (In
    its typical usage, the term ‘bottom of the pyramid’ refers to the socioeconomically
    poorest or least wealthy group of people.)


    A washing machine, stove, or ultrasound imaging machine designed for a wealthy,
    high-resourced context will not cut it in a low-resourced context. The core technology
    has to be put into a form factor that makes sense for bottom-of-the-pyramid users.
    The same is true of machine learning for social change organizations. In general,
    bottom-of-the-pyramid innovation has the following twelve principles:¹⁴


    +   1. focus on (quantum jumps in) price performance;

    +   2. hybrid solutions, blending old and new technology;

    +   3. scalable and transportable operations across countries, cultures and languages;

    +   4. reduced resource intensity: eco-friendly products;

    +   5. identify appropriate functionality;

    +   6. build logistical and manufacturing infrastructure;

    +   7. deskills (services) work;

    +   8. educate (semiliterate) customers in product usage;


