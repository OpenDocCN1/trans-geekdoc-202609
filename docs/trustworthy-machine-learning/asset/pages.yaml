    other penalties can be added to the cross-entropy loss, the most common way to
    regularize neural networks is dropout. The idea is to randomly remove some nodes
    from the network on each iteration of an optimization procedure during training.
    Dropout’s goal is somewhat similar to bagging, but instead of creating an ensemble
    of several neural networks explicitly, dropout makes each iteration appear like
    a different neural network of an ensemble, which helps diversity and generalization.
