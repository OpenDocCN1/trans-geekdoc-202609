  md: 'dataset. Data scientists try out several different methods, tune their parameters,
    and see which one performs best empirically. The empirical comparison is conducted
    by randomly splitting the training dataset into a training partition on which
    the model is fit and a testing partition on which the model''s performance is
    validated. The partitioning and validation can be done once, or they can be done
    several times. When done several times, the procedure is known as cross-validation;
    it is useful because it characterizes the stability of the results. Cross-validation
    should be done for datasets with a small number of samples.


    The basic machine learning algorithm can be enhanced in several ways to satisfy
    additional objectives and constraints captured in the problem specification. One
    way to increase reliability across operating conditions is known as domain robustness.
    Machine learning algorithms that reduce unwanted biases are known as bias mitigation
    in-processing. One example category of methods for defending against data poisoning
    attacks is known as smoothing. A defense against a different kind of adversarial
    attack, the evasion attack, is adversarial training. Certain machine learning
    algorithms produce models that are simple in form and thus directly interpretable
    and understandable to people. Once again, all of these enhancements should be
    done according to the problem specification.


    Post-processing rules change the predicted label of a sample or compute additional
    information to accompany the predicted label. Post-processing methods can be divided
    into two high-level categories: open-box and closed-box. Open-box methods utilize
    information from the model such as its parameters and functions of its parameters.
    Closed-box methods can only see the output predictions arising from given inputs.
    Open-box methods should be used if possible, such as when there is close integration
    of model training and post-processing in the system. In certain scenarios, post-processing
    methods, also known as post hoc methods, are isolated from the model for logistical
    or security reasons. In these scenarios, only closed-box methods are tenable.
    Post-processing techniques for increasing reliability, mitigating unwanted biases,
    defending against adversarial attacks, and generating explanations should be used
    judiciously to achieve the goals of the problem owner. For example, post hoc explanations
    are important to provide to m-Udhār Solar''s loan officers so that they can better
    discuss the decision with the applicant.


    The specification of certain use cases calls for causal modeling: finding generalizable
    instances of cause-and-effect from the training data rather than only correlative
    patterns. These are problems in which input interventions are meant to change
    the outcome. For example, when coaching an employee for success, it is not good
    enough to identify the pattern that putting in extra hours is predictive of a
    promotion. Good advice represents a causal relationship: if the employee starts
    working extra hours, then they can expect to be promoted. It may be that there
    is a common cause (e.g. conscientiousness) for both doing quality work and working
    extra hours, but it is only doing quality work that causes a promotion. Working
    long hours while doing poor quality work will not yield a promotion; causal modeling
    will show that.


