- pgno: 50
  md: '# 3.5.3 Conclusion


    Independence and conditional independence allow you to know whether random variables
    affect one another. They are fundamental relationships for understanding a system
    and knowing which parts can be analyzed separately while determining a problem
    specification. One of the main benefits of graphical models is that statistical
    relationships are expressed through structural means. Separations are more clearly
    seen and computed efficiently.


    # 3.6 Summary


    +   - The first two attributes of trustworthiness, accuracy and reliability, are
    captured together through the concept of safety.

    +   - Safety is the minimization of the aleatoric uncertainty and the epistemic
    uncertainty of undesired high-stakes outcomes.

    +   - Aleatoric uncertainty is inherent randomness in phenomena. It is well-modeled
    using probability theory.

    +   - Epistemic uncertainty is lack of knowledge that can, in principle, be reduced.
    Often in practice, however, it is not possible to reduce epistemic uncertainty.
    It is well-modeled using possibility theory.

    +   - Problem specifications for trustworthy machine learning systems can be quantitatively
    expressed using probability and possibility.

    +   - It is easier to express these problem specifications using statistical and
    information-theoretic summaries of uncertainty than full distributions.

    +   - Conditional probability allows you to update your beliefs when you receive
    new measurements.

    +   - Independence and graphical models encode random variables not affecting
    one another.'
