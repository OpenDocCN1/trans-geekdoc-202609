  md: '# 12.4.3 Partial Dependence Plots


    The second global approach for increasing the trust of the appraisers and credit
    officers is the approximate feature-based explanation method known as partial
    dependence plots. The main idea is simple: compute and plot the classifier probability
    as a function of each of the feature dimensions X^(i) separately, that is P(Ŷ
    = 1 | X^(i) = x^(i)). You know exactly how to compute this partial dependence
    function from Chapter 3 by integrating or summing the probability P(Ŷ = 1 | X
    = x) over all the feature dimensions except dimension i, also known as marginalization.
    An example partial dependence plot for the ‘external risk estimate’ feature is
    shown in Figure 12.6.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_188_0.png)


    Figure 12.6. Partial dependence plot of the ‘external risk estimate’ feature for
    some uninterpretable classifier model. Accessible caption. A plot with partial
    dependence on the vertical axis and external risk estimate on the horizontal axis.
    The partial dependence smoothly increases in a sigmoid-like shape.


    The plot of an individual feature’s exact contribution to the probability in Figure
    12.5 for GAMs looks similar to a partial dependence plot in Figure 12.6 for an
    uninterpretable model, but is different for one important reason. The contributions
    of the individual features exactly combine to recreate a GAM because the different
    features are unlinked and do not interact with each other. In uninterpretable
    models, there can be strong correlations and interactions among input feature
    dimensions exploited by the model for generalization. By not visualizing the joint
    behaviors of multiple features in partial dependence plots, an understanding of
    those correlations is lost. The set of all d partial dependence functions is not
    a complete representation of the classifier. Together, they are only an approximation
    to the complete underlying behavior of the creditworthiness classifier.


    # 12.4.4 SHAP


    Just like LIME is a local version of global model approximation, a method known
    as SHAP is a local version of partial dependence plots. The partial dependence
    plot shows the entire curve of partial dependence across all feature values, whereas
    SHAP focuses on the precise point on the feature axis corresponding to a particular
    applicant in the deployment data. The SHAP value is simply the difference between
    the partial dependence value for that applicant and the average probability, shown
    in Figure 12.7.'
