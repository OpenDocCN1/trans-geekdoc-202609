    # 7.6 Summary


    +   - There are many different methods for finding decision functions from a finite
    number of training samples, each with their own inductive biases for how they
    generalize.

    +   - Different classifiers have different domains of competence: what kinds of
    datasets they have lower generalization error on than other methods.

    +   - Parametric and non-parametric plug-in methods (discriminant analysis, naïve
    Bayes, k-nearest neighbor) and risk minimization methods (decision trees and forests,
    margin-based methods, neural networks) all have a role to play in practical machine
    learning problems.

