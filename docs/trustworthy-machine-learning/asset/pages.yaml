  md: '# 12.3.2 Decision Trees and Boolean Rule Sets


    There is more variety in global feature-based directly interpretable models. Decision
    trees, introduced in Chapter 7, can be understood by regulators by tracing paths
    from the root through intermediate nodes to leaves containing predicted labels.⁹
    The individual features and thresholds involved in each node are explicit and
    well-understood. A hypothesis class similar to decision trees is Boolean rule
    sets (OR-of-AND rules and AND-of-OR rules) that people are able to comprehend
    directly. They are combinations of decision stumps or one-rules introduced in
    Chapter 7. An example of an OR-of-AND rule classifier for HELOC creditworthiness
    is one that predicts the applicant to be non-creditworthy if:¹⁰


    +   - (Number of Satisfactory Trades ≤ 17 AND External Risk Estimate ≤ 75) OR

    +   - (Number of Satisfactory Trades > 17 AND External Risk Estimate ≤ 72).


    This is a very compact rule set in which regulators can easily see the features
    involved and their thresholds. They can reason that the model is more lenient
    on external risk when the number of satisfactory trades is higher. They can also
    reason that the model does not include any objectionable features. (Once decision
    trees or Boolean rule sets become too large, they start becoming less interpretable.)


    One common refrain that you might hear is of a tradeoff between accuracy and interpretability.
    This argument is false.¹¹ Due to the Rashomon effect introduced in Chapter 9,
    many kinds of models, including decision trees and rule sets, have almost equally
    high accuracy on many datasets. The domain of competence for decision trees and
    rule sets is broad (recall that the domain of competence introduced in Chapter
    7 is the set of dataset characteristics on which a type of model performs well
    compared to other models). While it is true that scalably training these models
    has traditionally been challenging due to their discrete nature (discrete optimization
    is typically more difficult than continuous optimization), the challenges have
    recently been overcome.¹²


    > > “Simplicity is not so simple.”

    > >

    > > --Dmitry Malioutov, computer scientist at IBM Research


    When trained using advanced discrete optimization, decision trees and Boolean
    rule set classifiers show competitive accuracies across many datasets.'
