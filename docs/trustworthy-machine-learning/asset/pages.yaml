- pgno: 25
  md: '# 2


    # Machine Learning Lifecycle


    Imagine that you are a project manager on the innovation team of m-Udhār Solar,
    a (fictional) pay-as-you-go solar energy provider to poor rural villages that
    is struggling to handle a growing load of applications. The company is poised
    to expand from installing solar panels in a handful of pilot districts to all
    the districts in the state, but only if it can make loan decisions for 25 times
    as many applications per day with the same number of loan officers. You think
    machine learning may be able to help.


    Is this a problem to address with machine learning? How would you begin the project?
    What steps would you follow? What roles would be involved in carrying out the
    steps? Which stakeholders’ buy-in would you need to win? And importantly, what
    would you need to do to ensure that the system is *trustworthy*? Making a machine
    learning system trustworthy should not be an afterthought or add-on, but should
    be part of the plan from the beginning.


    The end-to-end development process or lifecycle involves several steps:


    +   1. problem specification,

    +   2. data understanding,

    +   3. data preparation,

    +   4. modeling,

    +   5. evaluation, and

    +   6. deployment and monitoring.


    Narrow definitions consider only the modeling step to be the realm of machine
    learning. They consider the other steps to be part of the broader endeavor of
    data science and engineering. Most books and research on machine learning are
    similarly focused on the modeling stage. However, you cannot really execute the
    development and deployment of a trustworthy machine learning system without focusing
    on all parts of the lifecycle. There are no shortcuts. This chapter sketches out
    the master plan.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 2.1 A Mental Model for the Machine Learning Lifecycle


    The six steps of the machine learning lifecycle given above, also illustrated
    in Figure 2.1, are codified in the Cross-Industry Standard Process for Data Mining
    (CRISP-DM) methodology. This is the mental model to keep in mind of how machine
    learning systems should be developed and deployed. Although the flow largely proceeds
    sequentially through the steps, there are several opportunities to go back and
    redo earlier steps. This description is stylized; even good examples of real-world
    lifecycles are messier, but the main idea continues to hold.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_26_0.png)


    Figure 2.1. Steps of the machine learning lifecycle codified in CRISP-DM. Different
    personas participate in different phases of the lifecycle. Accessible caption.
    A series of six steps arranged in a circle: (1) problem specification; (2) data
    understanding; (3) data preparation; (4) modeling; (5) evaluation; (6) deployment
    and monitoring. There are some backward paths: from data understanding to problem
    specification; from modeling to data preparation; from evaluation to problem specification.
    Five personas are associated with different steps: problem owner with steps 1–2;
    data engineer with steps 2–3; data scientist with steps 1–4; model validator with
    step 5; ML operations engineer with step 6. A diverse stakeholders persona is
    on the side overseeing all steps.


    Because the modeling stage is often put on a pedestal, there is a temptation to
    use the analogy of an onion in working out the project plan: start with the core
    modeling, work your way out to data'
  merge: -1
