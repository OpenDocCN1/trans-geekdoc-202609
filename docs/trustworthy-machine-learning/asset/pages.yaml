  md: '> > “The phrase ‘data science for social good’ is a broad umbrella, ambiguously
    defined.

    > > As many others have pointed out, the term often fails to specify good for
    whom.”

    > >

    > > —Rachel Thomas, data scientist at Queensland University of Technology


    It is dangerous for you to think that you or the data science teams at JCN Corporation
    are in position to determine what is an appropriate problem specification to uplift
    the most vulnerable people in the world. Data science for social good is littered
    with examples of technologists taking the shortcut of being paternalistic and
    making that determination themselves. If your data science teams are diverse and
    include people with lived experience of marginalization (see Chapter 16), then
    maybe they will be less paternalistic and push to have diverse, external problem
    owners.


    > > “Most technologists from the Global North are often not self-aware and thus
    look at problems in the Global South through the lens of technology alone. In
    doing so, they inevitably silence the plurality of perspectives.”

    > >

    > > —Patrick Meier, co-CEO of WeRobotics


    But who should those external problem owners be? Your first inclination is to
    look towards international development experts from large well-established governmental
    and non-governmental organizations, and consulting the seventeen UN Sustainable
    Development Goals (SDGs) listed in Chapter 15. But as you investigate further,
    you realize that there were a lot of struggles of power and politics that went
    into determining the SDGs; in particular, the lower-level targets beneath the
    seventeen goals may not represent the views of the most vulnerable.² You also
    learn that international development overall has many paternalistic tendencies
    and is also littered with projects that make no sense. Some may even be harmful
    to the people they intend to uplift.


    > > “Find algorithms that benefit people on their own terms.”

    > >

    > > —Jacob Metcalf, technology ethicist at Data & Society Research Institute


    Thus, while taking inspiration from the high-level topics touched on by the SDGs,
    you decide on the following theory of change for the JCN data science for social
    good program you are creating. Using machine learning, you will empower smaller,
    innovative social change organizations that explicitly include the knowledge of
