- pgno: 27
  md: 'understanding/preparation and evaluation, and then further work your way out
    to problem specification and deployment/monitoring. This analogy works well for
    a telecommunications system for example,¹ both pedagogically and in how the technology
    is developed, but a sequential process is more appropriate for a trustworthy machine
    learning system. Always start with understanding the use case and specifying the
    problem.


    > > “People are involved in every phase of the AI lifecycle, making decisions
    about which problem to address, which data to use, what to optimize for, etc.”

    > >

    > > —Jenn Wortman Vaughan, research scientist at Microsoft


    The different steps are carried out by different parties with different personas
    including problem owners, data engineers, data scientists, model validators, and
    machine learning (ML) operations engineers. Problem owners are primarily involved
    with problem specification and data understanding. Data engineers work on data
    understanding and data preparation. Data scientists tend to play a role in all
    of the first four steps. Model validators perform evaluation. ML operations engineers
    are responsible for deployment and monitoring.


    Additional important personas in the context of trustworthiness are the potential
    trustees of the system: human decision makers being supported by the machine learning
    model (m-Udbhār loan officers), affected parties about whom the decisions are
    made (rural applicants; they may be members of marginalized groups), regulators
    and policymakers, and the general public. Each stakeholder has different needs,
    concerns, desires, and values. Systems must meet those needs and align with those
    values to be trustworthy. Multi-stakeholder engagement is essential and cannot
    be divorced from the technical aspects of design and development. Documenting
    and transparently reporting the different steps of the lifecycle help build trust
    among stakeholders.


    # ## 2.2 Problem Specification


    The first step when starting the development of a machine learning system is to
    define the problem. What is the problem owner hoping to accomplish and why? The
    director of m-Udhār Solar wishes to automate a task that is cumbersome and costly
    for people to do. In other scenarios, problem owners may want to augment the capabilities
    of human decision makers to improve the quality of their decisions. They may have
    other goals altogether. In some cases, the problem should not even be solved to
    begin with, because doing so may cause or exacerbate societal harms and breach
    the lines of ethical behavior.² A harm is an outcome with a severe unwanted effect
    on a person’s life. This definition of harm is made more precise in Chapter 3.
    Let’s repeat this important point: do not solve problems that would lead to harms
    for someone or some group.


    ¹C. Richard Johnson, Jr. and William A. Sethares. *Telecommunication Breakdown:
    Concepts of Communication Transmitted via Software-Defined Radio.* Upper Saddle
    River, New Jersey, USA: Prentice Hall, 2003.


