  md: '# 9.3.3 Concept Drift


    Adapting to prior probability shift and covariate shift can be done without labels
    from the deployment data because they come from sampling bias in which the relationship
    between features and labels does not change. However, the same thing is not possible
    under concept drift because it comes from measurement bias: the relationship between
    features and labels changing from African countries to India. To adapt to concept
    drift, you must be very judicious in selecting unlabeled deployment data points
    to (expensively) get labels for. It could mean having a human expert in India
    look at some applications and provide judgement on whether to approve or deny
    the mobile money-enabled credit. There are various criteria for choosing points
    for such annotation. Once you''ve gotten the annotations, retrain the classifier
    on the newly labeled data from India (possibly with large weight) along with the
    older training data from East and Central African countries (possibly with small
    weight).


    # 9.4 Robustness


    Often, you do not have any data from the deployment environment, so adaptation
    is out of the question. You might not even know what the deployment environment
    is going to be. It might not even end up being India for all that you know. Robustness
    does not require you to have any deployment data. It modifies the learning objective
    and procedure.


    # 9.4.1 Prior Probability Shift


    If you don''t have any data from the deployment environment (India), you want
    to make your model robust to whatever prior probabilities of creditworthiness
    there could be. Consider a situation in which the deployment prior probabilities
    in India are actually p₀^(deploy) and p₁^(deploy) = (1 - p₀^(deploy)), but you
    guess that they are p₀^(train) and (1 - p₀^(train)), maybe by looking at the prior
    probabilities in the different African countries. Your guess is probably a little
    bit off. If you use the decision function corresponding to your guess with the
    likelihood ratio test threshold p₀^(train)/(1 - p₀^(train)) * c₁₀/c₀₁ (recall
    this was the form of the optimal threshold stated in Chapter 6), it has the following
    mismatched Bayes risk performance:¹¹


    R(p₀^(deploy), p₀^(train)) = c₁₀ p₀^(deploy) p_FP(p₀^(train)) + c₀₁ p₁^(deploy)
    p_FN(p₀^(train))


    Equation 9.3


    You lose out on performance. Your epistemic uncertainty in knowing the right prior
    probabilities has hurt the Bayes risk.


    To be robust to the uncertain prior probabilities in present-day India, choose
    a value for p₀^(train) so that the worst-case performance is as good as possible.
    Known as a min-max formulation, the problem is to find a min-max optimal prior
    probability point that you''re going to use when you deploy the Phulo model. Specifically,
    you want:'
