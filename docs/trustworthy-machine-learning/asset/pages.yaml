    tend to yield meaningful dimensions that people can provide semantics to, such
    as the example of ‘foliage in the neighborhood’ mentioned above. Therefore, disentangled
    representation is a way of pre-processing the training data features to make them
    more human-interpretable. Modeling and explanation methods later in the pipeline
    take the new features as input.


    Sometimes, disentangled representation to improve the features is not good enough
    to provide meaning to consumers. Similarly, sometimes tabular data features are
    just not sufficient to provide meaning to a consumer. In these cases, an alternative
    pre-processing step is to directly elicit meaningful explanations from consumers,
    append them to the dataset as an expanded cardinality label set, and train a model
    to predict both the original appraisal or creditworthiness as well as the explanation.⁷


    # 12.3 Explanations for Regulators


    Directly interpretable models are simple enough for consumers to be able to understand
    *exactly* how they work by glancing at their form. They are appropriate for regulators
    aiming for model safety. They are a way to reduce epistemic uncertainty and achieve
    *inherently safe design*: models that do not have any spurious components.⁸ The
    explanation is done by restricting the hypothesis class from which the decision
    function is drawn to only those functions that are simple and understandable.
    There are two varieties of directly interpretable exact models: (1) local sample-based
    and (2) global feature-based. Moreover, model understanding by regulators is enhanced
    by global sample-based explanations, both exact and approximate.


    # 12.3.1 k-Nearest Neighbor Classifier


    The k-nearest neighbor classifier introduced in Chapter 7 is the main example
    of a local sample-based directly interpretable model. The predicted creditworthiness
    or appraisal label is computed as the average label of nearby training data points.
    Thus, a local explanation for a given input data point is just the list of the
    k-nearest neighbor samples, including their labels. This list is simple enough
    for regulators to understand. You can also provide the distance metric for additional
    understanding.


