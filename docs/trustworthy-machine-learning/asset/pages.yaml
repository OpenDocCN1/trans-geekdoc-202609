  md: 'In the fourth phase of the lifecycle, the team will take the prepared data
    and develop an individualized causal model of factors that lead to opioid misuse.12
    Coming after the problem specification phase that sets forth the modeling task
    and the performance metrics, and after the data understanding and data preparation
    phases that finalize the dataset, the modeling phase is not open-ended like the
    soccer referee and mortality prediction tasks described in the previous section.
    The modeling is quite constrained from the perspective of the data scientist.


    A recent study tasked 399 data scientists, each working alone, with developing
    models of the mathematical literacy of people based on approximately five hundred
    of their biographical features; the dataset and basic performance metrics were
    clearly specified (no fairness metric was specified).13 Importantly, the dataset
    had many data points and was purposefully and carefully collected as a representative
    sample without population biases. Thus, the dataset had negligible epistemic uncertainty.
    The study analyzed the 399 models that were created and found no significant relationship
    between the unwanted bias of the models and the sociocultural characteristics
    of the data scientists that produced them.


    In this example and other similar regimented and low-epistemic uncertainty modeling
    tasks, the lived experience of the team is seemingly of low importance. In contrast,
    when there is great epistemic uncertainty like you may have in analyzing opioid
    abuse, the inductive bias of the model chosen by the data scientist has a great
    role to play and the lived experience of the data scientist can become important.
    However, mirroring the argument made earlier about an explicit problem specification
    lessening the epistemic advantage for members of marginalized groups in feature
    engineering, a clear specification of all relevant trust metric dimensions also
    lessens the usefulness of lived experience in modeling.


    Evaluating the opioid risk model once it has been created is not as straightforward
    as simply testing it for the specified allowable trust metric ranges in the ways
    described in Chapter 14. Once a model is tangible, you can manipulate it in various
    ways and better imagine the harms it could lead to. Thus, being critical of the
    model during evaluation is also a job better done by a team that has members who
    have experienced systematic disadvantage and are attuned to the negative impacts
    it may have if it is deployed within Sospital''s operations.


    Finally, if the model has passed the evaluation stage, the ML operations engineers
    on the team carry out the deployment and monitoring phase of the lifecycle. Their
    role is primarily to ensure technical integration with Sospital''s other systems
    and noting when the trust metric ranges elicited during value alignment are violated
    over time. This is another phase of the lifecycle in which there is not much epistemic
    advantage to be had by a team containing engineers with lived experience of marginalization.


    Overall, as shown in Figure 16.1, three lifecycle phases (problem specification,
    data understanding, and evaluation) can take advantage of having a diverse team
    containing members that have lived experience of marginalization. The other three
    phases (data preparation, modeling, and deployment and monitoring) benefit less
    from the epistemic advantage of team members with lived experience of'
