  md: 'preserving data mining is also known as *interactive anonymization*. TraceBridge
    may want to do either or both: publishing datasets for examination by organizational
    leaders or state regulators, and issuing contact tracing alerts without exposing
    individually-identifiable data. They have to go down both paths and learn about
    the appropriate technical approaches in each case: *syntactic anonymity* for data
    publishing and *differential privacy* for data mining.⁶


    There are three main categories of variables when dealing with privacy: (1) identifiers,
    (2) quasi-identifiers, and (3) sensitive attributes. *Identifiers* directly reveal
    the identity of a person. Examples include the name of the person, national identification
    numbers such as the social security number, or employee serial numbers. Identifiers
    should be dropped from a dataset to achieve privacy, but such dropping is not
    the entire solution. In contrast, *quasi-identifiers* do not uniquely identify
    people on their own, but can reveal identity when linked together through a process
    known as *re-identification*. Examples are gender, birth date, postal code, and
    group membership. *Sensitive attributes* are features that people do not want
    revealed. Examples are health status, voting record, salary, and movement information.
    Briefly, syntactic anonymity works by modifying quasi-identifiers to reduce their
    information content, including suppressing them, generalizing them, and shuffling
    them. Differential privacy works by adding noise to sensitive attributes. A mental
    model for the two modes of privacy is given in Figure 5.1.


    To make this mental model more concrete, let''s see how it applies to an actual
