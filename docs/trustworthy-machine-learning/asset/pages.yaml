    # 14.2.3  What Are the Appropriate Metrics?


    After the second stage of value alignment, you know which pillars of trustworthiness
    are higher priority and you can move on to figuring out specific metrics within
    the pillars. This problem is known as *performance metric elicitation*. In previous
    chapters, you’ve already learned about different considerations when making these
    determinations. For example, in Chapter 6, it was discussed that AUC is an appropriate
    basic performance metric when you desire good performance across all operating
    points. As another example, Table 10.1 summarized the considerations in determining
    group fairness metrics: whether you are testing data or models, whether there
    is social bias in the measurement process, and whether the favorable label is
    assistive or non-punitive. We will not repeat those arguments here, which you
    should definitely go through, but will mention another tool to help you in metric
    elicitation.


    In the previous elicitation task, it was difficult to go straight to a total preference
    ordering for the different pillars of trustworthiness; the task was made easier
    by asking simpler and more structured judgments using CP-nets. There’s a similar
    story here, but using *pairwise comparisons* instead of CP-nets. The elicitation
    process is like an optometrist helping you hone in on your preferred eye prescription
    by having you compare a sequence of pairs of lenses. Here, the pairwise comparisons
    are between different possible metrics within a given pillar. By comparing the
    values of two metrics for many models, you get a sense of what they’re indicating
    and can choose one over the other. If the pairs are chosen in an intelligent way
    and you do enough comparisons, you will converge onto your preferred metric. One
    such intelligent way to efficiently elicit basic performance metrics and fairness
    metrics is by taking advantage of their linearity or quadratically properties
    and showing users a sequence of pairs of confusion matrices (recall confusion
    matrices from Chapter 6).¹¹ Confusion matrices may be too difficult for different
    stakeholders to reason about in their typical format as a 2×2 matrix of numbers;
    alternate visualizations of confusion matrices such as tree diagrams, flow charts,
    and matrices presented with


    ¹¹ Gaurush Hiranandani, Harikrishna Narasimhan, and Oluwasemi Koyejo. “Fair Performance
