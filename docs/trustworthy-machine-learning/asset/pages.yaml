    for it have any hope? In this chapter, you’ll work toward an answer by:


    +   - sketching the reasons why society is so reliant on the digital platforms
    of ‘big tech,’

    +   - examining the paradigm that leads to echo chambers, disinformation, and
    hate speech in greater detail, and

    +   - evaluating possible means for countering the negative externalities.


    # 18.1 Epistemic Dependence and Institutional Trust


    As you’re well aware, the amount of knowledge being created in our world is outpacing
    our ability to understand it. And it is only growing more complex. The exponential
    increase in digital information has been a boon for machine learning, but perhaps
    not so much for individual people and society. There is so much information in
    the modern world that it is impossible for any one person, on their own, to have
    the expertise to really understand or judge the truth of even a sliver of it.
    These days, even expert scientists do not understand the intricacies of all parts
    of their large-scale experimental apparatus.² Known as epistemic dependence, people
    have to rely on others to interpret knowledge for them. You’ve already learned
    about epistemic uncertainty (lack of knowledge) and epistemic advantage (knowledge
    of harms possessed by people with lived experience of marginalization) in Chapter
    3 and Chapter 16, respectively. Epistemic dependence is along the same lines:
    obtaining knowledge you lack from people who possess it, trusting them without
    being able to verify the truth of that knowledge yourself.


    The people from whom you can obtain knowledge now includes anyone anywhere at
    lightning speed from their messages, articles, blog posts, comments, photos, podcasts,
    and videos on the internet. Epistemic dependence no longer has any bounds, but
    the space of knowledge is so vast that it requires search engines and recommendation
    algorithms to deal with retrieving the information. And what is going on behind
    the scenes is almost never clear to the user of a search engine. It is something
    abstract and mysterious in the ether. Even if the seeker of knowledge were aware
    of an information retrieval algorithm’s existence, which is typically based on
    machine learning, its workings would not be comprehensible. So not only do you
    have to trust the source and content of the knowledge, but also the


