  md: 'from measurement differences. The three different types of distribution shift
    are summarized in Table 9.1.


    Table 9.1. The three types of distribution shift.


    | Type | What Changes | What is the Same | Source | Threatens | Learning Problem
    |

    |---|---|---|---|---|---|

    | prior probability shift | Y | X|Y | sampling | external validity | anticausal
    learning |

    | covariate shift | X | Y|X | sampling | external validity | causal learning |

    | concept drift | Y|X | X | measurement | construct validity | causal learning
    |

    | concept drift | X|Y | Y | measurement | construct validity | anticausal learning
    |


    Let’s go through an example of each type to see which one (or more than one) affects
    the Phulo situation. There will be prior probability shift if there are different
    proportions of creditworthy people in present-day India and historical African
    countries, maybe because of differences in the overall economy. There will be
    covariate shift if the distribution of features is different. For example, maybe
    people in India have more assets in gold than in East and Central African countries.
    There will be concept drift if the actual mechanism connecting the features and
    creditworthiness is different. For example, people in India who talk or SMS with
    many people may be more creditworthy while in East and Central Africa, people
    who talk or SMS with few people may be more creditworthy.


    One way to describe the different types of distribution shifts is through the
    context or environment. What does changing the environment in which the data was
    measured and sampled do to the features and label? And if you’re talking about
    doing, you’re talking about causality. If you treat the environment as a random
    variable E, then the different types of distribution shifts have the causal graphs
    shown in Figure 9.4.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_130_0.png)


    Figure 9.4. Causal graph representations of the different types of distribution
    shift. Accessible caption. Graphs of prior probability shift (E → Y → X), covariate
    shift (E → X → Y), concept drift (E → Y ← X), and concept drift (E → X ← Y).


    6 Meelis Kull and Peter Flach. "Patterns of Dataset Shift." In: Proceedings of
    the International Workshop on Learning over Multiple Contexts. Nancy, France,
    Sep. 2014.'
