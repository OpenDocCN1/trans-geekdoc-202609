  md: '# 3.3 Summary Statistics of Uncertainty


    Full probability distributions are great to get going with problem specification,
    but can be unwieldy to deal with. It is easier to set problem specifications using
    summary statistics of probability distributions and random variables.


    # 3.3.1 Expected Value and Variance


    The most common statistic is the expected value of a random variable. It is the
    mean of its distribution: a typical value or long-run average outcome. It is computed
    as the integral of the pdf multiplied by the random variable:


    E[X] = ∫_{-∞}^{∞} x p_X(x) dx.


    Equation 3.4


    Recall that in the example earlier, ThriveGuild borrowers had the income pdf 0.5e^{-0.5x}
    for x ≥ 0 and zero elsewhere. The expected value of income is thus ∫_0^∞ x0.5e^{-0.5x}
    dx = 2.^ When you have a bunch of samples drawn from the probability distribution
    of X, denoted {x_1, x_2, ..., x_n}, then you can compute an empirical version
    of the expected value, the sample mean, as x̄ = 1/n Σ_{i=1}^n x_i. Not only can
    you compute the expected value of a random variable alone, but also the expected
    value of any function of a random variable. It is the integral of the pdf multiplied
    by the function. Through expected values of performance, also known as risk, you
    can specify average behaviors of systems being within certain ranges for the purposes
    of safety.


    How much variability in income should you plan for among ThriveGuild applicants?
    An important expected value is the variance E[(X − E[X])^2], which measures the
    spread of a distribution and helps answer the question. Its sample version, the
    sample variance is computed as 1/(n−1) Σ_{j=1}^n (x_j − x̄)^2. The correlation
    between two random variables X (e.g., income) and Y (e.g., loan approval) is also
    an expected value, E[XY], which tells you whether there is some sort of statistical
    relationship between the two random variables. The covariance, E[(X − E[X])(Y
    − E[Y])] = E[XY] − E[X]E[Y], tells you whether if one random variable increases,
    the other will also increase, and vice versa. These different expected values
    and summary statistics give different insights about aleatoric uncertainty that
    are to be constrained in the problem specification.


    # 3.3.2 Information and Entropy


    Although means, variances, correlations, and covariances capture a lot, there
    are other kinds of summary statistics that capture different insights needed to
    specify machine learning problems. A different way to summarize aleatoric uncertainty
    is through the information of random variables. Part of information theory, the
    information of a discrete random variable X with pmf p_X(x) is I(x) = −log(p_X(x)).
    This logarithm is usually in base 2. For very small probabilities close to zero,
    the information is very large. This makes sense since the occurrence of a rare
    event (an event with small probability) is deemed'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'very informative. For probabilities close to one, the information is close
    to zero because common occurrences are not informative. Do you go around telling
    everyone that you did not win the lottery? Probably not, because it is not informative.
    The expected value of the information of X is its entropy:


    $H(X) = E[I(X)] = -\sum_{x\in\mathcal{X}} p_X(x)\log(p_X(x))$.


    Equation 3.5


    Uniform distributions with equal probability for all outcomes have maximum entropy
    among all possible distributions. The difference between the maximum entropy achieved
    by the uniform distribution and the entropy of a given random variable is the
    redundancy. It is known as the Theil index when used to summarize inequality in
    a population. For a discrete random variable X taking non-negative values, which
    is usually the case when measuring assets, income, or wealth of individuals, the
    Theil index is:


    $\text{Theil index} = \sum_{x\in\mathcal{X}} p_X(x)\frac{x}{E[X]}\log\left(\frac{x}{E[X]}\right)$.


    Equation 3.6


    where $\mathcal{X} = \{0,1,...,\infty\}$ and the logarithm is the natural logarithm.
    The index''s values range from zero to one. The entropy-maximizing distribution
    in which all members of a population have the same value, which is the mean value,
    has zero Theil index and represents the most equality. A Theil index of one represents
    the most inequality. It is achieved by a pmf with one non-zero value and all other
    zero values. (Think of one lord and many serfs.) In Chapter 10, you''ll see how
    to use the Theil index to specify machine learning systems in terms of their individual
    fairness and group fairness requirements together.


    # 3.3.3 Kullback-Leibler Divergence and Cross-Entropy


    The Kullback-Leibler (K-L) divergence compares two probability distributions and
    gives a different avenue for problem specification. For two discrete random variables
    defined on the same sample space with pmfs p(x) and q(x), the K-L divergence is:


    $D(p \| q) = -\sum_{x\in\mathcal{X}} p(x)\log\left(\frac{p(x)}{q(x)}\right)$.


    Equation 3.7


    It measures how similar or different two distributions are. Similarity of one
    distribution to a reference distribution is often a requirement in machine learning
    systems.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The cross-entropy is another quantity defined for two random variables on the
    same sample space that represents the average information in one random variable
    with pmf p(x) when described using a different random variable q(x):


    H(p || q) = - ∑_{x∈X} p(x) log(q(x)).


    Equation 3.8


    As such, it is the entropy of the first random variable plus the K-L divergence
    between the two variables:


    H(p || q) = H(p) + D(p || q).


    Equation 3.9


    When p = q, then H(p || q) = H(p) because the K-L divergence term goes to zero
    and there is no remaining mismatch between p and q. Cross-entropy is used as an
    objective for training neural networks as you''ll see in Chapter 7.


    # 3.3.4 Mutual Information


    As the last summary statistic of aleatoric uncertainty in this section, let''s
    talk about mutual information. It is the K-L divergence between a joint distribution
    p_{X,Y}(x,y) and the product of its marginal distributions p_X(x)p_Y(y):


    I(X, Y) = D( p_{X,Y}(x,y) || p_X(x)p_Y(y) ).


    Equation 3.10


    It is symmetric in its two arguments and measures how much information is shared
    between X and Y. In Chapter 5, mutual information is used to set a constraint
    on privacy: the goal of not sharing information. It crops up in many other places
    as well.


    # 3.4 Conditional Probability


    When you''re looking at all the different random variables available to you as
    you develop ThriveGuild''s lending system, there will be many times that you get
    more information by measuring or observing some random variables, thereby reducing
    your epistemic uncertainty about them. Changing the possibilities of one random
    variable through observation can in fact change the probability of another random
    variable. The random variable Y given that the random variable X takes value x
    is not the same as just the random variable Y on its own. The probability that
    you would approve a loan application without knowing any specifics about the applicant
    is different from the probability of your decision if you knew, for example, that
    the applicant is employed.'
  merge: -1
