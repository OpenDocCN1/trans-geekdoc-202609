  md: 'A very important concept in practicing machine learning, first mentioned in
    Chapter 2, is the *no free lunch theorem*. There is no one single machine learning
    method that is best for all datasets.¹ What is a good choice for one dataset might
    not be so great for another dataset. It all depends on the characteristics of
    the dataset and the *inductive bias* of the method: the assumptions on how the
    classifier should *generalize* outside the training data points. The challenge
    in achieving good generalization and a small error rate is protecting against
    *overfitting* (learning a model that too closely matches the idiosyncrasies of
    the training data) and *underfitting* (learning a model that does not adequately
    capture the patterns in the training data). The goal is to get to the Goldilocks
    point where things are not too hot (overfitting) and not too cold (underfitting),
    but *just right.*


    An implication of the no free lunch theorem is that you must try several different
    methods for the JCN Corporation expertise problem and see how they perform empirically
    before deciding on one over another. Simply brute forcing it—training all the
    different methods and computing their test error to see which one is smallest—is
    common practice, but you decide that you want to take a more refined approach
    and analyze the inductive biases of different classifiers. Your analysis will
    determine the *domains of competence* of various classifiers: what types of datasets
    do they perform well on and what type of datasets do they perform poorly on.²
    Recall that competence or basic accuracy is the first attribute of trustworthy
    machine learning as well as the first half of safety.


    Why would you want to take this refined approach instead of simply applying a
    bunch of machine learning methods from software packages such as scikit-learn,
    tensorflow, and pytorch without analyzing their inductive biases? First, you have
    heeded the admonitions from earlier chapters to be safe and to not take shortcuts.
    More importantly, however, you know you will later be creating new algorithms
    that respect the second (reliability) and third (interaction) attributes of trustworthiness.
    You must not only be able to apply algorithms, you must be able to analyze and
    evaluate them before you can create. Now go forth and analyze classifiers for
    inventorying expertise in the JCN Corporation workforce.


