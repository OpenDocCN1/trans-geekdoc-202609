  md: 'even argue that people should be compensated for their personal data because
    they are selling their privacy.³ In short, *data is power.*


    > “Data is the new oil.”


    > —Clive Humby, data science entrepreneur at dunnhumby


    Data used in machine learning is often fraught with power and consent issues because
    it is often repurposed from other uses or is so-called *data exhaust*: byproducts
    from people’s digital activities. For example, many large-scale image datasets
    used for training computer vision models are scraped from the internet without
    explicit consent from the people who posted the images.⁴ Although there may be
    implicit consent through vehicles such as Creative Commons licenses, a lack of
    explicit consent can nevertheless be problematic. Sometimes copyright laws are
    violated in scraped and repurposed data. Why does this happen? It is almost always
    due to system designers taking shortcuts to gather large datasets and show value
    quickly without giving thought to power and consent. And it is precisely the most
    powerful who tend to be least cognizant of issues of power. People from marginalized,
    minoritized, and otherwise less powerful backgrounds tend to have more knowledge
    of the perspectives of both the powerful and the powerless.⁵ This concept, known
    as the *epistemic advantage* of people with lived experience of marginalization,
    is covered in greater detail in Chapter 16. Similarly, except in regulated application
    domains such as health care, privacy issues have usually been an afterthought
    due to convenience. Things have started to change due to comprehensive laws such
    as the General Data Protection Regulation enacted in the European Economic Area
    in 2018.


    In summary, problem owners and data scientists should not have any calculus to
    weigh issues of power, consent and privacy against conveniences in data collection.
    For the fourth attribute of trust (aligned purpose), trustworthy machine learning
    systems require that data be used consensually, especially from those who could
    be subject to exploitation. No ifs, ands, or buts!


