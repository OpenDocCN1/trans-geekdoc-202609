  md: 'First, because the training data is sampled i.i.d. from the underlying distribution,
    the proportion of employees in the training data set skilled and unskilled at
    serverless architecture will approximately match the prior probabilities $p_0$
    and $p_1$, so you do not have to worry about them explicitly. Second, the probabilities
    of both the false positive event $P(\hat{y}(X)=1\mid Y=0)$ and false negative
    event $P(\hat{y}(X)=0\mid Y=1)$ event can be expressed collectively as $P(\hat{y}(X)\neq
    Y)$, which corresponds to $\hat{y}(x_j)\neq y_j$ for training data samples. The
    *zero-one loss function* $L\left(y_j,\hat{y}(x_j)\right)$ captures this by returning
    the value 1 for $\hat{y}(x_j)\neq y_j$ and the value 0 for $\hat{y}(x_j)=y_j$.
    Putting all these things together, the empirical approximation to the error probability,
    known as the *empirical risk* $R_{\text{emp}}$, is:


    $$R_{\text{emp}} = \frac{1}{n}\sum_{j=1}^{n} L\left(y_j,\hat{y}(x_j)\right).$$


    Equation 7.2


    Minimizing the empirical risk over all possible decision functions $\hat{y}$ is
    a possible classification algorithm, but not one that you and the other JCN Corporation
    data scientists evaluate just yet. Let’s understand why not.


    # 7.4.2 Structural Risk Minimization


    Without any constraints, you can find a decision function that brings the empirical
    risk to zero but does not generalize well to new unseen data points. At the extreme,
    think about a classifier that memorizes the training data points and gets them
    perfectly correct, but always predicts $\hat{y}=0$ (unskilled at serverless architecture)
    everywhere else. This is not the desired behavior—the classifier has overfit.
    So just minimizing the empirical risk does not yield a competent classifier. This
    memorizing classifier is pretty complex. There’s nothing smooth or simple about
    it because it has as many discontinuities as there are training set employees
    skilled at serverless architecture.


    Constraining the complexity of the classifier forces it to not overfit. To be
    a bit more precise, if you constrain the decision function $\hat{y}$ to be an
    element of some class of functions or *hypothesis space* $\mathcal{F}$ that only
    includes low-complexity functions, then you will prevent overfitting. But you
    can go too far with the constraints as well. If the hypothesis space is too small
    and does not contain any functions with the capacity to capture the important
    patterns in the data, it may underfit the data and not generalize either. It is
    important to control the hypothesis space to be just right. This idea is known
    as the *structural risk minimization principle.*


    Figure 7.5 shows the idea in pictorial form using a sequence of nested hypothesis
    spaces $\mathcal{F}_1 \subset \mathcal{F}_2 \subset \cdots \subset \mathcal{F}_6$.
    As an example of nested hypothesis spaces, $\mathcal{F}_1$ could be all constant
    functions, $\mathcal{F}_2$ could be all linear functions, $\mathcal{F}_3$ could
    be all quadratic functions, and $\mathcal{F}_6$ could be all polynomial functions.
    $\mathcal{F}_1$ contains the least complex $\hat{y}$ functions while $\mathcal{F}_6$
    also contains more complex $\hat{y}$ functions. $\mathcal{F}_1$ underfits as it
    has large values for both the empirical risk $R_{\text{emp}}$ calculated on the
    training data and the probability of error $p_E$, which measures generalization.
    $\mathcal{F}_6$ overfits as it has zero $R_{\text{emp}}$ and a large value for
    $p_E$. $\mathcal{F}_2$ achieves a good balance and is just right.'
  merge: -1
  img_proc: true
