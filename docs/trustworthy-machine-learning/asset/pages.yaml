  md: 'This updated probability is known as a *conditional probability* and is used
    to quantify a probability when you have additional information that the outcome
    is part of some event. The conditional probability of event *A* given event *B*
    is the ratio of the cardinality of the joint event *A* and *B*, to the cardinality
    of the event *B*⁹:


    $P(A \mid B) = \frac{\lVert A \cap B \rVert}{\lVert B \rVert} = \frac{P(A \cap
    B)}{P(B)}$


    Equation 3.11


    In other words, the sample space changes from Ω to *B*, so that is why the denominator
    of Equation 3.1 (‖A‖/‖Ω‖) changes from Ω to *B* in Equation 3.11. The numerator
    ‖A ∩ B‖ captures the part of the event *A* that is within the new sample space
    *B*. There are similar conditional versions of pmfs, cdfs, and pdfs defined for
    random variables.


    Through conditional probability, you can reason not only about distributions and
    summaries of uncertainty, but also how they change when observations are made,
    outcomes are revealed, and evidence is collected. Using a machine learning model
    is similar to getting the conditional probability of the label given the feature
    values of an input data point. The probability of loan approval given the features
    for one specific applicant being employed with an income of 15,000 dollars is
    a conditional probability.


    In terms of summary statistics, the *conditional entropy of Y given X* is:


    $H(Y \mid X) = -\sum_{y \in \mathcal{Y}} \sum_{x \in \mathcal{X}} p_{Y,X}(y,x)
    \log\left(\frac{p_{Y,X}(y,x)}{p_X(x)}\right)$


    Equation 3.12


    It represents the average information remaining in *Y* given that *X* is observed.


    Mutual information can also be written using conditional entropy as:


    $I(X,Y) = H(Y) - H(Y \mid X) = H(X) - H(X \mid Y)$.


    Equation 3.13


    In this form, you can see that mutual information quantifies the reduction in
    entropy in a random variable by conditioning on another random variable. In this
    role, it is also known as *information gain*, and used as a criterion for learning
    decision trees in Chapter 7. Another common criterion for learning decision trees
    is the *Gini index*:'
  merge: -1
