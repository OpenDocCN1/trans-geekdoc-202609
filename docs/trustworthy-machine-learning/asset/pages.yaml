    # 17.4 Summary


    +   - Data science for social good—using machine learning in a beneficent way—is
    not an application area for machine learning, but a paradigm and value system.

    +   - The goal is to empower social change organizations in the development of
    machine learning systems that help uplift vulnerable people on their own terms.

    +   - The decade-long experience with data science for social good has rarely
    yielded truly impactful results because individual projects fail to overcome the
    last-mile problem.

    +   - Social change organizations are typically low-resourced and need much more
    than just code or a custom solution to be able to use machine learning in their
    operations.

