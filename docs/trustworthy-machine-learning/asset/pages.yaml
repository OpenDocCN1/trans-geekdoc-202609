    # 8.1.2 Causal Model vs. Predictive Model


    How do you tell that a problem is asking for a causal model rather than a predictive
    model that would come from standard supervised machine learning? The key is identifying
    whether something is actively changing one or more of the features. The act of
    classifying borrowers as good bets for a loan does not change anything about the
    borrowers at the time, and thus calls for a predictive model (also known as an
    associational model) as used by ThriveGuild in Chapter 3 and Chapter 6. However,
    wanting to understand if providing job training to a client of ABC Center (actively
    changing the value of a feature on job preparedness) results in a change to their
    probability of being approved by ThriveGuild is a causal modeling question.


    Using predictive models to form causal conclusions can lead to great harms. Changes
    to input features of predictive models do not necessarily lead to desired changes
    of output labels. All hell can break loose if a decision maker is expecting a
    certain input change to lead to a certain output change, but the output simply
    does not change or changes in the opposite direction. Because ABC Center wants
    to model what happens to clients upon receiving social services, you should suggest
    to the director that the problem specification be focused on causal models to
    understand the center''s set of interventions (various social services) and outcomes
    that measure how well a client is progressing out of poverty.


    An important point is that even if a model is only going to be used for prediction,
    and not for making decisions to change inputs, causal models help sidestep issues
    introduced in Chapter 4—construct validity (the data really measures with it should),
    internal validity (no errors in data processing), and external validity (generalization
    to other settings)—because it forces the predictions to be based on real, salient
    phenomena rather than spurious phenomena that just happen to exist in a given
    dataset. For this reason, causality is an integral component of trustworthy machine
    learning, and comes up in Part 4 of the book that deals with reliability. Settling
    for predictive models is a shortcut when just a little more effort to pursue causal
    models would make a world of difference.


