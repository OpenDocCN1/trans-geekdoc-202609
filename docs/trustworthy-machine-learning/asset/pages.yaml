    # 14.3 Fusion of Preferences Over a Group


    Based on the previous section, you have several ways to tell the machine learning
    system your preferred values at different levels of granularity. As the problem
    owner, you have a lot of power. But should you wield that power unilaterally?
    Wouldn''t it better to include diverse voices and build consensus? Yes it would;
    it is important to take the preferences of other stakeholders such as the executive
