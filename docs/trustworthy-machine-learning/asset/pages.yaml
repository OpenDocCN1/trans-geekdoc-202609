  md: "# 4\n\n# Data Sources and Biases\n\nThe mission of the (fictional) non-profit\
    \ organization Unconditionally is charitable giving. It collects donations and\
    \ distributes unconditional cash transfers—funds with no strings attached—to poor\
    \ households in East Africa. The recipients are free to do whatever they like\
    \ with the money. Unconditionally is undertaking a new machine learning project\
    \ to identify the poorest of the poor households to select for the cash donations.\
    \ The faster they can complete the project, the faster and more efficiently they\
    \ can move much-needed money to the recipients, some of whom need to replace their\
    \ thatched roofs before the rainy season begins.\n\nThe team is in the data understanding\
    \ phase of the machine learning lifecycle. Imagine that you are a data scientist\
    \ on the team pondering which data sources to use as features and labels to estimate\
    \ the wealth of households. You examine all sorts of data including daytime satellite\
    \ imagery, nighttime illumination satellite imagery, national census data, household\
    \ survey data, call detail records from mobile phones, mobile money transactions,\
    \ social media posts, and many others. What will you choose and why? Will your\
    \ choices lead to unintended consequences or to a trustworthy system?\n\nThe data\
    \ understanding phase is a really exciting time in the lifecycle. The problem\
    \ goals have been defined; working with the data engineers and other data scientists,\
    \ you cannot wait to start acquiring data and conducting exploratory analyses.\
    \ Having data is a prerequisite for doing machine learning, but not any data will\
    \ do. It is important for you and the team to be careful and intentional at this\
    \ point. Don’t take shortcuts. Otherwise, before you know it, you will have a\
    \ glorious edifice built upon a rocky foundation.\n\n> “Garbage in, garbage out.”\n\
    > \n> —Wilf Hey, computer scientist at IBM\n\nThis chapter begins Part 2 of the\
    \ book focused on all things data (remember the organization of the book shown\
    \ in Figure 4.1)."
