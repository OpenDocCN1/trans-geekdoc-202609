- pgno: 240
  md: 'Sociocultural differences are associated with differences in lived experience
    of marginalization.⁹ Remember from Chapter 1 that lived experience is the personal
    knowledge you have gained through direct involvement in things from which you
    have no option to escape. Related to the second characteristic of the team: what
    the team members know, one key cognitive theory relevant for trustworthy machine
    learning is that people with lived experience of marginalization have an epistemic
    advantage: when people reflect on their experience of being oppressed, they are
    better able to understand all sides of power structures and decision-making systems
    than people who have not been oppressed.¹⁰ Briefly mentioned in Chapter 4, they
    have a bifurcated consciousness that allows them to walk in the shoes of both
    the oppressed and the powerful. In contrast, privileged people tend to have blind
    spots and can only see their own perspective.


    > > “People with marginalized characteristics—so people who had experienced discrimination—had
    a deeper understanding of the kinds of things that could happen to people negatively
    and the way the world works in a way that was a bit less rosy.”

    > >

    > > —Margaret Mitchell, research scientist at large


    > > “The lived experiences of those directly harmed by AI systems gives rise to
    knowledge and expertise that must be valued.”

    > >

    > > —Emily Denton, research scientist at Google


    > > “Technical know-how cannot substitute for contextual understanding and lived
    experiences.”

    > >

    > > —Meredith Whittaker, research scientist at New York University


    In modern Western science and engineering, knowledge derived from lived experience
    is typically seen as invalid; often, only knowledge obtained using the scientific
    method is seen as valid. This contrasts with critical theory, which has knowledge
    from the lived experience of marginalized people at its very foundation. Given
    the many ethics principles founded in critical theory covered in Chapter 15, it
    makes sense to consider lived experience in informing your development of a model
    for opioid misuse risk. Toward this end, in the remainder of the chapter, you
    will:


    +   - map the cognitive benefit of the lived experience of team members to the
    needs and requirements of different phases of the machine learning lifecycle,
    and

    +   - formulate lifecycle roles and architectures that take advantage of that
    mapping.'
