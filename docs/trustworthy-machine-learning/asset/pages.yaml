    Adversaries may target either the modeling phase or the deployment phase of the
    machine learning lifecycle. By attacking the modeling phase, they can corrupt
    the training data or model so that it is mismatched from the data seen in deployment.
    These are known as poisoning attacks and have similarities with distribution shift,
