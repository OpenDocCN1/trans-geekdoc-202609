- pgno: 187
  md: 'the learning objective of the directly interpretable model from the standard
    risk minimization objective to an objective of matching the uninterpretable model
    as closely as possible.18


    The second sub-approach for approximation using directly interpretable models,
    known as SRatio, computes training data weights based on the uninterpretable model
    and interpretable model. Then it trains the directly interpretable model with
    the instance weights.19 You''ve seen reweighing of data points repeatedly in the
    book: inverse probability weighting for causal inference, confusion matrix-based
    weights to adapt to prior probability shift, importance weights to adapt to covariate
    shift, and reweighing as a pre-processing bias mitigation algorithm. The general
    idea here is the same, and is almost a reversal of importance weights for covariate
    shift.


    Remember from Chapter 9 that in covariate shift settings, the training and deployment
    feature distributions are different, but the labels given the features are the
    same: p_X^(train)(x) ≠ p_X^(deploy)(x) and p_{Y|X}^(train)(y|x)=p_{Y|X}^(deploy)(y|x).
    The importance weights are then: w_j = p_X^(deploy)(x_j)/p_X^(train)(x_j). For
    explanation, there is no separate training and deployment distribution; there
    is an uninterpretable and an interpretable model. Also, since you''re explaining
    the prediction process, not the data generating process, you care about the predicted
    label ŷ instead of the true label Y. The feature distributions are the same because
    you train the uninterpretable and interpretable models on the same training data
    houses or applicants, but the predicted labels given the features are different
    since you''re using different models: p_X^(interp)(x)=p_X^(uninterp)(x) and p_{Ŷ|X}^(interp)(ŷ|x)
    ≠ p_{Ŷ|X}^(uninterp)(ŷ|x).


    So following the same pattern as adapting to covariate shift by computing the
    ratio of the probabilities that are different, the weights are: w_j = p_{Ŷ|X}^(uninterp)(ŷ|x)/p_{Ŷ|X}^(interp)(ŷ|x).
    You want the interpretable model to look like the uninterpretable model. In the
    weight expression, the numerator comes from the classifier score of the trained
    uninterpretable model and the denominator comes from the score of the directly
    interpretable model trained without weights.


    # 12.4.2 LIME


    Global feature-based explanation using model approximation has an extension to
    the local explanation case known as local interpretable model-agnostic explanations
    (LIME). The idea is similar to the global method from the previous subsection.
    First you train an uninterpretable model and then you approximate it by fitting
    a simple interpretable model to it. The difference is that you do this approximation
    around each deployment data point separately rather than trying to come up with
    one overall approximate model.


    To do so, you get the uninterpretable model''s prediction on the deployment data
    point you care about, but you don''t stop there. You add a small amount of noise
    to the deployment data point''s features several times to create a slew of perturbed
    input samples and classify each one. You then use this new set of data points
    to train the directly interpretable model. The directly interpretable model is
    a local approximation because it is based only on a single deployment data point
    and a set of other data points created around it. The interpretable model can
    be a logistic regression or decision tree and is simply shown to the decision
    maker, the Hilo appraiser or credit officer.'
