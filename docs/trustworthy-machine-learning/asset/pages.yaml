  md: '# 16.1 Lived Experience in Different Phases of the Lifecycle


    The first stage in the lifecycle of developing an opioid misuse risk model is
    problem specification and value alignment. In this phase, there is a clear need
    for the inclusion of people with different lived experiences to question assumptions
    and identify critical issues in the four levels of value alignment covered in
    Chapter 14: whether you should work on the problem, which pillars of trustworthiness
    are of concern, how to measure performance in those pillars, and acceptable ranges
    of metrics. The epistemic advantage of these team members is critical in this
    phase. The blind spots of team members who have not experienced systematic disadvantages
    will prevent them from noticing all the possible misuses and harms that can arise
    from the system, such as undue denials of care to traditionally marginalized individuals.
    This is the phase in which participatory design, also covered in Chapter 14, should
    be used.


    > > “New perspectives ask new questions and that''s a fact. This is exactly why
    inclusion matters!”

    > >

    > > —Deb Raji, fellow at Mozilla


    The second phase, data understanding, requires digging into the available data
    and its provenance to identify the possible bias and consent issues detailed in
    Chapter 4 and Chapter 5. This is another phase in which it is important for the
    team to be critical, and it is useful to have members with epistemic advantage.
    In Chapter 10, we already saw that the team developing the Sospital care management
    system needed to recognize the bias against African Americans when using health
    cost as a proxy for health need. Similarly, a diagnosis for opioid addiction in
    a patient’s data implies that the patient actually interacted with Sospital for
    treatment, which will also be biased against groups that are less likely to utilize
    the health care system. Problem owners, stakeholders, and data scientists from
    marginalized groups are more likely to recognize this issue. Furthermore, a variety
    of lived experiences will help discover that large dosage opioid prescriptions
    from veterinarians in a patient’s record are for their pets, not for them; prescription
    claims for naltrexone, an opioid itself, represent treatment for opioid addiction,
    not evidence of further misuse; and so on.


    The third phase in developing an opioid misuse model is data preparation. You
    can think of data preparation in two parts: (1) data integration and (2) feature
    engineering. Critique stemming from lived experience has little role to play in
    data integration because of its mechanical and rote nature. Is this also the case
    in the more creative feature engineering part? Remember from Chapter 10 that biases
    may be introduced in feature engineering, such as by adding together different
    health costs to create a single column. Such biases may be spotted by team members
    who are advantaged in looking for them. However, if dataset constraints, such
    as dataset fairness metric constraints, have already been included in the problem
    specification of the opioid misuse model in anticipation of possible harms, then
    no additional epistemic advantage is needed to spot the issues. Thus, there is
    less usefulness of lived experience of marginalization among team members in the
    data preparation stage of the lifecycle.'
