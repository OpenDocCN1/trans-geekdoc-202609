  md: 'Upwe.com to already be on the right side of regulations when they become binding,
    you will have a leg up on other platforms and might have a chance of being sustainable.


    In parallel, you should also try to push for direct ways of controlling the paradigm
    rather than controlling the negative externalities because doing so will be more
    powerful. Regulations are one recognized way of limiting negative externalities;
    Pigouvian taxes are the other main method recognized by economists. A Pigouvian
    tax is precisely a tax on a negative externality to discourage the behaviors that
    lead to it. A prominent example is a tax on carbon emissions levied on companies
    that pollute the air. In the context of social media platforms, the tax would
    be on every ad that was delivered based on a targeting model driven by machine
    learning.19 Such a tax would directly push ‘big tech’ companies to change their
    paradigm while leaving the Upwe.com paradigm alone.


    Seeing out your vision of an Upwe.com that contributes to the wellbeing of all
    members of society may seem like an insurmountable challenge, but do not lose
    hope. Societal norms are starting to push for what you want to build, and that
    is the key.


    # 18.4 Conclusion


    +   - There is so much and such complicated knowledge in our world today that
    it is impossible for anyone to understand it all, or even to verify it. We all
    have epistemic dependence on others.

    +   - Much of that dependence is satisfied by content on the internet that comes
    to us on information platforms filtered by machine learning algorithms. The paradigm
    driving those algorithms is maximizing the engagement of the user on the platform.

    +   - The engagement maximization paradigm inherently leads to side effects such
    as filter bubbles, disinformation, and hate speech, which have real-world negative
    consequences.

    +   - The machine learning models supporting content recommendation on the platforms
    is so disconnected from the experiences of the general public that it does not
    make sense to focus on models’ interpersonal trustworthiness, which has been the
    definition of trustworthiness throughout the book. An alternative notion of institutional
    trustworthiness is required.

    +   - Institutional trustworthiness is based on governance mechanisms and their
    transparency, which can be required by government regulations if there is enough
    societal pressure for them. Transparency may help change the underlying paradigm,
    but taxes may be a stronger direct push.

    +   - A new paradigm based on relational ethics is needed, which centers truth,
    a diversity of perspectives, and wellbeing for all.


    > > “I nod to you and up we come.”

    > >

    > > —Norbert Buskey, band teacher at Fayetteville-Manlius High School'
