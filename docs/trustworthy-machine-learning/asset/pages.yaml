  md: 'engaged on a platform. Moreover, people spread false news significantly faster
    on social media platforms than true news.^8


    > > “Having constructed a technological apparatus that disseminates information
    instantaneously and globally without regard to its veracity, we shouldn''t be
    surprised that this apparatus has left us drowning in lies.”

    > >

    > > —Mark Pesce, futurist


    *Clickbait* is one example of false, surprising, and attractive content that drives
    engagement. It is a kind of *misinformation* (a falsehood that may or may not
    have been deliberately created to mislead) and also a kind of *disinformation*
    (a falsehood that was purposefully created to mislead). In fact, ‘big tech’ companies
    have been found to finance so-called clickbait farms to drive up their platforms’
    engagement.^9


    > > “Misinformation tends to be more compelling than journalistic content, as
    it’s easy to make something interesting and fun if you have no commitment to the
    truth.”

    > >

    > > —Patricia Rossini, communications researcher at University of Liverpool


    Another type of disinformation enabled by machine learning is *deepfakes*. These
    are images or videos created with the help of generative modeling that make it
    seem as though a known personality is saying or doing something that they did
    not say or do. Deepfakes are used to create credible messaging that is false.


    Although some kinds of misinformation can be harmless, many kinds of disinformation
    can be extremely harmful to individuals and societies. For example, Covid-19 anti-vaccination
    disinformation on social media in 2021 led to vaccination hesitancy in many countries,
    which led to greater spread of the disease and death. Other disinformation has
    political motives that are meant to destabilize a nation.


    # 18.2.3  Hate Speech and Inciting Violence


    Whether false or true (disinformation or not), hate speech (abusive language against
    a particular group) attracts attention. Traditional media typically does not disseminate
    hate speech. The terms and conditions of many social media platforms also do not
    allow for hate speech and provide mechanisms for users to flag it. Nevertheless,
    since the problem of defining and moderating hate speech at the scale of worldwide
    digital platforms is difficult, much hate speech does get posted in social media
    platforms and then amplified via information filtering algorithms because it is
    so engaging.'
