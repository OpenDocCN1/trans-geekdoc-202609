    # 10.3.3 Choosing Between Statistical Parity and Average Odds Difference


    What’s the point of these two different group fairness metrics? They don’t appear
    to be radically different. But they actually are radically different in an important
    conceptual way: either you believe there is social bias during measurement or
    not. These two worldviews have been named (1) “we’re all equal” (the privileged
    group and unprivileged group have the same inherent distribution of health in
    the construct space, but there is bias during measurement that makes it appear
    this is not the case) and (2) “what you see is what you get” (there are inherent
    differences between the two groups in the construct space and this shows up in
    the observed space without a need for any bias during measurement).⁸ Since under
    the “we’re all equal” worldview, there is already structural bias in the observed
    space (blacks have lower health utilization and cost for the same level of health
    as whites), it does not really make sense to look at model accuracy rates computed
    in an already-biased space. Therefore, independence or disparate impact fairness
    definitions make sense and your problem specification should be based on them.
    However, if you believe that “what you see is what you get”—the observed space
    is a true representation of the inherent distributions of the groups and the only
    bias is sampling bias—then the accuracy-related equality of odds fairness metrics
    make sense. In this case, your problem specification should be based on equality
    of odds.


    # 10.3.4 Average Predictive Value Difference


    And if it wasn’t complicated enough, let’s throw one more group fairness definition
    into the mix: *calibration by group* or *sufficiency*. Recall from Chapter 6 that
    for continuous score outputs, the predicted score corresponds to the proportion
    of positive true labels in a *calibrated* classifier, or \(P(Y = 1 \mid S = s)
    = s\). For fairness, you’d like the calibration to be true across the groups defined
    by protected attributes, so \(P(Y = 1 \mid S = s, Z = z) = s\) for all groups
    \(z\). If a classifier is calibrated by group, it is also *sufficient*, which
    means that \(Y\) and \(Z\) conditioned on \(S\) (or \(\hat{Y}(X)\)) are independent.
    The graphical models for sufficiency are shown in Figure 10.6. To allow for better
    comparison to Figure 10.5 (the graphical models of separation), the predicted
    score is indicated by \(\hat{Y}\) rather than \(S\).


    ⁸Sorelle A. Friedler, Carlos Scheidegger, and Suresh Venkatasubramanian. “On the
    (Im)possibility of Fairness: Different Value Systems Require Different Mechanisms
    for Fair Decision Making.” In: *Communications of the ACM* 64.4 (Apr. 2021), pp.
    136–143.'
