  md: '# Shortcut


    Even though I have admonished you throughout the entire book to slow down, think,
    and not take shortcuts, I know some of you will still want to take shortcuts.
    Don''t do it. But if you''re adamant about it and are going take a shortcut anyway,
    I might as well equip you properly.


    Here is a picture showing how I structured the book, going from bottom to top.
    This direction makes sense pedagogically because you need to understand the concepts
    at the bottom before you can understand the nuances of the concepts that are higher
    up. For example, it is difficult to understand fairness metrics without first
    covering detection theory, and it is difficult to understand value elicitation
    about fairness metrics without first covering fairness. However, if you want to
    jump right into things, you should notionally start at the top and learn things
    from below as you go along.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_266_0.png)


    Accessible caption. A stack of items in 8 layers. Top layer: ethics principles;
    layer 2: governance; layer 3: transparency, value alignment; layer 4: interpretability/explainability,
    testing, uncertainty quantification; layer 5: distributional robustness, fairness,
    adversarial robustness; layer 6: detection theory, supervised learning, causal
    modeling; layer 7: data biases, data consent, data privacy; bottom layer: probability
    and possibility theory, data. An upward arrow is labeled pedagogical direction.
    A downward arrow is labeled notional shortcut.'
