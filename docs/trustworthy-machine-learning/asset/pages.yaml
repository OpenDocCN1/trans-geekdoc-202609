    # 6.1.3 Accounting for Different Operating Points


    The Bayes risk is all well and good if there is a fixed set of prior probabilities
    and a fixed set of costs, but things change. If the economy improves, potential
    borrowers might become more reliable in loan repayment. If a different problem
    owner comes in and has a different interpretation of opportunity cost, then the
    cost of false negatives c₁₀ changes. How should you think about the performance
    of decision functions across different sets of those values, known as different
    operating points?


    Many decision functions are parameterized by a threshold η (including the optimal
    decision function that will be demonstrated in Section 6.2). You can change the
    decision function to be more or less forgiving of false positives or false negatives,
    but not both at the same time. Varying η explores this tradeoff and yields different
    error probability pairs (p_FP, p_FN), i.e. different operating points. Equivalently,
    different operating points correspond to different false positive rate and true
    positive rate pairs (p_FP, p_TP). The curve traced out on the p_FP-p_TP plane
    as the parameter η is varied from zero to infinity is the receiver operating characteristic
    (ROC). The ROC takes values (p_FP = 0, p_TP = 0) when η → ∞ and (p_FP = 1, p_TP
    = 1) when η → 0. You can understand this because at one extreme, the decision
    function always says ŷ = 0; in this case there are no FPs and no TPs. At the other
    extreme, the decision function always says ŷ = 1; in this case all decisions are
    either FPs or TPs.


    The ROC is a concave, nondecreasing function illustrated in Figure 6.3. The closer
    to the top left corner it goes, the better. The best ROC for discrimination goes
    straight up to (0,1) and then makes a sharp turn to the right. The worst ROC is
    the diagonal line connecting (0,0) and (1,1) achieved by random guessing. The
    area under the ROC, also known as the area under the curve (AUC) synthesizes performance
    across all operating points and should be selected as a metric when it is likely
    that the same threshold-parameterized decision function will be applied in very
