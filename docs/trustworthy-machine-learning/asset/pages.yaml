  md: '# 1


    # Establishing Trust


    Artificial intelligence is the study of machines that exhibit traits associated
    with a human mind such as perception, learning, reasoning, planning, and problem
    solving. Although it had a prior history under different names (e.g. cybernetics
    and automata studies), we may consider the genesis of the field of artificial
    intelligence to be the Dartmouth Summer Research Project on Artificial Intelligence
    in the summer of 1956. Soon thereafter, the field split into two camps: one focused
    on symbolic systems, problem solving, psychology, performance, and serial architectures,
    and the other focused on continuous systems, pattern recognition, neuroscience,
    learning, and parallel architectures.¹ This book is primarily focused on the second
    of the two partitions of artificial intelligence, namely machine learning.


    The term machine learning was popularized in Arthur Samuel''s description of his
    computer system that could play checkers,² not because it was explicitly programmed
    to do so, but because it learned from the experiences of previous games. In general,
    machine learning is the study of algorithms that take data and information from
    observations and interactions as input and generalize from specific inputs to
    exhibit traits of human thought. Generalization is a process by which specific
    examples are abstracted to more encompassing concepts or decision rules.


    One can subdivide machine learning into three main categories: (1) supervised
    learning, (2) unsupervised learning, and (3) reinforcement learning. In supervised
    learning, the input data includes observations and labels; the labels represent
    some sort of true outcome or common human practice in reacting to the observation.
    In unsupervised learning, the input data includes only observations. In reinforcement
    learning, the inputs are interactions with the real world and rewards accrued
    through those actions rather than a fixed dataset.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The applications of machine learning may be divided into three broad categories:
    (1) cyber-physical systems, (2) decision sciences, and (3) data products. Cyber-physical
    systems are engineered systems that integrate computational algorithms and physical
    components, e.g. surgical robots, self-driving cars, and the smart grid. Decision
    sciences applications use machine learning to aid people in making important decisions
    and informing strategy, e.g. pretrial detention, medical treatment, and loan approval.
    Data products applications are the use of machine learning to automate informational
    products, e.g. web advertising placement and media recommendation. These settings
    vary widely in terms of their interaction with people, the scale of data, the
    time scale of operation and consequence, and the severity of consequences. Trustworthy
    machine learning is important in all three application categories, but is typically
    more pronounced in the first two categories: cyber-physical systems and decision
    sciences. In data products applications, trustworthy machine learning contributes
    to a functioning non-violent society.


    Just a few years ago, the example applications in all of the categories would
    have been unheard of. In recent years, however, machine learning has achieved
    superlative performance on several narrowly-defined tasks across domains (often
    surpassing the abilities of human experts on those same tasks) and invaded the
    popular imagination due to the confluence of three factors: data, algorithms,
    and computation. The amount of data that is captured digitally and thus available
    to machine learning algorithms has increased exponentially. Algorithms such as
    deep neural networks have been developed to generalize well from that data. Computational
    paradigms such as graphical processing units and cloud computing have allowed
    machine learning algorithms to tractably learn from very large datasets.


    The end result is that machine learning has become a general purpose technology
    that can be used in many different application domains for many different uses.
    Like other general purpose technologies before it,³ such as the domestication
    of plants, the wheel, and electricity, machine learning is starting to remake
    all parts of society. In some parts of the world, machine learning already has
    an incipient role in every part of our lives, including health and wellness, law
    and order, commerce, entertainment, finance, human capital management, communication,
    transportation, and philanthropy.


    Despite artificial intelligence’s promise to reshape different sectors, there
    has not yet been wide adoption of the technology except in certain pockets such
    as electronic commerce and media. Like other general purpose technologies, there
    are many short-term costs to the changes required in infrastructure, organizations,
    and human capital.⁴ In particular, it is difficult for many businesses to collect
    and curate data from disparate sources. Importantly, corporations do not trust
    artificial intelligence and machine learning in critical enterprise workflows
    because of a lack of transparency into the inner workings and a potential lack
    of reliability. For example, a recent study of business'
