    You might ask yourself whether the constraint in the second line does anything
    useful. Shouldn’t the first line alone give you the same solution? This is a question
    that machine learning researchers are currently struggling with.16 They find that
    usually, the standard risk minimization formulation of machine learning from Chapter
    7 is the most robust to general distribution shifts, without the extra invariant
    risk minimization constraints. However, when the problem is an anticausal learning
    problem and the feature distributions across environments have similar support,
    invariant risk minimization may outperform standard machine learning (remember
    from earlier in the chapter that the label causes the features in anticausal learning).17


    In a mobile money-enabled credit approval setting like you have with Phulo, it
    is not entirely clear whether the problem is causal learning or anticausal learning:
    do the features cause the label or do the labels cause the features? In a traditional
    credit scoring problem, you are probably in the causal setting because there are
    strict parameters on features like salary and assets that cause a person to be
    viewed by a bank as creditworthy or not. In the mobile money and unbanked setting,
    you could also imagine the problem to be anticausal if you think that a person
    is inherently creditworthy or not, and the features you’re able to collect from
    their mobile phone usage are a result of the creditworthiness. As you’re developing
    the Phulo model, you should give invariant risk minimization a shot because you
    have datasets from several countries, require robustness to concept drift and
    generalization to new countries, and likely have an anticausal learning problem.
    You and your data science team can be happy that you’ve given Wavetel and the
    Bank of Bulandshahr a model they can rely on during the launch of Phulo.


    # 9.5 Summary


    +   - Machine learning models should not take shortcuts if they are to be reliable.
    You must minimize epistemic uncertainty in modeling, data preparation, sampling,
    and measurement.

    +   - Data augmentation is a way to reduce epistemic uncertainty in modeling.

    +   - Distribution shift—the mismatch between the probability distribution of
    the training data and the data you will see during deployment—has three special
    cases: prior probability shift, covariate shift, and concept drift. Often, you
    can’t detect distribution shift. You just have to assume it.

    +   - Prior probability shift and covariate shift are easier to overcome than
    concept drift because they arise from sampling bias rather than measurement bias.

    +   - A pre-processing strategy for mitigating prior probability shift and covariate
    shift is adaptation, in which sample weights multiply the training loss during
    the model learning process. Finding'
