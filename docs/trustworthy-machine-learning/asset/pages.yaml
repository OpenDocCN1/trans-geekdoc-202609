    \ JCN Corporation is rolling out machine learning in another human resources effort:\
    \ proactive retention. Using historical employee administrative data, JCN Corporation\
    \ is developing a system to predict employees at risk of voluntarily resigning\
    \ in the next six months and offering incentives to retain them. The data includes\
    \ internal corporate information on job roles and responsibilities, compensation,\
    \ market demand for jobs, performance reviews, promotions, and management chains.\
    \ JCN Corporation has consent to use the employee administrative data for this\
    \ purpose through employment contracts. The data was made available to JCN Corporation’s\
    \ data science team under institutional control after a syntactic anonymity transformation\
    \ was performed.\n\nThe team has developed several attrition prediction models\
    \ using different machine learning algorithms, keeping accuracy, fairness, distributional\
    \ robustness, adversarial robustness, and explainability as multiple goals. If\
    \ the attrition prediction models are fair, the proactive retention system could\
    \ make employment at JCN Corporation more equitable than it is right now. The\
    \ project has moved beyond the problem specification, data understanding, data\
    \ preparation, and modeling phases of the development lifecycle and is now in\
    \ the evaluation phase.\n\n> “The full cycle of a machine learning project is\
    \ not just modeling. It is finding the right data, deploying it, monitoring it,\
    \ feeding data back [into the model], showing safety—doing all the things that\
    \ need to be done [for a model] to be deployed. [That goes] beyond doing well\
    \ on the test set, which fortunately or unfortunately is what we in machine learning\
    \ are great at.”\n> \n> --Andrew Ng, computer scientist at Stanford University"
