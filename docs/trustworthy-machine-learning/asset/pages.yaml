- pgno: 153
  md: 'The biggest question in individual fairness is deciding the distance metric
    by which the nearest neighbors are determined. Which kind of distance makes sense?
    Should all features be used in the distance computation? Should protected attributes
    be excluded? Should some feature dimensions be corrected for in the distance computation?
    These choices are where politics and worldviews come into play.^10^ Typically,
    protected attributes are excluded, but they don’t have to be. If you believe there
    is no bias during measurement (the “what you see is what you get” worldview),
    then you should simply use the features as is. In contrast, suppose you believe
    that there are structural social biases in measurement (the “we’re all equal”
    worldview). In that case, you should attempt to undo those biases by correcting
    the features they’re fed into a distance computation. For example, if you believe
    that blacks with three outpatient doctor visits are equal in health to whites
    with five outpatient doctor visits, then your distance metric can add two outpatient
    visits to the black members as a correction.


    # 10.4.2  Counterfactual Fairness


    One special case of individual fairness is when two patients have exactly the
    same feature values and only differ in one protected attribute. Think of two patients,
    one black and one white who have an identical history of interaction with the
    health care system. The situation is deemed fair if both receive the same predicted
    label—either both are given extra care management or both are not given extra
    care management—and unfair otherwise. Now take this special case a step further.
    As a thought experiment, imagine an intervention $do(Z)$ that changes the protected
    attribute of a Sospitol member from black to white or vice versa. If the predicted
    label remains the same for all members, the classifier is *counterfactually fair*.^11^
    (Actually intervening to change a member’s protected attribute is usually not
    possible immediately, but this is just a thought experiment.) Counterfactual fairness
    can be tested using treatment effect estimation methods from Chapter 8.


    Protected attributes causing different outcomes across groups is an important
    consideration in many laws and regulations.^12^ Suppose you have a full-blown
    causal graph of all the variables given to you or you discover one from data using
    the methods of Chapter 8. In that case, you can see which variables have causal
    paths to the label nodes, either directly or passing through other variables.
    If any of the variables with causal paths to the label are considered protected
    attributes, you have a fairness problem to investigate and mitigate.


    # 10.4.3  Theil Index


    If you don’t want to decide between group and individual fairness metrics as you’re
    figuring out the hospital care management problem specification, do you have any
    other options? Yes you do. You can use the Theil index, which was first introduced
    in Chapter 3 as a summary statistic for uncertainty. It naturally combines both
    individual and group fairness considerations. Remember from that chapter that
    the Theil index was originally developed to measure the distribution of wealth
    in a society. A value


    ^10^Reuben Binns. “On the Apparent Conflict Between Individual and Group Fairness.”
    In: *Proceedings of the ACM Conference on Fairness, Accountability, and Transparency*.
    Barcelona, Spain, Jan. 2020, pp: 514–524.


    ^11^Joshua R. Loftus, Chris Russell, Matt J. Kusner, and Ricardo Silva. “Causal
    Reasoning for Algorithmic Fairness.” arXiv:1805.05859, 2018.


    ^12^Alice Xiang. “Reconciling Legal and Technical Approaches to Algorithmic Bias.”
    In: *Tennessee Law Review* 88.3 (2021).'
