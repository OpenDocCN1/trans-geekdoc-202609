  md: 'The main trick in differential privacy is solving for the kind of noise and
    its strength to add to y(W). For lots of query functions, the best kind of noise
    comes from the Laplace distribution.13 As stated earlier, some queries are easier
    than others. This easiness is quantified using global sensitivity, which measures
    how much a single row of a dataset impacts the query value. Queries with smaller
    global sensitivity need lower strength noise to achieve ε-differential privacy.


    Just like with syntactic privacy, it can be easier to think about differential
    privacy alongside other problem specifications in trustworthy machine learning
    like accuracy, fairness, robustness, and explainability when expressed in terms
    of information theory rather than the more specialized terminology used in defining
    it earlier. To do so, we also need to say that the dataset W is a random variable,
    so the probabilities that we want to be close to each other are the noised query
    results conditioned on the dataset realizations P(Ŷ | W = w₁) and P(Ŷ | W = w₂).
    Then we can pose our objective of differential privacy as wanting the mutual information
    between the dataset and noisy query result I(W, Ŷ) to be minimized. With some
    more specifics added to minimizing the mutual information, we can get back a relationship
    in terms of the ε of ε-differential privacy.14 The idea of examining the mutual
    information between the dataset and the query is as follows. Since mutual information
    measures the reduction in uncertainty about the dataset by the knowledge of the
    query, having zero (or small) mutual information indicates that we don’t learn
    anything about the dataset’s composition from the query result, which is exactly
    the idea of differential privacy.


    Differential privacy is intended to prevent attributing the change of the query’s
    value to any one person’s row of data. Nevertheless, one criticism of differential
    privacy as imagined in its information theory presentation is that it can allow
    the value of sensitive attributes to be inferred if there are correlations or
    associations among the rows. Stricter information-theoretic conceptions of differential
    privacy have been developed that require the rows of the dataset to be independent.


    # 5.2.3 Conclusion


    TraceBridge has a few different use cases as part of their app and contact tracing
    system. One is publishing sensitive data for the leaders of the organization,
    external regulators, or auditors to look at. A second is to interactively query
    statistics from the sensitive data without revealing things about individuals.
    Each use has different appropriate approaches: syntactic anonymity for the first
    and differential privacy for the second, along with different requirements on
    the system design and the infrastructure required. Existing legal protections
    in various jurisdictions and application domains are mostly for the first use
    case (data publishing), but the regulations themselves are usually unclear on
    their precise notion of privacy. TraceBridge may have to go with both approaches
    to privacy in developing a trusted system.


    We’ve reached the end of this section and haven’t talked about the tradeoff of
    privacy with utility. All measures and approaches of providing privacy should
    be evaluated in conjunction with how the data is going to be used. It is a balance.
    The tradeoff parameters are there for a reason. The usefulness of a dataset after
    k-anonymization is usually pretty good for a decent-sized k, but might not be
    so great after'
