  md: '# Table 8.2. *Characteristics of the two branches of causal inference methods.*


    | Branch | Dataset | What Is Learned | Purpose |

    |---|---|---|---|

    | treatment models | \(\{(t_1,x_1), ..., (t_n,x_n)\}\) | \(P(T \mid X)\) | use
    to weight the data points |

    | outcome models | \(\{(t_1,x_1,y_1), ..., (t_n,x_n,y_n)\}\) | \(E[Y \mid T,X]\)
    | use directly for average treatment estimation |


    Why is learning \(E[Y \mid T, X]\) models from data useful? How do you get the
    average treatment effect of anxiety reduction on stable housing from them? Remember
    that the definition of the average treatment effect is \(\tau = E[Y \mid do(t
    = 1)] - E[Y \mid do(t = 0)]\). Also, remember that when there is no confounding,
    the associational distribution and interventional distribution are equal, so \(E[Y
    \mid do(t)] = E[Y \mid T = t]\). Once you have \(E[Y \mid T = t, X]\), you can
    use something known as the law of iterated expectations to adjust for \(X\) and
    get \(E[Y \mid T = t]\). The trick is to take an expectation over \(X\) because
    \(E_X[E_Y[Y \mid T = t, X]] = E_Y[Y \mid T = t]\). (The subscripts on the expectations
    tell you which random variable you’re taking the expectation with respect to.)
    To take the expectation over \(X\), you sum the outcome model over all the values
    of \(X\) weighted by the probabilities of each of those values of \(X\). It is
    clear sailing after that to get the average treatment effect because you can compute
    the difference \(E[Y \mid T = 1] - E[Y \mid T = 0]\) directly.


    You have the causal model; now on to the machine learning model. When the outcome
    label \(Y\) takes binary values 0 and 1 corresponding to the absence and presence
    of stable housing, then the expected values are equivalent to the probabilities
    \(P(Y \mid T = 1, X = x)\) and \(P(Y \mid T = 0, X = x)\). Learning these probabilities
    is a job for a calibrated machine learning classifier with continuous score output
    trained on labels \(y_i\) and features \((t_j, x_j)\). You can use any machine
    learning method from Chapter 7 with the same guidelines for domains of competence.
    Traditionally, it has been common practice to use linear margin-based methods
    for the classifier, but nonlinear methods should be tried especially for high-dimensional
    data with lots of possible confounding variables.


    Just like with treatment models, being able to compute an average treatment effect
    using outcome models does not automatically mean that your result is a causal
    inference. You still have to evaluate. A first evaluation, which is also an evaluation
    for treatment models, is calibration. You want small calibration loss and a straight
    line calibration curve. A second evaluation for outcome models is accuracy, for
    example measured using AUC. With outcome models, just like with regular machine
    learning models but different from treatment models, you want the AUC to be as
    large as possible approaching 1.0. If the AUC is too small, do not proceed with
    this model and go back to step 1 in the iterative approach to average treatment
    effect estimation illustrated in Figure 8.10.


    A third evaluation for outcome models examines the predictions they produce to
    evaluate ignorability or unmeasured confounders. The predicted \(Y \mid t = 1\)
    and \(Y \mid t = 0\) values coming out of the outcome models should be similar
    for clients who were actually part of the treatment group (received the anxiety
    reduction intervention) and clients who were part of the control group (did not
    receive the anxiety reduction intervention). If the predictions are not similar,
    there is still some confounding left over after adjusting for \(X\) (child care
    and other variables), which means that the assumption of no unmeasured confounders
    is violated. Thus, if the predicted \(Y \mid t = 1\) and \(Y \mid t = 0\) values
    for the two groups do not mostly overlap, then do not proceed and go back to the
    choice of causal model and machine learning model.'
