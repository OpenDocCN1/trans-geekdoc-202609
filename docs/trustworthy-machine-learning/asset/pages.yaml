  md: '# ### 8.2.1  Backdoor Paths and Confounders


    It is important to note that the definition of the average treatment effect is
    conditioned on $do(t)$, not on $t$, and that $P(Y \mid do(t))$ and $P(Y \mid t)$
    are generally not the same. Specifically, they are not the same when there is
    a so-called *backdoor path* between $T$ and $Y$. Remember that a path is a sequence
    of steps along edges in the graph, irrespective of their direction. A *backdoor
    path* is any path from $T$ to $Y$ that (1) starts with an edge going into $T$
    and (2) is not blocked. The reason for the name “backdoor” is because the first
    edge goes backwards into $T$. (Frontdoor paths have the first edge coming out
    of $T$.) Recall from Chapter 3 that a path is blocked if it contains:


    +   1. a causal chain motif with the middle node observed, i.e. the middle node
    is conditioned upon,

    +   2. a common cause motif with the middle node observed, or

    +   3. a common effect motif with the middle node *not* observed (this is a collider)


    anywhere between $T$ and $Y$. Backdoor paths can contain (1) the common cause
    without observation motif and (2) the common effect with observation motif between
    $T$ and $Y$. The motifs that block and do not block a path are illustrated in
    Figure 8.3.


    The lack of equality between the interventional distribution $P(Y \mid do(t))$
    and the associational distribution $P(Y \mid t)$ is known as *confounding bias*.$^3$
    Any middle nodes of common cause motifs along a backdoor path are *confounding
    variables* or *confounders*. Confounding is the central challenge to be overcome
    when you are trying to infer the average treatment effect in situations where
    intervening is not possible (you cannot do$(t)$). Section 8.5 covers how to mitigate
    confounding while estimating the average treatment effect.


