    features and labels, which you do not have. You and the team have two options:


    +   1. *plug-in approach*: estimate the likelihood functions and prior probabilities
    from the training data, and plug them into the Bayes optimal likelihood ratio
    test described in Chapter 6, or

    +   2. *risk minimization*: optimize a classifier over an empirical approximation
    to the error rate computed on the training data samples.


    There are specific methods within these two broad categories of supervised classification
    algorithms. A mental model for different ways of doing supervised machine learning
    is shown in Figure 7.2.


    # ## 7.3 Plug-In Approach


    First, you and the rest of the JCN Corporation data science team try out plug-in
    methods for supervised classification. The main idea is to use the training data
    to estimate the likelihood functions pₓᵧ(x | y = 0) and pₓᵧ(x | y = 1), and then
    plug them into the likelihood ratio to obtain the classifier.


    # ### 7.3.1 Discriminant Analysis


    One of the most straightforward plug-in methods, *discriminant analysis*, assumes
    a parametric form for the likelihood functions and estimates their parameters.
    Then just like in Chapter 6, it obtains a decision function by taking the ratio
    of these likelihood functions and comparing them to a threshold η. The actual
    underlying likelihood functions do not have to be exactly their assumed forms
    and usually aren’t in practice. If they are somewhat close, that is good enough.
    The assumed parametric form is precisely the inductive bias of discriminant analysis.'
