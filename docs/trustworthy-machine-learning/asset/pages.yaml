    # 12.4.6 Prototypes


    Another kind of explanation useful for the decision maker persona, appraiser or
    credit officer, is through local sample-based approximations of uninterpretable
    models. Remember that local directly interpretable models, such as the k-nearest
    neighbor classifier work by averaging the labels of nearby HELOC applicant data
    points. The explanation is just the list of those other applicants and their labels.
    However, it is not required that a sample-based explanation only focus on nearby
    applicants. In this section, you will learn an approach for approximate local
    sample-based explanation that presents prototypical applicants as its explanation.


    Prototypes—data points in the middle of a cluster of other data points shown in
    Figure 12.9—are useful ways for consumers to perform case-based reasoning to gain
    understanding of a classifier.22 This reasoning is as follows. To understand the
    appraised value of a house, compare it to the most prototypical other house in
    the neighborhood that is average in every respect: average age, average square
    footage, average upkeep, etc. If the appraised value of the house in question
    is higher than the


