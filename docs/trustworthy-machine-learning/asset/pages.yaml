  md: 'where there tends to be some sort of difference in the probability distributions
    of the training data and the data encountered during the model’s deployment. This
    difference in distributions is known as *distribution shift*. A competent model
    that achieves high accuracy when tested through cross-validation might not maintain
    that competence in the real world. Too much epistemic uncertainty sinks the ship
    of even a highly risk-minimizing model.


    > “All bets are off if there is a distribution shift when the model is deployed.
    (There''s always a distribution shift.)”


    > —Arvind Narayanan, computer scientist at Princeton University


    This chapter begins Part 4 of the book on reliability and dealing with epistemic
    uncertainty, which constitutes the second of four attributes of trustworthiness
    (the others are basic performance, human interaction, and aligned purpose) as
    well as the second of two attributes of safety (the first is minimizing risk and
    aleatoric uncertainty). As shown in Figure 9.1, you’re halfway home to creating
