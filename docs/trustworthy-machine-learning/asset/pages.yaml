    # 10.3.1 Statistical Parity Difference and Disparate Impact Ratio


    One key concept in unwanted discrimination is disparate impact: privileged and
    unprivileged groups receiving different outcomes irrespective of the decision
    maker’s intent and irrespective of the decision-making procedure. Statistical
    parity difference is a group fairness metric that you can consider in the care
    management problem specification that quantifies disparate impact by computing
    the difference in selection rates of the favorable label P(ŷ(X) = fav) (rate of
    receiving extra care) between the privileged (Z = priv; whites) and unprivileged
    groups (Z = unpr; blacks):


    statistical parity difference = P(ŷ(X) = fav | Z = unpr) − P(ŷ(X) = fav | Z =
    priv).


    Equation 10.1


    A value of 0 means that members of the unprivileged group (blacks) and the privileged
    group (whites) are getting selected for extra care management at equal rates,
    which is considered a fair situation. A negative value of statistical parity difference
    indicates that the unprivileged group is at a disadvantage and a positive value
    indicates that the privileged group is at a disadvantage. A requirement in a problem
    specification may be that the learned model must have a statistical parity difference
    close to 0. An example calculation of statistical parity difference is shown in
    Figure 10.2.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_146_0.png)


    Figure 10.2. An example calculation of statistical parity difference. Accessible
    caption. 3 members of the unprivileged group are predicted with the favorable
    label (receive care management) and 7 are predicted with the unfavorable label
    (don’t receive care management). 4 members of the privileged group are predicted
    with the favorable label and 6 are predicted with the unfavorable label. The selection
    rate for the unprivileged group is 3/10 and for the privileged group is 4/10.
    The difference, the statistical parity difference is −0.1.


    Disparate impact can also be quantified as a ratio:


    disparate impact ratio = P(ŷ(X) = fav | Z = unpr)/P(ŷ(X) = fav | Z = priv).


    Equation 10.2'
