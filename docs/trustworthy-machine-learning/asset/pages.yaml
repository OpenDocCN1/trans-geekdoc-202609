    # 12.1.2 Dichotomies of Explanation Methods


    To meet the goals of the different personas, one kind of explanation is not enough.³
    You’ll need several different explanation types for Hilo’s systems. There are
    three dichotomies that delineate the methods and techniques for machine learning
    explainability.


