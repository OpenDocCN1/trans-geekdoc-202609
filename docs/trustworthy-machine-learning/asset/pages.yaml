  md: '![](img/78fc6ae0a1bc731065313dc3a5886b2f_228_0.png)


    Figure 14.5. *Transparent documentation and value alignment come together to help
    in the governance of machine learning systems.* Accessible caption. A block diagram
    that starts with a value alignment block out of which come values. Facts are subtracted
    from values to yield misalignment. Misalignment is input to a data scientists
    block with modeling as output. Modeling is input to a machine learning model with
    output that is fed into a testing block. The output of testing is the same facts
    that were subtracted from values, creating a feedback loop.


    In Chapter 13, factsheets contained not only quantitative test results, but also
    intended uses and other qualitative knowledge about the development process. However,
    in the view of governance presented here, only the quantitative test results seem
    to be used. So, is governance concerned only with test outcomes, which are of
    a consequentialist nature, or is it also concerned with the development process,
    which is of a deontological nature? Since the controllers—the data scientists—are
    people with inherent quirks and biases, both kinds of facts together help them
    see the big picture goals without losing track of their lower-level, day-to-day
    duties for resolving misalignment. Thus, a codification of processes to be followed
    during development is an integral part of governance. Toward this end, you have
    instituted a set of checklists for Alma Meadow’s data scientists to follow, resulting
    in a well-governed system overall.


    # 14.5 Summary


    +   - Interaction between people and machine learning systems is not only *from*
    the machine learning system *to* a human via explainability and transparency.
    The other direction from humans to the machine, known as value alignment, is just
    as critical so that people can instruct the machine on acceptable behaviors.

    +   - There are two kinds of values: consequentialist values that are concerned
    with outcomes and deontological values that are concerned with actions. Consequentialist
    values are more natural in value alignment for supervised machine learning systems.

    +   - Value alignment for supervised classification consists of four levels. Should
    you work on a problem? Which pillars of trustworthiness are high priority? What
    are the appropriate metrics? What are acceptable metric value ranges?

    +   - CP-nets and pairwise comparisons are tools for structuring the elicitation
    of preferences of values across the four levels.

    +   - The preferences of a group of stakeholders, including those from traditionally
    marginalized backgrounds, may be combined using either voting or participatory
    design sessions.

    +   - Governance of machine learning systems combines value alignment to elicit
    desired behaviors with factsheet-based transparency to measure whether those elicited
    behaviors are being met.'
