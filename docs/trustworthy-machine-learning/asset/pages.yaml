    What are the important points among these principles for a machine learning platform
    that empowers social change organizations and what is a platform anyway?


    A digital platform is a collection of people, processes, and internet-based tools
    that enable users to develop and run something of value. Therefore, a machine
    learning platform contains web-based software tools to carry out the entire machine
    learning development lifecycle from the problem specification phase all the way
    to the deployment and monitoring phase, with roles for all the personas including
    problem owners, data scientists, data engineers, model validators, operations
    engineers, and diverse voices. Importantly, a machine learning platform is more
    than simply an off-the-shelf programming library for modeling.


    In fact, there are three kinds of machine learning capabilities: (1) off-the-shelf
    machine learning packages, (2) machine learning platforms, and (3) bespoke machine
    learning builds.15 At one extreme, off-the-shelf packages are useful for top-of-the-pyramid
    organizations with a high level of data science skill and a high level of resources,
    but not for bottom-of-the-pyramid social change organizations. At the other extreme,
    bespoke or custom-tailored development (which has been the predominant mode of
    data science for social good over the last decade) should only be used for extremely
    complex problems or when an organization needs a technological competitive advantage.
    These are not the circumstances in which social change organizations typically
    operate; usually their problems, although having unique constraints, are not overly
    complicated from a machine learning perspective and usually their advantages in
    serving their beneficiaries are non-technological. Thus, it makes sense to be
    just right and serve social change organizations using machine learning platforms.


    What does a machine learning platform for the bottom of the pyramid entail? Translating
    the twelve general principles to a machine learning platform for social change
    implies a focus on appropriate functionality, adaptable user interfaces, deskilling,
    broad architecture, distribution methods, and education. You’ll obtain appropriate
    functionality by paring down the machine learning capabilities to the core model,
    algorithm, or toolkit that is reusable by many different social change organizations
    with similar needs, as discussed earlier. Such foundational capabilities mean
    that the algorithms have to be created only once and can be improved by a dedicated
    machine learning team that is not reliant on, or part of, any one social change
    organization.


    The remaining aspects touch on the last-mile problem. You can achieve adaptable
    user interfaces and deskilling by following the inclusive architecture presented
    in Chapter 16 for people with lived experience of marginalization. Such an architecture
    takes the scarce and expensive skill of data scientists out of the development
    lifecycle through low-code/no-code and auto ML. Low-code/no-code and auto ML should
    make it easy to configure and fine-tune the machine learning capability for the'
