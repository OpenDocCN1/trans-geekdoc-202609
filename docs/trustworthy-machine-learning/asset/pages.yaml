    outcome and 5 receive a true unfavorable outcome, giving a 1/6 false omission
    rate. The false omission rate difference is 0.12. Averaging the two differences
    gives a 0.02 average predictive value difference.


    # 10.3.5 Choosing Between Average Odds and Average Predictive Value Difference


    What’s the difference between separation and sufficiency? Which one makes more
    sense for the Sospital care management model? This is not a decision based on
    politics and worldviews like the decision between independence and separation.
    It is a decision based on what the favorable label grants the affected user: is
    it assistive or simply non-punitive? Getting a loan is assistive, but not getting
    arrested is non-punitive. Receiving care management is assistive. In assistive
    cases like receiving extra care, separation (equalized odds) is the preferred
    fairness metric because it relates to recall (true positive rate), which is of
    primary concern in these settings. If receiving care management had been a non-punitive
    act, then sufficiency (calibration) would have been the preferred fairness metric
    because precision is of primary concern in non-punitive settings. (Precision is
    equivalent to positive predictive value, which is one of the two components of
    the average predictive value difference.).


    # 10.3.6 Conclusion


    You can construct all sorts of different group fairness metrics by computing differences
    or ratios of the various confusion matrix entries and other classifier performance
    metrics detailed in Chapter 6, but independence, separation, and sufficiency are
    the three main ones. They are summarized in Table 10.1.'
