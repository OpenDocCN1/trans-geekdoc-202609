    # 11.3.1 Denoising Input Data


    Despite the best efforts of attackers, adversarial examples—resumes that have
    been shifted across a decision boundary—contain signals noticeable by machines
    even though they are imperceptible for people. The specially-crafted perturbation
    δ is a form of noise, called adversarial noise. Denoising, attempting to remove
    δ from x + δ, is a type of defense. The challenge in denoising is to remove all
    of the noise while limiting the distortion to the underlying clean features.


    Noise removal is an old problem that has been addressed in signal processing and
    related fields for a long time. There are three main ways of denoising evasion
    attacks that differ in their representation of the data: (1) input domain, (2)
    frequency domain, and (3) latent domain.⁴ Denoising techniques working directly
    in the feature space or input domain may copy or swap feature values among neighboring
    data points. They may also quantize continuous values into a smaller set of discrete
    values. Taking advantage of recent advances in generative machine learning (briefly
    described in Chapter 4 in the context of data augmentation), they may generate
    data samples very similar to an input, but without noise. Taken together, the
    main idea for input domain denoising is to flatten the variability or smooth out
    the data values.


    Smoothing is better examined in the frequency domain. If you are not an electrical
    engineer, you might not have heard about converting data into its frequency domain
    representation. The basic idea is to transform the data so that very wiggly data
    yields large values at so-called high frequencies and very smooth data yields
    large values at the opposite end of the spectrum: low frequencies. This conversion
    is done using the Fourier transform and other similar operations. Imperceptible
    adversarial noise is usually concentrated at high frequencies. Therefore, a defense
    for evasion attacks is squashing the high frequency components of the data (replacing
    them with small values) and then converting the data back to the input domain.
    Certain data compression techniques for semi-structured data modalities indirectly
    accomplish the same thing.'
