  md: 'pipeline. The basic idea to extract the two uncertainties is as follows.21
    The total uncertainty of a prediction, i.e. the predicted label Ŷ given the features
    X, is measured using the entropy H(Ŷ|X) (remember entropy from Chapter 3). This
    prediction uncertainty includes both epistemic and aleatoric uncertainty; it is
    general and does not fix the choice of the actual classifier function ŷ*(·) within
    a hypothesis space ℱ. The epistemic uncertainty component captures the lack of
    knowledge of a good hypothesis space and a good classifier within a hypothesis
    space. Therefore, epistemic uncertainty goes away once you fix the choice of hypothesis
    space and classifier. All that remains is aleatoric uncertainty. The aleatoric
    uncertainty is measured by another entropy H(Ŷ|X,f), averaged across classifiers
    f(·)∈ℱ whose probability of being a good classifier is based on the training data.
    The epistemic uncertainty is then the difference between H(Ŷ|X) and the average
    H(Ŷ|X,f).


    There are a couple ways to obtain these two entropies and thereby the aleatoric
    and epistemic uncertainty. Bayesian methods, including Bayesian neural networks,
    are one large category of methods that learn full probability distributions for
    the features and labels, and thus the entropies can be computed from the probability
    distribution. The details of Bayesian methods are beyond the scope of this book.22
    Another way to obtain the aleatoric and epistemic uncertainty is through ensemble
    methods, including ones involving bagging and dropout that explicitly or implicitly
    create several independent machine learning models that are aggregated (bagging
    and dropout were described in Chapter 7).23 The average classifier-specific entropy
    for characterizing aleatoric uncertainty is estimated by simply averaging the
    entropy of several data points for all the models in the trained ensemble considered
    separately. The total uncertainty is estimated by computing the entropy of the
    entire ensemble together.


    # 13.3 Communicating Test Results and Uncertainty


    Recall from Chapter 12, that you must overcome the cognitive biases of the consumer
    of an explanation. The same is true for communicating test results and uncertainty.
    Researchers have found that the presentation style has a large impact on the consumer.24
    So don’t take the shortcut of thinking that your job is done once you’ve completed
    the testing and uncertainty quantification. You’ll have to justify your model
    validation to several different factsheet consumers (internal stakeholders within
    JCN Corporation, external regulators, et al.) and it is important for you to think
    about how you’ll communicate the results.


