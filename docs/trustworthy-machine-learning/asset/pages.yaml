  md: '# 10.5 Mitigating Unwanted Bias


    From the earlier phases of the lifecycle of the Hospital care management model,
    you know that you must address unwanted biases during the modeling phase. Given
    the quantitative definitions of fairness and unfairness you''ve worked through,
    you know that mitigating bias entails introducing some sort of statistical independence
    between protected attributes like race and true or predicted labels of needing
    care management. That sounds easy enough, so what''s the challenge? What makes
    bias mitigation difficult is that other regular predictive features X have statistical
    dependencies with the protected attributes and the labels (a node for X was omitted
    from Figure 10.5 and Figure 10.6, but out-of-sight does not mean out-of-mind).
    The regular features can reconstruct the information contained in the protected
    attributes and introduce dependencies, even if you do the most obvious thing of
    dropping the protected attributes from the data. For example, race can be strongly
    associated both with certain health care providers (some doctors have predominantly
    black patients and other doctors have predominantly white patients) and with historical
    selection for extra care management.


    Bias mitigation methods must be more clever than simply dropping protected attributes.
    Don''t take a shortcut: dropping protected attributes is never the right answer.
    Remember the two main ways of mitigating the ills of distribution shift in Chapter
    9: adaptation and min-max robustness. When applied to bias mitigation, adaptation-based
    techniques are much more common than robustness-based ones, but rely on having
    protected attributes in the training dataset.14 They are the subject of the remainder
    of this section. If the protected attributes are not available in the training
    data, min-max robustness techniques for fairness that mirror those for distribution
    shift can be used.15


    Figure 10.8 (a subset of Figure 10.3) shows three different points of intervention
    for bias mitigation: (1) pre-processing which alters the statistics of the training
    data, (2) in-processing which adds extra constraints or regularization terms to
    the learning process, and (3) post-processing which alters the output predictions
    to make them more fair. Pre-processing can only be done when you have the ability
    to touch and modify the training data. Since in-processing requires you to mess
    with the learning algorithm, it is the most involved and least flexible. Post-processing
    is almost always possible and the easiest to pull off. However, the earlier in
    the pipeline you are, the more effective you can be.


    There are several specific methods within each of the three categories of bias
    mitigation techniques (pre-processing, in-processing, post-processing). Just like
    for accuracy, no one best algorithm outperforms all other algorithms on all datasets
    and fairness metrics (remember the no free lunch theorem). Just like there are
    differing domains of competence for classifiers covered in Chapter 7, there are
    differing domains of competence for bias mitigation algorithms. However, fairness
    is a new field that has not yet been studied extensively enough to have good characterizations
    of those domains of competence yet. In Chapter 7, it was important to go down
    into the details of machine learning methods'
