  md: "# 9.3.2 Covariate Shift\n\nJust like adapting to prior probability shift, adapting\
    \ to covariate shift uses a weighting technique called importance weighting to\
    \ overcome the sampling bias. In an empirical risk minimization or structural\
    \ risk minimization setup, a weight w_j multiplies the loss function for data\
    \ point (x_j, y_j):\n\n$\\hat{y}(\\cdot) = \\arg\\min_{f\\in\\mathcal{F}} \\frac{1}{n}\\\
    sum_{j=1}^{n} w_j L(y_j, f(x_j))$.\n\nEquation 9.1\n\n(Compare this to Equation\
    \ 7.3, which is the same thing, but without the weights.) The importance weight\
    \ is the ratio of the probability density of the features x_j under the deployment\
    \ distribution and the training distribution: w_j = p_X^{(deploy)}(x_j) / p_X^{(train)}(x_j).\
    \ The weighting scheme tries to make the African features look more like the Indian\
    \ features by emphasizing those that are less likely in East and Central African\
    \ countries but more likely in India.\n\nHow do you compute the weight from the\
    \ training and deployment datasets? You could first try to estimate the two pdfs\
    \ separately and then evaluate them at each training data point and plug them\
    \ into the ratio. But that usually doesn't work well. The better way to go is\
    \ to directly estimate the weight.\n\n> “When solving a problem of interest, do\
    \ not solve a more general problem as an intermediate step.”\n> \n> —Vladimir\
    \ Vapnik, computer scientist at AT&T Bell Labs\n\nThe most straightforward technique\
    \ is similar to computing propensity scores in Chapter 8. You learn a classifier\
    \ with a calibrated continuous score s(x) such as logistic regression or any other\
    \ classifier from Chapter 7. The dataset to train this classifier is a concatenation\
    \ of the deployment and training datasets. The labels are 1 for the data points\
    \ that come from the deployment dataset and the labels are 0 for the data points\
    \ that come from the training dataset. The features are the features. Once you\
    \ have the continuous output of the classifier as a score, the importance weight\
    \ is:\n\n$w_j = \\frac{n^{(train)} s(x_j)}{n^{(deploy)} (1 - s(x_j))}$\n\nEquation\
    \ 9.2"
