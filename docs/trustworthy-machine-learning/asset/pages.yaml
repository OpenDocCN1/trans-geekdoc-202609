- pgno: 143
  md: 'Privileged and unprivileged groups are delineated by protected attributes such
    as race, ethnicity, gender, religion, and age. There is no one universal set of
    protected attributes. They are determined from laws, regulations, or other policies
    governing a particular application domain in a particular jurisdiction. As a health
    insurer in the United States, Sospital is regulated under Section 1557 of the
    Patient Protection and Affordable Care Act with the specific protected attributes
    of race, color, national origin, sex, age, and disability. In health care in the
    United States, non-Hispanic whites are usually a privileged group due to multifaceted
    reasons of power. For ease of explanation and conciseness, the remainder of the
    chapter uses whites as the privileged group and blacks as the unprivileged group.


    There are two main types of fairness you need to be concerned about: (1) group
    fairness and (2) individual fairness. Group fairness is the idea that the average
    classifier behavior should be the same across groups defined by protected attributes.
    Individual fairness is the idea that individuals similar in their features should
    receive similar model predictions. Individual fairness includes the special case
    of two individuals who are exactly the same in every respect except for the value
    of one protected attribute (this special case is known as counterfactual fairness).
    Given the regulations Sospital is operating under, group fairness is the more
    important notion to include in the care management problem specification, but
    you should not forget to consider individual fairness in your problem specification.


    # 10.2 Where Does Unfairness Come From?


    Unfairness in the narrow scope of allocation decisions (distributive justice)
    has a few different sources. The most obvious source of unfairness is unwanted
    bias, specifically social bias in the measurement process (going from the construct
    space to the observed space) and representation bias in the sampling process (going
    from the observed space to the raw data space) that you learned about in Chapter
    4, shown in Figure 10.1. (This is a repetition of Figure 9.2 and an extension
    of Figure 4.3 where the concepts of construct space and observed space were first
    introduced.)


    In the data understanding phase, you have figured out that you will use privacy-preserved
    historical medical claims from Sospital members along with their past selection
    for care management as the data source. Medical claims data is generated any time
    a patient sees a doctor, undergoes a procedure, or fills a pharmacy order. It
    is structured data that includes diagnosis codes, procedure codes, and drug codes,
    all standardized using the ICD-10, CPT, and NDC schemes, respectively.² It also
    includes the dollar amount billed and paid along with the date of service. It
    is administrative data used by the healthcare provider to get reimbursed by Sospital.


    > > “If humans didn’t behave the way we do there would be no behavior data to
    correct.

    > > The training data is society.”

    > >

    > > — M. C. Hammer, musician and technology consultant'
