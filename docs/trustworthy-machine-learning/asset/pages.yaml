  md: 'economically-developed countries have been more active than those in less economically-developed
    countries, which may exacerbate power imbalances. Moreover, the entire framing
    of ethics principles for machine learning is based on Western philosophy rather
    than alternative conceptions of ethics.³ There are many similarities across the
    different sets of principles, but also key differences.⁴


    First, let’s look at the similarities. At a coarse-grained level, five principles
    commonly occur in ethics guidelines from different organizations:


    +   1. privacy,

    +   2. fairness and justice,

    +   3. safety and reliability,

    +   4. transparency (which usually includes interpretability and explainability),
    and

    +   5. social responsibility and beneficence.


    This list is not dissimilar to the attributes of trustworthiness that have guided
    the progression of the book. Some topics are routinely omitted from ethics principles,
    such as artificial general intelligence and existential threats (machines taking
    over the world), and the psychological impacts of machine learning systems.


    Differences manifest when looking across sectors: governments, NGOs, and private
    corporations. Compared to the private sector, governments and NGOs take a more
    participatory approach to coming up with their principles. They also have longer
    lists of ethical principles beyond the five core ones listed above. Furthermore,
    the documents espousing their principles contain greater depth.


    The topics of emphasis are different across the three sectors. Governments emphasize
    macroeconomic concerns of the adoption of machine learning, such as implications
    on employment and economic growth. NGOs emphasize possible misuse of machine learning.
    Private companies emphasize trust, transparency, and social responsibility. The
    remainder of the chapter drills down into these high-level patterns.


    # 15.2 Governments


    What is the purpose of government? Some of the basics are law and order, defense
    of the country from external threats, and general welfare, which includes health,
    well-being, safety, and morality of the people. Countries often create national
    development plans that lay out actions toward improving general welfare. In 2015,
    the member countries of the United Nations ratified a set of 17 sustainable development
    goals to achieve by 2030 that harmonize a unified purpose for national development.
    These global goals are:


    +   1. end poverty in all its forms everywhere,'
