  md: 'Gini index = 1 − \sum_{x∈X} p_x^2(x).


    Equation 3.14


    # 3.5 Independence and Bayesian Networks


    Understanding uncertainty of random variables becomes easier if you can determine
    that some of them are unlinked. For example, if certain features are unlinked
    to other features and also to the label, then they do not have to be considered
    in a machine learning problem specification.


    # 3.5.1 Statistical Independence


    Towards the goal of understanding unlinked variables, let’s define the important
    concept called *statistical independence*. Two events are mutually independent
    if one outcome is not informative of the other outcome. The statistical independence
    between two events is denoted A ⊥ B and is defined by


    A ⊥ B ⇔ P(A | B) = P(A).


    Equation 3.15


    Knowledge of the tendency of A to occur given that B has occurred is not changed
    by knowledge of B. If in ThriveGuild’s data, P(employed | deny) = 0.50 and P(employed)
    = 0.60, then since the two numbers 0.50 and 0.60 are not the same, employment
    status and loan approval are not independent, they are dependent. Employment status
    is used in loan approval decisions. The definition of conditional probability
    further implies that:


    A ⊥ B ⇔ P(A, B) = P(A)P(B).


    Equation 3.16


    The probability of the joint event is the product of the marginal probabilities.
    Moreover, if two random variables are independent, their mutual information is
    zero.


    The concept of independence can be extended to more than two events. Mutual independence
    among several events is more than simply a collection of pairwise independence
    statements; it is a stronger notion. A set of events is mutually independent if
    any of the constituent events is independent of all subsets of events that do
    not contain that event. The pdfs, cdfs, and pmfs of mutually independent random
    variables can be written as the products of the pdfs, cdfs, and pmfs of the individual
    constituent random variables. One commonly used assumption in machine learning
    is of *independent and identically distributed* (i.i.d.) random variables, which
    in addition to mutual independence, states that all of the random variables under
    consideration have the same probability distribution.


    A further concept is *conditional independence*, which involves at least three
    events. The events A and B are conditionally independent given C, denoted A ⊥
    B | C, when knowledge of the tendency of A to occur given that B has occurred
    is not changed by knowledge of B precisely when it is known that C'
