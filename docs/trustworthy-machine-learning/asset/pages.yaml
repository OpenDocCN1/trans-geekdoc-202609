    # 8.5.2  Outcome Models


    The other branch of methods you should consider for the causal model in testing
    whether ABC Center’s anxiety reduction intervention has an effect on stable housing
    is *outcome models*. In treatment models, you use the data \(\{(t_1, x_1), \ldots,
    (t_n, x_n)\}\) to learn the \(P(T \mid X = x)\) relationship, but you do something
    different in outcome models. In this branch, you use the data \(\{(t_1, y_1),
    \ldots, (t_n, y_n)\}\) to learn the relationships \(E[Y \mid T = 1, X = x]\) and
    \(E[Y \mid T = 0, X = x]\). You’re directly predicting the average outcome label
    of stable housing from the possible confounding variables such as child care along
    with the anxiety reduction treatment variable. Strong ignorability is required
    in both treatment models and outcome models. Before moving on to the details of
    outcome models, the difference between treatment models and outcome models is
    summarized in Table 8.2.'
