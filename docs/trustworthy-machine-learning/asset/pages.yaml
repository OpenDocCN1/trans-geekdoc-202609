    # 8.4 Causal Discovery Methods


    After the data understanding phase comes modeling. How do you obtain a causal
    graph structure for ABC Center like the one in Figure 8.1? There are three ways
    to proceed:⁴


    +   1. Enlist subject matter experts from ABC Center to draw out all the arrows
    (causal relationships) among all the nodes (random variables) manually,

    +   2. Design and conduct experiments to tease out causal relationships, or

    +   3. Discover the graph structure based on observational data.


    The first manual option is a good option, but it can lead to the inclusion of
    human biases and is not scalable to problems with a large number of variables,
    more than twenty or thirty. The second experimental option is also a good option,
    but is also not scalable to a large number of variables because interventional
    experiments would have to be conducted for every possible edge. The third option,
    known as *causal discovery*, is the most tractable in practice and what you should
    pursue with ABC Center.⁵


