    The second step is to plug those estimates into the likelihood ratio to get the
    classifier decision function. Under the Gaussian assumption, the method is known
    as *quadratic discriminant analysis* because after rearranging and simplifying
    the likelihood ratio, the quantity compared to a threshold turns out to be a quadratic
    function of x. If you further assume that the two covariance matrices Σ₀ and Σ₁
    are the same matrix Σ, then the quantity compared to a threshold is even simpler:
    it is a linear function of x, and the method is known as *linear discriminant
