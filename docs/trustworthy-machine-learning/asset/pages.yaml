  md: 'growing body of research literature on fairness, explainability, and robustness
    (they are ''hot topics''), the incentives for researchers are starting to align
    with the pursuit of research in technical trustworthy machine learning algorithms.
    Several open-source and commercial software tools have also been created in recent
