    and Janet Vertesi. “Fairness and Abstraction in Sociotechnical Systems.” In: *Proceedings
    of the ACM Conference on Fairness, Accountability, and Transparency.* Barcelona,
    Spain, Jan. 2020, pp. 59–68.'
