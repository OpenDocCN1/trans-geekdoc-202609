    The feasible set is a good starting point, but there is still the question of
    deciding on the preferred ranges of the metrics. Two approaches may help. First,
    a value alignment system can automatically collect or create a corpus of many
    models for the same or similar prediction task and compute their metrics. This
    will yield an empirical characterization of the interrelationships among the metrics.17
    You can better understand your choice of metric values based on their joint distribution
    in the corpus. The joint distribution can be visualized using a parallel coordinate
    density plot mentioned in Chapter 13.


    Second, the value alignment system can utilize a variation of so-called trolley
    problems for supervised machine learning. A trolley problem is a thought experiment
    about a fictional situation in which you can save the lives of five people who''ll
    otherwise be hit by a trolley by swerving and killing one person. Whether you
    choose to divert the trolley reveals your values. Variations of trolley problems
    change the number of people who die under each option and associate attributes
    with the people.18 They are also pairwise comparisons. Trolley problems are useful
    for value elicitation because humans are more easily able to reason about small
    numbers than the long decimals that usually appear in trust metrics. Moreover,
    couching judgements in terms of an actual scenario helps people internalize the
    consequences of the decision and relate them to their use case.


    As an example, consider the two scenarios shown in Figure 14.4. Which one do you
    prefer? Would you rather have an adversarial example fool the system or have a
    large disparate impact ratio? The actual numbers also play a role because a disparate
    impact ratio of 2 in scenario 2 is quite high. There is no right or wrong answer,
    but whatever you select indicates your values.


