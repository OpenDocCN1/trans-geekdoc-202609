  md: '![](img/78fc6ae0a1bc731065313dc3a5886b2f_132_0.png)


    Figure 9.5. Modeling pipeline for detecting and mitigating distribution shift.
    Accessible caption. A block diagram with a training dataset as input to a pre-processing
