    Decision stumps and decision trees can be directly optimized for the zero-one
    loss function that appears in the empirical risk.7 More commonly, however, greedy
    heuristic methods are employed for learning decision trees in which the split
    for each node is done one at a time, starting from the root and progressing to
    the leaves. The split is chosen so that each branch is as pure as can be for the
    two classes: mostly just employees skilled at serverless architecture on one side
    of the split, and mostly just employees unskilled at serverless architecture on
    the other side of the split. The purity can be quantified by two different information-theoretic
    measures, information gain and Gini index, which were introduced in Chapter 3.
    Two decision tree algorithms are popularly-used: the C5.0 decision tree that uses
    information gain as its splitting criterion, and the classification and regression
    tree (CART) that uses Gini index as its splitting criterion. The depth of decision
    trees is controlled to prevent overfitting. The domain of competence of C5.0 and
    CART decision trees is tabular datasets in which the phenomena represented in
    the features tend to have threshold and clustering behaviors without much class
    overlap.


    Decision forests are made up of a lot of decision trees. C5.0 or CART trees are
    usually used as these base classifiers. There are two popular ways to train decision
    forests: bagging and boosting. In bagging, different subsets of the training data
    are presented to different trees and each tree is trained separately. All trees
    have equal weight in the majority vote. In boosting, a sequential procedure is
    followed. The first tree is trained in the standard manner. The second tree is
    trained to focus on the training samples that the first tree got wrong. The third
    tree focuses on the errors of the first two trees, and so on. Earlier trees receive
    greater weight. Decision forests have good competence because of the diversity
    of their base classifiers. As long as the individual trees are somewhat competent,
    any unique mistake that any one tree makes is washed out by the others for an
    overall improvement in generalization.


    The random forest classifier is the most popular bagged decision forest and the
    XGBoost classifier is the most popular boosted decision forest. Both have very
    large domains of competence. They are robust'
