    you to appeal to all of the different consumer types, and you have the ability
    to intervene on all parts of the pipeline, so you should start putting together
    a comprehensive toolkit of interpretable and explainable machine learning techniques.


    # 12.2 Disentangled Representation


    Before people can start understanding how models make their predictions, they
    need some understanding of the underlying data. Features in tabular and other
    structured data used as inputs to machine learning models can usually be understood
    by consumers in some capacity. Consumers who are not decision makers, regulators,
    or other domain experts (or even if they are) might not grasp the nuance of every
    feature, but they can at least consult a data dictionary to get some understanding
    of each one. For example, in the HELOC approval model, a feature ‘months since
    most recent delinquency’ might not make total sense to applicants, but it is something
    they can understand if they do some research about it.


    The same is not true of semi-structured data. For example, inputs to the home
    appraisal model include satellite and street view images of the property and surrounding
    neighborhood. The features are individual red, blue, and green color values for
    each pixel of the image. Those features are not meaningful to any consumer. They
    are void of semantics. Higher-level representations, for example edges and textures
    that are automatically learned by neural networks, are a little better but still
    leave an explanation consumer wanting. They do not directly have a meaning in
    the context of a home appraisal.


    What can be done instead? The answer is a representation in which the dimensions
    are the amount of foliage in the neighborhood, the amount of empty street frontage,
    the visual desirability of the house,'
