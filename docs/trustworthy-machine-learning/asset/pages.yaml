    a held-out test data point x_test starts by approximating the loss function by
    quadratic functions around each training data point. The gradient vector ∇L (slope
    or set of first partial derivatives) and Hessian matrix ∇²L (local curvature or
    set of second partial derivatives) of the quadratic approximations to the loss
    function with respect to the model’s parameters are then calculated as closed-form
