  md: '# 15


    # Ethics Principles


    The fourth attribute of trustworthiness, introduced in Chapter 1, includes low
    self-orientation, motivation to serve others'' interests as well as own interests,
    benevolence, and an aligned purpose. This chapter focuses on this fourth attribute
    and kicks off the sixth and final part of the book (remember the organization
    of the book illustrated in Figure 15.1). Introduced in Chapter 14, value alignment
    is composed of two halves: technical and normative; this chapter deals with the
    normative part. Unlike earlier chapters, this chapter is not presented through
    a fictional use case.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_229_0.png)


    Figure 15.1. Organization of the book. The sixth part focuses on the fourth attribute
    of trustworthiness, purpose, which maps to the use of machine learning that is
    uplifting. Accessible caption. A flow diagram from left to right with six boxes:
    part 1: introduction and preliminaries; part 2: data; part 3: basic modeling;
    part 4: reliability; part 5: interaction; part 6: purpose. Part 6 is highlighted.
    Parts 3–4 are labeled as attributes of safety. Parts 3–6 are labeled as attributes
    of trustworthiness.


    Benevolence implies the application of machine learning for good purposes. From
    a consequentialist perspective (defined in chapter 14), we should broadly be aiming
    for good outcomes for all people. But a single sociotechnical system surely cannot
    do that. So we must ask: whose good? Whose interests will machine learning serve?
    Who can machine learning empower to achieve their goals?'
