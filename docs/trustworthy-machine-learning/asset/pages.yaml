- pgno: 167
  md: '# 11.1.2 Capability


    Some adversaries are more capable than others. In the poisoning category, adversaries
    change the training data or model somehow, so they have to have some access inside
    Kermis’ information technology infrastructure. The easiest thing they can do is
    slip in some additional resumes that get added to the training data. This is known
    as data injection. More challenging is data modification, in which the adversary
    changes labels or features in the existing training dataset. The most challenging
    of all is logic corruption, in which the adversary changes the code and behavior
    of the machine learning algorithm or model. You can think of the data injection
    and data modification attacks as somewhat similar to bias mitigation pre-processing
    and logic corruption as somewhat similar to bias mitigation in-processing, except
    for a nefarious purpose.


    In the evasion category, the adversary does not need to change anything at all
    inside Kermis’ systems. So these are easier attacks to carry out. The attackers
    just have to create adversarial examples: specially crafted resumes designed in
    clever ways to fool the machine learning system. But how adversaries craft these
    tricky resumes depends on what information they have about how the model makes
    its predictions. The easiest thing for an adversary to do is just submit a bunch
    of resumes into the HireRing model and see whether they get selected or not; this
    gives the adversary a labeled dataset. When adversaries cannot change the set
    of resumes and just have to submit a batch that they have, it is called strict
    closed-box access. When they can change the input resumes based on the previous
    ones they’ve submitted and the predicted labels they’ve observed, it is called
    adaptive closed-box access. Adaptivity is a bit harder because the attacker might
    have to wait a while for Kermis to select or not select the resumes that they’ve
    submitted. You might also be able to catch on that something strange is happening
    over time. The next more difficult kind of information that adversaries can have
    about the HireRing model trained for Kermis is known as non-adaptive closed-box
    access. Here, the adversary knows the training data distribution p_{X,Y}(x,y)
    but cannot submit resumes. Finally, the classifier decision function itself f(·)
    is the most difficult-to-obtain information about a model for an adversary. This
    full knowledge of the classifier is known as open-box access.


    Since Kermis has generally good cybersecurity overall, you should be less worried
    about poisoning attacks, especially logic corruption attacks. Even open-box access
    for an evasion attack seems less likely. Your biggest fear should be one of the
    closed-box evasion attacks. Nevertheless, you shouldn’t let your guard down and
    you should still think about defending against all of the threats.


    # 11.1.3 Goal


    The third dimension of threats is the goal of the adversary, which applies to
    both poisoning and evasion attacks. Different adversaries try to do different
    things. The easiest goal is confidence reduction: to shift classifier scores so
    that they are closer to the middle of the range [0,1] and thus less confident.
    The next goal is misclassification: trying to get the classifier to make incorrect
    predictions. (This is the formulation given in Equation 11.1.) Job applications
    to Kermis that should be selected are rejected and vice versa. When you have a
    binary classification problem like you do in applicant screening, there is only
    one way to be wrong: predicting the other label. However, when you have more than
    two possible labels, misclassification can produce any other label that is not
    the true one. Targeted misclassification goes a step further and ensures that
    the misclassification isn’t just any other label, but a specific one of the attacker’s
    choice. Finally, and most sophisticated of all, source/target misclassification
    attacks are'
  merge: -1
  img_proc: true
