  md: "# 8.4.1 An Example Conditional Independence Testing-Based Method\n\nOne of\
    \ the oldest, simplest, and still often-used conditional independence testing-based\
    \ causal discovery methods is the PC algorithm. Named for its originators, Peter\
    \ Spirtes and Clark Glymour, the PC algorithm is a greedy algorithm. An ABC Center\
    \ example of the PC algorithm is presented in Figure 8.7 for the nodes of wages,\
    \ child care, stable housing, and used car. The steps are as follows:\n\n+   0.\
    \ The overall PC algorithm starts with a complete undirected graph with edges\
    \ between all pairs of nodes.\n+   \n+   1. As a first step, the algorithm tests\
    \ every pair of nodes; if they are independent, it deletes the edge between them.\
    \ Next it continues to test conditional independence for every pair of nodes conditioning\
    \ on larger and larger subsets, deleting the edge between the pair of nodes if\
    \ any conditional independence is found. The end result is the undirected skeleton\
    \ of the causal graph.\n\nThe reason for this first step is as follows. There\
    \ is an undirected edge between nodes X₁ and X₂ if and only if X₁ and X₂ are dependent\
    \ conditioned on every possible subset of all other nodes. (So if a graph has\
    \ three other nodes X₃, X₄, and X₅, then you’re looking for X₁ and X₂ to be (1)\
    \ unconditionally dependent given no other variables, (2) dependent given X₃,\
    \ (3) dependent given X₄, (4) dependent given X₅, (5) dependent given X₃, X₄,\
    \ (6) dependent given X₃, X₅, (7) dependent given X₄, X₅, and (8) dependent given\
    \ X₃, X₄, X₅.) These conditional dependencies can be figured out using d-separation,\
    \ which was introduced back in Chapter 3.\n\n+   2. The second step puts arrowheads\
    \ on as many edges as it can. The algorithm conducts conditional independence\
    \ tests between the first and third nodes of three-node chains. If they’re dependent\
    \ conditioned on some set of nodes containing the middle node, then a common cause\
    \ (collider) motif with arrows is created. The end result is a partially-oriented\
    \ causal graph. The direction of edges that the algorithm cannot figure out remain\
    \ unknown. All choices of all of those orientations give you the different graphs\
    \ that make up the Markov equivalence class.\n\nThe reason for the second step\
    \ is that an undirected chain of nodes X₁, X₂, and X₃ can be made directed into\
    \ X₁ → X₂ ← X₃ if and only if X₁ and X₃ are dependent conditioned on every possible\
    \ subset of nodes containing X₂. These conditional dependencies can also be figured\
    \ out using d-separation.\n\nAt the end of the example in Figure 8.7, the Markov\
    \ equivalence class contains four possible graphs.\n\nIn Chapter 3, d-separation\
    \ was presented in the ideal case when you know the dependence and independence\
    \ of each pair of random variables perfectly well. But when dealing with data,\
    \ you don’t have that perfect knowledge. The specific computation you do on data\
    \ to test for conditional independence between random variables is often based\
    \ on an estimate of the mutual information between them. This seemingly straightforward\
    \ problem of conditional independence testing among continuous random variables\
    \ has a lot of tricks of the trade that continue to be researched and are beyond\
    \ the scope of this book."
