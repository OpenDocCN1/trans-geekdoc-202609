    # 14.2.4 What are Acceptable Ranges of the Metric Values?


    Once specific metrics have been selected, the final level of value alignment is
    determining the quantitative ranges of preferred metric values for the Alma Meadow
    semi-finalist selection model. Since the different elements of trustworthiness
    and their relevant metrics are interrelated, including some that are tradeoffs,
    this level of elicitation should not be approached one metric at a time like the
    previous metric elicitation, but more holistically.


    The starting point is a feasible set of metric values, shown schematically in
    Figure 14.3. In this schematic, the quantitative test results for a single model
    (shown as tables, bar graphs, parallel coordinate plots, and radar charts in Chapter
    13) are mapped to a single point inside the feasible region. From Chapter 6, you
    know that the optimal Bayes risk is fundamentally the best you can ever do for
    cost-weighted accuracy. As also mentioned in that chapter, it turns out that you
    can empirically estimate the optimal Bayes risk from the historical Alma Meadow
    applications data you have.14 Moreover, fundamental theoretical relationships
    between metrics from different elements of trustworthiness are starting to be
    researched using the concept of Chernoff information15 from detection theory and
    information theory (they include both tradeoffs and non-tradeoffs); a so-called
    unified theory of trust.16 Once that research is completed, the schematic diagram
    of Figure 14.3 can be actualized for a given machine learning task and the fourth
    value alignment question (ranges of values of different metrics) can be more easily
    stated. By explicitly knowing the feasible set of metric values, you can confidently
    make choices that are possible for the Alma Meadow semi-finalist prioritization
    model instead of wishful thinking.


