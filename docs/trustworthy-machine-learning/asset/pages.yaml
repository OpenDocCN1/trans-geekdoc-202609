- pgno: 121
  md: '*probability weighting,* is to give more weight to clients in the treatment
    group that were much more likely to be assigned to the control group and vice
    versa. Clients given the anxiety reduction treatment t_j = 1 are given weight
    inversely proportional to their propensity score w_j = 1/P(T = 1 | X = x_j). Clients
    not given the treatment t_j = 0 are similarly weighted w_j = 1/P(T = 0 | X = x_j)
    which also equals 1/(1 − P(T = 1 | X = x_j)). The average treatment effect of
    anxiety reduction on stable housing is then simply the weighted mean difference
    of the outcome label between the treatment group and the control group. If you
    define the treatment group as T = {j | t_j = 1} and the control group as C = {j
    | t_j = 0}, then the average treatment effect estimate is


    $\tau = \frac{1}{||\mathcal{T}||} \sum_{j\in\mathcal{T}} w_j y_j - \frac{1}{||\mathcal{C}||}
    \sum_{j\in\mathcal{C}} w_j y_j.$


    Equation 8.3


    Getting the propensity score P(T | X) from training data samples {(x_1, t_1),
    ..., (x_n, t_n)} is a machine learning task with features x_i and labels t_j in
    which you want a (calibrated) continuous score as output (the score was called
    s(x) in Chapter 6). The learning task can be done with any of the machine learning
    algorithms from Chapter 7. The domains of competence of the different choices
    of machine learning algorithms for estimating the propensity score are the same
    as for any other machine learning task, e.g. decision forests for structured datasets
    and neural networks for large semi-structured datasets.


    Once you''ve trained a propensity score model, the next step is to evaluate it
    to see whether it meets the assumptions for causal inference. (Just because you
    can compute an average treatment effect doesn''t mean that everything is hunky-dory
    and that your answer is actually the causal effect.) There are four main evaluations
    of a propensity score model: (1) covariate balancing, (2) calibration, (3) overlap
    of propensity distribution, and (4) area under the receiver operating characteristic
    (AUC). Calibration and AUC were introduced in Chapter 6 as ways to evaluate typical
    machine learning problems, but covariate balancing and overlap of propensity distribution
    are new here. Importantly, the use of AUC to evaluate propensity score models
    is different than its use to evaluate typical machine learning problems.


    Since the goal of inverse probability weighting is to make the potential confounding
    variables X look alike in the treatment and control groups, the first evaluation,
    covariate balancing, tests whether that has been accomplished. This is done by
    computing the standardized mean difference (SMD) going one-by-one through the
    X features (child care and other possible confounders). Just subtract the mean
    value of the feature for the control group data from the mean value for the treatment
    group data, and divide by the square root of the average variance of the feature
    for the treatment and control groups. ''Standardized'' refers to the division
    at the end, which is done so that you don''t have to worry about the absolute
    scale of different features. An absolute value of SMD greater than about 0.1 for
    any feature should be a source of concern. If you see this happening, your propensity
    score model is not good and you shouldn''t draw causal conclusions from the average
    treatment effect.


    The second evaluation is calibration. Since the propensity score model is used
    as an actual probability in inverse probability weighting, it has to have good
    calibration to be effective. Introduced in Chapter 6, the calibration loss needs
    to be small and the calibration curve needs to be as much of a straight line as
    possible. If they aren''t, you shouldn''t draw causal conclusions from the average
    treatment effect you compute and need to go back to step 1.'
