    The following techniques are examples of post-processing: bias mitigation post-processing
    (unfairness); patching (adversarial attacks); post hoc explanations (lack of explainability).


    Different from data preparation, data *pre-processing* is meant to alter the statistics
    or properties of the dataset to achieve certain goals. *Domain adaptation* overcomes
    a lack of robustness to changing environments, including temporal bias. *Bias
    mitigation pre-processing* changes the dataset to overcome social bias and population
    bias. *Data sanitization* aims to remove traces of data poisoning attacks by malicious
    actors. Learning *disentangled representations* overcomes a lack of human interpretability
    of the features. All should be performed as required by the problem specification.


    The main task in the modeling step is to use an algorithm that finds the patterns
    in the training dataset and generalizes from them to fit a model that will predict
    labels for new unseen data points with good performance. (The term *predict* does
    not necessarily imply forecasting into the future, but simply refers to providing
    a guess for an unknown value.) There are many different algorithms for fitting
    models, each with a different *inductive bias* or set of assumptions it uses to
    generalize. Many machine learning algorithms explicitly minimize the objective
    function that was determined in the problem specification step of the lifecycle.
    Some algorithms minimize an approximation to the specified objective to make the
    mathematical optimization easier. This common approach to machine learning is
    known as *risk minimization*.


    The *no free lunch theorem* of machine learning says that there is no one best
    machine learning algorithm for all problems and datasets.⁵ Which one works best
    depends on the characteristics of the


