    # 11.2 Defenses Against Poisoning Attacks


    Once you and the HireRing team are in the modeling phase of the lifecycle, you
    have to implement defense measures against the attacks identified in the problem
    specification phase. From a machine learning perspective, there are no specific
    defenses for preventing logic corruption attacks in Kermis’ systems. They must
    be prevented by other security measures. There are, however, defenses throughout
    the machine learning pipeline against data injection and data modification attacks
    that fall into three categories based on where in the pipeline they are applied.²
    (1) Pre-processing approaches are given the name data sanitization. (2) In-processing
    defenses during model training rely on some kind of smoothing. (3) Post-processing
    defenses are called patching. These three categories, which are detailed in the
    remainder of this section, are illustrated in Figure 11.3. They are analogous
    to methods for mitigating distribution shift and unwanted bias described in Chapter
    9 and Chapter 10, respectively.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_168_0.png)


    Figure 11.3. Different categories of defenses against poisoning attacks in the
    machine learning pipeline. Accessible caption. A block diagram with a training
    dataset as input to a data sanitization block with a pre-processed dataset as
    output. The pre-processed dataset is input to a smoothing block with an initial
    model as output. The initial model is input to a patching block with a final model
    as output.


    Machine learning defenses against poisoning attacks are an active area of research.
    Specific attacks and defenses are continually improving in an arms race. Since
    by the time this book comes out, all presently known attacks and defenses are
    likely to have been superseded, only the main ideas are given rather than in-depth
    accounts.


