  md: '# 8.5.3 Conclusion


    You''ve evaluated two options for causal inference: treatment models and outcome
    models. Which option is better in what circumstances? Treatment and outcome modeling
    are inherently different problems with different features and labels. You can
    just end up having better evaluations for one causal method than the other using
    the different machine learning method options available. So just try both branches
    and see how well the results correspond. Some will be better matched to the relevant
    modeling tasks, depending on the domains of competence of the machine learning
    methods under the hood.


    But do you know what? You''re in luck and don''t have to choose between the two
    branches of causal inference. There''s a hybrid approach called doubly-robust
    estimation in which the propensity score values are added as an additional feature
    in the outcome model.⁹ Doubly-robust models give you the best of both worlds!
    ABC Center''s director is waiting to decide whether he should invest more in anxiety
    reduction interventions. Once you''re done with your causal modeling analysis,
    he''ll be able to make an informed decision.


    # 8.6 Summary


    +   - Causality is a fundamental concept that expresses how changing one thing
    (the cause) results in another thing changing (the effect). It is different than
    correlation, predictability, and dependence.

    +   - Causal models are critical to inform decisions involving interventions and
    treatments with expected effects on outcomes. Predictive associational models
    are not sufficient when you are ''doing'' something to an input.

    +   - In addition to informing decisions, causal modeling is a way to avoid harmful
    spurious relationships in predictive models.

    +   - Structural causal models extend Bayesian networks by encoding causal relationships
    in addition to statistical relationships. Their graph structure allows you to
    understand what causes what, as well as chains of causation, among many variables.
    Learning their graph structure is known as causal discovery.

    +   - Causal inference between a hypothesized pair of treatment and outcome is
    a different problem specification. To validly conduct causal inference from observational
    data, you must control for confounding.

    +   - Causal modeling requires assumptions that are difficult to validate, but
    there is a set of evaluations you should perform as part of modeling to do the
    best that you can.'
