  md: 'As part of this goal, there are increasing calls for a paradigm shift towards
    AI systems that complement or augment human intelligence instead of imitating
    it.⁵


    Furthermore, towards both economic competitiveness and defense from external threats,
    some countries have now started engaging in a so-called arms race. Viewing the
    development of machine learning as a race may encourage taking shortcuts in safety
    and governance, which is cautioned against throughout this book.⁶


    # 15.3 Private Industry


    What is the purpose of a corporation? Throughout much of the last fifty years,
    the stated purpose of corporations (with some exceptions) has been to single-mindedly
    return profits to investors, also known as maximizing shareholder value.


    > > “There is one and only one social responsibility of business: to engage in
    activities designed to increase its profits.”

    > >

    > > —Milton Friedman, economist at the University of Chicago


    In 2019, however, the Business Roundtable, an association of the chief executives
    of 184 large companies headquartered in the United States, stated a broader purpose
    for corporations:


    +   1. Delivering value to our customers. We will further the tradition of American
    companies leading the way in meeting or exceeding customer expectations.

    +   2. Investing in our employees. This starts with compensating them fairly and
    providing important benefits. It also includes supporting them through training
    and education that help develop new skills for a rapidly changing world. We foster
    diversity and inclusion, dignity and respect.

    +   3. Dealing fairly and ethically with our suppliers. We are dedicated to serving
    as good partners to the other companies, large and small, that help us meet our
    missions.

    +   4. Supporting the communities in which we work. We respect the people in our
    communities and protect the environment by embracing sustainable practices across
    our businesses.

    +   5. Generating long-term value for shareholders, who provide the capital that
    allows companies to invest, grow and innovate. We are committed to transparency
    and effective engagement with shareholders.


    Shareholder value is listed only in the last item. Other items deal with fairness,
    transparency and sustainable development. AI ethics principles coming from corporations
    are congruent with this broadening purpose of the corporation itself, and are
    also focused on fairness, transparency and sustainable development.⁷'
