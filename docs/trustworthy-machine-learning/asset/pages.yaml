- pgno: 15
  md: 'relevant for defining trust in machine learning because machine learning systems
    in high-stakes applications are typically used within organizational settings.
    *Trust is the willingness of a party to be vulnerable to the actions of another
    party based on the expectation that the other will perform a particular action
    important to the trustor, irrespective of the ability to monitor or control that
    other party.*⁷ This definition can be put into practice as a foundation for desiderata
    of machine learning systems.


    # ### 1.1.1   Trusted vs. Trustworthy


    Embedded within this definition is the idea that the trustee has certain properties
    that make it *trustworthy*, i.e. the qualities by which the trustor can expect
    the trustee to perform the important action referred to in the definition of trust.
    Being trustworthy does not automatically imply that the trustee is trusted. The
    trustor must consciously make a decision to be vulnerable to the trustee based
    on its trustworthiness and other factors including cognitive biases of the trustor.
    Understandably, potential trustors who are already vulnerable as members of marginalized
    groups may not want to become even more vulnerable. A system may not be trusted
    no matter how worthy of trust it is.


    > > “The toughest thing about the power of trust is that it’s very difficult to
    build and very easy to destroy.”

    > >

    > > —Thomas J. Watson, Sr., CEO of IBM


    Moreover, the trustor’s expectation of the trustee can evolve over time, even
    if the trustworthiness of the trustee remains constant. A typical dynamic of increasing
    trust over time begins with the trustor’s expectation of performance being based
    on (1) the *predictability* of individual acts, moves onto (2) expectation based
    on *dependability* captured in summary statistics, finally culminating in (3)
    the trustor’s expectation of performance based on *faith* that dependability will
    continue in the future.⁸ Predictability could arise from some sort of understanding
    of the trustee by the trustor (for example their motivations or their decision-making
    procedure) or by low variance in the trustee’s behavior. The expectation referred
    to in dependability is the usual notion of expectation in probability and statistics.


    In much of the literature on the topic, both the trustor and the trustee are people.
    For our purposes, however, an end-user or other person is the trustor and the
    machine learning system is the trustee. Although the specifics may differ, there
    are not many differences between a trustworthy person and a trustworthy machine
    learning system. However, the final trust of the trustor, subject to cognitive
    biases, may be quite different for a human trustee and machine trustee depending
    on the task.⁹


    # ### 1.1.2   Attributes of Trustworthiness


    Building upon the above definition of trust and trustworthiness, you can list
    many different attributes of a trustworthy person: availability, competence, consistency,
    discreetness, fairness, integrity, loyalty,


    ⁷ Roger C. Mayer, James H. Davis, and F. David Schoorman. “An Integrative Model
    of Organizational Trust.” In: *Academy of Management Review* 20.3 (Jul. 1995),
    pp. 709–734.

    ⁸ John K. Rempel, John G. Holmes, and Mark P. Zanna. “Trust in Close Relationships.”
    In: *Journal of Personality and Social Psychology* 49.1 (Jul. 1985), pp. 95–112.

    ⁹ Min Kyung Lee. “Understanding Perception of Algorithmic Decisions: Fairness,
    Trust, and Emotion in Response to Algorithmic Management.” In: *Big Data & Society*
    5.1 (Jan.–Jun. 2018).'
  merge: -1
  img_proc: true
