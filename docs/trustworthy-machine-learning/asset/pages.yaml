    Importantly, testing machine learning systems is different from testing other
    kinds of software systems.⁹ Since the whole point of machine learning systems
    is to generalize from training data to label new unseen input data points, they
    suffer from the oracle problem: not knowing what the correct answer is supposed
    to be for a given input.¹⁰ The way around this problem is not by looking at a
    single employee’s input data point and examining its corresponding output attrition
    prediction, but by looking at two or more variations that should yield the same
    output. This approach is known as using metamorphic relations.


    For example, a common test for counterfactual fairness (described in Chapter 10)
    is to input two data points that are the same in every way except having different
    values of a protected attribute. If the predicted label is not the same for both
    of them, the test for counterfactual fairness fails. The important point is that
    the actual predicted label value (will voluntarily resign/won’t voluntarily resign)
    is not the key to the test, but whether that predicted value is equal for both
    inputs. As a second example for competence, if you multiply a feature’s value
    by a constant in all training points, train the model, and then score a test point
    that has been scaled by the same constant, you should get the same prediction
    of voluntary resignation as if you had not done any scaling at all. In some other
    application involving semi-structured data, a metamorphic relation for an audio
    clip may be to speed it up or slow it down while keeping the pitch the same. Coming
    up with such metamorphic relations requires ingenuity; automating this process
    is an open research question.


    In addition to the oracle problem of machine learning, there are three factors
    you need to think about that go beyond the typical testing done by JCN Corporation
    data scientists while generating facts:


    +   1. testing for dimensions beyond accuracy, such as fairness, robustness, and
    explainability,

    +   2. pushing the system to its limits so that you are not only testing average
    cases, but also covering edge cases, and

    +   3. quantifying aleatoric and epistemic uncertainty around the test results.


    Let’s look into each of these three concerns in turn.


    # 13.2.1 Testing for Dimensions of Trustworthiness


    If you’ve reached this point in the book, it will not surprise you that testing
    for accuracy (and related performance metrics described in Chapter 6) is not sufficient
    when evaluating machine learning models that are supposed to be trustworthy. You
    also need to test for fairness using metrics such as disparate impact ratio and
    average odds difference (described in Chapter 10), adversarial robustness using
    metrics such as empirical robustness and CLEVER score (described in Chapter 11),
    and explainability'
