    # 8.5.1 Treatment Models


    The first option for you to consider for your causal method is treatment models.
    Before diving into treatment models, let''s define an important concept first:
    propensity score. It is the probability of the treatment (anxiety reduction intervention)
    conditioned on the possible confounding variables (child care and others), P(T
    | X). Ideally, the decision to give a client an anxiety reduction intervention
    is independent of anything else, including whether the client has child care.
    This is true in randomized trials, but tends not to be true in observational data.


    The goal of treatment models is to get rid of confounding bias by breaking the
    dependency between T and X. They do this by assigning weights to the data points
    so that they better resemble a randomized trial: on average, the clients in the
    control group and in the treatment group should be similar to each other in their
    confounding variables. The main idea of the most common method in this branch,
    inverse'
