  md: '# 12.3.3  Logistic Regression


    Linear logistic regression is also considered by many regulators to be directly
    interpretable. Recall from Chapter 7 that the form of the linear logistic regression
    decision function is \(\hat{y}(x)=\operatorname{step}(w^Tx)\). The \(d\)-dimensional
    weight vector \(w\) has one weight per feature dimension in \(x\), which are different
    attributes of the HELOC applicant. These weight and feature dimensions are \(w^{(1)},\ldots,w^{(d)}\)
    and \(x^{(1)},\ldots,x^{(d)}\), respectively, which get multiplied and summed
    as: \(w^{(1)}x^{(1)}+\cdots+w^{(d)}x^{(d)}\) before going into the step function.
    In logistic regression, the relationship between the probability \(P(Y=1\mid X=x)\)
    (also the score \(s\)) and the weighted sum of feature dimensions is:


    $$P(Y=1\mid X=x)=\frac{1}{1+e^{-(w^{(1)}x^{(1)}+\cdots+w^{(d)}x^{(d)})}}$$


    Equation 12.1


    which you''ve seen before as the logistic activation function for neural networks
    in Chapter 7. It can be rearranged to the following:


    $$\log\left(\frac{P(Y=1\mid X=x)}{1-P(Y=1\mid X=x)}\right)=w^{(1)}x^{(1)}+\cdots+w^{(d)}x^{(d)}.$$


    Equation 12.2


    The left side of Equation 12.2 is called the *log-odds*. When the log-odds is
    positive, \(Y=1\) is the more likely prediction: creditworthy. When the log-odds
    is negative, \(Y=0\) is the more likely prediction: non-creditworthy.


    The way to understand the behavior of the classifier is by examining how the probability,
    the score, or the log-odds change when you increase an individual feature attribute''s
    value by 1. Examining the response to changes is a general strategy for explanation
    that recurs throughout the chapter. In the case of linear logistic regression,
    an increase of feature value \(x^{(i)}\) by 1 while leaving all other feature
    values constant adds \(w^{(i)}\) to the log-odds. The weight value has a clear
    effect on the score. The most important features per unit change of feature values
    are those with the largest absolute values of the weights. To more easily compare
    feature importance using the weights, you should first standardize each of the
    features to zero mean and unit standard deviation. (Remember that standardization
    was first introduced when evaluating the covariate balancing of causal models
    in Chapter 8.)


    # 12.3.4  Generalized Additive Models


    *Generalized additive models (GAMs)* are a class of models that extend linear
    logistic regression to be nonlinear while retaining the same approach for interpretation.
    Instead of scalar weights multiplying feature values in the decision function
    for credit check prediction: \(w^{(1)}x^{(1)}+\cdots+w^{(d)}x^{(d)}\), nonlinear
    functions are applied: \(f^{(1)}(x^{(1)})+\cdots+f^{(d)}(x^{(d)})\). The entire
    function for a given feature dimension explicitly adds to the log-odds or subtracts
    from it. You can only do this exactly because there is no interaction between
    the feature dimensions. You can choose any hypothesis class for the nonlinear
    functions, but be aware that the learning algorithm has to fit the parameters
    of the functions from'
