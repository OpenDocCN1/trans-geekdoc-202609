- pgno: 133
  md: 'The next sections work through adaptation and robustness for the different
    types of distribution shift. Mitigating prior probability shift and covariate
    shift is easier than mitigating concept drift because the relationship between
    the features and labels does not change in the first two types. Thus, the classifier
    you learned on the historical African training data continues to capture that
    relationship even on India deployment data; it just needs a little bit of tuning.


    # 9.3 Adaptation


    The first mitigation approach, adaptation, is done as a pre-processing of the
    training data from East and Central African countries using information available
    in unlabeled feature data X^(deploy) from India. To perform adaptation, you must
    know that India is where you''ll be deploying the model and you must be able to
    gather some features.


    # 9.3.1 Prior Probability Shift


    Since prior probability shift arises from sampling bias, the relationship between
    features and labels, and thus the ROC, does not change. Adapting is simply a matter
    of adjusting the classifier threshold or operating point based on the confusion
    matrix, which are all concepts you learned in Chapter 6. A straightforward and
    effective way to adapt to prior probability shift is a weighting scheme. The algorithm
    is as follows.


    +   1. Train a classifier on one random split of the training data to get ŷ^(train)(x)
    and compute the classifier''s confusion matrix on another random split of the
    training data:

    +      C = [[P_TP, P_FP], [P_FN, P_TN]].

    +   2. Run the unlabeled features of the deployment data through the classifier:
    ŷ^(train)(X^(deploy)) and compute the probabilities of positives and negatives
    in the deployment data as a vector:

    +      a = [P(ŷ^(train)(X^(deploy)) = 1), P(ŷ^(train)(X^(deploy)) = 0)].

    +   3. Compute weights w = C⁻¹ a. This is a vector of length two.

    +   4. Apply the weights to the training data points in the first random split
    and retrain the classifier. The first of the two weights multiplies the loss function
    of the training data points with label 1. The second of the two weights multiplies
    the loss function of the training data points with label 0.


    The retrained classifier is what you want to use when you deploy Phulo in India
    under the assumption of prior probability shift.'
