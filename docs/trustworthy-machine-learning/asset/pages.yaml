    # ## 13.4 Maintaining Provenance


    In principle, factsheets are a good idea to achieve transparency, show conformity
    to regulations, and increase trustworthiness in JCN Corporation’s proactive retention
    system. But if consumers of factsheets think JCN Corporation is lying to them,
    is there anything you can do to convince them otherwise (assuming all the facts
    are impeccable)? More subtly, how can you show that facts haven’t been tampered
    with or altered after they were generated? Providing such assurance is hard because
    the facts are generated by many different people and processes throughout the
    development lifecycle, and just one weak link can spoil the entire factsheet.
    Provenance of the facts is needed.


    One solution is a version of the fact flow tool with an *immutable ledger* as
    its storage back-end. An immutable ledger is a system of record whose entries
    (ideally) cannot be changed, so all facts are posted with a time stamp in a way
    that is very difficult to tamper. It is append-only, so you can only write to
    it and not change or remove any information. A class of technologies that implements
    immutable ledgers is *blockchain networks*, which use a set of computers distributed
    across many owners and geographies to each provably validate and store a copy
    of the facts. The only way to beat this setup is by colluding with'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'more than half of the computer owners to change a fact that has been written,
    which is a difficult endeavor. Blockchains provide a form of distributed trust.


    There are two kinds of blockchains: (1) *permissioned* (also known as private)
    and (2) *permissionless* (also known as public). Permissioned blockchains restrict
    reading and writing of information and ownership of machines to only those who
    have signed up with credentials. Permissionless blockchains are open to anyone
    and can be accessed anonymously. Either may be an option for maintaining the provenance
    of facts while making the attrition prediction model more trustworthy. If all
    consumers are within the corporation or are among a fixed set of regulators, then
    a permissioned blockchain network will do the trick. If the general public or
    others external to JCN Corporation are the consumers of the factsheet, then a
    permissionless blockchain is the preferred solution.


    Posting facts to a blockchain solves the problem of maintaining the provenance
    of facts, but what if there is tampering in the creation of the facts themselves?
    For example, what if a data scientist discovers a small bug in the feature engineering
    code that shouldn’t affect model performance very much and fixes it. Retraining
    the entire model will go on through the night, but there’s a close-of-business
    deadline to submit facts. So the data scientist submits facts from a previously
    trained model. Shortcuts like this can also be prevented with blockchain technologies.³⁰
    Since the training of many machine learning models is done in a deterministic
    way by an iterative procedure (such as gradient descent), other computers in the
    blockchain network can endorse and verify that the training computation was actually
    run by locally rerunning small parts of the computation starting from checkpoints
    of the iterations posted by the data scientist. The details of how to make such
    a procedure tractable in terms of computation and communication costs is beyond
    the scope of the book.


    In your testing, you found that all of the models were lacking in fairness, so
    you sent them back to the data scientists to add better bias mitigation, which
    they did to your satisfaction. The various stakeholders are satisfied now as well,
    so you can go ahead and sign for the system’s conformity and push it on to the
    deployment stage of the lifecycle. Alongside the deployment efforts, you also
    release a factsheet for consumption by the managers within JCN Corporation who
    will be following through on the machine’s recommended retention actions. Remember
    that one of the promises of this new machine learning system was to make employment
    at JCN Corporation more equitable, but that will only happen if the managers adopt
    the system’s recommendations.³¹ Your efforts at factsheet-based transparency have
    built enough trust among the managers so they are willing to adopt the system,
    and JCN Corporation will have fairer decisions in retention actions.


    ³⁰Ravi Kiran Raman, Roman Vaculin, Michael Hind, Sekou L. Remy, Eleftheria K,
    Pissadaki, Nelson Kibichi Bore, Roozbeh Daneshvar, Biplav Srivastava, and Kush
    R. Varshney. “A Scalable Blockchain Approach for Trusted Computation and Verifiable
    Simulation in Multi-Party Collaborations.” In: *Proceedings of the IEEE International
    Conference on Blockchain and Cryptocurrency*. May 2019, Seoul, Korea, pp. 277–284.


    ³¹There have been instances where a lack of transparency in machine learning algorithms
    designed to reduce inequity were adopted to a greater extent by privileged decision
    makers and adopted to a lesser extent by unprivileged decision makers, which ended
    up exacerbated inequity instead of tamping it down. See: Shunyung Zhang, Kannan
    Srinivasan, Param Vir Singh, and Nitin Mehta. “AI Can Help Address Inequity—If
