    # 11.1 The Different Kinds of Adversarial Attacks


    As part of the problem specification phase for the machine learning-based job
    applicant classifier that HireRing is building for Kermis, you have to go in and
    assess the different threats it is vulnerable to. There are three dimensions by
    which to categorize adversarial attacks.¹ (1) Which part of the pipeline is being
    attacked: training or deployment? Attacks on training are known as poisoning attacks,
    whereas attacks on deployment are known as evasion attacks. (2) What capabilities
    does the attacker have? What information about the data and model do they know?
    What data and models can they change and in what way? (3) What is the goal of
    the adversary? Do they simply want to degrade performance of the resume screening
    model in general or do they have more sophisticated and targeted objectives? These
    three dimensions are similar to the three considerations when picking a bias mitigation
    algorithm in Chapter 10 (part of pipeline, presence of protected attributes, worldview).


    A mental model of the different attack types is shown in Figure 11.1. Let''s go
    through each of the dimensions in turn as a sort of checklist to analyze what
    Kermis should most be worried about and what the HireRing model should protect
    against most diligently.


