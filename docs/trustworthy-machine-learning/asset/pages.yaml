  md: 'independence between the label and protected attribute corresponds to their
    joint probability being the product of their marginal probabilities. This product
    probability appears in the numerator and the actual observed joint probability
    appears in the denominator of the weight:


    w_j = p_Y(y_j) p_Z(z_j) / p_{Y,Z}(y_j, z_j).


    Equation 10.8


    Protected attributes are required in the training data to learn the model, but
    they don’t have to be part of the model or the deployment data.


    Whereas data augmentation and reweighing do not change the training data you have
    from historical care management decisions, other methods do. One simple method,
    only for statistical parity and the “we’re all equal” worldview, known as massaging
    flips unfavorable labels of unprivileged group members to favorable labels and
    favorable labels of privileged group members to unfavorable labels.18 The chosen
    data points are those closest to the decision boundary that have low confidence.
    Massaging does not need to have protected attributes in the deployment data.


    A different approach, the fair score transformer, works on (calibrated) continuous
    score labels S = p_{Y|X}(Y = fav | x) rather than binary labels.19 It is posed
    as an optimization in which you find transformed scores S′ that have small cross-entropy
    with the original scores S, i.e. H(S || S′), while constraining the statistical
    parity difference, average odds difference, or other group fairness metrics of
    your choice to be of small absolute value. You convert the pre-processed scores
    back into binary labels with weights to feed into a standard training algorithm.
    You can take the “what you see is what you get” worldview with the fair score
    transformer because it assumes that the classifier later trained on the pre-processed
    dataset is competent, so that the pre-processed score it produces is a good approximation
    to the score predicted by the trained model. Although there are pre-processing
    methods that alter both the labels and (structured or semi-structured) features,20
    the fair score transformer proves that you only need to alter the labels. It can
    deal with deployment data that does not come with protected attributes.


    Data augmentation, reweighing, massaging, and fair score transformer all have
    their own domains of competence. Some perform better than others on different
    fairness metrics and dataset characteristics. You’ll have to try different ones
    to see what happens on the Sospital data.'
