- pgno: 152
  md: 'Table 10.1. The three main types of group fairness metrics.


    | Type | Statistical Relationship | Fairness Metric | Can Be A Dataset Metric?
    | Social Bias in Measurement | Favorable Label |

    |---|---|---|---|---|---|

    | independence | Ŷ ⟂ Z | statistical parity difference | yes | yes | assistive
    or non-punitive |

    | separation | Ŷ ⟂ Z \| Y | average odds difference | no | no | assistive |

    | sufficiency (calibration) | Y ⟂ Z \| Ŷ | average predictive value difference
    | no | no | non-punitive |


    Based on the different properties of the three group fairness metrics, and the
    likely social biases in the data you''re using to create the Sospital care management
    model, you should focus on independence and statistical parity difference.


    # 10.4 Defining Individual and Counterfactual Fairness


    An important concept in fairness is intersectionality. Things might look fair
    when you look at different protected attributes separately, but when you define
    unprivileged groups as the intersection of multiple protected attributes, such
    as black women, group fairness metrics show unfairness. You can imagine making
    smaller and smaller groups by including more and more attributes, all the way
    to a logical end of groups that are just individuals that share all of their feature
    values. At this extreme, the group fairness metrics described in the previous
    section are no longer meaningful and a different notion of sameness is needed.
    That notion is individual fairness or consistency: that all individuals with the
    same feature values should receive the same predicted label and that individuals
    with similar features should receive similar predicted labels.


    # 10.4.1 Consistency


    The consistency metric is quantified as follows:


    consistency = 1 - 1/n Σ_{j=1}^n | ŷ_j - 1/k Σ_{j''∈N_k(x_j)} ŷ_{j''} |


    Equation 10.6


    For each of the n Sospital members, the prediction ŷ_j is compared to the average
    prediction of the k nearest neighbors. When the predicted labels of all of the
    k nearest neighbors match the predicted label of the person themselves, you get
    0. If all of the nearest neighbor predicted labels are different from the predicted
    label of the person, the absolute value is 1. Overall, because of the ''one minus''
    at the beginning of Equation 10.6, the consistency metric is 1 if all similar
    points have similar labels and less than 1 if similar points have different labels.'
