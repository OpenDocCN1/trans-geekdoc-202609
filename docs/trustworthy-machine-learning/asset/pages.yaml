    \ make some more assumptions.\n\nOne reasonable assumption you can make is that\
    \ the set of features split into two types: (1) causal or *stable* features, and\
    \ (2) *spurious* features. You don’t know which ones are which beforehand. The\
    \ causal features capture the intrinsic parts of the relationship between features\
    \ and labels, and are the same set of features in different environments. In other\
    \ words, this set of features is *invariant* across the environments. Spurious\
    \ features might be predictive in one environment or a few environments, but not\
    \ universally so across environments. You want the Phulo model to rely on the\
    \ causal features whose predictive relationship with labels holds across Tanzania,\
    \ Rwanda, Congo, and all the other countries that Wavetel has data from and ignore\
    \ the spurious features. By doing so, the hope is that the model will not only\
    \ perform well for the countries in the training set, but also any new country\
    \ or environment that it encounters, such as India. It will be robust to the environment\
    \ in which it is deployed.\n\n> > “ML enables an increased emphasis on stability\
    \ and robustness.”\n> \n> —Susan Athey, economist at Stanford University\n\n*Invariant\
    \ risk minimization* is a variation on the standard risk minimization formulation\
