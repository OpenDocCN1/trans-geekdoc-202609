    # 5.3 Other Ways of Achieving Privacy


    The two technical approaches that yield anonymized data (syntactic anonymity for
    data publishing and differential privacy for data mining) are not the only ways
    for TraceBridge to achieve privacy. Here''s a really easy way for them to achieve
    privacy: lock up the data and throw away the key. If they don''t publish the data
    and provide no ability to query it, they have perfect privacy. But they don''t
    have any utility from the data either. So what else can they do?


    One answer is to set up institutional controls and procedures so that only qualified
    individuals have access to data, and only for specific approved uses. Cleared
    data scientists may only be allowed to access the data on closed computing systems
    with strong enforcement to prevent data breaches. Keeping data in a decentralized
    manner rather than all in one centralized place can also help prevent breaches.


    A second answer is to bring the algorithm to the data rather than the other way
    around. Working through a decentralized system where different pieces of data
    are kept in different places, secure multi-party computation allows a value to
    be computed using data from different sources without revealing the inputs sent
    by each data source to other data sources.


    A third answer is encryption. TraceBridge can use fully homomorphic encryption
    to compute things on encrypted data and get the answer they would have gotten
    if the data hadn''t been encrypted. This approach can be a computational beast,
    but is getting more and more computationally tractable every day.


    With all three of these approaches: institutional controls, secure multi-party
    computation, and fully homomorphic encryption, the question of what is computed
    remains open. People and organizations can be using these techniques and still
    be outputting some value or summary statistic that discloses sensitive individual
    information. It may thus make sense to combine these methods with, for example,
    differential privacy.


    # 5.4 Summary


    +   - Data is a valuable resource that comes from people. The use of this data
    should be consensually obtained. If there is no consent, do not proceed.

    +   - It is easy for data scientists to set up machine learning systems that exploit
    and subjugate vulnerable individuals and groups. Do not do it. Instead, be careful,
    thoughtful, and take input from powerless groups.

    +   - By consenting to the use of their data, people give up their privacy. Various
    methods can be used to preserve their privacy.

    +   - Syntactic anonymization methods group together individuals with similar
    quasi-identifiers and then obfuscate those quasi-identifiers. These methods are
    useful when publishing individual-'
