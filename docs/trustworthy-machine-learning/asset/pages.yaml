    When $p_0^{(train)} = p_0^{(deploy)}$, the Bayes optimal threshold is recovered
    and $R\big(p_0^{(deploy)}, p_0^{(deploy)}\big)$ is the optimal Bayes risk $R$
    defined in Chapter 6. It is a concave function that is zero at the endpoints of
    the interval $[0,1].^{12}$ The linear mismatched Bayes risk function is tangent
    to the optimal Bayes risk function at $p_0^{(train)} = p_0^{(deploy)}$ and greater
    than it everywhere else.$^{13}$ This relationship is shown in Figure 9.6.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_136_0.png)


