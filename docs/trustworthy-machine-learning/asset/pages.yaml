  md: '# 13.5 Summary


    +   - Transparency is a key means for increasing the third attribute of trustworthiness
    in machine learning (openness and human interaction).

    +   - Fact flow is a mechanism for automatically collecting qualitative and quantitative
    facts about a development lifecycle. A factsheet is a collection of facts, appropriately
    rendered for a given consumer, that enables transparency and conformity assessment.

    +   - Model validation and risk management involve testing models across dimensions
    of trust, computing the uncertainties of the test results, capturing qualitative
    facts about the development lifecycle, and documenting and communicating these
    items transparently via factsheets.

    +   - Testing machine learning models is a unique endeavor different from other
    software testing because of the oracle problem: not knowing in advance what the
    behavior should be.

    +   - Visualization helps make test results and their uncertainties more accessible
    to various consumer personas.

    +   - Facts and factsheets become more trustworthy if their provenance can be
    maintained and verified. Immutable ledgers implemented using blockchain networks
    provide such capabilities.'
