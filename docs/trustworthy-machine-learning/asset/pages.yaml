  md: '# 3


    # Safety


    Imagine that you are a data scientist at the (fictional) peer-to-peer lender ThriveGuild.
    You are in the problem specification phase of the machine learning lifecycle for
    a system that evaluates and approves borrowers. The problem owners, diverse stakeholders,
    and you yourself want this system to be trustworthy and not cause harm to people.
    Everyone wants it to be safe. But what is harm and what is safety in the context
    of a machine learning system?


    Safety can be defined in very domain-specific ways, like safe toys not having
    lead paint or small parts that pose choking hazards, safe neighborhoods having
    low rates of violent crime, and safe roads having a maximum curvature. But these
    definitions are not particularly useful in helping define safety for machine learning.
    Is there an even more basic definition of safety that could be extended to the
    machine learning context? Yes, based on the concepts of (1) harm, (2) aleatoric
    uncertainty and risk, and (3) epistemic uncertainty.¹ (These terms are defined
    in the next section.)


    This chapter teaches you how to approach the problem specification phase of a
    trustworthy machine learning system from a safety perspective. Specifically, by
    defining safety as minimizing two different types of uncertainty, you can collaborate
    with problem owners to crisply specify safety requirements and objectives that
    you can then work towards in the later parts of the lifecycle.² The chapter covers:


    +   - Constructing the concept of safety from more basic concepts applicable to
    machine learning: harm, aleatoric uncertainty, and epistemic uncertainty.

    +   - Charting out how to distinguish between the two types of uncertainty and
    articulating how to quantify them using probability theory and possibility theory.

    +   - Specifying problem requirements in terms of summary statistics of uncertainty.


    ¹Niklas Möller and Sven Ove Hansson. “Principles of Engineering Safety: Risk and
    Uncertainty Reduction.” In: Reliability Engineering and System Safety 93.6 (Jun.
    2008), pp. 798–805.


    ²Kush R. Varshney and Homa Alemzadeh. “On the Safety of Machine Learning: Cyber-Physical
    Systems, Decision Sciences, and Data Products.” In: Big Data 5.3 (Sep. 2017),
    pp. 246–255.'
