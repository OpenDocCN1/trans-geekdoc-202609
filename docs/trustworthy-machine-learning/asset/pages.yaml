    # 12.6 Quantifying Interpretability


    Throughout the chapter, you’ve learned about many different explainability methods
    applicable at different points of the machine learning pipeline appealing to different
    personas, differentiated according to several dichotomies: local vs. global, approximate
    vs. exact, and feature-based vs. sample-based. But how do you know that a method
    is actually good or not? Your boss isn’t going to put any of your explainability
    tools into the production Hilo platform unless you can prove that they’re effective.


    Evaluating interpretability does not yield the same sort of quantitative metrics
    as in Part 3 for distributional robustness, fairness, and adversarial robustness.
    Ideally, you want to show explanations to a large set of consumers from the relevant
    persona performing the task the model is for and get their judgements. Known as
    *application-grounded evaluation*, this way of measuring the goodness of an explanation
    is usually costly and logistically difficult. A less involved approach, *human-grounded
    evaluation*, uses a simpler task and people who are not the future intended consumers,
    so just general testers rather than actual appraisers or credit officers. An even
    less involved measurement of interpretability, *functionally-grounded evaluation*,
    uses quantitative proxy metrics to judge explanation methods on generic prediction
    tasks. These evaluation approaches are summarized in Table 12.8.


    Table 12.8. Three categories of evaluating explanations.


    | Category | Consumers | Tasks |

    |---|---|---|

    | application-grounded evaluation | true persona members | real task |

    | human-grounded evaluation | generic people | simple task |

    | functionally-grounded evaluation | none | proxy task |


    What are these quantitative proxy metrics for interpretability? Some measure simplicity,
    like the number of operations needed to make a prediction using a model. Others
    compare an explanation method’s ordering of features attribution to some ground-truth
    ordering. (These explainability metrics only apply to feature-based explanations.)
    An explainability metric known as *faithfulness* is based on this idea of comparing
    feature orderings. Instead of requiring a true ordering, however, it measures
    the correlation between a given method’s feature order to the order in which the
    accuracy of a model drops the most when the corresponding feature is deleted.
    A correlation value of 1 is the best faithfulness. Unfortunately, when faithfulness
    is applied to saliency map explanations, it is unreliable. You should'
