    # 3.1 Grasping Safety


    *Safety is the reduction of both aleatoric uncertainty (or risk) and epistemic
    uncertainty associated with harms.*


    First, let’s talk about harm. All systems, including the lending system you’re
    developing for ThriveGuild, yield outcomes based on their state and the inputs
    they receive. In your case, the input is the applicant’s information and the outcome
    is the decision to approve or deny the loan. From ThriveGuild’s perspective (and
    from the applicant’s perspective, if we’re truly honest about it), a desirable
    outcome is approving an applicant who will be able to pay back their loan and
    denying an applicant who will not be able to pay back their loan. An undesirable
    outcome is the opposite. Outcomes have associated costs, which could be in monetary
    or other terms. An undesired outcome is a *harm* if its cost exceeds some threshold.
    Unwanted outcomes of small severity, like getting a poor movie recommendation,
    are not counted as harms.


    In the same way that harms are undesired outcomes whose cost exceeds some threshold,
    trust only develops in situations where the stakes exceed some threshold.³ Remember
    from Chapter 1 that the trustor has to be vulnerable to the trustee for trust
    to develop, and the trustor does not become vulnerable if the stakes are not high
    enough. Thus safety-critical applications are not only the ones in which trust
    of machine learning systems is most relevant and important, they are also the
    ones in which trust can actually be developed.


    Now, let’s talk about aleatoric and epistemic uncertainty, starting with uncertainty
    in general. Uncertainty is the state of current knowledge in which something is
    not known. ThriveGuild does not know if borrowers will or will not default on
    loans given to them. All applications of machine learning have some form of uncertainty.
    There are two main types of uncertainty: *aleatoric uncertainty* and *epistemic
    uncertainty*.⁴


    Aleatoric uncertainty, also known as statistical uncertainty, is inherent randomness
    or stochasticity in an outcome that cannot be further reduced. Etymologically
    derived from dice games, aleatoric uncertainty is used to represent phenomena
    such as vigorously flipped coins and vigorously rolled dice, thermal noise, and
    quantum mechanical effects. Incidents that will befall a ThriveGuild loan applicant
    in the future, such as the roof of their home getting damaged by hail, may be
    subject to aleatoric uncertainty. *Risk* is the average outcome under aleatoric
    uncertainty.


    On the other hand, epistemic uncertainty, also known as systematic uncertainty,
    refers to knowledge that is not known in practice, but could be known in principle.
    The acquisition of this knowledge would


    ³ Alon Jacovi, Ana Marasović, Tim Miller, and Yoav Goldberg. “Formalizing Trust
    in Artificial Intelligence: Prerequisites, Causes and Goals of Human Trust in
    AI.” In: *Proceedings of the ACM Conference on Fairness, Accountability, and Transparency*.
    Mar. 2021, pp. 624–635.


    ⁴ Eyke Hüllermeier and Willem Waegeman. “Aleatoric and Epistemic Uncertainty in
    Machine Learning: An Introduction to Concepts and Methods.” In: *Machine Learning*
    110.3 (Mar. 2021), pp. 457–506.'
