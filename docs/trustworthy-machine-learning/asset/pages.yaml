    Probabilities, pmfs, cdfs, and pdfs are all tools for quantifying aleatoric uncertainty.
    They are used to specify the requirements for the accuracy of models, which is
    critical for the first of the two parts of safety: risk minimization. A correct
    prediction is an event and the probability of that event is the accuracy. For
    example, working with the problem owner, you may specify that the ThriveGuild
    lending model must have at least a 0.92 probability of being correct. The accuracy
    of machine learning models and other similar measures of basic performance are
    the topic of Chapter 6 in Part 3 of the book.'
