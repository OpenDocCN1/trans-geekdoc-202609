  md: "Toward the goal of suggesting problem formulations to ABC Center, understanding\
    \ the relevant data, and creating models for them, in this chapter you will:\n\
    \n+   - distinguish a situation as requiring a causal model or a typical predictive\
    \ machine learning model,\n+   - discover the graph structure of causal relations\
    \ among all random variables in a system, and\n+   - compute the quantitative\
    \ causal effect of an intervention on an outcome, including from observational\
    \ data.\n\n# 8.1 Contrasting Causal Modeling and Predictive Modeling\n\nIf an\
    \ ABC Center client completes a one-on-one counseling session, it may cause a\
    \ change in their level of anxiety. In contrast, completing the sessions does\
    \ not cause an increase in, say, the price of eggs even if the price of eggs suddenly\
    \ jumps the day after every client's counseling session as the price is unrelated\
    \ to ABC Center. In addition, two different things can cause the same result:\
    \ both counseling sessions and an increase in wages can cause a reduction in anxiety.\
    \ You can also be fooled by the common cause fallacy: a client secures stable\
    \ housing and then purchases a used car. The stable housing does not cause the\
    \ car purchase, but both are caused by a wage increase.\n\nBut what is this elusive\
    \ notion called causality? It is not the same as correlation, the ability to predict,\
    \ or even statistical dependence. Remember how we broke down the meanings of trustworthiness\
    \ and safety into smaller components (in Chapter 1 and Chapter 3, respectively)?\
    \ Unfortunately, we cannot do the same for causality since it is an elementary\
    \ concept that cannot be broken down further. The basic definition of causality\
    \ is: if doing something makes something else happen, then the something we did\
    \ is a cause of the something that happened. The key word in the statement is\
    \ do. Causation requires doing. The actions that are done are known as interventions\
