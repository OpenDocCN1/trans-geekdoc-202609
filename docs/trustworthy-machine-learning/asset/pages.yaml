  md: 'evaluating three thousand applications and awarding fellowships seems not to
    be oppressive, harmful, misguided, or useless, but nevertheless, you should think
    deeply before answering.


    > “Technical audiences are never satisfied with the fix being ‘just don’t do it.’”


    —Kristian Lum, statistician at University of Pennsylvania


    Even if a problem is one that should be solved, machine learning is not always
    the answer. Alma Meadow has used a manual process to sort through applications
    for over thirty years, and has not been worse for wear. So why make the change
    now? Are there only some parts of the overall evaluation process for which machine
    learning makes sense?


    The second question is more detailed. Among the different aspects of trustworthiness
    covered in the book so far, such as privacy, consent, accuracy, distributional
    robustness, fairness, adversarial robustness, interpretability, and uncertainty
    quantification, which ones are of the greatest concern? Are some essential and
    others only nice-to-haves? The third question takes the high-level elements of
    trustworthiness and brings them down to the level of specific metrics. Is accuracy,
    balanced accuracy, or AUC a more appropriate metric? How about the choice between
    statistical parity difference and average absolute odds difference? Lastly, the
    fourth question focuses on the preferred ranges of values of the metrics selected
    in the third question. Is a Brier score less than or equal to 0.25 acceptable?
    Importantly, there are relationships among the different pillars; you cannot create
    a system that is perfect in all respects. For example, typical differential privacy
    methods worsen fairness and uncertainty quantification.⁶ Explainability may be
    at odds with other dimensions of trustworthiness.⁷ Thus in the fourth question,
    it is critical to understand the relationships among metrics of different pillars
    and only specify ranges that are feasible.


    # 14.2 Representing and Eliciting Values


