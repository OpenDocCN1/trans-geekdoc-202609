  md: '![](img/78fc6ae0a1bc731065313dc3a5886b2f_171_0.png)


    Figure 11.5. Different defenses against evasion attacks. Accessible caption. A
    hierarchy diagram with defenses against evasion attacks at its root, which has
    denoising and adversarial training as its children. Denoising has children input
