    In the poisoning attack, the adversary has injected a new data point, the square
    with the light border into the training data. This action shifts the decision
    boundary from what it would have been: the solid black line, to something else
    that the adversary desires: the dashed black line. More diamond deployment data
    points will now be misclassified. In the evasion attack, the adversary subtly
    perturbs a deployment data point across the decision boundary so that it is now
    misclassified. Accessible caption. The stylized plot illustrating a poisoning
    attack shows two classes of data points arranged in a noisy yin yang or interleaving
    moons configuration and a decision boundary smoothly encircling one of the classes
    with a blob-like region. A poisoning data point with the label of the inside of
    the region is added outside the region. It causes a new decision boundary that
    puts it inside, while also causing the misclassification of another data point.
    The stylized plot illustrating the evasion attack has a data point inside the
    blob-like region. The attack pushes it outside the region.


    Another way to write the label change $\hat{y}(x + \delta) \ne \hat{y}(x)$ is
    through the zero-one loss function: $L(\hat{y}(x), \hat{y}(x + \delta)) = 1$.
    (Remember that the zero-one loss takes value 0 when both arguments are the same
    and value 1 when the arguments are different.) Because the zero-one loss can only
    take the two values 0 and 1, you can also write the adversarial example using
    a maximum as:


    $$\max_{\|\delta\|\leq\epsilon} L(\hat{y}(x), \hat{y}(x + \delta)).$$


