    # 12.3.6 Deletion Diagnostics and Influence Functions


    The final set of methods that appeal to the regulator persona are from the global
    sample-based category. An exact method computes *deletion diagnostics* to find
    *influential* instances and an approximate method uses *influence functions* to
    do the same. The basic idea of deletion diagnostics is simple. You train a model
    with the entire training dataset of houses or applicants and then train it again
    leaving out one of the training samples. Whatever global changes there are to
    the model can be attributed to the house or applicant that you left out. How do
    you look at what changed between the two models? You can directly look at the
    two models or their parameters, which makes sense if the models are interpretable.
    But that won’t work if you have an uninterpretable model. What you need to do
    is evaluate the two models on a held-out test set and compute the average change
    in the predicted labels. The bigger the change, the more influential the training
    data point. The regulator gains an understanding of the model by being given a
    list of the most influential homes or applicants.


    Exactly computing deletion diagnostics is expensive because you have to train
    n + 1 different models, leaving one training point out each time plus the model
    trained on all the data points. So usually, you’ll want to approximate the calculation
    of the most influential training samples. Let’s see how this approximation is
    done for machine learning algorithms that have smooth loss functions using the
    method of influence functions (refer back to Chapter 7 for an introduction to
    loss functions).¹⁷ Influence function explanations are also useful for decision
    makers.


