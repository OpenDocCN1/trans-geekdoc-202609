    In: Financial Times (Apr. 2018). URL: https://www.ft.com/content/86061a82-46ce-11e8-bc77-ff51caedcde6.


    ¹³Katherine Ye. “Silicon Valley and the English Language.” URL: https://book.affecting-technologies.org/silicon-valley-and-the-english-language/.
    Jul. 2020.


    ¹⁴C. K. Prahalad. The Fortune at the Bottom of the Pyramid: Eradicating Poverty
