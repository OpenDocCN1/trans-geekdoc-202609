- pgno: 172
  md: 'If your machine learning model is a neural network, then the values of the
    data as it passes through intermediate layers constitute a latent representation.
    The third denoising category works in this latent representation space. Like in
    the frequency domain, this category also squashes the values in certain dimensions.
    However, these techniques do not simply assume that the adversarial noise is concentrated
    in a certain part of the space (e.g., high frequencies), but rather learn these
    dimensions using clean job applications and their corresponding adversarial examples
    that you create.


    # 11.3.2  Adversarial Training


    The second main category of defenses against evasion attacks is adversarial training.
    It is a form of min-max robustness,⁵ which you first encountered in Chapter 9
    in the context of distribution shift. Remember that the min-max idea is to do
    the best you can on the worst-case scenario. In adversarial training, the minimization
    and maximization are as follows. The minimization is to find the best job applicant
    classifier in the hypothesis space, just like any other risk minimization approach
    to machine learning. The inner maximization is to find the worst-case perturbations
    of the resumes. The mathematical form of the objective is:


    $$\mathcal{J}(\cdot)=\arg\min_{f\in\mathcal{F}}\sum_{j=1}^{n}\max_{\|\delta_j\|\leq\epsilon}\mathcal{L}\left(y_j,f(x_j+\delta_j)\right)$$


    Equation 11.3


    Notice that the inner maximization is the same expression as finding adversarial
    examples given in Equation 11.2. Thus, to carry out adversarial training, all
    you have to do is produce adversarial examples for the Kermis training resumes
    and use those adversarial examples as a new training data set in a typical machine
    learning algorithm. HireRing must become a good attacker to become a good defender.


    # 11.3.3  Evaluating and Certifying Robustness to Evasion Attacks


    Once the HireRing job applicant screening system has been adversarially trained
    on Kermis resumes, how do you know it is any good? There are two main ways to
    measure the model’s robustness: (1) empirically and (2) characterizing the score
    function. As an empirical test, you create your own adversarial example resumes,
    feed them in, and compute how often the adversarial goal is met (confidence reduction,
    misclassification, targeted misclassification, or source/target misclassification).
    You can do it because you know the ground truth of which input resumes contain
    an adversarial perturbation and which ones don’t. Such empirical robustness evaluation
    is tied to the specific attack and its capabilities (open-box or closed-box) since
    you as the evaluator are acting as the adversary.


    ⁵Aleksander Madry, Aleksandar Makelov, Ludwig Schmidt, Dimitris Tsipras, and Adrian
    Vladu. “Towards Deep Learning Models Resistant to Adversarial Attacks.” In: *Proceedings
    of the International Conference on Learning Representations*. Vancouver, Canada,
    Apr.–May 2018.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'In contrast, a way to characterize the adversarial robustness of a classifier
    that is agnostic to the evasion attack is the CLEVER score.⁶ An acronym for cross-Lipschitz
    extreme value for network robustness, the CLEVER score (indirectly) analyzes the
    distance from a job application data point to the classifier decision boundary.
    Misclassification attacks will be unsuccessful if this distance is too far because
    it will exceed ε, the bound on the norm of the perturbation δ. The higher the
    CLEVER score, the more robust the model. Generally speaking, smooth, non-complicated
    decision boundaries without many small islands (like the left score function in
    Figure 11.4) have large distances from data points on average, have large average
    CLEVER scores, and are robust to all kinds of evasion attacks. In the problem
    specification phase with the Kermis problem owners, you can set an acceptable
    minimum value for the average CLEVER score. If the model achieves it, HireRing
    can confidently certify a level of security and robustness.


    # 11.4 Summary


    +   - Adversaries are actors with bad intentions who try to attack machine learning
    models by degrading their accuracy or fooling them.

    +   - Poisoning attacks are implemented during model training by corrupting either
    the training data or model.

    +   - Evasion attacks are implemented during model deployment by creating adversarial
    examples that appear genuine, but fool models into making misclassifications.

    +   - Adversaries may just want to worsen model accuracy in general or may have
    targeted goals that they want to achieve, such as obtaining specific predicted
    labels for specific inputs.

    +   - Adversaries have different capabilities of what they know and what they
    can change. These differences in capabilities and goals determine the threat.

    +   - Defenses for poisoning attacks take place at different parts of the machine
    learning pipeline: data sanitization (pre-processing), smoothing (model training),
    and patching (post-processing).

    +   - Defenses for evasion attacks include denoising that attempts to remove adversarial
    perturbations from inputs and adversarial training which induces min-max robustness.

    +   - Models can be certified for robustness to evasion attacks using the CLEVER
    score.

    +   - Even without malicious actors, adversarial attacks are a way for developers
    to test machine learning systems in worst case scenarios.'
  merge: -1
  img_proc: true
