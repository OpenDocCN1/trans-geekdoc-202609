  md: '# 1.4.4 Motivation and Values


    My motivations begin with family values. The great-great-grandfather I mentioned
    above returned to India with knowledge of industrial-scale glassmaking from MIT
    and made social impact by establishing a factory in service of swaraj, self-governance
    in India, and the training of local workers. One of my grandfathers applied his
    knowledge of systems and control theory to problems in agriculture and also worked
    toward social justice in India through non-technological means. My other grandfather
    joined UNESCO to establish engineering colleges in developing Iraq and Thailand.
    My mother taught science in an inner-city school district''s special program for
    students caught with weapons in their regular middle and high schools.


    In the same way, consistent with family values as well as external ethics (yama),²²
    internal ethics (niyama),²³ and the ethos of the American dream, my personal motivation
    is to advance today''s most societally-impactful technology (machine learning),
    mitigate its harmfulness, apply it to uplift humanity, and train others to do
    the same. I co-founded the IBM Science for Social Good fellowship program in 2015–2016
    and direct it toward these aims.


    The reason I wrote this book is many-fold. First, I feel that although many of
    the topics that are covered in the book, like fairness, explainability, robustness,
    and transparency are often talked about together, there is no source that unifies
    them in a coherent thread. With this book, there is such a resource for technologists,
    developers, and researchers to learn from. Second, I feel that in industry practice,
    the unbridled success of deep learning has led to too much emphasis on engineers
    squeezing out a little more accuracy with little conceptual understanding and
    little regard to considerations beyond accuracy (the other three attributes of
    trust). The aim of the book is to fill the conceptual understanding gap for the
    practitioners who wish to do so, especially those working in high-stakes application
    domains. (Cai and Guo find that many software engineers fundamentally desire guidance
    on understanding and applying the conceptual underpinnings of machine learning.)²⁴
    The inclusion of considerations beyond predictive accuracy cannot be an afterthought;
    it must be part of the plan from the beginning of any new project. Third, I would
    like to empower others who share my values and ethics to pursue a future in which
    there is a virtuous cycle of research and development in which technology helps
    society flourish and society helps technology flourish.


    # 1.5 Summary


    +   - Machine learning systems are influencing critical decisions that have consequences
    to our daily lives, but society lacks trust in them.

    +   - Trustworthiness is composed of four attributes: competence, reliability,
    openness, and selflessness.'
