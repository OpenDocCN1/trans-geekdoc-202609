    event is the product of the marginal conditional probabilities under conditional
    independence.


    A ⟂ B | C ⇔ P(A ∩ B | C) = P(A | C) P(B | C).


    Equation 3.17


    Conditional independence also extends to random variables and their pmfs, cdfs,
    and pdfs.


    # 3.5.2 Bayesian Networks


    To get the full benefit of the simplifications from independence, you should trace
    out all the different dependence and independence relationships among the applicant
    features and the loan approval decision. Bayesian networks, also known as directed
    probabilistic graphical models, serve this purpose. They are a way to represent
    a joint probability of several events or random variables in a structured way
    that utilizes conditional independence. The name graphical model arises because
    each event or random variable is represented as a node in a graph and edges between
    nodes represent dependencies, shown in the example of Figure 3.3, where A1 is
    income, A2 is employment status, A3 is loan approval, and A4 is gender. The edges
    have an orientation or direction: beginning at parent nodes and ending at child
    nodes. Employment status and gender have no parents; employment status is the
    parent of income; both income and employment status are the parents of loan approval.
    The set of parents of the argument node is denoted pa(.).


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_47_0.png)


    Figure 3.3. An example graphical model consisting of four events. The employment
    status and gender nodes have no parents; employment status is the parent of income,
    and thus there is an edge from employment status to income; both income and employment
    status are the parents of loan approval, and thus there are edges from income
    and from employment status to loan approval. The graphical model is shown on the
    left with the names of the events and on the right with their symbols.


    The statistical relationships are determined by the graph structure. The probability
    of several events A1, ..., An is the product of all the events conditioned on
    their parents:


    P(A1, ..., An) = ∏_{j=1}^{n} P(Aj | pa(Aj)).


    Equation 3.18'
