    Putting principles to practice is a process that has its own lifecycle.15 The
    first step is a series of small efforts such as ad hoc risk assessments initiated
    by tempered radicals (people within the organization who believe in the change
    and continually take small steps toward achieving it). The second step uses the
    small efforts to demonstrate the importance of trustworthy machine learning and
    obtain the buy-in of executives to agree to ethics principles. The executives
    then invest in educating the entire organization on the principles and also start
    valuing the work of individuals who contribute to trustworthy machine learning
    practices in their organization. The impetus for executives may also come from
    external forces such as the news media, brand reputation, third-party audits,
    and regulations. The third step is the insertion of fact flow tooling (remember
    this was a way to automatically capture facts for transparency in Chapter 13)
    and fairness/robustness/explainability algorithms throughout the lifecycle of
    the common development infrastructure that the organization uses. The fourth step
    is instituting the requirement that diverse stakeholders be included in problem
    specification (value alignment) and evaluation of machine learning systems with
    veto power to modify or stop the deployment of the system. Simultaneously, this
    fourth step includes the budgeting of resources to pursue trustworthy machine
    learning in all model development throughout the organization.


    # 15.6 Summary


    +   - The purpose of trustworthy machine learning systems is to do good, but there
    is no single definition of good.

    +   - Different definitions are expressed in ethics principles from organizations
    across the government, private, and social sectors.

    +   - Common themes are privacy, fairness, reliability, transparency, and beneficence.

    +   - Governments emphasize the economic implications of the adoption of machine
    learning.

    +   - Companies stick primarily to the common themes.

    +   - NGOs emphasize the centering and empowerment of vulnerable groups.'
