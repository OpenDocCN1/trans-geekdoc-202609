  md: "# 18.3  Taxes and Regulations\n\nThere are few incentives for existing, entrenched\
    \ platforms to pursue paradigms different from engagement maximization in the\
    \ capitalist world we live in. Upwe.com will find it very difficult to break in\
    \ without other changes. Short of completely upending society to be more relational\
    \ via structures such as village-level democracy and self-reliance promoted by\
    \ Mahatma Gandhi or anarchism,^14 the primary ways to control the harms of maximizing\
    \ engagement are through government-imposed taxes and regulation spurred by a\
    \ change in societal norms.^15 The norms should value the wellbeing of all people\
    \ above all else. Viewing machine learning for information filtering as an institution\
    \ rather than an individual, it is not surprising that the people who support\
    \ interventions for controlling the negative externalities of the systems are\
    \ those who have strong trust in institutions.^16 Society may already be on a\
    \ path to demanding greater control of digital media platforms.^17\n\nWhile building\
    \ up and developing Upwe.com, you should take a page out of Henry Heinz’s playbook\
    \ (remember from the preface that in addition to developing trustworthy processed\
    \ food products, he lobbied for the passage of the Pure Food and Drug Act) and\
    \ push for stronger regulations. Some possible regulations recommended by the\
    \ Aspen Institute are:^18\n\n+   1. *High reach content disclosure.* Companies\
    \ must regularly report on the content, source, and reach of pieces of knowledge\
    \ that receive high engagement on their platform.\n+   \n+   2. *Content moderation\
    \ disclosure.* Companies must report the content moderation policies of their\
    \ platform and provide examples of moderated content to qualified individuals.\n\
    +   \n+   3. *Ad transparency.* Companies must regularly report key information\
    \ about every ad that appears on their platform.\n+   \n+   4. *Superspreader\
    \ accountability.* People who spread disinformation that leads to real-world negative\
    \ consequences are penalized.\n+   \n+   5. *Communications decency control on\
    \ ads and recommendation systems.* Make companies liable for hateful content that\
    \ spreads on their platform due to the information filtering algorithm, even if\
    \ it is an ad.\n\nMany of these recommended regulations enforce transparency since\
    \ it is a good way of building institutional trust. However, they do not provide\
    \ governance on the paradigm underlying the platform because it is difficult to\
    \ measure the paradigm. Nevertheless, they will control the paradigm to some extent.\
    \ If social media platforms are deemed *public utilities* or *common carriers*,\
    \ like telephone and electricity providers, then even more strict regulations\
