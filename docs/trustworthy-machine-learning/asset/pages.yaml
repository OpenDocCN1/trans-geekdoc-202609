    Figure 8.1) while quantifying a causal effect. The center wants to test whether
    reducing a client’s high anxiety to low anxiety affects their stable housing status.
    There is a backdoor path from anxiety to stable housing going through wages and
    child care. The path begins with an arrow going into anxiety. A common cause without
    observation, wages $\leftarrow$ child care $\rightarrow$ stable housing, is the
