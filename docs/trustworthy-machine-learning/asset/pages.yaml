    # ### 9.4.2  Covariate Shift


    If you are in the covariate shift setting instead of being in the prior probability
    shift setting, you have to do something a little differently to make your model
    robust to the deployment environment. Here too, robustness means setting up a
    min-max optimization problem so that you do the best that you can in preventing
    the worst-case behavior. Starting from the importance weight formulation of Equation
    9.1, put in an extra maximum loss over the weights:


    $\hat{f} = \arg\min_{f \in \mathcal{F}} \max_{w} \frac{1}{n}\sum_{j=1}^{n} w_{L}
    L(y_j, f(x_j)),$


    Equation 9.5


    where $w$ is the set of possible weights that are non-negative and sum to one.
    The classifier that optimizes the objective in Equation 9.5 is the robust classifier
    you’ll want to use for the Phulo model to deal with covariate shift.


    # ### 9.4.3  Concept Drift and Other Distribution Shifts


