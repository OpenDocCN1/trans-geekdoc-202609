    $$\arg\min_{p_0^{(train)}} \max_{p_0^{(deploy)}} R\big(p_0^{(deploy)}, p_0^{(train)}\big).$$


    Normally in the book, we stop at the posing of the formulation. In this instance,
    however, since the min-max optimal solution has nice geometric properties, let’s
    carry on. The mismatched Bayes risk function $R\big(p_0^{(deploy)}, p_0^{(train)}\big)$
