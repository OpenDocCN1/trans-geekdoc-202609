    # 12.4.5  Saliency Maps


    Another local explanation technique for you to consider adding to your Hilo explainability
    toolkit takes the partial derivative of the classifier’s score S or probability
    of label Ŷ = 1 | X with respect to each of the input feature dimensions x⁽ⁱ⁾,
    i = 1, …, d. A higher magnitude of the derivative indicates a greater change in
    the classifier score with a change in the feature dimension value, which is interpreted
    as greater importance of that feature. Putting together all d of the partial derivatives,
    you have the gradient of the score with respect to the features X̄ that you examine
    to see which entries have the largest absolute values. For images, the gradient
    can be displayed as another image known as a saliency map. The decision maker
    can see which parts of the image are most important to the classification. Saliency
    map methods are approximate because they do not consider interactions among the
    different features.


    Figure 12.8 shows example saliency maps for a classifier that helps the appraisal
    process by predicting what objects are seen in a street view image. The model
    is the Xception image classification model trained on the ImageNet Large Scale
    Visual Recognition Challenge dataset containing 1000 different classes of objects.²⁰
    The saliency maps shown in the figure are computed by a specific method known
    as grad-CAM.²¹ It is clear from the saliency maps that the classifier focuses
    its attention on the main house portion and its architectural details, which is
    to be expected.


    ²⁰François Chollet. “Xception: Deep Learning with Depthwise Separable Convolutions.”
    In: _Proceedings of the IEEE Conference on Computer Vision and Pattern Recognition_.
