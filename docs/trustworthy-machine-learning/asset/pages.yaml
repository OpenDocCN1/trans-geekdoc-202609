- pgno: 52
  md: '![](img/78fc6ae0a1bc731065313dc3a5886b2f_52_0.png)


    **Figure 4.1. Organization of the book.** *This second part focuses on different
    considerations of trustworthiness when working with data.* Accessible caption.
    A flow diagram from left to right with six boxes: part 1: introduction and preliminaries;
    part 2: data; part 3: basic modeling; part 4: reliability; part 5: interaction;
    part 6: purpose. Part 2 is highlighted. Parts 3–4 are labeled as attributes of
    safety. Parts 3–6 are labeled as attributes of trustworthiness.


    The chapter digs into how you and Unconditionally’s data engineers and other data
    scientists should:


    +   - use knowledge of characteristics of different data modalities to evaluate
    datasets,

    +   - select among different sources of data, and

    +   - appraise datasets for biases and validity.


    Appraising data sets for biases is critical for trustworthiness and is the primary
    focus of the chapter. The better job done at this stage, the less correction and
    mitigation of harms needs to be done in later stages of the lifecycle. Bias evaluation
    should include input from affected individuals of the planned machine learning
    system. If all possible relevant data is deemed too biased, a conversation with
    the problem owner and other stakeholders on whether to even proceed with the project
    is a must. (Data privacy and consent are investigated in Chapter 5.)


    # 4.1  Modalities


    Traditionally, when most people imagine data, they imagine tables of numbers in
    an accounting spreadsheet coming out of some system of record. However, data for
    machine learning systems can include digital family photographs, surveillance
    videos, tweets, legislative documents, DNA strings, event logs from computer systems,
    sensor readings over time, structures of molecules, and any other information
    in digital form. In the machine learning context, data is assumed to be a finite
    number of samples drawn from any underlying probability distribution.


    The examples of data given above come from different *modalities* (images, text,
    time series, etc.). A modality is a category of data defined by how it is received,
    represented, and understood. Figure 4.2 presents a mental model of different modalities.
    There are of course others that are missing from the figure.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/78fc6ae0a1bc731065313dc3a5886b2f_53_0.png)


    Figure 4.2. A mental model of different modalities of data. Accessible caption.
    A hierarchy diagram with data at its root. Data has children structured and semi-structured.
    Structured has children tabular and graphs. Tabular has children static tabular
    data, time series, and event streams. Graphs has children social networks, physical
    networks, and molecules. Semi-structured has children signals and sequences. Signals
    has children images, audio, and video. Sequences has children natural language,
    biological sequences, and software source code.


    One of Unconditionally’s possible datasets is from a household survey. It is an
    example of the static tabular data modality and part of the structured data category
    of modalities.¹ It is static because it is not following some time-varying phenomenon.
    The columns are different attributes that can be used as features and labels,
    and the rows are different records or sample points, i.e. different people and
    households. The columns contain numeric values, ordinal values, categorical values,
    strings of text, and special values such as dates. Although tabular data might
    look official, pristine, and flawless at first glance due to its nice structure,
    it can hide all sorts of false assumptions, errors, omissions, and biases.


    Time series constitute another modality that can be stored in tabular form. As
    measurements at regular intervals in time (usually of numeric values), such data
    can be used to model trends and forecast quantities in time. Longitudinal or panel
    data, repeated measurements of the same individuals over time, are often time
    series. Household surveys are rarely longitudinal however, because they are logistically
    difficult to conduct. Cross-sectional surveys, simply several tabular datasets
    taken across time but without any linking, are logistically much easier to collect
    because the same individuals do not have to be tracked down.


    Another of Unconditionally’s possible datasets is mobile money transactions. Time
    stamps are a critical part of transactions data, but are not time series because
    they do not occur at regular intervals. Every mobile money customer asynchronously
    generates an event whenever they receive or disburse funds, not mediated by any
    common clock across customers. Transaction data is an example of the event stream
    modality. In addition to a time stamp, event streams contain additional values
    that are measured such as monetary amount, recipient, and items purchased. Other
    event streams include clinical tests conducted in a hospital and social services
    received by clients.


    ¹There are modalities with even richer structure than tabular data, such as graphs
    that can represent social networks and the structure of chemical molecules.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Unconditionally can estimate poverty using satellite imagery. Digital *images*
    are the modality that spurred a lot of the glory showered upon machine learning
    in the past several years. They are part of the *semi-structured* branch of modalities.
    In general, images can be regular optical images or ones measured in other ranges
    of the electromagnetic spectrum. They are composed of numeric pixel values across
    various channels in their raw form and tend to contain a lot of spatial structure.
    *Video*, an image sequence over time, has a lot of spatiotemporal structure. Modern
    machine learning techniques learn these spatial and spatiotemporal representations
    by being trained on vast quantities of data, which may themselves contain unwanted
    biases and unsuitable content. (The model for the specified problem is a fine-tuned
    version of the model pre-trained on the large-scale, more generic dataset. These
    large pre-trained models are referred to as *foundation models*.) Videos may also
    contain *audio* signals.


    One of your colleagues at Unconditionally imagines that although less likely,
    the content of text messages and social media posts might predict a person’s poverty
    level. This modality is *natural language* or *text*. Longer documents, including
    formal documents and publications, are a part of the same modality. The syntax,
    semantics, and pragmatics of human language is complicated. One way of dealing
    with text includes parsing the language and creating a syntax tree. Another way
    is representing text as sparse structured data by counting the existence of individual
    words, pairs of words, triplets of words, and so on in a document. These *bag-of-words*
    or *n-gram* representations are currently being superseded by a third way: sophisticated
    *large language models*, a type of foundation model, trained on vast corpora of
    documents. Just like in learning spatial representations of images, the learning
    of language models can be fraught with many different biases, especially when
    the norms of the language in the training corpus do not match the norms of the
    application. A language model trained on a humongous pile of newspaper articles
    from the United States will typically not be a good foundation for a representation
    for short, informal, code-mixed text messages in East Africa.²


    Typically, structured modalities are their own representations for modeling and
    correspond to deliberative decision making by people, whereas semi-structured
    modalities require sophisticated transformations and correspond to instinctive
    perception by people. These days, the sophisticated transformations for semi-structured
    data tend to be learned using deep neural networks that are trained on unimaginably
    large datasets. This process is known as *representation learning*. Any biases
    present in the very large background datasets carry over to models fine-tuned
    on a problem-specific dataset because of the originally opaque and uncontrollable
    representation learning leading to the foundation model. As such, with semi-structured
    data, it is important that you not only evaluate the problem-specific dataset,
    but also the background dataset. With structured datasets, it is more critical
    that you analyze data preparation and feature engineering.³


    # 4.2 Data Sources


    Not only do the various kinds of data being considered by Unconditionally vary
    by modality, they also vary by how and where they come from, i.e., their *provenance*.
    As part of data understanding, your team'
