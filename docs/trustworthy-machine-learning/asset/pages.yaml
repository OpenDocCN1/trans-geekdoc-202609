- pgno: 17
  md: '# 1.1.3 Mapping Trustworthy Attributes to Machine Learning


    Interpreting the attributes of trustworthiness from the table in the context of
    machine learning is the primary thread of this book. In particular, we take Attribute
    1 (competence) to be basic performance such as the accuracy of a machine learning
    model. Good performance, appropriately quantified based on the specifics of the
    problem and application,¹⁷ is a necessity to be used in any real-world task.


    We take Attribute 2 to include the reliability, safety, security and fairness
    of machine learning models and systems. Machine learning systems need to maintain
    good and correct performance across varying operating conditions. Different conditions
    could come from natural changes in the world or from malevolent or benevolent
    human-induced changes.


    We take Attribute 3 to consist of various aspects of openness and human interaction
    with the machine learning system. This includes communication from the machine
    to the human through comprehensibility of models by people as well as transparency
    into overall machine learning system pipelines and lifecycles. It also includes
    communication from the human to the machine to supply personal and societal desires
    and values.


    We take Attribute 4 (selflessness) to be the alignment of the machine learning
    system’s purpose with a society’s wants. The creation and development of machine
    learning systems is not independent of its creators. It is possible for machine
    learning development to go in a dystopian direction, but it is also possible for
    machine learning development to be intertwined with matters of societal concern
    and applications for social good, especially if the most vulnerable members of
    society are empowered to use machine learning to meet their own goals.


    Although each of the four attributes are conceptually distinct, they may have
    complex interrelationships. We return to this point later in the book, especially
    in Chapter 14. There, we describe relationships among the different attributes
    (some are tradeoffs, some are not) that policymakers must reason about to decide
    a system’s intended operations.


    We use the following working definition of trustworthy machine learning in the
    remainder of the book. A trustworthy machine learning system is one that has sufficient:


    +   1. **basic performance,**

    +   2. **reliability,**

    +   3. **human interaction, and**

    +   4. **aligned purpose.**


    We keep the focus on making machine learning systems worthy of trust rather than
    touching on other (possibly duplicitous) ways of making them trusted.


    # 1.2 Organization of the Book


    The organization of the book closely follows the four attributes in the definition
    of trustworthy machine learning. I am purposefully mindful in developing the concepts
    slowly rather than jumping ahead quickly to the later topics that may be what
    are needed in immediate practice. This is because'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'the process of creating trustworthy machine learning systems, given the high
    consequence of considerations like safety and reliability, should also be done
    in a thoughtful manner without overzealous haste. Taking shortcuts can come back
    and bite you.


    > “Slow down and let your System 2 take control.”¹⁸


    —Daniel Kahneman, behavioral economist at Princeton University


    > “Worry about rhythm rather than speed.”


    —Danil Mikhailov, executive director of data.org


    Highlighted in Figure 1.1, the remainder of Part 1 discusses the book''s limitations
    and works through a couple of preliminary topics that are important for understanding
    the concepts of trustworthy machine learning: the personas and lifecycle of developing
    machine learning systems in practice, and quantifying the concept of safety in
    terms of uncertainty.


    ![](img/78fc6ae0a1bc731065313dc3a5886b2f_18_0.png)


    Figure 1.1. Organization of the book. This first part focuses on introducing the
    topic of trustworthy machine learning and covers a few preliminary topics. Accessible
    caption. A flow diagram from left to right with six boxes: part 1: introduction
    and preliminaries; part 2: data; part 3: basic modeling; part 4: reliability;
    part 5: interaction; part 6: purpose. Part 1 is highlighted. Parts 3–4 are labeled
    as attributes of safety. Parts 3–6 are labeled as attributes of trustworthiness.


    Part 2 is a discussion of data, the prerequisite for doing machine learning. In
    addition to providing a short overview of different data modalities and sources,
    the part touches on three topics relevant for trustworthy machine learning: biases,
    consent, and privacy.


    Part 3 relates to the first attribute of trustworthy machine learning: basic performance.
    It describes optimal detection theory and different formulations of supervised
    machine learning. It teaches several different learning algorithms such as discriminant
    analysis, naïve Bayes, k-nearest neighbor, decision


    ¹⁸Kahneman and Tversky described two ways in which the brain forms thoughts, which
    they call ‘System 1’ and ‘System 2.’ System 1 is fast, automatic, emotional, stereotypic
    and consciousness. System 2 is slow, effortful, logical, calculating, and conscious.
    Please engage the ‘System 2’ parts of your thought processes and be deliberate
    when you develop trustworthy machine learning systems.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'trees and forests, logistic regression, support vector machines, and neural
    networks. The part concludes with methods for causal discovery and causal inference.


    Part 4 is about the second attribute of trustworthy machine learning: reliability.
    This attribute is discussed through three specific topics: distribution shift,
    fairness, and adversarial robustness. The descriptions of these topics not only
    define the problems, but also provide solutions for detecting and mitigating the
    problems.


    Part 5 is about the third attribute: human interaction with machine learning systems
    in both directions—understanding the system and giving it instruction. The part
    begins with interpretability and explainability of models. It moves onto methods
    for testing and documenting aspects of machine learning algorithms that can then
    be transparently reported, e.g. through factsheets. The final topic of this part
    is on the machine eliciting the policies and values of people and society to govern
    its behavior.


    Part 6 discusses the fourth attribute: what those values of people and society
    may be. It begins by covering the ethics principles assembled by different parties
    as their paradigms for machine learning. Next, it discusses how the inclusion
    of creators of machine learning systems with diverse lived experiences broadens
    the values, goals, and applications of machine learning, leading in some cases
    to the pursuit of social good through the technology. Finally, it shows how the
    prevailing paradigm of machine learning in information recommendation platforms
    leads to filter bubbles and disinformation, and suggests alternatives. The final
    chapter about platforms is framed in terms of trustworthy institutions, which
    have different attributes than individual trustworthy people or individual trustworthy
    machine learning systems.


    # 1.3　Limitations


    Machine learning is an increasingly vast topic of study that requires several
    volumes to properly describe. The elements of trust in machine learning are also
    now becoming quite vast. In order to keep this book manageable for both me (the
    author) and you (the reader) it is limited in its depth and coverage of topics.
    Parts of the book are applicable both to simpler data analysis paradigms that
    do not involve machine learning and to explicitly programmed computer-based decision
    support systems, but for the sake of clarity and focus, they are not called out
    separately.


    Significantly, despite trustworthy machine learning being a topic at the intersection
    of technology and society, the focus is heavily skewed toward technical definitions
    and methods. I recognize that philosophical, legal, political, sociological, psychological,
    and economic perspectives may be even more important to understanding, analyzing,
    and affecting machine learning’s role in society than the technical perspective.
    Nevertheless, these topics are outside the scope of the book. Insights from the
    field of human-computer interaction are also extremely relevant to trustworthy
    machine learning; I discuss these to a limited extent at various points in the
    book, particularly Part 5.


    Within machine learning, I focus on supervised learning at the expense of unsupervised
    and reinforcement learning. I do, however, cover graphical representations of
    probability and causality as well as their inference. Within supervised learning,
    the primary focus is on classification problems in which the labels are categorical.
    Regression, ordinal regression, ranking, anomaly detection, recommendation, survival
    analysis, and other problems without categorical labels are not the focus. The
    depth in describing various classification algorithms is limited and focused on
    high-level concepts rather than more detailed accounts or engineering tricks for
    using the algorithms.'
