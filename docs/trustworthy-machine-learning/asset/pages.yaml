    # 10.6 Other Considerations


    Before concluding the chapter, let’s consider a couple other issues. The first
    did not come up in the Sospital care management use case, but can come up in other
    use cases. The Sospital problem lent itself to fairness in the context of direct
    allocation decisions, but that is not the only possibility. There are also harms
    in representation or quality-of-service, such as bias in search results. For example,
    image searches for professions might yield only white people, web search results
    for personal names overrepresented in the black community might be accompanied
    by advertisements for criminal defense attorneys, and natural language processing
    algorithms for language translation or query understanding might associate doctors
    with men and nurses with women automatically. Some of the bias mitigation algorithms
    for allocative fairness can be used in representational fairness, but different
    techniques may be more appropriate.


