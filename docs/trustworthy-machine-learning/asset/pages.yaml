    # 17.1.2 How Has Data Science for Social Good Been Conducted?


    Surveys of the data science for social good landscape find that nearly all efforts
    have been conducted as one-off projects that involve the development of a custom-tailored
    solution, irrespective of whether they are carried out as data science competitions,
    weekend volunteer events, longer term volunteer-based consulting engagements,
    student fellowship programs, corporate philanthropy, specialized non-governmental
    organizations, or dedicated innovation teams of social change organizations.


    Creating such one-off solutions requires a great deal of time and effort both
    from the social change organization and the data scientists. There is limited
    reuse of assets and learnings from one project to the next because (1) every new
    project involves a different social change organization and (2) data scientists
    acting as volunteers are unable to conduct a sequence of several projects over
    time. Moreover, these projects typically require the social change organization
    to integrate machine learning solutions with their other systems and practices,
    to deploy those solutions, and monitor and maintain the solutions over time themselves.
    Very few social change organizations are equipped to do such ''last-mile'' implementation,
    partly because their funding typically does not allow them to invest time and
    resources into building up technological capacity.


    The confluence of all these factors has led to the state we are in: despite the
    data science for social good movement being nearly a decade long, most projects
    continue to only be demonstrations without meaningful and lasting impact on social
    change organizations and their constituents.⁶ A project lasting a few months may
    show initial promise, but then is not put into practice and does not ''make a
    difference.''


