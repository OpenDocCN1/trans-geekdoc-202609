    of the expression maps the overall influence of x_j to the x_test sample. Once
    you have all the influence values for a set of held-out test houses or applicants,
    you can average, rank, and present them to the regulator to gain global understanding
    about the model.


    # 12.4 Explanations for Decision Makers


    Decision trees, Boolean rule sets, logistic regression, GAMs, GLRMs, and other
    similar hypothesis classes are directly interpretable through their features because
    of their relatively simple form. However, there are many instances in which you
    want to or have to use a complicated uninterpretable model. (Examples of uninterpretable
    models include deep neural networks as well as decision forests and other similar
    ensembles that you learned in Chapter 7.) Nevertheless, in these instances, you
    want the decision maker persona to have a model-level global understanding of
    how the Hilo model works. What are the ways in which you can create approximate
    global explanations to meet this need? (Approximation is a must. If a consumer
    could understand the complicated model without approximation, it would be directly
    interpretable already.) There are two ways to approach global approximate feature-based
    explanations: (1) training a directly interpretable model like a decision tree,
    rule set, or GAM to be similar to the uninterpretable model, or (2) computing
    global summaries of the uninterpretable model that are understandable. In both
    cases, you first fit the complicated uninterpretable model using the training
    data set.


    In addition to having a general model-level understanding to develop trust, approximate
    explanations at the local level help the appraiser or credit officer understand
    the predictions to combine with their own information to make decisions. The local
    feature-based explanation methods LIME and SHAP extend each of the two global
    feature-based explanation methods to the local level, respectively. A third local
    feature-based explanation method useful to appraisers and usually applied to semi-structured
    data modalities is known as saliency maps. Finally, local approximate sample-based
    explanations based on comparisons to prototypical data points help appraisers
    and credit officers make their final decisions as well. All of these methods are
    elaborated upon in this section.


    # 12.4.1 Global Model Approximation


    Global model approximation is the idea of finding a directly interpretable model
    that is close to a complicated uninterpretable model. It has two sub-approaches.
    The first, known as distillation, changes'
