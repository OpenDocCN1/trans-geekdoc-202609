  md: '# 10.5.2 In-Processing


    In-processing bias mitigation algorithms are straightforward to state, but often
    more difficult to actually optimize. The statement is as follows: take an existing
    risk minimization supervised learning algorithm, such as (a repetition of Equation
    7.4):


    f̂(·) = arg min_{f ∈ F} 1/n Σ_{j=1}^n L(y_j, f(x_j)) + λJ(f)


    Equation 10.9


    and regularize or constrain it using a fairness metric. The algorithm can be logistic
    regression and the regularizer can be statistical parity difference, in which
    case you have the prejudice remover.²¹ More recent fair learning algorithms are
    broader and allow for any standard risk minimization algorithm along with a broad
    set of group fairness metrics as constraints that cover the different types of
    fairness.²² A recent in-processing algorithm regularizes the objective function
    using a causal fairness term. Under strong ignorability assumptions (remember
    from Chapter 8 that these are no unmeasured confounders and overlap), the regularizer
    is an average treatment effect-like term J = E[Y | do(z = 1), X] − E[Y | do(z
    = 0), X].²³


    Once trained, the resulting models can be used on new unseen Sospital members.
    These in-processing algorithms do not require the deployment data to contain the
    protected attribute. The trick with all of them is structuring the bias mitigating
    regularization term or constraint so that the objective function can tractably
    be minimized through an optimization algorithm.


    # 10.5.3 Post-Processing


    If you''re in the situation that the Sospital care management model has already
    been trained and you cannot change it or touch the training data (for example
    if you are purchasing a pre-trained model from a vendor to include in your pipeline),
    then the only option you have is to mitigate unwanted biases using post-processing.
    You can only alter the output predictions Ŷ to meet the group fairness metrics
    you desire based on your worldview (i.e. flipping the predicted labels from receiving
    care management to not receiving care management and vice versa). If you have
    some validation data with labels, you can post-process with the “what you see
    is what you get” worldview. You can always post-process with the “we’re all equal”
    worldview, with or without validation data.


    ²¹Toshihiro Kamishima, Shotaro Akaho, Hideki Asoh, and Jun Sakuma. “Fairness-Aware
    Classifier with Prejudice Remover Regularizer.” In: Proceedings of the Joint European
    Conference on Machine Learning and Knowledge Discovery in Databases. Bristol,
    England, UK, Sep. 2012, pp. 35–50. ²²Alekh Agarwal, Alina Beygelzimer, Miroslav
    Dudík, John Langford, and Hanna Wallach. “A Reductions Approach to Fair Classification.”
    In: Proceedings of the International Conference on Machine Learning. Stockholm,
    Sweden, Jul. 2018, pp. 60–69. L. Elisa Celis, Lingxiao Huang, Vijay Keswani, and
    Nishanth K. Vishnoi. “Classification with Fairness Constraints: A Meta-Algorithm
    with Provable Guarantees.” In: Proceedings of the ACM Conference on Fairness,
    Accountability, and Transparency. Atlanta, Georgia, USA, Jan. 2019, pp. 319–328.
    Ching-Yao Chuang and Youssef Mroueh. “Fair Mixup: Fairness via Interpolation.”
    In: Proceedings of the International Conference on Learning Representations. May
    2021. ²³Pietro G. Di Stefano, James M. Hickey, and Vlasios Vasileiou. “Counterfactual
    Fairness: Removing Direct Effects Through Regularization.” arXiv:2002.10774, 2020.'
