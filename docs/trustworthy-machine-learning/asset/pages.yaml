- pgno: 37
  md: '# 3.2.1 Sample Spaces, Outcomes, Events, and Their Costs


    The first concept is the sample space, denoted as the set Ω, that contains all
    possible outcomes. ThriveGuild''s lending decisions have the sample space Ω =
    {approve, deny}. The sample space for one of the applicant features, employment
    status, is Ω = {employed, unemployed, other}.


    Toward quantification of sample spaces and safety, the cardinality or size of
    a set is the number of elements it contains, and is denoted by double bars ||·||.
    A finite set contains a natural number of elements. An example is the set {12,44,82}
    which contains three elements, so ||{12,44,82}|| = 3. An infinite set contains
    an infinite number of elements. A countably infinite set, although infinite, contains
    elements that you can start counting, by calling the first element ''one,'' the
    second element ''two,'' the third element ''three,'' and so on indefinitely without
    end. An example is the set of integers. Discrete values are from either finite
    sets or countably infinite sets. An uncountably infinite set is so dense that
    you can''t even count the elements. An example is the set of real numbers. Imagine
    counting all the real numbers between 2 and 3—you cannot ever enumerate all of
    them. Continuous values are from uncountably infinite sets.


    An event is a set of outcomes (a subset of the sample space Ω). For example, one
    event is the set of outcomes {employed, unemployed}. Another event is the set
    of outcomes {employed, other}. A set containing a single outcome is also an event.
    You can assign a cost to either an outcome or to an event. Sometimes these costs
    are obvious because they relate to some other quantitative loss or gain in units
    such as money. Other times, they are more subjective: how do you really quantify
    the cost of the loss of life? Getting these costs can be very difficult because
    it requires people and society to provide their value judgements numerically.
    Sometimes, relative costs rather than absolute costs are enough. Again, only undesirable
    outcomes or events with high enough costs are considered to be harms.


    # 3.2.2 Aleatoric Uncertainty and Probability


    Aleatoric uncertainty is quantified using a numerical assessment of the likelihood
    of occurrence of event A, known as the probability P(A). It is the ratio of the
    cardinality of the event A to the cardinality of the sample space Ω.


    $P(A) = \frac{||A||}{||\Omega||}$


    Equation 3.1


    +   The properties of the probability function are:

    +   1. $P(A) \ge 0,$

    +   2. $P(\Omega) = 1,$ and

    +   3. if $A$ and $B$ are disjoint events (they have no outcomes in common; $A
    \cap B = \emptyset$), then $P(A \cup B) = P(A) + P(B)$.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'These three properties are pretty straightforward and just formalize what we
    normally mean by probability. A probability of an event is a number between zero
    and one. The probability of one event or another event happening is the sum of
    their individual probabilities as long as the two events don’t contain any of
    the same outcomes.


    The *probability mass function* (pmf) makes life easier in describing probability
    for discrete sample spaces. It is a function \(p\) that takes outcomes \(\omega\)
    as input and gives back probabilities for those outcomes. The sum of the pmf across
    all outcomes in the sample space is one, \(\sum_{\omega\in\Omega} p(\omega)=1\),
    which is needed to satisfy the second property of probability.


    The probability of an event is the sum of the pmf values of its constituent outcomes.
    For example, if the pmf of employment status is \(p(\text{employed})=0.60\), \(p(\text{unemployed})=0.05\),
    and \(p(\text{other})=0.35\), then the probability of event {employed, other}
    is \(P(\{\text{employed, other}\})=0.60+0.35=0.95\). This way of adding pmf values
    to get an overall probability works because of the third property of probability.


    *Random variables* are a really useful concept in specifying the safety requirements
    of machine learning problems. A random variable \(X\) takes on a specific numerical
    value \(x\) when \(X\) is measured or observed; that numerical value is random.
    The set of all possible values of \(X\) is \(\mathcal{X}\). The probability function
    for the random variable \(X\) is denoted \(P_X\). Random variables can be discrete
    or continuous. They can also represent categorical outcomes by mapping the outcome
    values to a finite set of numbers, e.g. mapping {employed, unemployed, other}
    to {0, 1, 2}. The pmf of a discrete random variable is written as \(p_X(x)\).


    Pmfs don’t exactly make sense for uncountably infinite sample spaces. So the *cumulative
    distribution function* (cdf) is used instead. It is the probability that a continuous
    random variable \(X\) takes a value less than or equal to some sample point \(x\),
    i.e. \(F_X(x)=P(X\leq x)\). An alternative representation is the *probability
    density function* (pdf) \(p_X(x)=\frac{d}{dx}F_X(x)\), the derivative of the cdf
    with respect to \(x\). The value of a pdf is not a probability, but integrating
    a pdf over a set yields a probability.


    To better understand cdfs and pdfs, let’s look at one of the ThriveGuild features
    you’re going to use in your machine learning lending model: the income of the
    applicant. Income is a continuous random variable whose cdf may be, for example:


    \[F_X(x)=\begin{cases}1-e^{-0.5x}, & x\geq 0\\0, & \text{otherwise}\end{cases}\]


    Equation 3.2


    Figure 3.1 shows what this distribution looks like and how to compute probabilities
    from it. It shows that the probability that the applicant’s income is less than
    or equal to 2 (in units such as ten thousand dollars) is \(1-e^{-0.5\cdot 2}=1-e^{-1}\approx
    0.63\). Most borrowers tend to earn less than 2. The pdf is the derivative of
    the cdf.'
