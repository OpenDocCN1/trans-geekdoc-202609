  md: '# 1.4.1 Competence and Credibility


    I completed a doctorate in electrical engineering and computer science from the
    Massachusetts Institute of Technology (MIT). My dissertation included a new kind
    of supervised machine learning method and a decision-theoretic model of human
    decision making that quantitatively predicts racial bias. I have been a research
    staff member at IBM Research – Thomas J. Watson Research Center since 2010 conducting
    research on statistical signal processing, data mining, and machine learning.
    The results have been published in various reputed workshops, conferences, journals,
    and magazines including ICML, the Conference on Neural Information Processing
    Systems (NeurIPS), the International Conference on Learning Representations (ICLR),
    the ACM Conference on Knowledge Discovery and Data Mining (KDD), the AAAI/ACM
    Conference on Artificial Intelligence, Ethics and Society (AIES), the Journal
    of Machine Learning Research (JMLR), the IEEE Transactions on Signal Processing,
    the IEEE Transactions on Information Theory, and the Proceedings of the IEEE.
    I have defined a large part of the strategy for trustworthy machine learning at
    IBM Research and a large subset of my own work has been on interpretability, safety,
    fairness, transparency, value alignment, and social good in machine learning and
    artificial intelligence.


    I have developed real-world solutions that have been deployed in high-stakes applications
    of machine learning and data science during engagements with IBM business units,
    various clients of IBM, and social change organizations. I have led teams that
    developed the comprehensive open source toolkits and resources on fairness, explainability
    and uncertainty quantification named AI Fairness 360, AI Explainability 360 and
    Uncertainty Quantification 360, and transitioned some of their capabilities into
    the IBM Watson Studio product. I have spoken at various industry-oriented meetups
    and conventions such as the O’Reilly AI Conference, Open Data Science Conference,
    and IBM Think.


    I have been an adjunct faculty member at New York University (NYU) and a guest
    lecturer in courses at Cornell, Georgetown, NYU, Princeton, Rutgers, and Syracuse.
    I organized the Workshop on Human Interpretability in Machine Learning at ICML
    annually from 2016 to 2020 as well as several other workshops and symposia related
    to trustworthy machine learning. I served as a track chair for the practice and
    experience track of the 2020 ACM Conference on Fairness, Accountability and Transparency
    and was a member of the Partnership on AI’s Safety-Critical AI expert group.


    To compose this book, I am channeling all these past experiences along with the
    interactions with students, lifelong learners, and colleagues that these experiences
    have afforded. Of course, I have less depth of knowledge about the topics of some
    of the chapters than others, but have some level of both practical/applied and
    theoretical knowledge on all of them.


    # 1.4.2 Reliability and Biases


    Reliability stems from the ability to work in different contexts and conditions.
    I have only had one employer, which limits this ability. Nevertheless, by working
    at IBM Research and volunteering with DataKind (an organization that helps professional
    data scientists conduct projects with social change organizations), my applied
    data science work has engaged with a variety of for-profit corporations, social
    enterprises, and non-profit organizations on problems in human resources and workforce
    analytics, health systems and policy, clinical health care, humanitarian response,
    international development, financial inclusion, and philanthropic decision making.
