    Human Rights Framework for Artificial Intelligence Governance." Harvard University
    Carr Center Discussion Paper Series 2020-009, Jul. 2020.

    ²Matthew Hutson. "What Do You Know? The Unbearable Vicariousness of Knowledge."
    In: MIT Technology Review 123.6 (Nov./Dec. 2020), pp. 74–79.'
