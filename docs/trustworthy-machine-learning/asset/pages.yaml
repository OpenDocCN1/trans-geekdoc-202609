- pgno: 260
  md: 'closed-box system bringing it to you.³ Nonetheless, people cannot entirely
    abdicate their epistemic responsibility to try to verify either the knowledge
    itself, its source, or the system bringing it forward.


    From the very beginning of the book, the trustworthiness of machine learning systems
    has been equated to the trustworthiness of individual other people, such as coworkers,
    advisors, or decision makers. This framing has followed you throughout the journey
    of becoming familiar with trustworthy machine learning: going from competence
    and reliability to interaction and selflessness. However, when discussing the
    trustworthiness of the machine learning backing information filtering in digital
    platforms, this correspondence breaks down. To the general public, the machine
    learning is beyond the limits of their knowledge and interaction to such a degree
    that the machine learning model is not an individual person any longer, but an
    institution like a bank, post office, or judicial system. It is just there. Members
    of the public are not so much users of machine learning as they are subject to
    machine learning.⁴ And institutional trust is different from interpersonal trust.


    Public trust in institutions is not directed towards a specific aspect, component
    or interaction with the institution, but is an overarching feeling about something
    pervasive. The general public does not go in and test specific measures of the
    trustworthiness of an institution like they may with a person, i.e. assessing
    a person’s ability, fairness, communication, beneficence, etc. (or even care to
    know the results of such an assessment). Members of the public rely on the system
    itself having the mechanisms in place to ensure that it is worthy of trust. The
    people’s trust is built upon mechanisms such as governance and control described
    in Chapter 14, so these mechanisms need to be understandable and not require epistemic
    dependence. To understand governance, people need to understand and agree with
    the values that the system is working to align itself toward. Thus as you envision
    Upwave.com, you must give your utmost attention to getting the paradigm right
    and making the values understandable to anyone. Putting these two things in place
    will enable the public to make good on their epistemic responsibility. Remember
    from Chapter 15 that intervening on the paradigm is the most effective leverage
    point of a system and is why the focus of this chapter is on the paradigm rather
    than on tackling negative externalities more directly, such as methods for detecting
    hate speech.


    # 18.2 Maximizing Engagement, or Not


    So how can you get the paradigm and values right? There are many things that you
    can do, but the main one is to deprioritize engagement as the primary goal. Engagement
    or attention is often measured by a user’s time on the platform and by their number
    of clicks. Maximizing engagement can lead to the user’s becoming addicted to the
    platform.


