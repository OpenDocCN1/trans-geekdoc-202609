    # 7.3.2 Nonparametric Density Estimation


    You continue your quest to analyze different classifiers for estimating the expertise
    of JCN employees. Instead of assuming a parametric form for the likelihood functions
    like in discriminant analysis, you try to estimate the likelihood functions in
    a nonparametric fashion. The word nonparametric is a misnomer. It does not mean
    that there are no parameters in the estimated likelihood function at all; it means
    that the number of parameters is on par with the number of training data points.


    A common way of estimating a likelihood function nonparametrically is kernel density
    estimation. The idea is to place a smooth function like a Gaussian pdf centered
    on each of the training data points and take the normalized sum of those functions
    as the estimate of the likelihood function. In this case, the parameters are the
    centers of the smooth functions, so the number of parameters equals the number
    of data points. Doing this for both likelihood functions separately, taking their
    ratio, and comparing to a threshold yields a valid classifier. However, it is
    a pretty complicated classifier. You would need a lot of data to get a good kernel
    density estimate, especially when the data has a lot of feature dimensions d.


    Instead of doing the full density estimate, a simplification is to assume that
    all the feature dimensions of X are mutually independent. Under this assumption,
    the likelihood functions factor into products of one-dimensional pdfs that can
    be estimated separately with much less data. If you take the ratio of these products
    of one-dimensional pdfs (a likelihood ratio) and compare to a threshold, voilà,
    you have a naïve Bayes classifier. The name of this method contains ‘naïve’ because
    it is somewhat naïve to assume that all feature dimensions are independent—they
    never are in real life. It contains ‘Bayes’ because of plugging in to the Bayes-optimal
    likelihood ratio test. Often, this classifier does not outperform other classifiers
    in terms of accuracy, so its domain of competence is often non-existent.


    A different nonparametric method is the k-nearest neighbor classifier. The idea
    behind it is very simple. Look at the labels of the k closest training data points
    and predict whichever label is more common in those nearby points. A distance
    metric is needed to measure ‘close’ and ‘near.’ Typically, Euclidean distance
    (the normal straight-line distance) is used, but other distance metrics could
    be used'
