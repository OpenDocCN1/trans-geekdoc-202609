    # 11.2.3 Patching


    Patching, primarily intended for neural network models, mitigates the effect of
    backdoor attacks as a post-processing step. Backdoors show up as anomalous edge
    weights and node activations in neural networks. There is something statistically
    weird about them. Say that you have already trained an initial model on a poisoned
    set of Kermis job applications that has yielded a backdoor. The idea of the patching
    is similar to how you fix a tear in a pair of pants. First you ‘cut’ the problem
    out of the ‘fabric’: you prune the anomalous neural network nodes. Then you ‘sew’
    a patch over it: you fine-tune the model with some clean resumes or a set of resumes
    generated to approximate a clean distribution.


    # 11.3 Defenses Against Evasion Attacks


    Evasion attacks are logistically simpler to carry out than poisoning attacks because
    they do not require the adversary to infiltrate Kermis’ information technology
    systems. Adversaries only have to create examples that look realistic to avoid
    suspicion and submit them as regular job applications. Defending against these
    attacks can be done in two main ways: (1) denoising and (2) adversarial training.
    The first category of defenses is outside the machine learning training pipeline
    and applies at deployment. It tries to subtract off the perturbation δ from a
    deployment-time resume x + δ when it exists. (Only a small number of input resumes
    will be adversarial examples and have a δ.) This first category is known as *denoising*;
    the reason will become apparent in the next section. The second category of defenses
    occurs in the modeling pipeline and builds min-max robustness into the model itself,
    similar to training models robust to distribution shift in Chapter 9. It is known
    as *adversarial training*. There is no evasion defense category analogous to adaptation
    or bias mitigation pre-processing of training data from Chapter 9 and Chapter
    10, respectively, because evasion attacks are not founded in training data distributions.
    The defenses to evasion attacks are summarized in Figure 11.5. Let’s learn more
    about implementing these defenses in the HireRing job applicant prioritization
    system.'
