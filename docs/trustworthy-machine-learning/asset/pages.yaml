  md: 'Participatory design sessions that include diverse voices, especially those
    with lived experience of marginalization, have to be credited and compensated.
    The sessions are not enough if they turn out to be merely for show. The outcomes
    of those sessions have to be backed by power and upheld throughout the lifecycle
    of developing the opioid abuse model. Otherwise, the entire architecture falls
    apart and the need for team members with lived experience returns to all phases
    of the lifecycle.


    Leaving aside the difficult task of backing the inputs of marginalized people
    with the power they need to be given, how should you even go about bringing together
    a diverse panel? From a practical perspective, what if you are working under constraints?²⁰
    Broad advertising and solicitations from entities that vulnerable people don’t
    know may not yield many candidates. More targeted recruitment in specific social
    media groups and job listing sites may be somewhat better, but will still miss
    certain groups. Unfortunately, there are no real shortcuts. You have to develop
    relationships with institutions serving different communities and with members
    of those communities. Only then will you be able to recruit people to participate
    in the problem specification, data understanding, and evaluation phases (either
    as employees or simply as one-time panelists) and be able to do what you know
    that you should.


    # 16.3 Summary


    +   - The model produced in a machine learning lifecycle depends on characteristics
    of the team.

    +   - Teams that are socioculturally heterogeneous tend to slow down and not take
    shortcuts.

    +   - Team members with lived experience of marginalization have an epistemic
    advantage in noticing potential harms.

    +   - This epistemic advantage from lived experience is most important in the
    problem specification, data understanding, and evaluation stages of the lifecycle.
    It is less important in the data preparation, modeling, and deployment and monitoring
    stages.

    +   - A sensible architecture for the lifecycle focuses on inclusion of team members
    with lived experience of systematic harm in the three phases in which they have
    epistemic advantage.

    +   - The other three phases may be sensibly carried out by trustworthy data scientists
    and engineers, or even trustworthy auto ML algorithms, which may be empowering
    for problem owners.'
