- pgno: 263
  md: 'Messages on social media platforms and actions in the real world are closely
    intertwined.¹⁰ Hate speech, offensive speech, and messages inciting violence on
    digital platforms foment many harms in the physical world. Several recent instances
    of hateful violence, such as against the Rohingya minority in Myanmar in 2018
    and the United States Capitol Building in 2021, have been traced back to social
    media.


    # 18.2.4 Alternatives


    You''ve seen how maximizing engagement leads to negative externalities in the
    form of real-world harms. But are there proven alternatives you could use in the
    machine learning algorithm running Upwe.com''s information retrieval system instead?
    Partly because there are few incentives to work on the problem among researchers
    within ''big tech,'' and because researchers elsewhere do not have the ability
    to try out or implement any ideas that they may have, the development of alternatives
    has been few and far between.¹¹


    Nevertheless, as you develop the paradigm for Upwe.com, the following are a few
    concepts that you may include. You may want the platform to maximize the truth
    of the factual information that the user receives. You may want the platform to
    always return content from a diversity of perspectives and expose users to new
    relations with which they may form a diverse social network.¹² You may wish to
    maximize some longer-term enjoyment for the user that they themselves might not
    realize is appropriate for them at the moment; this paradigm is known as *extrapolated
    volition*. Such concepts may be pursued as pre-processing, during model training,
    or as post-processing, but they would be limited to only those that you yourself
    came up with.¹³ A participatory value alignment process that includes members
    of marginalized groups would be even better to come up with all of the concepts
    you should include in Upwe.com''s paradigm.


    Furthermore, you need to have transparency in the paradigm you adopt so that all
    members of society can understand it. Facts and factsheets (covered in Chapter
    13) are useful for presenting the lower-level test results of individual machine
    learning models, but not so much for institutional trust (except as a means for
    trained auditors to certify a system). CP-nets (covered in Chapter 14) are understandable
    representations of values, but do not reach all the way back to the value system
    or paradigm. It is unclear how to document and report the paradigm itself, and
    is a topic you should experiment with as you work on Upwe.com.'
