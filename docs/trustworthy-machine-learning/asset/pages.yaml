- pgno: 29
  md: '# 2.3 Data Understanding


    Once the problem has been identified and specified, a relevant dataset must be
    collected. In instances where the problem is to automate an existing decision-making
    process, identifying the relevant dataset is fairly straightforward. M-Udhār’s
    dataset consists of attributes and other inputs that loan officers used to make
    decisions in the past, along with their decisions. The inputs constitute the features
    and the historical decisions constitute the labels for a supervised machine learning
    task. But there may also be data that loan officers did not use that could be
    leveraged by a machine learning system. A promise of so-called ‘big data’ is the
    inclusion of large sets of attributes, many weakly correlated to the label, that
    would overwhelm a person but not a machine. For the machine learning system to
    make even better decisions than people, true outcomes rather than decisions should
    ideally be the labels, e.g. whether an applicant defaulted on their loan in the
    future rather than the approval decision.


    Machine learning can also be applied in use cases that are new processes for an
    organization and no exact historical data exists. Here, proxy data must be identified.
    For example, a health system may wish to start offering home nursing care to indisposed
    individuals proactively, but may not have data directly applicable for understanding
    this decision. Data from previous interactions of patients with the health system
    may be used as a proxy. In other cases, it may be that new data must be collected.
    In yet other cases, it may be that relevant data neither exists nor can be collected,
    and the problem must be specified differently.


    Once a dataset has been identified or collected, it is critical for the data scientist
    and data engineer to understand the semantics of the various features and their
    values by consulting the problem owner and other subject matter experts as well
    as by consulting a data dictionary (a document describing the features) if one
    exists. They should also conduct exploratory data analysis and visualization.
    This understanding can help identify problems in the data such as leakage, the
    presence of information in the features helpful in predicting the label that would
    not be available in new inputs to a deployed system, and various forms of bias.
    One important form of bias is social bias in which a proxy for the label does
    not well-reflect the true label of interest. For example, using past number of
    doctor visits may not be a good proxy of how sick an individual is if there are
    socioeconomic reasons why some people visit the doctor more than others at the
    same level of ill health. A similar social bias stems from prejudice: labels from
    historical human decisions contain systematic differences across groups. Other
    important biases include population bias: the dataset underrepresents certain
    inputs and overrepresents others, and temporal bias: issues stemming from the
    timing of data collection.


    The data understanding stage also requires the development team to consider data
    usage issues. Just because features are available (and may even improve the performance
    of a model), that does not mean that they can and should be used. Use of certain
    features may be prohibited by law, be unethical, or may not have appropriate consent
    in place. For example, m-Udhār Solar may have the surname of the applicant available,
    which indicates the applicant’s caste and religion and may even help a model achieve
    better performance, but it is unethical to use. The use of other features may
    pose privacy risks. A more detailed treatment of data-related issues is presented
    in Part 2 of the book.'
