    HireRing has just been selected by a large (fictional) retail chain based in the
    midwestern United States named Kermis to build them a resume and job application
    screening model. This is your first chance to work with a real client on the problem
    specification phase for adversarial robustness and not take any shortcuts. To
    start, you need to work through the different types of malicious attacks and decide
