    # 5.2.2    *Data Mining and Differential Privacy*


    The other branch of anonymization is differential privacy and applies to use cases
    involving querying a dataset, not simply releasing it. The setup is that an organization
    has a dataset and knows exactly what query it will be dealing with. Some example
    queries are to return the count of a certain value in the dataset or the average
    value of a column in the dataset. A query could even be as complicated as returning
    a machine learning classifier trained on the dataset. Some queries are easier
    and some queries are harder to anonymize. In the differential privacy setup, the
    organization has to maintain control over the dataset and all queries to it. This
    is in contrast to syntactic anonymity where once the dataset has been anonymized,
    it is footloose and free. The basic method of differential privacy is adding noise
    to sensitive attributes.


    Getting down into a little more detail, let’s say that TraceBridge has a dataset
    $W_1$ of all employees positive for the viral disease. Another employee is detected
    to be positive and is added to the dataset giving us a new dataset $W_2$ that
    only differs from $W_1$ by the addition of one row. Let’s say that the query function
    $y(W)$ is the number of employees who have cancer, which is important for better
    understanding the relationship between cancer and the viral disease.¹¹ Cancer
    diagnosis status is considered sensitive. Instead of actually returning $y(W)$,
    a differentially-private system gives back a noisy version of $y(W)$ by adding
    a random value to it. The value it returns is $\tilde{Y}(W)=y(W)+\text{noise}$.
    $\tilde{Y}$ is a random function which we can think of as a random variable that
    takes sample value $\tilde{y}$. The goal of differential privacy is expressed
    by the following bound involving the probabilities of queries from the original
    and new datasets:


    $P(\tilde{Y}(W_1)=\tilde{y}) \leq e^\epsilon P(\tilde{Y}(W_2)=\tilde{y})$, for
    all $\tilde{y}$.


    Equation 5.1


    The $\epsilon$ is a tiny positive parameter saying how much privacy we want. The
    value of $e^\epsilon$ becomes closer and closer to one as $\epsilon$ gets closer
    and closer to zero. When $\epsilon$ is zero, the two probabilities are required
    to be equal and thus the two datasets have to be indistinguishable, which is exactly
    the sense of anonymity that differential-privacy is aiming for.¹² You can’t tell
    the difference in the query result when you add the new person in, so you can’t
    figure out their sensitive attribute any more than what you could have figured
    out in general from the dataset.


    ¹¹https://rebootrx.org/covid-cancer


    ¹² We should really write $P(\tilde{Y}(W_1) \in S) \leq e^\epsilon P(\tilde{Y}(W_2)
    \in S)$ for some interval or other set $S$ because if $\tilde{Y}$ is a continuous
    random variable, then its probability of taking any specific value is always zero.
    It only has a specific probability when defined over a set.'
