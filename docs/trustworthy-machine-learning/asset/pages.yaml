- pgno: 227
  md: 'preferences.19 Other methods for aggregating individual preferences into collective
    preferences are also based on voting.20


    Voting methods typically aim to choose the value that is preferred by the majority
    in every pairwise comparison with other possible values (this majority-preferred
    set of values is known as the *Condorcet winner*). However, it is not clear if
    such majoritarianism is really what you want when combining the preferences of
    the various stakeholders. Minority voices may raise important points that shouldn’t
    be drowned out by the majority, which is apt to happen in independent individual
    elicitation followed by a voting-based preference fusion. The degree of participation
    by members of minoritized groups should not be so weak as to be meaningless or
    even worse: extractive (the idea of extraction conceived in postcolonialism is
    covered in Chapter 15).21 This shortcoming of voting systems suggests that an
    alternative process be pursued that does not reproduce existing power dynamics.
    *Participatory design*—various stakeholders, data scientists and engineers working
    together in facilitated sessions to collectively come up with single CP-nets and
    pairwise comparisons—is a suggested remedy, but may in fact also reproduce existing
    power dynamics if not conducted well. So in your role at Alma Meadow, don’t skimp
    on well-trained facilitators for participatory design sessions.


    # 14.4 Governance


    You’ve come to an agreement with the stakeholders on the values that should be
    expressed in Alma Meadow’s application screening system. You’ve specified them
    as feasible ranges of quantitative metrics that the machine learning system can
    incorporate. Now how do you ensure that those desired values are realized by the
    deployed machine learning model? Through *control* or *governance*.22 Viewing
    the lifecycle as a control system, illustrated in Figure 14.5, the values coming
    out of value alignment are the reference input, the data scientists are the controllers
    that try to do all they can so the machine learning system meets the desired values,
    and model facts (described in Chapter 13 as part of transparency) are the measured
    output of testing that indicate whether the values are met. Any difference between
    the facts and the values is a signal of misalignment to the data scientists; they
    must do a better job in modeling. In this way, the governance of machine learning
    systems requires both the elicitation of the system’s desired behavior (value
    alignment) and the reporting of facts that measure those behaviors (transparency).'
