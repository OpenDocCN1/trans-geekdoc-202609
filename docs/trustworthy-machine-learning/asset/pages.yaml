  md: '# 13.3.2 Communicating Uncertainty


    It is critical that you not only present the test result facts in a meaningful
    way, but also present the uncertainty around those test results to ensure that
    employees receiving and not receiving retention incentives, their managers, other
    JCN Corporation stakeholders and external regulators have full transparency about
    the proactive retention system.28 Van der Bles et al. give nine levels of communicating
    uncertainty:29


    +   1. explicit denial that uncertainty exists,

    +   2. no mention of uncertainty,

    +   3. informally mentioning the existence of uncertainty,

    +   4. a list of possibilities or scenarios,

    +   5. a qualifying verbal statement,

    +   6. a predefined categorization of uncertainty,

    +   7. a rounded number, range or an order-of-magnitude assessment,

    +   8. a summary of a distribution, and

    +   9. a full explicit probability distribution.


    You should not consider the first five of these options.


    Similar to the green/yellow/red categories described above for test values, *predefined
    categorizations* of uncertainty, such as ‘extremely uncertain,’ ‘uncertain,’ ‘certain,’
    and ‘extremely certain’ may be useful for less technical consumers. In contrast
    to green/yellow/red, categories of uncertainty need not be elicited during value
    alignment because they are more universal concepts that are not related to the
    actual metrics or use case. *Ranges* express the possibility function (presented
    in Chapter 3), and can also be useful presentations for less technical consumers.


    The last two options are more appropriate for in-depth communication of uncertainty
    to consumers. *Summaries of probability distributions*, like the standard deviations
    given in Table 13.2, can also be shown in bar graphs using *error bars*. *Box-and-whisker
    plots* are like bar graphs, but show not only the standard deviation, but also
    outliers, quantiles and other summaries of uncertainty through a combination of
    marks, lines, and shaded areas. *Violin plots* are also like bar graphs, but show
    the *full explicit probability distribution* through their shape; the shape of
    the bar follows the pdf of the metric turned on its side. Examples of each are
    shown in Figure 13.7, Figure 13.8, and Figure 13.9. Parallel coordinate plots
    and radar charts can also contain error bars or shading to indicate summaries
    of probability distributions, but may be difficult to interpret when showing more
    than two or three models.'
