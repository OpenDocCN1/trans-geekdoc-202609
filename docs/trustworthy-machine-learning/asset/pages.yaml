- pgno: 131
  md: 'These graphs illustrate a nuanced point. When you have prior probability shift,
    the label causes the feature and when you have covariate shift, the features cause
    the label. This is weird to think about, so let''s slow down and work through
    this concept. In the first case, Y → X, the label is known as an *intrinsic* label
    and the machine learning problem is known as *anticausal learning*. A prototypical
    example is a disease with a known pathogen like malaria that causes specific symptoms
    like chills, fatigue, and fever. The label of a patient having a disease is intrinsic
    because it is a basic property of the infected patient, which then causes the
    observed features. In the second case, X → Y, the label is known as an *extrinsic*
    label and the machine learning problem is known as *causal learning*. A prototypical
    example of this case is a syndrome, a collection of symptoms such as Asperger''s
    that isn''t tied to a pathogen. The label is just a label to describe the symptoms
    like compulsive behavior and poor coordination; it doesn''t cause the symptoms.
    The two different versions of concept drift correspond to anticausal and causal
    learning, respectively. Normally, in the practice of doing supervised machine
    learning, the distinction between anticausal and causal learning is just a curiosity,
    but it becomes important when figuring out what to do to mitigate the effect of
    distribution shift. It is not obvious which situation you''re in with the Phulo
    model, and you''ll have to really think about it.


    # 9.2.2 Detecting Distribution Shift


    Given that your training data is from East and Central African countries and your
    deployment data will come from India, you are aware that distribution shift probably
    exists in your modeling task. But how do you definitively detect it? There are
    two main ways:


    +   1. *data distribution-based shift detection*, and

    +   2. *classifier performance-based shift detection*,


    that are applicable at two different points of the machine learning modeling pipeline,
    show in Figure 9.5.⁷ Data distribution-based shift detection is done on the training
    data before the model training. Classifier performance-based shift detection is
    done afterwards on the model. Data distribution-based shift detection, as its
    name implies, directly compares p_{X,Y}^{(train)}(x,y) and p_{X,Y}^{(deploy)}(x,y)
    to see if they are similar or different. A common way is to compute their K-L
    divergence, which was introduced in Chapter 3. If it is too high, then there is
    distribution shift. Classifier performance-based shift detection examines the
    Bayes risk, accuracy, F₁-score, or other model performance measure. If it is much
    poorer than the performance during cross-validation, there is distribution shift.


    That is all well and good, but did you notice something about the two methods
    of distribution shift detection that make them unusable for your Phulo development
    task? They require the deployed distribution: both its features and labels. But
    you don''t have it! If you did, you would have used it to train the Phulo model.
    Shift detection methods are really meant for monitoring scenarios in which you
    keep getting data points to classify over time and you keep getting ground truth
    labels soon thereafter.'
