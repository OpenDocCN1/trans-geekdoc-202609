  md: 'Your job as the model validator is to test out and compare the models to ensure
    at least one of them is safe and trustworthy before it is deployed. You also need
    to obtain buy-in from various parties before you can sign your name and approve
    the model’s deployment. To win the support of internal JCN Corporation executives
    and compliance officers, external regulators,¹ and members of a panel of diverse
    employees and managers within the company you’ll assemble, you need to provide
    transparency by communicating not only the results of independent tests you conduct,
    but also what happened in the earlier phases of the lifecycle. (Transparent reporting
    to the general public is also something you should consider once the model is
    deployed.) Such transparency goes beyond model interpretability and explainability
    because it is focused on model performance metrics and their uncertainty characterizations,
    various pieces of information about the training data, and the suggested uses
    and possible misuses of the model.² All of these pieces of information are known
    as facts.


    Not all of the various consumers of your transparent reporting are looking for
    the same facts or the same level of detail. Modeling tasks besides predicting
    voluntary attrition may require different facts. Transparency has no one-size-fits-all
    solution. Therefore, you should first run a small design exercise to understand
    which facts and details are relevant for the proactive retention use case and
    for each consumer, and the presentation style preferred by each consumer.³ (Such
    an exercise is related to value alignment, which is elaborated upon in Chapter
    14.) The artifact that ultimately presents a collection of facts to a consumer
    is known as a factsheet. After the design exercise, you can be off to the races
    with creating, collecting, and communicating information about the lifecycle.


