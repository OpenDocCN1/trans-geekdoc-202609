  md: '# 13.3.1  *Visualizing Test Results*


    Although tables of numbers such as Table 13.2 are complete and effective ways
    of conveying test results with uncertainty, there are some other options to consider.
    First, there are nascent efforts to use methods from explainability like contrastive
    explanations and influence functions to help consumers understand why a model
    has a given fairness metric or uncertainty level.²⁵ More importantly, visualization
    is a common approach.


    The various trust dimension metrics you have tested are often presented as *bar
    graphs*. The trust metrics of multiple models can be compared with adjacent bars
    as in Figure 13.3. However, it is not clear whether this visualization is more
    effective than simply presenting a table like Table 13.1. Specifically, since
    model comparisons are to be done across dimensions that are on different scales,
    one dimension with a large dynamic range can warp the consumer’s perception. Also,
    if some metrics have better values when they are larger (e.g. accuracy) and other
    metrics have better values when they are smaller (e.g. statistical parity difference),
    the consumer can get confused when making comparisons. Moreover, it is difficult
    to see what is going on when there are several models (several bars).


