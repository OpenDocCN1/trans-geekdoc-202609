  md: '# ## 10.1 The Different Definitions of Fairness


    The topic of this chapter, algorithmic fairness, is the most contested topic in
    the book because it is intertwined with social justice and cannot be reduced to
    technical-only conceptions. Because of this broader conception of fairness, it
    may seem odd to you that this chapter is in a part of the book that also contains
    technical robustness. The reason for including it this way is due to the technical
    similarities with robustness which you, as a data scientist, can make use of and
    which are rarely recognized in other literature. This choice was not made to minimize
    the social importance of algorithmic fairness.


    Fairness and justice are almost synonymous, and are political. There are several
    kinds of justice, including (1) *distributive justice*, (2) *procedural justice*,
    (3) *restorative justice*, and (4) *retributive justice*.


    +   - Distributive justice is equality in what people receive—the outcomes.

    +   - Procedural justice is sameness in the way it is decided what people receive.

    +   - Restorative justice repairs a harm.

    +   - Retributive justice seeks to punish wrongdoers.


    All of the different forms of justice have important roles in society and sociotechnical
    systems. In the problem specification phase of a model that determines who receives
    Sospital’s care management and who doesn’t, you need to focus on distributive
    justice. This focus on distributive justice is generally true in designing machine
    learning systems because machine learning itself is focused on outcomes. The other
    kinds of justice are important in setting the context in which machine learning
    is and is not used. They are essential in promoting accountability and *holistically*
    tamping down racism, sexism, classism, ageism, ableism, and other unwanted discriminatory
    behaviors.


    > > “Don’t conflate CS/AI/tech ethics and social justice issues. They’re definitely
    related, but not interchangeable.”

    > >

    > > —Brandeis Marshall, computer scientist at Spelman College


    # ### Why would different individuals and groups receive an unequal allocation
    of care management?


    Since it is a limited resource, not everyone can receive it.¹ The more chronically
    ill that patients are, the more likely they should be to receive care management.
    This sort of discrimination is generally acceptable, and is the sort of task machine
    learning systems are suited for. It becomes unacceptable and unfair when the allocation
    gives a *systematic advantage* to certain *privileged* groups and individuals
    and a systematic disadvantage to certain *unprivileged* groups and individuals.
    Privileged groups and individuals are defined to be those who have historically
    been more likely to receive the *favorable label* in a machine learning binary
    classification task. Receiving care management is a favorable label because patients
    are given extra services to keep them healthy. Other favorable labels include
    being hired, not being fired, being approved for a loan, not being arrested, and
    being granted bail. Privilege is a result of power imbalances, and the same groups
    may not be privileged in all contexts, even within the same society. In some narrow
    societal contexts, it may even be the elite who are without power.'
