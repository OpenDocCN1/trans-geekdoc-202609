  md: '# 5.2.1 Data Publishing and Syntactic Anonymity


    The simplest form of syntactic anonymity is k-anonymity.⁷ By means of suppressing
    values of quasi-identifiers (replacing the value with a null value) or generalizing
    their values (for example replacing 5-digit zip codes with only their first three
    digits), the idea of k-anonymity is to create groups of records of cardinality
    at least k that have exactly the same modified quasi-identifier values. All the
    records within a group or cluster become equivalent and cannot be distinguished.
    Randomly shuffling identifiers within a quasi-identifier group achieves the same
    effect. If there are n data points in the original dataset, then there should
    be about n/k groups in the anonymized dataset, each of approximately the same
    cardinality.


    Weaknesses of k-anonymity include susceptibility to the homogeneity attack and
    the background knowledge attack. The homogeneity attack takes advantage of many
    records within a k-member cluster having the same sensitive attributes, which
    means that even without precise re-identification, the sensitive information of
    individuals is still revealed. The background knowledge attack takes advantage
    of side information of subgroups having specific distributions of sensitive attributes
    to home in on likely sensitive attribute values of individuals. An extension of
    k-anonymity known as is l-diversity overcomes these vulnerabilities.⁸ It further
    requires each k-member group to have at least l distinct values of sensitive attributes.


    A further enhancement of k-anonymity and l-diversity is t-closeness.⁹ Starting
    with the basic definition of k-anonymity, t-closeness further requires that the
    suitably-defined distance between the sensitive attribute probability distribution
    of each k-member group and the global sensitive attribute probability distribution
    of all records in the dataset is less than or equal to t. Simply put, all the
    groups should be similar in their distribution of sensitive attributes. Finding
    a t-closeness transformation of a given dataset is computationally difficult.


    The re-identification risks of k-anonymity, l-diversity, and t-closeness have
    interpretations in terms of mutual information, which was introduced in Chapter
    3. If X is the random variable for quasi-identifiers in the original dataset,
    X̃ is the random variable for quasi-identifiers in the anonymized dataset, and
    W is the random variable for sensitive attributes, then we have the following
    quantitative problem specifications:


    +   - I(X; X̃) ≤ log n/k (k-anonymity),

    +   - I(W; X̃) ≤ H(W) − log l (l-diversity), and

    +   - I(W; X̃) ≤ t (t-closeness).¹⁰


    Through k-anonymity, the reidentification risk is reduced down from that of the
    full dataset to the number of clusters. With l-diversity or t-closeness added
    on top of k-anonymity, the predictability of the'
