    and sets of pairwise comparisons. But then what? How do you technically combine
    the individual preferences expressed by the different folks? Voting of some kind,
    also known as computational social choice, is a natural answer. Extensions of
    both CP-nets and the analytic hierarchy process use voting-like mechanisms to
    fuse together several individual'
