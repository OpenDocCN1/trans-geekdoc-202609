- pgno: 33
  md: '# # 2


    # ## Radar Fundamentals and Their Early Development


    # ### 2.1 Introduction


    Radio Detection And Ranging (RADAR) was invented for military operations to detect
    an object’s position and speed from a long distance. Today, there are many types
    of radar for civilian applications. For example, weather radar monitors weather
    condition using electromagnetic waves reflected from clouds. In airports, air
    traffic control radars are used to detect airplanes in the sky for air traffic
    monitoring/control. Police use radar speed guns to check drivers’ speed. Although
    people might not necessarily like radar speed guns, they keep driving safe to
    some extent. There are also numerous specially designed radars for different applications
    such as ground-penetrating radar for mapping underground features like tree root
    systems, etc.


    Electronic warfare was conceived as a countermeasure to radar for military use.
