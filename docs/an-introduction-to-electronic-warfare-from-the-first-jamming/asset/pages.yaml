    # ## 6.6 Missile Guidance Systems


    There are two common missile guidance systems: radio frequency and infrared. The
    radio frequency guidance systems can be further divided into two types: one with
    radio guidance signals originating from the missile itself (referred to active
    homing) and one with radio guidance signals originating from a radar (referred
    to as semi-active homing). To jam either active homing or semi-active homing missiles,
    the guidance signal must be known. If one does not know the missile''s guidance
    signal, one can be surprised in the battlefield and suffer a great loss, as shown
    by the example of the Yom Kippur War described in Section 5.14 in which the Israeli
    Air Force lost one hundred aircraft in a week due to a new missile, SA-6, which
    was unknown to them at that time. Once the guidance signal is known, the loss
    can be significantly reduced, as demonstrated by the example of the 1982 Lebanon
    War also covered in Section 5.14.


    Another popular missile guidance approach is through infrared sensors. The missile
    is designed to follow the heat emitted from the aircraft which results in infrared
    radiation. The aircraft''s infrared radiation can be from (1) its exhaust plume,
    (2) its engine heat, and (3) the airplane''s frame (reflection of sun or heat
    generated through aerodynamic heating). The earlier IR missiles were designed
    to home in on the hot engine part (near-infrared band) and later heat seekers
    follow the engine exhaust plume (mid-infrared band). The IR guiding system is
    a type of passive homing system in which the missile does not emit signals. Home
    on jamming which uses aircraft''s jamming signal for guidance is also a type of
    passive homing system. Some of the IR missiles are designed to launch without
    any radar guidance. An operator can aim the IR SAM at an aircraft visually and
    launch the missile. One example is the US''s stinger missile, one of many man-portable
    air defense systems (MANPADS). This kind of missile guidance is also called fire-and-forget
    because all the missile needs is someone to fire it. Once the missile is launched,
    there is no guidance signal needed; so the person firing it can leave/hide and
    the missile will automatically seek and follow the target.


    The IR guidance system is a photonic system with IR detectors to detect infrared
    radiation from the target. Its operation principles are similar'
