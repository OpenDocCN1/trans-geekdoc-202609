    # 4.5 Electronic Warfare Crystal Video Receivers


    Modern electronic warfare can be considered as starting from the Vietnam War.
    The North Vietnam army obtained air defense equipment from the Soviet Union. Among
    them, the surface to air missile (SAM) SA-2 is arguably the best known. The radar
    warning receiver used against the SA-2''s radar system was AN/ALR-46, shown in
    Figure 4.4, which includes a crystal video receiver. The crystal video receiver
    can be considered the simplest receiver. A simple crystal video receiver diagram
    is given in Figure 4.5. The incoming signal received by the antenna is passed
    through a bandpass filter, the filtered microwave signal is then fed to a crystal
    detector which converts the microwave signal to a video signal, and an amplifier
    amplifies the video signal.


    Microwave frequencies can be divided into different bands based on the size of
    the waveguide used to transmit/receive signals. The bandwidths of each band can
    be very wide. The traditional band designation covers the'
