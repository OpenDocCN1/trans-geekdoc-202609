    # ### 2.19 Weapon Guidance Signal


    In a battle field, the final goal of the radar is to find hostile targets and
    destroy them. Once a radar finds a target (let us assume that it is an aircraft)
    and obtains all the information about it, such as its location and speed, missiles
    might be launched toward the target to destroy it. The missile must be guided
    toward the target because the target might not move in a predictable pattern.
    In particular, when the target discovers that a missile is approaching, it will
    maneuver to avoid the attack and the missile must chase the target. The mis-sile
    and the target aircraft have a tough game to play. There are many different ways
    the missile can be guided toward the target aircraft and they will be discussed
    in later parts of this book. One approach is to use a tracking radar, sending
    a guidance signal toward the target aircraft and the radar’s signal will be reflected
    back to guide the missile. The missile then follows the reflected'
