  img_proc: true
- pgno: 104
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_104_0.png)


    mainlobe and the measured angle is correct. Otherwise, the signal is from the
    sidelobe of the main antenna. With this design, the radar operator knows whether
    the radar is being jammed deceptively by wrong angle information.


    # 5.9 Angle Deception: Inverse Gain Jamming


    From the name, one can guess that this jamming is based on the signal strength
    measured. The intercept receiver measures the intercepted radar pulse amplitude
    and uses this one parameter to control the technique gen- erator. Of course, the
    jammer must have the correct frequency and time of arrival. In other words, the
    jammer already covers the radar pulses.


    The idea behind inverse gain jamming is that when the mainlobe of the radar antenna
    points at the target, the intercept receiver receives a strong sig- nal. When
    the antenna''s mainlobe points to somewhere else and its sidelobe points to the
    target, the intercepted radar signal has much weaker energy. To exploit this phenomenon,
    when the measured pulse amplitude is high, a weak jamming signal is sent to the
    radar. When the measured pulse amplitude is weak, a stronger jamming signal is
    sent to the radar. That is where the name inverse gain comes from. As a result,
    the inverse gain jamming can disturb the radar''s angle measurement because the
    radar then receives strong return signals over a broad range of angles. If the
    jamming signal takes over the radar, the strength of the returned signal is controlled
    by the jammer instead of the true radar returning signal.


    This jamming scheme is very effective against the conical scan radar covered in
    Section 2.13. Since the mainlobe of an antenna is relatively broad, the direction
    measured is not accurate. The conical scan radar overcomes this problem by making
    its antenna do a cone-shaped scan to put the target at the center of the scan.
    The technical approach is accomplished through'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'comparing the outputs of the antenna. When the outputs of the scanning antenna
    have about the same amplitudes through the scan, the target is at the center of
    the cone. If not, the radar can adjust the center of cone scan to locate the target.
    The inverse gain jamming disturbs this practice. As a result, the antenna cannot
    position the target at the center of the conical scan antenna.


    The design logic of the inverse gain method is that, during the conical scan,
    the radar antenna emits a signal while scanning and uses the skin return radar
    pulse’s fluctuating energy during the scan to precisely locate its target; therefore,
    the inverse gain is conceived to “equalize” this energy variation. So the corresponding
    radar’s counter-countermeasure is to have one fixed radar antenna point in one
    direction and have a separate receiving antenna performing the conical scan. This
    way, the intercept receiver cannot observe energy variations during the scan and
    inverse gain jamming will not work. This ECCM is referred to as COSRO (Conical
    Scan on Receive Only) or LORO (Lobe on Receive Only).


    # ## 5.10 Angle Deception: Cross-eye Jamming [3, 4]


    As mentioned in Section 2.14, a monopulse radar uses 4 antennas to trans-mit/receive
    signals and relies on the sum and difference of these antennas’ received signals
    to locate its target. As a result, it can locate its target with a single pulse
    and this is how this radar got its name. The advantage of the monopulse radar
    is the difficulty of jamming it. For example, inverse gain jamming described in
    the previous section actually helps the monopulse radar improve its sensitivity
    as it can use the strong jamming signal received by all the antennas to locate
    the target.


    One jamming method designed to jam monopulse radar jamming is cross-eye jamming.
    This basic concept of cross-eye jamming is to use two separated jammers at different
    locations sending jamming signals which are out of phase by 180°. In general,
    these two jammers can be installed at the tips of the wing of the aircraft since
    it is the farthest separation an aircraft can have. In the ideal case, these two
    jamming signals are received by different antennas of a monopulse radar. As they
    are out of phase, when they are added together, they cancel out each other and
    the radar sees nothing, and when one received signal subtracts another one, the
    radar sees the maximum output. Although the ideal case is very unlikely, cross-eye
    jamming can result in the output of the sum being smaller than the output of difference.
    Resultantly, the'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'radar will tune its angle away from the target and eventually lose its lock
    on the target.


    From this simple description, one can see that this operation is rather difficult
    because the phase difference of two jamming signals needs to be carefully controlled
    over a broad bandwidth. One straightforward implementation is having two jammers
    on the tip of each wing and each jammer has one receiver and one transmitter,
    as illustrated in Figure 5.8. Each jammer’s transmitter rebroadcasts the received
    radar signals from the other jammer’s receiver and one of the two jamming signals
    is delayed to create the 180° difference. However, the amount of delay depends
    on signal frequency (for a 2-GHz signal, the delay needs to be 0.25 ns and for
    a 1 GHz signal, the delay is 0.5 ns) and the jammer has no control over the radar’s
    frequency. For the cross-eye jamming to be effective, this delay (phase difference)
    needs to be accurate. This is an extremely challenging task. The original idea
    of cross-eye jamming was filed for patents in 1958 (US4117484A and US4006478A),
    but the actual deployment did not happen until the 1970s (these two patent applications
    were granted in 1978 and 1977, respectively). The complexity of this clever approach
    might be the main reason behind its delayed deployment.


    ![](img/ff55c581d8704d3a62714cacfc830da5_106_0.png)


    The cross-eye jammer implementation concept (adapted from Journal of Electronic
    Defense, April 2010, p. 50).'
