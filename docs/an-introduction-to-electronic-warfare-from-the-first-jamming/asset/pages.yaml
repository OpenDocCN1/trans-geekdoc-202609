    looking for and the LPI radar is designed in such way that the EW system might
    miss the radar signal in front of its face until it is too late.


    # ## 9.3 Overview of LPI Radar Technologies


    The main goal of LPI radar is to avoid being detected or at least detect the aircraft
    before being detected by the intercept receiver on the aircraft. To accomplish
    this goal, many approaches can be used. In this section, some of LPI radar technologies
    are introduced and two subsequent sections will focus on two specific LPI radars.


    *Minimize Antenna Sidelobe.* When a radar emits signals, the signals are intended
    to be sent through antenna’s mainlobe and the signal transmitted through the antenna’s
    sidelobe can be considered leakage. The signals emitted through the sidelobe not
    only expose the radar, but the reflected radar signal through the sidelobe, if
    detected, confuses the radar as it assumes the received signal is via the antenna’s
    mainlobe. As a result, the EW system can jam a radar by aiming the jamming signal
    at the radar antenna’s sidelobe. Therefore, an LPI radar should have a small antenna
    sidelobe and very low sidelobe gain.


    *Use Complicated Search Patterns.* A radar scans through the sky looking for its
    target following a certain pattern. Once this pattern is recognized, the corresponding
    jamming method can be designed. One example is the inverse gain jamming covered
    in Section 5.9. The more complicated the scan pattern is used, the more difficult
    it is for the EW system to deceive the radar. With the advance of phased array
    radar, which uses a matrix of stationary antennas to electronically steer the
    radar signal to a desired direction by changing the phase of each antenna’s transmitted
    signal, it is much easier to program'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'a sophisticated scan pattern. It is worthy of note that phased array radar
    can also better control its collective sidelobe.


    *Frequency Hopping.* The radar can reduce the chance of being detected by changing
    its frequency frequently even on a pulse-to-pulse basis. Such a practice can complicate
    the EW system’s effort to sort radar signals.


    *Power Management.* To reduce the chance of being intercepted, the radar signal’s
    power should not be higher than necessary. Therefore, once a target is found,
    based on the power of reflected radar signal, the radar might reduce the power
    of the transmitted signal to just enough to keep tracking the target.


    *Pulse Compression.* The techniques for LPI radar covered so far do not address
    the fundamental issues summarized in Equations (9.1)–(9.3), i.e. the intercept
    receiver can intercept a radar’s signal far away because the reflected radar signal
    travels double the distance, thus suffering higher loss when it reaches the radar.
    However, the radar possesses one huge advantage over the EW system: the radar
    knows its own signal. So, one of the key LPI radar’s design concepts is to reduce
    the transmitted signal power by spreading the signal energy over a longer time;
    thus, the radar signal’s power will be too low to alarm the intercept receiver.
    The radar can integrate the reflected signal’s power over a longer time, thus
    obtaining enough energy to detect the target. On the other hand, the intercept
    receiver will likely miss the radar signal as it does not know how long it should
    keep “listening” to detect the incoming signal and it might not have information
    about signal characteristics to retrieve the signal. If the intercept receiver
    only integrates the received signal’s energy over a short period, the resulting
    output can be too weak to be detected despite the fact that the power of the intercepted
    radar signal can be significantly higher than the power of reflected signal that
    the radar receives. Besides, simply integrating the received signal does not provide
    enough information about how to jam a radar. An analogy of this situation can
    be a spy trying to eavesdrop a conversation between two people who whisper an
    encrypted message while playing loud music. The voice volume is very low, so the
    spy might not notice the ongoing conversation and knowing there is a conversation
    alone is not enough to steal the secret.


    Of course, one immediate concern about this approach is that a long pulse can
    sacrifice distance resolution which equals the speed of light times pulse width
    of a pulse radar divided by 2 (Equation 2.3). Also, for a pulse radar, once a
    pulse is sent, the radar will be silent for some time waiting for the reflected
    signal before the next pulse is sent. For example, a radar can have 1 ms of PRI
    and 1 μs of PW. In this case, in every millisecond, the radar only'
