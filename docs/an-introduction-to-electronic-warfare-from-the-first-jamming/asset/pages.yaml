    # 10.3 Machine Learning for Predicting a Multifunction Radar''s Next Signal


    A multifunction radar can change its scan pattern and signal characteristics on
    a pulse-to-pulse basis following some predetermined rules. To correctly jam such
    a radar, the EW system needs to be able to predict the radar''s next move. To
    some degree, this task is similar to finishing an incomplete sentence or finishing
    an incomplete piece of music. Machine learning can be used for this task, but
    the neural network covered in the previous section is not a suitable approach.
    The difference between signal classification and this task is the temporal dependence
    between received signals in the latter case. The CNN treats the received signal
    as a whole for deciding its type. On the other hand, to predict multifunction
    radar''s next signal, the EW system receives signals in sequence and aims to determine
    the next signal''s type. To handle a sequence of data, a recurrent neural network
    (RNN) is more suitable than the CNN, and an RNN diagram is shown in Figure 10.7.


    As illustrated in Figure 10.7, the RNN has a feedback path. For display purposes,
    we can unfold this process in time, as shown in Figure 10.7. The RNN''s output
    is generated based on its current input, previous inputs, and previous outputs.
    One useful concept to explain this dependence is “state.” One very loose analogy
    to this structure can be the following. Treat money a person receives on a Friday
    as input, the state is their savings, and the output is the amount of money they
    will spend in the following week. The output and the next state depend on input
    and current state. In this example, state (savings) is determined by the previous
    state, input (income),


    ![](img/ff55c581d8704d3a62714cacfc830da5_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'and outputs (spending). The purpose of RNN is to predict the output based on
    current input and state.


    So how can an RNN be trained? Just like CNN, the RNN model consisting of layers
    of neurons whose structure is set by the programmer and training data is used
    to determine these coefficients. With training data consisting of input and desired
    output, the input sequence is fed into the RNN which generates an output sequence.
    The RNN coefficients can then be modified starting from comparing the last RNN
    output (rightmost of unrolled RNN, part of which is shown in Figure 10.7) with
    desired corresponding output and moving toward the first RNN output (leftmost
    of unrolled RNN). This process is called back propagation through time.


    One issue with the RNN is that as the state keeps evolving, the RNN will “forget”
    things. Despite the state being the accumulation of all of past history, recent
    events carry more weight. On the other hand, some long-term memory can be useful
    for processing. Using the previous example again, the expense can be largely determined
    by savings and income. However, someone winning a lottery at a young age might
    have spending habits very different from someone being laid-off at a young age.
    To solve this issue, a special RNN, a long short-term memory (LSTM), can be used.
    A diagram of LSTM is depicted in Figure 10.8. The LSTM has an additional carry
    memory (CM) unit which can maintain long-term memory and shape the state. The
    LSTM output is calculated using state, carry memory, and input. This modification
    gives LSTM more flexibility.


    The RNN has been widely used in natural language processing. To some degree, if
    we consider every different signal used by a multifunction radar as a specific
    word, then a sequence of radar signals intercepted and correctly classified is
    like a sentence (different words can be assigned to different


    ![](img/ff55c581d8704d3a62714cacfc830da5_174_0.png)'
  merge: -1
