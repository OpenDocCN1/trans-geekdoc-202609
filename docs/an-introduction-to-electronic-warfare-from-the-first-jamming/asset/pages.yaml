- pgno: 82
  md: 'Therefore, although Chris and James became friends, Chris never discussed his
    job. Chris told James some of his experience in Vietnam, and most of them were
    his off-duty life stories.


    One day, James found a black box with an electric cord in the laboratory. He remembered
    the dimensions of the box as about 12"×12"×4". The box had many toggle switches
    on the surface. An old-timer told James to plug the electric cord into the wall
    socket and turn on a switch. When James did, the box produced a very short audio
    pulse. When James turned on a different switch, a different sound came out. The
    old-timer said that it was the sound of a crystal receiver when its output is
    connected to a speaker. He heard one audio output and said that it might be a
    searching radar''s signal. When a certain sound was heard, he said that if an
    electronic warfare officer heard this sound, he would wet his pants as the sound
    was the signal from a tracking radar and the threat could be imminent. James did
    not know whether what the old-timer said was true or not. However, in the Vietnam
    War, the US pilot could hear a specific tone from their earphones when a Fang
    Song radar, the missile guidance radar of SA-2, changed from "search" phase to
    "lock-on" phase and this sound is referred to as the "SAM Song" When the "SAM
    Song" is heard, missiles were on their way and the pilot needed to make an evasive
    maneuver quickly. What James heard back then might be the famous "SAM Song."


    After James obtained his security clearance and started to work on electronic
    warfare receivers, one day he thought about the black box and wanted to ask his
    electronic warfare officer officemate Chris about the box. But, James could no
    longer find the box because the laboratory was cleaned regularly. Maybe the box
    was transferred to somewhere else or discarded. The box could be old training
    equipment. At the beginning of electronic warfare in Vietnam War, the threats
    were limited; so humans might have some role to play in processing the signals
    to identify threat radar, and the box James played with was perhaps a vantage
    piece of equipment from that era.


    # 4.10 Goals of an Electronic Warfare Processor


    Joseph Caschera was an engineer at US AFRL. James Tsui met Joe on his first day
    working at AFRL and they became close friends. Joe was a very quiet and excellent
    engineer, then working on electronic warfare processor. They went to lunch once
    a week until James retired in 2004 (Joe retired in 1998). They still kept contact
    even after James moved to Las Vegas and Joe provided much information about the
    electronic warfare processor covered in the following sections.'
