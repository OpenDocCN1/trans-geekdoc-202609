    # ### 4.7 Channelized Receivers


    The idea of the channelized receiver is rather straightforward. Since a super-
    het receiver with high sensitivity can only cover a narrow bandwidth, building
    many superhet receivers, each of which covering a small portion of radar signal
    spectrum (channel), thus covering the whole radar signal band, sounds very reasonable.
    Obviously, this receiver can be very expensive and have large volume and heavy
    weight. Does this approach solve most of the intercept receiver problems? The
    answer is yes and no. This complicated approach creates numerous technical issues
    and they are difficult to solve. For example, the Defensive Avionics System ALQ-161A
    installed in the US B-1B used the channelized receiver [1]. This program was not
    very successful, mainly due to the receiver and electronic warfare processor problems.
    The original contract of ALQ-161A is 2.5 billion US dollars (in 1982 values),
    and “it was the largest electronic warfare contract ever signed.” Nevertheless,
    this project experienced many technical difficulties. As a result, the system
