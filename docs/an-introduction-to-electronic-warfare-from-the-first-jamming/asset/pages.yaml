- pgno: 154
  md: 'Suppose that the radar transmits a pulse every 600 ns (PRI = 600 ns). The top
    and middle plots of Figure 9.1 illustrate the transmitted and received signals
    in a window of 600 ns. The radar definitely knows its transmitted signal, so it
    can calculate the cross-correlation between the transmitted and reflected signal
    to see if there is indeed a reflected signal. The way to calculate cross-correlation
    is to first multiply the transmitted and received signal point by point and then
    sum the product to get one point of cross-correlation. Then, shift the received
    signal by one sample (in this example, we assume one data point is measured every
    nanosecond) and repeat the multiplication–summation process to get the next point.
    Using Figure 9.1 as an example, the transmitted signal remains stationary in this
    process and the received signal is moving toward either right or left (right is
    the positive direction indicated by an arrow in the figure and left is the negative
    direction). The first point of cross-correlation is calculated when the first
    point of the top plot overlaps with the last point of the middle plot. This process
    ends when these two plots no longer overlap. By doing so, we get the cross-correlation
    between transmitted and reflected signals shown in the bottom plot of Figure 9.1.
    As shown in Figure 9.1, the center index of this cross-correlation is zero and
    a peak at −100 ns is observed, which means the received signal looks like the
    transmitted signal delayed by 100 ns. If the radar is stationary, we can assume
    that the transmitted signal takes 50 ns to reach the target. As the speed of a
    radio wave is 299,792,458 m/sec, the target is about 15 m away. Of course, this
    target is extremely close in this demonstration example, which is not realistic.
    For a moving radar or target, the relative speed between the radar and target
    can be estimated via Doppler shift and speed needs to be taken into account when
    determining the target’s distance. If there is a target within the radar’s detection
    range, a clear peak with amplitude above detection threshold should appears in
    the cross-correlation plot.


    From the cross-correlation example described above, we can see that the magnitude
    of cross-correlation is determined by the summation of the transmitted–reflected
    signal product, and a clear peak happens when the transmitted and reflected signals
    are aligned. Therefore, to reduce the power of the transmitted signal so that
    the intercept receiver cannot notice the existence of a radar, a low-power but
    long PW radar signal can be used. As the total energy of the signal remains the
    same, radar can still detect the target using cross-correlation. Nevertheless,
    there is one issue about this approach. If the radar’s PW is long, then it is
    possible that signals reflected from two targets overlap, thus being indistinguishable.
    Therefore, special radar waveforms need to be used if we desire to transmit a
    low-power and'
