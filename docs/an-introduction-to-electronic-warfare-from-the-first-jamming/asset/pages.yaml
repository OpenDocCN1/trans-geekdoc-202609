  img_proc: true
- pgno: 103
  md: 'the jamming signal must be rather strong. The radar usually considers that
    all the signals are from the mainlobe. If the radar determines the jamming signal
    is the true skin return, it will decide that the target is in the mainlobe direction,
    which is the wrong direction. Thus, the radar may provide erroneous angle information.


    The issue of receiving signals through the antenna''s sidelobe is a general antenna
    problem not unique to radar. The intercept receiver has the same issue. One of
    the important radar parameters the intercept receiver needs to measure is the
    signal''s angle of arrival. This information is not an intrinsic radar parameter
    and the radar operator cannot control it. Thus, this becomes the most critical
    parameter measured by the intercept receiver. For an electronic warfare receiver,
    the angle information can be used for two important operations. The first one
    is radar pulse sorting. Since the radar cannot control its angle of arrival, the
    angle of arrival is the most reliable parameter for sorting radar pulses. In this
    operation, the true value of the angle of arrival is not critical as long as the
    measured values are consistent and can be used to separate radar pulses from different
    radars. The second usage of angle of arrival information is to direct the jamming
    direction. In this operation, the correct angle of arrival value is required.
    If the angle measurement is wrong, the jammer will point in the wrong direction
    to perform jamming. An intercept receiver measures the angle of arrival with its
    antenna which also has a mainlobe and sidelobes. Radar antennas are usually well
    designed to increase their directional gain so that the signals transmitted/received
    through sidelobes are much weaker than the signals transmitted/received through
    the mainlobe. On the other hand, the antenna of an intercept receiver is simple,
    light weight, and small so that it can be installed on a jet fighter. As a result,
    this antenna has relatively high sidelobes. Although no one tries to build a jammer
    to jam an intercept receiver, the receiver itself can generate erroneous angle
    of arrival information due to the shortcomings of its simple antenna design.


    One common way for a radar to eliminate the possibility of producing wrong angle
    information from antenna''s sidelobe is to use the sidelobe cancelation scheme
    illustrated in Figure 5.7. The same concept can be applied to both the radar and
    intercept receiver systems. The idea is to introduce another antenna and receiver.
    The second antenna pattern is omni-directional which means the antenna has equal
    gains from all directions. The requirement for the second antenna is that its
    gain from all directions is stronger than the sidelobe gain of the main antenna
    but weaker than the main antenna''s mainlobe gain. When the output of the main
    receiver is stronger than the second receiver''s output, it is determined that
    the signal is from main antenna''s'
