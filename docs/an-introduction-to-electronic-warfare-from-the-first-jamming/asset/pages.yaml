- pgno: 83
  md: 'An electronic warfare processor takes the outputs of the intercept receivers
    as its input and sorts them out. As mentioned in Section 4.3, the radar pulse
    density can reach one million pulses per second. If each pulse generates 128 bits
    of data, the amount of information to be processed will be massive. The received
    pulses might be from many different types of radars received at different instants.
    An important requirement for the electronic warfare processor is to identify threat
    radars in seconds. If technology developed for electronic warfare processors cannot
    meet these requirements, it will just be an academic theory.


    # 4.11 Signal Sorting


    From the information of a single pulse, it is difficult to identify the type of
    radar. It requires many pulses from the same radar to determine the radar type.
    First, the electronic warfare processors must put all the pulses emitted from
    one particular radar in a time ordered form. This process is referred to as de-interleaving.
    To accomplish this goal, the processor can compare the pulse frequencies, pulse
    width, and pulse repetition interval. These can be considered as the intrinsic
    properties of the radar. This approach assumes that the frequency and the pulse
    width of radar signals generated by the radar stays the same from pulse to pulse
    and the intervals between pulses are fixed. So, radar pulses with the same frequency
    and pulse width and received at a constant rate can be identified from the same
    radar. However, not every radar obeys this rule. Some radars can change signal
    frequency from pulse to pulse and they are referred to as frequency hopping or
    frequency agile radars. The pulse width can also vary from pulse to pulse. These
    kinds of practices can be considered as electronic counter-countermeasures (ECCM).
    Although these radars can be detected by an intercept receiver, they are difficult
    to sort out. For these radars, the angle of arrival data is the most dependable
    information. The angle of arrival is not an intrinsic characteristic of the radar;
    thus, the radar has no control over it.


    All information about one radar’s pulses such as frequency, pulse width, or angle
    of arrival need to be sorted into one group of data. From the time-of-arrival
    difference between sequential pulses, the pulse repetition interval can be found.
    The pulse repetition interval (PRI) and pulse repetition frequency (PRF) are both
    used in this book. They refer to the same radar feature and PRI=1/PRF. If the
    radar has only one PRI, the measured value should be only one value. If the radar
    pulse repetition time is staggered, this radar has several PRI. The measured value
    should then indicate so. There are also radars that'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_84_0.png)


    **Figure 4.8**  Composite signals of three pulse trains generated by three radars.
    Top three plots: individual pulse trains of three radars, bottom plot: the composite
    pulse trains. Time unit is arbitrary.


    have agile PRI, i.e. the time between sequential pulses is a random number. From
    these measurements values, frequency, pulse width, and PRI/PRF, the radar can
    be identified. Figure 4.8 shows the composite signals of three pulse trains, each
    of which has a constant but different PRI to demonstrate the difficulty of signal
    sorting. Only few radar signals with constant PRI can produce such confusing results.
    The results of many types of radars with various PRI will be extremely confusing.
    If signal de-interleaving is not done correctly, the electronic warfare processor
    will not be able to extract correct radar features for its identification. As
    mentioned previously, a wrong radar identification can lead to an ineffective
    countermeasure which might endanger the pilot''s survival.


    # **4.12 Pattern Recognition of Radar Pulses**


    When James Tsui just joined the AFRL, an old-timer told him that some experienced
    electronic warfare officers can look at the pulse shape and determine which pulse
    train they belong to. At that time, the intercept receiver cannot display any
    radio frequency signals. The only signal that can be displayed is the video signal,
    that is, what the pulse shape is referred to. He claimed that each magnetron has
    a special pulse shape and went so far as to claim that'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'from the pulse shape, the age of the magnetron can be estimated as an aged
    magnetron generates some special leading and trailing pulse edges. If this is
    true, pattern recognition will be an important technique to identify radars. Pattern
    recognition of radar pulses was always a subject interesting electronic warfare
    researchers and it is called pulse fingerprint. Nowadays, people call a similar
    idea RF fingerprint.


    Today, the pulse is collected through digitization of the radio frequency signal.
    All the detailed information is preserved. In addition, pattern recognition technology
    has advanced at an amazing speed in past few years. A smart phone can easily recognize
    a person’s fingerprint and it was said that, in China, even vendors on the street
    can make money transactions through face recognition, not to mention China’s ubiquitous
    security system built upon face recognition. In the authors’ opinion, the human
    face is much more complex than a radio frequency pulse. If a radio frequency pulse
    can be recognized by the intrinsic characteristic of RF components such as magnetron,
    antenna, etc., there will be revolutionary changes in electronic warfare. A radar
    can change frequency and PRI from pulse to pulse, and this practice makes the
    task of signal sorting more complicated than ever. However, the radar will use
    the same RF components to generate and emit signals, so this RF signature can
    be used to group radar pulses. As a result, frequency hopping and changing PRI
    will not affect the sorting process, provided that the intrinsic characteristic
    of the RF component does not change during the operation.


    The feasibility of this RF signature identification technology will also affect
    the electronic warfare receiver design. The signal parameters used by future intercept
    receiver to identify radar may be totally different from what is in use today.
    This change may even affect the counter-countermeasures. The radar operator might
    easily differentiate a jamming signal from reflected radar signals as they have
    different RF signatures.


    # 4.13 Table Looking to Identify the Type of Radar


    Once the pulse train emitted by a radar is identified, the data will be compared
    to an existing file of radars. The file of radars includes the types of a radar
    and its frequency, pulse width, and PRI. The file should include all radars which
    might be encountered in the battle. Inaccurate information about new threat radars
    can bring about a potential disaster. If good intelligence about which types of
    radar might be found in the battlefield is available, the number of radar in the
    file can be reduced. In other words, if all possible radars in the'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'battlefield can be known in advance, only these radars are needed in the file.
    With fewer radar, the searching time can be reduced. Although commercial search
    engines like Google have an enormous amount of data and the search time is extremely
    fast, the electronic warfare processor must have its own special search method
    to identify the most likely radar from a sequence of radar pulses with missing
    data and possible errors (and do not forget that it is not impossible that these
    pulses might be emitted by a radar not on the book). In the early stage of electronic
    warfare processor development, the search algorithm was one area researchers focused
    on.


    # ## 4.14 Trackers in Electronic Warfare Processor


    The electronic warfare processor should spend most of its effort on processing
    new signals. If a pulse train is identified as emitting from a threat radar, the
    radar should be jammed immediately. If the radar is not a threat radar, the radar
    can be ignored. Signals from these non-threat radars will still be intercepted
    by the receiver, but they will be ignored by the electronic warfare processor.
    Their frequency, pulse width, and angle of arrival data are stored in memory.
    If new intercepted signals belong to these categories, they will be ignored so
    that the processor can concentrate on potentially dangerous new signals.


    The processor dedicated to perform such functions is called a tracker. Once the
    data are in the tracker, these data will not be sent to the electronic warfare
    processor. Therefore, the electronic warfare processor only processes data from
    unseen radars newly received by the intercept receiver. There are usually multiple
    trackers.


    # ## 4.15 Revisit a Signal Being Jammed


    If the aircraft is jamming a certain signal, the intercept receiver cannot receive
    the same signal as the jamming signal is very strong, thus preventing this radar
    signal from being received. If the intercept receiver is a channeled receiver,
    theoretically the receiver can intercept signals whose frequency is far from the
    jamming frequency. In reality, a strong jamming signal with a short pulse width
    may still block the receiver. If a threat radar stops transmitting but the jammer
    still works against it, the jammer wastes useful jamming energy. Worst yet, transmitting
    any RF signals can be dangerous because the enemy''s missile can be guided by
    following the jamming signal; this is called homing on jamming.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'In order to avoid this situation, the intercept receiver must revisit the radar
    signal being jammed. If the radar signal disappears, the jammer should stop jamming.
    If the signal is still present, the jammer will continue to work. In order for
    the receiver to revisit the signal, the jammer must stop working momentarily.
    This operation is called looking through time of the receiver. Since threat radars
    should be jammed all the time, the looking through time needs to be very brief.
    Because the frequency of the revisited signal is known, the receiver can be tuned
    to the desired frequency directly. Therefore, the probability of detecting the
    revisited signal should be high and a short looking through time will be sufficient.
    People should not confuse the high probability of detection of a known signal
    (revisited signal in this case) with the high probability of intercept which means
    intercepting a new signal. The time of revisiting is determined by the electronic
    warfare processor.


    # # 4.16 Prediction of Pulse Arrival Time


    One of the effective jamming methods is called pulse coverage. This method is
    to send a jamming pulse signal to match one of the radar''s returning pulses.
    Since the jamming pulse is stronger than the returning signal, the radar operator
    may not recognize the signal received as a jamming signal. In order to mask the
    returned radar signal, the time of the radar pulse reaching the aircraft must
    be known. The time can only be predicated by the processor than being measured
    and the jamming signal is sent at the predicted pulse arrival time. Once the signal
    is intercepted by the receiver, it is too late to emit the jamming signal.


    The TOA of the pulse is measured by the intercept receiver''s internal clock.
    If the radar has constant pulse repetition interval, the next TOA is relatively
    easy to figure out. If the pulses are staggered, all the pulse repetition intervals
    must be figured out so that the next pulse arrival time can be predicted. If the
    radar has a random pulse repetition interval, the pulse arriving time is more
    difficult to predict.


    Once the jamming pulse covers the true skin return, many jamming techniques can
    be applied. One simple approach is to slowly change the jamming pulse''s return
    time and separate the jamming pulse and the true returning radar pulse. Since
    the radar follows the jamming pulse, this approach will provide the radar with
    erroneous distance data. More jamming techniques will be discussed in the next
    chapter.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# ### 4.17 Calculate Radar Crystal Frequency


    In all modern radars, there is a crystal oscillator used to generate a time reference.
    Radar’s signal frequency, pulse width, and the pulse repetition frequency are
    all referenced to the same crystal frequency. Civilian radars usually have stable
    frequency, constant PRF, and fixed pulse width. Some military radar can change
    one or more of the three parameters on a pulse-to-pulse basis to make it difficult
    for the intercept receiver to intercept signals and for an electronic warfare
    processor to sort radar pulses. Some examples are frequency agile radar, staggered
    pulse repetition rate radar, and random pulse repetition interval radar. However,
    none of these parameter changes are totally random. These changes are based on
    the radar’s crystal frequency. All pulse width and pulse repetition intervals
    should be a multiple of the crystal’s period (=1/frequency). Therefore, from the
    random pulse repetition interval, computer programs can be developed based on
    the agility of the measured time of arrival to obtain the frequency of the radar
    crystal. Although the random and staggered pulse repetition frequency makes the
    task of electronic warfare processor more challenging, it also provides additional
    information to the electronic warfare processor. The processor can use this additional
    information to determine the radar’s crystal frequency. Since different types
    of radar use crystals with different frequencies, the crystal frequency can provide
    supplementary information to sort radar pulses and help to identify the radar
    type. This is a very interesting situation. A radar can employ some techniques
    to decrease its probability of being detected, but, on the other hand, these tricks
    might provide an electronic warfare processor with new information to identify
    the radar.


    In order to obtain the frequency of radar’s crystal, the intercept receiver must
    have fine TOA resolution. The conventional intercept receiver has time resolution
    of about 50–100 ns (10⁻⁹ s). The time resolution should improve to 1–10 ns in
    order to estimate radar’s crystal frequency.


    # ### 4.18 Performance Evaluation of Electronic Warfare Processors


    To evaluate an intercept receiver is relatively easy. Usually, there are one-signal
    and two-signal tests. The procedure is to use one or dual signal generators to
    generate test signals and change the signal frequency, pulse width, and pulse
    amplitude. Then read the receiver’s output at every test scenario and compare
    the results with input. The approach should provide a'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'good idea about the receiver performance such as frequency error, amplitude
    error, pulse width error, probability of intercept (by counting missing pulses),
    false alarm rate (by counting extra pulses, i.e. the non-existent pulses), etc.


    Evaluation of an electronic warfare processor is a much more complicated task.
    Since the input is radar signals, an intercept receiver must be used to provide
    the digital words to the electronic warfare processor. In other words, an electronic
    warfare processor cannot be tested alone but in combination with an intercept
    receiver. As a result, if the intercept receiver performs poorly, the test results
    will be poor. Hence, the intercept receiver must have decent performance and,
    under this condition, the reasonable electronic warfare processor test can be
    conducted.


    The electronic warfare processor is designed for a complicated battle field environment
    so that a few signal generators will not produce any meaningful results. An electronic
    warfare processor can be tested with a simulator which generates a certain battle
    field signal environment. The simulated radar signals are intercepted by an intercept
    receiver and the receiver outputs are then fed into the electronic warfare processor
    under test. During the test, the processor reports the types of radar detected
    and the time used to perform the detections.


    A slightly different way to evaluate the intercept receiver and electronic warfare
    processor is to separate the test into two parts. The first step is to record
    the outputs of the intercept receiver and store the results. Since the outputs
    of the intercept receiver are digital words, they can be recorded. These data
    can be analyzed with a general purpose computer offline to evaluate the performance
    of the intercept receiver. The second step is to feed these data into the electronic
    warfare processor and evaluate the results in near real time. This approach can
    evaluate both equipment separately and predict the overall performance. If the
    overall system performance is unsatisfactory, this type of test can isolate the
    problems to be fixed.


    # ## 4.19 Summary


    This chapter discusses both intercept receivers and electronic warfare processors.
    The major difference between most commercial receivers and an intercept receiver
    is that the intercept receiver must receive many signals at the same time and
    might not know the characteristics of signals to be intercepted in advance. A
    few intercept receivers are introduced. The outputs of the intercept receivers
    are also discussed. These output data can be fed into a general purpose computer
    to evaluate the performance of the intercept receiver.'
  merge: -1
  img_proc: true
