    # 2.20 Radar Modes


    Three modes of radar considered in this book are: *search*, *acquisition*, and
    *tracking*. In the phase of search, a radar scans through the air, finding a potential
    target. Once an object is detected, in the acquisition phase, the radar scans
    vicinity of the detected object to determine the object’s location and speed.
    After this information is obtained, the radar enters the tracking mode to actively
    track the object. It is worthy of note that modern radars are capable of engaging
    with multiple targets; so a radar might perform multiple tasks such as search
    and tracking simultaneously.


