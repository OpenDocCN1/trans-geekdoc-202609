  md: 'It is assumed that an agent is in an environment with multiple states and has
    several options of actions. The agent does not need to know the rules of the game
    at the beginning. So, it might take random actions initially to determine values
    for each state and actions through many simulations (also known as episodes).
    It is usually assumed that the agent’s next state only depends on the state it
    is currently at, the action taken by the agent, and probability. This setting
    is referred to as the Markov decision process, one of which can be found in Figure
    10.9. In Figure 10.9, big circles stand for state, small circles represent actions,
    and the number next to line is the state transition probability. In this example,
    starting from state $S_{0}$, if the agent takes action $a_{0}$, it has $50\%$
    probability of remaining at $S_{0}$ and $50\%$ of chance of moving to state $S_{2}$.
    For the agent in state $S_{2}$, if it takes action $a_{1}$, there is $20\%$ chance
    that its states will go back to $S_{0}$, and when it happens, the agent will receive
    a reward of 2.


    Many simulations are needed to determine the Q-value for each combination of state
    and actions. After an accurate estimation of the Q-value is obtained, the optimal
    policy will be simply choosing an action that generates


    ![](img/ff55c581d8704d3a62714cacfc830da5_176_0.png)


    **Figure 10.9** Markov decision process.'
