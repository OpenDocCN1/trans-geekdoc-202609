  md: '# Missile Detection Schemes and Defense


    # 6.1 Introduction


    The major focus of Chapter 4 is intercepting methods for determining whether an
    aircraft is illuminated by a threat radar. If a threat radar is detected, the
    radar must be jammed at once, and Chapter 5 focuses on jamming and radars’ counter-countermeasures.
    In a modern battlefield, there are hundreds of thousands of pulses per second.
    So, there is always a chance that the threat radar is missed by the intercept
    receiver and electronic warfare processor. In addition, some missiles can be launched
    without using a radar. As a result, a missile is launched toward the aircraft
    and the pilot needs to take immediate action to save their life. In this chapter,
    we will focus on missile detection schemes and defense.


    It is worthy of notice that missiles are not the only threat to the aircraft.
    Anti-aircraft artillery (AAA) can also be a major threat. As a matter of fact,
    during the Vietnam War, the US lost more jet fighters to AAA than to surface to
    air missiles (SAM). Even in the Operation Desert Storm, the US lost 9 aircraft
    to AAA compared with 10 lost to radar-guided SAM and 13 to infrared (IR) guided
    SAM. Many AAA are controlled by a radar; so the intercepting and jamming methods
    covered in the previous two chapters can improve a pilot’s survivability against
    AAA. Nevertheless, after a shell or rocket is fired, since it is unguided, its
    motion is governed by its momentum and gravity. As a shell’s direction cannot
    be changed (but its fuze might be jammed) and the best (and probably the only)
    way to avoid a shell is to fly away from it; so there is not much to address about
    how to defend an aircraft from AAA, and this chapter will focus on how to detect
    and defeat a missile.


    By definition, the major difference between a missile and a rocket is that a missile
    is guided and a rocket is not. However, not every missile needs radar for guidance.
    For example, some heat seeking missiles like an IR SAM can be fired by an infantry
    soldier through visual guidance and the missile'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'follows the aircraft using heat radiated from the aircraft. Under this condition,
    traditional passive electronic warfare techniques for detecting radar signals
    cannot detect the missile and warn the pilot. Therefore, the radar defense system
    cannot solve all of the issues about detecting missiles. If a missile is launched
    and is on its way to the target aircraft, but the pilot and the electronic warfare
    officer of the aircraft will not aware of this urgent danger, one can imagine
    how devastating the situation will be.


    Because of the this possibility, a missile approach warning system not based on
    intercepting radar signals is needed. Two approaches to detect a flying missile
    will be presented in this chapter. The first approach is passive and the second
    approach is active.


    The passive approach is to detect the plume of the missile. When a missile is
    in flight, its engine needs to push it forward. The engine is hot and has an exhaust
    plume behind it. Theoretically, if one can detect the plume, it can detect the
    missile. Since the spectrum of the plume is in the infrared range, this missile
    approach warning system is called an IR-based missile approach warning system.
    Certainly, an IR guided missile applies the same principle to follow its target
    aircraft. The active missile approach warning system, is a simple radar used to
    detect an approaching object. Of all the threats, a missile approaching the tail
    of the aircraft is probably the most dangerous one. Therefore, this radar is looking
    backward from the tail of the aircraft to find any approaching object. For this
    reason, this radar is named the tail warning radar.


    The passive approach is relatively simple and cost effective. An IR missile approach
    warning system can be installed in many different kinds of aircraft including
    a helicopter. On the other hand, the active approach is more complicated and relatively
    more expensive. This approach might be suitable only for larger aircraft such
    as bombers.


    # **6.2 Basic Concept of Infrared Receivers**


    Infrared is the electromagnetic wave whose wavelength is between 0.7 and 1000
    \(\mu\)m ($10^{-6}$m). Its spectrum is between visible light and microwave. The
    infrared spectrum can be further divided into five ranges: near-infrared (0.75--1.4
    \(\mu\)m), short-wavelength infrared (1.4--3 \(\mu\)m), mid-wavelength infrared
    (3--8 \(\mu\)m), long-wavelength infrared (8--15 \(\mu\)m), and far-infrared (15--1000
    \(\mu\)m). The spectrum of infrared is illustrated in Figure 6.1. Based on the
    Stefan--Boltzmann law, any object with temperature ($T$) above absolute zero emits
    radiation and the total amount of radiation is proportional to $T^4$.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_117_0.png)


    **Figure 6.1** Infrared spectrum (https://sites.google.com/a/globalsystems science.org/digital-earth-watch/key-messages/near-infrared-and-the-electromagnetic-spectrum).


    As 99% of thermal radiation is in the infrared spectrum, infrared radiation from
    an object with a heat source such as a missile or an aircraft is a great signature
    used to detect these objects. It is the reason why an IR guided missile is often
    referred to as the heat seeker. The obvious infrared radiation source of a missile
    is its exhaust plume and hot engine, but a fast-moving missile can heat up its
    surrounding air; so this aerodynamic heating can also generate infrared radiation.


    The IR missile approach warning receiver is often placed on the tail of an aircraft
    to detect an approaching missile, but for a helicopter, IR missile approach warning
    receivers might be installed in its four quadrants. When a missile is launched,
    its exhaust plume is very strong. If the missile can be detected at its launching
    stage, the pilot can have maximum response time. For a missile being “cold” launched,
    which means that the missile is ejected into the air first and its engine is then
    ignited, the targeted aircraft’s response time might be shortened. After a missile
    is detected, the IR-based missile approach warning system can follow its trajectory.


    Theoretically, an IR-based missile approach warning system is a great idea and
    its working principle cannot be simpler. However, one major problem with this
    approach is other infrared radiation in the environment especially radiation from
    the sun. The sun is much hotter than most of the heat sources on Earth. Not only
    is the sun brighter, it also shines over many places. Sun rays can be reflected
    from different places toward the IR receiver'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_118_0.png)


    # Figure 6.2 Infrared radiation reaching the receiver.


    and the receiver might report approaching missiles due to this natural thermal
    radiation. In addition, infrared radiation can be absorbed in the atmosphere,
    which is weather dependent. This situation is illustrated in Figure 6.2. So, it
    is an engineering challenge to make a reliable IR-based missile approach warning
    system and the issues of IR-based missile approach warning systems will be discussed
    in the next section.


    # 6.3 False Alarm Problems and Other Issues of the IR-Based Missile Approach Warning
    System


    One of the major issues with an IR-based missile approach warning system is its
    false alarm. Unlike the infrared sensor installed in a missile which goes after
    a large object like an aircraft, the IR-based missile approach warning system
    is designed to detect a small object in a short time. Therefore, it needs to have
    a high sensitivity. On the other hand, high sensitivity brings about a high false
    alarm rate. An infrared receiver tested in the laboratory may function very satisfactorily,
    but, in reality, during flight tests, it can generate many false alarms. A long
    time ago, someone once told James Tsui about the performance of IR-based missile
    approach warning systems. He said the first thing a pilot did was to turn off
    the warning system because it generates many warning signals and the pilot did
    not know how to handle them. So, for pilots, the best approach to deal with this
    issue was to turn off the warning system. Of course, this conversation happened
    a long time ago and, with advances in technology, this statement is probably no
    longer true. Nevertheless, compared with other missile approach warning systems,
    the IR-based warning system''s high false alarm rate remains one of its major
    disadvantages.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Most people have the experience of driving toward the sun. The sunlight can
    be unbearable for some drivers. Everything in the direction of the sun is difficult
    to see clearly. In the old days of air dogfights, one of the common tactics of
    pilots was to attack from the direction of the sun. After IR air-to-air missile
    is widely deployed, how to use sun or its reflections to confuse IR missiles is
    an important maneuver to learn. Compared to the sun, the radiation from a missile’s
    exhaust plume is weak, especially when the missile is in flight. After James Tsui
    discussed with his coworker who worked on infrared receivers about infrared receiver’s
    false alarm problems, he started to pay attention to the reflection of the sun.
    When he traveled in an airplane, he always looked down to see the reflection of
    the sun from the ground and he could see all kinds of reflections, i.e. from a
    small pond, buildings, etc. Most of the time, he did not even know where reflections
    were from, but many of them were very bright.


    Up to this chapter, all of receivers discussed in this book are radio receivers.
    For people working on radio frequency intercept receivers, their major efforts
    are to improve a receiver’s performance and false alarms are not a serious problem.
    When testing radio receiver, false alarms are seldom an issue because the radar
    signals are specifically generated and they do not exist in nature.


    Although the sun generates a tremendous amount of heat and, thus, infrared radiation,
    the infrared radiation from a missile exhaust plume has special spectrum. Different
    heat sources might have different infrared radiation, as shown in Figure 6.3.
    This information can be used to distinguish between infrared radiation from a
    missile and other objects. Moreover, even different types of missiles can have
    different infrared spectra. For example, some data shows that the infrared radiation
    from a vehicle-launched surface-to-air missile is in the range of near or short-wavelength
    infrared and the infrared radiation from all surface-to-air missiles and air-to-air
    missiles can be found in the range of mid-wavelength infrared. The infrared signatures
    of missiles can be very useful to reduce the IR receiver’s false alarm rate. Some
    approaches use filters to filter out certain portions of the infrared spectrum.
    If the outputs from these optical filters match a missile’s infrared radiation
    spectrum, a missile is then detected. Some approaches check two different infrared
    sub-spectrums to find a missile. In reality, it is difficult to measure and identify
    the entire spectrum of the exhaust plume of every possible air threat. In order
    to develop IR missile approach warning systems, a huge amount of exhaust plume
    data are needed, and James Tsui’s coworker friend went on many trips collecting
    them. All of these efforts were spent to reduce'
