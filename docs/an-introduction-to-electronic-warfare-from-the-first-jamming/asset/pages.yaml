    # ## 2.14 Monopulse Radar


    This type of radar usually uses four horn antennas to transmit and receive four
    signals. In order to explain this idea, a system with two antennas is used for
    illustration. In this specific case, two antennas emit two signals. The two antennas
    point at slightly different directions. The reflected signals are summed together
    to obtain the sum channel. Their difference is also obtained as the difference
    channel. If the target is in the middle of these two beams, the sum channel will
    have the maximum output and the difference channel should have the minimum output.
    The outputs of the sum and difference channels are shown in Figure 2.12. The sum
    channel provides the coarse information about target direction and the difference
    channel provides the fine information. The output of the difference channel can
    be used to control the antenna''s direction.


    In the system of two antennas, the difference channel can only be used to adjust
    the two antennas in one direction such as in the azimuth direction. If four channels
    are used, the antennas can move in both the azimuth and elevation directions.
    Figure 2.13 shows the arrangement of four horn antennas. The channels A and C
    can be summed and B and D can be summed. Their output (A+C) and (B+D) can be considered
    as two channels to move antennas'
