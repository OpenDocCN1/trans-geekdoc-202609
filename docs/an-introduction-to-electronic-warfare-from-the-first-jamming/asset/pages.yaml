    as a heated silicon carbide block to radiate strong infrared energy and a shutter
    can be used to create a pulse pattern matching IR missile guidance system''s reticle''s
    pattern and spin speed. As the jammer''s radiation is stronger than aircraft''s
    radiation, hopefully, the missile guidance system will be confused by the jammer''s
    radiation, thus losing its target. Once the missile''s lock on the aircraft is
    broken, the missile has a slim chance of re-locking on its target. As different
    IR missiles might use different IR wavelengths, the jammer''s light source needs
    to cover a broad spectrum to engage a variety of IR missiles. The effectiveness
    of this approach depends on whether the jamming radiation''s wavelength and modulation
    pattern matches the IR missile''s operation wave-length and its reticle''s scan
    pattern. Moreover, the jammer''s radiation energy needs to be sufficiently higher
    than aircraft''s radiation energy (referred to as the jamming to signal (J/S)
    ratio) to be effective. This requirement is easier to achieve when jamming a spin-scan
    system because the IR missile looks directly at the aircraft. However, to jam
    a conical spin system, the required J/S ratio is much higher as the missile does
    not look at the aircraft directly.


