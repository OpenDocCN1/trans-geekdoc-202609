- pgno: 146
  md: 'system used two radars: a P-18 early warning radar and an SNR-125 fire control
    radar. The frequency of the P-18 is VHF (30–300 MHz). Part of the VHF spectrum
    is used for FM and TV broadcasting in the US. Serbian force found that if they
    used the lowest working frequency of the P-18, they could detect F-117s (just
    like a passive radar might detect a stealth aircraft by exploiting FM/TV signals).
    However, low frequency radar does not provide good precision and the P-18’s range
    was only 15 miles when operated in this setting. Nevertheless, it was good enough
    to provide warning if the flight route was expected.


    On March 27, 1999, the US’s electronic warfare aircraft were grounded due to weather
    conditions and Serbia was aware of this situation, thanks to its informers. Therefore,
    when F-117 flew close by on that day, Serbia’s SNR-125 fire control radar could
    make several tries without fear of being tracked and targeted. During one of the
    tries, one F-117 was preparing to drop its ordnance and opened its weapon bay.
    As discussed in Section 8.2, the stealth aircraft’s shape is carefully designed
    to reduce its radar cross section and its body is covered by RAM to absorb radar
    signals. When the weapon bay is opened, the aircraft no longer maintains its magic
    shape and its interior reflects radar signals. As a result, the SNR-125 was able
    to lock on the F-117, firing two SA-3 missiles toward it and one brought down
    the invisible F-117. The F-117 pilot, Lt. Col. Dale Zelko, was ejected and later
    rescued.


    In warfare, the element of surprise is crucial. One of the major reasons for the
    US’s F-117 and Taiwan’s U-2 being shot down (Section 3.9) is that their flight
    routes were correctly predicted. Neither of them had appropriate electronic support
    when they were shot down. Of course, a stealth aircraft is not supposed to be
    locked onto by a 1960s fire control radar under a normal circumstance; so it was
    Zelko’s bad luck for being brought down when his aircraft was in the most vulnerable
    (or least invisible) mode. Nevertheless, this embarrassing episode of US military
    action could have been avoided.


    # 8.5 Conclusion


    Stealth aircraft were developed based on an idea that if an aircraft cannot be
    detected by a radar, then it is immune to the radar’s threats. The same idea can
    also be applied to radar. If a radar can send probing signals without being detected
    by an intercept receiver, then it will not be jammed unless the jammer is willing
    to expose itself by emitting jamming signals when it does not detect a radar in
    operation. Even in this case, the jamming might not be'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'effective as the jammer has no information about radar signal''s characteristics
    such as frequency. A radar designed to not be detected is called a low probability
    of intercept (LPI) radar which will be the subject of the next chapter.


