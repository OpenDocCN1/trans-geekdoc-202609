    # 2.6 Requirement of High Frequency Source


    The concepts of wavelength and frequency of an electromagnetic wave can be explained
    as follows. Assume that the electromagnetic wave is a sinusoidal signal transmitting
    in the speed of light as shown in Figure 2.2. The wavelength is the length of
    one cycle of signal and the frequency is the number of cycles of signals passing
    a fixed point in 1 second. The relations between wavelength and frequency can
    be written as


    $$f\lambda = c \tag{2.2}$$


    where $f$ is the signal frequency (unit: Hz), $\lambda$ is the corresponding wavelength,
    and $c = 299,792,458 \text{ m/s}$ (meters per second) is the speed of light in
    a vacuum. As one can see from this equation, the higher the frequency, the shorter
    the wavelength. This can be explained intuitively as if the signal’s propagation
    speed remains the same (in this case, the speed of light); the shorter the wavelength,
    more the cycles of the signal pass a fixed point within a given time frame.


