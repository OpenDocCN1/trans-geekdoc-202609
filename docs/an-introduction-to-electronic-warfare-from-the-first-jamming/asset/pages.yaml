  md: '![](img/ff55c581d8704d3a62714cacfc830da5_168_0.png)


    Figure 10.2 Illustration of convolution.


    Convolution. To introduce CNN, the notion of convolution must be introduced first.
    For image processing, convolution can be seen as moving a small image mask, say
    a 3 pixel by 3 pixel (3 × 3) image, on top of a large image. This image mask is
    referred to as the kernel. At each position, a pixel-by-pixel multiplication between
    the kernel and overlapping portion of the big image is conducted and all the products
    (in this case, there are nine of them) are added together to generate one pixel
    of resulting image. Then, the kernel is moved to the next position to repeat the
    same operation. The number of pixels the kernel moves each time (referred to as
    a stride) determines the size of the resulting image. If the size of a stride
    is one and zeros are padded around edges of input image so that every pixel is
    used in calculating convolution, the resulting image will have the same size as
    the input image. The principle of convolution is illustrated in Figure 10.2.


    The purpose of convolution is to extract certain features of the image. If we
    look for a cross-pattern in an image, the kernel reassembling a cross shown below
    can be used for convolution.


    | 0 | 1 | 0 |

    | 1 | 1 | 1 |

    | 0 | 1 | 0 |


    When this kernel and the part of image that looks like a cross overlap, the magnitude
    of the resulting product will be large. In a CNN, at each stage, many kernels
    might be used in parallel to extract different image features. As for what kind
    of features the machine should look for, it is something'
  merge: -1
  img_proc: true
