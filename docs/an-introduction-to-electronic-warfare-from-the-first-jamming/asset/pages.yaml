    For the EW system, the phase coded radar signal presents a great challenge. Expecting
    to intercept a radar signal through detecting a sudden received signal power jump
    will not work. In principle, if the receiver knows the transmitted radar signal,
    it can apply the same cross-correlation principle to detect the signal, and the
    energy it can collect might be larger than the energy of the signal received by
    the radar. However, this is very unlikely the case.


    The title of this section is phase coded radar and there is more than one type
    of phase coded radar. In this section, we only discuss the BPSK radar signal coded
    with two types of waveforms. There are other phase coded radar signals using more
    than two waveforms. For example, the quadrature phase shifting keying (QPSK) signal
    uses four types of waveform with ($0^{\circ}$, $90^{\circ}$, $180^{\circ}$, $270^{\circ}$)
    phase shifts. One issue of the BPSK signal is its vulnerability to Doppler shift,
    which alters the phase of returned signals. In the next section, another LPI radar
    waveform, the frequency modulated continuous wave (FMCW), which is more immune
