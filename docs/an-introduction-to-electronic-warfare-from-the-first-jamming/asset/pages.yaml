  img_proc: true
- pgno: 100
  md: '# 5.6 Range and Velocity Deception: Range Gate Pull-off and Velocity Gate Pull-off


    When a pulse radar detects an object via the reflected radar signal, it will put
    a range gate around the time the skin return pulse is received and null all of
    signals received outside the window. The reason behind this practice is to reject
    unwanted noise (and a jamming signal sent out at a wrong time). Of course, this
    range gate will move along with the reflected radar signals as the time the reflected
    signal is received is determined by object’s distance. When a target aircraft’s
    EW receiver intercepts this radar signal, it needs to figure out the signal’s
    frequency, pulse width, and pulse repetition interval. Once it determines the
    radar pulse repetition interval, it can send a jamming signal with pulse width
    and frequency similar to the radar’s pulse (this task can be accomplished by sampling
    the intercepted radar signal and then duplicating it) around the time when the
    next radar pulse reaches the target aircraft. Initially, the jamming signal and
    reflected radar signal roughly overlap, but, gradually, the jamming signal is
    separated from the skin return. Usually, the jamming signal is stronger than the
    true radar returning signal, so the range gate will follow the jamming signal
    instead of the real return signal and eventually the range gate only receives
    jamming signal instead of the true reflected signal. If the jamming signal gradually
    changes its transmitting time, such as moving ahead of the radar pulse, the radar
    will indicate that the target is getting closer. If the transmitting time is moving
    after the radar pulse, the radar will show the target is getting farther away.
    This deceiving jamming technique is called range gate pull-off. This operation
    is illustrated in Figure 5.5.


    ![](img/ff55c581d8704d3a62714cacfc830da5_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'In a similar way, the frequency of the jamming signal can also change gradually.
    A small change in frequency can provide the wrong velocity information because
    the radar measures the frequency shift from the returning pulse to determine the
    Doppler frequency and the target’s speed. This method is called velocity gate
    pull-off. A radar might use a bandpass filter (velocity gate) around the frequency
    of its skin return to track the target’s speed and filter out noise. The jammer
    initially sends a strong jamming signal with the same frequency as the skin return
    radar signal’s frequency and then gradually changes the jamming signal’s frequency
    to move the radar’s velocity gate so that it filters out the actual skin return
    radar signal. After successfully moving the range gate or velocity gate of the
    radar far enough so that these gates filter out the actual skin return radar signals,
    the jammer can stop transmitting the jamming signal and the radar will then lose
    the track of its object and needs to search for it again. It is worthy of note
    that velocity gate pull-off can be applied against both pulse and CW radars.


    # **5.7 Electronic Counter-Countermeasure: Frequency Agile and Pulse Agile Radars**


    As mentioned before, an intercept receiver measures five parameters of radar pulses:
    the frequency, time of arrival, pulse width, pulse amplitude, and angle of arrival.
    The first three parameters are the intrinsic radar signal parameters which the
    radar can control. In order to increase the radar sensitivity, a radar detects
    its object based on several received skin return pulses. Civilian radars usually
    keep these three parameters constant so that it is easier to integrate received
    skin return pulses.


    On the other hand, due to anti-jamming considerations, for military radars, its
    frequency, pulse width, and time of arrival can be altered on a pulse-to-pulse
    basis. Of course, these modifications will complicate the radar design. For example,
    if a radar changes its signal frequency on a pulse-by-pulse basis, not only the
    transmitter design is difficult but the receiver design is also complicated. A
    radar transmitting signals with different frequencies is referred to as a frequency
    agile radar. Radar can also have many pulse repetition intervals (staggered PRI)
    which will create different intervals between times of arrival on the intercept
    receiver side. Radars with a staggered PRI possess PRI agility. Similar operation
    can be performed on the pulse width.'
