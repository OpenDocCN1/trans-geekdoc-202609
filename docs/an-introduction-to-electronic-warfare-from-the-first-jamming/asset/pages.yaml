- pgno: 79
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_79_0.png)


    As shown in Equation 4.1, if a device multiplies two sine waves with frequency
    of $f_1$ and $f_2$, it will generate two sine waves: one with a higher frequency
    of $f_1 + f_2$ and another one with a lower frequency (i.e. IF) of $f_1 - f_2$.
    The output term with higher frequency can be filtered out and cannot be amplified
    by an IF amplifier designed to amplify signal at the IF. The beauty of this design
    is that receivers for different bandwidth can have the same component optimized
    for the same IF as long as the mixer can down-convert different radio frequencies
    to the same IF range.


    Since amplifiers were available at the IF range. The amplifiers can be used to
    improve the receiver sensitivity by amplifying weak signals. The frequency coverage
    of the superhet receiver is in the range of hundreds of MHz. This narrow frequency
    coverage (the crystal video''s bandwidth is the range of GHz) creates three issues.
    Although the superhet receiver can still cover the whole radar spectrum by continuously
    changing the frequency of the local signal, it can only cover a relatively narrow
    spectrum at a time. As a result, the superhet receiver has a low probability of
    intercepting radar signals. The silver lining is that if a superhet receiver detects
    a signal, the frequency measurement is rather accurate. Compared with the crystal
    video receiver, the superhet receiver is more expensive as it needs extra components
    such as a local oscillator. Also, as the superhet receiver only has one channel,
    it cannot receive simultaneous signals. It is interesting to note that, despite
    its technical superiority, the superhet radio receiver was not a commercial success
    initially due to its cost and difficulty of use.


    The superhet receiver has been used in US radar warning systems such as ALR-69
    (shown in Figure 4.7) which combines crystal video and superhet receivers. Since
    the superhet receiver does not cover a wide frequency range, it could not be used
    or will take a long time to intercept signals in all possible radar signal frequencies.
    *A priori* information about radar signal was needed'
