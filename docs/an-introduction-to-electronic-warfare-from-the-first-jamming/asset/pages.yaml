  md: 'LPI radar signal. As a result, noise is not an effective jamming tool. If the
    signal characteristics can be determined, then, to jam a FMCW signal, the EW system
    can generate another FM signal with a slightly different frequency to provide
    the wrong speed information. For BPSK radar signals, a BPSK jamming signal can
    be sent to induce phase error. However, the EW system might not have this information.
    If the signal''s detailed characteristics cannot be extracted or are not available
    in the database, DRFM might be used to store the intercepted radar waveform, change
    it slightly, and send it back to deceive the radar. This kind of repeater jamming
    is more effective than noise jamming.


    # ## 9.7 Conclusion


    LPI radar is understandably a major concern of EW engineers. It is designed to
    avoid being intercepted, so the radar might detect the aircraft before the intercept
    receiver on the aircraft detects the radar. Basic LPI radar principles and two
    popular LPI radar waveforms, BPSK and FMCW, are introduced in this chapter. DRFM
    can be a useful EA tool to combat LPI radar but only after the EW system is aware
    of its existence. The next chapter will cover potential applications of machine
    learning for EW. With rapid advances in machine learning, perhaps it will be the
    EW engineers'' answer to LPI radar.


