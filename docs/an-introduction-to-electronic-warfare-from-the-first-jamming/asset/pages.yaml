    # # 5.3 Noise Jamming


    Noise jamming is a common experience in everyday life. Most of time, the noise
    is not generated intentionally. For example, when someone talks over the phone,
    if there is significant noise on the line, people usually hang up and redial or
    even ask the person on the other side to hang up and call back. Hopefully, the
    noise will go away through this practice. Background noise is one of the most
    difficult problems in communications. Under various conditions, noise is used
    to prevent the listeners from getting information. For example, if a foreign government
    does not like its people to listen to Voice of America (VOA), it can generate
    noise to interrupt broadcast in certain frequency range such that the VOA broadcasting
    is difficult to recognize.


    To use noise to jam a radar, the jammer needs to generate a noisy signal whose
    spectrum covers the radar''s operating frequency and send it toward the radar.
    If the power of noise received by the radar receiver is strong enough, the noise
    can cause the radar screen to be fuzzy and the reflected radar signal will be
    hidden below the noise. All being well, this operation will make the radar lose
    its lock on the target. Figure 5.2 shows a radar screen masked by noise jamming.


