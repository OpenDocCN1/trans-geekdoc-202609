  md: '![](img/ff55c581d8704d3a62714cacfc830da5_169_0.png)


    Figure 10.3 Popular activation functions.


    the machine needs to learn, and we will discuss this learning process in later
    paragraphs.


    Activation. After the convolution is done, a nonlinear function can be applied
    to each pixel of resulting image to introduce nonlinearity in the neural network.
    The function is called the activation function and some types of activation function
    can be found in Figure 10.3.


    Normalization (Bias). Following activation, normalization can be applied to the
    resulting image to limit the range of its pixel value. One easy way to carry out
    normalization is to divide the pixel by the average pixel values in its neighborhood.


    Downsampling (Pooling). Afterwards, the resulting images need to be downsized
    to smaller images for further processing. To accomplish this task, an image can
    be divided into many tiny sub-regions, say a 2 × 2 sub-image, and replace them
    with one pixel whose value can be the average or maximum of these four pixels.
    The layer is called pooling, and a maximum-pooling example is shown in Figure
    10.4.


    The fours layer described above, convolution, activation, normalization, and pooling,
    might be repeated many times (some layers might be skipped in some iterations),
    and this process is called feature learning. The feature learning stage generates
    numerous small images representing different features of images. After featuring
    learning all of the pixels from every image are cascaded into a one-dimensional
    array (this process is known as flattening) which is the input of neural network
    for classification.'
