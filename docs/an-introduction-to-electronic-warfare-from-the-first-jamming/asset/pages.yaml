  md: '# 11


    # Conclusion


    We have reached the end of this journey. Hopefully, you will agree with us that
    electronic warfare is an interesting technical field and the ever-evolving engagement
    between radar and EW systems demonstrates mankind’s creativity, which can be fascinating
    and frightening at the same time. Electronic warfare is a direct response to military
    radar which, thanks to rapid advances in computer processing power and solid state
    devices, has become more complicated than ever. The development of LPI radars
    might well eradicate the major advantage of EW systems over radars, as they might
    no longer be able to detect radars before being detected. The availability of
    low-cost software-defined radio types of devices and ubiquitous wireless communications
    networks make more powerful and affordable passive and netted radars possible.
    To win a war against the huge number of different adversaries in an extremely
    congested electromagnetic spectrum will be a daunting task for EW engineers. It
    probably is not a wild guess that DRFM and machine learning will play important
    roles in this fierce electromagnetic spectrum war.


    Due to the authors’ research experience, the discussion on EW in this book is
    limited to air warfare involving aircraft and missiles (i.e. air EW). Maritime
    EW and ground EW are both interesting fields on which many talented engineers
    focus. Space EW aiming to protect satellites has become an active research field
    for good reason. However, as Ludwig Wittgenstein put it, “Whereof one cannot speak,
    thereof one must be silent,” these subjects are not covered in this book due to
    our lack of knowledge in these fields.


    This book is written to introduce fundamental EW concepts along with some battle
    examples. Therefore, the use of equations is intentionally limited. For readers
    interested in EW history, late Alfred Price is a prolific author on this subject.
    Readers who want to learn more technical details about EW'
