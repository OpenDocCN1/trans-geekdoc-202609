  md: 'When the target aircraft is locked onto by a weapon radar, the attack can be
    imminent. The goal of jamming is to break the lock. When the radar breaks lock,
    it can no longer provide information on the aircraft and thus cannot attack it.
    The weapon radar must try to lock onto the target aircraft again. This operation
    is time-consuming and the radar might not relock on the target.


    The action against jamming referred to as electronic counter-countermeasures (ECCM)
    could be included in a separate chapter. However, just like many jamming schemes
    are designed against specific radars, many ECCM were developed to against certain
    jamming methods. In this book, selected jamming techniques are described along
    with their advantages and disadvantages. In the authors'' opinion, instead of
    dedicating a separate chapter to ECCM, it might be easier to introduce corresponding
    ECCM techniques when discussing the shortcomings of certain jamming techniques.
    Otherwise, if ECCM is discussed in a separate chapter, these jamming techniques
    must be addressed again in order to refresh the readers'' memory. For this reason,
    the ECCM will also be discussed in this chapter.


    One major advantage that an EW system possesses over a radar is that the jamming
    signals only travel half the distance reflected radar signals propagate through
    to reach the radar. To successfully jam or deceive a radar, it is desired to have
    a jamming signal stronger than the reflected radar signal when both of them reach
    the radar. For this reason, despite the shorter transmission, the jamming signal
    needs to be amplified appropriately. We live in a world of solid state devices
    which are used in almost every electronic device. Nevertheless, while solid state
    microwave generators are widely used in the laboratory, they usually cannot deliver
    the power required by radar. Therefore, a magnetron is still used to generate
    radar signals in many cases. In a similar situation, although solid state microwave
    amplifiers have been widely adopted for different applications, they usually still
    cannot generate enough power for the jammer. To provide high microwave power,
    traveling wave tube amplifiers (TWTs) invented in the 1940s are still in use.
    For this reason, a brief introduction to TWTs will be given in the next section.


    # 5.2 Traveling Wave Tube (TWT) [1, 2]


    A traveling wave tube (TWT) is a special vacuum tube used to amplify microwave
    signals. The first TWT related device was invented by Andrei "Andy" Haeff in 1931,
    but Rudolf Kompfner is often credited with inventing TWTs in 1942. TWTs are a
    very mature technology and their basic circuit has'
