  md: 'does not have to concentrate all of its energy in a short pulse, a CW radar
    can use a low power signal which is more difficult to intercept compared with
    the pulse radar''s signal. Although the CW radar has difficulty detecting stationary
    or slow moving objects, and it cannot determine the distance of an object, it
    is very suitable for detecting fast moving objects such as a jet fighter. It also
    finds applications in speed guns.


    # # 2.17 Moving Target Indicator


    Most of the time, radars point to the sky and any reflected signals are assumed
    to be reflected by targets. If radar is looking for low elevation targets and
    there is a high mountain in that direction, the reflection from the mountain may
    mask the true target. This unwanted reflected signal is called clutter. The clutter
    may be bigger than skin return from the true target because the mountain is much
    larger than the target. However, the mountain is stationary, so the reflection
    is at a fixed point. A delay line can be used to delay the received reflected
    signal. The amplitude and polarity of the delayed signal can be adjusted to cancel
    the returned signal reflected from stationary objects such as mountains.


    Modern radars use coherent signal which means the phases of the transmitted signal
    can be controlled and the phase of received signal can be determined by the receiver.
    In this scenario, for a fixed target, the relation between the transmitted and
    received signal phases is a constant, but, for a moving target, this phase relation
    keeps changing. Comparing the phase relation between each transmitted and reflected
    signal, the radar screen can display only moving targets. Under a noisy condition,
    this approach has a better result than the amplitude cancellation approach.


    # # 2.18 Look-down/Shoot-down Radar


    All the radars discussed in the previous sections are land- or sea-based radars
    looking toward the sky. The look-down/shoot-down radar is an airborne radar. It
    is a weapon radar and its goal is to look down toward the ground and find moving
    targets below the aircraft. Once the look-down radar identifies a moving target,
    it may then shoot at it (shoot-down), as shown in Figure 2.15. Since the radar
    is moving, even a stationary target such as a mountain becomes a moving object.
    The concept of moving target indicator described in Section 2.17 can no longer
    be applied here. Instead, the look-down radar distinguishes the moving target
    and stationary objects by comparing the different Doppler shifts of radar signals
    reflected from moving and stationary'
