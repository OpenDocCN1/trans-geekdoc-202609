  md: 'The IR conical scan system uses the same principle as the conical scan radar
    covered in Section 2.13. The working principles of a conical scan system is illustrated
    in Figure 6.8. In an IR conical scan system, the second mirror swivels about the
    missile’s roll axis and the target at the axis is always at the edge of rotating
    second mirror’s field of view. This is done by tilting the second mirror and rotating
    it. The image reflected by the second mirror passes through a fixed full spokes
    reticle and the target at the center of the conical scan is mapped to the edge
    of the reticle. As the reticle is fixed and second mirror is rotating, the target
    at the center will “circle” around the reticle center, thus creating a periodic
    voltage change like a periodic pulse with a constant pulse width at the IR receiver’s
    output. If the target is off the center, the pulse width will vary and this information
    can be used to correct the missile’s direction. One might consider the conical
    scan system as a frequency modulation system that determines the target’s location
    based on changing frequency (pulse width) and the spin-scan system as an amplitude
    modulation system that determines the target’s position based on signal’s amplitude
    and phase. As the field of view is not fixed with the target at the center but
    rotating around the target, the conical scan system covers a larger area. As a
    result, compared with a spin-scan system, a conical scan system has a smaller
    possibility of losing its target. The Soviet Union’s SA-14 IR SAM uses the conical
    spin system to solve the jamming issues SA-7 encountered.


    It is worthy of note that the IR detector does not provide range information.
    This information is not crucial as it is assumed that once the missile is adjacent
    to the target, the proximity fuze will detonate it. The reticle systems described
    in this section use only one detector. The energy of whole image is received by
    one IR detector and all tracking is based on this quantity’s change over the time
    (a one-dimensional signal). In later developments, arrays of detectors (such as
    a focal plane array) are used to generate an image (a two-dimensional signal)
    for tracking.


