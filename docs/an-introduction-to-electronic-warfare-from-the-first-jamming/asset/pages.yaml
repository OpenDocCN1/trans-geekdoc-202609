    # 2.5 Principle of Radars and the Radar Equation


    Radars are designed to detect targets and determine their distance. The basic
    concept is to send out an electromagnetic signal and detect its reflection from
    the target. Although radar intends to detect targets in all directions instantaneously,
    it is difficult to achieve this goal. The problem can be explained as follows.
    Assuming, a radar sends out a signal to all directions at the same time, the electromagnetic
    signal from this source will spread out as a sphere. The surface of a sphere can
    be calculated as $4\pi r^{2}$, where $r$ is the radius of the sphere and also
    the distance between the source and the target. As a result, the energy reaching
    the target is $1/4\pi r^{2}$ of transmitted energy times the cross-sectional area
    of the target. If $r$ is large, only a very small portion of the transmitting
    energy reaches the target. Assume that the reflection from the target (also known
    as skin return) is not directional either and it is also spread in the form of
    a sphere. The density of energy reaching the radar is then $1/4\pi r^{2}$ of the
    reflected signal’s energy. As a consequence, the total energy reflected back to
    the source is proportional to $1/(4\pi r^{2})^{2}$. This is usually a very small
    portion of the transmitted signal energy. Even if a directional antenna is used
    (i.e. the signal is not sent out in all directions), the signal power is still
    inversely proportional to $r^{4}$. The relation between radar’s transmitted signal
    power and received signal power can be expressed'
