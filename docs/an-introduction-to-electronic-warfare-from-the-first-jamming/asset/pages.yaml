    # ### 2.10 A Basic Radar System


    A radar can be considered as consisting of four major parts. A microwave power
    source generates a pulse modulated microwave signal. An antenna is used to transmit
    the signal into air. The same antenna also receives the reflected signal from
    the target. The third part is a radar receiver to receive the signal from the
    antenna (A circulator is used to pass the received signal to the receiver rather
    than the transmitter.) and convert the microwave signal into video signals. The
    last part is the display unit. Usually, a cathode ray tube is used to display
    the transmitted and received signals. The time difference between the transmitted
    and received signals can be used to calculate the distance of the target. The
    basic radar schematic diagram is shown in Figure 2.6.


    It should be emphasized that many details are omitted in this diagram. For example,
    the antenna might not be used to transmit and receive signals simultaneously.
    It might be time shared between transmitting and receiving. A transmit/receive
    switch (known as a TR switch) is used for this operation.'
