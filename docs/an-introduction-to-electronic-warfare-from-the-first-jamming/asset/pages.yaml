    # ## 6.4 Tail Warning Radar


    The tail warning radar is designed to detect missile approaching aircraft from
    behind. The requirement of the radar is relatively simple, but it has to be light
    and small. Another design challenge is that the approaching missile is usually
    small and has a very small radar cross section (RCS) which is the area reflecting
    radar signals, thus making it difficult to be detected. A missile might be long,
    but it usually has a small diameter. When a missile is flying toward the radar,
    the cross section facing the radar can be tiny, and, during the missile''s flight
    path, its head may be always facing the tail warning radar. If the missile and
    the radar are not aligned in the same line, the RCS of the missile might be larger.


    The range of the tail warning radar depends on from where a missile might be launched.
    The missile can be fired from a ground base or from an aircraft. Consequently,
    the tail warning radar should cover a relatively large angle, not only looking
    directly backward.


    One major advantage of the radar-based missile approach warning system over the
    IR-based one is that it does not generate false alarms as frequently as the IR-based
    missile approach warning system. A tail warning radar can also estimate the approaching
    missile''s speed and range. On the other hand, the tail warning radar sends out
    signal which can expose the aircraft, thus increasing the vulnerability of the
    aircraft. A tail warning radar also might not detect a missile with a small RCS
    until it is too late. In order to reduce the false alarm rate of the IR-based
    missile approach warning system, combining the tail warning radar and IR receiver
    has been considered, but it might not be a feasible option for every type of aircraft.


    # ## 6.5 Proximity Fuze and Jamming


    The first time James Tsui heard about the idea of a proximity fuze was when he
    was a college student. His professor talked about German anti-aircraft artillery
    shells and emphasized two technologies used in the shell. The first one was that
    the wall of the shell is part of a storage battery but without the electrolytic
    fluid. The electrolytic fluid is in an ampule in the shell but not'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'in the battery. When the shell is fired, the ampule is broken by the shock,
    the shell spins, the centrifugal force pushes the fluid into the battery, and
    the battery is then activated. The battery is used to power a simple radar. When
    the battery is active, the radar is tuned on. If the received signal amplitude
    is high, it means that an object is close, and the shell explodes. James Tsui
    totally forgot about why his professor talked about this subject. Although the
    concept of proximity fuze was described, the word proximity was never mentioned.
    At that time, James was wondering how expensive the shell was. Later on, he realized
    that military operations can be extremely costly.


    Actually, the proximity fuze was an active research topic among several countries
    before and during the World War II (it probably still is). The proximity fuze
    based on a radio signal was first designed by Britain engineers and shared with
    the US in the early stages of World War II (in the same trip, the British showed
    the Americans how to make a magnetron for generating radar signals). The US worked
    to perfect the fuze designs, and the clever battery activation scheme described
    in the previous paragraph is a US invention (the implementation is different though;
    the wall of shell is not part of the battery, which is a stand-alone component).
    A transmitter sends out a continuous wave signal, the same antenna is used for
    both transmission and receiving, and a receiver detects a Doppler signal generated
    by combining the reflected signal and the local oscillator''s voltage. The working
    principle is the same as the superheterodyne receivers covered in Section 4.6.
    The Doppler signal''s frequency is the Doppler shift caused by velocity difference
    between shell and target. The Doppler signal''s frequency is much lower than transmitted
    signal''s frequency and its amplitude is proportional to the reflected signal''s
    amplitude. When the target is near, the reflected signal''s magnitude increases.
    If the Doppler signal''s amplitude is above the threshold, the fuze detonates
    the shell. This fuze was named the VT fuze in which VT stands for variable time.
    A diagram of a proximity fuze is provided in Figure 6.4. Although the same principle
    can be used for bomb and other artillery, this fuze is only used in the antiaircraft
    artillery of naval ships at first because the chance of an anti-aircraft shell
    directly hitting an aircraft is scant, and, in this practice, the chance of a
    proximity fuze falling into the enemy''s hands is also limited. The VT fuze was
    not authorized for ground warfare until in 1944 and General George S. Patton was
    very impressed after seeing its use in the Battle of the Bulge. As for the fuze''s
    cost, the cost for fuze was $732 in 1942 (2020 value: $11,617) and $18 in 1945
    (2020 value: $258.68).


    The working principle of the proximity fuze of modern missiles is similar to the
    one just described, although the mechanism of powering the radar'
