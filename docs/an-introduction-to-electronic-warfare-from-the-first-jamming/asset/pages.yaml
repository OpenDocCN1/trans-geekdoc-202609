  md: '# 9


    # Low Probability of Intercept Radar


    # 9.1 Introduction


    In the field of electronic warfare, radar is designed to detect a signal, which
    it emits and then is reflected back by aircraft. So, the radar knows which signal
    to look for. On the other hand, the electronic warfare system might not have *a
    priori* knowledge about the radar signal reaching the aircraft, so it needs to
    search for signals over a broad spectrum and in every direction. However, the
    EW system’s intercept receiver detects signals from the radar and the radar is
    designed to detect signals reflected by the aircraft that make a round-trip between
    the radar and target aircraft. So, in theory, the intercept receiver can detect
    a radar signal before the radar receives the reflected signal and, if we assume
    that the intercept receiver and the radar receiver have the same sensitivity,
    the electronic warfare system can identify the existence of the radar before the
    radar finds the aircraft. Under these circumstances, the radar is in a disadvantaged
    position. As we have seen in the example of the 1982 Lebanon War and Desert Storm,
    one of the strategies to gain air superiority is to trick the enemy’s radars into
    searching for decoys and to destroy enemy radars by following radar signals.


    To compensate for this disadvantage, some radars are designed to be difficult
    to intercept and such radars are referred to as low probability of intercept (LPI)
    radar which is the topic of this chapter. Before covering the LPI radar’s approach,
    some re-examination of radar from the LPI radar’s perspective can be beneficial.


    # 9.2 Review of Radar Concepts


    Up to this point, radars considered in this book are mainly pulse radars. A pulse
    radar sends out pulses periodically. Based on when the received signal is received,
    the target can be located. The pulse width (PW) needs to be short'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'to guarantee a good distance resolution (Equation (2.3)) and the energy of
    transmitted pulse needs to be high enough to guarantee the detection of signal
    reflected back within the radar’s working range. As a result, the power of the
    pulse needs to be high as power is calculated by dividing the energy by the PW.
    Since the pulse is sent out periodically, if the reflected pulse is received after
    the next pulse is emitted, the target cannot be accurately located. Therefore,
    the pulse repetition interval determines the radar’s working range. The reflected
    signal’s frequency might be altered because of the Doppler effect and this information
    can be used to determine the target’s speed. To search for its target, a radar
    needs to keep scanning through the sky and some scanning patterns were introduced
    in Chapters 2.12–2.14. The radar’s antenna has mainlobes and sidelobes, as shown
    in Figure 2.7, and the radar’s antenna transmits and receives signals through
    both mainlobe and sidelobe although when the radar detects a signal, the radar
    assumes the signal is through the mainlobe as the antenna’s mainlobe gain is much
    higher than its sidelobe gain.


    As we keep mentioning in this book, in principle, one major advantage the EW system
    holds over radar is that the intercept receiver intercepts the signal directly
    from the radar. In Chapter 2, an equation relating the radar’s transmitted signal
    power and received signal power is given and it is restated below for reference


    $$P_{\text {rec }}=P_{t} G \frac{\sigma}{4 \pi r^{2}} \frac{\frac{G}{4 \pi}\left(\frac{c}{f}\right)^{2}}{4
    \pi r^{2}}=P_{t} G^{2} \frac{\sigma}{(4 \pi)^{3} r^{4}}\left(\frac{c}{f}\right)^{2}$$
    (9.1)


    where $P_{\text {rec }}$ is the power of the received signal, $P_{t}$ is the power
    of the transmitted signal, $\sigma$ is the target’s cross section area (i.e. the
    area that reflects radar signals, which the stealth aircraft aims to reduce),
    $G$ is the radar’s antenna gain, the term $\frac{G}{4 \pi}\left(\frac{c}{f}\right)^{2}$
    is the receive antenna’s effective area, $c$ is the speed of light, $f$ is the
    signal frequency, and $r$ is the distance between the radar and its target. For
    an intercept receiver, the relation between its intercepted signal power and transmitted
