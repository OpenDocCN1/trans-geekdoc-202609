    Artificial Neuron and Neural Network. The neural network got its name from its
    basic operation unit, the artificial neuron. An artificial neuron and neural network
    are illustrated in Figure 10.5. The operation of an artificial neuron can be divided
    into two stages. In the first stage, its inputs are multiplied by weights and
    then summed together. The value of weights is something the machine needs to learn.
    Then the sum is used as an input of an activation function and the value of the
    activation function is the artificial neuron’s output. As shown in Figure 10.5,
    the neural network’s first layer is input layer, its last layer is the output
    layer, and the remaining layers in between are called hidden layers with the artificial
    neuron as its processing unit. A neural network can have many hidden layers. The
    phrase deep neural network refers to neural networks with more than two hidden
    layers. The size of the input layer depends on the number of pixels generated
    from feature learning. The size of the output layer is determined by the number
    of signal classes. If the task of the CNN is to distinguish between three radar
    signals, say pulsed CW, one specific type of FMCW, and one specific type of PBSK,
    then the size of the output layer is 3. The number of hidden layers and number
    of artificial neurons in each hidden layer is determined by the programmer. For
    a classification problem, the output layer’s value is usually between 0 and 1.
    The softmax function defined below is a popular choice for output layer operation:


    ```

    Out_{i} = \frac{e^{z_{i}}}{\sum_{j=1}^{k} e^{z_{j}}} \tag{10.1}

    ```


    where $z_{i}$ is the output of the last layer of the artificial neuron. Based
    on Equation (10.1), the output value must be less than 1. Assume that'
