  md: '# 7


    Chaff, Flare, and Decoys


    # 7.1 Introduction


    We have gone through the fundamental radar and electronic warfare principles.
    The major purpose of jamming is to prevent a radar or a missile guidance system
    from obtaining accurate location/speed information about its target. This task
    can be accomplished by emitting radio waves (against a radar) or IR radiation
    (against an IR missile) as described in previous chapters. In this chapter, several
    countermeasures not based on electronic devices will be introduced. Instead of
    sending out radio waves or infrared light, the approaches covered in this chapter
    use physical objects to produce fake targets on the radar screen or heat sources
    to attract IR missiles. Although some of these countermeasures have a history
    just slightly shorter than radar''s, they are still in use today, and we will
    start with the oldest one, chaff.


    # 7.2 Chaff and its Countermeasures


    Among all jamming techniques, chaff is the oldest one, but it is still in use.
    In the early days, chaff was a strip of metal coil, but, nowadays, chaff is made
    of nylon or fiberglass coated with metal and a cartridge can hold an enormous
    amount of chaff. The working principle of chaff is simple. As a radar sends out
    radio waves and determines its target''s location based on the reflected signal,
    if many objects reflecting the radar signal back to the radar are dispensed at
    once, they can create a cloud of false targets on the radar screen and the radar
    operator will have a difficult time figuring out how to respond. Chaff is designed
    to reflect radar signal, thus creating such confusion. As the chaff is resonant
    at a wavelength that is twice its length (in other words, the chaff length should
    be half of its victim radar signal''s wavelength), chaff of several carefully
    chosen lengths can be dispensed together to ensure maximum frequency coverage
    and reflection. The whole'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'purpose of chaff is to create a false target image and different methods of
    dispensing chaff have been developed to fulfil this goal. For example, a large
    quantity of chaff can be dropped for a period of time by a supporting aircraft
    to create a chaff corridor to mask following aircraft. This practice is called
    stream chaff. How fast chaff should be dispensed depends on the size of the radar''s
    resolution cell (the minimum volume of space for a radar to distinguish its targets).
    Too much chaff dispensed in a small space does not help and this practice can
    be wasteful. On the other hand, too little chaff dumped within a resolution cell
    might not be enough to create reflected radar signals strong enough to be detected.
    As these chaff dispensing techniques need to be practiced, chaff''s environmental
    effects raised concerns. Some studies on this matter have been conducted and found
    no significant adverse impact on environment and human/animal health.


    Once the chaff is dispensed, it decelerates quickly so that a Doppler radar that
    can detect its target''s velocity is able to differentiate between chaff and its
    target based on their speed. In this case, the pilot might fly in a tangential
    direction to the radar beam so that the aircraft''s speed measured based on Doppler
    shift is close to zero and the chaff can offer protection.


    # **7.3 Battle Example: Bombing of Hamburg on July 24, 1943**


    On the evening of July 24, 1943, German radars facing the North Sea detected thousands
    of approaching aircraft that were able to "reproduce" themselves. German''s night
    fighters who were called to engage the incoming bombers followed the instructions
    of radar operators but could not find enemy aircraft. Later, every radar set in
    Hamburg was out of action as the whole radar screen was clouded by flickers, thus
    not being able to provide any useful guidance to anti-aircraft battery commanders.
    So, radar operators reported the malfunction of their radars. Despite German radar
    detecting thousands of fake targets, 791 British bombers did fly to raid Hamburg.
    Without an effective German air defense, British pilots completed their mission
    pretty much undisturbed and lost only 12 bombers. The loss rate of this mission
    was 1.5% and the loss rate in the previous six raids on Hamburg was 6.1%.


    What German radars detected on that night was tin-foil strips, i.e. chaff, dropped
    by the British Royal Air Force. The British code name for chaff is "window," and
    the codewords "open the window" mean dispensing chaff. The bombing of Hamburg
    on that night was the first successful usage of chaff in battle. One interesting
    fact about chaff is that its basic concept is so simple that both British and
    German scientists thought about it before 1943 (a British'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'cartoonist, Jack Monk, came up with the idea of Nazi’s using metal-framed box-kites
    to confuse British radar and published a cartoon strip on this idea in the Daily
    Mirror, thus causing serious concern among British officials involved with the
    “window” project). The German code name for chaff is Düpel. After learning of
    the jamming effects of Düpel, Hermann Göring ordered its development to stop immediately
    and destroyed related research documents, fearing such a simple technology would
    fall into the enemy’s hands. The British government also hesitated to introduce
    “window” for the same reason and the final approval of using chaff was given by
    Winston Churchill who refused to discuss this matter in the war cabinet as it
    was too technical.


    After a while, German radar operators developed techniques for distinguishing
    between chaff and real targets, including using speed to separate them and changing
    radar frequencies if chaff was present. German also used Düpel in their retaliation.


    # ## 7.4 Flare and its Countermeasures


    The Oxford Learner’s Dictionary’s definition of flare is “a bright but unsteady
    light or flame that does not last long.” It is also a pretty accurate description
    of flare used in electronic warfare as, in this context, flare is a very hot object
    ejected from an aircraft and its heat or brightness lasts for a short period of
    time (several seconds). Just like chaff is designed to appear as real targets
    for radar, flare is designed to generate IR radiation fooling an IR missile’s
    guidance systems into mistaking it for a true target. To achieve this goal, flare
    must (1) reach peak intensity almost immediately after being ejected, (2) create
    an IR radiation stronger than the radiation emitted by the aircraft’s heat sources
    like the exhaust plume and engines, and (3) possess an IR spectrum more attractive
    than the IR spectrum of aircraft the IR missile goes after. Flare can be made
    of either pyrotechnic material which generates highly visible white light or pyrophoric
    materials which ignite immediately after exposed to oxygen, thus generating IR
    radiation.


    In an ideal scenario (for the target aircraft, of course), once a flare is ejected,
    the IR missile’s heat seeker begins to track the flame and lose its lock on the
    aircraft. Flare can be a very effective countermeasure against IR missiles using
    a spin-like scan system. Just like chaff, flare starts to lose its speed immediately
    after ejection. To distinguish between the flare and the real target, the IR missile
    guidance can use speed to separate the flare from the real target like a radar
    using speed to distinguish between aircraft and chaff.'
