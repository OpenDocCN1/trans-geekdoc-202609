    (https://www.aef.se/Avionik/Artiklar/Motmedel/Nya_hotbildet/RadarWarnStory.pdf).


    ![](img/ff55c581d8704d3a62714cacfc830da5_77_1.png)


    **Figure 4.5** A diagram of a crystal video receiver.


    spectrum from 2 to 18 GHz in four bands: S (2–4 GHz), C (4–8 GHz), X (8–12 GHz),
    and Ku (12–18 GHz). One can build a crystal video receiver for each band, and
