    # 5.5 Deceptive Jamming and Cover Pulse Operation


    The goal of deceptive jamming (also known as spoofing) is to deceive the radar
    with erroneous information. Hopefully, the radar operator does not notice that
    the radar is being jammed and makes a wrong decision based on incorrect information.
    The logic, of course, is that the operator’s wrong decision will provide the tracked
    aircraft with a better chance of accomplishing its mission. One obvious advantage
    of spoofing is that the power required for the jammer is not as demanding as the
    noise jammer. However, this technique is more sophisticated. A major device to
    perform the spoofing is a technique generator. It is used to generate the desired
    jamming signals.


    A radar can measure three major parameters of its target aircraft: the distance
    of the target, the angle of the target with respect to the radar, and the speed
    of the target. Let us do a quick review of how radar determines these three parameters.
    A pulse radar periodically sends out a short pulse of microwave signal and then
    listens to the reflected radar signal (skin return) to find its target. Based
    on when the radar receives the reflected signal, the radar can determine the distance
    of the object. In the easiest implementation, each transmitted pulse is a short
    microwave with a fixed frequency. The frequency of the reflected signal can be
    different from the frequency of the transmitted signal due to the Doppler effect
    discussed in Chapter 2. Using this frequency difference, the radar can then determine
    the target’s velocity. When searching for an object, the radar’s antenna will
    scan though the sky and the direction from which the radar receives a strong reflected
    signal tells the radar the angle of the object. This operation is illustrated
    in Figure 5.4.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_99_0.png)


    A successful spoofing requires jamming a radar without alarming the radar operator.
    To accomplish this goal, the jammer needs to make the radar operator mistake the
    jamming signal for an authentic skin return pulse. First, the jamming signal must
    take over the radar’s return signal without causing any obvious change on the
    radar screen. To do so, the jammer needs to generate a jamming signal to match
    the radar signal. The timing of sending out a jamming signal is also important.
    If the jammer receives the radar signal and immediately sends a jamming signal,
    this spoofing will not be successful because there is always a time delay between
    intercepting a radar signal and generating a jamming signal. In order to send
    a jamming signal at a correct instant, the jammer must predict the next radar
    pulse’s time of arrival and, when this time comes, sends the jamming signal whose
    time duration covers the duration of the radar pulse so that the radar receiver
    receives the skin return and the jamming signal simultaneously. The pulse predication
    is the task of the technique generator. Because the jamming pulse covering the
    radar returning signal has similar characteristics, the radar operator may not
    notice the existence of the jamming pulse and the jamming pulses then take over
    the operation of the radar. Once this task is accomplished, the radar’s estimation
    of the object’s distance, speed, and angle can be misled by the jammer.


    It is worthy of notice that there is a variant of noise jamming that uses a noise
    pulse to cover the radar’s skin return pulse. With this approach, a noise jammer
    might jam multiple radars, and the requirement for jammer’s power can be relaxed.
    This jamming method is referred to as cover noise jamming. Cover noise jamming
    is not a deceptive jamming as it does not provide radar with wrong information.
    In the following sections, we will discuss some deceptive jamming techniques used
    to alter one or more of the radar’s three measurements and the radar’s counter-countermeasures.'
