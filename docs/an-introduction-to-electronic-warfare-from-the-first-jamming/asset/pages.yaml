  md: '# # 4


    # ## Intercept Receivers and Electronic Warfare Processors


    # ### 4.1 Introduction


    In a battlefield, an aircraft might be illuminated by many types of radar from
    both sides. Most radars are benign in nature. However, there are threat radars
    and their goal is to shoot down hostile aircraft. This chapter describes how to
    distinguish threat radars from other radars based on their emitting signals. The
    pulses generated by all the radars is in the order of tens of thousands or even
    millions per second. From this crowded electromagnetic environment, the threat
    radars must be found. And not only find them but find them in a timely manner,
    that is in seconds. If it takes a little longer time such as minutes to identify
    threat radars, the game might be over. To achieve this goal, intercept receivers
    and electronic warfare processors are needed.


    # ### 4.2 Intercept Receiver Requirements


    The frequency range of an intercept receiver must cover all the radar frequency.
    Different types of radar use different frequencies. Usually, the frequency range
    of military radars is from 2 to 18 GHz. The entire bandwidth is 16 GHz. Let us
    use an example to show how wide this bandwidth is. The frequency of all FM radio
    stations is from 88 to 108 MHz and it covers 20 MHz or 0.02 GHz. So, 16 GHz covers
    800 FM frequency bands. Within this broad bandwidth, there might be signals from
    weapon radars. These radars can guide a missile toward an aircraft in seconds.
    The intercept receiver, electronic warfare processor, and jammer must detect the
    radar signals, sort them out, identify the threat type, and jam the radar with
    the correct jamming techniques. All these operations must be finished before the
    radar can launch a missile toward the aircraft. During the Cold War, Taiwan’s
    U-2 pilots who flew surveillance missions over mainland China were told'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'that they would be safe if they could escape within one minute after the radar
    warning system on U-2 finds the Chinese threat radar. However, in reality, the
    window for them to escape was only a few seconds and some brave pilots paid with
    their lives as the ultimate price.


    Besides the need to cover a broad spectrum, the intercept receiver should have
    high sensitivity. A high sensitivity receiver can receive weak signals; therefore,
    it can detect radars far away. The other quantity is dynamic range which determines
    the receiver’s capability of receiving simultaneous strong and weak signals. High
    dynamic range means the receiver can detect both strong and weak signals at the
    same time. Unfortunately, a receiver cannot have both high sensitivity and high
    dynamic range. Increasing one value will decrease the other one in basic receiver
    designs. A compromised decision must be determined by the designer.


    In the 1970s, a sales engineer from Watkins Johnson gave an example to describe
    the requirements of the electronic warfare countermeasures. He said that in a
    certain city, when the newspaper publishes an interesting news story on a certain
    day, a certain radio station will broadcast a short question about it. If a listener
    hears the question, he/she must call the radio station immediately and answer
    the question. If the answer is correct, the listener will win a grand prize. However,
    the broadcasting station and the time of the day are not published. In order to
    win the prize, the listener must buy many radio receivers and tune each one to
    a certain radio station. Each radio must be operated by a person who listens continuously
    from the beginning of the day. The number of radios and operators must equal all
    the broadcasting stations in the city. If the question is broadcast, the listener
    must call the station immediately. If the answer is correct, he/she will receive
    the grand prize. If the listener does not provide the correct answer, he/she still
    will not win the grand prize. Obviously, this is a tremendous effort, and some
    luck is needed. This is a good analogy to the electronic warfare operation. The
    grand prize is saving the operators and the aircraft.


    The intercept receiver has a very unique requirement, that is, the receiver must
    be able to receive multiple signals. It is referred to as simultaneous signal
    receiving capability. In most communication receivers, one receiver is only required
    to receive one signal. In a battlefield, however, there maybe many different threat
    radars. The intercept receiver must receive all the radar signals. This is a extremely
    difficult problem to solve, especially as some signals are weak and some are strong.
    Some modern intercept receivers are required to receive up to four simultaneous
    signals.


    With this requirement, the radio station example in the previous paragraph should
    be modified as follows: there can be multiple radio stations'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'broadcasting at the same time. How many radio stations will broadcast similar
    but slightly different information is unknown but the number is from 1 to 4. The
    questions asked by the stations are also different. In order to win the grand
    prize, one must receive all the signals and provide all the correct answers. This
    is definitely more challenging than the case of one broadcasting station.


    # ## 4.3 Parameters Measured by Intercept Receivers


    What is the information an intercept receiver is required to provide? There are
    usually five measurable quantities. They are the frequency, pulse width, time
    of arrival (TOA), pulse amplitude, and angle of arrival. The first four parameters
    are illustrated in Figure 4.1. The first three quantities are the determined by
    the radar and the last two parameters are determined by the locations of the radar
    and the receiver. These parameters are briefly discussed as follows.


    The frequency is referred to the frequency of radar signal used to modulate the
    pulse. This parameter is useful to identify the radar type and provides jammer
    guidance about which frequency range to jam. The pulse width is the time duration
    of the radar''s pulse signal. It is usually measured in microseconds ($\mu$s $=10^{-6}$
    s). This parameter can be used to determine the radar type and provide useful
    information for jamming. Usually, a weapon radar signal has short pulse width,
    i.e. $1 \mu$s or below. The TOA is the time the intercept receiver assigns to
    the time when the pulse is received. This time is not related to any real time
    but to an internal time generated by the receiver. The information is needed to
    measure the time between adjacent pulses. The difference between the TOA of two
    consecutive pulses is the pulse repetition


    ![](img/ff55c581d8704d3a62714cacfc830da5_73_0.png)


    **Figure 4.1** Parameters measured by an intercept receiver (angle of arrival
    not depicted).'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'interval. This parameter is useful for grouping individual pulses into a pulse
    train and provides jamming information.


    The pulse amplitude is how strong the received pulse is. If the receiver is close
    to the radar and within the mainlobe of the radar antenna, the signal is strong.
    This parameter is also valuable for jamming. The angle of arrival is the direction
    of the radar relative to the receiver. This parameter is extremely useful for
    sorting the individual pulses into a pulse train and for jamming. The angle of
    arrival can be considered as the most important information in sorting the signals
    because modern radar can change the frequency, pulse width, and time of arrival
    on a pulse-to-pulse basis, but the angle of arrival stays close to a constant.
    Even an airborne radar cannot change the angle of arrival very quickly. An intercept
    receiver might receive signals from multiple radars and the angle of arrival can
    be used to separate signals from different radars. The process of separating signals
    from different sources is referred to as signal sorting. The angle of arrival
    also provides the direction of jamming to the jammer. The angle of arrival is
    usually only measured in the azimuth direction. If the elevation angle is also
    measured, the distance of the radar can be estimated through the elevation angle
    and the height of the aircraft if the radar is ground based. The azimuth and elevation
    angles are illustrated in Figure 4.2. The angle of arrival is the most difficult
    parameter to obtain because it takes multiple antennas and receivers to measure.


    ![](img/ff55c581d8704d3a62714cacfc830da5_74_0.png)'
