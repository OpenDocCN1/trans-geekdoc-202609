    # ## 4.6 Superheterodyne (Superhet) Receivers


    The superhet receiver was invented by an US engineer Edwin Howard Armstrong in
    1918 during World War I. Armstrong also invented FM radio. The superhet receiver
    was one of the most important inventions in receiver technology. All modern receivers
    adopt this technology. The frequency of the electrical signal used for communication
    is relatively high, and, in early times, there was no amplifier for that frequency
    band available. As a result, the sensitivity of the receiver is low. The idea
    of the superhet receiver was to change the radio frequency to an intermediate
    frequency (IF) that is lower than the radio frequency. A simple superhet receiver
    diagram is depicted in Figure 4.6. The input RF signal is multiplied (mixed) with
    a signal of different frequency generated by a local oscillator; so its frequency
    can be shifted to a lower frequency band. Armstrong’s contribution was creating
    a mixer circuit to make such operation possible. The mixer operation can be easily
    explained by the following equation based on Ptolemy’s identities.


    ```

    $$\begin{gathered} \sin \left(2 \pi f_{1} t\right) \sin \left(2 \pi f_{2} t\right)
    \\ =1 / 2\left(cos 2 \pi\left(\left(f_{1}-f_{2}\right) t\right)-cos 2 \pi\left(\left(f_{1}+f_{2}\right)
    t\right)\right)\end{gathered} \quad \quad (4.1)$$

    ```'
