    on this information to reduce errors. Back propagation is an algorithm allowing
    the machine to change the neural network’s coefficients to reduce errors, beginning
    from the last layer toward the first layer by using chain rules and partial derivative.
    In this process, the error is propagated in a reverse direction to update the
    CNN’s coefficients and it is the reason why this algorithm is called back propagation.
    The size of adjustment is based on error magnitude and learning rate, a parameter
    set by the programmer. The hope is that after feeding the CNN with enough training
    data, the CNN will learn a setting that can deliver an accurate signal classification.
    One task that remains challenging for engineers working on signal classification
    is to identify multiple signals arriving at different times with different powers
    and being partially overlapping in time. One way to deal with this scenario is
    to train a CNN with as many scenarios an EW receiver might encounter as possible,
    but this approach can be time-consuming. So, a more efficient solution is needed.


    As discussed previously, the number of neural network layers, the size/number
