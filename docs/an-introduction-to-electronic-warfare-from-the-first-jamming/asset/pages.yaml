- pgno: 67
  md: '# **3.8 Fourth Layer of Electronic Warfare Operation: Radar Counter-Countermeasure**


    In military radar designs, all the electronic countermeasures conducted by the
    targets must be taken into considerations. The radar must detect the jamming signal
    to avoid providing false information on the target. It can have different operation
    modes, such as changing its operation frequency, changing the pulse repetition
    time, etc. These approaches complicate the intercept receiver and electronic warfare
    processor''s task of recognizing a hostile radar. A radar must minimize the illumination
    time on the target. This is especially important to avoid anti-radiation missiles.


    Although a radar with higher power can cover a longer range, high signal power
    also makes radar vulnerable as an intercept receiver can conveniently detect radars
    emitting strong signals. One obvious way to avoid being detected is to radiate
    less power. These types of LPI radar apply just enough power to achieve their
    operation goal. When they track proximate targets, they reduce their emitting
    energy. Another way to reduce the probability of being detected can be using a
    longer low-power pulse such as FM signals, as explained in Section 2.11. By doing
    so, the total emitted energy remains the same, but peak power is reduced, thus
    making the radar more difficult to be detected. Other LPI approaches include changing
    signal frequencies, reducing the antenna side-lobe, using noise-like radar signals,
    etc. Chapter 9 will introduce some types of LPI radar.


    The radar can also send a homing on jamming missile to attack the target. If the
    target is jamming the radar, the missile can follow the jamming signal. Thus,
    the jamming signal can bring danger to the jammer. The electronic warfare operations
    taken by a radar to offset its target''s countermeasure are called electronic
    counter-countermeasure (ECCM) which is also referred to as electronic protection
    (EP).


    # **3.9 An Electronic Warfare Case Study: Black Cat Squadron**


    The 1960 U-2 incident, in which the US pilot Francis Gary Powers was shot down
    near Kosulino while flying a U-2 over the Soviet Union, ignited a major diplomatic
    crisis in the Eisenhower presidency and is well known to readers in the English
    world. The lesser known history is that, from 1961 to 1974, the US supplied U-2s
    to Taiwan''s Republic of China Air Force (ROCAF) to conduct surveillance missions
    over mainland China. ROCAF formed the Black Cat Squadron for this task. As, in
    the early 1960s, China''s People''s'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Liberation Army Air Force (PLAAF) only had few surface to air missiles (SAM)
    that could reach the U-2 operational altitude (about 70,000 feet), Black Cat Squadron
    completed several missions without any loss initially. The Black Cat Squadron
    even flew over Beijing, taking photographs. It wasn’t until September 1962 that
    the U-2 flew by Major Chen Huai was shot down by PLAAF’s SA-2 missile. Afterwards,
    ROCAF’s U-2 was equipped with a radar warning receiver to detect the SA-2 guiding
    radar signal (fearing it to be lost to China, the US initially did not install
    a jammer for SA-2 on ROCAF’s U-2 until 1964 after losing three U-2s in missions).
    PLAAF soon noticed that ROCAF’s U-2 would change its direction once SA-2’s radar
    was turned on for more than 10 seconds. Based on open sources in Chinese, to handle
    this situation, PLAAF used the Soviet Union’s SON-9 fire director radar for anti-aircraft
    guns to loosely track the U-2. The U-2’s intercept receiver was not designed to
    detect SON-9 radar (the anti-aircraft gun surely cannot bring down an aircraft
    at high altitude). The SA-2’s radar was switched off until the U-2 was very close
    to its firing range and the SA-2 was launched quickly (within 8 seconds) after
    its radar was turned on. By then, it was too late for the U-2 to make any maneuvers.
    Using this tactic (PLAAF called it *near-fast tactics*), PLAAF brought down more
    U-2s. The Black Cat Squadron ceased its overflight reconnaissance missions after
    PLAAF possessed more SA-2s and the whole operation was terminated after the US
    normalized its relations with China. PLAAF shot down five of ROCAF’s U-2s in total.


    Some lessons on electronic warfare can be drawn from this sequence of events.
    First of all, as mentioned before, to avoid being detected, a radar should minimize
    its illumination time and PLAAF definitely pushed this doctrine to the extreme.
    One thing worthy of mention is that the U-2 is a defenseless surveillance airplane;
    so the PLAAF missile unit does not have to be concerned with its own safety and
    thus can wait until the last minute (or second) to turn on missile guidance radar.
    This episode of electronic warfare history also demonstrates the importance of
    ECM. Without a jammer, the U-2 is in a hopeless situation once it is locked by
    a missile guidance radar. Taiwan did demand the installation of a radar jammer
    after losing several U-2s and jamming was applied in later missions. Finally,
    the importance of knowledge about an enemy’s radar signal cannot be overestimated.
    PLAAF used two radars, SON-9 and SA-2’s guidance radar to accomplish the task
    of shooting down U-2s. Being unaware of PLAAF’s usage of SON-9 for long-range
    tracking significantly reduced the U-2’s response time.'
