  md: '# 5


    ## Jamming and Counter-Countermeasures


    # ### 5.1 Introduction


    Once a signal emitted by a threat radar is detected, in order to protect the aircraft
    action must be taken immediately against the threat radar. The required response
    time is in the order of seconds. The required action against the radar is usually
    called jamming. The jamming is a general term and different jamming techniques
    are applied against different types of radar.


    Usually, one intercept receiver is used to receive radar signals from all different
    types of radar for the electronic warfare processor to identify. When the electronic
    warfare processor recognizes the radar type, this information is sent to a technique
    generator and the technique generator will produce the corresponding jamming signal.
    The jamming signal must be amplified and sent to the threat radar. Some radar
    can be jammed easily, but some are more difficult to interrupt. In some cases,
    one jamming source may not accomplish the jamming goal alone. It might take several
    jammers working together simultaneously and these jammers can be at different
    locations. This fact shows the difficulty of conducting effective jamming.


    Since the practice of jamming is to send a signal/noise back to the radar, it
    is also called active electronic warfare operation in contrast to the passive
    electronic warfare used for intercepting signals. Another common term used for
    this practice is electronic attack (EA). The aircraft dedicated to active electronic
    warfare are also called electronic attack aircraft. People not familiar with electronic
    warfare might associate electronic attack with some fictional weapons in movies,
    but it is not what electronic attack stands for. Perhaps, the phrase EA was invented
    because of the military''s appetite for the word "attack."


    The main goal of jamming is to protect the aircraft. Thus, weapon radars are the
    primary target. The weapon radar must first lock onto a target aircraft to obtain
    the necessary information before launching a missile against it.'
