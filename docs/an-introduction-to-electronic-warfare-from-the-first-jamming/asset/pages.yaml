- pgno: 187
  md: '# # About the Authors


    **Chi-Hao Cheng** is a professor with the Department of Electrical and Computer
    Engineering, Miami University, Oxford, OH, USA. Before joining Miami University,
    he worked in the optical communications industry for five years. His primary professional
    interests lie in optical communications, digital signal processing, and electronic
    warfare receiver development. His research work has led to more than 50 academic
    articles and his research projects have been sponsored by AFRL, DARPA, NAVAIR,
    NSF, etc. He is the co-inventor of three US patents.


    **James Tsui** was the world''s leading authority on electronic warfare (EW) receiver
    technology. His pioneering work resulted in over 50 awarded patents, and he was
    recognized as an Air Force Research Laboratory (AFRL) and Institute of Electrical
    and Electronics Engineers (IEEE) Fellow. Among his 90 publications, Dr. Tsui authored
    seven books on receivers: two on analog EW receivers, three on digital EW receivers,
    and two on software GPS receivers. These books are used as primary references
    by engineers and scientists developing advanced receiver technologies for many
    diverse sensing applications, including EW, radar, and communications and navigation
    systems. The books have been the basis for university graduate courses and highly
    sought-after short courses developed and taught to all three DoD services and
    DoD industrial companies internationally. Dr. Tsui passed away in 2019.'
