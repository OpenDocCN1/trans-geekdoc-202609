- pgno: 136
  md: 'For a conical scan system which rotates around its target, the flare might
    fall out of the conical scan system''s field of view due to it losing speed too
    soon for the conical scan system to track it. The IR missile can also detect flare
    by noticing a sudden increase in IR radiation via comparing the IR spectra of
    flare and target or by sudden separation of two IR sources (i.e. flare and the
    aircraft). When a flare is detected, the missile''s tracking system might wait
    until the flare is out of its field of view to track its target again.


    To counter the IR missile guidance system''s counter-countermeasure, flare should
    have an IR spectrum close to the one of the aircraft it is designed to protect,
    and multiple flares can be ejected continuously as the IR missile''s tracking
    accuracy is sacrificed if the flare stays longer in its field of view. Advanced
    flare is even designed to propel itself behind the aircraft for a while, so the
    IR missile cannot identify a flare by its sudden separation from the aircraft
    or its deceleration. Such a flare is called a kinematic flare. One can argue that
    a flare with a mechanism to propel itself is similar to a glider or decoy, and
    it will be the subject of the next section.


    # 7.5 Decoy


    Like chaff, a decoy is built to confuse radar so that radar will mistake it for
    a target aircraft. The major difference is that a decoy is way more complicated.
    It can be considered as a miniature aircraft and some decoys are powered and carry
    a jammer. To maximize the chance of deceiving a radar, a decoy is designed to
    increase its radar cross section so that a small decoy can appear as a big jet
    fighter or bomber on a radar screen.


    A decoy can be very useful in several ways. Based on their usage, they might be
    classified as expendable decoy, towed decoy, or saturation decoy. The expendable
    decoy is ejected from the aircraft to distract the missile. The electronics on
    an expendable decoy can generate large radar images to lure missiles, thus protecting
    the aircraft. Advanced expendable decoys such as the BriteCloud series are equipped
    with DRFM to capture and retransmit the radar signal to lure missiles from the
    aircraft. One issue of expendable decoys is that, although an expendable decoy''s
    electronics can fool a radar, just like chaff, expendable decoys do not have an
    engine, so it is like a glider which cannot stay in the air for an extended time.
    This issue can be solved by a towed decoy. From its name, one can image that a
    towed decoy is attached to an aircraft so that it can fly behind. The modern towed
    decoy is connected to the aircraft by an optical cable and it can transmit the
    jamming signal generated by the jammer of the aircraft. If jamming does not work,
    the last'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'resort will be letting the towed decoy be the target of the missile. After
    a successful mission, if not destroyed, the towed decoy can be reeled in for reuse.
    One example of a towed decoy is the AN/ALE-55 fiber optic towed decoy used in
    F-18s.


    The main function of a saturation decoy is different from the two decoys just
    described. Instead of protecting aircraft, a saturation decoy is used to trigger
    the enemy’s radars into action. To fulfill this purpose, new saturation decoys
    such as the US Air Force’s ADM-160B Miniature Air-Launched Decoys (MALD) are equipped
    with engines so that they can fly for an extended distance (several hundred miles)
    and have a long air time (45 minutes). Such a decoy is also referred to as a decoy
    missile. As saturation decoy possesses a radar cross section and flight characteristics
    similar to real aircraft; it can lead the first wave of attack to bait the enemy’s
    radars into operation, thus wasting the enemy’s resources for tracking real attacking
    aircraft and exposing the enemy’s radar locations. The function of saturation
    decoys can also be fulfilled by drones. As described in Section 5.14, in the 1982
    Lebanon War, the Israeli Air Force used drones to trigger Syria’s radars into
    operation so that the Israeli Air Force could precisely locate and neutralize
    17 out of 19 Syrian SA-6 sites in 15 minutes. On the first night of Operation
    Desert Storm, drones and the US Navy’s unpowered TALD (Tactical Air Launched Decoy)¹
    were used to trick Iraqi anti-aircraft guns, missiles, and radars into action.
    Many of them were then destroyed and the Iraqi Air Defense was significantly reduced
    from the beginning of the first Gulf War.


    # ### 7.6 Conclusion


    In this chapter, three non-electronic countermeasures, chaff, flare, and decoy,
    are introduced. Up to now, we have described the cycle of electronic warfare as
    follows: a radar sends out radio wave to detect targets and an IR missile using
    IR radiation from a target to track it. The countermeasure is developed to create
    confusion for radar or IR missile’s tracking system and counter-countermeasures
    are then conceived to reject countermeasures accordingly. Every countermeasure
    will meet with its counter-countermeasure, and every counter-countermeasure will
    trigger the development of more advanced countermeasures. It is the circle of
    electronic warfare that never ends. Another way'
