    # 2.15 Doppler Radar


    Besides the target’s location it is desirable to measure the speed of the target.
    Theoretically, the target speed can be calculated from the difference between
    the measured target locations within a certain time. The speed estimation obtained
    this way is coarse and not real-time (as the receiver needs time to acquire two
    distance measurements). Another way to measure an object’s velocity is through
    the Doppler effect. The Doppler effect can be experienced in daily life. For example,
    one might hear a fire truck or police car with its siren on. One can hear a higher
    pitch when the truck or car is approaching and a lower pitch when it is moving
    away. This example demonstrates the Doppler effect of acoustic waves. The same
    principle also applies to electromagnetic waves.


    Police radar uses the Doppler effect to measure the car speed and military radar
    uses the same principle to measure the aircraft speed. If the aircraft is approaching
    the radar, the received signal has a frequency higher than the transmitted signal.
    If the aircraft is moving away from the radar, the received signal has a frequency
    lower than the transmitted signal. By measuring the frequency difference between
    transmitted and received signals (also called the Doppler frequency), the speed
    of the target can be obtained as


    ```

    $$s = \frac{ \Delta f c }{ 2f } \tag{2.5}$$

    ```


    where $s$ is the target speed toward the radar, $\Delta f$ is the difference between
    transmitted and received signals’ frequencies, $c$ is the speed of light, and
    $f$ is the frequency of the transmitted signal. The factor of 2 in the equation
    is because the signal travels twice the distance between the target and radar.


    If the target is traveling directly toward or away from the radar, the speed obtained
    with Equation (2.5) is the target’s speed. If the target is traveling in another
    direction, the angle between the line of sight toward the radar and'
