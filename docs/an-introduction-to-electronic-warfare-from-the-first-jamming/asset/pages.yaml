    # ## 9.4 LPI Radar Example 1: Phase Coded Radar


    Before introducing two LPI radar examples, the concept of cross-correlation needs
    to be explained first. Cross-correlation is used to measure similarity between
    signals, and we will use radar signals as an example to explain how it is calculated.
    Assume a radar sends out one cycle of a sinusoidal wave whose period is 20 ns
    (PW = 20 ns) and wait for its reflection. The top plot in Figure 9.1 shows the
    transmitted signal. In real applications, a radar sends out many cycles of sinusoidal
    signals during a pulse and the period of a sinusoidal signal should be much shorter.
    However, to make the figure more intelligible, let us assume this unrealistic
    case for demonstration purposes. Assume that 100 ns after the start of a transmitting
