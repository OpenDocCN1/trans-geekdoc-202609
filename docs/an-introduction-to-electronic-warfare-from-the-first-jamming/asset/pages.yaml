  md: 'As mentioned in the previous section, the first step of the deceptive jamming
    is to cover the radar pulses with a jamming signal so that the jammer can take
    over the radar''s operation. To cover pulses, the technique generator must be
    able to predict the next radar pulse''s frequency, pulse width, and time of arrival.
    If some of the radar intrinsic parameters are changed on a pulse-to-pulse basis,
    it becomes difficult to predict the next pulse''s parameters. With all these parameters
    continuously changing, it will be challenging for the intercept receiver and electronic
    warfare processor to measure and de-interleave radar pulses, let alone predict
    the next radar pulse. Therefore, many military radars are parameter agile in nature
    to counter deceptive jamming.


    # 5.8 Angle Deception: Sidelobe Jammer and Sidelobe Cancelation Scheme


    The jamming can also cheat the radar operator on angle measurement. Like all antennas,
    the radar antenna has a mainlobe and many sidelobes, as shown in Figure 5.6. When
    searching for its target, the radar emits radar pulses, the majority of whose
    energy is through the mainlobe. When detecting a reflected radar pulse, the radar
    receiver assumes that the energy it receives is through antenna''s mainlobe and
    the direction of the mainlobe is the direction of the target. To deceive a radar
    with the wrong angle information, the jammer avoids sending the jamming signal
    when the main beam of the radar illuminates the target. When the main beam is
    not pointing at the target, the jamming signal is sent to the radar through the
    sidelobes of its antenna. Since the antenna gain of the sidelobe is much weaker
    than the mainlobe,


    ![](img/ff55c581d8704d3a62714cacfc830da5_102_0.png)


    **Figure 5.6** Radar antenna pattern.'
