- pgno: 21
  md: '# # Introduction: From the First Jamming to the Battle of Beams


    # ## 1.1 The First Jamming [1–6]


    In 1901, the 11th America’s Cup international yacht race was held in New York
    City. The race was postponed for several weeks due to the assassination of President
    William McKinley in September. That year, the race was between the defender, New
    York Yacht Club’s Columbia and the challenger, Royal Ulster Yacht Club’s Shamrock
    II. Two companies, Guglielmo Marconi’s Marconi Company and Lee de Forest’s Wireless
    Telegraph Company, placed wireless transmitters on boats hired for this event
    for transmitting bulletins to reporters on shore. Marconi was contracted by Associated
    Press and Lee de Forest worked for the Publishers’ Press Association. In 1899,
    Marconi successfully covered the 10th America’s Cup with his wireless equipment,
    and this success significantly boosted his company’s value [1]. This time, de
    Forest aimed to achieve similar publicity by competing against Marconi directly.


    As these two companies started to transmit signals, their messages were corrupted
    by a third company, American Wireless Telephone and Telegraph Co (AWT&T). Without
    securing any contract with a news agency, according to one account, AWT&T set
    up a scheme to jam both Marconi and de Forest’s transmitters while transmitting
    its own updates on the yacht race [2, 3]. Equipped with a transmitter more powerful
    than ones used by its competitors, an AWT&T engineer named John Pickard used a
    simple code to provide real-time updates on the race, one repeated 10-second dash
    (a tone of long duration) for Columbia’s taking the lead, two repeated 10-second
    dashes for Shamrock II’s taking the lead, and three repeated 10-second dashes
    for neck-to-neck, etc. During these long dashes, no other transmitters’ signals
    could be received correctly. As a result, neither Marconi nor de Forest’s'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'company could provide accurate reports on the yacht race. Nevertheless, AWT&T
    also failed to cover the yacht race (by the way, *Columbia* won the race). Some
    people consider this event to be the first deliberate jamming in the history of
    radio communications. However, based on other accounts, the interference caused
    by AWT&T was not intentional and the "jamming" was not successful. In this version
    of story, the first deliberate (and successful) jamming happened in the 1903''s
    America''s Cup with three identical players, the Marconi, de Forest, and International
    Wireless Telegraph & Telephone Company, the successor of AWT&T [4, 5]. In this
    version of story, the third player, Wireless Telegraph & Telephone Company, remains
    the villain.


    In 1887, the German physicist Heinrich Rudolf Hertz demonstrated the existence
    of electromagnetic waves which was predicted by the Scottish scientist James Clerk
    Maxwell. James Clerk Maxwell''s famous Maxwell equations provide a framework to
    describe electrical and magnetic fields and their interactions. Maxwell predicted
    the existence of waves of oscillating electric and magnetic fields propagating
    at the speed of light and claimed that light and electromagnetic waves are of
    the same nature. Using the setting shown in Figure 1.1, Hertz demonstrated that
    when a high voltage is applied through the coil, a radio wave can be generated
    and then received by the receiver illustrated in the same figure.


    ![](img/ff55c581d8704d3a62714cacfc830da5_22_0.png)


    Figure 1.1 The circuit diagram of Hertz''s experiment (https://upload.wikimedia.org/wikipedia/commons/8/83/Hertz_transmitter_and_receiver_-_English.svg).'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Soon after the existence of electromagnetic waves was confirmed, people started
    to develop applications based on this discovery. For some engineers, electromagnetic
    waves can be a useful means for communications. Wire telegraphy that uses an electrical
    field through a wire to transmit information was invented in 1830s. Many inventors
    developed wire telegraphy independently, and one of them is an American inventor
    named Samuel Morse. Samuel Morse conceived the famous Morse code that uses combinations
    of tones of short duration (known as dots), tones of long duration (known as dashes),
    and a period of silence to represent the Latin alphabet and Arabic numbers (the
    length of silence depends on whether it is used to separate dash/dot, words, or
    a sentence). If an electrical field through a wire can be used to transmit information,
    it was only natural for people to try to develop a wireless telegraphy using electromagnetic
    waves through the air. Hertz’s demonstration of electromagnetic waves provided
    great insights for wireless telegraphy developers, and the one who first showed
    feasibility of such a system is an Italian inventor, Guglielmo Marconi. Marconi
    first demonstrated that he could ring a bell remotely across a room using radio
    waves; he then continuously worked to extend the transmission distance. Marconi
    first demonstrated his radio telegraphy to the British government in 1896 and
    was awarded the Nobel Prize in Physics jointly with Karl Ferdinand Braun in 1909
    “in recognition of their contributions to the development of wireless telegraphy.”
    Among all of the prominent electrical engineers in his era including Thomas Edison
    and Nikola Tesla, Marconi was the only one awarded this prestigious award.


    Since the invention of radio communications, its value was soon recognized by
    military. Shortly after Marconi demonstrated the first trans-Atlantic wireless
    communications in 1901, radio communications became a common practice in Navies
    around the world. Jamming one’s enemy’s radio communications was soon practiced
    in military exercises. On February 8, 1904, the Russo-Japanese War broke out and
    Port Arthur (now called Liusun Port) was under siege in May 1904. During the siege
    of Port Arthur, Russian radio operators became aware of the increasing intensity
    of radio communications before Japan’s attacks and used it as an early warning
    sign. On March 8, 1904, two Japanese armored cruisers *Kasuga* and *Nishin* bombarded
    Port Arthur. A small Japanese destroyer close to the coast served as a forward
    observer to spot the location of where shells fell and radio gunfire corrections
    back to the two cruisers. Noticing this radio communication and understanding
    its importance, a Russian radio operator jammed the communications. Due to this
    effort, the damage caused by the bombardment was significantly reduced.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'This event is generally seen as the first application of radio jamming in a
    real battle [5].


    Because of the heavy loss suffered by Russian''s Far East Fleet, Russian''s Baltic
    Fleet was sent for enforcement. Since the Baltic Fleet has fewer ships and they
    are slower than Japanese Combined Fleet''s ships, the priority of Baltic Fleet
    was to reach Russian Port of Vladivostok (Port Arthur fell on January 2, 1905)
    without being detected. On May 27, 1905, while approaching Tsushima Strait, the
    Baltic Fleet was spotted by a Japanese armed merchant cruiser Shinano Maru. The
    Shinano Maru reported this news to Japanese Admiral Togo Heihachiro''s flagship
    using radio. Interestingly enough, although the Baltic Fleet was equipped with
    radio transmitters capable of jamming Japanese''s radio communications and radio
    jamming has been practiced by Russians in the early stage of the war, Russian
    Admiral Zinovy Rozhvestvensky decided not to jam Japanese''s radio against his
    officers'' advice. As a result, the Combined Fleet was able to locate Baltic Fleet
    and won a decisive victory in the Battle of Tsushima.


    # 1.2 Radio for Navigation and Battle of the Beams [6–8]


    Besides communications, radio signals can also be used as a navigation tool. Naturally,
    radio navigation was soon used in the war, and, not surprisingly, countermeasures
    and counter-countermeasures were developed. The earliest example is the so-called
    “Battle of the Beams” in the World War II.


    After World War II broke out, Nazi Germany soon conquered most parts of Western
    Europe. Recognizing the difficulty of invading Britain from the sea due to Great
    Britain''s mighty sea power, Nazi Germany planned to force Britain into a settlement
    for peace through a combination of sea blockades and air raids. Luftwaffe bombers
    were sent to destroy British military and economic targets including ports, air
    field, industry, etc. Compared with a fighter, a bomber is larger and heavier,
    thus being an easy target for a fighter. When conducting bombing, Luftwaffe bombers
    would need the escort of fighters to protect them from the attack of Royal Air
    Force (RAF) fighters. However, since the Luftwaffe was unable to gain air superiority
    over RAF in the Battle of Britain, its bombing needed to be conducted at night
    time. During the night, the RAF fighter''s could not see the Luftwaffe bombers;
    so they were safe from attack. On the other hand, the Luftwaffe bombers had difficulty
    locating their targets in the dark. In order to find a certain target at night,
    the bomber must know its direction and distance from the target in the dark, and
    some non-visual navigation method was necessary.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'An easy way to help a pilot find the correct direction is to use a beacon radio
    signal as a guide. The pilot can fly an airplane following the direction pointed
    by the radio signal like a person walks along a path illuminated by a flash light.
    Nevertheless, there is a technical issue in this approach. If the radio beam is
    narrow and a pilot is off the path, they will have huge difficulty in correcting
    their direction. If the radio beam is broad, since the beam is always divergent
    from its emitter, the directional accuracy will suffer.


    To solve this issue, a two radio beam navigation system called the Lorenz system
    was developed before the World War II. The Lorenz system uses two proximate radio
    transmitters to transmit radio signals, one transmitting dash and one transmitting
    dot as shown in Figure 1.2. These two radio transmitters are synchronized so that
    the dot is transmitted in the silent period between dash and vice versa. These
    two radio beams also slightly overlap with each other; hence, when pilots fly
    in the overlapping area pointed from transmitters, they will hear a continuous
    tone. This overlapping area is called the “equi-signal area.” If pilots ever wander
    off the path, they will know how to make a correction based on the radio signals
    they hear. This method was used to guide airplanes to land at night before World
    War II and most of the airplanes were already equipped with a receiver to receive
    a Lorenz signal of 30 MHz. To adopt this method to guide a Luftwaffe bomber flying
    toward Britain, more powerful radio transmitters which can generate a radio beam
    with narrow divergence were necessary because the Lorenz system is designed to
    guide airplanes flying toward the transmitter, but this military application required
    bombers to fly away from the transmitter and toward their target. Nevertheless,
    Germany successfully accomplished this task and built several such transmitters
    in occupied France, emitting radio signal toward Britain. The radio beam used
    for direction is referred to as


    ![](img/ff55c581d8704d3a62714cacfc830da5_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_26_0.png)


    **Figure 1.3** Map illustrating Knickebein system (https://commons.wikimedia.org/wiki/File:
    Map_of_Knickebein_transmitters.svg).


    the approach beam. Besides the right direction, pilots needed to know where to
    drop bombs. Therefore, a second radio beam referred to as crossbeam was used.
    Germany set up another set of transmitters emitting crossbeams intersecting with
    the approach beam at the target as shown in Figure 1.3, and the bombers would
    drop bombs at the intersecting area. The Germans named this system Knickebein.


    The British suspected that the Germans were using a radio navigation system, and
    Dr. R. V. Jones, a scientist working at Directorate of the Intelligence at the
    Air Ministry, guessed that Germany was using a navigation system similar to the
    Lorenz system. So, he ordered an airplane to search for any radio signals around
    30 MHz. Some British scientists were very skeptical about the feasibility of such
    a long range radio navigation beam with 30 MHz frequency, as they did not believe
    that a radio wave of 30 MHz would bend over the curvature of the earth. But, after
    several failed searches, the German radio approach beam was found. Once the signals
    were identified, countermeasures needed to be taken. One solution was to jam the
    German beacon radio signals with strong noise. However, such a practice would
    alert the Germans that their system had been jammed. So, another countermeasure'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'was taken. The British military designed a transmitter called “Aspirin” (the
    nickname the British military gave to Knickbein was “headache”) which transmits
    a dash signal similar to the one transmitted by the Knickbein system with a directional
    antenna. In principle, if aiming the jamming signals into the Knickbein’s dot
    zone, the British military can either create another equi-signal area of their
    choice or make German pilots think they were in the dash zone, thus misleading
    the German bombers. Also, if German pilots heard two dash signals, they would
    disregard the authentic dash tone for the dash tone generated by the Aspirin had
    a higher power. Because German pilots were trained to follow the approach beam
    and drop bombs at the spot where the approach beam and crossbeam intersect, when
    the Knickbein was jammed, many German bombers missed their targets by a large
    distance. Some British believed that their engineers were able to direct the German
    bombers to any direction and drop bombs at a place of their choice, so that when
    German bombs were dropped at Windsor castle, a complaint was made to the British
    government by the Comptroller of George VI’s household.


    The German Knickbein system was developed based on the Lorenz system used for
    civilian aviation before World War II. Both the Knickbein and Lorenz systems use
    radio waves of 30 MHz. A similar system named X-Gerät was also developed. The
    working principle of the X-Gerät system’s approach beam is the same as the Knickbein,
    but the X-Gerät system uses radio signals of 74 MHz and its “equi-signal area”
    is much smaller than the Knickbein system, thus enabling a more precise bombing.
    The narrow approach beam of X-Gerät was code-named Weser.


    The major difference between the Knickbein and X-Gerät systems was that, instead
    of one, the X-Gerät system used three crossbeams that intersected the approach
    beam at different locations as shown in Figure 1.4. When the bomber is 30 miles
    away from its target, the bomb aimer would hear a sound generated by the first
    crossbeam (code-named Rhine) and know that they were close to the target. Once
    the bomber passed the second crossbeam (code-named Oder) which crossed the approach
    beam 12 miles away from the target, the bomb aimer would hear another warning
    signal and then started a special stopwatch. The last crossbeam (code-named Elbe)
    intersected the approach beam 3 miles away from the target where the bomb aimer
    pressed the same button again. Based on the time elapsing between crossing the
    second and third crossbeams, the speed of the aircraft could be determined. Hence,
    if it took the bomber 30 seconds to fly across the 9 miles between the second
    and third crossbeams, the bombs would be dropped 10 seconds automatically after
    the button is pressed for the second time.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_28_0.png)


    **Figure 1.4** Map illustrating X-Gerät system (adapted from a map in https://www.oocities.o
    rg/pentagon/2833/general/tactics/xgeraet/xgeraet.html).


    In principle, the X-Gerät system’s approach beam can be jammed in the same fashion
    of jamming the Knickebein system. However, the rate of British jammer’s dash signal
    is 1500 Hz and the rate of X-Gerät system’s dash signal is 2000 Hz. As a result,
    the X-Gerät system’s filter could filter out the British jamming signal. Eventually,
    the British military generated a false crossbeam to be detected by German bombers
    soon after the bomber crossed the second crossbeam. Therefore, the German bombers
    dropped their bombs before they reached their target. Since the X-Gerät system
    uses a radio frequency different from the Lorenz system’s frequency, not every
    German bomber was equipped the X-Gerät system. In each mission, a few German bombers
    equipped with the X-Gerät system served as pathfinders and were followed by other
    German bombers. As a result, if the pathfinder was deceived, the bombing accuracy
    of the whole group would be compromised.


    After the Knickebein and X-Gerät systems were jammed by the British, another German
    navigation system, Y-Gerät, was developed. The Y-Gerät system’s ground station
    sent an approach beam aimed at the target for the bomber to follow, just like
    the previous Knickebein and X-Gerät systems. However, instead of transmitting
    crossbeams from other ground stations, the same ground station also sent a separate
    ranging signal to be picked up by the bomber. After receiving the ranging signal,
    the bomber would immediately retransmit the signal back to the ground station.
    By comparing the phase of the received and transmitted signals, the ground station
    could accurately'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'determine the location of the bomber and sent a bomb release signal when the
    bomber arrived at its target.


    The British jammed the Y-Gerät system simply by picking up the range signal sent
    by the bomber and retransmitted it to the German ground station so that the ground
    station could not determine the bomber’s location precisely. After the Y-Gerät
    system was successfully jammed, the Germans began to move their bombers to Eastern
    Europe for the imminent attack on the Soviet Union and the Battle of Beams was
    over.


    From this piece of early electronic warfare (EW) history, one can grasp some important
    EW principles. The first is that, unless necessary, do not transmit, as the adversary
    always searches for signals in the battle field. The Germans turned on their systems
    long before their bombing missions or even when they were not in use. If they
    had not transmitted signals when not being used, it would have taken the British
    longer to find the German guidance signals (some British experts did not even
    believe the existence of such signals in the beginning). Also, any knowledge about
    an adversary’s signal is crucial. Dr. R. V. Jones made a correct guess about the
    German’s navigation system signal frequency and looked for it. Any failed search
    for German radio signals would have put Dr. Jones in a difficult situation as
    he ordered search flights for German navigation signals despite objections from
    some of his colleagues. Developing countermeasures based on none or very little
    knowledge about interested signals’ characteristics would be a daunting and time-consuming
    task, and in any kind of competition, very often, speed to respond determines
    the final outcome of the competition. Moreover, when jamming is conducted, the
    best practice is to mislead the enemy without causing any suspicion about being
    jammed. This might be the reason why the British did not simply use noise to jam
    the German navigation signals. Finally, one should consider how to counter the
    jamming signals. This area is generally referred to as electronic counter-countermeasures
    (ECCM). In the Battle of Beams, the Germans never tried to take any ECCM against
    British jammers.


    # ## 1.3 The Scope of this Book


    Wireless communications and radar are two early applications of electromagnetic
    waves and still play significant roles in today’s world. Like some other technologies
    such as airplanes, wireless communications and radar were adopted for military
    use almost from their very beginning. The focus of this book is about radar and
    its countermeasures, EW system in air warfare.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The purpose of radar is to detect objects from a long distance, and EW technology
    is designed to detect the existence of radar and take appropriate actions to interfere
    radar signals. If a radar concludes that its signal has been compromised, a counter-countermeasure
    might be taken. Jamming examples described earlier in this chapter demonstrate
    how quickly and creatively people conceive a corresponding countermeasure after
    a tool is developed to gain commercial or military advantage. Although examples
    presented in this chapter are not about radar, they are often considered precursors
    of EW.


    There is a 16th century Chinese novel, *Investiture of the Gods* (封神榜), which
    is about the war between the Shang dynasty and the Zhou dynasty of China happening
    around 1100 BC. In this novel, each side employed gods and demons in their fighting
    and many of them have special powers such as being able to listen to enemy''s
    conversations and observe enemy''s maneuvers from 1000 miles away. The demon with
    the special hearing power is called Qianliyan (千里眼) and the demon with much better
    than 20–20 vision is called Shunfenger (顺风耳). Usually, one special power will
    meet its countermeasure just like radar and EW. In this story, Qianliyan and Shunfenger
    were employed by the Shang dynasty in the war and caused huge damages to Zhou''s
    army. Initially, Zhou''s field marshal could not find out how his battle plans
    and moves were leaked to his enemy until his intelligence source revealed the
    special powers of these two demons. Once Zhou''s field marshal learned about these
    two special powers, countermeasures were then conceived: a group of 1000 drummers
    played drums to deafen Shunfenger and 2000 of red flags were used to block the
    view of Qianliyan during the preparation of battle. Thus, these two special powers
    were neutralized and Qianliyan and Shunfenger were eliminated in the next battle.
    Interestingly, the techniques described in this 16th century novel share some
    similar characteristics with EW techniques. Deafening the Shunfenger using drummers
    is similar to jamming a radar with strong noise so the radar cannot receive reflected
    radar signals and we can almost consider blocking Qianliyan with 2000 red flags
    a precursor of chaff which is used to induce plenty of false echoes on a radar
    screen thus blocking the radar''s “view.”


    Through this book, if available, historical events are used to demonstrate radar
    and EW technologies. However, the aim of this book is to introduce fundamental
    radar and EW working principles rather than serve as a history of radar or EW.
    Besides some knowledge of high school or college freshman level mathematics and
    physics, it does not require an advanced technical background to comprehend the
    material in this book. The theme of this book is the measure and countermeasure
    between radars and EW systems.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'We believe the story about the development of radar and EW technologies is
    as interesting as a good novel like *Investiture of the Gods* and understanding
    the principles of these technologies will bring about a deeper appreciation of
    human creativity. We hope readers will agree with us after finishing the book.


