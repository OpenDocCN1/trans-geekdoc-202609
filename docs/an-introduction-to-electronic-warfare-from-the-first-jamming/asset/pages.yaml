  md: '# # 8


    # # Stealth Aircraft


    # ## 8.1 Introduction


    One of the unconfirmed stories about stealth aircraft goes as follows. Once upon
    a time, a radar operator was told to do a field test for a radar, and he duly
    performed his duty. While he was working on testing his radar, he heard a roaring
    sound of aircraft jet engines. Looking toward the direction the engine noise was
    from, he spotted an approaching aircraft. However, when he checked his radar screen,
    he found nothing. So, he began to make adjustments, but none of the changes he
    made worked, and up until the aircraft disappeared over the horizon, his radar
    still could not find this aircraft. This radar operator began to think he was
    given a defective radar. “What a lucky day!” he told himself and then got ready
    to take the radar back for repair. What he did not realize was that he actually
    successfully finished a test that was not meant for the radar but for the stealth
    aircraft he saw.


    Chi-Hao Cheng heard this story from one of his colleagues but could not verify
    it. So, this story might well be another urban myth. Nevertheless, it does capture
    what a stealth aircraft is designed for. It is designed to not be detected by
    a radar, especially a fire control radar. Jamming techniques for radars are needed
    because radars can detect aircraft and aircraft need protection from being locked
    onto by hostile radars. So, in principle, a stealth aircraft does not need to
    jam. Of course, as we will see, a stealth aircraft is not an invisible aircraft.
    In the following sections, we will introduce the fundamental principles of stealth
    aircraft and how they might be detected.


    # ## 8.2 Stealth Technologies


    To avoid being detected by a radar, one straightforward way of thinking is covering
    the aircraft with specially engineered Radar-Absorbing Material (RAM) to reduce
    the energy of the reflected radar signals. The US''s F-117'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'uses iron ball paint absorber and the F-35 uses “fiber-mat” materials. Other
    materials include foam absorber, Jaumann absorber, etc. The composition and usage
    of RAM can be classified and kept as a well-guarded secret. When Lockheed Martin
    declared its use of a fiber mat for the F-35, it declined to provide details about
    this technology as it is classified. In 1999, an F-117 was shot down in Yugoslavia
    and it was reported that some of wreckage was sent to China and Russia to help
    develop their stealth technology. When asked about Russia and China possibly gaining
    knowledge about US stealth technology from the F-117 wreckage, US Maj. General
    Bruce Carlson responded “I would just tell you this: The science involved in making
    a low-observable airplane is not a secret. It involves shaping and radar absorbing
    material. The technology needed to make radar absorbing material is available
    in a number of places.” [3]


    General Carlson probably spoke the truth. After all, some RAM like (CNT)-infused
    fiber material has been granted a US patent (patent number US20100271253A1) and
    everyone can search for these patents online. However, avoiding a radar’s detection
    is one thing and being used in a combat environment is another. The coating of
    a jet fighter should be light, strong, durable, and easy to repair. But some RAM
    like iron ball paint can be costly, heavy, and difficult to maintain. After each
    mission, the stealth aircraft surface needs to be carefully inspected. One of
    James Tsui’s friends who used to work on stealthy technology told him that stealth
    aircraft need to be frequently repainted. It is not difficult to image how expensive
    and inconvenient this practice can be. Nevertheless, this issue might be solved
    now as Lockheed Martin has claimed that its fiber-based stealth technology is
    a “durable, low-maintenance stealth technology.


    Compared with RAM, another way to avoid radar detection is much less straightforward.
    For a very longtime, the common wisdom was that the bigger the aircraft, the bigger
    its radar cross section. Therefore, a big aircraft should appear as a large object
    on a radar screen and a decoy is designed to mimic an aircraft’s large radar cross
    section. In 1962, a Soviet Union physicist, Pyotr Ufimtsev, published his study
    on the scattering of electromagnetic waves and this work is known as the Physical
    Theory of Diffraction. In this work, Ufimtsev built a foundation for scattering
    incident radar electromagnetic waves by carefully designing abrupt surface discontinuities
    or sharp edges so that signals reflected back to radar can be minimized [4, 5].
    In other words, a carefully designed aircraft can have a very small radar cross
    section. Although the Soviet Union did not consider this approach practical, thus
    not classifying Ufimtsev’s work, the US recognized its importance and began to'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'test this concept. Ufimtsev’s work was translated into English and can be freely
    downloaded from the Internet now [5].


    One issue about stealth aircraft is that it adds additional constraints to the
    aircraft design. As we have seen in the case of RAM, to design an aircraft that
    can scatter radar signals so that radar cannot detect the aircraft is one thing;
    to have an aircraft frame with controllability and maneuverability suitable for
    an air battle is another. When the US began to test Ufimtsev’s theory, Lockheed
    Martin called its prototype the Hopeless Diamond, which is shown in Figure 8.1.
    This name is a pun on the famous Hope Diamond. One can see from the figure that
    the “diamond” part of this nickname is a reference to the shape of aircraft. The
    “hopeless” part is a tribute to the design challenge accompanying the stealth
    requirement. Even after making stealth aircraft for more than four decades, in
    2018, Lockheed Martin’s management stated that half of the F-35 defects resulted
    from its stealth features. To some degree, designing a stealth aircraft is like
    designing a silent race car to win an F-1 race. Of course, the philosophy of stealth
    aircraft is that if the enemy’s radar cannot detect the aircraft, then the fight
    is over before it even starts as the stealth aircraft can conveniently destroy
    its opponents before they are aware of its existence. It is like the race car
    driver driving a silent race car starting and finishing the race before other
    race car drivers realize that the race has started.


    ![](img/ff55c581d8704d3a62714cacfc830da5_143_0.png)


    **Figure 8.1** Hopeless diamond (https://en.wikipedia.org/wiki/Lockheed_Have_Blue#/media/File:Have_Blue_bottom_view.jpg).'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Besides reducing the probability of an aircraft being detected by a radar,
    a stealth aircraft should also reduce its heat emission, visibility to the naked
    eyes, etc. As this book is mainly about radar and EW systems, these topics are
    not covered here.


    # 8.3 Passive Radar for Stealth Aircraft?


    The stealth aircraft is designed to be invisible to many radars, but it might
    not be so invisible if illuminated by a radio wave of lower frequency such as
    broadcasting TV or radio signals whose frequency is lower than the frequency of
    the radars that the stealth technology is designed against. The reason is that
    a lower frequency radio signal has a longer wavelength (wavelength = speed of
    light divided by frequency) and for a long-wavelength radio signal, the whole
    aircraft is like an antenna reflecting signals back. A passive radar does not
    emit signals to actively search for targets. Instead, it relies on signals emitted
    by other sources such as radio and TV stations and signals reflected from the
    aircraft. By comparing signals transmitted directly from a transmitter at a known
    location, say a TV tower, and signals reflected from an object, the passive radar
    can locate its object. In 2019, German radar maker Hensoldt claimed to have used
    its passive radar to track two F-35s attending the 2018 Berlin Air Show in Germany
    for 150 km and this news stirred up quite a few discussions [7].


    So, what is the issue of using a radar with longer wavelength to track stealth
    aircraft? The answer is the precision. A longer wavelength radar has a coarse
    resolution. Simply knowing an aircraft is in a ballpark range is not good enough
    to guide a missile or anti-aircraft artillery against it. Hensoldt also admitted
    that their radar precision was not enough to guide a missile (yet). On the other
    hand, just like a commercial GPS receiver uses signals from multiple satellites
    and a network of fixed reference stations to improve its precision, it is also
    possible to use a network of passive radars exploiting multiple transmitters to
    improve the precision. The game between radars and stealth aircraft surely will
    continue.


    # 8.4 Battle Example: 1999 F-117A Shootdown


    On March 27, 1999, three days after NATO began bombing Yugoslavia to force Yugoslav
    (mainly Serbian) armed forces to withdraw from Kosovo, the Yugoslav army achieved
    something no other country had ever managed to accomplish before or since: shooting
    down a stealth fighter. More'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'astoundingly, the Yugoslav army used the Soviet Union’s SA-3 surface-to-air
    missile (SAM) designed in the 1960s to bring down US’s F-177 which was successfully
    used in the 1990–1991 Operation Desert Storm. Soon, the Serbian government made
    anti-NATO posters with the catch phrase “Sorry, we didn’t know it was invisible”
    (see Figure 8.2). So, how could it be possible? The official report on this episode
    might remain inaccessible to public for a long time, but an explanation based
    on a US Air Force aerospace engineer Chris Morehouse’s online post is pretty plausible.


    Aware of the US’s EW capability, the Serbian force kept relocating its missile
    sets; therefore, unlike the Iraqi force losing its anti-aircraft capability at
    the beginning of Desert Storm, Serbian’s SAMs were largely intact after the bombing
    started, and they could set up a missile set quickly to attack. Probably, due
    to the US’s overconfidence about its air superiority, US’s F-117 were set on the
    same route to strike and this practice gave Serbian force an opportunity to prepare
    for its ambush along the route. The Serbian SA-3


    ![](img/ff55c581d8704d3a62714cacfc830da5_145_0.png)


    Figure 8.2 Serbian poster (https://www.reddit.com/r/dragonutopia/comments/d6fom6/
    sorry_we_didnt_know_it_was_invisible_propaganda/).'
