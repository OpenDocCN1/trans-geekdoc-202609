  md: 'look obvious and easy to accomplish. However, when one actually works on it,
    there might be overwhelming problems and the solutions are no longer obvious.
    As people often say, “the devil is in the detail.”


    # 4.8 Some Common Problems of Intercept Receivers


    Intercept receivers have many potential problems in practice originating from
    their unique requirements. These problems happen to almost all types of intercept
    receivers. For example, if an intercept receiver is designed to intercept signals
    within a certain frequency and power range. Then, signals with frequency and power
    in these specified ranges should be detected correctly. If there is only one input
    signal, most intercept receivers will produce the correct result. However, even
    if there are just two input signals, various errors can occur. When two signals
    with different power are received at different times but their pulses overlap
    or have close frequencies, detection errors might happen. There are countless
    possibilities of generating erroneous data and two examples are given here: (1)
    missing signal: the receiver might miss one or both signals; (2) generating false
    signals: the receiver might report a signal when there is no such signal at the
    input of the receiver. People might call the first case false negative and the
    second case false positive.


    The general rule for an electronic warfare system is that it is preferable for
    the receiver to miss a signal rather than generate false alarms. A missed signal
    might be detected at a later time, but false information may mislead the electronic
    warfare processor. The electronic warfare processor takes data generated from
    the intercept receiver and tries to derive information about radar from it. If
    the data is inexplainable, the electronic warfare processor will spend valuable
    time and resources to figure them out. Worse yet, sometimes the electronic warfare
    processor may produce erroneous radar information based on false data and initiate
    countermeasure to expose the aircraft. The rest of this chapter will focus on
    electronic warfare processors.


    # 4.9 Human Electronic Warfare Processor and “SAM-Song”


    When James Tsui started to work for the US Air Force Research Laboratory (AFRL)
    in 1973, his officeate was a second lieutenant named Chris. Chris was an electronic
    warfare officer. The name of the research laboratory James worked for changed
    many times during James’ employment and the name used here is a generic name which
    is also its current name. At the beginning, James was in the process of obtaining
    his security clearance.'
