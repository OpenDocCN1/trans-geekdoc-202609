    Besides a high false alarm rate, another issue of an IR missile approach warning
    system is the atmosphere''s absorption of infrared radiation. As shown in Figure
    6.2, before any infrared radiation reaches a receiver, it passes through atmosphere
    and the infrared radiation is absorbed during this propagation. Making things
    even more complicated, this absorption depends on air composition. Different types
    of molecules absorb infrared radiation of different wavelengths and the air composition
    is altitude dependent. So, when infrared spectrum is measured and used for detecting
    an approaching missile, two things need to be considered: the radiation spectrum
    and the atmospheric absorption spectrum. In addition, water is a very strong infrared
    absorber, thus the infrared receiver does not function well in bad or foggy weather.


