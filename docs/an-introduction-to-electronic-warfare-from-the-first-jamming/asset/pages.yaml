    # ### 4.4 Crystal Radio Receiver


    This first field electronic warfare receiver was a crystal video receiver. The
    crystal video receiver is closely related to the crystal radio receivers which
    some readers might have built as a science project and they will be introduced
    here.


    When James Tsui was a sixth grader in Qingdao China, the port city famous for
    its beer, one of his classmates taught him how to build a crystal radio receiver.
    His classmate acquired this knowledge from his elder brother. At that time, there
    were only commercial AM radios built with vacuum tubes, but the Tsui family did
    not own one. James Tsui was addicted to this crystal radio project and invested
    all of his after-school hours and allowance on it.


    There are four major parts in a crystal radio. The two expensive parts are a tunable
    capacitor used in an old analog radio and a pair of earphones. These two parts
    could be easily bought from the flea market where plenty of used US military electrical
    parts were sold at a reasonable price. At that time, the US Navy and Marines were
    stationed in Qingdao (Qingdao was the headquarter of the Western Pacific Fleet
    of the US Navy from 1945 to 1949 until Chinese Communists took over China). The
    other two parts were a coil and a crystal detector. James and his classmate bought
    old transformers from the flea market to get the insulated copper wire. They then
    wind insulated copper wires on a section of bamboo to make the coil. The crystal
    they used was a piece of native copper purchased from a Chinese herbal store (native
    copper is a traditional Chinese medicine). Native copper is a natural mineral
    coming in different sizes and shapes. The native copper they bought was roughly
    a cube with less than 1 cm on each side. The color was dull brown. After being
    cracked, a shiny metal surface would appear. James learned all these tricks from
    his friend.


    The coil and tunable capacitor of the crystal radio were used as radio tuner tuned
    to the frequency of a certain AM radio station. The tunable capacitor was used
    to change receiver frequency. The crystal was used to detect the amplitude of
    the radio signal and output audio signals to earphones. Nowadays, a diode is often
    used to replace the crystal. When James Tsui took'
