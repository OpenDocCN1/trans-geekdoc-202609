- pgno: 59
  md: '# ## 3


    # ## Overall View of Electronic Warfare


    # ### 3.1 Introduction


    Radar is a powerful piece of equipment for detecting aircraft. The days of looking
    for aircraft in the sky with the human eye are of course long over. In air warfare,
    in most scenarios, a jet fighter locates an adversary’s jet fighter through an
    airborne radar at a relatively long distance and fires at it. The short-distance
    air dogfight between jet fighters portrayed in movies probably will happen less
    and less as those who are able to detect and lock the enemy at a longer distance
    might eliminate their enemy before their enemy sees them. Therefore, it can be
    safely stated that radar is a major threat to aircraft. It finds them, tracks
    them, and often guides missiles to destroy them. The radar can be considered as
    the eye of military operations. The main subject of this book is electronic warfare.
    The radar alone does not create electronic warfare, but it can be considered as
    the origin of electronic warfare, or the first layer of electronic warfare.


    Electronic warfare operations can be divided into four layers, as illustrated
    in Figure 3.1. The first layer is radar searching and tracking operations discussed
    in Chapter 2. The second layer of electronic warfare is the receiver’s radar signal
    interception and radar classification operation. After the radar signal is identified,
    the third layer of operation, countermeasure, might be used to neutralize hostile
    radar. The last layer of electronic warfare is radar’s counter-countermeasure
    to protect itself. This first layer was covered in Chapter 2 and this chapter
    provides a brief introduction to the operation of layers 2–4. More details will
    be provided in the following chapters. People might name these operations differently
    and there are no universal accepted definitions. Different technical terms may
    refer to similar operations with slight difference and these different names may
    be only familiar to electronic warfare professionals. In this book, the names
    for the four layers of operations are simply the authors’ preferences. If other
    technical terms are used in discussions, they will be explained.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_60_0.png)


    **Figure 3.1** Four layers of electronic warfare operations.


    Both the second and third layers of electronic warfare operations are performed
    on the target aircraft. The second layer of operations is called electronic support
    measures (ESM) by some researchers. They are also referred to as passive electronic
    warfare because these operations do not emit signals. Radar is an active piece
    of equipment because it transmits signals to find objects, thus making passive
    electronic warfare possible. It is worthy of mention that some passive radars
    that rely on signals of opportunities like TV and radio signals to detect objects
    without emitting signals exist, but, to the best of authors'' knowledge, they
    are not capable of guiding missiles causing damage and thus are only discussed
    briefly in this book. The target aircraft must determine whether it is being illuminated
    by a hostile radar or not. If it is indeed illuminated by a hostile radar, hopefully,
    the radar cannot see it. As shown in Equation (2.1), the energy of signal reflected
    back to the radar is proportional to target''s cross section area; so a radar
    can only detect targets with cross section large enough. It should be emphasized
    that a target''s cross section area is not necessarily proportional to its physical
    size. Technology used to reduce the target''s probability of being detected by
    radar, such as reducing the aircraft''s cross section with a specially designed
    body shape or using special paints to absorb radar signals, are called stealth
    technology. Although the stealth technology is an important part of aircraft design,
    it cannot be ascribed to one of the four layers of electronic warfare operations'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'as the stealth technology has not been developed to detect the existence of
    a radar signal or jam the radar. In other words, besides the four electronic warfare
    layers described here, there are related technologies such as stealth technology
    worthy of discussion and they will be discussed in Chapter 8.


    The third layer of electronic warfare operation is to protect the target aircraft
    by interfering radar operations. The operations include sending noise to mask
    the target of the radar (jamming) or false signals to mislead the radar operators
    (spoofing). Since signals are transmitted in this operation, sometimes this is
    referred to as active electronic warfare. This operation might also be called
    electronic attack (EA). A more aggressive approach is to physically destroy the
    radar.


    The fourth layer of operation is the radar’s reactions to protect itself against
    hostile operations the target aircraft is conducting. Its purpose is to mitigate
    the effect of the interfering signals from the target aircraft.


    # ## 3.2 Second Layer Operations: The Radar Signal Intercepts Performed on the
    Aircraft


    An aircraft tracked by a radar not aware of the radar’s operation could be in
    a great danger. Therefore, the operator of the radar’s target aircraft must develop
    defensive techniques to protect itself. First, one must determine whether one’s
    aircraft is being illuminated by a radar. A receiver is needed to receive all
    different radar signals and this type of receiver is referred to as the electronic
    warfare receiver or intercept receiver.


    The main difference between an intercept receiver and the radar receiver discussed
    in Section 2.10 is that the radar receiver can distinguish the radar signal it
    is looking for, but the intercept receiver might assume no knowledge about radar
    signals. The radar receiver needs only to receive one signal, but an intercept
    receiver needs to receive all the radar signals in a battlefield. Worse yet, some
    radars are designed to avoid being detected by an intercept receiver and they
    are called low-probability-of-intercept (LPI) radar. Some LPI radar working principles
    will be discussed in Section 3.8 and Chapter 9.


    Since the intercept receiver needs to cover a broad bandwidth, it receives noise/interference
    from a wide range of frequencies, thus having much lower sensitivity than a radar
    receiver. A receiver with higher sensitivity can detect weaker signals. However,
    the signal received by the intercept receiver is much stronger than the skin return
    as described in Section 2.5; so the intercept receiver with sensitivity lower
    than the radar receiver can still fulfill its'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'designed goal. This is why some people might claim that electronic warfare
    is based on that single equation, Equation (2.1), in Section 2.5.

    Although electronic warfare is a specialized field, people can actually find similar
    products in everyday life. The traffic radar detector used by some drivers to
    avoid speeding tickets is a kind of intercept receiver or a radar warning receiver.
    Its goal is to detect the existence of a police radar gun before the police can
    measure the vehicle’s speed. Some people joke that a poorly designed traffic radar
    detector can only provide a driver extra time to reach his/her wallet because
    when the radar detector detects the radar, the police has already obtained the
    vehicle’s speed.


    # **3.3 Second Layer of Operations: Signal Classification and Identification Performed
    at the Aircraft**


    In a battlefield, there may be many different types of radar. Some are friendly
    and some are hostile. The intercept receiver is designed to receive all signals
    reaching the aircraft. If the intercept receiver is at high altitude, it will
    be illuminated by many types of radar. Sometimes, an intercept receiver can receive
    tens of thousands or even a million signals per second. However, only threat signals
    are of interest. The signal classification conducted by the electronic warfare
    processor begins with grouping all signals from a certain radar together. Once
    all signals from one radar are collected, the parameters of these signals, i.e.
    the frequency, the pulse width, and the time between pulses, can be extracted.
    These parameters are then used to identify the type of radar with the help of
    a radar database. If the radar is a threat radar, some actions must be taken.
    If the signal is guiding a missile toward the aircraft, the response time is in
    the order of seconds. On the other hand, if the radar is not an imminent threat,
    action may not be needed.


    Of course, one must establish a library of radar signals and the library must
    have all the information on hostile radars. It is not an obvious job. The signal
    collection may be very difficult and time consuming. This military operation is
    known as ELINT (Electronic INT elligence) collection. ELINT collection means collecting
    all radar signals, communication signals, and electronic signals from various
    sources. The collection can be performed from land, ship, aircraft, or even satellite.
    A huge amount of data will be collected and processed to obtain the useful information.
    It might be comparable to gold mining: extracting a small amount of gold from
    huge amount of sand, gravel, and rock. Not having information about hostile radar
    can be very costly. During the Vietnam War, whenever North Vietnam obtained a
    type'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'of missile equipped with new radar from the Soviet Union, the loss of US aircraft
    spiked [1]. The loss decreased only after the US military learned more about North
    Vietnam''s new radar.


    As one can image, the development of radar need be kept strictly secret and, in
    military operations, radar signals should not be transmitted unless absolutely
    necessary, especially when a new radar is in use. In some cases, the radar antenna
    might be replaced by a dummy load and the transmitted signal is absorbed by the
    load during exercise or testing. Surely this type of practice has its limitations
    in terms of collecting experimental data for developing new radar. Nevertheless,
    they make potential enemy''s task of collecting information about new weapon radar
    more difficult.


    # 3.4 Third Layer of Operation: Electronic Countermeasures (ECM)


    Once a threat is detected in a battle field by the target aircraft, several operations
    can be taken to protect the aircraft. These countermeasures may not be all electronic
    measures. For example, if a heat-seeking missile is launched against an aircraft,
    the pilot can eject heat sources to distract the missile. These heat sources are
    referred to as flares. If the missile is guided by a radio signal, one can emit
    chaffs. Chaffs are made of very thin aluminum foils cut into very narrow strips.
    The lengths of the strip vary but generally only by a few inches and are comparable
    to the wavelength of the threat radar signals. The chaffs will be suspended in
    air for a period of time and reflect radar signals back to the radar. The purpose
    of the chaff is to create a large number of false targets around the true target
    in the radar display, thus making the radar lose the accurate target position
    measurement. These two methods are considered as passive countermeasures because
    they do not emit signals. They are very important technology and will be discussed
    in Chapter 7.


    In order to track an aircraft and finally bring it down, the radar will go through
    several steps such as search, acquisition, tracking, and finally launching a missile.
    If any of these steps are interrupted, the radar may not reach the final step
    of shooting at the target. It is much better to act against the radar and stop
    it from obtaining information about the aircraft situation at the early stages.
    If the radar is sending a missile to the target, the situation is life or death.


    Plenty of methods can be used to disturb hostile radar operations. A common approach
    is to jam the radar by retransmitting the radar signal back to the radar to distract
    its operation. Since the strength of signal reflected'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'from the target aircraft is rather weak due to the term of $1/r^4$ in radar
    range equation, Equation (2.1), the jamming signal can be much stronger than the
    reflected radar signal. Another obvious solution is to emit a noise to mask the
    true signal on the radar screen. However, as noise covers a broad bandwidth, the
    energy of noise getting into the radar receiver is limited by the receiver bandwidth.
    There are numerous approaches for jamming radars and specific technologies are
    required against specific radars.


    All the methods of using signals to interrupt the radar operation are called electronic
    attack because they emits electromagnetic waves to disrupt the radar operations.


    # 3.5 Third Layer of Operation: Aircraft Tracked by a Radar Can Send a Missile
    to Destroy the Radar


    Aircraft tracked by a hostile radar must protect itself from being destroyed.
    If the radar is land based, the aircraft might send an air to ground missile to
    destroy the radar. The missile can use the radar signal as guidance (beacon).
    This type of missile is called a high-speed anti-radiation missile (HARM). Thus,
    the radar is vulnerable as well. If a radar is only concerned with offense, that
    is, to destroy the hostile aircraft but ignore its own protection, it can be easily
    annihilated by an anti-radiation missile. In order for a radar to protect itself,
    it must limit its transmitting time. Long operation time may put a radar in a
    dangerous position. For this reason, the radar should transmit signals only when
    necessary.


    The general rule of any military operation is that both offense and defense must
    be considered at the same time. In many competitive games such as chess and Go,
    every move should be made by considering both. For a competitive player, the decision
    leading to victory or defeat often depends on whether they can be one move ahead
    of their opponent. The radar and the target aircraft are in a similar situation.
    One that is one step ahead can destroy the other instead of being destroyed like
    what is portrayed in the US Air Force Song, \u201cWe live in fame or go down in
    flame. Hey!\u201d.


    # 3.6 General Discussion on Second and Third Layer Operation


    The second and third layers of electronic warfare operation include intercepting
    radar signal, identifying signal, attacking the radar electronically or with a
    missile, etc. It should be noted that all equipment for the second and'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 3.6 General Discussion on Second and Third Layer Operation  45


    third layer operation are located on the aircraft. All the operations are almost
    equally important for the aircraft''s survivability. These operations and their
    relations will be discussed here.


    First, let us consider the radar signal interception and classification. Among
    all the radar signals intercepted, only the threat radars are the top priority.
    Once the threat signals are identified, an active electronic warfare technique
    will be applied to disrupt the radar operation. The threat signals being jammed
    does not interest the intercept receiver. In addition, for reasons to be discussed
    in following paragraphs, the intercept receiver cannot receive radar signals which
    are jammed. However, this does not mean that the jammed threat radar signals no
    longer reach the intercept receiver. The electronic warfare processor just ignores
    these signals and concentrates on finding new threats. In other words, the intercept
    receiver should still receive and identify other radar signals to find additional
    threat radars.


    Since the jammer and intercept receiver are co-located in the same aircraft, when
    a jamming signal is turned on, it will mask the intercept receiver. If the jamming
    signal is noise, it has a very broad spectrum and can block a big portion of the
    intercept receiver''s working bandwidth. Even if the intercept receiver has a
    wide working bandwidth, which will be discussed in Chapter 4, a narrow band jamming
    signal can still potentially block all the receiver operations. For this reason,
    once a radar signal is jammed, the intercept receiver can no longer see it since
    the receiver''s capability of receiving this signal has been sacrificed by the
    jamming signal from a colocated jammer.


    On the other hand, the jammer cannot stop jamming the radar as long as the radar
    is in operation. If the jamming signal stops, the radar will operate in normal
    mode, which can threaten the aircraft. When the jammer is on, the intercept receiver
    cannot receive the jammed radar signal and it cannot be certain about whether
    the radar is still operating. If the radar stops transmitting and the jammer still
    sends out a jamming signal, the jammer wastes its jamming power. Worse yet, a
    missile sent by the radar can use the jamming signal from the aircraft as a beacon
    signal. This operation is called home on jamming. As mentioned in previous sections,
    any equipment that transmits a signal might expose itself to danger. Therefore,
    when the radar is off air, the jammer must stopping jamming.


    In order to check whether the threat radar is still transmitting or not, the jammer
    must stop periodically to let the intercept receiver determine the radar''s situation.
    As all the information on the radar is already known, this operation is rather
    simple. The terminology that refers to this operation'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'is called the intercept receiver''s look through window. If an aircraft is
    not jamming a victim radar, its intercept receiver can be fully functional. Because
    the receiver is a passive device, it does not expose the aircraft. If the jammer
    is on, the intercept receiver will have limited operation capability.


    There are multifarious ways to jam a victim radar. If a radar is jammed by noise,
    the radar operator will recognize that the radar has been jammed because the noise
    wipes out the radar display. There is also deceptive jamming, which provides erroneous
    information to the radar operator. Under this situation, the radar operator may
    or may not be aware that it is being jammed. The latter operation is sometimes
    referred to as spoofing.


    # 3.7 Electronic Warfare Aircraft


    All of the previous discussions assume that the radar is used against aircraft
    and the aircraft might attack the radar. The main mission of a fighter aircraft
    is to attack enemy aircraft or ground targets. Its equipment used against hostile
    radars is quite limited and is only for self-protection.


    Since radar is the main threat to aircraft, there are aircraft built just to operate
    against hostile radar and they are called electronic warfare aircraft. The equipment
    on these aircraft can be very sophisticated. Therefore, they are more effective
    in terms of disturbing radar operations. These aircraft can go into the battlefield
    and perform all the operations discussed in this chapter up to now except for
    launching missiles against radars. This practice is more effective because the
    hostile radar illuminates electronic warfare aircraft directly and they can detect
    and jam the radar signals through the radar antenna''s main lobe. The major risk
    for an electronic warfare aircraft being at battlefield is that they are defenseless
    and the enemy can easily attack them.


    Another way of operation is to have electronic warfare aircraft stay away from
    the battlefield and remain outside the adversary''s missile range. The electronic
    warfare aircraft can fly in a certain pattern inside a safe zone. Under this condition,
    the hostile radar may not detect the electronic warfare aircraft. For example,
    if the range of the radar is 150 km, an electronic warfare aircraft can detect
    a hostile radar signal outside the radar''s range, say somewhere between 150 and
    300 km without being detected (remember the discussion in Section 2.5). In addition,
    the aircraft may not be in the main lobe of the radar antenna. Because an antenna
    may have many side lobes, the radar can still receive signals from side lobes.
    Nevertheless, in order to detect a radar signal in the radar''s side lobes, the
    sensitivity of the intercept receiver must be high. For the same reason, a strong
    jamming signal is necessary for getting into the radar receiver through radar
    antenna''s side lobes.'
