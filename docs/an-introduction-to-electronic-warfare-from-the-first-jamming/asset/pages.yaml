    Since the infrared tracking is passive, there is no guidance signal to detect.
    So, once an aircraft detects an approaching missile, the IR countermeasure must
    be applied immediately, even if the missile guidance system is not known.


    As the IR missiles follow heat, their countermeasures are based on creating bright
    spots or directing radiation to the missile to deceive the missile’s guidance
    system. The IR jammer can be either omnidirectional or directional. The omnidirectional
    jammer uses a high power infrared light source such'
