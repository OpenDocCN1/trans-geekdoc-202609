    the target’s traveling direction must be taken into consideration. If the target
    travels in a tangential direction, the measured speed is zero, as explained in
    Figure 2.14. In other words, if there is a speeding vehicle with its side facing
    the police radar, the radar gun cannot measure the speed of the car.


    One may think that the search radar can send RF pulse trains to measure the distance
    and use the Doppler frequency to measure speed of the target. There is a fundamental
    limitation in this approach though. According to Heisenberg’s uncertainty principle,
    one cannot measure both the position and velocity (or momentum) accurately. In
    order to measure a distant target, the pulse separation must be long (i.e. the
    pulse repetition frequency is low) to eliminate range ambiguity, as discussed
    in Section 2.7. This design decreases radar’s measurement ability in the frequency
    domain and the Doppler radar determines the target’s speed based on the frequency
    shift caused by the Doppler effect. To improve the frequency measurement capability,
    the pulse separation must be short (i.e. the pulse repetition frequency is high).
    Thus, Doppler radar has high or medium pulse repetition frequency.


    # 2.16 Continuous-wave Radar


    Most of the radars considered in this book are pulse radar but continuous- wave
    (CW) radar is also used in some scenarios. The CW is refers to a contionous microwave
    signal with a fixed frequency. One might picture a CW signal as a sinusoidal wave.
    Unlike the pulse radar described in Section 2.7 which sends out a short pulse
    and waits for its skin return before sending the next short pulse, the CW radar
    continuously emits a CW signal. If the object is moving, the frequency of reflected
    signals will change, as explained in Sec- tion 2.15, and the CW radar can then
    detect the object based on the Doppler effect. The major advantage of a CW radar
    is its easy implementation since it does not have to generate a strong short pulse
    signal. Moreover, as a CW radar'
