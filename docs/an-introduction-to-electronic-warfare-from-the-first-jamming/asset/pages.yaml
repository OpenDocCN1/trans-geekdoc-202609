    # ## 9.6 Countermeasures of LPI Radars


    The LPI radar’s low signal power makes its detection difficult especially via
    analyzing a short segment of the intercepted radar signals. In addition, the LPI
    radar’s long duty cycle (in the case of FMCW, the duty cycle is 100%) and low
    power reduce the chance of the intercept receiver observing signal power fluctuation.
    So, to detect and classify LPI radar, the intercept receiver needs to analyze
    a longer segment of received signal with a more advanced signal processing algorithm.
    Some popular methods for detecting LPI radars such as the Wigner Ville distribution
    (WVD) or the Choi–Williams distribution (CWD) are designed to analyze how a signal’s
    frequency component changes over time and they are in the category of time-frequency
    analysis. As this book focuses on fundamental principles and these methods require
    advanced mathematical concepts to explain, they are not covered in this book.


    Not only is the LPI radar difficult to detect, it is also tough to jam. Noise
    jamming does not work well for two reasons. LPI radars such as the FMCW radar
    uses a signal with a wider bandwidth, so jamming noise needs to cover a broad
    bandwidth. Moreover, the LPI radar often uses cross-correlation at the receiver
    side and there is no similarity between jamming noise and'
