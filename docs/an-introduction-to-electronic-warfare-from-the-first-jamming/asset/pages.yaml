- pgno: 177
  md: '![](img/ff55c581d8704d3a62714cacfc830da5_177_0.png)


    **Figure 10.10** Simplified deep-Q learning.


    the highest Q-value. However, this approach requires each combination of states
    and actions to be visited in the training process. This requirement is not realistic
    when there are a large number of states. To solve this problem, deep-Q learning
    is proposed.


    A simplified deep-Q learning diagram is shown in Figure 10.10. A neural network
    uses a state as input and as output the Q-value of each possible action. When
    an action is taken, the reward it generates is used to update the Q-value and
    train the neural network. After the network is well-trained, in any state, the
    action with the highest Q-value will be recommended. Although this concept of
    deep-Q learning is straightforward, it has an inherent issue: the neural network
    chases a moving target. When the neural network is updated, the calculation of
    the Q-value is also changed. As a result, deep-Q learning does not always generate
    a stable outcome and some modifications are necessary. Fixing deep-Q learning
    is one of DeepMind’s major contributions. However, we will stop our discussion
    about deep-Q learning here before it becomes too complicated for an introductory
    book.


    A policy can be deterministic or stochastic. A deterministic policy means the
    agent always takes the action that is supposed to produce the biggest reward.
    The stochastic policy means the agent takes an action based on a predetermined
    probability. For example, the agent might take an action with the highest Q-value
    95% of the time, and the probability of the agent taking other actions is 5%.
    The reason for stochastic policy is to explore new actions so that the machine
    can learn some new tricks.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Despite reinforcement learning stunning the world by dominating the human in
    the game of Go, there are some significant differences between Go and EW. In a
    game of Go, every piece of information about a current situation is available
    and any possible move the opponent can make is known. By contrast, for an EW system,
    not all information is known for certain; the enemy might conceal its intentions,
    and, worst of all, an EW system does not necessarily know every move its adversary
    can make and might not have appropriate countermeasures. For example, a new type
    of missile might be secretly deployed. A reinforcement learning system that keeps
    learning during the operation (just like a pilot or an EW officer) might alleviate
    this problem. However, such a system could require a huge number of calculations
    and the risk of losing it to the enemy’s hands could be too tremendous to take.
    Cloud computation that handles calculations remotely might be a possible solution
    in this case.


    # ## 10.5 Possible Issues of Applying Machine Learning for EW


    Machine learning has shown great potential or value in many fields and companies,
    making an early investment on machine learning like NVIDIA, profits greatly from
    its forward thinking. We have seen some applications of machine learning in EW
    and it is guaranteed that more machine learning methods will find their advocates
    among EW researchers. Nevertheless, there is one major difference between EW and
    other fields: the lack of training data. For machine learning to perform well,
    a great amount of training data is needed but radar operators would like to keep
    their radar signals secret. In the case of reinforcement learning, sufficient
    episodes need to be played in a realistic environment to train the system well,
    but a new radar not considered in simulation or a radar whose functionality is
    not fully understood might make previously learned policies unserviceable. How
    well machine learning can help EW with a limited amount of information might be
    questionable. Nevertheless, the issues of a limited amount of training data in
    other applications such as credit fraud detection (normal transactions significantly
    outnumber fraudulent transactions) are something machine learning experts have
    been long aware of. Techniques like generating synthetic training data based on
    real data might be helpful in training an EW system; however, the verdict is still
    out.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# ### 10.6 Conclusion


    This chapter introduces some current and potential applications of machine learning
    in EW. Machine learning is a rapidly changing field, and this chapter only covers
    few selected basic machine learning concepts and omits much detail. Readers interested
    in machine learning can find some accessible references at the end of this chapter
    and there are many free tutorials and books available online. Besides the applications
    covered in this chapter, machine learning might be useful in other EW applications
    like RF component signature identification, anomaly detection, etc. However, something
    that should be borne in mind is that machine learning can be used to improve both
    EW systems and radars. So, it will be probable that when one machine learning
    technology is used by EW engineers to combat radars, engineers on the other side
    might use the same or a different machine learning technology to fight back.


