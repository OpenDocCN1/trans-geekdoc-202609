  md: '# Obtaining Deep Learning Models for Automatic Classification of Leukocytes


    # INTRODUCTION


    The number of leukocytes present in the blood, also known as white blood cells,
    provides important information regarding the state of the immune system, allowing
    to evaluate potential health risks. significant change in the number of leukocytes,
    relative to reference values, is usually a sign that the body is affected by some
    type of antigen. Moreover, the variation in a particular white blood cell type
    is generally correlated with a specific type of antigen.


    White blood cells are generally classified into 5 categories: lymphocytes, monocytes,
    neutrophils, eosinophils, and basophils. There is also the band designation for
    a specific form of the nucleus. Figure 1 shows examples of these categories.


    > Figure 1. Leukocyte types (from left to right): Neutrophil, Eosinophil, Basophil,
    Lymphocyte, and Monocyte (Noble, 2019)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_21_0.png)


    The preparation and analysis of blood samples are usually affected by deviations
    naturally introduced by manual operations. These difficulties can be minimized
    when performed by highly trained technicians. However, these tasks are labor-intensive
    and time-consuming and always subject to error. For these reasons, there is interest
    in systems that can automatically classify with high specificity and high sensitivity.


    The evolution of techniques for counting and identifying leukocytes (and blood
    cells in general) began in the mid-nineteenth century with the use of capillaries
    and slides. Over the years, several types of devices designed to count blood cells
    have appeared, which would allow their classification.


    The classification of blood cells has always been done by human specialists until
    the 1960s, since there emerged the possibility of automating this. Firstly, through
    the use of optical and impedance methods and later algorithms developed specifically
    for this purpose from microscopy images within the scope of computer vision and,
    by using neural networks.


    Several researchers have presented papers for leukocyte identification and counting.
    Techniques that use classic machine learning, are built on manually selected characteristics.
    This approach can use neural networks (Rezatofighi & Soltanian-Zadeh, 2021; Naziblek
    et al., 2014), Support Vector Machines (SVM) (Rezatofighi & Soltanian-Zadeh, 2011;
    Putz et al., 2014; Agaian et al., 2014; Alférez et al., 2016; MoradiAmin et al.,
    2016), Bayes classifiers (Stathonakos et al., 2013; Priyakupt & Pluemptiriwiyaraj,
    2015), etc. The manipulation of characteristics, prior to the classification model,
    may involve segmentation (Chaira, 2014), extraction and selection of features
    that describe the leukocyte defining region (Alférez et al., 2016). Thus, we can
    divide these classic processes into three stages: segmentation, feature extraction,
    and classification. These approaches'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Obtaining Deep Learning Models for Automatic Classification of Leukocytes


    have the advantage of using the reality of small datasets, as the segmentation
    and the features used reduce the variability of the patterns delivered to the
    classification models. On the other hand, the segmentation performance and the
    lack of universality of the descriptors can limit the result achieved by the classification
    models. An example of this approach is found in Dan et al. (López-Puigdollers
    et al., 2020), where features using SIFT (Lowe, 2004) are employed. However, the
    assertiveness of the classification is not very high.


    The use of deep learning models tends to solve the problems in the approach described
    above, provided that the dataset is sufficiently representative of the pattern
    variability, associated with leukocyte optical visualization, or a transfer learning
    approach is employed, as is the case of the present work.


    Recognition models based on convolutional neural networks (CNNs) have performed
    well in many applications. In this sense, studies appear in the literature where
    the use of CNNs is applied to leukocyte detection and recognition (Zhao et al.,
    2016). However, the accuracy presented in that paper for the identification of
    five base is not high (70% and lymphocyte 75%). Other authors (Shahin et al.,
    2019), who also use CNNs to classify rather than detect the five base leukocytes,
    show that results exceed the classical approach (accuracy: 96%), so it can be
    deduced that the separation between detection and classification is beneficial
    for most methods. Using CNNs require leukocytes to be already segmented (Shahin
    et al., 2019; Choi et al., 2017; Jiang et al., 2018; Qin et al., 2018; Rehman
    et al., 2018 and Tiwari et al., 2018). In this context, there are approaches to
    CNNs: (e.g.) Regions with CNN features (R-CNN) (Girshick et al., 2020), Faster
    R-CNN (Ren et al., 2017), based on architectures that simultaneously integrate
    both tasks -detection and classification-. These architectures start from a preprocessing
    step where regions of interest are identified for subsequent unification using
    a CNN-based training step and further classification.


    Other architectures are one-stage and full integrate detection of leukocyte: e.g.,
    You Only Once (YOLO) (Redmon et al., 2020), YOLO2 (Redmon & Farhard, 2020), YOLOv3
    (Redmon & Farhard, 2020), and Single Shot MultBox Detector (SSD) (Liu et al.,
    2020). Wang et al. used SSD and YOLOv3 models for the detection and classification
    of leukocytes, reaching a mean average of 93% (Wang et al., 2019). This value
    is noteworthy since this work shows the classification of types of leukocytes,
    while most use the five base leukocytes.


    In the present work, the proposal is the classification of leukocyte images using
    the winning work architectures (with the exception of one) of the annual ISLVRC
    (ImageNet Large Scale Visual Recognition Challenge) software competition where
    programs compete to detect and classify objects and scenarios (Russakovsky, et
    al., 2015). The identification of leukocytes is made using pre-trained networks
    and these same network architectures trained from scratch to select the best network
    and the best approach for the intended task.


    # BACKGROUND


    The difficulty of pattern recognition in images becomes apparent when we try to
    write a computer program that recognizes leukocytes in microscopy images. When
    we use for a set of rules for the recognition of forms, we quickly lose ourselves
    in an immensity of exceptions and special cases. Neural networks (ANN) approach
    this type of situation differently (Nielsen, 2017). The most common type of feedforward
    networks - MLP (multilayer perceptron) - neurons are organized in layers that
    have one'
