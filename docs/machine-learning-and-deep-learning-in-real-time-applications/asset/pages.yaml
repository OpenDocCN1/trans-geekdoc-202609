  md: '# About the Contributors


    **Mehul Mahrishi** is currently working as an Associate Professor in the faculty
    of computer Science & Engineering at the Swami Kesvanand Institute of Technology,
    Management and Gramoth, Jaipur – India. He is a Professional Member of IEEE Delhi
    Section, Life Member of Institution of Engineers, India (L-IEI) and Life member
    of Indian contingent of BRICS International Form that travelled to Moscow, Russia
    to attend Russian Energy Week-2018 and BRICS Youth Energy Summit. He has published
    more than 20 research papers in national and international Journals/conferences
    including 19th SoCTA, 3rd ISDA, 3rd International National Conference on Machine
    Learning and Computing (IMCLC 2011), 3rd IACC 2013 and chapters in books. He has
    also participated in a range of forums by Infosys, TCS, and WIPRO-Mission 10 X,
    IBM etc. His research activities are twofold: the first research activity is to
    explore the developmental enhancements in applications in computer vision; the
    second major research theme focused on the emerging capabilities of parallel and
    cloud computing. Mr. Mahrishi is rewarded at number of occasions in various domains
    including Recognition as an reviewer by Journal of Parallel and Distributed Computing
    (JPDC, Elsevier, and SCI & Sc Indexed), IEEE continuing education certification
    for “Cloud Computing Enable Technologies and Recognition for outstanding performance
    in Campus Connect Program by Infosys,


