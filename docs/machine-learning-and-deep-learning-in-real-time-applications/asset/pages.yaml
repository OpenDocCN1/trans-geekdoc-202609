    speech and audio processing applications. It involves dividing each audio file
    into overlapped frames of size 25 ms with 50% overlap. The frames are then windowed
    using a Hamming window followed by FFT computation of each windowed frame of the
    audio signal. This process is computing the Short time Fourier Transform (STFT)
    of the audio records. We represent the STFT of the frames in the form of an image
    of the spectrogram representation. Spectrograms are frequency representations
    of audio signals which are shown by different colors in an image. The horizontal
    axis represents time while the vertical axis gives information about the frequency
    content. The amplitude of a particular frequency is represented by different colors.
    Figure 9 shows an example of a spectrogram of an audio recording Therefore each
