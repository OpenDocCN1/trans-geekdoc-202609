  md: '# # Chapter 9

    Deep Learning in Engineering Education: Performance Prediction Using Cuckoo-Based
    Hybrid Classification


    Deepali R. Vora

    Vidyalankar Institute of Technology, India


    Kamatchi R. Iyer

    Amity University, India


    # ## ABSTRACT


    The good measure of any institute lies in minimising the dropouts and targeting
    good placements. So, predicting students'' performance is very interesting and
    an important task for educational information systems. Machine learning and deep
    learning are emerging areas that truly entice more research practices. This research
    focuses on applying the deep learning methods to educational data for classification
    and prediction. The educational data of students from engineering domain with
    cognitive and non-cognitive parameters is considered. The hybrid model with support
    vector machine (SVM) and deep belief network (DBN) is devised. The SVM predicts
    classes from preprocessed data. These class labels and actual class acts as input
    to the DBN to perform final classification. The hybrid model is further optimised
    using cuckoo search with Levy flight. The results clearly show that the proposed
    model SVM-LCDBN gives better performance as compared to simple hybrid model and
    hybrid model with traditional cuckoo search.


    # ## INTRODUCTION


    Nowadays, Educational Data Mining (EDM) exists as a novel trend in the Knowledge
    Discovery in Databases (KDD) field that can prefers mining valuable patterns and
    finding out practical knowledge from the educational systems. One important goal
    of the educational among many is tracking the performance of the student. Many
    techniques and algorithms are used to track the'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Deep Learning in Engineering Education


    progress of students. However, evaluating the educational performance of students
    is challenging as their academic performance pivots on varied constraints. This
    domain has gained importance with the increase in data volume and the development
    of new algorithms.


    Data generated from various educational sources is explored using different methods
    and techniques in EDM. The multidisciplinary research that deals with the development
    of such methods and techniques are the focus of the EDM. Analysis of educational
    data could provide information about student'' behaviours, based on which education
    policies can be further enhanced (Sukhja, Jindal, & Aggarwal, 2015, October).
    EDM discusses the techniques, tools, and research invested in automatically extracting
    the many large repositories of educational systems’ data.


    According to Davis (1998), "Education has become a commodity in which people seek
    to invest for their own personal gain, to ensure equal of opportunity and as a
    route to a better life." Because of this Higher education are competing mainly
    for students, finding, research and recognition within the wider society.


    It seems important to study data of students studying professional courses for
    the growth of any nation producing better professionals is the key to success.
    Higher education systems face two major challenges: finding placements and students
    dropping out. Analysis of educational data can help in answering the two major
    challenges satisfactorily. The performance leads to better placements and minimises
    the disrupts.


    A statistical technique to predict future behaviour is Predictive modelling. Predictive
    analytics is used in the area of product management and recommendation. It is
    a powerful tool to understand the data at hand and get useful insights from it.
    Figure 1 represents Predictive analytics in education.


    One of the most popular methods for predictive analytics is Machine learning (ML)
    to predict future behaviour. From the plethora of algorithms available, it is
    always interesting to discover which algorithm or technique is most suitable for
    analysis of data under consideration. EDM is the area where research predictive
    modelling is most useful.


    ML has become very popular among researchers because of the astonishing results
    algorithms are for diverse data and applications. But when data is growing enormously
    simple ML are not efficient and beneficial. Meanwhile there are many advances
    in hardware and software. So, it was possible to have more complex and hybrid
    architectural models performing DIM OR or Big Data tasks. Big data is already
    posing a challenge on traditional models for efficiency and accuracy. Various
    hybrid models are proposed and tested in many domains to tackle these challenges
    and are proved to be useful. Thus, applying a hybrid model in the education domain
    will be useful.


    ML is changing in a better way to tackle new age and one of such advances is Deep
    Learning (DL). Linear analysis can be effectively done using deep learning. Characteristics
    of the data can be analysed using layers in the deep learning model. DL is being
    used in many domains; predominantly in image processing and natural language processing
    (Deng & Yu, 2014). Thus, it is interesting to apply Deep Learning in the field
    of education.


    This chapter addresses the main objectives as:


    +   1. Identification of areas like EDM where Deep Learning is applied and is
    useful

    2. Applying hybrid classification method using Deep Learning on Educational Data
    for Classification

    3. Improvising the Hybrid Model By Applying Cuckoo Search with Levy Flight optimization
    technique'
