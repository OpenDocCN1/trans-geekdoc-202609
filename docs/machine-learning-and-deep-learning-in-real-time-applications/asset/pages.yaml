  md: '# Malaria Detection System Using Convolutional Neural Network Algorithm


    were more or less the same. Deep CNN Algorithm with multiple layers was designed
    to find patches in the input image and identify them, this gave very good results
    with an accuracy of 94.26%.

    CNN Algorithms may sometimes cause a problem of overfitting in the dataset but
    there are many ways to overcome this problem and hence, CNN Algorithm can be used
    to generate good results in detecting Malaria Parasites in the red blood smears.


    # METHODOLOGIES


    In this work, a CNN Model-based algorithm is used for detecting malaria parasites
    in red blood smears from the American origin dataset taken as the input. The algorithm
    uses various Machine Learning python libraries (Keras, Tensorflow, PIL, Tkinter)
    and layer implementations for building model and deriving results. The working
    of the algorithm processes as follows:


    # Image Datasets


    The designed CNN Algorithm requires a dataset that contains a large number of
    images for prediction (Red Blood Cell Images n.d.). The dataset is divided into
    two subsections of which contains all the red blood cells images which are infected
