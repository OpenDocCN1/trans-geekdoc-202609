  md: "# Obtaining Deep Learning Models for Automatic Classification of Leukocytes\n\
    \n# SGD\n\nIn the backpropagation algorithm, the gradient must be calculated in\
    \ many iterations to adjust the weights of the neural network. When the training\
    \ set is very large, in general, calculating the gradient for the whole set is\
    \ impractical in terms of required computational resources. Considering this issue,\
    \ the stochastic descending gradient is calculated with some examples iteratively\
    \ (instead of the entire base). Another advantage of the SGD is the ability to\
    \ reduce the occurrence of local minima in high dimensional error spaces. Batches\
    \ are used because they reduce variance in learning and therefore have a more\
    \ stable convergence, provided that the distribution of the examples is random.\
    \ With the high computational power of GPU, min-ibatches can be processed quickly,\
    \ since the operation is easily parallelized (Nascimento, 2016). Equation (8)\
    \ shows the step of updating the SGD.\n\n```\n$$\\theta = \\theta - \\alpha *\
    \ \\sum_{k=1}^{m} \\nabla_{\\theta}(\\theta; x^{(k)}, y^{(k)})$\n```\n\nwhere\
    \ $\theta$ is the parameter to update, $\\alpha$ is the learning rate, and $m$\
    \ is the size of the batch.\n\n# Data Augmentation\n\nIt is fact that the larger\
    \ and diverse the amount of data a machine learning algorithm has access to, the\
    \ more effective it will tend to.\n\nData augmentation is presented as a way to\
    \ reduce overfitting in ML models, where data diversity is increased by using\
    \ information that exists only in the available dataset.\nA common practice to\
    \ increase a set of images is to perform transformations at the level of their\
    \ color and geometry, such as reflection, cropping, color palette changes, and\
    \ image translation. Traditional transformation techniques (Figure 4) consist\
