- pgno: 103
  md: '# Recurrent Neural Network RNN (Mikolov et al., 2010)


    Recurrent Neural Networks or RNN are used to keep track of a sequence of data
    like text, audio, etc. For example, a sentence is a sequence of words. The meaning
    contained in the sentence not just depends on a single word but the words before
    and after it.

    An RNN, all nodes in a layer are also connected to each other so that the sequence
    of words can be processed. These nodes in RNN are referred to as time steps.


    Figure 13. A layer of RNN (Colah, 2015)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_103_0.png)


    # Bi-Directional RNN


    A bi-directional RNN accounts for the sequence in both forward and backward directions.

    It is important because the meaning of a sentence or phrase can depend only on
    what is before but also on what comes after. A bi-directional RNN accounts for
    this.


    # Long Short Term Memory Networks (LSTM) (Hochreiter et al., 1997)


    A simple RNN does not work well for a big sequence as it forgets key information
    that was much earlier in the sequence.

    To solve this, LSTM, RNN are used. LSTM, RNN are almost always used instead of
    the simple vanilla RNN as produce very good results.

    Vanilla RNNs change information when they encounter new information, but an LSTM
    RNN does not make to the complete information but only a part of it. This way,
    the LSTM can remember important information that was encountered long ago in the
    sequence.

    An LSTM produces a cell state C along with a hidden state h. There are many gates
    that help in ordering information, old information to be forgotten, what new information
    to be kept.'
