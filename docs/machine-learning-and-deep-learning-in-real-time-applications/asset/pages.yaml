    Binary tournament is used as selection operator. The crossover operator used as
    two-point crossover operator. Crossover is separately performed on both of gene
    and time-point parts of each chromosome. For the gene segment, two crossover points
    are selected on each of two chosen parents chromosomes, and then the segments
    between these segments swap between parents. For the conditions segment, it is
    performed similarly. Mutation operator is done as follows. For each bit of selected
    chromosome in both conditions and genes, it is functioned based on mutation probability
    rate.


    # STACKED DENOISING AUTOENCODER DEEP LEARNING TECHNIQUE FOR PATTERN SELECTION


    The dataset contains a noisy gene expression data which has a number of sequence
    patterns. The identification of more suitable patterns from the gene sequences
    for cancer detection is a demanding issue by the reason of the high dimensionality
    and complexity since the patterns appears exactly once in each gene sequence.
    In order to reduce complexity and obtain the significant patterns for cancer detection
    is performed using stacked denoising autoencoder (SDA) deep learning technique.
    Autoencoder is a deep feed forward neural network feature selection method for
    obtaining the significant features from the dataset for cancer detection. A typical
    neural network consists of three layers such as input, hidden and output. A deep
    learning approach is used to select functional features (i.e. patterns) for cancer
    detection from the high dimensional gene expression dataset using more than one
    hidden layers. In the deep learning architecture, autoencoders are stacked one
    layer over the other layer to learn gene sequences for cancer detection from the
    dataset. Denoising is used to reduce the sequence pattern from the gene regulatory
    sequences. The Stacked denoising autoencoder for significant pattern selection
