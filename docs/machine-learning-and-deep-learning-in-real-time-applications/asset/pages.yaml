- pgno: 221
  md: 'Confusion Matrix: The confusion matrix can be represented as follows:


    | | Predicted/Classified | | |

    |---|---|---|

    | Actual | Negative | Positive |

    | Negative | True Negative (TN) | False Positive (FP) |

    | Positive | False Negative (FN) | True Positive (TP) |


    Where -

    True Positive (TP) = Number of positive instances correctly classified as positive.

    False Positive (FP) = Number of positive instances incorrectly classified as negative.

    True Negative (TN) = Number of negative instances correctly classified as negative.

    False Negative (FN) = Number of negative instances incorrectly classified as positive


    +   * Accuracy: Accuracy indicates the closeness of a predicted or classified
    value to its real value. The state of being correct is Accuracy. It can be calculated
    as:


    Accuracy= (TP+TN)/(TP+TN+FP+FN)


    +   * Precision: Precision can be defined as the number of relevant items selected
    out of the total number of items selected. It represents the probability that
    an item is relevant. It can be calculated as:


    Precision = TP/(FP+TP)


    Precision is the measure of exactness.


    +   * Recall: The Recall can be defined as the ratio of relevant items selected
    to relevant items available. The recall represents a probability that a relevant
    item is selected. It can be calculated as:


    Recall = TP/(FN+TP)


    The recall is the measure of completeness.


    +   * F1-Measure: F1-Measure is the harmonic mean between Precision and Recall
    as described below:


    F1-Measure= 2 * (Precision * Recall) / (Precision+Recall)


    It creates a balance between precision and recall. Accuracy may be affected by
    class imbalance but F1 Measure is not affected by class imbalance. So with accuracy
    F1-measure is also used for evaluation of classification algorithms.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Sensitivity: Sensitivity is used to find out the proportion of positive samples
    that are correctly identified also called a true positive rate. It is calculated
    as:


    Sensitivity=TP/P


    Where,


    P = Total Number of Positive Samples

    N = Total number of Negative Samples


    Specificity: Specificity is used to find out the proportion of negative samples
    that are correctly identified also called a true negative rate. It is calculated
    as:


    Specificity=TN/N


    False Positive Rate (FPR): FPR is used to find out the proportion of negative
    samples that are misclassified as positive samples. It is calculated as:


    FPR=FP/N


    False Negative Rate (FNR): FNR is used to find out the proportion of positive
    samples which are misclassified as negative samples. It is calculated as:


    FNR=FN/P


    Negative Predictive Value (NPV): NPV is used to find out the number of samples
    which are true negative. It is calculated as:


    NPV=TN/(TN+FN)


    False Discovery Rate (FDR): FDR is also called an error rate. It is used to find
    out a proportion of false positive among the classes as is classified as positive.
    It is calculated as:


    FDR=FP/(FP+TP)


    Matthews''s correlation coefficient (MCC): It is calculated as:


    MCC=(TP*TN)/SQRT((TP+FP)(TP+FN)(TN+FP)(TN+FN))


    MCC is a balanced measure based on a confusion matrix. This is used even if the
    classes are of different sizes. It is a correlation coefficient between the actual
    and the predicted classes. The value of MCC lies -1 to 1. The value near to +1
    indicates the prediction is perfect. The value 0 indicates random prediction.
    The value -1 indicates a total disagreement between the actual and predicted values.
    MCC score above zero indicates balanced classification. MCC is a good measure
    when the data'
  merge: -1
  img_proc: true
