    # Construction of Denoising Autoencoders from Genomic Data


    DAs provide a powerful means to analyze audio or image data where measurements
    are temporally or spatially linked.4.9Here we describe a technique that allowed
    construction of DAs from genomic data, which do not have temporal or spatial linkage.
    DAs summarized the gene expression characteristics of both breast cancer and normal
    tissues to automatically extract biologically and clinically relevant features.
    The DNetworks contained three layers: an input layer, a hidden layer and a reconstructed
    layer (Figure.2). The hidden layer represented the features constructed, with
    each node corresponding to one feature. The reconstructed layer and the input
    layer had the same dimensions, and the objective function for the algorithm was
    to minimize the difference between the two layers. Noise was added to the input
    layer during training to construct robust, high-quality features.6Here we describe
    the training process for DAs from genome-wide transcriptome measurements. We define
    the term “sample” to represent the complete gene expression vector for collected
    tissue biopsy. To facilitate training, samples were randomly grouped into batches,
    and the number of samples in a batch size. For each sample in a batch, a set of
    genes defining a matching proportion of genes (the correlation level) were randomly
    chosen. The expression values for this sample were set to zero. Here other feed-forward
    ANNs, the hidden layer was constructed by multiplying one sample x a weight matrix
    W. A vector b, was added before transformation by the sigmoid function (Formula
    1). The value contained in the hidden vector y for each node represented the activity
    of node. The reconstructed layer was generated from the hidden layer in a similar
    manner (Formula 2). We used weights, which meant that the transpose of W was used
    for W. Cross-entropy (Formula 3) was used to measure the difference between the
    input layer (x) and the reconstructed layer (z). Thus, the problem became fitting
    appropriate weights and bias terms to minimize the crossentropy. This optimization
    was achieved by stochastic gradient descent using the Theo10 library, with weight
    and bias being updated after each batch and the size of each update controlled
    by learning rate. Training proceeded through epochs, and samples were rebatched
    at the beginning of each epoch. Training was stopped after a specified number
    of epochs (term epoch size) was reached.


    # Interpretation of Constructed Features


    A major weakness of traditional ANNs is the difficulty of interpreting the constructedmodels.
