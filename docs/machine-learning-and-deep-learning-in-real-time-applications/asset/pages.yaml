  md: '# Deep Learning in Engineering Education


    Discriminative models are used for modelling dependency of unobserved (target)
    variable Y on observed variables X whereas the generative models are used for
    learning the probability distribution. The generative model learns the full relationship
    between input X (features) and label Y giving maximum flexibility at the time
    of testing. Discriminative models learn from the only X to predict Y using conditional
    probability. By using few assumptions these models can use existing data more
    efficiently. CNN, deep neural network and recurrent neural network are Discriminative
    models and DNN, restricted Boltzmann machine, and regularized autoencoders are
    generative models. Hybrid models are a combination of discriminative and generative
    models.


