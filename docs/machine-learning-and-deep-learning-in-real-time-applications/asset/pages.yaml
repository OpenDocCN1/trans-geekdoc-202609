    The dynamic nature of graphs allows PyTorch to build its deep learning applications
    to be executed at runtime, as compared to other deep learning frameworks that
    rely on static graphs that have been built before running the model.


    A computational graph is a directed graph in which the nodes correspond to operations
    or variables. Variables can feed their values into operations, and operations
    can feed their output into other operations. In this way, each node defines a
    function of the variables. The values fed into the node and come out of the nodes
    are called tensors, which is a multi-dimensional array. Hence, it comprises scalars,
    vectors, and matrices as well as tensors of a higher rank.


    The dynamic nature of computation graphs allows the creation and execution of
    the graph at the same time. This allows easy debugging of a neural network. The
    debugging becomes even more prominent as the size of the neural network model
    increases. The dynamic nature also allows for changing the graph at run time which
    is particularly helpful in sequence modeling where the size of inputs is different.
    However, dynamic computational graphs do not offer optimization of computations
    nor static analysis which computational graphs offer.


    This allowed deep learning researchers and practitioners to quickly create and
    evaluate new network architecture and approaches easily than waiting for the engine
