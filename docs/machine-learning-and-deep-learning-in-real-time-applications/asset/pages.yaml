  md: '# Obtaining Deep Learning Models for Automatic Classification of Leukocytes


    VGG16 and VGG19 obtained results of approximately 85% on 100 epochs of training.
    InceptionV3 and Xception achieved 95% and 96.6% respectively.


    From the observation of the obtained results, it is possible to realize that in
    spite of the initial indication that the models trained from scratch would obtain
    better performance (based on the best values of loss obtained during the training)
    that didn''t happen in the test dataset. This can be explained by the large complexity
    of the models compared to the dataset images diversity. In addition to less time-consuming
    works, the models trained with transfer learning were more successful being able
    to perform more correct ranks in the test dataset, with an overall rate of 87.8%,
    compared to 26.3% of the models trained from scratch.


    # Training of Models With Transfer Learning for 5000 Epochs


    In an attempt to improve the performances of the models with transfer learning
    in the test dataset, training of the same models done for 5000 epochs. That the
    percentage of correctness was quite high in some models, it was verified that
    the training increased the percentage of the correctness of these networks slightly.
    The training of all models for 5000 epochs took 69 hours and 2 minutes (while
    for the 100 epochs, all models took 1 hour and 20 minutes). The network that took
    less time to train was the VGG16 with 4 hours and 56 minutes and the one that
    took most time to train was the Xception with 14 hours and 32 minutes.


    Overall, the increase in the percentage of network set-up between the set of trained
    models for 100 and 5000 epochs 1.68%, from 87.81% in 100 training to 89.49% in
    5000 epochs of training.


    The networks that had already achieved hit averages 96% obtained minor improvements,
    although they should not be neglected. The DenseNet121 achieved slightly lower
    results than those obtained after training 100 epochs.


    The networks that most benefited from the increase in the number of training epochs
    were the VGG16, the VGG19, and the Res50 with between 3% and 5%, although the
    Res50 remained very low hit percentages. There was a tendency to increase the
    validation loss in most of the models, which suggests that the models are performing
    overfitting, remarkable also for the high accuracy of training (very close to
    One). One could use a higher dropout value, increase decay and decrease the rate
    as a way to prevent overfitting.


    Comparable to what verified in training 100 epochs, that the hit percentage for
    each of the categories has similar values, with the exception of the Res50 where
    one can see some discrepancy in the classification process.


    In general, given the specificity of the methodology used, the results are encouraging,
    when compared with recent works. In 2016 Sjad et al. created a mobile framework
    in the class to classify and segment leukocytes and achieved 98.6% hit percentage
    using k-means algorithms to segment images and morphological operations to remove
    unwanted components. For the classification, they used an EMC-SVM (Sijad, Han,
    Jan, 2016).


    In 2018 Habizadeh et al. used the Res50, Res152 V1, and Resnet101 networks, trained
    by 3000 epochs, with 11200 examples and 1244 test samples, having obtained results
    99% for 5 categories of leukocytes (Habizadeh, Jannesari, Rezai, and Tonchi, 2018).


    Also, in 2018, Bhaduria et al. classified four categories of leukocytes, with
    an accuracy of 95% (Bhadura, Devgum, Virmani, and Rawat, 2018).'
