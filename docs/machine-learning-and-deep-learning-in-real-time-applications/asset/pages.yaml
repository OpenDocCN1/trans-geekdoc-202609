- pgno: 75
  md: '# TRANSFER LEARNING WITH KERAS AND DEEP LEARNING


    Instead of training a model from scratch (as done in previous sections), transfer
    learning can be effectively utilized to leverage a pre-trained model that has
    demonstrated state-of-the-art performance in object classification tasks. Popular
    models like VGG16 or 19, InceptionV3, ResNet50 etc are available with keras application
    API that are trained on ImageNet which comprises of 1.2 million images with 1000
    general image categories. We can directly download the weights of any chosen pre-trained
    model and use it to fine-tune the model. In general, there are three ways to fine
    tune the model.


    # Feature Extraction


    The output layer of a pre-trained network predicts one of the objects out of the
    1000 categories. In feature extraction mechanism, the output layer of the pre-trained
    model is replaced by a new layer with number of classes our model wants to predict
    acting as a fixed feature extractor for the new data set. It is useful in cases
    we have:


    +   - Limited resources to train the model from scratch, and/or

    - Unavailability of larger datasets, and/or

    - Dataset used to train the pre-trained model is similar to the one we are using
    to solve our problem.


    # Training the Entire Model Using Architecture of the Pre-Trained Model


    The architecture of the pre-trained model is utilized to train the model from
    scratch in our dataset by randomly initializing all the weights. It is useful
    in cases when we have:


    +   - A lot of computational power to train the model from scratch and

    - Availability of larger datasets.


    # Training Some Layers While Freezing Others


    Another way to use a pre-trained model is to train partially. Low layers of a
    network represents general features such as horizontal lines, vertical lines,
    curves, etc. while high level features represents more specific features. We can
    retrain only the higher layers of the network by freezing low-level layers whose
    weights do not change during training using this approach.


    # STEPS TO PERFORM TRANSFER LEARNING IN KERAS


    We have already trained a model using sequential approach in the previous section
    of this chapter. Now, we will try to improve the accuracy of the model using transfer
    learning in Keras. The steps required to be followed are given below:'
