    # INTRODUCTION


    Facial expression recognition has various applications in different areas of social
    networks and in other fields as well (Tian et al., 2001; Mao et al., 2015). The
    primitive objective of the model is to be able to identify the emotions of the
    subjects based on facial expressions with a good accuracy. The models that exist
    today give lower accuracy when it comes to identifying angry and fearful expressions
    (Li et al., 2013b). This chapter will be focusing on improving the accuracy of
    all the scheduled emotions including anger and fear users from facial expression
    and we aim to identify whether patient is satisfied with the assigned doctor or
    not.


    There are a total of 7 defined classes for the expressions which are shown as
    follows:


    +   Class 0: Angry, Class 1: Disgust, Class 2: Fear, Class 3: Happy, Class 4:
    Sad, Class 5: Surprise Class 6: Neutral (Ratliff & Patterson, 2008b).


    Figure 1. defined classes for the expressions


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_293_0.png)


    # Motivation and Problem Statement:


    Emotion recognition using facial detection has got valuable attention because
    of its many applications in marketing, call center employees, employee satisfaction
    management system etc (Ogiela & Tadeusiewicz, 2008a). Despite significant progress,
    the state of the art emotion detection systems only yield suitable enact-ment
    under measured circumstances and significantly degrade when faced with real-world
    applications (Koelstra & Patras, 2013a). That''s why AI and machine learning are
    rising and in demand these days, we wanted to do a project in this area. Also,
    as far as PSMS is concerned patients usually hesitate to tell whether they are
    satisfied with their doctor or not. So this will help correct the problem.'
