    Figure 3. Plot of rectified linear unit (ReLU) function


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_25_0.png)


    # Softmax


    Along with the linear function, softmax is usually found in the output layer of
    a neural network. The activation function softmax forces the output of the neural
    network to represent the probability of the input is inserted into each of the
    classes. Without the softmax, the outputs are simply numerical values, being the
    largest indicative of the winning class. When we insert information into the neural
    network by applying the activation function softmax, we get the probability that
    input can be categorized into predefined classes. The formula is shown in (3).


    $$\varnothing_i = \frac{e^{z_i}}{\sum_{j\in group} e^{z_j}}$ (3)


    where i represents the index of the output node, and j represents the indexes
    of all the nodes in the group level. The variable z designates the vector of the
    output nodes. It is important to note that the softmax function is calculated
    differently from the other activation functions: When using softmax, the output
    of a single node depends on the other nodes. In the previous equation, the output
    of the other nodes is contained in the z variable, unlike the other activation
    functions (Kross, 2015).


    # Feedforward


    As seen before, the networks in which the output of a neuron is used as the input
    of the neuron of the next layer are called feedforward neural networks. This means
    that there are no loops or cycles in the network, information is always passed,
    and there is no feedback (Nielsen, 2017). Given the inputs $x = [x_1, x_2, ...,
    x_n]$ and the weights $w$, a feedforward network is used to calculate outputs
    $y = [y_1, y_2, ..., y_m]$ of a network MLP. In the feedforward process, external
    inputs feed the neurons of input (first layer). The outputs of the input neurons
    feed the hidden neurons of the second layer, and so on, and finally the outputs
    of the layer $L^i$ feed the neurons of the last layer ($L$) (Zhang & Devabhakti,
    2003). The calculation is given by (4) and (5)'
