    # Reverberation Time Features


    The length of time it takes for decay from its original level is called reverberation
    time. This reverberation time is an important parameter extracted from the RIR
    which characterizes a particular environment. Different reverberation times like
    RT60, RT30 and RT 20 are defined depending upon how much sound energy the source
    stops emitting the signal. RT60 is the duration required for the sound energy
    to decay by 60dB after the source stops. Similarly, for the time to decay from
    -5dB to -25dB and -5dB to -35 dB in RT20 respectively. Apart from these, there
    are more parameters than extracted from the RIR: The Early Decay Time (EDT) and
    the Direct to Reverberation Ratio (DRR). EDT is the time required for the sound
    pressure level to drop to 0dB to -10dB. DRR is defined as the ratio of the sound
    energy level of a direct source to the sound energy of the reverberant component.
    The methodology for computing the above reverberation parameters is given in The
    International Standards Organization (ISO) document 3382 (Measurement of Room
    Acoustic Parameters, Part 1, 2009).


    # FRAMEWORK FOR AUDIO PROCESSING SYSTEM WITH TAMPERING DETECTION


    Tampering detection methods can be of two types: (a) Active Tampering detection
    and (b) Passive Tampering detection (Hua, Zhang, Goh & Ching, 2016). In active
    tampering detection methods, fingerprints and water are embedded in the original
    audio recording which provides clues of tampering. In passive detection methods,
    no priori information about the recording is available. It is important to develop
    algorithms for the passive detection method because active detection methods,
    embedding information in the original audio can degrade the quality of the audio.
    Also, in a forensic setting, the audio recordings which are available as evidences
    would not be embedded with any side information and therefore the detection of
    forgery is blind in a way. This section provides a framework for tampering detection.
    Different types of tampering attacks are discussed followed by the creation of
    a database and feature extraction.


    # Types of Tampering Attacks


    The types of tampering attacks considered in this chapter:


    +   1. Insertion: Here, one or more segments from other audio recording is inserted
    in the original audio recording

    2. Deletion: Delete one or more segments from the original audio

    3. Splicing: In this type of forgery, a part of an audio recording is copied and
    pasted over another recording i.e. audio segments from different audio recordings
    are concatenated.'
