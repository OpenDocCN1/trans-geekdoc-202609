    # Support Vector Machines


    Support Vector machines (SVMs) are a type of supervised machine learning method
    used for the tasks of classification and regression. SVMs have been popularly
    used in many different pattern recognition application areas such as face recognition,
    handwriting recognition, etc. The performance of SVMs is comparable to the sophisticated
    neural networks. SVMs can be used for a binary classification problem for linearly
    separable data, for classifying data which is not linearly separable and also
    in regression. SVM is a classifier that is defined by a separating hyperplane.
    The output is in the form of optimum hyperplane which classifies new data points.
    Suppose the datapoints belong to separate labeled classes as in Figure 12.


    Figure 12.


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_178_0.png)


    We can decide a separating line for these classes which separates the two classes
    firstly. Hence, the SVM finds the line, i.e. hyperplane that separates the classes.
    In cases where the data points cannot be linearly separable we use different transformations
    called kernels that can separate the datapoints. This is as shown in Figure 13.


    There may be a scenario where the data points are overlapping as shown in Figure
    14. In such a case, the classification is non- linear and we have to define a
    hyperplane which classifies the data points with minimum classification errors.
    This is done by tuning the hyper parameters of the SVM namely, the regularization
    parameter and gamma. Appropriate choice of these parameters can achieve nonlinear
    classification with more accuracy. The classification can make use of a linear
    kernel or a non-linear kernel like polynomial, exponential, radial basis, etc.'
