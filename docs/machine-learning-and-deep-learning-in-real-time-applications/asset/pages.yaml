    # ABSTRACT


    In this chapter, machine learning application on facial expression recognition
    (FER) is studied for seven emotional states (disgust, joy, surprise, anger, sadness,
    contempt, and fear) based on FER describing coefficient. FER has many practical
    importance in various area like social network, robotics, healthcare, etc. Further,
    a literature review of existing machine learning approaches for FER is discussed,
    and a novel approach for FER is given for static and dynamic images. The results
    are compared with the other existing approaches. The chapter also covers related
    issues of applications, various challenges, and opportunities in FER. For security-based
    face detection systems that can identify an individual, in any form of expression
    he introduces himself. Doctors will use this system to find the intensity of illness
    or pain of a deaf and dumb patient. The proposed model is based on machine learning
    application with three types of prototypes, which are pre-trained model, single
    layer augmented model, and multi-layered augmented model, having a combined accuracy
    of approx. 99%.'
  merge: -1
  img_proc: true
