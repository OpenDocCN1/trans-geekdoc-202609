- pgno: 9
  md: 'intends a straightforward manual for the complexities of Google''s Keras framework
    that is easy to understand. The basic steps for the installation of Anaconda,
    CUDA, along with deep learning libraries, specifically Keras and Tensorflow, are
    discussed. A practical approach towards solving deep learning problems in order
    to identify objects in CIFAR 10 dataset is explained in detail. This will help
    the audience in understanding deep learning through substantial practical examples
    to perceive algorithms instead of theory discussions.


    # Chapter 3


    Deep Learning With PyTorch..................................................................................................61

    Anmol Chaudhary, Government Engineering College, Ajmer, India

    Kuldeep Singh Chuhan, Government Engineering College, Ajmer, India

    Jyoti Gajraj, Malviya National Institute of Technology, India

    havna Sharma, JECRC University, Jaipur, India


    In the last decade, deep learning has seen exponential growth due to rise in computational
    power as a result of graphics processing units (GPUs) and a large amount of data
    due to the democratization of the internet and smartphones. This chapter aims
    to bring light on both the theoretical aspects of deep learning and its practical
    aspects using PyTorch. The chapter primarily discusses new technologies using
    deep learning and PyTorch in detail. The chapter discusses the advantages of using
    PyTorch compared to other deep learning libraries. The chapter discusses some
    of the practical applications like image classification and machine translation.
    The chapter also discusses the various frameworks built with the help of PyTorch.
    PyTorch consists of various models that increase its flexibility and accessibility
    to a greater system. As a result, many frameworks built on top of PyTorch are
    discussed in this chapter. The authors believe that this chapter will help readers
    in getting a better understanding of deep learning making neural networks using
    PyTorch.


    # Chapter 4...............................................................................................................................96


    Deep Learning With TensorFlow

    Shahana Anwarl, Department of Systemics, School of Computer Science, University
    of

    Petroleum and Energy Studies (UPES), India

    Deepa Joshi, Department of Systemics, School of Computer Science, University of
    Petroleum

    and Energy Studies (UPES), India


    This chapter aims to acquaint the users with key part of TensorFlow and some basic
    ideas about deep learning. In particular, users will figure out how to perform
    calculations in TensorFlow and implementation of deep learning using TensorFlow.
    This chapter intends to give a straightforward manual for the complexities of
    Google''s TensorFlow framework that is easy to understand. The basic steps for
    the installation and setup of TensorFlow will also be discussed. Starting with
    a simple "Hello World" example, a practical implementation of deep learning to
    identify the handwritten digits will be discussed using MNIST dataset. It is only
    possible to understand deep learning through substantial practical examples. For
    that reason, the authors have included practical implementation of deep learning
    problems that motivates the readers to plunge deep into these examples and get
    their hands trying different things with their ideas using TensorFlow because
    it is never adequate to perceive algorithms only theoretically.'
