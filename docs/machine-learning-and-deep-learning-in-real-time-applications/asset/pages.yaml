    a way to increase the generalization power of the networks.


    With this work, it was possible to implement a set of networks in the classification
    of 4 categories of leukocytes with percentages over 98% in the available dataset.
    It is highly probable with a significantly larger set of images and the coupling
    of a computational mechanism for identification and segmentation of images (and
    this could also be a neural network) it could be possible to automate the identification
    and counting of all types of leukocytes from microscopy blood cells.


    Compared to the state of the art, this work has higher levels of accuracy (98%).
    It, however, emphasized that the dataset used is not the same as that used in
    works leading to state of the art, so it is risky to make comparisons. In addition,
    the leukocytes used belong to the set of base leukocytes. On the other hand, in
    some studies, leukocyte detection and classification are performed simultaneously,
    which may reduce the accuracy of classification. In the present work, we tested
    the performance of CNNs in relation to the classification process, but the detection
    was performed manually. Future work will analyze the performance of dedicated
    leukocyte detectors. With the use of these two methods, detection and classification,
    as they are separately trained methods, it is expected to achieve higher performances
    than achieved with hybrid methods.


