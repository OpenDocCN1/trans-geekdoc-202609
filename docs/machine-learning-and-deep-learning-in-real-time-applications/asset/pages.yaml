    & Smith, 2012). Container analysis includes the investigation of the file structure,
    metadata, et Main. The hex data is also maintaining HASH calculations, MAC time
    stamps, review of the file format, sample rate, codec, bit rate, etc are tasks
    involved in content analysis. Checking the header information and the hex data
    a part of container analysis. Content analysis deals with the analysis of the
    actual content of the audio file and the audio events in the file. Below are the
    preliminary steps involved in any digital au


    +   1. Critical listening: The first step after acquisition of the evidence and
    analyzing the structure of the audio file is critical listening. Not much can
    be inferred from critical listening, but it is an important step to form hypotheses
    that will be evaluated in the later stages of investigations. Critical listening
    involves use of background noises, any discontinuities, identifying the number
    of speakers, in some cases the location of recording, etc.

    2. Waveform analysis:Similar to critical listening, waveform analysis is a preliminary
    procedure followed by forensic analysts for audio authentication. By analyzing
    the high resolution waveform of the evidentiary audio recording, one can obtain
    information regarding any discontinuities, transient, presence of normalization,
    etc. Observing these parameters may give clues of possible tampering attacks in
    the audio recording.

    3. Signal power and DC offset: If the power of the audio signal is computed on
    short analysis frames, missing acoustic information in the signal power can be
    an indication of tampering. Ideally there is no DC offset in audio recording as
    the positive and negative amplitude values cancel out. But practically, a recording
    which has not been processed will have a slight positive or DC offset because
    of the addition of some direct current when the electrical signal from the microphone
    passes to the A/D converter. Therefore, if the DC offset is zero, it indicates
    that there has been some manipulation in the recording.

    4. FFT spectrum: The spectrum of the audio signal can provide information such
    as frequency limits and response to the recording device, frequencies of particular
    acoustic events, presence or absence of EMF, etc. Any inconsistency in the spectrum
    may be a possible attack on the audio file.


    There are various established methodologies that can be applied to identify the
    presence of editing as ENF analysis, But splice detection, phase analysis, reverberation
    analysis, etc. The Abovementioned procedures are a few common methods used in
    authenticating an audio signal. However, every case will not employ each of these
    procedures as some of the procedures may not be applicable at all.'
