    # CONCLUSION AND FUTURE WORK


    In this work SDAE algorithms for clustering gene expression data are proposed
    to speed up the convergence rate of CS algorithm. It focuses on finding coherent
    cluster with lower MSR and higher variance. In CSM uses the mutation operator
    instead of 말이 to generate a new solution. The proposed method improves the global
    search ability and prevents the CS algorithm into a local optimum. It increases
    the solution convergence easily. Moreover, the SDAE preserves the balanced exploitation
    and exploration via the process of mutation shuffling in the solution of search
    space respectively. In particular the SDAE shows a high convergence to the true
    global even problem at multi-dimensions. The proposed clustering method is applied
    to two gene expression data sets. The clusters obtained using the proposed method
    reveal good biological meanings. Biological assessment of the identified genes
    within the clusters are provided by publicly available GO consortium. This experimental
    study shows that SDAE algorithm competes satisfactorily compared to other popular
    clustering algorithms to detect the clusters


