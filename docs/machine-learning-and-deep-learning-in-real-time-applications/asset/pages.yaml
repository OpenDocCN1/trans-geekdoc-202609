    # BLOCK EXTRACTION


    # Key Features of the Implemented Method


    Essential features of the method:


    +   a. Extraction of meaningful blocks; either a word or a figure in the image
    which can be easily recognized by human beings.

    b. Grouping the pixels belonging to the same block using a smearing method (Run-length
    Smearing Algorithm (RLSA))

    c. Combination of horizontal and vertical smearing operations using RLSA and a
    logical AND operation- to produce meaningful blocks.


    # Description of the Method


    RLSA is used to extract blocks of text and non-text of the document image. This
    method is specially used for document analysis and is divided into two parts.
    First, segmentation is applied, which divides the area of the image into blocks
    or regions. These regions will contain either text or non-text. The features of
    each block are used to classify the content of the block (i.e., text or non-text).
    RLSA is applied only on the binary input sequence. ‘0’ represents the background
    pixels, and ‘1’ represents the foreground part. The algorithm converts the binary
    sequence of the input to output by the following rule:


    +   a. 0''s in the data are changed to 1''s in the production when the count of
    adjacent 0''s is not more than the defined limit C.

    b. 1''s in the input remain unchanged in the output.'
