  md: '# Introduction to Tampering Detection and Environment Identification


    As stated previously, there are numerous tasks that a forensic expert needs to
    perform. The authentication of audio recordings involves verifying the integrity
    of the audio recording by finding any traces of forgery or tampering. Obvious
    inconsistencies in artifacts embedded in the audio recording may provide clues
    of any tampering attacks. Obvious clicks, pops, discontinuities in the audio recording
    may also indicate forgery. Audio authentication also involves the task of Acoustic
    Environment Identification. This consists of identifying the environment in which
    the recording was made, or it may involve verifying whether the environment is
    the same as claimed. Moreover, the acoustic events in the audio recording can
    provide information regarding the environment in which the audio was recorded.
    It may happen the intruder completely change the background of the recording so
    that the environmental clues are eliminated. For example, if there is some humming
    noise due to a fan in the recording environment, one can conclude that the recording
    was made in a particular room and the crime scene can be verified. But obvious
    noise can also be changed or completely deleted eliminating the clues regarding
    the recording environment.


    # BACKGROUND


    Over the past decade, several techniques for audio tampering detection have been
    proposed. A remarkable contribution in this field is the analysis of the Electric
    Network frequency embedded in the audio recording which has been used to detect
    traces of forgery as (Grigor, 2012). Cuccovillo & Aichroth, 2016; Cuccovillo,
    Mann, Tagliacchi, & Aichroth, 2013) discuss tampering detection via microphone
    classification and frequency response. In (Seichter, Cuccovillo, & Aichroth, 2016;
    Gärtner, Dittarm, Aichroth, & Smith, 2017), audio forgery detection has been done
    using encoding traces which (Grigor, Smith, 2017) discusses the framework for
    audio authentication using contained metadata. A robust pitch tracking method
    has been proposed in (Yan, Yang, & Huang, 2015) for the detection of copy move.
    In (Maksimovic, Cuccovillo, & Aichroth, 2019), the authors have presented a new
    approach for detecting and localizing copy-move forgeries in audio files based
    on fingerprinting and matching that does not require pre-segmentation of the audio
    recording, which is a conventional pre-processing task followed in a majority
    of the papers. The methodologies discussed in (Patole, Kore, & Rege, 2017; Bhangale,
    & Patel, 2019; Zhao, Chen, Wang, & Malik, 2017) implement environmental signatures
    like background noise and reverberation detection.


    Similar to audio tampering detection, there has been a significant amount of research
    in the area of acoustic environment identification. In (Chaudhary, & Malik, 2010),
    the authors have employed Convolution Neural Networks for the classification of
    environments with the help of acoustic signatures like reverberation time and
    variance. These parameters have been estimated using Maximum Likelihood estimation.
    (Malik, 2013; Malik, & Farid, 2010; Zhao, & Malik, 2012) have used techniques
    such as particle filtering, inverse filtering and voiced activity detection to
    estimate the amount of reverberation embedded in the audio recordings which further
    used for classification. Different features extracted from the reverberant component
    have been exploited for classification purposes as illustrated in (Patole, Kore,
    & Rege, 2017; Narkhede, & Patel, 2019)'
