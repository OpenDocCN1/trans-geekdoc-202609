  img_proc: true
- pgno: 89
  md: 'Figure 2. A single node of a neural network (CS231n)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_89_0.png)


    Put to simply, a single node in the neural network acts as a simple logistic regression
    unit. Put together several of these units and the result is neural learning more
    complex functions. Hence, more number of nodes and layers result in better learning,
    given enough data.


    The bigger neural network does not always mean better prediction. If a large amount
    of data, then the result is overfitting - a condition in which the neural network
    learns the specific features of training data rather than general features that
    help in classifying new cases. The result is, neural networks performing very
    well on training data and giving high accuracy but performing poorly on test data
    that it was not trained, giving wrong predictions.


    At the output layer, loss is calculated by comparing the actual output in the
    dataset with the predicted output of the neural network.


    The process described above is forward propagation. In short, forward propagation
    is just multiplying weights with node values to calculate the value of nodes further
    in the networks. The flow of direction is forward.


    But how does neural network learn? How are these "weights" updated and to optimal
    values that our neural network can predict the correct output? The answer is **backpropagation.**


    # Backpropagation (Rumelhart et al., 1988) (Karpathy)


    Backpropagation is a process by which a neural network learns to output the desired
    result. It works by reducing the loss using the principle of gradient descent.
    The error (loss) is backtracked through the network by taking derivatives of error
    with respect to the weights of different layers. The weights are updated by subtracting
    weight derivative from previous weight values.


    This cycle of forward propagation, calculating loss, backpropagation, and updating
    weights is an iterative process in each of these steps is repeated several times.
    After several iterations, the weights reach an optimal value such that the loss
    is minimized. This results in the neural network outputting the correct output
    when it is shown new data.


    Figure 3 shows loss with respect to weight for the sake of simplicity. In reality,
    there are several weights (in order of thousands or millions), which cannot be
    projected onto a 2D or 3D graph.'
