    The Number below the box defines the no. of channels (input has three and output
    1). Numbers above the boxes indicate the no. of filters of the convolution layer
    (or feature maps). The dotted arrow and empty boxes indicate concatenation of
    the feature map of the encoder with the up-convolution operation of the decoder.
    Green colored boxes are convolution + BN + ReLU while blue boxes are up-convolution
    + BN + Relu. Arrows have their meanings mentioned in the figure above. 256x256
    is the dimension of input image and mask (Ronneberger, O., Fischer, P., & Brox,
    T., 2015).


