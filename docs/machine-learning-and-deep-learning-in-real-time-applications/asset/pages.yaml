  md: '# Step 3. Fine-tuning the Model


    Now, we add two fully connected layers followed by softmax towards the end of
    the ResNet architecture, which classifies the object into 10 categories instead
    of 1000. To begin, the input image of Cifar10 needs to scale up three times before
    we can pass it through the ResNet layers. Now, the output of the ResNet layer
    is taken, flattened and passed through two dense layers (with 128 and 64 neurons
    respectively). After training the model for only 5 epochs, we achieve an accuracy
    of 98% which is higher than creating a model from scratch as described in previous
    section.


    Figure 30.


    ```

    model = models.Sequential()

    model.add(layers.UpSampling2D((2,2))

    model.add(layers.UpSampling2D((2,2))

    model.add(layers.UpSampling2D((2,2))

    model.add(Conv_Bias)

    model.add(layers.Flatten())

    model.add(layers.Normalization())

    model.add(layers.Dense(128, activation=''relu''))

    model.add(layers.Dropout(0.3))

    model.add(layers.Normalization())

    model.add(layers.Dense(64, activation=''relu''))

    model.add(layers.Dropout(0.3))

    model.add(layers.Normalization())

    model.add(layers.Dense(10, activation=''softmax''))


    model.compile(optimizer=optimizer.RMSprop(lr=1e-5), loss=''binary_crossentropy'',
    metrics=[''acc''])

    history = model.fit(x_train, y_train, epochs=5, batch_size=20, validation_data=(x_test,
    y_test))

