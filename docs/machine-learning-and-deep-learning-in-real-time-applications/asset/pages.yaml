- pgno: 10
  md: '# Chapter 5


    Employee''s Attrition Prediction Using Machine Learning Approaches...............................................
    121

    Krishna Kumar Mohbey, Department of Computer Science, Central University of Rajasthan,

    India


    In any industry, attrition is a big problem, whether it is about employee attrition
    of an organization or customer attrition of an e-commerce site. If we can accurately
    predict which customer or employee leave their current company or organization,
    it will save much time, effort, and cost of the employee and help them to hire
    or acquire substitutes in advance, and it would not create a problem in the ongoing
    process of attrition. In this chapter, a comparative analysis between various
    machine learning approaches such as Naive Bayes, decision tree, random forest,
    and logistic regression is presented. The presented result will help us in identifying
    the behavior of employees who could be attracted over the next time. Experimental
    results reveal that the logistic regression approach can reach up to 86% accuracy
    over other machine learning approaches.


    # Chapter 6


    A Novel Deep Learning Method for Identification of Cancer Genes From Gene Expression

    Dataset.........................................................................................................................................................
    129


    +   Pyingkodi Maran, Kong Engineering College, India & Anna University, India

    Shanthi S., Kong Engineering College, India

    Thenmozchi K., Selvam College of Technology, India

    Hemalatha D., Kong Engineering College, India

    Nanthini K., Kong Engineering College, India


    Computational biology is the research area that connects to the analysis of biological
    information. The selection of the subset of cancer-related genes is one amongst
    the most promising clinical research of gene expression data. Since a gene can
    take the role of various biological pathways that turn active only under specific
    experimental conditions, the stacked denoising auto-encoder(SDAE) and the genetic
    algorithm were combined to perform clustering of cancer genes from huge microarray
    gene expression data. The Genetic-SDAE proved superior to recently proposed clustering
    methods and better to determine the maximum similarity of a set of clusters of
    gene expression data with lower MSR and higher gene variance. This work also assesses
    the results with respect to the discovered genes and that the extracted clusters
    are supported by biological evidence, as enrichment of gene functions and biological
    processes.


    # Chapter 7


    Machine Learning in Authentication of Digital Audio Records...........................................................
    145

    Rashhika Kiran Patole, College of Engineering, Pune, India

    Priti Parege, College of Engineering, Pune, India


    The field of audio forensics has seen a huge advancement in recent years with
    an increasing number of techniques used for the analysis of audio recordings submitted
    as evidence in legal investigations. Audio forensics involves authentication of
    the evidentiary recordings, which is an important procedure to verify the integrity
    of audio recordings. This chapter focuses two audio authentication procedures,
    namely acoustic environment identification and tampering detection. The authors
    provide a framework for the above-mentioned procedures discussing in detail the
    methodology and feature sets used in the two tasks. The main objective of this
    chapter is to introduce the readers to different machine learning'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'algorithms that can be used for environment identification and forgery detection.
    The authors also provide some promising results that prove the utility of machine
    learning algorithms in this interesting field.


    # Chapter 8


    Deep Convolutional Neural Network-Based Analysis for Breast Cancer Histology Images............
    168


    E. Sudheer Kumar, JNTUA College of Engineering, India


    C. Shoba Madhu, JNTUA College of Engineering, India


    Sirivella Madhu, JNTUA College of Engineering, India


    Breast cancer is one of the main causes of death worldwide, and early diagnostics
    significantly increases the chances of correct treatment and survival, but this
    process is tedious. The relevance and potential of automatic classification algorithms
    using Hematoxylin-Eosin stained histopathological images have already been demonstrated,
    but the reported results are sub-optimal for clinical use. Deep learning-based
    computer-aided diagnosis (CAD) has gaining popularity for analyzing histological
    images. Based on the predominant cancer, the goal is to classify images into four
    categories of normal, benign, in situ carcinoma, and invasive carcinoma. The convolutional
    neural network (CNN) is proposed to retrieve information at different scales,
    including both nuclei and overall tissue organization. This chapter utilizes several
    deep neural network architectures and gradient boosted trees classifier to classify
    the histology images among four classes. Hence, this approach has outperformed
    approaches in terms of accuracy and implementation complexity.


    # Chapter 9


    Deep Learning in Engineering Education: Performance Prediction Using Cuckoo-Based
    Hybrid Classification................................................................................................................
    187


    Deepali R. Vora, Vidyalankar Institute of Technology, India


    Kamatchi R. Iyer, Amity University, India


    The goodness of any institute lies in minimising the drops and targeting good
    placements. So, predicting students'' performance is very interesting and an important
    task for educational systems. Machine learning and deep learning are the emerging
    areas that truly immense research practices. This research focuses on applying
    the deeplearning methods to educational data with cognitive and non-cognitive
    factors is considered. The hybrid model with support vector machine (SVM) and
    deep belief network (DBN) is used. The SVM predicts class labels from preprocessed
    data. These class labels and actual class labels as input to the DNN to perform
    final classification. The hybrid model is further optimised using cuckoo search
    with Levy Flight. The results clearly show that the proposed model SVM-LCDBN gives
    better performance compared to simple hybrid and hybrid model with traditional
    cuckoo search.


    # Chapter 10


    Malaria Detection System Using Convolutional Neural Network Algorithm...............................................
    219


    Kanika Gautam, Mody University of Science and Technology, Lakshmangarh, India


    Sunil Kumar Jangar, Mody University of Science and Technology, Lakshmangarh, India


    Manish Kumar, Mody Institute of Science and Technology, Lakshmangarh, India


    Jay Sharma, JECRC, Jaipur, India'
