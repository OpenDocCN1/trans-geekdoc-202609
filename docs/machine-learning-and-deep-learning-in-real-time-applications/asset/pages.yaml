  md: '# KEY TERMS AND DEFINITIONS


    **Cognitive Factors:** Characteristics of the student that have a direct effect
    on learning and performance of the student.


    **Educational Data Mining:** Tools and techniques to extract meaningful patterns
    from educational data.

    **Non-Cognitive Factors:** Characteristics of the student which do not have as
    such a direct effect on learning and performance but may have an indirect effect
    on performance and learning.


    **Optimization:** Optimization is the technique to improve the accuracy of the
    model by tuning learning weights.


    **Predictive Analytics:** Exploration of data to predict the future using various
    methods like statistics, machine learning etc.'
