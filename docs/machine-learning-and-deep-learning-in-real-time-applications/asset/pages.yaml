  md: '# Obtaining Deep Learning Models for Automatic Classification of Leukocytes


    All the models were trained in two different ways: using transfer learning and
    from scratch. Transfer learning allows transferring the values of the weights
    acquired in a previous training (in this case, with 1000 categories in the ImageNet)
    being necessary to train only the top of the network to recognize specific characteristics
    and set the number of categories to sort.


    Training from scratch involves training the entire network, which is usually initialized
    at random and is a significantly more extended process.


    The dataset is usually processed and, in the case of this work, consisted in the
    selection, classification and segmentation of images containing eosinophils, lymphocytes,
    monocytes and neutrophils - basophils and band leukocytes were excluded due to
    the difficulty in finding images in equal number to the other categories. This
    process of processing is also subject to human error, but it is the starting point
    for the automated classification performed by neural networks. The data augmentation
    was done from 110 images in each category to a total of 4394 training images,
    440 validation, and 440 test images.


    The training was performed for 100 epochs for both training approaches. In spite
    of the high accuracy and loss of the models trained from scratch, it was found
    these networks were not overfitting, achieving test scores with an accuracy above
    the random result to the number of categories concerned.


    The networks with transfer learning have, on the whole, achieved classification
    accuracies of 87.8% 26.3% of the models trained from scratch. The best performing
    networks were the DenseNet169 and the DenseNet201, both with 98.2% accuracy. In
    addition, the average training time of the models with transfer learning was 9
    minutes and 59 seconds, on average, it was 2 hours and 14 minutes to train a model
    from scratch.


    The solution for the improvement of the results in the models trained from scratch
    should pass by the use of regularization, which introduces slight modifications
    in the learning algorithm to allow for better capacity of generalization, which
    translates into an improvement of the network. Some common regularization techniques
    are L2 and L1 regularization, dropout and early stopping. In spite of issue, another
    approach would be formed by the usage of a larger and more diverse dataset.


    Considering that it is wanted to compare the performance of the networks and without
    transfer learning, the changes were made to networks trained from scratch.


    In the attempt to improve the performance of the networks and at the same time,
    perceive the effect given by the number of epochs on the functional performance,
    the training of the models with transfer learning was carried out for 5000 epochs.
    The results show an increase of 1.68%, on average, in the percentage of correctness
    of these networks. There has also been a growing tendency for overfitting due
    to the small number of training examples used for a significant increase in the
    number of training epochs. Also, in this case, it would be advisable to use regularization
    techniques or a more suited dataset.


    The good results obtained with deep learning models are directly related to the
    pre-processing work done in the images. The absence of background in the images
    allowed the networks to extract more easily the features for the classification
    process. During the first preprocessing or segmentation process, there was only
    an approximate area containing the cell to be classified, and the test results
    in the test dataset were significantly lower than those obtained after leukocyte
    ''isolation'' of the background. In this sense, it is understood the importance
    of data processing before feeding it to neural networks for training (as well
    as for the test phase).


    The analysis of the results must be made taking into account the limitations,
    mainly in the number of images used. The use of a dataset composed of more cell
    images (with an increase of two or three orders of magnitude) would be extremely
    important as was of corroborating with greater confidence'
