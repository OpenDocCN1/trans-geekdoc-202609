    # ABSTRACT


    Malaria is a disease caused when a female Anopheles mosquito bites. There are
    over 200 million cases recorded per year with more than 400,000 deaths. Current
    methods of diagnosis are effective; however, they work on technologies that do
    not produce higher accuracy results. Henceforth, to improve the prediction rate
    of the disease, modern technologies need to be performed for accurate results.
    Deep learning algorithms are developed to detect, learn, and determine the containing
    parasites from the red blood smears. This chapter shows the implementation of
    a deep learning algorithm to identify the malaria parasites with higher accuracy.


    # INTRODUCTION


    Malaria is a disease which is caused by infected female Anopheles mosquitoes.
    The bite of the mosquito causes effects on the red blood cells of the human body.
    The estimations by the world malaria report show that there are around 216 million
    malaria cases registered worldwide every year and around 445,000 deaths which
    include 75% children below 5 years of age (Widiwathi, Nugroho, and Ardiyanto 2016).


    DOI: 10.4018/9-1798-3095-5.ch010'
