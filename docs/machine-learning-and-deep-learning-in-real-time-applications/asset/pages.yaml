    Staining is one of the most important steps in the preparation of tissue because
    most cells are colour and transparent. Therefore, histological sections should
    be stained to highlight important features of the tissue as well as increase tissue
    contrast. Microscopic evaluation of such tissues provides invaluable information
    for pathologists to diagnose and classify pathological conditions. H&E staining
    is the most commonly used staining technique in hematopathology. Hematoxylin stains
    the nucleus blue, counterstain eosin cytoplasm and non-nuclear components in various
    shades of pink. H&E staining is not specific because it drains most of the cells
    in the same way. Specific staining methods are those that select specific chemical
    groups or molecules in cells.


    Histopathological analysis of breast tissue almost always begins with a careful
    examination of H&E stained specimens. Despite the introduction of powerful and
    highly specialized procedures over the last 40 years, H&E remains the most widely
    used tissue stain for determining the diagnosis and prognosis of breast cancer
    patients. The pathological classification of breast enlargement depends on the
    molecular morphology and structural patterns of cells and glands. In vascular
    tumors are routinely classified by the assessment of tube/gland formation, nuclear
    pleomorphism, and mitotic count. Due to different pathological criteria, interverbal
    variability, and differential tumor growth pattern, classification and grading
    are challenging due to time-consuming. Computerized analysis can solve the problem
    of inappropriate components and subjectivity, and the lack of widespread access
    to robust digitizing glass slides has hindered the use of computerized analysis
    techniques.


    # Computer-Aided Diagnosis for Histopathology


    Computer-aided detection (CDe) and computer-aided diagnosis (CADx) refer to the
    automated procedures that assist physicians in the interpretation of medical images.
    CDe and CADx were similarly referring to as CAD (Doi, 2007). An example of such
    system would automatically discriminate between malignant and benign Whole Slide
    Imaging (WSI) of the breast sample. The application of CAD for histopathology
    has been classified into three main groups:


    # Detection, Segmentation, and Quantification of Important Tissue Structures:


    The first case for CAD in pathology refers to tedious routine diagnostic tasks
    that require much accuracy. Examples of these include:


    +   - Identifying and dividing nucleus to analyze morphology as one of the hallmarks
    of cancer conditions (Kowal, Filipczak, Obuchowicz, Korbicz, Monczac, 2013).

    - Analysis of glandular structures and the morphology of the gland is the main
    criterion for grading cancer (Sarmiento & Fondón, 2018).

    - Identification of cancer metastases in lymph node segments (Bándi et al., 2019).


    # Classification of Histopathology Imagery Based on Grade or Legion Type:


    The Classification of histopathology imagery is often the ultimate goal in many
    diagnostic tasks, especially in cancer applications. The interpretation of pathology
    images for grading cancer or classifying wounds is winding. The CAD may provide
    objective and accurate classification results to aid the pathologist''s decision.
    Examples are:'
