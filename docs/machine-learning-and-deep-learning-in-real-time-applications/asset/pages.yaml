    # Training


    To conserve the class distribution, data were divided into ten stratified folds.
    increase the size of the dataset by considering two patch sizes with one encoder
    and fifty colour/affine augmentations, so totally it gives 100. However, interpretations
    of a given image are interrelated. training 10 GBMs along with ten times of cross-validation
    each blend of an encoder, crop size and scale was considered. Also, recycling
    each dataset five times with altered random seeds in LightGBM increases the augmentation
    of the model-level growth. As a consequence, by training ten folds with five seeds
    and two-scale with crop and with the encoder achieved 100 GBMs. In the cross-validation
    phase, each fold is evaluated only with untrained models on this fold. Extract
    100 descriptors of each image for test data and use them with all models trained
    for a specific patch size and encoder. All Predictions are averaged for all augmentations
    and models. Finally, the maximum likelihood score of the class predicted is defined.


    This approach originated in Keras with Tensorflow backend and the language used
    is Python 3.6. Intel Core i7-8700 CPU@3.20 GHz x12, memory 16GB, Radeon RX 550
    series GPU, 64-bit processor with Ubuntu 18.04 LTS used for training and testing.


