    # Densenet 121, 169 and 201


    Generally, the ResNet architecture has a fundamental block structure, and in each
    of them, an anterior layer with a future layer is attached. In contrast, the DenseNet
    architecture proposes to concatenate the outputs of previous layers in a block.


    The DenseNet architecture explicitly differentiates between information added
    to the network and preserved information. DenseNet layers are very narrow (for
    example, 12 feature-maps per layer), adding a small set of resource maps to the
    “collective knowledge” of the network, keeping the resource maps unchanged and
    the final classifier makes a decision based on all network maps.


    One of the great advantages of the DenseNet (Figure 2) is the improved flow of
    information and gradients across the network, which facilitates training. Each
    layer has direct access to the gradients of the loss function and the original
    input signal. This helps train deeper network architectures (Huang, Liu, Maaten,
    & Weinberger, 2016).'
