  md: '# BASICS OF CODING IN TENSORFLOW


    The main object of the TensorFlow program is the tf.Tensor that manipulate and
    pass around. A tf.Tensor has the following characteristics:


    +   - A data type (for example int32, float32, or string)

    - A shape


    The data type of each element in the tensor should be the same and is always known.
    The shape (i.e., the number of dimensions and the size of each dimension) might
    be partially known. Some special kinds of tensors are as follows that will be
    discussed in the next section of this chapter:


    +   - tf.Variable

    - tf.constant

    - tf.placeholder


    TensorFlow core program consists of two distinct sections


    +   - Building the computational graph

    - Running the computational graph


    **Building the computational graph (using tf.Graph):** TensorFlow uses a dataflow
    graph or computational graph to denote the computation in terms of association
    between individual operations. In this step, tf.Operation (node) and tf.Tensor
    (edge) objects are constructed using TensorFlow API functions and add them to
