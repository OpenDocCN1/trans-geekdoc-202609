  md: '# Malaria Detection System Using Convolutional Neural Network Algorithm


    X = (Wi-K+2P)/S + 1 ... (1)


    P = (K-1)/2 = (5-1)/2 = 2 ... (2)


    where,

    nX: output

    Wi: input

    K: size of the filter/kernel = 5

    P: non-zero padding

    S: size of stride = 1


    The output matrix is then passed to the ReLu Layer, which operates the output
    matrix through the activation function to remove all the negative values present
    in the output matrix of the convolutional layer. In this layer, the values of
    the matrix are activated if the input is above a certain threshold and remains
    zero if the input is zero. The activation function is applied in such a way that
    there is a linear relationship between the dependent variables.


    After the activation function is applied to the matrix, the output matrix is passed
    to the pooling layer. The main objective of using this image is to shrink the
    size of the feature matrix. Here, window size is considered that it is applied
    to the entire matrix. From that window maximum value is taken and put into the
    final matrix. Hence, a shrunken matrix is formed containing the maximum values
    from each section of the window applied to the matrix obtained after the relu
    layer (Rahman et al. 2019).


    X = (Wi-K)/S + 1 ... (3)


    where,

    Wi: input

    X: output

    K: size of filter = 2

    S: size of the stride = size of filter given


    All the layers applied in the model are not stacked upon wherein the layers are
    applied again in the same sequence over the shrunken matrix. This shrinking of
    the matrix for specific features helps in generating strong models and easy classifications.


    After the model is generated the final classification of the image is done using
    the fully connected layer. The shrunken matrix obtained from the pooling layer
    is now converted into a single list or vector form in which the matrix is arranged
    row-wise. In the original image, some vector are reserved for the specific features,
    they are then compared with the vector created from the shrink matrix. The values
    at the specific vectors are added up and divided by the sum of the vectors of
    the original image to represent the specific features, and the higher value is
    classified as the particular feature in the image. Hence, the detection is based
    on the higher vector addition values. Figure 4 represents the fully connected
    layer in the CNN model.'
