    Keras is a neural network library (open-source) and coding in Python programming
    language that able to run on of high levels of TensorFlow, Theano, or Microsoft
    Cognitive Toolkit. Usually, Keras developed to facilitate rapid experimentation
    using deep neural-networks with user-approachable, modular, and extensible. The
    Keras was established by François Chollet, a Google engineer in the research project
    of ONEiros (Open-ended Neuro-Electronic Robot Operating System). Chollet is also
    one of the authors of Xception deep neural network model (Chollet, 2017). Interestingly,
    Google''s TensorFlow supporting Keras in TensorFlow''s core public back in 2017.
    Cholletts argued the Keraswas considered being edge rather than a self-governing
    ML-framework. Keras provides a higher-level approach, an extra impulsive set of
    concepts that create it simple to develop DL models irrespective of computational
    back. In this context, Microsoft incorporates CNTK back to Keras, which is available
    as CNTK v2.0.


    Keras library comprises various neural-based operations including types of layers,
    objectives, activation functions, optimizers, and hot tools that make suitable
    for working with image and data mining. The code is hosted on GitHub, and community
    forums that support GitHub issues, and slack channel. Keras consents for convolutional,
    persistent neural-networks, and supplementary utility layers (dropout, batch normalization,
    and pooling). Furthermore, Keras consents to the users of DL models on smartphones
    like iOS and Android, on the web, and Java Virtual Machine. Additionally, Keras
    permit the use of circulated training of DL models on GPUs and Tensor processing
    units (TPUs). In recent times, Keras claims more than 200,000 users in 2017 and
