    # SUMMARY (COMPARISON OF TRADITIONAL TECHNIQUES WITH THE DEEP LEARNING APPROACH)


    Conventional or traditional image processing requires the features that need to
    be classified to be hand-coded. The image needs to be analysed at every step in
    traditional methods of image processing. Pre-processing, transformations, and
    identification of filters are some necessary steps to apply the input to find
    the features. As discussed in the chapter, text extraction using traditional image
    processing methods includes pre-processing, block extraction, perimeter detection,
    and text extraction. On the other hand, deep learning learns the features while
    training the models. The network is very deep and is made up of a large number
    of layers of neurons. Each layer has features extracted at the output of the'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Text Separation From Document Images


    layers. Different deep learning models have proven to give state-of-the-art results.
    The collection of the dataset for training the model is extensive and requires
    more powerful machines to train the model. It provides excellent results when
    the dataset is large. Conventional image processing is still used when the dataset
    is not vast. Transfer learning transfers knowledge from one model to another,
    similar to what a human does when learning some task. Thus, it makes deep learning
    accurate results and solves the more complex tasks.


    Despite various advantages of deep learning, it suffers from disadvantages too.
    Deep learning is data-hungry. The dataset used in the chapters are created by
    the author, which requires human efforts. Again, the deep networks are costly
    during training, as they require expensive GPUs for implementation. The selection
    of the network is also a cumbersome task. There is no standard theory available
    to select the appropriate network. Deep learning requires knowledge of topology,
    and training methods for designing and selecting any network.


    # CONCLUSION


    Research in the field of text extraction from document images is explored in this
    chapter. Traditional image processing and deep learning methods using transfer
    learning (fine-tuning the base model) for Devnagari text separation are explored.
    From the literature survey, it is evident that there are four types of approaches
    for segmenting text: top-bottom, bottom-up, hybrid, and deep learning.


    For conventional methods, the features need to be hand-coded which is required
    for text extraction, while in the deep learning approach, the features are automated.
    The deep learning gives better accuracy over conventional methods. A transfer
    learning method of fine-tuning the base model (U-Net and ResU-Net) improves the
    result. U-Net network yields 95% segmentation accuracy on data while ResU-Net
    gets 98% accuracy. The higher efficiency of the ResU-Net is due to the presence
    of residual connections present in the network. Further, word and line segmentation
    can be added to the proposed model for Optical Character Recognition. Accuracy
    of the proposed model for Devnagari text segmentation can be further improved
    by designing new deep network models.


