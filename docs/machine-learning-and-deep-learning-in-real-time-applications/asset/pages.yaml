    As the authors have discussed in the above section that deep neural network consists
    of a single input, multiple hidden layers and a single output layer. The architecture
    of the human brain highly inspires the architecture of a neural network. In the
    human brain, neurons are responsible for passing signals around the brain. Similarly,
    units are responsible for taking the inputs, perform computations and then passing
    the values to the other units in neural networks.


    Add lines of code to define the number of units per layer. The authors have taken
    784 units of the input layer to represent each pixel of the 1D vector as discussed
    above. Ten units of the output layer represents the digits from 0 to 9.


