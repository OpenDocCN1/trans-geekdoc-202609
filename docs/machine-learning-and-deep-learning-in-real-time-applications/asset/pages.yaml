    # Summary


    There has not much work done in OCR research of the Indic script, and even the
    accuracy level has not improved compared to the Latin script. Text separation
    is one of the pre-processing steps of an OCR system. Literature review shows that
    text separation from the document images can be classified as a top-down approach,
    bottom-up approach, hybrid technique, and deep learning methods. The first three
    approaches (i.e., top-down, bottom-up approach, and hybrid technology) under traditional
    methods for text separation. Literature shows that conventional methods require
    many steps for hand-coding features and then performing text and non-text segmentation.


    On the other hand, deep learning is an end-to-end system. It does not require
    any pre-processing or hand-coded feature extraction and learns features automatically.
    Deep learning has different models for classification, segmentation, object detection,
    and various other applications. Deep learning gives state-of-the-art results on
    these applications compared to traditional methods. Text separation with deep
    learning methods improves accuracy. The literature survey shows that not much
    work has been done in the field of text separation using image processing and
    deep learning methods.


