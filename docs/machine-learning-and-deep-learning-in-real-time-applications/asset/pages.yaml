    # InceptionV3


    The winner of the ILSVRC 2014 contest was GoogleLeNet (V1) from Google. It achieved
    a top-5 error rate of 6.67%, very close to the human-level performance, also rated
    by the organizers.

    The network used a LeNet-inspired CNN built with a new element called the Inception
    module (represented in Figure 9). It used batch normalization, image distortions
    and optimizer RMSprop. Its architecture consists of a deep 22-layer CNN reduced
    the number of parameters from 60 million (from AlexNet) to 4 million (Das, 2018).

    The use of average pooling allows for easy adaptation and fine-tuning for other
    layers. The authors came to the conclusion that switching from fully-connected
    layers to average pooling layers improved the top-1 results by 0.61%, with no
    dropout.

    Given the large size of the network, the ability to propagate the gradient across
    all layers was a concern. Adding intermediate layer classifiers enabled discrimination
    at lower stages of the classifier, increasing the propagated gradient signal back
    and providing additional regularization. These classifiers are in the form of
    small convolutional networks placed at the top of the Inception modules (additional
    pooling paths). During training, the loss is added to the total loss of the network
    with a weight discount. At the inference, these auxiliary networks are discarded
    (Szegedy, et al., 2014).'
