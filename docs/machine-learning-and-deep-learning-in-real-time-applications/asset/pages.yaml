- pgno: 332
  md: '# Text Separation From Document Images


    **False Positive (FP):** It is the number of normal samples detected as abnormal
    samples by the classifier algorithm.


    **Precision:** Precision is the ratio of correctly predicted positive observations
    of the total predicted positive observations. Precision = TP/TP+FP.


    **Recall (Sensitivity):** Recall is the ratio of correctly predicted positive
    observations to all observations in actual class - yes. Recall = TP/TP+FN.


    **Sensitivity:**** Sensitivity is a percentage of correctly classified abnormal
    samples, and it is given by the ratio of true positive to the addition of true
    positive and false negative samples.


    **Specificity:**** Specificity is a percentage of correctly classified normal
    samples, and it is given by the ratio of true negative to the addition of true
    negative and false positive samples.


    **True Negative (TN):** It is the number of normal samples detected as normal
    samples by the classifier algorithm.


    **True Positive (TP):** It is the number of abnormal samples detected as abnormal
    samples by the classifier algorithm.'
