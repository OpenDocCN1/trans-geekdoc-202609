    # ## Convolution 2D-layer


    The 2-D convolutional layer applied as sliding convolutional filters to the input.
    The layer convolves the input by moving the filters along the input vertically
    and horizontally and computing the dot product of the weights and the input then
    adding a bias term. Figure 11 build a model with Convolution 2D through Keras
    API.


