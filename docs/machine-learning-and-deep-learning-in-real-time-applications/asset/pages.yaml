    Duan, L., Wan, C., Li, J., & Guo, Q. (2015) proposed Kernel Extreme Learning (kernel-ELM)
    for separating text from images to retrieve patent documents. The technique has
    a good optimization construction and generalization at speed. The input document
    image is first segmented into blocks of images using segmentation based on 8-connectivity
    criteria. Each block is used for training the classifier. Training is carried
    out using a four-class kernel ELM classifier.


    Kuo-Chin Fan, Chi-Hwa Liu and Yuan-Kai Wang (1994) utilize segment text and non-text
    regions in an image. A run-length segmentation operation is performed on the image,
    and then a strip merging procedure segmenting the text/non-text blocks in the
    document.


    Hung-Min Sun (2006) proposed a well-known method for document segmentation called
    Constrained Run-Length Algorithm (CRLA). The algorithm works on Manhattan layouts
    but does not perform on complex layout pages. It uses only local information during
    smearing, which is its main drawback and leads to erroneous leakage of text and
    graphs.


    Kuo-Chin Fan, Liang-Sheng Wan and Yuan-Kai Wang (1995) proposed a system which
    does document segmentation and then performed identification of the segmented
    block. They used recursive segmentation to segment a document into several blocks.
    The blocks are non-overlapping. Later, they extracted the features of the segmented
    block using a connectivity histogram and multiresolution analysis.


