    # BACKGROUND


    Document segmentation uses three approaches: top-down, bottom-up, and a hybrid
    approach. Each of the three approaches, top-down, bottom-up, and hybrid, in turn,
    consists of three steps: pre-processing, segmentation, and classification or feature
    extraction. The deep learning approach does not require pre-processing and feature
    extraction steps. Some work has been carried out using the deep learning approach
    by making use of Semantic Segmentation. Literature reviewed explains text segmentation
    using top-down, bottom-up, hybrid, and deep learning approaches.


    # Top-Down Approach


    This approach first detects large-scale features also called the highest level
    of the text (like images, columns, etc.) in the input data. It splits the highest-level
    structure into small segments until it reaches the small-scale features (like
    individual characters). Thus, top-down methods require prior knowledge of the
    input image (e., document image).


    Jean Duong and Hubert Emptoz (202) sed printed documents for text separation.
    They introduced entropic discrimination, which is a simple separation using one.
    Entropy heuristics are used to separate text and non-text areas. The non-text
    region regular histograms with the text region gives regular horizontal projection
    histograms.


