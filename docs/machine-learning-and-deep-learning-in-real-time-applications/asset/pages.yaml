    # Existing Networks for Semantic Segmentation


    A large and growing body of literature has investigated various semantic segmentation
    deep models applied to multiple applications. Some of them are discussed here.
    Shellhammer and Long (2015) demonstrated a segmentation task on numerous applications
    using one of the semantic segmentation models called Fully Convolutional Neural
    Network (FCN). The network uses a skip connection to avoid the vanishing gradient
    problem. Other segmentation models are variants of the FCN model. Ronneberger
    et al. (2015) found U-Net architecture (a variant of FCN) to solve the problem
    of medical image segmentation. The architecture does not use the skip-connection
    of the FCN; instead, it has the concatenation of different feature maps from the
    encoder to the decoder to improve segmentation accuracy. Another variant of the
    FCN is SegNet designed by Badrinarayanan et al., (2017) that has a modified variant
    with 13 convolutional layers of VGG16. It also includes the use of pooling indices
    in the decoder part of the model for deconvolution. ResU-Net proposed by Zhengxinet
    et al., (2018) is designed for extracting roads from the satellite images and
    has residual connections.


    # Transfer Learning Scenarios and Selection in Deep Learning


    Humans can transfer knowledge which they learn from one task to some other related
    job. For example, once a person learns to ride a bike, he/she can learn to ride
    motorcycle. This task is done by transferring the knowledge acquired/learned from
    riding a bicycle to the motorcycle. Things learned in the past are made use to
    learn new things.

    The idea of transferring knowledge is used in Deep Learning. It is called Transfer
    Learning (TL). Most of the deep learning models are specially designed for specific
    or particular tasks and domains. These models can give state-of-the-art results
    with high accuracy on the test data of the assigned task. But it can result in
    the worst outcome when applied on a new task which has a similar type of dataset.
    The same model is inbuilt for the second task. The models also require a lot of
    data to solve complex problems. The dataset requires considerable effort and time
    for preparation. For example, ImageNet dataset'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Text Separation From Document Images


    is a labeled dataset which has millions of images in it. To collect such a dataset
    for a particular domain is a very tough job. Transfer learning helps to leverage
    the knowledge of the previously trained model, i.e., pre-trained model on the
    new problems with either a similar dataset or tasks instead of building an isolated
    model. The transferred experience/knowledge can be weights, features, standard
    models, or pre-trained models and tackle the problem of creating a large dataset.
    It speeds up the training of the second task and also improves the performance.
    Transfer learning is also beneficial when the number of datasets is less. There
    are various ways which explain the modes to transfer the knowledge of the previously
    learned task to the new task in deep learning. These modes help to decide the
    best method for using a transfer learning approach in the respective applications.


    # MODES IN TRANSFER LEARNING


    # Pre-Trained Model as a Feature Extractor


    A pre trained model is a network already trained and saved using a large dataset.
    It is used directly on a new dataset, but the accuracy will not be as good as
    with the dataset with which it was trained earlier. Thus, a pre trained model
    can be used as a feature extractor, and further used by another dataset with higher
    accuracy. Deep learning architecture is a layered model made of many hidden layers
    (like CNN, max-pooling, fully connected layer, etc.). The output at each layer
    represents either a low-level feature or a high-level feature. The deep model
    already trained on some dataset for a specific task has learned parameters (i.e.,
    weights). A pre trained network (such as Inception V3 or VGG) used with another
    dataset for particular tasks is formed by removing the classification layer of
    the base model. The classification layer usually is the FC layer or some last
    hidden layer of the model. The output of the final segment of the pre-trained
    model is given as input to other classifiers (like SVM, etc.). The dataset used
    with the pre-trained network is similar to the one with which the model was trained.


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_320_0.png)'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Text Separation From Document Images


    The model in Figure 11 (a) (Shreya Ghelani, 2019) is already trained on the earlier
    dataset and the last three layers are removed. The pre-trained model now acts
    as a feature extractor with trained weights and is connected to another shallow
    classifier (e.g. SVM). The input from a new dataset is applied to the network
    as shown in Figure 11 (b) (Shreya Ghelani, 2019) which extracts meaningful features
    from the samples from pre-trained network and passes it on to the classifier.
    The base layers already contain the features that are useful for classifying another
    dataset. The model with another dataset is trained using this feature and weights
    provided from the base model.


    # Fine Tuning


    The input required when training with a pre-trained model should be similar to
    the dataset input with which the model was trained. In some cases, the input data
    to the pre-trained network is not what is usable by it. In cases, the pre-trained
    network needs to be fine-tuned. For fine-tuning, the weights of the initial layer
    of the base model are frozen, and the fine-tuning is performed on the last layers
    attached to the pre-trained model. Or, fine-tuning uses the entire model, which
    is initialized with pre-trained weights, and the whole model is fine-tuned. The
    whole model is tuned when the dataset used to train the pre-trained network.


    # METHODOLOGY TO SEPARATE DEVANAGARI TEXT FROM IMAGES USING TRANSFER LEARNING


    # Key Features of the Implemented Method


    Important features of the method are:


    +   - To prepare a dataset for segmentation of Devanagari document images.

    - To segment the text from the document image using deep learning and transfer
    learning approach (semantic segmentation).


    # Description of the Method


    The methodology to separate Devanagari text from document images is given in Algorithm
    5 using two deep learning models called U-Net and ResU-Net. U-Net is used for
    biomedical image segmentation, and ResU-Net is used to extract roads from satellite
    images. The task of Devanagari text segmentation is different from the task for
    using U-Net and ResU-Net. Therefore, fine-tuning of the whole model, is a mode
    of transfer learning, is best suited to the task of text segmentation. Figure
    12 (Ronneberger, O., Fischer, P., & Brox, T., 2015) shows the architecture of
    U-Net. It consists of contractive (encoder) and expansive (decoder) paths. The
    contractive path architecture is similar to that designed for the classification
    path. The contractive path extracts important features of the input image, which
    are then given as input to the expansive path. The expansive path has upsampling
    of the feature maps received from the encoder and deconvolution. It helps to localize
    and segment the input image. The U-Net model has the concatenation of feature
    maps from the encoder to the decoder to increase'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Text Separation From Document Images


    the resolution of the output image. ResU-Net has a similar architecture to that
    of U-Net with an extra residual connection in the model (Figure 13 (Zhang, Z.,
    Liu, Q., & Wang, Y., 2018)).


    The residual connections help to train the model fast and avoid the vanishing
    gradient problem, which occurs in most of the deep learning networks. The following
    equation gives the residual connection:


    ```

    $y_i = h(x_i) + F(x_i, W_i), x_{i+1} = f(y_i).$

    ```


    $x_i, x_{i+1}$ are the input, $f(y_i)$ s activation function, and output to the
    residual layer at the $l$-th position. $f(\cdot)$ are the residual function of
    the section and $h(x_i)$ is the identity mapping.


    Figure 12. U-Net architecture


