    # ABSTRACT


    In any industry, attrition is a big problem, whether it is employee attrition
    of an organization or customer attrition of an e-commerce site. If we can accurately
    predict which customer or employee will leave their current company or organization,
    then it will save much time, effort, and cost of the employer and help them to
    hire or acquire substitutes in advance, and it would not create a problem in the
    ongoing process of an organization. In this chapter, a comparative analysis between
    various machine learning approaches such as Naive Bayes, SVM, decision tree, random
    forest, and logistic regression is presented. The presented result will help in
    identifying the behavior of employees who can be attained over the next time.
    Experimental results reveal that the logistic regression approach can reach up
    to 86% accuracy over other machine learning approaches.


    # INTRODUCTION


    Today attrition is one of the major problems faced by industry across the world.
    It is the most burning issue for the industry, and high attrition rates lead to
    many issues in the boundary of the organization like losing talents and knowledge,
    related to training and administration, and recruitment. It is observed that many
    attributes lead to the attrition of an employee. Which includes working environment,
    job satisfaction, employer’s behavior, job timing, and most important is salary
    or incentives. Also, the prediction model plays an essential role in finding the
    behavior of employees.


