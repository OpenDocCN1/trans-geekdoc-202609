    # Neural Network


    A neural network is a type of mathematical algorithm that learns the patterns
    in data and can predict the output when shown new data on its own. The brain loosely
    inspired the design of a neural network.


    Figure 1. A simple neural network (Fadja et al., 2018)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_88_0.png)


    Each circle in figure 1 is called a node or neuron. The arrows connecting nodes
    of one layer to the nodes of another layer are called weights. These weights are
    the parameters that the neural network learns to predict the output.


    A neural network has three types of layers: input, hidden, and output. The input
    layer takes in data. The output layer gives the predicted output. The number of
    nodes in the output layer determines the number of possible outcomes. The hidden
    layer is the intermediary layer that learns the complex functions. There can be
    several hidden layers depending on the size of the data.


    In Figure 2, the value of a node is determined by the sum of values of previous
    nodes multiplied by its corresponding weight.


    ```

    z = Σwⱼ * xj + b; a=f(z).

    ```


    z is passed through a non-linearity function f. also known as activation function,
    such as Relu, sigmoid, or softmax, so that the neural network can learn complex
    functions and not just linear functions.'
