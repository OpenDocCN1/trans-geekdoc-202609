  md: '# Algorithms


    Dimensionality reduction using Principal Component Analysis (PCA)


    In the proposed prediction model, PCA (Mackiewicz & Ratajczak, 1993) is used for
    reducing the vast data. There are many reasons why one wishes to reduce the dimensionality
    of input data. Many times the complexity of the model depends on the number of
    dimensions in the data as well as the size of the data sample. When the dimensions
    are reduced then the cost related to extracting the not required dimensions reduced.
    Many times the models are robust when the dataset is small and gives accurate
    results. Also, data with few dimensions can be visualized properly to reduce the
    outliers.


    Consider a p-dimensional random variable U with $\Sigma$ and let $\lambda_1..
    \lambda_p$ be the eigenvalues. Consider that $P_1...P_p$ are the corresponding
    Eigenvectors of $\Sigma$. One can write:


    ```

    $\Sigma = \lambda_1 P_1 P_1^T + ... + \lambda_p P_p P_p^T$

    ```


    ```

    $\Sigma = P_1 P_1^T + ... + P_p P_p^T$

    ```


    ```

    $P_i^T \Sigma P_i = \lambda_i, P_i^T \Sigma P_j = 0. i \neq j$

    ```


    The transformed random variables can be represented as:


    ```

    $Y_i = P_i U, i=1...P$

    ```


    Here Y is the new random variable vector and P is the orthogonal matrix then Y
    can be obtained from U by the orthogonal transformation $Y=PU$. Here this random
