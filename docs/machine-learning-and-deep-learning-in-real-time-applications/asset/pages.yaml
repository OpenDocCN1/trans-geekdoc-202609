    \ Studies (UPES), India\nVidyanman Mishra, Department of Systemics, School of\
    \ Computer Science, University of\nand Energy Studies (UPES), India\n\nA branch\
    \ of artificial intelligence (AI) known as deep learning consists of statistical\
    \ analysis algorithms\nknown as artificial neural networks (ANN) inspired by the\
    \ structure and function of the brain. The accuracy\nof predicting a task has\
    \ tremendously improved with the implementation of deep neural networks, which\n\
    in turn incorporate deep layers into the model allow allowing the system to learn\
    \ complex data. This chapter"
