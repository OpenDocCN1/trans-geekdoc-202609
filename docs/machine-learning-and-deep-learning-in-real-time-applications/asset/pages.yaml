  md: "# Detailed Table of Contents\n\nForeword ............................................................................................................................................................................\
    \ xv\n\nPreface.......................................................................................................................................................................\
    \ xvii\n\nAcknowledgment ...................................................................................................................................................\
    \ xx\n\n# Chapter 1\n\nObtaining Deep Learning Models for Automatic Classification\
    \ of Leukocytes,.......................................... 1\n\nPedro Jodo Rodrigues,\
    \ CeDRI, Research Centre in Digitalization and Intelligent Robotics,\nInstituto\
    \ Politécnico de Bragança, Portugal\n\nGetélio Peaito Irejas, CeDRI, Research\
    \ Centre in Digitalization and Intelligent Robotics,\nInstituto Politécnico de\
    \ Bragança, Portugal\n\nRomeu Ferreira, Instituto Politécnico de Bragança, Portugal\n\
    \nIn this work, the authors classify leukocyte images using the neural network\
    \ architectures that won the\n ILSVC competition. The classification of leukocytes\
    \ is order to select the ones that achieve the best performance for\nthe same\
    \ networks trained from scratch in order the intended task. The categories used\
    \ were eosinophils, lymphocytes, monocytes, and neutrophils. The\nanalysis of\
    \ the results takes into account the amount of training required, the regularization\
    \ techniques\nused, the training time, and the accuracy in image classification.\
    \ The best classification results, on the\norder of 98%, suggest that it is possible,\
    \ considering a competent preprocessing, to train a network like\nthe DenseNet\
    \ with 169 or 201 layers, in about 100 epochs, to classify leukocytes in microscopy\
    \ images.\n\n# Chapter 2\n\nDeep Learning Using Keras ................................................................................................................\
    \ 33\n\nDeepa Joshi, Department of Systemics, School of Computer Science, University\
