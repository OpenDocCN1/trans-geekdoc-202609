    # Review of Related Works


    As we discussed in the introduction of this paper, the bustering problem is a
    NP-hard Tany (2002). For that reason, memetic-heuristic approaches are generally
    employed to the problem by finding suboptimal solutions. Cheng & Church (2000)
    were the first to apply this concept on clustering in gene expression data. Their
    objective is to select busters with a MSR value lower than given threshold. Here,
    authors arrived at an iterative search approach which deletes/adds rows/columns
    to the busters. The single node deletion method removes the row or column with
    low quality according to MSR. The strategy succeeds in discovering busters with
    coherent values. Since, the method selects one cluster at a time, repeated application
    of the modified method is needed for finding memetic solutions. This has the drawbacks
    with the local characteristics in heavily overlapping sets.


    Most of clustering methods of binary microarray data, including BiMax and GBC,
    fail to extract pertinent clusters on sparse binary datasets. Therefore, Saber
    & Ellouri (2015) presented BiBin Alter, Bibin Biin Sim and BiMax for clustering
    of binary microarray data. It starts with binarize threshold to transform the
    input gene expression to a binary one. Ayadi et al. (2012) presented a Pattern
    Driven Neighborhood Search (PDNS) approach for the clustering method. PDNS follows
    up a preprocessing to transform the input data matrix to a binary matrix and a
    decorated neighborhood taking into account various patterns. (Ayadi & Hao 2014)
    proposed a Memetic Clustering Algorithm (MBA) which is able to detect negatively
    correlated busters. This method adopts population-based search and neighbourhood-based
    local. It is generally considered that the population-based search framework provides
    more facilities for exploration while neighbourhood Huang et al. (2012) proposed
    a clustering algorithm called Condition-Based Evolutionary Clustering (CBEB) which
    is based on the of an Evolutionary Algorithm (EA) with hierarchical clustering.
    In this technique, the conditions are isolated into a number of condition subsets,
    also called subsets.Mapaut et al. (2014) proposed Evolutionary Clustering based
    on a new crossover (ACross). It applies a fast-search method to generate an initial
    population with better quality. Yidong et. (2016) present a novel clustering algorithm,
    which is called Weighted Mutual Information Clustering (WMIC) whom it detects
    the local characteristics of gene expression data.


    A supervised hidden Markov model (HMs) was developed inThanh et al (2015) for
    forming the classification with help of gene expression profiles. But, an optimal
    subset of genes was not selected for classification. Kun-Huang et al (2014) proposed
    a particle swarm optimization technique with decision tree classifier was developed
    to select an efficient gene from thousands of candidate genes in cancer detection.
    However, the hybrid search algorithm without minimizing the execution time. A
    machine learning (ML) techniques were presented in Konstantin et al (2015) to
    select certain genes for cancer prediction. A Hybrid search method Simulated Annealing
    with a Greedy Algorithm (SAGA) and Bayesian Networks was developed in Emmanuel
    et al (2015) for detecting the transcriptional correlations among the genes. However,
    the false discovery from true relations was not improved. A new gene expression
    based classification approach (GECC) was introduced in Saito et al2014) for performing
