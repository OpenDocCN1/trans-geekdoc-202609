    # RESULTS


    Implementing a model in a new set of data is a highly complex task whose evaluation
    depends on the innumerable factors inherent in the data, type source (as well
    as the level of pre-processing of data), the network architecture used, the hardware
    and frameworks used. Some metrics not evaluated in this work: transfer rate, utilization
    of GPU computing, using FP32, CPU usage and memory consumption (Zhu, et al., 2016).


    In the classification of leukocytes identified in this work we use open-source
    implementations available on the Internet and provided by its developers, and
    in this case, mediated by the Keras library.


    The analysis of the project results mainly focuses on the accuracy and loss of
    training and validation of a set of models subsequently tested in the classification
    of four categories of leukocytes based on microscopic images. In the test dataset,
    which has different training and validation images, the percentage of correctness
    of each of the models (with and without transfer learning) is given, taking into
    account the time required to perform the training.


    For the value of loss, the lower it is, the better the model in question (unless
    it is overfitting on the training dataset). The loss is calculated during training
    and validation processes, and its interpretation tells us how good the performance
    in these datasets is. Unlike accuracy, loss is not a percentage value, but the
    sum of errors for each training example (using the cost for a set of examples
    or batch) in the training and validation sets.


    In case of the neural networks, the loss is usually given by the negative logarithm
    of the probability (softmax) of it. The main purpose of the model implementation
    is to reduce or minimize the loss function by changing the network weights using
    different optimization methods. The value of the loss gives an idea of the behavior
    of the model after each optimization iteration. Ideally, a reduction in this value
    should be expected after one or several iterations.


    Although accuracy can be verified after each iteration, in the case of training,
    this value is only a reference for the correctness percentage of the model. The
    final precision value, obtained after learning all the parameters with the conclusion
    of the training, is the one that should be taken as correct. After'
