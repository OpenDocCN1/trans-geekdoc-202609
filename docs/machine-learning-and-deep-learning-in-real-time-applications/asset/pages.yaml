  md: '# Deep Learning With PyTorch


    # Machine Translation


    Translations between various languages is important for exchange of ideas and
    information between populations of different linguistic backgrounds.


    Deep learning makes it easier to translate between different languages without
    the need of a human interpreter.


    This section shows how to use recurrent neural networks for translating from one
    language to another. As every language involves complex grammar rules specific
    to their own, merely translating each individual words does not make any sense.


    When a deep learning algorithm, called sequence-to-sequence, is fed a lot of parallel
    text data, with the same sentence or phrase in the two languages, the algorithm
    starts understanding these language semantics and is able to translate between
    the two languages.


    Next, the working of sequence-to-sequence is discussed.


    # Sequence-to-Sequence (Sutskever et al., 2014)


    A sequence-to-sequence model is made of up of two recurrent neural networks called,
    encoder and decoder. The encoder takes the input sequence and creates a fixed
    size vector that contains the encoded information of the sequence. The decoder
    uses this vector to create a new sequence, in this case, a translation.


    Table 10 shows how to define a Neural Machine Translation model with encoder and
    decoder.


    In the constructor method of class NMT the two LSTM layers to encoder and decoder
    are defined along with linear layers. The forward method is an overloaded method
    of nn.Module class that runs to create the model and forward propagate.


    Source_padded and target_padded are padded tensors that contain index of the words
    of every sentence in the vocabulary. The source_padded tensor is passed to the
    encoder LSTM layer that is defined as encode method. The encode method returns
    hidden states of sentence, enc_hid and a tensor containing all the information
    of sequence which is fed to the decoder LSTM, dec_init_state. These tensors are
    used by the decoder to generate a translation to the target language.


    # Malware Detection (Yuan et al., 2014) (Pascanu et al., 2015)


    Deep learning helps in detecting malware efficiently in applications that could
    be disastrous for a user by stealing their personal information, deleting important
    files, etc.


    Using RNN and CNN, the code sequence of an application is analyzed, and the application
    is labeled as malicious or benign. By showing codes of several malicious and benign
    applications, the deep learning model starts understanding if a particular application
    contains some malicious code even if it is not seen that exact malicious code
    before in training data.


    This problem is still under research as attackers find new methods to fool previous
    counter methods. Since it is a research problem so using PyTorch to develop models
    is very effective as they are easy to debug and new methods can easily be implemented.'
