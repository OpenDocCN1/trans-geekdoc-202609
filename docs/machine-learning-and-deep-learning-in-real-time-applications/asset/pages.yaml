    set that has thousands of images of the classes that we want to identify, and
    each of images has a label of the respective category (Deshpande, 2016). For example,
    a training image of a handwritten digit enters a CNN, a 32x32x3 matrix that passes
    through the entire network. In the first training example, with all the weights
