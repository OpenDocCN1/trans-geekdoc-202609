    The learning rate is defined or chosen at random. A high learning rate means that
    larger steps are used in weight updates, and it may take less time for the model
    to converge to an ideal set of weights. However, a very high learning rate can
    result in jumps that are too large and not accurate to reach the ideal point.


    All these steps constitute a training iteration. The program will repeat this
    process for a fixed number of iterations for each set of batch images. After finishing
    the parameter update in the last training example, the network is expected to
    be trained, meaning that the weights of the layers are adjusted correctly (Deshpande,
    2016).


    # Activation Functions


    Neural networks can use various types of activation functions. The selection of
    the activation function is an important issue since it has a direct impact on
    the processing of input information. The activation functions used in this project
    were the ReLU and Softmax.


    # ReLU


    In 2010 Teh and Hinton introduced the ReLU (Rectified Linear Unit), despite its
    simplicity, is a good choice for hidden layers. The advantage of ReLU (shown in
    Figure 3) lies, partly, in that it is linear and unsaturated. Unlike the sigmoid
    and hyperbolic tangent functions, the ReLU does not saturate in the positive domain,
    although it saturates in the negative domain. A saturation function tends to move
    to a certain value (Nisisco, 2016).


    The neuroscience literature indicates that cortical neurons are rare in their
    saturation regime and suggest that their activation function can be approximated
    by a rectifier (Bush & Sejowski, 1996). After initialization of the weights, about
    50% of the continuous values of the hidden layers are real zeros, and this fraction
    can easily increase with the sparsity-induced regularization (relative to the
    number of connections between a neuron with other, which is to be minimized),
    being biologically more plausible than many other activation functions (Glorot,
    Bordes., Bengio, 2011).'
