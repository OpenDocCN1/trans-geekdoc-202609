- pgno: 30
  md: '# Obtaining Deep Learning Models for Automatic Classification of Leukocytes


    Each layer describes locations in the original image where contain low-level features
    appear. When you apply a filter set to this information, the output will represent
    higher-level features. The types of these characteristics can be semicircles or
    squares. As you go through more layers of convolution, you get activation maps
    representing increasing aggregations of complex resources (Deshpande, 2016).


    # Fully-Connected Layer


    A fully-connected layer is useful at the end of a multi-layered CNN model. For
    example, if multiple layers of convolution, ReLU, and pooling, the output of the
    current layer contains distributed representations for the input image; one wants
    to use all these features in the fully-connected layers to create the right responses
    at the final stage. A fully connected layer is useful for this purpose. Assuming
    the input of a layer $x''$ has size $H*W*D$, if one uses convolution kernels with
    size $H*W''*D$, then the $D$ cores form a tensor of order 4 in $H*W''*D$. It is
    obvious that to calculate any element in $y, y \in e^R$. one needs to use all
    elements in the input $x''$. This layer is a fully-connected layer but is implemented
    as the convolution layer it is, so it is not necessary to derive learning rules
    for a fully-connected layer separately (Wu, 2017).


    # IMPLEMENTATION


    # Frameworks, Programming Languages and Equipment Used


    The Jupyter Notebook using Python and the Keras API (using the TensorFlow as backend)
    were used for the construction and implementation of the leukocyte classification
    project. The machine used to implement the NNS has the following characteristics:
    Intel Core i7 5930K @ 3.7GHz with 32 GB RAM and 2 * GTX 1080 Ti 11 GB GPUs.


    # Data-Processing


    The dataset initially developed in the development of the program contains 598
    leukocytes (stained) images. Most of the images (approximately 352) come from
    a repository on GitHub (available at https://github.com/thruvbp/wb-classification/tree/master/Original_Images).
    The remaining images were obtained through a search performed on Google according
    to specific terminology, ''monocyte'', ''leukocyte'', ''lymphocyte'', ''neutrophil''.
    Basophils were excluded because of the poor representativeness in the blood, which
    was reflected in the difficulty of finding images in amounts similar to those
    obtained for the remaining leukocytes. For similar reasons, band leukocytes were
    also excluded. The dimensions of the dataset images vary according to their provenance.


    A big part of the focus of this work was the dataset preprocessing. It was necessary
    to label each of the collected images according to the 4 categories to be classified.
    Subsequently, each image was manually segmented in order to produce the NN with
    a register, as possible, of framing of the cell using GIMP (GNU Image Manipulation
    Program), a popular image editor with several tools that facilitate graphic editing
    tasks was used to segment all images manually. Figure 6 exemplifies the manual
    segmentation process performed.'
