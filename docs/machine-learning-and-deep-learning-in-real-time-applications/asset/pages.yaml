    # Objectives


    Facial expressions having a vital role in emotional perception are imported in
    the nonverbal interaction system as well as in the identification of individuals.
    In everyday emotional interaction, they are very necessary, just next to the tone
    of voice. Therefore, our research aims to read the emotion of the user from his/her
    facial expression. PSMS is a patient management system in which we aim to identify
    whether the patient is happy from his/her doctor.


    # BACKGROUND


    # Conceptual Overview


    A convolutional neural network (CNN or ConvNet) is a type of neural networks,
    usually used for analysis of visual images.


    CNNs are multilayer perceptron''s regularized models. Multilayer perceptron usually
    refers to networks that are entirely connected, i.e each neuron in one layer is
    linked to all neurons in the next layer. These networks "full connectivity" make
    them predisposed to over-fitting. Many types of regularization adding to the function
    sum some form of weight measurement of magnitude (Sankar et al., 2018a). However,
    CNNs take a different approach to regularization: using smaller and simpler patterns,
    they utilize the advantage of data hierarchy in arrangement and accumulate more
    complex patterns (Devi et al., 2020a).


    Therefore, CNNs are at the lower extreme of connectivity and complexity. These
    are also known as Artificial Neural Networks (SIAN) shift invariant or space invariant,
    based on the characteristics of their mutual invariance in design and translation.
    CNNs were encouraged by natural processes that in the pattern of connectivity
    between neurons is similar to the visual cortex of the animal. Many restricted
    region of the pictorial field known as the receptive field, different cortical
    neurons respond to incitements. Different neurons'' receptive fields partially
    overlap to encapsulate the whole field of vision.


    Comparison with the other algorithms for, CNNs use very little pre-processing.
    This ensures that the network knows about the filters in conventional algorithms
    that were hand-crafted. An important advantage in feature development is this
    freedom from previous knowledge and human effort.


    # Multi-Layered CNN


    For better and efficient accuracy, we have added two layers of max pooling to
    our CNN model Pooling-Max pooling is an efficient baseline discretization process
    with the sampling of an input (output matrix, image, hidden-layer etc.), decreasing
    its dimensionality and allowing convolutions to be created features in binned
    sub-regions. This is done by providing the representation with an abstract form
    to help fit. It also minimizes the cost of computing by reducing the number of
    parameters to be learned and provides basic invariance of the internal representation
    (Goel et al., 2020b). Dropout-Dropout is a Google patented regularization technique
    to reduce over fitting in neural networks by preventing complex co-adaptations
    to training data. It is a very efficient way to use neural networks to perform
    model average. The term "dropout" refers to the removal of units in a neural network
    (both hidden and visible) (Soni et al., 2019).'
