- pgno: 69
  md: '# Deep Learning Using Keras


    **Loss**: Loss function helps in evaluating how well our model is performing on
    the given data by analyzing the actual label and predicted label through back
    propagation. There are two category of loss function based on regression and classification
    problem. Since we are focusing on classification problem in our example, we will
    use Categorical_centropy as the loss function.


    It a popular classification loss function, which is used for multi-class classification
    where the number of output nodes is equals to the number of classes.


    **Optimizer**: An optimizer helps in decreasing the error in the loss function.
    It minimizes the objective (or loss) function by tuning the hyperparameters as
    weights, biases, learning rate etc in a neural network to produce slightly improved
    and faster results. These parameters are modified by optimizers, which updates
    the model parameters based on the loss function during each iteration of backpropagation.
    Gradient Descent, Stochastic gradient Descent, RMSprop, Adagrad are examples of
    popular optimizers available in keras.


    **Metrics**: The neural network evaluates the training, validation and test data
    on the list of metrics supplied by this parameter.


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_69_0.png)


    ```

    import keras

    # opt_rms = keras.optimizers.rmsprop(lr=0.001,decay=1e-6)

    model.compile(loss=''categorical_crossentropy'', optimizer=''adam'', metrics=[''accuracy''])

    ```


    # Step 7. Callbacks


    A set of functions applied during training a neural network in order to view the
    internal states and statistics of the model is known as callbacks. A list of parameters
    can be passes to the fit() method of the sequential or Model classes to initiate
    this functionality.


    **ModelCheckpoint**: It is used to save the model during training we save the
    weights of the best model (i.e. the model with minimum loss) by setting val_best_only
    to True.


    **EarlyStopping**: It stops training when the monitored quantity has stopped improving
    for a ''patience'' number of epochs.

    reduce lr: It reduces the learning rate when a metric stops improving during the
    training. Models often benefit from reducing the learning rate by a factor of
    2-10 once learning stages. It reduces the learning rate when the monitored quantity
    has stopped improving for a ''patience'' number of epochs by a quantity as ''factor'',
    where a new learning is given by the formula new_lr = lr * factor


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_69_1.png)


    ```

    import os

    save_dir = os.path.join(os.getcwd(), ''saved_models'')

    model_name = ''keras_if8_trained_model.h5''

    from keras.callbacks import ModelCheckpoint, ReduceLROnPlateau, TensorBoard, EarlyStopping

    checkpoints = [ModelCheckpoint(filepath=save_dir+''/''+model_name, monitor=''val_loss'',
    verbose=0, val_best_only=True),

    EarlyStopping(monitor=''val_loss'', patience=5, verbose=0)

    reduce_lr = ReduceLROnPlateau(monitor=''val_loss'', factor=0.2, patience=5, min_lr=0.001)

    ```'
