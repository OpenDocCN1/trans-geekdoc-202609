- pgno: 68
  md: '# Deep Learning with Keras


    Figure 17. Typical architecture of CNN (Pokharna, 2016)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_68_0.png)


    Figure 18.


    ```

    #importing the necessary libraries

    from keras.models import Sequential

    from keras.layers import Conv2D, Activation, BatchNormalization, MaxPooling2D,
    Dropout, Flatten

    from keras.regularizers import regularizers


    weight_decay = 1e-4

    model = Sequential()

    model.add(Conv2D(32,(3,3), padding=''same'', kernel_regularizer=regularizers.l2(weight_decay))

    model.add(Activation(''relu''))

    model.add(BatchNormalization())

    model.add(Conv2D(32,(3,3), padding=''same'', kernel_regularizer=regularizers.l2(weight_decay))

    model.add(Activation(''relu''))

    model.add(BatchNormalization())

    model.add(MaxPooling2D(pool_size=(2,2)))

    model.add(Dropout(0.25))


    model.add(Conv2D(64,(3,3), padding=''same'', kernel_regularizer=regularizers.l2(weight_decay))

    model.add(Activation(''relu''))

    model.add(BatchNormalization())

    model.add(MaxPooling2D(pool_size=(2,2)))

    model.add(Dropout(0.25))


    model.add(Conv2D(128,(3,3), padding=''same'', kernel_regularizer=regularizers.l2(weight_decay))

    model.add(Activation(''relu''))

    model.add(BatchNormalization())

    model.add(Conv2D(128,(3,3), padding=''same'', kernel_regularizer=regularizers.l2(weight_decay))

    model.add(Activation(''relu''))

    model.add(BatchNormalization())

    model.add(MaxPooling2D(pool_size=(2,2)))

    model.add(Dropout(0.5))

    model.add(Flatten())

    model.add(Dense(128))

    model.add(Dense(num_classes, activation=''softmax''))

    ```


    # Step 6. Compilation


    Compilation is performed before training the model. We use model.compile() method
    to initiate the training process in sequential approach by configuring the learning
    process. It receives three arguments-'
