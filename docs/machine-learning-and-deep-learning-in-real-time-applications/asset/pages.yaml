    Table 1. Classification Accuracies for Acoustic Environment Identification


    | Sr.No. | Classifier/Features | Accuracy (%) | | |

    | --- | --- | --- | --- |

    | | | MFCC | RT | MFCC+RT |

    | 1 | Linear SVM | 81.2% | 84.8% | 89.3% |

    | 2 | Quadratic SVM | 86.3% | 88.2% | 92.4% |

    | 3 | Cubic SVM | 84.7% | 88.2% | 90.8% |

    | 4 | Random Forest | 89.4% | 92.6% | 97.1% |

    | 5 | ANN | 90.4% | 94.5% | 97.3% |


    It can be seen that ANN outperforms SVM giving an accuracy of 97.3% when MFCC
    and RT features are used in combination. It can also be seen that Quadratic SVM
    performs better than Linear and Cubic SVM. The table also depicts the weightage
    of the feature sets. If MFCC features are used in isolation, the accuracy is less
    than RT features alone. The addition of RT features increases the accuracy in
    each of the classifiers.


    For Tampering detection, CNN and RNN have been employed to detect whether an audio
    is original or tampered. As discussed, CNN can be used for a classification that
    classifies the data directly without the need of giving features separately in
    the case of other machine learning algorithms. The CNN architecture employed two
    convolutional layers, two batch normalization layers, two ReLU, max pooling layer
    and softmax layer for classification. The MFCCs are given as features to the RNN
    architecture. Table II shows the classification accuracies for insertion and deletion
    typegeries using CNN and RNN.


