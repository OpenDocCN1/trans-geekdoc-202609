    # Max Pooling and Average Pooling Layers


    A max-pooling layer operates down-sampling by splitting the input into specific
    rectangular pooling zones and computing the maximized of each zone. An average
    pooling layer operates down-sampling by dividing the input into rectangular pooling
    regions and computing the average values of each area. Figure 16 shows a comparison
    between max-pooling vs. Average pooling. Figure 17 shows the various step involving
    to build a model using max-pooling through Keras.


    Figure 16. Max pooling vs Average pooling


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_270_0.png)


    from keras import layers, models

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1))

    model.add(layers.MaxPooling2D(2, 2))

    model.add(layers.Conv2D(64, (5, 5), activation=''relu''))

    model.add(layers.MaxPooling2D(2, 2))

    model.summary()


