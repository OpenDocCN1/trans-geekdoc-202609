- pgno: 227
  md: '# SOLUTIONS AND RECOMMENDATIONS


    Hybrid DL model give better performance than the advanced ML models. In such cases,
    it is always interesting to investigate the combinatorial models to find out the
    classification experience. The performance of the Combinatory models may be improved
    by optimizing the learning of the model.


    After evaluating the performance of the Hybrid model including Deep Learning,
    an optimized hybrid model is implemented using Cuckoo search optimization method.
    The optimization is achieved in a better way when Cuckoo Search with Levy Flight
    is used.


    # Algorithms


    The Optimized model - LCDBN


    The input educational data is first given to the PCA for dimensionality reduction.
    The important features are fed to the SVM for further generalized prediction.
    These predictions which are not accurate are fed to the DBN for final classification
    and prediction. Here there is a change in training the DBN model. The RBM units
    in DBN are trained with Cuckoo Search with Levy Flight. The training of DBN is
    improved using the CS with Levy Flight so the model - LCDBN.


    Algorithm 2 predicts the error of the proposed LCDBN model. Here the RBM is trained
    using the Flights of Cuckoo Search. Using the simple random walk in Cuckoo Search,
    Levy Flights are used to further improve the Cuckoo Search Algorithm. In traditional
    CS, the random walk was taken using Gaussian Processes.


    A Levy Flight can be thought of as a random walk where the step size has a Levytailed
    distribution. The weight of the DBN model has been updated as in Eq. (16). Here,
    the search of CSA is included in the RBM weight matrix update. From Eq. (16),
    $W^{old}$ refers to $Y_i$ of CSA, detects the error and indicates the scaling
    factor.


    ```

    $W \leftarrow W^{old} + \varepsilon^*[Er*\alpha](s_i,s_j=1|x_i,x_j)] + (W^{old}
    * t^{-\lambda}) \quad (16)$

    ```


    # System Model


    Figure 13 shows the optimized hybrid model.


    The input parameters are split and fed to PCA to reduce parameters. The output
    from each PCA is given to the individual SVM for prediction of class. The class
    labels are predicted by the SVM; acts as the input to the DBN. Using input and
    actual class labels, the DBN predicts the classes for the data.


    The DBN is constructed with 2 layers of RBM. One RBM represents a hidden layer
    and a visible layer. The RBM layers are constructed with 3 neurons each and the
    activation function used is a sigmoid function. The numbers of input neurons are
    3. After RBM an MLP is added for prediction of class. The MLP has 3 neurons and
    logistic regression is used as an activation function. The output layer has one
    neuron to predict the class label. Here learning of DBN is optimized using Cuckoo
    Search with Levy Flight.'
  merge: -1
  img_proc: true
