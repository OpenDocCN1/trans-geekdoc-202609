    # Step 8. Training


    The two forms of training exists in keras are:


    # Standard Training With no Augmentation


    It uses Keras fit method for training a model. It does not work with batches of
    data a_dirnd the functionality for data augmentation is not provided by this function.
    This function is used when the datasets are not very challenging and thus not
    require any data augmentation.


    # Training with Augmented Data


    It uses Keras generator method for training a model. It is used when the size
    of dataset is large and it is too big to fit into the memory when taken as a whole.
    It provides functionality for data augmentation thus solving the problem of overfitting.


    # Initiate the Train and Test Generators With Data Augmentation


    Data augmentation is a technique utilized to artificially create modified version
    of the training data by shifting, flip, rotation, brightness, zoom functions etc.
    Keras provides this capability via the ImageDataDataGenerator class with the intention
    to improve the accuracy of the model and reduce overfitting. However, we do not
    apply any random transformation in validation and test set because they are used
    to evaluate the model.


    We can use fit or fit_generator method by setting data_augmentation equals to
    ‘True’ for training the model in our code. However, we would be using both fit
    and fit_generator to understand the real-world dataset problems.


