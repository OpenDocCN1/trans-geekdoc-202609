  md: "# Malaria Detection System Using Convolutional Neural Network Algorithm\n\n\
    ology required a great economic effort which was indeed very difficult to maintain.\
    \ Rapid diagnostic tests methodology was also used for the detection of malaria\
    \ parasites in the red blood cells. This test was comparatively easy to perform\
    \ as in this methodology skills and special equipment were not required. These\
    \ tests take less time to compare with the others but not generate results with\
    \ higher accuracy values.\n\nTo get the results with higher accuracy and low costs,\
    \ staining methods were used for the detection of parasites. The drawback of using\
    \ this method was that it is time-consuming and requires manual labor. The presence\
    \ of dirt, bacteria, precipitation, etc. could not be examined by using this methodology,\
    \ hence it produces false results in many cases.\n\n# Requirement Analysis\n\n\
    The problem with the existing system for detecting malaria and manual diagnosis\
    \ needs to be rectified hence the idea of designing an automated system. There\
    \ was a greater need to design a system that could generate better results with\
    \ higher accuracies and which are also cost-effective. The automation system for\
    \ detecting malaria parasites in the red blood cells becomes a major requirement\
    \ for resource-scarce areas. Designing of the automation system does not require\
    \ manual labor and is not time-consuming as well.\n\nAutomation system enables\
    \ a machine to work with greater efficiency to generate higher accuracy with minimum\
    \ or zero chances of any error being generated.\n\n# SOLUTIONS AND RECOMMENDATIONS\n\
    \nConsidering the failures in the results obtained from the already existing outdated\
    \ system, it becomes a major requirement to design a system that operates on modern\
    \ deep learning methodologies to find better and more accurate results.\n\nThe\
    \ automated system should be designed to study the image given as input and generate\
    \ the corresponding results. The working of the automated systems should take\
    \ place step by step and systematically. The working of the system begins by taking\
