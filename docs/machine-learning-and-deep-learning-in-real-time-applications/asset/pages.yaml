    # DEEP LEARNING


    Deep learning is a subset of machine learning in Artificial Intelligence (AI)
    that has networks capable of learning in a supervised, unsupervised or semi-supervised
    manner given in Figure 1. It is also known as deep structured learning and hierarchical
    learning (Jason). The core component of deep learning is a neural network. Most
    of the deep learning models are predicated on Artificial Neural Networks. Convolutional
    neural networks consist of a single input layer, a single hidden layer, and one
    output layer. Deep learning networks are different from these convolutional neural
    networks comprise more hidden layers as given in Figure 2. They consist of more
    depths, that is the reason to known deep networks. These kinds of networks are
    proficient in exploring hidden structures from unlabeled and unstructured data.


