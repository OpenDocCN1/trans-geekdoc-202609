    # Results and Discussions


    The results on the test dataset obtained after training the base deep learning
    models (i. U-Net and ResU-Net) are discussed in this section. Semantic segmentation
    of Devanagari document images using the second method of transfer learning (i.e.,
    fine-tuning) is performed and discussed. Fine-tuning of the whole model is required
    for the dataset as the model is different from the Devanagari dataset. Fine-tuning
    the models, which is a model of transfer learning, takes less time than learning
    the network from scratch. U-Net and ResU-Net are trained using the training dataset
    and tested on images other than the training dataset. The result shown in the
    chart is on the test dataset. Training any deep learning model requires a lot
    of time, while testing is completed in a very short amount of time. The encoder
    of the model learns the features and parameters of the network, locates the features
    learned by the encoder to generate the output as required. The lower layer of
    the encoder learns the low-level features like edge detection. As we go deeper
    into the network, the layers learn the high-level features like localization,
