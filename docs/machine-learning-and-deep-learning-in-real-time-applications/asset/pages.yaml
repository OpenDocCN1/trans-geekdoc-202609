  md: '# Deep Learning With PyTorch


    SGD and mini-batch gradient descent approach have solved memory overflow and slow
    step update problem But a new problem arises in these optimization algorithms.
    The parameters, rather than reaching closer to local minima with every step of
    optimization, oscillates. Some batch rather than reducing loss increase, and others
    may reduce loss. The result is, parameters converging to local minima in a zig-zag
    motion. This leads to slow training.


    Figure 8. Contour graph showing how parameters converge to local minima in SGD.
    ''+'' is the local minima


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_95_0.png)


    To solve this problem of parameter converging to local minima in an inefficient
    zig-zag manner, there are several optimization algorithms. These algorithms make
    the parameter convergence smoother. The next subsections discuss some of the important
    ones.


    # Momentum


    In this approach, oscillations in wrong directions are smoothed and make the parameters
    converge in the right direction by using past gradients. In figure 8, there are
    only two directions (for the sake of simplicity), this can be thought of like
    a car moving in a zig-zag motion to its destination. Momentum approach reduces
    the velocity in the y-direction and increases in the x-direction, so that the
    motion becomes more smooth and the destination is reached.


    ```

    V = \beta V + (1 - \beta)dW.

    ```


    ```

    W = W - \alphaV.

    ```


    $\beta$ is also a hyperparameter. Generally, the value of $\beta$ is 0.9 In PyTorch.


    Table 5. defining an Optimizer in PyTorch


    | Optimizer=torch.optim.SGD(model.parameters(),lr=0.01, momentum=0.9) |


