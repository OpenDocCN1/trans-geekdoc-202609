    # Deep Learning Approach


    Deep learning is an end-to-end system that does not require pre-processing or
    prior knowledge of the input. For segmenting images, deep learning uses semantic
    segmentation and instance segmentation. Semantic segmentation labels each pixel
    of the input image with a respective class label while instance segmentation assigns
    boundaries to the detected object by semantic segmentation. This section explains
    the text segmentation using semantic segmentation. Deep learning methods have
    stateof-the-art results on various applications like image classification, image
    captioning, speech analysis, which are described by B. Zhou et al., (2014) and
    S. Renet et al., (2017). Krizhevsky et al. (2012) explain reasons for better performance
    of deep learning. The presence of an activation layer helps to resolve multiple
    problems; regularization and different optimization techniques used in training
    a deep architecture help to avoid overfitting. Most of deep learning models are
    affected by the vanishing gradient problem due to the intense deep architecture.
    To avoid this, He et al., (2016) introduced a deep residual network that added
    identity mapping. Deep learning provides different models for semantic segmentation.
    Shelhamer, E., Long, and J. Darrell (2016) proposed Fully Convolutional Neural
    Network (FCN), which has a better result on various segmentation tasks. FCN is
    the basic model for image segmentation.


    A deep learning model used for classification consists of an encoding part and
    maps the outputs of the classification model to class probabilities. The architecture
    consists of a series of repeated convolution and max-pooling (or average pooling)
    followed by the fully connected layer and the output layer. When input traverses
    the path, the feature maps of the model increase with a increase in the number
    of dimensions. The number of parameters of the model increases as the number of
    images increases. The decoding part has an upsampling layer followed by a deconvolution
    layer and finally the segmented output. In the segmentation model both are deep
    when compared to a classification model. Ronberger et al. (2015) proposed U-Net
    (a deep learning-based segmentation model) mainly designed for medical image segmentation.
    This U-Net architecture improves the accuracy of the output by concatenating feature
    maps from various levels. This concatenation reduces the vanishing gradient problem
    as it treats features from a higher level. SegNet, proposed by Badinararayanan
    (2015) another variant of FCN, is also used for semantic-based segmentation. There
    are different variants of FCN, depending upon the various applications of image
    segmentation. ResU-Net, proposed by Zhengxin et al., (2017), was designed to extract
    the roads from remote sensing images. U-Net architecture and residual learning
    improve the design of Res-Net. It has residual connections, and the architecture
    resembles the architecture of U-Net. Stewart, S., & Barrett, B. (2017) applied
    the idea of a convolutional neural network (CNN) in document processing to English
    text. A fully supervised CNN is used to separate the content of document images.
    The network designed by Stewart, S., & Barrett, B. (2017) consists of downsampling
    and upsampling layers, which are used for document segmentation, segmenting the
    text, figures, and tables in the input image.'
