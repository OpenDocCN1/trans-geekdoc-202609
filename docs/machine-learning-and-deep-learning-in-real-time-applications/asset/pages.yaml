    weight is given to those inputs that contribute the most towards the next node.
    Figure 15 shows the general architecture of an Artificial Neural Network.

    The components of an ANN are:


    +   a. **Input nodes/ Input Layer:** The inputs are applied to these blocks of
    nodes called the input layer.

    This layer only passes information to the next layer. No computation is done.

    b. **Hidden nodes/ Hidden Layer:** These sets of nodes form the intermediate layer
    where processing is done. A neural network may contain one or more hidden layers.
    The hidden layers perform computations and pass on the weights/information from
    input layer to the next hidden layer or to the output layer.

    c. **Output Nodes/ Output Layer:** The output node uses what is called the activation
    function to map the desired output format. The information learned from the previous
    layers is transferred to the outer world by the output layer.

    d. **Weights:** For each connection of neuron i to neuron j, a weight w is assigned.
    The data received by the neurons is multiplied by the value of the weight and
    result is passed on to the next layer.

    e. **Activation Function:** The output of a node is defined by the activation
    function of that node. The activation function decides whether a neuron has to
    activated or not. It introduces non-linearity to the output of the neuron and
    decides whether a neuron should be activated or not.


