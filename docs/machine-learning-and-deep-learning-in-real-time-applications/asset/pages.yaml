    We use tf.placeholder() command to define a placeholder. Final values of placeholder
    objects will always be assigned using feed_dict (feed dictionary).


    **Example:** Addition of two placeholders (figure 12)

    **Variable:** It allows us to add trainable parameters to a computational graph.
    We use tf.Variable() command to define a variable. In this type of data, any value
    is assigned initially, but during the program, the values are changed as per the
    requirements. Whenever we are assigning the value to the TensorFlow variable,
