  md: '# Transfer Learning (Pan et al., 2009)


    In the real world, it is not always possible to train a model for image analysis
    from scratch due to a lack of data. A good classifier requires a dataset in the
    order of 10s of millions. Such large datasets are not easily available for every
    task. So to train an image classifier? The answer is transfer learning.


    How do pre-trained models produce good results? It was shown in the paper “Visualizing
    and understanding convolutional networks” (Zeiler et al., 2014), the early layers
    in CNN models start identifying some fundamental patterns that are common in all
    types of objects. The first layer identifies lines and edges at various angles.
    The second layer identifies some basic shapes like circles, gradients, and slightly
    complicated features. By the third layer, it starts identifying patterns of specific
    objects like tires, people, etc. This pattern recognition becomes more sophisticated
    and starts identifying objects of interest as the layers progress.


    As lines and basic shapes are common to every object, one can use the early layers
    of a pre-trained model and train the further layers to our requirements using
    the small dataset.


