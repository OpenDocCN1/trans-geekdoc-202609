    # BACKGROUND


    # Deep Learning


    Hinton and colleagues suggested the concept of Deep Learning in the year 2006.
    Deep Learning (DL) is capable of learning from small data sets. The learning is
    through a nonlinear network structure. The Deep Learning is made up of the network
    structure with normally more than 4 hidden layers with one input and one output
    layer. Such a network can transform the raw features of images into superior features
    thereby making classification and prediction better Bengio, 2009) (Najafadi, et
    al., 2015).


    DL differs from ML in many ways. In terms of accuracy of algorithms, DL performs
    better than normal ML. When data increases, DL learns from such ever-increasing
    data thereby increasing accuracy. In contrast, ML algorithms are restricted by
    the representation of data which hampers the response time and accuracy of the
    system using such algorithms. Consider an example of email spam filtering. To
    identify if an email is a spam or not, the ML algorithm is given various representations
    of a good and bad email. Using incoming emails are categorized as good or bad.
    ML algorithm without any representations will not be able to decide on anything.


    Here, DL comes to the rescue. Identification of important features and learning
    from them is easily performed by DL. DL algorithms can identify features from
    the raw data and create representations for learning. DL has numerous algorithms
    of ML. These algorithms attempt to model high-level abstractions in data. They
    create or design architectures which are composed of many non-linear transformations.'
