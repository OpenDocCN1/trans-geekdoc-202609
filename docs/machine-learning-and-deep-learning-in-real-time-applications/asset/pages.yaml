- pgno: 12
  md: 'Malaria is a disease caused when a female Anopheles mosquito bites. There are
    over 200 million cases recorded per year with more than 400,000 deaths. Current
    methods of diagnosis are effective; however, they work on technologies that do
    not produce higher accuracy results. Hence, to improve the prediction rate of
    disease, modern technologies need to be performed for obtain accurate results.
    Deep learning algorithms are developed to detect, learn, and determine the containing
    parasites from the red blood smears. This chapter shows the implementation of
    a deep learning algorithm to identify the malaria parasites with higher accuracy.


    # Chapter 11


    An Introduction to Deep Convolutional Neural Networks With Keras ............................................................
    231


    Wazir Mahmud, Department of Electrical Engineering, BUET, Khuzdar, Pakistan

    Irfan Ullah, Department University, Chulalongkorn University, Bangkok, Thailand

    Mohammad Ashfaq, School of Life Sciences, S. Abdur Rahman Crescent Institute of
    Science and Technology, Chennai, India


    Deep learning (DL) is the new buzzword for researchers in the research area of
    computer vision that unlocked the doors to solving complex problems. With the
    assistance of Keras library, machine learning (ML)-based deep and complicated
    or unresolved issues such as face recognition and voice recognition might be resolved.
    This chapter focuses on the basic concept of Keras-based framework DL library
    to handle the different real-life problems. The authors discuss the code of previous
    libraries and code run on Keras library and assess the performance on Google Cloud
    Graphics Processing Units (GPUs). The goal of this chapter is to provide you with
    the newer concept, algorithm, and technology to solve the real-life problems with
    the help of Keras framework. Moreover, we discuss how to write the code of standard
    convolutional neural network (CNN) architectures using Keras libraries. Finally,
    the code of validation and training data set to start the training procedure are
    explored.


    # Chapter 12


    Emotion Recognition With Facial Expression Using Machine Learning for Social Network
    and ............................................................ 273


    An Yadav, Manipal University Jaipur, India

    Venkatesh Gauri Shankar, Manipal University Jaipur, India

    Vivek Verma, Manipal University Jaipur, India


    In this chapter, machine learning application on facial expression recognition
    (FER) is studied for seven emotional states (disgust, joy, surprise, anger, sadness,
    contempt, and fear) based on FER describing coefficient. FER has high importance
    in various social network, robotics, healthcare, etc. A literature review of existing
    machine learning approaches for FER is discussed, and a novel approach for FER
    is given for static and dynamic images. The results are compared with the other
    existing approaches. The chapter also covers related issues of applications, identify
    challenges, and opportunities in future FER. For security-based face detection
    systems that can identify an individual, in any form of expression he introduces
    himself. Doctors will use this system to find the intensity of illness or pain
    of a deaf or dumb patient. The proposed model is based on machine learning application
    with three types of prototypes, which are pre-trained model, single layer augmented
    model, and multi-layered augmented model, having a combined accuracy of approach.
    99%.'
  merge: -1
