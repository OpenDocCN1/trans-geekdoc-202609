  md: '# Deep Learning With PyTorch


    Figure 3. Gradient Descent (gradient descent)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_90_0.png)


    There is a local minima for which a value of weight minimizes the loss. This is
    achieved by taking a derivative of a loss with respect to weight, $\frac{\partial
    loss}{\partial w}$ — This is the slope of the curve in fig 3. By taking small
    steps along the slope the weight reaches an optimum local minima which reduces
    the loss.


    $w_{new} = w_{old} - \frac{\alpha * class}{\hat w}$


    Here, $\alpha$ is the learning rate, which is the size of one step to be taken
    going down the slope. $\alpha$ is a hyperparameter - a parameter that is determined
    by the trial and error process. If $\alpha$ is too small, the training time increases,
    as reaching the minima takes a lot of steps. On the other hand, too large learning
    rates result in overshooting and optimum value is never achieved.


    Figure 4. Forward and Backward propagation expanded view graph (CS224n)


