    # ABSTRACT


    The field of audio forensics has seen a huge advancement in recent years with
    an increasing number of techniques used for the analysis of the audio recordings
    submitted as evidence in legal investigations. Audio forensics involves authentication
    of the evidentiary audio recordings, which is an important procedure to verify
    the integrity of audio recordings. This chapter focuses two audio authentication
    procedures, namely acoustic environment identification and tampering detection.
    The authors provide a framework for the aforementioned procedures discussing the
    methodology and feature sets used in the two tasks. The main objective of this
    chapter is to introduce the readers to different machine learning algorithms that
    can be used for environment identification and forgery detection. The authors
    also provide some promising results that prove the utility of machine learning
    algorithms in this interesting field.


    # INTRODUCTION


    Authentication of digital audio recordings is a complex process which determines
    whether the audio recording submitted as evidence is free from any tampering attacks.
    The digital era has made manipulation of digital media very easy with the availability
    of free, easy-to-use tools that can be used to make changes in the original file
    without any visible traces. This presents serious challenges for forensic experts
    to verify the integrity of the submitted audio recordings. To date, there is no
    ''cookbook'' of steps that is involved in determining the authenticity of audio
    recordings. Therefore, there is a need for a standard


