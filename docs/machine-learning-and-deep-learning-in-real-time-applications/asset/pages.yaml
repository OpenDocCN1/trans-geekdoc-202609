    # BIOLOGICAL VALIDATION OF BICUSTERS


    Biological validation can qualitatively evaluate the extraction of an algorithm
    to extract meaningful bicusters from a biological point of viewTang et al. (2002);
    Yang et al. (2011). If the discovered bicusters contain significant proportion
    of biologically similar genes, it proves that the clustering method produces biologically
    relevant results. The biological significance can be verified using Gene Ontology
    (GO) database. The enriched annotation terms associated with the gene list will
    give insight that investigators to understand the biological themes beyond the
    gene list. The GO project has developed three structured ontologies that describe
    gene products in their associated biological processes, cellular components and
    molecular functions in species- independent manner. The degree of enrichment is
    measured by p-values which use a cumulative hyper metric distribution to compute
    the probability of observing the number of genes from a particular GO category
    (function, process and component) within each bicuster. A bicuster is said to
    be over represented in a functional category if the p-value is below a certain
    threshold. The probability $p$ for finding at least $k$ genes from a particular
    category within a cluster of size $m$ is given in Equation (6.1).


    ```

    $p = 1 - \sum_{r=0}^{k-1} \binom{\begin{matrix} M-G \ m-r \end{matrix}}{r} (1)

    ```


    Where $G$ is the total number of genes within a category and $M$ is the total
    number of genes within the genome. The p-value is the probability that the genes
    are selected into the cluster by random. When the p-value is very small, it means
    that the majority of genes in a cluster appears in one category. The annotations
    of genes for three ontologies including biological process, cellular component
    and molecular function are obtained.


