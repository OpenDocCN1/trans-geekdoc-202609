- pgno: 67
  md: '# Step 5. Building a Sequential Model From Scratch


    The convolution layer comprises of a set of independent filters where each filter
    allows us to find pattern or features in the image (Figure 17). A random weight
    is assigned to all filters initially which will be subsequently learned during
    backpropagation. 32 filters (size 3*3*3) are convolved over the input image (size
    32*32*3) independently in the first convolution layer resulting in feature map
    of 30*30*32 dimension using the formula (n-f+1, n-f+1) where n is input size and
    f is the filter size. However, the image can shrink down to 1 by 1 if we continue
    this process for a few more layers. In addition, pixel values on every corner
    of the image is used only by these filters while it are overlapped many in the
    middle. To overcome these problems of shrinking output and data loss from the
    edges, we have used “padding” in our example. Padding helps us adding border around
    the image. These convolution layers are added sequentially in the layers followed
    by activation, max pool and dropout layers.


    # Activation Layer


    We not use linear activation/identity function for the activation map (output
    of convolution layer) as the images are highly non-linear in nature and using
    non-linear activation function as ReLu is valuable after a linear convolution
    operation.


    # Maxpool Layer


    Pooling layers operate on each feature map (output of convolution layer) independently
    in the network. It helps in gradually reducing the number of parameters and computational
    power of the network. A filter size of 2*2 and stride of 2*2 is used to reduce
    network parameters in this example.


    # Batch Normalization and Dropout Layer


    Batch normalization is used for improving the speed, performance, and stability
    of neural networks while dropout prevents the network from overfitting. Dropout
    randomly turn off some of the nodes in the layers of the network by setting some
    probability of eliminating a node in the neural network. We are eliminating 25%,
    25% and 50% of the nodes in layer 1, layer 2 and layer 3 respectively.


    # Fully Connected Layer-


    The entire network in CNN is divided into two parts: feature extraction and classification.
    The convolution layers are accountable for extracting meaningful features from
    the images while fully connected layers serve the purpose of predicting the class
    probability.


    A baseline model using CNN is used to create network architecture for our task
    described below:'
