    layers are used with the rel activation function on which the dataset is generated
    and finally converted into a model. The dense() function is used to define the
    number of neurons in the input layer as 2. Dropout fusion is used with a value
    0.2 in 20% of which images are discarded may be redundant or not useful for the
    model. Finally, the model is evaluated and generated with accuracy as 1, i.e.,
