    more than 14 years of experience in Academic Administration, Teaching and Research
    experience in India, Europe, and Africa. The editor has worked on various academic
    positions such as Lecturer, Sr. Lecturer, Asst. Professor, Associate Professor,
    Head IT, Head Academics, Founder, IEEE Liberia, IEEE Ghana & Professional Activity
