    # LITERATURE SUMMARY


    In (George, Zayed, Roushy, & Elbagoury, 2014) implemented an intelligent remote
    detection and diagnosis system for diagnosing BC based on cytological images.
    This approach has considered 12 features for the process of classification of
    tumour adequately. The dataset which was used in this approach has 92 cytological
    images consisting of 11502 nuclei. By using the backpropagation algorithm, support
    vector machines, probability neural network and learning vectorization in the
    multilayer perceptron have been used. The performance metrics for evaluation are
    rate, sensitivity rate, rate, and specificity. This system performs pre-processing
    of data, cell nuclei detection, false finding elimination, cell nuclei segmentation,
    feature extraction and classification. The model results have stated that by using
    the Probability neural network and support vector machine, the model achieves
    reasonable specificity with 94.57 and 90.99. As specified, this approach can be
    improved by applying the hybrid clustering algorithms.


    For the classification of H&E stained biopsy images, the approach (Aratoato, T
    et al., 2017) utilizes CNN. A lesion in situ, carcinoma, normal tissue and invasive
    carcinoma are four classes for the least breast biopsy images which many of two
