    # Build an OR Gate Model Using Keras


    6. shows the OR gate diagram. The OR gate is a digital logic gate, which implements
    logical disconnection and performs according to the fact to the right. HIGH output
    (1) results if one or both the inputs to the gate are HIGH (1). If neither input
    is high, a LOW output (0) results. In another aspect, the function of OR effectively
    finds the maximum between two binary digits as complementary AND function finds
    minimum (Bloomfield, 2001). Figure 7 OR gate model design through Keras API, OR
    gate network with 2 input and 1 output.


