  md: '# Machine Learning in Authentication of Digital Audio Recordings


    Despite extensive research in the area of audio authentication, very few papers
    have actually discussed and illustrated the application of machine learning algorithms
    for the purpose of authentication. There has been a large proliferation of machine
    learning methodologies in image processing as compared to audio. Moreover, there
    is a need to make use of artifacts embedded in recordings which will provide clues
    of tampering detection and also aid in the identification of the acoustic environment.
    This chapter focuses a framework for the above audio authentication procedures.
    The next sections discuss the framework for environment identification and tampering
    detection which will provide insights on database creation and feature extraction.
    Following this, different machine learning methodologies for audio authentication
    are explained with some important results and conclusions in the last section.


    # FRAMEWORK FOR ACOUSTIC ENVIRONMENT IDENTIFICATION


    The first task considered under audio authentication is Acoustic Environment Identification.
    The environment in which the auditory audio was recorded is an important parameter
    for forensic investigations as forensic experts need to identify the environment
    of the crime scene for further investigations. The audio recording that submitted
    as evidence may provide clues regarding the environment in which was recorded.
    There may be certain artifacts present in the recording which can help experts
    to obtain information about the acoustic environment. For example, the audio recording
    may contain obvious sounds on the basis of which the forensic expert may come
    to the conclusion that the recording was made in a car. The Room Impulse Response
    (RIR) and the reverberation component are parameters that are embedded in the
    audio recording that provide information about the acoustic environment of the
    audio recording like geometry of the room, etc. This section first discusses the
    basics of RIR and reverberation followed by feature extraction and classification
    of environments using Machine Learning algorithms.


    # Room Impulse Response (RIR) and Reverberation


    Consider an enclosed room consisting of a source of sound and a microphone placed
    in some fixed location in the room. The sound recorded by the microphone consists
    of two components,


    +   (i) Direct sound component which is the sound that reaches directly from the
    source to the microphone and

    (ii) Wall Reflections which are the sound signals provides the direct sound component
    that reaches the microphone after hitting the walls of the room. This phenomenon
    has been depicted in Figure 2.


    The RIR is the transfer function which provides the properties of the environment
    in which audio is recorded. The components of the RIR are shown in Figure 3. It
    shows the direct sound component and the reflections from the surfaces of the
    room. These reflections make up the reverberant component of the RIR and give
    information about the room geometry. As the RIR and the reverberation component
    provide information about the acoustic environment, these are the parameters that
    will be extracted and used in acoustic environment classification. The following
    section provides details of extracting the RIR and reverberation followed by feature
    extraction.'
