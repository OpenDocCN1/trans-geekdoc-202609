    In this work, the comparative study was carried out between some models while
    using transfer learning and without using this technique, as is, training or not
    the networks from scratch in the classification of leukocytes.


    # Models Trained with Transfer Learning


    In the case of the training with transfer learning, the original top of the networks
    was excluded. That way it is possible to use the weights from previous training
    with Imagenet, that is, the knowledge of some characteristics of objects applicable
    to the identification of leukocytes. A small network with three layers was created
    (the new top), a dense layer with the ReLU activation, a dropout layer and an
    output layer with the softmax function. The code needed to program this network
    in Keras as follows:


    ```

    model = models.Sequential()

    model.add(layers.Dense(256, activation=''relu'', input_dim=7*7*512))

    model.add(layers.Dropout(0.5))

    model.add(layers.Dense(4, activation=''softmax''))

    ```


    The network weights related to the training features and were then to classify
    leukocytes in 4 categories. The initial training lasted 100 epochs, and a batch
    size of 16 examples was used. The average training time of the 8 NN (''resnet50'',
    ''vgg16'', ''vgg19'', ''inceptionV3'', ''xception'', ''densenet121'', ''densenet169'',
    ''densenet201'') for 100 epochs was 9 minutes and 59 seconds on the computational
    architecture achieved. The fastest, VGG19, completed the training in 5 minutes
    and 47 seconds, and the shortest, Xception, took 16 minutes and 57 seconds. The
    networks that achieved the best results with lower values with lower losses were
    the Xception, the Denseset201, the Densenet169, the Densenet121 and InceptionV3.
    The network that converged faster to (approximately) 0 was the Xception. The worst
    results were obtained by the VGG and ResNet50 networks.


    Although the networks were initially presented by their authors to operate with
    optimizers, in this work, all the used the SGD optimizer, for comparing purposes
    (with the consequent of penalizing the performance of some of networks used),
    with a learning rate of 1⁻⁵ and decay of 0.001.


    Figure 14 shows that the accuracy is closely related to loss, and the models that
    obtained the best accuracies were the same as that had obtained the losses with
    lower values. Thus, the Xception network was the one that converged to 1 (with
    overfitting), and the ResNet50 was the one that obtained the worst results with
    a training accuracy of about 40%. The poor ResNet results may be related to the
    SGD.


    The results for the validation process are close to the ones obtained during the
    training, with the losses being slightly lower (and the accuracies slightly higher)
    than training as expected. In the case of transfer learning, the ResNet50 would
    be expected to perform better, because it is one of the newer networks, with an
