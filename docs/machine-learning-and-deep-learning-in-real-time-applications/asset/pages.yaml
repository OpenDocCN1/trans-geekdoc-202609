    This section provides a brief introduction to the fundamentals of audio processing,
    the different formats of audio signals and the basics of an audio recording system.
    It also provides a discussion in the area of audio forensics and audio authentication.
    The practices followed by forensic experts in the examination and the analysis
    tools currently used are presented as well. Tampering detection and Environment
    identification are the two procedures involved in the task of audio authentication
    that are explained, followed by a discussion on machine learning algorithms that
    can be used in these tasks.


    # Structure and Format of an Audio Signal


    Digital audio is composed of a sequence of discrete samples taken from an analog
    audio signal. The sampling frequency and the bits per sample are important parameters
    related to an audio signal. A sampling frequency of 44.1 kHz and 16 bits per sample
    are common parameters that are used to obtain a sufficiently good audio signal.
    There are different audio formats available, which are employed depending upon
    the application. The uncompressed audio formats include PCM (Pulse Code Modulation),
    WAV (Waveform Audio file format) and AIFF (Audio Interchange File Format). MP3
    (MPEG-1 Audio Layer 3), AAC (Advanced Audio Coding) and WMA (Windows Media Audio)
    are lossy compressed audio files while FLAC (Free Lossless Coding) and ALAC (Apple
    Lossless Audio Codec) belong to a category of lossless compressed file formats.


    # Audio Recording Set Up


    The components of a digital audio recording setup are shown in Figure 1. It consists
    of a microphone, a preamplifier, an analog-digital converter and a digital recorder.
    The incoming sound is an analog signal which is converted into an electric signal
    by the microphone. There are different types of microphones available which can
    be chosen mainly depending upon the directional pattern (e.g. Omni-directional,
    cardioid and unidirectional). The output signal of a microphone is weak which
    is amplified by a preamplifier to a voltage of amplitude around 1.5V. The electrical
    signal to this point is an analog signal which is converted into a digital by
    the A/D converter. This signal may be stored or played. The recorder converts
    the electrical signal of the A/D converter into a physical form which can be stored
    or played back. If the signal has to be played back, the player such as a loudspeaker
    conveys the signal back into pressure waves.


    # Introduction to Audio Forensics and Audio Authentication


    The field of audio forensics involves investigation, analysis and evaluation of
    an audio recording that has to be presented as evidence in a court of law or in
    a legal investigation. An audio forensic expert is involved in applying scientific
    methods to recover, evaluate, enhance and authenticate an audio record submitted
    as evidence. According to the Scientific Working Group on Digital Evidence (SWGDE)
    definition, "an original recording is the first manifestation of sound in a recoverable
    stored format, it is a magnetic tape, digital device, voicemail file on a server,
    optical disk, or some other form". Digital audio authentication consists of container
    analysis and content analysis (Grigoras, Rappaport,'
