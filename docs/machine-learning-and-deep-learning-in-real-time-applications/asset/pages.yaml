    that recognize key components of images, for example diagonal lines. Unlike pixels
    image data, genes are not linked to their neighbors, and unlike audio data, they
    are not temporally linked. Instead they are linked by their transcription factors,
    their pathwaymembership, and other biological properties. To address this interpretation
    challenge, wedeveloped strategies that allow constructed features to be linked
    to clinical and molecularfeatures of the underlying samples


