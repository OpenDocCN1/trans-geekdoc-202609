    # Deep Diagnosis and Prognosis:


    Computerized instruments have relied on the assessment of micro sub-visual changes
    in the patterns of important structures in histopathological images, which are
    difficult to detect or detect in human eyes. It may lead to the early diagnosis
    and prognosis of the disease and facilitates the subsequent clinical management
    of patients (Schnitt, 2010).


    # Introduction to Deep Learning


    Deep Learning (DL) (also known as Deep Learning or Hierarchical Learning) is a
    sub-field of the Machine Learning (ML). Deep Belief Networks, Neural Networks,
    Repetitive Neural Networks, and Convolutional Neural Networks (CNN) are various
    models used in computer vision, speech recognition, natural language processing,
    social network filtering, machine translation, bioinformatics, and medical image
    analysis. DL is a classification of algorithms that use multiple layers to extract
    high-level properties from raw input. For example, in image processing, the lower
    layers can detect or notice the edges, while the higher layer can identify human-meaning
