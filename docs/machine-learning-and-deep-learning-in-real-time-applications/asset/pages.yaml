    based on these learnings. Machine Learning finds applications in almost all major
    areas like Healthcare, Social media, Transport, eCommerce, Financial services,
    Security, etc. Machine Learning tasks can be distinguished into supervised and
    unsupervised learning tasks. In a supervised learning method, the input and outputs
    are available and the machine learns based on the past experience. In an unsupervised
    learning task, it is necessary to find patterns in the data. The task of audio
    authentication that this chapter focuses on is considered to be a supervised learning
    task. Figure 11 shows the pipeline of a typical supervised machine learning task.


    Figure 11. Machine Learning Pipeline


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_177_0.png)


    Any machine learning task starts with the collection of data which can be divided
    into training data and testing data. The training data in a supervised machine
    learning task consists of the input and the corresponding output which is used
    to train the machine. The testing data contains only the inputs. Outputs are unknown
    which the machine has to predict. After the data collection, one needs to choose
    an appropriate machine learning model which is further trained for classification,
    prediction or decision making. Once the training phase is completed, the model
    is obtained using the testing data for the required output. Hyper-parameters are
    parameters which may not be learned from the data but are to be specified by the
    user. The tuning of hyper-parameters, i.e. finding an appropriate set of parameters,
    needs to be done for increasing the performance of the machine learning algorithm.
    There are numerous methods for tuning the hyper-parameters like gradient descent,
