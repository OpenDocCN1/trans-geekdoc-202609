    # INTRODUCTION


    Bioinformatics is a multidisciplinary subject, related to area as Computer Science,
    Mathematics, Biology, Statistics and Information Technology. Cancer is featured
    by an irregular, unmanageable growth that may destroy and cause the neighboring
    healthy body tissues. In the past, classification by medical practitioners and
    radiologists was based on clinical and morphological features and had limited
    diagnostic ability. Deals with different kinds of biological data. The dimension
    and complexity of raw gene expression creates challenges data analysis and data
    management problems. The fundamental goal of microarray gene expression data analysis
    is to find the behavioural patterns of genes.


    Computational molecular biology deals with kinds of biological data. Gene expression
    is one among them. Hence Gene expression data is the basic data used in this paper.
    Gene expression is the process by which the information in a gene is changed into
    an observable phenotype (protein). It is the degree of which a gene is active
    in certain tissues of the body, measured by the amount of Messenger Ribonucleic
    Acid (mRNA) in the tissue. Individual genes can be switched on (apply their effects)
    or switched off according to the needs and situations of the cell at a particular
    instance. Thus, abnormalities or deviations of gene expression may result in the
    death of cells, or their uncontrolled growth, such as (Subramanian 2010).


    The gene expression matrix is a processed data obtained after the normalization.
    Each row in the matrix corresponds to a particular gene and each column could
    correspond to an experimental condition or a specific time point at which the
    expression of the genes has been measured (Tiвари et al. 2012). The expression
    level for a gene across different experimental conditions is cumulatively called
    the gene expression profile, and the expression profile of each level under an
    experimental condition is conditionally called the sample expression profile (Androlakis
    et al. 2007). An expression profile of an experimental condition or a gene is
    thought of as a vector and can be represented as a vector in a n dimensional space
    where $n$ is the number of conditions, and an expression profile of a condition
    with $m$ genes can be considered as a vector in $m$ dimensional space where $m$
    is the number of genes. Figure 1 shows the gene expression matrix $A$ with $m$
    genes across $n$ conditions is considered to be an $m \times n$ matrix. Each element
    $a_{ij}$ of this matrix represents the expression level of a gene $i$ under a
    specific condition $j$, and is represented by a real number.


    # Gene Expression Data


    # SIGNIFICANCE OF CANCER DIAGNOSIS USING MICROARRAY


    Cancer classification includes more than 200 types of cancer (American Cancer
    Society). For any patient to receive proper therapy, the clinician must identify
    as accurately as the cancer type. Analysis of morphological characteristics of
    biopsy specimens is the standard method, it gives very limited information and
    clearly misses much important cancer aspects such as rate of proliferation, capacity
    for invasion and metastases, and development of resistance mechanisms to certain
    treatment agents. To appropriately classify cancer subtypes, therefore, molecular
    diagnostic methods are needed. The classical molecular methods look for the DNA,
    RNA or protein of a defined marker that is correlated with a specific type of
    tumor and may not give biological information'
