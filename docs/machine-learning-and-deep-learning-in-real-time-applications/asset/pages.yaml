    # CONCLUSION


    This chapter proposes a CNN framework to solve the four-class classification problem
    (normal, benign, in situ, and invasive) on H&E stained microscopic images by retrieving
    nuclei and tissue structure information. DL techniques have emerged to address
    many problems in the field of medical image processing. Processing a classification
    scheme for BC tissue image classification based on deep CNNs, Convolutional networks
    are considered as state-of-the-art techniques for classification problems when
    the input is high-dimensional data such as images. These networks learn to extract
    local features from images and classify the input to the extracted features. Using
    a robust data augmentation and deep convolutional feature extraction process with
    pre-trained CNNs on ImageNet can increase the visibility of classification. On
    top of that, the implementation of the gradient boosting algorithm is highly accurate.
    This approach achieved 89.7% and 81.8% of accuracies for 2-class and 4-class classification
    of histology BC. There is scope for improving classification performance by using
    better network design. The influence of other scales on the performance is also
    considered future work. Furthermore, multiple instance learning-based approaches
    with weakly supervised data can be attempted.


