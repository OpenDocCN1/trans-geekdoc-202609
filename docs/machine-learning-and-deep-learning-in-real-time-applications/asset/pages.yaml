  md: '# Optimization


    Optimization is the selection of the best element using some criterion from some
    set of available alternatives. The goal of optimization is to provide near perfect,
    effective and all possible alternatives. Maximizing or minimizing function related
    to application or features of the application is the process of optimization.
    For example, minimising the cost function or minimising the mean square error
    is the goal of optimization in typical ML algorithms. Machine learning often uses
    optimization algorithms to enhance their learning performance. Training optimization
    improves the generalization ability of any model.


    Following diagram shows the taxonomy of optimization techniques.


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_213_0.png)


    It is difficult to train the network effectively. Classification accuracy is improved
    with improvement in training. So, the training of deep learning algorithms can
    be improved using optimization techniques. There are many optimization techniques,
    but recent techniques indicate the use of metaheuristic algorithms for training
    optimization. Metaheuristic techniques are popular because they can be applied
    in any generalized problem domain. Among many metaheuristic algorithms like ant
    and bee algorithms, particle swarm optimization, genetic algorithms, firefly algorithms,
    harmony search, the Cuckoo Search (CS) Algorithm (Yang & Deb, 2014) was preferred.
    Primary advantages of CS as follows:


    +   - Applied in a wide variety of problems like Face Recognition, Engineering
    optimization, Medical domain et. proved beneficial'
