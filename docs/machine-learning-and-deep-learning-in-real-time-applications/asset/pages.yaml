    $y_i = z''_i, i=1,2,...,N_{L_i}, N_L=M \quad (6)$


    # Backpropagation


    The goal in developing neural models is to find an optimal set of weights $w$,
    so that $y=y(x,w)$ approaches the original behavior of a problem. This is achieved
    through the training process (that is, spatial optimization). A set of training
    data is presented to the neural network, consisting of pairs of $(x_k, d_k), k=1,2,...,P$
    where $d_k$ is the desired output for the inputs $x_k$ and $P$ is the total number
    of training examples.


    During training, the performance of the neural network is evaluated by calculating
    the difference between your outputs and the desired output for all training examples.
    The difference, also known as error, can be quantified by (7).


    $E_t(w) = \frac{1}{2}\sum_{k=1}^{m}\sum_{j=1}^{n}(y_j(x_k,w)-d_{\mu})^2 \quad
    (7)$


    where $d_{\mu}$ is the element of $d_v$, $(y(x,w))$ is the output $j$ of the neural
    network for the input $x_s$ and $T_t$ is an index of the training set. The weights
    $w$ are adjusted during training so that this error is minimized. In 1986, Rumelhart,
    Hinton, and Williams proposed a systematic approach to NN training. One of the
    most significant contributions of their work is the backpropagation algorithm
    (Zhang & Devabhtuni, 2003).


    # Optimization Methods


    The term optimization refers to the search for minimum or maximum values for a
    given function, through a systematic choice of variable values within a viable
    set. It is therefore, to find an optimal solution to a problem, which results
    in the best system performance.


    Some of the most used NN optimization methods are Stochastic Gradient Descent
    (SGD), Nesterov Accelerated Gradient (NAG), Adaptive Moment Estimation (Adam),
    and Root Mean Square Propagation (RMSprop). In the present study, the Stochastic
    Gradient Descent (SGD) was used because it leads to fast convergence and it doesn''t
    require memory storing of all the training data, which makes it appropriate for
    large datasets.'
