    # Frameworks Built on top of PyTorch


    This section discusses the frameworks which have been developed on top of PyTorch.
    Each subsection discusses a different framework.


    # MemCNN (van de Leeuwen et al, 2018)


    This framework is for developing memory-efficient invertible convolution neural
    networks. By removing the need to store input activations and instead reconstructing
    them on demand have helped researchers to reduce memory footprint. For this approach,
    there is a need to write custom backpropagation every time. MemCNN is a PyTorch
    based framework that removes this need of writing a custom backpropagation every
    time. MemCNN resulted in similar accuracy of the art model on CIFAR dataset with
    faster training.


    # MedicalTorch (Perone et al., 2018)


    MedicalTorch is an open-source framework based on PyTorch. It contains various
    medical datasets, preprocessed models, and tools that help in simplifying the
    process of neural network building for medical image analysis.


    # Modular Deep Reinforcement Learning Framework

    in PyTorch (Keng et al., 2017)


    Reinforcement Learning is a type of machine learning technique that is used to
    make the system learn by it interact with its environment using a reward system.

    The SLM (simulated laboratory module) is developed in PyTorch with the objective
    of making reinforcement learning research easier and more accessible by designing
    it to correspond to the ways papers discuss reinforcement learning closely.


    # PyTorch-Kaldi Speech Recognition Toolkit (Ravanelli et al., 2019)


    PyTorch-Kaldi Speech Recognition Toolkit is an open-source repository that helps
    in developing state-of-the-art deep neural network/hidden Markov model (DNN/HMM)
    speech recognition systems.

    The DNN part is managed by PyTorch, while feature extraction, label computation,
    and decoding are performed with the Kaldi toolkit.'
