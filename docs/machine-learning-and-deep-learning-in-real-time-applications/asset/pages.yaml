    # DEEP LEARNING METHODS


    This section discusses separation from a Devanagari printed document image using
    deep learning methods. Deep learning methods for text extraction help improve
    the accuracy of the Devanagari document recognition.


    # Deep Learning Architectures


    Deep learning originated from the concept of artificial neural network (ANN).
    An excellent example of the models with deep architectures is the multilayer perceptron
    with many hidden layers. An example of deep learning architecture is shown in
    Figure 7 (Afshine Amidi and Shevine Amidi, 2018). The input layer varies depending
    on applications. It can be a speech signal, an array of features, an image, a
    sequence of text, etc. The output layer varies with the application to be performed.
    Hidden layers can be one or more depending on how deep the model should be. Various
    factors including calculations of complicated theoretical results, machine learning
    experiments and inspiration from the human brain and its cognition led to the
    use of deep learning architectures. Deep learning finds in various types of problems
    in vision, real-time systems, and other Machine Learning (ML) tasks.


    Figure 7. An example of deep learning architecture (Afshine Amidi and Shevine
    Amidi, 2018)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_316_0.png)


    Each neuron in the hidden layer of the deep architecture is associated with a
    non-linear operation and a weight which results in millions of parameters in the
    entire deep network. Each stage in the architecture extracts features, i.e., the
    model has an abstract/latent representation of the input at each level of the
    architecture. The starting stage in the architecture has low-level features, and
    the ending stage has high-level features of the data. This abstract/latent representation
    of the input is independent of the type of input (either speech, image, structured
    data, etc.).


    The framework to train deep architecture depends on the six elements: Data, tasks,
    models, loss functions, learning algorithm, and evaluation. For any deep architecture,
    the necessary and most important part is the dataset preparation. Deep models
    are data-hungry, and the datasets are application-specific. The more the data
    there is, the more accurate the model is. After dataset preparation, next comes
    the ''task'' to apply on the dataset (like activity recognition, image classification,
    segmentation, speech'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'recognition, etc.). The task application on the model depends on the type of
    dataset (i.e., unsupervised, supervised, regression, and generation). A good model
    is needed for the task to be successful. An appropriate loss function trains the
    model. Every model requires a learning algorithm to optimize the training of the
    model. Various learning algorithms for optimization are Back Propagation (BP),
    Back Propagation Through Time (BPTT), Adagard, Adam, RMSProp, AdaDelta, etc. After
    training, it is necessary to evaluate the model on the test data. This step completes
    the training and testing of a deep architecture.


    # Selection of the Network for Segmentation


    There are various deep models like classification model, regression model, and
    an encoder-decoder model and their implementation is available for different applications
    and tasks. The classification model predicts the class of the input data like
    image, speech, text, and non-text. The regression model helps to predict the continuous
    value for the given input features. An encoder-decoder model generally encodes
    the input sequence to an abstract/latent representation called ''context'' at
    the encoder side, which is used by the decoder to generate the output sequence.
    The first consideration in the selection of these models is to identify if the
    dataset is supervised, unsupervised, or semi-supervised. The next thing to do
    is to decide which model to use for the specific task/application. Feedforward
    Neural Network (FFNN) can be used to solve a regression problem, for example,
    estimating the duration of a taxi for trip. The model can also be used for a classification
    task, to find whether a person has cancer or not depending on the features given
    as input to FFNN. Figure 7 (Afsine Amidi and Shervine Amidi, 2018) is a basic
    architecture of FFNN. Convolutional Neural Network (CNN) is used for classification
    of the image input (whether the given image is of a dog or cat) (see Figure 8
    Katy W., July 2019).


    Figure 8. A typical CNN architecture (Katy W., July 2019)


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_317_0.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Text Separation From Document Images


    Recurrent Neural Network (RNN) model is the most suitable model to handle sequential
    data like the text used in Natural Language Processing. FFNN, CNN, and RNN are
    encoder models, i.e. they do not have the decoder part. For the application of
    segmentation, it is necessary to use the encoder-decoder type of model so that
    the output has the same size as the input with segmented results. Thus, depending
    on the application, one can choose which model is best suited to the task. For
    segmentation, an encoder-decoder model using a combination of CNN, FFNN, and RNN
    model is desirable.


    # Semantic Segmentation


    Image segmentation is defined as dividing or partitioning an image into meaningful
    regions/segments. These segments are sets of pixels related to some objects, also
    called super-pixels. The method defines a boundary around objects present in the
    image by assigning a label to each pixel in the image to be segmented. Tags that
    have the same features are connected and grouped to define an object. Figure 9
    (Saurabh Pal, 2019) shows a segmented image.


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_318_0.png)


    Semantic segmentation and instance segmentation are two classes of Image Segmentation.
    Semantic segmentation is the most classic version (2017) in which each pixel of
    the input image assigns a class label (supervised task). Instance segmentation,
    on the other hand, detects objects in the segmented result. This chapter uses
    semantic segmentation for text separation from document images.

    Semantic segmentation progresses from fine to coarse inference and then again
    from coarse to fine inference. This progression map is in the form of an encoder-decoder
    model. The encoder generates output from the fine input given to the model for
    segmentation. This part is similar to the classification model used in deep learning.
    It helps in predicting the content in the image. The next step comprises localization/detection.
    It helps to provide the information of the labeled classes and also helps to detect
    the spatial location of the classes in the image for segmentation. The final part
    is the semantic segmentation, which generates dense prediction defining the labels
    for every pixel, resulting in a segmented output. The decoder part consists of
    localization and semantic segmentation of the model. Figure 10 (Mathworks, 2018)
    shows the basic model for segmentation.'
