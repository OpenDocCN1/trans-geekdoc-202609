    T. Perroud and K. Sobottka (2002) proposed a color clustering algorithm using
    a two-method based histogram. The first method considers the RGB color space.
    The second method finds spatial information along with colors. This approach shows
    that spatial information has a positive effect on the clustering algorithm. It
    helps to improve text retrieval in documents.


    Sindhu, M. S., & Anusha, N. (2016) extracted text from document images using Otsu’s
    method. The method is used to segment the lowest intensity object, and the method
    continues until the darkest part of the image is cleared.


    Nandedkar, A. V., Mukhopadhyay, J.,and Sural, S. (2015) detected graphics as stamps
    and logos from the scanned document using spectral filtering-based text-graphics
    separation. The high spatial frequency component of the text is used to identify
    the text. Thus, a high-frequency filtering technique is used to separate the text.
    Further, a segmentation process is applied for portraying the remaining text and
    graphics. The graphics content is then divided into two classes i.e logos and
    stamps. The proposed method does not require unsupervised learning. The overall
    performance was achieved by Nandedkar, A. V., Mukhopadhyay, J., & Sural, S. (2015)
