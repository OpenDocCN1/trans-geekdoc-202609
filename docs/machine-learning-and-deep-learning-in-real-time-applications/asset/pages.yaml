    way links between them. Different connectivities produce different behaviors.
    Generally speaking, the feedforward networks are static, and they produce only
    one type of output value instead of a sequence of values of a given input. So,
    they don''t have memory in that their response is independent of the previous
    state of the network. Recurrent networks, on the other hand, are dynamic systems.
    Due to the feedback paths, the inputs of each neuron are modified, which causes
