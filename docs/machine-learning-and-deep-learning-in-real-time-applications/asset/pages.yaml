    # PROCEDURAL WORKFLOW OF THE CNN ALGORITHM


    The Convolutional Neural Network is the Feed-Forward Artificial Neural Network
    specified for virtual context (Arunava 2018). The CNN Algorithm contains the Convolutional
    Layer, the ReLu Layer, the Pooling Layer, and the Fully Connected Layer. Figure
    (3) below defines the architecture of the CNN Model (image n.d.).


    Figure 3. Convolution Neural Networks Architecture


    ![](img/c5cbbc72cd5e7b9be32079eac36d685c_243_0.png)


    The main purpose of creating this algorithm is to identify the input images accurately
    even if they are deformed, which an image is represented in the form of a matrix
    for classification but sometimes the image can be deformed by the presence of
    noise. Hence, in the algorithm, it is specified that the image containing white
    color is assigned the value as -1 whereas the black portion is assigned the value
    as 1 for any black and white input image.


    The CNN Algorithm is designed in such a way where small patches (features of the
    match) of any input image are generated and compared with the actual image for
    classification. The classification or prediction of the image is done by the CNN
    Algorithm by passing the image through its layers and their specific workflow
    (Bibin, Nair, and Punitha 2017).


    The specific features of the image are lined up in the Convolutional Layer and
    the pixel values are arranged in the form of a matrix. Each image pixel is multiplied
    with the corresponding feature value. All the values are then added up and the
    sum is divided by the total number of pixels contained in the matrix. After obtaining
    the value, a map is created for the feature by putting the value obtained as output
    at the specific position.


    The complete matrix obtained as the output for the particular feature is the final
    output generated from this layer.'
