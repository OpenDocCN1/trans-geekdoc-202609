    # Biclustering


    The clustering problem deals with gene similarities by their activity across all
    conditions is that genes in the cluster share the same functions and are therefore
    all affected by the same conditions. Many gene products are known to have more
    than one function. This means that a group of genes display similar expression
    behavior across some of the conditions (those related to the shared function),
    while displaying different properties when looking at conditions relating to functions
    not shared among all the genes in the group. The standard clustering approach
    is oversimplified to detect such cases, creating the need for a more refined,
    local, approach to biclustering. It should be noted that while the clustering
    problem always creates disjoint clusters that bicusters may overlap, and they
    usually cover only a part of the matrix. This overlap is expected when assuming
    that each bicluster represents a function and that genes may have more than one
    function.


    Biclustering takes the input as high dimensional gene expression dataset, and
    tries to find statistically significant sub-matrices in it, also called biclusters.
    These structures show a joint behavior of few genes under some conditions. While
    clustering techniques can be applied to either rows or columns of a data matrix
    separately, biclustering methods perform clustering in the two dimensions simultaneously
    are known as two-way clustering.'
