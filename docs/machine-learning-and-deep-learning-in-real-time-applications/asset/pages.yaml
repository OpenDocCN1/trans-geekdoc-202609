    A network consisting of perceptron utilizes a fact that if we could make a small
    change in weight or bias, a small change in the output also occurs that could
    lead to the accurate perdition of a digit. If the network mistakenly classifies
    a "9" as "8", we could repeat the process of modifying the weights and biases
    repeatedly to produce much better results. However, this small change can sometimes
    cause the output to completely flip from 0 to 1 because of presence of perceptrons
    in our network. The entire behavior of the network can be unpredictable on all
    other images because it is difficult to gradually change the weights and biases
    so that the network gets close to the desired output. A new type of artificial
    neuron known as "sigmoid neuron" was introduced to overcome this problem. Sigmoid
    neurons are modified in such a way that small change in the weights ad biases
    causes only a small change in its output unlike perceptrons.


    Figure 4. A sigmoid neuron (Goodfellow, Bengio, and Courville, 2016)


