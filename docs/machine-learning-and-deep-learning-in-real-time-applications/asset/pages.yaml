  md: "The parameters that will be updated in the network during the training process\
    \ are weights and biases. Bias should be initialized with small constant value\
    \ to activate the tensors in the initial stages.\n\nFigure 41.\n\n```\nweights\
    \ = {\n  'w1': tf.Variable(tf.truncated_normal(shape=[n_input, n_hidden1], stddev=0.1)),\n\
    \  'w2': tf.Variable(tf.truncated_normal(shape=[n_hidden1, n_hidden2], stddev=0.1)),\n\
    \  'w3': tf.Variable(tf.truncated_normal(shape=[n_hidden2, n_hidden3], stddev=0.1)),\n\
    \  'out': tf.Variable(tf.truncated_normal(shape=[n_hidden3, n_output], stddev=0.1))\n\
    }\nbiases = {\n  'b1': tf.Variable(tf.constant(0.1, shape=[n_hidden1])),\n  'b2':\
    \ tf.Variable(tf.constant(0.1, shape=[n_hidden2])),\n  'b3': tf.Variable(tf.constant(0.1,\
    \ shape=[n_hidden3])),\n  'out': tf.Variable(tf.constant(0.1, shape=[n_output]))\n\
    }\n```\n\nNow, the next step is to set up the layers in the network by defining\
    \ the operations to manipulate the tensors.\n\nFigure 42.\n\n```\nlayer_1 = tf.add(tf.matmul(X,\
    \ weights['w1']), biases['b1'])\nlayer_2 = tf.add(tf.matmul(layer_1, weights['w2']),\
    \ biases['b2'])\nlayer_3 = tf.add(tf.matmul(layer_2, weights['w3']), biases['b3'])\n\
    layer_drop = tf.nn.dropout(layer_3, keep_prob)\noutput_layer = tf.matmul(layer_3,\
    \ weights['out']) + biases['out']\n```\n\nThe final step in building the computational\
    \ graph is to define the loss function we want to optimize. Cross_entropy is the\
    \ popular loss function in TensorFlow, which is also known as log-loss. There\
    \ is a need for an optimization algorithm to minimize the loss function. The gradient\
    \ descent optimization is a popular method to find the minimum of a function.\n\
    \nFigure 43.\n\n```\ncross_entropy = tf.reduce_mean(\n  tf.nn.softmax_cross_entropy_with_logits(\n\
    \    labels=Y, logits=output_layer\n  ))\ntrain_step = tf.train.AdamOptimizer(1e-4).minimize(cross_entropy)\n\
    ```"
