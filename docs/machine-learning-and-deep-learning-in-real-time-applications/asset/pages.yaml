    # ## METHODOLOGY


    # ### Dataset


    The collected dataset is an addition of the dataset to (Araújo, T et al. 2017)
    and consists of 400 H&E stain images, each from 2048×1536 pixels downloaded from
    (ICIAR) Grand Challenge, 2018. The entire images are digitally acquired within
    the equivalent conditions, with an intensification level of 200x and 0.42µm ×0.42µm
    of pixel size. Each image is labelled into one of four balanced classes: normal,
    benign, in situ carcinoma, and invasive carcinoma, where the class defined in
    the image is its cancer type.


    # ### Proposed Approach


    CNN architectures with millions of factors, such as VGG, Inception, and ResNet
    have resulted in many computer vision tasks (Christian, Sergey, Vincent, & Alexander,
    2016). Still, a large number of images are essential to train these neural networks
    from scratch, whereas training on a small dataset is insufficient, that is, the
    inability to generalize knowledge which leads to either overfitting/underfitting.
    A common alleviate for these situations is the refinement of a pre-trained network
    to a new dataset. Conversely, in these experiments, the tuning method did not
    perform well on this task. Therefore, a different technique called convolutional
    feature representation (Yanning et al., 2016) has been considered in this work.
    The unsupervised dimensionality reduction phase considerably decreases the risk
    of overfitting in the future stage of supervised learning. The usage of LightGBM
    which is a rapid, distributed, and elevated performance of gradient boosted trees
    for supervised classification. Gradient Boosting Models (GBM) are widely used
    in ML due to their speed, accuracy and rigidity against overfitting (Guolin et
    al., 2017).


