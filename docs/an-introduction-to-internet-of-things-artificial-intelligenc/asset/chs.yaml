- '# 物联网、人工智能与机器学习入门指南




  ![](img/Image00001.jpg)






  ## 1. 物联网


  随着技术的发展和变得日益复杂，我们周围的世界变得更加互联和智能化。曾经仅仅是科幻小说、想象的产物，已经成为我们现实的一部分。在本文中，我们希望你能够了解我们这个时代最核心的技术之一：物联网、人工智能和机器学习。


  ### 1.1 物联网简介


  让我们从物联网开始吧！物联网（`IoT`）本质上是由物理对象（或“事物”）组成的网络，这些对象被配备了传感器、软件和其他技术，旨在通过互联网与各种类似连接的设备和系统进行连接、通信和数据交换。


  连接到物联网的设备尺寸范围很大，可以从微小的芯片或标签（最近的一个例子是 `Apple Tag`）到大型家用电器（例如智能冰箱、家庭安全系统、汽车或用于各个领域的各种工业机器）。到
  2018 年底，全球估计有 220 亿个物联网（`IoT`）设备在使用。随着消费电子行业中硬件和软件复杂性的剧增，全球制造的越来越多的电子设备具有固有的互联网连接功能。预测显示，到
  2030 年，全球将使用约 500 亿个 `IoT` 设备，创建一个巨大的互联设备网络，现代世界的人从家里到工作场所都会遇到这些设备。


  物联网的价值在过去几年不断增长。在 Fortune Insights™ 最近的一项题为《物联网（IoT）市场规模、份额及 Covid19 影响分析，按组件（平台、解决方案和服务务）、按平台（设备管理、云平台和网络管理）、按解决方案（实时流分析、安全、数据管理、远程监控、网络带宽管理）、按用途（金融、零售、政府、医疗、制造业、交通、IT
  和电信及其他）以及区域预测，2020-2027》的研究报告中，物联网（`IoT`）市场规模在 2019 年已达到 2507.2 亿美元，预计到 2027 年将达到
  14631.9 亿美元，预测期间的复合年增长率为 24.9%。如果说有什么肯定的，那就是物联网将长期存在。


  ### 1.2 物联网是如何产生的


  智能设备网络的主意早在 1982 年就已出现，始于卡内基梅隆大学一台经过改装的可口可乐自动售卖机，这是第一台连接到互联网的机器。它可以通过互联网发送有关其库存以及是否冰凉的信息。


  1991 年，Mark Weiser 发表了一篇题为《21 世纪的计算机》的论文，涉及泛在计算（软件工程和计算机科学中的概念，指在任何地方、使用任何设备或机器以及任何格式进行的计算）。这与
  `PerCom` 和 `UbiCom` 等学术会议共同促成了现代物联网的愿景。





  从 1993 年到 1997 年，几家公司相继推出了解决方案，如微软的 at Work 或诺顿的 NEST。当比尔·乔伊（Bill Joy）在 1999 年于达沃斯参加的世界经济论坛上演讲时，他将设备间的通信描述为他的“六网”框架的一部分，使该领域获得了进一步发展的动力。


  最后，在 1999 年，“物联网”这一术语本身由宝华公司的凯文·阿什顿（Kevin Ashton）创造出来，他后来加入了麻省理工学院（MIT）的自动识别中心。


  ### 1.3 物联网如何工作


  为了让物联网按照其预期方式运行，需要许多不同的技术共同工作，以实现物联网的可能。特别是那些允许各种设备和机器进行通信和数据交换的技术，对于物联网这一互联网络来说是不可或缺的。


  首先，在设备相互通信之前，设备需要能够将彼此识别为唯一的实体，为此，使用了各种识别方案（`IS`）和标识符。


  物联网标准中的标识符通常可以归分为以下几类：对象标识符、通信标识符和应用标识符。对象标识符代表物理或虚拟对象。例如，`Barcodes`和无线射频识别（`RFID`）是一些不能用于寻址或通信目的的标识符。另一方面，通信标识符用于识别网络上具有通信能力的唯一节点。网络节点可以是任何传感器或网络设备。通信标识符通常由
  `IP address` 组成，用于寻址目的。最后，应用标识符识别服务层应用、对象和逻辑实体等。此类标识符的示例包括统一资源标识符（`URI`）和统一资源定位符（`URL`）。


  为了与运行在不同物联网平台和设备上的各种物联网应用进行通信，需要一种统一的识别方法。这是物联网中最显著的问题，因为标识符的互操作性是一个需要克服的重大障碍，而这源于许多不同物联网平台共存的事实。不同物联网平台硬件设备的多样性使得异构标识符的协同工作变得更具挑战性。目前正在使用许多通用的
  `ISs`，包括但不限于：对象标识符（`OID`）、电子产品代码（`EPC`）、通用唯一标识标识符（`UUID`）和国际移动设备识别码（`IMEI`）。这些 `ISs`
  用于识别不同领域的设备和对象，例如供应链、手机手机和信息系统。不幸的是，目前还没有单一的全球通用唯一 `IS`，不同的平台在物联网中使用不同的方案。这使得在无数平台之间实现互操作性在今天仍然是一项挑战。


  物联网的另一个不可或缺的部分是设备如何跨越分离对象本身的物理距离进行通信。在现代，有很多不同的技术允许这种事的发生，无论是有线还是无线，并且跨越分离这些网络不同部分的各种距离。


  在短范围内，连接设备之间的无线通信可以通过多种通道实现，例如：蓝牙网格网络，蓝牙低功耗（`BLE`）的网格网络变体，它增加了网络节点数量并使用标准化的应用层；Wi-Fi，一种运行在
  `IEEE 802.11` 标准上的本地局域网技术，设备可以通过共享的访问点进行通信，也可以在连接到网络的单个设备之间直接通信；光纤通信（`Li-Fi`），一种类似于
  Wi-Fi 标准的无线通信技术，通过使用可见光通信来实现更高的带宽；近场通信（`NFC`），允许两个电子设备在 4 厘米范围内相互通信的通信协议；无线射频识别（`RFID`），一种利用电磁场读取存储在嵌入或附在其他物品标签中数据的技术。


  对于较远距离，通常经常使用其他技术，可能是有线或无线的，示例如下：`5G` 无线网络，可用于实现高通信速率并连接大量物联网设备，即使设备处于移动状态；低功耗广域网（`LPWAN`），一种设计用于远距离、低速率通信的无线网络；以太网，一种使用双绞线和光纤通用通用标准，配合集线器或交换机允许对象进行通信。


  ### 1.4 物联网的应用


  物联网可以应用于许多不同的领域和行业，在如今已随处可见。此类设备可以大致分为消费、工业和基础设施空间。在本章中，我们将探讨物联网的一些消费应用。


  ### 1.4.1 家庭自动化


  消费物联网设备包括个人设备，如智能手机、可穿戴设备、时尚物品以及越来越多的智能家用电器，它们现在通过互联网互联，收集并共享数据。


  随着物联网变得普及，物联网设备立足的领域之一是家庭自动化。家庭自动化物联网设备示例包括照明、暖空调系统、摄像头、媒体和安全系统。


  不可否认，智能家居技术的采用以惊人的速度进行。消费技术协会（`CTA`）估计，美国约 69%的人至少有一个智能家居设备。在美国以外，国际数据公司（`IDC`）报告称，2019
  年全球智能家居市场增长了 27%，出货量达到 8.3 亿台。此外，预计到 2023 年数量将达到 20 亿。特别是热门设备是智能音箱和灯光、家庭监控设备以及连接式恒温器。让我们来看看它们的一些功能。


  智能开关允许人们根据预设日程开关灯光，通过数字应用程序控制，并在其他设备的帮助下对语音命令、动作甚至你的位置做出响应。


  智能恒温器能够提供舒适性并节省成本和能量。这些设备可以根据人的作息建立加热冷却计划。此外，它们可以检测人们何时在家何时离开，以便家居通风和空调系统仅在需要时运行，从而节省能源。


  所有这些设备通常连接到家庭自动化系统，该系统通常通过将设备连接到中央集纽器或`网关`来工作。该系统的控制可以使用壁挂终端、计算机或手机应用程序进行。智能音箱，如亚马逊
  Echo 系列和谷歌 Home 系列，是此类枢纽的典型示例。


  ### 1.4.2 辅助功能





  智能家居的另一个关键应用是为老年人和残障人士提供帮助。家庭系统可以利用辅助技术来适应主主的各种残障。语音激活命令可以帮助视障或行动不便的人士，而报警系统可以直接连接到听障人士的蜗蜗植入物。还可以实施安全功能，例如检测地震发作或跌倒等医疗紧急情况的传感器。通过这种方式应用的智能家居技术可以为用户提供更多的个人独立性和更高的生活质量。


  物联网（IoT）与人工智能（AI）相结合可以帮助残障人士更好地阅读和理解周围环境。这对于视障人士特别有用。以微软的 `Seeing AI` 应用为例，它旨在帮助视觉障碍者了解其周围环境。这个编写了人工智能的应用程序可以引导步行者避开拥挤的路口，甚至告诉用户周围人的面部表情。`Google`
  也发布了类似的技术 `Cloud Vision API`，供开发者创建具有识别和分类功能的应用程序和设备。应用程序的虚拟“视觉”可以提高用户对周围物理状况的理解和语境化。更好地理解周围环境可以帮助残障人士克服面临的许多沟通困难，并对视觉、听觉和认知障碍个体非常有帮助。


  物联网技术还产生了如智能手表等可穿戴设备，可以将电子邮件和短信等内容翻译成盲文或为用户朗读。此类设备可以提高残障人士的自主性，帮助残障人士克服社会障碍和心理障碍，从而让他们通过使用此类无智能设备提高生活质量。另一项创新进展是
  `Ducere Technologies` 的智能鞋垫，这是一种使用振动辅助导航的插入式鞋垫。其他公司也在测试新的解决方案，例如类似于雷达的可穿戴设备，以及辅助导航的骨传导技术。这些创新有助于克服残障人士面临的物理障碍，例如阻碍行动不便者进入建筑的楼梯，或可能阻止残障人士使用人道的路缘。


  ### 1.4.3 可穿戴设备


  可穿戴设备是最突出的消费物联网设备。可穿戴设备通过与身体直接接触将人们连接到物联网：通过手腕上的智能手表和健身追踪器，或脸部的智能眼镜和虚拟现实（VR）头设备。


  可穿戴设备还扩展到了娱乐业，创造了消费数字媒体的创新方式。虚拟现实头设备和增强现实眼镜是娱乐领域可穿戴设备的先驱。这些设备的影响不再像最初阶段那样局限于游戏行业，也被应用于医学和教育领域。


  虚拟现实头设备如 `Oculus Rift`、`HTC Vive` 和 `Google Daydream View`，通过模拟第一人称体验，或通过显示媒体并利用用户的全视野，创造出沉浸式的媒体消费体验。同样，几家公司正在开发增强现实眼镜。例如，`Snap
  Inc.` 的 `Spectacles` 是一种可以从用户的视角录制视频并连接到手机在 `Snapchat` 上发布视频的眼镜。`Microsoft` 在 2017
  年发布了增强现实眼镜 `HoloLens`，探索使用数字全息技术，给用户提供增强现实的亲身体验。


  可穿戴技术还扩展到了全身服装。由 `Shiftwear` 公司制造的鞋子使用手机应用程序定期更改显示在鞋子上的设计，使用普通面料，但。


  ### 1.4.4 零售


  零售商正在尝试将物联网引入销售，引入机器人、自动化和无人机交付。`Walmart` 和 `Giant Food Stores` 已经实施了用于清洁地板和检查库存的机器人。另一个可能很快实现的物联网服务是智能结账。客户将不再需要与收银员互动，只需从货架上拿走物品离开商店即可。`Juniper
  Research` 估计智能结账将由人工智能和计算机视觉驱动，以跟踪商店内的客户。这些技术可能会导致年度交易从 2019 年的 4200 万美元增长到 2023
  年的预计 10 亿美元。例如，`Domino’s` 使用自动驾驶车辆交付食物，`Amazon` 和 `CVS` 等公司正在尝试使用无人机交付商品。客户还可以购买前与产品进行互动。例如，`Gucci`
  使用 AR 让客户试穿运动鞋。




  物联网（IoT）在农业领域有许多应用方式，例如收集温度、降雨量、湿度、风速和风向、虫虫害以及土壤成分的重要数据。这些数据随后可以用于多种方式，例如实现农业技术自动化、做出明智决策以提高作物产量和质量、最大限度地减少风险和浪费，并减少管理作物所需的精力。例如，农民可以远程监测土壤温度、成分和水分，并将获取的数据应用于施肥计划。


  与其类似，丰田通物（Toyota Tsusho）于 2018 年与微软建立了合作伙伴关系，利用`Microsoft Azure`物联网技术套件开发用于水管理的鱼养殖工具。与近畿大学的研究人员一起，他们开发了利用人工智能的水泵机制，可以计算传送带上的鱼类数量，分析数据，并根据分析结果推断水流的效率。


  ### 1.5.3 工业制造


  物联网可以连接具备处理、传感、通信、识别、执行和网络能力的不同制造设备。物联网可用于对生产设备的网络控制和管理、状况和资产管理，或通过物联网带来的生产过程控制来实现智能制造。因此，物联网智能系统允许新产品的快速生产和优化，并对不断变化的需求做出快速反应。


  工业物联网（IIoT）还可以实现使过程控制、操作工具和服务信息系统自动化的数字控制系统，提高工厂的安全性和安全性。物联网还可以通过对在使用机器和设备收集的数据进行预防性预测维护、统计评估和测量，改进资产管理并优化可靠性。


  ### 1.6 基础设施


  物联网的另一个应用是城市和农村基础设施的监测和运行，例如桥梁、铁路轨道以及陆上风场。物联网在基础设施中的一种应用方式是跟踪结构状况的任何事件或变化，这些可能会损害安全并放大风险。


  目前已有一些计划或正在进行的大规模物联网实施，这有助于更好地管理城市及其系统。以韩国的松岛为例。它是正在建设的首个设备完备且连接的智能城市，截至 2018 年
  6 月，其计划中的商业区已完成约 70%。该城市的大部分被设计为布线化和全自动化，几乎完全不需要人工干预。


  另一个例子是西班牙桑坦德尔的一个正在进行的项目。在这一物联网实施中，采用了双管齐下的方法。这座拥有 18 万市民的城市已经安装了 1.8 万个城市智能手机应用程序。该程序连接到
  1 万个传感器，提供搜索停车位、环境监测等服务。


  大都市规模的另一项大型物联网实施是由纽约水务公司（New York Waterways）完成的，它允许城市所有的船只都能在哈德逊河、东河和上纽约湾实现连接，并进行
  24 小时实时监测。随着无线网络的建立，纽约水务能够以以前无法的方式控制其船只和乘客，改进了安全、能源和船队管理以及数字标牌等领域。


  ### 1.7 对物联网的批评与争议


  虽然物联网无疑为我们的生活质量带来了巨大的改进，但该技术仍处于起步阶段。因此，在技术尚未有效填补的空白处，它也带来了一系列自身的缺陷和批评。


  ### 1.7.1 平台碎片化


  物联网正受平台碎片化的困扰，缺乏系统间的互操作性以及通用技术标准。这导致了由于物联网设备的多样性（无论是硬件差异还是软件不兼容），开发能够在不同系统中一致运行的应用变得异常困难。例如，物联网设备之间的无线连接可以使用`Bluetooth`、`Zigbee`、`Z-Wave`等，也可以使用完全自定义的无线电，每种都有其优缺点以及所需的独特生态系统。


  ### 1.7.2 隐私、自主权与控制


  对隐私的担忧使许多人怀疑物联网等大数据基础设施在本质上是否与隐私不兼容。水、运输和能源领域数字化程度提高的主要挑战涉及隐私，这需要研究人员和政策制定者做出充分的回。


  美国公民自由联盟（`ACLU`）对物联网削弱人们对自身生活的控制权表示担忧。美国公民自由联盟表示：“我们无法预测这些力量——不成比例地集中在追求财务利益的企业和渴望更多控制权的政府手中——将如何被使用。事实大数据和物联网将让我们更难控制自己的生活，因为我们在强大的公司和机构面前变得越来越透明，而它们对我们却变得越来越不透明。”随着物联网使用的增加，它们从我们这里收集的隐私信息也将之增加。关于我们的外貌、身份、财务能力和生活空间的数据将更多地被物联网设备获取，并对我们自己的隐私构成重大风险。迟早，随着物联网实施的推进，解决此类问题将成为不可避免的需求。


  ### 1.7.3 安全性


  安全是物联网技术采用面临的最大威胁之一。人们担心正在发生的快速开发和实施并未给予适当或足够的关注来应对安全挑战以及可能必要的监管变化。


  许多安全担忧与传统工作站、服务器和手机遇到的问题相似。薄弱的身份验证过程、未更改默认凭据、设备间传输未加密数据以及对安全更新处理不当都是此类问题的示例。此外，许多物联网设备没有可用的计算能力，导致这些设备无法直接使用基本的安全措施，如安装防火墙或使用强加密系统对设备间传输的数据进行加密；许多设备的低价格和面向市场的定位使得设备上实施强大的安全系统变得更加罕见。




  IoT 设备还可以访问来自许多不同地方的海量数据，并通常可以控制物理设备。可以说，许多连接互联网的家用电器（如冰箱、电视和摄像头）可能会“监视人们在家里”。事实已证明，车辆中计算机控制的设备（如刹车、引擎、锁和其他更关的组件）易受到接入网络的恶意人员的攻击。在某些情况下，车辆计算机系统连接到互联网，允许它们被远程控制（从而被远程操纵）。早在
  2008 年，安全研究人员就展示了未经授权控制心脏搏器的能力。随后，黑客进一步证明了他们可以远程控制胰岛泵和植入式心律复律器。


  安全性低的 IoT 设备还可能被黑客用来攻击他人。2016 年，由感染 `Mirai` 恶意软件的 IoT 设备引发的分布式拒绝服务（DDOS）攻击导致一个 DNS
  提供商和主要网站崩溃。`Mirai` 尸网在第一天就感染了约 65,000 台 IoT 设备，最终感染数量达到了 200,000 到 300,000 台。这类攻击巩固了安全专家对
  IoT 设备威胁和脆弱性的认知。


  # 1. 人工智能


  人工智能（AI）利用机器来模仿人类。通常，是指任何形式的机器（包括软件），其能够执行与人类特别相关的动作。这些动作不仅限于物理输出，还可以涵盖从简单任务到复杂项目的范围。机器学习和深度学习是人工智能的子集，因此关于人工智能的某些章节在这些分类下得到了进一步阐述。


  本质本质上，人工智能因其完美的学习和处理速度以及认知人类无法认知信息的能力而备受推崇。这些系统经常出现在我们的日常生活中，如玩家评分系统、交通应用系统、股市预测以及公司和组织的基本运作。


  总而言之，有 3 种不同的人工智能：弱人工智能、通用人工智能和超级人工智能。


  ## 2.1 弱、通用和超级人工智能


  弱人工智能是我们日常生活中最常见的人工智能形式。这些系统经过良好编程，可以执行我们分配给它的非常特定的功能。人脸识别和语音识别是频繁使用的弱人工智能常见形式。然而，尽管表现出色，弱人工智能仅能完成上述的特定任务。它无法执行超出其编程能力的动作。


  通用人工智能紧密模仿人类的思考和行为。它能够意识地独立思考，并以人类的任何方式理解不同的情况。然而，这种形式的人工智能尚未实现，因为机器缺乏将同一套知识应用于定义领域之外问题的认知能力。


  超级人工智能是一种理论上的人工智能，它超越了人类智能并跨了人类能力。它不仅理解人类的行为和基础，而且能引发情感等人类行为，继承人类的灵魂。超级人工智能将在人类能做的一切方面都表现出色，并以更高的水平执行。想象这样一个生物，它唯一的缺点就是过于完美。一个拥有卓越身体和心理能力的生物，受限于其不断扩张的学习率，超出了我们可能的想象。与通用人工智能类似，这种形式的人工智能尚未实现，我们也还没有实现它。超级人工智能的前引发了对其将如何影响我们文明和生活方式的多重忧虑。


  ## 2.2 人工智能的组件和机制


  人工智能的实现通过一系列组件和机制，这些机制使系统了类似于智能。


  ### 2.2.1 分类器和控制器


  人工智能最基本的程序是分类和控制。控制器在诱导动作之前需要分类。


  分类功能通过模式匹配确定类别和分组。通过监督学习，将预定义的数据分组到各自声明的类别中，并通过这些分组识别模式，从而允许根据这些模式对新的输入和观察进行分类。


  决策树、人工神经网络、核机和 k-最近邻是分类器广泛使用的方法。


  待分类的数据显著影响着分类器的性能。这些数据特征包括样本量、样本在不同类别中的分布和维度。因此，需要对不同形式的数据使用不同形式的分类器，以实现不同的预期结果。


  ### 2.2.2 逻辑


  各种类别的逻辑用于形成人工智能程序和规划的参数和边界。某些规范的形式包括命题逻辑、一阶逻辑、模糊逻辑、描述逻辑和模态逻辑。更基础的形式属于默认逻辑和非单调逻辑，这些是原始感觉，并帮助解决任性问题，即在实际中无法输入执行某动作所需的所有条件的问题。处理差异和冲突函数的逻辑包括次一致性逻辑。归纳逻辑编程也用于机器学习。


  ### 2.2.3 搜索与优化


  搜索是指通过多系列可行解决方案找到最终方案。然而，在大多数情况下，简单的全规模搜索会导致必须筛选无限的解决方案。结果是这些搜索异常漫长或者变得不完整。因此，需要启发式方法来减少搜索的解决方案数量，使任务变得可行。优化是一种搜索方式，我们从可能的假设开始，并不断微调直到不再可能进一步改进为止。


  ### 2.2.4 针对不确定问题的概率方法


  在大多数情况下，人工智能必须在不足且变化的信息下运行，因此需要概率方法作为解决问题的工具。贝叶斯网络在这方面被广泛用通用工具。对于更复杂的情况，人工智能利用额外的高级方法，如马尔可夫链蒙特卡洛。


  效用概念下的数学工具也被用于规划和决策。特定的决策工具也被用于规划和决策。这些工具由马尔可夫决策过程和影响图等模型组成。


  ### 2.2.5 神经网络 (ANN)


  神经网络能够处理连续函数和数字逻辑门，流行的人工智能文化源于深度深度学习神经网络。大多数网络利用梯度下降来处理神经网络的拓扑结构。神经网络也可以利用神经进化来生成这些拓扑结构。然而，由于其简单性，神经进化可能更不容易陷入僵局。


  神经网络通常构成深度前向神经网络，其中信号传递是单向的。这些网络包括多层感知机和径基函数网络。感知机在机器学习中使用。这些网络本质上是深度学习模型。神经网络还构成循环神经网络
  (RNN)，其中允许暂时的动态行为。






  这些网络通过机器学习和智能控制得到利用，后者是 AI 计算程序的一种控制形式。辅助真实神经网络认知功能的新脑皮层，通过分层时间记忆进行模拟。通常，神经网络使用反向传播算法进行编程，该算法是一组被称为自动微分的技术的逆向过程。


  ### 2.2.6 深度学习


  深度学习利用卷积神经网络（`CNN`）——一种 `ANN` 形式——来运行诸如语音识别和面部识别等多个重要的 AI 软件，对复杂的动态系统进行建模。


  `RNNs` 紧密利用深度学习程序来加速序列问题中的学习过程。长短期记忆（`LSTM`）通过连接器时间分类（`CTC`）进行预处理，是另一种非常常用的深度学习
  `RNN`。


  `LSTM` 结合 `CNNs` 拥有许多复杂的程序实现，其中之一就是图像描述。在美国，一些银行利用 `CNN` 处理手写支票，并结合 `GPUs` 能够从视觉上识别模式和序列。


  Google 语音使用 `LSTM` 来实现不同形式的语言处理和建模。这现在已广泛面向普通市场并在移动设备上使用，自发布以来一直表现出色。


  ## 2.3 人工智能的应用


  AI 能够执行其被设定执行的任何适用认知任务。常见现象是，当 AI 程序发布到普通市场时，它就不再被视为 AI。这就是“AI 效应”，许多人认为 AI 并不具备思考的智力能力，而是遵循其被计算好要的操作。然而，我们需要记住，学习这一简单行为（无论是监督还是无监督）在本质上都是能够思考，并具有产生智力输出的能力。


  AI 应用成功的一个流行例子是 `AlphaGo`，这一个 AI 程序将 `CNN` 与强化学习（`RL`）结合，并能够击败国际围棋冠军。尽管受到反对，AI 还能制造深度伪造（Deepfakes），即一种能够创建虚假媒体内容的程序。这种程序经常被滥用来诽毁政家和名人。


  ### 2.3.1 农业


  AI 使农业变得更加高效、高产且安全。AI 通过作物产量识别模式并运行多次模拟，识别实现最高作物产量所需的先决条件等。它根据区域的环境因素预测作物产量的时间表。AI
  还会调查作物的当前环境，解读不同的输出数据，以确保作物符合安全标准或达到理想产量。AI 还利用自动化技术进行作物的收割和维护，以最大限度地提高实际生产。AI 也用于预测可能用于改进作物标准的安全基因改造，为全球粮食安全做出贡献。


  ### 2.3.2 计算机科学与编程


  AI 因其计算能力被极广泛应用于计算机科学，大多数已构建并向普通市场发布的 AI 引擎都经历了 AI 效应。此类示例包括交互式解释器和图形用户界面。AI 显著缩短了冗长编程的需求，并为普通市场提供了易于访问的用户友好界面。


  AI 还可以编写其他 AI。为了改进当前的 `ANN` 拓扑结构，创建了 `NASNet` —— 一种神经架构搜索（NAS），它用以超越现有的系统。`NASNet`
  成功地超越了 `ImageNet` 上现有的系统。


  ### 2.3.3 网络安全


  在高度数字化的世界中，网络安全对于保护我们和信息安全至关重要。企业和组织受到包括恶意软件在内的黑客攻击影响，可能会损失数十亿美元。安全公司将 AI 和自然语言处理（`NLP`）结合使用，通过将拥有的信息分为不同的风险级别，从而对可能摧毁企业的机和关键数据进行严密保护。


  ### 2.3.4 金融


  银行长期以来使用 AI 进行欺诈检测，因为 `ANN` 程序能够突出异常情况。银行还将 AI 用于其日常运营、记账、物业管理和股票投资，因为它可以随时待命，并根据其算法对不同情况做出恰当反应。


  金融机构的多个投资组合完全由 AI 系统运行，并已被证明极其高效。


  通过算法交易，AI 能够以远超人类能力的速度进行交易。它有潜力通过高频交易独立赚取数百万美元。AI 能够做出明智的决策，或为用户提供做出正确判断所需的信息。它能够使用
  `NLP` 筛选社交媒体动态和国际新闻广播等不同的在线来源，并确定不同公司的信誉和状态。`SQREEM`（序列量子还原与提取模型）是一个 AI 领域，用于银行整合调查客户数据并推荐合适的财富管理服务。


  这些分析还通过运行信用风险模型来帮助金融承保，以确定客户的违约概率。在评估客户信用评分时使用了多个观测结果和特征，这些因素通过 AI 系统纳入考量，对所有类型的客户都非常有用，特别是那些缺乏足够信用记录的客户。


  财务报表的审计通过检查多个不同的数据集进行。通过具有更高信誉的 AI 控制程序降低了审计风险，同时缩短了时间。由于提供了高准确性且无误差率的持续审计，这增加了保证性。


  ### 2.3.5 国家安全


  社会安全领域的 AI 系统更多侧重于监管和监控。面部识别系统和 `NLPs` 与 AI 系统同时用于国内的大规模监控，标记潜在危险。


  武装分子在军事行动中也大量利用 AI。AI 有效地协助通信、情报收集和网络行动。自动车辆和无人机依赖 AI 执行一系列活动。这些活动包括检测和确认潜在威胁、目标获取以及网络化自动化之间的通信。


  ### 2.3.6 客户服务


  服务部门的 AI 经常用于替代重复性的通信工作。这些系统还用于提高通信效率，例如自动邮件处理和自动聊天机器人。


  自动 AI 客户服务提高了客户服务的效率和质量，因为它消除了消费者重复重复和常见查询的需求。通过 `NLP` 等程序，客户的语调和语言会被考虑在内，以提供恰当的
  AI 响应。自动客户服务处理不重要的服务的烦恼，让真正的客户服务代表能够处理复杂案例，显著提高了工作效率和质量。


  酒店还利用 AI 机器人提供招待服务。AI 系统能够预测客人的需求并减少员工的重复工作。AI 还通过进行常规检查简化了正常的酒店运营，并能通过提供机器人、虚拟助手以及收集客人对酒店标准的反馈来提供额外服务。这进一步提高了酒店员工处理客人更紧迫或更重要需求的效率和质量。


  ### 2.3.7 营销与广告





  AI 记录在线消费者的通用模式和活动，并根据这些活动展示选定的商品和服务。通过追踪消费者的数字足迹，广告根据这些 AI 算法得到了更有效的投放，让消费者看到他们“想要”和“喜欢”看到的内容。这些个性化广告在社交媒体平台上也很常见，会自发地为消费者提供推荐内容。AI
  根据消费者对内容的响应提供这些广告，点击或搜索特定内容就为相关产品的植入提供了机会。


  ### 2.3.8 就业与招聘


  AI 通过具有用户友好界面的通用平台简化了求职。找工作算法通过相关的技能组合和通用规范匹配雇主和候选人。这些平台利用 `NLP` 通过程序化算法识别并强调某些关键词。对简历质量进行评分的软件也供候选人使用，以增加他们被录用的机会。


  AI 取代了物理招聘人员审阅如山简历的需求。它能够在识别候选人不同资质后筛选简历并对候选人进行排序。AI 还可以根据他们的作品集评估候选人的成功率。


  ### 2.3.9 社会挑战


  AI 可用于识别影响全球各国的社会问题。AI 通过分析采集的卫星图像，用于识别不同国家程度的贫困程度。联合国平台 `AI for Good Global Summit`（人工智能善国际全球峰）利用
  AI 识别社会经济问题以及各种经过研究的项目规划来解决这些问题。这些计划在执行之前会经过多系列测试和预测。


  ### 2.3.10 交通


  AI 被大量应用于我们的交通系统，试图通过自动化减少误差范围并提高效率。消费者还可以访问车辆上的 AI 辅助功能，例如自动停车和 GPS 推荐路线。


  全自动汽车目前正处于测试阶段，但预计能够安全、高效地完成任务。由于交通系统的复杂性，自动驾驶车辆在寻找定位方面面临困难，但在更多 AI 的帮助下取得了显著进展。然而，与其他形式的交通一样，这些自动驾驶车辆在危险时刻仍需要用户做出决策，以维持乘客的安全。


  在航空领域，AI 被大量用于飞行员训练，并已被证明对模拟飞行非常有效。现在的商业航班通常也是自动化的，仅在起飞、降落和高风险情况下需要飞行员。NASA 利用 AI
  执行计算，因为这些程序在执行多达多个小数位的数字精确计算时没有容错空间。


  在海事领域，AI 用于日常船舶运营和维护。情境感知系统由 `ANNs` 运行，推荐路线系统在运营前正处于测试阶段。AI 能够持续监控船队状况并最大化运营效率。AI
  极极地服务海事部门，由于海事领域的动态性质，这些系统仍处于测试中。


  ## 2.4 挑战


  AI 无疑在多个方面对我们的生活产生了重大影响。AI 对经济的改变也直接影响了我们的生计。许多人担心会被 AI 取代，因为这些系统更高效、更有力。然而，为了实现
  AI 强大的计算输出，需要超级计算机来实现突破。运行复杂且繁重的任务需要大量的程序和处理器，遗憾的是，这些设备并不廉价。此外，即使数据流入量增加，组织在利用这些新型且更大规模的数据时也面临困难，并随着更多的升级产生更多的后续成本。由于成本充足的问题，许多人还预测，由于此类新型系统的负担能力，AI
  的演变将带来更严重的阶级分化。


  AI 只能根据给它的信息确定结果。这意味着它无法根据提供它的信息来识别偏见。如果用于学习的信息带有偏见，AI 程序将因为这种错误产生偏见，因此必须警惕 AI 所接受的学习过程，以防止此类问题的发生。


  如上所述，AI 效应也是日常生活中识别 AI 用处的挑战之一。许多人对 AI 有很高的期望，但它能做的事情是有限的，因为它毕竟受到我们人类植入的程序的限制。


  # 1. 机器学习


  机器学习是计算机科学的一个分支，关注构建依赖于某些现象示例集合的算法。这些示例可能来自自然界、由人类手工制作，也可能由其他形式的算法生成。它通常被认为是人工智能的一个子集。通常，`Machine
  Learning` 系统使用一组特定的数据进行训练，专门用于系统的训练和编程。之后，系统能够执行未直接编写代码的任务。这使得 `Machine Learning`
  在应用方式上非常广泛。计算机程序根据其对某些任务的“经验”运行，其在任务上的性能随着“经验”的增加而提高。


  `Machine Learning` 的主要任务是通过归纳推理进行推理。它们需要在缺乏必要信息的情况下得出可能的结论，导致发现的结论具有不确定性。这本质上是现实生活中发生的情况，所需数据不可用或未知。因此，利用形式概率和统计学来实现所需的输出。


  ## 3.1 参数化机器学习模型


  参数化模型是一种学习模型，它用一组固定大小的参数来总结数据。无论给参数化模型多少数据，模型都不会改变它所需的参数数量。这些算法涉及选择一种函数的形式，然后从给定的训练数据中学习函数的系数。


  这具有优势，因为它是一个快速且简单的系统，只需要少量数据。然而，它的缺点是必须做出强假设，而且它不是为了执行复杂任务设计的。可能存在模型欠拟合的问题，即训练后的模型无法预测训练集给出的目标。这种情况发生是因为模型需要更复杂，或者因为特征需要更多信息量。


  ## 3.2 非参数化机器学习


  非参数机器学习算法是不对映射函数的形式做出强假设的算法。当可用大量数据且缺乏先验知识时，这非常有用。它减少了必须为模型选择正确特征的烦恼。





  机器学习常用的一些基础算法包括线性方程组、最小二乘法、线性回归、岭回归、多项回归、优化、梯度下降、决策树和随机森林。


  为了确保训练算法具有良好的泛化能力（高性能），使用测试集（包含未见过的示例）来测试对示例标签的预测。其他重要的性能考虑因素是计算速度和效率。为了最大限度地提高软件质量，计算效率与可维护性之间的权衡是非常重要的考虑因素。


  ## 3.4 机器学习方法论


  在训练机器学习模型时，主要会使用四种学习方法论。这些包括监督学习、无监督学习、半监督学习和强化学习。


  ### 3.4.1 监督学习


  使用训练数据的目的是从给定的数据和标签中学习模型的参数。这些数据和标签都是已知的。在测试期间，模型使用这些学习到的参数来预测新数据的标签。


  在监督学习中，数据集是标签示例的集合。`N` 指可用样本的数量。`N` 中的每个元素 `𝐱𝑖` 被称为特征向量。特征向量是一个向量，其中每个特定维度 `𝐱𝑖`
  包含描述该示例的值。这提供了关于数据集特征的信息。标签 `𝑦𝑖` 可以是属于有限类别集合的元素，也可以是一个实数。


  这里通常通过对离散值输出的预测来进行分类。回归也经常通过连续值输出使用。


  ### 3.4.2 无监督学习


  在无监督学习中，数据集是不带标签示例的集合。同样，`x` 是特征向量，无监督学习算法的目标是创建一个以特征向量 `x` 作为输入的模型。然后，该输入被转换为另一个向量或可以用于解决实际问题的数值。


  在这种情况下，我们不会向训练模型提供类别。这允许机器通过分组和聚类来发现数据的底层结构，从而通过方式梳理出数据中的差异。通常使用图表摘要来展示模型的输出。


  ### 3.4.3 半监督学习


  正如名称所示，这种形式的学习是监督学习和无监督学习的混合。标记数据和未标记数据都会输入到学习模型中进行处理。通常未标记的数据量会大得多。来自监督学习的分类与通过识别特征来判断数据如何分布的能力相结合。研究发现，这种具有少量标记数据的学习形式可以使学习模型更加准确。


  ### 3.4.4 强化学习


  强化学习涉及机器通过阶段变化与环境进行交互。策略（Policy）是一个函数，它接收状态的特征向量作为输入，并输出在该状态下执行的最优动作。如果动作最大化预期平均奖励，则是最优的。


  ## 3.5 数据管理


  针对不同形式的数据有许多数据清洗方法以提高数据质量。这些数据处理形式对于提高模型准确性至关重要，使我们获得获得效率和整体性能。


  ### 3.5.1 数据整理（Data Wrangling）


  数据整理是将数据从一种“原始”数据形式转换并映射到（另一种格式，以使其更适合下游分析）的过程。数据整理不能盲目执行，我们必须了解整理的必要性。


  数据整理的示例包括缩放到某个范围、特征裁剪、z-score 标准化和一热编码。


  ### 3.5.2 数据清洗


  数据清洗检测源自数据集、表格或数据库的损坏和不准确的记录，并纠正或删除这些数据。数据清洗可以有效处理缺失数据和插值问题。


  ### 3.5.3 数据完整性


  数据完整性维护数据在整个生命周期内的准确性和一致性保证。这对于设计和应用任何汇总、处理或存储数据的系统至关重要。这些通常以两种形式存在：物理完整性和逻辑完整性。


  ## 3.6 机器学习在线应用


  机器学习过程已经在在线被广泛采用和利用，通过处理大量数据来优化输出。


  ### 3.6.1 搜索引擎


  虽然可能看起来显而易见，但我们在线的一些重要功能是由机器学习驱动的。这种技术最重要的用途之一可以在搜索引擎中找到，例如 Google、Yahoo 或 Bing。搜索引擎预计解析搜索结果并将最相关的资源推向前沿。如果搜索引擎无法理解用户发送的查询，将无法向用户展示合适的网页。这就是机器学习发挥作用的地方。


  用户是人，因此在进行搜索时会犯错，包括拼写错误，因此搜索引擎不能假设用户总是拼写正确。事实上，许多人使用搜索引擎来寻找他们模糊记得字母的正确拼写。为了让搜索引擎能够可靠地识别用户输入的单词，即使他们犯了某种拼写错误，使用了机器学习。


  此外，用户很少搜索网站中找到的确切字句，因此搜索引擎必须近似词汇含义及其同义词，并找出最相关的网页。歧义搜索也需要搜索引擎进行识别，例如当用户搜索“Titanium（钛）”时，搜索引擎必须显示与化学元素和歌曲相关的结果，以确保用户找到他们想要。这同样是机器学习在工作。


  ### 3.6.2 广告


  网络另一个大量使用机器学习的组件是广告。现代广告允许更好地针对目标受众，并提高向潜在客户展示的质量的适用性。通过 Facebook 和 Instagram 等社交媒体网站，或
  Google 等通用网站，广告现在能够更好地针对受众，向他们展示用户可能更感兴趣的广告。


  ### 3.6.3 社交媒体





  机器学习的另一个用途是管理社交媒体网站内容的算法。无论是 Twitter 的精选时间线（Timeline）、Instagram 的动态（Feed）、Tumblr
  的仪表板（Dashboard）还是 YouTube 的推荐视频，用户在这些网站上交互的将新颖有趣内容推向用户关注中心的许多功能都使用了机器学习。这些网站利用已知的用户数据作为输入，预测用户可能感兴趣的事件、帖子或内容，并将其呈现给用户，以期在使用这些社交网站时提供更具参与感的体验。如果没有机器学习，现代网站将无法是如今的模样。


  ## 3.7 金融应用


  如今机器学习应用领域影响力的领域之一是金融和经济领域。机器学习帮助人们决定何时以及何地转移资金，并已成为该领域专业人员工具箱中不可或缺的一部分。


  ### 3.7.1 算法交易


  如今在金融领域应用机器学习的一种形式是算法交易。这指的是利用算法帮助交易员在与市场交易时做出更好的决策。交易员利用数学模型来监测业务趋势和其他交易活动，试图检测即将发生的变化的因素和迹象，这些因素可能导致交易员所交易商品的价格上涨或下跌。交易员可以通过输入预设参数来控制其交易，以便在这种情况下无需交易员主动输入即可自动完成交易。这样做为交易员带来了一些收益，如果在没有算法交易辅助的情况下自行交易，可能无法获得这些收益。首先，算法交易模型能够同时任何时间处理和评估大量数据，其准确性高于单一的人类大脑。它们在数字平台上更加灵活，每天能够处理和管理数千笔交易，并能够做出快速的交易决策，为用户在使用机器学习工具进行交易时提供了不可否认的优势。


  此外，使用机器学习的算法交易不会根据情绪做出任何交易决策，而其人类对手相反，后者往往受到情绪诱惑；这种在交易界中众为人知的毛病会模糊许多交易员的判断。这种被对冲基金经理和金融机构使用的交易方法使得交易活动能够自动化，并摆脱情绪脆弱的人类反复变化的心。


  ### 3.7.2 欺诈检测与预防


  机器学习使用的另一个领域是欺诈检测与预防。欺诈是金融机构面临的一个大问题，每年导致数十亿美元的损失。金融公司以数字形式存储大量数据，安全泄露风险巨大。随着技术进步的加快，欺诈现在被认为是对高价值数据的高威胁。


  过去的欺诈检测系统是根据一组规则创建的，现代欺诈者现在可以相对容易地绕这些规则。因此，如今大多数公司使用机器学习，通过扫描数据集并检测异常活动来标记和打击欺诈交易，并将其标记以待进一步调查。通过将交易与其拥有的数据（如账户历史和
  `IP address`）进行比较，算法可以确定交易是否可能异常，并在采取进一步审查之前阻止该交易。


  ## 3.7 数据识别与翻译应用


  如今机器学习应用的一种创新方式是图像识别、手写识别和语音识别。从文档的自动数字化到实时翻译和语音转文本，机器学习将现实世界数据转换为数字数据的能力正变得越来越无足价值。


  随着世界向更加数字化方向迈进，越来越多的公司和企业需要将记录存储在虚拟空间而非物理空间。然而，当必须手动将数据输入数字世界时，这种转换过程充满了障碍和错误。在这方面，由机器学习支持的手写识别和图像识别技术可以大幅减少将大量文档转录到数字数据库时所需的时间和可能产生的错误。


  类似地，图像翻译（例如 `Google Image Translate` 和 `Yandex`）可以通过查看外语文本图像并翻译并将结果覆盖在图像上来提供翻译服务。翻译技术的进步减少了在翻译现实文本时对中间翻译员的需求，因为对于一个仅精通
  `Latin` 字母的说话者来说，当外语文本以不熟悉的脚本（如 `Cyrillic`、`Chinese`、`Japanese`、`Hindi` 或阿拉伯）书写时，他们无法手动输入外语文本。在这种情况下，机器学习将是图像识别技术以及翻译本身的支持，因为它搜索其数据库并为待翻译单词提供最接近的匹配。


  另一方面，诸如 `Jibbig` 的语音翻译系统使用语音识别、机器翻译和语音合成技术进行实时翻译。用户可以用母语说某些内容，应用程序会对其进行拆解以确定所说的话语。然后进行机器翻译，并将翻译后的单词输入算法，该算法从其数据库中提取语音，并最终以语音形式交付第二语言的翻译单词。


  ## 3.8 医学应用


  机器学习使用日益增加的另一个领域是医疗领域。其中一个应用是疾病识别和诊断，例如癌症的识别和治疗。2016 年，`IBM Watson Health` 发布了 `IBM
  Watson Genomics`，这是与 `Quest Diagnostics` 的合作，旨在通过融合认知计算和基因测序技术来实现精准医疗。另一个例子是位于波士顿的生物医药公司
  `Berg`，它正在使用机器学习技术在前列腺癌检测和管理等领域研究开发诊断和治疗方法。


  同样，牛津的 `P1vital® Predicting Response to Depression Treatment (PReDicT)` 项目正在使用机器学习和预测分析来诊断患者并提供治疗，其总体愿景是生产一套可供购买的情绪测试套件，供诊所使用。


  机器学习在初步药物发现和测试领域也存在应用，例如对药物化合物进行初步筛选以预测成功率。`MIT Clinical Learning Group` 就是这样的用户之一，他们使用机器学习算法辅助其精准医疗研究，以更好地了解治疗`2
  型糖尿病`等疾病的疾病过程。


  ## 3.9 机器学习的未来





  机器学习在计算和分析海量数据方面具有不可估量的潜力和实用性。由于其执行复杂任务的速度比人类劳工更快且更准确，企业已经并将继续越来越多地使用它。机器学习市场本身预计将从
  2016 年的 10.3 亿美元增长到 2022 年的 88.1 亿美元，复合年增长率为 44.1%。`Google`、`Microsoft`、`Apple`
  和 `IBM` 等巨头已经在利用机器学习能力，并正引领开发更先进、更复杂的系统，以用于其业务运营。看来，机器学习的存在在未来将被愈发深刻感受到。


  ## 结论


  随着我们的现代世界继续向进一步数字化和自动化的道路迈进，物联网、人工智能和机器学习将日益融入到我们生活的方方面面，从日常生活、工作和研究，到各个工业和商业领域的发展（无论是生产、制造还是服务业）。即使我们的技术的发展以这种惊人的速度持续，我们也必须保持警惕，确保不会陷入“隧道视野”的陷阱。必须建立法规和安全体系，以确保我们的技术（以及由这些技术处理的宝贵数据和信息）不会成为那些怀有恶意者利用的容易目标。围绕此类进步的可能导致社会不稳定的各种伦理问题，例如对隐私的过度担忧或自动化服务实施导致的失业问题，也必须经过仔细的应对和解决。


  因此，希望这本书已经为你提供了一个关于 `IoT`、人工智能和机器学习世界的简洁且有效的介绍。正如传奇人物伊卡斯一样，这些尖端技术可能会成为人类的翅膀，让人类得以飞向前所未有的高度，完成当今无人梦过是可能的壮举。


