    \n[4.   Conclusion](#text00006.html#id_Toc73533368)\n\n1.  **Internet of Things**\n\
    \nAs technologies develop and grow more complex by the day, the world around us\
    \ grows more interconnected and intelligent. What once was only fiction, a figment\
    \ of our imagination has already become part of our reality today. In this document,\
    \ we hope you will learn something about some of the most integral technologies\
    \ of our age: The Internet of Things, Artificial Intelligence, and Machine Learning.\n\
    \n## 1.1 Introduction to the Internet of Things\n\nLet us begin with The Internet\
    \ of Things! The Internet of things (IoT), essentially, is a network of physical\
    \ objects, or \"things\", that have been equipped with sensors, software, and\
    \ other technologies for the purpose of connecting, communicating and exchanging\
    \ data with various other similarly connected devices and systems with the help\
    \ of the Internet.\n\nThe size of the devices connected to the Internet of Things\
    \ can range from anything as small as tiny chips or tags, a recent example being\
    \ that of the Apple Tag, to large appliances, such as a smart fridge, home security\
    \ systems, cars, or various industrial machines used in a large variety of sectors.\
    \ By the end of 2018, there were an estimated 22 billion internet of things (IoT)\
    \ connected devices in use around the world. As the complexity of both hardware\
    \ and software in the consumer electronics industry increases dramatically, more\
    \ and more electronic devices manufactured around the world are produced to have\
    \ internet connectivity inherent in them. Forecasts suggest that by 2030 around\
    \ 50 billion of these IoT devices will be in use around the world, creating a\
    \ massive web of interconnected devices that someone living in the modern world\
    \ will encounter from the comfort of their home to their workplace.\n\nThe value\
    \ of the Internet of things has only grown in the past years. In a recent study\
    \ by Fortune Business Insights™ titled, “Internet of Things (IoT) Market Size,\
    \ Share & Covid-19 Impact Analysis, By Component (Platform, Solution and Services),\
    \ By Platform (Device Management, Cloud Platform, and Network Management), By\
    \ Solution (Real-Time Streaming Analytics, Security, Data Management, Remote Monitoring,\
    \ Network Band Management), By End-Use (BFSI, Retail, Government, Healthcare,\
    \ Manufacturing, Transportation, IT & Telecom, and Others), and Regional Forecast,\
    \ 2020-2027.”, it is reported that the Internet of Things (IoT) market size had\
    \ reached USD 250.72 billion in 2019 and is projected to reach USD 1,463.19 billion\
    \ by 2027, with a Compound Annual Growth Rate of 24.9% during the forecast period.\
    \ If there is one thing for certain, it is that IoT will be here to stay.\n\n\
    ## 1.2 How the Internet of Things came to be\n\nThe main idea of a network of\
    \ smart devices emerged as early as 1982, beginning with a modified Coca-Cola\
    \ vending machine at Carnegie Mellon University, which was the first machine connected\
    \ to the Internet. It was able to send information via the Internet about its\
    \ inventory as well as if its stock was cold or not.\n\nIn 1991, Mark Weiser published\
    \ a paper, “The Computer of the 21st Century”, on ubiquitous computing (a concept\
    \ in software engineering and computer science that looks at computing occurring\
    \ anywhere, using any device or machine, and in any format.). This, combined with\
    \ academic venues such as PerCom and UbiCom gave rise to the modern vision of\
    \ the Internet of Things."
