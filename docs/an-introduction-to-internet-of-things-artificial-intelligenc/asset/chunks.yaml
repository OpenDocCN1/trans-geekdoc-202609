- raw: 'From 1993 to1997, several companies came out with solutions such as Microsoft''s
    at Work or Novell''s NEST. The field gained further momentum when Bill Joy described
    inter-device communication as a part of his "Six Webs" framework when he presented
    at the World Economic Forum at Davos in 1999.


    Finally, in 1999, The term "Internet of things" itself was coined by Kevin Ashton
    of Procter & Gamble, later MIT''s Auto-ID Center.


    ## 1.3 How IoT Works


    For the Internet of Things to work as it is, many different technologies had to
    come together to enable the Internet of Things to be possible. In particular,
    technologies that allow the various devices and machines to communicate and exchange
    data are indispensable to the interconnected network that is the Internet of Things.


    To begin, before devices can communicate with one another, there is a need for
    the devices to be able to identify each other as unique entities, and for this,
    various Identification schemes (IS) and identifiers are used.


    The identifiers in an IoT standard can normally be categorised into the following:
    object identifier, communication identifier, and application identifier. Object
    identifiers represent physical or virtual objects. For example, Barcodes and Radio
    Frequency IDentifier (RFID) are some identifiers that cannot be used for the purposes
    of addressing or communicating. Communication identifiers, on the other hand,
    identify unique nodes on a network that have communication capabilities. Examples
    of a network node would be any sensor or network device. The Communication identifier,
    which is typically made of an IP address, is used for addressing purposes. Finally,
    Application identifiers identify service layer applications, objects, and logical
    entities, etc. Some examples of this type of identifier would be Uniform Resource
    Identifier (URI) and Uniform Resource Locator (URL).


    In order to communicate with various IoT applications operating on different IoT
    platforms and devices, a unified identification methodology is needed. This is
    the most prominent issue in the IoT, as the interoperability of identifiers is
    a significant obstacle that needs to be overcome, arising from the fact that many
    different IoT platforms co-exist. The diverse nature of the hardware devices of
    different IoT platforms makes it even more challenging for the heterogeneous identifiers
    to work together. There are many universal ISs in use, including but not limited
    to: Object IDentifier (OID), Electronic Product Code (EPC), Universally Unique
    IDentifier (UUID), and International Mobile Equipment Identity (IMEI). These ISs
    are used in identifying devices and objects in different sectors, such as the
    supply chain, cellular phones and information systems. Unfortunately, there is
    no single universally unique IS today, and different platforms use different schemes
    in the IoT. This makes interoperability across the myriad of platforms a challenge
    to achieve today.


    Another integral part of the Internet of Things is the way devices communicate
    with each other across the physical distance that separates the objects themselves.
    In modern times, there are many different technologies that allow this to happen,
    whether wired or wireless, and across a range of distances that separate these
    distinct parts of the network.


    In the short range, wireless communication between connected devices could be
    done through various channels, such as: Bluetooth mesh networking, a mesh networking
    variant to Bluetooth low energy (BLE) with increased number of network nodes,
    using a standardized application layer; Wi-Fi, a technology used for local area
    networking operating on the IEEE 802.11 standard, where devices can either communicate
    through a shared access point or directly between individual devices connected
    to the network; Light-Fidelity (Li-Fi), a wireless communication technology similar
    to the Wi-Fi standard, achieving increased bandwidth by using visible light communication;
    Near-field communication (NFC), communication protocols that allows two electronic
    devices to communicate with each other within a 4 cm range; Radio-frequency identification
    (RFID), a technology that uses electromagnetic fields to read data that are stored
    in tags embedded in or attached to other items.


    For longer ranges, other technologies are more often used, which may be wired
    or wireless, examples of some would be as follows: 5G wireless networks, which
    can be used to achieve high communication rates and connect a large number of
    IoT devices, even while the devices are on the move; Low-power wide-area networking
    (LPWAN), a type of wireless network designed to allow long-range communication
    at a low data rate, thereby reducing power and cost needed for transmission; Ethernet,
    which is a general purpose networking standard that uses twisted pair and fiber
    optic links together with hubs or switches to allow objects to communicate.


    ## 1.4 Consumer Applications of IoT


    The Internet of Things can be applied in a large variety of sectors and industries
    and it is evident in the many IoT devices in use today. Such devices can be broadly
    classified into consumer, commercial, industrial and infrastructure spaces. In
    this chapter, we will be taking a look at some of the consumer applications of
    IoT.


    ### 1.4.1 Home Automation


    Consumer Internet of Things devices include physical personal devices, such as
    smartphones, wearables, fashion items and the growing number of smart home appliances,
    that are now. interconnected via the internet, collecting and sharing data to
    other devices connected to the network.


    As the Internet of things becomes more prevalent, one of the areas where IoT devices
    are gaining an increasing foothold is in home automation. Examples of IoT devices
    used in home automation are lighting, heating and air conditioning systems, camera,
    media and security systems.


    There is no denying that adoption of smart home technology is happening at an
    incredible pace. The Consumer Technology Association (CTA) has estimated around
    69 percent of people in the U.S. have at least one smart home device. Outside
    the US, The International Data Corporation (IDC) reports that the global market
    for smart home devices grew by 27 percent in 2019 alone, with 833 million devices
    being shipped that year. Furthermore, the amount of devices shipped is expected
    to increase to two billion by 2023. In particular, the more popular devices are
    smart speakers and lights, home monitoring devices, and connected thermostats.
    Let us take a look at some of their capabilities.


    A smart light switch would allow one to switch their lights on and off following
    a preset schedule, with a digital app, and, with the aid of other devices, respond
    to voice commands, motion, or even your location.


    A smart thermostat has the ability to provide both comfort and cost and energy
    savings. These devices can establish a heating and cooling schedule based on when
    one’s routine. Furthermore, they can detect when one is home and when they are
    away, so that their Home ventilation and conditioning system operates only when
    required, saving energy costs.


    All of these devices are usually connected to a home automation system, which
    typically works by connecting them to a central hub or "gateway". The control
    of this system can then be manipulated using devices such as wall-mounted terminals,
    computers, or a mobile phone application which may allow off-site control through
    the Internet. Smart speakers, such as The Amazon Echo series and Google Home series,
    are prime examples of such a hub. As these smart speakers have become widely embraced
    by many other smart home device producers, they have become de facto hubs for
    their home automation systems, serving as a central point for controlling everything
    from lights to security cameras and air conditioning systems.


