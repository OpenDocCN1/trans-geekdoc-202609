- raw: 'IoT devices also have access to massive amounts of data from many different
    places, and can often control physical devices. It would not be a stretch to say
    that many Internet-connected appliances such as refrigerators, televisions, and
    cameras could "spy on people in their own homes". Computer-controlled devices
    in vehicles such as brakes, engine, locks, and more vital components have been
    proven to be vulnerable to malicious people who have access to the network. In
    some cases, vehicle computer systems are connected to the internet, allowing them
    to be controlled (and therefore manipulated) remotely. Even by as early as 2008
    security researchers had demonstrated the capability to remotely control pacemakers
    without authorization. Later hackers further proved that they could remote control
    insulin pumps and implantable cardioverter defibrillators.


    Poorly secured IoT devices can also be hacked to attack others. In 2016, a distributed
    denial of service (DDOS) attack enabled by IoT devices infected with the Mirai
    malware took down a DNS provider and major websites. The Mirai Botnet had infected
    roughly 65,000 IoT devices in the first day and eventually reached 200,000 to
    300,000 infections. These sorts of attacks have cemented the threat and vulnerability
    of IoT devices in the minds of security experts.


    1.  **Artificial Intelligence**


    Artificial Intelligence (AI) utilises machines to imitate human thinking and responses.
    Typically, any form of machinery, including software, that is able to perform
    actions that are affiliated specially with humans. These actions are not limited
    to just physical outputs and can vary from simple tasks to complicated projects.
    Machine Learning and Deep Learning are subsets of AI and thus some sections on
    AI are further elaborated under these classifications.


    Essentially, AI is well sought after for its impeccable learning and processing
    rates with its ability to cognize information that man cannot. These systems are
    used very often in our daily lives, being found in player rating systems, transport
    application systems, stock market predictions and basic operation of companies
    and organizations.


    To surmise, there are 3 different types of AI. Narrow AI, General AI and Super
    AI.


    ## 2.1 Narrow, General, and Super AI


    Narrow AI is the most common form of AI that we see in our daily lives. These
    systems are well programmed to perform very specific functions that we task it
    to do. Facial and speech recognitions are frequent forms of narrow AI that are
    utilized. However, narrow AI is only capable of achieving said specific tasks
    despite its outstanding performance. It is not able to perform actions that are
    beyond its programmed capacity.


    General AI closely imitates human thinking and conduct. It has the ability to
    consciously think for itself and comprehend different situations in any way that
    a human would. However, this form of AI has not been attained as machines lack
    the cognition to apply the same set of knowledge on problems beyond its defined
    domain.


    Super AI is a theoretical AI that surpasses human intelligence and transcends
    human capabilities. It does not merely understand human actions and bases and
    instead elicits human behavior such as emotions, inheriting that of a human soul.
    Super AI’s would excel in all that humans are able to do and perform with a higher
    caliber. Picture a being with its only flaw being that it is too perfect. A being
    possessing superior physical and mental capabilities that is only limited by its
    ever-expanding learning rate, beyond our possible imagination. Similar to General
    AI, this form of AI has not been attained, neither are we close to attaining it.
    The prospects of Super AI’s carries about multiple concerns on how it would affect
    our civilization and way of life.


    ## 2.2 Components and Mechanisms of Artificial Intelligence


    Artificial Intelligence is only made possible through a series of components and
    mechanisms, through which systems are equipped with a semblance of intelligence.


    ### 2.2.1 Classifiers and Controllers


    The most fundamental programs of AI are classification and controlling. Controllers
    require classifications before inducing actions.


    Classification functions determine classes and groupings through pattern matching.
    Via supervised learning, predefined data is grouped to their own stated classes
    and patterns are identified through these groupings, allowing following new inputs
    and observations to be classified according to these patterns.


    Decision trees, artificial neural networks, kernel machines and k-nearest neighbors
    are widely used approaches for classifiers.


    The data that is to be classified significantly governs the performance of classifiers.
    These characteristics of data include sample size, sample distribution across
    the different classes and dimensionality. As such, different forms of classifiers
    need to be used for different forms of data in order to achieve different required
    outcomes.


    ### 2.2.2 Logic


    Various categories of logic are used to form parameters and boundaries of AI programs
    and planning. Some forms for specifications include propositional logic, first-order
    logic, fuzzy logic, description logic and modal logic. More fundamental forms
    fall under default logic and non-monotonic logic, these are rudimental senses
    and help tackle the qualification problem which is the incapability of inputting
    all the conditions needed for an action to perform properly in actuality. Logics
    tackling discrepant and conflicting functions include paraconsistent logics. Inductive
    logic programming is used in Machine Learning too.


    ### 2.2.3 Search and Optimization


    Search refers to finding a final solution through multiple series of viable solutions.
    However, a simple full-scale search, in most cases, results in having to sieve
    through infinite solutions. Resultantly, these searches are inordinately long
    or end up incomplete. Thus, heuristics are needed to reduce the number of solutions
    searched to make the task manageable. Optimization is a way of searching where
    we start off through possible conjectures and continue fine-tuning to a point
    where further improvements are no longer possible.


    ### 2.2.4 Probabilistic Methodologies for Indeterminate Problems


    In most cases AI has to run under insufficient and varied information, thus probability
    methodologies are needed as tools for problem solving. Bayesian networks are used
    extensively as a generic tool in this aspect. For more complex cases, AI utilizes
    additional advanced approaches such as the Markov chain Monte Carlo.


    Mathematical tools under the concept of utility are also established for planning
    and decision making. Specific decision tools are also utilized for planning and
    decision making. Said tools consist of models like Markov decision processes and
    influence diagrams.


    ### 2.2.5 Artificial Neural Networks (ANN)


    Neural networks are able to process continual functions and digital logic gates
    and popular AI culture resulted from utilising neural networks with deep learning.
    Majority of these networks utilize gradient descent for the topology of their
    neural networks. ANN may also utilize neuroevolution to generate these topologies
    too. However, neuroevolution may be better as it is less likely to reach an impasse
    due to its simplicity.


    ANN usually make up deep forward neutral networks, where signal passes happen
    unidirectionally. These networks include multi-layer perceptrons and radial basis
    networks. Perceptrons are used with Machine Learning. These networks are essentially
    deep learning models. ANN also makes up recurrent neural networks (RNN), where
    temporary dynamic behaviours are allowed.'
