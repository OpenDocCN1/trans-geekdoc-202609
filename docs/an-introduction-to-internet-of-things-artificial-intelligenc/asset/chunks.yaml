- raw: 'With its immeasurable potential and usefulness in computing and analysing
    mind bogglingly large amounts of data, machine learning has been and will continue
    to be used in increasingly large amounts by businesses due to its ability to perform
    complex tasks much quicker and accurately than human labour ever could. The machine
    learning market itself is expected to grow from USD 1.03 billion in 2016 to USD
    8.81 billion by 2022, a Compound Annual Growth Rate of 44.1%. Big players such
    as Google, Microsoft, Apple and IBM are already leveraging machine learning capabilities
    and are spearheading the development of more advanced and complex systems to be
    used in their business operations. It seems that the presence of machine learning
    will only be more keenly felt in the future.


    1.  **Conclusion**


    As our modern world continues on the path towards further digitization and automation,
    the Internet of Things, Artificial Intelligence and Machine Learning will only
    become increasingly integrated with every aspect of our lives, from day-to-day
