    and those with disabilities. Home systems can utilise assistive technology to
    accommodate for an owner''s various disabilities. Voice activated commands can
    assist those with sight impairments or mobility issues while alarm systems can
    be connected straight to cochlear implants of the hearing-impaired. Safety features
    such as sensors that detect medical emergencies such as seizures or falls can
    also be implemented. Smart home technology applied in such a manner can provide
    users with more personal independence and a higher quality of life.


    IoT and AI combined can aid disabled individuals in better reading and understanding
    the environment around them. This is especially useful for the visually impaired.
    Take Microsoft’s Seeing AI app for example, designed to help visually challenged
    people learn about their immediate surroundings. The artificial intelligence programmed
    application can guide walking users away from crowded junctions and even inform
    the user about the facial expressions of people around them. A similar technology,
    Cloud Vision API, has also been unveiled by Google for developers to create apps
    and devices that possess recognition and classification features. The artificial
    ‘sight’ of the applications can improve users’ understanding and contextualization
    of physical situations in their surroundings. The ability to better understand
    their surroundings can help disabled individuals conquer the many communication
    troubles that they face and can be of much use to individuals with visual, auditory,
    and cognitive impairments.


    IoT technology has also resulted in wearables like smartwatches that can translate
    content such as emails and texts into Braille or read them aloud to the user.
    Such devices can improve autonomy of the impaired and help disabled individuals
    overcome social barriers and mental barriers, thereby allowing them to improve
    their quality of life with the usage of such accessible smart equipment. Another
    such innovative developments are smart insoles by Ducere Technologies, an insertable
    insole that uses vibrations to ease navigation. Other companies are also testing
    new solutions, such as wearable devices that are reminiscent of radar, and bone-conducting
    technology to aid in navigation. Such innovations are helpful in overcoming physical
    obstacles that disabled individuals face, for example, stairs that hinder someone
    with mobility impairments from entering a building, or curbs that may prevent
    a disabled individual from using sidewalks.


    ### 1.4.3 Wearable Devices


    Wearable devices are some of the most prominent consumer Iot devices. Wearable
    devices connect people to the Internet of Things through direct contact with their
    body: through the wrist with smartwatches and fitness trackers or on a face with
    smart glasses and virtual reality (VR) headsets.


    Wearables have also expanded into the entertainment industry by creating innovative
    ways to consume digital media. Devices such as virtual reality headsets and augmented
    reality glasses are forerunners for wearables in entertainment. The influence
    of these devices no longer remain contained in the gaming industry like the initial
    days, but are also utilized in the fields of medicine and education.


    Virtual reality headsets such as the Oculus Rift, HTC Vive, and Google Daydream
    View create an immersive media consumption experience by simulating a first-person
    experience, or by displaying the media and utilizing the user''s full field of
    vision. Similarly, augmented reality glasses are in development by several companies.
    For example, Snap Inc.''s Spectacles are sunglasses that can record video from
    the user''s point of view and connect to a phone to post videos on Snapchat. Microsoft
    has also released Augmented Reality glasses, HoloLens, in 2017, exploring using
    digital holography, to give the user a first-hand experience of Augmented Reality.


    Wearable technology has also expanded to include apparel all over the body. Shoes
    made by the company Shiftwear uses a smartphone application to periodically change
    the design that is displayed on the shoe, using normal fabric but utilizing a
    display along the midsection and back of the shoe that displays a design of your
    choice.


    ### 1.4.4 Retail


    Retailers are experimenting with implementing IoT into sales models, introducing
    in-store robots, automation, and drone deliveries into retail stores as these
    IoT systems can assist and replace menial human tasks. Walmart and Giant Food
    Stores have implemented robots for cleaning floors and checking inventory.


    Another IoT service that may soon be implemented is smart checkouts. Customers
    will no longer have to interact with cashiers but they can simply pick items off
    shelves and walk out of the store. Juniper Research estimates that smart checkouts
    will be powered by AI and computer vision so as to track customers in the store
    as they pick the items they want. These technologies may lead to annual transactions
    growth from $42 million in 2019 to an estimated $1 billion by 2023.


    Smart delivery and better customer engagement can also enhance customer experience.
    Domino’s, for example, is using autonomous vehicles to deliver food, and other
    companies such as Amazon and CVS are experimenting with using drones to deliver
    their goods. Customers are also able to interact with their products before purchase,
    when buying online, with augmented and virtual reality tools. Gucci, for example,
    uses AR to allow customers to try on sneakers before purchasing them.


    ## 1.5 Commercial Applications of IoT


    In the commercial space, IoT devices and technology has been increasingly adopted,
    and has thus far delivered promising results across a variety of industries.


    ### 1.5.1 Healthcare


    The Internet of Medical Things (IoMT) is a medical and health related application
    of the IoT, along with data collection and analysis for research, and monitoring.
    It is also known as "Smart Healthcare", as the technology is used for creating
    a digitized healthcare system by connecting available medical resources and healthcare
    services.


    IoT devices could be used to build remote emergency notification and health monitoring
    systems. These health monitoring devices range from blood pressure and heart rate
    monitors to advanced devices such as pacemakers, electronic wristbands, or hearing
    aids. Some hospitals have also begun implementing "smart beds" that senses that
    they are occupied and when a patient is trying to get up. It can also configure
    itself to achieve appropriate support to the patient without manual interaction
    needed from nurses. A 2015 Goldman Sachs report estimates that healthcare IoT
    devices "can save the United States more than $300 billion in annual healthcare
    expenditures by increasing revenue and decreasing cost."


    Specialized sensors can also be installed in living spaces to monitor the status
    and general health of the elderly. Such sensors can create a web of smart sensors
    that can collect, process, transfer, and analyze important information in various
    environments. Other consumer devices that encourage healthy living, such as connected
    scales or wearable heart monitors, are available with the IoT.


    ### 1.5.2 Industrial Agriculture


    Industrial IoT (also known as IIoT) devices receive and analyze data sent from
    connected equipment, operational technology, locations and people. Together with
    operational technology monitoring devices, IIoT regulates and monitors industrial
    systems.'
