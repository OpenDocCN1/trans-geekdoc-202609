    机器学习常用的一些基础算法包括线性方程组、最小二乘法、线性回归、岭回归、多项回归、优化、梯度下降、决策树和随机森林。


    为了确保训练算法具有良好的泛化能力（高性能），使用测试集（包含未见过的示例）来测试对示例标签的预测。其他重要的性能考虑因素是计算速度和效率。为了最大限度地提高软件质量，计算效率与可维护性之间的权衡是非常重要的考虑因素。


    ## 3.4 机器学习方法论


    在训练机器学习模型时，主要会使用四种学习方法论。这些包括监督学习、无监督学习、半监督学习和强化学习。


    ### 3.4.1 监督学习


    使用训练数据的目的是从给定的数据和标签中学习模型的参数。这些数据和标签都是已知的。在测试期间，模型使用这些学习到的参数来预测新数据的标签。


    在监督学习中，数据集是标签示例的集合。`N` 指可用样本的数量。`N` 中的每个元素 `𝐱𝑖` 被称为特征向量。特征向量是一个向量，其中每个特定维度 `𝐱𝑖`
    包含描述该示例的值。这提供了关于数据集特征的信息。标签 `𝑦𝑖` 可以是属于有限类别集合的元素，也可以是一个实数。


    这里通常通过对离散值输出的预测来进行分类。回归也经常通过连续值输出使用。


    ### 3.4.2 无监督学习


    在无监督学习中，数据集是不带标签示例的集合。同样，`x` 是特征向量，无监督学习算法的目标是创建一个以特征向量 `x` 作为输入的模型。然后，该输入被转换为另一个向量或可以用于解决实际问题的数值。


    在这种情况下，我们不会向训练模型提供类别。这允许机器通过分组和聚类来发现数据的底层结构，从而通过方式梳理出数据中的差异。通常使用图表摘要来展示模型的输出。


    ### 3.4.3 半监督学习


    正如名称所示，这种形式的学习是监督学习和无监督学习的混合。标记数据和未标记数据都会输入到学习模型中进行处理。通常未标记的数据量会大得多。来自监督学习的分类与通过识别特征来判断数据如何分布的能力相结合。研究发现，这种具有少量标记数据的学习形式可以使学习模型更加准确。


    ### 3.4.4 强化学习


    强化学习涉及机器通过阶段变化与环境进行交互。策略（Policy）是一个函数，它接收状态的特征向量作为输入，并输出在该状态下执行的最优动作。如果动作最大化预期平均奖励，则是最优的。


    ## 3.5 数据管理


    针对不同形式的数据有许多数据清洗方法以提高数据质量。这些数据处理形式对于提高模型准确性至关重要，使我们获得获得效率和整体性能。


    ### 3.5.1 数据整理（Data Wrangling）


    数据整理是将数据从一种“原始”数据形式转换并映射到（另一种格式，以使其更适合下游分析）的过程。数据整理不能盲目执行，我们必须了解整理的必要性。


    数据整理的示例包括缩放到某个范围、特征裁剪、z-score 标准化和一热编码。


    ### 3.5.2 数据清洗


    数据清洗检测源自数据集、表格或数据库的损坏和不准确的记录，并纠正或删除这些数据。数据清洗可以有效处理缺失数据和插值问题。


    ### 3.5.3 数据完整性


    数据完整性维护数据在整个生命周期内的准确性和一致性保证。这对于设计和应用任何汇总、处理或存储数据的系统至关重要。这些通常以两种形式存在：物理完整性和逻辑完整性。


    ## 3.6 机器学习在线应用


    机器学习过程已经在在线被广泛采用和利用，通过处理大量数据来优化输出。


    ### 3.6.1 搜索引擎


    虽然可能看起来显而易见，但我们在线的一些重要功能是由机器学习驱动的。这种技术最重要的用途之一可以在搜索引擎中找到，例如 Google、Yahoo 或 Bing。搜索引擎预计解析搜索结果并将最相关的资源推向前沿。如果搜索引擎无法理解用户发送的查询，将无法向用户展示合适的网页。这就是机器学习发挥作用的地方。


    用户是人，因此在进行搜索时会犯错，包括拼写错误，因此搜索引擎不能假设用户总是拼写正确。事实上，许多人使用搜索引擎来寻找他们模糊记得字母的正确拼写。为了让搜索引擎能够可靠地识别用户输入的单词，即使他们犯了某种拼写错误，使用了机器学习。


    此外，用户很少搜索网站中找到的确切字句，因此搜索引擎必须近似词汇含义及其同义词，并找出最相关的网页。歧义搜索也需要搜索引擎进行识别，例如当用户搜索“Titanium（钛）”时，搜索引擎必须显示与化学元素和歌曲相关的结果，以确保用户找到他们想要。这同样是机器学习在工作。


    ### 3.6.2 广告


    网络另一个大量使用机器学习的组件是广告。现代广告允许更好地针对目标受众，并提高向潜在客户展示的质量的适用性。通过 Facebook 和 Instagram
    等社交媒体网站，或 Google 等通用网站，广告现在能够更好地针对受众，向他们展示用户可能更感兴趣的广告。


