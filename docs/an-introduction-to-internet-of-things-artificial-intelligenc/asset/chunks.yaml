    根据消费者对内容的响应提供这些广告，点击或搜索特定内容就为相关产品的植入提供了机会。


    ### 2.3.8 就业与招聘


    AI 通过具有用户友好界面的通用平台简化了求职。找工作算法通过相关的技能组合和通用规范匹配雇主和候选人。这些平台利用 `NLP` 通过程序化算法识别并强调某些关键词。对简历质量进行评分的软件也供候选人使用，以增加他们被录用的机会。


    AI 取代了物理招聘人员审阅如山简历的需求。它能够在识别候选人不同资质后筛选简历并对候选人进行排序。AI 还可以根据他们的作品集评估候选人的成功率。


    ### 2.3.9 社会挑战


    AI 可用于识别影响全球各国的社会问题。AI 通过分析采集的卫星图像，用于识别不同国家程度的贫困程度。联合国平台 `AI for Good Global Summit`（人工智能善国际全球峰）利用
    AI 识别社会经济问题以及各种经过研究的项目规划来解决这些问题。这些计划在执行之前会经过多系列测试和预测。


    ### 2.3.10 交通


    AI 被大量应用于我们的交通系统，试图通过自动化减少误差范围并提高效率。消费者还可以访问车辆上的 AI 辅助功能，例如自动停车和 GPS 推荐路线。


    全自动汽车目前正处于测试阶段，但预计能够安全、高效地完成任务。由于交通系统的复杂性，自动驾驶车辆在寻找定位方面面临困难，但在更多 AI 的帮助下取得了显著进展。然而，与其他形式的交通一样，这些自动驾驶车辆在危险时刻仍需要用户做出决策，以维持乘客的安全。


    在航空领域，AI 被大量用于飞行员训练，并已被证明对模拟飞行非常有效。现在的商业航班通常也是自动化的，仅在起飞、降落和高风险情况下需要飞行员。NASA 利用
    AI 执行计算，因为这些程序在执行多达多个小数位的数字精确计算时没有容错空间。


    在海事领域，AI 用于日常船舶运营和维护。情境感知系统由 `ANNs` 运行，推荐路线系统在运营前正处于测试阶段。AI 能够持续监控船队状况并最大化运营效率。AI
    极极地服务海事部门，由于海事领域的动态性质，这些系统仍处于测试中。


    ## 2.4 挑战


    AI 无疑在多个方面对我们的生活产生了重大影响。AI 对经济的改变也直接影响了我们的生计。许多人担心会被 AI 取代，因为这些系统更高效、更有力。然而，为了实现
    AI 强大的计算输出，需要超级计算机来实现突破。运行复杂且繁重的任务需要大量的程序和处理器，遗憾的是，这些设备并不廉价。此外，即使数据流入量增加，组织在利用这些新型且更大规模的数据时也面临困难，并随着更多的升级产生更多的后续成本。由于成本充足的问题，许多人还预测，由于此类新型系统的负担能力，AI
    的演变将带来更严重的阶级分化。


    AI 只能根据给它的信息确定结果。这意味着它无法根据提供它的信息来识别偏见。如果用于学习的信息带有偏见，AI 程序将因为这种错误产生偏见，因此必须警惕 AI
    所接受的学习过程，以防止此类问题的发生。


    如上所述，AI 效应也是日常生活中识别 AI 用处的挑战之一。许多人对 AI 有很高的期望，但它能做的事情是有限的，因为它毕竟受到我们人类植入的程序的限制。


    ### 1. 机器学习


    机器学习是计算机科学的一个分支，关注构建依赖于某些现象示例集合的算法。这些示例可能来自自然界、由人类手工制作，也可能由其他形式的算法生成。它通常被认为是人工智能的一个子集。通常，`Machine
    Learning` 系统使用一组特定的数据进行训练，专门用于系统的训练和编程。之后，系统能够执行未直接编写代码的任务。这使得 `Machine Learning`
    在应用方式上非常广泛。计算机程序根据其对某些任务的“经验”运行，其在任务上的性能随着“经验”的增加而提高。


    `Machine Learning` 的主要任务是通过归纳推理进行推理。它们需要在缺乏必要信息的情况下得出可能的结论，导致发现的结论具有不确定性。这本质上是现实生活中发生的情况，所需数据不可用或未知。因此，利用形式概率和统计学来实现所需的输出。


    ## 3.1 参数化机器学习模型


    参数化模型是一种学习模型，它用一组固定大小的参数来总结数据。无论给参数化模型多少数据，模型都不会改变它所需的参数数量。这些算法涉及选择一种函数的形式，然后从给定的训练数据中学习函数的系数。


    这具有优势，因为它是一个快速且简单的系统，只需要少量数据。然而，它的缺点是必须做出强假设，而且它不是为了执行复杂任务设计的。可能存在模型欠拟合的问题，即训练后的模型无法预测训练集给出的目标。这种情况发生是因为模型需要更复杂，或者因为特征需要更多信息量。


    ## 3.2 非参数化机器学习


    非参数机器学习算法是不对映射函数的形式做出强假设的算法。当可用大量数据且缺乏先验知识时，这非常有用。它减少了必须为模型选择正确特征的烦恼。

