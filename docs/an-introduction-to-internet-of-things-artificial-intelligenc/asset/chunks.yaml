- raw: 'There are numerous ways IoT can be utilized in farming, such as collecting
    important data on temperature, rainfall level, humidity levels, wind speed and
    direction, pest infestation, and the soil content. This data can then be used
    in various ways, such as automating farming techniques, making informed decisions
    to improve quality and quantity of crop yield, minimising risk and waste, and
    reducing the amount of effort required to manage crops. For example, farmers can
    monitor soil temperature, content and moisture remotely, and apply the acquired
    data to fertilisation programs.


    Along a similar vein, Toyota Tsusho started a partnership with Microsoft in 2018
    to develop fish farming tools using the Microsoft Azure application suite for
    IoT technologies regarding water management. Together with researchers from Kindai
    University, they developed water pump mechanisms using artificial intelligence
    that could count the number of fish on a conveyor belt, analyze the data, and
    deduce the effectiveness of water flow from the results of that analysis.


    ### 1.5.3 Industrial Manufacturing


    The IoT can connect different manufacturing devices equipped with processing,
    sensing, communication, identification, actuation, and networking capabilities.
    IoT can be used for smart manufacturing with network control and management of
    production equipment, situation and asset management, or production process control
    that IoT brings to the table. IoT intelligent systems hence allow fast production
    and optimization of new products, and speedy reactions to changing product demands.


    Digital control systems that automate process controls, operating tools and service
    information systems so as to improve plant safety and security can also be achieved
    with IIoT. IoT can also improve asset management with preventive predictive maintenance,
    statistical evaluation, and measurements to optimize reliability with the data
    that it collects from the machines and devices in use.


    ## 1.6 Infrastructure


    Another application of IoT is the monitoring and operating of urban and rural
    infrastructures such as bridges, railway tracks and onshore and offshore wind-farms.
    One such way IoT in infrastructure can be used is for keeping track of any events
    or changes in structural conditions that could compromise safety and amplify risk.


    There are some planned or ongoing large-scale implementations of the IoT, that
    allows for better management of cities and their systems. Take Songdo, South Korea,
    for example. The first fully equipped and connected smart city which is currently
    being constructed, with about 70 percent of its planned business district completed
    as of June 2018. A large portion of the city is designed to be wired and fully
    automated, with little to none human intervention required.


    Another example would be a current project in Santander, Spain. For this implementation
    of the IoT, a two-pronged approach is in play. The city of 180,000 citizens have
    already seen 18,000 installations of its city smartphone app. The app is connected
    to 10,000 sensors that provide services such as parking space searching, environmental
    monitoring, and more.


    One other large implementation of IoT in a metropolitan scale is the one completed
    by New York Waterways in New York City, allowing all the city''s vessels to be
    connected and able to be monitored live around the clock in the Hudson River,
    East River, and Upper New York Bay. With the wireless network in place, NY Waterway
    is able to take control of its vessels and passengers in a way that was not available
    previously, improving areas such as security, energy and fleet management and
    digital signage.


    ## 1.7 Criticisms and Controversies towards IoT


    While IoT has undoubtedly brought about massive improvements in our quality of
    life, the technology is still in its infancy. It thus comes with its own set of
    flaws and criticisms in the gaps that the technology has yet to effectively fill.


    ### 1.7.1 Platform Fragmentation


    The IoT is plagued with platform fragmentation, lack of interoperability between
    different systems and common technical standards. This results in a situation
    where the diversity of IoT devices, whether it is hardware differences, or incompatibility
    in the software running on the devices, makes the job of developing applications
    that work consistently between various differing, wildly incompatible systems
    disproportionally difficult. For example, wireless connections that could be used
    between IoT devices can be done using Bluetooth, Zigbee, Z-Wave, etc as well as
    completely custom proprietary radios, each possessing its own pros and cons, as
    well as unique support ecosystems required to operate them.


    ### 1.7.2 Privacy, Autonomy, and Control


    Concerns regarding privacy have led many to doubt whether big data infrastructures
    such as the Internet of things and data mining are in fact incompatible with privacy
    in its nature. The main challenges of increased digitization in the water, transport
    and energy sectors are related to privacy and cybersecurity, which requires an
    adequate response from both researchers and policymakers.


    The American Civil Liberties Union (ACLU) has expressed concern regarding the
    power of the IoT to chip away at people''s control over their own lives. The ACLU
    have stated that "There''s simply no way to forecast how these immense powers
    – disproportionately accumulating in the hands of corporations seeking financial
    advantage and governments craving ever more control – will be used. Chances are
    big data and the Internet of things will make it harder for us to control our
    own lives, as we grow increasingly transparent to powerful corporations and government
    institutions that are becoming more opaque to us." As IoT usage increases, so
    will the amount of private information that they will be able to collect from
    us. Data on our appearance, identity, financial capabilities, living spaces will
    become more available to devices connected to IoT and may pose a significant risk
    to our own privacy. Sooner or later, there will be an undeniable need to address
    such concerns as the IoT rises in its implementation.


    ### 1.7.3 Security


    Security is one of the biggest threats to the adoption of Internet of things technology.
    Concerns about the rapid development and implementation that is occurring without
    appropriate or enough attention paid to the security challenges and the regulatory
    changes that might be necessary regarding such technology.


    Many of the security concerns are similar to those encountered by conventional
    workstations, servers and phones. Weak authentication processes, not changing
    default credentials set, unencrypted data sent between devices, and poor handling
    of security updates are some examples of such concerns. Additionally, many IoT
    devices do not have much computational power available to be used, resulting in
    such devices being unable to directly use basic security measures such as installing
    firewalls or the usage of strong cryptosystems to encrypt data sent between devices;
    the low prices and consumer focus of many devices makes a strong security system
    being implemented on the devices even more rare.'
