  trans: '

    物联网（IoT）在农业领域有许多应用方式，例如收集温度、降雨量、湿度、风速和风向、虫虫害以及土壤成分的重要数据。这些数据随后可以用于多种方式，例如实现农业技术自动化、做出明智决策以提高作物产量和质量、最大限度地减少风险和浪费，并减少管理作物所需的精力。例如，农民可以远程监测土壤温度、成分和水分，并将获取的数据应用于施肥计划。


    与其类似，丰田通物（Toyota Tsusho）于 2018 年与微软建立了合作伙伴关系，利用`Microsoft Azure`物联网技术套件开发用于水管理的鱼养殖工具。与近畿大学的研究人员一起，他们开发了利用人工智能的水泵机制，可以计算传送带上的鱼类数量，分析数据，并根据分析结果推断水流的效率。


    ## 1.5.3 工业制造


    物联网可以连接具备处理、传感、通信、识别、执行和网络能力的不同制造设备。物联网可用于对生产设备的网络控制和管理、状况和资产管理，或通过物联网带来的生产过程控制来实现智能制造。因此，物联网智能系统允许新产品的快速生产和优化，并对不断变化的需求做出快速反应。


    工业物联网（IIoT）还可以实现使过程控制、操作工具和服务信息系统自动化的数字控制系统，提高工厂的安全性和安全性。物联网还可以通过对在使用机器和设备收集的数据进行预防性预测维护、统计评估和测量，改进资产管理并优化可靠性。


    ## 1.6 基础设施


    物联网的另一个应用是城市和农村基础设施的监测和运行，例如桥梁、铁路轨道以及陆上风场。物联网在基础设施中的一种应用方式是跟踪结构状况的任何事件或变化，这些可能会损害安全并放大风险。


    目前已有一些计划或正在进行的大规模物联网实施，这有助于更好地管理城市及其系统。以韩国的松岛为例。它是正在建设的首个设备完备且连接的智能城市，截至 2018
    年 6 月，其计划中的商业区已完成约 70%。该城市的大部分被设计为布线化和全自动化，几乎完全不需要人工干预。


    另一个例子是西班牙桑坦德尔的一个正在进行的项目。在这一物联网实施中，采用了双管齐下的方法。这座拥有 18 万市民的城市已经安装了 1.8 万个城市智能手机应用程序。该程序连接到
    1 万个传感器，提供搜索停车位、环境监测等服务。


    大都市规模的另一项大型物联网实施是由纽约水务公司（New York Waterways）完成的，它允许城市所有的船只都能在哈德逊河、东河和上纽约湾实现连接，并进行
    24 小时实时监测。随着无线网络的建立，纽约水务能够以以前无法的方式控制其船只和乘客，改进了安全、能源和船队管理以及数字标牌等领域。


    ## 1.7 对物联网的批评与争议


    虽然物联网无疑为我们的生活质量带来了巨大的改进，但该技术仍处于起步阶段。因此，在技术尚未有效填补的空白处，它也带来了一系列自身的缺陷和批评。


    ### 1.7.1 平台碎片化


    物联网正受平台碎片化的困扰，缺乏系统间的互操作性以及通用技术标准。这导致了由于物联网设备的多样性（无论是硬件差异还是软件不兼容），开发能够在不同系统中一致运行的应用变得异常困难。例如，物联网设备之间的无线连接可以使用`Bluetooth`、`Zigbee`、`Z-Wave`等，也可以使用完全自定义的无线电，每种都有其优缺点以及所需的独特生态系统。


    ### 1.7.2 隐私、自主权与控制


    对隐私的担忧使许多人怀疑物联网等大数据基础设施在本质上是否与隐私不兼容。水、运输和能源领域数字化程度提高的主要挑战涉及隐私，这需要研究人员和政策制定者做出充分的回。


    美国公民自由联盟（`ACLU`）对物联网削弱人们对自身生活的控制权表示担忧。美国公民自由联盟表示：“我们无法预测这些力量——不成比例地集中在追求财务利益的企业和渴望更多控制权的政府手中——将如何被使用。事实大数据和物联网将让我们更难控制自己的生活，因为我们在强大的公司和机构面前变得越来越透明，而它们对我们却变得越来越不透明。”随着物联网使用的增加，它们从我们这里收集的隐私信息也将之增加。关于我们的外貌、身份、财务能力和生活空间的数据将更多地被物联网设备获取，并对我们自己的隐私构成重大风险。迟早，随着物联网实施的推进，解决此类问题将成为不可避免的需求。


    ### 1.7.3 安全性


    安全是物联网技术采用面临的最大威胁之一。人们担心正在发生的快速开发和实施并未给予适当或足够的关注来应对安全挑战以及可能必要的监管变化。


    许多安全担忧与传统工作站、服务器和手机遇到的问题相似。薄弱的身份验证过程、未更改默认凭据、设备间传输未加密数据以及对安全更新处理不当都是此类问题的示例。此外，许多物联网设备没有可用的计算能力，导致这些设备无法直接使用基本的安全措施，如安装防火墙或使用强加密系统对设备间传输的数据进行加密；许多设备的低价格和面向市场的定位使得设备上实施强大的安全系统变得更加罕见。

