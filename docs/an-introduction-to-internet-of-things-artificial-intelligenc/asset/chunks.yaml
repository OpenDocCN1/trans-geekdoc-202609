    Other important performance considerations are computational speed and efficiency.
    To attain the most of software quality, the trade-off between computational efficiency
    and maintainability holds very large factors of consideration.


    ## 3.4 Methodologies of Machine Learning


    When training machine learning models, there are four primary learning methodologies
    that are used. These include supervised learning, unsupervised learning, semi-supervised
    learning, and reinforcement learning.


    ### 3.4.1 Supervised Learning


    Training data is used with the aim to learn the model’s parameters from the given
    data and labels. These data and labels are all known. During testing, the model
    uses these learned parameters to predict the label of novel data.


    In supervised learning, the dataset is the collection of labelled examples. N
    refers to the number of samples available. Each element 𝐱𝑖 , among N is called
    a feature vector. A feature vector is a vector where each specific dimensions
    𝐱𝑖 contains values describing the example. This feeds information on the features
    of the set of data. The label 𝑦𝑖 can either be an element belonging to a finite
    set of classes or a real number.


    Classification is often used here via a prediction of discrete valued output.
    Regression is also frequently used via continuous valued output .


    ### 3.4.2 Unsupervised Learning


    In unsupervised learning, the dataset is a collection of unlabelled examples.
    Similarly, x is a feature vector, and the goal of an unsupervised learning algorithm
    is to create a model that takes a feature vector x as input. This input is then
    either transformed into another vector or a value that can be used to solve a
    practical problem.


    We do not feed the classes to the training model in this case. This allows the
    machine to sort out the differences in the data through grouping and clustering
    by discovering the underlying structures of the data. Pictorial summaries are
    often used to showcase the output of the model.


    ### 3.4.3 Semi-supervised Learning


    As the name suggests, this form of learning is a mixture of both supervised and
    unsupervised learning. Both labelled and unlabelled data are inputted for the
    learning model to proceed. Usually there will be a significantly larger amount
    of unlabelled data. Classifications that are given from supervised learning pair
    with the ability to gauge how data distributes through identifying features. Through
    research it has been found that this form of learning with a small number of labelled
    data has caused the learning model to be more accurate


    ### 3.4.4 Reinforcement Learning


    Reinforcement learning involves the machine interacting with the environment through
    stage changes. A policy is a function that takes the feature vector of a state
    as input and outputs an optimal action to execute in that state. The action is
    optimal if it maximizes the expected average reward.


    ## 3.5 Data Management


    There are many forms of data cleaning for different forms of data to improve the
    quality of data. These forms of data manipulation are essential for improving
    the accuracy of models, allowing us to achieve better efficiency and overall performance.


    ### 3.5.1 Data Wrangling


    Data wrangling is the process of transforming and mapping data from one "raw"
    data form into (another format to make it more appropriate for downstream analytics.
    Data wrangling cannot be blindly executed, we must know the need for wrangling.


    Examples of data wrangling include scaling to a range, feature clipping, z-score
    standardization and one-hot encoding.


    ### 3.5.2 Data Cleaning


    Data cleaning detects corrupt and inaccurate records from a dataset, table or
    database and either corrects or removes said data. Data cleaning can help effectively
    deal with missing data and imputation.


    ### 3.5.3 Data Integrity


    Data integrity maintains the assurance of accurate and consistent data over its
    entire life-cycle. This is crucial to designing and applying any system that collates,
    processes or stores data. These are normally in 2 forms of physical and logical
    integrity.


    ## 3.6 Online Applications of Machine Learning


    Machine Learning processes have already been extensively adopted and utilized
    online, where large amounts of data are crunched in order to optimize the output
    of online processes.


    ### 3.6.1 Search Engines


    While it may not appear obvious to some, some of the most important features that
    we take for granted in this day and age online are powered by machine learning.
    One of the most important uses of this technology could be found in the form of
    search engines, such as Google, Yahoo or Bing. Search engines are expected to
    parse the meaning of the millions of searches and bring the most relevant of sources
    to the forefront of the results page. If the search engine is unable to understand
    the queries sent its way by the user, it would not be able to begin searching
    for the appropriate webpages to send the user’s way. This is where Machine Learning
    comes into the picture.


    Users are human, and as such, make mistakes when conducting a search query, including
    errors such as spelling errors and hence search engines cannot assume that users
    will spell correctly all the time. In fact, many use search engines as a way to
    find the correct spelling of words they only vaguely remember the letters of.
    In order for Search Engines to be able to identify the words that users are trying
    to enter reliably, machine learning is used to be able to identify what users
    are trying to enter even if they made some kind of spelling mistake.


    Furthermore, users will rarely search the exact wordings of the content found
    in websites, and hence search engines will have to approximate the meanings of
    the words and their synonyms and work out the most relevant web pages to show
    in the results. Ambiguous searches would have to be identified by the search engine
    as well, such as when a user searches “Titanium”, the search engine would have
    to show results pertaining to the chemical element and the song so as to ensure
    that the user finds the result that they want regardless of which meaning they
    meant. This too, is machine learning at work.


    Another more recent example of machine learning on search engines would be that
    of Image searching, where users would upload an image, on sites such as Google
    Image Search, and receive information on the image, and other similar images etc.
    Machine learning is used here to find the characteristics of the image uploaded
    and scan through millions of other images in the database and return images with
    features that are similar, such as composition, colours, subject matter etc.


    ### 3.6.2 Advertisements


    Another component of the net that makes ample usage of machine learning would
    be that of advertisements. Modern advertisements allow for better targeting of
    desired audiences and increased quality and suitability of advertisements shown
    to potential customers. Being on social media sites such as Facebook and Instagram,
    or general websites such as Google, advertisements are now better able to target
    audiences by showing them advertisements that the user may be more inclined to
    be interested in. Machine learning is used to match users based on their web activity,
    such as what queries they have entered recently into a search engine, to products
    that may be relevant to the user’s demographics. Machine learning is used to maximise
    the quality of the user profiling and hence advertisement matching.


    ### 3.6.3 Social Media'
