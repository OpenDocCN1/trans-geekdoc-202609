    ## 2.4 Challenges


    AI undoubtedly has significant impacts on our lives in more ways than one. Changes
    to the economy by AI directly affect our livelihoods too. Many fear their replacement
    by AIs as these systems are more productive and efficient. However, to achieve
    strong computing outputs of AI, supercomputers are needed to achieve breakthroughs.
    Multitude of programmes and processors are needed to operate complex and hefty
    tasks and these, unfortunately, do not come cheap. Moreover, even with a higher
    influx of data, organizations find difficulties utilizing these new and larger
    forms of data, having more subsequent costs with more upgrades. With this problem
    of having sufficient costs, many also predict that the evolution of AI will bring
    about more severe class divides due to the affordability of such novel systems.


    AI can only determine outcomes based on the information it is given. Meaning,
    it cannot discern biases based on information that is given to it. If the information
    that is used for learning is biased, the AI programmes will cause biases due to
    this error and thus one must be wary of the learning processes the AI is given
    to prevent such a problem from occurring.


    As mentioned above, the AI effect has also been one of the challenges on recognizing
    the use of AI in our daily lives. Many have high expectations for AI but there
    is only so much it is able to do as it is nevertheless limited by the programmes
    instilled by us humans. 


    1.  **Machine Learning**


    Machine learning is a subfield of computer science that is concerned with building
    algorithms which rely on a collection of examples of some phenomenon. These examples
    could come from nature, handcrafted by humans or could also be generated by other
    forms of algorithms. It is often deemed to be a subset of artificial intelligence.
    In general, Machine Learning systems are trained with a specific set of data used
    specifically for training and programming of the system. Afterwards, the system
    is capable of performing tasks that have not been directly coded to do. This makes
    Machine Learning broad in its ways of use. The computer programme operates based
    on its “experiences” towards a certain task and its performance on the task improves
    with more “experience”.


    Machine Learning has the main task of making inferences through inductive reasoning.
    They are to reach probable conclusions with the lack of necessary information,
    causing uncertainty in their found conclusions. This is essentially what goes
    on in real life, whereby data that is needed is unavailable or unknown. Thus,
    formal probability and statistics are utilized to achieve the needed output.


    ## 3.1 Parametric Machine Learning Models


    A parametric model is a learning model that summarizes data with a set of parameters
    that are fixed in size. Regardless of the amount of data that is given to the
    parametric model, the model will not change the number of parameters it needs.
    The algorithms involve having to select a form for the function followed by learning
    the coefficients for the function from its given training data.


    This holds advantages as this is a fast and simple system that requires very little
    data. However, its disadvantages hold that strong assumptions have to be made
    and it is not made to do complicated tasks. There could also be a problem with
    underfitting of model, this is when the trained model cannot predict targets given
    in the training set. This occurs as the model needs to be more complex or because
    the features need to be more informative.


    ## 3.2 Non-Parametric Machine Learning


    Non-parametric machine learning algorithms are algorithms that do not make strong
    assumptions about the form of the mapping function. This is extremely useful when
    there is a lot of data available with a lack of prior knowledge. This reduces
    the hassle of having to choose the right features for the model.


    Its advantages lie in its flexibility of use and high levels of performance. However,
    a more complex system would definitely need more time and a model with more features
    would require more data. There may also be issues with overfitting, this is when
    the model predicts training data well but predicts new test data poorly. Regularization
    or simpler models have to be used in this case.


