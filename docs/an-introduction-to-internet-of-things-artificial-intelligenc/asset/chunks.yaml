- raw: 'These networks are utilised through Machine Learning and intelligent control,
    a form of control for AI computing programmes. The neocortex, which aids in the
    cognitive functions of real neural networks, is imitated with hierarchical temporal
    memories. Usually, neural networks are programmed with a backpropagation algorithm,
    the converse of a set of techniques known as automatic differentiation.


    ### 2.2.6 Deep Learning


    Deep learning utilizes convolutional neural networks (CNN), a form of ANN, to
    operate multiple important AI software such as speech and facial recognition,
    modelling elaborate dynamic systems.


    RNNs closely use deep learning programmes to hasten the learning processes in
    sequential problems. The long short-term memory (LSTM), which is primed by Connectionist
    Temporal Classification (CTC), is another form of deep learning RNN and is very
    commonly used.


    LSTM with CNNs have profuse complex programme implementations, one being image
    captioning. In the US, some banks utilize CNN to process written checks and, together
    with GPUs, are able to visually recognize patterns and sequences.


    Google voice used LSTM to function different forms of language processing and
    modelling. This is now widely available for the general market to use on their
    mobile devices and has been performing extremely well since it has been released.


    ## 2.3 Applications of Artificial Intelligence


    AIs are able to do any applicable cognitive tasks that it has been programmed
    to do. It is a common phenomenon that by the time AI programmes are released for
    the general market, it is no longer deemed to be AI. This is the AI effect, where
    many argue that the AI does not have the intellectual capability to think and
    rather follows what it has been computed to do. However, we need to remember that
    the simple act of learning, be it supervised or unsupervised, is in essence being
    able to think and holds the capacity for intellectual outputs.


    A popular example for successful AI application is AlphaGo, an AI programme where
    CNN is paired with Reinforced Learning (RL) and was able to take down international
    Go champions. Although frowned upon, AI is also able to manufacture Deepfakes,
    a programme that is able to create falsified media content. This programme is
    often abused to slander politicians and celebrities of like.


    ### 2.3.1 Agriculture


    AI has made agriculture more efficient, productive and safe. AI identifies patterns
    through crop yielding and runs multiple simulations, recognizing the prerequisites
    needed for highest crop yield etc. It predicts the timelines of crop yielding
    based on the area''s environmental factors. AI also surveys the current environment
    of crops, making sense of different output numbers to ensure that crops meet required
    safety standards or its most ideal yielding. AI also uses automation for harvesting
    and maintenance of crops to maximise productivity in actuality. AI is also used
    to predict safe genetic modifications that could possibly be done to improve crop
    standards, contributing to global food security.


    ### 2.3.2 Computer Science and Programming


    AI has been used very prevalently in computer science for its computing capabilities
    and most AI engines that have been constructed and released to the general market
    have gone through the AI effect. Such examples include interactive interpreters
    and graphical user interfaces. AI has significantly shortened the need for lengthy
    programming and provides user friendly interfaces that are easily accessible for
    the general market.


    AI can also program other AIs. In an attempt to improve current ANN topology,
    NASNet, a form of neural architecture search, was created to surpass current systems
    that are available. NASNet was successful in outdoing present systems available
    on ImageNet.


    ### 2.3.3 Cybersecurity


    In a significantly digitized world, cybersecurity is necessary to keep us and
