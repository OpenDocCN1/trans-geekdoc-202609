    ### 2.2.6 深度学习


    深度学习利用卷积神经网络（`CNN`）——一种 `ANN` 形式——来运行诸如语音识别和面部识别等多个重要的 AI 软件，对复杂的动态系统进行建模。


    `RNNs` 紧密利用深度学习程序来加速序列问题中的学习过程。长短期记忆（`LSTM`）通过连接器时间分类（`CTC`）进行预处理，是另一种非常常用的深度学习
    `RNN`。


    `LSTM` 结合 `CNNs` 拥有许多复杂的程序实现，其中之一就是图像描述。在美国，一些银行利用 `CNN` 处理手写支票，并结合 `GPUs` 能够从视觉上识别模式和序列。


    Google 语音使用 `LSTM` 来实现不同形式的语言处理和建模。这现在已广泛面向普通市场并在移动设备上使用，自发布以来一直表现出色。


    ## 2.3 人工智能的应用


    AI 能够执行其被设定执行的任何适用认知任务。常见现象是，当 AI 程序发布到普通市场时，它就不再被视为 AI。这就是“AI 效应”，许多人认为 AI 并不具备思考的智力能力，而是遵循其被计算好要的操作。然而，我们需要记住，学习这一简单行为（无论是监督还是无监督）在本质上都是能够思考，并具有产生智力输出的能力。


    AI 应用成功的一个流行例子是 `AlphaGo`，这一个 AI 程序将 `CNN` 与强化学习（`RL`）结合，并能够击败国际围棋冠军。尽管受到反对，AI
    还能制造深度伪造（Deepfakes），即一种能够创建虚假媒体内容的程序。这种程序经常被滥用来诽毁政家和名人。


    ### 2.3.1 农业


    AI 使农业变得更加高效、高产且安全。AI 通过作物产量识别模式并运行多次模拟，识别实现最高作物产量所需的先决条件等。它根据区域的环境因素预测作物产量的时间表。AI
    还会调查作物的当前环境，解读不同的输出数据，以确保作物符合安全标准或达到理想产量。AI 还利用自动化技术进行作物的收割和维护，以最大限度地提高实际生产。AI
    也用于预测可能用于改进作物标准的安全基因改造，为全球粮食安全做出贡献。


    ### 2.3.2 计算机科学与编程


    AI 因其计算能力被极广泛应用于计算机科学，大多数已构建并向普通市场发布的 AI 引擎都经历了 AI 效应。此类示例包括交互式解释器和图形用户界面。AI 显著缩短了冗长编程的需求，并为普通市场提供了易于访问的用户友好界面。


    AI 还可以编写其他 AI。为了改进当前的 `ANN` 拓扑结构，创建了 `NASNet` —— 一种神经架构搜索（NAS），它用以超越现有的系统。`NASNet`
    成功地超越了 `ImageNet` 上现有的系统。


    ### 2.3.3 网络安全


    在高度数字化的世界中，网络安全对于保护我们和信息安全至关重要。企业和组织受到包括恶意软件在内的黑客攻击影响，可能会损失数十亿美元。安全公司将 AI 和自然语言处理（`NLP`）结合使用，通过将拥有的信息分为不同的风险级别，从而对可能摧毁企业的机和关键数据进行严密保护。


    ### 2.3.4 金融


    银行长期以来使用 AI 进行欺诈检测，因为 `ANN` 程序能够突出异常情况。银行还将 AI 用于其日常运营、记账、物业管理和股票投资，因为它可以随时待命，并根据其算法对不同情况做出恰当反应。


    金融机构的多个投资组合完全由 AI 系统运行，并已被证明极其高效。


    通过算法交易，AI 能够以远超人类能力的速度进行交易。它有潜力通过高频交易独立赚取数百万美元。AI 能够做出明智的决策，或为用户提供做出正确判断所需的信息。它能够使用
    `NLP` 筛选社交媒体动态和国际新闻广播等不同的在线来源，并确定不同公司的信誉和状态。`SQREEM`（序列量子还原与提取模型）是一个 AI 领域，用于银行整合调查客户数据并推荐合适的财富管理服务。


    这些分析还通过运行信用风险模型来帮助金融承保，以确定客户的违约概率。在评估客户信用评分时使用了多个观测结果和特征，这些因素通过 AI 系统纳入考量，对所有类型的客户都非常有用，特别是那些缺乏足够信用记录的客户。


    财务报表的审计通过检查多个不同的数据集进行。通过具有更高信誉的 AI 控制程序降低了审计风险，同时缩短了时间。由于提供了高准确性且无误差率的持续审计，这增加了保证性。


    ### 2.3.5 国家安全


    社会安全领域的 AI 系统更多侧重于监管和监控。面部识别系统和 `NLPs` 与 AI 系统同时用于国内的大规模监控，标记潜在危险。


    武装分子在军事行动中也大量利用 AI。AI 有效地协助通信、情报收集和网络行动。自动车辆和无人机依赖 AI 执行一系列活动。这些活动包括检测和确认潜在威胁、目标获取以及网络化自动化之间的通信。


    ### 2.3.6 客户服务


    服务部门的 AI 经常用于替代重复性的通信工作。这些系统还用于提高通信效率，例如自动邮件处理和自动聊天机器人。


    自动 AI 客户服务提高了客户服务的效率和质量，因为它消除了消费者重复重复和常见查询的需求。通过 `NLP` 等程序，客户的语调和语言会被考虑在内，以提供恰当的
    AI 响应。自动客户服务处理不重要的服务的烦恼，让真正的客户服务代表能够处理复杂案例，显著提高了工作效率和质量。


    酒店还利用 AI 机器人提供招待服务。AI 系统能够预测客人的需求并减少员工的重复工作。AI 还通过进行常规检查简化了正常的酒店运营，并能通过提供机器人、虚拟助手以及收集客人对酒店标准的反馈来提供额外服务。这进一步提高了酒店员工处理客人更紧迫或更重要需求的效率和质量。


    ### 2.3.7 营销与广告


