- raw: 'Another use of Machine Learning is the algorithms that govern the pages of
    a social media site. Whether it is Twitter’s curated Timeline, Instagram’s Feed,
    Tumblr’s Dashboard or Youtube’s Recommended Videos, many features that users interact
    with on these sites that bring new and interesting content to the forefront of
    user attention uses Machine Learning. These sites use data that they know about
    its users as input and predicts what events, posts or content that its users will
    be interested in and presents them to the user in hopes of providing a more engaging
    experience while on these social sites. Without machine learning, modern sites
    will not be what they are today.


    ## 3.7 Financial Applications


    One of the more impactful ways Machine Learning is in use today is in the world
    of Finance and Economics. Machine Learning helps people decide when and where
    to move money, and has become an indispensable part of the toolset used by those
    in the sector.


    ### 3.7.1 Algorithmic Trading


    One way that Machine Learning is used today in the finance sector is in the form
    of Algorithmic trading. This refers to the use of algorithms to help traders make
    better decisions when trading with markets. Mathematical models are used by traders
    to monitor business ners and other trade activities in an attempt to detect factors
    and signs of change that are about to come that could cause prices of the goods
    that the trader is trading to rise or fall. The trader would be able to control
    their trading by entering preset parameters that may arise in a situation so that
    it would be able to automatically place traders without active input from the
    trader. Doing so brings about some benefits that a trader may not get if they
    did the trading themselves without the aid of algorithmic trading. Firstly, algorithmic
    trading models are able to process and evaluate large volumes of data at any one
    time to a greater amount of accuracy compared to a single human mind. They are
    also more nimble on the digital platform, able to process and manage thousands
    of trades a day, and are able to make fast trading decisions, giving the users
    an undeniable advantage when using machine learning tools to trade.


    Furthermore, algorithmic trading using machine learning does not make any trading
    decisions based on emotions, unlike its human counterparts that are very often
    tempted to do so; an affliction that is well known amongst the trade that clouds
    the judgement of many traders. This trading method, used by the likes of hedge
    fund managers and financial institutions, allows the trading activities to be
    automated and free from the fickle minds of emotionally vulnerable humans.


    ### 3.7.2 Fraud Detection and Prevention


    Another area where Machine learning is used is that of fraud detection and prevention.
    Fraud is a major problem for financial institutions and causes billions of dollars
    of losses every year. A large amount of data is kept digitally by finance companies,
    and the risk of security breaches are significant. With the increasing pace of
    technological advancement, fraud is now considered a high threat to valuable data.


    Fraud detection systems in the past were created with a set of rules in mind,
    which can now be bypassed by modern fraudsters with relative ease. Hence, most
    companies today employ machine learning to flag and combat fraudulent transactions
    by scanning through datasets and detecting abnormal activities and flag them for
    further investigation. By comparing a transaction against data that they possess,
    such as account history and IP address, the algorithm can determine if the transaction
    is potentially abnormal and block the transaction before further review can be
    taken.


    ## 3.7 Data Recognition and Translation Applications


    One innovative way machine learning is in use today is in that of Image, handwriting
    and speech recognition. From automated digitizing of documents, to real time translations
    and voice to text conversions, the ability for machine learning to take real world
    data and convert them into digital data is becoming more and more invaluable.


    As the world moves on to become more digitised, there is a need for more companies
    and corporations to transition to keeping records in a virtual space rather than
    a physical space. However, the process of transitioning is one that is lined with
    obstacles and errors when one has to manually enter the data into the digital
    world. In this regard, handwriting and image recognition technology, enabled by
    machine learning, can dramatically reduce the time taken and mistakes made when
    transcribing the large amounts of documents into a digital database.


    Along a similar vein, image translation, such as the likes of Google Image Translate
    and Yandex can perform translation services by looking at images of foreign text
    and translating and overlaying the result on top of the image. This advance in
    translation technologies reduces the need for an intermediary translator when
    translating real life texts as users may not be able to manually enter a foreign
    text when it is written in an unfamiliar script, such as Cyrillic, Chinese, Japanese,
    Hindi or Arabic for a speaker that is only well versed in the Latin script. Machine
    learning, in this case, would be what supports the image recognition technology,
    as well as the translation itself, as it searches its database and provides the
    closest match to the words to be translated.


    A speech translation system, such as Jibbigo, on the other hand, uses speech recognition,
    machine translation and voice synthesis technologies to translate in real time.
    A user would be able to say something in their mother language, when it will be
    taken apart by the application so that the words that are spoken can be determined.
    A machine translation then occurs and enters the translated words into an algorithm
    that pulls speech sounds from its database and finally delivers the translated
    words in the second language with the speech sounds.


    ## 3.8 Medical Applications


    Another area where there is increasing use of machine learning is in the medical
    sector. One such application is in the identification of disease and ailment diagnosis,
    such as in cancer identification and treatment. In 2016, IBM Watson Health unveiled
    IBM Watson Genomics, a collaboration with Quest Diagnostics which aims to achieve
    precision medicine by melding cognitive computing and genomic sequencing technologies.
    Another example would be that of Boston-based biopharma company Berg, which is
    using machine learning technologies to research and develop diagnostic and therapeutic
    treatments in areas such as detection and management of prostate cancer.


    Similarly, Oxford’s P1vital® Predicting Response to Depression Treatment (PReDicT)
    project is using machine learning and predictive analytics to diagnose patients
    and provide treatments to them, with an overarching vision of producing a ready-to-purchase
    emotional test battery to be used in clinics.


    There has also been usage of machine learning in the realm of preliminary drug
    discovery and testing, such as in initial screenings of drug compounds to predict
    success rates. The MIT Clinical Learning Group is one such user, using machine
    learning algorithms to aid in their precision medicine research to better understand
    disease processes for treatment for diseases like Type 2 diabetes.


    ## 3.9 Future of Machine Learning'
