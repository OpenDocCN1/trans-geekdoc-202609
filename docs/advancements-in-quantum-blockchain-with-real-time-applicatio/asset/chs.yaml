  \n\n\n\n\n\n\n\n\n\n\n### 使命\n\n面对当今组织拥有的海量信息，需要用于收集、分析和存储数据的各种方法和工具。IGI Global\
  \ 的《数据挖掘与数据库管理进展》(ADMDM) 系列旨在将信息检索、数据分析、数据仓库方面的研究整合起来，为研究这些领域的专业人士、软件工程师和学者提供理想的资源。\n\
