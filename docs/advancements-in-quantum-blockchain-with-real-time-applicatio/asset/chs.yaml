  \ 是第 `j` 分片的优化因子，而 `E` 和 `F` 是参与给定分片的平均值。\n\n- 选择值为 `Mathtype978-1-6684-5072-7.ch004.m10](i/ch004.m10.svg)`\
  \ 的分片进行合并，该值小于公式 10 中定义的方差。如果没有分片遵循给定阈值，则当前分片不与其他分片合并，而是单独管理：![Mathtype978-1-6684-5072-7.ch004.m11](img/ch004.m11.svg)\
  \ (10)\n\n由于此过程，执行有效的分片合并与管理。一旦激活分片层，将自动创建并管理最优分片。所有这些模块连接在一起以实现有效存储。该网络的性能将在下一节中观察，其中延迟、吞吐量和攻击检测将与现有算法对比。\n\
  \n## 数据采集与结果分析\n\n为了评估所提 BLTSAS 的 QoS 和安全性，对分片系统进行了测试。用户数量从 10 变到 150，向系统注入了以下攻击：\n\
  - 女巫攻击 (Sybil attack)\n- 中间攻击 (MITM)\n- 冒充攻击 (Masquerading attack)\n\n由于多点分片检查和底层区块链的不可变性，分片网络能够检测到所有攻击。因此，系统对于已知攻击以及可能的未知攻击都具有很高的安全性。完成这些安全性检查后，通过改变存储签名数量（从\
  \ 10 到 50），比较了端到端延迟、能量消耗、数据包交付率和抖动等 QoS 参数。基于此，为 10 个用户向分片添加多个区块的延迟如表 2 所示；该表比较了不同非分片模型的延迟，有助于评估所提侧链解决方案的优越性。\n\
