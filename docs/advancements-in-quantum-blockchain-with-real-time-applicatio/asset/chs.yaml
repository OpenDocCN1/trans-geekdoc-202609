  \n[content]\n\n## 参考文献\n\n## 8 章节\n\n### 摘要\n\n区块链和量子计算技术的突破目前在各种论坛中被广泛讨论。受益于这些技术，可以提供透明、冗余、安全且负责任的环境。为了满足计算安全的需求，可以使用某些加密原语和协议。量子证明、安全量子解决方案和抗量子系统将对任何系统进行量子攻击评估并创建一个安全的量子计算系统。因此，这项工作鼓励不同领域的专家提供集成技术的解决方案，以提供成本效益且高质量的服务，并快速、安全地满足需求。\n\
  \n### 引言\n\n\n\n\n\n区块链量子更关注安全性。例如，`Shor's` 方法的脆弱性使得 `RSA` 公钥加密成为应用中一项重要的过渡技术（LaPierre,\
  \ 2021）。对于想要学习如何通过接口来构建、测试、操作、部署和维护下一代系统的读者和从业者来说，这本书是一个极佳的资源。安全的密码学专业知识与创新。最终，本章可能为\
  \ IT 专业人员提供实用的指南，帮助他们理解技术转型以及在此转型期间量子计算的重要性（Grover, 1996）。未来的应用可能会从量子计算、配置、设计和通信接口等新兴技术的极大受益。如果使用了这些环境，计算世界中有足够的安全位来保护网络免受量子攻击（Hilal\
  \ et al., 2022; Sarmah, 2019）。使用 `semi-DIQIP` 等协议，可以通过自动识别系统部分并创建信任网络来增强安全网络的安全性。不过，量子计算和量子研究不仅在软件方面有用。作为一种展示量子技术的方式，企业可以利用量子内存和量子继器等设备来展示其实力。例如，在远距离量子通信方面，单个量子继器就可以帮助降低成本并提高安全性。目前最新且流行的技术之一是量子计算。自量子力学出现任何实际应用以来已经过去了近世纪，但现在是几乎任何组织开始研究它的完美时机。根据研究，1979\
  \ 年的一些研究人员指出了 20 世纪 70 年代末和 80 年代初量子计算机的理论基础。建议可以建立量子计算机（Arulprakash & Jebakumar,\
  \ 2022; L. Wang & Wang, 2022）。\n\n`Quantum Gate Model` 是许多声称正在研究量子计算机的企业提供的首选答案，包括\
  \ `IBM`。`Google`、`Microsoft` 以及许多其他公司正在研究这类设备。使用量子计算机解决所有实用问题是极危险的。通用基础设施中既会有经典计算机也有量子计算机，其中量子计算机具有重大的性能限制。使用\
  \ `Grover's` 或 `Shor's` 等量子算法可以显著更快地解决某些问题（Berman et al., 2005; Fluhrer, 2017）。以前未解决的问题现在将得到及时处理。由于最近的发展，学术界和工业界的许多研究人员都对量子计算产生了兴趣。由于量子计算机的发展（它们之前无法提供与区块链技术同水平的安全），该技术开始进步。智能合约可以被破解，最终，所有技术将完全停止工作。\n\
  \n| 图 1. 密码系统工作原理模型 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch008.f01](img/ch008.f01.png)\
  \ |\n\n即使是简单的计算机也可以解决用于保护区块链的最复杂的数学问题。加密货币受公钥加密的保护。量子计算机可能对加密业务构成威胁，由于公钥加密破解，某些资金已损失了数十亿美元。如果加密被破解，数字对象的所有者可能会被伪造。如果量子计算变得足够强大，任何安全承诺都将失效。量子计算机需要数千个\
  \ `qubits` 来解密数据，而现代计算机只需要数百个比特（Xu et al., 2022; S. Zhang & Lee, 2020）。连续比特可用于此目的，允许比现在能访问的更长的统计。希望量子计算机能够在更广泛的规模上达到相似的速度。显而的是的是这对计算机和信息科学的广泛领域有着影响，这些系统依赖于计算的难度来正常运行。如果加速大幅增加，可能会发生系统故障。具体来说，这对于在比较两个函数所需的计算成本上使用不对性的密码系统是真实的。大质数可以快速相乘，但将大合数合并为两个质数极其困难，这使得\
  \ `RSA` 加密变得缓慢。拥有 `hash function` 是重要的，因为它易于计算但难以反转。为了建立近乎唯一的指纹，它们选择一个哈希值并寻找该哈希值的图像（Barua\
  \ et al., 2020; Khanchi et al., 2021）。\n\n## 区块链背景与算法\n\n作者对区块链相关的数据结构和算法感兴趣。创建区块链的主要目标是解决数字货币的双重花费问题。通过核心组件实现了一个安全且可验证的开放去中心化账本。为了防止重写链或拒绝服务攻击，增加了一项工作需求（Saini\
  \ et al., 2021）。\n\n1. 区块链上进行的每笔交易都有记录。存储在公共服务器上，任何人都可以访问。\n2. 每个区块有四个基本元素：\n  \
  \  - a) 哈希值，\n    - b) 数据区块，\n    - c) nonce。nonce 只用于构建新区块。\n    - d) 区块哈希。\n\n\
  当前一个区块的哈希代码包含在后续区块中时，它确保了前一个区块的完整性。修改最早的区块将引入哈希的不一致，且包含数据的哈希在不中断整个区块序列的情况下无法更改。生成新区块并在哈希中添加\
  \ nonce 需要大量的努力（Lakhwani et al. 2020）。\n\n## 量子计算算法\n\n理解两种基本算法对于理解区块链在量子计算机和量子增强攻击下的运行方式至关重要。`Shor's\
  \ algo` 和 `Grover's algo`。通过算法搜索寻找黑盒函数的单个输入比暴力搜索快得多。使用以下方法，通过普通数域筛（最著名的因式分解方法）进行整数分解可以呈指数级加速，该方法也适用于隐藏子群和离散对数的情况（Hiran,\
  \ 2021; Vyas et al., 2021）。一些已知的非对称加密（如公钥加密和数字签名）容易受到这些困难。这对量子算法对区块链实施构成了严重威胁。\n\
  \n## Grover 算法\n\n\n\n\n区块链依赖加密哈希来保护自身，免受之前的区块被修改。链的离散特性以及重新计算区块链所需的计算工作使其能够抵抗长期的修改。哈希函数的逆转\
  \ `Grover, 1996)`（注：此处原文链接显示为 #978-1-6684-5072-7.ch008.xhtml#r13)）。\n\n## Shor 算法\n\
  \n广义数域筛选法（计算数字最高效算法）的复杂度与 `Shor's approach` 相比是超多项式的，但小于指数级（在输入长度上，比指数级更短）。使用经典计算破解\
  \ 096 位 RSA 密钥几乎是不可能的，但使用量子计算是可行的。因此，任何基于 `RSA` 或类似技术的区块链实现部分都可能受到量子计算的攻击。对于 `Shor's\
  \ algorithm`，分解由两个大素数相积的复杂算术数字是实现这一目标的第一步。另一方面，因数分解是更大未知领域的子集。对于 `Shor's algorithm`，分解由两个大素数相积的巨大合数是实现这一目标的第一步\
  \ `Grover, 1996; Monz et al., 2016)`。所有这些问题都可以通过修改 `Shor's algorithm` 来解决，该算法是更通用的隐藏子群问题的特殊例。因此，由于离散对数问题，`ElGamal\
  \ 加密`、基于数字签名的认证系统、`Diffie-Helman 密钥交换`以及椭圆曲线等加密技术不再可行。\n\n经济确定性。除了使用 `Grover's technique`\
  \ 建立哈希碰撞或反转函数外，`Shor algorithm` 显示量子计算机容易受到其他攻击 `Berman et al., 2005; Budd et al.,\
  \ 2020; Shor, 1999)`。\n\n## 完全碰撞：通过 Grover 进行算法攻击\n\n如果可以在区块内容中添加微小数据并使给定的哈希与区块内容匹配，就可以实现哈希值的完全碰撞。通常情况下，解决这个问题是非常困难的。通常认为，源材料将通过暴力搜索进行，直到找到与已知哈希匹配的项，这可能包含足够的额外位以耗尽哈希空间。这对于最优哈希需要与哈希空间大小成正比的时间投资\
  \ `Almohammadi et al., 2017; Mehul Mahrishi et al., 2020)`。然而，通过利用哈希机制中的已知缺陷可以缩短这种时间。在这种标准攻击的情况下，我们可以假设执行时间为\
  \ `O(n)`。得益于 `Grover's O(n)` 时间技术，预计标准的碰撞搜索算法可以获得 `O(n)` 的加速。结果是即使在链中插入了修改过的区块，区块链的完整性也可以得到保护。这大约是使用暴力搜索找到哈希碰撞所需时间的一半。由于这种攻击只是相对较快，因此增加哈希长度可能是一个选项。然而，使用更长哈希函数计算零的计算工作往往会限制链的能力并可能导致区块链无法运行（见下文）。安全社区认为，攻击者拥有量子计算而防御者仅有经典处理能力的非对称攻击是最坏的情况。由于当双方都具有相同的计算机能力时，生成哈希函数和反转哈希函数的时间平衡应该保持不变，因此这种情况稍微好一点。其推论是，谁先开发出量子计算能力谁将拥有优势，但仅到防御者获得该能力为止。在这个阶段，我们预计系统要么运行，要么无法修复\
  \ `Standard, 2017; Grover, 1996)`。\n\n## 挖矿时间：Grover 算法\n\n当我们检查区块链时，另一个问题出现了。Nonce\
  \ 计算是我们正在做的。重放攻击：`Grover's approach` 加速了 nonce 生成，显著提高了速度。在区块生成中，基于量子计算机的方法可以超越对手。结果是加密货币的挖掘变得更快，允许用户更多。如果这段历史被更快取代，没有什么能阻止区块链的重建，加密社区可以达成一致的标准\
  \ `Chen, 2021; López-Incera et al., 2020)`。\n\n## 抗量子加密\n\n量子计算的发展对我们的密码学产生深远影响。NSA\
  \ 的信息保障局（IAD）估计，加密系统需要 20 年才能达到功能，且它们的设计寿命将至少持续 30 年。何时何时开发出大规模量子计算机是一个谜，但许多专家认为它们将在上述时间范围内完成\
  \ `Hiran, Doshi, et al., 2014; Tyagi et al., 2020; Wireko, J. K., Hiran, K. K.,\
  \ & Doshi, 2018)`。因此，“抗量子”加密方法的开发已被列为政府的首要任务。在（经典）密码学的理论框架内，针对抗量子加密（也称为后量子加密）存在量子计算机攻击的性\
  \ `Mohamed, 2020; L. J. Wang et al., 2021)`。\n\n\n\n\n# 使用哈希表的函数\n\n为了确保万无，尽管对抗量子密码学的需求不断增加，我们仍对构建完全整合区块链技术的结构时，哪些方面可能是关键的做出一些广为人知的备注。哈希功能是首要考虑的因素。正如前述节所示，`Grover's\
  \ set of criteria` 在比较哈希能力方面比经典方法提供了二次加速。对于安全应用，可以通过简单地增加计算中使用的比特数来恢复首选的计算复杂度，而不是使用像\
  \ `Shor's set of rules` 那样的指数级加速。由于该规则集的二次加速特性，可以使用的最大比特数为两个。如前所述，哈希通过两种方式保护区块链。反转哈希或寻找碰撞位置在计算上是具有挑战性的，这就是为什么第一大策略依赖于这一事实才能运行。随着时间的推移，寻找具有相同哈希值的唯一数据块变得变得越来越困难。`Grover`\
  \ 没有使用经典算法，而是使用一组原理来计算哈希区域的大小。如果保护需要正向问题阶段，那么与考虑最有效经典算法的相当需求相比，抗量子偏好需要两倍的哈希时间（Lily\
  \ Chen, Stephen Jordan, Yi-Kai Liu, Dustin Moody, 2016; Shor, 1999）。\n\n签名区块是哈希函数用于区块链安全的第二种方法。其中一种方法是找到一个所有区块主位都为零的\
  \ `nonce`（随机数一次）。这在计算上是具有挑战性的，因为在计算哈希特征的部分碰撞时，情况是一样的。换句话说，这个问题正是签名本应要求的“绘画证明（proof\
  \ of paintings）”。为了确保最低水平的“工作量证明”，可以增加哈希时间，就像可以增加签名时间以确保针对量子攻击的最低安全水平一样（Fernandez-Carames\
  \ & Fraga-Lamas, 2020; Grover, 1996）。结果是，使用可以发出统计块的传统设备，每增加一个比特，所需的艺术作品在计算上就会困难一倍，或者花费两倍的时间。因此，任何使用基于哈希的签名并防御量子设备欺骗攻击的区块链系统都可能与执行所需的设备要求不兼容（Hiran,\
  \ Frempong, et al., 2014）。\n\n## 针对区块链哈希函数之外机制的后量子密码学\n\n除了上述基于区块链技术的哈希方面外，量子威胁对区块链本身之外各种因素的威胁很可能会引起极大关注。如果要在传播区块链账本，可能需要加密技术。甚至可能需要各种协议来定义哪些实体被扩展区块链，例如在任何可能使用身份验证或数字签名的地方。在许多此类场景中，现代广泛使用的加密技术通常不足以防御量子计算的可能性。如前所述，许多现代加密算法的安全性建立在数学难题问题的基础之上（Easwaran\
  \ et al., 2022; Hiran et al., 2012）。涉及数字签名时，`Digital Signature Algorithm` (`DSA`)\
  \ 是标准选择，因为它依赖于离散数，而 `Elliptic Curve Digital Signature Algorithm` (`ECDSA`) 是一个很有前景的\
  \ `DSA` 变体，也是椭曲线密码学的示例。这三种算法都基于计算离散数的困难（`ECC`）。强大的量子计算机可以轻松解决 `Shor's set of rules`\
  \ 中的因数分解、离散数和 `ECC` 问题。NIST 尚未定义抗量子密码标准，尽管已经有一些可以同时抵御经典和量子攻击的密码系统的潜在想法（H. Zhang\
  \ et al., 2019; S. Zhang & Lee, 2020）。\n\n| 图 2. 使用加密哈希函数构建区块链 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch008.f02](img/ch008.f02.png)\
  \ |\n| --- |\n| 来源：比特币白书 |\n\n以下是几个最有前景的领域：\n\n*   仅依赖哈希的加密使用。`Merkle's hash-tree\
  \ public-key signature system` (1979) 是经典示例，它基于 Lamport 和 Diffie 的单消息签名概念。\n*  \
  \ 基于代码的密码学：`McEliece's public-key encryption scheme with buried Goppa-code` 是经典示例（1978）。\n\
  *   在密码学中，格被用作基础。`Hoffstein–Pipher–Silverman “NTRU” 公钥加密系统` 受了最多的关注，尽管它已不再是主要的实例（1998）。\n\
  *   基于多元二次方程的密码学。由 `Pin` 和 `Imai` 开发的 `Hidden Field Equations`（无变体）（1996）公钥签名系统是许多实例中的之一（Trichni\
  \ et al., 2022; Xu et al., 2022）。\n\n| 图 3. 后量子密码学 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch008.f03](img/ch008.f03.png)\
  \ |\n| --- |\n\n## 基于量子理论的密码学\n\n未来的加密结构还可以利用量子函数，这些函数已经在新时代被使用。对于量子攻击，量子密码学优于后量子密码学，后者完全依赖于传统技术和现有技术。换句话说，量子密码学是量子数据技术的一部分，这意味着量子结果在创建过程中可以开发出基本上新颖密码学方法。`Quantum\
  \ key distribution` (`QKD`) 是目前出现的最先进且成熟的量子密码学时代。使用 QKD 协议可以在事件之间生成随机比特流（P. Wang\
  \ et al., 2022; P. Zhang, 2022）。一旦随机消息连接，将使用 `OTP` 或 `Vernam-cipher` 来加密机密消息。我们不需要复杂的数学程序来保护这种分配共享密钥的方式；量子物理学是我们的唯一基础。由于\
  \ `海森堡不确定性原理`，`量子不可克隆定理`断言人类量子垃圾制品无法在不引入可检测缺陷的情况下被克隆，任何窃听者都将无法脱法（Niemi, 2021; Wireko\
  \ et al., 2021）。\n\n\n\n\n\n量子信息技术在 `QKD` 领域已达到巅峰。此类安排已用于私营和公有部门，通过商业公司促进发射器和接收器的应用。个人网络（例如暗纤）由于无法重复或路由，目前是当前唯一可行的方案。目前对\
  \ `QKD` 广泛应用的局限性对其实用性造成了严厉的限制，但这个时代正在飞速发展，因此在不不久的将来将变得显著扩大。`QKD` 是目前研究的许多概念之一，具有对基于区块链的系统产生重大影响的潜力。例如，量子流可以同时编码和传输数据（而不仅仅是通过量子通道分发密钥）。作为替代方案，还有“量子比特币”，它利用量子密码学在传统区块链上进行矿矿和区块确认。某些协议可以编码并存储数据，并免受量子账本的篡改。作为虚拟签名系统的替代，还有量子比特承诺协议。看到这些想法中的一些变为现实令人鼓舞，但现实情况是，大多数技术的实现难度与量子计算本身一样困难\
  \ (Berman et al., 2005; Mosteanu & Faccia, 2021)。\n\n## 区块链的威胁\n\n我们在量子计算环境下面临着区块链承诺失效的两个特征。人们认为哈希反转是一个具有计算挑战性的操作。如果量子计算机极大地简化了验证上游区块链有效性的过程，区块链条目的完整性就会受到破坏。`Grover's\
  \ approach` 能够找到函数值的原像，其执行速度可能比传统的暴力搜索快得多，后者通过产生每个输出并比较它们来隔离生成的输入。区块链可以通过两种不同的方法使用\
  \ `Grover's algorithm` 进行攻击。首先，使用这种算法可以进行哈希碰撞检测。它可以被用于替换现有区块，同时保持区块链的完整性 (English\
  \ et al., 2016; Fingerhuth et al., 2018)。其次，它可以加速随机数（nonces）的生成，可能导致整个记录链可以使用一致的修改后哈希进行快速重建，从而削弱链的完整性。为了在难以反转的函数下发现给定值的原像，这种方法在两种场景中都被采用。对于在区块链上实现公钥或私钥密码学，参与者之间的信息传输和数字签名可能会被量子计算机破坏。\n\
  \n## 量子区块链的方法\n\n## 基于量子计算的网络\n\n在每个节点中都存储了区块链。与传统区块链类似，此阶段的目标是去中心化添加有效区块。构建量子区块链网络的问题在于它可能存在不实节点，且生成的区块可能来源不可靠。新生成的区块是空间贝尔态，因此将此转移到相关的时性上需要更多研究。`-protocol`\
  \ 可用于量子网络以验证从不可信源生成的区块。更重要的是，这是通过其他网络节点（其中一些可能是不实实的）以去中心化的方式实现的。首先是一个量子随机数生成器。用于随机选择验证节点的数字生成器。然后，不可信源泄露一个可能是合法区块的\
  \ `n-qubit state`。每个量子比特由不可信源提供给每个节点 `j` 用于验证。现在 `j: j` 是倍数，验证节点创建 `0` 和 `j` 的随机角度。验证者是分发角度的节点之一。Quantum\
  \ Blockchain, 2018)\n\n## 量子增强型区块链概述\n\n实际上，量子账本 (`QB`) 是通过其他网络实现的。通过将传统的共识协议切换为量子共识协议，并在区块链中引入量子保护，`QB`\
  \ 变得更加安全。为了提高区块链的效率，开发了新的量子共识协议 (`QBA`)，并将量子安全和量子认证整合到 `QLB` 语法中。\n\n## 区块链的关键特征\n\
  \n- 使用去中心化的共识机制来验证交易并确保信息的真实性。\n- 数据以区块序列的形式存储，使得新信息是不可篡改的。\n- 每个信息区块都引用其前一个区块。\n\
  - 数据存储在多个位置。Quantum Blockchain\n- 通过去中心化存储提供更强的接受和保护。\n- 参与者信息的真实性。这有助于反欺诈、证明产品的来源以及追踪供应链中的缺陷。\n\
  - 降低复杂性并提高可靠性，因为去中心化存储的使用减少了服务器故障导致信息无法访问的可能性。\n\n## 区块链领域与行业\n\n区块链在金融服务领域有广泛的应用。最常见的应用包括：\n\
  \n- 支付与汇款：跨境账单通常通过清算公司进行中介，因此会导致多个层面的中间费用、操作复杂性和交易方风险。相比之下，区块链允许直接的点对点交易，减少了对中间机构的需求。\n\
  - 信贷与贷款：智能合约的使用提供了使贷款更安全并节省成本的能力。区块链技术还用于通过众筹和其他方式提高资金，这无疑会影响传统和新的金融中介。例子包括基于区块链的代币和首次代币发行\
  \ (Sarmah, 2019)。\n- 交易与结算：区块链技术的使用可以实现近实时清算和结算，减少了与重复数据和延迟相关的风险。\n\n\n\n\n\n##\
  \ 合规性\n- **合规性**：区块链技术可以专门用于应对货币报告和合规性问题。区块链能够以透明、流化的方式记录游戏者和操作，并符合监管要求。\n- **资产管理**：该领域有几个用例实例，包括针对资金分配价格链的任务以及智能合约代理的改进。除了金融领域外，区块链代表了广泛商业领域迈出的可能一步，引入了新的技术理念，包括去中间化和性能收益，这些将是这些行业的关键。这项技术（七四项）始于加密货币的概念，包括比特币（S.\
  \ Nakamoto, 2016）。\n\n## 量子计算在未来的可能应用\n\n- **优化**：许多优化问题试图寻找全局最小因子解决方案。通过使用量子退火，可以比使用超级计算机更早地解决优化问题。\n\
  \n- **机器学习 / 大数据**：研究人员的机器学习和深度学习正在寻找新的方法来训练和观察海量数据集的模型。为了加速训练和测试过程，可以利用量子计算。\n\n\
  - **仿真**：仿真是预测潜在错误和采取应对措施的有效工具。可以使用量子计算模拟复杂系统。\n\n- **材料科学**：原子结构复杂相互作用的计算限制了化学和纺织技术。新的量子解决方案有望加速重现这些相互作用的过程（English\
  \ et al., 2016）。\n\n## 结论\n\n总而言之，作者描述了区块链策略以及量子策略。阐述了区块链如何随着改进应用到不同部门中。一种基于信息论安全的认证的区块链协议，主要基于一个社区，该社区中的每对节点都通过\
  \ `QKD` 链路连接。我们通过一个三节点生日光纤社区 `QKD` 实验性地检查了我们的协议。除了使用 `QKD` 进行身份验证外，它还重新定义了包含新区块的方法，这种方法与现代加密货币截然不同。我们没有关注在个人矿工的范围内改进后续区块，而是指定了一种信息论安全的广播协议，所有节点都以相同的条件对一个新区块达成共识。我们区块链协议的一个重要优势是其能够抵抗量子算法攻击，保持交易的透明性和完整性。因此，我们的结果为理解可扩展的量子安全区块链结构提供了机会。如果实现，任何此类区块链平台都可以限制金融和社会风险接近量子计算技术的突破。目前有的\
  \ `QKD` 技术典型关键技术费用足以运行基于我们协议的大规模区块链结构。此外，量子通信在思想和实践方面的巨大发展，例如目前对地地量子 `QKD` 和量子中继器的实验，可能会为建立全球\
  \ `QKD` 社区（“量子互联网”）以及将量子安全区块链结构扩大到全球规模打开大。“量子互联网”的发展将允许我们的协议保持每个社区成员的匿名性。成员可能从任何基站访问全球\
  \ `QKD` 社区，使用其私有种子密钥（见方法）对不同事件进行身份验证并执行首选交易。量子和区块链范将在许多领域带来改进。\n\n## 参考文献\n\nAlmohammadi,\
