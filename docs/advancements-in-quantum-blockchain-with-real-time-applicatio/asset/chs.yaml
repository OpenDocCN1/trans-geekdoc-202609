  \n# 作者简介\n\n### Kamal Kant Hiran\nKamal Kant Hiran 在亚洲、非洲、欧洲和北美拥有超过 17 年的学术和研究经验。他曾在\
  \ BPB Publications、IGI Global、来自印度、德国、美国、英国的 De Gruyter 等知名出版机构出版过 15 本国际畅销书籍。他的著作《云计算：通过真实世界的示例和案例研究掌握概念、架构和应用》在印度和海外市场广受欢迎，并荣获新兴技术趋势类书籍畅销奖。他对我们社会的技术转型做出了重大贡献。他拥有多项荣誉，如参加在波兰华沙举行的\
  \ IEEE 第 8 区委员会会议的国际旅行资助；来自德国帕绍的 ITS Europe 的德国国际旅行资助；埃塞俄比亚贡达尔大学颁发的的最佳研究论文奖；IEEE\
  \ 利比利亚亚分会创始人奖；MTech（荣誉学位）金奖；IEEE 加纳分会奖（技术与专业活动主席）以及 IEEE 高级会员认可、最佳 IEEE 学生分会奖、Elsevier\
  \ 评审认可奖。他在 SCI/Scopus/Web of Science 和 IEEE Transactions 期刊、会议上发表了 45 篇科学论文，拥有 2\
  \ 项印度专利和 1 项澳大利亚专利。为了研究交流，他曾多次访问丹麦、瑞典、德国、挪威、加纳、利比利亚、埃塞俄比亚、俄罗斯、迪拜、墨西哥和约旦。他的研究兴趣重点是云计算、机器学习深度学习和智能物联网（IoT）。他的研究工作受到了全球多个媒体和知名机构的赞誉，包括\
  \ ITS Europe、IEEE USA、Springer、Rajasthan Patrika 和 Danik Bhaskar。\n\n### Ruchi Doshi\n\
  Ruchi Doshi 在亚洲、欧洲和非洲拥有超过 16 年的学术、研究和软件开发经验。目前，她是墨西哥阿斯特卡大学（Azteca University）的研究导师和副教授，以及印度拉贾斯坦\
  \ Jyoti Vidyapeeth 女学院（Jyoti Vidyapeeth Women’s University）的兼任教授。她曾任职于利比利亚的 BlueCrest\
  \ 大学、加纳的 BlueCrest 大学、印度的阿米大学（Amity University）以及印度的 Trimax IT 基础设施和服务公司。她对机器学习和云计算框架开发领域感兴趣。\n\
  \n\n\n\n\n# 教师成员简介\n\n## Manish Dadhich\nManish Dadhich 拥有拉贾斯坦大学经济、金融与管理学院（EAFM）商科博士学位、商硕士、UGC-NET（商学）、MBA-FM、UGC-NET（管理）、RPSC-SET（管理）。他在各学院、大学和企业部门拥有\
  \ 12 年以上的教学经验，是学术界、工业、企业咨询和研究的稀缺结合。他目前担任乌达布普尔 Sir Padampat Singhania 大学管理学院的助理教授。他在声誉卓著的国际和国内期刊上发表了\
  \ 62 多篇研究论文，其中 18 篇发表于 Scopus/SCI/IEEE/WoS。他还在国家和国际会议上发表了 52 多篇研究论文。他是 IEEE、Springer\
  \ 和 Elsevier 等各类国际期刊和会议的评审员、顾问和编辑委员会成员。他曾获得国家研讨会最佳研究论文两项金奖。他编写了一本教材和一本编著。他是教师发展计划（FDP）、研究研讨会、迎新培训和进修课程讲座的常驻受邀嘉宾。他还获得了一个澳大利亚专利。此外，他的主要研究重点是金融、银行、AI-ML、计量经济学和统计学。\n\
  \n## Ritesh Kumar Jain\nRitesh Kumar Jain 在印度拉贾斯坦邦乌达布普的 Geetanjali 技术学院（GITS）担任助理教授。他拥有\
  \ 16 年以上的教学和研究经验。他完成了本科（BE）和硕士（MTech）。他曾担任乌达布普 S. S. 工程学院的助理教授兼系主任；锡卡尔 Sobhasaria\
  \ 工程学院的助理教授以及比尔瓦技术与管理学院的讲师。他是国际同行评审期刊的评审员。他在同行评审的国际期刊和会议上发表了多篇研究论文。\n\n## Sarika\
  \ Khandelwal\nSarika Khandelwal 目前担任纳格普尔 G H Raisoni 工程学院计算机科学系（CSE）的副教授。她拥有 21\
  \ 年以上的教学经验。她的兴趣领域包括生物识别模板安全。\n\n## Jacob Mensah\nJacob Mensah 拥有能源与自然资源大学的计算机科学学士（BSc）和哲学硕士（MPhil）。他是能源与自然资源大学计算机科学与信息系的高级研究助理。他在加纳苏亚尼的能源与自然资源大学获得计算机科学学士学位和哲学硕士学位。他的研究兴趣包括机器学习、数据分析和量子计算。\n\
  \n## Maad M. Mijwil\nMaad M. Mijwil 是一位伊拉克学者；于 1987 年出生于伊拉克巴格达。他于 2009 年从伊拉克巴格达经济科学大学获得软件工程学士士学位。他于\
  \ 2015 年从伊拉克巴格达大学计算机科学系获得无线传感器网络领域的硕士（M.Sc.）学位。目前，他在伊拉克巴格达经济科学大学计算机技术工程系担任讲师和学术教职人员。他在教学和指导本科项目方面拥有十多年的经验。他发表了\
  \ 80 多部著作，包括论文/章节（在国家/国际会议和期刊上发表了 39 篇同行评审论文）、预印本、演讲和海报。他还是 10 多份国际/国内期刊的编辑以及 70\
  \ 多份国际/国内期刊的评审员。他曾担任许多知名会议的技术计划委员会成员。此外，他还作为同行评审员毕业于 Publons 学院。他的 Google 引用量超过\
  \ 200 次。他的研究兴趣包括人工智能、机器学习、深度学习、无线传感器网络和遗传算法。\n\n## Peter Nimbe\nPeter Nimbe 是加纳能源与自然资源大学（UENR）计算机科学与信息系的讲师。他的专长是量子计算和信息安全。他是一位量子研究人员。他是\
  \ IEEE 量子社区、IEEE 传感器协会、IEEE 协会技术委员会以及 IEEE Collaborate 的成员。他还属于以下组织：斯坦福计算协会、加纳 ICT\
  \ 专业人士协会（IIPGH）、Python Ghana、欧洲创新联盟（EAI）、国际计算机科学与工程协会（ICSES）、工程师与医生协会（IRED）、加纳科学协会（GSA）、加纳教师协会（UTAG）、国际工程师协会（IAENG）以及国际计算机科学与技术协会（IACSIT）。\n\
  \n## Prantosh Kumar Paul\nPrantosh Kumar Paul 是西孟拉邦赖甘甘大学（Raiganj University）的执行总监（研究生项目）及信息技术系（IST）助理教授，并担任计算机与信息科学系主任兼协调员，是一位信息科学家。他拥有印度顶尖且历史最悠老的工程学院——西比普尔理工学院（IIEST）的\
  \ IST 博士学位，IST 研究硕士（M.Tech.）、信息保障领域的 IST 研究硕士、双硕士（M.Sc.）以及信息系统管理管理硕士（MBA）。他还是 IST\
  \ 基金会的首席执行官和副主席。可以说，他是少数几个在信息科学几乎所有维度拥有研究生学历的印度信息科学专业人士，涵盖了计算机科学、管理科学、信息科学和信息技术。他支持开展并专攻具有社交商业属性的新兴\
  \ IT 和计算学科。他还是跨学科硕士（MSc）课程的设计大师，即 `MSc-计算机与信息科学`，该课程基于信息-技术-人的交互原理。他在不同领域编写了 25\
  \ 多部著作和编著书籍，并专注于新兴和跨学科信息科学。此外，他有 200 多篇关于信息科学中云计算应用、绿色计算或信息领域中的绿色 IT、电子学校方面/可用性工程/信息科学教育等的研究/政策论文。他是新德里\
  \ `IJASE` 的主编辑，《IRA 国际管理与社会科学期刊》主编辑以及新德里 `IJISC` 的主编辑。他还担任 130 多份各类国内外期刊的编辑委员会成员。他曾在\
  \ SRM 大学、西西姆大学、VIT 大学、斯里尼瓦大学、芒格罗尔大学、TCG Digital 和 CloudNet India 完成多次受邀演讲。他拥有作为技术委员会（TPC）、顾问委员会、演讲者和组织机构成员参与\
  \ 200 多场国际会议的记录。他的奖项中，重要的包括信息科学最佳研究员奖（来自特里 `IARA`）、`IARA` 最佳教师奖、计算机与信息科学 David Clark\
  \ Blair 青年科学家奖（来自印度 `BSS`）、健康信息学国际青年科学家奖（来自 `ISROSET`）、引用奖（来自`斯里赛大学`）、亚洲优秀信息科学与计算学术专家（来自\
  \ `IRDP`）、亚洲信息科学与技术大使奖、2020 社会信息与数字社会智库奖等。\n\n\n\n\n\n## Omega John Unogwu\n\nOmega\
  \ John Unogwu 拥有尼日利亚阿哈马杜·贝贝洛大学（扎利亚）地理学与教育学学士学位；并分别在尼日利亚国家开放大学和加纳阿克拉的锡姆马尼尔大学获得研究生学位和科学硕士学位。他目前正在墨西哥阿特卡大学（Universidad\
  \ Azteca）攻读计算机科学博士学位。\n\n他是一位首席科学家，在尼日利亚国家空间研究与开发机构的地学测量与地球动力学中心拥有超过 13 年的空间科学与技术研究经验，对计算（人工智能、区块链、物联网和机器学习）、干涉合成孔径雷达（InSAR）以及全球全球导航卫星系统（GNSS）有着浓厚兴趣。他是\
  \ IEEE、NAG、尼日利亚计算机学会的成员，并参加过各类国家和国际会议及研讨会。\n\n## Benjamin Asubam Weyori\n\nBenjamin\
  \ Asubam Weyori 分别于 2016 年和 2011 年在位于加纳的夸梅·恩克鲁玛科学技术大学（KNUST）获得计算机工程博士和哲学硕士学位。他于\
  \ 2006 年在加纳塔马莱的开发研究大学（UDS）获得计算机科学学士学位。\n\n他是一位高级讲师，目前担任远程教育与在线学习中心代理主任。他曾任加纳能源与自然资源大学（UENR）计算机科学与信息系代理主任。他的主要研究兴趣包括人工智能、计算机视觉（图像处理）、机器学习和\
