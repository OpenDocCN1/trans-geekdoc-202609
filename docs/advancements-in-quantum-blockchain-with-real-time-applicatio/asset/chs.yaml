  \nQueiroz, M. M., & Wamba, S. F. (2019). 供应链中区块链采纳的挑战。\n\n## 关键术语与定义\n\n-   **区块链应用**：区块链的应用正在日益增长，适用于金融行业服务、教育研究、医疗保健、政府行政、旅游和住宿等多个领域。\n\
  \n-   **区块链技术**：区块链是一种加密的分布式数据库，用于交易、合同，并依赖于独立记录。区块链是一种数字账本，使用特定的位置来存储数据。区块链加强了数字货币如比特币的金融活动。\n\
  \n-   **金融工程**：是一个跨学科工程领域，专注于金融系统、应用程序、机器和自动化系统的设计与管理。\n\n-   **NFT**：是一种加密代币，负责开发不可复制的区块链系统的推广。艺术品和现实世界的房地产等问题可以进行管理和显著发展。\n\
  \n-   **量子**：是指通常具有多种形式能量的最小颗粒，是可以被细分的。因此，量子是指量化的物理量，如磁矩。\n\n-   **量子区块链**：利用量子计算机的原理来实现安全的管理；传统的区块链用于收集记录，并按照时间顺序进行连接。在这里，区块的记录基本上是使用相互纠缠的光子进行编码的。\n\
  \n\n\n\n量子技术：量子技术正在不断改进，其应用日益广泛。在量子领域，量子力学、量子计算和量子信息学被认为非常有价值。\n\n## 第 4 章\n\n*\
  \   **Sarika Khandelwal**\n    ![Orcid Imagehttps://orcid.org/0000-0003-3336-820X](https://orcid.org/0000-0003-3336-820X)]\n\
  \    印度纳格普尔，G. H. Raisoni 工程学院\n*   **Shalen Bhatnagar**\n    印度，Presidency 大学\n\
  *   **Nirmal Mungale**\n    印度纳格普尔，G. H. Raisoni 工程学院\n*   **Ritesh Kumar Jain**\n\
  \    印度，Geetanjali 技术学院\n\n### 摘要\n\n生物识别模板必须通过具有可追溯性、不可变性和高信任能力来确保安全。研究人员提出了多种系统模型，其中大多数利用区块链或机器学习来提高安全性和服务质量（QoS）。本文采用轻量级增量学习框架设计了增强分片模型，有助于分片的形成和管理。所提模型的性能评估表明，该模型能够实现高精度的攻击缓解，同时具有较低的区块挖掘延迟和高吞吐量。与各种先进方法相比，该性能在延迟方面改进了\
  \ 10%，在吞吐量方面改进了 14%。此外，针对女巫攻击、伪装攻击和中间人（MITM）攻击的检测准确率达到了 99.3%。本文进一步建议了可以深入研究的领域，以增强所提模型的安全性和\
  \ QoS 性能。\n\n### 引言\n\n保护生物识别签名的安全是一项多领域任务，涉及密码分析、隐私保护、可追溯性集成、信号处理、分类等。为了设计一个高效的安全生物识别签名处理系统，需要大量的系统能力。这包括但不限于数据安全、防篡改性、高速可追溯性、低计算复杂度以及降低的功率需求。此类模型的示例如图\
  \ 1 所示，其中可以观察到模板注册、身份声明和异常处理等过程。该模型利用用户输入来采集指纹、面部数据等生物识别信息，并提供这些信息用于质量评估和特征提取。提取的特征被存储在模板数据库中，数据库连接到系统管理员以便管理。系统管理员与模板匹配模块之间的连接通过应用程序接口（`API`）层实现。该层将数据暴露给各种第三方，这些第三方可能容易受到间谍、欺骗或篡改攻击。因此，需要在系统与任何入站和出站连接之间集成一个安全层。因此，用户数据采集连接、系统管理员连接、应用程序连接以及任何其他连接必须使用高性能安全层进行保护，以提供高速的数据读写能力。\n\
  \n为了设计这种安全层，研究人员多年来提出了各种密码、密钥交换、隐私保护和机器学习方法。本文的下一节将了对这些方法的概述，其中讨论了各种细微差别、优势、局限性和未来问题。\n\
  \n| 图 1. 使用使用生物识别的身份验证模型 |\n| :--- |\n| ![Figure978-1-6684-5072-7.ch004.f01](img/ch004.f01.png)\
  \ |\n| --- |\n\n基于此讨论，在区块链挖掘期间发现，每个区块都需要扫描以评估唯一的且基于规则的哈希值。随着链长度的增加，这会导致大量的延迟，降低了系统的可扩展性。为了提高可扩展性，使用了机器学习模型，旨在减少存储过程中的冗余计算，从而提高存储和检索效率。由于内部构建，某些模型在区块链方面的能力有限。其他接口模型没有提供显著的性能，因为长长度需要哈希验证。因此，本文的问题是在不同条件下保持高安全性和良好的可扩展性。为了解决这一问题，第\
  \ 3 节讨论了使用增强分片（`BLTS`）的所提生物识别的设计及其评估。该评估还包括与各种方法的比较。最后，本文对所提工作进行了总结，并建议了进一步提高其性能的方法。\n\
  \n## 文献综述\n\n生物识别安全开发了多种系统模型，这些模型利用各种加密、哈希和数据修改来完成这项任务。例如，Toutara al.,2020; Sawant\
  \ al.,2020; Goel al.,2020; Mohatar al.,2019）中的工作提出了使用区块链、智能合约、队列排序和 Merkle 树进行生物识别验证和存储。这些模型为存储和验证生物识别数据提供初级安全框架，因此具有中等的安全性和\
  \ QoS 性能。可以通过 (Dinesh et al.,2021; Baqari al.,2020; Yazdinejad al.,2020; Shankar\
  \ et al.,2021; Jain et al.,2012)中的工作来提高性能，其中提出了哈希算法、区块链访问控制、高度分布式区块链模型和基于区块链的一次性密码（`OTP`）的影响。这些模型通过整合高安全加密和哈希方法，来改进生物识别系统的认证和存储性能。但由于部署了高复杂的密码系统，它们在\
  \ QoS 性能方面存在不足。低复杂度模型在（Waheed al.,2020; Mastronardi al.,2020; Goel al.,2019; Ibrahim\
  \ al.,2021; Khazanchi al.,2021)中提出了智能合约、射频识别（`RFID`）、低延迟卷积神经网络（`CNNs`）和基于集中同步的电子投票系统。这些系统利用低复杂度加密和集中处理模型为生物识别存储提供安全，虽然改进了\
  \ QoS，但给系统引入了安全漏洞。\n\n\n\n\n文献中提出的模型，生物识别系统的安全性可以通过使用基于区块链的模糊签名 (Naganuma et al.,2020;\
  \ Hiran et al., 2021)、基于区块链的自主主权身份 (Othman et al.,2018)、基于工作量证明（PoW）的区块链 (Sarkar\
  \ et al., 2019) 以及用于区块链验证的质数利用 (Iovane et al., 2019) 来提高。这些模型提供了高安全性，并且由于可扩展的区块链部署，还具有良好的服务质量（QoS）性能。\n\
  \n这种安全性还可以通过在 (Ali et al., 2019) 中提到的身份验证协议、几何中心的水平和垂直切分(Jangid et al.,2020)、基于权益证明（PoS）的区块链(Jaffer\
  \ et al.,2019)、基于权威证明（PoA） (Morano et al.,2020) 以及公钥加密的混合融合 (Iovane et al.,2020;\
  \ Tyagi et al.,2021)) 来进一步提高。这些模型通过预判攻击以及添加分类模型作为改进攻击期间模式分析的措施，有助于提高生物识别存储的安全性。\n\
  \n类似的模型也提于 (Alharthi et al., 2021; Xiang et al., 2020; Gulati et al., 2019; Liu\
  \ et al., 2019)，其中涉及隐私保护区块链生物识别、基于许可链的用户认证、基于身份的区块链以及基于身份的智能合约。这些模型通过减少区块形成和修改过程中的冗余，有助于提高生物识别存储的安全性和\
  \ Q 性能。观察到增加哈希大小可以降低哈希验证的复杂性，并本质上增加区块链的安全性。特定应用的存储模型定义在 (Hongqing et al.,2018; Bathen\
  \ et al.,2020; Madine et al.,2021; Wireko et al.,2028)，其中定义了工业数据存储、自动驾驶数据存储和跨应用电子健康记录（EMR）存储系统。这些模型的效率通过\
  \ (Acquah et al.,2020; Mandal et al.,2020) 进一步扩展，其中提出了分布式存储和用于物联网（IoT）的无证书签名解密算法。这些模型通过选择性加密和减少区块链形成期间证书交换的复杂性，有助于提高生物识别存储的\
  \ QoS。基于这些模型可以观察到，基于区块链的模型已成为存储生物识别数据的标准，并具有广泛的研究增强空间。下一节描述了其中一种系统模型，其中使用分片技术来提高生物识别数据的安全性和\
  \ QoS。\n\n# 使用增强分片技术的区块链驱动生物识别模板安全框架的设计\n\n所提出的基于区块链的生物识别模板安全方法使用了增强分片技术。它通过改进版本的联赛冠军算法（LCA）实现，该算法有助于分片的创建和维护。改进的\
  \ LCA 方法选择了最佳分片策略，以提供高安全性、低延迟和良好的吞吐量性能。该协议分为两部分，组合在一起形成最终系统：\n\n* ● 基于工作量证明（PoW）的区块链设计，用于生物识别扫描的安全存储。\n\
  * ● 通过跟踪生物识别扫描的变化来创建分片。\n* 利用生物识别扫描的变化进行分片管理和合并。\n\n分片管理和合并模型依赖于分片创建模型；因此，它们必须协同工作。详细描述如下：\n\
  \n## 基于工作量证明（PoW）的区块链设计，用于生物识别扫描的安全存储\n\n安全存储模型的设计必须提供可追溯性、高速检索和分布式计算能力。为了设计这种系统，本节提出了基于\
  \ PoW 共识的区块链模型。每个生物识别存储在 [#978-1-6684-5072-7.ch004.xhtml#r12) 的结构中。\n\n表 1. 存储设计\n\
  \n| 前哈希 | 生物识别类型 | 数据 |\n| :--- | :--- | :--- |\n\n为了存储生物识别，使用了以下步骤：\n* 将生物识别转换为\
  \ 1 维数组。\n* 将包括扫描大小在内的元数据附加到其前面。\n* 使用 256 位模式（SHA256），生成一个新的哈希值：\n\n```\nB[hash]\
  \ = SHA256(P[hash]| B[type]| T[s])\n```\n\n其中 `P[hash]`、`B[type]` 和 `T[s]` 分别代表前哈希、类型和时间戳。\n\
  * 如果此哈希已存在于链中，则生成一个新的随机数（nonce）。\n* 一旦生成唯一的哈希值，即可添加区块，此过程对每个新扫描重复。\n\n随着扫描数量的增加，哈希生成的复杂性也会增加。这导致添加区块所需的延迟增加，从而降低区块链的服务质量。为了改进这一点，将创建并管理分片。\n\
  \n## 通过跟踪生物识别扫描的变化创建分片\n\n分片创建是将底层区块链分为较小链的过程，其中每个链由处理单元独立管理。它使用了改进版本的 LCA，可以使用以下步骤说明：\n\
  \n## 输入参数：\n* `NG`（游戏数量）\n* `NL`（联赛数量）\n* `L[r]`（LCA 学习率）\n* `N[curr]`（当前分片数量）\n\
  * `D[mean]`（添加区块的平均延迟）\n* `L[min]`（分片长度）\n* `L[max]`（分片长度）\n\n* 将所有游戏初始化为“待变异”，并按照给定过程获取网络当前部署区块链解决方案的最佳分片长度：\n\
  * 对于每个游戏 1 到`NG`：\n    * 对于每个联赛 1 到`NL`：\n        * 如果当前联赛被标记为“不变异”，则跳到下一个联赛，否则处理该联赛。\n\
  \        * 使用公式 2 制定随机分片长度，并根据给定长度生成新分片：\n\n```\nlength = rand(L[min], L[max])\n\
  ```\n\n\n\n\n其中，`Bp`、`Bd` 和 `Bt` 分别代表单位时间内通过的生物识别特征数量、丢弃数量以及单位时间内添加的生物识别数据包总数。\n\
  \n- 使用公式 4 评估联盟适应度，\n  ![Mathtype978-1-6684-5072-7.ch004.m04](img/ch004.m04.svg)\
