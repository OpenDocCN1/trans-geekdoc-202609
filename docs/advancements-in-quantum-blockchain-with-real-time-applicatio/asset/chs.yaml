  \n随后进入硬币时代，现在制硬币具有巨大的差异。其主要的缺点是硬币随地区而异（`Kuperberg, 2020](#978-1-6684-5072-7.ch010.xhtml#r14)`）。\n\
  \n在公元 7 世纪出现了纸币时代，起源于中国帝国，目前控制着全球（`Sheikh, Patel & Sinhal, 2020](#978-1-6684-5072-7.ch010.xhtml#r21)`）。\n\
  \n最后，数字时代在 2009 年到来，向我们介绍了一种名为加密货币的新货币形式，它是基于区块链的安全的去中心化货币，其匿名性特征对目前的中心化系统构成了威胁（`Latifi,\
  \ Zhang & Cheng, 2019](#978-1-6684-5072-7.ch010.xhtml#r15)`）。\n\n最后，2014 年 5 月 3\
  \ 日，Kevin McCoy 创造了第一个 NFT，名为 Quantum，代表了技术的进步（`Malik, Dedeoglu, Kanhere & Jurdak,\
  \ 2019](#978-1-6684-5072-7.ch010.xhtml#r16)`）。2015 年，《Spells of Genesis》游戏的制作作者使用\
  \ Counterparty 成为发行区块链基础资产的首选（`Kothari, Patel & Sharma, 2021](#978-1-6684-5072-7.ch010.xhtml#r12)`）。\n\
  \n### 区块链\n\n### 一般定义\n\n*   区块链本质上是一个连接加密数据块的数据库，为数据提供了唯一的事实来源。\n*   数字资产是分散的，创建了资产的永久记录，而不是复制或移动。\n\
  *   资产是去中心化的，允许透明度和实时公共访问。\n*   更改的视觉记录保护了文件的合法性并增加了对资产的信心。\n\n区块链是几乎每个业务的完美选择，因为其内置的安全功能和公共账本。\n\
  \n### 区块链的关键要素\n\n分布式账本技术 (DLT)\n\n\n\n\n\n所有的网络参与者（节点）都能访问分布式账本及其不可篡改的交易记录（Salman,\
  \ Jain & Gupta, 2019）。这种共享账本通过对交易进行单一记录，消除了传统业务网络中常见的无谓重复。\n\n## 永久记录\n\n任何参与者都不允许在交易添加到共享账本后对其进行更改或修改。如果在交易记录中发现错误，应该创建一个新交易来修复它，并且两笔交易都必须保持可用（Somy\
  \ et. al., 2019）。\n\n## 智能合约\n\n区块链存储了一组被称为智能合约的指令，这些指令会自动执行以加速交易（Tasatanattakool\
  \ & Techapanupreeda, 2018）。智能合约可以建立公司债券转移的条件、旅行保险的付款条款以及许多其他内容（Menaria, Nagar &\
  \ Patel, 2020）。\n\n## 区块链如何工作\n\n区块链的工作流程非常简单易于理解。整个过程中最重要的一点是，用户（Thuraisingham,\
  \ 2020）、交易发起者以及交易接收方都拥有区块链钱包来存储数据。一种名为区块链钱包的软件使用户能够花费`BTC`、`ETH` 等其他加密货币（Putz &\
  \ Pernul, 2020）。此类钱包使用加密技术（私钥和公钥）进行保护，使用户能够监控并管理他们的交易。\n\n开始时，当用户在网络上发起交易时，会生成一个新区块来代表该交易（Wan,\
  \ Eyers & Zhang 2019）。区块创建后，交易将通过被称为`nodes`的对等计算机网络进行广播，这些节点最终会确认交易。\n\n交易确认后，它将与其他区块合并以形成新的区块。\n\
  \n## 优点\n\n- **安全**：作为开源账本，它消除了欺诈。在生成新的区块时，通过加密技术来确保数据的完整性（Wang, Li & Chen, 2020](#978-1-6684-5072-7.ch010.xhtml#r6)）。\n\
  - **无第三方干预**：区块链不需要任何机构控制。\n- **安全交易**：所有交易记录在账本上，且无法被篡改或修改（Wang, Li & Zhang, 2018）。\n\
  - **快速交易**：区块链技术允许在几分钟内完成。\n- **去中心化和匿名性**：区块链不需要任何机构。\n\n## 缺点\n\n- **更新困难**：当任何节点拒绝更改时，区块链应用可能会出现分叉。\n\
  - **开发困难**：为了实现共识并提高扩展性，这是非常复杂的（Yu, Shao & Guo, 2018](#978-1-6684-5072-7.ch010.xhtml#r29)）。\n\
  - **犯罪**：区块链技术也导致了犯罪率上升，因为它是匿名的（Choubisa, M., et al. 2022](#978-1-6684-5072-7.ch010.xhtml#r8)）。\n\
  - **高能耗**：区块链的缺点是耗能。维护实时账本需要能量，因为矿工试图寻找唯一的解决方案。\n\n## 区块链的应用\n\n- **国际支付**：这项技术最重要的应用是方便了无费用支付，并可以在几秒内完成。\n\
  - **安全物联网网络**：通过将密码和其他重要数据存储在分布式网络而不是中心化服务器上，可以获得更高的安全性（Hiran, K. K., & Doshi, R.\
  \ 2013](#978-1-6684-5072-7.ch010.xhtml#r5)）。\n- **数据存储**：区块链与数据存储系统结合时可能会增加安全性和完整性。数据可以保持去中心化，使其更难被黑客攻击和删除。此外，由于访问不受限于单一公司的运营，数据变得更容易获取。\n\
  \n医疗保健\n\n\n\n\n\n性别、年龄、身高和体重等基本细节是医疗数据的一些基础示例，这些数据非常适合区块链，基础医疗记录（如接种历史或生命体征）也是如此（Hiran,\
  \ K. K., & Doshi, R. 2013）。这些信息无法单独识别患者，因此可以存储在许多人可见的公共区块链上，而不会损害隐私。\n\n## 供应链管理\n\
  \n区块链账本的独特性使其非常适合产品在供应链中移动和移交过程中的实时产品追踪等任务。区块链的使用为出口这些商品的企业提供了许多机会。供应链的流程可以使用区块链上的记录进行组织，例如在货物到达港口后将其分配到不同的集装箱。区块链提供了一种新颖且灵活的方法来组织和监控数据。\n\
  \n## 区块链安全问题\n\n## 安全漏洞\n\n尽管区块链被誉为“不可破解的”，但大多数区块链转账的目的地安全性要低得多。例如，由于比特币交易或投资，大量的比特币可能会转移到一种被称为“热钱包”或虚拟储蓄账户的钱包中。这些钱包的安全性不可能像区块链的实际区块那样安全。\n\
  \n可以使用许多第三方服务提供商来支持区块链交易。示例包括支付处理器、`smart contract` 和`基于区块链的支付系统`。这些第三方区块链服务提供商的\
  \ get 网站和应用程序通常安全性较弱，导致它们容易受到攻击（Jain, R. K., 2012）。\n\n## 扩展性问题\n\n如今的区块链是迄今构建的规模最大的技术之一，其规模只会不断增长。这让专家们感到担忧，因为这些大规模的区块链尚未经过彻底检查。一些基本的担忧围绕着：随着快速生态系统的成熟，可能会识别出并利用更多的漏洞，或者支持这些区块链的技术基础将变得更容易受到常见威胁。\n\
  \n## 与监管相关的问题\n\n缺乏明确的立法标准为区块链安全带来了另一个挑战。区块链领域缺乏同质性，这使得开发者很难从过去的错误中吸取训。\n\n## 测试不充分\n\
  \n尽管区块链在历史上与比特币交易相关，但它已被应用于许多其他行业。问题在于，非加密货币应用程序的代码通常是实验性的且未经过测试的，这为黑客发现和利用漏洞留下了空间。\n\
  \n## 量子区块链\n\n正如答案就在问题之中是本质属性，关键在于我们必须重新构建问题并从结尾进行检查。\n\n同样，针对区块链的量子相关威胁可以通过利用量子技术来克服。由于量子计算机比传统计算机快百万倍，并且可以在几分之一钟内破解复杂的加密，密码学现在无法与量子计算竞争。因此，我们将转向`Quantum\
  \ Cryptography`作为一种解决方案。\n\n在量子密码学中，数据使用量子物理原理而非通用的数学加密技术进行加密，这从根本上是不可破解的。详细来说，广义的`Cryptography`是指使用数学公式对数据进行加密或扰乱明文的方法，使得只有具有适当“密钥”的预期方才能读取。根据定义，`quantum\
  \ cryptography`利用量子物理定律来加密数据和传输数据。\n\n## 数学加密与量子密码学的区别\n\n表 1 显示了两者之间的比较。\n\n| 数学加密\
  \ | 量子密码学 |\n| :--- | :--- |\n| 通常基于数学计算。 | 通常基于量子定律。 |\n| 它标记了数字签名的存在。 | 在这里不存在数字签名。\
  \ |\n| 比特率完全取决于计算能力。 | 平均比特率为一(1)。 |\n| 位存储是 2n，n 位字符串。 | 位存储是 n 位字符串。 |\n| 它具有独立的通信介质。\
  \ | 它具有依赖性的通信介质。 |\n| 被广泛使用。 | 非常复杂。 |\n| 总费用非常低。 | 总费用很高。 |\n\n## 量子密码学的工作原理\n\n\
  量子物理不确定性原理为量子密钥分发（该术语）提供了最早的基础。在 John 和 Smith 之间交换此密钥后，可以使用著名的加密程序交换额外信息，这些是 (Yu,\
  \ Lv, Shao, Guo, Zhang, 2018)。\n\n## 根据海森堡不确定性原理：BB84 及其变体\n\n使用偏振器通过单光子脉冲。John\
  \ 使用特定的偏振器对单光子脉冲进行偏振，并将二进制位编码到偏振器的输出（垂直、水平、圆形等）。Smith 可能会匹配 John 的情况，并通过接收光束和猜测偏振器来确定其估值的有效性。如果\
  \ Harold 试图解码，他的偏振器产生的偏振将在 Smith 和 John 的匹配实例中产生不一致，提醒他们有人窃听。在这种设置下，如果 Harold 试图窃听对话，John\
  \ 和 Smith 将收到警告。\n\n- 与原始的 `BB84` 四种偏振态不同，`B92` 协议只有两种。\n- `BB84` 使用的类似协议 `SSP`\
  \ 使用 6 个状态加密位。\n- 另一种使用衰减激光器的技术是 `SARG04`，它在多光子系统中性能优于 `BB84`。\n\n## 根据量子纠缠：E91\
  \ 及其变体\n\n每个粒子由 John 和 Smith 从发射一对纠缠光子的单源接收。对于发送的每一个粒子，John 和 Smith 将交换编码位和匹配情况，类似于\
  \ `BB84` 技术。然而，由于纠缠原理，在这种情况下，John 和 Smith 的匹配实例结果将完全相反。位字符串中的互补位将由他们任何一人进行解释。然后他们中的一人可以翻转位来产生密钥。这种测试可以证明没有窃听者，因为`贝尔不等式`对于纠缠粒子不成立。\n\
  \n- 纠缠粒子理论可以应用于 `SARG04` 和 `SSP` 模型。\n\n## 量子密码学失效点：\n\n`光子数分裂攻击 (PNS Attack)`\n\
  \n\n\n\n\n由于发送单个光子是不可能的，因此发送的是一个脉冲。哈罗可以从脉冲中收集一些光子，当约翰和史密匹配好他们的比特时，哈罗可能会使用与史密类似的偏振器获取未被发现的密钥（Gupta\
  \ & Patel, 2021; Khazanchi, D. et al 2021)）。\n\n## 伪状态攻击\n\n哈罗制作了史密光子探测器的副本，因此收集并传递了本打算给史密的光子。尽管哈罗知道这些编码比特，但史密认为他收到的比特是从约翰那里接收到的。\n\
  \n## 非同质代币 (NFT) \n\n### 非同质代币的可用性\n\n类似于区块链，NFT 提供了广泛的应用，但主要的用途领域将是：\n\n## 游戏\n\
  \n非同质代币通过提供“边玩边赚”的游戏模式，并允许玩家快速地访问他们独特的数字资产，正在稳定地改变游戏行业。\n\n截至今天，在线游戏运行在中心化服务器上，因此与他人共享游戏内资产有点复杂（Wan,\
  \ Eyers & Zhang 2019）。而在即将到来的如 Axie Infinity 等去中心化游戏中，共享游戏内资产将变得更容易，允许用户自由地玩。\n\n\
  NFT 游戏允许人们在玩游戏的同时赚钱，例如 CryptoKitties，它为加密收藏领域的繁荣开辟了道路，允许玩家将他们的猫交易为 NFT，其中卖出最昂贵的猫之一是创始人猫\
  \ #40（价值 104 万美元）。\n\n武器、皮肤、地图和配饰等游戏收藏物品被称为游戏相关 NFT。\n\n## 元宇宙\n\n元宇宙源自 1992 年的科幻小说《雪崩》，其元宇宙可以分为两个部分：“meta”意为超越，“verse”意为宇宙，因此合指的是超越宇宙的事物。\n\
  \n证明今天元宇宙的意义在于，它是一个无限制的世界，它是“虚拟与增强现实”相结合的 3D 虚拟世界，并扩展到“混合现实”。\n\nNFT 充当进入元宇宙的门户，促进了其内部身份、社区和社交体验的构建（Gupta\
  \ & Patel, 2021）。这些将有助于通过使用增强现实、参与和基于位置的功能，维护虚拟世界之外的互操作性。\n\n虚拟土地也可以在元宇宙中交易，正如 Decentraland\
  \ 所做的那样，允许任何人在元宇宙中购买土地。\n\nNFT 将有助于证明元宇宙艺术品的所有权。以列奥纳德·达·芬奇的画《蒙娜丽莎》为例，全球任何人都可以拥有复制品，但真品将仅由个人或组织拥有，而复制品的价值不会像真品那么。此外，NFT\
  \ 可以被视为元宇宙中的蒙娜丽莎，独特、无价且不可替代的。\n\n#### 其他用途领域\n\n*   **知识产权和专利**：传统的 IP 权利程序（如商标和版权）并不能让用户能够证明整个艺术品的所有权，但非同质代币可以。\n\
  *   **物流运营**：NFT 还可以帮助企业从生产到运输和交付跟踪其产品。客户可以看到他们支付的是什么，而且供应链机制也是透明的。\n*   **房地产行业**：房地产行业是准备好采用\
  \ NFT 的行业之一。NFT 还可用于房地产领域，通过简单地为房地产交易启用 `smart contract`（允许自动支付机制）来简化并加速交易。\n\n\n\
  \n\n\n现在心中产生了一个问题：既然我在这里是为了出售我的 NFT，那么我为什么需要持有加密货币呢？\n\n重要的考虑点是，交易平台会向创作者收取铸造代币费用，但铸造\
  \ NFT 的意义是什么？\n\n简单来说，铸造 NFT 可以定义为将艺术品从数字转换为 NFT，并将此内容永久地存储在以太坊区块链上，之后我们的艺术品将无法被更改或删除。\n\
  \n我们的 NFT 现在已经准备好在 NFT 交易平台上进行交易了。\n\n## 选择市场：\n\n既然你已经准备好了一切，现在的下一步是寻找一个合适的市场来铸造和拍卖\
  \ NFT（必须注意的是，过程可能会因平台而异，因为所有平台都有不同的遵循方法）。所有需要的就是上述描述的铸造程序。\n\n描述艺术品，例如它是关于什么的、它的独特之处、为什么要购买它等等。\n\
  \n## 发起拍卖\n\n最后一步是出售 NFT，它可以可以直接出售，也可以通过拍卖的方式出售，这些可以描述为：\n\n- **公开拍卖**：允许公众以尽可能高的价格竞价，直到你接受为止。\n\
  - **定时拍卖**：一种持续我们我们指定时间段的拍卖，例如一天、一周或更久。\n- **固定价格**：除了拍卖，你也可以为你的 NFT 设置一个固定价格。\n\
  \n## 利润与费用\n\n由于 NFT 是通过平台交易的，他们会针对 NFT 销售收取一些佣金（取决于平台），此外还有将加密货币从买方钱包转移到卖方钱包的交易费用，不用担心这些费用并不巨大。\n\
  \n一些交易 NFT 的知名市场有：\n\n- `OpenSea`\n- `Axie Marketplace`\n- `Larva Lab /CryptoPunks`\n\
  - `NBA Top Shot Marketplace`\n- `Rarible`\n- `SuperRare`\n- `KnownOrigin`\n\n| 图\
  \ 1. 市场交易量对比 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch010.f01](img/ch010.f01.png)\
  \ |\n| --- |\n\n## 购买非同质化代币的程序\n\n由于 NFT 与加密货币不同，无法直接用美元或欧元等法币购买，今天大多数 NFT 都是用以太坊交易的。\n\
  \n购买 NFT 的程序非常简单，包含以下步骤：\n\n1. 创建一个数字加密钱包来持有加密货币，如 `Exodus`、`Metamask` 或 `Trezor`。\n\
  2. 现在从你喜欢的货币交易所平台获取加密货币。\n3. 将钱包连接到你市场，如 `OpenSea`、`Rarible` 等。\n4. 最后选择你想要的 NFT\
  \ 并将其铸造。\n\nNFT 的流行程度决定了它的价格，NFT 越稀有越独特，价格越高，其中一些例子如 Ocean-Front（600 万美元）、Crossroad（660\
  \ 万美元）、The First 5,000 Days（6900 万美元）都是市场上最昂贵的已售 NFT。\n\n## 采用率增加\n\nNFT 在 2021-2022\
  \ 年间的流行度和销售额经历了爆发式增长，年初销售额超过了 25 亿美元。从 Google 趋势中明显可见。这种巨大的增长可以通过理解人类收集物品的行为来解释。显然，这个说法是正确的；让我们考虑小时候的一个例子：如果我们走到市场看到一个新东西，无论它是否有用，我们都渴望拥有它；我们想要它是因为喜爱它，而且第二天在学校里必须向大家炫耀它。同样，罗伯·道尼·朱的粉丝一定会想要拥有罗伯现在穿过的那件夹克，并准备支付任何金额来获得它。NFT\
  \ 的功能与之相似，它们的吸引力源于人性。\n\n| 图 2. 去年 NFT 流行度的上升 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch010.f02](img/ch010.f02.png)\
  \ |\n| --- |\n\n## 优点\n\n## 所有权\n能够证明所有权的能力是非同质化代币的核心优势。因为它们运行在区块链上，所以它们提供了所有权的证明。\n\
  \n## 真实性\n区块链的完整性确保了 NFT 不会被更改或删除。\n\n### 经济增长的机会\nNFT 允许艺术家直接与粉丝建立互动，消除了对昂贵代理的需要。\n\
  \n### 提高市场效率\nNFT 最而易见的优势是它们允许创作者与观众直接互动，从而提高市场效率。\n\n## 缺点\n\n### 流性差且转瞬即逝的资产\n\
  由于不成熟和波动性，NFT 行业缺乏流动性。NFT 并没有被广泛认可，没有太多的人感兴趣买卖它们。\n\n### 无法将实体艺术品数字化\n实体艺术和数字艺术往往是不同的。将任何现有的实体艺术品数字化是不可能的。\n\
  \n### 不环保\n构建区块链记录需要大量的计算能力，这需要消耗大量的电力。\n\n### 易被盗\n尽管是一种防黑客的技术，但 NFT 由于由于是数字产品且容易受到各种安全漏洞的影响，仍然可能被盗。\n\
  \n\n\n\n\n人工智能是计算机中最关键且不断演变的分支之一，在大多数领域已经超越了人类，包括医疗、驾驶、制造、烹饪等许多领域。文学和艺术曾被认为是人工智能不会发展的两个领域，因为它们无法具备人类的意识和想象力，然而，由于最近的发展，这些说法在不久的将来似乎是不成立的。`GPT3`\
  \ 和 `DALL-E` 是 OpenAI 开发的 AI 领域最大的进展。\n\n`GPT-3` 全名为生成式预训练 Transformer 3，是自然语言处理领域的一项进展，能够生成类人类语言、回答问题、撰写文章等。基本上，它是一个基于深度学习的自回归语言模型，运行在\
  \ 1750 亿参数上，并使用 `Common Crawl`、`WebText2`、`Books1`、`Books2`、`Wikipedia Corpus`数据集进行训练，准备挑战人类智能。\n\
  \n`DALL-E` 是一个文本到图像的处理系统，能够根据通用语言（以英语为佳）给出的文本命令生成图像。该模型运行在 120 亿自回归 Transformer\
  \ 参数（来自 `GPT3`）上，这些参数是在互联网上获取的 2.5 亿对图文组合上训练的。它使用 `zero-shot learning` 从描述生成输出，不需要额外的训练。\n\
  \n到目前，我们可以看到 AI 目前正应用于许多领域，包括聊天机器人、手术机器人等。同样，对于 `NFT`，预计 AI 也将用于生成它。因为今天 AI 创建的艺术品与传统艺术相比，正成为关注的焦点，如下图\
  \ 3 所示，这是 12 个月的记录数据。\n\n| 图 3. AI 与自然艺术的对比 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch010.f03](img/ch010.f03.png)\
  \ |\n| --- |\n\n这是因为在 AI 的帮助下可以很容易创建艺术，我们只需要提供想要的艺术命令即可，一些常用的流行的平台有：\n\n* • `Hotpot\
  \ AI`\n* • `Artbits AI` 以及其他\n\n### 碎片化 NFT\n\n由于 `NFT` 的普及日益增长，每个人都想持有他能获得的最棒的\
  \ `NFT`，但由于受欢迎度很高，著名的项目已经增长到高度，以 `Bored Ape Yacht Club` 和 `CryptoPunks` 为例，对于中产阶级的人来说由于价格高昂，购买是不可能的。\n\
  \n作为这种情况的解决方案，碎片化 NFT 的想法出现了。碎片 NFT 只是一个可以分成微小部分的令牌，允许许多人对相似的 `NFT` 声称所有权。`NFT`\
  \ 通过智能合约进行碎片化，创建与原始原始关联的若干数量令牌，使每个持有者对整个 `NFT` 拥有固定百分比的主权，而且这些现在可以在市场上进行交易。\n\n\
  你脑中可能会出现一个令人警觉的问题，既然 `NFT` 是不可分且以整体形式存在的，那么它是如何被碎片化的呢？答案很简单，在碎片化的整个过程中，原始 `NFT`\
  \ 并没有被切割并分发，而是有一套定义良好的标准程序来实现。\n\n正如我们所知，`ERC-721` 是创建 `NFT` 的标准，同样 `ERC-20` 用于创建同质代币，智能合约用于生成与不可分割的\
  \ `ERC-721` 关联的同质 `ERC-20` 代币，总份额由所有者定义。这些 `ERC-20` 代币的价格由其当前市场价格和创建的代币数量决定。这些代币现在是可以互换的；因此它们始终具有相同的价值并可以相互交换，且可以在市场上交易。\n\
  \n创建/购买碎片化 NFT 的一些流行的平台有：\n\n* • `Fractional.art`\n* • `Unic.ly`\n* • `Otis`\n*\
  \ • `NIFTEX`\n* • `NFT20`\n* • `NFTX`\n\n### 结语\n\n显而易见，价值因人而异。对于艺术家来说，这是一个向世界展示作品的极佳方式。随着元宇宙的普及，人们开始在其中土地并赚钱。为了让艺术爱好者在收藏中添加更多\
  \ `P2P` 数据共享，为了发现和记录事件，需要一个持久且防篡改的分布式网络。使这一切可能的革命是区块链和分布式账本技术。\n\n| 图 4. 交易频率/随时间\
  \ |\n| --- |\n| ![Figure978-1-6684-5072.7.ch010.f04](img/ch010.f04.png) |\n| ---\
  \ |\n\n## 结论\n\n作为一项技术，区块链正在增长，并有潜力突破所有限制，但正如权力越大责任越大，维护区块链是我们的首要责任，我们不能依赖有漏洞的系统，因此我们始终用强大的解决方案克服故障。\n\
