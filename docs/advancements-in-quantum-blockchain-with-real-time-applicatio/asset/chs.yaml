  \ [Aditya et al, 2021] | Grover 算法和 Shor 算法。 | 后加密的未来仍然是，在用户数量排名前十的区块链中尚未尚未承诺抗量子签名技术。\
  \ |\n\n## 结论与讨论\n\n根据 `Quarmby` 的说法，摩根大通银行已发布了关于量子密钥分发 (`QKD`) 是唯一在数学上证明可以抵御量子攻击的解决方案的研究。使用后量子密钥，`Allende\
  \ López et al.` 引入了一种签名，检查了区块链中的抗量子原理，并开发了一个确保传输安全的系统。\n\n抗量子账本 (`QRL`) 是一种经过 `red4sec`\
  \ 审计的、具有后量子安全并采用量子计算技术的全新区块链，提供了关于后量子的重要信息。`Zhang et al.` 展示了一个基于抗量子签名的区块链系统。\n\n\
  抗量子性是区块链的下一个前沿，`QAN` 被广泛认为是第一个真正的抗量子区块链。与某些据称是抗量子的区块链不同，`QAN` 允许运行去中心化应用 (`DApps`)，开发者可以利用该平台的免费工具快速构建抗量子\
  \ `DApps`。作为 `QAN` 的替代方案，许多知名区块链的创建者已经在考虑实施自己的抗量子技术，例如最近创建的 `commit-delay-reveal`\
  \ 方案，该方案可能用于将比特币转换为抗量子状态。\n\n有了抗量子平台，区块链的可扩展性和带宽问题得到了解决。区块链必须通过能够抵御地球上强大计算机攻击的加密密钥来应对这一不可避免的现实。因此，第三代区块链解决方案已由\
  \ `Cellframe` 等平台开发，这些平台已公开了它们的工作。`Cellframe` 解决方案从抗量子签名开始，其中一些已集成到 `Cellframe`\
  \ 架构中，另一些是 `NIST PQC` 竞赛的决赛签名，并根据团队构建安全去中心化环境以维护互联网自由的任务，计划了更多集成。对抗量子区块链技术或方案的研究，以及它们的标准化和实现，可能为未来的研究提供路径。\n\
  \n\n\n\n\n从表 1 和图 3 可以发现，本文回顾的大多数量子区块链文献发布于 2021 年，其次是 2020 年、2019 年、2018 年和 2017\
  \ 年。这似乎表明，从 2017 年到 2021 年，对量子区块链领域的研究和兴趣呈现出增长趋势。\n\n从表 2 和图 4 可以发现，从 Springer 获取了\
  \ 19 篇文章，IEEE Xplore 获取了 13 篇，ScienceDirect 获取了 9 篇，Google Scholar 获取了 9 篇，ACM Digital\
  \ Library 获取了 3 篇。这表明分析中使用的大多数量子区块链文献来自 Springer 数据源。\n\n从表 3 和图 5 可以发现，在数值分析和图表表示使用的\
  \ 53 篇量子区块链文献中，有 24 篇强调了无许可量子区块链，29 篇讨论了许可许可量子区块链。\n\n从表 4 和图 6 可以发现，23 篇文章讨论了公共量子区块链，15\
  \ 篇关于私有（或托管）量子区块链，7 篇关于联盟链量子区块链，7 篇关于混合量子区块链。\n\n从表 5 和图 7 可以发现，6 篇文章与供应链相关，2 篇关于会计，4\
  \ 篇关于代币化，20 篇关于身份管理，17 篇关于贸易与金融，4 篇关于其他。为了进一步了解传统区块链与量子区块链之间的差异，下表表 6 显示了对比分析。\n\
  \n## 传统区块链与量子区块链的对比\n\n传统区块链与量子区块链的对比见下表表 7。\n\n### 表 7. 传统区块链与量子区块链的对比\n\n| | |\
  \ 传统区块链 | 量子区块链 |\n| --- | --- | --- | --- |\n| 1 | | 包含记录的去中心化、分布式的公共数字账本 | 基于量子力学的加密、分布式且去中心化的数据库\
  \ (Chuntang et al, 2019) |\n| 2 | | 由于使用了非对称加密，量子攻击对区块链技术的持续性构成了威胁。 | 由于使用了量子安全、抗量子和量子加密技术，区块链技术的可行性预计不会受到威胁\
  \ (Kearney & Perez-Delgado, 2021) |\n| 3 | | 它主要作为加密货币和加密钱包的骨干运行。 | 虽然目前没有量子区块链运行，但一些研究人员正在研究该技术的可能性\
  \ (Orchid, 2021)。 |\n| 4 | | 没有区块链的功能像时间机器，因此尽管它是安全的，加密货币未来几十年的安全性也无法得到保证。 | 维多利亚大学的研究人员提出了一个想法，使用功能像时间机器的区块链来保证未来几十年的加密货币安全\
  \ (Rajan, D., & Visser, M, 2019) |\n| 5 | | 许多加密货币，如 Solana、Cardano、XRP、Bitcoin、Litecoin、Tether、BNB、USD\
  \ Coin、Terra、Polkadot、Dogecoin、Ethereum、Avalanche、Polygon 等，已经运行并使用共识算法。 | 创造了一种新型加密货币“量子币”。提议将量子纠缠和分布式权益证明(DPoS)结合，开发出一种比当前区块链共识方法更快、更高效的新型共识机制\
  \ (Orchid, 2021)。 |\n| 6 | | 增强了网络参与者的信任，实现了安排经济活动的新方法，并减少了中间人的成本和时间 (Weking, 2020)\
  \ | 量子区块链通过提供前所未有的计算增长，作为传统区块链的量子辅助 (Dey et al, 2021)。 |\n| 7 | | 传统区块链技术正在彻底改变金融科技，通过防止欺诈、消除交易中的中间人以及金融管理民主化，正在创建一个全新的金融数字部门\
  \ (Kellarord, 2021) | 量子区块链是金融科技的额外优势。 |\n| 8 | | 大多数传统区块链对量子非常敏感 Bard, al, 2021)\
  \ | 目前尚没有已知的量子攻击，该领域。 |\n| 9 | | 区块链系统对量子特别敏感 Bard, al, 2021) | 由于区块链的时间机器元素，加密货币可能是安全的。\
  \ |\n| 10 | | 区块链使用传统的加密。 | 在区块链中替换`post-quantum`（后量子）加密协议要挑战性得多 Bard, al, 2021)\
  \ | 未来工作将开发并实施一种底层框架，使土地识别、验证和收购过程对相关方透明。随着量子计算持续受到关注，区块链的量子维度将得到探索。\n\n## 致谢\n\n\
