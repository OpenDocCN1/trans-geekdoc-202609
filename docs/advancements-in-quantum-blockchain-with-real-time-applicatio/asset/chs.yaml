  \ 个用户，能耗减少了 20%，这归功于侧链合并，这在 表 7 中可见。\n\n### 表 7. 100 个用户的能量\n\n| 块数量 | 能量 (Naganuma\
  \ et al.,2020) (mJ) | 能量 (Alharthi et al., 2021) (mJ) | 能量 (本文提出) (mJ) |\n| ---\
  \ | --- | --- | --- |\n| 10 | 17.99 | 26.99 | 13.68 |\n| 20 | 20.48 | 30.73 | 15.57\
  \ |\n| 35 | 21.80 | 32.69 | 16.57 |\n| 45 | 23.44 | 35.14 | 17.81 |\n| 50 | 24.79\
  \ | 37.17 | 18.84 |\n| 55 | 25.94 | 38.90 | 19.71 |\n| 65 | 26.89 | 40.33 | 20.44\
  \ |\n| 90 | 28.20 | 42.33 | 21.14 |\n| 100 | 29.50 | 43.81 | 22.14 |\n\n\n\n\n分片（Sharding）通过有效的区块链拆分，旨在降低生物识别存储系统的整体延迟和能耗。这种拆分允许区块链减少在添加、更新、搜索和访问内部区块时所需的计算量。多个分片结合时，可以通过减少哈希计算所需的延迟和计算次数，进一步提升整个系统的性能。得益于这种组合，所提模型能够实现通信延迟降低\
  \ 20% 以上、能耗降低 25% 以上以及整体存储吞吐量提升 20% 以上。由于区块数量减少且存储性能提升，丢包率也随之降低；与其他侧链算法相比，这使得数据包交付率提高了\
  \ 10%，整体抖抖降低了 15% 以上。\n\n未来，研究人员可以使用更好的区块截断算法以及利用改进的机器学习模型进行分片创建，进一步扩展该算法的性能。此外，可以对截断的数据部分提供中等安全性，以减少由于内外攻击导致修改的可能性，从而进一步增强网络安全。\n\
