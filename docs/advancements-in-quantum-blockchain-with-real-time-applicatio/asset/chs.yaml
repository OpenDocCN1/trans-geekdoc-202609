  \    印度，Geetanjali 技术学院\n\n### 摘要\n\n区块链是世界上一种新颖但增长迅速的技术，它由一个名为中本聪（Satoshi Nakamoto）的化匿名者在\
  \ 2009 年作为加密货币比特币（Bitcoin）开发出来。区块链曾是不可篡改的，但现在，由于量子计算机的使用，篡改区块链已成为可能。为了应对这一问题，研究人员利用量子密码学的原理提出了“量子区块链”。今天，我们看到这项技术也催生了许多新技术。其中一个例子就是非同质化代币（NFTs）。这是一种新型的基于区块链的代币，独特且不可分割的。它们首次创建于\
  \ 2014 年。这些是基于区块链的虚拟资产。自 2021 年初以来，这一现象及其市场大幅增加。\n\n### 引言\n\n区块链技术最早由一位名为中本聪的匿名创建者于\
  \ 2009 年引入，是当今世界上最流行的技术之一。它最初作为名为比特币的货币媒介引入，彻底改变了货币的持有和传输方式。这项技术被认为不可篡改，它是目前现有系统发生许多变化的原因。它基本上是一块连接在一起的数据块（`Antonucci\
  \ et. al., 2019)`）。作为一种点对点技术，区块链变得更加安全，因为所有交易都更新在公共账本中，网络上的每个活跃用户都维护着其副本，篡改数据是不可能的（`Frauenthaler\
  \ et. al., 2020`）。\n\n区块链被教导是不可篡改的，但如今这正变成一个虚假的承诺，因为随着量子计算的兴起，操纵区块链网络已成为可能，因为量子计算机比目前存在的经典计算机强大百万倍。但由于问题的答案就在问题本身，研究人员提出了我们称为`抗量子区块链`的解决方案。\n\
  \n众所周知，这项技术催生了一系列新技术，其中最重要且发展最快的技术之一是非同质化代币（`Salman, Jain & Gupta, 2019`）。“近场技术”（NFT）一术语代表了相比早期技术的重大发展。区块链技术的支持者和技术人员曾因其过度的乐观和技术决定论观点而受到批评。目前对\
  \ NFT 的狂热席卷全球，并引发了争议。然而，有一点是明确的：这些代币在构建被称为“虚拟宇宙（METAVERSE）”的虚拟土地方面将发挥至关重要的作用。从广义而言，NFT\
  \ 为互联网、游戏、房地产以及风险投资者开辟了新机会的大门（`Khalid & Askar, 2021`）。NFT 具有巨大的潜力，只需通过出售带有数字签名的艺术品为艺术作者和机构赚大量资金。为了构建全球商业环境，个人和公司相互依赖以开发、传输和保存关键数据，而\
  \ NFT 为此提供了一个独立空间。\n\n### 演变史\n\n演变史是指我们从哪里开始以及现状。一种被称为“物物交换系统”的平等交换系统用于进化的早期阶段（`Abou\
