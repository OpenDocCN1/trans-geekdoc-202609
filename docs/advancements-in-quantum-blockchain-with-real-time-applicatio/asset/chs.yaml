  \ Elsevier. doi:10.1016/j.matpr.2021\n\n## 语定义\n\n- 异步区块链：一种设计为优先考虑一致性或可用性的区块链网络。如果网络优先考虑可用性，则所有交易都会添加；如果网络优先考虑一致性，则某些交易在之前的交易确认之前可能无法处理或暂停。\n\
  \n- 区块链：使用前量子密码学的区块链，防御量子攻击。\n\n- 加密货币：设计作为交换媒介的数字货币，不依赖于任何中央机构（如政府或银行）来维护。\n\n\
  - 加密术：通过使用代码来保护信息和通信的技术，使得只有目标信息的人员能够理解和处理它，从而防止未经授权的访问访问。\n\n- 身份管理：确保个人拥有适当技术资源的组织过程。这包括对访问应用程序、系统或网络的个人进行识别、验证和授权。\n\
  \n- 格密码系统：加密原语或方案的通用术语，由一组涉及格的算法组成，用于将明文转换为密文以安全地编码或解码消息。\n\n- 许可区块链：非公开访问的分布式账本。只有具有权限的用户才能访问。用户只能执行账本管理员授予的特定操作，并要求通过证书或其他数字手段识别身份。\n\
  \n- 无许可区块链：也称为无信任区块链或公共区块链，是所有人都可以参与区块链用于验证交易和数据的共识过程的开放网络。它们在未知方之间完全去中心化。\n\n\n\
  \n\n\n`量子密钥分发`: 是一种安全的通信方法，实现了涉及量子力学组件的加密协议。它允许双方产生一个只有他们知道的共享随机密钥，该密钥随后可对消息进行加密和解密。\n\
  \n`抗量子区块链`: 指具有后量子密码学的区块链系统，即具有后量子公私钥、哈希以及相关协议的系统。\n\n`签名方案`: 是一种用于确保实体确认其已看到某特定数字消息的技术。\n\
  \n`供应链`: 是一个由个人和公司组成的网络，他们参与产品的制造并将其交付给消费者。\n\n`代币化`: 是将敏感数据交换为非敏感数据的过程，这种非敏感数据被称为“令牌（tokens）”，这些令牌可以在数据库或内部系统中使用，而不会将其纳入合规范围。\n\
  \n`透明度`: 透明度在科学、工程、商业、人文和其他社会语境下，是指以一种方式运行，他人易于看到执行了哪些操作。透明度意味着开放、沟通和问责。\n\n## 第\
