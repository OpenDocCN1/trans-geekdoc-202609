  \n- 找到每个联盟的适应度，然后按照公式 5 评估阈值联盟适应度，如下：\n  ![Mathtype978-1-6684-5072-7.ch004.m05](img/ch004.m05.svg)\
  \ (5)\n\n- 将所有适应度小于 `L[th]` 的解决方案标记为“待变异”，将其他解决方案标记为“无需变异”，并进入下一次游戏迭代。\n\n一旦对所有解决方案进行了评估，将找到适应度最大的分片解决方案，这表示最大的能量节省、最大的区块转发量以及最小的端到端延迟性能。令选定的分片长度为\
  \ `SL[sel]`，使用公式 6 找到系统的平均侧链长度 (`SL[avg]`)\n  ![Mathtype978-1-6684-5072-7.ch004.m06](img/ch004.m06.svg)\
