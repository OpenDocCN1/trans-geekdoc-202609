  \ 86, 106714. doi:10.1016/j.compeleceng.2020.10\n\n## 延伸阅读\n\nSwan, M. (2020). 量子区块链。Quantum\
  \ Computing`. doi:10.1142/9781786348210_0006\n\n## 术语与定义\n\n**异步区块链 (Asynchronous\
  \ Blockchain)**：一种可以设计为优先考虑一致性或可用性的区块链网络。如果网络优先考虑可用性，则所有交易都无需任何停机即可添加。如果网络优先考虑一致性，则在所有之前的交易被确认之前，某些交易可能无法处理或会被暂停。\n\
  \n**区块链 (Blockchain)**：使用前量子密码学的传统区块链，无法防御量子攻击。\n\n**加密货币 (Cryptocurrency)**：一种设计用于通过计算机网络作为交换媒介的数字货币，不依赖任何中央权威（如政府或银行）来维持或维护。\n\
  \n**密码学 (Cryptography)**：通过使用密码来保护信息和通信的技术，使得只有目标信息的人才能理解并处理它，从而防止对信息的未经授权访问。\n\n\
  **身份管理 (Identity Management)**：确保个人拥有适当访问技术资源的组织过程。这包括对访问应用程序、系统或网络的人员进行识别、验证和授权。\n\
  \n**格加密系统 (Lattice Cryptosystem)**：涉及格的加密原语或方案的通用术语，由一组涉及格的算法组成，用于将明文转换为密文，以安全地编码或解码消息。\n\
  \n\n\n\n\n## 定义\n\n- **许可链区块链 (Permissioned Blockchain)**：一种不可公开访问的分布式账本。只有具有权限的用户才能访问。用户只能执行由账本管理员授予的特定操作，并需要通过证书或其他数字手段识别自己的身份。\n\
  - **无许可区块链 (Permissionless Blockchain)**：也称为无信任区块链或公共区块链，是开放的网络，任何人都可以参与区块链用于验证交易和数据的共识过程。它们在未知实体之间实现完全的去中心化。\n\
  - **量子区块链 (Quantum Blockchain)**：在`Quantum Computers` 中运行的区块链系统。\n- **量子密钥分发 (Quantum\
  \ Key Distribution)**：一种安全的通信方法，实现涉及量子力学组件的加密协议。它允许双方产生一个只有他们知道的共享随机密钥，该密钥可用于加密和解密消息。\n\
  - **抗量子区块链 (Quantum-Resistant Blockchain)**：具有后量子密码学的区块链系统，即后量子公私钥、哈希及相关协议。\n- **签名方案\
  \ (Signature Scheme)**：一种确保实体确认已看到某些数字消息的技术。\n- **供应链 (Supply Chain)**：参与产品创建并将其交付给消费者的个人和公司网络。\n\
  - **令牌化 (Tokenization)**：将敏感数据交换为非敏感数据的过程，这些非敏感数据被称为“令牌”，它们可以在数据库或内部系统中使用，而不会将其纳入审计范围。\n\
  - **透明度 (Transparency)**：在科学、工程、商业、人文和其他社会语境中使用的透明度，是指操作方式使得他人容易看到执行了哪些操作。透明度意味着开放、沟通和问责。\n\
  \n## 第 2 章\n\n- **Omega John Unogwu**: 墨西哥阿特斯卡大学 (Universidad Azteca)\n- **Ruchi\
  \ Doshi**: 墨西哥阿特斯卡大学 (Universidad Azteca)\n- **Kamal Kant Hiran**: 印度 Sir Padampat\
  \ Singhania 大学\n- **Maad M. Mijwil**: ![Orcid Imagehttps://orcid.org/0000-0002-2884-2504](https://orcid.org/0000-0002-2884-2504)\
  \ 伊拉克巴格达经济科学大学格学院大学\n\n### 摘要\n\n抗量子区块链是指能够抵抗通过量子计算机攻击的加密过程。现有的公钥算法依赖于解密离散对数和大质数分解问题的困难性。Shor\
  \ 算法可以被量子计算机破坏哈希签名。因此，为了后量子区块链的安全，有必要开发后量子安全签名方案或抗量子区块链。本章将根据以下主题讨论预测量子计算机对公钥密码学产生的影响：量子计算机、公钥密码学、对\
  \ PKI 的量子威胁、Shor 算法和 Grover 算法、后量子密码学以及抗量子区块链。\n\n### 结构\n\n本章讨论了以下主题：\n\n- 区块链——它是什么\n\
  - 传统区块链\n    - 前量子密码学\n- 量子区块链\n- 在`Quantum Computers` 中运行的区块链系统\n- 抗量子区块链\n   \
  \ - 量子密码学\n    - 后量子公私钥\n    - 哈希\n\n### 目标\n\n在本章结束时，应良好理解以下内容：\n\n- i. 区块链技术及其驱动原理\n\
  - ii. 前量子密码学\n- iii. 量子区块链及其带来的威胁\n- iv. 量子计算机的影响\n- v. 抗量子区块链。\n\n### 引言\n\n基于区块链的新型技术具有许多开放且有用的应用。本章讨论了区块链中已显现的缺陷。新的进展包括后量子密码学，例如抗量子区块链、后量子公私钥以及新型加密协议（Aggarwal,\
  \ D., et al., 2018）。考虑的一个关键方面是`quantum computers` 必须运行的速度。 \n\n### 区块链：它是什么\n\n\
  区块链是一种分布式账本，可以有效、永久且可验证地记录双方之间的交易。它是一个跨网络共享的只写数据库；与数据存储在服务器上的传统数据库不同，它不提供单点故障点。它是分布式的，意味着每个\
  \ `nodes` 上的数据库都是相同的（Allende, M., López, D., et al., 2021）。数据以交易的形式存储在区块链上，可以代表从房屋、现金等实体资产到专利或服务等无形资产的所有内容。\n\
  \n| 图 1 区块链应用的基础领域 |\n| --- |\n| ![Figure978-1-1684-5072-7.ch002.f01](img/ch002.f01.png)\
  \ |\n\n新型业务模式基于区块链的便利性而创建。公共区块链具有不可逆的记录，且交易是安全的。区块链用户需要保护私钥，以防止试图破坏其数字签名的黑客入侵。\n\
  \n### 区块链的工作原理\n\n区块链依赖于双加密原语：`hash functions` 用于验证数据完整性，`public-key cryptography`\
  \ 用于验证数据所有权。`hash functions` 处理任何长度的输入并生成固定大小的输出。`public-key cryptography` 使用算法生成由\
  \ `public key` 和 `private key` 组成的密钥对（Al-Housni, N., 2019）。参与者使用 `private key` 对其要在网络发布的交易进行签名，接收者使用\
  \ `public key` 验证发送者的身份。两种原语假设都是单向函数，这意味着 `hash function` 的输入无法从输出中推导出，无法通过 `public\
  \ key` 获取 `private key` 的权限。\n\n### 该技术的五大基本指导原则\n\n1. **去中心化数据库**：在区块链上，每个区块都可以访问整个数据库及其所有历史。信息和数据不受单一参与者的控制。在没有中间人的情况下，每个伙伴都可以独立验证其交易伙伴的记录。\n\
  2. **点对点传输**\n\n\n\n\n\n点对点通信在不使用中央节点的情况下进行。信息存储在每个节点上并转发到所有其他节点。\n\n### 3. 使用假名时的开放性\n\
  \n任何访问系统的人都可以看到每笔交易及其相关的价值。在区块链上，每个节点或用户都通过一个 30 多个字符的字母地址进行唯一标识。用户可以选择向他人公开身份，也可以保持匿名。在区块链中，交易发生在地址之间（Jain,\
  \ R.K., 2015）。\n\n### 4. 记录的不可逆转性\n\n记录与其之前的每条交易记录相连，因此被称为“链”，这样一旦交易被记录到数据库中并修改了账户，就无法再更改。为了保证数据库上的记录是永久的、按时间排序的且网络上的所有人都可以访问，使用了多种计算策略和方法。\n\
  \n### 5. 逻辑计算\n\n区块链交易可以与计算机逻辑相关，并且从某种意义上说，由于账本是数字化的，它是编程。用户可以配置算法和规则，自动启动节点之间的交易\
  \ (Lakhwani, K., et. al, 2020)。\n\n## 前量子密码学\n\n前量子密码学使用特定的密码或算法将人类可读的数据转换为秘密代码。前量子密码学的难度在于使加密密码既易于理解，又难以进行逆向工程。\n\
  \n### 使用前量子、量子和后量子技术的密码学\n\n前量子密码学使用称为算法的特定密码将可读输入转换为秘密代码。前量子密码学的目标是创建易于理解但难以破译的编码密码。\n\
  \n量子比特中的信息由量子计算机利用量子物理原理（量子比特）进行处理。量子计算机处理数据的速度比传统的二进制计算机快指数倍级，因为每个量子比特都可以是 0 和\
  \ 1 的混合 (Patel, S. & Vyas, A. K., et. al 2022)。\n\n相反，量子密码学利用几何密码和原子的物理特性将可理解的数据转换为不可破解的秘密代码。由于量子物理仍然是一个新兴研究领域，且原型量子计算机的构建和运行极其昂贵，这为后量子密码学带来了重大挑战。\n\
  \n#### 表 1. 经典计算对比量子计算对比后量子密码学\n\n| 经典计算 | 量子计算 | 后量子密码学 |\n| :--- | :--- | :---\
  \ |\n| 通过操作 0 和 1 执行操作 | 使用量子比特 (Qubits) 执行操作 | 使用非对称密钥——私钥和公钥 |\n| 利用互补金属氧化半导体电路\
  \ | 需要极低温环境运行 | 需要光纤连接——视距 |\n| 通过位发送数字信号 | 通过粒子或光子发送数据 | 主要限于量子密钥分发 |\n| 使用基于数字逻辑逻辑\
  \ | 基于量子理论 | 为了安全，私钥必须保密 |\n\n## 量子区块链：概念与意义\n\n基于量子理论的去中心化数据库被称为量子区块链。随着量子计算的发展，研究人员越来越关注对未来的研究。本章总结了量子区块链相对于传统区块链的优势。\n\
  \n介绍了量子区块链的可能性。量子区块链相对于经典区块链的框架。量子比特在测量时将不再表现出叠加或纠缠。量子比特可以处于叠加态，而经典计算机在任何时刻只能处于一种状态。此外，量子比特可以纠缠，这意味着改变其中一个的状态会瞬间改变另一个的状态，无论这些量子比特相距有多远。\n\
  \n量子算法的基本目的是利用一系列技术来使用量子比特。最后对结果进行测量，获得的经典比特数量与计算中使用的量子比特数量相同。利用纠缠和叠加的量子计算机可以汇总解决量子化学及相关领域传统计算机无法处理的问题，无论投入了多少时间、能量或资源。\n\
  \n量子比特的状态将坍塌为 0 或 1 状态。量子区块链建立在量子原理之上。信息是量子信息，即量子区块链的状态。\n\n## Shor 算法\n\nPeter\
  \ Shor 将量子计算机对一组数字进行因数分解的时间从几年缩到了几小时。公钥基础设施建立在非对称密钥之上，容易受到他方法的影响。如果这种技术可行，任何存储在某处的现有密钥和数据都需要重新加密\
  \ (Sharma, T. K., 2022)。\n\n由 Shor 方法生成的会话密钥会对密钥交换产生影响。当量子计算机可用时，间谍可以简单地破解他们记录的加密会话。\n\
  \n## Shor 算法\n\n选取任何大于零的正整数。使用欧几里得算法 (x, Y)，寻找最大公约数 MNO，其中 Y 是自然整数集合 Y=1, 2, 3,\
  \ 4, 5 等。如果最大公因数 MNO (x, Y)!=1，则得到的数字是 Y 的一个非平凡因子。然而，如果 MNO (x, Y) = 1，则必须建立周期。\n\
  \n此阶段需要找到函数 f(a) = gx mod Y 的周期 z。也就是说，需要确定最小的 z 值，使得 f(a)=f(x+z)。此阶段只能使用量子计算机实现。\n\
  \n如果 z 是奇数，则过程必须重新开始；否则，计算进入下一阶段。\n\n\n\n\n如果 `x^˄z/2 + 1 = 0 mod Y`，则必须执行第 1 步；否则，必须使用欧几里得算法计算\
  \ `(x^˄z/2 - 1, Y)` 的最大公约数。最后，找出 `Y` 的所有非平凡因子。\n\n以下是上述操作的总结说明。\n\n*   步骤 1：假设 `Y`（在本例中为\
  \ `15`）是待分解的数字。\n*   步骤 2：在 1 到 `Y` 之间随机选择一个数字（我们称之为 `j`），或者在 1 到 `15` 之间；假设 `x=4`。\n\
  \    *   步骤 3：确定 `MNO(Y, x)`。使用欧几里得除法公式。如果 `MNO` 小于 1，则 `MNO` 是 `Y` 的一个因子。在本例中 `MNO(15,4)`\
  \ 等于 `1`，因此进入第 4 步。\n        *   步骤 4：现在确定最小的正整数 `z`，使得如果 `f(a) = k^a mod Y`，则 `f(a)\
  \ = f(a+z)`。在后续示例中，这是可能的。\n\n如果变量定义为 `q=1`，则执行：\n\n*   步骤 4.1：之后，可以确定 `q*x mod Y`。如果余数为\
  \ `1`，则进入下一步；如果不是，则重复上一步，直到余数为 `1`。通过如下如下方式将 `q` 的值设置为上一步的余数来实现：\n    *   `1 * 4\
  \ mod 15 = 4`\n    *   `4 * 4 mod 15 = 1`\n\n由于获得余数 `1` 需要两次变换，因此 `z = 2`。如果 `z`\
  \ 是奇数，则需要执行第 2 步；否则进入下一步。\n\n*   步骤 5：使用公式 `f1 = MNO(p+1, Y)` 和 `f2 = MNO(p-1, Y)`\
  \ 确定因子 `f1` 和 `f2`。为了确定 `p` 的值，我们将 `p` 定义为第 `(^z/[2])^(th` 变换的余数。在此实例中 `p = 4`。具体来说是第\
  \ `(²/[2])^(th` 变换。\n*   步骤 6：`Y`（或 `15`）的组件由 `f[1] = MNO(p+1, Y)`给出，即 `f[1] = MNO(5,15)\
  \ = 5`。`f[2] = MNO(p-1, Y)`，即 `f1 = MNO(3,15) = 3`。\n\n由于量子比特极高的复杂度，量子计算机处理数据的速度比传统计算机快指数级。它们在理论上可以解决传统计算机无法处理的计算问题。\n\
  \n包括传统区块链，量子区块链具有分布和去中心化等特性。量子区块链的主要特征是安全高效。因此，它需要受到保护。这意味着确保节点间通信安全的最方法之一是实施量子密钥分发\
  \ (`QKD`) 或量子安全直接通信 (`QSDC`)。结果是，量子物理原理确保了网络认证。未来量子区块链也可能受到量子计算机的攻击。由量子技术驱动的区块链还具有快速处理交易的能力。因此，工作量证明\
  \ (`POW`) 可以加快交易速度。这种组合将极大地辅助加密货币的发展。\n\n## Grover 算法\n\n相反，对称密钥编码可能会受到 Grover 无结构化密钥搜索技术的影响。该程序使用振幅放大在列表中搜索特定项目。Grover\
  \ 放大方法只需要 `ÖN` 步，但传统计算机需要 `^N/[2]` 或 `N` 步。\n\nGrover 方法无法被使用，因为它需要串行处理，而量子计算机是以大量并行的方式进行处理的。如果考虑到串行处理，Grover\
  \ 技术对对称密钥加密的影响较小，采用高级加密标准 (`AES`) `128` 仍然是安全的。可以使用 Grover 方法来暴力破解 `AES` 中使用的对称密钥，对于\
  \ `128` 位密钥大约需要 `2⁶⁴` 次迭代，对于 `128` 位密钥大约需要 `2¹²⁸` 次迭代。\n\n\n\n\n\n为了防御量子计算机的攻击，人们正在为传统计算机开发后量子密码学（也称为量子加密）。后量子密码学的目标目标是让量子计算机难以解密数字签名，以应对量子算法带来的挑战。通过将后量子密码学与区块链技术相结合，后量子区块链确保了高水平的安全性。从上述研究可以发现，后量子区块链符合以下要求，使其具备区块链优势和成功抵御量子计算攻击的双重能力：\n\
  \n*   后量子区块链结合了后量子密码学和区块链技术，能够抵抗常见的已知攻击技术。\n*   后量子区块链具有可追溯的签名方案特性，并能抵抗如 `Grover's`\
  \ 和 `Shor's` 算法等已知量子算法攻击。\n*   后量子加密算法具有多元密码、基于哈希函数的密码、基于格的密码、基于代码加密等特征。\n*   这些特征通过防止量子计算攻击确保了私钥的安全性。\n\
  \n## 后量子公钥\n\n目前的安全网络交互建立在公钥加密（`PKC`）系统之上。`PKC` 表现出不对性。这意味着它使用密钥：一个与所有方共享的公钥，以及一个系统用于验证其身份的私钥。通过创建消息的哈希函数并使用公钥对其加密，消息从客户端传递到接收者。服务器使用其私钥对通信进行加密，无论任何未经授权的第三方如何尝试，都只能通过相应的私钥进行解码。\n\
  \n当后量子密码学算法运行时，对称密钥通过一种名为“量子密钥分发”的过程安全地传输。\n\n## 后量子私钥\n\n与公钥不同，私钥是只有所有者才知道的密钥；尽管如此，两个密钥必须配对，以便接收者能够使用必须解密密文的密钥读取原始消息。用于生成公钥的算法也用于生成私钥，从而产生强大且在数学上关联的密钥。尽管公钥（另一个密钥）可以公开，而不会泄露私钥的隐私性。\n\
  \n### 哈希\n\n哈希方法将任意长度的一系列消息映射为较短的固定长度值，并结合了敏感性、方向性、抗碰撞性和高含义性。哈希经常被用于保护记录的可靠性，或确保信息不被非法篡改。当被检查的数据被修改时，哈希值会随之调整。由于数据是部分性的，尊重数据的完整性至关重要。`SHA`\
  \ 是遵循美国国家标准与技术研究院（`NIST`）通用特征的加密哈希函数。哈希函数可以用于区块链检查交易和区块的完整性。区块链区块头包含前一个区块数据的哈希值。每个用户都会对比哈希。任何长度的输入值都可以通过哈希算法转换为特定长度的二进制值。哈希值是一种用于检查数据一致性的二进制值。哈希算法用于著名的\
  \ `Proof-of-Work` 算法。区块链区块包含数据的哈希值。此外，区块链中常用的签名是通过对所需数据和私钥进行哈希创建的。\n\n## 结论\n\n\
  从我们的研究可以看出，量子计算机对区块链网络构成的威胁主要与区块链活动不安全的数字签名以及糟糕的密钥交换。\n\n## 参考文献\n\n*   Aggarwal,\
