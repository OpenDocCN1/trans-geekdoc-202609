  \ et al., 2018）在某些参数上，每个协议都优于其他。可以在某些级别对它们进行比较。公有链是不需要任何许可的协议，它对所有人开放；而私有链是需要特定许可的协议，仅供网络访问。混合链是两种类型的结合（Xu\
  \ et al., 2019; Tasatanak et.al.,2018）。游戏行业已取得了巨大进展，因为底层技术为游戏场景带来了许多特性。\n\n## 相关工作\n\
  \n### 区块链系统\n区块链框架由区块链数据结构、共识模型和 PP 组织组成。根据定义，区块链数据结构是一个不断发展的区块链，每个人都拥有前一个区块的加密哈希值、时间戳及其数据。区块链数据结构旨在防止篡改。通过\
  \ `Bitcoin` 提出的 PP 框架和工作量共识模型，区块链框架可以用于帮助去中心化的信息同步。为了给区块链环境增加更多特性，实施了 `Ethereum`\
  \ 以处理去中心化智能合约，这些是由区块链促进的永久且易于执行的项目。如今，基于区块链的去中心化应用（`DApps`）已扩展到不同领域，包括首次货币发行（ICO）、非正式组织、在线游戏和物联网（Hiran\
  \ et al., 2014; Hiran et.al.,2021）。\n\n### 通用共识模型\n如所述，`PoW` 要求参与节点为了编写区块的荣誉进行无用的数值计算，这给区块链框架带来了能量和时间短缺问题。因此，提出了许多新的共识模型作为通用区块链的选项。权益证明（Proof-of-Stake）根据其在组织中的权益来选择新区块的创建者。例如，币龄被描述为未花费币的时间，个人的币龄越高，该个人就越可能挖掘另一个区块。最终，个人越富有，在区块链中挖掘的区块就越多。然而，由于在不同的分叉中持有代币对合作伙伴没有额外的收益，`PoS`\
  \ 区块链将产生大量的分叉，降低组织的价值。这被称为无意义问题。卓越证明（Confirmation of Excellence）是 `PoS` 白皮书中提到的一种理论模型。它表示偶尔根据竞争成员的展示来铸造币。\n\
  \n### 图 1. 区块链中区块的基础设施\n```\n![Figure978-1-6684-5072-7.ch006.f01](img/ch006.f01.png)\n\
  ```\n\n\n\n\n\n基本上，区块链通过游戏机制来选择达成共识的枢纽。尽管如此，在这种模型中，优秀的玩家注将主导比赛，这导致了优秀玩家实际上想要反复组装区块的现象。沿着这一思路，区块链将变成一个受世界级玩家限制的、某种程度上集成化的阶段。委托权益证明（DPoS）共识模型从另一个角度解决了工作量证明（PoW）的扩展性问题：网络成员将创建区块的权利委托给一个较小的超级节点集合，由这些节点轮流为区块链网络中的所有客户端生成区块。这种模型实现了高吞吐量和低延迟。然而，学术界目前仍在批评\
  \ DPoS 在某种程度上是一个集成化的阶段，因为很难防止超级节点之间相互勾结。投票证明（PoV）也采取了类似的思路，它由财团伙伴限制的轮换枢纽所促进，这些伙伴通过投票来达成去中心化的共识。其核心思想是为网络成员设定不同的安全特征，以便区块的接纳和确认通过协会内部民主投票来选择，而无需依赖外部中介或公共许可（Patel\
  \ et al., 2022, Barua, T., et, al., 2020）。\n\n比特币的已经完成，而 `EOS` 利用 `Delegated Proof\
  \ of Stake (DPoS)` 作为实现游戏的机制，它平衡了去中心化以增加吞吐量。所有区块链方案之间没有统一的标准，这导致了对互操作性研究的需求。特别是，提出了一种分层架构来进一步促进区块链之间的通信。一些研究工作尝试解决特定领域内的互操作性问题。这是正在发生的情况，旨在研究如何利用区块链技术进一步促进患者与临床机构之间的数据共享。标准化努力已来自\
  \ IEEE 区块链倡议和 IEEE 标准协会。例如，一个针对物联网的方案。同时，以太坊联盟（EEA）为以太坊生态系统的区块链客户设计细节，这些细节具有商业用途。遗憾的是，这些提案无法很容易接触各种应用并应用到其他区块链。例如，EEA\
  \ 的意图出现在创业中，因此它们在细节中没有考虑去中心化。IBM 提出的方案具有类似的局限性：无论他们如何为客户整合公共联盟，区块链都是由执行机构管理的，其架构由受信任的成员实现。此外，在电脑游戏行业，Hoard\
  \ 计划为工程师将区块链快速整合到游戏引擎中，并为玩家分离区块链的复杂性。无论如何，他们都没有为 DBA 提出一个非专属的设计（Saini, H. K. et\
  \ al., 2021）。\n\n### 研究连接\n\n区块链领域展示并不断阐述的连接点通常通过细粒度的观点进行了标准化。`ERC` 提出了一种统一的关联标准，用于控制同质化资产和非同质化资产。目前，这些标准基本上涵盖了资产的区块链端，通过对通信设备交互点的深入理解来帮助处理资产。然而，这种方法是有局限的，因为它没有考虑整体环境。例如，收藏级资产，如\
  \ `Crypto Kitties`，倾向于使用图片。这些图片被绑定并由项目联盟的服务器强制执行。这种方案决策可以尝试让任何去中心化的图片聚合标准都与 `ERC`\
  \ 标准关联。无疑，大多数去中心化应用无法仅利用区块链技术，因为它本身只有二或三个端点。例如，在 `Ethereum` 区块链上处理大量数据（例如图片）的成本是有限的。因此，需要将区块链仅用于应用程序的核心处理。非大规模处理、存储和其他辅助任务应由不同的工具管理，如分布式账本技术方案。区块链与这些工具之间的互操作性是一项挑战，在制定规则时应该更好地考虑。（Hou\
  \ et al., 2022; Bodhke et.al., 2020）\n\n研究中使用的方法之一是创建一个虚拟宇宙并进行土地销售。土地所有者可以在三维视频中创建模型，以便于进行交互。此类研究已经展示了游戏如何在虚拟环境中设计和执行。程序员需要这些规范，以便他们能够创建游戏环境的设计及其执行方式，从而创建虚拟环境以及游戏将如何进行下去。要点是，如果游戏正在被创建，那么必须有适当的新设计，使其看起来和感觉具有吸引力，以吸引更多客户。整个架构不能复杂，必须简单且数据库管理员能够理解。当我们在游戏中使用区块链技术时，需要集成某些工具。\n\
  \n### 提议的分层模型\n\n| 图 2. 分层模型的工作 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch006.f02](img/ch006.f02.png)\
  \ |\n| --- |\n\n上述图所示的分层方案的主要动机是为数据库提供区块支持。该模型有四层：交互层、应用层、解决方案层、处理层，所有层都负责顺畅运行，因为每层在处理时都会相互交互，而处理层是负责与数据库和存储文件交互的大部分任务，并向上层提供数据以便顺畅进行后续处理。交互层提供了模型的顺畅引导和工作。它还避免了不必要的区块。它的灵感来自开放系统互连模型（OSI）；其中每一层都必须定期与其他层交互，而在区块链技术中，交互对于海量数据存储是不够的。\n\
  \n尽管区块可以在所有应用上执行，仍然可以使用去中心化。对于任何具有可以根据其内容选择内容的中心，可以在 `Inter Planetary File System`\
  \ 上设置静态限制。然而，在所有条件相同的情况下，为了丢失某个物品预期的报告，它们可以有一个中心，在没有人支持拥有档案的情况下，该中心作为一个条目存在。许多尝试试图提供相关的激励来存储数据。例如，`File\
  \ Coin` 是 `Inter Planetary File System` 之上的一个区块链层，同样旨在获得 `Ethereum` 环境的去中心化限制。在记录积累层面临的主要挑战是精确检查应用程序的需求，在数据开放、去中心化数据违规的范围内。\n\
  \n\n\n\n\n在某些情况下，我们无法直接使用上述的去中心化聚合设备，因为它们可以说是支持静态记录的。无论如何，一些练习性的 `Orbit` 数据库（一个位于\
  \ `Inter Planetary File System`（星际文件系统）之上的层）以及 `Gun` 都使用自由复制的数据类型。因此，收集的信息使用了适用于所需情况的数据类型，因为当它们可靠地脱离连接时，无论如何，都有可能的机会来决定同行之间的混淆。根据\
  \ `Brewers theorem`（布鲁尔定理），数据库可以具有三个属性中的任意两个，即稳定性、可访问性和复原性。在使用上述模型后，我们可以看到某些特定用例的差异。在处理层中对信息的完整性进行验证，这管理了游戏的运行。\n\
  \n## 结论\n\n区块链技术在许多领域引发了革命，包括允许在没有先决条件下进行交易。2009 年，`Bitcoin` 利用了 `BC` 进技术，`BC` 开发计划的数量不断增加。主要的应用是电子现金系统，并配备了一个包含所有交易的整体信息库。这些交易使用\
  \ `cryptographic hashes`（加密哈希），并且交易通过 `key matching`（密钥匹配）进行时间标记和检查。交易历史实际上安全地保留了一个事件链，其最终目标是任何调整或更改过去交易的尝试都将需要对后续的所有交易块进行多次计算。`BC`\
  \ 技术的使用仍处于起始阶段，但它依赖于广泛的 `cryptographic norms`（加密规范）和数据存储。目前，开发方面有巨大的进展，许多提议的算法都在使用它。展望未来，极有可能，这种技术将会消失，而\
  \ `BC` 开发最终本质上将变成另一种可用的工具。通过这种传播，`BC` 依赖于已经建立的关联、加密和记录维护技术，但以另一种一种方式将它们包含其中。它将是一项重要的创新，可以审视这些发展以及使用它们的优缺点。一旦一个\
  \ `BC` 完成并在很大程度上被接受，它可能会变得难以更改。当数据存储在 `BC` 中时，只要有提升的地方，该数据就是永久的。`BC` 开发仍然很新，应该处理他们可获得的\
  \ `BC` 进展，只要我们在适当的情况下简单地使用它。\n\n## 参考文献\n\n- Anjum, A., Sporny, M., & Sill, A. (2017).\
