  \ Applications` (pp. 83–92). Springer. doi:10.1007/978-3-030-03035-3\n\n## 术语与定义\n\
  \n- **Algorithm**: 算法是解决任何问题或任务的逐步程序，它不依赖于特定的编程语言，上述章节使用了基于分层架构的游戏。\n- **Bitcoin**:\
  \ 比特币使用一种特定的技术，不使用任何银行或政府机构，所有交易的管理和维护都在完全安全的网络上完成。\n- **Blockchain**: 区块链是一种在计算机网络节点之间共享的分布式数据库或账本。作为数据库，区块链以数字格式存储信息。区块链最以其在加密货币系统（如比特币）中维护安全去中心化交易记录的关键作用而闻名。\n\
  \n\n\n\n\n## 概念\n\n## 加密货币\n加密货币是一种在互联网上交换的货币，它也可以作为数字货币，且政府无法像银行中的普通货币那样对其进行存储。\n\
  \n### 数据完整性\n如今是大数据时代，但为了安全地维护数据同样重要，对于任何货币的完整性必须进行妥善的管理。\n\n### 去中心化应用\n去中心化应用（dApp）是一种分布式开源软件应用，它运行在点对点（P2P）区块链网络上，而不是单台计算机上。DApps\
  \ 在视觉上与其他网站或移动设备支持的软件应用程序相似，但由 P2P 支持。\n\n### 以太坊\n以太坊是由社区运行的技术，支持加密货币以太 (`ETH`)\
  \ 和数千个去中心化应用。以太坊用于所有行业，并使用了智能合约。\n\n### 哈希\n加密哈希函数是一种算法，它接受任意长度的数据输入凭据，并产生固定大小的加密文本输出，称为哈希值或简称为哈希。该加密文本可以存储以代替密码本身，稍后用于验证用户。\n\
  \n### 互操作性\n区块链互操作性并不是一套规则书。它指的是一系列广泛的技术，允许不同的区块链相互监听、在彼此之间传输数字资产和数据并实现更好的协作。\n\n\
  ## NFT\n非同质化代币（NFT）是区块链中使用的不可复制的代币。它们可以是代表现实世界实体的任何东西，例如房地产或艺术品。买卖这些代币被称为代币化，这降低了欺诈的概率。\n\
  \n### PoW\n工作量证明（Proof of Work）共识算法涉及解决计算挑战性难题，以便在比特币区块链中创建新区块。\n\n### 量子计算\n这是一种利用量子力学定律来解决困难和经典问题的技术。\n\
  \n## Ripple\nRipple 是 `XRP` 背后的公司，`XRP` 是一种主要以其数字支付网络和协议而闻名的加密货币。许多大型银行使用 `XRP`\
  \ 支付系统。比特币交易确认可能需要几分钟且交易成本高昂，而 `XRP` 交易在几秒钟内即可确认且成本很低。\n\n## 智能合约\n智能合约可以定义为存储在区块链系统上的指令集，这些指令根据先以前妥当方式定义的特定条件执行。智能合约自动执行，有助于减少时间浪费，且是在协议下完成的。\n\
  \n## 时间戳\n时间戳是签名机构的输入，是特定时间的一段数据或信息，它使用 `X.509` 证书和公钥基础设施来检查或认证所有时间戳。\n\n## 第 7\
  \ 章\n\n- **Chandani Joshi**\n  印度 Sir Padampat Singhania 大学\n- **Chitra Bhole**\n\
  \  印度乌得亚普尔 Sir Padampat Singhania 大学 & 印度孟买 K. J. Somaiya 工程 way 与信息技术学院\n- **Naveen\
  \ Vaswani**\n  印度乌得亚普尔 Sir Padampat Singhania 大学 & 印度孟买 Thadomal Shahani 工程学院\n\n\
  ### 摘要\n\n通过利用物联网和信息物理系统（CPS），数据收集机制已变得非常先进。传感器已高度开发并具有复杂的细节，以捕捉各种形式的数据，这些数据可以被存储并作为信息基础，通过人工智能子分支中的分析和统计预测进行知识提取。使用不同的方法并确保严格的安全措施来存储这些数据是通过区块链完成的。损害区块链安全的漏洞是量子计算，为此本文讨论了抗量子区块链概念。本章最后通过详细审查，阐明了实施基于\
  \ CPS 4.0 的区块链机制的有效方法。\n\n### 引言\n\n世界依靠每天收集的大量数据运行。随着时间的数据收集机制也变得先进。数据收集机制不仅限于基于数值的数据，还包括非结构化和文档类型的多媒体数据。数据收集是使用各种现代传感器和附件完成的。这些数据需要大量的特征工程，如果以适当的方式利用，将产生很多特征。物联网\
  \ (`IoT`)（Kumar, 2019; Madakam, 2015）和信息物理系统 (`CPS`)（Aguida, 2020; Jazdi, 2014）通过微控制器或处理器连接了许多传感器。`IoT`（Lakhwani\
  \ 等，2020）可以用于多种收集数据。`CPS`（Nakamoto, 2009; Vujic et al.,2018）在物理层面上工作以收集数据。通过量子计算（Bhatt\
  \ 等，2019; Jazaeri 等，2019; Ladd et al.,2010)的使用来解决问题，从 `CPS`/`IoT` 收集的数据可以进行许多分析和预测。但这是为了改进系统状态进行数据管理的另一种技术，由于哈希密钥的存在，目前的系统很难破解。这些哈希密钥对量子计算机来说不是挑战。这仍然是一个遥远的问题，但在未来\
  \ 10 年内可能不是问题。量子计算机能够在极短时间内根据公钥计算出私钥，这目前似乎是一个不可能的问题。在这种情况发生之前，已经存在许多疑虑，即量子计算机将复制执行的哈希，并在记录写入区块之前伪造交易。这一过程将非常容易，尽管涉及许多违规行为，但怀疑引起了好奇心，并确实迫使研究人员研究抗量子区块链（Allende\
  \ 等，2021; Ferna’ndez 等，2020; Zhang 等，2021）。复杂的细节将在本文的后续章节中解释，但在简单术语中，区块链是一种确保透明度和去中心化系统的存储存储机制。区块链经过高度加密，并将安全放在首要位置。所有区块都通过实时哈希高度加密，并与强冗余连接，以确保整个交易操作过程中处于相同的状态。然而，将区块链集成到\
  \ `CPS` 4.0 (Patel 等，2022)工业标准是另一个本文讨论该理念的方面。\n\n## 方法论\n\n信息物理系统\n\n\n\n\n\n任何技术都涉及许多物理层面的组件。这些组件之间的智能交互在许多层面上都是至关重要的。信息物理系统（Aguida,\
  \ 2020; Jazdi, 2014; Rawung et al.,2014）可以被定义为使用共同工程设计的物理组件和计算组件网络进行的交互。它也可以被视为各种技术的结合，即：人工智能、机器学习（Alpaydin,\
  \ 2020; Sarker,2021; Shinde, et al. 2018)）、深度学习（Goodfellow et al., 2016; LeCun,2015)）、物联网（Kumar\
  \ S, 2019;Madakam S, 2015;Rehman H.u et al.,2017）、大数据分析（Elgendy et al,2014）以及机器人技术。\n\
  \n人们脑海中产生的首要困惑是物联网与信息物理系统之间的区别。对此问题的简单答案是：物联网与连接互联网并最终耦合在一起的对象有关，而信息物理系统是用于物理过程的带有网络的计算集成。信息物理系统允许使用系统的传感器以直接的方式记录数据。物理过程通过执行器受到影响。使用信息物理系统可以轻松地评估和保存物理世界与数字世界之间的界限。在全球范围内轻松建立彼此之间的连接是可能的。它提供了多模态人机接口以便更方便的交互。可以直接从设备生成信息。由于分配了个人级\
  \ IP 地址，可以实现自我监控。\n\n信息物理系统 4.0 (CPS 4.0) 是传统信息物理系统的工业化呈现。它确实通过最新进展赋能了制造业。当前的目标是将现有的物理系统与\
  \ CPS 4.0 标准连接起来。如果我们将涉及的各种技术进行分解，这是 CPS 实施的清晰指示，因为数据是其主要的需要组件，而在现代世界中，数据的分配规模非常大，这无疑可以利用这些技术领域。\n\
  \n从物联网（缩写为 `IoT`）开始，是将基于传感器的微控制器和微处理器连接到互联网以创建智能应用。`IoT` 的主要方面是网络、通信、安全、解决业务问题使用的数据量以及社会影响。互联的设备体现了\
  \ `IoT` 能够海量地传输和接收数据。集成电路，如系统级芯片（`SoC`）（Martin et al.,2001）和现场可编程门阵列（`FPGA`）（Zheng\
  \ et al.,2001）可以以适当的方式收集数据。基于物联网的系统的主要强大点在于利用网络进行云集成（Hiran K, et al., 2021）。云计算（Mathew\
  \ et al. 2017）提供了服务和使用应用程序接口（`APIs`）的形式。使用基于 `IoT` 的系统可以轻松实现各种基于网络的系统的实时流和集成。云还利用了海量数据存储，因此设备不需要依赖片上存储。可以使用这些数据进行大量的分析，这就是数据科学领域将用到的地方，本节稍后会解释。主要任务是管理异构数据并将其投入使用。敏感数据可以用于此，无用数据可以被丢弃。人工智能是一个非常广泛的术语，可分为许多章节。对于物联网，预测模型是分类的。信息物理系统是用于物理过程的带有网络的计算集成。信息物理系统（2014Jazdi,\
  \ 2014)](#978-1-6684-5072-7.ch007.xhtml#r51)）是技术的结合。机器学习（Alpaydin, 2020; Sarker,\
  \ 2021; Shinde, et al. 2018）是各种技术的结合。深度学习（Goodfellow et al., 2016; LeCun,2015）是各种技术的结合。物联网（Kumar\
  \ S, 2019;Madakam S, 2015;Rehman H.u et al.,2017）、大数据分析（Elgendy et al,2014）以及机器人技术是各种技术的结合。信息物理系统（Aguida,\
  \ 2020; Jazdi, 2014; Rawung et al.,2014）可以被定义为使用共同工程设计的物理组件和计算组件网络进行的交互。机器学习（Alpaydin,\
  \ 2020; Sarker,2021; Shinde, et al. 2018）是各种技术的结合。深度学习（Goodfellow et al., 2016;\
  \ LeCun,2015）是各种技术的结合。物联网（Kumar S, 2019;Madakam S, 2015;Rehman H.u et al.,2017）、大数据分析（Elgendy\
  \ et al,2014）以及机器人技术是各种技术的结合。信息物理系统（Aguida, 2020; Jazdi, 2014; Rawung et al.,2014）可以被定义为使用共同工程设计的物理组件和计算组件网络进行的交互。\n\
  \n机器学习（Alpaydin, 2020; Sarker,2021; Shinde, et al. 2018）是各种技术的结合。深度学习（Goodfellow\
  \ et al., 2016; LeCun,2015）是各种技术的结合。物联网（Kumar S, 2019;Madakam S, 2015;Rehman H.u\
  \ et al.,2017）、大数据分析（Elgendy et al,2014）以及机器人技术是各种技术的结合。信息物理系统（Aguida, 2020; Jazdi,\
  \ 2014; Rawung et al.,2014）可以被定义为使用共同工程设计的物理组件和计算组件网络进行的交互。\n\n（注：由于原文文本中存在大量重复段落，译文已根据注意事项“一定不要重复输出原文”的原则进行了去重处理，保留了所有不同的逻辑信息和格式。）\n\
  \n\n\n\n\n正向传播和反向传播共同构成一个周期（epoch），网络中可以包含许多周期。这一过程不仅限于数值数据。传感器正变得越来越智能，数据收集程序也在改进。收集的数据可以是图像、视频、文本和音频。\n\
  \n图像和视频属于可以使用深度学习解决的计算机视觉问题。使用深度学习在计算机视觉中分类分类通过一种特定的神经网络，即卷积神经网络，由 (Albawi et al.,2017;\
  \ LeCun et al.; Musale et al.,2021; Yamashita et al.,2018) 提出，它们中使用了一组过滤器（也称为卷积核）来从图像中提取特征。这些过滤器执行各种图像处理方法以从图像中提取信息，包括误差水平分析（Gupta,\
  \ A et al.,2022）。\n\n这些数据可以用于迁移学习，使用在 Image-Net（Russakovsky, O et al.,2015）数据集上训练的流行卷积神经网络，这是一个包含\
  \ 1000 多个类的数据集。一些常用的卷积神经网络有 AlexN（Russakovsky, O et al.,2015）、VGG-16（Simonyan, K\
  \ et al.,2014）、ResNet（Gupta A et al.,2022; He K. et al.,2016)）、Inception Net（Szegedy,\
  \ C et al.,2015）。这些参数非常丰富，如果从传感器收集的数据是图像形式，可以发挥优势。\n\n如果数据涉及某些对象的检测，可以使用目标检测算法，如由（Bochkovskiy,\
  \ A et al.,2020; Redmon, J et al. 2016）使用的 Yolo、R-CNN（Girshick, R et al.,2015）、Fast\
  \ RCNN（Girshick, R et al.,2015）、Faster RCNN（Ren, S et al.,2015）。如果数据应该用于突出数据中的某些部分，可以使用图像分割算法，如\
  \ U-Net（Ronneberger, O et al.,2015）、瓶颈受监督网络（Li, S et al.,2018）和 Yolact（Bolya, D\
  \ et al.,2019;Bolya D et al.,2020, Joshi, R.M et al.,2022）。\n\n如果数据是文本格式，则它属于自然语言处理类别。带有机器学习的\
  \ NLP 系统使用基础文本管理，通过词袋模型（Zhang, Y et al.,2010）和 TF-IDF（Tambe, S et al.,2022）来学习词表示。如果需要使用深度学习，可以使用循环神经网络（Cho,\
  \ K et al.,2014）。这在反向传播中可能会遇到梯度消失问题，可以使用 LSTM（Joshi R et al.,2022; Staudemeyer R,\
  \ et al.,2019）。为了改进 LSTM 的工作效果，使用了双向 LSTM（Cui, Z et al.,2018），它接受来自未来的序列输入，有助于丢弃无用信息。\n\
  \n现代系统为了学习和训练的速度以及更好的准确性，考虑了使用 transformer 架构（Vaswani A. et al.,2017; Joshi R. et\
  \ al.,2022), 架构接收整个序列的输入并配合编码器和解码器工作。机器翻译是被考虑的主要任务之一。后续任务如命名实体识别（Li, J., Sun et\
  \ al.,2020; Vujicic,et.al.,2018）被证明是终极解决方案。\n\n区块链是一个极其紧凑且安全的数据库系统，它确保了安全的许多方面，安全性是其首要考虑。需要考虑的关键点是它是分布式的，从顶层看它像是一个典型的数据库，但内部运行完全不同。区块链的数据结构不同，正如其名称所暗示，它将信息存储在区块中。然后这些区块形成的链与上一个区块链接。更改一个区块是不可能的。更改一个区块需要所有区块的权限，这由智能合约的规则所规定。这在实践上高度去中心化。链紧密链接，对于任何维护数据完整性并防止篡改的应用都是非常有用的。\n\
  \n| 图 1. 区块链图 |\n| --- |\n| ![Figure978-1-6684-5072-7.ch007.f01](img/ch007.f01.png)\
  \ |\n| --- |\n\n这些区块以实时机制运行，因此使得更改变得困难。该应用极大影响了加密货币（Farell, R,2015; Jose, K.2018）领域，因为交易的实时性是必要的。出于安全考虑，它使用了透明度和实时（Hiran,\
  \ K et al）。比特币是一种非常著名的加密货币，每天交易并运行在区块链上。这种货币是点对点的，并且要求列出的所有属性。传统数据库中存储的记录是典型的非冗余过程，而区块链通过区块进行操作，存储的数据被称为账本。去中心化概念在区块链中得到实现，使得账本去中心化，并将交易过程称为去中心化账本传输。\n\
  \n\n\n\n传统的解决方案是并行化数据处理的流水线，这种方法虽然有效，但留下了许多悬而未决的问题，因为并行化在线性时间内解决问题，无法应对指数级增长的时间。\n\
  \n量子计算机的操作可以通过量子力学本身来给出，因为它使用的是量子比特而非普通比特。叠加态的语境（Li, T., Yin et al., 2016）是量子力学中最重要的概念，因为它提供了关于事物运行方式的直觉。它提供了一种截然不同的理解，因为它指出世界在一个模拟中运行，且两个事件发生的可能性是显而易见的，但事件发生在观察者体验其发生的动态过程时。这是一个非常深刻的解释，可以分解为非常微妙的解释，即测量会将叠加态坍缩为观察者观测到的状态。这是量子力学的核心思想。量子计算包含了量子力学中所有可能的动力学，它并不是目前传统计算机的替代品，因为在其上进行的所有操作都在不同的系统中运行。一些研究估计，来自有界误差量子多项式时间”（Bounded-Error\
  \ Quantum Polynomial-Time）的问题可以通过量子计算转换为多项式时间，尽管这只是一个估计。\n\n为了理解量子计算的数学直觉，人们需要关注量子力学中的叠加直觉，因为它直接与`qubits`（量子比特）相关，量子比特是量子计算机的比特。基本直觉可以通过叠加态自旋粒子的`狄拉克符号`（dirac\
  \ notation）来建立，这是一个关于粒子在向上和向下方向施加位置的线性方程。\n\n```\n[0] |0⟩ + [1] |1⟩ (1)\n```\n\n\
  其中 `|0⟩` 是粒子的向上自旋，`|1⟩` 是粒子的向下自旋，`α` 为振幅。这构成了叠加方程，其中状态是基向量。这些可以与量子态方程相联系。\n\n```\n\
  |Ψ⟩ = [0] |0⟩ + [0] |1⟩. (2)\n```\n\n`|0⟩` 和 `|1⟩` 可以被视为两个正交态，它们的概率之和为为 1，这可以用简单的方程表示为\n\
  \n```\n|[0]|² + |[1]|² = 1 (3)\n```\n\n量子比特的更深层见解可以通过构建量子态复合系统的张量积来表示。\n\n![Mathtype978-1-6684-5072-7.ch007.m01](img/ch007.m01.svg)\n\
  \n其中\n\n![Mathtype978-1-6684-5072-7.ch007.m02](img/ch007.m02.svg) (4)\n\n2 量子比特计算中由\
  \ 0 和 1 组成的 2 比特信息由下给出\n\n```\n|Ψ[0]⟩ |Ψ[1]⟩ = [00] |00⟩ + [01] |01⟩ + [10] |10⟩\
  \ + [11] |11⟩ (5)\n```\n\n方程 5 是 2 量子比特的表示，它会随时间指数级增长，导致极高的计算量。3 个比特在这里甚至无法轻松容纳，而\
  \ 64 个比特就有 20 位比特。量子门无疑是将传统比特和量子比特方程分开的关键，其中叠加态通过线性单元`|⟩→U|⟩`进行操纵。这种酉正变换可以表示为\n\n\
  ```\nUU^† = U^†U = I (6)\n```\n\n其中 `U` 有一个复共轭，当转置时给出 `U^†`。这些操作对于保持范数是有效的，并且在状态变换为\
  \ 1 以为了在观测单元表面维持叠加态后，能够维持总概率，其方程为\n\n```\n|||⟩ = ||U|⟩|| (7)\n```\n\n这无疑为将叠加态坍缩为复杂算法的线性单元提供了优势。假设\
  \ Shor's（（Shor P.W., 1999)）算法用于破解`RSA (Rivest, R.L et al.,1978)` 可以计算为多项式时间，方程为\n\
  \n```\n![Mathtype978-1-6684-5072-7.ch007.m03](img/ch007.m03.svg) (8)\n```\n\n同样，经典计算在解决此类指数时间问题方面也不从心。量子计算机以非常简单的方式计算复杂的离散傅里叶变换，可以表示为\n\
  \n```\n![Mathtype978-1-6684-5072-7.ch007.m04](img/ch007.m04.svg) (9)\n```\n\n这使得量子计算成为传统系统的辅助而非替代品，因为这项技术正在不断演进。\n\
  \n\n\n\n该术语专门为了应对量子计算技术对区块链系统带来的新兴威胁而提出的。区块链最强大的点在于其安全性，这种安全性非常强大且几乎不可破解。要破解整个链，攻击者需要获取整个链至少\
  \ 51% 的份额。这对于目前最先进的系统来说是不可能的，但在不久的未来可以通过量子计算实现。\n\n量子计算机能够以并行方式计算不同比特的唯一原因是**叠加**，这是一个重要的概念。**纠缠**是未来几年可能破解区块链的主要因素。在量子力学中，它与粒子相互之间的完美纠缠有关。一个粒子的变化会影响相同维度空间内的其他粒子。因此考虑到叠加和纠缠，任务将以顺序方式执行，并行化将仅仅成为高性能计算中的一个复杂问题。\n\
  \n叠加使用了 `qubits`，它们呈指数级增长，因为 `2-qubits` 会同时产生 4 种不同的结果，而 `4 qubits` 将处理 16 种不同的结果，依此类推。目前的\
  \ `qubits` 很难破解区块链。区块链是一个分布式去中心化账本，受加密算法紧密保护。具有高数量 `qubits` 的强大系统可以在数据进入账本之前进行修改。这项任务对于量子计算机将无缝地实现。由于数据在添加到账本之前会进行哈希处理，任何一个篡改的文档都会导致完整性违规，因此修改将在写入之前完成。\n\
  \n如果使用单向数学函数，就可以执行修改。每个用于特定操作的区块链都有智能合约。它具有数字签名。这些签名可以使用单向数学函数破解。其中一个例子是 `trapdoor\
  \ function`（陷门函数）。它被用于以反向计算解决方案。基本上，操作只有一种方式进行，如果使用反向解决方案，蓄意的信息就会泄露。尽管如此这需要额外的信息，因此在区块链的情况下这将是一项艰巨的任务。`trapdoor\
  \ functions` 自对称加密和公钥加密技术发现以来一直存在。`RSA` (Rivest, R.L et al.,1978) 和 `Rabin` (Yaqin,\
  \ A et al.,2019) 是幸存于 `trapdoor function` 的加密函数。考虑到涉及的质因分解（其中涉及合数的指数模运算），`trapdoor\
  \ functions` 面临着局限性。这就是量子计算机可以破解这一链的地方，因为它们处理指数函数时非常高效。\n\n另一种单向数学函数是 `one-way hash\
  \ function`。`One-way hash function` 是一种压缩数学函数，接受变长度的输入并将其哈希为固定长度的二进制序列。使用传统计算机计算反函数非常困难，但这项任务对于量子计算机来说并不可畏。量子计算的反向计算将变得非常普通。交易历史的操纵将变得非常容易。更改区块链的哈希是不可能的，因为会破坏链并通知整个点对点网络。这就是为什么可以在不破坏哈希的情况下导致破解的原因。记录需要被更改，然后结果应该被加密，并检查哈希是否与之前相同，否则整个系统将失败。\n\
  \n使用量子计算机从公钥计算私钥也是可能的。`RSA` 是工作于公私钥系统的算法之一。`RSA` 可以使用 `Shor’s` (Shor P.W., 1999)\
  \ 算法破解。破解公钥需要 2 个质数组合。量子计算机可以在几秒钟分解非常大的数字。因此，在未来几年，破解现代 `RSA` 对于量子计算机来说将不再是艰巨的任务。如果我们现在考虑下方方程给出的质因分解时间复杂度\n\
  \n![Mathtype978-1-6684-5072-7.ch007.m05](img/ch007.m05) (10)\n\n其中它运行在 Oh 复杂度下，`n`\
  \ 是比特数，量子计算机可以轻松执行\n\n```\nO(n³)\n```\n\n门数量数量为\n\n```\nO(n² logn)\n``` (11)\n\n\
  质因分解在有利的情况下是多项式的。`Shor’s` 算法属于一类模型，被称为有界误差概率多项式时间 (BPP)。这种量子计算表示为\n\n```\nf[a] =\
  \ x^amod N\n```\n\n用于有效地计算最大公约数 (`GCD`)。最坏情况通常是指数级的。\n\n## 量子抗性区块链\n\n在了解量子计算机对区块链的威胁后，量子抗性区块链至关重要，因为它们可以在不破坏哈希的情况下篡改信息。在理解其抗性系统之前，可以更深入地了解问题。许多先进问题可以关注。`Hashcash\
  \ proof-of-work` 代表了比特币 (Aggarwal, D et al.,2017)，使用 `Grover search` 算法 (Grover,\
  \ L et al.,1996)，量子计算机可以以二次时间执行更少的哈希。门速度范围高达 100 Ghz，允许量子计算机解决问题的速度快 100 倍。从公钥导出私钥将是一个主要问题。传统的现代计算机执行该任务效率低下，但量子计算机不会。纠缠和叠加将被用于破解加密系统将使用\
  \ (Roetteler, M et al.,2017) 计算椭圆曲线离散对数的量子资源估计。大多数区块链使用椭圆曲线签名算法 (`ECSDA`) (Al-Zubaidie\
  \ et al., 2019; Bi W. et al.,2018; Sonnino et al.,2016) 用于加密哈希。考虑到量子计算机，`Shor’s\
  \ algorithm` 可用于破解椭圆曲线签名算法 (`Proos, J et al.,2003`)，其中私钥可以从公钥导出，从而创建处理钱包的交易。由于 `ECSDA`\
  \ 可以被破解，`RSA` (Rivest, R.L et al.,1978) 不是挑战。\n\n| 图 3. 量子抗性区块链 |\n\n| --- |\n\n\
