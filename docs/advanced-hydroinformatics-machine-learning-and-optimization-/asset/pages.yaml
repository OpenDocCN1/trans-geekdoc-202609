- pgno: 271
  md: '# 9.2.6. Other Data-Driven Models: Least Median Square, Linear Regressions,
    Pace Regression, and Model Tree


    The same idea will be tested with other data-driven models, some of which offer
    advantages over an ANN modeling tool. One drawback of ANNs is that no additional
    information can be extracted due to the (black box) nature of the model. Also,
    if a simpler model can do the job, there is no need for a complex one. The present
    study does not seek to give an exhaustive analysis of wavelets with other DDMS,
    but to show that the same procedure could also be valid with other modeling techniques.
    Models used in this work are (1) LeastMedSq: Robust regression using the median
    rather than the mean; (2) LinearRegression: Standard linear regression; (3) PaceRegression:
    Linear regression models using Pace regression; and (4) M5P: Model tree. Readers
    can turn to Witten and Frank (2006) for details on the methods cited above; Weka
    software was used to develop the models in this section (http://www.cs.waikato.ac.nz/ml/weka/).


    # 9.3. Methodology


    # 9.3.1. Sequence of Experiments


    The numbers of experiments were many and they are captured in the following sequence:


    +   - Input variable selection (IVS)

    +   - Model-based: Forward selection

    +   - model1 = P(t), Q(t)

    +   - model2 = P(t), P(t-1), Q(t)

    +   - model3 = P(t), P(t-1), P(t-2), Q(t)

    +   - model4 = P(t), P(t-1), P(t-2), P(t-3), Q(t)

    +   - Model-free: Correlation and average mutual information

    +   - model5 = model2 = P(t), P(t-1), Q(t)

    +   - Data splitting of best IVS (model2)

    +   - K-fold cross-validation; k =10

    +   - Cross-validation (first 85% of the data), the last 15% to test the model

    +   - Develop both models: ANN & WANN

    +   - For the ANN approach (model1a(1-20)-model4a(1-20)), in total 80 (20x4) models'
