- pgno: 197
  md: 'The EDEN-generated values are then used by water resource scientists and managers
    in conducting their research assessing ecological responses to CERP (Telis et
    al., 2015; Conrads et al., 2014) and other restoration and management efforts.
    One of the important aspects of water depth, and, by extension water level as
    it pertains to the Everglades, is the close relationship between the timing, spatial
    distribution, and volume of water, and the population health of a number of species
    that are used as indicators of wetland ecosystem health (Brandt et al., 2016).
    Examples of such species are alligators (Fujisaki et al., 2009) and several wading
    birds (Frederick et al., 2009; Lantz et al., 2010), which are directly or indirectly
    affected by water levels in the wetland, whether it be through prey availability,
    foraging habits, or nesting habitat (Forde, 2020). The importance of water levels
    in the Everglades are also highlighted in Telis (2006) and SFWMD (2021).


    Machine Learning is now widely applied in many aspects of modeling, in which computer
    models learn patterns and relations within large data sets, and are able to produce
    generalizable evaluations of these data sets, gaining insight, knowledge, and
    predictive capacity through the identification, utilization, and testing of various
    computational approaches (Alpaydin, 2009). These types of models, also known as
    data-driven models, are able to solve complex problems in systems that are challenging
    to describe numerically. Machine Learning has been used to solve various problems
    in hydrology and hydraulics, see for example, Solomatine and Dulal (2003), Bhattacharya
    and Solomatine (2005), Kasiviswanathan et al. (2016), Xiang et al. (2020), Kao
    et al. (2020), and Moreido et al. (2021). A historical overview of Artificial
    Neural Networks (ANN) for hydrological forecasting is provided by Abarhart et
    al. (2012). Additionally, there are multiple examples of using ML for water-level
    forecasting (e.g., Zhu et al., 2020). Cruz et al. (2018) successfully used a multilayer
    ANN (Aggarwal, 2018) in predicting water level using real-time rainfall, water
    level, and soil moisture data. Amaranto et al. (2018) demonstrated the use of
    ANN (multilayer perceptron) for groundwater-level forecasting. Another study by
    Ma et al. (2019) showed promising results using a model based on LSTM networks
    to investigate whether the accuracy of water-level forecasting could be improved
    in the Rhine River Basin in Germany. A LSTM network, one form of Recurrent Neural
    Networks, is a deep-learning architecture that includes memory cells that store
    information over long periods of time and is known to be the optimal contemporary
    network architecture for predicting sequences such as in time-series, speech recognition,
    text prediction, and others (Kratzert et al., 2018). Unlike traditional approaches
    for time-series forecasting like Autoregressive Integrated Moving Average (ARIMA),
    LSTM has the ability to adapt to features of the data such as seasonality (Siami-Namini,
    2018). Additionally,'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'LSTM can utilize more hyperparameters and, because the extent of the short-term
    memory can be defined, LSTM tends to outperform SARIMA (Seasonal-ARIMA).


    We could find only two published research papers presenting explicit water-level
    modeling in the Everglades. The first was a study by Conrads and Roehl (2007)
    where an ANN was used to hindcast water levels. The second and more applicable
    to this study focused on prediction boundaries and forecasting of nonlinear hydrological
    stage data in the A.R.M. Loxahatchee National Wildlife Refuge, the northern-most
    extent of the remnant Everglades (Park et al., 2005). An ANN model was developed
    to forecast stage over a 16 yr period from just 2 yr of training data, with forecast
    horizons of 1, 2, 8, and 14 days. This model was compared with linear models that
    forecast stages, and the results showed that the ANN model outperformed the linear
    models, most notably at the longer lead times. Additional methods for evaluating
    machine-learning models, such as visualization tools, were not applied in this
    study.


    Apart from these examples, the models that currently exist for forecasting water
    level are numerical models, which simulate overall regional hydrological conditions
    in the entire, or specific parts, of the Everglades and are used by water managers.
    One of these models is the Regional Simulation Model (RSM), a surface water-groundwater
    model that solves for water stages and flows under natural (predrainage system)
    conditions as well as under controlled conditions such as the operation of water-control
    structures. The RSM quantifies changes in groundwater levels, groundwater and
    overland flow, and wetland hydroperiods, among other things (SFWMD, 2006). The
    RSM is solved for an irregular triangular mesh grid, which is considered an improvement
    on the South Florida Water Management Model (SFWMM), which has a square grid size
    of 3.2 x 3.2 km (SFWMD, 2008). The SFWMM simulates the hydrology and management
    of the water resources system from Lake Okeechobee to Florida Bay and is a tool
    for assessing operational changes to the complex water management system in South
    Florida (SFWMD, 2005).


    Another regional simulation model, and the one used for comparison in this study,
    is the Biscayne and Southern Everglades Coastal Transport (BISECT) model, which
    simulates hydrologic conditions in various scenarios (Swain et al., 2019). This
    model uses dynamic equations so that surface water is fully represented, making
    it suitable for comparison in this study. One of the disadvantages of the BISECT
    and possibly other regional models is the averaging of inputs and outputs over
    each grid cell, which reduces the extent of peaks and troughs in the predictions.
    As a result, the BISECT model is more suitable for long-term regional analysis
    of hydrological conditions, than it is for local, shorter-term predictions (Swain
    et al., 2019).'
