    # ### 1.3.3. Optimization


    The third step shown in Figure 1.5 is the modeling process per se, which in principle
    is called learning and is an optimization process to choose the model parameters
    and the structure to fit the model output to the measured (target) values. Numerous
    single-objective and multiobjective optimization techniques are available for
    such purposes, and they are typically very specific to each of the techniques.
    It is not possible to state that one technique will always provide a better solution
    than another. This can be partly explained by the existence of random components
    in many algorithms.


    # ### 1.3.4. Model Evaluation (Testing)


    The final step in the training process is the evaluation of the model’s performance.
    After the model is optimized and, as such, probably selected after some validation
    iterations are done, the error of the model on test data is used to assess the
    resulting model performance.


    It is worth mentioning that in process-based modeling in situations of poor data
    availability, data partitioning into training, validation, and test subsets is
    not always carried out, so proper model testing may be difficult to arrange. However,
    in machine learning exercises, the procedures of data partitioning are normally
    followed.


    The error measure (metrics) used in the training (learning) process of the ML
    model (typically based on the mean squared error) should not be seen as the only
    way of model performance estimation. Commonly, visual'
  merge: -1
  img_proc: true
