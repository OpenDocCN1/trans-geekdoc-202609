  md: 'shows in detail the Pareto front OF1-OF2 and OF1-OF3, where shaded rectangles
    indicate the decision space of the solutions that equal or exceed the reservoir’s
    actual operations toward the three objectives. Some points located inside and
    outside the decision space are simulated and compared with the real operation:
    four reservoir operations shown in Figure 15.15b are simulated (MLP_7N_23; MLP_7N_37;
    MLP_7N_41; MLP_7N_72), as well as two solutions shown in Figure 15.15c (MLP_7N_40;
    MLP_7N_43), and two shown in Figure 15.15d (MLP_7N_40; MLP_7N_43). Figure 15.17c
    shows the parallel graphic of the selected solutions.


    Results are shown in Figure 15.18, which confirms that it is possible to reduce
    the peaks of the hydrograph of the real operation, as they are more to the left
    in the Pareto front. The MLP_7N_77 reservoir operation, as expected, had the best
    result in reducing all the peaks of the reference hydrograph (real operation),
    followed by MLP_7N_73. However, the effect negatively affected irrigation and
    power generation, keeping firm energy. Reservoir operations such as MLP_7N_40
    and MLP_7N_43, located within the shaded rectangle for the OF1 and OF2 (Fig. 15.17),
    allow one to reduce peak flows by slightly affecting the total power (OF3) but
    improving the irrigation objective and keeping the firm energy. Finally, the MLP_7N_23,
    MLP_7N_37, MLP_7N_41, MLP_7N_72 solutions, located within the shaded rectangle
    for the three objectives despite not having the same peak flow reduction capacity
    as the previous ones, managed to reduce the reference hydrograph while increasing
    power generation and guaranteeing the supply of water for irrigation. Figure 15.19
    shows the hydrographs of the reservoir operations selected for the wettest portion
    of the analysis period, which spanned from November 2016 to May 2017.


    Note that all the selected operations improved the real operation in terms of
    flood control and firm energy, however, as expected, the operations with the best
    performance in flood control (i.e., MLP_7N_77 and MLP_7N_73) present some intermittence
    (i.e., presence of minimum values) in power generation and irrigation in dry periods,
    as can be seen in Figure 15.18, for example, in the months of February to March
    2010 and in the months of July to September 2014. The MLP_7N_40 and MLP_7N_43
    solutions present less intermittence than the previous solutions in these terms,
    even improving the irrigation objective and having a considerable improvement
    in flood control (see Fig. 15.19). Regarding the solutions located within the
    shaded rectangles in Figure 15.17a and b, they considerably improved the real
    operation in terms of intermittence in power generation and irrigation, and also
    improving the flood control objective (although not in the same magnitude as the
    previous solutions: MLP_7N_40 and MLP_7N_43).'
