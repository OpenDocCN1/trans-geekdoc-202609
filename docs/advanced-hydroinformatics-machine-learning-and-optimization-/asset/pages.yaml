  md: 'subsets or better matching by random selection of particular values within
    subsets.


    To deal with the boundary problems on the right, the a-trous wave algorithm was
    used. This does not cause distortions in this limit; on the contrary, approaching
    the left limit is different. There are several extension methods. Like the ones
    shown in Figure 9.1e, we use the symw method (see https://de.mathworks.com/help/wavelet/ref/wextend.html).
    In effect, the larger the decomposition, the 2 ^ x would be the bandwidth and
    therefore more data should be assumed. In Figure 9.11, we can see how the boundary
    distortion affects the highest decompositions; however, it does not in Figures
    9.9 and 9.11 (deserves study). This could be because the subset of tests is much
    smaller (only 15% for tests and 85% for cross-validation). The optimized result
    shows an ideal six-level decomposition, which is reflected in 2 ^ 6 (bandwith),
    only 64 values (affected) out of more than three thousand available records.


    # 9.5.3. De-Noised Wavelet ANN Model


    The same model showed just before is improved even further by de-noising the input
    time series. Soft-threshold was applied and the threshold value was found via
    optimization. Godlike (a generalization of various population-based global optimization
    scheme) was used for this purpose (http://nl.mathworks.com/matlabcentral/fileexchange/24838-godlike-a-robust-single-multi-objective-optimizer).
    The objective function was set as RMSE in the cross-validation process; however,
    any other statistical or error measure can be set as an objective function as
    well. The training set minimally improved in 0.03% (77.01 m³/s to 76.98 m³/s)
    compared with the WANN model and 16.1% (91.81 m³/s to 81.1604 m³/s) with the ANN
    stand-alone model. For the validation set an improvement of 6.2% and 4.3% were
    accomplished respectively to the WANN and ANN models. As in the case of the test
    set, performance increased by 9.6% compared with the WANN model and increased
    by about 27% to the ANN stand-alone model. Results are considered highly accurate
    for the case study, however, if more effort is invested in keeping tuning the
    parameters even major accuracies can be accomplished. In this exercise, the number
    of hidden nodes and decomposition levels was set as fixed, based on the best result
    of the WANN model and the only variable to optimize was the threshold value. Besides,
    the optimizer was run with a small population and a modest number of iterations,
    therefore if bigger computational resources are at disposal is thought that excellent
    results could be accomplished.'
  merge: -1
  img_proc: true
