    # 7.3. Workflow


    # 7.3.1. Data Acquisition and Processing


    The data used were rainfall and water level from USGS EDEN (https://sofia.usgs.gov/eden/eve/index.php),
    discharge from SFWMD DBHYDRO database (https://www.sfwmd.gov/science-data/dbhydro),
    and rainfall forecasts from the European Centre for Medium-Range Weather Forecasts
    (ECMWF) (https://apps.ecmwf.int/datasets). Data were subjected to extensive quality
    assurance measures by the agencies responsible for collection. The discharge data
    set was the only data set with missing values, which were gap-filled using two
    additional time series of discharge collected by the SFWMD and the U.S. Army Corps
    of Engineers. The USGS time series for discharge was the most comprehensive and
    was selected for use by ML models, but it also contained some missing values.
    To gap-fill USGS discharge, values from the other two time series were used to
    fill missing values of the USGS time series. Because each discharge time series
    represents data from the same location, values were similar and in some cases
    identical, confirming that this substitution method was adequate.


    Once the rainfall, water-level, and discharge data were continuous with no missing
    values, each time series was graphed to observe trends and seasonal patterns.
    Cross-correlation with rainfall and autocorrelation analyses were then performed
    for each station, in addition to cross-correlation with discharge analyses for
    the stations influenced by a structure, to determine the effect of structure discharge
    on water level. We determined that the correlation between past rainfall and future
    water level was not very high (Fig. 7.3a and Fig. 7.4a). Due to the random nature
    of rainfall together with the influence of control structure operation, the relationship
    between water level and rainfall is nonlinear and may not always be captured by
    a linear statistic such as correlation coefficient.


    The high autocorrelation between past and future water levels was expected, because
    past water level largely influences future water level'
