  md: '# USE OF NEAR-REAL-TIME SATELLITE PRECIPITATION DATA AND MACHINE LEARNING TO
    IMPROVE EXTREME RUNOFF MODELING


    Paul Muñoz¹,², Gerald A. Corzo Perez³, Dimitri P. Solomatine³,⁴,⁵, Jan Feyen⁶,
    and Rolando Cél­leri¹,²


    ¹ Department of Water Resources and Environmental Sciences, University of Cuenca,
    Cuenca, Ecuador

    ² Faculty of Engineering, University of Cuenca, Cuenca, Ecuador

    ³ IHE Delft Institute for Water Education, Delft, The Netherlands

    ⁴ Water Resources Section, Delft University of Technology, Delft, The Netherlands

    ⁵ Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia

    ⁶ Faculty of Bioscience Engineering, Catholic University of Leuven, Leuven, Belgium


    Extreme runoff modeling is hindered by the lack of sufficient and relevant ground
    information and the low reliability of physically based models. This chapter proposes
    combining precipitation Remote Sensing (RS) products, Machine Learning (ML) modeling,
    and hydrometeorological knowledge to improve extreme runoff modeling. The approach
    applied to improve the representation of precipitation is the object-based Connected
    Component Analysis (CCA), a method that enables classifying and associating precipitation
    with extreme runoff events. Random Forest (RF) is employed as an ML model. Two
    and a half years of near-real-time hourly RS precipitation from the'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'PERSIANN-CCS and IMERG-early run databases and runoff at the outlet of a basin
    in the tropical Andes of Ecuador were used. The developed models show the ability
    to simulate extreme runoff for the cases of long-duration precipitation events
    regardless of the spatial extent, obtaining Nash-Sutcliffe efficiencies above
    0.72. On the contrary, there was an unacceptable model performance for a combination
    of short-duration and spatially extensive precipitation events. The strengths/weaknesses
    of the developed ML models are attributed to the ability/difficulty to represent
    complex precipitation-runoff responses.


    # 6.1. Introduction


    Physically based precipitation-runoff models used in water management describe
    the physical processes that occur in a system (basin) by using balance and conservation
    equations (Clark et al., 2017). However, those models demand extensive data and
    might be subject to overparameterization, limiting their operational value (Mosavi
    et al., 2018; Young, 2002). As a solution, during the last decades, a data-driven
    approach, using Machine Learning (ML) techniques, gained popularity among hydrologists
    (Solomatine et al., 2009; Bontempi et al., 2013; Chang et al., 2019; Galelli &
    Castelletti, 2013; Mosavi et al., 2018). An important reason responsible for the
    increasing interest is the fact that ML exploits the available and relevant information
    (e.g., precipitation, past runoff) to find relations to the target variable (i.e.,
    runoff) without requiring knowledge about the underlying physical processes. However,
    apart from providing accurate hydrograph simulations, the use of ML for deriving
    inferences about the processes within a hydrological system has received considerable
    critical attention (Beven, 2020; Herath et al., 2021; Moreido et al., 2021; Nearing
    et al., 2021; Solomatine & Ostfeld, 2008). It is argued that conceptualizing and
    understanding forcing processes in a system would enable ML models to simulate
    the hydrological response beyond the range of training data, or even to transfer
    models to similar ungauged systems (Beven, 2020). Some strategies (also known
    as feature engineering) for gaining understanding can be achieved through the
    addition of mass and energy balance equations for the training task (Wang et al.,
    2019), or hypothesis testing of additional processes using additional input data
    such as soil types, land uses, topography, residence time distributions, among
    others (Huang & Lee, 2021).


    Among ML techniques, the Random Forest (RF) algorithm is preferably being used
    by hydrologists for runoff modeling (including extreme runoff magnitudes associated
    with low probabilities of occurrence) (Li'
  merge: -1
