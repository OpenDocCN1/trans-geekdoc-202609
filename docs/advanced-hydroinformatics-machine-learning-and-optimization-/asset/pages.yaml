  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_397_0.png)


    Figure 14.5 Example of Pareto front of the coupled simulated-optimization model.


    Latin Hypercube Sampling (LHS) was performed. The obtained results were used for
    developing robust strategies as well as a similarity-based selection method for
    real-time operation. The method of Homogeneous Multiple Enlargement (HME) was
