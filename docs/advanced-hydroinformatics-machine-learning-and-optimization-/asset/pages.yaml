    # 1.4.1. Artificial Neural Networks (ANNs)


    The most widely used ANN is a multilayer perceptron (MLP). An MLP ANN consists
    of multiple layers of interconnected nodes (neurons; Fig. 1.9) that process input
    vectors to produce a vector output (often a single value, however). The nodes
    in each layer first linearly combine inputs and then apply a nonlinear function
    (sigmoid or hyperbolic tangent) to transform the input further and pass the result
    to the next layer, whereas the final layer produces the network’s output. MLPs
    are typically trained by backpropagation, a method that progressively adjusts
    the weights between nodes to minimize the difference between the network’s output
    and the desired output; it can be seen as a specialized version of nonlinear gradient-based
    optimization. MLP may have several intermediate (hidden) layers, but the most
    widely used architecture uses only one. On details see, for example, Haykin (1999),
    and many other books and Internet resources.


    Overall, MLP ANNs have proven to handle complex, nonlinear relationships and large
    amounts of data, and can make predictions with high accuracy. There are hundreds
    of successful applications of ANN in water resources (see, e.g., Abr​ahart et
    al., 2012), and a MLP ANN is often seen as the first choice of a ML model.


    # 1.4.2. Regression and Model Trees


    Following a modular approach to modeling, a data-driven model should comprise
    several submodels. The training set is split into subsets corresponding to a particular
    subprocess to be modeled, and then each module (Fig. 1.1) is trained on these
    nonintersecting subsets (actually, these subsets can be intersecting, leading
    to some versions of ensemble models, but this option is not considered here).
    When a new input vector is presented, it is first classified into one of the regions
    (corresponding to the subsets) for which the modules were trained, and then only
    one module is run to generate the prediction. A class of such methods employing
    consecutive progressive splits is typically referred to as trees. Examples are
    decision trees, regression trees (Breiman, 1984), which use zero-order models,
    that is, constants, in leaves; multiadaptive regression splines (MARS) (Friedman,
    1991); and M5 model trees (Quinlan, 1992), which use linear'
