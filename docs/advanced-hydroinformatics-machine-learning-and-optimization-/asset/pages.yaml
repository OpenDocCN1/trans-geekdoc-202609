- pgno: 399
  md: 'expected to present different flood peaks and shapes and thus different severities.
    A large amount of research has studied parametric functions of hydrographs. For
    example, the study of Gądek et al. (2017) showed that the Strupczewski method
    (Strupczewski, 1964) has better suitability to both gauged and ungauged stations
    compared with UPO ERR Gamma function, which is also a widely used method (Baziak
    & Gądek, 2019). However, these two functions have complex structures. Each of
    them has five parameters, some of which are difficult to determine. Triangular
    functions were also studied in the areas that have undetermined hydrographs (Gama,
    2012). The disadvantages of this approach are the limited graphs shapes and bad
    representation of real hydrographs, even though their parameters are much fewer
    and more comprehensible. On the contrary, Gamma-like function with four parameters
    shows good shape and is able to generate different peak values, time to peak,
    skewness, and base flow when sampling. The function is


    ```

    $Q_t = Q_b + (Q_p - Q_b) \times \left(\frac{t}{T_p}\right)^{\frac{1}{S_k - 1}}
    \times \exp\left(\frac{1 - \left(\frac{t}{T_p}\right)}{S_k - 1}\right), \quad
    (14.6)$

    ```


    where, $Q_t$ is calculated discharge at time $t$; $t$ is time (counting from 0
    with unit of time step); $Q_b$ is base flow; $Q_p$ is peak discharge; $T_p$ is
    time to peak (the interval counting from the beginning of hydrograph to peak time);
    $S_k$ is the factor of skewness. However, one Gamma-like function can have only
    one peak, which for many flood events is not realistic. The available data of
    the hydrograph from 2007 (Fig. 14.1) indicates two possible subsequent flood peaks.
    Therefore, an alternative method was proposed, to assign different values to parameters
    for different periods, selected in such a way as to generate two peaks formed
    within one hydrograph (Fig. 14.7). In that approach, each parameter (base flow
    discharge $Q_b$, peak value $Q_p$, time to peak $T_p$, and skewness $S_k$) is
    sampled twice, and therefore there are eight parameters in total for one hydrograph:
    $Q_{b1}$, $Q_{b2}$, $Q_{p1}$, $Q_{p2}$, $T_{p1}$, $T_{p2}$, $S_{k1}$, and $S_{k2}$.


    Another critical element for sampling is the selected probability distribution
    of parameters, which influences the diversity of sampled results. The aim here
    is that the generated hydrographs are diverse as much as possible, but still have
    sufficient resemblance to the real hydrographs. In other words, sampled hydrographs
    should cover the conditions that may happen in future, which in fact represents
    the uncertainty. Following these requirements, the base flow and time to peak
