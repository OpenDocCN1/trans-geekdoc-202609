  md: 'volume of 0.5 mm, that is, precipitation objects with an associated precipitation
    volume of less than 0.5 mm are trimmed off. This was done on a trial-and-error
    basis validated with precipitation objects observed in randomly selected precipitation
    events. The target was to remove noise from precipitation imagery and keep only
    clear precipitation objects in the precipitation imagery (Fig. 6.4c).


    3. Filtering of the identified precipitation objects according to size criteria.
    Similarly, we found and used a number-of-pixels threshold of 6, according to a
    trial-and-error procedure with the same target as employed in step 2.


    4. The identified and filtered precipitation objects were morphologically closed
    by applying, as a final procedure, a dilatation-and-erosion algorithm for refining
    precipitation objects (Fig. 6.4d).


    5. Retrieval of physical (centroid and extension area) and hydrometeorological
    attributes (volume of precipitation, maximum intensity, precipitation duration)
    from the precipitation objects defined in step 4. For the duration of the precipitation,
    we defined two precipitation objects are considered consecutive (i.e., belong
    to the same event) when the time between their appearance is shorter than 2 hr.
    This threshold was calibrated on a trial-and-error basis.


    Additionally, a modular precipitation approach for the analysis of the precipitation
    imagery was used. For the cases when no precipitation is observed by the PERSIANN-CCS
    subproduct, we switched the precipitation data source to IMERG-early imagery,
    following a simple spatially undersampling technique. This means that an IMERG-early
    run cell of size 0.1° x 0.1° was directly divided into ~6.4 cells with a resolution
    of 0.04° x 0.04°, matching the resolution of the PERSIANN-CCS subproduct. This
    modular approach assures that all extreme hydrological events are trained with
    an existent precipitation signal, reducing noise and improving the learning process
    of the further developed runoff models.


    # 6.3.3. Classification of Precipitation Events Associated With Extreme Hydrologic
    Events


    The hydrometeorological attributes derived from the CCA analysis are used to classify
    precipitation events together with their associated runoff response. For this
    we used the following two criteria, respectively, the extension of the precipitation
    objects (local and spatially extensive) and the duration of the precipitation
    events (short and long). As a result, by defining extension and duration thresholds,
    we could establish four'
