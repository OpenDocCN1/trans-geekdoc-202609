- pgno: 64
  md: '# 2.4. Proof of Concept


    # 2.4.1. Data and Model Description


    In order to demonstrate our framework, we apply a lumped conceptual model to represent
    the monthly runoff produced upstream of Evinos dam, western Greece, which is a
    key component of the water supply system of Athens (Koutsoyiannis et al., 2003).
    The river basin area is 351.9 km², and the available hydrological data (precipitation,
    potential evapotranspiration, runoff) extends over 50 hydrological years (from
    October 1970 to September 2020). Table 2.1 summarizes the key statistical information
    of historical rainfall and runoff data (mean, standard deviation, skewness, auto-correlation,
    and cross-correlation), to be reproduced within the synthetic time series that
    are used in stochastic calibration. The latter have been generated via the anySim
    package (Tsoukalas et al., 2020), and they extend over a time horizon of 2,000
    yr. The synthesis scheme ensured the generation of dependency patterns (Fig. 2.2)
    and long-term fluctuations (Fig. 2.3) that are much wider than the ones found
    in the observed data. These are expected to represent the full hydroclimatic regime
    of the basin, which may be hidden, as a result of the limited information embedded
    in the observed data. In fact, only half of this information is accounted for
    within the split-sample calibration approach.


    Figure 2.4 depicts an outline of the model and its governing equations. The model
    employs a typical bucket-type scheme comprising three interconnected tanks, which
    gets as inputs the monthly precipitation, P, and potential evapotranspiration,
    PET. The upper tank has infinite capacity and represents the major hydrological
    processes over the terrain, namely the direct (overland) runoff, Q_D, which is
    considered as a portion κ of precipitation, and the direct evapotranspiration,
    ET_D, which is fulfilled by the water excess that is temporarily stored in the
    ground and the vegetation. The remaining water infiltrates to an intermediate
    tank of storage capacity S_max, which employs the soil moisture accounting across
    the unsaturated zone. This implements three fluxes, namely the evapotranspiration
    losses through the soil, ET_S, which are controlled by the storage ratio, S/S_max,
    and the evapotranspiration deficit, PET − ET_D, the percolation to the groundwater
    tank, W, which is controlled by a recession parameter, λ, and the saturation runoff,
    Q_S, which is represented as the excess water that overflows from the tank. Finally,
    the lower tank has infinite capacity and employs the regulation across the groundwater
    zone. In particular, it receives the percolation and generates baseflow, Q_B,
    through another recession parameter, μ. In this respect, the runoff arriving at
    the basin outlet is the sum of three components, namely, Q = Q_D + Q_S + Q_B.'
