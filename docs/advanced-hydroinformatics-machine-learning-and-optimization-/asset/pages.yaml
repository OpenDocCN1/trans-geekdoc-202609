- pgno: 341
  md: 'and end of each drought, respectively. DV is the drought cluster volume calculated
    as the number of voxels. Equations (11.3) and (11.4) were applied for each 3-D
    cluster.


    ```

    $$dd = ti - tf + 1, \tag{11.3}$$ $$ds = \sum_{t=ti}^{tf} DV(t). \tag{11.4}$$

    ```


    For each drought, the spatial trajectory was also calculated. These trajectories
    were built with the union of the centroids of the drought areas at each time step
    ($t$), following Diaz et al. (2020a). Trajectories of the largest events were
    analyzed in a similar way to Diaz et al. (2020a, 2000b) and Hosseini et al. (2021).


    # 11.2.3. Data


    For the identification of droughts, we used data from the Standardized Precipitation
    Index (SPI) retrieved from the Latin American Flood and Drought Monitor (LAFDM)
    (https://platform.princetonclimate.com/PCA_Platform/lafdmLanding.html). Within
    LAFDM, the SPI is calculated with precipitation and numerically indicates the
    magnitude of the water anomaly, and runs from -3 to 3. Being below zero, SPI shows
    a dryness condition, whereas above zero, it indicates a wetness condition (McKee
    et al., 1993). The aggregation period of 6 months in the SPI, denoted by SPI6,
    is considered a good proxy for monitoring drought condition on the surface (i.e.,
    on runoff and soil moisture), which is more relevant to the potential impact on
    agricultural activities (WMO, 2012). Thus, SPI6 data were considered for the calculation
    of droughts. The period of the analysis was 1950–2017 (816 months) on a monthly
    basis. The spatial resolution was 0.25 deg.


