  md: "already in use by Huai River commission, is able to predict flow condition\
    \ (hydrograph) at Lutaizi station using the Muskingum method from an upstream\
    \ station called Hengpaitou station. The propagation time from Hengpaitou to Lutaizi\
    \ is 36 hr (Pan, 2002), which can be considered as lead time for real-time operation\
    \ in this study. As described in Jonoski et al. (2018), the optimization of the\
    \ storage area gate operation is dependent on the simulated water level results,\
    \ which are obtained from the simulation model with input of nearly 3 months discharge\
    \ hydrograph (Fig. 14.2). Therefore, implementation of the optimization process\
    \ with incoming real-time data is not adopted, and the use of optimal strategies\
    \ obtained from preanalysis described previously (using historical data) is used\
    \ in this study.\n\nUsing the database of optimized strategies obtained from the\
    \ sampled hydrographs (already developed with ROPAR), the decision to be implemented\
    \ is made according to the most similar hydrograph in that database to the expected\
    \ real hydrograph, which is called *similarity selection*. As described previously,\
    \ having forecasts about the whole hydrograph is practically impossible, given\
    \ its very long duration, so the similarity assessment is restricted to the area\
    \ of the hydrograph around the peaks. A threshold value of $Q_0$, 5,500 m³/s,\
    \ is adopted, and only discharges above this value are considered in the similarity\
    \ assessment. The proposed criteria for estimating this similarity are as follows:\n\
    \n+   1. The first criterion compares the volume of flood peaks where discharge\
    \ is larger than 5,500 m³/s ($Q > Q_0$). This method was proposed because the\
    \ volume of the upper part of a hydrograph is one of the most critical elements\
    \ influencing flood severity downstream. If part of this volume is allocated to\
    \ the storage areas, the flood peak(s) downstream (at Bengbu City) will be reduced.\
    \ The criterion of selecting the most similar hydrograph is\n\n$$\\min FV = \\\
    left|V^R_{Q>Q_0} - V^S_{Q>Q_0}\\right|,$$  \n(14.14)\n\nwhere, $FV$ is the notion\
    \ of the flood volume method; $V_{Q>Q_0}$ is the flood volume of discharge larger\
    \ than $Q_0$; $Q_0$ is a threshold value (5,500 m³/s); the superscripts $R$ and\
    \ $S$ mean real hydrograph and sampled hydrograph, respectively.\n\n+   2. The\
    \ second criterion uses Nash-Sutcliffe efficiency coefficient (NSE), which gives\
    \ an indicator about closeness between two hydrographs. Larger NSE means better\
    \ match. Focusing again only on the upper part of the hydrograph, the equation\
    \ used for similarity assessment is\n\n$$\\max NSE = 1 - \\frac{\\sum_{t=t_1}^{t_2}\\\
    left(Q^S_{t,Q>Q_0} - Q^R_{t,Q>Q_0}\\right)^2}{\\sum_{t=t_1}^{t_2}\\left(Q^R_{t,Q>Q_0}\
    \ - \\overline{Q^R_{Q>Q_0}}\\right)^2},$$  \n(14.15)"
