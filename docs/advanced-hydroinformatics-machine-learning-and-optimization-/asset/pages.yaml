    # 6.4.4. Event-Based Runoff Modeling


    First, we defined the dimension of the input feature space of all extreme runoff
    models as a combination of current time precipitation together with past precipitation
    and past runoff data influencing current time runoff. In this regard, results
    from partial- and auto-correlation functions for runoff suggest using past lags
    (hours) from 1 up to 12 lags, with a 95% confidence level for both correlation
    functions. Similarly, the cross-correlation function for precipitation determined
    13 past lags (hours) of precipitation with correlations higher than 0.2. These
    results are congruent with the concentration time of the Jubones basin, which
    was estimated at 11 hr by averaging the concentration times found with the equations
    of Giandotti, Johnstone, and the U.S. Army Corps of Engineers (equations recommended
    for the basin area, see de Almeida et al., 2014).


