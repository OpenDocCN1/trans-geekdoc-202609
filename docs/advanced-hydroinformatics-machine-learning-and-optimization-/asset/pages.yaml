    Station NP201 was used as an example to present the results of the water-level
    forecasts. The TDNN model accurately predicts the water level 1 day ahead, over
    the 3 yr sequential test data, with an RMSE of 0.017 m (average water level =
    1.8 m) and an R² of 0.997. The peaks and continuous changes in water level are
    well predicted in the first 200 days of the'
