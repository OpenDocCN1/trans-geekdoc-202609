- pgno: 12
  md: '# PREFACE


    Hydroinformatics deals with advanced information technology, data analytics, modeling,
    artificial intelligence (AI), and optimization applied to problems of aquatic
    environments for the purpose of informing management. Many of these technologies
    have become standard tools that support water management decisions around the
    world. However, the technologies continue to develop and new ones are emerging,
    which allows them to be applied to more complex and interesting problems. There
    are multiple examples of environmental and hydrological problems being dealt with
    not only by employing physically based (process) models but also with advanced
    data analysis tools and machine learning models.


    The rapid development of machine learning and AI brings new possibilities for
    hydroinformatics research and practice. Nowadays, complex issues are analyzed
    by identifying and explaining patterns and anomalies of measured or simulated
    data. With an increasing amount of data collected about the environment, physically
    based models are increasingly complemented (and sometimes even replaced) by data-driven
    models. Although data-driven models lack the ability of physically based models
    to explain the physics of underlying processes, they are able to discover the
    hidden patterns in data and often can be more accurate in forecasting. Thus, they
    play an important role. Pattern recognition has been one of the main tasks solved
    by machine learning, and lately has been given an additional push by the development
    and use of deep learning, an important class of machine learning algorithms and
    of AI in general.


    Data analytics plays an important role in water resources when data are multidimensional,
    and spatial and time dimensions have to be dealt with in a coordinated fashion.
    In relation to water resources, both dimensions were always important, but recently
    the need to handle huge amounts of remote sensing data (big data) has become more
    pronounced. These developments have motivated new research efforts in the context
    of predicting hydrological extremes and called for testing novel approaches of
    spatiotemporal data analysis and machine learning. In many problems, machine learning
    applied to hydrological extremes is studied in connection with uncertainties.'
  merge: -1
  img_proc: true
