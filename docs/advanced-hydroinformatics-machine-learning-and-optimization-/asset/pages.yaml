    (using the same algorithm) yielded the best results. When comparing the two optimizers,
    similar results were observed between the MLP functions, with better outcomes
    from the NSGA II. This may be because the decision space in this study was not
    oriented toward a specific area of preference; however, the MOEA / D results may
    be improved by narrowing the decision space (Ma et al., 2015). Biasing the Pareto
    front toward a specific area, better convergence could be achieved by covering
    an area of interest. Regarding the RBN functions, the MOEA / D optimizer did not
    converge. In the case of the LF, the results were considerably lower according
    to the hypervolume indicator, which shows that this function does not simulate
