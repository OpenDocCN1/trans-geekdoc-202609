- pgno: 152
  md: '(FDC) were used to evaluate the performance of specific ranges of discharge
    simulation. Following Yilmaz et al. (2008), we partitioned the FDC into three
    different segments (1) high-flow segment (0–0.02 flow exceedance probabilities)
    characterizing watershed response to significant precipitation events; (2) midflow
    segment (0.2–0.7 flow exceedance probabilities) that specifies by flows from moderate
    size precipitation events and also related to the intermediate-term primary and
    secondary base flow relaxation response of the watershed system; and (3) low-flow
    segment (0.7–1.0 flow exceedance probabilities), related to the long-term sustainability
    of flow and controlled by the interaction of baseflow with riparian evapotranspiration
    (ET) during extended dry periods. A steep slope in the midsegment FDC reflects
    a watershed having a quick or flashy response (due to small soil storage capacity
    and hence larger percentage of overland flow) while flatter midsegment slopes
    are associated with slower and more sustained watershed response to precipitation
    events.


    # 5.2.2. Study Region and Data


    The study region is the Northeast Cape Fear River Basin (hereafter NE-CFB), North
    Carolina, USA (HUC 03030007), which drains 1,714.70 mi² (4,441.1 km²) of the Cape
    Fear River Basin (CFRB). The CFRB is one of the four river basins entirely contained
    within the North Carolina border. The river is formed by the Deep, Rocky, and
    Haw rivers, which converge in Chatham County just below the B. Everett Jordan
    Dam. The river ends in 32,000 acres of the estuary near Southport. The CFRB is
    the largest river in North Carolina, encompassing a 9,000 mi² basin that includes
    streams flowing within 29 of the state’s 100 counties. With about 27% of the state’s
    population and dozens of municipalities situated within its boundaries (including
    Greensboro, Burlington, Chapel Hill, Sanford, Fayetteville, Dunn, Clinton, Warsaw,
    Burgaw, and Wilmington), the CFRB is one of the most industrialized regions in
    North Carolina. These and other cities and towns rely on the river and its tributaries
    for freshwater, transportation, recreation, natural habitats, and other uses.
    The CFRB flows into the Atlantic Ocean near Cape Fear, from which it takes its
    name. This study used CAMELS (Catchment Attributes and Meteorology for Large-sample
    Studies) data set described in Newman et al. (2015) and Addor et al. (2017). CAMELS
    is a basin-scale hydrometeorological forcing data that covers 671 catchments in
    the contiguous United States (CONUS). The data set provides daily meteorological
    forcing from three data sets, Daymet (Thornton et al., 2012), Maurer (Maurer et
    al., 2002), and NLDAS (Xia et al., 2012), as well as a daily streamflow gauging
    data'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'set from the U. S. Geological Survey (USGS). Meteorological forcing data used
    in this research include daily maximum and minimum temperatures, daily precipitation,
    solar radiation, and vapor pressure deficit. The NE-CFB data set was used to perform
    this research and predict daily streamflow records. A conceptual framework of
    proposed modeling research is presented in Figure 5.1. As illustrated, the NE-CFB
    streamflow records were calibrated using multiple ML approaches. The modeling
    results were then compared with the SAC-SMA simulation using various performance
    indices.


    # 5.3. Results


    This research used 10 yr of daily streamflow records, from 01 Jan. 2000 to 31
    Dec. 2009, as a training data set, and then the next 4 yr (01 Jan. 2010 to 31
    Dec. 2013) as an independent test period. The training period is critical to result
    in reasonable and reliable simulation because a small division of the data set
    from the training period would lead to overfitting. The ML results were also compared
    with the SAC-SMA simulation to determine the degree of modeling success. Various
    performance metrics were then calculated and presented in Table 5.1 for both calibration
    and validation performance assessments. The values of NSE and KGE for the SAC-SMA
    and multiple ML models suggest that the Bayesian Lasso method performed well in
    both calibration and validation periods. This revealed that a regression model
    with independent Laplace (i.e., double exponential) prior distribution could handle
    the complexities of high and low flow fluctuations across a coastal plain drainage
    system. As shown in Table 5.1, the Bayesian Lasso even outperformed the SAC-SMA
    hydrologic simulation. Furthermore, the SVM performed as well as the SAC-SMA while
    the RF performed better in rainfall-runoff simulation. Among different indices,
    KGE appears to be a better index for estimating the agreement between observed
    and simulated coastal plain streamflow records. KGE is a nonlinear combination
    of correlation, flow variability measure, and bias; thereby it appears to be an
    appropriate metric to evaluate the impacts of flow variabilities on simulation
    results. With respect to the FDC segments, Bayesian Lasso successfully captured
    high and low flow fluctuations while most of the ML models were less successful
    in calibrating moderate streamflow records or missegment the FDC (0.2–0.7 flow
    exceedance probabilities). This might reflect the fact that the response of watershed
    to moderate precipitation events varies largely over time depending on timing
    (e.g., month, season) and depth and duration of precipitation with space along
    the landscape.'
