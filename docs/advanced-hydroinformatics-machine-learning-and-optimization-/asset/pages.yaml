- pgno: 207
  md: '# 7.5. Comparison of Measured Rainfall and NWP Rainfall Forecasts


    The ECMWF rainfall forecasts were used as predictors for the models built in this
    study, and their accuracy (i.e., to what extent they can be assumed to represent
    the rainfall) is an important issue. Rainfall forecasts are prone to error due
    to the random nature of rainfall, particularly in the tropics where high temperatures
    as well as reduced influence of the Earth’s Coriolis forcing on atmospheric circulation
    at these latitudes, result in challenges in weather forecasting (Sobel, 2012).
    Despite the presence of error in daily forecasted rainfall amounts, seasonal averages
    provide an understanding of the comparability of the forecasted rainfall to the
    measured rainfall. The maps in Figure 7.5 show that the differences in average
    rainfall between the gauged measurements and the forecasts are not very significant.
    The dry season (approximately Nov–Apr) rainfall total (sum of all the totals)
    for the gauges used in this study was 3,883 mm over the dry periods of the 3 yr
    prediction period 2008–2010. The sum of the forecasted precipitation for the 4
    ECMWF grid cells covering the general locations of the gauges (Fig. 7.5b) was
    3,725 mm. For the wet season (approximately May–Oct), the sum of total rainfall
    from the gauges was 15,972 mm, while the sum for the four forecast grid cells
    was 14,316 mm (Fig. 7.5d).


    In addition to the inherent error in rainfall forecasts, the forecasts are averaged
    over a ~50 × 50 km grid whereas a gauge records point rainfall. The effect of
    error in the daily rainfall amounts being used as model predictors will be analyzed
    in the water-level predictions, but it is expected that error will be greater
    as the forecast lead time increases.


    # 7.5.1. Model Development


    The architecture of the TDNN model is a multilayer perceptron feed forward network.
    The nodes in the input layer have the input features of rainfall and water level,
    but additionally has those same inputs delayed by one or more time steps. More
    detail on the TDNN can be found in Lingras et al. (2008). The LSTM model architecture
    is similar to a standard Recurrent Neural Network (RNN), but the difference is
    the presence of memory blocks in the LSTM allowing it to store long-term information
    and later access it. Within these memory blocks are multiplicative units called
    gates, which facilitate the storage and access of long-term information (Xiang
    et al. 2020). A further description of LSTM networks and memory cells can be found
    in Hochreiter and Schmidhuber (1997) and Graves (2012).'
