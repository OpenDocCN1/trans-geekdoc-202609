- pgno: 87
  md: 'evaluation. The root mean square error (*RMSE*) is used to evaluate performance
    in this stage. It can be described as


    $$RMSE=\sqrt{\frac{1}{N}\sum_{i=1}^{N}(S(i)-O(i))^2}, \tag{3.7}$$


    where $S(i)$ is *NSE* or *Bias* calculated by SM with the $i^{th}$ set of parameters;
    $O(i)$ is *NSE* or *Bias* calculated by VIC with the $i^{th}$ set of parameters.


    If the values of *ER* of SM-I and *RMSE* of SM-II are less than the allowance
    error set by users, SM is built. Otherwise, we set $N=N+1$ and return to Step
    1 to acquire more samples to train SM-I and SM-II until the *ER* and *RMSE* values
    meets the requirement.


    # *Performance Metric of the Surrogate Model*


    The Pareto solutions of SM are acquired and the parameter sets given by SM are
    validated with VIC. The distance between the center points of the two-point groups
    (one is the Pareto fronts of SM and the other is the points consisting of the
    objective values, which are calculated with the Pareto solutions of SM in VIC)
    is used to evaluate the performance of SM. Here, we define a center point as a
    point with the minimum sum of distance to all the points, which is shown as


    $$\min \sum_i d=\sum_{i}^{n}\lVert x_0-x_i\rVert, \tag{3.8}$$


    where the vector $x_0$ is the position of center point and the vectors $x_i$ ($i=1,
    2, 3, \ldots,n$) are the positions of $n$ Pareto optimal points; $\lVert\cdot\rVert$
    is the norm of vector. If the distance of the two center points is less than a
    specified value, the parameter calibration is complete. Otherwise, SM will be
    updated with the data mixing the original samples, which is used in the previous
    iteration with the validated values and then the next iteration will be conducted.


    # 3.3. Study Area and Data


    To show the performance of the proposed surrogate model, we choose the Lanjiang
    River (LJR) basin and the Xiangjiang River (XJR) basin, which are located in different
    parts of China. They have different features in land cover, dominating processes,
    and meteorological conditions in case studies to investigate the role and efficiency
    of a large and complex hydrologic model. The locations of the two basins are shown
    in Figure 3.3.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_88_0.png)


    **Figure 3.3**  Location of (a) the Lanjiang River basin and (b) the Xiangjiang
    River basin.


    The LJR is located on the upper reach of the Qiantang River basin in Zhejiang
    Province in the southeastern China on the west coast of the Pacific Ocean. The
    LJR basin covers an area of about 1.8 × 10⁴ km² controlled by the Lanxi station.
    The basin is a humid region with annual average precipitation of about 1,600 mm
    and annual average temperature about 17°C, dominated by the maritime air masses
    in summer and the continental air masses in winter. Rainfall in the basin is concentrated
    at the turn of spring and summer and the high flow occurs during the plum rains
    from May to July. Besides the plum rains, the typhoon in summer also influences
    the hydrologic regime in the LJR basin, sometimes resulting in catastrophic floods.


    The XJR is located in a humid region in southern China, about 856 km long, which
    is one of the largest tributaries of the Yangtze River. The river flows into the
    Dongting Lake, the second largest freshwater lake in middle China. The area of
    the basin above the Xiangtan station is about 8.2 × 10⁴ km². The basin elevation
    ranges from 1 m above sea level to over 2,000 m in the upstream mountainous areas,
    but most regions in the Xiang River basin are plains. Dominated by a subtropical
    high over'
