- pgno: 199
  md: 'Many ML models use real-time data in forecasting, but there is a lack of research
    as it relates to the use of Numerical Weather Prediction (NWP) (Pu & Kalnay, 2019)
    in predicting over longer forecast horizons. Additionally, from the characteristics
    of the numerical models mentioned as well as the issues faced by both water managers
    and ecologists, improved forecasts could assist operational water management and
    ecological assessments, particularly under the CERP.


    The main objective of this study is to apply and test ML models to potentially
    complement conventional numerical models in an effort to improve water-level forecasting
    in the southern Everglades. Reaching this objective involved choosing suitable
    predictors for forecasting water levels. Two ML model architectures used to predict
    water level were tested for various forecast horizons and compared with a numerical
    model. A novel aspect of this study is analyzing the effect of NWP on the accuracy
    of the water-level predictions.


    # 7.2. Methods


    The southern Everglades is an important resource because ENP is one of the last
    remaining natural parts of the Everglades. The area just south of Tamiami Trail
    (Fig. 7.2) was identified as an area where water-level forecasts would be beneficial.
    Because restoring hydrologic conditions in the natural ecosystem is a primary
    objective of the CERP, water-level forecasts are essential to inform and aid restoration
    efforts as well as water resources management.


    Five stations in the area were selected (Fig. 7.2). Station P33 was identified
    as an index station, considered to be representative of water levels and hydroperiods
    in Shark Slough, a low-lying area that is the main drainage through ENP. Station
    NP201 was selected from a map of the EDEN network (https://sofia.usgs.gov/eden)
    on the basis of its relative proximity to Tamiami Trail, as was station BCA11
    (also selected to provide spatial representation along the trail). Finally, two
    stations influenced by control structures S12A_T and S12D_T (Fig. 7.2) were selected
    to allow for the consideration of discharges from water-control structures.


    For each station, rainfall, evapotranspiration, and water-level data were available,
    while discharge data were available for the control structures S12A and S12D (vertical
    lift gates), all at a daily resolution. The rainfall, evapotranspiration, and
    water-level data had an 18 yr period of record (1 Jan 2002 to the present), 23
    yr (1 Jun 1995–31 Dec 2018), and 30 years (1 Jan 1990 to the present), respectively,
    for all the stations. An exception was BCA11, which had a water-level record from
    28 Dec 1990 to present.'
