    # 11.4. Summary and Conclusions


    This research introduces a method of calculating the optimal cluster size filter
    for the 3-D characterization of drought. The combined effect of the cluster size
    filter and different drought indicator thresholds to calculate drought is also
    presented. The methodology was tested in South America with data from the Latin
    American Flood and Drought Monitor (LAFDM) for 1950–2017.


    The following conclusions are drawn:


    +   1. The drought indicator thresholds of 0, −1, −.5, and −2 were tested. In
    general, the −1.5 and −2 thresholds produce more drought events with shorter durations
    and smaller magnitudes (sizes) than the threshold of −1. The threshold of 0 produces
    a long-lasting drought event and some small events. Based on the results, this
    threshold is not recommended as a method of calculating 3-D drought clusters.

    +   2. The optimal cluster size filter depends on the spatial resolution of the
    data and the threshold used.

    +   3. Durations and magnitude (number of voxels) are mainly concentrated in less
    than 20 months and 10,000 voxels. Few events lasting around 24 months or longer
    are observed. A linear relationship between these two characteristics is found
    (R² = 0.89).


    The main findings for South America are as follows:


    +   1. Droughts of 2 to 6 months are observed practically throughout the entire
    study area, as well as 12-month droughts.

    +   2. Some regions show the little occurrence of droughts, such as the Amazon
    basin, the upper Magdalena River basin in Colombia, the north of Uruguay, the
    northwest of Argentina, and the south of Chile. One of the areas with the least
    occurrence is the lower Amazon basin, near the discharge.

    +   3. The 1957–1972, 2006–2017, and 1984–1994 droughts were the most extreme.


    In general, the occurrence of the calculated droughts coincides with the information
    reported. The 1960s, 1980s, 1990s, 2000s, and 2010s were the periods with more
    droughts.'
