  md: 'the approximation and details coefficients:


    $$x(t) = \sum_{n=-\infty}^{\infty} S_{m_0,n}\,\phi_{m_0,n}(t) + \sum_{m=-\infty}^{m_0}
    \sum_{n=-\infty}^{\infty} T_{m,n}\,\psi_{m,n}(t),\quad (9.2)$$


    Addison (2010), where the signal detail is defined as $d_m(t) = \sum_{n=-\infty}^{\infty}
    T_{m,n}\,\psi_{m,n}(t)$. If we add the signal detail at a certain scale to the
    signal approximation, we get the signal approximation at an increased resolution;
    this is known as multiresolution representation.


    However, is also possible to reconstruct the approximations and details themselves
    from their coefficients vectors. By making use of the multiresolution decomposition
    algorithm that allows generating all coefficients at any scale just by knowing
    the coefficients at previous scales.


    $$S_{m+1,n} = \frac{1}{\sqrt{2}} \sum_k c_k S_{m,2n+k} = \frac{1}{\sqrt{2}} \sum_k
    c_{k-2n} S_{m,k}\quad\text{Addison (2010)},\quad (9.3)$$


    $$T_{m+1,n} = \frac{1}{\sqrt{2}} \sum_k b_k S_{m,2n+k} = \frac{1}{\sqrt{2}} \sum_k
    b_{k-2n} S_{m,k}.\quad (9.4)$$


    For the derivation of these formulas, the reader should consult Addison (2010).
    Many of the concepts explained here were taken from the aforementioned work.


    Now in the two-channel subband encoder algorithm, there is a decomposition step
    that consists of retaining one coefficient of two (downsampling) known as decimation
    (no information repeats). The aforementioned algorithm is suitable for compression
    purposes, however, lack of redundancy in the coefficients creates a system whose
    outputs depend explicitly on time (shift-variant system), an undesirable property
    for forecasting problems. Another problem arises when choosing algorithms, the
    well-known cone of the influence region. Errors in the limit regions (especially
    in the right boundary) propagate within the decomposition (approximation and details
    coefficients) proportionally to the chosen scale within an area of the cone. This
    represents a problem for forecasting purposes, where at each time step a new entry
    is placed on the right-hand side of the boundary. To visualize the problem, in
    Figure 9.1 a segment of the signal is analyzed. When the wavelet function interrogates
    the signal along the time axis, at locations and scales (dyadic system), and when
    reaching the end of the signal, the problem arises. The assumptions are necessary
    to close the analysis of the band-pass filter (for the high-pass filters and also
    for the low- pass ones). To overcome the problem, future points must be interpolated.
    If we use future values of the signal, we are violating the test phase of our
    model (future data are unknown at that'
