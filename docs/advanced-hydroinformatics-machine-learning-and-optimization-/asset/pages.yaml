- pgno: 22
  md: 'interpret text and reinforcement learning concepts to use DL. Pattern recognition
    uses convolutions and DL, which develop pattern recognition to extract features.
    Finally, metaheuristics provide the basis for new models of DL. The following
    are some of the concepts used in this chapter:


    +   1. ML (machine learning). Mathematical models that aim to represent groups
    and/or input-output relationships from data

    +   2. NLP (natural language processing). The use of language elements, in general,
    text encoded into numbers and its analysis, mainly from the transformation of
    text and processing it to solve, replicate semantics, and understand them

    +   3. Pattern recognition. ML can be characterized as a subarea that explores
    how data and their attributes (variables or features) can be detected. Many ML
    algorithms do implicitly detect patterns and therefore these areas are interrelated.
    Computer vision is an important area of their application. It is worth noting
    that a number of important pattern recognition mathematical apparatus and algorithms
    are not explicitly positioned in the machine learning realm, for example, procedures
    of denoising and filtering, segmentation of images, 3D virtual reality patterns,
    vector fields flow, but they for sure contribute to solving the pattern recognition
    problems.


    # 1.2.2. Machine Learning (ML)


    There are various ways of contextualizing ML. From the perspective of computer
