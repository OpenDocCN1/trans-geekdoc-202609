    # 9.6. Conclusions


    Wavelets and ANN coupled together proved to be of great value and easy to apply,
    the best of all the models tested. So far, many researchers have come to the same
    conclusion; however, the contribution of this work is the insertion of de-noising
    techniques using optimization tools. The results ended up being superior to the
    best WANN model. This was to be expected, since filtering the noise in the time
    series should reduce the spread of these errors to the result. Related jobs in
    the future may test these procedures under different catchment conditions. Other
    suggestions to explore could be the following:'
