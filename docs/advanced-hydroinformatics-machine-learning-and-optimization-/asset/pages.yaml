    # 1.3.2. Input Variable Selection (IVS) (Feature Engineering)


    It is important to ensure that a ML model would use the data and variables relevant
    for the objective of data analysis or modeling. Selecting the relevant variables
    (features) is referred to as feature engineering, or input variables selection
    (IVS). Input variables have to have relatedness to the output, and the simplest
    method here would be to use correlation analysis, or average mutual information
    (AMI). The correlation analysis reflects only linear relationships; therefore,
    when processes are highly'
