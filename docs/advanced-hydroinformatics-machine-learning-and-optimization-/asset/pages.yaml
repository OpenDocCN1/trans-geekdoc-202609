- pgno: 241
  md: '# 8.5. Experimental Setups


    # 8.5.1. Data Analysis for Input Variable Selection


    The goal of the MLP-ANN forecast model is to generalize the relation between the
    input (past rainfall, potential evapotranspiration, and discharge) and output
    (discharge at different lead time). One of the first tasks is to identify the
    maximum forecast horizon, which is possible to predict discharge using observed
    data. This is done by an analysis of the physical characteristics of the basin
    that allow one to identify the reaction or response time. Figure 8.4 shows the
    observed mean areal rainfall and discharge in La Canoa station for a high-flow
    event. It is possible to conclude that the time between the rainfall event (20
    Nov, 15:00) and the discharge peak (21 Nov, 03:00) is 12 hr. Certainly, this response
    or reaction time can vary in different high-flow events since it depends on the
    spatial distribution of the rainfall or the soil moisture. Nonetheless, the rainfall
    is considered an average calculation across the catchment. Hence, different MLP-ANN
    models will be trained to predict discharge at 1, 2, 3, 4, 5, 6, 9, and 12 hr
    ahead.


    The selection of the model inputs in the MLP-ANN hydrological forecasting is extremely
    important. Another important task is the selection of the appropriate lags since
    the dynamic of the catchment can be approximated by a set of variables that are
    properly discretized and lagged with


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_241_0.png)


    Figure 8.4 Response time based on the physical characteristic of the catchment.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'respect to the output discharge (Solomatine & Dulal, 2003). For this study,
    the hydrometeorological variables that influence the predicted discharge at La
    Canoa station are the rainfall, evapotranspiration, and discharge itself. However,
    it is important to state that not all of these variables have a substantially
    influence on the output discharge. The analysis of interdependency of variable
    allows one to identify the hydrometeorological variables and lags that have a
    major influence on the output prediction. In this way, Figure 8.5 presents the
    Correlation Coefficient (CoC) and the Average Mutual Information (AMI) analysis
    between the discharge at 1 hr ahead and the rainfall, evapotranspiration, and
    discharge itself. It can be seen that the past discharge provides the maximum
    AMI and CoC at a lag 1 hr and then start decreasing, which means that past discharge
    has a major effect on predicting the discharge itself. Additionally, the AMI and
    CoC for the rainfall variable start rising at a lag around 10 hr, and then start
    decreasing at a lag around 14 hr; this behavior means that the rainfall data from
    10 to 14 time steps back can be used as a model input. Furthermore, the


