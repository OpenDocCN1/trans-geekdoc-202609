    10 weak predictors were trained and then assembled into a strong predictor. In
    order to make sure that SM meets the demand of the accuracy in our study, we use
    the hold-out cross validation to validate the training results. In this study,
    when the *ER* value in SM-I is less than 10% and the *RMSE* value in SM-II is
    less than 5% of the crucial range, the training of the two-stage surrogate model
    is completed.


