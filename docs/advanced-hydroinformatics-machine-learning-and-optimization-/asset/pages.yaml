- pgno: 282
  md: 'For cross-validation between all k-folds, we used the early stop method to
    avoid overfitting. A common practice is to average the performance across the
    entire validation set for all the folds used to select the best structure from
    the ANN model (in this case, HN). This is done to emulate randomness and therefore
    represent statistical independence. The average here, by default, would decrease
    the possibility of having poor results in future tests, due to the average effect.
    Only it would also reduce the chances of getting the best results. However, in
    the example in this study, the test set was never submitted to the process, nor
    was it considered to guarantee the best results. The best fold was selected and,
    subsequently, we evaluated the parameters obtained in the test partition. To keep
    the same conditions for the following experiments (WANN and WANN without noise),
    only the third fold (the best fold in the ANN structure) was used. By doing this,
    the expected improvement would not be a reflection of other factors, such as better
    matching of subsets. Therefore, the improvement could be attributed to the chosen
    modeling method.


    Figure 9.7 shows how the behavior differs according to the particular data selection
    or fold during the training process, highlighting the importance of the k-fold
    cross-validation procedure. The same chart was built for the remaining 19 HNs,
    however only the best result is shown here (for HN = 20). Although Figure 9.8
    highlights that nodes 9–11, 15, and 17 provide poor results for the test set,
    the modeler is not allowed to use this set to choose the best model. The best
    model is chosen via the best cross-validation set. Table 9.3 shows a summary of
    statistics and error measures belonging to the best ANN model (third fold of HN
    = 20), in section 9.5.3. The training set gave an RMSE value of 91.81 m³/s considered
    as good for the case study; the validation set gave an even better result of 84.79
    m³/s. In the test set, a mildly acceptable result was obtained (112.44 m³/s).
    A high correlation was found between the observed and simulated discharge for
    all data sets, being in all cases greater than 0.9.


    # 9.5.2. Wavelet ANN Model


    Results in Figures 9.10, 9.11, and 9.12 depict the individual best folds per decomposition
    level and number of hidden nodes. Figure 9.9 shows the pseudocode used for the
    WANN structure. No obvious pattern is observed in the variable space for the model
    performance, however after spotting the best combination through cross-validation,
    a clear improvement is observed in performance. In doing so, the training data
    set RMSE was reduced in 16.1%, from 91.8114 m³/s (ANN) to 77.0193 m³/s (WANN).
    The validation set showed a slight drop in performance, 1.6%'
