    # 12.4. Generating the Training Sets for Deep Learning Studies


    The new integrated classification capacity of the SRS-GDA toolbox makes it possible
    to automatically produce labeled training sets from tens of thousands of large-scale
    environmental images for deep-learning applications in feature recognition and
    forecasting. In this process, the attributes such as those spatial features (location,
    size, and orientation) can be quickly identified to precatalogue the data or images
    into different labels/classes. To present this, an Alexnet model of convolution
    neural network (CNN) is built to demonstrate the process of auto-identifying the
    daily rainfall patterns in GB, using the training sets auto-labeled by the enhanced
    SRS-GDA toolbox. There are four labels used in this test: (1) no rainfall (L0),
    (2) concentric pattern (L1), (3) elongated pattern (L2), and (4) compound pattern
    (L3), as shown in Figure 12.3.


    As the overhead demand for computation (e.g., more than 40,000 daily rainfall
    images), Alexnet, which is a type of CNN, was constructed for training because
    it reduces the overfitting and allows for multi-GPU training, which reduces the
    training time (Krizhevsky et al., 2012). There are eight layers in the Alexnet
    model, with the first five being convolutional layers with the kernel size of
    11 × 11, 5 × 5, and 3 × 3 and the last three fully connected layers. The structure
    is such that the first convolutional layer (11 × 11) following by an overlapping
    max pooling layer, connected to the second convolutional layer (5 × 5), which
