  md: 'Hubei, Henan, Anhui, Shandong, and Jiangsu. It is the seventh largest river
    basin in China, with a drainage area of 270,000 km² approximately. The population
    living in the basin is 165 million. The basin average annual precipitation is
    about 894 mm, of which more than 70% occurs during the flood season from June
    to October. The spatial distribution of precipitation is quite uneven, decreasing
    from 1,400 mm in the southern mountain region to less than 700 mm in the northern
    region near the Yellow River. Although the basin-average annual runoff is about
    230 mm, the temporal and spatial distributions are highly uneven due to climatic
    variability.


    # China''s Major Rivers


    The large region scale (or national scale) study area includes a total of 63 major
    river systems in China as shown in Figure 13.1. Some of these are the Yellow River,
    Yangtze River, Pearl River, Haihe River, Huaihe River, Heilongjiang River, Liaohe
    River, Taihu Lake, Chaohu Lake, and Dianchi Lake.


    # 13.2.2. Monitoring Campaign and Data Processing


    The water quality data for this study are obtained from the China National Environmental
    Monitoring Centre that operates 148 automatic water quality monitoring stations
    all over China, 91 of which are available and effective displayed as dark dots
    in Figure 13.1. The weekly monitoring values are used for analysis. The water
    quality parameters monitored consist of pH, dissolved oxygen (DO), total organic
    carbon (TOC), permanganate index (COD_Mn), and ammonia nitrogen (NH3-N). Among
    these, we mainly focus on DO, COD_Mn, and NH3-N in this study. Most of the stations
    considered in this study are located on the east side of Heihe-Tengchong line,
    in an economically developed area.


