  md: '# 15.3.2. Building ML Surrogate Models of the Real Reservoir Operation


    As mentioned in section 15.2.1, the information about operating rules of the reservoir
    were not available for the case study. Therefore, ML surrogate models were used
    to simulate the operation of the reservoir. That is, to represent the amount of
    water that must be released at each time step through models that learn from the
    real data of the reservoir. This method in which the model learns from known output
    data or examples is known as supervised learning (Cunningham, 2008).


    Initially, the parameterization of the reservoir’s actual discharge Q_t was sought
    for the analysis period, in which three ML models were tested: MLP, RBN, and LF.
    The outputs Q_t correspond to total discharges (i.e., turbine discharge, valves
    discharge, and spills).


    Considering that the correlation coefficient is commonly used to determine mathematical
    linear relations between two samples of random variables, or time series, correlation
    analysis was applied to select the inputs of the ML models, similar to Corzo (2009).
    Therefore, these correlations were performed between discharges at each time step
    t and the other time series (i.e., inflows, reservoir storages levels, and previous
    discharges). Correlation analysis revealed that for the inflows IN, the storages
    levels


