    finally would be compared with the results from ROPAR under the same flood conditions.


    # 14.2.5. Uncertainty Analysis of Inflow


    Due to the limitation of availability of enough inflow data in the study area,
    it was decided to sample synthetic hydrographs using parametric functions instead
    of analysing historical records. The function is'
