- pgno: 118
  md: 'be combined using a time-varying seasonal index extracted from a state variable
    or climatic data to weigh the specialized models (Oudin et al., 2006).


    The fuzzy committee approach by Solomatine (2006) uses a membership function to
    express the difference in the degree of believability of the outputs of two models
    (high and low flow models). The membership function allows for a soft combination
    of models’ output and prevents unrealistic discontinuities in the simulated system
    behavior (Fig. 4.1).


    This research explores the fuzzy committee models first presented by Solomatine
    (2006) and further developed by Fenicia et al. (2007) and Kayastha et al. (2013),
    by building and combining different specialized models across weighting schemes
    and membership functions. In this chapter, different fuzzy committee model setups
    are tested with different goodness of fit. As recommended by Kayastha et al. (2013),
    weighting schemes with a power parameter of a value of 2 and 3 are considered.
    A thorough study is performed on the relation between the fuzzy committee parameters
    (the membership function (gamma, delta), the weighting schemes’ type, and power
    parameter) and their effect on the model performance. The fuzzy committee concept
    is applied to a conceptual distributed model. Two cases are considered. The first
    uses lumped catchment parameters where two specialized models represent the whole
    catchment. The second uses distributed parameters where each cell is represented
    by two specialized models.


    # 4.2. Case Study


    The study catchment is in the Jiboa River in the central part of El Salvador.
    The catchment spreads over 432 km² with the outlet stations Puente Viejo located
    at (13.52° N, 88.98° W) (Fig. 4.2). The catchment consists of four topographical
    areas: (1) San Vicente Volcano with an elevation of 2,171 m a.s.l (above sea level)
    and very steep slopes, (2) the Ilopango Lake (covers an area of 70 km²), (3) the
    Balsamo mountain range area with an elevation of 1,000 m a.s.l, and (4) the coastal
    plain area with elevation ranges from 0 to 100 m a.s.l.


    The basin is instrumented by a telemetry system of 15 min time step rainfall gauges
    and a water level gauge at the outlet of the catchment. For calibration of the
    model, rainfall and water level values were aggregated to the hourly time step,
    while the water level was further converted into discharge using a rating curve
    equation. Monthly potential evapotranspiration values were obtained for each station
    using a potential evapotranspiration-elevation relation derived by Hargreaves
    method and'
