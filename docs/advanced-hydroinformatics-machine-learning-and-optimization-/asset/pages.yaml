  md: '# 7.6.3. Medium-Range Forecasts


    As expected with longer forecast horizons, the accuracy is notably reduced in
    the 7 day and 10 day water-level predictions. Similar to the 2 day and 3 day forecasts,
    peaks in medium-range predicted water level can be linked to peaks in the rainfall
    forecast. A combination of the error in the rainfall forecast used to predict
    both forecast horizons, as well as the propagation of error from the prediction
    at each lead time, could contribute to the larger error at these lead times. The
    two medium-range forecasts had RMSE values of 0.069 m and 0.094 m, and R² of 0.94
    and 0.89, respectively. The general pattern of the measured data is still preserved
    in the forecasts despite some overprediction of the two latter peaks (Fig. 7.9b).


    Even at such a long lead time, some peaks are still well predicted due to reasonably
    accurate rainfall forecast points. For the 7 day water-level prediction, peak
    1 is delayed in comparison to the measured data. Table 7.3 indicates there is
    no forecasted rainfall to drive the prediction of the peak on time and as a result,
    it arrives late. Peak 2 occurred a day late, which coincides with a peak in forecasted
    rainfall being forecasted a day late. Peak 3 was well predicted due to accurate
    timing and comparable magnitude of the forecasted rainfall to the measured rainfall
    (Table 7.3). From day 139 to 200, there is significant lag, which causes point
    errors as large as 0.35 m at around day 143 (Fig. 7.9c). There is very little
    forecasted rainfall at the point where the measured water level increased and
    resulted in the model not predicting the increase at that point. This error would
    have grown from the 2 day forecast horizon, which did not have a comparable forecasted
    rainfall peak in the measured data. With each lead, the consequent error in the
    water-level prediction would have grown as a result of prediction errors due to
    inaccurate rainfall forecasts, and the inherent prediction errors with larger
    lead time forecasts.


    The error of the outlier peak predicted in the dry season of 2009 propagated through
    each time step, resulting in point prediction errors of as high as 0.70 m at the
    point where the largest peak in predicted water level occurs, just before the
    measured water level begins to increase (7 day water-level forecast in Fig. 7.9d).
    There are two rainfall peaks, which result in the two predicted peaks observed.
    However, this error started from the 1 day prediction and is not solely due to
    the rainfall forecasts.


    The 10 day prediction showed further error in the areas pointed to in 7 day prediction
    for similar reasons (Fig. 7.9c and d). Additionally, the forecasts were notably
    more variable over the first 200 days than in the same'
