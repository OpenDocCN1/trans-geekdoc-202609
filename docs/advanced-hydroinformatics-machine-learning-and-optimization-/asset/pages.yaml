  md: '# FUZZY COMMITTEES OF CONCEPTUAL DISTRIBUTED MODEL


    Mostafa Farrag¹²³, Gerald A. Corzo Perez⁴, and Dimitri P. Solomatine⁴⁵⁶


    ¹ Department of Water Quality and Ecology Software, Deltares, Delft, The Netherlands

    ² Hydrology Section, GFZ German Research Centre for Geosciences, Potsdam, Germany

    ³ Institute for Environmental Sciences and Geography, University of Potsdam, Potsdam,
    Germany

    ⁴ IHE Delft Institute for Water Education, Delft, The Netherlands

    ⁵ Water Resources Section, Delft University of Technology, Delft, The Netherlands

    ⁶ Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia


    Conceptual hydrological models imply a simplification of the complexity of the
    hydrological system; however, they lack the flexibility in reproducing a wide
    range of the catchment responses. Usually, a trade-off is done to sacrifice the
    accuracy of a specific aspect of the system behavior in favor of the accuracy
    of other aspects. This study evaluates the benefit of using a modular approach,
    "The fuzzy committee model" of building specialized models to reproduce specific
    responses of the catchment. We also assess the applicability of using predicted
    runoff from specialized models to form a fuzzy committee model. In this paper,
    weighting schemes with power parameter values are'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'investigated. A thorough study is conducted on the relation between the fuzzy
    committee variables (the membership functions and the weighting schemes), and
    their effect on the model performance. Furthermore, the Fuzzy committee concept
    is applied on a conceptual distributed model with two cases, the first with lumped
    catchment parameters and the latter with distributed parameters. A comparison
    between different combinations of the fuzzy committee variables showed the superiority
    of all Fuzzy Committee models over single models. Fuzzy committee of distributed
    models performed well, especially in capturing the highest peak in the calibration
    data set; however, it needs further study of the effect of model parameterization
    on the model performance and uncertainty.


    # 4.1. Introduction


    Conceptual models are a handy tool as they provide a simplified description of
    the complexity and heterogeneity of reality; consequently, they produce only a
    narrow range of catchment response, and the accuracy in reproducing a specific
    behavior may come against the accuracy of other aspects (Fenicia et al., 2007).
    Using hydrological models with the best set of parameter results from the calibration
    of a single objective function might not capture the complexity of the rainfall-runoff
    relationship in all ranges of flow.


    The source of error in conceptual models as described by Agawa and Takeuchi (2016)
    is that the model structure is not correct to some extent even with optimization.
    Furthermore, parameter values obtained using a real measurement or estimated from
    equations differ from values that would achieve an optimal fit. Besides, the spatial
    variation in both climate variables and catchment characteristics are ignored
    (Beven, 1996).


    The rainfall-runoff relationship is very complex and characterized by highly variable
    spatial and temporal properties. According to Fenicia et al. (2007), catchment
    behavior may display different states characterized by phenomena that can generally
    be identified qualitatively but are challenging to be quantified. Some of these
    phenomena are seasonality effects due to vegetation, land cover, changes in the
    topsoil, which affect processes like interception and infiltration. Therefore,
    catchment responses are season dependent.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Furthermore, catchment hydrological states are the main driving forces for
    the catchment responses. Changes in the hydrological state could change the catchment
    conditions from dry to wet or high to low flow. The changes also affect the contributing
    areas (saturated areas close to the river streams) to discharge, leading to a
    change in the domain of the hydrological processes. Last, most hydrological processes
    are characterized by nonlinear behavior like rainfall intensities, groundwater
    level, and soil moisture conditions. These processes, in return, control the surface
    runoff, fast and slow runoff response.


    Calibration of rainfall-runoff models depends mainly on the objective function
    used during calibration, and, therefore, different objective function results
    in different parameter sets. Having more than one set of parameters for one catchment
    violates the model''s physical justification, which ideally should have one unique
    parameter set (Oudin et al., 2006). The unavoidable dependency of calibration
    on objective function can be turned into a solution to the different states of
    the catchment responses. Hence, objective function can be adjusted to handle the
    practical issue for which the model is built.


    By acknowledging the limitations of the conceptual models, Corzo and Solomatine
    (2007), Fenicia et al. (2007), Fernando et al. (2009), and Oudin et al. (2006)
    have proposed approaches for the representation of a catchment behavior. Instead
    of searching for the best model to represent the whole domain in rainfall-runoff
    relation, runoff can be categorized into different flow regimes, and different
    models can be calibrated to reproduce each regime (Fig. 4.1). Such specialized
    models then can be dynamically combined to establish a more comprehensive representation
    of the catchment processes. This approach is called the modular or multimodel
    approach and is considered one way of adding hydrological knowledge into models
    (Corzo & Solomatine, 2007). The multimodel approach can implicitly consider the
    variability in the behavior of the catchment response that is not explicitly taken
    into account in the conceptual model realization.


    The modular approach considers switching between different models representing
    different aspects of system behavior. Therefore, these models have to address
    different ranges of the flow hydrograph (Abrahart & See, 2000) or different seasons.
    Based on Corzo and Solomatine (2007), the flow hydrograph was partitioned using
    three different methods: clustering-based classification, baseflow separation,
    and temporal segmentation. Jain and Srinivasulu (2006) have decomposed the hydrograph
    into different segments relying on the concept that different physical'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_117_0.png)


    Figure 4.1 The concept of building local models represents different flow regimes
    and combining the flow simulated by these models using fuzzy membership function.


    processes generate different hydrograph segments. Using multi-objective optimization
    to address different targeted hydrological responses (high and low flow) will
    result in a set of optimal solutions called Pareto front. The Pareto front represents
    a trade-off between the selected objectives. None of the optimization objectives
    can be further improved without the degradation of the other.


    To incorporate the hydrological knowledge encapsulated in each of these specialized
    local models, Clemen (1989) has explored different architectures to combine models
    and forecasts; Jain and Srinivasulu (2006) have used a straightforward switching
    between models at different time steps. Various ways have been proposed to include
    a system of weighing, which can be very simple like the averaging method by Shamseldin
    et al. (1997) or a more complex technique (Ajami et al., 2006; Duan et al., 2007;
    Shamseldin et al., 1997; Xiong et al., 2001). The Bayesian model averaging scheme
    (BMA) (Duan et al., 2007) exploits predictions made by different hydrological
    models to form a probabilistic prediction. BMA weighs different models based on
    their probabilistic likelihood measures. Xiong et al. (2001) applies the Takagi-Sugeno
    fuzzy system (Takagi & Sugeno, 1985) to combine forecasted discharge from different
    models. Specialized models can also be combined based on a membership function.
    Membership function gives each model a different weight at every time step based
