  md: '3 yr prediction, particularly the peaks labeled 1 and 2 (Fig. 7.7c). Up to
    3 days lead time, these peaks are well-predicted temporally as well as in magnitude,
    and can be linked to accurate forecasted rainfall at these points (Fig. 7.7a).
    Peak 3 is not as accurately predicted as peaks 1 and 2, resulting from small differences
    in the forecasted rainfall, particularly for the 2 day prediction. This error
    in the forecasted rainfall leads to a small lag, which is then propagated to the
    3 day prediction. These observations show the influence of the rainfall predictors,
    but more important, how improved rainfall forecasts could result in more accurate
    predictions.


    RMSE for the overall prediction for the 2 day and 3 day lead times were 0.027
    m and 0.037 m, respectively, with an R² greater than 0.98 in both cases. There
    is some lag in the prediction to the end of the graph (Fig. 7.7c) resulting in
    differences between the measured water level and predictions to the magnitude
    of 0.25 m and 0.20 m in the case of the 3 day prediction at days 143 and 149.
    This error can be accounted for when considering the error in the forecasted rainfall
    used. Additionally, the small prediction error in the 1 day forecast would increase
    the error of the 2 day prediction, as well as the influence of the highly autoregressive
    water-level inputs, which are the main predictors in these forecasts.


    At day 505, a rainfall peak of 37.8 mm resulted in a peak in the water-level prediction,
    which was not observed in the measured data (Fig. 7.7d). The influence of peaks
    in rainfall on the water-level prediction appears to be greater when the water
    level is indicative of a dry season (lowest values in Fig. 7.7c and d) than when
    the water level is higher during the wet season (indicated by the three highest
    periods in Fig. 7.7b). This observation also suggests that the observed rainfall
    was absorbed by the natural system, resulting in no major increase in the measured
