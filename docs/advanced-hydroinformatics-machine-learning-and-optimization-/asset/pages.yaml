    at the basin level.


    # 10.1. Introduction


    Integrated water resources management (IWRM) aims at making informed decisions
    with the involvement and information from all stakeholders. Over the last decade,
    digital media has implicitly increased data-based information on most societal
    activities carried out by humans (Nielsen, 2015). Water resources, extreme conditions,
    and hydrometeorological events are not exceptions. For example, flood-related
    digital media information has been collected in the last decades, from tweets
    (Murthy & Longwell, 2013) to social media (Rossi et al., 2018), and used to provide
    information toward a smart flood-risk management (L. Smith et al., 2017) and improved
    policies (A. Smith et al., 2017). However, challenges posed by conflicting interests
    are not easily solved (Giupponi & Gain, 2017). The problem of decision making
    in water management using IWRM support from stakeholders is based on several criteria.
    While multiple actors participate in hydrology, the possibilities to involve citizens’
    science in hydrology has increase, as presented detailed in Nardi et al. (2020)
    where a framework to address citizens’ science and hydrology problems are approached.
    It would seem that the relation between the information provided by citizens and
    extreme events is obvious, but in practice, the technologies require integration,
    as well as validation of this relation. Citizens’ data collected from local observations
    to crowdsourcing (Le Coz et al., 2016), measured directly or not (Kam et al.,
    2019), it’s nowadays a new database in decision-making process. In this context,
    the decision-making process in IWRM is based on history, documentation, and key
    elements of past and current decisions (Pires et al., 2017). In Avellaneda et
    al. (2020), crowdsourcing information regarding volunteers’ calibration data improved
    hydrological model results. In the same way, analysis of media (digital and analogical)
    regarding historical hydrological disaster event that affected the Paraná coastal
    region in Brazil concluded in an improved understanding and characterization of
    floods and debris flows (Picanço et al., 2017).'
