  md: 'nonlinear, AMI would be a better choice. A detailed presentation of IVS procedures
    can be found in Guyon and Elisseeff (2003), and, in relation to water modeling,
    in Bowden et al. (2005a, 2005b) and Galelli and Castelletti (2013).


    One of the important steps in ML is data transformation, preprocessing and postprocessing
    of data (Pyle, 1999). For some of the methods, such as multilayer perceptron artificial
    neural networks (MLP ANNs), data transformation (normalization) is almost a must.
    Other methods benefit from this because it typically leads to improved performance.


    In ML, the selection of input variables is of great importance, and this process
    is quite different from that normally used in process-based modeling. Having a
    large volume of measurements, and even knowing what input variables drive the
    output in physical terms, does not guarantee the high accuracy of a model. In
    most cases, it is necessary to identify (1) when and (2) to what extent these
    inputs contribute to the model output. Since information about the modeled phenomena
    is not always available in ML, most methods rely on statistics and information
    theory to determine the appropriate input variables for data-driven models.


    Normally, the input selection process starts with all the knowledge (data) about
    the process that will be modeled, and then the selection space is narrowed based
    on a more detailed analysis. In contrast to hydrological process-based models,
    ML allows for the inclusion of any variable (or its combination), even of those
    that do not necessarily force the phenomenon (discharge) directly. For example,
    rainfall runoff models may use past discharges to forecast current or future ones;
    however, they are not the actual triggers of flood situations (in relation to
    hydrological modeling, see, e.g., discussion in Moreido et al., 2021).


    To consider past information about the modeled phenomenon, often a model has to
    be fed with previous (lagged) values of an input variable, perhaps aggregated.
    In the context of hydrological forecasting, these are typically precipitation
    and discharges, optimally lagged. In this context, lag is defined as the number
    of time steps by which a time series is shifted from its current value, itself
