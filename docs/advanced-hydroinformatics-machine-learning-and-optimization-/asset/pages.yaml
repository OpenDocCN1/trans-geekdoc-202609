  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_277_0.png)


    Figure 9.4 Soft and hard threshold for de-noising the signal source (http://nl.mathworks.com/help/wavelit/ref/wthresh.html).


    stating that averaging or optimizing the selection of only certain subseries could
    generate undesired results. The latter stated that all subseries are equally important
    and contain some information about the original signal. For the present work,
    and according to the way ANN operates (by assigning different weights to each
    input series during the training process), it can be said that ANN by itself is
    selecting which subseries are more significant than others. In the case of doing
    it with the detail coefficients, to some extent, a noise elimination process is
    being carried out. For the present study, the statements made previously by the
    different authors are thought of as partial truths. Every subseries contains some
    important information about the signal and relevant to the model (no subseries
    were discarded). However, many factors can introduce errors in our measurements
    (errors in the instruments, human error, etc.). Even after quality checks, there
    are still some errors in the data, so this noise can also be eliminated.


    To illustrate how threshold de-noising works, it will be briefly introduced below.
    Let us start from the basis that the noise is presented on fine scales (detailed
    subseries), contrary to the trends or the main body (coherent part) of a time
    series, which can be seen in the approximation subseries. The filtering is only
    done on the detailed subseries. The threshold limits were intentionally chosen
    as large, to illustrate how the signal transforms (see Fig. 9.5). In practice,
    and for the present study these values are much smaller in magnitude, therefore,
    when reconstructing the signal (inverse wavelet transform), the resulting time
    series would not be so different from the original (let’s remember that this is
    obtained via optimization). Following the key idea that it will not remove important
    information during the process.'
