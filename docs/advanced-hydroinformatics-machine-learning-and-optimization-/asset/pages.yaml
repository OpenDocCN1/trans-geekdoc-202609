  md: '+   5. Let the problem drive the modeling efforts, including selection of techniques,
    data preparation, and so on. Take the best tool for the job, not just a job you
    can do with the available tool.

    +   6. Clearly define assumptions and constraints, and discuss them with domain
    knowledge experts.

    +   7. Refine the model iteratively (try different things until the model seems
    as good as it is going to get).

    +   8. Make the model as simple as possible but no simpler. This rule is formulated
    sometimes in different ways, such as KISS, for example (keep it sufficiently simple).
    Another formulation is the minimum description length principle, which states
    that the best model is the smallest (including the information to specify both
    the form of the model and the values of the parameters). More generally, this
    idea is widely known as the Occam’s razor principle, formulated by William of
    Occam in 1320 in the following form: shave all the unneeded philosophy off the
    explanation.

    +   9. Define instabilities in the model and its sensitivity (critical areas where
    small changes in inputs lead to large changes in output, or even to model crash).

    +   10. Define uncertainties in the model (critical areas and ranges in the data
    set where the model produces low-confidence predictions). Try to reduce such uncertainties.

    +   11. Draw conclusions from model application.


    The model training process (Fig. 1.6) is in fact solving an optimization problem:
    minimization of the difference between the measured and predicted results through
    the update of the model parameters serve as decision variables in this optimization
    problem.


    # 1.3.1. Data Partitioning


    In ML, data are typically partitioned into three subsets, which ideally should
    be statistically similar.


    +   1. Training data: Data used to calculate the model error with the aim of its
    minimization by updating the model parameters.

    +   2. Validation (or cross-validation) data: Data required for the intermediate
    evaluation of the model performance at various steps of training. These data are
    used either to tune the model structure or to aid the early stopping of training
    to prevent overfitting. A common practice is also to use the so-called n-cross-validation
    procedure (n is often set'
