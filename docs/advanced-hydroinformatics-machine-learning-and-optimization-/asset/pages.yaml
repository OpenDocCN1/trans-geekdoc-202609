  md: '# FORECASTING WATER LEVELS USING MACHINE (DEEP) LEARNING TO COMPLEMENT NUMERICAL
    MODELING IN THE SOUTHERN EVERGLADES, USA


    Courtney S. Forde¹, Biswa Bhattacharya², Dimitri P. Solomatine²,³,⁴, Eric D. Swain⁵,
    and Nicholas G. Aumen⁶


    ¹Caribbean Institute for Meteorology and Hydrology, Saint Michael, Barbados

    ²IHE Delft Institute for Water Education, Delft, The Netherlands

    ³Water Resources Section, Delft University of Technology, Delft, The Netherlands

    ⁴Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia

    ⁵Caribbean-Florida Water Science Center, United States Geological Survey, Lutz,
    Florida, USA

    ⁶Southeast Region, United States Geological Survey, Boynton Beach, Florida, USA


    Water level is an important guide for water resource management and wetland ecosystems,
    defining one of the most basic processes in hydrology. This research seeks to
    investigate the possibility of complementing numerical modeling with a Machine
    Learning (ML) model to forecast daily water levels in the southern Everglades
    in Florida, USA. An exact analytical solution to water level may not be possible,
    but using the computational methods afforded by ML, the traditional numerical
    techniques may be enhanced to generate more robust, scalable predictions. Five
    locations were chosen for application of the Time-Delayed Neural Network (TDNN)
    and Long-Short Term Memory Recurrent'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Neural Network (LSTM-RNN) ML models, which were built to estimate water level
    with 1, 2, 3, 7 and 10 day forecasts using a simulation step of 1 day. The results
    showed that rainfall forecasts from weather models could improve water-level forecasts
    if the accuracy and performance of the weather models can be improved. The ML
    models presented here improve water-level predictions from a historical hydrologic
    model for a 24 hour forecast horizon.


    # 7.1. Introduction


    Water level is widely used in flood risk management, monitoring of ground and
    surface water, and ecosystem and habitat monitoring and restoration in wetland
    environments (Forde, 2020). The Florida Everglades is considered one of the most
    significant wetland ecosystems in the world, particularly within Everglades National
    Park (ENP), the southern-most part of the Greater Everglades (Haman & Svendsen,
    2006) established in 1947, which was designated as an International Biosphere
    Reserve in 1976, a World Heritage Site in 1979, and a Ramsar Convention Wetland
    of International Importance in 1987 (Maltby & Dugan, 1997). Prior to large-scale
    alterations of south Florida’s watershed, water flowed unhindered from the Kissimmee
    River into Lake Okeechobee, which periodically overflowed its southern bank during
    the wet season and drove sheet flow of surface water through the Everglades into
    the Gulf of Mexico, Florida Bay, and Biscayne Bay (Ingebritsen et al., 1999) (Fig.
    7.1).


    After severe flooding from hurricanes, a levee was constructed around almost all
    of Lake Okeechobee to prevent the overflow of water and avoid further flooding.
    A network of canals, levees, water control structures, and pumps was built throughout
    south Florida to provide water supply and flood protection to an ever-increasing
    population. Improvements and expansion of channel networks, development of the
    historical Everglades wetlands into surface reservoirs called Water Conservation
    Areas, and the construction of water-control structures further altered the watershed.
    As a result, the natural environment significantly deteriorated due to altered
    hydrodynamics as it relates to flow, water level, seasonal timing, and spatial
    distribution (Light & Dineen, 1994). The altered flows resulted in shifts in vegetation
    composition, as well as dramatic reductions in wading bird numbers due to habitat
    loss and reduced aquatic production, both of which were a result of ecosystem
    degradation and shortened hydroperiods (Light & Dineen, 1994).'
