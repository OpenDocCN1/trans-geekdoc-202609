  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_390_0.png)


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_390_1.png)


    Figure 14.1 (a) Huai River basin (adapted from Wu et al., 2015) and (b) scheme
    of the case study area (Jonoski et al., 2019).


    damage. During operations, this damage is also expected to be minimized, even
    while being in conflict with the main objective of reducing flood risk of Bengbu
    City.


    Previous studies have investigated optimal strategies for storage area gates operation
    in this study area. Jonoski et al. (2018) identified optimal solutions using a
    coupled multi-objective optimization algorithm and a hydrodynamic model, while
    Jonoski et al. (2019) updated the objective function formulations and the geometric
    setting of hydrodynamic model (to include 2-D analysis of the flooding) in order
    to make the coupled simulation-optimization model more realistic. These previous
    studies were both based on a particular flood event of 2007, from 24 June to 7
    September. The research presented here builds on these existing studies, and further
    develops storage area operation strategies by taking uncertainty of inflow into
    consideration.


    When it comes to dealing with flooding uncertainty, two types of methods are often
    considered. One effective way is to develop robust solutions that are able to
    cope with a large spectrum of uncertain conditions, still resulting in relatively
    small or manageable impact. Another approach is to make real-time decisions regarding
    strategy of actions (e.g., gate operations of flood storage areas) when certain
    flood-generating inflow is forecasted, which could guarantee that the selected
    strategy would be effective or even optimal for the given situation.'
