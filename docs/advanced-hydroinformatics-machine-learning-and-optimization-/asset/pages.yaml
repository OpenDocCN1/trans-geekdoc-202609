- pgno: 71
  md: 'method actually allows for extracting more information from short time periods.


    The advantages of stochastic calibration over conventional split-sample approaches
    are demonstrated by means of a proof of concept, involving the calibration of
    a lumped conceptual model with four parameters. It is interesting to remark that
    while the differences in terms of efficiency are actually not so much notable
    among the two approaches, the optimized parameter values are. Therefore, it is
    expected that the two model versions will respond quite differently under combinations
    of inputs and states that are outside of the ones found in the historical data.
    Given that the stochastically calibrated model is trained over many extended hydroclimatic
    conditions, it is expected to ensure stronger identifiability. This is also indicated
    by the fact that this version exhibits more stable predictive capacity across
    varying time windows. On the other hand, the obvious increase of computational
    effort, due to the substantially larger length of calibration data, can be addressed
    through recent advances in global optimization, where machine learning and surrogate
    modeling techniques are embedded within robust evolutionary algorithms (e.g.,
    Tsoukalas et al., 2016).


    Preliminary analyses of the proposed method against a large set of catchments,
    and by employing models of varying level of complexity, both at the monthly and
    daily scales, have already provided encouraging results regarding the generality
    of the stochastic calibration paradigm (Kourakos et al., 2021). Future efforts
    will focus to the uncertainty aspect, aiming to provide a holistic framework for
    model calibration and uncertainty quantification based on stochastically generated
    data.


