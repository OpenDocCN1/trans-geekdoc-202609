- pgno: 256
  md: '# 9


    # NOISE FILTER WITH WAVELET ANALYSIS IN ARTIFICIAL

    NEURAL NETWORKS (NOWANN) FOR FLOW TIME

    SERIES PREDICTION


    **Daniel A. Vázquez¹, Gerald A. Corzo Perez¹, and Dimitri P. Solomatine¹,²,³**


    *¹ IHE Delft Institute for Water Education, Delft, The Netherlands*

    *² Water Resources Section, Delft University of Technology, Delft, The Netherlands*

    *³ Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia*


    A data preprocessing technique, known as Wavelet Analysis from the field of signal
    processing, was used to enhance an artificial neural network (ANN) model by addressing
    its primary drawbacks, notably nonstationarity and noise. Wavelet transforms are
    well-suited for handling time series contaminated by nonstationary traits and
    can extract relevant information at various time series frequencies. To improve
    the model’s performance, the ANN calibration weighting scheme assigns more weight
    to representative subseries and reduces the impact of noisy data on the rest.
    Noise filtering techniques (soft/hard single threshold) were applied to manipulate
    the subseries, further enhancing the model’s predictive skill. This approach resulted
    in the creation of a Noise Filter with Wavelet Analysis in Artificial Neural Network
    (NOWANN) scheme. To identify the best model, a model-based approach was used for
    input variable selection, k-fold cross-validation to determine the'
  merge: -1
  img_proc: true
- pgno: 257
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 258
  md: 'eliminate redundant inputs, and genetic algorithm to determine the most influential
    inputs.


    Subsequently, the appropriate class of models must be identified. The most common
    are the backpropagation neural network (BPNN), the radial basis function network
    (RBFN), and the self-organizing feature map (SOFM). Regarding BPNN (the most common),
    Shamseldin et al. (1999) have evaluated the importance of choosing the type of
    transfer function to forecast flow in rivers. In his experience, the logistics
    function indicated superiority among those tested. Kisi and Cigizoglu (2005) have
    compared all these techniques to predict river flow and found the RBF to be superior
    based on performance criteria.


    The next point to consider is the selection of suitable data sets to avoid local
    minima or loss of generalization capabilities during the calibration process.
    Arlot and Celisse (2010) provide guidelines for choosing the best cross-validation
    procedure based on the problem trait in question. Another important factor in
    the model-building process is during the network training step. Abrahart et al.
    (2004) have mentioned techniques that prevent overfitting during calibration.
    For example, the early stopping method states that (Coulibaly et al., 2000), if
    in a predefined number of epochs the validation check fails to decrease its performance,
    the training stops. A second alternative is weight decay that penalizes large
    weights to produce a smoother input-output mapping.


    As mentioned before, the literature is extensive in the subject and also broad
    in the range of applications for hydrology. To name a few, Shrestha et al. (2009)
    emulated Monte Carlo (MC) simulations with ANNs to speed up the assessment of
    the model parametric uncertainty; Zhang et al. (2009) forecasted daily reservoir
    inflows by using quantitative precipitation forecasting into ANNs model. In addition,
    Coulibaly et al. (2000) used an early stop training approach to avoid model overfitting
    for real-time reservoir inflow forecast. Bhattacharya et al. (2007) modeled the
    complex mechanism of sediment transport and reported better results compared with
    the traditional models at hand.


    However, in the present study, all the previous points were addressed to some
    extent and special attention was paid to data preprocessing, considered of utmost
    importance in the development of ANN. An emerging technique taken from the field
    of signal analysis is put to the test. Wavelet transforms (WT) is one of the many
    mathematical transformation methods that was used in its early days in seismic
    signal analysis and is now widely used in many other fields. This work uses WT
    due to its ability to transform signals of any type (rainfall and discharges time
    series of our interest) to obtain time-frequency information from it, which was
    not available in its raw condition. This technique complements data-driven models
    due to its'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'ability to analyze signals contaminated with noise, trending, aperiodicity,
    or other forms of nonstationarity, which DDMs cannot handle well.


    Articles about wavelet with ANN are available to the reader (Adamowski & Sun,
    2010; Adamowski, 2008; Cannas et al., 2005; Khalil et al., 2012; Okkan, 2012;
    Okkan & Serbes, 2013; Partal, 2008). Recommended articles are efforts to couple
    a modeling tool with a highly flexible data preprocessing technique, with different
    purposes such as Himalayan runoff forecast, short-term river flow for melt-caused
    floods, river flow predictions, short-term total dissolved solids forecast, and
    inflow of reservoirs.


    The knowledge obtained in other fields such as economics and finance, where this
    approach is much better established, has contributed a lot to develop concepts
    and capture limitations of the approach. Some algorithms used for WT analysis
    may have unwanted behaviors that are not easily detected. One drawback is the
    use of information brought from the future but located in the present time step;
    this violates the restrictions on the use of information not yet seen by the model.
    This can create false expectations of seemingly very promising results. Another
    problem is the time-varying properties of some algorithms, as well as errors and
    assumptions at the limits of the signal. This problem is addressed in the next
    section. Table 9.1 shows the work done in the field, focusing on the use of wavelet
    neural networks. Table 9.1 is a relevant bibliographic summary for this study,
    where the types of models and processes used (linked to the wavelet method) are
    identified. Most of these works have been taken into account for the formulation
    of the methodology that is followed here.


    # 9.2. Materials


    # 9.2.1. Wavelet Transform


    The basic idea behind Wavelet Analysis is to use wavelike functions that, when
    convolved with the signals, can extract important information and express it in
    more useful forms. These functions are operated in two ways: they can be translated
    at all-discrete locations of the signal, and they can be stretched or squeezed
    so that different frequencies of the signal are studied. As a result, the signal
    has two representations (approximation and detail). In turn, each element of approximation
    can be decomposed back to the coarsest resolution (multiresolution representation).
    After this interrogation, the wavelet transform space indicates how well the signal
    is represented by the adopted wavelet function. Now, the ANN model decides which
    information is most relevant. The following concepts have'
