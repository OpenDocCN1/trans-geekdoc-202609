    Examples of recent applications of DL in hydrometeorological problems, which are
    characterized by very large data sets, can be mentioned also. Schultz et al. (2021)
    evaluated numerical weather prediction models, which are quite important for analyzing
    all types of water resources problems. In this work, it is highlighted that DL
    is not yet widely used within the numerical weather prediction (NWP) context,
    mainly due to the lack of both the interpretability of the neural networks and
    the physical constraints. They mention also that many of the early experiments
    using simple neural networks did not capture the complexity of weather processes.
    Although these limitations are important, there are three main reasons for considering
    DL for weather prediction problems. First, large amounts of data are currently
    available. Second, new architectures of the neural networks have been developed
    that can capture well the time dependencies (RNNs), as well as spatial distributions
    and imagery, such as the convolutional neural network (CNN). Third, the computational
    power capacity needed for training such networks (graphical and specialized processors
    available on the cloud) has become easily available. All this brings the latest
    advanced ML techniques at the disposal of modelers and forecasters in water resources,
    leading thus to optimal water management.


    For further information on the use of AI and ML in Earth system sciences, the
    reader is directed, for example, to the recorded lectures at the Summer School
    “Artificial Intelligence for Earth System Science” (AI4ESS, 2020), where some
    of the methods and impressive applications are presented.


    # 1.5. Future Directions and Challenges


    Use of modeling and forecasting tools is indispensable for effective water management.
    Traditionally, such models belonged to the class of the process-based (physically
    based) models, typically based on numerical solutions of differential equations
    of water motion. During the last three decades advances in machine learning techniques,
    increased computing power and data availability have led to changes in this landscape.
    Hydroinformatics is seen as the major area where machine learning such algorithms
    have been tested and applied to a large variety of water-related'
