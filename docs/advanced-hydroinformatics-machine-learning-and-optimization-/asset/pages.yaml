    # 14.2.4. Methodology


    Based on the previous work and obtained results, the methodology of this study
    consists of three components. The first one is the determination of uncertain
    inflow. Synthetic hydrographs were proposed with similar characteristics as the
    real one used previously (from year 2007), on which'
