  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_43_0.png)


    Figure 1.10 Training M5 model trees and their operation on a new unseen instance:
    a1–a3 are data partitioning rules; M1–M5 are multiple linear regression models.


    regression models in leaves (Fig. 1.10, adopted from Bhattacharya & Solomatine,
    2005).


    Since for each data instance (input vector) only one local model is used for prediction,
    there is a problem with compatibility at the boundary between the regions for
    which the modules are responsible. For the two neighboring input vectors, the
    predicted outputs could be distinctive. A solution could be to update the local
    models to make them compatible at the boundaries, as is done in the M5 model tree
    algorithm through smoothing. Wang and Witten (1996) presented the M5 algorithm
    based on the original M5 algorithm but were able to deal with enumerated attributes,
    treat missing values, and use a different splitting termination condition. Several
    advantages of using the model tree are that it is a non-black-box model, understandable,
    easy to use and to learn, fast in training, robust when dealing with missing data,
    able to handle a large number of features, and able to tackle tasks with very
    high dimensionality. It has been shown that M5 model trees have accuracy similar
    or exceeding that of MLP ANNs (on water-related applications see, e.g., Bhattacharya
    & Solomatine, 2005; Solomatine & Xue, 2004).'
