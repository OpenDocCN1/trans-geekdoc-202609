- pgno: 78
  md: '# A TWO-STAGE SURROGATE-BASED PARAMETER CALIBRATION FRAMEWORK FOR A COMPLEX
    DISTRIBUTED HYDROLOGICAL MODEL


    Haiting Gu, Yue-Ping Xu, Li Liu, Di Ma, Suli Pan, and Jingkai Xie


    Institute of Hydrology and Water Resources, Zhejiang University, Hangzhou, China


    Distributed hydrologic models have been widely used for their functional diversity
    and rationality in theory. However, calibration of distributed models is computationally
    expensive since it requires a large number of model runs, even if an efficient
    multi-objective optimization algorithm is employed. To alleviate the burden of
    computation, we develop a two-stage surrogate-based model calibration framework
    by coupling standard backpropagation neural network with AdaBoost (ADBP) to efficiently
    calibrate the parameters of a large and complex distributed hydrologic model,
    that is, the Variable Infiltration Capacity (VIC) model. The first-stage model
    (SM-I) picks out the parameter sets whose simulated outputs are in the crucial
    range and the second-stage model (SM-II) estimates the values of outputs accurately
    with the parameter sets picked out by SM-I. The proposed surrogate model is tested
    in the Lanjiang River basin and the Xiangjiang River basin for parameter calibration.
    With the similar calibrated parameter sets for VIC, the surrogate model gains
    up to 20 times speedup'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'compared with the original VIC model in the basin with a large area and complex
    physical conditions.


    # 3.1. Introduction


    The distributed hydrologic model had its first application at the watershed scale
    by Freeze and Harlan (1969). The models that take full consideration into the
    effect of spatial nonuniformity of precipitation and land surface conditions on
    hydrologic processes can be preferable to lumped models theoretically, although
    in practical applications, the lumped models may perform better (Carpenter & Georgakakos,
    2006; Liu et al., 2018). Nowadays, with the rapid development of computer technology,
    the geographic information system (GIS), digital elevation models (DEM), and remote
    sensing (RS), distributed hydrologic models with different configurations have
    been developed and used widely in practice (Abbaspour et al., 2015; Kovalets et
    al., 2015; Marek et al., 2016; Patil & Ramsankaran, 2017; Sun et al., 2016; Xu
    et al., 2015; Zhang et al., 2017; Zhao et al., 2009). They can even be combined
    with big data techniques (Guo et al., 2017; Zhang et al., 2016a,b), such as the
    MapReduce framework and Hadoop distribution file system.


    The Variable Infiltration Capacity Macroscale Hydrologic model (VIC), which we
    used in this study, is a macroscale model that the areas above a critical scale
    are taken to be about 10 km × 10 km typically and the simulated runoff is shown
    to match observations quite well over large river basins (Maurer et al., 2002).
    Numerous studies have applied VIC successfully and obtained good performances
    in ensemble streamflow forecasting (Liu et al., 2017; Mo & Lettenmaier, 2014;
    Schumann et al., 2013). It is also used to study the hydrology under nonstationary
    conditions (Chawla & Mujumdar, 2018; Leng et al., 2015). The distributed models
    are widely used in water resources assessment, hydrologic forecast, and sediment
    transport modeling (Pérez et al., 2017; Xu et al., 2015). However, these kinds
    of models also have a limitation. It requires a lot of computational power and
    costs substantial time to solve partial derivative equations with numerical computation
    methods at each grid cell. Especially, tens of thousands of simulations are required
    when parameters of a distributed model (Razavi et al., 2012) are calibrated.


    One way to accelerate parameter calibration is by employing an efficient auto-calibration
    method. Multi-objective calibration strategy for hydrological models can reduce
    the model equifinality and parameter uncertainty and acquire a valuable parameter
    set (Tuo et al., 2018).'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'In recent years, many multi-objective optimization algorithms (MOAs) for the
    hydrologic model calibration have been developed and applied in the hydrologic
    model parameter calibration (Gupta et al., 2009), such as the Multi-Objective
    Complex Evolution method (MOCOM-UA) (Yapo et al., 1998), the Strength Pareto Evolutionary
    Algorithm II (SPEA2) (Zitzler et al., 2001), Nondominated Sorting Genetic Algorithm
    II (NSGA-II) (Deb et al., 2002), and so on. Numerous studies (De Vos & Rientjes,
    2007; Gharari et al., 2013; Guo et al., 2014; Huo et al., 2016; Kollat et al.,
    2012; Lee et al., 2013; Tang et al., 2005; Yassin et al., 2017) have shown that
    MOAs are efficient in the hydrologic model parameter calibration automatically.


    Although an efficient optimization algorithm can reduce the number of simulations
    of model calibration for complex models, it may still need a large number. The
    surrogate model (SM) is also an important method to improve the efficiency of
    the optimization algorithms (Maier et al., 2014). The data-driven models, such
    as Artificial Neural Network (ANN) (Zhang et al., 2009), Radial Basis Function
    (RBF) (Christelis et al., 2016), Support Vector Machine (SVM) (Asefa et al., 2004;
    Zhang et al., 2009), and Gaussian Process Regression (GPR or Kriging) (Zhang et
    al., 2016a,b) are usually used to construct the response surface surrogates of
    physical models (Razavi et al., 2012). Several studies have been done through
    using surrogate models to accelerate the optimizations efficiently (Behzadian
    et al., 2009; Gong et al., 2016; Kourakos & Mantoglou, 2009; Yan & Minsker, 2006;
    Yan & Minsker, 2011; Yazdi et al., 2019). This kind of algorithm is called *meta
    model-enabled optimizers* or *SM-based optimization algorithms* in which the best
    method for building a SM with data generated by the physical model is first chosen
    (Santana-Quintero et al., 2010) and then a MOA scheme is developed to use SM instead
    of the physical model (Maier et al., 2014). However, most of the studies mentioned
    above are planned for groundwater or water allocation since they generally require
    finer resolution and lateral communication. In our study, we focus mainly on runoff
    calibration for a large and complex hydrologic model and investigate the performance
    of the SM-based optimization algorithm.


    In our study, we aim to overcome the computational limitation in the calibration
    process of VIC. For this purpose, we propose a new modeling calibration framework.
    ANN is used to construct our surrogate model, which often shows better accuracy
    for spatial interpolation (Chowdhury et al., 2010; Sivaprasad et al., 2010). To
    further improve the accuracy of our surrogate model, two measures are adopted.
    The first one is using AdaBoost algorithm (Kearns & Valiant, 1994), which can
    improve the'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'accuracy of ANN as well as make it work more stably. The second is building
    a two-stage model that tailors the surrogate model upon the parameter range near
    optimal solutions. In addition, the more efficient MOA, ε-NSGA II, is also applied
    to accelerate the parameter calibration. The two-stage surrogate model that we
    build here for VIC aims to accelerate the process of calibration to guarantee
    its accuracy. The method also provides an alternative idea to calibrate parameters
    and should be useful to alleviate the computational burden for other large and
    complex hydrologic models.


    # 3.2. Method


    # 3.2.1. Hydrologic Model and Its Calibration


    VIC was originally developed by Liang et al. (1994, 1996). First, the user provides
    the model with grids of the study area, which includes meteorological data, digital
    elevation data, soil data, land cover data, and so on. Then the model simulates
    the hydrologic processes respectively on the basis of full water and energy balances
    in each grid cell. As a distributed hydrologic model in macroscale, the VIC model
    itself does not include the routing model. Therefore, the routing model based
    on a source-to-sink model (Lohmann et al., 1998; Lohmann et al., 1996) is utilized
    for runoff and base flow routing. For this application, the VIC model of version
    4.2.2.d is used.


    Multi-objective optimization algorithms involve more than one objective function
    to be optimized simultaneously. Multi-objective optimization algorithms produce
    a set of Pareto solutions, instead of a single optimal solution. The ε-NSGA II
    (Kollat & Reed, 2006) is used as a multi-objective optimization algorithm to calibrate
    parameters of VIC, which is updated from NSGA-II (Deb et al., 2002). Compared
    with NSGA-II, ε-NSGA II owns three new features, they are the ε-dominance archiving
    (Laumanns et al., 2002), the adaptive population sizing (Harik & Lobo, 1999),
    and the spontaneous termination (Reed et al., 2003). The ε-NSGA II is an effective
    and robust optimization algorithm (Fu et al., 2012; Hadka & Reed, 2012; Hurford
    et al., 2014; Kollat & Reed, 2007; Wang et al., 2014) and has been successfully
    applied in some previous studies (Liu et al., 2017; Liu et al., 2019; Pan et al.,
    2018). Here we operate the ε-NSGA II algorithm in parallel with a high-performance
    and widely portable implementation of the Message Passing Interface (MPI) standard
    named MPICH.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The Nash-Sutcliffe efficiency (NSE) (Nash & Sutcliffe, 1970) and relative bias
    (Bias) are used to mathematically quantify the performance between observed streamflow
    and streamflow simulated by VIC, whose detailed formulas are defined as


    $$NSE = 1 - \frac{\sum_{i=1}^{n}(Q_o(i)-Q_s(i))^2}{\sum_{i=1}^{n}(Q_o(i)-\overline{Q_o})^2}\tag{3.1}$$


    and


    $$Bias = \left|\frac{\sum_{i=1}^{n}(Q_s(i)-Q_o(i))}{\sum_{i=1}^{n}Q_o(i)}\right|,\tag{3.2}$$


    where $n$ is the length of the daily runoff series; $Q_s(i)$ and $Q_o(i)$ are
    the observed and simulated streamflow of the $i^{th}$ day respectively; and $\overline{Q_o}$
    is the mean value of the observed streamflow. The value of NSE closer to 1 means
    a less difference between the observed and simulated flows, while that of Bias
    prefers to be 0.


    The values of objective functions coverage in a range around the optimization
    objectives with the increasing iterations of optimization. We define the range
    that the values of objective functions converge in as crucial range and define
    the remaining range outside the crucial range as trivial range.


    # 3.2.2. Algorithm of Response Surface Surrogates


    Adaptive boost (AdaBoost) is a boosting algorithm (Freund et al., 1996; Kearns
    & Valiant, 1994). This algorithm assembles several weak predictors into a strong
    predictor to reduce deviation and variance brought by the random generation of
    initial sample weights and thresholds of ANN (Schapire, 1990). In our study, the
    standard backpropagation neural network (BPNN) is employed as a weak learner in
    AdaBoost. The algorithm with AdaBoost and BPNN is called ADBP. The detailed information
    about ADBP (Fries & Kerkez, 2018; Zhao et al., 2014) is described as follows:


    +   1. Initialize training data and network. The data of training are normalized
    first. $N$ sets of training data are given, where $x_i$ ($i=1,2,...,N$) is the
    input parameters and $y_i$ is the training objective. The initial weight of training
    sample $x_i$ is set as $D_l(i)=1/N$.

    +   2. Train the weak learner and calculate the weight of weak learner. Here,
    BPNN is used as the weak learner to predict the outputs of training data. For
    $t=1,...,T$, where $T$ is the size of weak learners, the BPNN'
  merge: -1
  img_proc: true
- pgno: 83
  md: "prediction error and the weight of the weak learner are denoted as the following:\n\
    \n$e_t(i) = h_t(\\mathbf{x}_i) - y_i$\n\n$a_t = \\frac{1}{2\\exp(|Err_t|)}, \\\
    text{where } Err_t = \\sum_{i=1}^{N} D_t(i), \\quad (3.3)$\n\nwhere $e_t(i)$ is\
    \ the BPNN prediction error; $h_t(x_i)$ is the prediction value of $y_i$ with\
    \ BPNN; and $a_t$ is the weight of the weak learner.\n\n+   3. Update the weight\
    \ of the training sample. If $|e_t(i)|>0.1$, the weight of the training sample\
    \ would be updated as equation (3.2) or else $D_{t+1}(i)=D_t(i)$,\n+   \n+   $D_{t+1}(i)\
    \ = 1.1 \\times D_t(i). \\quad (3.4)$\n+   \n+   4. Output the final hypothesis.\
    \ Repeat the steps above and $T$ weak learners with their weights are acquired.\
    \ Then the weights are normalized and the $T$ weak learners are combined into\
    \ a strong learner as the following:\n+   \n+   $w_t = \\frac{a_t}{\\sum_{j=1}^{T}\
    \ a_j}$\n+   \n+   $h_{final} = \\sum_{i=1}^{T} w_i h_i, \\quad (3.5)$\n\nwhere\
    \ $h_{final}$ is the ensemble prediction value of the $T$ weak learners; $w_t$\
    \ is the normalized weight of the $t^{th}$ weak learner. The inputs of SM are\
    \ the adjustable parameters of VIC and the outputs are the objective functions.\n\
