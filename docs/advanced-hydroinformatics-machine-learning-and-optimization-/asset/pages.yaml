    part 1 (section 15.3.2), ML models are built to simulate the operation of the
    reservoir during the analysis period (2009–2019), that is, to learn the real operation.
    In part 2 (sections 15.3.3–15.3.5), the ML models are incorporated into the reservoir
    operation model (which was described in section 15.2.3) and which, through multi-objective
    optimization, will learn optimal operations for the three objectives defined in
    section 15.3.4. Finally, section 15.3.5 describes the process of optimization
    and some computational details. Figure 15.6 summarizes the methodology proposed
    in this study, which will be developed in following sections.


    # 15.3.1. Machine Learning (ML) Models


    The reservoir operations in terms of daily release can be parameterized using
    mathematical functions adjusted to the patterns or shapes that define them. To
    this end, some artificial intelligence techniques or ML models, most notably ANNs,
    have proven to be efficient; some have even been classified as universal approximation
    functions (Tikk et al., 2003). Several authors have shown the benefits of these
    functions in the analysis of reservoir operation. Not only can they learn and
    replicate real operating behaviors (Ehsani et al., 2016; Zhang et al. 2018), they
    also adjust to artificial behaviors induced by purpose fulfillment in optimization
    problems'
  merge: -1
  img_proc: true
- pgno: 437
  md: '(Momtahen & Dariane, 2007; Giuliani et al., 2016). The present study proposes
    two types of ANNs as approximation functions: the MLP and the RBN, in addition
    to a linear approximation function (LF).


    # *MLP*


    Figure 15.7a shows the general scheme of an MLP. The information that enters the
    network is propagated forward using connections with different values or weights.
    The MLP has an input layer, where the data are entered, which is processed in
    the neurons of the hidden layers using activation functions until reaching the
    output layer, where the results are generated. The output value $y_t$ of a single
    hidden layer MLP with $M$ inputs values is defined as:


    $y_t = c + \sum_{i=1}^{N} v_i f_i(I_t \cdot w_i + b_i), \quad (15.3)$


    where $N$ is the number of neurons with an activation function $f_i(\bullet)$
    (e.g., sigmoidal function); $I_t$ is the $M$-dimensional inputs vector of the
    network; $w_i$ is the $M$-dimensional vector that represents the connections between
    the input and the hidden layer; $v_i$ is the $N$-dimensional vector for the connections
    between the hidden layer and the output layer; $b_i$ is the $N$-dimensional vector
    of bias for the neurons of the hidden layer; and $c$ is the bias value of the
    output layer. The number of parameters in this network is $p = N(M + 2) + 1$.


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_437_0.png)


    Figure 15.7 Architecture of the ANN: (a) MLP, (b) RBN.'
  merge: -1
