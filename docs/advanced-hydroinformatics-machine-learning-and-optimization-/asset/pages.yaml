    runoff magnitudes. For such events, even though we had less than half of the events
    available for LLE, model efficiencies reached the maximum (NSE = 0.90). The LLE
    runoff model was optimized for extreme runoff magnitudes (KGE = 0.94). Physically,
    this is explained by the fact that the RF learning process becomes straightforward
    after a greater portion of the basin is saturated, and any additional precipitation
    volume is directly converted into streamflow. The major difficulty comes from
    the modeling of extreme runoff triggered by spatially extensive and short-duration
    precipitation events (SEE).


    The efficiencies of the developed and tested models highlighted the advantage
    of developing specialized extreme runoff models but also revealed the need to
    include additional information on antecedent soil saturation and its dynamic along
    with extreme hydrological events. This is particularly required for short-duration
    precipitation events (SEE and LSE), where the runoff generation process is governed
    by the antecedent saturation state of the basin. Foregoing is the reason why short-duration
    and nonextreme precipitation intensities can trigger extreme hydrological events.
    Given this, we encourage the approach employed by Massari et al. (2018) where
    they used satellite soil moisture observations to improve extreme runoff forecasting.
    Moreover, unveiling the limitations of runoff modeling for the Jubones basin opens
    the path for future research focused on exploring additional ML algorithms. We
    recommend, for instance, exploration of additional ML algorithms for the modeling
    of LSE and SEE events, and come up with a superior model consisting of an ensemble
    of specialized runoff models.


    # 6.6. Conclusions


    This study exploits the possibility of using two near-real-time satellite precipitation
    sources (without ground validation) for the development of smart extreme runoff
    models for a 3,391 km² basin. Smart models are characterized by the use of an
    ML algorithm with prior data assimilation enhancement under hydrometeorological
    criteria. For dealing with the complex precipitation-runoff response and the optimization
    of the runoff model efficiency, a straightforward feature engineering methodology
    was used. The major finding emerging from this study is that improvement'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'of the representation of precipitation maximizes the efficiency of extreme
    runoff models. In addition, precipitation discrimination also served to unveil
    the precipitation-runoff scenarios misleading the learning process of RF extreme
    models.


    In general, we found that the spatial extension of precipitation events made no
    significant difference in the learning process of RF models when they occurred
    for long-duration periods. These particular events produced the highest runoff
    magnitudes at the outlet of the basin. Physically, the success in modeling such
    precipitation events is attributed to a clear precipitation-runoff signal resulting
    from a gradual soil saturation process before precipitation is turned into a runoff.
    This signal served to improve the learning process of RF models by reducing noise
    and maximizing model efficiencies.


    In terms of input data, the present study intentionally used and tested two near-real-time
    precipitation satellite sources, the PERSIAN-CCS and IMERG-early run subproducts.
    We used a modular framework of precipitation data acquisition that reduced 40%
    of precipitation events with nearly or even nonexistent precipitation signals.


    A natural progression of this work is to test the proposed methodology in other
    study areas with similar hydrological conditions. The contribution of this study
    is to inform ML models about the functioning of a hydrological system. Therefore,
    caution must be taken in hydrological systems where there is the contribution
    of groundwater; here, additional analyses might be needed to conceptualize and
    implement appropriate feature engineering strategies.


    All in all, the knowledge gained from the functioning of the basin, the proposed
    feature engineering methodology, and the evaluation of nearly real-time satellite
    precipitation sources provides hydrologists with the tools for the future development
    of real-time runoff forecasting models. In addition, this study can be used to
    assist decision makers in the fields of flood forecasting, water resources management,
    optimization of hydropower generation, and many more.


