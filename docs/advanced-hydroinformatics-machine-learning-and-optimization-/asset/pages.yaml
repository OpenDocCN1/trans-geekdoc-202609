- pgno: 44
  md: 'In summary, M5 model trees are a type of machine learning algorithm that combines
    the strengths of regression trees and linear models, allowing for more flexibility
    in modeling nonlinear relationships.


    # 1.4.3. Bagging and Boosting Techniques for Building Committee Models


    # Bagging


    Two or more models whose outputs are combined, form a committee model. Statistical
    techniques widely used in preparing data for building such models are bagging
    and boosting. These methods are used to generate subsamples of data, which are
    used to train several models and then combine them in a committee.


    The term bagging comes from bootstrap aggregating (bagging), which is an algorithm
    used to improve classification and regression models in terms of stability and
    classification accuracy. It also reduces variance and helps avoid overfitting.
    Bagging can be seen as a special case of the model averaging approach. Bagging
    was proposed by Leo Breiman (1984).


    Given a standard training set D of size n, bagging generates m new training sets
    Di of size n'' ≤ n, by sampling examples from D uniformly and with replacement.
    By sampling with replacement, it is likely that some examples will be repeated
    in each Di. If n'' = n, then for large n, the set Di is expected to have 63.2%
    of the unique examples of D, with the rest being duplicates. This kind of sample
    is known as a bootstrap sample. The m models are built using the above m bootstrap
    samples and combined by averaging the output (for regression) or voting (for classification).
    Since the method averages several predictors, it is not useful for improving linear
    models.


    # Random Forest


    A very popular algorithm based on bagging that uses tree-like structuring of data
    is the random forest algorithm (Breiman, 2001). It is an ensemble method that
    combines multiple decision trees (in the original version, regression trees) to
    make predictions. The basic idea behind this method is to build a large number
    of decision (regression) trees using random subsets of the data and features,
    and then combine the predictions of these trees to make a final prediction.


    The random forest algorithm works by first selecting a random subset of the data,
    called a bootstrap sample, to use as the training set for each decision tree.
    Then, for each tree, a random subset of the features is'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'selected to use as the split variables at each node. The algorithm then grows
    a decision tree using this random subset of data and features. This process is
    repeated many times to build a large number of decision trees, each with its own
    random subset of data and features. Finally, the predictions of all the trees
    (constituting an ensemble) are combined to make a final prediction.


    One of the advantages of random forest is that it can reduce overfitting by averaging
    out the predictions of many decision trees. The algorithm also has the ability
    to handle large numbers of input variables and nonlinear relationships between
    the input variables and the target variable, which is a limitation of linear regression
    models.


    # Boosting


    Boosting is an approach leading also to a committee (ensemble) of ML models, but
    it is a sequential model, where each subsequent model is dependent on the outcome
    of the previous. Boosting assigns weak learners to a weighted subset of the original
    data set. Weak learners have little predictive ability and perform just marginally
    better than random guessing. Subsets that were previously misclassified are given
    more weight and hence the probability to be selected for the subsequent learner.
    As a result, the ensemble has good generalizing ability. The two widely used versions
    of boosting are gradient boosting (Friedman, 2001) and adaptive boosting, AdaBoost
    (on its realization for regression problems, AdaBoost.RT, see Shrestha & Solomatine,
    2006). A popular implementation of the former is in XGBoost (extreme gradient
    boosting), a C++ library with APIs for several languages (XGBoost, 2023), which
    is extensively employed in various types of applications.


    # 1.4.4. Deep Learning


    In relation to water resources, lately, a lot of attention has been given to the
    so-called deep learning, a general term given to architectures based on recurrent
    multilayered neural networks. Especially popular are long short-term memory (LSTM),
    gated recurrent units (GRUs; a version of LSTM), and convolutional networks. Deep
    learning (DL) is commonly referred to models with large number of layers and complex
    nodes with memory, for example, able to handle time series “deep in time” or process
    images. DL has become a fashionable term, and currently is widely used, sometimes
    even (incorrectly) replacing a more general term ML.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 1.4.5. Recurrent Neural Networks (RNNs) and LSTM


    # RNN


    RNNs are designed to automatically learn and understand the mutual relationship
    between inputs, which are provided in sequential order. RNNs are often applied
    to NLP and speech recognition, since they have sequential structure fit to process
    long time series (Fig. 1.11). In a typical RNN, the output becomes a variable
    of state (h) used as input into the same network for the following time step in
    the sequence.


    # Long Short-Term Memory (LSTM) Networks


    Traditional RNNs face difficulties in training models with long sequences, especially
    vanishing or exploding gradient problem. This problem was addressed in many studies,
    and one of the most popular techniques nowadays is the long-short-term-memory
    (LSTM) network, which was introduced by Hochreiter and Schmidhuber (1997). This
    and later developments allowed for much wider adoption of deep learning in time
    series forecasting.


    Learning of such long-term dependencies between inputs and outputs is vital in
    hydrological modeling, because the lag time between hydrological processes may
    vary from days to years. For instance, the long lag time can be seen in the cases
    of glaciers, snow, and groundwater processes (Kratzert et al., 2019). Due to developments
    of new DL algorithms in the last several years, there has been clear revival of
    interest in using ML in water-related problems. These have demonstrated high accuracy,
    for example, in flood forecasting (e.g., Kratzert et al., 2019; Kao et al., 2020;
    Arsenault et al., 2023) and drought forecasting (Brust et al., 2021; Dikshit &
    Pradhan, 2021).


    Kratzert et al. (2019) investigated the use of LSTM in rainfall runoff hydrology
    using Catchment Attributes and Meteorology for Large-Sample Studies (CAMELS) data
    sets for numerous catchments. The authors also studied the extent to which a single
    LSTM model could be regionalized, that is, applied to other catchments. As a result,
    the LSTMs predicted discharge with good accuracy compared with the reference model.
    The final conclusion claims that by using LSTM, the problem that is generally
    related to ML models of being black box models could be overcome, and explanation
    is in the following. In LSTM the cell state''s behavior in response to the hydrological
    trends and patterns can be physically interpreted, for instance, by analyzing
    the melting state of the cell state in comparison with the change in temperature.
    Consequently, with low temperatures, there is a'
