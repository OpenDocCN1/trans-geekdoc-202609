  img_proc: true
- pgno: 445
  md: '# OF3. Hydropower Generation (Total)


    The goal is to maximize the power generated (KW) for the entire analysis period
    T from the powers generated in each time step P_t. The following function defines
    OF3:


    $$OF3 = \sum_{t=1}^{T} P_t, \tag{15.13}$$ $$P_t = \eta \gamma H_t q_{turb,t},
    \tag{15.14}$$ $$\eta = f(q_{turb,t}), \tag{15.15}$$


    where γ is the specific weight of water; H_t is the hydraulic head, which depends
    on the reservoir''s water level and the elevation of the turbine axis; η is the
    efficiency of the turbine as a function of the discharge; and q_{turb,t} is the
    discharge through turbine (m³/s). It is important to mention that a conversion
    factor of -1 is applied to OF3 (equation 15.13) within the optimizer in this study,
    since the modules used by the program (JMETALPY) work only for minimization objectives
    (Benitez-Hidalgo et al., 2019).


    In hydroelectric plants, there are other important indicators, such as firm energy,
    with which the energy security of a system can be evaluated. Due to the fact that
    Hatillo hydroelectric plant has a low installed capacity compared with the large
    hydroelectric plants in the Dominican Republic, total energy is the only objective
    considered in this study. This simplifies the optimization process; however, a
    firm energy indicator is evaluated in the results obtained (section 15.4).


    # 15.3.5. Optimization and Computational Details


    The optimization was performed on the reservoir operation model for the analysis
    period (2009–2019), using the parameters of the ML models as decision variables.
    This method belongs to the direct search policy (DPS) approach where the optimizer
    acts on the parameters of the functions that represent an operation policy, this
    being the ML models. Table 15.3 summarizes the number of optimized parameters
    for each model. The objective functions were defined in section 15.3.4.


    Two EAs were used to optimize the operation model: the NSGA II and the MOEA /
    D. JMETALPY (Benitez-Hidalgo et al., 2019), a multi-objective optimization environment
    (developed in Python) that contains a set of modules with different multi-objective
    and single-objective optimization algorithms, was also used. With JMETALPY, a
    set of problems was used to evaluate the optimization algorithms. The operation
    model was inserted into JMETALPY as a subclass of floating problems.'
  merge: -1
  img_proc: true
