    to stormwater-induced nonpoint pollution, leading to stronger upstream-downstream
    relationship. The high teleconnection in the DO network may be attributed to the
    overall connectivity of surface water systems and strong diffusion of DO. A similar
    distribution pattern of degree centrality and clustering coefficient is also found
