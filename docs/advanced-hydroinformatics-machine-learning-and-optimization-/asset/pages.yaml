    forecast model. The naïve reference model is a simple model that assumes the forecast
    discharge at lead time i is equal to the latest available observed discharge (see
    equation (8.11)).


    $Q_{(t+i)} = Q_t.$

    (8.11)


    As a summary, Figure 8.3 shows the overall methodology with the previous steps
    used to build a Multilayer Perceptron Artificial Neural Network (MLP-ANN) in Grande
    de San Miguel catchment.'
