    # 2.3. Insights to the Stochastic Simulation Procedure


    The idea of substituting short historical records with synthetic ones is very
    popular in a wide range of hydrological design, planning, management, and forecasting
    applications, involving the use of deterministic models that are driven by synthetic
    inputs, provided by stochastic models (e.g., Koutsoyiannis & Economou, 2003).
    The coupling of deterministic and stochastic models allows for assessing probabilistic
    quantities, such as reliability, resilience, and risk, and expected values of
    long-term performance metrics, such as yield, costs, benefits, and deficits, on
    the basis of simulations with sufficiently large samples (e.g., with length of
    hundreds or thousands of years). On the other hand, less often is synthetic data
    used for evaluating the behavior of hydrological models in the long run (e.g.,
    Nalbantis et al., 2011; Efstratiadis et al., 2015).


    Cornerstone of all aforementioned approaches, belonging to the broader family
    of Monte Carlo simulation, is the time series generation model, which has to ensure
    a concise representation of the probabilistic and stochastic structure of the
    actual processes, x and y. For a long time, this prerequisite has been determined
    as the preservation of a finite set of statistical characteristics of historical
    data within the synthetic ones by means of low-order moments (typically the mean,
    variance, skewness) and low-order auto- and cross-correlations (Matalas & Wallis,
    1976). However, in the context of stochastic calibration, this approach is not
    sufficient, since these metrics describe only partially the marginal and dependence
    regime of the actual processes x and y, while under some quite common conditions,
    unrealistic dependence patterns may appear in the synthetic data (Tsoukalas et
    al., 2018b).


    In this respect, we impose the following specifications for the data synthesis
    procedure, to be implemented within a consistent and robust stochastic calibration
    framework.


    +   1. Representation of the full probabilistic behavior of the input and output
    processes, through careful assignment of suitable distribution'
