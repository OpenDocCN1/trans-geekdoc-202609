    Taking advantage of the long experience with stochastic simulation approaches
    in water resources planning and management studies, we reveal a novel field of
    application of stochastics for calibrating hydrological models. The overall idea
    is very simple and follows the well-known calibration-validation paradigm, where
    calibration is employed with synthetic data and validation against the actual
    (i.e., observed) ones, which are also used as guidance for recognizing the stochastic
    behavior of the processes of interest. In this chapter, we introduce the so-called
    stochastic calibration approach, which is founded on the coupling of two totally
    different modeling philosophies (i.e., mechanistic and stochastic), and reveal
    its significant advantages over conventional parameter estimation methods. Emphasis
