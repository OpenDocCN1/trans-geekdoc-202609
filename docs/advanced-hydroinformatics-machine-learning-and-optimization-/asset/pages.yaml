    # 9.5. Results and Discussions


    # 9.5.1. ANN Stand-Alone Model


    For the ANN stand-alone approach, a total of 200 models was developed. These are
    the results of the exhaustive search in the variable space (number of hidden nodes
    (HN) and k folds). Figure 9.6 shows a pseudocode of the steps done to find the
    best model and the sequence of results is shown in Figures 9.7 and 9.8.


    To recap, we divided the subsets into three: calibration, validation (cross-validation),
    and test set. The latter is done to ensure independence in the test partition,
    therefore, avoiding the selection bias problem.


    ```

    cv = cvpartition (Data_ANN,''kfold'',k); %Divide data set in k folds k=1,..,10.
    Keep test set separated, (cvpartition is a built in function in MATLAB that divides
    the data in k folds)

    for HN=1:20 %number of hidden nodes tried

    for k=1:10 %10 folds

    Run ANN → f (HN, k)%use all subset but k for the training set and k for the validation
    set

    Store RMSE{HN, k} for train, val & test sets

    bar (1:10, [RMSE_train{HN, k} RMSE_val{HN, k} RMSE_test{HN, k}]

    % the figure is only showing HN=20

    end

    ANN_BestFoldperHN{HN}=min( (RMSE_train{HN,:}+RMSE_val{HN,:})/2 )

    %best fold per hidden node

    plot (HN, ANN_BestFoldperHN);

    end

    ANN_Bestfold=min(BestFoldperHN{HN}) %best fold among all hidden nodes

    ```


    Figure 9.6 Pseudocode for the ANN exhaustive.'
