    # 13.5. Comparison of Teleconnection Features Between Scales and Parameters


    Although the preceding results indicate that the average degree centrality and
    clustering coefficient values are much smaller than those for a streamflow system
    of a watershed or across large regions (Sivakumar & Woldemeskel, 2014; Halverson
    & Fleming, 2015; Fang et al., 2017), some interesting observations are still worth
    reporting at this stage. The basin-scale analysis shows that the degree centrality
    and clustering coefficient rank for water quality indicator is DO > NH3-N > COD_MN,
    and that for COD_MN is very low. This is reasonable, since COD is more impacted
    by human activity (especially in urban areas) and more localized leading to lower
    correlation among those distant stations. As expected, it presents'
