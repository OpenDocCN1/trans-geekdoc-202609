  md: '# IMPROVING MODEL IDENTIFIABILITY BY DRIVING CALIBRATION WITH STOCHASTIC INPUTS


    Andreas Efstratiadis, Ioannis Tsoukalas, and Panagiotis Kossieris


    *Department of Water Resources and Environmental Engineering, National Technical
    University of Athens, Zografou, Greece*


    For a long time, the classical problem of identifying the optimal modeling structure
    and/or parameters followed the calibration-validation norm, originating from the
    iconic split-sample scheme by Vit Klemes. A common feature of such approaches
    is their dependence on the length and representativeness of the available data.
    This introduces several questions since the inferred parameters are selected according
    to a specific subset (or subsets) of historical data, while the rest of data is
    used for validation. In this vein, we propose a conceptually simple approach driven
    by the well-known stochastic simulation paradigm, which builds upon the idea of
    calibrating models using alternative, yet probabilistically consistent, synthetic
    data. Decoupling this way, the available data now become the basis to generate
    stochastic inputs, as well as for model validation and parameter uncertainty assessment.
    This allows for embedding the stochasticity of real-world drivers (rainfall, evapotranspiration)
    and responses (runoff) and thus their hydrological uncertainty. Furthermore, it
    results'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'to stable and robust models, as calibration is performed using long enough
    time series that reproduce important properties that are associated with the changing
    climate (e.g., long-term persistence), which are generally hidden in the short
    historical samples. Identifying this way, the derived parameters are optimal not
    only for the historical data set, but for any alternative plausible realization
    of the modeled processes.


    # 2.1. Introduction


    Hydrological models are essential elements for supporting water engineering and
    management decisions. These typically adopt the concept of stationarity, which
    allows for handling the process descriptions and model parameters as time-invariant.
    In this respect, while model-based decisions refer to the intrinsically uncertain
    future, the identification of the underlying modeling scheme and the evaluation
    of its predictive capacity as well, are founded on past information about the
    catchment’s response against a known set of meteorological inputs.


    In a generic context, the identification of a particular hydrological model is
    subject to a sequence of user decisions, where the interplay of parameter values,
    process parameterization equations, and the overall system architecture should
    ensure the minimal uncertainty against the available information (Gharari et al.,
    2021). However, the typical problem posed in real-world applications is restricted
    to the parameter estimation of a given model structure. According to the common
    hydrological practice, this task is formalized by means of the well-known split-sample
    test (Klemeš, 1986) and its variants (e.g., Gowda et al., 2012; Arsenault et al.,
    2018; Nicolle et al., 2021). This requires separating the observed data in a calibration
    subset for parameter adjusting, and a second one for validation. Any important
    drop in model performance in validation with respect to calibration may raise
    flags about the model robustness, which is often due to overfitting against nonrepresentative
    calibration data. Therefore, key decisions are the separation strategy and the
