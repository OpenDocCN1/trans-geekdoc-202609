  md: 'error, resulting in six hidden nodes. Trials were made using 6, 8, 16, and
    32 nodes for the hidden layer of the LSTM models. The LSTM models for BCA11 and
    NP201 have 32 nodes in the hidden layer while those for the remaining stations
    have 8 nodes, based on the trials conducted. The Root Mean Squared Propagation
    (RMSProp) optimizer was used in this study, and the loss (error) function was
    the mean squared error. The optimizer is a gradient descent optimization algorithm,
    which divides the gradient by the moving average of the root mean squared gradient,
    first proposed and explained in an online course entitled "Neural Networks for
    Machine Learning" (Tieleman & Hinton, 2012), and is thought to be first used in
    Graves (2013). More recently, it was used in a study on stochastic optimization
    and was shown to be beneficial in MLP ANNs, although it is typically used in recurrent
    neural networks (Huk, 2020).


    The LSTM was built similarly to the TDNN using the same number of nodes in the
    hidden layer, the same optimizer, and the same activation functions. The length
    of the historical sequence that the model was trained on was 10 days. Trials were
    made for sequence window lengths of 5, 7, 10, and 20 days.


    Cross-validation was carried out using the Keras *EarlyStopping* “callback” (https://www.tensorflow.org/api_docs/python/tf/keras/callbacks/EarlyStopping)
    feature, which monitors the error (loss) on the cross-validation subset, and terminates
    training when the error no longer improves after a consecutive number of training
    loops or epochs. To ensure training did not stop before error was minimized, a
    “patience” of 100 epochs was specified. This ‘patience’ means that 100 consecutive
    epochs need to pass without the error of the cross-validation set improving, before
    training is terminated. The callback was set up to ensure that the weights that
    resulted in the lowest cross-validation error were restored after training is
    completed.


    Once configured, each model could be trained and the total number of epochs specified
    for training was 500. After training was completed, the TDNN models were initially
    tested using the randomly selected test set, and then were further tested to predict
    the 3 yr sequential time series. The LSTM models were tested only on the 3 yr
    sequential time series. The simulation time step for the models is 24 hr. In order
    to forecast lead times of 7 and 10 days, forecasts had to be made for lead times
    4–6 days and 8–9 days, respectively, in order to get the necessary WL inputs as
    indicated in Table 7.2.


    For model comparison, two benchmark models were employed: linear regression and
    naive models. Linear regression models were developed for each case using the
    same inputs and loss function. Random walk forecasts were also made based on the
    naive method. This type of forecast assumes'
