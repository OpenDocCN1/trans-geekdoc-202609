    # Figure 15.1 Map of the Yuna River basin.


    variation) ranges between 1,080 and 3,120 mm, with the area of greatest precipitation
    in the mountain region upstream of the reservoir. Most of the annual rainfall
    in the Dominican Republic occurs between the end of April and the end of October,
    with a bimodal trend that has peaks in May and around the end of August to October
    (CEPAL, 2020; Jury et al., 2007). Due to its geographical location, the country
    is exposed to extreme weather events such as hurricanes, cyclones, and tropical
    storms. The hurricane season begins in June and ends in November, with the months
    of August to the end of October the periods of greatest occurrence (Jesús Encarnación,
    2019).


    During periods of prolonged rain, floods occur frequently in the lower Yuna basin.
    The rains generate an increase in river flow that consequently overflows and affects
    low-lying populations downstream of the reservoir. The lower Yuna plain is subject
    to flooding in general, characterized by a terrain of low slopes, extensive plains,
    and a meandering river course.'
