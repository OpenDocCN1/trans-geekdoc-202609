  md: 'The lake subcatchment is represented the same way in all models, and the only
    difference between models is the spatial representation of the Jiboa subcatchment.


    # 4.3.5. Evaluation Criteria


    Different performance criteria were used to compare and assess the performance
    of each model: Nash-Sutcliffe efficiency coefficient (NSE) (equation (4.12)),
    Nash-Sutcliffe with logarithmic values (equation (4.13)), root mean square error
    (RMSE) (equation (4.15)).


    $$\mathrm{NSE(HF)} = 1 - \frac{\sum_t (Q_{obs} - Q_{sim})^2}{\sum_t (Q_{obs} -
    Q_{avg})^2}. \tag{4.12}$$


    As the standard formula of Nash-Sutcliffe overestimates high values, so changing
    the values of flow by logarithmic values (equation (4.13)) will flatten the high
    flow; the peaks and low flow values will be the same. As a result, the effect
    of the error in low flow values will dominate, and the error value will be more
    sensitive to error in low flow values (Krause et al., 2005).


    $$\mathrm{NSE(lf)} = 1 - \frac{\sum_t (\ln(Q_{obs}) - \ln(Q_{sim}))^2}{\sum_t
    (\ln(Q_{obs}) - \ln(Q_{avg}))^2}. \tag{4.13}$$


    The mean cumulative error measures how much the model succeeds in reproducing
    the streamflow volume correctly (equation (4.14)).


    $$WB = 100 \times \left(1 - \left|1 - \frac{\sum Q_{sim}}{\sum Q_{obs}}\right|\right).
    \tag{4.14}$$


    $$RMSE = \sqrt{\frac{1}{n}\sum_{i=1}^{n}(Q_{obs} - Q_{sim})^2}. \tag{4.15}$$


    Gupta et al. (2009) have shown the limitation of using a single error function
    to measure the efficiency of calculated flow and showed that Nash-Sutcliff efficiency
    (NSE) or RMSE could be decomposed into three components: correlation, variability,
    and bias. The KGE index (equation (4.16)) has aggregated this information into
    one formula, which measures how far the values of these properties are to the
    ideal point.


    $$KGE = 1 - \sqrt{(c - 1)^2 + (\alpha - 1)^2 + (\beta - 1)^2}. \tag{4.16}$$


    where $Q_{obs}$ is the observed discharge, $Q_{sim}$ is the simulated discharge,
    and $Q_{avg}$ is the mean of observed discharges, $c = $ *cross correlation between*'
