  md: '# 9.3.6. Wavelet Decompositions as an Input Preprocessor of Other Data-Driven
    Models


    Here the same procedure as explained above is followed, but now with different
    DDMs. To proceed with the simulations, it was considered convenient to make use
    of the data mining software called Weka, developed by the University of Waikato
    (http://www.cs.waikato.ac.nz/ml/weka/). With this software, a collection of machine
    learning techniques is available, which can be executed in Matlab, thanks to developments
    by Corzo Perez.


    # 9.3.7. The Noise Filtering Process in Wavelets Analysis


    An alternative option is to de-noise the signal. Once the decomposition of the
    signal is performed, it is possible to alter these resultant coefficients according
    to our needs. Several methods are recommended in literature such as Universal
    Threshold, Visu Shrink, Sure Shrink, Bayes Shrink, Normal Shrink, and so forth.
    For details, the reader can refer to Ruikar and Doye (2011) and Donoho and Johnstone
    (1994). In the present study, the threshold is found via optimization, and soft
    thresholding is applied for each decomposition level and again for each input
    series in the ANN model, so a number of No dec level × ANN Inputs threshold coefficients
    were calculated.


    Then the calculated thresholds can be treated as follows in the detail representation.
    In soft thresholding, all coefficients below a certain threshold are set to zero,
    and those whose magnitude are greater than the threshold are shrunk by that amount.
    This method recognizes that the coefficients contain both signal and noise, and
    attempts to isolate them.


    $W_i^{soft} = \begin{cases} 0 & |W_i| < \lambda \\ sign(W_i)(|W_i| - \lambda)
    & |W_i| > \lambda \end{cases} \quad (9.9)$


    In comparison, hard thresholding retains only the values above the threshold and
    is considered to correspond to the coherent part of the signal. The rest corresponds
    to the random or noisy part of the signal (Addison, 2010). Graphic illustrations
    of the filtering effect are shown in Figure 9.4.


    $W_i^{hard} = \begin{cases} 0 & |W_i| < \lambda \\ W_i & |W_i| > \lambda \end{cases}
    \quad (9.10)$


    Some authors (Okkan, 2012; Okkan & Serbes, 2013) affirmed that some subseries
    are ineffective and must be removed to improve the generalization capability of
    the model. On the contrary, Adamowski and Sun (2010) have used the complete subseries
    as inputs to the ANN model,'
