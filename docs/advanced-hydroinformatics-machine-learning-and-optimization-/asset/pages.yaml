- pgno: 405
  md: 'where, *NSE* is Nash-Sutcliffe efficiency coefficient; $Q_t$ is the discharge
    at time $t$; $\overline{Q_{Q>Q_0}^R}$ is the average value of discharge larger
    than $Q_0$ of a real hydrograph; $t_1$ and $t_2$ are the start and ending time
    for discharge larger than $Q_0$, respectively; other terms are the same as in
    equation (14.13).


    3. The third criterion also uses one indicator for similarity, which is the weighted
    root mean square error (wRMSE). A weight is added in each time step, decided by
    the proportion of discharge at time $t$ to the sum of discharges across all considered
    time steps, which is a way to introduce higher importance (weight) to higher flow
    discharges. The equation used, which also focuses on upper part of hydrograph,
    is


    $$\min wRMSE = \sqrt{\frac{1}{t_2 - t_1}\sum_{t=t_1}^{t_2} w_t \left(Q_t^S - Q_{t,Q>Q_0}^R\right)^2},
    \tag{14.16}$$


    $$w_t = \frac{Q_{t,Q>Q_0}^R}{\sum_{t=t_1}^{t_2} Q_{t,Q>Q_0}^R}, \tag{14.17}$$


    where, $wRMSE$ is weighted root mean square error; $w_t$ is weight at time $t$;
    other terms are same as equation (14.14).


    4. The last criterion considers the factors affecting downstream risk and storage
    area damage. According to the two objective functions (see section 14.2.1.2),
    the downstream risk is affected by the flood duration (the time when the stage
    is larger than warning level) and peak value (difference between maximum stage
    and warning level) while the storage area damage is calculated with the water
    levels inside, which are largely influenced by peaks of hydrographs. Similarly,
    the last criterion is to compare the duration and flow peaks of two hydrographs.
    The threshold discharge is same as previously defined. Each term is normalized,
    using following equation:


    $$\min PD = nor(PD_1) + nor(PD_2) + nor(PD_3) \tag{14.18}$$


    $$nor(PD_i) = \frac{PD_i^j - \min\left(PD_i^j\right)}{\max\left(PD_i^j\right)
    - \min\left(PD_i^j\right)}, \tag{14.19}$$


    $$PD_1^j(Q^R, Q^{S,j}) = \left|Q_{p1}^R - Q_{p1}^{S,j}\right|, \tag{14.20}$$


    $$PD_2^j(Q^R, Q^{S,j}) = \left|Q_{p2}^R - Q_{p2}^{S,j}\right|, \tag{14.21}$$


    $$PD_3^j(Q^R, Q^{S,j}) = \left| D\left(Q_{Q>Q_0}^R\right) - D\left(Q_{Q>Q_0}^{S,j}\right)
    \right|, \tag{14.22}$$'
