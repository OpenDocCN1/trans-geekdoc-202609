- pgno: 393
  md: 'here, use a hydrodynamic model and a coupled simulation-optimization model,
    described below.


    # 14.2.2. HEC-RAS Hydrodynamic Model


    The hydrodynamic model was built using HEC-RAS software, covering the whole study
    area, from upstream Lutaizi station to downstream Bengbu City, including four
    main storage areas. This model simulates the propagation of hydrographs from Lutaizi
    to Bengbu providing results in terms of water levels in both Bengbu City and four
    storage areas. These results depend on the upstream hydrograph and certain operations
    of inlet and outlet gates that control the usage of the flood storage areas. In
    previous studies, the inflow hydrograph was from observed discharge from 24 June
    to 7 September 2007 (Fig. 14.2).


    # 14.2.3. Coupled Simulation-Optimization Model


    The coupled simulation-optimization was set up by embedding the HEC-RAS model
    in the optimization process using the Nondominated Sorting Genetic Algorithm II
    (NSGA II).


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_393_0.png)


    Figure 14.2 Inflow hydrograph at Lutaizi station from 24 June to 7 September 2007.'
  merge: -1
  img_proc: true
- pgno: 394
  md: "The decision variables X in this optimization problem are the values of stage\
    \ differences between the river and the storage areas, which in HEC-RAS triggers\
    \ the opening/closing of the control gates. These values are in fact determining\
    \ the operational strategies for the gates. In order to decrease complexity in\
    \ the optimization, only the operation of four storage area inlet gates was taken\
    \ into consideration. (Stage differences for the outlet gates were set at 0.1\
    \ m for opening and 0 m for closing, as their use is only after the passage of\
    \ the flood peak.) For each inlet gate, the stage difference for gate opening\
    \ is an absolute value while the stage difference for closing uses a variable\
    \ that is a fraction (from 0 to 1), which multiplies the value of stage difference\
    \ for gate opening (to ensure that stage differences for closing are always smaller\
    \ than those for opening). Therefore, there are eight decision variables (X =\
    \ (X1, X2, X3, X4, X5, X6, X7, X8)) in total (four inlet gates for four storage\
    \ areas, each with one opening and one closing stage difference value).\n\nThe\
    \ conflicting objectives were described by two objective functions, downstream\
    \ flood risk (Obj1) at the location of Bengbu City, and storage area damage index\
    \ (Obj2). The first objective consists of three components: (subobjective 1) the\
    \ duration when stage in Bengbu is higher than predetermined warning level (HW,\
    \ 20.3 m), which needs to be as short as possible; (subobjective 2) the difference\
    \ between maximum stage and warning level, which should be as small as possible;\
    \ (3) because stage at Bengbu should be strictly below a predetermined safeguard\
    \ level (HS, 22.3 m), it becomes a constraint in the optimization problem by introducing\
    \ a penalty function. The function of the first objective is\n\nMin F1(X) = w1\
    \ · O1(h(X), HW) + w2 · O2(h(X), HW)\n          + P(h(X), HS),          (14.1)\n\
    \nO1(h(X), HW) = T(h(X) > HW),          (14.2)\nO2(h(X), HW) = max(h(X)) − HW.\
    \          (14.3)\nP(h(X), HS) = 10^{17 max(h(X)−HS)},          (14.4)\n\nwhere,\
    \ F1(X) is downstream flood risk; X is the vector of decision variables; h(X)\
    \ is stage hydrograph at Bengbu City; HW is warning level (20.3 m); HS is safeguard\
    \ level (22.3 m); O1 is subobjective 1 (in unit of day); O2 is subobjective 2\
    \ (in unit of decimeter); P is a penalty function; w1 and w2 are weights for subobjective\
    \ 1 and 2 respectively (both equal to 0.5). T is duration of stage h(X) above\
    \ HW.\n\nThe calculation of subobjective 1 and 2 is indicated in Figure 14.3 with\
    \ the example of a hydrograph in Bengbu City in 2007."
