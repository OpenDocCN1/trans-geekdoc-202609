    The values for population size and individual parameters in the algorithms largely
    depended on the optimization problem (Ritter, 2016). Trial and error tests were
    carried out using various population ranges to select the population size. Populations
    greater than 100 individuals did not improve the results and increased the computational
    time needed for the NSGA II. For the MOEA / D, the population was defined as 300
    individuals. For the other parameters, trial and error tests were performed using
    small populations (up to 50 individuals) so that the program could converge rapidly.
    Default values were taken as a basis for the algorithms.


    The optimization process was developed by a computer with 16 GB of RAM and eight
    2.6 GHz cores. The codes were executed by implementing the Multiprocess Evaluator
    module, which allowed faster calculations and for different individuals within
    the same generation to be calculated in parallel. On average, the program reported
    convergence for each operating model after 8 hr in 10,000 evaluation processes.


    Using the JMETALPY display module, the Pareto fronts were obtained for each of
    the program executions. For each model, a 3-D Pareto front was generated, having
    been optimized by both the NSGA II algorithm and the MOEA / D. A total of 14 models
    was simulated. As mentioned above, the decision variables were the parameters
    of the ML models. Therefore, the optimized parameters for MLP were weights ($w_i$,
    $v_i$) and biases ($b_i$). In RBN models, they were centers ($c_{j,i}$), radii
    ($r_{j,i}$), and weights $w_i$. For LF, the coefficients are $\beta_1$, $\beta_2$,
