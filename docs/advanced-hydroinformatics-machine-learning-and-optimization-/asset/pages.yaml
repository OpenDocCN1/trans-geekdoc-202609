  md: 'denotes a realization of it. The identification of θ is typically carried out
    through calibration, by considering a set of realized inputs and outputs, x_i
    and y_i, respectively, and a performance function, P [y_i, M (x_i | θ_i)], to
    evaluate the closeness of simulated to actual outputs (e.g., efficiency). We remark
    that as result of calibration, although the transformation function, M, is deterministic,
    its parameters also can be considered as random, since they are inferred from
    the random processes x and y.


    In the classical split-sample scheme and its alternatives, the realized data are
    obtained from observed records, x_o and y_o, a subset of which is used to calibrate
    the model and the rest for validating its predictive capacity against an independent
    data set. As already discussed, well-known shortcomings of such approaches are
    the potential lack of representativeness of historical data and their inability
    to represent long-term hydroclimatic changes (often, but not solely, associated
    with their length), which eventually results in poorly identified parameters.
    This problem is further intensified since we have to keep a significant part (e.g.,
    half) of observations for validation purposes, thus loosing valuable information
    that may be contained in the associated data subset. Furthermore, when the observed
    records have different sizes, only their common part can be accounted for in calibration
    and validation, while the nonoverlapping period of data is ignored. This case
    occurs quite often, since rainfall data, which is a rather easily retrievable
    information, usually exceeds the period of runoff observations.


    Here we manifest an alternative approach for parameter estimation, which follows
    the stochastic simulation paradigm (Efstratiadis, 2011), as depicted in Figure
    2.1. Similar to the classical slit-sample scheme, this also involves a twofold
    strategy, yet by using long synthetic data within calibration (we apply symbols
    x_s and y_s for synthetic inputs and outputs, respectively), while the validation
    is employed against the full set of observed data, x_o and y_o. Apart from the
    deterministic hydrological procedure, M, and the performance function, P, the
    computational procedure also requires a synthetic time series generator, G. Ideally,
    this has to reproduce the true hydrological regime of the input and output processes,
    x and y, respectively. This option is offered by stochastic models, which are
    generally built upon the information contained in the historical data. In this
    respect, the synthesis procedure can be expressed as a multivariate stochastic
    transformation of the form:


    [x_s, y_s] = G[x_o, y_o]. (2.1)


