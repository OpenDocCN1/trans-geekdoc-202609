    # 1.3.5. Uncertainties in the Process of Building a Model


    Modeling leads to a generation of new knowledge and new insights into the modeled
    processes, and typically involves cycles of progressive refinement and improvement,
    and even reformulations of the initial modeling goals. Some of possible questions
    raised during modeling experiments, and the related cycles, are shown in Figure
    1.8. Each of these questions is associated with an uncertain variable in the process.
    Uncertainty in data inevitably propagates to models’ outputs. Changes in data
    partitioning also lead to different model parameterizations. Changes in the input
    variables set can lead to different model outputs and hence varying performance.
    Many ML models require random initializations of parameters, so that multiple
    runs may lead to different results. Finally, the idea of having one objective
    function in the optimization process, where the real problem can normally have
    multiple objectives, makes the model biased to a certain modeling objective. For
    example, a ML model built for high flow might not be optimal for low flows and
    vice versa. Since there is no perfect measure for performance, there is uncertainty
    associated with the choice of what is defined as optimal in the modeling process.


    In ML theory and practice, all these problems have been studied, are quite well
    understood, and adequate techniques have been developed. For example, n-fold cross-validation
    is used to deal with uncertainties in data partitioning. Uncertainty is reduced
    if instead of using a single model, multiple (ensemble) models are built, based
    on different parameter (weights) randomizations, and then aggregated using (dynamic)
    weighting. The problem of multiregimes of the modeled system and seasonality is
    solved by modular or committee systems (Corzo & Solomatine, 2007b, 2007a; Kayastha
    et al., 2013). For problems related to the IVS, feature engineering offers a number
    of techniques (see Guyon & Elisseeff 2003; Bowden et al., 2005a, 2005b; Galleli
    & Castelleti, 2013). Robustness'
