  md: 'Multiple Enlargement method was used, which is frequently used for generating
    design hydrographs (Yue et al., 2002; MWR, 2006; Xiao et al., 2009; Tan et al.,
    2017; Yin et al., 2018; Rizwan et al., 2019). In this method, a typical hydrograph
    needs to be selected first, whose discharge would be amplified with a multiplier,
    which is calculated as the ratio of flood volume or peak discharge for a particular
    return period to that of the typical hydrograph. Usually, the volume ratio is
    used for storage areas. Considering that the use of the four storage areas in
    this study may last for a month, the volume is chosen as the sum of successive
    30 days’ largest discharge, so that the formula of the multiplier is


    $$K = \frac{V_{30,R}}{V_{30,T}}\tag{14.11}$$


    where, $K$ is the multiplier; $V_{30,R}$ and $V_{30,T}$ are the 30 days’ volume
    for a particular return period and a typical year, respectively.


    For the sake of data availability, the typical hydrograph is chosen as the 2007s.
    The generated hydrographs have the same shape as 2007 but with different flood
    volume, depending on the return period. Two most severe records were found in
    Chinese history, the years 1954 and 2003, with 30 and 60 return years, respectively
    (see Table 14.1). Their flood volumes are used for calculating the multipliers.
    It should be noted that with this approach the optimal strategies will be tested
    with very different hydrographs compared with the ones produced with the sampling.
    These multiplied hydrographs are presented in section 14.3.1.


