  md: 'Since the two ML models have different training sets based on the data partitioning,
    the references made between the two do not represent a true comparison. As the
    main aim of the research is to compare them with a numerical model and not each
    other, the references made were for the purpose of discussing the performance
    of both models and not to determine which ML model is better.


    The characteristics observed in the results presented for both the short-term
    and medium-range water-level forecasts at station NP201 were also observed in
    the results for the other stations. The performances of these models are presented
    in Appendix Tables 7.A1 and 7.A2.


    # 7.6.4. Comparison of the ML Model With the Numerical Model


    The BISECT model (Swain & Lohmann, 2019) simulates surface water on a 10 min time
    step, so daily average water-level predictions are used for comparison in this
    study. When comparing the daily water-level prediction from each model, the results
    are promising as they relate to water-level forecasting in the southern Everglades.
    The ML models are able to predict peaks and troughs much better than the numerical
    model (Fig. 7.11). The sections of the BISECT model water-level prediction that
    correspond to troughs in the graphs of the measured data appear to be flattened.
    This flattening of the troughs is because only the surface water component of
    the BISECT model was considered for comparison, because the ML models also are
    solely based on surface water. Regardless, the peaks are much more accurately
    predicted by the ML models and would suggest that, were the groundwater component
    of the BISECT model added, its overall performance would improve; but the ML models
    may still predict more accurately. The BISECT model can have a bias in water levels,
    which varies from station to station, such as the low overall mean values seen
    at station NP201 in Figure 7.11. The causes of some of these biases are unknown,
    but others are from uncertainties in the numerical grid formulation, where a good
    model fit at one location can correspond to a poor fit at another location. The
    ML models represent locations independent of each other, so adjusting for a better
    fit at one location does not affect other locations. The BISECT model is able
    to capture the general seasonal variations and fluctuations in water level, however
    it is less precise than the ML models, due to the properties of the numerical
    model described earlier, and how its inputs and outputs are processed.'
