- pgno: 391
  md: 'Robustness refers to the ability of a system to continue with its functioning
    when meeting uncertainty conditions (Jen, 2003). Optimization of robustness aims
    to identify solutions that can maximize system robustness. Taguchi (1986) is one
    of the persons who initially estimated uncertainty to optimize robustness by minimizing
    mean square deviation of a given design objective. Such a method that regularizes
    original function (e.g., mean or variance of objective functions value in the
    proximity of a certain solution) has widely been used later in robustness optimization
    research even in water-related fields (Andricevic & Kitanidis, 1990; Babayan et
    al., 2005; Hollinshead & Lund, 2006; Malekmohammadi et al., 2009). Another popular
    method is to optimize two different objective functions for solving multi-objective
    problems, which often introduces Pareto-optimal method when these objectives are
    conflicting with each other (Beyer & Sendhoff, 2007). For example, Jung et al.
    (2013) proposed three formulas of quantifying tunnel pressure robustness, which
    were separately coupled with a specified economic cost function, in order to find
    out the most suitable way of describing system robustness. The authors compared
    three Pareto fronts and identified the function representing the sum of nodal
    pressure robustness index as the best one to generate least vulnerable solutions.
    The mentioned approaches of robust optimization solve given standard optimization
    problem, but they are unable to present the impact of uncertainties (Marquez-Calvo
    & Solomatine, 2019). To address this, Solomatine (2012) proposed an approach explicitly
    presenting the effect of uncertainty in multi-objective optimization problems
    by generating multiple Pareto fronts, which is the so-called Robust Optimization
    and Probabilistic Analysis of Robustness (ROPAR). Marquez-Calvo and Solomatine
    (2019) further developed this method so that decisions can be made depending on
    the uncertainty analysis. This is quite recent methodology, which needs to be
    applied in more practical case studies for further confirmation of its value.


    Another area of increasing importance is real-time operation. Over the last decades,
    many researchers combined optimization and real-time operation in order to seek
    real-time optimal solutions, which is also introduced in the field of water management.
    There are two prominent categories of approaches to use optimization in the real-time
    system. The first one is to integrate optimization algorithm with real-time simulation
    models in which case a forecasting model is often introduced (Shamir & Salomons,
    2008; Fallah-Mehdipour et al., 2012; Che & Mays, 2015; Odan et al., 2015). With
    this method, decisions are determined based on present observation and future
    possible situations. However, such real-time operation involving advanced forecasts
    and modeling of upstream conditions often brings additional uncertainties. The
    second approach is'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'based on usage of an existing set of optimal solutions, derived from analysis
    of historical events (commonly available in some databases), from which the real-time
    decision is chosen using some criteria. For example, Malekmohammadi et al. (2009)
    built a hydrodynamic model for Bakhtiari and Dez River-Reservoir systems in Iran,
    used to derive optimal solutions from historical floods using genetic algorithm.
    When current observation comes, similar events as well as corresponding optimal
    solutions would be found by the K nearest neighbor (K-NN) algorithm. However,
    such research that considers real-time operation is mostly related to reservoir
    operation or water distribution systems operations, while studies that are considering
    flood storage area management are absent. To our knowledge, this study is the
    first one to study both real-time operation and robust optimization of flood storage
    areas for developing operation strategies.


    This chapter proposes robust optimization strategies and near-real-time operation
    method for operating multiple gates of the flood storage areas considered. Before
    the start of strategy development, uncertainty of inflow was analyzed, which was
    realized by sampling synthetic hydrographs, generating 100 possible inflow hydrographs
    with the characteristic of different severity levels. In order to produce robust
    strategies, the method of ROPAR was used and the probability of inundation of
    the considered storage areas was derived. For developing potential real-time operation
    method, these sampled hydrographs and corresponding optimal solutions were taken
    as pre-exiting set of solutions to be considered during actual strategy selection
    and extraction. In order to identify the most similar inflow conditions, four
    methods were proposed and tested. The testing was carried out by three amplified
    hydrographs (considered actual for real-time operations), which were derived by
    a standard approach taken in China to represent hydrographs with different return
    periods. Finally, the robust strategies and real-time decisions were compared
    so that the suitability of the different methods could be assessed. The analysis
    of storage area operation could hopefully provide suggestions for local administration
    with the aim of reducing flood risk in Bengbu City while simultaneously lowering
    storage area damage.


    # 14.2. Materials and Methods


    # 14.2.1. Available Data and Models


    As this study is a continuation of previous work of Jonoski et al. (2018) and
    Jonoski et al. (2019), some of their methodologies and results need to be briefly
    introduced here. These past studies, as well as the one presented'
  merge: -1
