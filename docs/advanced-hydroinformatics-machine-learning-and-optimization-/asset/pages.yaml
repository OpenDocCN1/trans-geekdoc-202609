  md: 'comparison, additional tests on extreme phenomena (crash tests), and a benchmark
    or reference model are used to assess the quality of the model as well. It is
    difficult to choose only one performance measure for a good model, so model training
    can be posed also as a problem of multiobjective optimization; on multiobjective
    machine learning, see, for example, Corzo and Solomatine (2006); and on multitask
