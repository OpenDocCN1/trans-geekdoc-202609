  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_340_0.png)


    **Figure 11.2** Scheme of the method to calculate the optimal cluster size filter.
    The angle C is calculated with the sides a, b, and c of the triangle formed by
    the three subsequent points (zoomed-in view).


    “cluster size filter vs. the number of 3-D clusters,” at which the number of clusters
    stabilizes (i.e., does not undergo considerable changes for a constant increase
    of the cluster size filter; Fig. 11.2). This point is defined as the vertex of
    the curve (Fig. 11.2). To identify this point, we developed a method based on
    the angle C formed between two continuous segments of the curve “cluster size
    filter vs. number of 3-D clusters” (Fig. 11.2). We calculated this angle C using
    the law of cosines (equation (11.2)), which considers the length of the sides
    of the triangle a, b, and c formed by the coordinates of three subsequent points
    (i.e., the points (x₁, y₁), (x₂, y₂), and (x₃, y₃); Fig. 11.2). For each triad
    of points, the angle C was calculated. The vertex corresponds to the smallest
    angle of all the calculated Cs. The optimal cluster size filter was calculated
    for each drought indicator threshold.


    $$\cos C = \frac{a^2 + b^2 - c^2}{2ab}.$$ \tag{11.2}


    # 11.2.2. Drought Characterization


    After identifying the 3-D drought clusters, the onset and end in time, duration,
    and severity (magnitude) were calculated for each drought (3-D cluster) with a
    similar methodology to Diaz et al. (2020a).


    The drought duration (*dd*) and magnitude (*ds*) were obtained with equations
    (11.3) and (11.4), respectively. The times *ti* and *tf* are the onset'
  merge: -1
