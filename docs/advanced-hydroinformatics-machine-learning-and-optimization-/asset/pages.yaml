  md: 'main steps: (1) calculation of the drought indicator, (2) classification of
    the voxels in drought, and (3) calculation of the 3-D clusters (Fig. 11.1). After
    calculating the droughts, their characterization is carried out as described in
    section 11.2.2.


    # Step 1. Drought Indicator Calculation


    The drought indicator is calculated with the hydrometeorological data. This indicator
    makes it possible to define anomalies in the data by using a statistic (Fig. 11.1,
    top panel). The standardized drought indicators, for example, standardize the
    values of the hydrometeorological variable. Using these standardized values, the
    drought is identified by means of a threshold associated with a statistical value
    that defines an anomaly as drought. Values lower than the threshold are considered
    as drought. Other indicators use a threshold value directly applied to the hydrometeorological
    variable for the entire analysis period or a moving time window. In this second
    method, the values that are below the threshold are also considered as drought.


    # Step 2. Classification of Voxels in Drought


    After drought indicator calculation, the indication that a voxel is in drought
    is carried out with the drought indicator data. To indicate that a voxel is in
    drought, the binary classification is employed (i.e., the use of 1s and 0s; Fig.
    11.1, top panel). In this way, drought is identified with 1s and nondrought with
    0s, as indicated in equation (11.1). When the drought indicator (DI) is below
    a selected threshold (T), a cell is in drought. In equation (11.1), D_s stands
    for drought state (i.e., drought (1) or nondrought (0)).


    $$D_S(t)=\begin{cases}1 & \text{if } DI(t)\leq T \\ 0 & \text{if } DI(t)>T\end{cases}
    \tag{11.1}$$


    This research also analyzes the effect of the threshold (T) on the calculation
    of droughts (3-D clusters). The thresholds of 0, −1, −1.5, and −2 are tested.
    It is noted that, in standardized drought indices, the values equal to or below
    zero indicate “drought.” Equation (11.1) is applied in each voxel in each time
    step (t).


    # Step 3. 3-D Clusters Calculation


    The third step is the calculation of the 3-D clusters. A clustering method to
    extract the drought events is applied following Corzo Perez et al. (2011). The
    drought events correspond to the 3-D clusters calculated'
