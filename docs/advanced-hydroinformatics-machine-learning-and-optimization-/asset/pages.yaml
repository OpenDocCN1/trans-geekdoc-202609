  md: 'In Figure 9.13 visual inspection of time series shows consistent best estimates
    of flow in this order: 1st- de-noised wavelet ANN (light), 2nd- wavelet ANN (grey)
    and 3rd ANN stand-alone (dark). In the residual error graph, it is clear that
    the WANN model can capture peak flows more accurately than the ANN model, however
    the de-noised WANN is even better. Even for the other flow regimes (medium and
    low flows), the WANN model outperforms the ANN model, where the grey spikes in
    the residual are almost always smaller than dark in absolute magnitude. In the
    case of the WANN and de-noised WANN, these other regimes present similar behavior.


    # 9.5.4. Other Data-Driven Models: Least Median Square, Model Tree (M5P), Pace
    Regression, and Linear Regressions


    Four different DDM were tested, these being (1) least median square, (2) model
    tree (M5P), (3) pace regression, and (4) linear regressions. Results can be visualized
    in Figures 9.14 and 9.15. The charts are divided into the training, validation,
    and testing sets for all decomposition levels. It can be seen that for different
    DDMs, data preprocessing with wavelet analysis is always improving the model skills,
    however, only for certain decomposition levels. This is an indicator that wavelet
    subseries can play an important role in the modeling process, reflected by the
    improved results that must be cautiously found in the decomposition space at the
    expense of greater computational resources. Among models, the coupled wavelet-M5P
    (DDM 2) seems to consistently provide the best results and is quite comparable
    with the performance of the coupled WANN model done in the previous section. In
    second are the methods (3) and (4) with wavelet as preprocessor, presenting similar
    performances in all data sets. Finally, method (1) had the lowest performance
    within the studied models, clearly showing that the problem to solve cannot be
    assumed with linear behavior and is negligibly improved by the wavelet subseries.


    Figure 9.16 depicts the simulated discharges during the testing phase for all
    the proposed DDMs. As mentioned before, the wavelet model tree (WM5P) outperformed
    others in all regimes (low, medium, and high flow). Nevertheless, the method manages
    to overcome (or close) to the 100 m³/s RMSE barrier (considered as good) but is
    still not better than the WANN model (Table 9.4).'
