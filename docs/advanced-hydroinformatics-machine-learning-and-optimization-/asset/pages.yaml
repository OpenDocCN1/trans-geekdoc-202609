- pgno: 120
  md: 'linear regression (SNET, 2005). Hourly temperature estimates were calculated
    from one available daily station using the sine function and were used for the
    whole catchment. The lake is simulated using a storage-outflow relation, where
    storage changes from inflow, direct rainfall, and evaporation are updated each
    time step. Outflow from the lake is calculated using the newly calculated storage.
    Inverse square distance weighting method was used to calculate distributed data
    for different spatial resolution for all data required for the hydrological simulation
    (precipitation, temperature, potential evapotranspiration).


    # 4.3. Methodology


    The first step in building a fuzzy committee is hard partitioning, where a pareto-optimal
    set of specialized nondominated models is created via multi-objective optimization.
    Out of many possible models generated, those better representing high and low
    regimes are selected. The first step results in two specialized high and low flow
    models addressing the catchment response they are built to reproduce. The second
    step is combining the simulated discharge from each model developed in the first
    step, using a fuzzy membership function. The fuzzy membership function consists
    of two parameters γ and σ whose values are obtained using optimization; the result
    of this step will be one simulated discharge output. (see Fig. 4.3). The term
    *committee model* will refer to a committee of two specialized models for low
    and high flow combined using a weighting scheme with optimized values of γ and
    δ to minimize the value of RMSE.


    # 4.3.1. Model Structure Description


    HBV-96 lumped conceptual model (Lindström et al., 1997) is used in this study
    to simulate the vertical movement of water for each cell/subcatchment. The raster-based
    distributed model is built where runoff from each cell is routed directly to the
    outlet using the Maxbas function (Fig. 4.4); each cell has a MAXBAS value depending
    on its flow path length. Discharge at the outlet is obtained by summing the routed
    runoff from all cells at each time step. Only superficial discharge (surface runoff
    and interflow generated from upper zone UZ reservoir in the HBV model structure)
    is routed, while flow generated from lower zone LZ is assumed to be lumped for
    the whole catchment (Fig. 4.4).'
