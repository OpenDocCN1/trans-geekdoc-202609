    # 15.3.4. Objective Functions


    The optimization process uses the reservoir operation model to identify what parameters
    of the ML models represent the best solutions (i.e., nondominated solutions).
    There are three objectives: Flood control, water supply for irrigation, and hydropower
    generation.


    # OF1. Flood Control


    The goal is to minimize $Q_{f,t}$, which is obtained in each time step $t$ from
    the conditional equation (15.9), where $(Q_t - \bar{q})^2$ represents the square
    of the excess flows, being $Q_t$ (m³/s) the reservoir''s daily discharge and $\bar{q}$
    a proposed limit flood flow. The following function defines OF1 for the entire
    analysis period $T$:


    $OF1 = \sum_{t=1}^{T} (Q_{f,t})$,  (15.8)


    $Q_{f,t} = \begin{cases} 0 & \text{if } Q_t \le \bar{q} \\ (Q_t - \bar{q})^2 &
    \text{otherwise} \end{cases}$.  (15.9)


    In the present study, a flow limit is proposed from which the optimizer seeks
    to punish the discharges. Similar to Saavedra et al. (2010), this limit flow is
    set as the average of all the daily discharge values ($Q_t$) of the reservoir
    that exceeded the average discharge flow of the series ($Q_{mean}$). Therefore,'
  merge: -1
  img_proc: true
- pgno: 444
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_444_0.png)


    Figure 15.11 Demand for irrigation downstream of the reservoir.


    using equation (15.10), the flow limit q̄ is obtained, where N = number of records
    that exceeded the average discharge flow of the series.


    q̄ = Σ_{i=1}^{N} Q_i / N ; Q_i > Q_mean. (15.10)


    # OF2. Water Supply for Irrigation


    The goal is to minimize deficits in the irrigation water supply Q_ir,t in each
    time step t from the reservoir''s daily discharge Q_t (m³/s) with respect to the
    water demand for irrigation d_t. The following function defines OF2 for the entire
    period of analysis T:


    OF2 = Σ_{t=1}^{T} (Q_ir,t) (15.11)


    Q_ir,t = { 0 if Q_t > d_t ; (d_t - Q_t)^2 otherwise } (15.12)


    Irrigation demands were obtained using the CROPWAT program (Smith, 1992). Taking
    into account that the cultivation of rice demands the greatest amount of water
    and covers the largest area of crops in the lower Yuna, irrigation demand calculations
    were made from the requirements and the cycle of the rice cultivation. Rice in
    the Dominican Republic has two sowing periods in the year: (1) December to April,
    and (2) the months of June, July, and August (Moquete, 2004). Climatic data (temperature,
    humidity, wind speed, hours of sunshine) and rainfall data were provided by INDRHI
    (taking monthly mean data for the analysis period). From the cultivation areas,
    the monthly average demands for the analysis period (2009–2019) were calculated,
    which are shown in Figure 15.11.'
