    The variability in river water quality parameters is the result of a complex and
    nonlinear influences of environmental factors (external factors) and regional
    characteristics (internal factors) and, therefore, connections are the key to
    understand the water quality dynamics. In this regard, CN provides strong theoretical
    foundations and new ideas and facilitate water environment planning and management.
    With data-intensive investigations becoming a new scientific discovery paradigm,
    the concepts of CN can go a long way in our ability to model, predict, and manage
    water quality and river systems.


    This work collected intensive water quality data in plenty water quality stations
    and utilize network indexes to explore the connections and teleconnections of
    typical water quality parameters. The Huaihe River basin was selected as a large
    watershed scale study area and large rivers covering east China were selected
    as a large region scale study area. Based on the linear correlation between stations,
    the degree centrality and clustering coefficient were calculated to characterize
    the statistical characteristics of water quality CNs, and to reveal the potential
    teleconnection of water quality processes.


    # 13.2. Study Areas and Methods


    # 13.2.1. Study Areas and Monitoring Campaign


    In this study, two scales of water quality system in China are studied: watershed
    scale and national scale. For the watershed scale, the Huaihe River is considered,
    and the major rivers in China are considered for the national (or large region)
    scale. They are both significantly impacted by human activities.


    # Huaihe River Basin


    The Huaihe River basin (30°55′~36°36′ N, and 111°55′~121°25′ E) is located in
    eastern China (Fig. 13.1), between the Yangtze River basin and the Yellow River
    basin. It flows through five provinces of China, namely'
