    in Huaihe River basin still tend to play a vital role in the national-scale network.
    But the pattern for DO presents a difference between the two scales even in the
    same river. It reflects the different drivers of teleconnection among different
    parameters.


    # 13.6. Study Limitations and Future Works


    We conducted the CN methods to analyze the teleconnections in water quality monitoring
    networks. However, the number of stations considered in this study may be insufficient
    to provide strong interpretations and conclusions, from the perspective of CN.
    For instance, the small number of stations, yielding small number of nodes and
    links, cannot produce accurate CN indexes, especially in the context of teleconnection
    patterns. It should be noted, however, that the water environment is getting more
    attention from government and the public. Concepts such as Smart City requires
    a large on-line monitoring network for real-time management. The rapid development
    of water quality monitoring technology and instruments makes the big data of water
    quality possible, leading to more widespread applications of the CN method.


    Besides, there should be a time lag between the water quality dynamics at upstream
    and downstream stations. In this study, however, we ignored the drivers from upstream
    water quality process, which may hide the local correlation, and exaggerate the
    teleconnection crossing the basin/region.


    The teleconnection analysis can certainly help us understand the intuitive rules
    of water quality dynamics. However, more fundamental and intrinsic laws need to
    be brought in to enlighten the dependence on attribution analysis, for further
    improving the reasonability of this work. The physical causes of the CN results,
    especially for their spatial difference, should be discussed further. Usually,
    water quality is mainly controlled by the geographical conditions in a basin,
    including the climatic conditions, soil characteristics, geological conditions,
    land-use/land-cover, and many'
