    # 2.5. Concluding Remarks


    Hydrological models that are calibrated against short records may be unable to
    reproduce the anticipated catchment behavior in the long run, while additional
    drawbacks arise due to the essential sacrifice of historical data in order to
    keep space for validation. In an attempt to address this issue, we highlight a
    promising strategy, aiming at inferring the model’s parameters on the basis of
    synthetic rainfall-runoff data, and employ validation against the full historical
    sample of observations. The so-called stochastic calibration scheme is driven
    by a synthetic time series generation procedure, implemented within the R-package
    anySim, which takes advantage of the available data to represent the probabilistic
    properties and dependence structure of the rainfall-runoff processes across multiple
    scales, and the long-term fluctuations of the changing climate as well. Crucial
    requirements of the stochastic model are the faithful reproduction of the cross-dependencies
    across seasons and scales, which determines the causality between rainfall and
    runoff, and the fitting of suitable distribution functions to the processes of
    interest in order to reproduce extreme conditions that are impossible to be contained
    in historical data. Under this viewpoint, the proposed'
