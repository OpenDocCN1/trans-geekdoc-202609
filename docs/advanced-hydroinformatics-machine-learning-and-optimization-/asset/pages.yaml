    # 14.4. Conclusions


    A conflicting problem exists in the middle of the Huai River between protecting
    Bengbu City from flooding and reducing loss in flood protection storage areas.
    Previous studies developed a simulation-optimization method for developing strategies
    of operating storage area gates but without considering uncertainty. Based on
    the model of previous studies, this study analyzed the uncertainty of inflow hydrographs
    and proposed robust optimal strategies and a similarity-based selection method
    for potential real-time operation. For robust optimization, the newly developed
    ROPAR method was used. The method for consideration in real-time operation is
    to choose similar inflow conditions from the database of possible hydrographs
    as well as their optimal strategies. The conclusions are as follows:


    +   1. The distribution of optimal strategies results when considering the uncertainty
    of inflow shows that when a smaller downstream risk is expected, the possibility
    of large storage area damage would be higher even with optimal strategies. The
    robust strategies developed by ROPAR perform differently under three enlarged
    hydrographs of different return periods. Strategy S40 is good to minimize storage'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'area damage in most cases but for safety of Bengbu City, S93 is recommended
    to be used.


    +   2. The criteria NSE and wRMSE can estimate similarity between hydrographs
    most accurately, so they are recommended to be used when making real-time decision.
    From another aspect, the peak and duration criteria can also be used, as they
    often provides safer strategies for downstream, even though they may cause larger
    storage area damage in some cases. After determining similar hydrographs, a strategy
    with larger storage area damage can be chosen for implementation, given that it
    is more efficient to reduce downstream risk.


    +   3. With the same upstream inflow hydrograph, the strategies from similarity
    selection often lead to less downstream flood risk, but larger storage area damage
    compared with robust strategies, which are better for the safety of Bengbu especially
    when encountering extreme floods. However, in most cases, the robust strategies
    are also effective to protect Bengbu City.


    In this study, the uncertainty analysis is somewhat restricted as the flood volume
    of sampled hydrographs is kept almost the same. However, different severities
    can still be identified among them, in which case the strategies developed using
    either robust strategies or similarity selection strategies are effective to protect
    Bengbu City in most cases, except under extreme conditions (e.g., the return period
    of 60 yr). In order to improve the analysis and development of optimal strategies,
    further studies can experiment with more diverse sampled hydrographs by setting
    different parameter values or without restriction to flood volume variations.
    In any case, the shape of the sampled hydrographs should be realistic. Another
    issue that should be noted is that the proposed real-time operation is based on
    the assumption that sufficient lead time is available before implementation. One
    of the recommendations here is to integrate the current hydraulic model with a
    hydrological forecasting scheme in upstream Huai River, which is under development
    by Cheng (2019), so that the lead time can be largely prolonged. A second suggestion
    is that a data-driven model may be built in the future, which can produce downstream
    flood risk and storage area damage quickly, given input of strategies and parameters
    of the inflow hydrograph. This model development is attainable, given the huge
    amount of data that is already generated in the process of robust strategies development.
    With a data-driven model, the elapsed time of optimization can be largely shortened
    (the hydrodynamic model will not be necessary any more), in which case the optimal
    strategies could be identified in real-time.'
