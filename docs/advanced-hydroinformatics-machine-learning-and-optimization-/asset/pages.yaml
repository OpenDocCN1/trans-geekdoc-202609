    # 7.6. Results and Discussion


    # 7.6.1. Performance of All Data-Driven Models


    In comparing all data-driven models (TDNN, LSTM, linear regression and naive),
    the ML models generally outperformed the simpler models (linear regression and
    naive) (Fig. 7.6). The TDNN model performed the best in predicting water level
    at each lead time investigated for station BCA11. This observation is the same
    for station NP201 with the exception of the 10 day water-level prediction, where
    the naive model showed better performance than the TDNN model. Similar to station
    BCA11, the TDNN model for station P33 outperforms the other models at each forecast
    lead time. The charts of the remaining two stations show similar characteristics.
    The performance of the TDNN model on the short-term forecasts was similar to or
    better than the naive model, while it also performed better on the medium-range
    forecasts. For each lead time prediction for each station, the linear regression
    model was outperformed by both the TDNN model and the naive model, while the TDNN
    model generally performed better overall. The LSTM model outperformed the linear
    regression model in predicting the medium-range forecast horizons for each station
    with the exception of S12D_T. For stations BCA11 and P33, the LSTM model also
    performs better than the naive model. The results of the medium-range predictions
    of the LSTM model, and those of the TDNN model in particular, however, indicate
    that ML is useful in this study.


