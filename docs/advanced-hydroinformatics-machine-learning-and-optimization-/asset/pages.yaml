- pgno: 16
  md: '# HYDROINFORMATICS AND APPLICATIONS OF ARTIFICIAL INTELLIGENCE AND MACHINE
    LEARNING IN WATER-RELATED PROBLEMS


    Gerald A. Corzo Perez¹ and Dimitri P. Solomatine¹,²,³


    ¹ IHE Delft Institute for Water Education, Delft, The Netherlands

    ² Water Resources Section, Delft University of Technology, Delft, The Netherlands

    ³ Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia


    In recent years, there has been a surge of interest in machine learning (ML) and
    artificial intelligence (AI) due to the effectiveness of deep learning algorithms
    and the increasing availability of large data sets. This chapter provides a brief
    overview of the applications of AI and ML techniques in hydroinformatics, a field
    that deals with advanced information technology, data analytics, and modeling
    for aquatic environment management. Data-driven models are becoming more common
    in water management as they can reveal hidden patterns in data and offer improved
    accuracy in certain situations. This chapter highlights the importance of spatiotemporal
    data analysis, pattern recognition, and optimization approaches in water resources
    management under uncertainty. It does not offer a comprehensive review of all
    methods but rather focuses on selected ML techniques widely used in water-related
    problems. Additionally, the'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'chapter discusses the challenges associated with using ML models, such as black-box
    criticisms, and the potential of hybrid models that combine the strengths of ML
    and physically based process models for more robust solutions in hydroinformatics.


    # 1.1. Introduction


    Hydroinformatics deals with advanced information technology, data analytics, modeling,
    artificial intelligence (AI), and optimization applied to problems of aquatic
    environment for the purpose of informing management. Many of these technologies
    have become standard tools that support water management decisions around the
    world. However, the technologies are developing further, new ones are emerging,
    and this allows for applying them to more complex and interesting problems. One
    can find multiple examples when environmental and hydrological problems have been
    dealt with not only by employing physically based (process) models, but also advanced
    data analysis tools and machine learning models have been used. Using AI techniques
    in geosciences has a long history. Hydroinformatics, formulated by Abbott (1991)
    30 yr ago, has been defined as a union of computational hydraulics (CH) and AI
    (so that HI = CH ∪ AI), and during the last three decades we have been witnessing
    a much wider use of AI, with a large number of successful practical applications.
    The first stage of such development has been covered, for example, in the edited
    volume Practical hydroinformatics: Computational intelligence and technological
    developments in water applications (Abrahart et al., 2008), and in dozens of other
    books and hundreds of research papers covering these new developments.


    Currently, we see a new wave of interest in machine learning (ML) and AI, which
    is partly explained by the demonstrable effectiveness of the new generation of
    deep learning algorithms and availability of large data sets (see, e.g., Nearing
    et al., 2021), and this brings new possibilities for hydroinformatics research
    and practice. With an increasing amount of data collected about the environment,
    physically based models are more and more complemented and sometimes even replaced
    by data-driven models. Lacking the ability of physically based models to explain
    the physics of underlying processes, data-driven models are however able to discover
    the hidden patterns in data and often can be more accurate, and play an important
    role, in water management. Pattern recognition (e.g., automatic identification
    of flooded areas on satellite images) has been one of the main tasks solved by
    machine learning, and'
  merge: -1
  img_proc: true
- pgno: 18
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 19
  md: 'water resources problem interpretation is hidden in the so-called black box
    of a ML model. There is indeed a challenge of posing the problem in the right
    way: how domain knowledge can drive selection, building, and tuning a ML model.
    Lack of data and its uncertainty also makes it difficult for practitioners to
    feel confident about ML models.


    On the other hand, the strength of ML is in its ability to represent the relationships
    between inputs and outputs, provided enough data are available. Although the relatively
    recent advances in deep learning have opened the door to the new ways of using
    spatiotemporal data, and at the same time motivating new algorithm developments
    from spatial patterns and, in general, all types of computer vision algorithms,
    not all problems can be tackled by ML. Input and output relations can be so complex
    that ML techniques may not be able to find the hidden patterns, and in such cases
    hybrid models, combining power of ML and process models (so-called physics-aware
    AI; see, e.g., Jiang et al., 2020) would be needed. Such hybrid approaches are
    given now increased attention in hydroinformatics.


    This chapter is not intended to provide a comprehensive review of methods (which
    are covered in hundreds of books and in the referred literature herein), but rather
    focuses on some important elements of ML model building, and presents basics of
    several selected ML techniques quite widely used in solving water-related problems,
    allowing for “feeling the flavor” of ML.


    # 1.2. Key Principles of ML/Hydroinformatics


    # 1.2.1. AI and ML Definitions


    There is a large number of evolving definitions of AI, and this can be explained
    by its permanent evolution and shifts in priorities, and the advances in the used
    mathematical instruments. Many literature sources point out that for the first
    time the term AI was used in 1956 at the Dartmouth Conference, were John McCarthy,
    Alan Turing, and other founding fathers of AI, help to coin the term artificial
    intelligence. One of the definitions reads: “AI is the field devoted to building
    artificial animals (or at least artificial creatures that, in suitable contexts,
    appear to be animals) and, for many, artificial persons (or at least artificial
    creatures that, in suitable contexts, appear to be persons)” (Stanford Encyclopedia
    of Philosophy, 2018). On the other hand, Wikipedia defines it as the “intelligence
    demonstrated by machines, unlike the natural intelligence displayed by humans
    and animals” (Artificial Intelligence, 2022). Yet another'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'definition (sometimes referred to as being given by IBM) states, that “AI leverages
    computers and machines to mimic the problem-solving and decision-making capabilities
    of the human mind.” All these definitions differ in details, but are very similar
    in the main idea: a machine (a programmed computer) is supposed to imitate some
    behavior of a living creature.


    An old debate regarding whether humans will be replaced by machines has been reinitiated
    in various public media in the view of the latest developments in AI, especially
    generative AI, as implemented, for example in platforms like ChatGPT. Indeed,
    AI has evolved into different types, related to an extent to which it may take
    over some of humans’ activities. The first ideas of what could be achieved are
    purely reactive, which is highly related to the beginnings of computer science,
    where, AI does not have any memory, which basically means no initial data base
    or information of processes. This concept can be applied to solving narrow specialized
    tasks. For example, a forecast is performed based only on the current situation,
    limited historical samples, and known variables. Further development can lead
    to building up memory, by collecting previous experience and more complex and
    voluminous data and continue adding it to the memory. Such AI systems have enough
    memory or experience to support humans in performing various tasks, but their
    ability is still limited and they are still seen as a helping hand. For example,
    it can provide adaptive forecasts depending on the context, such as previous performance,
    climatic conditions, type of a river basin, and others. An even higher level of
    AI can be explained as a theory of mind (Premack & Woodruff, 1978) where AI can
    understand thoughts and emotions and interact socially. This type of concept needs
    an integration of many components of AI, development of more sophisticated mathematical
    apparatus, so such developments are still at a rudimentary level. At the top level,
    it is possible to consider how these systems can become aware of life and even
    become self-aware. This concept links to the idea that AI machines can create
    new knowledge and, at the same time, build internal system concepts that link
    intelligence, sentience, and consciousness.


    Advances of AI have been numerous and applied in various areas. We should admit
    however, that in water resources, only a few of such developments have been used,
    and these relate to application of specific machine learning techniques.


    Figure 1.1 presents a schematization of some of the key techniques of ML, with
    references to decades when these methods started to develop. Due to a wide application
    of ANN, this architecture is presented in more detail. One of the relatively new
    developments is natural language processing (NLP); it uses deep learning (DL)
    to train models that help'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_21_0.png)


    Figure 1.1 Evolution of AI topics: From artificial intelligence to machine learning
    and deep learning in hydroinformatics.'
  merge: -1
