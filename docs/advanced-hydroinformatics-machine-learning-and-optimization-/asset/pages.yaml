- pgno: 106
  md: 'If parameters converge slowly in other cases, it would take a longer time to
    derive the crucial ranges. In these cases, the crucial ranges can be set by obeying
    the rule of thumb or referring to previous work. Furthermore, the crucial ranges
    can also be determined or updated by the results of the previous parameter optimization.
    However, in this study, we have not studied the relationship of the ADBP''s performance
    to the model improving times.


    In our work, we used the distance between the center point of FNP_SM and the center
    point VFNP_SM as the termination condition of the optimization, based on the assumption
    that FNP_SM can be used as FNP_VIC when FNP_SM is the same as VFNP_SM. To acquire
    FNP_SM in each iteration, ε-NSGA II was used, which can adapt population size
    and terminate automatically. In order to get FNP_SM close to VFNP_SM more quickly
    and reduce the number of iterations, the two-stage surrogate model was designed
    and a better-performance surrogate method, ADBP, was used. Furthermore, the sample
    sets in this study were chosen from the sample space generated by ε-NSGA II to
    add the samples in the crucial range. From the results shown in Figures 3.8 and
    3.9, ADBP performs stably with the different sample sets chosen from the sample
    space generated by ε-NSGA II. This indicates that the nonuniformity of initial
    training sample for ADBP is acceptable, which may be due to the feature of the
    optimal process where not all the samples in the sample space were used and the
    samples in the crucial range were more important than others.


    In the meantime, the time consumed for calibration with SM is heavily curtailed
    compared with VIC. In order to accelerate the parameter calibration for VIC, the
    parallel computations were applied in a 24 processor platform, while SM constructed
    by ADBP was operated in single thread. As a result, there will be a remarkable
    increase in the saved time by SM if SM and the original model are both operated
    in single thread. Besides, the time SM saved is related with the VIC runtime.
    When the study area is larger and the physical conditions are more complex, the
    efficiency improvement with SM is more remarkable.


    # 3.7. Conclusions


    In this study, we developed a surrogate-based parameter calibration framework
    for a large complex distributed hydrologic model to accelerate the parallel automatic
    parameter calibration of VIC. The two-stage surrogate model in the framework is
    based on AdaBoost and BPNN. SM-I predicted outputs roughly and sought out the
    parameter sets in the crucial range. SM-II simulated the outputs in the crucial
    range accurately. The method was successfully applied in the LJR basin and the
    XJR basin.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '*RMSE* and *ER* were chosen as the evaluation indices for SM-I and SM-II, respectively.
    Via this study, we find the following:


    +   1. In the benchmark test, a parameter set with a very small error from the
    artificial parameter set can be acquired through using our surrogate-based parameter
    calibration framework.

    +   2. The parameter sets of VIC acquired from the surrogate-based parameter calibration
    framework have no large difference from those from e-NSGA II. The streamflow simulated
    with parameter sets from SM accords with that of VIC very well.

    +   3. The proposed method can accelerate the calibration process markedly but
    the time saved is related to the study area. When the study area is larger and
    the physical conditions are more complex, the efficiency improvement with SM is
    more remarkable.


    SM can save much time for calibration of complex distributed hydrologic models
    and improve in particular the state of the art in parameter calibration. Future
    work may focus on the extension of SM to study hydrologic model calibrations under
    changing environments and, in addition, the role of different optimization algorithms
    can be investigated.


