  md: 'reservoir. This methodology could be applied in multipurpose reservoirs in
    general, though the operation model must be adapted to each case.


    Notably, the flood control objective of the reservoir’s real operation was found
    to have wide room for improvement. Several reservoir operations policies were
    obtained that reduced the discharge peaks of the reservoir (as evidenced in the
    wet period from November 2016 to May 2017), equaling or even improving the objectives
    for irrigation and hydroelectric generation with respect to the real operation
    (e.g., MLP_7N_23; MLP_7N_37; MLP_7N_41; MLP_7N_72). Other reservoir operations
    policies, such as MLP_7N_77, considerably reduced the discharge peaks of the dam
    and only slightly affected the other purposes.


    Overall, these results demonstrate that reservoir operation can be parameterized
    using ML models such as ANNs, which can accurately replicate the patterns and
    policies that govern reservoir operation. The 6-7-1 MLP configuration using the
    NSGA II optimizer had the best results overall. The MLP models tend to generate
    the best results for this case study. This may be due to the fact that RBN models
    use a greater number of parameters, making the optimization process more difficult.
    Results were similar regardless of the settings used for each ML model (i.e.,
    varying the number of neurons). When the two optimizers were compared, similar
    results were observed for the MLP functions, with the NSGA II results being better.
    This may be because of the decision space in the present study was not oriented
    toward a specific area of preference; however, the MOEA/D results could be improved
    by narrowing the decision space (Ma et al., 2015). In the case of the LF, the
    results were considerably lower according to the hypervolume indicator, which
    showed that the reservoir operations policies did not adequately adjust to linear
    patterns.


    The lack of information was one of the main limitations for the development of
    this research, although it was possible to have data from the reservoir for the
    period 2009–2019. For models based on data, such as those of the present study,
    it is desirable to have longer time series. Unfortunately, the reservoir operation
    rules as well as target levels, power production targets, and irrigation discharges
    were not available, which would have served as a reference for the elaboration
    of the reservoir operation model and for the definition of the objectives of optimization,
    reducing some assumptions.


    Future works in this area are recommended to evaluate different multi-objective
    optimizers and ML models. For the Hatillo reservoir, new objectives can be included,
    such as firm energy or the flow regime alteration downstream of the dam. Further,
    if the necessary information were'
