- pgno: 126
  md: '# 4.3.3. Combining Specialized Models


    evaluates the error in the general flow. Data used in the calibration are almost
    2 yr and a half-hourly time step, two wet seasons were used in the calibration
    data set and one in the validation.


    The main objective is to produce a flow simulation efficient in both low and high
    flow domains using time-varying weights, as mentioned earlier. Obtaining a competent
    solution in all flow regimes is very difficult, and using a specialized model
    in both high and low flow is a better way to achieve a general efficient model.


    The challenge in combining different specialized models built under different
    flow regimes is to determine which model will work and how to switch smoothly
    from one model to another carrying the water balance information; and in case
    more than one model is working at a time, how to handle the compatibility at the
    boundaries.


    In order to avoid such complication, using a weighting scheme, which guarantees
    a smooth transition between models, can be the solution. The share of each specialized
    model will be determined using a fuzzy membership function described by Fenicia
    et al. (2007), Kayastha et al. (2013), and Solomatine (2006).


    In the weighting scheme, a trapezoidal function with two parameters γ and δ is
    used, wherein the membership function of the low flow model a weight of 1 will
    be given to low flow values if the relative flow is below parameter γ (Fig. 4.6c),
    then starts to decrease when relative flow values are between γ and δ (both models
    are working together), until it reaches zero beyond the boundary of parameter
    δ (Fig. 4.6c). Similarly, the membership function of a high flow model is working
    but in opposite logic. The membership functions are shown here (equations (4.9)
    and (4.10)).


    and


    $M_{lf} = \begin{cases} 1, \text{if } h < \gamma \\ 1 - \left(\frac{h - \gamma}{\delta
    - \gamma}\right)^N, \text{if } \gamma \le h \le \delta \\ 0, \text{if } h \ge
    \delta \end{cases}$ (4.9)


    $M_{hf} = \begin{cases} 0, \text{if } h < \gamma \\ \left(\frac{h - \gamma}{\delta
    - \gamma}\right)^{1/N}, \text{if } \gamma \le h \le \delta \\ 1, \text{if } h
    \ge \delta \end{cases}$ (4.10)'
