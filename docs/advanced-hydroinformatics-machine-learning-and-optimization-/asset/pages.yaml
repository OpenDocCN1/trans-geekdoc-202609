  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_311_0.png)


    Figure 10.6 Graphical representation of the CBOW model and the Skip-gram model
    (from Mikolov et al., 2013).


    Additionally, large values of data (e.g., big data corpus) could present a challenge
    to computational calculations (Mikolov et al., 2013). In this sense, the Word2Vec
    function looks for words that occur in similar contexts to have similar embeddings,
    that is, represent the meaning of the word, for example:


    The flood in the Bogotá River triggered emergency responses from the Colombian
    government.


    The drought in the Bogotá River triggered remedial actions taken by the Colombian
    government.


    The words flood and drought will have similar word vectors due to a similar context.
    Two architectures/algorithms are widely used to represent the “meaning” of a word
    according to a context: CBOW (Continuous Bag of Words) (predict the target word
    from the bag-of-words context) and Skip-gram (predict the context words, given
    the target) (Jang et al., 2019). Both implementations use neural networks, as
    shown in Figure 10.6, where w(t) denotes the analyzed word, and w(t±s) represents
    the word at a distance of s words in the sentence context.


    For example:


    Sentence: “Several parts in Kuala Terengganu were inundated with flood waters,
