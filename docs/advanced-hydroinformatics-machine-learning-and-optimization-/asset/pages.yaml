  md: 'Figure 12.1, the data set comes with a boundary, i.e., the land area of GB.
    The K-mean based cluster analysis is applied to every single image, which normally
    generates three clusters: (1) cluster 1 represents and area outside of the boundary
    (no data, or invalid data); (2) cluster 2 (valid data within the boundary but
    below certain threshold, e.g. zero rainfall), and (3) cluster 3 of valid rainfall
    patterns.


    If the inputs are rainfall data sets, only the rainfall amount extracted from
    the data sets is used for pattern recognition. In this case, regions with rainfall
    amount higher than a given threshold x are to be extracted. This is done by using
    the toolbox to automatically highlight the grids whose rainfall is over x before
    detecting the outer boundary (the closed boundary) of each cluster of grids. The
    information of each boundary (e.g., the coordinates of the boundary grid) is recorded
    separately and stored. An example is given in the right panel of Figure 12.1 where
    there are seven different patterns recognized whose grid rainfall is higher than
    the threshold x and each of them is within a closed boundary and regarded as an
    individual rainfall event.


    Each rainfall pattern, such as the one represented by cluster 3, extracted from
    images or from the seven regions detected from grid-based data sets, is then polygonised
    using the original function provided by the toolbox. The resultant polygons (regions)
    of rainfall are usually large and irregular. They are then segmented into small
    regular shapes to calculate the centroid and the moments of the compound shape.
    Finally, three attributes are generated for the segmented shapes (regions): the
    location attribute, the size attribute, and the shape attribute, which includes
    both the sp and the major angle ω which indicates the angle between easting and
    the major axis (northward; see the arrow in Fig. 12.2) and in the range of 0°
    and 180°. The three attributes are then used to label and classify the rainfall
    pattern. Besides, when the inputs are data sets, in addition to the three spatial
    attributes, other statistical attributes of interest can be extracted from the
    detected regions for quantitative analysis (e.g., extracting the maximum areal
    or point rainfall within the boundary of the region).


