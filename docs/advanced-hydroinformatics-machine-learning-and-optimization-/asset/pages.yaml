- pgno: 174
  md: 'precipitation event classes: (1) Local and short extreme events (LSE), (2)
    local and long-duration extreme events (LLE), (3) spatially extensive extreme
    events (SEE), and (4) spatially extensive and long-duration extreme events (SLE).


    # 6.3.4. Event-Based Runoff Modeling


    We developed one runoff model for each precipitation event class and one model
    without precipitation discrimination (base model). For this, we used the ML technique
    known as Random Forest (RF) for regression. The RF is described in subsection
    6.3.4.1. Moreover, the input feature space to each model was formed with hourly
    precipitation and runoff, as well as an indicator of the belonging precipitation
    class. In addition to current-time precipitation and runoff information, we used
    past lag information, which is determined according to statistical correlation
    analyses: partial- and auto-correlation functions for runoff, and cross-correlation
    functions for precipitation. The construction of the input feature space was conducted
    following the methodology developed by Muñoz et al. (2018), with the purpose to
    add only relevant information to the models and improve their efficiencies.


    # Random Forest for Regression


    Random Forest (RF) is an ML technique of supervised learning where the main idea
    is to build multiple decorrelated trees (models) in which the input feature space
    is related to output(s) by successively applying a set of hierarchically organized
    conditions (Breiman, 2001). The key to the RF algorithm is the random selection
    of resampled data sets from the input feature space (bagging technique), which
    assures decorrelation between stochastically formed models.


    We implemented the RF runoff models through the scikit-learn package for ML in
    Python version 3.7 (Pedregosa et al., 2011). A full explanation of the RF algorithm
    can be found in Breiman (2001) and can be summarized as follows:


    +   1. Construction of each decision tree by randomly selecting several bootstrap
    samples from the input feature space. A process known as out-of-bag (OOB) is used
    for forming each bootstrap with roughly two thirds of the input feature space.
    On one hand, the OOB process serves to obtain unbiased estimates of the regression,
    and on the other hand, it allows to estimate the importance of each feature (predictor)
    of the feature space in the tree construction process.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '**Table 6.1** Search space (grid) of the RF runoff models.


    | Hyperparameter | Domain |

    |---|---|

    | n_trees* | 40;800;10* |

    | max_features | n_features, n_features^(1/2), log₂ (n_features) |

    | max_depth* | 40;800;10* |


    \*Domain defined by min, max, and increment.


    +   2. Optimally splitting of the data selected in step 1 at each node of each
    tree. This is done by determining a maximum number of features to perform the
    best split from the total number of predictors in the feature space. This also
    avoids overfitting by assuring variety and the nonexistence of duplicated models.


    +   3. Growth of all the trees constructed in step 1 with the splits defined in
    step 2 up to a size defined either by a maximum depth parameter or a minimum number
    of samples expected in the final node. Control of the depth of the trees aims
    to reduce the structural complexity of the models, leading to model parsimony
    and noise reduction.


    +   4. Determination of the output of the model as the mean response from all
    regression trees.


    According to Contreras et al. (2021), the most-influencing RF hyperparameters
    for hydrological forecasting applications are the number of trees in the forest
    (n_trees), the maximum number of features to perform the splits of the data (max_features),
    and the maximum depth for pruning purposes (max_depth). For all runoff models,
    we determined the optimal combinations of hyperparameters following a random grid-search
    procedure implemented with a 10-fold cross-validation process to prevent overfitting.
    The measure of agreement was evaluated according to the coefficient of determination
    (R²) between simulations and observations for the training subsets. Table 6.1
    presents the domain of the selected hyperparameters, which forms the search space
    for the optimization task.


    # *Model Evaluation*


    We used four goodness-of-fit metrics for evaluating the efficiencies of the four
    runoff models. The Nash-Sutcliffe Efficiency (NSE) coefficient was set as the
    reference for measuring and comparing the overall model accuracy. To complement
    the analysis, we relied on the Kling-Gupta Efficiency (KGE), the Percent Bias
    (PBIAS), and the Root Mean Square Error'
  merge: -1
  img_proc: true
- pgno: 176
  md: '(RMSE) metrics. The following equations were used:


    NSE = 1 - [ Σ_{i=1}^n (Q_s(i) - Q_o(i))^2 ] / [ Σ_{i=1}^n (Q_o(i) - \overline{Q_o})^2
    ]  (6.1)


    KGE = 1 - sqrt( (r - 1)^2 + (α - 1)^2 + (β - 1)^2 )  (6.2)


    PBIAS = [ Σ_{i=1}^n (Q_o - Q_s) ] / [ Σ_{i=1}^n Q_o ]  (6.3)


    and


    RMSE = sqrt( (1/n) Σ_{i=1}^n (Q_s - Q_o)^2 )  (6.4)


    where n is the number of instances, Q_s is the simulated runoff, Q_o is observed
    runoff, \overline{Q_o} is the mean observed runoff, \overline{Q_s} is the mean
    simulated runoff, r is the correlation coefficient between Q_s and Q_o, α = σ_s
    / σ_o is the variability ratio, β = \overline{Q_s} / \overline{Q_o} is the bias
    ratio, and σ is the standard deviation.


    The NSE is dimensionless and ranges between −∞ and 1.0, NSE = 1 being the optimal
    value. A limitation of NSE is the underestimation of peak flows and overestimation
    of low flows; in such cases, the KGE is suggested (Gupta et al., 2009), with KGE
    = 1 as the optimal value. Additionally, the optimal value of PBIAS is 0, positive
    values indicate model underestimation bias, and negative values overestimation
    bias. Finally, RMSE measures how model residuals are spread out from the best
    fit between simulations and observations, being RMSE = 0 the optimal value.


    # 6.4. Results


    # 6.4.1. Determination of Nearly Independent Peak Hydrological Events


    The WETSPRO tool for the Jubones basin was calibrated using the following parameters:
    inter-event time of 120 hr (i.e., consecutive extreme hydrological events must
    be separated by a time frame of at least 5 days), and a maximum ratio of runoff
    drop down of 0.6 (i.e., runoff, q, drops down in between two consecutive events
    to a ratio q_min / q_max < 0.6). Moreover, we considered only events exceeding
    the 90% quartile values of the runoff time series (98.8 m³.s⁻¹). With these criteria,
    we obtained 55 nearly independent peak hydrological events (see Fig. 6.3a).'
