- pgno: 250
  md: '# 8.7. Operational MLP-ANN Forecast Model


    The trained MLP-ANNs models can be used with real-time observation as guidance
    for the flood situation in Grande de San Miguel catchment. Many forecast systems
    can be used as an environmental decision support system in order to organize the
    complex process of data acquisition in real time and link the model with these
    hydrometeorological data.


    According to Werner et al. (2013) two categories of forecast systems can be defined
    a model-centric and a modular approach. The former basically means that that any
    change in the model or in the data used may require a redesign and redevelopment
    of the system. The latter is a more flexible approach, which can adapt to changing
    needs in modeling requirement and data transformation. After training and validating
    the MLP-ANN, it was decided to place the developed MLP-ANN models in operational
    mode using a model-centric approach since the Ministry of Environment and Natural
    Resources of El Salvador does not have any modular forecast platform (e.g., Delft-FEWS).
    The conceptual design of the forecast system is shown in Figure 8.11 where all
    the real-time rainfall and water level in the Grande de San Miguel catchment are
    imported from MARN Database using a MATLAB routine. Afterward, another MATLAB
    routine allows one to preprocess the real-time observations to delete erroneous
    data, detect outliers, transform water level into discharge units, and aggregate
    hydrometeorological data from 15 min to 1 hr time step. Subsequently, the hourly
    rainfall and discharge data are used to


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_250_0.png)


    Figure 8.11 Conceptual design of the operational MLP-ANN forecasting in Grande
    de San Miguel river basin.'
