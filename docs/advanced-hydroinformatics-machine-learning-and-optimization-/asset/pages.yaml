- pgno: 429
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_429_0.png)


    # Figure 15.2 Floodplain in the lower Yuna basin.


    Several flood events have been reported, such as flooding in October of 2007 that
    occurred because of Tropical Storm Noel. The event affected the entire Dominican
    territory and resulted in losses exceeding 439 million U.S. dollars (CEPAL, 2008).
    Another more recent event was the flood season between November 2016 and April
    2017, which generated losses of 862.37 million US dollars, affecting sectors of
    public works, water and sewerage, agriculture, and housing among others (MEPyD,
    2017). On the other extreme, periods of long droughts also affect the area, reducing
    hydroelectric generation and putting at risk the water meant to supply the irrigation
    districts in the lower Yuna.


    At present, only 26% of the basin area is regulated by reservoirs. Hatillo is
    the most representative, regulating 23% of the total area of the basin (1,192
    km²). This reservoir is the largest body of surface water in the Dominican Republic,
    covering an average area of 27.4 km². The system has a dam built on a 50 m high
    embankment of earth and rock.'
