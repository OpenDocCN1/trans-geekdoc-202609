  md: 'The reservoir has a total storage capacity of 441 million m³ with a maximum
    length of 15 km. The minimum operating level is 70 m above sea mean level (MAMSL).
    The elevation of the crest of the spillway is 86.5 MAMSL, which corresponds to
    the maximum operating level, while the extraordinary maximum level is 100.75 MAMSL.
    The main components of the dam are presented in Figure 15.3. The reservoir has
    an uncontrolled spillway (i.e., no gates, only free overflow) with a maximum capacity
    of 650 m³/s; there are two hollow jet valves for the bottom outlet, with a maximum
    capacity of 82 m³/s each. A powerhouse with a Francis turbine has an installed
    capacity of 8 MW and an annual energy generation of 40 GWh; the maximum flow capacity
    of the turbine is 30 m³/s. Hatillo’s installed capacity is low compared with other
    hydroelectric plants in the Dominican Republic. Examples of other plants include
    Tavera (96 MW), Valdesía (54 MW), and Aguacate (52 MW). Downstream of Hatillo,
    large areas of land are used for agriculture in the lower Yuna River basin, predominantly
    for rice cultivation, which is the main food crop in the Dominican Republic (Moquete,
    2004). The reservoir supplies water for the irrigation of approximately 27,000
    ha of crops.


    The dam is operated by Empresa de Generación Hidroeléctrica Dominicana (EGEHID)
    and the Dominican Institute of Water Resources (INDRHI). The reservoir operation
    under normal conditions consists of discharging 26 m³/s through the turbine throughout
    the day; this water returns to the Yuna River and it is used for irrigation. However,
    in emergency scenarios, such as in heavy rainy seasons or hurricane seasons, the
    National Dam Committee (COPRE) defines the actions for the operation of the reservoir.
    Releases through hollow jet valves occur when more water needs to be released
    due to flood control strategies or irrigation demands. Unfortunately, the information
    about operating rules of the reservoir were not available, as well as target levels,
    power production targets, and irrigation discharges. Nevertheless, daily data
    of inflows, spills, turbine discharges, valve outlets, and total outflows for
    the period 2009–2019 were provided by EGEHID. From these data, it was observed
    that 54% of the reservoir outlets are through spill, 45% are through the turbine,
    and 1% are through the bottom valves. The fact that most of the reservoir releases
    have not been controlled (i.e., through spillway) allows us to hypothesize that
    the flood control objective can be improved.


    It is important to mention that given the lack of reservoir operation rules, this
    study sought to emulate the real operation (2009–2019) using machine learning
    (ML) models, which is described in section 15.3. Additionally, due to the lack
    of target levels, power production targets, irrigation demands, and specific objectives
    of the reservoir, an operating model has'
