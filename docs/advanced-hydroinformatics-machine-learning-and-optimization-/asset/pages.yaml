  md: '# PROBABILISTIC ANALYSIS OF FLOOD STORAGE AREAS MANAGEMENT IN THE HUAI RIVER
    BASIN, CHINA, WITH ROBUST OPTIMIZATION AND SIMILARITY-BASED SELECTION FOR REAL-TIME
    OPERATION


    Xingyu Zhou¹, Andreja Jonoski², Ioana Popescu², and Dimitri P. Solomatine²,³,⁴


    ¹ Shanghai Investigate, Design & Research Institute Co., Ltd., Shanghai, China

    ² Department of Hydroinformatics and Socio-Technical Innovation, IHE Delft Institute
    for Water Education, Delft, The Netherlands

    ³ Water Resources Section, Delft University of Technology, Delft, The Netherlands

    ⁴ Water Problems Institute of the Russian Academy of Sciences, Moscow, Russia


    Large-scale river basins in the southern part of China suffer frequently from
    flooding problems, and storage areas are often used for minimizing downstream
    flooding risk, which in turn causes damage to economic activities within these
    areas. Such damages need to be minimized, even though this is often conflicting
    with the main objective of reducing downstream flooding risk. This problem is
    especially highlighted in the middle part of the Huai River basin. Previous studies
    focused on solving this multi-objective optimization problem using generic algorithms
    coupled with hydrodynamic models. This study further develops probability analysis
    using a robust optimization and similarity-based'
