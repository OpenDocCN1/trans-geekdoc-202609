- pgno: 85
  md: 'In the algorithm, the process from step 2 to step 4 is one iteration and the
    whole program from steps 1 to 5 is so-called one run.


    # *Initial Surrogate Model Training*


    A two-stage model is proposed in this study to reduce the local errors in the
    crucial range, which can generate insufficient samples in the crucial range. The
    first surrogate model (SM-I) simulates approximate results to classify a set of
    samples into two types: samples in the trivial range and samples in the crucial
    range. The second surrogate model (SM-II) simulates the results in high fidelity
    to get a more accurate Pareto front. In order to acquire more samples in the crucial
    range, the samples are generated by the optimization algorithm, which can converge
    the range of parameters into the crucial range to ensure sufficient sample quantity
    in the training of SM-I and SM-II.


    The algorithm of the initial SM training is shown in Figure 3.2 and described
    as follows:


    +   - **Step 1:** Partition the crucial ranges and generate samples. Run ε-NSGA
    II with VIC for *N* generations to warm up the program. Determine the crucial
    ranges with the warming-up data. The input data X = [X₁, X₂, …, Xₖ] are acquired
    where *k* is the population size in the *N* generations of ε-NSGA II, X is a *m*
    × *k* matrix, and *m* is the number of the calibration parameters. The output
    data E = [E₁, E₂, …, Eₖ] are acquired where *k* is the initial population size
    of the warming-up data, E is a *n* × *k* matrix, and *n* is the number of the
    objective functions.


    +   - **Step 2:** Train SM-I. After eliminating duplicates of the samples acquired
    in Step 1, SM-I is trained. Here, we use the hold-out cross validation to validate
    the training results in which generally 70% of samples are extracted randomly
    for the model training and the remaining 30% for the model testing. In this stage,
    SM was used to screen the parameter sets in the crucial range. The rate of correct
    classification is more important than the simulation accuracy. As a result, we
    adopted the rate of misclassification (*ER*) to show the performance of the model
    as the following:


    $$ER = \frac{e_1 + e_2}{N_e} \times 100\%, \qquad (3.6)$$


    where *e₁* is the number of parameter sets misinterpreted as those in the crucial
    range; *e₂* is the number of parameter sets in the crucial range assigned to the
    trivial range; *Nₑ* is the number of parameter sets'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_86_0.png)


    **Figure 3.2**  Flowchart of the initial surrogate model training.


    actually in the crucial range. SM-I is said to misclassify the points when points
    in the crucial/trivial range are divided into the trivial/crucial range by SM-I.


    +   - Step 3: Train SM-II. Samples within the critical range are first screened
    from the total samples. The method of the hold-out cross validation is still used
    in this stage. The difference from Step 2 is the performance'
  merge: -1
