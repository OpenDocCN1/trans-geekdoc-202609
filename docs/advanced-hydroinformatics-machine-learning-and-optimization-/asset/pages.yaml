- pgno: 228
  md: "# APPLICATION OF A MULTILAYER PERCEPTRON  \nARTIFICIAL NEURAL NETWORK (MLP-ANN)\
    \ IN  \nHYDROLOGICAL FORECASTING IN EL SALVADOR\n\nJose Valles\n\n*IHE Delft Institute\
    \ for Water Education, Delft, The Netherlands*\n\nThe Grande de San Miguel catchment\
    \ in El Salvador generates floods almost every year and produces significant damage\
    \ to transport infrastructure, houses, and agricultural land, as well as causing\
    \ people to evacuate. To anticipate flood conditions, an early warning system\
    \ (EWS) has been in place since 2001 in collaboration with local inhabitants,\
    \ civil protection, and the National Hydrometeorological Service, but a rainfall-runoff\
    \ forecast model has not been implemented in the catchment to predict these flood\
    \ events. In this study, a Multilayer Perceptron Artificial Neural Network (MLP-ANN)\
    \ model is proposed as an operational flood forecast model for this catchment\
    \ to address the short-term flood forecast. The model results show excellent performance\
    \ for lead time no larger than 4 hours and good results for lead time between\
    \ 5 and 9 hours, but an unsatisfactory result for a forecast lead time of 12 hours\
    \ since there are some high-flow events that the model underestimates."
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 8.1. Introduction


    El Salvador has been implementing the Flood Early Warning System since the impact
    of Hurricane Mitch in 1998. After this hydrometeorological event, many governmental
    and nongovernmental organizations recognized the flood vulnerability of the country
    and the lack of a suitable hydrometeorological monitoring system. As a result
    of that, many automatic hydrometeorological gauges were installed, flood emergency
    plans were implemented, and a flood forecast center was created in order to both
    monitor and predict the floods impacts.


    One of the major components of the early warning system (WMO, 2018) is the monitoring
    and the flood forecasting, which allows to anticipate their impacts and reduce
    the properties damage and the loss of lives. A hydrological model constitutes
    the basis of a flood forecasting system. For this reason, many hydrological models
    have been built to predict the hydrological response in important catchment in
    El Salvador. For instance, Häggström and Lindström (1990) calibrated the conceptual
    HBV model to six rivers in Central America, which includes Grande de San Miguel
    catchment in El Salvador. They found that the calibration of the model was not
    satisfactory for Grande de San Miguel catchment, although the model has succeeded
    in simulating most of the flood peaks. In 2004, the Hydrological National Service
    of El Salvador (2004) reported a rainfall-runoff model for forecasting purposes
    in the Lempa catchment, which includes the four hydropower reservoir located in
    the main stream. Additionally, Riverside Technology (2012) implemented a semidistributed
    Sacramento rainfall-runoff model in Lake Ilopango and Jiboa Catchment, which was
    implemented in a Delft-FEWS standalone version, and integrated it with real-time
    and forecast data. In this research, the implementation of the Multilayer Perceptron
    Artificial Neural Network (MLP-ANN) technique is proposed as operational forecast
    model in order to address the short-range hydrological flood forecast in Grande
    de San Miguel river basin. This catchment generates floods almost every year and
    generates significant damage to transport infrastructure, houses, crop areas,
    and people evacuated. There is not an operational rainfall-runoff forecast model
    in this catchment that allows local forecast operators, stakeholders, and decision
    makers to foresee the flood conditions and increase the lead time for communities
    located in flood-prone areas to respond efficiently.


    The implementation of the MLP-ANN forecast model in Grande de San Miguel catchment
    is outlined as follows. Section 8.2 provides a general introduction of data-driven
    modeling, in particular the Multilayer Perceptron Artificial Neural Network (MLP-ANN)
    technique. Section 8.3 describe the Grande de San Miguel river basin in El Salvador.
    Section 8.4'
  merge: -1
