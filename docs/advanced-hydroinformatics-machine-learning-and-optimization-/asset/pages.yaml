  md: 'et al., 2020; Mosavi et al., 2018; Muñoz et al., 2021, 2018; Orellana-Alvear
    et al., 2020; Papacharalamous & Tyralis, 2018). This is due to RF’s simplicity
    (few parameters to calibrate) and higher accuracy when compared with other ML
    techniques such as Support Vector Machines and Artificial Neural Networks, model
    robustness, and capacity to deal with small size samples and complex data structures
    (Biau & Scornet, 2016; Breiman, 2001; Contreras et al., 2021; B. Li et al., 2016;
    Liu et al., 2020; Muñoz et al., 2018, 2021; Papacharalamous & Tyralis, 2018; Tyralis
    et al., 2019; Wang et al., 2015).


    In terms of data availability, in many regions, ground precipitation networks
    are either nonexistent or scarce and if available mostly with extremely low areal
    density. This is especially true for mountainous regions, such as the tropical
    Andes, where the remoteness of the study areas and monitoring authorities’ budget
    constraints limits the development of accurate precipitation-runoff models. Fortunately,
    continuous development of Remote Sensing (RS) products, for example, space-based
    satellites have dramatically enhanced the quantity (spatiotemporal resolution)
    and quality of areal precipitation observations. However, RS precipitation obtained
    from a single sensor (satellite) hardly provides accurate estimations (Hong et
    al., 2019). This has stimulated the development of multisatellite precipitation
    products such as the NASA Global Precipitation Measurement (GPM) Integrated Multi-satellitE
    Retrievals for GPM (IMERG) (Huffman et al., 2015), and the Precipitation Estimation
    from Remotely Sensed Information using Artificial Neural Networks (PERSIANN) (Hsu
    et al., 1997). IMERG and PERSIANN products are characterized by quasi-global coverage,
    free access, high spatiotemporal resolutions, and continuous development (Tang
    et al., 2016). Given previous, both RS products are nowadays widely used in hydrometeorological
    applications including tracking of precipitation anomalies (Nguyen et al., 2014;
    Sakib et al., 2021), precipitation early warning systems (Sorooshian et al., 2014),
    and flood forecasting and mapping (Belabid et al., 2019; Nguyen et al., 2015).
    Of particular concern is the determination of the optimal RS product for a given
    study area, the necessity to combine two or more RS products, or even fuse RS
    databases to improve precipitation representation and minimize precipitation uncertainties
    (Soo et al., 2020; Yin et al., 2021; Yu et al., 2020).


    Once the issue of data availability is solved, the arising research questions
    are (1) is precipitation well represented by RS data? and (2) can the assimilation
    of RS precipitation be improved (in the context of extreme runoff ML models)?
    The first research question is mandatory for the cases when the interest lies
    in providing accurate precipitation estimations. This can be achieved by validating
    RS products with ground precipitation estimations, see for instance the studies
    of Laverde-Barajas et al. (2019) and Li'
