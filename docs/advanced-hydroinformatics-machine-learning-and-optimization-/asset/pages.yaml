  md: '# 13.3. Theory of Complex Network


    # 13.3.1. Concept of Network


    Basically, a network is a set of points and lines, in which various types of nodes
    or vertices may be connected together by all sorts of links or edges. A series
    of indexes are introduced to characterize the pattern of CN, including degree
    centrality, clustering coefficient, average shortest path length, degree distribution,
    and betweenness. These simple statistics can be used to quantify the properties
    of networks and to define the types (e.g., regular graph, random graph, small-world
    network, and scale-free network).


    The network shown in Figure 13.2, for example, can be represented as G = {P, E},
    where P is a set of 6 nodes and E is a set of 7 links, namely P = {1,2,3,4,5,6}
    and E = {{1,2},{1,6},{2,6},{3,6},{4,6},{5,6},{3,4}}. Figure 13.2a shows the simplest
    form of network, which contains identical nodes and links; however, the network
    may have different types of nodes and/or links (Fig. 13.2b). The nodes and links
    may have a variety of properties, such as weight (Fig. 13.2c); and the connection
    may be directed, pointing in one direction (Fig. 13.2d). Besides, more particular
    features, such as multilink, self-link, and hyperlink, also exist in more CNs
    of real systems.


    ![](img/dd2f1e467aed0a84f984e6e656b2cc0f_377_0.png)


    Figure 13.2 Different networks: (a) An undirected network with identical nodes
    and links; (b) a network with more than one type of nodes and links; (c) a network
    with weighted nodes and links; and (d) a directed network (adapted from Sivakumar,
    2015).'
