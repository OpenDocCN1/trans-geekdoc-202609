  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_179_0.png)


    Figure 6.7 Localization of precipitation object centroids (dots) associated with
    extreme hydrological events in the Jubones basin.


    Concerning the localization of precipitation objects within the Jubones basin,
    centroid occurrence appeared to be unaffected by any physical attribute that could
    be derived for the basin (i.e., altitude, land use, etc.). It is interesting that
    no hotspot of precipitation occurrence was detected for the Jubones basin (see
    Fig. 6.7). This suggests, for instance, that there is no evident orographic precipitation
    enhancement, and that the runoff generation process is rather driven by infiltration
    and saturation mechanisms before precipitation becomes streamflow.


    # 6.4.3. Classification of Precipitation Events Associated With Extreme Hydrologic
    Events


    The combination of duration and extension thresholds of 7 hr and 50 km² served
    to define four precipitation classes. We determined 24 extreme hydrological events
    for the LSE precipitation class, 5 for the LLE, 7 for the SEE, and 10 for the
    SLE. Figure 6.8 depicts the visual discrimination between precipitation classes,
    from which it is apparent that the majority of extreme hydrological events occurred
    as a result of short duration and spatial local (LSE) precipitation events, and
    long duration and spatially extensive events (SLE).'
