- pgno: 312
  md: 'If w(t) = flood, then w(t+1) = waters, w(t-2) = inundated, and w(t+4) = rain.
    In practice, Skip-gram gives better word representations when the monolingual
    data are small. However, CBOW is faster and more suitable for larger datasets
    (Mikolov et al., 2013). In the Skip-gram approach, the objective of the neuronal
    network is to maximize the probability of any context word, given the current
    central word, mathematically formulated as follows:


    $F.O. = \frac{1}{T} \sum_{t=1}^{T} \left( \sum_{\substack{j=-k \\ j \neq 0}}^{k}
    \log p\left(w_{t+j}|w_t\right) \right)$


    where k denotes the size of the training window (which can be a function of the
    central word), and p(w_{t+j}|w_t) represents the probability of the word w(t+j),
    given w(t):


    $p\left(w_{t+j}|w_t\right) = \frac{\exp\left(u_w^T * v_{wj}\right)}{\sum_{n=1}^{N}
    \exp\left(u_n^T * v_{wn}\right)}$


    where N signifies the number of words in the vocabulary.


    # 10.3.6. Step 6 (NLP Analysis)


    Once the text had been tokenized and the Word2Vec function had been applied to
    embed the words in vectors, NLP tools were used to create a word cloud for each
    water body, so the main words linked to each article could be represented in a
    graph. This allowed us to obtain a better picture of the most representative elements
    (social, economic, environmental, and climatic) related to each water body. The
    Natural Language ToolKit (NLTK), Scipy, and Word Cloud libraries were used in
    this process.


    Counting the number of news items for each time step and each water body, as well
    as identifying the main topics about each water body, were also part of this study.
    Through this information, patterns between extreme events and digital news could
    be explored. Later, this information was aggregated on monthly and annual levels.
    However, most of the NLP free libraries work only for English-language texts or
    have a paragraph word-count limitation for non-English languages (because of an
    implicit third-party translation process). This makes the application of NLP'
