- pgno: 219
  md: '![](img/dd2f1e467aed0a84f984e6e656b2cc0f_219_0.png)


    **Figure 7.11** A 24 hr water-level forecast comparison of ANN and BISECT model
    outputs to measured water level at station NP201.


    Similar characteristics are observed when comparing the output of the BISECT model
    to the ML water-level prediction for the remaining four stations investigated.
    In each case, the ML models outperformed the BISECT model in predicting water
    level 1 day ahead.


    An improvement in water-level forecasting could be of significant importance in
    the southern Everglades where such a vast water-control system exists. The ML
    models proved to be better than the BISECT model in predicting water level 1 day
    ahead for each location investigated and could complement the BISECT model in
    monitoring and analyzing the region’s hydrology. Applications where water-level
    forecasts are required could benefit from these more accurate local forecasts,
    increasing the quality and accuracy of ecological studies and assessments, and
    aid in the CERP.


    # 7.7. Conclusions and Future Directions


    The following itemizes conclusions and future directions.


    +   1. Machine Learning is a good complement to the conventional numerical models
    used in the southern Everglades for predicting water levels and thus hydroperiods
    for water manager and ecologic studies. The accuracy of water-level predictions
    from both ML models improved when compared with an existing numerical model.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   2. A rational choice of predictors that affect water level positively contributed
    to the performance of ML models. Also, the water level inputs are the most influential
    variables on the predictions.

    +   3. Incorporation of weather predictions from numerical models as inputs to
    ML models improved water-level forecasting, particularly at greater lead times
    (7 and 10 days). Skill and accuracy of the numerical weather models is a limiting
    factor in achieving accuracy in water-level forecasts.

    +   4. Incorporation of volumetric discharge releases from water-control structures
    into the ML models (where applicable) had a positive effect on the accuracy of
    water-level forecasts.


    A future focus on improving the accuracy of weather forecast models or selecting
    weather models that perform well at forecasting rainfall could be beneficial.
    A local model for south Florida based on the Weather Research and Forecasting
    (WRF) code (https://www.mmm.ucar.edu/weather-research-and-forecasting-model) could
    provide some improvement in the accuracy of the rainfall forecasts because this
    is a mesoscale model and as a result has a higher resolution than the global ECMWF
    model. Rainfall forecasts from the WRF model could be corrected using gauged data
    through different methods. Additionally, using future scheduled releases instead
    of measured ones at each forecast horizon could lead to improvements in system
    management through better tailoring of these releases based on the predictions.
    Finally, medium-range forecasts could explore the use of ensemble (committee)
    models, as were used by Fenicia et al. (2007), Kayastha et al. (2013), and Zhang
    et al. (2022). Ensemble models can be created by classifying water levels into
    several classes (e.g., low, medium, and high), training several ML models, each
    responsible for its own class of data, and then combining them using a dynamic
    weighting scheme (Zhang et al., 2018; Zhang et al, 2022, equation (6)). Such an
    approach typically leads to higher performance from a combined ensemble of many
    ML models with different strengths and weaknesses.


