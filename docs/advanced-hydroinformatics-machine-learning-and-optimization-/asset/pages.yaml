- pgno: 273
  md: '# 9.3.3. K-Fold Cross-Validation


    The basic idea behind k-fold cross-validation is to reduce the bias associated
    with the chosen training set and the remaining samples. To do this, k subsets
    of equal size are selected (randomly or continuously). In each model, the partition
    consists of k-1 subsets for training and a single subset for validation. The validation
    set is rotated k times so that the k subsets are used exactly once; in consequence,
    k different models (folds) are built. For this study, the first 85% of the data
    was used for the 10-fold cross-validation, and the rest for testing. For each
    model, an early stopping criterion was used to avoid overfitting.


    # 9.3.4. Wavelet Decompositions as an Input Preprocessor of an Artificial Neural
    Network


    The a-trous wavelet transform algorithm was applied to the input data set; the
    resulting time series replaces the original Figure 9.2, and Figure 9.3 shows the
    traditional ANN and wavelet-ANN schematization. In the last, the simple procedure
    of decomposing signals already brings benefits to the model performance.


    The ANN model assigns bigger weights to subseries with more relevant information
    for the modeling purpose. This is done by assigning different weights to each
    subcomponent during the training process.


    # 9.3.5. Levels of Decompositions and ANN Structure as Decision Variables in an
    Optimization Routine


    Since decomposition analysis can be performed using the multiresolution algorithm
    in an iterative process, it can be performed at any desired level of decomposition.
    However, for practical reasons, you can continue only until one detail value covers
    the entire sample. Furthermore, the modeler can select an appropriate number of
    levels according to the nature of the signal or a criterion such as entropy. If
    little knowledge is available to perform the above actions, this difficulty can
    be overcome by optimizing the number of decomposition levels and hidden nodes
    with an intensive search (see section 9.5.2). This is feasible due to the limited
    space of decision variables (levels of decomposition x hidden nodes).'
