  md: "difficult in non-English regions. Nevertheless, some public packages and libraries\
    \ allow NLP analysis in Spanish-language texts.\n\n# 10.3.7. Step 7 (Sentiment\
    \ Analysis)\n\nAn important analysis that could be derived from NLP tools is sentiment\
    \ analysis. Sentiment analysis shows the perception of an author when writing\
    \ the article, interpreting this sentiment with a number that ranges between 0\
    \ (negative sentiment) and 1 (positive sentiment). For this purpose, a neuronal\
    \ network is built to classify the writer’s sentiment through a numerical value;\
    \ a summary of the involved processes is shown below. This requires statistical\
    \ data sampling, data normalization, input variable selection, training, and validation.\n\
    \n# Algorithm 10.1 Sentiment analysis pseudo code\n\n```\nInput: x=[x₁, . . .\
    \ , xₙ], xₜ ∈ Rᵐ and s=[s₁, . . . , sₙ], xₜ and sₜ ∈ [0,1]\nInitialize parameters:\
    \ w=[w₁, . . . , wⱼ], wₜ ∈ Rⁿ\nfor t=1, . . . , n do\n  Calculate y=w•x\n  Update\
    \ w\n  Calculate error(y,s)\nend for\nOutput: sₙ₊₁ ∈ [0,1]\n```\n\nIn this research,\
    \ we used the spanish_sentiment_analysis library (Hofman, 2017/2021), which was\
    \ already trained and tested in its open source version. The library used almost\
    \ one million reviews of users of the following webpages: Trip Advisor, PedidosYa,\
    \ Apestan, QuejasOnline, MercadoLibre, SensaCine, OpenCine, TASS, and Twitter\
    \ (Spanish-language version) for its calibration and validation. TensorFlow and\
    \ Marisa-trie libraries were used for building the sentiment neuronal network.\
    \ In this process, the model developed a regression between the users’ reviews\
    \ of the websites and their corresponding scores on a scale from 0 to 5 (websites’\
    \ 5-star reviews). Then, this information was represented as a numerical value\
    \ between 0 and 1, where a 5-star review represented a sentiment value of 1. This\
    \ calibrated model was used to predict the news sentiment over the Magdalena River\
    \ Basin.\n\nThe spanish_sentiment_analysis package is an open-source library built\
    \ on scikit-learn and NLTK in Python. The model works as a simple pipeline that\
    \ includes a vectorizer (TfidfVectorizer), a feature selector (SelectKBest), and\
    \ a classifier (MultinomialNB). The feature selector will reduce"
  merge: -1
  img_proc: true
- pgno: 314
  md: 'the number of features generated by the vectorizer. The feature selector function
    selected was SelectKBest from scikit-learn, performed by checking whether a feature
    was relevant or irrelevant. The classifier model used was a multinomial naive
    Bayes with best parameter alpha = 0.03. The parameters and hyperparameters of
    this pipeline were found by using a GridSearch K cross-validation, with K = 10.
    Additionally, the Marisa-trie library was used for a static memory-efficient structure.
    This model was applied to the digital news information of each article. The results
    were compiled on monthly and annual aggregation levels. Moreover, the model was
    tested with reviews of users of the pages eltenedor, decathlon, filmaffinity,
    and ebay in their Spanish language for two data sets (positive and negative) of
    50,418 reviews each one using the Mean Absolute Error (MAE).


    # 10.3.8. Step 8 (Validation)


    The results obtained from the NLP analysis were compared with measured physical
    variables (e.g., river-level flows) and observed events (social and environmental
    emergencies), as part of the validation process. This comparison was necessary
    to verify the relations between events and digital citizens’ media. For this purpose,
    different parameters were validated, as listed below.


    +   1. Sentiment index versus monthly river levels’ range next to the Hidroituango
    Dam and the Bogotá River (Girardot). The monthly river-level range was used as
    a simple representation of a sudden change in the flow of the river (e.g., Hidroituango
    emergency).

    +   2. Correlation of monthly climatic variables and sentiment index. The correlation
    was performed using the monthly sentiment index for the water bodies with information
    for all the time ranges (at least one article per month). Furthermore, the climatic
    events were extracted as the maximum and the minimum values of precipitation and
    temperature for the spatial area of the water body.

    +   3. Confusion matrix of extreme events identified by climatic variables (precipitation
    and temperature) versus the number of articles over time. Extreme events were
    identified as monthly values smaller than 5% of the selected range values of the
    climatic variables. Likewise, months with values that exceeded 95% of the selected
    time series were classified as extremes. For this analysis, annual time ranges
    were selected.'
