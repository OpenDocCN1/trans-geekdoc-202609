- pgno: 158
  md: '# 5.4. Conclusion and Future Works


    Regression-based ML models can be used as a supplement to both conceptual and
    physics-based hydrologic simulation models. However, there continues to be a concern
    regarding their ability to provide skillful prediction performance, in part because
    of their need for much more training data to generate hydrological processes,
    varying degrees of noise in data, and overfitting, which can translate into a
    significant amount of error and uncertainty in the modeling results. We argue
    that the potential benefits of ML models for daily streamflow simulation of a
    coastal plain drainage system can be realized only via the formulation of robust
    and rigorous Bayesian Lasso interface as posterior mode estimate that is well
    suited to evaluate input-output behavior (behavioral consistency) for sequential
    streamflow time series data.


    One obvious way to reduce the obstacles and improve ML fidelity is using preprocessing
    methods (e.g., singular spectrum and wavelet analyses; see Vautard et al., 1992),
    finding intricate patterns in large volumes of data, improving sequence-to-sequence
    learning, and calculating noise variance and then capturing the outliers through
    monitoring the noise component. Enhancing the ability of ML on modeling extreme
    observations within time-series records is also important and needs further attention.
    Furthermore, physical parameters (and process interactions) could be mathematically
    formulated and incorporated into the ML models to ensure proper consistency between
    the model input-output behavior and the available data and catchment properties.
    Our research group has sought, therefore, to develop appropriate ML models that
    are comparable with a catchment scale hydrologic simulation model. The main limitation
    of our proposed ML approaches, however, is their vast computational time and cost,
    and overfitting that make them somewhat poor predictors. Our ongoing work explores
    the development of more advanced and computational cost-effective ML algorithms
    such as Recurrent Neural Networks (RNNs) to integrate the information extractable
    from the recurrence/structure of the network and mathematical formulation with
    catchment physical attributes and observations. As always, we invite dialogue
    with others interested in these and related ML model simulation topics.


