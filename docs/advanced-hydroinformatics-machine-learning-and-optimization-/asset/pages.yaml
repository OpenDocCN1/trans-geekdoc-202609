- pgno: 329
  md: 'with significant effects on communities can be analyzed over time through news
    articles and NLP. The identification of main topics about water bodies included
    in newspaper articles can illustrate the big picture of water resources problems
    for a region, as presented in Quebrada el Carmen. In this context, digital news
    is representing digital citizens’ information from a part of the population, in
    this case journalists, which describe a mainstream view of a water-related topic
    for a given spatial and temporal range. This mainstream view was clearly appreciated
    in the Hidroituango emergency analysis. Here, digital citizens’ information has
    been captured indirectly through the documentation of one or a few individuals
    and shared with the community in digital news format. Additionally, it’s also
    observed and concluded about editorial bias influence on digital news results
    using NLP. In other words, the journalist writer’s political or environmental
    affinities could twist the intention of the information documented, and consequently
    it’s advised to include subjectivity analysis in further developments. Other authors
    had also found and analyzed this bias in their works regarding newspapers (Gangula
    et al., 2019; Valdeavilla & Pulido, 2019). In this work, the writer’s subjectivity
    was not measured, nevertheless, it was expected that individual political and
    environmental biases were reduced when using multiple sources of digital newspapers,
    as well as use information of well-established newspaper editorials. Additionally,
    politically related topic news was filtered within the search news step. Likewise,
    given the objective and activities of this research, it was deduced (as illustrated
    in the geovisualization step, within the maps) that most of the news was related
    to emergencies and water-related problems. These negative stories and big impact
    events allowed us to identify challenges in IWRM. Furthermore, this implies a
    coverage bias, as journalists tend to write about negative events. This bias should
    be studied further when evaluating the positive effects of the decision-making
    process, and applying NLP outputs in a broader context. Despite these drawbacks,
    newspaper articles represented adequately the effects of major changes on water
    bodies (e.g., Hidroituango).


    The comparison between sentiments toward water bodies and physical variables is
    essential for a better understanding of the relations in the water-energy-food
    nexus. Sentiment index and monthly river-level ranges comparison in Hidroituango
    Dam and Bogotá River allowed us to satisfactorily identify drastic sentiment changes
    over. From the correlation between climatic events and sentiment index, two main
    statements are obtained. First, it is necessary to have an improved geolocation
    methodology. Spatial location derived from water bodies shows it is not enough
    when analyzing'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'long rivers, as point-located news are not easily geolocated in the river.
    Second, it was found that the date of publication of a newspaper article is not
    representative of the time occurrence of a hydrological event in small water bodies
    with few data sources. In these cases, the publication date denoted the timestep
    when the hydrological event was a mainstream topic for the community. Nevertheless,
    the visualization of georeferenced sentiment analysis results has proven to be
    a useful tool to understand the spatial changes in water bodies over time. Additionally,
    the results of the confusion matrix of extreme events provides a new understanding
    regarding the complexity when linking physical variables with digital media, as
    external factors could affect the sentiment index regarding hydrological events.
    In the context of NLP analysis on newspapers, other authors suggest the existence
    of sets of assumptions that imply a different interpretation of sentiment analysis
    results regarding the field of study (Puschmann & Powell, 2018), while Baccarella
    et al. (2018) exhibits the risk of social media and fake news. These statements
    reinforce the relevance of a digital news filtering process toward a newspaper
    database of water-resources topics. Consequently, this discussion proposes that
    a deeper analysis should be carried out when analyzing the perceptions of digital
    news and our understanding of it. Finally, we conclude by stating that NLP analysis
    of newspaper articles can provide additional information for decision making at
    the basin level, based on digital news information about the Magdalena River Basin’s
    water bodies, however, this should be checked against physical variables and improved
    in spatial and temporal resolution when implementing action plans.


    It is foreseen that other sources of information about extreme hydrological events
    could be explored through NLP (e.g., Twitter). Further, a specialized word-corpus
    based on water resource management is highly recommended for improved results.
    Furthermore, additional water cycle components should be incorporated in NLP applications,
    as aquifers, subsurface flows, and humidity. In future works, a deeper geospatial
    analysis between digital citizens’ information and measured physical variables
    could provide additional tools for decision-making processes. We also recommend
    to explore new machine learning approaches for NLP involving water resources,
    as new advances could improve their results. Moreover, while new machine learning
    developments could provide new results, new additional challenges arise when trying
    to implement the work results in a decision-making process for community development
    and as a new methodology within the broader academic study of water-resource management.'
