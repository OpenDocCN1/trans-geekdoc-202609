  md: '# 9.2.4. The A-trous Wavelet Transform


    time) and if interpolations are performed, the wavelet transform and approximation
    coefficients are contaminated with impurities brought in by the extension method
    applied at the right-side limit. Errors commonly found in hydrology can be consulted
    in Du et al. (2017), Maheswaran and Khosa (2012), and Quilty and Adamowski (2018).


    The a-trous algorithm is called in many ways by different authors, namely, redundant
    wavelet transform, stationary wavelet transform, a-trous algorithm, translation
    or shift-invariant algorithm, or undecimated wavelet transform. Through the redundancy
    offered by the algorithm and at the expense of greater storage capacity, time
    invariance is accomplished. Another feature of the method that motivates the use
    of this algorithm is the fact that the wavelet coefficients are calculated from
    data only obtained previously in time, appropriate for a directed (time-varying)
    data stream. The reader is encouraged to refer to the following references to
    obtain greater details: Aussem et al. (1998), Kozakevicius and Schmidt (2013),
    Renaud et al. (2002), Renaud et al. (2003), and Shensa (1992).


    Let’s proceed and briefly show the a-trous algorithm using the redundant Haar.
    The first approximation resolution level, φ(1), is obtained from φ(0) (original
    signal) by using the following equation, where c_k = (½, ½) is the scaling coefficients
    that satisfy the following dilation equation:


    φ(t) = Σ_k c_k φ(2t − k)  (9.5)


    and, for the first resolution, we never use future values. This is valid for a
    directed (time-varying) data stream, see below:


    S_{m+1,n} = Σ_k c_k S_{m,n−2^k}  (9.6)


    leads to S_{1,1} = c_1 S_{0,1−2^0} + c_1 S_{0,1−2^1} = c_1 S_{0,0} + c_2 S_{0,−1}
    = ½ (S_{0,0} + S_{0,−1}). Observe the difference with the decimated form S_{m+1,n}
    = 1/√2 Σ_k c_k S_{m,2n+k} (DWT algorithm), where the filter was chosen to be c
    = (1, 1), in this case, future values are considered (not allowed for the testing
    phase), and at each decomposition, we are jumping 2n locations, therefore the
    decimation takes place. Renaud et al. (2002) define the details or wavelet transform,
    in this case just as the signal difference between two consecutive resolutions,


    T_{m,n} = S_{m−1,n} − S_{m,n}  (9.7)'
