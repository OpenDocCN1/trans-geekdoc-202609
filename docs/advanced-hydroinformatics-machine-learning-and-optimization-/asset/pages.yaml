- pgno: 424
  md: '# MULTI-OBJECTIVE OPTIMIZATION OF RESERVOIR OPERATION POLICIES USING MACHINE
    LEARNING MODELS: A CASE STUDY OF THE HATILLO RESERVOIR IN THE DOMINICAN REPUBLIC


    Carlos Tami¹, Gerald A. Corzo Perez², Fidel Perez³, and Germán Santos¹


    ¹ Colombian School of Engineering Julio Garavito, Bogotá, Colombia

    ² IHE Delft Institute for Water Education, Delft, The Netherlands

    ³ Mother and Teacher Pontifical Catholic University, Santo Domingo, Dominican
    Republic


    Finding a balance between conflicting interests in multi-purpose reservoirs is
    an important challenge for decision makers. This study assesses the use of different
    computational tools to obtain optimal reservoir operations at the Hatillo dam
    in the Dominican Republic. A multi-objective optimization approach is applied
    to models that simulate reservoir operations and three different machine learning
    (ML) models are employed to learn the real operation of the system. A general
    model is proposed to simulate daily reservoir operations (2009-2019), integrating
    water balances, physical constraints of the dam components, and the ML models,
    the latter defining daily controlled discharges. In the optimization process,
    the ML parameters are the decision variables, while the objectives evaluated'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'are irrigation, hydropower generation, and flood control. The results are compared
    with the actual operation of the reservoir. The flood control objective was found
    to have a wide room for improvement over the real operation of the reservoir,
    and several of the solutions were found to improve the real operation for the
    three proposed objectives. The multilayer perceptron models tended to generate
    the best results for this case study and the nondominated sorting generic algorithm
    (NSGA II) optimizer generated the best optimization results.


    # 15.1. Introduction


    Reservoir optimization is one of the most relevant study areas within the field
    of water resource systems (Momtahen & Dariane, 2007). With the effect of climate
    change, population growth, and basin dynamics, optimal operation of reservoirs
    has more relevance in water resources management.


    Multipurpose reservoirs are often used to attend multiple demands for domestic,
    industrial, irrigation, environment, hydropower production and flood control,
    among others (Sun et al., 2018). Therefore, considering the different interests
    that may exist in decision making for the operation of reservoirs, as well as
    the mutual conflicts that these interests may present, finding operating policies
    to which all the involved parties will agree is not an easy task. For the flood
    control objective, for instance, it is better if there is less water in the reservoir,
    allowing to accumulate a large additional volume of water during the flood season
    (Zhou et al., 2018), while more water in the reservoir is better for irrigation
    purposes (Scola et al., 2014). Regarding hydropower production, the stored energy
    in the reservoir gradually increases with the rise in water level (Jansen et al.,
    2013), and outflows might support irrigation, however, there are also well-known
    cases where hydropower production reduces water availability for irrigation (Ruijie
    et al., 2017). Thus, finding optimal operating policies that use multi-objective
    approaches to refocus decision making toward a balance of interests is highly
    relevant to improve the integrated use of reservoirs. It is important to address
    trade-offs between multiple objectives to achieve the management goals (Myo Lin
    & Rutten, 2016).


    The literature cites different approaches for tackling multi-objective optimization
    problems. Many of these are oriented toward the search for sets of nondominated
    solutions reflected in decision spaces or Pareto fronts. Traditional approaches
    aim to simplify multi-objective problems into several single-objective problems
    that can be addressed via standard'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'optimization algorithms (Miettinen, 1999). For instance, the weights or weighting
    method converts objectives into scalar values by assigning subjective weights
    (Labadie, 2004), or the e-constrained method (Haimes et al., 1971) transforms
    all objectives into constraints except for one, to which a standard optimization
    method is applied, thus simplifying the problem. Both methods are widely applied
    in reservoir optimization (see Heydari et al., 2016; Ko et al., 1992; Khattab
    & Al-Mohseen, 2020). Another method, the goal attainment (Gembicki & Haimes, 1975),
    consists of defining a set of specified targets associated with a set of objectives,
    which can be underachieved or overachieved and are controlled by a vector of weighting
    coefficients (Loucks & van Beek, 2017). In reservoir optimization, this method
    has been employed by Khattab and Al-Mohseen (2020), and Basu (2004). All these
    approaches, however, are limited when the complexity of the problem increases
    (e.g., greater number of objective functions, decision variables, or constraints).


    Thanks to advancements in computational resources, better technologies, and more
    robust equipment, metaheuristic techniques have been gaining popularity in the
    field of water resources. Such is the case for evolutionary algorithms (EA) that
    use the mechanisms of Darwin’s evolution of species (see Câmara, 2015; Loucks
    & van Beek, 2017). When applied to multi-objective optimization, EAs are efficient
    because of their ability to solve complex problems involving characteristics such
    as discontinuities, multimodality, disjoint feasible spaces, and noise when evaluating
    functions (Ma et al., 2015). These algorithms seek to generate a Pareto-approximate
    set of solutions to serve as a reference for decision making in multicriteria
    problems (see Kollat et al., 2011; Giuliani et al., 2014). Among these EAs, the
    Nondominated Sorting Genetic Algorithm II (NSGA II) (Deb et al., 2002) and the
    multi-objective evolutionary algorithm based on decomposition (MOEA / D) (Zhang
    & Li, 2007) stand out. Some authors have used these algorithms to optimize multipurpose
    reservoirs. Castelletti et al. (2012) used the NSGA II to optimize the Hoa Binh
    reservoir on the Da River in Vietnam for hydroelectric generation, water supply,
    and flood control. Myo Lin et al. (2020) also used the NSGA II within the scope
    of multi-objective model predictive control for real-time operation of a multireservoir
    system in the Sittaung River basin in Myanmar. Similarly, Ma et al. (2015) applied
    the MOEA / D to optimize the Ankang reservoir in China for flood control.


    One approach that has gained popularity in recent years is direct policy search
    (DPS), a term employed by Rosenstein and Barto (2001). This concept is also known
    in water resource literature as parameterization-simulation-optimization, as referenced
    by Koutsoyiannis and Economou (2003). Per this method, optimizers are applied'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'directly to approximation functions or models that simulate the reservoir’s
    operation (Ritter, 2016; Ritter et al., 2020). With advances in artificial intelligence
    techniques, some recent studies have applied approximation functions or machine
    learning (ML) models that use artificial neural networks (ANNs) to represent reservoir
    operations (e.g., Ehsani et al., 2016; Zhang et al., 2018). Giuliani et al. (2014)
    used radial basis networks (RBNs) and a multi-objective evolutionary algorithm
    (MOEA) to obtain optimal operating policies in a multipurpose reservoir. The combination
    of DPS, approximation functions, and MOEA results in an approach named evolutionary
    multi-objective direct policy search (EMODPS), developed by Giuliani et al. (2016),
    who used it to improve operating policies of a multipurpose reservoir.


    Based on the EMODPS approach, this study aims to develop a methodology to obtain
    optimal reservoir operation policies using ML models. That is, design ML models
    that can define the volume of water that must be released in a time interval,
    and which through multi-objective optimization can learn optimal operations (optimal
    policies) to satisfy certain objectives. For this purpose, three different machine
    learning (ML) models, namely, the multilayer perceptron (MLP), the radial basis
    network (RBN), and the linear function (LF) are compiled. As well as two EAs:
    NSGA II and MOEA / D. The Hatillo reservoir in the Dominican Republic is used
    as a case study that has three purposes in mutual conflict: hydroelectric generation,
    irrigation, and flood control. The main objective for this case study is to find
    optimal policies to improve the real operation of the reservoir (analyzed for
    the period 2009–2019) for the three proposed objectives. The following sections
    describe the case study and the proposed methodology, and later demonstrate the
    results and conclusions of the study.


    # 15.2. Case Study


    # 15.2.1. The Hatillo Reservoir


    The Hatillo reservoir is in the Yuna River basin (Fig. 15.1), Dominican Republic,
    about 113 km northeast of Santo Domingo. This reservoir has been used for irrigation,
    hydropower generation, and mitigating downstream flooding. The Yuna River basin
    drains an area of 5,498 km², flowing downstream for approximately 210 km. It is
    the second most important river in the Dominican Republic; and with an average
    flow of 91 m³/s at its mouth (35.4 m³/s at the entrance of the reservoir), it
    is the river with the highest flow. Mean annual precipitation in the basin (in
    terms of spatial'
