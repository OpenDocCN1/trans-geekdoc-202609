- pgno: 14
  md: 'Another chapter shows how drought analysis from a 3-D perspective of clustering
    extreme events can be used to characterize how phenomena develop in space and
    time. A further contribution demonstrates how so-called complex networks are helping
    in discovering teleconnection patterns in water quality dynamics. Water management
    decisions are becoming more and more challenging, thus ideal for developing and
    testing various model-based multi-objective optimization approaches under uncertainty,
    an issue also dealt with in this part of the book.


    The research results and experiences presented here demonstrate how machine learning
    and, more generally, artificial intelligence, can advance data analytics, accuracy
    of modeling and forecasting, and knowledge discovery for better water management
    under uncertainty. We hope this book will also provide inspiration for further
    advancing research in hydroinformatics.


    We would like to acknowledge the valuable contributions of all the authors as
    well as their dedication and patience in multiple interactions with reviewers,
    whom we would also like to thank. This book includes contributions from researchers
    from many countries around the world, who present a broad scope of interesting
    problems of different geographical and hydrometeorological nature and scale. We
    are also thankful to our home, IHE Delft Institute for Water Education in the
    Netherlands, where hydroinformatics began 35 years ago, and where a number of
    our contributors studied. Our gratitude also goes to staff at AGU and Wiley who
    have played an important role by continuously supporting the preparation of this
    book.


    Gerald A. Corzo Perez

    IHE Delft Institute for Water Education

    The Netherlands


    Dimitri P. Solomatine

    IHE Delft Institute for Water Education, and

    Delft University of Technology

    The Netherlands'
