  md: '# REGRESSION-BASED MACHINE LEARNING APPROACHES FOR DAILY STREAMFLOW MODELING


    Vidya S. Samadi¹, Sadegh Sadeghi Tabas², Catherine A. M. E. Wilson³, and Daniel
    R. Hitchcock¹


    ¹ Department of Agricultural Sciences, Clemson University, Clemson, South Carolina,
    USA

    ² Department of Civil Engineering, Clemson University, South Carolina, USA

    ³ Hydro-environmental Research Centre, School of Engineering, Cardiff University,
    Cardiff, United Kingdom


    The increasing rise of computational power has led to significant advances in
    the application of machine learning (ML) techniques in hydrological simulation.
    These methods are specifically developed to discover constitutive relations by
    implementing an unbiased implicit approach to capture unforeseen patterns in massive
    data sets. This study applied multiple ML approaches for daily rainfall-runoff
    simulation across a mixed urban-rural drainage system, the Northeast Cape Fear
    River Basin in North Carolina (NC), USA. Multiple ML algorithms such as Support
    Vector Machines (SVM), Bayesian Lasso, and Random Forest (RF) models, along with
    the Sacramento Soil Moisture Accounting (SAC-SMA) rainfall-runoff model, were
    applied to predict sequential daily streamflow records based on a set of collected
    data from climate and streamflow gauging'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'stations. Analysis suggests that the effects of input data on model performance,
    the error associated with forcing data, the amount of training data, and the correlation
    among different attributes of data series have strong influences on ML computation.
    Compared to the SAC-SMA, the Bayesian Lasso model was able to simulate the temporal
    dependencies among the observations and thereby was capable of accurately modeling
    the multivariate sequences of complex daily rainfall-runoff records across a mixed
    urban-rural catchment. The results provided an algorithmically informed simulation
    on the dynamics of daily streamflow simulation that may apply to other complex
    catchments and climate settings.


    # 5.1. Introduction


    Watershed modeling helps understand the past and current state of rainfall-runoff
    processes in a watershed and provides a way to explore the implications of management
    and planning decisions and imposed forcing function changes such as land use and
    climate. In complex watersheds (in this case, coastal plain watersheds), very
    significant modeling efforts have been conducted based on both lumped and physically
    based simulations (Amatya & Jha, 2011; Samadi & Meadows, 2017; Samadi et al. 2017,
    2020; among others). However, rapid increase in the availability of measurement
    data has spurred the development of many data-driven methods or machine learning
    (ML) approaches for modeling and predicting rainfall-runoff dynamics. Indeed,
    in the realm of process-based hydrologic modeling, time-series ML algorithms have
    been recently utilized to improve short- and long-term streamflow predictions
    at various scales and domains (e.g., Solomatine & Dulal, 2003; Solomatine & Shrestha,
    2009; Corzo et al., 2009; Shrestha et al., 2014; Fang et al., 2017; Kratzert et
    al., 2018; Shen, 2018; Shen et al., 2018; Wu et al., 2018). ML algorithms attempt
    to estimate the mapping function (f) from the input variables (x) to numerical
    or continuous output variables (y) and can learn patterns hidden in data. Different
    ML algorithms make different assumptions about the shape and structure of the
    function and how best to optimize a representation to approximate it. Several
    studies have demonstrated that ML models can learn complex nonlinear input-output
    relations (e.g., Solomatine & Dulal, 2003; Solomatine & Shrestha, 2009; Shen,'
  merge: -1
  img_proc: true
- pgno: 146
  md: '2018); thereby, they are capable of serving as a complementary alternative
    to other state-of-the-art techniques in rainfall-runoff applications (Yang et
    al., 2020).


    Among various ML algorithms, regression-based models, such as Support Vector Machines
    (SVM), Random Forest (RF), Multi-layer Perceptron (MLP), and Decision Tree (DT),
    have been widely applied for rainfall-runoff simulations across various domains
    and scales. For example, Sivapragasam and Muttil (2005) applied SVM to compute
    rating curve values at three gauging stations in Washington, USA. Their results
    indicated that SVM is well suited for rating curves extrapolation compared with
    widely used logarithmic and higher order polynomial fitting methods. Bui et al.
    (2016) proposed a new ML approach based on a neural fuzzy inference system and
    metaheuristic optimization for flood susceptibility modeling (MONF) over the Tuong
    Duong district in central Vietnam. They found that MONF outperformed other ML
    algorithms, including MLP and DT for flood susceptibility mapping. Sadler et al.
    (2018) applied RF method for the coastal urban stormwater prediction in Virginia,
    USA. They used quality-controlled, crowd-sourced street flooding reports ranging
    from 1 to 159 per storm event for 45 storm events to train and evaluate the RF
    model. Their results showed that RF performed better than other ML algorithms,
    such as Poisson regression, at predicting the number of flood reports and had
    a lower false-negative error rate. Despite the expanded use of ML models in streamflow
    simulation, very few studies have used advanced ML methods to simulate coastal
    rainfall-runoff processes. The closest work may be the statistical analysis of
    streamflow records in the United States to compute the probabilities of high and
    low flow events in the past several decades along with the projected changes in
    the coming decades (Hidalgo et al. 2009; Campbell et al., 2011; Asadieh & Krakauer,
    2017).


    ML approaches can be divided into three broad categories: (1) supervised learning,
    (2) unsupervised learning, and (3) reinforcement learning. Supervised learning
    maps the observations or labeled data sets to known output and generates formula
    based on input and output values (e.g., Simeone, 2018). On the other hand, unsupervised
    learning discovers implicit relationships/patterns in a given unlabeled data set
    (unclassified data set) and finds an association between input values to group
    the data. Reinforcement learning follows a trial-and-error method for each predictive
    step or action with no precise label or error message (e.g., Shrestha & Mahmood,
    2019). This study aims to use multiple state-of-the-art regression-based ML models
    to predict daily streamflow across a coastal'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'plain basin in North Carolina, USA. Coastal plain modeling is a substantial
    challenge as this type of simulation is tempered by the heterogeneity in basin
    characteristics (low-lying elevation, evapotranspiration, wide floodplains, etc.)
    and complexities in soil storage capacity due to extensive alluvial and nonalluvial
    forested wetlands and riparian storage (e.g., Shirmohammadi et al., 1986; Samadi
    et al., 2017). This research simulated a coastal plain rainfall-runoff process
    using three different regression-based ML algorithms including SVM, Bayesian Lasso,
    and RF. While the SVM and RF models have been widely used for rainfall-runoff
    simulations (see Loos & Elsenbeer, 2011; Wang et al., 2015; Yang et al., 2016,
    among others), Bayesian Lasso has rarely been implemented for hydrologic modeling
    problems (Das Bhowmik et al., 2018) and have never performed for a coastal plain
    hydrologic simulation. This study is thus the first attempt to implement a Bayesian
    Lasso algorithm to exploit model inference via posterior distributions for a coastal
    plain rainfall-runoff simulation problem. This advanced algorithm, in addition
    to more widely used SVM and RF approaches, is employed to glean information from
    geospatial data and weather information and train proposed supervised learning
    models for daily streamflow simulation. Various ML simulations were also compared
    with the simulation result of a well-known conceptual rainfall-runoff model (i.e.,
    Sacramento Soil Moisture Accounting (SAC-SMA)). It is important to note that the
    modeling approach presented here is general and applicable to any rainfall-runoff
    simulation problem, although the actual interpretations of the modeling diagnostics
    may vary from application to application.


    This chapter is organized as follows. The theoretical aspects of ML models and
    their modeling structures, the SAC-SMA model, and the study area are presented
    in section 5.2. Results and findings are outlined in section 5.3. A detailed discussion
    of ML’s potential use in rainfall-runoff applications is presented in section
    5.4.


    # 5.2. Materials and Methods


    # 5.2.1. ML Models


    ML algorithms are powerful models because they consider a learning style to adopt
    the procedures with a given data set in the training process. These approaches
    can be trained using time series data in which patterns are clearly defined. Once
    the ML models are well trained, they can output simulation results quickly without
    having to start from scratch, which'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'enables the ML-centric methods to serve as a complementary alternative to any
    hydrologic simulation model. The conceptual formulations and mathematical concepts
    of each algorithm are briefly discussed in the following sections.


    # Support Vector Machines


    The SVM algorithm is proposed by Vapnik, (2013) as a binary classification method.
    This algorithm uses the concept of Vapnik Chervonenkis (VC) dimension (see Vapnik,
    2013), which is a measure of capacity or complexity of a machine to minimize structural
    risk to optimization and obtain learning and generalization ability. Given by
    a set of N samples of {xₖ, yₖ}ₖ₌₁ᴺ, x ∈ Rᵐ, y ∈ R, where x is an input vector
    of size m, and y is the corresponding output value. An SVM estimator f on regression
    can be expressed as


    $$f(x)=\omega\cdot\phi(x)+b,$$  (5.1)


    where ω is a weight vector and b denotes bias. The ϕ represents a nonlinear transfer
    function that maps the input vectors into a high dimensional feature space (e.g.,
    Vapnik, 2013). A convex optimization problem with an ε-insensitivity loss function
    is used in this model to obtain optimization (equation (5.2)):


    $$\begin{aligned}

    \min_{\omega,b,\xi,\xi^*}\;&\frac{1}{2}\|\omega\|^2+C\sum_{i=1}^{m}(\xi_i+\xi_i^*)\\

    \text{s.t.}\;&\omega\cdot\phi(x_i)+b-y_i\le\varepsilon+\xi_i,\\

    &y_i-\omega\cdot\phi(x_i)-b\le\varepsilon+\xi_i^*,\\

    &\xi_i,\xi_i^*\ge0;\ i=1,2,\ldots,m.

    \end{aligned}$$  (5.2)


    where ξ and ξ* are slack variables, which include soft margin to deal with infeasible
    constraints; C is a positive constant to penalize training errors by the loss
    function over the error tolerance ε and prevent overfitting. In this algorithm,
    the overfitting problem is typically solved using Duality Theory and Lagrangian
    multipliers and imposing Karush-Kuhn-Tucker (KKT) optimality condition (see Shevade
    et al., 2000; Smola, 2002).


    # Bayesian Lasso


    In the classic linear regression setting, the original Lasso model, proposed by
    Tibshirani (1996), is an L1-penalized least squares estimate that'
  merge: -1
  img_proc: true
- pgno: 149
  md: "aims to resolve the following optimization problem:\n\n$$\\min_{\\beta}\\quad\
    \ (y-X\\beta)^T(y-X\\beta)+\\lambda\\sum_{i=1}^{D}|\\beta_i|,$$  \n(5.3)\n\nwhere\
    \ $X$ is a $N \\times D$ matrix of standardized predictors of dimension $D$, $y$\
    \ is the mean-centered response vector, $\\beta$ denotes a vector that contains\
    \ the $D$ regression coefficient, and $\\lambda$ is the regularization parameter,\
    \ which is a constant. The coefficient of parameters estimations are the solutions\
    \ of the penalized regression, and sparsity in the Lasso model is obtained because\
    \ some of the estimated parameters in $\\beta$ will be zero (see Efron et al.,\
    \ 2004; Helgoy & Li, 2019; Tibshirani, 1996). The Lasso solution can also be interpreted\
    \ as a Bayesian posterior mode estimate, so-called Markov Chain Monte Carlo (MCMC)\
    \ posterior estimation, when the prior for the coefficient parameters, $p(\\beta)$,\
    \ is a Laplace distribution or the double exponential distribution (Tibshirani,\
    \ 1996). A fully Bayesian Lasso was introduced by Park and Casella (2008) with\
    \ a conditional prior on $\\beta$ of the form $p(\\beta|\\sigma^2, \\lambda)$.\
    \ The posterior probability distribution for the coefficient parameters can be\
    \ calculated using the Gibbs sampler. The Bayesian Lasso by Park and Casella (2008)\
    \ has several attractive properties when it comes to parameter and hyperparameter\
    \ estimation in the Bayesian setting, that is, that the joint posterior distribution\
    \ for $\\beta$ and $\\sigma^2$ generally has one mode instead of multiple posterior\
    \ priors (Helgoy & Li, 2019). When conditioning Bayesian calculation on $\\sigma^2$,\
    \ it is important to guarantee a unimodal full posterior (see Park & Casella,\
    \ 2008). Without this, the posterior may not be unimodal, and the convergence\
    \ may slow down, making the true distribution less meaningful. Readers are referred\
    \ to Tibshirani (1996) and Park and Casella (2008) for more information.\n\n#\
    \ Random Forest\n\nRF, proposed by Breiman (2001), is one of the most popular\
    \ ML techniques for regression problems. These models consist of a large number\
    \ of individual decision trees that operate as an ensemble. Each individual tree\
    \ in the RF outputs a class (or group) prediction, and the class with the most\
    \ votes becomes the model prediction. The prerequisites for the RF well performance\
    \ include (1) the presence of some actual signals in time series data so that\
    \ the decision tree models built using those signals perform better than random\
    \ guessing, and (2) the prediction made by the individual trees need to have low\
    \ correlations with each other.\n\nDecision trees are very sensitive to the data\
    \ sets and a slight change in the training data can result in significantly different\
    \ tree structures. However, RF took advantage of this deficiency by allowing each\
    \ individual"
  merge: -1
  img_proc: true
- pgno: 150
  md: 'tree to randomly sample from the data set with replacement, resulting in different
    tree structures. This process is known as bagging. Each tree in a random forest
    can be picked only from a random subset of features. This potential limitation
    makes more variation among the trees in the model, and eventually leads to a lower
    correlation among trees and more diversification. However, one of the main problems
    of regression trees is that they are prone to overfitting in the training period
    and thus perform poorly in validation when given unseen data (e.g., Murphy, 2012).
    Overfitting occurs when the model is flexible and has a high capacity to memorize
    and learn both the actual relationship in the training data and any noise present
    in the data set. The RF model can overcome this deficiency by learning the structure
    of the decision tree that varies considerably with the training data. Instead
    of searching for the most important feature while splitting a node, RF searches
    for the best feature among a random subset of features. This results in a wide
    diversity that generally leads to better performance, thus avoiding overfitting
    of the model to the training data set. Users have the ability to make trees more
    random by using random thresholds for each feature, rather than searching for
    the best possible thresholds.


    # *Determination of Input Structure and Calibration Setup*


    Antecedent values of input variables could be considered to represent the catchment
    characteristics in the ML models (Solomatine & Xue, 2004; Tongal & Booij, 2018).
    In this study, a combination of precipitation ($P$), maximum and minimum temperatures
    ($T^{\mathrm{max}}$ and $T^{\mathrm{min}}$), solar radiation ($Srad$), and humidity
    ($H$) was used in addition to the antecedent day streamflow ($Q^s_{t-1}$) to build
    the rainfall-runoff simulation. The antecedent day streamflow was calculated using
    a Feed-Forward Neural Network (FFNN). After a number of experiments on the training
    data set aimed at finding the most relevant inputs, the following common input
    structure was selected:


    $Q^s_t = f(P_t, \ldots, P_{t-3}, T^{\mathrm{max}}_t, T^{\mathrm{min}}_t, Srad_t,
    H_t, Q^s_{t-1})$. (5.4)


    Prior to the model development, normalization was applied to all input variables
    as


    $X_{norm} = \frac{X_0 - \mu_x}{\sigma_x}$. (5.5)


    where $X_{norm}$ and $X_0$ indicate, respectively, the scaled and original data.
    The $\mu_x$ and $\sigma_x$ represent the mean and standard deviation of the original
    data, correspondingly. For each ML method used in this study, the optimal model
    parameters were selected by maximizing the objective function'
  merge: -1
  img_proc: true
- pgno: 151
  md: '(Mean Squared Error; MSE) using training and calibration data sets. The models
    were developed on the training data set with a range of parameter values, and
    the objective function value was calculated for the calibration period. The optimal
    model parameters were then used to simulate streamflow for the validation period.
    In this study, the range of parameter values was determined by examining several
    hydrologic simulation studies, such as Shortridge et al. (2016), Deka (2014),
    Kumar et al. (2016), Naghibi et al. (2017), Worland et al. (2018), Tongal and
    Booij (2018), and Fotovatikhah et al. (2018).


    # *SAC-SMA Model*


    The SAC-SMA model is developed by the U.S. National Weather Service (NWS) as a
    conceptual hydrologic simulation model. The tool utilizes a moisture accounting
    system to represent the catchment storage capacity. The SAC-SMA divides the basin
    into lower and upper soil zones at different depths, and defines the distribution
    of moisture, that is, tension water components (driven by evapotranspiration and
    diffusion) and free water components (driven by gravitational forces) in each
    of these two zones via a set of parameters (Burnash, 1995). The model uses climatic
    variables, such as precipitation and temperature, along with parameters on soil
    moisture states and the basin’s relative permeability, to estimate the amount
    of water that enters, is stored in, and leaves the basin. Thus, the model computes
    several key hydrologic processes, such as evapotranspiration, percolation, interflow,
    and different forms of runoff from a basin. These are (1) direct runoff from permanent
    and temporary impervious areas, (2) surface runoff due to precipitation occurring
    at a rate faster than percolation and interflow can take place when both upper
    zone storages are full, (3) interflow resulting from the lateral drainage of a
    temporary free water storage, (4) supplemental base flow, and (5) primary base
    flow (Burnash, 1995); although, proper application of the SAC-SMA requires interpretations
    of the primary rainfall-runoff mechanisms (precipitation, evapotranspiration,
    and soil moisture) in a physically reasonable manner. A distortion in any of these
    characteristics may produce a compensating distortion in another element. Such
    distortion may appear to produce an effective streamflow simulation during the
    fitting period, but can reduce the model performance, particularly during high
    and low flow events.


    Several performance metrics were used in this research for model benchmarking
    such as Nash-Sutcliffe efficiency (NSE; Nash & Sutcliffe, 1970), the Kling-Gupta
    efficiency (KGE; Gupta et al. 2009), and the Box-Cox transformed root-mean-square
    error (TRMSE; Box & Cox, 1964). In addition, three different signatures of the
    flow duration curve'
  merge: -1
