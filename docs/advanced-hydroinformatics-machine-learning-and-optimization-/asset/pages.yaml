  md: 'robust ones among optimized options (Marquez-Calvo & Solomatine, 2019). In
    this study, the method was used to develop robust optimal strategies of storage
    area operation under a specific downstream risk level. It was carried out following
    these steps: under the inflow uncertainty quantified as described in section 14.2.5,
    optimal strategies for each possible hydrograph are first identified by providing
    the hydrographs to the simulation-optimization model and performing the optimization.
    This step results in 100 Pareto fronts, with two dimensions of minimum downstream
    risk and minimum storage area damage, corresponding to 100 inflows. When assembling
    all these fronts in one coordination system, a scatter diagram would be formed,
    in which each point contains information of optimal strategy (gate operations)
    and the corresponding hydrograph; then a cluster of points would be picked by
    a certain criterion, which in this study is that they have same downstream risk.
    The risk could be a spectrum (e.g., with a span of 1), and the points included
    in mean potential robust strategies; a probability density function (PDF) can
    be built by collecting the storage area damage of those points, meaning the probability
    of storage area inundation loss under the chosen risk level; in order to find
    out the most robust one among these optimal strategies, each of these potential
    optimal strategies is simulated with 100 sampled hydrographs. Two criteria are
    calculated for electing optimal ones. They are (1) worst case and (2) expected
    value. The functions are


    $$E(X_i)=\frac{1}{n}\sum_{j=1}^{n}Obj_2(X_i,HG_j), \tag{14.12}$$


    $$W(X_i)=\max[Obj_2(X_i,HG_j)], \tag{14.13}$$


    where, $E$ is expected value; $W$ is worst case; $X_i$ is the $i^{th}$ solution;
    $HG_j$ is the $j^{th}$ hydrograph; $Obj_2$ is the value of storage area damage
    index (the objective 2); $n$ is sampling number ($n = 100$).


    It can be understood that the worst case selection criterion refers to maximum
    damage from the 100 simulated results, and the expected value selection criterion
    is average damage from the same results. Therefore, each optimal strategy has
    two criteria to estimate its robustness. The selection of most robust strategy
    is done by choosing the one with either minimum worst case or minimum expected
    value. In many cases, the same robust strategy is chosen by two different criteria,
    which means the strategy can lead to minimum damage under different flood conditions
    no matter if it is calculated by average or maximum value.


    # 14.2.7. Similarity Selection Method for Real-Time Operation


    In the case of developing real-time operation, lead time is an important consideration.
    According to Pan (2002), the forecasting scheme, which is'
