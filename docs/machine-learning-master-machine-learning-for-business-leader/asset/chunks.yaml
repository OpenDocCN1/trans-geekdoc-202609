    \n## 目录\n\n- 简介\n- 第 1 章：您的业务的机器学习\n  - 机器学习与预测分析\n  - 预测分析的工作原理\n  - 常用预测模型\n\
    \  - 分类器\n  - 机器学习与预测分析应用\n  - 构建合适的环境\n  - 预测模型\n- 第 2 章：机器学习与数据挖掘\n  - 数据挖掘技术\n\
    \  - 业务流程优化\n  - 执行业务流程优化\n  - 自动化\n  - 采用技术与全流程变革\n  - 优化业务资源\n  - 优化业务运营\n \
    \ - 引入以客户为中心的思维\n  - 区分真实趋势与短暂热潮\n  - 数据驱动策略\n  - 定位并连接潜在客户\n- 第 3 章：面向营销的机器学习\n\
    \  - 营销应用\n- 第 4 章：面向金融的机器学习\n  - 当前金融应用\n  - 机器学习与加密货币\n  - 机器学习日内交易\n- 结语\n\
    - 参考文献\n\n## 简介\n\n机器学习通过其数字交互改变了计算世界，因为它是一种人工智能形式。机器学习始于数据或观察，如指令或直接经验，然后在数据中寻找模式，使机器能够根据提供的示例做出更好的决策。机器学习的主要目标是让机器能够在没有任何人工协助或干预的情况下自动学习，并学会相应地调整。\n\
    \nArthur Samuel 于 1959 年创造了“机器学习”这一术语。然而，是 Tom Mitchell 提供了一个被更广泛引用、更正式的定义，用以界定机器学习领域中研究的各种算法。该定义为：“如果一个计算机程序在执行任务类\
    \ T 时的性能（由 P 衡量）随着经验 E 的增加而提高，则称该程序从经验 E 中学习了关于任务类 T 和性能度量 P 的知识。”\n\n该定义基本上提供了该术语的一个基本操作版本，而非从认知角度对其进行定义。Alan\
    \ Turing 在其论文中提出，用“机器能否做我们思维实体所能做的事？”来替代“机器能否思考？”这一问题。人类作为思维实体能做某些事情。图灵的提议揭示了会思考的机器可能具备的各种特征。\n\
    \n允许计算机从经验中学习，意味着利用多种算法进行大量的自动化和分析模型构建的数据分析。机器学习赋予机器搜索和识别隐藏洞察的能力，无需被自动化编程去寻找它们，而是在接触新数据时主动发现。尽管这项技术并不算新颖，但它正获得越来越大的势头，因为关于机器学习（常被称为\
    \ `ML`）有许多东西需要学习和了解。重燃对 `ML` 兴趣的各种因素包括：负担得起的计算处理能力、不断增长的数据集量以及负担得起的数据存储选项。现代公司可以利用\
    \ `ML` 算法开发分析模型，因为它们能在极少人工干预的情况下发现趋势、模式和关联，从而做出明智的决策。\n\n### 机器学习的演变\n\n现代世界的机器学习与过去已有不同。这主要归因于新技术的出现。在早期，该技术因模式识别以及计算机无需编程即可学习和执行特定任务这一特点而获得关注。许多热衷于人工智能的科学家进一步研究了这一方面，以实验计算机能否从数据中学习。当时的重点不在于迭代学习，而是计算机开始随着时间的推移适应所接收的新数据。基于过去所做的各种模式和计算，计算机学会了在相同或相似的情况下做出与过去相似的决策。机器这种从现有模式中学习的能力如今正获得巨大的关注。\n\
    \n人们现在开始注意到，机器能够以更快的速度将复杂的数学计算应用于不同领域，例如处理大数据。以 Google 无人驾驶汽车为例，它构建于机器学习原理之上。`ML`\
    \ 的另一个重要用例体现在 Amazon 和 Netflix 等公司使用的推荐系统中，这些是机器学习在我们日常生活中的实例。`ML` 还可以与语言规则创建相结合。Twitter\
    \ 目前实施了这一应用，以便您了解客户在谈论您什么。更为重要的是，机器学习被用于在各个工业领域检测欺诈。\n\n程序员告诉计算机如何解决手头问题的日子已经一去不复返。我们已进入一个时代，机器被赋予自主解决问题的能力。它们从每个数据集中识别模式。分析隐藏的模式和趋势使得预测未来问题变得简单，并防止其再次发生。机器学习算法通常遵循特定类型的数据，并利用数据中的模式来回答查询。例如，您向机器展示一系列狗的照片并说：“这是狗。”随后展示其他照片说：“这不是狗。”现在如果您向计算机展示照片，它将尝试识别这些照片是否为狗。然而，机器做出的每一次正确或错误的猜测都会存储在其内存中。这使得机器在长期来看变得更聪明，并在一段时间内丰富其知识。\n\
    \n### 机器学习在现代商业世界中的重要性\n\n"
