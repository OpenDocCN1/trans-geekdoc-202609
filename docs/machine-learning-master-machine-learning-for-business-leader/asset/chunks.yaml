    right kind of technology. One-third of people say that they invested in five out
    of ten independent platforms or solutions in the last five years, however many
    still don’t have the requisite tools to visualize their data fully. The real issue
    is the connectivity between the solutions. About 3% of marketers are saying that
    all their systems are totally in sync thereby connecting all the data, metrics
    and the insight smoothly across all channels. 15% admitted that they have no strategy
    at all for the development of internal processes and technologies in order to
    adopt newer cloud solutions in their legacy infrastructure.


