    Chapter 2: Machine Learning and Data Mining


    ![download.png](Images/image00054.jpeg)


    Data mining means extracting knowledge out of huge quantities of data. In other
    words, we can say that it is a process of discovering different kinds of patterns
    inherited in the data sets that are new, useful and accurate. Data mining is an
    iterative process that creates descriptive and predictive models by uncovering
    previously unknown patterns and trends in a large quantity of data. This exercise
    is executed to support decision making. It is basically a subset of business analytics
    and is similar to experimental research.  Origins of data mining can be found
    in statistics and databases. ML, on the other hand, works with algorithms that
    improve automatically via experience they gain out of data. In other words, in
    machine learning, we discover new algorithms from experience. These algorithms
    of ML can extract information automatically, but the source used for machine learning
    is also data. It involves two kinds of data: one is test data and the second is
    the training data. Data mining techniques are commonly used in machine learning
    and along with the learning algorithms it is used to build models of what is happening
    behind the scenes to predict the outcome of the future.


    What is data mining and what is the relationship between ML and data mining? Data
    Mining means extracting knowledge out of a big amount of data. It was introduced
    in 1930 and at first it was referred to as knowledge discovery in database. Data
    mining is utilized to get rules out of existing data. Its origins lie in conventional
    databases having unstructured data. It is implemented where you can develop your
    own models and the data mining techniques are used. It is more natural and involves
    more involvement of human beings. They are used in cluster analysis. Data mining
    is abstracted from data warehousing. It is more of a research using methods similar
    to ML but is applied in limited sectors.


    Data Mining Techniques


    The specialists working in the field of data mining rely on techniques and intersection
    of statistics, database management, and machine learning. They have dedicated
    their careers to understanding what conclusions are to be drawn from a huge amount
    of information. What are the techniques used for turning this into reality? Data
    mining is effective when it draws on some of these techniques for their analysis.


    1.  Tracking Pattern: One of the fundamental techniques used in data mining is
    learning to recognize patterns in the data sets. Normally this is an aberration
    in the data that is happening at some interval or a flaw or an ebb in some variables
    over a period of time. For example, you may observe that sale of certain product
    spike up immediately before holidays. Or you may notice that warm weather drives
    people to your site. 


    2.  Classification: It is a more complex data mining technique that asks you to
    collect different attributes together in discernable categories that can be later
    used to arrive at further conclusions or serve in some other function. For example,
    in case you are evaluating the data on independent client''s financial background
    and purchase history you may be able to classify the individuals as high, medium
    or low-risk candidates for credit. You can then use the classifications to learn
    more about the clients.


    3.  Association: This is related more to tracking patterns, however, it is more
    specifically involved in the dependently linked variables. In the case of an association,
    you look for specific attributes or events that are correlated to other attributes
    or events. For example, you may notice that when your customer purchases some
    specific item they also buy another related item. This sequence of events is used
    to populate the "people also bought" section in the online store.


    4.  Outlier Detection: In some cases, just identifying the overreaching pattern
    cannot give you a clear understanding of the data set. You are also required to
    understand the anomalies, also called outliers in the data. For example, your
    buyers are almost exclusively male, however, during a single week in July there
    is a sudden rise in female buyers. You may want to investigate the reason for
    the event and find out what drove the sales so, you can either replicate it or
    understand the behavior of your audience better.


    5.  Clustering: This is similar to classification, however, involves grouping
    of chunks of data together which is similar. For example, you may select to cluster
    different demographics of the customers in various packets based on how much extra
    income they earn or how often they are shopping at the online store.


    6.  Regression: Regression is used basically as a form of modeling and planning.
    It is used to find out the chances of presence of certain variables because some
    other variables are there. For example, you may use this to project some price
    based on factors such as consumer demand, competition, and availability. More
    specifically, the main focus of regression is in helping you uncover exact relationships
    between two or more variables inside a specific data set.


    7.  Prediction: It is easily one of the most valuable data mining techniques used.
    This is because it is used for predicting the kind of data you will see in future.
    In some cases, just by understanding and recognizing the historical trends we
    can chart an accurate prediction of what will happen in the future. For example,
    we can see the credit history of clients and their past buys to predict whether
    there will be a credit risk in future in case a loan is extended.


