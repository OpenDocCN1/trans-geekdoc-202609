- raw: 'b. Consider new Submarkets: Once you have all the insight from the collected
    data you can begin creating new submarkets for your products and services. This
    doesn’t mean that you need to change the brand entirely, perhaps you just need
    to modify whom you are selling your product to. For example, in case you are currently
    selling custom signage for the birthday parties and you find out that there is
    a massive demand for similar products for weddings, you may wish to tweak the
    marketing strategy a little to target engaged couples and perhaps create a new
    line for them. The overall target is to look for opportunities in the niche and
    serve the new audience with your products and services.


    c. Removing the Hurdles:


    The collected data will also reveal the possible hurdles potential clients are
    facing in the sales process. This is the time to address these issues. Are your
    customers getting stuck with the product items in the cart? How can you make them
    complete the purchase? One of the examples is Pura Vida bracelets. The company
    promotes the products via content on Facebook and they recently offered a time-sensitive
    discount for the fan page to motivate the shoppers.


