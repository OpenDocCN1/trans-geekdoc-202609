  trans: "\n\n# BPR（业务流程重组）\n\nBPR（业务流程重组）曾一度成为公司管理层的热门追捧对象。组织们试图重塑其运营流程以实现更高的效率。与所有潮流一样，这更多是停留在口头上，实际行动很少。然而，随着业务流程随时间发展，这一理念并未失去其公信力。随着条件的变化，组织不断采纳并叠加新的流程。最终，你将得到一个由委员会设计的、难以运行的复杂流程。然而，通过真正的重组，组织可以剔除业务运行中浪费的流程，开发出更好、更有效的流程。在重组过程中，请记住要让一线员工参与进来。他们才是真正了解事情如何运作的人，甚至可能对如何改进提出建设性意见。\n\
    \n# 调研\n\n开展正确的调研对于预测产品的未来至关重要。有多种方法可用于研究产品趋势。\n\n1. **社交媒体**：时刻关注社交媒体页面上出现的趋势。你会发现一些人以特定方式行事和沟通，并对某些购买选项做出决定。一个例子是人们在\
    \ FB 墙上到处发布观点、内容或网页链接。不同平台上创建了一些特殊的社交群组，它们是特定产品或行业的活跃追随者。\n\n2. **产品追踪软件**：在更准确地预测产品趋势之前，你还需要对当前产品销售进行一些调研。例如，你可以通过在\
    \ `Trendster` 中输入 ASIN 轻松查看该 ASIN 的表现。将你找到的统计数据与洞察相结合，以加深对市场行为的理解。\n\n当你浏览完所有这些资源后，你将收集到进入下一步所需的必要信息。\n\
    \n# 区分真实趋势与短暂狂热\n\n重要的是要记住，你试图预测的是产品趋势，而非冲击市场的短暂狂热。趋势可以持续数年甚至数十年，而狂热顶多只能维持一个季节。它会消退，如果你考虑某些因素，就很容易识别出狂热。真正的趋势必须具备以下特征：\n\
    \n*   **内在实用性**：该特定商品是否具有实用目的？还是说它依赖特定环境才能体现其用处？\n*   **长期价值**：几年后人们还会喜欢这款产品吗？它能经受住季节更替的考验吗？\n\
    *   **能否与其他趋势融合？**：在更广泛的行业背景下使用它是否合理？如前所述，趋势并非孤立存在。一个例子是阿萨伊莓，由于其作为有机超级水果的品质，它在过去十年中大受欢迎。但它口感也很好。因此，阿萨伊莓趋势与新奇、健康和意识觉醒等其他趋势相契合。\n\
    \n能够预测产品趋势意味着比竞争对手领先一步。它为你提供了一个无价的机会，推出全新产品抢占市场。遵循这些步骤能提供极佳的洞察，从而优化你对市场及其变化的理解。当你发现一个趋势时，要研究它以确保它不仅仅是狂热，并开展调研。许多卖家犯的错误是假设：仅仅因为产品当下流行，它就会持续畅销。但要确定你找到的是真正的趋势，你可能需要查看该类别中的其他产品及其当前表现。快速的在线搜索可以揭示特定产品销售的关键信息。这有助于你对趋势得出准确的结论。\n\
    \n# 数据驱动策略\n\n为确保市场部门有效助力业务，你需要一个可定制的数据驱动策略。数据揭示了业务各部分的优势和劣势，从而让你能做出战略决策，制定成功的营销策略。大多数营销人员认为数据是任何公司最未被充分利用的资产。那么，如何在你的业务中融入数据驱动营销并开始享受其红利？以下是一些步骤，可确保你有效利用数据来运行营销策略。\n\
    \n1. **确定目标**：在开始数据收集之前，有一个重要的步骤，即明确哪些数据值得收集。决定哪种数据会对营销策略产生积极影响。舍弃那些无法增加策略有效性的数据，专注于收集关键\
    \ KPI 周围的数据，这些数据能真正推动业务进展。\n\n2. **组建团队**：在开始分析数据之前，组建一个处理数据的团队至关重要。团队必须包含来自不同部门和跨学科领域的成员。Richard\
    \ Baystom 在 Effin Amazing 上建议，这并不意味着让 IT 部门的人和销售部门的人凑在一起，只是收集经理们能腾得出的人。这意味着你要找到那些愿意超越其专业领域和知识范围的人。例如，你需要愿意学习营销的数据科学家，或愿意学习销售的\
    \ IT 人员。通过安排有针对性的频繁会议来优先促进这些人的协作至关重要。在会议上，每个人分享想法和信息，并在团队成功时共享荣誉。\n\n3. **收集数据**：当你准备好开始收集数据时，需要确保将其集中在一个地方以便于分析。考虑收集以下类型的数据：\n\
    \n*   竞争对手\n*   目标市场\n*   营销\n*   社交媒体分析（展示量、点击率、转化率等）\n*   客户数据，包括个人信息、交易数据、在线活动和社交网络活动\n\
    *   定性数据和潜在客户数据\n\n还有更多种类的数据。你可以从询问团队的不同成员他们准备和使用哪种数据开始，并从其他部门收集所有能获取的信息。Jim Bergeson\
    \ 在一篇文章中指出，数据有时隐藏在公司最内部的资源中，可能掌握在供应商、经销商或转售商手中，可能在销售人员手中，甚至可能被锁在 IT 部门的保险库里。\n\
    \n完成这种数据探索后，你将了解客户生命周期所有阶段发生的情况，并获得诸如销售点问题、投诉或服务电话、推荐、后续购买和在线推荐等信息。\n\n4. **评估数据并采取行动**：根据\
    \ KPI 评估收集到的数据，并开始利用这些数据驱动营销策略。\n\n    a. **优化内容营销策略**：你可能已经在使用内容营销策略来吸引和吸引受众。但有时内容背后没有清晰的策略，或者你不清楚试图触达谁。然而，一旦你拥有了做出明智决策的数据，你就走在了正轨上。你也许可以将销售和营销策略结合起来赚取更多利润。你也可以尝试不同类型的内容，如\
    \ GIF、图片和视频。如果你已经在定期发布优质内容，这一步应该不成问题。然而，不要忘记最重要的部分，那就是互动。当你提供客户想要的东西时，他们更有可能参与到内容中。这需要一些试错，但数据将帮助你确定吸引受众的最佳方式。\n\
    \n"
