- raw: "However, there are a host of questions raised about ethics in relation to\
    \ machine learning. Systems that are trained on data sets with biases might lead\
    \ to digitalization of cultural prejudices. For example, using data from a job\
    \ hiring firm with racist policies will lead to machine learning systems duplicating\
    \ the bias during the selection of applicants. Collecting \"responsible data\"\
    \ and proper documentation of rules for algorithms to be used by systems has become\
    \ significant. Even the languages contain biases and ML will have to learn them.\
    \ Healthcare professionals developing the machines for generating income rather\
    \ than serving people is another concern. There are some shining advantages as\
    \ well. As AI will increase productivity in many jobs, although lower and middle-level\
    \ positions may be eliminated. However, several new positions with highly skilled,\
    \ medium skilled and even low skilled range of people will be required.\n\nMachine\
