  trans: '


    # 智能投顾


    智能投顾是一个几年前还鲜为人知、如今却在金融界普遍使用的术语。然而，这个术语略显误导，因为它根本不涉及任何机器人。相反，智能投顾（如 Betterment
    或 Wealthfront）是基于机器学习的算法，旨在根据用户的目标和风险承受能力来构建其金融投资组合。例如，用户输入的目标是在 65 岁退休时拥有 300
    万美元的储蓄。他们还会输入自己的年龄、当前财务状况和收入。


    更准确地说，这位“顾问”应被称为“配置器”，它将投资分散到各个资产类别和金融工具中，以实现用户的目标。顾问系统随后会根据用户目标的变动以及实际的市场变化进行校准，从而为用户目标找到最佳匹配。它们在那些不需要实体顾问也能对投资感到放心、以及那些无力支付人工顾问费用的消费者中获得了极大的重视。


    ## 2. 算法交易


    算法交易可追溯至 20 世纪 70 年代，也称为自动化交易系统。它利用复杂的 AI 系统做出极高速度的交易决策。算法系统一天内可进行数千甚至数百万笔交易。因此使用了
    HFT（高频交易）这一术语，它是算法交易的一部分。大多数金融机构和对冲基金不对外披露其用于交易的 AI 方法。不过，人们认为深度学习和机器学习在交易决策中扮演着日益重要的角色。在股票交易中使用机器学习存在一些显著的局限性。


    ## 3. 欺诈检测


    系统可以通过机器学习检测异常行为或独特活动，并将其标记提交给安全部门。该系统的主要挑战在于避免误报，即在实际上不存在风险的情况下却将其标记为风险。安全漏洞的形式多种多样，因此真正的学习系统将在未来
    5 到 10 年内成为必需品。


    ## 4. 保险或贷款承销


    承销可被描述为机器学习在金融领域的**完美工作**，但市场上普遍担心机器会取代当今存在的许多承销职位。这在大型组织中尤为突出，例如大型银行和公众保险公司。机器学习算法可以在数百万消费者数据实例（如工作、年龄、婚姻状况等）上进行训练。它也可用于保险理赔和金融借贷，以核查某人是否违约、是否按时还款或是否卷入过车祸。


    可以使用算法评估和持续分析潜在趋势，以检测影响未来放贷和保险的趋势。例如，你可以发现越来越多的年轻人是否卷入车祸。又或者，在过去 10 年中，特定人群中的违约率是否在上升？这些查询的结果对组织具有极高的产出价值。然而，目前这仅限于拥有资源聘请数据科学家、并掌握海量数据（过往和当前）以训练算法的大公司。


    # 机器学习与加密货币


    近年来，AI 和机器学习辅助交易引起了巨大的兴趣。有一种假设认为，加密货币市场的低效性可被利用以创造巨额利润。在最先进的机器学习算法辅助下，常规交易策略的能力远超标准基准。一些非平凡但实际简单的算法，可以帮助预测加密货币市场的短期演变。


    机器学习技术在股市预测中取得的成功表明，这些方法也可有效用于预测加密货币价格。但将机器学习算法应用于加密货币市场，目前主要局限于使用贝叶斯神经网络、随机森林、长短期记忆神经网络及其他一些算法来分析比特币价格。这些研究在一定程度上预测了比特币的价格波动，并得出结论：基于神经网络的算法能取得最佳结果。强化深度学习在一年内预测
    12 种不同加密货币价格时，表现优于“买入并持有”策略。也有其他尝试利用机器学习预测比特币以外的加密货币价格，但它们来自非学术资源，且未提供结果对比。


    # 机器学习日内交易


    证券投机称为日内交易。更具体地说，它指在同一交易日内买卖金融工具。严格来说，它是发生在单日内的交易。这意味着当市场当日收盘时，所有头寸都会平仓。日内交易者寻找具有有利条件的股票的进场和出场位置。这些条件产生的多项短期利润可累积成巨大的收益。


    如果市场上有人能识别出有利的模式，那么我们就可以训练机器执行类似的操作，甚至达到超人类水平。这是利用机器学习进行日内交易的目标。但首先，我们需要确定日内交易者用于发出市场进场信号的策略。该技术分为两个过程：高层模式描述和机器学习。


    在第一个过程中，识别进场语义，这可能涉及数百种预定义策略。这是通过使用强大且高度可扩展的模式匹配器（如 `Apache Flink`）来完成的。一旦模式被触发，我们就可以回溯历史数据，找出过去模式被触发且
    10 或 20 分钟后出现结果价格的实例。我们可以为算法生成训练样本，利用机器学习基于过去的进场情况创建概率分布。


    # 结论


    由于机器学习的独特优势——尤其是在小型设备上——它显然正成为企业的宠儿。从 RPA 功能到移动自动化，一切都正成为掌上现实，将未来置于你的掌心。如今，即使是小型企业也能像大公司一样利用机器学习。它可以以具有成本效益的方式使用。例如，一些公司利用
    AI 改善客户关系。这在降低成本的同时，为其公司提供了定制化的协助。它也可用于培训员工和以具有成本效益的方式改进预测。例如，教育机构 Udacity 通过向销售团队引入聊天机器人，将销售额提高了
    50%。数据、算法和基础设施的进步以及获取它们所需成本的降低，使得如今小型企业也能负担得起这些技术。


    '
