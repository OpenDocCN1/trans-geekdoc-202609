    \ 2: Machine Learning and Data Mining\n\nData Mining Techniques\n\nBusiness Process\
    \ Optimization\n\nExecuting the Business Process Optimization\n\nAutomation\n\n\
    Adopting Technology and Total Process Change\n\nOptimizing Business Resources\n\
    \nOptimizing Business Operations\n\nIntroducing Customer Focused Thinking\n\n\
    Differentiate Between Real Trends and Momentary Crazes\n\nData-Driven Strategy\n\
    \nTargeting and Connecting with Potential Customers\n\nChapter 3: Machine Learning\
    \ for Marketing\n\nApplications for Marketing\n\nChapter 4: Machine Learning for\
    \ Finance\n\nCurrent Financial Applications\n\nMachine Learning and Cryptocurrencies\n\
    \nDay Trading with Machine Learning\n\nConclusion\n\nReferences\n\nIntroduction\n\
    \nMachine learning has changed the computing world through its digital interactions\
    \ because it is a form of artificial intelligence.  Machine learning begins with\
    \ data or observations, like instructions or direct experience, and then looks\
    \ for patterns in the data that allow the machine to make better decisions based\
    \ on the examples that have been provided. The main aim of machine learning is\
    \ to allow the machine to learn automatically without any human assistance or\
    \ intervention and learn to adjust accordingly.\n\nArthur Samuel coined the term\
    \ machine learning in the year 1959. However, it was Tom Mitchell who provided\
    \ a more widely quoted and more formal definition of the various algorithms studied\
    \ under the field of machine learning. This definition is: \"A computer program\
    \ is said to learn from experience E with respect to some class of tasks T and\
    \ performance measure P if its performance at tasks in T, as measured by P, improves\
    \ with experience E.\" \n\nThis definition basically offers a fundamental operational\
    \ version of the term instead of defining it cognitively. Alan Turing proposed\
    \ in his papers the query \"Can machines think?\" to be replaced by \"Can a machine\
    \ do what we can do?\". Humans can do certain things as thinking entities. The\
    \ Turing proposal exposes the various characteristics that may be possessed by\
    \ machines that think.\n\nAllowing computers to learn from their experience means\
    \ a lot of automation and data analysis of analytical model building by using\
    \ several algorithms.  The machine learning empowers the machines to search and\
    \ identify concealed insights, without being automated, to look for them when\
    \ exposed to new data. Although the technology is not that novel, it is gaining\
    \ momentum as there are a number of things to learn and know about machine learning,\
    \ often referred to as ML. The various factors responsible for the resurgent interest\
    \ in ML are affordable computational processing, growing volumes of data sets\
    \ and affordable storage options for data. Modern-day companies can make an educated\
    \ decision about developing analytical models by using ML algorithms as they uncover\
    \ trends, patterns, and connections with minimal human interference.\n\nMachine\
    \ Learning Evolution\n\nMachine learning in the modern world is different than\
    \ it used to be. This is mainly due to the emergence of new technologies. In earlier\
    \ times, the technology gained momentum due to the pattern recognition and the\
    \ point that the computer didn’t have to be programmed to learn and work on certain\
    \ tasks. There were many scientists who were keen on artificial intelligence who\
    \ investigated this aspect further to experiment with whether or not computers\
    \ could learn from the data. The focus was not on iterative learning, as the computers\
    \ began to adapt to the new data they were being given over a time period. Built\
    \ on the various patterns and computations they had made in the past, the computers\
    \ learned to make decisions that were similar to the ones made in the past in\
    \ the same or similar situations. This capability of the machines to learn from\
    \ existing patterns is getting massive momentum these days.\n\nPeople are now\
    \ sitting up and taking note of the fact that machines are able to apply difficult\
    \ mathematical calculations to different areas, such as handling large data, and\
    \ at a much faster rate. Look at the example of the Google car for instance. It\
    \ is built on machine learning principles. Another significant use of ML can be\
    \ found in the recommendations used by companies such as Amazon and Netflix, which\
    \ are an examples of machine learning in our daily lives. ML can also be pooled\
    \ with the creation of linguistic rules. Twitter currently implements this application,\
    \ so that you will know what clients are saying about you. More significantly,\
    \ machine learning is being used to detect fraud in various industrial sectors.\n\
    \nGone are the days in which the programmers would tell the computer how to resolve\
    \ an issue at hand. We have reached an era when the machines are left to resolve\
    \ the issues on their own. They identify the pattern from each data set. Analyzing\
    \ the hidden patterns and trends makes it simple to guess the future problems\
    \ as well and also stop from them re-occurring. The machine learning algorithms\
    \ normally follow a certain kind of data and they use the patterns in the data\
    \ to answer the queries. For example, you show the machine a series of photographs\
    \ of dogs and say, \"This is a dog.\" and later show the machine other photos\
    \ saying, \"This is not a dog.\" Now if you show photographs to the computer it\
    \ will be trying to identify whether or not the photographs are that of a dog.\
    \ However, every correct or incorrect guess made by the machine is stored in its\
    \ memory. This makes the machine smarter in the long run and enriches its knowledge\
    \ over a time period.\n\nThe Significance of Machine Learning in the Modern Business\
    \ World"
