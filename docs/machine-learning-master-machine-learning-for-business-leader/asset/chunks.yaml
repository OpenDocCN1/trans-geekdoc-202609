    predict the outcome of the future.


    ## What is Data Mining and What is the Relationship Between ML and Data Mining?


    Data Mining means extracting knowledge out of a big amount of data. It was introduced
    in 1930 and at first was referred to as knowledge discovery in databases. Data
    mining is utilized to get rules out of existing data. Its origins lie in conventional
    databases having unstructured data. It is implemented where you can develop your
    own models and the data mining techniques are used. It is more natural and involves
    more involvement of human beings. They are used in cluster analysis. Data mining
    is abstracted from data warehousing. It is more of a research using methods similar
    to ML but is applied in limited sectors.


    ## Data Mining Techniques


    The specialists working in the field of data mining rely on techniques at the
    intersection of statistics, database management, and machine learning. They have
    dedicated their careers to understanding what conclusions are to be drawn from
    a huge amount of information. What are the techniques used for turning this into
    reality? Data mining is effective when it draws on some of these techniques for
    their analysis.


    1.  **Tracking Pattern**: One of the fundamental techniques used in data mining
    is learning to recognize patterns in the data sets. Normally this is an aberration
    in the data that is happening at some interval or a flaw or an ebb in some variables
    over a period of time. For example, you may observe that sales of a certain product
    spike immediately before holidays. Or you may notice that warm weather drives
    people to your site.


    2.  **Classification**: This is a more complex data mining technique that asks
    you to collect different attributes together in discernible categories that can
    be later used to arrive at further conclusions or serve in some other function.
    For example, if you are evaluating data on independent clients'' financial backgrounds
    and purchase histories, you may be able to classify individuals as high, medium,
    or low-risk candidates for credit. You can then use the classifications to learn
    more about the clients.


    3.  **Association**: This is related more to tracking patterns; however, it is
    more specifically involved in dependently linked variables. In the case of an
    association, you look for specific attributes or events that are correlated to
    other attributes or events. For example, you may notice that when your customer
    purchases a specific item, they also buy another related item. This sequence of
    events is used to populate the "people also bought" section in the online store.


    4.  **Outlier Detection**: In some cases, just identifying the overarching pattern
    cannot give you a clear understanding of the data set. You are also required to
    understand the anomalies, also called outliers in the data. For example, your
    buyers are almost exclusively male; however, during a single week in July, there
    is a sudden rise in female buyers. You may want to investigate the reason for
    the event and find out what drove the sales so you can either replicate it or
    understand the behavior of your audience better.


    5.  **Clustering**: This is similar to classification; however, it involves grouping
    chunks of data together that are similar. For example, you may select to cluster
    different demographics of customers into various packets based on how much disposable
    income they earn or how often they shop at the online store.


    6.  **Regression**: Regression is used basically as a form of modeling and planning.
    It is used to find out the likelihood of the presence of certain variables because
    other variables are present. For example, you may use this to project a price
    based on factors such as consumer demand, competition, and availability. More
    specifically, the main focus of regression is in helping you uncover exact relationships
    between two or more variables inside a specific data set.


    7.  **Prediction**: This is easily one of the most valuable data mining techniques
    used. This is because it is used for predicting the kind of data you will see
    in the future. In some cases, just by understanding and recognizing historical
    trends, we can chart an accurate prediction of what will happen in the future.
    For example, we can review the credit history of clients and their past purchases
    to predict whether there will be a credit risk in the future if a loan is extended.


    ## Business Process Optimization

