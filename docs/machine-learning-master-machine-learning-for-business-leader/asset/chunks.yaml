- raw: 'Robo-Advisor is a term not heard of a few years ago but is now used commonly
    in the financial world. The term, however, is a little misleading as it doesn’t
    involve any robots at all. Instead, the Robo-advisors (e.g. Betterment or Wealthfront)
    are algorithms based on ML and built to shape the financial portfolio of a user
    including their goals and risk tolerance. For example, users enter goals such
    as retiring at the age of 65 with $3,000,000 in saving. They also enter their
    age, current financial status, and income.


    The advisor who can be more accurately referred to as an allocator then spends
    the investments across assets classes and financial instruments to arrive at the
    user''s goals. The advisor system then calibrates to the changes in user''s goals
    and to the actual changes in the market thereby finding the best fit for the user''s
    goals. They have gained significant importance among consumers that do not need
    physical advisors to feel comfortable in investments and those who are incapable
    of paying fees to human advisors.


    2\. Trading with Algorithm:


    Algorithm trading goes as far back as the 1970s and is also called automated trading
    systems. It makes use of difficult AI systems to agree on very fast trading decisions.
    The algorithmic systems make thousands or millions of trades in one day. Therefore
    the term HFT (High-Frequency Trading) is used and it is a part of algorithmic
    trading. Most of the financial institutions and hedge funds don’t disclose their
    AI approach they are using for trading. However, it is believed that deep learning
    and ML are playing a rising important role in trading decisions. There are some
    exceptional limitations to the use of ML in trading stocks.


    3\. Detecting Fraud:


    The system can detect abnormal behavior or unique activities by using machine
    learning and flag them to the security department. The main challenge for this
    system is to avoid false positives and situations where risks get flagged when
    actually there aren’t any. There are a high number of ways in which security can
    get breached, so genuine learning systems will become a necessity in coming 5
    to 10 years.


    4\. Insurance or Loan Underwriting:


    Underwriting can be described as the perfect job for ML in finance, but there
    is a lot of worry in the market that the machines will replace many of underwriting
    positions in existence today. This is especially a concern in large organizations,
    such as large banks and public limited insurance companies. Machine learning algorithms
    can be trained on millions of instances of consumer data such as jobs, age, marital
    status etc. It can also be used for insurance results and financial lending in
    checking whether a person defaulted or not or is paying his loans on time or has
    been involved in a car accident.


    The underlying trends can be assessed by using algorithms and analyzed constantly
    to detect trends that influence lending and insurance for the future. For example,
    you can find whether more and more youngsters are getting into car accidents.
    Or is there an increasing rate of defaults among a specific demography in the
    last 10 years? The results of these queries have a great yield for the organizations.
    However, this is limited at the moment to large companies having the resources
    to get data scientists and possessing the massive amount of data (past and present)
    to train the algorithms.


    Machine Learning and Cryptocurrencies


    The AI and machine learning assisted trading has attracted huge interest in the
    last few years. There is a hypothesis that the inefficiencies in the cryptocurrency
    markets can be used to create large profits. The normal trading strategies helped
    by the state of the art ML algorithms are far more capable than the standard benchmarks.
    Some nontrivial, but actually simple algorithms, can aid in anticipating the short-term
    evolution of cryptocurrencies market.


    The success that ML techniques had with the predictions of stock markets suggested
    that the methods could be used effectively to predict the cryptocurrency prices
    as well. But applying the ML algorithm to the cryptocurrency market is limited
    mainly to analyzing the Bitcoin prices by using the Bayesian neural network, random
    forests, long and short-term memory neural networks and some other algorithms.
    These studies anticipated to a degree the price fluctuations of Bitcoin and concluded
    that the best results could be achieved by using algorithms that were based on
    neural networks. The reinforcement deep learning was able to beat the performance
    of buy and hold strategies in predicting the prices of 12 different cryptocurrencies
    over a period of one year. There were other attempts to use ML for predicting
    prices of cryptocurrencies other than Bitcoin however they came from non-academic
    resources and did not provide comparisons for the results.


    Day Trading with Machine Learning


    The speculation in securities is called day trading. More specifically it refers
    to buying and selling financial instruments on the same day of trading. Strictly
    speaking, it is a trading happening within a single day. It means that all positions
    get closed when the market is closed for the day. The day traders look at identifying
    the entry and exit positions on the stocks that have favorable conditions. These
    conditions yield several small term profits that can add up to big gains. 


    In case there are people in the market who can recognize favorable patterns in
    the market than we can train even a machine to perform similarly and even at superhuman
    levels. This is the goal of using machine learning for day trading. But first,
    we need to identify the strategies used by day traders to signal entry conditions
    in the market. The technique is split into two processes: a high-level pattern
    description and the second is machine learning.


    In the first process, identifying entry semantics, which occurs for possibly hundreds
    of predefined strategies. This is done by using robust and highly scalable pattern
    matchers, such as Apache Flink. Once a pattern has been triggered we can go through
    the historical data and find the instances in the past when patterns were triggered
    and there was the outcome price after 10 or 20 minutes. We can generate a training
    example for the algorithms where we use machine learning for creating probability
    distribution about the past entries.


    Conclusion


    Because of the unique benefits of machine learning - especially on small devices
    - it is clearly becoming a favorite with businesses. From RPA functions to mobile
    automation it is all becoming a handheld reality bringing the future into the
    palm of your hands. Nowadays even smaller businesses can leverage ML like the
    bigger boys. It can be used in cost-effective ways. For example, some companies
    use AI for improving customer relations. It reduces the costs and at the same
    time provides customized assistance to their companies. It can also be utilized
    to train the workforce and to improve forecasting cost-effectively. For example,
    Udacity, which is an educational institution, enhanced their sales by 50% by introducing
    chatbots to their sales teams. The advancements in data, algorithms and infrastructure
    and the costs required for getting them has decreased their overall costing and
    nowadays smaller businesses can afford them. '
