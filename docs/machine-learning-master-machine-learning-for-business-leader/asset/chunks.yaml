    ## 改进预测


    无论销售产品/服务、采购管理库存、控制供应链还是合理配置人员，所有组织都在预测需求。多家公司预测不佳，意味着无法满足市场需求，或在维持过剩产能上浪费金钱和精力。据
    NCMM 白皮书，波本威士忌酿造商 `Maker''s Mark` 因预测失准曾宣布须兑水稀释产品。因无法满足客户需求，客户愤怒不已。庆幸的是，中型企业可用具备丰富知识的复杂工具改进各类预测。


    # 引入以客户为中心的思维


    管理团队总爱说自家组织多么“以客户为中心”。结合你作为客户的体验，思考有多少组织真正将客户放首位。任何企业的以客户为中心方法都极其高效。归根结底，是客户及其对企业的认知和态度决定企业命运。你需聚焦战略和运营以拥抱客户、让他们满意愉悦。若能做到，你就走在商业成功的快车道上。


    # 传统的 BPR（业务流程重组）


    '
