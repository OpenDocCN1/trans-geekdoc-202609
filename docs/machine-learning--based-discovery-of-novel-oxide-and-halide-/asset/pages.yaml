    # ABSTRACT


    In this study, the novel oxide and halide perovskite compounds in the form of
    single and double perovskite are explored by using machine learning, density functional
    theory databases, and experimental databases. The important features that define
    the formability and stability of oxide perovskite and halide perovskite compounds
    are extracted. Using these datasets as training datasets, very precise machine
    learning classification models are prepared using random forest classifiers for
    formability and stability. Subsequently, these results are cross-validated to
    screen the potential novel compounds. Further, the hierarchical clustering technique
    is used to understand the effect of multi-collinearity among selected features
    and also to analyze their effect on perovskite formability and stability. Our
    machine learning model predicts 591 novel perovskite compounds which are formable
    as well as stable. Further, the charge capacity of these novel compounds is also
    analyzed for battery applications.


    # 1. Introduction


    The global energy supply is increasing at an alarming rate driving an overwhelming
    exploitation of fossil fuels. The development of clean energy generation and storage
    is necessary to combat global warming and meet the energy demand. Several materials
    and techniques have been conceived for energy conversion and energy storage applications.
    Numerous studies have been performed to harvest solar energy and thermal energy
    [1–3].


    There is an ever-increasing demand for high-performing batteries in electric transport
    vehicles and light-duty electric vehicles. Along with energy generation, there
    is a continuously growing demand for energy storage materials [4, 5] to supply
    electric vehicles and various electronic devices. The performance of a battery
    depends upon the materials of the electrode and in-service load parameters. The
    key features of a classic battery are charge capacity, high energy density, long
    life, environment friendly, low cost, and compactness.


    The perovskite materials are suitable for the energy domain due to their excellent
    electronic, optical [6], piezoelectric [7], and magnetic properties. Hence perovskites
    continue to attract because of their vast range of properties. While several studies
    have been performed to


    harvest solar energy, thermal energy [8–11–14] using perovskite materials, the
    oxide and halide perovskite are attracting the science community especially for
    energy conservation and storage applications [15].


    The oxide perovskite and halide perovskite can be used as promising electrode
    materials due to their higher conductivity and catalytic activity [16]. In oxide
    perovskites, the atom at the A-site controls the thermodynamic stability, and
    the atom at the B-site controls the electrochemical behavior. The thermodynamic
    stability refers to the propensity to maintain crystal structure under temperature
    and pressure variations [17]. This can be realized by estimating formation energy
    [18] and phase diagram [19]. The double perovskites (AA''BB''O6) offer critical
    application because of their excellent electronic and ionic conductivity as well
    as a higher rate of oxygen ion diffusion. Their ordered arrangement results improved
    cyclic stability as a super capacitive phenomenon for storage devices [20].


    The halide perovskites exhibit very good semiconducting behavior and extraordinary
    physicochemical properties [20]. Because of their excellent properties like absorption
    coefficient, diffusion length, and tunable band gap, the halide perovskites have
    been extensively used for solar cells and LEDs [15,21–23]. The perovskite crystal
    lattices are of ABX3 stoichiometry [24], whereas the A cation sites are mainly


