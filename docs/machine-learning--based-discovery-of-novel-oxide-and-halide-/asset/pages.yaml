    # 2.1. Formability and stability databases


    Formability training dataset contains 1962 experimentally known oxides, fluoride,
    and halide perovskites of the form AB O3, AA''BB'' O6 and AA''BB'' X6, respectively.
    The halide X is composed of Cl and Br in this dataset and it is composed of 1453
    perovskites and 509 non-perovskites. The dataset is prepared based on literature
    like Zhang et al. [34], Balacharan et al. [38], Vasala et al. [39], Talapatra
    et al. [24], Li et al. [40], Li et al. [41] and an existing database like Inorganic
    Crystal Structure Database (ICSD). The stability training database is composed
    of all possible compositions i.e. AB O3, AA''BB'' O6, AA'' B2O6 and AB X3, AA''BB''
    X6, AA''B2 X6, A2BB'' X6 compounds. The total number of oxides, fluoride, and
    halides is 4075 compounds. Of these, 2053 compounds are thermodynamically stable
    and 2022 compounds are thermodynamically unstable. Figure 2 presents the distribution
    of single and double perovskites that comprise oxide perovskite, fluoride perovskite,
    chloride perovskite, and bromide perovskite. Figures 2a and 2b show the distributions
    of various types of compounds within the formability database and stability database
    of perovskite materials, respectively. In


