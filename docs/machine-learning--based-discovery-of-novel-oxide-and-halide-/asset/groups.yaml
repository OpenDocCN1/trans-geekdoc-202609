    # 5. Results and discussion


    # 5.1. Predicted formable and stable perovskites


    The formability and stability classification models are applied to the new dataset
    of oxide and halide perovskite dataset ($D_p$). This dataset $D_p$ consists of
    18,248,197 distinct compounds. The formability classification model predicted
    475024 compounds as new formable compounds of the $D_p$ dataset, whereas the stability
    classification model predicted 194005 compounds as new stable compounds. Figure
    8a. shows the predicted compounds that are likely to be formable along with the
    compounds that are stable with respect to the cutoff probabilities. The final
    compounds that are formable as well as stable simultaneously with cutoff probabilities
    are shown in Figure 8b. The Y-axis in Figure 8 is non-linear since the variation
    in the number of compounds is large with respect to change in cutoff probability.
    A final compound is prepared using a cutoff probability of 0.75, that is the final
    potential candidates that are both formable and stable with a probability of 75
    %. These 591 compounds are shortlisted as future oxide and halide perovskites
    for experimental realization. Further, these shortlisted compounds are tested
    theoretically for the battery applications as described in the following.


    ![](img/0947dcc86f17166636a5ebab0393245e_9_2.png)


    Fig. 9. Stable and unstable compounds with their theoretical charge capacity.


    # 5.2. Potential candidate for battery applications


    A total of 591 novel oxide perovskite and halide perovskite compounds are found
    using the ML model. The final list of compounds comprises 247 oxide perovskite,
    19 fluoride perovskite, 132 chloride perovskite, and 190 bromide perovskite. For
    battery application, the charge capacity [60] is estimated using the formula given
    by


    ```

    $Q = nF/(3600 * Mw)mAhg^{-1}$

    ```


    where $F$ is the *Faraday constant*, $n$ is the number of charge carriers and
    $Mw$ is the molecular weight of perovskite materials to be used in electrodes.
    Consider the following chemical equation:


    ```

    $LiTaO_3 \longrightarrow Li^+ + TaO_3 + 1e^-$

    ```


    The value of n will be (1Li+ ) 1 and molecular weight of LiTaO3 is 235.89


    gmol$^{-1}$. Hence using the above equation, the charge capacity will be 113.62
    mAhg$^{-1}$.


    We prepared a separate data frame to estimate the charge capacity of final compounds.
    The highest charge capacity is found in a fluoride perovskite in all halide perovskite.
    The charge capacity is 215.63 mAhg$^{-1}$ found in *TlBTeGeF*6 in double halide
    perovskites. In other halide perovskite, e.g. in chloride perovskites *TlBTeGeCl*6
    results in highest charge capacity around 170 mAhg$^{-1}$ and in bromide perovskites
    *ReVTeGeBr*6 results in 116 mAhg$^{-1}$. While in oxide perovskites *RbTe-GeO6*
    shows the highest charge capacity among all which is around 380 mAhg$^{-1}$. The
    charge capacity for all other compounds in the list of novel compounds may be
    found in Table F.1 of F.'
