    # Machine learning--based discovery of novel oxide and halide perovskites for
    energy storage


    Neelesh Gupta$^{a,b}$, Ravi Kumar$^{a,b}$, Alankar Alankar$^{b,c,d,*}$


    $^{a}$ Department of Metallurgical and Materials Engineering, Indian Institute
    of Technology Madras, Chennai 600036, India

    $^{b}$ Research Center on Ceramic Technologies for Futuristic Mobility, Indian
    Institute of Technology Madras, Chennai 600036, India

    $^{c}$ Department of Mechanical Engineering, Indian Institute of Technology Bombay,
    Powai, Mumbai 400076, India

    $^{d}$ Center for Machine Intelligence and Data Science (C-MInDS), Indian Institute
    of Technology Bombay, Powai, Mumbai 400076, India


    # ARTICLE INFO


    +   Keywords:

    +   Perovskite

    +   Formability

    +   Stability

    +   Machine Learning

    +   Energy Materials

    +   Materials Informatics


    # ABSTRACT


    In this study, the novel oxide and halide perovskite compounds in the form of
    single and double perovskite are explored by using machine learning, density functional
    theory databases, and experimental databases. The important features that define
    the formability and stability of oxide perovskite and halide perovskite compounds
    are extracted. Using these datasets as training datasets, very precise machine
    learning classification models are prepared using random forest classifiers for
    formability and stability. Subsequently, these results are cross-validated to
    screen the potential novel compounds. Further, the hierarchical clustering technique
    is used to understand the effect of multi-collinearity among selected features
    and also to analyze their effect on perovskite formability and stability. Our
    machine learning model predicts 591 novel perovskite compounds which are formable
    as well as stable. Further, the charge capacity of these novel compounds is also
    analyzed for battery applications.


    # 1. Introduction


    The global energy supply is increasing at an alarming rate driving an overwhelming
    exploitation of fossil fuels. The development of clean energy generation and storage
    is necessary to combat global warming and meet the energy demand. Several materials
    and techniques have been conceived for energy conversion and energy storage applications.
    Numerous studies have been performed to harvest solar energy and thermal energy
    [1–3].


    There is an ever-increasing demand for high-performing batteries in electric transport
    vehicles and light-duty electric vehicles. Along with energy generation, there
    is a continuously growing demand for energy storage materials [4, 5] to supply
    electric vehicles and various electronic devices. The performance of a battery
    depends upon the materials of the electrode and in-service load parameters. The
    key features of a classic battery are charge capacity, high energy density, long
    life, environment friendly, low cost, and compactness.


    The perovskite materials are suitable for the energy domain due to their excellent
    electronic, optical [6], piezoelectric [7], and magnetic properties. Hence perovskites
    continue to attract because of their vast range of properties. While several studies
    have been performed to


    harvest solar energy, thermal energy [8–11–14] using perovskite materials, the
    oxide and halide perovskite are attracting the science community especially for
    energy conservation and storage applications [15].


    The oxide perovskite and halide perovskite can be used as promising electrode
    materials due to their higher conductivity and catalytic activity [16]. In oxide
    perovskites, the atom at the A-site controls the thermodynamic stability, and
    the atom at the B-site controls the electrochemical behavior. The thermodynamic
    stability refers to the propensity to maintain crystal structure under temperature
    and pressure variations [17]. This can be realized by estimating formation energy
    [18] and phase diagram [19]. The double perovskites (AA''BB''O6) offer critical
    application because of their excellent electronic and ionic conductivity as well
    as a higher rate of oxygen ion diffusion. Their ordered arrangement results improved
    cyclic stability as a super capacitive phenomenon for storage devices [20].


    The halide perovskites exhibit very good semiconducting behavior and extraordinary
    physicochemical properties [20]. Because of their excellent properties like absorption
    coefficient, diffusion length, and tunable band gap, the halide perovskites have
    been extensively used for solar cells and LEDs [15,21–23]. The perovskite crystal
    lattices are of ABX3 stoichiometry [24], whereas the A cation sites are mainly


    * Corresponding author at: Research Center on Ceramic Technologies for Futuristic
    Mobility, Indian Institute of Technology Madras, Chennai 600036, India.

    E-mail addresses: er.neel.gupta@gmail.com (N. Gupta), nvrk@iitm.ac.in (R. Kumar),
    alankar.alankar@iitb.ac.in (A. Alankar).'
  - '[PAGE 1]


    alkaline-earth, alkalines, and lanthanides, the B cations are the metals with
    3d, 4d or 5d configuration and X is an oxygen and halogens (Cl, Br and I) etc,
    [25]. The perovskite crystal structures with the highest symmetry (aristotype)
    belong to \(Pm\bar{3}m\) cubic space group [26]. Several variations in the aristotype
    perovskites of \(ABX_3\) stoichiometry are formed when A and B cations are replaced
    by combinations of other cations, or while forming double perovskites or quadruple
    perovskite [27]. Further, the electronic and ionic conductivities and ion diffusion
    of halide perovskites along with their low cost production make them a suitable
    candidate for storage applications. The fluoride perovskites exhibit high redox
    potential and high power density [20,28]. Fluoride perovskites have the highest
    electronegative fluorine element along with impressive capacitive control. Hence
    the \(ABF_3\) perovskite is very popular in the research of new electrode materials
    for energy storage applications. The monometallic fluoride perovskite exhibits
    very good stability [20] in energy storage applications. Therefore it is important
    to explore new fluoride perovskites with improved crystallinity and higher electronic
    conductivity [29–31]. The existing oxide perovskites and halide perovskites are
    not good candidates for the next generation of electrode materials. This gap can
    be filled with novel perovskite structures with enhanced charge capacity and superconducting
    behavior. A few recently proposed novel perovskite structures can cover up to
    90 % of periodic table elements because of their physiochemical properties [20].


    Formability indicates the ease with which a material can be formed or characterized
    [24]. Formation of a material typically refers to the process by which a material
    is created or synthesized, either naturally or artificially. An \(ABX_3\) compound
    synthesized with a perovskite structure is considered “formable” while if it is
    synthesized with a non–perovskite structure, it is termed as “non-formable”. Formability
    of perovskite crystal structure can be rapidly estimated using the approach of
    descriptor based methodology that allows high-throughput screening of the materials.
    The tolerance factor t is found reasonably accurate to find the formability of
    perovskite cubic structure. The tolerance factor for a perovskite structure can
    be estimated using the ionic radii of each ion (coordination-dependent Shannon’s
    ionic radii) as given by


    \(t = (r_A + r_X) / \sqrt{2}(r_B + r_X),\) \newline (1)


    where \(r_A\), \(r_B\) and \(r_X\) are Shanon’s ionic radii of A cation, B cation
    and X anion, respectively. Based on recent empirical evidence, it is found that
    cubic perovskite compositions are formable if t is in the range of 0.9–1.0 [24].
    Further, the octahedral factor (\(\mu\)) is another remarkable descriptor for
    classifying perovskite and non-perovskite using the basic motif (octahedron \(BX_6\))
    of perovskite. It is defined as


    \(\mu = r_B/r_X.\) \newline (2)


    With the combination of \(t\) and \(\mu\), Li et al. [33] successfully classified
    perovskites and non-perovskites structures out of 197 known \(ABO_3\) compounds.
    Zhang et al. [34] also demarcated perovskites and non-perovskites structures from
    397 known \(ABO_3\) compounds. Sun et al. [35] give the relative stability prediction
    among any two perovskites with an accuracy of ~ 90 % using a stability descriptor
    (\(\mu + t)^n\). Further Filip and Giustino [36] suggest a new combination with
    addition of octahedral mismatch factor \(\mu_B\) for \(A_2BB''X_6\)-type perovskites
    and introduce a 3D map using (\(t\), \(\mu\), \(\bar{\mu}_B\)). The octahedral
    mismatch factor is given by


    \(\bar{\mu}_B = |r_B - r_{B''}| / 2r_X,\) \newline (3)


    where \(r_B\), \(r_{B''}\) and \(r_X\) are the Shanon’s ionic radii of B-cation,
    \(B''\) cation and X anion, respectively. The octahedral mismatch factor helps
    map \(A_2BB''X_6\) type perovskites. Filip and Giustino et al. [36] have generated
    a library of new hitherto unknown 94,232 formable perovskites with 80 % fidelity.
    Talapatra et al. [24] predicted 414 oxide perovskites using 28 elemental features
    along with (\(t\), \(\mu\), \(\bar{\mu}_B\)). Their predicted compositions are


    most promising for experimental synthesis as they are predicted from both formability
    and stability prediction models, simultaneously. The stability of perovskites
    refers to the thermodynamic stability of cubic perovskites [18].


    The formability and stability are the key features of new compounds. The formability
    of perovskites relies on various geometric features. On the other hand, stability
    is another essential feature that helps to understand the thermodynamic stability
    concerning the crystal structure of perovskites. With the study of the stability
    of perovskites, we can predict whether the crystal structure will decompose into
    some other phases or remain unchanged. The stability analysis can be performed
    using an energy convex hull. The energy convex hull is a linear combination of
    phases that are lower in energy than any other phase [18]. The phases of a compound
    that lie on the energy convex hull will be treated as thermodynamically stable
    and phases above the convex hull will be either meta-stable or unstable. The energy
    above the convex hull (\(\Delta E_h^{ABX_3}\)) of a compound \(ABX_3\) can be
    calculated with the help formation energy of the compound (\(E_f^{ABX_3}\)) and
    the convex hull energy of \(ABX_3\) composition (\(E_{ch}\)), given by


    \(\Delta E_h^{ABX_3} = E_f^{ABX_3} - E_{ch},\) \newline (4)


    where the formation energy of \(ABX_3\) can be calculated by the total energy
    of the compound and chemical potentials of individual elements A, B, and X (i.e.
    \(\mu_A\), \(\mu_B\) and \(3\mu_X\)) which is given by


    \(E_f^{ABX_3} = E^{ABX_3} - \mu_A - \mu_B - 3\mu_X,\) \newline (5)


    This approach is also applicable for double perovskites.


    Traditional approach to discovering new materials has been been based on tedious
    testing, characterization, and prior art. Density functional theory (DFT) can
    be used for predicting stability, electronic, and optical properties. However,
    DFT-based calculations are known to require expensive computation resources and
    are time-consuming. The literature about already synthesized materials, predicted
    but not synthesized materials and the DFT-based database of stable and unstable
    materials can help extract valuable information using machine learning (ML). In
    this manuscript, ML-driven discovery of oxide and halide perovskites is carried
    out considering single and double perovskite structures. The formability prediction
    of novel perovskites is performed based on the experimentally known perovskites
    and non-perovskites. Further, the stability prediction is performed using energy
    above the hull information of the perovskites using a DFT-based data available
    in the open literature. Overall, the databases contain the atom-specific and geometric
    properties of perovskites. Only those compounds are selected that are common in
    the formability and stability dataset. Finally, the novel perovskites are predicted
    that are formable as well as stable with remarkably high threshold probability
    [24,37]. Further, the characteristics of novel compounds are investigated to examine
    their potential in energy storage applications. A workflow followed in this work
    is shown graphically in Figure 1.


    The outline of this research work is as follows. The computational details are
    summarised in Section 2. The Machine learning (ML) classification models for formability
    and stability, respectively are performed in Section 3. The feature importance
    computed for formability and stability classification using tree and permutation
    methods are performed in Section 4. The final predicted compounds and their property
    are described in Section 5.


    # 2. Computational details


    A database of formability using experimental literature on perovskites and non-perovskites
    is prepared. Further, the atom specific properties and geometric properties based
    on are also added. Another training set of atom-specific and geometric properties
    for stability using existing literature and a density functional theory (DFT)
    based database'
