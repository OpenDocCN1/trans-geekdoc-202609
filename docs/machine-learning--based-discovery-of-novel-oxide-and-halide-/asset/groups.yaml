    ### 2.2. Features selection


    The preparation of formability and stability databases of oxide, fluoride, and
    halide perovskites are composed of geometric features and atom-specific features.
    The features in the database are composed of features of atoms associated with
    perovskites e.g. atom A, B and X in single perovskite and atoms A, A'', B, B''
    and X in double perovskite. Pilania et al. [43,44] proposed for double perovskite
    that a given property P can be estimated using the symmetric compound feature
    (\(P_A+ = (P_A + P_{A''})/2\)) and anti-symmetric compound feature (\(P_A - =
    (P_A - P_{A''})/2\)), where \(P_A\) and \(P_{A''}\) is the properties of atom
    A and A'', respectively. The eight basic features are shown in Figure 3. A list
    of all feature sets considering each atom (A,A'',B,B'' and X, etc.) in the present
    study is shown in Table 1.


    A large number of geometric and chemical features are used to train both models.
    The feature data is normalized to make our models more robust and the recursive
    feature elimination (RFE) [45] technique is used to remove the features of lowest
    weights in the model as earlier done by Talapatra et al. [24]. The shortlisted
    features are the subset of initially considered features. These features are capable
    of defining the formability and stability of classification models. The geometric
    features of compounds are \(t, \mu\) and \(\mu_B\). The atom-specific features
    include the Z\(_r\), HOMO energies, LUMO energies, electro-negativity (IX) [47],
