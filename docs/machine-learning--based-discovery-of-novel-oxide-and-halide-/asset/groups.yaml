    SHAP [54,55]. SHAP is a game theory-based approach that makes a model more comprehensible
    and transparent. It provides the importance of each feature for every data point
    known as local explanations and the generalized behaviour of the models known
    as global explanations of feature importance. The local explanations of the training
    dataset for formability and stability features are extracted as well and global
    explanations of feature importance are also extracted for both. The local explanations
    for formability as well as stability analysis are given in Figures 5a and 5b.
    These plots show dense information on the impact of top features on output for
    the respective model. Every instance of each feature is represented by a single
    dot in Figures 5a and 5b. t, $\mu$, EA$_{A+}$, IE$_{B+}$ and Z$_{B+}$ are the
    most important features of model predictions for formability analysis and t, EA$_{A+}$,
    $\mu_B$, $\mu_A$, Z$_{A+}$ and HOMO$_{B+}$ are most important feature is for model
    predictions for stability analysis.


