    GPC 采用高斯过程（GPs）[51,52]构建概率分类模型。基本概念是使用 GP 对隐函数（f(x) ~ $\mathcal{KP}(0, k(x, x''))$）[52]
    的值进行建模，然后应用链接函数 [52] 将这些隐值映射为类概率 [53]。GP 可定义为

    f(x) ~ $\mathcal{KP}(m(x), k(x, x'')),$ (7)


    其中 m(x) 是均值函数，通常假设为 0，而 k(x, x’) 是协方差函数（或定义输入空间中两个不同点之间关系的核函数），适用于任何有限子集 x = {x1,
    x2, ..., xn} $\in$ X。GPC 通过检查核函数的学习参数来间接估计特征重要性。在高斯过程模型中，核函数捕获特征空间中数据点之间的关系。对这些关系贡献更大的特征会被考虑。为了公平验证
    RFC 模型，RFC 和 GPC 在同一组数据上进行评估。两种分类模型中的训练-测试划分保持不变（即 80 和 20），且使用相同的随机状态（即 46）。此外，RFE
    技术也用于删除 GPC 模型中权重最低的特征，以确保一致且可能更稳定的特征选择。两种分类的这些超参数均使用 5 折交叉验证（CV）进行调优，以增强模型的可靠性。在
    5 折 CV 中，输入数据集被分成 5 个大小相同的不同子集。此外，四个子集用于训练所述模型，其余一个用于测试结果。ML 模型的最终性能通过平均测试结果提取。在这项工作中，可成形性分类模型的准确度为
    0.946，而稳定性分类模型的准确度为 0.84。在成功训练和测试模型后，两个模型同时应用于包含氧化物和卤化物的新化合物数据集，以预测新的可成形和稳定的钙钛矿。


