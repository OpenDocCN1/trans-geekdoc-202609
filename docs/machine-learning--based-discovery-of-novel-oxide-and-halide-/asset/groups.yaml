    热图形式的 Pearson 相关性分别在层次结构前后的图 C 中显示。热图中的 Pearson 相关系数表示特征集之间的多重共线性程度。层次聚类后，图 C.1b
    中可以看到相关分数和特征数量的减少。多重共线性特征的消除基于图 B.1 所示树状图中选择的最佳截止值。如图 6 的 TFI 和 PFI 所示，容忍因子 (t)、八面体因子
    (\(\mu\))、EA_A 和 \(Z_A^r\) 是预测钙钛矿可成形性的最重要特征。


