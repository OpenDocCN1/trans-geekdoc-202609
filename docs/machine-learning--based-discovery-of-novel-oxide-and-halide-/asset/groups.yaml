    the classes (class 0 and class 1) in terms of feature importance is shown in Figures
    5c and 5d. According to our global model the t, $\mu$, EA$_{A+}$, IX$_{B+}$ and
    IE$_{B+}$ are the most important features in model predictions for formability.
    Further, the features t, EA$_{A+}$, $\mu_A$, $\mu_B$, Z$_{A+}$ and IX$_{A+}$ are
    most important feature is in model predictions for stability analysis.


    # 4.2. Permutation feature importance using random forests classifier


    For any classification model, it is very important to measure the predictive values
    of features. It provides insight into the relationship between the features and
    the target. Permutation Feature Importance (PFI) along with Tree Feature Importance
    (TFI) is used within the RFC model as a model examination technique to extract
    the importance of each feature used in the database. In the PFI method, the values
    of a feature are shuffled randomly which breaks the relation between the target
    and features. This leads to a drop in the accuracy and it is measured by the current
    model. Therefore the model could also suffer as there may be correlated features.
    To handle multicollinearity, the hierarchical clustering is performed on the features
    using Spearman correlation Eq. (6) [56]. The Spearman correlation can be defined
    with Pearson''s correlation coefficient between the ranked features.


    Further hierarchical clustering of the features is implemented using Ward''s minimum
    variance [37]. The clusters having minimum variance within the cluster are paired
    after merging. The change in the variance between the centers of clusters is measured
    as Euclidean distance. After the clustering of all the features, the plot of Euclidean
    distance with respect to the features in the form of a distance matrix is known
    as dendrogram [57]. To optimize the accuracy for a given feature, a threshold
    distance is chosen while iterating the cluster distances. In this process, highly
    correlated features from the dataset are filtered out. For a better understanding
    of the effect of PFI on formability, the partial dependencies are also plotted.
    Open-source SciPy tools [58] are used to implement these methods in the present
    work.'
