    ## 5. 结果与讨论


    ### 5.1. 预测可成和稳定的钙钛矿


    可成性和稳定性分类模型应用于氧化物和卤化物钙钛矿新数据集 ($D_p$)。该数据集 $D_p$ 包含 18,248,197 个不同化合物。可成性分类模型预测了
    $D_p$ 数据集中 475024 个化合物为新的可成化合物，而稳定性分类模型预测了 194005 个化合物为新的稳定化合物。图 8a 显示了可能可成的化合物以及相对于截止概率的稳定化合物。图
    8b 显示了同时具有截止概率的可成且稳定的最终化合物。图 8 中的 Y 轴是非线性的，因为化合物数量随截止概率的变化而变化较大。最终化合物使用 0.75 的截止概率制备，即具有
    75% 概率同时可成且稳定的最终潜在候选物。这 591 个化合物被筛选为未来氧化物和卤化物钙钛矿的实验实现候选物。此外，这些筛选的化合物在下文中对电池应用进行了理论测试。


    图 9. 稳定和不稳定化合物及其理论电荷容量。


    ### 5.2. 电池应用的潜在候选物


    使用 ML 模型共发现了 591 个新颖的氧化物钙钛矿和卤化物钙钛矿化合物。最终化合物列表包含 247 个氧化物钙钛矿、19 个氟化物钙钛矿、132 个氯化物钙钛矿和
    190 个溴化物钙钛矿。对于电池应用，电荷容量 [60] 使用以下公式给出的估算：


    $Q = nF/(3600 * Mw)mAhg^{-1}$


    其中 $F$ 是 *法拉代常数*，$n$ 是电荷载体的数量，$Mw$ 是用于电极的钙钛矿材料的分子量。考虑以下化学方程式：


    $LiTaO_3 \longrightarrow Li^+ + TaO_3 + 1e^-$


    n 的值为 1，LiTaO3 的分子量为 235.89 g/mol。因此使用上述方程，电荷容量为 113.62 mAhg⁻¹。


    我们准备了一个单独的数据框来估算最终化合物的电荷容量。在所有卤化物钙钛矿中，最高电荷容量出现在一种氟化物钙钛矿中。电荷容量为 215.63 mAhg⁻¹，出现在双重卤化物钙钛矿
    TlBTeGeF₆ 中。在其他卤化物钙钛矿中，例如在氯化物钙钛矿中，TlBTeGeCl₆ 的电荷容量最高，约为 170 mAhg⁻¹；在溴化物钙钛矿中，ReVTeGeBr₆
    的电荷容量为 116 mAhg⁻¹。而在氧化物钙钛矿中，RbTe-GeO₆ 显示所有化合物中最高的电荷容量，约为 380 mAhg⁻¹。新化合物列表中所有其他化合物的电荷容量可在图
