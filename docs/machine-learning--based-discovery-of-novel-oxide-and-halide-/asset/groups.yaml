    ## 基于机器学习的用于储能的新型氧化物和卤化物钙钛矿发现


    Neelesh Gupta$^{a,b}$, Ravi Kumar$^{a,b}$, Alankar Alankar$^{b,c,d,*}$


    $^{a}$ 马德拉斯印度理工学院冶金与材料工程系, 钦奈 600036, 印度

    $^{b}$ 马德拉斯印度理工学院未来出行陶瓷技术研究中心, 钦奈 600036, 印度

    $^{c}$ 孟买印度理工学院机械工程系, 波瓦伊, 孟买 400076, 印度

    $^{d}$ 孟买印度理工学院机器智能与数据科学中心 (C-MInDS), 波瓦伊, 孟买 400076, 印度


    ## 文章信息


    - 关键词：

    - 钙钛矿

    - 可成形性

    - 稳定性

    - 机器学习

    - 能源材料

    - 材料信息学


    ## 摘要


    在本研究中，利用机器学习、密度泛函理论数据库和实验数据库，探索了单钙钛矿和双钙钛矿形式的新型氧化物和卤化物钙钛矿化合物。提取了定义氧化物钙钛矿和卤化物钙钛矿化合物可成形性和稳定性的重要特征。利用这些数据集作为训练数据集，使用随机森林分类器为可成形性和稳定性制备了非常精确的机器学习分类模型。随后，对这些结果进行交叉验证以筛选潜在的新型化合物。进一步，使用层次聚类技术来理解所选特征之间多重共线性的影响，并分析其对钙钛矿可成形性和稳定性的影响。我们的机器学习模型预测了
    591 种既可成形又稳定的新型钙钛矿化合物。进一步，还分析了这些新型化合物的电荷容量，用于电池应用。


    ## 1. 引言


    全球能源供应以惊人的速度增长，推动了对化石燃料的过度开发。开发清洁能源生成和存储对于应对全球变暖和满足能源需求至关重要。已经构思了多种材料和技术用于能量转换和能量存储应用。已进行了大量研究来收集太阳能和热能
    [1–3]。


    在电动交通工具和轻型电动汽车中，对高性能电池的需求与日俱增。除了能量生成，还在持续增长对能量存储材料 [4, 5] 的需求，以供应电动汽车和各种电子设备。电池的性能取决于电极材料和在役负载参数。经典电池的关键特征包括电荷容量、高能量密度、长寿命、环保、低成本和紧凑性。


    由于其优异的电子、光学 [6]、压电 [7] 和磁性能，钙钛矿材料适用于能源领域。因此，由于其广泛的性能范围，钙钛矿继续吸引人们。虽然已进行多项研究利用钙钛矿材料收集太阳能和热能
    [8–11, 14]，但氧化物钙钛矿和卤化物钙钛矿正在吸引科学界，特别是用于能量节约和存储应用 [15]。


    由于其更高的导电性和催化活性 [16]，氧化物钙钛矿和卤化物钙钛矿可用作有前景的电极材料。在氧化物钙钛矿中，A 位点的原子控制热力学稳定性，B 位点的原子控制电化学行为。热力学稳定性是指在温度和压力变化下保持晶体结构的倾向
    [17]。这可以通过估计形成能 [18] 和相图 [19] 来实现。双钙钛矿（AA''BB''O6）由于其优异的电子和离子电导率以及更高的氧离子扩散率而提供关键应用。它们的有序排列导致作为超级电容现象的储能设备中改进的循环稳定性
    [20]。


    卤化物钙钛矿表现出非常好的半导体行为和非凡的理化性质 [20]。由于其吸收系数、扩散长度和可调带隙等优异特性，卤化物钙钛矿已广泛用于太阳能电池和 LED [15,21–23]。钙钛矿晶格的化学计量式为
    ABX3 [24]，而 A 阳离子位点主要是


    * 通讯作者地址：马德拉斯印度理工学院未来出行陶瓷技术研究中心, 钦奈 600036, 印度。

    电子邮件地址：er.neel.gupta@gmail.com (N. Gupta), nvrk@iitm.ac.in (R. Kumar), alankar.alankar@iitb.ac.in
    (A. Alankar)。


    碱土金属、碱金属和镧系元素，B 阳离子为具有 3d、4d 或 5d 构型的金属，X 为氧和卤素（Cl、Br 和 I）等 [25]。具有最高对称性（原型）的钙钛矿晶体结构属于
    \(Pm\bar{3}m\) 立方空间群 [26]。当 A 和 B 阳离子被其他阳离子的组合取代，或在形成双钙钛矿或四重钙钛矿时，化学计量式为 \(ABX_3\)
    的原型钙钛矿会形成几种变体 [27]。此外，卤化物钙钛矿的电子和离子电导率及离子扩散，加上其低成本生产，使其成为储能应用的合适候选材料。氟化物钙钛矿表现出高氧化还原电位和高功率密度
    [20,28]。氟化物钙钛矿具有最电负性的氟元素以及出色的电容控制。因此，\(ABF_3\) 钙钛矿在用于储能应用的新电极材料研究中非常流行。单金属氟化物钙钛矿在储能应用中表现出非常好的稳定性
    [20]。因此，探索具有改善结晶度和更高电子导电性的新型氟化物钙钛矿非常重要 [29–31]。现有的氧化物钙钛矿和卤化物钙钛矿不是下一代电极材料的好候选材料。这一差距可以通过具有增强电荷容量和超导行为的新型钙钛矿结构来填补。一些最近提出的新型钙钛矿结构可以覆盖多达
    90% 的周期表元素，因为它们的理化性质 [20]。


    可成形性是指材料形成或表征的难易程度 [24]。材料的形成通常是指材料被创造或合成的过程，无论是自然还是人工。合成具有钙钛矿结构的 \(ABX_3\) 化合物被视为“可成形”，而如果合成具有非钙钛矿结构，则称为“不可成形”。钙钛矿晶体结构的可成形性可以使用基于描述符的方法快速估计，该方法允许材料的高通量筛选。容忍因子
    t 被发现相当准确地用于确定钙钛矿立方结构的可成形性。钙钛矿结构的容忍因子可以使用每个离子的离子半径（配位数依赖的 Shannon 离子半径）来估计，如下所示


    \(t = (r_A + r_X) / \sqrt{2}(r_B + r_X),\) (1)


    其中 \(r_A\)、\(r_B\) 和 \(r_X\) 分别是 A 阳离子、B 阳离子和 X 阴离子的 Shannon 离子半径。根据最近的经验证据，如果
    t 在 0.9–1.0 的范围内，则立方钙钛矿组成是可成形的 [24]。此外，八面体因子 (\(\mu\)) 是另一个显著的描述符，用于使用钙钛矿的基本基团（八面体
    \(BX_6\)）分类钙钛矿和非钙钛矿。它定义为


    \(\mu = r_B/r_X.\) (2)


    通过 \(t\) 和 \(\mu\) 的组合，Li et al. [33] 从 197 种已知的 \(ABO_3\) 化合物中成功分类了钙钛矿和非钙钛矿结构。Zhang
    et al. [34] 也从 397 种已知的 \(ABO_3\) 化合物中划分了钙钛矿和非钙钛矿结构。Sun et al. [35] 使用稳定性描述符 (\(\mu
    + t)^n\) 以 ~ 90% 的准确性给出了任何两种钙钛矿之间的相对稳定性预测。此外，Filip 和 Giustino [36] 建议为 \(A_2BB''X_6\)
    型钙钛矿引入新的组合，加上八面体错配因子 \(\mu_B\)，并引入使用 (\(t\), \(\mu\), \(\bar{\mu}_B\)) 的 3D 图。八面体错配因子由以下给出


    \(\bar{\mu}_B = |r_B - r_{B''}| / 2r_X,\) (3)


    其中 \(r_B\)、\(r_{B''}\) 和 \(r_X\) 分别是 B 阳离子、\(B''\) 阳离子和 X 阴离子的 Shannon 离子半径。八面体错配因子有助于映射
    \(A_2BB''X_6\) 类型钙钛矿。Filip 和 Giustino 等人 [36] 已生成一个包含 94,232 种此前未知的可成形钙钛矿的库，保真度为
    80%。Talapatra 等人 [24] 使用 28 种元素特征以及 (\(t\), \(\mu\), \(\bar{\mu}_B\)) 预测了 414
    种氧化物钙钛矿。他们的预测组成对于实验合成最有希望，因为它们同时来自可成形性和稳定性预测模型。钙钛矿的稳定性是指立方钙钛矿的热力学稳定性 [18]。


    可成形性和稳定性是新化合物的关键特征。钙钛矿的可成形性依赖于各种几何特征。另一方面，稳定性是另一个基本特征，有助于理解与钙钛矿晶体结构相关的热力学稳定性。通过研究钙钛矿的稳定性，我们可以预测晶体结构是否会分解为其他相或保持不变。稳定性分析可以使用能量凸包进行。能量凸包是比任何其他相能量更低的相的线性组合
    [18]。位于能量凸面上的化合物相将被视为热力学稳定，而凸包以上的相将是亚稳定或不稳定。化合物 \(ABX_3$ 的凸包以上能量 (\(\Delta E_h^{ABX_3}$)
    可以借助化合物的形成能 (\(E_f^{ABX_3}$) 和 \(ABX_3$ 组成的凸包能量 (\(E_{ch}$) 计算，由以下给出


    \(\Delta E_h^{ABX_3} = E_f^{ABX_3} - E_{ch},\) (4)


    其中 \(ABX_3$ 的形成能可以由化合物的总能以及各元素 A、B 和 X 的化学势（即 \(\mu_A\)、\(\mu_B$ 和 \(3\mu_X$）计算得出，由以下给出


    \(E_f^{ABX_3} = E^{ABX_3} - \mu_A - \mu_B - 3\mu_X,\) (5)


    这种方法也适用于双钙钛矿。


    发现新材料的传统方法一直基于繁琐的测试、表征和先前的技术。密度泛函理论 (DFT) 可用于预测稳定性、电子和光学性能。然而，基于 DFT 的计算已知需要昂贵的计算资源且耗时。关于已合成材料、预测但未合成材料以及稳定和不稳定材料的基于
    DFT 的数据库的文献可以帮助使用机器学习 (ML) 提取有价值的信息。在本手稿中，考虑单钙钛矿和双钙钛矿结构，对氧化物和卤化物钙钛矿进行 ML 驱动的发现。新型钙钛矿的可成形性预测基于实验已知的钙钛矿和非钙钛矿。此外，稳定性预测是使用公开文献中可用的基于
    DFT 的钙钛矿凸包以上能量信息进行的。总体而言，数据库包含钙钛矿的原子特定和几何特性。仅选择在可成形性和稳定性数据集中共同的化合物。最后，预测了具有显著高阈值概率
    [24,37] 且既可成形又稳定的新型钙钛矿。此外，调查了新型化合物的特性，以考察其在储能应用中的潜力。本工作遵循的工作流程在图 1 中以图形方式显示。


    本研究工作的大纲如下。第 2 节总结了计算细节。第 3 节分别对可成形性和稳定性进行了机器学习 (ML) 分类模型。第 4 节进行了使用树方法和置换方法计算的可成形性和稳定性分类的特征重要性。第
    5 节描述了最终预测的化合物及其性质。


    ## 2. 计算细节


