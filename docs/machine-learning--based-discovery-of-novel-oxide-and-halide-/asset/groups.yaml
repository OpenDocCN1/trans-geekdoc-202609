    The Zunger’s pseudopotential radius is the sum of radii of s-orbitals and p-orbitals
    [24]. A summary of the formability classification model in the form of a confusion
    matrix (CM) is shown in Figure 4a as explained in [50]. The number of true values
    and false values predictions are summarized in the matrix form. The diagonal elements
    of the matrix (CM11 and CM22) are true negative (TN) and true positive (TP), whereas
    off-diagonal elements (CM12 and CM21) are false negative (FN) and false positive
    (FP). Furthermore, the precision and accuracy of the model can be estimated using
    the values of elements in the CM. A model’s prediction capability of predicting
    the positive class or formable class can be analyzed by precision. It can be estimated
    by the ratio of TP to the sum of TP and FP (i.e. Precision = TP/(TP + FP)). The
    accuracy of a model helps analyze the predicting capability with correct classifications.
    It can be estimated as \(Accuracy = (TP + TN)/(TP + FN + FP + FN)\). The values
