    ## 4. 特征重要性分析


    ### 4.1. 使用局部和全局 SHAP 值的特征重要性


    使用 SHAP [54,55] 对模型预测进行了分析。SHAP 是一种基于博弈论的方法，使模型更易理解且更透明。它为每个数据点提供每个特征的重要性（称为局部解释），并提供模型的一般化行为（称为特征重要性的全局解释）。可成形性和稳定性特征的训练数据集局部解释也已提取，两者均提取了特征重要性的全局解释。可成形性和稳定性分析的局部分别在图
    5a 和 5b 中给出。这些图表显示了顶层特征对各自模型输出影响的密集信息。图 5a 和 5b 中，每个特征的每个实例由一个点表示。t、$\mu$、EA$_{A+}$、IE$_{B+}$
    和 Z$_{B+}$ 是可成形性分析模型预测中最重要的特征，而 t、EA$_{A+}$、$\mu_B$、$\mu_A$、Z$_{A+}$ 和 HOMO$_{B+}$
    是稳定性分析模型预测中最重要的特征。


    两个类别（类别 0 和类别 1）在特征重要性方面的一般化行为（对模型输出的平均影响）如图 5c 和 5d 所示。根据我们的全局模型，t、$\mu$、EA$_{A+}$、IX$_{B+}$
    和 IE$_{B+}$ 是可成形性模型预测中最重要的特征。此外，t、EA$_{A+}$、$\mu_A$、$\mu_B$、Z$_{A+}$ 和 IX$_{A+}$
    是稳定性分析模型预测中最重要的特征。


    ### 4.2. 使用随机森林分类器的排列特征重要性


    对于任何分类模型，测量特征的预测值非常重要。它可以深入了解特征与目标之间的关系。排列特征重要性（PFI）与树特征重要性（TFI）一起在 RFC 模型中作为模型检查技术使用，以提取数据库中每个特征的重要性。在
    PFI 方法中，特征的值被随机打乱，从而打破了目标与特征之间的关系。这会导致准确度下降，并由当前模型进行测量。因此，模型也可能会受损，因为可能存在相关特征。为了处理多重共线性，使用
    Spearman 相关系数 Eq. (6) [56] 对特征进行了层次聚类。Spearman 相关性可以定义为排序特征之间的 Pearson 相关系数。


    特征的进一步层次聚类使用 Ward 最小方差 [37] 实现。合并后，簇内方差最小的簇被配对。簇中心之间的方差变化以欧氏距离来测量。在对所有特征进行聚类后，以距离矩阵形式显示的特征欧氏距离图称为树状图
    [57]。为了优化给定特征的准确度，在遍历簇距离时会选择一个阈值距离。在此过程中，从数据集中过滤掉高度相关的特征。为了更好地理解 PFI 对可成形性的影响，还绘制了部分依赖。本工作中使用开源
    SciPy 工具 [58] 实现这些方法。


    ![](img/0947dcc86f17166636a5ebab0393245e_6_0.png)


    ![](img/0947dcc86f17166636a5ebab0393245e_6_1.png)


    ![](img/0947dcc86f17166636a5ebab0393245e_6_2.png)


