    ## 3. 机器学习分类：技术细节


    ### 3.1. 使用随机森林分类器


    在机器学习中，分类是根据给定输入数据集对数据集进行分类的过程。它需要一个包含多个输入和输出的训练数据集用于学习。在本工作中，使用 RFC 模型对新化合物的稳定性和成型性进行预测。随机森林（也称为随机决策森林）是一种受监督的机器学习技术，通过使用决策树进行回归分析和分类。RFC
    方法结合了从随机选取的训练数据集子集中不同决策树的投票。模型的最终预测由得票最多的类别决定 [49]。


    ![](img/0947dcc86f17166636a5ebab0393245e_3_0.png)


    图 3. 定义钙钛矿的八个非常基本的特征 (a) 几何特征和 (b) 化学特征。


    随机森林分类器（RFC）中的超参数为 (a) *决策树数量* 和 (b) 每个分裂节点的 *树深度*。使用 Scikit-learn 包 [45] 实现随机森林分类器。整个数据集分别按
    80 和 20 的比例划分为训练集和测试集，用于稳定性和成型性分类。这意味着模型使用随机选择的 80% 数据集进行训练，并使用剩余 20% 数据集进行测试。通过验证测试结果，也对这些模型的稳健性进行了测试。在将
    RFC 作为机器学习模型应用之前，我们对所有特征进行归一化处理，以确保均值为零并将标准差设置为单位。成型性和稳定性分类模型的估计器或树的数量（n-estimators）为
    29。成型性分类的最大树深度（max-depth）为 22，稳定性分类为 19。两个 RFC 模型均使用 34 个特征进行研究，这些特征包含 30 个原子特异特征和
    4 个几何特征。


    两个分类的超参数均使用 5 折交叉验证（CV）进行调优，以增强模型的可靠性。在 5 折 CV 中，输入数据集被分为 5 个大小相同的不同子集。此外，四个子集用于训练所述模型，剩余一个子集用于测试结果。机器学习模型的最终性能通过平均测试结果得到。在本工作中，成型性分类模型的准确率为
    0.946，而稳定性分类模型的准确率为 0.84。成功训练和测试模型后，两个模型同时应用于包含氧化物和卤化物的新化合物数据集，以预测新的可成型和稳定钙钛矿。


    ### 3.2. 钙钛矿的成型性和稳定性分类


    图 4a 显示了作为 RFC 后跟 RFE 结果得到的氧化物和卤化物钙钛矿成型性分类的特征重要性。容忍因子（t）和八面体因子（\(\mu\)）是列表中最重要的特征。原子
