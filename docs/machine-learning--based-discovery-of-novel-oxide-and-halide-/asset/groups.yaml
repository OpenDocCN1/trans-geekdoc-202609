    is also prepared. Further, an ML model using the above properties is built to
    predict the stability and formability of new perovskites. The number of compounds
    in the formability and stability dataset is 1962 and 4075, respectively.


    In order to predict novel perovskite compounds, all the possible combinations
    of ABO3, AA''BB''O6, AA''B2O6, A2BB''O6, ABX3, A''ABB''X6, AA''B2X6, A2BB''X6
    (where X is halide element) and ABF3, AA''BB''F6, AA''B''2F6, A2BB''F6 compounds
    are prepared using elements up to Bi except C, N, S, P and noble gases [24]. These
    sets of compounds are screened based on charge neutrality. It suggests that the
    cations (A and B) with the sum of valence equal to 6 in single oxide perovskites
    and the sum of valence equal to 3 in single halide perovskites are the only valid
    compounds. Similarly, the cations (A, A'', B and B'') with the sum of valence
    equal to 12 in double oxide perovskites and the sum of valence equal to 6 in double
    halide perovskites are the only valid compounds. This leads to a specific dataset
    of oxide and halide perovskite dataset (Dp) of 18,248,197 compounds.


    ### 2.1. Formability and stability databases


    Formability training dataset contains 1962 experimentally known oxides, fluoride,
    and halide perovskites of the form ABO3, AA''BB''O6 and AA''BB''X6, respectively.
    The halide X is composed of Cl and Br in this dataset and it is composed of 1453
    perovskites and 509 non-perovskites. The dataset is prepared based on literature
    like Zhang et al. [34], Balacharan et al. [38], Vasala et al. [39], Talapatra
    et al. [24], Li et al. [40], Li et al. [41] and an existing database like Inorganic
    Crystal Structure Database (ICSD). The stability training database is composed
    of all possible compositions i.e. ABO3, AA''BB''O6, AA''B2O6 and ABX3, AA''BB''X6,
    AA''B2X6, A2BB''X6 compounds. The total number of oxides, fluoride, and halides
    is 4075 compounds. Of these, 2053 compounds are thermodynamically stable and 2022
    compounds are thermodynamically unstable. Figure 2 presents the distribution of
    single and double perovskites that comprise oxide perovskite, fluoride perovskite,
    chloride perovskite, and bromide perovskite. Figures 2a and 2b show the distributions
    of various types of compounds within the formability database and stability database
    of perovskite materials, respectively. In formability and stability distribution,
    the domination of oxide perovskite can be seen in this literature. The dataset
    is prepared from Materials Project Application Programming Interface (Materials
    API) by setting Energy above hull (\(\Delta E_h\)) 50 meV/atom for each compound.
    Wu et al. [42] found that approximately 80 % of compounds in ICSD had Energy above
    hull values less than 36 meV/atom. So for better analysis, the \(\Delta E_h\)
    value equal to 50 meV/atom is opted in the present work.


