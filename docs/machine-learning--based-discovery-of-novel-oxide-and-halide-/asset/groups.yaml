    464.91 mAhg⁻¹（Ge₂NOF₆）。使用预测化合物也观察到了相同的模式。值得注意的是，使用 ML 模型预测的化合物声称是可成且稳定的。然而，来自报告的
    DFT 数据库的数据模式仅列出了稳定化合物。主要目标是探索具有高电荷密度的潜在新颖化合物。新化合物与 DFT 数据库稳定化合物的比较载于表 2。


    ## 6. 结论


    本文介绍了一种系统分析，通过制备特征集和新数据库，利用机器学习的先进分类技术探索新颖的钙钛矿材料。可成性分类模型使用已知材料的现有实验数据库训练，并制备了单个和双重氧化物钙钛矿及卤化物钙钛矿的大型化学空间特征集。同样，稳定性分类模型使用基于
    DFT 的数据库以及单个和双重钙钛矿的大型化学空间特征集进行训练。稳定性分类中仅考虑 DFT 数据集的立方对称性，并在能量凸壳中选择 50 meV 的能量阈值来定义
    DFT 数据集中的稳定和不稳定化合物。通过增加阈值，可以调整稳定性范围，这会增加与可成性数据库的重叠。然而，这可能会增加将不稳定化合物添加到最终化合物列表中的风险。立方（Pm-3m）对称性是钙钛矿的原型相，尽管它们可以属于其他空间群，如四方（P4/mbm）和正交（Pmbn），但考虑多个空间群带来复杂挑战，需要开发更复杂的机器学习模型用于可成性和稳定性预测。稳定性数据库使用所有化合物的凸壳估计技术，利用
    Material Project 数据库预测化合物的形状、不稳定和亚稳定性。


    已制备了包含多个原子特定特征和几何特征集的数据库。可成性和稳定性分类模型基于随机森林（RF）技术构建。这些 ML 模型旨在最大化准确性并减少方差。另一个分类器，高斯过程分类器（GPC）也用于可成性和稳定性模型以验证
    RF 分类器模型。可以看出，所提出的基于 RFC 的模型更加稳健可靠。此外，测量了特征的预测值以了解特征与真实结果之间的关系。使用层次聚类技术分析选定特征之间多重共线性的影响及其对钙钛矿可成性和稳定性的影响。可成性分类模型预测了
    475024 个新的可成化合物，而稳定性分类模型预测了 437828 个新的稳定化合物。最后，筛选了 591 个化合物，因为它们具有极高的可成性和稳定性。这
    591 个化合物是未来实验实现最有前景的新颖氧化物和卤化物钙钛矿。此外，这些筛选的化合物在能量储存应用方面进行了理论测试。最终化合物列表包含 247 个氧化物钙钛矿、19
    个氟化物钙钛矿、132 个氯化物钙钛矿和 190 个溴化物钙钛矿。最高电荷容量出现在一种氟化物钙钛矿中，但总体最高电荷容量出现在氧化物钙钛矿中。使用这种 ML
    方法，还可以研究其他晶体结构的新颖化合物的特性，用于不同的应用。ML 方法可以为广泛检验新颖化合物的功能性铺平道路。


