    using decision trees. The RFC method combines the votes from different decision
    trees from a randomly selected subset of the training dataset. The final prediction
    of the model is decided by a class with maximum votes [49].


    The hyper-parameters in the random forest classifier (RFC) are (a) *number of
    decision trees* and (b) *tree depth* at each splitting node. The Scikit-learn
    package [45] is used to implement the random forest classifier. The entire dataset
    is split into a training and test set of 80 and 20, respectively for both stability
    and formability classifications. It means the model is trained using 80 % of the
    randomly chosen dataset and tested using the remaining 20 % of the dataset. The
    robustness of these models have also been tested by verifying the test results.
    Before applying the RFC as an ML model, we normalize all the features to ensure
    zero mean and set standard deviation equal to unity. The number of estimators
    or trees (n-estimators) for formability and stability classification models is
    29. The maximum tree depth (max-depth) is 22 for formability classification and
    19 for stability classification. Both of the RFC models are studied using 34 features
    comprised of 30 atom-specific features and 4 geometric features.


    These hyper-parameters for both classifications are tuned using 5-fold cross-validation
    (CV) to enhance the reliability of the models. In the 5-fold CV, the input dataset
    is divided into 5 different subsets of the same size. Further, four sets are used
    for training the said model and the remaining one is to test the results. The
    final performance of the ML model is extracted by averaging the test results.
    In this work, the accuracy of the formability classification model is 0.946, whereas
    the accuracy of the stability classification model is 0.84. After successfully
    training and testing the model, both the models are applied simultaneously on
    the dataset of new compounds containing oxides and halides to predict new formable
    and stable perovskite.


