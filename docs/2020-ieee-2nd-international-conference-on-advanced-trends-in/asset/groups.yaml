    **Abstract** This paper presents a review of trends in numerical weather prediction,
    the nature of their errors, and ways to improve them. The neural network is proposed
    to increase the accuracy of the temperature forecast by the COSMO regional model.
    This architecture allows predicting errors of the atmospheric model further conducted
    with different historical models of regional errors. The number of epochs after
    network overfitting overlaps is determined by that the architecture makes possible
    to achieve an improvement of a 2m temperature forecast in approximately 50%.


    *Keywords*—neural network, model, COSMO, atmospheric, temperature


    # I. INTRODUCTION


    Over the past 30 years, the development and application of numerical hydrodynamic
    methods for weather forecasting have improved unexpectedly. It became possible
    primarily due to the creation of powerful computers, the designing of sophisticated
    and realistic methods, and the essential improvement of meteorological instrumentation
    and data.


    Nature of the atmosphere is based on complex thermodynamic processes in the troposphere
    and stratosphere and the lasting relationship between these processes allow us
    to define them by the equations of hydrodynamics [1, 2]. In this, enables modeling
    of different parts of the atmospheric character and other phenomena. In the world,
    forecasts are classified based on the meteorological type, the mathematical implementation
    specifications, the forecast range, and the size of the territory they are made.


    Today, the quality of weather forecasts consists of two dimensions: accuracy and
    the increasing range. The short-range forecast is determined by the initial state
    of the atmosphere. The long range forecast is required not only to detect limited
    knowledge of the initial fields but also to describe the effects of external factors
    that lead to a new equilibrium state of the system. The long range depends on
    the initial state of the atmosphere and elements of modeling. Increasing the range
    of forecasts leads to the need to expand the area of integration to cover the
    entire surface of the globe, making time of calculations and the power of computers
    critical factors.


    There are processes and phenomena of different types in the atmosphere. Some occur
    in a limited area for short times - or in space for a long time. Currently, today,
    all atmospheric processes and objects can be identified by these types [3]: (up
    to 200m), from 2000km and to scale. It is clear that the formation of processes
    and phenomena in each area occurs at all scales and each process in general circulation
    will be different.,


    Previously, the weather services of developed countries focused on synoptic periods
    in the hemisphere, despite the nature of results, according to the success of
    such forecasts remained almost constant. With the development of computing resources,
    several new operational models were created in specially created meteorological
    centers. For investigation and the forecasting of the macroscale processes, models
    were used in all existing world meteorological centers (Washington, Melbourne,
    Moscow, Offenbach and etc.), as well as the largest and national regions. For
    macroscale examples of parallel computer systems were used in up to 300 used.


    Execution of numerical methods for complex task atmospheric processing is impossible
    without high-performance computing methods. Current forecasting is limited with
    severe constraints that can be overcome only by powerful multiprocessor systems.
    Nowadays, network technologies of the Internet, operating systems, and distributed
    computing clusters. Their usage is to achieve high-performance indicators of multiprocessor
    processing and parallel programming.


    Nowadays, promising directions in the development of study and parallel forecasting
    systems is the construction of program abstractions in the field of algebra-linguistic
    languages and models, which allow to the development of architecture and language-independent
    multiprocessor computing systems and networks. Application of algebra-linguistic
    approach to the construction of structured abstractions in parallel program models
    provide parallel calculations with high-performance performances.'
