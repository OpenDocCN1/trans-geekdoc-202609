  - "[PAGE 2]\n\n# 355\n\ndataset covers 8 days (from 25.10.2013 to 01.11.2013). Thus\
    \ we obtained a 75/25 ratio between the train set and the test set.\n\nThe proposed\
    \ neural network architecture has a 16-unit GRU layer as the first layer and fewer\
    \ units to lose worse. Two fully-connected (dense) layers follow the first layer.\
    \ The number of units in them depend on error history. Models based on 1, 2-day\
    \ error history have 8 and 16 units, models based on 3, 5-day error history have\
    \ 32 and 16 units based on 7-day error history have 8 and 32 units,\n\n# B. Input\
    \ and Output Vectors\n\nAs mentioned above, the proposed approach's main idea\
    \ is to train a neural model on errors given by the forecast of the regional model,\
    \ i.e., on Err = Forecast - Obs. If so, we can calculate the numerical forecast\
    \ as FCNt = Err + forecast.\n\nThe experiments were conducted with 1, 2, 3, 5,\
    \ 7-day error history. The output vector dimensions were equal to 1, 2, 3, 5,\
    \ and 7 respectively. We have the day input vector contained all data for numerical\
    \ forecast error for the given history.\n\nThe last layer of the proposed architecture\
    \ is also fully-connected. It has 8 units the result obtained after the possible\
    \ model ensures some diversity of the output vectors.\n\nThe output vector dimension\
    \ was equal to 1×8. These contained all data on numerical forecast error for 1-day\
    \ prediction.\n\nAll experiments were conducted using Keras (an open-source library\
    \ that provides a Python interface for neural networks) learning platform. Tensorflow\
    \ (an open-source machine learning framework). The code was written in the Python\
    \ programming language.\n\n# C. Neural Network Architecture\n\nNumerical forecast\
    \ error has a time-series nature. We decided to use a recurrent layer as the first\
    \ layer of the since recent models were designed to deal with such history.\n\n\
