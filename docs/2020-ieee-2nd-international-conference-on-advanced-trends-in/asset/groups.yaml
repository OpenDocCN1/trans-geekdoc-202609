  mdcn: "\n\n# 利用机器学习改进数值化天气预报\n\nAnatoly Doroshenko\n乌克兰国家科学院软件研究所\nNTUU '伊戈尔·西科尔斯基基辅理工大学'\
    \ \n基辅，乌克兰\ndoroshenkanatoli2@gmail.com\n\nVitalii Shpygy\n乌克兰国家应急局（SES of Ukraine）水文气象学院及乌克兰国家科学院\n\
    基辅，乌克兰\nvitold82@ua.com\n\nRoman Kushnirenko\n乌克兰国家科学院软件研究所\n基辅，乌克兰\nroman.kushirenko@gmail.com\n\
    \n**摘要** 本文回顾了数值天气预报的趋势、误差的性质以及改进方法。提出了一种神经网络来提高 COSMO 区域模型温度预报的准确性。该架构允许通过不同的历史区域误差模型进行进一步的研究，对大气模型的误差进行预测。网络过拟合叠加后的\
    \ epoch 数量取决于该架构能够使 2米高度温度预报的精度提高约 50%。\n\n*关键词*—神经网络、模型、COSMO、大气、温度\n\n## I.\
    \ 引言\n\n在过去的30年里，用于天气预报的数值流体动力学方法的发展应用取得了意想不到的进展。这主要归功于强大计算机的出现、复杂方法的设计以及气象仪的本质改进。\n\
    \n大气的性质基于对流层和对流层复杂热力学过程的研究，这些过程允许我们通过流体力学方程对其进行定义 [1]。在世界范围内，天气预报已根据气象类型、数学实现、预报范围和规模进行分类。\n\
    \n今天，天气预报的质量由两个维度组成：准确性和范围。短效预报取决于大气的初始状态。长效预报不仅需要检测有限的初始场，还需要描述导致系统新平衡状态的因素。长效预报取决于大气的初始状态和建模元素。预报范围的扩大导致了覆盖整个地球表面的需求，计算时间和计算机功率是关键因素。\n\
    \n大气中存在不同类型的过程和现象。某些现象在有限区域内短时间内或长时间发生。目前，所有大气过程可以通过这些类型进行识别 [3]：（从 200m 到 2000km\
    \ 的尺度）。在每个区域和每个尺度，过程的形成是清晰的。\n\n在此之前，天气服务关注的是半球的天气状况，尽管此类预报的结果几乎保持不变。随着计算资源的发展，新的运行模型在所有现有气象中心（华盛顿、墨斯科、奥芬堡等）被创建。对于大尺度过程，并行计算机系统被用于\
    \ 300 个。\n\n如果没有高性能计算方法，执行复杂大气处理的数值方法是不可能的。目前的预报面临严格限制，只有通过强大的多处理器系统才能克服。如今，网络技术、操作系统和分布式计算集群是为了实现多处理器处理和并行编程的高性能。\n\
    \n如今，研究和并行预报系统的前景是在代数语言和模型领域构建程序抽象，这允许架构和语言无关的多处理器计算网络的发展。代数方法在构建并行程序模型中的应用提供了高性能性能。\n\
    \n并行气象预报系统的进一步改进不仅通过提高生产力，还通过降低单位能耗来实现。使用非均匀并行计算系统是特定任务以获得最低成本最高性能的方法。近年来，图形处理器（GPU）在这方面表现出色。GPU\
    \ 特别适用于信息处理以及通用处理器平台（GPGPU）。\n\n本文描述了用于改进数值预报任务的神经网络架构。所提出的神经网络通过不同的历史误差模型对大气模型的误差进行进一步预测。\n\
    \n## A. 数据集\n\n所提出的神经网络通过不同的历史误差模型对大气模型的误差进行进一步预测。网络过拟合叠加后的 epoch 数量取决于该架构能够使\
    \ 2米温度预报的精度提高约 50%。\n\n本文描述了用于改进数值预报任务的神经网络架构。所提出的神经网络通过不同的历史误差模型对大气模型的误差进行进一步预测。\n\
    \n- 日期\n- 温度\n- 预报（观测值）\n\n所提出的神经网络对大气模型的误差进行进一步预测。进一步预测。网络过拟合叠加后的 epoch 数量取决于该架构能够使\
    \ 2米温度预报的精度提高约 50%。\n\n本文描述了用于改进数值预报任务的神经网络架构。所提出的神经网络通过不同的历史误差模型对大气模型的误差进行进一步预测。\n\
    \n本文描述了用于改进数值预报任务的神经网络架构。所提出的神经网络通过不同的历史误差模型对大气模型的误差进行进一步预测。网络过拟合叠加后的 epoch 数量取决于该架构能够使\
