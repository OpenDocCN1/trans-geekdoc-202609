    数据集涵盖 8 天（从 2013.10.25 到 2013.11.01）。因此，我们在训练集和测试集之间获得了 75/25 的比例。


    所提的神经网络架构第一层为具有 16 个单元的 GRU 层，后续层单元数量较少以减少性能损失。第一层之后是两个全连接（密集型）层。它们的单元数量取决于误差历史。基于
    1, 2 天误差历史的模型具有 8 和 16 个单元；基于 3, 5 天误差历史的模型具有 32 和 16 个单元；基于 7 天误差历史的模型具有 8 和
    32 个单元。


    ## B. 输入和输出向量


    如上所述，所提方法的核心思想是根据区域模型预测给出的误差来训练神经网络模型，即 Err = Forecast - Obs。如果是这样，我们可以将数值预报计算为
    FCNt = Err + forecast。


    实验是 1, 2, 3, 5, 7 天误差历史进行的。输出向量维度分别为 1, 2, 3, 5 和 7。我们的日输入向量包含了给定历史下数值预报误差的所有数据。


    所提架构的最后一层也是全连接的。它具有 8 个单元，在可能模型处理后获得的结果确保了输出向量的某些多样性。


    输出向量维度等于 1×8。这些数据包含了 1 天预测的数值预报误差的所有数据。


    所有实验都是使用 Keras（一个为神经网络提供 Python 接口的开源库）学习平台完成的。Tensorflow（一个开源机器学习框架）。代码使用 Python
    编程语言编写。


    ## C. 神经网络架构


    数值预报误差具有时间序列特性。我们决定使用循环层作为第一层，因为近期的模型是为处理此类历史而设计的。


    在许多循环网络中，我们使用了门控循环单元（GRU）架构 [7]。GRU 是一种流行的长短期记忆网络（LSTM），但它的参数更少，并且在学习长期依赖方面不会遇到很多问题，特别是梯度消失和爆炸问题。


    GRU 单元的工作方式如下：在每一步中，它接收来自当前步骤的输入向量 $x_t$ 和来自上一步骤的输出向量 $h_{t-1}$。当前输出向量计算为 $h_{t-1}$
    和当前候选向量 $\tilde{h}_t$ 之间的线性插值。


    ```

    $h_t = (1 - z_t) \odot h_{t-1} + z_t \odot \tilde{h}_t;\;(1)$

    ```


    其中 $z_t$ 是门向量（决定输入向量的哪些部分将使用当前输出）；$\odot$ 是哈达玛积的符号。更新向量计算如下：


    ```

    $z_t = \sigma(W_z x_t + U_z h_{t-1} + b_z);;(2)$

    ```


    当前候选向量 $\tilde{h}_t$ 通过简单循环网络（RNN）计算：


    ```

    $\tilde{h}_t = \sigma(W_h x_t + U_h (r_t \odot h_{t-1}) + b_h);;(3)$

    ```


    其中 $r_t$ 是重置向量。它的计算方式类似于 $W_r, U_r, b_r$ 是参数矩阵，更新门和重置门向量使用 sigmoid 函数激活，而当前候选向量使用双曲正切函数激活。


    ```

    $r_t = \sigma(W_r x_t + U_r h_{t-1} + b_r);;(4)$

    ```


    $W_w, U_w, b_w, W_h, U_h, b_h$ 是参数矩阵。


    如上所述，实验是在不同的误差历史（1, 2, 3, 5, 7 天）下进行的。模型以不同的 epoch 数（次数）进行训练：1, 2 天误差历史训练了 15
    次，3, 5-7 天误差历史训练了 6 次。更多的 epoch 会导致更好的过拟合模型，结果导致了测试期间使用的均方误差（MSE）发生变化。验证期间的 MSE
    变化如图 2-ig 所示。


    虚线表示训练数据集上的 MSE，而实线表示验证数据集上的 MSE。实验（如图 2 所示）显示了在 1 天误差历史上获得的 MSE（即与区域神经网络模型同步）。


    误差值的增加会减少获得更好预报的案例数量。在 5 天和 7 天误差历史案例中观察到的影响（哪一个）需要更深入的调查。


    ![](img/b3ddd68c3bed4054519497a876aab20a_2_0.png)


    图 2. 1 天误差历史的 MSE 变化。


    ![](img/b3ddd68c3bed4054519497a876aab20a_3_0.png)


    ![](img/b3ddd68c3bed4054519497a876aab20a_3_1.png)


    图 3. 2 天误差历史的 MSE 变化。


    图 6. 7 天误差历史的 MSE 变化。


    表 I 获得更好预报的案例百分比


    | 误差历史大小（天） | 案例百分比 |

    |---|---|

    | 1 | 52.05 |

    | 2 | 50.98 |

    | 3 | 50.44 |

    | 5 | 51.67 |

    | 7 | 52.04 |


