    影响气象值的地球循环过程通过复杂模型描述。为了获得准确的预报，需要高分辨率的大气数据。\n\n![图1. 数值预报的计算区域](img/b3ddd68c3bed4054519497a876ab20a_1.png)\n\
    \n处理数值模型区域的技术可以是使用机器学习，即神经网络。神经网络的广泛使用是因为新学习算法的发展和计算机功率的提高。神经网络如此受欢迎的原因是它们允许在关注局部细节的同时寻找共同点\
