    Further progress in the improvement of the quality of parallel meteorological
    forecasting systems is assured not only with increased productivity but also with
    a decrease in energy consumption per unit of power. Changes have laying the way
    to use non-homogeneous parallel computing systems capable of making computation
    specialization for specific tasks order to obtain the highest performance with
    the least resource costs. In recent years, graphics processing units (GPUs) have
    shown their best in this regard. GPUs are particularly well-suited as means of
    information processing, and as microprocessor general-purpose platforms (GPGPU).


    This paper describes the network architecture for the task of refining the numerical
    forecast. The proposed network predicts the errors of the numerical model''s predictions
    for further adjustment of the actual forecast.


    # A. Dataset Description


    A neural model''s ability to solve the problem depends on the representativeness
    and integrity of data for its training.


    Data used for the proposed model training, validation, and testing the following
    features:


    +   - Date

    - Coordinated Universal Time

    - 1-day forecast value (Fcst) by the regional numerical model

    - Temperature value by Kyiv weather station (Obs)


    It is known that non-homogeneous architectures are significantly more complex
    than homogeneous architectures, which arises from the development of special tools
    that would efficiently generate the most productive code for such systems.


    It can be noticed that choice of non-homogeneous architectures also arises in
    connection with building of global information and computing infrastructures,
    such as GRID-systems and cloud-computing systems. With use of iterated interfaces,
    including concepts of utility, services, and virtualization, resources are achieved
    at the maximum abstraction of resources and simplification of access to them the
    task


    The regional numerical model used for forecasting is the COSMO model developed
    and Small-Scale Modeling. It was developed by the Consortium for Model Hydromological
    Institute of the SES of Ukraine and the NAS for both research and applications
    services since 2011 [6].


    This article proposes to solving the problem of numerical weather forecast. It
    combines physical models of atmospheric processes with machine learning which
    achieves higher degree of accuracy, completeness, and range of meteorological
    forecasts.


    The COSMO model is a non-homogeneous model designed for various scientific applications
    on the meso- and scale-o. It is based on the thermo-hydrodynamic equations describing
    compressible atmosphere. All physical processes are taken into account by parameterization
    schemes. The region (shown in fig. 1) consists of 209 grid points in the east-west
    and 101 grid points in the north-south direction with resolution approximately
    14km. The number of vertical layers is 50.


    # II. NEURAL NETWORK PROCESS


    The circulating processes in the atmosphere affect meteorological values are described
    with complex mathematical models. To obtain an accurate forecast, it is necessary
    to out the atmosphere''s spatial sampling with high resolution, while microscale
    meteorological processes can be erroneously treated as subset scales. Spatial
    sampling with high resolution resources that cannot be provided except by powerful
    computer systems.


    Of course, computer systems are increasing with the development of technology,
    and in the future, may become performant sampling with high resolution and, as
    result, can achieve accurate predictions. However, such computer system will have
    a high cost, and therefore it may be unusable. It is important to develop other
    methods and techniques for obtaining predictions of higher accuracy.


    ![](img/b3ddd68c3bed4054519497a876aab20a_1_0.png)


    Fig. 1. The calculated region of the numerical weather forecasting model.


    One technique for addressing the region of a numerical model may be the use of
    machine learning, namely neural networks. Neural networks are widely used that
    is caused by the development of new learning algorithms and the increasing of
    the power of computer systems. Reason why neural networks are so popular is that
    they allow finding common attention paying to local details [4].


    Observations are made here three times i.e. at 00:00, 03:00, 06:00, 09:00, 12:00,
    15:00 and 18:00 UTC. The numerical forecast is also calculated for these times.
    We have eight days for each date: The dataset covers 489 days (from 01.07.2012
    to 01.11.2013), and consists of 392 days, 392 times.


    To create, validate, and test datasets, we split data into three subsets. The
    training dataset covers 365 days (from 01.07.2012 to 30.06.2013), the test dataset
    covers 116 days (from 01.07/2013 to 24.10.2013), and the validation


