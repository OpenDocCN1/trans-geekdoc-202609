    Among many recurrent networks, we used gated recurrent (GRU) architecture [7].\
    \ The GRU is a popular long short-term memory (LSTM), but it has fewer parameters,\
    \ and it does not face many problems in learning long-term dependencies, particularly\
    \ from vanishing and exploding gradients.\n\nGRU unit works in the following way.\
    \ At each step, it takes input vector xt, from the current step and the output\
    \ vector ht-1, from the previous one. The current output vector is calculated\
    \ as a linear interpolation between ht-1, and the current candidate vector h-t\n\
    \n```\n$h_t = (1 - z_t) \\odot h_{t-1} + z_t \\odot \\tilde{h}_t;\\;(1)$\n```\n\
    \nwhere $z_t$ is a gate vector (decides which part of the input vectors will use\
    \ the current output); $\\odot$ is a symbol for the Hadamard product. The update\
    \ vector is calculated as follows:\n\n```\n$z_t = \\sigma(W_z x_t + U_z h_{t-1}\
    \ + b_z);$\\;(2)$\n```\n\nThe current candidate vector $\tilde{h}_t$ is calculated\
    \ as the simple recurrent network (RNN):\n\n```\n$\\tilde{h}_t = \\sigma(W_h x_t\
    \ + U_h (r_t \\odot h_{t-1}) + b_h);$\\;(3)$\n```\n\nwhere $r_t$ is a reset vector.\
    \ It is calculated like $W_r, U_r, b_r$ are parameter matrices, Update and reset\
    \ gate vectors are activated with a sigmoid function, whereas the current candidate\
    \ vector is activated with a hyperbolic tangent.\n\n```\n$r_t = \\sigma(W_r x_t\
