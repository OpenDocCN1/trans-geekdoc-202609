    # IV. CONCLUSION


    Fig. 4. MSE changes for 3-day error history.


    In the current study, we introduced neural network architecture correcting the
    regional numerical models to improve the 2m temperature forecast. Hopefully, of
    other continuous meteorological quantities can capitalize on this approach.


    ![](img/b3ddd68c3bed4054519497a876aab20a_3_3.png)


    We conducted experiments with different error histories (1, 2, 3, 5, 7-day ones)
    and determined the number of epochs after which the model overfits 15 (for 1,
    2-day error histories) and 6 (for 3, 7-day error histories).


    Fig. 5. MSE changes for 5-day error history.


    We showed that the proposed architecture is possible to improve the 2m temperature
    forecast in approximately 50% of cases.


