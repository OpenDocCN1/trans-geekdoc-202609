  \ \nNumber of Fisher Scoring iterations: 12\n```\n\n在该输出中，我们首先看到的是*调用 (call)*。这是\
  \ R 在提醒我们运行了什么模型以及传递了它哪些参数。输出显示的下一个内容是离差残差（deviance residuals）的分布。对于逻辑回归，这些指标并不重要。如果我们使用\
  \ `glm()` 函数进行线性回归，那么我们期望这些残差呈正态分布。我们通过比较 `1Q` 和 `3Q` 绝对值的差异来从离差残差评估这一点。这些数字越接近，残差越符合正态分布。\n\
  \n#### 系数\n\n输出的下部分是模型系数。这些与我们在第 4 章中在线回归中看到的类似。此部分列出了模型中使用的预测变量（包括截距）、每个预测变量的估计系数、标准误差、z\
  \ 值、p 值以及每个预测变量的显著性。\n\n\n\n\n\n在线性回归中，我们将模型系数解释为特定预测变量发生单位变化时响应变量值的平均变化。然而，在逻辑回归中，我们将模型系数解释为预测变量发生单位变化时响应变量对数比（log-odds）的变化（参见公式\
  \ 5.8）。例如，`averageGiftAmount` 系数的值为 0.0369957，意味着 `averageGiftAmount` 每增加一个单位，`respondedMailing`\
  \ 为 `TRUE` 的对数比就会变化 0.0369957。这种解释可能有些困惑且不自然，因此我们可以通过解释几率（odds）的变化而非对数比来采取不同的解释。为了做到，我们需要使用\
  \ `exp()` 和 `coef()` 函数对系数进行指数运算。转换 `averageGiftAmount` 变量的系数，我们执行以下操作：\n\n```\n\
  > exp(coef(donors_mod1)[\"averageGiftAmount\"])\n\naverageGiftAmount \n        \
  \ 1.037689 \n```\n\n现在，我们可以该系数解释为：假设所有其他预测变量保持不变，`averageGiftAmount` 每增加一个单位，捐者响应该活动的几率增加\
  \ 1.037689 倍。注意，`averageGiftAmount` 的系数是正数。这导致了大于 1 的几率比，代表事件发生几率的增加。然而，如果我们解释如\
  \ `monthsSinceLastDonation` 等变量的负系数，会得到以下结果：\n\n```\n> exp(coef(donors_mod1)[\"\
  monthsSinceLastDonation\"])\n\nmonthsSinceLastDonation \n               0.961289\n\
  ```\n\n我们可以将此值解释为：假设所有其他预测变量保持不变，捐者距离上次捐赠的时间每增加一个月（`monthsSinceLastDonation`），其响应该活动的几率就会减少到\
  \ 0.961289 倍。在这里我们看到，负值系数会导致事件发生几率的下降。注意，我们查看的两个示例 `averageGiftAmount` 和 `monthsSinceLastDonation`\
  \ 都是连续型特征。在解释分类特征的系数时，我们是相对于基准（baseline）进行的。例如，对于 `incomeRating` 变量，我们的模型列出了六个针对\
  \ `incomeRating` 级别 2 到 7 的虚拟变量。这意味着 `incomeRating` 级别 1 是该变量的基准（或参考）。为了解释 `incomeRating`\
  \ 级别 2 的系数（`incomeRating2`），我们使用之前相同的指数过程来获取几率。\n\n```\n> exp(coef(donors_mod1)[\"\
  incomeRating2\"])\n\nincomeRating2 \n     1.324102\n```\n\n这一次，我们将结果解释为：在保持所有其他因素不变的情况下，收入\
  \ rating 为 2 的捐者相对于收入 rating 为 1（基准）的捐者，响应该活动的几率增加了（1.324102）。换句话说，收入 rating 为 2\
  \ 的捐者响应活动的概率高于收入 rating 为 1 的捐者。\n\n### 诊断\n\n模型输出的其他部分包含了关于模型的额外诊断信息。第一部分指出“二项族离散参数取值为\
  \ 1”。这意味着添加了一个额外的缩放参数来帮助拟合模型。对于解释模型来说这不是重要信息，可以忽略。\n\n### 空模型与残差离差（Null and Residual\
  \ Deviance）\n\n`null deviance` 指明模型仅使用截距项预测响应变量的效果如何。该数值越小越好。`residual deviance`\
  \ 量化了模型不仅使用截距项还使用包含的预测变量预测响应变量的效果。空离差与残差离差值之间的差异表示包含预测变量后模型性能提升了多少。空离差与残差离差之间的差异越大，效果越好。\n\
  \n### AIC\n\nAIC 是赤池信息量（Akaike Information Criterion）。它是对模型解释数据变异性能力的量化。在比较两个从相同数据构建的模型时，经常使用\
  \ AIC。在比较两个模型时，优先选择 AIC 较低的模型。\n\n最后一项诊断“Fisher 评分迭代次数”（Number of Fisher Scoring\
  \ iterations）仅指示模型拟合所需的时间。这对解释模型并不重要，大多数情况下可以安全地忽略。\n\n### 预测准确性\n\n到目前为止，我们使用训练数据构建了一个逻辑回归模型。我们评估并解释了模型的输出，包括系数和诊断信息。接下来我们需要做的是评估模型在实际预测样本外观测响应方面的性能。这涉及使用我们的模型预测测试数据（`donors_test`）中的\
  \ `respondedMailing`。为此，我们将使用 `stats` 包中的 `predict()` 函数。该函数接受三个参数：第一个参数是我们的模型（`donors_mod1`），第二个参数是测试数据（`donors_test`），第三个参数是所需的预测类型（`type\
  \ = 'response'`）。\n\n```\n> donors_pred1 <- predict(donors_mod1, donors_test, type\
  \ = 'response')\n\nError in model.frame.default(Terms, newdata, na.action, xlev\
  \ = object$levels) : \nfactor state has new levels\n```\n\n我们得到了错误。不需要报警。错误只是告诉我们测试数据中的某些水平不在训练集中。记得我们使用了随机采样方法创建训练和测试数据集。这种方法正如名称所示是完全随机的，不能保证两个数据集具有相同的特征值。在本示例中，我们的训练集不包含佛蒙特州、西弗吉尼亚州、新罕布什尔州或英尔维群岛，但测试集中包含了这些地区。由于模型无法对包含这些值的记录进行预测。解决此问题的简单方法是从测试数据中删除这些观测值。首先，让我们识别这些观测值：\n\
  \n```\n> filter(donors_test, state==\"VT\" | state==\"WV\" | state==\"NH\" | state==\"\
  VI\")\n\n# A tibble: 7 x 22\n    age numberChildren incomeRating wealthRating mailOrder...\
  \ totalGivingAm...\n  <dbl>       <dbl> <fct>     <fct>               <dbl>    \
  \       <dbl>\n1  48             1 4         UNK                     0         \
  \    193\n2  68             1 4         2                       0             73\n\
  3  30             1 4         7                       4             43\n4  62.0\
  \           1 UNK       UNK                     0             35\n5  34        \
  \     1 7         7                       1              15\n6  62.0           1\
  \ UNK       UNK                     0              22\n7  73             1 1   \
  \      2                       4             105\n# ... with 16 more variables:\
  \ numberGifts <dbl>, smallestGiftAmount <dbl>,\n   largestGiftAmount <dbl>, averageGiftAmount\
  \ <dbl>, yearsSinceFirstDonation <dbl>,\n   monthsSinceLastDonation <dbl>, inHouseDonor\
  \ <fct>, plannedGivingDonor <fct>,\n   sweepstakesDonor <fct>, P3Donor <fct>, state\
  \ <fct>, urbanicity <fct>,\n   socioEconomicStatus <fct>, isHomeowner <fct>, gender\
  \ <fct>, respondedMailing <fct>\n```\n\n有七个受影响的记录。考虑到测试集中有 17502 个观测值，这不是一个巨大的数字。让我们删除它们：\n\
  \n```\n> donors_test <- donors_test %>%\n filter(state!=\"VT\" & state!=\"WV\" &\
  \ state!=\"NH\" & state!=\"VI\")\n```\n\n现在，我们可以重新进行预测并使用 `head()` 函数查看前六个结果。\n\n\
  \n\n\n```\n> donors_pred1 <- predict(donors_mod1, donors_test, type = 'response')\n\
  > head(donors_pred1)\n \n        1         2         3         4         5     \
  \    6 \n0.3820397 0.2585851 0.4847741 0.6231658 0.4854076 0.5445497\n```\n\n结果显示了每个观测值中\
  \ `respondedMailing` 等于 1（或 `TRUE`）的概率。在我们的输出中，例如，结果显示数据中的第 1 号捐者有 38.2% 的概率对活动做出响应，而第\
  \ 4 号捐者有 62.3% 的概率做出响应。\n\n回想一下，当我们首次介绍分类时，曾简要提到过，在预测二元事件（bi-n-ary event）的概率时，我们可以将任何小于\
  \ 0.5 的响应预测解释为 `FALSE`，将大于或等于 0.5 的响应解释为 `TRUE`。让我们在这里使用这种方法将结果转换为 1 和 0 或 `TRUE`\
  \ 和 `FALSE`。\n\n```\n> donors_pred1 <- ifelse(donors_pred1>= 0.5, 1, 0)\n> head(donors_pred1)\n\
  \ \n1 2 3 4 5 6 \n0 0 0 1 0 1\n```\n\n现在我们可以很容易地将前六个预测解释为 `FALSE`、`FALSE`、`FALSE`、`TRUE`、`FALSE`\
  \ 和 `TRUE`。为了评估模型的实际性能，让我们模型对 `respondedMailing` 的预测值与测试数据集中的实际值进行比较。为了做到这一点，我们创建一个*混淆矩阵*（confusion\
  \ matrix），它显示了预测值与实际值之间的交互。使用基础 R `table()` 函数，我们可以创建一个简单的混淆矩阵。传递给它的第一个参数是 `respondedMailing`\
  \ 的实际值向量。传递的第二个参数是模型对 `respondedMailing` 的预测值向量。\n\n```\n> donors_pred1_table <-\
  \ table(donors_test$respondedMailing, donors_pred1)\n> donors_pred1_table\n \n \
  \  donors_pred1\n        0     1\n  0 11041  5574\n  1   561   319\n```\n\n混淆矩阵的每一行代表预测类中的实例，而每一列代表实际类中的实例。例如，第一行告诉我们，模型正确预测了\
  \ 11,041 个观测值为 0，并错误地预测了 5,574 个观测值为 1。第二行告诉我们，模型错误地预测了 561 个观测值为 0，并正确预测了 319 个观测值为\
  \ 1。矩阵的对角线单元代表正确的预测；因此，为了根据混淆矩阵获得模型的准确率，我们需要对对角线元素求和，并除以测试数据中的行数。\n\n```\n> sum(diag(donors_pred1_table))\
  \ / nrow(donors_test)\n[1] 0.6493284\n```\n\n这告诉我们模型的预测准确率为 64.93%。对于我们的第一次尝试来说，这并不糟糕，但让我们看看是否可以提高模型的准确率。\n\
  \n### 改进模型\n\n在上一节中，我们成功构建了第一个逻辑回归模型。在本节中，我们将查看一些可以用来改进模型性能的步骤。\n\n#### 处理多共线性\n\
  \n与线性回归类似，逻辑回归模型中的多共线性也使得分离单个预测变量对响应的影响变得相当困难。为了识别多共线性的存在，我们首先使用相关性图。要创建相关性矩阵，我们使用\
  \ `stats` 包中的 `cor()` 函数和 `corrplot` 包中的 `corrplot()` 函数。\n\n```\n> library(stats)\n\
  > library(corrplot)\n> donors %>%\n keep(is.numeric) %>%\n cor() %>%\n corrplot()\n\
  ```\n\n图 5.4 的结果显示我们有几个特征高度相关。我们在 `totalGivingAmount`、`numberGifts` 和 `yearsSinceDonation`\
  \ 之间看到高度正相关。我们看到 `averageGiftAmount`、`smallestGiftAmount` 和 `largestGiftAmount`\
  \ 之间也有高度正相关。我们也看到一些负相关性。在 `numberGifts`、`smallestGiftAmount` 和 `averageGiftAmount`\
  \ 之间存在负相关。在 `smallestGiftAmount` 和 `yearsSinceDonation` 之间也是如此。在我们决定如何处理这些相关变量之前，让我们获取一些额外数据来支持我们的决策。\n\
