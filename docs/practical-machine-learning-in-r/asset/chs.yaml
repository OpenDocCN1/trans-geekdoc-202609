  \ 3446  Other             :  271\n Other-service  :3295   Other-relative:  981\n\
  \ (Other)        :9541\n                             \n    gender            nativeCountry\
  \     income\n Male  :21789   United-States:29169   <=50K:24719\n Female:10771 \
  \  Mexico       :  643   >50K : 7841\n                ?            :  583\n    \
  \            Philippines  :  198\n                Germany      :  137\n        \
  \        Canada       :  121\n                (Other)      : 1709\n```\n\n输出显示了每个分类特征值的分布。然而，我们只能看到每个特征的前六个值。为了获取值超过六个特征的所有值的分布，我们使用\
  \ `table()` 函数。\n\n```\n> table(select(income, workClassification))\n \nSelf-emp-not-inc\
  \          Private        State-gov      Federal-gov\n            2541         \
  \   22696             1297              960\n       Local-gov                ? \
  \    Self-emp-inc      Without-pay\n            2093             1836          \
  \   1116               14\n    Never-worked\n               7\n \n> table(select(income,\
  \ educationLevel))\n \n   Bachelors      HS-grad         11th      Masters     \
  \     9th Some-college\n        5354       10501         1175        1723      \
  \    514         7291\n  Assoc-acdm   Assoc-voc      7th-8th   Doctorate  Prof-school\
  \     5th-6th\n        1067        1382          646         413          576  \
  \        333\n        10th     1st-4th    Preschool        12th\n         933  \
