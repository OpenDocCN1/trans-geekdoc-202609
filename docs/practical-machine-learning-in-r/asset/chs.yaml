  \ 63   Min.   :0.0000\n TRUE :337      1st Qu.:0.0000   Flat       :345   1st Qu.:0.0000\n\
  \ NA's : 55      Median :0.5000   Upsloping:203   Median :0.0000\n Mean   :0.8788\
  \   NA's       :309   Mean   :0.6764\n 3rd Qu.:1.5000                     3rd Qu.:1.0000\n\
  \ Max.   :6.2000                     Max.   :3.0000\n NA's   :62               \
  \           NA's   :611\n            defectType  heartDisease\n FixedDefect    \
  \ :46   FALSE:411\n Normal          :196   TRUE :509\n ReversibleDefect:192\n NA's\
  \            :486```\n\n我们的输出显示数据中有一些缺失值。它显示某些数值特征的范围比其他特征宽。在上一章中，应用 `k`-NN 方法之前，我们需要填充缺失值并对数据进行标准化。朴贝叶斯方法不需要做这些任何一种。朴贝叶斯分类器忽略缺失数据，并且不需要将特征值标准化。\n\
  \n我们流程的下一步是划分数据。与第 6 章类似类似，我们使用 `sample()` 函数将 75% 的数据作为训练集，剩下的 25% 作为测试集。\n\n```\n\
  > set.seed(1234)\n> sample_set <- sample(nrow(heart), round(nrow(heart)*.75), replace\
  \ = FALSE)\n> heart_train <- heart[sample_set, ]\n> heart_test <- heart[-sample_set,\
  \ ]\n> round(prop.table(table(select(heart_train, heartDisease))),2)\n FALSE .45\
  \ .55\n> round(prop.table(table(select(heart_test, heartDisease))),2)\n FALSE .43\
  \ .57\n```\n\n输出显示我们的划分（`heart_train` 和 `heart_test`）的类别分布与原始数据集（`heart`）相似，因此我们的数据没有不平衡问题。我们可以继续了。\n\
  \n### 构建模型\n\n与之前类似，我们使用 `e101` 包中的 `naiveBayes()` 函数来训练模型。\n\n```\n> library(e101)\n\
  > heart_mod <- naiveBayes(heartDisease ~ ., data = heart_train, laplace = 1)\n```\n\
  \n要查看模型生成的概率，只需调用模型。\n\n```\n> heart_mod\nNaive Bayes Classifier for Discrete Predictors\n\
  Call:\nnaiveBayes.default(x = X, y = Y, laplace = laplace)\n\nA-priori probabilities:\n\
  Y\n    FALSE      TRUE\n0.452 0.54761\n```\n\n模型输出的第一组概率是每个类别的先验概率，它将其称为 A-priori\
  \ probabilities。注意这与训练数据的类别分布相同。这些概率之后，输出是每个特征的条件概率（为了简洁，我们只显示输出的一个集）。\n\n```\n\
  Conditional probabilities:\n       age\nY           [,1]     [,2]\n  FALSE .28846\
  \ .31624\n  TRUE .51640 .61843\n       sex\nY            male    female\n  FALSE\
  \ .2197452 .7802548\n  TRUE .2210526 .778947\n       painType\nY       Typical Angina\
  \ Asymptomatic Non-Anginal Pain Atypical Angina\n  FALSE .05696203 .26265823 .32594937\
  \ .3544038\n  TRUE .0445026 .76178010 .16230366 .0314361\n       restingBP\nY  \
  \         [,1]     [,2]\n  FALSE 129.0404 163.3849\n  TRUE 133.0632 120.7387\n```\n\
  \n这些条件概率的格式取决于特征的数据类型。对于数值特征（如 `age`），输出显示每个类别值（`FALSE`, `TRUE`）特征的平均值（`[,1]`）和标准差（`[,2]`）。然而，对于离散特征（如\
  \ `sex`），输出显示每个特征值的每个类别值的条件概率。例如，输出显示 ![images](img/c07-i041.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><><><mi>s</mi><mi>e</mi><mi>x</mi><mo>=</mo><mi>m</mi><mi>a</mi><mi>l</mi><mi>e</mi><mi\
  \ encoding=\"normal\">&#124;</mi><mi>F</mi><mi>A</mi><mi>L</mi><mi>S</mi><mi>E</mi></mrow><mo>)</mo></mrow><mo>=</mo><mn>0.2197452</mn></mrow></math>\
  \ 和 ![images](img/c07-i042.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo>(</mo><><><mi>s</mi><mi>e</mi><mi>x</mi><mo>=</mo><mi>f</mi><mi>e</mi><mi>m</mi><mi>a</mi><mi>l</mi><mi>e</mi><mi\
  \ encoding=\"normal\">&#124;</mi><mi>F</mi><mi>A</mi><mi>L</mi><mi>S</mi><mi>E</mi></mrow><mo>)</mo></mrow><mo>=</mo><mn>0.7802548</mn></mrow></math>.\n\
  \n\n\n\n\n```\nheart_pred <- predict(heart_mod, heart_test, type = \"class\")\n\
  heart_pred_table <- table(heart_test$heartDisease, heart_pred)\nheart_pred_table\n\
  \ \n      heart_pred\n       FALSE TRUE\n FALSE 78  21\n TRUE  13 118\n \n> sum(diag(heart_pred_table))\
  \ / nrow(heart_test)\n \n[1] 0.8521739\n```\n\n我们的结果显示，模型的预测准确率为 85.2%。这非常不错，并且略优于我们针对相同数据集使用\
  \ `k`-NN 分类器时得到的 82.7% 准确率。这似乎表明如果我们只关心预测准确率，对于这个特定问题，朴素贝叶斯分类器是一个稍微好一点的方法。然而，正如我们在第\
  \ 9 章中看到的，仅凭预测准确率并不能说明问题。\n\n## 练习\n\n练习题 1 和 2 使用以下频率表。该数据收集自一家提供不同等级会员服务的健身房。标准会员允许成员每周参加三节课程。精英会员允许成员每周参加无限次数的课程。单次会员不包含任何课程，但成员可以在支付每节费用后参加课程。\n\
  \n频率表显示了健身房中购买每种会员计划的人数，按年龄（青少年、成年人或老年人）、性别（男性或女性）以及房屋所有权状况进行了划分。\n\n| 等级 | 青少年\
  \ | 成年人 | 老年人 | 男性 | 女性 | 房主 | 总计 |\n| --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| **单次** | 94 | 458 | 280 | 406 | 426 | 422 | 832 |\n| **标准** | 112 | 915\
  \ | 174 | 581 | 620 | 817 | 1201 |\n| **精英** | 20 | 250 | 95 | 60 | 305 | 270 |\
  \ 365 |\n| **总计** | 226 | 1623 | 549 | 1047 | 1351 | 1509 | 2398 |\n\n1. 健身房正在招募一位是女性成年房主的的新会员。\n\
  \    1. 计算 `Likelihood(Drop-in | Female, Adult, Homeowner)`\n    2. 计算 `Likelihood(Standard\
  \ | Female, Adult, Homeowner)`\n    3. 计算 `Likelihood(Elite | Female, Adult, Homeowner)`\n\
  \    4. 这个人最可能选择哪种会员等级？\n\n2. <label>2</label> 健身房正在招募一位不拥有房屋的男性青少年新会员。\n    1.\
  \ 计算 `Likelihood(Drop-in | Male, Teenager, !Homeowner)`\n    2. 计算 `Likelihood(Standard\
  \ | Female, Adult, !Homeowner)`\n    3. 计算 `Likelihood(Elite | Female, Adult, !Homeowner)`\n\
  \    4. 这个人最可能选择哪种会员等级？\n\n3. <label>3</label> 在第 5 章中，我们使用逻辑回归来预测潜在客户的收入。使用相同的收入数据集，尝试使用朴素贝叶斯方法改进之前模型的预测准确率。就像我们在第\
  \ 5 章中所做的那样，将数据限制为仅分类特征，不要忘记平衡训练数据。你的预测准确率提高了吗？\n\n# 第 8 章 决策树\n\n在第 7 章中，我们引入了朴素贝叶斯分类器，这是一种利用先验概率概率告知未来事件概率的机器学习方法。在本章，我们介绍了另一种分类器，称为`决策树`。决策树分类器不是使用先验事件的概率来预测未来事件，而是使用逻辑树状结构来表示预测变量与目标结果之间的关系。\n\
  \n决策树基于分治法构建，其中原始数据集被反复分成较小的子集，直到每个子集尽可能同质。我们在章节的开头详细讨论了这种递归划分方法。在章节的后期，我们讨论了削减决策树尺寸的过程，使其更适用于广泛的用例。我们通过在\
  \ R 中训练决策树模型来结束本章，讨论了方法的优缺点，并完成了一个用例。\n\n在本章结束时，你将学习以下内容：\n\n* 决策树的基本组件以及如何解释它\n\
  * 决策树是如何根据递归划分和纯度过程构建的\n* 决策树两种最流行的实现方式以及它们在衡量纯度方面的差异\n* 为什么要以及如何对决策树进行剪枝\n* 如何在\
  \ R 中构建决策树分类器，以及如何使用它预测未见过数据的类别值\n* 决策树方法的优缺点\n\n## 预测建筑许可决策\n\n在我们在本章中探索决策树方法时，我们将使用来自加利福尼亚州洛杉矶市建筑安全局（Department\
  \ of Building and Safety）的数据集。该数据集包含了该部门做出的建筑许可决策信息，包括项目性质的信息以及许可是否通过快速的一天流程获得批准，或者是否被部门工作人员标记为需要大量审查。\n\
  \n当然，承包商希望尽可能让他们的建筑项目通过快速通道。我们的任务是分析数据，以确定许可申请的哪些特定特征使其可能通过快速通道。\n\n我们将使用的数据集作为电子资源的一部分提供。（有关访问电子资源的更多信息请参见引言。）\n\
  \n该数据集包含了分析所需的多种许可数据：\n\n* `status` 是许可申请的当前状态。其值可能是 `Finaled`、`Issued`、`Expired`\
  \ 等状态代码。\n* `permitType` 包含申请的性质。其值可能是 `Electrical`、`Building Alteration/Repair`、`Plumbing`\
  \ 等。\n* `permitsubtype` 是许可影响的建筑类型。其值可能是 `1 or 2 Family Dwelling`、`Commercial`、`Apartment`\
  \ 等。\n* `initiatingOffice` 是发起许可申请的部门所在地。\n* `ZIP` 是物业地址的邮编。\n* `Valuation` 是税收记录中的物业估值。\n\
  * `floorArea` 是物业面积的平方英尺。\n* `numberUnits` 是多单元住宅的单元数量。\n* `stories` 代表建筑的楼层。\n\
  * `contractorState` 是申请许可的承包商所在地（如果适用）。\n* `licenseType` 是承包商所持许可证类型的分类字段（如果适用）。\n\
  * `zone` 是物业的规划类别。\n* `year` 和 `month` 分别是处理许可申请的年份月份。\n* `permitCategory` 是我们要预测的变量。它包含值\
  \ `Plan Check` 或 `No Plan Check`。\n\n给定问题和提供的数据，这些是我们需要回答的一些问题：\n\n* 哪些变量对于许可申请是通过快速通道还是标记为进一步审查最具预测性？\n\
  \n\n\n\n\n*   根据我们现有的预测变量，我们能多准确地预测许可证申请是否会被标记为待审核？\n\n在本章结束时，我们将使用线性回归及相关技术回答其中的每一个问题。\n\
  \n## 决策树\n\n决策树使用类似树状的结构来表示预测变量与潜在结果之间的关系。决策树的潜在结果可以是离散的（`分类树`），也可以是连续的（`回归树`）。决策树的结构如图图\
  \ 8.1 所示，类似于倒置的字面树（或倒立的树）。它从一个被称为`根节点节点`的单一划分开始，然后随着树的分裂和生长，出现逐渐变小的划分。在树分裂的每个点上，都会根据特定预测变量的值对如何进一步划分数据做出决策。这些拆分点被称为`决策节点`，而决策节点的结果被称为`分支`。随着数据的进一步划分，每个决策节点都会产生新的分支，通向额外的决策节点，直到树终止。树的末端或终点节点被称为`叶子节点`。这些节点代表了根据从根节点通过决策节点到叶子节点所做的决策集得出的预测结果。\n\
  \n![图 8.1 决策树的结构](img/c08f001.png)\n\n图 8.1 决策树的结构\n\n图 8.1 显示了一个描述银行客户的决策树，根据其借款金额、收入以及是拥有还是租用房屋的信息，描述他们是否获得了贷款以及是否可能违约。树的逻辑可以很容易地解释为预测未来银行客户是否会对贷款违约或不违约的规则。根据该树，其中一条规则如下：\n\
  \n*   如果 (客户借款金额超过 $40,000) AND (客户拥有房屋) 则 (客户不会违约)\n\n决策树可以轻松转换为简单易于理解的 IF-THEN-ELSE\
  \ 规则，这使得它们在法律或合规原因导致透明度重要的情况下，或者在决策逻辑需要与非技术利益相关者共享的情况下，成为非常受欢迎的分类方法。\n\n两种最流行的决策树算法实现方式是分类和回归树\
  \ (CART)，它由 Breiman 等人 (1984) 引入；以及 C5.0，它是由计算机科学家 J. Ross Quinlan 开发其其原始 ID3 决策树的扩展而开发的。这两种实现方式都使用类似的建树方法，被称为递归划分。这种方法不断将数据拆分成越来越小的子集，直到满足某些停止条件。\n\
  \n## 递归划分\n\n递归划分过程从根节点的决策开始。该决策是识别哪种特征对目标结果最具预测性。为了确定这一点，算法会评估数据集中的所有特征，并尝试识别出哪一个特征会导致某种拆分，使得生成的划分包含单个类别的实例。一旦确定了候选特征，就会根据该特征的值对数据进行划分。接下来，新创建的每个划分也将根据该划分内一组实例中对目标结果最具预测性的特征进行拆分。这种划分过程会递归持续下去，直到划分中的几乎所有实例都属于同一类、数据集中的所有特征已耗尽、达到指定的树大小，或者额外的划分不再增加价值为止。\n\
  \n为了帮助说明递归划分过程，假设我们拥有关于一家小银行发放的 30 笔个人贷款的数据。数据集包含了关于借款金额、客户年收入以及客户是否对贷款违约的信息。在数据集表示的\
  \ 30 名客户中，16 人违约了，14 人没有。利用数据集中这 30 个客户的信息，我们创建了图 8.2 所示的年收入与贷款金额的散点图。我们需要做的是确定两个特征（`年收入`或`贷款金额`）哪一个对目标结果（`违约`或`不违约`）最具预测性。通过视觉观察，我们决定在\
  \ $40,000 处进行划分。我们是如何决定的？我们通过考虑贷款金额和年收入的不同值，确定在哪里画一条线，使得划分后的数据点具有同一类（参见图 8.3）。\n\
  \n![图 8.2 年收入与贷款金额的散点图（包含违约结果）](img/c08f002.png)\n\n图 8.2 年收入与贷款金额的散点图（包含违约结果）\n\
  \n![图 8.3 决策树（贷款金额少于 $40,000 的划分）](img/c08f003.png)\n\n图 8.3 决策树（贷款金额少于 $40,000\
  \ 的划分）\n\n根据我们选择的划分，我们得到了贷款金额少于 $40,000 的 14 名客户以及贷款金额不少于 $40,000 的 16 名客户。在借款少于\
  \ $40,000 的客户中，8 人没有违约，6 人违约了。对于借款超过 $40,000 的客户，10 人违约了，6 人没有。\n\n![图 8.4 决策树（贷款金额少于\
  \ $40,000 的进一步划分）](img/c08f004.png)\n\n图 8.4 决策树（贷款金额少于 $40,000 的进一步划分）\n\n我们的下一个划分是在借款少于\
  \ $40,000 的客户组内进行的。在这些客户中，我们可以将数据进一步划分为收入超过 $20,000 的和不超过此金额的。这如图图 8.4 所示。\n\n在借款少于\
  \ $40,000 且收入超过 $20,000 的客户中，7 人没有违约，1 人违约了。而在借款少于 $40,000 且收入少于 $20,000 的客户中，4\
  \ 人违约了，1 人没有。如果我们在此处停止递归划分过程，我们将生成一个如图图 8.5 所示的决策树。\n\n正如前面提到的，决策树可以相对容易地转换为指导未来业务决策的规则。根据我们的树（图\
  \ 8.5），我们通过遵循从根节点到叶子节点的分支得出以下三条规则：\n\n*   如果 (客户借款少于 $40,000) AND (客户收入超过 $20,000)\
  \ 则 (客户不会违约)。\n*   如果 (客户借款少于 $40,000) AND (客户收入少于 $20,000) 则 (客户会违约)。\n*   如果 (客户借款超过\
  \ $40,000) 则 (客户会违约)。\n\n\n\n\n\n正如你可能已经注意到的，我们在图 8.5 中的决策树与图 8.1 中的相似。唯一的区别在于，这次我们限制仅使用\
  \ `Loan Amount`（贷款金额）和 `Annual Income`（年收入）作为预测变量，而第一棵树还考虑了房屋所有权作为一个预测变量。通过在划分过程中包含房屋所有权，我们可以确保分区中相同类别的数据点占比更高，从而提高树的准确性。然而，这并不总是建议的，因为它可能导致`overfitting`（过拟合）。正如我们在第\
  \ 1 章中所讨论过的，当模型过拟合时，它泛化到广泛问题的能力就会降低。\n\n![图 8.5 基于贷款金额和年收入的银行客户决策树。每个决策和叶节点节点显示违约（红色数字）和未违约（绿色数字）的客户人数。](img/c08f005.png)\n\
  \n**图 8.5** 基于贷款金额和年收入的银行客户决策树。每个决策和叶节点显示违约（红色数字）和未违约（绿色数字）的客户人数。\n\n在我们刚刚过的示例中，我们尝试对数据进行划分，使得每个分区中的数据大部分属于同一类别。我们通过视觉检查手动完成了此。决策树算法在尝试确定最佳划分时也会执行类似的操作。它们使用通常称为`purity`（纯度）或`impurity`（不纯度）的定量衡量标准。在这里，纯度是指分区内数据点属于同一类的程度。所有数据点都属于同一类的分区被认为是纯的，而一半数据点属于一个类别、另一半属于另一个类别的分区被认为是不纯的。通常来说，类别的主导地位越高，分区越纯；单一类别的主导地位越低，分区越不纯。因此，为了找到最佳划分，决策树算法尝试找到新分区内不纯度最少的划分。\n\
  \n决策树算法常用的不纯度定量标准有几种。最常见的两种是`entropy`（熵）和`Gini`（基尼）。正如我们之前提到的，两种最流行的决策树实现是 C5.0\
  \ 和 CART。这两个算法的区分特征之一是它们使用的不纯度衡量标准。C5.0 算法使用`entropy`作为不纯度衡量标准，而 CART 算法使用`Gini`。在接下来的几节中我们将解释这两个衡量标准背后的原理以及它们如何在递归划分过程中使用。\n\
  \n### Entropy\n\n熵是一个借自信息论的概念，应用于决策树时，它代表分区内部不纯度或随机性水平的定量。分区内的不纯度越高，该分区的熵值越高，反之亦然。在数学上，对于具有类别级别的分区\
  \ ![images](img/c08-i0001.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>D</mi></math> ，![images](img/c08-i0002.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>i</mi><mo>=</mo><mn>1</mo><mspace=\"0.25em\"/><mspace=\"0.25em\"/><mn>2</mo><mspace=\"\
  0.25em\"/><mo>&#830;</mo><mspace=\"0.25em\"/><mspace=\"0.25em\"/><mi>n</mi></math>，熵定义如下：\n\
  \n(8.1![images](img/c08-disp-0001.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi> <mspace\
  \ width=\"0\"/> <mrow><mo>(<mi>D</mi></mo></mrow> <mo>=</mo> <mo>&#8722;</mo> <mrow><sum\
  \ display=\"true\"0=\"10\"><mo>&#8721;</mo> <mrow><mi>i</mi><mo>=</mo><mn>1</mo><mspace=\"\
  0.25em\"/><mspace=\"0.25em\"/><mrow><mi>log</mi><mn>2</msub> <mo>(</mrow><msub>p</mi</msub></mo></mrow></math>\n\
  \n其中，![images](img/c08-i0003.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub>p</mi</msub></mrow></math> 表示标签为 ![images](img/c08-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>i</mi></math> 的数据点比例。当分区内的所有点属于同一类时，熵值从\
  \ 0 到 ![images](img/c08-i0005.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub>log</mi><mn>2</msub> <mo>(</mrow><mi>n</mi></mo></mo></math>当 `n` 个类别在分区中均匀分布时（![images](img/c08-i0006.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>n</mi></math>），因此对于有两个结果（`Default`\
  \ 和 `Not Default`）的银行客户，![images](img/c08-i007.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>n</mi></math> 等于 2。这意味着其分区的熵值将从 0 到 ![images](img/c08-i008.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</msub><mn>2</mrow></math>。\n\
  \n在使用 30 位银行客户的贷款数据演示递归划分过程期间，我们得到了一个 16 位贷款金额超过 40,000 美元的客户分区（参见图 8.4 和 8.5）。在这些客户中，10\
  \ 位没有违约贷款，6 位违约了。从该分区中数据点的比例来看，我们可以说有 62.5% 的 `Not Default` 和 37.5% 的 `Default`。因此，使用公式\
  \ 8.1，该分区的熵值如下：\n\n(8.2)![images](img/c08-disp-0002.png)<math display=\"block\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi>\
  \ <mspace width=\"0\"/> <mrow><mo>(<mi>D</mi></mo></mrow> <mo>=</mo> <mo>&#8722;</mo>\
  \ <mrow><mo>\\[</mo> <mrow><mn>.625</mn> <mo>&#215;</mo> <mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</msub>\
  \ <mo>(</mrow><mn>.625</mn> <mo>)</mo> <mo>+</ <mn>.375</mn> <mo>&#215;</mo> <mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</msub>\
  \ <mo>(</mrow><mn>.375</mn> <mo>)</mo> </mrow> <mo>\\]</mo> </mrow> <mo>=</mo> <mn>0.9544</mn>\
  \ </mrow></math>\n\n\n\n\n正如我们之前提到的，具有两个可能值的划分的最大熵为 1。因此，熵值 ![images](img/c08-i0009.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>0.9544</mn></math> 告诉我们，该划分中的不纯度很高。这表明树可以通过额外的划分从中获益。\n\
  \n### 信息增益\n\n现在，假设我们继续上一个示例中的递归划分过程。我们希望对贷款金额超过 $40,000 的客户数据点进行进一步划分，以最小化熵。为了实现这一点，决策树算法将评估所有特征及其对应值，以确定哪种划分会导致熵的最大程度减少。这种熵的减少被测量为划分前的熵\
  \ ![images](img/c08-i0010.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>D</mi><mn>1</mn></msub></mrow></math> 与划分后划分组合熵 ![images](img/c08-i0011.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>D</mi><mn>2</mn></msub></mrow></math>\
  \ 之间的差异。这种测量方法被称为 `information gain`（信息增益）。数学上，通过特定特征 ![images](img/c08-i0012.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>F</mi></math> 划分的信息增益计算如下：\n\n\
  (8.3)![images](img/c08-disp-0003.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>I</mi> <mi>n</mi> <mi>f</mi> <mi>o</mi> <mi>r</mi> <mi>m</mi> <mi>a</mi>\
  \ <mi>t</mi> <mi>i</mi> <mi>o</mi> <mi>n</mi> <mi>G</mi> <mi>a</mi> <mi>i</mi> <mi>n</mi>\
  \ <mspace width=\"thickmathspace\"/> <mrow> <mo>(</mo> <mi>F</mi> <mo>)</mo> </mrow>\
  \ <mo>=</mo> <mi>E</mi> <mi>n</mi> <mi>t</mi> <mi>r</mi> <mi>o</mi> <mi>p</mi> <mi>y</mi>\
  \ <mrow> <mo>(</mo> <mrow> <msub> <mi>D</mi> <mn>1</mn> </msub> </mrow> <mo>)</mo>\
  \ </mrow> <mspace width=\"0.25em\"/> <mo>&#8722;</mo> <mspace width=\"0.25em\"/>\
  \ <mi>E</mi> <mi>n</mi> <mi>t</mi> <mi>r</mi> <mi>o</mi> <mi>p</mi> <mi>y</mi> <mrow>\
  \ <mo>(</mo> <mrow> <msub> <mi>D</mi> <mn>2</mn></msub></mrow> <mo>)</mo> </mrow></math>\n\
  \n注意的是，![images](img/c08-i0013.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>E</mi> <mi>n</mi> <mi>t</mi> <mi>r</mi> <mi>o</mi> <mi>p</mi> <mi>y</mi><mspace\
  \ width=\"eqnarray\"/><mrow><mo}(\\mo><mrow><msub><mi>D</mi> <mn>2</mn></msub></mrow><mo>)</mo></mrow></math>\
  \ 是划分后所有划分的组合熵。因此，它是通过每个新划分熵的加权和计算的，其中权重 `![images](img/c08-i0014.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mi>w</mi><mi>i</mi></msub></mrow></math>`\
  \ 是基于划分 ![images](img/c08-i0015.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow></math>` 中数据点的比例的。`![images](img/c08-i0016.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>E</mi> <mi>n</mi> <mi>t</mi>\
  \ <mi>r</mi> <mi>o</mi> <mi>p</mi> <mi>y</mi><mspace width=\"eqnarray\"/><mrow><mo}(\\\
  mo><mrow><msub><mi>D</mi> <mn>2</mn></msub></mrow><mo>)</mo></mrow></math>` 的计算方式如下：\n\
  \n(8.4))![images](img/c08-disp-0004.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>E</mi> <mi>n</mi> <mi>t</mi> <mi>r</mi> <mi>o</mi> <mi>p</mi> <mi>y</mi><mspace\
  \ width=\"eqnarray\"/><mrow><mo}(\\mo><mrow><msub><mi>D</mi> <mn>2</mn></msub></mrow><mo>)</mo></mrow></math>\
  \ <mo>=</mo><mrow><mo><msub><mi>w</mi><mi>i</mi></msub></mo><mo><msub><mi>D</mi>\
  \ <mn>2</mn></msub><msub><mi>P</mi><mi>i</msub></mrow></math> \n\n考虑到这一点，为了进一步划分数据，假设我们需要考虑两个特征——贷款等级和房屋所有权。与我们之前看到的特征（贷款金额和年收入）不同，这些新特征是离散的。贷款等级有两个可能的值（A\
  \ 和 B），房屋所有权也有两个可能的值（自有和租赁）。为了划分数据，决策树算法需要评估按贷款等级划分的信息增益，并将其与房屋所有权划分的信息增益进行比较。任何产生最高信息增益（或熵减少）的划分将被选为最佳划分。\n\
  \n图 8.6 显示了我们正在考虑的两种可能的划分选项，以及按类别标签进入每个划分的数据点数量。\n\n![图 8.6 用于贷款超过 $40,000 客户划分的候选特征。每个决策节点和叶子节点显示了违约的人数（红色数字）和未违约的人数（绿色数字）。](img/c08f006.png)\n\
  \n\n\n\n![images](img/c08-disp-0005.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi><mspace\
  \ width=\"thickmathspace\"/><mrow><mo>(</mo><mrow><mi>G</mi><mi>r</mi><mi>a</mi><mi>d</mi><mi>e</mi><mspace\
  \ width=\"eqnarray\"/><mi>A</mi></mrow><mo>)</mo></mrow></mrow></math> (8.5)![images](img/c08-disp-0006.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mo>=</mo> <mo>&#8722;</mo>\
  \ <mrow> <mo>\\[</mo> <mrow> <mfrac bevelled=\"true\"><mn>3</mn> <mn>6</mn> </mfrac>\
  \ <mo>&#215;</mo> <mi>l</mi> <mi>o</mi> <msub> <mi>g</mi> <mn>2</mn> </msub> <mrow>\
  \ <mo>(</mo> <mrow> <mfrac bevelled=\"true\"><mn>3</mn> <mn>6</mn> </mfrac> </mrow>\
  \ <mo>)</mo> </mrow> <mo>+</mo> <mfrac bevelled=\"true\"><mn>3</mn> <mn>6</mn> </mfrac>\
  \ <mo>&#215;</mo> <mi>l</mi> <mi>o</mi> <msub> <mi>g</mi> <mn>2</mn> </msub> <mrow>\
  \ <mo>(</mo> <mrow> <mfrac bevelled=\"true\"><mn>3</mn> <mn>6</mn> </mfrac> </mrow>\
  \ <mo>)</mo> </mrow> </mrow> <mo>\\]</mo> </mrow> <mo>=</mo> <mn>1</mn> <mspace\
  \ width=\"thickmathspace\"/> </mrow> </math\n\n注意，对于这次划分，每个类别的代表性相等，这意味着熵将达到最大值。在这种情况下，该值为\
  \ 1。这被解释为该划分处于最大不纯状态。现在，让我们看看右侧的划分（贷款等级 = B）。划分后，该划分在 10 个客户中有 3 个没有违约贷款， 10 个客户中有\
  \ 7 个违约了。因此，该划分的熵如下：\n\n![images](img/c08-disp-0007.png)<math display=\"block\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi><mspace\
  \ width=\"eqnarray\"/><mrow><mo>(</mo><mrow><mi>G</mi><mi>r</mi><mi>a</mi><mi>d</mi><mi>e</mi><mspace\
  \ width=\"eqnarray\"/><mi>B</mi></mrow><mo>)</mo></mrow></mrow></math> (8.6)![images](img/c08-disp-0008.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mo>=</mo> <mo>&#8722;</mo>\
  \ <mrow> <mo>\\[</mo> <mrow> <mfrac bevelled=\"true\"><mn>3</mn> <mn>10</mn> </mfrac>\
  \ <mo>&#215;</mo> <mi>l</mi> <mi>o</mi> <msub> <mi>g</mi> <mn>2</mn> </msub> <mrow>\
  \ <mo>(</mo> <mrow> <mfrac bevelled=\"true\"><mn>3</mn> <mn>10</mn> </mfrac> </mrow>\
  \ <mo>)</mo> </mrow> <mo>+</mo> <mfrac bevelled=\"true\"><mn>7</mn> <mn>10</mn>\
  \ </mfrac> <mo>&#215;</mo> <mi>l</mi> <mi>o</mi> <msub> <mi>g</mi> <mn>2</mn> </msub>\
  \ <mrow> <mo>(</mo> <mrow> <mfrac bevelled=\"true\"><mn>7</mn> <mn>10</mn> </mfrac>\
  \ </mrow> <mo>)</mo> </mrow> <mo>\\]</mo> </mrow> 0.8813</mrow> </math>\n\n从 `公式\
  \ 8.4` 中，我们知道划分后的组合熵 `![images](img/c08-i019.png)<math display=\"inline\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow>D_2</mrow></math>` 是每个新划分熵的加权和，其中权重 `![images](img/c08-i020.png)<math display=\"\
  inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow>w_i</mrow></math>` 是原始数据在每个划分中的比例。划分前的 16 个客户中，有 6 个（37.5%）在左划分（贷款等级 = A），而\
  \ 10 个（62.5%）在右划分（贷款等级 = B）。划分后的组合熵为：\n\n![images](img/c08-disp-0009.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi><mspace\
  \ width=\"eqnarray\"/><mrow><mo>(</mo><msub>D</mi><mn>2</msub></mo>)</mo></mrow></math>\
  \ ![images](img/c08-disp-0010.png)<math display=\"block\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mo>=</mo><mrow><mo>(</mo><mn>0.375</mn><mspace width=\"0.25em\"/><mspace=\"\
  0.25em\"/><mo>&#215;</mo><mspace width=\"0.25em\"/><mspace=\"0.25em\"/><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi>mo>(</mo><mrow><mi>G</mi><mi>r</mi><mi>a</mi><mi>d</mi><mi>E</mi><mspace\
  \ width=\"eqnarray\"/><mi>A</mi></mrow><mo>)</mo><mo>+</mo><mn>0.625</mn><mspace\
  \ width=\"0.25em\"/><mspace=\"0.25em\"/><mo>&#215;</mo><mspace width=\"0.25em\"\
  /><mspace=\"0.25em\"/><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi>momomo><mrow><mi>G</mi><mi>r</mi><mi>a</mi><mi>d</mi><mi>e</mi><mspace\
  \ width=\"eqnarray\"/><mi>B</mi></mrow><mo>)</mo</mo>)</mo></mrow></math> ![![images](img/c08-disp-0011.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mo>=</mo><mrow><mo>(</mo><mn>0.375</mn><mspace\
  \ width=\"0.25em\"/><mspace=\"0.25em\"/><mo>&#215;</mo><mspace width=\"0.25em\"\
  /><mspace=\"0.25em\"/><mn>1</mn><mspace width=\"0.25em\"/><mspace=\"0.25em\"/><mo>+</mo><mspace\
  \ width=\"0.25em\"/><mspace=\"0.25em\"/><mn>0.625</mn><mspace width=\"0.25em\"/><mspace=\"\
  0.25em\"/><mo>&#215;</mo><mspace width=\"0.25em\"/><mspace=\"0.25em\"/><mn>0.8813</mnmomomo>)</mo></mrow></math>\
  \ (8.7)![images](img/c08-disp-0012.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mo>=</mo><mn>0.9258</mn> </mrow> </math\n\n现在有了划分前的熵和划分后的组合熵，可以按如下方式计算贷款等级划分的信息增益：\n\
  \n(8.8)![images](img/c08-disp-0013.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>I</mi><mi>n</mi><mi>f</mi><mi>o</mi><mi>r</mi><mi>m</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi><mi>G</mi><mi>a</mi><mi>i</mi><mi>n</mi>\
  \ <mspace width=\"eqnarray\"/> <mrow> <mo>(</mo><mrow> <mi>L</mi><mi>o</mi><mi>a</mi><mi>n</mi>\
  \ <mi mathvariant=\"normal\">&#160;</mi> <mi>G</mi><mi>r</mi><mi>a</mi><mi>d</mi><mi>e</mi>\
  \ </mrow> <mo>)</mo> </mrow> <mo>=</mo> <mn>0.9544</mn> <mo>&#8722;</mo> <mn>0.9258</mn>\
  \ <mo>=</mo> <mn>0.0286</mn> </mrow> </math> \n\n让我们对基于房屋所有权的划分执行相同的步骤，以获得该划分的信息增益。\n\
  \n\n\n\n\n![images](img/c08-disp-0014.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>E</mi><mi>n</mi><mi>t</mi><mi>r</mi><mi>o</mi><mi>p</mi><mi>y</mi><mspace\
  \ width=\"eqnarray\"/><mrow><mo>(</mo><mrow><mi>O</mi><mi>w</mi><mi>n</mi></mrow><mo>)</mo></mrow></mrow></math>\
  \ ![images](img/c08-disp-0015.png)<math display=\"block\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
