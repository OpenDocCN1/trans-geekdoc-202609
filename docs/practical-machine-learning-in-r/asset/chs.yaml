  \ <mo> <> < <> < <>></mi> < <>1</> <msub> <mi> <normal>12> <mi> <msub> <mi> <mi>\
  \ <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi>\
  \ <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi>\
  \ <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi < <mi < <mi < <mi < <mi <mi>\
  \ <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> <mi> </mi> <mo>momo>\
  \ </mo></mrow></math>\n\n让我们通过一个例子来演示。为了帮助说明，我们展示了一个表格，显示了垃圾邮件和正常邮件中包含单词 `coffee`,\
  \ `free`, 和 `sale` 的数量。\n\n| 类别 | 是 | 否 |\n| --- | --- | --- |\n| 垃圾邮件 | 10 | 20\
  \ |\n| 垃圾邮件 | 4 | 16 |\n| 垃圾邮件 | 10 | 12 |\n| 正常邮件 | 15 | 80 |\n| 正常邮件 | 2 | 78\
  \ |\n| 正常邮件 | 25 | 75 |\n\n注意，频率表不是单词出现次数计数，而是出现该单词的邮件计数。因此，如果一个单词在一封邮件中出现多次，它只被计数一次。例如，第一行显示在\
  \ 20 封垃圾邮件中，`coffee` 至少出现一次，在另外 10 封中没有出现。最后一行显示在 80 封正常邮件中，`sale` 至少出现了 5 次。\n\n\
  现在假设我们收到一封“The Great Sale!”的新邮件。我们如何分类这封邮件？去掉标点和停用词后，我们剩下三个单词：`coffee`, `great`,\
  \ `sale`。根据频率表并使用朴素贝叶斯方法，我们需要首先计算在包含 `coffee`、`great` 和 `sale` 但不包含 `free` 的情况下，邮件是垃圾邮件的概率（![images](img/c07-i0034.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mo>&#172;</mo><mi>f</mi><mi>r</mi><mi>e</mi><mi>e</mi></mrow></math>）。这表示如下：\n\
  \n(7.7)![images](img/c07-disp-0011.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>P</mi> <mrow> <mo>(</mo> <mrow> <msub> <mi>x</mi> <mi>n</mi> </msub>\
  \ <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>C</mi> <mi>k</mi> </msub> </mrow>\
  \ <mo>)</mo> </mrow> </math> \n\n我们还需要计算在包含 `coffee`、`great` 和 `sale` 但不包含 `free`\
  \ 的情况下，邮件是正常邮件的概率（![images](img/c07-i0035.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mo>&#172;</mo><mi>f</mi><mi>r</mi><mi>e</mi><mi>e</mi></mrow></math>）。\n\
  \n\n\n\n### (7.8)![images](img/c07-disp-0013.png)<math display=\"block\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>P</mi> <mrow> <mo>(</mo> <mrow> <mi>h</mi> <mi>a</mi> <mi>m</mi> <mi\
  \ mathvariant=\"normal\">&#124;</mi> <mi>c</mi> <mi>o</mi> <mi>f</mi> <mi>f</mi>\
  \ <mi>e</mi> <mi>e</mi> <mo>,</mo> <mo>&#172;</mo> <mi>f</mi> <mi>r</mi> <mi>e</mi>\
  \ <mi>e</mi> <mo>,</mo> <mi>g</mi> <mi>r</mi> <mi>e</mi> <mi>a</mi> <mi>t</mi> <mo>,</mo>\
  \ <mi>s</mi> <mi>a</mi> <mi>l</mi> <mi>e</mi> </mrow> <mo>)</mo> </mrow> </mrow>\
  \ </math> ![images](img/c07-disp-0014.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mrow><mo>(</mo> <mrow><mi>h</mi> <mi>a</mi>\
  \ <mi>m</mi></mrow><mo>)</mo></mrow><mi>P</mi><mrow><mo>(</mo> <mrow><mi>c</mi>\
  \ <mi>o</mi> <mi>f</mi> <mi>f</mi> <mi>e</mi> <mi>e</mi><mi mathvariant=\"normal\"\
  >&#124;</mi><mi>h</mi> <mi>a</mi> <mi>m</mi></mrow><mo>)</mo></mrow><mi>P</mi><mrow><mo>(</mo>\
  \ <mrow><mo>&#172;</mo> <mi>f</mi> <mi>r</mi> <mi>e</mi> <mi>e</mi><mi mathvariant=\"\
  normal\">&#124;</mi><mi>h</mi> <mi>a</mi> <mi>m</mi></mrow><mo>)</mo></mrow><mi>P</mi><mrow><mo>(</mo>\
  \ <mrow><mi>g</mi> <mi>r</mi> <mi>e</mi> <mi>a</mi> <mi>t</mi><mi mathvariant=\"\
  normal\">&#124;</mi><mi>h</mi> <mi>a</mi> <mi>m</mi></mrow><mo>)</mo></mrow><mi>P</mi><mrow><mo>(</mo>\
  \ <mrow><mi>s</mi> <mi>a</mi> <mi>l</mi> <mi>e</mi><mi mathvariant=\"normal\">&#124;</mi><mi>h</mi>\
  \ <mi>a</mi> <mi>m</mi></mrow><mo>)</mo></mrow></mrow><mrow><mi>P</mi><mrow><mo>(</mo>\
  \ <mrow><mi>c</mi> <mi>o</mi> <mi>f</mi> <mi>f</mi> <mi>e</mi> <mi>e</mi><mi mathvariant=\"\
  normal\">,&#160;</mi><mo>&#172;</mo> <mi>f</mi> <mi>r</mi> <mi>e</mi> <mi>e</mi><mi\
  \ mathvariant=\"normal\">,&#160;</mi> <mi>g</mi> <mi>r</mi> <mi>e</mi> <mi>a</mi>\
  \ <mi>t</mi><mi mathvariant=\"normal\">,&#160;</mi> <mi>s</mi> <mi>a</mi> <mi>l</mi>\
  \ <mi>e</mi></mrow><mo>)</mo></mrow></mrow></mfrac></mrow></math>\n\n消息为垃圾邮件的条件概率（公式\
  \ 7.7）应当与消息为非垃圾邮件的条件概率（公式 7.8）进行比较。由于这两个公式的分母相同，我们忽略它们以简化计算，并仅关注分子。在去了分母后，我们现在将这两项计算分别称为垃圾邮件的似然（likelihood）和非垃圾邮件的似然。\n\
  \n特定消息为垃圾邮件的概率是其为垃圾邮件的似然除以其总似然。同样，特定消息为非垃圾邮件的概率是其为非垃圾邮件的似然除以其总似然。根据频率表中的值，我们可以如下计算消息为垃圾邮件的似然：\n\
  \n(7.9)![images](img/c07-disp-0015.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mo>(</mo> <mrow><mfrac><mn>20</mn> <mn>100</mn></mfrac></mo>)</mo></mrow>\
  \ <mspace width=\"0.25em\"><mo>&#172;</mo> <mspace width=\"0.25em\"/><mspace width=\"\
  0.25em\"><mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi> <mi math=\"\
  normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>10</mn> <mn>20</mn></mfrac></mo>)</mo></mrow><mi\
  \ math=\"normal\">8022</mi><mi math=\"normal\">8002</mi><mi math=\"normal\">8002</mi><mi\
  \ math=\"normal\">8002</mi><mrow> <mo><mo> <mo> <mo> <mo> <mfrac><mn>16</mn> <mn>20</mn></mfrac></mo>)</mo></mrow>\
  \ <mspace width=\"0.25em\"><mo>&#172;</mo> <mspace width=\"0.25em\"/><mspace width=\"\
  0.25em\"><mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi> <mi math=\"\
  normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>10</mn> <mn>20</mn></mfrac></mo>)</mo></mrow>\
  \ 0.2><mspace width=\"0.25em\"><mo>&#172;</mo> <mspace width=\"0.25em\"/><mspace\
  \ width=\"0.25em\"><mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi> <mi\
  \ math=\"normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>8</mn> <mn>20</mn></mfrac></mo>)</mo></mrow>\
  \ 8202/8202/8202 = 0.016</mn></mrow></math> 而消息为非垃圾邮件的似然计算如下：\n\n(7.10)![images](img/c07-disp-0016.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mo>(</mo> <mrow><mfrac><mn>80</mn>\
  \ <mn>100</mn></mfrac></mo>)</mo></mrow> <mspace width=\"0.25em\"><mo>&#172;</mo>\
  \ <mspace width=\"0.25em\"/><mspace width=\"0.25em\"><mi math=\"normal\">8202</mi>\
  \ <mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>15</mn>\
  \ <mn>80</mn></mfrac></mo>)</mo></mrow> <mspace width=\"0.25em\"><mo>&#172;</mo>\
  \ <mspace width=\"0.25em\"/><mspace width=\"0.25em\"><mi math=\"normal\">8202</mi>\
  \ <mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>78</mn>\
  \ <mn>80</mn></mfrac></mo>)</mo></mrow> <mspace width=\"0.25em\"><mo>&#172;</mo>\
  \ <mspace width=\"0.25em\"/><mspace width=\"0.25em\"><mi math=\"normal\">8202</mi>\
  \ <mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>25</mn>\
  \ <mn>80</mn></mfrac></mo>)</mo></mrow> <mspace width=\"0.25em\"><mo>&#172;</mo>\
  \ <mspace width=\"0.25em\"/><mspace width=\"0.25em\"><mi math=\"normal\">8202</mi>\
  \ <mi math=\"normal\">8202</mi> <mi math=\"normal\">8202</mi><mrow> <mo><mo> <mo><mfrac><mn>5</mn>\
  \ <mn>80</mn></mfrac></mo>)</mo></mrow> 8202/8202/8202 = 0.003</mn></mrow></math>\
  \ \n\n因此，我们的消息为垃圾邮件的概率如下：\n\n(7.11)![images](img/c07-disp-0017.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow> <mn>0.016</mn> <mo>/</mo> <mrow> <mo>(</mo>\
  \ <mrow> <mn>0.016</mn> <mo>+</mo> <mn>0.003</mn</mrow> <mo>)</mo> </mrow> <mo>=</mo>\
  \ <mn>0.842</mn> </mrow></math> \n\n我们的消息为非垃圾邮件的概率如下：\n\n(7.12)![images](img/c07-disp-0018.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mn>0.003</mn> <mo>/</mo>\
  \ <mrow> <mo>(</mo> <mrow> <mn>0.016</mn> <mo>+</mo> <mn>0.003</mn</mrow> <mo>)</mo>\
  \ </mrow> <mo>=</mo> <mn>0.158</mn> </mrow></math> \n\n因此，基于现有的标记电子邮件消息并使用朴素贝叶斯分类方法，内容为`“The\
  \ Great Coffee Sale!”`的新消息有 84.2% 的概率是`垃圾邮件`，有 15.8% 的概率是非垃圾邮件。由于消息为垃圾邮件的概率高于为非垃圾邮件的概率，因此该消息被分类为垃圾邮件。\n\
  \n### 加性平滑\n\n\n\n\n现在，让我们对之前的示例进行细微的调整。假设 `sale` 这个词没有出现在任何 ham（正常邮件）消息中。这意味着我们之前的频率表最后一行将如下：\n\
  \n| 类别 | 单词 | 是 | 否 | 总计 |\n| --- | --- | --- | --- | --- |\n| ham | Sale | 0 |\
  \ 80 | 80 |\n\n使用朴素贝叶斯方法，新消息为 spam（垃圾邮件）的概率仍然是 0.016。然而，该消息为 ham 的概率现在如下：\n\n(7.13)![images](img/c07-disp-0019.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mrow> <mo>(</mo> <mrow> <mfrac\
  \ bevelled=\"true\"><mn>80</mn> <mn>100</mn> </mfrac> </mrow> <mo>)</mo> </mrow>\
  \ <mspace width=\"0.25em\"/> <mi mathvariant=\"normal\">&#8202;</mi> <mo>&#215;</mo>\
  \ <mi mathvariant=\"normal\">&#8202;</mi> <mspace width=\"0.25em\"/> <mrow> <mo>(</mo>\
  \ <mrow> <mfrac bevelled=\"true\"><mn>15</mn> <mn>80</mn> </mfrac> </mrow> <mo>)</mo>\
  \ </mrow> <mspace width=\"0.25em\"/> <mi mathvariant=\"normal\">&#8202;</mi> <mo>&#215;</mo>\
  \ <mspace width=\"0.25em\"/> <mi mathvariant=\"normal\">&#8202;</mi> <mrow> <mo>(</mo>\
