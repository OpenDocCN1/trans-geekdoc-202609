  \ College of Business）信息技术、分析和运营的副教授教学教授。Mike 在公共和私营部门拥有超过 20 年的技术经验。他担任该大学商业分析硕士课程的学术总监，并编写了\
  \ 25 多本书。Mike 在圣母大学获得计算机科学博士 `PhD` 学位。\n\n# 关于技术编辑\n\n**Everaldo Aguiar** 在圣母大学获得\
