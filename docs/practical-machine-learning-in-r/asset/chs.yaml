  \ Pane)\n\n脚本面板是发生魔法的地方！你通常不想在控制台中直接执行 R 命令。相反，你会在脚本文件中编写 R 命令，以便以后编辑或重用。R 脚本只是包含\
  \ R 命令的文本文件。在 RStudio IDE 中编写 R 脚本时，R 会对代码的不同元素进行着色，以便于阅读。\n\n图 2.9 显示了脚本面板内渲染的\
