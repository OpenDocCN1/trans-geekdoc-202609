  # 逻辑回归\n\n在 第 4 章 中，我们讨论了分析师如何使用线性回归根据数值变量与其或多个独立变量之间的关系来预测其值。线性回归是处理这类情况的有用工具，但它并不适用于所有类型的问题。特别是当我们的问题需要预测分类变量时，线性回归的效果并不理想。例如，我们可能想预测潜在客户是否属于“大额消费者”、“回头客”、“一次性客户”或“非客户”类别。同样，我们可能想预测医学影像中检测出的肿瘤是良性还是恶性。在本章中，我们将探索第一种方法：逻辑回归。线性回归寻求的是预测数值响应，而逻辑回归寻求的是预测分类结果。\n\
  \n在本章结束时，你将学习到：\n\n- 线性回归与逻辑回归的区别\n- 逻辑回归背后的基本原理\n- 如何构建、解释和评估逻辑回归模型\n- 如何处理多于两个输出结果的情况\n\
  \n## 寻找潜在捐赠者\n\n正如你将在本章看到的，我们将使用真实世界的案例。假设我们受某机构委托，确定哪些潜在捐赠者最有可能做出回应。\n\n- `age`\
  \ 是年龄，单位为年。\n- `numberChildren` 是家庭中的儿童数量。\n- `incomeRating` 是年收入的相对衡量标准。\n- `gender`\
  \ 是描述捐赠者性别的分类变量，值为：\n    - `female`（女性）\n    - `male`（男性）\n    - `joint`（共同/多人账户）\n\
  - `isHomeowner` 是否为房屋主。\n- `inHouseDonor` 是布尔值，表示该者是否参与了“内部”募捐计划。\n- `plannedGivingDonor`\
  \ 是布尔值，表示捐赠者是否将其遗产指定给该机构。\n- `sweepstakesDonor` 是布尔值，表示捐赠者是否参加过组织的抽奖活动。\n- `P3Donor`\
  \ 是布尔值，表示捐赠者是否参与了“P3”募捐计划。\n- `state` 是捐赠者所在的美国州名称。\n- `urban` 是...\n\n除了这些人口统计信息外，我们还拥有关于捐赠者过去行为模式的一些变量：\n\
  \n- `totalGivingAmount` 是捐赠者历史以来收到的捐赠总金额。\n- `numberGifts` 是捐赠者历史以来收到的捐赠次数。\n- `smallestGiftAmount`\
  \ 是捐赠者曾收过的最小捐赠金额。\n- `largestGiftAmount` 是捐赠者曾收过的最大捐赠金额。\n- `averageGiftAmount`\
  \ 是捐赠者收到的平均捐赠金额。\n- `yearsSinceFirstDonation` 是捐赠者首次捐赠以来经过年数。\n- `monthsSinceLastDonation`\
  \ 是捐赠者上次捐赠以来经过的月数。\n\n最后，数据集包含一个名为 `respondedMailing` 的变量，指示潜在捐赠者是否对测试邮件做出了捐赠回应。\n\
  \n给定问题和提供的数据，以下是我们需要回答的一些问题：\n\n* 根据已有的信息，我们能多准确地预测潜在捐赠者是否会对我们的活动做出回应？\n\n\n\n\n\
  \n-   我们如何解释任何特定变量的变化对捐赠者回复或不回复我们邮件的概率的影响？\n\n在本章结束时，我们将使用逻辑回归和相关技术回答这些每一个问题。\n\n\
  ## 分类\n\n为了解决我们面临的问题，我们可以尝试使用在第 4 章中使用的相同方法（线性回归）来预测该问题的因变量。然而，我们在第 4 章中处理的问题与这个问题之间存在一个关键区别。我们试图对测试邮件预测的结果是潜在捐赠者会回复或不会回复邮件的指标。我们的因变量\
  \ `respondedMailing` 的值只有 `TRUE` 或 `FALSE` 两种。这是一个分类响应。我们在第 4 章中处理的问题响应变量都是连续值。线性回归擅长处理这类问题。\n\
  \n我们可以通过一些方法尝试修改当前的问题，使其更适合线性回归。一种方法是将响应编码为数值变量，例如用 0 代表 `FALSE`，1 代表 `TRUE`。这会将我们的分类响应变量转换为“某种连续”的响应变量。通过这种方法，我们可以将预测值低于\
  \ 0.5 的解释为 `FALSE`，高于 0.5 的值解释为 `TRUE`。这种方法存在一些致命缺陷。首先，虽然这种方法适用于我们的特定问题，但它不能很好地推广到其他问题，特别是具有两个以上响应值的问题。例如，假设我们试图根据汽车的其他特征来预测车辆应该漆成蓝色、红色还是绿色。我们应该如何给这些颜色分配数值？应该从以下六个选项中选择哪一个？\n\
  \n| 颜色 | 选项 1 | 选项 2 | 选项 3 | 选项 4 | 选项 5 | 选项 6 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 蓝色 | 0 | 2 | 0 | 1 | 1 | 2 |\n| 红色 | 1 | 0 | 2 | 2 | 0 | 1 |\n\
  | 绿色 | 2 | 1 | 1 | 0 | 2 | 0 |\n\n这是一个任意的选择，而且，它似乎暗示颜色是有顺序的，对于选项 1，绿色的价值是红色的两倍，且都比蓝色价值。我们也可以选择另一种方案，其中红色可以是\
  \ –1，蓝色可以是 0，绿色可以是 1。这种方法也存在自身的一系列问题，包括根据所使用的值来扭曲我们的模型系数。\n\n使用线性回归解决此问题的另一个挑战是，由于使用了拟合的直线，我们的响应值可能会大于或小于\
  \ 0 和 1 的决策边界。我们该如何解释一个 20 的响应或 –50 的响应？\n\n由于线性回归在推广到这些场景时的局限性，我们更倾向于使用不同类型的方法。我们使用分类而不是回归。分类技术被专门设计用于预测两个或多个值。我们将在书中介绍各种分类技术。我们在本章中介绍的第一种技术扩展了上一一章的回归方法，使其很好地适用于分类响应。这种技术被称为`逻辑回归`。\n\
  \n# 逻辑回归\n\n逻辑回归不像线性回归那样直接对响应变量建模，而是对特定响应值的*概率*建模。将这一想法应用于我们描述的问题，逻辑回归模型不是预测 `respondedMailing`\
  \ 的值，而是预测 `respondedMailing` 值为 `TRUE` 的概率。使用 `monthsSinceLastDonation` 作为预测变量，模型表示如下：\n\
  \n(5.1)![images](img/c05-disp-0001.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>P</mi> <mi>r</mi> <mrow> <mo>(</mo> <mrow> <mi mathvariant=\"normal\"\
  >respondedMailing</mi> <mo>=</mo> <mi>T</mi> <mi>R</mi> <mi>U</mi> <mi>E</mi> <mo>&#124;</mo>\
  \ <mi mathvariant=\"normal\">monthsSinceLastDonation</mi> </mrow> <mo>)</mo> </mrow>\
  \ </mrow> </math> \n\n如果我们将方程泛化为 X 和 Y，并假设 `TRUE` 由 1 表示，`FALSE` 由 0 表示，那么我们的模型可以写如下：\n\
  \n(5.2)![images](img/c05-disp-0002.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>Pr</mi> <mrow> <mo>(</mo> <mrow> <mi>Y</mi> <mo>=</mo> <mi>1</mi> <mo>&#124;</mo>\
  \ <mi>X</mi> </mrow> <mo>)</mo> </mrow> </mrow> </math>\n\n换句话说，这意味着我们正在预测 *Y* 的概率，或者在我们的数据情况下，我们试图预测某人真的概率。由于这是一个概率，我们期望值范围在\
  \ 0 到 1 之间。例如，如果 5.1 中的模型预测值为 0.8，我们会将其解释为有 80%的概率。在上一章中，我们学习了回归分析涉及三个关键部分：响应、预测变量和系数。我们还学习了这三者之间的关系是使用函数建模的。这意味着如果像使用线性回归那样使用直线函数对响应进行建模，我们的函数定义如下：\n\
  \n(5.3)![images](img/c05-disp-0003.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>P</mi> <mi>r</mi> <mrow> <mo>(</mo> <mrow> <mi>Y</mi> <mo>=</mo> <mn>1</mi>\
  \ <mo>&#124;</mo> <mi>X</mi> </mrow> <mo>)</mo> </mrow> <mo>=</mo> <msub> <mi>&#946;</mi>\
  \ <mn>0</mn> </msub> <mo>+</mo> <msub> <mi>&#946;</mi> <mn>1</mn> </msub> <mi>X</mi>\
  \ <mspace width=\"thickmathspace\"/> </mrow> </math> \n\n基于此方程的拟合直线所示图 5.1(a)。正如我们所看到的，该图说明了我们之前讨论过的这种方法的局限性。\n\
  \n当 `monthsSinceLastDonation` 的值接近 20 时，我们开始看到预测概率出现负值。这些不是合理的值。我们该如何解释某事的发生概率为\
  \ –10%？为了克服这一挑战，我们需要为回归线使用非线性函数。其中一种函数就是*逻辑函数*。\n\n\n\n\n\n![图 5.1 使用类似于线性回归的直线函数\
  \ (a) 和类似于逻辑回归的 sigmoid 函数 (b) 拟合 `respondedMailing` 概率的拟合线](img/c05f001.png)\n\n\
  **图 5.1**](#c05.xhtml#R_c05-fig-0001) 使用类似于线性回归的直线函数 (a) 和类似于逻辑回归的 sigmoid 函数 (b)\
  \ 拟合 `respondedMailing` 概率的拟合线\n\n(5.4)![images](img/c05-disp-0004.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow> <mi>p</mi> <mrow> <mo>(</mo> <mi>X</mi> <mo>)</mo>\
  \ </mrow> <mo>=</mo> <mi>P</mi> <mi>r</mi> <mrow> <mo>(</mo> <mrow> <mi>Y</mi> <mo>=</mo>\
  \ <mn>1</mn> <mo>&#124;</mo> <mi>X</mi> </mrow> <mo>)</mo> </mrow> <mo>=</mo> <mfrac>\
  \ <mrow> <msup> <mi>e</mi> <mrow> <msub> <mi>&#946;</mi> <mn>0</mn> </msub> <mspace\
  \ width=\"0.25em\"/> <mo>+</mo> <mspace width=\"0.25em\"/> <msub> <mi>&#946;</mi>\
  \ <mn>1</mn> </msub> <mi>X</mi> </mrow> </msup> </mrow> <mrow> <mn>1</mn> <mspace\
  \ width=\"0.25em\"/> <mo>+</mo> <mspace width=\"0.25em\"/> <msup> <mi>e</mi> <mrow>\
  \ <msub> <mi>&#946;</mi> <mn>0</mn> </msub> <mspace width=\"0.25em\"/> <mo>+</mo>\
  \ <mspace width=\"0.25em\"/> <msub> <mi>&#946;</mi> <mn>1</mn> </msub> <mi>X</mi>\
  \ </mrow> </msup> </mrow> </mfrac> <mrow></mrow></math> \n\n对于 `X` 的所有可能值，逻辑函数的输出始终在\
  \ 0 和 1 之间。这在图 5.1(b) 中的曲线中所示。我们看到逻辑函数产生了一个 S 型曲线，它趋于 0 和 1，但永远不会超过这两个值。这种曲线被称为\
  \ `sigmoid 曲线`。与基于线性回归函数的直线相比，这种 sigmoid 曲线在捕捉我们数据中的概率范围方面表现好得多。\n\n就像我们在上一章中对线性回归做一样，我们拟合逻辑回归模型的目标是确定出\
  \ ![images](img/c05-i0007.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi><mn>0</mn></msub></mrow></math> 和 ![images](img/c05-i0008.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>1</mn></msub></mrow></math>c05-i0035，能够最好近似\
  \ `X` 和 `Y` 之间关系的值。然而，与使用普通最小二乘法的线性回归不同，逻辑回归使用另一种称为 `极大似然估计` 的方法。极大似然估计 (MLE) 是一种更复杂的统计方法，用于根据数据样本来估计模型参数。该方法的工作原理的细节超出了本文的讨论范围。关于\
  \ MLE 的更深入的解释，请参阅 Russel B. Millar 写的《*Maximum Likelihood Estimation and Inference*》书。\n\
  \n我们在本节开始讨论了逻辑回归如何在建模响应方面与线性回归不同。需要注意的是，逻辑回归在解释模型方面也与线性回归不同。在简单线性回归中，![images](img/c05-i0009.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>1</mn></msub></mrow></math>c05-i0035\
  \ 是 `X` = 0 时 `Y` 的期望值，而 ![images](img/c05-i0010.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi><mn>1</mn></msub><mspace width=\"0\"/></mrow></math>\
  \ 是 `X` 每增加一个单位时 `Y` 的平均增加量。然而，在逻辑回归中，![images](img/c05-i0010.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi><mn>1</mn></msub></mrow></math>\
  \ 是由于 ![images](img/c05-i0012.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>X</mi></math> 变化一个单位后，![images](img/c05-i0011.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mi>r</mi><mrow><mo>(</mo><mi>Y</mi>\
  \ <mo>=</mo><mn>1</mn> <mo>&#124;</mo> <mi>X</mi></mo><mo>)</mo></mrow></math> 对数几率（log-odds）的相应变化。这意味着什么？为了理解这一点，让我们先开始讨论什么是优势比（odds\
  \ ratio）以及对数几率（log-odds）意味着什么。\n\n### 优势比 (Odds Ratio)\n\n一个事件的 `odds` 或 `odds ratio`\
  \ 是事件发生概率相对于事件不发生概率的比例（概率）。例如，如果一个事件发生的概率是 ![images](img/c05-i0013.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mi>X</mi></math>，它不发生的概率是 ![images](img/c05-i0014.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mn>1</mn><mo>&#8722;</mo><mi>X</mrow></math>；因此，事件发生的优势是\
  \ ![images](img/c05-i0015.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac><mi>X</mi><mrow><mn>1</mn><mo>&#8722;</mo</mrow></></></math></优势比常用于赛马、博彩等。在体育运动中，人们经常讨论优势而不是概率。这两个指标有什么区别？假设在\
  \ A 队之间的 10 场篮球比赛中，A 队赢了 6 场。我们可以说 A 队赢得下一场比赛的概率是 60%，即 0.6 (6/10)；然而，他们的获胜优势是 0.6/0.4\
  \ = 1.5。\n\n将优势的概念应用于我们的逻辑函数 ![images](img/c05-i0016.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>p</mi><mrow><mo>(</mo><mi>X</mi><mo>)</mo></mrow></math>，则对\
  \ ![images](img/c05-i0017.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mi>r</mi><mrow><mo>(</mo><mrow><mi>Y</mi> <mo>=</mo><mn>1</mn><mspace\
  \ width=\"pmatrix\"/><mi mathvariant=\"normal\">&#124;</mi><mspace width=\"pmatrix\"\
  /><mi>X</mi></mrow><mo>)</mo></mrow></math> 的优势如下：\n\n(5.5)![images](img/c05-disp-0005.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mfrac> <mrow> <mi>p</mi>\
  \ <mrow> <mo>(</mo> <mi>X</mi> <mo>)</mo> </mrow> </mrow> <mrow> <mn>1</mn> <mo>&#8722;</mo>\
  \ <mi>p</mi> <mrow> <mo>(</mo> <mi>X</mi> <mo>)</mo> </mrow> </mfrac> </mrow> <mspace\
  \ width=\"pmatrix\"/> </mrow> </math> \n\n\n\n\n\n根据公式 5.4 中 $p(X)$ 的定义，我们可以将 $1-p(X)$\
  \ 定义如下：\n\n(5.6)\n```math\n\\frac{e^{\\beta_0 + \\beta_1 X}}{1+e^{\\beta_0 + \\\
  beta_1 X}}=\\frac{1}{1+e^{-(\\beta_0 + \\beta_1 X)}}}\n```\n\n将公式 5.4 和 5.6 应用于我们在公式\
  \ 5.5 中对 $Pr(Y=1|X)$ 比率的定义，我们得到：\n\n(5.7)\n```math\n\\frac{p(X)}{1-p(X)}=e^{\\beta_0\
  \ + \\beta_1 X}\n```\n\n基于该方程，我们可以看到 $X$ 每增加一个单位，$p(X)$ 的比率就会发生 $e^{\\beta_1}$ 倍的变化。需要注意的是，如果\
  \ $\\beta_1 < 0$，则 $e^{\\beta_1} < 1$。这意味着随着 $X$ 的增加，$p(X)$ 的比率将会减少。相反，如果 $\\beta_1\
  \ > 1$，则 $e^{\\beta_1} > 1$。这意味着随着 $X$ 的增加，$p(X)$ 的比率也会随之增加。通过对公式 5.7 取对数，我们得到了\
  \ $p(X)$ 的`对数比率 (log-odds of $p(X))`，它也被称为 `logit`。\n\n(5.8)\n```math\n\\log\\left(\\\
  frac{p(X)}{1-p(X)}\\right)=\\beta_0+\\beta_1 X\n```\n\n正如我们所见，`logit`（或 `logistic\
  \ unit`）是预测变量的线性组合。回到公式 5.4 中逻辑函数的定义，可以将逻辑函数视为一种将 $p(X)$ 的对数比率转换为概率的数学函数，这给我们我们之前看到的\
  \ sigmoid 曲线。这解释了为什么 $X$ 每增加一个单位会导致 $p(X)$ 的对数比率发生 $\\beta_1$ 的变化。\n\n\n\n\n\n现在我们已经对逻辑回归的工作原理有了理论上的认识，现在是时候付诸实践了。逻辑回归根据响应变量的性质有不同的形式。`donors`\
  \ 数据集的响应变量是二分类的，这意味着它只有两个可能的值。用于对此类数据集建模的逻辑回归类型被称为`二项逻辑回归`（binomial logistic regression）。在本节中，我们将展示如何在\
  \ R 中训练二项逻辑回归模型。我们做的第一件事是使用 `tidyverse` 包中的 `read_csv()` 函数导入数据，如下所示：\n\n```\n>\
  \ library(tidyverse)\n> donors <- read_csv(\"donors.csv\", col_types = \"nnffnnnnnnnnffffffffff\"\
  )\n```\n\n现在我们已经有了数据，让我们花时间探索并准备数据。我们想做的第一件事是使用 `glimpse()` 函数对数据进行概览。\n\n```\n\
  > glimpse(donors)\n \nObservations: 95,412\nVariables: 22\n$ age               \
  \      <dbl> 60, 46, NA, 70, 78, NA, 38, NA, NA, 65, NA, 75,…\n$ numberChildren\
  \          <dbl> NA, 1, NA, NA, 1, NA, 1, NA, NA, NA, NA, NA, 2,…\n$ incomeRating\
  \            <fct> NA, 6, 3, 1, 3, NA, 4, 2, 3, NA, 2, 1, 4, NA, 4…\n$ wealthRating\
  \            <fct> NA, 9, 1, 4, 2, NA, 6, 9, 2, NA, 0, 5, 2, NA, 6…\n$ mailOrderPurchases\
  \      <dbl> 0, 16, 2, 2, 60, 0, 0, 1, 0, 0, 0, 3, 16, 0, 17…\n$ totalGivingAmount\
  \       <dbl> 240, 47, 202, 109, 254, 51, 107, 31, 199, 28, 2…\n$ numberGifts  \
  \           <dbl> 31, 3, 27, 16, 37, 4, 14, 5, 11, 3, 1, 2, 9, 12…\n$ smallestGiftAmount\
  \      <dbl> 5, 10, 2, 2, 3, 10, 3, 5, 10, 3, 20, 10, 4, 5, …\n$ largestGiftAmount\
  \       <dbl> 12, 25, 16, 11, 15, 16, 12, 11, 22, 15, 20, 15,…\n$ averageGiftAmount\
  \       <dbl> 7.741935, 15.666667, 7.481481, 6.812500, 6.8648…\n$ yearsSinceFirstDonation\
  \ <dbl> 8, 3, 7, 10, 11, 3, 10, 3, 9, 3, 1, 1, 8, 5, 4,…\n$ monthsSinceLastDonation\
  \ <dbl> 14, 14, 14, 14, 13, 20, 22, 18, 19, 22, 12, 14,…\n$ inHouseDonor       \
  \     <fct> FALSE, FALSE, FALSE, TRUE,…\n$ plannedGivingDonor      <fct> FALSE,\
  \ FALSE, FALSE, FALSE,…\n$ sweepstakesDonor        <fct> FALSE, FALSE, FALSE, FALSE,…\n\
  $ P3Donor                 <fct> FALSE, FALSE, FALSE, TRUE,…\n$ state           \
  \        <fct> IL, CA, NC, FL, IA, TN, IN,…\n$ urbanicity              <fct> town,\
  \ suburb, rural, suburb,…\n$ socioEconomicStatus     <fct> average, highest, average,…\n\
  $ isHomeowner             <fct> NA, TRUE, NA,…\n$ gender                  <fct>\
  \ female, male, female,…\n$ respondedMailing        <fct> FALSE, FALSE, FALSE,,…\n\
  ```\n\n我们可以看到我们的数据集包含 95,412 个观测值和 22 个变量（特征）。数据中有两种类型的特征：12 个分类的 10 个连续的。让我们按类型查看它们，从分类特征开始。`summary()`\
  \ 函数是一个很好的开始，它为我们提供了每个特征的统计分布。\n\n```\n> donors %>%\n keep(is.factor) %>%\n summary()\n\
  \  incomeRating    wealthRating   inHouseDonor  plannedGivingDonor \n5:15451   \
  \   9:7585   FALSE:88709   FALSE:95298 \n2:13114      6:6793   TRUE:6703   TRUE:114\
  \ \n4:12732      7:6198   1:9022       6:5825 \n3:8558       5:5280 (Other):15249\
  \   (Other):19999 \n NA's:21286   NA's:44732 \n sweepstakesDonor  P3Donor      \
  \    state        urbanicity \n FALSE:93795      FALSE:93395   CA:17343   town:19527\
  \ \n TRUE :1617      TRUE :2017   FL:8376   suburb:21924 \n TX:7535   rural:19790\
  \ \n IL:6420   urban:12166 \n MI:5654   city:19689 \n NC:4160   NA's:  2316 \n (Other):45924\
  \ \n socioEconomicStatus isHomeowner     gender      respondedMailing\n average:48638\
  \       TRUE:52354   female:51277   FALSE:90569 \n highest:28498       NA's:43058\
  \   male:39094   TRUE :4843 \n lowest :15960                    joint :  365 \n\
  \ NA's:  2316                    NA's:  4676\n```\n\n在这里，我们使用了 `tidyverse` 包中的 `keep()`\
  \ 函数仅选择分类特征（factor 数据类型）。我们的结果显示，许多特征具有大量的缺失数据，由 `NA` 的计数表示。我们需要解决这个问题，因为逻辑回归并不擅长处理缺失值。回想一下第\
  \ 4 章，我们提到回归用于建模关系的大小和强度。正如所想象的，我们无法对缺失值的大小和强度进行建模。\n\n### 处理缺失数据\n\n在第三章中，我们讨论了缺失值作为一个常见的数据质量问题。在那个章节中，我们还介绍了处理缺失数据的方法，其中一些将在这里使用。让我们从\
  \ `incomeRating` 特征开始。我们可以通过使用 R 中的 `table()` 函数创建频率表，然后使用 `prop.table()` 函数将该表转换为比例，从而获得该特征值的数的频率分布。注意，我们必须对\
  \ `table()` 函数使用 `exclude=NULL` 参数，将 `NA` 值包含在我们的结果中。\n\n```\n> donors %>%\n select(incomeRating)\
  \ %>%\n table(exclude=NULL) %>%\n prop.table()\n \n         6          3       \
  \   1          4          2          7          5       <NA> \n0.08152014 0.08969522\
  \ 0.09455834 0.13344233 0.13744602 0.07830252 0.16193980 0.22309563 \n```\n\n我们从这些结果中看到，`incomeRating`\
  \ 缺失率为 22.31%。这是一个数量巨大的观测值。我们不应该仅仅因为“缺失”就从数据集中删除那么多的观测值。因此，让我们分配一个哑值来表示缺失值。这补偿了逻辑回归无法处理\
  \ `NA` 值的事实，因此我们用替代值替换它们。在这里我们使用 `UNK` 作为特征值：\n\n```\n> donors <- donors %>%\n \
  \  mutate(incomeRating = as.character(incomeRating)) %>%\n   mutate(incomeRating\
  \ = as.factor(ifelse(is.na(incomeRating), 'UNK', incomeRating)))\n \n> donors %>%\n\
  \ select(incomeRating %>%\n table() %>%\n prop.table()\n \n         1          2\
  \          3          4          5          6          7        UNK \n0.09455834\
  \ 0.13744602 0.08969522 0.13344233 0.16193980 0.08152014 0.07830252 0.22309563 \n\
  ```\n\n这种方法也可以应用于其他具有缺失数据的特征。\n\n\n\n\n\n```\n> donors <- donors %>%\n mutate(wealthRating\
  \ = as.character(wealthRating)) %>%\n mutate(wealthRating = as.factor(ifelse(is.na(wealthRating),\
  \ 'UNK', wealthRating))) %>%\n mutate(urbanicity = as.character(urbanicity)) %>%\n\
  \ mutate(urbanicity = as.factor(ifelse(is.na(urbanicity), 'UNK', urbanicity))) %>%\n\
  \ mutate(socioEconomicStatus = as.character(socioEconomicStatus)) %>%\n mutate(socioEconomicStatus\
  \ = as.factor(ifelse(is.na(socioEconomicStatus), 'UNK', socioEconomicStatus))) %>%\n\
  \ mutate(isHomeowner = as.character(isHomeowner)) %>%\n mutate(isHomeowner = as.factor(ifelse(is.na(isHomeowner),\
  \ 'UNK', isHomeowner))) %>%\n mutate(gender = as.character(gender)) %>%\n mutate(gender\
  \ = as.factor(ifelse(is.na(gender), 'UNK', gender)))\n \n> donors %>%\n keep(is.factor)\
  \ %>%\n summary()\n \n      incomeRating    wealthRating   inHouseDonor  plannedGivingDonor\n\
  \ UNK    :21286   UNK    :44732   FALSE:88709   FALSE:95298\n 5      :15451   9\
  \      : 7585   TRUE : 6703   TRUE :  114\n 2      :13114   8      : 6793\n 4  \
  \    :12732   7      : 6198\n 1      : 9022   6      : 5825\n 3      : 8558   5\
  \      : 5280\n (Other):15249   (Other):18999\n                                \
  \  \n sweepstakesDonor  P3Donor          state        urbanicity\n FALSE:93795 \
  \     FALSE:93395   CA     :17343   city  :19689\n TRUE : 1617      TRUE : 2017\
  \   FL     : 8376   rural :19790\n                                TX     : 7535\
  \   suburb:21924\n                                IL     : 6420   town  :19527\n\
  \                                MI     : 5654   UNK   : 2316\n                \
  \                NC     : 4160   urban :12166\n                                (Other):45924\n\
  \        \n socioEconomicStatus isHomeowner     gender      respondedMailing\n average:48638\
  \       TRUE:52354   female:51277   FALSE:90569\n highest:28498       UNK :43058\
  \   joint :  365   TRUE : 4843\n lowest :15960                    male  :39094\n\
  \ UNK    : 2316                    UNK   : 4676\n```\n\n现在我们已经处理了分类数据的缺失值，让我们来看看连续型特征。就像我们处理分类特征一样，我们首先从查看统计摘要开始。\n\
  \n```\n> donors %>%\n keep(is.numeric) %>%\n summary()\n \n      age        numberChildren\
  \  mailOrderPurchases totalGivingAmount\n Min.   : 1.00   Min.   :1.00    Min. \
  \  :  0.000    Min.   :  13.0\n 1st Qu.:48.00   1st Qu.:1.00    1st Qu.:  0.000\
  \    1st Qu.:  40.0\n Median :62.00   Median :1.00    Median :  0.000    Median\
  \ :  78.0\n Mean   :61.61   Mean   :1.53    Mean   :  3.321    Mean   : 104.5\n\
  \ 3rd Qu.:75.00   3rd Qu.:2.00    3rd Qu.:  3.000    3rd Qu.: 131.0\n Max.   :98.00\
  \   Max.   :7.00    Max.   :241.000    Max.   :9485.0\n NA's   :23665   NA's   :83026\n\
  \                               \n  numberGifts      smallestGiftAmount largestGiftAmount\
  \ averageGiftAmount\n Min.   :  1.000   Min.   :   0.000   Min.   :   5      Min.\
  \   :   1.286\n 1st Qu.:  3.000   1st Qu.:   3.000   1st Qu.:  14      1st Qu.:\
  \   8.385\n Median :  7.000   Median :   5.000   Median :  17      Median :  11.636\n\
  \ Mean   :  9.602   Mean   :   7.934   Mean   :  20      Mean   :  13.348\n 3rd\
  \ Qu.:  13.000   3rd Qu.:  10.000   3rd Qu.:  23      3rd Qu.:  15.478\n Max.  \
  \ :237.000   Max.   :1000.00   Max.   :5000      Max.   :1000.00\n             \
  \                              \n yearsFirstDonation monthsDonation\n Min.   :0.000\
  \          Min.   :  0.00\n 1st Qu.:2.000          1st Qu.:12.00\n Median :5.000\
  \          Median :14.00\n Mean   :5.596          Mean   :14.36\n 3rd Qu.:9.000\
  \          3rd Qu.:17.00\n Max.   :13.000          Max.   :23.00```\n\n我们看到 `age`\
  \ 和 `numberChildren` 特征都缺失了大量值。对于 `age`，我们将使用均值插补来处理缺失值。但我们不是简单地使用所有 `age` 值的均值，而是使用根据\
  \ `gender` 分组的 `age` 均值。\n\n```\n> donors %>%\n group_by(gender) %>%\n mutate(age\
  \ = ifelse(is.na(age), mean(age, na.rm = TRUE), age)) %>%\n ungroup()\n> donors\
  \ %>%\n select(age) %>%\n summary()\n \n age\n Min.   :1.00\n 1st Qu.:52.00\n Median\
  \ :61.95\n Mean   :61.67\n 3rd Qu.:71.00\n Max.   :98.00```\n\n第二个带有缺失值的特征是 `numberChildren`。使用与\
  \ `age` 相同的均值插补方法是不合适的。首先，按 `gender` 使用均值没有意义；其次，如果我们简单地使用非缺失数据的均值，得到 1.53，这对于该特征来说是不合理的。因此，这次我们将使用位数插补。\n\
  \n```\n> donors %>%\n mutate(numberChildren = ifelse(is.na(numberChildren), \n \
  \                              median(numberChildren, na.rm = TRUE), \n        \
  \                       numberChildren))\n> donors %>%\n select(numberChildren)\
  \ %>%\n summary() \nnumberChildren\n Min.   :1.000 \n 1st Qu.:1.000 \n Median :1.000\
  \ \n Mean   :1.069 \n 3rd Qu.:1.000 \n Max.   :7.000\n```\n\n现在我们已经解决了 `age` 和 `numberChildren`\
  \ 的缺失问题，让我们来评估其他特征。从统计摘要中看到，`mailOrderPurchases`、`totalGivingAmount`、`numberGifts`、`smallestGiftAmount`、`largestGiftAmount`\
  \ 和 `averageGiftAmount` 的最大值相对于均值和中位数高得多。这表明数据中存在异常值。\n\n### 处理异常值\n\n图 5.2 直方图显示了我们确定具有异常数据的特征值的分布。每个图都比统计摘要更直观地说明了问题。我们注意到每个图的数据分布都是右偏的，大多数值集中在较低范围。\n\
  \n处理异常数据有几种方法。一种方法是根据数据的统计属性使用简单的规则。该规则的原理是：任何大于或小于四分位距（IQR）1.5 倍的值都被标记为异常值，并应从数据中删除。\n\
  \n![Figure 5.2 Histogram showing the distribution of values for the mailOrderPurchases,totalGivingAmount,numberGifts,smallestGiftAmount,largest\
  \ Gift Amount,and averageGiftAmount variables](img/c05f002.png)\n\n图 5.2 Histogram\
  \ showing the distribution of values for the `mailOrderPurchases`, `totalGivingAmount`,\
  \ `numberGifts`, `smallestGiftAmount`, `largest Gift`, and `averageGiftAmount` variables\n\
  \n使用这种规则方法，我们首先为 `mailOrderPurchases`、`totalGivingAmount`、`numberGifts`、`smallestGiftAmount`、`largestGiftAmount`\
  \ 和 `averageGiftAmount` 变量的每个值获取异常截止值（`max1`、`max2`、`max3`、`max4`、`max5` 和 `max6`）。接下来，我们消除任何超过这些变量阈值的值。\n\
  \n```\n> donors <- donors %>%\n mutate(max1 = quantile(mailOrderPurchases, .75)\
  \ + (1.5 * IQR(mailOrderPurchases))) %>%\n mutate(max2 = quantile(totalGivingAmount,\
  \ .75) + (1.5 * IQR(totalGivingAmount))) %>%\n mutate(max3 = quantile(numberGifts,\
  \ .75) + (1.5 * IQR(numberGifts))) %>%\n mutate(max4 = quantile(smallestGiftAmount,\
  \ .75) + (1.5 * IQR(smallestGiftAmount))) %>%\n mutate(max5 = quantile(largestGiftAmount,\
  \ .75) + (1.5 * IQR(largestGiftAmount))) %>%\n mutate(max6 = quantile(averageGiftAmount,\
  \ .75) + (1.5 * IQR(averageGiftAmount))) %>%\n    filter(mailOrderPurchases <= max1)\
  \ %>%\n    filter(totalGivingAmount <= max2) %>%\n    filter(numberGifts <= max3)\
  \ %>%\n    filter(smallestGiftAmount <= max4) %>%\n    filter(largestGiftAmount\
  \ <= max5) %>%\n    filter(averageGiftAmount <= max6) %>%\n    select(-max1,-max2,-max3,-max4,-max5,-max6)\n\
  ```\n\n\n\n\n现在我们已经从数据中移除了离群值，让我们来看看汇总统计结果如何。我们应该预料，由于移除了离群值，每个变量的取值范围将比处理之前小得多。\n\
  \n```\n> donors %>%\n keep(is.numeric) %>%\n summary()\n \n      age        numberChildren\
  \  mailOrderPurchases totalGivingAmount\n Min.   : 1.00   Min.   :1.000   Min. \
  \  :0.0000     Min.   : 14.00\n 1st Qu.:51.00   1st Qu.:1.000   1st Qu.:0.0000 \
  \    1st Qu.: 38.00\n Median :61.19   Median :1.000   Median :0.0000     Median\
  \ : 70.00\n Mean   :60.58   Mean   :1.071   Mean   :0.9502     Mean   : 82.79\n\
  \ 3rd Qu.:69.00   3rd Qu.:1.000   3rd Qu.:1.0000     3rd Qu.:115.00\n Max.   :98.00\
  \   Max.   :6.000   Max.   :7.0000     Max.   : 267.00\n \n  numberGifts     smallestGiftAmount\
  \ largestGiftAmount averageGiftAmount\n Min.   : 1.000   Min.   : 0.000     Min.\
  \   : 5.00     Min.   : 1.600\n 1st Qu.:3.000   1st Qu.: 3.000     1st Qu.:13.00\
  \     1st Qu.: 8.231\n Median : 7.000   Median : 5.000     Median :16.00     Median\
  \ :11.000\n Mean   : 8.463   Mean   : 6.918     Mean   :17.04     Mean   :11.661\n\
  \ 3rd Qu.:12.000   3rd Qu.:10.000     3rd Qu.:20.00     3rd Qu.:15.000\n Max.  \
  \ :28.000   Max.   :20.000     Max.   :36.00     Max.   :26.111\n \n yearsSinceFirstDonation\
  \ monthsSinceLastDonation\n Min.   : 0.000          Min.   : 0.00\n 1st Qu.:2.000\
  \          1st Qu.:12.00\n Median : 5.000          Median :14.00\n Mean   : 5.373\
  \          Mean   :14.46\n 3rd Qu.:8.000          3rd Qu.:16.00\n Max.   :12.000\
  \          Max.   :23.00\n```\n\n我们的结果符合预期。例如，我们看到 `mailOrderPurchases` 特征的最小值和最大值已分别从\
  \ 0 和 241 变为了 0 和 7。这意味着取值范围发生了显著收缩。对比图 5.2 和图 5.3，可以很好地说明移除离群值对我们特征值分布的影响。虽然某些特征仍然存在一些偏态，但我们不再拥有在移除离群值之前所观察到的那种长尾了。\n\
  \n到目前为止，我们已经使用插补法和虚拟变量处理了数据中的缺失值。\n\n\n\n\n现在我们已经理解了 `SMOTE` 的工作原理，并用它来平衡训练数据，让我们来看看新的类别分布：\n\
  \n```\n> round(prop.table(table(select(donors, respondedMailing), exclude = NULL)),\
  \ 4) * 100\n \nFALSE TRUE \n94.98 5.02 \n \n> round(prop.table(table(select(donors_train,\
  \ respondedMailing), exclude = NULL)), 4) * 100\n \nFALSE TRUE \n 50   50 \n \n\
  > round(prop.table(table(select(donors_test, respondedMailing), exclude = NULL)),\
  \ 4) * 100\n \nFALSE TRUE \n94.97 5.03\n```\n\n我们可以看到，训练数据现在平衡在 50%，而原始数据和测试数据仍然保持不平衡状态。在构建模型之前，我们最后一步是将类别值从\
  \ `FALSE/TRUE` 转换为 `0/1`。这不是必经的步骤，但我们这样做是为了说明演示，并与我们在章节开头分享的示例保持一致。\n\n```\n> donors\
  \ <- donors %>%\n mutate(respondedMailing = as.factor(ifelse(respondedMailing==TRUE,\
  \ 1, 0)))\n> donors_train <- donors_train %>%\n mutate(respondedMailing = as.factor(ifelse(respondedMailing==TRUE,\
  \ 1, 0)))\n> donors_test <- donors_test %>%\n mutate(respondedMailing = as.factor(ifelse(respondedMailing==TRUE,\
  \ 1, 0)))\n```\n\n我们现在准备好构建模型了。\n\n### 训练模型\n\n在 R 中用于构建二项逻辑回归模型的最流行函数之一是 `stats`\
  \ 包中的 `glm()` 函数。该函数的名称 `glm` 代表广义线性模型（generalized liner model, GLM）。GLM 是一种统计技术，旨在将各种回归技术统一到单一框架中的方法。它通过使用所谓的`转换函数`（或`连接函数`）来表示回归问题中预测变量与响应变量之间的关系。GLM\
  \ 有三个核心组件：\n\n- 随机部分。这代表响应或描述响应值分布的函数。\n- 系统部分。这是预测变量的线性组合 ![images](img/c05-i0036.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>f</mi><mrow><mo>(</mo><mrow><mi>X</mi><mi\
  \ mathvariant=\"normal\">,</mi><mspace width=\"0.25em\"/><mi>&#946;</mi></mrow><mo>)</mo></mrow></math>.\n\
  - 连接函数。它指定了随机部分与系统部分之间的关系。\n\nGLM 中使用的连接函数类型取决于我们处理的数据类型以及预期的回归方法。对于逻辑回归，连接函数是 logit\
  \ 函数，我们在公式 5.8 中进行了指定。\n\n使用 `glm()` 函数训练二项逻辑回归模型，我们需要向它传递三个主要参数。第一个参数（`data`）是训练数据（`donors_train`）。第二个参数（`family`）是我们想要构建的回归模型类型。我们将其设置为\
  \ `binomial`。这告诉 `glm()` 函数我们打算使用 logit 连接函数构建一个二项逻辑回归模型。与其设置 `family = binomial`，我们也可以写成\
  \ `family = binomial(link = “logit”)`。传递给函数的最后一个参数是用于预测问题的 `formula`。在这里，我们指定使用哪些特征（预测变量）来预测类别（响应）。对于我们的模型，我们指定该函数应该使用训练集中的所有特征（`.`）来构建一个预测\
  \ `respondedMailing` 的模型。\n\n```\n> donors_mod1 <- glm(data=donors_train, family=binomial,\
  \ formula=respondedMailing ~ .)\n```\n\n### 评估模型\n\n现在我们已经训练了一个名为 `donors_mod1`\
  \ 的模型，可以使用 `summary()` 函数获取该模型的详细描述。\n\n\n\n\n\n```\n> summary(donors_mod1)\n \n\
