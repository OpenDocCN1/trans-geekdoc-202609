  \n```\n> library(tidyverse)\n> bikes <- read_csv(\"bikes.csv\")\n```\n\n一旦加载了数据集，让我们尝试计算其中一些统计值。首先，我们将使用\
  \ R 内置的 `cov()` 函数计算 `humidity` 和 `rentals` 的协方差。\n\n```\n> cov(bikes$humidity,\
  \ bikes$rentals)\n \n[1] -27.77323\n```\n\n这告诉我们 `humidity` 与 `rentals` 之间的协方差为\
  \ -27.77。同样，我们可以使用 R 的 `sd()` 函数计算两个变量的标准差。\n\n```\n> sd(bikes$humidity)\n \n[1]\
  \ 0.1424291\n \n> sd(bikes$rentals)\n \n[1] 1937.211\n```\n\n请记住，标准差的单位与原始变量单位相同，因此湿度的标准差为\
