  \n## 使用箱边界平滑\n\n\n\n\n\n与分箱均值光滑（smoothing with bin means）密切相关的替代方法是`分箱边界光滑`smoothing\
  \ with bin boundaries）。在这种方法中，我们不是用每个箱的平均值来替换值，而是根据距离将值替换为分箱边界之一。分箱边界是每个箱中最小和最大的数值。为了说明其工作原理，让我们考虑一个包含\
