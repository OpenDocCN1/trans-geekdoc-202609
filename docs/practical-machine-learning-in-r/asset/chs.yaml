  \n`图 9.10` (a) 基于 (b) 垃圾邮件过滤器混淆矩阵的模型性能衡量精率\n\n第二个标准 `recall`（召回率）是数据集中被模型正确预测的正例比例。高召回率的模型具有广度。它是一个能够识别数据中大量正例的模型。在我们的垃圾邮件过滤器情况下，这意味着绝大多数垃圾邮件都被正确地识别为垃圾邮件。召回率的计算方法如下：\n\
