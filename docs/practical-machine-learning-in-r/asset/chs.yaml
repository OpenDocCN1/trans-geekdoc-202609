  \ width=\"eqnarray\"/> </mrow></math>\n\n\n\n\n这可以被理解为响应变量 `Y` 被近似建模为函数 `f`，其中 `f`\
  \ 是一个估计函数，用于量化观测预测变量 `X` 与一组系数 `β` 之间的相互作用。回归的目标是根据观测到的 `X` 值确定最能估计 `Y` 值的 `β` 值。详见图\
  \ 4.2。\n\n![图 4.2 自行车租赁数据样本 (n=20) 的估计回归线和实际值](img/c04f002.png)\n\n图 4.2 自行车租赁数据样本\
  \ (n=20) 的估计回归线和实际值\n\n## 简单线性回归\n\n线性回归是回归的一个子集，它假设预测变量 `X` 与响应变量 `Y` 之间的关系是线性的。当我们只有一个预测变量时，可以使用斜率-截距格式写出回归方程。\n\
