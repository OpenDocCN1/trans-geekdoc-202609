  \ <mi>l</mi> <mi>l</mi> </mrow> </mfrac> </mrow> </math>\n\n使用来自公式 9.7 和 9.9 的的结果，我们的垃圾邮件过滤器的\
  \ `F-score` 为：\n\n9.11![images](img/c09-disp-0011.png)<math display=\"block\" overflow=\"\
