  \   Married-spouse-absent:  418\n ?               : 1836  Masters     : 1723   Never-married\
  \        :10682\n State-gov       : 1297  Assoc-voc   : 1382   Separated       \
  \     : 1025\n Self-emp-inc    : 1116  11th        : 1175   Married-AF-spouse  \
  \  :   23\n (Other)         :  981  (Other)     : 5134   Widowed              :\
  \  993\n \n           occupation           relationship                   race\n\
  \ Prof-specialty :4140   Husband       :13193  White             :27815\n Craft-repair\
  \   :4099   Not-in-family : 8304  Black             : 3124\n Exec-managerial:4066\
  \   Wife          : 1568  Asian-Pac-Islander: 1039\n Adm-clerical   :3769   Own-child\
