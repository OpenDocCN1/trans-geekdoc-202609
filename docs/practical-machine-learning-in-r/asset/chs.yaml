  \ 是显著的，因此让我们将其移除并重新创建模型：\n\n```\n> bikes_mod3 <-\n   lm (data = bikes2,\n      rentals\
  \ ~ humidity + windspeed + temperature + \n        humidity2 + temperature2)\n \n\
  > summary (bikes_mod3)\n \nCall:\nlm(formula = rentals ~ humidity + windspeed +\
  \ temperature + humidity2 +\n    temperature2, data = bikes2)\n \nResiduals:\n \
  \   Min      1Q  Median      3Q     Max\n-3167.5  -945.0  -106.7  1034.4  2984.6\n\
