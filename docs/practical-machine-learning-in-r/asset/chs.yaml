  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>1</mn></msub></mrow></math>每对\
  \ `temperature` 和 `rentals` 的观测值表示为 ![images](img/c04-i0018.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mo>(</mo><mrow><msub><mi>x</mi><mi>i</msub><mi\
  \ mathvariant=\"normal\">,</mi> <mspace width=\"0.25em\"/><msub><mi>y</mi><mi>i</msub></mrow><mo>)</mo></mrow></math>，其中\
  \ ![images](img/c04-i0019.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>i</mi><mo>=</mo><mn>1</mn><mo>,</mn>2</mn><mo>,</mspace width=\"0.25em\"\
  /><mi mathvariant=\"normal\">8230</mi><mspace width=\"0.25em\"/><mi>n</mrow></math>。那么，我们将基于给定值\
  \ ![images](img/c04-i0021.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>x</mi><mi>i</msub></mrow></math> 对 Y 的预测 ![images](img/c04-i0020.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow><mi>i</msub></mrow></math>视为：\n\
  \n(4.6) ![images](img/c04-disp-0006.png)\n```\n<math display=\"block\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <msub><mrow><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow><mi>i</msub></mrow>\
  \ <mo>=</mo> <msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>0</mn></msub>\
  \ <mo>+</mo> <msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>1</mn></msub>\
  \ <msub><mi>x</mi><mi>i</msub></mrow> </math>\n```\n\n在任何给定点，Y 的观测值 ![images](img/c04-i0022.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
