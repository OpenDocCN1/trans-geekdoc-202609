  \ `?` 命令后跟你想查看文档的命令名称来访问它。图 2.16 显示了在控制台中执行 `?install.packages` 命令以查看 `install.packages()`\
  \ 函数帮助的结果。\n\n![图 2.14 RStudio 中的“文件”标签允许你与设备的本地文件系统交互](img/c02f014.png)\n\n图 2.14\
  \ RStudio 中的“文件”标签允许你与设备的本地文件系统交互。\n\n![图 2.15 RStudio 中的“包”标签允许你查看和管理系统上安装的包](img/c02f015.png)\n\
  \n图 2.15 RStudio 中的“包”标签允许你查看和管理系统上安装的包。\n\n![图 2.16 RStudio 中的“帮助”标签显示 install.packages()\
  \ 命令的文档](img/c02f016.png)\n\n图 2.16 RStudio 中的“帮助”标签显示了 `install.packages()` 命令的文档\n\
  \n### R 包 (R Packages)\n\n*包 (Packages)* 是 R 社区的秘密武器。它们是由社区创建并被广泛共享以供公众使用的代码集合。正如你在图\
  \ 2.1 中所示，近年来公开可用的 R 包数量呈爆炸式增长。这些包涵盖了从极其流行且广泛使用的包（如 `tidyverse`）到为 R 社区特定细分领域服务的高度专业化包。\n\
  \n在本书中，我们将使用各种 R 包来导入和处理数据，以及构建机器学习模型。我们会在这些包出现时向你介绍它们。\n\n#### CRAN 仓库\n\n综合 R\
  \ 归档网络（Comprehensive R Archive Network，简称 CRAN）是由 R 社区维护并由 R 基金会协调的 R 包官方仓库。CRAN\
  \ 志愿者管理该仓库以确保所有包都符合某些关键标准，包括每个包都要满足以下条件：\n\n*   对 R 社区做出非凡的贡献\n*   由具有权限的个人或组织根据开源许可发布\n\
  *   指定个人作为包维护者并提供该人员的联系方式\n*   使用高效代码以最大限度地减小文件大小和计算资源占用\n*   通过 CRAN 质量控制检查\n\n\
  CRAN 是 RStudio 的默认包仓库，本书中使用的所有包都可以通过 CRAN 获取。\n\n#### 安装包\n\n在 R 脚本中使用包之前，你必须确保该包已安装在你的系统中。安装包会从仓库下载代码，安装代码所需的任何其他包，并执行所有必要的安装步骤。\n\
  \n`install.packages()` 命令是向系统安装 R 包最简单的方法。例如，这是在系统中安装 `RWeka` 包的命令以及相应的输出：\n\n```\n\
  > install.packages(\"RWeka\")\n \n正在安装依赖包 ‘ekajars’, ‘rJava’\n \n 尝试 URL https://cran.rstudio.com/\n\
  \ \n 下载: https://cran.rstudio.com/bin/macosx/contrib/4/RWekajars_3.9.1.tgz - 9.6\
  \ MB\n 下载: https://cran.rstudio.com/bin/macosx/contrib/4/rJava_1.7.0.tgz - 727 KB\n\
  \ 下载: https://cran.rstudio.com/bin/macosx/contrib/4/RWeka_3.4.0.tgz - 617 KB\n \n\
  \ ==========================\n 包 ‘RWeka’ 现在可用版本 3.4\n```\n\n注意，除了安装 `RWeka` 包外，该命令还安装了\
  \ `ekajars` 和 `rJava` 包。`RWeka` 包使用了这些包中的函数，从而形成了包与包之间的*依赖*关系。`install.packages()`\
  \ 命令通过安装所需的包来解决这些依赖。\n\n#### 加载包\n\n每次想要使用包时必须将其加载到 R 会话中。虽然你只需要在系统中安装一次包，但每次使用时都需要加载。安装包使其在系统中可用，而加载包使其可以使用。\n\
  \n你使用 `library()` 命令将包加载到 R 会话中。例如，以下命令加载了我们在书中将使用的 `tidyverse` 包：\n\n```\nlibrary(tidyverse)\n\
  ```\n\n许多编写 R 代码的人交替使用“包 (package)”和“库 (library)”这两个词。它们实际上略有不同。存储在 CRAN 仓库（或其他位置）中的代码束被称为*包\
  \ (packages)*。你使用 `install.packages()` 命令将包放入系统，并使用 `library()` 命令将其加载到内存中。Hadley\
  \ Wickham 是一位著名的 R 开发者，他在 2014 年 12 月的一条推文中很好地总结了这一概念，见图 2.17。\n\n#### 包文档\n\n我们之前已经讨论过使用\
  \ `?` 命令访问包内函数的帮助文件。包作者通常还会创建更详细的关于包用方法的说明（包含示例），存储在称为*指南 (vignettes)* 的文件中。你可以使用\
  \ `vignette()` 命令访问指南。例如，以下命令可以与 R 的 `dplyr` 包相关的所有指南：\n\n```\n> vignette(package\
  \ = 'dplyr')\n包 ‘dplyr’ 中的指南：\n\ncompatibility         dplyr compatibility (source,\
  \ html)\ndplyr                 Introduction to dplyr (source, html)\nprogramming\
  \           Programming with dplyr (source, html)\ntwo-table             Two-table\
  \ verbs (source, html)\nwindow-functions      Window functions (source, html)\n\
  ```\n\n\n\n\n\n图 2.17 Hadley Wickham 关于包和库之间的区别\n\n如果你想查看名为 `programming` 的指南（vignette），可以使用此命令：\n\
  \n```\nvignette(package = 'dplyr', topic = 'programming')\n```\n\n图 2.18 显示了执行此命令的结果：一份详细的文档，描述了如何使用\
  \ `dplyr` 包编写代码。\n\n![图 2.18 RStudio 显示来自 dplyr 包的 programming 指南](img/c02f018.png)\n\
  \n图 2.18 RStudio 显示来自 `dplyr` 包的 `programming` 指南\n\n## 编写和运行 R 脚本\n\n正如我们之前提到的，在\
  \ RStudio 中工作最常见的方法是编写包含一系列 R 命令的脚本，你可以保存这些脚本并在以后复用它们。这些 R 脚本仅仅是文本文件，你在 RStudio\
  \ 的脚本窗格中编写它们，并将其保存到你的系统或云存储位置。图 2.9 显示了一个在 RStudio 中打开的简单脚本。\n\n当你想要执行脚本时，有两个选项：Run（运行）按钮和\
  \ Source（源文件）按钮。当你点击 Run 按钮时（如在图 2.19 中所示），RStudio 将执行当前代码段。如果你在脚本中没有高亮任何文本，它将执行光标当前所在的某行。在图\
  \ 2.19 中，第 6 行不包含代码，因此 Run 按钮将不起任何作用。如果你将光标移动到代码的第一行，点击 Run 按钮将运行第 1 行加载 tidyverse，然后自动跳转到脚本中包含代码的下一行即第\
  \ 3 行（因为第 2 行是空的）。再次点击 Run 按钮将运行第 3 行和第 4 行的代码，因为它们在 R 中组合成了一个语句。\n\nRun 按钮是在开发和调试阶段在\
  \ R 中执行代码的常用方法。它允许你在编写脚本的同时执行它，并监控结果。\n\n![图 2.19 RStudio 中的 Run 按钮运行当前代码段](img/c02f019.png)\n\
  \n图 2.19 RStudio 中的 Run 按钮运行当前代码段。\n\nSource 按钮（如在图 2.20 中高亮）将保存你对脚本所做的任何更改，然后一次性执行整个文件。这是快速运行整个脚本的有用方法。\n\
  \n![图 2.20 RStudio 中的 Source 按钮运行整个脚本](img/c02f020.png)\n\n图 2.20 RStudio 中的 Source\
  \ 按钮运行整个脚本。\n\n## R 中的数据类型\n\n与大多数编程语言一样，你在 R 脚本中创建的所有变量都有关联的数据类型。数据类型定义了 R 存储变量中包含的信息的方式以及可能值的范围。以下是\
  \ R 中一些常见的数据类型：\n\n*   `logical`（逻辑型）数据类型是一种简单的二进制变量，可能只有两个值：`TRUE` 或 `FALSE`。它是存储仅取这两个值的数据有效方式。这些数据元素也常称为\
  \ `flags`（标记）。例如，我们可能在一个关于学生的数据集中有一个名为 `Married` 的变量，对于已婚人士将其设置为 `TRUE`，对于未婚的人将其设置为\
  \ `FALSE`。\n\n*   `numeric`（数值型）数据类型存储小数，而 `integer`（整数）数据类型存储整数。如果你创建一个包含数字的变量而没有指定数据类型，R\
  \ 将默认将其存储为 `numeric`。然而，R 通常可以根据需要自动在 `numeric` 和 `integer` 数据类型之间转换。\n\n*   `character`（字符型）数据类型用于存储每个最多\
  \ 65535 个字符的文本字符串。\n\n*   `factor`（因子）数据类型用于存储分类值。因子的每个可能值被称为 `level`（水平）。例如，你可能使用因子来存储个人居住的美国州。50\
  \ 个州中的每一个都是该因子的一个可能水平。\n\n*   `ordered factor`（有序因子）数据类型是因子数据类型的一种特殊情况，其中水平的顺序具有意义。例如，如果我们有一个包含低（Low）、中（Medium）和高（High）风险评级的因子，那么顺序是有意义的，因为中大于低，且高大于中。有序因子保留了这种重要性。另一方面，美国州的列表不会被存储为有序因子，因为州之间没有逻辑顺序。\n\
  \n### 向量 (Vectors)\n\n`Vectors`（向量）是 R 中将相同数据类型的元素按顺序收集在一起的方式。向量中的每个数据元素被称为该向量的\
  \ `component`（组件）。向量是收集相同类型数据元素的方便方式。\n\n我们可以使用 `c()` 函数来创建一个向量。例如，我们可能会创建两个向量，一个包含名字，另一个包含分数：\n\
  \n```\nnames <- c('Alice', 'Bob', 'Charlie')\nscores <- c(85, 92, 98)\n```\n\n一旦我们在向量中存储了数据，可以通过方括号跟随向量名来访问单个组件。例如：\n\
  \n```\nnames[1] \"Alice\"\nnames[2] \"Bob\"\nnames[3] \"Charlie\"\n```\n\nR 中还有一些函数可以作用于整个向量。例如，你可以使用\
  \ `mean()`、`median()`、`min()` 和 `max()` 函数分别找到平均值、中位数、最小值和最大值。同样，`sum()` 函数会相加数值元素。\n\
  \n```\n> mean(scores)\n[1] 91.66667\n\n> median(scores)\n[1] 92\n\n> min(scores)\n\
  [1] 85\n\n> max(scores)\n[1] 98\n\n> sum(scores)\n[1] 275\n```\n\n向量的所有组件必须是相同类型。如果你尝试创建一个具有不同类型的向量，R\
  \ 将强制它们变为相同类型。这种过程被称为 *coercion*（强制转换）。例如，如果我们创建一个包含字符串和数值的混合向量：\n\n```\n> mixed\
  \ <- c('Alice', 85, 'Bob', 92, 'Charlie', 98)\n```\n\n该命令似乎成功创建了向量，但当我们检查该向量的内容时：\n\
  \n```\n> mixed\n [1] \"Alice\" \"85\" \"Bob\" \"92\" \"Charlie\" \"98\"\n```\n\n\
  我们发现 R 将所有元素都转换成了字符串。我们可以将不同类型的向量组合成类似于电子表格的数据结构。在 R 中，此此传统方法是通过 *data frame*（数据框）。例如，我们可以将\
  \ `names` 和 `scores` 向量组合成名为 `testResults` 的数据框。\n\n```\n> testResults <- data.frame(names,\
  \ scores)\n\n> testResults\n        names scores\n1        Alice     85\n2     \
  \     Bob     92\n3    Charlie     98\n```\n\n在处理数据框时，你可以使用 `$` 运算符访问数据框中存储的向量。例如，如果你想计算平均分数，可以使用以下代码：\n\
  \n```r\n> mean(testResults$scores)\n[1] 91.66667\n```\n\n### 测试数据类型\n\n当我们使用 R 对象时，我们可能想更多地了解它们的数据类型，可以通过直接对对象的类型提问，也可以通过编程方式进行测试。R\
  \ 语言包含了用于协助这些任务的函数。\n\n`class()` 函数返回对象的数据类型。例如，查看以下示例代码：\n\n\n\n\n```\n> x <- TRUE\n\
  > y <- 1\n> z <- 'Mike'\n \n> class(x)\n[1] \"logical\"\n \n> class(y)\n[1] \"numeric\"\
  \n \n> class(z)\n[1] \"character\"\n```\n\n注意在赋值 `x`、`y` 和 `z` 的值时，不需要显式指定类型。当你执行赋值时，R\
  \ 会解释你提供的参数并对数据类型做出假设。在下一节中，我们将讨论如何使用 `as()` 函数来显式转换类型。\n\n如果你想在 R 中创建一个整数（integer）类型，可以在创建时给数字添加\
  \ `L` 后缀。查看以下代码：\n\n```\n> yint <- 1L\n \n> is.integer(yint)\n[1] TRUE\n \n> is.numeric(yint)\n\
  [1] TRUE\n```\n\n在这里我们看到了另一个明显的不一致性。在这种情况下，`is.numeric()` 和 `is.integer()` 函数都返回了\
  \ `TRUE`。这是 `is.numeric()` 函数的一个细微差别。它并不是仅在被测试的对象为数值类时才返回 `TRUE`，如果可以将对象中包含的数据转换为数值类，它就会返回\
  \ `TRUE`。我们可以通过 `class` 函数验证 `y` 是数值数据类型，而 `yint` 是整数。\n\n```\n> class(y)\n[1] \"\
  numeric\"\n \n> class(yint)\n[1] \"integer\"\n```\n\n或者，我们也可以使用 `as.integer()` 函数将最初创建的数值变量转换为整数值，我们将在下一节介绍。\n\
  \n“is”函数也适用于向量对象，根据向量中包含的对象的数据类型返回值。例如，我们可以测试上一节中创建的 `names` 和 `scores` 向量。\n\n\
  ```\n> is.character(names)\n[1] TRUE\n \n> is.numeric(names)\n[1] FALSE\n \n> is.character(scores)\n\
  [1] FALSE\n \n> is.numeric(scores)\n[1] TRUE\n \n> is.integer(scores)\n[1] FALSE\n\
  ```\n\n### 转换数据类型\n\n你可能会遇到需要将数据从一种类型转换为另一种类型。R 提供了“as”函数来执行这些转换。R 中一些常用的“as”函数如下：\n\
  \n- `as.logical()`\n- `as.numeric()`\n- `as.integer()`\n- `as.character()`\n- `as.factor()`\n\
  \n这些函数每个都接受一个对象或向量作为参数，并尝试将其从现有的数据类型转换为函数名包含的数据类型。当然，这种转换并不总是可能的。如果你有一个包含值 1.5 的数值数据对象，R\
  \ 可以轻松地将其转换为字符串“1.5”。然而，没有任何合理的方法可以将字符字符串“apple”转换为整数值。以下是“as”函数工作的示例：\n\n```\n\
  > as.numeric(\"1.5\")\n[1] 1.5\n \n> as.integer(\"1.5\")\n[1] 1\n \n> as.character(3.14159)\n\
  [1] \"3.14159\"\n \n> as.integer(\"apple\")\n[1] NA\nWarning message:\nNAs introduced\
  \ by coercion\n \n> as.logical(1)\n[1] TRUE\n \n> as.logical(0)\n[1] FALSE\n \n\
  > as.logical(\"true\")\n[1] TRUE\n \n> as.logical(\"apple\")\n[1] NA\n```\n\n这些结果符合逻辑吗？如果你回顾创建这些变量的代码，`x`\
  \ 是逻辑值 `TRUE`，所以只有 `is.logical()` 函数返回了 `TRUE`，而其他测试函数返回了 `FALSE`。\n\n`y` 变量包含一个整数值，因此\
  \ `is.integer()` 函数返回了 `TRUE`，而其他函数返回了 `FALSE`。在这里要注意的是`is.numeric()` 函数也返回了 `FALSE`，考虑到函数的名称这可能违背直觉。当我们使用代码创建\
  \ `y` 变量时：\n\n```\n> y <- 1\n```\n\nR 假设我们想要创建一个数值变量，这是数字的默认类型。如果我们想显式创建一个整数，我们需要在创建时给数字添加\
  \ `L` 后缀。\n\n\n\n在第 1 章中，我们讨论了机器学习背后的一些基础原理。随后，我们在第 2 章中对 R 编程语言和 RStudio 开发环境分别进行了介绍。在本章中，我们将解释如何使用\
  \ R 在建模之前管理我们的数据。机器学习模型的质量取决于用于构建该模型的数据质量。很多情况下，这些数据并不容易获取、格式错误或难以理解。因此，在构建模型之前，花费尽可能的时间来收集所需的数据、探索并理解已有的数据，并对其进行处理以使其适用于所选的机器学习方法，是至关重要的。通常情况下，![images](img/c03-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mn>8</mn><mn>0</mn></mrow></math>\
  \ 百比的时间花在管理数据上，或者说本应该花在管理数据上。\n\n在本章结束时，你将学习到以下内容：\n\n* 什么是 tidyverse 以及如何使用它在 R\
  \ 中管理数据\n* 如何使用 R 收集数据以及收集数据时需要考虑的关键事项\n* 在 R 中描述和可视化数据的不同方法\n* 如何清洗、转换和减少数据，以使其对机器学习过程更有用\n\
  \n## THE TIDYVERSE\n\n`tidyverse` 是系列 R 包的集合，旨在通过提供包与包之间交换数据的标准化格式来促进整个分析过程。它包含了设计用于导入、处理、可视化和建模数据的包，这些包包含一系列函数，这些函数可以轻松地在不同的\
  \ tidyverse 包之间协同工作。\n\n以下是构成 tidyverse 的主要包：\n\n* `readr` 用于从各种文件格式将数据导入到 R\n*\
  \ `tibble` 用于以标准化格式存储数据\n* `dplyr` 用于处理数据\n* `ggplot2` 用于数据可视化\n* `tidyr` 用于将数据转换为“整洁（tidy）”格式（tidy\
  \ form）\n* `purrr` 用于函数式编程\n* `stringr` 用于处理字符串\n* `lubridate` 用于处理日期和时间\n\n这些是我们从\
  \ tidyverse 中使用的面向开发者的包，但这些包依赖于几十个其他基础包来完成其工作。幸运的是，你可以通过一个命令安装所有的 tidyverse 包：\n\
  \n```R\ninstall.packages(\"tidyverse\")\n```\n\n同样，你可以使用此命令加载整个 tidyverse：\n\n```R\n\
  library(tidyverse)\n```\n\n在本章的剩余部分以及本书的后续内容，我们将使用多个 tidyverse 包和函数。在使用这些工具时，我们将努力对每个函数的作用及其使用方法提供简要说明。请注意，本书的意图并不是作为\
  \ R 编程语言或 tidyverse 的教程。相反，目标是使用这些工具来解释和演示机器学习概念。对于对更深入介绍 R 编程语言和 tidyverse 感的读者，我们推荐由\
  \ Hadley Wickham 和 Garrett Grolemund 编写的 *R for Data Science* 一书。\n\n## DATA COLLECTION\n\
  \n`数据收集（Data collection）` 是识别和获取机器学习过程所需要数据的过程。收集的数据类型/数量通常取决于机器学习问题和所选的算法。对于监督机器学习问题，收集的数据不仅包含描述每个观测属性或特征的变量，还包含一个作为观测值标签（label）或结果的变量。无监督机器学习问题不需要为输入数据的每个观测值分配标签。相反，学习目标的一个主要部分是识别分组数据的有趣方式，以便为其分配有意义的标签。\n\
  \n### 关键考虑因素\n\n在收集数据时，有几点需要考虑，以确保数据收集过程成功。这包括确保我们捕获了正确的历史数据、数据具有相关性、我们有足够的数据可以使用，以及我们在管理和使用数据时遵循伦理规范。\n\
  \n#### 收集真值数据（Ground Truth Data）\n\n对于监督机器学习问题，我们使用带有结果标签或响应值的历史数据来训练模型。这些标签或响应值的准确性对于方法的成功至关重要。这是因为这些数据是算法用于学习过程的基准。这些数据作为学习模式的真理来源。这就是为什么它通常被称为`真值（ground\
  \ truth）`。真值可以是基于先前事件的现有标签（例如银行客户是否违约贷款），也可以需要由领域专家分配标签（例如电子邮件是否为垃圾邮件）。无论标签是存在还是需要分配，都应该有一个计划来管理真值并确保它确实是真理来源。\n\
  \n#### 数据相关性（Data Relevance）\n\n作为数据收集过程的一部分，确保收集的数据与学习目标相关是重要的。用于描述观测值的变量在解释该观测值的标签或响应方面应该是相关的。例如，收集银行客户的鞋码数据与他们是否会违约贷款没有相关性。相反，排除有关客户过去贷款的信息将对尝试预测贷款结果的模型有效性产生不利影响。\n\
  \n#### 数据数量（Quantity of Data）\n\n成功训练模型所需的数据量取决于所选机器学习方法的类型。某些类型的算法在少量数据上表现良好，而某些则需要大量数据才能提供有意义的结果。理解每种方法的优缺点可以为我们判断多少数据足够提供指导。除了收集的数据数量，收集数据的变异性也很重要。例如，如果我们打算用于预测贷款结果的预测变量之一是收入，那么收集不同收入水平客户的数据将是有益的。这样做使模型能够更好地判断收入水平对贷款结果的影响。\n\
  \n#### 伦理（Ethics）\n\n在数据收集过程中，需要考虑几个伦理问题。这些问题包括隐私、安全、知情同意和偏见。在获取新数据的过程中，建立流程和缓解措施来解决这些问题是非常重要的。例如，如果训练模型的数据中存在偏见，那么模型将在预测中复制这种偏见。偏见预测可能会导致相当大的危害，特别是在根据机器学习模型对少数代表群体做出不利决策的情况下。偏见数据问题通常源于数据收集过程中的内在偏见，或某些子群体数据的缺失。\n\
  \n### 导入数据（Importing the Data）\n\n`readr` 包可能是你在为机器学习目的编写的任何 R 代码中使用的第一个 tidyverse\
  \ 包，因为它允许你从标准文件格式将数据导入 R，并将其导入名为 `tibble` 的 tidyverse 友好数据结构（稍后将介绍 tibble）。\n\n\
  #### 读取逗号分隔文件\n\n\n\n\n\n逗号分隔文件是不同环境之间交换数据的最常见方式。这些文件也被称为逗号分隔值（CSV）文件，它们以简单、标准的格式存储数据，可以从几乎任何源导入或导出。\n\
  \n从电子表格或其他数据表创建逗号分隔值文件在概念上是非常直观的。例如，假设我们有如图 3.1 所示的电子表格数据。\n\n将其转换为 CSV 文件仅需将分隔列的行替换为逗号，如图\
  \ 3.2 所示。在 CSV 格式中，文件中的每一行代表电子表格表中的一行。然而，有时文件可能还会包含一个可选的表头行，其中包含变量名，我们的示例就是这种情况。\n\
  \n我们可以使用 `readr` 包中的 `read_csv()` 函数将 CSV 文件读取到 R 中。该函数允许许多不同的参数，但让我们来看其中几个最重要的参数，显示如下：\n\
  \n*   `file` 是 `read_csv()` 的第一个参数，包含你想要读取的文件名。这可能是 R 当前工作目录下的文件名、存储在磁盘其他位置的文件的完整路径、通过\
  \ HTTP 或 HTTPS 协议读取的 URL，或者 FTP 或 FTPS 站点上文件的路径。\n*   `col_names` 指定了 R 应该从哪里获取数据集中使用的变量名。`col_names`\
  \ 的默认值为 `TRUE`，表示 R 应该使用 CSV 文件第一行中出现的值作为变量名。如果将此值设置为 `FALSE`，R 将使用顺序编号的格式 `X1`、`X2`、`X3`\
  \ 等生成它自己的列名。或者，你也可以提供一个自己的列名字符向量。\n\n    ![图 3.1 包含表格形式数据的简单电子表格](img/c03f001.png)\n\
  \n    **图 3.1** 包含表格形式数据的简单电子表格\n\n    ![图 3.2 包含与图 3.1 中电子表格相同数据的 CSV 文件](img/c03f002.png)\n\
  \n    **图 3.2** 包含与图 3.1 中电子表格相同数据的 CSV 文件\n\n*   `col_types` 指定列的数据类型。如果你不包含此参数，R\
  \ 将根据文件中的值猜测合适的数据类型。如果你想自己指定列类型，简单的方法是提供一个与数据集中每个列对应的字母字符串，使用以下值：\n\n    *   `l`\
  \ 代表逻辑型 (logical)\n    *   `n` 代表数值 (numeric)\n    *   `i` 代表整数 (integers)\n   \
  \ *   `c` 代表字符 (characters)\n    *   `f` 代表因子 (factors)\n    *   `D` 代表日期 (dates)\n\
  \    *   `T` 代表日期时间 (datetimes)\n*   `skip` 是整数值，表示 `read_csv()` 在尝试读取数据之前应忽略文件顶部指定的行数。\n\
  \n这些只是在从 CSV 文件读取数据时可以指定的许多选项中的一小部分。关于 `read_csv()` 函数的更多信息，请参阅帮助文件。\n\n```\n?read_csv\n\
  ```\n\n让我们来看一个读取 CSV 文件的示例。我们将使用一个存储在 `vehicles.csv` 文件中的数据集，包含车辆燃油效率和排放测试数据，这些数据是在密歇根州安娜堡环保保护局国家车辆和燃料排放实验室收集的。该数据集包含\
  \ 1984–2018 年型车辆的燃油经济和排放信息。\n\n要读取数据，我们首先需要使用 `library(tidyverse)` 命令加载 tidyverse\
  \ 包。这允许我们使用 `read_csv()` 函数。我们向函数传递两个参数：第一个是文件名（`file`），第二个是表示列数据类型的字符串（`col_types`）。通过设置\
  \ `col_types=\"nnnfnff\"`，我们告诉 `read_csv()` 函数输入的前三列应被视为数值型，第四列为因子型，第五列为数值型，以此此类推。\n\
  \n```\nlibrary(tidyverse)\nvehicles <- read_csv(file=\"vehicles.csv\", col_types=\"\
  nnnfnff\")\n```\n\n我们的数据集现在已导入到名为 `vehicles` 的 tibble 中。我们可以使用 `dplyr` 包提供的 `glimpse()`\
  \ 命令来获取数据的预览。\n\n```\nglimpse(vehicles)\n```\n\n\n\n\n作为数据探索过程的一部分，我们经常需要以他人能够理解的方式来描述数据。在机器学习中，有几个术语用于描述数据的结构以及数据中数值的性质（参见图\
  \ 3.5）。\n\n### 实例 (Instance)\n\n`instance`（实例）是一行数据。它是数据集所代表的概念的独立个体示例。它由一组属性或特征（features）描述。一个数据集由多个实例组成。在本文，我们有时会将实例称为\
  \ `records`（记录）、`examples`（示例）或 `observations`（观测）。\n\n### 特征 (Feature)\n\n`feature`（特征）是数据列数据。它是实例的属性或特性。每个实例由多个特征组成。在本文，我们有时会将特征称为\
  \ `columns`（列）或 `variables`（变量）。特征可以根据其所持的数据类型进行分类。特征可以描述为`离散特征`（discrete feature）或`连续特征`（continuous\
  \ feature）。\n\n*   `离散特征`是以类别形式测量的属性。离散特征通常只有一组可能的取值。例如衣服尺码（小、中、大）、客户满意度（不满意、比较满意、非常满意）等。\n\
  \n    ![图 3.5 展示实例和特征的示例数据集（自变量和因变量)](img/c03f005.png)\n\n    **图 3.5** 展示实例和特征的示例数据集（自变量和因变量）\n\
  \n*   `连续特征`通常以整数或实数的形式测量的属性。连续特征在上下下限之间有无限多个可能的取值。例如温度、身高、体重、年龄等。\n\n特征还可以根据其功能进行分类。在第\
  \ 1 章中，我们讨论了在监督学习中，我们使用描述数据的属性（或特征）来预测数据中每个实例的标签（label）。描述数据的特征被称为`自变量`（independent\
  \ variables），而代表标签的特征被称为`因变量`（dependent variable）。“独立”和“依赖”这两个名称背后的思想源于在监督学习中，因变量的值是根据自变量的值预测的。换句话说，因变量“依赖”于自变量的值。对于分类问题，因变量也被称为\
  \ `class`（类别），对于回归问题，它被称为 `response`（响应）。\n\n### 维度 (Dimensionality)\n\n数据集的`dimensionality`（维度）代表数据集中特征的数量。数据集的维度越高，我们关于数据的细节就越多，但计算复杂性和资源消耗也越高。稍后我们将讨论一些减少数据集维度的方法，使其更容易在机器学习中处理。\n\
  \n### 稀疏性与密度 (Sparsity and Density)\n\n数据的`sparsity`（稀疏性）和`density`（密度）描述了数据集中特征存在的程度。例如，如果数据集中\
  \ 20% 的值缺失或未定义，则该数据集被认为是 20% 稀疏。密度是稀疏性的互补，因此一个 20% 稀疏的数据集也被认为是 80% 密。\n\n### 分辨率\
  \ (Resolution)\n\n`resolution`（分辨率）描述数据的粒度或细节详细程度。数据越详细，分辨率越细（或越高），数据越不详细，分辨率越粗（或越低）。例如，个人客户购买记录的销售点零售数据具有高分辨率。另一方面，在州或区域级汇总的销售数据具有低分辨率。适当的分辨通常由业务问题和机器学习任务决定。如果数据分辨率太细，重要的模式可能会被噪声掩盖；但如果分辨率太粗，重要的模式可能会消失。\n\
  \n### 描述性统计 (Descriptive Statistics)\n\n`descriptive statistics`（描述性统计）或`summary\
  \ statistics`（汇总统计）对于数据探索和理解很有。它们涉及使用统计测量量来描述特征的特性。例如，特征值的`frequency`（频率）告诉我们该值出现的频率，特征的`mode`（众数）告诉我们该特征哪个值出现最多。频率和众数通常用于描述类别数据。对于连续数据，通常使用`mean`（平均值）和`median`（中位数）等测量来描述数据的属性。平均值和中位数都对特征的所谓“典型”值提供了描述。\n\
  \n在 R 中，我们可以使用 `summary()` 函数获取数据集的汇总统计。要获取我们的 `vehicles` 数据集的汇总统计，我们将数据集名称传递给 `summary()`\
  \ 函数。\n\n```\n> summary(vehicles)\n \n    citympg        cylinders        displacement\
  \ \n Min. : 6.00     Min. : 2.000     Min. :0.600 \n 1st Qu.:15.00   1st Qu.: 4.000\
  \   1st Qu.:2.200 \n Median :17.00   Median :5.000   Median :3.000 \n Mean :17.53\
  \     Mean :5.776     Mean :3.346 \n 3rd Qu.:20.00   3rd Qu.:6.000   3rd Qu.:4.500\
  \ \n Max. :57.00     Max. :10.000    Max. :8.400 \n NA's :6                    \
  \      \n\n               drive        highwaympg            make \n 2-Wheel Drive\
  \    491   Min. : 9.00   Chevrolet: 3750 \n Rear-Wheel Drive :1319   1st Qu.:20.00\
  \   Ford     :3044 \n All-Wheel Drive  8871   Median :23.77   GMC      :2461 \n\
  \ Front-Wheel Drive:13074   Mean :24.00   Toyota   :1840 \n 4-Wheel Drive    1349\
  \   3rd Qu.:27.00   BMW      :1774 \n                    Max. :61.00   NA's :6 \n\
  \n               model                          class       year \n F150 Pickup\
  \ 2WD  :213   Compact Cars           :7918 1985   :1699 \n F150 Pickup 4WD  :192\
  \   Pickup                 :5763 1987   :1247 \n Truck 2WD        :187   Midsize\
  \ Cars           :5226 1986   :1209 \n Jetta            :173   Sport Utility   \
  \       :5156 2015   :1203 \n Mustang          :172   Subcompact Cars        :4523\
  \ 2017   :1201 \n Ranger Pickup 2WD:164   Special Purpose Vehicle:2378 2016   :1172\
  \ \n (Other)          :35878  (Other)                :6015 (Other):2924 \n\n transmissiontype\
  \ transmissionspeeds co2issions \n Automatic:24910   Min. : 1.000    Min. :29.0\
  \ \n Manual :12069     1st Qu.: 4.000    1st Qu.:400.0 \n Median :5.000     Median\
  \ :467.7    Median :400.0 \n Mean :4.954     Mean :476.6     Mean :340.0 \n 3rd\
  \ Qu.:6.000   3rd Qu.:555.4   3rd Qu.:500.0 \n Max. :10.000    Max. :1269.6 \n NA's\
  \ :6                          \n```\n\n结果显示了描述性统计的两种不同格式：一种用于类别特征的格式，另一种用于连续特征的格式。例如，类别特征（如\
  \ `drive` 和 `make`）的汇总统计显示了特征值以及每个值的频率。\n\n\n\n\n`summary()` 函数使用的第二格式适用于连续特征。例如，我们看到对于\
  \ `citympg`，摘要显示了平均值、中位数、最小值、最大值以及第一和第三四位数值。从结果中我们可以看到，城市燃油效率最低的车辆仅为 6 英里加仑（最小值），而效率最高的车辆评分则高达\
  \ 57 英里加仑（最大值）。一辆“典型”车辆的城市燃油效率评分在 17 到 17.5 英里加仑之间（中位数和平均值）。第一和第三四位数的数值让我们了解不同车辆之间城市燃油效率值的差异程度。在第\
  \ 5 章中，我们将详细介绍其含义。另外请注意，对于 `citympg`、`displacement` 和 `highwaympg` 特征，描述性统计列出了这些特征缺失值（NAs）的数量。我们将在本章节后面的关于数据准备的讨论中介绍如何处理这些缺失值。\n\
  \n在上一个示例中，我们通过将数据集传递给 `summary()` 函数显示了整个数据集的统计摘要。有时，我们只想查看数据中特定特征的统计摘要。实现这一目标的方法之一是使用\
  \ `dplyr` 包中的 `select` 命令。记得 `dplyr` 是 tidyverse 中一个用于数据探索和操作的包。它提供了五个主要的命令（也称为动词）。\n\
  \n*   `select` 用于选择列或变量\n*   `filter` 用于选择行或观测值\n*   `arrange` 用于排序行\n*   `mutate`\
  \ 用于修改变量\n*   `summarize` 用于聚合行\n\n使用 `select` 动词，我们可以将 `vehicles` 数据限制为我们感兴趣的特征。假设我们只想查看\
  \ `class` 特征。为了做到这一点，我们向 `select` 动词传递两个参数。第一个是输入数据集即 `vehicles`，第二个是我们选择的特征名称或多个名称，即\
  \ `class`。\n\n```\n> library(tidyverse)\n> select(vehicles, class)\n \n# A tibble:\
  \ 36,979 x 1\n class \n <fct> \n 1 Large Cars\n 2 Large Cars\n 3 Large Cars\n 4\
  \ Large Cars\n 5 Large Cars\n 6 Large Cars\n 7 Large Cars\n 8 Pickup \n 9 Pickup\
  \ \n10 Pickup \n# … with 36,969 more rows\n```\n\n我们的数据现在被限制为 `class` 特征。注意，我们的输出是一个包含\
  \ 36,979 行和 1 列的 tibble。这一列就是 `class` 特征。若要在输出中包含 `cylinders` 特征，我们需要将其包含在传递给 `select`\
  \ 动词的特征名称中。\n\n```\n> select(vehicles, class, cylinders)\n \n# A tibble: 36,979\
  \ x 2\n class       cylinders\n <fct>           <dbl>\n 1 Large Cars       6\n 2\
  \ Large Cars       8\n 3 Large Cars       8\n 4 Large Cars       6\n 5 Large Cars\
  \       8\n 6 Large Cars       8\n 7 Large Cars       8\n 8 Pickup           4\n\
  \ 9 Pickup           4\n10 Pickup           4\n# … with 36,969 more rows\n```\n\n\
  我们的输出现在是一个包含两列的 tibble。为了获取这两列的描述性统计，我们将 `select(usedcars, class, cylinders)` 命令作为输入传递给\
  \ `summary()` 函数。这样做的作用是将 `select` 命令的输出作为 `summary()` 函数的输入。\n\n```\n> summary(select(vehicles,\
  \ class, cylinders))\n \n class cylinders \n Compact Cars           :7918  Min.\
  \   : 2.000 \n Pickup                 :5763  1st Qu.: 4.000 \n Midsize Cars    \
  \       :5226  Median : 6.000 \n Sport Utility          :5156  Mean   : 5.776 \n\
  \ Subcompact Cars        :4523  3rd Qu.: 6.000 \n Special Purpose Vehicle:2378 \
  \ Max.   :16.000 \n (Other)                :6015\n```\n\n我们现在有了这两列：`class` 和 `cylinders`\
  \ 的描述性统计。早些时候提到，对于分类特征，`summary()` 函数仅显示计数排名前六的特征值。这就是我们在 `class` 特征中看到的现象。为了获取\
  \ `class` 特征值的完整列表和计数，我们使用另一个函数——`table()` 函数。与 `summary()` 函数一样，我们也可以将 `select`\
  \ 命令的输出作为输入传递给 `table()` 函数。\n\n```\n> table(select(vehicles, class))\n \n     \
  \ Large Cars              Pickup Special Purpose Vehicle \n            1880    \
  \            5763                    2378 \n            Vans        Compact Cars\
  \            Midsize Cars \n            1891                7918               \
  \     5226 \n        Subcompact Cars      Two Seaters                 Minivan \n\
  \            4523                1858                     386 \n   Sport Utility\
  \ \n            4156\n```\n\n我们现在有了 `class` 和 `cylinders` 两列的描述性统计。之前提到，对于分类特征，`summary()`\
  \ 函数只显示计数前六的特征值。这是 `class` 特征的情况。为了获得值的完整列表和计数，我们使用不同的函数——`table()` 函数。就像 `summary()`\
  \ 函数一样，可以将 `select` 命令的输出作为 `table()` 函数的输入。\n\n```\n> table(select(vehicles, class))\n\
  ```\n\n输出告诉我们，数据集中 5% 的车辆被分类为大型轿车（Large Cars），15.58% 的车辆被分类为皮卡（Pickup），依此类推。通过这些比例，我们可以更好地了解\
  \ `class` 特征值的分布。\n\n我们目前为止使用的将一个命令或函数的输出作为另一个函数的输入的方法被称为*嵌套*（nesting）。通过这种方法，我们确保将子函数封装在父函数的括号内。在上一个示例中，我们将\
  \ `select` 命令嵌套在 `table()` 函数中，然后将其嵌套在 `prop.table()` 函数中。可以想象，如果我们必须执行大量操作，且每个函数都以前一个函数的输出作为输入，我们的代码将很快变得难以阅读。因此，我们有时使用被称为*管道*（pipe）的工具来控制代码的逻辑流。管道写作\
  \ `%>%`。它们由 `magrittr` 包提供，该包作为 tidyverse 的一部分加载。例如，列出 `vehicles` 数据集中 `class` 特征的所有值及其比例分布可以写如下：\n\
  \n```\n> library(tidyverse)\n> vehicles %>%\n  select(class) %>%\n  table() %>%\n\
  \  prop.table()\n.\n      Large Cars Pickup \n             0.05083967        0.15584521\
  \ \nSpecial Purpose Vehicle              Vans \n             0.06430677        0.05113713\
  \ \n           Compact Cars      Midsize Cars \n             0.21412153        0.14132345\
  \ \n        Subcompact Cars      Two Seaters \n             0.12231266        0.05024473\
  \ \n                Minivan     Sport Utility \n             0.01043836        0.13943049\
  \ \n```\n\n\n\n管道（Pipes）允许我们将一个表达式的输出传递给另一个表达式的输入。在这个示例中，我们使用管道将 `vehicles` 数据作为输入传递给\
  \ `select` 动词。然后，我们使用另一个管道将 `select` 动词的输出作为输入传递给 `table()` 函数。最后，我们将 `table()`\
  \ 函数的输出传递给 `prop.table()` 函数。管道的强大之处在于，它们允许我们编写简单、可读且高效的代码。在接后的内容，我们将尽可能地使用管道来组织代码示例的逻辑。\n\
  \n我们已经展示了如何使用 `select` 命令来限制或选择我们想要操作的变量。有时，我们不想限制变量，而是想限制正在操作的观测值（observations）或行。这是通过使用\
  \ `dplyr` 包中的另一个命令——`filter` 命令来实现的。`filter` 命令允许我们为想要保留的行指定逻辑条件。例如，假设我们只想查看仅限两轮车辆的\
  \ `co2 emissions` 描述性统计数据。我们的条件是：若要保留某行，其 `drive` 特性的值必须等于 `2-Wheel Drive`。写法如下：\n\
  \n```\n> vehicles %>%\n filter(drive == \"2-Wheel Drive\") %>%\n select(co2emissions)\
  \ %>%\n summary()\n co2emissions\n Min.   328.4\n1st Qu.:467.7\n Median:555.4\n\
  \ Mean   564.6\n3rd Qu.:683.6\n Max.   987.4\n```\n现在我们可以将两轮驱动的描述性统计数据与整个数据集的数据进行比较。\n\
  \n### 数据可视化\n\n在节一节中，我们讨论了如何使用数值汇总来描述数据，以便我们更好地理解它。在本节中，我们引入数据可视化作为数据探索的重要部分，因为它提供了一种压缩且易于理解的数据描述方式。很多时候，即使使用了复杂的统计技术，某些模式也只有在通过可视化表示出来时才能被理解。正如俗话所“一画胜千言”，可视化是提问和回答数据问题的绝佳工具。根据问题的类型，有四个关键目标决定了我们使用的可视化类型类型：比较、关系、分布和组成。\n\
  \n#### 比较\n\n比较型可视化用于说明在特定时间点或一段时间内两个或多个项目之间的差异。常用的比较图是箱线图（box plot）。箱线图通常用于比较连续特征的分布与类别特征值之间的关系。它们分别视觉化了五个统计量（最小值、第一分位数、中位数、第三分位数和最大值）。箱线图帮助我们回答的一些问题包括：\n\
  \n* 特征是显著的？\n* 子组之间的数据位置是否存在差异？\n* 子组之间的数据变异是否存在差异？\n* 数据中是否存在离群值（outliers）？\n\n\
  正如之前提到的，tidyverse 为我们提供了一个强大且灵活的数据可视化包，称为 `ggplot2`。`ggplot2` 提供的函数遵循一种被称为“图形语法”（grammar\
  \ of graphics）的原则。我们不会对该包背后的语法和理论进行详细教程，而是在使用它创建帮助我们理解数据的可视化图形时，解释一些相关概念。对于对 `ggplot2`\
  \ 和图形语法深度解释感兴趣的读者，请参阅 Hadley Wickham 编写的《ggplot2》和 Leland Wilkinson 编写的《The Grammar\
  \ of Graphics》。使用 `ggplot2`，我们可以从 `vehicles` 数据集中创建一个箱线图，比较不同类别之间 `CO2 emissions`\
  \ 的分布。\n\n```\n> vehicles %>%\n ggplot() +\n geom_boxplot(mapping = aes(x = class,\
  \ y = co2emissions), fill = \"red\") +\n labs(title = \"Boxplot of CO2 Emissions\
  \ by Class\", x = \"Class\", y = \"CO2 Emissions\")\n```\n代码执行的第一步是将数据集 `vehicles`\
  \ 传递给 `ggplot()` 函数。这初始化了绘图过程。将其想象成一个空白画布。接下来的命令仅仅是在画布上添加图层。注意使用 `+` 运算符来添加连续的层。第一层被称为几何对象（geometry），它指定了我们想要创建的可视类型。在这种情况下，我们使用\
  \ `geom_boxplot()` 几何对象创建一个箱线图。在几何对象内部，我们使用 `aes()` 函数指定可视化的属性映射（aesthetics）。属性映射指定了大小、颜色、位置以及其他视觉参数。对于属性映射，我们指定了两个点：第一个是元素与数据之间的关系，通过设置\
  \ `mapping = aes(x = class, y = co2emissions)` 完成。这表示可视化的 x 轴将是 `class` 特性，y 轴将是\
  \ `co2emissions` 特性。我们为属性指定的第二个点是箱子的颜色（`fill = \"red\"`）。在几何层之后，我们使用 `labs()` 函数为图表标题和轴标签添加图层。结果显示，平均而言，紧凑型汽车、小型轿车和中型汽车的二氧化碳排放最低，而货车、特种用途汽车的最高。\n\
  \n#### 关系\n\n关系型可视化用于说明两个或多个变量之间的相关性。这些变量通常都是连续特征。换句话说，它们展示了一个变量如何响应另一个变量的变化。散点图是最常用的关系可视化之一。散点图帮助我们回答的问题包括：\n\
  \n* 特征是显著的？\n* 特征之间是如何相互作用的？\n* 数据中是否存在离群值？\n\n`ggplot` 包提供了 `geom_point()` 几何对象来创建散点图。与我们制作箱线图类似，我们将数据传递给\
  \ `ggplot()`，设置属性参数，并在图表叠加标题和轴标签。\n\n```\n> vehicles %>% \n ggplot() +  \n geom_point(mapping\
  \ = aes(x = citympg, y = co2emissions), color = \"blue\", size = 2) + \n labs(title\
  \ = \"Scatterplot of CO2 Emissions vs. City Miles per Gallon\",  \n      x = \"\
  City MPG\", y = \"CO2 Emissions\") \n\n  Warning message: \n Removed 6 rows containing\
  \ missing values (geom_point).\n```\n不要被警告信息所惊。它只是告诉我们 `citympg` 特性存在缺失值，相应的实例已排除在之外。图表结果显示，随着城市油耗里程的增加，`co2\
  \ emissions` 之减少。这意味着燃油效率越车辆排放的二氧化碳越少。这同样符合预期。\n\n#### 分布\n\n分布型可视化展示了特征值的统计分布。最常用的分布型可视化之一是直方图（histogram）。通过直方图，你可以展示特定特征数据的离散度和偏态（关于偏态的讨论见第\
  \ 5 节）。\n\n\n\n\n- 数据是对称的还是偏态的？\n- 数据中是否存在离群值？\n\n`ggplot` 包中的 `geom_histogram()`\
  \ 几何对象允许我们在 R 语言中创建直方图。对于直方图，我们不为 y 轴设置值，因为该图表使用特征值的频率作为 y 值。我们确实为直方图的 x 轴指定了分箱的数量（`bins\
  \ = 30`）。请参见图 3.8。\n\n```\n> vehicles %>% \n ggplot() + \n geom_histogram(mapping\
  \ = aes(x = co2emissions), bins = 30, fill = \"yellow\", color = \"black\") + \n\
  \ labs(title = \"Histogram of CO2 Emissions\", x = \"CO2 Emissions\", y = \"Frequency\"\
  ) \n```\n\n![图 3.8 CO2 排放量直方图](img/c03f008.png)\n\n**图 3.8** CO2 排放量直方图\n\n图表显示，大多数\
  \ CO[2] 排放值集中在每英里 250 到 750 克之间。它还显示低端和高端确实存在一些离群值。\n\n## 组成\n\n组成部分的可视化展示了数据的组成成分。堆叠柱形图和饼图是两种常用的组成部分可视化。通过堆叠柱形图，你可以展示总值如何被分为若干部分，或者突出每个部分相对于总值的重要性。堆叠柱形图帮助我们回答的一些问题包括：\n\
  \n- 分布在子组内是如何变化的？\n- 组成随时间变化的相对变化如何？\n- 子组对总量的贡献了多少？\n\n要使用 `ggplot` 创建堆叠柱形图，我们使用\
  \ `geom_bar()` 几何对象。为了说明其工作原理，我们创建了一个显示每年驱动类型组成变化的视化图。我们将 x 轴设置为 `year`，并通过设置 `fill\
  \ = drive` 来显示驱动类型的组成。与直方图类似，我们不为 y 轴设置值。为了提高可读性，我们使用 `coord_flip()` 命令翻转图表的轴，使年份绘制在\
  \ y 轴上，汽车数量绘制在 x 轴上。请参见图 3.9。\n\n```\n> vehicles %>% \n ggplot() + \n geom_bar(mapping\
  \ = aes(x =year, fill = drive), color = \"black\") +  \n labs(title = \"Stacked\
  \ Bar Chart of Drive Type Composition by Year\",  \n x = \"Model Year\", y = \"\
  Number of Cars\") + \n coord_flip() \n  \n```\n\n结果显示，除了 1997 年外，在 2010 年之前似乎没有测试过四轮驱动车辆。我们还看到两驱车辆仅在\
  \ 1984 年和 1999 年进行过测试。这两个观察结果似乎指向受影响年份中车辆驱动类型的分类方式可能存在差异。例如，可以想象除了 1997 年以及 2010\
  \ 年到 2018 年之间，所有的四轮驱动车辆都被分类为全轮驱动车辆。同样的逻辑适用于将两驱车辆分类为后驱驱动或前驱。\n\n## 数据准备\n\n在模型构建过程之前，我们需要确保现有的数据适用于我们打算使用的机器学习方法。这一步被称为*数据准备*。数据准备涉及解决数据质量问题，如缺失数据、噪声数据、离群值数据和类别不平衡。它还涉及减少数据或修改结构。\n\
  \n![3.9 按年份划分驱动类型组成的堆叠柱形图](img/c03f009.png)\n\n**图 3.9** 按年份划分驱动类型组成的堆叠柱形图\n\n\n\
  \n\n\n第一类基于匹配的插补方法被称为`hot-deck imputation`（热插补）。在这种方法中，相似的实例与缺失数据的实例属于同一个数据集。例如，考虑我们之前讨论过的学生年龄数据集。假设该数据集还包含每个学生的性别信息。如果我们随后发现数据集中只有两名男学生，其中一个缺失年龄，使用热插补法，我们将使用另一名男学生的观测到的年龄作为该名缺失年龄男学生的年龄的替代。\n\
  \n第二类基于匹配的插补方法被称为`cold-deck imputation`（冷插补）。通过这种方法，我们使用一个单独的数据集来获取替代值。使用说明热插补法的相同例子，通过冷插补法，我们从第二个数据集中识别一个具有非缺失年龄值的相似男学生，并用他们的年龄作为第一个数据缺失年龄的替代。请注意，我们在这里使用的匹配标准（`age`）是相当简单的。良好的基于匹配的方法要求我们在两个实例之间找到多个相似之处以建立匹配。相似性越多越好。\n\
  \n### 基于分布的插补\n\n在`distribution-based imputation`（基于分布的插补）方法中，缺失特征值的替代值是根据该特征观测值的概率分布选择的。这种方法通常用于分类值，其中特征的众数（mode）作为缺失值的替代。请记住，特征的众数是频率最高的值，这意味着它是出现频率最高。\n\
  \n### 预测插补\n\n`Predictive imputation`（预测插补）是使用预测模型（回归或分类）来预测缺失值。在这种方法中，具有缺失值的特征被视为因变量（类别或响应），而其他特征被视为自变量。预测插补涉及大量的开销，因为我们实际上是在实际开始建模过程之前，作为数据准备阶段的一部分训练一个模型来解决缺失值。因此，只有在绝对必要时才使用预测插补。通常情况下，这里讨论的其他插补方法之一证明就足够解决数据集中的缺失值了。\n\
  \n### 均值或中位数插补\n\n对于连续特征，处理缺失值最常用的方法是`mean or median imputation`（均值或中位数插补）方法。顾如名，该方法涉及观测值的均值或中位数作为缺失值的替代。为了说明均值和中位数插补是如何工作的，我们将参考`vehicles`数据集。记得该数据集的描述性统计显示，数据集中的三个特征有缺失值——`citympg`、`displacement`和`highwaympg`。回顾一下，让我们再次查看这些特征的描述性统计。\n\
  \n```\n> vehicles %>%\n select(citympg, displacement, highwaympg) %>%\n summary()\n\
  \ \n citympg          displacement    highwaympg \n Min.   : 6.00   Min.   :0.600\
  \   Min.   : 9.00 \n 1st Qu.:15.00   1st Qu.:2.200   1st Qu.:20.00 \n Median :17.00\
  \   Median :3.000   Median :24.00 \n Mean   :17.53   Mean   :3.346   Mean   :23.77\
  \ \n 3rd Qu.:20.00   3rd Qu.:4.300   3rd Qu.:27.00 \n Max.   :57.00   Max.   :8.400\
  \   Max.   :61.00 \n NA's   :6       NA's   :9       NA's   :8 \n```\n\n结果显示，`citympg`有\
  \ 6 个缺失值，`displacement`有 9 个缺失值，`highwaympg`有 8 个缺失值。这些特征的中位数和均值差异不大，因此我们可以使用任何一种指标进行插补。为了说明，我们将对`citympg`和`highwaympg`使用中位数插补，对`displacement`使用均值插补。在\
  \ R 中，为了使用中位数插补法解决`citympg`特征的缺失值，我们使用`mutate`动词。\n\n```\n> vehicles <- vehicles\
  \ %>%\nmutate(citympg = ifelse(is.na(citympg), median(citympg, na.rm = TRUE), citympg))\
  \ %>%\n mutate(highwaympg = ifelse(is.na(highwaympg), median(highwaympg, na.rm =\
  \ TRUE), highwaympg))\n```\n\n对于`displacement`，我们使用均值插补而不是中位数插补。为此，只需将`median()`函数替换为`mean()`函数即可。\n\
  \n```R\n> vehicles <- vehicles %>%\nmutate(displacement = ifelse(is.na(displacement),\
  \ mean(displacement, na.rm = TRUE), displacement))\n```\n\n现在，让我们再次查看描述性统计，确保我们的数据集中不再有缺失值。\n\
  \n```\n> vehicles %>%\n select(citympg, displacement, highwaympg) %>%\n summary()\n\
  \ \n citympg          displacement    highwaympg \n Min.   : 6.00   Min.   :0.600\
  \   Min.   : 9.00 \n 1st Qu.:15.00   1st Qu.:2.200   1st Qu.:20.00 \n Median :17.00\
  \   Median :3.000   Median :24.00 \n Mean   :17.53   Mean   :3.346   Mean   :23.77\
  \ \n 3rd Qu.:20.00   3rd Qu.:4.300   3rd Qu.:27.00 \n Max.   :57.00   Max.   :8.400\
  \   Max.   :61.00 \n```\n\n#### Noise\n\n\n\n\n\n## 噪声\n\n噪声是测量误差中的随机部分。它通常是由用于收集和处理数据的工具引入的。噪声几乎存在于数据中，有时难以消除，因此，健壮的机器学习算法能够处理数据中的某些噪声至关重要。如果噪声对选定的机器学习方法产生问题，那么目标不应该是尝试消除它，而应该关注最小化它的影响。减少数据中噪声的过程被称为\
  \ `smoothing`（平滑）。平滑有多种方法，包括箱平均平滑、箱边界平滑、聚类平滑和回归平滑。\n\n## 使用箱平均平滑\n\n`Smoothing with\
  \ bin means` 涉及将数据排序并分组指定数量的箱（bins），并将每个箱内的每个值替换为该箱的平均值。箱的数量由用户决定。然而，重要的是，箱的数量越大，噪声的减少就越少；箱的数量越少，噪声的减少越多。为了说明箱平均平滑是如何工作的，让我们考虑一个包含\
  \ 12 个值的数据集，![images](img/c03-i0096.png)<math display=\"inline\" overflow=\"scroll\"\
