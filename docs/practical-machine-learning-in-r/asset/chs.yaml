  \ <mo>&#8943;</mo> <mo>/</mo> <msub> <mi>x</mi> <mi>n</mi> </msub> <mo>/</mo> <msub>\
  \ <mi>C</mi> <mi>k</mi> </msub> </mrow> <mo>)</mo> </mrow><mi>P</mi> <mrow> <mo>(</mo>\
  \ <mrow> <msub> <mi>x</mi> <mn>2</mn> </msub> <mo>/</mo> <msub> <mi>x</mi> <mn>3</mn>\
  \ </msub> <mo>/</mo> <mo>&#8943;</mo> <mo>/</mo> <msub> <mi>x</mi> <mi>n</mi> </msub>\
  \ <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>C</mi> <mi>k</mi> </msub> </mrow>\
  \ <mo>)</mo> </mrow></mrow></math> ![images](img/c07-disp-0006.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mo>=</mo><mi>P</mi> <mrow> <mo>(</mo> <mrow>\
  \ <msub> <mi>x</mi> <mn>1</mn> </msub> <mi mathvariant=\"normal\">&#124;</mi> <msub>\
  \ <mi>x</mi> <mn>2</mn> </msub> <mo>/</mo> <msub> <mi>x</mi> <mn>3</mn> </msub>\
  \ <mo>/</mo> <mo>&#8943;</mo> <mo>/</mo> <msub> <mi>x</mi> <mi>n</mi> </msub> <mo>/</mo>\
