  \ \n  Exec-managerial Handlers-cleaners    Prof-specialty     Other-service\n  \
  \           4066             4099              4140              3295\n     Adm-clerical\
  \   3769             3650\n             1568   Own-child     Unmarried\n       \
  \        5068             3446              981\n               (Other)        9541\n\
  \ \n> table(select(income, nativeCountry))\n \n           United-States:29169  \
  \ <=50K:24719\n                Mexico       :  643   >50K : 7841\n             \
  \   ?            :  583\n                Philippines  :  198\n                Germany\
  \      :  137\n                Canada       :  121\n                (Other)    \
  \  : 1709\n```\n\n我们注意到 `workClassification`、`occupation` 和 `native-` `country`\
  \ 特征的缺失值是用指示变量 `?` 表示的。让我们将其替换为更直观的内容（UNKUNK）。由于这些特征是因子，我们没有使用 `ifelse()` 函数，而是使用\
  \ `recode()` 函数将 `?` 替换为 `UNK`。\n\n```r\n> income <- income %>%\n mutate(workClassification\
  \ = recode(workClassification, \"?\" = \"UNK\")) %>%\n mutate(nativeCountry = recode(nativeCountry,\
  \ \"?\" = \"UNK\")) %>%\n mutate(occupation = recode(occupation, \"?\" = \"UNK\"\
  ))\n```\n\n我们接做的工作也是重新编码我们的类别值。目前，我们的类别值是 `<=50K` 和 `>50K`。让我们转换这些值，使得 0 代表 `<=50K`，1\
  \ 代表 `>50K`。\n\n```r\n> income <- income %>%\n mutate(income = recode(income, \"\
  <=50K\" = \"0\")) %>%\n mutate(income = recode(income, \">50K\" = \"1\"))\n \n>\
  \ summary(income[,\"income\"])\n \n income \n 0:24719 \n 1: 7841\n```\n\n\n\n\n\
  在缺失值和类别值重新编码后，我们现在可以对数据进行划分了。使用之前采用的方法，我们将数据按 75% 到 25% 的比例进行划分，并创建两个名为 `income_train`\
  \ 和 `income_test` 的新数据集。\n\n```\n> set.seed(1234)\n> sample_set <- sample(nrow(income),\
  \ round(nrow(income)*.75), replace = FALSE)\n> income_train <- income[sample_set,\
  \ ]\n> income_test <- income[-sample_set, ]\n```\n\n现在我们已经划分了数据，让我们检查三个数据集之间的类别分布，以确保它们是相似的。\n\
  \n```\n> round(prop.table(table(select(income, income), exclude = NULL)), 4) * 100\n\
  \ \n    0     1 \n75.92 24.08 \n \n> round(prop.table(table(select(income_train,\
  \ income), exclude = NULL)), 4) * 100\n \n    0     1 \n75.78 24.22 \n \n> round(prop.table(table(select(income_test,\
  \ income), exclude = NULL)), 4) * 100\n \n    0     1 \n76.33 23.67\n```\n\n我们的结果显示三个集合之间的类别分布相似。然而，结果也凸显了我们的数据是不平衡的这一事实。正如我们之前讨论的，不平衡的数据会导致模型偏向多数类，因此我们需要平衡训练数据。我们使用\
  \ `DMwR` 包中的 `SMOTE()` 函数来完成这一点。\n\n```\n> library(DMwR)\n> set.seed(1234)\n> income_train\
  \ <- SMOTE(income ~ ., data.frame(income_train), perc.over = 100, perc.under = 200)\n\
  \ \n> round(prop.table(table(select(income_train, income), exclude = NULL)), 4)\
  \ * 100\n \n 0  1 \n50 50\n```\n\n### 训练模型\n\n有了平衡后的训练数据，我们现在可以构建逻辑回归模型了。我们只使用数据集中的类别特征来构建模型，并称之为\
