  \ `File` -> `Open File` 或点击任务栏上的文件图标在 RStudio 中打开现有脚本。你可以通过顶部菜单选择 `File` -> `New\
  \ File` -> `R Script` 或点击任务栏上带有加号的纸张图标创建一个新脚本。\n\n![图 2.9 RStudio IDE 内的小鸡体重脚本](img/c02f009.png)\n\
  `图 2.9` RStudio IDE 内的小鸡体重脚本\n\n![图 2.10 小鸡脚本生成的图表](img/c02f010.png)\n`图 2.10` 小鸡脚本生成的图表\n\
