  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow><mi>i</msub></mrow></math>\
  \ 之间的距离（即残差）表示如下：\n\n(4.7) ![images](img/c04-disp-0007.png)\n```\n<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow> <msub><mi>e</mi><mi>i</msub> <mo>=</mo> <msub><mi>y</mi><mi>i</msub>\
  \ <mo>&#8722;</mo> <msub><mrow><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow><mi>i</msub></mrow>\
  \ </math>\n\n```\n\n残差平方和可以表示如下所示：\n\n(4.8) ![images](img/c04-disp-0008.png)\n```\n\
  <math display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <munderover <mstyle vsize=\"\
  140\" displaystyle=\"true\"><mo>&#8721;</mo> </mstyle> <mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow>\
  \ <mi>n</mi> </munderover> <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"\
  />< <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"\
  />< <mspace width=\"0.25em\"/>< <msubsup <mi>e</mi> <mn>1</mn> <mn>2</mn> </msubsup>\
  \ <mo>=</mo> <munderover <mstyle vsize=\"140\" displaystyle=\"true\"><mo>&#8721;</mo>\
  \ </mstyle> <mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow> <mi>n</mi> </munderover>\
  \ <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"\
  />< <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"/>< <mspace width=\"0.25em\"\
  />< <msup <mrow><mrow><mo>(</mo><mrow><msub <mi>y</mi><mi>i</msub> <mo>&#8722;</mo>\
  \ <msub><mrow><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow><mi>i</msub></mrow>\
  \ <mo>)</mo> </mrow> </mrow> <mn>2</mn> </msup> </mrow> </math>\n```\n\n通过微积分可以证明，使残差平方和最小化的\
  \ ![images](img/c04-i0024.png)值如下：\n\n\n\n\n\n(4.9) $\\frac{\\frac{1}{n}\\sum_{i=1}^{n}\
  \ (x_i - \\bar{x})(y_i - \\bar{y})}{\\frac{1}{n}\\sum_{i=1}^{n} (x_i - \\bar{x})²}$\n\
  \n其中 $\\bar{x}$ 和 $\\bar{y}$ 分别代表 $X$ 和 $Y$ 的样本均值。仔细观察可以发现$\\frac{1}{n}\\sum_{i=1}^{n}\
  \ (x_i - \\bar{x})(y_i - \\bar{y})$ 的分子是 $x$ 和 $y$ 的协方差，分母是 $x$ 的方差。基于此，我们可以将方程重写为：\n\
  \n(4.10) $\\frac{Cov(x, y)}{Var(x)}$\n\n既然我们已经得出了 $\\frac{1}{n}\\sum_{i=1}^{n} (x_i\
  \ - \\bar{x})(y_i - \\bar{y})$ 的值，且 $\\bar{y} = \\beta_0 + \\beta_1\\bar{x}$，那么\
  \ $\\beta_0$ 的最优值可以推导出如下：\n\n(4.11) $\\beta_0 = \\bar{y} - \\beta_1\\bar{x}$\n\n\
  利用这些公式，我们可以使用 R 语言中的 `cov()`、`var()` 和 `mean()` 函数通过 OLS 方法来推导出 $\\beta_0$ 和 $\\\
  beta_1$ 的值：\n\n```\n> B1 <- cov(bikes$temperature, bikes$rentals) / var(bikes$temperature)\n\
  > B1\n[1] 78.4959\n> B0 <- mean(bikes$rentals) - B1 * mean(bikes$temperature)\n\
  > B0\n[1] -166.876\n```\n\n根据我们的结果，对于给定的 $x_i$（`temperature`），我们对 $y_i$（`rentals`）的预测定义如下：\n\
  \n(4.12) $y_i = 166.9 + 78.5x_i$\n\n换句话说，\n\n(4.13) $rentals = 166.9 + 78.5 \\times\
  \ temperature$\n\n这意味着温度每增加一个单位，该城市的自行车租赁量就会相应增加约 78 辆。\n\n我们还可以将天气预报代入此方程，以预测未来某天的租赁数量。之前，我们通过观察图\
  \ 4.3 估计 65 度的天气会导致 5200 辆自行车租赁。我们可以使用方程 4.13 生成一个更具体的估值。\n\n(4.14) $rentals = 166.9\
  \ + 78.5 \\times 65 = 4935.6$\n\n\n\n\n\nR 语言中的 `lm()` 函数自动化了我们在上一节中学习的最小二乘法（OLS）技术。我们不需要分别推导出\
  \ ![images](img/c04-i0032.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>0</mn></msub></mrow></math>\
  \ 和 ![images](img/c04-i0033.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>1</mn></msub></mrow></math>\
  \ 的值，只需通过将数据集传递给 `lm()` 函数并指定预测变量和响应变量，即可构建线性模型。让我们使用与 OLS 方法相同的变量对（`temperature`\
  \ 温度和 `rentals` 租赁量）来构建一个简单的线性回归模型，将其命名为 `bikes_mod1`。\n\n```\n> bikes_mod1 <- lm\
  \ (data=bikes, rentals~temperature)\n```\n\n`lm()` 函数接受两个参数。第一个参数指定我们的数据集（`bikes`）。第二个参数告诉函数，我们打算根据\
  \ `temperature`（我们的预测变量）来预测 `rentals`（我们的响应变量）。\n\n### 评估模型\n\n直接输入模型名称 `bikes_mod1`\
  \ 即可得到关于模型的一些基本信息。\n\n```\n> bikes_mod1\n \nCall:\nlm(formula = rentals ~ temperature,\
  \ data = bikes)\n \nCoefficients:\n(Intercept) temperature \n     -166.9       \
  \ 78.5\n```\n\n注意，系数的值看起来非常熟悉（参见方程 4.12）。截距系数 (-166.9) 与我们在上一节中计算出的 ![images](img/c04-i0036.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>0</mn></msub></mrow></math>\
  \ 值相同，且温度系数 (78.5) 与 ![images](img/c04-i0037.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>1</mn></msub></mrow></math>\
  \ 也相同。因此，这两种方法得到的估计直线是相同的。为了获取关于模型的更详细信息，我们运行 `summary(bikes_mod1)` 命令。\n\n```\n\
  > summary(bikes_mod1)\n \nCall:\nlm(formula = rentals ~ temperature, data = bikes)\n\
  \ \nResiduals:\n    Min       1Q     Median       3Q       Max\n-4615.3  -1134.9\
  \     -104.4   1044.3    3737.8\n \nCoefficients:\n               Estimate   Std.\
  \ Error   t value   Pr(>t|)\n(Intercept)    -166.877      221.816   -0.752     0.452\n\
  temperature      78.495        3.607   21.759    <2e-16\n---\nSignif. codes:  0\
  \ ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\nResidual standard error: 1509 on\
  \ 729 degrees of freedom\nMultiple R-squared:  0.3937,  Adjusted R-squared:  0.3929\n\
  F-statistic: 473.5 on 1 and 729 DF,  p-value: <2e-16\n```\n\n输出现在为我们提供了残差的信息、系数的额外细节，以及残差标准误差、R\
  \ 方、调整后 R 方和 F 统计诊断。这比之前的输出要详细得多。接下来的几节将讨论每个部分的含义。\n\n#### 残差 (Residuals)\n\n残差部分显示了残差的统计摘要（最小值、第一分位数、位数、第三分位数和最大值）。\n\
  \n```\nResiduals:\n    Min       1Q     Median       3Q       Max\n-4615.3  -1134.9\
  \     -104.4   1044.3    3737.8\n```\n\n记得残差是观测值减去预测值，即预测误差。模型摘要显示最小残差为 -4615.3，这意味着至少在一个\
  \ `temperature` 情况下，我们的模型多预测了 4615 辆 `rentals`。同样，最大残差为 3737.8，意味着至少在一个 `temperature`\
  \ 情况下，我们的模型少预测了 3737 辆 `rentals`。\n\n我们还可以查看中位数残差以感知典型的模型性能。位数是数据的中间值。在这种情况下，中位数残差\
  \ (-104.4) 意味着至少一半的残差为负。也就是说，在超过 50% 的情况下，预测值大于观测值。\n\n#### 系数 (Coefficients)\n\n\
  模型摘要的系数部分提供了关于预测变量及其系数的重要信息。\n\n```\nCoefficients:\n               Estimate   Std.\
  \ Error   t value   Pr(>t|)\n(Intercept)    -166.877      221.816   -0.752     0.452\n\
  temperature      78.495        3.607   21.759    <2e-16\n---\nSignif. codes:  0\
  \ ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\n```\n\n第一个字段 (`Estimate`）显示了每个参数的拟合值。这些是我们之前讨论过的系数：![images](img/c04-i0036.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>0</mn></msub></mrow></math>\
  \ 和 ![images](img/c04-i0037.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mover><mi>&#946;</mi><mo>&#8743;</mo></mover></mrow><mn>1</mn></msub></mrow></math>。\n\
  \n第二个字段 (`Std. Error`）显示了标准误差，它是参数估计的标准差。对于估计而言，标准误差越低，估计就越准确。\n\n最后两个字段 (`t value`\
  \ 和 `Pr(>|t|)`) 显示了每个参数的 t 检验和单样本 t 检验的 p 值。在不涉及这些值背后的统计原理的情况下，需要注意的是，它们评估了参数是否显著。也就是说，它们估计了预测能力。为了便于解释，输出提供了\
  \ 0 到 1 之间的显著性水平，编码为 `***`、`**`、`*`、`.` 和 ` `（空单元格）。请注意，这些代码表示的是区间而不是离散的值。每个参数估计都分配了这些代码之一。在我们的输出中，我们看到\
  \ `temperature` 特征的显著性代码为 `***`，这意味着它的显著性水平在 0 到 0.001 之间。显著性水平越低，特征的预测能力越强。在实践中，任何显著性水平为\
  \ 0.05 或低的特征都是统计显著的，并且是良好候选对象。\n\n#### 诊断 (Diagnostics)\n\n`lm()` 模型摘要在末尾也提供了一个诊断值部分。我们可以使用这些诊断值来评估回归模型的整体准确性和实用性。诊断部分包含了关于*残差标准误差\
  \ (RSE)*、*多个 R 方*、*调整后 R 方*以及*F 统计量*的信息。\n\n##### 残差标准误差 (Residual Standard Error)\n\
  \n残差标准误差是模型误差的标准差。对于我们的模型，RSE 为：\n\n```\nResidual standard error: 1509 on 729 degrees\
  \ of freedom\n```\n\n这是预测响应偏离观测数据的平均量。在我们的输出情况下，RSE 显示实际租赁量与我们的预测平均偏了 1509 辆。RSE\
  \ 是模型*拟合优度*的衡量标准。因此，1509 的好坏取决于问题的背景。通常情况下，RSE 越小，我们对模型良好拟合数据就越有信心。\n\n\n\n\n\n\
  自由度值提供了我们模型中可变数据点的数量。在我们的输出中，自由度值为 729。这是通过从数据集的观测数量中减去包括截距在内的模型特征数量计算出的。我们的自行车租赁数据集有\
  \ 731 个观测值，并基于两个特征：`temperature`（温度）和 y 截距建立了模型。因此，模型中的自由度为 731-2 = 729。\n\n## 多元\
  \ R 平和调整 R 平（Multiple and Adjusted R-squared）\n\nR 平统计量提供了相对于剩余标准误差（RSE）的另一种拟合优衡量方法。与提供以\
  \ Y 为单位的拟合优程度绝对测量的 RSE 不同，R 平不依赖于 Y 的标度，并以比例的形式存在，其取值范围在 0 到 1 之间。R 平统计量衡量了由回归模型解释的响应变量中变异的比例。R\
  \ 平越接近 1，说明模型对数据的解释能力越好。以下是我们模型摘要（summary）中的 R 平数据：\n\n```\nMultiple R-squared:\
  \ 0.3937, Adjusted R-squared: 0.3929\n```\n\n我们的输出显示了两种 R 平值。多元 R 平值也称为 `coefficient\
  \ of determination`（决定系数），解释了我们的模型解释因变量值的优劣。从我们的输出中，我们可以说，我们的简单线性回归模型解释了数据大约 39.37%\
  \ 的变异。\n\n调整 R 平值是对多元 R 平的微小修正，它对具有大量独立变量的模型进行了惩罚。当样本量相对于参数数量较小时，它是一种更保守的解释解释衡量方法。在比较具有不同预测变量数量的模型的性能时，它非常有用。在这些情况下，我们在评估每个模型解释了多少数据时，我们会使用调整\
  \ R 平而不是多元 R 平。\n\n## F 统计量（F-statistic）\n\nF 统计量是对预测变量与响应变量之间是否存在关系的统计检验。F 统计量的值越大，关系越强。以下是我们模型的\
  \ F 统计量数据：\n\n```\nF-statistic: 473.5 on 1 and 729 DF, p-value: < 2.2e-16\n```\n\
  \n在我们的输出中，我们可以说，凭借 473.5 的 F 统计量，我们的预测变量与响应变量之间确实存在强关系。然而，重要的是，F 统计量的值受数据集大小的影响。如果我们有一个大型数据集，接近\
  \ 1 的 F 统计量可能仍然表示强关系。相反，如果我们的数据集很小，较大的 F 统计量并不总是意味着强关系。\n\n这就是为什么最好的拟合衡量方法来自于分析\
  \ F 统计量的 p 值，而不是 F 统计量值本身。p 值考虑了数据集的特征，并告诉我们回归模型中的变量以统计学显著方式拟合数据的概率。。该值越接近 0，拟合效果越好。\n\
  \n在我们的示例中，F 统计量的 p 值极小（< 2.2e-16）。正如我们在系数部分提到的，显著性水平小于 0.05 的 p 值通常是可以接受的。因此，我们对自己的\
  \ F 统计量值可以很有信心。\n\n## 多元线性回归（MULTIPLE LINEAR REGRESSION）\n\n在上例中，我们查看了使用单个预测变量（`temperature`）来估计自行车\
  \ `rentals`（租赁）的值。这种方法产生了一个不错的回归模型，解释了数据集中约 39% 的变异。然而，正如我们所知，仅根据温度来预测自行车租赁数量有点太简单了。一个有微风的\
  \ 65 度天与一个有 30 英里/小时阵风的 65 度天是完全不同的！\n\n如果我们想查看数据集中其他变量预测自行车租赁数量的效果有多好呢？一种方法是为每个剩余变量创建单独的模型，以查看它们预测租赁的情况如何。这种方法面临着几个挑战。第一个挑战是，由于我们现在有了多个简单线性回归模型，我们无法根据预测变量值的变化对自行车租赁做出单一预测。第二个挑战是，通过仅基于每个变量创建单独模型，我们忽略了预测变量之间可能存在某些相关性，而这种相关性可能会影响我们的预测。\n\
  \n与其建立多个简单线性回归模型，更好的方法是扩展我们的模型以适应多个预测变量。这种使用多个独立变量来预测因变量的方法被称为 `multiple linear\
  \ regression`（多元线性回归）。类似于方程 4.5，给定 p 个预测变量，我们可以按照斜率-截距格式将多元线性回归方程表示如下：\n\n(4.15)![images](img/c04-disp-0015.png)<math\
