  \n# 第三部分\n\n## 分类\n\n1. 第 6 章：k 近邻算法\n2. 第 7 章：朴素贝叶\n3. 第 8 章：决策树\n\n# 第 6 章\n\n\
  ## k 近邻算法\n\n在第 5 章中，我们引入了逻辑回归作为为新数据分配标签或类别（分类）的多种方法之一。在本章中，我们介绍了另一种分类方法，它根据现有相似数据点中最常见的类别，为未标记的数据点分配类别。这种方法被称为\
  \ `k-nearest neighbors`（k 近邻）。\n\n最近邻算法是懒惰学习器（`lazy learners`）家族的一部分。这类学习器不建立模型，这意味着它们并没有真正进行任何学习。相反，它们在预测阶段仅引用训练数据以便为未标记的数据分配标签。由于对训练集的高度依赖，懒惰学习器也被称为基于实例的学习器（`instance-based\
  \ learners`）或死记学习器（`rote learners`）。尽管懒惰学习器（如 `k`-近邻方法）非常简单，但在处理具有大量特征和大量相似类别实例的难以理解的数据时，它们是非常强大的。\n\
  \n在本章结束时，你将学习到以下内容：\n* 如何量化数据之间的相似性\n* 如何在分类中选择合适的 `k` 值\n* `k`-近邻算法是如何工作的\n* k-NN\
  \ 的优点和缺点\n\n### 心脏病检测\n\n在我们章中探索 `k`-近邻算法时，我们将使用一个包含患者是否患有心脏病信息的数据集。该数据集最初由加州大学欧文分校的研究人员收集，并向科学界开放。我们的任务是使用该数据集预测个人是否可能患有心脏病。\n\
  \n数据集包括：\n* `age` 是年龄，以岁为单位。\n* `sex` 是患者的生物性别。\n* `painType` 描述了患者报告的任何胸痛类型。\n\
  * `restingBP` 是静息收缩压，单位为毫米汞。\n* `cholesterol` 是总胆固醇，以毫克/升为单位。\n* `highBloodSugar`\
  \ 是表示空血糖大于 120 分/升的逻辑值。\n* `restingECG` 是心电图结果的解释。\n* `exerciseAngina` 是表示患者是否经历运动性心绞的逻辑值。\n\
  * `STdepression` 是患者 ST 段的数值评估。\n* `STslope` 是描述心电图上 ST 段斜率的分类值。\n* `coloredVessels`\
  \ 是荧光照射时显示颜色的血管血管数量。\n* `defectType` 是描述心脏缺陷的分类值。\n* `heartDisease` 是我们试图预测的变量。它是一个逻辑值，如果患者患有心脏病则为\
  \ `TRUE`，如果否则为 `FALSE`。\n\n数据集被分为训练集和测试集。根据提供的问题和数据，这些是我们需要回答的一些问题：\n* 根据我们可用的预测变量，我们能多准确地预测患者是否患心脏病？\n\
  * 什么样的 `k` 值能为我们提供最佳性能？\n\n\n\n\n现在，考虑一个 45 岁、胆固醇水平为 225 的假设新患者。仅根据胆固醇水平和年龄，我们如何判断他们是否患有心脏病呢？使用\
  \ `k`-最近邻算法，我们做的第一件事是在数据集中找到与该新患者最相似的 `k` 个患者。这些就是新患者的最近邻居。然后，我们将邻居中最常见的类（类别的标签分配给该新患者。为了说明这种方法，我们在之前的散点图中添加了一个代表新患者的新数据点。这在图\
  \ 6.2 中用黑色方框所示。我们还为样本数据集中现有 20 个患者的每个点标注了唯一标识符。\n\n![图 6.1 从我们数据集中抽取的 20 名患者的年龄与胆固醇水平散点图。每个点的形状和颜色表示患者是否患有心脏病。](img/c06f001.png)\n\
  \n图 6.1 从我们数据集中抽取的 20 名患者的年龄与胆固醇水平散点图。每个点的形状和颜色表示患者是否患有心脏病。\n\n![图 6.2 从我们数据集中抽取的\
  \ 20 名患者以及待分类新患者（黑色正方形）的年龄与胆固醇水平散点图](img/c06f002.png)\n\n图 6.2 从我们数据集中抽取的 20 名患者以及待分类新患者（黑色正方形）的年龄与胆固醇水平散点图\n\
  \n如果 `k` 设置为 1，我们将找到距离新数据点最近的一个现有点。通过视觉检查，我们可以看到这是第 11 号患者或第 9 号患者。假设是第 9 号患者，该患者没有心脏病。因此，我们将新患者也归类为不患心脏病。然而，如果\
  \ `k` 设置为 3，则距离新患者最近的三个邻居是第 9 号、11 号和 5 号患者。由于这三位患者中最常见的类别是心脏病为 `TRUE`，那么我们将新患者也归类为患有心脏病。\n\
  \n### 寻找最近邻\n\n正如我们之前的示例所示，`k` 的值对未标记示例的分类方式有显著影响。我们将在章节稍后的部分讨论选择合适 `k` 值的方法。上一个示例说明的另一点是正确识别新实例最近邻的重要性。在那个例子中，我们是通过视觉检查完成的。但正如你所想象，这并不是一种非常精确的方法。此外，当只考虑两个维度时（如我们在图\
  \ 6.2 中使用的年龄和胆固醇），在视觉上识别彼此靠近的点非常容易。然而，如果我们决定引入更多维度来表示数据集中的额外特征，视觉方法很快就会遇到一些明显的挑战。为了量化两点之间的距离，`k`-最近邻算法使用适用于两维以上数据的距离函数。这种测量被称为`欧几里得距离`。\n\
  \n欧几里得距离是多维空间中两点坐标之间的直线距离。在数学上，我们定义两点 ![images](img/c06-i0011.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mi>p</mi></math> 和 ![images](img/c06-i0012.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>q</mi></math> 之间的欧几里得距离如下：\n\n\
  (6.1)![images](img/c06-disp-0001.png)<math display=\"block\" overflow=\"scroll\"\
