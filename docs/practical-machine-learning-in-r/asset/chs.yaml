  thickmathspace\"/> </mrow></math>\n\n\n\n其中 `n` 代表 `p` 和 `q` 的特征数量，使得 `p1` 和 `q1`\
  \ 代表 `p` 和 `q` 的第一个特征的值；`p2` 和 `q2` 代表 `p` 和 `q` 的第二个特征的值；而 `pn` 和 `qn` 代表 `p` 和\
  \ `q` 的第 n 个特征的值。\n\n假设我们的新患者 `Pw` 年 45 岁，胆固醇水平为 225，而患者 `P1` 年 46 岁，胆固醇水平为 202。若仅用\
  \ `age`（年龄）和 `cholesterol`（胆固醇）特征计算新患者与 `P1` 之间的距离，操作如下：\n\n```\ndist(Pw, P1) =\
  \ sqrt((45-46)² + (225-202)²) = 23.02\n```\n\n这个示例说明了关于欧式距离的一个重要概念。数值较大或范围较宽的特征会对距离计算产生不成比例的影响。例如，假设我们决定对第\
  \ 5 章处理过的 `donor` 数据集使用 k-NN 算法。数据集中的两个特征是 `numberChildren`（孩子数量）和 `totalGivingAmount`（总捐赠金额）。捐赠者\
  \ A 有四个孩子，之前的总捐赠金额为 $5,000；捐赠者 B 有两个孩子，之前的总捐赠金额为 $6,000。若仅用 `numberChildren` 和 `totalGivingAmount`\
  \ 计算这两个捐赠者之间的距离，我们将执行：\n\n```\ndist(A, B) = sqrt((4-2)² + (5000-6000)²) = 1000.002\n\
  ```\n\n从结果可以看出，捐赠者 A 和捐赠者 B 之间的距离几乎就是两个捐赠者 `totalGivingAmount` 特征值的差（（1000）。`numberChildren`\
  \ 特征在距离计算的最终结果中几乎没有意义。为了克服这种方法的局限性，在使用 k-NN 算法之前对特征值进行缩放或归一化是常见做法。因此，在这个示例中，如果我们选择使用第\
  \ 3 章引入的最小归一化（min-max）方法，捐赠者 A 的 `numberChildren` 和 `totalGivingAmount` 的归一化值将分别为\
  \ 0.500 和 0.526。而捐赠者 B 的 `numberChildren` 和 `totalGivingAmount` 的归一化值将分别为 0.167\
  \ 和 0.632。使用这些归一化值进行距离计算得到如下：\n\n```\ndist(A, B) = sqrt((0.500-0.167)² + (0.526-0.632)²)\
  \ = 0.349\n```\n\n\n\n\n我们的距离不再受到某一个特征相对于另一个特征的不比例影响。事实上，通过极值归一化（min-max normalization），我们看到，无论原始特征值的大小如何，在特定特征的值列表中，两个数据点之间的距离越远，它们对整体距离计算的影响就越大。\n\
  \n现在，让我们回到原始示例。对新患者的特征值应用极值归一化方法，我们得到的 `age` 和 `cholesterol` 值分别为 0.750 和 0.250。对\
  \ 11 号患者进行同样的操作，我们得到的 `age` 和 `cholesterol` 值分别为 0.818 和 0.206。因此，与其说我们在公式 6.2 中计算的距离，![images](img/c06-i0030.png)<math\
