  \ <mo>=</mo> <mn>0.628</mn> </mrow> </math> ![Figure 11 (a) 基于 (b) 混淆矩阵的性能衡量召回率](img/c09f010.png)\n\
  \n`图 11` (a) 基于 (b) 混淆矩阵的性能衡量召回率通常是模型精率和召回率之间的权衡。通常，如果一个模型具有高召回率，它的精率就不会高，反之亦然。（之前提到过根据效用评估模型，这意味着取决于目标，模型的可靠性可能比其广度更相关。）\n\
  \n有时，不是二选一，而是将精率和召回率合并为一个单一指标，以便对多个模型进行比较。其中一个指标就是 `F-score`（或 `F-measure`）。`F-score`\
  \ 是精率和召回率的调和平均数，计算方法如下：\n\n9.10![images](img/c09-disp-0010.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
