  \n### 数据归一化\n\n我们已经处理了缺失数据。接下来要做的是归一化数据。和之前一样，我们将使用极差值法（min-max）。首先创建一个名为 `normalize`\
  \ 的函数。\n\n```\n> normalize <- function(x) {\n return((x - min(x)) / (max(x) - min(x)))\n\
  ```\n\n我们将每个特征传递给该函数，将其标准化为 0 到 1 之间。\n\n```\n> donors <- donors %>%\n mutate(age\
  \ = normalize(age))\nmutate(numberChildren = normalize(numberChildren))\nmutate(incomeRating\
  \ = normalize(incomeRating))\nmutate(wealthRating = normalize(wealthRating))\nmutate(mailOrderPurchases\
  \ = normalize(mailOrderPurchases))\nmutate(totalGivingAmount = normalize(totalGivingAmount))\n\
  mutate(numberGifts = normalize(numberGifts))\nmutate(smallestGiftAmount = normalize(smallestGiftAmount))\n\
  mutate(largestGiftAmount = normalize(largestGiftAmount))\nmutate(averageGiftAmount\
  \ = normalize(averageGiftAmount))\nmutate(yearsSinceFirstDonation = normalize(yearsSinceFirstDonation))\n\
  mutate(monthsSinceLastDonation = normalize(monthsSinceLastDonation))\n \n> summary(donors)\n\
  \ \n      age         numberChildren     incomeRating     wealthRating\n Min.  \
  \ :0.0000   Min.   :0.0000   Min.   :0.0000   Min.   :0.0000 \n 1st Qu.:0.5155 \
  \  1st Qu.:0.0000   1st Qu.:0.1667   1st Qu.:0.3750 \n Median :0.6249   Median :0.0000\
  \   Median :0.5000   Median :0.6250 \n Mean   :0.6308   Mean   :0.0148   Mean  \
  \ :0.4965   Mean   :0.5766 \n 3rd Qu.:0.7526   3rd Qu.:0.0000   3rd Qu.:0.6667 \
  \  3rd Qu.:0.8750 \n Max.   :1.0000   Max.   :1.0000   Max.   :1.0000   Max.   :1.0000\
  \ \n                                                             \n mailOrderPurchases\
  \ totalGivingAmount   numberGifts      smallestGiftAmount\n Min.   :0.000000   Min.\
  \   :0.000000   Min.   :0.000000   Min.   :0.000000 \n 1st Qu.:0.004149   1st Qu.:0.004945\
  \   1st Qu.:0.012710   1st Qu.:0.006000 \n Median :0.012448   Median :0.011834 \
  \  Median :0.029660   Median :0.010000 \n Mean   :0.025986   Mean   :0.016236  \
  \ Mean   :0.037150   Mean   :0.015380 \n 3rd Qu.:0.033195   3rd Qu.:0.021018   3rd\
  \ Qu.:0.055080   3rd Qu.:0.020000 \n Max.   :1.000000   Max.   :1.000000   Max.\
  \   :1.000000   Max.   :1.000000 \n                                            \
  \                 \n largestGiftAmount  averageGiftAmount yearsSinceFirstDonation\n\
  \ Min.   :0.000000   Min.   :0.000000   Min.   :0.000000 \n 1st Qu.:0.009045   1st\
  \ Qu.:0.014050   1st Qu.:0.181800 \n Median :0.012060   Median :0.020340   Median\
  \ :0.545500 \n Mean   :0.014689   Mean   :0.023620   Mean   :0.523500 \n 3rd Qu.:0.017085\
  \   3rd Qu.:0.027500   3rd Qu.:0.818200 \n Max.   :1.000000   Max.   :1.000000 \
  \  Max.   :1.000000 \n```\n\n我们已经处理了缺失值。现在我们可以将数据拆分为训练集和测试集。正如我们之前所做的，我们将按照 75:25\
  \ 的比例进行拆分。在这样做之前，我们需要将数据转换为数据框。\n\n```r\n> donors <- data.frame(donors)\n \n> set.seed(1234)\n\
  > sample_index <- sample(nrow(donors), round(nrow(donors)*.75), replace = FALSE)\n\
  > donors_train <- donors[sample_index, ]\n> donors_test <- donors[-sample_index,\
  \ ]\n```\n\n原始数据集、训练集和测试集的类别分布显示我们存在类别不平衡问题（处理类别不平衡请参阅第 3 章）。\n\n```r\n> round(prop_table(table(donors,\
  \ respondedMailing), exclude = NULL)), 4) * 100\n \nFALSE TRUE 94.83 5.17 \n \n\
  > round(prop_table(table(donors_train, respondedMailing), exclude = NULL)), 4) *\
  \ 100\n \nFALSE TRUE 94.75 5.25 \n \n> round(prop_table(table(donors_test, respondedMailing),\
  \ exclude = NULL)), 4) * 100\n \nFALSE TRUE 95.04 4.96\n```\n\n使用 `DMwR` 包中的 `SMOTE()`\
  \ 函数来平衡训练数据。\n\n```r\n> library(DMwR)\n> set.seed(1234)\n> donors_train <- SMOTE(respondedMailing\
  \ ~ ., donors_train, perc.over = 100, perc.under = 200)\n \n> round(prop_table(table(donors_train,\
  \ respondedMailing), exclude = NULL)), 4) * 100\n \nFALSE TRUE \n50   50\n```\n\n\
  \n\n\n在我们将原始数据集划分为训练集和测试集并对训练数据进行平衡后，现在需要将类别标签分离到单独的数据集中。使用 tidyverse 中的 `pull()`\
  \ 命令，我们创建了新的向量来存储类别特征 `respondedMailing` 的标签。我们随后使用的 `knn()` 函数要求这些标签为因子（factors），因此我们使用\
  \ `as.factor()` 函数将向量值也转换为因子。\n\n```\n> donors_train_labels <- as.factor(pull(donors_train,\
  \ respondedMailing))\n> donors_test_labels <- as.factor(pull(donors_test, respondedMailing))\n\
  ```\n\n在我们创建了用于存储训练和测试数据类别标签的向量 `donors_train_labels` 和 `donors_test_labels` 后，就可以从训练集和测试数据集中移除类别标签。\n\
  \n```\n> donors_train <- data.frame(select(donors_train, -respondedMailing))\n>\
  \ donors_test <- data.frame(select(donors_test, -respondedMailing))\n```\n\n我们现在准备好使用\
  \ `k`-NN 根据训练数据为我们未标记的测试示例进行标记了。\n\n### 构建模型\n\n使用 `class` 包中的 `knn()` 函数并将 `k`\
  \ 设置为 5，我们利用训练数据和相应的类别标签来预测测试数据的标签。\n\n```\n> library(class)\n> donors_pred <-\n\
  \ knn(\n   train = donors_train,\n   test = donors_test,\n   cl = donors_train_labels,\n\
  \   k = 5\n )\n \n> head(donors_pred)\n \n[1] TRUE FALSE FALSE TRUE TRUE FALSE\n\
  Levels: FALSE TRUE\n```\n\n### 评估模型\n\n让我们看看预测结果如何。我们首先查看的是预测值与实际值之间的混淆矩阵。然后我们计算预测准确率。\n\
  \n```\n> donors_pred_table <- table(donors_test_labels, donors_pred)\n> donors_pred_table\n\
  \ \n                  donors_pred\ndonors_test_labels FALSE TRUE\n             \
  \ FALSE 6132 5337\n                 TRUE 278 320\n \n> sum(diag(donors_pred_table))\
  \ / nrow(donors_test)\n \n[1] 0.5346814\n```\n\n我们的结果显示，使用 `k` = 5 的预测准确率为 53.47%。这仅比抛硬币稍微好一点，所以我们确实还有些工作要做。请记住，在本例中，我们仅使用了数值特征进行预测，因此在接后的练习中，我们将为读者提供机会，通过考虑分类特征来改进我们的预测。\n\
  \n## 练习\n\n1. 观察下面的图。图中心附近的正方形代表一个新的未标记点。使用 `k`-最近邻算法，在使用以下每个参数时，你会给该点分配哪个类别？\n\n\
  \   ![](img/c06uf001.png)\n\n   1. `k` = 1\n   2. `k` = 3\n   3. `k` = 7\n   4.\
  \ `k` = 15\n\n2. 修改用于此的代码以包含分类变量。这对准确率有什么影响？\n\n# 第 7 章：朴素贝叶 (Naïve Bayes)\n\n在第\
  \ 6 章中，我们介绍了 `k`-最近邻，这是一类根据相似数据分配类别的学习器族。在本章中，我们介绍了一种名为朴素贝叶斯的新方法，它的前提是先验事件可以作为未来事件的良好估计。例如，如果\
  \ 10 天中下了 4 天雨，我们估计概率为 40%。在本章结束时，你将学到：\n\n* 概率、联合概率和条件概率的基本原理\n* 贝叶斯分类的工作原理以及它与传统方法的区别\n\
  * 如何在 R 中构建贝叶斯分类器\n* 朴素贝叶斯的优缺点\n\n## 分类垃圾邮件\n\n在探索朴素贝叶斯方法时，我们将使用一个包含 1600 多条消息的数据集，标记为“ham”（正常邮件）或“spam”（垃圾邮件）。该数据集来自安然公司（Enron\
  \ Corporation），是由联邦监管委员会在调查期间发布的。我们将使用的数据集格式与你之前遇到的其他格式不同。它是一个*稀疏矩阵*（sparse matrix）。这意味着它是由\
  \ 0 和 1 组成的矩阵，其中大部分值都是 0。在这种情况下，矩阵中的每行代表一封电子邮件。每列代表一个单词。如果该行对应的电子邮件包含该列对应的单词，则每个字段的值为\
  \ 1。例如，假设我们有以下电子邮件消息：\n\n* “Hi, Let's get coffee”\n\n以及这条回复发送的独立消息：\n\n* “Great!\
  \ Coffee sounds great!”\n\n这些消息共同可以用表 7.1 所示的矩阵表示。\n\n表 7.1：两个示例消息的稀疏矩阵\n\n| message_id\
  \ | coffee | get | great | Hi | lets | sounds |\n| --- | --- | --- | --- | --- |\
  \ --- | --- |\n| 1 | 1 | 1 | 0 | 1 | 1 | 0 |\n| 2 | 1 | 0 | 1 | 0 | 0 | 1 |\n\n\n\
  \n\n\n朴素贝叶斯法以 18 世纪的神职人员兼数学家托马斯·贝叶斯（Thomas Bayes）命名，他开发了描述事件概率以及如何根据额外信息修正这些概率的数学原理。这些基础数学原理今天被称为`Bayesian\
  \ methods`。在机器学习中，一个`event` 是预期的结果（或类别），例如“真”或“假”、“是”或“否”，以及“垃圾邮件”或“非垃圾邮件”。基于贝叶斯方法的分类器试图通过回答以下问题来预测未标记数据的类别：“根据先验证据，一个新的未标记实例最可能的类别是什么？”它通过以下步骤实现这一点：\n\
  \n1. 找到所有与未标记实例具有相同特征值（或配置）的现有实例\n2. 确定这些实例所属的最可能的类别\n3. 将识别出的类别标签分配给该未标记实例\n\n\
  这种分类方法使用`conditional probability` 的概念来确定实例最可能的类别。在详细介绍该过程的工作原理之前，让我们花些时间复习一下朴素贝叶斯分类器的一些基本概念——概率、联合概率和条件概率。\n\
  \n### 概率\n\n一个事件的`probability`是指该事件发生的几率。由于大多数事件无法完全确定地预测，因此一个事件发生的机会通常用该事件的概率来描述。例如，当掷出硬币时，有两种可能的结果：正面或反面。其中一个结果（例如正面）的概率，是我们关心的结果数量（正面）除以所有可能结果的总数（正面或反面）。因此，正面的概率为\
  \ ![images](img/c07-i0003.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></mrow></math>。其数学符号为\
  \ ![images](img/c07-i0004.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>h</mi><mi>e</mi><mi>a</mi><mi>d</mi></mrow><mo>)</mo></mrow><mo>=</mo><mfrac\
  \ bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></mrow></math>。\n\n我们也可以利用事件之前发生的情况来帮助对该事件未来发生几率的理解。在这种情况下，我们将事件的概率描述为该事件*曾经*发生过的次数除以该事件*可能*发生的总次数。一个事件可能发生的次数被称为一次`trial`。\n\
  \n让我们以天气预报为例，假设我们无法获取多普勒气象雷达数据，但想预测今天下午下阵雨的概率。为了做到这一点，我们可以利用历史事件来指导我们的预测。假设我们可以访问如气压、风速和湿度等数据集。假设该数据集指示了下午是否下了雨。根据这些数据，如果\
  \ 10 天中有 8 天下了雨，我们可以说降雨的概率是 ![images](img/c07-i0005.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mfrac bevelled=\"true\"><mn>8</mn><mn>10</mn></mfrac></mrow></math>。在这个例子中，试验次数为\
  \ 10，我们用来表示降雨的数学符号为 ![images](img/c07-i0006.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>r</mi><mi>a</mi><mi>i</mi><mi>n</mi><mi>f</mi><mi>l</mi></mrow><mo>)</mo></mrow><mo>=</mo>0.8</mrow></math>。\n\
  \n注意的是，试验中互斥结果的概率之和为 1。互斥意味着一个事件不能同时发生又不发生。因此，如果 ![images](img/c07-i0007.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mi>r</mi><mi>a</mi><mi>i</mi><mi>n</mi><mi>f</mi><mi>l</mi></mrow><mo>)</mo></mrow></math>\
  \ 的概率是 0.8，那么未降雨的概率将是 ![images](img/c07-i0008.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo>(</mo><mi>n</mi><mi>o</mi><mi>r</mi><mi>a</mi><mi>i</mi><mi>n</mi><mi>f</mi><mi>l</mi></mrow><mo>)</mo></mrow></math>![images](img/c07-i0009.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow>1-0.8=0.2</mrow></math>\n\n\
  ### 联合概率\n\n通常我们不仅关注单个事件的概率，还关注作为试验一部分发生的多个事件的概率。为了说明这个概念，让我们回到垃圾邮件分类章节开头介绍的情景。这次，假设我们有以下四封邮件：\n\
  \n1. “Hi, Let's get coffee”\n2. “Great! Coffee sounds great!”\n3. “Free coffee is\
  \ great!”\n4. “Great coffee on Sale!”\n\n如果我们得知前两封邮件是合法邮件（ham），后两封是未请求的商业邮件（spam），那么我们可以使用如下稀疏矩阵来表示这些邮件：\n\
  \n| message_id | coffee | free | get | great | hi | lets | sale | sounds | type\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | 1 | 0\
  \ | 1 | 0 | 1 | 1 | 0 | 0 | ham |\n| 2 | 1 | 0 | 0 | 1 | 0 | 0 | 0 | 1 | ham |\n\
  | 3 | 1 | 1 | 0 | 1 | 0 | 0 | 0 | 0 | spam |\n| 4 | 1 | 0 | 0 | 1 | 0 | 0 | 1 |\
  \ 0 | spam |\n\n\n\n\n在这种场景下，每条邮件消息都是一次试验，而每个单词（包括邮件类型：正常邮件或垃圾邮件）都是一个事件。通过这些信息，我们可以评估多个事件同时发生的概率。这被称为\
  \ `joint probability`（联合概率）。例如，假设我们想知道一封既是垃圾邮件又包含 `great` 单词的消息的概率。如果我们假设这两个事件是独立发生的，这意味着其中一个事件的发生不影响另一个事件的发生，那么这两个事件的联合概率\
  \ ![images](img/c07-i0010.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo}(\\mo><mrow><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi><mi\
  \ mathvariant=\"normal\">,</mi><mspace width=\"0.25em\"/><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></mrow></math>\
  \ 等于每个孤立事件概率的乘积，即 ![images](img/c07-i0011.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo}(\\mo><mrow><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo)</mo></mrow><mspace\
  \ width=\"0.25em\"/><mo>&#215;</mo><mspace width=\"0.25em\"/><mi>P</mi><mrow><mo}(\\\
  mo><mrow><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></mrow></math></math>。\n\
  \n根据我们的稀疏矩阵，我们可以计算 `spam` 的概率 ![images](img/c07-i0012.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo)</mo></mrow></math></math>\
  \ 以及 `great` 的概率 ![images](img/c07-i0013.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></mrow></math></math>。`spam`\
  \ 的概率是标记为 `spam` 的消息数除以消息总数。![images](img/c07-i0014.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><><><mo}(\\mo><><><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo)</mo></mrow><mspace\
  \ width=\"0.25em\"/><mo>=</mo><mspace width=\"0.25em\"/><mfrac bevelled=\"true\"\
  ><mn>2</mn><mn>4</mn></mfrac><mspace width=\"0.25em\"/><mo>=</mo><mspace width=\"\
  0.25em\"/><mn>0.5</mn></mrow></math>。`great` 的概率是包含 `great` 单词的消息数除以消息总数。![images](img/c07-i0015.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></mrow><mo>=</mo><mfrac\
  \ bevelled=\"true\"><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mn>0.75</mn></mrow></math>。因此，这两个事件的联合概率\
  \ ![images](img/c07-i0016.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi><mi\
  \ mathvariant=\"normal\">,</mi><mspace width=\"0.25em\"/><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></math>\
  \ 可以被解释为包含 `great` 单词且是 `spam` 的概率。换句话说，在八封消息中，我们预期三封包含 `great`。\n\n### 条件概率\n\n\
  独立性概念在处理不相关的事件时是合理的，例如消息是否为垃圾邮件。对于相关事件，我们不是简单地评估 `spam` 的概率，而是确定给定 B 的 A。这种表示法为\
  \ ![images](img/c07-i017.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>A</mi><mi matem=\"normal\">&124;</mi><mi>B</mi></mrow><mo)</mo></mrow></math>，可以使用\
  \ `Bayes theorem`（贝叶斯定理）来表示，它描述了相关事件 A 和 B 之间的关系：\n\n```\n![images](img/c07-disp-001.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>A</mi><mi\
  \ matem=\"normal\">&124;</mi><mi>B</mi></mrow><mo)</mo></mrow> <mo>=</mo> <mfrac>\
  \ <mrow <mi>P</mi><mrow><mo}(\\mo><mi>A</mi><mo)</mo></mrow> <mi>P</mi><mrow><mo}(\\\
  mo><><><mi>B</mi><mi matem=\"normal\">&124;</mi><mi>A</mi></mrow><mo)</mo></mrow>\
  \ </mfrac> <mrow <mi>P</mi><mrow><mo}(\\mo><mi>B</mi><mo)</mo></mrow></math>\n```\n\
  \n该公式有四个部分。第一部分是给定 B 发生时 A 的条件概率。写法为 ![images](img/c07-i018.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>A</mi><mi\
  \ matem=\"normal\">&124;</mi><mi>B</mi></mrow><mo)</mo></mrow></math></math>被称为\
  \ `posterior probability`（后验概率）。在垃圾邮件示例中，这是给定包含 `great` 单词的情况下消息是垃圾邮件的概率。写法为 ![images](img/c07-i019.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo}(\\mo><><><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi><mi\
  \ matem=\"normal\">&124;</mi><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mrow><mo)</mo></mrow></math></math>。\n\
  \n\n\n贝叶斯公式（公式）的第二部分被称为`先验概率`（prior probability）。它的表示为 ![images](img/c07-i0020.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mspace width=\"thickmathspace\"\
  /><mi>P</mi><mrow><mo>(</mo><mi>A</mi><mo>)</mo></mrow></mrow></math>它描述了在我们考虑任何额外信息之前，事件\
  \ A 本身的概率。在垃圾邮件示例中，这仅仅是任何之前的消息为垃圾邮件的概率，即 ![images](img/c07-i0021.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo>)</mo></mrow></mrow></math。这个概率代表了我们在考虑任何额外证据之前，对消息可能是垃圾邮件概率性的先验信念。根据上一节的稀疏矩阵，我们看到在四条消息中，两条被标记为垃圾邮件。因此，![images](img/c07-i0022.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo>)</mo></mrow><mo>=</mo><mfrac\
  \ bevelled=\"true\"><mn>2</mn><mn>4</mn></mfrac><mo>=</mo><mn>0.5</mn></mrow></math。\n\
  \n贝叶斯公式的下一部分代表后验概率的逆。它是给定 A 发生的情况下 B 发生的概率。这被称为`似然`（likelihood），表示为 ![images](img/c07-i0023.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>B</mi><mi\
  \ mathvariant=\"normal\">&#124;</mi><mi>A</mi></mrow><mo)</mo></mrow></mrow></math。在我们的垃圾邮件示例中，这是在任何之前的垃圾邮件中出现\
  \ `great` 单词的似然。稀疏矩阵显示有两条被标记为垃圾邮件的消息，且它们都包含 `great` 一词。所以，![images](img/c07-i0024.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mrow><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi\
  \ mathvariant=\"normal\">&#124;</mi><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo)</mo></mrow><mo>=</mo><mfrac\
  \ bevelled=\"true\"><mn>2</mn><mn>2</mn></mfrac><mo>=</mo><mn>1</mn></mrow></math。\n\
  \n贝叶斯公式的第四部分被称为`边际似然`（marginal likelihood）。它代表事件 B 单身的概率，表示为 ![images](img/c07-i0025.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mi>B</mi><mo)</mo></mrow></mrow></math。在我们的垃圾邮件示例中，这是任何邮件包含\
  \ `great` 单词的概率。根据我们的稀疏矩阵，三条消息包含 `great` 单词。因此，![images](img/c07-i0026.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mo)</mo></mrow><mo>=</mo><mfrac\
  \ bevelled=\"true\"><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mn>0.75</mn></math>\n\
  \n现在我们可以将贝叶斯定理应用于我们的垃圾邮件示例。为了确定邮件在包含 `great` 的情况下是垃圾邮件的概率，我们进行以下操作：(7.2)![images](img/c07-i0021.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo)</mo></mrow><mi\
  \ mathvariant=\"normal\">&#124;</mi><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi></mo>=</mo><mfrac><mrow><mi>P</mi><mrow><mo>(</mo><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mo></mo></math>这意味着在包含\
  \ `great` 的情况下，邮件是垃圾邮件的概率为 67%。\n\n### 朴素贝叶斯分类 (Classification with Naïve Bayes)\n\
  \n现在我们对贝叶斯定理有了基本的理解，让我们探索这一思想如何用于分类。之前我们提到，基于贝叶斯方法的分类器通过回答此问题来预测未标记数据的类别：“根据先验证据，最可能的类别是什么？”最可能的类别是其所属概率最高的类别。为了确定这一点，我们需要计算实例属于每个类别的条件概率。假设我们的数据集由\
  \ ![images](img/c07-i0027.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>n</mi></math> 个预测器组成，标记为 ![images](img/c07-i0028.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub>x</mi><mn>1</mn></msub><momo><msub>x</mi><mn>2</mn></msub><momo><mo>&#8943;</mo><momo><msub>x</mi><mi>n</mi></msub></mrow></math\
  \ 以及 ![images](img/c07-i0029.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>m</mi></math> 个不同的类别值，表示为 ![images](img/c07-i0030.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><msub>C</mi><mn>1</mn></msub><momo><msub>C</mi><mn>2</mn></msub><momo><mo>&#8943;</mo><momo><msub>C</mi><mi>m</mi></msub></mrow></math；那么使用贝叶斯定理，实例属于类别\
  \ ![images](img/c07-i0031.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub>C</mi><mi>k</mi></msub></mrow></math> 的条件概率表示如下：\n\n\n\n\n### (7.3\n\
  \n![images](img/c07-disp-0003.png)<math display=\"block\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>P</mi> <mrow> <mo>(</mo> <mrow> <msub> <mi>C</mi> <mi>k</mi> </msub>\
  \ <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>x</mi> <mn>1</mn> </msub> <mi\
  \ mathvariant=\"normal\">&#160;;</mi> <msub> <mi>x</mi> <mn>2</mn> </msub> <mi mathvariant=\"\
  normal\">&#160;;</mi> <mo>&#8943;</mo> <mi mathvariant=\"normal\">&#160;;</mi> <msub>\
  \ <mi>x</mi> <mi>n</mi> </msub> </mrow> <mo>)</mo> </mrow> <mo>=</mo> <mfrac> <mrow>\
  \ <mi>P</mi> <mrow> <mo>(</mo> <mrow> <msub> <mi>C</mi> <mi>k</mi> </msub> </mrow>\
  \ <mo>)</mo> </mrow> <mi>P</mi> <mrow> <mo>(</mo> <mrow> <msub> <mi>x</mi> <mn>1</mn>\
  \ </msub> <mi mathvariant=\"normal\">&#160;;</mi> <msub> <mi>x</mi> <mn>2</mn> </msub>\
  \ <mi mathvariant=\"normal\">&#160;;</mi> <mo>&#8943;</mo> <mo>,</mo> <mi mathvariant=\"\
  normal\">&#160;;</mi> <msub> <mi>x</mi> <mi>n</mi> </msub> </mrow> <mo>)</mo> </mrow>\
  \ <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>C</mi> <mi>k</mi> </msub> <mo>)</mo>\
  \ </mrow> </mrow> <mi>P</mi> <mrow> <mo>(</mo> <mrow> <msub> <mi>x</mi> <mn>1</mn>\
  \ </msub> <mo>/</mo> <mi mathvariant=\"normal\">&#160;;</mi> <msub> <mi>x</mi> <mn>2</mn>\
  \ </msub> <mi mathvariant=\"normal\">&#160;;</mi> <mo>&#8943;</mo> <mi mathvariant=\"\
  normal\">&#160;;</mi> <msub> <mi>x</mi> <mi>n</mi> </msub> </mrow> <mo>)</mo> </mrow>\
  \ </mfrac> </mrow> </mrow></math>\n\n根据此计算结果，每个实例随后被分配到其所属条件概率最高的类别中。\n\n在上一个例子中，我们只考虑单个单词\
  \ `great` 的出现，我们可以很容易地手动计算出 `likelihood`（似然）![images](img/c07-i0032.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>P</mi><mrow><mo>(</mo> <mrow><mi>g</mi><mi>r</mi><mi>e</mi><mi>a</mi><mi>t</mi><mi\
  \ mathvariant=\"normal\">&#124;</mi><mi>s</mi><mi>p</mi><mi>a</mi><mi>m</mi></mrow><mo>)</mo></mrow></mrow></math>当我们开始考虑额外的特征时，此类计算的复杂性会显著增加。在这种情况下，我们需要计算在考虑其他每个特征的条件下，每个特征的概率的乘积。根据条件概率重复运用的链式法则，公式\
  \ 7.3 中的 `likelihood` 的计算方式如下：\n\n### (7.4\n\n![images](img/c07-disp-0004.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <mi>P</mi> <mrow> <mo>(</mo>\
  \ <mrow> <msub> <mi>x</mi> <mn>1</mn> </msub> <mo>/</mo> <msub> <mi>x</mi> <mn>2</mn>\
  \ </msub> <mo>/</mo> <mo>&#8943;</mo> <mo>/</mo> <msub> <mi>x</mi> <mi>n</mi> </msub>\
  \ <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>C</mi> <mi>k</mi> </msub> </mrow>\
  \ <mo>)</mo> </mrow></mrow></math> ![images](img/c07-disp-0005.png)<math display=\"\
