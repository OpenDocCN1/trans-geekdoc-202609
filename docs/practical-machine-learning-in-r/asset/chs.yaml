  \ xi\n440. 440\n\n# 引言\n\n机器学习正在改变世界。无论规模大小，每一家机构都试图从它们每天存储和处理的海量信息中提取知识。对预测未来的诱人渴望，驱动着从营销到医疗保健等领域业务分析师和数据科学家的工作。我们写这本书的目标是让分析工具对广泛的读者变得易于上手。\n\
  \nR 编程语言是一种专门设计的语言，旨在促进统计分析和机器学习。我们选择它作为本书的语言，不仅是因为它在该领域广受欢迎，还因为其直观的特质，特别是对于那些将其作为第一门编程语言的人来说。\n\
  \n市面上有很多关于机器学习实际应用的书籍，是为商务人士和旁观者设计的。同样，也有许多深层技术性的资源深入探讨了机器学习的数学和计算机科学。在本书中，我们力求连接这两个世界。我们试图为读者提供一个机器学习的直观介绍，并关注机器学习在当今世界中的实际应用。同时，我们并不回避代码。正如我们在本科和研究生课程中所做的那样，我们寻求让每个人都能掌握\
  \ R 编程语言。我们希望您在阅读本书时打开旁笔记本电脑，跟随我们的示例并尝试练习题。\n\n祝您在开启机器学习之旅时好运！\n\n## 本书涵盖了什么内容？\n\
  \n本书介绍了如何使用 R 编程语言进行机器学习。\n\n1. **第 1 章：什么是机器学习？** 这一章介绍了机器学习的世界，并描述了机器学习如何从数据中发现知识。在本章中，我们解释了无监督学习、有监督学习和强化学习之间的区别。我们描述了分类问题和回归问题之间的区别，并解释了如何衡量机器学习算法的效率。\n\
  \n2. **第 2 章：R 和 RStudio 简介** 在这一章中，我们介绍了 R 编程语言以及我们在本书其余部分将使用的工具 set。我们从初学者的心态来接触\
  \ R，解释了 RStudio 集成开发环境的使用，并引导读者创建和执行他们的第一个 R 脚本。我们还解释了使用包（packages）来分发 R 代码，以及 R\
  \ 中不同数据类型的使用。\n\n3. **第 3 章：数据管理** 这一章向读者介绍了数据管理概念以及使用 R 收集和管理数据。我们引入了 `tidyverse`，这是一个旨在促进分析过程的\
  \ R 包集合，并描述了在 R 中描述和可视化数据的不同方法。我们还涵盖了如何对数据进行清洗、转换和压缩，以便为机器学习做好准备。\n\n4. **第 4 章：线性回归**\
  \ 在这一章中，我们将通过探索线性回归进入有监督机器学习的世界。我们解释了回归背后的底层统计原理，并演示了如何在 R 中拟合简单和复杂的回归模型。我们还解释了如何评估、解释和应用回归模型的结果。\n\
  \n5. **第 5 章：逻辑回归** 虽然线性回归适用于需要预测数值的问题，但它并不适用于适用于分类预测。在这一章中，我们描述了逻辑回归——一种分类预测技术。我们讨论了广义线性模型的使用，并描述了如何在\
  \ R 中构建逻辑回归模型。我们还解释了如何评估、解释和改进逻辑回归模型的结果。\n\n6. **第 6 章：k 最近邻算法** `k`-最近邻技术允许我们根据其他相似数据点的分类来预测某个数据点的分类。在本章中，我们描述了\
  \ `k`-NN` 过程的工作原理，并演示了如何在 R 中构建 `k`-NN` 模型。我们还展示了如何应用该模型对新数据点的分类进行预测。\n\n7. **第\
  \ 7 章：朴素贝叶斯** 朴素贝叶斯分类方法使用概率表来预测实例属于特定类别的概率。在本章中，我们讨论了联合概率和条件概率的概念，并描述了贝叶斯分类方法的功能机制。我们演示了在\
  \ R 中构建朴素贝叶斯分类器，并用它对未见过的数据进行预测。\n\n8. **第 8 章：决策树** 决策树是一种流行的建模技术，因为它们能产生直观的结果。在本章中，我们描述了决策树模型的创建和解释。我们还解释了在\
  \ R 中生长树的过程以及使用剪枝来增加该模型的泛化能力。\n\n9. **第 9 章：性能评估** 没有任何建模技术是完美的。每种技术都有其优缺点，并为不同类型的问题带来不同的预测能力。在本章中，我们讨论了评估模型性能的过程。我们引入了重采样技术，并解释了如何使用它们来估计未来的性能。我们还演示了如何在\
  \ R 中可视化和评估模型性能。\n\n10. **第 10 章：性能改进** 一旦我们有了评估性能的工具，就可以利用它们来帮助改进性能。在这一章中，我们查看了调优机器学习的技术。我们还演示了如何通过同时利用多个模型的预测能力来增强预测能力。\n\
  \n11. **第 11 章：关联规则发现模式** 关联规则帮助我们发现数据集中存在的模式。在本章中，我们引入了关联规则方法，并演示了如何在 R 中从数据集生成关联规则。我们还解释了评估和量化关联规则强度的方法。\n\
  \n12. **第 12 章：数据分组** 聚类是一种无监督学习技术，根据项目之间的相似性进行分组。在本章中，我们解释了 `k`-means 聚类算法分割数据的方式，并演示了在\
  \ R 中使用 `k`-means 聚类。\n\n## 读者支持\n\n为了充分利用本书，我们鼓励您利用配套网站上提供的学生和教师材料。我们也鼓励您就我们如何改进本书提供建设性的反馈。\n\
