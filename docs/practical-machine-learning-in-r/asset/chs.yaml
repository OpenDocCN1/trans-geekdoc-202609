  \ Submission”（可能的书籍错误提交）。\n\n# 第一部分\n\n## 入门\n\n1. 第 1 章：什么是机器学习？\n2. 第 2 章：R 语言与\
  \ RStudio 简介\n3. 第 3 章：数据管理\n\n# 第 1 章：什么是机器学习？\n\n欢迎来到`machine learning`的世界！你即将开启一段令人兴奋的冒险，去探索数据科学家如何利用算法，从企业、组织和个人每天产生的海量数据中发现隐藏的知识。\n\
  \n如果你和我们一样，经常会发现自己处于这样的境：面对如山般的数据，你确定其中包含重要的见解，但却不知道如何从这所谓的“大海捞”中提取出那根“知识之针”。这正是机器学习大显身手的地方。本书致力于为你提供利用机器学习算法力量所需的知识和技能。你将学习适用于机器学习解决方案的各种类型问题，以及应对不同类型问题最合适的机器学习技术分类。\n\
  \n最重要的是，我们将以实用的心态对待这个复杂的技术领域。在书中，我们的目的不是纠结于这些算法复杂的数学细节。相反，我们将重点关注你如何立即让这些算法为你工作服务。我们还将向你介绍\
  \ `R` 编程语言，我们认为这种语言特别适合从实战角度来处理机器学习问题。但现在不必担心编程或 `R`。我们将在第 2 章中讨论这些内容。现在，让我们深入其中，更好地理解机器学习是如何工作的。\n\
  \n在本章结束时，你将学习到以下内容：\n\n* 机器学习如何从数据中发现知识\n* 无监督学习、监督学习和强化学习技术之间有什么区别\n* 分类问题和回归问题之间有什么区别\n\
  * 如何衡量机器学习算法的有效性\n* 交叉验证如何提高机器学习模型的准确性\n\n## 在数据中发现知识\n\n在机器学习的世界里，我们的目标是利用算法从数据集中发现知识，然后利用这些知识帮助我们对未来做出明智决策。无论我们所处的具体专业领域如何，事实都是如此，因为机器学习的应用涵盖极其广泛。例如，以下是机器学习常见的增加价值的案例：\n\
  \n* 划分客户并确定吸引不同客户群的营销信息\n* 发现系统和应用日志中的异常，这些异常可能预示着网络安全事件\n* 根据市场和环境状况预测产品销售\n* 根据客户过去的活动和相似客户的偏好，推荐他们可能想看的下一部电影\n\
  * 根据预测需求提前设定酒店房价格\n\n当然，这些只是几个例子。机器学习可以为几乎任何发现此前未知知识有用的领域带来价值——我们挑战你去思考一个知识无法提供优势的领域！\n\
  \n### 算法简介\n\n在后续对本书的阅读过程中，你会看到我们不断将机器学习技术称为 `algorithms`（算法）。这是计算机科学领域的一个术语，在数据科学领域反复出现，因此理解它非常重要。虽然这个术语听起来技术性很复杂，但算法的概念其实非常直观，我们胆敢猜测，你几乎每天都会使用某种形式的算法。\n\
  \n简单来说，算法就是你在执行某个过程时所遵循的一系列步骤。最常用的是，当我们提到计算机执行计算任务时所遵循的步骤时使用这个术语，但我们可以把每天做的许多事情看作是算法。例如，当我们在大城市的街道上走到十字路口时，我们会遵循一套过马路的算法。图\
  \ 1.1 展示了该过程运作的一个示例。\n\n当然，在计算机科学领域，我们的算法更加复杂，并通过编写软件来实现，但我们可以以同样的方式来思考它们。算法仅仅是一系列精确的观察、决策和指令，告诉计算机如何执行操作。我们设计机器学习算法是为了发现数据中的知识。随着本书的深入，你将学习许多不同类型的机器学习算法以及它们如何以非常不同的方式来实现这一目标。\n\
  \n![图 1.1 过马路算法](img/c01f001.png)\n\n图 1.1 过马路算法\n\n### 人工智能、机器学习与深度学习\n\n我们听到人工智能、机器学习和深度学习这些术语几乎被互换使用，用来描述任何计算机处理数据的技术。现在你正进入数据科学的世界，对这些术语有一个更精确的理解是非常关重要的。\n\
  \n* 人工智能 (`AI`）：包括任何试图让计算机系统模仿人类行为的技术类型。顾如其名，我们正试图让计算机系统人为地表现出智能。现在，当然现代计算机无法达到人类大脑中那种复杂推理的水平，但我们可以尝试模仿人类的一部分行为和判断。\n\
  * 机器学习 (`ML`）：人工智能技术的一个子集，试图将统计学应用于数据问题，通过从示例中泛化来发现新知识。换句话说，机器学习技术是设计用于学习的人工智能技术。\n\
  * 深度学习：机器学习的进一步细分，它使用一组被称为 `神经网络` 的复杂技术以特定方式发现知识。它是机器学习的一个高度专业的子领域，最常用于图像、视频和音频分析。\n\
  \n图 1.2 显示了这些领域之间的关系。在书中，我们关注机器学习技术。具体而言，我们关注不符合深度学习定义的机器学习类别。\n\n## 机器学习技术\n\n\
  我们在书中讨论的机器学习技术分为两大。监督学习算法根据过去数据的标记示例来学习模式。无监督学习算法则在没有标记数据协助的情况下寻找模式。让我们详细查看这些技术。\n\
  \n![图 1.2 人工智能、机器学习与深度学习的关系](img/c01f002.png)\n\n图 1.2 人工智能、机器学习与深度学习的关系\n\n###\
  \ 监督学习\n\n\n\n\n\n`Supervised learning` 技巧可能是最常用的机器学习算法一类。这些技术的目的是使用现有的数据集生成一个模型，然后帮助我们对未来的未标记数据进行预测。更正式地说，我们提供一个\
  \ `training dataset` 作为输入提供给监督机器学习算法。然后，该算法使用这些训练数据来开发一个 `model` 作为输出，如图 1.3 所示。\n\
  \n你可以将监督机器学习算法产生的模型看作某种水晶球——一旦我们拥有了，就可以用它对我们的数据进行预测。图 1.4 展示了该模型是如何运作的。一旦我们拥有了模型，就可以获取我们遇到的任何新数据元素，并根据模型从训练数据集中获得的知识对该新元素做出预测。\n\
  \n我们之所以使用“监督”（supervised）一词来描述这些技术，是因为我们正在使用训练数据集来监督我们模型的创建。该训练数据集包含了帮助我们完成预测任务的标签（labels）。\n\
  \n让我们通过一个具体的例子来强化这一点。考虑一下在图 1.5 所示的汽车经销商处工作的贷款员。经销商的销售人员与单个客户合作销售汽车。客户通常没有足够的现金来直接购买汽车，因此他们会寻找融资方案。我们的工作是从三个选项中为客户匹配合的贷款产品：\n\
  \n*   次级贷款（Subprime loans）的利率最高，提供给可能错过还款截止日期或发生贷款违约的客户。\n*   顶级的贷款（Top-shelf loans）利率最低，提供给不太可能逾期还款且还款概率极高的客户。\n\
  *   标准贷款（Standard loans）提供给处于这两组中间的客户，利率介于这两个值之间。\n\n![图 1.3 通用监督学习模型](img/c01f003.png)\n\
  **图 1.3** 通用监督学习模型\n\n![图 1.4 使用监督学习模型进行预测](img/c01f004.png)\n**图 1.4** 使用监督学习模型进行预测\n\
  \n我们从销售人员那里收到贷款申请，必须当场做出决定。如果我们不采取行动，客户可能会离开商店，业务将流向另一家经销商。如果我们为客户提供的贷款比他们通常符合条件的风险更高，我们可能会将业务流失给另一家提供较低利率的经销商。另一方面，如果我们为客户提供的利率低于他们应得的水平，在他们之后发生违约时，我们可能无法从交易中获利。\n\
  \n我们目前的业务模式是审查客户的信用报告，并根据我们在该领域的多年经验对贷款类别做出决定。我们已经“见过了世面”，可以依靠我们的“直觉”来做出这些重要的业务决策。然而，作为初级数据科学家，我们现在意识到，可能有更好的方法使用机器学习来解决这个问题。\n\
  \n我们的汽车经销商可以使用监督机器学习来协助完成这项任务。首先，他们需要一个包含过去客户信息及其贷款还款行为的训练数据集。训练数据集中包含的数据越多越好。如果他们有几年的数据，将有助于开发出高质量的模型。\n\
  \n数据集可能包含关于每个客户的各种信息，例如客户的大致年龄、信用评分、房屋拥有状况和车辆类型。这些数据点中的每一个被称为关于客户的 `feature`（特征），它们将成为算法创建的机器学习模型的输入。数据集还需要包含训练数据集中每个客户的\
  \ `labels`（标签）。这些标签是我们想要使用模型进行预测的值。在这种情况下，我们有两个标签：`default`（违约）和 `repaid`（已还清）。我们为训练数据集中的每个客户贴上与其贷款状态相应的适当标签。如果他们全额还清了贷款，就会被赋予“repaid”标签，而未能还清贷款的人则被赋予“default”标签。\n\
  \n![图 1.5 使用机器学习分类汽车经销商客户](img/c01f005.png)\n**图 1.5** 使用机器学习分类汽车经销商客户\n\n生成数据集中的一小部分出现在图\
  \ 1.6 中。注意关于该数据集的两点。第一，数据集中的每行都对应一个客户，而这些客户都是已完成贷款期的 `past`（过去）客户。我们知道向这些每个客户发放的贷款的结果，这为我们提供了训练监督学习模型所需的标签。第二，模型包含的每个特征都是贷款员在做出贷款决策时可以获取的特征。这对于创建一个对我们给有问题有效的模型至关重要。如果模型包含一个指定客户在贷款期内是否失业的特征，那可能会为我们提供准确的结果，但贷款员实际上无法\
  \ `use`（使用）该模型，因为他们无法在决策时为某个客户确定这一特征。\n\n![图 1.6 过去客户的行为数据集](img/c01f006.png)\n\
  **图 1.6** 过去客户的行为数据集\n\n如果我们使用机器学习算法根据这些数据生成模型，它可能会捕捉到一些肉眼观察就能发现的特征。首先，大多数信用评分低于\
  \ 600 且在我们处办理过贷款的人都违约了。如果我们仅根据这一特征就做出决定，我们的情况可能会很好。然而，如果我们仔细观察数据，我们可能会意识到通过以下说法可以实现更好的拟合：任何信用评分低于\
  \ 600 且购买了轿车的人可能会违约。这种知识当由算法生成时，就是机器学习模型！\n\n贷款员随后可以通过简单遵循这些规则来部署该机器学习模型，在每次有人申请贷款时做出预测。如果下一个进门的客户信用分为\
  \ 780 分并正在购买一辆跑车，如图 1.7 所示，他们应该获得顶级贷款，因为他们极不可能发生违约。如果客户的信用分为 410 分并购买轿车，我们绝对会将他们归入次级贷款。处于这些极端情况之间的客户将适用于标准贷款。\n\
  \n现在，这是一个简化的例子。我们示例中的所有客户都完美地契合我们描述的类别。当然，在现实世界中并不会发生这种情况。我们的机器学习算法将面临不完美的数据，这些组之间没有整齐、清晰的划分。我们将拥有更多观测值的数据集，我们的算法不可避免地会出错。\n\
  \n![图 1.7 应用机器学习模型](img/c01f007.png)\n\n\n\n\n\n# 图 1.7 应用机器学习模型\n\n### 无监督学习\n\n\
  `Unsupervised learning` 技术的工作方式完全不同。监督技术在有标记的数据上进行训练，而无监督技术则基于未标记的训练数据集开发模型。这改变了它们能够处理的数据集的性质，以及它们所产生的模型。无监督技术不是提供一种根据历史数据为输入分配标签的方法，而是允许我们发现数据中隐藏的模式。\n\
  \n理解监督算法与无监督算法区别的一种方法是：监督算法帮助我们为新的观测值分配已知标签，而无监督算法则帮助我们发现数据集中观测值的新标签（或分组）。\n\n例如，让我们回到之前的汽车\
  \ 4S 店，想象我们现在正在处理客户数据集，并想为我们的售后部门制定一项营销活动。我们怀疑数据库中的客户在某些方面是相似的，但这些相似性并不像他们购买的 `cars`\
  \ 类型那样而易见，我们需要发现这些分组可能是哪些，并利用它们来开发不同的营销信息。\n\n无监督学习算法非常适合这种开放式的发现任务。我们描述的汽车 4S 店问题更通用的称为`market\
  \ segmentation`（市场划分）问题，有大量的无监督学习技术旨在帮助这类分析。我们将在第 12 章中讨论组织如何使用无监督`clustering`（聚类）算法来进行市场划分。\n\
  \n让我们另一个例子。假设我们经营一家杂货店，试图确定产品在货架上的最佳位置。我们知道客户经常进入我们的商店寻找一些日常必需品，如 `milk`、`bread`、`meat`\
  \ 和 `produce`。我们的目标是设计商店，让冲动购买物品在商店内彼此靠近。如图图 1.8 所示，我们希望将`cookies`放在 `milk` 旁边，这样进店买\
  \ `milk` 的人就会看到它们，并想：“这些饼干配这杯牛奶太好喝了！”\n\n![根据无监督学习在杂货店中策略性地放置物品](img/c01f008.png)\n\
  \n# 图 1.8 根据无监督学习在杂货店中策略性地放置物品\n\n确定客户经常一起购买哪些物品也是机器学习中一个著名的问题，被称为`market basket`（购物篮分析）问题。我们将在第\
  \ 11 章中讨论数据科学家如何使用`association rules`（关联规则）方法来解决购物篮问题。\n\n## 模型选择\n\n在上一节中，我们描述了根据用于训练的数据类型对算法进行分类的方法。使用标记训练集的算法被称为`supervised\
  \ algorithms`（监督算法），因为训练受到标签的“监督”；而使用未标记训练集的算法被称为`unsupervised algorithms`（无监督算法），因为它们可以自由学习发现的任何模式，无需“监督”。将这种分类方案理解为描述机器学习算法*如何*学习。\n\
  \n我们也可以根据算法学习的*内容*对它们进行分类。在书中，我们讨论了我们可以从数据中学到的的三种主要知识。\n\n## 分类\n\n`Classification`\
  \ 技术使用监督学习来预测`category`（类别）。这意味着我们模型的输出是一个`label`，或者更正式地说是一个变量。以下是它们可能取的某些值示例：\n\
  - `Educational degree`（学历）：`none`（无）、`bachelor's`（本科）、`master's`（硕士）\n- `Citizenship`（国籍）：`United\
  \ States`（美国）、`Nigeria`（尼日利亚）等\n- `Political party`（政党）：`Democrat`（民主党）、`Republican`（共和党）、`Independent`（独立人士）\n\
  - `Customer status`（客户状态）：`current`（当前）\n\n例如在本章前面，我们讨论了一个汽车 4S 店需要预测`repayment`的问题。这是一个分类示例，因为我们正在尝试为每个客户分配类别。我们在现实世界中遇到各种分类。我们可能会尝试确定哪些优惠最有吸引力。\n\
  \n### 回归\n\n`Regression` 技术使用监督学习来预测连续响应。简单来说，这意味着我们模型的输出是一个数值。不是预测离散集合中的成员身份，而是预测一个值。\n\
  \n例如，财务顾问可能想根据收入筛选潜在客户。如果顾问没有明确的收入数据，他们可能会使用已知收入的数据集来训练回归模型。该模型可能像这样：\n\n![方程](img/c01-disp-0001.png)\n\
  \n```\n<math display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n  <mrow>\n    <mi>I</mi><mi>n</mi><mi>c</mi><mi>o</mi><mi>m</mi><mi>e</mi><mo>=</mo><mn>5000</mn><mo>+</mo><mn>1000</mn><mo>&x2;</mo><mi>a</mi><mi>g</mi><mi>e</mi><mo>+</mo><mn>3000</mn><mo>&x2;</mo><mi>y</mi><mi>e</mi><mi>r</mi><mi>s</mi>\n\
  \  </mrow>\n</math>\n```\n\n如果财务顾问遇到新客户，他们可以使用此公式根据年龄和受教育年限预测个人的收入。对于每增长一年，他们预计个人会额外增加\
  \ 1000 美元的年收入。同样，高中以后每读一年书，收入就会增加 3000 美元。\n\n回归模型非常灵活。我们可以输入任何可能的年龄或收入值，并对该人的收入做出预测。当然，如果我们没有获得良好的训练数据，我们的预测可能不准确。我们可能还会发现变量之间的关系无法通过简单的线性技术解释。例如，收入可能会随着年龄增长而增加，但仅持续到某一点。\n\
  \n### 相似性学习技术\n\n\n\n\n相似学习技术利用机器学习算法来帮助我们识别数据中的共同模式。我们可能并不确切知道自己想要发现什么，因此我们允许算法探索数据集，寻找我们可能尚未预判的相似性。\n\
  \n我们在本章中已经提到了两种相似学习技术。关联规则技术在第 11 章中进行了更充分的讨论，它允许我们解决类似于市场篮子问题的问题——即哪些物品经常被一起购买。聚类技术在第\
  \ 12 章中进行了更充分的讨论，允许我们根据观测值拥有的相似特征将它们分组成不同的簇。\n\n关联规则和聚类都是相似学习技术无监督使用的示例。也可以以有监督的方式使用相似学习。例如，最近邻算法寻求根据训练数据集中最相似观测值的标签，来为观测值分配标签。我们将在第\
  \ 6 章中详细讨论这些。\n\n## 模型评估\n\n在开始讨论特定的机器学习算法之前，在脑中先有一个我们将如何评估算法有效性的思路也会很有帮助。我们将在书中其他部分更详细地涵盖这个主题，这里只是为了让你对这个概念有一个初步了解。在我们处理每种机器学习技术时，我们将讨论如何针对数据集评估其性能。我们将在第\
  \ 9 章中对模型性能评估进行更全面的讨论。\n\n在此之前，重要的要意识到，某些算法在不同问题上的效果会比其他算法更好。数据集的性质和算法的性质将决定适当的技术。\n\
  \n在监督学习领域，我们可以根据算法所犯错误的数量和或幅度来评估其有效性。对于分类问题，我们通常查看算法做出错误分类预测的百分比，或者`误分类率`。同样，我们可以查看预测正确的预测百分比，这被称为算法的`准确率`。对于回归问题，我们通常查看算法预测值与实际值之间的差异。\n\
  \n## 分类错误\n\n许多分类问题寻求预测一个二值值，以识别观测值是否属于某类成员。我们将观测值属于该类的情况称为`正`（positive）案例，将观测值不属于该类的情况称为`负`（negative）案例。\n\
  \n例如，假设我们正在开发一个模型，用于预测某人是否有乳糖不耐症（导致他们难以消化乳制品）。我们的模型可能包括已知或怀疑会导致乳糖不耐症的人口统计学、遗传和环境因素。模型根据这些属性对个人是否患乳糖不耐症做出预测。预测为乳糖不耐症的个人是预测正，而预测为不患乳糖不耐症（或更简单地说，预测为乳糖耐受）的个人是预测负。这些预测值来自我们的机器学习模型。\n\
  \n然而，还存在现实世界的真相。无论模型预测如何，每一个人要么有乳糖不耐症，要么没有。这些真实世界的数据决定了这个人是真实的正还是真实的负。当观测值的预测值与同一观测值的实际值不同时，就会发生`错误`。分类问题中可能会发生两种不同的错误。\n\
  \n*   `假阳性错误`（False positive errors）发生在模型将观测值标记为预测正，但实际上它是一个真实的负的情况下。例如，如果模型识别某人可能患乳糖不耐症，而他们实际上是乳糖耐受的，这就是一个假阳性错误。假阳性错误也称为`第一类错误`（Type\
  \ I errors）。\n*   `假阴性错误`（False negative errors）发生在模型将观测值标记为预测负，但实际上它是一个真实的正的情况下。在我们的乳糖不耐症模型中，如果模型预测某人乳糖耐受，而他们实际上患有乳糖不耐症，这就是一个假阴性错误。假阴性错误也称为`第二类错误`（Type\
  \ II errors）。\n\n同样，我们可以根据标签将预测正确的观测值正确标记为`真正`（true positives）或`真负`（true negatives）。图\
  \ 1.9\n\n**图 1.9** 错误类型\n\n当然，假阳性和假阴性错误的绝对数量取决于我们所做的预测数量。我们不是使用这些基于幅度的衡量标准，而是测量这些错误发生的百分比。例如，`假阳性率`（FPR）是被错误识别为正的负实例的百分比。我们可以通过将假阳性的数量（`FP`）除以假阳性数量与真负数量（`TN`）的总和来计算此比率，或者用公式：\n\
  \n![equation](img/c01-disp-0002.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>F</mi><mi>P</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>F</mi><mi>P</mi></mrow><mrow><mi>F</mi><mi>P</mi><mo>+</mo><mi>T</mi><mi>N</mi></mrow></mfrac></mrow></math>\n\
  \n同样，我们可以如下 true 计算`假阴性率`（FNR）：\n\n![equation](img/c01-disp-0003.png)<math display=\"\
  block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mi>F</mi><mi>N</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>F</mi><mi>N</mi></mrow><mrow><mi>F</mi><mi>N</mi><mo>+</mo><mi>T</mi><mi>P</mi></mrow></mfrac></mrow></math>\n\
  \n关于哪种错误类型比另一种更好或更差，没有明确的规则。这种判断在很大程度上取决于所解决的问题类型。\n\n例如，假设我们正在使用机器学习算法将大量的潜在客户列表分类为会购买我们产品的人（正案例）或不会购买我们产品的人（负案例）。我们只对被算法标记为正的潜在客户发送邮寄。\n\
  \n在假阳性邮寄的情况下，你向一个不购买你产品的客户发送了小册。你损失了打印和邮寄的费用。在假阴性结果的情况下，你没有向一个会响应的客户发送邮寄。你失去了向该客户销售产品的机会。这哪种更糟糕？这取决于邮件的成本、每个客户的潜在利润以及其他因素。\n\
  \n另一方面，考虑使用机器学习模型对患者进行癌症风险筛查，并将结果为正的患者推荐进行进一步的更具侵入性的测试。在假阴性结果的情况下，可能患癌症的患者没有接受额外的筛查，可能导致活动疾病未得到治疗。这显然是一个非常糟糕的结果。\n\
  \n然而，假阳性结果也没有没有处。如果患者被错误标记为可能患癌，他们将承受不必要的昂贵且痛苦的测试，消耗了本可以用于其他患者的资源。在等待新的测试结果时，他们还会受到情感伤害。\n\
  \n\n\n\n机器学习机器学习的评估是一个棘手的命题，它不能脱离问题领域独立存在。数据科学家、领域专家，在某些情况下还包括伦理学家应该共同努力，根据每种错误类型的收益和成本来评估模型。\n\
  \n## 回归错误\n\n我们在回归问题中可能犯的错误与众众不同，因为我们预测的本质不同。当我们为实例分配分类标签时，我们的预测可能是正确的也可能是错误的。当我们将一个良性肿瘤标记为恶性时，这显然是一个错误。然而，在回归问题中，我们预测的是数值。\n\
  \n考虑我们在本章之前讨论的收入预测问题。如果一个人的实际收入为 45,000 美元，而我们的算法预测值恰好是 45,000 美元，这显然是一个正确的预测。如果算法预测收入为\
  \ 0 美元或 10,000,000 美元，几乎所有人都会认为这些预测在客观上是错误的。但预测为 45,001 美元、45,500 美元、46,000 美元或\
  \ 50,000 美元的预测呢？这些都是错误的吗？其中一些或全部是否足够接近呢？\n\n我们根据预测中误差的幅度来评估回归算法更具意义。我们通过测量预测值与实际值之间的距离来确定这一点。例如，请考虑图\
  \ 1.10 所示的数据集。\n\n![图 1.10 残差误差](img/c01f010.png)\n\n图 1.10 残差误差\n\n在这个数据集中，我们正尝试根据当天的平均温度来预测每天发生的自行车租赁次数。自行车租赁次数显示在\
  \ y 轴上，温度显示在 x 轴上。黑线是一条回归线，表示我们预计自行车租赁次数会随着温度的升高而增加。那条黑线就是我们的模型，而黑点是沿着该线在特定温度值下的预测值。\n\
  \n橙色点代表了在自行车租赁公司运营期间收集的真实数据。那是“正确”的数据。预测值与实际值之间的红线是误差的幅度，我们称之为`residual value`（残差值）。线越长，算法在该数据集上的表现越差。\n\
  \n我们不能简单地将残差相加，因为其中一些负值会抵消正值。相反，我们将每个残差值平方，然后将这些平方后的残差相加，得到一个名为`residual sum of\
  \ squares`（残差和）的性能指标。\n\n我们将在第 4 章中重新回顾残差误差以及这个特定的自行车租赁数据集。\n\n## 错误类型\n\n当我们为最简单问题之外的任务构建机器学习模型时，模型将包含某种类型的预测错误。这种错误有三种形式。\n\
  \n* `Bias`（在机器学习领域指偏差）是由于我们选择机器学习模型而产生的错误类型。当我们选择的模型类型无法很好地拟合数据集时，产生的就是偏差。\n\n*\
  \ `Variance`（方差）是模型对训练集的微小波动过于敏感时产生的错误类型。\n\n* `Irreducible error`（不可约误差或噪声）是无论使用何种模型都无法减少的误差。它是问题本身固有的。\n\
  \n\n\n\n我们有时也需要独立的数据集来辅助模型开发过程。这些数据集被称为`验证集`（validation datasets），它们用于在迭代过程中帮助开发模型，在每次迭代期间调整模型参数，直到我们找到一种在验证集上表现良好的方法。虽然使用测试集作为验证集可能很有吸引力，但这种方法重新引入了对测试集过拟合的风险，因此我们应该使用第三个数据集来实现此目的。\n\
  \n#### 留出法 (Holdout Method)\n测试和验证数据集最直接的方法是`留出法`（holdout method）。在这种方法中（如图图 1.13\n\
  还有许多更高级的方法来创建验证集，它们在模型开发的迭代过程中对数据进行重复采样。这些方法被称为`交叉验证`（cross-validation），对于较小的数据特别有用，因为对于较小的数据，我们不希望为了验证目的而预留一部分数据集。\n\
  \n图 1.14 展示了交叉验证的一个示例。在这种方法中，我们仍然留出数据集用于测试，但在模型开发的每次迭代中，我们使用训练数据集的不同部分进行验证。如果这听起来很复杂，不用担心。当我们读到第\
  \ 9 章时，我们会详细详细讨论留出法和交叉验证。现在，你只需要对这些技术有一个基本的了解即可。\n\n![图 13 留出法](img/c01f013.png)\n\
  \n图 13 留出法\n\n![图 14 交叉验证方法](img/c01f014.png)\n\n图 14 交叉验证方法\n\n## 练习\n\n1. 考虑以下机器学习问题。每个问题最适合作为分类问题还是回归问题来处理？为你的答案提供理由。\n\
  \    - 预测商业航行中捕获的鱼的数量\n    - 识别新技术的可能采用者\n    - 使用天气和人口数据预测自行车租赁率\n    - 预测向特定个人发送的最佳营销活动\n\
  2. 你开发了一种机器学习算法，根据多项诊断标准评估患者的心脏发作风险（一个正性事件）。你会如何描述以下事件？\n    - 你的模型识别出某患者可能发生心脏发作，且该患者确实发生了心脏发作。\n\
  \    - 你的模型识别出某患者可能发生心脏发作，但该患者没有发生。\n    - 你的模型识别出某患者可能发生心脏发作，且该患者没有发生。\n    - 你的模型识别出某患者可能发生心脏发作，但该患者确实发生了。\n\
  \n# 第 2 章 R 和 RStudio 简介\n\n机器学习位于统计学和软件开发世界的交叉点。在整书中，我们将重点关注用于挖掘数据中隐藏价值的统计技术。在本章中，我们将为你提供实现这些技术所需的计算机科学工具。在书中，我们选择使用\
  \ R 语言来实现。本章将介绍 R 语言的基本概念，你将在书的剩余部分中持续使用这些概念。\n\n在本章结束时，你将学习到以下内容：\n- R 编程语言在数据科学和分析领域扮演的角色\n\
  - RStudio 集成开发环境 (IDE) 如何辅助 R 代码编码\n- 如何在 R 中进行编码\n- 如何编写、保存和执行 R\n- R 中不同数据类型的用途\n\
  \n## 欢迎 R\n\nR 编程语言诞生于 1992 年，旨在创建一种用于统计应用的特殊语言。在二十多年后，它已演变为全球统计学家、数据科学家和业务分析师最流行的语言之一。R\
  \ 之所以迅速受欢迎有几个原因。首先，它是作为由社区开发者开发的免费开源语言向所有人提供的，这打破了过去依赖专有软件且许多人负担不起局面。\n\nR 的受欢迎性持续增长，因为它被机器学习的创造者们采用。任何新的机器学习技术都能迅速通过\
  \ CRAN（综合 R 网络）提供，这是一个开源的仓库。图 2.1 展示了通过 CRAN 可用的包数量随时间的增长。你可以看到，在过去的十年中增长显著。\n\n\
  ![图 2.1 CRAN 包数量随时间的增长](img/c02f001.png)\n\n同样重要的是了解 R 是一种`解释型语言`，而不是编译语言。在解释型语言中，你编写的代码存储在一个名为`脚本`的文件中，该脚本直接由处理代码的系统执行。在编译语言中，开发者编写的源代码通过一个称为`编译器`的专用程序转换为机器语言。\n\
  \nR 是解释型语言的事实意味着你可以直接执行 R 命令并看到结果。例如，你可以执行以下简单的命令来将 1 加 1：\n\n```\n> 1+1\n[1] 2\n\
  ```\n\n当你这样做时，R 解释器会立即给出结果：2。\n\n## R 和 RStudio 组件\n\n我们的工作环境由两个主要组件组成：R 编程语言和 RStudio\
  \ 集成开发环境 (IDE)。虽然 R 是开源语言，但 RStudio 是一个旨在让 R 变得易用的商业产品。\n\n### R 语言 开源 R 语言可以从 R\
  \ 项目网站 `https://www.r-project.org` 免费下载。在本书编写期间，R 的当前版本是 3.6.0，代号为“种树”。R 通常编写为向后兼容，因此如果你使用的是较新版本的\
  \ R，在跟随书中代码时不应遇到任何困难。如果你还没有安装 R，现在是在你的计算机上安装最新版本 R 的好时机。只需访问 R 项目主页，点击 CRAN 链接，并选择离你最近的\
  \ CRAN 镜像。你将看到一个类似于图 2.2 所示的 CRAN 站点。选择适用于你操作系统的下载链接并在下载完成后运行安装程序。\n\n\n\n\n作为一个集成化开发环境，RStudio\
  \ 提供了一个设计良好的图形界面，以协助你创建 R 代码。你完全没有理由简单地打开一个文本编辑器，编写 R 脚本，然后直接使用开源的 R 环境执行它。但你也没有理由*应该*这样做！RStudio\
  \ 让管理代码、监控其进度以及排查 R 脚本中可能出现的问题变得容易得多。\n\n虽然 R 是一个开源项目，但 RStudio IDE 有多个版本。RStudio\
  \ 有一个免费提供的开源版本，但 RStudio 也提供了商业版产品，这些版本带有增强的支持选项和额外的功能。\n\n对于本书而言，RStudio 的开源版本已经绰绰有余。\n\
  \n## RStudio Desktop\n\nRStudio Desktop 是最常用的 RStudio 版本，特别是对于个人程序员。它是一个你下载并安装在\
  \ Windows、Mac 或 Linux 系统上的软件软件包，它为你提供了一个全面的 R 开发环境。你可以在图 2.3 中看到 RStudio IDE 运行的示例。\n\
  \n![图 2.3 RStudio Desktop 为 Windows、Mac 和 Linux 系统提供了 IDE。](img/c02f003.png)\n\n\
  `图 2.3` RStudio Desktop 为 Windows、Mac 和 Linux 系统提供了 IDE。\n\n如果你还没有在电脑上安装 RStudio\
  \ Desktop，现在现在安装吧。你可以在 `https://www.rstudio.com/products/rstudio/download/#download`\
  \ 下载最新版本。\n\n## RStudio Server\n\nRStudio 还提供服务器版本的 RStudio IDE。该版本对于协作编写 R 代码并希望维护中心化仓库的团队来说非常理想。当你使用\
  \ RStudio 的服务器版本时，可以通过网络浏览器访问 IDE。服务器会向你展示一个看起来与桌面环境相似的窗口化视图。你可以在图 2.4 中看到基于 Web\
  \ 的 IDE 示例。\n\n使用 RStudio Server 需要构建一个 Linux 服务器（本地或云端），然后在该服务器上安装 RStudio Server\
  \ 代码。如果你的组织已经在使用 RStudio Server，你可以在跟随本书中的示例时使用它。\n\n## 探索 RStudio 环境\n\n让我们快速浏览一下\
  \ RStudio Desktop 环境，并熟悉打开 RStudio 时看到的各种窗口。\n\n![图 2.4 RStudio Server 提供了用于协作的\
