  \ 5 章中提到的，`wealthRating` 的范围在 1 到 9 之间。然而，我们的统计摘要显示，存在一些 `wealthRating` 为 0 的实例。我们需要同样排除这些实例。\n\
  \n```\n> donors <- donors %>%\n filter(!is.na(incomeRating) & !is.na(wealthRating)\
  \ & wealthRating > 0)\n> summary(select(donors, incomeRating, wealthRating))\n \n\
