  \ R 来计算它。\n\n### 回归\n\n*回归分析*是一类用于建模变量复杂数值关系的统计方法。通常，回归分析涉及三个关键部分：\n\n- 单个数值因变量，代表我们想要预测的值。该变量被称为*因变量*\
  \ (Y)。\n- 一个或多个自变量 (X)，我们认为可以用它们来预测因变量。这些变量被称为*预测变量*。\n- *系数* (β)，描述了预测变量与因变量之间的关系。我们在分析时并不知道这些值，并使用回归技术来估计它们。系数构成了回归模型。\n\
  \n这三个部分之间的关系通过一个从自变量空间到因变量空间的函数来表示，形式如下：\n\n(4.2)![images](img/c04-disp-0002.png)\n\
