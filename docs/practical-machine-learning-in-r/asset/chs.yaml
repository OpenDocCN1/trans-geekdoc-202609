  \ (Files)”标签允许你导航到设备上的文件系统，以打开和管理 R 脚本及其他文件。\n\n图 2.15 显示了 RStudio 中的“包 (Packages)”标签，它允许你安装、更新和加载包。许多人倾向于直接在\
