  \ 1.294563\ngender                   1.115104  3        1.018324\n```\n\n我们的情况很好。没有任何数值特征的\
  \ VIF 超过了 5。有了我们的新模型，是时候对测试数据进行一些预测了。\n\n```\n> donors_pred2 <- predict(donors_mod2,\
  \ donors_test, type = 'response')\n \n> head(donors_pred2)\n \n        1       \
  \  2         3         4         5         6 \n0.3534621 0.2537164 0.5182092 0.6619119\
  \ 0.3158936 0.5246699 \n```\n\n正如我们之前看到的的那样，输出为我们在给定测试数据中每个观测值的预测变量值的情况下，`respondedMailing\
  \ = 1` 的概率。与我们之前模型的结果相比，我们看到预测概率发生了一些细微变化。捐赠者 1 的响应概率从上一个模型的 38.2% 下降到这个模型的 35.3%。然而，捐赠者\
  \ 4 的响应概率从上一个模型的 62.3% 增加到这个模型的 66.2%。这些变化对我们数据分类的影响取决于我们为模型选择的截断值。我们将在下一节讨论这一点。\n\
  \n### 选择截断值\n\n在我们之前的尝试中，我们选择使用 0.5 的截断来解释预测概率，其中等于或高于 0.5 的值被解释为 1，低于该阈值的值解释为 0。虽然\
  \ 0.5 在某些情况下是一个合理的截断，但它并不是所有情况的理想截断值。为了给模型获得理想的截断值，我们将使用 R 中 `InformationValue`\
  \ 包的 `optimalCutoff()` 函数。我们向函数传递了三个参数。\n\n*   第一个参数是响应实际值向量（`actuals = donors_test$respondedMailing`）。\n\
  *   第二个参数是响应的*预测*值向量（`predictedScores = donors_pred2`）。\n*   第三个参数指定我们希望最优截断基于最大化\
  \ 1 和 0 的正确预测观测值比例的值。\n\n```\n> library(InformationValue)\n> ideal_cutoff <-\n optimalCutoff(\n\
  \    actuals = donors_test$respondedMailing,\n    predictedScores = donors_pred2,\n\
  \    optimiseFor = \"Both\")\n \n> ideal_cutoff\n[1] 0.5462817\n```\n\n结果告诉我们，我们不应该使用\
  \ 0.5 作为截断，而应该使用 0.5462817。使用推荐的截断值，让我们转换预测结果并计算模型的预测准确率。\n\n```\n> donors_pred2\
  \ <- ifelse(donors_pred2>= ideal_cutoff, 1, 0)\n> donors_pred2_table <- table(donors_test$respondedMailing)\n\
  > donors_pred2_table <- table(donors_test$respondedMailing, donors_pred2)\n> sum(donors_pred2_table)\n\
  [1] 0.736839\n```\n\n我们模型的预测准确率现在是 73.68%。\n\n### 优点与缺点\n\n逻辑回归是一项广泛使用的技术。在本节中，我们将查看该方法的一些优点和缺点。\n\
  \n这些是一些优点：\n*   与线性回归一样，逻辑回归是高效的。\n*   逻辑回归易于训练。\n*   输入特征不需要缩放。\n*   逻辑回归的输出具有易于理解的概率解释。\n\
  \n这些是一些缺点：\n*   与线性回归类似，多共线性是一个考虑的问题。\n*   逻辑回归模型对异常值敏感。\n*   逻辑回归要求我们在开始之前指定模型。\n\
  *   逻辑回归无法处理缺失数据。\n\n### 案例研究：收入预测\n\n现在你已经熟悉了回归是如何工作的，让我们来看一个案例研究。假设我们受雇于财务规划公司的营销部门，希望识别收入超过\
  \ 50,000 美元的潜在客户。我们通常无法获得新客户的收入信息。\n\n为了解决这个问题，提供了 32,560 个潜在客户的数据。以下是变量：\n\n* \
  \  `age` 是客户的自述年龄。\n*   `workClassification` 是客户工作的雇主类型。包括 `Private`、`Local-gov`、`Federal-gov`\
  \ 等。\n*   `educationLevel` 是潜在客户获得的最高教育程度。值包括 `Bachelors`、`HS-grad`、`Masters` 等。\n\
  *   `educationYears` 是客户的受教育年限。\n*   `maritalStatus` 是客户婚姻状况的标识。示例包括 `Divorced`、`Separated`、`Never-married`\
  \ 等。\n*   `occupation` 是客户从事的工作类型。示例为 `Adm-clerical`、`Sales`、`Tech-support` 等。\n\
  *   `relationship` 是客户与其指定的直系亲属之间的关系。\n*   `race` 是客户的自述种族身份。\n*   `gender` 是客户的自述性别身份——`Male`\
  \ 或 `Female`。\n*   `workHours` 是客户每周典型的工作小时数。\n*   `nativeCountry` 是潜在客户的出生国地。\n\
  *   `income` 是我们试图预测的类别，值为 `<=50K` 和 `>50K`。\n\n### 导入数据\n\n我们需要做的第一件事是使用 `tidyverse`\
  \ 包中的 `read_csv()` 函数导入我们的数据集。\n\n\n\n\n\n```\n> library(tidyverse)\n> income <-\
  \ read_csv(\"income.csv\", col_types = \"nffnfffffnff\")\n> glimpse(income)\n \n\
  Observations: 32,560\nVariables: 12\n$ age                <dbl> 50, 38, 53, 28,\
  \ 37, 49, 52, 31, 42, 37, 30, 23, 32,...\n$ workClassification <fct> Self-emp-not-inc,\
  \ Private, Private, Private, Privat...\n$ educationLevel     <fct> Bachelors, HS-grad,\
  \ 11th, Bachelors, Masters, 9th, ...\n$ educationYears     <dbl> 13, 9, 7, 13, 14,\
  \ 5, 9, 14, 13, 10, 13, 13, 12, 11,...\n$ maritalStatus      <fct> Married-civ-spouse,\
  \ Divorced, Married-civ-spouse, M...\n$ occupation         <fct> Exec-managerial,\
  \ Handlers-cleaners, Handlers-cleane...\n$ relationship       <fct> Husband, Not-in-family,\
  \ Husband, Wife, Wife, Not-in...\n$ race               <fct> White, White, Black,\
  \ Black, White, Black, White, Wh...\n$ gender             <fct> Male, Male, Male,\
  \ Female, Female, Female, Male, Fem...\n$ workHours          <dbl> 13, 40, 40, 40,\
  \ 40, 16, 45, 50, 40, 80, 40, 30, 50,...\n$ nativeCountry      <fct> United-States,\
  \ United-States, United-States, Cuba, ...\n$ income             <fct> <=50K, <=50K,\
  \ <=50K, <=50K, <=50K, <=50K, >50K, >50...\n```\n\n从输出结果可以看出，我们有 12 个特征和 32,560\
  \ 个实例供处理。因变量（或类别）是 `income` 特征。\n\n### 探索与准备数据\n\n数据导入后，让我们在构建模型之前花些时间进行一些数据探索和准备。在本节的剩余部分中，我们将局限于数据集中的分类特征（因子数据类型）。我们所做的的第一件事是获取目标特征的统计摘要。\n\
  \n```\n> income %>%\n keep(is.factor) %>%\n summary()\n \n        workClassification\
  \      educationLevel                maritalStatus\n Private         :22696  HS-grad\
  \     :10501   Married-civ-spouse   :14976\n Self-emp-not-inc: 2541  Some-college:\
