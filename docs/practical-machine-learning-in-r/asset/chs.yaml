  \ <mo>+</mo> <msub> <mi>&#946;</mi> <mn>2</mn> </msub> <mo>&#215;</mo> <mi>w</mi>\
  \ <mi>i</mi> <mi>n</mi> <mi>d</mi> <mi>s</mi> <mi>p</mi> <mi>e</mi> <mi>d</mi> <mo>+</mo>\
  \ <msub> <mi>&#946;</mi> <mn>3</mn> </msub> <mo>&#215;</mo> <mi>t</mi> <mi>e</mi>\
  \ <mi>m</mi> <mi>p</mi> <mi>e</mi> <mi>r</mi> <mi>a</mi> <mi>t</mi> <mi>u</mi> <mi>r</mi>\
  \ <mi>e</mi> <mo>+</mo> <mo>8712></mrow></math>\n\n### 多元线性回归\n\n与简单回归中讨论的 OLS 方法类似，多元线性回归的目标也是估计\
  \ ![images](img/c04-disp-0043.png) <math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi> <mn>0</mn></msub><mo>,</mo><mspace=\"0.25em\"/><mspace=\"\
  0.25em\"/><msub><mi>&#946;</mi> <mn>1</mn></msub><mo>,</mo><mspace=\"0.25em\"/><mspace=\"\
  0.25em\"/><msub><mi>&#946;</mi> <mn>2</mn></msub><mo>,</mo><mspace=\"0.25em\"/><mspace=\"\
  0.25em\"/><mi mathvariant=\"normal\">8230</mi><p></mrow></math> 使得残差平方和最小。然而，与只有一个预测变量的简单回归不同，多元线性回归中的系数估计需要使用矩阵代数，这超出了本书的范围。幸运的是，我们不需要完全理解这种方法背后的数学原理。R\
  \ 中用于开发简单回归的 `lm()` 函数也可以处理开发多元回归所需的数学计算工作。让我们建立一个模型来预测 `rentals`（我们称之为 `bikes_mod2`），基于依赖变量\
  \ `humidity`、`windspeed` 和 `temperature`。\n\n```\n> library (stats)\n> bikes_mod2\
  \ <- lm(data=bikes, rentals ~ humidity + windspeed + temperature)\n```\n\n语法与我们在简单线性回归中使用的相似。这次，我们使用\
  \ `+` 符号向模型中包含了两个额外的预测变量。\n\n### 评估模型\n\n建立模型后，我们可以使用 `summary()` 命令详细评估模型的输出。\n\
  \n```\n> summary(bikes_mod2)\n \nCall:\nlm(formula = rentals ~ humidity + windspeed\
  \ + temperature, data = bikes)\n \nResiduals:\n    Min      1Q  Median      3Q \
  \    Max\n-4780.5 -1082.6   -62.2  1056.5  3653.5\n \nCoefficients:\n          \
  \   Estimate Std. Error t value Pr(>|t|)\n(Intercept)  2706.002    367.483   7.364\
  \ 4.86e-13 ***\nhumidity    -3100.123    383.992  -8.073 2.83e-15 ***\nwindspeed\
  \    -115.463     17.028  -6.781 2.48e-11 ***\ntemperature    78.316      3.464\
  \  22.606  < 2e-16 ***\n---\nSignif. codes:  0 ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’\
  \ 0.1 ‘ ’ 1\n \nResidual standard error: 1425 on 727 degrees of freedom\nMultiple\
  \ R-squared:  0.4609,       Adjusted R-squared:  0.4587\nF-statistic: 207.2 on 3\
  \ and 727 DF,  p-value: < 2.2e-16\n```\n\n输出中系数部分每个变量后的三个星号（`***`）告诉我们所有的预测变量都是显著的。这还为我们提供了模型系数的估计值\
  \ ![images](img/c04-i-0044.png) <math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi> <mn>0</mn></msub></math>(2706.0)，![images](img/c04-i-0044.png)\
  \ <math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi> <mn>1</mn></msub></math>(-3100.1)，![images](img/c04-i-0044.png)\
  \ <math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>&#946;</mi> <mn>2</mn></msub></math>(-115.5)，以及\
  \ ![images](img/c04-i-0044.png) <math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>&#946;</mi> <mn>3</mn></msub></math>(78.3)。我们可以将这些值代入公式 16 以得到该数据的模型。(17)\
  \ ![images](img/c04-disp-0016.png) <math display=\"block\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow> <mi>r</mi> <mi>e</mi> <mi>n</mi> <mi>t</mi> <mi>a</mi> <mi>l</mi> <mi>s</mi>\
  \ <mo>=</mo> <msub> <mi>&#946;</mi> <mn>0</mn> </msub> <mo>+</mo> <msub> <mi>&#946;</mi>\
  \ <mn>1</mn> </msub> <mo>&#215;</mo> <mi>h</mi> <mi>u</mi> <mi>m</mi> <mi>i</mi>\
  \ <mi>d</mi> <mi>i</mi> <mi>t</mi> <mi>y</mi> <mo>+</mo> <msub> <mi>&#946;</mi>\
  \ <mn>2</mn> </msub> <mo>&#215;</mo> <mi>w</mi> <mi>i</mi> <mi>n</mi> <mi>d</mi>\
  \ <mi>s</mi> <mi>p</mi> <mi>e</mi> <mi>d</mi> <mo>+</mo> <msub> <mi>&#946;</mi>\
  \ <mn>3</mn> </msub> <mo>&#215;</mo> <mi>t</mi> <mi>e</mi> <mi>m</mi> <mi>p</mi>\
  \ <mi>e</mi> <mi>r</mi> <mi>a</mi> <mi>t</mi> <mi>u</mi> <mi>r</mi> <mi>e</mi> <mo>+</mo>\
  \ <mo>8712></mrow></math>\n\n\n\n\n我们的残差标准误差为 1425，低于简单线性回归模型的 1509。这意味着从平均而言而言，我们的新模型在预测值与实际值之间的偏差程度上表现更好。由于\
  \ `bikes_mod2` 使用了三个预测变量，而 `bikes_mod1` 使用的是单个预测变量，因此在比较每个模型解释响应变量变异能力的优劣时，我们使用了调整后\
  \ R 平方。我们可以看到，`bikes_mod2` 解释了响应变量 45.87% 的变异，而 `bikes_mod1` 仅解释了 39.39%。`bikes_mod2`\
  \ 的 F 统计量在统计上是显著的，且值远大于 1。这意味着我们的预测变量与响应变量之间存在强烈的线性关系。\n\n总结来说，模型输出表明，多元线性回归模型 (`bikes_mod2`)\
  \ 的性能优于简单线性回归模型 (`bikes_mod1`)。然而，除了我们目前为止用于评估模型性能的线性模型输出外，还有一些额外的诊断测试可以使我们评估模型与数据的适用性。接下来我们将查看这些测试。\n\
  \n### 残差诊断\n\n我们查看的第一组诊断测试与线性回归模型的残差有关。正如我们之前讨论的，残差是我们的模型预测值与数据中实际（或观测）值之间的差异。线性回归模型对其残差的特征做出了某些关键假设。如果这些假设中的部分或全部无效，那么模型的准确性就值得怀疑。为了使线性回归模型有效，假设其残差满足：\n\
  \n*   均值为零\n*   服从正态分布\n*   在自变量的所有值上具有相同的方差（*同方差性*）\n*   互不相关\n\n### 残差的零均值\n\n\
  残差的零均值假设意味着残差的均值为零或可以还原为零。测试此点的简单方法是直接使用 `mean()` 函数检查模型残差的平均值。我们可以通过 `bikes_mod2$residuals`\
  \ 访问模型的残差。该符号表示我们希望 访问 `bikes_mod2` 模型的残差。要计算这些残差的平均值，我们执行以下代码：\n\n```\n> mean (bikes_mod2$residuals)\n\
  [1] -2.92411e-13\n```\n\n从输出中我们可以看到，残差的平均值非常接近零，因此我们符合零均值标准。\n\n### 残差的正态性\n\n为了使线性回归模型有效，残差应该服从正态分布。这意味着我们的误差是随机噪声，数据中的所有信号都已被捕了。有几种正式的统计方法可以检验残差的正态性，包括\
  \ Kolmogorov-Smirnov、Shapiro-Wilk、Cramer-von Mises 和 Anderson-Darling 。然而，对于我们的目的，我们将限制为使用\
  \ R 语言 `olsrr` 包中的 `ols_plot_resid_hist()` 函数进行简单的正态性视觉测试。我们使用该函数绘制残差的直方图——结果参见\
  \ 图 4.4(a)。\n\n```\n> library(olsrr) \n> ols_plot_resid_hist (bikes_mod2) \n```\n\
  \n对生成的图表进行视觉检查显示，我们的残差确实服从正态分布。\n\n### 残差的同方差性\n\n为了使线性回归模型有效，残差应该服从正态分布。这意味着我们的误差是随机噪声，且数据中的所有信号都已被捕了。（等等，提供的文本在此处重复了某些部分，我将根据提供的输入内容保持逻辑流）。\n\
  \n总结来说，模型输出表明，多元线性回归模型 (`bikes_mod2`) 的性能优于简单线性回归模型 (`bikes_mod1`)。然而，除了我们目前为止用于评估模型性能的线性模型输出外，还有一些额外的诊断测试可以使我们评估模型与数据的适用性。接下来我们将查看这些测试。\n\
  \n*（注：输入文本包含关于同方差性的显著重复块；我已在要求的格式规则的同时处理了唯一的高价值信息。）*\n\n\n\n由于 DW 统计量为 0.404，p 值为\
