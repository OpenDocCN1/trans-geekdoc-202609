  ```\n> donors <- donors %>%\n mutate(age = ifelse(is.na(age), mean(age, na.rm =\
  \ TRUE), age))\n> summary(select(donors, age))\n \n age \n Min.   : 1.00 \n 1st\
  \ Qu.:52.00 \n Median :61.61 \n Mean   :61.61 \n 3rd Qu.:71.00 \n Max.   :98.00\n\
  ```\n\n`numberChildren` 特征有 83,026 个缺失值。为了解决这些问题，我们使用了中位数插补。\n\n```\n> donors <-\
  \ donors %>%\n mutate(numberChildren = ifelse(is.na(numberChildren),\nmedian(numberChildren,\
  \ na.rm = TRUE), numberChildren))\n> summary(select(donors, numberChildren))\n \n\
  numberChildren \n Min.   : 1.000 \n 1st Qu.:1.000 \n Median :1.000 \n Mean   :1.069\
