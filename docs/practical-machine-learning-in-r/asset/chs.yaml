  http://www.w3.org/1999/xlink\"><mrow><mo>=</mo><mi>P</mi> <> <mo>(</mo> <mrow> <msub>\
  \ <mi>x</mi> <mn>1</mn> </msub> <mi mathvariant=\"normal\">&#124;</mi> <msub> <mi>x</mi>\
