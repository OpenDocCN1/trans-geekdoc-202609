  \  0.6021,  Adjusted R-squared:  0.5993\nF-statistic: 211.8 on 5 and 700 DF,  p-value:\
  \ < 2.2e-16\n```\n\n我们的结果现在显示，所有的预测变量都是显著的。模型诊断显示它比我们之前的模型（`bikes_mod2`）有所改进。我们的残差标准误从\
  \ 1425 减少到 1213，调整后的 R 方从 0.4587 增加到 0.5993。\n\n#### 考虑分类变量\n\n我们目前为止引入模型的三个预测变量（`humidity`、`windspeed`\
  \ 和 `temperature`）都属于连续变量。然而，我们确实知道 `bikes` 数据集中还有更多潜在的预测变量可以纳入模型中。早些时候我们决定不使用 `date`\
  \ 变量以避免过拟合。我们还决定不使用 `realfeel` 变量，因为它与 `temperature` 高度相关。这留给了我们 `season`、`holiday`、`weekday`\
  \ 和 `weather`。\n\n虽然这四个变量具有数值值，但它们本质上是分类的。让我们使用 `summary()` 函数查看这些变量的值，以及它们每个取值的数值分布。\n\
  \n```\n> summary(bikes2[, c (\"season\", \"holiday\", \"weekday\", \"weather\")])\n\
  \ \nseason  1:177   0:685   6: 96   2:243\n 2:180   1: 21   0:103   1:448\n 3:175\
  \           1:103   3: 15\n 4:174           2:103\n                 3:100\n    \
  \             4:100\n                 5:101\n```\n\n在实践中，将连续变量和分类变量同时纳入模型是常见的做法。在此之前，让我们将分类变量转换为因子（factors）。\n\
  \n```r\nbikes2 <- bikes2 %>%\n  mutate(season = factor),\n         holiday = factor(\n\
  \         weekday = factor(\n         weather = factor())\n```\n\n这段代码只是将 `season`、`holiday`、`weekday`\
  \ 和 `weather` 的水平转换为因子。\n\n### 包含分类变量\n\n通过仅包含一个分类变量 `season`，我们的模型中现在有了三个额外的系数。请注意：\n\
  \n```r\n> bikes_mod4 <-\n   lm(data = bikes2,\n      rentals ~ humidity + windspeed\
  \ + temperature + humidity2 +\n      temperature2 + season) \n\n> summary (bikes_mod4)\n\
  \ \nCall:\nlm(formula = rentals ~ humidity + windspeed + temperature + humidity2\
  \ +\n    temperature2 + season, data = bikes2)\n \nResiduals:\n    Min      1Q \
  \ Median      3Q     Max\n-3623.7  -960.4  -39.9   987.0  3363.4\n \nCoefficients:\n\
  \               Estimate Std. Error t value Pr(>|t|)\n(Intercept)  -6737.0061  1118.5279\
  \  -5.982 4.22e-13 ***\nhumidity      5210.4034  2667.1441   1.954 0.0511 .\nwindspeed\
  \     -103.7059    145.9297  -0.711 0.4779\ntemperature    331.2778    29.0461 \
  \ 11.405  < 2e-16 ***\nhumidity2    -7626.8064  2077.8323  -3.671 0.00026 ***\n\
  temperature2    -2.1790     0.2503  -8.706  < 2e-16 ***\nseason2       489.6013\
  \   168.9875   2.897 0.00382 **\nseason3       581.3724   221.2979   2.627 0.00882\
  \ **\nseason4       994.2943   145.9958   6.810 2.1e-11 ***\n---\nSignif. codes:\
  \  0 ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\n \nResidual standard error: 1175\
  \ on 697 degrees of freedom\nMultiple R-squared:  0.6282,  Adjusted R-squared: \
  \ 0.6240\nF-statistic: 147.2 on 8 and 699 DF,  p-value: < 2.2e-16\n```\n\n请注意，当我们包含一个分类变量时，`lm()`\
  \ 会为该变量除第一个水平以外的每个水平创建一个虚拟变量，第一个水平被用作基准。例如，如果数据集中第 $i$ 个观测值的 `season` 变量值为春（Spring），那么该观测值的预测变量\
  \ `season2` 的值为 1，而预测变量 `season3` 和 `season4` 的值均为 0。\n\n与连续变量不同（在连续变量中，我们将预测变量的系数解释为预测值变化一个单位时响应变量的变化程度，假设其他预测变量保持不变），我们将分类预测变量的系数解释为每个预测值与基准之间响应变化的平均差异。换句话说，在我们的模型中，`season2`\
  \ 的系数是夏季与冬季之间租赁数量的平均差异。同样，`season3` 和 `season4` 的系数分别是夏季与冬季、秋季与冬季之间租赁数量的平均差异。\n\n\
  \n\n\n我们的模型输出告诉我们，`season` 变量的这些预测变量都是显著的，且添加它们提高了我们模型的质量。我们看到，与之前的模型相比，残差标准误差下降了。调整后的\
  \ R 方告诉我们，我们的新模型现在解释了响应变量 62.4%的变异。这与我们之前的模型相比有了改进。\n\n### 考虑变量之间的交互作用\n\n到目前为止，我们的模型都是基于这样一个假设：响应变量与每个预测变量之间的关系独立于其他预测变量的值。在解释之前模型的结果时，我们将模型系数解释为：在假设其他预测变量保持不变的情况下，特定预测变量变化一个单位导致响应变量值的平均变化。然而，这个假设并不总是有效的。在某些情况下，两个变量对响应产生共同影响。在统计学中，这种现象被称为`interaction\
  \ effect`。\n\n在`bikes2` 数据中，我们可以预期 `windspeed` 和 `weather` 预测变量之间，或者 `weather` 和\
  \ `temperature` 预测变量之间存在某种交互作用。可以合理假设，如果整体天气状况恶化且风速增加，它们对自行车租赁数量的影响将比单纯风速增加或单纯天气状况恶化更为显著。R\
  \ 语言通过了一种使用 `*` 运算符在模型中指定这些交互作用的方法。因此，为了指定 `windspeed` 和 `weather` 预测变量之间的交互作用，我们将使用语法\
  \ `windspeed * weather`。让我们考虑到这种交互作用来创建一个新模型。\n\n```\n> bikes_mod5 <-\n   lm(\n\
  \     data = bikes2,\n     rentals ~ humidity + temperature + humidity2 + \n   \
  \  temperature2 + season + windspeed * weather\n   )\n \n> summary(bikes_mod5)\n\
  \ \nCall:\nlm(formula = rentals ~ humidity + temperature + humidity2 + temperature2\
  \ +\n    season + windspeed * weather, data = bikes2)\n \nResiduals:\n    Min  \
  \    1Q  Median      3Q     Max\n-3620.9  -961.8   -56.5   980.1  3224.9\n \nCoefficients:\n\
  \                                     Estimate Std. Error t value Pr(>|t|)\n(Intercept)\
  \                        -6465.8882  1146.0328  -5.642 2.45e-08 ***\nhumidity  \
  \                          5011.7326  2843.8582   1.762  0.07846 .\ntemperature\
  \                          329.9987    28.9740  11.389  < 2e-16 ***\nhumidity2 \
  \                         -7073.1818  2249.3058  -3.145  0.00173 **\ntemperature2\
  \                          -2.1794     0.2494  -8.739  < 2e-16 ***\nseasonSpring\
  \                         519.6417   169.0658   3.074  0.00220 **\nseasonSummer\
  \                         635.4740   221.8383   2.865  0.00430 **\nseasonFall  \
  \                        1045.5251   146.1096   7.156  2.12e-12 ***\nwindspeed \
  \                          -151.2331    24.6076  -6.146  1.34e-09 ***\nweatherClear\
  \                        -566.2684   263.2216  -2.151  0.03180 *\nweatherHeavy precipitation\
  \         -1842.9293   984.0347  -1.873  0.06151 .\nwindspeed:weatherClear     \
  \           83.0116    31.1330   2.666  0.00785 **\nwindspeed:weatherHeavy precipitation\
  \ 129.4237    92.7197   1.396  0.16320\n---\nSignif. codes:  0 ‘***’ 0.001 ‘**’\
  \ 0.01 ‘*’ 0.05 ‘.’ 0.1 ‘ ’ 1\n \nResidual standard error: 1168 on 693 degrees of\
  \ freedom\nMultiple R-squared:  0.6346,  Adjusted R-squared:  0.6283\nF-statistic:\
  \ 100.3 on 12 and 693 DF,  p-value: < 2.2e-16\n```\n\n我们可以从模型输出中看到，与`bikes_mod4`\
  \ 相比，我们在残差标准误差和调整 R 方方面都得到了改进。我们也看到交互项的系数以及新引入的变量 `weather` 的系数都是显著的。有趣的是，由于交互系数是正的，而\
  \ `windspeed` 和 `weather` 的系数是负的，交互作用对这两个预测变量单独对自行车租赁的影响产生了缓冲作用。\n\n让我们以 `windspeed`、`weatherClear`\
  \ 和 `weatherHeavy_Precipitation` 之间的交互作用为例。我们的结果显示，当天气晴朗时，风速每增加 10 mph，自行车租赁量将减少\
  \ 682 辆（`-151.2 + 83.0`）。然而，当天气预报有大雨时，风速每增加 10 mph，自行车租赁量将减少 218 辆。\n\n### 选择重要变量\n\
  \n在改进模型的努力过程中，我们选择了某些预测变量来说明我们想要表达的观点。此时，我们并不知道哪些预测变量子集将提供最好的结果。识别预测变量子集的过程被称为变量选择。\n\
  \n理想情况下，我们的变量选择过程将通过评估所有预测变量组合的模型来选择最佳模型。然而，由于巨大的计算复杂度，这种方法是不可行的。相反，我们需要一种系统的方法来选择变量。到目前，我们决定使用调整\
  \ R 方作为我们的标准。但重要的是，我们还可以使用其他标准。我们将在下一章讨论其中一些，并在第九章中进行详细介绍。\n\n在实践中，变量选择有三种常用方法。第一种被称为前向选择。在前向选择中，我们从截距开始，然后根据截距和每个预测变量创建多个简单线性回归模型。然后我们根据特定的性能指标选择模型最好的预测变量。残差和是该方法的一种常用指标。下一步是根据第一步选择的预测变量以及剩余的每个预测变量创建多个双预测变量模型。像之前一样，我们再次选择模型最好的新预测变量。这一过程持续到创建三预测变量模型、四预测变量模型，依此类推，直到耗尽所有预测变量或满足某些预定义的停止条件。需要注意的是，如果数据中的观测值少于预测变量，则后向选择是不可能的。\n\
  \n第二种变量选择方法被称为后向选择。这种方法涉及创建一个包含所有预测变量的模型，然后根据 p 值移除显著性最低的预测变量。随后我们在不包含该被移除预测变量的情况下拟合一个新模型。就像第一次一样，我们继续移除显著性最低的预测变量。我们递归地这样做，直到满足某些预定义的停止条件。\n\
  \n\n\n第三种方法是正向选择和反向选择的结合，试图克服前两种方法的局限性。它被称为`混合选择`（mixed selection）。在这种方法中，我们从正向选择开始，每次添加一个预测变量。然而，与反向选择一样，在过程的每个阶段，我们都会评估每个变量的统计显著性，并移除不符合预定义显著性阈值的变量。我们继续这种正向和反向选择过程，直到耗尽数据中的所有变量，并获得一个仅包含符合显著性阈值的预测变量的模型。\n\
  \nR 语言中的 `olsrr` 包为我们提供了一系列执行正向、反向和混合选择的函数。为了说明混合变量选择过程，我们使用 `ols_step_both_p()`\
  \ 函数。在演示变量选择之前，让我们为我们的自行车数据创建一些额外的候选预测变量。这些变量派生自 `date` 变量。为了帮助我们，我们引入了 `lubridate`\
  \ 包，它包含了几个处理日期的函数。我们创建的第一个变量是 `day` 变量，描述自程序开始以来的天数。该变量通过 `date` 变量与 `date` 变量最小值之间的差值计算得出。接下来两个是\
  \ `month` 和 `year` 变量。现在我们有了这三个新的派生变量，就不需要 `date` 变量了，因此我们从数据中将其移除。\n\n```\n> library(lubridate)\n\
  \ \n> bikes2 <- bikes2 %>%\n   mutate(day=as.numeric(date-min(date))) %>%\n   mutate(month=as.factor(month(date)))\
  \ %>%\n   mutate(year=as.factor(year(date))) %>%\n   select (-date)\n```\n\n现在我们有了新的候选预测变量，继续使用\
  \ `ols_step_both_p()` 函数。该函数接受四个参数，第一个是包含所有候选预测变量的线性模型（`model`）。我们的候选预测变量包括 `bikes2`\
  \ 数据中所有的独立变量以及 `windspeed` 和 `weather` 的交互项。函数的第二个参数是进入过程的 p 值阈值（`pent`），第三个是移除的\
  \ p 值阈值（`prem`），最后一个是指示打印详细程度的标志（`details`）。对于我们的示例，我们将 `pent`、`prem` 和 `details`\
  \ 的值分别设置为 `0.2`、`0.01` 和 `FALSE`。\n\n```\n> ols_step_both_p(\n   model = lm(\n \
  \   data = bikes2,\n    rentals ~ humidity + weekday + holiday +\n      temperature\
  \ + humidity2 + temperature2 + season +\n      windspeed * weather + realfeel +\
  \ day + month + year\n   ),\n   pent = 0.2,\n   prem = 0.01,\n   details = FALSE\n\
  \ )\n```\n\n即使 `details` 参数设置为 `FALSE`，我们的输出仍然相当冗长。因此，我们将注意力集中在输出的几个部分上。我们首先想看的是最终的模型输出。它为我们提供了基于通过混合变量选择过程选出的预测变量创建的线性回归模型的诊断摘要。\n\
  \n```\nFinal Model Output\n------------------\n \n                          Model\
  \ Summary\n------------------------------------------------------------------\n\
  R                       0.939       RMSE                  671.919\nR-Squared   \
  \            0.882       Coef. Var              14.814\nAdj. R-Squared         \
  \ 0.877       MSE                451475.658\nPred R-Squared          0.870     \
  \  MAE                   491.914\n------------------------------------------------------------------\n\
  \ RMSE: Root Mean Square Error\n MSE: Mean Square Error\n MAE: Mean Absolute Error\n\
  ```\n\n从结果中我们可以，我们将残差误差降低到了 671.92，并将调整后的 R 平方增加到了 0.877。这意味着我们的模型现在可以解释响应变量 87.7%\
  \ 的变异性。这与我们之前的模型相比是一个显著的改进。\n\n我们接下来想要看的是“参数估计”（Parameter Estimates）部分，如下所示：\n\n\
  ```\n                            Parameter Estimates\n-------------------------------------------------------------------------------------\n\
  \           model       Beta  Std.Error Std.Beta   t       Sig        lower    \
  \  upper\n-------------------------------------------------------------------------------------\n\
