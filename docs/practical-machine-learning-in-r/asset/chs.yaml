  \n图 2.13 显示之前执行命令的 RStudio 历史面板\n\n### 绘图面板 (Plots Pane)\n\nRStudio 窗口的最后一个面板位于图\
  \ 2.9 的右下角。该面板默认显示绘图视图，并将包含你在 R 代码中生成的任何图形。在图 2.9 中，该面板包含了在我们示例 R 脚本中创建的、按饮食类型分类的小鸡重量图表。正如你在图\
