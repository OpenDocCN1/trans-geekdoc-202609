  \n\n\n\n\n```\n> vif(donors_mod2)\n \n                             GVIF Df GVIF^(1/(2*Df))\n\
  incomeRating             2.721121  4        1.074122\nwealthRating             2.924728\
  \ 10        1.055126\nmailOrderPurchases       1.513325  1        1.230173\nnumberGifts\
  \              2.722302  1        1.649940\nyearsSinceFirstDonation  2.612104  1\
