  \ <mn>0.0005</mn> </mrow> <mo)</mo> <mo>=</mo> <mn>0.957</mn> </math>\n\n### 朴素贝斯\
  \ (Naive Bayes)\n\n朴素贝斯分类是一种基于贝叶斯定理的分类算法。之所以被称为“朴素”，是因为它假设特征之间是相互独立的，虽然在现实世界中这个假设通常是不成立的，但它能极大地简化计算过程。\n\
  \n朴素贝斯分类的核心公式是：\n\n$$P(C|X) = \\frac{P(X|C)P(C)}{P(X)}$$\n\n其中：\n- $P(C|X)$ 是在观测特征\
  \ $X$ 下属于类别 $C$ 的概率（后验概率）。\n- $P(X|C)$ 是在类别 $C$ 下出现特征 $X$ 的概率（似然概率）。\n- $P(C)$ 是类别\
  \ $C$ 的原有概率（先验概率）。\n- $P(X)$ 是特征 $X$ 出现的概率（演化概率）。\n\n在实际应用中，我们通常关注的是哪个类别的 $P(C|X)$\
  \ 最大，因此 $P(X)$ 可以忽略，公式简化为：\n\n$$P(C|X) \\propto P(X|C)P(C)$$\n\n对于文本分类，特征 $X$ 通常由一系列单词组成。假设特征\
  \ $X = (w_1, w_2, ..., w_n)$，根据独立性假设，公式可以变为：\n\n$$P(C|X) \\propto P(C) \\prod_{i=1}^{n}\
  \ P(w_i|C)$$\n\n为了防止多个概率值相乘导致数值下溢，我们通常会对公式两边取对数：\n\n$$\\log P(C|X) \\propto \\log\
  \ P(C) + \\sum_{i=1}^{n} \\log P(w_i|C)$$\n\n下面，我们将使用 R 来来实现朴素贝斯模型对邮件进行垃圾邮件分类。\n\
  \n\n\n\n```\n> email %>%\n filter(message_label=='ham') %>%\n gather(word, count,\
  \ -message_index, -message_label) %>%\n group_by(word) %>%\n summarize(occurrence\
  \ = sum(count)) %>%\n arrange(desc(occurrence)) %>%\n slice(10)\n \n# tibble: 10\
  \ x 2\n   word      occurrence\n   <chr>          dbl>\n 1 enron            382\n\
  \ 2 pmto             191\n 3 time             185\n 4 message          169\n 5 ect\
  \              165\n 6 forwarded        162\n 7 questions        160\n 8 hou   \
  \           153\n 9 amto             147\n10 call             145\n```\n\n垃圾邮件中的前\
  \ 10 个出现词如下：\n\n```\n> email %>%\n filter(message_label=='spam') %>%\n gather(word,\
  \ count, -message_index, -message_label) %>%\n group_by(word) %>%\n summarize(occurrence\
  \ = sum(count)) %>%\n arrange(desc(occurrence)) %>%\n slice(10)\n \n# tibble: 10\
  \ x 2\n   word        occurrence\n   <chr>            dbl>\n 1 http            \
  \   233\n 2 time               181\n 3 email              171\n 4 information  \
  \      148\n 5 money              147\n 6 company            141\n 7 mail      \
  \         137\n 8 www                123\n 9 free               121\n10 business\
  \           120\n```\n\n结果显示，两个集合中的高频词非常不同，除了两个列表中都有 `time` 词外。在普通邮件中，`enron` 是频率最高的；而在垃圾邮件中，`http`\
  \ 是频率最高的。\n\n### 分割数据\n\n我们下一步步骤是将数据分为训练集和测试集。我们使用 75:25 的训练与测试比例。然后显示每个数据集的类别分布。\n\
  \n```\n> set.seed(1234)\n> sample_set <- sample(nrow(email), round(nrow(email)*.75),\
  \ replace = FALSE)\n> email_train <- email[sample_set, ]\n> email_test <- email[-sample_set,\
  \ ]\n \n> round(prop.table(table(select(email, message_label))),2)\n \n ham spam\n\
  0.49 0.51\n \n> round(prop.table(table(select(email_train, message_label))),2)\n\
  \ \n ham spam\n0.49 0.51\n \n> round(prop.table(table(select(email_test, message_label))),2)\n\
  \ \n ham spam\n0.49 0.51\n```\n\n类别分布显示我们的数据集相当平衡：在整个数据集以及训练集和测试集中，49% 是普通邮件，51%\
  \ 是垃圾邮件。\n\n### 训练模型\n\n我们现在准备好构建朴素贝斯模型了。为了这一点，我们使用 `e1071` 包中的 `naiveBayes()` 函数。该函数接受三个参数。第一个是学习公式，我们指定为：\n\
  \n```\nmessage_label ~ .-message_index\n```\n\n这意味着分类器将使用数据集中 `message_index` 之外的所有变量来预测\
  \ `message_label`。第二个参数是用于训练模型的数据集，即 `email_train`。最后一个参数是用于平滑的 `laplace` 值。我们将此值设置为\
  \ 1。\n\n```\n> library(e1071)\n> email_mod <- naiveBayes(message_label ~ .-message_index,\
  \ data = email_train, laplace = 1)\n```\n\n### 评估模型\n\n现在已经训练了模型，让我们评估它在预测邮件是垃圾邮件还是普通邮件方面的表现如何。为了这一点，我们使用\
  \ `stats` 包中的 `predict()` 函数。我们向 `predict()` 函数传递三个参数。第一个参数是我们刚刚训练的模型：`email_mod`。第二个参数是测试数据\
  \ `email_test`。最后一个参数是预测类型。我们可以获取预测概率，也可以获取预测标签。为了获取预测概率，我们设置 `type=\"raw\"`。\n\n\
  ```\n> email_pred <- predict(email_mod, email_test, type = \"raw\")\n> head(email_pred)\n\
  \ \n ham spam\n[1,] 1.000000e+00 0.000000e+00\n[2,] 1.000000e+00 4.26186e-55\n[3,]\
  \ 1.000000e+00 0.000000e+00\n[4,] 1.000000e+00 0.000000e+00\n[5,] 3.050914e-202\
  \ 1.000000e+00\n[6,] 1.000000e+00 0.000000e+00\n```\n\n结果显示，对于前两条邮件，由于 `time` 词出现在两个列表中，两个集合的高频词大不相同。在普通邮件中，`enron`\
  \ 是高频词，而在垃圾邮件中，`http` 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron` 是高频词，而在垃圾邮件中，`http`\
  \ 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron` 是高频词，而在垃圾邮件中，`http` 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron`\
  \ 是高频词，而在垃圾邮件中，`http` 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron` 是高频词，而在垃圾邮件中，`http`\
  \ 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron` 是高频词，而在垃圾邮件中，`http` 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron`\
  \ 是高频词，而在垃圾邮件中，`http` 是高频词。由于 `time` 词出现在两个列表中，在普通邮件中，`enron` 是高频词，而在垃圾邮件中，`http`\
