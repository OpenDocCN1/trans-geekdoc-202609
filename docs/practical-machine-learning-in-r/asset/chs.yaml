  \          month2     -148.493  129.378   -0.021  -1.148   0.251   -402.525    105.538\n\
  \          month3       97.746  152.663    0.014   0.640   0.522   -202.005    397.497\n\
  \          month4     -104.921  224.607   -0.015  -0.467   0.641   -545.933    336.090\n\
  \          month5      343.918  238.563    0.051   1.442   0.150   -124.495    812.331\n\
