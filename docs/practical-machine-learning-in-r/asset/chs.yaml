  \ Pane)\n\n环境面板允许你查看 R 的当前运行环境。你可以看到当前存储在内存中的变量、数据集和其他对象的值。对 R 运行环境的这种视觉洞察是使用 RStudio\
  \ IDE 而非标准编辑器创建 R 脚本的最有力理由之一。在开发和排查代码时，轻松查看内存内容是一个非常有用的工具。\n\n图 2.9 中的环境面板是空的，因为在该情况下使用的\
  \ R 脚本没有在内存中存储任何数据。相反，它使用了 R 内置的 `ChickWeight` 数据集。\n\n图 2.12 显示了填充了多个变量、向量和一个存储在名为\
  \ `tibble` 对象中的完整数据集的 RStudio 环境面板。我们将在第 3 章](#c03.xhtml)中更多讨论 tibble。\n\n你还可以使用同一面板中的标签访问另外两个\
  \ RStudio 功能。`History` 标签显示当前会话期间执行的 R 命令，如图 2.13](#c02.xhtml#c02-fig-0013)所示。`Connections`\
  \ 标签用于创建和管理与外部数据源的连接，这种技术超出了本书的范围。\n\n![图 2.12 填充了数据的 RStudio 环境面板](img/c02f012.png)\n\
