  \n### 聚类光滑（Smoothing by Clustering）\n\n另一种光滑方法是使用一种被称为聚类（clustering）的无监督机器学习方法。我们将在第\
  \ 12 章中更详细地讨论聚类。在`通过聚类光滑`方法中，数据集中的每个实例都被分配到用户定义的任意数量簇之一。然后计算每个簇的平均值，并作为分配到该簇的每个实例的替换值。例如，在图\
  \ 3.10](#c03.xhtml#c03-fig-0010)中，我们有 14 个实例（彩色圆圈），具有两个特征（特征 A 和特征 B），被分为三个独立的簇（红色、蓝色和黄色虚线）。每个簇的平均值（或中心）由黑色菱形（`C1`、`C2`\
  \ 和 `C3`）表示。为了通过聚类对该数据集进行光滑，我们将原始实例的值替换为簇中心的值。\n\n### 回归光滑（Smoothing by Regression）\n\
  \n\n\n\n\n`回归平滑` 涉及使用一种监督学习方法——`线性回归`对特征值进行平滑。线性回归将在第 4 章中进行详细详细讨论。回归平滑的核心思想是使用拟合回归线来代替原始数据。为了说明其工作原理，让我们考虑一个包含\
  \ 14 个实例的数据集，它由一个自变量 ![images](img/c03-i0038.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>x</mi><mi>i</mi></msub></mrow></math> 和一个因变量 ![images](img/c03-i0039.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></math>组成。每个实例都由坐标\
  \ ![images](img/c03-i0040.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>,</mo><msub><mi>y</mi><mi>i</mi></msub></mrow></math>\
  \ 表示（参见图 3.11 中的黄色圈）。为了通过回归平滑数据，我们使用拟合线性回归线（蓝线）上的点来代替原始数据。例如，实例 ![images](img/c03-i0041.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></math>的值在平滑后变为![images](img/c03-i0042.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mi>y</mi><msub><mo>&#8242;</mo><mn>1</mn></msub></mrow></math>。\n\
  \n### 离群值\n\n离群值是数据集中与其他观测值显著不同的数据点。离群值表现为与大多数其他实例特征不同的实例，或者表现为相对于该特征典型值而言不常的特征值。与噪声不同，离群值有时可能是合法的数据。因此，一旦识别出它们，我们应该花一些时间理解它们为什么存在于我们的数据中，以及它们是否有用。通常，判断一个离群值是否有用取决于学习目标。\n\
  \n![图 3.11 用图像表示 14 个实例的回归平滑方法的插图](img/c03f011.png)\n\n**图 3.11**](#c03.xhtml#R_c03-fig-0011)\
  \ 在 14 个实例上展示回归平滑方法，由![images](img/c03-i0001.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>,</mo><msub><mi>y</mi><mi>i</mi></msub></mrow></math>\n\
  \n在某些情况下，离群值仅仅是坏数据。如果是如此，则应该删除或使用我们之前讨论过的处理缺失数据的插值方法之一来替换离群值。离群值也可能是合法的数据，它们对机器学习过程可能有趣且有用。如果是这样，则应该保留离群值数据。然而，某些机器学习方法（如线性回归，参见第\
  \ 4 章））对离群值特别敏感。因此，如果我们必须保留离群值数据，那么像决策树（参见第 8 章）这样能够稳健处理离群值的方法可能更合适。在第 4 章和第 5 章中，我们介绍了几种识别和处理离群值的方法。\n\
  \n### 类不平衡\n\n机器学习算法从示例学习。正如我们在第 1 章中所讨论过的，这些示例被称为`训练数据`。对于分类问题，机器学习算法的目标是识别标记训练数据中的模式，帮助它为新的未标记数据正确分配标签（或类别）。算法获得的训练示例越多，它就越有信心。\n\
  \n算法获得的训练示例越多，它就越有信心。\n\n让我们考虑一个热门问题：欺诈检测。这种类型的问题被称为二分类问题，因为只有两个标签（欺诈或非欺诈）。为了训练模型，我们需要提供之前的交易示例。每个示例都包含描述交易的几个特征，以及它是否欺诈的标签。\n\
  \n对于分类问题，属于每个类别的比例被称为`类别分布`。理想情况下，我们希望训练数据的类别分布是均匀或平衡的，以便算法有机会学习对应每个类的模式。然而，对于某些问题（例如我们的欺诈示例），情况并非如此。大多数交易都不是欺诈的。因此，分布不会平衡。它会偏向非欺诈示例。这被称为`类不平衡`。\n\
  \n许多二分类问题类不平衡不仅常见，而且是预期。这些问题包括垃圾邮件检测、入侵检测、流失预测、贷款违约预测等。对于这些问题，很大一部分观测值属于某一类。示例较多的类被称为`多数类`，而示例较少的类被称为`少数类`。\n\
  \n机器学习中的类不平衡涉及几个问题。其中一个与学习过程的有效性有关。由于类不平衡问题的性质，少数类通常是有感兴趣的类。这是因为少数类通常代表稀有但需要识别的重要事件。然而，由于少数类的示例较少，模型要有效学习与少数类对应的模式并将其与多数类的模式区分开来就更具挑战性。\n\
  \n针对不平衡数据进行学习的第二个问题是，它可能会导致欺骗性的乐观预测准确率。让我们考虑一个问题，99.9%的观测和未来示例都属于多数类。不需要任何机器学习，只需简单地预测所有未来示例都属于多数类，就能获得\
  \ 99.9%的预测准确率。这被称为`准确率悖论`。在这里，预测准确率仅仅反映了数据集的底层类别分布。\n\n处理机器学习中类不平衡的方法有：\n\n- **收集更多数据：**\
  \ 为了减少多数类和少数类之间分布的不平衡，我们可以尝试收集更多少数类的示例。\n\n\n\n\n\n*   **更改性能指标：** 由于我们知道在不平衡数据上预测准确率可能会具有误导性，因此在评估针对不平衡数据训练的模型时，我们应该使用其他的性能衡量。通常使用精确率（precision）、召回率（recall）、kappa\
  \ 和 ROC 曲线等指标。我们在第 9 章中详细讨论了这些指标。\n\n*   **尝试不同的算法：**某些机器学习算法对类别不平衡特别敏感，而另一些则不然。在训练模型解决类别不平衡问题时，我们应该考虑决策树和随机森林等模型，这些模型可以很好地处理类别分布不均。\n\
  \n*   **重采样数据：** 处理类别不平衡的常用方法是通过采样改变训练数据的类别分布。这有两种常用方法：第一是从多数类中选择较少的示例作为训练数据，这被称为`欠采样`（under-sampling）。第二种方法是为训练数据创建更多少数类的副本，这被称为`过采样`（over-sampling）。创建的副本可以是现有数据的重复，也可以是基于现有少数类示例生成的合成示例。用于生成合成示例的最流行的算法之一被称为合成少数类过采样技术（`SMOTE`）。我们在第\
  \ 5 章中演示了如何使用`SMOTE`处理类别不平衡。\n\n## 数据转换\n\n作为数据准备过程的一部分，通常需要修改或转换数据的结构或特征，以满足特定机器学习方法，增强我们理解数据的能力，或提高机器学习过程的效率。在本节中，我们将讨论几种帮助我们实现这些目标的方法。\n\
  \n#### 归一化\n\n标准化或归一化（standardization or normalization）的目标是确保整组数值具有特定的属性。这通常涉及将数据缩放到较小或指定的范围内。归一化的常用方法包括小数缩放、z-score\
  \ 归一化、最小最大归一化（min-max normalization）和对数变换。\n\n#### 小数缩放\n\n小数缩放（decimal scaling）作为一种归一化方法，涉及移动一组数值的位置，使得最大绝对值小于或等于\
  \ 1。让我们考虑一个包含五个数值的数据集：![images](img/c03-i0083.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mrow><mo>{</mo><mrow><mn>12000</mn><mo>,</mo><mn>24000</mn><mo>,</mo><mn>30000</mn><mo>,</mo><mn>40000</mn><mo>,</mo><mn>98000</mn></mrow><mo>}</mo></mrow></mrow></math>。使用小数缩放对此数据集进行归一化，我们需要将每个原始值\
  \ ![images](img/c03-i0092.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>v</mi></math>除以 10 的倍数，使得数据集的最大绝对值小于或等于 1。数学上的表示如下：\n\n3.1![images](img/c03-disp-0001.png)<math\
  \ display=\"block\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow> <msup> <mi>v</mi> <mo>&#8242;</mo>\
  \ </msup> <mo>=</mo> <mfrac> <mi>v</mi> <mrow> <msup> <mn>10</mn> <mi>j</mi> </msup>\
  \ </mrow> </mfrac> </mrow> </math> \n\n其中 ![images](img/c03-i0045.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mi>j</mi></math> 是满足条件的 ![images](img/c03-i0046.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mi>max</mi><mrow><mo>(</mo><mrow><mrow><mo>|</mo><msup><mi>v</mi><mo>&#8242;</mo></msup><mo>|</mo></varepsilon></mrow><mo>)</mo></mrow><mo>&#8804;</mo><mn>1</mn></math>\
  \ 的最小整数。对于我们的示例数据集，由于最大值是 ![images](img/c03-i0047.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mn>98000</mn></math>，我们设置\
  \ ![images](img/c03-i0048.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mi>j</math>=5。因此，为了归一化第一个值，我们计算\
  \ ![images](img/c03-i0049.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mfrac><mn>12000</mn><mn>10⁵</mfrac></math>。对于剩余的值使用这种方法，我们的数据集将变为\
  \ ![images](img/c03-i0050.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mo>{</mo><mrow><mn>.12</mn><mo>,</mo><mn>.24</mn><mo>,</mo><mn>.3</mn><mo>,</mo><mn>.4</mn><mo>,</mo><mn>.98</mn></mrow><mo>}</mo></math>。为了在\
  \ R 中如何进行小数缩放，我们再次查看该特征的描述性统计：\n\n```\n> vehicles %>% select(co2emissions) %>% summary()\n\
  \ co2emissions\n Min.   29.0\n 1st Qu.:400.0\n Median :467.7\n 3rd Qu.:555.4\n Max.\
  \   1269.6\n``` 显示最小值为 ![images](img/c03-i051.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mn>29</math>，而最大值为\
  \ ![images](img/c03-i052.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mn>1269.6</math>。考虑公式\
  \ 3.1，对于 ![images](img/c03-i053.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mi>j</math>\
  \ 是使得 ![images](img/c03-i054.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>max</mi><mrow><mo>(</mo><mrow><mrow><mo>|</mo><msup><v</mi><mo>&#8242;</mo></msup><mo>|</mo></varepsilon></varepsilon><mo)</mo></varepsilon><mo>&#8804;</mo><mn>1</mn></mrow></math>\
  \ 的最小整数。也就是说，`4` 是数字 ![images](img/c03-i057.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink><mn>1269.6</math>\
  \ 小数点前的位数。使用 `mutate` 动词，我们根据公式 3.1 为 `co2emissions` 特征创建一个新的归一化版本，名为 `co2emissions_d`。\n\
  \n\n\n\n\n```\n> vehicles %>%\n select(co2emissions) %>%\n mutate(co2emissions_d\
  \ = co2emissions / (10⁴)) %>%\n summary()\n \n co2emissions     co2emissions_d \n\
  \ Min.   : 29.0    Min.   :0.00290 \n 1st Qu.: 400.0   1st Qu.:0.04000 \n Median\
  \ : 467.7   Median :0.04677 \n Mean   : 476.6   Mean   :0.04766 \n 3rd Qu.: 555.4\
  \   3rd Qu.:0.05554 \n Max.   :1269.6   Max.   :0.12696\n```\n\n描述性统计提供了 `co2emissions`\
  \ 特征在通过十位缩放归一化为 `co2emissions_d` 前后的数值统计摘要。\n\n## Z-Score 归一化\n\n我们查看的第二种归一化方法被称为\
  \ `z-score` 或 `零均值归一化`。其名称来源于该方法产生的归一化值均值为 0，标准差为 1。给定特征 `F` 的值 `v`，归一化后的特征值 `v'`\
  \ 计算公式如下：\n\n```\nv' = (v - F) / Fs\n```\n\n其中 `F` 和 `Fs` 分别是特征 `F` 的均值和标准差。使用十位缩放讨论中的相同示例，我们可以使用\
  \ z-score 归一化来转换五值数据集的数值。首先，需要计算这些值的均值和标准差。通过计算器，我们发现这些值分别为 40800 和 33544。然后，我们可以使用公式\
  \ 3.2 中的公式来计算归一化值。基于此，为了归一化数据集中的第一个值，我们计算 `(12000 - 40800) / 33544 = 0.859`。对剩余四个值使用相同的方法，我们的归一化数据集现在将变为\
  \ `{0.859, 0.500, 0.322, 0.0241, 1.705}`。\n\n为了说明如何在 R 中实现 z-score 归一化，让我们再次使用 `vehicles`\
  \ 数据集中的 `co2emissions` 特征。这次我们使用了之前介绍的 `mean()` 函数，以及 `sd()` 函数，后者帮助我们计算特征值的标准差。\n\
  \n```\n> vehicles %>%\n select(co2emissions) %>%\n mutate(co2emissions_z = (co2emissions\
  \ - mean(co2emissions)) / sd(co2emissions)) %>%\n summary()\n \n co2emissions  \
  \   co2emissions_z \n Min.   : 29.0    Min.   :-3.79952 \n 1st Qu.: 400.0   1st\
  \ Qu.:-0.6498 \n Median : 467.7   Median :-0.0748 \n Mean   : 476.6   Mean   :0.0000\
  \ \n 3rd Qu.: 555.4   3rd Qu.:0.6697 \n Max.   :1269.6   Max.   :6.724\n```\n\n\
  从描述性统计可以看出，`co2emissions` 特征 `co2emissions_z` 的归一化值范围从 -3.79952 到 6.724。注意这些值的均值为\
  \ 0。\n\n## Min-Max 归一化\n\n通过 `min-max 归一化`，我们将原始数据从测量单位转换为由用户指定边界定义的新区间。通常情况下，新值为\
  \ 0 和 1。在数学上，这种变换表示为：\n\n```\nv' = (v - lower) / (upper - lower) + lower\n```\n\n\
  \n\n\n其中 ![images](img/c03-i0044.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>v</mi></math> 是特征 ![images](img/c03-i0065.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>F</mi></math> 的原始值，![images](img/c03-i0077.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msub><mrow><mi>min</mi></mrow><mi>F</mi></msub></mrow></math> 是特征 ![images](img/c03-i0078.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>F</mi></math> 的极值，![images](img/c03-i0079.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msub><mrow><mi>max</mi></mrow><mi>F</mi></msub></mrow></math>\
  \ 是特征 ![images](img/c03-i0076.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>F</mi></math> 的最大值，![images](img/c03-i0081.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>l</mi><mi>o</mi><mi>w</mi><mi>e</mi><mi>r</mi></mrow></math> 是归一化值用户定义的下界，而\
  \ ![images](img/c03-i0082.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mi>u</mi><mi>p</mi><mi>p</mi><mi>e</mi><mi>r</mi></mrow></math> 是用户定义的上界。应用于我们包含五个值的数据集\
  \ ![images](img/c03-i0043.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mrow><mo>{</mo><mrow><mn>12000</mn><mo>,</mo><mn>24000</mn><mo>,</mo><mn>30000</mn><mo>,</mo><mn>40000</mn><mo>,</mo><mn>98000</mn></mrow><mo>}</mo></mrow></mrow></math>假设我们决定使用\
  \ ![images](img/c03-i0098.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>0</mn></math> 和 ![images](img/c03-i0099.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>1</mn></math> 作为转换后值的下界和上界，第一个值将变为 ![images](img/c03-i0086.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mfrac><mrow><mn>12000</mn></mrow><mn><98000</0</mn>100000></></></></2mo><mrow><mn>1</mn></mrow><mo>+</mn>0</mrow></math>。对于剩余的四个值应用相同的方法，我们的归一化数据集现在将变为：![images](img/c03-i0087.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mo>{</mo><mrow><mn>0.000</mn><mo>,</mo><mn>0.140</mn><mo>,</mo><mn>0.209</mn><mo>,</mo><mn>0.326</mn><mo>,</mo><mn>1.000</mn></mrow><mo>}</mo></mrow></math>\n\
  \n为了演示如何在 R 中进行极值归一化，让我们再次使用 `vehicles` 数据集的 `co2emissions` 特征。我们使用 ![images](img/c03-i0073.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mi>0</mi></math> 和 ![images](img/c03-i0091.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>1</mn></math> 作为下界和上界。\n\n```\n\
  > vehicles %>%\nselect(co2emissions) %>%\nmutate(co2emissions_n = (co2emissions\
  \ - min(co2emissions)) / (max(co2emissions) - min(co2emissions))) %>% summary()\n\
  ```\n\n描述性统计显示极值归一化的 `co2emissions_n` 值落在 0 到 1 之间。\n\n#### 对数变换\n目前的方法在数据是对称的情况下通常有效。对于偏态分布和跨越多个级的数据，对数变换通常更合适。在对数变换中，我们将原始数据替换为对数：\n\
  \n`v_log = log(v)`\n\n注意对数变换仅适用于正值。使用的对数可以是自然对数、以 10 为底或以 2 为底。对我们包含五个值的数据集进行对数变换，![images](img/c03-i0094.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\">{12000, 24000, 30000, 40000, 98000}</math>我们得到：![images](img/c03-i0095.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\">{4.079, 3.380, 4.477, 4.602, 4.991}</math>。\n\
  \n#### 离散化\n\n\n\n\n\n`Discretization`（离散化）涉及将连续特征视为分类特征。这通常是在使用数据集训练模型之前的预处理步骤。这是因为某些算法要求自变量数据是二元的或具有有限数量的离值。离散化过程可以使用我们之前讨论的分箱方法来实现：使用箱均值平滑和箱边界平滑。例如，我们可以根据这两种方法中任一种选择的分箱数量，有效地减少连续特征的离值数量。除了分箱，我们还可以通过根据其与参考阈值的比较进行编码，将连续特征离散化为二值。这被称为\
  \ `dichotomization`（二分法）。例如，给定值 ![images](img/c03-i0018.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mrow><mo>{</mo><mrow><mn>4</mn><mo>,</mo><mn>8</mn><mo>,</mo><mn>9</mn><mo>,</mo><mn>15</mn><mo>,</mo><mn>21</mn><mo>,</mo><mn>21</mn><mo>,</mo><mn>24</mn><mo>,</mo><mn>25</mn><mo>,</mo><mn>26</mn><mo>,</mo><mn>28</mn><mo>,</mo><mn>29</mn><mo>,</mo><mn>34</mn></mrow><mo>}</mo></mrow></mrow></math>,我们可以将所有\
  \ ![images](img/c03-i0127.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>20</mn></math> 以下的值编码为 ![images](img/c03-i0072.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mn>0</mn></math>，并将所有 ![images](img/c03-i0059.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>1</mn></math> 以上的值编码为 ![images](img/c03-i0100.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mrow><mo>{</mo><mrow><mn>0</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>1</mn></mrow><mo>}</mo></mrow></mrow></math>。\n\
  \n### Dummy Coding（虚拟编码）\n\n`Dummy coding`（虚拟编码）涉及使用二分（二进制）数值来表示分类特征。虚拟编码通常用于要求独立特征为数值型的算法（例如回归和\
  \ ![images](img/c03-i0101.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>k</mi></math>\\-最近邻），并作为表示缺失数据的方法。为了解释虚拟编码的工作原理，请考虑 `vehicles` 数据集中的 `drive`\
  \ 特征。假设该特征只有三个值，编码如下：\n\n| Drive | Code |\n| --- | --- |\n| Front-Wheel Drive |\
  \ 1 |\n| Rear-Wheel Drive | 2 |\n| All-Wheel Drive | 3 |\n\n使用编码为 ![images](img/c03-i0084.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>0</mn></math> 或 ![images](img/c03-i0124.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>1</mn></math> 的二分值，我们可以如下表示这些特征值：\n\
  \n| Drive | Front-Wheel Drive | Rear-Wheel Drive | All-Wheel Drive |\n| --- | ---\
  \ | --- | --- |\n| Front-Wheel Drive | 1 | 0 | 0 |\n| Rear-Wheel Drive | 0 | 1 |\
  \ 0 |\n| All-Wheel Drive | 0 | 0 | 1 |\n\n这种表示数据的方法被称为 `full coding`（全编码），这也是 `one-hot\
  \ encoding`（独热编码）。注意，对于原始变量 ![images](img/c03-i105.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mi>k</mi></math>我们有 ![images](img/c03-i106.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>n</mn> 个变量。\n\n我们可以在 R 语言中使用\
  \ `dummies` 包来完成虚拟编码。该包提供了 `dummy.dataframe()` 函数来实现此操作。为了演示如何在 R 中进行虚拟编码，我们再次使用\
  \ `vehicles` 数据集并尝试对 `drive` 特征进行编码，以获得与概念示例相似的结果。注意 `drive` 特征目前具有超过三个值。\n\n```\n\
  > vehicles %>%\nselect(drive) %>%\nsummary()\n \n drive \n 2-Wheel Drive    : 491\
  \ \n Rear-Wheel Drive :13194 \n All-Wheel Drive  : 8871 \n Front-Wheel Drive:13074\
  \ \n 4-Wheel Drive    : 1349\n```\n\n为了简化我们的演示，我们将 2 轮驱动车辆重新编码为前轮驱动，并将 4 轮驱动车辆重新编码为全驱。我们没有覆盖原始数据集，而是创建了\
  \ `vehicles` 数据集的副本并命名为 `vehicles2`。我们还创建了 `drive` 特征的副本并命名为 `drive2`。`drive2` 的值使用\
  \ `dplyr` 包中的 `recode()` 函数从 `drive` 重新编码。\n\n```r\n> library(tidyverse)\n> vehicles2\
  \ <- vehicles %>%\n mutate(drive2 = recode(drive, \"2-Wheel Drive\" = \"Front-Wheel\
  \ Drive\")) %>%\n mutate(drive2 = recode(drive2, \"4-Wheel Drive\" = \"All-Wheel\
  \ Drive\")) %>%\n select(drive, drive2)\n```\n\n重复数据集 (`vehicles2`) 的描述性统计显示，现在\
  \ `drive2` 特征只有三个值了。\n\n\n\n\n\n```\n> head(vehicles2)\n\n# A tibble: 6 x 2\n  drive\
  \            drive2 \n  <fct>            <fct> \n1 2-Wheel Drive    Front-Wheel\
  \ Drive\n2 2-Wheel Drive    Front-Wheel Drive\n3 2-Wheel Drive    Front-Wheel Drive\n\
  4 Rear-Wheel Drive Rear-Wheel Drive \n5 Rear-Wheel Drive Rear-Wheel Drive \n6 Rear-Wheel\
  \ Drive Rear-Wheel Drive\n\n> summary(vehicles2)\n\n drive                     \
  \         drive2 \n 2-Wheel Drive    :  491   Front-Wheel Drive:13565 \n Rear-Wheel\
  \ Drive :13194   Rear-Wheel Drive :13194 \n All-Wheel Drive  : 8871   All-Wheel\
  \ Drive :10220 \n Front-Wheel Drive:13074 \n 4-Wheel Drive    : 1349\n```\n\n我们现在准备好对\
  \ `drive2` 特征进行哑变量编码（dummy code）。然而，在在此之前，我们从 `dummy.data.frame()` 函数提供的文档中学习到，该函数的输入数据集必须是一个数据框。使用\
  \ R 基础函数 `data.frame()`，我们将其转换为数据框。\n\n```\nvehicles2 <- data.frame(vehicles2)\n\
  ```\n\n然后，我们使用 `dummy.data.frame()` 函数对 `drive2` 特征进行哑变量编码。我们向函数传递了三个参数。第一个参数（`data`）是输入数据集。第二个参数（`names`）是我们想要进行哑变量编码的特征列名。第三个参数（`sep`）是用于特征名和特征值之间的字符，用来创建一个新的列名。\n\
  \n```\n> library(dummies)\n> vehicles2 <- dummy.data.frame(data = vehicles2, names\
  \ = \"drive2\", sep = \"_\")\n```\n\n数据集的预览显示，`drive2` 特征现在被哑变量编码为三个新特征。\n\n```\n\
  > head(vehicles2)\n\n             drive drive2_Front-Wheel Drive drive2_Rear-Wheel\
  \ Drive drive2_All-Wheel Drive\n1    2-Wheel Drive                        1    \
  \                   0                      0\n2    2-Wheel Drive               \
  \         1                       0                      0\n3    2-Wheel Drive \
  \                       1                       0                      0\n4 Rear-Wheel\
  \ Drive                        0                       1                      0\n\
  5 Rear-Wheel Drive                        0                       1            \
  \          0\n6 Rear-Wheel Drive                        0                      \
  \ 1                      0\n```\n\n### 数据降维\n\n在模型构建过程之前，我们有时发现数据量太大或太复杂，无法以当前的形式使用。因此，在进行机器学习过程之前，我们有时必须减少观测值的数量、变量的数量或两者兼有。在接下来的章节中，我们将讨论一些最流行的数据降维方法。\n\
  \n#### 采样\n\n给定一个观测数据集，*采样*（sampling）是从数据集中选择行的子集作为整体的代表的过程。在统计学术语中，原始数据集被称为*总体*（population），而选出的子集被称为*样本*（sample）。在监督学习中，采样通常用作生成训练集和测试集的方法。这有两种常用方法，分别是*简单随机采样*（simple\
  \ random sampling）和*分层随机采样*（stratified random sampling）。\n\n##### 简单随机采样\n\n简单随机采样过程涉及从一个无序集合中随机选择\
  \ ![images](img/c03-i0105.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>n</mi></math> 个实例，其中 ![images](img/c03-i0109.png)<math display=\"inline\" overflow=\"\
  scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mi>N</mi></math> 个实例。`n` 是样本量，`N` 是总体大小。简单随机采样有两种方法。第一种假设一旦某个实例被选中，它就不会再被选择。这被称为*不放回采样*（sampling\
  \ without replacement）。为了说明这种方法的工作原理，考虑一个装有 ![images](img/c03-i138.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mn>100</mn></math> 个彩色球的袋，并假设我们要随机选取 ![images](img/c03-i123.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>20</mn> 个球来创建一个样本。为此，我们从袋中抽取\
  \ ![math display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>20</mn></math> 次。每次抽取，随机选择一个球，记录其颜色，并将其放入另一个袋中。所有迭代中选取的球的计数代表了样本。在这种方法下，第一次从袋中抽取到某个特定球的概率是\
  \ ![images](img/c03-i122.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac><mn>1</mn><mn>100</mn></mfrac></math>。然而，第二次从袋中抽取时，因为放入了之前之前的球，选取某个特定球的概率现在变为\
  \ ![images](img/c03-i116.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac><mn>1</mn><mn>99</mn></mfrac></math>。在后续迭代中，选取某个特定球的概率将是 ![images](img/c03-i117.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mfrac><mn>1</mn><mn>98</mn></mfrac></math></math，![images](img/c03-i118.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mfrac><mn>1</mn><mn>97</mn></mfrac></math></math，以此类推。选取某个特定球的概率会随着每次后续迭代而增加。\n\
  \n\n\n\n\n简单随机抽样的第二种方法假设一个实例在采样过程中可以被多次选取。这被称为`有放抽样`（random sampling with replacement）。让我们使用上一个例子中的\
  \ 100 个 ![images](img/c03-i0126.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>100</mn></math> 彩色球来演示这种方法是如何工作的。和之前一样，我们也从袋子里随机抽取 ![images](img/c03-i0146.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>20</mn></math> 次来创建样本，但有一个明显的不同。这次，我们随机选择一个球，记录球的颜色，然后将选中的球放回袋子里（而不是把它放入第二个袋子）。通过这种方法，因为我们将选中的球放回了原袋，所以跨所有迭代中选取特定球的概率保持不变\
  \ (![images](img/c03-i0115.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mfrac><mn>1</mn><mn>100</mn></mfrac></mrow></math>）。这种采样方法也称为`自助法`（bootstrapping），它是评估模型未来性能的流行方法的基础。我们将在第\
  \ 9 章中详细讨论这一点。\n\n在 R 中进行简单随机抽样，我们使用 R 的基础函数 `sample()`。假设我们想生成一个位于 ![images](img/c03-i0074.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>1</mn></math> 和 ![images](img/c03-i0112.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>100</mn></math> 之间的 20 个 ![images](img/c03-i0121.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>20</mn></math> 数字样本。为了实现，我们向\
  \ `sample()` 函数传递三个参数。第一个参数是待选择的项目数量。我们将其设置为 ![images](img/c03-i0120.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mn>100</mn></math>，即总体量。第二个参数是待选择的项目数量。我们将其设置为 ![images](img/c03-i0142.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>20</mn></math>，即样本量。最后一个参数指定采样应该是有放回还是不放回的方式进行。这次我们将参数设置为\
  \ `replace = FALSE`，这表示我们打算进行不放回的简单随机抽样。\n\n```\n> set.seed(1234)\n> sample(100,\
  \ 20, replace = FALSE)\n \n [1] 28 80 22 9 5 38 16 4 86 90 70 79 78 14 56 62 93\
  \ 84 21 40\n```\n\n注意，我们在调用 `sample()` 函数之前调用了另一个 R 基础函数——`set.seed(1234)`。该函数为\
  \ R 中的随机数生成引擎设置随机种子。通过将种子设置为 ![images](img/c03-i0128.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mn>1234</mn></math>，我们保证了无论何时运行随机采样代码，都能获得同一组随机数。种子值（在本例中为\
  \ ![images](img/c03-i0129.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>1234</mn></math>）是任意的，可以是任何整数。关键在于，当我们使用这个种子时，将生成相同的随机数。在书的其余部分，每当我们运行依赖随机数生成的代码时，都会频繁使用\
  \ `set.seed()` 函数。这允许读者复现文中的结果。\n\n现在我们已经理解了如何在 R 中进行不放回的随机抽样，通过将 `sample()` 函数中的\
  \ `replace` 参数设置为 `TRUE`，就可以轻松地进行有放回的简单随机抽样。\n\n```\n> set.seed(1234)\n> sample(100,\
  \ 20, replace = TRUE)\n```\n\n注意这次我们的样本中出现了重复项。例如，我们有三个 ![images](img/c03-i0115.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><mfrac><mn>1</mn><mn>100</mn></mfrac></mrow></math>。正如之前提到的，采样常用于机器学习将数据划分为训练和测试数据集。为了实现这一点，我们首先需要生成一个\
  \ ![images](img/c03-i0134.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mn>27</mn><mo>,</mo><mn>734</mn></mrow></math> 个数字，这些数字代表原始数据的行，我们将其作为训练集。使用\
  \ `sample()` 函数，操作如下：\n\n```\n> set.seed(1234)\n> sample(36979, 27734, replace =\
  \ FALSE)\n```\n\n`sample_set` 对象现在包含了 ![images](img/c03-i0135.png)<math display=\"\
  inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mrow><mn>27</mn><mo>,</mo><mn>734</mn></mrow></math>\
  \ 个数字，我们可以从 RStudio 的全局环境窗口看到。在这个例子中，我们显式地指定了总体量样本量的值。除了这样做，我们也可以使用 `nrow()` 函数来获取\
  \ `vehicles` 数据集的行数，并将其设置为 `sample()` 函数中的总体量。使用同样的方法，样本量将变为指定为 `nrow(vehicles)\
  \ * 0.75`。\n\n```\n> set.seed(1234)\n> sample_set <- sample(nrow(vehicles), nrow(vehicles)\
  \ * 0.75, replace = FALSE)\n```\n\n现在，我们可以选取样本集向量中表示的 `vehicles` 数据集的行作为我们的训练集。这指定为\
  \ `vehicles[sample_set, ]`。\n\n\n\n\n\n```r\n> vehicles_train <- vehicles[sample_set,\
  \ ]\n> vehicles_train\n \n# A tibble: 27,734 x 12\n   citympg cylinders displacement\
  \ drive highwaympg make model class\n     <dbl>   <dbl>   <dbl> <fct> <dbl> <fct>\
  \ <fct> <fct>\n 1      23      4      1.9 Fron...   31 Satu... SW      Comp...\n\
  \ 2      14      8      4.2 All-...   23 Audi    R8      Two ...\n 3      15   \
  \   8      5.3 4-Wh...   22 GMC     Yuko... Spor...\n 4      25      4      1.9\
  \ Fron...   36 Satu... SC      Subc...\n 5      17      6      2.5 Fron...   26\
  \ Ford    Cont... Comp...\n 6      17      6      3.8 Fron...   27 Chev... Mont...\
  \ Mids...\n 7      20      4      2   Fron...   22 Plym... Colt... Comp...\n 8 \
  \     10      8      5.2 All-...   15 Dodge   W100... Pick...\n 9      22      4\
  \      1.6 Rear...   26 Suzu... Vita... Spor...\n10      17      6      4   Rear...\
  \   22 Niss... Fron... Pick...\n# ... with 27,724 more rows, and 4 more variables:\
  \ year <fct>,\n# transmissiontype <fct>, transmissionspeeds <dbl>,\n# co2emissions\
  \ <dbl>\n```\n\n为了选择 `vehicles` 数据集中未包含在 `sample_set` 向量中的行，我们指定 `vehicles[-sample_set,\
  \ ]`。这些实例构成了我们的测试集。\n\n```r\n> vehicles_test <- vehicles[-sample_set, ]\n> vehicles_test\n\
  \ \n# A tibble: 9,245 x 12\n   citympg cylinders displacement drive highwaympg make\
  \ model class\n    <dbl>   <dbl>   <dbl> <fct>     <dbl> <fct>  <fct> <fct>\n 1\
  \     14       8     4.1 Rear...     19 Cadi... Brou... Larg...\n 2     18     \
  \  8     5.7 Rear...     26 Cadi... Brou... Larg...\n 3     19       4     2.6 2-Wh...\
  \     20 Mits... Truc... Pick...\n 4     18       4     2   2-Wh...     20 Mazda\
  \   B200... Pick...\n 5     23       4     2.2 2-Wh...     24 Isuzu   Pick... Pick...\n\
  \ 6     18       4     2   2-Wh...     24 GMC     S15 ... Pick...\n 7     21   \
  \    4     2   2-Wh...     29 Chev... S10 ... Pick...\n 8     19       4     2 \
  \  2-Wh...     25 Chev... S10 ... Pick...\n 9     26       4     2.2 2-Wh...   \
  \  31 Chev... S10 ... Pick...\n10     21       4     2.2 2-Wh...     28 Dodge  \
  \ Ramp......\n# ... with 9,235 more rows, and 4 more variables: year <fct>,\n# transmissiontype\
  \ <fct>, transmissionspeeds <dbl>,\n# co2emissions <dbl>\n```\n\n现在我们有了两个代表训练集和测试集的对象——一个名为\
  \ `vehicles_train` 的 27,734 样本数据集，和一个名为 `vehicles_test` 的 9,245 样本数据集。\n\n### 分层随机采样\n\
  \n分层随机采样是对简单随机采样方法的一种改进，它确保样本内特征值的分布与整体总体中相同特征的分布一致。为了实现这一点，首先将原始数据（总体）中的实例分为名为\
  \ `strata`（层）的子组。然后从每个层内进行随机采样。实例在层中的归属关系取决于它与该层内其他实例的共同属性。例如，使用颜色进行划分时，蓝色层内的所有实例的颜色属性均为蓝色。\n\
  \n为了说明分层抽样的工作原理，让我们再次考虑之前关于 100 个弹珠袋子的例子。这次，我们假设 100 个弹珠中有 50 个是蓝色的，30 个是红色的，20\
  \ 个是黄色的。为了从原始集合根据颜色生成 20 个弹珠的分层样本，我们首先需要根据颜色将弹珠分为三个层，然后从每个层中随机采样。由于 20 是总体的五分之一，我们也需要从每个层中抽取五分之一的弹珠。这意味着对于蓝色层，我们抽取\
  \ `1/5 * 50 = 10` 个弹珠；对于红色层，我们抽取 `1/5 * 30 = 6` 个弹珠；对于黄色层，我们抽取 `1/5 * 20 = 4` 个弹珠。这让我们总得到了\
  \ 20 个弹珠，它们保持了与总体相同的颜色分布。\n\n有多个 R 包提供了分层采样的函数。其中一个就是 `caTools` 包。该包中有一个名为 `sample.split()`\
  \ 的函数，允许我们从数据集中生成分层样本。为了说明该函数的功能，我们将使用 `drive` 特征从 `vehicles` 数据集中生成分层样本。在开始之前，让我们先查看\
  \ `vehicles` 数据集中 `drive` 特征的比例分布。\n\n```r\n> vehicles %>%\n  select(drive) %>%\n\
  \  table() %>%\n  prop.table()\n.\n    2-Wheel Drive  Rear-Wheel Drive  All-Wheel\
  \ Drive \n      0.01327781       0.356797142      0.260162602 \nFront-Wheel Drive\
  \      4-Wheel Drive \n      0.349593496       0.037940379\n```\n\n现在，假设我们打算选择数据的\
  \ 1% 作为样本。使用简单随机采样方法，`drive` 特征值的比例分布如下：\n\n```r\n> set.seed(1234)\n> sample_set\
  \ <- sample(nrow(vehicles), nrow(vehicles) * 0.01, replace = FALSE)\n> vehicles_simple\
  \ <- vehicles[sample_set, ]\n> vehicles_simple %>%\n   select(drive) %>%\n   table()\
  \ %>%\n   prop.table()\n.\n    2-Wheel Drive  Rear-Wheel Drive  All-Wheel Drive\
  \ \n      0.008130081       0.344173442      0.260162602 \nFront-Wheel Drive   \
  \   4-Wheel Drive \n      0.349593496       0.037940379\n```\n\n\n\n\n请注意，虽然比例分布与原始数据集相似，但它们并非完全相同。例如，原始数据集中两轮驱动汽车的分布为\
  \ ![images](img/c03-i0148.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>1.3</mn></math> 百比，而在样本数据集中为 ![images](img/c03-i0149.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><mn>0.8</mn></math> 百比。为了确保样本中 `drive` 值的分布尽可能接近原始数据集，我们需要使用\
  \ `drive` 特征对数据集进行分层，并从每个层中进行随机采样。这正是 `caTools` 包中 `sample.split()` 函数大用用场。我们向该函数传递两个参数。第一个参数是我们打算用于分层的特征。在我们的案例中，它就是\
  \ `vehicles$drive`。第二个参数指定了应使用原始数据的多少比例创建样本（`SplitRatio`）。由于我们打算使用 ![images](img/c03-i0147.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>1</mn></math> 百比的数据作为样本，因此我们将该值设置为\
  \ ![images](img/c03-i0151.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>0.01</mn></math>。\n\n```\n> library(caTools)\n> set.seed(1234)\n> sample_set\
  \ <- sample.split(vehicles$drive, SplitRatio = 0.01)\n```\n\n与 `sample()` 函数类似，`sample.split()`\
  \ 函数返回一个样本集向量。然而，这个向量并没有列出要选取的行号。相反，该向量是一个与原始数据大小相同的逻辑向量，被选取的元素（代表实例）被设置为 `TRUE`，未被选取的元素设置为\
  \ `FALSE`。因此，我们使用 `subset()` 函数来选择对应于 `TRUE` 的样本行。\n\n```\n> vehicles_stratified\
  \ <- subset(vehicles, sample_set == TRUE)\n```\n\n现在，让我们来看看样本中 `drive` 特征值的比例分布。\n\
  \n```\n> vehicles_stratified %>%\n select(drive) %>%\n table() %>%\n prop.table()\n\
  .\n    2-Wheel Drive  Rear-Wheel Drive   All-Wheel Drive\n       0.1351        0.3576\
  \        0.2405\nFront-Wheel Drive     4-Wheel \n       0.3505        0.3513\n```\n\
  \n我们可以看到，`drive` 特征值的比例分布现在比原始数据集接近得了。这就是分层采样发挥作用的地方。\n\n#### 降维\n\n正如其义所示，降维简单是指在训练之前减少特征（维度）的数量。降维是一个重要的步骤，因为它可以减少时间和存储空间，改进可视化效果，并有助于避免所谓的“维度灾咒”现象。\n\
  \n##### 特征选择\n\n特征选择（或*变量选择*）背后的思想是识别出一组最少的冗余或无关的特征，这些特征可以在不影响性能的情况下被移除。在我们介绍的大多数机器学习方法中，我们\n\
  \n##### 特征提取\n\n特征提取，也被称为*特征投影*，是使用数学函数将高维数据转换为低维数据。与特征选择不同（后者的最终集合是原始集合的子集），特征提取产生的是完全不同的特征。虽然降维是一种有效的方法，但它可能存在缺点——创建的特征并不容易解释。两种最流行的特征提取技术是*主成分分析\
  \ (PCA)*和*非负矩阵分解 (NMF)*。对于那些并详细了解这两种方法在本书范围之外的工作原理的读者，我们参考了《统计学习方法》（The Elements\
  \ of Statistical Learning）。\n\n## 练习题\n\n1. <label>1</label> 对于 `vehicles` 数据集中的手动挡车辆，列出\
  \ `drive`、`make`、`model` 和 `class` 变量的描述性统计。\n2. <label>2</label> 使用最小最大归一化方法，对\
  \ `vehicles` 数据中的 `co2issions` 变量进行归一化，使其处于 1 到 10 之间。显示原始和归一化变量的描述性统计。\n3. <label>3</label>\
  \ 在 `vehicles` 数据集中，对 `co2issions` 变量进行离散化，500 以上为 High，500 以下为 Low。使用离散化变量作为层，生成数据集\
  \ ![images](img/c03-i0152.png)<math display=\"inline\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mn>2</mn></math> 百比数据的分层样本。显示原始总体和样本中离散化变量值的比例分布。\n\n## 第二部分\n\n回归\n\n1. 第 4 章：线性回归\n\
  2. 第 5 章：逻辑回归\n\n# 第 4 章\n\n线性回归\n\n在前面的三章中，我们介绍了机器学习背后的基本思想、我们在书中使用的统计建模工具（R 和\
  \ RStudio），以及如何为机器学习过程管理数据。在本章中，我们将介绍书中涵盖的第一种监督学习方法。当我们希望通过生成数值预测来回答问题时，就会使用这种方法，例如：根据广告的类型和金额预测潜在客户产生的收入，根据天气状况预测某天租赁自行车的数量，或者根据其他特征预测特定患者的血压。这种方法被称为*回归*。回归技术是一类机器学习算法，它们通过量化数值值之间关系的大小和强度来预测数值响应。在本章中，我们将引入*线性回归*作为一种监督学习方法，它尝试使用观测数据拟合一个线性预测函数来估计未观测数据。\n\
  \n在本章结束时，你将学习以下内容：\n\n* 简单线性和多元线性回归背后的统计原理\n* 如何使用 R 拟合简单线性回归模型\n\n\n\n\n- 如何评估、解释和应用简单线性回归模型的结果\n\
  - 如何扩展问题描述以包含多个预测变量，并使用 R 拟合多元线性回归模型\n- 如何评估、解释、改进和应用多元线性回归模型的结果\n- 简单线性回归和多元线性回归的优缺点\n\
  \n# 自行车租赁与回归\n\n在本章中探索线性回归时，我们将使用一个真实世界的案例来支持我们的学习。我们的数据集来自 Capital Bike Share，这是一个为华盛顿特区地区提供服务的自行车租赁计划。我们将使用的数据集将作为随本书附带的电子资源的一一部分提供给您。（有关访问电子资源的更多信息，请参阅引言。）它包含了\
  \ 2011 年至 2012 年两年内的每日自行车租赁信息。\n\n想象一下我们被华盛顿特区市长办公室聘请，帮助他们应对日益严严重的交通拥堵问题。该市推出了一项低成本的共享单计划，试图减少道路上的汽车数量。然而，在取得早期成功后，该市开始收到越来越多关于某些日子自行车短缺以及其他日子自行车供应过剩的投诉。为了解决这个问题，该市决定与一家全国性的自行车租赁公司合作，管理市内的自行车供应。作为合作伙伴协议的一部分，该市需要向自行车租赁公司提供全城的每日需求估计。自该计划启动以来，该市收集了每日租赁自行车的数量，以及相应的天气和季节数据。\n\
  \n数据集包含了几个用于我们分析的天气相关变量：\n\n- `temperature` 是以华氏度为单位的每日气温。\n- `humidity` 是每日平均湿度，表示为\
  \ 0.0 到 1.0 之间的小数。\n- `windspeed` 是每日平均风速，单位为英里/小时。\n- `realfeel` 是根据温度、湿度、云量和其他天气因素得出的测量值，用于描述户外人员感受到的温度。其单位为华氏度。\n\
  - `weather` 是一个用于描述天气条件的分类变量，使用以下量表：\n    - 1: 晴朗或多云\n    - 2: 小雨\n    - 3: 大雨\n\
  \n除了这些天气信息外，我们还有一些描述每天特征的变量。这些包括：\n\n- `date` 是每个实例中描述的日历日期，包括日、月、年。\n- `season`\
  \ 是记录的日历季节，表示如下：\n    - 1: 冬季\n    - 2: 春季\n    - 3: 夏季\n    - 4: 秋季\n- `weekday`\
  \ 是记录的星期几，表示从 0（周日）到 6（周六）的整数。\n- `holiday` 是一个二值变量，如果是节假日则为 1，否则为 0。\n\n最后，数据集包含一个名为\
  \ `rentals` 的变量，描述了给定日期内发生的自行车租赁交易次数。作为市长的顾问，我们的任务是使用这些观测数据开发一个模型，根据所提供的部分或全部特征，预测全城的每日自行车租赁\
  \ `rentals` 需求。这将帮助潜在的合作伙伴预测某天的自行车需求，使他们能够预测收入，并确保街道上有足够的自行车来满足骑者的需求。\n\n根据提供的问题和数据，我们需要回答的一些问题包括：\n\
  \n- 自行车租赁数量与任何其他变量之间是否存在关系？\n- 如果存在关系，这种关系有多强？\n- 这种关系是线性的吗？\n- 如果关系是线性的，我们能很好地量化一个变量对自行车租赁数量的影响？\n\
  - 在给定每个相关变量的未来值的情况下，我们能多准确地预测自行车租赁的数量？\n\n在本章结束时，我们将使用线性回归和相关技术回答每一个问题。\n\n## 变量之间的关系\n\
  \n为了开始回答我们在上一节中提出的自行车租赁问题，我们需要理解我们的数据以及每个变量是如何相互相关的。我们陈述的业务问题是能够有效预测给定当天全城的自行车租赁数量。为了做到这一点，我们必须了解什么因素会导致租赁量的增加或减少。因此，我们应该首先评估并量化\
  \ `rentals` 与数据集中其他变量之间的关系。\n\n### 相关性\n\n`相关` 是用于描述和量化两个变量之间关系的统计术语。它提供了关系的单一数值，被称为`相关系数`。衡量相关性有多种方法；但对于线性关系，皮尔逊相关系数`是最常用的。在数学上，两个随机变量\
  \ `x` 和 `y` 之间的相关系数表示如下：\n\n```\nρ = cov(x, y) / (σ_x * σ_y)\n```\n\n其中 `cov(x,\
  \ y)` 是 `x` 和 `y` 的协方差；`σ_x` 是 `x` 的标准差；`σ_y` 是 `y` 的标准差。在解释两个变量之间的皮尔逊相关系数的强度时，常用的规则是：系数绝对值\
  \ 0 到 0.3 视为不存在或弱相关，0.3 到 0.5 以上为中等相关，0.5 以上为强相关。取值范围从 -1 到 +1，绝对值越大表示关系越强。负系数意味着两个变量之间存在反向关系。也就是说，当一个变量增加时，另一个变量会减少，反之亦然。相反地，正系数意味着当一个变量增加时，另一个变量也增加。\n\
  \n\n\n\n现在，让我们来看看自行车租赁数据集，看看我们是否可以使用皮尔逊相关系数来量化 `rentals`（租赁量）与其他某些变量之间的关系。图 4.1\
  \ 显示了 `rentals` 与其他三个变量（`humidity` 湿度、`windspeed` 风速和 `temperature` 温度）对比的散点图。这三张图都显示，每个变量与\
  \ `rentals` 之间似乎存在某种关系。我们可以通过观察散点图的形状来发现这些关系。\n\n让我们从 `temperature` 开始。租赁量与温度的关系图表显示了这些变量之间存在很强的关系。从\
  \ 20 度左右的低温开始，自行车租赁量很低。随着温度升高，租赁量稳步增加，直到我们达到一个点，在过热的日子里租赁量开始下降。或者，用统计学的语言来说，当温度低于\
  \ 70 度时，`temperature` 与 `rentals` 之间存在强正相关，当温度高于 70 度时，则存在中度负相关。这在直觉上是合理的：70 度的一天听起来是骑行的好天气！\n\
  \n![图 4.1 散点图展示了因变量 rentals 与三个自变量中每一个变量（湿度、风速和温度）之间的关系](img/c04f001.png)\n\n图 4.1\
  \ 散点图展示了因变量 rentals 与三个自变量中每一个变量（湿度、风速和温度）之间的关系\n\n然而，`humidity` 与 `rentals` 之间以及\
  \ `windspeed` 与 `rentals` 之间的关系没有那么强。我们注意到在这两个天气属性的极值情况下存在轻微的负相关。当湿度超过 75% 或风速超过每小时\
  \ 10 英里时，租赁量开始下降。\n\n视觉检查可以让我们对这些变量之间关系的强度有一个感觉，但它只允许我们用不精确的术语来描述这些关系，例如“轻微负相关”或“强正相关”。视觉检查无法让我们量化这些关系的强度。这就是皮尔逊相关系数可以派上用场。我们将使用\
  \ R 来计算它。\n\n首先，我们需要加载数据集。为了本文的讨论，我们将假设数据集存储在当前工作目录中。关于加载数据集选项的更多信息，请参阅介绍部分。以下是加载数据集的代码：\n\
  \n```\n> library(tidyverse)\n> bikes <- read_csv(\"bikes.csv\")\n```\n\n一旦加载了数据集，让我们尝试计算其中一些统计值。首先，我们将使用\
  \ R 内置的 `cov()` 函数计算 `humidity` 和 `rentals` 的协方差。\n\n```\n> cov(bikes$humidity,\
  \ bikes$rentals)\n \n[1] -27.77323\n```\n\n这告诉我们 `humidity` 与 `rentals` 之间的协方差为\
  \ -27.77。同样，我们可以使用 R 的 `sd()` 函数计算两个变量的标准差。\n\n```\n> sd(bikes$humidity)\n \n[1]\
  \ 0.1424291\n \n> sd(bikes$rentals)\n \n[1] 1937.211\n```\n\n请记住，标准差的单位与原始变量单位相同，因此湿度的标准差为\
  \ 14.2%，而自行车租赁的标准差为 1937.2 次。\n\n然后我们可以通过将公式 4.1 中的公式写成 R 代码来计算皮尔逊相关系数。\n\n```\n\
  > pearson <- cov(bikes$humidity, bikes$rentals) / \n (sd(bikes$humidity) * sd(bikes$rentals))\n\
  \ \n> pearson\n \n[1] -0.1006586 \n```\n\n这是执行此计算的方法。R 通过提供 `cor()` 函数直接计算两个随机变量的皮尔逊相关系数，为我们节省了计算协方差和标准差的步骤。\n\
  \n```\n> cor(bikes$humidity, bikes$rentals)\n```\n\n然而，`humidity` 与 `rentals` 之间以及\
  \ `windspeed` 与 `rentals` 之间的关系没有那么强。我们注意到在这两个天气属性的极值情况下存在轻微的负相关。当湿度超过 75% 或风速超过每小时\
