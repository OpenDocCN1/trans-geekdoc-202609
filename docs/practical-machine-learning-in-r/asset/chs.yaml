  \    double 8 8 8 8 8\n$ monthsSinceLastation   double 14 14 14 14 14\n$ respondedMailing\
  \        fct FALSE FALSE FALSE FALSE\n$ inHouseDonor            fct NA NA NA NA\n\
  $ plannedGivingDonor      fct FALSE FALSE FALSE FALSE\n$ sweepstakesDonor      \
  \  fct FALSE FALSE FALSE FALSE\n$ P3Donor                 fct FALSE FALSE FALSE\
  \ FALSE\n$ state                   fct IL CA NC FL\n$ urbanicity              fct\
  \ town town rural rural\n$ socioEconomicStatus     fct average average average average\n\
  $ isHomeowner             fct TRUE TRUE TRUE TRUE\n$ gender                  fct\
  \ female female female female\n```\n\n### 探索与准备数据\n\n现在我们有了数据，让我们花一点时间进行初步数据分析以更好地了解它。为了简单起见，我们将范围限制在仅使用数据集中的数值特征作为响应变量的预测。\n\
  \n```\n> donors <- donors %>%\n select(\n    age,\n    numberChildren,\n    incomeRating,\n\
  \    wealthRating,\n    mailOrderPurchases,\n    totalGivingAmount,\n    numberGifts,\n\
  \    smallestGiftAmount,\n    largestGiftAmount,\n    averageGiftAmount,\n    yearsSinceFirstation,\n\
  \    monthsSinceLastation,\n    respondedMailing\n )\n```\n\n### 处理缺失数据\n\n我们新数据集的统计摘要显示，我们有一些缺失值（NAs），并且预测变量的尺度差异很大。\n\
  \n\n\n\n\n```\n> summary(donors)\n \n      age        numberChildren   incomeRating\
