  \n`Multicollinearity`（多共线性）是指两个或多个预测变量之间高度相关时的一种现象。例如，考虑根据以下变量预测房价价格的情况：\n\n*  \
  \ 卧室数量\n*   年龄\n*   楼层数\n*   平方面积\n\n在这个例子中，理理卧室数量、楼层数和平方面积将高度相关。随着楼层数的增加，房屋的面积也会之增加。同样，随着卧室数量和楼层数的增加，面积也会之增加。\n\
  \n线性回归模型中的多共线性是一个问题，因为它会导致标准误差严重膨胀，并使得很难分离出单个预测变量对响应变量的影响。\n\n有几种方法可以测试共线性，其中一种是使用简单的相关矩阵（参见本章前面的部分“使用\
  \ `corrplot` 可视化相关性”）来评估预测变量对之间的相关性程度。然而，这种方法对于检测以下情况没有用：没有单一变量对之间高度相关，但三个或更多变量之间存在高度相关。为了检测此类场景是否存在，我们可以计算每个预测变量的`方差膨胀因子\
  \ (VIF)`。变量的 `VIF` 衡量了由于模型中预测变量之间存在相关性导致该变量估计回归系数的方差膨胀程度。预测变量 `k` 的 `VIF` 计算如下：\n\
  \n(4.18\n\n### 改进模型\n\n现在我们更好地理解了各种诊断测试及其如何应用于我们的数据，是时候将它们付诸实践以改进模型了。在之前，我们需要考虑一些额外事项。\n\
  \n#### 考虑非线性关系\n\n线性回归的基础假设是预测变量与响应变量之间的关系是线性的。然而，情况并非总是如此。例如，观察图 4.7 中的图表，我们看到预测变量之间的关系是非线性的。\n\
  \n![图 4.7 每个预测变量（湿度、风速和温度）与响应变量（租赁量）的线性回归拟合。深色表示原始预测变量的线性拟合，而浅色（蓝、红、绿）表示引入多项式变量后的拟合。](img/c0)\n\
  \n为了扩展模型以适应这些非线性关系，我们可以将预测变量的转换版本添加到模型中。这种新模型被称为*多项式回归*。观察彩色拟合线的曲率，它们似乎暗示了二次关系，因此我们将为模型添加预测变量的平方版本。为了做到这一点，我们如下所示创建新变量\
  \ `humidity2`、`windspeed2` 和 `temperature2`：\n\n```\n> bikes2 <- bikes2 %>%\n  \
  \  mutate (humidity2 = humidity²) %>%\n    mutate (windspeed2 = windspeed²) %>%\n\
  \    mutate (temperature2 = temperature²)\n```\n\n\n\n\n\n```\n> bikes_mod3 <-\n\
  \   lm (data = bikes2,\n       rentals ~ humidity + windspeed + temperature + \n\
  \         humidity2 + windspeed2 + temperature2)\n \n> summary (bikes_mod3)\n \n\
  Call:\nlm(formula = rentals ~ humidity + windspeed + temperature + humidity2 +\n\
  \    windspeed2 + temperature2, data = bikes2)\n \nResiduals:\n     Min       1Q\
