  \ 20 名患者的数据点，我们得到了如下结果，结果显示了每个患者与新患者之间的距离按从小到大排序：\n\n| 患者 | 年龄 | 胆固醇 | 年龄（归一化） |\
  \ 胆固醇（归一化） | 到 ![images](img/c06-i0032.png)<math display=\"inline\" overflow=\"\
