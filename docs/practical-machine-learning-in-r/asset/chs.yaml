  \ <mn <mn010</mn6</mo> <> <mn>mn>>momomomomo>momomn> </mo></math>\n\n在我们的计算中引入了零频率词后，ham\
  \ 的概率将始终为零，无论表中任何其他单词的频率如何。这意味着对于任何不包含 `sale` 词的新消息，spam 的概率将始终是 100%。这显然是错误的。\n\
  \n为了解决这个问题，我们采用所谓的`加性平滑`（additive smoothing）或`拉普拉斯平滑`（Laplace smoothing）。该方法涉及在每个单词的概率计算加上一个很小的数字，称为`伪计数`（pseudocount）。这个数字通常设置为\
  \ 1，通过添加它，我们确保在每个类别中没有任何一个单词的出现概率为零。因此，在给定频率 `N` 的情况下，我们不再计算某个单词 `x_i` 的概率如下：\n\n\
