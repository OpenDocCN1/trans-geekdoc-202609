  \ 是高频词。\n\n\n\n\n```\nlibrary(tidyverse)\nheart <- read_csv(\"heart.csv\", col_types\
  \ = \"nffnnffnfnfnff\")\nglimpse(heart)\n \nObservations: 920\nVariables: 14\n$\
  \ age            <dbl> 63, 67, 67, 37, 41, 56, 62, 57, 63, 53, 57, 56, 56, 44, ...\n\
