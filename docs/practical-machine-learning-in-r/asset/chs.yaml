  \n### 评估模型\n\n现在我们已经有了逻辑回归模型，让我们针对测试数据生成预测。\n\n```\n> income_pred1 <- predict(income_mod1,\
  \ income_test, type = 'response')\n \n> head(income_pred1)\n \n         1      \
  \    2          3          4          5          6 \n0.88669468 0.09432701 0.31597757\
  \ 0.96025585 0.21628507 0.43047656\n```\n\n正如我们看到的，预测结果提供了测试数据中每个实例 `income=1` 的概率。为了用\
  \ 0 和 1 来解释结果，我们需要确定一个理想的截断值。\n\n```\n> library(InformationValue)\n \n> ideal_cutoff\
  \ <-\n optimalCutoff(\n   actuals = income_test$income,\n   predictedScores = income_pred1,\n\
  \   optimiseFor = \"Both\")\n \n> ideal_cutoff\n[1] 0.4294492\n```\n\n我们的输出告诉我们，预测的理想截断值为\
  \ 0.4294492。使用这个截断值，我们对预测结果进行了重新编码。\n\n```\n> income_pred1 <- ifelse(income_pred1>=\
  \ ideal_cutoff, 1, 0)\n \n> head(income_pred1)\n \n1 2 3 4 5 6 \n1 0 0 1 0 1\n```\n\
  \n现在我们准备评估模型在测试数据上的表现了。为了做到，我们创建一个混淆矩阵，并利用其值推导出模型的预测准确率。\n\n```\n> income_pred1.table\
  \ <- table(income_test$income, income_pred1)\n \n> sum(diag(income_pred1.table))\
  \ / nrow(income_test)\n[1] 0.7384521\n```\n\n结果显示我们模型的预测准确率为 73.85%。这是一个相当合理的性能。注意，我们在模型中仅使用了数据中的分类特征。在接后的练习中，我们将为您提供机会，通过考虑连续特征来改进我们的模型。\n\
