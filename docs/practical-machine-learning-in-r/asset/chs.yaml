  \          month7      232.599  278.814    0.032   0.834   0.404   -314.846    780.044\n\
  \          month8      249.976  268.742    0.037   0.930   0.353   -277.646    777.646\n\
  \          month9      546.315  238.624    0.077   2.370   0.353   -27.694\n\nmonth105466.112222.6222.00070...000000000000000..00\n\
  \          month11.....\n          month1211.11.\n          year201211.11.\n```\n\
