  ><mrow> <mi>F</mi> <mi typeof=\"normal\">&#x020B;</mi> <mo>-</mo> <mi typeof=\"\
  normal\">&#8202;</mi> <mi>s</mi> <mi>c</mi> <mi>o</mi> <mi>r</mi> <mi>e</mi> <mo>=</mo>\
  \ <mfrac> <mrow> <mn>2</mn> <mo>&#215;</mo> <mn>0.985</mn> <mo>&#215;</mo> <mn>0.628</mn>\
  \ </mrow> <mrow> <mn>0.985</mn> <mo>+</mo> <mn>0.628</mn> </mrow> </mfrac> <mo>=</mo>\
  \ <mn>0.</mn> <mn>7</mn> <mn>67</mn> </mrow> </math>\n\n如果没有正确理解，这个指标可能会很有误导性。通过使用精率和召回率的调和平均数，我们假设精率和召回率对我们的问题同样重要。情况并非总是如此。因此，在根据\
  \ `F-score` 比较多个模型时，我们应该考虑额外的模型性能衡量指标。\n\n\n\n\n精确率（precision）和召回率（recall）都是从正类的角度评估模型性能的。有时，评估模型的性能不仅要看它在单一类别上的表现，还要看它在区分类别方面的表现，这同样重要。例如，在我们垃圾邮件过滤器示例中，一个过于宽松的模型可能很好地识别出大部分或所有的垃圾邮件（高召回率），但在此过程中，它可能会拦截大量的正常邮件（ham\
  \ messages）。通过评估模型识别正类以及识别负类的能力，我们可以对模型性能获得一个更平衡的视角。`Sensitivity`（灵敏度）和 `specificity`（特异性）是提供我们这些信息的两个性能指标。\n\
  \n### Sensitivity（灵敏度）\n模型的灵敏度是被正确识别的实际正例的比例（参见图 9.12）。它也被称为真正率（true positive rate），其公式与召回率相同。应用于我们的垃圾过滤器，高灵敏度模型是指能够很好识别大部分垃圾邮件的模型。灵敏度的计算方式如下：\n\
  \n```\n9.12![images](img/c09-disp-0012.png)<math display=\"block\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
