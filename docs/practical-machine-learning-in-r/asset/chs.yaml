  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mn>4</mn></math>它恰好是边界，所以我们保留它为![images](img/c03-i0024.png)<math\
