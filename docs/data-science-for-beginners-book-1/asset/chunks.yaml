- raw: 'Variables: Variables are the characteristics or properties being measured
    or observed in a study or analysis. They represent the columns or fields in a
    dataset and can be of different data types. Variables can be independent (predictor)
    variables, which are used to predict or explain an outcome, or dependent (response)
    variables, which are the outcomes being predicted or explained.


    Distributions: Distributions describe the patterns or spread of values within
    a dataset or variable. Understanding the distribution of data is essential for
    performing statistical analyses and making accurate inferences. Common types of
    distributions include:


    Normal Distribution (Gaussian Distribution): The normal distribution is a bell-shaped
    symmetric distribution characterized by a mean and standard deviation. Many natural
    phenomena and statistical processes exhibit a normal distribution, making it widely
    used in data analysis.


    Uniform Distribution: The uniform distribution represents a constant probability
    for values within a given range, indicating that all outcomes are equally likely.


    Skewed Distribution: Skewness refers to the asymmetry of a distribution. A positively
    skewed distribution has a tail that extends towards larger values, while a negatively
    skewed distribution has a tail extending towards smaller values.


    Bimodal Distribution: A bimodal distribution has two distinct peaks or modes,
    indicating the presence of two underlying groups or subpopulations within the
    data.


    Exponential Distribution: The exponential distribution describes the time between
    events occurring in a Poisson process, where events are independent and occur
    at a constant average rate.


    Understanding the distribution of data helps in selecting appropriate statistical
    methods, identifying outliers or anomalies, and making informed decisions based
    on the characteristics of the data.


    In data science, it is important to recognize the data types, understand the variables
    being analyzed, and assess the distribution patterns to appropriately apply statistical
    techniques, perform data transformations, and gain insights from the data.


    Common statistical measures and their interpretation


    Common statistical measures provide valuable insights about the central tendency,
    variability, and relationships within a dataset. Here are some commonly used statistical
    measures and their interpretations:


    Mean: The mean, also known as the average, is the sum of all values in a dataset
    divided by the total number of values. It represents the central tendency of the
    data. The mean is sensitive to extreme values and can be influenced by outliers.


    Median: The median is the middle value in a dataset when it is arranged in ascending
    or descending order. It is not affected by extreme values or outliers and is a
    robust measure of central tendency. If the dataset has an even number of values,
    the median is the average of the two middle values.


    Mode: The mode is the most frequently occurring value in a dataset. It represents
    the value that appears with the highest frequency. A dataset can have one mode
    (unimodal), two modes (bimodal), or more (multimodal).


    Standard Deviation: The standard deviation measures the dispersion or variability
    of the data around the mean. A higher standard deviation indicates greater variability,
    while a lower standard deviation indicates less variability. It is calculated
    as the square root of the variance.


    Variance: The variance measures the average squared deviation from the mean. It
    quantifies the spread or dispersion of the data. A larger variance indicates greater
    variability, while a smaller variance indicates less variability.


    Range: The range is the difference between the maximum and minimum values in a
    dataset. It provides a simple measure of the spread of the data. However, it is
    highly influenced by outliers.


    Interquartile Range (IQR): The interquartile range is the range of values that
    lie between the first quartile (25th percentile) and the third quartile (75th
    percentile) of a dataset. It represents the spread of the central 50% of the data
    and is less affected by outliers compared to the range.


    Correlation Coefficient: The correlation coefficient measures the strength and
    direction of the linear relationship between two variables. It ranges from -1
    to +1, where -1 indicates a perfect negative linear relationship, +1 indicates
    a perfect positive linear relationship, and 0 indicates no linear relationship.


    Covariance: Covariance measures the extent to which two variables vary together.
    A positive covariance indicates a positive relationship, while a negative covariance
    indicates a negative relationship. However, the magnitude of covariance is not
    standardized, making it difficult to compare across different datasets.


    Percentile: Percentiles divide a dataset into hundredths, indicating the value
    below which a certain percentage of the data falls. For example, the 75th percentile
    represents the value below which 75% of the data lies.


    These statistical measures provide important insights into the characteristics
    of a dataset, such as central tendency, dispersion, variability, and relationships.
    They help in summarizing and interpreting data, comparing different groups or
    distributions, identifying outliers, and making informed decisions based on the
    data''s properties.


    ## Chapter 4: Data Acquisition and Data Wrangling


    ## Gathering and cleaning raw data


    Before embarking on any data analysis journey, it is crucial to gather and clean
    raw data, as it lays the foundation for accurate and meaningful insights. This
    process involves collecting data from various sources, organizing it, and ensuring
    its quality and reliability.


    Gathering raw data involves identifying relevant sources and acquiring the necessary
    data. Sources can include databases, surveys, public repositories, APIs, or even
    manual data collection methods. It is important to consider the scope, purpose,
    and limitations of the analysis when selecting data sources. Additionally, it
    is vital to adhere to legal and ethical guidelines while accessing and handling
    data, ensuring privacy and confidentiality.


    Once the data is gathered, the cleaning process begins. Raw data often contains
    inconsistencies, errors, missing values, outliers, or duplicates, which can compromise
    the accuracy and integrity of the analysis. Data cleaning involves a series of
    steps to address these issues and make the data suitable for analysis.


    The first step in data cleaning is examining the data for errors and inconsistencies.
    This may involve reviewing the data''s structure, format, and encoding to ensure
    consistency across different variables. Inconsistencies can include typos, inconsistent
    date formats, or varying units of measurement. Identifying and rectifying these
    inconsistencies is essential to maintain data integrity.


    Handling missing values is another critical aspect of data cleaning. Missing values
    can arise due to various reasons, such as data collection errors, non-responses
    in surveys, or technical issues. Data scientists employ strategies to deal with
    missing values, such as imputation (estimating missing values based on existing
    data patterns) or excluding incomplete cases depending on the nature and extent
    of the missingness. The chosen approach should be guided by the analysis objectives
    and the characteristics of the missing data.


    Outliers, which are extreme values that deviate significantly from the bulk of
    the data, also need attention during the cleaning process. Outliers can occur
    due to measurement errors, data entry mistakes, or genuine extreme observations.
    Identifying and handling outliers appropriately is essential, as they can skew
    analysis results or affect the accuracy of statistical models. Techniques such
    as visualization, statistical tests, or domain knowledge can be employed to identify
    and handle outliers effectively.'
