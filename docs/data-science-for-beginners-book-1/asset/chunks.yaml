  trans: '


    # 变量

    变量是在研究或分析中被测量或观测的特征或属性。它们代表数据集中的列或字段，并可以是不同的数据类型。变量可以是独立变量（预测变量），用于预测或解释结果；也可以是因变量（响应变量），即被预测或解释的结果。


    # 分布

    分布描述了数据集或变量内数值的模式或离散程度。理解数据的分布对于进行统计分析和做出准确的推断至关重要。常见的分布类型包括：


    -   **正态分布（高斯分布）**：正态分布是一种钟形对称分布，以均值和标准差为特征。许多自然现象和统计过程均呈现正态分布，使其在数据分析中被广泛使用。

    -   **均匀分布**：均匀分布表示给定范围内的数值具有恒定的概率，表明所有结果出现的概率相等。

    -   **偏态分布**：偏度是指分布的不对称性。正偏态分布的尾部向较大的值延伸，而负偏态分布的尾部向较小的值延伸。

    -   **双峰分布**：双峰分布具有两个明显的峰值或众，表明数据内部存在两个潜在群体或子总体。

    -   **指数分布**：指数分布描述了泊松过程中发生事件之间的时间间隔，其中事件是相互独立的，并以恒定的平均速率发生。


    理解数据分布有助于选择合适的统计方法，识别离群值或异常值，并根据数据的特征做出明智决策。


    在数据科学中，识别数据类型、理解正在分析的变量并评估分布模式对于适当应用统计技术、执行数据转换以及从数据中获取洞察非常重要。


    # 常见统计指标及其解释

    常见的统计指标可以提供关于数据集中心趋势、变异性和内部关系的有价值的见解。以下是一些常用的统计指标及其解释：


    -   **均值（Mean）**：均值也称为平均数，是数据集中所有数值之和除以数值总数。它代表了数据的中心趋势。均值对极端值敏感，并受到离群值的影响。

    -   **中位数（Median）**：中位数数据集按升序或降序排列时的中间值。它不受极端值或离群值的影响，是一种稳健的中心趋势度量。如果数据集的值个数为偶数，则中位数是两个中间值的平均值。

    -   **众数（Mode）**：众数是数据出现频率最高的值。它代表出现频率最高的数值。一个数据集可以有一个众数（单峰）、两个众数（双峰）或多个众数（多峰）。

    -   **标准差（Standard Deviation）**：标准差衡量数据围绕均值的离散程度或变异性。标准差越大表示变异性越高，标准差越小表示变异性越小。它是方差的平方根。

    -   **方差（Variance）**：方差衡量离均值的平均平方差。它量化数据的扩散程度。方差越大表示变异性越高，方差越小表示变异性越小。

    -   **范围（Range）**：范围是数据最大值和最小值之间的差。它提供了数据范围的简单衡量。然而，它受离群值的影响很大。

    -   **四分位距（IQR）**：四分位距是数据第一四分位数（第 25 位数）和第三四分位数（第 75 位数）之间的数值范围。它代表了数据中间 50%的扩散范围，与范围相比，它受离群值的影响较小。

    -   **相关系数（Correlation Coefficient）**：相关系数衡量两个变量之间线性关系的强度和方向。它的范围从-1 到+1，其中-1
    表示完全负线性关系，+1 表示完全正线性关系，0 表示无线性关系。

    -   **协方差（Covariance）**：协方差衡量两个变量共同变化的程度。正协方差表示正相关，负协方差表示负相关。然而，协方差的大小没有标准化，难以在不同数据集之间进行比较。

    -   **百分位数（Percentile）**：百分位数将数据集划分为百份，表示特定百分比的数据低于的值。例如，第 75 百分位数表示 75%的数据低于该值。


    这些统计指标为数据集的特征提供了重要见解，例如中心趋势、离散、变异性和关系。它们有助于总结和解释数据、比较不同的组或分布、识别离群值，并根据数据的属性做出明智决策。


    # 第 4 章：数据获取与数据整理


    ## 获取和清洗原始数据

    在开始任何数据分析之旅之前，收集和清洗原始数据至关重要，因为它们为准确且有意义的见奠定了基础。这一过程涉及从各种来源收集数据、组织数据并确保其质量和可靠性。


    获取原始数据涉及识别相关来源并获取所需的数据。来源可以是数据库、调查卷、公共仓库、API 甚至是手动数据收集方法。在选择数据源时，考虑分析的范围、目的和局限性很重要。此外，在访问和处理数据时遵守法律和伦理指南至关重要，以确保隐私和机密。


    一旦获取了数据，清洗过程就开始了。原始数据通常包含不一致、错误、缺失值、离群值或重复，这些都会损害分析的准确性和完整性。数据清洗涉及一系列解决这些问题并使数据适用于分析的步骤。


    数据清洗的第一步是检查数据的错误和不一致。这可能涉及审查数据结构、格式和编码，以确保不同变量之间的一致性。不一致可能包括拼写错误、不的日期格式或不同的测量单位。识别并纠正这些不一致之处对于维护数据完整性至关重要。


    处理缺失值是数据清洗的另一个关键方面。缺失值由于多种原因产生，例如数据收集错误、调查中的未回复或技术问题。数据科学家采用策略处理缺失值，例如插补（根据现有数据模式估算缺失值）或根据缺失的性质和程度排除不完整的案例。所选的方法应由分析目标和缺失数据的特征来指导。


    离群值（Outliers）是显著偏离大部分数值的极端值，它们在清洗过程中也需要关注。离群值可能由于测量误差、数据录入错误或真实的极端观测值而产生。识别并适当处理离群值至关重要，因为它们可能会偏偏分析结果或影响统计模型的准确性。可以使用可视化、统计检验或领域知识等技术来有效地识别和处理离群值。


    '
