  trans: '


    # 问题定义


    除了定义问题之外，数据科学家还为数据科学项目建立明确的目标和成功标准。这些目标概述了组织希望通过分析实现的事项，并作为衡量成功的基准。目标根据项目不同而异，从提高运营效率到增加客户满意度或优化资源分配不等。成功标准提供了一种可衡量的方法，以评估是否已实现目标，使数据科学家和利益相关者能够评估数据驱动解决方案的影响。


    将问题定义与组织的整体战略目标对齐至关重要。数据科学家必须确保当前处理的问题与业务更广泛的目标和优先级保持一致。这种对齐确保了从数据科学项目中得出的见解和建议能够直接贡献组织的战略决策过程。


    此外，问题定义还涉及对项目进行适当界定。数据科学家需要定义问题的边界和约束，以确保分析在可用资源和时间范围内保持聚焦且可行的。这一界定阶段有助于管理预期并允许高效分配资源，从而最大化数据科学项目的影响。


    通过在问题定义上投入时间和精力的，数据科学家为成功奠定了基础。定义良好的问题有助于设定明确的方向，集中精力，并确保分析对组织具有相关性和价值。它最大限度地减少了探索无关或不重要问题的风险，并最大化了提供可操作见解和建议的机会。


    综之，问题定义是数据科学过程中的关键步骤。通过理解业务背景、识别特定问题、定义目标和成功标准以及与战略目标对齐，数据科学家为成功铺平道路。定义良好的问题为整个数据科学之旅提供了路线图，引导分析并能够交付有影响力的见解和建议。在问题定义有了坚实基础上，组织可以释放数据科学的全部潜力，做出驱动成功的数据驱动决策。


    # 数据获取与准备


    一旦定义了问题，下一步就是收集分析所需的数据。这可能涉及从各种来源（如数据库、API、传感器或外部数据集）收集数据。数据科学家需要评估数据质量、确保数据完整性、处理缺失值并解决数据不一致问题。应用数据清洗、预处理和转换技术使数据适用于分析。


    在数据科学领域，从问题定义到产生影响见解的旅程始于数据的获取和准备。一旦问题被定义，数据科学家就开始了收集必要数据并将其转换为可用格式的关键任务。这一过程涉及从各种来源收集数据、评估其质量、确保完整性、处理缺失值并解决不一致性。通过数据清洗、预处理和转换技术，数据科学家将原始数据转换为用于分析的精炼可靠的资源。


    数据获取涉及识别和访问相关数据源。这些来源可能包括内部数据库、第三方 API、通过传感器或 IoT 设备收集的数据、公开的数据集，甚至是社交媒体平台。数据科学家必须仔细评估每个数据源的适用性和相关性，以确保它与定义的问题和目标一致。


    评估数据质量是数据获取阶段的一个重要性步骤。数据科学家评估数据的可靠性、准确性和完整性，以确保其可信度。这涉及检查错误、重复、离群值和其他可能影响分析的异常。通过仔细检查数据质量，数据科学家可以确保发现的有效性，并最大限度地减少得出错误结论的风险。


    确保数据完整性是数据获取的另一个关键方面。数据科学家努力收集解决定义问题所需的所有数据点。他们识别并处理缺失值，采用数据插补等技术，或考虑使用适当的统计方法来填补空白。通过处理缺失数据，数据科学家降低了偏偏差或不完整分析的风险。


    数据不一致在现实世界的数据集中很常见，数据科学家必须在数据准备阶段解决这些不一致。这涉及标准化数据格式、解决差异以及处理命名规范或变量表示中的不一致。通过同质化数据，数据科学家创建了一个一致且统一的数据集，有利于分析。


    应用数据清洗、预处理和转换技术是为了准备数据。数据科学家采用一系列技术，包括数据归一化、特征缩放、类别变量编码和降维。这些技术确保数据格式合适并反映分析期间将探索的模式。


    在整个数据获取和准备过程中，数据科学家遵守伦理准则并确保数据隐私和安全。他们负责任地处理敏感信息，尊重隐私法规和组织政策。


    总结，数据获取和准备是数据科学之旅的基础步骤。通过从各种来源收集相关数据、评估其质量、确保完整性并解决不一致性，数据科学家将原始数据转换为用于分析的可靠资源。通过数据清洗、预处理和转换技术，他们为探索、建模和产生可操作见解做了准备。对数据获取和准备的关注关注有意义的分析奠定了基础，为数据驱动决策铺了道路。


    # 探索性数据分析 (EDA)


    探索性数据分析涉及可视化和理解数据的特征。数据科学家利用统计技术、数据可视化工具和总结统计来探索数据，以识别模式、离群值、相关性和关键见解。EDA 有助于形成假设并引导进一步分析的初始见解。


    探索性数据分析 (EDA) 是数据科学之旅中的一个重要步骤，数据科学家深入数据集以全面理解其特征，揭示隐藏模式并提取价值见解。通过采用统计技术、数据可视化工具和总结统计，EDA
    使数据科学家能够揭开数据中隐藏的故事，为进一步分析提供坚实基础。


    EDA 的初始阶段涉及检查数据集的基本属性。数据科学家探索变量的结构、维度基础统计，获得数据格局的全局视图。他们调查数据类型、检查缺失值并评估变量分布，确保对数据集组成有全面的理解。


