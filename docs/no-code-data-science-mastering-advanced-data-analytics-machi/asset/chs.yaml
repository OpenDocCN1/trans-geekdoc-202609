  \ (Confusion Matrix)\n\n此小部件是一个矩阵（也称为真值表和错误矩阵），显示了实际值与预测值的对比数据。在这种情况下，实际值（地面真相 `TN`\
  \ 和 `TP`）基于心导检查。矩阵中的错误显示为 `FP` 和 `FN`。图 5.18 是混淆矩阵的通用表示，图 5.19 是使用逻辑回归的心脏病预测数据集混淆矩阵。虽然二分类生成\
  \ 2x2 表，但你可以进行多分类分类，这需要 3x3 或更大的表格，Orange 在需要时会自动创建。此外，每个混淆矩阵结果针对特定的算法运行，因为它显示了算法进行真实预测（`TN`\
  \ 和 `TP`）的能力以及错误预测（`FP` 和 `FN`）。此矩阵被称为“混淆”矩阵，因为它显示了模型在将数据分类为四种可能选择（`TP`、`TN`、`FP`\
  \ 和 `FN`）时的混淆程度。当混淆矩阵显示出不理想的模型结果（错误分类过多）时，分析师应仔细检查模型、所选特征、所选算法以及应该尝试的其他建模选项，以获得更好的模型。\n\
  \n![](img/image-JYH03IPM.png)\n图 5.18 通用混淆矩阵\n\n![](img/image-X7O6DF23.png)\n混淆矩阵\
  \ (StatQuest)\n\n表 5.3 列出了从混淆矩阵中可以得出的不同指标。（content0139.xhtml）\n\n根据图 5.19 中心脏病预测的混淆矩阵，可以计算以下内容：\n\
  \na. 真阳性 = 73\nb. 真阴性（特异性） = 100\nc. 假阳性 = 17，即预测患心脏病但实际上没病的人。这也是第一类错误。\nd. 假阳性率\
  \ = `FP/(FP + TN)` = 0.145 或 14.5%（等同于 1-特异性）。\n\n\n\n\n\ne. `False negative = 23`，即被预测为未患心脏病但实际上患病的人数。也称为二类错误。\n\
  \nf. `Recall (sensitivity)(true positive rate) = TP/TP + FN = 0.76`。记住 `sensitivity`\
  \ 的分母中包含 `FN`，因此随着假阴性的增加，`sensitivity` 会下降。\n\n![](img/image-HW5F5MX4.png)\n\n图\
  \ 5.19 Orange 中在训练数据上的 LR 混淆矩阵\n\n表 5.3 分类模型评估指标\n\n| 指标 | 公式 | 同义词 |\n| --- | ---\
  \ | --- |\n| Sensitivity (灵敏度) | `TP/TP + FN` | `Recall`, 真阳性率 |\n| Specificity\
  \ (特异性) | `TN/TN + FP` | 真阴性率 |\n| Precision (精确率) | `TP/TP + FP` | 阳性预测值 |\n| False\
  \ positive rate (假阳性率) | `FP/FP + TN` | `1-specificity` |\n| Negative predictive\
  \ value (负性预测值) | `TN/TN + FN` | `NPV` |\n| F1 score (F1 分) | `2x precision x recall/precision\
  \ + recall` | 调和平均数 |\n| Accuracy (准确率) | `TP + TN/TP + TN + FP + FN` | |\n| Misclassification\
  \ rate (错误率) | `1- accuracy` | 错误率 |\n\ng. `Specificity = TN/TN +FP = 0.884`。记住\
  \ `specificity` 和 `sensitivity` 是相互矛盾的，因此始终存在权衡。\n\na. `Precision (positive predictive\
  \ value or PPV) = TP/TP + FP = 0.854`。`Precision` 指的是 `Recall` 的精确程度。记住 `precision`\
  \ 的分母中包含 `FP`。如果存在太多的假阳性，则它是不精确的。\n\nb. `Negative predictive value or NPV = TN/TN\
  \ + FN = 0.813`\n\nc. `F1 Score = 2 x recall x precision/ recall + precision = 0.797`。这是计算\
  \ `recall` 和 `precision` 调和平均数的方法（范围从 0 到 1）。越接近 1 越好。这对于不平衡数据来说是一个非常有用的指标。你还可以计算其他\
  \ `F` 分：如果你想更多关注 `recall` 而少关注 `precision`，请使用 `F2 score (1 + 2 ² ) x recall x precision/2\
  \ ² x recall + precision`；如果你想更多关注 `precision` 而少关注 `recall`，请计算 `F0.5 score (1\
  \ + 0.5 ² ) x recall x precision/0.5 ² x recall + precision`。\n\nd. `Accuracy =\
  \ TP + TN/TP + TN + FP + FN = 0.812`。`Accuracy` 是真阳性和真阴性数量除以所有数据的总和。如果存在类别不平衡，则不应使用\
  \ `Accuracy`，因为它可能会提供非常有误导且不准确的准确值。\n\ne. 在这种情况下，`Misclassification rate (error\
  \ rate) = 1- accuracy or 0.188`\n\nf. 这是一篇关于 recall/precision 以及 specificity/sensitivity\
  \ 的良好总结文章 ¹⁵\n\n![](img/image-FQQNKKAZ.png)\n\nSensitivity and Specificity (StatQuest)\n\
  \n#### 5.4.4 ROC Curve Widget\n\n模型判别能力意味着分类模型区分不同类别或结果的好坏程度。如果判别得非常好，那么两个类别的分布将不会重叠。在图\
  \ 5.20 中，右侧的曲线（真阳性）与左侧的曲线（真阴性）重叠，因此没有完美的判别，这是分类问题的典型情况。重叠区域表示假阳性和假阴性。\n\n接收者操作特征\
  \ (ROC) 曲线可以追溯到第二次世界大战，当时他们需要确定雷达是否准确识别了敌人目标。ROC 曲线比较 Y 轴上的 `TP rate (TPR) (100\
  \ x TP/TP + FN)` 与 X 轴上的 `FP rate (FPR) (100 X FP/FP + TN)`。（`FPR` 等于 `1- specificity`）。`Specificity\
  \ = TN/TN + FP`。记住 `sensitivity (recall)` 和 `specificity` 存在权衡。图 5.21 显示了一个典型的 ROC\
  \ 曲线。ROC 曲线位于左上角是合理的，因为这样具有高灵敏度和低假阳性率。\n\n图 5.22 显示了曲线下的面积 (AUC)，它是大多数二分类模型首选的性能指标。有些人使用\
  \ `AUROC` 术语，但也被称为 `C statistic`（一致性统计量）。`AUC` 代表了所有特异性取值下灵敏度的平均值\n\n![](img/image-TEQQC78A.png)\n\
  \n图 5.20 左：`TP` 的分布，`TN` 的分布\n\n\n\n\n\n图 5.23 显示了心脏疾病数据集的平衡 PRC（精确率-召回率曲线）。该曲线评估了正类预测中正例的比例，如果\
  \ `recall`（召回率）和 `precision`（精确率）都很高（接近 1），则曲线将位于右上角，它是 `AUC` 的镜像。其 `AUPRC = 0.90`\
  \ ¹⁹-²¹\n\n如果你的数据集是不平衡的（例如 Kaggle 中风患者数据集，其中非中风患者与中风患者的比例为 20:1），那么曲线看起来就像图 5.24\
  \ 所示，位于图表的下部。`AUPRC = 0.19`。本章后面将介绍关于该主题的更多内容。\n\n### 5.4.6 其他有用的 Orange 曲线\n\n\
  Orange 确实提供了了一些额外的选项来查看敏感性（sensitivity）与特异性（specificity）之间的权衡，以及敏感性（`recall`）与精确率之间的权衡。在校准图（calibration\
  \ plot）小部件中，你可以在 `Metrics`（指标）下选择“敏感性与特异性”曲线，以及“精确率与召回率”曲线。这里有一个垂直阈值滑块，你可以调整阈值以实现你所需的敏感性和特异性之间的权衡。图\
  \ 5.25 显示了带有阈值滑块的敏感性和特异性曲线。使用滑块时，你可以看到随着阈值的增加，敏感性降低而特异性增加。图 5.26 显示了带有滑块的精确率与召回率对比图。随着阈值的增加，敏感性（`recall`）降低，而精确率增加。\n\
  \n![图 5.23 平衡数据的精确率-召回率曲线从图 5.25 和图 5.26 可以看出，敏感性与特异性之间、以及敏感性（`recall`）与精确率之间存在权衡。图\
  \ 5.27 显示了不同阈值下 `recall`、`precision`、`accuracy`（准确率）和 `F1 score` 之间的关系。注意 `accuracy`\
  \ 在高阈值下会趋于平缓。在此参考中可以找到 `AUROC`、`recall`、`precision` 和 `F1` 的交互式模型²²### 5.4.7 提升曲线（Lift\
  \ Curve）提升曲线是查看模型性能的另一种方法，但我们不再进一步探索。提升曲线是一种图形表示，用于衡量预测模型与随机猜测相比的改进程度。它最常用于营销行业，以评估营销活动和客户群定位。###\
  \ 5.4.8 校准图（Calibration Plot）此图显示了数据集中每行预测的概率。风险预测模型经过良好的校准至关重要。该图评估了预测风险与实际概率之间的拟合优度。²³\
