  验证测试和离表的优化实验设计 (DOE)\n\n表 12.3 显示了自由开源软件在执行表 12.1 所示的第 3 到 10 项常见六西格玛分析任务的能力。`10`\
  \ 分代表软件执行所描述任务的能力为 100%。`10` 分也定义了高端商业软件（如常用于六西格玛项目的 `Minitab` 和 `SAS 的 JMP`）的六西格玛分析能力。\n\
  \n根据 `iSixSigma.com` 的研究，六西格玛带来的收入百分比节省在 1.2% 到 4.5% 之间。这些数据来自 `Motorola`、`AlliedSignal`、`GE`、`Honeywell`\
  \ 和 `Ford Motor Company` 的记录节约，这些公司是六西格玛早期且严谨的采用者。这些公司在 1986 到 2000 年间发明并完善了六西格玛。⁵²\
  \ 美国质量协会 (`ASQ`) 表示，在过去的 20 年里，六西格玛为财富 500 强节省了约 4270 亿美元。⁵³\n\n### 12.4.2.1 与数据科学的集成机会\n\
  \n六西格玛的未来准备与数据科学技术 (`ML/AI`) 进行变革性的整合。考虑以下集成机会：\n\n*   **与 DMAIC 集**：`DMAIC`（定义、测量、分析、改进和控制）是六西格玛的核心方法。数据科学技术可以集成到\
  \ `DMAIC` 的每个阶段，以增强数据分析、预测建模和过程优化。⁵⁴\n*   **复合角色**：有机会结合六西格玛黑带和无代码数据科学家的角色。这种复合角色可以利用六西格玛的统计和过程改进专业知识，结合数据科学的数据分析和建模技能。⁵⁵\n\
  *   **成功的案例研究集成**：案例研究已显示精益六西格玛与数据科学方法的成功集成。此类集成的成功在于，两种方法论都支持通过数据分析对真相进行严格探索。⁵⁶\
  \ - ⁵⁸\n*   **技能开发与培训**：为了有效整合六西格玛和数据科学，为员工提供培训和认证计划非常重要。这确保了……\n*   **AI 聊天机器人作为协作团队**：AI\
  \ 聊天机器人具有成为任何团队不可或缺贡献者的潜力。\n\n表 12.3 开源软件的关键 Sigma 能力\n\n```\n(images/image-BZR4FK.jpg)\n\
  ```\n\n### 12.4.3 精益 / 改善 (Kaizen)\n\n精益（Lean）由丰汽车公司在 20 世纪 40 年代在日本建立，旨在简化运营。创建了一个缩写来记忆八种浪费：`TIMWOOD`，分别代表运输\
  \ (`Transportation`)、库存 (`Inventory`)、动作 (`Motion`)、等待 (`Waiting`)、过量生产 (`Overproduction`)、过度加工\
  \ (`Overprocessing`)、缺陷 (`Defects`)。今天，`S` 也被添加到 `TIMWOOD` 中，代表未充分利用的技能 (`Skills`)。\n\
  \n如今，四个与精益相关的协会（制造工程师学会 - `SME`、制造卓越协会 - `AME`、`石井研究所` 以及美国质量协会 - `ASQ`）汇聚在一起，并对不同级别的精益知识体系文件达成共识。⁶¹\
  \ `ASQ Quality Press` 还出版了一本书《精益手册 - 铜级认证指南》，以记录精益通常实践方式的细节。\n\n该铜级层级的文本挖掘词云（见图\
  \ 12.6）显示，该知识体系中最常用的三个词根词是 `system`、`measure` 和 `process`。\n\n```\n(images/image-VJQ5EI43.jpg)\n\
  ```\n\n图 12.6 精益知识体系词云\n\n精益还包含一个名为 `Kaikaku` 的创新要素，它源于丰田生产方式 (`TPS`)。与 `Kaizen`\
  \ 不同，Kaikaku` 是革命性的，旨在实现组织的根本性改进或变革。精益思想可以从根本上减少任何过程中的浪费和等待。\n\n\n\n\n\n### 12.4.3.1\
  \ 与数据科学的集成机会\n\n精益/持续改进的未来包含了与数据科学技术（ML/AI）的集成。考虑以下集成机会：\n\n- **数据驱动的问题解决**：数据科学技术通过提供有关流程低效、瓶颈和浪费的实时数据，支持精益/持续改进的问题解决。\
  \ ⁶⁵\n- **实时监控与控制**：数据科学技术（如实时数据分析和机器学习）可监控流程、检测异常、预测故障，并主动标记需要精益/持续改进的操作，以维持流程的稳定性和质量。\n\
  - **预测性维护**：数据科学可以与精益/持续改进结合实施预测性维护策略。通过分析历史数据和传感器读数，组织可以预测设备故障、优化维护计划并最大限度地减少停机时间。\n\
  \n- **价值流图**：数据科学可用于分析和可视化所有感兴趣的价值流性能指标，识别浪费区域和改进机会。\n\n- **通过数据分析实现持续改进**：数据科学可以通过分析来自客户反馈、生产数据和质量指标等各种来源的数据，识别并优先考虑潜在的精益/持续改进项目。\n\
  \n- **AI 聊天机器人作为协作式 CI 团队成员**：AI 聊天机器人潜力成为任何团队中不可或缺的贡献者，特别是在参与自由形式脑风暴的团队。利用它们的能力可以激发新的思维方式，拓宽思想创新的范围。\n\
  \n![](img/image-QL2YXNQM.png)\n\n[图 12.7 精益工具和概念如何作为一个系统协同工作的层级本质](https://www.industryweek.com/operations/continuous-improvement/article/21144299/why-do-so-many-lean-efforts-fail)\n\
  \n![](img/image-ZOT0TLZK.jpg)\n\n图 12.8 典型改善活动的精益工具使用选项\n\n### 12.4.4 精益六西格玛\n\n\
  从 2001 年开始，咨询公司将六西格玛和精益技术相结合，形成了流行的精益六西格玛（Lean Six Sigma）方法。本书作者 Dave Patrishkoff\
  \ 从 2001 年开始在 Walters Industries 成功推广该方法，此后并在全球 60 多个不同行业的公司推广。当 Michael George\
  \ 在 2002 年出版了名为《精益六西格玛：结合六西格玛质量与精益生产速度》的书时，这一`LSS`运动获得了其正式的`LSS`名称。⁶⁶\n\n走向极端的六西格玛或精益本身可能会导致结果的失衡。例如，没有精益的六西格玛可能会导致高质量的产品和服务产生，但由于存在许多非增值流程，其成本可能过高。没有六西格玛的精益可能会导致快速生产具有大量昂贵缺陷的产品和售后。因此，这两种方法论结合的目标是以最低成本更快速地制造高质量的产品和售后。因此，精益与六西格玛的集成旨在快速、高效地交付卓越质量的产品和服务。图\
  \ 12.9 总结了结合精益与六西格玛的逻辑。\n\n`LSS`专业人员接受了如何在、何地以及何时应用其技能的培训。表 12.4 提供了关于何时应用改善、精益、六西格玛和`LSS`混合技术的简要解释。\n\
  \n#### 12.4.4.1 与数据科学的集成机会\n\n精益六西格玛（`LSS`）的未来将如前文六西格玛和精益/改善部分讨论的那样，与数据科学技术协同。精益与六西格玛之间的`LSS`协作提供了这些额外的创新改进机会：\n\
  \n- **集成的 LSS 项目识别与优先级排序**：与其孤立地评估精益/改善和六西格玛的性能数据，更有效的方法涉及这些数据集数据集。这种全面的视角允许对项目进行有效的优先级排序。\n\
  - **技能与问题的对齐**：在确定项目后，可以使用数据驱动的算法来建议团队成员在每个项目的最佳分配。这是基于一种匹配系统，将每个成员的技能与当前问题的特定需求对齐。这种集成不仅精炼了项目管理流程，还提升了团队性能。\n\
  \n![](img/image-SSDAF2F1.jpg)\n\n图 12.9 精益六西格玛：一种流行的混合持续改进技术\n\n表 12.4 何时以及何地应用`LSS`的各个方面\n\
  \n![](img/image-CTPWKMXB.jpg)\n\n### 12.4.5 预测建模\n\n虽然本书广泛涵盖了预测分析，但本节强调了无代码数据科学策略的转型潜力。这种方法可以比专注于编码技能的传统计划更快地产生大量的无代码数据科学家（`NCDS`）。它为各种规模的业务提供了所需的技术劳动力，以推动其工业\
  \ 4.0 的倡议，而这些倡议高度依赖于预测分析和人工智能。\n\n许多来源强调了全球范围内数据科学家的严峻短缺，这种供需差距是特定行业的。对数据科学家的需求激增，各部门的雇主都在努力满足这种日益增长的需求。这提供了一个机会，通过对已经精通精益六西格玛（`LSS`）的专业人士（如认证绿带、黑带和大师黑带）提供额外培训，来利用`NCDS`的未开发潜力。⁶⁷-⁶⁸\n\
  \n快速扩大数据科学家基础的明显方法是培训并聘用已经获得`LSS`绿带、黑带和大师黑带专家。这些`LSS`带已经接受了使用`Minitab`、`JMP`、`SigmaXL`和其他软件包包的深层次统计分析培训。\n\
  \n`LSS`专业人员通过`Minitab`、`JMP`、`SigmaXL`等工具拥有大量的统计培训，这使他们成为此类扩张的理想人选。全球六西格玛专业人员的准确数字尚不清楚，估计从\
  \ 2004 年的 150 万到 2016 年的 400 万到 500 万不等。⁶⁹⁷⁰ 利用这一现有人才库是快速扩大数据科学家基础以满足工业 4.0 要求的有效举措。\n\
  \n[图 12.10 展示了精益六西格玛与数据科学领域不同且重叠的目标。通过对 LSS 专业人员进行无代码数据科学的交叉培训，我们不仅缓解了当前数据科学家的短缺，还丰富了\
  \ LSS 专业人员的技能组合。这种双重优势增强了执行 LSS 任务的有效性，并通过增加 NCDS 能力拓宽了他们的理解。]\n\n![](img/image-TISBNJDC.jpg)\n\
  \n图 12.10 精益六西格玛（LSS）与数据科学领域不同且重叠的目标\n\n[图 12.11 展示了精益六西格玛与数据科学之间不同且共同的原则。这种重叠表明\
  \ LSS 专业人士拥有对于转型为 NCDS 角色有利的基础知识。他们先前的专业知识可以作为有价值的跳板，简化向 NCDS 角色的转变。]\n\n#### 12.4.5.1\
  \ 与其他 CI 计划的集成机会\n\n预测分析涵盖表格数据、文本和图像，具有增强许多人类任务的潜力，为知决策提供补充洞察。这种能力开启了理解的新水平，促进了在多个不同领域的创新和生产力，如下列表所示：\n\
  \n- 用于持续流程监控的实时分析\n- 用于提高效率的预测性维护\n- 供应链优化\n- 数据集成与集中\n\n\n\n\n\n* 识别瓶颈和流程改进机会\n\
  * 用于决策的增强智能\n* 在自由形式脑风暴活动中增加贡献\n\n![](img/image-J8GTPEZ4.jpg)\n\n图 12.11 六西玛精益（LSS）与数据科学的独特及共同概念\n\
  \n## 12.4.6 高可靠性组织 (HROs)\n\n高可靠组织（HROs）是指在危险条件下运行，同时保持极高可靠性和安全标准的企业或其他实体。这些组织创建了程序和惯例，有助于降低风险和防止错误。`HROs`\
  \ 的目标是尽可能减少可能导致非常不利和有害后果的通信错误。通信防错技术是 `HROs` 的关键组成部分。\n\n以下是一些使用 HRO 原则的示例：\n\n\
  * **医疗保健**：医疗领域的 HRO 旨在提高患者安全并减少护理交付过程中的错误。医疗 HRO 的示例包括医院、诊所和医疗系统。⁷¹ - ⁷⁴\n* **航空**：航空领域的\
  \ HRO 关注航空旅行的安全性和可靠性。航空 HRO 的示例包括航空公司、空中交通管制系统和飞机制造商。⁷⁵\n* **核能**：核能领域的 HRO 旨在防止事故并确保核电站的安全运行。核能\
  \ HRO 的示例包括电力公司和监管机构。⁷⁵\n* **军事**：军事领域的 HRO 关注军事行动的安全性和可靠性。军事 HRO 的示例包括特种部队部队、航空母舰行动、核潜艇行动、情报机构和后勤支持组织。⁷⁵\
  \ - ⁷⁶\n\n以下是对 HRO 原则和通信防错技术的解释：\n\n### 高可靠性组织原则：\n\n* **公正的 HRO 文化**是成为高可靠性组织（HRO）的关键组成部分。它涉及创建一种学习文化，让员工能够自由发言并报告错误，而不必担心受到报复。⁷⁷\n\
  * **对操作的敏感性**：HRO 对其系统和流程的状态有高度的警觉。他们积极监控并响应潜在的问题或异常，以防止错误的发生。⁷⁸- ⁷⁹\n* **不愿简化**：HRO\
  \ 承认工作是复杂的，可能会以意想不到的方式失败。他们避免过度简化，并接受其操作的复杂性，以识别潜在风险并防止错误。⁸⁰\n* **对失败的关注**：HRO 将险些性事故和失败视为学习和改进的机会。他们分析并调查失败，以识别根本原因并实施纠正措施，以防止未来发生类似事件。⁸¹\n\
  * **对专业知识的尊重**：HRO 重视并尊重员工的专业知识。他们鼓励开放沟通和协作，允许一线员工就安全性和可靠性提供建议并提出疑虑。⁸²\n* **韧性**：HRO\
  \ 具有韧性，能够从意外事件或失败中迅速适应并恢复。他们拥有稳健的应急预案和机制，以有效应对干扰。⁸³\n\n### 通信防错技术：\n\n* **标准化通信协议**：HRO\
  \ 建立标准化的通信协议，以确保团队成员之间进行清晰且有效的通信。这包括使用标准化的语言、格式和工具来共享信息。\n* **闭环通信**：HRO 推广闭环通信，即发送者确认接收者已正确理解了信息。这有助于防止误解和误传。\n\
  * **团队培训和沟通技能开发**：HRO 投入于团队培训计划和沟通技能开发，以增强通信有效性并减少因误传导致错误的概率。⁸⁴\n* **冗余和交叉检查**：HRO\
  \ 实施冗余和交叉检查机制来验证关键信息。这涉及让多个个人独立验证并确认信息，以最大限地减少通信错误的风险。\n* **技术的使用**：HRO 利用技术支持通信并减少潜在错误。这可以包括电子病历、条码扫描系统和关键信息的自动警报等工具。\n\
  * **使用 STAR（停止、思考、行动、回顾）流程进行自检**是一种用于各种行业（包括医疗保健）的自检技术，用于防止技能类错误并提高性能。⁸⁵\n* **三方复述\
  \ (3-Way Repeat Back)** 是一种用于各种行业（包括医疗）的通信技术，用于确保通信清晰准确并防止错误。⁸⁶\n* **音字母与数字澄清**：示例：A\
  \ = Alpha, B = Bravo, C = Charlie, D = Delta, E = Echo。⁸⁶\n* **交接时的 SBAR**：在与他人沟通问题时：定义状况（Situation）、背景（Background）、评估（Assessment）和建议（Recommendation）。\n\
  * **提问与解决**：\n  ![](img/image-TEMD15Y1.jpg) **提问**：HRO 鼓励提问和批判性思维，以识别潜在风险并防止错误。这涉及通过提问了解情况、识别潜在危害并评估最佳行动方案，以减少错误。\n\
  \  ![](img/image-TEMD15Y1.jpg) **解决**：HRO 旨在通过寻找解决方案或答案来解决问题或疑问。这涉及使用系统的解决问题方法，例如\
  \ `STAR`（停止、思考、行动、回顾）流程，以减少错误并提高性能。\n* **交叉检查**涉及相互监督和情情意识，以捕捉潜在的错误或危害。⁸⁷\n* **5:1\
  \ 反馈**：5:1 反馈比例强调五条正面反馈对应一条负面反馈。`5:1` 比例的目的是在建设性反馈与对优势及成就的认可之间建立平衡。⁸⁸\n\n### 执行\
  \ HRO 原则：为了将 HRO 原则落实到操作中，组织可以考虑以下步骤：⁸⁹\n\n* **评估现状**：评估组织内部现有的流程、系统和文化，以识别改进领域和潜在风险。\n\
  * **培养安全文化**：培养一种优先考虑安全、开放沟通和持续改进的文化。这包括促进对险些事故和错误的报告而不必担心报复，并鼓励积极参与安全倡议。\n* **提供培训和教育**：对员工进行\
  \ HRO 原则、通信技术和错误预防策略的培训。这包括领导力培训、团队培训和持续教育计划。\n* **实施标准化流程**：建立标准化的通信、决策和错误预防流程及协议。这有助于建立一致性并减少操作中的变异性。\n\
  * **监控和评估**：持续监控并评估 HRO 实践和通信防错技术的有效性。收集员工的反馈，跟踪安全指标，并进行必要的调整以提高性能。\n\n通过理解并实施 HRO\
  \ 原则和通信防错技术，组织可以提高其操作的安全性和可靠性，并减少错误和不良事件的发生。\n\n## 12.4.6.1 与数据科学的集成机会\n\n数据科学与高可靠性组织（HRO）通信防错任务之间的集成机会可以通过以下方式进行探索：\n\
  \n* **预测性分析**：利用机器学习根据历史数据预测通信错误。\n* **自动错误检测**：利用自然语言处理进行通信中的实时错误检测。\n\n\n\n\n\n\
  - **数据可视化**：以直观的可视化方式显示通信错误数据，以便识别问题区域。\n- **系统优化**：分析通信网络以发现并纠正瓶颈或频繁出现的错误点。\n-\
  \ **情感分析**：实施情感分析以识别风险的情绪基调，并根据需要改进这些通信。\n- **模拟与训练**：使用机器学习模型模拟错误场景以用于训练。\n- **实时监控**：开发系统用于通信信道中的即时错误检测和纠正。\n\
  - **决策支持系统**：创建数据驱动决策的智能系统，以减少错误。\n\n### 12.4.7 敏捷思维与瀑布思维\n\n`Agile Thinking` 和\
  \ `Waterfall Thinking` 术语代表了敏捷和瀑布项目管理系统所使用的对比性思维和方法。以下是它们的核心特质列表：⁹⁰-⁹²\n\n#### 敏捷思维：\n\
  \n- **灵活性**：敏捷思维强调适应能力，以及应对需求、优先级和市场条件变化的能力。\n- **迭代与增量**：敏捷思维提倡采用迭代和增量的项目开发方法，将工作划分为较小的迭代或冲刺（sprints）。\n\
  - **协作与客户为中心**：敏捷思维强调协作、与利益相关者的频繁沟通，并关注为客户交付价值。\n- **持续改进**：敏捷思维鼓励持续学习和改进的文化，通过定期的回顾和反馈循环来完善流程和结果。\n\
  \n#### 瀑布思维：\n\n- **顺序性与结构化**：瀑布思维遵循线性的、顺序的项目开发方法，具有明确的阶段，在移动下一个阶段之前必须完成当前阶段。\n\
  - **详细计划**：瀑布思维强调前期的规划和文档工作，在开始开发之前专注于定义需求和范围。\n- **可预测性与控制**：瀑布思维旨在通过遵循预定义的计划并尽可能减少开发期间的变更，来提供对项目的可预测性和控制。\n\
  - **强调文档**：瀑布思维重视全面的文档记录，以确保整个项目过程的清晰性和一致性。\n\n[图 12.12] 显示了基本的敏捷项目管理概念。敏捷流程对局部迭代和实验非常开放，以便在进入下一个流程步骤之前优化子流程。⁹³](#content0268.xhtml)\n\
  \n瀑布图（见图 12.13）假设一切都将沿着线性的活动计划顺利进行。项目的每个阶段在进入下一个阶段之前都已完成，且无法返回之前的阶段。\n\n在决定为项目使用何种方法论时，考虑敏捷思维和瀑布思维的特征，以及它们如何与项目需求、约束和组织背景对齐是非常重要的。对于需求不断演变、需要灵活性并关注协作和客户反馈的项目，敏捷思维通常更受青睐。对于需求明确、范围界定且需要可预测性和控制力的的项目，瀑布思维可能更为合适。\n\
  \n需要注意的是，敏捷和瀑布并不是互不兼容的，根据项目的特定需求，可以采用整合两种方法论组件的混合方法。混合方法旨在允许前期的需求定义规划和预算编制，同时在设计、开发和测试中采用更敏捷的方法。\n\
  \n![](img/image-2HFZKOXP.jpg)\n\n图 12.12 迭代的敏捷流程\n\n![](img/image-RJ3XDLNZ.jpg)\n\
  \n图 12.13 瀑布项目管理计划\n\n在选择敏捷还是瀑布时，考虑项目的特定需求、要求和约束非常重要。某些项目可能受益于敏捷的灵活性协作，而另一些项目则需要瀑布的结构性和预测性。\n\
  \n### 12.4.7.1 与数据科学的集成机会\n\n#### 敏捷方法论：\n\n- **在数据科学中融入敏捷最佳实践**：我们的迭代性质适应大多数情况。通过持续的完善和反馈循环，我们可以争取获得最优模型。⁹⁴\n\
  \n#### 瀑布方法论：\n\n- **数据科学集成**：由于其内在的不灵活性和顺序性，机会有限。⁹⁵\n\n### 12.4.8 级联风险管理 (CRM)\n\
  \n被称为 `Cascading Risk Management (CRM)` 的风险管理策略的目标是停止由内部或外部引发的危害在各个层级的复制。图 12.14\
  \ 显示了最具破坏性的危害是由内部引发的情况。\n\n级联风险是指单一风险事件可能引发一系列相关危害并导致级联效应的可能性。以下是一些要点：\n\n- 级联风险管理是一种风险管理方法，旨在防止多个层次上相似危害的重复。⁹⁶\n\
  - 当单个风险事件触发后续风险的链式反应，导致级联效应时，就会发生级联风险。⁹⁷\n- 级联风险管理涉及通过跨部门和多风险方法来识别和处理潜在风险。\n- 级联风险管理在系统性风险背景下特别相关，系统性风险源于系统和参与者之间的互连性，需要基于网络的方法。⁹⁸\n\
  \n[图 12.15] 显示了广流行的 SWOT（优势、劣势、机会和威胁）分析，该分析用于评估组织或项目中的风险。⁹⁹ 关于 SWOT 分析，它的魅力和重大缺点与其简单性是内在相连的。它体现了这样一种场景：坚持\
  \ `KISS` 原则可能变成一个陷阱，特别是当这种简单性越过自我毁灭性的浅浅化时¹⁰⁰\n\n作者创建的传统 SWOT 分析的现代改进版本包含了级联风险分析的元素，如图\
  \ 12.16 所示。这种方法不再使用通用 SWOT 分析模板进行通用且未分类的脑暴，而是鼓励团队跨六个级联层次进行详细的 SWOT 分析：领导层、文化、流程、绩效、关键问题的响应以及对领导层的反馈循环。\n\
  \n![](img/image-B8I9ZM9V.jpg)\n\n图 12.14 CRM 需要关注内部和外部的威胁\n\n### 12.4.8.1 与数据科学的集成机会\n\
  \n\n\n\n` 内部内容（关于 cascading risk management 和 AI Systems 的描述）**进行了深度排版。\n\n以下是排版后的内容：\n\
  \n[content]\n# 级联风险管理与数据科学的集成为增强风险分析和决策过程提供了多种机会。以下是一些潜在的集成机会：\n\n- **数据驱动的风险评估**：数据科学技术可以分析海量数据源，利用机器学习识别模式并提供风险评估洞察。\n\
  - **预警系统**：可以利用预测性分析和实时数据开发能够检测和预测级联风险的系统，从而实现主动管理。\n- **场景分析与模拟**：如蒙特卡洛模拟和基于智能体的建模等技术可以模拟风险情景，评估潜在影响并为决策提供支持。\n\
  - **数据融合与集成**：整合多源数据源可以获得风险的全局视图，有助于准确的评估和决策。\n- **可视化与沟通**：数据科学可以帮助开发交互式可视化方案和决策工具，增强风险意识和利益相关者之间的协作。\n\
  - **兵棋演习（War-Gaming）**：AI 具备生成涵盖内部和外部风险挑战的系列随机场景的能力。这些场景可以作为实战演练，使团队能够练习并完善其应对策略。\n\
  \n![](img/image-5LIO1IXS.jpg)\n\n图 12.16 级联 SWOT 分析模板\n\n## 12.4.9 AI 系统\n\n工业 4.0\
  \ 指的是数字技术融入生产过程，这得到了 AI 系统的有力支持。然而，服务业的工业 4.0 也需要 AI 系统的支撑。以下人工智能（AI）解决方案对于制造业和服务业的工业\
  \ 4.0 都是必要的：\n\n- **机器人/协作机器人**：在制造过程中，协作机器人（cobots）和 AI 驱动的机器人被用于操作自动化、提高生产力并提升效率。机器人和协作机器人可以使用医疗、酒店和零售等服务业领域，实现任务自动化并增强客户服务。¹⁰¹\n\
  - **物联网 (IoT)**：为了改进生产过程、跟踪设备性能并实现预测性维护，AI 算法被评估来自 `IoT` 设备（如传感器和执行器）的数据。¹⁰²\n-\
  \ **数字孪生**：AI 用于生成真实世界对象的数字孪生（或云端副本）。为了改进生产流程和产品质量，这些数字孪生可以应用于模拟、优化和预测分析。数字孪生可用于服务业以优化建筑性能、提高客户满意度并增加安全性。\n\
  - **增材制造与 3D 打印**：AI 算法通过简化增材制造和 3D 打印中的设计与制造流程，在加速原型开发和定制的同时降低成本。这些技术还可以为服务业生产定制物品，如牙科植入物和假体。¹⁰³\n\
  - **预测性维护**：预测性维护利用算法和传感器数据预测设备故障并安排维护任务，最大限度地减少停机时间并提高设备效率。预测性维护可用于服务业以增强建筑性能、节能并提高安全性。\n\
  - **计算机视觉**：AI 驱动的计算机视觉系统被用于制造过程中的质量控制、缺陷识别、物体识别和视觉跟踪。计算机视觉可用于服务业的人脸识别、安防监控和客户行为分析。\n\
  - **信息物理系统**：通过融合物理和数字系统，AI 算法可以实现制造过程的监控和改进。这些系统可用于服务业以优化建筑性能、节省能源消耗并提高安全性。¹⁰⁴\n\
  - **文本分析**：制造过程中产生的文本数据可以利用 AI 驱动的文本分析来获取洞察。这可能涉及单词识别、情感分析、自然语言处理 (`NLP`) 和签名验证。许多领域受益于质量保证、预测性维护和供应链优化。\n\
  - **图像分析**：工业运行过程中产生的数据可以使用 AI 驱动的图像分析工具进行分析和解读。计算机视觉、目标检测、图像描述是其中的例子。图像分析的应用还包括质量控制、库存控制。¹⁰⁵\n\
  - **物理与数字能力的互操作性**：工业 4.0 高度依赖互操作性，这意味着物理与数字能力的无缝对接。工业 4.0 面临许多挑战，包括技术复杂性、缺乏标准以及互操作带来的成本。¹⁰⁶\n\
  - **AI 聊天机器人**：AI 聊天机器人通过实现实时监控和预测性维护、增强客户服务、加速营销、优化供应链、协助培训、辅助脑风暴、确保质量控制和资源管理来改进工业\
  \ 4.0。¹⁰⁷\n- **小型语言模型**：通过在小型模型中使用 AI，可以提高工业 4.0 的效率、准确性和定制化。¹⁰⁸\n- **可持续性**：AI\
  \ 和增材制造通过仅使用所需的材料来减少浪费。\n- **质量保证**：AI 可以帮助对 3D 打印过程进行实时监控以识别并修正缺陷。\n- **供应链改进**：通过实现本地化生产并减少对物理库存的需求，增材制造结合\
  \ AI 可以简化并增强供应链。\n\n\n\n\n\n- 当将 AI 聊天机器人的输出用于团队问题解决活动或任何其他应用时，不能仅从表面接受它们。至关重要的是，AI\
  \ 系统提供的见解通常很有价值，但并非无一不可，并且可能会受到其训练数据的偏见影响。我们强烈建议在这些输出被认为具有可信度和可操作性之前，由领域专家对其进行彻底的审查和验证。这一验证过程有助于消除潜在错误，并使\
  \ AI 驱动的见解与人类的知识和判断保持一致。\n\n- 还应该考虑使用 AI 聊天机器人带来的潜在伦理和隐私影响。这些系统应始终以尊重同意和隐私的方式收集和利用数据。此外，系统在运行和决策机制方面必须保持透明，并在构建时能够消除任何形式的偏见和歧视。\n\
  \n- 仅强调 AI 聊天机器人益处而不探讨其潜在风险的文章、博客和其他其他公开访问的内容值得进行细致的审查。保持一种平衡的观点，承认这项技术固有的优势和挑战至关重要。\n\
  \n- AI 聊天机器人，特别是在整个互联网内容上训练的大型语言模型，可能并不总是符合特定组织的目标。通过定制聊天机器人使其从受信任的、组织特定的内部文档中学习，可能为给定组织内的独特应用产生更相关、更有效的结果。\n\
  \n- 这些免责声明强调了在交互和利用 AI 聊天机器人时采取警惕和谨慎方法的必要性。虽然这些系统可以提供有用的帮助和见解，但它们不应掩盖人类判断和专业知识的价值。\n\
  \n- 其他作者提到了其他不应忽视的风险和担忧。¹⁰⁹ - ¹¹¹\n\n## 12.4.10.2 制造业应用示例\n\n以下是 AI 聊天机器人应用潜力的全面列表。此列表受到上述与\
  \ AI 聊天机器人使用相关的风险和限制的影响：\n\n- **客户支持**：AI 聊天机器人可以处理客户查询，提供产品信息并协助故障排除。¹¹²\n\n- **流程自动化**：聊天机器人可以自动化重复任务，例如订单处理和数据输入，提高效率。¹¹³\n\
  \n- **质量控制**：聊天机器人可以分析来自传感器和摄像头的数据，检测产品缺陷或异常，增强质量控制流程。\n\n- **预测性维护**：聊天机器人可以监控来自连接设备和传感器的数据，预测设备故障并安排维护活动。\n\
  \n- **库存管理**：聊天机器人可以提供库存水平的实时信息，跟踪订单并生成采购订单，优化库存管理。\n\n- **生产辅助**：聊天机器人可以协助机器操作员，提供指导并回答有关机器或流程的问题。¹¹⁴\n\
  \n- **召回程序**：聊天机器人可以通过向员工和客户提供信息和指令来促进召回过程。\n\n## 12.4.10.3 服务业应用示例\n\n- **客户支持**：AI\
  \ 聊天机器人可以提供 24/7 客户支持，回答查询并解决问题。\n\n- **预约调度**：聊天机器人可以自动调度预约，为客户和服务提供者节省时间。¹¹⁵\n\
  \n- **销售协助**：聊天机器人可以根据历史数据和机器学习算法帮助客户筛选产品并做出购买决策。\n\n- **通知与更新**：聊天机器人可以通知员工和客户更新（例如送送状态和状况），改进通信并节省时间。\n\
  \n- **个性化推荐**：聊天机器人可以分析客户偏好和行为，提供个性化的产品推荐，增强客户体验。\n\n这些应用展示了 AI 聊天机器人如何能够在工业 4.0\
  \ 的制造业和服务业中简化流程、改进客户服务、优化运营并提高整体效率。如前所述，某些风险和限制仍然适用。\n\n## 12.4.10.4 提示工程\n\n提示工程是\
  \ AI 聊天机器人利用中的一个新兴且重要的方面，重点是开发有效的指令或提示词（prompts），以引导 AI 模型生成最相关且准确的响应。正如引用的关于提示工程的文章所述，这种方法需要精确的专业知识。¹¹⁶\n\
  \n在当今 AI 驱动的格局中，提示工程师是致力于优化与 AI 聊天机器人交互的组织所需的高价值资产，正如引用的博客所强调的，该博客也强调了提示工程师的重要性。¹¹¹⁷\
  \ 他们在调优模型以对特定查询做出极其准确的回方面发挥着至关重要的作用。\n\n提示工程的成功通常取决于迭代方法，这涉及到复杂性与效率之间的平衡。虽然可能为有效的提示工程建议各种策略，但一种被广泛接受的最佳实践是将全面的提示工程策略与更简单的方法进行测试和对比。评估结果的质量有助于在简单性、复杂性和相关性之间确定最佳平衡。\n\
  \n提示工程领域的大多数专家都主张进行大量的实验。迭代测试和完善提示词允许持续改进，从而实现用户与 AI 聊天机器人之间更精细的交互。在这里我们再次看到了数据科学实验的重要性，这些实验也可应用于改进\
  \ AI 聊天机器人交互和输出。通过接受 AI 这一不断演变的组成，组织可以与其聊天机器人系统实现更具深度、针对性且更有效的交互。以下是一些提供了创建成功提示词的各种详细建议的参考文献。¹¹⁸-¹²²\n\
  \n### 12.4.11 按需创新技术\n\n按需创新技术是指使组织或个人根据需要生成创新想法和解决方案的方法和途径。这些技术培养创造力和解决问题的能力，以满足特定的创新需求和目标。\n\
  \nIdeation International 的按需创新专家多年来创建了各种复杂的创新软件。¹²³ 这些专家强调了一种任何人都可以应用的脑风暴优化技术，如图\
  \ 12.17 和 12.18 所示。图 12.17 显示了基本的脑风暴困境，脑风暴引导者通常在短时间内产生巨大的产出，之后引导者必须向参与者施压并“挤压”以获得更多想法。\n\
  \n```markdown\n![](img/image-NN2UE177.jpg)\n```\n\n图 12.17 典型的脑风暴活动输出曲线\n\n图 12.18\
  \ 展示了熟练的脑风暴引导者在活动中遇到想法枯竭阶段的方法。他们微妙地将脑风暴会议的焦点转移到当前问题的另一个方面，为参与者提供恢复其内部创新引擎的机会，以产生新的想法。一个胜任的引导者会为此类情况做好准备，配备了几个脑风暴主题，每个主题代表为活动定义的原始问题的不同部分。\n\
  \n\n\n\n\nIdeation International, Inc 是一家成立于 1992 年的美国公司，是开发软件领域的全球领导者，帮助机构和个人满足按需创新的核心需求，并辅以教育计划和分析服务¹²³\
  \ Ideation International 最近通过 AI 聊天机器人与其开源软件 `Express 创新情境问卷 (EISQ)` 的融合，推出了一种突破性的方法。`EISQ`\
  \ 像一个数字侦探，细致地向问题解决者索取信息，在创新过程展开之前对问题建立全面的理解。随后，这些信息被合成为一个“超级提示词（Super Prompt）”包发送给\
  \ `ChatGPT`，后者会迅速给出多个创意解决方案。\n\n这种独特集成的试验凸显了“超级提示词”的变革力量，将 `ChatGPT` 的输出提升到与经过培训的创新大师所产出无无拟的质量。相反，如果没有这些\
  \ `Super Prompts`，结果明显不够精炼，这强调了它们在提高建议质量方面的关键作用。\n\nIdeation 将 AI 聊天机器人与 `EISQ`\
  \ 融合不仅是一种进化，更可能证明是解决问题的一场革命，其即时输出质量足以媲美顶级创新问题解决大师。Ideation International 提供的这一开源系统为创新者和问题解决提供了一个新平台，可以在此进行快速的问题解决实验测试¹²⁴\n\
  \n与按需创新技术相关的资源和方法包括：\n\n*   “按需创新：使用 TRIZ 开发新产品”：这本由 Victor Fey 和 Eugene Rivin 编写的书籍探讨了\
  \ `TRIZ` 方法论，该方法利用从成功的专利发明中提取的创造性原理促进创新想法的产生。¹²⁵\n*   “按需创新所需的一切知识”：这篇文章提供了对创新艺术的见解，并强调了诸如`苏格拉底教学法`等方法在培养创新思维中的重要性¹²⁶\n\
  *   “按需创新：根据人才选择人员时，获取随取随创新。获得这 8 个巨大优势”：该资源讨论了为创新团队选择有才的人的优势，以确保按需创意和想法的持续流。⁶\n\
  *   “如何‘按需’创新”：这篇 LinkedIn 文章探讨了经常导致新颖成功产品的五种模式（减法、除法、乘法等）。¹²⁷\n\n![](img/image-31NUALUX.jpg)\n\
  \n图 12.18 改进后的脑风暴活动输出曲线\n\n*   `蓝海战略`是一种业务级战略，旨在通过价值创新创造竞争很少或没有竞争的新市场空间。它是关于创造和获取未受竞争的市场，从而使竞争变得无关紧要¹²⁸\n\
  *   “精益创业：今天的企业家如何利用持续创新创造突破性成功的业务”：`精益创业`为各种规模业务的企业提供了一种持续测试其愿景、并在太晚之前进行调整和改变的方法，节省了花费在耗时业务规划上的时间¹²⁹\n\
  *   “创新者的困境：当新技术导致伟大公司失败时”：著名作家 Clayton M. Christensen 写的关于颠覆性创新的畅销经典¹³⁰\n*   Boris\
  \ Zlotin 和 Alla Zusman 著的《定向进化：哲学、理论与实践》，2001 年¹³¹\n\n上述资源为培养按需创新提供了不同的视角和方法论。根据特定需求、创新目标的背景以及组织文化来探索和适应这些技术是非常关重要的。\n\
  \n### 12.4.11.1 与数据科学的集成机会\n\nAI 聊天机器人可以通过多种方式增强脑风暴活动的输出：\n\n*   **想法生成**：AI 聊天机器人可以根据其海知识生成新想法，为脑风暴会议增加独特的视角。\n\
  *   **想法分类**：聊天机器人可以根据预设或学习的参数对想法进行分类和组织，使评审过程更高效。\n*   **实时事实检查**：它们可以现场验证信息，确保想法的可信和可行性。\n\
  *   **24/7 可用**：聊天机器人可以随时使用，为不同时区或有不同日程的团队成员提供灵活性。\n*   **文档记录**：AI 聊天机器人可以记录所有想法和讨论，确保想法不丢失，并使跟进过程变得简单。\n\
  *   **鼓励参与**：某些人可能觉得与聊天机器人分享想法更舒服，从而提高整体参与度。\n\n记住，虽然 AI 聊天机器人可以增强脑风暴过程，但确保它们作为支持性工具而非决策权威至关重要，以保持创意和创新中的人性化。正如与任何脑风暴输入一样，领域专家必须过滤想法以确保它们是行的。\n\
  \n![](img/image-6Q9F3RG4.jpg)\n\n图 12.19 红杉家族圈 - 图像来自 Bing Image Creator\n\n###\
  \ 12.5 红杉方法：通过协作力量建立业务韧性\n\n红杉树（也称为美洲杉）是我们星球上最古老、最大的生物之一，高度可超过 350 英尺，寿命可超过 2000\
  \ 年。红杉通过形成所谓的“家族圈”和林地茁壮成长，如图 12.19 所示。红杉的根系深度仅为 6 到 12 英尺，但它们通过向外延伸根部（距离树干达 100\
  \ 英尺）创造了抵抗强风和洪水的力量，它们的根可以与其他红杉的根交织在一起，增加了它们在强风和洪水期间稳定性¹³² 红杉仙圈是一种自然现象，当母树死亡时，新一代树从老树的根部发出，形成一个相互连接、共享营养和水的树圈。这些圈通常出现在被砍伐的古树树桩周围，可能包含几十棵与母树基因完全相同的树¹³³-¹³⁴\n\
  \n将业务想象成一群红杉树，每棵树代表驱动业务迈向工业 4.0 的策略的补充部分。正如通过交织的根共享营养的红杉一样，这些策略相互关联，相互增强。它们形成了一个有韧性的盾牌，在行业“风暴”中屹立不倒，助力业务增长。\n\
  \n*   **带对球的方针战略规划**：像圈中最高的树，这棵树定义了其他树生长的方向。对球过程就像吸收和利用阳光一样，有助于组织的每一层与整体战略愿景保持一致。\n\
  *   **六格玛与精益/持续**：像每棵树结实的粗树干。六格玛减少变异和缺陷，确保树木强壮健康。精益/持续识别并消除浪费（病变的树枝），促进更健康的生长。\n\
  *   **高可靠性组织 (HRO)**：充当树的外皮，提供保护层，免受有害外部影响。通过实现防错通信，它防止了阻碍成长的误解。\n*   **敏捷与瀑布思维**：代表树木的生长策略。瀑布思维类似于树的阶段性生长。敏捷代表迭代和适应性生长，像树向各个方向分枝，不断适应光照和空间。\n\
  \n\n\n\n\n- `级联风险管理`（`CRM`）就像红杉树林的根系。根部探索周围的土壤，识别潜在的威胁（如病虫害或不良土壤状况），并计划如何缓解风险，以确保树木的健康生长。\n\
  - 将`预测模型`（`Predictive Modeling`）想象成树将食物和水输送到最需要地方的方式。就像树木预测哪些分支需要更多养分并将其送到那里一样，业务中的预测模型利用信息来预测并应对未来的需求。它就像一个智能系统，在业务部门提出之前就知道在该哪里提供帮助。\n\
  - `AI 系统`（`AI Systems`）和`AI 聊天机器人`（`AI Chatbots`）就像树上的松鼠和鸟。正如这些生物通过传播种子帮助树木生长和适应，AI\
  \ 和聊天机器人通过自动化任务和共享信息来帮助企业，助力公司的增长和适应。\n- 最后，`按需创新技术`（`Innovation-On-Demand Techniques`）可以被视为树产生的新种子，是繁荣生态系统的生命线，就像确保森林再生的关键种子。通过利用前沿方法，我们可以为持续的创新和增长铺平道路，打造一个动态且持久的景观。\n\
  \n总之，正如红杉家族中的每棵树都对整个树林的健康和生长做出贡献一样，业务战略的每个元素都为组织提供了独特的优势。当它们整合并朝着共同目标一致时，可以极大地增强业务向工业\
  \ 4.0 迈进的进程。\n\n## 12.6 熟练程度\n\n以下是追求高工业 4.0 目标的组织示例，它们在工具使用的效率、复杂程度性能方面各异：\n\n\
  ### 低熟练度\n- **示例**：一家本地家具制造公司\n- 该企业利用基础计算机系统进行订单处理和库存管理，生产过程中的机械主要依靠人工操作。他们正处于工业\
  \ 4.0 采用的早期，通过自动化和先进数字技术提高效率具有巨大潜力。\n\n### 中等熟练度\n- **示例**：一家区域快递和递送服务公司\n- 公司使用\
  \ `GPS` 对包裹进行实时跟踪，拥有用于下单和跟踪的客户门户，并使用数据分析进行路线优化。然而，通过实施先进的 `AI` 和机器学习技术进行预测分析、使用自动驾驶车辆进行交付，或使用自动分拣和处理系统，还有提高效率和复杂性的空间。\n\
  \n### 高熟练度\n- **示例**：`特斯拉公司`（Tesla Inc.）\n- `特斯拉` 作为一家电动汽车和清洁能源公司，在追求工业 4.0 方面体现了高水平的效率和复杂性。他们在制造过程中利用先进的机器人和自动化技术，将\
  \ `AI` 用于自动驾驶技术，`IoT` 传感器用于实时车辆数据，并将`云计算` 用于数据存储和分析。他们不断创新并融合前沿技术以提高效率和性能。\n\n要在数据科学方面达到所需的组织熟练度，精通数据素养、机器学习素养和\
  \ `AI` 素养至关重要。图 12.20 展示了针对表格数据、图像分析和文本挖掘的数据科学素养的不同水平。通过本书，读者已经学习了如何通过数据科学技能培训结合免费开源软件工具的指导来获得这些能力。通过跳过对传统编码和编程的需求，同时教授数据科学的所有关键要素，可以大幅缩短这些培训周期。\n\
  \n随着组织向工业 4.0 目标转型，在更广泛的员工群体中培养基础和高级数据素养是必不可行的。这种深入的理解促进了与数据科学团队的协同合作，并确保数据科学在组织的持续改进中无缝集成。`无代码`（`no-code`）数据科学领域为快速增强组织的数据素养提供了可行途径，特别是对于针对工业\
  \ 4.0 标准的实体。`无代码`数据科学家可以为各种规模的组织提供宝贵的见解，对于那些没有资源从正式大学计划培养数据科学家的企业特别有益。\n\n![](img/image-OVCHBLSM.jpg)\
