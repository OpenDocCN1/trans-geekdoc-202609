  \n![](img/image-D1VZC3K2.jpg)\n\n### 图 2.50 R-squared 到 VIF 的转换图\n\n`VIF` 也可以进一步描述为一种数值混淆指标，随着识别共相关混杂变量特定细节变得越来越困难，该指标会大幅增加。混杂变量是额外的变量，当分析师试图确定与目标变量相关的预测变量短列表时，这些变量会给分析增加困扰。我们必须始终记住，相关性的存在并不保证因果关系的存在。理解相关性与因果关系的区别对于数据的准确解释和分析至关重要。它有助于避免仅根据观察到的相关性得出误导或错误的结论。以下是一些示例：\n\
  \n- 温度升高推高了冰淇淋的消费量也增加了晒伤的数量，但得出高冰淇淋消费量会导致晒伤是不错误的。⁴⁸\n- 假设你确定吸烟的母亲产下的婴儿体重较轻。你应该直接得出结论认为吸烟会导致低体重婴儿，还是收集其他变量的数据，以确定其他不健康的饮食和生活方式选择是否也导致了体重过轻的婴儿？\n\
