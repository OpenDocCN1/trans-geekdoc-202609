  \ `Box Plot (2)` 部件，并在上方窗口选择 `Salary in USD`，在下方窗口选择 `Job Titles`。\n\n![](img/image-TEMD15Y1.jpg)显示了哪四类类别？最低和最高薪资是多少？它们在统计学上存在显著差异吗？\n\
  \n图 2.110 显示了此前描述的 Kaggle 数据科学薪资数据集分析过程的 Orange 工作流。\n\n## 2.9.2 成熟度\n\n这里有三家零售商，每家都展示了不同水平的数据准备和处理成熟度，并分享了关于这如何影响其运营的见解。\n\
  \n### 低成熟度水平\n\n-   销售、库存和客户反馈采用手动输入，没有标准化流程。\n-   没有处理缺失数据、重复数据或离群值的系统。\n-   在线与店内销售数据之间的整合有限或没有。\n\
  \n![](img/image-7MAKXXDN.png)\n\n图 2.110 分析 2023 年数据科学家薪资的 Orange 工作流\n\n-   数据存储在碎片化的系统或物理记录中。\n\
  -   缺乏一致的数据格式和命名规范。\n\n### 中成熟度水平\n\n-   使用半自动化数据集成工具连接在线和线下销售。\n-   定期使用无代码工具或脚本来清洗、准备和转换数据。\n\
  -   建立了使用行业标准实践来处理缺失值、重复值和离群值的流程。\n-   引入了中心化数据库或云存储解决方案，以提高数据可访问性。\n-   初步尝试对数据进行分类和归类，以便检索和分析。\n\
  \n### 高成熟度水平\n\n-   完全整合的数据系统，在多个销售平台、仓库和供应链之间实现实时同步。\n-   专门团队或个人使用先进的无代码平台进行数据处理、准备和可视化。\n\
  -   具备强大的数据异常处理能力，利用无代码预测工具提供洞察和警报。\n-   与客户关系管理（CRM）系统无缝集成，以增强以客户为中心的数据分析。\n- \
  \  开发无代码仪表板和报告工具，以实现即时洞察和数据驱动的决策。\n\n通过强调无代码解决方案，企业可以将数据准备和处理过程民主化，让非技术利益相关者能够积极参与到这些阶段。\n\
  \n## 资源\n\n1. **Medium.com** - 数据科学文章通常非常有用且简洁。你可以关注数据科学、机器学习和人工智能的主题。每月支付 5 美元，Medium\
  \ 会筛选这些主题领域的文章，这是接收多个简短主题的绝佳方式。缺点是它们没有经过同行评审，因此偶尔会发布错误内容。\n\n2. **KDNuggets.com**\
  \ - 提供了大量关于数据科学主题的短文，还包含课程、数据集、教程等标签页。\n\n3. **OpenML.org** - 拥有超过 21,000 个数据集，其中心脏病预测数据集有多个版本，此外它还列出了数百次使用不同算法的数据运行，以查看它们在分类准确率方面的表现。例如，此页面详细描述了如何使用逻辑回归并对算法进行调整（超参数优化）以及最终的性能。缺点是大多数竞赛都使用了\
  \ ML 软件 `WEKA`，且许多数据集采用 `.arff` 格式。`WEKA` 是免费下载的，并提供轻松转换 `arff` 到 `CSV` 的选项。\n\n\
  4. **Google Dataset Search** - 是一个大型搜索网站。当输入“用于分类医学数据集”时，它返回了 100 条结果。\n\n5. **Kaggle\
  \ Datasets** - 截至 2023 年中，Kaggle 拥有超过 200,000 个可下载数据集。`Kaggle` 是一个数据竞赛网站，人们可以在那里竞争奖励，并在网上发布他们的模型、评论和解决方案。\n\
