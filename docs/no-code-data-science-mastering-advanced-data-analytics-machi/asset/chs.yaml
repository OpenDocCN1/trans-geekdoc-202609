  \ 的完美系数意味着数据与散点图中所示的最拟合-回归线完美对齐。`Spearman` 相关系数随着两个变量之间的散点图关系显示出不断增加或减少的直线或曲线（这不需要是线性的）而增加（正向或负向）。1.0\
  \ 的完美系数并不意味着数据在散点图上形成了一条完美的直线，而是意味着数据在一致地增加或减少。该系数对散点图中数据方向的一致性评分，并对线或曲线方向的任何变化或不一致进行惩罚。\n\
  \n`False Discovery Rate` (`FDR`) 被定义为“总发现数中假发现的预期比例”。⁴⁰ 该指标也被描述为“剔除那些看起来很好的坏数据”。⁴¹\n\
  \n\n\n\n\n文献中对于什么样的 `VIF` 水平被认为是临界值尚未达成一致。有人认为 `VIF` 达到四就是临界值。⁴³ 最常建议的最大 `VIF` 是五或十。⁴⁴-⁴⁶\
  \ 我们建议将五作为 `VIF` 的最大可接受水平。\n\n以下是如何解释 `VIF` 值的示例：\n\n- `VIF` 为 1 意味着回归模型中的特定预测变量与模型中所有其他预测变量之间没有相关性。\n\
  - `VIF` 为 `1.8` 意味着特定变量的方差（标准误差的平方）比该预测变量与模型中所有其他预测变量完全不相关时大 80%。⁴⁷\n- `VIF` 为四意味着当特定变量被用作目标变量时，它与模型中所有其他预测变量的\
  \ `R-squared` 值为 75%。\n- `VIF` 为五意味着当特定变量被用作目标变量时，它与模型中所有其他预测变量的 `R-squared` 值为\
  \ 80%。\n- `VIF` 为十意味着当特定变量被用作目标变量时，它与模型中所有其他预测变量的 `R-squared` 值为 90%。\n\n机器学习模型中的高\
  \ `VIF` 并不总是所有预测算法的问题，但高 `VIF` 确实会破坏特定算法的变量重要性排名。⁴⁷ `VIF` 可以通过 `JASP` 中的经典线性回归分析或逻辑回归分析计算，但无法通过机器学习算法计算。特定连续预测变量的\
  \ `VIF` 方程所示。⁴⁸\n\n![](img/image-PQJPLNV6.jpg)\n\n上述方程中的 `R-squared` 范围从 0 到 1。`R-squared`\
  \ 是当模型中的任何预测变量 `(x)` 被用作目标响应，而所有其他预测变量被用作该特定 `x` 变量的预测变量时的分析结果。必须对每个预测变量重复此计算以得出其\
  \ `VIF` 值。模型中最推荐的最大 `VIF` 值是 5。图 2.50 显示了广泛的范围以及使用之前所示的 `VIF` 公式计算出的相应 `R-Squared`\
  \ 值。这种 `R-squared` 与 `VIF` 值之间的图形转换图可以用于快速确定每个感兴趣预测变量的所有预测变量之间的 `R-Squared` 值。\n\
  \n![](img/image-D1VZC3K2.jpg)\n\n### 图 2.50 R-squared 到 VIF 的转换图\n\n`VIF` 也可以进一步描述为一种数值混淆指标，随着识别共相关混杂变量特定细节变得越来越困难，该指标会大幅增加。混杂变量是额外的变量，当分析师试图确定与目标变量相关的预测变量短列表时，这些变量会给分析增加困扰。我们必须始终记住，相关性的存在并不保证因果关系的存在。理解相关性与因果关系的区别对于数据的准确解释和分析至关重要。它有助于避免仅根据观察到的相关性得出误导或错误的结论。以下是一些示例：\n\
  \n- 温度升高推高了冰淇淋的消费量也增加了晒伤的数量，但得出高冰淇淋消费量会导致晒伤是不错误的。⁴⁸\n- 假设你确定吸烟的母亲产下的婴儿体重较轻。你应该直接得出结论认为吸烟会导致低体重婴儿，还是收集其他变量的数据，以确定其他不健康的饮食和生活方式选择是否也导致了体重过轻的婴儿？\n\
  - 某欧洲国家的人口出生人数与该国鹳的数量之间统计学显著的相关性 `p-value < 0.05`。我们应该直接得出鹳运送人类婴儿的结论，还是寻找解释这种相关性的其他因素，例如污染水平、保护工作以及该国家的其他因素。⁴⁹\n\
  - 2000 年至 2009 年间，缅因州的人均离婚率与人均人黄油消费量之间存在 99.26% 的相关性。⁵⁰\n\n之前列出的示例只是在为了寻求问题洞察而撒出大型数据挖掘网时可能出现的许多混淆和/或虚假相关性中的。领域专家需要参与高\
  \ `VIF` 以及预测变量与目标变量之间其他高相关性的分析过程，以防止分析跳向错误且可能尴尬的结论。\n\n## 高 VIF 会导致混淆和不准确的变量重要性排名\n\
  \n较高的 `VIF` 为我们提供了早期警示信号，说明我们有一组预测变量，它们将导致混淆的预测变量相关性以及需要揭开和解决的因果考量。让我们在 `JASP` 中进行多元回归，并在尝试理清哪些是最重要的预测变量时，观察哪些单个预测变量具有高\
  \ `VIF`。`VIF` 可以通过 `JASP` 中的经典线性回归分析或逻辑回归分析计算，但无法通过机器学习算法计算。特定连续预测变量的 `VIF` 方程所示。⁴⁸\n\
  \n![](img/image-PQJPLNV6.jpg)\n\n上述方程中的 `R-squared` 从 0 到 1。`R-squared` 是当模型中的任何预测变量\
  \ `(x)` 被用作目标响应，而所有其他预测变量被用作该特定 `x` 变量的预测变量时的分析结果。必须对每个预测变量重复此计算以得出其 `VIF` 值。模型中最推荐的最大\
  \ `VIF` 值是 5。图 2.50 显示了广泛范围的 `VIF` 值以及使用之前所示的 `VIF` 公式计算出的相应 `R-Squared` 值。这种 `R-squared`\
  \ 与 `VIF` 值之间的图形转换图可以用于快速确定每个感兴趣预测变量的所有预测变量之间的 `R-Squared` 值。\n\n![](img/image-D1VZC3K2.jpg)\n\
