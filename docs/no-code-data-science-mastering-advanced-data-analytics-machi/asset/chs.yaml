  \n图 2.37 差缩放选项 `1, 1]\n\n- **中心趋势** - 描述数据中心的统计量。中心有三种方法：\n- **均值** - 数据的平均值。例如，`(3+5+7+9+11)/5\
  \ = 7`。\n- **中位数** - 数据的中值。例如，`(3,5,7,9,11)` 的中位数是 7。\n- **众数** - 最频繁的观测值。例如，在 `(0,0,1,1,2)`\
  \ 中众数为 `1`。\n\n数据的散度量如下：\n\n- **范围** - 包括最小值和最大值之间的数字。例如，对于`(3,5,7,9,11)`，范围是 `11-3`\
  \ 或 `8`。\n- **方差** - 衡量数据点距离均值的距离。计算每个点与均值的差，平方，求和并取平均值。\n- **标准差** - 方差的平方根。\n\n\
  单变量分析意味着您使用标准方法探索单个随机变量：\n\n- **中心趋势** - 均值、中位数众数（`Feature Statistics widget`、`Box\
  \ Plot widget`）\n- **离散程度** - 标准差、方差（`Feature Statistics widget`、`Box Plot widget`）\n\
  - **尾部/偏度度量**（`Distributions widget`）\n- **正态性** - 用于判断数据集是否匹配钟形“正态”分布的统计检验。JASP\
  \ 通过 `Shapiro-Wilk test` 提供此类统计检验。\n- **频率** - 如直方图或帕托图所示。\n- **可视化** - 直方图、帕托图、茎叶图、箱线图、饼图、JASP\
  \ 雨云图、小琴图等。\n- 检验\n\n双变量分析意味着您使用标准方法比较两个变量：\n\n- 散点图（`Y-X Scatterplot`）\n- 二因素检验\n\
  \n多变量分析意味着您使用标准方法比较两个以上的变量：\n\n- 散点图矩阵、相关性矩阵/热图、BlueSky Statistics Web 图、平行坐标图、节点图、散点图上的多因素颜色或符号编码、JASP\
  \ Flexplots 和决策树。\n- 多因素检验\n\n图 2.39 显示了数据清洗和探索性数据分析 (EDA) 包含的高级步骤。\n\n\n\n\n\n\
  # 2.4 重大数据挑战\n\n## 2.4.1 维度灾咒\n\n包含约 100 个或更多特征或属性的数据集被称为具有高维度。高维度会导致模型复杂性增加，被称为“维度灾咒”。由于预测变量非常多，模型可能无法捕捉所有组合，导致“数据稀疏性”，进而引发过拟合。此外，在高维度情况下，例如\
  \ `k-nearest neighbors` 和聚类等算法所使用的距离度量可能会受到影响，因为这些方法是基于距离和接近性的。³⁷ 一个经验法是，受者（实例/行/患者）的数量至少应该是预测变量数量的十倍。例如，如果你在分类场景中有十个预测变量，那么你至少应该有\
  \ 100 个受者。这一经验法则在人工智能领域经常被打破，你可能拥有超过 1 亿个参数，但训练的图像却少于百万张。高维度是可以应用主成分分析（`PCA`）和其他降维方法的机会。减少预测变量或特征也称为“特征还原”。\n\
  \n## 2.4.2 多重共线性\n\n### 2.4.2.1 定义多重共线性\n\n虽然你希望预测变量与结果相关，但你不希望预测变量之间存在高相关性。这是应该避免的，特别是在线性模型中。例如，如果两个或多个预测变量（收入和教育）之间的相关性非常高，请不要在模型中使用这两个变量，因为这两个因素的信息被认为是冗余的。预测变量之间这种高度的变量相关性被称为“多重共线性”。多重共线性可能导致多元回归模型过于乐观且不准确，特别是对于统计模型而言，但某些机器学习预测模型也会受到负面影响。在经典统计模型中，如果方差膨胀因子（`VIFs`）大于\
  \ 5，则必须从模型中移除高度相关的预测变量。两个完全相关预测变量的例子是：数据集中存在两列，标记为：1. 每月就诊的吸烟患者比例和 2. 每月就诊的非吸烟患者比例。在这个示例中，可以安全地删除其中一个预测列，而不会丢失模型中的任何信息。\n\
  \n![](img/image-SMGB2V56.png)\n\n图 2.39 数据清洗和探索性数据分析步骤\n\n通常，机器学习算法对高 `VIFs` 不那么敏感，但记住多重共线性不是你的朋友。如果你在模型中保留高度相关的预测变量，你创建的变量重要性排名可能会变得非常有误导性。某些机器学习算法比其他算法对高\
  \ `VIFs` 更敏感，因此在模型筛选过程开始之前减少具有高 `VIFs` 的特征是最佳实践。例如，Ridge 和 Lasso 回归算法专门设计用于减少多重共线性，同时在欠拟合和过拟合模型之间寻找最佳平衡（正则化）。JASP\
  \ 机器学习模型可以自动确定最佳的正则化水平（在 JASP 中称为 `lambda`），以创建一个具有低误差指标的模型。Orange 则没有自动确定最佳正则化水平的方法。这将在后的第\
  \ 4 章中讨论。主成分分析（`PCA`）在创建新的非相关因子的同时，创建不含高度相关因子的更小模型。`PCA` 的缺点是创建的新因子（成分）不易解释。这些技术将在后续章节中进行更详细的讨论。\n\
  \n图 2.40 提供了多重共线性（相关的依赖预测变量）和无多重共线性（无相关的独立预测变量）外观的示意图可视化。\n\n数据集中无多重共性的例子（如图 2.40\
  \ 所示）是所有预测变量都是相互独立的。在这个示例中，预测变量（`X1` 到 `X6`）与目标变量（`Y`）具有不同程度的相关性，表现为与目标变量的重叠程度较高，但它们之间不相关（X\
  \ 之间没有重叠）。预测变量之间缺乏相关允许我们识别每个独立预测变量对目标变量变化可能产生的独特贡献。`Y` 的预测变量重要性排名将清晰地定义、可解释且易于向他人说明。我们希望预测变量与\
  \ `Y` 目标相关（重叠），而不是彼此相关。\n\n数据集中存在多重共性的例子（如图 2.40 所示）是至少有一些预测变量相互相关，因此被视为依赖预测变量。各种预测变量之间存在的这种相关性使我们无法识别每个依赖预测变量对目标变量变化可能产生的独特贡献。某些\
  \ ML 模型可以以模型可解释性的代价来处理多重共线性。某些模型用例可能不关心可解释性，但它们对许多其他用例可能很重要。这些预测变量（`X1` 到 `X6`）也与目标变量（`Y`）具有不同程度的相关性，但它们之间也具有不同程度的相关性（X\
  \ 之间叠加）。这些 X 被称为依赖变量。由于预测变量的混杂性质，它们对于 `Y` 的预测重要性排名更加混乱、难以解释且更难向他人说明。多重共线性还会损害某些\
  \ ML 算法的准确性。在图 2.40 中，`X1` 和 `X3` 分别与 `X2` 相关。`X4`、`X5` 和 `X6` 相互相关。预测变量之间的相关水平（重叠）越高，提供给模型的冗余信息就越多³⁸\n\
  \n![](img/image-LA23CFBC.jpg)\n\n图 2.40 无多重共性和多重共性的视觉示意图\n\n**关键点：** 多重共线性在机器学习中不是你的朋友。它有时会降低所选算法的准确性，并阻碍你为模型最终变量创建可解释的变量重要性排名。\n\
  \n### 2.4.2.2 预测变量之间的相关性分析\n\nOrange 提供了 Correlation 小部件，用于计算两个变量之间的 Pearson 或 Spearman\
  \ 相关系数。当 Correlation 小部件连接到 Data Table 小部件时，将为每对因子计算并显示虚假发现率（`FDR`）。Correlation\
  \ 小部件用于确定单个预测变量与目标变量之间或单个预测变量之间的相关性。相关性分析的局限性是相关系数只能在两个变量之间计算。Scatter Plot 小部件也可以连接到\
  \ Correlation 小部件，以对所选变量对的相关性进行可视化。\n\n[图 2.41 显示了一个扩展的相关性工作流，其中目标变量的预测排名可以与感兴趣变量对的相关水平（使用\
  \ Pearson 或 Spearman 相关系数）进行比较。Select Columns 小部件放置在 File 小部件和 Correlation 小部件之间，以便在初步的多重共线性测试中仅选择预测变量进行相关性分析。]\n\
  \n\n\n\n在多共线性分析中，我们只感兴趣研究预测变量之间的相关性。当为了分析收集了大量变量时，多个变量之间相互相关是非常常见的。`Correlation`\
  \ 小部件将测试因素的所有可能组合的相关性，并将它们列在表格中，相关系数可以从高到低或从低到高进行排序。这些系数的范围从 -1 到 +1；负值表示负相关，正值表示正相关。对于相关系数的绝对值，通常接受的解释如下：\n\
  \n* 0.00 to 0.09: 无相关或相关性忽略不微\n* 0.10 to 0.39: 弱相关\n* 0.40 to 0.69: 中度相关\n* 0.70\
  \ to 0.89: 强相关\n* 0.90 to 1.00: 极强相关\n\n记住，这里列出的这些定义相关程度的截断点是任意的，有时存在争议，且应谨慎使用。例如，根据截断点的定义，相关系数的值只需变化\
  \ 0.01 就会被提升或降至另一组。此类解释应谨慎使用，因为这些解释的理论、实践以及临床或操作上的意义之间可能存在冲突.³⁹。\n\n![](img/image-PDJ7VF6V.jpg)\n\
  \n图 2.41 相关分析与可视化工作流\n\n* `Pearson` 相关系数测试两个变量之间的线性关系。随着两个变量之间的散点图关系偏离散点图中所示的最拟合回归线的程度越小，相关系数就会增加（正向或负向）。1.0\
  \ 的完美系数意味着数据与散点图中所示的最拟合回归线完美对齐。`Spearman` 相关系数随着两个变量之间的散点图关系显示出不断增加或减少的直线或曲线（这不需要是线性的）而增加（正向或负向）。1.0\
  \ 的完美系数并不意味着数据在散点图上形成了一条完美的直线，而是意味着数据在一致地增加或减少。该系数对散点图中数据方向的一致性评分，并对线或曲线方向的任何变化或不一致进行惩罚。\n\
  \n* `False Discovery Rate` (`FDR`) 被定义为“总发现数中假发现的预期比例”。⁴⁰ 该指标也被描述为“剔除那些看起来很好的坏数据”。⁴¹\n\
  \n**KEYPOINT**: 随着两个变量之间的关系变得越线性，`Pearson` 相关系数越高。如果两个变量之间存在一致的上升或下降趋势，且上升或下降趋势线没有反转，则\
  \ `Spearman` 相关系数越高。\n\n图 2.42 显示了 `Correlation` 小部件中体脂百分比数据集预测变量的 `Pearson` 相关系数的配对和排序因素相关性输出，以及\
