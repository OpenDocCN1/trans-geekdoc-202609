  \n图 2.21 到 2.23 显示了马赛图（见图 2.21）、散点图（见图 2.22）和分布图（见图 2.23）如何显示分箱数据。\n\n![](img/image-QMR2KF3Y.png)\n\
  \n图 2.21 从 Mosaic Display 创建的自动计算箱\n\n![](img/image-9EFCUIT.jpg)\n\n图 2.22 等频箱的散点图输出\n\
  \n![](img/image-LRY45KUA.jpg)\n\n图 2.23 等频箱的分布图输出\n\n\n\n\n医疗和呼叫中心数据通常呈现右偏，这可能对假设正态分布的统计方法（如\
  \ `t-test` 和 `ANOVA`）产生问题。实验室测试和客户通话时间数据往往呈现右偏（正偏态），因为它们不会向左偏，且结果不会低于零。³³ 最常用的变换之一是\
  \ `log transform`，它在 `Orange Feature Constructor` 小部件中可用，该组件允许你手动向数据集中添加特征（列），以便对数据进行各种变换，例如\
  \ `Log` 变换以及许多其他变换。尽管许多统计教科书建议使用 `log10` 变换来处理偏态，但另一些书籍建议不要这样做，有证据表明这种变换会对模型产生不利影响。³⁴\n\
  \nOrange 之外还提供了幂变换，可以将非正态分布转换为正态分布，以提高具有偏变量分布模型的性能。³⁵\n\n![](img/image-XUQA5903.jpg)\n\
  \n图 2.24 前两个分箱糖尿病风险因素的散点图\n\n### 2.2.7 特征创建\n\n在由现有特征构建的数据集中添加新特征是非常常见的。`Feature\
  \ Constructor` 小部件可以添加数值、分类、文本以及数据/时间特征。例如，你可能想创建新的数值特征来对现有数值进行加、减、除或平方运算，但还有更多选项可用。还可以创建许多形式的条件表达式，例如：如果\
  \ `A` 大于 5 则使用 1，否则使用 0（零）。`Feature Constructor` 小部件的帮助部分提供了关于创建自定义特征的更多示例和说明，这些特征可能需要使用一些标准的\
  \ `Python` 数学符号。\n\n特征创建还可以用于从身高和体重列创建 `BMI` 列。领域专家可以根据其领域专业知识创建新特征。使用 `Feature\
  \ Constructor` 小部件创建新自定义特征的机会是无尽的。\n\n### 2.2.8 独热编码与 N-1 哑变量编码\n\n独热编码是将分类数据转换为多列数值数据的过程，这些数据由\
  \ 1（是）和 0（否）组成，以便在机器学习模型中进行更好的计算（机器可读）。不再使用显示动物物种的列，而是每种物种变成一个新列，并在列中使用 1（是）和 0（否）数值代码。这种技术将用于书中的数据练习。图\
  \ 2.25 显示了对动物物种列的编码。这些 0 和 1 列也被称为哑变量或指示变量。\n\n独热编码的问题在于，当创建的哑变量列数等于尚未拆分为单独列的列中的类别数时，会触发哑变量陷阱。这会导致建模中的多重共线性，意味着两个或多个因素之间高度相关。哑变量陷阱在\
  \ 6.2.4 节中也有讨论，多重共线性在 2.4.2 节中有更详细的讨论。独热编码数据对数据可视化有利，但要注意使用该格式进行统计或预测建模的缺点。\n\n\
  回归或预测模型中包含的所有因素都应该是相互“独立”的，这意味着它们之间没有高度相关性。这可能会导致统计分析的回归系数和 p 值计算错误，以及机器学习预测不准确。我们稍后将讨论如何使用\
  \ `Correlation` 小部件来识别高度相关的预测因子。\n\n![](img/image-XLJ2QYRB.jpg)\n\n图 2.25 独热编码\n\
  \n相互“独立”的，意味着它们之间没有高度相关性。这可能会导致统计分析的回归系数和 p 值计算错误，以及机器学习预测不准确。我们稍后将讨论如何使用 `Correlation`\
  \ 小部件来识别高度相关的预测因子。\n\n（注：由于原文后半部分存在大量重复和错误，译文已根据前半部分的逻辑流进行了清理处理。）\n\n\n\n\n- **提取日期**\
  \ - 一旦日期格式相同，其他考虑因素在分析中可能会很有用。您可能想为年份、月份和星期几创建单独的列。您可能想创建一个新列，表示从某个特定日期到当前日期之间的时间段。最后，您可能需要知道这是工作日还是周末，并且在分析中您可能需要当天的具体时间。\n\
  - **位置** - 数据集可能包含地址、县、州、地区、邮政编码或纬度/经度（`lat/long`）。必须决定需要什么级别的位置信息。您需要像 `lat/long`\
  \ 那么具体的，还是地区或邮政编码就足够了？将在后续章节中讨论地理编码，它将利用数据集中的此类额外位置数据。\n\n## 2.2.11 特征缩放 (Feature\
  \ Scaling)\n\n特征缩放是将数值变量置于相同的尺度上，这有助于算法计算，并且是某些算法强制要求的，例如线性回归、逻辑回归、人工神经网络、聚类算法和\
  \ `K-means`。例如，年龄和收入的尺度差异非常大，某些算法在评估哪些特征最重要时可能会偏于较大的数字。图 2.32 显示了 Orange 中可用的数值特征缩放选项，这些选项的解释列在该图下方。\n\
