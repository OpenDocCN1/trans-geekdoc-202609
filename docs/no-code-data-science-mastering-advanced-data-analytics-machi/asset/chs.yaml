  \n图 5.33 带有多项式最佳拟合线的残差图\n\n残差图非常有用，能够以清晰直观且易于解释的方式展示预测模型的准确性。\n\n# 5.5 解释模块 (EXPLAIN\
  \ MODULE)\n\n图 5.34 提供了我们在 8 步 DISCOVER 过程中当前位置的可视化表示。在此阶段，我们处于第七阶段，命名为：“向利益相关者有效解释模型洞察以建立信任。”本章将概述各种可视化技术，旨在以有效且易懂的方式展示预测模型的结果。\n\
  \n此解释模块通过从选项菜单中的“插件 (Add-ons)”下载来访问，因为它未包含 Orange 标准安装过程中。分析师的责任始终在于不仅要完全理解自己的分析，还要清晰地向那些极可能没有技术或分析背景的人解释他们的模型。Orange\
  \ 的解释模块并不是 Orange 中帮助解释模型的唯一部分，但它为补充模型解释性工作提供了一些创意解决方案。高级数据分析建模活动应该包含每个预测变量在预测目标变量时的重要性排序。\n\
  \n## 5.5.1 排序组件 (Rank Widget)\n\n排序组件是模型解释策略的重要部分，且易于理解。该组件不是解释模块的一部分，但与解释部分的组件非常相似。正如第\
  \ 2 章提到的，它为预测器排名提供了七种不同的评分方法。信息增益/互信息是一个基于数学推得的公式，用于确定获得的信息量。有关如何计算信息增益的更多信息，请读者参考这些参考文献。²⁵-²⁶\n\
  \n然而，排序组件不仅限于使用那七种评分方法对预测器进行评分。如图 5.35 所示，还可以要求排序组件显示多个学习器组件的特定分析排名，例如逻辑回归（带有 Lasso\
  \ 或 Ridge 选项）、随机森林或具有四种选项的梯度提升。可以为工作流中的每个分析选项添加一个独立的组件，以便将其结果与排序组件进行比较。有时，Orange\
  \ 需要一些帮助来确定应该包含在模型中的目标和预测值，这就是为什么在图 5.35 的工作流中添加了“选择列 (Select Columns)”组件。\n\n在随后的章节中，我们将解释这些学习器组件及其选项的区别。图\
  \ 5.36 显示，排序组件现在可以显示信息增益模型评分器，该评分器针对糖尿病数据集对各种分析算法及其选项特征的重要性排名。\n\n需要注意的是，排序组件和特征重要性（Feature\
  \ Importance）组件并不总是能在特定的分析组件（如逻辑回归）上协同工作。如果其中一个排序选项对于特定数据集不起作用，您应该尝试使用另一个合适的学习器组件。\n\
  \n![](img/image-XQ9F9EYZ.png)\n\n图 5.34 数据科学 DISCOVER 过程中的第七步\n\n![](img/image-CKQP9FTR.png)\n\
  \n图 5.35 将排序组件连接到各种分类组件\n\n![](img/image-HXGYDR21.jpg)\n\n图 5.36 逻辑回归及一组内置评分方法的排序组件结果\n\
  \n## 5.5.2 特征重要性组件 (Feature Importance Widget)\n\n特征重要性组件使用了“置换特征重要性”(permutation\
  \ feature importance)，这是一个适用于分类和回归的 Python 包。该包评估预测变量与目标之间的关系，以查看模型对其的依赖程度。以特定的感兴趣顺序打乱变量被称为“置换”。正如第\
  \ 4 章提到的，置换特征重要性会打乱列中的特征，并确定其对结果的影响（例如特征排名）。它可以用于分类或回归。其核心思想是：如果打乱（改变某一列中预测器的结果）导致模型性能显著下降，那么该预测器就是重要的。图\
  \ 5.37 显示了相关的 Orange 工作流。在图 5.38 中显示了基于 AUC 的特征重要性结果示例，但其他四个选项可用。冠状血管钙化数量是该方法下最重要的特征。在特征重要性组件中使用默认的\
  \ 5 次置换和 10 个顶部特征。与其他可视化组件一样，您可以选择结果并将其传递给数据表或其他组件进行进一步分析。请记住，结果与排序组件并不完全相同，且在不同算法之间可能会略有差异。图\
  \ 5.38 显示了每个预测器的误差条。\n\n图 5.39 显示了将特征重要性组件应用于回归问题的工作流，图 5.40 显示了该工作流在确定哪些预测因子与体脂率相关时的结果。图中包含了误差条。\n\
