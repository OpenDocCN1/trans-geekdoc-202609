  \n![](img/image-II1XRN9H.jpg) # 第 9 章\n\n# 地理定位\n\n“如果说地理学是散文，那么地图就是符号学”\n—Lennart\
  \ Meri\n\n“地理定位分析：将坐标转化为故事，点一个点”\n—GPT-4\n\n![](img/image-M6MTZISG.jpg)\n\n## 学习目标\n\
  \n阅读第九章后，读者应该能够：\n\n-   讨论使现代地理定位成为可能的几项技术的演变。\n-   描述地理定位如何应用于医疗和非医疗领域。\n-   讨论如何利用地理定位技术进行流行病和流行病学追踪。\n\
  -   引用几项使用地理定位的多行业倡议。\n-   列出并讨论提供地理定位显示的 `Orange` 小部件。\n\n## 第 9 章总结\n\n地理定位可视化和分析已成为一种不可或缺的工具，其线条已编织进我们研究项目和互联世界的复杂织锦中。对于普通消费者来说，这意味着可以轻松地定位到最近的咖啡馆、书店或应急服务。但它的影响远超个人使用。\n\
  \n在活跃的零售世界中，地理定位帮助通过量定制的消费者体验来绘制潜在市场的地图。在医疗保健领域，它为患者人口统计数据提供了具价值的见解，有助于追踪疾病爆发，并增强了全球和公共卫生策略的数据视化。\n\
  \n物流行业拥有复杂的货运网络，依赖地理定位进行实时追踪和路线优化而蓬勃发展。同时，农业部门利用它来监测作物健康、预测产量并优化灌溉。\n\n旅游和度假行业利用地理定位来提供定制化体验，根据旅行者的位置建议当地景点和隐藏宝藏。在金融领域，可以使用地理定位数据来增强保险风险评估、财产估值和欺诈检测。\n\
  \n这种扩散由于全球 GPS 系统的整合、无线网络以及智能手机的几乎全球普及而得到加强。随着各行业的演变，地理定位可视化和分析的应用将继续增长，说明了技术与不同领域实际应用的汇聚。\n\
  \n### 核心原则\n\n-   通过使用符号、颜色和阴影来直观地代表跨不同地理尺度的空间模式，地理空间制图增强了数据可视化。\n-   通过利用地理背景（这是传统可视化无法实现的），地理空间制图和分析可以独特地揭示模式和见解。\n\
  -   企业通过地理空间制图和分析，可以揭示传统可视化无法实现的模式和见解。\n\n## 9.1 引言\n\n地理定位在现代社会中非常流行，正如全球 GPS 系统、智能手机的普及所证明的。`Google\
  \ Maps`、`Waze`、`Yelp` 等应用。人们通常认为这种方法是所当然的，地理定位在世界范围内无处不在。\n\n在某些情况下，识别患者、疾病、爆发的地理位置是非常重要的。地理定位在流行病学和公共卫生领域已经使用了很长时间。最早的例子之一是\
  \ 1798 年 Seaman 对曼哈顿黄热爆发的报告。图 9.1 显示了 1854 年霍乱地图的一部分。被认为是病源的污染泵（地图上的 X）位于`Broad\
  \ Street`、`Cambridge Street`和`Wind Street`（现在的`Lexington Street`）的交叉处。\n\n![](img/image-9YK9ITWM.jpg)\n\
  \n**图 9.1 1854 年伦敦霍乱病例**\n\n约翰·斯诺创建了这张霍乱病例地图。他帮助关闭了一口受污染的水井，从而阻止了流行病。新的来源认为，斯诺在证明霍乱不是空气疾病方面发挥了作用。然而，他们也认为在公共卫生部门注意到`Broad\
  \ Street`水泵是元凶之后疾病就开始下降。\n\n许多数据源可以提供更准确的整体患者状况。医疗保健被认为仅占可改变健康因素的 10-20%，而其他 80%到\
  \ 90%被称为社会决定因素（`SDOH`）。`SDOH`包括健康行为/习惯、社会经济因素和环境因素。图 9.2 展示了不同的社会决定因素。\n\n社会决定因素可以通过`County\
  \ Health Rankings`等网站进行进一步探索，因此可以成为地理定位研究的一部分`County Health Rankings & Roadmaps`（CHR&R）是威斯康星大学人口健康学院的一个计划。该计划衡量美国\
  \ 50 州每个县的健康状况。\n\n## 9.2 练习\n\n### 9.2.1 使用合成数据进行地理定位\n\n\n\n\n\n为了演示，我们将使用由 Synthea\
  \ 生成的合成数据，因为它们的患者人口统计数据包含了 Orange 可以处理的经纬度对¹¹。虽然这是合成数据，但它们反映了马萨诸塞州实际的人口情况。我们已经生成了\
  \ 1000 多个合成患者，并想要可视化这些患者住在马萨诸塞州的哪里。在 Orange 中，可以使用 `Geocoding` 小部件将位置转换为经纬度，或者反过过来，将经纬度转换为位置。\n\
  \n第一步是从 `File-Share Chapter 9` 文件夹将 `Synthetic patients` 文件上传到 `File` 小部件中¹² 除了经纬度数据外，还有关于种族、族裔、性别、婚姻状况、医疗费用和医疗保险覆盖范围的列。将\
  \ `File` 小部件连接到 `Geocoding` 小部件。打开 `Geocoding` 小部件并选择第二个选项：`Decode lat and long\
  \ into regions.`。对于区域标识符（region identifier），选择 `STATE`。对于 `Identifier` 类型，选择 `US\
  \ State`。对于 `Administrative level`（行政级别），选择 `1st level subdivision.`。将此小部件连接到 `Geo\
  \ Map` 小部件并打开它。经度和纬度会自动选择，并选择 `Color = RACE` 以查看种族分布。注意，左下角有三个选项：`select`（提供鼠标悬停结果）、`pan`（移动）和\
  \ `zoom`（缩放）。\n\n图 9.3 显示了 Orange 工作流，图 9.4 显示了 `Geocoding` 小部件中的正确选择。图 9.5 显示了我们的查询结果。](#content0214.xhtml)\n\
  \n![](img/image-G06NH3XK.png)\n\n图 9.3 地编码工作流\n\n![](img/image-YU6078EK.png)\n\n\
  图 9.4 地编码小部件设置\n\n![](img/image-A19L8Y0G.jpg)\n\n图 9.5 马萨诸塞州按种族划分的患者地理位置\n\n接下来，我们将包含人口统计数据和经纬度对的合成患者文件与包含疾病（如糖尿病）的条件文件相结合。目标是查看糖尿病在特定位置是否存在集中现象。第一步是从\
  \ `File-Share` 站点将 `Patients with Diabetes.csv` 文件上传到 `File` 小部件中¹²。在第二个 `File`\
  \ 小部件中加载 `Synthetic Patients.csv` 文件以便它们进行合并。将两个 `File` 小部件连接到 `Merge Data` 小部件。一个连接器应为\
  \ `Data`，另一个为 `Data connecting to extra data.`。打开 `Merge Data` 小部件并选择第一个选项：`Append\
  \ columns from Extra data`，`row matching`（行匹配）选择应为 `Patient.`。图 9.6 显示了小部件的选择。\n\
  \n将 `Merge Data` 小部件连接到 `Data Table` 小部件并打开。滚动到 `Diagnoses` 列并点击表头对数据进行排序。高亮所有诊断为糖尿病的患者，并连接到另一个\
  \ `Data Table`，其中只会出现患糖尿病的患者。将第二个 `Data Table` 连接到 `Save Data` 小部件并保存为 `patients_diabetes_location.tab`。请查看图\
  \ 9.7 的 Orange 工作流。\n\n最后，将刚刚创建的文件上传到 `File` 小部件，并连接到 `Select Columns` 小部件。打开 `Select\
  \ Columns` 小部件并仅使用变量 `Diagnosis`、`LAT` 和 `LON`。将 `Select Columns` 小部件连接到 `Geocoding`\
  \ 小部件，然后连接到 `Geo Map` 小部件。打开后者小部件。图 9.8 显示了此数据识别出的 61 名患者的位置。显然，这是一个非常小的样本。然而，该过程指出了人们如何利用地理定位来显示多种慢性疾病患者或仅一种疾病患者的位置，如示例所示。\n\
  \n![](img/image-0VF95UGY.png)\n\n图 9.6 Merge Data 小部件设置\n\n![](img/image-RJWO824V.png)\n\
  \n图 9.7 合并选取文件的 Orange 工作流\n\n## 9.3 地理映射与地理分析的多行业应用示例\n\n为了获得洞察并改进运营，地理分析和制图在各种业务中变得越来越流行。以下是跨越多个行业的几个有趣示例：\n\
  \n1.  **农业**：农民使用 `GIS` 技术监控作物健康、改进灌溉并增加产量。地理分析有助于检查这些要素，以便有信地做出决策。地理制图用于构建田间地图，监测土壤成分和水分水平等各种因素¹³。\n\
  \n2.  **医疗保健**：地理分析用于绘制疾病传播图，并理解影响医疗保健的地理因素。例如，地理制图被广泛用于监控 COVID-19 病毒的扩散¹⁴。\n\n\
  ![](img/image-A8RLH55K.png)\n\n图 9.8 选定马萨诸塞州数据集中糖尿病患者的定位\n\n3.  **零售**：零售商利用地理制图寻找新店的潜在位置。他们通过查看人口统计信息、竞争位置和交通模式来确定新店位置以实现收入最大化¹⁵。\n\
  \n4.  **能源**：通过检查风模式和阳光照射等变量，地理分析可以帮助识别风力涡电机或太阳能电池板的最佳位置¹⁶。\n\n5.  **保护**：地理制图是保护主义者追踪濒危物种移动和分析栖息地的工具。他们通过检查这些迁徙和其他环境数据，可以更好地决定如何保护栖息地¹⁷。\n\
  \n6.  **保险**：为了评估特定区域自然灾害的风险，保险公司采用了地理制图。例如，他们可能会使用洪泛区地图为特定位置的物业建立保险价格¹⁸。\n\n7.\
  \  **娱乐**：地理制图用于增强现实游戏（如 Pokémon Go）以提供沉浸式游戏体验。真实世界地图包含在游戏中，玩家探索周围环境捕捉虚拟动物。\n\n\
  8.  **林业**：地理分析用于林业的可持续伐木作业，并追踪森林砍伐和森林健康。伐木者通过了解森林的发展和变化，可以减少对环境的影响¹⁹。\n\n9.  **海运**：地理分析被用于追踪和预测海运高风险地区的海盗活动。航运企业可以通过可能发生袭击的地方采取预防措施²⁰。\n\
  \n10. **考古**：地理制图在考古变得日益流行，用于发现和分析遗址。`LiDAR`（激光雷达）是一种工具，允许考古学家发现古代建筑的选址并生成高分辨率地图²¹。\n\
  \n11. **城市规划和智慧城市的创建需要空间制图和分析。** 这被应用于废物管理计划、公共交通路线优化、自然灾害响应规划以及交通流分析²²。\n\n12.\
  \ **航空**：地理分析用于航空设计优化路线以减少燃料消耗并减少延迟。航空公司通过实时研究风模式、天气和飞行流量来设计更有效的路线²³。\n\n13. **供应链与物流**：地理分析有助于供应链和物流的路线优化，从而降低燃料成本并加快交货。物流企业通过检查交通信息和天气模式为他们的送货车设计最有效的路线²⁴。\n\
  \n14. **旅游**：地理制图被旅行社用于提供个性化的旅行体验。他们可以根据这些兴趣规划游客可能感兴趣的景点、住宿和餐厅²⁵。\n\n15. **矿业**：通过检查地质数据，地理制图被用于定位潜在矿区。地理分析还有助于追踪采矿活动对环境的影响²⁶。\n\
  \n\n\n\n\n这些示例展示了地理映射和地理分析在多个行业中的各种应用方式，强调了它们在简化流程和为决策提供关键信息方面的重要性。\n\n# 9.4 将知识付实践\n\
  \n## 9.4.1 练习\n\n### 人类发展指数的地理定位\n\n人们也可以向 `Geocoding` 组件输入位置（例如国家或州），它可以投影经纬度信息和其他变量。在下一个练习中，我们将使用在\
  \ `Dataset` 组件中找到 `HDI` 数据集。`HDI` 代表人类发展指数，研究了 1990-2015 年间多个（188 个）国家的生活水平。双击 `HDI`\
  \ 数据集将其加载到 `Dataset` 组件并连接到 `Geocoding` 组件。打开组件并确保勾选第一个选项“将区域名称编码为地理坐标”。区域标识符 =\
  \ `Country`。标识符类型 = `country name`。连接到 `Data Table` 组件并打开它。注意 `HDI` 是降序排列的。经纬度已经建立。现在查看其他可用变量，如预期寿命、平均收入、教育等。现在连接到\
  \ `Geo Map` 组件并打开它。颜色 = `Life expectancy`。地图应该看起来如图 9.9 所示。除了预期寿命，还要查看其他数据点。\n\n\
  ![](img/image-GNM4D246.jpg)\n\n图 9.9 HDI 预期寿命数据的地理地图\n\n最后一个选项是将 `Geocoding` 组件连接到\
  \ `Choropleth Map` 组件。这会对目标区域（例如国家、州或地区）着色，而不是仅仅在国家地图上放置一个彩色点。打开 `Choropleth Map`\
  \ 组件并选择 `Attribute = Life expectancy`。`Agg = Mean`。下图 9.10 显示了工作流，图 9.11 显示了分级地图结果。\n\
  \n![](img/image-9MP60JXJ.png)\n\n图 9.10 地预期寿命寿命的工作流\n\n## 9.4.2 成熟度\n\n任何电子商务公司都可以利用地理映射和地理分析来增强客户体验并优化服务。以下是电子商务组织可用的三个分析成熟度关键水平：\n\
  \n### 基础级：商店可访问性与人口统计\n\n*   **商店映射**：绘制配送中心、仓库和供应商的地图，以理解网络并增强购物体验。\n*   **人口统计分析**：分析年龄、收入和购买习惯数据，以识别不同地区的产品需求。\n\
  *   **运输分析**：研究交付方法，以确定发货较快的区域。\n\n### 中级水平：实时库存与销售分析\n\n*   **库存追踪**：实时监控产品和人力，以实现高效的库存管理和快速订单履行。\n\
  *   **客流分析**：跟踪在线购物者行为，以发现热门产品和改进之处。\n*   **销售结果映射**：评估不同地区销售营销活动的有效性。\n\n### 高级水平：预测性分析与针对性营销\n\
  \n*   **需求预测**：使用历史数据预测产品需求，以实现最佳备货。\n*   **购买风险分析**：预测购买模式以制定针对性的营销策略。\n*   **精准营销**：根据人口统计数据和购买习惯设计活动，提供个性化的购物体验。\n\
  *   **数字可访问性**：优化跨不同地理位置的无缝访问。\n\n![](img/image-VRLMMGDU.jpg)\n\n图 9.11 HDI 预期寿命数据的分级地图\n\
  \n利用这些地理映射和地理分析水平可以显著提升电子商务的客户体验。随着技术的演进，公司进行适应和创新至关重要。\n\n## 资源\n\n1.  Amazon Location\
