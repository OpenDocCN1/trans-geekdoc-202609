  \n![](img/image-5A2Q6S2V.jpg)\n\n# 第 6 章\n\n## 监督学习\n\n“如果我们有数据，我们就看数据。如果我们拥只有意见，那就听我的吧。”\n\
  \n—Jim Barksdale，Netscape 前首席执行官\n\n![](img/image-M6MTZISG.jpg)\n\n### 学习目标\n\n\
  完成第六章后，读者应该能够：\n- 将分类和回归技术作为监督学习的主要类型。\n- 讨论算法与模型之间的区别。\n- 列举可以同时执行分类和回归的算法。\n-\
  \ 讨论相关性与回归之间的区别。\n- 描述多元线性回归与多项式回归之间的区别。\n- 描述构成简单线性回归方程的组成部分。\n- 比较 Ridge、Lasso\
  \ 和 Elastic net 正则化。\n\n### 第 6 章总结\n\n分类和回归是预测分析和监督学习的常用方法。Orange 的优势可以在特定数据集上同时运行多个分类和回归算法，因此在寻找最佳算法时很容易进行比较。在\
  \ Orange 中，从训练数据切换到测试数据以审查建模性能也十分方便。\n\n回归或分类分析可能是某些行业中更常用的分析技术。医疗领域经常使用分类进行诊断，而金融部门则倾向于使用回归进行股票预测。电子商务依赖分类进行推荐，而房地产则使用回归进行物业定价。在农业和制造业中，这两种技术都有着广泛的应用水平，正如数字营销利用分类进行客户细分、利用回归进行网站流量增长预测一样。\n\
  \n在分类分析中，预测结果是类别的。在回归分析中，预测结果是连续变量。简单线性回归寻求为单个 `x` 变量和 `y` 变量优化拟合回归线或曲线。多元线性回归涉及更多预测变量，这些变量可以是连续的，也可以是类别的。简单回归（1\
  \ 个预测变量和 1 个目标变量）最常用的方法是线性回归，但如果数据相关性是非线的，二次、三次及其他曲线拟合方法也是合适的。\n\n注意不要使用高阶多项式拟合对数据进行过度过拟合。为了追求最佳性能模型，也可以使用多种机器学习算法进行线性回归。本文还将讨论各种类型的正则化，例如\
  \ Lasso、Ridge 和 Elastic net 回归。回归的性能参数与分类不同，本章也对其进行了讨论。\n\n### 核心原则\n- 我们的 8 步 DISCOVER\
  \ 数据科学过程的所有方面都适用于监督学习。\n- 训练和测试数据的划分也适用于此处。\n- 始终在模型中添加多个算法和算法选项，并选择最好的。\n- 模型调优和数据科学实验在此至关重要。\n\
  - 始终注意欠拟合和过拟合。\n- 集成模型和 Orange 校准学习器技术可能会有所帮助。\n- 监督学习适用于表格数据、图像、语音、文本和其他数据领域的分析。\n\
  \n## 6.1 分类建模\n\n分类建模是机器学习中监督学习的一个基础部分。它涉及根据一组特征预测给定输入数据的正确标签或类别。分类模型使用带标签的数据进行训练，其中输入数据与已知类别标签相关。这些模型随后被用于对新的未见数据进行预测。\n\
  \n#### 6.1.1 引言\n\n分类建模是一种监督学习类型，这意味着你知道想要预测的二分类多分类结果。当结果是类别的时，被称为分类；而如果结果是连续的，则被称为回归。在监督学习场景中，模型将在带标签的数据上训练，例如入院与未入院、垃圾邮件与非垃圾邮件，或信用卡欺诈与非信用卡欺诈。这意味着领域专家已经对数据进行了标记。对于分类分析项目，必须有一个“地面真值”或验证并创建准确标签的方法。在无监督学习中，你分析的是没有标签的数据集，因此你希望算法通过观察数据发现有趣的分组、模式或聚类。\n\
  \n图 6.1 展示了机器学习分为监督和无监督学习，并反映了本书的章节结构。\n\n\n\n\n\n# 分类概述\n\n在分类任务中，你想要预测的结果是类别的（例如：是、否；（死亡、存活）等）。一个令人困惑的地方是，结果或类别通常是数值，例如\
  \ `1` 或 `0`，但它们被视为类别的，因为它们是离散整数，而不是像 `1.52` 那样的连续数据。按照传统，分类模型中的少数类被标记为 `1`，多数类标记为\
  \ `0`。在医学和许多其他行业中，少数类通常是感兴趣的类别，例如癌症、信用卡欺诈、制造缺陷、客户投诉等。现实情况是计算机计算需要 0 和 1，因此我们必须适应这一要求。\n\
  \n大多数分类模型都是二元的（两个选择）。然而，它可能涉及两个以上的类别，可以被视为多项式分类或多分类，并需要特殊的算法。多项式分类需要非线性函数将数据分离到最合适的不同类别。请访问资源部分获取有关此主题的更多信息。在本章中我们将处理二分类。\n\
  \n![](img/image-R8N9JJV9.png)  \n\n图 6.1 监督学习 vs 无监督学习\n\n分类是执行预测性分析最常见的监督学习方法，适用于医学诊断、医学影像应用、基因组学、垃圾检测、欺诈检测、客户流失、情感分析、网络安全和其他领域。相反，回归可能更多地应用于经济学、金融、药物剂量有效性、农作物产量、制造产率、房地产价值等领域。\n\
  \n对于分类问题，你可以使用旧的统计模型，如逻辑回归和朴素贝叶斯，或较新的机器学习算法，如 `SVM`、神经网络、提升树等。Orange 的一个确定特性是提供了多种算法和算法选项，并且你可以同时运行多个算法，以便为了筛选之目的比较它们的预测性能。许多人混用交替使用“模型”和“算法”这两个词，但这是危险的，因为这些术语在用法上存在巨大差异。模型旨在让许多算法相互竞争，以筛选出性能最好的算法。算法无非“无免费午餐定理”赛马中的一匹马，而模型允许这种比赛的发生。许多用于分类的算法也可以用于回归（见表\
  \ 6.1）。\n\n# 6.2 回归建模\n\n在本节中，我们将重点关注线性回归，但该主题属于“回归分析”这一更大的类别，其定义为“一组用于估计因变量与一个或多个自变量之间关系的统计过程”。¹\
  \ 如表 6.1 所示，许多其他算法也适用于回归，并应该在模型工作流中与 `Linear Regression` 组件进行竞争。\n\n## 表 6.1 用于分类、回归或两者的算法\n\
  \n| 算法 || 指示 |\n| --- | --- |\n| 线性, Ridge, Lasso 和 Elastic net 回归 | R |\n| 逻辑,\
  \ Ridge 和 Lasso 回归 | C |\n| 朴素贝叶斯 | C |\n| 决策树 | C,R |\n| 随机森林 | C,R |\n| AdaBoost\
  \ | C,R |\n| 梯度提升 | C,R |\n| Xgboost | C,R |\n| 神经网络 | C,R |\n| k-近邻 | C,R |\n\n\
  C = 分类 R = 回归\n\n## 6.2.1 线性回归\n\n“线性回归试图通过对观测数据拟合线性方程来模拟两个变量之间的关系。一个变量被视为解释变量，另一个被视为因变量。例如，建模者可能想使用线性回归模型将个人的体重与其身高联系起来。”\
  \ ²\n\n与分类不同，结果或 `Y` 变量是数值/连续的，例如成本、住院时长、心率、农产量、能量产量、汽车销售数量等。\n\n## 6.2.2 简单线性回归\
  \ (SLR)\n\nSLR 模型显示一个 `x` 变量是否与一个 `y` 变量相关，这就是它被称为“简单”的原因。SLR 的目的是创建一个散点图和一个生成的回归方程，描述最代表数据的最佳拟合线。\n\
  \n线性回归最佳拟合线的方程形式为 `Y = a + bX`，其中 `X` 是解释变量（预测变量或独立变量），`Y` 是因变量。线的斜率是 `b`，`a` 是截距（当\
  \ `x = 0` 时的 `y` 值）。通过简单线性回归，会生成相关系数，如图 6.2 所示。在这种情况下，存在 `0.83` 的强正相关。\n\n理解相关性和回归之间的区别至关重要。\n\
  \n- **相关性**：它代表两个变量之间的关系，这种关系可能是也可能不是因果关系。这种关系的强度由相关系数 `r` 表示，其范围从 `-1` 到 `+1`。负相关意味着随着\
  \ `x` 的增加，`y` 减少。在正相关中，`x` 和 `y` 增加。相关性分析通常作为数据挖掘和数据探索练习进行，包括对所有预测变量与目标变量进行逐一分析。\n\
  - **回归**：通常用于有更强迹象表明 `x` 和 `y` 之间存在因果关系时。回归分析的目的是创建一个回归方程，代表匹配数据的最佳拟合线。这种关系的强度也可以用\
  \ `r` 表示（在 Orange 中），但更典型的表示是将 `x` 和 `y` 的关系表示为 `R²`，由 JASP 计算。`R²` 范围从 `0` 到 `1`，`0`\
  \ 代表 `x` 和 `y` 之间没有关系，而 `1` 代表每个数据点都完美匹配最佳拟合线。³ Orange 在 `Test and Score` 组件中报告\
  \ `R²`。\n\n在图 6.2 中，某人工作周数与累积储蓄之间存在关系。使用线性方程，你可以输入周数 `X` 为 `10`，看到累积储蓄将是 `400 +\
  \ 307.50 (10)` 或 `3470.50`。需要理解的下一点是，大多数数据点并不在回归线上。它们可能在上方 (+) 或下方 (-) 偏离 `100`。数据点与回归线之间的差异被称为残差（或误差），它是最佳拟合线与实际数据点之间的垂直差异。为了不出现负数，会对残差进行平方。（-2\
  \ 的平方 = 4）。\n\n6.3 显示了一个 Orange 散点图，其中包含回归线的 Orange r 值，以及根据 JASP 输出的模型摘要和模型系数计算得的回归方程。如图所示，腰围与体脂百分比之间的关系由\
  \ `0.81` 的 r 值和 `0.66` 的 `R²` 表示。回归方程在统计学上是显著的，p 值低于 `0.05`。这意味着我们拒绝了预测变量与结果之间没有显著关系的零假设。在\
  \ JASP 中创建此回归分析的步骤所示：#content0171.xhtml\n\n```Regression > Linear Regression > enter\
  \ Percent Body Fat for Dependent Variable > enter Abdomen circumference for Covariates\
  \ > check: Include intercept, Model Fit, and Estimates.\n```\n\n![  线性回归 (StatQuest)![](img/image-WLVIXROH.jpg)\
  \  \n\n图 6.2 简单线性回归（感谢波顿大学公共卫生学院）\n\n![](img/image-3FWBJDL5.jpg)  \n\n\n\n\n图 6.3\
  \ 在 JASP 中计算的线性回归方程\n\n#### 6.2.3 多元线性回归 (MLR)\n\nMLR 模型模拟了解释变量（独立变量）`(X)` 与响应变量（因变量）`(Y)`\
  \ 之间的线性关系。公式如下：\n\n*   `y`：因变量的预测值\n\n![](img/image-RELHIPU3.png)\n\n*   `B0` =\
  \ y 截距（当所有其他参数均设为 0 时 `y` 的值）\n*   `B1X1` = 第一个独立变量 (`X1`) 的回归系数 (`B1`)（独立变量值的增加对预测的\
  \ `y` 值产生的影响）\n\n![](img/image-TEMD15Y1.jpg)\n\n你需要分别计算每个独立变量的回归系数，考虑它们对 `y` 预测值的独特影响。\n\
  \n*   `BnXn` = 最后一个独立变量的回归系数\n*   `e` = 模型误差（又称为我们对 `y` 的估计存在多大的波动）\n\n多元回归计算以下内容：\n\
  \n*   使整体模型误差最小的回归系数。\n*   整体模型的 t 统计量。\n*   相关的 `p-value`（它决定了每个独立变量与因变量之间关系的统计显著性，提供了关于回归模型强度和可靠性的见解）。\n\
  *   每个预测器的方差膨胀因子 (`VIFs`)。\n*   参见图 6.4 查看两个预测变量（重量和马力）与目标变量（MPG）的三维显示。此类显示对于展示\
  \ MLR 模型中排名靠前的预测变量与目标变量之间的视觉关系始终有用。多元线性回归和 `VIFs` 在第 2.4.2 节中详细介绍过。然而，如下文所述，重复在\
  \ JASP 中创建 MLR 的操作步骤以及一些分析提示仍然是值得的：\n\n*   进入 `JASP` > 选择 `Regression` > `linear\
  \ logistic regression` > 在 `Dependent Variable` 部分中输入目标 > 在 `Covariates` 部分中输入所有连续变量\
  \ > 在 `Factors` 部分中输入分类因子 > `Statistics` > 勾选 `Estimates` 和 `Model Fit` > 勾选 `Collinearity\
  \ diagnostics` 以获取 `VIFs`（方差膨胀因子) > 考虑移除 `VIF` > 5 的预测器，从具有最高 `p-value` 的预测器开始 >\
  \ 查看 `ANOVA` 表上的 `p-value` 以判断整个模型是否具有统计显著性（`p-value` < 0.05），然后查看 `Coefficients`\
  \ 表查看删除所有具有高 `VIF` 的预测器后每个输入因子的 `p-values` > 从输入列表中删除任何 `p-value` 大于 0.05 的变量，但一次处理一个因子，从最高的\
  \ `p-value` 开始。\n\n![](img/image-6WJJZDVI.png)\n\n图 6.4 多元线性回归 ⁴\n\n*   可能存在两个 `VIF`\
  \ 极高的变量，且它们的 `p-value` 都非常低 (<0.05)。在这种情况下，你需要删除其中一个变量。保留对你的模型和利益相关者最符合逻辑的变量。当你删除第二个变量时，`VIF`\
  \ 值现在应该在 5 以下。\n*   当 `Coefficients` 表上所有的 `p-values` 均低于 0.05 时，你就有了一个有效模型。\n*\
  \   多元线性回归和 `VIFs` 在第 2.4.2 节中详细介绍过。\n\n#### 6.2.4 虚拟变量陷阱 (Dummy Trap)\n\n线性回归依赖于几个假设：\n\
  *   **方差齐性** (Homoscedasticity)：\n*   **观测值的独立性**：\n*   **正态性**：\n*   **线性**：\n\
  *   **离群值**：\n\n![](img/image-RSE95.png)\n\n\n\n\n“! 在运行分析时发生了以下问题(s)：以下变量对存在完美相关：gender=female\
  \ 和 gender=male；fasting blood sugar > 120=0 和 fasting blood sugar > 120=1；exerc\
  \ ind ang=0 和 exerc ind ang=1。”\n\n`Orange` 中的机器学习算法不会提供此类警告，也不会阻止你继续操作，因为并非所有算法受虚拟变量的影响方式都是相同的。避免这种风险的最佳实践是应用虚拟变量编码（dummy\
  \ encoding），这可以避免在 `JASP` 中出现上述错误信息。\n\n总之，“虚拟变量编码”是一种避免由“独热编码（one hot encoding）”导致的“虚拟变量陷阱”的方法。\
  \ ⁶-⁷\n\n### 6.2.5 逻辑回归\n\n虽然有些人可能认为逻辑回归应该在这里首次详细介绍，但我们选择在之前的分类和建模章节中介绍并讨论它，这是因为对于那些经常需要逻辑回归进行快速决策的行业，医生、临床医生和其他相关领域专家面临着巨大的负担。逻辑回归有助于预测二分类或多分类诊断，需要尽早频繁地讨论。\n\
  \n### 6.2.6 多项式回归\n\n这种回归与简单线性回归相似，但回归线是弯的，以便处理非线性数据关系。使用“最小二乘”统计方法来确定多项式曲线的精确形状。当多项式阶数设置为\
  \ `1` 时，它等同于简单线性回归。图 6.5 显示了简单线性模型和多项式模型。随着多项式阶数的增加，线条对数据的拟合程度越好，但在某些情况下你会倾向于将噪声也建模，因此当选择的多项式阶数高于自然拟合数据整体形状时，会导致过拟合。`Orange`\
  \ 在教育扩展插件中有一个 `Polynomial Regression` 组件。你可以使用 `Paint Data` 组件创建数据点，然后将其连接到 `Polynomial\
  \ Regression` 组件进行线条拟合。当你将后者连接到 `Data Table` 组件时，你可以看到回归系数。\n\n![](img/image-WV4H234Y.png)\
  \  \n\n图 6.5 简单线性模型和多项式模型\n\n### 6.2.7 线性回归模型正则化\n\n正则化是通过引入惩罚项来减少过拟合的技术，鼓励模型优先考虑提高泛化能力的更简单模型。这减少了模型中的差（过拟合），且不会大幅增加偏差（欠拟合）。当你选择并打开\
  \ `Linear Regression` 组件时，你有四种正则化选择：`no regularization`（无正则化）、`ridge regression`（岭回归）、`lasso\
  \ regression`（lasso 回归）和 `elastic net regression`（弹性回归）。\n\n#### 6.2.7.1 岭回归\n\n\
  岭回归是一种 `L2` 正则化方法，可以提高模型的泛化能力，特别是在存在多共线的情况下。它将模型系数向零压缩，以减少单个预测变量的影响。在 `Orange` 中，你可以控制要添加到模型的\
  \ `Ridge regression` 正则化强度。当预测变量数量大于观测数量时，该方法特别受欢迎。 ⁸\n\n#### 6.2.7.2 Lasso 回归\n\
  \nLasso 代表最小绝对收缩和选择算子（Least Absolute Shrinkage and Selection Operator）。它是一种 `L1`\
  \ 正则化方法，应用与系数绝对值相同的惩罚。它将低重要性和高多共线性预测变量的系数设置为零，从而消除了它们对模型的影响，同时仍允许该数据列包含在模型中。在 `Orange`\
  \ 中，你可以控制要添加到模型的 `Lasso Regression` 正则化强度。这种正则化类型可以产生更简单、更稀疏的模型，被认为的特征更少。⁹\n\n####\
  \ 6.2.7.3 弹性回归\n\n弹性回归是一种惩罚线性回归模型，在训练期间同时包含 `L1` 和 `L2` 惩罚，作为一种混合方法平衡 `Ridge` 和\
  \ `Lasso` 方法的强度。¹⁰ 在 `Orange` 中，你可以控制要添加到模型的 `L1` 和 `L2` 正则化混合。在 `JASP` 机器学习模块中，你可以选择\
  \ `Regularized Linear Regression` 并在 `Training Parameters` 部分选择自动优化正则化水平（`lambda`）的选项。这将创建一个误差最小的模型。此选项适用于\
  \ `Lasso`、`Ridge` 或 `Elastic Net` 回归。\n\n总之，你应该始终从 `JASP` 中的简单多元回归开始你的建模旅程，以识别数据集中的\
  \ `VIF` 水平，这会告诉你为了实现无多共线模型需要投入的工作量。你不应该被强迫在建模开始就决定使用哪种正则化算法。建模过程是许多算法和算法选项之间的竞争。上述每种方法都应该相互比较，以查看它们的性能，并且它们的每个变量排名也应该相互比较。在追求最佳模型的过程中，你可能还想尝试\
  \ `Ridge` 和 `Lasso` 方法的不同正则化强度，并测试不同的 `Elastic Net` 混合比例。\n\n![](img/image-KE2EG340.png)\
  \  \n\n岭回归 vs Lasso 回归 (StatQuest)\n\n![](img/image-3BSDT6QK.png)  \n\n弹性回归\n\n\
  ### 6.2.8 回归性能指标\n\n回归的性能衡量标准与分类不同，常见的指标有 `MAE`（平均绝对误差）、`RMSE`（均方根误差）、`MSE`（均方误差）和\
  \ `R2`（决定系数）。为了说明计算前三个指标的示例，假设三个数据点的残差或误差为：`-2`、`1` 和 `5`。\n\nMAE “基本上是模型真实值与预测值之间的绝对差。因此，平均绝对误差或\
  \ `MAE` 是对数据集中每个样本的误差取平均得到的误差。” ¹¹ 使用示例残差，`MAE` 的计算方法为 `5 + 1 + 2 / 3 = 2.67`。越低越好。\n\
  \nMSE “通过取真实值与预测值之间差的平方的平均值计算误差。” ¹¹ 使用示例残差，`MSE` 的计算如下：`(-2)² + 1² + 5² =30`。MSE\
  \ 将为 `30/3 = 10`。越低越好。\n\nRMSE “是对数据集进行预测时所产生误差的标准差。这与 MSE（均方误差）相同，但在确定模型准确性时考虑了该值的根。”\
  \ ¹¹ 使用示例残差，`RMSE` 将是 `MSE` (10) 的平方根，即 `3.16`。越低越好。\n\nR squared “也被称为决定系数。R squared\
  \ 值位于 0 和 1 之间，0 表示该模型不拟合给定数据，1 表示模型完美拟合。” ¹¹ 注意某些程序（非 `Orange`）还包括 `adjusted R\
  \ squared`（调整后 R 方），它根据模型中独立变量的数量来调整统计量。R 方的问题在于“它在添加新的独立变量时保持不变或增加。这显然是不合理的，因为某些独立变量可能对于确定目标变量用。”调整后\
  \ R 方解决了这个问题。¹¹ 虽然 R 方范围在 0 到 1 之间，但它们通常以 0% 到 100% 的百分比表示。²\n\n![](img/image-130XV16G.png)\
  \  \n\nR 方 (StatQuest)\n\n当人们比较几个模型时，大多数人关注的两个标准是 `RMSE` 和 `R2`。对于 `RMSE`，越低越好。另一方面，`R2`\
  \ 范围从 0 到 1，越高越好。`R2` 值为 1 意味着模型完美，其结果是 100% 可预测的.¹³\n\n\n\n\n\n# 6.3 知识实战\n\n##\
  \ 6.3.1 练习\n\n### 6.3.1.1 分类\n\n本练习将侧重于预测员工离职。你将在 `Dataset` 组件中找到名为 `Attrition-train`（而非\
  \ `Attrition-Predict`）的此数据集。更多信息请见 `Dataset` 组件页面的底部。双击数据集进行加载。接下来，将 `Dataset` 组件连接到\
  \ `Data Table` 和 `Box Plot` 组件。\n\n1. 检查 `Data Table` 组件中的数据。共有多少行和多少列？是否存在缺失数据？目标变量（target）是什么？分类数据有几列，数值数据又有多少列？\n\
  \n2. 在 `Box Plot` 组件中，确定离职与未离职的人员数量。是否存在类别不平衡？\n\n3. 将 `Dataset` 组件连接到 `Edit Domain`\
  \ 组件，因为我们希望将目标结果从 `Yes` 更改为 `1`，将 `No` 更改为 `0`。这将有助于我们在 JASP 中分析该数据集时进行分析：\n\n \
  \   a. 在 `Edit Domain` 组件中，在左侧窗口选择 `Attrition`。在 `Values` 下下双击 `No` 并将其替换为 `0`，双击\
  \ `Yes` 并将其替换为 `1`。点击应用。\n\n    b. 将 `Continuize` 组件连接到 `Edit Domain` 组件，并分类值选择“First\
  \ value as base”（第一个值作为基准）。\n\n    c. 将 `Continuize` 组件连接到 `Data Table` 组件，确认你现在已将分类变量转换为数值，且目标列现在由\
  \ 1 和 0 组成。\n\n    d. 将 `Data Table` 组件连接到 `Save Data` 组件并将文件保存为 `Attrition_Dummy_Coded`。\n\
  \n4. 将保存的文件上传到 JASP：\n\n    a. 选择 `Linear Regression`（线性回归）。选择 `Attrition` 为 `Dependent\
  \ Variable`（因变量），选择其他所有变量为 `Covariate`（协变量）。\n\n    b. 滚动到 `Statistics`（统计）并勾选“Collinearity\
  \ diagnostics”（共线性诊断）。这需要几分钟时间并在右侧生成一个表格。\n\n    c. 有多少个 `VIFs` 超过 `5`？有多少个 `p`\
  \ 值大于 `.05`？\n\n    d. 从 `VIF` 最高且 `p` 值大于 `.05` 的项开始，将其从模型中移除，然后重新评估 `VIFs`。逐个移除\
  \ `p` 值较高且超过 `5` 的 `VIFs`，直到所有 `VIFs` 都小于 `5`。你删除了多少个？\n\n5. 将 `Attrition_Dummy_Coded`\
  \ 文件导入 `Orange File` 组件：\n\n    a. 打开 `File` 组件并检查。将你在 JASP 中排除的任何变量更改为“skip”（跳过）。这些变量将不会成为模型的一部分。\n\
  \n    b. 设置 `target = Attrition`\n\n    c. 点击 `Apply` 按钮\n\n6. 将 `File` 组件连接到 `Data\
  \ Sampler` 组件，设置 `75/25` 分割并“stratify sample”（分层采样）。将 `Data Sampler` 组件连接到 `Test\
  \ and Score` 组件，并确保一个连接器标记为“remaining data”（剩余数据）到“test data”（测试数据）。\n\n7. 为 `Test\
  \ and Score` 组件连接不同家族的算法，例如：基于树的算法、集成算法、带有不同正则化方法的逻辑回归、朴素贝叶斯、神经网络等。\n\n    a. 使用第\
  \ 5 章第 5.5.2 节描述的工作流，将 `Feature Importance` 组件连接到其中一种算法。离职的前三个主要预测因素是什么？\n\n   \
  \ b. 打开 `Test and Score` 组件。将 `target` 设置为 `1`并将交叉验证（cross validation）设置为 `10`。\n\
  \n    c. 性能评分是否表明存在类别不平衡？如果是，监控的最佳性能指标是什么？哪种算法产生了最好的 `F1` 分？\n\n    d. 将 `Performance`\
  \ 组件连接到 `Test and Score` 组件。确保 `target = 1` 且 `Curve = precision recall`（精确召回率）。哪种算法产生了最高的\
  \ `AUPRC`？\n\n    e. 记录 `logistic regression`（逻辑回归）和 `random forest`（随机森林）的 `F1`\
  \ 分。在两个组件中选择“balance class distribution”（平衡类别分布）并重新评估 `F1` 分。它们提升了多少？\n\n8. 将 `Calibration`（校准）图连接到\
  \ `Test and Score` 组件并打开：\n\n    a. 设置 `target = 1` 并逐一分析曲线，看是否有任何接近 45 度线，这表明预测概率接近实际概率。哪一个最好？\n\
  \n9. 使用 `Calibration Plot` 中的 `precision recall` 曲线计算最佳 `ROC threshold`（ROC 阈值），或按照第\
  \ 4 章第 4.7.2.9 节解释计算 `Geometric Mean`（几何平均数）。\n\n### 6.3.1.2 回归\n\n#### 使用合成绘制数据的练习\n\
