  \n### 7.3 HIERARCHICAL CLUSTERING\n\nThere are multiple unsupervised learning methods\
  \ but perhaps the easiest to understand and visualize is hierarchical clustering.\
  \ Hierarchical clustering is another unsupervised learning technique that processes\
  \ and organizes data into a `dendrogram`. See Figure 7.12. Unlike `k-means` clustering\
  \ you do not have to decide the optimal number of clusters ahead of time which is\
  \ a very useful feature. In the dendrogram in Figure 7.12, there are 4 major clusters\
  \ with many sub-clusters.\n\nThis dendrogram came from a November 2021 article in\
  \ JAMIA in which patients admitted to an ICU with COVID-19 underwent an unsupervised\
  \ learning strategy to see if there were phenotypic subtypes. Using demographics,\
  \ vital signs, lab results, and medications they identified 4 subtypes that had\
  \ the outcome of in-hospital mortality or prolonged ICU stay. “Sub-phenotype SP\
  \ I (n = 233 [22.5%]) included patients with rapid respirations and a rapid heartbeat,\
  \ but less need for invasive interventions within the first 24 hours, with a relatively\
  \ good prognosis. Sub-phenotype SP 2 (n = 418 [40.3%]) represented patients with\
  \ the least degree of ailments, relatively low mortality, and the highest probability\
  \ of discharge from the hospital. Sub-phenotype SP 3 (n = 259 [25.0%]) represented\
  \ patients who experienced clinical deterioration during the first 24 hours of intensive\
  \ care unit admission, leading to poor outcomes. Sub-phenotype SP 4 (n = 126 [12.2%])\
  \ represented an acute respiratory distress syndrome with an almost universal need\
  \ for mechanical ventilation.” ⁴ Note the four clusters displayed in Figure 7.12.\
  \ The far-left cluster in Figure 7.12 encompasses the others with the connecting\
  \ line logic on the top. The final cluster hierarchy is in order from most dominant\
  \ ones on the left and the least relevant one on the far right. The arrows on either\
  \ side of the graph also describe the two types of clustering methods: Divisive\
  \ and Agglomerative, which will be described further.\n\n[/content] (Note: I have\
