  \n在完成第二章的学习后，读者应该能够：\n\n* 描述定量数据和定性数据类型。\n* 列出预测变量和结果的同义词。\n* 列举编程数据类型。\n* 讨论八步法\
  \ DISCOVER 数据科学流程。\n* 讨论涉及数据清洗的流程和任务。\n* 描述各种数据科学准备和清洗的概念。\n* 描述涉及各种数据清洗概念（如特征工程）的步骤。\n\
  * 理解进行数据科学实验的必要性以及涉及的步骤。\n* 理解各种 Orange 小部件的用途和结果。\n* 理解各种 JASP 分析选项。\n\n### 2.1.2\
  \ 数据科学 DISCOVER 第 2 步\n\n图 2.1 显示了八步数据科学 DISCOVER 流程的细节，当前处于第 2 步。数据科学流程第 2 步：集成、收集和导入大量高质量的数据。每个类别缺乏足够的高质量数据将使预测模型无法充分学习输入因子与目标输出因子或类别之间的关系。\n\
  \n\n\n\n\n# 数据指南与要求\n\n9. 作为一般指南，模型中使用的数据行数应是列数的十倍。¹\n\n10. 如果模型是线性的，每个类别最少可能需要数百行数据。通过残差分析可以确定模型是否为线性。\n\
  \n11. 如果模型是非线性的，每个类别最少可能需要数千行数据。²\n\n12. 有人建议，在开始预测性分析之前，始终至少准备 300 行数据，而对于预测模型，则需要\
  \ 1,000 行数据。³- ⁴\n\n13. 准确预测的具体要求可能取决于问题、数据的复杂性以及所使用的特定技术。理想情况下，对于“平均””建模问题，希望拥有万或数十万行数据。⁵\n\
  \n14. 与机器学习相比，深度学习需要更多的数据，但并没有硬性规定。无论数据是用于预测，还是用于卷积神经网络的图像，它都取决于任务的复杂性以及数据集的大小和多样性。\n\
  \n15. 将你的数据采集均匀分布在“谁、什么、何时、何地和为什么”类别中，以捕捉全面的预测变量范围和分层群体。基于不平衡数据采集计划构建的模型可能会有严重的盲点。\n\
  \n16. 确保在你分析的预期范围内，每个种感兴趣的分层群体都有足够的数据。上述所有关于所需数据量的指南都适用于你打算进行预测性分析的每个分层群体。\n\n**关键点**：对于机器学习项目，数据几乎总是越多越好。有人建议，在开始预测性分析时，数据绝不能少于\
  \ 300 行。其他人则认为，模型中使用的行数应该是列数的十倍。\n\n![](img/image-LL0YBUZG.png)\n\n图 2.2 DIKIW 金字塔\n\
  \n# DIKIW 金字塔\n\n提醒一下，在大多数出版物，datum 是单数，data 是复数。Data 仅仅是没有任何特定含义的数字，例如 10。Information\
  \ 是具有意义的数据，例如，血红蛋白值为 10。Knowledge 是被认为是真实的信息；血红蛋白 14 是正常的。Wisdom 是指明智地利用知识来解释信息和知识的意义。例如，血红蛋白\
  \ 10 较低，但在慢性肾衰竭中是预期的。Chang 等人在传统数据金字塔中提到了另一个类别“智能”，以表明必须考虑人工智能。人工智能具有增加我们知识和智慧的潜力。⁶\
  \ 图 2.2 显示了数据、信息、知识、智能和智慧（DIKIW）金字塔。注意，可用数据远多于智慧。\n\n最小的数据单位是位（bit），它可以表示为二进制选择（`0`\
  \ 或 `1`）。一个字节（byte）由 8 个位组成，可以提供 256 种潜在的数据组合。例如，`0100 0001` 代表大写字母 A。四个字节在一起提供超过\
  \ 400 万种可能性。由于这些数字字符串可能非常长，代码也可以以八进制（基 8）、十进制（基 10）或十六进制（基 16）的形式显示。这种二进制编码非常重要，因为计算机可以快速解释这种二进制格式的数据。⁷\n\
  \n随着数据的爆炸，其规模不断增大，这挑战着我们所有人，并显示在表 2.1 中。⁸ 今天看起来海量数据集在未来可能看起来是小型或中型数据集。\n\n# 数据类型\n\
  \n数据有三种：结构化数据、非结构化数据和半结构化数据。\n\n## 结构化数据\n存储在关系型数据库中的大多数数据都是结构化的，例如姓名、年龄、性别，这些可以显示医疗检查、银行交易或其他领域的结果。此类数据可以是分类数据或数值数据。\n\
  \n## 非结构化数据\n这可以包括社交媒体帖子、聊天日志、客户反馈等。据称，约 75% 的医疗记录是非结构化数据，即自由文本，可能包括医生笔记。表 2.1 数据大小\n\
  \n| 名称 | 等于 | 字节 (Bytes) |\n| --- | --- | --- |\n| 位 (bit) | | 1 |\n|  半字节 (nibble)\
  \ | | 4 |\n| 字节 (byte) | | 8 |\n| 千字节 (kilobyte) | | 1,024 |\n| 兆字节 (megabyte) |\
  \ | 1,048,576 |\n| 吉字节 (gigabyte) | | 1,073,741,824 |\n| 太字节 (terabyte) | | 1,099,511,627,776\
  \ |\n| 拍字节 (petabyte) | | 1,125,899,906,842,624 |\n| 艾字节 (exabyte) | | 1,152,921,504,606,846,976\
  \ |\n| 泽字节 (zettabyte) | | 1,208,925,819,614,629,174,706 |\n| 壤字节 (yottabyte) |\
  \ | 1,208,925,819,614,629,174,706,176,269,176 |\n\n## 半结构化数据\n半结构化数据具有有限的组织（模式）。半结构化数据的示例包括\
  \ `XML` 和 `JSON`。数据涵盖了除数字以外的各种信息，如气味、声音和纹理。这些类型的数据可以转换为数值进行分析。⁹\n\n# 医疗数据的挑战\n\n\
  **关键点**：我们将使用多行业数据进行示例和练习。虽然有“数据是新石油”的说法，但在医疗领域，它是原油，需要多阶段提取。⁰\n\n医疗数据的特定挑战如下：\n\
  \n- 缺乏用于监督和无监督学习的高质量医疗数据。\n- 由于 `HIPAA` 的考虑，还缺乏用于自然语言处理、研究和教育的医疗记录（非结构化数据）。\n- 公用的表格医疗数据集较小（100-400\
  \ 名患者），通常需要数据清洗工作来处理多共线性、需要 `n-1` 哑编码的分类列和其他问题。它们通常包含分类目标的不平衡数据。\n- 医疗系统内部的数据充满了缺失值、异常的缩写和不一致的术语¹尽管存在如\
  \ `DICOM`、`LOINC` 等多种数据标准。\n- 在医疗保健领域分析非结构化数据具有挑战性，这就是为什么人们如此关注自然语言处理以解决这个问题。此外，医疗图像数据面临许多挑战，例如图像数量不足和标记不良。此外，流行的图像数据库\
  \ `ImageNet` 拥有 1400 万图像并用于训练神经网络，但它没有医疗图像¹\n- 数据是孤岛，位于多个位置并以多种格式存在。临床数据与使用 `ICD-10`\
  \ 和 `CPT` 代码编码的理赔数据不同。数据科学家和工程师必须建立流水线，提取、转换并将数据加载到数据仓库、数据湖或数据湖仓中供未来分析。大数据（高容量、高速度、高价值、真实性和多样性）是一个挑战，来自活动和血糖监测的新传感器数据也是。这引发了一个问题：谁或什么来解释这些海量数据，这能否报销\n\
  \n### 表 2.2 预测变量和结果的同义词\n\n| 预测变量 | 结果 |\n| --- | --- |\n| 自变量、`x 变量`、预测变量、属性、解释变量、特征、因子、协变量\
  \ | 因变量、`y 变量`、目标、标签、类别、响应变量 |\n\n\n\n\n\n对于数据科学教育最有用的数据集仓库之一是加州大学欧文分校数据仓库。该仓库包含超过\
  \ 600 个数据集，涵盖七个领域，并为分类、回归、聚类和其他方法提供数据。数据来源已有说明，并与数据字典（代码簿）关联¹³。然而，这些数据集中的许多较小且陈旧。许多采用不寻的文件格式，如\
  \ `.rar` 和 `.data` 文件。\n\n### 2.1.2 数据类型\n\n有多种方式来概念化和组织数据。从数据类型开始。图 2.3 和表 2.3\
  \ 描述了数据类型并区分了连续数据和离散数据。这种数据分类并非完美。例如，李克特量表（满意度 1 到 5 评分）被某些研究人员认为是间隔数据，而另一些人认为是顺序数据。当李克特量表转换为数值时，通常被视为间隔数据¹⁴。记住，计算机解释的是\
  \ `1` 和 `0`，尽管其中一个是数值，但在这种情况下它是离散的。你不可能拥有 `0.5` 个心脏病。对于典型的机器学习练习，心脏病被标记为 `1`，缺失则标记为\
  \ `0`。\n\n数据包括数字、字符、符号、逻辑数据（`Boolean`）和图像。数据可以存储在许多不同的数据类型中，这些类型决定可以使用编程语言对数据执行哪些操作/函数，或者它如何在数据库或电子表格中存储。编程数据类型列在表\
  \ 2.4 中。\n\n#### 表 2.3 连续数据与离散数据\n\n|  | 连续 | 离散 |\n| --- | --- | --- |\n| 名义数据\
  \ |  | ✔ |\n| 顺序数据 |  | ✔ |\n| 间隔数据 | ✔ | ✔ |\n| 比例数据 | ✔ | ✔ |\n\n最后，由于数据科学家经常采用线性代数来将单词和图像转换为矩阵，因此理解标量、向量、矩阵和张量之间的区别至关重要。标量表示单个数字，例如\
  \ `11`，而向量是行或列数组。矩阵是数字的二维数组，描述向量之间的线性关系。张量是具有两个以上轴的数组，描述向量之间的多线性关系。¹⁵ 参见图 2.4。\n\
