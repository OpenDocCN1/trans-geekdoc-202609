  \ `VIF` 以及预测变量与目标变量之间其他高相关性的分析过程，以防止分析跳向错误且可能尴尬的结论。\n\n[图 2.53 显示了使用 Orange Rank\
  \ 组件通过单变量回归评分方法得到的模型变量重要性排名结果，该方法对所有预测变量对体脂肪百分比的贡献排名。VIF 也添加到此由 `JASP` 计算的排名图中。]\n\
  \n正如从图 2.52 中看到的，排名最高的预测变量也遭受着最高的共线性（高 `VIF`），这大大限制了变量排名的有效性。\n\n在图 2.53 中，我们可以看到左侧没有任何正则化和共线性控制的原始线性回归模型过拟合，五个预测变量的\
  \ `VIF` 大于五。右侧在 Orange 中正则化强度为 0.5 的 Lasso 回归将原始 13 个变量减少到仅剩四个排名大于零的变量。原始变量中的九个被减少到排名为零，这使得模型及其解释可以集中在四个互不高度相关的领先因素上，这通过它们的低\
  \ `VIF` 得到了证实。]\n\n\n\n\n\n# Lasso 回归与正则化\n\nOrange 中的 Lasso 回归是 `Linear Regression`\
  \ 和 `Logistic Regression` 小部件中的一个选项。`Neural Network` 小部件中也提供了正则化水平选择。Lasso 使用 `L1`\
  \ 正则化，这种技术可以减少贡献较小的变量的权重，并将其中一些变量驱动为零，从而创建更小、更准确的模型，同时显著减少多共线性并提供准确的变量重要性排名。Lasso\
  \ 回归非常适用于显示出高水平多线性的模型，如体脂数据集所示。当我们应用正则化分析时，我们保留模型中的所有变量，并让算法减小特定变量的系数幅度以创建一个简单的模型。⁵¹-⁵²\
  \ `Ridge` 和 `Elastic Net` 回归提供了与 `Lasso` 类似的优势。它们将在后面的章节中详细介绍。\n\n![](img/image-NV92ISUK.jpg)\n\
  \n图 2.52 体脂百分比数据集的模型变量重要性排名\n\n图 2.54 显示了 `JASP` 中的多回归，且仅包含 `Lasso` 回归识别出的前四个预测变量。我们可以看到，这些预测变量的所有\
  \ `VIFs` 都低于 1.9，所有预测变量的 `p-values` 都低于 0.05，这表明它们在统计学上都是显著的，且整个回归方程的 `R-Squared`\
  \ 值为 0.72。这与包含所有 13 个预测变量的原始模型 `R-Squared` 值 0.749 相比仅有微下降。模型的 `R-Squared` 值下降是因为该模型正确地减少了冗余和混杂预测变量的影响\n\
  \n高 `VIF` 会赋予预测变量“团队”超过其应有的荣誉，并在回归模型中产生更多人为的炒作和误差。`VIF` 分析和 `Lasso` 回归帮助我们区分虚假的兴奋与真实的兴奋，以便我们能够将集中在具有最显著预测变量的较模型上。这个例子为混杂和重复信息变量的世界提供了见解，当高\
  \ `VIF` 存在时，这些变量会对统计模型造成巨大混乱。\n\n尽管这种情况对于某些能够处理混乱输入的预测模型的成功并非至关重要，但这种情况仍然会大大降低机器学习模型变量排名的准确性和\
  \ `ML` 模型的解释性。\n\n## 预测变量两两相关性\n\n预测变量两两相关性的考虑。在前节中，我们试图通过观察预测变量之间的 `Pearson` 和\
  \ `Spearman` 相关性来识别多共线性，但这一次只能比较两个变量。然而，当回归模型中存在两个以上的变量时，这些方法充分发现多共线性的潜力非常有限。这一规则也有例外，因为\
  \ `Pearson` 相关系数的排名可能与 `JASP` 计算的高低 `VIFs` 排名匹配。然而，相反的情况也可能，即 `Pearson` 相关系数的排名与\
  \ JASP 计算的高低 `VIFs` 排名几乎相反。换句话说，对于较大的预测变量组，两两相关方法在说明多共线性现状方面是不可靠的。`VIFs` 的计算是识别多共线性的金标准。\n\
  \n![](img/image-DR59HHNU.jpg)\n\n图 2.53 变量重要性排名（左）对比 `Lasso` 变量重要性排名（右）\n\n![](img/image-OS598C3J.jpg)\n\
  \n图 2.54 `Lasso` 模型中仅针对前四个预测变量的多回归模型\n\n**关键点**：`VIFs` 的计算是识别多共线性的金标准。`Pearson`\
  \ 和 `Spearman` 相关性识别多共线性的潜力有限。在任何情况下 `VIFs` 都会增加混乱并需要处理。\n\n多个预测变量相关性的考虑。只有同时考虑所有预测变量时，我们才能真正识别多共线性的存在.³\
  \ `JASP` 在其 `collinearity diagnostics` 中提供了该选项 `Orange` 不计算 `VIFs`。\n\n## 数据泄露\n\
  \n### 2.4.3 数据泄露\n\n**关键点**：永远不要让关于测试集的任何直接、间接或微妙信息传递给训练集，因为这会导致无法泛化的过度预测。\n\n首先必须指出，许多作者使用\
  \ `data leakage` 来指离开机构的数据。`data leakage` 有一个完全不同的定义：“使用来自训练数据集外部的信息来创建模型。”³ 这在预测建模中是一个非常严重的违规行为，也被称为无意的“作弊”。⁴\
  \ 例如，在进行训练和测试划分之前对数据进行标准化、归一化或其他转换的简单粗心行为可能会泄露关于训练集的信息⁵ 这些和其他其他粗心的预处理步骤会导致对模型在未见数据上表现的错误假设⁵\
  \ 这种 `data leakage` 是导致无法泛化的过度模型的另一个原因。\n\n2022 年 `Kapoor` 和 `Narayanan` 发表的一篇文章建议\
  \ `data leakage` 正在损害许多机器学习文章的可重复性。根据作者的说法，早期研究显示使用新算法相比 `logistic regression` 具有模型优势，但当排除\
  \ `data leakage` 后，并没有优势。如果代码不共享，可能存在未被检测到的 `data leakage`。遗憾的是，缺乏 `data leakage`\
  \ 指南，这促使 `Kapoor` 和 `Narayanan` 开发了一个已知的数据泄露原因列表：⁷\n\n1. **缺乏训练和测试数据集的清晰分离**：必须在预处理、建模和评估之前分离测试数据集。如果没有早期分离，可能会出现下述的\
  \ `data leakage` 问题：\n    - 未划分训练和测试数据\n    - 在训练集和测试集上进行特征选择。特征排名应该在数据划分后进行，而不是之前\n\
  \    - 在数据划分前应删除重复项，因为相同的数据可能同时存在于训练和测试数据集中\n2. **模型使用了非合法的特征**：例如，特征的代理变量也会导致 `data\
  \ leakage`。如果模型的目标是预测高血压，并使用降压药物作为特征，这代表了 `data leakage`，因为代理与结果相关。如果在不包含降压药物列的测试数据上运行模型，预测可能会可能会得多。\n\
  3. **测试集并非源自科学感兴趣的分布**：例如，你不应该在与训练数据不同的患者群体数据上进行测试\n    - **时间泄露**：测试集不应包含来自训练集之前的数据。\n\
  \    - **训练和测试数据之间的非独立性**：训练和测试数据不应来自同一个患者。\n    - **测试分布中的采样偏差**：\n        - **空间偏差**是指从某个地理位置选择测试数据，但对其他地理位置的性能做出断言。\n\
  \n\n\n\n\nii. 选择偏差意味着选择了一个非代表性的数据子集进行评估，而该子集不能反映关注的总体 ⁵⁸\n\nKapoor 和 Narayanan 在这篇文章中还讨论了机器学习研究的其他缺陷，并在他们的网站上提供了一个可以下载的数据泄露检查清单。⁵⁷\n\
  \n### 2.4.4 不平衡数据\n\n在第 4 章中，有一个大量的章节专门介绍不平衡数据。将其放在那里是因为许多处理不平衡数据的方法都需要第 4 章和第 5\
  \ 章中的相关知识。不平衡数据在生物医学、欺诈检测和其他领域非常常见，在这些领域，你感兴趣的类别通常是少数。例如，可能只有 10% 的前列腺活检显示患癌，因此\
  \ 90% 是良性的。此外，特征不平衡也很常见，例如 `gender` 或 `race` 等变量的数据出现倾斜，导致模型倾向于多数群体而产生偏见。对于二分类模型，这在解释模型性能时会产生很多问题。在随后的章节中，我们将讨论在不平衡数据设置应该使用哪些指标，以及避免哪些指标。此外，我们还将讨论\
  \ `Orange`、`JASP` 以及其他地方有哪些用于处理不平衡数据的工具。\n\n## 2.5 合成数据\n\n#### 2.5.1 引言\n\n合成数据是在当没有足够的真实数据来训练机器学习模型时，用\
  \ AI 生成的人工数据。它并不是为了取代测试数据（测试数据始终应该是真实数据）。它应该用于扩大训练数据量。合成数据是一项相对新的创新，主要是因为其他竞争方法无法生成真实的数据。人工智能是生成合成数据的催化剂。研究和预测机构\
  \ Gartner 对合成数据是这样说的：“到 2030 年，对于图像和视频数据，合成数据将占用于训练 AI 模型数据的 95% 以上”以及“到 2030 年，用于训练人工智能\
  \ (AI) 模型的数据中，合成表格数据的增长速度将至少比真实结构化数据快三倍。”⁵⁹\n\n在医疗保健、金融、保险、网络安全等领域，有多个原因使得合成数据具有吸引力：\n\
  \n*   许多领域的数据质量和数量都匮乏。\n*   人工智能以及在较小程度上，机器学习需要大型数据集。\n*   在医疗保健领域，HIPAA 法规严重限制了在使用带有任何患者标识符的医疗数据进行共享和使用的能力。\n\
  *   合成数据将使需要医疗数据的研发工作变得容易得多。\n*   它将有助于与期刊、制药公司和监管机构共享临床试验数据。\n*   如果合成数据能够增强临床试验、药物试验、降低标注成本等，将产生潜在的成本节省。\n\
  *   合成数据研究不需要特殊的披露或 IRB（机构伦理委员会）批准。\n*   在金融领域，它可以用于风险建模和欺诈检测。\n*   在保险领域，它可以用于风险评估、承保和理赔分析。\n\
  *   在网络安全领域，它可以用于识别漏洞和和模拟网络攻击。\n*   合成数据可以用于创建质量和数量满意的新教育数据集。\n*   合成数据可以增强目标类别不平衡的数据集。\n\
  *   合成数据可能改进模型，并且如果它可以平衡特征（例如 `gender`、`race` 等）以及类别，这可能会导致更少的模型偏见和更好的预测。\n*   合成数据可以用于“创新沙盒”。\n\
  \n#### 2.5.2 合成数据\n\n2017 年，Mitre 公司开发了 `Synthea`，基于 `FHIR` 生成合成数据。访问合成数据的多种方法，包括\
  \ `STU3`、`DSTU2`、`R4`、`CCDA` 和 `CSV`。\n\n以下是 `Synthea` 可以生成的部分列表：\n\n*   `Birth`\
  \ 到 `death` 生命周期\n*   `Longitudinal` 纵向数据\n*   `Demographics` 人口统计\n*   `Medical`\
  \ 医学与 `conditions` 状况\n*   `Encounters` 诊疗：`Primary Care`、`Emergency Room`\n*  \
  \ `Formats` 格式：`STU3`、`DSTU2`、`R4`、`CCDA`、`CSV`\n\n**表 2.6 Synthea 生成**\n(images5)\n\
  \n#### 2.5.3 AI 生成的合成表格数据\n\n早期生成合成数据的方法围绕匿名化、伪匿名和统计方法。这些方法在很大程度上已被 AI 取代。有多种类型的人工神经网络能够生成合成数据。这意味着不仅可以生成表格数据，还可以生成复杂的图像。在本节中，我们只讨论合成表格数据。最常用的\
  \ AI 方法是`生成对抗网络 (GANs)`。其他方法包括`自动编码器`、`长期记忆 (LSTM)` 网络和`集成学习`。到为止，有八家供应商能够生成合成表格数据，但这个列表正在增长。\n\
  \n##### 2.5.3.1 如何确定合成数据是否准确？\n\n最紧迫的问题是合成数据模拟原始（真实）数据的接近程度？大多数权威通过三个标准来判断合成数据：\n\
  \n1. 相似性（保真度）：合成数据与真实数据有多相似？\n2. 效用性：使用合成数据创建的模型与真实数据相比是否产生相似的结果？\n3. 隐私性：合成数据与真实数据相比有多大（主要基于距离）？\n\
  \n**相似性：** 有多种用于相似性的统计测试。以下是比较真实数据与合成数据的指标的部分列表：\n\n*   准确性很大程度上取决于统计测试。例如，原始数据和合成数据的\
  \ `cholesterol` 平均值应该足够相似，使得 p 值 > 0.05。\n*   对连续数据使用 `t-tests` 或 `Wilcoxon Rank\
  \ Signed Sum Tests`，对分类数据使用`卡方检验`。\n*   `Pearson` 和 `Spearman` 相关性应该是相似的。\n*   变量之间的`散点图`关系应该是相似的。\n\
  *   置信区间重叠。\n*   `互信息`（Orange Rank 组件）显示的自变量和因变量之间的关系应该是相似的。\n*   `分布`应该是相似的。使用\
  \ `Kolmogorov-Smirnov ` 来比较分布。\n\n合成的数据量可能是重要的。在 Benaim 等人的研究中，他们确定中等规模的数据（300-700\
  \ 受试者）可能仅提供中等的准确性，因此数据越多越好。⁶³-⁶⁷\n\n##### 2.5.3.2 合成数据与原始数据的比较\n\n使用合成数据生成器 `Gretel`，利用人工和长短期记忆\
  \ (LSTM) 方法生成了模拟心脏病预测数据集的数据。⁶⁸\n\n\n\n\n表 2.7 显示了原始数据与合成数据的对比。根据 `Wilcoxon Rank\
  \ Signed Sum Test` 的判定，对于这些数值变量，两个数据集之间的差异在统计学上并不显著（`p >0.05`）。⁶⁹\n\n图 2.55 使用心脏病预测数据集展示了真实数据与合成数据数值分布的直方图。结果非常接近，因此具有良好的相似性。\n\
  \n效用（Utility）：图 2.56 显示了在真实心脏病预测数据与合成数据上使用逻辑回归的分类模型性能。结果再次是相似的，因此具有良好的效用。此外，合成数据和真实数据都通过最初按\
  \ 70/30 划分的 90 名患者的留出数据进行了评估。真实数据和合成数据的测试结果高度相似。这被称为 `TSTR`，即“在合成数据上训练，在真实数据上测试”。\n\
  \n![](img/image-2831BIBC.png)\n\n图 2.55 使用真实和合成数据的数值变量直方图\n\n![](img/image-DQFIJLWS.png)\n\
  \n图 2.56 真实与合成心脏病预测数据集的分类性能对比\n\n表 2.7 真实与合成数据集中数值的对比\n\n![](img/image-50XFSFPX.png)\n\
  \n隐私（Privacy）：所有合成数据生成平台都会生成隐私报告。在 Gretel 中，会报告隐私保护级别，并提供若干选项来维护隐私：\n\n* 异常值过滤器（Outlier\
  \ filter）确保没有合成记录是离群值\n* 相似性过滤器（Similarity filter）确保没有合成记录与训练记录太相似\n* 隐私过滤器（Privacy\
  \ filter）可以设置为 `auto`\n* 过拟合选项确保模型训练在发生过拟合之前停止\n\n## 2.6 数据科学实验 (DSEs)\n\n**核心要点**：数据科学实验\
  \ (DSEs) 的最终目的是测试所有可能的数据准备、建模和优化方案，作为创建最准确、最实用的预测模型科学追求的一部分。每个 DSE 都应该有一个经过设计的假设待测试，并对实验结果和创建这些实验的数据集进行详细记录。应当启用第三方可复现性。如有疑问，就做实验。\n\
  \n### 2.6.1 数据科学中的实验性思维\n\n实验性思维是科学方法的根本方面，广泛应用于数据科学，用于测试各种假设，并对复杂问题和数据分析系统获得更深入理解。通过开展实验并分析结果，数据科学家可以做出明智的决策以提高预测模型的准确性。要在该领域取得成效，数据科学家必须具备强大的实验性思维和遵循逻辑过程的纪律，仔细记录设计和执行实验时所采取的所有步骤，以产生可靠且有效的结果。\n\
  \n图 2.58 重申了之前展示的 8 步数据科学流程，但该版本的流程展示了这一通用过程非线性的本质。需要注意的是，虽然遵循严格的指南和最佳实践具有巨大收益，但需要理解数据科学过程是非常动态、迭代的、对每个数据集都不同的，且有时是循环的。该过程的优先事项是不断提高模型的准确性，这需要极大的灵活性来处理意外情况和必要的调整，以满足单个实验或大型项目的目标。\n\
  \n图 2.57 中向上和向前的箭头序列显示了创建预测模型的逻辑演进，而向后的箭头则显示了为了实现建模目标所必要的修正、完善和改进的现实。\n\n![](img/image-3T6M7XEP.jpg)\n\
  \n图 2.57 数据科学 DISCOVER 过程的动态性和非线性本质\n\nAutoML（自动机器学习）是为特定的数据科学项目自动确定最佳算法和模型的过程。我们不建议或推荐\
  \ Auto-ML 代替数据科学家或其他分析师的工作。然而，Auto-ML 可以作为性能的竞争性基准，分析师应尝试改进它。将 AutoML 作为具有竞争性的第二选择可能是比较你自己的建模结果与\
  \ AutoML 结果的最安全方法。这种方法也可能帮助那些机器学习专业水平较低的分析师对构建预测模型建立更多信心。\n\nAuto-ML 现在已是数据科学中一个成熟的领域。⁷⁰\
  \ AutoML 应用的吸引力在于，机器学习水平较低的机构可以使用作为快速构建预测模型的方法。AutoML 系统的创建是为了减少数据科学家的工作量，以便没有特定机器学习知识的领域专家也能创建机器学习模型。⁷¹\n\
  \nKaggle 运行过许多 AutoML 对战人类的比赛， AutoML 参赛者（在没有任何人类帮助的情况下）始终排在前 10% 或 25%。⁷²-⁷³\n\n\
  根据《哈佛商业评论》的一篇文章说，完全依赖 AutoML 特性确实存在风险：“在缺乏适当专业知识、上下文化和数据互补性的情况下，盲目应用自动机器学习很难产生预期的结果。”⁷⁴\
  \ AutoML 绝不应被视为理解数据科学基础的替代品，因为数据中的细微差别可能导致建模过程中的问题或成功。其他人还指出，AutoML 的端到端自动化更多是一个目标而非现实。AutoML\
  \ 工具在解决模型公平性、可解释性和偏差问题方面面临特殊挑战。⁷⁵\n\n数据科学家可以在数据上进行许多实验，以比较不同模型和技术的性能。以下是建议在数据收集、规划和建模阶段可以运行的主要实验建议顺序。需要注意的是，这只是可能的实验序列之一，因为对每个数据集的考虑可能不同，会有一些来往反复，某些步骤可能会被完全跳过。以下是数据科学实验的一些示例：\n\
  \n1. 确定哪些数据划分和交叉验证选项产生性能最好的模型。\n2. 确保预处理和特征工程不会产生数据泄露情况。\n3. 确定哪些数据插补方法在不破坏数据可视化的情况下提高模型性能。\n\
  4. 确定针对低量数据集的什么增强/合成方法以及预测特征平衡方法效果最好。\n5. 确定额外的预测变量或计算特征是否能提高模型性能。\n6. 确定哪些类别平衡方法（如\
  \ `SMOTE`、`ADASYN`、上采样和下采样的组合以及其他方法产生最好的模型。\n7. 确定类别变量的哑 n-1 编码是否提高模型性能。\n8. 确定不同正则化水平的影响。\n\
  9. 确定数据重缩放（归一化和标准化）和/或幂变换是否提高模型性能。\n10. 确定消除异常值如何影响模型性能。\n11. 确定降维（`PCA`、`Ridge`\
  \ 和 `Lasso` 正则化、多共线性解决）如何影响模型性能。\n12. 确定哪些算法和算法选项产生最好的模型。\n13. 确定超参数调优是否提高模型性能。\n\
  14. 确定集成模型构建、模型堆叠和校准学习器是否提高模型性能。\n\n### 2.6.2 创建有效数据科学实验的九个步骤\n\n\n\n\n开展数据科学实验涉及许多步骤，具体步骤可能会根据实验的具体目标和方法而异。通常情况下，每项数据科学实验的主要步骤可能包括以下内容：\n\
  \n1.  创建研究问题、假设和/或要解决的定义问题。这些步骤有助于指导实验设计，并确保投入的精力与预期结果一致。\n\n2.  定义实验范围：确定实验范围，包括成本效益、算法和选项、性能指标以及要比较的方法。\n\
  \n3.  实验设计：创建并记录用于实验的 `Orange` 或 `JASP` 工作流。\n\n4.  样本量考虑：为实验确定合适的样本量，以确保结果的可靠和准确。在确定样本量时，考虑需要单独分析的分层组的数量非常重要。\n\
  \n5.  收集数据：通过抽样或访问现有数据集来收集实验所需的数据。\n\n6.  清洗和预处理数据：根据需要对数据进行清洗和预处理，为实验分析做好准备。注意，`Orange`\
  \ 中的某些算法具有默认预处理选项，可能需要修改以适应实验的特定需求。\n\n7.  清晰地记录 `DSE` 所需的所有实验。\n\n8.  记录实验结果：开发标准的评分卡矩阵，以记录和捕获实验中每个实验的结果。\n\
  \n9.  定义结论和下一步：请记住 `DSE` 可能并不适用。\n\n10. 创建最终报告：这涉及可能意识到默认设置的 `DSE`。\n\n## 数据科学实验复杂度等级\n\
  \n`DSE` 的目的是提高建模性能。`DSE` 的复杂度如下：\n\n### 第 1 级\n`DSE` 最基础。\n*示例：*确定使用 `Test` 和 `Confusion\
  \ Matrix` 组件时哪些算法最佳。\n\n### 第 2 级\n`DSE` 与 `Level 1` 相同。\n*示例：*确定使用 `Test` 和 `Confusion\
  \ Matrix` 组件时哪些算法最佳。\n\n### 第 3 级\n`DSE` 与 `Level 2` 相同。\n*示例：*确定使用 `Test` 和 `Confusion\
  \ Matrix` 组件时哪些算法最佳。\n\n### 第 4 级\n`DSE` 与 `Level 3` 相同。\n*示例：*确定使用 `Test` 和 `Confusion\
  \ Matrix` 组件时哪些算法最佳。\n\n### 第 5 级\n`DSE` 最复杂。此 `DSE` 有两个选项：1. 一次更改一个超参数。\n2. 设置\
  \ `DOE`（实验设计）。\n*示例：*确定使用 `parameter` 设置时哪些算法最佳，以观察它们如何影响建模性能。\n\n## 算法预处理默认\n\n\
  在计划实验之前，充分了解每个算法的预处理默认设置。图 2.58 显示每个算法的默认设置。要移除默认预处理，请将 `Preprocess` 组件连接到学习器。这将允许您自定义设置。\n\
  \n## 算法与其他组件的兼容性\n\n数据科学实验人员还应该注意算法、`Rank` 组件和 `Calibrated Learner` 组件之间的以下场景。图\
  \ 2.59 说明了它们是否可以接受来自各种算法的信号。不包含 `SVM`。\n\n`Calibrated Learner` 组件适用于二分类任务。该组件可以通过概率校准和决策阈值优化为其他二分类算法提供改进的学习。尝试此选项是确定是否能够实现建模性能提升的唯一方法。\n\
  \n\n\n\n在建模过程早期，解决缺失值、类别不平衡和数据量稀少等问题至关重要，因为这些问题会显著影响预测模型的性能和可靠性。一种有效的方法是优先进行解决这些挑战的实验，作为在数据集上运行的首批实验。这些实验可能涉及应用技术，如缺失数据插补、类别平衡方法（如过采样和/或欠采样），以及合成额外数据点或生成新特征等数据增强技术。通过解决这些问题，你可以为模型建立坚实的基础，并为进一步通过实验来提高预测模型的准确性和可靠性奠定基础。\n\
  \n在进行自己的实验时，拥有一组专门为数据科学实验（DSEs）设计的示例工作流作为参考是有益的。这些工作流可以作为你 DSE 规范、文档记录、风格和深度的指南，并确保你以一种系统且彻底的方式进行实验。你可能希望创建并汇集一套专门针对你自己的需求和偏好定制的工作流，以便未来能够参考并优化预测模型。此外，查看本节提供的示例工作流以获得进一步的灵感和指导可能会有所帮助。\n\
  \n### 2.6.6.1. 级 1 实验示例\n\n此级 1 实验示例的目的是确定 Orange 中提供的八种分类算法中，哪种算法预测糖尿病提供了最佳的模型性能指标。这是一个分类问题，因为目标是针对糖尿病的\
  \ 1/0（是/否）。数据集中只有 15% 的患者患有糖尿病，因此该数据集在类别之间是不平衡的。该集中没有缺失数据。\n\n![](img/image-CC1AUODR.jpg)\n\
  \n图 2.60 级 1 实验的 Orange 工作流\n\n![](img/image-BSBHHN54.jpg)\n\n图 2.61 级 1 实验的性能指标矩阵\n\
  \n该实验的 Orange 工作流如图 2.60 所示。该实验的性能指标显示在图 2.61 中训练数据的 `Test and Score` 小部件中。\n\n\
  图 2.61 显示的性能指标可以通过点击每个指标的表头从高到低或从低到高排序。Orange 中可用的所有性能指标并未显示在 `Test and Score` 小部件矩阵中。例如，`Precision\
  \ Recall` 曲线的 AUC 值显示在 `Performance Curve` 小部件中。需要注意的是，二分类总共有 24 个评估指标。然而，此级 1 实验仅关注\
  \ `Test and Score` 小部件中提供的默认指标。实验工作流中的 `Data Sampler` 小部件提供了 70/30 的训练/测试数据划分，并接受了所有算法预处理默认设置。要移除算法默认预处理，请将空的\
  \ `Preprocess` 小部件连接到 learner。\n\n如果你需要跟踪比 `Test and Score` 小部件显示更多的模型指标，可以在 Excel\
  \ 文档中创建自定义的性能指标矩阵，允许对感兴趣的每个单独指标进行颜色编码条件格式和排名。图 2.62 显示了自定义模型性能指标矩阵的模板示例。\n\n图 2.62\
  \ 显示的算法选项排名模板是一个虚构示例，矩阵中的虚假数字只是为了展示如何向矩阵中添加颜色编码以显示差异。\n\n![](img/image-Q3UYRH0.jpg)\n\
  \n图 2.62 性能指标矩阵\n\n### 2.6.6.2. 级 2 实验示例\n\n此级 2 实验的目的是在分类过程中添加正则化。除了我们现在有两个选项：`Lasso`\
  \ 和 `Ridge` 之外，所有其他设置与上一个示例相同。\n\n图 2.63 显示了级 2 实验相比级 1 实验增加的内容。\n\nGradient Boosting\
  \ 工作流现在有四个独立的小部件来显示各个性能：\n- `Gradient Boosting` (scikit-learn)\n- `Extreme Boosting`\
  \ (xgboost)\n- `Extreme Boosting Random Forest` (xgboost)\n- `Gradient Boosting`\
  \ (catboost)\n\nNeural Network 工作流现在有三个独立的选项来显示各个权重：\n- `L-BFGS-B`：拟牛顿法中的一种优化器\n\
  - `SGD`：随机梯度下降\n- `Adam`：基于梯度的优化器\n\nKNN 工作流现在有四个独立的选项来显示每个距离指标的各个性能：\n- `Euclidean`：两点之间的“直线”距离\n\
  - `Manhattan`：所有属性绝对差之和\n- `Maximal`：属性间绝对差的最大值\n- `Mahalanobis`：点与分布之间的距离\n\n该实验的\
  \ Orange 工作流如图 2.64 所示。该实验的性能指标显示在图 2.65 所示的 `Test and Score` 小部件中。\n\n遗憾的是，并非所有重命名的小部件都以新名称列在\
  \ `Test and Score` 性能指标矩阵中，因此在确定哪些算法选项与实验结果相关时，必须小心。\n\n\n\n\n\n### 2.6.6.3. 三 级实验示例\n\
  \n此三 级实验的目的是为所选实验添加额外的评估，例如皮尔逊相关性热图、分布图、散点图、箱线图、置信区间图、校准图以及其他评估选项。这可能是定量和定性评估的混合。\n\
  \n图 2.67 提供了与一 级和二 级实验相比的三 级实验内容的概要总结。\n\n![](img/image-WLHEW6PD.png)\n\n图 2.66\
  \ 用于显示扩展二 级模型指标的自定义性能指标矩阵模板\n\n![](img/image-23E4GRAN.jpg)\n\n图 2.67 与一 级实验相比，三\
  \ 级实验的额外内容\n\n### 2.6.6.4. 四 级实验示例\n\n此四 级实验的目的是探索一个具有多个级别选项的新因素，以确定哪个选项具有最佳的模型性能。以下是可以运行的一些额外实验示例：\n\
  \n- 确定哪种数据插补方法的性能最佳。\n- 确定哪种数据类平衡方法的性能最佳。\n- 确定哪种数据增强方法的性能最佳。\n- 确定哪种训练和测试数据划分/交叉验证方法的性能最佳。\n\
  - 确定哪种数据重缩方法能提供更好的性能。\n- 确定对每个交叉验证折进行数据重缩是否能提高模型性能。\n- 确定模型堆叠（stacking）是否能提高模型性能。\n\
  - 确定添加 `Calibrated Learner`（校准学习器）组件是否能提高模型性能。\n- 确定哪些算法和正则化设置可以减少共线性，从而产生准确且有效的预测变量排名。\n\
  - 确定新添加的特征在不增加共线性的情况下，排名是否靠前。\n- 确定哪种模型解释最能引起非技术利益者的共鸣。\n- 确定预测因子排名和建模结论对于数据集中的所有分层组是否有效。\n\
  \n图 2.68 提供了四 级实验内容的概要总结，并带有扩展的评分卡，以显示在不使用数据插补与各种数据插补选项相比时的模型性能变化。\n\n### 2.6.6.5.\
  \ 五 级实验示例\n\n这种最高级别的复杂度侧重于通过调整最佳算法的超参数设置，从预测模型中榨取更多性能。如果其他算法是领先位置的有力竞争者，它们也可以作为超参数优化（`HPO`）实验的候选。此实验有两个选项：1)\
  \ 每次只更改一个超参数，以随机或设置的间隔更改超参数；2) 设置统计实验设计（`DOE`），同时测试更广泛的超参数变化，以查看其如何影响模型性能。也存在自动化系统来执行枯燥的超参数调优，但在\
  \ `Orange` 或 `JASP` 中并不可用。⁷⁷\n\n![](img/image-SKJAXLCR.jpg)\n\n图 2.68 与一 级实验相比，四\
  \ 级实验的额外内容\n\n图 2.69 显示了在此类实验中可以尝试的超参数设置。颜色较深的框显示之前未出现过的实验设置。颜色较浅的框是之前在一 级、二 级或三\
  \ 级实验中介绍过的设置。`Orange` 中每个算法的帮助文件部分提供了所有超参数的详细描述。\n\n图 2.70 显示了一个简单的 HPO 实验示例，其中五个超参数中的两个正在被更改，以观察这些非默认更改如何影响训练数据模型指标。图\
  \ 2.70 中的阴影框显示了实验产生的最差和最佳指标。\n\n前所述，统计实验设计（`DOEs`）也可以同时测试更广泛的交互式超参数变化，以查看其如何影响模型性能。`JASP`\
  \ 在其质量控制下提供了 `DOE` 实验设置。`BlueSky Statistics` 支持比 `JASP` 多多的 `DOE` 设计设置和分析选项。关于 `DOE`\
  \ 如何支持 `HPO` 工作的讨论超出了本书的范围，因为这是一个非常复杂且专业的课题，仅适用于非常高级的数据科学工作。\n\n![](img/image-0HDWAKAG.png)\n\
  \n图 2.69 `Orange` 算法可用的超参数设置\n\n![](img/image-EBBJAZD4.jpg)\n\n图 2.70 一个小型超参数优化实验示例\n\
  \n## 2.7 ORANGE 数据与转换菜单组件\n\n“转换”（Transform）类别是 `Orange` 画布左侧垂直组件组顶部的第二个图标。将鼠标悬停在组件上即可查看组件名称。在\
  \ `Orange` 软件工具箱的数据处理、转换、数据可视化等部分，多个组件是必要且有用的。我们将仅介绍最重要的几个。右键点击任何组件并选择 `Help` 以获取有关该组件的更多信息、建议的工作流、示例等。这还将告诉你每个组件可接受的输入和预期输出是什么。\n\
  \n### 2.7.1 文件组件（File Widget）\n\n在这里你可以上传自己的数据、图像文件、文本，或从互联网下载数据。或者，你可以插入网站的 URL\
  \ 或 `Google Sheet`，数据将会被上传。此组件已加载了 6 个用于练习的数据集。如果你正在加载新数据集，不要忘记检查 `Orange` 为你的数据集列估计的\
  \ `Type` 和 `Role` 标记是否正确。例如，`Role` 部分提供了一个下拉菜单，选择以下选项之一：`Feature`（特征）、`target`（目标）、`meta`（元数据）或\
  \ `skip`（跳过）（见图 2.71）。`Type` 下拉菜单提供以下选项：`categorical`（分类）、`numeric`（数值）、`text`（文本）或\
  \ `dateline`（日期）（见图 2.71）。你可以通过选择 `Role` 列中的项进行更改。最后，在对这些设置进行任何更改后选择 `Apply`。`CSV\
  \ File Import` 组件用于复杂的 CSV 文件。\n\n![](img/image-81AIU9TE.jpg)\n\n图 2.71 组件中数据列的\
  \ Type 和 Role 选项\n\n### 2.7.2 数据集组件（Datasets Widget）\n\n此组件提供了 `Orange` 数据集（65 个），涵盖了多个供练习主题。它列出了大小、实例（行）、变量（预测因子）、`target`（结果\
  \ - 数值或分类）、标签（例如生物学）以及参考文献（与数据集相关的文章）。如果 `target` 是分类，则可以使用这些数据进行分类分析、逻辑回归和其他分析技术。如果\
  \ `target` 是数值，它可以用于数值数据分析技术、线性回归和许多其他分析技术。这些数据集以及更多数据托管在 `Orange` 网站上，以 `.tab`\
  \ 文件形式存在。⁷⁸ 查看下方的图 2.72 可获得可用数据集的部分列表。\n\n### 2.7.3 数据表组件（Data Table Widget）\n\n\
  \n\n\n\n这里你可以以表格的形式查看数据，类似于查看电子表格。你可以查看数据但无法进行操作，除了按升/降序排序以外。如果你想知道数据在处理后的样子如何，可以在\
  \ Orange 工作流中在某次数据处理活动之后插入另一个数据表。数据表在左上角提供了摘要统计信息。你还可以选择按类别（结果）添加颜色。你可以在图表或混淆矩阵中选择/点击数据点并连接到数据表，以查看感兴趣数据点的值。注意，此小组件的右侧是哈希的，这意味着它可以连接到其他小组件。你可以通过在数据表中高亮/选择感兴趣的行来过滤特殊组或单独行，然后将其连接到第二个数据表或显示所选行的可视化小组件。过滤后的数据也可以\
  \ `Save Data` 组件保存。\n\n![](img/image-F6TBCDA3.jpg)  \n\n图 2.72 `Dataset` 组件中的某些数据集\n\
  \n![](img/image-997L1HPT.png)  \n\n图 2.73 数据表组件\n\n### 2.7.4 Paint Data Widget（绘制数据组件）\n\
  \n该组件用于创建和对数据或数据点进行编码。你在 X-Y 散点图矩阵上“绘制”的任何数据都将自动转换为真实数据坐标，并可以在连接到 `Paint Data` 组件的\
  \ Orange 数据表中查看。然后，可以在该数据上运行任何有效的 Orange 分析选项。例如，你可以创建带有子组的数据簇，然后运行分析。你可以将此组件连接到数据表，并查看你绘制数据的精确坐标。此外，你还可以以线性方式绘制数据，并使用\
  \ `scatter plot` 和 `linear regression` 组件来评估模型。我们将使用此组件进行多次练习。这是一个极佳的教学工具。参见图 2.74，其中包含四个组的绘制数据集。\n\
  \n图 2.75 显示了当将 `Scatter Plot` 组件连接到此 `Paint Data` 组件时会发生什么。它清楚地显示，尽管整个数据集有一条下降趋势的回归线，但数据中的四个子组中的每一个都呈现上升趋势。这是辛普森悖论的一个例子，其定义为“概率和统计学中的一种现象，即在几组数据中出现的趋势，在组合这些组时会消失或反转。”\
  \ ⁷⁹\n\n图 2.76 显示了这种辛普森悖论的示例如何适用于假设的医院情况：单个部门的患者满意度得分随着人员水平的增加而提高，但随着人员水平的增加，整个医院的患者满意度得分似乎处于下降趋势\n\
  \n### 2.7.5 Data Sampler Widget（数据采样组件）\n\n该组件可以执行以下操作：\na. 将数据分为固定比例，例如 70% 训练集和\
  \ 30% 测试。你可以设置两个输出连接器，以便单独从测试数据中对训练数据进行评估。（参见图 2.77）\nb. 固定样本大小，例如 100 个实例。带放样的选项意味着在创建的样本中，数据点可以被多次选取。\n\
  c. 交叉验证 (CV) 允许你选择例如 10 个子集（折），以便你在九个折上进行训练并在一个折上进行测试。此 CV 过程将所有数据随机划分为等大小的组。模型在每个折上进行训练和验证，直到所有折都已用于训练和验证。报告的结果是每个折的平均结果。CV\
  \ 有助于减少预测模型中的过拟合。交叉验证也是我们将使用的 `Test and Score` 组件的一部分。\nd. Bootstrap（自助法）是一种技术，你通过带放回的方法选择多个数据子集，然后平均结果以估计整个总体的结果。许多数据集通常是非常平衡的，因此确保选择“stratify\
  \ sample（分层采样）”选项是一个好主意，这将确保训练和测试数据集获得少数类的相同比例。\n\n![](img/image-FJIME7MG.jpg) \
  \ \n\n图 2.74 `Paint Data` 组件\n\n![](img/image-QR2NDFNI.jpg)  \n\n图 2.75 `Scatter\
  \ Plot` 组件对 `Paint Data` 示例的显示\n\n![](img/image-LN1OPLM9.jpg)  \n\n图 2.76 使用 `Paint\
  \ Data Widget` 创建的医院辛普森悖论示例\n\n执行上述的采样选择，必须点击底部的 `Sample Data` 按钮。我们将在后面的章节中详细介绍交叉验证。此外，此组件可以对数据进行过采样或欠采样，我们将在分类模块中进一步详细介绍此选项。（图\
  \ 2.77）\n\n![](img/image-48JBC2HH.jpg)  \n\n图 2.77 `data sampler` 组件\n\n图 2.78 显示了\
  \ `Data Sampler` 组件，选择了默认选项随机划分 70/30 训练/测试（213/90 名患者）。图 2.78 显示了连接到 `data sampler`\
  \ 然后连接到 `test and score widget` 的 `file` 组件。你需要确保 `test and score widget` 同时接收训练数据和测试数据。为了做到这一点，右键点击\
  \ `data sampler` 和 `test and score widget` 之间的链接，选择 `reset signal`，并将剩余数据连接到测试数据。参见图\
  \ 2.79。\n\n在 `Data Sampler` 组件中，固定样本大小和 `Bootstrap` 选项在推荐使用它们之前需要进一步的验证。\n\n###\
  \ 2.7.6 Select Columns Widget（选择列组件）\n\n在此组件中，你可以选择某些列进行分析并忽略其他列。你也可以在 `File` 组件中选择\
  \ `Skip（跳过）` 来排除列。我们将使用 Kaggle Latest Data Salaries 数据集。⁸ 例如，我们不需要包含其他国家的货币，也不需要包含员工居住地，因此它们未包含在内。其他特征和目标保持不变。元属性（Meta-attributes）包含在数据集中，但大多数方法并不会考虑它们。\n\
  \n![](img/image-OHNS0X5R.jpg)  \n\n图 2.78 data sampler 组件工作流\n\n![](img/image-HK5LAJMR.jpg)\
  \  \n\n图 2.79 编辑选项\n\n### 2.7.7 Select Rows Widget（选择行组件）\n\n该组件允许你选择（过滤）某些行并忽略其他行。在这个示例中，我们将选择全职且年份为\
  \ 2023 的。换句话说，你只选择了 2023 年的全职工作。要验证这个新数据集，请连接到数据表和/或可视化组件。你可以将 `Select Rows` 组件连接到双路数据表或可视化组件。右键点击连接器，将一个设置为\
  \ `Matching data >> data`，另一个设置为 `Unmatched data >> data`。因此，一个将显示 2023 年全职工作的结果，另一个将显示其他人。参见图\
  \ 2.81。\n\n### 2.7.8 Edit Domain Widget（编辑域组件）\n\n你可以更改变量的名称和类型。例如，你可以将 `employee\
  \ residence` 更改为 `employee country`。参见图 2.82。在进行任何更改后不要忘记选择 `apply（应用）`。你可以通过将 `Edit\
  \ Domain` 组件连接到 `Data Table` 组件来检查更改是否应用。\n\n![](img/image-WS5ECP1T.png)  \n\n图\
  \ 2.80 选择列组件\n\n![](img/image-UYB64VGU.png)  \n\n图 2.81 选择行组件\n\n### 2.7.9 Transpose\
  \ Widget（转置组件）\n\n该组件将数据表的行转换为列，将列转换为行。这有时是必要的，以使数据表格式符合小组件的格式需求。\n\n### 2.7.10\
  \ Pivot Table Widget（透视表组件）\n\n透视表通过切换（透视）行和列来提供数据的不同视图。图 2.83 显示了一个透视表，我们选择专业水平作为行，公司规模作为列，并将值（数值）作为平均薪资。根据透视表，更高级的职位薪资更高，中大型公司的薪资也比小公司高。\n\
  \n### 2.7.11 Rank Widget（排序组件）\n\n\n\n\n\n此组件用于对预测变量的重要性进行排序，这对于预测模型非常有帮助。它适用于分类和回归。虽然此组件具有多种评分方法，但我们建议将信息增益方法作为默认方法。下面列出了\
  \ `Rank` 组件中提供的七种排名评分选项。\n\n- **信息增益（Information gain）** 告诉你特征对模型性能的贡献，在这种情况下，它被称为互信息。信息增益也可用于确定决策树的分裂。它使用熵的公式来计算获得的信息，这决定了首先对哪些变量进行分裂。从数学上讲，信息定义为\
  \ 1 减去熵。有关此主题的更多信息请参见第 5.5.1 节。\n\n![](img/image-HM0ZL0LA.png)\n图 2.82 领域域编辑组件\n\
  \n![](img/image-NIGKV1DS.png)\n图 2.83 数据透表组件\n\n- **信息增益率（Information gain ratio）**\
  \ 是信息增益与固有信息之比。固有信息被视为一种修正因子，决定了我们需要多少信息才能确定特定实例属于哪个分支。⁸¹ 对于树模型，它的目标是“在选择属性时考虑分支的数量和大小，以减少对多值属性的偏向”。\n\
  \n- **尼尼系数下降（Gini decrease）**。要理解的第一概念是尼尼不纯度（Gini impurity），它指决策树分裂时产生的不完美性。纯的分裂意味着节点仅包含相同的结果（例如，只有垃圾邮件）。尼尼系数的平均减少量衡量了每个变量对结果树中节点和叶子纯度的贡献。平均尼尼下降得分越高，该变量对模型就越重要。⁸²\n\
  \n- **ANOVA（方差分析）** 选项是一种统计检验，用于分析两个以上组之间均值的差差异。统计学上的显著结果意味着两个均值不相等。⁸³ 在 `Rank`\
  \ 组件中，当 ANOVA 不适用时，会显示 `NA`。\n\n- **卡方统计（Chi-square X² statistic）** 是一个单一的数字，它告诉我们观测计数与假设总体中不存在关系时的预期计数之间存在多大差异。在\
  \ Orange 中，较高的卡方统计量表示特征与类别之间的依赖性越高。⁸⁴\n\n- **ReliefF** 是一种评分方法，它整合了属性在相似数据实例之间区分类别的能力。⁸⁵\n\
  \n- **FCBF（基于相关性的快速过滤）** 是一种基于熵的度量，它可以识别特征之间两对相关性导致的冗余，而无需进行两对相关性分析。这种方法被证明特别适用于分析高维数据。⁸⁶\n\
  \n你可以选择多种一种评分方法。默认情况下，所选标准会列出排名前 5 的预测变量。根据此，我们看到职位名称排名最高，其次是员工居住地（国家）。见图 2.84。如果你突出显示前五个选项，可以将\
  \ `Data Table` 组件连接到 `Rank` 组件，现在你就拥有了一个只包含最佳预测变量的较小数据集。你可以使用 `Save Data` 组件将其保存。\n\
  \n此外，`Explain` 模块（插件）有一个特征重要性组件，也非常有用，我们将在另一章中讨论它。\n\n![](img/image-F6BWKXHD.png)\n\
  图 2.84 Rank 组件\n\n![](img/image-8JU7BVCP.jpg)\n图 2.85 相关性组件\n\n### 2.7.12 相关性组件\
  \ (Correlation Widget)\n\n此组件使用皮尔逊（参数化 - 正态分布假设）或斯皮尔曼（非参数 - 非正态分布假设）统计方法显示数值变量之间的相关性。相关性组件位于无监督学习模块。你可以选择特定的相关性或选择“所有组合”。它将列出正相关和负相关。在下面的图\
  \ 2.85 中你可以看到年龄与最大心率（在跑步机上）有强烈的负相关，但与钙化冠状动脉数量有强烈的正相关。\n\n![](img/image-8OYA0Y79.png)\n\
  皮尔逊相关性 (StatQuest)\n\n### 2.7.13 合并数据组件 (Merge Data Widget)\n\n此组件合并两个表格、Excel 文件或\
  \ CSV 文件。这是许多分析师和研究人员经常需要的一项任务。你可能在一个文件中拥有某些感兴趣的数据，而其他需要的数据分布在两个或更多其他文件中。虽然这种技术比编写\
  \ `SQL` 查询简单，但它可能会令人困惑，因为在选择 Orange 中的正确选项之前，必须考虑各种情况。图 2.86 显示了合并两个数据集的基本工作流，但要成功完成此任务，需要深入研究\
  \ `Merge Data` 组件中提供的各种选项，以便正确完成任务。\n\n![](img/image-SAS009EN.png)\n图 2.86 合并数据组件\n\
  \n`Merge Data` 组件用于根据特定的目标列水平合并两个数据集，该列将用于行“匹配”的用途。为了演示 `Merge Data` 组件中提供的前三个合并选项，让我们先看两个非常简单的数据文件，我们想要出于分析目的合并这两个文件，仅用于演示每种合并技术的不同用途。这两个患者文件中的除了用于该医疗机构的特定患者编号外，每个文件还提供了两列额外的患者数据。图\
  \ 2.87 显示了我们正尝试合并成一个文件的两个简单文件。\n\n图 2.88 显示了 `Merge Data` 组件提供的前三个基本水平合并选项。这三种合并选项是多个高级软件包中提供的经典合并技术，Orange\
  \ 尽力通过尽可能最少的步骤来简化这一合并过程。]\n\n![](img/image-PE777LLU.jpg)\n图 2.87 Merge Data 组件中的三个文件合并选项\n\
  \n每当从不同的文件合并数据时，我们需要一个公共的引用列用于行匹配。在这个示例中，我们使用一个特定的唯一的患者编号作为该公共引用列。Orange 将此称为“行匹配”选项，必须为每个文件选择该选项。在这个示例中，我们选择患者编号作为“行匹配”选项，如图\
  \ 2.88 所示。Orange 不喜欢带有“#”符号的文件表头名称，当表头中有此“#”符号时，它将不会进行合并。\n\n#### 合并选项 #1 - 从额外数据追加列（左连接）\n\
  \n在 `Merge Data` 组件中选择合并选项 `#1` 的目的是只关注文件 `#1` 中列出的患者编号。在这种情况下，我们不对文件 `#2` 中列出的额外患者编号感兴趣。然而，我们将接受该文件中额外列中的任何缺失数据。图\
  \ 2.89 显示了如果选择合并选项 `#1`，合并后的文件样式版本。\n\n![](img/image-WV3ZAON9.jpg)\n图 2.88 要合并的两个简单文件及不同的\
  \ Merge Data 组件选项\n\n我们从图 2.90 中可以看到，合并选项 #1 忽略了患者 #6 的信息行，因为该患者未列在文件 #1 中。\n\n\
  ![](img/image-TS2T757R.jpg)\n图 2.89 选择合并选项 #1：从额外数据追加列（左连接）的合并输出\n\n#### 合并选项 #2\
  \ - 寻找匹配行对（内连接）\n\n\n\n\n\n在 `Merge Data`（合并数据）组件中选择合并选项 #2 的目的是仅关注在 `file #1` 和\
  \ `file #2` 中都列出的患者编号。在这种情况下，我们对仅列在 `file #1` 或 `file #2` 中的患者编号不感兴趣。然而，我们将接受这些文件中额外列中的任何缺失数据。图\
  \ 2.90 显示了如果选择合并选项 #2，合并后的文件样式化版本。\n\n![](img/image-FJSV4TW5.jpg)\n\n图 2.90 合并选项\
  \ #2 的合并输出：查找匹配行对（内连接）\n\n## 合并选项 #3 - ConcatenateTables（连接表 - 外连接）\n\n在 `Merge\
  \ Data`（合并数据）组件中选择合并选项 #3 的目的是关注出现在 `file #1` 或 `file #2` 中的**所有**患者编号。此外，我们将接受这些文件中额外列中的任何缺失数据。图\
  \ 2.91 显示了如果选择合并选项 #3，合并后的文件的样式化版本。此选项合并了任一文件中任何列出患者可能存在的任何完整或部分数据。\n\n## 2.7.14\
  \ Randomize（随机化）组件\n\n此组件将对类别、特征、元数据或这些选项的任何组合进行随机化。任何玩过牌牌的人都知道，每场游戏开始前都会进行通常的“洗牌”和“切牌”仪式，旨在确保每个新游戏对所有参与者来说都有新鲜且公平的胜败机会。\n\
  \n![](img/image-2LOTHKBV.jpg)\n\n图 2.91 合并选项 #3 的合并输出：连接表（外连接）\n\n在机器学习和预测建模中，我们的目标与纸牌游戏相同，但目的不同。在机器学习中，我们通常首先从原始数据集中拆分（洗牌）出训练集、测试集以及可能的额外验证集。我们可以通过“洗牌”数据集中的行来实现这一目标，使它们不会以任何偶然顺序排列，否则这种顺序可能会使训练、测试和验证集的公平且随机划分变得更加困难。\n\
  \n洗牌的目标是以无偏见的方式创建这些随机划分，而不对数据集中的任何自然或隐藏的子集产生偏袒。无意中按任何逻辑或隐藏顺序格式化数据集，可能会与任何机器学习分析技术随机创建无偏的训练、测试和其他验证数据组的能力发生冲突。\n\
  \n以下是一些受益于随机行洗牌的情况示例：\n\n- 类别数据按字母顺序预排序或排序的数据集。\n- 按特定数据列的数值顺序预排序或排序的数据集。\n- 按类别定义（如\
  \ 0 或 1）预排序或排序的数据集。\n- 按任何其他逻辑顺序预排序或排序的数据集。\n- 按数据源、传感器、机器、部门、性别、位置、年龄组、疾病定义或其他特定的分层数据输入源预排序或排序的数据集。\n\
  \n数据行洗牌的目的是防止算法在搜索数据模式时，在训练、测试和验证组中获得任何不公平的优势或子集不平衡。⁸⁶-⁹¹\n\n数据集的数据行洗牌确保了训练、测试和其他验证组的无偏且随机创建。洗牌只是数据科学工具箱中的另一种工具，旨在预测模型的准确性和无偏性。\n\
  \n数据行洗牌的目标是引入随机性并消除数据中任何固有的顺序或偏见。它有助于减少方差并防止模型对数据中的特定模式或序列过拟合。然而，`Orange Randomize`\
  \ 组件无法保证这一要求，因为它是随机化某一列中数据的顺序，而无意维护行内容。因此，如果你打算保持行信息完整并仅行与行之间进行洗牌，则这被认为是一种应避免的风险操作。\n\
  \n以下是 Orange 如何描述该组件以及预处理器组件中提供的“随机化（randomize）”列功能：“随机化类别（Randomize classes）会洗牌类别值并破坏实例与类别之间的连接。同样，人们可以随机化特征或元数据。如果开启了可重复的洗牌，则随机化结果可以通过保存的工作流进行共享和重复。这主要用于高级测试和教育目的。”\n\
  \n换句话说，这种 Orange 列“洗牌”功能不应与经典的行“洗牌”混淆，后者会将数据集中整个行的顺序随机化。行洗牌可能是一项有用的任务，以进一步确保用于训练、测试和其他验证组成员的行具有随机性。\n\
  \n## 2.7.15 Concatenate（连接）组件\n\n`Concatenate` 组件用于垂直合并两个数据集，这意味着它将新文件中的新数据添加到列表底部。换句话说，它是将两个文件垂直堆叠在一起，这与\
  \ `Merge` 组件使用的过程不同。例如，你可以将具有 100 个实例（行）的新数据集添加到现有的 200 行数据集中，最终数据集将具有 300 行数据。图\
  \ 2.92 显示了 `Concatenate` 组件提供的四种垂直合并选项。\n\n让我们使用连接选项 #1 连接图 2.92 所示的两个文件。图 2.93\
  \ 显示了结果。应该注意的是，这种垂直连接结果与使用 `Merge` 组件水平合并这些相同文件的结果相比非常不同，如图 2.90、2.91 和 2.92 所示。\n\
  \n应始终选择连接选项 1 或 2，而选项 3 和 4 是可选的。如果选择连接选项 2 来连接图 2.93 所示的两个，结果将只有一列患者编号，因为这是在两个文件中都出现的列。\n\
  \n![](img/image-FLT0ZGK4.jpg)\n\n图 2.92 四种连接选项\n\n![](img/image-DI87DR.jpg)\n\n\
  图 2.93 变量合并选项 #1：使用所有输入变量\n\n## 2.7.16 Preprocess（预处理）组件\n\n此组件提供了十种数据表预处理选项，如图\
  \ 2.95 所示。每个预处理器都提供了预处理器文件中描述多个选项。以下是十种可用预处理器的要说明：\n\n1. 连续值的离散化（Discretization\
  \ of continuous values）：创建数据箱。\n2. 离散值的连续化（Continuization of discrete values）：创建虚拟变量、独热编码和其他任务。\n\
  3. 缺失值填充（Impute missing values）：提供各种缺失数据填充选项。\n4. 选择相关特征（Select relevant features）：类似于\
  \ `Rank` 组件；该预处理器仅输出信息量丰富的特征作为列，排名最高的预测器位于左侧。得分可以通过信息增、增益率、基尼指数、ReliefF、快速相关过滤、ANOVA、Chi2、RReliefF\
  \ 和单变量线性回归确定。\n5. 选择随机特征（Select random features）：输出原始数据的固定数量特征或比例。这主要用于高级测试和教育目的。\n\
  6. 特征归一化（Normalize features）：调整值到共同尺度、通过均值或中位数对值进行中心化，或完全省略中心化。类似于缩放，可以根据标准差（SD）、跨度进行缩放，或者完全。\n\
  7. 实例随机化（Randomize instances）：洗牌类别值并破坏实例与类别之间的连接。同样，人们可以随机化特征或元数据。这主要用于高级测试和教育目的。\n\
  8. 移除稀疏特征（Remove sparse features）：仅保留非零/缺失值超过数量或百分比的特征（列）。其余丢弃。\n\n\n\n\n\n# 9.\
  \ 主成分分析 (PCA)：输出 PCA 转换的结果。与 PCA 小部件类似。PCA “在简化高维数据复杂性的同时，保留了趋势和模式。”它通过将数据转换为更少的维度来实现这一点，这些维度作为特征的总结。”\
  \ ⁹² PCA 将第 7 章中进一步讨论。\n\n# 10. CUR 矩阵分解：是一种类似于 SVD 的降维方法。\n\n此组件最大的优势是它可以在一个组件中执行多个数据预处理步骤。这种“合一”组件的缺点是它不具备它尝试整合的各个独立组件所拥的所有选项和功能。例如，如果选择了\
  \ `Preprocess` 组件，则包含以下组件提供的更多选项：`Continuize`（连续化）、`Discretize`（离散化）、`Randomize`（随机化）、`PCA`、`Impute`（填补）和\
  \ `Rank`（排序）。当 `Preprocess` 组件打开时，双击左侧所需的预处理器，它将出现在右侧；或者，将其拖动到右侧以激活它。见图 2.94。注意：Orange\
  \ 设计者建议将 `Preprocess` 组件直接连接到 `Test` 和 `Score` 组件。见图 2.95。\n\n![](img/image-2ENCSWP2.jpg)\n\
  \n图 2.94 Preprocess 组件\n\n![](img/image-MW8KNRI5.png)\n\n图 2.95 Preprocess 工作流\n\
  \n![](img/image-3KS5TD8I.jpg)\n\n图 2.96 JASP 使用箱线图进行异常值检测\n\n## 2.7.17 离群值组件 (Outliers\
  \ Widget)\n\n对于连续变量，异常值分析是任何数据分析项目中非常重要的方面。在删除离群值之前，需要对它们进行调查和理解，因为它们看起来是数据集中不或可疑的数据点。\n\
  \n让我们先理解统计离群值的定义。离群值可以从整个数据集中识别，但最好在分层内（例如本例中的性别）进行调查。离群值通常借助箱线图的帮助识别，如图 2.96 所示，通过\
  \ `JASP` 对该糖尿病数据集进行识别。位于箱线图末端视觉“围栏”之外的数据点被称为离群值，它们在箱线图上以点的显示。箱线图用于识别离群值起始区域的数学方法如图\
  \ 2.96 所示。`JASP` 可以创建经典的箱线图（如血糖水平所示），或者在 `JASP` 称为雨云图（raincloud plot）中创建水平箱线图，该图叠加了直方图、点图和箱线图，以提供血糖数据的多种可视化。可以从\
  \ `JASP` 中的 `ANOVA` 和 `Descriptives` 选项卡创建箱线图、雨云图和描述性统计表。\n\n![](img/image-8ON5XKN6.jpg)\n\
  \n图 2.97 Orange 工作流，在各种可视化中显示离群值和正常值\n\n在 Orange 的 `Outliers` 组件中，有四种不同的离群值检测方法：`One\
  \ Class SVM`、`Covariance Estimator`（协差估计器）、`Local Outlier Factor`（局部离群因子）或 `Isolation\
  \ Forest`（隔离森林）。默认是“局部离群因子”（`LOF`），它使用 k-最近邻算法。`LOF` 测量给定样本相对于其邻居的密度局部偏差，密度低于其邻居的样本被认为是离群值。`LOF`\
  \ 也是一个 `Python` 包。⁹³\n\n离群值或正常值（消除了离群值后的值）可以在单独的图形中识别和可视化。图 2.97 显示了一个双管的 Orange\
  \ 工作流，允许在顶部部分查看所有数据，并在 `Outliers` 组件的帮助下在底部部分仅显示正常值。\n\n图 2.98 显示了连接到图 2.97 工作流上、下两部分的几个可视化组件的结果，以查看对于选定的数据集，在有和无离群值的情况下分布图和散点图的样式。\n\
  \n![](img/image-MT8FWXOK.jpg)\n\n图 2.98 有和无离群值的可视化结果\n\n## 2.7.18 连续化组件 (Continuize\
  \ Widget)\n\n此组件将离散变量转换为数值（连续）哑变量。这在本章之前已经讨论过。这种用法的一个示例是在无监督学习分析之前将离散变量转换为数值变量。该组件中有多个选项，默认使用第一个选择。将\
  \ `File` 组件连接到 `Continuize` 组件，然后连接到 `Data Table`。在图 2.99 中，类别数据被转换为数值。注意由于“独热编码”（one-hot\
  \ encoding），属性的数量增加了。独热编码意味着列中的每个类别将获得自己的 1/0（是/否）列。这是通过在 `Continuize` 选项中选择“每个值一个变量”（One\
  \ variable per value）实现的。胸痛现在有 3 列，对于第一个患者，典型心绞痛 = 1，这意味着该患者患有此病。然而，将类别列分解为每个选项的哑变量会触发哑变量陷阱，可能会给某些算法带来问题。为了避免哑变量陷阱，请选择类别特征第一个或第二个选项：“第一个值作为基准”（First\
  \ value as base）或“最频繁值作为基准”（Most frequent value as base），这将比类别变量的总数少一列。这被称为 n-1\
  \ 转换。\n\n## 2.7.19 离散化组件 (Discretize Widget)\n\n此组件将数值数据转换为类别。这对于关联规则分析是必要的，我们将在单独的章节中涵盖这一点。⁹⁴\
  \ 有几个选项，例如等频、等宽等。在图 2.100 中，对年龄选择了手动选项，间隔为每 10 年（一个十年）。\n\n## 2.7.20 特征构造器组件 (Feature\
  \ Constructor Widget)\n\n此组件使用 `Python` 中使用的各种数学函数来转换数值和类别变量。机器学习始终应该遵循被广泛接受的“免费午餐定理”，这意味着你不应该期望你最喜欢的算法是所有模型和所有数据集的赢者。⁹⁵\
  \ 为了让所有算法及其多个选项都有提供最佳预测模型可能，可能需要特征转换来使偏态特征看起来更正态。例如，我们可以通过 `log10` 转换将糖尿病数据集中高度偏态的血糖特征转换为更正态的分布形状。还有许多其他转换可以创建更正态的分布。⁹⁶\n\
  \n![](img/image-LE8PZCTS.png)\n\n图 2.99 Continuize 组件\n\n![](img/image-VLHU0R0Z.png)\n\
  \n图 2.100 Discretize 组件\n\n图 2.101 显示了一个使用 Orange `Distribution` 组件和可选的 `JASP` 箱线图来实现并测试特征转换可视化的工作流。图\
  \ 2.101 左下方的两个图显示了空白和正确填充的构造器组件。这是通过在特征构造器组件中遵循以下步骤实现的：`New > select Numeric > replace\
  \ X1 with the new variable name: Log10 Glucose > select function: log10 > select\
  \ feature to be added within the ( ) signs: add glucose > send`。然后连接数据表查看新变量，并将其连接到\
  \ Distribution 组件查看分布的变化。右下方还显示了原始和 log10 转换后血糖数据的分布图和箱线图。我们可以看到，log10 转换很有帮助，但没有完全实现对称的正态分布。这对于许多用途可能足够了，但也值得尝试幂转换，它可以提供更多转换使数据更接近正态分布。\n\
  \n![](img/image-VVIAU2SQ.jpg)\n\n图 2.101 偏态血糖数据的 log10 转换\n\n图 2.102 显示了 JASP Descriptives`\
  \ 选项卡中可以为任何特征计算的可用描述性统计。当我们查看此表时，理解从描述性统计的角度来看正态分布是什么样是非常重要的。\n\n\n\n\n\n![](img/image-N7CK7RPN.jpg)\n\
  \n图 2.102 偏态葡萄糖数据的 Log10 变换\n\n- **偏度 (Skewness)**：正态分布的偏度值为零。正偏告诉我们分布是右偏的，负偏度值则表示分布是左偏的。⁹⁷\n\
  - **峰度 (Kurtosis)**：正态分布的峰度值为零。值大于 `0` 的峰度为尖峰态（中心顶部尖锐），小于 `0` 的峰度为平峰态（中心顶部较平坦）。⁹⁸\
  \ 其他人认为，峰度与峰峰的形状无关，而更多是关于尾部相对于分布形状其他部分的视觉程度。⁹⁹\n- **Shapiro-Wilk 正态性检验**：如果 `Shapiro-Wilk`\
  \ p 值低于 `0.05`，则分布不是正态的。如果高于 `0.05`，我们认为它是正态分布。¹⁰⁰\n\n### JASP 中的幂变换\n\n如前所示，Orange\
  \ 可以在借助 `Feature Constructor` 小部件的帮助进行特定的计算和变换。然而，当尝试几种数学变换（如 `log10`、`square root`\
  \ 或 `inverse function`）仍无法满足你的归一化目标时，可能是时候考虑幂变换了。幂变换不能保证 `Shapiro-Wilk` 的 p 值高于\
  \ `0.05`，但它们可以借助幂函数（对数或指数）和 `lambda` 参数帮助极大地减少分布的偏度，使分布更像正态分布。¹⁰¹\n\n`Box-Cox` 变换（用于正数数据）和\
  \ `Yeo-Johnson` 变换（用于正负数数据）是两种自动化变换方法，它们将找到最佳的 `lambda` 参数将分布转换为非常接近正态的分布。JASP 提供了\
  \ `Box-Cox` 和 `Yeo-Johnson` 变换方法，但没有提供自动化版本，因此你需要尝试不同的 `lambda` 值，以找到创建类正态分布的最佳\
  \ `lambda` 值。以下是用于幂变换的一些常用 `lambda` 值：¹⁰²\n\n- `lambda = -3` 是倒数变换 (`Y⁻³ = 1/Y³`)\n\
  - `lambda = -2` 是倒数变换 (`Y⁻² = 1/Y²`)\n- `lambda = -1` 是倒数变换 (`Y⁻¹ = 1/Y¹`)\n- `lambda\
  \ = -0.5` 是倒平方根变换 (`Y⁻0.5 = 1/square root of Y¹`)\n- `lambda = 0.0` 是自然对数变换\n- `lambda\
  \ = 0.5` 是平方根变换\n- `lambda = 1.0` 是无变换 (`Y¹`)\n- `lambda = 2.0` 是平方变换 (`Y²`)\n-\
  \ `lambda = 3.0` 是立方变换 (`Y³`)\n\n`lambda` 为一代表没有进行数据变换，因为数据被分配了指数一，这不会改变数据。\n\n\
  那么，我们为什么要使用大于 `1` 的 `lambda` 值呢？如果我们的分布存在左偏问题，我们会这样做。大于一的 `lambda` 值给每个值添加一个指数，其效果是放大大于较数字的数字，从而将偏度重新平衡为更接近正态的形状。左偏越严重，需要实验的\
  \ `lambda` 就越高。¹⁰⁰\n\n那么，我们为什么要使用小于 `1` 的 `lambda` 值呢？如果我们的分布存在右偏问题，我们会这样做。小于一的\
  \ `lambda` 值给每个值添加对数或倒数变换，这导致该列中较小的数字比大数字放大更多，从而将偏度重新平衡为更接近正态的形状。右偏越严重，需要实验的 `lambda`\
  \ 就越高.¹⁰¹\n\n[图 2.103 显示了在 JASP 中运行的一个小型实验结果，旨在找到最佳的 `lambda` 变换，将右偏葡萄糖数据的形状转换为图中所示的更接近正态的分布。所示，如果选择非常大的\
  \ `lambda` 值，它将创建一个左偏问题，因此需要时间和耐心来寻找最佳的 `lambda` 值。\n\n原始葡萄糖数据高度右偏，具有很高的偏度和峰度值，且且\
  \ `Shapiro-Wilk` p 值 < `0.05`，表明该葡萄糖数据不符合正态。由于数据是右偏的，该实验限于低 `lambda` 值 `0`、`-1`、`-2`\
  \ 和 `-3`。该实验的最佳 `lambda` 是 `-1`，这是一种倒数数据变换 (`Y⁻¹ = 1/Y¹`)。带有小数的 `lambda` 值也可以用于精调分布形状，但本次实验未使用它们。\n\
  \n[图 2.104 显示了一组代表此实验结果的描述性统计数据。这些统计数据证实了 JASP 中的 `Yeo-Johnson` (`YJ`) 变换具有最佳（最低）的偏度和峰度值，这些值在三个宽框中被突出显示。与实验中的所有其他元素一样，`Shapiro-Wilk`\
  \ p 值仍然 < `0.05`，但这些结果应该足够用于测试这种变换是否有助于模型性能。还需要注意的是，这种变换极大地缩小了数据的范围，范围仅为 `0.018`。将此列数据与所有其他预测变量一起重新缩放可能是明智的，以确保没有任何一个具有可能影响某些算法预测的大尺度优势。重新缩放不会改变分布的形状，只是改变其尺度。]\n\
  \n![](img/image-OL81CIN1.jpg)\n\n图 2.103 右偏葡萄糖值的 Yeo-Johnson 变换\n\n![](img/image-GNA31C9E.png)\n\
  \n图 2.104 原始数据和 Yeo-Johnson (YJ) 变换的描述性统计\n\n[图 2.105 显示了如何通过这 8 个步骤在 JASP 中创建 Yeo-Johnson\
  \ 变换：]\n\n1. 检查数据视图最右侧的“`+`”标记\n2. 打开 `Create Computed Column` 对话框。在 `Name` 部分输入新列的所需名称\n\
  3. 选择 `create column`\n4. 从屏幕最右侧向下滚动所有可用计算，并选择 `YeoJohnson`\n5. 选择后，它将出现在页面顶部的主公式区域\n\
  6. 将 `y` 替换为 `glucose` 并 `lambda` 替换为 `-1`\n7. 点击公式底部的 `Compute column` 按钮\n8. 新列将出现在数据集所有其他列的右侧。为你实验的每种新变换添加新列（步骤\
  \ 1）。这些数据就可以在 JASP 中用于分析。\n\n有许多不同的数据预处理步骤（例如幂变换），它们共同为创建优秀的预测模型奠定可能的基础。对于我们分析的每一个希望成为顶级预测模型的新数据集，每个预处理步骤都需要大量的实验。\n\
  \n### 2. 特征统计小部件\n\n此小部件提供简单的描述性统计，它是探索性数据分析的一部分。检查每个变量的可视化。该小部件为数值数据创建直方图，为分类数据创建条形图，让我们预判新数据集的偏度、异常值、缺失数据百分比等方面。你可以根据任何分类特征进行分组（颜色），例如蓝色代表无心脏病，红色代表患心脏病。你也可以根据性别上色。它生成中心（平均值和位数）、散度、最小值、最大值以及缺失点的数量/百分比。分类数据的散度是其熵（不确定性程度）。对于数值数据，它是变异系数（标准差除以平均值）。参见图\
  \ 2.106 作为该小部件输出的示例。注意：三种颜色对应三种可能的结局——睡眠呼吸暂停、失眠和无。\n\n![](img/image-SDHZSB2X.jpg)\n\
  \n\n\n\n\n# 图 2.106 特性统计小部件输出\n\n## 2.7.22 唯一组件\n此组件可删除重复项。将组件连接到 `File` 组件和 `Data\
  \ Table` 组件。选择变量列以查找重复项，并选择您想要执行的操作，例如“保留最后实例”。\n\n## 2.7.23 保存数据组件\n使用此组件将处理后的数据保存为\
  \ `CSV` 文件以便进一步分析。此外，当您完成工作流时，进入 `file` >> `Save as`，它会将您的工作流保存为 `Documents` 中的\
  \ `.ows` 文件。确保未勾选“向标题添加类型注释”框。此外，不要忘记组件底部有一个报告选项，您可以在那里保存（`html`、`PDF`）或打印。\n\n\
  ## 2.7.24 组件组合\n在本节中，我们将介绍一些具有见解且实用的组件组合。\n\n1. 将一个 `data table` 连接到另一个 `data table`。高亮\
  \ `data table #1` 中的实例并在 `data table #2` 中查看结果。使用 `Save Data` 组件保存结果。\n2. 您可以将 `Scatter\
  \ Plot` 组件连接到另一个 `Scatter Plot` 组件，然后高亮 `scatter plot #1` 中感兴趣的数据点并在 `scatter plot\
  \ #2` 中查看结果。\n3. 您可以高亮 `scatter plot` 中的数据点，然后连接到 `Data Table` 组件以检查所选数据的精确值。\n\
  4. 使用 `Tree` 组件并将其连接到 `Tree Viewer` 组件。然后在大树形图中高亮一个感兴趣的节点并连接到 `Data Table` 组件。确保\
  \ `Tree Viewer` 组件与 `Data Table` 组件之间的链接设置为 `Selected Data >> Data`，这将显示该所选树节点的数据值以供进一步分析。\n\
  5. 设置一个工作流来比较两个不同的模型，例如：使用 `Preprocess` 组件中的“select relevant features”选项选择排名前 5\
  \ 的变量，并包含所有变量。然后在 `Test` 和 `Score` 组件中查看模型性能。此工作流比较了两个随机森林模型。其中一个模型使用了所有的预测变量，而另一个模型仅使用前\
  \ 5 个预测变量。这种工作流设置可以用于许多其他分析比较中，以查看模型的简化版本与包含所有预测变量的完整模型相比如何。参见图 2.107。\n\n![](img/image-4YFA2YXK.png)\n\
  图 2.107 比较两个模型\n\n6. 连接在 Orange 中加载了心脏病数据的 `File` 组件，并将其连接到 `Select Rows` 组件。在 `Select\
  \ Rows` 组件中，我们将设置三个条件——`diameter narrowing (heart disease) = 0`、`gender = female`\
  \ 以及 `age is below 50`（换句话说，即没有心脏病的年轻女性），如图 2.108 所示。\n\n![](img/image-9UF6HCJX.jpg)\n\
  图 2.108 Select Rows 组件的选择\n\n将 `Select Rows` 组件连接到 `Data Table` 组件；您将看到该选择组中有 23\
