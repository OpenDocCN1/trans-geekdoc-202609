  \n分布是指变量或数据集的扩散或分散方式。它显示了每个值或值范围在数据集内出现的频率。分布可以用本节描述的多种方式表示。理解数据集的分布在数据分析中很重要，因为它有助于识别模式、趋势和离群值。它还提供了关于数据中心趋势、变异性和形状的信息。\n\
  \n#### 3.2.3.1 提琴图 (Violin Plot)\n\n`Violin Plot` 组件提供与箱线图类似的信息，仅适用于数值数据。选择 `violin\
  \ plot`（提琴图）和可选的密度点以根据需要查看实际数据点。选择默认的 `Normal`（正态）内核和 `Scale = area`。我们将使用这些工具。\n\
  \n*(注：您提供的文本在 \"We will use these tools\" 之后似乎有逻辑重复或截断，我已基于您提供的所有文本片段完成了翻译。)*\n\n\
  \n\nJASP 提供了 Q-Q 图（分位数-分位数图），用于直观判断数据是否服从正态分布。分位数（Quantile）源于单词 quantity（数量），意思是将样本划分为等大小的相邻子组。中位数是一个分位数，因为有一半的数据在它下方，另一半在它上方。Q-Q\
  \ 图将理论上的正态分布（x 轴）与实际分布（Y 轴）进行比较。JASP 中的直对角线代表正态分布，点代表样本数据。样本数据越接近对角线，说明数据越符合正态分布。你可以通过进入\
  \ `Descriptive`（描述性）标签卡 > `Descriptive Statistics`（描述性统计） > `Basic plots`（基础图） >\
  \ `Q-Q plots` 在 JASP 中创建 Q-Q 图。请记住这只是对正态性的视觉检查。只有有效的统计检验（例如用于正态性的 `Shapiro-Wilk\
  \ test`）才能以高确定性告诉我们数据特征是否正态。正态性 `Shapiro-Wilk test` 可以在 JASP 的 `Descriptives` 标签卡中进行，并可以在\
  \ `Statistics` 标签卡及其他地方找到。\n\n![](img/image-6N2KLC0Q.png)  \n\n图 3.16 按收入划分的种族分布\n\
  \n图 3.17 显示了葡萄酒酒精含量的 Q-Q 图。中间部分接近对角线，但在低端或高端并非如此。⁸\n\n![](img/image-ZKP15DKH.png)\
  \  \n\n图 3.17 葡萄酒酒精含量 Q-Q 图\n\n图 3.18 显示了在 JASP 中运行的正态性检验，其 p 值 < 0.05，表明它不是正态分布。\n\
  \n![](img/image-48EG2PH6.png)  \n\n图 3.18 Shapiro-Wilk 检验\n\n## 3.2.4 变量之间的关系\n\n\
  当我们通过各种可视化方法回顾变量之间的关系时，考虑到相关性并不一定意味着因果关系是非常重要的，原因如下：⁹\n\n- **第三变量或隐藏变量的存在**：两个变量之间的表观联系可能是由研究中未检查的第三变量引起的。例如，某研究可能发现雨靴销售量与热巧克力消耗之间存在相关性，但潜在因素可能是雨天气，这种天气促成了人们穿雨靴和对暖饮的渴望。\n\
  - **可能存在反向因果关系**：这是经典的“鸡生蛋”悖论：哪个先出现？身体不活动会导致体重增加，还是反之亦然？吸烟会导致抑郁吗，还是反之亦然？\n- **敏感话题的测量**：由于我们感兴趣的结果往往难以衡量且只能被不完美地观察到，测量误差是一个可能。例如，鼓励人们报告有关敏感或有争议的话题可能会产生不可靠的结果。\n\
  - **偶然相关**：如果简单地认为因果关系的证明就是现有的相关性，这种对因果关系的假设是错误的。例如，仅仅因为接种率和自闭症发生率都在增加，并不总是意味着疫苗是其罪首。\n\
  \n最后，记住相关性并不等同于因果关系，并仔细分析报告的两个变量之间任何潜在的混杂变量。\n\n### 3.2.4.1 散点图\n\n散点图是一种图形表示形式，显示数据两个变量（列）之间的关系。图上的每个点代表所研究两个变量的一对值。通过使用散点图探索变量之间的视觉关系，研究人员和分析师可以发现复杂系统的规律并做出基于数据的决策。散点图具有广泛的实际应用，包括：\n\
  \n- **探索相关性**：散点图常用于探索两个变量之间的关系。这种关系通常由“最佳拟合”线表示，软件将其绘制为平滑的、线性或多项式线，以显示两个变量之间的关系。\n\
  - **识别离群值**：散点图也可以识别离群值。离群值是落在预期范围之外的数据点。\n- **探索趋势**：通过视觉检查散点图，可以观察变量是正相关还是负相关。\n\
  \n（注：由于原文后半部分存在大量重复，译文已根据核心含义进行了去重以确保文档质量。）\n\n\n\n\n### 带有三次拟合线的 JASP Flex 图\n\n\
  此独特的图表显示了图中不同颜色的主要血管数量的每个数字所对应的个体三次最佳拟合曲线，其中 `y-axis` 表示是否存在心脏病（1）或不存在（0），并与年龄（`x-axis`）相关。我们可以看到，三种主要颜色的血管具有直径狭窄风险最高，而一种主要颜色的血管直径狭窄风险最低。`y-axis`\
  \ 上 0 和 1 位置的点代表数据的存在，但确实存在数据重叠的情况。通过调整 `jitter`（抖动）选项可以看到所有重叠的数据。\n\nOrange 在散点图小部件中有一个重要功能：`Find\
  \ Informative Projections`（寻找信息性投影），一旦你点击 `Find Informative Projections` 标签中的 `start`\
  \ 标签并点击所需的散点图进行显示，它将自动找到、列出并显示相关性最高的散点图。图 3.20 显示了左侧 `Find Informative Projections`\
  \ 标签的结果，以及右侧数据集中相关性最高的散点图。你可以点击左侧的任何其他散点图，它们将立即显示。\n\n寻找强正相关或负相关可以帮助你为统计或机器学习模型选择最佳变量。另一个有价值的选项是将鼠标悬停在数据点上了解其特征和类别。你还可以突出显示数据点并将其连接到数据表以进一步研究。\n\
  \n#### 3.2.4.2 等高线图\n\n等高线图也被称为等高线密度图或二维密度图。它们能清晰地显示散点图中不进行数据抖动的情况下存在的数据重叠水平（密度）。抖动是对数据进行随机的\
  \ `X` 和 `Y-axis` 位移，以显示更多代表重叠数据点的符号。\n\n等高线图中最内层的圆（s）显示了最高的数据点密度。其他圆从内圆向外放射状，代表较低的数据点密度区域。这种方法可以显示两个变量之间关系的强度，同时揭示模式、聚类、离群值和普通散点图中可能会忽略的隐藏见解。\n\
  \n图 3.21 显示了四个等高线图的示例，比较了美国对以下搜索词的每月 Google 搜索兴趣：船、海滩、自行车和摩托车。我们之前展示了这些搜索词的时间序列图，显示了这些词具有强烈的年度季节性兴趣。我们在\
  \ BlueSky Statistics 中通过进入 Graphics 区域并选择 `Contour Plot` 创建了这些图表。然后输入数据集中感兴趣的 `X`\
  \ 和 `Y` 变量来创建图表。\n\n![](img/image-CQHG7U0X.jpg)\n\n图 3.20 散点图小部件中 `Find Informative\
  \ Projections` 选项的结果\n\n![](img/image-X5ZJMIZM.jpg)\n\n图 3.21 BlueSky Statistics\
  \ Google 搜索词兴趣等高线图\n\n图 3.21 右角的等高线图显示了船与海滩搜索词的普及。该等高线图显示了这些搜索词之间明显的正线性关系，在 `X`\
  \ 和 `Y` 轴坐标的下三分之一数据点密度很高。其他三个等高线图也显示了所选 `X` 和 `Y` 轴特征之间相似的关系。然而，它们的相关性和密度分布模式比右上等高线图更不规则且不一致。\n\
  \n#### 3.2.4.3 马赛克图 (Mosaic Plot)\n\n这使得定性变量的列联表可视化，也可用于分箱的连续数据。图 3.22 显示了一个简单的马赛克图，其中居家医疗数据集的四个字段中填充了两个，在\
  \ `x-axis` 上显示日常生活能力（ADL）起始评分的护士认证评估分。ADL 起分越高，患者越需要帮助来执行执行简单活动，以在家里维持安全有效的独立生活。马赛克“切片”的宽度和高度与每个子组中的数据量相关。如图所示，你可以悬停在任何切片上以获取描述内容的信息的框。我们能从此图中视觉化到的是，85\
  \ 岁及以上的患者往往是高 ADL 起分组的成员。75 岁及以下的患者在低 ADL 起分组中的参与度更高。\n\n![](img/image-BWUJSX98.jpg)\n\
  \n图 3.22 显示两个特征的马赛克图\n\n此外，还可以从数据选择 `Find informative Mosaics`（寻找信息性马赛克）的选项。不要忘记你可以在此图及大多数其他图表上选择感兴趣的区域，然后将其连接到数据表和额外的可视化小部件。你还可以为图表选择另外两个变量，但这会让图表变得难以解释。\n\
  \n图 3.23 显示了一个填充了四个马赛克图字段的马赛克图，显示了年龄组、ADL 起分组、性别以及这些患者在居家医疗治疗期间取得的 ADL 改进。这样的图表包含丰富的详细内容，但理解起来更复杂。你可以悬停在图中的任何子组上，查看弹出框以解释马赛克图中每个切片的详细信息，如图所示。\n\
  \n#### 3.2.4.4 筛图 (Sieve Diagram)\n\n此小部件（也称为瀑布图 parquet diagram）通过列联表绘制成对类别变量以显示频率。每个矩形的面积与预期频率成正比，而观测频率由每个矩形中的正方形数量显示。观测频率与预期频率之间的差异显示为颜色阴的密度，其中蓝色（左上和右下）为正相关，红色（右上和左下）为负相关。在图\
  \ 3.24 中，按性别比较了泰坦尼号的幸存情况。卡方统计量和 p 值（<0.05）显示了统计学差异。男性的生存率低于预期。将鼠标悬停在矩形上获取预期与观测统计数据。选择\
  \ `Score Combinations` 以寻找感兴趣的数据对。\n\n![](img/image-MMVQAF32.jpg)\n\n图 3.23 填充四个特征的马赛克图\n\
  \n![](img/image-VWRJI64F.png)\n\n图 3.24 数据集中生存性的筛图\n\n#### 3.2.5 时间序列\n\n时间序列显示是指特定时间间隔内收集的数据点的可视化。时间序列分析涉及分析和解释这些数据点，以识别随时间变化的模式、趋势和关系。时间序列显示广泛应用于各个领域，包括统计、经济、金融、天气和环境研究。\n\
  \n###### 3.2.5.1 折线图\n\nOrange 通过 `Line Plot` 小部件提供时间图，但你只能在时间图中显示一条线。JASP 在其 Prophet\
  \ 和质量控制部分也提供了时间图，但它们与 Orange 有相同的限制，每个图只允许显示一条线。\n\n###### 3.2.5.2 面积图\n\n参见马赛克图\n\
  \n###### 3.2.5.3 时间序列图\n\n在 Orange 和 BlueSky 中可以创建包含多条线的时间序列图。\n\n•按照以下步骤在 BlueSky\
  \ 中创建此类图表：上传宽格式文件 > 进入 Forecasting（预测） > 选择 Time Series，Separate 或 Combined 模式 >\
  \ 在 `variables to Plot` 部分输入所有想要绘制的特征，输入首次观测时间 > 输入单位时间内的观测次数 > 勾选 `combine series`（合并序列）选项。\n\
  \n\n\n\n\n-   按照以下步骤在 Orange 中创建此类图表：\n-   确保你上传的宽格式数据文件到 `File` 组件中，该文件应包含一个日期列或序列号，用于\
  \ `X-Axis` 时间刻度。\n-   将 `Line Chart` 组件连接到 `File` 组件。\n-   突出显示所有应包含在同一张图的数据列。\n\
  -   Orange 将自动确定应该使用哪一列作为时间尺度轴。\n\n图 3.25 是一个 Orange 时间序列图，在同一张图上有五条独立的线，显示了从 2004\
  \ 年 1 月到 2023 年 5 月五个 Google 搜索词的季节性每月趋势。目前，`JASP` 无法在同一张图上创建多线条的时间序列图。你也可以使用 Orange\
  \ 的 `Preprocess` 组件将 `Y-Axis` 归一化为间隔，并重新运行图表进行比较。\n\n## 3.2.6 地理显示\n\n地理显示是指在地图上对地理空间数据进行可视化表示。它们用于传递有关地理特征和现象的位置、分布和特征的信息。地理显示对于理解和分析地理空间数据非常重要。它们有助于识别不同变量之间的模式、趋势和关系，并可以根据数据做出明智的。\n\
  \n![](img/image-8WT88Q9T.jpg)\n\n图 3.25 Orange 中的时间序列图\n\n### 3.2.6.1 等级地图\n\n图\
  \ 3.26 显示了所选国家平均预期寿命的颜色编码。这种方式具有视觉吸引力、直观且易于解释。\n\n### 3.2.6.2 定位地图\n\n`Orange` 和\
  \ `BlueSky Statistics` 都提供了地理映射（Geo-Mapping）。地理映射也被称为地理空间映射或地理映射。这种方法可以使用世界上任何位置特定的经纬度坐标在地图上显示数据和信息。地理映射的应用非常多，其应用仅限于分析师的想象力和可用数据。\n\
  \n地理映射的一些示例包括：资源规划、基础设施项目规划、环境监测、公共健康统计、犯罪统计、人口普查数据表示、房地产数据、城市规划、业务和营销战略规划、交通和物流规划与优化、天气数据跟踪、天气预报等。\n\
  \n图 3.27 显示了启动地理映射所需的 Orange 工作流。\n\n![](img/image-YVEQCLJ9.png)\n\n图 3.26 按国家划分的预期寿命等级图\n\
  \n![](img/image-K1R4TH2W.jpg)\n\n图 3.27 创建地理地图的 Orange 工作流\n\n图 3.28 显示了基于 `Synthea`\
  \ 提供的合成患者数据的长期纵向研究的修改经纬度位置，通过将所有真实患者数据替换为相似但并非完全匹配的合成数据，确保了患者的隐私。此地理地图还对患者的种族进行了颜色编码。该主题将在后面的章节中进行详细讨论。\n\
  \n![](img/image-URVN0BOT.jpg)\n\n图 3.28 使用合成数据的长期纵向研究的修改患者位置\n\n## 3.2.7 层级显示\n\n\
  在层级结构（通常为树形）中对数据进行可视化或展示被称为层级显示。通过父子关系连接在一起形成树状结构的数据点成了层级数据。在此类显示类型的多种选项中，我们仅展示了\
  \ `Orange` 和 `JASP` 中提供的最流行的两种显示方式。\n\n### 3.2.7.1 树图\n\n参见第 3.2.9.1 节决策树。\n\n###\
  \ 3.2.7.2 层次聚类图\n\n层次聚类是数据分析和机器学习中一种特定的聚类算法，用于可视化显示数据集中预测变量（特征）组与目标变量之间的相似性或差异。这种聚类方法通过名为\
  \ `dendrogram`（树状图）的树形图形显示聚类结果。树状图将彼此相似的特征放置在树上相邻的邻居位置。互不相似的特征被放置在同一分支或不同分支上较较远的邻居位置。如果特征位于树状图树的不同分支上，则说明该组特征与其它分支上的特征组非常不同。\n\
  \n聚类是一项很有用的技术，原因如下：\n\n-   它在无监督数据中的未标记数据分组中有用。\n-   它在探索性数据分析 (EDA) 中非常有用，有助于理解不同特征之间存在的关系和分组。\n\
  -   它可以用于异常和离群值检测。\n-   降维可以通过聚类结果来指导。\n-   聚类可以用于来自客户、患者、图像和文本文档的数据以及其他分析。\n\n\
  图 3.29 显示了此层次聚类示例的 Orange 工作流和 `Distance` 组件设置。可以选择多种方法来确定行和列（特征）之间的距离，这是所显示聚类结果的基础。\n\
  \n图 3.30 显示了 Cleveland-Hungary-Statlog 心脏病数据集中与患者是否患心脏病相关的预测变量。聚类数量可以通过调整图 3.30\
  \ 所示树状图的高度比例来控制。关于聚类的更多细节将在关于无监督学习的章节中讨论。\n\n## 3.2.8 多变量显示\n\n多变量显示涉及两个以上变量的数据的可视化。这些显示有助于理解多个变量之间的关系，并识别在查看单个变量时可能不明显的模式或趋势。\n\
  \n![](img/image-H9KQMX.jpg)\n\n图 3.29 Orange 层次聚类工作流\n\n![](img/image-B7AYX2FH.jpg)\n\
  \n图 3.30 Orange 层次聚类显示选项\n\n### 3.2.8.1 相关性矩阵\n\n`JASP` 可以创建相关性矩阵，以便你可以观察许多变量之间的相关性。相关性矩阵位于回归菜单下。在本节中，我们将使用全球信息数据集。表\
  \ 3.4 显示了 GDP（国内总产）、婴儿死亡率、预期寿命和出生率的相关性矩阵。注意数值相关性和 p 值。例如，GDP 与预期寿命之间存在 0.176 的正相关，且\
  \ p 值具有统计学意义（为 0.016）。\n\n表 3.4 心脏病预测数据集的相关性矩阵\n\n![](img/image-NK6TIEQ8.png)\n\n\
  相关性矩阵类似于 `JASP` 中也可以创建的热力图。图 3.31 中的热力图同样位于 JASP 的回归和相关性菜单下。它创建了一个与相同的皮尔逊相关结果相关的颜色图。负相关性由浅红色变为深红色，正相关为浅紫色或深蓝色。关系越强，颜色越深。\n\
  \n![](img/image-FYWUL9PL.png)\n\n图 3.31 GNP、婴儿死亡率、预期寿命和出生率的热力图\n\n### 3.2.8.2 相关性网络图\n\
  \n\n\n\nBlueSky Statistics 提供了多种检查特征之间关系的方法。其中视觉上最有吸引力的是相关性网络图（Correlation Webplots），如图\
  \ 3.32 所示。图中连接特征的线条的粗细和颜色定义了相关性的水平和方向（正相关或负相关）。蓝色的粗线表示强相关，而红色的细线则描述了特征之间的弱负相关。你可以通过打开\
  \ BlueSky Statistics 并遵循以下路径创建这些显示图：`Analysis > Correlations > Pearson Legacy >\
  \ Visualize webPlot > Select variables of interest`。\n\n图 3.32 是一张 BlueSky 相关性网络图，显示了在九年时间范围内，每月\
  \ Google 搜索术语（海滩、船只、摩托车、自行车和汽车）之间的相关性。图例显示了特定线宽对应的 `r-values`。对于那些青睐这种视觉显示的人，还提供了额外的可选相关性热力图。JASP\
  \ 也提供了类似的显示。\n\n![](img/image-KJZ7V2DS.jpg)\n\n图 3.32 BlueSky Statistics 中的相关性网络图\n\
  \n### 3.2.8.3 网络图\n\nJASP 中的 `Network` 部分提供了多种 `Network Plot`（网络图）选项，以直观的方式显示特征之间的关联强度。特征（节点）之间越强的关联由越粗、颜色越深的线条（边）表示。线条的颜色代表特征之间的正相关或负相关。还提供了一个\
  \ `Weights`（权重）矩阵，它显示了所有特征之间的数值关联强度。变量名称可以显示在图例或图表中。可以选择较高的图例与图表比例，这可以确保较长的特征描述能够完全可见。还提供了标签字体大小和缩写选项。\n\
  \n图 3.33 显示了 JASP 网络图的弹力布局（Spring layout）和圆形布局（Circle layout）选项，包括百分体脂数据集中所有可用特征。JASP\
  \ 中这种图表的缺点是，它在图例中可以标记的特征数量有限。\n\n### 3.2.8.4 散点矩阵\n\nJASP 在描述性统计（Descriptive Stats）部分提供了这种图表，在输入所有想要包含在矩阵中的特征后，你需要勾选“Correlation\
  \ plot”（相关性图）。JASP 随后会创建一个矩阵（如图 3.34 所示），该矩阵包含了使用已输入特征可以创建的所有散点图。此矩阵将包含每个散点图分布图、散点图和线性最佳拟合线。这个全面且详细的矩阵允许分析师识别线性和非线性关系、偏斜、离群值、模式、聚类或缺乏关系。它为所有选定的特征提供了一个易于解释的视觉比较，以便快速识别最强和最弱的相关性。\n\
  \n![](img/image-C47VKD73.jpg)\n\n图 3.33 JASP 中网络相关性图的两种选项\n\n![](img/image-114QTN74.png)\n\
  \n图 3.34 JASP 散点矩阵显示\n\n### 3.2.8.5 线性投影 / 3D 图\n\n`Linear Projection`（线性投影）小部件同时显示来自三列连续数据的\
  \ 3-D 图像。推荐的变量将通过 `Select Features`（选择特征）选项以及默认的“circular placement”（圆形布局）和“Suggest\
  \ Features”（建议特征）选项显示。在这个示例中，`glucose`（血糖）、`waist_hip ratio`（腰臀比）和 `systolic BP`（收缩压）如图\
  \ 3.35 所示，显示了这三个变量的线性投影。一个数据点（箭头）被突出显示并发送到 `Data Table`（数据表）中进一步分析明显的离群值。在 `Data\
  \ Table` 小部件中，`glucose` 为 `270`，但患者可能有正常的 `Hgb A1c`（糖化血蛋白），否则不会被标记为非糖尿病。遗憾的是，此图形无法进行\
  \ 3D 旋转以从不同的角度查看此数据可视化。在 `Suggest Features` 标签下，如果数据可用，可以选择超过 3 个变量进行显示，但这增加了解释和说明显示内容得的复杂性。\n\
  \n### 3.2.8.6 平行坐标图\n\n平行坐标图（`PCPs`）是 Orange 中 `Line Plot` 小部件可以创建多种多变量数据可视化之一。PCP\
  \ 为高维数据显示提供了清晰度。每个平行垂直轴代表每个变量，每个数据点表示为连接其在每个变量相应坐标的线条。线条和颜色编码模式对于检测复杂数据集中的相关性、依赖性、关系、离群值、模式、聚类、分组和异常分组非常有用。\n\
  \n![](img/image-UB2JH0E5.png)\n\n图 3.35 线性投影小部件结果\n\n当显示的变量尺度之间存在巨大差异时，建议对用于此图表的数据进行归一化。图\
  \ 3.36 中的 Orange 工作流允许你尝试归一化和非归一化数据，以确定哪种方案为 PCP 提供最佳解释和见解。\n\n图 3.37（数据未归一化）和 3.38（数据已归一化）显示了十年心脏病研究中两个患者特征的多变量显示。患者\
  \ #1 在十年中患了心脏病。然而，患者 #2 没有。\n\n图 3.38 使用了 `0,1` 区间的归一化数据，这扩展了某些变量的缩放，为在非归一化 PCP（图\
  \ 3.37）上值看起来非常相似或相同的许多特征提供了视觉清晰度。例如，`education`（教育）特征的值在非归一化显示上看起来是相同的，因为它们在二到三之间的数值范围很小。然而，当归一化后，它们的差异被关注，提供了额外的见解。\n\
  \n![](img/image-3DFZCYLX.jpg)\n\n图 3.36 平行坐标图 / 线图工作流\n\n![](img/image-U2S6W1H6.jpg)\n\
  \n图 3.37 平行坐标图 / 线图 未归一化\n\n![](img/image-QW2ZYDQ.jpg)\n\n图 3.38 平行坐标图 / 线图 已归一化\n\
  \nPCP 可以促进利益相关者的参与、讨论和教育，因为这些显示易于解释并有助于促进问题的协作决策。\n\n### 3.2.9 统计模型与显示\n\n#### 3.2.9.1\
  \ 决策树\n\n`Tree Viewer` 小部件显示决策树（`DT`）的结果。图 3.39 显示了典型的树结构及其术语。DT 从根节点开始不断划分，直到到达叶子节点。叶子节点意味着无法进行进一步的决策或划分。在\
  \ Orange 中，它告诉你节点和叶子的数量，你还可以缩放和下载结果。你也可以设置树的深度。确保选择了目标类别。我们将使用葡萄酒数据集，因此有三个结果。对于图\
  \ 3.40，我们将剪枝（pruned）的最大深度设置为 3 层，以便在一张图中完整可视化整个树。三种颜色反映了三种葡萄酒。对于第三种葡萄酒，`flavonoids`（黄烷醇）小于\
  \ 1.57，且颜色强度大于 3.8。\n\n注意，你需要将 `Tree` 小部件连接到 `File` 小部件，然后连接到 `Tree Viewer` 小部件来查看树。数据科学中通常从简单树开始以可视化数据，因为结果不像袋装或增强树那样易于解释。可以选择更多的\
  \ `Depth` 层来查看更复杂的 DT。在下一章中我们将指出 DT 的某些缺点。\n\n#### 3.2.9.2 间隙图\n\n\n\n\n置信区间图是一种重要的数据可视化工具，用于评估多个组的平均值置信区间（`CIs`）是否重叠。当两个或多个组的\
  \ `CIs` 重叠时，这为我们提供了一个有力的视觉和统计信号，表明均值在统计学上是不可区分的，无论它们在数值上的差异有多大。相反，组比较中不重叠的 `CIs`\
  \ 提供了一个清晰的统计信号，表明均值在统计学上存在差异。\n\n最常用的是 95% 置信区间，其通过以下公式计算：`Mean +/- 1.96*(SD/sqrt\
  \ n)`。¹³\n\n其中：\n* `n` : 样本量\n* `SD` : 样本数据的标准差\n* 平均值的 `SE`（标准误差）是总置信区间范围的 1/4\n\
  * 置信区间线在均值的两侧延伸\n\n从 `CIs` 的公式可以看出，`CI` 的宽度会随着 `SD` 的增加和 `n` 值的减少而增大。较低的 `SD` 和较高的\
  \ `n` 值会产生更窄的 `CIs`。\n\n重叠 `CIs` 的存在不应被视为两个或多个组之间相似性假设的最终证明。这种谨慎源于：额外的数据收集可能会缩小\
  \ `CIs`，如果 `CIs` 缩小到不再重叠，就可能会推翻最初的相似性假设，从而有效地挑战并反转目标组别之间的初始相似性假设。\n\n![](img/image-RRY08O7W.png)\n\
  图 3.39 典型的决策树架构（由 JavaPoint.com 提供）\n\n![](img/image-8ROGURBG.png)\n图 3.40 葡萄酒数据集的剪枝决策树\n\
  \n`图 3.41` 显示了当数据集中的样本量增加时 `CIs` 动态特性的视觉化。在左侧的初始图中，我们观察到组 `A25` 和 `B25` 的 `CIs`\
  \ 存在叠，每个组的样本量均为 25。\n\n当我们把注意力移到图表的中间时，组 `A` 和 `B` 的样本量现在增加到了每组 200 个。尽管这些组的均值保持不变，但置信区间的收缩非常充分，现在暗示了与之前不同的结论。这些组具有不重叠的\
  \ `CIs`，我们可以得出结论：这两组的均值不同。\n\n最后，在最右侧，组 `A` 和 `B` 的样本量现在已增加到每组 1000 个。这进一步缩小了组 `A1000`\
  \ 和 `B1000` 的 `CIs`，我们现在可以进一步得出结论：这些组的均值在真实和统计上都是不同的。\n\n置信区间图可以在 `JASP` 的 `Descriptives`\
  \ 部分创建。它们位于“Basic Plots”部分下。创建这些图需要长数据或“堆叠型”数据，其中数值数据应输入在“Variables”部分，而组名应输入在“Split”部分。\n\
  \n![](img/image-ST841S4S.jpg)\n图 3.41 不同样本量组的区间图\n\n这种这种强有力的视觉图表应该强调了较大样本量对我们统计结论的影响。当我们处理真正的大数据时，置信区间变得不那么重要，因为由于大数据样本量的剧增，它们会大幅缩小。在大数据模型中，分析的重点从区间图转向建立预测变量相对于目标变量的相对性排名。\n\
  \n### 3.2.9.3 箱线图\n\n该组件是可视化单个数据集数值数据或比较子组之间数据值的的有用工具。箱线图以数值标记数据集的 `mean`、`median`、`standard\
  \ deviation`（标准差）、`第一四位数`、`第三四位数`、`min` 和 `max` 值。箱线图还可以用于识别离群值。Orange 不支持在同一显示中绘制多个数值变量，因此我们一次只能绘制一个变量的箱线图。在图\
  \ 3.42 中，按性别比较血清胆固醇值。务必勾选“Order by relevance to subgroups”，以根据所选子组的 `chi-square`\
  \ 或 `ANOVA` 对变量进行排序。同样选择“Order by relevance to variable”，以根据所选变量的 `chi-square` 或\
  \ `ANOVA` 对子组进行排序。选择“Annotate”在箱线图上显示计算值。你还可以选择“Compare means”或“Compare medians”。记住，如果均值和中位数差异很大，则数据是偏态。图\
  \ 3.42 将显示 `mean` 加标准差以及四分位距 `(Q3-Q1)(75%-25%)` 或 `IQR`。`IQR` 代表所有数据值的中间 50%。图 3.42\
  \ 显示了 `t-test` 结果（`p-value = 0.003`），显示两个均值之间存在统计学显著差异，因为 `p-value` `< 0.05`。因此，我们可以以\
  \ 95% 的置信度得出：该数据集中的女性总胆固醇水平在统计学上显著较高。\n\n### 3.2.9.4 评分模型\n\n\n\n\n列图（Nomograms），也称为比例图，可以在\
  \ Orange 中创建为交互式图形，以直观地展示朴素贝叶（Naïve Bayes）和逻辑回归分类器的结果。这种交互提供了移动列图上按钮到所需位置的机会，以测试其对结果的影响。除了作为一种极好的可视化工具外，列图还能为分类目标提供类别概率的预测。图\
  \ 3.46 显示了创建列图所需的 Orange 工作流。\n\n![](img/image-YU0EMWOD.png)\n图 3.46 创建列图的 Orange\
  \ 工作流\n\n图 3.47 显示了找到能够解释泰坦尼克号上最佳生存概率的特征组合的结果。例如，一等舱的女性儿童存活几率为 96%。列图小部件件（Nomogram\
  \ widget）为比例尺、目标类别和显示选项提供了强大的配置，当存在过多预测因子时，这些选项可以关注排名靠前的预测因子。\n\n![](img/image-XREQJLIM.jpg)\n\
  图 3.47 显示泰坦尼克号上最佳生存选项的 Orange 列图\n\n![](img/image-EH5YOQ79.jpg)\n图 3.48 显示泰坦尼克号上最差生存选项的\
  \ Orange 列图\n\n图 3.48 显示了找到能够解释最差生存概率的特征组合的结果。例如，成年男性船员的生存概率仅为 15%。\n\n## 3.2.10\
  \ 文本显示\n\n词云是文本数据的图形表示，显示了给定文本中频繁出现的词项加权列表。一个词在文本中出现的次数越多，它在词云中显示得越大、越粗。词云可以帮助读者快速理解作品中最重要的元素，并确定重要的主题、人物或短语。\n\
  \n### 3.2.10.1 词云\n\n让我们为 1776 年的《独立宣言》创建一个词云.¹¹⁵ 将该文本粘贴到 MS Word 中，Orange 将无法识别，但如果将其粘贴到\
  \ Excel 中，Orange 就能找到。`Preprocess Text` 小部件中的许多选项可以缩小词云的大小，例如添加一个词云应忽略的停用词文件。图 3.49\
  \ 显示了 Orange 工作流，图 3.50 显示了输出的词云。\n\n![](img/image-XJXQ4R30.jpg)\n图 3.49 创建词云的 Orange\
  \ 工作流\n\n![](img/image-UTGA73VX.png)\n图 3.50 Orange 默认词云\n\n## 3.3 变量排名 - 非正则化与正则化\n\
  \n变量排名（Variable ranks）在统计学和机器学习中，用于显示所有预测因子相对于其解释分类或回归目标的预测能力的排名贡献。“非正则化”（Non-Regularized）和“正则化”（Regularized）这两个术语指的是用于确定预测因子排名的两种不同建模方法。\n\
  \n非正则化模型和方法使用模型中的所有预测因子来确定其排名，无论预测因子的真实显著性、贡献或 VIF（方差膨胀因子）值如何。这种方法会导致过拟合，因为该方法将数据中的真实信号与大量的噪声和多共线性混合在一起，而这些是应该被处理以确定所有显著预测因子的真实排名。这在统计学中可能会创建高性能模型，并在训练模型时专注于对所选预测因子中的信号和噪声进行建模。Orange\
  \ 中的 `Logistic regression` 和 `Linear regression` 小部件提供了“无正则化”选项。如果不选择正则化，你可能有多个充分理由怀疑过于乐观的建模。`Rank`\
  \ 小部件提供了七种评分方法，但请注意，列表中最后一种方法（FCBF – 基于相关性的快速过滤）才会尝试由于预测因子之间的高相关性而过滤预测因子。\n\n正则化模型和方法提供了各种选项和设置，以防止过拟合、过于乐观的结果和不准确的预测因子排名。Orange\
  \ 中的正则化方法应用两种形式的正则化：用于 `L1 (Lasso)` 和 `L2 (Ridge)`。正则化方法提供了各种选项和设置，防止过拟合、过于乐观的结果和不准确的预测因子排名。`Lasso`\
  \ 方法是一种正则化方法，可以关注预测因子过多时的排名靠前的预测因子。`Ridge` 方法是一种正则化方法，将系数缩小为零。`Elastic Net` 方法是一种正则化方法，能够更好地泛化。图\
  \ 3.51 显示了用于分类的正则化工作流。图 3.52 显示了用于回归的正则化工作流。图 3.53 显示了正则化后泰坦尼克号生存结果的 Orange 排名图。图\
  \ 3.54 显示了正则化后泰坦尼克号生存结果的 Orange 排名图。\n\n\n\n7. 考虑“5 秒规则”：查看终端用户是否能在 5 秒内理解这些数据。\n\
  \n8. 了解你的受众：谁会查看并审视仪表板的清晰度？消费者？首席执行官？两者都有吗？他们能理解图表吗？\n\n9. 从宏观到微观：最重要的概念应该排在最前面，并使用最大的字体。这像一个倒金字塔。\n\
  \n10. 针对英语读者采用从左到右的设计。\n\n11. 为了简单起见，对数字进行取整。\n\n12. 限制关键性能指标 (KPI) 的数量：避免在仪表板上发布每一个发现的诱惑。关注主要观点（3-5\
  \ 个）。\n\n13. 考虑交互元素：以便终端用户可以进一步钻取。\n\n14. 限制过滤器的影响范围：确保它们不会影响整个页面。\n\n15. 使用垂直滚动：不要进行水平滚动。\n\
  \n16. 针对网页和移动平台进行优化。\n\n17. 设计一致性至关重要：字体类型、大小和颜色要保持一致。\n\n18. 细节非常重要：例如，使用原始尺寸的图标集。\n\
  \n### 3.4.2 信息图\n\n信息图类似于仪表板，但通常关注特定主题，并包含文本和可视化内容。其中一种定义是“图像集合、数据可视化（如饼图和柱状图）以及少量的文本，对主题提供易于理解的概述”。它们通常具有教育意义、易于查看，并具有视觉吸引力的图像。信息图通常是静态的、不可交互的。它们是针对感兴趣主题（如新冠肺炎、特殊饮食和疾病状态）进行患者教育的良好选择。图\
  \ 3.55 显示了一个关注新冠肺炎防护的信息图。\n\n信息图是多功能工具，可许多不同行业，以简化且迷人的方式传递复杂信息。信息图可以应用于营销、咨询演示、小型企业的品牌风格指南、非营组织、教育以及许多其他领域。\n\
  \n#### 3.4.2.1 创建疾病信息图\n\n信息图可以使用任何文档平台（如 Microsoft Word、Google Docs 或 Adobe PDF）从“开始”创建，也可以通过模板创建，从而节省时间。许多商业平台提供免费的信息图模板，例如\
  \ Canva、Venngage 等。图 3.56 显示了一个通用的糖尿病意识信息图。这可以根据当地需求进行定制。\n\n![](img/image-PFRBIU44.png)\n\
