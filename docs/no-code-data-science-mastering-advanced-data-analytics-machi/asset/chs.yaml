  \ `coefficients` 和模型性能的变化。\n\n### 6.3.2 成熟度级别\n\n三家电子商务网站正在创建一种预测模型，用于根据用户的浏览行为确定其购买的可能性。这些网站每家都使用了不同的建模策略，可以很好地描述为低、中、高三个级别的建模成熟度，如下所示：\n\
  \n![](img/image-PUHJHNOS.png)\n\n图 6.9 线性回归与弹性正则化的回归系数\n\n#### 低成熟度示例\n\n一个电子商务网站收集了三个属性的数据：`page\
  \ views`、`time spent on the website` 和 `type of products viewed`。他们决定使用基础的 `decision\
  \ tree`，而不考虑潜在的过拟合，或向营销团队解释他们的模型。\n\n**警告！**\n\n对于购买行为这样复杂的决策过程，该团队的方法似乎过于简单。在没有考虑更广泛变量集或确保模型稳健性的情况下，存在预测准确性差的高风险。此外，对利益相关者缺乏透明度可能会引发对模型预测可靠性的质疑。\n\
  \n#### 中成熟度示例\n\n该电子商务网站收集了七个用户属性的数据，包括 `search history`、`product reviews read`\
  \ 和 `previous purchase history`。他们的模型同时使用了 `linear regression` 和 `support vector\
  \ machines` (`SVM`)。他们应用基础的特征选择方法，并为销售团队提供了 `variable importance plot`。\n\n**注意！**\n\
  \n他们通过考虑更多变量和使用多种算法正走在正确的道路上。然而，由于没有探索其他机器学习技术，或没有通过 `cross-validation` 等技术确保模型验证，他们可能会错失一些机会。为了进一步增强模型，他们可能会考虑\
  \ `deep learning techniques` 或专为电子商务定制的更高级 `ensemble models`。\n\n#### 高成熟度示例\n\n\
  一家电子商务巨头考虑了 20 个用户属性，例如 `page views`、`time spent`、`type of device used`、`search\
  \ history`、`click-through rate`、`cart abandonment rate` 等。他们实验了 20 种不同的算法方案，包括 `ensemble\
  \ techniques`。他们使用 `K-fold cross-validation` 严谨地验证模型，通过 `regularization` 防止过拟合，并向利益相关者展示详尽的可解释性仪表板，展示每个变量如何影响购买预测。\n\
  \n**恭喜！**\n\n通过深入研究数据并探索各种建模技术，该电子商务网站能够准确预测用户的购买行为。他们对透明度和模型验证的承诺确保了利益相关者能够放心地信任并采取模型预测。\n\
