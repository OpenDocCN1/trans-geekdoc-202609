- "# 无代码数据科学：精通高级数据分析、机器学习与人工智能\n\n\n\n\n\n\n\n\n\n\n\n\n## 献给 ARIF RANA - 1974 至\
  \ 2023\n\n我们将这本教材献给 `Arif Rana PhD MPH MPA MEd`，他于 2023 年 6 月意外离世。他最后担任的专业职位是纽约\
  \ `SUNY Polytechnic Institute` 健康科学学院副教授。\n\n他对他追求的每一个领域都充满热情，特别是健康信息学。他是我们两人的亲密朋友和同事，我们将深切怀念他。\n\
  \nArif 是一个无私、热心、以人性为本并致力于高质量教育的人。他致力于我们的事业，即将复杂的数据科学民主化，让更广泛的、才华横溢的专业人士能够从非编程的角度为数据科学领域做出贡献。\n\
  \n健康信息学、分析和教育领域需要更多像 Arif 这样的人，他们推动并支持了大胆的教育创新。如果我们为 ARIF 有影响的一生总结一些顶层成就，并作为一个缩写，我们会说他是非常**真实\
  \ (Authentic)**、**尊重 (Respectful)**、**鼓舞 (Inspiring)** 和**专注 (Focused)** 的。这些是 Arif\
  \ 一直表现出的品质。如果我们能留下这份成就遗产，我们中的任何一个人都应该感到自豪。\n\n\n## 关于作者\n\n`David Patrishkoff, M.S.`\
  \ 是一位精益六西格玛大师黑带，拥有全球 C 级执行经验，曾在年收入数十亿美元的公司担任过工程、质量和制造方面的职责。2001 年，他创立了一家咨询和培训公司（`www.e3.business`），在该公司，他为全球\
  \ 60 多个不同行业的组织提供培训和咨询，通过创新的流程改进和数据分析技术解决其关键任务问题。\n\n2018 年，他引入了机器学习技术，以对其大型数据集的研究获得更深入的见解，这包括美国交通事故的`死亡报告分析系统\
  \ (FARS)` 以及美国居家医疗患者的`家庭健康结果评估信息集 (OASIS)` 数据。他经常在国际会议上就他的研究和其他感兴趣的话题进行演讲。\n\n他是密歇根州弗林特\
  \ `Kettering University School of Management` 的特聘教师。他还是佛罗里达州劳劳代尔堡 `Nova SE University`\
  \ 属 `Dr. Kiran C. Patel Osteopathic School of Medicine` 的兼职教授，并在纽约州尤提卡 `SUNY Polytechnic\
  \ Institute` 的兼职教授。他在 `Nova University` 和 `SUNY Polytechnic Institute` 教授的一些分析课程中引入了\
  \ `Orange`。他已经在各个主题上培训、认证并指导了许多专业人士，包括超过 3,000 名掌握精益六西格玛技术的专业人士。他和他的公司还培训了超过 23,000\
  \ 名医疗专业人员实施`高可靠性组织 (HRO)`计划，以减少医疗系统中的医疗错误。\n\n`Dr. Robert Hoyt FACP FAMIA ABPM-CI`\
  \ 是一位背景丰富的内科医生。他曾在弗吉尼亚州私立执业了十五年，然后回到现役，在`美国陆军`服役了三年，在`美国海军`服役了十七年，并以`上将`军衔退休。在最后几年的现役期间，他在`海军航天医学研究实验室`进行了研究。\n\
