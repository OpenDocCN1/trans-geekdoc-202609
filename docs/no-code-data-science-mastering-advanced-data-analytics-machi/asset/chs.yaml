  \ 10 章\n\n# 图像分析\n\n“有数据烟，就有业务火。”\n\n— 托马斯·雷德曼\n\n![](img/image-M6MTZISG.jpg)\n\n\
  在本章结束时，读者应该能够：\n\n•描述卷积神经网络 (`CNNs`) 的层级及其作用。\n•列出 Orange 中可用的 `CNNs`。\n• 讨论图像分类。\n\
