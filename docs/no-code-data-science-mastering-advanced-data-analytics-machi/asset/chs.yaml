  27. UCI 数据存储库. `http://archive.ics.uci.edu/`\n\n# 4. 机器学习\n\n## 机器学习模型\n\n“在没有数据的情况下进行理论化是一个致命的错误。”\n\
  夏尔洛·霍姆斯，《红发会案》\n阿瑟·柯南·道尔 \n\n“要做出预测是很困难的，尤其是关于未来。”\n优吉·贝拉\n\n## 学习目标\n\n在完成第四章后，读者应该能够：\n\
  \n- 描述建模和算法是两个不同的概念。\n- 讨论机器学习流水线的工作原理。\n- 对比对比偏差与方差。\n- 列出 5 种分类算法和 5 种回归算法。\n\
  - 讨论所有模型面临的 3 个挑战。\n\n### 本章总结\n\n在本章中，我们将回顾逐步建模过程的工作流，该流程最终导致模型部署，即机器学习流水线。将讨论用于创建分类和回归模型的主要算法。此外，还将讨论过拟合与欠拟合、不平衡数据、合成数据、偏差与方差以及超参数优化。\n\
  \n### 核心原则\n\n- 在本教程中，我们对“模型”和“算法”术语的处理不同。\n- 成功且有效的模型需要业务相关性、领域准确性以及技术可行性。\n- 机器学习与编程的区别在于，传统编程设定规则；而机器学习从数据中学习规则。\n\
  - 理想模型旨在避免过拟合（过细）和欠拟合（过泛）。\n\n## 4.1 引言\n\n在专注于利用各种算法进行建模之前，让我们先探索建模过程。\n\n**要点**：尽管许多作者将模型和算法视为同义词，但我们认为它们是不同的。\n\
  \n\n\n\n经验丰富的数据分析师致力于机器学习过程模型的工作，如图 4.1 所示。该模型通常被显示为线性的，但实际上，为了追求尽可能好的预测模型，建模过程更像是一个非线性且有时是循环的过程。随着见解的增加和观察到模型性能可能出现的失误，可能需要重新回顾模型中的某些之前的步骤，并可能寻求额外的数据以改进模型训练。在这一持续改进模型的过程中，可能还需要构建新的特征。意外的见解还可能改变模型所需的分层范围或分层程度。此类惊喜和挑战可能需要\
  \ `DISCOVER` 过程中的课程活动，以支持模型的持续改进和微调。迭代模型改进是 `DISCOVER` 过程的核心，并且在数据提供新启示时应用灵活性。值得重复的是，数据科学家在项目上花费的三四之三的时间是在创建或运行模型之前花费在这个领域的（步骤\
  \ 1 到 4）。\n\n## 步骤 5：优化模型\n\n在本节中，我们现在应用 `DISCOVER` 流程的第 5 步，通过实验和模型调优来优化模型性能，如图\
  \ 4.2 所示。\n\n![](img/image-MATGSF28.png)\n\n图 4.1 具有线性活动非线性活动的 8 步数据科学 `DISCOVER`\
  \ 流程\n\n![](img/image-R81J42EA.png)\n\n图 4.2 `DISCOVER` 流程中的步骤 5\n\n以下列出了 `DISCOVER`\
  \ 流程步骤 5 中应探索以提高模型性能的关键模型优化技术：\n\n1. 在初始模型筛选期间，选择并测试多种算法、算法选项和正则化水平。\n2. 根据初始模型筛选的结果寻求进一步的微调和调整。\n\
  3. 使用 `random search`（随机搜索）和 `grid search`（网格搜索）方法应用超参数优化技术。\n4. 根据问题的特定目标，将阈值从默认设置\
  \ `0.5` 移动到其他值以减少假阳性和假阴性。\n5. 探索 `Orange Calibrated Learner` 组件的用途。\n6. 实验 `Orange\
  \ Stacking` 组件，这是一种从多个基模型计算元模型的集成方法。\n7. 聘领域专家，以对当前特征和模型中所做的假设提供更深层次的审查。\n8. 考虑向模型添加模型交互项，但不要增加由方差膨胀（`VIF`）衡量的多共线性。\n\
  9. 考虑向模型添加多项式和样条特征，但要注意这不要导致模型过拟合。\n10. 考虑其他可能进一步提高模型性能的数据科学实验。\n11. 在寻求改进模型性能的新方法时，重新回顾并审查所有过去的数据收集、预处理、模型构建假设和决策过程。\n\
  12. 为分析过程中的每一步寻求新的创新方案。\n13. 识别并解决模型偏差和公平性问题。\n14. 识别并解决影响模型性能的类别和特征平衡问题。探索 `Orange`\
  \ 中为 `Random Forest`（随机森林）和 `Logistic Regression`（逻辑回归）提供的 `SMOTE`、`oversampling`（过采样）、`undersampling`（下采样）和\
  \ `weighing`（权重）选项以解决类别平衡问题。\n15. 当数据集较小时，尝试添加合成数据，但要确保此类数据的加入改进了模型性能。\n16. 永远不要假设添加流行技术总是能改进你的模型的性能。通过数据科学实验亲手验证新技术的潜在改进。\n\
  17. 尝试独特的 `Orange` 工作流设置和自动化的 `BlueSky Statistics` 方法以探索超参数优化（`HPO`）。\n18. 使用各种方法减少过拟合，通过\
  \ `cross-validation`（交叉验证）、`regularization`（正则化）、建模期间选择较小的特征集、`early stopping`（提前停止）以及使用更多数据进行训练。\n\
  \n数据是驱动算法创建准确预测的关键燃料，处于数据科学预测分析步骤的核心（见图 4.1）。对于成功的分析，及早让临床和领域专家参与以识别预测特定结果的正确数据关重要。每个行业都需要定义应参与数据科学项目的关键专家、营销人员、供应商和客户。这些领域和临床专家还应该评估数据的完整性、相关性和准确性。如果他们的见解在\
  \ `DISCOVER` 过程中太晚，可能会导致额外的循环任务，并延迟创建大家都能信任的有效模型。\n\n收集涵盖所有潜在预测因的全面数据对于稳健的预测模型至关重要。缺乏此类数据会导致尝试增强模型性能的徒劳。然而，虽然过多的数据列会导致“维度灾难”，但“浅薄灾难”则源于数据不足可能导致分析无效。\n\
  \n在建模过程中，平衡充足的数据与数据陷阱至关重要。确保数据高质量、全面且结构化，为有意义的见解铺平道路。\n\n要点：添加更多低质量数据（行）不能替代对更有意义预测因子（列）的需求。通过优先质量而非数量，我们可以生成更有意义的见解。\n\
  \n作为提醒，在 `DISCOVER` 流程的步骤 3 中，我们进行了数据清洗、处理和特征工程。一旦经验丰富的数据分析师认为数据是干净、格式正确且经过广泛验证的，就可以开始数据探索和数据可视化阶段，通过\
  \ `EDA`（步骤 4）培养初步见解。在该阶段之后，算法将竞争决定哪些算法可以优化模型的一部分（步骤 5）。最佳算法可能需要调整（称为超参数优化或 `HPO`）。简单的\
  \ `HPO` 在第二章中定义，在本章中也会提到，但深入探讨 `HPO` 超出了本书的范围。\n\n模型还可以组合成集成团队，以测试一组算法（集成）的效果是否优于单个算法。\n\
  \n要点：高性能的预测模型可以为任务关键的决策过程显著增加价值。通过使决策者做出更明智的选择，此类模型可以在提高效率、节省时间、资源和降低成本的同时，保持以患者和客户为中心的优先事项。\n\
  \n### 4.1.1 模型是如何工作的？\n\n对于数据挖掘，有特征向量作为输入和输出。特征向量代表各种模型输入（预测因子），用于预测特定研究问题的结果。机器学习算法处理这些特征向量以创建预测模型。例如，在图\
  \ 4.2 中，我们有五位患者（行），每人都有六个预测因子（年龄、性别、吸烟等）来预测结果（癌症 = 1，良性 = 0）。\n\n要点：机器学习涉及使用数据创建一个模型，该模型通过识别输入预测因子与输出目标之间的模式和关系来从数据中学习，并对未来数据进行预测。\n\
  \n\n\n\n# 机器学习的监督学习方法与经典统计学不同，因为我们测试了许多候选函数（称为 `g`），这些函数将使用 `X1` 到 `Xn` 来提供最佳解释。在监督机器学习中，我们正试图求解这个方程\
  \ `Y = g(X1….Xn) + E`。`g` 函数被描述为众多算法中最优的算法。\n\n在经典的统计问题解决或研究中，目标通常是解决形式为 `Y = f(X1…Xn)\
  \ + E` 的问题，其中 `Y` 是被预测的结果，`f` 是统计方法（如线性回归或逻辑回归），`X1` 到 `Xn` 是预测变量，而 `E` 是误差或模型残差。\n\
  \n相比之下，机器学习的监督学习方法涉及测试许多候选函数 `g`，以确定使用 `X1` 到 `Xn` 对 `Y` 的最佳解释。因此，目标是求解方程 `Y = g(X1…Xn)\
  \ + E`，其中 `g` 是从众多算法中选出的最佳算法，`E` 是预测值与真实值之间的差异。\n\n## 模型误差与残差\n\n模型误差也称为残差。预测模型残差图可能是模型最有信息丰富的成绩单图形之一。图\
  \ 4.3 显示了预测值与实际数据的散点图，它比较了回归问题中实际数据与预测值（该问题旨在预测患者的体脂百分比）。45 度对角线代表一个完美的预测模型，此时观测值和预测值相同。如果你遇到这种乐观的结果，请务小心，它们可能好得不可真实。散点图中的点代表\
  \ x 轴上所有观测值和 y 轴上所有预测值的坐标。当图上的数据点位于左上区域时，预测数据高于实际观测数据。当图上的数据点位于右下区域时，预测数据低于实际观测数据。任何实际数据点（点）不恰好位于对角线上的模型残差散点图都代表着一个不完美的模型。如果点没有很好地遵循\
  \ 45 度对角线，则需要进行调查。这种情况意味着我们需要回到流程上，重新检查所有的假设，自我批判所做的任何捷径，并计划新的数据科学实验，以创建改进的预测模型。\n\
  \n## 在 Orange 和 JASP 中的可视化\n\n要在 `Orange` 中创建此可视化，将 `File` 小件与上传到 `Prediction` 小件的体脂数据集连接。将\
  \ `Linear Regression` 小件连接到 `File` 和 `Prediction` 小件。将 `Prediction` 小件连接到 `Scatter\
  \ Plot` 小件，并为 y 轴选择 `Linear Regression`，为 x 轴选择 `Class`。\n\n![](img/image-KIMW6OQV.png)\n\
  \n图 4.2 每个向量具有多个特征向量和一个输出变量\n\n要在 `JASP` 中创建此可视化，上传数据并在顶部菜单中选择 `Regression`。接下来选择\
  \ `linear regression`，并将结果变量移动到依赖变量（dependent variable）框，将预测变量移动到协变量（covariates）框。滚动到\
  \ `Plots` 并选择“Residuals vs Predicted”。![](img/image-GCOEXIJ2.jpg)\n\n图 4.3 实际值与预测数据的散点图\n\
  \n图 4.4 显示了实际值与预测数据图直方图的另一种变体，其中垂直的零残差线代表预测值与实际值之间的精确匹配。当残差为负或位于直方图中零残差线的左侧时，实际观测数据低于预测数据。当残差为正或位于直方图中零残差线的右侧时，实际观测数据高于预测数据。完美的预测值与实际数据直方图看起来像是一个狭窄且对称的直方图，代表预测值与实际数据值之间的紧密相关。\n\
  \n本质上，监督机器学习涉及识别将输入变量 `X1` 到 `Xn` 最佳映射到输出变量 `Y` 的函数 `g`。这是通过在标记数据集上训练模型来实现的，其中输入变量和相应的输出变量是已知的。模型然后使用这些训练数据来学习最佳\
  \ `g` 函数（算法），以预测新的、未见的输入变量的输出变量。监督机器学习方法的成功取决于输入变量的质量和相关性，以及选择学习函数 `g` 的最佳算法。²\n\
  \n![](img/image-AAF7KQZ4.jpg)\n\n图 4.4 预测值与实际数据的残差直方图\n\n创建一个初始模型很容易。然而，如果模型不满足预测建模性能目标，则需要对模型进行评估和优化。寻找合适的数据并为分析做好准备也可能是艰巨的。如果对待数据收集和准备任务，将对模型性能产生积极影响。我们将在第\
  \ 4.7 节讨论模型挑战。\n\n## 4.2 更多模型概念\n\n机器学习的主要目标是减少模型预测与实际结果之间的误差。某些误差是无法避免的，但某些是可以减少的，例如偏差和方差，它们是不可避免但可以减少的.³\n\
  \n### 4.2.1 偏差-方差权衡\n\n偏差-方差权衡有助于解释监督学习模型中的预测误差，并与欠拟合和过拟合有关。增加偏差会减少方差，反之亦然。\n\n\
  机器学习中的偏差（Bias）是指模型生成的预测值与实际或正确值之间的差异或误差。它是由于机器学习过程中的错误假设或过度简化而产生的系统性误差。高偏差模型倾向于过度简化数据中的关系，并可能无法捕捉复杂的模式或趋势。这会导致欠拟合，即模型在训练数据和未见数据上的表现都很差。\n\
  \n方差（Variance）是指模型过拟合数据的倾向。高方差模型过于复杂，对训练集的噪声和波动考虑过度。这可能导致过拟合，即模型过度拟训练数据，无法良好地泛化到新的、未见的数据。换句话之，高方差模型在训练数据上表现良好，但在测试或验证数据上的误差率很高。\n\
  \n这在图 4.4 中得到了证明。\n\n机器学习模型中遇到几种类型的偏差。以下是一些示例：\n\n• **简单性偏差（Simplicity Bias）**：这是指即使以牺牲捕捉底层模式或关系的代价，通常也倾向于简单的模型，这可能导致欠拟合和性能低下。\n\
  • **样本偏差（Sample bias）**：当用于训练模型的数据不能代表其应应用的人群时。\n• **标签偏差（Label bias）**：当训练模型的标签不准确或不完整时。\n\
  • **种族偏差（Racial bias）**：AI 可能对浅色皮肤与深色皮肤个体存有的偏差。\n• **方法论偏差（Methodological bias）**：设计不当的研究导致泛化能力差（输入垃圾进，垃圾出）。\n\
  • **确认偏差（Confirmation Bias）**：当模型被设计为确认预先存在的偏差时。\n• **算法偏差（Algorithmic Bias）**：当算法本身被设计为歧视某些群体时。\n\
  • **公平性偏差（Fairness Bias）**：当模型被设计为优化公平性，但公平性的定义是主观或不时不。\n\n以下是医疗机器学习模型中方差（过拟合）的一些示例：\n\
  \n• **图像分类**：机器学习模型经常用于分类医学图像如 X 光 或 MRI。如果模型在无法代表现实世界中遇到的图像多样性的有限数据集上进行训练，它可能会过拟合该有限数据集，并难以泛化到新图像。\n\
  \n\n\n\n\n-   **疾病预测**：机器学习模型也被用于根据患者数据（如人口统计学数据、病史和生活方式因素）预测某些疾病的风险。如果模型在较小或不具代表性的样本上训练，它可能会对一小群体过拟合，并做出不准确的预测。\n\
  -   **治疗建议**：在医疗领域，机器学习模型可以根据患者的病史和其他因素推荐治疗方案。如果模型对特定的患者子集过拟合，它可能会产生高方差，并为新患者推荐无效或有害的治疗方案。\n\
  -   **药物发现**：机器学习模型可以通过分析化学化合物及其属性的大数据集来发现新药。如果模型对特定子集过拟合，它可能无法识别出新化合物。\n-   **电子健康记录**：机器学习模型越来越多地用于分析电子健康记录（`EHRs`）以识别模式和趋势。如果模型对特定的患者群体过拟合，它可能会产生高方差，并无法为医院识别重要的见解。\n\
  \n理想的模型试图通过平衡训练和测试数据集的偏差（bias）和方差（variance），来最小化偏差（`欠拟合`）和方差（`过拟合`）。当方差高而偏差低时就会发生过拟合。在过拟合的情况下，模型试图同时拟合信号和噪声。欠拟合则相反。在训练机器学习模型时，算法通常会迭代不同的参数设置，以使模型预测值与实际值之间的差异最小化。\n\
  \n![](img/image-H55IT1.jpg) 图 4.5 偏差-方差权衡（感谢 Scottmann 提供）\n\n![](img/image-1SPS87JX.jpg)\
  \ 图 4.6 欠拟合\n\n### 4.2. 模型的可解释性与说明性\n\n难以理解的模型通常被称为`黑盒`（`black boxes`），它们并不总是有助于建立信任。容易理解的模型被称为`玻璃盒（`glass\
  \ boxes`），因为它们是透明的。\n\n-   机器学习中的**可解释性**是指理解机器学习模型如何做出预测或决策的能力。\n-   **模型说明性**是指机器学习模型对其预测或决策过程提供清晰且易于理解的解释的能力。\n\
  \n经典的统计方法如`逻辑回归`、`线性回归`和`决策树`被视为`玻璃盒`，因为它们具有可以解释的系数和节点。较新的算法如`神经网络`和`提升树`是`黑盒`。用于辅助说明性的常用解决方案包括：\n\
  -   `特征重要性`\n-   `模型可视化`\n-   `部分依赖性图`、`热力图`\n\n-   `局部可解释模型无关解释 (Lime)` 是一种技术，通过向原始数据点中添加噪声，然后将其输入黑盒模型，最后观察输出结果。每个原始数据点都可以通过新训练的解释器进行解释。Orange\
  \ 软件中未提供此选项。\n-   `Shapley 累加加解释 (SHAP)` 用于解释线性模型、基于树的模型和神经网络模型。关于`SHAP`的更多信息请参阅第\
  \ 5 节第 5.4 节。\n-   `排列特征重要性 (Permutation feature Importance)` 通过打乱列中的特征来确定其对结果（例如\
  \ `AUC`）的影响。它可以用于分类或回归。其核心思想是：如果打乱一个预测变量会导致模型性能显著下降，那么该预测变量必须是重要的。更多信息请参阅第 5 节第\
  \ 5.4 节。\n\n![](img/image-427RBSI1.png) 图 4.7 模型复杂度与模型误差的关系\n\n### 4.3 梯度下降\n\n\
  `梯度下降`（`Gradient descent`）是一种用于训练机器学习模型和神经网络的优化算法。其目标是每个模型实现最低错误率（`代价/损失` `cost/loss`）。模型将继续调整参数以产生最小误差。因此，梯度下降曲线是\
  \ U 形的。见图 4.8。\n\n下降曲线的起点是一个任意点。从该起点开始推导斜率，并使用切线。\n\n![](img/image-K1UCLF97.png)\
  \ 图 4.8 梯度下降\n\n-   `代价函数` 衡量预测结果与实际结果之间的误差。模型将继续调整参数以产生最小误差。一旦达到最小值，模型将停止学习。\n\n\
  #### 4.3.1 局部最小值与全局最小值\n\n`全局最小值`（`global minimum`）是`梯度下降`尽可能最小化`代价`的结果。在此过程中，算法可能会遇到`局部最小值`（`local\
  \ minima`），局部最小值可能有多个，而全局最小值只有一个。如果过程陷入`局部最小值`中，则代价可能不是最优。见图 4.9。\n\n![](img/image-AZ007E1N.png)\
  \ 图 4.9 局部最小值与全局最小值\n\n#### 4.3.2 梯度下降的类型\n\n-   `批量梯度下降 (Batch gradient descent)`\
  \ 累加训练集中所有点的误差，仅在一个`训练轮 (epoch)`后更新模型。批量处理效率很高，但对于大型训练数据集，处理时间很长。批量梯度下降通常产生稳定的误差梯度并收敛，但有时收敛点并不理想，导致产生最小值而非全局最小值。\n\
  -   `随机梯度下降 (SGD)` 为每个数据集样本运行一次训练轮，并一次更新一个训练样本的参数。因为只需要加载一个样本，它们更容易存储在内存中。频繁更新提供了更多细节和速度，但与批量梯度下降相比效率会降低。频繁更新有助于跳出局部最小值找到全局最小值。\n\
  -   `小批量梯度下降 (Mini-batch gradient descent)` 结合了`批量梯度下降`和`随机梯度下降`的概念。它将训练数据集分成小批次并更新每个批次。这在批量梯度下降的计算效率和随机梯度下降的速度之间取得了平衡。\n\
  \n![](img/image-XSRPDX4P.png) 梯度下降 (StatQuest)\n\n### 4.4 ORANGE 算法\n\n附录 B 包含了大多数机器学习算法，包括起源年份、描述和示例。\n\
  \n\n\n\n\nOrange 的一个引人注目的特点是它从每个主要的算法族中提供了算法选项，并且可以同时运行多个算法。这些并行运行的建模性能可以通过 `Test\
  \ and Score` 小部件查看。同时比较多个算法非常容易，这一功能在许多数据科学平台中是不具备的。此外，如前指出的，用户可以在训练数据和测试数据结果之间切换，以查看哪些算法表现最好，这是一个非常实用的软件功能。\n\
  \n本章中的算法描述可以通过右键点击小部件并选择 `Help` 菜单获取额外信息进行补充。通过双击小部件并查看每个算法可用的特定选项，可以使用各种选项和参数设置对这些算法进行“优化”。在开始时，最好接受小部件的默认参数设置。优化每一个算法已经超出了本课程的涵盖范围，因此我们只只展示一些细微的调整。作为一个教学知识点，为了获得最佳结果而调整算法被称为“**超参数优化**（HPO）”。⁹\
  \ 在机器学习中，**模型参数**指的是算法的内在特征，可以通过修改这些特征来尝试提高模型的性能。\n\n**模型参数**是模型自动学习的内容。例如：1) 线性回归中的权重或系数。2)\
  \ `SVM` 中的支持向量。3) 决策树中的分裂点。\n\n**模型超参数**用于优化模型性能。例如：1) `SVM` 中的核函数（Kernel）。2) `KNN`\
  \ 中 `K` 的值。3) 决策树的深度。更多信息请参见资源 # 8。\n\n### 4.4.1 Constant（常量）小部件\n\n该小部件作为模型非常保守的基准性能，所有其他建模活动都应该超越它。`Constant`\
  \ 小部件例程始终为分类任务选择多数类，为回归模型选择平均值。例如，如果 95% 的患者没有癌症，他们就是多数类，因此 `Test and Score` 小部件中的\
  \ `Constant` 结果将报告 95% 的准确率。因此，为了让算法有用，它的预测准确率必须超过 95%。\n\n### 4.4.2 K Nearest Neighbor\
  \ (kNN) 小部件\n\n- `kNN` 是一种用于分类和回归的相对简单的算法。\n- 该算法寻找其最近邻居来对相似数据分组。你可以调整/调优邻居的数量（`k`）以及衡量邻居距离的方法，例如使用\
  \ `Euclidean distance`（欧式距离）。¹⁰\n- `kNN` 被称为“懒学习”算法，因为它不会立即从训练集中学习。“相反，它存储数据集，并在分类时对数据集进行操作。”¹¹\n\
  - 该算法需要选择一个最优的 `k` 值，但注意其计算开销很高。\n- 在图 4.10 中，你正尝试将新数据点（?）分类为 A 类或 B 类。你可以选择三个最近邻居（`K\
  \ =3`）或七个最近邻居（`K=7`）。当 `k = 3` 时，数据点属于 B，但当 `k = 7` 时，它属于 A。`K` 衡量数据点之间的接近性，以分类如\
  \ A 类或 B 类的新数据点。\n- 该小部件对数据进行归一化并填充缺失值。它通过独热编码（one-hot encoding）将分类数据转换为数值。`KNN`\
  \ 对异常值敏感。\n- `kNN` 用于其他数据科学应用来确定数据的接近性。例如，合成少数类过采样技术（`SMOTE`）使用 `kNN` 寻找少数样本以帮助平衡不平衡数据集。¹²\n\
  - 关于寻找最优 `k` 值的更多信息可以在此参考文献中找到。¹³\n\n![](img/image-VQ78G0TY.jpg)\n\n图 4.10 k-最近邻算法（感谢\
  \ KDNuggets.com）\n\n![](img/image-L7NLPXTS.png)\n\nK-最近邻算法 (StatQuest)\n\n### 4.4.3\
  \ Decision Tree (DT) 小部件\n\n- `DTs` 可用于分类和回归。\n- 有人将一种类型的 `DT` 称为 `CART`（分类与回归树）。\n\
  - 树非常适合早期探索、可视化和解释，但准确性不如新的算法。¹⁴\n- 决策树的主要缺点是倾向于导致**过拟合**，因为它们可能会为了包含每个数据点而进行多次分裂。这意味着在训练数据上计算出的结果错误率低，但在测试数据上的错误率要高得多。Orange、`JASP`\
  \ 和 `Bluesky Statistics` 决策树的默认设置可以防止严重的欠拟合或过拟合。这就是在训练数据和测试数据上生成并比较性能指标的一个重要原因。可以修剪树（减少节点/叶子的深度）来防止过拟合。尝试不同的树深（例如\
  \ 4-6），查看验证集上的 `AUC` 变化多少。\n- 双击 `DT` 小部件，如果你的结果不理想或存在过拟合，请调整树的深度。\n- 使用连接到树小部件的\
  \ `Tree Viewer` 小部件（`Visualize` 菜单）查看树。\n- 典型的决策树图像可以在第 3 章找到。\n- 关于树如何工作的更多信息可以在第\
  \ 2 章讨论 `Rank` 小部件、第 3 章以及这篇文章找到。¹⁴\n\n![](img/image-07AYC5OR.png)\n\n决策树 (StatQuest)\n\
  \n### 4.4.4 Random Forest (RF) 小部件\n\n`RF` 被认为是一种集成算法，因为它将多个“弱学习器”（树）结合在一起成为一个强学习器。多棵树\
  \ = 森林\n\n- `RF` 以并行方式分析森林（非顺序方式）。\n- `RF` 比标准树更准确。\n- `RF` 具有针对不平衡数据的选项，可以为少数类添加权重。\n\
  - `RF` 用于分类和回归。\n- 该小部件具有调整超参数的选项。默认树数为 10，并勾选了“小于 5 不分裂”。\n- `RF` 能够忍缺失数据，数据不需要缩放或归一化。分类数据自动转换为数值，缺失数据被填充。\n\
  - Bagging 意味着在数据的子集上训练单个学习器并从个体预测中获得结果。模型之间是独立的。每个模型都在随机采样上进行训练。这种采样方法被称为自助采样（Bootstrap\
  \ sampling），简称 Bagging。随机树集成被称为随机森林。在图 4.10 中，`RF` 通过多数投票进行可视化。\n\n![](img/image-T383OFR.png)\n\
  \n随机森林第一部分 (StatQuest)\n\n### 4.4.5 AdaBoost (Adaptive Boosting) 小部件\n\n- `AdaBoost`\
  \ 是一种基于“增强”树的早期集成算法（1996 年）。\n- Boosted 意味着树是顺序评估的。（Boosted = 顺序）。\n- `AdaBoost`\
  \ 对异常值敏感，但较新版本不如此。它像随机森林一样自动处理数据。\n- 在增强中，训练数据是不放回采样的，因此每个数据只被使用一次。增强是一种顺序集成方法，首先在子集上训练模型，并在下一个顺序模型之前纠正错误率。因此，每个模型依赖于其他模型。当数据具有高偏差时，增强是一种很好的方法，它也有助于减少方差。\n\
  \n### 4.4.6 Gradient Boosting (GB) 小部件\n\n- `GB` 是此小部件提供的增强算法之一。点击小部件；选项有梯度提升、catboost\
  \ 和 `xgboost`。`Xgboost Random Forest` 是一种类似于随机森林的集成算法，从多个 `xgboost` 算法中选择最优。\n-\
  \ 这些集成梯度提升选择应该优于 `ADA Boost`。\n- `Catboost` 发布于 2017 年，可以处理分类数据。接受默认超参数。\n\n\n\n\
  \n\n- 集成模型可以同时执行分类和回归。它可以像随机森林一样对数据进行预处理。\n- 集成方法在数据竞赛中非常流行。\n- 默认值为：100 棵树、`Learning\
  \ rate = 0.3`、`Depth of trees = 6` 以及每每棵树的特征比例 = 1.0。学习率指定了每棵树对集集的贡献。你可以调整超参数并分析性能指标。\n\
  - 梯度提升（Gradient boosting）具有随机森林相同的优点。\n- `Catboost` 和 `Xgboost` 可以通过调整 `lambda`\
  \ 值进行 `L2`正则化。此小组件的结果可以使用另一个组件（`SHAP`）来解释，该组件位于“解释”模块下的“插件”中。\n\n![](img/image-0B4N21TC.png)\n\
  \n图 4.10 随机森林（数据来自 Wikipedia）\n\n- 集成模型是非参数化的，不需要数据遵循特定的分布，但它们可能会从数据转换中获益。\n- 它们可以处理混合数据类型：类别变量不需要手动进行独热编码（one\
  \ hot encoded）。\n- 特征的多重共线性不会影响模型的准确性和预测性能：不需要删除特征或进行其他工程处理来降低特征之间的相关性和相互作用。\n-\
  \ 它们过拟合的概率较低，因为它们使用了许多欠拟合（高偏差）的弱学习器，并将这些预测组合成更强的学习器，从而减少模型的过拟合（方差）。\n- 输入不需要缩放（归一化）。\n\
  - 它们的计算成本相对较低，因此比 `SVMs` 或 `ANNs` 快。\n- 对于不平衡数据集，它们可能比其他算法具有更优的性能。\n\n- 图 4.11 对了装袋（bagging）与提升（boosting）技术。¹⁵\n\
  \n![](img/image-4CB3914C.png)\n\nXGBoost 分类 (StatQuest)\n\n### 4.4.7 SVM（支持向量机）小组件\n\
  \n- `SVM` 用于分类和回归。\n- `SVM` 使用核函数通过超平面分割属性空间（图 4.12）。\n\n![](img/image-HMCRZHWP.png)\n\
  \n图 4.11 Bagging 和 boosting（数据来自 Pluralsight.com）\n\n- 支持向量是单个观测值的坐标。它们是两个集合边界上的选定点，定义了簇之间的间隔。\n\
  - `SVM` 算法具有忽略异常值的特征，专注于支持向量并寻找具有最大间隔的超平面。¹⁶\n\n![](img/image-0YUJECTF.png)\n\n\
  图 4.12 SVM 超平面\n\n![](img/image-G8AW74TI.png)\n\n支持向量机 (StatQuest)\n\n### 4.4.8\
  \ 线性回归小组件\n\n- 回归的目标是评估两点：A. 一组预测变量是否很好地预测结果（因）变量？B. 哪些变量是结果变量的显著预测因子，它们如何根据 `beta`\
  \ 估计值的大小和负号影响结果变量？具有一个因变量和一个自变量的最简单回归方程定义为 `formula y = c + b*x`，其中 `y` = 估计的因变量目标，`c`\
  \ = 常数，`b` = 回归系数，`x` = 自变量的值。¹⁷更多内容将在第 6 章中介绍。\n- 结果可以通过 `Lasso` 和 `Ridge`正则化得到改进（减少欠拟合和过拟合）。更多关于正则化的信息，请参见要点注释。Orange\
  \ 的线性和逻辑回归小组件都提供了可调节的正则。\n- 统计线性回归（最小二法回归）是回归的金标准。普通最小二法（`OLS`）“是一种通过最小化残差平方和来拟合回归线的方法”。¹⁸\
  \ 许多新算法也可以执行回归，例如随机森林和梯度提升。记住，统计模型带有应该满足的假设，而机器学习算法的假设较少，例如正态分布。\n- 结果通过 `R squared`、`均方根误差\
  \ (RMSE)` 等衡量。关于回归的更多内容将在第 6 章讨论。\n\n- 图 4.13 显示了线性回归，即一个数值尝试预测另一个数值。我们经常会处理具有多个预测值的多元线性回归。\n\
  - 图 4.13 显示了储蓄与工作时间之间的关系。如果员工已经工作了十周，计算结果与其工作时间有关。\n\n 图 4.13 显示了储蓄与工作时间之间的关系。\n\
  \n要点：Orange 的线性和逻辑回归小组件都提供了可调节的正则。\n\n### 4.4.9 逻辑回归小组件\n\n- 一种主要用于分类的高度认可的模型。\n\
  - 有人认为这种算法是分类的金标准。\n- 逻辑回归预测数据点属于某一类或另一类的概率（二分）。结果范围从 0 到 1（见图 4.14）。\n- 我们建议接受\
  \ `LR` 小组件的默认值，但注意有一个“平衡类别分布”选项。如果你有类别不平衡，请选择此选项。\n- 你也可以选择 `Ridge` 或 `Lasso`。`Elastic\
  \ Net` 仅适用于线性回归，不适用于逻辑回归。\n- 对于线性和逻辑回归，你可以将小组件连接到文件小组件并将输出到数据表中，查看系数。你可以对系数列进行排序，观察哪些变量与预测正相关。\n\
  \n![](img/image-IERF29.jpg)\n\n图 4.14 逻辑回归\n\n### 4.4.10 朴素贝叶斯 (NB) 小组件\n\n- `NB`\
  \ 基于溯到 1763 年的贝叶斯定理。\n- 先验概率（流行率）加上似然性预测修正或更新后的（后验）概率（见图 4.16）。\n- 我们使用依赖正态分布数据的\
  \ `高斯朴素贝叶斯`。\n- “朴素”意味着预测变量应该是相互独立的，这在现实中通常如此。\n- 线图组件有助于解释 `朴素贝叶斯`，就像它解释逻辑回归一样。\n\
  - 它是一种概率算法，也可以执行多分类。\n- `Na Bayes` 在小型分类模型上效果非常好。²¹\n\n\n\n\n\n•可以在此参考中了解更多关于 NB\
  \ 背后的计算内容。²²\n\n![](img/image-XKHAXEO4.png)\n\n朴素贝叶斯 (StatQuest)\n\n### 4.4.11 神经网络\
  \ (NN) 小部件\n\n•神经网络是由于节点层组成的网络，包含输入层、一个或多个隐藏层和一个输出层。节点执行数学运算以发现数据中的模式。每个节点通过关联的权重和阈值与另一个节点连接。如果节点的输出高于指定的阈值，则该节点被激活并将数据发送到下一层。否则，数据不会传递到网络的下一层。\n\
  \n•Orange 使用了源自 `Python` 包的多层感知器 (`MLP` )。\n\n•该小部件允许设置隐藏层的数量、激活类型、求解器类型、正则化程度以及最大交互次数。\n\
  \n•神经网络可用于分类和回归，也可用于图像识别和自然语言处理。\n\n![](img/image-RYTLVDKN.png)\n\n图 4.17 输入层、隐藏层和输出层\n\
  \n•`图 4.17` 显示了输入层、隐藏层和输出层。`图 4.18` 显示了权重被分配给输入，然后求和，并不断调整这些权重直到模型误差最小。图中未显示的是同样添加的偏置（bias）。该过程从随机权重和零偏置开始。初始过程类似于线性回归，通过系数对模型进行拟合和调整。偏置类似于截距。激活函数的作用类似于阈值触发器。`图\
  \ 4.19` 显示了一种常见的默认激活函数，称为整流线性单元 (`ReLu` ) 激活函数。`ReLu` 为神经网络引入了非线性，以帮助其识别模式。输出任何正值；其他值则置零。神经网络继续优化权重直到达到预期的输出。图中显示了神经网络的前向传播，但存在“反向传播”，因此会调整权重以最小化误差。这种权重优化的过程使用了梯度下降算法来最小化损失/误差。这是一个复杂的过程，因此建议进行额外的阅读或观看视频。强烈推荐以下视频。²³](#content0109.xhtml)\n\
  \n![](img/image-00C2RUPW.png)\n\n神经网络第一部分 (StatQuest)\n\n![](img/image-J2GX5R5C.jpg)\n\
  \n图 4.18 神经网络神经元\n\n### 4.4.12 堆叠 (Stacking) 小部件\n\n堆叠结合了几算法以提高性能。在 Orange 中，连接到堆叠小部件的模型数量没有限制。这是一种类似于基于树的算法集成或组合，例如随机森林和\
  \ `xgboost`。集成将所有模型的最佳属性结合在一起，使其成为强大的模型模型。在`图 4.20` 中，学习器（算法）是 `Naive Bayes`、`k-NN`\
  \ 和 `random forest`，而聚合器是 `logistic regression`。从 `logistic regression` 到堆叠小部件的连接应设置为\
  \ `learner >> aggregate`。如果未提供聚合输入，则将使用默认方法。这些方法是用于分类的 `Logistic Regression` 和用于回归问题的\
  \ `Ridge Regression`。堆叠结果在准确率、F1 分数、精确率、召回率和特异性方面略有提高。堆叠可用于分类或回归。（见表 4.1）。²⁴\n\n\
  ![](img/image-NLSSDM2Y.png)\n\n图 4.19 ReLu 激活函数\n\n表 4.1 分类模型的堆叠结果\n\n![](img/image-EVVH2VBD.png)\n\
  \n![](img/image-Y61UTWY2.png)\n\n图 4.20 堆叠工作流\n\n### 4.4.13 保存模型小部件\n\n此小部件将模型保存为\
  \ Orange 文件夹中的 pickle 文件 (`.pkl` )。注意：该算法已连接到 `File` 和 `Test and Score` 小部件。当你想要保存自定义设置的模型时，将数据馈给模型（例如\
  \ `Logistic Regression`）并将其连接到 `Save Model` 小部件。为模型命名，稍后使用 `Load Model` 小部件将其加载到工作流中\n\
  \n![](img/image-78U7FQIS.png)\n\n图 4.21 保存和加载模型的工作流\n\n### 4.4.14 加载模型小部件\n\n此小部件用于使用你之前保存的自定义模型。打开\
  \ `Load Model` 小部件并使用 `Browse` 图标选择所需文件。此小部件将现有模型加载到 `Predictions` 小部件中。配合 `Load\
  \ Model` 小部件使用的数据集必须包含与模型训练时原始数据兼容的属性！除非 `File` 小部件直接连接到你想保存的模型，否则 `Save Model`\
  \ 小部件将不会保存模型。见 `图 4.21`。\n\n## 4.5 JASP 模型\n\n在回归模块中，`JASP` 提供线性回归逻辑回归。机器学习算法可以在\
  \ `JASP` 的机器学习模块中找到。在接下来的章节中，我们将讨论 `JASP` 中用于建模的算法。当选择算法时，会在左侧看到以下图标选项。第一个黑色图标用于编辑作品标题。第二个绿色\
  \ `+` 图标允许你复制作品。第三个蓝色“i” 图标提供有关算法的信息，第四个红色“X” 图标删除作品。见 `图 4.22`\n\n![](img/image-78SASQZD.png)\n\
  \n图 4.22 JASP 图标\n\n### 4.5.1 线性回归\n\n回归模块 `JASP` 提供了线性回归和逻辑回归。机器学习算法位于 `JASP` 的机器学习模块中。在接下来的章节中，我们将讨论\
  \ `JASP` 中用于建模的算法。选择一个算法后，你会在左侧看到以下图标选项。\n\n第一个黑色图标用于编辑作品标题。第二个绿色 `+` 图标允许你复制作品。第三个蓝色“i”\
  \ 图标提供有关算法的信息，第四个红色“X” 图标删除作品。见 `图 4.22`（此处由于原文重复，已按逻辑处理）\n\n标准线性回归提供了未标准化和标准化的系数。正则化线性回归在机器学习模块中可用，且是推荐的方法。该方法允许你将数据划分为训练、测试和验证数据集，并应用\
  \ L1 正则化。JASP 还有许多其他选项，如下所示：\n\n•评估指标：`MSE`、`RMSE`、`MAE`、`MAPE` 和 `R`\n\n•报告回归系数。\n\
  \n•共线性诊断 (`VIFs`)\n\n•关于线性回归的更多细节将在第 6 章讨论。\n\n•机器学习模块中用于线性回归的其他算法：`Boosting`、`decision\
  \ tree`、`neural networks`、`random forest` 和支持向量机。\n\n### 4.5.2 逻辑回归\n\n经典的逻辑回归模型带有系数、优势比和\
  \ Wald 检验结果。`表 4.2` 显示了在心脏预测数据集样本上的逻辑回归结果。JASP 还有许多其他选项，如下所示：\n\n•系数\n\n•优势比\n\n\
  •多共线性诊断 (`VIFs`)\n\n•Wald 检验\n\n•性能报告为准确率、`AUC`、召回率、特异性和精确率。`ROC` 和 `PR` 曲线可选。\n\
  \n表 4.2 JASP 逻辑回归结果\n\n![](img/image-RBY5SHD2.png)\n\n### 4.5.3 JASP 算法\n\n总体而言，`JASP`\
  \ 中的算法和功能与 Orange 类似，但 `JASP` 提供了更多经典的选项。大多数算法都可以滚动到训练参数部分进行调整。JASP 具有稳健的性能指标，如表\
  \ 4.3 所示。\n\n表 4.3 JASP 在心脏预测数据集上 Boosting 的评估指标\n\n![](img/image-JKAM4CV5.png)\n\
  \n然而应指出几点差异：\n\n•JASP 中的数据集在测试数据上进行测试，但你永远看不到训练数据集的结果，因此无法判断过拟合或欠拟合。\n\n•你每次只能运行一个算法，这比\
  \ Orange 慢。此外，你每次必须重新输入目标和特征，以及训练、测试和验证划分。\n\n在机器学习模块的分类下，有多种算法。大多数与 Orange 相似，但有少数不同。决策树和随机森林包含了特征重要性，如表\
  \ 4.4 所示。这与 Orange 中的 `Rank` 小部件类似。以下是可用的 JASP 算法：\n\n•Boosting：这可能是一个标准的梯度提升算法。\n\
  \n•决策树：包含特征重要性\n\n\n\n\n\n- K-近邻\n- 线性判别分析\n- 神经网络：包括网络权重\n- 随机森林：包括特征重要性\n- 支持向量机\n\
  \n表 4.4 JASP 决策树的特征重要性\n\n![](img/image-BM50L605.png)\n\n## 4.6 MLOps\n\n模型创建完成后，工作并没有结束；它必须被部署。机器学习模型的运行实化被称为\
  \ MLOps。有些人将 MLOps 定义为包含三个部分：机器学习、开发和运维；每个部分都有一套不同的流程，如图 4.23 所示。²⁵ `MLOps` 是一个迭代过程，以持续改进和监控为目标。这更多属于数据工程师的领域，而不是数据科学家的领域。资深数据分析师更关注从可用数据中获取有意义的结果。\n\
  \n优化后的模型通常保存为 pickle 文件（`.pkcis`），新数据则被处理为加载的批文件（例如，每小时、每日或每周）或在线加载。在线意味着数据被立即处理。在线服务通常通过网络服务或流处理发生。用户可以发送\
  \ `HTTP` 请求（通常为 `JSON` 格式）返回预测结果。服务对请求做出响应并将模型和保存的预测应用于另一个流进行流处理。用户可以订阅输出流并根据预测结果做出决策。一旦模型部署，必须对其进行监控，以确定是否存在概念偏移或数据偏移，如下一节所示。\n\
  \n![](img/image-6357OBSQ.png)\n\n图 4.23 MLOps 流程\n\n## 4.7 应对模型挑战\n\n1976 年，著名的统计学家乔治·鲍克斯（George\
  \ Box）说：“模型都是错误的，但有些是有用的。”²⁶ 他在反思统计模型并不总能捕捉数据的复杂性，因此不够准确的问题。从那时起，我们看到了许多统计和机器学习模型的诞生。要成功，模型必须让终端用户（医生、患者和客户）、高管层（良好的业务案例）、首席信息官（CIO）以及数据科学家或资深数据分析师（技术上可靠的项目）认为合理。\n\
  \n**核心要点**：遗憾的是，模型由于后续段落概述的许多原因而失败。创建模型是容易的部分。\n\n模型问题可能始于数据量和质量的不足。深度学习模型需要大量数据，其性能取决于标记的准确性，而标记并不总是正确的。在机器学习中，过拟合和过度乐观的模型非常常见。未能报告所有性能参数是常见现象，且未能妥善处理不平衡数据集也频繁发生。\n\
  \n文献中充满了代表概念验证的预测模型。许多模型从未部署，许多模型失败了。最近的一项调查显示，大约 80% 的模型从未部署。调查作者认为，领导力不足是部署率低的原因。²⁷\
  \ 此外，模型很少使用机构外部的数据进行验证，因此它们可能不具有通用性。然而，由于患者人口统计数据、患者构成等差异，与外部数据比较结果可能是困难的。²⁸ 此外，很少基于模型启动前瞻性试验，以观察其预测与实际患者结果的比较。\n\
  \n从长期来看，模型需要进行检查和平衡以防止“模型偏移”。模型偏移包含两个部分：概念偏移（concept drift）和数据偏移（data drift）。前者意味着目标变量的统计属性随时间发生变化，例如疾病的流行率。数据偏移意味着预测变量的统计属性由于某些原因（例如季节性）发生变化。这些变化可能是明显的也可能是微妙的，但必须随时间进行跟踪。大多数模型可能在某些时刻需要重新训练。更多细节请参考此参考文献。²⁹\n\
  \n### 4.7.1 模型偏差与公平性\n\n在 4.2.1 节中，我们讨论了偏差-方差权衡。在现实中，数据科学还会遇到多种其他类型的偏差。大多数是方法论偏差，一旦发现，它们会对机器学习模型的准确性和通用性产生不利影响。例如，如果你的数据集主要包含白人男性，那么你可能会对他们产生偏差，导致其与其他性别和种族的相关性降低。另一个例子是类不平衡，即你在少数类中没有足够的样本。让我们从讨论与数据科学相关的偏差开始.³⁰-³²\n\
  \n- **系统性偏差（Systemic bias）**：当特定群体持续被过度代表或代表不足时发生。\n- **自动化偏差（Automation bias）**：在没有任何证据支持的情况下采纳或相信技术的倾向。\n\
  - **选择偏差（Selection bias）**：当选择参与研究的个人或群体不能代表目标总体时发生。\n- **报告偏差（Reporting bias）**：可以有多种形式。引用偏差发生在文献检索只选择狭窄范围内文章；语言偏差发生在仅选择母语时；发表偏差发生在仅报告或阅读积极结果时。\n\
  - **过度泛化偏差（Overgeneralization bias）**：当你尝试将来自数据集的发现应用于其他不同的数据集时发生。\n- **群体归因偏差（Group\
  \ attribution bias）**：人类倾向于相信小组中的个人与小组所有成员具有相同的信念。\n- **隐性偏差（Implicit bias）**：指无意识地接受某些态度或刻板印象的倾向。\n\
  \n### 4.7.2 处理不平衡数据集\n\n#### 4.7.2.1 引言\n\n出于几个原因，整个章节都专门讨论了类不平衡。医学和其他行业数据通常是不平衡的，其中感兴趣的少数类较少，例如医院的“再次入院”小于多数类“未再次入院”，医疗错误、患者投诉、制造废品、返工、设备停机、客户服务投诉、客户产品投诉以及其他问题都小于该方程式正的一侧。传统上，少数类被标记为\
  \ `1`，多数类标记为 `0`。\n\n不平衡没有正式的定义，例如多数类与少数类的比例大于五，或其他经验法则。有些人认为任何比例的不平衡在低比例下都会损害模型性能，但另一些人认为只有高比例的不平衡才引起极大关注。有些人说模型敏感性完全取决于数据的复杂性。那么，多大程度的类差异会被认为是严重的？Brownlee\
  \ 建议 `100:1` 到 `1000:1` 的不平衡比例应被认为是类之间严重的。³ Google 提供了根据特定不平衡比例评估分类不平衡程度的指南：`2.5:1`\
  \ 到 `5:1` 为轻度平衡，`5:1` 到 `100:1` 为中度不平衡，超过 `100:1` 为严重不平衡。³⁴ Kaggle 将不平衡数据定义为任何类至少比另一类多十倍的数据。⁵\n\
  \n**核心要点**：问题在于类不平衡会影响准确率和 AUC 等分类模型性能指标。大多数用于分类函数预测分析的算法在平衡数据集上表现更好。因此，任何程度的类不平衡都应该引起重视，并在做出建模决策之前通过数据实验进行评估。\n\
  \n此外，国际机器学习指南（如 `TRIPOD ML`）未提供如何处理类不平衡的指导.³⁶ 这意味着该问题没有指南吗，还是意味着对该问题的研究不足？本章将讨论存在类不平衡时常用的模型性能指标，以及处理该问题的框架。\n\
  \n\n\n\n创建高性能模型需要针对特定数据集进行多次实验，以找到数据填充、数据转换、归一化方法以及不平衡处理的最佳方案。\n\n**关键点**：在数据科学中，捷径是不受欢迎的，标准的默认设置通常不是最佳选择。还应该小心不要总是假设某个数据集的实验结果会为另一个数据集提供理想的选择、最佳实践和可靠指南。在预测建模中，没有免费的早餐、午餐或晚餐。在高级数据分析和数据科学中，唯一可能的保证是：盲目应用表面化的指南、追求捷径以及缺乏数据科学实验，将受到不准确预测模型的严厉惩罚。\n\
  \n我们应该始终记住，预测建模是利用数学模型预测未来的复杂艺术与科学，而未来将极大阻碍这种理解其意图的努力。预测建模不应被轻视，也不应以天真的态度对待。\n\n\
  **关键点**：医疗健康数据集通常包含大量的健康个体群体和规模小得多的健康健康群体。它们可能包含关于某些人群群体的大量信息，但对其他人群部分需要更多信息。数据集中不同感兴趣组的数据数量的不平衡可能会导致机器学习算法出现各种问题，影响其预测的准确性，并导致预测偏向于对多数类准确。\n\
  \n在处理不平衡数据集时，检查 `Data Sampler` 小部件中的 `stratify sample`（分层采样）选项非常，这样训练集和测试集就会相同比例的少数类数据样本。对于极端的类别不平衡，这一步将消除较小的测试集无法获得或无法获得少数类数据样本的风险。\n\
  \n## 4.7.2.2 类别不平衡的模型性能指标\n\n如果你有理由相信类别不平衡正不利于你的模型性能，那么你需要寻找 `AUC` 和分类准确率 (`CA`)\
  \ 指标之外的性能指标。在面对类别不平衡时，这两者都过于乐观。\n\n- `精确率-召回率曲线` (`PRC`）在不同的决策阈值下，将 `recall`（敏感性）绘制在\
  \ x 轴上，将 `precision`（精确率）绘制在 y 轴上。记住 `recall` 的计算方法是真阳性除以（真阳性加假阴性）。`Precision`（正性预测值）是真阳性数量与真阳性加假阳性总和的比率。它描述了模型预测正类的能力有多好。\n\
  \n对于类别不平衡，更优选择 `PRC`，因为 `PRC` 关注的是少数类（真阳性和假阳性），这通常是感兴趣的类。`PRC` 是 `Orange` 的 `Evaluate`\
  \ 模块中提供的三个模型性能曲线选项之一。`Performance Curve` 小部件连接到 `Test` 和 `Score` 小部件，设置应为 `Target\
  \ = 1` 且 `Model = logistic regression`。\n\n`ROC` 有默认概率阈值 `0.5`。`AUC` 的 `no skill\
  \ level`（无技能水平）也被假设为 `0.5`，这由 `ROC` 曲线上的对角线表示。换句话说，`AUC` 为 `0.5` 并不比猜测好，也意味着它不能很好地“区分”两类（正性和负类）。\n\
  \n与 `AUROC`（ROC 曲线下的面积）不同，`AUPRC`（PR 曲线下的面积）的 `no skill level` 等于正样本的百分比，这由 `PR\
  \ curve` 上的水平线表示，该线与 y 轴相交，指示该数据集中正样本的比例。图 4.24 中的 `no skill level` 由标记为 `Baseline\
  \ Classifier` 的水平线显示。在另一个示例中，如果 5% 的样本显示患癌而 95% 没有，则 `no skill level` 将设置为 `0.05`。对于类别相等的数据集，`no\
  \ skill level = 0.5`，因为感兴趣的类别 = `50%`。图 4.24 显示了一个完美分类器、一个相当好的分类和一个基准分类器。³⁷\n\n\
  “分类器”是一种尝试在特定数据集上做出良好预测的算法。\n\n![](img/image-NPNM91XJ.png)\n\n图 4.24 具有三种不同性能分类器的\
  \ PR 曲线\n\n**关键点**：阈值用于区分一个分类类与其他类的决策边界或截止点。在二分类分类选择中，默认阈值为 `0.5`。这意味着如果计算出的概率为\
  \ `0.49`，它将加入零类；如果计算出的概率为 `0.51`，它将加入 1 类。\n\n你可以从数据或可视化（例如帕累托图）计算正样本百分比。第三种方法是使用\
  \ `Constant` 小部件，它仅根据频率进行预测。使用具有约 46% 正例的平衡心脏病预测数据集，你可以在图 4.25 中看到 `no skill level`\
  \ 设置为 `0.46`。你想要确保 `PRC` 性能高于无技能基准水平，就像你希望 `AUROC` 高于 `0.5` 一样.³⁸ 在图 4.25 中，注意 `PRC`\
  \ 下方的阴影、`PRC` 下的面积 (`AUPRC`) 以及对于 `logistic regression` 算法等于 `0.925` (92.5%)，`Orange`\
  \ 在 `PRC` 输出的左下角显示此。注意水平虚线，它代表这个相对平衡数据集的 `no skill level`，并等于 `0.46`。\n\n`PRC` 是通过在不同阈值下检查\
  \ `precision` 和 `recall` 创建的。⁹ 使用图 4.25 中的 `PRC`，你可以将鼠标悬停在曲线数据点上，它将显示阈值以及相关的 `precision`\
  \ 和 `recall` 值。表 4.3 提供了平衡数据在不同阈值下的 `precision` 和 `recall` 示例。\n\n![](img/image-Q2MA05L9.jpg)\n\
  \n图 4.25 应用于心脏病预测数据集的逻辑回归 AUPRC\n\n表 4.3 不同阈值下的精确率和召回率\n\n| 阈值 | Precision | Recall\
  \ |\n| --- | --- | --- |\n| .978 | .974 | .266 |\n| .756 | .911 | .682 |\n| .559\
  \ | .864 | .777 |\n| .322 | .753 | .856 |\n| .133 | .640 | .950 |\n\n**关键点**：如其他章节所述，`precision`\
  \ 和 `recall` 构成了一种权衡。在高阈值下，你捕捉到了少数正样本且没有假阳性，因此 `precision` 很高，但 `recall` 较低。相反，当阈值较低时，你捕获了更多正样本但更多假阳性，因此\
  \ `recall` 较高，而 `precision` 较低。例如，使用心脏病数据集和 `logistic regression`，在 `Calibration`\
  \ 小部件中调整阈值后，当阈值为 `0.422` 时，`precision = 0.833`，`recall = 0.827`。最终，关于哪一个更重要（`recall`\
  \ 还是 `precision`）是一个临床决策。\n\n![](img/image-C3SQMUF4.png)\n\n图 4.26 精确率-召回率曲线。逻辑回归的绿色线。AUPRC\
  \ = 0.122\n\n图 4.26 显示了一个平衡数据集的 PR 曲线，其中正样本比例约为 5.5%。注意 `PRC` 和 `AUPRC` 低得多，但 `PRC`\
  \ 图形上的 `no skill level`（水平虚线）也是如此。重要的是，尽管 `AUPRC` 较低，但它仍然高于 `no skill level` 下方的面积](#content0117.xhtml)\n\
  \n由于此示例中严重的类别不平衡，阈值较低。例如，在阈值为 `0.127` 时，`recall = 0.5`，`precision` 为 `0.181`。\n\n\
  在查看 `PRC` 曲线时，与与 `ROC` 曲线对比时熟悉的思路需要进行调整。\n\n在 `ROC` 曲线上，我们可以得出以下观察和结论：\n\n- `no-skill`\
  \ 水平是一条 45 度线。\n\n\n\n\n- 任何在 `ROC` 图表上性能极佳的模型都必须创建一条延伸到 `ROC` 图表左上角的曲线。\n- `ROC`\
  \ 的任何 `AUC` 高于 50%（即 45 度对角线无技能水平线）都被认为是正在朝着正确的方向发展。\n\n在 `PRC` 图表上，我们可以得出以下观察和结论：\n\
  \n- “无技能”水平是一条水平线，其数值设置为该数据集中正样本的百分比，该百分比会根据数据集的不平衡程度而剧烈变化。\n- 任何在 `PRC` 图表上性能极佳的模型都必须创建一条延伸到\
  \ `PRC` 图表上方边缘的曲线。即使水平线很低，判断模型优坏的唯一指标是它向该水平线上方延伸有多远。\n- `PRC` 的任何 `AUC` 高于正样本百分比（水平无技能水平线）都被认为是正在朝着正确的方向发展。\n\
  \n### 比较 `AUROC` 值与 `AUPRC` 值时的问题\n\n- `AUC-ROC` 通过衡量在不同分类阈值下真阳性率 (`TPR`) 和假阳性率\
  \ (`FPR`) 之间的权衡来总结模型的性能。\n- 在高度不平衡的数据集上评估模型时，`AUC-ROC` 可能会产生误导。\n- 精确率-召回率曲线更关注正类，并且在处理不平衡数据集时特别有用。\n\
  - `AUC-PRC` 对不平衡数据集的性能变化更敏感。\n- 即使我们只是比较这两个图表上仅高于无技能水平的每项指标的 `AUC`，根据上述观点，这两个指标之间的比较也并非“同类比较”的比较。\n\
  \n`F1` 分数在类别不平衡的情况下很有帮助，因为它关注少数类，特别是真阳性和假阳性。`F1` 分数是精确率和召回率的调和平均数。⁴ ⁴⁰\n\n- `F1`\
  \ 分数 = `2 * (precision * recall)/(precision + recall)`。如果 `precision = 0.5` 且 `recall\
  \ = 1`，那么两倍 (0.5 乘以 1) 除以 (0.5 加 1) = 0.66。\n- `F0.5` 分数 = `((1 + 0.5²) * Precision\
  \ * Recall) / (0.5² * Precision + Recall)`。例如，`((1 + 0.5² ) X 0.5 X 1 / 0.5² X 0.5\
  \ + 1) = 0.625/1.125 = 0.55`。\n- `F2` 测量 = `((1 + 2²) * Precision * Recall/ (2²\
  \ * Precision + Recall)`。例如，`((1+2² ) X 0.5 X 1 / 2² X 0.5 + 1 = 2.5/3 = 0.833`。⁴¹\n\
  \n**关键点：** `F0.5`、`F1` 和 `F2` 都是用于评估分类问题的模型性能指标。它们在平衡精确率和召回率的方式上有所不同。\n\n- `F1`\
  \ 分数是精确率和召回率的调和平均数，对精确率和召回率给予相同的权重。\n- `F0.5` 分数给予精确率更多的权重，给予召回率更少的权重。\n- `F2` 分数给予精确率更少的权重，给予召回率更多的权重。\n\
  \n马萨斯相关系数 (`MCC`) 考虑了混淆矩阵中的四个值 (`TP`、`FP`、`TN` 和 `FN`)，被认为是一种平衡的指标。高 `MCC` 值（接近\
  \ 1）意味着两个类别都被预测良好，即使其中一个类别被不成比例地低估（或高估）。高 `MCC` 值（接近 1）意味着两个类别都被预测良好，即使其中一个类别被不成比例地低估（或高估）。高\
  \ `MCC` 值（接近 1）意味着两个类别都被预测良好，即使其中一个类别被不成比例地低估（或高估）。高 `MCC` 值（接近 1）意味着两个类别都被预测良好，即使其中一个类别被不成比例地低估（或高估）。高\
