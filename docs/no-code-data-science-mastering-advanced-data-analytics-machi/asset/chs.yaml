  \ `Data Table` 小部件中的 `FDR` 值。\n\n图 2.43 显示了 `Correlation` 小部件中体脂百分比预测变量的 `Pearson`\
  \ 相关系数的前三名排序预测变量相关性的散点图，以及 `Data Table` 小部件中的 `FDR` 值。这些输出基于图 2.41 所示的工作流。](#content0057.xhtml)\n\
