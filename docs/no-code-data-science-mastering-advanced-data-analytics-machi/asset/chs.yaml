  \ 7.22 所示，工作流如图 7.23 所示。\n\n\n\n\n打开 `Hierarchical Clustering`（层次聚类）组件，在 `Linkage`（链接）下选择\
  \ `complete linkage`（完全连接），并设置 `annotations = County No (number)`。尝试使用一种以上的链接方法是明智的，因为它们可能会产生不同的结果。修剪选择\
  \ `none`，但在 `Selection`（选择）下，选择 `Top N` 并观察选择 `2` 个簇与 `3` 个簇的区别。由于为 `k-means` 聚类选择\
  \ `2` 个簇的原因相同，我们在这里也选择 `two` 个。`C3` 只有 `5` 个实例。在 `Distances`（距离）组件中选择 `Rows`（行），`Hierarchical\
  \ Clustering` 组件将显示两个聚类，右侧带有县的编号。见图 7.26。\n\n在 `Distances` 组件中选择列，并查看图 7.27 中的结果。现在你可以看到右侧两个簇的列属性。这告诉你有\
  \ 11 个预测变量与簇 1 相关。\n\n将 `Data Table`（数据表）组件连接到 `Hierarchical clustering` 组件和 `Box\
  \ Plot`（箱线图）组件。打开 `Data Table`，你会看到一个新列 `cluster.`。打开 `Box Plot` 组件，并将 `Cluster`\
  \ 为 `Subgroup`（子组）。你可以开始比较簇 1 与簇 2 的均值。在图 7.25 中，了簇 1 和簇 2 自评健康状况“良好/差”的百分比比较。考虑查看多个预测变量——将簇\
  \ 1 与簇 2 进行比较。\n\n![](img/image-CGV47VR6.jpg)\n图 7.24 距离矩阵组件结果\n\n![](img/image-R02EOC0T.jpg)\n\
  图 7.25 按簇划分的健康良好/差评分箱线图\n\n![](img/image-6I85MEJM.png)\n图 7.26 带有县编号的树图\n\n![](img/image-5PZOH6PS.jpg)\n\
  图 7.27 带有簇 1 和簇 2 预测变量的树图\n\n经过多次比较，你确定簇 2 由健康状况较差的特征组成。你可以返回查看每个簇与哪些县编号相关。这应该会让任何州卫生部门感兴趣。\n\
  \n### 7.3.2 成熟度级别\n\n- **低成熟度示例**：一家医疗机构将手术部位感染的解决视为一个简单的分析练习，他们对手术部位感染数据的无监督分析也有同样的看法。他们拥有大量非结构化数据，例如电子健康记录\
  \ (`EHR`）数据、临床笔记、出院摘要、手术过程以及许多关于患者的非结构化信息。\n\n利用他们所有可用的非结构化数据，他们只决定用一种分析技术分析他们的\
  \ `EHR` 数据：`k-means`。他们通过 `k-means` 识别出了被诊断为手术部位感染的独特患者簇，但他们没有分析工作来识别这些未命名簇的实际名称。结果是未能识别或解决任何有用的趋势、模式或根源。他们的手术部位感染率并没有下降。他们得出结论，认为自己已经在尽所努力减少手术部位感染，没有其他改进空间了。\n\
  \n> **警告！**\n\n- 肤浅的分析结合对任务复杂性的低估可能会产生价值价值分析的幻象，但真实结果是只有分析活动，而没有可操作的见解、行动或改进。\n\
  - 该机构仅用一种可用技术分析了其可用无监督数据的一部分，导致其手术部位感染率没有下降。\n\n- **中等成熟度示例**：一家医疗机构将手术部位感染的解决视为一个简单的分析练习，他们对手术部位感染数据的无监督分析也有同样的看法。他们拥有大量非结构化数据，例如电子健康记录\
