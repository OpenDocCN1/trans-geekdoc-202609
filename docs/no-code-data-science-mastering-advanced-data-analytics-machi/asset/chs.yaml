  \n![](img/image-NA1XV4BG.jpg)\n\n# 第 7 章：无监督学习\n\n“数据是新的石油。”\n——Clive Humby\n\n\
  ![](img/image-M6MTZISG.jpg)\n\n## 学习目标\n\n完成第七章后，读者应该能够：\n\n- 比较监督学习和无监督学习。\n- 描述无监督学习的几种用例。\n\
  - 讨论轮廓系数（silhouette score）和散点图如何帮助确定最佳 k 值。\n- 描述绘画组件（paint widget）如何创建随机聚类进行分析。\n\
  - 比较层次聚类与 k-means 聚类。\n- 比较凝聚型层次聚类与分裂型层次聚类。\n- 讨论为什么在聚类中距离测量是强制性的。\n- 讨论关联规则在商业世界中的应用。\n\
  - 解释关联规则如何应用于医学领域。\n- 描述支持度（support）、置信度（confidence）和提升（lift）。\n\n## 第 7 章总结\n\n\
  本章将讨论无监督学习，这种学习没有指定的标记或结果。在无监督学习中，我们希望机器学习能够在数据中发现新的有趣的分组（聚类）和模式。与监督学习相比，这种方法在医学研究中较少使用，但常用于客户细分、遗传学、推荐系统、异常检测、预防性维护以及许多其他领域。无监督学习包含一个试错分析过程，因此需要大量的数据和耐心。并不是每个数据集都适合聚类，而且这种方法比分类或回归复杂得多。尽管如此，由于它能够识别数据中意料之外的未标记的聚类、异常和细分，并能为许多不同的应用和行业提供有价值的见解，其回报可能是巨大的。\n\
  \nK-means 聚类确实需要调整，而层次聚类是最直观的无监督学习方法之一。主成分分析（PCA）和关联规则也是无监督学习非常有用的分析方法。\n\n你很少遇到使用关联规则的医学文章，但它仍然值得了解。和聚类一样，这个过程需要试错和领域知识。注意：关联和相关性并不证明因果关系。\n\
  \n## 核心原理\n\n- `K-means` 和层次聚类可以作为第一步，用于发现未标记数据的少量逻辑分组，随后是繁琐的任务：为这些潜在的未命名聚类命名，以使聚类组具有意义。\n\
  - `Principal Component Analysis (PCA)` 是另一类型的聚类，它将高维数据压缩成聚类，并将聚类分成按优先级排序的较小组件组（聚类），这消除了数据集中存在的任何多共线性。这些新的未命名主成分也需要命名，以便使分析具有实际价值和可解释性。\n\
  - `Association rules` 被用作另一种聚类无监督数据的独特方法，以发现哪些项目或特征经常一起出现，从而产生良好或不理想的事件。例如，这种技术可以识别症状、疾病和治疗之间频繁观察到的关系，利用这些见解可以改善患者预后。\n\
  \n## 7.1 无监督学习\n\n对未标记数据进行无监督学习可以作为探索性工具，发现可以进一步详细探索的模式。结果是预测变量可以通过分类、回归或两者进行减少和进一步探索。\n\
  \n与监督学习相比，无监督学习更困难，但具有创建额外见解的巨大潜力。目前，该方法在医学领域最常见的应用是分析基因组信息，在其中你希望根据基因型、表型和人口统计学信息确定是否存在新的数据分组/聚类。在医疗保健领域，该方法最常用的用途是：\n\
  \n- 基因组学\n- 患者细分\n- 疾病聚类\n- 医学影像学\n- 自然语言处理\n- 异常检测\n\n聚类的其他非医疗用途还包括：\n\n- 推荐系统\n\
  - 市场细分\n- 社会网络分析\n- 搜索结果分组\n- 图像分割\n- 欺诈检测\n\n## 7.2 聚类\n\n对未标记数据进行无监督学习可以作为探索性工具，发现可以进一步详细探索的模式。结果是，预测变量可以通过分类、回归或两者进行减少和进一步探索。\n\
  \n无监督学习比监督学习更困难，但具有创建额外见解的巨大潜力。目前，该方法在医学领域最常见的应用是分析基因组信息，在其中你希望根据基因型、表型和人口统计学信息确定是否存在新的分组/聚类。在医疗保健领域，该方法最常用的用途是：\n\
  \n- 基因组学\n- 患者细分\n- 疾病聚类\n- 医学影像学\n- 自然语言处理\n- 异常检测\n\n聚类的其他非医疗用途还包括：\n\n- 推荐系统\n\
  - 市场细分\n- 社会网络分析\n- 搜索结果分组\n- 图像分割\n- 欺诈检测\n\n## 7.2 聚类\n\n对未标记数据...\n\n### K-means\
  \ 聚类\n\n`K-Means` 是最常用的聚类算法。它找到数据的聚类中心，如图 7.1 所示，这些中心被称为质心。`K-Means` 将数据分配到聚类中，使得数据点与质心之间的距离和尽可能小。\n\
  \n![](img/image-J98ANX.jpg)\n\n图 7.1 聚类\n\n`K-Means` 要求预先确定聚类的数量（k）。现实情况下，人们尝试不同的\
  \ k 值来查看能发现什么。如果你足够幸运，可能从一开始就找到匹配数据集的 k 值，但不要期望经常发生。在 Orange 中，我们使用轮廓系数（silhouette\
  \ score）和散点图（Silhouette Plot）组件来确定最佳 k 值。肘图（elbow plot）也被使用，但在 Orange 中不可用。在无监督学习中，数据必须是数值型的并经过归一化或标准化，以确保聚类准确有效。\n\
  \n![](img/image-X67BM5O.png)\n\n图 7.2 K-means (StatQuest)\n\n### 7.2.1 K-means 聚类练习\n\
  \n### 7.2.1.1 使用合成数据进行 K-means 聚类\n\n为了说明 `k-means` 聚类，我们可以使用 `Paint` 组件并创建聚类。在图\
  \ 7.2 中创建了三个聚类（C1、C2 和 C3）。\n\n打开 `Paint` 组件并创建聚类，如图 7.2 所示。将 `Paint` 组件连接到 `K-means`\
  \ 组件并打开后者。正如你看到的，当选择“从 2 到 8”时，三个聚类的轮廓系数最高（图 7.3）。轮廓系数是所有数据集实例的平均轮廓系数。轮廓系数衡量一个聚类中的点与其相邻聚类点之间的距离，范围从\
  \ -1 到 1。1 分意味着聚类之间很远，0 分意味着分离度很小。图 7.3 显示了三聚类场景最高的轮廓系数。当你连接到 `Silhouette Plot`\
  \ 组件时，三个聚类也是可见的（图 7.4）。\n\n### 7.2.1.2 在乳腺数据集上进行 K-means 聚类\n\n对于此练习，选择了包含在 `Dataset`\
  \ 组件中的瑞士乳腺病理数据。更多信息可以在 UCI ML 仓库中找到。该数据集的目标是预测哪些细胞核特征预测良性与恶性组织。我们预先知道可用预测因子以很高的准确率预测恶性，因此具有良好的模型“区分度”。这意味着我们应该找到两个聚类：良性和恶性。\n\
  \n![](img/image-8CUMUAEA.png)\n\n图 7.2 在 Paint 组件中创建的聚类\n\n![](img/image-5UJCE2BF.jpg)\n\
  \n图 7.3 带轮廓系数的 k-means 组件\n\n![](img/image-JCZX0G0X.png)\n\n图 7.4 轮廓图\n\n\n\n\n\
  将 `Datasets` 小部件连接到 `k-Means` 小部件，然后双击后者。如果你选择“从 2 到 8 个”聚类，它将帮助你根据最高的轮廓系数（在我们的场景中为\
  \ 0.564）决定最佳的聚类数量。该分表明 2 个簇比 3 个簇略好一些。将 `k-Means` 小部件连接到 `Silhouette Plot` 小部件以查看簇的形态（见图\
  \ 7.5）。选择 `distance = Euclidean`、`Grouping = Cluster`，勾选“Show in groups”选框，`Bar\
  \ width = 1` 和 `Annotations = none`。注意，浅色（蓝色）簇 1 的数量多于深色（红色）簇 2。\n\n![](img/image-M5WQB4M2.png)\
  \  \n\n图 7.5 轮廓图\n\n此外，如图 7.6 所示，连接 `Data Table`、`Distributions` 和 `Scatter Plot`\
