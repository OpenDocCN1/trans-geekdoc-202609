  \ 8.2 生存分析 (SURVIVAL ANALYSIS)\n\n生存分析也称为事件发生时间分析，是一种侧重于检查事件发生之前的时间段的统计技术。这种事件可以从死亡到机械故障等。这种技术甚至可以应用于事件尚未发生的情况（截尾）。⁶\n\
  \n![](img/image-202.jpg)\n图 8.3 用于 ARIMA 建模的 24 个月预测\n\n##### 8.2.1 执行 Kaplan-Meier\
  \ 生存分析的一步骤\n\n1. **定义研究目标：**\n   * **识别感兴趣的事件：** 明确定义研究关注的事件，例如疾病复发或组件故障。\n   *\
  \ **指定时间范围：** 为研究确定合适的时间范围。例如，癌症研究可能需要跟踪患者多年，而对机器故障的研究持续可能较短。\n   * **优化研究时长：**\
  \ 确保研究足够长，以获取足够的感兴趣的事件数据，但不要过长，以免导致发现过时。2. **数据收集：**\n   * **事件发生情况和时间数据：** 至少需要两列数据：一列指示研究期间感兴趣的事件是否发生\
  \ (1) 或未发生 (0)，另一列记录事件发生或研究结束的时间。\n   * **整合额外变量：** 收集关于受试者或单元额外的连续或分类数据，以更完整地理解影响事件的因素。\n\
  3. **处理截尾：**\n*   **识别并记录截尾：** 某些个体生存时间的信息不被称为截尾。Orange Kaplan-Meier Plot 小部件提供了显示截尾数据的选项。截尾可能由于各种原因发生，例如：\n\
  \     * 事件在研究期间未发生。\n     * 受试者丢失或数据缺失。\n     * 受试者退出研究。 ⁸\n4. **定义随访期：**\n\n\n\n\
  \n### a. 确定研究事件结束后是否仍继续收集数据，以及收集多久。\n\n## 5. 用于 Kaplan-Meier 分析的数据预处理\n\na. 将连续变量转换为离散类别：在使用\
  \ Kaplan-Meier 方法时，使用 `Orange Preprocess` 小部件中的 `equal frequency discretization`（等频离散化）选项将连续预测值转换为离散类别。这增强了结果中置信区间的可解释性。\n\
  \nb. 在 `Orange Preprocess` 小部件中使用 `equal width discretization`（等宽离散化）等替代方法会导致不同组大小的置信区间出现交叉，从而增加数据可视化统计解释的复杂性。\n\
  \nc. 如果连续预测值不进行分类，`Kaplan-Meier` 方法将把这些预测变量纳入分析中，导致分析不完整。\n\n## 6. 统计检验与分析\n\na.\
  \ 用额外测试补充 Kaplan-Meier：虽然 `Kaplan-Meier` 分析提供了 `Log-rank chi-squared p-value` 以及带有置信区间的图形表示，但其他统计检验可以提供额外的视角。\n\
  \nb. `Kaplan-Meier` 测试还可以通过 `Orange Box Plot Widget` 中的 `chi-square` 和 `t-test`\
  \ p 值进行补充，以增强分析。\n\n## 7. 解释与报告\n\na. 分析结果：解释 `Kaplan-Meier` 生存曲线，重点关注中位生存时间和组间差异。\n\
  \nb. 评估统计显著性：评估 `p-values` 以确定组间差异的统计显著性。\n\nc. 展示发现：在研究目标的背景下清晰地传达发现，包括 `Kaplan-Meier`\
  \ 曲线的可视化结果和相关统计数据。\n\n### 8.2.2. Kaplan-Meier 生存分析的 Orange 示例\n\n在本示例，我们使用了来自 1994\
  \ 年德国乳腺癌研究小组 2 的 686 名女性患者超过 7 年的生存数据，这些数据可在 `Orange Dataset` 小部件中获取。该研究包含 10 个特征（`Recurrence\
  \ Free Survival Time` 无复发生存时间、`Recurrence Event` 复发事件、`Menopausal Status` 绝经状态、`Age\
  \ of the Patient` 患者年龄、`Tumor Grade` 肿瘤分级、`Hormonal Therapy` 激素治疗、`Tumor Size` 肿瘤大小、`Number\
  \ of Positive Nodes` 阳性淋结数量、`Progesterone Receptor` 孕酮受体和 `Estrogen Receptor` 雌受体）。研究组中有\
  \ 43.6% 的人乳腺癌复发。此分析将观察激素治疗和其他因素对无复发生存时间的影响。感兴趣的事件是癌症复发。\n\n[图 8.7 显示用于执行上一节提到的所有相关\
  \ `Kaplan-Meier` 生存分析任务的 Orange 工作流。]\n\n[图 8.8 显示了原始格式的数据，包含连续变量和类别变量。连续变量可以用于工作流下部分\
  \ `Box Plot` 小部件中的 `t-tests`，但 `Kaplan-Meier Plot` 小部件只能处理类别变量。我们在并行工作流路径中使用 `Preprocess`\
  \ 小部件对所有连续变量进行 `equal frequency discretization`，以便所有变量均能使用 `Kaplan-Meier Plot` 小部件进行分析。图\
  \ 8.9 显示了所有变量离散化后的数据。]\n\n![](img/image-9Q8XML0S.jpg)\n\n图 8.7 Orange 中的 Kaplan-Meier\
  \ 生存分析工作流\n\n![](img/image-IZ9EERR0.jpg)\n\n图 8.8 乳腺癌数据集的原始格式\n\n![](img/image-8SC3SP38.jpg)\n\
  \n图 8.9 所有乳腺癌特征现已离散化\n\n`Data Table` 小部件放置在 Orange 工作流的各个区域，以便查看原始数据和转换后的数据，确保它们满足分析需求。在查看\
  \ `Kaplan-Meier Plot` 能提供的独特信息之前，让我们通过 `Distribution` 小部件并使用 `stacked columns` 和\
  \ `show probabilities` 选项，从数据集中 `Number of Positive Nodes` 特征的分布图中学习到什么。图 8.10 显示我们可以直观看到，当阳性淋结数量大于或等于\
  \ 3.5 时，癌症复发的概率显著更高。\n\n\n\n\n![](img/image-GA2ZK42A.jpg)\n\n![](img/image-RAULZKAY.jpg)\n\
  \n图 8.14 两个患者年龄组的 Kaplan-Meier 生存图\n\n## 8.3 学以致用\n\n## 8.3.1 练习\n\n在该练习中，我们将使用\
  \ Orange Dataset 小部件中一个名为 `Democracy-Dictatorship: Classification of political regimes\
  \ as democracy and dictatorship`（政治体制分类）的 2010 年文件。该数据包含了全球 200 个国家的 1808 位政府首脑，其国家领导人的起始日期范围在\
  \ 1946 年至 2008 年之间。我们感兴趣的是，标记为 `democracy` 或 `non-democracy`的国家，政府领导人的任期（年）哪个更长。我们将使用\
  \ Orange 中的两种不同方法来确定并可视化问题的答案：Kaplan-Meier 生存分析 (`KMSA`) 和 `box plot`（箱线图）。图 8.15\
  \ 显示了我们将用于回答该问题的工作流。\n\n当我们访问 Orange Dataset 小部件中的上述文件时，我们希望在 `Data Table` 小部件中查看该数据集的格式。回顾数据集中可用的信息，其中包含了自\
  \ 1946 年以来 200 个国家国家首脑的名称。对于本次练习，我们只对数据集中的两列数据感兴趣：`duration`（年）列和 `democracy` 列。`duration`\
  \ 列列出了国家领导人的任期年限，`democracy` 列根据联合国的划分注明了该国家是“民主”国家还是“非民主”国家。图 8.16 显示了所比较的两种政府类型的\
  \ Kaplan-Meier 生存分析，以及在 Orange 中进行此项分析所需的所有设置。此处选择的设置是选择 `democracy` 作为分组，并选择以下显示选项：`confidence\
  \ intervals`（置信区间）、`medians`（中位数）和 `censored data`（删失数据）。\n\n![](img/image-E3KMGDKF.jpg)\n\
  \n图 8.15 确定国家领导期限的工作流\n\n![](img/image-C9UVV1KI.jpg)\n\n图 8.16 政府类型的 Kaplan-Meier\
  \ 生存分析\n\n图 8.16 中的阴影区域代表 `confidence intervals`（置信区间）。不重叠的置信区间从统计学上证明了这两组政府是不同的，这通过图例中显示的\
  \ `log-rank p-value` `<0.005` 得到了证实。图例中的 `n/N` 表示表示某组内过去国家领导人的数量/该组国家领导人的总数。图例中的\
  \ `median` 数值代表国家领导人任期的中位数（年）。它也以垂直线的形式显示在两个表中。图中下方的曲线代表标记为 `democracy` 的国家领导人任期概率较低（中位数为\
  \ 3 年）。图上方的曲线代表标记为 `non-democracy` 的国家领导人任期概率较高（中位数 6 年）。这两条曲线的 `confidence intervals`\
  \ 不重叠，这进一步加强了观察到的 `democracy` 与 `non-democracy` 风格政府领导人任期差异的有效性。\n\n图 8.17 显示了对\
  \ `duration` 变量的 `box plot` 分析，该变量被选择用于 `Box plot` 小部件顶部的箱体，而 `democracy` 变量被选择用于\
  \ `Subgroups` 选择。另请注意使用了以下设置：\n\n![](img/image-8GZ14.jpg)\n\n图 8.16 政府类型的 Kaplan-Meier\
