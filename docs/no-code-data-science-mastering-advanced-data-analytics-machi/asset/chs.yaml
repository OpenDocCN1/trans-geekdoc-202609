  \ Bournetocode.com 提供）\n\n| 数据类型 | 描述 |\n| --- | --- |\n| 整数 (Integer) | 整数是不带小数的数值变量。整数是整数，可以是正数、负数或零。例如：`0,2,33,-199`\
  \ |\n| 实数 (Float) | 实数包括存在到无穷大的所有整数，加上它们所有的分数和小数。例如：`1.26, -7.8, 3.14` |\n| 字符 (Char/Character)\
  \ | 字符数据类型用于存储单个字母数字字符，可以是任何字母、数字或符号 |\n| 字符串 (String) | 字符串可以包含任何长度的字符列表。它可以代表字母数字数据和符号。字符串可以是空（null），也可以是一个或多个字符\
