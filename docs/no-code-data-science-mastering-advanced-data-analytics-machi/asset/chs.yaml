  \n![](img/image-5LEYZK4S.png)\n\n# 附录 A：数据可视化\n\n![](img/image-MV1PU6MC.jpg)\n![](img/image-6F2XGYFD.jpg)\n\
  ![](img/image-LNEZYFQR.png)\n\n## 附录 B：机器学习算法\n\n![](img/image-GRMMWMG5.jpg)\n![](img/image-WNYFAUDR.jpg)\n\
  ![](img/image-XUDHMWYI.jpg)\n![](img/image-DSRPXF1H.png)\n\n## 附录 C：术语表\n\n数据科学解码：通过类比补充定义，以解释书中复杂的数据科学术语。\n\
  \n-   **准确率 (ACC)**：衡量模型在所有预测中预测正确次数比例的指标。\n\n![](img/image-TEMD15Y1.jpg) 类比：这就像检查老师正确预测了多少学生的考试结果（及格或不及格）。\n\
  \n-   **AdaBoost**：一种提升算法，通过在反复修改的数据版本上拟合一系列弱学习器。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：这就像一个专家团队，每个后续专家都从前一个人的错误中学习，并尝试不再重复这些错误。\n\n-   **敏捷 vs 瀑布**：两种不同的项目管理方法。敏捷是迭代的，而瀑布是线性且有顺序的。\n\
  \n![](img/image-TEMD15Y1.jpg) 类比：公路自游——敏捷是在途中规划检查点，并能够灵活更改计划。瀑布则是规划出整个路线并坚持执行计划，无论途中出现什么新信息或变化。\n\
  \n-   **AI 聊天机器人**：一种模拟人类对话（口头或书面形式）的计算机程序。\n\n![](img/image-TEMD15Y1.jpg) 类比：想象在与一位虚拟管理员聊天。你可以提问并获得回答，但管理员并没有真正“理解”这段对话——它只是在引用它拥有的信息。\n\
  \n-   **AI 系统**：设计用于执行通常需要人类智能的计算机系统。\n\n![](img/image-TEMD15Y1.jpg) 类比：想象一辆非常先进的自动驾驶汽车。虽然大多数汽车都需要驾驶员操作，但这辆车可以自己驾驶、解释交通标志并根据周围的交通做出决策。\n\
  \n-   **ARIMA**：自回归整合移动平均。一种利用过去数据预测未来数据点的预测技术。\n\n![](img/image-TEMD15Y1.jpg) 类比：根据过去几周的数据和全年的季节变化来预测下周的温度。\n\
  \n-   **关联规则**：一种寻找数据集中不同项目之间关联的方法。\n\n![](img/image-TEMD15Y1.jpg) 类比：就像超市发现如果客户购买了尿尿布，他们很可能也会买婴儿奶粉。\n\
  \n-   **注意力模型**：能够关注输入数据特定部分的神经网络模型。\n\n![](img/image-TEMD15Y1.jpg) 类比：通过不同的透镜观察图像，每个透镜都强调不同的特征。\n\
  \n-   **词袋 (Bag of Words)**：文本的一种表示方式，不考虑顺序，只考虑词频。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：就像汤里加入了配料。\n\n-   **装袋法 (Bagging)**：通过使用数据的子集来减少过拟合的方法。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：这就像一个专家团队，每个专家对主题给出意见。\n\n-   **平衡准确率 (BA)**：对每个类别的召回率取平均值。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：这就像老师表扬学生的优点并指出改进之处。\n\n-   **偏差-方差权衡 (Bias Variance Tradeoff)**：模型拟合数据的能力与泛化到未知数据的能力之间的平衡。\n\
  \n![](img/image-TEMD15Y1.jpg) 类比：射箭。偏差是离靶心的平均距离，而方差是箭的散布程度。\n\n-   **博彩者认知 (Bookmaker\
  \ Informedness)**：性能衡量。\n\n![](img/image-TEMD15Y1.jpg) 类比：就像博彩者对赢和输预测。\n\n-   **箱线图\
  \ (Box Plot)**：数据集分布的图表表示，显示中位数、四分位数和离群值。\n\n![](img/image-TEMD15Y1.jpg) 类比：就像观察鸟的轮廓。你可以判断它的整体形状，但看不到细节。\n\
  \n-   **校准曲线 (Calibration Curve)**：显示预测概率与实际结果之间关系的可视化图。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：就像汽车的速度表。当校准良好时，显示的速度与实际速度一致。\n\n-   **级联风险管理 (Cascading Risk Management)**：一种处理系统中风险的策略，其中一个故障可能导致多次失败。\n\
  \n![](img/image-TEMD15Y1.jpg) 类比：想象多米诺骨牌。如果一个倒下，可能会引发连锁反应。这种方法关于策略性地放置多米诺以限制影响。\n\
  \n-   **类别权重 (Class Weights)**：分类问题中为类别分配不同的重要性。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：在讨论中重视专家的意见而非新手的。\n\n-   **聚类 (Clustering)**：根据某些特征将相似的数据点分组在一起的过程。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：根据主题或流派对书架上的书籍进行分类。\n\n-   **CNN (卷积神经网络)**：一种主要用于图像处理任务的深度学习算法。\n\n![](img/image-TEMD15Y1.jpg)\
  \ 类比：通过不同的透镜观察图像，每个透镜都强调不同的特征以识别图像。\n\n-   **柯恩 Kappa 系 (KP)**：一种衡量分类项目间评分者一致性的统计量，考虑了偶然达成一致的可能性。\n\
  \n![](img/image-TEMD15Y1.jpg) 类比：评估才艺秀中两位裁判的意见是否一致，即使他们可能会偶然一致。\n\n-   **交叉验证与训练/测试划分**：交叉验证涉及将数据划分为多个子集（折），并在不同的组合上进行训练/测试；而训练/测试划分将数据分为两部分：部分用于训练，部分用于测试。\n\
  \n![](img/image-TEMD15Y1.jpg) 类比：想象舞者在排练。她练习排练的不同部分（交叉验证），并从头到尾完整整个排练（训练/测试划分）。\n\
  \n-   **数据分箱 (Data Binning)**：将连续数据转换为离散区间或箱的过程。\n\n\n\n\n\n![](img/image-TEMD15Y1.jpg)类比：想象按高度对书架上的书籍排序。这就是数据分箱（Data\
  \ binning）的作用。\n\n* **数据清洗 (Data Cleaning)**：识别并纠正（或删除）数据中错误和不一致之处的过程。\n\n![](img/image-TEMD15Y1.jpg)类比：就像在旅行前洗车，以便从一个干净的状态开始。\n\
  \n* **数据插补 (Data Imputation)**：用于替换数据集中缺失值的方法。\n\n![](img/image-TEMD15Y1.jpg)类比：就像利用周围的碎片作为指南，填补拼图中缺失的部分。\n\
  \n* **数据泄露 (Data Leakage)**：当测试数据集集的信息被用于模型训练时。\n\n![](img/image-TEMD15Y1.jpg)类比：就像在考试前偷看答案——你可能会得高分，但这不能反映你的真实水平。\n\
  \n* **数据预处理 (Data Preprocessing)**：为分析和建模准备原始数据。\n\n![](img/image-TEMD15Y1.jpg)类比：就像厨师在烹饪前准备食材。\n\
  \n* **数据科学实验 (Data Science Experiments)**：在数据科学领域测试假设或尝试不同的方法，以提高预测模型的性能。\n\n![](img/image-TEMD15Y1.jpg)类比：就像厨师尝试不同的食材来创作出一道新菜。\n\
  \n* **数据绞合 (Data Wrangling)**：将原始数据转换为可用格式的过程。\n\n![](img/image-TEMD15Y1.jpg)类比：像牛仔夫驱赶牲牛，确保它们处于正确的位置。\n\
  \n* **决策树 (Decision Trees)**：一种通过提问一系列问题来做决策的模型。\n\n![](img/image-TEMD15Y1.jpg)类比：就像在玩“20\
  \ 个问题游戏”。每次提问都会缩小可能性。\n\n* **文档嵌入 (Document Embedding)**：以数值格式表示文本文档，并捕捉其语义含义。\n\
  \n![](img/image-TEMD15Y1.jpg)类比：把它想象成是将一本书转换成电影预告片——用一种不同的、紧凑的形式捕捉其精髓。\n\n* **虚拟变量陷阱\
  \ (Dummy Variable Trap)**：当分类变量高度相关时（即一个变量可以从其他变量预测出来）。\n\n![](img/image-TEMD15Y1.jpg)类比：就像有一个可以开启或关闭的开关。如果你知道它是开启的，你就知道它不是关闭的。\n\
  \n* **弹性网络回归 (Elastic Net Regression)**：一种结合了 L1 和 L2 正则化的回归类型。\n\n![](img/image-TEMD15Y1.jpg)类比：就像足球教练根据个人技能和团队动态选择球员。\n\
  \n* **集成模型 (Ensemble Models)**：使用多个模型并结合它们的预测结果。\n\n![](img/image-TEMD15Y1.jpg)类比：就像向几位朋友寻求电影建议，并考虑他们所有的意见。\n\
  \n* **F1 正性 & F1 负性 (F1 Pos & F1 Neg)**：分别结合正结果和负结果的精确率和召回率的指标。\n\n![](img/image-TEMD15Y1.jpg)类比：就像尝试有效地钓鱼——抓到很多（召回率），但也抓到了对的（精确率）。\n\
  \n* **假阴性 (False Negatives, FN)**：错误地预测某种状况不存在。\n\n![](img/image-TEMD15Y1.jpg)类比：预测不会下雨，但确实下了。\n\
  \n* **假阳性 (False Positives, FP)**：错误地预测某种状况存在。\n\n![](img/image-TEMD15Y1.jpg)类比：预测会有雨，但是晴天。\n\
  \n* **特征工程 (Feature Engineering)**：从现有特征创建新特征。\n\n![](img/image-TEMD15Y1.jpg)类比：烹饪。原始食材（数据）可以被组合和处理成一饭。\n\
  \n* **特征缩放 (Feature Scaling)**：调整多个变量的范围，以便它们可以在共同的基础上进行比较，例如从零到一。\n\n![](img/image-TEMD15Y1.jpg)类比：就像用一把通用尺子测量铅子的长度和建筑的高度，确保两者都落在\
  \ 0 到 100 的刻度上。\n\n* **Fowlkes-Mallows 指数 (Fowlkes-Mallows Index, FMI)**：一种综合考虑精确率和召回率来评估聚类质量的指标。\n\
  \n![](img/image-TEMD15Y1.jpg)类比：通过考虑个人投入和团队合作来评估一个小组项目。\n\n* **地理位置分析 (Geolocation\
  \ Analysis)**：分析具有地理或空间属性的数据。\n\n![](img/image-TEMD15Y1.jpg)类比：使用地图来跟踪和理解模式，比如鸟类的迁徙路线。\n\
  \n* **梯度提升 (Gradient Boosting)**：一种构建顺序树的集成方法，其中每棵树都试图修正上一棵树的错误。\n\n![](img/image-TEMD15Y1.jpg)类比：一个小组项目，在每次演示后，反馈都能帮助下一个学生表现得更好。\n\
  \n* **梯度下降 (Gradient Descent)**：一种用于最小化预测误差的优化算法。\n\n![](img/image-TEMD15Y1.jpg)类比：蒙着眼睛下山，总是向山下迈步。\n\
  \n* **高可靠性组织 (High Reliability Organizations, HRO)**：其系统设计旨在高风险环境中防止灾难的组织，在这种环境中事故是可以预见的。\n\
  \n![](img/image-TEMD15Y1.jpg)类比：一个排练过的管响团，每个乐手都熟悉自己的部分，使错误成为罕见事件。\n\n* **方针管理 (Hoshin\
  \ Kanri)**：也称为政策部署。一种管理中使用的战略规划工具，用于使公司的战略与其计划和行动一致。\n\n![](img/image-TEMD15Y1.jpg)类比：就像是业务的\
  \ GPS。\n\n* **假设检验 (Hypothesis Testing)**：测试理论。\n\n![](img/image-TEMD15Y1.jpg)类比：就像一场法庭审判，零假设是无罪，而备择假设暗示有罪。\n\
  \n* **不平衡数据 (Imbalanced Data)**：数据集中类别分布不均匀。\n\n![](img/image-TEMD15Y1.jpg)类比：就像一个有\
  \ 95 个苹果和 5 个橙子的篮子。如果你随机抓，几乎总是苹果。\n\n* **按需创新 vs 随机头脑风暴 (Innovation on Demand vs\
  \ Random Brainstorming)**前者是结构化的创新方法，后者是随机的。\n\n![](img/image-TEMD15Y1.jpg)类比：前者就像有健身计划，后者就像随心所欲。\n\
  \n* **内部验证 vs 外部验证 (Internal vs External Validation)**：在已知和完全全新的数据上测试模型的性能。\n\n\
  ![](img/image-TEMD15Y1.jpg)类比：就像歌手在家里排练歌曲（内部），然后在音乐会上进行表演（外部）。\n\n* **改善活动 (Kaizen\
  \ Events)**：旨在改进特定流程的专注活动。\n\n![](img/image-TEMD15Y1.jpg)类比：改进家里。\n\n* **卡普兰-梅耶生存分析\
  \ (Kaplan-Meier Survival Analysis)**：估计特定事件发生的时间，考虑到删失数据。\n\n![](img/image-TEMD15Y1.jpg)类比：就像跟踪植物的寿命，考虑到某些在研究结束时仍然活着。\n\
  \n* **K-近邻算法 (K-Nearest Neighbors)**：基于已知数据点接近性的分类算法。\n\n![](img/image-TEMD15Y1.jpg)类比：在一个新镇通过查看当地人去哪里来选择餐厅。\n\
  \n* **Lasso 回归 vs Ridge 回归 (Lasso vs Ridge Regression)**：正则化技术； Lasso 可能会将某些系数减零，而\
  \ Ridge 只是调整它们。\n\n![](img/image-TEMD15Y1.jpg)类比：Lasso 就像雕塑家剔除多余的大理石，而 Ridge 平滑雕塑的所有部分以达到和谐。\n\
  \n* **精益六西玛 (Lean Six Sigma, LSS)**：一种结合流程速度和质量的方法论。\n\n![](img/image-TEMD15Y1.jpg)类比：就像运动员训练以跑得更快，同时确保每一步都恰到好处。\n\
  \n* **精益 (Lean)**：一种简化流程和消除浪费的哲学。\n\n![](img/image-TEMD15Y1.jpg)类比：就像清理房间，只留下必需品。\n\
  \n* **提升性曲线 (Lift Curve)**：显示使用预测模型与随机猜测相比的优势的图表。\n\n![](img/image-TEMD15Y1.jpg)类比：根据鱼儿咬钩的地方选择钓鱼点，而不是随机选一个点。\n\
  \n* **线性回归 (Linear Regression)**：根据一个或多个预测变量预测连续响应变量。\n\n![](img/image-TEMD15Y1.jpg)类比：根据植物获得的水和光照量预测其生长情况。\n\
  \n\n\n\n\n### 局部最小值与全局最小值\n优化中的点；局部最小值是附近范围内的最低值，全局最小值是整体的最低值。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：在山脉中寻找山谷：有些山谷很深（全局最小值），而一些只是浅的凹陷（局部最小值）。\n\n### 逻辑回归：使用一个或多个预测变量来预测二分类结果。\n\n\
  ![](img/image-TEMD15Y1.jpg)\n类比：根据当前的交通流量预测信号灯是红是绿。\n\n### LogLoss（对数损失）：一种误差的衡量标准，其中错误的预测（尤其是高置信度的错误预测）会受到惩罚。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：就像做多选择题，如果你对自己的（错误）选择非常有信心，那么错题扣的分数就越多。\n\n###\
  \ MAPE（平均绝对百分比误差）：观测值与预测值之间的平均百分比误差。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像衡量一名箭手平均偏离靶心的百分比程度。\n\
  \n### 标记性（Markedness）：模型避免错误分类能力的指标。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像守卫在捕获真实威胁的同时避免误报的效率。\n\
  \n### MCC（马修斯相关系数）：衡量二分类质量的指标。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像通过考虑扑球次数和失掉的球数来评估守门员的技能。\n\
  \n### 模型偏差：当模型在特定方向上持续错过目标时。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像一个高尔夫球手的击球总是向左偏。\n\
  \n### 模型公平性：确保模型在不同群体中的表现同样良好。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像裁判确保每支球队在比赛中获得平等且公平的机会。\n\
  \n### 模型与算法：模型是将算法应用于数据后所得到的结果。\n\n![](img/image-TEMD15Y1.jpg)\n类比：使用特定的方法（算法）来构建拼图（模型）。\n\
  \n### 多重共线性：当模型中的两个或多个预测变量高度相关时。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像篮球队中有一对双胞胎；他们的技能重叠，使得很难确定每个人的独特贡献。\n\
  \n### 朴素贝叶：一种根据先验知识计算事件概率的分类算法。\n\n![](img/image-TEMD15Y1.jpg)\n类比：根据天气预报选择穿搭。你分别考虑是下雨、晴天还是下雪——都是独立地（朴素地）——以此决定你的着装。\n\
  \n### 负预测值（NPV）：负向预测正确的概率。\n\n![](img/image-TEMD15Y1.jpg)\n类比：在预测会有雨并带上伞后，实际上真的下雨的概率。\n\
  \n### 神经网络：模拟人类大脑行为处理数据的复杂系统。\n\n![](img/image-TEMD15Y1.jpg)\n类比：想象一个工厂的流水线。每个工人（神经元）处理一项任务（输入）并将其传递，最终产品（输出）由此产生。\n\
  \n### NLP（自然语言处理）：帮助计算机理解人类语言。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像教机器人阅读并总结一本书。\n\
  \n### 正则化：通过向损失函数添加惩罚项来防止过拟合的技术。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像老师引导学生不要过度关注某一个主题，确保学习方法的平衡。\n\
  \n### 异常值处理：处理与整体显著不同的数据点。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像识别与众不同的个体。\n\n###\
  \ PCA（主成分分析）：在保留方差的同时降低数据的维度。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像将电影总结为其精华。\n\n\
  ### 多项式回归：使用多项式方程捕捉关系。\n\n![](img/image-TEMD15Y1.jpg)\n类比：预测球的高度，其轨迹不是直的。\n\n###\
  \ 残差图：观测值与预测值之间差异的视觉化表示。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像通过分析脚迹判断一个人是否偏离了路线。\n\
  \n### RNN（递归神经网络）：带有循环以在内存中保留信息的神经网络。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像一排多米骨，每一块都会影响下一块，但某些骨会对之前的骨产生反弹影响。\n\
  \n### ROC 与 PRC 曲线：评估模型在从真阳性和假阳性中区分出真阳性的分类能力的指标。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：ROC 就像评估守门员在不犯规的情况下挡球的能力，而 PRC 评估他们在所有尝试中成功挡住了多少球。\n\n### RMSE, MSE（均方根误差，均方误差）：衡量预测值与观测值之间差异的指标。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：就像检查木工切割的平均误差。`RMSE` 就像是用木工熟悉的单位来评估误差。\n\n###\
  \ R 平方（R-squared）：代表因变量中有很大比例的变化被自变量解释。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像评估蛋糕的味道在多大程度上受原料而非烘焙技巧的影响。\n\
  \n### 敏感性（召回率）：在所有实际正性样本中，有多少比例被正确预测了？\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像安全系统检测所有实际入侵的能力。如果发生了入侵，警报响起的概率有多大？\n\
  \n### 情感分析：解释和分类文本数据中的情感。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像通过读信来理解朋友的心情，情感分析是从文字中辨别出情感。\n\
  \n\n\n\n\n# 核心概念\n\n### 简单回归与多元回归\n简单回归涉及使用一个自变量来预测结果，而多元回归则使用多个变量。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：如果是预测房价，简单回归可能只考虑房屋的面积，而多元回归还会包括房龄、位置等因素。\n\n### 六西格玛 (Six Sigma)\n一种数据驱动的方法，专注于减少波动、消除缺陷和提高流程质量。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：就像高尔夫球员为了完美击球不断精炼他们的杆动作，六西格玛追求流程的完美。\n\n### 特异性\
  \ (Specificity)\n被正确识别的实际负例的比例。\n\n![](img/image-TEMD15Y1.jpg)\n类比：想象预测哪些学生会考试不及格。特异性衡量了我们对那些没有学习的学生预测失败的准确程度。\n\
  \n### 监督学习 (Supervised Learning)\n一种使用带标签数据训练算法的学习方法。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：这类似于学生在老师的指导下学习，正确答案（标签）引导着学习。\n\n### 目标变量与预测变量 (Target vs Predictor Variables)\n\
  目标是你想要预测的内容，而预测变量则影响结果的结果。\n\n![](img/image-TEMD15Y1.jpg)\n类比：在飞镖比赛中，飞镖指向的是目标，而这些努力受到球员姿势、投掷力度等因素（预测变量）的影响。\n\
  \n### 阈值移动 (Threshold Shifting)\n在分类问题中调整决策边界或“敏感性”，以改变系统的灵敏度。它是关于改变某物被视为“开启”或“关闭”、“正”或“负”的点。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：想象一个根据黑暗程度开启光线的传感器。调整其灵敏度决定了灯在何时开启，是在昏暗中还是完全黑暗中。\n\
  \n### Transformer 模型 (Transformer Models)\n一种根据相关性对不同输入数据进行优先级排序并提供权重的先进模型。\n\n\
  ![](img/image-TEMD15Y1.jpg)\n类比：想象你处于一个嘈杂的派对中，试图专注于某一段对话。Transformer 模型帮助你“调频”最相关的信息。\n\
  \n### 真负性 (True Negatives, TN)\n正确识别负面结果的预测。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像天气预报预测没有雨，结果当天保持晴朗。\n\
  \n### 真正性 (True Positives, TP)\n正确识别正性结果的预测。\n\n![](img/image-TEMD15Y1.jpg)\n类比：预测会有雨天，然后眼目睹了阵雨。\n\
  \n### 第一类错误 (Type-I error, FPR)\n假阳性率和误报，将负性事件错误地预测为正性。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：想象指控一个无辜的人犯错。\n\n### 第二类错误 (Type-II error, FNR)\n假阴性率。通过将实际正性事件预测为负性而漏掉该事件。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：这类似于让一个罪犯在不引起怀疑的情况下逃脱。\n\n### 第三类错误 (Type-III\
  \ error)\n误读正确的结果。\n\n![](img/image-TEMD15Y1.jpg)\n类比：就像读了某题的答案，却错误地将其应用于另一题。\n\n\
  ### 统一性能指标 (Unified Performance Measure, UPM)\n一种整合各种性能指标的聚合指标。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：想想十项全赛，将各项项目的得分结合起来评估最终获胜者。\n\n### 无监督学习 (Unsupervised Learning)\n一种算法从未标记数据中推断模式的学习方法。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：这就像一个没有地图在新城市游荡的游客。他们探索不同的社区，注意到相似和不同之处，并自然地根据氛围或活动对区域进行聚类，而完全没有预定义的路线或类别。\n\
  \n### 将 AI 聊天机器人作为脑风暴成员\n在脑风暴会议中引入人工智能，以生成或完善想法。\n\n![](img/image-TEMD15Y1.jpg)\n\
  类比：考虑一个脑风暴团队，其中一个成员（机器人）提出了新颖且意外的创意，增强了小组的构思过程。\n\n### 小提琴图 (Violin Plot)\n一种结合了箱线图和核密度图的图表，用于说明数据分布及其概率密度。\n\
  \n![](img/image-TEMD15Y1.jpg)\n类比：如果你想象数据是一只鸟，小提琴图不仅显示鸟的轮廓，还会显示它哪里丰满哪里瘦。\n\n###\
  \ 愿景部署 / 方针计划 (Vision Deployment / Hoshin Planning)\n一种战略性过程，将组织的愿景转化为可操作的步骤。\n\n\
  ![](img/image-TEMD15Y1.jpg)\n类比：规划公路旅行。决定你的目的地（愿景），然后规划到达那里的路线和停靠点。\n\n### 可视化编程与编码的对比\n\
  可视化编程使用图形元素，而编码则需要手动编写。\n\n![](img/image-TEMD15Y1.jpg)\n类比：这是使用预制砖块构建（可视化编程）与艰难地从粘土中塑造（编码）的区别。\n\
  \n### 瀑布式项目管理\n一种线性项目管理方法，每个阶段都取决于前一个阶段的交付物。\n\n![](img/image-TEMD15Y1.jpg)\n类比：将其视为按层建造建筑。在二层稳定并完成之前，你不会开始第三层。\n\
  \n### 词云 (Word Cloud)\n一种展示数据集中单词频率的视觉化表示。\n\n![](img/image-TEMD15Y1.jpg)\n类比：想象人群的嘈杂。声音最大或重复次数最多的词会脱颖而出。\n\
