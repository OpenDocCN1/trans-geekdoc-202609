  \ charts）。经典的帕累托图有一条累计百分比线和右侧的垂直轴，该轴与累积百分比线对应，以便检查 80/20 帕累托规则。准帕累托图没有累积百分比线，仅按频率排序条形，没有直接的方法测试\
