  \n# 8. 探索时间序列预测\n\n时间序列预测对于许多专业人士来说是一项严肃的工作，特别是在金融、Uber（UBER）、零售等领域。预测协会（Institute\
  \ of Forecasting）、M 预测中心（MOFC）以及 Kaggle 提供了更多预测信息、培训和数据集。\n\n时间序列预测对于许多专业人士来说是一项严肃的工作，特别是在金融、Uber（UBER）、零售等领域。预测协会（Institute\
  \ of Forecasting）、M 预测中心（MOFC）以及 Kaggle 提供了更多预测信息、培训和数据集。\n\n### 8.1 使用 `ARIMA`\
  \ 进行时间序列预测\n\n`ARIMA` 代表自回归积分移动平均，是一种用于预测的统计模型。如果一个模型尝试根据过去的数据预测未来值，则被认为是自回归的。`ARIMA`\
  \ 还使用了一种称为序列相关的统计概念。`ARIMA` 假设未来趋势与过去相似，但这可能由于突发经济事件、流行病或其他危机而不准确。它在预测一致的季节性和周期性趋势方面特别有用。本节将不会涵盖\
  \ `ARIMA` 的数学原理，而是将介绍在 Orange 中可以调整的 `ARIMA` 参数。\n\n### 8.2 学习目标\n\n阅读本章后，读者应该能够：\n\
  - 理解 `ARIMA` 的基础优缺点。\n- 理解影响预测的 `ARIMA` 参数。\n- 在 Orange 中优化 `ARIMA` 性能。\n- 正确解释\
  \ `ARIMA` 结果。\n\n### 8.3 核心原理\n\n- `ARIMA` 是一种季节性技术，需要过去的数据来创建预测。\n- `ARIMA` 在预测波动和季节性方面存在困难。\n\
  - `ARIMA` 使用尝试法来寻找最佳设置。\n- `ARIMA` 涉及 `p`、`d` 和 `q` 参数。\n- `ARIMA` 是一种专注于时间段的技术。\n\
  - `ARIMA` 在可靠性工程和许多其他领域非常有帮助。\n\n#### 8.3.1 Orange 中的 `ARIMA` 时间序列预测\n\n当我们在 Orange\
  \ 中探索 `ARIMA` 时间序列预测选项时，我们将借助根据美国运输部国际报告乘客数据集调整的美国真实流量每月数据进行操作。该文件在我们文件共享网站的第 8\
  \ 文件夹中。该数据集包含了在国际点与美国机场之间所有直飞商业客流量。报告的人数以千为单位。这些数据记录了 2010 年 2 月到 2019 年 1 月的每月流量总数。图\
  \ 8.1 显示了该数据中的季节性趋势，每年 7 月达到高值，每年 2 月达到低值。该图表是使用折线图（Line Plot）组件创建的。正如我们在此折线图中看到的，数据中存在重复的年度周期，因此该数据集应该是\
  \ `ARIMA` 分析的良好候选对象。\n\n\n\n\n当我们探索此 Orange 工作流时，应该注意，这种 ARIMA 建模的数据格式要求一列数据包含日期，另一列包含感兴趣的数值值，在本例中，该数值是美国每月飞行的航空乘客人数。以下是使用\
  \ Orange 默认设置创建 24 个月未来航空旅行人数预测的编号步骤，稍后我们将会对其进行改进：\n\n![](img/image-GZBOVXYM.jpg)\n\
  图 8.1 九年美国每月航空运客量（2010 年至 2019 年）\n\n![](img/image-RCYCEFA1.jpg)\n图 8.2 用于 ARIMA\
  \ 建模的 Orange 工作流\n\n1. 使用 `File` 小部件导入您的数据。\n\n2. 点击 `File` 小部件，确保乘客特征被设置为目标（target），并确保\
  \ `Date` 特征被设置为元数据（meta）。\n\n3. 使用 `Data Table` 小部件检查数据是否符合您的预期。\n\n4. 点击 `Form\
  \ Timeseries` 小部件，这可以确保数据处于 ARIMA 分析组件可以理解的格式。选择“选择带有日期的列”选项，并确保在该小部件中选择了 `Date`\
  \ 特征。\n\n5. 同时打开工作流右侧显示的 `ARIMA Model`、`Model Evaluation`、`Line Chart` 和 `Data Table`\
  \ 小部件，这样您就可以实时看到任何预测建模参数的变化如何影响 `Model Evaluation` 小部件上注的模型性能指标，以及 `Line chart`\
  \ 小部件上视觉显示的 24 个月预测。\n\n6. 首次打开所有小部件时，默认的 ARIMA 参数显示为 `(1,1,1)`，它们代表著名的 `p`、`d`、`q`\
  \ 参数（自回归阶阶、差分阶和移动平均阶），这仅代表任何尝试性建模任务的开始。`Model Evaluation` 小部件中折数（folds）和预测步（Forecast\
  \ steps）的默认值为 `1,1`。初始的模型性能指标和 24 个月预测的折线图最初看起来非常糟糕且毫无用，如图 8.3 所示。\n\n7. 图 8.3 显示了七个关键\
