  \n\n\n\n\n# SMOTE 技术\n\nSMOTE 创建于 2002 年，是广为人知的过采样技术。截至目前，该技术已有超过 80 种扩展或改进。⁴⁷ SMOTE\
  \ 主要用于分类问题；经过适当的修改，它也可以用于回归问题。SMOTE 以 `Python` 或 `R` 包的形式提供，使用 `k-nearest neighbor`（k\
  \ 近邻）算法来定位相似数据，并将其添加到少数类数据集中。它向所有最近的邻居连线，并在这些连线上创建新的随机合成数据点（5），如图 4.29 所示。\n\nSMOTE\
  \ 以及其他过采样技术的问题在于，当在留测试数据上评估模型时，存在过拟合的。SMOTE 在高维数据集上的表现不佳，并且对于不同的算法可能会产生不同的分类性能。在使用\
  \ SMOTE 之前，必须通过将数据转换为数值并进行归一化对数据进行处理。这非常重要，因为 `k-nearest neighbor` 算法依赖于所有特征数据点之间准确、一致且归一化的距离。⁴⁸\n\
  \n![](img/image-IGI5SFHY.png)\n\n图 4.29 红色所示的 SMOTE 过采样示例 ⁴⁹\n\n图 4.30 显示了 SMOTE\
  \ 如何增加许多在原始数据集中比例极低的中风患者（深色点）。深色阴影区域代表中风患者，而浅色点和浅色阴影区域代表非中风患者。在图表的右上区域，应该特别清楚的是，SMOTE\
  \ 通过在现有中风患者之间的直线上添加许多数据点，为少数类添加了更多数据点。在这张图中，Y 轴是平均血糖水平，X 轴是年龄。我们在 `Orange` 中通过在\
  \ `Orange Python Script widget` 的帮助下创建一个唯一的 `SMOTE widget`，从而创建了这一 SMOTE 分析功能。\n\
  \n![](img/image-RSVJ425N.jpg)\n\n图 4.30 SMOTE 如何为深色的少数类中风患者添加更多数据点的示例\n\n## 类别平衡选项\n\
  \n此处列出了 SMOTE 之外的其他一些类别平衡选项，但它们尚未在 `Orange` 中提供或经过验证：\n\n1. **基于 SVM 的边界过采样**：训练支持向量机\
  \ (`SVM`) 算法并利用决策边界区域生成合成样本。⁵⁰\n2. **自适应合成采样 (ADASYN)**：生成的合成样本与少数类示例的密度成反比。⁵¹\n\
  3. **纠正不平衡的合成数据**：⁵² 我们利用人工智能 AI 程序 `Mostly.ai` 生成了合成少数类数据，发现训练数据集上的结果要好得多，精确率和召回率的结果合理。⁵³\
  \ 然而，像 `SMOTE` 一样，在对需要平衡的测试数据进行评估时，发现了严重的过拟合。\n4. **随机采样和带回的自助采样**：意味着从数据集中选择随机样本并重新引入同一个数据集中。该技术通过向少数类添加新数据来纠正不平衡。`Orange`\
  \ 未提供经过验证的过采样方法。\n\n### 4.7.2.7 多数类的下采样\n\n有多种技术对多数类进行下采样。然而，担心的是，每当你减少多数类中的数据时，你就减少了可能有价值的模型信息。由于我们将数据视为“黄金”，除非你在处理大数据，否则下采样不应出现在你列表的首位。大多数专家建议不要使用这种方法，除非结合对少数类的过采样（如下一节所述）。但是，如果你只对多数类进行下采样，而不对通常稀缺的有价值少数类数据进行下采样，则应该重新考虑此选项。下采样最简单的方法是从训练数据集的多数类中随机删除数据样本。其他技术，如\
  \ `Tomek Links` 和 `Near Miss Undersampling`，由 Jason Brownlee 讨论。⁵¹\n\n### 4.7.2.8\
  \ 过采样与下采样的结合\n\n如所述，有技术可以对少数类进行过采样（例如 `少数类过采样技术 - SMOTE`）、对多数类进行下采样或两者兼顾，但所有这些方法都存在问题且大多数需要编程。混合技术（下采样和过采样）确实具有提高模型性能的潜力。⁵⁴\n\
  \n少数类的随机过采样加上多数类的随机下采样是一种很有前景的方法。然而，你应该始终针对特定的数据集进行实验，看看是否有任何模型性能上的收益。\n\n另一种常见的混合模型是\
  \ `SMOTE` 与多数类的随机下采样，这是另一种常见的混合模型。`SMOTE` 结合 `TOMEK`（一个 Python 包）是一种涉及下采样和过采样的混合技术。首先，执行\
  \ `SMOTE` 过采样，但类别分布可能会重叠，这可能导致过拟合。`Tomek links` 将应用于原始和合成实例以解决这个问题。它移除了两个相互重叠空间的类别观测值，这些空间难以分配给特定类别。因此，`Tomek\
  \ links` 移除了噪声和无法分配的数据点，使得剩余数据集更容易分类。`Tomek links` 的识别过程通常作为预处理步骤应用。它不仅从多数类中移除观测值，还从两个类中移除模糊观测值。这种组合可能会以精确率为代价获得更高的召回率。⁵¹\n\
  \n### 4.7.2.9 移动（偏移）ROC 阈值\n\n默认 ROC 阈值始终设置为 0.50。对于小于 0.5 的预测，分配类别 = 0。对于等于或大于\
  \ 0.5 的预测，分配类别 = 1。然而，当存在类别不平衡时，0.5 的默认 ROC 阈值可能并不理想。至少有三种方法可以评估最佳 ROC 阈值⁵\n\n-\
  \ **几何平均 (G-mean)**：计算敏感性 × 特异性的平方根。对于给定阈值，结果越大越好。\n- **Youden J 指**：TPR - FPR。结果越大越好。\n\
  - **F1 分数**：在不同阈值下计算 F1 分数。使用 F1 分数最大的阈值，它是精确率和召回率的调和平均数。\n\n以下是通过 `Calibration\
  \ widget` 的敏感性和特异性图对中风预测 ROC 曲线计算几何平均和 Youden J 指的表格。\n\n表 4.5 基于阈值的几何平均和 Youden\
  \ J 指结果\n\n![](img/image-H8Y4MJEH.jpg)\n\n这些测试结果表明，最佳阈值为 0.05 而默认的 0.5！你还可以计算每个阈值的\
  \ F1 分数，以获得精确率和召回率之间的平衡。\n\n`Orange` 可以查看更改阈值发生的情况，并保存新阈值将其应用于新模型。以下是在 `Orange`\
  \ 中寻找最佳阈值的步骤：\n\n1. 在示例中，我们首先通过 `File widget` 设置从第 5 章文件共享文件夹上传的中风数据集，并将其连接到 `Data\
  \ Sampler widget`。\n2. 将此组件连接到 `Test and Score widget`，两个连接器设置为“数据样本到数据”和“剩余数据到测试数据”。\n\
  3. 将 `Test and Score widget` 连接到 `Calibration plot widget` 并打开它。确保 `Test and Score\
  \ widget` 设置为“在测试数据上测试”。\n4. 将指标下拉菜单更改为 `Sensitivity and Specificity`。注意：默认情况下，阈值设置为\
  \ 0.5，此时敏感性仅为 0.004，而特异性为完美的 1.0。\n\n\n\n\n\n5. 在橙色区域将阈值向左移动，直到灵敏度和特异度交叉处，如上表所示，将阈值设置为\
  \ `0.05`。此时灵敏度为 `0.807`，特异度为 `0.735`。我们可以认为这似乎更好，但最终决定取决于分类模型的目标。例如，你愿意接受多少假阳性？\n\
  \n6. 在`Calibration Plot（校准图）`部件中，你可以在`Metrics`下选择`Precision（精确率）和`Recall（召回率）曲线并调整阈值。使用`0.05`的阈值，你会发现精确率在`0.135`处非常低，而召回率在`0.807`处良好。这意味着大多数样本（中风）都是假阳性。移动这个阈值如何？如果将阈值向左移动到\
  \ `0.2`，精确率增加到 `0.218`，导致召回率仅为 `0.213`。数据科学团队必须决定什么方案最合理。\n\n7. 如果你已经决定在面对不平衡数据时，阈值移动带来了更好的模型，如何创建并保存具有新阈值的模型呢？只需将`Calibration\
  \ plot`连接到`Save Model（保存模型）`部件。打开该部件，用一个易记忆的名字保存，并注意它将以“pickle 文件”的形式保存。\n\n8. 如果你现在想在新的测试数据上使用此模型，将测试数据上传到`File`部件并连接到`Predictions（预测）`部件。\n\
  \n![](img/image-5UAY3G7E.png)\n\n图 4.31 阈值移动后的模型性能\n\n![](img/image-U5T6BBAE.png)\n\
  \n图 4.32 用于移动 ROC 阈值、保存新模型并在新测试数据上进行测试的 Orange 工作流。\n\n9. 选择`Load model（加载模型）`部件，搜索校准后的中风\
  \ pickle 文件并加载它。\n\n10. 将`Load Model`部件连接到`Predictions`部件。\n\n11. 打开`Predictions`部件并选择“show\
  \ probabilities for “1,””，并在底部选择`target class = 1`。现在你应该应该看到阈值设置为`0.05` 时的模型性能。\n\
  \n图 4.31 显示了上述活动的模型性能指标，图 4.32 显示了用于更改阈值并在模型上测试性能的 Orange 工作流。\n\n通常情况下，我们建议从加权逻辑回归和随机森林开始，然后决定是否需要为了改进模型而移动阈值。这将取决于数据集和所选的算法。\n\
  \n### 4.7.2.10 类别不平衡下基于概率的模型面临的挑战\n\n使用概率的模型（如逻辑回归）通常缺乏校准，这意味着它们可能无法准确地预测少数类（1）或多数类（0）。在此语境下，概率可以被视为模型的不确定性，因为它们显示了用于将数据点分配给特定类别的精确概率值。例如，模型预测某个数据点为\
  \ `0.8`，因此将其分配给最近的类别，即类别 1。校准后的概率意味着概率与根据选阈值的事件真实发生率匹配，该阈值是类别之间的截点和决策边界。类别不平衡会加剧校准问题，因为模型过度关注多数类，因为它将多数类中大量的频率视为其应该关注的重要模式。\n\
  \n表 4.6 使用和不使用`Calibrated Learner` 部件的模型性能对比\n\n![](img/image-2BL87RG6.png)\n\n\
  重新缩放概率有两种两种主要技术：\n\n1. `Sigmoid (Platt) Scaling` 使用逻辑回归模型转换得分以改进校准。\n2. `Isotonic\
  \ Regression（等保序回归）`更复杂，涉及加权最小二法回归 ⁵⁶\n\nOrange 也有一个`Calibrated Learner`部件。Orange\
  \ 在该部件的帮助文件中对其描述如下：“此学习器产生一个模型，该模型可以校准类别概率分布并优化决策阈值。该部件仅适用于二分类任务。”除非按照下一段所述进行设置，否则这些技术在\
  \ Orange 中无法起作用。\n\n在接下来的示例中，使用糖尿病数据集（糖尿病患病率为 `15.3%`，无糖尿病比例为 `84.7%`），应用了逻辑回归（L1\
  \ 正则化和平衡类别分布）和`Calibrated Learner`部件（检查：`Sigmoid scaling` 和 `Optimize F1 score`）。结果显示，应用`Calibrated\
  \ Learner`部件后，F1 分数略有提高（从 `0.681` 提高到 `0.700`）。图 4.33 显示了 Calibrated Learner 的 Orange\
  \ 工作流，表 4.6 显示了逻辑回归以及逻辑回归+`Sigmoid + F1`的模型性能。\n\n![](img/image-JRQ8KGHS.png)\n\n\
  图 4.33 Calibrated Learner 的 Orange 工作流\n\n### 4.7.2.11 特征不平衡\n\n虽然类别不平衡一直是数据预测的一个已知挑战，但一个新的子课题是特征不平衡问题。例如，假设某研究中女性或其他任何群体的比例很低。模型主要对男性实例进行学习，由于缺乏可用数据而对女性产生偏差。\n\
  \n如果添加合成女性以使女性人数 = 男性人数，模型性能会如何？你必须进行实验来确定这对模型性能的影响。或者，你可以使用随机过采样法来增强任何代表不足的特征。例如，这些作者使用了心脏病预测数据集并用合成数据增强女性，从而提高了模型性能。⁵⁷\
  \ 该领域尚处于早期，请务必测试重采样技术是否引入了新的偏差。正如本章大部分内容所示，结果取决于数据集、预处理、所选算法以及所应用的超参数调优技术。\n\n###\
  \ 4.7.2.12 不平衡分类的稳健框架\n\n\n\n\n\n决定你是想要预测精确（清晰）的标签（1 和 0）还是实际概率。精确率-召回率曲线下面（`AUPRC`）作为类别不平衡的评估方法是理想的。要预测类别标签，可以计算几何平均值。如果少数类更重要，使用\
  \ `F1`、`F.5` 或 `F2` 分数。如果你正在预测二分类概率，请考虑 `Brier Score`。`Brier Score` 报告了正类预期概率与预测概率之间的均方误差。例如，如果少数类（1）的预测值为\
  \ 0.80，则 `Brier Score` 为 `(0.8-1)² = 0.04`。理想的 `Brier score` = 0，而最低分 = 1.⁹⁹ 这在\
  \ Orange 中不进行计算。\n\n![](img/image-OFULF5I0.png)\n\n图 4.34 用于不平衡分类指标选择的决策树（修改自 Brownlee）⁵¹\n\
  \n下图（图 4.34）有助于为不平衡分类数据集选择选择合适的指标和绘图方法。当你为二分类创建机器学习模型时，你可以预测类别标签（例如 0, 1）或预测类别概率（例如，预测概率\
  \ 0.95 将被分配给 1.0 的类别赋值）。\n\n### 4.7.2.14 抽检算法 (Spot Check Algorithms)\n\n抽检算法是在给定问题上快速且客观地评估一组机器学习算法以确定其性能的过程。首先，根据上述指标评估多个类别的算法，使用\
  \ `k-fold cross-validation` 建立基性能。使用如 `Orange Constant` 小部件之类的基准算法。使用几种线性算法，如 `logistic\
  \ regression`（逻辑回归）和 `Naive Bayes`（朴素贝叶）。使用几种非线性算法，如 `decision trees`（决策树）、k-NN、神经网络和\
  \ SVM。使用几种集成算法，如 `random forest`（随机森林）和 `xgboost`。第二，评估数据采样算法，如 `SMOTE`。第三，评估权重。第四，在适当的情况下使用\
  \ `Sigmoid scaling` 或 `isotonic regression`（保序回归）对概率校准。第五，调整分类阈值。\n\n### 4.7.3 超参数优化\n\
  \nOrange 为其 11 算法提供了多种超参数调优选项，如表 4.6 所示。如表所示，Orange 中唯一没有可调超参数选项的算法是 `Naive Bayes`。由于最优设置对于不同的数据集可能不同，无法提前知道哪些调优参数比默认设置提高性能。\n\
  \n执行超参数优化（`HPO`）的最常用方法是 `grid search`（网格搜索）和 `random search`（随机搜索），它们不是 Orange 的部分。⁶⁰\
  \ 然而，你可以为想要测试的每个唯一超参数使用不同的小部件设置 Orange 工作流。通过这种方法，你将能够在 `Test and Score` 小部件中查看每个\
  \ `HPO` 设置与所有其他设置（包括默认参数设置）的比较。`HPO` 工作流中的每个小部件都应该重命名，以便在 `Test and Score` 模型性能表格中更容易识别。请记住，这将增加你建模的计算时间，因此只对那些在特定数据集上排名靠高的算法进行此类测试也许是明智的。\n\
  \nBlueSky Statistics 在其模型拟合部分和模型调优部分为各种算法提供了有限的自动 `HPO` 版本，将 `HPO` 工作与模型调优 `HPO`\
  \ 工作隔离开。\n\n### 4.7.4 避免模型过拟合\n\n记住，在同一数据集上反复进行建模和 `HPO` 工作会导致过拟合，并降低模型在未见数据上的泛化能力。在数据集的不同划分上测试\
  \ `HPO` 工作和模型实验可以解决这个问题，但如果你的数据集较小，这可能不是一个很好的选择。\n\n以下方法被认为有助于减少所有建模工作的过拟合：\n\n\
  - `Cross-validation`（交叉验证）：该方法将数据分成多个数量的训练和测试子集，然后轮换数据集，直到所有数据在过程某个时刻都有机会成为训练和测试子集。\n\
  - `Regularization`（正则化）：该方法可以对模型系数添加不同程度的惩罚以避免过拟合。\n- `Feature selection for the\
  \ modeling`（建模特征选择）：仅选择排名最高的变量进行建模，允许算法专注于识别相关模式，同时避免对模型中无关噪声建模的影响。\n- `Early stopping`（早停）：该方法限制了在训练过程中花费的时间，以防止模型过拟合。\n\
  - `Train on more data`（在更多数据上训练）：在更大的数据集或数据集中更大比例的数据上训练可以提高模型性能并减少过拟合。⁶¹- ⁶²\n\n\
  ## 4.8 将知识付实践\n\n### 4.8.1 练习\n\n在本章中，我们花费了大量时间讨论不平衡数据集的重要性，因此此练习将重点关注不平衡数据的处理。我们将使用\
  \ `Framingham` 数据集，该数据集包含 15% 的受试者在进入研究十年后患了冠心病（`CHD`）。⁶³ 此文件可以从我们的 File-Share 网站下载。⁶⁴\n\
  \n表 4.6 Orange 超参数调优选项\n\n![](img/image-J2PM9SVN.jpg)\n\n1. 将文件上传到 `File` 小部件并打开。有多少分类数值列？是否存在缺失数据？目标设置为\
  \ `TenYear CHD` 吗？\n2. 将 `Feature Statistics` 和 `Box Plot` 小部件连接到 `File` 小部件。\n\
  \    a. `Feature Statistics` 小部件 - 按目标颜色编码。有什么发现？\n    b. `Box Plot` 小部件 - 将上限和下限设置为\
  \ `TenYear CHD`。在 10 年内患心脏病的人有多少？在患心脏病的人之间比较，哪些变量不同？\n3. 如果你将分类数据转换为数值并填补缺失值，模型可能会运行得更好。\n\
  \    a. 连接 `Preprocess` 小部件。\n    b. 选择 `Continuize Discrete Variables` 并向右滑动。选择\
  \ `Most frequent`。\n    c. 选择 `Impute Missing Values` 并向右滑动。选择 `Average/Most frequent`。\n\
  4. 将 `Preprocess` 小部件连接到 `Test and Score` 小部件。将后者连接到 `Random Forest`、`Logistic Regression`。\n\
  5. 打开 `Test and Score` 小部件\n    a. 设置目标为 1。将 `Cross validation` 设置为 10，但尝试 `CV=5`\
  \ 看看是否有差异。\n    b. 查看三种算法的性能指标。为什么特异性和准确率很高，但 F1、精确率和召回率很低？\n6. 将 `Performance Curve`\
  \ 和 `Calibration` 小部件连接到 `Test and Score` 小部件。在 `Precision Recall` 曲线上选择目标 = 1。在我们尝试改进不平衡时，为什么可能只看\
  \ F1 和 AUPRC 分数？`MCC` 是另一个选项，但我们将关注 F1 和 `AUPRC`。\n7. 我们首先尝试加权：\n    a. 在加权之前，获取三种算法的\
  \ `F1` 和 `AUPRC` 平均值并记录。\n    b. 打开 `Random Forest` 和 `Logistic Regression` 小部件并选择\
  \ `Balance class distribution`。重新计算 `F1` 和 `AUPRC` 分数平均值。加权后改进改进？\n    c. 取消勾选权重框。\n\
  8. 我们现在尝试“移动阈值”来观察它如何影响模型性能。\n    a. 打开 `Calibration` 小部件。确保目标 = 1 并选择了 `Metrics\
  \ = F1`。\n    b. 向左滑动以对准最高 `F1` 分数。在 0.2 阈值下计算平均 `F1` 并与加权后的平均分进行比较。哪种方法产生了最高的 `F1`？\n\
  \    c. 什么情况下你会使用 `F0.5` 和 `F 2.0` 指标？\n\n### 4.8.2 成熟水平\n\n\n\n\n\n本节展示了三个组织如何根据其自身的组织成熟度，尝试在三个复杂水平上应用本章中的技术。\n\
  \n### 低成熟度水平\n某医疗机构拥有一组手术部位感染患者的数据集。他们收集了 5 个可能的预测因子的数据，并希望据此创建一个预测模型。他们计划运行的模型仅包含\
  \ 2 种算法，并将其中最好的模型作为他们的预测模型。\n\n**警告！** 认为低复杂度问题可以让你免受“无免费定理”（No Free Lunch Theorem）分析严谨性要求的假设是错误的。任何仅仅为了测试许多可用算法和算法选项中的少数几个而采取的捷径，都会增加你无法发现最佳选项以创建最高预测模型的风险。\n\
  \n### 中等成熟度水平\n某医疗机构拥有一组手术部位感染患者的数据集。他们收集了 12 个可能的预测因子的数据，并希望据此创建一个预测模型。他们计划运行的模型将包含\
  \ 8 种算法，并将其中最好的模型作为他们的预测模型。\n\n**注意！** 认为中等复杂度问题可以让你免受“无免费定理”（No Free Lunch Theorem）分析严谨性要求的假设是错误的。虽然这个例子探索了许多不同的算法，但它并没有探索其他可能导致更高性能预测模型的许多算法选项。\n\
  \n### 高成熟度水平\n某医疗机构拥有一组手术部位感染患者的数据集。他们收集了 25 个可能的预测因子的数据，并希望据此创建一个预测模型。他们计划运行的模型将包含\
  \ 16 种算法、算法选项以及一个集成模型，并将其中最好的模型作为他们的预测模型。\n\n**恭喜！** 这个团队认真对待了他们的高复杂度问题。他们收集了尽可能多的预测因子，并在追求最高性能预测模型的过程中，测试了他们所有提供的算法和算法选项。\n\
