  \ other)`（可选帕累托规则（80% 或其他））。\n\n准帕累托图（又名：频率排序柱状图）可以通过 `Distribution`（分布）组件在 Orange\
  \ 中创建，如图 3.11 所示。你应该选择分类变量来创建这些准帕累托图，然后勾选“sort categories by frequency”（按频率排序类别）框。这些准帕累托图还可以通过在“Split\
  \ by”（分割）部分选择另一个分类变量进行分层，如图所示。这张准帕累托图显示了按性别划分的家庭护理计划安置情况。它显示了有多少患者在有或无助的情况下返回社区，或者他们被转入非机构的安宁疗护。\n\
