  \n### 5.6 JASP 模型评估\n\nJASP 报告了许多与 Orange 相同的分类和回归性能指标。它提供了许多多样的性能指标，以及 `ROC curve`、`PRC\
  \ curve` 等。有时回归模块和机器学习模块之间的指标和图表可用性有所不同。例如，`Brier score` 和 `PRC curve` 在逻辑回归模块中可用，但在机器学习模块中不可。此外，JASP\
  \ 在其机器学习模块中对二分类报告以下内容：\n\n- `Precision`（精确率）：正预测值\n- `Recall`（召回率）：真正性率\n- `False\
  \ Positive Rate`（假阳性率）：错误正预测与总负类别的比率。\n- `False Discovery Rate`（假发现率）：错误正预测与预测正类的比率。\n\
  - `F1 Score`（F1 分）：精确率和召回率的调和平均数。\n- `Matthews Correlation coefficient`（马修斯相关系数）：`F1`\
  \ 或准确率的替代方案，对于不平衡数据集更可靠。²⁷\n\n![](img/image-J9RG9W34.jpg)\n\n图 5.47 模型解释工作流\n\n\
  ![](img/image-BVI0K0AM.jpg)\n\n图 5.48 SHAP 结果的散点图（Beeswarm plot）\n\n表 5.4 JASP 特征重要性\n\
  \n![](img/image-CKOHD2OG.png)\n\n- `Negative Predictive Value`（负预测值）：正确负预测与总预测负的比率。\n\
  - `True Negative Rate`（真负性率）：正确负预测与总负类别的比率。\n- `False Negative Rate`（假阴性率）：错误负预测与总正类别的比率。\n\
  - `False Omission Rate`（假漏率）：错误负预测与预测负类的比率。\n- `Threat Score`（威胁分数）：正确预测的正例占所有预测和真正例的比率。\n\
  - `Statistical Parity`（统计等性）：预测正例占所有预测的比率。\n\nJASP 为多种算法提供了特征重要性。表 5.4 显示了一个特征重要性表，报告了与\
  \ Orange Feature Importance 小部件类似的信息。特征按降序排列。JASP 不提供 `SHAP` 功能。\n\n### 5.7 假设检验\n\
  \n预测模型不包含假设检验或 p 值作为标准的模型性能指标。分类问题的常见预测模型指标包括 `accuracy`（准确率）、`precision`（精确率）、`recall`（召回率）、`F1\
  \ score`、`MCC` 和 `ROC AUC`，而回归问题通常使用诸如 `mean squared error (MSE)`（均方误差）、`mean absolute\
  \ error (MAE)`（平均绝对误差）和 `R-squared` 等指标。然而，在预测建模之前的 EDA 阶段使用假设检验并不罕见。\n\n假设检验是一种统计方法，使用\
  \ p 值来判断是否有足够的接受（`p-value > 0.05`）或拒绝（`p-value < 0.05`）零假设。零假设假设数据集中的两个或多个特征（如性别或星期几）之间没有显著的统计差异或关系。使用的假设检验类型取决于所分析的数据类型和分析目标。\n\
  \n有几十种不同的假设检验为了满足各种多样且专门的用例。不断发展的假设检验工具箱从基础的 `t-tests`（t 检验）和卡方检验到专注于非参数数据的高度专门测试。本节目的不是提供假设检验方面的专业知识，而是提供\
  \ Orange、JASP 和 BlueSky Statistics 软件中可用的假设检验概述。\n\n#### 5.7.1 假设检验示例\n\n假设在一场比赛后，A\
  \ 队在 100 次尝试中进了 5 个球（5%），B 队在 100 次尝试中进了 4 个球（4%）。但仅一场比赛的数据不足以得出哪支队的策略更好。这就像通过读一页来判断一本书的质量！\n\
  \n统计分析就像丰富的体育分析师，旨在解决上述困境。然而，即使是最经验丰富的分析师也需要足够的数据来得出可靠的结论。因此，不是评估单场比赛的表现，而是收集整个赛季进球尝试和成功的数据。现在这就像读了整本书。\n\
  \n尽管如此，仅仅收集更多数据并不能保证假设检验有效，因为几乎任何假设检验都有一系列必须满足的严格先决条件，特定的假设检验才能提供有效的结论。是一些常见的假设检验要求：\n\
  \n- 每个比较组都有大量数据\n- 数据符合正态分布\n- 比较组之间的方差相等\n- 随机抽样以便结果可以推广到总体\n- 无离群值\n- 无缺失数据\n\n\
  \n\n\n\n从上述列表可以看出，假设检验是一种非常敏感的分析技术，如果不能满足前提假设，其结论很容易失效。反之，如果满足了这些前提条件，就可以从这种分析中提取出非常有趣的见解。\n\
  \n### 5.7.2 假设检验如何做出决策\n\nP 值在每次假设检验中都会自动计算，用于接受或拒绝预先声明的零假设。假设检验的 p 值就像一个范围从 0 到\
  \ 1 的“倒置兴奋指数”。如果 p 值越接近 0，就就像在说：“哇！这里有状况了！”如果它越接近 1，就就像在说：“算了，这里没什么好兴奋的”。0.05 的\
  \ p 值通常被设置为“顿悟阈值（Aha-Moment threshold value）”，在该阈值之下，我们开始兴奋于分析的两个组在某些方面（均值、中位数、方差、比例等）存在差异。\n\
  \n当 p 值 `< 0.05` 时，我们说“相同性假设”（又称零假设）被拒绝，而“差异性假设”（又称备择假设）被接受。用于记住这个阈值的常用短语是：“如果 p\
  \ 很低，零假设必去（if the p is low, the null must go）”，这意味着当 p 值 `< 0.05` 时，我们拒绝代表所比较组之间相同性假设的零假设。\n\
  \n### 5.7.3 第一类和第二类假设检验错误\n\n如前所述，假设检验可能会犯错，被称为第一类错误或第二类错误。此类错误无法直接检测。为了理解这些统计错误类型，让我们想象一场审判，某人被指控偷饼干，我们有两种可能与绝对真相不符的缺陷法庭判决，如下文所述的指控错误：\n\
  \n*   **第一类错误（假阳性 - 无辜的人被定罪）**：那人并没有真的偷饼干，但法官说：“有罪！”这就像把偷饼干赖在兄弟身上，而实际上是狗干的。\n* \
  \  **第二类错误（假阴性 - 有罪的人释放）**：那人确实偷了饼干，但法官说：“无罪！”这就像兄弟确实偷了饼干，但父母不相信，结果他们逃脱了法。\n\n那么，如何避免这些第一类和第二类假设检验错误呢？通过遵循每项假设检验列出的特定要求，并收集高质量、大量的数据。\n\
  \n第三类错误，也称为第三类错误，是指统计假设检验中研究人员对错误的问题提供了正确的答案的情况。它发生在使用统计检验来回答错误的研究问题时，或者当正确的假设因为错误的原因被拒绝时。\n\
  \n### 5.7.4 Orange、JASP 和 BlueSky Statistics 中提供的假设检验\n\nOrange 在分布（Distribution）和箱线图（Box\
  \ plot）组件中仅有限的卡方和 t 假设检验能力。JASP 和 BlueSky Statistics 提供了许多假设检验选项。图 5.49 显示了 JASP\
  \ 不同菜单标签页中提供的主要假设检验。\n\n图 5.50 显示了 BlueSky Statistics 在样本大小测试标签下或分析（Analysis）标签下提供的假设检验能力。\n\
  \n下面列出了按单变量、双变量和多元数据分析应用分类的 Orange、JASP 和 BlueSky Statistics 假设检验。如前所述，预测建模不包含假设检验作为核心要求：\n\
  \n1.  单变量（单因素）数据分析：\n\n    *   正态性检验用于测试连续特征是否代表正态分布。\n    *   进入 `JASP` > `Descriptive\
  \ Statistics` > 在 `Variables` 部分输入至少一个连续变量进行正态性检验。`Statistics` > 勾选 `Shapiro-Wilk\
  \ test` > 查看 `p-value(s)`。\n    *   进入 `BlueSky Statistics` > `Analysis` > `Distribution\
  \ Analysis` > 在 `Source variables` 部分选择至少一个连续变量进行正态性检验。正态性检验选项包括以下测试：`Shapiro-Wilk\
  \ normality test`、`Anderson-Darling normality test` 和 `Kolmogorov-Smirnov normality\
  \ test`。\n\n    ![](img/image-U93NZ7R4.jpg)\n\n    图 5.49 JASP 假设检验\n\n    ![](img/image-PU21OS3Y.jpg)\n\
  \n    图 5.50 BlueSky Statistics 假设检验选项\n\n    *   当任何正态性检验的 p 值低于 `0.05` 时，这在统计学上证实了数据并非正态分布。\n\
  \    *   单样本 t 检验（假设正态性）：用于测试样本均值是否与已知或假设的目标值有显著差异。\n    *   进入 `JASP` > `T-Tests`\
  \ > `One Sample T-Test` > 输入一个特征 > `Tests` > 输入所需的测试值 > 勾选所需的测试(s) > 查看 `p-value(s)`。\n\
  \    *   进入 `BlueSky Statistics` > `Means` > `T-Test, one sample` > 选择一个变量 > 选择一个测试值\
  \ > 查看 `p-value(s)`。\n    *   当 p 值低于 `0.05` 时，这证实了均值与目标测试值之间存在统计显著差异，这意味着设定的目标未达成。\n\
  \    *   独立 t 检验（假设正态性）：用于测试两个独立样本的均值之间是否存在显著差异。\n    *   进入 `JASP` > `T-Tests`\
  \ > `Independent Samples T-Test` > 在 `Dependent Variables` 部分选择一个连续特征，并在 `Grouping\
  \ Variable` 部分选择一个分类变量 > `Tests` > 勾选所需的测试(s) > 查看 `p-value(s)`。\n    *   进入 `BlueSky\
  \ Statistics` > `Means` > `T-Test, one sample` > （注：文中说是“Independent Samples”，但上下文暗示是独立的）……当\
  \ p 值低于 `0.05` 时，这证实了均值之间存在统计显著差异。\n    *   独立双样本 t 检验（不假设正态性）：测试两个独立样本的中位数是否存在显著差异。\n\
  \    *   进入 `JASP` > `ANOVA` > 在 `Dependent Variable` 部分输入连续变量 > 在 `Fixed Factors`\
  \ 部分输入分类变量 > `Nonparametrics` > 在 `Kruskal-Wallis Test` 下在右侧输入分类变量 > 查看 `p-value(s)`。（注：原文此部分的文本略有破碎，但遵循此逻辑）。\n\
  \    *   配对 t 检验（假设正态性）：用于测试同一患者两个相关样本（例如治疗前后）的均值是否存在显著差异。\n    *   进入 `JASP` >\
  \ `T-Tests` > `Paired Sample T-Test` > 选择前后或 A/B 测试特征 > `Tests` > 勾选所需的测试(s) > 查看\
  \ `p-value(s)`。\n    *   进入 `BlueSky Statistics` > `Means` > `T-Test, Paired` >\
  \ 查看 `p-value(s)`。\n    *   当 p 值低于 `0.05` 时，这证实了前后或 A/B 测试特征的均值之间存在统计显著差异。\n  \
  \  *   单因素独立方差分析用于检验方差齐性：用于测试连续变量的两个或多个组具有相同的方差。\n    *   进入 `JASP` > `ANOVA` >\
  \ 选择具有两个或多个组的连续变量并进入 `Dependent Variable` 部分 > 选择分类特征并进入 `Fixed Factors` 部分 > `Assumption\
  \ Checks` > 勾选 `Homogeneity tests` 以获取 `Levene’s test` > 查看 `p-value(s)`。\n    *\
  \   如果 p 值低于 `0.05`，则至少两个组的方差存在差异。\n    *   卡方检验检查不同子组之间的观测频率和预期频率在统计上是否相同。\n  \
  \  *   进入 `Orange` > 选择 `Box Plot Widget` > 在上方 `Variable` 窗口选择一个分类特征 > 在下方的 `Subset`\
  \ 窗口选择另一个分类特征 > 查看图表下方括号中的卡方 p 值。\n    *   进入 `BlueSky Statistics` > `Non-Parametric`\
  \ > `Chi-Squared Test` > 查看 `p-value`。\n    *   如果卡方 p 值低于 `0.05`，则观测频率和预期频率不匹配。\n\
  \n2.  双变量（双因素）数据分析：\n\n\n\n\n\n### 相关性分析\n\n- 带有热力图的 Pearson（皮尔逊）相关检验：用于两个两个变量之间是否存在显著的线性关系。\n\
  - 进入 `JASP` > 选择 `Regression` > `Classic` > `Correlation` > 选择所有想要测试相关性的变量并将其输入\
  \ `Variables` 框中 > 勾选 `Pearson’s r` > 勾选 `Heatmap`，这将创建一个包含 `r` 值的矩阵 > 检查 `r` 和\
  \ `p-value(s)`。\n- 勾选 `Report significance`（报告显著性），这将创建一个包含 `r` 值和 `p-value` 的矩阵。当\
  \ `p-values` 低于 `0.05` 时，两个匹配特征之间的相关性在统计学上是显著的。\n- 带有热力图的 Spearman（斯皮尔曼）相关检验：用于测试两个连续或定序变量之间是否存在显著的单调关系。\n\
  - 进入 `JASP` > 选择 `Regression` > `Classic` > `Correlation` > 选择所有想要测试相关性的变量并将其输入\
  \ `Variables` 框中 > 勾选 `Spearman’s rho` > 勾选 `Heatmap`，这将创建一个包含 `r` 值的矩阵 > 勾选 `Report\
  \ significance`，这将创建一个包含 `r` 值和 `p-value` 的矩阵 > 检查 `r` 和 `p-value(s)`。\n- 当 `p-values`\
  \ 低于 `0.05` 时，两个匹配特征之间的相关性在统计学上是显著的。\n\n### 3. 多变量（两个以上因素）数据分析\n\n- 用于回归或分类的多重回归分析：用于测试因变量（目标）与多个自变量（预测因子）之间的关系。\n\
  - 进入 `JASP` > 选择 `Regression` > `linear` 或 `logistic regression` > 在 `Dependent\
  \ Variable` 区域输入 `target` > 在 `Covariates` 区域输入所有连续变量 > 在 `Factors` 区域输入分类因素 > `Statistics`\
  \ > 勾选 `Estimates` 和 `Model Fit` > 勾选 `Collinearity diagnostics`（多共线性诊断）以获取 `VIFs`（方差膨因子）\
  \ > 查看 `ANOVA` 表格上的 `p-value` 以判断整个模型在统计学上是否显著（`p-value < 0.05`） > 查看 `Coefficients`\
  \ 表格查看每个输入因素的 `p-values`。\n- 从输入列表中删除任何 `p-value` 大于 `0.05` 的变量，但要一次处理一个因素，从最高的\
  \ `p-value` 开始。\n- 当 `Coefficients` 表格上所有的 `p-values` 都低于 `0.05` 时，你就有了一个最终有效的回归模型。\n\
  - 检查是否所有 `VIFs` 都低于 `5`。如果不是，你就有需要处理的多共线性问题。除非模型中所有的 `VIFs` 都小于 `5`，否则模型和变量排名将是不正确的。\n\
  - 双样本 Kolmogorov-Smirnov 检验：使用在线计算器测试两个不同的特征是否来自同一分布。这在合成数据时非常有用，可以确保新数据与现有数据匹配。\n\
  - 进入 `SciStatCalc`：`Two-sample Kolmogorov-Smirnov Test Calculator` > 将每个数据集复制并粘贴到网站各自的框中，或上传包含两个数据列的文件\
  \ > 点击标题为“Plot CDFs and perform two sample Kolmogorov-Smirnov Test”的按钮 > 查看图表，特别是输出底部的\
  \ `p-value`。\n- 如果 `p-value` 低于 `0.05`，可以得出两列数据来自不同分布的结论，且不认为具有统计验证的相似形状（如直方图所示）。\n\
  - 如果 `p-value` 高于 `0.05`，可以得出两列数据来自同一分布的结论，并认为它们具有统计验证的相似形状（如直方图所示）。\n- 确保没有将空格或文本（例如列标题）粘贴到\
  \ KS 器的框框中，否则可能导致答案不正确。\n\n### 假设检验总结\n\n#### 核心原理\n- 在适当的情况下，假设检验可以与机器学习形成互补，特别是在探索性数据分析（EDA）阶段，特别是对于较小的数据集。\n\
  - 假设检验可能会犯错，称为第一类错误或第二类错误。\n- 假设检验是一种统计方法，使用 `p-values` 来确定是否有足够的证据接受（`p-value >\
  \ 0.05`）或拒绝（`p-value < 0.05`）零假设。\n- 假设检验的 `p-value` 就像一个范围从 0 到 1 的“反向兴奋指数”。如果\
  \ `p-value` 接近 `0`，就像是在说：“哇！这里有状况！”如果它更接近 `1`，就像是在说：“忘记吧，这里没什么好玩的。”\n- 任何假设检验中 `0.05`\
  \ 的 `p-value` 通常是“顿悟的阈值”。\n- 当 `p-value` `< 0.05` 时，我们开始兴奋于所调查的两个组在某些方面（均值、中位数、方差、比例等）存在差异。\n\
  - Orange 仅在 `Distribution` 和 `Box Plot` 小部件中提供基础假设检验，如卡方检验和 t 检验。\n- `JASP` 和 `BlueSky\
  \ Statistics` 软件提供了许多不同的假设检验以及 Orange 中没有的其他经典统计分析技术。\n- 在大型机器学习数据集中使用假设检验比较两个模型或组别时，仅仅因为数据集行数巨大，几乎完全相同的数值也可能被认为具有统计学显著差异。\n\
  - 在分析大数据时，假设检验会变得无关紧要，因为几乎所有组之间的差异在统计学上都是显著的。\n\n### 5.8 识别和处理概念漂移与模型漂移\n\n[图 5.51]\
  \ 提供了我们在八步 DISCOVER 流程中当前位置的可视化。在此阶段，我们处于第八阶段，命名为：“确认模型漂移和概念漂移后重新评估并训练模型”。本节将概述驱动模型重新训练的各种情况。\n\
  \n概念漂移描述了输入变量（特征）与目标变量（输出）之间基本关系的逐渐变化。导致这种漂移的有多种潜在原因，包括用户行为的变化、用户群的变化、市场状况、季节性模式和其他原因。\n\
  \n\n\n\n另一方面，模型漂移（Model Drift）是指由于任何原因模型性能随时间推移的性恶化，包括概念漂移或任何其他真实或未识别的原因。这可能是由于输入变量分布的变化，或者模型最初训练时的用户群体发生了偏移。从本质上说，模型漂移是指模型的预测性能由于任何原因随时间推移而下降。\n\
  \n![](img/image-L3EMG4SX.jpg)\n\n图 5.51 数据科学 DISCOVER 过程中的第八步\n\n模型漂移的示例：欺诈检测中的模型漂移发生在基于历史数据训练以识别欺诈交易的机器学习模型随着时间推移准确性降低时。随着欺诈者行为的演变和新欺诈活动的出现，模型检测这些变化的能力就会减弱。输入变量与目标变量之间关系的变化导致模型识别不断变化的欺诈模式的有效性逐渐下降。当这种情况发生时，就是重新评估你的模型特征并重新训练模型了。\n\
  \n虽然概念漂移（Concept Drift）是一个更具体的术语，指的是输入输出之间底层相关性的变化，但模型漂移是一个更广泛的术语，它可以包含概念漂移以及其他影响模型预测性能的变化。同样，当这种情况发生时，就是重新评估你的模型特征并重新训练模型了。\n\
  \n### 5.8.3 何时重新训练模型\n\n当确认概念漂移和/或模型漂移时，就需要重新训练预测模型，特别是当其超过了预设的数据偏移或模型性能恶化的阈值时。³⁰\
  \ 这些阈值应结合自动化监控设置，生成自动警报，强调可能需要快速重新训练模型。然而，为了防止模型漂移警报疲劳，请注意漂移可能发生在各种场景中：突然、逐渐或反复发生。³¹\n\
  \n### 5.9 将知识付实践\n\n#### 5.9.1 练习\n\n本章侧重于模型评估，因此我们将创建一个练习来评估分类模型的性能。我们将确定模型的区分能力和校准。我们将在测试数据上验证模型并报告标准的模型指标。我们将使用的数据集是来自\
  \ Kaggle 的银行贷款数据集.³² 该数据集可以在那里下载，也可以在我们文件共享网站的第 5 文件夹中下载（`UniversalBank.csv`）。\n\
  \n1. 请务必查看 Kaggle 上的数据字典，它解释了数据集中数据列的定义。请注意，上传到文件共享网站的文件不包含 `ID` 和 `zip code` 列。注意：`family`\
  \ 应该表示家庭人数，但没有零或大于四的数字，所以这一点并不清楚。此外，`mortgage` 列大部分由零组成，这意味着贷款已经还清，或者他们是租户。\n\n\
  2. 银行的目标是预测客户拥有哪些属性会使他们可能贷款，例如广告活动的结果？该数据基于之前的广告活动。\n\n3. 将文件上传到 JASP\n\n   a. 第一个屏幕应该是数据的类似表格的视图。查看每一列。\n\
  \n4. 从简单的描述性统计开始\n\n   a. 将所有变量移动到变量框，`Personal Loan` 除外，它将放入 `Split` 框。\n   b.\
  \ 在 `Statistics` 下勾选 `mean`（平均值）、`Std. deviation`（标准差）、`Maximum`（最大值）和 `Minimum`（最小值）。\n\
  \   c. 在 `Basic Plots` 下选择 `Distribution`（分布）和 `Correlation`（相关性）图。\n   d. 在 `Customizable\
  \ Plots` 下选择 `Boxplots`（箱线图）。选择 `Box Plot` 元素并勾选 `Label outliers`（标记离群值）。\n\n5.\
  \ 根据你的发现，检查以下内容：\n\n   a. 是否有缺失数据？\n   b. 是否存在类别不平衡？\n   c. 年龄范围是多少（`loan yes` 对\
  \ `loan no`）？\n   d. 收入差异（`loan yes` 对 `loan no`）？\n   e. 信用卡余额差异（`loan yes` 对 `loan\
  \ no`）？\n   f. `mortgage` 差异？（`loan yes` 对 `loan no`）？\n   g. 年龄和工作年限的相关性有多大？这可能是多共线性的证据吗？\n\
  \   h. 现在看箱线图。子组之间的差异在哪里？\n\n6. 我们怀疑存在多共线性，因此从顶部的 `Regression` 菜单中选择 `Linear Regression`（线性回归）\n\
  \n   a. `Dependent variable`（因变量） = `personal loan`。将连续变量移动到第二个窗口（`covariates`），分类变量第三三个窗口（`factors`）。\n\
  \   b. 滚动到 `Statistics` 并确保勾选了“collinearity diagnostics”（共线性诊断）选项。\n   c. 在表格中，你应该观察到有两个变量的\
  \ VIF 非常高——`age` 和 `years of experience`。p 值较低，表明它们确实与目标相关，因此我们不想两个都删除。让我们从变量中剔除\
  \ `age` 并重新计算 `VIFs`。现在所有的 VIF 都小于 5。\n\n7. 让我们创建一个分类模型，来预测那些选择申请个人贷款的人与那些不会申请的人。\n\
  \n   a. 在顶部的 `Machine Learning` 菜单中，选择 `Classification` 下的 `Boosting`。我们将为此模型仅运行一种算法。\n\
  \   b. 选择 `target`（目标） = `personal loan`，并将其他预测因子（年龄除外）移动到 `Features`（特征）。\n   c.\
  \ 滚动并选择 `confusion matrix`（混淆矩阵）、`evaluation metrics`（评估指标）、`data split`（数据划分）和\
  \ `ROC curves`。在图表下选择 `Relative influence`（相对影响）（类似于 Orange 中的 `Feature Importance`\
  \ 小部件）。哪个变量的影响最大？\n   d. 注意：存在 60/20/20 的划分（训练/验证/测试）。\n   e. 查看 `confusion matrix`。注意假阳性（false\
  \ positives）和假阴性（false negatives）之间的差异。\n   f. 查看 `Evaluation Metrics` 并注意在模式区分方面的卓越结果。\n\
  \   g. 根据这些结果，是否有严重类别不平衡的证据？\n\n8. 将数据集上传到 `Orange File` 小部件\n\n   a. 连接到 `Data\
  \ Sampler` 小部件并设置为 80/20 训练/测试划分并对样本进行分层。使用两个连接器连接到 `Test and Score` 小部件。一个链接应该是数据到数据，另一个是剩余数据到测试数据。\n\
  \   b. 将 `Gradient Boosting` 小部件连接到 `Test and Score`并将 `Calibration` 小部件连接到 `Test\
  \ and Score`。\n   c. 打开 `Test and Score` 小部件，确保 `target` = 1 并勾选了“Test on test data”（在测试数据上进行测试）。\n\
  \   d. 结果应与 JASP 生成的结果相似。\n   e. 打开 `Calibration Plot` 小部件。确保 `target` = 1。曲线是否遵循\
  \ 45 度线？如果没有，它在何处偏离？\n   f. 这是一个区分能力优秀但校准中庸的示例。\n\n#### 5.9.2 成熟度水平\n\n让我们关注数字营销行业内，根据不同的项目复杂性和组织成熟度对模型评估技术的使用：\n\
  \n数字营销（低成熟度水平）：\n\n一家营销机构正在使用机器学习进行基础电子邮件活动优化。\n\n提示：他们应该：\n\n• 平衡数据集以避免对某些群体的偏差。\n\
  • 确保有足够的数据进行有意义的模型训练和验证。\n• 使用准确性和精确率作为初始评估指标。\n• 创建混淆矩阵以理解模型的分类能力。\n• 通过迭代模型阶段来解决问题。\n\
  \n数字营销（中成熟度水平）：\n\n该机构正在实施机器学习以预测社交媒体活动的用户参与度。\n\n提示：在基础策略的基础上，他们应该：\n\n• 应用 ROC（受试者工作特征）和\
  \ PRC（精确率-召回率曲线）进行模型评估。\n• 如果使用回归，可视化残差。\n• 开始特征重要性分析以识别关键参与因素。\n• 使用 SHAP（解释性解释）等工具进行模型的可解释性分析。\n\
  \n数字营销（高成熟度水平）：\n\n该机构正在利用高级机器学习进行个性化的全渠道营销策略。\n\n提示：在中等策略的基础上，他们应该：\n\n\n\n\n\n\
  - 针对不平衡数据集尝试过采样（oversampling）或欠采样（under-sampling）技术。\n- 应用多种模型性能指标，如 `F1-score`\
  \ 和 `AUC-ROC`。\n- 考虑外部验证数据以提高模型的泛泛化能力。\n- 评估数据和特征重要性，根据需要调整模型的关注点。\n- 尝试超参数调优以优化模型性能。\n\
  - 深化模型可解释性工作，确保客户理解模型决策。\n- 根据真实世界的反馈持续验证和完善模型。\n\n## 资源\n\n1. 关于机器学习混淆矩阵你应该知道的一切\
