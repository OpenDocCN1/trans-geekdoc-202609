  \ 0，标准差为 1。公式：`New value = (value – mean) / (standard deviation)`\n6. 归一化到区间 `[0,\
  \ 1]`（又：跨度/离差值归一化）：此方法将每个数据值转换为 0 到 1 之间的值。公式：`New value = (value – min) / (max\
