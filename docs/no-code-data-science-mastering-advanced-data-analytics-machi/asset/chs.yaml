  \ classes）的选项。如果你对所有类别或场景都感兴趣，请使用此选项。最后一种选项的示例可能是研究人员同样感兴趣地预测所有类型的肿瘤（良性、恶性或癌前性）。请记住，在最后一个示例中，指标值是根据类别大小计算的加权平均值。\n\
