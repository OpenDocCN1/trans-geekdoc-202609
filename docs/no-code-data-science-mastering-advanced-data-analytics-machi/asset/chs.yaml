  ### 作者：William Hersh 医学博士\n\n20 世纪学习和实践医学的一大格言之一是，你需要在脑中储备尽可能多的知识，以处理医学中所有可能的诊断和治疗情况，从而成为最有效的临床医生。这在\
  \ 1987 年我完成内科医学培训时可能还不是真的，但在进入 21 世纪的几十年后，这显然已经不再是事实了。人类不可能在大脑中掌握实践医学所需的所有知识，而且关于疾病及其治疗，我们仍有许多未知的领域正隐藏在日益可用的数据之中。\n\
  \n自从从 20 世纪 70 年代在高中接触早期计算机，以及在 80 年代接触桌面式电脑以来，计算机和数据一直是我的兴趣。我非常激动能发现我们当时被称为医学信息学的领域，并一直发展到\
  \ 21 世纪。\n\n\n\n在医疗保健领域，信息学学生处于非常有利的位置，可以增强自己的数据科学知识并将其应用，特别是在电子健康记录（EHR）和其他数据变得更加易于且无处不在的情况下。《新英格兰医学杂志》近期的一个观点指出，医生和医学生必须针对临床算法时代接受培训，这要求他们具备数据素养，并理解新人工智能工具的功能和局限性。\n\
  \n幸运的是，有一些工具允许许多领域中越来越多的专业人士在无需编写代码的情况下学习并应用数据科学。本书为来自许多不同职业的人士提供了一个丰富的课程，让他们使用\
  \ `Orange` 和 `JASP` 等工具学习数据科学。作者从一开始就指出，数据科学不仅仅是将数据加载到模型中并应用输出，还需要其他任务的技能，如数据清洗、探索和可视化。除了分类和回归的经典机器学习模型外，本书还探索了数据科学的其他用途，如图像分析和文本挖掘。配套网站提供了数据集和其他资源，用于书中的使用和教学。\n\
  \nWilliam Hersh, 医学博士\n教授\n医学信息学与临床流行病学系\n医学院\n俄勒冈健康与科学大学\n美国俄勒冈州波特兰\n\n# 前言\n\n\
  在这个充斥着脏、缺失、混乱、共线性、无关和误导性数据的时代，数据科学的力量不仅在编码人员手中，也在那些具有好奇心、创新精神以及具备其他分析技能的非编码人员手中。“无代码数据科学”不仅仅是一本书；它是一场运动，一次行动号召，一份声明，声明任何好奇的心灵都可以参与从数据中提取重大见解，而无需陷入编程语言语法的泥潭。\n\
  \n我们将深入探索数据分析和预测分析的海洋，揭示隐藏在原始数据表面下的奥秘。从构建引人注目的视觉叙事到设计最吸引人的预测模型，本书是一次穿过数据科学广阔领域的旅程，但没有了传统的编码障碍。数据科学和预测分析在中小企业中的广泛采用，依赖于放弃对\
  \ `Python`、`R` 或 `SQL` 编码复杂的需求，转向用户友好的无代码数据科学分析平台。这种转变可以通过一种新型无代码数据科学家来实现——这些人对数据科学深有了解，却免受历史上阻碍许多组织数据驱动旅程的编码限制。\n\
  \n在接下来的章节中，我们打破了术语和复杂性的高墙，赋予你能力：\n\n1. 细致地准备和塑造你的数据\n2. 用引人入胜的数据可视化讲述故事\n3. 向利益相关者有效解释预测模型以建立信任\n\
  4. 利用高级分析的预测力量\n5. 在时间序列预测和生存分析的动荡水域中航行\n6. 通过地理位置分析绘制地理区域图\n7. 通过图像分析解读视觉世界\n8.\
  \ 通过文本挖掘探索非结构化数据的深度\n9. 设想各种持续改进方法与数据科学的整合\n10. 雕塑工业 4.0 的未来图像\n\n在描述如何掌握这些高远任务的同时，我们还解释了无代码数据科学与革命性的低代码\
  \ AI 领域的融合。当我们澄清数据科学、商业智能和统计学之间的区别时，我们强调数据科学的真正本质不仅关注算法的细节，而在于回答人类最好奇的问题。\n\n在阅读此书时，请记住数据科学是一个持续的旅程，而不是一个让你休息沉浸于过去成就的终点。数据科学过程是循环的而非线性的，因为它不断地解释新数据并实时创建新的见解。数据科学欢迎有纪律和有分析能力的思考者，他们想要建立一个他们想生活的更好世界。无论你在组织中处于什么位置，预测数据分析的力量现在已在你的手中。\n\
  \n成功的关键在于提出最重要的问题，收集最相关的数据，清洗和准备你的数据，进行探索性数据分析，构建出色的预测模型，用深刻的见解生动地可视化过去。\n\n\n\n\
  \n数据科学贯于所有行业。数字革命产生了海如倒伏的数据，需要专家进行分析。¹虽然人们对机器学习和人工智能的关注日益增加，但我们不应忽视数据准备、探索和可视化的重要性。数据科学家在项目上花费的时间约三分之二与为建模准备数据相关。²\
  \ 因此，我们既需要基础数据科学技能，也需要高级技能。\n\n**要点**：根据维基百科，数据科学可以定义为“一门跨学科领域，利用科学方法、过程、算法和系统，从噪声、结构化和非结构化数据中提取知识和洞察，并在广泛的应用领域中应用来自数据的知识和可操作的洞察。”³\
  \ 数据科学是一个方便的伞状术语，涵盖了计算和统计方面的知识。值得注意的是，目前还没有关于数据科学的广泛接受的定义，也没有相应的母级专业组织。\n\n本书将探索数据科学的多方面领域，重点关注四个关键分析领域：用于表格数据的机器学习、预测性图像分析、预测性文本挖掘和人工智能（AI）。表\
  \ 1.1 提供了几个精选行业的快照，展示了各种数据科学应用示例如何在这些领域中部署。⁴⁻⁷\n\n数据科学是一个相对新的领域，具有极高的受欢迎和热度。例如，2012\
  \ 年，《哈佛商业评论》将数据科学称为“21 世纪最性性的工作”。⁸ 这这句格言过于华丽，因为数据科学家的大部分时间花在寻找、清洗、准备和探索数据上，这些可能是艰苦的。\n\
  \n**要点**：无代码数据科学意味着不需要编程语言即可执行功能，例如创建箱线图。相反，该功能使用图形用户界面（GUI）来创建图像。无代码数据科学使得更多人参与数据科学，或者说是该领域的民主化。`Orange`\
  \ 和 `JASP` 等软件程序就是无代码数据科学的示例。\n\n### 1.1.1 背景\n\n1962 年，著名统计学家约翰·图基基（John Tukey）发表了一项在统计学界引起反响的声明。他表示：“我感到我的核心兴趣在于数据分析，我认为这包括其他内容：分析数据的程序、解释此类程序结果的技术、规划数据收集的方法以使其分析更简单、更精确或更准确……”\
  \ 他清楚地看到分析世界比单纯的统计学要广得多，并且感觉到计算将永远改变数据分析。⁹\n\n威廉·克莱夫兰（William Cleveland）是一位计算机科学家也是统计学家，他在\
  \ 2001 年首次发表了“数据科学”这一术。他还预见到该领域比纯统计学更广泛，处理的内容远比理论得多。¹⁰ 早期数据科学家在一些最具创新的互联网公司工作，如\
  \ `Google`、`Facebook`、`LinkedIn` 和 `Twitter`，帮助他们从海量新数据中获取洞察。“数据科学家”这一术语归功于 2008\
  \ 年的 `DJ Patil`（`LinkedIn`）和 `J Hammerbacher`（`Facebook`）。¹⁰ 数据科学家为消费者生成了新的数据用例，以及新的业务模型和产品。在这一早期，该领域的专业人士即使没有正式学位，也将自己标记为数据科学家。互联网的出现也许是数据爆炸最主要的来源。例如，在\
  \ 2023 年，平均每天有约 85 亿次 `Google` 搜索。¹¹\n\n今天几乎所有的互联网活动都可以被衡量（数据化或量化）并挖掘。除了数据量的惊人增长外，数据还具有极大的多样性，例如位置数据（地理信息系统）、调查数据、图像数据、电子邮件数据、推文数据和传感器数据。数据科学领域得益于更快的计算机处理器（`GPUs`\
  \ 和 `TPUs` 的加入）、旨在处理海量数据的开源软件以及更更大的存储空间。在生物医学领域，电子健康记录和基因组数据库构成了等待挖掘的两大数据源。数据科学还受益于“开放数据”时代，行业和政府尝试向公众、开发者和研究人员提供数据。¹²\n\
  \n### 1.1.2 人工智能与机器学习\n\n人工智能（AI）自 20 世纪 50 年代以来一直存在，直到过去的二十年里，它并不是数据科学的重要部分。“人工智能”这一术语归功于早期计算机科学家约翰·麦卡锡（John\
  \ McCarthy），他在 1956 年的达特茅会议上引入了这一术语。¹³ 关于 AI 的更多历史细节可以参考这些参考文献。¹⁴⁻⁵ 图 1.1 概述了现代\
  \ AI 的历史及其三十十年来的影响因素。¹⁶\n\n以下是重要的定义：\n\n人工智能（AI）：“指通过分析环境并采取行动——具有某种程度的自主性——以实现特定目标的系统。”¹⁷\n\
  \n表 1.1 数据科学的各种行业应用\n\n\n机器学习（ML）：“是一种人工智能（AI），为计算机提供了在没有显式编程的情况下学习的能力。机器学习侧重于开发计算机程序，这些程序在接触新数据时可以发生变化。”¹⁸\n\
  \n深度学习（DL）：“通过使用 `backpropagation` 算法在大数据集中发现复杂的结构，以指示机器如何改变其内部参数，这些参数用于从前一层的表示计算每层的表示。”¹⁹\
  \ 此外，它它是机器学习的一种，使用带有额外隐藏层的算法（`neural networks`）来处理非常庞大且复杂的数据集。\n\n\n图 1.1 AI 时间进程\n\
  \n人工智能始于“专家系统”，这意味着由专家创建的规则被计算机化用于医学领域的决策支持。一个例子是早期的 `MYCIN` 项目，它对感染性疾病和抗生素的选择提供建议。²\
  \ 该项目最终由于多种原因失败了，但应该注意到，这一倡议在个人电脑、笔记本电脑、应用程序和互联网之前。\n\n我们专门了图像分析（计算机视觉）和文本挖掘作为人工智能的重要组成部分。这一领域可以表征为窄人工智能和通用人工智能。窄人工智能执行特定任务，例如使用\
  \ `Google Translate` 进行语言翻译或评估视网膜图像。通用（强）人工智能意味着技术能够像人类一样独立思考。我们目前尚未达到通用人工智能。\n\n\
  机器学习是人工智能的一个子集，主要涉及使用旧统计算法（如 `linear regression`）或新算法（如 `random forest`）进行监督和无监督学习。机器学习主要关注预测性分析。这将在第四章建模中进行更详细的讨论。\n\
  \n图 1.2 显示了 AI、机器学习和深度学习之间的关系。许多权威会将此维恩图视为数据科学和计算机科学领域的共有\n\n在本书中，我们将讨论机器学习和预测性分析。机器学习（ML）通常分为三类：\n\
  \n\n\n\n\n-   **监督学习**：`ML` 模型在标记数据（结果已知）上进行训练，目标是根据预测变量预测结果。如果结果是类别的（例如：癌症、良性、垃圾邮件、信用卡欺诈），则则为分类模型。如果结果是数值型的（例如：住院天数\
  \ - 以天计、客户投诉百分比、制造次品率），则为回归模型。\n\n\n\n-   **无监督学习**：`ML` 模型在未标记数据上进行训练，以识别数据集中的隐藏模式、群组或聚类。示例包括医学图像分析、客户细分/聚类、推荐系统以及识别具有相似学习风格的不同学生。\n\
  \n-   **强化学习**：这种方法源于游戏行业，智能体通过与环境交互并获得相关的奖励和惩罚以达到目标。它通过试错进行学习。想一下《吃豆人》游戏。其他例子包括个性化医疗、个性化营销、训练机器人与其环境交互以及金融算法交易。\n\
  \n\n直到最近，实践数据科学的方法只有一种，使用编程语言，如 `R` 或 `Python`。本教科书是无代码数据科学如何涵盖每个主要数据清洗、数据准备和机器学习任务的示例。还存在无代码和低代码选项来创建\
  \ AI 应用。²¹ `AutoML` 低代码选项也可用，可以用极少的代码行执行高级的自动化机器学习和可视化任务。`Auto-Sklearn` 是一个开源的 `AutoML`\
  \ `Python` 库，它自动化了算法选择、超参数调优和模型选择的过程。²² `H2O AutoML` 是一个开源的 `AutoML` 平台，提供无代码 界面，使得创建机器学习模型变得容易。它自动化算法选择、特征生成、超参数调优、迭代建模和模型评估。它为训练和评估机器学习模型提供了用户友好的界面。²³\
  \ 还存在其他需要编码的 `AutoML` 包。此外，AI 已经集成到 `Python` 包和集成开发环境（`IDE`）中，作为低代码数据科学的更多示例。²⁴-²⁵\n\
  \n`ChatGPT` 是 `OpenAI` 在 2022 年 11 月发布的大语言模型（`LLM`）。²⁶ 它在海量的通用内容（如 `Wikipedia`、书籍、互联网文本资源和社交媒体）上进行训练。它是“生成式\
  \ AI”的示例，产生文本、图像、音频和合成数据。关于 `LLMs` 和聊天的更多细节见第 11 章。可以使用 `LLMs` 进行数据分析，早期的炒热认为它可以取代数据科学家。虽然\
  \ AI 生成的数据科学在未来可能会改进，但没有证据表明它会取代数据科学家。\n\n许多 `LLMs` 允许用户上传数据集，然后用户用自然语言输入提示来请求数据科学任务。它还可以创建各种预测模型，包括性能指标。输出通常包含显示工作流的\
  \ `Python` 代码，因此这是另一个低代码数据科学的示例。大多数 `LLMs` 不产生数据可视化，因此用户必须将 `Python` 代码剪粘贴到 `IDE`（如\
  \ `Jupyter Notebook`）中以查看图像。²⁷\n\n可能的 `LLM` 用例列表如下：\n\n-   作为编码助手以节省时间和击键次数\n- \
  \  审查和总结文献\n-   评估基因数据\n-   描述和总结数据集，讨论列和行\n-   使用提示词（prompt）确定是否存在数据挑战，如类别不平衡、多共线性、离群值和缺失数据\n\
  -   使用提示词解决数据挑战并报告理由\n-   使用提示词讨论数据的优缺点\n\n局限性和注意事项列表如下：\n\n-   由于幻觉（hallucinations），可能产生看似但错误的文本\n\
