  \n# 第 11 章\n\n## 文本挖掘\n\n“没有大数据，你将既盲又是聋。”\n\n—— Geoffrey Moore\n\n### 学习目标\n\n阅读完本章后，读者能够：\n\
  \n- 讨论自然语言处理（NLP）作为一个跨学科领域。\n- 列出 NLP 的常见用途。\n- 解释为什么现在 `transformers` 优于 `RNNs`。\n\
  - 讨论卷积神经网络（CNN）的应用。\n- 讨论大语言模型（LLMs）和小语言模型（SLMs）的趋势。\n\n### 第 11 章总结\n\n在本节中，将讨论多种自然语言处理（NLP）概念。本节涵盖了监督学习和无监督学习。此外，深度学习已成为一项主要技术，涉及\
  \ `RNNs`、`CNNs`、`transformers` 以及其他新方法。Google、Amazon 和 Facebook 等大型公司投入了大量精力和资金改进\
  \ NLP，为大众提供下一代搜索选项。最新的进展是大语言模型（LLMs），例如 ChatGPT 和 GPT-4。多模态平台即将出现，还有特定的生物医学 LLMs。\n\
  \n### 核心原理\n\n- **文本表示**：将文本转换为适用于分析的形式，例如分词（tokenization）和词干提取（stemming）。\n- **文本预处理**：对文本进行清理和准备。这可能涉及无关词汇或纠正拼写错误。\n\
  - **自然语言处理（NLP）**：对自然口语或书面语言进行有意义的分析。\n- **主题建模**：在文本语料中发现隐藏的主题结构，以识别趋势。\n- **情感分析**：识别并分类文本中的观点，以确定用户的态度。\n\
  - **大语言模型（LLMs）**：在海量数据集上训练的模型，能够生成类人类文本并理解广泛的主题。\n- **小语言模型（SLMs）**：在特定较小数据集上训练的模型，在专业领域上具有更高的精确度和关注度。\n\
  \n\n这一章是较为复杂的章节之一，因为在运行第一个 NLP 模型之前，你需要理解多个概念和术语。此外，可用的模型非常有限，用于医疗保健应用文本挖掘的免费医疗文本集合也同样有限。以下是该领域的一些标准定义。\n\
  \n# 语言语言处理 (NLP)\n\n自然语言处理（NLP）“是语言学、计算机科学和人工智能的一个子领域，关注计算机与人类语言之间的交互，特别是如何编写计算机以处理和分析大量的自然语言数据。”\
  \ ¹ NLP 汲取了许多学科，包括计算机科学和计算语言学。NLP 包含自然语言理解（`NLU`）和自然语言生成（`NLG`）。\n\n## 自然语言理解 (NLU)\n\
  “涉及将人类语言转换为机器可读的格式。” ² 一个例子是 `Google Translate`。\n\n## 自然语言生成 (NLG)\n“是一个自动将数据转换为纯英语内容的软件过程。”\
  \ ³ NLG 可以建立双向对话。一个例子是聊天机器人或 `Alexa`。\n\n多年来，一直存在一种将非结构化文本转换为结构化数据供计算机分析的趋势。正如图\
  \ 11.1 所示，NLP 多年来经历了许多不同的模式。\n\n这一成就很大程度上是通过自然语言处理或 NLP 实现的。文本挖掘就像图像分析，是一个需要更高层次理解和投入的特定领域。\n\
  \n我们强烈建议查看资源部分以补充关于 NLP 的知识。Orange 提供了有关我们将涵盖的细节的详细文档。图 11.2 显示了 NLP 如何与 `ML`、`AI`\
  \ 以及计算机科学和语言学相结合。\n\n![](img/image-PBKENNHB.png)\n\n图 11.1 NLP 时间线 ⁴\n\n![](img/image-BWO8JU8H.jpg)\n\
  \n图 11.2 NLP 所在位置\n\n自然语言处理在我们日常生活中无处不在：\n\n* 个人助手：`Siri`、`Cortana` 和 `Google Assistant`\n\
  * 自动补全：在搜索引擎中（例如 `Google`）中完成搜索句子\n* 拼写检查：几乎无处（例如 `Microsoft Word`、`Google Docs`、`Grammarly`）\n\
  * 垃圾邮件检查：（例如 `Gmail`）\n* 机器翻译：`Google Translate`\n* 聊天机器人：客户服务\n* 代码编写：`CoPilot`、`ChatGPT`\n\
  \n在医疗领域，约 70% 的数据是非结构化的或自由文本。其他部门也以非结构化数据为常而非例外，例如客户支持文本、法律文件、社交媒体帖子、新闻报道、博客、在线文章等。非结构化文本无法放入表格或数据库的单元格中；因此，它是不可计算的。在医疗领域，自由文本包括大多数住院和门诊叙述记录、手术记录、放射学和病理报告。在客户支持领域，自由文本的形式为客户支持工单、客户电子邮件、聊天记录以及识别客户情感和问题的社交媒体帖子。\n\
  \n## 11.2 神经网络与 NLP\n\n从历史上看，非结构化文本的首次分析使用了统计方法，如 `logistic regression` 和 `Naive\
  \ Bayes` 将文本分类为类别。随后是机器学习算法，如 `SVM` 主要用于对文本进行分类。最近的进展归功于深度学习或复杂的神经网络。\n\n### 11.2.1\
  \ 循环神经网络\n\n用于执行 NLP 的最早深度神经网络是循环神经网络（`RNN`），它于 2014 年开发，为序列数据或时间序列数据设计。RNN 的独特之处在于在向前移动时会记住之前的值。上一个步骤的输出被馈入当前步骤。这是一个序列到序列模型。在典型的神经网络中，每个隐藏层都与下一层独立，具有不同的权重和偏置。在\
  \ RNN 中，每层具有相同的权重和偏置，因此它们可以合并成单个循环层。此外，大多数神经网络将固定输入映射到固定输出，而 RNN 可以实现一对一、一对多、多对一和多对多的映射。机器翻译使用的是“多对多”\
  \ `RNN`，而情感分析是通过“多对一”完成的，因此只有一个输出，例如“正面评论”。图 11.3 显示了一个多对一的 `RNN`，其中电影评论映射为正面或负面。\n\
  \nRNN 有三种基本架构：`Vanilla`、`LSTM` 和 `GRU`。`Vanilla RNNs` 的问题与梯度有关。梯度是用于更新神经网络权重的值，导致学习。当梯度随时间推移而缩小时，就会发生“梯度消失问题”。如果梯度值变得极小，它对学习的贡献就不大。`LSTM`\
  \ 和 `GRU` 模型不受梯度消失问题的影响。\n\n![](img/image-8UQDMP91.jpg)\n\n图 11.3 多对一 RNN\n\n与 RNN\
  \ 的缺点：\n* 梯度消失问题\n* 训练 RNN 困难\n* RNN 处理较长句子和段落速度慢且准确性较低\n\n### 11.2.2 Transformer\
  \ 和注意力模型\n\n为了克服 RNN 的局限性，Google 在 2017 年开发了 Transformer 和注意力机制。经典文章《Attention is\
  \ all you need》讨论了这一新创新。⁵ 它同时处理所有输入而不是按顺序处理，因此存在“并行计算”，意味着它比 RNN 更高效。此外，Transformers\
  \ 不受消失问题的影响。Transformers 使用位置嵌入（positional embeddings），提供每个元素在序列中位置的信息。所有输入一次性进行预处理，降低了计算复杂度。注意力机制涉及向量乘法，因此根据向量的角度决定重要性。完整的\
  \ Transformer 模型显示在图 11.4 中。最终，生成输出概率。\n\n![](img/image-3FL3KQKR.png)\n\n图 11.4\
  \ Transformer 架构\n\n图 11.5 显示了涉及德语到英语语言翻译任务的编码器和解码器。来自第一个编码器的输入词嵌入被传递给第二个编码器。最后一个编码器的输出被传递给所有解码器。除了自注意力层和前馈层外，解码器还有编码器-解码器注意力层，有助于将注意力放在输入上。这里的输出是将德语翻译成英语。自注意力（Self-attention）是“为了计算序列的表示而将单个序列的不同位置联系起来的机制。”\n\
  \n示例：\n1. 考虑句子“I arrived at the bank after crossing the river。”你希望 Transformer 理解\
  \ bank 指的是岸边而不是银行。Transformer 使用注意力分数将“bank”与句子中的每个词进行比较。因此，river 获得了高注意力分数。注意力分数用作所有词加权平均的。\n\
  2. “The animal did not cross the street because it was tired”对比“the animal did not\
  \ cross the street because it was too wide。”在这里，NLP 必须理解“it”在每个句子中的含义不同。⁶\n\n# 11.3\
  \ NLP 概念\n\n\n\n\n\nNLP 程序通过计算机处理、分析和分类文本数据。“文档”一词在 NLP 中被频繁使用，指的是任何词组或文本体。一组文档被称为\
  \ `corpus`（复数形式为 `corpora`）。这可能包括进展记录、Twitter 推送等。词汇表是语料库中所有单元的列表。文本分类根据内容为文本数据分配类别。有不同的技术从原始文本数据中提取信息并用其来训练分类模型。“老派”方法是一种被称为\
  \ `bag-of-words`（词袋模型）的词嵌入（与简单的机器学习算法使用）。一种较新的方法是使用深度学习神经网络的词嵌入模型。“词或文档嵌入”意味着将词映射到数值多维向量空间，如下文节所示。词嵌入可以具有数百个维度。这也可以被称为“文本表示”或“词向量化”。线性代数实现了这一点。\n\
  \n词袋模型（`BoW`）是一个文档语料库，统计单词在每份文档中出现的次数。它创建了一个矩阵，其中每个词的频率被计数。一种基于词存在或不存在的简单评分模型可以使用布尔值\
  \ `0` 表示不存在，`1` 表示存在。这种编码也被称为“独热编码”。`BoW` 被视为特征提取，因为计算机可以分析数字，而不是原始文本。使用 `BoW` 模型：我们将这两个句子向量化。“患者患有心肌梗死。”“患者胆固醇升高。”向量将如下：\n\
  \n![](img/image-Y9EEN3NI.jpg)\n\n图 11.5 编码器-解码器架构\n\n由于语料库很大，矩阵可能会变得极其巨大，因此在使用 `Bag-of-Words`\
  \ 模型之前通常会有重要的预处理步骤来减小矩阵的大小。这些中的每一个都是 Python 包的功能。\n\n### 11.3.1 NLP 预处理步骤\n\n- **分词（Tokenization）**：是将字符串拆分为单词列表（`tokens`）的过程。标记可以是单词、字符或子词。这通常是为\
  \ NLP 准备文档的第一步。使用语言正则表达式（`regex`）来执行分割。`Regex` 可用于描述搜索模式。分词后，句子“The patient suffered\
  \ an inferior myocardial infarction”被转换为列表{the, patient, suffered, an, inferior,\
  \ myocardial, infarction}。该列表现在代表一个词汇集。\n- **归一化（Normalization）**：我们现在需要将所有单词转换为小写以保持一致。\n\
  - **移除标记中的标点符号**：包括括号、中括号等。还要删除以下内容：URL、HTML 标签、表情符号和数字。\n- **停用词（Stop Words）**：移除对识别文本没有帮助的无关停用词，例如“a”、“and”、“but”、“how”、“or”和“what”。你也可以上传自定义的停用词列表。\n\
  - **词干提取与词形还原（Stemming and Lemmatizing）**：词干提取会将单词还原根：例如，将 cleaning 和 cleansing\
  \ 的词干提取为 `clean`。词形还原会将同义词转换为单个根词：例如，将 automobile、car 和 truck 转换为 `vehicle`。\n-\
  \ **词性标注（POS tagging）****：确定每个词的词性标签（例如：名词、动词、副词、形容词）。\n- **N 元语法（N-grams）**：意味着将句子分解成词组合。例如，“this\
  \ is”是一个双元语法（bigram），而“this is a”是一个三元语法（trigram）。这有助于计算机识别单词的组合。\n\n下面的 `BoW` 表\
  \ 11.1 被称为文档词矩阵（`DTM`）。共现词矩阵（`CTM`）列出了单词在所有句子与其他单词共同出现的次数。每行和每列代表词汇集中的一个词。行和列交叉处的单元格表示这两个词一起出现的频率。一旦单词进入了\
  \ `DTM` 或 `CTM`，就可以使用各种算法。`BoW` 表 11.1 如下：\n\n表 11.1 词袋\n\n![](img/image-NIZMP.jpg)\n\
  \n- **余弦相似度（Cosine Similarity）**：可以将单词或句子投影到多维空间，然后计算它们之间的相似度。\n- **TF-IDF**：词频-逆文档频率衡量词在文档中的频率相对于其在所有文档中的频率。其理念是，在文档中频繁出现但在所有文档中不常见的词更具相关性。\n\
  - **命名实体识别（NER）**：`NER` 将“命名实体”归类到预定义的类别中，它是信息提取的一个子任务。在图 11.6 中，人、组织、金额等已被标记。\n\
  \n### 11.3.2 主题分析\n\n主题分析有两种类型：主题分类和主题建模。\n\n- **主题分类**是监督学习，这意味着你已经知道要预测的类别。人们会在类别上训练模型，然后使用机器学习预测未见过的文档。这基本上是检测垃圾邮件的方法。你可以使用大多数分类算法并评估性能。这是一个\
  \ `SVM` 擅长的领域，`Naive Bayes` 也被常用。\n- **主题建模**是无监督学习，算法发现文档中的新类别。例如，这种技术可能会查看有关护理的患者评论并提取共同主题。常用的算法是潜在狄利克雷分布（`LDA`）和潜在语义分析（`LSA`）。`LDA`\
  \ 为单词排列分配主题，例如与医学相关的 `n-grams` 如左 ventricular hypertrophy。`LSA` 计算词在文档和整个语料库中的频率，并假设相似文档将具有相同的词分布。\n\
  \n## 11.4 大语言模型 (LLMs)\n\n本节将讨论大语言模型的演变，从 Word2vec 开始，它不是 LLM，而是早期嵌入单词的方法。`LLMs`\
  \ 是一个快速发展的话题，据称到 2023 年中期已有 500  `LLMs`。`LLMs` 是“生成式 AI”的示例，文本提示可以产生文本、图像、音乐视频和其他输出。\n\
  \nWord2vec（词到向量）是 Google 开发的一种创建词嵌入的神经网络方法，自 2013 年以来一直存在。除了作为词嵌入方法，它的某些概念在创建推荐引擎方面也非常有效（例如，在文字处理器中推荐单词。“Word2vec\
  \ 是一组用于产生词嵌入的相关模型。这些模型是浅层双层神经网络，通过训练来重建单词的语言上下文。Word2vec 以大型文本语料库为输入产生一个通常具有几百维的向量空间，语料库中的每个唯一词都被分配到空间中的对应向量。”）\n\
  \n\n\n\n\n# BERT \n\nBERT（基于 Transformer 的双向编码器表示）是 Google 在 2018 年开发的一种 NLP 模型。BERT\
  \ 的关键技术创新是将 Transformer（一种流行的注意力模型）的双向训练应用于语言建模。Transformer 会“关注”于预测句子中下一个词时最有用的词。这与此前的尝试（循环神经网络或\
  \ `RNNs`）形成对比，后者是单向查看文本序列，而 BERT 可以进行“双向”分析。`RNNs` 往往会使模型运行速度变慢、准确准确性降低，并且在处理长段落时存在困难。Transformers\
  \ 允许词嵌入的并行化（同时执行多个计算过程）。BERT 模型已在 `Wikipedia` 和 `BooksCorpus` 上进行了预训练，并需要针对特定任务进行微调。因此，它是“半监督学习”的一个示例。BERT\
  \ 的双向编码使其能够确定每个词在序列中的位置，而 `Word2Vec` 嵌入则无法考虑词的位置。\n\n![](img/image-WO07J1PT.png)\n\
  \n图 11.6 命名实体识别\n\n除了 NLP 之外，Transformers 还用于作曲、根据文本描述生成图像、编写代码、预测蛋白质结构以及进行图像和视频分析。Facebook\
  \ 和 Google 都有致力于 Transformers 的团队。BERT 是开源且可下载的\n\n# GPT 和 ChatGPT\n\nGPT（生成式预训练\
  \ Transformer 3）于 2017 年出现 `OpenAI.org`，并在 2020 年修改为 `GPT-3`。`ChatGPT` (3.5) 于 2022\
  \ 年 11 月发布，由一个 Transformer 平台和人类反馈强化学习（`RLHF`）组成。2023 年 3 月发布了 `GPT-4`，它最终将允许上传图像并使用文本提示进行处理。由于隐私考虑，上传图像的功能尚在暂停。此最新版本由\
  \ `ChatGPT` 加上几个视觉基础模型组成。`GPT` 模型在海量信息语料上进行训练，产生了数十亿个参数。它只需要短的指令（`prompts`）即可生成新的文本输出，如故事、短信、网站创建和编程语言。与\
  \ `Bert` 不同，`GPT` 是单向分析文本的，由于其海量的预训练，它所需的训练数据较少。\n\n`GPT-3.5` 和 `GPT-4` 发布了应用程序编程接口（`API`），因此多家软件公司正在使用该平台。`ChatGPT`\
  \ 提供免费版和订阅版产品。`OpenAI` 还发布了可以辅助编程的 `CoPilot` 以及可以从文本创建图像的 `DALLE-E2`。\n\n# 业务应用与局限性\n\
  \n目前 `LLMs` 的三个业务应用是聊天机器人、内容创作和代码助手。新的应用不断出现。`ChatGPT` 插件的加入将扩展 `LLMs` 在多个领域的用途。截至\
  \ 2023 年 5 月，已识别出 735 个插件。\n\n许多人尝试过使用 `ChatGPT` 处理医学问题，总体结果良好。然而，有几点提示值得注意：\n\n\
  * 模型训练于于 2021 年 9 月的时间范围内，因此无法获取更近期的信息。\n* 模型可能会产生“幻觉”或提供看似合理但错误的信息。\n* 不提供参考文献。根据请求，`ChatGPT/GPT-4`\
  \ 会生成参考文献，但这些也可能是幻觉产生的。\n* `LLMs` 并不总是给出一致的答案。基于同一个 `prompt` 的答案可能会随时间而改变。\n* 关于\
  \ `LLMs` 的短期和长期成本有很多问题。\n* 已经提出了许多法律问题。\n* 存在隐私担忧。\n* 考虑到 `LLM` 训练的大多数医学数据反映了白人多数的人口，因此存在关于偏见的担忧。\n\
  \n截至 2023 年年中，两个包含参考文献的 `GPT-4` `LLMs` 包括：`Perplexity AI` 和 `Bing Chat`。这提供了更高的置信度或信任水平，因为可以检查。\n\
  \n存在一个运动，让 `GPT-4` `LLMs` 包含参考文献。这被用于医疗领域辅助诊断、治疗和各种行政任务。\n\n## 1.4.1 文本生成图表\n\n\
  语言模型被用于医疗领域辅助诊断、治疗和各种行政任务。然而，有各种担忧，如下：\n\n一个有趣的用例是创建复杂的图表。11.7，“纽约市有五个区：曼哈顿、布鲁克林、皇后、布朗克斯和史丹岛。”\n\
  \n![](img/image-0AMBC5.png)\n\n图 11.7 来自医疗文本的图表\n\n![](img/image-147ZM80L.png)\n\
  \n图 11.8 来自非医疗文本的图表\n\n## 1.4.2 代码助手\n\n`ChatGPT` 和 `GPT-4` 提供代码辅助。`ChatGPT` 还有一个名为\
  \ `Code Interpreter` 的插件，可以辅助 `Python` 编程。它可以处理高达 100MB 的大文件。其他 `LLMs` 还可以使用 `R`\
  \ 和 `SQL` 编程。虽然它们非常有用并可以提高效率，但有时会产生错误的结果。例如，使用大模型 `Claude AI` 创建了一个使用逻辑回归预测心脏病的模型。尽管编程语言、数据集和算法与\
  \ `Orange` 使用的相同，但其在测试数据上的结果差得多。\n\n## 11.5 小语言模型 (SLM)\n\n\n\n\n\n小语言模型是指参数数量相对于大语言模型较少的\
  \ AI 模型。虽然大语言模型（如 `GPT-3`）拥有数十亿甚至万亿个参数，但小语言模型的设计旨在更加紧凑且节省资源。\n\n由于以下几个原因，小语言模型的趋势受到了广泛关注：²⁵-²⁶\n\
  \n- **性能与效率**：研究表明，在某些任务中，较小的语言模型可以实现与其较大的模型相当甚至更优的性能。较小的模型在计算资源、内存使用和推理速度方面更高效，使其部署更易于实现且更具效益。\n\
  - **专门化用例**：小语言模型可以针对特定的用例或领域进行定制，从而提供更专注、更高效的性能。通过在较小的数据集上训练或针对特定任务进行微调，开发者可以创建针对特定应用程序优化的模型，从而提高准确性和相关性。\n\
  - **扩展性与部署**：小语言模型通常具有更强的扩展性，适用于部署在边缘设备或资源受限的环境中。它们可以在计算能力有限的设备上运行，能够在不严重依赖云基础设施的情况下实现实时或离线推理。\n\
  - **环境影响**：大语言模型需要大量的计算资源，导致较高的能量消耗和环境影响。小语言模型提供了一种更具可持续性的替代方案，减少了与 AI 模型训练和部署相关的碳足迹。\n\
  - **数据效率**：小语言模型可以使用较小的数据集进行有效训练，适用于标注数据有限的场景。这在数据收集或标注具有挑战性或昂贵的领域可能特别有益。\n\n小语言模型的开发和探索旨在性能、效率和实用性之间取得平衡。虽然大语言模型展示了惊人的能力，但小语言模型在资源利用、定制化和可持续性方面具有优势。小语言模型的持续研究和进步不断塑造着\
  \ AI 语言处理的格局。\n\n## 11.6 ORANGE NLP 插件\n\n在了解上述 NLP 背景后，让我们通过介绍几个重要的组件来探索 Orange\
  \ 提供的功能。\n\n### 11.6.1 文本文档组件\n\n ** **Corpus（语料库）**：五个五个加载的文本文档供挖掘。要进行可视化，请使用 `Corpus\
  \ Viewer` 组件。\n- **Import Documents（导入文档）**：一种用于上传挖掘文档的方法。\n- **The Guardian（卫报）**：一种新闻资源。\n\
  - **NY Times（纽约时报）**：一种新闻资源。\n- **PubMed**：可以请求医学期刊文章或摘要文本。\n- **Twitter**：用于挖掘的\
  \ Twitter Feed 馈。\n- **Wikipedia（维基百科）**：用于挖掘的百科全书信息。\n\n## 11.6.2 Preprocess Text（文本预处理）组件\n\
  \n该组件通过应用以下步骤为挖掘准备好文档：\n\n- **Transformation（转换）**：可以转换为小写、删除重音、解析 html（仅保留文本）并移除\
  \ urls。\n- **Tokenization（分词）**：默认是 `Regexp`（正则表达式语言），设置为 `/\\w+/`，意味着拆分为单词（不含标点符号）。其他选项包括：按单词分割并保留标点、按空格分割文本、按完整句子分割句子，以及保留话题标签和表情符号的\
  \ `Tweet` 模式。\n- **Normalization（归一化）**：应用词干提取（stemming）。默认是 `Porter Stemmer`。\n\
  - **Filtering（过滤）**：可以在此处删除停用词，并使用 `Regexp` 删除标点符号。还可以上传停用词列表。通过文档频率，可以根据频率保留标记，最频繁的标记意味着保留频率最高的标记，默认为\
  \ 100 个。\n- **N-grams Range（n-gram 范围）**：默认是 1-2，意味着 1-2 个单词。可以修改。\n- **POS Tagger（词性标记器）**：标记例如动词、名词等。默认是平均感知器标记器。\n\
  \n## 11.6.3 Document Embedding（文档嵌入）组件\n\n- 该组件使用预训练的 `fastText` 模型将文档转换为向量。它将 n-grams（单词）聚合为向量。它已针对\
  \ 157 种语言。\n- 必须选择 `Language (English)`，默认聚合方式为平均值（mean）。\n- 主要用于文档/文本分类。\n- 将 `Corpus`\
  \ 组件连接到 `Document Embedding` 组件，然后连接到 `Data Table` 组件。\n\n## 11.6.4 Bag of Words（词袋）组件\n\
  \n- 使用以下选项创建词向量：\n\n![](img/image-TEMD15Y1.jpg)\n**Term frequency（词频）**：计数是单词出现的次数。Binary（二进制）意味着单词是否出现在文档中。Sublinear（亚线性）意味着词频的对数。\n\
  \n![](img/image-TEMD15Y1.jpg)\n**Document frequency（文档频）**：可以无（none）或 `IDF`（逆文档频率）。\n\
  \n![](img/image-TEMD15Y1.jpg)\n**Regularization（正则化）**：设置为 none、`L1`（将向量长度归一化为元素之和）或\
  \ `L2`（欧几里得），后者将向量长度归一化为平方之和。\n\n![](img/image-TEMD15Y1.jpg)\n配合 `Word Enrichment`\
  \ 组件使用\n\n## 11.6.5 Topic Modeling（主题建模）组件\n\n- 该组件根据每个文档中发现的词簇及其频率发现语料库中的抽象主题。\n\
  - 自然语言处理（NLP）中常用的降维和主题建模算法是 `Latent Semantic Indexing (LSI)`（潜在语义索引）和 `Latent Dirichlet\
  \ Allocation (LDA)`（隐含狄利克雷分布）。Orange 中提供了 `LDA`。`LDA` 是一种概率生成模型，它为文档分配主题，为主题分配单词。\n\
  \n# 11.7 将知识付诸实践\n\n第一步是通过进入顶部菜单中的 options >> Add-ons >> Text 来下载 Orange 文本挖掘库。此步骤将下载所需的各种组件。\n\
