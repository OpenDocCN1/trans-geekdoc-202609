  ## 2.8 JASP 数据功能\nJASP 的主要优势在于描述性和高级统计、数据转换、数据可视化以及机器学习。JASP 的数据表和可视化将在第 3 章中讨论。\n\
  \n## 2.9 将知识付实践\n\n### 2.9.1 练习\n处理不同大小、数据类型和复杂程度的多个数据集经验是不可替代的。无论选择何种数据科学软件，练习和重复分析任务对于巩固所需的专业水平至关重要。对于本次练习，我们将使用一个来自\
  \ Kaggle 的数据集，该数据集查看了 2020-2023 年全球的数据科学薪资。该数据集存档在 File-Share 网站的第二章文件夹中，有关数据的更多信息可以在\
  \ Kaggle 上找到。\n\n以下示例概述了对该数据集进行分层和分析时应遵循的逻辑步骤顺序。这些程序旨在高效地将数据集简化为仅包含经常出现类别的子集。这为高度针对且精确的分析简化了准备过程。\n\
