  \ 7 个模型指标：`RSME`、`MAE`、`MAPE`、`POCID`、`R-Squared`、`AIC` 和 `BIC`。\n\n8. 图 8.4 显示了默认参数生成的\
  \ 24 个月预测，其中包含非常宽的概率预测锥，我们将通过尝试实验来改进它。\n\n现在我们开始 ARIMA 建模中枯燥的实验尝试阶段，以改进初始模型性能。我们并不是像之前的建模练习那样尝试不同的算法，而是仅对\
