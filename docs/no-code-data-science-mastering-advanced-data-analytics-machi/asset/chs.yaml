  \n图 2.4 标量、向量、矩阵和张量（由 dev.to 提供）\n\n![](img/image-7CHPOUF8.jpg)\n\n图 2.5 数据科学 DISCOVER\
  \ 过程中的第 3 步\n\n### 2.2 数据科学过程中的第 3 步\n\n图 2.5 显示了更新后的 8 步 DISCOVER 过程，在我们介绍数据科学过程细节时，显示我们目前在书中的位置。\n\
  \n数据科学 DISCOVER 过程第 3 步：“清洗、清理、转换、特征工程、哑编码和检查多共线性（VIFs）”。这些看似平凡的任务是成功的关键也是避免预测模型失败的关键。这些活动涵盖了数据整理、预处理和特征工程等广泛主题。\n\
  \n此步的关键任务包括：\n\n1. 识别预测的目标变量\n2. 修正数据问题和错误\n3. 识别并处理可疑的异常值\n4. 确保有足够的数据用于训练和测试划分、`k-fold\
  \ 交叉 validation`或其他划分方法\n5. 在需要时考虑合成更多数据，同时避免过拟合\n6. 添加新的计算或提取的特征\n7. 在适当时考虑分箱（binning）\n\
  8. 实现数据泄露防护\n9. 使用 `SMOTE` 等方法处理类别不平衡\n10. 检查缺失数据的随机性\n11. 决定缺失数据的插值填补策略\n12. 考虑各种数据转换、归一化、标准化\n\
  13. 对分类变量使用 `n-1` 哑编码\n14. 使用方差膨胀因子 (`VIFs`) 测试多共线性\n15. 应用正则化技术\n16. 评估是否需要使用 `PCA`\
  \ 进行降维\n17. 验证改进后数据集的准确性、一致性和可用性\n18. 规划化的数据科学实验以优化模型性能\n\n#### 2.2.1 数据清洗\n\n-\
  \ 评估数据结构——是什么格式？`.CSV`、`.XLSX`、`.JSON` 等？\n- 清理日期相同吗？性别记录相同吗？缺失值是如何记录的（空白、零、`NaN`）？电话号码、邮政编码等是否统一？变量是否全小写？标题名称是否有空格？是否需要移除标点符号、`html`\
  \ 等？\n- 数据验证——可以使用 Microsoft Excel 和其他工具使用规则阻止错误输入 Orange。¹⁶\n\n•图 2.6 显示了一个需要清理的数据示例。此电子表格包含了人口统计描述和箭头指示的问题。\n\
  \n![](img/image-MQFZ1AC6.png)\n\n图 2.6 脏数据\n\n#### 2.2.2 什么是特征工程？\n\n浅层的数据分析方法很容易导致任何根因分析、统计分析、精益六格玛努力、预测分析和\
  \ AI 项目失败。严谨且彻底的特征工程是将表面分析转化为深入、特定且具有见地的分析的集体任务的一部分。特征工程描述了预测变量（特征）的转换，以匹配机器学习算法的要求，从而提高模型性能。特征工程需要领域知识来完全理解数据集¹⁷有些人使用特征工程术是指转换、构建或减少模型预测变量；其他人将其等同于任何可能提高模型性能的数据处理。以下是特征工程的常见示例，通常需要领域知识：\n\
  \n- 连续变量的数学转换和重新缩放\n- 提取星期几、小时等特定时间数据并将其作为新特征添加\n- 创建代表和、平均值、比例或其他特征减法的新特征\n- 连续变量的分箱\n\
  - 将文本转换为数值数据\n- 将文本聚类为分析用的组\n- 使用 `one hot` 或 `n-1 哑编码` 将分类变量转换为数值，以便算法理解其显著性\n\n\
  #### 2.2.3 使用插值或删除处理缺失数据\n\n\n\n\n处理缺失数据实际上有三种通用方法：什么都不做、对缺失数据进行插值、或者删除缺失的行和/列。缺失数据是几乎任何数据集都会出现的问题，因此必须制定策略来处理它。通常的做法首先是在电子表格中查看数据。是否存在空白单元格或包含问号、零、NA\
  \ 等单元格？在 `Orange` 中，缺失数据的总百分比记录在 `File` 小部件中，每列的缺失百分比记录在 `Feature Statistics` 小部件中。\n\
  \n处理缺失值非常重要，原因有几点。与简单的决策树和集成树不同，`random forest`、`neural networks` 和 `SVM` 等不能很好地处理缺失数据¹¹⁸\
  \ 对缺失值不做任何处理可能会导致模型准确性问题。\n\n**关键点**：应该在将数据拆分为 `train/test` 后再处理数据，以避免数据泄露，数据泄露会导致性能过于乐观的模型。你不应该对\
  \ `test` 数据进行缺失值插值，而应在 `training` 数据上进行。该规则唯一的例外是小型数据集，由于模型无法在如此小的训练数据集上学习，将数据拆分为训练和测试数据集是不切行的。在这种情况下，应该使用\
  \ `k-fold cross-validation` 而不是训练和测试数据拆分。如果你不将数据拆分为训练和测试集而仅使用训练结果进行决策，将面临未测试模型可能过于复杂且过拟合数据的高风险¹⁹-²⁰\n\
  \n处理缺失数据的常用策略是首先将其分类如下：\n\n*   `完全随机缺失 (MCAR)`：无论变量如何，缺失数据中都没有某种模式。例如，调查问卷结果在邮寄过程中丢失了。这意味着丢失原因与数据无关，并且可能随机发生在任何患者或客户身上。²¹\n\
  *   `随机缺失 (MAR)`：缺失数据中存在某种模式，但这种模式与结果无关。例如，在调查中，女性包含体重的频率不如男性那么高。在这种情况下，进行插值是合理的。²¹\n\
  *   `非随机缺失 (MNAR)`：存在会影响结果的模式。因此，删除缺失值可能会影响模型的结果。需要进一步研究以寻找原因等。假设缺失数据存在某种隐藏原因。在这种情况下，通常可以通过比较特定属性的所有缺失数据与非缺失数据对目标变量的影响，在统计学上进行识别。如果这两类之间的差异具有统计学意义（`p-value\
  \ < 0.05`），则缺失数据不是随机的，应考虑基于模型的插值。²¹\n\n##### 2.2.3.1 插值\n\n插值意味着用值替换缺失数据。某些算法不容忍缺失数据，因此必须决定删除某些受体，还是使用数值数据的\
  \ `mean`（平均值）、`median`（中位数）、分类数据的最常见类别、随机值、基于模型的值，以及 `Impute` 小部件中显示的其他选项（如图 2.8\
  \ 所示）对缺失数据进行插值。如果有替代方案，应尝试不要删除任何数据。插值错误的值会对模型有害。`Orange Impute` 小部件提供了许多人认为是数据插值方法金标准的方法：`Model-based\
  \ Imputation`（基于模型的插值）。²² `Orange` 中的 `Model-based Imputation` 构建了一个用于预测缺失数据的模型。\n\
  \n（注：原文后续部分存在大量重复段落，已按要求去重并保留核心翻译内容。）\n\n\n\n\n• 可以使用免费的在线 K-S 计算器来计算该检验的 p 值。在将数据粘贴到\
  \ K-S 检验计算器的所需字段时，请确保已删除数据列标签，并消除了缺失数据列中数字之间所有的空格。这可以通过在将数据复制并粘贴到计算器字段之前，简单在 Excel\
  \ 中对该数据列进行排序来实现。²⁵\n\n##### 2.2.4 处理异常值\n\n与缺失数据一样，异常值也必须经过仔细检查。可视化是一个很好的起点。异常值是任何超出既定模式的数值，但同时也存在更正式的规则。例如，某些人定义，如果一个值低于第一分位数减去四分位距（`IQR`）乘以\
  \ `1.5` 或高于第三分位数加上 `IQR` 乘以 `1.5`，则为低异常值。²⁶ 另一些人将 `IQR` x `1.5` 限制称为“内边界”以及“轻微异常值”的开始，并将\
  \ `IQR` x3 称为“外边界”以及“极值异常值”的开始。²⁷ 图 2.11 显示了 JASP 如何在箱线图上使用 `1.5 x IQR` 定义识别糖尿病数据集中葡萄糖数据的异常值。该图还显示了该葡萄糖变量的关键描述性统计数据以及带有异常值位置的分布图。\n\
  \n还有人认为，高于或低于 3 个标准差的值应该应被视为异常值。这通常在统计过程控制 (SPC) 图表上显示。\n\n![](img/image-O40FWFN2.jpg)\n\
  \n图 2.11 箱线图和分布图上的异常值识别\n\n可以使用以下命令字符串在 JASP 中计算描述性统计：\n\n```\nDescriptive Statistics\
  \ > select variables > Statistics > check desired stats\n```\n\n可以使用以下命令字符串在 JASP\
  \ 中创建箱线图：\n\n```\nDescriptive Statistics > select variables > Customizable plots\
  \ > check Box Plots and Box Plot elements\n```\n\n可以使用以下命令字符串在 JASP 中创建分布图：\n\n\
  ```\nDescriptive Statistics > select variables > Basic plots > check: Distribution\
  \ plots, display density, and Display rug marks. (注意：Rug marks 显示数据集中每个值的刻度线)\n\
  ```\n\n![](img/image-1O4P9U1E.png)\n\n图 2.12 用于发现潜在数据输入错误的可视化工具\n\n异常值的存在引发了许多问题。人们可能会问这是实验室错误、测量误差、数据输入错误还是有效的异常值。虽然决策树、支持向量机\
  \ (SVM) 和 k-最近邻可以容忍异常值，但其他算法对异常值敏感。将数据转换为正态分布可以减少它们对特定算法造成的干扰。决策树可以处理异常值，因为分区是基于拆分内样本的比例，而不是基于绝对值。k-最近邻算法查看数据点之间的接近性，因此不考虑异常值。在分析项目的特征工程阶段，识别、纠正和删除明显的数据输入错误是非常重要的。\n\
  \n只有在所有异常值都被指定为错误时，才建议删除数据集中的所有异常值。使用可用的分类变量对数据进行分层，以查看异常值是否有解释。为了让预测模型看起来更好而删除不方便的数据（异常值）是不够明智且短视的。当出现测量异常值时，分析师应该寻找之前的测量结果，这些结果可能显示相似的结果，或强烈暗示异常值是错误。所有其他合法的异常情况都可以在建模迭代过程中处理，在过程中应对建模残差和异常值的影响进行进一步分析。如果确定应该删除异常值，JASP\
  \ 在数据的电子表格视图提供了过滤选项，可以根据构建的自定义方程进行删除。\n\n[图 2.12 显示了上述提到的六种数据可视化图，这些图可识别糖尿病数据集中可疑的数据异常值（用框表示），这些异常值可能是数据输入错误。在许多\
  \ Orange 图表中，你可以悬停在图表中的特定数据点以查看其精确值，同时考虑这些数据点是否是不现实且明显的数据输入错误。患者被标记为糖尿病，如果那些数据点是不现实且明显的数据输入错误。注：此处修正了原句逻辑，为：这些图可用于识别糖尿病数据集中可疑的数据异常值（用框所示），这些异常值可能是数据输入错误。在许多\
  \ Orange 图表中，你可以悬停在图表中的特定数据点以查看其精确值，同时考虑这些数据点是否是不现实且明显的数据输入错误。患者被标记为糖尿病，如果那些数据点是不现实且明显的数据输入错误。图\
  \ 2.13 显示了用于识别异常值的设置。]\n\n[图 2.13 显示了用于识别异常值的设置。] Orange 有一个异常值插件位于无监督学习模块。一旦你识别了异常值，该插件可以删除它们。使用\
  \ `Local Factor`，`contamination=10%`, `Metric=Euclidean`。\n\n1. 一类 SVM 使用非线性内核 (`RBF`)：将数据分类为相似或不同。\n\
  \   - `Nu` 是训练误差的上界。`默认 50%`\n   - 内核系数 `gamma` 指定单个实例的影响力。`默认 0.01`\n   - 适用于非正态分布数据\n\
  \n2. 协方差估计器：拟合中心点。\n   - 支持比例指定包含的比例。`默认 1.0`\n   - 仅适用于正态分布数据\n\n3. 局部异常因子：从最近邻获取局部密度\n\
  \   - `LOF` 是一个 Python 包\n   - `Neighbors` 代表邻居数量\n   - `Metric` 是距离量\n\n4. 隔离森林：通过随机选择特征，然后随机选择该特征最大值和最小值之间的分割值来隔离观测值。\n\
  \   - 可重复训练固定随机种子\n   - 适用于高维数据\n\n某些尝试表明。使用 Kaggle 国家数据集和四种方法，异常值的数量各异。图 2.14 显示了分箱为\
  \ `0.1` 的税率分布。使用 `isolation forest` 方法后，分布更加正态，如图 2.15 所示。\n\n##### 2.2.5 分箱 / 离散化\n\
  \n• 分箱化操作也称为分桶和分区。这些操作可以应用于数值和分类数据。例如，数值实验室测试结果 `21-40` 可以被标记为低，`41-60` 为中等，`61\
  \ 到 80` 为高。分类数据可以如下分箱：癫痫、中风和短暂性脑中血 >> 神经内科；心肌梗死、心绞痛和心力衰竭 >> 心血管科。分箱应谨慎使用，因为结果可能会减少一些有用的信息。\n\
  \n![](img/image-TEMD15Y1.jpg)Orange 通过三个不同的插件提供分箱/离散化选项：\n\n![](img/image-IMR0T3RY.jpg)Mosaic\
  \ Display 插件对连续变量自动分箱为等频率分箱。Mosaic 显示的宽度代表该箱中数据的频率计数。可以创建多个变量 Mosaic 图，但当包含的因素数量增加时，它们的解释性往往会降低。\n\
  \n```\n双左击 `Preprocess` 插件 > Select Discretize Continuous Variables (离散化连续变量) >\
  \ 选择 4 个选项之一。\n```\n\n\n\n\n\n![](img/image-IMR0T3RY.jpg)在 `Discretize` 小部件上双左击\
  \ > 选择许多不同选项之一。\n\n`Discretize` 小部件中的分箱（Binning）选项比 `Preprocess` 小部件中的 `Discretize`\
  \ 选项提供了更多自定义选项。\n\n### 分箱的目标\n- 提高对数据的洞察力\n- 通过将数值数据分箱到预定义的数据范围内来提高模型性能\n- 通过确定数据中的理想切分点来提高模型性能\n\
  \n决策树通过确定最佳切分点和分箱自动实现这一点，从而最大化模型通过这些数据划分或分类所获得的信息增益.³⁰ 然而，分箱代表了原始信息的损失，优化分箱的目标是在信息损失和分箱数量之间建立最佳平衡.³¹\
  \ 分箱操作可以在“Preprocess”或 `Discretize` 小部件中进行，如果之前连接的小部件是 `Select Columns`，则效果最好，这样\
  \ `Y` 和 `X` 变量就能良好定义。\n\n### 分箱的优点\n- 它可以根据普遍接受的类别对数值数据进行分箱，例如根据 CDC 接受的体重指数 (BMI)\
  \ 数据分为体重不足、正常体重、超重和肥胖类别。³²\n- 它可以创建对分析师、研究人员和信息消费者意义的自定义分箱。\n- 熵-MDL（最小描述长度）离散化方法或分箱可以最大化数据集或模型的信息增益，但它们只能用于分类结果。\n\
  - 如果分类结果的熵-MDL（最小描述长度）离散化方法感知到 `x` 变量没有可能的信息，它将不会划分该变量。它将被标记为数据集或模型的“单值”信息增益，但它们只能使用。\n\
  \n### 分箱的缺点\n- 当分析师在特征工程阶段独立执行此任务时，他们面临降低分析或模型信息增益的风险。\n- 划分或分箱往往只是被选作方便讨论的话题，例如跨度为\
  \ 10 年的的年龄组，而不是为了信息增益而进行优化。\n\n图 2.16 显示了 `Preprocess` 小部件中可用的分箱选项。\n\n以下数字对应图 2.16\n\
  \n1. 由 Fayyad 和 Irani 提出的熵-MDL 离散化，通过其建议的分箱端点优化信息增益。此功能自动确定每个划分的最佳数量和位置。仅在 `Y` 变量为分类变量时使用。\n\
  2. 等频离散化按频率划分分箱，并在每个箱中创建相同数量的实例。\n3. 等宽离散化创建等宽的分箱。\n4. 完全移除数值特征。\n\n图 2.17 显示了 `Discretize`\
  \ 小部件中可用的分箱选项。\n\n#### Discretize 小部件选项\n1. 等频离散化按频率划分分箱，并在每个箱中创建相同数量的实例\n2. 等宽离散化创建等宽的分箱\n\
  3. 保留数值\n4. 由 Fayyad 和 Irani 提出的熵-MDL 离散化，通过其建议的分箱端点优化信息增益。仅在 `Y` 变量为分类变量时使用\n5.\
  \ 完全移除数值特征\n6. 可以选择手动选择的切分点\n7-14. 这些选项允许为每个属性单独设置单个属性设置\n\n![](img/image-3AWW2BSG.jpg)\n\
  \n图 2.16 Preprocess 小部件分箱选项\n\n![](img/image-ZD54DAE3.jpg)\n\n图 2.17 Discretize\
  \ 小部件分箱选项\n\n![](img/image-31HNCFZ2.jpg)\n\n图 2.19 前三大糖尿病风险因素排名\n\n分箱不应是一个随机且不可重复的活动，而不应轻视。在查看\
