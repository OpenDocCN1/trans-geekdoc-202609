  \ - `C2 = malignant`）。打开散点图，X 轴选择 `Unif_Cell_Size`，Y 轴选择 `Unif_Cell_Shape`。`Color\
  \ = Cluster`。`C1` 和 `C2` 分离良好吗？当你按 `Type` 着色时，注意散点图保持基本不变，这表明 `Cluster 1 = benign`\
  \ 且 `Cluster 2 = malignant`。尝试不同的变量组合或选择 `FInd Informative Projections` 查看哪些变量具有良好的分离度。接下来，打开\
  \ `Distributions` 小部件，变量选择为 `type`，并设置 `Split by = Cluster`。你看到了什么？你确认了 `C1` 是良性的，`C2`\
