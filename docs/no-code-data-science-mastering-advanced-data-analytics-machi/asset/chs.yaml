  \n# 第 12 章 将持续改进与数据科学集成到工业 4.0\n\n“我们所做的无法改变过去，但我们所做的的一切改变未来” —— Ashleigh Brilliant\n\
  \n## 学习目标\n\n在阅读第十二章后，读者将能够：\n\n- 理解工业 4.0、服务 4.0、制造业 4.0、医疗 4.0、质量 4.0、数据科学 4.0\
  \ 和创新 4.0 的核心组成，这些目标只有通过领导力 4.0 实现。\n- 理解如何选择与您的特定行业 4.0 目标匹配的最佳持续改进 (CI) 技术。\n\
  - 理解何时单独应用或作为混合团队应用 CI 技术以实现特定目标。\n- 理解各种 CI 技术与数据科学的集成机会，以优化其加速业务结果的能力。\n- 意识到追求任何\
  \ 4.0 倡议可能需要大幅偏离目前的舒适区和“惯常”假设，并引入预测性分析和 AI。\n\n## 第 12 章总结\n\n\n\n\n\n# 工业 4.0，也被称为第四次工业革命，是一个描述将智能数字技术集成到制造和服务流程中的术语。工业\
  \ 4.0 的成功超越了部门之间和改进计划之间的传统界限，要求卓越的创新、数据科学精通、尖端持续改进技术、受启发的领导力、稳健风险管理以及敏捷按需创新系统进行无缝融合。这种复杂相互作用的核心在于由高性能工作文化支撑的坚实战略计划。这种环境不仅仅赋予了员工权力；它点燃了他们的热情，激励他们成为超越性、令人兴奋且真正突破性事业的不可或缺的一部分。本章将讨论各种持续改进技术如何与预测性分析具有整合潜力，这种整合定义了满足工业\
  \ 4.0 需求所需的下一次演进步骤。\n\n### 核心原则\n\n- 向工业 4.0 的成功转型不仅关乎积累必要的各种技能和技术。它同样需要广泛的非技术方面，包括文化适应性、员工激励、战略规划和领导力洞察。\n\
  - 对于向工业 4.0 的成功演进，软技能和管理能力与技术熟练程度同等重要。\n- 为了实现工业 4.0 目标，所有业务流程和持续改进技术必须嵌入预测性分析元素和\
  \ AI 组件。\n- 随着组织朝着工业 4.0 目标努力，所有员工获得某种水平的新数据科学技能以应对这一不断变化的格局变得至关重要。\n- 工业 4.0 无法通过一系列标准的行业最佳实践来实现，而是通过整合不断进化、适应的策略，这些策略反映了技术和创新不断变化的格局。\n\
  \n## 12.1 引言\n\n在本章中，我们的关注点在于这样一个观点：数据科学、预测分析和 AI 虽然强大，但无法孤立地发挥它们的全部潜力。只有当以极大的谨慎、纪律追求这些技术，并将其协同整合到一项多方面的战略企业努力中时，才能实现成功，这种努力必须匹配、甚至超过其寻求整合的\
  \ AI 的智能水平。AI 有潜力提升和加速持续改进努力的许多方面，特别是涉及人类头脑风暴的部分。通过适当的治理、精心策划的输入、有效的过滤和提示词工程的应用，AI\
  \ 聊天机器人可以在几秒钟内提供价值见解。这种见解的快速生成可以超过并往往超越典型的人类主导头脑风暴会议的不一致质量。\n\n在现代 AI 的快节奏世界中，快速变化不仅是必要的，更是生存的命脉。AI\
  \ 的演进如此迅速，昨晚被认为是尖端的技术第二天早上可能就已经过时了。这种加速转型不仅需要传统的 CEO 领导力，还需要由“领导力 4.0”概念引导的远见卓识升级。一个在工业\
  \ 4.0 中航行的 CEO 可以被恰切地称为首席企业演进官（CEEO）。这一创新角色不断要求适应我们日益互联连接的世界中技术和人工智能的快速演进。\n\n在持续不断的颠荡中航行，工业\
  \ 4.0 领导力需要成为一个永恒的希望灯塔，提供加速的敏捷性，以适应不仅按年度、而且按每周演化的重大 AI 创新。在这个新时代，由于 AI 的快速发展，最优雅、最有说服力的年度战略计划可能在短短一周内过时。因此，战略规划必须从静态的年度活动转向动态的持续过程。\n\
  \n领导力 4.0 超越了引导战略转型和驱动创新。它必须在所有团队中培养一种永恒改进的文化，确保组织在今天保持敏捷、韧性并做好未来准备。在 CEEO 的掌舵下，组织不仅仅是对做出做出，而是领先一步，在不断变化的业务格局中塑造未来并开辟出定制的利基。CEEOs\
  \ 并不等待他们最有创造力的员工最终创造突破，他们拥有 AI 加速的按需创新团队，这些团队不断将混乱、动荡和障碍转化为他们自己的机会和行业颠覆。然而，深入研究\
  \ AI 面临着巨大的风险，必须以极其谨慎的态度进行。在数据科学过程中走捷径可能会导致意想不到的后果，使你的 AI 项目可能成为“耻辱墙”上一个令人遗憾的特征，而\
  \ AI 事件跟踪器正热于公开这些内容。¹-² 因此，一种非常深思、细致且有纪律的 AI 方法是不可忽视的。\n\n[图 12.1 显示了 CEEO 应该创建并领导的团队，以驱动战略转型和创新，满足工业\
  \ 4.0 的挑战性需求。这些团队代表了持续改进方法的组合，在 AI 的帮助下，这些方法的性能被增强到了超出标准水平的，以应对工业 4.0 的激进目标。本章将涵盖更多支持细节。]\n\
  \n![](img/image-7988OA1T.jpg)\n\n图 12.1 实现工业 4.0 目标所需的支持团队与协作\n\n图 12.2 展示了实现工业\
  \ 4.0 目标的组织成熟金字塔。它从基础的关键技能开始，向顶点更复杂的技能。这个金字塔整合了技术能力、管理技能、持续改进计划和风险管理，主张采取整体方法进行工业\
  \ 4.0 转型。\n\n其他作者同样强调了将非技术能力与技术能力和谐融合的必要性。这种能力的结合显著提高了工业 4.0 活动成功的可能性。³-⁴\n\n持续改进（CI）技术不仅是工具，更是变革的催化剂，需要不断进化和适应，以应对企业超越市场挑战挑战所需的变革。CI\
  \ 方法需要定期进入自我诊断模式，以确保它们能够满足当前的挑战，也能满足工业 4.0 的要求。例如，简单的 SWOT（优势、劣势、机会和威胁）分析技术应该进入“对\
  \ SWOT 分析进行 SWOT 分析”的自我诊断模式，以探索加速这一常用工具性能的机会。SWOT 示例将在本章稍后部分详细讨论。顶级 CI 方法因其加速问题解决和目标实现的能力脱颖而出，超越了仅仅“照常营业”策略。个人和混合\
  \ CI 技术应作为动态加速器，将组织推向成功的快速通道。\n\n## 12.2 行业和部门 4.0 计划\n\n生产商品和提供服务是主导全球经济的两个部门。⁵-⁶\
  \ 这两种追求正在经历一场被称为工业 4.0 的变革，这种变革将服务行业变为服务 4.0、医疗 4.0 以及其他专业领域，并改变制造物品的行业（制造 4.0）。⁷\
  \ 以下是若干 4.0 计划的细节：\n\n![](img/image-1D0PR5GO.jpg)\n\n图 12.2 实现工业 4.0 所需的分层组织成熟技能\n\
  \n\n\n\n\n# 工业 4.0 及其演变\n\n- **工业 4.0**：工业 4.0 的概念起源于 2011 年的汉诺威博览会，并由德国政府于 2013\
  \ 年正式宣布为德国的战略计划，旨在确保德国在其制造业处于领先地位。信息物理系统、物联网、大数据、3D 打印、机器人、仿真、增强现实、云计算和网络安全是工业 4.0\
  \ 首次引入时的九大支柱。⁸ 工业 4.0 被视为一种突破性的进展，旨在显著提高生产率，而许多企业仍处于实施早期阶段。⁹\n\n- **制造 4.0**：制造\
  \ 4.0 旨在构建一个互联制造系统的复杂网络，这些系统可以交换信息、分析信息并利用信息触发智能的物理世界行为。包括工业物联网网络、人工智能、大数据、机器人和自动化在内的关键技术正引导着这一数字化转型。¹⁰\n\
  \n- **服务 4.0**：服务 4.0 的主张者认为，这是服务提供者提高效率和效果的重大机会，也是服务消费者学习并获得此前无法获得的新能力的机会。¹¹\n\n\
  - **医疗健康 4.0**：该术是指医疗保健领域的第四次工业革命，它整合了数字技术、人工智能和大数据，以增强医疗服务及其成果。通过利用技术改进患者护理、降低成本并提高效率，医疗健康\
  \ 4.0 寻求改善医疗结果。医疗健康 4.0 旨在利用技术增强医疗交付和结果，而不是专注于解决健康不平等和医生疲劳的五重目标（Quintuple Aim）。²\n\
  \n- **医疗健康的五重目标**：医疗改进协会（Institute of Healthcare Improvement）于 2007 年首次提出了“三重目标”，该概念将提高患者体验、改善患者预后和降低成本作为医疗转型的关键。¹³\
  \ 从那以后，它已发展为“五重目标”，现在将临床医生福祉和健康公平作为医疗改革的重要组成部分。根据研究，临床结果和患者满意度直接受到专业参与和健康状况的影响。此外，为了解决健康公平问题并在国际范围内彻底改变心血管护理，理解健康的社会经济决定因素至关重要，这些因素占了结果影响的\
  \ 70%。¹⁴\n\n- **质量 4.0**：质量 4.0 是一个描述通过应用传统技术和工业 4.0 技术实现质量管理的数字化的术语。它涉及使用新兴数字技术和工业转型方法论来转变质量管理，并在跨产品开发、供应商、运营、物流和客户体验的整个价值链中实现跨越式改进。质量\
  \ 4.0 旨在利用新技术动员质量管理实践和卓越卓越，重点关注降低成本、提高质量、简化合规性和提高质量运营的效率。¹⁵\n\n- **数据科学 4.0**：数据科学\
  \ 4.0 可以通过结合先进的数据分析、机器学习和人工智能来优化工业、制造和服务流程。运营、质量保证、供应链管理和预测性维护正在利用数据驱动技术进行彻底变革，以提高生产率、鼓励创新并为增长开辟新潜力。它还可以帮助识别缺陷、异常情况和不满意的客户。数据科学\
  \ 4.0 的本质是数据科学与工业 4.0 的融合，它利用数据的力量来提高既有领域的成果。¹⁶\n\n- **创新 4.0**：创新 4.0 可以根据需求在产品、和服务流程上引发突破性变革，从而推动组织实现工业\
  \ 4.0 目标。通过将结构化创新技术（如 `蓝海战略`¹⁷、`TRIZ`¹⁸、`设计思维`¹⁹、`精益创业`²⁰、`开放创新`²¹、`BACUP 方法`²²\
  \ 以及其他技术）与 AI 聊天机器人增强的头脑风暴协同起来，通过高价值的构思来加速构思过程。经 AI 增强的结构化创新技术可以消除创新过程中的随机性并极大地加速这一过程。先进提示词工程（prompt\
  \ engineering）的使用也可以精炼 AI 聊天机器人创新的头脑风暴输出，并由领域专家提供最后层面的审查。创新 4.0 还可以在连接 AI、IoT 和高级分析的系统中创造突破，具有重新定义制造业和服务业格局的潜力。最终，创新\
  \ 4.0 可以通过由 AI 支持的头脑风暴输入，为数字化、自动化和数据驱动的洞察提供独特创新，从而推动工业革命。\n\n自工业 4.0 首次引入以来，其名称和内容已被许多行业和国家不断完善，导致该运动的许多核心组成部分产生了独特且非标准的名称。自动化、数字化、网络链接组件以及电子产品前所未有的缩小可用于进一步总结工业\
  \ 4.0。表 12.1 总结了各种“4.0”倡议的一些共同和独特特征。该表的内容并非列举详尽。\n\n美国医疗健康领域极切需要突破性的改进，以及来自最佳按需创新和持续改进（CI）倡议的支持，这是基于这些令人匮乏的公布成果：\n\
  \n- 2016 年，美国预期寿命位列所有国家中第 34 位。²³\n- 从 2019 年到 2021 年，美国的预期寿命下降了 2.7 年，而在同类国家，同一期间的预期寿命平均仅下降了\
  \ 0.2 年。²⁴\n- 尽管美国在医疗保健方面的支出比同类国家多，但在大型富裕国家中预期寿命最低。\n- 有些研究估计，医疗错误每年可能导致美国多达 251,000\
  \ 人死亡，使医疗错误成为第三大死因。²⁵ 其他报告称这一数字高达 440,000。²⁶\n\n工业 4.0 承诺了许多优势，包括提高灵活性、提升质量、降低成本和提高效率。物理与数字系统的无缝集成、数据驱动的决策以及根据特定客户需求定制生产的能力，是它与工业\
  \ 3.0 的不同。然而，不同部门、国家、行业和企业对于“4.0”的含义以及如何适应这种演变有不同的观点。⁷\n\n表 12.1 工业 4.0 的关键组件及选定的\
  \ 4.0 倡议\n\n![](img/image-OST30CSN.jpg)\n\n## 12.3 加速工业 4.0：持续改进（CI）计划的关键\n\n持续改进（CI）技术不仅是工具，更是变革的催化剂，需要不断进化和适应以应对业务所需的革命性转型。CI\
  \ 方法需要定期进入自诊断模式，以确保它们既能应对现状，也能应对工业 4.0 的挑战。以平凡的 `SWOT 分析` 技术为例，它应该被放入 `对 SWOT 分析进行\
  \ SWOT 分析` 自诊断模式中，以探索提升这一常用工具性能的机会。单一和混合的 CI 技术应作为动态加速器，将组织推向成功的快车道。\n\n\n\n\n正如精益生产和六西格玛技术在\
  \ 21 世纪初联合创造了精益六西格玛（LSS）一样，LSS、高可靠组织（HRO）、级联风险管理（CRM）和其他持续改进（CI）计划与数据科学/AI 的融合，可以提供一种强大的混合技术，进一步提高效率、减少波动并创造快速的颠覆性创新。对于追求工业\
  \ 4.0 目标的人来说，这种混合并非可选的。本章将讨论数据科学和 AI 如何与 LSS 及其他 CI 计划产生竞争，而是这些技术之间提供一种动态的联合方案，能够缩短从问题定义到解决方案实施之间的时间，同时提供更高效的根原因分析、创新解决方案和防错解决方案。现代\
  \ AI 机器人（如 `GPT-4`）可以为 LSS 问题解决团队增加一个额外的 AI 头脑风暴成员，能够在几秒内提供反馈，以增强问题解决团队的智能创新能力。预测分析可以改进根原因分析技术，并提供比往往容易过度过拟合的经典统计学更准确的根原因重要性排名。\n\
  \n本章强调了下文列出的十一种 CI 技术的构建与精炼，这些技术经过协调以应对工业 4.0 的挑战。每种技术经过单独优化后，可以共同形成一个动态整体，成为下一代数百万解决方案和百万客户微笑的催化剂。以下是能够加速工业\
  \ 4.0 成果的动态 11 项 CI 技术介绍，将在本章后部分进行详细讨论：\n\n1. `带接球战略规划的鱼计划`：将显性战略目标设定与迭代反馈相结合，赋能并引导大多数员工群体成为追求公司愿景过程中的协作伙伴。²⁸\n\
  2. `六西格玛`：通过减少波动和缺陷来降低成本并提高客户满意度。²⁹\n3. `精益 / 改善 (Kaizen)`：快速识别并解决目标业务流程中的 8 种浪费。³⁰\n\
  4. `精益六西格玛`：精益和六西格玛技术的结合，用以解决更复杂的问题。\n5. `预测建模`：通过先进统计分析精确定位根原因并预测未来事件。\n6. `高可靠组织\
  \ (HRO)`：通过防错通信保护高风险活动。³¹\n7. `敏捷对比瀑布模型`：应对国家重建阶段对系统战略规划的需求。这种方法开发于 20 世纪 60 年代和\
  \ 70 年代，借鉴了管理哲学和质量控制原则，包括来自 W·爱德华·德明和约瑟夫·M·朱兰的思想。这些教学强调了明确目标设定、稳健沟通和员工参与规划的重要性。`鱼计划`\
  \ 被翻译为“指南针管理”，为组织提供了一个方向引导性框架。⁴⁰\n\n日本的质量革命受到战略工具的推动，例如“七大管理工具”⁴¹、“七大质量工具”⁴²、“7\
  \ 种浪费”⁴³ 以及精益方法论。值得注意的是，鱼计划计划（Hoshin Planning）是 70 年代和 80 年代获得德明质量奖的许多公司的核心，证明了其重要性。⁴⁴\
  \ 虽然西方世界往往从驱动日本成功的许多工具中精挑，但许多人未能成功实施诸如 `鱼计划` 等更复杂的方法。然而，随着 `MindGenius` 等心力图软件的出现，现在创建和更新这些详细计划变得简单得多。⁵\
  \ 有几种免费软件可用于创建心力图。以下是一些流行的：`Miro`、`XMind`、`EdrawMind`、`Coggle`、`Scappe` 等。⁴⁶\n\n\
  鱼计划包含五个层级的详细工作分解：`愿景 (Vision)`、`目标 (Goal)`、`指标 (Objectives)`、`行动计划 (Action Plans)`\
  \ 和`详细任务 (Detailed Tasks)`。每一层都支持其上方的内容，创建一个全面且关联的计划。这种规划方法确保所有活动都与整体愿景一致，识别并视觉化表示任何差距或风险。虽然传统的项目管理技术往往缺乏这种视角，但鱼计划提供了一种稳健、集成且视觉化的方法，来实现战略目标和愿景。\n\
  \n鱼计划应包含如图 12.3 所示的 5 层详细工作分解结构。\n\n![](img/image-AIULYG6W.jpg)\n\n图 12.3 鱼计划使用的\
  \ 5 层工作分解结构\n\n以下是图 12.3 中用术语的解释：\n\n- `愿景 (Vision)`：对理想未来状态的心理想象\n- `目标 (Goal)`：支持愿景所需的整套顶层目标\n\
  - `指标 (Objectives)`：支持所有目标所需的整套陈述意图\n- `任务 (Tasks)`：支持所有指标所需的整套行动\n\n\n\n\n# 详细任务\n\
  \n- **详细任务**：支持所有通用任务所需的全套详细任务。\n\n注意，上述列表中经常使用“全套（full set）”一词。在一个良好的方针计划（Hoshin\
  \ Plan）中，愿景右侧的每个术语都应该包含支持其左上方术语的完整且详尽意图和活动。\n\n图 12.4 显示了一个 5 级方针计划模板，在最右侧的分支中增加了关于负责资源、详细任务完成率、开始和完成日期，以及详细任务状态的视觉颜色代码（红色、黄色或绿色）。此示例仅进行了部分可视化，仅显示了目标\
  \ 1 的细节。红色表示计划落后于进度。绿色表示进度正常。该模板使用 MindGenius 软件创建。\n\n方针计划过程包括高管理层的战略计划制定、领导层和执行层的目标识别、通过“接球”（catchball）过程进行的协作目标设定、使用方针矩阵进行目标对齐、实施、持续评审和改进。这种全面的方法促进了一致性、沟通以及向实现战略目标的进展。\n\
  \n## 12.4.1.1 与数据科学的整合机会\n\n方针计划作为战略规划的关键组成部分，未来将与数据科学技术（ML/AI）进行转型整合，以创建更有效、动态的战略规划。考虑以下前景：\n\
  \n- **实时性能跟踪**：利用自动化系统监控过程和运营性能，并与目标进行比较。将这些指标与目标进行即时比较，以便快速调整并保持战略对齐。\n- **竞争情感分析**：对竞争对手网站、社交媒体、客户评论和行业报告等各种数据源实施文本和情感分析。这允许对你的产品与竞争对手产品之间的客户情感进行比较研究，从而更好地市场地位。\n\
  - **客户细分分析**：利用文本分析剖析客户群体和画像，分析他们的行为、偏好和购买模式。利用这些见解定制你的产品或服务，针对每个客户细分市场的独特需求进行优化。\n\
  - **社交网络分析**：采用社交网络分析来破解竞争对手、客户和其他市场参与者之间的关系和权力动态。这种分析对于识别潜在的合作伙伴或威胁具有极价值，使你能够有效地调整战略计划。\n\
  - **AI 聊天机器人作为协作 CI 团队成员**：AI 聊天机器人具有成为任何团队中不可或缺贡献者的潜力，特别是参与自由形式脑风暴的团队。利用它们的能力可以激发新的思维方向，拓宽思想和新的范围。\n\
  \n## 12.4.2 六西格玛\n\n六西格玛（Six Sigma）是一套过程改进的技术和工具，由美国工程师比·史密斯（Bill Smith）1986 年在摩托罗拉工作期间引入。“六西格玛”一词源于统计学，特别是统计质量控制领域，该领域评估过程能力。最初，它指的是制造过程在内部或外部客户规格内生产极高比例输出的能力。短期内以“六西格玛质量”运行的过程被认为其长期缺陷水平低于每百万机会\
  \ 3.4 个缺陷（DPMO）。六西格玛是一种适用于企业的质量改进方法，通过统计过程中的缺陷数量并旨在系统地减少这些缺陷。这是一种基于事实、数据驱动的改进哲学，重视缺陷预防而非缺陷检测。六西格玛的目标是实现近乎完美的质量水平，每百万机会仅有\
  \ 3.4 个缺陷。\n\n![](img/image-URKX8WML.jpg)  \n\n图 12.4 方针计划模板\n\n六西格玛项目由经过培训的专业人员领导，被称为黄带、绿带、黑带和大师黑带。各种培训公司、美国质量协会（ASQ）⁴⁸\
  \ 以及多所大学都提供六西格玛培训和认证。国际六西格玛认证协会（IASSC）也是提供精益六西格玛和精益证书的主要资源来源之一。⁴⁹ 每个六西格玛项目都需要大师黑带的技术指导以及其他组织的协助。项目的选择和部署由六西格玛高管和倡导者负责。在高级别，他们确保项目是成功的、有价值的并且与组织计划兼容的。⁵⁰\n\
  \nASQ 表示，在美国接受过任何水平六西格玛培训的专业人士其年收入比未受培训的人高出 17,000 美元。这一成就的原因是，经过高度培训和指导的六西格玛腰带通常被分配去解决其他临时努力未能解决的企业级问题。例如，六西格玛学院表示，六西格玛黑带每个项目可以为公司节省\
  \ 230,000 美元，每年可以完成四到六个这样的项目。⁵¹ 图 12.5 显示了 ASQ 六西格玛黑带知识体系（BOK）创建的词云。该词云显示该 BOK 中最常见的\
  \ 4 个根词是：评估（evaluate）、应用（apply）、理解（understand）和团队（team）。根词是单词的基础形式，没有任何词缀（前缀或后缀）。它们被用于自然语言处理和文本挖掘，将意义相似的词组合在一起。\n\
  \n六西格玛的管理使用结构化的问题解决方法 `DMAIC`（定义、测量、分析、改进和控制）来识别并消除波动原因并改进过程。六西格玛实践者使用统计、财务分析、创意根源分析和项目管理，通过识别并随后纠正现有过程中的错误或缺陷来实现业务功能的提升和质量控制的改进。六西格玛工具箱拥有\
  \ 150 多种不同的个人工具和技术，可以解决尽可能广泛的质量问题。表 12.2 显示了由作者之一（David Patrishkoff）开发的六西格玛数据分析策略，他自西格玛倡议开始以来在全球范围内拥有丰富的精益和西格玛经验，该策略在\
  \ 20 世纪 90 年代通用电气公司启动西格玛部署之前已应用于 AlliedSignal。此表显示了一组可用于探索性数据分析（EDA）和根源分析的六西格玛工具。这只是与六西格玛过程中六西格玛分析阶段相关的分析技术的一小部分。\n\
