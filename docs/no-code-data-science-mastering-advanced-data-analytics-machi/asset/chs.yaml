  \n![](img/image-R49JFALW.jpg)\n\n# 第 3 章\n\n## 数据视化\n\n“一切优先，展示数据”\n——爱德华·图夫特，著名的美国统计学家\n\
  \n“这是我分析中最喜欢的部分：将枯燥的平直数据通过可视化赋予它们生命。”\n—— John Tukey\n\n![](img/image-M6MTZISG.jpg)\n\
  \n### 学习目标\n\n在完成第三章后，读者应该能够：\n- 解释为什么数据视化是理解数据的重要重要早期步骤。\n- 列出常见的数据视化图表及其适用场景。\n\
  - 对比 Orange 用于数值数据与分类数据的可视化组件，以及 JASP 的视化功能。\n- 识别可视化如何帮助发现数据集中的模式、趋势、离群值和潜在异常。\n\
  - 欣赏视觉效果如何以易于理解且清晰的方式向广泛观众传达复杂的数据洞察。\n- 区分为连续数据设计的组件与为分类数据设计的组件。\n\n### 第 3 章总结\n\
  \n数据视化在探索性数据分析（EDA）中起着重要作用，是显示数据分布、缩放、离群值、相关性等关键工具。Orange 提供了针对数值数据和分类数据视化化的核心组件。Orange\
  \ 的一个显著特点是其交互性，允许用户在图表上悬停或选择数据点，然后将所选数据无缝链接到其他组件（如数据表和视化），以深入研究感兴趣的特定分组。同时，JASP\
  \ 也提供了令人赞誉的可视化选择。\n\n### 核心原则\n- 使用有效的单变量、双变量和多变量视化。\n- 通过“谁”、“什么”、“何时”和“哪里”对变量进行分层，以识别跨分析类型的模式。\n\
  - 箱线图离群值计算（`Min = Q1 - IQR x 1.5`）主要适用于正态分布的数据。\n- 由于许多标准测试（如 `t-tests`、`ANOVA`、`regression`）假设正态性，请使用\
  \ `Shapiro-Wilk test` 验证数值变量。\n- 使用最佳系列视化，以清晰地识别隐藏在原始数据中的趋势、异常和特征交互。\n- 用不可否认的视觉证据加强论点。\n\
  - 极具说服力的视化将在观众脑海中留存更久。\n- 将数字转变为引人入胜的叙述。\n- 将复杂性拆解为易于消化的视化内容。\n- 出色的视化可以为决策者提供数据驱动的洞察。\n\
  - 出色的视化可以跨越语言和文化障碍。\n\n## 3.1 引言\n\n个人和多维数据视化结合分层技术，对于理解数据中锁定和隐藏的秘密至关重要。描述性统计是数据视化不可或缺的辅助基石。数据科学项目的早期阶段通常被称为探索性数据分析（EDA）。目前有多种程序可用于数据可视化：`Tableau`、`Power\
  \ BI`、`Excel` 等。它们各有优劣。免费开源统计包 `Jamovi` 和 `JASP` 具有生成 APA 级图像的优势¹²\n\n**要点**：通过视化揭示数据中隐藏的故事。正如\
  \ Tufte 所说：“一切优先，展示数据。”让数据自己说话。\n\n图 3.1 向我们展示数据科学 DISCOVER 过程的第 4 步是通过探索性数据分析（EDA）培养洞察。本章展示了支持\
  \ EDA 的数据视。数据视化在数据科学项目中有许多用途，部分列如下：\n\n- 简化复杂的数据模式，使其更容易理解和传播。\n- 实现利益相关者认可的快速洞察。\n\
  - 增强对复杂情况的理解。\n- 与纯文本或数字相比，视化提高了记忆和回忆。\n- 方便不同数据组之间的比较。\n- 精心制作的视化引导观众参与数据对话。\n\
  - 支持并助力各种利益相关者的决策。\n- 为数据质量、数据输入错误和离群值识别提供额外检查。\n- 为利益相关者的沟通与协作提供共同语言。\n- 清晰、简洁且具说服力的视化建立分析的信任和信誉。\n\
  - 吸引胜的视化鼓励进一步的探索和深层分析。\n- 避免导致错误结论的误导性、偏见性和不完整的视化。\n\n在 Orange 中，可以通过视化组件以及 `Feature\
  \ Statistics` 组件轻松进行 EDA。JASP 也提供了若干额外的视化和统计数据。应该对每个连续变量进行分布视化，因为高度偏态、多峰或其他异常分布会影响各种统计和机器学习模型的性能。在执行其他数据转换方法之前，应识别、调查并处理离群值。\n\
  \n描述性统计并不总是指示数据集中因素之间的真实关系。一个经典的例子是安斯库姆四组。1973 年，统计学家 Francis Anscombe 使用了四个数据集，每组包含\
  \ 11 个数据点，它们的均值、标准差和相关系数等统计属性相同，但视化结果完全不同。见图 3.1.³ 这个例子说明了除了查看描述性统计表之外，视化绘制所有数据的重要性，因为后者可能不是异常数据关系的可靠预警系统。\n\
  \n![](img/image-YHA0X9J7.jpg)\n图 3.1 数据科学 DISCOVER 过程的第 4 步\n\n![](img/image-OTRGQED3.jpg)\n\
  图 3.2 显示均值、中位数、众数、范围和离群值\n\n\n\n\n\n# 单变量数据可视化的经验法则：对于数值型（连续或定量）数据，使用箱线图、小提图或直方图。对于分类（定性）数据，使用条形图、帕托图或饼图。在\
  \ Orange 中，`Box Plot` 插件可以绘制数值型和分类数据。图像可以保存为 `.png` 或 `.svg` 图像。大多数插件的左下角还有一个报告选项，您可以在其中添加注释并与他人共享。报告可以保存为\
  \ `.html`、`.pdf` 或 `.report` 文件。\n\n数据可视化可以按照以下分组进行分类：\n\n- 单变量 - 直方图、帕托图、茎叶图、箱线图、饼图、JASP\
  \ 雨云图、小提图等。\n- 二变量 - 散点图\n- 多变量 - 散点矩阵、相关性矩阵/热力图、BlueSky Statistics Web 图表、平行坐标图、数刻图、散点图上的多因子颜色或符号编码、JASP\
  \ flexplots 以及决策树\n\n在检查上述各种图表之前，让我们先回顾一些基础的数据可视化概念。图 3.2 解释了众数、中位数、平均值和范围。众数是最常见的值，中位数是中间值，平均值是所有数值之和除以数值个数，范围是最大值与最小值之间的差值。\n\
  \n[图 3.3 显示了一个 JASP 描述性统计表、Descriptives 选项卡中的可用箱线图以及一个 Orange 分布图，用于总结和显示图 3.2 所示的七个数据点。箱线图用点显示了一个离群值。该分布图显示数据点“1”是众数。Shapiro-Wilk\
  \ p 值低于 0.05，表明该数据集不代表正态分布。]\n\n![](img/image-PHYGYN1Q.png)\n\n图 3.1 安斯康奎四线图 3\n\
  \n![](img/image-4Y7MVAUN.jpg)\n\n图 3.3 7 个数据点的描述性统计、箱线图和分布图\n\n在图 3.4 中，显示了高斯（正态）分布距离均值的\
  \ 1、2、3 个标准差（`STD`）。注意，离群值的一种定义是数据点落在均值的 +/-3 `STD` 范围之外。68.2% 的数据点位于均值一个 `STD`\
  \ 范围内。95.4% 的数据点位于均值两个 `STDs` 范围内，99.7% 的数据点位于均值三个 `STDs` 范围内。\n\n[图 3.5 展示了左偏 (-)\
  \ 和右偏 (+)。如上一章所述，Orange 可以使用 `Feature Constructor` 插件转换偏态数据，使其看起来更像正态分布。如上一章所述，JASP\
  \ 提供了幂变换，使偏态数据更正态化。注意：大多数医学数据集是右偏的，因为结果不小于零；因此，通常没有没有零以下的值。]\n\n![](img/image-ZF0W9E7P.png)\n\
  \n图 3.4 显示带标准差的正态分布\n\n![](img/image-B0T0HXX4.png)\n\n图 3.5 左偏和右偏数据\n\n第 3.2 节讨论的可视化图表将分为十类。附录\
  \ A 还列出了这些类别、可视化类型、每个图表的用途、支持的统计，以及 Orange、JASP 和 BlueSky Statistics 是否支持这些图表。4\n\
  \n## 3.2 数据可视化表格与图表\n\n许多显示分类值的 Orange 可视化插件还包含卡方检验和 p 值，以指示统计学显著性。该检验确定分类变量的观测频率和预期频率是否存在显著差异。例如，在图\
  \ 3.6 中，显示了数据科学经验水平的箱线图。卡方检验显示 p 值为 0.000，证明该数据集在经验水平比例上存在统计学确认的差异。\n\n![](img/image-HHX42ER3.png)\n\
  \n卡方检验 (YouTube)\n\n### 3.2.1 统计表与显示\n\n统计表和显示用于以清晰、简洁的方式组织和呈现数据。它们通常用于研究论文、科学研究和业务报告，以总结和传达发现。\n\
  \n![](img/image-MQMO976U.jpg)\n\n图 3.6 数据科学经验水平的卡方计算\n\n#### 3.2.1.1 透视表\n\n第 2\
  \ 章第 2.5.10 节讨论了 Orange 透视表。透视表会“旋转”或切换列与行，从而为您提供不同的数据表示形式。\n\n#### 3.2.1.2 特征统计\n\
  \n第 2 章涵盖了 Orange `Feature Statistics` 插件。该插件允许您检查每个变量的可视化情况。插件为数值型和分类数据创建基础图表。您可以根据任何分类特征进行分组（着色），例如蓝色表示无心脏病，红色表示心脏病。该插件计算并显示平均值（mean）、众数（mode）、中位数（median）、离散度（dispersion）、最小值（min）、最大值（max）以及缺失数据点的数量/百分比。分类数据的离散度是其熵（不确定性程度）。对于数值数据，它是变异系数（标准差除以平均值）。\n\
  \n#### 3.2.1.3 JASP 描述性统计与表格\n\n[表 3.1 显示了成人收入数据集上的常用描述性统计测量值。该数据集的目标是预测受访者的收入是大于还是小于\
  \ 5 万美元。只需勾选所需统计的相应复选框即可。根据所需的统计勾选。表格选项包括分位数、百分比、偏度、峰度、众数、中位数、方差和变异系数。还有一个选项可以将表格中的值从列转换为行。]\n\
  \n[表 3.2 显示了种族的频率表。从表中可以看出，白人在此数据集中是最常见的。]\n\n#### 3.2.1.4 茎叶表\n\n[表 3.3 显示了胆醇水平的茎叶表。它提供了单变量的总结。茎代表\
  \ `x * 10`，叶代表单个数字。例如，第一个茎为 12，叶为 6，这表示一个胆醇为 126 的患者，这是该数据集的最小值。第二个茎为 14，叶值为 99，表示胆醇水平为\
  \ 141、149 和 149 的三个患者。图形的最大值为 564。根据表格，大多数胆醇值在 200 到 260 之间。范围为 564-126 或 438。JASP\
  \ 在 Descriptives 选项卡下的 Tables 部分提供了茎叶表。]\n\n### 3.2.2 基础数据显示\n\n基础数据显示指的是以清晰简洁的方式组织和呈现数据的基本方法，以便理解和分析。这些显示通常用于各个领域，包括数学、统计、研究和商业。\n\
  \n#### 3.2.2.1 条形图\n\nOrange `Bar Chart` 插件显示每个主体/患者，因此不是可视化分组的正确插件。`Distributions`\
  \ 插件为连续数据提供直方图，为分类数据提供条形图。然而，当使用 `Box Plot` 插件并选择“按分组频率排序”框时，会显示频率数据优先的条形图。\n\n\
  #### 3.2.2.2 直方图\n\n`Distributions` 插件为数值数据提供直方图和密度图，为分类数据提供条形图。图 3.7 显示了收入数据集的年龄直方图。大多数受访者年龄小于\
  \ 50 岁。应该测试不同的箱宽，因为它会显著影响显示效果。\n\n![](img/image-878QR8I0.png)\n\n图 3.7 年龄直方图\n\n\
  \n\n\n\n`Figure` ` 3.8` 显示了按性别划分的成人收入柱状图。在 `Distributions`（分布）组件中，选择 `gender` 为变量并按\
  \ `income` 拆分。此外，选择“stack columns”（堆叠列）。看起来收入在 5 万美元以下及以上的男性更多，这可能是因为劳动力中男性人数更多。\n\
  \n![](img/image-NLLBYV90.png)\n\n图 3.8 按性别划分的成人收入\n\n### 3.2.2.3 点图 (Dot Plots)\n\
  \n散点图是分布类别中雨云图（raincloud plot）的一部分，它用点显示每个数据点。\n\n### 3.2.2.4 饼图 (Pie Charts)\n\n\
  这种图表是显示分类数据最简单的方法之一，而且容易理解。不清楚为什么这种方法出现在“教育”而不是“可视化”菜单下。不建议对复杂数据使用饼图，因为饼扇会变得难以辨。在图\
  \ 3.9 中，有一张按收入划分的婚姻类型的饼图，并带有图例。显然，有很多收入大于 5 万美元的已婚夫妇。\n\n### 3.2.2.5 帕累托图 (Pareto\
  \ Charts)\n\n帕累托图提供了从左到右按分类变量频率从高到低排序的柱状图。在 JASP 中可以创建帕累托图，在 Orange 中可以创建准帕累托图（quasi-Pareto\
  \ charts）。经典的帕累托图有一条累计百分比线和右侧的垂直轴，该轴与累积百分比线对应，以便检查 80/20 帕累托规则。准帕累托图没有累积百分比线，仅按频率排序条形，没有直接的方法测试\
  \ 80/20 帕累托规则。\n\n图 3.10 中的帕累托图显示了 14 至 18 岁健康调查的总体响应。它绘制了问题：“如何描述你的健康状况？”的频率。帕累托图可以使用另一个分类变量进行拆分，为每个选定的子组创建一个单独图图。要在\
  \ JASP 中创建帕累托图，选择 `Descriptives`（描述性统计）标签页 > `Descriptive statistics`（描述性统计） > 选择变量并拆分（如果需要）\
  \ > `Basic plots`（基础图） > 勾选 `Pareto plots`（帕累托图） > `optional Pareto rule (80% or\
  \ other)`（可选帕累托规则（80% 或其他））。\n\n准帕累托图（又名：频率排序柱状图）可以通过 `Distribution`（分布）组件在 Orange\
  \ 中创建，如图 3.11 所示。你应该选择分类变量来创建这些准帕累托图，然后勾选“sort categories by frequency”（按频率排序类别）框。这些准帕累托图还可以通过在“Split\
  \ by”（分割）部分选择另一个分类变量进行分层，如图所示。这张准帕累托图显示了按性别划分的家庭护理计划安置情况。它显示了有多少患者在有或无助的情况下返回社区，或者他们被转入非机构的安宁疗护。\n\
  \n![](img/image-MWW1IKC4.png)\n\n![](img/image-P6IF1YKB.png)\n\n图 3.9 按收入划分的婚姻类型的饼图\n\
  \n![](img/image-H2LALBY2.jpg)\n\n图 3.10 JASP 中的帕累托图\n\n### 3.2.3 分布 (Distributions)\n\
  \n分布是指变量或数据集的扩散或分散方式。它显示了每个值或值范围在数据集内出现的频率。分布可以用本节描述的多种方式表示。理解数据集的分布在数据分析中很重要，因为它有助于识别模式、趋势和离群值。它还提供了关于数据中心趋势、变异性和形状的信息。\n\
