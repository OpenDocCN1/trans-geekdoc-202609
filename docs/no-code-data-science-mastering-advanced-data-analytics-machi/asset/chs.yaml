  \n# 第 5 章\n\n## 模型评估\n\n“数据是宝贵的东西，它的寿命将比系统本身更长。”\n—Tim Berners-Lee\n\n![](img/image-M6MTZISG.jpg)\n\
  \n### 学习目标\n\n读完第五章后，读者应该能够：\n- 比较和对比内部验证与外部模型验证。\n- 列出分类准确率的缺点。\n- 讨论受试者工作曲线（ROC）的创建方法以及阈值的重要性。\n\
  - 讨论分类和回归模型的模型评估指标。\n- 讨论有助于解释模型的方法。\n- 讨论模型区分能力和模型校准。\n- 理解假设检验的基础知识\n\n### 第 5\
  \ 章概述\n\n在本章中，我们将讨论模型评估。首先，我们将介绍模型评估的指标。然后，我们将讨论如何进行内部和外部模型验证。此外，我们将介绍 k 折交叉验证（k-fold\
  \ cross-validation）技术，以确保评估结果的可靠性。最后，我们将介绍如何解释模型。\n\n## 模型评估指标\n\n对于分类模型，常用的评估指标包括：\n\
  - 准确率（Accuracy）\n- 精确率（Precision）\n- 回忆率（Recall/Sensitivity）\n- F1 分数（F1 Score）\n\
  - 曲线下面积（AUC）\n\n对于回归模型，常用的评估指标包括：\n- 均方误差（MSE）\n- 均方根误差（RMSE）\n- 平均绝对误差（MAE）\n-\
  \ 决定系数（R-squared）\n\n## 模型验证\n\n模型验证是评估模型在未知数据上性能的过程。验证通常分为两类：\n- 内部验证（Internal\
  \ Validation）：在训练数据的变体上进行验证。\n- 外部验证（External Validation）：使用模型完全未见过的新数据集进行验证。\n\n\
  模型验证的目的是防止过拟合，确保模型在实际环境中具有良好的泛化能力。\n\n### 内部验证 (Internal Validation)\n\n内部验证意味着在同一数据集上进行训练和测试。常用的方法包括：\n\
  \n1. **训练/测试划分（Train/Test Split）：** 将数据随机分为训练集和测试集。\n2. **验证集（Validation Set）：**\
  \ 划分出一个验证集用于调调超参数。\n3. **k 折交叉验证（k-fold Cross-validation）：** 将数据分成$k$份，轮流使用其中$k-1$份作为训练集，1\
  \ 份作为验证集。\n\n### 外部验证 (External Validation)\n\n外部验证是指在独立于训练数据的完全的新数据集上测试模型。这是衡量模型真实应用能力的最客观金标准。\n\
  \n## 模型校准\n\n模型校准（Calibration）\n\n模型校准衡量的是预测概率与实际发生频率之间的一致性。一个校准良好的模型在预测某事件发生概率为\
  \ 80%时，该事件在大量样本中确实发生了约 80%。\n\n\n\n\nc. k 折交叉验证的优点是，在交叉验证结束时，所有数据都将连续用于训练和测试。当选择\
  \ `k=10` 时，数据被分为 10 份，你在其中 9 份上进行训练并在另一 1 份上进行测试。此过程重复 `k` 次，以便数据的每个子集都有机会仅作为验证数据集使用一次。然后，计算这\
  \ 10 份数据的平均性能并报告为模型性能。分层交叉验证选项意味着训练和验证折中的类别百分比保持相同。例如，如果癌症是少数类并占报告总人数的 30%，那么分层折中的每一份都将包含\
  \ 30% 的癌症患者。这种方法被推荐，特别是对于小数据集。交叉验证通常也可以重复多次，但在 Orange 中没有这个选项。在图 5.1 所示的 `k-5` 交叉验证中，你在四份数据上训练并在第五份上测试，该过程重复\
  \ `k` 次。平均结果随后被用作整体训练性能。\n\n![](img/image-VSHRSNH8.png)\n\n交叉验证 (StatQuest)\n\n\
  d. 一留法交叉验证 (`LOOCV`)。在这种情况下，你留出一个数据点并在所有其他点上进行训练，然后选择另一个并在剩余数据上进行训练。例如，你有 500 个受试者。你在受试者\
  \ `1-499` 上进行训练并在受试者 `500` 上测试。接下来，你在受试者 `2-500` 上进行训练并在受试者 `1` 上验证。此过程重复，直到每个数据点都有机会用于验证。这种方法是交叉验证的一种极端情况。它提供了一种无偏的交叉验证方法，适用于小数据集。这种方法显然是非常耗时的。\n\
  \ne. 自助采样法（Bootstrapping）是一种重采样技术，涉及对原始数据集进行随机放回采样。每个数据点都有机会被多次选中样本。见图 5.2\n\n###\
  \ 5.1.2 外部验证 (EV)\n\nEV 意味着在不是原始数据中的数据上评估模型。其推导如下：\n\n- 来自不同位置的数据，即来自不同的工厂、客户群、医疗系统，或来自国家不同地区的数据\n\
  - 来自不同人口统计学、社会经济、种族和/或族群的数据\n- 来自不同时间段的数据\n\n**关键点**：在外部验证上评估的模型对训练过的模型面临着最大的泛化挑战。这种挑战源于训练/验证数据与外部验证数据之间潜在的差异，例如分布、噪声或之前未见的模式的变化。过拟合和欠拟合是影响模型泛化性能的常见问题，可以通过正则和各种形式的交叉验证来应对。\n\
  \n![](img/image-KUPTOS2O.jpg)\n\n图 5.2 自助采样\n\n### 5.1.3 优化验证 (OV)\n\n建议你首先使用 Orange\
  \ 中的 `Data Sampler` 组件将数据分为训练/测试集。Orange 的默认是 `70/30` 分分。当你使用 `Test and Score` 组件时，你可以选择运行\
  \ `k 折交叉验证` 来确定训练数据的性能。你稍后将确定测试数据上的性能。如果训练性能远好于测试数据，说明存在过拟合，这意味着训练数据在理解自身模式方面表现出色，但它无法将这些学习投影到未见的测试数据上。理想情况下，你会尝试寻找外部数据进行测试。请注意，始终存在外部数据可能有影响结果的细微差异。此外，创建一个瞻性研究以确认模型在部署时的运行是理想的。某些程序生成\
  \ `AUC` 的置信区间，但 Orange 不生成。\n\n### 5.1.4 进一步验证指南\n\n模型验证由于几个原因会导致困惑。例如，你选择的验证模式取决于数据集的大小。以下提供一些进一步指导：\n\
  \n- 如果数据集很大（几千行），将其分为训练和测试集是谨慎的，因为测试数据集足够大，可以看到模型在面对大量未见数据时的表现。这允许你比较训练与测试结果，以查看是否存在过拟合或欠拟合。在\
  \ Orange 中，使用 `Data Sampler` 组件，或者设置两个输入文件——训练数据和测试数据。\n- 如果数据集很小（数百行或更少），使用 `k\
  \ 折` 或一留法交叉验证将为你提供良好的估算结果，但可能稍微乐观。交叉验证并不是小数据集模型可能出现乐观的原因。当数据集较小时，模型有更高的概率发生过拟合，这意味着它学习的是训练数据中的噪声和特殊之处，而不是真实的底层模式。\n\
  - 注意，在交叉验证和 `70/30` 分分之间的选择在机器学习社区中仍有争议。请通过实验来确定适用于你特定数据集的最佳选项。\n\n## 5.2 模型判别能力与校准\n\
  \n模型判别能力是指模型在二分类中区分两个类别的能力。标准的衡量标准是接收受试者工作曲线下的面积 (`AUC` 或 `AUROC`)）。图 5.3 显示了基于使用\
  \ `logistic regression` 的心脏病预测数据集测试数据的 `ROC` 模型判别能力。`AUC = 0.866`。记住，二分类是基于 `0.5`\
  \ 的任意阈值的。如果预测概率大于 `0.5`，则被标记为 `1`，而如果预测概率小于 `0.5`，则标记为 `0`。正如第 4 章和本章后续部分所示，可以移动阈值以获得更好的结果。\n\
  \n模型校准衡量预测概率与实际结果的接近程度。当你使用概率算法（如 `logistic regression` 或朴素贝叶斯）时，校准非常重要。如果你预测心脏病风险为\
  \ `80%`，这种情况有多少次被证明是真实的？与判别能力不同，模型校准很少在文献中报告。\n\n**关键点**：遗憾的是，良好的模型判别能力并不能保证良好的模型校准。判别能力和校准是模型性能的两个方面，判别能力侧重于区分类别，而校准评估风险预测的准确性。应该同时评估判别能力和校准，以全面理解模型的性能和可靠性。虽然判别能力是衡量预测模型性能最常用的指标，但估计值的校准同样重要。糟糕的校准可能导致误导性的预测，并影响决策过程的可靠性。\n\
  \n\n\n\n\n# 模型区分与校准\n\n模型区分（Model discrimination）通常指二分类，即你只有 `0` 和 `1` 两个选择。没有灰色地带，有时这并不符合逻辑。例如，大多数超声心图的评估分为三类：异常、边缘和正常。银行可能会将个人的信用状况归分为高风险、低风险和边缘风险。在线产品评论可能被评为正面、负面和中性。有时分类应该基于多个类别，而另一些时候输出不应使用阈值，而应使用原始数值，当使用原始数值时，回归分析将是更合理的分析方法。\n\
  \n“阈值”（threshold）是一个截断点，当某个事件发生的概率超过该阈值时，“零”会被自动归为“一”。`0.5` 是默认阈值，意味着 `0.499` 的概率被视为\
  \ 0，而 `0.501` 的概率被视为 1。如前提到的，这些截断点（阈值）没有提供灰色地带，因为每个数据点根据阈值截断点被强制赋予二分类成员身份。模型区分和校准的计算方式不同，因此它们可能不一致。\n\
  \n![](img/image-96G9IMPJ.png)  \n\n图 5.3 ROC 曲线\n\n许多专家建议报告校准（calibration），这被称为“预测分析的阿喀琉斯之踵”。⁶\
  \ 模型校准可以定义为模型预测其被要求预测的真实事件的程度。校准偏差很大可能会给患者和临床医生带来误导性结果。校准不良的其他示例还包括车辆不准确的速度表、不准确的空气和水质测量、过于严格或过于宽松的学生评分标准、不准确的土壤\
  \ pH 值读数等。读者可以参考这些参考文献获取更多关于校准的信息。⁷-⁸\n\n在 Orange 中，你可以将 `Prediction` 组件连接到 `Test\
  \ and Score` 组件上，并查看每个患者的预测结果。你也可以将 `Calibration Plot` 组件连接到 `Test and Score` 组件，以基于\
  \ `Prediction` 组件来显示校准情况。完美的预测将落在如图 5.4 所示的 45 度线上。在例例中，逻辑回归模型的校准良好。换句话说，如果心脏心脏的预测风险为\
  \ `0.95` 且患者患有心脏病（`1`），则校准非常接近。我们将在另一部分讨论预测和校准组件。注意：`Brier Score` 和 `Hosmer-Lemeshow`\
  \ 检验也是模型校准测试，但 Orange 中未提供。\n\n图 5.5 显示了预测概率的分布。注意，虽然大多数数据点接近 `0` 和 `1`，但在 `0.2`\
  \ 到 `0.8` 之间有很多点。我们在这里清楚地看到 `0.5` 的阈值值是 `0` 和 `1` 分类的边界。堆积在 `0` 和 `1` 边界之间的预测概率越多，预测模型的稳健性就越低。\
  \  \n\n图 5.4 心脏病预测数据集上逻辑回归的校准曲线\n\n![](img/image-W5GTF4DQ.png)  \n\n图 5.5 二分类预测概率的分布\n\
  \n以下是模型区分和校准可能不一致的一些原因：\n\n*   存在严重的模型过拟合，导致模型在噪声而非信号上进行训练。\n*   类别不平衡，导致模型主要在多数类上进行训练。\n\
  \n为了改进模型校准，Orange 提供了两种选项。使用 `Calibrated Learner` 组件你可以选择 `sigmoid` 或 `isotonic`\
  \ 校准。在组件中你还有三个其他选择：`optimize accuracy`、`optimize F1 score` 或 `no threshold optimization`。在下面的示例中，创建了一个乳腺分类模型，使用\
  \ `logistic regression` 作为算法。在 `Calibrated Learner` 组件中，选择了 `sigmoid calibration`\
  \ 和 `optimize F1 score`。图 5.6 显示了工作流，图 5.7 证明了校准后 F1 分数的改进。使用 `isotonic calibration`\
  \ 的结果相似。校准图没有发生显著变化。\n\n## 5.3 概率、比率、比率比和对数比率\n\n### 5.3.1 概率 vs 比率 (Odds)\n\n概率（Probability）、比率（Odds\
  \ ratios）和对数比率（Log odds）都是相关的，但表达方式不同。概率和比率反映了某些事件发生或不发生的机会。它们都是比率，但概率相对于观测总数，而比率相对于未发生事件的数量。\n\
  \n概率是事件发生的概率。它是病例数与所有可能病例总数的比例。例如，如果 30 人在雷击后死亡，而有 90 人未死，那么死亡概率为 `30/120` 或 `25%`\
  \ 或 `0.25`。概率范围从 `0` 到 `1.0`。\n\n比率（Odds）是事件发生的概率除以事件不发生的概率。因此，雷击死亡的比率是 `30/90`\
  \ 或 3 分分之一 1。`Odds = (p/1-p)`，其中 `p = probability`。使用雷击示例，`0.25/0.75` 是 3 分分之一 1。要将比率转换为概率，使用公式\
  \ `p = odds/1 + odds` 或 `.33/1+ .33 = 0.25`。⁹\n\n### 5.3.2 比率比 (Odds Ratios) 和对数比率比\
  \ (Log Odds Ratios)\n\n比率（Odds）是两个数字的简单比例，而比率比（Odds ratios）是两个比率的比率，因此如你在后续示例所示，会有四个数字。\n\
  \n比率比（`OR`）传统上用于病例对照研究，以衡量患癌患者与未患癌患者对（例如）毒素的暴露情况。在下表中，我们有数据显示了一个暴露 Glyph™ 和癌症病例的假设情景。\n\
  \n![](img/image-PJOH5M6Z.png)  \n\n图 5.6 Calibrated Learner 工作流\n\n![](img/image-NMWD1CHT.png)\n\
  \n图 5.7 sigmoid 校准后的结果\n\n表 5.1 癌症相关暴露的假设情景\n\n| | 暴露是 | 暴露否 |\n| --- | --- | ---\
  \ |\n| 癌症是 | 17 | 1 |\n| 癌症否 | 83 | 99 |\n\n暴露组的比率比 = 患癌的暴露/未患癌的暴露 = `17/83` = `0.205`\n\
  \n未暴露组的比率比 = 未暴露且患癌/未暴露且未癌 = `1/99` = `0.01`\n\n比率比（`OR`） = `0.205/0.01` = `20.5`。因此，暴露后患癌几率比未暴露高出约\
  \ 20 倍。理想情况下，应该计算置信区间（`CI`）。在这种情况下，95% CI 为 `[2.7, 158]`。记住，如果置信区间包含 `1`，则结果是不确定的，例如\
  \ `[0.1, 10]`。\n\n`OR` 量化了类别组之间关联的程度，而卡方检验确定了类别组之间是否存在统计学意义的关联。相对风险（`RR`）比率类似，但在相同的公式中用概率替换为比率¹⁰\n\
  \n对数比率（Log odds）是比率的对数。例如，我们上面计算的 `20.5` 比率比的自然对数（底为 e）为 `Ln(20.5)` = `3.0`。转换为对数比率会产生围绕零的对称性（更符合正态分布），这更有利分析，因为你可以可视化正数和负数，如图\
  \ 5.8 所示。正值意味着预测因子与结果之间存在正相关；负对数比率则反之。\n\n我们也可以将对数比率写为 `log [p/(1-p)]`，其中：\n\n*\
  \   `p` = 事件发生的概率\n*   `1 – p` = 事件不发生的概率\n\n\n\n\n当函数的变量表示概率（`p`）时，它被称为 logit 函数，这是我们在逻辑回归中使用的函数。`log\
  \ [p/((1-p\\]) `。二分类逻辑回归模拟了一组自变量（数值型和分类型）与二分类因变量（例如：死亡 vs 存活）之间的关系。二分类逻辑回归将因变量建模为\
  \ `p` 的 logit，其中 `p` 是因变量取值为 1 的概率。¹¹\n\n使用心脏病预测数据集，逻辑回归公式如下：（`p` 是因变量为 1 即患有心脏病的概率）。`log(p/1-p)\
  \ = bo(intercept) + b1X + b2X……….b10X`\n\n注意 `b` 是系数，`x` 是自变量，如例所示：\n\n![](img/image-GPWRQ39D.jpg)\n\
  \n图 5.8 逻辑回归系数和计算出的优势值比\n\n`log(p/1-p) = -2.66 (intercept) + -.014 (age) + -0.74\
  \ female)........b10`\n\n与自变量（预测变量）`x` 关联的逻辑回归系数 `β` 是 `x` 每变化一个单位时，发生结果的对数优势比的预期变化。因此，预测变量每增加\
  \ 1 个单位（或从一个水平移动到下一个水平），将使发生结果的优势比乘以 `eβ` (log e B)。图 5.8 显示了在 Orange 中获得的逻辑回归系数以及手动计算的优势值比。要可视化这些系数，请将\
  \ `Data Table` 组件连接到 `Logistic Regression` 组件。\n\n要从对数优势比计算优势值比，仅需计算其反对数（antilog）。例如，在图\
  \ 5.8 中，逻辑回归系数是对数优势比。使用自然对数底 `e` 计算优势值比时，`-74` 为 `.47`。换句话说，系数 = 优势比。在此例中，`e -.74\
  \ = .47` 意味着女性患心脏病的概率降低了 53%。\n\n### 解释优势值比 (OR) 值：\n\n- 正常顋测试 `OR` = `0.63`，或患心脏病的概率降低了\
  \ 37%\n- 可逆顋测试 `OR` = `2.32`，或患心脏病的概率是 2.32 倍\n- 男性 `OR` = `2.0`，或患心脏病的概率是两倍\n-\
  \ ST 抑段 `OR` = `1.45`，或患心脏病的概率是 1.45 倍\n\n![](img/image-P89V4P.png)\n\n优势比与对数优势比\
  \ (StatQuest)\n\n### 5.3.3 诊断测试与似然比\n\n`PPV`（阳性预测值）和 `NPV`（阴性预测值）的计算包含了患病和未健康的个体，受疾病患病率的影响。当患病率增加时，`PPV`\
  \ 增加而 `NPV` 减少。因此，在比较不同测试的 `PPV` 和 `NPV` 时，必须使用相同的群体（或疾病发生率相同）。计算阳性似然比 (`LR+`）和阴性似然比\
  \ (`LR-`）：\n\n- `LR+` 是患病者测试结果为阳性的概率除以未患病者测试结果为阳性的概率（假阳性）。\n- `LR-` 是患病者测试结果为阴性的概率（假阴性）除以未患病者测试结果为阴性的概率（真阴性）。\n\
  \n基于敏感性和特异性的公式如下：\n\n- `LR + = sensitivity/1-specificity`\n- `LR - = specificity/sensitivity`\n\
  \n因此，`LR+` 有助于确诊疾病，而 `LR-` 有助于排除疾病，但都涉及敏感性和特异性。`LR` 接近 1 意味着测试结果不会改变疾病或结果的概率。`LR+`\
  \ 越大，疾病或结果的可能性越高；`LR-` 越小，疾病或结果的可能性越低。通常规则：\n\n- 弱影响：`+LR` 在 1-3 之间，或 `-LR` 在 1-0.3\
  \ 之间\n- 中等影响：`+LR` 在 3-10 之间，或 `-LR` 在 0.3-0.1 之间\n- 强影响：`+LR >10` 或 `-LR <0.10`\n\
  \n示例：在这项实际研究中，共有 280 名患者，其中 180 人患有卵巢癌。所有人均了手术活检并进行了诊断超声、`CT` 和 MRI 研究。下面的混淆矩阵（表\
  \ 5.2）用于腹膜转移的 `CT` 研究。混淆矩阵根据敏感性和特异性百分比填充。\n\n表 5.2 有无腹膜转移患者的 CT 研究\n\n![](img/image-ZKB7U5H.jpg)\n\
  \n敏感性 = 92%\n特异性 = 81%\n`LR + = 4.85` 95% 置信区间 [3.6,6.9]\n`LR - = 0.1` 95% 置信区间\
  \ [0.038,3.2]\n\n这意味着患卵巢癌患者 `CT` 检查阳性的概率是无癌症阳性患者的 4.85 倍。`LR-` 是不确定的，因为置信区间跨越了 1。³\n\
  \n使用贝叶斯定理，患病率充当疾病概率的检验前概率，结合似然比可以计算出检验后概率。\n\n上述分析技术可用于任何行业。下列是一些示例：\n\n- 产品和组件的评估\n\
  - 环境监测\n- 评估客户偏好和行为的市场研究\n- 软件应用的质量和可靠性评估\n- 客户留存分析\n- 酒店业客户满意度分析\n- 银行交易欺诈检测\n\
  - 电信部门的服务质量评估\n\n此参考文献将带您进入 Alan Schwartz 的在线诊断测试计算器。¹⁴ 有许多类似的在线和手机应用程序可进行此类计算。只需输入\
  \ `TP`、`FP`、`TN` 和 `FN` 值，它就会计算出敏感性、特异性和似然比。根据您人群的患病率以及 `LR +` 和 `LR-`，线图上的检验后概率会发生变化。线图假设该群体的患病率为\
  \ 0.64 (64%)，但这是研究群体而非普通人群。鉴于高患病率并使用 `LR+`，检验后概率从 64% 增加到 90%。在患病率较低（10%）且 `LR+`\
  \ 相同（4.85）的情况下，检验后概率为 35%。如果人群中疾病患病率较低，那么阳性测试更有可能是假阳性。相反，如果检验前概率极高，阴性测试也无法排除疾病。\n\
  \n\n\n\n![](img/image-OFGUR4SL.png)\n图 5.10 后验正性预测值\n\n### 5.4.1 测试与评分小部件 (Test\
  \ and Score Widget)\n\n- 此小部件用于记录分类模型和回归模型的性能。\n- 首先，在借助 `Data Sampler` 小部件帮助将数据划分为训练集和测试集后，选择用于帮助为较大数据集训练训练的验证方法。对于较小的数据集，你可能无法将数据集划分为训练集和测试集。在这些情况下，使用\
  \ k 折交叉验证（k-fold cross validation）或留一交叉验证（leave one out cross validation）代替将数据划分为专门的训练/验证和测试集。我们建议对于较小的数据集使用带有分层（stratified）选项的\
  \ k-5 折 CV，对于较大的数据集使用 k-10 折 CV，并通过实验来指导你的最终决策。见图 5.12 的较小数据集示例工作流。\n- 选择目标类别，在这种情况下，如果我们使用心脏病预测数据集，我们最感兴趣的是\
