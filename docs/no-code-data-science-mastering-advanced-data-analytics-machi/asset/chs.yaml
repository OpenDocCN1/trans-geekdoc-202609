  - 流程优化\n- 机器人与自动化 ¹⁴- ¹⁵\n\n## 农业与畜牧业\n\n- 植物疾病检测\n- 杂草识别与管理\n- 作物监控与产量预测\n- 害虫检测与管理\n\
  - 精准农业\n- 收割与分拣\n- 畜牧业与家禽养殖\n- 通过果蔬计数估计产量\n- 远端农场安全监控 ¹⁶ - ²⁰\n\n## 10.3 CNN 是如何工作的？\n\
  \n理解图像分析的核心在于，图像需要转换为计算机可以处理的格式——即数字。下图 10.1 显示了 8 x 8 像素 2D 矩阵中的数字零。在灰度图像中，黑色的值为\
  \ 0，白色的值为 255，灰色的值介于两者之间。像素值如图 10.2 的 2D 矩阵所示。\n\n相反，彩色图像使用 `RGB`（红、绿、蓝）系统。它不是为每种颜色创建一个矩阵，而是使用张量（3D\
  \ 矩阵）。本质上，张量将 3 个矩阵堆叠成 3 个通道。它是三维的，其空间维度例如 `8 x 8 x 3`。\n\n![](img/image-I2JJKFLK.jpg)\n\
  \n图 10.1 在 8 x 8 矩阵中显示的数字零\n\n## 10.4 使用 CNN 进行图像分析的常规步骤\n\nCNN 的宏观概念是它们将图像解构（特征提取）为较小的像素过滤器/卷积核，然后重构图像（全部在隐藏层中完成），并最终将其归类为正确或错误。参见图\
  \ 10.3 以及下文，我们将概述创建 CNN 使用的典型步骤。CNN 由多层神经元组成，每个层神经元都有独特的功能，并配备了可调节的权重和偏置。CNN 可以非常大，包含\
  \ 100 层或更多层。\n\n![](img/image-X30CN5PT.jpg)\n\n图 10.2 代表数字零的像素值\n\n![](img/image-KNPX97BI.jpg)\n\
  \n图 10.3 典型的 CNN 架构 ²¹\n\n### 10.4.1 CNN 层\n\n1. **输入层**由像素组成的灰度或彩色图像组成。请注意，图像应该是正方形的而不是矩形的。\n\
  \n2. **卷积层**执行卷积操作，卷积是扫描图像并创建权重和偏置的过滤器或卷积核，这些会被求和并传递到下一层——激活层。例如，当一个 `3 x 3` 过滤器扫描\
  \ `6 x 6` 灰度图像时，它会生成一个较小的 `4 x 4` 特征图。过滤器通常每次移动一步（步长 `stride`），但此值是可以调整的。由于过滤器或卷积核包含一个数字矩阵，因此使用线性代数（点积\
  \ `dot product`）来创建一个评分，并称为“特征图”。特征图提供了关于角部和边缘的信息。卷积核的大小是由设计团队决定的超参数，以及创建 CNN 使用的层数和神经元。CNN\
  \ 可以包含多个卷积层和池化层。激活层始终位于卷积层之后。\n\n3. **激活层**。激活函数有多种，但常用的是 `ReLU`（线性激活函数）。激活函数的作用是在神经元的输出中引入非线性。神经网络本质上是一个没有激活函数的线性回归模型。激活函数对输入进行非线性变换，使其能够学习并执行更复杂的任务。`ReLU`\
  \ 在阈值处激活以传递信息。如果神经元计算大于 `0`，则传递实际数字，负和则记录为零。参见图 10.4\n\n![](img/image-Q1TBCB46.png)\n\
  \n图 10.4 线性激活函数\n\n![](img/image-25HCSR0R.jpg)\n\n图 10.5 池化\n\n4. **池化层**。该层的主要目标是减小卷积过程中生成的特征图的大小（计算开销）。可以是最大池化、平均池化或求和池化。例如，最大池化可以通过在每次扫描中选择最高值并使用步长\
  \ `2`，将 `4 x 4` 图像还原为 `2 x 2`。参见图 10.5\n\n5. **全连接层**。该层的神经元连接到上一层的所有激活值，这是 `softmax`\
  \ 分类器之前的最后一层。\n\n   a. **扁平化**（Flattening）发生在此层中，意味着将数据转换为 1 维数组以输入下一层。换句话说，所有像素都被展平。\n\
  \n   b. `softmax` 函数接收展平后的向量并输出概率。参见图 10.6\n\n![](img/image-YLOYMEO.png)\n\n图 10.6\
  \ 特征图的扁平化\n\n## 10.5 将知识实践\n\n### 10.5.1 练习\n\n了解使用 Orange 进行图像分析是多么简单。而使用 `TensorFlow`\
  \ 和 `Keras` 创建一个 CNN 则需要专家级的编程能力。\n\n#### 10.5.1.1 皮肤病数据集\n\n第一步是从-ons 菜单中添加图像分析模块。添加后，Orange\
  \ 需要重启。一个小数据集位于第 10 章文件夹中。有一个名为 `BCE`（基底细胞癌，一种皮肤癌）的压缩包和一个名为 `MEL`（黑色素瘤）的压缩包。在你的电脑上创建一个新的\
  \ `Dermatology` 文件夹，并创建两个子文件夹 `BCE` 和 `MEL`。解压压缩包并上传到这些子文件夹。请记住，该数据集太小，无法得出结论，但它是\
  \ Orange 如何工作的快速且简单的演示。这些图像主要来自 Google Images。在同一个文件夹中还有一个更大的皮肤病文件 (`ISIC`) 也可以使用。\n\
  \nOrange 使用一个名为 `Image Embedding` 的组件，它提供了多种 CNN。图像嵌入意味着如 10.2 节所述将图像像素转换为数字。\n\n\
  - `SqueezeNet`: 在 ImageNet 上训练的轻量级快速本地 CNN。\n- `Inception v3`: Google 服务器的 Inception\
  \ v3 CNN。\n- `VGG-16`: 在 ImageNet 上训练的 16 层 CNN。\n- `VGG-19`: 在 ImageNet 上训练的 19\
  \ 层 CNN。\n- `Painters`: 用于从艺术品预测画家的 CNN。\n- `DeepLoc`: 用于分析酵母细胞图像的 CNN。\n\n按照以下指令操作：\n\
  \n1. 使用 `Import Images` 组件，找到硬盘上的 `Dermatology` 文件夹并选择它。\n\n2. 接下来，将 `File` 组件连接到\
  \ `Image Embedding` 组件。如果你想查看图像，将 `Image Viewer` 组件拖到画布上并连接到 `Image Embedding` 组件。\n\
  \n3. 同样，`Data Table` 组件将列出你上传的所有图像。\n\n\n\n\n\n5. 接下来，将 `Test` 和 `Score` 小组件连接到\
  \ `Confusion Matrix`（混淆矩阵）和 `Predictions`（预测）小组件。工作流如图 10.8 所示。\n\n6. 双击 `Test`\
  \ 和 `Score` 小组件，确保向下滚动并选择正确的 `Target Class`（目标类别）（BCE、黑色素瘤或平均）。黑色素瘤的精确率和召回率结果非常好（1.0\
  \ 和 .933）。`AUC` 为 1.0，这非常不寻常且乐观。\n\n7. 观察 `Confusion Matrix`，发现没有假阳性（因此精确率是 100%），只有\
  \ 1 个假阴性。请记住数据集规模非常小，因此我们不应该赋予这些结果过大的意义。这只是一个为了获得图像分析经验的练习。按照惯，用于图像分析的数据集应该包含 100-1000\
  \ 张图像才具有实用性。越多越好。重要的是，对于大得多的数据集，我们应该使用 `Data Sampler`（数据采样）小组件来分析测试数据。\n\n![](img/image-M49CHPM3.jpg)\n\
  \n图 10.8 使用图像嵌入组件进行图像分析\n\n### 10.5.1.2 胸部 X 光练习\n\nKaggle 有一个分为训练集和测试集的数据，涵盖 COVID-19、病毒性肺炎和正常的胸部\
  \ X 光。图像子文件夹 `train` 和 `test` 可以从 Kaggle ²³ 下载，也可以在我们的 File-Share 网站的第 10 文件夹中找到。在你的电脑上创建一个新文件夹并上传这两个子文件夹（`train`\
  \ 和 `test`）。总共有 326 张带标签的高质量图像。\n\n1. 首先将训练数据上传到 `Import Images`（导入图像）小组件。由于它们同时提供了\
  \ `train` 和 `test` 数据，请如图 10.9 所示创建一个双重图像导入场景。训练数据文件夹作为第一个输入，测试文件夹作为第二个输入。\n\n2.\
  \ 两者都将连接到 `Image Embedding`（图像嵌入）小组件，且测试数据图像嵌入连接器应设置为“embedding to test data”（嵌入到测试数据）。\n\
  \n3. 将两者都连接到 `Test` 和 `Score` 小组件，该组件转连接到 `Logistic Regression`（逻辑回归）小组件。如果所有数据都在一个文件中，则你需要在\
  \ `Image Embedding` 小组件之后插入 `Data Sampler` 小组件。使用下面的工作流，你可以在训练结果和测试结果之间切换。工作流如图\
  \ 10.9 所示。\n\n分析 COVID 胸部 X 光结果，我们在表 10.1 中看到了训练集和测试数据集的分类性能。（交叉验证 = 10）。使用 `logistic\
  \ regression` 分析的 `train/test` 数据结果相似，表明几乎没有或完全没有过拟合。我们还看到病毒性肺炎和正常胸部 X 光具有极佳的模型指标性能结果。\n\
  \n或者，如果你想保存模型以便在新数据上对其进行测试，请参图 10.10 中保存并然后上传模型的工作流。请注意，当你加载模型时，你将使用 `Predictions`\
  \ 小组件而不是 `Test and Score` 小组件。这将告诉你预测结果与实际结果对比的情况。\n\n### 10.5.1.3 ECG 练习\n\n心电图可以被视为原始波形或图像。我们将分析的\
  \ ECG 图像来自 `Physionet.org`，源自的一项德国研究（PTB-XL）。²⁴ 这些 ECG 是公开的并与某出版物相关。²⁵ ECG 图像标签已由一位作者（RH）审核并认为是准确的。我们将分析\
