  \nThis was a relatively easy exercise. ... (rest of the text)\n\n\n\n\n# 凝聚聚类（自顶向下）\n\
  凝聚聚类从将每个数据点视为一个单独的类开始，然后根据相似性度量迭代合并最近的类对。它继续合并类，直到所有数据点都属于同一个类。这个过程形成了一个类的层级结构，最终结果是一个显示合并序列的树状图。⁵\n\
  \n![](img/image-LHRPCG2T.jpg)\n图 7.12 来自引用文章的树状图\n\n# 分裂聚类（自下而上）\n分裂聚类采取与凝聚聚类相反的方法。它从一个包含所有数据点的单类开始，然后根据差异性递归地将类分为更小的子类。这个过程一直持续，直到每个数据点形成自己的类，或者满足停止准则。\n\
  \n![](img/image-LTLCJMVC.png)\n\n层次聚类 (StatQuest)\n\n# 7.4 主成分成分分析 (PCA)\n\n## 7.4.1\
  \ 引言\n“维度灾难”意味着特征（预测变量）数量过的数据集会导致模型准确性降低，因为它们还包含了更多噪声和过拟合风险。某些数据集最初并不高维，但在对分类变量进行所需的\
  \ `n-1` 哑编码后，它们会被转换为高维数据集。患者的 ICD-10 代码列如果进行哑编码，可能会创建数百个额外的列。此外，高维数据集运行速度较慢，且通常受到多重线性的困扰。有人写道，理想的数据集观测值（行）数量应该是特征（列）的十倍。减少数据维度的主要技术之一是\
  \ `PCA`，这是一种无监督学习方法，在减少预测变量的同时，尽可能将有价值的信息保留在剩余的主成分中。\n\n通过 `PCA`，数据被转换为主成分，其中成分之间不存在不可接受的相关性水平。主成分根据它们解释数据中最大变异水平的能力进行排序。降维的一个例子是为\
  \ 3-D 主体拍摄的标准 2-D 照片。你丢失了一些深度，但保留了最重要的信息。\n\n线性代数在 `PCA` 计算中被大量应用，也常用作许多其他数据科学技术和算法的数学基础。我们不会专门讲解线性代数模块，但它对于有效处理各种类型的数据矩阵至关重要。例如，线性代数用于：\n\
  \n1. 用于 `PCA`，通过协方差矩阵、`vectors`、`eigenvalues` 和其他技术的帮助创建成分。\n2. 用于 `NLP` 中的词嵌入。单词可以向量化（转换为数值），以便对其进行定量分析。\n\
  3. 用于计算机视觉（图像分析）中的图像嵌入，其中图像及其像素被转换为算法可以分析的数字。`卷积神经网络 (CNNs)` 常用于图像分类和处理，其中图像被转换为数字以供进一步分析。`CNNs`\
  \ 具有多个分析层，它们共同工作将数据转换为一维数组，以输入到下一层分析中。\n4. 用于线性回归中的正则化或损失函数。`L1` 范数基于曼哈顿距离，`L2`\
  \ 基于欧几里得距离。\n5. 用于 `支持向量机` 和许多其他算法。\n\n![](img/image-WWQZT29V.png)\n图 7.13 协方差和相关矩阵\
  \ ⁶\n\n## 7.4.2 实现 PCA 的常规步骤\n1. **标准化**：变量必须归一化或标准化，以便它们处于相同的尺度上。\n2. **创建协方差矩阵**：方差被定义为单个变量的变异，而协方差是两个变量共同变化的方式。方差简单是指给定数据集中数字偏离其平均值的程度。标准差是方差的平方根。协方差矩阵是一个总结了变量之间所有相关性的表格。协方差是指数据集中两个随机变量如何共同变化的度量。如果协方差为正，则变量同步增加或减少；而如果协方差为负，则一个变量增加而另一个减少（反反之）。图\
  \ 7.13 显示了相关性矩阵和协方差矩阵。有三个标记为 `0`、`1` 和 `2` 的变量。变量 `0` 和 `1` 高度相关 (-0.95)。在协方差矩阵中，方差列在对角线上，变量\
  \ `2` 具有最高的方差， 933.30。⁶\n3. **计算协方差矩阵的特征向量和特征值**以确定主成分。主成分是作为初始变量的线性组合构建的新变量。这些组合的构建方式使得新变量（主成分）互不相关，并且大部分信息被压缩到第一个成分中（显示最大的变异）。第二个成分具有第二大量的变异，并相对于第一个成分计算出\
  \ 90 度（正交），因此它与第一个成分不相关。协方差矩阵的特征向量是变异最大（信息最多）的轴方向，这就是我们所说的主成分。特征值仅仅是附在特征向量上的系数，代表每个主成分中所携带的变异量。通过按特征值从高到低对特征向量排序，你可以按重要性顺序获得主成分。在我们提出的示例中，`PC1`\
  \ 方差 = 32%，`PC2` = 14%，`PC3` = 11%。在图 7.14 中，有特征 `1` 和 `2` 之间的相关性图。我们看到一个从数据点中间开始并指向右上角的箭头。那就是\
  \ `eigenvector = PC1`。指向左上角的箭头是 `PCA 2`。\n\n![](img/image-B7M4Y64.png)\nPCA (StatQuest)\n\
  \n![](img/image-5QQDP.jpg)\n图 7.14 特征 1 和 2 的相关性图\n\n## 7.4.3 PCA 练习\n### 7.4.3.1\
  \ 县健康\n从文件共享站点将佛罗里达县健康数据集上传到文件菜单，并连接到 `PCA` 组件。将后者连接到 `Data Table`、`Correlations`\
  \ 和 `Scatter Plot` 组件。打开 `PCA` 组件，你会看到一个碎图，其中你可以选择成分的数量和解释方差。应勾选标准化变量。组件还将处理缺失值并对分类变量进行独热编码。如果在\
  \ `PCA` 组件中选择 8 个成分，将解释 80% 的变异，这是进一步考虑的良好起点。累积方差显示在上方，成分方差显示在下方。你可以手动向右或向左移动垂直线。参见图\
  \ 7.15。\n\n![](img/image-EMAKV7QA.jpg)\n图 7.15 碎图\n\n![](img/image-F61165E.jpg)\n\
  图 7.16 PCA 工作流\n\n![](img/image-MQ0HH1L1.jpg)\n图 7.17 PCA 输出到数据\n\n将 `Data Table`\
  \ 组件与 `PCA` 组件连接两次 - 转换数据到数据以及成分到数据。转换数据是新坐标系中实例的权重，而成分是系统描述符（主成分的权重）。打开数据表，选择成分，你会看到方差列表，例如\
  \ `PC1 = 0.322` (32.2%)。参见图 7.16 和 7.17。\n\n接下来，查看 `Correlations` 组件，你可以哪些特征属于 `PC1`。参见图\
  \ 7.18\n\n![](img/image-62BCVK3N.jpg)\n图 7.18 PCA 的相关性\n\n### 7.4.3.2 肝脏死亡率数据集\n\
  \n\n\n\n让我们比较使用 PCA 和不使用 PCA 的分类结果。我们将使用的数据集预测肝脏病/肝炎导致的死亡。⁷ 该数据集可以从我们 File-Share\
  \ 网站的第 7 文件夹下载。它包含 19 个预测变量，结果是存活或死亡。通过 `PCA`，我们确定 10 个组件可以决定 77% 的方差。工作流如图 7.19\
  \ 所示，表 7.1 显示了 PCA 之前后的结果对比表。在通过 `PCA` 减少组件后，`AUC` 或 `F1` 分数没有显著提高。你可以增加或减少组件的数量并进行重新评估。你还可以选择将\
  \ `Correlation` 小件连接到 `PCA` 小件，以查看哪些预测变量与每个 `PCA` 组件相关。\n\n![](img/image-F1SB9AKI.jpg)\n\
  \n图 7.19 PCA 工作流\n\n表 7.1 使用 PCA 和不使用 PCA 的分类结果\n\n![](img/image-0M5JOQAN.jpg)\n\
  \n使用 `PCA` 并不保证模型性能的提升，因为其有效性取决于数据集和底层数据结构。选择最优主成分数量以及应用 `PCA` 的决策可能涉及使用碎石图、累积解释方差和交叉验证等技术进行实验和评估。应用\
  \ `PCA` 的决策应该基于仔细的评估，而非仅仅是尝试错误。\n\n## 7.5 关联规则\n\n关联规则最好的例子是购物篮分析，即购买了 X 的客户更有可能购买\
  \ Y。如果你在 Amazon 上订过过，你可能在网页底部体验过这种推荐。购买了笔记本电脑的客户更有可能购买鼠标。这是一个项目集 `[laptop, mouse]`，其中笔记本电脑是前件（前置事件），鼠标是后件（后续结果）。这并不是因果关系，仅仅是关联。早期的临床决策支持基于类似于关联规则或“如果...那么...”语句的规则。例如，如果患者的体温超过\
  \ 100 度，脉搏超过 100，且收缩性血压低于 110，那么患者可能患有败血症。在今天，在医学文献中看到报告关联规则已不常见了。然而，这可能是一种被忽视的分析方法，类似于树形图产生的逻辑“如果...那么...”分组。\n\
  \n让我们来看一个杂货店的购物篮分析示例。表 7.2 显示了 10 个每个包含各种物品的篮子。我们将关注面包 (A) 和牛奶 (B) 之间的关联。\n\n关联有三种标准衡量指标：\n\
  \n- **支持度（Support）** 衡量项目集在所有交易中出现的频率。例如：`itemset1 = {Bread or A}` 和 `itemset2 =\
  \ {Milk or B}`。`Dataset1` 的支持度会比 `itemset2` 高。`Support` 可以针对单个项目或项目集进行计算。你可以设置较高的支持度限额（例如\
  \ 10%），这样你研究的就是非罕见的关联。`Orange` 的默认值是 1%。`Support = A + B/Total` 或 `6/10 = 0.6`。\n\
  - **置信度（Confidence）** 是在给定前件的情况下，后件发生的条件概率。例如，百分之几的牛奶购买是由于购买面包导致的？\n\n表 7.2 购物篮分析\n\
  \n![](img/image-2XCN7E6W.jpg)\n\n`Confidence = A + B/A` 或 `6/9 = 0.66`。`Confidence`\
  \ 确实取决于两个物品的基础流行度，因此被称为 `lift`（提升度）的指标也同样重要。\n\n- **提升度（Lift）** 在控制了项目 B 流行程度的情况下，确定购买项目\
  \ A 时购买项目 B 的概率。`Lift = Confidence 除以 (B 除以总数)` 或 `0.66/0.6` 或 `1.11`。`lift` 值大于\
  \ 1 意味着如果购买了 A，则很可能购买 B；而小于 1 则意味着如果购买了 A，则不太可能购买 B。这个例子查看了面包和牛奶的关联，但也可以计算面包和啤酒的关联⁸\n\
  \n从历史上看，用于关联规则最常用的算法是 `apriori`，但多年来，许多软件（包括 `Orange`）已经转向了频繁模式增长（FP-Growth）算法。⁹\n\
  \n### 7.5.1 关联规则练习\n\n我们将使用 `File` 小件中的心脏预测数据集进行此练习。\n\n1. 首先，将 `File` 小件连接到 `Select\
  \ Columns` 小件，但不要包含空腹血糖 > 120 的变量，因为我们知道它并不显著。\n2. 将直径收窄（diameter narrowing）设置为特征而非目标，以便将其包含在关联规则计算中。\n\
  3. 在使用 `Association Rules` 小件之前，将数值数据转换为分类数据（离散化），这是关联规则所要求的。打开小件并选择“等频离散化（Equal\
  \ frequency discretization）”。\n4. 连接一个 `Data Table` 小件以查看转换后的变量情况。\n5. 现在连接 `Association\
  \ Rules` 小件。你可以在顶部的 Options 菜单中找到它：Add ins >> Associate。\n6. 双击 `Association Rules`\
  \ 小件以打开它。将最小支持度水平设置为 10%，最小置信度设置为 90%。选择 `Find Rules`，这将生成度量以及前件和后件语句。分析返回了 159\
  \ 条规则！\n\n第一条规则（`support = 0.294, confidence = 0.908`）的前件为：`major vessels <0.5,\
  \ thallium = normal, exercise-induced angina = 0`，后件为 `diameter narrowing = 0`。\n\
  \n十五条规则（`support = 0.185, confidence = 0.903`）的前件为：`chest pain = asymptomatic, exercise-induced\
  \ angina = 1, gender=male`，后件为 `diameter narrowing = 1`。也就是说，如果是男性且没有胸痛但有运动性心绞，那么他可能患有冠心病。\n\
  \n尝试不同的支持度和置信度看看你的发现。图 7.20 显示了工作流，图 7.21 展示了生成的 15 条规则。\n\n这些结果并不是革命性的，但这种数据科学策略可以在非典型数据集中发现新的关联。在尝试发现关联并创建规则的数据集中，学习这种方法可能会有用。\n\
  \n![](img/image-3372KW0A.jpg)\n\n图 7.20 关联规则工作流\n\n![](img/image-DS17SA15.png)\n\
  \n图 7.21 关联规则结果\n\n## 7.6 知识实践\n\n### 7.6.1 练习\n\n我们将再次使用佛罗里达州县健康排名数据集。排名和县名已被移除。67\
