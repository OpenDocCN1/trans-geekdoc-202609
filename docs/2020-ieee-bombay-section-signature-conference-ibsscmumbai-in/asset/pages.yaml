    Performance measures used for the proposed method of identifying covid are accuracy,
    predictive value (precision), sensitivity (recall), F measure, and correlation
    coefficient (MCC). Mathematical formula to calculate the identified performance
    are as follows:


    ```

    Accuracy (%) = \frac{TP}{TP + TN} * 100

    PPV (%) = \frac{TP}{TP + FP} * 100

    Sensitivity (%) = \frac{TP}{TP + FN} * 100

    MCC (%) = \frac{TP * TN}{(TP + FP) + (TN + FN)} * 100

    F Measure (%) = \frac{2 * TP}{2 * TP + FP + FN} * 100

    ```


