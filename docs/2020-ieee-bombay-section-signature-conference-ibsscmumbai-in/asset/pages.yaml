  md: 'Author proposed a novel hierarchical approach in [2] for covid19 identification.
    They have found a dataset named RYLDS containing a total of 1114 chest X rays
    having seven classes (multiclass framework) and fourteen pattern labels (hierarchical
    framework). At start, using different texture structures are then easily used
    for the learner (multi-class and hierarchical). A multi-class classification has
    achieved better results compared to a hierarchical classification.


    # III. PROPOSED COVID19 IDENTIFICATION TECHNIQUE USING MACHINE LEARNING CLASSIFIER
    WITH HISTOGRAM OF LUMINANCE FEATURES


    Another approach used a deep convolutional network named COVID-19, except used
    for identifying infected cases by their chest X-rays. The author used a COVIDAX
    dataset, containing 13,975 X-rays having 13,975 cases. It is one of the largest
    publicly available X-ray (CVR) covid19 datasets. Proposed network architecture
    is built by combining design principles and machine-driven principles, the sensitivity
    for covid19 as 80% and 95% for normal cases.


    The proposed method is well visualized through the block diagram in Fig. 1. A
    detailed explanation of computing features for covid19 identification using considered
    color spaces is described in this section.


    State-of-the-art for identifying bacterial pneumonia has been proposed in [4]
    by use of deep learning techniques. Pneumonia clouds in chest X-ray images are
    identified using histogram equalization (CLAHE) and other bilateral filtering
    which preserves edges of lungs. Gray activation and saliency mapping has been
    implemented for cross-validation of models achieving 98.3% accuracy in identifying
    bacterial pneumonia. The proposed dataset is used at Mendeley Data and classified
    into two classes: cases infected by bacterial pneumonia and that are normal.


    ![](img/c84ee406c93027779e22f5c407f84623_1_0.png)


    To identify covid19 infected cases, the authors in [5] have implemented a transfer
    learning approach with pre pretrained convolutional neural networks (InceptionV3,
    ResNet, and Inception). Available X-ray radiation is analyzed using a 5-fold cross-validation
    method. As per results, Res50 has given the best performance with 98% identification
    accuracy. Proposed method is based on a dataset [6] which holds 50 normal and
    50 infected cases X-ray images.


    Fig 1 The block diagram of proposed-class classification technique consisting
    of histogram calculation for responsive color combinations using ensemble of machine
    learning algorithms


    Author in [7] have attempted to automate the diagnosis of pneumonia infection
    using OTSU thresholding and histogram calculation. Japan Society of Radiological
    Technology (JRT) dataset is used for the analysis of proposed method, containing
    a total of 40 chest X-ray images. Chest X-ray image is resized and histogram calculated
    with expected region of interest (ROI). This ROI, pneumonia clouds are detected
    using OTSU thresholding followed by counting ratio of noncloudy (healthy) region
    to total lung region. The proposed method in [7] includes the calculation of the
    ratio and computing features for pneumonia infection identification.


    The proposed method is divided into two phases: training and testing phase. During
    the training phase, three-channel X-ray image from covid19 dataset is converted
    into individual color spaces YCB [8], keV-KUV [9-11], and CIE-UE [12]. After the
    conversion, three different features are computed by using different color space
    combinations. The features are transformed by computing histograms of features:
    keV-KUV, then feature vector length for each YCB, and CIE-LUV color spaces are
    computed and then concatenated.


    The three features are used to train machine learning classifiers and in turn
    they yield a trained model. The evaluated individual machine learning classification
    algorithms are: “ExtraTree”, “RandomForest” from Tree family, Ensembles: “ExtraTree
    + RandomForest + SimpleLogistic”, “ExtraTree + RandomForest + NaBayes” and “ExtraTree
    + RandomForest + RandomTree”'
