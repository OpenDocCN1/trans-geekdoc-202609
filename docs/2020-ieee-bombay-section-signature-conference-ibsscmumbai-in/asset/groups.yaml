    # VI. CONCLUSIONS


    As covid19 belongs to the taxonomy of viral pneumonia, their symptoms show great
    similarity implying a challenge in front of the world. Generally, it is observed
    that symptoms of covid19 are discovered after 14-15 days. Hence there is a need
    to build a method that can identify the infection due to coronavirus in less amount
    of time. By using of YCrCh our proposed method extracts local color texture features
    to identify infected cases. According to results, the high average across all
    three classes (80.93%) is shown by “YCrCh+ CIE-LUV” color space while “ExtraTree+
