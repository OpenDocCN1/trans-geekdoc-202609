    以及 (d) 包含正常胸部 X 光图像。


    表 1 展示了性能最佳机器学习分类器或集成模型的三个颜色组合。可以清楚地识别出，YCrB+Kek-LUV 颜色空间结合“Extreme+Random+SimpleLogistic”在
    covid19、肺炎和正常类分类中表现最佳，而 YCrB+CIE-LUV 颜色空间组合次之。


