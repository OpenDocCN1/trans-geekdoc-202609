  - '[PAGE 0]


    # # Covid19 Identification using Machine Learning Classifiers with Histogram of
    Luminance Chroma Features of X-ray images


    Sadeep D. Theadeep, Piyush R. Chaudhary, Mayuresh R. Dindarkar, Shalakbh V. Bang

    Pimprinchwad College of Engineering, Savitribai Phule University, Pune, India

    sudeep@gmail.com, piyush26@gmail.com, mayureshn99@gmail.com,shalakbh99@gmail.com


    **Abstract** The onset of the Novel coronavirus has caused catastrophic consequences
    on the entire global economy leading a huge loss of health and wealth. Millions
    have suffered a lot during this pandemic, especially with Covid-19. As the rate
    of spread is increasing exponentially, many organizations are finding to detect
    the suspected cases quickly. Coronavirus infection can be made from chest X-ray
    images of an individual. Particular color space based global feature extraction
    method to identify covid19 infected cases. The features are extracted from YCrCb,
    KeVC-LU, and CIE-UV color spaces. These features are used for training machine
    learning models. Results obtained at 10-frame convolution shows them better than
    the individual machine learning (ML) classifiers. Performance of the proposed
    method improved by 19% by considering Accuracy, Positive value (PPV), Sensitivity
    (Recall), F Measure, and Matthew correlation measures.


    to coronavirus due to which serious difficulty is faced by the medical organizations
    for detection of Covid19 infection. Generally, use of chest X-rays is the most
    preferred way for diagnosis of lung pneumonia. Even chest X-rays make it easier
    to distinguish between the lungs caused due to pneumococcal pneumonia bacterial
    or viral.


    **Keywords** X-ray, Color, Color Space, Feature Extraction, Machine Learning,
    Coronavirus, Ensembles


    In this study, paper attempt to identify the coronavirus and normal cases by histogram
    calculation using machine learning and ensemble models. The manner is organized
    as follows: Section 1 presents an introduction to the covid19. After Section 2
    consists of related works so far i.e. literature review, Section 3 covers the
    proposed method, Section 4 provides information about experiment and environment,
    Section 5 discussions of results and Section 6 concludes the paper.


    # I. INTRODUCTION


    Around the year of 2019, the birthplace of Revolution Wuhan, found the first covid19
    (coronavirus) case in the World. It is also known as Novel Severe Acute Respiratory
    Syndrome Coronavirus (SARS-CoV-2). The spread of coronavirus virus by heads in
    China has led to a Global Pandemic. Now millions of people have died due to coronavirus,
    while the global economy is plunged into recession by providing immediate medical
    treatment, isolate or quarantine the infected cases, maintaining social distancing,
    and focusing on early mild symptoms, which appeared during the course of infection.


    The World Health Organization (WHO) has recently released the list of symptoms
    that are supposed to be observed at the mild stage of coronavirus infection. In
    contrast, the general symptoms like fever, difficulty in breathing, cough, or
    viral flu pneumonia also correspond


    Global pandemic has caused acute pneumonia in bleeding, chills, lung pneumonia.
    The infection area of lungs are filled with pus which causes the formation of
    cough and difficulty in breathing. As it is the symptoms are different when identifying
    covid19. Through use of chest X-ray, pneumonia major difficulty lies in similarity
    of lung infection and pneumonia. Major difficulty lies to conclude whether a case
    is viral or bacterial pneumonia. This includes a survey of the proposed methodologies
    used to detect tell for covid19 identification.


    # II. LITERATURE REVIEW


    In the authors proposed a novel method for classification & identification of
    normal infection and pneumonia by haralick feature extraction. The features are
    extracted from a total of 22 chest X-ray images, out of 11 being detected to normal
    (healthy) lungs, and 11 images were of pneumonia infections. A haralick feature
    extraction method is used on X-ray images, the difference between these values
    is judged and considered that out of 14 computed features, 3 features (variance,
    sum average, and sum) are most concern the rest 11 features were almost similar
    to each other.'
  - '[PAGE 1]


    Author proposed a novel hierarchical approach in [2] for covid19 identification.
    They have found a dataset named RYLDS containing a total of 1114 chest X rays
    having seven classes (multiclass framework) and fourteen pattern labels (hierarchical
    framework). At start, using different texture structures are then easily used
    for the learner (multi-class and hierarchical). A multi-class classification has
    achieved better results compared to a hierarchical classification.


    # III. PROPOSED COVID19 IDENTIFICATION TECHNIQUE USING MACHINE LEARNING CLASSIFIER
    WITH HISTOGRAM OF LUMINANCE FEATURES


    Another approach used a deep convolutional network named COVID-19, except used
    for identifying infected cases by their chest X-rays. The author used a COVIDAX
    dataset, containing 13,975 X-rays having 13,975 cases. It is one of the largest
    publicly available X-ray (CVR) covid19 datasets. Proposed network architecture
    is built by combining design principles and machine-driven principles, the sensitivity
    for covid19 as 80% and 95% for normal cases.


    The proposed method is well visualized through the block diagram in Fig. 1. A
    detailed explanation of computing features for covid19 identification using considered
    color spaces is described in this section.


    State-of-the-art for identifying bacterial pneumonia has been proposed in [4]
    by use of deep learning techniques. Pneumonia clouds in chest X-ray images are
    identified using histogram equalization (CLAHE) and other bilateral filtering
    which preserves edges of lungs. Gray activation and saliency mapping has been
    implemented for cross-validation of models achieving 98.3% accuracy in identifying
    bacterial pneumonia. The proposed dataset is used at Mendeley Data and classified
    into two classes: cases infected by bacterial pneumonia and that are normal.


    ![](img/c84ee406c93027779e22f5c407f84623_1_0.png)


    To identify covid19 infected cases, the authors in [5] have implemented a transfer
    learning approach with pre pretrained convolutional neural networks (InceptionV3,
    ResNet, and Inception). Available X-ray radiation is analyzed using a 5-fold cross-validation
    method. As per results, Res50 has given the best performance with 98% identification
    accuracy. Proposed method is based on a dataset [6] which holds 50 normal and
    50 infected cases X-ray images.


    Fig 1 The block diagram of proposed-class classification technique consisting
    of histogram calculation for responsive color combinations using ensemble of machine
    learning algorithms


    Author in [7] have attempted to automate the diagnosis of pneumonia infection
    using OTSU thresholding and histogram calculation. Japan Society of Radiological
    Technology (JRT) dataset is used for the analysis of proposed method, containing
    a total of 40 chest X-ray images. Chest X-ray image is resized and histogram calculated
    with expected region of interest (ROI). This ROI, pneumonia clouds are detected
    using OTSU thresholding followed by counting ratio of noncloudy (healthy) region
    to total lung region. The proposed method in [7] includes the calculation of the
    ratio and computing features for pneumonia infection identification.


    The proposed method is divided into two phases: training and testing phase. During
    the training phase, three-channel X-ray image from covid19 dataset is converted
    into individual color spaces YCB [8], keV-KUV [9-11], and CIE-UE [12]. After the
    conversion, three different features are computed by using different color space
    combinations. The features are transformed by computing histograms of features:
    keV-KUV, then feature vector length for each YCB, and CIE-LUV color spaces are
    computed and then concatenated.


    The three features are used to train machine learning classifiers and in turn
    they yield a trained model. The evaluated individual machine learning classification
    algorithms are: “ExtraTree”, “RandomForest” from Tree family, Ensembles: “ExtraTree
    + RandomForest + SimpleLogistic”, “ExtraTree + RandomForest + NaBayes” and “ExtraTree
    + RandomForest + RandomTree”'
