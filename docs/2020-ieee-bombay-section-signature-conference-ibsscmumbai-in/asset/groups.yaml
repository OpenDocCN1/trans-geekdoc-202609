  mdcn: "\n\n# 基于 X 光图像亮度色度直方图特征机器学习分类器的 Covid19 识别\n\nSadeep D. Theadeep, Piyush\
    \ R. Chaudhary, Mayuresh R. Dindarkar, Shalakbh V. Bang\nPimprinchwad College\
    \ of Engineering, Savitribai Phule University, Pune, India\nsudeep@gmail.com,\
    \ piyush26@gmail.com, mayureshn99@gmail.com,shalakbh99@gmail.com\n\n**摘要** 新冠病毒的爆发对整个全球经济造成了灾难性的后果，导致了健康和财富的巨大损失。在这场疫情期间，数百万人遭受了巨大痛苦，特别是\
    \ Covid-19。随着传播速度呈指数级增长，许多机构寻求快速检测疑似病例。可以通过个人的胸部 X 光图像判断新冠病毒感染。本文了一种基于特定色彩空间的全局特征提取方法来识别\
    \ covid19 感染病例。特征从 YCrCb、KeVC-LU 和 CIE-UV 色彩空间中提取。这些特征用于训练机器学习模型。10 帧卷积的结果显示其优于单一的机器学习（ML）分类器。通过考虑准确率（Accuracy）、正预测值（PPV）、灵敏度（Recall）、F\
    \ 分和马修斯相关系数（Matthew correlation），所提方法的性能提升了 19%。\n\n新冠病毒导致医疗机构在检测 Covid19 感染方面面临严重困难。通常，使用胸部\
    \ X 光是诊断肺肺炎的最优方法。即使是胸部 X 光也能更容易区分由球菌性肺炎或病毒性肺炎引起的肺部。\n\n**关键词** X 光、颜色、色彩空间、特征提取、机器学习、新冠病毒、集成学习\n\
    \n在本研究中，论文尝试通过机器学习和集成模型利用直方图计算来识别新冠病毒和正常病例。文章结构如下：第 1 节介绍了 covid19；第 2 节包含目前的相关工作，即文献综述；第\
    \ 3 节涵盖了所提的方法；第 4 节提供了实验和环境信息；第 5 节讨论了结果；第 6 节总结全文。\n\n# I. 引言\n\n2019 年左右，革命之武汉武汉发现了世界上第一例\
    \ covid19（新冠病毒）病例。它也被称为新型严重急性呼吸系统综合病毒（SARS-CoV-2）。中国疫情的新冠病毒传播导致了全球大流行。现在，已有数百万人死于新冠病毒，而全球经济因提供即时医疗治疗、隔离或检疫感染病例、保持社交距离以及关注感染期间出现的早期轻微症状而陷入了衰退。\n\
    \n世界卫生组织（WHO）近期发布了在新冠病毒感染轻微阶段应被观察的症状列表。相比之下，发热、呼吸困难、咳嗽或病毒性流感肺炎等一般症状也与之对应。全球大流行导致了出血、寒战、肺部肺炎等急性肺炎。肺部感染区域充满了脓液，导致咳嗽和呼吸困难的形成。由于，在识别\
    \ covid19 时症状各不相同。通过使用胸部 X 光，肺炎的主要困难在于肺部感染和肺炎之间的相似性。主要的困难在于判断一个病例是病毒性肺炎还是细菌性肺炎。这包括对用于\
    \ covid19 识别的所提方法的综述。\n\n# II. 文献综述\n\n作者提出了一种通过 Haralick 特征提取对正常感染和肺炎进行分类与识别的新方法。特征从总共\
    \ 22 张胸部 X 光图像中提取，其中 11 张被检测为正常（健康）肺部，11 张图像为肺炎感染。在 X 光图像上使用了 Haralick 特征提取方法，判断这些值之间的差异，并认为在计算出的\
    \ 14 个特征中，3 个特征（方差、总平均和总和）最受关注，其余 11 个特征彼此几乎相似。\n\n作者在 [2] 中提出了一种新的层次方法来识别 covid19。他们发现了一个名为\
    \ RYLDS 的数据集，包含总共七类 X 光（层次框架）。从开始，使用不同的纹理结构用于分类器（层次框架）。多类分类取得了更好的结果。\n\n# III.\
    \ 所提方法：使用具有亮度色度特征的直方图通过机器学习分类器进行 Covid19 识别\n\n另一种方法使用了名为 COVID19 的深度卷积网络，通过直方图识别（CVR）来识别感染病例。作者使用了一个名为\
    \ COVIDAX 的数据集，包含 13,975 张 X 光。所提网络架构通过结合设计原理和机器学习驱动原理，covid19 的灵敏度为 80%，正常病例为\
    \ 95%。通过图 1 形象地展示了所提方法。\n\n色彩空间计算 covid19 特征的详细解释在本节中描述。\n\n最先进的深度技术在 [4] 中提出，用于识别细菌性肺炎。X\
    \ 光图像中的肺炎云使用直方图均衡化（CLAHE）和其他保护肺部边缘的双侧滤波进行识别。灰度激活和显著性映射已用于交叉验证，准确率达到 98.3%。所提数据集用于\
    \ Mendeley Data，并分为两类：细菌性肺炎感染和正常。\n\n![](img/c84ee06c9302779e22f5c407f84623_1_0.png)\n\
    \n为了识别感染病例，作者在 [5] 中实现了预训练卷积神经网络（InceptionV3、ResNet 和 Inception）的迁移学习方法。X 光辐射使用\
    \ 5 折交叉验证进行分析。根据结果，Res50 提供了最佳性能，准确率达 98%。所提方法基于数据集 [6]，该数据集包含 50 张正常和 50 张感染病例的\
    \ X 光图像。\n\n图 1 所提分类技术的框图，由使用机器学习算法集成的响应色彩组合的直方图计算组成\n\n作者在 [7] 中尝试使用 OTSU 阈值法和直方图计算自动诊断肺炎感染。日本放射线学会（JRT）数据集用于所提方法的分析，总共\
    \ 40 张胸部 X 光图像。胸部 X 光图像进行缩放，并在感兴趣区域（ROI）计算直方图。在该 ROI 中，使用 OTSU 阈值法检测肺炎云，然后计算无云区域与总肺部区域的比例。[7]\
    \ 中的所提方法包括比例计算和肺炎感染识别的特征计算。\n\n该方法分为两个阶段：训练阶段和测试阶段。在训练阶段，将 covid19 数据集的三通道 X 光图像转换为单个色彩空间\
    \ YCB [8]、keV-KUV [9-11] 和 CIE-UE [12]。转换后，通过不同的色彩空间组合计算三种不同的特征。通过计算特征直方图进行变换：keV-KUV、然后每个\
    \ YCB 的特征向量长度，以及 CIE-LUV 色彩空间。\n\n这三个特征用于训练机器学习分类器，并产生训练良好的模型。评估的单一机器学习分类算法为：\n\
    \ ExtraTree\n- 来自森林家族的 RandomForest\n- 集成学习：\n    - ExtraTree + RandomForest +\
    \ SimpleLogistic\n    - ExtraTree + RandomForest + NaBayes\n    - ExtraTree +\
    \ RandomForest + RandomTree\n\n"
