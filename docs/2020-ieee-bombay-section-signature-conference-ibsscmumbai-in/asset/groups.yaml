  - '[PAGE 2]


    In the testing, the computed feature of the sample chest x-ray is supplied to
    already trained machine learning classifiers or ensembles for covid19 identification.


    The Waikato Environment for Knowledge Analysis (WEKA) [14], a machine learning
    tool is used to carry out experimentation (training and testing phase) of the
    proposed method for covid19 detection from input X-ray. WEKA is a tool that provides
    a wide collection of different machine learning algorithms and data preprocessing
    tools. Python 3 programming language is used for extracting features from images.


    Covid19 dataset [6] is composed of 4-class labeled chest x-ray images. Total of
    240 three-channel chest x-ray images of 50 patients are present in this dataset.
    The dataset consists of covid class (60 images), normal class (60 images), pneumonia
    (60 images), and pneumonia_bac (60 images). All images are not of same size, sizes
    range from 456 to 2721 * 2438 pixels.


    # IV. EXPERIMENTATION


    This section discusses the efficacy of the proposed method of covid19 detection
    from chest x-ray, overall by key performance metrics: Test Accuracy, Predictive
    Value (Precision), Sensitivity (Recall), F Measure, and MCC. Graphs and tables
    showing performance on overall machine learning algorithms and color space combinations
    in individually considered metrics.


    | Class | classifier or ensemble | Accuracy | PPV | F Measure | MCC |

    |---|---|---|---|---||

    | normal | ensemble | 87.2 | 80.4 | 75.9 | 69.3 |

    | covid19 | Extreme+RandomForest+Naive | 91.7 | 89.4 | 87.9 | 81.4 |

    | pneumonia | ensemble | 94.2 | 89.7 | 78.6 | 73.1 |

    | pneumonia_bac | Extreme+RandomForest+Simple | 96.4 | 92.2 | 90.3 | 85.1 |

    | covid19_bac | ensemble | 97.8 | 94.6 | 92.2 | 88.6 |


    # TABLE 1 CLASSIFICATION RESULTS


    ![](img/c84ee406c93027779e22f5c407f84623_2_0.png)


    Fig. 2 X-ray images samples from covid19 dataset (f) composed of four sets namely:
    (a) represents covid19, (b) includes pneumonia, (c) represents pneumonia_bac and
    (d) includes normal chest x-ray images.


    Table 1 illustrates the three color combinations for best-performing machine learning
