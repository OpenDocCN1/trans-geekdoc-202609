    # CHAPTER FIVE


    # Ways You Can Begin Your Prompts


    There is no wrong way to begin a conversation with ChatGPT, but if you are entirely
    new to the AI model, this book has provided some popular ways to get you started.
    Remember to have a clear and specific goal for each conversation with ChatGPT
    before you engage with it.


    Four simple phrases you can use are the following:


    +   "Generate _____________."

    +   "Tell me about _____________."

    +   "Imagine that _____________."

    +   "Act as if _____________."


    Commands such as "generate" and "tell me about" are pretty straightforward. So
    let''s expand on the other, lesser-known prompts. Some users have expressed great
    results when they tell the AI model to "act as if" when sending their prompt.


    For instance, you may set up the prompt like this: "Act as if you are a dog trainer.
    What are some effective ways to get a young puppy to stop wetting the carpet?"


    From here, you may be satisfied. But if you are not, you may write an additional
    prompt to keep the conversation going and glean more information. "What is the
    best home remedy for dog urine in a carpet?"'
  - '[PAGE 13]


    The prompt "act as if" can work for nearly any career or industry you can think
    of.


    Another prompt that some users have claimed works very well is similar to "Act
    as if," but may produce different outcomes and generate interesting and imaginative
    replies. It goes, "Imagine that..."


