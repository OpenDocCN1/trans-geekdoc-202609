    # **ChatGPT Explained**


    ChatGPT, the invention of GPT, is a revolutionary, new technology as well as an
    AI-driven language model that uses artificial intelligence to create conversations
    so similar to those of us humans, that it''s hard to tell the difference. Thanks
    to deep learning algorithms, ChatGPT has been trained on a large library of chat
    logs, granting it the ability to craft natural replies to your questions andprompts
    instantly.


    The good thing about ChatGPT is that it can generate answers just like those made
    by people. In short, ChatGPT is a powerful, multi-purpose and valuable tool in
    generating human-like answers in chatbot applications.


    # **Setting Up ChatGPT**


    Setting up ChatGPT is pretty straightforward. To get started, the first step is
    to make an account. Using this AI model is free for now, but it may not remain
    that way in the future. So take advantage of it for free while you still have
    the opportunity.


    Getting ChatGPT up and running is easy. First and foremost, you must register
    for an account. At the time of this writing using this ChatGPT is free, but recently
    an option to "Upgrade" has become available, sparking rumors that ChatGPT may
    not always be free to access. This is why we highly suggest that you take'
  - '[PAGE 5]


    advantage of its free version, and the amazing opportunities it can provide you
    with while it is still available for all.

    Direct ChatGPT link: Chat.openai.com'
  - '[PAGE 6]


    # How ChatGPT Works


    ChatGPT is an AI-powered chatbot with the amazing ability to not only understand
    a user''s messages, but also to reply to the user in a way that truly feels like
    talking to another person. It accomplishes this by looking at the messages and
    using its AI capabilities, like its neural networks and context-aware processing,
    to understand what is being asked. This helps ChatGPT generate the most suitable
    and appropriate responses, that makes sense to the user. This makes engaging with
    ChatGPT feel like a natural, unforced and flowing conversation.


    In ChatGPT, the user''s messages are referred to as "prompts" and the procedure
    of commanding ChatGPT to perform any task is called "prompting."'
  - '[PAGE 7]


    # High-Quality Prompts and Great ChatGPT Responses


    When it comes to creating high-quality prompts with ChatGPT, you should know a
    few basics. One of the simplest, yet most impressive things this AI model can
    do is it can quickly deliver fully fleshed-out responses, based on whatever prompts
    you choose to feed its system.


    A prompt is a piece of text - questions, thoughts, ideas, or phrases - that you
    give to the model as a starting point for generating text. A prompt can be a short
    question, or it can be paragraphs in length.


    # Here is an example of a prompt


    User: "In as few words as possible, describe the heart-brain coherence."

    ChatGPT will then generate a response such as: "Heart-Brain Coherence refers to
    the synchronization of the rhythms of the heart and brain, which is associated
    with improved physical and mental well-being."


    Remember that the responses, or output, generated by ChatGPT are just suggestions.
    You, as the user, ultimately decide if you want to use its response as it is,
    or change it.


    Another way you can use ChatGPT is to complete a piece of text. For example, you
    could give the program the beginning of a'
  - '[PAGE 8]


    sentence like, "Today I went to the clothing store and I bought," and the AI model
    would continue your sentence with something like "pants, a shirt, and shoes."


    It''s important to take into account that the quality of the responses, or output,
    you receive from ChatGPT will depend on the quality of the prompt, or input, you
    provide, as well as the deep learning ChatGPT has undergone.


    For instance, if you ask ChatGPT to explain book genres covered in most Grade
    5 English classes to you, and then you ask this ChatGPT to explain College level
    thermodynamics, it may provide you with a reply that does not make sense. Multiple
    different conversations at once can confuse the AI model.


    In other words, this technology is still quite new, and we users are training
    it each time we use it. Hence, it will not always be perfect, and it can make
    mistakes. Therefore, in order to avoid errors, and make the most out of ChatGPT
    while getting the most accurate responses, it is important that you are consistent
    with your conversations.


    Open a new chat for every topic you want to discuss with ChatGPT. As well, be
    sure to always be thorough with using high-quality, effective prompts. You will
    learn the proper techniques for crafting high-quality prompts later in this book.'
  - '[PAGE 9]


    # Crafting High-Quality Prompts


    When it comes to interacting with ChatGPT, there are a few practices that you
    should keep in mind in order to achieve the best results:


    1.Create a clear prompt: When you give ChatGPT a prompt, also called an input,
    make sure it is easy to understand and well-formatted. This will help ChatGPT
    to understand what you are asking it to do. When it knows exactly what you are
    asking of it, ChatGPT will generate more accurate and relevant responses. Prompts
    may include a question, a statement, a text summary, a bulleted outline, or you
    can request more information about a topic, etc.


    2. Be specific: The more specific your prompt is, the better the response, also
    known as the output, will be. For example, instead of writing this prompt: "Tell
    me about some popular songs." You could write this more specific prompt instead:
    "What are the top 20 most popular songs of all time according to Billboard Hot
    100 chart?"


    3. ChatGPT will then take your prompt as input and generate a well-thought-out
    response text as the output, which is the answer to your question. Evaluate its
    response, and decide if it is satisfactory.'
  - '[PAGE 10]


    4. If you decide you want a longer or more information from ChatGPT, be sure to
    follow up with another Because ChatGPT is a chatbox, you don''t have to begin
    a new chat to make changes or glean more information. Simply continue to chat
    with the chatbox by asking it following up questions as prompts. The AI model
    was created to remember what you last said and can build on it. This is what makes
    the platform feel like you are having a chat with a real person!


    # Pro Tips:


    If you receive a response that you like but find that the output is too short.
    Simply tell ChatGPT to "expand" on the prompt you wrote.


    If ChatGPT is generating a response you find to be too long, press the button
    "stop generating" above the chatbox to end its reply.


    Sometimes ChatGPT can forget to finish an output. Thus, it may stop mid-answer.
    In this case, simply write "continue" to get it to finish its'' reply.


    You can also make the model reword its answers by telling it to "rephrase" its
    response.


    Using "Act as if" or "Imagine that you are" will cause ChatGPT to generate more
    unique and tailored responses. Ex. "Act as if you are a secret spy," then ask
    it to help you find a notorious criminal in a story.'
  - '[PAGE 11]


    Be as descriptive as you can. You can start with a prompt and then ask more specific
    follow-up questions.


    If you get an error message in ChatGPT, which often happens these days as the
    server is overwhelmed by new users, simply refresh the page.'
