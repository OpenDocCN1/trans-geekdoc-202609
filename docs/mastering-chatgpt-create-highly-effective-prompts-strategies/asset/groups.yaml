    的对话设定一个清晰且具体的目标。


    你可以使用以下四个简单短语：


    - "Generate _____________."

    - "Tell me about _____________."

    - "Imagine that _____________."

    - "Act as if _____________."


    像 "generate" 和 "tell me about" 这样的命令非常直接。那么，让我们来详细了解一下其他一些不那么为人所知的提示词。一些用户反馈，在发送提示词时让
