  \n文档“The national artificial intelligence research and development strategic plan”（2016）特别关注`R&D`（研发）策略。正如全球大多数官方文本的情况一样，人工智能被描述为一项突破性技术，预示着人类活动各个领域的深刻变革，为社会福祉和经济发展造福：“人工智能（AI）是一项具有巨大社会和经济效益的变革性技术，具有彻底改变我们生活、工作、学习、发现和交流方式的潜力。”\n\
  \n目标是发展积极、有益的人工智能，并尽可能减少其负面影响。所提议的策略实施基于七项优先事项：确保长期投资；推动支持人类的、而非单纯取代人类的人工智能；考虑伦理和法律方面；保障人工智能系统的安全；为研究人员和人工智能开发者提供高质量数据并促进其访问；进行技术评估以制定标准；评估人力资源需求以开发人工智能。\n\
