  \nAI 驱动恶意软件的一个特殊性是其能够考虑整个上下文或环境，并据此自适应变化。AI 因此拥有超越人类的环境视角，并且其视野可以类似于全局的俯视。这里并不是指对整个网络空间的全局视角，而是指对当前环境的即时视野，并通过整合环境和目标的变化来转化行动。全局视角、实时行动能力使\
  \ AI 恶意软件拥有俯视力，能够在保持隐蔽且难以被检测的同时，保持最接近目标的位置。\n\n在 Figure 3.16 中，我们展示了一些简化的攻防配置，包含两种基本情形：当基础行为体或系统调用\
  \ AI（标记为 1）或不调用 AI（标记为 0）时。本节考虑三个行为体和系统，以简化攻防-安保/防御方案：\n\n*   – 攻击者或入侵者（标记为 Att）；\n\
  \n*   – 安全或防御（标记为 Sec）；\n\n*   – 目标、对象、系统或行为体（标记为 C），它既可能是攻击对象，也可能受到安全/防御的保护。\n\n\
  我们可以如下解读图中的路径：\n\n*   – Att (0)/Sec (0)/C (0)：攻击者不使用 AI，安全方案不使用 AI，目标不使用 AI 或根本不是\
  \ AI；\n\n*   – Att (1)/Sec (1)/C (0)：攻击者使用 AI 进行攻击，安全方案使用 AI 保护“目标”，目标本身不使用 AI 或不是\
  \ AI。\n\n这共产生八条路径。\n\n![Figure 3.16. Attack and secure/defend, with or without AI](img/fig3-16.jpg)\n\
  \n**Figure 3.16.** *Attack and secure/defend, with or without AI*\n\n基于此阅读网格，可以提出以下问题：\n\
  \n*   – 是否存在一种路径，使得目标无法被攻击？另一方面，是否存在一种路径，使得目标完全脆弱？\n\n*   – 哪条路径能最大化 C 的安全性、Sec\
  \ 的效率以及 Att 的有效性？\n\n*   – 当只有单一元素调用 AI 时，谁占优势：使用 AI 的元素，还是尽管如此的其他元素？\n\n*   – 当两种或多种\
  \ AI 形式相互对抗时会发生什么？\n\n答案将取决于 AI 的质量、价值或层级、其适当使用以及实现质量。也有优质 AI 与劣质 AI 之分，层级高低不一，适配与不适配于目标或任务。可以假设\
  \ AI 在并非所有情形或配置中都是绝对优势。还需考虑，面对使用 AI 的攻击目标最终可能会发展出规避手段、战术或策略——无论是原生的、涉及 AI 还是不涉及\
  \ AI 的——这正是非对称对抗的原则。弱势行为体若无法正面交锋，便会寻找规避战术和策略，绕过攻击者的弱点，采用其他作战方式，从侧面或弱点切入。因为即使使用 AI，攻击者仍保有自身弱点；其所用的\
  \ AI 本身可能是首要漏洞（AI 可能被欺骗或误导）。\n\n\n\n-   [网格阅读在网络安全和网络防御的背景下适用。目标可以是电脑、服务器、网络、连接的武器系统、个人或个人群体、社交媒体等。]\n\
  \n-   [网络安全利用人工智能技术来应对可能或可能不利用人工智能的网络攻击。]\n\n### 3.4.4. 对抗性人工智能和对抗性机器学习\n\n-   DNI\
  \ 将“对抗性人工智能”定义为：“一种专注于理解人工智能系统在恶意对手存在时的行为的 AI 子集。”[DNI 19]\n\n-   基于机器学习的解决方案被开发用于观察黑客行为并适应其战术的变化。入侵检测工具正变得能够跟随黑客的变化做法，不再局限于特定类型的攻击。新系统为之前使用的僵化系统带来适应性、灵活性和动态性。目标是尽早在攻击周期中发现攻击或尝试攻击。然而，黑客也在适应其攻击技术，意识到新检测方法的实施。因此，权力平衡仍然保持。尤其是由于机器学习系统并非全能（当数据不足时，学习也受限）。为了对抗智能安全系统，黑客会寻找对策，如通过冒充合法用户来欺骗系统，或试图了解安全系统的工作原理并利用用于学习系统的数据。因此，攻击者的任务是攻击\
  \ AI 本身，针对其弱点进行攻击，欺骗 AI 有时甚至相当简单：\n\n    *   —  — 用于法院判决的 AI 可能会出错。因为它从大量历史判决数据中学习，可能会学习到过去的判断错误，并重复这些错误。AI\
  \ 会复制过去的错误[HAO 19]；\n\n    *   —  — 微软的聊天机器人 Tay 于 2016 年在 Twitter 上线，很快转向仇恨言论。该\
  \ AI 从喷子广泛传播的内容中学习，试图扰乱论坛功能。AI 无法区分“良好”与“恶劣”，或“合法”与“不合法”，但这一经历也提醒我们，学习型 AI 的学习过程可能被操控；\n\
  \n    *   —  — 自动驾驶系统可能因车辆颜色与天空相似而未能检测到其他车辆，导致交通事故；\n\n    *   —  — 在道路标志上贴纸可以误导图像分类（深度学习）系统[EYK\
  \ 18]；\n\n    *   —  — 人脸识别系统错误率较高，容易被欺骗[SHA 16]；\n\n    *   —  — 在 2019 年 8 月的香港示威中，示威者使用激光照射警察摄像头，意在致盲供人脸识别系统提供数据的摄像机。摄像头失效后，上层的人脸识别系统便失去作用。智能系统依赖传感器数据，要击败\
  \ AI 必须攻击传感器或数据来源。\n\n-   对于这类 AI 系统的“攻击者”，方法是攻击其捕获并分析的数据，进而导致 AI 无法正常工作。神经网络可因图像或音频中加入的信号或数据而被干扰[SZE\
  \ 13]。这些属性 —  — 即漏洞 —  — 只有近期才被认识和识别。\n\n-   因此，针对基于 AI 的系统的攻击已成为攻击者和 AI 系统用户（无论是网络安全还是机器人、自动驾驶、人脸识别等领域）日益关注的问题。利用\
  \ AI 漏洞的行为在军事领域同样是核心议题。\n\n### 3.4.5. AI 与信息战\n\n-   在《The Machine That Won the\
  \ War》（Isaac Asimov, 1961）一书中，三位人类领袖在击败 Denebians 后聚集讨论 Multivac 计算机在胜利中的决定性作用。第一位承认他篡改输入数据，因为不信赖报告的质量；第二位承认他篡改计算机产生的数据，因为不认为计算机处于最佳模式；第三位承认他不信赖计算机的报告，而是抛硬币决定，依赖偶然而非直觉和机器的能力。\n\
  \n-   虽然这是虚构故事，但它引发了信息战及战争艺术的核心问题：\n\n    *   —  — 计算机在战争中的角色，尤其是指挥控制（C2）中的作用，完全取决于人机关系；\n\
  \n    *   —  — 人机关系以信任为定义：\n\n        *   —  — 个人确保机器正常运行的能力；\n\n        *   — \
  \ — 机器在处理前产生的信息/数据的质量（准确性、相关性）；\n\n        *   —  — 计算机的技术能力；\n\n        *   — \
  \ — 机器产生的数据的质量或相关性。\n\n    *   —  — 若对上述所有组成部分缺乏信任，负责作战的领导者倾向于依赖个人判断，甚至依赖偶然。\n\n\
  -   这些问题在考虑 AI 在指挥流程中的作用时仍然存在：AI 的存在并不保证其提供的数据可靠；AI 本身可能在技术上并非最优，其输出也可能引发怀疑或担忧（AI\
  \ 实际如何处理数据？如何生成结果？）；人类可在 AI 仅作为决策支持工具时选择不依赖其数据；以及如何保证基于 AI 分析的决策在后果或影响方面优于仅凭人类推理或偶然做出的决策？AI\
  \ 依赖于其输入数据以及所处理的数据。\n\n-   AI 旨在将计算机提升至人类智能水平，并超越人类的推理能力。信息战 —  — 以知识、表征、推理为手段 —\
  \  — 无疑是 AI 应用的主要领域之一：\n\n    > “与测量物质能力相比，评估敌人意图更接近一种黑艺术，需要近乎 clairvoyant 的洞察力，洞察敌方指挥官的人格和心理过程。专家系统和模式识别等人工智能技术可能对这一古老问题有应用，并有望发展为信息战的强大新武器。通过这些技术，可以构建一个模拟对手指挥官的机器，用于测试不同行动方案的反应。”[LEW\
  \ 91]\n\n-   AI 的角色之一可能是预测敌方决策。AI 可以“思考”像敌人一样，置身于其位置：\n\n    > “结合专家系统、模式识别等人工智能技术，或许还可以进一步实现对特定情境下领导者专业知识的机器模拟，从而得出‘最可能’的响应预测。当然，如果该领导者是敌人，捕获其专业知识并识别其行为模式的模板任务庞大。但关键在于，这些任务如今已不再不可能，只是极其困难。”[LEW\
  \ 91]\n\n\n\n一份美国陆军研究报告探讨了人工智能在信息战中的有用性。该报告由大卫·C·柯克上校（KIR 96）撰写，作为 1996 年美国陆军战争学院的一项研究项目的一部分，题为《人工智能在信息战中的应用》，认为智能体将在未来成为信息战的关键要素，用于管理信息流、构建防火墙保护网络，并通过持续评估网络漏洞来为网络安全作出重大贡献。\n\
  \n在本报告中，作者探讨了当时人工智能的进展如何能够在信息作战的进行以及信息基础设施的安全中发挥应用。作者的反思正值美军正在审视新技术在军事事务、作战艺术以及信息战概念制定中的影响之时。以下简要概括作者所提出的论点：\n\
  \n*   – 他首先对信息战的定义进行梳理，虽强调该概念不能仅限于军事领域，但正是军事领域指引了他的思路。正是在医学（诊断）领域，专家系统首次得到应用，随后才被用于军事领域（如后勤、维护、规划等）。专家系统的局限性在于其编程质量以及所输入的静态知识，它们仅限于既定专业范围，无法意识到当问题超出其专长时已跨出舒适区，甚至会给出错误的答案。\n\
  \n*   – “智能体”在一定程度上克服了这些弱点，因为它们允许多个系统之间共享知识。“智能体”指任何通过传感器感知环境、并通过执行器对环境进行作用的实体。”智能”智能体是那些能够与人类用户以及尤其是与其他智能体交互的实体：它们必须能够在没有“人–机接口”的情况下独立运行；必须超越任务导向，在未被明确指示如何执行任务的情况下达成目标。智能体被定义为软件工具：与用户通过命令或直接操作的用户发起交互不同，用户参与一个协作过程，人类与计算机智能体均可发起沟通、监控事件并执行任务。智能体的性能取决于其学习用户及智能体群体兴趣的能力，学习是这些智能系统的核心，目标是获得一定的竞争力。\n\
  \n*   – 那么这些智能体如何用于信息战呢？\n\n    *   – 它们可以提供工具帮助管理海量信息。即便是基础的应用（例如 SIFT——斯坦福信息过滤工具）也能在\
  \ Usenet 用户发布的大量数据中筛选并搜索特定信息。软件应用还能通过 Personalink 发送消息而无需知晓收件人地址，软件会自行查找信息并送达。这些“智能体”严格来说并不算“智能”，但军事应用的前景是未来能够显著进步，为军事指挥部提供工具以管理、应对日益增长的数据量。\n\
  \n    *   – 它们可以部署于基础设施安全。需要进一步发展智能防火墙；通过学习用户的习惯、行为和工作环境来监控系统用户活动；利用专注于特定任务的智能体评估安全水平（如密码、认证、访问授权等）。\n\
  \n在本报告撰写之时，人工智能的能力仍不足以实现全部项目。虽然结果令人鼓舞，但仍存在诸多局限。作者所展望的前景目前尚未能付诸实现。\n\n#### 3.4.5.1.\
  \ *AI and memetic warfare*\n\n\n\nA meme 是信息传播、产生影响并持久存在 \\[FIN 11\\] 的信息，是一种具有传染性的思想，或特定思想和信念传播现象的现象。该概念首次在\
  \ 1976 年由 Richard Dawkins 在其著作 *The Selfish Gene* 中提出 \\[DAW 76\\]。记忆冲突的核心特征在于复制、传播\
  \ —  — 如同病毒传播 —  — 的错误认知。社交网络促进了该现象的发展。然而，记忆冲突被描述为非科学对象 \\[BUR 12\\]，并被整合到现代冲突中关于信息战的反思之中。2010\
  \ 年 4 月的《军事情报专业公报》中，上尉 Brian J. Hancock \\[HAN 10\\] 建议利用记忆学来理解叛乱运动的原因并解释其根源：“记忆本质上是一个想法，但并非每个想法都是记忆。要使一个想法成为记忆，它必须被传递\
  \ —  — 或复制到另一个人身上” \\[HAN 10\\]; “记忆是传播、产生影响并持久存在的信息” \\[FIN 11\\]。\n\n从后者定义出发，我们将保留冲突中记忆的三个关键特征：它必须传播、产生影响并保持持久。还需指出，记忆有时是负面的思想（“有害认知”\
  \ \\[MAT 98\\]），但并不局限于此，因为也有正面、幽默、建设性的记忆等。记忆本质上是通过个人到个人的模仿传播的，它要么是一个想法，要么是图像、行为或信息。\n\
  \n记忆冲突包括创造思想并将其传播。互联网和社交媒体是这种传播的载体。AI 可以是工具之一，例如通过生成信息、内容（记忆形式多样，可能性众多：文字、符号、图标、图片等），并利用互联网在不同情境和环境中适配、个性化、修改其形式和传播路径、传播强度，依据情境演变、产生的效果等进行调整。记忆战争是一场影响战、虚假信息和宣传的战争。记忆非常适合社交媒体，因为要有效，它们必须简短有力（1–10\
  \ 词） \\[FIN 11\\]。关于思想及其操控作用的这些思考由美国国防部在 DARPA 支持的项目经费提供。Robert Finkelstein 引用了部分项目，涉及思想流行病学、军事记忆学、战略沟通中的社交媒体以及叙事网络。这些项目于\
  \ 2006–2011 年间进行。Social Media in Strategic Communications (SMISC) 项目的目标是开发自动化工具和技术，以检测和识别有害记忆，并自动化应对这类攻击的手段。军事对记忆的兴趣始于\
  \ 2001 年，作为对恐怖主义的思想战争的一部分。\n\n记忆冲突必须以中和策略对抗意识形态病毒。这些病毒如同恶意软件，如今也在 cyberspace 网络中传播。虽然记忆源自文明古老，但现代通信手段极大提升了其传播速度和作用范围。要在\
  \ Web 数据洪流中定位它们，社交媒体利用 AI 进行识别（Facebook 使用名为 Rosetta 的应用）。斯坦福大学的学生利用机器学习在 2018 年生成记忆（Danklearning\
  \ 应用），能够从单张图片生成图像。\n\n记忆攻击构成对国家的威胁，可能被非对称行为体利用：\n\n> “尽管我们目前无法确定未来 25 年记忆技术在心理战实践中的有效性程度，但正如格拉布斯所示，我们必须保持警惕。对那些在陆地、海洋和航空传统战场无法与我们匹敌的敌人而言，心理战场是一个诱人的替代选择。”\
  \ \\[MAT 98\\]\n\n因此，它属于另外两类病毒：细菌病毒和计算机病毒。\n\n### 3.4.6. *Example 1: the war in\
  \ Syria*\n\n在现代冲突中，新技术、新武器和新战术或新策略不断被尝试。AI 自然在叙利亚冲突（针对伊斯兰国家的战争）中占据了位置。其多方面的影响不能仅限于军事对抗本身，必须纳入冲突观察。特别是战斗的影响、平民所受暴力、人道考量以及法律必须被考虑。AI\
  \ 在武装冲突的总体框架下，逐步扩大其作用范围，投入其多维方面。\n\n在叙利亚冲突背景下，AI 例如促成了由初创公司 X2AI 开发的 Karim 应用，该应用通过聊天机器人为叙利亚难民提供心理支持\
  \ \\[SOL 16\\]。该应用基于自然语言处理，使用阿拉伯语对话来检测个体的情绪状态并提供建议。该应用在难民营中通过 Field Organization\
  \ Team 协会的支持进行公开。该应用旨在支持难民的心理健康，许多难民经历了情感创伤。\n\n一个机器学习应用被用于统计伤亡人数⁴³，并列出叙利亚战争的假新闻\
  \ \\[ABU 19\\]。\n\nFacebook 则被指控删除了可能构成战争罪证据的视频。旨在自动删除被标记为“恐怖分子”的内容的算法，往往包含显示暴行的视频。对这些视频的分析可以识别施害者、战争罪行、发现事实、了解日期等信息，这些信息对于行使国际司法至关重要，却被平台如\
  \ Facebook 和 YouTube 的自动内容清除所抹去。YouTube 在 2018 年全球每天约删除 90,000 条视频。Facebook 在 2017\
  \ 年 9 月至 2018 年 9 月期间删除了 1500 万条极端恐怖内容，其中 99.5% 由机器自动删除，剩余 0.5% 由用户请求删除 \\⁴⁵。\n\n\
  AI 已在伊拉克和叙利亚的军事行动中得到整合 \\[SAY 19\\]：在叙利亚语境中，MAVEN 项目主要用于从无人机收集的图像中识别叛军。\n\n### 3.4.7.\
  \ *Example 2: events in Hong Kong in 2019*\n\n![Figure 3.17. Screenshot of the hkmap.live\
  \ application (October 11, 2019). For a color version of this figure, see www.iste.co.uk/venture/artificial.zip](img/fig3-17.jpg)\n\
  \n**Figure 3.17.** *Screenshot of the hkmap.live application (October 11, 2019).\
  \ For a color version of this figure, see [www.iste.co.uk/venture/artificial.zip](http://www.iste.co.uk/venture/artificial.zip)*\n\
  \n\n\n\n图片记录了 2019 年在香港发生的抗议活动，这些照片环绕全球。一方面，我们看到示威者大规模占据公共空间，另一方面，我们看到执法力量试图遏制人群，阻止示威者前进。在示威者与警方的对峙中，双方各自采用策略并选择战术。信息技术领域的技术储备已通过人工智能应用得到丰富：\n\
  \n*   – 当局部署了人脸识别系统，旨在识别示威者以协助执法（被视为暴乱者的人可能面临多年监禁）；\n*   – 示威者迅速调整行为，以回应这一技术视角，例如遮住脸部或用雨伞和激光束挡住摄像头（固定或无人机搭载）；\n\
  *   – 示威者破坏智能路灯，担心其装有监控摄像头；\n*   – 在双方之间，香港公司 C&R Wise AI 开发并推广的 Edge AI 应用用于计数示威者，已在全国大学（如香港城市大学）及公共交通中用于管理人流。通过计数，该应用可验证或反驳警方的官方人数统计，结果因此可服务于示威者或警方的利益。公司创始人\
  \ Raymond Wong 确保该应用仅从后方计数，基于个体形状，不会追踪个人，因此不存在侵入性监控的目的或欲望，也不可能进行识别。\n\n从这些要素中，我们提取出关于\
  \ AI 在冲突情境中作用的几个重要点：\n\n*   – 如同几乎所有技术一样，AI 可以被绕过，它并非万能，弱势方在不对称作战中总能发明针对强势方的战术。例如，示威者用雨伞阻挡摄像头；\n\
  *   – 基于传感器的 AI 以及更广泛的 AI 完全依赖输入数据。通过插入雨伞或口罩，无法捕获数据，AI 无法发挥作用，因为它未接收到数据。AI 可在数据和传感器层面受到攻击，无需对抗黑客或科学技术知识。仅需示威者行为的轻微改变，即可实现对\
  \ AI 的抵抗；\n*   – AI 的物理、材料延伸（如摄像头）易受破坏、破坏和物理暴力的侵害；\n*   – 智能城市中的危机或冲突形式与传统、未连接、非现代化城市不同。无人机可作为安全或监控的替代方案，但无人机拍摄的图像无法捕捉面部特征。未来智能城市、物联网环境将成为居民日益难以摆脱的监控空间；\n\
  *   – AI 的使用补充而非取代 cyberspace 中已常规的行动，即示威者方面使用社交网络、移动电话、直播及各类移动应用及影响战术；警方方面则进行社交媒体监控、通信拦截、部分关闭互联网等行动；\n\
  *   – 中国当局通知 Apple，要求其从 App Store 中移除 hkmap.live 应用，该应用可用于定位警方，当局称其可能被示威者用于逃避执法，也可能被袭警的犯罪分子利用。该美国公司在中国设有业务，不得不响应中国当局的请求。\n\
  \n### 3.4.8. *Example 3: malicious AI attacks*\n\n场景：欺诈邮件通过垃圾邮件钓鱼传播，但这些邮件由 AI 驱动。借助这种“引擎”，每封邮件都会针对目标进行定制。邮件被语境化处理，即自动插入合法邮件流中，几乎无法与真实邮件区分，这使得传统网络安全工具的识别和检测变得非常困难，甚至不可能。AI\
  \ 在 *malware* 中的用途在于让合法邮件看起来合法。\n\n这种伪装成合法人士的攻击形式已在某些情况下出现，包括身份盗窃。但随着 AI 的发展，这种手段一方面实现自动化，另一方面更加透明。正是其“冒充他人”的能力，使得恶意软件得以利用。借助\
  \ AI，这种伪装能够更精准地诱骗人类和系统。结果是，合法与非法之间的界限被削弱，外观上几乎没有或很少有信息能够区分两者。当伪造内容的可信度与真实内容相当（如聊天机器人冒充真实用户、通过深度伪造操纵图像和声音从而影响感知），当假货与真实一样可信时，我们该如何区分应放置和应接受的内容？原本合法的内容如今可能因被怀疑不法而受到危险。\n\
  \n这些虚假、人工生成的内容、 decoys（诱饵）以机器之速生成，以光速在光纤中传播，能够迅速超越任何严格的人类应对措施。人类的速度无法与机器相提并论。然而，在信息操控、虚假信息传播中，最先产生信息的人拥有优势。对抗这些言论则需要巨大的努力去反驳、证明并削弱首条信息的影响。\n\
  \n对于 AI 机器而言，生成看似人类制作的可信内容并不复杂。例如，在社交媒体上，人类写的信息通常字符数少、论证不充分、对拼写较为自然（自然语言简化），并使用符号、缩写、“代码”，这些都很容易被机器学习。\n\
  \n### 3.4.9. *Example 4: swarming attacks*\n\n当攻击者 swarm（集群）时，哪些形式的抵抗、安全和反击对策会出现？集群是否不可战胜？\n\
  \n通过 AI，将大量无人机连接起来，一次性发射对目标的攻击成为可能。因为 AI 使得通信机器成为一个整体、一个身体，其每个部分都属于整体，并能够改变形态和对目标施加的力量。目标可能会被迅速压倒。是否可以用集群防御来对抗集群进攻？对孤立目标而言，针对集群攻击的防护措施有哪些？\n\
  \n对攻击者而言，可以设想多种情景。他们会根据目标是孤立的还是集群，配置其 swarm。\n\n孤立目标可能包括：\n\n*   – 配备 AI：\n\n  \
  \  *   \\- 未受保护，\n\n    *   \\- 受保护：有 AI 或无 AI，\n\n    *   \\- 反应性，\n\n    *   \\\
  - 非反应性；\n\n*   – 未配备 AI：\n\n    *   \\- 未受保护，\n\n    *   \\- 受保护：有 AI 或无 AI，\n\n\
  \    *   \\- 反应性，\n\n    *   \\- 非反应性。\n\n swarm（假设必须携带 AI）可以是：\n\n*   – 未受保护；\n\
  \n\n\n- `protected`;\n- `reactive` (`counter-attack`, `resistance`, `resilience`);\n\
  - `non-reactive` (`passive`, `will not react against the aggressor` and may be limited\
  \ to `resilience`).\n\nThe `swarm` can constitute:\n\n- `of communicating individuals`\
  \ (`a crowd`, `an army`, etc.);\n- `of drones`, `robots`, etc.;\n- `from malware`;\n\
  - `of sources of information` in the case of an information war attack (`cloud of\
  \ websites`, `media`, real or fake accounts on social media, etc.). `AI` facilitates\
  \ the creation of virtual Internet users, automated content, and adaptation of the\
  \ content produced to the objectives and evolution of the context.\n\n### 3.4.10.\
  \ Example 5: crossing universes with AI and without AI\n\nJust as the contemporary\
  \ world can be divided into two groups, on the one hand the connected and cyberspace-linked\
  \ spaces, and on the other hand the unconnected areas or those without links to\
  \ cyberspace (the latter tending to shrink thanks to mobile communications, but\
  \ still constituting a very large space on the planet), we can consider several\
  \ universes in relation to AI:\n\n- `an environment devoid of any AI [AI0]`;\n-\
  \ `a fully AI environment`, all AI `[AI1]`;\n- `a mixed environment`, including\
  \ some AI. The environment is not entirely dependent on AI `[AI2]`:\n\n  - `this\
  \ environment may result from a construction`, for example, a system in which a\
  \ few AI components are integrated,\n  - `it can also be the result of an AI intrusion\
  \ into [AI0]` when, for example, an AI attacks a system that does not have an AI\
  \ to protect it,\n  - in both cases, AI appears as a new element that will influence\
  \ the environment with solely its presence, whether hostile, aggressive or not.\n\
  \nWe will consider that:\n\n- `[AI1]` is rare;\n- `[AI0]` is probably dominant;\n\
  - `[AI2]` is gradually expanding.\n\nQuestions can then be raised about the balance\
  \ of power and the balance of power between these circles:\n\n- `What will a confrontation\
  \ between [AI0] and [AI1] look like?`\n- `Is [AI1] > [AI0]`? In the asymmetry between\
  \ the two configurations, which can get the better of the other?\n- `Is [AI1] >\
  \ [AI2]`?\n- In `[AI2]`, does AI take over the entire environment? Does it dominate\
  \ everything that is not AI?\n\n1. 1 “`Cyber`” includes here all the derivatives\
