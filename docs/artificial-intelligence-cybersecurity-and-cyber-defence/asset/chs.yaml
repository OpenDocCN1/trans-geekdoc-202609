  * `safety`和`governance`（安全和治理）；\n* `security`，特别是`cybersecurity`（网络安全）以及人工智能的军事化（人工智能在武器系统中的应用）。\n\
  \n在`cybersecurity`（网络安全）方面，报告的一个优先任务是开发人工智能工具，能够自主检测、评估并修补软件漏洞，以便在黑客利用之前进行修复。报告中提到了\
  \ DARPA 的`Cyber Grand Challenge`（CGC），该挑战赛旨在实现这一目标，并且已经取得了一些有趣的成果。\n\n在`defense`（国防）方面，报告回顾了美国的立场：美国将仅在遵循国际人道法原则（包括`distinction`和`proportionality`原则）的前提下，发展自主智能武器。\n\
