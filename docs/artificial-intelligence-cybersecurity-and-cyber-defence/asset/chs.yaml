  \n## 3  \n\nArtificial Intelligence and Defense Issues\n\nFrom the introduction\
  \ of this book, we wanted to recall how AI came to be considered as a “cyber” technology,\
  \ with AI a building block contributing to the expansion of the latter. AI is therefore\
  \ an object that has found its proper place in the processes of appropriation of\
  \ NICTs in the military field for several decades now.\n\n## 3.1. Military policies\
  \ and doctrines for AI: the American approach\n\n### 3.1.1. *American defense AI\
  \ policy*\n\n#### 3.1.1.1. *AI in speeches by the Secretary of the Department of\
  \ Defense*\n\nThe online archive published on the United States Department of Defense\
  \ website provides 1,310 transcribed speeches covering the period 1995–2019. However,\
  \ not all the speeches delivered during this period are available. We therefore\
  \ have only a subset, but the corpus is sufficiently complete to offer a vision\
  \ of the evolution of the way in which problems, priorities and concepts are taken\
  \ into account in the thinking of American defense officials.\n\nSimply counting\
  \ the terms used throughout the corpus, we have observed the position these concepts\
  \ have been given (the figures provided here represent the number of times the term\
  \ or expression occurs within the whole corpus).\n\nThe first observation is that\
  \ so much attention is still paid to AI that all the speeches dealing with “cyber”\
  \ issues are centered on the terms derived from it, and on highly generic terms\
  \ (cyberspace, Internet, computer). The term “smart” also prevails over the term\
  \ “intelligent” and the robot precedes AI. Although the frequency of terms alone\
  \ cannot reflect the importance given to an object, the gap between the cyber domain,\
  \ in the broadest sense, and the treatment of AI is such that the latter appears\
  \ to be of lesser importance. For comparison, “nuclear” is mentioned some 2,126\
  \ times and “missiles” are mentioned 2,328 times. AI is relegated to the background\
  \ of analyses issued by the Secretaries of Defense. This simple observation therefore\
  \ goes against the image one might have of American defense strategies and priorities.\
  \ Although, on the one hand, military investment in R&D, arms acquisitions or systems\
  \ equipped with AI seems very substantial, AI has not yet acquired a priority status\
  \ that would make it one of the central objects of discourse. More likely, it is\
  \ understood, implied and implicitly integrated into the very broad “cyber” theme.\n\
  \n**Table 3.1.** *Presence of concepts in the corpus of speeches by the US Secretary\
  \ of Defense*\n\n| Term, expression || n |\n| --- | --- |\n| Cyber¹ || 1,910 |\n\
  | --- | --- |\n| Internet || 396 |\n| Compute² || 394 |\n| Smart || 255 |\n| Robot³\
  \ || 83 |\n| Artificial Intelligence || 40 |\n| Intelligent || 21 |\n| Machine Learning\
  \ || 10 |\n| Deep Learning || 8 |\n| Autonomous weapon || 5 |\n| Expert system ||\
  \ 1 |\n| Neural Network || 1 |\n\n#### 3.1.1.2. *DARPA’s strategic computing initiative\
  \ (1983)*\n\nOn October 28, 1983, DARPA published “Strategic Computing. New-Generation\
  \ Computing Technology: A Strategic Plan for its Development and Application to\
  \ Critical Problems in Defense” \\[DAR 83\\]. By combining advances in AI, computing\
  \ and microelectronics, the agency wants to create a new generation of technologies\
  \ for intelligent machines. At this point, DARPA considered it appropriate to use\
  \ the results obtained in various fields: in expert systems, in vision, in language\
  \ (speech), in the understanding of natural language by machines, all of which now\
  \ allow interaction between humans and machines. Machine intelligence, which is\
  \ the objective of this program, is therefore more than AI, which is only a necessary\
  \ component. This achievement implies the use of AI, expert systems (which the report\
  \ sometimes associates with AI and sometimes dissociates from it), new theoretical\
  \ contributions from computer science, progress in machine architecture (computers),\
  \ the design of microsystems and microelectronics. In a pragmatic way, the military\
  \ can then hope that this scientific and technological convergence will open up\
  \ prospects in terms of new armaments, in particular, autonomous systems capable\
  \ of reconnaissance and attack missions: “The possibilities are quite startling,\
  \ and suggest that new generation computing could fundamentally change the nature\
  \ of future conflicts.”\n\n\n\n从达尔帕专家的角度来看，这些学科所取得的进展具有重要意义，标志着一次突破。可以想象出具有人类智能相似能力的机器，设想人与机器、机器与环境之间进行真实自然的交互；可以认真考虑赋予机器自主完成复杂任务的能力。这些机器将服务于公民，也服务于领导者，后者现在拥有智能计算机作为助手顾问。目标并非用机器取代人类，而是通过解放人类——无论是公民还是管理者——从大量琐碎的次要任务中，或通过简化推理过程，使他们能够专注于本质，或最重要的事项：“因此，人类的注意力将日益有限地用于定义目标和对当下最具吸引力的方面进行判断。”\n\
  \n#### 3.1.1.3. The MAVEN project and the creation of the AWCFT (2017)\n\nThe MAVEN\
  \ AI project is a Department of Defense project, launched in 2017, to use ML to\
  \ distinguish individuals and objects in thousands of hours of video footage recorded\
  \ by military UAVs. The Google company that had contracted with the Department of\
  \ Defense to contribute to this project had to back down following protests by thousands\
  \ of people. However, these incidents do not challenge the project, which is being\
  \ carried out by a team created in 2017 specifically, the Algorithmic Warfare Cross-Functional\
  \ Team (AWCFT) [DSD 17], whose leadership will be entrusted to the Under Secretary\
  \ of Defense for Intelligence. This project is being implemented to accelerate the\
  \ adoption of AI in the armed forces.\n\nAt the official announcement of the launch\
  \ of this project, the Department of Defense recalled that AI must be integrated\
  \ by the defense forces (AI and Machine Learning). In this text, it talks about\
  \ urgency and the need to move quickly: “I remain convinced that we must do much\
  \ more and move much faster.” The AWCFT’s mission is to “accelerate the integration\
  \ of Big Data and Machine Learning within the Department of Defense”. The document\
  \ specifies what the armies expect from AI:\n\n\n\n-   [速度是人工智能的目标之一，也是其附加价值之一：“AWCFT\
  \ 的目标是以速度将国防部拥有的巨量数据转化为可操作的情报和洞察”。挑战在于学习如何使用海量收集、创建、存储并可用的数据，使其对军队职能发挥作用。应受益于这些进步的系统是战术无人机以及这些无人机产生的图像和视频的处理，其使用在未来几年将持续增长\
  \ \\[SHA 18a\\]。这些能力必须满足在所谓伊斯兰国战争（击败伊斯兰国行动 \\[ALL 17\\]）背景下持续作战的需求。AWCFT 必须加速大数据和机器学习的实施，以利用部队收集的大量数据。第一项任务属于击败伊斯兰国的战争，必须加快或自动化无人机数据的处理、使用和传播，以克服人类处理这些巨量数据的能力不足，高效产出有价值的情报（机器的分析能力大于人类在图像及所有类型数据中查找相关信息的能力），并且更快，以强化军事决策过程。项目的紧迫性由伊斯兰国的威胁以及尽快击败该组织的雄心所正当化。因此，目标是在\
  \ 2017 年底前于作战区域部署 AI 算法。该方法和项目因此不是投入长期研发，而是利用军事官员认为符合其即时需求的现有技术和最新技术 \\[FRE 17\\\
  ]。军方将从能够满足定义需求的私营行业获取这些工具。AI 和 ML 似乎是唯一合理、可行且有效的选择。近年来，军队的技术化不断加深并提升了传感器（摄像头、无人机、卫星、通信拦截等）的能力，网络基础设施的容量（数据量、计算量、流量、传输速度等）以及军队使用这些工具的能力（连接、信息共享、链接武器系统、加强情报系统）。但当前仍需额外的容量，而这些容量不能仅靠数据流的速度和体积来提供。情报与分析必须进一步提升。跨越这一新阈值，据美国军方称，是保证当前及\
  \ future 所有作战冲突取得胜利的必要条件，正如网络、计算机系统以及信息空间和网络空间的主导才能保证它们在此之前。可以说，武装部队和情报机构，甚至行政机构，过去数十年来已经适应并学会在数据量巨大、完全被数据淹没的环境中存在、决策、行动和演变。信息技术的到来为数据的产生提供了新的动力。机器在被植入的数据上进行处理，并额外生成新数据，呈指数级增长。全球网络和计算机化加速了这一现象。数据过剩的局面并非\
  \ 2010 年代独有，也不是其令人难以承受的人类能力所独有 —  — 人类无法吸收或甚至阅读人类和机器生产的全部报告。因此，必须质疑这种看似突发的紧迫性是否真的是必需的。同时应记住，几十年来，军事和政治领导层对通过数据（即计算机）掌握世界的执念已根深蒂固。可以回顾越南战争期间的一些情形，美军试图依赖计算机预测冲突结果\
  \ \\[MAD 17\\]。战略家期望通过量化分析技术读取未来，而非水晶球，运用商业方法应用于战争管理。这与 2017 年美国军方设立 MAVEN 项目并宣称只要从工业方法目录中获取即可处理和解决战争事务的宣言相似。其逻辑一致：对计算机、计算能力以及数据产生的力量的信念，但前提是数据必须巨大，甚至认为仅仅将商业管理的逻辑和工具直接套用于战争管理是有效的。1960\
  \ 年代越南战争时期，计算机和程序被称为 *Hamlett Evaluation System*（HES），每天产生 90,000 页报告，数据量巨大，实际有多少比例被阅读、利用并真正有价值仍未知。其持续的\
  \ rationale 是使信息主导、信息控制、数据驱动的军事行动与胜利不可分割。整个美国军事体系被设计用来产生惊人的数据量。策略是通过大量数据的生产来追求胜利，但这种大规模生产并不等同于信息主导。罗伯特·麦克纳马拉（1961\
  \ 年任国防部长）引入计算机作为决策支持工具的作用至关重要。国防部以及州级行政机构早已拥有计算、统计数据利用的文化，自二战以来（某些用途自 19 世纪起，如使用打孔卡处理人口统计数据）就一直在使用。\
  \ \n\n-   [重点在于图像和视频处理（计算机视觉、视频）在情报功能（分析、处理、理解等）中的问题。AWCFT 必须开发用于处理这些数据的算法，并实现对无人机视频图像中物体的自动识别与检测，而该数据量已超过人类分析员和现有系统的处理能力。AWCFT\
  \ 项目将要开发的算法专注于图像识别、索引以及图像和视频中物体类别的实时检测 \\[SHA 18b\\]。第一批算法必须在 2017 年底前交付，这意味着发展速度必须加快。显然，短时间内提出的算法解决方案并非全新创造，而是在此基础上改进已有代码。\
  \ \n\n#### 3.1.1.4. *Department of Defense strategy 2018*\n\n[Department of Defense]的\
  \ 2018 人工智能战略在 *Strategic Computing Initiative* 35 年后发布（2019 年 \\[DOD 19\\]），是对\
  \ 2018 年国防战略 \\[DOD 18a\\] 的补充或扩展。它并非意外，因为防务界已经以各种形式关注人工智能和机器人技术，智能机器正是这些计划、程序和项目的主体。\n\
  \n\n主要大国数十年来一直在进行人工智能研究，通常在其武装部队的密切监督下，并自 1970 年代起多次报告其军事应用计划。这一战略再次确认了军队利用人工智能技术发起不仅涉及军备而且预示着更深刻变革的决心。这种人工智能的整合：\n\
  \n*   – 将需要培训不仅个人，还需要培训学习机器，后者需要人类专业知识；\n\n*   – 将采用商业产品，占据商业应用的 80%以上，并通过 20%的修改将其适应特定军事需求。国防部呼吁私营部门与其合作。\n\
  \n2018 年 6 月 27 日，国防部成立了联合人工智能中心（JAIC）[DSD 18]。国防部长发布的文件回顾了国防优先考虑人工智能的目标，此前已在 2018\
  \ 年《国防战略》（NDS）中表述。人工智能之所以至关重要，是因为它能“改变社会并[…]改变战争的性质”。该项目的目标是为将人工智能整合至国防部队做准备。据国防部长称，这关乎保持并提升军事优势。人工智能在军事框架中的整合及其应用是一个经济、官僚（商业改革）以及战略（利用人工智能并学习如何在战场中使用）问题。人工智能的影响必须在最广泛的范围内评估，因为它将渗透至军事机构的所有层面，可能在组织、指挥、作战艺术和官僚体系中产生影响。该项目被描述为必要且紧迫，所有国防人工智能计划亦皆属紧迫。JAIC\
  \ 的创建扩大了将人工智能整合至美国国防的努力。\n\n#### 3.1.1.5. *The American third offset strategy (TOS)*\n\
  \n“Offset strategies”指的是旨在加强军事能力以应对特定威胁的防御策略。这些策略本质上是技术导向的，建立在前沿技术创新的基础上，尽管政治或组织考量因素在决策中始终占据核心位置：“关键创新在于将这些新系统和技术与新的战略作战概念相结合”[HAG\
  \ 14]：\n\n*   – 第一次“平衡”策略出现在艾森豪威尔政府时期（1950 年代），旨在应对苏联的军事能力，其目标是发展核威慑；\n\n*   – 第二次“平衡”策略出现在\
  \ 1970 年代，旨在应对苏联的数量优势，属于长程科研与发展规划计划；\n\n*   – 最后，第三次策略于 2014 年末由国防部长查克·哈格尔（Chuck\
  \ Hagel）在发表新项目“国防创新倡议”（Defense Innovation Initiative）演讲时发起。该新战略旨在弥补美国军事优势的衰退，部分原因是反访问/区域拒止（A2/AD）能力的扩散。面对这些能力，美军的行动自由受到侵蚀。此问题于\
  \ 1990 年代出现。因此，为发展第三战略而进行的思考阶段正式于 2014 年启动，但其基于以往的政策与战略。需要克服的挑战是应对过去十年来与俄罗斯和中国在技术上的差距，这两国持续投资于武装力量现代化计划。哈格尔表示，美国必须保持其投射能力，否则美国将面临更危险的世界。人工智能带来的新机遇在\
  \ 2014 年演讲中并未明确提及，演讲仅确认了主要原则。\n\n该战略尚未完成，且已出现外国国家策略，可能会对美国项目形成反制。俄罗斯再次成为美国的主要挑战，将制定其自身策略以对抗美国。俄罗斯策略可能包括利用第一战略的原则（即加强核武库和威慑，发展战术与战略核武器系统）来应对第三战略；该策略的第二部分可能包括复制美国项目（例如\
  \ 2012 年，俄罗斯成立了先进研究基金会（ARF），该机构致力于 DARPA 类项目，其中当然包括人工智能在技术和逻辑领域的工作）[KAS 17]。\n\n\
  #### 3.1.1.6. *The quadrennial defense review (QDR)*\n\n本文库由六份报告组成，时间跨度为 1997–2018\
  \ 年，我们搜索了涉及 cyberspace 以及与人工智能和机器人相关的术语，以便在时间上定位它们、观察它们何时进入国防政策考量范畴，以及它们之间的相对权重。结果如图\
  \ 3.1 和 3.2 所示。\n\n应当回顾，2018 年 2 月，QDR 被国家国防战略（NDS）取代，仅公布了其摘要。\n\n![Figure 3.1.\
  \ QDR (1997, 2001, 2006, 2010, 2014) and NDS 2018. For a color version of this figure,\
  \ see www.iste.co.uk/ventre/artificial.zip](img/fig3-1.jpg)\n\n**Figure 3.1.** *QDR\
  \ (1997, 2001, 2006, 2010, 2014) and NDS 2018. For a color version of this figure,\
  \ see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n自 2001 年以来，美国国防政策中对“网络空间”的主题已得到充分考虑，而人工智能在该文件中直至 2018 年才出现。机器人和自主系统也是仍然相对边缘的议题，与网络空间问题相比仍显不显著。所有这些主题均未出现在\
  \ 1997 年 QDR 中。总体而言，这些主题在战略文件中不足 10 年。\n\n![Figure 3.2. QDRs from 1997 to 2018.\
  \ For a color version of this figure, see www.iste.co.uk/ventre/artificial.zip](img/fig3-2.jpg)\n\
  \n**Figure 3.2.** *QDRs from 1997 to 2018. For a color version of this figure, see\
  \ [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n然而，1997 年围绕信息战、信息作战、信息系统、信息技术（计算机、计算）等议题的主题，随后被新兴的网络主题所取代，但在 2018 年最新文件中再次出现。还需注意，这些文件中没有任何关于“专家系统”概念的引用。\n\
  \n### 3.1.2. *AI in American military doctrines*\n\n尽管人工智能自 1960 年代起即处于研究与发展阶段，主要由军方（特别是通过其研究机构\
  \ DARPA）推动，若干应用已实施，值得分析人工智能在军事教条中的位置。为此，我们遍历了大量教条文本（主要为联合出版物），查找任何对人工智能的提及，无论是明确使用“artificial\
  \ intelligence”这一术语，还是通过“expert systems”（专家系统）、“Machine Learning”（机器学习）、“Deep Learning”（深度学习）和“autonomous”（自主）等词汇间接指代。我们仅限于近年来及当前最具代表性的术语（分析的文档完整列表见附录\
  \ 2）。\n\n因此，在国防部（此处限定为联合出版物）的整个教条库中，对人工智能的引用极为罕见：\n\n\n\n\n- 在 2017 年，“联合及国家情报支持军事行动.\
  \ JP 2-01” \\[JCS 17\\] 中，AI 本质上是一种用于大规模数据处理的时间缩短工具。AI 是与数据处理相关流程的加速器：\n\n> “数据处理的进步，如人工智能、大规模数据集分析、知识库以及迭代搜索工具，已创造出一种新范式，在此范式中，情报作战的时间线和情报作业流程被大幅压缩。”\n\
  \n- 在 2019 年，“联合后勤. JP 4-0” 中简要讨论了 AI：\n\n> “联合后勤社区必须专注于以下五个方面以影响任务成功：作战准备状态、武装冲突以下的竞争、全球整合、创新以及加强联盟和合作网络\
  \ \\[…\\] ‘数据文化’提升了对大数据、人工智能、机器学习以及现代计算能力等潜在概念的理解，从而在 JLEnt（联合后勤）领域实现革命性改进。对手将致力于削弱技术优势的比较优势。未来冲突的成功可能取决于迅速采用并部署新技术，以确保持续投射和维持力量的能力。”\
  \ \\[JCS 19\\]\n\n- 在 2016 年，“障碍、障碍与反海军作战. JP 3-15” \\[JCS 16\\] 中提到了自主系统：\n\n>\
  \ “无人系统小组. 无人潜艇（UUV）团队使用 Mk 18 Mod 1 UUV 来搜寻和绘制水下目标 \\[…\\] Mk 18 Mod 1 可连续运行超过\
  \ 20 小时 \\[…\\] 它通过笔记本电脑编程，并可使用发射声音的发射标签作为导航参考灯塔，或其机载计算机可自主选择更合适的导航方式。 \\[…\\] 无人航空器团队使用无线电控制、便携式\
  \ *Silver Fox* 和 *Manta* 无人航空器 \\[…\\] 这些航空器能够完全自主飞行，并可携带多种载荷以提升任务效果和适应性。”\n\n-\
  \ 在 2014 年，“联合空域控制. JP 3-52” \\[JCS 14\\] 处理了无人机的自主性：\n\n> “无人航空器. \\[…\\] 无人机的通信链路通常比有乘员系统所需的更为关键。\
  \ \\[…\\] 虽然某些无人机可能具备自主反应（即避撞）或在失去通信（即返回基地）时的预先规划响应，但无人机通常依赖于近乎连续的数据交换，用于飞行控制和载荷管理。”\n\
  \n这份关于军事文本语料库的工作可以通过阅读所有美国国防部（DoD）指令和说明（这些指令和说明的列表可在 fas.org⁴ 网站上找到）来完成。我们特别注意到以下文本：\n\
  \n- “自主武器系统”，2012 年 11 月 21 日，“Incorporating Change 1”，2017 年 5 月 8 日。这份国防部指令 \\\
  [DOD 12\\] 定义了在武器系统中发展自主和半自主功能的条件，适用于致命和非致命、运动和非运动力量。并非所有武器系统都受此指令关于自主性的规则影响，例如在\
  \ cyberspace 中的自主和半自主系统，以及某些武器类别⁵。然而，这 15 页的文本中未提及 AI，也未提及以下术语：smart、robot、intelligence、Machine\
  \ Learning。该文档提供了自主武器系统的定义：\n\n> “自主武器系统。一旦激活，该武器系统即可在无需人类操作员进一步干预的情况下选择并击发目标。这包括人类监督的自主武器系统，它们设计为允许人类操作员在激活后覆盖武器系统的运行，但可在激活后无需进一步人工输入即选择并击发目标。”\n\
  \n该指令提醒我们，使用此类自主系统必须遵循法律和伦理框架：\n\n> “授权、指挥或操作自主和半自主武器系统的人员必须以适当的谨慎行事，并遵守战争法、适用条约、武器系统安全规则以及适用的参与规则（ROE）。”\n\
  \nAI 很少被邀请进入这些文档所涵盖的众多主题和议题，这些文档反映了国防领域正在进行的政策、战略和辩论。最后，让我们分析各军种（陆、空、海）所产生的文档：\n\
  \n### 3.1.2.1. *U.S. Army and AI*\n\n对于陆军，列表中的文档⁶ 标题中没有任何与情报、机器人或自主相关的词汇：\n\n- 但是，在\
  \ 2010 年出版的 “Cyberspace Operations Concept Capability Plan 2016–2028” 中，机器人和自主性被简要讨论：\n\
  \n> “量子计算和纳米技术的发展可能导致作战力量通过机器人和遥控、自主、微型化武器系统得到增强。通信系统可能会实现自组织和分布式。” \\[USA 10\\\
  ]\n\n- 在 2018 年出版的 “Cyberspace and Electronic Warfare Operations 2025–2040” 中，AI、机器人和自主系统也被提及：\n\
  \n> “战场上使用自主设备的增加，包括无人航空系统，给安全带来挑战。自主技术的进一步发展预示着未来机器将凭借先进算法和人工智能自行在战场上做出决策。因此，该决策算法可能被劫持，人工智能可能被腐蚀，对陆军部队和技术构成危险。鉴于自主系统的普及，需要\
  \ fail‑safe 技术和软件以保持对系统的正向控制。 \\[…\\]”\n\n> \n\n> 自主主动网络防御。开发能够通过一系列同步、实时的能力，在不进行直接人工干预的情况下发现、定义、分析并缓解网络威胁和漏洞的自主网络防御系统。该能力包括基于传感器的人工智能，能够学习并管理网络拓扑。\
  \ \\[…\\]\n\n> \n\n> 陆军采用更具远征性的网络作战能力，通过缩小许多网络和电子战系统的体积、重量和功耗，使其更适合远程、机器人和自主系统的使用。陆军部署先进的天线技术和动态频谱接入能力，以提高电子战系统（EMS）的使用效率。”\n\
  \n- “The U.S. Army in Multi-Domain Operations 2028”，2018 年 \\[TRA 18a\\]，同样无法忽视\
  \ AI 与其他技术进入军事事务的加入。文档提出了政治或战略层面的一般性陈述：\n\n> “像人工智能、高超音速、机器学习、纳米技术和机器人等新兴技术正在推动战争性质的根本变化。随着这些技术成熟且其军事应用变得更加明确，其影响有可能像机枪、坦克和航空的整合一样，开启综合作战时代。与俄罗斯不同，中国拥有经济规模和技术基础，包括独立的微电子产业和全球领先的人工智能发展进程，足以在未来\
  \ 10–15 年内超过当前俄罗斯的系统优势。”\n\n\n\n\n> “关键是通过高容量分析能力和由人工智能启用的传感器到射手链接，实现所有领域、EMS 以及信息环境的能力汇聚；这使得通过自动交叉提示和目标识别使得敌人的欺骗和隐蔽更加复杂。”\n\
  \n因此，人工智能将作为加速器（用于大规模数据处理）以及军事情报能力的乘数（实现来自多个来源的更多数据实时交叉参考，时间更短、精度更高、质量更好）。这种 AI\
  \ 对情报功能的贡献也体现在“Intelligence. 2020–2040”报告中（2017 年出版）[TRA 17]，它应提升情报收集质量、处理速度、精度，并在最终层面使军事行动更加流畅：\n\
  \n> “将人工智能集成以实现自主威胁检测与追踪[…] 人工智能与自主、快速的小型无人航空系统将提升人员与自主系统在高度机动侦察方面的协同[…] 实时事件处理、人工智能和神经形态计算使得机器学习能够对复杂情境进行更准确、更快速的全源理解。”\n\
  \n从这些发展可以看出，军方认为在人工智能领域，它将主要成为一种工具，至少部分地消除战场雾幕并降低摩擦。正是在这一领域，人工智能被认为能够增强军队，而正是在这一领域，各国军队之间因技术竞赛而展开的国际竞争正在进行。文中未将人工智能视为新型武器，亦即不把它描述为更强大或具有特殊打击力的武器。\n\
  \n在“U.S. Army Concept for Multi-domain Combined Arms Operations at Echelons Above\
  \ Brigade. 2025–2045”报告（2018 年出版）[TRA 18b]中，人工智能主要影响两个变量：人力资源（提升绩效）和决策过程（加速并改进）：\
  \ “信息技术和人工智能（AI）可能提升人员效率，降低人员需求，并加速、改进未来的决策。”\n\n2018 年 10 月，美国陆军在其内部设立了专注于人工智能的任务小组——陆军人工智能任务小组（Army‑AI\
  \ Task Force，A‑AI TF）。该任务小组的设立在《陆军指令 2018‑18》（陆军人工智能任务小组支持国防部联合人工智能中心）[ESP 18]中公布。关键在于美国陆军将人工智能纳入其最新的部队战略，并通过该任务小组与联合人工智能中心（Joint\
  \ Artificial Intelligence Center，JAIC）保持联系，帮助尽快为美国陆军制定人工智能战略。该任务小组设在匹兹堡卡内基梅隆大学国家机器人工程中心（National\
  \ Robotics Engineering Center，NREC）⁷，该中心是一家长期与美国国防体系紧密合作的机器人研究机构（自 1995 年起）。\n\n\
  《2018 年指令》列出了任务小组将重点研发的若干主题：机器学习、深度学习、自动化、自主目标识别、车辆、远程精确打击、预测性维护（以降低成本并提高可用性）、数据科学、硬件\
  \ AI、云安全与可访问性、以及新型 AI 应用的网络安全问题。\n\n### 3.1.2.2. *U.S navy and AI*\n\n*   – 在“OPNAV\
  \ INSTRUCTION 5513.1E. Department of the Navy Security Classification Guides, 2005”[DON\
  \ 05]（2005 年）中，人工智能被纳入考量：\n\n> “计算机资源。[…] 必须小心将军事敏感信息和数据库域与非军事应用或架构分开。这类别包括：\n\n\
  *   – 系统。包括应用、语言、工具、方法、管理、人工智能；\n\n*   – 人工智能。包括基于知识的（专家）系统、机器人、图像处理、自然语言处理、语音处理、神经网络。”\n\
  \n#### 3.1.2.2.1. The NCARAI\n\n海军应用人工智能研究中心（NCARAI）⁸，成立于 1981 年，是信息技术分处在海军研究实验室（Naval\
  \ Research Laboratory）内的一个研究机构。2012 年，海军研究实验室专门成立了自主系统实验室。\n\n在 1983 年 10 月的“情报界人工智能应用研讨会”[ECK\
  \ 84]上，该中心展示了其研究主题，当时主要聚焦于以下领域：\n\n*   – 战斗管理的专家系统；\n\n*   – 设备故障诊断的专家系统；\n\n* \
  \  – 利用舰船 ISAR 数据进行目标分类；\n\n*   – 应用于海军信息自动化的自然语言处理；\n\n*   – 多传感器融合；\n\n*   – 自适应控制。\n\
  \nBATTLE 系统也在研讨会中展示，其目标是为陆战队炮兵和空中支援提供武器分配方案。该项目属于作战管理程序，核心思想是实时合并多位观察员在现场上传的关于目标损伤的数据。\n\
  \n自成立以来，NCARAI 一直致力于为美国海军开发应用。该中心目前围绕四大主题⁹开展工作：智能系统（认知科学、认知机器人、人机交互）、自适应系统（机器学习、自主系统、移动机器人）、交互系统（为自主和智能系统开发界面）以及感知系统（自主系统的主动/被动传感器）。\n\
  \n#### 3.1.2.2.2. NCARAI 出版物\n\n\n\n\nNCARAI 文献库（<sup>10</sup>）包含 337 篇在线标题，涵盖 1990–2018\
  \ 年。这些文献分为技术（信息技术）文章以及结合认知科学、人文社会科学以及操作和战略考量的文章。例如，研究人员关注于“智能体在人工智能起义或叛乱”主题中的“行为”（如\
  \ [AHA 17, COM 17]），人类行为（抗议、质疑、反对、说“不”或叛乱）虽可能有益并有助于维持个体与社会之间的平衡，但对于个体和社会而言是必要的，依据社会正义的\
  \ imperative，在伦理、道德和政治上是可接受的；而对 AI 而言，则并非如此，AI 通常被恐惧或负面解读，任何叛乱的可能性都被视为危险。本文将 AI——一组在社会中扮演角色的人工智能代理——视为与人类的关系，并认为\
  \ AI 叛乱不再是威胁或破坏性的，而是可能对这些互动有用。正如个体一样，“叛乱”可能不仅仅是有用或有益，也可能是伦理或道德上的义务，或是必要的。因此，必须考虑\
  \ AI 叛乱的建设性形式，就像对人类一样，以最大化 AI 对社会的益处。AI 叛乱代理人被定义为能够发展出反对其他代理人所赋予目标或任务的态度的 AI 代理。叛乱随后可以采取多种形式：抵抗、反对、拒绝执行任务。反抗\
  \ AI 的代理人称为“交互者”，与叛乱代理人存在权力关系。交互者可以是人类或合成/人工的，也可以是个体或群体。作者随后描述了叛乱代理人的类型（意识到叛乱的代理人、未意识到叛乱的代理人、既意识到又能推理后果的代理人——即“设计叛乱”代理人），交互者、叛乱类型、叛乱动机以及叛乱阶段。通过交叉参考这些多重变量，作者提出了两种\
  \ AI 代理人叛乱情景（第一种情景考虑在灾难救援任务中，智能代理人因检测到指令错误而拒绝执行指令；第二种情景考虑协作创造情境），但基于所提议的类别，实际的组合几乎是无限的。其他研究涉及自主性、推理中的错误、欺骗检测、欺骗的作用、信任、人机交互、信息不确定性等。\n\
  \n对该文献库的统计分析显示，在涵盖的主题（如机器人、专家系统或自主性）上存在一些趋势（<sup>Figure 3.3</sup>）。\n\n![Figure\
  \ 3.3. The theme “robot” (robot, robotics) in NCARAI publications. Period 1990–2018.\
  \ Data processed using the Voyant Tools application. For a color version of this\
  \ figure, see www.iste.co.uk/ventre/artificial.zip](img/fig3-3.jpg)\n\n**Figure\
  \ 3.3.** *The theme “robot” (robot, robotics) in NCARAI publications. Period 1990–2018.\
  \ Data processed using the Voyant Tools application. For a color version of this\
  \ figure, see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n机器人相关议题在近 30 年的时间里相对稳定，而自主性问题自 1990 年代起就被纳入考虑，但自 2010 年起使用频率更高。\n\n![Figure 3.4.\
  \ The theme “autonomy” (autonomy, autonomous) in NCARAI publications. Period 1990–2018.\
  \ Data processed using the Voyant Tools application. For a color version of this\
  \ figure, see www.iste.co.uk/ventre/artificial.zip](img/fig3-4.jpg)\n\n**Figure\
  \ 3.4.** *The theme “autonomy” (autonomy, autonomous) in NCARAI publications. Period\
  \ 1990–2018. Data processed using the Voyant Tools application. For a color version\
  \ of this figure, see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n在审查期间，与机器人相关的议题占主导地位，而对 cyberspace 本身的考虑较少。AI 已经超越了“cyber”问题，该问题仅在 2002–2006 年间以\
  \ *ad hoc* 方式被讨论。\n\n![Figure 3.6. The “artificial intelligence” and “cyber” themes\
  \ in NCARAI publications. Period 1990–2018. Data processed using the Voyant Tools\
  \ application. For a color version of this figure, see www.iste.co.uk/ventre/artificial.zip](img/fig3-6.jpg)\n\
  \n**Figure 3.6.** *The “artificial intelligence” and “cyber” themes in NCARAI publications.\
  \ Period 1990–2018. Data processed using the Voyant Tools application. For a color\
  \ version of this figure, see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n最后，需要指出的是，没有一篇文章在标题中引入“专家系统”、“战争”或“战役”、“犯罪”、“安全”的概念；此外，“防御”概念几乎被忽略（仅出现一次）。主要概念包括“认知系统”、“人类”、“社会”、“推理”、“学习”、“机器人”、“交互”、“规划”和“自主”。\n\
  \n### 3.1.2.3. *U.S. Marine Corps and AI*\n\n在 1996 年出版的《MCDP 6 命令与控制》中<sup>[DON\
  \ 96]</sup>提到专家系统，但未提及 AI：\n\n> “专家系统和人工智能在一定程度上可以辅助认知——例如帮助整合已处理的数据碎片。但认知主要是人类的精神活动——并非主要是像处理那样的程序性行为，而是一种基于经验和直觉的学习行为。我们通过*判断*将复杂的知识片段转化为理解，这是一种纯粹的人类技能，基于经验和直觉，超出当前任何人工智能或专家系统的能力。判断无法简化为程序或规则（无论多么复杂）。”\n\
  \n2003 年，“MCWP 3-42.1. 无人机作战（14  August 2003）<sup>[USM 03]</sup>”更具体地讨论了 UAV 的使用：\n\
  \n> “无人机——一种由动力驱动的空中平台，不携带人类操作者，利用升力产生飞行能力，可自主飞行或远程操控，可一次性使用或可回收，可携带致命或非致命载荷。”\n\
  \n### 3.1.2.4. *U.S. Air Force and AI*\n\n美国空军的教义多年涉及自主性、AI 和专家系统，但似乎没有正式的教义文档将\
  \ AI 作为整体或唯一焦点加以论述。\n\n对于“自主性”这一概念，我们在 2008–2017 年期间参考了四份文献：\n\n*   “AFDD 3-01,\
  \ Counterair Operations, 1 October 2008, interim change 2, I November 2011”： “为防止友军火力误伤，在防御性反气空作战中使用自主作战识别时应格外慎重”；\n\
  \n\n\n- “AFDD 3-40, Counter-Chemical, Biological, Radiological and Nuclear Operations,\
  \ 26 January 2007, Interim Change 2, 1 November 2011”: “无人飞行器。不携带人类操作者的飞机或气球，能够在远程控制或自主编程下实现飞行”；\n\
  \n- “Energy Horizons: United States Air Force Energy S&T Vision 2011–2026, AF/ST\
  \ TR 11-01, 31 January 2012” [SAF 12]: “未来无人机和自主飞行器可以针对传统飞行器目前完成的特定机动和作战任务进行定制，并以更小的总体能源足迹完成”；\
  \ “自主作战的鸟型微型无人机要求在相当于高尔夫球大小的大脑的物理空间中进行高容量计算操作”；\n\n- “Air Force Instruction 63-101/20-101,\
  \ May 9, 2017” [SAF 17]: “在开发自主和半自主武器系统时，评估指令（DoDD 3000.09）中的要求和指南”。\n\n同样地，对于人工智能（AI）的概念，我们在\
  \ 2005–2017 年期间识别出三份文献：\n\n- “AFDD 3-13, Information Operations, January 11, 2005,\
  \ incorporating Change 1, July 28, 2011”，仅在参考文献中提及，未使用 AI 这一概念，而是引用《信息的崇拜：一本关于高科技、人工智能和真正思考艺术的新卢德主义论文》¹¹；\n\
  \n- “Energy Horizons: United States Air Force Energy S&T Vision 2011-2026, AF/ST\
  \ TR 11-01, 31 January 2012” [SAF 12]:\n\n> “更远期的 AF 愿景涉及冗余、分散、协作的系统，在受到挑战、拥堵和竞争的环境中运行。要实现这一愿景，需要在人工智能以及控制理论方面进行根本性的新思路，这些思路远超当前无人机和机器人研究的范畴。”\n\
  \n- “Air Force Manual 15-129, Vol. 2 (2011/2017)” [SAF 13]:\n\n> “集成天气效应决策辅助工具（IWEDA）。IWEDA\
  \ 是基于规则的 TDA 应用。IWEDA 支持陆军和空军系统，并提升互操作性。IWEDA 采用人工智能技术以及大气效应模型数据，以增强和扩展当前的天气决策能力。它允许指挥官比较友好和敌对系统的天气基础优势/劣势。”\n\
  \n最后，关于“专家系统”这一概念，我们识别出两份文献（2002 年和 2011 年），其中提及了它：\n\n- “AFDD 6-0, Command and\
  \ Control, June 1 2007, incorporating Change 1, July 28, 2011”:\n\n> “C2 过程是明确决策的结构化基础。技术要么自动化，要么加速这些过程，通过信息技术的进步，如数字电子通信、计算机以及专家系统”；\n\
  \n- “Air Force Handbook, Vol. 5 36-2235, 2002” [SAF 02]:\n\n    * “专家系统能够识别学生常犯的错误，检测并诊断错误，并提供信息以纠正那些通常需要教练才能发现的误解”；\n\
  \n    * “由于专家系统的开发成本高昂，它们通常保留用于教授高风险知识和决策技能。这种培训可能是准备军事人员参加重大军事演习的适当且具成本效益的方式。”\n\
  \nAI 及其相关概念在美军关于信息、网络空间、信息系统、数据及信息控制问题的考量中几乎完全缺失。美国空军在过去数十年里，一直通过挪用信息和通信技术来构建其教义，把自己定位为信息和网络空间主导的关键玩家，同时在话语中排除了\
  \ AI。\n\n### 3.2. 军事 AI 在俄罗斯\n\n俄军以及全球军队认为，下一场战争将以惊人的速度进行，在这种条件下，人类将无法跟上节奏，决策者也将无法及时接收、处理信息并作出决策。作战节奏将加速。只有机器人和智能、自主系统才能在这种环境中发挥作用。但加速也源于这些系统的引入。防务专家谢尔盖·西科夫（Vasily\
  \ Sychev）认为，这些系统本身不会对人类构成威胁，因为机器不会反叛。如果智能、自主且日益强大的毁灭系统是威胁，那是因为它们的拥有者感到无罪感 impunity\
  \ [SYC 15]。\n\n瓦迪姆·科兹尤林（Vadim Kozyulin）[^KOZ 18] 识别出三类来自自主武器系统（由 AI 驱动）的威胁：\n\n\
  *   – 风险：排除人类决策环节；\n*   – 风险：削弱国际平衡，使非核国家能够凭借新一代 AI 武器实现平等，AI 作为威慑武器，因其具有进攻性和防御性潜力；\n\
  *   – 风险：缩短决策和响应时间。计算机和网络使得能够设计超越人类能力的 C4ISR 系统成为可能。大规模数据的分析现在由超级计算机完成，负责提取信息并为政治与军事领导人生成情景。然而，后者陷入加速的节奏，已无足够时间进行决策，而决策本身也依赖于算法处理的数据。\n\
  \n据他所述：\n\n*   –  AI 使得所有可自动化和机器人化的任务都将被实现；\n*   – 传统军队将被重新配置并组合，以产生更有效的行动；\n* \
  \  – 横向和纵向信息交换（如地面到空中、步兵到飞行员）将得到优化。并非所有参与者都会收到所有信息，只有机器根据多种战术、作战和战略标准判断出的、对其有用的信息才会被传递。\n\
  \n塞尔盖·阿布拉莫夫（Sergei Abramov），武器工业部门主管，认为在缺乏对目标本质的确定性之前，完全自主的武器系统无法实现。基于 AI 的自主武器系统已经存在，但不可能用机器取代人类。他指出，自主武器的目的和价值不是取代人类，而是让人类对系统拥有更大的控制权，更清楚自己被要求做什么以及如何做\
  \ [MAK 19]。2007 年南非发生的严重事件 —  — 九名士兵死亡 —  — 被引用为机器人或自动化系统潜在缺陷的例证（尽管专家随后否认了这一解释）：2007\
  \ 年 10 月，在军事演习中，一挺失控的奥里康（Oerlikon）防空炮在自动目标检测与追踪系统的作用下，误伤了多名士兵。该炮虽配备自动目标检测与追踪系统，但仍由人工操作员控制。此事件成为（\
  \ rightly or wrongly） illustrate 出机器失控风险的典型案例，当其系统出现故障（bug、攻击）时。\n\n\n\n\n-   [关于俄语文献中人工智能军事化及其在现代战争和国防事务中的地位的论述](https://wiki.example.org/feynmans_learning_method)\
  \ 一般倾向于支持这些新技术的发展，认为其进程既是不可避免的，也是应对复杂作战场域（如城市战争）以及与全球主要竞争大国在武器竞争中保持平衡的必要手段。鉴于人工智能技术已成熟且必须使用，监管、立法和国际协议等可在后期考虑，但关于人工智能在战争艺术中的地位的思考并未排除人类与智能机器之间的关系问题，反而强调保持人类在指挥职能和战略决策中心的重要性，同时承认人类在数据处理量和速度上相对于这些机器处于劣势，无法以相同规模和速度处理数据。\n\
  \n1.  人工智能通过提升武器、武器系统、决策过程和数据分析的有效性，推动了技术在战争和军队中的不可避免演进，这一过程无需也不能被阻止：\n\n    - 由于技术易于获取、战争日益技术化以及人工智能在此过程中极具价值，遏制军事化人工智能的发展是不可能的；人工智能可应用于多种场景[LOS\
  \ 17]。人工智能与士兵的交互、无人军事车辆、机器人、自主武器、 directed energy（ directed energy）和高超音速武器等都是现代武器的关键领域；自动模式识别（APR）技术使卫星图像和雷达分析更快更高效；小型卫星数量的激增及其观测能力的同步增长，对快速强大的数据处理系统提出要求，能够区分军事区域或目标（如车辆）并将其与民用区域区分开来；在战场上，人工智能将提升视觉能力，例如识别敌军使用的武器类型；\n\
  \n    - 美国在其霸权计划中，终将对俄罗斯或中国发动军事战争，而非仅是经济战争。对俄罗斯而言，继续发展突破性技术（如人工智能）以保持与美、中在战略平衡上的平等至关重要。通过维持技术和军事力量的水平，俄罗斯才能在全球局势日益脆弱的背景下保障其国际地位。在防御技术竞赛中，俄罗斯的财政能力低于美、中，此时人工智能有助于弥补这种不平衡，尤其是在提升战略决策过程效能方面[LOS\
  \ 17]；\n\n    - 通过人工智能追求权力必然引发军备竞赛，非国家行为体也可能参与其中；恐怖主义的技术机会也被提及[LOS 17]。\n\n-   *战争与军队日益技术化*\n\
  \n    人工智能通过使武器、武器系统、决策过程和数据分析更加高效，推动了这一不可避免的现象。这一过程无需也不能被阻止：\n\n    - 由于技术易于获取、战争日益技术化以及人工智能在此过程中极具价值，遏制军事化人工智能的发展是不可能的；人工智能可应用于多种场景[LOS\
  \ 17]。人工智能与士兵的交互、无人军事车辆、机器人、自主武器、 directed energy（ directed energy）和高超音速武器等都是现代武器的关键领域；自动模式识别（APR）技术使卫星图像和雷达分析更快更高效；小型卫星数量的激增及其观测能力的同步增长，对快速强大的数据处理系统提出要求，能够区分军事区域或目标（如车辆）并将其与民用区域区分开来；在战场上，人工智能将提升视觉能力，例如识别敌军使用的武器类型；\n\
  \n    - 美国在其霸权计划中，终将对俄罗斯或中国发动军事战争，而非仅是经济战争。对俄罗斯而言，继续发展突破性技术（如人工智能）以保持与美、中在战略平衡上的平等至关重要。通过维持技术和军事力量的水平，俄罗斯才能在全球局势日益脆弱的背景下保障其国际地位。在防御技术竞赛中，俄罗斯的财政能力低于美、中，此时人工智能有助于弥补这种不平衡，尤其是在提升战略决策过程效能方面[LOS\
  \ 17]；\n\n    - 通过人工智能追求权力必然引发军备竞赛，非国家行为体也可能参与其中；恐怖主义的技术机会也被提及[LOS 17]。\n\n-   *人工智能与机疆将催生新武器，但近期不太可能出现类人机器人*\n\
  \n    虽然长期而言，智能类人机器人仍不可完全排除，但短期内，更有可能出现无人机、“智能”机器人形式的传统武器、车辆、工业机器等的发展。人工智能将嵌入已有武器系统，提升或修改其作战模式[LOS\
  \ 17]。\n\n    我们不能阻止依赖人工智能的技术演进，因为它是目前唯一能够弥补人类无法以同等速度处理数据、思考和行动的解决方案。\n\n    数据量的激增及实时处理需求，以及需要解释的数据量，已远超人类能力。智能系统的任务还包括保障国防系统的网络安全（发现漏洞、攻击、反应、反击）[LOS\
  \ 17]。\n\n-   *人工智能可应用于所有军事职能*\n\n    军事化人工智能的任务可分为四类：信息、战术、战略和经济。数据采集与分析能力的提升将为战术和战略提供速度与质量优势[LOS\
  \ 17]。\n\n    人工智能在军事领域的应用并非直接致命（如提升后勤——所谓的智能后勤、增强预警能力、雷达等）；在武器系统及作战行动中辅助士兵；在决策过程层面协助定义战略情景等。人工智能在军事事务中可定义为系统、模型和设备在军事领域模仿人类智能活动（感知、推理和逻辑决策）的应用领域[STE\
  \ 19]。\n\n-   *人工智能开辟新的作战模式*\n\n    人工智能在战术武器使用上的可能性众多。由于成本低廉，无人机现在可以大量生产，并可由人工智能管理为舰队或群体，实现协同作战。以一架战斗机的价格，军队可以负担数十万架配备爆炸装置的无人机，成为强大武器。此类技术可用于创建“群体”或“包围”武器（导弹、无人机、陆地机器人等），需要人工智能、计算机化和通信系统，其性能来源于适应性、分析能力、集体决策和集体适应性（如美国海军的\
  \ CARACaS 应用，用于管理无人船和无人机舰队）¹²。现代战争策略已要求部队部署方式发生变化，这些新部署规则必须整合新一代武器的影响，也改变了作战方法。依赖人类推理与决策的无人机群，迫使重新审视个人角色以及人与机器、人与系统、人工智能与人类之间的互动[LOS\
  \ 17]。\n\n-   *人工智能充填信息空间，构建并丰富它*\n\n\n\n\nAI 通过大量人工数据丰富信息空间，以诱惑其他系统（无论是否智能）。这些\
  \ AI 生成的内容被称为“虚拟真相”。这些做法并非没有风险，因为成为这些虚拟真相诱饵的受害者——无论是政治反对集团（例如会被陷害），还是政府、武装部队等——都会面临被陷阱所困的风险。操纵的可能性范围将得到扩大\
  \ \\[LOS 17\\]。\n\n美国被描绘为信息领域的积极参与者。莱昂尼德·萨金的文章 \\[SAV 19\\] 指出美国国防部的做法旨在操纵公众舆论，通过制造假新闻和伪迹，利用\
  \ DARPA 开发的 AI 技术，制造指控第三方的伪迹。DARPA 的工作被认为包含约 20 个 AI 程序和 60 个网络安全项目。\n\n2018 年，俄罗斯国防部部长及副部长呼吁科学界和产业界合作，推动\
  \ AI 在网络战中的发展，这在当今几乎所有冲突中都不可或缺。他们认为，凭借其在数学研究方面的卓越优势，俄罗斯可以在 AI 时代开启新纪元，因为单纯的计算速度已不足以满足需求；需要智能系统来处理和存储信息。所有这些技术贡献都孕育了新一代更强大、更快、更精准、更具韧性且难以被发现的武器。\n\
  \nAI 是网络中心化战争的关键因素 \\[RUD 19\\]。2008 年对格鲁吉亚的冲突凸显了俄军组织的多个弱点：情报和通信能力薄弱、部队控制与武器管理流程自动化程度低、部队信息系统薄弱。面对系统产生的巨量信息，决策者已无法进行正确的分析和选择。任务庞大，远超人类的处理能力。\n\
  \n只有基于神经网络的智能软件解决方案才能应对海量数据和复杂性。\n\n*必须考虑人与 AI 关系的问题*\n\n在现代自动化武器系统中，人类的角色仍然不可或缺。但相较于系统和\
  \ AI，人类的主要弱点是速度。人类无法像系统那样以同样的速度行动、决策、反应、分析并综合所有环境数据。相对于这些军事技术，人类脆弱且低效，是决策链条中最慢（甚至是最慢）的环节之一\
  \ \\[LOS 17\\]。\n\n俄罗斯联邦副国防部长鲁斯兰·茨利科夫表示，俄军长期使用 AI。20 世纪 70、80 年代，初创的 AI 在军事领域的应用仍然有限。2020\
  \ 年，局面发生根本性变化：AI 驱动的自主无人机和电子助理已出现。AI 实现了拥有“ impartial（中立）、精准、快速执行任务、顺从命令、能够迅速分析局势、第一击（最优化\
  \ OODA 循环）的士兵”这一梦想。战争日益技术化，形式往往令人惊讶且隐形。平民所执行的任务可能是军事行动的一部分，但他们往往并未意识到。\n\nAI 本身毫无作用，它依赖于人类的初始决定和他们所制定的项目。没有人为介入，它不可能变得危险或暴力。因此，我们不能指望机器独立指挥军队、在战争中自行决策。短期内，指挥与控制（C2）不会被\
  \ AI 取代。相反，可以实施统一的防务系统，例如空防，在选择最合适的销毁手段时，会综合考虑目标、威胁等级等变量 \\[NIK 19\\]。\n\n*智能系统的依赖与效能并不排除信任问题*\n\
  \nAI 决策系统是否无懈可击？例如，装备 AI 的坦克若必须代替指挥官做出射击决策，是否会误伤自己的士兵或空降兵？保险在于 AI 的知识储备：它必须拥有全部所需知识（即被教导的内容），能够区分敌对目标、识别友军以及辨识非敌人。士兵的生死与系统和\
  \ AI 的质量直接相关。系统本身的效能取决于其自身的安全性和不可侵犯性（尤其是对 AI 的防护）。AI 易受黑客攻击、破坏以及作战中断的威胁 \\[LOS 17\\\
  ]。\n\n*AI 能否成为威慑武器？其战略作用是什么？*\n\nAI 的战略力量引发诸多疑问。有人认为，AI 仅仅出现在武器系统中，其存在本身就足以像核武器一样起到威慑作用\
  \ \\[LOS 17\\]。\n\nAI 也可能导致人类未能决定的冲突 \\[LOS 17\\]。\n\nAI 同样可作为国家内部的权力工具、经济、信息、政治—军事优势等手段。因此，AI\
  \ 影响了国家的政治、经济和社会诸多变量 \\[LOS 17\\]。\n\n目前不太可能出现能够显著改变力量平衡的全球系统或方案。AI 尚未像核武器那样彻底改变战略平衡。它更多是一项辅助、补充性技术，是力量倍增器，而非技术与战略突破\
  \ \\[NIK 19\\]。\n\n当前存在的 AI 不能真正视为一种“智能”。我们拥有的人工眼睛、人工耳朵、人工鼻子，但尚未拥有“人工大脑”。这限制了当前\
  \ AI 的应用范围，仅限于战术层面的自主行动，却无法在更广阔层面进行思考 \\[NIK 19\\]。\n\n*经济维度是军事 AI 研究及其融入军队与战争的关键\
  \ legitimizing 因素*\n\n2018 年 11 月，在黑海沿岸安帕（Anapa）的 ERA 国防技术基地发表演讲时，普京呼吁工业界开发智能、高精度武器和导弹，以提升现有及未来武器系统的能力。2017\
  \ 年，ERA 国防技术园已拥有约 37 家企业、160 名研究人员以及 47 个涵盖机器人、生物工程、纳米技术、信息系统、AI 等多个领域的持续研发项目。ERA\
  \ 国防技术园在 2017 年是全球最大的。经济原因驱动了这一目标：领导层认为，过去需要极其昂贵的武器系统才能实现的目标，现在可以通过高精度武器和弹药以更小规模实现\
  \ \\[GAL 18\\]。该政策受到限制：必须尽快取得成果，且质量必须上乘。武器系统的生产链条非常长。但在其他国家也在进行类似研发的背景下，俄罗斯有责任保持有效。此竞赛的胜利可以通过缩短生产周期来实现。AI\
  \ 不仅在科研实验室或试验原型中心进行研发，军事领域的生产环节同样是国际竞争的关键。\n\n\n\n\n在当前，军事领域 AI 潜在的应用众多，但肯定超过经济上可行的范围。必须作出选择\
  \ `\\[NIK 19\\]`。\n\n评估国家在 AI 研发和军事研发方面的实际投入水平十分困难。AI 与军事研发的投入水平难以衡量。在西方，大多数研究是民用的。在俄罗斯，情况不同：大部分研究是军用的，然后转移到民用领域。财政精力因此集中在防务上，其最初任务是到\
  \ 2025 年开发新一代智能武器 `\\[NIK 19\\]`。\n\n## 3.3. AI 与作战艺术\n\n### 3.3.1. *Manuel de Landa:\
  \ war in the age of intelligent machines*\n\n1991 年，《**人工智能时代的战争**》`\\[DEL 91\\\
  ]` 中，曼努埃尔·德兰达（Manuel de Landa）为我们提供了一个前瞻性的视角，展望因智能机器的崛起而发生的武装冲突。\n\n从第一行开始，文本就以“杀人机器人”这一概念开篇，这一概念已不再局限于科幻宇宙，而是进入了军事史。这些杀人机器人显然既不像人类般外形，也不具备人类的智能，它们已经进入了军事历史。例如，Prowler\
  \ 是一辆配备视觉系统的陆地车辆，该系统分析图像以使机器能够在敌对环境中移动，区分敌对与友军力量。此时，这些能力仍处于未来阶段，处于国防部的研发阶段，正是德兰达在写这本书时的状态。机器人尚未拥有真正的自主性，对敌方进行射击的决定仍由人类掌控，人类监督机器。但已经出现了两类\
  \ AI 与智能机器：一方面是帮助和辅助军队的 AI，另一方面是实现、执行并行动的 AI。在 1990 年代初的军事演习中，从人工到机器的转变已经显现。在此之前，人类决定部队调动、计算攻击效果，电脑负责计算；而像\
  \ SAM、IVAN 等新型自动体则接管了人类的角色，主导决策。德兰达认为，AI 的贡献将在以下几个层面显现：\n\n*   传统的信息技术在作战中的应用：“雷达系统、用于控制、通信和通信的无线电网络、导弹导航与制导设备”。AI\
  \ 将使这些应用变得更“聪明”，符合 AI 进步的成果；\n\n*   AI 将融入防御与攻击武器系统。但作者指出，类似人类的机器人——把士兵重新拉回战场的机器人，或提供指挥控制功能并实施作战的机器人——应被排除；\n\
  \n*   AI 的引入将影响军事及作战艺术，特别是促进分散化。AI 研究正朝控制分散决策的模式发展，这种模式可以在军队内部推动分散化。\n\n下面是曼努埃尔·德兰达在\
  \ 1990 年提出的关于 AI 与机器人主要观点与假设的摘要：\n\n*   AI 尚未足够先进，无法考虑创建机器杀手；\n\n*   “顾问、助手”型 AI\
  \ 与“决策型” AI 之间的界限正在消失；\n\n*   还有约二十年才能让 AI 能够创造自主武器；\n\n*   迄今为止，专家系统是 AI 最成功的实现形式（1984\
  \ 年五角大楼在“战略计算”中提出的三大应用——战场管理顾问、舱内顾问、自主武器——均依赖专家系统）；\n\n*   军事指挥部的核心任务之一是从战场上移除人类因素，将士兵从决策回路中剔除。1984\
  \ 年的“战略计算”中，五角大楼再次提出这一项目（研发能够独立作战的自主武器系统）；\n\n*   情报机构的需求决定了 AI 研究的优先级。美国国家安全局（NSA）雇佣大量语言学家和翻译人员，外语翻译是情报工作的主要功能。自动化这些任务因此成为\
  \ AI 历史上的重点（`¹⁴`<sup>#c03.xhtml#c03-fn14</sup>）。事实上，第一个 AI 研究项目是由空军资助的机器翻译程序。由于结果不够快速，项目于\
  \ 1966 年被停止；\n\n*   将专家系统引入指挥程序会使指挥职能中心化，并远离战场。指挥官转变为战场经理，必须处理数据流和程序：\n\n> “集中实施作战计划意味着，正如我们所见，上层指挥系统必须处理巨量信息。在这种情况下，最高指挥官的任务被缩减为信息流管理员。这种非人化、疏离的作战管理方式与第一次世界大战指挥官在前线后方指挥战斗的方式高度相似。二战指挥官如古德根、帕丁顿和麦克阿瑟则回到战场，直接参与战术计划的实施。半个世纪后，专家系统技术正为回归第一次世界大战式指挥创造条件，再次将将军的职能缩减为‘战场经理’。”\n\
  \n曼努埃尔·德兰达的核心假设是：如果军队想要 AI，想要创造能够自行杀戮的自主智能机器，就必须将人类、士兵从决策回路和战场上剔除。但作者指出，这一目标受到争议，并提出了替代方案——利用这些机器从事其他目的、以不同方式使用：而不是剥除人类，目标可以是将人类与机器结合：\n\
  \n> “然而，这些技术还有更易发展的替代用途，它们不以机器对抗人类为前提，而是旨在创造人机协同的整体 \\[…\\] 20 世纪 60 年代，当军方资助旨在把人类拉出决策回路的研究时，像道格·恩格尔哈特（Doug\
  \ Engelhart）这类独立研究者却朝相反方向工作：创建人机界面，使两者能够组合成整体。这类研究者称其概念为‘人类智能的增强’。”\n\n核心思想是将人类与机器整合，以增强人类的智力能力。\n\
  \n然而，技术出现与其被纳入军队与作战的过程之间往往存在很长的时间跨度。新技术的战术性整合历来是一个漫长的过程。存在不同的时间尺度：政治项目与策略的时间尺度（计划、多年方案等）；军事战术思想构建的时间尺度，需要预见、考虑选项、后果以及对作战艺术和机构本身的影响；科学与技术、研究与产业发展的时间尺度；以及产业本身的时间尺度。\n\
  \n### 3.3.2. *AI announcing a new RMA?*\n\n一些人预测，受 AI 推动的军事事务将发生根本性转变，称之为新的军事革命（RMA）。这种对新兴权力模式的永恒追求，使各国军队在数十年间都关注\
  \ AI。军队与作战艺术历经重大技术变革，AI 可能是其中之一，具有深远影响。但目前仍没有确凿证据。 \n\n\n\n在 1985 年 9 月，*Le Monde\
  \ diplomatique* 发表了一篇由 Dominique Desbois 撰写的文章，标题为“*Comment ‘l’intelligence artificielle’\
  \ conduirait la guerre*”（“人工智能将如何导致战争”）[DES 85]。1983 年，美国的军事投资出现了加速增长。DARPA 启动了一个新项目¹⁵，旨在开发新一代战略技术，以符合罗纳尔·里根的国防政策（即“星际大战”讲话，1983\
  \ 年 3 月）。当时我们正处于冷战时期，核军备竞赛日益激烈，两大阵营之间存在冲突风险。一方面，需要加强核武库存量；另一方面，需要提升 C2 系统的能力。未来几年的国防预算将大幅上涨。战略防御倡议（SDI，一个项目\n\
  \n\n\nAI 必须从其与当下、过去以及一种既在时间上接近又遥远的遗产的关系来考虑：它无疑是计算机科学的一个分支，至少部分上继承了围绕它所构建的内容以及军事领域的“网络世界”。接下来，我们将考虑可能的分歧。\n\
  \n### 3.3.3. 军事领域 AI 的应用\n\n大量开放获取文档讨论了 AI 在国防领域的具体、设想或想象的应用，这些方法考虑 AI：\n\n*   –\
  \ 作为武器；\n*   – 在武器系统中；\n*   – 军队的各种功能（指挥、控制、后勤、维护、情报，包括行政等）；\n*   – 用于攻击；\n*   –\
  \ 用于防御。\n\n1983 年，作为十年、10 亿美元计划——战略计算倡议（Strategic Computing Initiative）的一部分，DARPA\
  \ 识别了各种军事领域的 AI 应用。在 1983 年 10 月的一次研讨会上，展示了一张交叉引用军事应用与 AI 功能的矩阵（[16]），见 Table 3.3。\n\
