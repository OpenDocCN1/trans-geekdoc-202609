  \ \n自然语言处理 专家系统 |\n该文档另附一篇发表于 1986 年 8 月 14 日的《纽约时报》文章副本，内容为卡内基梅隆大学与 IBM 之间的为期三年联合研究项目。该项目由工业界提供数百万美元的经费支持。\
  \  \n大学并未受到情报机构指定候选人。当大学计算机科学系被询问是否愿意接收来自该机构的学生时，表现出愿意参与的意愿，但提出了条件：候选人必须拥有硕士学位且具备人工智能先前知识。另一方面，大学系部要求提供财务对应方\
  \ \\[DTE 86\\]。\n\n### 1.5.4. *人工智能应用于何种情报需求？*\n\n人工智能的应用是情报界推动关注这些学科及其发展的核心理由之一：\n\
  \n> “研讨会实现了两点。首先，它更新了人工智能技术 \\[…\\]；最重要的是，它集中关注这些新技术如何在情报界中应用。”⁵⁰\n\n情报界不旨在提供 *leadership*（领导）研究，而是侧重于应用维度。所需的是可操作、功能性和实用性的人工智能。\n\
  \n当 1982–1983 年在 CIA 内部成立工作组时，最初的发现是 AI 仍仅处于潜在应用开发阶段，尚未产生可操作系统。然而，产业努力若没有精确定义情报需求，便无法成功。因此，此时的任务是比较潜在的可能性，向情报界展示，让其想象哪些领域能从\
  \ AI 的贡献中受益，然后制定需求：\n\n> “合同方已开始组建合格人员团队；已开始投入必要的 IT 基础设施；他们正逐步理解我们的具体需求。这些努力将保持保守，直到我们更好地理解自身的需求。”⁵¹\n\
  \n在 1983 年 12 月一次会议结束后，AIAWG 产生了一份 AI 在情报中可能的应用列表，该列表⁵² 确定了六大主要领域：专家系统、自然语言、图像理解、智能数据库、信号解释以及\
  \ AI 工具与环境。\n\n1.  1 当今卡内基梅隆大学。1956 年卡内基技术学院首次接入 IBM 计算机。但直到 1986 年，距离 30 年后，该大学才成立计算机科学学院。\
