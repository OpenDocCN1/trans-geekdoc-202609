  \ of artificial intelligence”（2016）中，主要术语是`data`、`technology`、`future`、`development`、`science`、`research`和`security`（安全）。这份近\
  \ 50 页的文档围绕以下主题展开：\n\n* `definitions`和`background`（定义和背景）的人工智能；\n* 人工智能为社会大众服务的`AI`应用；\n\
