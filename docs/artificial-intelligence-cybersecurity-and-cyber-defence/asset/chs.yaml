  \nConcepts and Discourses\n\n建构主义理论在国际关系分析中赋予话语核心地位。话语构建对象并构建现实。某些词汇、话语形式以及特定行动者对世界及其问题的感知、表征和理解具有更大影响。特别是国际关系、安全与国防议题，高度依赖于谁何时以何种方式表达：\n\
  \n> “人工智能是一个跨越全球数年的迷人主题，但随着计算机的出现，这种迷恋正逐渐成为现实。我不指科幻小说和耸人听闻的电影中描绘的智能，而是指对计算机进行曾被认为需要智能的任务的缓慢而系统的应用。”\
  \ [WIM 77]\n\n当前对人工智能的热潮是一种复兴。它体现在旨在留下深刻印象的表述中：“人工智能的发展可能对社会和经济产生的影响，大于火的发明或工业革命。”¹\n\
  \n人工智能的出现被描述为一种新的转型、新的工业革命（这将是第四次）²、一种新的电力[NG 16]、一种圣杯（即“征程”）[NIL 09]、一种带来重大进步的保证（即经济增长的保障）³。根据斯蒂芬·霍金的说法，这可能是人类历史上最重要的发展，也可能是最糟糕的。其他人则从不同角度提出问题，询问其创造性破坏力（即摧毁现有经济、工业和生产体系以生成新体系、创造新需求、新工作和新的社会生活方式）或破坏性创造（即大规模失业且缺乏替代就业；对机器主导的决策过程失去控制）[MIA\
  \ 17]。\n\n\n\n### 2.1. 定义 AI\n\n#### 2.1.1. *AI*\n\n人工智能，像所有概念一样，受到多种定义的制约。可以依赖并坚持\
  \ 1950 年代和 1960 年代该学科开拓者提出的定义。但此后，这一概念从未停止被质疑、分析和拆解。当然，从未真正得到一致、理想的单一定义。理解或定义“人工”与“智能”并不能完全定义“人工智能”。\n\
  \n定义“智能”一直是也是一个挑战。它是“心灵的一种必不可少的功能，使我们能够把事物之间的关系联系起来（拉丁语 *intelligere*；前缀 *inter*\
  \ 表示‘之间’，动词 *leggere* 表示‘联系’，‘关联’）” \\[GOF 06\\]。\n\n“智能/智力”一词在 1950–1960 年代在多个技术或研究对象中使用减少。因此我们谈论“智能的地球卫星”\
  \ \\[QUA 57\\] 以区分放置在轨道上的卫星和自然卫星（如月亮）；智能机器等也被讨论。\n\n马文·明斯基（Marvin Minsky），AI 的先驱之一，认为我们应当“仅用‘智能’来指代人们通常所指的含义，即解决困难的能力”\
  \ \\[MIN 85\\]。\n\n弗雷德·M·通吉（Fred M. Tonge）认为：\n\n> “‘智能’指系统的一种属性，是基于对系统行为的观察得出的判断，并被‘大多数合理的人’认可为智能。‘人工智能’则是非生物系统中观察到的这种属性。致力于产生这种行为的工作，因此属于人工智能的工作。虽然上述定义确实比较宽泛，更具暗示性而非精确性，但它足以满足我们的目的。它至少包含一个强假设——在先验上，智能并不局限于‘生物’系统。它也暗示，如果人工智能是否存在或将会（或能够）存在的问题真正值得进一步讨论或关注，那么关于观察和大多数合理人之间达成共识的规则应该得到一致。这里，我们仅将该术语视为一种便利的标签。”\
  \ \\[TON 66\\]\n\n由于对“智能”和“人工性”这两个概念定义缺乏共识，组合成表达“人工智能”的定义任务更加困难。\n\nTable 2.1 提供了按年份、按时间顺序排列的\
  \ AI 定义长列表，始于 20 世纪 60 年代初。\n\n这一已相当冗长但并非穷尽的 AI 定义合集，需要一些说明。根据这些定义，人工智能有时是计算机科学的一个分支或学科；有时是一类技术；有时是机器思考如人类的能力。但如果我们采用明斯基先生在\
  \ 1960 年提出的定义，那么今天人工智能并不存在，因为目前没有任何机器、算法或计算机具备批判性思维。现代计算机的能力在于大规模、高速计算、求解方程、学习、“推理”，但这些都不足以构成批判性思维的能力。\n\
  \n**Table 2.1.** *Definitions of AI by year and chronological order*\n\n| Definition\
  \ || Source || Year |\n| --- | --- | --- |\n| Artificial intelligence is “[...]\
  \ the science of making machines do things that would require intelligence if done\
  \ by men. It requires high-level mental processes such as: perceptual learning,\
  \ memory and critical thinking.” || \\[MIN 61\\] || 1960 |\n| “Aptitude of a machine\
  \ to give an answer to a question that is usually obtained with (human) reasoning\
  \ guided by memory, experience and intuition.” || \\[RAY 63\\] || 1963 |\n| “Artificial\
  \ Intelligence is the experimental and theoretical study of perceptual and Intellectual\
  \ processes using computers. Its ultimate goal is to understand these processes\
  \ well enough to make a computer perceive, understand and act in ways now only possible\
  \ for humans.” || \\[MCC 71\\] || 1971 |\n| “The branch of computer science called\
  \ Artificial Intelligence involves the attempt to program or build a digital computer\
  \ capable of producing behavior that a human being would accept as truly intelligent.”\
  \ || \\[SAL 76\\] || 1975 |\n| “Artificial intelligence \\[is\\] the efforts to\
  \ emulate and bolster human reasoning processes as programs in computers.” || \\\
  [LED 76\\] || 1976 |\n\n\n\n| “人工智能不是研究计算机，而是研究思想和行动中的智能。计算机是其工具，因为其理论以计算机程序的形式表达，使机器能够做那些如果由人类完成则需要智能的事情。”\
  \ || \\[BOD 77\\] || 1977 |\n| “人工智能（以下简称 AI）可以定义为设备执行通常与人类智能相关的功能的能力，如推理、学习和自我改进。”\
  \ || \\[WIL 83\\] || 1983 |\n| “人工智能（AI）是科学研究领域，专注于设计能够模拟人类心理过程的机器系统。” || \\[LAW\
  \ 84\\] || 1984 |\n| “人工智能是计算机科学的一个跨学科子领域，旨在在软件中再现人类解决问题的过程。” || \\[AND 84\\] ||\
  \ 1984 |\n| “人工智能技术旨在设计并生产智能计算机系统，即能够模仿人类思维过程的计算机，但能够取得更准确的结果。” || \\[DAN 86\\]\
  \ || 1986 |\n| “人工智能将被视为计算机科学的分支，致力于开发解决以前仅被认为只能由人类解决的问题的方法。这些问题包括推理、理解、自然语言、规划与问题解决、学习、视觉处理和对物理世界的操作。”\
  \ || \\[FRA 86\\] || 1986 |\n| “AI 是一系列利用存储专业知识和知识的技术的集合。通过这些技术，知识——一种重要的企业资源——可以被捕获、测试、改进、复制、使用并重复利用。”\
  \ || \\[MEL 89\\] || 1989 |\n| “AI 是计算机基础的、旨在解决传统上依赖人类解决方案的复杂任务的技术集合。此类任务包括复杂的逻辑推理、诊断、视觉识别、自然语言理解、游戏玩耍、解释、规划。”\
  \ || \\[HOR 90\\] || 1990 |\n| “我称人工智能为旨在模拟人类智能行为的计算机技术，即能够让人类解决面临的问题的行为，无论这些问题是智性的还是实际的，是系统有意识且有意识地进行，还是直观且无意识地进行。人工智能是若干传统的继承者，主要传统包括生物学、心理学、计算机科学和语言学。”\
