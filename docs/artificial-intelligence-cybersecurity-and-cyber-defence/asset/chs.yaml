  人工智能已成为需要制定国家战略的议题。对这些战略的回顾表明，自 2015 年以来，国家战略的数量有所增加。然而，并非所有被视为国家战略的文档都是政府所产出。它们的作者包括研究中心和私人实体。在国家作者中，战略由各种部门撰写：经济、安全、国防等。但需要强调的是，掌管经济和产业的部门占主导地位。人工智能首先是国家经济问题。社会或人类在知识生产、知识传播、生活条件改善方面的贡献远低于这些考量。主要目标是经济管理、产业发展，这当然基于研发，但更主要是通过支持贸易来实现。\n\
  \n我们所参考的所有国家战略文档来自多种政府和非政府来源（例如印度、魁北克和非洲的文档）。\n\n从这些“战略”中，我们保留主要故事及其组成部分。这些战略讲的是什么？它们提出了怎样的世界观，以及如何构建将人工智能纳入社会的社会？\n\
  \n对于大多数国家，人工智能是一种高附加值、创造性、变革性的技术。如果国家不忽视这些技术的少数“负面”方面（风险、危害），似乎只需通过几种框架、法律以及伦理监管来应对其影响，就足以保留积极面（用于缓解负面的工具包括：法律、标准、教育、培训、意识、对实践和用户的控制。韧性也被讨论）。\n\
  \n受科学家（尽管他们可能夸大或贩售 AI 的好处，同时也指出其负面特性）的支持下，政治家构建了一个既有益又不可或缺、不可避免的 AI 话语。进步、经济、社会变革和社会正义（如\
  \ AI 用于打击欺诈）被提及，同样也提到了更高甚至不可争议的利益，如安全（AI 预测、预防或发现恐怖分子、犯罪计划）以及国际舞台上的力量。\n\n**Table\
  \ 2.14. `Key elements of the narratives of national strategies for artificial intelligence`**\n\
