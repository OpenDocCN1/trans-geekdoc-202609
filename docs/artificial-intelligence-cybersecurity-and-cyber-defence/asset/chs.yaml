  \ and Adaption in Contested Environments）项目利用机器学习自动在 SAR（合成孔径雷达）图像中定位和识别目标；\n* \
  \  – 维护、后勤：IBM 将其 Watson 应用部署到美国陆军，以预测 Stryker 战斗车辆的技术故障；\n*   – C2、C3I：决策支持（所有层级，战略、战术、作战）；部队准备度、能力；规划、作战；数据整合、多源；\n\
  *   – 互联网上的恐怖主义宣传识别；\n*   – 图像识别应用、图像分析：监控、自动驾驶车辆、地雷清除；\n*   – 专家系统；\n*   – 电子对抗措施；\n\
  *   – 冲突模拟，从作战开始；\n*   – 战术和战略思维工具的模拟；\n*   – 决策支持，C2 支持；\n*   – 入侵检测（网络）；\n*  \
  \ – 攻击型空中优势（OCA），任务规划过程；\n*   – 战术规划；\n*   – 作战规划；\n*   – 监视、规划、后勤支持、决策和作战的增强；\n\
  *   – 人工智能导弹（卡拉什尼科夫）；\n*   – 军队健康系统、战场医疗援助、军事医疗记录数据分析系统；\n*   – 作战模拟和训练系统（最近由美国海军与\
  \ SAIC、AECOM、Orbital ATK 等公司合作开发；以及由美国陆军与 SAIC、CACI、Torch Technologies、Millennium\
  \ Engineering 等公司合作开发）；\n*   – 异构大规模数据的处理。AI 可以更高效地处理这些数据；\n*   – 自走军用车辆；\n*   –\
  \ UAV 控制系统。\n\n根据 MarketsandMarkets¹⁷，未来几年军事 AI 的发展应集中在以下领域：\n\n*   – 作战平台（尤其是嵌入\
  \ AI 的武器、作战系统，较少依赖人工操作，能够协同执行攻击的自主武器）；\n*   – 网络安全：无论是网络化还是非网络化的军队计算机系统，都面临网络攻击，AI\
  \ 的部署可能比人工行动或当前的网络安全系统更有效地应对；\n*   – 后勤与运输：AI 可以帮助优化这些功能，降低成本，缩短交付时间，检测异常并进行更前置的管理；\n\
  *   – 目标识别；\n*   – 战场医疗（发展机器人手术系统（RSS）和机器人地面平台（RGP））；\n*   – 战场模拟与培训工具；\n*   – 威胁监测与态势感知基于\
  \ SRI 操作，可动用装备人工智能的设备（监控无人机）；\n*   – 信息处理；\n*   – 这些主题或领域也是军事 AI 市场的细分市场，预计未来几年“数据处理”细分领域将主导该市场，根据\
  \ MarketsandMarkets。增长预计在中国地区最强劲。\n\n### 3.3.4. 军事领域的专家系统\n\n专家系统是 AI 数据处理方法与人类专业知识的交叉点，因此它是人与机器合作的场所。其主要优势之一在于低调，给人一种机器可以借助其掌握复杂局面的错觉：“专家系统在快速变革、不确定性和不可预测性特征的社会中创造出的确定性岛屿。”\
