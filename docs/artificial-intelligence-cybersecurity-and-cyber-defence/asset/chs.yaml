  \n### 2.5.2.2. *The presidency of Donald Trump*\n\n继承前任政府的做法，唐纳德·特朗普政府正在进行新的咨询并发布新的战略文件。国家标准与技术研究所（NIST）于\
  \ 2019 年启动了一项咨询，所有非匿名的回复均可在线查阅⁸⁶。该术语为复数形式。主要公司参与讨论（IBM、Microsoft、Google、Amazon 等）。由于回复不受特定格式限制，其内容从几行到数十页不等，参与者提交的内容包括简单的评论、报告或甚至科学论文。从这种多样性中，我们将保留一些显现出的主要问题：\n\
  \n* `Building confidence`（建立信任）在人工智能技术中的应用：有一条评论⁸⁷批评常见的论述：“可信的系统是技术上正确的系统”。信任不能简化为技术或规范问题。它具有\
  \ essential 的社会和政治维度：必须保证对个人自由、隐私以及知情同意的尊重。人工智能也常常像一个黑盒，无法验证其产生的结果。“当前人工智能（AI）的信任危机源于操作者认为他们无法解释为何产生某一结果[…]。为了让算法受到信任，它们必须可解释——即人类必须能够理解算法为何做了它做的事。”⁸⁸\n\
  \n* `The uncertainties`（巨大的不确定性），这些不确定性涉及技术本身、结果的质量或可靠性、以及其在集成领域的影响：“目前没有国家标准来评估或检验人工智能在特定情境、过程或行业中的成功或失败[…]。在医学领域，医务人员风险容忍为零，因为涉及患者的健康、声誉和执业许可证。医务人员在没有可信、准确、精确或类似可信度指标的证明之前，不会采用人工智能。”⁸⁹\n\
  \n* `The notion of “risk”`（风险概念）无处不在，涵盖技术风险、公民权利、价值观、伦理、商业、经济、民主等方面的风险。\n\n* 对隐私、自由、基本权利、公民权利、伦理以及所有这些变量所面临的风险的考量，是所有回复中的强一致因素，也是对人类整体（包括个人、残障人士、以及“社会经济弱势群体”等）所面临的风险的持续关注。\n\
  \n* `The creation of norms`（制定规范）或人工智能标准是一个国际性议题，各大国为维护自身国家利益，争取制定规则并自称为领导者：“美国有机会在定义人工智能伦理问题的指南、法规和法律方面走在前列。”⁹⁰\n\
  \n* `State/private balance`（国家与私营部门的平衡）：人工智能的发展引发了国家与私营部门的比例问题，以及两者之间需要达成的平衡。国家真的需要干预以制定人工智能标准吗？还是私营部门更适合制定这些标准？“当前美国私营部门在人工智能研究和发展方面处于领先地位，但要在国际标准化组织中成功参与，仍需联邦支持。”⁹¹\n\
  \n\n\n\n- – 中国被反复称为“负面”： “中国有颠覆国际技术标准的历史，例如通过开发替代国家标准来创造有利于其国内利益的贸易壁垒” \\[CDI 19\\\
  ]; “新疆维吾尔族少数民族的压迫主要通过人工智能技术的兴起实现” \\[CHI 19\\]; “中国的社会信用体系与美国对自由与自由价值的看法以及其他国家对个人数据隐私和保护的看法相抵触，如同\
  \ GDPR 所示。”⁹² 这里，我们看到在关于人工智能问题的国际网络治理辩论中，根本分歧再次出现。美国、中国以及俄罗斯之间存在分歧： “与中国或俄罗斯开展人工智能竞赛是有问题的，因为这些国家对隐私、安全和自由的看法与美国大相不同。”⁹³\n\
  \n- – 数据：数据质量和获取是两个关键变量。 “人工智能应用只能与其用于训练的数据质量相媲美” \\[STU 19\\]。在数据被利用时，必须尊重人们的权利。\n\
  \nDoes the 2019 consultation express AI issues differently from the 2016 consultation?\
  \ A comparison may be difficult, as the focus of the consultations is different\
  \ (the 2019 consultation focuses on issues of norms and standards). However, using\
  \ just one example, we can see that the way contributors approach AI issues is influenced\
  \ by a variety of variables. For example, the way China is mentioned in the 2016\
  \ consultation is neutral and does not show any bias. China is then mentioned to\
  \ remind us of the existence of a multi-year investment plan for robotics decided\
  \ by Beijing. This is no doubt a way of calling on the American authorities to remind\
  \ them to do the same. In the 2019 consultation, China is no longer a model. The\
  \ look has changed, the expression is critical, negative. China, whose choices to\
  \ use AI are portrayed in the West as the realization of an Orwellian society, now\
  \ represents the antithesis of the ideal society, the counter‑example, the construction\
  \ that should be avoided. In the 2016 consultation, this threat of social control\
  \ found its source rather in the American authorities themselves. The analyses and\
  \ proposals for AI governance therefore use examples taken from the immediate news\
  \ (in 2016, the United States was shocked by Edward Snowden’s revelations; in 2019,\
  \ the Western media described the new Chinese system of social control). But the\
  \ basic idea remains the same: citizens must be vigilant about the practices of\
  \ States, of their own governments. The two examples cited also show that vigilance\
  \ is of little use in thwarting the authorities’ plans.\n\n1. 1 由研究员恩里克·苏卡尔（Enrique\
