  \n### 1.1.3. *AI 研究在俄罗斯*\n\n俄罗斯的人工智能历史大致与美国或西方同步。早在 1960 年代初，西方代表团访问俄罗斯时就注意到在 AI\
  \ 主题上已有研究团队。\n\n美国科学家 E.A. Feigenbaum 于 1960 年 6 月至 7 月作为美国代表团成员，参加 *第一届国际自动控制联合会*（IFAC）第一次大会时，发表了以下报告：\n\
  \n> “程序包括一系列欢迎辞，以及著名科学家、苏联自动控制委员会主席 V.A. Trapeznikov 的讲话。”\n\n> \n\n> “苏联副总理谈到了自动化对‘某些社会’带来的问题\
  \ —  — 这些社会尚未准备好应对这种技术变革 —  — 变革将导致失业、再教育难题 \\[…\\]”\n\n> \n\n> “总体而言，苏联论文倾向于理论，而西方代表团的论文则混合了理论与应用。”\n\
  \n> \n\n> “在会议期间，各研究所、教育机构和工厂正式向代表团开放技术参观 \\[…\\] 其中最受欢迎的参观行程是前往莫斯科的自动化与测控研究所。”\n\
  \n在苏联，人工智能是与信息论、计算机科学以及军事指挥与控制（C2）研究并列的网络学科的一部分 \\[LEV 64\\]。网络学科于 1953 年在苏联出现，是一个新兴且范围广泛的领域，围绕众多研究社区展开，这些社区主要在专门的网络学习会议和早期\
  \ 1960 年代的大量学术出版物中聚集。军事网络学成为网络学的一个子领域。\n\n1965 年 8 月 27 日《Science》期刊上发表的一篇文章 \\\
  [KOP 65\\] 介绍了在西伯利亚新建的一个科学之城 —  — Akademgorodok，位于新西伯尔（西伯利亚）郊区。\n\n俄罗斯学者 Paul R.\
  \ Josephson \\[JOS 97\\] 为整章专门撰写了关于 Akademgorodok 在苏联中期（1960–1970）诞生的人工智能历史。正是在那里，俄罗斯的人工智能诞生了。20\
  \ 世纪 70 年代，在 Akademgorodok 建立了以人工智能为中心的俄罗斯研究社区，包括大学研究中心、“俱乐部”（人工智能俱乐部）以及人工智能理事会（人工智能委员会）等。\n\
  \n如今，该城市被视为俄罗斯的“硅谷”之一（与莫斯科、圣彼得堡并列），据说是俄罗斯“网络战士兵”的所在地 \\[CLA 17\\]。Akademgorodok\
  \ 拥有一个科技园，囊括了所有俄罗斯科技园的 24% 产值，以及在俄罗斯科技园中的公司的 22% \\[LOG 16\\]。Akademgorodok 科技中心目前被报告为拥有\
  \ 340 家公司、115 家初创企业以及近 10,000 名员工。该生态系统还得益于众多大学研究中心的集中，这些中心使该市闻名并独特，因其高度集中。\n\n\
  20 世纪 70 年代中期，苏联设想将网络信息技术作为控制、管理和规划苏联经济的工具。当时的项目设想通过庞大的计算机网络将主要生产和政治中心相连，莫斯科为枢纽，同时经由列宁格勒（当时称为圣彼得堡）和基辅。实施计划于\
  \ 1975 年左右开始，于 1990 年完全投入运行。西方、美国（Control Data Corporation）和英国（International Computers,\
  \ Ltd.）公司也参与了该项目 \\[LIE 73\\]。计算机及计算机科学在广义上成为苏联政治项目的工具，同时也对当时面临大规模网络实施困难的美国构成挑战。苏联的技术发展基于自\
  \ 1950 年代末从美国转移技术的政策，并在 1972 年尼克松政府时期加速 \\[ROD 81\\]。苏联通过法律渠道（经美国政府授权的销售）和非法渠道（黑市和复制）获取外国技术，尤其是信息技术领域。人工智能是该“网络学科”项目的一部分。然而，1990\
  \ 年美国国防部的一份报告估计，尽管在民用和军用人工智能领域投入了大量努力，苏联在机器智能和机器人技术上仍显著落后于美国 \\[DOD 90\\]：\n\n>\
  \ “苏联在机器智能和机器人技术上显著落后于美国。他们拥有良好的理论理解，并在空间和军事应用中展现出对技术的创造性运用。苏联科学院在人工智能（AI）领域的研发工作包括机器视觉和机器学习。机器智能对战场作战以及国内经济的价值被苏联政府认可。”\n\
  \n因此，尽管当时苏联并未真正与美国在能力上展开竞争，但它仍是美国所面对的竞争格局中的一员。人工智能和机器人技术在多个国家和地区 —  — 如法国、欧洲、日本等\
  \ —  — 以动态方式发展。\n\n苏联的科研并未与世界隔绝。苏联组织国际人工智能会议，例如 1977 年 4 月在列宁格勒，1983 年 10 月在另一场会议\
  \ \\⁸ \\⁹。其科研项目和成果在自动翻译、自然语言理解等领域，与世界其他地区相似；1982 年，“Etap–1” 项目（法语到俄语自动化翻译实验系统）被创建\
  \ \\¹⁰。\n\n![Figure 1.4. Location of Akademgorodok (district of the city of Novosibirsk)](img/fig1-4.jpg)\n\
  \n**Figure 1.4.** *Location of Akademgorodok (district of the city of Novosibirsk)*\n\
  \n\n\n\n日本的人工智能研究历史始于 1960 年代的京都大学，围绕京都大学教授**鹤冈俊之**（Toshiyuki Sakai）组建的团队展开，团队聚焦于**计算机视觉**、**语音处理**和**自然语言**三个领域。1970\
  \ 年，该团队在大阪展览会上展示了**首个面部识别系统**。\n\n在此期间，多个团队相继形成，包括**九州大学**（围绕**栗原俊彦**教授，致力于**假名转换系统**）、东京大学（由**田中国吉**教授负责**知识处理**问题）、东京大学以及像**NTT**等企业实验室。然而，这些团队的出现尚未形成真正的日本人工智能研究社区。这一社区最终围绕东京大学的学生群体**IAUEO**（早稻田大学人工智能研究会）形成，其成员包括日本人工智能先驱**中岛秀幸**、**堀孝一**和**松原仁**。\n\
  \n政府为长期大学研究项目提供了数亿美元的资助 \\[DON 77\\]。1971 年，政府启动了**PIPS（模式信息处理系统）**项目，该项目在八年内总资助额达**1\
  \ 亿美元**。实现 PIPS 目标所需的计算能力促使新型电子芯片的研发。这一阶段早在 1973 年，日本政府就通过一项新项目为其融资。\n\n其他大量资金也被调动以支持**图像处理**、**语音**和**自然语言处理**研究。\n\
  \n人工智能在 1980 年代中期才真正兴起 \\[MIZ 04, NIS 12\\]，这发生在日本于 1982 年启动**第五代计算机计划**之后。国家第五代计算机科学计划的研发机构是**新世代计算机技术研究所（ICOT）**。ICOT\
  \ 曾开发出编程语言**KLIC**和法律推理系统**HELIC-II**。1983 年，ICOT 的研究人员不足 50 人，其研究主题围绕**“到 1990\
  \ 年建成全球最大计算机”**这一核心项目，直接涉及人工智能（如**自动翻译系统、自动应答系统、语音识别、图像理解、问题解决系统和逻辑编程机器**等）。\n\n\
  1986 年，**日本人工智能学会（JSAI）**成立。1990 年，该学会创办了**太平洋 Rim 人工智能国际会议（PRICAI）**，旨在组织该地区的人工智能研究，从而补充或平衡西方的**IJCAI**和**欧洲人工智能会议**等倡议。\n\
  \n除了大学研究，工业研发活动也为日本人工智能的发展作出了重要贡献。主要工业集团（如**NTT、日立、富士通、索尼、本田**等）成立了专门的 AI 团队。部分项目受到广泛媒体关注，包括**索尼的\
  \ AIBO（机器狗）**、**本田的 ASIMO（人形机器人）**、**IBM 研究东京的 TAKMI – 分析与知识挖掘**、**NEC 的面部识别工具和手机语音翻译应用**，以及**HRP-4C\
  \ 人形机器人**（能够唱歌和跳舞）。\n\n自 1980 年代以来，日本政府持续投资于人工智能，但国际竞争日益激烈，一些大国在**科学论文数量**方面已超越日本。例如，2011\
  \ 至 2015 年间，**中国**在该领域发表了**41,000 篇**论文，**美国**发表了**25,500 篇**，而**日本**仅发表了**11,700\
  \ 篇**。这一趋势也体现在工业领域：美国约有**1000 家**相关企业，而日本约有**200–300 家** \\¹²。\n\n尽管日本在**机器人学**和**人工智能应用**领域长期领先，这不仅源于其在**电子、电力、计算、自动化**等多个方面的整合能力，也因其在**众多领域**（尤其是**电子学**）上处于领先地位。20\
  \ 世纪 80 年代的机器人学更侧重**电子学、微电子学和机械学**而非计算机科学。\n\n### 1.1.5. *AI research in France*\n\
  \n1950 年代和 1960 年代，关于智能机器的兴趣传播到全球众多国家。法国是这一国际化研究浪潮的参与者之一。以下是一些代表性案例：\n\n*   – **Pierre\
  \ de Latil**关于人工思维的思考 \\[DEL 53\\]；\n\n*   – **Albert Ducrocq**（士兵之子，先后学习政治学和电子学，后成为记者和散文家，被誉为网络论者）发明了“**电子狐狸**”，这是一款自主轮式机器人，并启发了\
  \ 1970 年代**Bruno Lussato**开发的**zebulons**（自主计算机控制搬运机器人）。Ducrocq 出版了多部涉及机器人、武器和人工智能的著作，包括*Les\
  \ armes de demain*（未来的武器，Berger-Levrault, 1949）、*Appareils et cerveaux électroniques*（电子设备与电子大脑，Hachette,\
  \ 1952）、*L’ère des robots*（机器人时代，Julliard, 1953）和*Découverte de la cybernétique*（网络论发现，Julliard,\
  \ 1955）。他于 2001 年逝世前发表了大量著作；\n\n*   – **Paul Chauchard** \\[CHA 50\\]、**Paul Cossa**\
  \ \\[COS 54\\]、**Louis Couffignal** \\[COU 52\\]、**Dominique Dubarle** \\[DUB 48\\\
  ] 等人的著作，以及**Albert Béguin** \\[BÉG 50\\] 关于机器人的研究；\n\n这些学者从**数学家、网络论者、哲学家、电子工程师**等多角度切入问题，探讨：**人类是否就是机器？大脑能否被复制到机器中？机器能否思考，是否拥有灵魂？机器是什么？思想机制或大脑功能能否被简化为算法？大脑与身体是否仅为简单的机械？**\n\
  \n**Louis Couffignal** \\[COU 52\\] 将机器定义为“**人类提出的一系列操作所能执行的人，整体上是无生命的，甚至例外地是有生命的实体集合**”。\n\
  \n他列举了机器的分类：**能够加法和书写的机器**、**能够阅读和选择的机器**、**计算机器**和**思考机器**。\n\n\n\n\n在 1984 年，让-皮埃尔·劳朗（Jean-Pierre\
  \ Laurent）[LAU 85]，萨克雷大学的教授，制定了一系列关于法国人工智能研究现状的观察：由于人工智能这一独立的研究学科的边界不精确，因此识别研究潜力是一项困难的任务；此外，人工智能研究在法国分散，团队规模较小且遍布全国；人工智能在学术研究界和政治决策圈子中因过于经验主义的特性而声誉较差，且该学科正逐步脱离纯理论研究，缺乏令人信服且显著的成果来克服\
  \ 60 年代的失败；人工智能过度关联于“小工具”应用，但在 20 世纪 80 年代初，局势似乎在转变，行业使用专家系统的发展似乎有望让人工智能获得其所缺乏的严肃形象。然而，工业界仍对人工智能能提供什么持模糊的认识：“一些不太熟悉人工智能及其可能性的工业组织倾向于相信奇迹，并要求人工智能解决一切（例如，如果没有人类专家，如何构建专家系统？）”。投资于该学科的研究人员仍然得到支持不足，在人力资源、设备和资金方面极为有限。这种状况影响了大学教学，大学仅将人工智能培训附加了次要重要性。因此，学术研究的现状取决于多种变量：公众兴趣、政治决策者的关注、工业投资以及团结孤立研究者和学科的能力。\n\
  \n此外，在阅读让-皮埃尔·劳朗的这篇研究时，应注意到，研究资金的驱动力依赖于外生变量。尽管国家通过其研究机构（如 CNRS）自 1979 年起就开始资助部分人工智能项目，但\
  \ 1981 年《第五代计算机计划》（Japan）的发布似乎是政治行动的一个新决定性转折点。\n\n### 1.2. 人工智能研究的特征\n\n从一开始，人工智能就以一种多学科的方式形成，位于多个科学学科交叉的十字路口。哲学在其中的交叉性中占据重要位置（H.B.\
  \ 梅耶斯 [DRE 72] 建立了人工智能与柏拉图和霍布斯思想之间的联系），同时数学、计算机科学和认知科学等也在此交叉。\n\n> “该领域汲取了来自多个学科的理论构想，包括数学、心理学、语言学、神经生理学、计算机科学和电子工程。”\
  \ [LAW 84]\n\n在 2018 年 3 月的报告中，法国国会议员塞德里克·维尔班（Cédric Villani）回顾了这种交叉性：\n\n> “该领域如此广泛，无法局限于特定的研究领域\
  \ \\[…\\] 人工智能处于多个领域的交叉路口：计算机科学、数学（逻辑、优化、分析、概率、线性代数等）、认知科学等。” [VIL 18]\n\n2019 年，西班牙在其官方人工智能国家战略文件中同样如此表述：“鉴于其贡献的日益复杂，人工智能正日益呈现出交叉性，与生物学、哲学、法律世界、心理学、社会学和经济学形成协同效应。”¹³\n\
  \n人工智能采用了广泛的技术或方法：\n\n> “每个的人工智能算法都由一系列技术支持：语义分析、符号计算、机器学习、探索性分析、深度学习和神经网络 \\[…\\\
  ]” [VIL 18]\n\n> \n\n> “这些技术包括：自然语言处理、智能代理、计算机视觉、机器学习、专家系统、自主汽车、聊天机器人和语音识别。”¹⁴\n\
  \n> \n\n> “六种人工智能技术对生产和物流流程具有重要应用潜力：基于知识的专家系统、自然语言处理、语音识别、三维视觉、智能机器人和神经网络。其中，最具显著潜力的技术是基于知识的专家系统。”\
  \ [MEL 89]\n\n> \n\n> “通常被认为是人工智能子领域的技术和研究领域：• 自动规划与调度 • 计算机视觉 • 决策支持、预测分析和分析发现\
  \ • 分布式人工智能/基于代理的系统 • 人类语言技术 • 身份智能 • 机器学习 • 过程建模 • 机器人/自主系统。” [DNI 19]\n\n最后，这门新科学的特点在于其应用领域的广度：20\
  \ 世纪 70 年代，研究尝试将人工智能应用于国际象棋和围棋游戏、数学（证明定理）、理解和翻译书面及口语语言、控制机器人和人工手、图像分析以及人机交互（智能对话）¹⁵。20\
  \ 世纪 80 年代，讨论的应用领域包括：\n\n> “生物工程、化学、计算机硬件、计算机软件、教育、工程、通用系统和人工智能公用程序、法律、制造业和工业、数学、医学、军事以及资源勘探。”\
  \ [LAW 84]\n\n三十年后，维尔班报告 [VIL 18] 同样提及应用领域的广度：图像和视频识别、翻译、内容推荐等。维尔班报告 [VIL 18] 是一份关于利用互联网识别图像和视频的报告。\n\
  \n应用领域似乎无限，唯一的限制是想象力。2020 年看似相当创新的某些应用，早在 AI 早期阶段就已处于实验阶段或计划中：\n\n*   – 人工智能在汽车领域\
  \ [TSU 79]¹⁶；\n\n*   – 图像分析，图像中目标检测 [NAG 79]；\n\n*   – 冲突模拟器（例如 CONSIM，Conflict\
  \ Simulator，1971 年（Proceeding ACM ‘71）[CLE 71]¹⁷）。\n\n总体而言，AI 研究与发展的共同目标是“通过创建模拟人类认知过程的人工认知过程来理解人类认知如何运作”\
  \ [VIL 18]。\n\n**表 1.2.** *人工智能目标*\n\n| 定义 AI 目标/最终目的 | 来源 | 年份 |\n| --- | --- |\
  \ --- |\n| “人工智能研究的目标是构建能够表现出我们称之为‘智能行为’的计算机程序，当我们在人类身上观察到这种行为时。” | \\[FEI 63\\\
  ] | 1963 |\n| “通用人工智能的长期目标是创建能够在广泛认知领域（包括学习、语言、感知、推理、创造力和规划）展现人类智能的灵活性和多功能性的系统。”\
  \ | 美国国家科学技术委员会。网络和信息技术研究与发展小组（NITRD）（美国） \\[NET 16\\] | 2016 |\n\n撰写人工智能史需要考虑的不仅是单一学科的发展轨迹，而是多学科交叉的交汇。其诞生是一个汇聚的时刻，是相遇。人工智能的命运与这种交叉性紧密相连，而交叉性是其主要特征之一。\n\
  \n\n\n-   [AI 史的进程](https://wiki.example.org/ai_history) 将以一系列进展、狂热期和挫折期为特征，有时被称为“AI\
  \ 冬天”。AI 的道路，无论如何，都不是线性的。虽然 AI 如今已是全球成功（我们正处于“第三个人工智能时代”[MIA 18]），但一次可能突然出现的衰退阶段不可排除。AI\
  \ 的成功与多种条件相关。它的命运不仅取决于科学进步，还与经济挑战和投资、政治支持以及科学进步相联系。\n\n将 AI 历史分为若干阶段，可以在每个阶段内定位事件，例如贯穿人类历史的主要冲突、政治时期以及重大事件，特别是技术史中的事件。\n\
  \n# 1956–1970 年（春季 1）\n在这一时期的开端，AI 的先驱们对实现目标的能力充满信心，确信科学的发展将使 AI 能够迅速实现目标。他们充满乐观，认为\
  \ AI 将在 25 年内实现目标。但困难很快出现，最初的野心不得不被重新考虑。进展的速度低于预期，当时的知识仍无法解决许多问题。例如，机器翻译系统表现很差。1972\
  \ 年的 Lighthill 报告结束了这一时期。过度消极的言论使这一充满希望和乌托邦的动态时期走向终结：\n\n> “国防部的高级研究计划局（ARPA）实际上是\
  \ AI 研究的主要资助来源，目前因其项目未能像应有的那样快速产生回报而受到多方攻击。德雷斯的更务实批评，虽然 AI 工作者可能直接忽视，但其他不易被轻易驳回的声音也在回应，例如\
  \ J. Lighthill（1973）代表英国科学与工程研究委员会发言。如果足够多的批评者成功劝阻 ARPA 及整个 AI 研究，一些可能为国防部（NSA）带来的潜在好处可能永远不会实现。”¹⁸\n\
  \n# 1970–1982 年（冬季 1）\n在 1970 年代初期，所谓的“AI 冬天”开始，指的是研究者在经历资金削减的同时，仍需坚持并取得显著成果的年代。第一阶段的努力并非徒劳，因为在失败中，研究人员了解到自己需要关注的方向。\n\
  \n在 1970 年代，即时的目标不再是创造通用的人工智能机器，而是创造专门化的智能：特定机器应能在有限领域内表现出智能¹⁹。AI 先驱们最初充满 utopian\
  \ 希望，认为可以迅速将人类智能的奥秘转移到机器上，很快转变为对机器性能的更为务实的讨论。这是在探讨计算机能做什么或不能做，以及其局限性[DRE 72]。\n\n\
  20 世纪 70 与 80 年代，法国似乎充满强烈的怀疑态度。当时国家投入甚少，研究社区仍很小：\n\n> “计算机视觉研究活动非常活跃，与语音理解一样，是一项困难领域，需要巨大的计算机能力。幸运的是，许多应用所需的计算能力预计将在约十年内变得可用且经济可行。因此，研究人员目前正利用现有资源攻克问题的部分方面，并将努力的整合留待未来。”[HOL\
  \ 76]\n\n# 1982–1987 年（春季 2）\n日本的新一代计算机计划复兴了 AI 研究，雷根总统著名的“星际大战”演讲也推动了这一趋势。各大国展开技术竞赛，以免被日本完全超越和主导。AI\
  \ 与太空竞赛的努力体现了国际舞台上各国权力的博弈。80 年代，专家系统如雨后春笋般涌现。AI 商业化，军事上 AI 终于提供了提升作战效率的应用前景。资金大量涌入。\n\
  \n# 1987–2010 年（冬季 2）\n早期 80 年代的积极阶段很短暂。1987 年，AI 市场开始显示出显著的放缓迹象。专用 AI 硬件行业（LISP\
  \ 机）崩溃。\n\n# 2010–至今（春季 3）\n自 2011 年起，全球对 AI 的兴趣重新高涨，这一时期可真正称为“AI 春季”²⁰。这一复兴的根源在于三个变量的结合²¹：大数据、算法和计算能力的提升。这一说法是芬兰当局反复强调的：\n\
  \n> “更高效、更低成本的计算能力、AI 可以使用的数据量大幅增加，以及更先进的 AI 算法，都导致了人工智能的更密集使用。事实上，我们正经历人工智能的新春。”²²\n\
  \n这三个变量也可以称为大数据、机器学习（ML）和云计算[MIA 17]。\n\n人们再次寄予 AI 进步和贡献的厚望，国家和私人资金大量涌入，多年期的科研与开发计划相继推出，AI\
  \ 在所有可能的活动领域得到实施。若表现远低于预期，无疑会减缓当前的全球动态，进而导致资金下降、公众兴趣缺失以及 AI 产品商业活动衰退。当前部署的一般或弱 AI\
  \ 蕴含其自身局限的种子，而人类般的系统——忠实模仿智能能力的人类化系统——仍然遥不可及：\n\n> “[…] 我们生活的方方面面都将以某种方式发生改变。今天这些智能机器的进步似乎无限。它们会超越我们，甚至取代我们吗？如果超人工智能定义为在所有智能领域都能超越我们，那么我们的努力将在那时变得\
  \ obsolete。某种程度上这些机器拥有超人类能力，但实际上没有任何机器能与老鼠的智能相媲美。”²³\n\n进一步的失望将导致新的低潮。\n\n自 1950\
  \ 年代以来 AI 历史的这段分解是不完美的，因为它把 AI 的所有方面都简化为单一。行业、军事计划、政策以及各个应用领域的研究周期并不相同。研究并未经历真正的休眠期。全球研究持续进行，资金和资源的支持随时期和国家而异。出版量的增长、科学社区为自身结构化并围绕国家和国际协会及国际研讨会组织研究，都证明了这一点。\n\
  \n\n\n-   [各国在人工智能研发方面的努力主要是为了构建一个能够提供经济实力的技术领域，为多个行业提供推动进步的工具，并在军事领域提供有助于提升能力的工具。然而，在\
  \ 1950 年至 2000 年的数十年间，关于安全应用和问题的公开讨论几乎不存在，尽管情报机构已经能够利用人工智能为完成其任务作出贡献。]\n\n## 1.4.\
  \ The robot and robotics\n\nAI 与机器人紧密相关。人工智能在 1950 年代确立为一门学科及科学社区。专业出版物、研讨会、协会以及研究团队的创建参与了其构建过程。人工智能将机器人纳入其研究问题，但并未与机器人学（robotics）合作，而机器人学本身就是一个独立的学科。机器人学拥有自己的历史、挑战和研究问题。\n\
  \n![Figure 1.5. Manchester University Robot24. For a color version of this figure,\
  \ see www.iste.co.uk/ventre/artificial.zip](img/fig1-5.jpg)\n\n**Figure 1.5.** *Manchester\
  \ University Robot²⁴. For a color version of this figure, see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n在 18 世纪和 19 世纪，自动机的多项成就曾向公众展示。这些机器外形像人类，能够执行如书写或演奏乐器等任务。当然，这些机器缺乏自主智能。它们的智能来源于其聪明的设计者，他们创造了精确的机械结构。这些机器在文学中占据位置，反映了当时的技术：它们尚未被称为机器人，而是由电力、机械、钢铁以及有时蒸汽能源构成（参见\
  \ *The Steam Man of the Prairies* by Edward S. Ellis \\[ELL 68\\]）。\n\n20 世纪，机械化获胜；工业开辟了大规模生产的道路（例如\
  \ 1910 年代的福特工厂）。在此之前的自动机、机器和机械统称为“机器人”。Karel Capek 在 1921 年的戏剧中首次使用了这一术语，指代外形像人的机器。Isaac\
  \ Asimov 于 1941 年撰写短篇小说 *Liar!* \\[ASI 41\\]，其中提出了机器人“法则”。随后几十年，科幻作品赋予了机器人重要角色，推动了其全球成功。科幻作品也塑造了机器人的特定形象：它通常外形人类，且拥有生命以及超越人类的智能。\n\
  \n二战期间，装载炸药的无人飞机被称作“机器人炸弹”，投向敌军部队和人群。战后，其他具有工业应用的发展相继出现。1954 年，George Devol 和 Joe\
  \ Engleberger 设计了第一个可编程机械臂，并于 1962 年将其整合至通用汽车装配线。机器人占据了工业空间、科学空间，并被设计用于协助人类实验以及应对敌对环境。1994\
  \ 年，卡内基梅隆大学机器人研究所设计了八足机器人 DANTE II，探索了斯帕尔火山的陨石坑。其形态受蜘蛛形态启发，这一成就融合了传感器技术、计算机科学、电子技术和通信仪器。\n\
  \n机器人学作为一门科学学科，要么始于 1956 年，要么始于 1964 年：\n\n*   – 1956 年，George Devol 与 Joe Engelberger\
  \ 相遇。其合作催生了机器人产业、杂志（*Industrial Robot*）以及国际会议（*International Symposium on Industrial\
  \ Robotics*）。Joe Engelberger 有时被称为机器人之父；\n\n*   – 1964 年，机械工程师 Bernie Roth 与 AI\
  \ 研究者 John McCarthy 相遇。这标志着一次富有成果的合作、科学出版物、发展以及定期学术会议的开始，逐步形成了一个新的研究社区。\n\n第三种关于该学科诞生日期的说法追溯至\
  \ 1940 年代在美国开发的遥控机器人（用于操纵核材料）。Goertz 在 1952 年和 1954 年的文章是机器人学历史的起点²⁵。\n\n无论选择哪个确切日期，机器人学的诞生通常与人工智能（1950\
  \ 年代）的诞生同期。\n\n机器人学作为一门学科，自其起源以来一直与人工智能交织，但作为独立学科发展。  \n\n> “[…] 理解智能的科学任务已经在人工智能——计算机科学的一个子领域——中进行得相当不错。如果已经存在一个合适的直接科学领域，为什么还需要机器人？为什么人工智能不向机器人提供基础科学资本，就像计算机科学、机械工程和电气工程等其他供应商一样？\n\
  \n> \n\n> 有一个答案，进一步阐明了我的基本论点。人工智能目前与计算机科学共享一种特殊的视角——它把信息处理与能量分离。这种创建的内部环境，仅包含信息过程，是一种强大的抽象，它帮助计算机科学崛起，使其能够专注于本质机制。但抽象的代价在机器人学的未被探索的核心问题中显现得最为明显——即受控的、感知协调的运动。”\n\
  \nThe work of the Stanford AI Research Center in the 1970s integrated R&D in robotics:\n\
  \n> “We are pursuing fundamental studies in several areas: problem solving, perception,\
  \ automated mathematics, and learning. However, we find it productive to choose\
  \ as a goal the creation of a single integrated system \\[…\\] Our system consists\
  \ of a mobile robot vehicle controlled by radio from a large digital computer. The\
  \ principal goal is to develop software for the computer that, when used in conjunction\
  \ with the hardware of the vehicle, will produce a system capable of intelligent\
  \ behavior \\[…\\] Before we changed computers (at the end of 1969), our robot system\
  \ had achieved a primitive level of capabilities: It could analyze a simple scene\
  \ in a restricted laboratory environment; plan solutions to certain problems, provided\
  \ that exactly the correct data were appropriately encoded; and carry out its plans,\
  \ provided nothing went wrong during execution. Therefore, when we began planning\
  \ a new software system for controlling the robot from a new computer, we set more\
  \ difficult short term goals: The system is to be able to operate in a larger environment,\
  \ consisting of several rooms, corridors, and doorways; its planning ability must\
  \ be able to select relevant data from a large store of facts about the world and\
  \ the robot’s capabilities; and it must be able to recover gracefully from certain\
  \ unexpected failures or accumulated errors. We have not yet accomplished these\
  \ goals.” \\[RAP 71]\n\n\n\n与 AI 类似，机器人以美国为中心进行研发。然而，机器人和机器人在许多其他国家取得了巨大成功，其中包括日本——该国在研究与开发领域尤为积极：1997\
  \ 年，日本首届机器人锦标赛（RoboCup）举行；1999 年，索尼推出并商业化了 AIBO，这是首款宠物机器人狗；2000 年，本田研发了人形机器人 ASIMO。日本在机器人领域长期保持世界领先，超越美国及其他工业化国家。2010\
  \ 年，日本占据全球机器人产量的三分之二（尽管并非所有这些机器人都与人工智能相关）。这种成功很大程度上归功于日本在其领土上拥有机器人所需的所有技术与产业技能与基础（尽管它并非在所有这些领域——如力学、电子、计算、传感器等——均处于领先地位）[NAR\
  \ 10]。机器人化的努力也可以由特定的社会需求来解释：劳动力短缺以及老龄化人口，而移民无法加以弥补。因此，有必要用机器取代人类在生产中的角色，并思考支持老龄化群体的解决方案。机器人并非国家安全的优先事项，尤其是自二战结束以来，该国已不再拥有自主军队的权利。因此，投资重点转向非国防领域。\n\
  \n机器人是机器（人工智能是软件）：\n\n*   可编程；\n*   能够独立或半自主地执行任务；\n*   通过传感器与物理环境进行交互。\n\n一些机器人也是由操作员控制的机器（因此不存在自主性的问题）。所谓“非智能”机器，相对于“智能”机器，仅能执行重复性任务：抓取并移动物体。对于此类操作，它无需人工干预，从而在某种程度上是“自主”的，但很难称其为“智能”。自主性并不等同于智能。然而，这类仅能重复放置物体的机器，一旦装配上摄像头，便能通过视觉识别物体、区分不同类型并根据物体类型执行不同操作。视觉与感知需要人工智能算法[^OWE\
  \ 17]。智能机器是指内部集成人工智能程序的机器。\n\n### 1.5. 示例：1980 年代美国中央情报局（CIA）的人工智能集成案例\n\n计算机于 20\
  \ 世纪 60 年代初进入美国中央情报局（CIA），主要用于行政任务。随后，计算机逐渐成为支撑该机构核心任务——情报收集与数据处理的工具²⁶。\n\n20 世纪\
  \ 80 年代，计算机成为机构活动的关键组成部分，必须应对数据量激增的挑战——数据需在各部门中收集、存储、分析并快速分发。机构面临数据、计算机及网络带来的限制：大量数据产生、机器与个人之间的高速流动连接。当时，观察者将“速度”与“数据量”视为两大关键变量。然而，这些发现并未动摇技术本身，因为技术被认为为机构运作与情报分析带来了明显的附加价值。技术引入被描述为一种动态过程。20\
  \ 世纪 80 年代中期，人工智能尚未被采用，但机构启动了反思进程，动员各服务与管理层，探索在情报领域的潜在应用。\n\n此外，数据产生速度与密度的提升并非仅源于技术。机构内部存在政治与政府意愿，致力于每日产出更多关于广泛议题的知识（1983\
  \ 年 CIA 共产出 800 份报告；但其中一半人员专注于苏联[^DDI 84]）。\n\n美国情报界对人工智能的处理可通过网络上公开的资源进行分析。因此，CIA\
  \ 在其官网提供一系列档案文件²⁸。在这些数据集中，我们需要寻找能够描述情报机构与科学及创新技术之间关系的信息，了解机构如何组织自身以应对新兴对象（如创建小组、指定领导、建立网络、监控等），以及针对情报特定需求所设想的人工智能应用，并按时间顺序梳理这些发展（机构何时关注该议题、采取行动、以及关键里程碑）。这一\
  \ CIA 历史的侧面长期被忽视与隐匿：\n\n> “中央情报局将科学与技术在情报艺术中的应用远不如其他方面受到关注[…] 然而，利用科学与技术已是 CIA 活动的重要组成部分，几乎自成立伊始即已存在。1962\
  \ 年，这导致成立了研究副司令部，随后在 1963 年被科学与技术副司令部取代，并于 1965 年改名为科学与技术司令部。”[^RIC 01]\n\n此外，若考虑\
  \ CIA 在技术采购与所有权方面的政策，则需从相反方向审视——情报对学术研究界与产业的影响。CIA 并非简单的“客户”用户：“它也负责推动若干科学进展”[^RIC\
  \ 01]。\n\n#### 1.5.1. *CIA 为适应自身需求而理解与采用人工智能的工具与方法*\n\n早期 80 年代，情报与国防社区强烈倾向于开发与实验智能计算机系统，以处理数据处理任务[^ECK\
  \ 84]。国防与情报官员观察到数据量不断膨胀与人力资源受限之间的失衡。AI 被视为解决此管理挑战（而非安全问题）的潜在方案。降低数据采集、生成或向分析人员提供的量并未被考虑。唯一的情景是数据量持续增长、流速加快，人类能力被机器系统所压倒，亟需机器补偿：\n\
  \n> “人工智能的核心目标是使计算机能够模拟人类在分析与解读数据时所使用的智力功能。基于此，情报社区致力于评估人工智能作为智能计算机系统技术关键的潜力，以服务于情报应用。”[^ECK\
  \ 84]\n\n早期 80 年代对人工智能的特殊兴趣，是美国情报局在预算恢复（上个十年损失部分经费）后的关键阶段，这一资源补充使机构得以进入新的增长阶段：招聘人员、拓展业务、拓宽专业领域、提升生产力与研究活动。\n\
  \n\n\n\n> “过去四年，情报界预算出现了显著增长 \\[…\\] 这使我们得以恢复在 1970 年代失去的许多能力 \\[…\\] 在过去四年，我们首次在\
  \ CIA 建立并实施了一项涵盖大量国家和议题的综合研究计划 \\[…\\] 我们重建了人类情报能力 \\[…\\] 在技术层面，对新技术系统的投资开始产生回报。”\
  \ \\[DDI 84\\]\n\n这场现代化将提升数据收集能力，从而产生新的分析需求：\n\n> “这意味着我们能够收集的情报信息质量和精度将大幅提升。同时，数据量也将大幅增加。这表明我们必须开始投资于处理系统，以匹配我们在收集原始数据方面的能力\
  \ \\[…\\] 我们必须避免被来自所有来源的大量信息所淹没，而这正是计算机、软件及其他新技术的发展应当帮助我们的所在。” \\[DDI 84\\]\n\n\
  虽然财务资源的障碍似乎已被清除，但新系统的实施并未变得简单。主要困难在于定义目标和适当的方法。决策者（机构内部的管理者）水平较低也被指出，这对其做出的选择产生了影响：\n\
  \n> “美国工业界和政府的一个严重问题是高级管理者对计算机一无所知 \\[…\\] 这些管理者几乎不知道主 frame 与麦卡车（Mack truck）的区别。我们该怎么办？我们转向自己组织内部的计算机专家，他们思维狭隘、守土有术，对大规模规划、网络和实验持有敌意。因此，我们有时会开发出无法相互通信、只满足当下需求的不完善系统。”\
  \ \\[DDI 84\\]\n\n还需考虑的其他特殊因素包括机构的结构和运作模式，这些在技术系统的组织方式中有所体现，有时被称为“问题”：\n\n> “在 CIA\
  \ 使用计算机的主要问题围绕隔离和安全。与规模相似的私营部门组织不同，我们必须拥有一个基于‘需要知道’的系统，可能只涉及少数人。” \\[DDI 84\\]\n\
  \n安全要求产生特殊约束，系统必须整合这些约束：“我们必须在同防范外部‘黑客’的同时，也防范内部‘内奸’的可能。” \\[DDI 84\\]\n\n80 年代早期，CIA\
  \ 将其计算机系统划分为五个独立系统：一个用于分析师、一个用于作战、一个用于行政、一个用于人员安全以及一个用于处理和分析技术情报数据。每个系统都有自己的软件。\n\
  \n1983 年，CIA 制定了《CIA 战略计划》（1983–1993）\\[FIT 83\\]，该计划列出了将受到集中发展政策的具体领域：人工智能（AI）是其中之一，同时包括人力资源、信息处理、太空、危机管理、恐怖主义、秘密通信、秘密情报收集、军备控制监测以及情报保护。\n\
  \n正是在这种 renewal（更新）的背景下，机构关注到了 AI（位于当时人工智能第二波的起点与计算机第五代的交汇处），其管理层对此抱有显著的期望：\n\n\
  > “我们将利用 AI 在专家系统应用中，以便我们能够检测指标异常以进行预警，合成数据组合以进行分析，扫描邮件以筛选关键信息，或发现知识盲区。AI 在处理海量原始数据而无需将原始数据转换为标准格式（我们目前的做法）的情况下，将帮助我们从海量信息中辨别重要信息，尤其是在信号情报（SIGINT）和影像方面\
  \ \\[…\\] 更高级的模拟和建模技术将提升我们预测未来事件可能结果的能力。AI 将帮助分析师比较不同形式的数据 —  — 影像、SIGINT、普通文本 \\\
  […\\] 另一个应用可能是实时访问更多数据，特别是在危机期间。” \\[DDI 84\\]\n\n然而，也有声音呼吁极度谨慎。面对对 AI 能够彻底转变情报能力的寄望，我们必须认识到实现这些成就的道路仍然漫长：\n\
  \n> “从我们的视角来看，AI 领域的进展可能会十分缓慢。对快速进步及实际应用的承诺应保持一定的怀疑态度。” \\[DDI 84\\]\n\n情报副局长（DDI）在向安全事务支持协会成员的演讲中强调，机构需要抵制商业压力、营销论调和“卖家”的承诺：\n\
  \n> “我能告诉你有多少次承包商试图向我推销能够 flawlessly 预测苏联领导层下一步行动的软件。在我们真正理解直觉过程的机制之前，编写能够复制分析师工作的‘专家系统软件’似乎很困难。”\
  \ \\[DDI 84\\]\n\n怀疑态度甚至在对这些新技术的看法中带有一定的讽刺意味，或者说对其局限性的认识：“当代的专家系统是‘笨拙天才’，在严格界定的应用范围内表现出明显的有用性”\
  \ \\[ECK 84\\].\n\n1983–1984 年的情报期望与 2010 年代后期相当：检测、预测、原始数据处理、图像与信号处理等。\n\n我们也可以看到，自那时起开发的\
  \ AI 系统并未完全实现其承诺：专家系统及其他用于处理异构格式多源数据的模式并未使我们能够预测苏联解体、预知 2001 年 9 月 11 日的袭击，或其他标志性事件。\n\
  \n尽管如此，情报界和军方对情报领域科学进展的关注可以追溯到 1980 年代之前。军方通过 ARPA/DARPA 支持美国学术机构的工作，而 CIA 与国防部也持续监测全球\
  \ AI 研究，这在 1960 年代的国际研讨会或组织访问记录中有所体现²⁹。\n\n| Type of action || Precise title ||\
  \ Theme/object || Date || Location |\n| --- | --- | --- | --- | --- |\n| **Participation\
  \ in or organization of symposiums, with contributions from civil experts (industrialists,\
