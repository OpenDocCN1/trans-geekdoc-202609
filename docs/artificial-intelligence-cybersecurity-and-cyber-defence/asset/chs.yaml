  \ || Theme/object || Date || Location |\n\n\n\n# 1.5.2. *Focus groups, research,\
  \ coordination*\n\n创建工作、反思、研究和协调小组，负责组织培训计划并与工业界进行对话，既不是专属于 CIA 的做法，也不是情报界的通用方式，也不是专属于“AI”主题的。1983\
  \ 年同年，DIA 和 NSA 例如³⁶ 也成立了专门面向 AI 的工作组。这些小组的职能是针对各机构（DARPA 为国防目的、CIA 为情报等）的具体情境思考\
  \ AI。AISG（人工智能指导小组）在 CIA 内部于 1984 年观察到，国防部在 AI 研究上的投入远高于情报界，建议应当加强两者合作，以利用国防部已取得的成果³⁷。\n\
  \n该小组实施后，组织了会议，形式为前往开展 AI 研究的机构进行访问：1984 年 8 月 27 日，参观了国家标准局（NBS）³⁸；1984 年 5 月 10\
  \ 日，参观了 MITRE 公司³⁹。通过这些会议，ISAG 成员试图找出在情报领域可能有潜在应用的项目。\n\n在 CIA 的信息系统董事会（ISB）内部，创建了多个工作流，其中包括专门针对\
  \ AI 的人工智能应用工作组（AIAWG）。1983 年的会议中，其目标之一是识别 CIA 的 AI 需求或 AI 可以为机构提供的机会。识别需求的方法是询问各部门认为\
  \ AI 能够满足的应用场景。这套方法假设对话者对 AI 的可能性有相当精确的了解：“可以看到，多个办公室出现共同的需求，但每个都用其所在领域的语言和术语表述”⁴⁰。\n\
  \n1983 年 12 月 14 日会议的总结备忘录草案并未提出任何关于这种趋同原因的问题。这可能是因为各被咨询服务的需求真正出现了汇聚，也可能是因为大家对 AI\
  \ 的共同认知以及它能提供的价值。在此次练习中，唯一识别出的差异仅在于术语表述的用词。此外，需求被表述得过于笼统：“在确定这些总体需求后，我们还有更具体的工作要做。”⁴¹\n\
  \n# 1.5.3. *The network of interlocutors outside the intelligence community*\n\n\
  将 AI 融入情报界的实践和政策，需要广泛动员外部参与者。\n\n这种做法既不是专属于 AI 新兴主题，也不是专属于情报界本身：\n\n> “本国在政府与私营企业合作方式上独具特色[…]\
  \ 在美国，我们依靠爱国情怀和利润动机让系统运作[…] 新的技术装置和分析技术，使我们能够理解日益增长的对美国及其人民的威胁，这些技术依赖于私营企业与政府之间协同关系。”[DDI\
  \ 84]\n\nCIA 在 AI 方面的做法是保持对科研与发展的关注，识别学术、军事和工业界的参与者，并与之对话，以了解可如何将现有的 AI 移植到情报界。CIA\
  \ 与情报界之外的各方就广泛议题进行对话，保持警觉、准备应对。例如，1983 年，约 1,200 名分析师参加了 500 多场关于多种主题的会议[DDI 84]。\n\
  \n在考虑将知识与技术适配自身需求之前，CIA 并未急于购买（文档未说明具体的转移方式），而是先弄清楚其中的关键点：\n\n> “IASG 与 IR&DC 正在为国会考虑的建议准备报告，指出有前景的\
  \ AI 技术发展正在发生，并且可能对情报界适配有价值。”⁴²\n\n这条逻辑贯穿了 CIA 获取和整合技术的整体策略，旨在节约财政资源并将现有技术适配自身需求。因此，面对那些并未根本质疑其正当性的购置请求，CIA\
  \ 主任在 1982 年写道：\n\n> “在对购置 VHSIC/VLSI 设施的建议发表评论之前，主任和我希望国会能进一步探讨具体涉及的内容。我们最初的反应是担心成本可能过高。与其资助此类设施，或许可以利用已有的商业设施，探索对情报项目可能独有的电路[…]\
  \ 我们认为，低功耗高密度存储技术[…] 应该由其他国防和商业项目同步推进，从而使情报界能够借鉴外部的研发成果。”⁴³\n\n1987 年，CIA 行政副局长表达了希望在卡内基梅隆大学（Carnegie‑Mellon\
  \ University）安排一名人员进行一年培训，以在技术和政治层面代表本机构；另一种方案是派驻一名“教授”驻留两年：\n\n> “[…] 机构应在卡内基梅隆大学有一名具备\
  \ ADP 背景的人员[…] 请[…] 安排一名合适的官员前往卡内基梅隆接受为期一年的人工智能领域培训，或安排一名官员在卡内基梅隆为期两年担任‘驻留教授’[…]\
  \ 该人员应是我们相信能够在技术和政治层面代表我们的个人[…] 让我们认真、积极地推进这项工作。”[MAL 87]\n\n**Table 1.4.** *非情报行为体，CIA\
