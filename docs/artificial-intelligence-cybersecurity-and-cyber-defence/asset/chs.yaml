  \ healthcare etc.”¹⁸ || 2016 |\n\n| --- | --- |\n\n| “AI is the practice that intends\
  \ to make machines think.”¹⁹ || 2017 |\n\n| “Artificial intelligence is likely to\
  \ be a ‘big help’ rather than a ‘hindrance’.”²⁰ || 2018 |\n\n| “Artificial intelligence\
  \ is changing every aspect of war.”²¹ || 2019 |\n\n| “How artificial intelligence\
  \ is changing cyber security landscape and preventing cyber attacks.”²² || 2019\
  \ |\n\n**Table 2.7.** *Some assertions or hypotheses about what artificial intelligence\
