- "# \n人工智能、网络安全与网络防御\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nISBN 978-1-78630-467-4\n\n\
  # Introduction\n\nCyberspace, from the laying of its first building blocks in the\
  \ 1950s (the first computers, the first software), to what it has become today –\
  \ a vast, extremely dense network made up of billions of computers, electronic chips,\
  \ data flows, with billions of users increasingly dependent on this technological\
  \ environment – has continued to grow and expand, in a movement of expansion that\
  \ nothing seems to be able to stop. It has transformed the world, to the point where\
  \ it has reached the status of a new dimension, alongside the land, the sea, the\
  \ air and space. Although there was no mention of “cyberspace” in the mid-20th Century,\
  \ the foundations had already been laid.\n\nSince then, this expansion has been\
  \ motivated as much by scientific as by economic and industrial motives, as well\
  \ as by political issues.\n\nThe recent technological markers of this development\
  \ are, for example, “Big Data”, “cloud computing”, “4G”, “5G”, the “Internet of\
  \ Things”, “IPv6” and “social media”. At the political and societal level, the manifestations\
  \ of this expansion can be seen by access to the Internet, which affects an ever-growing\
  \ population, by increasingly “digital” societies (e-administrations, social media,\
  \ etc.) and by economies that are increasingly dependent on networks, the Internet,\
  \ computers and communication tools. Some see the effects of this expansion of cyberspace\
  \ as the democratization of societies, greater freedom of expression and a more\
  \ dynamic and efficient economy, while others deplore the restriction of freedoms\
  \ and the strengthening of state control and surveillance capacities, and therefore\
  \ see this as a cause for the destabilization of societies.\n\nIn this landscape,\
  \ the concept of artificial intelligence (AI) (re)asserted itself around 2015. AI\
  \ is an element of cyberspace, one of the driving forces behind this broad movement\
  \ of continuous expansion. But even before thinking about its transformative capabilities\
  \ – will AI have such a profound impact on cyberspace that it will change its nature?\
  \ – it is worth observing how AI fits into cyberspace, alongside all the pre-existing\
  \ bricks and mortar. Before we think of “transformation” or even “revolution”, we\
  \ must think of “contribution” and “adaptation”.\n\nAI is “cyber” in its own right,\
  \ because it exists only through software, programming languages, computers, microchips\
  \ and the data it feeds on and produces. AI is a scientific discipline and a set\
  \ of techniques that originated at the same time as computers, at the end of World\
  \ War II, in the United States, before spreading to the rest of the world. The histories\
  \ of AI, computers, computing and cyberspace will continue to be closely linked.\n\
  \nParadoxically, however, today’s treatment of AI gives the impression that there\
  \ are two distinct concepts. Articles, books, colloquia, organizations, doctrines\
  \ and defense strategies, to name but a few, seem to separate AI and “cyber”, with\
  \ one exception: when AI is understood as a set of new techniques in the field of\
  \ cybersecurity. In our view, however, AI should be entirely included in cyberspace,\
  \ of which it is only one of the bricks. It should therefore be seen as a component\
  \ that will be part of a pre-existing whole, on which it will have an impact, but\
  \ whose nature and possibilities will also be constrained by this pre-existing environment:\n\
  \n> “No doubt you have been deluged with a flood of reports about AI/ES¹. Almost\
  \ simultaneously, you have read that it will revolutionize the way you do business\
  \ \\[…\\] If you are like most members of senior management whom we have surveyed,\
  \ you are intrigued by the possibilities of this powerful new tool but are too busy,\
  \ intimidated, or simply unable to discern the truth. But you should, because the\
  \ bottom line implications are staggering.” \\[GIL 85\\]\n\nIt was in these terms\
  \ that Temple University invited managers from the business and administrative sectors\
  \ to attend one of its conferences dedicated to AI in 1985. Today, AI still raises\
  \ many questions, the same curiosity, and its transformative power is still highlighted,\
  \ with the difference, however, that it is no longer a question of limiting the\
  \ revolution to a few areas. It will affect all areas of human activity.\n\nAI is\
  \ already present, everywhere around us and in our daily lives, without us being\
  \ aware of it most of the time. Modern vehicles that are equipped with electronics\
  \ and computer technology are equipped with AI, where the software analyzes data\
  \ from thousands of sensors in real time and performs calculations to regulate fuel\
  \ supply and stabilize the vehicle, as well as many other functions. In autonomous\
  \ vehicles, information systems take control: AI analyzes the data and “decides”\
  \ the actions to be taken to drive the vehicle. Mobile phones, virtual assistants,\
  \ social networks, anti-spam filters, video games, search engines, medical diagnostic\
  \ support systems and simulation platforms are some of the applications that have\
  \ benefited from AI, though it is impossible to draw up an exhaustive list. AI applications\
  \ multiplied, in particular, during the 1980s, in the form of expert systems, of\
  \ which industry, as well as defense forces, were major consumers.\n\nThe current\
  \ craze for AI is part of a series of repeated cycles, so there is no guarantee\
  \ that it will last. However, for the time being, States have been won over, seeing\
  \ it as a new means of achieving their ambitions: economic and industrial renewal,\
  \ a new society, governance, AI as an instrument of power and might, and so on.\n\
  \nIn this book, we will try to understand how AI has gradually been integrated into\
  \ defense policies, strategies and doctrines, and, more specifically, into cybersecurity\
  \ and cyber defense. The integration of AI into the fields of security and defense\
  \ is the result of a long process which has its roots in the 1950s. Current debates\
  \ on the use of AI in military affairs necessarily refer to debates on RMA (Revolution\
  \ in Military Affairs), on changes in the institution of the military, its organization,\
  \ doctrines and challenges, on changes in power relations, on weapons (arms race,\
  \ militarization, control), on the law of armed conflict and on the form and nature\
  \ of conflicts.\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\
  \n这本书的结构以涉及人工智能（人工智能研究史，与军队密切相关的历史，在某些国家），概念定义（人工智能在何种术语下被提及？军队如何定义人工智能并将其纳入其话语？），政策（国家网络安全战略）以及人工智能在军事事务中的应用（人工智能军事策略、概念、教义、网络安全与网络防御、不同参与者）。本书是当前关于人工智能在国防事务中的作用的辩论综合。由于人工智能本质上是“网络”的，本书探讨了网络空间军事化的一个维度。这种对人工智能的新兴兴趣是否是网络空间重新配置的起点，以及关于网络安全和网络防御问题、网络冲突及其多种形式和表现方式的新思维方式的起点？我们是否正在重新考虑关于网络空间特定特征的既有信念，例如其流动性、无法划定边界和困难于标记或捍卫主权、无法分配行动以及难以控制信息的难题？\n\
  \n在这本书中，读者将发现大量文献参考（有时很长），引文以及几个总结表格，因为我们希望创建一个有用的工作工具，以便进一步发展。\n\n**Table I.1.**\
  \ *The three strata of cyberspace (L = layer) and the place of AI in each of them*\n\
  \n|  | Cyberspace |  |\n| --- | --- | --- |\n| **L3** | No AI | AI | Psycho-cognitive.\
  \  \nEssential dimension for AI, because the main challenge of AI is to reproduce\
  \ and imitate cognitive capacities.  \nCreation of fake images, fake videos, fake\
  \ Internet users, manipulation of information, perceptions, etc. |\n| **L2** | No\
  \ AI | AI | Software, applications.  \nExamples: AI-based applications (natural\
  \ language, image processing, etc.), AI-specific programming languages (LISP, etc.).\
  \ |\n| **L1** | No AI | AI | Hardware.  \nExamples: specific chips for AI applications,\
  \ robots embedded with AI, etc. |\n\nArmies and armed conflict have integrated computers,\
  \ computing, networks and the “cyber” dimension. But this kind of computer science\
  \ is different from what AI suggests or what it already shows. The computer, as\
  \ Ted Nelson wrote in 1978, is “a box that follows a plan”² (meaning that, in this\
  \ concept, the computer executes code, line by line, as programmed, and cannot go\
  \ beyond it). AI promises precisely to break with this logic, it promises surprises\
  \ and new worlds. Is the prospect of machines that can make their own decisions,\
  \ formulate their own plans and “think” something that army commanders can dream\
  \ of at the beginning of this 21st Century?\n\n1.  1 AI/ES: Artificial Intelligence/Expert\
  \ Systems.\n\n2.  2 \\[NEL 78\\]\n\n## 1  \n\nOn the Origins of Artificial Intelligence\n\
  \n## 1.1. The birth of artificial intelligence (AI)\n\n### 1.1.1. *The 1950s–1970s\
  \ in the United States*\n\nAlan Turing’s article, published in 1950 \\[TUR 50\\\
  ], which is one of the founding works in the field of AI, begins with these words:\
  \ “I propose to consider the question, ‘Can machines think?’”\n\nIn 1955, “Logic\
  \ Theorist”, considered to be the first AI program, was developed. This work was\
  \ the result of cooperation between three researchers: a computer scientist (John\
  \ Shaw) and two researchers from the humanities and social sciences (Herbert Simon\
  \ and Allen Newell) \\[SIM 76\\]. The application was programmed using IPL language\
  \ \\[STE 63\\], created within the RAND and the Carnegie Institute of Technology¹\
  \ (a project that received funding from the US Air Force). Here we have the essential\
  \ elements of AI research: a multidisciplinary approach, bringing together humanities\
  \ and technology, a university investment and the presence of the military. It is\
  \ important to note that although the program is described today as the first AI\
  \ code, these three researchers never use the expression “artificial intelligence”\
  \ or present their software as falling into this category. The expression “artificial\
  \ intelligence” appeared in 1956, during a series of seminars organized at Dartmouth\
  \ College by John McCarthy (Dartmouth College), Claude Shannon (Bell Telephone Laboratories),\
  \ Marvin Minsky (Harvard University) and Nathaniel Rochester (IBM Corporation).\
  \ The aim of this scientific event was to bring together a dozen or so researchers\
  \ with the ambition of giving machines the ability to perform intelligent tasks\
  \ and to program them to imitate human thought.\n\n![Figure 1.1. The first artificial\
  \ intelligence computer program “Logic Theorist”, its designers, its results](img/fig1-1.jpg)\n\
  \n**Figure 1.1.** The first artificial intelligence computer program “Logic Theorist”,\
  \ its designers, its results\n\n![Figure 1.2. The organizers of a “conference” (two-month\
  \ program) at Dartmouth College on artificial intelligence in 1956](img/fig1-2.jpg)\n\
  \n**Figure 1.2.** *The organizers of a “conference” (two-month program) at Dartmouth\
  \ College on artificial intelligence in 1956*\n\nWhile the 1956 conference was a\
  \ key moment in AI history, it was itself the result of earlier reflections by key\
  \ players. McCarthy had attended the 1948 *Symposium on Cerebral Mechanisms in Behavior*,\
  \ attended by Claude Shannon, Alan Turing and Karl Lashley, among others. This multidisciplinary\
  \ symposium (mathematicians, psychologists, etc.) introduced discussions on the\
  \ comparison between the brain and the computer. The introduction of the term “artificial\
  \ intelligence” in 1956 was therefore the result of reflections that had matured\
  \ over several years.\n\nThe text of the proposal for the “conference” of 1956²,\
  \ dated August 31, 1955, submitted for financial support from the Rockefeller Foundation\
  \ for organizing the event, defines the content of the project and the very concept\
  \ of artificial intelligence:\n\n> “The study is to proceed on the basis of the\
  \ conjecture that every aspect of learning or any other feature of intelligence\
  \ can in principle be so precisely described that a machine can be made to simulate\
  \ it. An attempt will be made to find how to make machines use language, form abstractions\
  \ and concepts, solve kinds of problems now reserved for humans, and improve themselves.”\n\
  \nThe project was more successful than expected because 10 people did not participate,\
  \ but 43 (not including the four organizers)³, including Herbert Simon and John\
  \ Nash. This audience was composed almost entirely of North Americans (United States,\
  \ Canada), and two British people. In any case, it was entirely Anglophone.\n\n\
  In an article titled “Steps toward artificial intelligence” \\[MIN 61\\], Marvin\
  \ Minsky described, in 1961, these early days of AI research and its main objectives:\n\
  \n> “Our visitor⁴ might remain puzzled if he set out to find, and judge these monsters\
  \ for himself. For he would find only a few machines (mostly ‘general-purpose’ computers,\
  \ programmed for the moment to behave according to certain specifications) doing\
  \ things that might claim any real intellectual status. Some would be proving mathematical\
  \ theorems of rather undistinguished character. A few machines might be playing\
  \ certain games, occasionally defeating their designers. Some might be distinguishing\
  \ between hand-printed letters. Is this enough to justify so much interest, let\
  \ alone deep concern? I believe that it is; that we are on the threshold of an era\
  \ that will be strongly influenced, and quite possibly dominated, by intelligent\
  \ problem-solving machines. But our purpose is not to guess about what the future\
  \ may bring; it is only to try to describe and explain what seem now to be our first\
  \ steps toward the construction of ‘artificial intelligence.’”\n\n\n\n\n-   [人工智能研究](https://wiki.example.org/ai_research)以在美国主要大学创建的新实验室为结构。斯坦福大学于\
  \ 1963 年创建了其人工智能实验室。在 MIT，人工智能工作由 MAC 项目（数学与计算项目）负责，该项目于 1963 年成立，并获得 ARPA（美国国防部高级研究计划局）的大量资金支持。\n\
  \n1.  斯坦福人工智能实验室自成立之初就采用防御性的研究视角。ARPA 作为美国国防部（DoD）下属机构，通过众多项目资助了相关工作，因此研究主题受到军事需求的影响。例如，Monte\
  \ D. Callero 的论文《An adaptive command and control system utilizing heuristic learning\
  \ processes》（1967）旨在开发用于武装冲突期间实时分配防空导弹的自动决策工具。研究者需要建模导弹防御环境，并构建决策系统以提升其性能，实验结果见\
  \ \\[EAR 73\\]。随着岁月推移，国防机构的影响力不断增强。到 1973 年 6 月，人工智能实验室共有 128 名员工，其中三分之二受 ARPA 资助\
  \ \\[EAR 73\\]。\n\n2.  尽管与国防部关系密切，但这并未限制其实验室的所有工作。1971 年半年度报告 \\[RAP 71\\] 中，斯坦福大学描述了其前景如下：\n\
  \n> “该领域涉及自动系统的开发，通常包括通用数字计算机，能够执行通常被视为需要人类智能的任务。此类系统能够感知物理环境、解决问题、制定并执行计划，并通过经验改进其行为。该研究的成功将使机器能够在各种危险或敌对环境中取代人类，从而为政府和工业应用提供广泛可能性。”\n\
  \n3.  1970 年代 MIT 的研究虽由军方资助，但范围仍保持广泛。1973 年向 ARPA 汇报时，研究人员认为他们已达到一个里程碑，能够将此前的理论工作转化为实际应用。但这些应用不能仅限于国防领域：\n\
  \n> “十年的人工智能研究成果使我们站在基于知识的编程新阶段的门槛上——在此阶段，我们可以设计能够（1）合理应对极为复杂的情境，以及（2）更为重要的未来应用——在遇到限制、错误或信息不足时，与操作者进行智能交互的计算机系统。”⁵\n\
  \n4.  接下来的一些新研究方向被拒绝：\n\n> “我们相信人工智能研究将指明通往比以往任何时候都更强大的基于计算机的信息系统的方向。我们计划攻克信息检索领域，涵盖传统数据库和图书馆问题以及个人管理信息系统问题。新型信息系统应提升负责复杂行政结构以及技术性信息难题的个人的效率。特别是，服务将通过\
  \ ARPANET 可用且易用，并设计为与其他个人的个人系统交互，以识别冲突并协调共同关注的事项。”\n\n5.  除了大学团队，RAND 公司也在推动美国人工智能发展中发挥了重要作用。Willis\
  \ H. Ware 的著作 *RAND and the Information Evolution* \\[WAR 08\\] 是理解美国人工智能早期发展（自\
  \ 1960 年代起）所起作用的重要资源。该书覆盖 1946–2008 年，分为两个阶段：1946–1983 年，在此期间机构内部的研究被组织为部门；随后 RAND\
  \ 重组为以程序行动为中心的结构。\n\n6.  1963 年，Ware 回忆说，首本由 Feigenbaum 和 Feldman 编写的 AI 著作包含 20\
  \ 篇贡献，其中 6 篇由 RAND 研究人员撰写。Allen Newell 和 Cliff Shaw（均为 RAND 研究员）与赫伯特·西蒙（Carnegie\
  \ Institute of Technology）合作的早期工作奠定了 AI 研究在学习、理论证明和知识表示等方面的基础。Ware 提醒我们，AI 研究并非孤立进行，而是建立在计算机科学等领域的进步之上，包括在\
  \ JOHNNIAC 等新型计算机的集中使用（直至 1960 年代中期）。AI 研究汲取了计算机科学及众多其他学科的成果。\n\n7.  人工智能的历史可能显得以美国为中心，但我们不能忘记，\
  \ robotics（机器人）和计算机科学的研究——旨在理解大脑工作原理——汇聚于 AI，使得全球范围内的研究者同时受到激励。\n\n8.  在英国，Grey\
  \ Walter 的研究早在 1940 年代就成为这一国际学术运动的一部分，该运动关注大脑过程建模和智能定义。Grey Walter 于 1947 年在布里斯托尔设计了“turtles”（机器人），被视为首批自主电子机器人（Luce\
  \ Langevin 描述 1950 年代为“建立了电子动物园”的时期）\\[LAN 69\\]。这些方法基于一种强烈的假设：大脑的功能相当于机器的功能：“生理学家将其作为工作假设，认为大脑的运作是机械的”\\\
  [ASH 51\\]。\n\n9.  当前大国之间的竞争与 1950 年代至 1960 年代的研究历史及早期发展密不可分。中国和俄罗斯，特别是，并未等到 2000\
  \ 年代或 2010 年代才投入 AI 研究。它们现在的活动基于与美国类似的、已有数十年历史的模式。\n\n### 1.1.2. *AI research in\
