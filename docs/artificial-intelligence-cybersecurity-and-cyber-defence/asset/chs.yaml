  \ the Open Sessions of the Workshop on Imaging Trackers and Autonomous Acquisition\
  \ Applications for Missile Guidance*²⁵ || 1979 ||  |\n| *DTIC ADA113908: Guidance\
  \ and Control Technology for Highly Integrated Systems*²⁶ || 1982 || On Autonomous\
  \ Integrated Weapon Systems |\n| *DTIC ADA140369: A Preliminary Investigation on\
  \ the Application of Robotics to Missile Fire Control* \\[MCI 83\\] || 1983 || 考虑将\
  \ AI 和机器人应用于火控问题，目标是将监视与目标指定系统演进为自主火控系统。 |\n| *DTIC ADA147272: Rand’s Experience\
  \ in Applying Artificial Intelligence Techniques to Strategic-Level Military–Political\
  \ War Gaming* \\[DAV 84\\] || 1984 || 本文讨论 RAND 的 AI（特别是专家系统）在军事政治战略演习中的经验，自主系统负责政治和军事决策。\
  \ |\n| *DTIC ADA436516: Artificial Intelligence and Expert Systems*\\[STE 86\\]\
  \ || 1986 ||  |\n| *DTIC ADA276575: Standard Target Materials for Autonomous Precision\
  \ Strike Weapons*\\[WAL 93\\] || 1993 || 激光制导炸弹、精确打击炸弹。随着“沙漠风暴”行动的开展，对这些武器的兴趣重新焕发。这些自主武器需要极其精确的目标地理坐标；数据不精确即为无用。\
  \ |\n| *DTIC ADA282715: Autonomous Weapon Guidance*²⁷ || 1994 || 具有预设目标的炸弹或导弹。这些炸弹通过\
  \ GPS、激光雷达等系统进行跟踪。 |\n\n### 3.3.6. *Robotics and AI*\n\n当今，机器人与人工智能之间常被划等号，似乎不可分割。现代机器人似乎只因其与\
  \ AI 的耦合而受到关注。但“机器人”和“人工智能”是两个相当不同的对象、领域或类别，它们的交汇产生了“智能机器人”。\n\n而且，机器人早已在人工智能出现之前就存在，其在战争中的使用已经影响了战术和策略。在作战艺术中，机器人先于\
  \ AI 出现。\n\n非人控制武器最早在第一次世界大战时期出现。二战期间，德国人使用了 Goliath 机器人——一种装载炸药的 3 公里范围的微型遥控坦克：“秘密的机器人飞机正在攻击英国，可能很快就会被揭开。美国部队在香农半岛推进时，已俘获完整的两架机器人飞机发射站，专家正在研究其秘密。”²⁸\n\
  \n二战期间，盟军使用无人机、无线引导航空器对欧洲德国目标进行轰炸（特别是“阿菲罗迪亚”和“安维尔”行动）。然而，这些“机器人”并没有真正的自主性。飞行员需要起飞，将飞机放在正确路线上，然后交给地面操作员，随后必须从飞机上跳出。\n\
  \n\n\n\n世界战争二战是这些新型武器的试验场：“据报道，德国在西线使用机器人机枪。这些武器由遥控电力操作。”²⁹\n\n参战各方广泛使用这些被称为机器人、机器炸弹和机器飞机的新型遥控武器，因此这些机器人成为最早的杀人机器。战报每日转述德国导弹对伦敦和主要欧洲城市的攻击。伤亡人数难以计算。这种战争的机械化不再仅仅致命于军队，它也对那些成为这些“机器”首要目标的平民构成致命威胁。于是，“机器人”这一概念，在想象或集体意识中原本是人类的助手，仅仅变成了一种武器，其致命力令人印象深刻。那时的机器人本质上是一枚遥控炸弹。\n\
  \n1930 年代出现了大量机器人实验，包括生产“飞行员机器人”飞机。当时的报刊对这些实验和演示充满赞赏，我们常能看到配有照片和简短说明的报道，表明聪明的发明家研发出能够几乎从事所有人类活动的类人机器人：\n\
  \n> “世界上最完美的机器人被一位年轻的英国科学家声称，他在长达 14 年的劳作中，花费近 18,000 美元，终于完成了一种几乎人类的机械人。这台惊人的机器人能说话、唱歌、哨叫、笑，甚至进行半小时的对话，报时并告知日期，还能扣动手枪扳机并阅读报纸的小字。”³⁰\n\
  \n在二战爆发前几年，报纸上关于战争中的机器人的文章不断出现：“机器人通过机械手段制造战争”（1927）³¹，“机器人上战场”（1934）³²，“机器人与战争”（1935）³³，“机器人战争可能意味着战争的终结”（1935）³⁴，“为机器人战争发明武器”（1936）³⁵\
  \ 只是这段密集文献中的几个例子。\n\n这些（有时是虚构的）叙述、分析、反思或当时技术进步的见证，想象出了未来的战争，有些人觉得这场战争非常近在眼前。他们想象一种战争，士兵不再是作战者。战争则仅由指挥官指挥他们的机器人军队：\n\
  \n> “[…] 指挥官在巨大的控制面板上拨动开关。他通过无线电指挥一支由无人“幽灵舰”组成的舰队，这些舰只装载炸弹，用于攻击敌方舰队。[…] 指挥官迅速赶到战场——一场他没有亲自作战、也没有枪支、也远离视线的战斗。敌方舰队全被粉碎……机器人舰队获胜。”³⁶\n\
  \n1930 年代对机器人的研究与热潮在二战期间以不同方式表现出来，但人们对它寄予厚望和信念。我们看到机器人是战局决定性因素之一：“在意大利被俘的德国人相信，通过机器人飞机他们正朝着胜利进发。”³⁷\n\
  \n相反，分析也保持克制：“机器人飞机可能执行一些极其毁灭性的任务，但那些最有能力评判的人说，它们无法影响最终结果。”³⁸\n\n后来被称为“短程”“中程”“长程”无人机或导弹的这些新能力，在二战后成为国际关系的重要变量：\n\
  \n> “华盛顿特派员、《芝加哥论坛报》记者表示，‘机器人炸弹已在美方领袖的看法中终结了美国孤立主义’，他们预计必须禁止这种武器的使用。机器人本身以及其射程能够跨越海洋的可能性，被视为战后争取国际协议的最大论据。”³⁹\n\
  \n但我们必须区分无人武器和自主武器，后者并非遥控的。20 世纪 90 年代，无人机（无人 aerial vehicles）再次回到战场，首次出现在 1995\
  \ 年的巴尔干战争（Predator 无人机），这得益于 GPS 的出现。2000 年代，战斗无人机的时代出现新转折，2001 年 10 月在阿富汗使用攻击无人机（击毙塔利班领袖奥马）并随后在\
  \ 2002 年再次使用。其他机器人，尤其是除 mines（除 mines）机器人，也被美国在伊拉克战争中使用（2004 年，美国除 mines 机器人 Sword）。该机器人随后被装备武器。美国的新战术强调尽可能多使用自动化作战系统，这意味着机器人和智能系统。2008\
  \ 年，美国部署了 12,000 台机器人⁴⁰。同年，在朝鲜半岛边境安装了一台警戒机器人——致命机器人 SGR‑A，由三星开发，绰号“恒久不息”，因为它全天候工作。该机器人配备机枪和手榴弹发射器，但它并非自主。它会定位目标，由远程人类操作员决定是否发射。\n\
  \n全球军用陆地机器人的市场规模到 2021 年可能达到 100 亿美元⁴¹。\n\n智能机器人在多个层面上都脆弱，就像任何其他工具/设备或电子产品一样：\n\n\
  *   – 在物质、物理层面：它可能成为攻击的目标，遭受物理破坏；它主要依赖电能来源；\n\n*   – 在计算层面：输入数据可以被篡改，算法可能被欺骗（例如人脸识别系统可被\
  \ 3D 打印欺骗）；算法并非无误或无 bug；算法是数学表达，可能有缺陷或错误；代码是算法的实现，同样易受缺陷、错误和软件攻击的影响；输出可能带有误差范围；学习阶段本身并不免疫于风险，预测、解释阶段亦不例外；\n\
  \n*   – 在纯信息领域：数据的解释、收集和生产是否真正可靠、无懈可击、无争议？人工智能能够生成信息、图像、声音、视频等，在这些方面 AI 可以助长诱骗、欺骗、操纵等行为，同时也可能成为诱骗和操纵的受害者。它能保护自身吗？\n\
  \n## 3.4. AI 与网络冲突\n\n应当铭记，网络战可以定义为在武装冲突期间（无论是准备阶段、进行阶段还是战后立即阶段），无论其阶段如何，利用 cyberspace\
  \ 进行攻击和防御的行为（保护军事系统免受敌方攻击、保护非军事基础设施、人口、预防和应对攻击等）。“网络战”是武装冲突在 cyberspace 维度的表现。\n\
  \n![Figure 3.7. AI is a component of cyberspace, which is itself a subset of information\
  \ space. AI contributes to the expansion of cyberspace](img/fig3-7.jpg)\n\n**Figure\
  \ 3.7.** *AI is a component of cyberspace, which is itself a subset of information\
  \ space. AI contributes to the expansion of cyberspace*\n\n\n\n\nAI 作为我们在书籍引言中指出的，是网络空间的一个新方面，也是其演变之一，有助于其扩展。AI\
  \ 是信息空间的一个子集——即网络空间——的组成部分。尽管由于其持续演变，网络空间在信息空间中占据的比例越来越大，但它仍然只是信息空间的一个子集。\n\nAI\
  \ 在网络空间相关的军事教条或战略中扮演什么角色？我们已经指出，关键的国防部网络空间战略文件《联合出版物 JP 3-12 “Cyberspace Operations”》中未提及\
  \ AI。其 2018 版本 \\[JCS 18\\] 同样未提及 AI、专家系统、机器学习、深度学习、机器人以及“自主系统”或“武器”这一概念。2013 版\
  \ \\[JCS 13\\] 也未提及它们。在这样一份对网络防御至关重要的文档中对 AI 的沉默，可以被解释为希望将与 AI 相关的问题与专门的网络问题分离开来；或者，这可能意味着\
  \ AI 已经完全融入了网络领域，无需特别提及。这种在官方网络作战教条中不提及 AI 的做法自然也延伸至军事情报领域。2018 年 11 月制作的《网络作战指南》\\\
  [CSL 18》，面向美国陆军战争学院学生，阐述了在网络空间中进行军事行动的作战方面，却从未提及 AI。\n\n2018 年的《美国网络战略》\\[DOD 18b\\\
  ]，由国防部发布，同样未使用 AI（或相关概念）这一概念。\n\n2019 年，美国正式发布了军事 AI 教条 \\[DOD 19\\]。事实上，该文档并未建立\
  \ AI 与网络空间之间的强烈、特殊关系。网络空间在文档中仅被提及四次，主要是为了决定：\n\n*   网络安全应帮助保障 AI。为此，将致力于开发防御性网络安全工具；\n\
  \n*   AI 将成为安全工具，提升对网络和物理威胁的预测与应对能力。\n\n2019 年 2 月，联合人工智能中心（JAIC）主任（该中心的创建在 AI 军事战略文档中已宣布）表示，计划与网络司令部（以及在\
  \ Maven 项目框架内的情报部门）合作。该中心的项目将聚焦于情报融合工具，AI 用于指挥与控制（C2）以及与网络司令部的合作，可能涉及事件检测和网络映射等方面。但在此，网络领域与\
  \ AI 的关联并未被特别强调。AI 实际上并未被明确纳入网络领域，网络防御官员也没有被赋予将 AI 整合到防务力量的责任。\n\n如果在官方公开文献中未发现\
  \ AI 与网络空间之间的具体关联，那么我们必须在其他渠道寻找，例如美国国防官员的声明或演讲。\n\n### 3.4.1. *Malware, cybersecurity\
  \ and AI*\n\n网络攻击如今被视为最重大的战略挑战之一。窃取数据、操纵数据、修改数据、改变或禁止数据流动、改变数据（以及因此处理它们的系统）的处理方式等，都是在应对网络攻击时需要考虑的风险。作战模式多种多样且已被证明是可行的。在如此充满矛盾的环境中，AI\
  \ 也出现了。任何即时或潜在的攻击与防御能力的变化，无论是进攻还是防守，都可能产生战略影响。\n\nAI 既可以用于网络攻击，也可以用于网络安全与防卫。我们因此处于经典的对抗、冲突与力量平衡的局面。平衡的天平由各方试图倾向于自身有利的方向。每位对手必须权衡\
  \ AI 的使用：是否应使用 AI、原因何在、如何使用？最重要的是，AI 本身并非关键，而是它能为每个人带来的价值。虽然可能会有实验或技术展示的诱惑，但在此考虑其使用之前，必须先从战略层面思考：\n\
  \n*   攻击是否可控，既由其设计者还是由安全措施决定？\n\n*   网络安全是否在任何方面都无法应对 AI 攻击？\n\n*   在两个 AI（进攻与防守）之间的对抗，或仅一方是\
  \ AI 的对抗中，力量如何分配？成功的配置（进攻或防守）是怎样的？AI 在所有情形和所有环境下是否保证优势？\n\n*   除 AI 之外，哪些非 AI 的策略或战术可以有效应对\
  \ AI？可以说，对于防御方而言，攻击是由 AI、人类还是两者共同发起，并不重要 \\[DAR 18\\]？\n\n*   为确保或攻击 AI 而实施的手段是否与问题的严重程度成比例？例如，部署\
  \ AI 攻击系统是否对那些系统本身不安全、安全薄弱或安全性极高的情况有意义？\n\n*   AI 是否应参与所有形式的攻击，以及攻击的所有阶段？\n\n* \
  \  AI 是否能够发明全新的攻击或防护形式？\n\n*   实施 AI 的手段是否在行为者的范围内？\n\nAI 意味着攻击、防御的复杂性增加，也使得安全更加复杂，攻击者更难以绕过防护。无论是防御还是攻击，复杂度的提升都意味着质量和效率的提升。但即使复杂度在提升，\
  \ duel（对抗）和双方争夺优势的本质并未消失。而且，复杂性本身就是网络领域的固有属性。网络行为者习惯于这种复杂性，它多年来一直是网络安全与防御话语的核心。因此，单纯因为\
  \ AI 的集成就不能将其视为网络安全领域的新变量。相反，AI 可能在传统手段已显不足的过于复杂环境中提供帮助，从而弥补传统手段的不足。就网络安全而言，AI 被视为“解决方案”，而复杂性则是“问题”或“攻击友好”的情境。对攻击者而言，AI\
  \ 是解决系统抵抗的问题的“解方”。但我们也知道，网络空间的复杂性并不利于安全：存在大量漏洞，系统复杂度本身就是导致这些漏洞的原因。因此，对于网络安全而言，AI\
  \ 不仅应帮助及早发现攻击，还应削弱复杂性的阴影，更好地管理自身环境。\n\nAI 为安全（以及攻击）带来自动化，这里的自动化指自主行动，而非预先编程的自动过程：这种特殊性可以在攻击检测、应对以及攻击过程中得到利用：\n\
  \n*   在进攻方面，AI 可用于目标与缺陷的发现、定义无需人工干预的作战模式以实现目标；\n\n*   在防卫方面，AI 可用于攻击的检测。\n\n\n\n\
  AI 会赋予用于随机、机会性攻击的恶意软件一种迄今为止属于人类的特质：对环境、对情境的理解。其思想是摒弃静态软件，即行为完全由精确编程决定的软件，转而创建能够适应、理解其所处情境并基于情境演变及分析做出决策的应用。它们会像人类黑客一样“对情境进行思考”或分析，会模仿目标环境的行为，以避免被发现，不向检测系统或观察、监控甚至目标方提供异常行为的指示，甚至不被观察者、监控者或目标方注意到。AI\
  \ 将战术和策略从蛮力、正面攻击以及显性、壮观、可预测且显著的暴力转向细微、隐蔽、低调的范畴。那么，将 AI——即软件——替代人类智能进行这种情境分析有何意义？这套替代品被寄予了什么期待？我们也要考虑那些利用\
  \ AI 以提升攻击效能的“人类操作者”。\n\n企业和国家服务正在尝试在攻击工具中使用 AI。动机显而易见：官方说法是为了更好地理解流程，从而确保防护。但专门开展攻击任务的行为体在\
  \ AI 的研发、测试、部署和攻击使用方面已经走得更远。\n\n为了分析 AI 增强恶意软件的行为，IBM 开发了 DeepLocker，这是一种在目标出现时才保持沉默、直至被发现才激活的恶意软件形态。此类恶意软件会利用多源、多属性数据，如人脸识别数据、地理位置数据、社交媒体数据等。其目标是让恶意软件在整个寻找目标的过程中隐藏在阴影中、不被发现，并在找到目标后才触发。我们将其\
  \ *modus operandi* 与狙击手的作战方式类比：在确认目标正确、目标已参与且无法逃脱攻击、并且在最后一刻仍保持隐蔽的前提下才发射子弹。DeepLocker\
  \ 采用深度神经网络（Deep Neural Network，DNN）模型设计，能够隐藏目标的属性（个人、组织）、目标身份（具体是谁）以及攻击方式（如何攻击）。\n\
  \n美国海军情报系统司令部于 2019 年发起挑战，奖金 15 万美元，用于研发能够检测网络攻击的 AI。\n\nAI 在进行网络攻击时提供的大多数能力并未根本改变过去和现在的原则：上述列出的原则已被知晓，并在\
  \ AI 内置的行动中得到延伸，如隐藏身份、匿名行动、执行不易被发现的行为、精准目标、复杂攻击（即结合多种行动、工具、攻击路径等），以及能够发起多种攻击类型（如诱饵、欺骗等）。AI\
  \ 进行网络攻击的能力也基于其可以用于多种不同攻击方式的事实。\n\n它们的共同点在于，它们都 *冒着比当前更不可控的风险*。这使它们更像新手巫师玩火一样。有多少国家机构研发的恶意软件最终落入国家或犯罪分子之手，因为它们无法被其自身设计者控制？这无疑是首要风险，远大于智能机器独立自主、脱离设计者控制并反噬其设计者和设计的风险。对于更传统的恶意软件和网络攻击工具而言，风险同样是数据泄露和盗窃。需要记住，NSA\
  \ 多年前研发的工具被黑客获取，随后被修改后用于发动新攻击，而美国及许多其他国家为此付费。控制任何种类的武库都是一项挑战。在许多非 cyberspace 领域，保护武器和军事装备的问题同样存在：武器和装备可能被盗、转售至黑市、在作战区域回收，甚至从研发中心和公司被盗。许多其他\
  \ cyberspace 领域也在探讨如何保护武器和军事装备。被对手夺回或遗失的武器，随后被返回原主人、使用者或设计者手中。\n\n对于 AI 恶意软件攻击的受害者，它与非\
  \ AI 攻击有何区别？受害者的影响可能相同：数据 theft、电脑加密、业务中断、财务损失、声誉损害、信息操作等。无论 AI 还是其他手段，受害者的境况基本不变，除非在事后的申诉、调查、重建犯罪以及追责阶段。在攻击后阶段，尤其是攻击被公开后（并非所有行动都旨在公开；数据\
  \ theft 往往追求完全隐蔽，无任何表现），受害者、网络安全服务、警方、司法系统、国家或反击行为体将面临已知但会加剧的困难：损失与损害的分配、定位与评估难题，攻击的深度与严重程度，攻击规模（可能已超出受害者原有边界），以及传统的\
  \ cyberspace 无国界性与实际国界强限在安全、警务、司法或军事行动中难以跨越的障碍。\n\n### 3.4.2. *AI and cyberweapons*\n\
  \n冲突性在 cyberspace 中通过利用技术环境固有的多重漏洞，或因依赖而产生的漏洞而实现。寻找并利用漏洞是网络攻击维度的核心（当然，攻击方也必须制定策略和战术）。在防御与安全方面，主要工作是预判攻击，这包括发现漏洞。但主动防御将进一步倡导反击，甚至进行预防性或先发性攻击。防御意味着了解目标的漏洞。无论是攻击、安全还是防御的立场，漏洞始终是核心，而“武库”作为进攻手段的关键工具，在军事及非战争情境中同样重要。\n\
  \n“网络武器”的概念要求定义，不能以精确方式刻画。可以通过类比武器的定义来理解。\n\n武器是：“一种被使用或设计用于以威胁或造成结构、系统或生物体的物理、功能或精神伤害的工具。”\
  \ \\[RID 12\\] \n\n\n\n让我们回顾虽然存在的区别，但武器的本质与用途之间的区别。前者是作为毁灭性工具设计的，用于造成损害，对抗对手施加力量。后者是任何从其主要用途被转移的工具或仪器，从而可以成为毁灭性工具：剑是本质武器；当木头被用来击打个人时，它就成为一种武器，即使用途的武器。在网络空间中，有专门设计用于破坏或造成损害的软件工具（例如\
  \ `Stuxnet`），以及那些最初并非用于攻击行动的工具（例如 `Ping` 命令），但可以被攻击者、军队或罪犯用于其攻击行动。\n\n网络武器是类比于这些武器定义的：\
  \ “更广义的武器子集：用于或设计用于以威胁或造成对结构、系统或生物体的物理、功能或精神伤害的计算机代码。” \\[RID 12\\]\n\n> “网络作战手段是用于、设计或意图用于造成人员伤害、死亡，或对物体造成损害、毁灭的手段，即产生网络行动资格所需的后果。”\
  \ (*Tallinn Manual 2.0* 规则 103 注释，引用自 \\[WAL 18\\])\n\n在武器本质与目的之间的区分基础上，我们还将考虑网络武器的两个类别。\n\
  \n网络武器的概念引发了许多问题，包括什么是网络武器、什么不是网络武器的界限。入侵服务器、窃取信息或间谍活动是否可以被视为武器？Thomas Rid 并不认为是\
  \ \\[RID 12\\]，因为间谍活动不能被视为使用武器的攻击，其意图不是毁灭或对目标造成物理损害。这一选择具有法律意义，因为它将间谍入侵排除在武装冲突法之外。虽然这看似合理，但也值得怀疑，因为网络空间模糊了这些界限，且间谍情报的入侵或拦截攻击很可能是使用武器进行的。武器的使用并不必然调动冲突法，可能仅仅是一种犯罪动机。\n\
  \n武器也受到控制、禁令和限制措施的约束。\n\n在网络空间中，军队开发和使用进攻性和防御性工具的过程是网络空间军事化的一个方面。网络武器的部署与使用也是网络军事化的一部分。\n\
  \n在各种行为体（国家与非国家）使用网络武器的背景下，以及相关的战略、政治、法律和语义问题，人工智能（AI）最近出现，似乎为新能力的实现开辟了道路。\n\n###\
  \ 3.4.3. *进攻–防御/安全配置*\n\n网络空间通常以三层结构表示：第一层是物理硬件；第二层是应用（软件、数据）；第三层是意义、信息。\n\n![Figure\
  \ 3.8. A simple modeling of cyberspace in three layers](img/fig3-8.jpg)\n\n**Figure\
  \ 3.8.** *A simple modeling of cyberspace in three layers*\n\n![Figure 3.9. AI is\
  \ present in each of the three layers of cyberspace. It extends each of them and\
  \ contributes to the expansion of cyberspace as a whole](img/fig3-9.jpg)\n\n**Figure\
  \ 3.9.** *AI is present in each of the three layers of cyberspace. It extends each\
  \ of them and contributes to the expansion of cyberspace as a whole*\n\nAI 属于这三个层面。它基于硬件，有时甚至是特定硬件（`s-chip`、`sensors`\
  \ 等）；它是一种软件形式（编程语言、AI 应用）；最后，它处理意义，操纵数据，在军事应用中，例如提供人类决策支持，这明确属于第三层。AI 虽然带来新功能、以不同方式处理数据、涉及特定的软件设计，并嵌入特定硬件（`sensors`、`robots`\
  \ 等），但它并不挑战这种模型，若将其视为网络空间的扩展或参与其扩张的元素，则必须与整个网络空间同样适用同样的阅读网格。我们无法想象一个完全独立的 AI 空间或领域。我们不会在寻找创建新\
  \ AI 空间的反思或提案。我们将保持传统的领域（陆地、空中、海洋、太空、网络空间）不变，不会考虑围绕 AI 重新划分的空间。\n\n![Figure 3.10.\
  \ Within each of the three layers of cyberspace, there are actors of different natures,\
  \ with different functions, capacities, intentions and powers. For a color version\
  \ of this figure, see www.iste.co.uk/venture/artificial.zip](img/fig3-10.jpg)\n\n\
  **Figure 3.10.** *Within each of the three layers of cyberspace, there are actors\
  \ of different natures, with different functions, capacities, intentions and powers.\
  \ For a color version of this figure, see [www.iste.co.uk/venture/artificial.zip](http://www.iste.co.uk/venture/artificial.zip)*\n\
  \n在网络空间的每一层，不同的行为体介入，各自拥有角色、功能、介入层次、意图、能力和不同程度的权力。每个行为体的权重不等，随其介入的层而变化。例如，国家可以影响每一层的配置，决定、授权或禁止发展和使用，进行监管、监督、军事化等。各国在每一层的影响力并不相同。公司通常不是能够影响每一层的行为体，即使它们是用户。但有些公司力图成为全球性玩家，在第一层（部署国际互联网缆线等）发挥强大作用，在第二层（提供社交媒体平台、跨国软件公司）也有强势角色，在第三层（成为信息平台）同样如此。公民通常仅是第一层的普通用户，可能在第二层成为用户和开发者，在第三层成为用户和贡献者。配置、平衡、各层交叉点的权重（在\
  \ \\[Figure 3.10\\] 中）因国家而异，取决于监管、法律、治理、文化、国家组织、经济和社会。AI 同样分布在三层，各类行为体在其中也能发挥作用。将冲突视为\
  \ AI 的贡献，或 AI 成为目标、武器或攻击向量，需要考虑 \\[Figure 3.10\\] 中的每一个交叉点。\n\n\n\n\n然而，基于整个网络空间并具有共同特征的\
  \ AI 在分析和战术或策略的开发中需要被隔离。我们认为的一个有用区分是 AI 与非 AI、什么是 AI 与什么不是 AI、什么与它相关之间的区别。通过这种方式，在网络空间中形成两个子集，便于阅读针对各自特性的战术。\n\
  \n至少有两个原因支持这种划分：首先，AI 并不会占据网络空间的全部空间，因此在可预见的未来，它将与非 AI 的网络空间共存；其次，最终目标的实现必须决定方法和手段（应记住\
  \ AI 不一定总是最佳选择、最有效、投资回报最高或最具理性的选项）。AI 的出现促使出现专门的主体、工具和实践，这些并未占据网络空间的全部方面。\n\n![Figure\
