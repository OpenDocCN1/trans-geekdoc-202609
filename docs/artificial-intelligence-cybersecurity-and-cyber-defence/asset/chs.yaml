  \ Gas & Electric Co., San Francisco, Calif.）签订了现场许可协议。PG&E 计划使用 RT works 来运营和控制其电力系统，并提高运营效率。”[LIU\
  \ 93]\n\n军事领域并未逃避这一热潮，专家系统在许多应用中找到了用武之地。\n\n专家系统的使用已成为相对漫长的军事历史（近两个世纪）的一部分，一方面是由于缺乏更高效的技术，另一方面是由于这些系统有助于增强军事能力，特别是在作战艺术的战略层面，如预判、不确定性、作战迷雾、摩擦和力量管理。专家系统通过信息素养提升军事效能：\n\
  \n> “传感器知识的整合以及专家系统和人工智能的使用，将使对敌人的意图及应对方案进行高级分析 \\[…\\] 对陆军后勤需求的更好理解可以通过对后勤问题的电脑建模以及专家系统的使用实现。”[BAK\
  \ 95]\n\n### 3.3.5. *Autonomous weapons*\n\n如果在当今人工智能军事化及其在战争中的使用中有一个核心概念，那就是“自主性”。相关的两个概念是“武器”和“自主性”。\n\
  \n“兵种”一词既指“一种（如武器）的攻击或防御手段”，¹⁹，也指武装力量的分支，“作战支队（如军队的一个分支）”²⁰。\n\n在 20 世纪初，“自主武器”一词用于指代武力的分支：\n\
  \n> “航空兵作为一个自主机构的创建，以及它们原本所属的炮兵团返回以对抗航空威胁，包括搜索灯单元，这导致在军事航空框架内，防空防御的所有手段被分布到两个兵种指挥部：在航空兵中，夜战机和防护气球；在炮兵中，防空炮和搜索灯。”²¹\n\
  \n> \n\n> “16 世纪，炮兵组建了一个军团 \\[…\\]。然而，随着这些炮兵 \\[…\\] 发明了越来越方便实用的武器，亲自试验后引入步兵，步兵的重要性日益提升：它们被提升到骑兵的层面，最终迫使贵族不再区分这两个分支。自\
  \ 16 世纪起，炮兵虽然保留对复杂强大机器的操作权，但开始独立发展，确立了其组织原则为第三支，用于在战场上发射决定性打击，成为 *终极比率*。”[BLO 98]\n\
  \n> \n\n> “机动炮兵、其作用、其力量。 *Broad Arrow* \\[…\\] 指出机动炮兵不应被视为独立分支，而应仅视为野战炮兵的移动补充部分。”²²\n\
  \n另一方面，区分自主武器与辅助或支持兵种/分支：“\\[…\\] 他强调空军已不再是辅助兵种，而是一个自主、强大、高介入的兵种。”²³\n\n> “17 世纪\
  \ \\[…\\] 当时有两个分支参与对抗：步兵 \\[…\\]；弩兵 \\[…\\]。炮兵尚未作为自主武器组成，而是在部队前线作为随步兵行动的武器使用。”²⁴\n\
  \n当今，我们使用“自主武器”这一术语来指代武器本身（导弹、智能机器人、车辆、平台、无人机），其中自主性被定义为机器在不受人工干预的情况下行动、反应和决策的能力。该机器既不遥控，也不受监督。自主武器在战斗中会选择目标、作出决策，并在决定开火后立即射击。除武器本身外，其他设备（如车辆）也可以配备自主性。\n\
  \n自主武器的概念在军事事务中已被讨论了数十年。\n\n我们找到了几篇专门讨论这种军事自主性的出版物。\n\n**表 3.5.** *选定的自主武器相关出版物*\n\
