  \n### 2.1.2. *Expert systems*\n\nExpert systems are one of the key concepts in the\
  \ history of artificial intelligence. We mention them many times in this book. It\
  \ is worth highlighting a few definitions.\n\nThe terms on which expert system definitions\
  \ are based differ somewhat from those used for definitions of artificial intelligence.\
  \ The dominant terms are “human”, “knowledge”, “problem”, “reasoning” and “solution”.\
  \ Only the concept “human” is common to the two most common sets of terms. Humans,\
  \ with their expertise, interact with the machine. They are indispensable to the\
  \ system as a whole. Together, human and machine must find solutions to complex,\
  \ difficult problems. Knowledge (the basis of knowledge) is the key element of these\
  \ systems.\n\nThe applications of expert systems have been numerous since the 1970s:\
  \ in 1972, for example, in the field of medicine, the MYCIN system was developed\
  \ to identify the organisms responsible for an infection based on patients’ symptoms\
  \ (Stanford University); in the military field, expert systems have provided decision\
  \ support tools, etc.\n\n**Table 2.2.** *Definitions of expert systems*\n\n| Definition\
  \ || Source |\n| --- | --- |\n| “An ‘expert system’ is an intelligent computer program\
  \ that uses knowledge and inference procedures to solve problems that are difficult\
  \ enough to require significant human expertise for their solution.” || \\[FEI 80\\\
  ] |\n| “Expert systems is a relatively new sub-discipline of artificial intelligence\
  \ and has to do with using computers to imitate the reasoning or judgment process\
  \ of human experts.” || \\[BAC 87\\] |\n| “A typical expert system consists of three\
  \ components. First, a ‘knowledge base’, containing information about a highly specific\
  \ field of expertise. Second, an ‘inference engine’, which must make decisions about\
  \ which parts of that knowledge base are relevant to solving a given problem and\
  \ then piece together a line of reasoning linking the problem with its possible\
  \ solution. Finally, the third component of an expert system that determines its\
  \ role as a consultant is the ‘user interface’, which allows human experts to interact\
  \ with the machine and to request it to explain the rationale for its different\
  \ choice.” || \\[DEL 91\\] |\n| “One of the most successful branches produced by\
  \ Artificial Intelligence research. In these systems the ability to reason in a\
  \ logical way characteristic of all AI programs is complemented by the problem-solving\
  \ abilities of human experts in particular fields. Knowledge banks are then provided\
  \ with a human interface to allow them to play the role of ‘mechanical advisers’:\
  \ given a problem in a very specific field, these systems can give expert advice\
  \ regarding a possible solution, and even provide their human users with the line\
  \ of reasoning followed to reach a particular piece of advice.” || \\[DEL 91\\]\
  \ |\n| “A computer program capable of considering a vast body of knowledge, reasoning,\
  \ and then recommending a course of action.” || \\[HAN 92\\] |\n\nDespite their\
  \ success, expert systems have been the subject of much criticism, in particular\
  \ because of the mistakes they can make if the problems raised go beyond the strict\
  \ framework of their area of expertise. For example, when faced with a victim of\
  \ a gunshot wound, the symptom is the bleeding, the expert system specializes in\
  \ searching for infectious organisms and it will search for bacteria responsible\
  \ for the bleeding. The expert system is unable to leave its field on its own. The\
  \ expert system only works in its own little world. It also has no common sense,\
  \ it is unable to understand or analyze the effects of its recommendations on the\
  \ context.\n\n![Figure 2.2. Cloud of terms built from the expert system definitions\
  \ in Table 2.2. For a color version of this figure, see www.iste.co.uk/ventre/artificial.zip](img/fig2-2.jpg)\n\
  \n**Figure 2.2.** *Cloud of terms built from the expert system definitions in Table\
  \ 2.2. For a color version of this figure, see [www.iste.co.uk/ventre/artificial.zip](http://www.iste.co.uk/ventre/artificial.zip)*\n\
  \n### 2.1.3. *Machine learning and deep learning*\n\n\n\nMachine learning or automatic\
  \ learning was a term introduced in 1959 by Arthur Samuel. Machine learning is a\
  \ sub-domain of artificial intelligence. The research community has several specialized\
  \ journals, such as the `Machine Learning Revue` (published by Springer, founded\
  \ in 1986) and the `Journal of Machine Learning Research` (founded in 2000)¹³. The\
  \ concept covers the idea that software or a machine is able to learn without everything\
  \ being explicitly programmed into it in advance. From data, from particular observations,\
  \ the algorithm looks for a link or relationships in this data. Learning only a\
  \ first phase, which then makes it possible, by relying on the acquired knowledge,\
  \ to recognize, from “predicting”, to extrapolating. Facebook or Google, for example,\
  \ use such algorithms to try to define and propose connections, to identify the\
  \ information that most interests the Internet user. The algorithm thus sorts through\
  \ the masses of data and information in place of the Internet user. Credit card\
  \ companies can use machine learning to detect fraud. Machine learning is used for\
  \ object recognition in images (facial recognition, scene analysis, etc.). “Deep\
  \ learning is a subcategory of machine learning algorithms that use multi-layered\
  \ neural networks to learn complex relationships between inputs and outputs” \\\
  [SHA 18a\\].\n\nDeep learning is one of the implementation techniques of machine\
  \ learning, which relies more specifically on neural networks:\n\n> “Deep learning\
  \ is a type of machine learning that can process a wider range of data resources,\
  \ requires less data preprocessing by humans, and can often produce more accurate\
  \ results than traditional machine learning approaches.”¹⁴\n\n### 2.1.4. `The robot,\
  \ robotics`\n\nAI and robotics are closely linked both in research and in our imagination,\
  \ notably because of the literary production of science fiction which, since the\
  \ beginning of the 20th Century, has never ceased to offer us universes populated\
  \ by robots, endowed with an intelligence equal, if not superior, to that of humans,\
  \ and always presenting a challenge for the latter. From the few definitions retained\
  \ (Table 2.3), we will say the robot:\n\n*   – is mainly a machine;\n\n*   – is\
  \ programmable;\n\n*   – has a specific function;\n\n*   – has a degree of freedom\
  \ that is controlled and decided by the humans (who program it);\n\n*   – has a\
  \ resemblance to humans which is related to its functionality (seeing, moving, grasping\
  \ objects, etc.), more than its appearance.\n\n**Table 2.3.** `Definitions of “robot”`\n\
  \n| Definition || Source || Year |\n| --- | --- | --- |\n| “A manipulating industrial\
  \ robot is an automatically controlled, reprogrammable, multi-purpose, manipulative\
  \ machine with several degrees of freedom, which may be either fixed in place or\
  \ mobile for use in industrial automation application.” || International Organization\
  \ for Standardization, ISO || |\n| “Automatic apparatus capable of manipulating\
  \ objects or performing operations according to a fixed, modifiable or adaptable\
  \ program.” || Larousse Dictionary (online) || |\n| “In works of fiction, \\[it\
  \ is\\] a machine, an automaton with a human aspect capable of acting and speaking\
  \ like a human being.” || CNRTL (online) || |\n| “A machine carrying out, thanks\
  \ to a microprocessor-based automatic control system, a precise task for which it\
  \ was designed in the industrial, scientific or domestic field.” || CNRTL (online)\
  \ || |\n| “A robot is a reprogrammable multifunctional manipulator designed to move\
  \ materials, parts, tools or specialized devices through variable programmed motions\
  \ for the performance of a variety of tasks.” || \\[SCI 00\\] || 2000 |\n| “Robots\
  \ are sensomotoric machines for the extension of human mobility. They consist of\
  \ mechatronic components, sensors and computer-based control functions.” || \\[CHR\
  \ 01\\] || 2001 |\n| “A simple definition of a robot is: ‘any machine programmed\
  \ to do work’.” || \\[ELL 12\\] || 2012 |\n\n**Table 2.4.** `Some terms related\
  \ to the “robot” world`\n\n| Terms || Definition |\n| --- | --- |\n| Android ||\
  \ Has the appearance of a human (male). More generally, a robot that has the appearance\
  \ of a human being. Term used since the 19th Century (used in *The Future Eve* by\
  \ Auguste Villiers de l’Isle-Adam, in 1886; in *The Brazen Android*, by William\
  \ Douglas O’Connor, 1891). |\n| Ginoid || Looks like a woman. Example: Maria, the\
  \ robot in the movie *Metropolis*. |\n| Humanoid || Looks like a human (morphologically).\
  \ |\n| Cyborg || Cybernetic organism. A living being to which artificial, electronic\
  \ or mechanical parts have been grafted or implanted. It differs from the robot,\
  \ which is entirely artificial and mechanical. |\n| Droid || The term comes from\
  \ science fiction, which designates robots with a shape reminiscent of androids.\
  \ |\n| Cobot || Collaborative robot (robot–human interaction). |\n| Chatbot || Agent\
  \ that dialogues with a user. |\n\nSeveral ideas are thus associated with the “robot”:\n\
  \n*   – It is designed to help, to assist humans: the automatons of the 17th and\
  \ 19th Centuries are machines similar to humans and have an entertainment function,\
  \ on the one hand (by playing an instrument, or by the quasi-magical nature of their\
  \ existence and the technical prowess of their creators), and, on the other hand,\
  \ allow people to imagine a future in which the machine will carry out tasks for\
  \ people.\n\n*   – It is the symbol of a future world: the robot is present in futuristic\
  \ stories where terrestrial and extraterrestrial universes are mixed. It is omnipresent\
  \ in spatial conquest.\n\n*   – It is an existential threat: Karel Capek’s robot\
  \ (1920) is the archetype of the robot that constitutes a threat to humanity because\
  \ it will enslave it. The robot first frees humans from their tasks, then the roles\
  \ are reversed; the humans’ creation is turned against them. The robot becomes monstrous.\n\
  \n*   – It is an actor of conflict, of violence: the science-fiction news robot\
  \ is often a fighter who confronts humans or other robots. It confronts other heroes:\
  \ in 1963, Russ Manning created an anti-robot hero, Magnus, Robot Fighter; also\
  \ read *The Human Bat V the Robot Gangster* (Edward R. Hime-Gall).\n\n*   – It is\
  \ a pretext for reflections on the human condition, on the relationship between\
  \ human and machine: if people have their own laws, rules, principles, morals and\
  \ ethics, can’t robots have them too?\n\n## 2.2. Types of AI\n\nTypologies are used\
  \ to classify, order and create categories, and provide reading grids that allow\
  \ a concept to be grasped in its multiple facets. The exercise is necessarily simplifying\
  \ and can be marked by subjectivity.\n\nOne of the most common typologies, devised\
  \ in the 1960s, is based on the distinction between:\n\n*   – weak or narrow AIs,\
  \ which are AIs dedicated to a specific task or function. These machines do not\
  \ learn by themselves, all rules must be given to them beforehand (example: all\
  \ the rules of a game). The weak AI is the one that can be produced in the current\
  \ state of knowledge and can therefore be the subject of State AI strategies: “The\
  \ Federal Government has oriented its strategy to the use of AI to solve specific\
  \ problems, i.e. to the ‘weak’ approach”¹⁵;\n\n\n\n-   [强或广泛/通用人工智能，能够自我学习，然后像个体一样决定并行动。此类人工智能尚不存在，它们能够以通用方式思考，并基于学习而非训练做出决策。多个测试定义通用人工智能：图灵测试；斯蒂夫·沃兹尼亚克于\
  \ 2007 年提出的咖啡测试；机器人大学生测试；以及尼尔斯·约翰·尼尔逊于 2005 年提出的就业测试。]\n\n一些作者加入第三层，提出：弱人工智能、通用人工智能和超人工智能或优越人工智能：\n\
  \n> “超人工智能是远比人类更聪明的 AI。超人工智能目前尚不存在，但有人提出它未来可能被构建，并带来巨大且可能 catastrophic 的后果。” \\\
  [BAU 18\\]\n\n这一层级的 AI 高于通用 AI：通用 AI 的智能水平等同于人类；超人工智能则超越此。超人工智能导致本质上带有灾难性论调的议题，围绕生存威胁展开，表达人类对一种人类无法预测或控制的智能行为的恐惧，这种智能的行为可能导致人类失去控制。\n\
  \n**Table 2.5.** *AI Typology*\n\n|  | 高 AI（强、通用）或 AGI（人工通用智能） || 低 AI（弱、窄）或 ANI（人工窄智能）\
  \ |\n| --- | --- | --- |\n| 定义 || 指任何自主 AI 系统，其智能能力等于或高于人类。 || 该 AI 系统专注于解决特定问题。\
