  \ intelligence” (data recorded September 25, 2019)*\n\n### 2.3.2. *The AAAI Magazine*\n\
  \nAAAI（美国人工智能协会）成立于 1979 年，后改名为人工智能发展协会。自 1980 年起，该协会出版 *AI Magazine*，所有期刊均可在其网站上查阅¹⁶。我们在该语料库（1980–2019）中搜索与人工智能领域相关的若干术语，以观察研究社区使用这些术语的演变。我们的观察仅限于文章标题，未包含摘要或完整文章内容。也许通过分析完整内容会得到显著不同的结果。但仅凭标题反映所呈现研究核心主题，我们认为在此阶段已足够相关¹⁷。\n\
  \n我们注意到“专家系统”概念在 1980–2000 年间频繁出现，之后在文章标题中不再出现，似乎逐渐失去关注。\n\n![Figure 2.4. Evolution\
  \ of the presence of the concept of “expert systems” in AAAI publications (1980–2019)](img/fig2-4.jpg)\n\
  \n**Figure 2.4.** *Evolution of the presence of the concept of “expert systems”\
  \ in AAAI publications (1980–2019)*\n\n“机器学习”主题在时间上保持相对稳定（Figure 2.5）。\n\n![Figure\
  \ 2.5. Evolution of the presence of the “Machine Learning” concept in AAAI publications\
  \ (1980–2019)](img/fig2-5.jpg)\n\n**Figure 2.5.** *Evolution of the presence of\
  \ the “Machine Learning” concept in AAAI publications (1980–2019)*\n\n“机器人学”（robot,\
  \ robotics）主题也以相对连续的方式被讨论。因此，机器学习和机器人学等主题没有出现明显的热情高峰、突发兴趣或相反的放弃现象，这与影响“专家系统”处理的现象不同（Figure\
  \ 2.6）。\n\n![Figure 2.6. Evolution of the presence of the “robot” concept in AAAI\
  \ publications (1980–2019)](img/fig2-6.jpg)\n\n**Figure 2.6.** *Evolution of the\
  \ presence of the “robot” concept in AAAI publications (1980–2019)*\n\n“自主”主题在 1990\
