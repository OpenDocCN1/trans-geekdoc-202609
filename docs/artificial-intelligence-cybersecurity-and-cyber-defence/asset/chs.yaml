  \n## 2.4. The stories generated by artificial intelligence\n\n人工智能，就像计算机或更广泛的计算机科学一样，引发了热烈的辩论，有时是争议，涉及哲学、政治、社会学、经济、历史、伦理和法律等反思。我们无法全面列举人工智能提出的所有问题，但仍会提及其中一些。\n\
  \n### 2.4.1. *The transformative power of AI*\n\n> “Weizenbaum doesn’t name any\
  \ specific task that computers cannot carry out, because he wishes ‘to avoid the\
  \ unnecessary, interminable, and ultimately sterile exercise of making a catalogue\
  \ of what computers will and will not be able to do, either here and now or ever’.”\
  \ \\[MCC 76\\]\n\nAn inventory of the sometimes clear-cut opinions on what artificial\
  \ intelligence can or cannot do, what it transforms, what it impacts, seems useful\
  \ to us, however. For it enables us to understand how science and technology take\
  \ their place in society and around which arguments the debates are built. Here,\
  \ we attempt to list the opinions formulated about AI, identified in very diverse\
  \ contents (press articles, blogs, technical journals, etc.). We have grouped these\
  \ discourses around the following forms of expression:\n\n*   – AI is…/AI is not…;\n\
  \n*   – AI will…/AI will not…;\n\n*   – AI should…/should not…;\n\n*   – AI produces/makes…;\n\
  \n*   – AI allows/enables…\n\nThese formulations are discussed one by one in Tables\
  \ 2.6–2.11.\n\n**Table 2.6.** *Some assertions or assumptions about AI intakes*\n\
