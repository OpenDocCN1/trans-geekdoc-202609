  \ Warfare (ESPW*) \\[LI 11\\] | 2011 |\n\n专家系统的应用非常广泛，似乎几乎覆盖所有活动领域：\n\n*   – 银行和金融：First\
  \ USA Bank（费城，宾夕法尼亚）提供 Visa 和 Mastercard 服务，已安装基于神经网络的信用卡欺诈检测系统。Falcon 系统由 HNC Inc.（圣地亚哥，加利福尼亚）开发，利用神经网络技术学习并识别交易模式中异常、表明欺诈性收费的特征。\
