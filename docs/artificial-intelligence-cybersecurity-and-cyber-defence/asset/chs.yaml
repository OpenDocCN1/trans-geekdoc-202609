  \ new business models and changing markets. Thanks to the combination of the technologies\
  \ that are available today and the speed by which the industry can learn from its\
  \ processes, products and customers will increase exponentially.”³⁹ || 2018 |\n\n\
  The rhetoric surrounding the notion of AI emphasizes the principle of social change\
  \ that the development and integration of these technologies into a wide range of\
  \ areas of social activity involves or will involve. These changes are considered\
  \ to be of varying intensity, sometimes referred to as “changes”, “transformations”,\
  \ “revolutions” and “breakthroughs”.\n\n\n\n\n断言 AI 将（或将不会）做某事，或将（或不会）转变，是决定性的（技术决定论认为技术决定社会变革）。技术与个人或社会的关系也可以从相反的角度——社会决定论——来观察，即考虑促成技术被销售、发展、使用（尤其是以何种形式）的社会条件。因此是社会产生技术。由于社会不能被视为一个均质的整体，技术在不同社会群体中会产生不同的效果（不同的用途、行为、感知和与技术的关系）：有那些把强加于他们的技术占有的（消费产品、法律规定的用途等），有那些通过解构技术并将其从主要目的中偏离来使其成为自己的技术（黑客），还有那些能够将技术适应自身需求的人（专业应用、军队等）。因此，我们可以用几条简练如表格中的公式来把握\
  \ AI 将或不会做、将或不会产生什么，因为问“谁生产 AI？”、“哪些公司构建 AI？”等问题同样重要。\n\n# Table 2.8. *Some assertions\
  \ or assumptions about the future of AI*\n\n| 人工智能将… | 日期 |\n| --- | --- |\n| “人工智能的超人类水平的实现将为人类提供\
  \ incredible 多样的选择。”⁴⁰ | 1976 |\n| “人工智能的研究将增加我们对人类语言的理解。”⁴¹ | 1980 |\n| “人工智能将要求我们以能够有效利用并行性的新思维方式重新思考计算。”⁴²\
  \ | 1981 |\n| “人工智能的广泛普及将对人类社会的影响可与（甚至超过）汽车或印刷术的发明相媲美。”⁴³ | 1983 |\n| “无论飞机是民用还是军用，人工智能都将广泛应用于协助飞行员管理相关系统。”⁴⁴\
  \ | 1985 |\n| “人工智能将改变劳动力。”⁴⁵ | 2016 |\n| “人工智能将改变世界。”⁴⁶ | 2017 |\n| “人工智能将使工作更有人性化。”⁴⁷\
  \ | 2018 |\n| “人工智能将惠及人类。”⁴⁸ | 2018 |\n| “人工智能将影响业务职能。”⁴⁹ | 2018 |\n| “人工智能将在未来的网络攻击中被武器化。”⁵⁰\
  \ | 2018 |\n| “与[…]电缆和计算机一样，人工智能（AI）和大数据将颠覆我们工作、生活乃至思考的方式。”⁵¹ | 2018 |\n| “人工智能将改变内容营销。”⁵²\
  \ | 2018 |\n| “人工智能将改变职场。”⁵³ | 2018 |\n| “人工智能将改变我们生活的方方面面。”⁵⁴ | 2018 |\n| “人工智能将改变患者和医生的一切。”⁵⁵\
  \ | 2018 |\n| “人工智能会彻底改变战争艺术？” [NOË 18] | 2018 |\n\n# Table 2.9. *Some assertions\
  \ or hypotheses about which subjects will escape the impact of AI*\n\n| 人工智能不会/不…\
  \ | 日期 |\n| --- | --- |\n| “人工智能不会变成弗兰肯斯坦的怪物。”⁵⁶ | 2014 |\n| “人工智能‘不会结束人类’。”⁵⁷ |\
  \ 2015 |\n| “真正的人工智能不会在技术开始自我思考之前出现。”⁵⁸ | 2017 |\n| “人工智能不会取代人。”⁵⁹ | 2018 |\n| “人工智能不会取代人类。”⁶⁰\
  \ | 2018 |\n| “人工智能不会杀死工作。”⁶¹ | 2018 |\n| “人工智能不会取代医师。”⁶² | 2018 |\n| “人工智能不会取代人类智能。”⁶³\
  \ | 2018 |\n| “人工智能在 2021 年之前不会成为营销主流。”⁶⁴ | 2018 |\n| “机器和人工智能不会取代会计师。”⁶⁵ | 2018\
  \ |\n\n# Table 2.10. *Some assumptions about AI*\n\n| 人工智能应该… | 日期 |\n| --- | ---\
  \ |\n| “人工智能的技术应该应用于编程和数据处理领域中已存在的现实问题。”⁶⁶ | 1971 |\n| “人工智能的进步应纳入先进的计算机焊接信息服务。”⁶⁷\
  \ | 1986 |\n| “为什么人工智能会让你害怕。”⁶⁸ | 2017 |\n| “人工智能应参与招聘流程，但不能取代人情味。”⁶⁹ | 2018 |\n\
  \n**Table 2.11.** *Some consequences of artificial intelligence*\n\n| 人工智能产生，或使…\
  \ | 日期 |\n| --- | --- |\n| “人工智能使机器能够推理并与世界互动。”⁷⁰ | 2016 |\n| “数据科学产生洞察；机器学习产生预测；人工智能产生行动。”⁷¹\
  \ | 2017 |\n| “人工智能产生信息。”⁷² | 2018 |\n\n以上这些引语凸显了人们对人工智能的共同看法。\n\n其转型能力是核心。那些谈论它的人似乎相信\
  \ AI 将对所有的人类活动产生影响。虽然仍为时过早衡量这些效应的规模，但正如经常所说，AI 并不新颖，已有多年、多种应用。转型是积极的：它被定义为优势、增值、进步。这一“转型”概念几乎不被质疑，除非在边缘地声称\
  \ AI 不会改变… 因此，将 AI 在所有领域转型可能会在安全与国防领域产生影响。一些人持肯定态度（AI 将彻底改变战争艺术），另一些则持保留态度（AI 会改变战争艺术吗？）。这些关于军事领域的具体问题并非新近才出现。正如本书第\
  \ 1 章所示，AI 与军事领域密不可分。因此，这些问题早已被提出。更有意思的是，思考最新一代 AI（及其新的技术进步承诺）是否会 —  — 或不会 —  —\
  \ 更新 —  — 或保持 —  — 对安全与国防政策、战略或作战领域的思考。AI 将置于军事转型和军事事务革命思考的中心。特别是网络领域将受到这一角色的影响（网络安全与网络防御）。\n\
  \n\n\n\n第二个主要主题涉及人工智能与人类的关系。对于一些人来说，人工智能是一个存在主义威胁（这与 1990 年代互联网发展时的灾难论话语相类似），对于另一些人来说则不是。有些人认为这些技术是新的权力、胁迫、压迫和控制的工具，将被用于对抗人类；另一些人则持有一种更具天使色彩的愿景，即人类与机器协作的社会，机器只是人类的延伸，帮助人们、陪伴它们并提升它们的能力。也有一种思潮倾向于去神秘化和去人格化人工智能，认为它并非解决问题的万能药，也不是人们常说的那么智能，也不是完美的，这条思路强调其缺乏中立性和缺陷，简而言之，它的局限性。\n\
  \n### 2.4.2. `The absolute superiority of human intelligence over the machine`\n\
  \n争议的第一个对象在于是否承认机器可以与人类相等，甚至可能优于人类。争论在于人脑与机器的能力是相互对立还是相互比较。\n\n对于那些对人工智能前景持批判或怀疑态度的人，这些声音早在该学科诞生之初的\
  \ 1960 年代就已被听到。对于这些人，结论是：计算机永远无法与人类在其活动上相匹配。它可能模仿人类，可能接近，但永远无法比人类做得更好。甚至不存在机器会超过人类的设想。为了支持他的批评和主张，Hubert\
  \ L. Dreyfus 依据 1957–1967 年人工智能研究的进展来论证，这段时期的研究基本上以失败告终，迄今为止所有列出的目标均未实现 `\\[DRE\
  \ 72\\]`。\n\n许多像 H.L. Dreyfus 这样的人决定建立一种层级，即无论进步多大，人脑的智能都无法被机器超越：\n\n> “在 `Le Cerveau\
  \ et l’Ordinateur` 中，目的是证明，尽管与电子机器竞争，甚至在某些领域被其超越，大脑仍然是上位的，唯一的创造者。[…] 计算机配得上‘人工大脑’这个名称吗？结构相似性不可否认。[…]\
  \ 但计算机永远无法达到与大脑相当的元素数量。整体而言，大脑拥有机器无法实现的属性。[…] 计算机的表现[…] 在数值域是无可争议的优于人类，但在理性域则不如人类，不是数字化的；在智能方面，即理解方面，它是不足的，因为智能是一个整体现象，不对应于任何特定的神经结构。即使是最学识渊博的‘专家系统’，也只能产生潜在包含的内容。机器不同于大脑，不具备整体性的产出。”\
  \ `\\[LAZ 88\\]`⁷³\n\n> \n\n> “机器的智能永远无法与人脑相匹配，因为它没有生命。人工智能是人类智能的仆人，是记忆。它们之间没有对抗。”\
  \ `\\[GIF 84\\]`\n\n### 2.4.3. `The replacement of humans by machines`\n\n在 `Computer\
  \ Power and Human Reason` `\\[WEI 75\\]` 中，Joseph Weizenbaum 描述了将人类在本应只能由人类执行的任务中交由机器取代是不道德的。科学与技术为我们提供工具，但在某些情况下其使用是不道德的。他说，计算机是一种强制我们思考道德的工具。这一论点受到各种各样的回应\
  \ `\\[BUC 76\\]`，包括被描述为不合理 `\\[MCC 76\\]`。\n\n同时也有人担心人类会被机器取代，由人类自己创造的、我们自己的创造物：\
  \ “计算机系统必须保持在算法计算的领域，以便人类能够完全控制它们。” `\\[WAR 80\\]`⁷⁴\n\n> “这些是‘可怕的前景’，一位《世界报》记者表示。那些直到现在只把人从体力劳动中解放出来的机器，怎么能在思想所确保人类拥有垄断权的最崇高任务中取代人类呢？这些‘聪明’机器，拥有‘记忆’，现在是否能在日益增多的任务中超越人脑？人类的至高地位不会受到威胁吗？这些‘思考机器’在一些人预测的未来中，是否会把人类降至奴役地位？[…]\
  \ 前国务卿艾尔弗雷德·福尔（Edgar Faure）认为，‘决定而非执行的机器’将是对人类智能的‘严重创伤’。” `\\[LAN 69\\]`。\n\n但没有任何机器能够完全摆脱这些论点和恐惧，也无法摆脱人类的控制和意志——只有人类才决定机器的实施方式。从这个意义上说，任何机器都不可能获得真正的自主性：\n\
  \n> “如果机器本身执行一个动作，则该动作是自动的。[…] 但有什么机器在没有人类欲望参与的情况下行动？[…] 任何机器在人类决定启动它之前都是惰性的。[…]\
  \ 因此，将自动性与机器脱离人类的独立联系起来是不可能的——机器始终依赖于人。” `\\[DEL 53\\]`\n\n### 2.4.4. `AI as an\
  \ existential threat`\n\n威胁的第一层在于创造者失去对机器的控制。这一主题自人工智能早期就一直存在：\n\n> “一些人工智能专家甚至认为，机器有可能改进自身，最终达到如此完美的程度，以至于人类将无法控制它们。这一前景已经让年轻一代——即将生活在\
  \ 2000 年的人们——感到不安，他们担心人类将被去人性化。” `\\[BÉN 71\\]`\n\n2014 年，斯蒂芬·霍金和埃隆·马斯克再次提出这一论点，声称真正的人工智能可能导致人类的终结。这一立场并不新颖，属于对技术影响的二元化阅读之一。存在主义威胁是\
  \ `R.U.R.`（1922）剧本的主要主题，该剧本首次提出了“机器人”一词：\n\n> “这三个字母的含义是：Rozum Universal Robots。随着机械的不断发展和现代机器的快速演进，Karel\
  \ Capek 得以展望未来，进入明天的世界[…]。在这段美好时光里，可以生产人机合一的生物，或者说机器人（捷克语中意为‘工人’）。” `\\[QUI 22\\\
  ]`\n\n威胁是通过事件和事实的累积构建的。首先，机器“将彻底缺乏所有的人类感受，毫无善恶之念，因为它们缺乏灵魂[…]”。 `\\[QUI 22\\]`\n\n\
  随后，人们一致认为机器有用，人类想要围绕这些机器生活。Karel Capek 则设想了一个与互联网社会极为相似的世界：“我们正站在主管的办公室里，他向打字员 Sylla\
  \ 发出一封庞大的信。这批化学合成的机器人负责回复全球各地机器人的大量订单。” `\\[QUI 22\\]`\n\n接着，机器进入军事领域 `\\[BLU 22\\\
  ]`：“在第二幕中，我们了解到许多政府已获得机器人来进行战争。Rozum 向全世界提供了这种‘人性化’的材料。”\n\n最后，机器接管了人类：“系统性屠杀结束后，机器人对所有在战争中幸存下来的人类展开可怕的屠杀。”\n\
  \n实际上，正是人类自己为自己的 obsolescence（过时性）埋下了伏笔。\n\n\n\n\nFor Ben Shneiderman, AI is one\
  \ of the causes of the 10 plagues of the information age \\[SHN 86\\] (anxiety,\
  \ alienation, unequal access to information, individual powerlessness in the face\
  \ of organizations, overwhelming complexity and speed, organizational fragility,\
  \ lack of professional responsibility, negative effects on employment, invasion\
  \ of privacy and damage to the image of individuals):\n\n> “With the presence of\
  \ intelligent terminals, smart machines, and expert systems, it seems that machines\
  \ have indeed taken over human abilities. These misleading phrases not only generate\
  \ anxiety about computers, but also may undermine the image that we have of people\
  \ and their abilities. Some behavioral psychologists suggest that we are little\
  \ more than machines; some artificial intelligence workers believe that the automation\
  \ of many human abilities is within reach. The rich diversity of human skills, the\
  \ generative or creative nature of daily life, the emotional or passionate side\
  \ of human endeavor, and the idiosyncratic imagination of each child seem lost or\
  \ undervalued. Rather than be impressed by smart machines, accept the misguided\
  \ pursuit of the Turing test, or focus on computational skills in people, the authors\
  \ believe that we should recognize how designs that empower users will increase\
  \ their appreciation of the richness and diversity of unique human abilities.”\n\
  \nSeveral themes are intertwined here:\n\n*   – super-intelligence, surpassing human\
  \ intelligence, which would have the effect of surpassing humans and threatening\
  \ them with death. This story is a fiction, a hypothesis excluded in the short and\
  \ medium terms. It is not essential and does not ask immediate questions. However,\
  \ it occupies part of the debates because it is sensational in nature. One can consider\
  \ this theme as strong background noise;\n\n*   – the effects of AI on societies\
  \ and immediate realities: AI destroys jobs, but creates new jobs (what equilibrium?);\
  \ AI at the service of States as an instrument of control and supervision;\n\n*\
  \   – AI, the solution to our problems;\n\n*   – the difficulties of science in\
  \ achieving the goals set in the 1950s. Considerable progress has been made, but\
  \ overall no AI is yet truly “smart”.\n\nAI needs to be demystified along with its\
  \ current capabilities, what it really is compared to what it is or should be;\n\
  \n*   – the persistence of misunderstandings, misuse of concepts. Is ML really AI?\n\
  \n### 2.4.5. *The place of AI and robotics in fiction: the example of Japan*\n\n\
  In Japan, science fiction and manga have, for their part, given prominence to artificial\
  \ intelligence in multiple forms (robotic or virtual) since the 1950s. AI and robotics\
  \ often go hand in hand.\n\nLiterature makes it possible to distinguish:\n\n*  \
  \ – AI that play the main character;\n\n*   – AI acting as an assistant, alongside\
  \ the heroes or protagonists of different levels, who find themselves, thanks to\
  \ AI, reinforced, helped and improved in often hostile or unknown environments;\
  \ AI which is not the main protagonist; AI which is an object intervening in the\
  \ story;\n\n*   – purely virtual AI, which is located in cyberspace or in networks;\n\
  \n*   – AIs that are embedded in robots;\n\n*   – embodied AI (it *is* a human body,\
  \ is *in* a human body, or is biological).\n\nWe cross-reference these categories\
  \ to put together Table 2.12, which is made up of narratives in specified manga\
  \ (the list is of course not exhaustive. Japanese production has been impressive\
  \ for several decades, and no catalogue or database lists them all).\n\n**Table\
  \ 2.12.** *Some AI and robots in Japanese manga and anime*\n\n|  || AI as the main\
  \ protagonist || AI as the hero’s assistant, or as a supporting role, or as part\
  \ of the narrative |\n| --- | --- |\n| **Virtual AI** || *The Two Faces of Tomorrow*\
  \ (1996, James P. Hogan, Yukinobu Hoshino): computers govern the world of the 21st\
  \ Century. Artificial intelligence is built into the system, which acquires autonomous\
  \ power. || *Sword Art Online* (2012–…, Reki Kawahara, Kôtarô Yamada): the Japanese\
  \ government wants to create a high level artificial intelligence comparable to\
  \ the human brain, to be integrated into weapon systems. |\n\n| --- | --- |\n| **AI\
  \ incorporated in a machine, a robot** || *Astro Boy* (1952–1968, Osamu Tezuka)⁷⁵:\
  \ the robot Astro fights crime and injustice. Astro is a superhero, who must save\
  \ the world⁷⁶. || *Gundam Sentinel* (1987–1990, Masaya Takahashi): an AI named ALICE\
