  \ Intelligence Strategy of the Czech Republic⁹  \n\n第二部分定义，即立陶宛战略所指的，是欧洲委员会的定义 ||\
  \ 2019 |\n| “在本节中，‘人工智能’一词包括以下内容：  \n\n(1) 任何在不同且不可预测的情况下、无需重大人工监督，或能够从经验中学习并提升性能的系统；\
  \  \n\n(2) 在计算机软件、物理硬件或其他情境中开发的系统，能够解决需要类似人类感知、认知、规划、学习、通信或物理行动的任务；  \n\n(3) 设计用于像人类一样思考或行动的系统，包括认知架构和神经网络；\
  \  \n\n(4) 设计用于近似认知任务的技术集合，包括机器学习；  \n\n(5) 设计用于理性行动的系统，包括智能软件代理或具身机器人，能够通过感知、规划、推理、学习、通信、决策和行动实现目标。”\
  \ || John S. McCain National Defense Authorization Act for Fiscal Year 2019¹⁰ ||\
  \ 2019 |\n| “在上述定义中，‘机器’一词常被误用。究竟‘机器’指的是什么？对数学家和计算机科学家而言，机器可以是抽象模型（如图灵机）。但更普遍地，机器是‘一种能够将一种能量形式转换为另一种能量形式，或利用这种转换直接对工作对象进行修改以实现固定目标的制造复杂物体’¹¹。机器也与计算器、计算机同义。我们仍在计算机科学中使用‘机器语言’或‘机器程序’的术语。这些用法的精确指代是哪一个？能够转换或利用能量的含义同样可以指代电动工具或仪器、计算机，也可以指代机器人。”\
  \ ||  ||  |\n\n\n\nThe primary purpose of these machines, as F.H. Raymond for example\
  \ expresses it, is to give answers to questions. The calculating machine is a machine\
  \ that provides answers (the results of calculations) to questions (which are operations).\
  \ Of course, we can imagine that the intelligent computer goes further, beyond the\
  \ strict framework of mathematical calculation. However, in today’s predictive tools,\
  \ what else is there to do except perform calculations on large masses of data?\
  \ The answers can also be called “solutions”, and the questions “problems”. Artificial\
  \ intelligence should broaden the range of questions or problems that can be submitted\
  \ to machines. This is the goal that expert systems would pursue in the 1980–1990s\
  \ with varying degrees of success. But the principle of answering questions remains\
  \ today at the heart of the aims assigned to AI. Predicting means answering the\
  \ questions “who will…  ”, “what will… ”, “how will…” (the weather, the economy,\
  \ market trends, crowd behavior, etc.). Detecting information with the help of so-called\
  \ intelligent cameras means answering the questions “where will…” (an individual,\
  \ an object, the signs of disease on an ultrasound, etc.), “who is there… ”, “what\
  \ can you see… ?”. But human intelligence means more than just solving problems\
  \ or providing answers to questions.\n\nHuman intelligence is the only form of intelligence\
  \ targeted by AI, the one to be imitated, reproduced, attained, the one that serves\
  \ as a reference, from which humans can estimate whether the machine is intelligent\
  \ or not. Artificial intelligence aims to reproduce in the computer, through software,\
  \ human capacities or functions (understanding, reasoning, learning, perception,\
  \ decision-making, etc.). The possibility of taking animal intelligence into consideration\
  \ or as a model never seems to be considered. The human remains the model, the reference\
  \ point, which must be copied and attained, and we rely on human intelligence to\
  \ judge that of the machine. For some years now, the idea has been circulating that\
  \ AI has overtaken humans or is about to do so, thus making it useless, pushing\
  \ humans out of the loop, creating a field in which the human has no place because\
  \ they are unable to compete with the capacities of machines that stir up volumes\
  \ of data at considerable speeds, out of reach of the capacities of the human brain,\
  \ as well as because the machine would proceed with reasoning that is now alien\
  \ to a human. Humans, who were a model, an objective, a reference for AI since the\
  \ 1960s, would thus be obsolete and would no longer be this typical model. Humans\
  \ would no longer be the pivot from which intelligences and abilities are assessed.\n\
