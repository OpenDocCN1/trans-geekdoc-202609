  \n45. 45 这里的数据来自 \\[WAR 19]。\n\n# 结论\n\n与人工智能（AI）相关的关键概念，因此构成其领域或空间，包括速度、自主性、隐蔽性、行动、决策、学习、数据等。基于这一特定的\
  \ AI 空间，我们必须关联其缺陷和脆弱性，如错误、偏见、不完美以及受到攻击的暴露，这些是 AI 最重要的方面。\n\n许多这些方面已经出现在网络安全和网络防御所讨论的问题中。但当我们谈论\
  \ cyberspace（网络空间）时，我们主要考虑世界、个人和社会的网络化（互联），因此我们以这一基本特征来看待安全和防御问题。网络挑战了我们对空间的控制方式，进而影响我们对国家空间、主权、边界、距离缩短、对该空间的权力以及该空间的军事化的思考方式。网络凸显了流动、交换和共享的概念。cyberspace\
  \ 意味着数据的持续流动和永恒的移动，因此是一种具有自身空间化的动态。\n\nAI 处于不同的层面；它要求其他概念、其他想法、其他表征和逻辑。然而，它是 cyberspace\
  \ 的组成部分，离不开它：它依赖数据，由应用构成，在网络空间中运行并影响网络空间，进而对其进行修改、颠覆和重构。将具有不同行为（智能、自主、自适应、诱骗、模仿、模糊真伪与虚构界限）的新组件引入\
  \ cyberspace，可能会重新洗牌局面。\n\nAI 是 cyberspace 的组成部分。因此，它应被视为 cyberspace 的一部分，并融入 cyberspace\
  \ 安全与防御政策与教义之中。\n\n**Table C.1.** *Searching for AI references in some recent national\
  \ cybersecurity strategies*\n\n| **National cybersecurity strategy** || **人工智能**\
  \ || **机器学习** || **机器人** |\n| --- | --- | --- | --- |\n| National Cyber Security\
  \ Strategy, Luxembourg, 2018¹ || 4 || 0 || 0 |\n| --- | --- | --- | --- |\n| National\
  \ Cybersecurity Strategy, Spain, 2019² || 2 || 0 || 2 |\n| National Cyber Strategy\
  \ of the United States of America, 2018³ || 2 || 0 || 0 |\n| National Cyber Security\
  \ Strategy 2018–2023, Jordan⁴ || 2 || 0 || 0 |\n| New Zealand’s Cyber Security Strategy\
  \ 2019⁵ || 2 || 0 || 0 |\n| Cybersecurity Strategy, Estonia, 2019–2022⁶ || 1 ||\
  \ 1 || 3 |\n| National Cyber Security Strategy for Norway, 2019⁷ || 1 || 0 || 1\
  \ |\n| National Cybersecurity Strategy, Republic of Korea, 2019⁸ || 1 || 0 || 0\
  \ |\n| National Cybersecurity Strategy, UAE, 2019⁹ || 1 || 0 || 0 |\n| Dubai Cyber\
  \ Security Strategy, 2017¹⁰ || 1 || 0 || 0 |\n| *Revue stratégique de cyberdéfense*,\
  \ France, 2018¹¹ || 1 || 0 || 0 |\n| Singapore’s Cybersecurity Strategy, 2016¹²\
  \ || 1 || 0 || 0 |\n| National Cyber Security Strategy, Turkey, 2016–2019¹³ || 0\
  \ || 0 || 0 |\n| National Cyber Security Action Plan, 2019–2024, Canada¹⁵ || 0 ||\
  \ 0 || 0 |\n| The Cybersecurity Policy for Critical Infrastructure Protection, Japan,\
  \ 2019¹⁶ || 0 || 0 || 0 |\n| Cyber Security Strategy, Jersey, 2017¹⁷ || 0 || 0 ||\
  \ 0 |\n| Cybersecurity Strategy of the European Union, 2013¹⁸ || 0 || 0 || 0 |\n\
  | National Cybersecurity Policy, Chile, 2017¹⁹ || 0 || 0 || 0 |\n| National Cyberspace\
  \ Security Strategy, China, 2016²⁰ || 0 || 0 || 0 |\n| *Estrategia Nacional de*\
  \ Ciberseguridad *de Costa Rica*, 2017²¹ || 0 || 0 || 0 |\n| Danish Cyber and Information\
  \ Security Strategy, 2018²² || 0 || 0 || 0 |\n| National Cybersecurity Strategy\
  \ 2017–2021, Egypt²³ || 0 || 0 || 0 |\n| National Cyber Security Strategy, Greece,\
  \ 2017²⁴ || 0 || 0 || 0 |\n\n\n\n\n| *Estrategia Nacional de Seguridad Cibernética*\
  \ (National Cyber Security Strategy), Guatemala City, 2018²⁵ || 0 || 0 || 0 |\n\
  | National Cyber Security Strategy for the State of Kuwait, 2017–2020²⁶ || 0 ||\
  \ 0 || 0 |\n| National Strategy for Digital Security, Monaco, 2017²⁷ || 0 || 0 ||\
  \ 0 |\n| National Cybersecurity Policy, Nepal, 2016²⁸ || 0 || 0 || 0 |\n\nHowever,\
  \ we have observed that this is not the case. A separate path is being paved for\
  \ AI. Militarily, cyber-commanders are not being given full responsibility for the\
  \ militarization of AI. Specific structures are being created for AI. National cybersecurity\
  \ strategies only cautiously integrate AI, which is usually presented as one element\
  \ among others, into cyberspace. At the same time, AI is the subject of specific\
  \ national strategies.\n\nFew national cybersecurity strategy documents give any\
  \ kind of line to AI. Jordan’s strategy is one such document:\n\n> “Cyber criminals\
  \ are using AI bots to place more targeted phishing adverts and emails and analyzing\
  \ large amounts of social media information to profile their targets. Online chat\
  \ bots are also being seen more and more in use for customer service – positioning\
  \ them as a system that people trust. Attackers will look to use this trust and\
  \ build chatbots to try and obtain financial details from people.”²⁹\n\nWe will\
  \ also mention Luxembourg’s:\n\n> “Threats inherent in the development of artificial\
  \ intelligence. Generally speaking, artificial intelligence will emerge in the context\
  \ of designing and executing malicious software. It is currently a research subject\
  \ in the world of academia and will soon be mature enough to be implemented in real\
  \ malware, which will have the ability to adapt dynamically to security measures\
  \ put in place by teams defending the networks and infrastructure of organizations.”³⁰\n\
  \nIn both cases, AI has been identified as one of the new forms of cyber threats.\
  \ But nothing is envisaged in terms of the methods or means that will have to be\
  \ deployed to counter them.\n\nNew Zealand’s strategy³¹, on the contrary, simply\
  \ proposes a challenge to AI, and does not go beyond it: “A computerized system\
  \ capable of simulating human decision-making and learning, including performing\
  \ cognitive functions associated with the human mind including learning and language”.\n\
  \nMore generally, when these strategic documents mention AI, it is only to remind\
  \ us that it belongs to a broader set of new technologies, such as cloud computing\
  \ or the Internet of Things, which are destined to transform cyberspace and modern\
  \ society.\n\nThe decoupling of AI-specific policies, on the one hand, and cybersecurity\
  \ policies, on the other, is therefore a common approach around the world. Currently,\
  \ AI is barely mentioned in cybersecurity policies. We have also noted the very\
  \ weak presence of AI in US defense doctrine documents, even though the government\
  \ and defense policy show a strong commitment to AI; US defense has invested heavily\
  \ in these technologies and for a long time, and AI is one of the leading technologies\
  \ in the modernization of armies. All this gives the impression of an uneven level\
  \ of consideration for AI. Russia, in 2019, was still in the process of preparing\
  \ its own national strategy for AI. The exercise has only recently been implemented\
  \ all over the world. It will therefore still take a little time, a few months,\
  \ probably a few years, before AI finds its full place in security and defense policies,\
  \ as well as in military doctrines. To speed up these processes, it may take a more\
  \ significant incident than others, fully attributable to the exploitation of AI\
  \ capabilities.\n\nA few points seem to grab our attention to conclude this work:\n\
  \n*   – AI is portrayed as a transformative, disruptive, revolutionary technology\
  \ or set of technologies, but it has only recently been taken into account at political,\
  \ strategic and doctrinal levels. The new wave of AI is only in its infancy;\n\n\
  *   – discourse is one of the main elements that triggers the different phases of\
  \ AI. Thus, we have highlighted the role of negative or alarmist discourse, often\
  \ emanating from researchers, whose arguments are heard by politicians and provoke,\
  \ for example, the first winter of AI. However, the discourse of politicians also\
  \ plays a decisive role: Ronald Reagan’s 1982 speech marked a new period of huge\
  \ investment in scientific and technological research;\n\n*   – national mobilizations\
  \ around major technological projects are also the expression of a reaction to the\
  \ international environment. The security dilemma and the fear of loss of economic\
  \ and industrial power are leading nation states into a technological development\
  \ or arms race. This was, for example, the situation in 1982 when Japan announced\
  \ its plan to create new-generation computers. The major powers reacted immediately\
  \ and committed themselves to new R&D plans, both civil and military. The revivals\
  \ that mark the history of AI, like other technologies, are the result of the position\
  \ of the States in relation to the rest of the world. Today, competition between\
  \ the United States, China, Russia and Europe is the driving force;\n\n*   – the\
  \ “militarization” of AI is written in its genesis. Technology is military or civil,\
  \ or dual use. It is financed and its results are monitored by the military, in\
  \ the United States or Russia, and in other countries, from its inception. It is\
  \ in the same position as other technologies, such as the Internet and computers,\
  \ in particular;\n\n*   – with each generation, AI is reduced to one of its predominant\
  \ technologies. There was an entire period marked by expert systems, the flagship\
  \ technology of the 1980s and 1990s. Today, AI seems to be reduced to machine learning.\
  \ But this simplification is probably useful;\n\n*   – this reduction contributes,\
  \ among other things, to feeding agreed AI discourses. Indeed, the stories we hear\
  \ about policies for AI, AI safety or AI research are relatively simple. They tell\
  \ us that technologies (here AI, but we find the same thinking when it comes to\
  \ cyberspace or cybersecurity) are beneficial to society, must be developed and\
  \ introduced, for the benefit of individuals (their quality of life and security).\
  \ But the primary project that these technologies and their implementation must\
  \ pursue is essentially economic in nature (forgetting, in fact, projects for networking\
  \ citizens, planetary communication, access to knowledge or democratization of the\
  \ world). However, obstacles are being put in the way of this project: enemies,\
  \ adversaries and criminals are attacking society by attacking technologies or,\
  \ with the help of technologies. We must then secure, protect and defend all of\
  \ these technologies, because the survival of the system depends on them. We must\
  \ also learn to master these technologies and turn them into weapons, so that we\
  \ can respond to our enemies on equal terms;\n\n\n\n– AI 不挑战那些政治和军事领袖所抱有的、对某些被视为使他们全能的技术的盲目信念和信仰。AI\
  \ 是一个图腾，是人类为了确立自身权力和影响力、以及施加暴力而高举、展示给其人口、部队以及世界的神秘武器。AI 是这种信念或深切 conviction 的延伸，即宇宙、世界、经济领域、政治领域、人类政府和战争都可以通过掌握信息，在\
  \ 21 世纪，更是通过掌握数据来主导。这种信念的构建跨越了世纪，但在 20 世纪随着计算机和网络的出现，呈现出特定形态。如今，在 AI 时代，数据比以往任何时候都更加是绝对权力的源泉。这些信念从未被质疑。事实上，官方文件从未质疑对数据的无节制追逐、对数据的依赖，或是试图通过数据控制世界的可行性。\n\
  \n– AI 如同 cyberspace，似乎是战争力量不可或缺的组成部分。它被认为是建立战争胜利的关键。在 AI 之前，有互联网、电信、卫星等技术。AI 之后出现了专家系统，而现在是机器学习。然而，这些技术的累积，尽管每一次都被描述为革命性，却从未保证胜利，更未能确保绝对安全。对手始终会学会适应、规避、摆脱这些技术，或者反过来采用它们，构建非对称或混合冲突。新的\
  \ AI 不太可能像过去的技术一样保证军事或政治上的胜利。胜利的条件，以及经济和政治权力，都无法简化为单一技术。AI 也不会提供更快的胜利，尽管它看似压缩了时间——这主要是数据处理、计算和算法的时间。然而，将人类从决策回环中剔除、追求更快的冲动，似乎很大。胜利只能在高速进行的情况下实现。但如果\
  \ AI 提高行动或决策的速度，它仍然需要时间进行学习，并且（至少在目前）需要能够与决定其命运及启动的人类的节奏进行沟通。这种对时间缩短的痴迷以及排除人类的做法——认为人类太慢或无法处理其自身创造并部署的巨量数据——体现了一种更偏向产业主义而非生产力的逻辑：机器会比人更高效、更有效、更快。战争将仅成为管理者的事务，人力资源则会成为战争业务中的最后弱点。\n\
