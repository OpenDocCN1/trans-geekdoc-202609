  \ |\n\n### 2.5. Political considerations\n\nHarry Killer built a town called Blackland.\
  \ We are here in a fictional story, imagined by Michel Verne (son of Jules Verne),\
  \ in his novel *L’étonnante aventure de la mission Barsac*, published in 1919 \\\
  [VER 19\\]⁷⁹. This city is structured in three parts separated from each other by\
  \ high impenetrable walls. The inhabitants of the aristocratic quarter are organized\
  \ in a military manner. Their function is to wage war. They also have a police function.\
  \ A third district is inhabited by white people who have not yet been able to access\
  \ the first one. Their function is that of commerce. Between the two districts is\
  \ the slave district. The rulers have taken up residence in a town a little far\
  \ from Blackland and have their palaces there. Blackland is equipped with the latest\
  \ technological innovations, and no quarter, aristocratic or slave, is without them:\
  \ “No home \\[...\\] that didn’t have a telephone. Not a street, not a house, not\
  \ even a hut in the slave quarter that did not have pressurized water and electrical\
  \ lighting.”\n\nOn one of the towers overlooking the city, Harry Killer, the despot\
  \ leader, had a machine built to monitor the actions of the population:\n``` \n\
  if (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n> “得益于其光学处置，这台被称为‘环星仪’的仪器似乎使位于设备中心、始终盯着设备内部所有点的操作人员垂直地将这块圆形土地的条带整齐划一\
  \ \\[...\\] 外界在我们眼中发生的变化。无论从哪个方向看，我们首先看到的只是一堵垂直的墙，一条由无数细小的黑线分隔开的网格 \\[...]. 这堵墙的底部与我们隔着一片黑暗的深渊相隔，而顶端似乎升至惊人的高度，看起来像是由一种乳白色的光构成。然而，我们很快发现它的颜色并非均匀，而是由无数色调各异、轮廓模糊的斑点组成，这些斑点有的像树，有的像田野或道路，还有的像正在耕作的工人，整体已经足够放大，能够轻易辨认\
  \ \\[...]. ‘你看到这些黑人’，Harry Killer 指着两个分离很远的斑点说道，‘假设他们想逃跑，时间不太紧。’说着，他抓起了电话发射器。‘第\
  \ 111 圈，半径 1228’，他说。随后，他抓起另一只发射器，补充道‘第 14 圈，半径 6402。’最后，转向我们，‘好好看看’，他建议道。几分钟后的等待中，毫无特殊情况发生，其中一个斑点突然被烟雾云遮住。烟雾散去后，斑点消失了。‘那个在那里工作的人怎么了？’Harry\
  \ Killer 冷冷地回答，‘他死了’，‘被空中炸弹摧毁，这是一种能携带至 25 公里的火箭，其速度和精度你可以体会。’”\n\n在本篇虚构故事中，米歇尔·弗雷诺描述了：\n\
  \n*   一座“现代”城市，技术化、配备现代通信手段；\n\n*   基于以下因素的全景监控：\n\n    *   恣压的权力，\n\n    *   从高科技技术（尤其是监视技术）中汲取力量的能力，包括视觉仪器、成像、能够反射世界图像的屏幕，使监视更为有效，因为每个物体、每个人都有其空间坐标；该监视仪器与通信系统、军事指挥中心相结合；\n\
  \n*   以导弹精确击毁个体为目标的人类。其消除动机可能残忍——统治者想展示生死权力——并惩罚任何偏离行为（如逃跑企图、进入禁区等）。\n\n正如预见小说常见的那样，我们可以看到与当代世界的相似之处：\n\
  \n*   现代城市（智慧城市、超级互联城市）使其数千公顷受益于技术创新；\n\n*   全球部署的监控系统；\n\n*   卫星、无人机、摄像头（监视、机载、警务、军事等）捕捉世界的影像；屏幕无处不在，是任何现代监控系统的关键连接；\n\
  \n*   军事指挥系统围绕处理影像的机器构建；图像中的物体虽可辨识，但在夜间或恶劣环境（如战斗情境、过远拍摄等）下质量下降，物体往往只是模糊的形态，供指挥或士兵基于其进行解释、分析和决策。句子“其中一个斑点突然被烟雾遮住”让人联想到战斗直升机或无人机拍摄的视频，当目标被击毁时——无论是人还是物体——都会被精确标记，实行精确外科式打击。\n\
  \n在这个时代，现代系统通过人工智能、模式识别、面部识别等技术区分任务、区分物体与人类。在战争中，我们可以想象将这些识别工具与致命能力相结合的系统。我们遵循朱尔斯·\
  \ Verne 所描述的系统原则：基于影像监视的生死权力，以及消除扰动因素的物理消除（正如我们在战争或反恐行动中所见，也可在极权警察国家中设想）。\n\n人工智能最常被讨论的主题之一是其对社会及整个世界的影响。布鲁金斯学会（Brookings\
  \ Institution）将其出版物题为“ artificial intelligence 如何转变世界”。 \\[WES 18\\]\n\n这些主要影响将在社会的不同层面显现：经济层面、就业层面\
  \ \\[SMI 14\\] 以及诸多其他层面。\n\n但如果人工智能能够实现米歇尔·弗雷诺所描述的情景，它不只是权力的工具，亦是“强力”。\n\n安全与国防部门也将受益于或受到人工智能引发的变革。\n\
  \n面对已知、设想以及尚未发明的 AI 用途的多样性，面对 AI 的真实或幻想潜能，政府已关注此议题，推出了“国家人工智能战略”，用于研究、工业化 AI、安全等方面，在文件中展示了所有野心。这些战略或计划聚焦于经济、社会、研究和工业问题，安全与国防议题亦在人工智能光辉下重新审视。\n\
  \n### 2.5.1. *National strategies for artificial intelligence*\n\n国家战略可满足多项期待：协调参与方和行动，回应协调需求，回应广泛的社会问题，为生态系统中的参与方在特定问题上提供明确的行动框架，确保资源使用更好、优化过于分散的资源。制定国家战略意味着绘制给定时期的政策轮廓，管理资源，希望通过国家层面的资源协调获得更佳成果（存在地区或国际战略，如欧盟）。战略可能决定创建新机构或机构，开辟行动道路，使特定领域的参与方能够组织、动员、依据国家制定的战略行动。它定义了行动的框架。\n\
  \n因此，战略必须在先验上明确其目标。激励它的发现必须使其显得必要且紧迫：“在过去，曾有批评指出 \\[…\\] 战争罪行调查和程序的当前质量 \\[…\\]\
  \ 缺乏 \\[…\\] 监管水平不足 \\[…\\] 调查质量不佳，因上述原因，有必要制定国家层面的战争罪行起诉战略。” \\[REP 16\\]\n\n许多期待常被置于国家战略之中：“一个能够为所有已识别问题提供全面且清晰的战略框架的战略，其目标与活动。”\
