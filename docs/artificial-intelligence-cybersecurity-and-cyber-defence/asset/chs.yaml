  \ AI 都属于低 AI 类别。 |\n| --- | --- | --- |\n\n另一种两分类的 AI 类型区分了 AI 类型 1 和类型 2：\n\n*\
  \   – 类型 1 包括上述的低 AI 和高 AI 两种类型；\n\n*   – 类型 2 不同：\n\n    *   - 反应机器，它们不保留过去记忆以改变决策或未来选择，\n\
  \n    *   - 具有有限记忆的系统，利用过去信息指导未来决策（例如自动驾驶系统，其中环境观测不永久存储），\n\n    *   - 能够“理解”个人的情感、行为和思想，并能够进行社会交互的\
  \ AI，\n\n    *   - 最后，具有自我意识的 AI，类似于人类。\n\n因此，区分了当前知识状态下可实现的 AI 与在短期和中期不可实现的 AI。\n\
  \n这些类型可能基于 AI 的应用领域或主要研究与发展方向进行细分：“人工智能包含以下主要子领域：专家或基于知识的系统、自然语言处理、人工或计算机视觉、声音感知/理解和机器人学。”\
  \ \\[ALB 88\\]\n\n## 2.3. Evolution of Themes Over Time\n\n### 2.3.1. *Google Trends*\n\
