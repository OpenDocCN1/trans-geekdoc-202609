    and commands.


    This chapter examines some of the network tools and commands that IT personnel
    use when troubleshooting. The Network+ exam expects candidates to be familiar
    with these tools.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    5.3, including the following topics:


    +   - Software tools

    - Command-line platform commands

    - Basic network platform commands


    # SOFTWARE TOOLS


    In addition to the hardware tools described in Chapter 22,"Troubleshooting Cable
    Connectivity," network troubleshooters typically have an arsenal of software tools
    available to them as well. Some of the most useful of these tools are described
    in this section.'
