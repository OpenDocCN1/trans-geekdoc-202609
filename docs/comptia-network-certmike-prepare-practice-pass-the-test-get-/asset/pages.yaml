    # Practice Question 2 Explanation


    A. is incorrect although RIPv1 does use broadcast transmissions, this is not a
    reason why the routing protocol must be changed.


    B. is incorrect because the statement is untrue. RIPv1 always transmits the entire
    routing table every 30 seconds.


    C. is correct because RIPv1 does not include the netmask (or mask) value in its
    routing table transmissions. Therefore, the routes included in the messages must
    conform to the standard IP address classes. Once the entries create the requested
    subnets, the routing table will no longer contain the Class C address, and the
    entries in the RIPv1 messages will be incorrect.


    D. is incorrect although RIPv1 does use only hop counts to evaluate routes, this
    is not a reason why the routing protocol must be changed.


    Correct Answer: C'
