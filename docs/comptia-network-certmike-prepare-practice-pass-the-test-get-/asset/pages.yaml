- pgno: 295
  md: '# SPECIFICATIONS AND LIMITATIONS


    Cabled networks have basic specifications that administrators typically use to
    select an appropriate platform for their users'' needs. These specifications impose
    limitations on the network that are among the chief causes of communication issues.


    # Throughput


    Throughput is a measurement of the amount of data transmitted across the network
    during given time interval. Usually measured in bits per second (bps), the throughput
    is a measurement of the actual data flowing through the network. When the throughput
    measurement approaches the network''s speed, the network is approaching saturation.
    This causes latency to increase, as well as the potential for dropped packets.


    # Speed


    A network''s speed is its theoretical maximum transmission rate, usually measured
    in bits per second. Actual networks almost never achieve this maximum, so administrators
    designing networks should always choose physical layer specifications with speeds
    at least double that their anticipated throughput needs. For example, a Gigabit
    Ethernet network is rated at 1,000 megabits per second (Mbps). While occasional
    bursts of traffic might reach that speed momentarily, there are many variables
    in networking that prevent the average network from achieving and maintaining
    its maximum speed.


    > EXAM TIP

    Speed and throughput measurements are typically supplied in bits per second (Mbps)
    or gigabits per second (Gbps). Note the distinction between the abbreviations
    for megabits and gigabits per second—Mbps and Gbps, with a capital M or G and
    a lowercase b—and megabytes per second and gigabytes per second: MB and GBps.
    Network+ exam candidates should be aware of the differences in and how they are
    used.


    # Distance


    Distance is the maximum cable length that a particular physical layer implementation
    can support while functioning properly. In many cases, networks have distance
    limitations to avoid the signal degradation caused by attenuation, the weakening
    of a signal through a network medium. Ethernet networks also require distance
    limitations because a frame must reach the destination system before it completely
    leaves the sending system. If a cable segment is too long, late collisions can
    occur, which is a serious problem.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# CABLE CONSIDERATIONS


    While there are standards-based specifications for various network types that
    administrators should adhere to when installing cables, there are also specific
    environmental concerns that can dictate the type of cable they use. Sources of
    interference and installations within air ducts or other air channels are both
    concerns that can affect the type of cable needed for the installation.


    # Shielded and Unshielded


    Twisted pair cables are available in shielded and unshielded varieties. Most twisted
    pair network installations use the unshielded twisted pair (UTP) version, in which
    individual pairs of wires are twisted together and enclosed in a sheath. The shielded
    twisted pair (STP) versions—which are all more expensive than UTP—are intended
    for environments where there is a great deal of electromagnetic or other types
    of interference presence. This can include locations with industrial equipment
    or sources of EMI.


    Depending on the cable type, the shielding, which can be made of a metal foil
    or braided wire, can be wrapped around the entire bundle of wires, around the
    individual wire pairs, or both. In addition to preventing EMI from reaching the
    copper wires, the shielding is a conductor that can be attached to a ground.


    # Plenum and Riser-Rated


    Standard UTP cables are sometimes called riser-rated because they are intended
    to run between floors without traversing an air space. The air circulation spaces
    inside a building, whether inside of ductwork or not, are called plenums. There
    are special plenum-rated cables that are designed to run through the air spaces.


    The difference between riser-rated and plenum cables is that the plenum variety
    is encased in a sheath of material that does not emit toxic vapors when it burns.
    Riser-rated cables have a polyvinyl (PVC) sheath that, if it burns in an air space,
    produces fumes.


    Plenum cables are more expensive than riser-rated ones, and they might be more
    difficult to install. The plenum cable''s fire-retardant sheath is less flexible
    than that of the standard PVC sheath which means the plenum cable has a larger
    radius that prevents it from stretching around corners easily.


    # CABLE APPLICATION


    Most UTP cables are wired "straight through," meaning that each pin in the connector
    at one end is wired to the same pin at the other. These cables typically take
    one of two forms. They are either permanently installed cables in the walls or
    ceilings that connect wall plates to a patch panel in a server closet or data
    center, or they are patch cords that connect computers and other devices to wall
    plates and patch panel ports to switches.


    +   * There are, however, other applications for specialized types of cables,
    as described in this section.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Rollover Cable/Console Cable


    Routers typically have a command-line interface (CLI) for configuring the device,
    but they do not have screens or keyboards. However, they traditionally have a
    console port into which an administrator can plug a terminal or laptop and access
    the CLI. Modern routers can have a variety of interfaces for the console port,
    but earlier models used the RS-232 serial interface, with a DB-9 D-shell connector.
    Before USB, this was the interface people used to connect an external medium to
    their computers. Current routers might have an RJ-45 console port supporting the
    rollover wiring configuration, a standard Ethernet RJ-45 port, or even a mini-USB
    port.


    A rollover cable, also known as a console cable, is a variation on the standard
    twisted pair design that eliminates both the twists and the pairs. A rollover
    cable is typically flat, not round like a UTP cable, and colored a light blue.
    At one end is a standard RJ-45 connector and at the other is either a DB-9 connector,
    as shown in Figure 22.1, or another RJ-45 and an EIA/TIA adapter that converts
    it to a DB-9.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_297_0.png)


    FIGURE 22.1 A rollover cable


    Unlike UTP cables, the eight wires in a rollover cable are eight different colors,
    and the cable uses a nonstandard wiring scheme. Pin 1 at one end connects to pin
    8 at the other end, pin 2 to pin 7, and so forth.


    # Crossover Cable


    For communication between network devices to occur, the signals a device sends
    out through the transmit pairs of the cable must arrive at the receive pairs of
    the destination device. Standard Ethernet cables are wired straight through, so
    the crossover circuit that connects the transmit to the receive pairs is located
    in the network switch.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'When a user wants to connect two computers directly to each other with an Ethernet
    cable, however, there is no switch to provide the crossover circuit, the user
    must connect the devices with a special crossover cable. In a crossover cable,
    the transmit pairs at each end are wired to the receiver pairs at each end. Crossover
    cables can also connect two switches or two routers, if needed, but most of the
    devices made today have some means of toggling the crossover circuit in the device.


    # Power over Ethernet


    Devices such as video cameras, VoIP telephones, and wireless access points can
    all benefit from being connected to a cached network. One of the problems with
    all three of these devices is the need to supply them with power when they are
    often located in places with no convenient outlets.


    Power over Ethernet (PoE) is an IEEE 802.3 standard to weaken by which standard
    and Ethernet cables carry power, as well as data, to connected devices. As shown
    in Table 22.1, the original 2003 PoE standard was capable of supplying 15.4 watts
    of DC power, but the standard has matured to the point at which it now supply
    up to 71.3 watts.


    # TABLE 22.1 Power over Ethernet Specifications


    | Name | Standard | DC power | Max current |

    | PoE | IEEE 802.3af-2003 | 15.4 watts | 350 mA |

    | PoE+ | IEEE 802.3at-2009 | 25.5 watts | 600 mA |

    | PoE++ (Type 3) | IEEE 802.3bt-2018 | 51 watts | 600 mA |

    | PoE++ (Type 4) | IEEE 802.3bt-2018 | 71.3 watts | 960 mA |


    # COMMON ISSUES


    Troubleshooting cable connectivity issues can be complicated by the large number
    of things that can conceivably go wrong with cables. Some of the common conditions
    that a troubleshooter might encounter are described in this section.


    # Attenuation


    Attenuation is the tendency of a signal as it travels through a network medium.
    This is one of the reasons all possible physical layer specifications for networks
    have a maximum allowable cable length, which installers should not exceed. If
    a cable is too long, the signals can degrade excessively and cause errors. All
    types of networks are subject to attenuation, but to different degrees.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'There cable testers available of various types that can measure the length
    of a cable segment. Overlong segments due to poor installation can be a possible
    cause of intermittent errors. Unfortunately, often nothing can be done except
    to pull a new cable that can support the distance.


    As a general rule, signals attenuate faster on copper cables than on fiber optic,
    so copper cannot support distances as long as fiber. The standard distance limitation
    for most UTP Ethernet networks is 100 meters, but some types of fiber-optic cable
    can run for miles.


    # Interference


    In networking, the term interference can refer to electromagnetic interference
    (EMI) or radio frequency interference (RFI), both of which can be disturbing influences
    on network communication. EMI and RFI are typically caused by electrical or electronic
    equipment in proximity to the network cables, as light fixtures, wireless phones,
    or radio equipment. There are natural sources of interference, as well as solar
    flares.


    Measuring the levels of interference on a cable run be part of the network installation
    process, but it is possible for interference to be added after the cables are
    in place. When this occurs, cable testers can be used to detect and quantify various
    types of interference. The only solutions for interference caused by other equipment
    are to move the cable and the equipment farther apart or replace the cable with
    shielded twisted pair (STP).


    # Decibel (dB) Loss


    The strength of a cable is measured in decibels (dB). Decibel loss is a value
    representing the ratio of a signal''s strength to its attenuation at its destination.
    As noted, all cable types suffer from attenuation to some degree; the decibel
    loss measurement is a means of quantifying that effect. Decibel values are logarithmic,
    meaning that the strength decreases exponentially as the decibel level increases.
    If a 10 dB loss means the strength at the destination is one-tenth of its original
    strength, then a 20 dB loss means the signal is one-hundredth of its original
    strength.


    # Incorrect Pinout


    Inside a twisted pair are eight or more wires, grouped in pairs, with each pair
    consisting of a signal and a ground wire. At each end of the cable is a connector
    that plugs into the computer, wall outlet, or patch panel. The connector connects
    each of the eight wires in the cable to a copper pin, according to one of the
    pinout defined in the ANSI/TIA-568-D standard, as discussed in Chapter 3, "Cables
    and Connectors.\When the connector is plugged into the socket, an electrical circuit
    is created between the two ends.


    Inside a UTP cable, eight pins are connected to the cable''s eight wires, and
    for a proper circuit to be established, each pin at one end of the cable must
    be connected to its corresponding pin at the other end.


    An incorrect pinout, in which the individual wires are mixed up inside the connector,
    can manifest as a variety of errors, including open circuits, short circuits,
    and crosstalk. These'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'errors can slow down network traffic or prevent a connection entirely. A simple
    tool like a tone generator can locate incorrect pinouts by a manual process, but
    high-end cable testing tools can test all of the wires and specify the type of
    error that has occurred.


    # Bad Ports


    When a device cannot connect to the network, many IT technicians swap out patch
    cables in their troubleshooting process. Bad cables do happen, but though much
    common, bad ports can also happen, either through misconfiguration or hardware
    damage. Remember that there are RJ45 ports involved in a typical network cable
    run—in the computer, the wall plate, the patch panel, and the switch—and any one
    of them can conceivably malfunction. Therefore, when swapping cables, it might
    be a good idea to swap ports well, just in case.


    # Open/Short


    Opens and shorts are wiring faults resulting from cables that are faulty, damaged,
    or incorrectly installed. An open circuit is one in which signals are not reaching
    the destination, usually because of a break in the medium. In twisted pair, an
    open circuit occurs when one or more of the wires within is severed. A short circuit
    is a condition in which two conductors are touching, causing signals to be incorrectly
    diverted. For example, frayed insulation on the inside wire can cause the copper
    conductors to touch, resulting in a fault that can interrupt the connection. Many
    types of cable equipment are available to detect a wiring problem, but higher-end
    models identify the type of problem and even its exact location in the cable.


    # Light-Emitting Diode (LED) Status Indicators


    Most network interfaces have one or more light-emitting diode (LED) indicators
    that provide information about the connection. A status indicator—usually colored
    green—indicates that there is a connection between two network devices. The indicator
    might blink to indicate the active transmission or receive of data. Some multispeed
    devices have other LEDs that can indicate the speed at which the connection is
    running, based on negotiation with the other device.


    When a status LED is out, then there is no connection to the other device, even
    if they appear to be properly connected. The LEDs are physical layer indicators,
    so if the link state LED is dark, there is usually a faulty somewhere in the cables
    or connectors involved.


    # Incorrect Transceivers


    Higher-speed network interfaces, especially for fiber-optic cables, support interchangeable
    plug-in transceiver. This allows administrators to choose the correct transceivers
    for the type (single mode or multimode) and wavelength of the cable. The transceivers
    at both ends of a cable must match for any connection between the devices to be
    established. Many plug-in transceivers are similar in appearance, so it can be
    easy to mix them up. When a fiber-optic link fails to connect, checking for the
    correct transceiver at both ends should be a basic troubleshooting step.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Duplexing Issues


    Originally, all Ethernet connections were half-duplex, meaning that only one of
    the connected systems could transmit at a time. This was because the protocol
    used a single wire pair for both transmitting and receiving data. Beginning with
    Fast Ethernet (100Base-T), the protocol included a full duplex, which uses separate
    wire pairs for the TX (transmit) and RX (receive) connections. This enables systems
    to transmit and receive simultaneously, increasing the theoretical transmission
    speed of the link to 200 Mbps.


    Virtually all Ethernet networks today run in full duplex mode. When establishing
    a connection, the network interface adapters negotiate the best possible speed
    and duplex mode. duplex issues result when one or both of the connected devices
    has a manually configured duplex setting. If one device is half duplex, the result
    will be a large number of collisions and errors, degrading the network performance
    dramatically.


    Administrators typically allow workstations to autotiate their duplex and speed
    settings. However, it is more common for them to manually configure the interfaces
    on switches and routers, in which case a duplex mismatch could occur by accident.
    When troubleshooting a slow Ethernet with excessive collisions, duplex settings
    is one of the configuration settings to check early in the process.


    # Transmit and Receive (TX/RX) Reversed


    As noted, UTP Ethernet cables are supposed to be wired straight through, with
    the crossover circuit implemented in the switch. If through some installation
    error, the transmit (TX) and receive (RX) wires in a cable connector are reversed,
    then there will be crossovers over the circuit, which cancel each other out. In
    theory, two crossovers prevent the devices from establishing a connection.


    This is theory because the effect of the additional crossover on the network depends
    on the capabilities of the switch. Some switches have a feature auto-MDIX that
    enables them to detect the presence of a crossover on a circuit and adjust themselves
    accordingly by disabling their internal crossover. In other switches, there might
    be a toggle for the internal crossover or a dedicated uplink port as a workaround
    until the cable installation error is corrected.


    # Dirty Optical Cables


    When installing fiber-optic cables, it is important for the cables to be thoroughly
    cleaned before they are joined to a connector. Fiber-optic signals are beams of
    light, and anything that inhibits the passage of light through the fibers increases
    the attenuation on the link and causes a degraded signal. If there is sufficient
    dirt or grease on the fiber splices, the connection between the devices can drop
    intermittently, a condition called flapping.


    Cleaning fiber-optic cable ends requires no special equipment, just just care
    on the part of the installer. Standard glass cleaners and microfiber cloths can
    be used to prepare the cable ends for connectors.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# COMMON TOOLS


    Cable troubleshooting requires specialized tools, some of which can be extraordinarily
    expensive. However, there are often relatively inexpensive alternatives that provide
    at least basic functionality. Some of the tools that cable troubleshooters commonly
    use the following:


    +   **Crimp Tool** A plier-like device used to attach connectors to the ends of
    bulk cable by squeezing the connector closed onto the. There are crimpers for
    different cable and connector types, as well as devices with interchangeable bits.


    +   **Punchdown Tool** A device for attaching twisted pair cable connects to the
    ends of walls and patch panels. The installer lays the wires in the correct slots
    on the connector and uses the punchdown tool to press each wire. In motion, the
    tool removes the insulation from the end of the wire, presses it into the slot,
    and trims off the end.


    +   **Tone Generator and Locator** A basic, inexpensive tool for identifying specific
    wires within a twisted pair cable. After connecting the generator to one of the
    cable''s wires, touching the other end of the cable with the locator will eventually
    produce a tone from the selected wire. As a basic troubleshooting tool, the generator
    and locator has its uses, particularly when more elaborate testing equipment is
    not available. However, using the tool for any sort of a cabling project is timeconsuming
    impractical.


    +   **Loopback Adapter** A testing device that redirects the signal from a cable
    or connector back into its input receive. Most commonly today using fiber-optic
    cables, plugging the loopback adapter into one end of a run allows for an OTDR
    (see the next item) at the other end to test the entire run at once. There are
    also loopback adapters for Ethernet devices, which can test whether their transmit
    and receive circuits are, but they are rarely needed days.


    +   **Optical Time-Domain Reflectometer (OTDR)** A high-end testing device for
    fiber-optic cables that uses light pulses through the fibers to measure the length
    of the run, locate breaks, and measure signal loss. This is also a similar device
    for copper cables called a time-domain reflectometer (TDR).


    +   **Multimeter** A testing device that measures electrical voltages, continuity,
    and resistance. Although not used for testing network cables, testing power level
    of AC and DC sources is sometimes necessary in network troubleshooting.


    +   **Cable Tester** A generic name for a group of devices that connect to a cable
    and read its specifications. Low-end analog cable testers send impulses on each
    wire pair in the cable and use LEDs to indicate whether the pairs are properly
    connected to the other end. High-end cable testers are digital devices that can
    display a larger list of specifications and compare the readings to the published
    requirements for a specific cable type. Sometimes called a cable certifier, this
    type of device tests the cable and displays a list of Pass/Fail results for the
    cable type.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Chapter 22 • Troubleshooting Cable Connectivity


    **Wire Map** A map tester is a relatively inexpensive cable testing tool that
    consists of two devices that connect to the ends of a twisted pair cable. The
    tester examines each wire in the cable and can detect opens, shorts, and transposed
    wires. All newly installed cable runs should be tested in this way, at minimum,
    but the tool is also useful for patching cables and troubleshooting nonfunctioning
    cable runs. High-end testers include the same functionality, but they are far
    more expensive, and a map tester is a reasonably priced alternative.


    **Tap** An active or passive network testing that enables administrators and troubleshooters
    to physically access the packets on a specific network connection and capture
    traffic samples for analysis.


    **Fusion Splicers** A fiber-optic cable installation device that splits two lines
    of fiber end-to-end with exacting precision and high temperatures.


    **Spectrum Analyzers** A network analysis tool that monitors the utilization of
    a specific range of audio, optical, or radio frequencies. The tool is most commonly
    used to monitor channel utilization and sources of interference on Wi-Fi networks.


    **Snips/Cutters** They are not expensive, and they are not dedicated networking
    tools, but a good pair of wire cutters or snips will probably be the most frequently
    used tool in the cable troubleshooter''s toolbox.


    **Cable Stripper** A scissors-like wiring tool that has, instead of a blade for
    cutting, a V-shaped blade designed to remove the insulation from a wire without
    damaging the conductor at its core.


    **Fiber Light Meter** A fiber-optic cable testing device that measures the signal
    loss of a cable run based on its measurement of a reference light source applied
    to the other end of the cable.


    # CERTMIKE EXAM ESSENTIALS


    +   Network cables have specifications that installers should observe and troubleshooters
    should check, including throughput, which measures the actual amount of traffic
    on the network; speed; which is the maximum possible transmission rate; and distance,
    which specifies the maximum length for a cable segment.


    +   When evaluating cable for a network installation, IT people must also consider
    whether the environment calls for STP, cables that are shielded against outside
    interference, or plenum-rated cables, which have a sheath that does not outgas
    fumes when it burns.


    +   Network troubleshooters often encounter cabling faults, such as opens, shorts,
    and reversed transmit and receive wires on copper networks, and dirty optical
    cables, deceit faults, and incorrect transceivers on fiber-optic networks.'
  merge: -1
