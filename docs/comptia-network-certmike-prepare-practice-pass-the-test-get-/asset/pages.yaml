    | --- | --- | --- | --- | --- |

    | 10BASE-T IEEE 802.3i | 10 MHz | CAT 5 or higher | 100 meters | Ethernet |

    | 10BASE-TX IEEE 802.3u | 10/100 MHz | CAT 5 or higher | 100 meters | Fast Ethernet
    |

    | 1000BASE-T IEEE 802.3ab | 10/100/1000 MHz | CAT 5 or higher | 100 meters | Gigabit
    Ethernet |'
