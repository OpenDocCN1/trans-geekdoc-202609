    # Nslookup/Dig


    Nslookup is a Domain Name System (DNS) tool, found on both Windows and Unix/Linux
    platforms, that allow users to resolve hostnames and domain names into addresses,
    both from the command line and interactively. By default, entering nslookup www.contoso.com'
