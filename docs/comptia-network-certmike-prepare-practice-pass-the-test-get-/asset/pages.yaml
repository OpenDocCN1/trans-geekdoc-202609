  md: '# Network Architecture


    # Objective 1.7: Explain basic corporate and datacenter network architecture.


    This chapter examines some of the elements of data center architecture and design,
    as well as the storage area networking technology available for use in data centers.
    The Network+ exam expects candidates to be familiar with these topics and their
    basic functions.


    In this chapter, you''ll learn everything you need to know about Network+ 1.7,
    including the following topics:


    +   - Three-tiered

    - Software-defined networking

    - Spine and leaf

    - Traffic flows

    - Branch office vs. on-premises data center vs. colocation

    - Storage area networks


    # THREE-TIERED ARCHITECTURE


    A data center is a facility that houses a collection of servers and the switches,
    routers, and other equipment needed to connect those servers to the resources
    they need, to'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'each other, and to the users who must access them. Data centers can range in
    size from a dedicated room in a company office building to gigantic underground
    complexes with armed guards and vault doors. Whatever its size, however, a data
    center needs certain characteristics to function efficiently, including environmental
    controls, a stable power source, and most important, a carefully designed internal
    architecture that implements all of the necessary equipment connections in a manner
    that is organized, understandable, and easily serviceable.


    # EXAM TIP


    The Network+ objectives spell "datacenter" as one word, as do many other documents
    and publications. However, this is not a universal rule, and there are plenty
    of resources that use two words, including this book. Exam candidates should remain
    conscious of this when searching for the term as they research these topics.


    The traditional data center architecture for a medium- to large-sized organization
    calls for the servers, switches, and routers to be deployed in three logical layers,
    as shown in Figure 7.1.


    The three tiers or layers are as follows.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_111_0.png)


    FIGURE 7.1 Three-tiered data center architecture with two access layer pods


    # Core


    The core tier is the figurative backbone of the enterprise; all of the network''s
    data passes through the switches and routers at the core layer, so they may be
    the fastest the company can afford. High-speed routers and multilayer switches
    are common at the core tier. This is also where the wide area network (WAN) connections
    to branch offices and'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Three-Tiered Architecture


    service providers enter the enterprise. Other technologies found at the core are
    typically those that can enhance the speed of the backbone processing and provide
    fault tolerance. Hardware redundancy is common at the core tier to ensure that
    electric power, processing power, and the necessary device interconnections are
    always maintained.


    # Distribution/Aggregation Layer


    The distribution or aggregation layer functions as a buffer between the core and
    access switches, with switches that provide intersections with all of the access
    layer switches. The distribution layer switches are all connected to each other
    so that if one fails, the others can take up the slack. These switches also have
    redundant connections to the access layer switches, with each access switch linked
    to at least two distribution switches. In some cases, the access layer switches
    are collected into groups pools, along with their designated distribution switches.


    The core scares interconnectivity for pure packet forwarding speed. The distribution
    layer provides interconnectivity by connecting the access layer needs. Smaller
    networks combine the core and distribution layers into one, creating a two-tiered
    model called a collapsed architecture. The distribution layer is also services
    such as packet filtering, intrusion prevention, load balancing, and VLAN routing
    often. The switches at the distribution layer tend to be multilayer switches,
    with the connections to the access layer running on layer 2 and the high-speed
    core connections on layer 3.


    # Access/Edge


    The access or edge tier is the location of the switches which servers, workstations,
    printers, wireless access points, network-attached storage (NAS) arrays, and other
    end-user devices connect. These are typically layer 2 switches, less elaborate
    than those at the other tiers to keep the end-user cost-per-port relatively low,
    but often with higher-speed uplink ports for the connections to the distribution
    layer switches.


    Physically, data centers typically consist of rack-mounted devices. One common
    design calls for each rack to have one or more switches in it, to which the devices
    in that rack are connected. This is called top-of-rack switching, and it tends
    to create a better organized data center layout while minimizing cable lengths.


    > EXAM TIP Network+ exam objectives provide alternative names for the distribution
    and access tiers, but all three are often referenced using other names. The core
    tier might also be called a backbone, the distribution/aggregation tier the workgroup
    layer, and the access tier is sometimes referred to as the workstation or desktop
    layer, in addition to to the edge tier. Candidates for the exam should be careful
    to acknowledge all of these terms when researching this topic.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 7 • Network Architecture


    # SOFTWARE-DEFINED NETWORKING


    The three-tiered architecture was created at a time when all of the devices in
    the data center were physical ones. Each physical server had one role, and each
    physical switch and router had to be managed individually. Today, virtualization
    and software-defined networking (SDN) have revolutionized the look, the organization,
    and the operation of the enterprise data center. A single physical server running
    a hypervisor can host many virtual servers, and SDN can centralize the management
    of the switches and routers.


    Switches and routers traditionally had a management interface in the form of character-based
    terminal. If there were any changes to be made to the overall switching and routing
    fabric of the network, it was necessary for administrators to reconfigure each
    device individually. Software-defined networking is an architecture for abstracting
    or decoupling the control and management functions of network devices from the
    hardware. This enables administrators to configure the network''s switches and
    routers from a central management console at a remote location.


    The SDN architecture consists of the following layers:


    # Application


    The application layer is where devices such as firewalls, load balancers, and
    proxy servers are located, as well as many other network management, configuration,
    monitoring, and diagnostic functions. Whereas at one time, the network would use
    a separate physical device for each of these functions, in SDN they are realized
    as software, in the form of applications or APIs.


    # Northbound Interface


    The control layer communicates with the application layer through the northbound
    interface (NBI), which is an API that allows application layer components to use
    the SDN controller to manage infrastructure layer devices.


    # Control


    The control layer—sometimes called the control plane and/or the management plane—is
    the location of the SDN controller, the central console for all of the SDN elements,
    both logical and physical. As the intermediary between the application and infrastructure
    layers, the SDN controller accepts instructions from the application layer and
    converts them into commands recognized by the hardware in the infrastructure layer.


    # Southbound Interface


    The control layer communicates with the devices at the infrastructure layer through
    the southbound interface (SBI), an API that provides the SDN controller with access
    to the infrastructure hardware.


    # Infrastructure


    The infrastructure layer—sometimes called the forwarding plane and the data plane—is
    where all of the physical hardware is located. These are the devices managed by
    the SDN controller. Also at this layer are the agents and other software-components
    that monitor and report on the condition of the network to the SDN controller.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# EXAM TIP


    RFC 7426, the standard defining the SDN architecture, divides the model into five
    planes, groups of related functions and resources, as follows: forwarding, operational,
    control, management, and application. Some sources use the terms layer and plane
    interchangeably, whereas others discern carefully. The Network+ exam objectives
    refer to the SDN architecture in layers, except for the inclusion of the term
    management plane. The SDN standard distinguishes between the control plane, which
    determines how packets should be forwarded by the infrastructure devices, and
    the management plane, which is responsible for configuring and monitoring these
    devices. Exam candidates should be familiar with the various terms used to describe
    the SDN architecture.


    # SPINE AND LEAF ARCHITECTURE


    The use of virtualization and SDN in many data centers has led to a revision of
    the classic three-tiered architectural model. One of the most common architectures
    used in data centers today use a two-tiered model with a mesh topology called
    spine and leaf, as shown in Figure 7.2. In this model, the top tier—or spine—is
    literally the backbone of the network, with high-speed switches, the only function
    of which is to forward data between leaf switches.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_114_0.png)


    FIGURE 7.2 Two-tiered spine and leaf data center architecture


    It is the leaf switches, in the bottom tier, to which the servers are connected,
    although they also have higher-speed layer 3 connections to the spine switches.
    In many implementations, the leaf switches use the same type of top-of-rack switching
    as the access layer switches in the three-tiered architecture, with a SDN providing
    the control plane for all of the spine and leaf switches.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'The spine and leaf architecture calls for a type of mesh topology, in which
    each spine switch is connected to every leaf switch. However, the spine switches
    are not directly connected to each other, nor are the leaf switches connected
    to each other. This means every leaf switch must go through the spine to connect
    to another leaf switch, which is always two hops away from it.


    Because of this topology, the spine fabric is extremely fast, and the traffic
    patterns are entirely predictable, which makes the Spanning Tree Protocol (STP)
    network''s inherent latency predictable. The leaf switches are connected to all
    of the spine switches, so they can choose the link with the best conditions for
    transmission.


    Finally, the spine and leaf model is easily scalable, even to the point of creating
    massively scalable data centers (MSDCs). In truly large implementations, servers
    can be grouped into pods, the only limitation for which is the number of ports
    in each leaf switch.


    # TRAFFIC FLOWS


    One of the reasons for the evolution from the three-tiered architecture to the
    spine and leaf model is the alteration in the way typically flows in a data center.
    Traffic that flows into or out of a data center is often referred to as north-south.
    Southbound traffic is entering the data center and northbound traffic is leaving
    the data center. Traffic between devices within the data center is characterized
    as east-west.


    The terms east-west and north-south, in this context, do not reference specific
    compass directions. They refer to the directional lines typically used in network
    diagrams to indicate traffic flow, with horizontal lines representing traffic
    to the data center and vertical lines representing traffic entering and leaving
    the data center.


    The increasingly prevalent use of virtualization and distributed application design
    in the data center has resulted in a general increase in east-west traffic compared
    to north-south traffic. The low latency of the spine and leaf model makes it preferable
    in this situation, as the three-tiered module does not handle east-west traffic
    as efficiently.


    # DATA CENTER LOCATIONS


    Part of the process of designing and implementing a data center is deciding where
    it is going to be located. The traditional approach is to build a data center
    on company property, preferably near the users who will be accessing it. An on-premises
    data center puts everything under the company''s direct control, which is a benefit,
    but it also incurs a lot of additional costs, both in terms of initial outlay
    and ongoing expenses.


    In addition to the network equipment itself, a data center requires a stable power
    source, special environmental systems, physical security measures, and a staff
    with the technical'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Storage Area Networking


    expertise to keep it all running. In addition, there is the question of fault
    tolerance. For many companies, at least one redundant data center—preferably at
    a remote location—is a necessity, to keep the network running and the company
    available in the event of a disaster.


    Another option is *colocation*, where an organization leases data center space
    from a third-party company that is responsible for the entire data center environment,
    including power, cooling, security, and fault tolerance. In many cases, these
    providers maintain large-purpose data centers that can outperform an on-premises
    data center retrofitted into an existing office building in many ways. Colocation
    providers can typically provide several levels of service. A client might just
    want to lease rack space for their own equipment in the provider''s data center,
    or they might want to lease an entire data center for their use. The provider
    might also be able to supply services, such as onsite maintenance and technical
    support. Here again, the organization is dependent on WAN links for access to
    their data but service contracts nearly always a service-level agreement that
    guarantees a performance of uptime.


    Another issue is the question of whether an organization''s branch offices should
    have their own data centers or just access the headquarters remotely. This is
    largely dependent on the size and computing requirements of the branch offices.
    A small branch office might not be worth the expense of constructing its own data
    center. There is also the question of whether the company—or even needs—full-time
    IT staff at each branch office. Remote access by a wide area network (WAN) links
    the branch offices fully dependent on the wide area network to the home office.


    # STORAGE AREA NETWORKING


    Data storage is, of course, one of the primary functions of a business network,
    and applications have constantly increasing demands for more storage space, new
    technologies for expanding the storage capacity of a network were developed. One
    of these technologies is the storage area network (SAN), which is a means by which
    servers can access storage devices directly through the network.


    # Fibre Channel


    In its original conception, a SAN is a completely separate local network to which
    servers and storage devices are attached. The server accesses the storage at block
    level, just as the drives were installed in the server itself. The SAN originally
    ran a protocol called Fibre Channel (FC) and typically used a dedicated Fibre
    Channel switch (or sometimes two, for fault tolerance), to the storage devices
    and servers are connected. FC is a serial protocol, in comparison to the parallel
    protocols commonly used for storage technologies, such as Small Computer Systems
    Interface (SCSI). In its current version, FC can support transmission rates of
    up to 128 gigabits per second (Gbps).'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Chapter 7 • Network Architecture


    # EXAM TIP


    Fibre Channel is not a typographical error. The technology uses the British English
    spelling of “fibre” to distinguish the term from “fiber optic.”


    Fibre Channel originally required the use of multimode fiber-optic cable, but
    it now includes physical layer specifications supporting both copper and fiber-optic
    media. However, the FC technology is completely compatible with LAN protocols,
    such as Ethernet and IP, and does not conform to the layers of the OSI reference
    model; it has its own five-layer model instead. This is why the original SAN required
    a completely separate network, and servers required separate Fibre Channel hosts
    to connect to it, in addition to their SAN adapters.


    # Fibre Channel over Ethernet


    Fibre Channel is an efficient high-speed networking protocol, and the creation
    of a separate network for storage high latency cost, but the cost of building
    a SAN with nonstandard hardware was prohibitive to many potential users. Eventually,
    a variant of the protocol called Fibre Channel over Ethernet (FCoE) appeared,
    which encapsulates FC traffic within Ethernet frames and can coexist with Ethernet
    traffic on the same cable. FCoE uses a host bus adapter with dual functionality;
    it is an FC adapter and a standard Ethernet LAN adapter in one device. The FC
    side of the adapter encapsulates the traffic (which is not routable) in Ethernet
    frames; no IP is needed.


    # iSCSI


    For years, Small Computer Systems Interface (SCSI) has been the protocol that
    storage devices use to communicate. SCSI commands implement the standard functions
    that storage devices use to read, write, and manipulate data. Fibre Channel is
    just a vehicle for carrying those SCSI commands to the storage devices on the
    network.


    The next step in the evolution of SAN technology was an implementation that did
    not require any special hardware. Internet Small Computer Systems Interface (iSCSI)
    is just another means of transmitting SCSI commands over the network to the storage
    devices. However, in a difference from FCoE, iSCSI encapsulates traffic in IP
    datagrams and transmits them over the LAN to the adapters. Also in an iSCSI implementation,
    all of the hardware is attached to one Ethernet network segment, and the iSCSI
    traffic is intermingled with all of the other IP traffic on the LAN.


    These protocols combine SAN and LAN traffic on the same network cannot hope to
    achieve the same level of performance as a dedicated storage area network, but
    with high-speed Ethernet hardware and Ethernet’s support for jumbo frames up to
    9,000 bytes, performance levels can be adequate.'
  merge: -1
  img_proc: true
