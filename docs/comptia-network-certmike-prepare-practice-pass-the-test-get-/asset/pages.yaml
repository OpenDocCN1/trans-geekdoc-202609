  md: '# Cable Management 35


    administrators to insert transceiver transceiver for any network type and medium.
    This is particularly useful for fiber-optic networks because the media and connector
    choices are varied. Since the introduction of the SFP slot, the transceiver technology
    has advanced through several iterations, with accompanying increases in speed,
    as shown in Table 3.3.


    # TABLE 3.3 SFP transceiver technologies


    | Name | Date | Speed | Channels |

    | --- | --- | --- | --- |

    | Small form-factor pluggable (SFP) | 2001 | 100 Mbps | 1 |

    | Enhanced form-factor pluggable (SFP+) | 2009 | 10 Gbps | 1 |

    | Quad small form-factor pluggable (QSFP) | 2006 | 4 Gbps | 4 |

    | Enhanced quad small form-factor pluggable (QSFP+) | 2012 | 40 Gbps | 4 |


    > EXAM TIP There are many other transceiver designations representing subsequent
    increases in transmission speed for technology, such as QSFP28 and QSFP56, but
    the Network+ exam objectives only specify the four in Table 3.3.


    There is a different type of external transceiver—called a media converter or
    sometimes a coupler—that exists to connect network segments that use different
    media. The most common situation requiring a media converter is the need to connect
    an Ethernet UTP segment to a fiber-optic segment or single-mode fiber to multimode.
    A media converter can be a box with two network interfaces, or it could be a small
    connector barely larger than the cables themselves.


    # CABLE MANAGEMENT


    A network installation can have hundreds of internal cable runs, leading to a
    data center. To terminate those cable runs in the data center, it is common practice
    to use patch panels. A patch panel (or patch bay) is a physical layer device,
    mounted on the wall or in a rack, with rows of female RJ45 (or other) connectors
    on the front. The cable runs leading to the walls all over the site meet at the
    patch panel, where administrators punch them down into the backs of the connectors.


    Many cable installations use bulk cable types to provide service to distant locations,
    such as UTP cables containing 25 or more wires in a single sheath. To make'
