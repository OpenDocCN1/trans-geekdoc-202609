    # DHCP Scope Exhaustion


    Dynamic Host Configuration Protocol (DHCP) servers allocate IP addresses to clients
    from a pool of addresses called a scope. A scope has a limited number of addresses,
    and when the DHCP server allocates all of them, it cannot register new clients
    until the current lease expires. Attempts by DHCP clients to obtain an address
    from a server with an exhausted scope fail, and the clients will configure themselves
    with a local address that does not provide the correct network.

    In Windows, the self-configuration process is Automatic Private IP Addressing
    (APIPA). APIPA generates addresses on the 169.254.0.0 network with a subnet mask
    of 255.255.0.0 and no default gateway address. When a troubleshooter finds a host
    with these addresses on a DHCP network, this is a sure indication that something
    is wrong with the DHCP process, as scope exhaustion.


    # IP Settings Issues


    Every interface on a TCP/IP network has IP configuration settings that must be
    correct for the device to communicate with the network. Depending on how the devices
    obtain their settings, the chances of incorrect settings occurring vary. On most
    enterprise networks, devices obtain their IP settings from a DHCP server. If a
    host has misconfigured IP settings,'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Common Issues 307


    it is either due to someone manually changing the settings on the host or a misconfiguration
    of the DHCP server.


    If the DHCP server is supplying incorrect settings, then the whole network should
    be affected, and the troubleshooter should start looking at the DHCP server itself.
    For an individual host that has misconfigured settings, whether by accident or
    through tampering, the troubleshooting effort should be directed at the host IP
    settings:


    Let''s look at four common issues related to IP settings:


    **Incorrect Gateway** TCP/IP parlance, a gateway is a router, and the default
    gateway in an interface TCP/IP configuration is the router that provides access
    to other networks. When the default gateway is missing or incorrect, the host
    will be able to access the local network, but not any other networks, including
    the Internet.


    **Incorrect Subnet Mask** As noted in Chapter 4, "IP Addressing," the subnet mask
    associated with an IP address specifies which bits of the address are network
    bits and which are host bits. If the subnet mask value is incorrect, the host
    will not be able to connect because it will be looking for a different network,
    which does not exist.


    **Incorrect IP Address** On a manually configured client, an incorrect IP address
    could duplicate that of another host on the network, which would generate an error
    message. It is more likely, that the incorrect address would be on a different
    network, which would prevent the host from connecting to the current network.


    **Incorrect DNS Configuration** TCP/IP networks use addresses, not names, to identify
    on a network. The names are for humans. The Domain Name System (DNS) enables a
    host to resolve the names specified by users into the IP addresses used by computers.
    If the DNS server in the IP settings is incorrect or missing, then name resolution
    cannot occur, and the host cannot communicate with the network.


    # Missing Route


    In network communications, a missing route means that one of the routers between
    the source and the destination does not have a routing table specifying where
    to forward the sending system''s packets. Therefore, the path ends at that router,
    the packets go no further, and the traceroute(cmd) command might indicate where
    the path ends, especially if it is on the internal network. A troubleshooter might
    have to manually add a route to that problem router''s table or investigate the
    state of the routing protocols, the network is using. If the missing route is
    somewhere on the Internet, there is little the troubleshooter can except report
    it to the Internet service provider.


    # Low Optical Link Budget


    On a fiber-optic network, the optical link budget is the relationship between
    the strength of sending light source and the minimum signal strength needed at
    the destination. If the difference between these two values is small, then installers
    should make every effort to'
