  md: '# CABLE TYPES


    Wireless local area networking is enormously popular today, especially in residential
    installations, but c LANs are still an essential element of business networking.
    There are two basic types of cable used in data networking: copper and fiber-optic,
    as discussed in this section.


    # Copper Cables


    The original local area networking standards called for cables with copper conductors
    that carry signals in the form of electrical voltages. Copper cables are still
    the most common network medium in use today, largely because they are relatively
    inexpensive and easy to install. The first Ethernet LANs used coaxial cable, but
    today the most popular cable type for networking is twisted pair.


    # Coaxial Cable


    In a coaxial cable, the conductor carrying the signals to the center of the cable.
    There is insulation around the core, then a layer of braided metal that shields
    the core and functions as a ground. A sheath around the layers protects the whole
    assembly from damage. The construction of the cable and the shielding around the
    core make coaxial cable resistant to electromagnetic interference (EMI).

    Coaxial cables are almost never used for LANs anymore, although some legacy installations
    still exist. The Institute of Electrical and Electronics Engineers (IEEE) 802.3
    standards that define the 10Base5 and 10Base2 coaxial specifications since 2011.
    However, coaxial cable is still used widely for television installations. Table
    3.1 lists the main coaxial cable types and their properties, using their Radio
    Guide (RG) designations.


    # TABLE 3.1 Coaxial cable types


    | Cable type | Diameter | Impedance | Notes |

    |---|---|---|---||\| RG-8 | 9.5 mm | 50 ohms | 10Base5 | Thick Ethernet/Thicknet
    |

    | RG-58 | 4.95 mm | 50 ohms | 10Base2 | Thin Ethernet/Thinnet |

    | RG-59 | 6.15 mm | 75 ohms | Video/cable TV | Shorter distances, Less expensive
    |

    | RG-6 | 6.9 mm | 75 ohms | Video/cable TV | Longer distances |'
