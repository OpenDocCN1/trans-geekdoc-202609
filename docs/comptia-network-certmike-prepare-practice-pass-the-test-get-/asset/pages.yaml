- pgno: 39
  md: '# Chapter 1 • OSI Model


    link layer also dictates the network medium options that are available at the
    physical layer. For more information on Ethernet variants and their supported
    cable types, see Chapter 3. The functions that data link layer protocols typically
    perform the following:


    **Frame Format** The data link layer protocol packages the data passed down from
    the network layer in a protocol data unit called a frame. A *frame* consists of
    a header and a footer generated by the data link protocol, with the network layer
    data as the payload loaded in.


    **Addressing** Every network interface adapter has a unique 6-byte identifier
    assigned to it by the manufacturer called a *media access control (MAC) address*.
    Data link layer use these addresses in their headers to identify the sender and
    recipient of each packet.


    **Protocol Identification** Data link layer headers include a code that indicates
    which network layer protocol generated the data in each packet. This enables the
    data layer protocol on the receiving system to pass incoming traffic to the correct
    network layer process.


    **Error Detection** The frame footer contains the result of a cyclic redundancy
    check (CRC) calculation performed on the frame data payload by the sending system.
    The receiving system performs the same calculation, and if the results do not
    match, disc the packet.


    **Media Access Control (MAC)** When a LAN has devices connected to a shared network
    medium, the data link layer uses a media access mechanism to prevent two devices
    from transmitting simultaneously and causing a data collision.


    **Physical Layer Specifications** The data link layer protocol also includes specifications
    for the physical layer options decoupled with the protocol.


    Most called LANs run the Ethernet protocol at the data link layer, the actual
    name for which is IEEE 802.3, after the standards published by the Institute of
    Electrical and Electronics Engineers. The functions just listed are all implemented
    as part of the Ethernet frame.


    # Layer 3: The Network Layer


    The protocols running at the physical and data link layers of the OSI model are
    dedicated to local network communications only. For example, Ethernet is capable
    of transmitting frames to another computer or router on the LAN; it is not concerned
    with the delivery of data to its final destination. That is the responsibility
    of the network layer protocol.


    Network layer devices routers connect individual networks together, forming an
    *internetwork*, or network of networks. A *router* is an intermediate system that
    only processes incoming packets as high as the network layer, as shown in Figure
    1.2.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Sender Router Receiver


    | Sender | | Receiver |

    | :--- | :---: | :--- |

    | Application | | Application |

    | Presentation | | Presentation |

    | Session | | Session |

    | Transport | | Transport |

    | Network | | Network |

    | Data-link | | Data-link |

    | Physical | | Physical |


    FIGURE 1.2 Network traffic processed by an intermediate router


    The functions of a network layer protocol are:


    **End-to-End Addressing** The network layer protocol header contains the addresses
    of both the sending system and its final destination. Data link layer MAC addresses
    change for each leg of an internet journey, but network layer addresses always
    reflect a packet''s starting point and its destination.


    **Routing** Routers are network layer devices that forward packets to other networks.
    Network layer protocols using routing tables to look up the addresses of other
    networks, or the router can forward packets to the correct destinations.


    **Fragmentation** Networks can have different frame size limits, based on their
    maximum transmission unit (MTU) values; if a single frame is too large to transmit
    over another network, the network layer protocol splits it into smaller fragments
    and transmits each fragment in a separate frame. The network layer protocol resembles
    the fragments when they reach their final destination.


    **Protocol Identification** Just as a data link protocol header contains a code
    to identify the network layer protocol that generated the data in the packet,
    the network layer protocol contains a code identifying the transport layer protocol
    that generated the data.


    On TCP/IP protocols, the primary protocol at the network layer is the Internet
    Protocol (IP). IP exists in two versions: IPv4, with a 32-bit address space, which
    is the standard Internet protocol at the network layer, and IPv6, which is a newer
    version with a 128-bit address space. IPv6 has not yet been widely adopted for
    public internet communications. For more information on the Internet Protocol,
    see Chapter 4, "IP Addressing."'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Chapter 1 • OSI Model


    IP functions are implemented in the header, where the protocol applies to the
    data it receives from the transport layer. This forms a unit called a *datagram*.


    # Layer 4: The Transport Layer


    The term *TCP/IP* refers to the two protocols operating at the transport and network
    layers. The protocols at these two layers function together to provide a unified
    quality of service. IP, as noted earlier, provide addressing and routing services.
    The protocols at the transport layer of the OSI model provide end-to-end communication
    services, such as guaranteed delivery and flow control, to the adjacent layers,
    as needed.


    # Connection-Oriented and Connectionless Protocols


    The OSI model recognizes two kinds of end-to-end protocol at the transport layer:


    **Connection-Oriented** A connection-oriented protocol always establishes a connection
    between the sending and receiving systems before it transmits any application
    data. The systems do this by exchanging messages (called a *handshake*) *TCP flags*
    to confirm that both systems are able to send and receive data. After the transmission,
    another handshake terminates the connection. A connection-oriented protocol''s
    larger header cause a significant increase in bandwidth overhead for this type
    of protocol. On most networks, the primary connection-oriented protocol at the
    transport layer is the *Transmission Control Protocol (TCP)*.


    **Connectionless** A connectionless protocol provides no additional services than
    the basic transmission of data, so there is no need for handshake messages and
    the header can be much smaller. This reduces the protocol''s bandwidth overhead
    significantly. On most networks the primary connectionless protocol at the transport
    layer is the *User Datagram Protocol (UDP)*. The Internet Protocol (IP) running
    on the network layer is also connectionless.


    # Transport Layer Functions


    The transport layer provides a variety of services for data transmissions. Most
    of the functions in the following list are provided by connection-oriented protocols
    such as TCP. Only the protocol identification function is required for all protocols
    at the transport layer.


    **Data Segmentation** A connection-oriented protocol accepts data from upper-layer
    application processes and splits it into segments of appropriate size for the
    network. Each segment is numbered so that they can be reassembled by the receiving
    system, even if they arrive out of order.


    **Packet Acknowledgment** Connection-oriented protocols provide a guaranteed delivery
    service. The receiving system generates messages to acknowledge the successful
    receipt of packets from the sender.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Flow Control A connection-oriented mechanism to regulate the speed at which
    a sending system transmits data. The responses returned to the sender by the receiving
    system specify the size of a sliding window—that is, a buffer that holds incoming
    data. When the sliding window gets smaller, the sending system reduces its retransmission
    speed to avoid overwhelming the receiver.


    **Signaled Error Correction** A signaled error is a packet that has been discarded
    by the network layer protocol due to a CRC failure. The network layer protocol
    cannot correct errors, so it signals the transport protocol to retransmit the
    lost packets.


    **Unsignaled Error Detection and Correction** The transport layer provides the
    only end-to-end error detection and correction mechanism for the entire packet.
    The transport layer protocol on the sending system performs a CRC calculation
    and includes the results in its header. The receiving system then performs the
    same calculation and compares the results. For any lost packets, the receiver
    alerts the packet acknowledgment value in its header, causing the sender to retransmit
    the unacknowledged packets.


    Port Identification Transport layer protocol always contains a code (called port)
    identifying the application layer protocol that generated or will receive the
    packet''s data.


    The transport layers are implemented in headers applied by each protocol. Because
    it is a connection-oriented protocol with many users, TCP has a large 20-byte
    header. UDP is connectionless and therefore only a comparatively small 8-byte
    header.


    # Layer 5: The Session Layer


    The boundary between the transport layer and the session layer marks an important
    change in the function of the protocol stack. All of the communications, both
    end-to-end and local, that are needed to transmit data from one system to another
    over a TCP/IP network are handled by the four layers of the OSI model. The session,
    presentation, and application layers assume the communication services are functional
    and that any messages they need to send or receive will be handled correctly.


    The three layers of the OSI model not have separate protocols to implement their
    functions in the TCP/IP suite. Instead, the session layer functions as something
    of a toolbox; the OSI model lists 22 functions performed at the session layer,
    but on a TCP/IP network, those functions are universally integrated into an application
    layer protocol. It is for this reason that session, presentation, and application
    layers are often referred collectively as the upper layers.


    The functions associated with the session layer are mostly concerned with the
    establishment, maintenance, and termination of communications during a connection
    between two systems, called a session. The maintenance of a session can be a complicated
    business requiring various session layer functions to initiate the dialog, maintain
    orderly communication, and then terminate it.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Two of the important functions used to manage a session include the following:


    +   - **Dialog control**: Specifies the mode in which the systems communicate.
    Simplex mode is when only one of the computers is transmitting. In half duplex,
    called two-way alternate (TWA) mode, the systems exchange a token, and only the
    computer with the token can transmit. In duplex, also called two-way simultaneous
    (TWS) mode, there is no token, and the computers can transmit any time.

    - **Dialog separation**: Calls for the creation of checkpoints in the data stream
    to separate functions.


    # Layer 6: The Presentation Layer


    As noted, each OSI model layer provides services to the layer above and requests
    services from the layer below. In the case of the presentation layer, its primary
    function is to pass-through services that enable application layer protocols to
    request session layer services. For each of the services at the session layer,
    there is a corresponding pass service at the presentation layer. This enables
    the upper layers to function as a single entity.


    The presentation layer also includes a syntax translation service that enables
    two end systems to communicate, despite their use of data compression, encryption,
    or different bit-encoding algorithms.


    # Layer 7: The Application Layer


    There are hundreds of application layer protocols, many more than any of the other
    layers. This is because there are so many applications that require a variety
    of highly specific networking services.


    # DATA ENCAPSULATION


    As outgoing data travels through the protocol stack to the network medium, it
    undergoes a process called data encapsulation, which is the functional equivalent
    of putting a letter into an envelope for mailing. When an application produces
    data that needs to be transmitted over the network, it generates a request for
    one of the application layer protocols. This protocol generates a message, properly
    formatted for the application, and passes it through the layers of the stack.
    The protocols at the lower layers then add their own data, as addresses and codes,
    to implement their functions.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'For example, when the application layer data reaches the transport layer, the
    layer generates a Transmission Control Protocol (TCP) or User Datagram Protocol
    (UDP) header and adds it to the data. The TCP header includes TCP flags that the
    protocol uses to establish a connection between the sending and receiving systems
    and break down the connection after the data transmission. The application layer
    request then becomes the payload in the transport layer protocol or datagram,
    as shown in Figure 1.3.


    The transport layer protocol then passes the data to the network layer, which
    adds its own Internet Protocol (IP) header. The maximum transmission unit (MTU)
    for the interface specifies the size of the largest IP datagram that can be transmitted
    over the network. Datagrams that are larger than the MTU are split into fragments
    for transmission. Finally, at the data link layer, all of the data from the layers
    become the payload in a data link layer frame. The data link protocol typically
    adds both an Ethernet header and a footer to the payload, resulting in a packet
    that is ready for transmission.


    For packets arriving at the destination system, the process occurs in reverse,
    with the data passed up through the OSI model layers, a process called decapsulation.
    Each layer processes the incoming packet by reading and stripping off the header
    and passing the payload to the correct protocol at the next layer.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_44_0.png)


    FIGURE 1.3 The data encapsulation process'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# CERTMIKE EXAM ESSENTIALS


    +   The OSI reference model divides the network communications process into seven
    layers. In order from the first layer to the seventh layer, these are the physical
    layer, the data link layer, the network layer, the transport layer, the session
    layer, the presentation layer, and the application layer. You can remember them
    using the mnemonic "Please Do Not Throw Sausage Pizza Away.",


    +   Data encapsulation is the process by which the data generated by an application
    is packaged for transmission over the network through the application of headers
    by the protocols at the transport, network, and data link layers. When packets
    arrive at their destination, a decapsulation process occurs in which the protocols
    at each layer strip off their respective headers and pass the payload data up
    to the next layer.'
  merge: -1
  img_proc: true
