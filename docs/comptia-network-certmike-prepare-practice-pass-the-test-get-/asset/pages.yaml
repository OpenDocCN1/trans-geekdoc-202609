    **FIGURE 8.1** Infrastructure layers for the cloud services models


    **Infrastructure as a Service (IaaS)** A third-party cloud provider supplies the
    consumer with access to a physical server running a hypervisor. The consumer can
    then create virtual machines (VMs) on the server, install operating systems and
    applications on them, and manage them as needed. In this service, the bulk of
