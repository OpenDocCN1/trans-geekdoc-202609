- pgno: 20
  md: '# INTRODUCTION


    If you''re preparing to take the Network+ exam, you might find yourself overwhelmed
    by information. This exam covers a very broad range of topics, and it is possible
    to spend weeks studying each one of them. Fortunately, that’s not necessary!


    As part of the CertMike Prep Test series, this book is designed to help you focus
    on the specific knowledge you’ll need to pass the exam. CompTIA publishes a detailed
    list of exam objectives, and this book is organized around those objectives. Each
    chapter clearly states the objective that it covers and then details the material
    you need to know about that objective.


    You’ll find two important things at the end of each chapter: Exam Essentials will
    distill the major points from the chapter into a few bullets. Reviewing the Exam
    Essentials is a great way to prepare yourself before the exam. We’ve also recorded
    a free audio version of the Exam Essentials that you’ll find on the book''s website
    at www.wiley.com/go/syetextprep. You’re great learning when you’re in the car,
    at the gym, or mowing the lawn!


    Each chapter includes two Practice Questions that are designed to give you a sense
    of what it’s like to take the exam. You’ll find that they’re written in the same
    style as the Network+ exam questions and have detailed explanations to help you
    understand the correct answer. Be sure to take your time and thoroughly read these
    questions.


    Finally, the book’s website includes a full-length practice exam that you can
    use to assess your knowledge when you’re ready to take the test. Good luck on
    the Network+ exam!


    > NOTE

    Don’t just study the questions and answers! The questions on the actual exam will
    be different from the Practice Questions included in this book. The exam is designed
    to test your knowledge of a concept or objective, so use this book to learn the
    objectives before the questions.


    # THE NETWORK+ CERTIFICATION


    Network+ is designed to be a vendor-neutral certification for those seeking to
    demonstrate their networking expertise. CompTIA recommends this certification
    for individuals who want to develop careers in IT infrastructure, specifically
    in the areas of trouble-shooting, configuring, and managing networks. Common job
    roles held by Network+ certified individuals include the following:


    +   - Junior network administrator

    - Network engineer

    - NOC technician'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction


    +   - Cable technician

    - Data center support technician

    - System administrator

    - Telecommunications technician


    The exam covers five major domains of knowledge:


    +   1. Networking Fundamentals

    2. Network Implementations

    3. Network Operations

    4. Network Security

    5. Network Troubleshooting


    These areas include a range of topics, from securing networks to configuring subnets,
    while focusing heavily on the core knowledge expected of all networking professionals.

    The Network+ exam uses a combination of standard multiple-choice questions and
    performance-based questions that require you to manipulate objects on the screen.
    This exam is designed to be straightforward and not to trick you. If you know
    the material in this book, you will pass the exam.


    The exam costs $348 in the United States, with roughly equivalent prices in other
    locations around the globe. You can find more about the Network+ exam and how
    to take it at www.comptia.org/certifications/network#examdetails


    You''ll have 90 minutes to take the exam and will be asked up to 90 questions
    during that time period. Your exam will be scored on a scale ranging from 100
    to 900, with a passing score of 720.


    > NOTE

    CompTIA frequently does what is called item seeding, is the practice of including
    unscored questions on exams. It does so to gather psychometric data, which is
    then used when developing new versions of the exam. Before you take the exam,
    you will be told that your exam may include these unanswered questions. So, if
    you come across a question that does not appear to map to any of the exam objectives—or
    for that matter, does not appear to belong to the exam—it is likely a seeded question.
    You never know whether or not a question is seeded, so always make your best effort
    to answer every question.


    # Taking the Exam


    Once you are fully prepared to take the exam, you can visit the CompTIA website
    to purchase your exam voucher:

    https://store.comptia.org

    Currently, CompTIA offers two options for taking the exam: an in-person exam at
    a testing center and an at-home exam that you take on your own computer.'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Introduction\n\n> TIP\nThis book includes a coupon that you may use to save\
    \ 10 percent on your CompTIA exam registration.\n\n# In-Person Exams\n\nCompTIA\
    \ partners with Pearson VUE's testing centers, so your next step will be to locate\
    \ a testing center near you. In the United States, you can do this based on your\
    \ address or your zip code, while non-U.S. testers may find it easier to enter\
    \ their city and country. You can search for a test center near you at the Pearson\
    \ VUE website, where you will need to navigate to \"Find a test center\".\n\n\
    ```\nwww.pearsonvue.com/comptia\n```\n\nNow that you know how you would like to\
    \ take the exam, simply set up a Pearson VUE testing account and schedule an exam.\n\
    \ the day of the test, bring two forms of identification, and be to show up plenty\
    \ of time before the exam starts. Remember that you will not be able to take your\
    \ notes, electronic devices (including smartphones and watches), or other materials\
    \ with you.\n\n# At-Home Exams\n\nCompTIA began offering online exam proctoring\
    \ in 2020 in response to the coronavirus pandemic. With this, the at-home testing\
    \ option was still available and likely to continue.Candidates using this approach\
    \ will take the exam at their home or be proctored by a remote proctor.\n\nDue\
    \ to the rapidly changing nature of the at-home testing experience, candidates\
    \ wishing to pursue this option should check the CompTIA website for the latest\
    \ details.\n\n# After the Exam\n\nOnce you have taken the exam, you will be notified\
    \ of your score immediately, so you'll know if you passed the test right away.\
    \ You should keep track of your score report with your exam registration records\
    \ and the address you used to register for the exam.\n\nAfter you earn the Network+\
    \ certification, you're required to renew your certification every three years\
    \ by earning an advanced certification, completing a CertMaster continuing education\
    \ program, or earning 20 continuing education units over a three-year period.\n\
    \nMany people who earn the Network+ credential use it as a stepping stone to earning\
    \ other certifications in areas of interest. Those interested in end-user support\
    \ work toward the A+ credential, data analytics professionals might go on to earn\
    \ the Data+ certification, and the Security+ program is a gateway to a career\
    \ in cybersecurity."
  merge: -1
  img_proc: true
