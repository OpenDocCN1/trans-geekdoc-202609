- pgno: 67
  md: '# Chapter 3 · Cables and Connectors


    the wire connections for these cables, it is a common practice to use a punchdown
    block that has connection points for all of the wires in one place.


    Telephone service installations historically used a type of punchdown block called
    a 66 block, which has rows of clips to which the individual wire pairs are connected.
    The 66 block is old technology that is still found in some telephone installations
    and was sometimes used for faster 10BaseT Ethernet connections running at 10 Mbps,
    but it is not suitable for faster data networks.


    The 110 block is a more modern version of a patch panel that is used for both
    telephone and data networking installations. Typically certified for use with
    UTP cable categories, up to CAT 6, 110 blocks can support the higher speeds of
    today’s networks.


    There are other types of punchdown blocks in use, such as the Krone block, which
    is popular in Europe. It is functionally similar to a 110 block, but requires
    a special punchdown tool to fit its slightly larger connectors. The Building Industry
    Cross-connect (BIX) block also has been in use since the 1970s, and it now supports
    CAT 5e and 6. The BIX block also requires a proprietary punchdown tool.


    As with UTP, some fiber-optic installations use cables up to 24 fiber strands
    in a single sheath. To terminate these strands, a fiber distribution panel accepts
    the cable and allows administrators to splice each separate optical filament to
    a standard fiber-optic connector on the front of the box.


    # ETHERNET STANDARDS


    The latest Network+ exam objectives cover only the Ethernet specifications that
    are currently in general use. There are many other designations in the IEEE 802.3
    standards, some obsolete and others that gained popularity. Table 3.4 lists the
    Ethernet specifications for copper-based UTP and STP layers.


