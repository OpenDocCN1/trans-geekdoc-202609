- pgno: 248
  md: '# Network Hardening

    Objective 4.3: Given a scenario, apply network hardening techniques.


    This chapter examines some of the network hardening techniques that administrators
    frequently implement on a typical enterprise network. The Network+ exam expects
    candidates to be familiar with these basic security threats.


    In this chapter, you''ll learn everything you need to know about Network+ Objective
    4.3, including the following topics:


    +   * Best practices

    * Wireless security

    * IoT access considerations


    # BEST PRACTICES


    In a security context, network hardening refers to settings or practices that
    increase the security of the network in specific ways. There are many hardening
    techniques that administrators use to add protection to various elements of the
    network. Some of them are so basic that they should be automatic, as changing
    default passwords, whereas others require more consideration and planning. The
    following sections describe some of the best practices in network hardening—that
    is, the techniques that are most commonly employed by enterprise network administrators.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Secure SNMP


    The Simple Network Management Protocol (SNMP), as described in Chapter 13, "Network
    Availability," consists of a central console that communicates with agents scattered
    over the network. The agents send status information to the console, and the console
    sends configuration changes to the agents. Unless SNMP version 3, there was no
    security at all for the console/agent communications. Anyone who discovers the
    community name for SNMP version 1 or 2 can GET or SET commands to a network device
    and retrieve its information or reconfigure its settings.


    SNMP version 1 and 2 servers operate in read-only or read/write mode. It is common
    for read-only users to use the default community name public and read/write writers
    use the private name. If it is not possible to upgrade to SNMP version 3, administrators
    should at least change the default community names.


    SNMP version 3 improves the protocol''s security by adding support for authentication,
    encryption, and message integrity. Even SNMP version 3 is not secure enough—it
    is far more secure than the earlier versions.


    # Router Advertisement (RA) Guard


    Router Advertisement (RA) messages are generated by the Neighbor Discovery Protocol
    (NDP) on IPv6 networks to advertise network prefixes. IPv6 hosts, even if they
    have the prefix for their network, can generate their own IPv6 addresses. However,
    the RA messages are subject to spoofing, enabling an intruder to divert traffic
    and capture it for inspection.

    Router Advertisement (RA) Guard is a feature built into some switches that allows
    an administrator to specify which ports are allowed to transmit RA messages. By
    denying the ports connected to routers and other switches on the network as RA
    ports, they can perform router advertisements in the normal manner. All of the
    other ports—presumably including the ones which potential intruders are connected—are
    blocked from transmitting RA messages.


    # Port Security


    Port security is a feature found on managed switches that allows administrators
    to restrict the MAC addresses to individual switch ports. This is to prevent people
    from plugging unauthorized devices, such as hosts, wireless access points, or
    other switches, into a port that provides access to protected resources.


    Port security is implemented in different ways, depending on the manufacturer
    of the switch. One common technique is to restrict each of the ports to the sender''s
    MAC address in the first packet received through that port. Not only can no other
    MAC address connect to that port, but the administrator can prevent multiple addresses
    from connecting, if an intruder plugs another switch or access point into the
    port.


    # Dynamic ARP Inspection


    Dynamic ARP inspection (DAI) is a technique designed to prevent Address Resolution
    Protocol (ARP) spoofing. ARP spoofing is a type of attack in which an intruder
    generates'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'fraudulent messages that cause hosts to change the IP address-to-MAC address
    mappings in their ARP caches, a process known as ARP poisoning.

    DAI, implemented in switches, is a feature that reads the incoming ARP request
    messages and compares their IP-to-MAC addresses to the binding table created by
    the DHCP snooping process. The mappings in the binding table are presumed to be
    correct because they come from trusted DHCP servers. Any ARP mappings that do
    not agree with those in the binding table are presumed to be fraudulent, and the
    messages are discarded.


    # Control Plane Policing


    The control plane in a router or switch carries non-data traffic to and from other
    routers and switches; it is one of three control planes along with the data plane
    and the management plane. Control plane policing (CPP or CPP) is a rate limiting
    feature in some routers and switches that use quality of service (QoS) policies
    to prevent the control plane from being inundated with irrelevant traffic, such
    as that produced by denial-of-service (DoS) attacks.


    # Private VLANs


    Private VLAN is a microsegment within another VLAN, essentially a VLAN within
    a VLAN. Administrators create local area networks (VLANs) by applying a VLAN designation
    to a group of switchports on or more switches. When the administrator creates
    a private VLAN within an existing VLAN, the VLAN becomes the secondary to the
    existing VLAN primary.


    There are two types of private VLANs, as follows:


    +   - Isolated: Connected devices can communicate only with a router port, with
    each other.


    +   - Community: Connected devices can communicate with each other, as well as
    a router port.


    Private VLANs are a means of creating microsegments in which selected devices
    can be isolated with limited communication.


    # Disable Unneeded Switchports


    Unused switchports, especially those that are connected to wall plates in common
    areas, should be disabled at the switch. Many administrators omit this for the
    sake of convenience, but an open wall plate into which anyone can connect a host,
    switch, or access point is an invitation to attack.


    # Disable Unneeded Network Services


    Services and daemons provide benefits to users, but they are also open doors into
    the network. Any services that are not in use should be disabled, just as an unused
    door should be locked. On a TCP/IP network, services and daemons are associated'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'With TCP/IP ports. Intruders can easily detect ports that are open to incoming
    traffic using scanning software. Once detected, the ports become targets for the
    intruder''s exploitation.


    For necessary services, their TCP/IP ports must be left open, and it is up to
    administrators to protect them with firewalls and other means. However, for any
    ports that are left open by services or daemons not being used, administrators
    should take action by disabling the services and closing the port to any incoming
    traffic.


    # EXAM TIP


    The term port has multiple definitions in the IT universe. A TCP/IP port is a
    logical endpoint through which an application communicates with the network. Switches
    also have ports, which are physical cable connectors that provide links to hosts
    and other network devices. Candidates for the Network+ exam should be aware of
    the term''s uses.


    # Change Default Passwords


    Virtually all network devices require users or administrators to log on before
    they can access their administrative interface. While some devices require a user
    to create a password during the first connection, many have default usernames
    and passwords set by the manufacturer.


    In these cases, the first thing the administrator should do when setting up the
    device is change the default password for a device, and if possible, the username
    as well. If intruders know the default username for a device, they can begin to
    cracking the password immediately. If the administrator has changed the username,
    intruders will have to guess that as the password.


    # Password Complexity/Length


    When specifying a password for a device or an account, the objective is to make
    the process of guessing the password as long and difficult as possible. The longer
    the password is, the greater the number of possibilities there are for an attacker
    to guess and the longer it takes to crack it.


    As shown in Table 18.1, adding to the length of a password increases the number
    of possibilities dramatically, as adding basic symbols to the alphanumeric character
    set. Just increasing the password length by two characters, from eight to 10,
    increases the crack time from hours to months.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# TABLE 18.1 Effects of password length on possibilities and crack time


    | Number of characters | Letters & numbers | Letters, numbers, & basic symbols
    | Offline crack time (with symbols) |

    | 6 characters | 2.2 billion | 109 billion | 1.1 seconds |

    | 8 characters | 2.9 trillion | 521 trillion | 1.45 hours |

    | 10 characters | 3.7 quadrillion | 2.4 quintillion | 9.47 months |

    | 15 characters | 227 sextillion | 3.88 octillion | 1.2 billion years |


    All passwords are a trade-off between security and convenience, administrators
    should consider these figures when configuring passwords for network devices and
    creating password policies for the network''s users.


    # Enable DHCP Snooping


    DHCP snooping is a feature found on many switches that is designed to prevent
    rogue DHCP servers from connecting to the network and allocating incorrect IP
    addresses to clients. These incorrect IP addresses can prevent the clients from
    accessing the real enterprise network, sending them instead of an alternative
    network run by the attacker responsible for the rogue. By itself, this is a form
    of denial-of-service attack, but it can also be the opening salvo of an on-path
    (man-in-the-middle) attack.


    The DHCP snooping feature enables administrators to designate certain switch ports
    as trusted for DHCP server traffic. DHCP packets arriving at the switch from a
    untrusted port are silently discarded. The switch (snoops) the DHCP packets arriving
    through the trusted ports and uses the information to create a table of legitimate
    IP address-to-MAC mappings called a binding table.


    # Change Default VLAN


    By default, switches are equipped with a single VLAN—usually VLAN1—to which all
    of the switchports are assigned at the factory. The default VLAN is permanent
    and unchangeable, so potential attackers know it is there, where it presents a
    tempting target. Therefore, even if the administrators do not plan to segment
    the network using VLANs, they should create at least one new VLAN (hopefully not
    VLAN2) and move all of the switchports into it. Any attackers must then discover
    the VLAN before they can target it, which makes the target that much less tempting.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Patch and Firmware Management


    Operating systems, applications, and network devices all require software updates
    from time to time, but it is up to the administrators of the network to create
    a patch management policy that specifies when and if to apply the updates. The
    most critical types of updates for operating systems and applications are those
    that address the latest security issues.


    Attackers and software developers are involved in a never-ending arms race, and
    it is important to apply the developers''responses to the latest exploits. This
    is particularly true when a software manufacturer releases an emergency security
    update outside of their normal release schedule. Updates containing bug fixes
    are the next priority, followed by updates containing new features.


    Network device manufacturers release firmware updates, which modify the read-only
    software stored in a hardware device''svolatile memory, or driver updates, which
    modify the hardware''s interaction with the operating system. These are the types
    of updates that often cause hesitation among network administrators. Some administrators
    adhere to the "if it ain''t broke, don''t fix it"rule and wait until there is
    a compelling reason to apply an update.


    Some enterprises have a policy of testing updates in a sandbox environment before
    applying them to production devices. Products like Microsoft''s Windows Update
    Services (WSUS) enable administrators to download, evaluate, and test releases
    and then deploy them to the entire network at a selected time.


    # Access Control List


    Access control lists (ACLs) are systems of permissions that restrict access to
    network resources. Administrators can use ACLs to allow or deny access to a resource
    based on specific criteria. Operating systems and applications use ACLs to identify
    the users who can log on and access specific resources.


    In the network infrastructure, routers and firewalls use ACLs to filter the traffic
    entering and leaving a network by examining its IP addresses. Routers can use
    ACLs to create protected network segments within the enterprise. Firewalls use
    ACLs to restrict the traffic coming from the Internet and going out of it.


    # Role-Based Access


    Configuring access control lists for user accounts can be complicated and time-consuming
    when there are many permissions to assign for many different users. One method
    for streamlining the process is to create roles, which are combinations of permissions
    needed to perform specific jobs.Role-based allows administrators to configure
    a set of permissions once and assign them to multiple users.


    Many operating systems and applications include preconfigured roles. They are
    usually quite general, however, such as an operating system that offers only administrator
    and user roles. When network administrators create their own roles, they can customize
    them with greater granularity to accommodate specific jobs and users.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Firewall Rules


    A firewall is a barrier between two networks, either between two internal networks
    or between an internal network and the Internet. Administrators create firewall
    rules in the form of ACLs that specify what traffic is allowed to pass through
    the barrier and what traffic is denied to the network.


    The most common approach to configuring firewall rules is to allow permissions
    for the traffic that should be admitted to the network. After allow permissions,
    the administrator creates an implicit deny rule, which blocks all other traffic
    that has not been explicitly allowed by the previous rules.


    Another approach is to create a rule that allows all traffic into the network
    except that which has been blocked by explicit deny rules. For Internet, this
    is usually not a practical approach because it requires administrators to anticipate
    all possible attacks and create rules that block all of the traffic they attack
    at the network. For firewalls between internal networks, the explicit deny approach
    might be feasible.


    # WIRELESS SECURITY


    Hardening a wireless network requires different tools and procedures from wired
    networks. Some of the concepts used to secure wireless networks are described
    in this section.


    # MAC Filtering


    Just as the managed switches have a port security feature that limits network
    access to specific hosts, wireless access points (WAPs) can do the same thing.
    The mechanism used on devices is called MAC filtering. On a wireless network,
    MAC filtering is essentially a list of the client''s MAC addresses, maintained
    on the WAP, which specifies only the hosts that are permitted to connect to the
    network.


    The administration of MAC filtering can be time-consuming when there is a large
    number of clients. In some cases, administrators must discover the MAC addresses
    of the client devices and enter them into the WAP''s MAC address table manually.
    Any wireless clients that attempt to connect to the network must be listed in
    that table before they are permitted access. MAC addresses are also easily spoofed,
    which makes MAC filtering less valuable as a security measure.


    # Antenna Placement


    One of the security threats inherent in wireless networking is unauthorized persons
    connecting to the network, sometimes from outside the company premises. An intruder
    can sit in the parking lot with a laptop and receive enough of a network signal
    to establish a connection.


    One way to avoid this threat is for administrators to carefully consider the network''s
    antenna placement. The standard antennas on wireless access points are omnidirectional,
    so placing them too close to an outside wall can allow the signal to propagate
    outside'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'the building. Moving the antennas nearer to the center of the interior space
    can limit the strength of the signal that reaches outside. Another possibility
    is to use unidirectional antennas near the outer walls, such as patch antennas,
    which point their coverage to the interior space and limit the amount of signal
    that reaches the parking lot.


    # Power Levels


    Another way to prevent wireless signals from propagating outside of the premises
    is to move the access point or adjust its transmission power levels. Performing
    a site survey can tell administrators exactly where the signals are too inside
    the facility or excessively strong outside. Another way, available as a feature
    on some access points and wireless LAN controllers, is to adjust the overall power
    level of the unit.


    The 802.11h wireless LAN standard includes a feature called Transmission Power
    Control (TPC), which automatically reduces the transmission power of the AP on
    a 5 GHz network when other networks are detected nearby. This is designed to prevent
    interference with the signals from other networks.


    # Wireless Client Isolation


    By default, most wireless networks allow clients connected to an access point
    to communicate with each other, as well as to the wired network and the Internet.
    This kind of peer-to-peer access is appropriate for a residential network where
    everyone is trusted. However, on a business network, peer access can be a security
    risk.


    The ability to access other clients provides potential intruders with a much larger
    attack surface to target. Some access points include a feature called wireless
    isolation—or a similar name—allows administrators to disable peer access between
    the wireless clients connected to the access point. The clients can still access
    the wired network and the Internet, but they cannot connect to each other.


    # Guest Network Isolation


    Guest network isolation is another WAP feature similar to wireless client isolation
    in that it disables peer access. The difference in this feature is that the WAP
    disables peer access for the clients connected to the guest network.


    Many WAPs support a guest network feature, which can provide temporary users with
    limited network access. The guest network is essentially a separate segment network.
    Clients connected to it are granted access to the Internet, but nothing more.
    Guestnetwork clients cannot access other wireless clients or the wired network
    to which the WAP is connected, unlike the primary wireless LAN, which is unaffected.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Preshared Keys (PSKs)


    A preshared key (PSK) is an alphanumeric text string most commonly used for encrypting
    wireless network traffic protected by the Wi-Fi Protected Access (WPA) and WPA2
    security protocols. Protocols use PSKs for symmetrical encryption, in which the
    same key encrypts and decrypts data. This is in contrast to systems that use public
    key cryptography, which uses public and private keys.


    WPA and WPA2, in their PSK modes, also use the same preshared key for all of the
    network users connecting to the wireless access point, which may compromise the
    security of the entire system by sharing the PSK with unauthorized people. For
    more information on WPA and WPA2, see "Encryption Standards" in Chapter 12, "Wireless
    Standards."


    # Enterprise Authentication


    Because the use of a single shared key for all of the network users is inherently
    insecure, even the smallest SOHO networks use some form of enterprise-based authentication
    that does not rely on PSK encryption. There are several alternatives to PSK, including
    the enterprise version of WPA/WPA2 and EAP, as discussed in the following sections.


    # WPA/WPA2 Enterprise


    In addition to its PSK mode, WPA and WPA2 have an Enterprise mode, which does
    not rely on shared keys. WPA/WPA2 Enterprise uses the 802.1X authentication protocol
    with a separate authentication server, usually running Remote Authentication Dial-In
    User Service (RADIUS).


    # EAP


    Extensible Authentication Protocol (EAP) is not really a protocol at all, but
    rather a framework for a protocol. EAP extends the 802.1X framework to support
    a variety of authentication mechanisms that can protect a network with different
    levels of hardening, including swipe cards, fingerprints, and other forms of biometrics,
    as well as passwords. There are many protocols that use the EAP framework, including
    Protected Extensible Authentication Protocol (PEAP), which encapsulates EAP within
    an encrypted TLS tunnel, and Extensible Authentication Protocol – Transport Layer
    Security (EAP-TLS), used on wireless networks.


    # Geofencing


    Geofencing is a technique for limiting access to a network, system, or service
    based on the geographic location of the client, as specified by global positioning
    system (GPS) or radio-frequency identification (RFID) chips. There are several
    ways in which networks can use this technology. Users within a specified virtual
    boundary can be permitted access to the'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'network and denied access when they cross outside of the boundary. The system
    can generate alerts when an unauthorized device crosses the boundary into the
    protected area. It is also possible to configure mobile devices intended for use
    only within the boundary to self-erase their data if someone takes them outside
    of the boundary.


    # Captive Portal


    A captive portal is a web page, as shown in Figure 18.1, where wireless network
    users must authenticate—or at least identify themselves—before they are granted
    access to the network. Most businesses that provide free Wireless Internet access—such
    as coffee shops and fast-food restaurants—configure their networks to send users
    to a captive portal when they first attempt to establish a network connection.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_257_0.png)


    FIGURE 18.1 A captive web portal


    A captive portal, by the very least, requires users to agree to an end-user license
    agreement by specifying their email addresses. Businesses that charge for Internet
    access, such as hotels, sometimes use a captive portal for the e-commerce transactions
    or to specify account credentials.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# IoT ACCESS CONSIDERATIONS


    The Internet of Things (IoT) refers to hardware devices—such as lights, thermostats,
    cameras, and other home automation devices—that are capable of connecting to a
    TCP/IP network, most often to provide users with remote administration of the
    device. IoT devices are frequently wireless and connect to a network using Wi-Fi,
    Bluetooth, or a similar technology.


    IoT devices have IP addresses like any other network client, which makes them
    vulnerable to attack. The devices themselves typically do not have much in the
    way of security mechanisms and can easily be infected with a bot and turned into
    a zombie. Protection for the devices and the network must usually come from an
    outside source, such as a firewall.


    # CERTMIKE EXAM ESSENTIALS


    +   - Many network hardening techniques means for reducing the network''s attack
    surfaces, such as disabling unneeded switchports and services, creating more secure
    VLANs, implementing ACLs and firewall rules, and using strong passwords.


    +   - Attackers can often gain unauthorized access to a network by taking advantage
    of regular administration traffic, such as that generated by SNMP, ARP, NDP, and
    DHCP. Closing these avenues off to potential attackers is a key element of network
    hardening.


    +   - Wireless networks have unique security issues, many of which administrators
    address by manipulating and configuring features on the WAPs, such as MAC filtering,
    client and guest network isolation, and geofencing.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Practice Question 1


    Alice is responsible for the security of the 23rd floor Wi-Fi networks in her
    company''s office building. Recently, there have been some security incidents
    that were traced to unauthorized wireless network accesses on the 23rd floor.
    Alice''s floor contains the company''s, so there are frequently salespeople in
    the office who need Internet access for their mobile devices. Buyers'' offices
    also contain wireless printers, so they can print out orders for the salespeople
    on the spot, and to accommodate the salespeople, Alice uses the WPA2 protocol
    with a shared key, which the receptionists supply to the salesperson as they enter.
    Alice knows this is less than secure, and she suspects that it might be the source
    of the security breaches.


    Which of the following steps Alice take to increase the security of the 23rd-floor
    Wi-Fi network while accommodating the salespeople without inconveniencing the
    buyers?


    +   A. Implement MAC filtering on the WAPs.

    B. Create an isolated guest network.

    C. Move the Wap antennas.

    D. Change the presared key daily.


    # Practice Question 2


    One Monday morning, Ralph is working the IT helpdesk when he starts receiving
    calls and emails from users who cannot access the network. This is a familiar
    type of call for Ralph, but there are far too many of them at once to be a result
    of user error. Ralph inspects several of the workstations experiencing the problem
    and is surprised to discover that all have IP addresses on a network that is not
    one of the company subunits.


    Ralph tries changing the addresses to correct ones, and the workstations connect
    to the network without a problem. Investigating further, Ralph notices that the
    incorrect addresses are still being assigned by a DHCP server. He concludes that
    someone must have connected another DHCP server to the network, which his supervisor
    tells him is called a rogue.


    Which of the following would be the easiest way to locate and neutralize the rogue
    DHCP server?


    +   A. Capture a network traffic sample and analyze the DHCP message contents.

    B. Map the locations of the misconfigured workstations.

    C. Reconfigure the switchports to the legitimate DHCP servers are connected.

    D. Reconfigure all of the workstations to use manually assigned IP addresses.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Practice Question 1 Explanation


    A. is incorrect because it would not be practical to use MAC filtering on a network
    with so many temporary users.

    B is correct because creating an isolated guest network for the salespeople would
    prevent them from accessing any network resources other than the Internet connection.

    C is incorrect because moving the antennas does nothing to address Alice’s suspected
    cause of the security problems.

    D is incorrect because changing the preshared key adds no security when Alice
    has to distribute the new key to the salespeople each day.


    Correct Answer: B


    # Practice Question 2 Explanations


    A. is incorrect because, although the contents of the DHCP messages can disclose
    the address of the rogue server, they cannot tell Ralph where it is located, nor
    can they neutralize it.

    B. is incorrect because a DHCP server’s clients can be located anywhere on the
    network. The locations of the affected workstations are no indication of the server’s
    location.

    C. is correct because many switches include a DHCP snooping feature that allows
    administrators to designate switchports as connected to legitimate DHCP servers.
    The switches discard DHCP traffic arriving over any switchports.

    D. is incorrect because, while using manually assigned addresses would solve the
    problem, the process would be far too time- and labor-intensive.


    Correct Answer: C'
