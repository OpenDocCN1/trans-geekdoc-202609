  md: 'their own work habits. Testing code typically requires a standardized test
    platform, with many different people performing tests, the process of repeatedly
    building the test platform can be time-consuming and error-prone.


    IaC defines the infrastructure of the test platform as code in the form of scripts
    and configuration files. This allows the process of building the environment for
    a test deployment to be automated by the developers themselves, resulting in faster
    deployments and a consistent environment for test. IaC also prevents developers
    from requesting a new platform from the IT department for each test.


    The scripts that define the infrastructure can be of two types: imperative and
