- pgno: 332
  md: '# Troubleshooting

    Network Issues


    # Objective 5.5: Given a scenario, troubleshoot general networking issues.


    This chapter examines some of the network problems that troubleshooters routinely
    face. The Network+ exam expects candidates to be familiar with these issues and
    know how to address them.


    In this chapter, you''ll learn everything you need to know about Network+ objective
    5.5, including the following topics:


    +   - Considerations

    - Common issues


    # CONSIDERATIONS


    Troubleshooters are often faced with problems that might have multiple causes,
    and it sometimes can be difficult to know where to start. When that is the case,
    there are several elements that troubleshooters should consider first, because
    they are the areas where many common problems originate.


    # Device Configuration Review


    Whatever the symptoms of the problem, starting with the configuration of the device
    experiencing the issue is usually a good idea. Depending on the nature of the
    problem, troubleshooters should consider checking the network adapter''s TCP/IP
    configuration'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'settings and the system''s event logs. There are also the obvious solutions,
    such as whether the network cable is plugged in. If the problem involves network
    communications, it can be helpful to review the configurations of the intermediate
    systems—that is, the routers, switches, and other devices on the path to the destination.


    # Routing Tables


    When troubleshooting a problem with packets not getting to their destination,
    checking routing tables is one way of narrowing down the location of the fault
    if there is. Begin by making sure that the routing table on the problem workstation
    is properly configured with a default gateway address. Then, examine the tables
    on the network''s internal routers to see what path the packets are taking internally.
    If the packets are likely to be out of the local troubleshooter''s hands, however
    it is still possible to use the traceroute (tracerert) tool to track the path
    of the packets to their destination.


    # Interface Status


    When troubleshooting a network performance issue, checking the interface status
    can provide significant diagnostic information. The status should indicate the
    speed of the network connection and whether it is running in half or full duplex.
    If aဆောင်''s network adapter is negotiating a lower than normal speed with the
    switch, or if it is running in half duplex when it should be full, the troubleshooter''s
    next task is to find out why that is usually involves examining the switchport''s
    interface and possibly configuring the interfaces manually.


    # VLAN Assignment


    A VLAN is essentially a virtualized subnet realized inside a switch, so is a workstation
    plugged into a switch with incorrect VLAN assignment (or just plugged into the
    wrong port) is connected to the wrong network. Trouble calls in when a user can
    connect to the network cannot find their familiar servers and printers, checking
    VLAN assignments should be on the troubleshooter checklist.


    # Network Performance Baselines


    As mentioned in Chapter 13, "Network Availability," it is a good practice for
    administrators to record baseline readings of network communication metrics at
    regular intervals. This is so that future troubleshooters have a history of documented
    readings they can compare to the current conditions. When users report that the
    network seems slow, for example, a baseline comparison can confirm to the troubleshooter
    that there is actually a slowdown. In addition, the baseline readings give the
    troubleshooter a way to confirm whether a solution has been successful.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# COMMON ISSUES


    Troubleshooters might have to deal with a wide variety of issues, but there are
    some that occur over and over, such as those described in this section.


    # Collisions


    A collision occurs on a cached network when two hosts on a shared medium transmit
    packets at the same time. The packets collide and both are lost. The two senders
    must then wait a random interval and retransmit their packets. This was a normal
    and common occurrence on Ethernet networks when they used hubs and run in half
    duplex.


    Today, all Ethernet networks are connected by switches and run in full duplex,
    so every host has a dedicated link to the switch and can transmit and receive
    data at the same time. As a result, if a significant number of collisions are
    occurring on a full-duplex Ethernet network, there could be ports negating half-duplex
    connections for some reason. Another possibility is that a cable segment is too
    long, causing late collisions. Both of these conditions can cause a significant
    performance degradation.


    # Broadcast Storm


    As described in Chapter 11, "Switching, broadcast storms are an indication that
    there are switching loops on the network. The loops are the result of redundant
    switches to create fault-tolerant paths through the network. Switches forward
    broadcast messages out all of their ports. When a switching loop is present on
    the network, the switches start duplicating copies of every broadcast message,
    they start duplicating themselves. In a moment, the network is flooded with broadcasts
    that the host interfaces all have to receive and process. To prevent switching
    loops and the resulting broadcast storms, most enterprises use the Spanning Tree
    Protocol (STP), which enables the switches to hold redundant paths as inactive
    standbys until they are needed.


    # Duplicate MAC Address


    Every network interface must have a unique MAC address. On cabled networks, Ethernet
    adapters have their addresses hard-coded, so the presence of duplicate MAC addresses
    on a cabled network is not unusual. In virtual networks, the MAC addresses of
    virtual machines'' network interfaces are configurable, and the supervisor manager
    can usually detect a duplicate MAC address immediately and display an error message.


    Therefore, duplicate MAC addresses could well indicate that a MAC spoofing attack
    is in progress by someone to impersonate another host. Troubleshooters can attempt
    to locate the duplicate by finding the switchports receiving traffic from that
    MAC address.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Duplicate IP Address


    As with MAC addresses, the IP addresses on a network must be unique. If there
    are hosts with duplicate IP addresses on the network, they will function intermittently
    or not at all. Most operating systems test the uniqueness of their IP addresses
    (at least on the network) by generating an ARP request broadcast to see if any
    host with that address replies. If one does, an error message typically appears
    and no access to the network works.


    As a result of the ARP test, the host with the duplicate address has the MAC address
    of the other host in its ARP table. Troubleshooters can use that MAC address to
    track down the switchport to which the duplicate host is connected.


    # Multicast Flooding


    Switches need information about the network to function properly. They use incoming
    traffic to compile a table of the MAC addresses associated with their ports. However,
    if a switch receives traffic destined for a MAC address it doesn''t know, the
    switch floods it out all of its ports. Multicast are one-to-many transmissions
    sent to the members of a designated multicast group. A switch properly configured
    for multicasts has the ports for the individual group members associated with
    the multicast address. If a switch is not properly set up for multicasts, the
    transmissions are flooded to all the hosts on the network. Multicasts are often
    used for applications such as video feeds that cause a lot of traffic, a multicast
    flood can conceivably degrade the network''s performance significantly. A network
    traffic analysis can help troubleshooters identify where the multicast transmissions
    are going, and the IGMP snooping allows switches to listen in the Internet Group
    Messaging Protocol (IGMP) traffic and use the information to add the multicast
    group members to their tables.


    # Asymmetrical Routing


    There are benefits to having redundant routes through an internetwork, especially
    fault tolerance when one router connection fails. One of the results, however,
    is a phenomenon called asymmetrical routing, which when traffic takes one router
    path from the source to its destination and a different router path from its destination
    back to the source. This can affect network performance if two router paths are
    running at different speeds, and it also interferes with the fault tolerance of
    the design. If both router paths are needed to support regular traffic, then a
    router failure will interrupt the connection to the destination. Asymmetrical
    routing can be difficult to detect and require careful configuration of the routing
    tables to prevent.


    # Switching Loops


    As noted earlier, switching loops occur as the result of a network design that
    includes redundant switches for fault tolerance purposes. Redundant switches enable
    the network to tolerate a switch or cable failure without a loss of connectivity.
    However,'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Common Issues


    connected to two switches is going to send duplicate packets to each one, result
    in a switching loop. The Spanning Tree Protocol (STP) enables the switches on
    a network segment to select designated port. The nondesignated ports are blocked
    from traffic, eliminating the switching loops, until a port is needed to take
    on the role of the designated port.


    # Routing Loops


    A routing loop occurs when two routers have contradictory information in their
    routing tables. Each of the two routers has an entry for a particular destination
    network in its routing table. however, the Next Hop field in each router contains
    the address of the other router, so packets bounce back and forth between the
    routers until their Time to Live (TTL) values reach zero and the packets are discarded.


    The traceroute (tracer+) command can detect the presence of a routing loop in
    the following. The problem will require modifications to the routing tables, either
    manually or through some adjustment of the routing protocols.


    Tracing to 173.146.124 over a maximum of 30 hops:


    | | | | |

    |---|---|---|---||

    | 1 | <10 ms | 1 ms | <10 ms | 192.168.2.99 |

    | 2 | 101 ms | 110 ms | 98 ms | 131.107.67.1 |

    | 3 | 123 ms | 112 ms | 114 ms | 131.107.88.26 |

    | 4 | 136 ms | 130 ms | 133 ms | 157.54.116.5 |

    | 5 | 146 ms | 129 ms | 133 ms | 157.54.5.1 |

    | 6 | 136 ms | 130 ms | 133 ms | 157.54.116.5 |

    | 7 | 146 ms | 129 ms | 133 ms | 157.54.5.1 |

    | 8 | 136 ms | 130 ms | 133 ms | 157.54.116.5 |

    | 9 | 146 ms | 129 ms | 133 ms | 157.54.5.1 |

    | 10 | 136 ms | 130 ms | 133 ms | 157.54.116.5 |

    | 11 | 146 ms | 129 ms | 133 ms | 157.54.5.1 |


    # Rogue DHCP Server


    As explained in Chapter 6, "Network Services,Dynamic Host Configuration Protocol
    (DHCP) servers provide clients with IP addresses and other TCP/IP configuration
    settings. A rogue DHCP server is an unauthorized server on the network to provide
    clients with falsified settings. Apart from the denial of service, attackers can
    use DHCP to point clients to their own DNS server, instead of the authorized.
    By loading their DNS server with false information, the attackers can direct clients
    to fraudulent web servers and phishing attacks.


    Tracking a rogue DHCP server is possible using the information it supplies to
    clients. Running the ifconfig /all command on an afflicted Windows system displays
    the IP address of its DHCP server, as follows:


    ```

    Description . . . . . . . . . . : Intel(R) Dual Band Wireless-AC 8265

    Physical Address. . . . . . . . . . : E47-70-B9-42-09-D2

    ```'
  merge: -1
  img_proc: true
