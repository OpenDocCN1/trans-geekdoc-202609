  md: '# Chapter 3 · Cables and Connectors


    Twisted pair cable installations should conform to the standards published by
    the American National Standards Institute (ANSI) and the Telecommunications Industry
    Association (TIA). The current version of the standard is called ANSI/TIA-568-D:
    Commercial Building Telecommunications Cabling Standard. This standard specifies
    cable types, connector types, maximum lengths, testing methodologies, and other
    installation requirements for twisted pair as well as coaxial and fiber-optic
    cables.


    > ### EXAM TIP

    The ANSI/TIA-568-D standard has undergone several name changes. The TIA was formerly
    a division of the Electronic Industries Alliance (EIA), which once called the
    Electronic Industries Association (EIA). Many published references to the standard
    still use older designations, such as EIA/TIA-568 or TIA/EIA-568. Network+ exam
    candidates should be aware that these various names refer to revisions of the
    same document.


    The Network+ objectives cite the termination standards for twisted pair cables
    as TIA/EIA-568A and TIA/EIA-568B. These refer to the pinouts that install the
    wires inside the cable are color-coded orange, green, brown, and blue, with one
    solid and one striped for each color. 568A and 568B pinouts refer to the order
    of the colored wires in the cables, as shown in Figure 3.1.


    # TIA/EIA T568A


    # TIA/EIA T568B


    ![](img/131506e178f74f7b4704a0aa0fe03dae_63_0.png)


    FIGURE 3.1 The TIA/EIA T568A and T568B pinouts for twisted pair cables


    The only difference between the T568A and T568B pinouts is the reversal of the
    orange and green wire pairs. There is no difference in performance between the
    two, but it is critical for cable installers to use the same pinout at both ends
    of a cable run.'
