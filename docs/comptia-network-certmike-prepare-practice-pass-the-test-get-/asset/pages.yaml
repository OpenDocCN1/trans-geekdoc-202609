    # NTP Issues


    There are many network applications and services that rely on timestamps to synchronize
    their operations. For these operations to properly function, the systems must
    have synchronized clocks. For example, on a network using Active Directory Services,
    which relies on a complex architecture of time-sensitive clocks, computers more
    than minutes out of sync with the domain controller will not function properly.
    Certificates are also reliant on timestamps for their dates of validity, and any
    application that gathers information from network needs the device time to be
    synchronized if the logs are going to be any of use troubleshooters.


    The Network Time Protocol (NTP) allows devices to synchronize their clocks with
    time servers on the Internet. Normally, computers have small batteries to keep
    their internal clocks running, but those batteries can eventually die, which might
    cause the system to reset to a date and time in another century. An NTP-based
    service would allow the system to periodically set its clock to an accurate time
    signal. Every operating system has a command or operation for configuring the
    time service. For example, in Windows, the W32tm.exe program can display a status
    like this:


    ```

    Leap Indicator: 0(no warning)

    Stratum: 2 (secondary reference) - synced by (SNTP)

    Precision: -6 (15.625ms per tick)

    Root Delay: 0.1159744s

    Root Dispersion: 0.0540637s

    Referenced: 0x28770664 (source IP: 40.119.6.228)

    Last Successful Sync Time: 1/28/2023 9:59:35 PM

    Source: time.windows.com,0x8

    Poll Interval: 10 (1024)

    ```


    If the time is not running or if it is to synchronize with an invalid source,
    there are other commands to specify the name of a server and other settings.


    # BYOD Challenges


    Bring-your-own-device (BYOD), policies, as mentioned in Chapter 14, "Organizational
    Documents and Policies," are common on networks today, meaning that employees
    are allowed to use their own smartphones, tablets, and other devices to access
    network resources. To the company management, this is a bonus because it saves
    them from buying new devices for everyone. To IT technicians and troubleshooters,
    how-ever, is a nightmare. Users have different devices with different operating
    systems, some'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'new and some old, and IT people must provide support for all of them. Most
    problematic, in many cases, is that IT must configure the devices to be secure
    enough to work with potentially sensitive network data.


    # Licensed Feature Issues


    Many software products are available in multiple versions with various feature
    sets and corresponding prices. In many cases, the application is complete, even
    in its most basic version, and purchasing an additional license just unlocks the
    corresponding features. IT personnel responsible for pre-sales evaluations of
    software products should be aware of each product''s features. In addition, many
    software products today are sold on a subscription basis that requires regular
    renewals. Keeping track of the renewal dates for multiple products and multiple
    users is another task added to the IT department''s list.


    # Network Performance Issues


    A trouble call reporting that the network is slow is not usually a top priority
    for the IT department. It is an isolated, subjective report that might be a transient
    issue that will pass in a few minutes. However, when everyone on the network starts
    reporting slow, it takes notice. Unfortunately, it is difficult to know where
    to start with this type of issue.


    Networks typically suffer performance issues because of a bottleneck, a single
    process or process is causing the entire network to slow down, just as an accident
    in one lane of a highway affects the traffic for miles. That bottleneck could
    be anywhere on the network, so troubleshooters have to start using the tools and
    techniques described in this book to narrow down its location. Examining logs
    and comparing current metrics with baseline readings can be a good place to start.


    # CERTMIKE EXAM ESSENTIALS


    +   * When troubleshooters approach a problem, it is often a good idea to review
    some of the basic considerations that can indicate possible cases, such as the
    problem device''s configuration settings, its routing table entries, its VLAN
    assignment, and the status of its network interface. Comparing the network''s
    current performance metrics to baseline readings earlier is also a good starting
    point.

    * Some of the common network infrastructure issues that troubleshooters frequently
    encounter on enterprise networks include switching and routing loops, which can
    cause traffic to circulate endlessly throughout the network; multicast floods
    and asymmetrical routing, which can degrade network performance; and incorrect
    firewall settings and VLAN assignments, which can prevent users from accessing
    the network resources they need.'
