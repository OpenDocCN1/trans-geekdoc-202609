- pgno: 307
  md: '# Wi-Fi Analyzer


    Wi-Fi analyzer is a software product that scans the standard wireless network
    frequencies and displays information about the networks it detects in the immediate
    area. The functionality is incorporated into many more elaborate and expensive
    tools, which free versions are also available for mobile platforms.


    Used to examine wireless network traffic levels, a Wi-Fi analyzer typically displays
    a list of the networks it finds, with additional information about each one, such
    as the following:


    +   - SSID Specifies the name by which the network is identified


    +   - Signal Strength Specifies the power level of the signal (in decibel-milliwatts
    or dBM) relative to the user''s own access point


    +   - Channel Identifies the network that is using in the current frequency band


    +   - Channel Width Specifies the width (MHz) of the channel the network is currently
    using


    +   - MAC Address Specifies the hexadecimal MAC address of the network''s access
    point


    +   - Encryption Protocol Specifies the protocol that the network is using to
    encrypt and decrypt its transmissions


    Some products also include graphs that provide a visual indication of the traffic
    on each channel.


    # Protocol Analyzer/Packet Capture


    The terms analyzer and packet capture refer to tools that go by several different
    methods. Packet capture tools, also referred to as sniffers or network monitors,
    allow technicians to capture a sample of the network''s traffic and save it to
    a buffer for later analysis. A protocol analyzer interprets the captured traffic
    and displays it for examination. The process of capturing network traffic is dependent
    on the tool used, the network segment to which the tool is connected, and the
    capabilities of the network interface adapter in the computer performing the capture.


    On a standard workstation performing a packet capture, the capture tool can only
    access packets destined for that workstation. however, many switches support mirroring,
    which makes it possible for one switchport to function as a mirror image of another
    port, allowing an administrator to capture the traffic from the mirrored port.
    To capture a workstation''s own traffic, its network adapter must support promiscuous
    mode, enabling it to process incoming traffic destined for any MAC address.


    > Depending on the product, some protocol analyzers allow the user to view all
    of a packet''s contents, including its payload data. This data could include passwords
    and other sensitive information in clear text. IT technicians should be aware
    of the potential security hazards their tools represent when they are abused.'
  merge: -1
  img_proc: true
