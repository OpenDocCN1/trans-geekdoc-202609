- pgno: 304
  md: '# Practice Question 1


    A third-party cable contractor has just finished installing CAT 6 UTP cabling
    in a new office space for Ralph''s company, and Ralph is responsible for checking
    their work. He connects a wire tester to each new cable and finds one that has
    a short circuit. Which of the following procedures would most likely be the simplest
    to resolve the problem?


    +   A. Move the cable away from any potential sources of electromagnetic interference.

    B. Use a different pinout on both ends of the cable.

    C. Reinstall the cable run using CAT 6a UTP.

    D. Replace the connectors at both ends of the cable run.


    # Practice Question 2


    Alice is working an IT technician for a firm that has just completed a move to
    new office space in a building that is prewired for twisted pair Ethernet. All
    of the other network components have been brought from the old location. Once
    the IT team installed the Gigabit Ethernet equipment and connected it to the building''s
    cable runs, Alice was responsible for setting up a group of workstations as a
    test network. The network''s performance was poor, however.


    After analyzing some captured packets, Alice discovered that there were many Ethernet
    frames being retransmitted. Next, she inspected the cable runs in the drop ceilings
    and measured them. The cables did not exceed the maximum allowable length for
    the network, nor were there any major sources of electromagnetic interference
    near them. Which of the following could conceivably be the problem causing the
    dropped frames and poor network performance?


    +   A. The existing cable is not rated for use with Gigabit Ethernet.

    B. The transceivers at the cable ends are mismatched.

    C. The cables have RJ11 connectors installed instead of RJ45 connectors.

    D. Some of the cable runs are using T568A pinouts and some are using T568B.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Practice Question 1 Explanation


    A. is correct because a short circuit is a wiring fault that cannot be caused
    by electromagnetic interference.


    B. is incorrect because a short circuit is a wiring fault that can happen using
    any pinout. Changing the pinout without replacing the connectors as well, which
    would probably resolve the problem, but this is not the simplest resolution.


    C. is incorrect because a short circuit is a wiring fault that can happen on any
    grade of cable. Replacing the cable without replacing the connectors as well,
    which would probably resolve the problem, but this is not the simplest resolution.


    D. is correct because a short circuit is a wiring fault usually that a connector
    at one end of a cable run is connected to two pins at the other end. Replacing
    the connectors will most likely correct the problem.


    Correct Answer: D


    # Practice Question 2 Explanation


    A. is correct because it is the only option that could be a source of the problem.
    Some older buildings might still have CAT 3 cable installed, which was used in
    the original Ethernet twisted pair specification. CAT 3 cable is unsuitable for
    Gigabit Ethernet and can result in the poor performance that Alice’s test network
    is experiencing.


    B. is incorrect because all the transceivers were part of the Gigabit equipment
    moved from the old location and should not be mismatched.


    C. is incorrect if the cables had RJ11 connectors, a Gigabit Ethernet network
    would not function at all.


    D. is incorrect because cables using different pinout standards will not cause
    degraded performance as each run uses the same pinout at both ends.


    Correct Answer: A'
  merge: -1
  img_proc: true
