  md: '# Practice Question 1 Explanation


    A. is correct because workgroup switches are relatively inexpensive and can replace
    the hubs without additional modifications to the network. Fast Ethernet hubs create
    a single 100 Mbps network medium that is shared by all of the computers. Replacing
    the hubs with switches creates a separate collision domain for each computer,
    with a full 100 Mbps of bandwidth.


    B. is incorrect because adding a router and dividing the network into two LANs
    could yield modest performance improvement, due to the non-propagation of broadcasts,
    the users frequently share data among themselves. This would result in a lot of
    traffic forwarded to the other LAN by the router.


    C. is incorrect because adding a layer 3 switch and creating two VLANs would result
    in roughly the same traffic conditions as option B. Layer 3 switches are also
    extremely expensive, making the solution impractical in this case.


    D. is incorrect because replacing the hubs would not result in a performance improvement.
    For the network to run at Gigabit Ethernet speeds, the computers and the hubs
    must use Gigabit networking equipment.


    Correct Answer: A


    # Practice Question 2 Explanation


    A. is incorrect because routers only forward traffic that is destined for another
    network. Therefore, there must be at least three collision domains.


    B. is incorrect because switches create a separate collision domain for each of
    the devices connected to them, so there must be at least six collision domains.


    C. is incorrect because switches create a separate collision domain for each of
    the devices connected to them and hubs create a single collision domain for all
    of their connected devices.


    D. is incorrect because hubs create a single collision domain for all of their
    connected devices. Therefore, there cannot be nine collision domains.


    E. is incorrect because routers do not propagate broadcasts, so there must be
    more than one broadcast domain.


    F. is incorrect because each hub or switch has its own collision domain.


    G. is incorrect because all of the broadcast messages reaching a hub or switch
    are propagated to all of the devices connected to that hub or switch, so there
    cannot be more than three broadcast domains.


    H. is incorrect because all of the broadcast messages reaching a hub or switch
    are propagated to all of the devices connected to that hub or switch, so there
    cannot be more than three broadcast domains.


    Correct Answers: C and F'
