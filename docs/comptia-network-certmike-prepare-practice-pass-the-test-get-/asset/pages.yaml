- pgno: 238
  md: '# CHAPTER 17


    # Network Attacks


    # Objective 4.2: Compare and contrast common types of attacks.


    This chapter examines some of the network attack types that commonly affect a
    typical enterprise network. The Network+ exam expects candidates to be familiar
    with these basic security threats.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    4.2, including the following topics:


    +   - Technology-based

    - Human and environmental


    # TECHNOLOGY-BASED ATTACKS


    Attacks on an organization’s network or its data typically take one of two forms:
    technological, in which an intruder uses an Internet connection to access the
    network, and physical, in which an intruder uses personal communication to gain
    access to protected resources.

    Some of the most common types of technological attacks are described in this section.


    # Denial-of-Service (DoS)


    A denial-of-service (DoS) attack is one in which an intruder floods a server or
    a network with traffic, slowing down its response time and preventing legitimate
    clients from connecting. While any type of traffic directed at the target will
    slow it down, some DoS attacks use legitimate requests to target a server’s processor,
    as well as its network connection. Another type of DoS attack, called an amplified
    DoS attack, sends'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Chapter 17 • Network Attacks


    carefully formulated request messages to a legitimate DNS server, which causes
    the server to be flooded with dozens of responses for each request.


    While there are plenty of small-scale DoS attacks, in which an intruder uses one
    computer to generate traffic and direct it towards the target system, the truly
    dangerous ones are called denial-of-service (DDoS) attacks. This type of attack
    involves one intruder, but many computers, referred to as zombies because they
    are running an application called a bot that can execute instructions at the behest
    of an attacker, as instructions to bombard a particular target with traffic. DDoS
    attacks are virtually unlimited in scale and have been known to bring legitimate
    networks to a standstill.


    # Bots


    A bot is a software application or routine that operates remotely deployed on
    a computer. An army of bots obeying a single controller is called a botnet. Many
    bots are benign and perform useful services, but like any automated system, they
    can be made to perform malicious attacks.


    In a typical attack scenario, the attacker uses viruses or other means to deploy
    an army of bots on the computers of unsuspecting victims. The bots communicate
    with a command and control server, which is run by the attacker, who can use it
    to command the bots to initiate a DDoS attack or perform other malicious acts.
    The target of the attack is bombarded with traffic from dozens or hundreds of
    bots at.


    # On-Path Attack


    Formerly known as man-in-the-middle attack, an on-path attack is a technique in
    which an intruder intercepts data packets as they travel over the network, reads
    and perhaps modifies the contents of the packets in some fashion, and then sends
    the modified packets on their way to their intended destination. There are any
    number of ways that an attacker can take profitable advantage of this arrangement.


    > EXAM TIP

    When the Network+ exam objectives provide alternative names for a particular skill,
    with the terms on-path and man-in-the-middle, their intention is for the exam
    candidate to be familiar with both, and to know that they represent the same technology.


    # DNS Poisoning


    The Domain Name System (DNS) provides name resolution services to clients all
    over the world. When a client sends a query containing a computer or domain name
    to its DNS server, the server responds with the IP address associated with the
    queried name. DNS poisoning is a practice in which an attacker uses nefarious
    means to alter the DNS record for'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'particular name with a bogus IP address. The DNS server then begins responding
    to queries with the wrong IP address, sending clients to the wrong destination.


    DNS poisoning was frequently used at one time to send traffic to web servers duplicated
    the appearance of the real ones. However, DNS security has been enhanced, and
    the exploits that made DNS poisoning have been remediated.


    # VLAN Hopping


    VLAN hopping is a technique that allows an attacker to bypass the access control
    measures implemented in the network switches and access protected systems on another
    VLAN. Virtual networks (VLANs) are logical networks—that is, networks that administrators
    create in switching by grouping ports. VLANs behave like physical networks composed
    of computers and cables. Normally, a system on one VLAN cannot access other unless
    an administrator grants the permissions it needs to do.


    A VLAN can include ports on multiple switches. The switches use a technique called
    trunking that requires each packet be tagged with a VLAN identifier. VLAN hopping
    is a technique in which an individual adds a second tag to their packets. This
    double tagging can force the switches into the packets from a different VLAN,
    enabling the attacker to access a VLAN for which they do not have permissions.


    # ARP Spoofing


    Address Resolution Protocol (ARP) is a data link protocol that performs IP address
    to MAC resolutions. When a system broadcasts an ARP request message containing
    an IP address, the host using that IP address must return a reply message containing
    its MAC address.


    By generating ARP reply messages containing a false MAC address—a process called
    ARP spoofing—an attacker can poison the ARP cache with incorrect addresses, causing
    traffic to be redirected to a different destination. Directing an ARP spoofing
    attack at both parties of a transaction is one way to achieve an on-path (man-in-the-middle)
    situation.


    # Rogue DHCP


    Because the Dynamic Host Configuration Protocol (DHCP) relies on broadcast messages
    on IPv4 networks, the entire network receives all of DHCP messages, DHCP servers
    are configured to respond to broadcasts from clients and fulfill them with IP
    addresses and other configuration settings.


    A rogue DHCP server is an unauthorized server deployed on the network by an attacker
    for the purpose of supplying bogus IP addresses to clients. This is a form of
    Dos attack, when the client systems configure themselves using the incorrect IP
    addresses, they are denied cut off from the network. Today, a technique called
    DHCP snooping built into switches can protect against rogues by filtering out
    unauthorized DHCP traffic.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Rogue Access Point


    A rogue access point (AP) is an unauthorized wireless access point that someone
    has connected to the network. This might be an innocent attempt by employees to
    create their own network, or it might be a deliberate attack. Whether innocent
    or malicious, a rogue access point—especially one that is not secured—is essentially
    providing access to the company network to anyone.


    # Evil Twin


    An evil twin is a type of attack in which a rogue access point is configured to
    kidnap wireless clients from the legitimate network and add them to the attacker''s
    network. In addition to gaining unauthorized access to the company network, an
    attacker can use a rogue AP with DHCP functionality to allocate incorrect IP addresses
    to clients.


    By configuring the rogue AP with the same SSID as the company network and setting
    it to a different channel, then jamming the channel that the real APs are, the
    attacker causes the clients to connect to the only AP available to the attacker.
    The rogue AP then uses DHCP to assign IP addresses on the attacker''s network,
    leaving them open to a peer-to-peer attack.


    In addition, by supplying a false gateway address, the rogue AP can cause wireless
    clients to send all of their outgoing traffic to the attacker''s server for analysis,
    rather than to the default gateway router.


    # Ransomware


    Ransomware is a term used to describe a form of malware that causes an infected
    computer to lock up, preventing all user access and displaying an official-looking
    screen stating that the computer can only be unlocked by paying a fine. While
    the screen might imply that the computer has been locked down by a U.S. government
    law enforcement agency, the source of the malware is never official and paying
    the fine (usually by some form of digital currency) might or might not result
    in the computer being unlocked.


    Some ransomware does not actually lock the computer; it prevents any user input
    from changing the graph and returning to the standard desktop. Other, more serious,
    threats actually encrypt all of the data on the victim''s computer, forcing them
    to pay if they want their data decrypted.


    # Password Attacks


    A password attack is a technique for accessing secured resources by bypassing
    the password of a privileged account. Password attacks are typically a matter
    of trying one password after another, but there are specialized techniques for
    automating and accelerating the process, including following:


    +   Dictionary: An application that uses a preexisting dictionary—actually a database
    of commonly used passwords and tries them against the account by one'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Brute-force: An application that attempts to penetrate a password by using
    every conceivable permutation of its characters, including the substitution of
    upper- and lowercase characters, numerals, and symbols


    The primary administrative guard against password attacks is the ability to limit
    the number of incorrect password guesses before the account is locked down for
    a period of time. Another counter to password attacks is simple to use longer
    and more complex passwords. The more characters there are in a password and the
    larger character set, the greater the number of character permutations there are
    to, which further complicates the attack process.


    # MAC Spoofing


    MAC spoofing is an attempt to access a protected resource by using the media access
    control (MAC) address of a system with privileged access to that. On c networks,
    MAC addresses are hard-coded into the computers'' network interface adapters,
    making them relatively difficult to spoof. However, on a virtual machine, changing
    the MAC address of a network interface is a simple matter, which makes MAC spoofing
    that easier.

    MAC spoofing can be an effective method of defeating switch port security, which
    often uses MAC filters to specify the devices that are permitted to access the
    network through a particular port. Spoofing can also enable an attacker to assume
    the identity of a registered device and use the MAC Authentication Bypass (MAB)
    protocol to bypass firewall filters.


    # IP Spoofing


    IP spoofing is a form of digital impersonation in which an individual modifies
    the Source Address field in the IP headers of their outgoing packets. This field
    is supposed to contain the IP address of the sending system; by changing it, individuals
    can make it appear as the packet originated from somewhere else. By altering their
    transmissions in this way, people can send messages anonymously. DDoS attacks,
    for example, frequently use IP spoofing to conceal the identities of the perpetrators.
    It is sometimes possible to use IP spoofing to impersonate a host with elevated
    privileges and gain access to protected resources.


    # Deauthentication


    Typically used to facilitate an evil twin attack, deauthentication is the misuse
    of the 802.11 deauthentication frame, a documented feature of the protocol that
    causes wireless clients to disconnect from their current access point. The clients,
    once disconnected, seek out another available access point, which might happen
    to be a rogue AP set up by the attacker. Once the client is connected to the rogue
    AP (the evil twin), the attacker can make use of it in various ways.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Malware


    Malware is a general term for any software that is designed to perform unauthorized
    operations on a computer, including viruses, worms, Trojans, adware, spyware,
    and ransom-among others. Because it is a catchall term, the effects of malware
    can range from merely annoying to catastrophic. Protection against many forms
    of malware is typically included in most of the so-called antivirus products,
    which usually protect against more than viruses.


    # HUMAN AND ENVIRONMENTAL ATTACKS


    In the IT world, the attackers and the defenders wage a technological war that
    is constantly escalating. However, some attackers prefer to stick to the tried
    and true by taking advantage of human weaknesses that never seem to change. Some
    of these human and environmental attacks are described in this section.


    # Social Engineering


    Although the name sounds technological, social engineering does not require any
    technology, except a telephone. Social engineering is an attack technique that
    consists primarily of asking people for information that is supposed to be confidential.


    Many people, when they are at work, are inclined to be helpful. So, when someone
    calls them, saying they are from the IT department and there is a problem with
    their user account, they often believe it and willingly tell the person their
    username and password. Even in a time when people are wary of being victimized,
    techniques like this surprisingly well. The only counter to social engineering
    is user education regarding the approaches the attacker might take and the types
    of information that the users should disclose.


    # Phishing


    Phishing is an attack technique in which the attacker sends official-looking emails,
    texts, or other communications to potential victims, which are designed to lure
    them into clicking a link, calling a telephone number, or responding to the email.
    The objective is to collect confidential information from the victims.


    A phishing email might be an exact replica of an official email from a known correspondent,
    such as a government agency or a bank, asking the recipient for important information
    and providing a link to their official web site. The only difference from an actual'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'email is that the link has been changed to send the recipients to an alternative
    website, one that might look just like an official site but is run by the attacker.


    The bogus site typically includes a form that asks the user for all kinds of personal
    information, such as banking and credit card account numbers. For the victims
    who supply the requested information, the damage that the attacker can do with
    it is no less than catastrophic. As most forms of social engineering, the only
    defense against phishing is vigilance and user education.


    # Tailgating


    Tailgating is a technique for gaining access to a restricted area protected by
    an access control system. Swipe cards and other access devices typically unlock
    a door for a few seconds, enough for the user to walk through. Tailgating is a
    practice in which an unauthorized user takes advantage of those few seconds that
    the door is unlocked and slips with the authorized user. The standard counter
    to tailgating is an access control vestibule (mantrap) with door locks so that
    unauthorized users cannot slip unnoticed.


    # Piggybacking


    When an unauthorized person slips through a protected entrance with an authorized
    person, there is always a question of whether the authorized user was complicit
    in the act. The term tailg typically refers to unauthorized entrance with an unsuspecting
    user. When an unauthorized user deliberately allows an unauthorized person through
    the door, the term piggybacking is more common.


    In this situation, an access control vestibule is no counter because the authorized
    user is presumably willing to hold the doors open for the unauthorized user. Cameras
    and security guards are the preferred counter for this type of security breach.


    # Shoulder Surfing


    Shoulder surfing refers to a type of social engineering in which an attacker stands
    behind a seated user and looks over their shoulder, trying to see the user''s
    hands typing a password or credit card number or any confidential information
    appearing on the screen. The only real counter to shoulder surfing is for the
    user to be vigilant about entering confidential information when someone is looming
    behind them.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# CERTMIKE EXAM ESSENTIALS


    +   * Enterprise networks today are susceptible to a variety of technological
    attacks, including denial-of-service (DoS), on-path, DNS poisoning, VLAN hopping,
    and evil twin.


    +   * Attackers often penetrate network security by configuring one system to
    impersonate another, a technique called spoofing. For various purposes, attackers
    might use ARP spoofing, MAC spoofing, or IP spoofing. Attackers might even spoof
    entire devices by connecting their own rogue DHCP servers or rogue access points
    to the network.


    +   * Human-based attacks are typically techniques for duping innocent users into
    revealing confidential information, a process called social engineering. Phishing
    and shoulder surfing are variations on this method, using emails and eavesdropping
    to gather information.


    +   * Techniques for defeating physical barriers include tailgating, which involves
    an unsuspecting authorized user, and piggybacking, in which an authorized user
    deliberately admits an unauthorized person.'
  merge: -1
