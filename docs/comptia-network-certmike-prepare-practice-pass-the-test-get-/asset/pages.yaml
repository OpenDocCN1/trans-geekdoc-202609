- pgno: 160
  md: '# Switching

    Objective 2.3: Given a scenario, configure and deploy common Ethernet switching
    features.


    This chapter examines some of the fundamental switching concepts in a typical
    enterprise network. The Network+ exam expects candidates to be familiar with these
    basic networking functions.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    2.3, including the following topics:


    +   - Switching

    - Address Resolution Protocol (ARP)

    - Neighbor Discovery Discovery Protocol


    # ETHERNET BASICS


    Ethernet is one of the first local area networking (LAN) protocols to be released
    commercially in 1980, and it still persists today as the primary data link layer
    (layer 2) protocol for netted networks. The term Ethernet is actually a misnomer;
    the original standard for the network was called Ethernet, but the current standards
    are published by the IEEE as part of the 802.3 working group. Therefore, the Ethernet
    networks built today are actually IEEE 802.3 networks.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '> EXAM TIP

    Although the term Ethernet is technically incorrect, products and documentation
    still use it almost universally, and so does the Network+ exam. There are minor
    differences between the Ethernet frame format and the IEEE 802.3 frame, but networks
    use today the 802.3 frame, whatever it is called.


    The Ethernet standard specified three basic components for an Ethernet network:
    the Ethernet frame, the CS/CD media access control mechanism, and a series of
    physical layer specifications. These components are discussed in this section.


    # The Ethernet Frame


    The Ethernet frame is the outermost envelope in a packet transmitted over a local
    area network. The frame consists of a header and a footer that encapsulate the
    payload that the Ethernet protocol receives from the network layer above it, usually
    Internet Protocol (IP).


    In the same way IP uses addresses to identify hosts on the network, Ethernet uses
    media access control (MAC) addresses to identify systems on a LAN. A MAC address
    is a 6-byte value, expressed in hexadecimal notation, as in the following example:


    52–E7–AD–C5–96–18


    Ethernet network interfaces have a MAC address hard-coded into them. The first
    3 bytes identify the manufacturer of the device, and the last 3 bytes are a unique
    identifier for adapter. Ethernet headers have Destination Address and Source Address
    fields that contain the MAC addresses of the receiving and sending systems over
    the LAN.


    # Carrier-Sense Multiple Access with Collision Detection (CSMA/CD)


    In its early iterations, the Ethernet standards called for a shared network medium,
    such as on a coaxial bus or a hub-based star network. In a shared network medium,
    when two hosts transmit at the same time, a packet collision occurs, usually requiring
    the retransmission of both.


    Collisions were a normal occurrence on these networks, but to minimize them, Ethernet
    includes a MAC mechanism called Carrier Sense Multiple Access with Collision Detection
    (CSMA/CD).


    CSMA/CD defines a method by which hosts can access a shared network medium with
    a reduced chance of collisions occurring and detecting collisions when they occur.
    The phases of the process are as follows:


    Carrier Sense Before a host transmits, it listens to the network to see if it
    is in use. If it is in use, the host pauses before listening again.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Multiple Access When the network is clear, the host begins transmitting. The
    transmitted packet fills the entire shared medium before the host finishes transmitting.
    It is during this time that a collision can occur.


    Collision Detection When the transmitting detects signals on both its transmit
    and receive simultaneously, it declares a signal quality error (or collision),
    stops transmitting data, and starts transmitting a jam signal. The jam signal
    alerts any other transmitting systems of the collision, causing them to discard
    any incoming data they have received.


    Wireless devices cannot use CSMA/CD because they turn off their receivers when
    transmitting, so they use another mechanism called Carrier Sense Multiple Access
    with Collision Avoidance (CSMA/CA).


    When switches replaced hubs in the IT marketplace—and in data centers around the
    world—Ethernet networks no longer needed a shared medium or CSMA/CD, and packet
    collisions as normal became largely part of the past.


    # Physical Layer Specifications


    The Ethernet standards include a collection of physical layer specifications,
    which have been updated over the years to reflect advancements in networking technologies.
    There are dozens of specifications supporting different network media, but only
    a few remained in general use.


    An Ethernet specification defines the characteristics of the network medium, as
    what category of UTP cable to use, and also provides installation guidance, such
    as the maximum length of a cable segment. The limitations on cable length exist
    primarily to support the collision detection mechanism in CSMA/CD.


    > EXAM TIP An Ethernet network, by today’s standards, typically consists of UTP
    cable connecting to switches. Switches have replaced hubs in all but the most
    outdated network installations. Candidates for the Network+ exam should be conscious
    of the effect that switching has on an Ethernet network.


    # SWITCHING


    A switch, as noted elsewhere in this book, is a connectivity device that operates
    at the data link layer (layer 2) of the OSI reference model. Unlike hubs, which
    are purely electrical devices operating at the physical layer, switches have the
    ability to learn about the devices on the network and maintain a record of the
    information they discover.


    A switch is essentially a multiport device that forwards traffic selectively to
    its destination on the local network, rather than flooding each packet to every
    connected host, as a'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 11 • Switching


    hub does. This provides each device connected to the switch with a dedicated,
    full-speed link to every other connected device.


    So, although the devices connected to the switch are all included in a single
    broadcast domain, every pair of devices has its own separate collision domain.
    This eliminates the routing Ethernet packet collisions and the need for CSMA/CD.


    > EXAM TIP

    All of the information on Ethernet and switching in this chapter is concerned
    with layer 2 local area networking only. An Ethernet packet can only be addressed
    to a destination on the local network, either a host or a router. Network+ candidates
    should be aware that a single packet must have a data link layer (MAC address)
    destination on the local network, it can also have a network layer destination
    IP address located on a distant network.


    Switches are available at price points ranging from the cost of a meal to a substantial
    household. Usually, as prices go up, so does the list of features the switch provides.
    Many switches include capabilities that exceed the strictly defined role of a
    switch, even to the point of including functions from other OSI model layers.
    For example, multilayer switches—sometimes layer 3 switches—include routing as
    well as switching capabilities.


    # MAC Address Tables


    The heart of the switching process is the creation and maintenance of MAC address
    tables; this is how the switch learns about the devices on the network. As traffic
    arrives at a switch, the device receives the Ethernet header of each packet, specifically
    the MAC address fields. The switch then compiles a table containing those MAC
    addresses, associating each packet''s Source Address with the number of the switch
    port over which the packet arrived. Switches frequently store MAC addresses in
    contentable memory, a high-performance memory type that speeds up the switch''s
    table process.


    In the future, when packets arrive that are destined for that source address,
    the switch will know to forward the packets out not yet in the switch''s table,
    the switch forwards through all of its ports. Eventually, all of the devices connected
    to the switch will be added to the MAC address table.


    To discover the MAC addresses of hosts on the network, systems use the Address
    Resolution Protocol (ARP). ARP is a data link layer protocol that requests messages
    containing an IPv4 address and broadcasts them on the local network. The host
    using that IP address is responsible for generating a reply message containing
    its MAC address, which it transmits as a unicast. The original receiver therefore
    receives the MAC address it it needs, but at the same time, the switches processing
    the ARP messages are adding those MAC addresses to their own forwarding tables.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'In addition to the protocol itself, ARP maintains a cache of IP addresses and
    their MAC address equivalents. Systems search the ARP cache for IP addresses before
    they generate new ARP request messages. There is also an ARP utility with which
    users can add static entries or remove them from the ARP table, or just display
    the contents of the cache, as follows:


    ```

    Interface: 192.168.5.22      0xe

    Internet Address Physical Address Type

    192.168.5.1         28-80-88-1e-87-e5 dynamic

    192.168.5.12        b4-b8-b8-d2-18-69 dynamic

    192.168.5.255      ff-ff-ff-ff-ff-ff static

    224.0.0.2           01-00-5e-00-02 static

    239.255.255.250    01-00-5e-ff-fa static

    255.255.255.255    ff-ff-ff-ff-ff-ff static

    ```


    On networks using IPv6, the equivalent to ARP is the Neighbor Discovery Protocol
    (NDP). NDP performs the same address resolution as ARP, but it does so without
    broadcasts (because there are no broadcasts in IPv6). Instead, it multicasts using
    Internet Control Message Protocol version 6 (ICMPv6) messages. As with ARP, the
    system generating the messages transmits them.


    # Connecting Switches


    Switches are typically marketed by the number of ports they provide. Simple switches
    might have four or eight ports, high-end devices have 24 or 48. For large enterprise
    networks, switches are rack-mountable, and administrators can link them together
    to create larger networks.


    On an Unshielded Twisted Pair (UTP) network, a host transmits a packet by sending
    signals out the Trans wire inside the cable. At the destination, those signals
    must arrive over the Receive wire. Therefore, at some point the cable connection
    between the two hosts, there must be a crossover between the Trans and Receive
    wires. For a UTP LAN are always "straight through," meaning that each pin in the
    connector at one end is wired to the corresponding pin at the other end. Therefore,
    necessary crossover between the Trans and Receive must occur inside the switch.


    When connecting two switches, administrators must be careful to avoid double crossover
    situation, in which one switch is transposing the wires and the other is transposing
    them back. For example, this would occur if the switches were connected by a patch
    cable plugged into a standard port on each one. To avoid the double crossover,
    switches can use any of the following techniques:


    # Crossover Cable


    For a low-end switch with no other capabilities, a special UTP cable with the
    Trans and Receive wires transposed—called a crossover cable—can connect two switches.


    # Uplink Port


    Some switches are equipped with a designated uplink port, which is a port that
    either does not have a crossover circuit or has a toggle to enable and disable
    it.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'To connect two switches, plug a standard patch cable into the uplink port on
    one switch and a standard port on the other. Connecting an uplink to an uplink
    would negate the crossover.


    # **Auto-Medium-Dependent Interface Crossover (MDI-X)** Some newer switches can
    automatically sense the Transmit and Receive in the connected cables and enable
    or disable the crossover for the port as needed.


    # Switching Loops


    Large enterprises have dozens or even hundreds of switches, and it is common practice
    to create redundant links between them, for fault tolerance purposes. When a host
    transmits a packet, it travels over its connected switch. if switch has redundant
    connections to two other switches, each of the other switches will receive an
    identical copy of the packet. The other switches then forward the packets over
    their own redundant connections, so more copies of the packet starting around
    the network. This is called a *switching loop*, and it can monopolize large amounts
    of bandwidth and cause corruption of the switch MAC addresses.


    There is no Time-to-Live field in data layer switching, as there is in network
    routing, packets do not expire; they circulate endlessly. The situation only occurs
    when a host generates broadcast transmissions, which the switches forward out
    through all of their ports, flooding the network with hundreds or thousands of
    copies. This is called a *broadcast storm*.


    To avoid loops and broadcast storms, switches typically use a protocol called
    the *Spanning Tree Protocol* (STP). STP is a protocol that allows switches to
    communicate and organize the switching fabric of the network.


    Using bridge protocol data units (BPDUs), one switch is elected to the role of
    *root bridge*, and every root bridge has a designated *root port*. These selected
    elements work to elect one port on each network segment as its *designated port*.
    The designated port is the one that forwards traffic to other switches.


    All of the other ports—the designated ports—are blocked to data traffic by switches
    to prevent looping but continuing to receive STP communications from other switches.
    This communication allows the switches to self-adjust when a link goes down and
    a designated port becomes unavailable. In that case, one of the nondesignated
    ports is elected to take over and transitions through several operational phases
    to becoming the designated port for the segment.


    The convergence period of the original STP—published by the IEEE 802.1 working
    group in 1990—is fifty seconds. Convergence is the time needed to configure all
    of the ports in a switch with its STP roles. Each time there is a change in the
    switching fabric of the network, such as a link to a designated port goes down,
    there is a 50-second convergence delay as the switches readjust.


    In 2001, the working group published a revised version of the STP technology called
    Rapid Spanning Tree Protocol (RSTP), which modifies some of the port designations
    and'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Switching 135


    transition phases, as well as the process by which switches calculate their port
    roles. The result is a greatly reduced convergence period, down to 5 seconds to
    50.


    # VLANs


    As noted earlier, switches create a separate collision domain for each pair of
    connected devices, eliminating the collisions and the media access control problems
    that occur on hub-based networks. however a network connected with switches is
    still one big broadcast-domain. On a large network with many switches, the propagation
    of broadcast messages to all the switches and generates a huge amount of traffic
    throughout the network.


    It is possible, however, to segment a switch into multiple broadcast domains by
    creating virtual local networks (VLANs). This also makes it possible to secure
    a group of hosts by adding to a VLAN that isolates them from the other VLANs on
    the network.


    By default, switches that support VLANs have a default VLAN, typically called
    VLAN1. All of the switch''s ports frame them by default, resulting in a single
    broadcast domain. Administrators can then create additional VLANs on the switches,
    calling them by the VLAN name plus, and add ports to the VLANs as needed. Each
    new VLAN becomes a separate broadcast domain.


    VLANs are virtual, but they are functionally the same as if they were separate
    physical networks. With physical VLANs, the only way for VLANs to communicate
    with each other is through routing. The routing can be virtual as well, which
    is how multilayer switches with routing capabilities built into them work.


    # Trunking


    A VLAN can have ports from any switch in the network in it, as long as the switches
    are connected in such a way that the ports in a VLAN can communicate with each
    other. To make this possible, each switch must have a port dedicated to inter-switch
    communication called a trunk port. The trunk ports in the switches exchange all
    traffic, regardless of the VLAN it belongs. The other ports—called access ports—carry
    only the traffic for the VLANs to which they are assigned.


    Trunk ports work with traffic from all of network''s VLANs at once, so switches
    have a means of identifying the VLAN for each packet. This is 802.1Q tagging.
    IEEE 802.1Q is a standard that defines the format of a 4-byte field that adds
    to the Ethernet header of each frame they transmit using the trunk port. This
    field contains a 12-bit VLAN identifier value, which means the network can support
    up to 4,094 (2¹²-1) VLANs.


    Only trunk traffic includes an 802.1Q field in each packet. When a switch receives
    incoming traffic that is destined for a host in the same VLAN and connected to
    the switch, it forwards the packets directly to the host using its access port.
    However, if the destination is in the VLAN but physically connected to another
    switch, the sending switch adds 802.1Q field to the packets and sends them out
    to other switches through its trunk port. The switch to the destination host is
    connected receives the packets over its trunk port, removes the 802.1Q tags, and
    then forwards the packets to the destination host using its access port.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Voice VLANs


    As a general rule, an access port on a switch can only be associated with one
    VLAN. However, with most networking rules, there is an exception. On some switches,
    it is possible to create a VLAN that allows administrators to prioritize VoIP
    traffic over standard data traffic, leaving the default VLAN in place to accommodate
    the data traffic. This makes it possible to power a VoIP phone and the computer
    with a single switch port.


    Plugging the phone into the switch port and the computer into the phone''s auxiliary
    jack connects both to the network. The packets carrying VoIP traffic are tagged
    with a 4-byte field in the Ethernet header, similar to 802.1Q tagging. Ordinary
    data packets are left untagged. VoIP phones can scan packets for the tags. They
    process the tagged packets as voice traffic and forward the untagged packets to
    the computer.


    # EXAM TIP


    The Network uses the term virtual local area network to refer to regular VLANs
    and distinguish them from voice VLANs. The term is nonstandard, however, and exam
    candidates should know that it refers to a normal VLAN.


    # Port Configuration Settings


    The simplest unmanaged switches, intended for home and small office use, have
    a row of UTP ports and a power cable. There is nothing to configure. Higher-end
    managed switches have a variety of settings that administrators can configure,
    many of which they can set for each port individually.


    The administrative interface of a managed switch varies by product and manufacturer.
    Some switches have a console port, into which it is possible to plug a laptop
    running a terminal emulation program with a command-line interface. This is called
    in-band management. Other switches require administrators to access the switch
    over the network connection. Still other switches include a built-in interface
    that provides the switch with a graphical configuration interface. These are examples
    of out-of-band management.


    Some of the configurable features often found on managed switches are as follows:


    # Duplex


    Most switches autodetect the traffic on the network and use full duplex communication
    by default, which allows hosts to transmit and receive data simultaneously. Older
    (usually hub-based) networks use half duplex communication, meaning that hosts
    can transmit or receive data at any one time, but not both. Although it is rarely
    necessary... duplex communication for a particular port.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'The speeds of the Ethernet networks have increased over the years, but the
    standards are backward compatible. Connecting a Fast Ethernet port to a Gigabit
    switch causes the switch port to adjust its speed from 1,000 to 100 Mbps. It is
    also possible to manually configure a switch port to a specific speed, but this
    is not usually necessary.


    # Port Aggregation


    A mechanism for combining the bandwidth of two or more ports to create a single
    aggregated port with increased bandwidth. Many switches use the Link Aggregation
    Control Protocol (LACP) to manage port aggregations.


    # Flow Control


    An Ethernet standard for the regulation of transmission based on network congestion
    levels. A host can generate an Ethernet Pause frame with a delay value, which
    causes the switch to stop forwarding traffic to that host until the delay expires
    or the host sends another frame with a delay value of 0.


    # Port Mirroring


    Switches forward packets only to the destinations, which makes it difficult for
    administrators to monitor network traffic for a specific port. Port mirroring,
    when enabled, creates a relationship between the selected port and another unused
    port. This allows administrators to connect a protocol analyzer to the mirror
    port and capture network traffic.


    # Port Security


    To help prevent intruders from connecting unauthorized devices to the network,
    administrators can secure individual switch ports by specifying the MAC addresses
    of the only devices permitted to use them.


    # Jumbo Frames


    In the IEEE 802.3 standards, the default maximum payload size for an Ethernet
    frame is 1500 bytes. However, Ethernet equipment manufacturers have for years
    supporting larger frame sizes, collectively called jumbo frames. Jumbo frame sizes
    can vary, but a 9,000-byte maximum payload is common. Jumbo frame capability is
    not defined in any of the 802.3 standards, and administrators can configure switch
    ports to support it or not. Using jumbo frames on a network, all of the switches
    and adapters processing the packets must have the feature it enabled.


    # Power over Ethernet (PoE)


    A standard published by the IEEE 802.3 working group defines a method for Ethernet
    networks to supply power to remote devices over UTP cables. These devices such
    as Voice over IP (VoIP) phones, wireless access points, and remote video cameras
    to function on the network without the need for a separate power source. The first
    PoE standard called for the transmission of 12.95 watts of power. In later standards,
    Power over Ethernet Plus (PoE+) increased the power to 25.5 watts, and PoE++ increased
    it further, with power levels of 51 and 71.3 watts.'
  merge: -1
  img_proc: true
