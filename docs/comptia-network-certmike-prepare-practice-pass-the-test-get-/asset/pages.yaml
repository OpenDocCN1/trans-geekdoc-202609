- pgno: 152
  md: '30 seconds. Routers receiving the transmissions incorporate the information
    in their own routing tables, modifying the metric values to reflect the distance
    from the transit-routing router.


    The first RIP standard was published in 1988, but it has since been enhanced several
    times, as follows:


    +   - RIP Version 1 (RIPv1) Transmits the entire routing table using broadcast
    messages; supports classful addresses only; does not transmit subnet masks


    +   - RIP Version 2 (RIPv2) Transmits the entire routing table using multicast
    messages, supports classless addressing; includes a subnet mask for each entry


    +   - RIP Next Generation (RIPng) Transmits the entire routing table using IPv6-mult-cast
    messages


    RIP is a distance vector routing protocol, which means it measures the distance
    between routers in terms of the number of hops between them. Each hop represents
    one router that packets must pass through to the destination. Therefore, traffic
    destined for a network that is 10 hops away must be forced by 10 routers to get
    there.


    # Open Short Path First (OSPF)


    Distance venturing is not a precise way to measure the proximity of a router.
    A single hop could be a local area network (LAN) connection to 1,000 Mbps, or
    it could be a much slower area network (WAN) connection. This is why many of the
    other routing protocols use alternative measurements to calculate their metric
    values.


    Open Short Path First (OSPF) is an open standard link routing protocol. Unlike
    distance vector protocols, link state protocols gather information about the network
    by transmitting messages. Using the information in the LSAs, the routers create
    a neighbor table and a topology table, essentially a map of the entire network.
    The routers then use information to build their routing tables.


    Unlike distance vector protocols, link state protocols use various criteria to
    calculate the efficiency of routes through the network. In addition to hop counts,
    OSPF factors in the transmission speeds of the various network links, the current
    levels of traffic congestion on the various routes, and a cost specified by an
    administrator. The routers then use the Dijkstra algorithm to calculate the relative
    efficiency of routes to a given destination. OSPF routing tables supports multiple
    routes to the same destination with the same metric and administrative values.
    When this occurs, the router balances the outgoing traffic among duplicate routes.


    Unlike RIP, OSPF does not transmit its entire routing table at regular intervals.
    Instead, it updates containing only the data that has changed, which conserves
    bandwidth and speeds up convergence. OSPF also does not have a hop limit, as RIP
    does. OSPF has many advantages over RIP, including route efficiency and convergence
    speed, but it also requires more processing power, memory, and storage from the
    router.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Chapter 10 • Routing and Bandwidth Management


    Enhanced Interior Gateway Routing Protocol (EIGRP)

    nThe Enhanced Interior Gateway Routing Protocol (EIGRP) is an updated version
    of the ear-lier Gateway Routing Protocol (IGP). Although ostensibly a distance
    vector protocol, EIG is sometimes referred to as a hybrid routing protocol because
    it includes both distance vector and link state routing characteristics.


    EIGRP uses neighbor discovery to gather information about other routers. The protocol
    encapsulates its messages directly within IP datagrams; there is no TCP or UDP
    port number. Using the neighbor discovery information, the router creates a neighbor
    table and a topology table, much as in SPF. The topology table contains all the
    routes gathered from other routers. After calculating the best route to each network
    destination, the router places the entries in the routing table.


    EIGRP does not rely solely on hop counts to calculate metrics; it also considers
    characteristics of the link to the destination network, including its bandwidth,
    traffic congestion, transmission delay, reliability, and its maximum transfer
    unit (MTU). To calculate the relative efficiency of a route, EIGRP uses the Diffusing
    Update Algorithm (DUAL).

    RIP transmits distance updates to other routers. However, it does not send the
    entire routing table as RIP; it generates incremental updates containing only
    the information that changed, much like SPF.


    Compared to RIP, EIGRP is much more scalable, due to its support for merging autonomous
    systems. An autonomous system (AS) is a group of adjacent routers that share their
    routing tables and the same routing protocol. This capability enables EIGRP to
    support large networks by splitting them into multiple AS.


    # Border Gateway Protocol (BGP)


    RIP, SPF, and EIGRP are all interior gateway protocols, meaning they are intended
    for use within an enterprise network. Border Gateway Protocol (BGP) is an exterior
    gateway protocol. In fact, BGP is the exterior gateway protocol, responsible for
    the IPv4 and IPv6 routing between autonomous systems all over the Internet. The
    routers in an AS with other routers using BGP are called border routers or edge
    routers.


    BGP is classified as a path routing protocol. This is similar to a distance vector
    protocol, except that it carries AS path information with other routers, such
    as the numbers of the autonomous systems on the way to the destination and the
    addresses of the networks inside an AS, than just hop count.


    While it is possible to use BGP within an AS as an interior gateway protocol,
    in case it is called the Interior Border Gateway Protocol (IBGP), RIP and SPF
    are better suited to that role. In the case of a large enterprise network connecting
    multiple autonomous systems, an interior protocol such as RIP or SPF might be
    suitable for handling the volume of routing within each AS, but not for the routing
    between ASs, which might require a more scalable protocol such as BGP.

    RIP and SPF could never handle the volume of routing needed for a multihomed Internet
    router (eBGP) router. A BGP router on the Internet must discover all the routes
    between ASs, which are in hundreds of thousands. The complete IPv4 routing table
    for the Internet is nearly a gigabyte in size, and AS needs substantial processing,
    memory, and storage resources to manage it.'
  merge: -1
  img_proc: true
