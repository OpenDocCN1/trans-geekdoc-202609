- pgno: 284
  md: '# CHAPTER 21


    # Network

    Troubleshooting

    Methodology


    # Objective 5.1:

    Explain the network

    troubleshooting

    methodology.


    **Troubleshooting** is the process of identifying a problem and formulating a
    solution to that problem. In a network environment, there are many variables that
    can be potential sources of trouble, and the process of identifying and addressing
    it can be complicated. For this reason, it is important that the troubleshooting
    process be conducted methodically and scientifically so that other IT personnel
    can track what has been done about the problem and what is expected to be done.


    In this chapter, you''ll learn everything you need to know about the troubleshooting
    methodology defined in Network+ Objective 5.1, including the following topics:


    +   - Identify the problem

    - Establish a theory of probable cause

    - Test the theory to determine the cause

    - Establish a plan of action to resolve the problem and identify potential effects

    - Implement the solution or escalate as necessary

    - Verify full system functionality and, if applicable, implement preventive measures

    - Document findings, actions, outcomes, and lessons learned'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# IDENTIFY THE PROBLEM


    The first step in troubleshooting is identifying exactly the problem is. In a
    network environment, this can often be the most difficult part of the process.
    The troubleshooter frequently to gather information from multiple sources and
    weigh that information to determine what is pertinent to the problem-solving process.
    This section describes the various steps in this information-gathering process.
    However, the steps are not necessarily in the order shown here.


    # Gather Information


    In this step, the troubleshooter functions like a forensic investigator at a crime
    scene, collecting all evidence that could possibly help the troubleshooting process.
    This might include error messages, log entries, and descriptions of what happened.
    Going beyond this, it might be necessary to note network and device conditions
    at the time of the problem, collect core dumps and log files, and speak to users
    about their experiences of the problem.


    # Question Users


    Gathering information from end users is a skill that IT personnel develop over
    time. Users might know something about networking, or they might know nothing
    at all. IT people have to learn the right questions to ask to glean pertinent
    information from users about the problem at hand.


    Some users might know very little about how the network functions, or even that
    is one. Questioning these users requires some skill in describing what is happening
    in their computers without confusing them too much. For example, an IT tech might
    instruct a user on how to locate their computer''s IP address, there''s no need
    to describe the details of IP addressing.


    Perhaps more difficult to handle are the users who know a little about networking
    and insist on diagnosing the problem themselves. The trick is to not let the user
    digress from the immediate problem or get caught up in lengthy explanations of
    why the user''s diagnosis is incorrect.


    # Identify Symptoms


    Identifying the symptoms of a problem helps IT technicians to determine the severity
    of the issue and its scope. While there might be one user reporting a problem
    right now, it is important to determine whether other users are affected as well.
    This not only helps the troubleshooter locate the source of the problem, but also
    helps the IT department to establish appropriate service priorities. Obviously,
    an issue that affects an entire network must be assigned a higher priority than
    one that affects a single user.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'For example, in the case of a network slowdown, the following questions can
    help trouleshooters identify the symptoms of a problem:


    +   - Are all of the user''s applications affected or just some of them? Which
    ones?

    - Is the network slowdown continuous or intermittent? When or under what conditions
    slowdowns occur?

    - Are other users experiencing the same problem? What other users?

    - How far does the problem extend from the initial complaint? Is the entire network
    affected or just the immediate area?


    # Determine if Anything Has Changed


    One of the most important questions IT personnel might ask of end users is whether
    anything in their computer hardware, software, or configuration settings has changed
    recently. A new piece of hardware or software or a change in configuration settings
    can easily be the cause of many common problems.


    However, getting users to admit to changes can sometimes require additional interrogation.
    As a result, IT people should be familiar with the log files and places where
    types of changes are documented so that they can determine for themselves what
    recent modifications have been made.


    # Duplicate the Problem, if Possible


    One of the most common experiences for IT helpdesk personnel is being told by
    users that they have received an error message. When asked what the error message
    said, users frequently have no idea. When this occurs, the next step is to try
    reproduce the error by having users repeat their actions. A problem that can readily
    be duplicated is much easier to troubleshoot one that appears intermittently.


    # Approach Multiple Problems Individually


    A problem does not necessarily have only one cause. For example, users reporting
    a significant reduction in network speed does not mean that there is just one
    problem causing the bottleneck. There can be several contributing factors, so
    IT technicians should not stop troubleshooting when they detect one cause of a
    problem. There might be others, so a properly methodical troubleshooting procedure
    should proceed until all possible causes have been examined.


    When a troubleshooter detects multiple problems that each require remediation,
    the best practice is to approach the problems individually, creating a separate
    trouble ticket for each one. This ensures that each of the problems receives its
    due attention and also allows supervisors to delegate the various issues to different
    personnel.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# ESTABLISH A THEORY

    OF PROBABLE CAUSE


    After identifying the problem, the next step in a scientific troubleshooting method
    is to hypothesize a theory of the problem''s possible cause. The first probable
    cause a troubleshooter comes up with might not the correct one, however. At this
    point, it is still just a theory. In fact, it might be necessary to repeat this
    theory several times and test several possible causes.


    # Question the Obvious


    When hypothesizing about the possible causes of a problem, it is important not
    to neglect the most obvious ones. In the case of a network communication failure
    on a particular workstation, for example, before initiating a detailed protocol
    analysis of the network''s traffic, a troubleshooter should make sure the network
    cable isn''t plugged in and that otherwise, simply causes have never been overlooked.


    # Consider Multiple Approaches


    To prove a cause, troubleshooters should work methodically through a process that
    investigates all of a problem''s possible causes. There are several approaches
    that break down the networking process for examination, including the following:


    +   * **Top-to-bottom/bottom-to-top OSI model:** Proceeding through the layers
    of the OSI model, either upward or downward, is one to perform a comprehensive
    examination of the networking process in relation to the problem. As troubleshooters
    gain experience, they typically develop instincts about the general location of
    a particular type of problem, which enables them to decide whether it would be
    more efficient to proceed through the OSI model from the top or the bottom.

    * **Divide and conquer:** In some cases, the troubleshooter''s instinct might
    point to a possible cause somewhere in the middle of the OSI model. Instead of
    wasting time starting from the top or bottom layer and working towards the middle,
    a divide and conquer approach might be preferable, in which the troubleshooter
    starts from the suspected layer and works up or down from there. In the same way,
    a troubleshooter might be able to divide a process into multiple subprocesses
    and examine each one individually.


    # TEST THE THEORY

    TO DETERMINE THE CA


    Once a troubleshooter has a theory of probable cause, the next step is to perform
    tests to confirm or disprove the theory. Note, however, that step in the process
    is devoted to testing the efficacy of the theory only. This is not the time to
    actually address the problem.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Establish a Plan of Action to Resolve the Problem and Identify Potential
    Effects 257


    For a simplistic example, a troubleshooter might be investigating why a particular
    server is not available on the network and arrive at the theory that the server
    might be powered down. To test the theory, the troubleshooter should go to the
    server closet and see that the server is indeed powered down.


    However, this does not mean that the troubleshooter should resolve the problem
    by switching the server back on right then. There could be any number of reasons
    else powered the server down, and resolving the problem requires a carefully planned
    course of action after investigating these reasons. In a simple situation like
    this, troubleshooters should follow a prescribed method.


    Depending on the results of the testing, the troubleshooting process should continue
    in one of the ways:


    **If the theory is confirmed, determine the next steps to resolve the problem.**
    Testing a theory of probable cause is usually more complicated than visually inspecting
    a component. The test should be carefully planned and executed. After confirming
    a theory of probable cause, the troubleshooter can go on the next step: creating
    a plan for resolving the problem.


    **If the theory is not confirmed, establish a new theory or escalate.** When testing
    indicates that the troubleshooter''s hypothesis is incorrect and the suspected
    case is not the source of the problem, then the troubleshooter must repeat this
    process by devising another theory of probable cause and testing it. If the theory
    is incorrect and the troubleshooter is not able to come up with another probable
    cause, then it is time to escalate the problem within the IT department or consult
    a third party.


    > EXAM TIP The network troubleshooting methodology described in this objective
    provides high-level guidance, but it does not include the specific details of
    how the troubleshooter should go about identifying the problem, establishing a
    theory of probable cause, and testing that theory. However, candidates for the
    Network exam are expected to be familiar with the tools and procedures for doing
    these things, as discussed in the previous chapters.


    # ESTABLISH A PLAN OF ACTION TO RESOLVE THE PROBLEM AND IDENTIFY POTENTIAL EFFECTS


    After a troubleshooter successfully identifies the cause of a problem, they can
    proceed to create a detailed plan of action for resolving it. In the previous
    example, the actual solution to the problem might be simply switching on the server
    that was found to be powered down. However, in a methodical troubleshooting process,
    it is important to consider all the possible side effects the solution might have
    on the rest of the network.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Before switching the server, the troubleshooter must determine why it is off
    in the first place. Was it powered down deliberately by another technician, or
    did some operative condition cause it to power down by itself? If someone else
    in the IT department is working on that server, there should be records of that
    process that specify what is happening.


    If there no apparent reason why the server was powered down, the troubleshooter
    might have to check the logs on the server itself to determine what happened.
    If there is a server malfunction that shut the computer, then this would lead
    to the creation of an entirely new ticket for the malfunctioning server. The entire
    troubleshooting process would then repeat from the beginning.


    It is also important for the troubleshooter to consider all possible ramifications
    of the resolution process and incorporate them into the plan of action. In many
    situations, fixing one problem could conceivably cause another one, and troubleshooters
    must try to anticipate these possibilities. If a troubleshooter suspects that
    a dangerous side effect of the solution would affect network productivity, the
    plan of action could call for the solution to be implemented during non-business
    hours. There should also be a detailed rollback plan in place if the solution
    ends up worse than the original problem.


    Here again step in the troubleshooting process calls only for the plan of the
    solution, not its implementation. In many cases, troubleshooters might have to
    seek approval from supervisors before the actual implementation can occur. It
    might also be necessary to seek permission from (or at least notify) other departments
    when a service interruption is expected.


    # IMPLEMENT THE SOLUTION OR ESCALATE AS NECESSARY


    With a plan of action in place and all the necessary approvals and permissions
    secured, the troubleshooter can proceed to implement the solution to the original
    problem. As in the example mentioned earlier, the implementation of the solution
    might be as simple as flipping a power switch. However, it can also be much more
    complex and require additional IT resources, such as help from other technicians,
    replacement hardware components, or assistance from outside service providers.


    In some cases, the implementation of a particular solution might be beyond a troubleshooter''s
    job description and require the case to be escalated to a more senior technician
    for implementation. For example, a troubleshooter''s plan of action might include
    changes to the configuration of certain switchports in the data center. If the
    troubleshooter is not authorized to access the switches or make those changes,
    then they will have to escalate the implementation—or at least part of it—to someone
    who is authorized.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# VERIFY FULL SYSTEM FUNCTIONALITY AND, IF APPLICABLE, IMPLEMENT PREVENTIVE
    MEASURES


    After implementing a solution, the next step is to reproduce the original problem
    to determine whether the solution was effective. If the problem still exists,
    the trouble-shooter will go back and try another theory of probable cause.


    Whether or not the solution is successful, the troubleshooter must attempt to
    recognize the full effect of the attempted solution by checking that all functions
    return to the original problem are operative. If the solution is not effective,
    then the best practice might be to reverse the changes to avoid any side effects
    of the modifications.


    If the solution addresses the problem successfully, the troubleshooter should
    also consider the possibility of the same problem occurring again. If possible,
    the troubleshooter might propose additional modifications as preventive measures.
    For example, if the trouble-shooter determines that the server in the previous
    example shut itself down due to a driver issue and installing an updated driver
    resolves the problem, then it might be a good idea to install the update on all
    other servers using that driver.


    # DOCUMENT FINDINGS, ACTIONS, OUTCOMES, AND LESSONS LEARNED


    Documenting the troubleshooting process and its results is something that should
    occur throughout the procedure, not just at the end. In an enterprise network
    environment, it is important for there to be a record of what the troubleshooter
    has learned and done. This enables other IT personnel to learn what problems have
    occurred and what solutions have been tried. The records can prevent other troubleshoothooters
    from having to repeat the same steps. When troubleshooters first start working
    on a problem, part of their information gathering process should include checking
    for any documentation of prior occurrences.


    The documentation should include as much detail as possible about the problem,
    its symptoms, and its effects on the network, as well as an account of the entire
    troubleshooting process, including all of the information discovered and actions
    taken by IT personnel. A troubleshooting procedure might not all be completed
    at once, and not necessarily by the same person. Proper documentation enables
    anyone in the IT department to take over the process, if necessary.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# CERTMIKE EXAM ESSENTIALS


    +   - Network troubleshooting can often be an instinctive process, but in an enterprise
    environment, it should proceed methodically, according to a documented series
    of steps.


    +   - The troubleshooting method defined in the Network+ objectives consists of
    the following steps: identify the problem, hypothesize a theory of probable cause,
    test the theory, design a plan of action to solve the problem, implement the plan,
    verify the results, and document the entire troubleshooting process.'
