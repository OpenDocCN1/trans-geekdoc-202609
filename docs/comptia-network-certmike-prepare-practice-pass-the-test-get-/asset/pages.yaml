- pgno: 47
  md: '# Practice Question Explanation


    A. is incorrect because the physical layer provides the connection to the network
    and implements the signaling algorithm that converts the data into the electrical,
    optical, or radio signals necessary for transmission. This layer does not manipulate
    or evaluate the data in any way, so it performs error correction.


    B. is incorrect because the data link layer is only concerned with local network
    communication. The data link layer performs a CRC calculation on each frame and
    includes the results in a frame check sequence field, but cannot perform end-to-end
    error detection and has no error correction capability.


    C. is incorrect because as connectionless protocol, it has no packet acknowledgment
    capability and therefore no error correction. The network layer performs error
    detection by a CRC code in its header. If a packet fails the CRC test, the network
    layer discards it and signals the loss to the transport layer.


    D. is correct because TCP, a connection-oriented transport layer protocol, performs
    its own error detection, but it also includes a packet acknowledgment service.
    The segments transmitted during a connection are numbered, so the acknowledgment
    messages generated by the receiver can specify the number of the last packet received.
    The sender processes these messages and automatically retransmits any unacknowledged
    packets.


    Correct Answer: D, Transport


    # Practice Question 2 Explanation


    A. is incorrect because the data link layer is only concerned with local network
    communications. The frame’s destination address does not identify the ultimate
    recipient of the packet, only the next recipient on the LAN.


    B. is correct because IP, at the network layer, is the protocol responsible for
    end-to-end transmissions between the packet’s sender and its ultimate recipient.
    The IP header therefore contains IP addresses the two systems.


    C. is incorrect because the transport layer headers do not contain addresses for
    the end systems. The transport layer protocols, TCP and UDP, provide services
    that support the end-to-end network communication process, but they rely on the
    network layer for addressing.


    D. is incorrect because the session layer provides functions that manage connections
    between end systems once they are established, but it does not have a dedicated
    protocol and has no addressing functionality.


    Correct Answer: B, Network'
