  md: '# CHAPTER 14


    # Organizational Documents and Policies


    # Objective 3.2: Explain the purpose of organizational documents and policies.


    This chapter examines some of the documentation procedures for a typical enterprise
    network. The Network+ exam expects candidates to be familiar with these basic
    networking concepts.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    3.2, including the following topics:


    +   - Plans and procedures

    - Hardening and security policies

    - Common documentation

    - Common agreements


    # PLANS AND PROCEDURES


    While small businesses often go without IT plans and procedures and documentation,
    preferring to deal with issues as they arise, larger businesses need them for
    the'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'network and its services to run smoothly. Plans are an early part of the process,
    beyond brainstorming. After appropriate discussion and consideration, plans become
    policies, documented rules that everyone must observe. Once policies are in place,
    it is common for organizations to develop procedures for implementing and enforcing
    them. This section describes some of the most commonly used plans and procedures
    for enterprise networks.


    # Change Management


    Change is inevitable in the IT business. Hardware and software need to be upgraded,
    network devices need configuration changes, departments might expand or contract,
    and personnel might enter or leave the company. Before IT personnel make any of
    the changes associated with these events, it is a good idea to assess their potential
    ramifications and present a proposal for the changes to a designated change management
    committee. This committee, typically composed of people from various departments
    and disciplines, evaluates changes from different perspectives and rules on whether
    they should be implemented.


    The proposal for a change might include the following elements:


    +   **Proposed Change** Describes in detail the changes that are to be made if
    the proposal is approved


    +   **Reasons for Change** Specifies why the proposed changes are necessary and
    how they will benefit the company


    +   **Change Procedures** Specifies how the changes will be implemented, including
    step-by-step procedures


    +   **Rollback Procedures** Specifies a plan for returning the network to its
    previous state if the proposed changes yield negative results


    +   **Personnel Required** Specifies who will be needed to implement the proposed
    changes and when


    +   **Maintenance Schedule** Specifies the time frame for the proposed changes
    and how long the implementation will take


    +   **Proposed Downtime** Specifies whether the proposed changes require an interruption
    of network services, and if so, how long an interruption and at what time of day


    +   **Required Notifications** Specifies who should be notified of events regarding
    the proposed changes, including the steps of the approval process and those of
    the actual change procedure


    +   **Approval Process** Specifies the steps of the approval process and lists
    the personnel who must approve the proposed changes


    +   **Documentation** Specifies in detail everything about the change proposal,
    and after the proposal is approved, documents the tasks involved in implementing
    the changes'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Plans and Procedures


    # 169


    # EXAM TIP


    While this discussion emphasizes change management in the IT department, in many
    organizations the change management infrastructure spans the entire firm, evaluating
    changes in personnel, finance, and the organizational structure of the company,
    as well as computer and network hardware and software. Candidates for the Network+
    exam should be aware that change management is not limited to the IT department.


    # Incident Response Plan


    The Network+ covers three types of contingency plans: incident response, disaster
    recovery, and business continuity. The three plans differ primarily in the severity
    of the incident that triggers them. An incident is any event that interferes with
    the smooth operation of the company''s business. It can be anything from an Internet-based
    attack on the computer network to a catastrophic event that endangers not only
    the network but the company''s employees well.


    An incident response plan includes the policies and procedures that IT personnel
    should follow when an incident of a specific type occurs. When an attack comes
    from outside the network, for example, the incident response plan should include
    the procedures for protecting the network and its data, including diagnosing and
    remediating the attack, while providing evidence that might be needed to identify
    the attackers, prosecute them, and prevent the same type of attack from happening
    again.


    # Disaster Recovery Plan


    Most of the incidents accounted for in the incident response plan are relatively
    minor, internal matters, but incidents that are extreme enough to be considered
    a disaster are handled differently. A disaster is any event that causes significant
    damage to the network infrastructure that prevents the business from functioning.
    Disasters typically fall into three categories: catastrophic equipment failures,
    natural disasters, and user error.


    A disaster recovery plan has the goal of getting the network back to a functional
    state that was damaged in the disaster. One aspect of the plan deals with replacing
    hardware that can maintain a store of redundant equipment for this purpose or
    having standing orders with vendors that can fix quickly. The other, most crucial,
    of a disaster recovery plan is protecting and restoring the company data to operational
    status.


    Protecting the company data from disaster requires planning and procedures before
    any disaster occurs, in the form of offline backups that are available to the
    disaster recovery team immediately after the incident. In addition to the application
    data that the network''s users need, backups suitable for disaster recovery should
    include the configuration data and system state for all of the network devices
    affected. This additional data enables the disaster recovery team to restore the
    network infrastructure more quickly because they do not have to re-create the
    device configurations manually. Finally, the'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'document should include detailed procedures specifying the duties of each member
    of the disaster recovery team when an incident occurs.


    # Business Continuity Plan


    While a disaster recovery plan is designed to get the network up and running at
    the site of the event, there are some disasters for which this is not possible.
    If the network infrastructure is large or completely destroyed by a major catastrophe,
    such as a hurricane or other natural disaster, a business continuity plan describes
    the contingencies for restoring the network to functionality at a remote site.


    Like disaster recovery, business continuity requires considerable planning and
    preparation before any damage occurs. Depending on the size of the organization,
    Budget, and how vital it is to get the network back into operation as possible,
    a business continuity plan might range from rebuilding the network elsewhere to
    fully operational redundant data centers in other cities. The plan should also
    include instructions for the succession of personnel, specifying who should do
    what job in the remote location and who should take over if someone is unavailable.


    For more information on disaster recovery and high availability concepts, Chapter
    14, "High Availability and Disaster Recovery."


    # System Life Cycle


    As years pass, computer and network equipment depreciates, and obsoes and must
    eventually be replaced. Each type of device has its own system life cycle, and
    in a well-run enterprise network, those life cycle consists of the following phases:


    # Evaluation and Purchasing


    Before purchase, IT personnel typically evaluate devices by comparing specifications,
    physical examination, and in some cases, a period of in-house testing. The purchasing
    process might include negotiation with vendors that involves exclusive or financial
    personnel from other departments.


    # Acquisition and Deployment


    After purchase, new devices must be inspected and registered as an asset of the
    company, both on paper and by the use of serialized asset identification devices.
    Devices are prepared for deployment by the installation and configuration of operating
    systems, applications, and other software, either manually or by an automated
    process.


    # Maintenance and Upgrading


    Once deployed, all devices need monitoring to some degree, and also require regular
    software or firmware updates. Maintenance processes can be the responsibility
    of the users or the IT department.


    # Decommissioning and Retirement


    As a device nears the end of its life, its replacement should already be somewhere
    in the first phase of its life cycle. Decommissioning must include the permanent
    erasure of all licensed software and data. Retirement can consist of reassignment
    to another less critical task, resale outside the company, and responsible disposal
    of the device.'
  merge: -1
  img_proc: true
