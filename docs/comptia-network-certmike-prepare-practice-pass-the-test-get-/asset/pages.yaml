- pgno: 276
  md: 'side to side and arranged in aisles. Depending on the hardware selected and
    the organization''s security, the individual racks might be enclosed, with a locking
    door each. Even if the racks are locked in a locked closet or data center, it
    is still a good idea to keep the racks locked and provide keys only to those who
    need them. Granting a person access to the data center itself does not necessarily
    mean that the person needs access to all of the network equipment.


    # Locking Cabinets


    In large data centers, every row of equipment racks are enclosed within clear-walled
    cabinets or mesh cages, which are also locked. Locking cabinets are particularly
    necessary in large facilities that have equipment belonging to multiple clients.
    The cabinets or cages might use metal keys, but any of the badge-based and biometric
    locking solutions discussed earlier serve.


    # Access Control Vestibule


    One method for gaining illicit into a secure area is to follow closely behind
    an authorized user as they go through the door, a technique known as tailgating.
    The best solution for preventing this type of intrusion (apart from user education,
    as noted earlier in this chapter) is a security guard checking IDs, but is an
    expensive proposition that might not be feasible or practical in many situations.


    Another effective—one that does not require guards—is an access control vestibule,
    also known as a mantrap. An access control vestibule is a short corridor with
    a secured door at each end, located at the entrance to a sensitive area. The doors
    are designed so that each requires some form of authentication, and when the door
    at one of the vestibule is open, the door at the other is locked. This prevents
    multiple people from passing through the vestibule at once. Live or video monitoring
    of the people passing through the vestibule can add further security.


    An access control vestibule is typically used only for facilities requiring high
    security, but the vestibule can also combine its security function with other
    necessary functions, such as environmental preparation solutions. For example,
    entrance to a clean room or biohazard zone might require clothing changes, showers,
    and other preparation, which can occur in the vestibule with the identification
    and authorization of the user.


    # Smart Lockers


    Smart lockers, which are commonly used for package deliveries by e-commerce retailers,
    can serve as a secure means to distribute anything to specific users in a company
    facility, such as laptops and other devices, or even packages.


    The lockers are connected to the Internet (or an internal network), so they can
    authenticate users. When something is delivered to a locker, the system sends
    an email or text message to the intended recipient with instructions containing
    some means of identifying them, such as a PIN or a barcode. Supp that information
    to the control panel in the bank of lockers causes the correct door to unlock,
    providing the user with access to its contents.'
