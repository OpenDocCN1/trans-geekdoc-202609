- pgno: 173
  md: '# WIRELESS NETWORKING


    Wireless networking has existed for decades, the wireless local area networks
    (WLANs) that we know as Wi-Fi were first standardized in 1997. Since then, wireless
    networking has become a critical part of business and residential computing. With
    the increasing use of smartphones and other mobile computing devices, WLANs provide
    network access to users without tethering them to the desktop.


    A simple WLAN consists of one or more wireless access points (WAPs) and a group
    of client devices that connect to it. In a residential or small office setting,
    the WAP is usually incorporated into a multifunction device that also includes
    routing and other capabilities. In an enterprise environment, which often has
    multiple WAPs to serve larger areas, the WAPs function as bridges (routers) between
    the wired Ethernet network. In that case, the WAPs function connected to a wired
    and wireless segments.


    # 802.11 Standards


    The Institute of Electrical and Electronics Engineers (IEEE) 802.11 working group
    has a series of wireless networking standards that represent the evolution of
    the underlying technologies. Wireless networks have become faster and more reliable
    over the years, and the standards reflect the changes they have undergone.

    The various 802.11 standards are identified by the letters following the working
    group number. There are equivalent designations created by the Wi-Fi Alliance.
    The various standards released over the years have increasing transmission speeds,
    in the frequencies they use and the number of MIMO streams they support. Table
    12.1 lists the various standards and their specifications. The earlier standards,
    such as 802.11, 802.11a, are rarely seen today.


    # TABLE 12.1 Wireless LAN standards


    | IEEE standard | Wi-Fi Alliance designation | Supported frequencies (GHz) | MIMO
    streams | Maximum speed (Mbits/s) | Year ratified |

    |---|---|---|---|---|-|

    | 802.11 | Wi-Fi 0 (unoficial) | 2.4 | N/A | 2 | 1997 |

    | 802.11a | Wi-Fi 2 (unoficial) | 5 | N/A | 54 | 1999 |

    | 802.11b | Wi-Fi 1 (unoficial) | 2.4 | N/A | 11 | 1999 |

    | 802.11g | Wi-Fi 3 (unoficial) | 2.4 | N/A | 54 | 2003 |'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Wireless Networking


    | IEEE standard | Wi-Fi Alliance designation | Supported frequencies (GHz) | MIMO
    streams | Maximum speed (Mbits/s) | Year ratified |

    |---|---|---|---|---|---||

    | 802.11n | Wi-Fi 4 | 2.4/5 | 4 | 600 (150 x 4) | 2008 |

    | 802.11ac |-Fi 5 | 5 | 8 | 6933 (86 x 8) | 2014 |

    | 802.11ax | Wi-Fi 6 | 2.4/5 | 8 | 9608 (1201 x 8) | 2019 |

    | 802.11ax | Wi-Fi 6E | 6 | 8 | 9608 (1201 x 8) | 2020 |


    # Frequencies and Range


    The earliest Wi-Fi networks use all the 2.4 GHz band, and many of them still consist
    of the 83 MHz between 2.4000 and 2.4835 GHz. The main problem with the 2.4 GHz
    band is the number of devices that use it. Apart from WLANs, there are many Bluetooth
    devices, microwave ovens, and other appliances that use the same frequencies,
    which has led to the band become crowded with signals in some locations.


    The 5 GHz band is less covered than the 2.4 GHz band and has a wider range of
    available frequencies, so there is generally less interference to be found. However,
    frequencies like 2.4 GHz have better ranges than higher ones, such as 5 GHz. This
    is because the 2.4 GHz signals are less likely to be absorbed by walls and other
    surroundings than the 5 GHz signals. The more signal that is absorbed, the less
    that reaches the destination, so the effective range of the network connection
    is reduced. The speed of the connection is also affected by the distance between
    the devices. Longer distances mean slower transmission speeds.


    The latest standard, a variation on 802.11ax called Wi-Fi 6E, uses the 6 GHz frequency
    band for the first time in wireless LANs.


    # Channels


    Wi-Fi divides the frequency bands into channels, which are discrete frequency
    ranges that wireless devices use to communicate with the network. The 2.4 GHz
    band, for example, consist of 14 channels, each 22 MHz wide. The channels are
    offset by 5 MHz each, resulting in an overlapping array like shown in Figure 12.1.


    Countries might their own laws regulating the frequencies that private networks
    are permitted to use. For example, the 2.4 GHz band has 14 channels, but networks
    in North America only use the first 11, due to these regulatory impacts. Channel
    14 is restricted, and while 12 and 13 are technically legal, Wi-Fi products in
    North America do not use them, to avoid getting too close to the forbidden frequencies.
    Networks in Japan are permitted channel 14, but for 802.11b networking.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Chapter 12 • Wireless Standards


    ![](img/131506e178f74f7b4704a0aa0fe03dae_175_0.png)


    FIGURE 12.1 22 MHz channels in the 2.4 GHz band


    # Channel Overlap


    Because the 2.4 GHz band is relatively narrow, there is a lot of overlap between
    channel frequencies. This can result in interference if there are two devices
    near each other using adjacent channels. In fact, to avoid interference from adjacent
    channels altogether on a 2.4 GHz network, only three channels are safe: 1, 6,
    and 11, as shown in Figure 12.2.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_175_1.png)


    FIGURE 12.2 Nonoverlapping 22 MHz channels in the 2.4 GHz band


    Many network administrators have made a standard rule to use only these three
    channels on their networks, even though every Wi-Fi technology uses the same channel
    spacing. 802.11g networks use a type of radiofrequency modulation that creates
    20 MHz channels instead of 22 MHz. Adjusting the overlap to account for the narrower
    bandwidth, the non-conflicting channels on an 802.11g network are 1, 5, and 9,
    as shown in Figure 12.3.


    In the 5 GHz band, there are many more channels, and overlap is not as much of
    a problem in the 2.4 GHz band. The 802.11a standard was the first to use the 5
    GHz band, and at the time, it was a high-priced alternative for networks that
    could not use 2.4 GHz.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Prices eventually came down, however, and beginning with the 802.11n standard,
    dual-frequency devices became common.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_176_0.png)


    FIGURE 12.3 Nonoverlapping 20 MHz channels on an 802.11g network


    # Channel Bonding


    Another feature included in the 802.11n standard is channel bonding, which is
    the ability to combine the bandwidth of adjacent channels to increase throughput.
    Two bonded channels provide 40 MHz of bandwidth, which is practical on a 5 GHz
    network, but not on 2.4 GHz network, which would be monopolized by just one bonded
    channel.


    In the subsequent 802.11ac and 802.11ax standards, the ability to bond channels
    is expanded, allowing multiple 20 MHz channels to be combined up to a 160 MHz
    channel throughput. As the bonded channels get larger, however, they consume more
    of the available bandwidth, so the network supports fewer of them. For example,
    bonding eight channels creates a 160 MHz connection, but a 5 GHz network can only
    support two of these connections. The same network could support up to 80 MHz
    or 12 MHz channels.


    # Service Set Identifiers


    A service set identifier (SSID) is the name by which a WLAN is identified on the
    network. Wireless access points advertise their SSIDs by transmitting beacon announcements.
    When connecting to a wireless network, a device receives the beacon announcements
    and displays a list of SSIDs identifying all of the WLANs in the area. In addition
    to SSID, access points have a 48-bit basic set identifier (BSSID). A network can
    have multiple access points serving the same set of devices with a single SSID,
    but each WAP has a unique BSSID, which is how they tell each other apart.


    SSIDs can be up to 32 bytes long and can also be configured with a null value
    what the 802.11 standards call a wildcard SSID. A wildcard SSID—sometimes called
    a nonbroadcast SSID—is still operational but does not appear in the list of advertised
    WLANs. Some administrators use wildcard SSIDs as a security mechanism, figuring
    that Intruders cannot attack a network if their SSID is not visible, but this
    is a technique that is only modestly effective.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Chapter 12 • Wireless Standards


    Three operational modes for wireless networks are defined in the 802.11 standards.


    **Basic Service Set (BSS)** Also known as infrastructure mode, a group of wireless
    devices using the same type of modulation, frequency band, and security protocol,
    connected to a single access point. All wireless communication goes through the
    WAP, whether to connect to other wireless devices or to a bridged Ethernet network.


    **Extended Service Set (ESS)** A collection of two or more BSSs that function
    together as a single network serving a common pool of wireless devices. All of
    the WAPs use the same SSID, and devices can roam from one WAP to another without
    having to reconnect. While not required, ESS use a wireless LAN controller (WLC)
    to authenticate, coordinate roaming among WAPs, and prevent channel interference.


    **Independent Basic Service Set (IBSS)** Also known as ad hoc mode, a point-to-point
    link between two wireless devices connected directly to each other without an
    intervening access point.


    # Encryption Standards


    To prevent unauthorized users from using a wireless LAN, the devices use a security
    protocol that protects the traffic between the clients and the WAP. As is typical
    with security protocols, they evolve over time as attackers develop exploits for
    the existing security.


    # WPA


    The first protocol developed for Wi-Fi, called Wired Equivalent Privacy (WEP),
    was found to be vulnerable and inadequate. To replace WEP, the Wi-Fi Alliance
    developed Wi-Fi Protected Access (WPA) in 2003. WPA uses 256-bit encryption keys,
    rather than the smaller keys that contributed to the vulnerability of WEP. WPA
    also introduced the Temporal Key Integrity Protocol (TKIP), which uses the same
    underlying cipher as WEP (called RC4) but adds a message integrity check (MIC)
    and other security features, in addition to the larger keys.


    # WPA2


    The similarities between WEP and WPA are deliberate so that existing devices with
    WEP could be upgraded to WPA with just a firmware update. However, the initial
    version of WPA was also found to be exploitable and was deprecated in 2006 in
    favor of Wi-Fi Protected Access 2 (WPA2), also known as 802.11i, which is the
    wireless encryption protocol used in common today.


    WPA2 continues to support TKIP for backward compatibility purposes, but the WPA
    standards require that implementations include more advanced algorithms, including
    Counter Mode with Cipher Block Chaining Message Authentication Code Protocol (CCMP)
    for integrity checking, which is part of the Advanced Encryption Standard (AES)
    that WPA2 uses for data encryption. This combination is sometimes noted as CCMP-AES.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'WPA and WPA2 both have operational modes:


    +   WPA2 Personal—Also known as WPA2-PSK or Pre-Shared Key, this mode requires
    client devices to supply a 32-byte alphanumeric key previously specified on the
    access point. All devices use the same pre-shared key for encryption and decryption
    of data, which makes the protocol vulnerable to brute-force attacks.


    +   WPA2 Enterprise—Also known as WPA2-802.1X, this mode requires a Remote Authentication
    Dial-In Service (RADIUS) server on the network to authenticate the users with
    the 802.1X protocol for granting access to the wireless network. Although a more
    complicated deployment, this option provides much greater security than a pre-shared
    key.


    As the names imply, WPA2 Personal is best suited for residences or small offices
    in which the users cannot be trusted to share the pre-shared key with unauthorized
    persons. On a network with many users, the chances of a pre-shared key being compromised
    are much higher. When it does happen, changing the key requires that all of the
    access points and client devices be reconfigured with the new key value, which
    can be a highly time- and labor-intensive task.


    WPA2 Enterprise only eliminates the need for a pre-shared key; it provides centralized
    authentication, authorization, and accounting (AAA) for individual users. Clients
    connecting to the network must supply their individual credentials before they
    can access wireless resources. Because it requires an external RADIUS server,
    WPA2 Enterprise is considerably more complicated and expensive to deploy than
    WPA2 Personal. Although they did not exist when the WPA2 standard was designed,
    cloud-based RADIUS servers are now available that can make the WPA2 Enterprise
    deployment process simpler and less expensive.


    # EXAM TIP


    There is no standardized of security options for access points and wireless devices,
    since their configuration interfaces vary. Some products just use the term WPA2
    Personal, for example, but others use PSK and might also specify the encryption
    cipher, as in WPA2-PSK (AES). Candidates for the Network+ exam should be aware
    of the various components used in the Wi-Fi security protocols and the names used
    to refer to them.


    # Antennas


    WLAN devices have transceivers to transmit and receive radio signals, but for
    those processes to function efficiently, the devices must have antennas. The antenna
    (or inside) a wireless device transmits electromagnetic signals that it receives
    from the internal transceiver as electrical signals. To receive data, the antennas
    in reverse are capturing'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'The EM signals and converting them back into electrical signals. In most cases,
    access points have swiveling antennas built into the unit, as some network interface
    adapter cards. These antennas can typically be detached from the device and replaced
    with a different-model.


    Many devices, especially mobile ones, have internal antennas that are not accessible
    from the outside of the case. It might be possible to replace the internal antenna
    on these devices, but it will not be a simple matter and will almost void the
    warranty.


    Most users rarely think about the antenna; they just use the one supplied with
    the device. However, in large network environments, administrators might replace
    an access point''s antenna, either to provide the WAP with additional range or
    to regulate the operational area of the access point.


    # Antenna Types


    There are several types of external antennas available, including the following.


    +   - Omni—An omn (omnidirectional) antenna radiates in a spherical pattern with
    roughly the same signal strength in every direction. Many omni antennas are designed
    to be used on one floor of a building, such that their vertical radiation is not
    as strong or precisely spherical as the horizontal

    - Directional—A directional (idirectional) antenna radiates in one general direction,
    providing better range than an omni antenna of the same power and making the antenna
    suitable for point-to-point links between two devices. There are various types
    of directional antennas, such as panel, patch, and Yagi, which differ in the width
    of the operational area. Some highly directional antennas are designed for point-to-point
    links, such as those connecting two buildings. Others have a wider radiation pattern,
    such as those designed to be placed near an outer wall and pointing inward. This
    provides network access to the internal users while helping to prevent unauthorized
    users outside the building from accessing the network.


    # MIMO


    Beginning with 802.11n Wi-Fi has supported the use of multiple antennas on a single
    device with a technology called multiple input, multiple output (MIMO). The MIMO
    support in a particular product is noted by specifying the number of antennas
    at the access point and the client, in the form 2x2, 3x3, and so on to 8x8. Devices
    supporting four or eight antennas are relatively rare; devices with two or three
    are more common.


    MIMO is a technique in which both the access point and the client have multiple
    antennas transmitting the same signal. The devices use a technique called multipath
    signal propagation that takes advantage of reflective surfaces in the environment
    to bounce signals—called spatial streams—to the destination using multiple paths.
    The receiving device compares the arriving signals and uses them to enhance the
    strength and reliability of the transmission.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The MIMO technology has advanced in subsequent wireless standards, as follows:


    +   - 802.11n—MIMO

    - 802.11ac—Multi-user MIMO (MU-MIMO) (downstream only)

    - 802.11ax—Multi-user MIMO (MU-MIMO) (bidirectional)


    Multi-user MIMO in 802.11ac is based on the technology of enabling access points
    to transmit spatial streams to multiple users. The 802.11ax standard enhances
    the technology further by making it bidirectional, enabling both client devices
    and WAPs to transmit spatial streams to multiple users. With the introduction
    of MU-MIMO, the original MIMO implementation is sometimes referred to as single-user
    MIMO (SU-MIMO).


    # CELLULAR TECHNOLOGIES


    The other type of network used in use today is the cellular networks that provide
    voice, text, and data services to millions of users. Unlike WANs, the infrastructure
    of a cellular network is owned by third-party service providers, so there are
    no access points for consumers or IT personnel to locate and configure. This saves
    on time and expense, but it also means that the back end of the cellular network
    is out of the consumer''s control.


    As WLAN technology, cellular networking is based on standards that have evolved
    over the years to increase the speed and reliability of wireless devices. The
    most common terms used to refer cellular technologies are the generational indicators,
    such as 2G, 3G, 4G, and now 5G. However, there are certain standards that networks
    branded with these designations have to make, they are more than official standards.
    Users use different underlying technologies to implement the generations of their
    products. Some of those underlying technologies are as follows:


    **Global System for Mobile Communications (GSM)** Developed by the European Telecommunication
    Standards Institute (ETSI). GSM was used for the 2G networks that replaced the
    original analog 1G networks. Used at first for voice telephony, the standard was
    later enhanced to include data, using protocols as *Enhanced Data Rates for GSM
    Evolution (EDGE)*.


    **Code-Division Multiple Access (CDMA)** Developed as a competitor to GSM, CDMA
    became the 3G technology in the US, while Europe and Japan used the Universal
    Mobile Telecommunications System (UMTS) for their 3G networks. CDMA is not compatible
    with GSM hardware.


    **Long-Term Evolution (LTE)** Developed by the 3rd Generation Project (3GPP) and
    on earlier GSM and EDGE technologies, LTE is one of the dominant 4G technologies
    on wireless networks the globe. LTE is a viable upgrade path for GSM and CDMA.


    **5G NR (New Radio)** Developed by the 3GPP to be for 5G networks, NR can operate
    in a non-stand-alone mode that uses an existing 4G LTE network for its control
    plane, simplifying its deployment. Stand-alone mode uses NR for both the control
    and user planes.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'All of these technologies have themselves undergo multiple revisions to increase
    their transmission speeds and make other improvements. Individual implementations
    widely in the speeds they profess to achieve, but their actual realized performance
    often fails to meet expectations.


    # CERTMIKE EXAM ESSENTIALS


    +   - Wi-Fi networking is based on a series of standards developed by the IEEE
    802.11 working group. The standards call for the use of the 2.4 GHz, 5 GHz, and
    now the 6 GHz frequency band.

    - Wi-Fi infrastructure mode requires a wireless access point, which can bridge
    the wireless devices to a wired Ethernet network. Ad hoc mode is a direct connection
    between two wireless devices without an access point.

    - The Wi-Fi frequency bands are split into channels, which prevent interference
    between devices. The standards beginning with 802.11n support channel bonding,
    which combines channels to increase available bandwidth.

    - Cellular-based wireless networking is based on the technologies chosen by individual
    service providers, such as GSW, CDMA, LTE, and NR. The development of cellular
    technologies is represented by the generational designations 2G, 3G, 4G, and 5G.'
  merge: -1
  img_proc: true
