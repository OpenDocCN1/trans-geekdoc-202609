    transmissions, as well as any access points in the area and the frequencies they
    are using. Site surveys are typically performed before the wireless LAN installation,
    as part of the network design process, and must be repeated periodically as conditions
    or changes occur.


    **Audit and Assessment Report** A periodic examination of the network''s overall
    security posture, which might include an examination of the existing network policies
    and penetration testing by a third party.


    **Baseline Configurations** Specifies the normal operating configurations of network
    devices, in the form of either documentation or backups of configuration files.
    If a device needs to be replaced for any reason, the settings needed to configure
    it are readily available. These baseline configurations are distinct from the
    performance baselines discussed in Chapter 13, "Network Availability."'
