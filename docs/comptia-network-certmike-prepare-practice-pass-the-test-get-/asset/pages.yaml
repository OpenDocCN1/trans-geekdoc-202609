- pgno: 98
  md: '# CHAPTER 6


    # Network Services


    # Objective 1.6: Explain the use and purpose of network services.


    This chapter examines some of the important services used on TCP/IP networks.
    All of them are virtually invisible to the average end user, but they provide
    administrative services that are vital to network communications and save administrators
    a great deal of work. The Network+ exam expects candidates to be familiar with
    these services and their functions.


    In this chapter, you''ll learn everything you need to know about Network+ Objective
    1.6, including the following topics:


    +   - DHCP

    - DNS

    - NTP


    # DHCP


    Every device on a TCP/IP network needs an IP address, the task of configuring
    them manually and individually—called static assignment—is time-consuming and
    difficult for administrators. Dynamic Host Configuration Protocol (DHCP) is a
    combination of a service and a protocol that enables clients to request IP address
    assignments from a DHCP server. The server assigns each client a unique address
    from a pool—along with other TCP/IP configuration settings, called scope options,
    such as subnet masks and default gateway addresses.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Chapter 6 • Network Services


    Three types of IP address assignments are defined in the DHCP standards, as follows:


    **Dynamic Allocation** The server leases an address from a pool for each specified
    duration called the lease time. When the lease expires, the client renews the
    address for another lease period or the server claims the address and returns
    it to the pool for reassignment.


    **Automatic Allocation** The server assigns an address from a pool to each device
    manually, without a lease expiration or a renewal.


    **Manual Allocation** In the manual process, also called reservations, the server
    assigns a specific address to each device permanently, without a lease or renewal.
    This method is typically used for servers and other systems that require permanent,
    unchanging IP address.


    > EXAM TIP

    The terms dynamic, automatic, and manual are used by the DHCP standards to define
    the types of address allocation, but not all DHCP implementations use these terms.
    The Network+ objectives use the term dynamic assignment, but they describe manual
    address allocations as reservations.


    The assignment process occurs automatically when a device with a DHCP client starts,
    and proceeds as follows:


    +   1. The DHCP client transmits a series of address request messages as broadcasts,
    using User Datagram Protocol (UDP) port 67.

    2. Any DHCP servers on the local network with available leases that receive the
    broadcasts must reply with an offer of an IP address.

    3. The DHCP client accepts one of the offered addresses by generating a request
    message containing the chosen server''s IP address.

    4. The chosen DHCP server replies to the request message with a positive or negative
    acknowledgment, indicating either its confirmation of the address or that the
    offered address is no longer available.

    5. On receipt of a positive acknowledgement message, the client configures its
    TCP/IP settings with the offered address and options. If the client receives a
    negative acknowledgement, the entire name resolution process begins again.


    The DHCP server keeps track of the addresses it assigns, so there is no chance
    of IP address duplication on the network. In dynamic allocation, when the IP address
    reaches 50 percent of its lease time, and when it reaches 87.5 percent, the client
    sends renewal requests to the DHCP server, which usually responds with a new lease
    for the same address. If the server does not receive renewal messages from the
    client, it reclaims the IP address assigned previously and returns it to the scope
    for reassignment.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# DHCP on IPv6


    The original DHCP standards call for DHCP client/server communications to use
    UDP traffic on port 67 for clients and port 68 for servers, which remain the ports
    used for IPv4 address assignments. This original DHCP version is now commonly
    known as DHCP4. There are also standards defining the use of DHCP on IPv6 networks,
    referred to as DHCPv6. IPv6 networks do not support broadcast transmissions, so
    uses a multicast address for the initial requests sent by clients. DHCPv6 also
    uses different ports for its traffic: 546 and 547 for the client and server, respectively.
    The basic architecture is the same in DHCPv6 as it is in IPv4, but the message
    types and their formats are changed.


    All IPv6 devices use stateless address autoconfiguration (SAC) to assign them
    a link address, as described in Chapter 4, "IP Addressing,"so many of them have
    no need for DHCP addresses, but DHCPv6 provides a stateful alternative to the
    stateless self-assignment process.


    # Creating a Scope


    Although the term does not appear in the DHCP standards, a scope is a pool of
    IP addresses that a DHCP administrator has designated for assignment to clients.
    Usually, the scope is a range of addresses, which might include some or all of
    the addresses available on the local subnet. If there are addresses within a given
    range that the administrator does not want assigned, it is possible to create
    an exclusion range within the scope.


    For example, the administrator might create a scope containing all of the addresses
    for a subnet, such as 192.168.54.1/24 to 192.168.54.255/24. However, if there
    are servers on the network that already have static address assignments in that
    range, the administrator can designate 192.168.54.101/24 as an *exclusion range*,
    so those 10 addresses will never be assigned to DHCP clients.


    In addition to IP addresses, a DHCP scope can have scope options defined, which
    specify the other settings needed by the TCP/IP clients on network, including
    a subnet mask, a DNS server address, and a default gateway, which specifies the
    address of a router on the local network. The DHCP standards also support a large
    set of other options that administrators can configure to be included with IP
    assignments from a particular scope or server options for all of the server''s
    scopes.


    # EXAM TIP


    In TCP/IP terminology, the term *gateway* is synonymous with *router*, but it
    also has other meanings, such as a device that converts data from one format into
    another. Network+ exam candidates should be conscious of the distinction and be
    sure which is implied by a particular context.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Chapter 6 • Network Services


    # DHCP Relays


    Because we relay on broadcast messages as part of the address assignment process,
    DHCPv4 traffic is limited to the local network. For a large network with multiple
    subnets, this would ordinarily mean there must be a DHCP server on each subnet,
    which would in most cases impractical. However, there is a solution for this problem
    in the form of DHCP relay agents.


    A DHCP relay agent is a software component, typically built into a router or server,
    which allows DHCP clients to obtain IP addresses from a DHCP server on another
    network. The address assignment procedure with an intervening relay agent is as
    follows:


    +   1. The relay agent listens on UDP port 67 for address request messages sent
    as DHCP clients on the local network.

    2. When it receives a broadcast, the relay agent inserts its own IP address into
    the client''s request message and forwards it to a DHCP server on another network.

    3. The DHCP server responds to the request by offering an IP address, and it sends
    its messages to the relay agent instead of the client.

    4. The relay agent forwards the server''s replies to the client, which can then
    accept the offered address and configure their TCP/IP settings.


    There are other protocols and services that have difficulties due to the limitations
    of broadcasts. There are products IP helpers that can forward DHCP traffic like
    a relay agent, but can also forward traffic generated by other protocols, such
    as DNS, TFTP, NTP, and NetBIOS. Some implementations also call this UDP forwarding.


    # DNS


    TCP/IP networks identify systems by their IP addresses, but people are more comfortable
    working with names. Domain Name System (DNS) is a service and protocol that implement
    a means of assigning names to TCP/IP systems and resolving the names to IP addresses
    on request.


    When a user types a URL in a web browser, the browser sends a request containing
    the server name to the user''s designated DNS server. The DNS server replies with
    the IP address corresponding to the name, and the browser can then begin to communicate
    directly with the web server using its address. This process is called name resolution.


    The transaction seems simple from the client, but at the server, it can be complex.
    DNS is a hierarchical, distributed database, with records maintained on thousands
    of authoritative servers located all over the globe. A simple name resolution
    might be handed off to many different DNS servers before an authoritative record
    for a given name is located.


    # DNS Naming


    From the earliest days of TCP/IP networking, administrators gave their computers
    host-names as a user-friendly alternative to IP addresses. As the networks grew,
    maintaining'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'individual lists of hostnames became unwieldy, the DNS was designed to be a
    hierarchical database for all the hostnames everywhere. This database was distributed
    among many servers to provide fault tolerance and avoid network traffic bottlenecks.


    The namespace is based on a global hierarchy, multilevel structure of domains.
    A domain is a container for hosts and subdomains, which are the building blocks
    of DNS hierarchy. To obtain IP addresses for a TCP/IP network, an administrator
    is assigned a network identifier by a service provider. Then, the administrator
    assigns a unique identifier to each network device. DNS works in the same way.
    An administrator registers a domain and then assigns hostnames to individual devices
    in that domain. The result is a hierarchy that looks something like this, as shown
    in Figure 6.1.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_102_0.png)


    Starting at the root of the hierarchy, there are top-level domains, such as .com,
    .org, and .net, each of which has subdomains. Each subdomain contains hostnames
    representing individual devices. There can be additional layers of subdomains
    as well.


    Therefore, to uniquely identify one on the Internet, a DNS name must consist of
    a hostname plus all of its parent domain names up to the root. This is called
    a fully qualified domain name (FQDN). A FQDN can be up to 255 characters long
    in total, with each name (between periods) consisting of a hostname (www), a subdomain
    (what), and a top-level domain (com).


    When a network administrator registers a domain name, control over the contents
    of the domain comes with it. The administrator can create any number of hosts
    in the domain, and any number of subdomains as well, in any number of layers.
    Thus, the administrator of adat.com could create subdomains for each of the company''s
    branch offices and sub-subdomains for the various departments at each office,
    resulting in DNS names like the following: mail.sales.chicago.com.


    The administrator of a domain is responsible for maintaining two name servers
    for that domain, a primary and secondary. These two servers become the authoritative
    name'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'servers, the ultimate sources for information about that domain. If someone,
    anywhere on the Internet, tries to resolve a hostname in that domain, the IP address
    for that hostname will ultimately come from one of those name servers.


    # DNS Name Resolution


    The DNS client built into virtually every operating system is a resolver. As noted
    earlier, name resolution process begins when an application, such as a web browser,
    uses the resolver to generate a DNS name request and sends it to the DNS server
    specified in the system''s TCP/IP settings. If that server happens to be the authoritative
    source for the domain containing the hostname to be resolved, then it can return
    a response containing the requested address to the resolver immediately. This
    rarely happens, however,


    If the DNS server receiving the request has no information about the name to be
    resolved, it must find information by querying other DNS servers. To do this,
    the resolver traces the name to be resolved from the root. Every DNS server is
    configured with the addresses of the root name servers, at the top of the DNS
    global hierarchy. These root DNS servers are the authoritative sources for the
    top-level domains.


    If the client''s DNS server is trying to resolve the name www.adam.com, it begins
    by sending a query to one of the root name servers for information about the com
    domain. The root name server responds with the addresses of the authoritative
    name servers for the com domain.


    This type of request is called an iterative query, because the root server replies
    immediately with the best information it has available to it. The query that the
    resolver originally sent to its own DNS server is a recursive query. When a DNS
    server receives a recursive query, it takes responsibility for the complete name
    resolution process, until it arrives at the authoritative resolution of the name,
    which returns to the resolver.


    The client''s DNS server, now with the addresses of the com servers, can send
    an iterative query to those servers to discover information about the adam domain.
    The com servers return the addresses of the adam name servers, and the client''s
    DNS server can now query the adam name servers for the IP address of the host.
    Receiving this, the client''s DNS server can now issue a reply to the original
    resolver containing the IP address of the www host on the adam.com network. The
    resolver supplies the address to the web browser, and the browser can now connect
    to the web server using its IP address instead of its name.


    # DNS Servers


    Name resolution is an essential part of Communication, and every client device
    that uses the Internet needs access to at least one DNS server. Depending on the
    size and complexity of the network, administrators might elect to use internal
    or external DNS servers.


    Internal servers are located on the organization''s private network. Most of the
    operating systems we use today include a DNS server component, enabling administrators
    to create multiple DNS servers as needed. Smaller networks and residential customers
    are more likely to use external servers for DNS access, such as the ones on their
    Internet service provider''s network.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# DNS Caching


    Despite its seeming complexity, the name resolution process is usually completed
    within a second or two. One of the reasons for this is that DNS servers maintain
    a cache of the information they have discovered. In DNS caching, each of the resource
    records that a DNS server receives from another server has a value called its
    Time to Live (TTL). This value specifies how long the serving record should hold
    it in its cache.


    The duration of the TTL is typically based on how authoritative the resource record
    is likely to change. Longer TTL values allow the server to maintain a larger,
    more useful cache; shorter TTL values prevent the cache from storing outdated
    information.


    # DNS Records


    The DNS database consists of resource records, the most basic of which contains
    a hostname and its IP address. However, there are several kinds of resource records
    that provide information about a domain and its resources, such as the following:


    +   **IPv4 Address (A)** Used for forward name resolution; maps a hostname to
    a 32-bit IPv4 address. This is the basic record used to resolve a hostname to
    an IPv4 address.


    +   **IPv6 Address (AAAA)** Used for forward name resolution; maps a hostname
    to a 128-bit IPv6 address. This is the basic record used to resolve a hostname
    to an IPv6 address.


    +   **Canonical Name (CNAME)** Creates an alias or alternative name for a hostname
    defined by an A or AAAA record. Both the original hostname and the alias resolve
    to the same IP address.


    +   **Mail Exchange (MX)** Identifies the server that will handle incoming email
    traffic addressed to the domain.


    +   **Name Server (NS)** Contains the name of a registered domain and the fully
    qualified domain name of a server that is authoritative for that domain.


    +   **Pointer (PTR)** Used for reverse name resolution; maps an IP address in
    the in-addr.arpa domain to a host space based on IPv4 addresses that servers use
    to look up IP addresses and resolve them to their hostnames. For example, the
    address 192.168.54.12 would appear in this domain as 12.54.168.192.in-addr.arpa.


    +   **Service (SRV)** Specifies the server name and number for a specific service
    available on the network. This service location record was designed to prevent
    the need to create record types for specific applications, as with MX.


    +   **Start of Authority** Identifies the server as the authoritative data source
    for the current zone and provides information needed to facilitate zone transfers.


    +   **Text (TXT)** Contains plain text added by administrators for their own purposes
    or to implement application-specific technologies.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Zones and Zone Transfers


    For administrative purposes, it is possible to divide a DNS domain into zones,
    each of which has an authoritative server (identified by SOA resource record).
    A simple two-level domain, such as adatum.com, consists of a single zone, but
    if adatum.com has multiple subdomains, creating zones makes it possible to delegate
    administrative responsibility for each zone. A zone can be any contiguous part
    of the domain hierarchy spanning multiple levels, as shown in Figure 6.2.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_105_0.png)


    FIGURE 6.2 DNS zones


    For fault tolerance and load balancing purposes, administrators typically designate
    two servers as authorities for a given zone, called the primary and the secondary.
    Each server maintains a copy of the zone data on its local drive. To keep the
    DNS data on the two servers synchronized, administrators make changes to the primary
    master, which periodically updates the secondary with a process called a zone
    transfer.


    Whenever the secondary restarts, it loads the zone data from its drive and checks
    with the primary to see if any updates have occurred. If so, the secondary initiates
    a zone transfer from the primary and updates the data on its local drive with
    the latest information. On a complex DNS implementation with many zones, a single
    DNS server can function as a primary or secondary for multiple zones at once,
    which can result in it performing multiple zone transfers to keep all of the DNS
    information for the domains updated.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# NTP


    Network Time Protocol (NTP) was designed to share time information among systems
    on a network. There are distributed applications that require servers at remote
    locations to synchronize their clocks periodically, such as atomic clock and directory
    services. This is to ensure that data modifications on various servers are applied
    in the correct order.


    NTP sends periodic queries to a server to obtain a time signal with which it can
    synchronize its clock. A server functioning as a time provider uses NTP on UDP
    port 123 to transmit time signals to other devices so that they can synchronize
    their clocks accurately.


    An NTP server can be a computer on a private network, or administrators can use
    one of the many publicly available servers on the Internet, such as those maintained
    by the National Institute of Standards and Technology (NIST) at various locations
    around the country.


    NTP uses a stratum value to specify how a time server is to its time source. A
    reference server with direct access to a calibrated time source, such as an atomic
    clock, is referred to have a stratum value of 0. A server that gets its time signal
    from a stratum 0 server is considered to be stratum 1, and a server synchronized
    with a stratum 1 server is stratum 2, and so forth. The higher the stratum value,
    the greater the possibility of a time discrepancy with the stratum 0 source.


    # CERTMIKE EXAM ESSENTIALS


    +   Dynamic Host Configuration Protocol (DHCP) is an application layer protocol
    and service that provides TCP/IP clients with unique IP addresses and other configurations.
    DHCP servers serve addresses to clients and reclaim them when they are no longer
    in use.


    +   Dynamic Name System (DNS) is a distributed database of TCP/IP host names and
    their accompanying IP addresses. Because people work more easily with names but
    TCP/IP communications rely on addresses, DNS provides applications with the ability
    to resolve hostnames to addresses by sending queries to DNS servers located all
    over the world.


    +   Network Time Protocol (NTP) is a means by which computers can synchronize
    their clocks with reliable reference sources. Clients periodically send NTP queries
    to time servers and calibrate their clocks using the data in their replies.'
  merge: -1
  img_proc: true
