- pgno: 320
  md: '# Troubleshooting Wireless Connectivity


    # Objective 5.4: Given a scenario, troubleshoot common wireless connectivity issues.


    This chapter examines some of the specialized issues and procedures involved in
    troubleshooting wireless networks. The Network+ exam expects candidates to be
    familiar with these concepts.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    5.4, including the following topics:


    +   * Specifications and limitations

    * Considerations

    * Common issues


    # SPECIFICATIONS AND LIMITATIONS


    As discussed in Chapter 12, "Wireless Standards," wireless networking technologies
    have specifications and limitations that govern how a network should be designed
    and installed. These same specifications, discussed in the following sections,
    are in many cases the starting point for the wireless network troubleshooting
    process as well.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Throughput


    Throughput is the rate at which a network device can actually transmit data, as
    opposed to the theoretical speed ratings specified by wireless standards and hardware
    manufacturers. Wireless networks have many more variables than c networks that
    can affect their throughput.


    Interference caused by the building''s architecture is a relatively stable source
    of interference that technicians can plot and document as part of the network''s
    initial site survey. However, there are many other potential sources of wireless
    interference that are transient, such as mobile users accessing the network from
    different places, or other nearby works on the same channel, and weather conditions.


    Well it the IT technicians survey the site of a wireless network during the design
    process, conditions can change in moment, affecting their level of performance.
    This is why the troubleshooting process for a throughput problem on a wireless
    network must essentially start from the beginning each time a problem occurs.
    The troubleshooter must investigate the network conditions at that moment, which
    might be significantly different from any previous time.


    # Speed


    A wireless network''s rated speed is the theoretical maximum throughput of a device
    under ideal conditions. The one definite conclusion that an IT technician can
    make regarding a wireless network''s theoretical speed is that the actual realized
    network will never achieve it. The IEEE 802.11 wireless standards all specify
    a speed rating for a network that conforms to the stated specifications. However,
    even without interference caused by such as conflicting devices and architectural
    barriers, normal network operating conditions can still prevent devices from achieving
    the network''s rated speed.


    When faced with what appears to be a slow wireless network, troubleshooters should
    be aware that failure to achieve the rated speed of the network is not necessarily
    an indication that something is wrong. The performance of the network should be
    compared with a base-line performance reading on the actual network at an earlier
    date, or with a theoretical-


    # Distance


    On a wireless network, signals to attenuate (weaken) and throughput to decrease
    as the distance between a device and its wireless access point (WAP) increases.
    Eventually, a wireless device that gets too far from the WAP will start intermittently
    dropping its connection. However, on a wireless network, the question of how much
    distance from the WAP is too much a difficult one to answer.


    The specifications for c networks always have exact maximum length limits. If
    a cable segment exceeds the maximum length, the number of signaling errors and
    packet retransmissions increases rapidly. However, on a wireless network, it is
    difficult to pinpoint a distance limitation based on protocol specifications.
    There are many more factors'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'that can affect wireless connectivity there are on a cabled network. Distance
    from the

    WAP is one factor, but there are also issues like the:


    +   * Which frequency band the network is using

    * What type of antennas the devices have

    * Where the antennas are located

    * How the building is constructed

    * How many other networks are using the same frequency and channel


    As the 802.11 standards developed over the years, the potential distances that
    wireless network connections can achieve increased due to technology improvements
    such as multiple input/multiple output (MIMO), so the selection of a wireless
    standard during the design process should be part in the distances the network
    must span.


    # RSSI Signal Strength


    The received signal indicator (RSSI) is a means of quantifying the strength of
    the wireless network signal as it is received by a client device. Most phones
    and other devices display the signal as a number of bars, which is a less precise
    of the actual RSSI signal value.

    RSSI is not an absolute measurement against an established power scale. It is
    rather relative measurement based on an arbitrary scale specified by the manufacturer
    of the device. Some wireless interface manufacturers use a scale of 0 to 100,
    whereas others have different value ranges. Many wireless network monitoring tools
    can measure signal strength using RSSI values, which provides troubleshooters
    with a more exact reading of the signal strength at a particular location.


    # EIRP Power Settings


    Effective isotropic radiated power (EIRP) is a calculated measurement of the radio
    frequency (RF) that can be emitted by an antenna in a single direction, based
    on its transmission strength and the antenna''s gain. EIRP is measured in decibels
    over isotropic (dBi). The formula for calculating the EIRP is follows:


    ```

    EIRP = transmitter power–cable loss + antenna gain

    ```


    An antenna with adequate gain makes possible for the device to transmit at a lower
    power level, thus conserving battery life. Using EIRP values, troubleshooters
    can conserve the relative power of emitters and adjust power levels as needed.


    # CONSIDERATIONS


    Compared to cabled networks, wireless LANs have many more variables to consider
    that can affect the performance of the network. When designing or troubleshooting
    the'
