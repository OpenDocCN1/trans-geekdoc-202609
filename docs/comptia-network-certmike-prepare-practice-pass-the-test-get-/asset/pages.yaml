    Based on the information provided by ifconfig, which of the following is the most
    likely explanation for the user’s problem?


    +   A. The address setting in the DNS Servers setting is on a different network
    from the IPv4 Address setting.

    B. The Subnet Mask is incorrect.

    C. The Default Gateway setting contains an address of another network.

    D. The network interface does not have DHCP enabled.


    # Practice Question 2


    Alice is capturing network traffic samples as part of an ongoing project to document
    performance baselines for future reference and troubleshooting. As she examines
    one traffic sample, Alice notices that it contains a great deal of multicast traffic
    that appears to be flooding the network, but she does not know why. After investigating
    further, she learns that there is a live video stream on the network being transmitted
    as multicasts, but it is only intended for a select group of users, not for everyone.
    However, since the multicast traffic is currently flooding the network, all of
    the hosts must receive and process the packets, possibly resulting in a performance
    degradation or even a denial of service. Which of the following techniques can
    Alice use to prevent the multicast traffic from being processed by the unintended
    hosts most easily?


    +   A. Firewall configuration

    B. Flow control

    C. IGMP snooping

    D. Asymmetric routing'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Practice Question 1 Explanation


    A. is incorrect because, unlike the default gateway, the DNS server does not have
    to be on the local network, so the address shown in the config can be correct.


    B. is incorrect because the Subnet Mask setting incorrect, the computer would
    have network access at all, not the partial access it has now.


    C. is correct because the Default Gateway setting must contain the address of
    a router on the local network that provides access to other networks, Ralph’s
    client, therefore, should have a Default Gateway address on the 192.168.4.0 network,
    but the system is using an address on the 192.168.4.0 network, which is not local.
    As a result, the user can use access systems on the 192.168.4.0 network.


    D. is incorrect because it is not necessary for a computer to use DHCP to access
    the Internet.


    Correct Answer: C


    # Practice Question 2 Explanation


    A. is incorrect because while it would be possible to configure the firewalls
    of the individual systems to block the multicasts, it would be a time-consuming
    and labor-intensive solution.


    B. is incorrect because flow control only affects the speed at which transmitting
    systems send packets containing TCP segments.


    C. is correct because Internet Group Management Protocol (IGMP) snooping is a
    switching technique that prevents hosts from receiving multicast packets when
    they are not members of the multicast group. multicast traffic still appears on
    the network, but only the members of the group will receive and process the packets.


    D. is incorrect because asymmetric routing only affects the paths that packets
    take through an internet-work. It does not regulate multicast traffic.


    Correct Answer: C'
  merge: -1
  img_proc: true
