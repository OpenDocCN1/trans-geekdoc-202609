    This chapter examines some of the fundamental concepts of cloud computing and
    how it is used in the enterprise. The Network+ exam does not dive too deeply into
    the cloud, which is a vast subject, but candidates should be familiar with these
    topics and their basic functions.

    In this chapter, you''ll learn everything you need to know about Network+ 1.8,
