- pgno: 246
  md: '# Practice Question 1


    Ralph is a new hire in the IT department at his company. His supervisor has called
    him into a meeting with the directors of the company and informed him that there
    have been several document security incidents in recent months due to social engineering.
    He asks Ralph to formulate a plan for addressing the social engineering problem
    and preventing further document security incidents.


    Ralph assures his supervisor that it will not be a problem to produce such a plan.
    Ralph does this because he is assuming he will have time to do some research and
    find out what social engineering is, which he doesn''t know. Before the meeting
    ends, however, Ralph''s supervisor asks him to outline the basic idea of his plan
    for the directors right then. Ralph attempts to stall, but he is pressed to provide
    an answer to the directors on the spot. Which of the following solutions should
    he?


    +   A. Install an antivirus software product on all user workstations.

    B. Implement a program of user education and revised corporate policies.

    C. Install an additional firewall between the internal network and the internet.

    D. Use IPsec to encrypt all network traffic.


    # Practice Question 2


    Alice receives an email from her bank informing her that her checking account
    has been frozen due to suspected fraudulent activity. To confirm the charges that
    are fraudulent, the email provides a link to the bank''s website, where Alice
    can review a list of the suspicious transactions. Alice clicks the link and logs
    on to the bank site with her username and password, plus the PIN that the bank
    recently implemented for added security. She is taken to a web page that appears
    to be that of her bank, but it is not. Which of the following types of attacks
    is Alice likely to be experiencing?


    +   A. VLAN hopping

    B. Evil twin

    C. Spoofing

    D. Phishing'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Practice Question 1 Explanation


    A. is incorrect because social engineering is not a virus or a form of malware,
    so an antivirus product will have no effect on the problem.


    B. is correct because social engineering is the practice of obtaining confidential
    data by contacting users and impersonating someone with a legitimate need for
    data. No technological solution can prevent it; the only way is to educate users
    of the potential dangers and establish policies that inform users what to do when
    they experience a social engineering attempt.


    C. is incorrect because social engineering does not involve the network or its
    traffic in any way. Therefore, a firewall cannot block it.


    D. is incorrect because social engineering does not involve the network, so encrypting
    the network traffic with IPSec will have no effect on the problem.


    Correct Answer: B


    # Practice Question 2 Explanations


    A. is incorrect because VLAN hopping is a means of gaining access to a protected
    VLAN by inserting extra tags into network packets.


    B. is incorrect because twin is a type of attack that uses a rogue access point
    to kidnap wireless clients.


    C. is incorrect because spoofing is the process of modifying network packets to
    make them appear as though they are transmitted by or addressed to someone else.


    D. is correct because Alice has probably fallen victim to a phishing attack. The
    email was likely false, with a link that brought Alice to her bank''s website,
    but to the attacker''s duplicate site. By supplying her account credentials to
    log on, she has given them to the attacker, including the newly implemented PIN.
    The attacker can now gain access to Alice''s generic bank account.


    Correct Answer: D, Phishing'
