- pgno: 236
  md: '# Practice Question 1 Explanation


    A. is incorrect because Lightweight Directory Access Protocol (LDAP) is used for
    Active Directory communication, not for enforcing configuration standards.


    B. is correct because Security Information and Event Management (SIEM) is a security
    product that provides long-term log storage and analysis and real-time monitoring
    of network devices.


    C. is incorrect because Remote Authentication Dial-In Service (RADIUS) is a centralized
    authentication, authorization, and does not enforce configuration standards.


    D. is correct because Network Access Control (NAC) is a technology that enforces
    configuration standards that systems must meet before they can connect to the
    network.


    **Correct Answer: D, NAC**


    # Practice Question 2 Explanation


    A. is incorrect because social engineering is a form of attack in which an innocent
    user is persuaded by an attacker to provide sensitive information via email or
    telephone.


    B. is correct because the director''s concern is that the disgruntled employee
    might take advantage of access to company resources to sabotage the network. When
    individuals take advantage of information gathered during their employment, it
    is called an internal threat.


    C. is incorrect because war driving is an attack method that consists of driving
    around a neighborhood with a computer scanning for unprotected wireless networks.


    D. is incorrect because an external threat is originating from a non-employee.


    **Correct Answer: B, Internal threats**'
