    approach specifies the desired final state for the environment, and the system
    does what must be done to achieve that state.


    Scripting the infrastructure deployment process can provide frequently performed
    tasks, but the automation usually refers to a single task. The automation can
    go further by working with multiple tasks, toward what is known as orchestration.
    Orchestration is a more comprehensive approach to the automation of workflows,
    consisting of configuration and management tasks for multiple operating systems,
    services, and applications.


    # Connectivity Options


    Most users, when they connect to the cloud, do so using the Internet. However,
    for some cloud consumers and for applications, an open Internet connection does
    not provide sufficient security. For example, a company running a hybrid cloud
    might have sensitive data stored in their private data center that their cloud
    services need to access. The threat of the data being compromised precludes the
    use of an open Internet connection between the data center and the cloud, there
    are alternative connection types, such as the following:


    **Virtual Private Network (VPN)** A VPN connection is a virtualized link between
    two points, such as a database server in a private data center and a cloud provider
    on the Internet. The VPN link, often referred to as a tunnel, can protect the
    data passing through it is protected by security protocols such as IPsec, the
    traffic still passes over the public Internet. Attackers could conceivably intercept
    the VPN packets while they are in transit, but the encrypted tunnel prevents the
    data from being compromised.


    **Private-Direct Connection to Cloud Provider** Some cloud providers offer a means
    to connect to their network without using the public Internet at all. A *private
    direct connection* is a dedicated link between the cloud consumer''s data center
    and the cloud provider''s network. The link could be a physical cable—usually
    fiber'
