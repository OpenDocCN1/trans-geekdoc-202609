  md: '# CHAPTER 5


    # Ports and Protocols


    # Objective 1.5: Explain

    common ports and

    protocols, their

    application, and

    encrypted alternatives.


    This chapter examines the protocols commonly used on TCP/IP networks and the port
    numbers assigned to them. The Network+ exam expects candidates to be familiar
    with these protocols, their basic functions, and the port numbers used to identify
    them in transport layer protocol headers. In this chapter, you''ll learn everything
    you need to know about Network+ Objective 1.5, including the following topics:


    +   * Protocols

    * Ports

    * IP protocol types

    * Connectionless vs. connection-oriented


    # IP PROTOCOL TYPES


    The TCP/IP suite is a collection of protocols, mostly running at the network,
    transport, and application layers of the OSI reference model. Systems use various
    combinations of protocols at the different layers depending on the amount and
    nature of the data to be transmitted over the network. Table 5.1 lists some of
    the most common protocols'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'used at these three layers. The abbreviation TCP/IP, which gives the protocol
    suite its name, refers to the combination of Transmission Control Protocol (TCP)
    at the transport layer and Internet Protocol (IP) at the network layer, which
    is one of the most commonly used combinations at those layers.


    # TABLE 5.1 TCP/IP protocols


    | Layer | Protocols |

    | --- | --- |

    | Application | FTP, SSH, SFTP, IMAP, POP3, SMTP, SNMP, DNS, DHCP, HTTP, HTTPS,
    TFTP, LDAP, SMB, NTP, Syslog, Telnet |

    | Transport | TCP, UDP |

    | Network | IP, ICMP |


    # Connectionless vs. Connection-Oriented Protocols


    The primary network and transport layer protocols of the TCP/IP fall into two
    basic categories: connectionless and connection-oriented. IP, at the network layer,
    and the User Datagram Protocol (UDP), at the transport layer, are both connectionless
    protocols. TCP, at the transport layer, is a connection-oriented protocol.


    Connectionless protocols are relatively simple because they are limited to best-effort
    delivery. This means they have no mechanism to guarantee its intact delivery.
    For IP, this is because it relies on TCP at the transport layer when guaranteed
    delivery or other services are needed. For UDP, at the transport layer, this is
    because the protocol is used for brief transactions that consist of a single request
    and a single reply. Because they do not include complex features, connectionless
    protocols have very low bandwidth overhead.


    Connection-oriented protocols are designed for use when the data requires guaranteed
    delivery or additional services. Before a connection-oriented protocol, such as
    TCP, transmits any data to a recipient, the two systems exchange messages to establish
    a connection. With the connection established, the sender''s transmission of data
    proceeds. As data packets arrive, the receiver sends back periodic acknowledgments
    to confirm their receipt. If any packets go unacknowledged, the sender automatically
    retransmits them. When the data transmission is completed, the systems exchange
    messages to terminate the connection.


    Connection-oriented protocols typically include other services in addition to
    guarantee delivery. All of these services incur additional bandwidth overhead,
    both in form of a larger protocol header and in the additional connection establishment
    and termination messages.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Internet Protocol (IP)


    The Internet Protocol (IP), as described in Chapter 4, "IP Addressing," is a network
    layer protocol that is the primary end-to-end carrier on all TCP/IP networks.
    IP is essentially the sealed envelope that carries upper-layer data all to its
    final destination. IP is responsible for addressing packets, routing data through
    networks to its final destination, and fragmenting packets when necessary to transmit
    them over networks with smaller maximum transmission unit (MTU) sizes.


    For incoming traffic, IP packet headers includes a code that specifies transport
    layer protocol, , TCP or UDP; for outgoing traffic, both TCP and UDP are at the
    transport layer pass their data down to IP at the network layer.


    # Transmission Control Protocol (TCP)


    Transmission Control Protocol (TCP) is a connection-oriented transport layer protocol
    that, in combination with IP at the network layer, is responsible for a large
    part of the traffic on any TCP/IP network. To establish a connection between the
    source and the destination, TCP systems perform a message transaction three-way
    handshake. The sending system encapsulates the data it receives from the application
    layer by applying a 20-byte header and passes the resulting packet to IP at the
    network layer.


    The TCP header implements a variety of functions, including the following:


    **Packet Acknowledgement** Receiving systems acknowledge incoming packets by specifying
    the number of the next expected packet.


    **Flow Control** Receiving systems specify in their acknowledgments how many bytes
    they can receive without dropping packets. The sending system adjusts its transmission
    rate accurately.


    **Data Segmentation** TCP can handle large amounts of data, which has to be split
    into segments and transmitted in separate packets. The header for each packet
    includes a number that identifies its place in the packet sequence.


    **Error Detection** Each packet includes a checksum calculated over the TCP header,
    the payload, and an IP pseudo-header. Receiving systems perform the same calculation
    to confirm error-free delivery.


    **Port Identification** The TCP header specifies the port numbers of the source
    and destination layer protocols.


    # User Datagram Protocol (UDP)


    Compared to TCP, User Datagram Protocol (UDP) is a simple connectionless protocol
    with minimal overhead. There is no three-way handshake with UDP, and its header
    is only 8 bytes long, compared to TCP''s 20 bytes, as shown in Figure 5.1. There
    is no guaranteed delivery with UDP, nor does it have any of the other TCP functions,
    except for an error detection checksum and source and destination port identification
    fields.'
  merge: -1
  img_proc: true
