    to a binary code appropriate for the medium, and transmits it over the network.
    In the

    s way, the physical layer receives signals from the network and converts them

    to an appropriate format for the data link protocol.


    These elements—the network medium, interface, topology, installation, and signaling

    scheme—are all defined by a single protocol specification. For example, a typicalnEther
    physical layer specification might call for shielded twisted pair (UTP) cable,

    installed in a star topology, with a maximum segment length of 100 meters, using
    RJ-45

    connectors and an encoding scheme called Differential Manchester. Other Ethernet
    speci-

    cifications for fiber-optic or other network media, each with its own interface,
    topology,

    installation, and signaling characteristics. For more information on physical
    layer hardware,

    see Chapter 2, "Network Topologies and Types," and Chapter 3, "Cables and Connectors."


    > EXAM TIP


    When preparing for the Network exam, it can be easy to get lost in details that

    unlikely to appear in exam questions. It''s only important to know the basic

    functions with each layer of the model and how those functions fit

    to the network communications process.


    # Layer 2: The Data Link Layer


    The data link layer, layer 2 of the OSI model, closely associated with the physical
    layer.

    The two implement the computer''s connection to and communication with the

    local area network (LAN) to which the device is attached. Selecting a protocol
    for the'
