    for providing

    the following elements:


    **Network Medium** The technology that carries signals from one computer to another,

    such as copper-based cable, fiber-optic cable, or radio transmissions


    **Network Interface** The connection between the computer and the network medium,

    such as a cable connector or a radio transceiver


    **Network Topology** The arrangement of the network medium in the work site, such

    as the topology typically used by cable networks


    **Network Installation** The guidelines for the installation of the network medium,

    as as radio frequencies, maximum cable lengths, number of devices permitted, and

    proximity to other equipment


    **Network Signaling** Specifies the nature of the signals: electrical, optical,
    or radio,

    which the devices use to transmit binary data over the network medium.


    Computers communicate at the physical layer by generating signals and transmitting

    tover a network medium. For outgoing communications, the physical layer receives

    data from a protocol running on the lower it (the data link layer), converts the
