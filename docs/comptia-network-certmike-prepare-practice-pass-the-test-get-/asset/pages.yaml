- pgno: 24
  md: '# Study Guide Elements


    This study guide uses a number of common elements to help you prepare. These include
    the following:


    **Exam Tips** Throughout each chapter, we''ve sprinkled practical exam tips that
    help focus your reading on items that are particularly confusing or important
    for the exam.


    **CertMike Exam Essentials** The Exam Essentials focus on major exam topics and
    critical knowledge that you should take into the test. The Exam Essentials focus
    on the exam objectives provided by CompTIA.


    **Practice Questions** Two questions at the end of each chapter will help you
    assess your knowledge and if you are ready to take the exam based on your knowledge
    of that chapter''s topics.


    # Additional Study Tools


    This book comes with a number of additional study tools to help you prepare for
    the exam. They include the following:


    > NOTE

    Go to www.wiley.com/sybetextprep to register and gain access to this interactive
    online learning environment and test bank with study tools.


    Sybex Test Preparation Software

    ybex''s test preparation software lets you prepare with electronic test versions
    of the Practice Questions from each chapter and the Practice Exam that is included
    in this book. You can build and take tests on specific domains or by chapter,
    or cover the entire set of Network+ exams using randomized tests.


    # Audio Review


    I''ve (Mike) recorded an audio review when I read each of the sets of chapter
    Exam Essentials. This provides a helpful recap of the main material covered on
    the exam that you can use while you''re commuting, working out, or relaxing.


    > NOTE

    Like all exams, the Network+ certification from CompTIA is updated and may be
    retired or replaced. After some point CompTIA is no longer offering this exam,
    the old editions of our books and online tools will be retired. If you have purchased
    this book after the exam was retired, or are attempting to register in the Sybex
    online learning environment after the exam was retired, please know that we make
    no guarantees that this exam''s online Sybex tools will be available once the
    exam is no longer available.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# EXAM N10-008 EXAM OBJECTIVES


    CompTIA goes to great lengths to ensure that its certification programs accurately
    reflect the IT''s best practices. They do this by establishing committees for
    each of its exams. Each committee consists of a small group of IT professionals,
    training providers, and publishers who are responsible for establishing the exam''s
    baseline level and who determine the appropriate audience level.


    Once these factors are determined, CompTIA shares this information with a group
    of hand-selected subject matter experts (SMEs). These folks are the true brainpower
    behind the certification program. The SMEs review the committee''s findings, refine
    them, and shape them into the objectives that follow this section. CompTIA calls
    this process a job-task analysis.


    Finally, CompTIA conducts a survey to ensure that the objectives and weightings
    truly reflect job requirements. Only then the SMEs go to work writing the hundreds
    of questions needed for the exam. Even so, they have to go back to the drawing
    board for further refinements in many cases before the exam is ready to live in
    its final state. Rest assured that the content you''re about to learn will serve
    you long after you take the exam.


    CompTIA also publishes relative weightings for each of the exam''s objectives.
