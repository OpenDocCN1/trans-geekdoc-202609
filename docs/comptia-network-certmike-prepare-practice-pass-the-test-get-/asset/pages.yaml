  img_proc: true
- pgno: 277
  md: '# ASSET DISPOSAL


    In a properly organized IT department, network hardware devices have a documented
    life cycle that should be inspected and maintained as well as when they should
    be replaced, retired, and disposed of.


    The process of decommissioning a network device of any appreciable value typically
    involves departments other than IT. The disposition of the device, as a financial
    asset of the company, must be accounted for in tax and other records. There might
    also be local ordinances to consider the environmentally safe disposal of particular
    types of devices.


    Asset disposal is also a security problem. IT personnel must be absolutely certain
    that any hardware leaving the company''s possession contains no usable or recoverable
    data. There are likely to be different retirement protocols for different types
    of products. Some of these are described in this section.


    # Factory Reset/Wipe Configuration


    For some types of networks, the only data they contain are the configuration settings
    for the device. Managed switches, for example, have individual configuration settings
    for each port, as well as those for the device. These settings may contain the
    IP addresses and MAC addresses associated with each port, information that could
    be used to mount an attack against the network.


    When resetting this type of device, the configuration settings must be erased
    before disposal, variously called factory reset or a wipe configuration. This
    feature typically returns the device to its original default configuration, eliminating
    the settings applied by its current owners.


    However, the implementation of this particular feature is up to the individual
    manufacturer, so there is no guarantee that a factory reset returns the previous
    configuration settings. IT personnel should check with the manufacturer of a device
    before relying on a reset to produce a product for disposal.


    # Sanitize Devices for Disposal


    For some types of devices, a factory reset or configuration wipe is a sufficient
    method of sanitizing a device for disposal. However, for computers or other devices
    that have hard disks or other storage media, a factory reset is definitely not
    sufficient. Windows operating systems, for example, have a reset feature that
    can optionally delete the user''s files from the computer''s hard drive, but it
    takes no to permanently delete them.


    When someone deletes files on a hard drive, they are not actually erased. The
    drive simply deletes the filenames from its file allocation table, leaving the
    actual data in'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'place and flagging the storage space as available for use. The data can therefore
    be recovered unless someone takes steps to remove it permanently. IT departments
    deal with a variety of storage media, and the requirements for sanitizing them
    can differ wildly, as follows:


    +   * Hard disk drives: Sanitizing (or purging) magnetic media requires that every
    bit of data be overwritten with 1s and 0s. There are software tools designed to
    do this, which comply with the traditional Department of Defense (DOD) 520.22-M
    standard, which calls for three overwrite passes: one with zeroes, one with ones,
    and one with random zeroes. Magnetic media can be sanitized using a powerful magnet
    that removes all data.

    * Solid-state drives: As a relatively recent development, solid-state drives (SSDs)
    require special consideration because it is not possible to simply overwrite them,
    as with magnetic media. The DOD 520.22-M standard does not address the issue of
    SSD. A newer standard published by the National Institute of Standards and Technology
    (NIST) as SP 800-88 addresses a wider variety of data types. In most cases, SSD
    manufacturers provide proprietary commands for wiping the data from their drives.


    Of course, the ultimate sanitization method for any medium is to destroy it. Shredding,
    crushing, chemical solvents, and high temperatures are some of the options used
    for various media types.


    # CERTMIKE EXAM ESSENTIALS


    +   * Networks are susceptible to physical attacks as they are vulnerable to cyberattacks.

    * Detection methods allow network administrators to learn when an intrusion or
    attack has occurred. Video surveillance with well-placed cameras is one of the
    most effective detection methods, but there are also motion detectors that generate
    alerts when an unauthorized entrance to a protected area occurs.

    * Prevention methods are designed to make it more difficult for attackers to penetrate
    the network''s security. These methods range from training employees to spot suspicious
    behavior to installing elaborate locking and authentication systems involving
    ID badge readers and biometric scanners.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Practice Question 1


