- pgno: 323
  md: 'IT technicians should consider all the factors discussed in this section in
    relation to the network''s functionality.


    # Antennas


    Chapter 12 discusses the role of the antenna in wireless networking and some of
    the types of antennas that are available. In some cases, wireless networking problems
    can be attributed to the choice of antennas that WAPs use and their locations.


    All wireless devices have at least one antenna. While there are antenna replacement
    and enhancement products available for smartphones and other mobile devices, most
    troubleshooting efforts concentrate on the WAP antennas, which are more easily
    configurable or replaceable. When troubleshooting wireless transmission problems,
    consider the following aspects of the WAP antenna:


    Resolving a wireless networking problem can sometimes be as easy as moving the
    access point to a different location. If some of the wireless devices can readily
    access the network while others have trouble connecting, moving the antenna to
    a more central location. If unauthorized users outside the building are accessing
    the network, moving the antenna away from the outer walls.


    The location of an access point is also affected by the type of antenna that is
    using. Omnidirectional antennas can be located centrally because they transmit
    and receive in all directions. To restrict connectivity to a specific area, it
    is possible to use a directional antenna on a WAP and place it near a wall pointing
    inward. This can prevent unauthorized users outside the space from gaining access
    to the network.


    The orientation of a device antenna specifies its polarization, which indicates
    the direction in which the signal is strongest. For the best transmission between
    a client device and a WAP, the two antennas should be oriented in the same way
    so their polarization match. If one device is oriented vertically and the other
    horizontally, the signal strength can be substantially reduced.


    # Channel Utilization


    As noted in Chapter 12, the 2.4 GHz and 5 GHz frequencies used for Wi-Fi networks
    are divided into channels. Access points are configured to use a particular channel
    or to select one automatically. With any network, too much traffic on a medium
    can cause its performance to degrade. When there are too many clients accessing
    the same channel, the network slows down and some users might be unable to connect.


    When a network has too much traffic on one channel, troubleshooters can address
    the problem in various ways, including the following:


    Configure the devices to use a different channel. While this might seem like an
    obvious solution, the use of the Wi-Fi channels tends to fluctuate constantly.
    Most wireless devices select a channel automatically by default, and many administrators
    permanently reconfigure their devices to use nonoverlapping channels. However,
    constantly'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'scanning the frequencies and reconfiguring the network devices to use the least
    occupied channel at the moment is generally not a practical solution.


    **Configure access points to use different channels.** When a network has more
    heavy-use client devices than a single channel can support, one is to use WAPs
    configured to use different channels with the same SSID.


    **Use a different frequency.** In a location where the 2.4 GHz band is regularly
    populated with other networks, some administrators move their equipment to the
    5 GHz band instead, which tends to have less traffic (though this may change).
    In some cases, moving to the 5 GHz band might require equipment replacement, which
    would make it a less attractive solution.


    # AP Association Time


    Every client device, when connecting to an access point, must first authenticate
    itself and then associate with the Wap. Until both processes are complete the
    client access network. Access points typically log the AP association time, the
    time required to perform each client connection, and supply that information to
    administrators using SNMP or other means. When association times get longer as
    a trend, it could be an indication that the access point is being overwhelmed
    with traffic. If the authentication/association process takes too long, the client
    device will eventually time out and disconnect. Troubleshooters working on a problem
    in which wireless clients spontaneously disconnect from the network should check
    this statistic.


    # Site Survey


    Site surveys should be a critical part of every wireless network''s design, deployment,
    maintenance, and troubleshooting processes. A pre-design survey provides information
    about the space to be served and should show other wireless networks and potential
    sources of interference in the area. Once the network is installed, another survey
    can serve as a baseline for future comparisons.


    Wireless networks are more volatile than wired networks. For many organizations,
    adding new client devices, reconfiguring the office space, installing new equipment,
    and accommodating new sources of interference are all commonplace occurrences.
    For this reason, it is a recommended practice to repeat the site surveys on a
    regular basis. When problems appear, the records of the site surveys can help
    troubleshooters to identify trends that might be possible causes.


    # COMMON ISSUES


    As noted earlier, there are many things that can go wrong on a wireless network.
    Some of the problems that occur most frequently are discussed in this section.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Interference


    A source of interference on a wireless network can be anything that affects the
    successful transmission of a signal. Interference can cause a client device connection
    to slow down, drop the connection intermittently, or not at all. Assuming that
    the problem client was functioning properly, a sudden increase in interference
    can be caused by new equipment installed nearby, such as corded phones or a microwave
    oven, or intervening walls or furniture that was not before, or any number of
    sources.


    There are two main ways to address excessive interference on a wireless network:
    either remove the source of the interference or move the problem. Moving the client
    device away from the source of the interference should work, as moving the client
    closer to the access point.


    # Channel Overlap


    As explained in Chapter 12, the channels in the 2.4 GHz band overlap with each
    other, meaning that a device using one channel can interfere with another device
    of the adjacent channel. Mathematically, there are only three channels a 2.4 GHz
    wireless network can use avoid channel overlap entirely: channels 1, 6, and 11.
    Many administrators configure their devices to only use these channels for reason.


    The problem with this strategy is that it only applies to the 2.4 GHz band and
    only on the 802.11 standards. 802.1g network, for example, the nonoverlapping
    channels are 5, 9, and 13.


    The other issue that affects channel overlap is the ability to bond channels together
    to create a single, larger channel. Creating wider bonded means that there are
    fewer channels available. A 5 GHz 802.11ac network, for example, can support the
    bonding of up to 20 MHz channels, splitting the 5 GHz band into only two 160 MHz
    channels. Wider channels complicate the overlap situation as Troubleshoot should
    be conscious of the channel bonding strategy using the wireless network and consider
    channel overlap as a possible cause of interference.


    # Antenna Cable Attenuation/Signal Loss


    External antennas are typically connected to wireless access points using coaxial
    cables, and it is important to minimize the signal loss between the antenna and
    the WAP. The antenna connection is susceptible to attenuation as any other network
    medium, especially in the higher frequencies. Choose an antenna cable with low
    signal loss and install it properly, properly crimped connectors and a bend radius.


    # RF Attenuation/Signal Loss


    Radio frequency (RF) signals are susceptible to attenuation as any other signals.
    The farther from the access point a client device is located, the greater the
    signal loss and the weaker the signals will be. As a result of the weakened signals,
    the 802.11 standards call for a reduction in the connection. If the signals grow
    too, the client will be unable to connect to the network at all.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Troubleshooters can measure the RSSI at the client device location to quantify
    the signal loss in decibels (dB). Higher frequencies are subject to attenuation
    than lower ones, so a 5 GHz network is likely to attenuate more over the same
    distance than a 2.4 GHz network. To address an excess loss of signal due to attenuation,
    troubleshooters can do any of the following:


    +   * Move the client device and the WAP closer.

    * Add another WAP closer to the client.

    * Replace the antenna on the access point with one more suitable to the environment.


    # Wrong SSID


    The service identifier (SSID) is the name by which a wireless network is identified
    by clients. When a wireless device starts, it searches the frequencies for nearby
    SSIDs and displays them as a list from which the user can choose. Selecting the
    wrong SSID from the list or typing an incorrect SSID will attempt to connect the
    device to a neighboring network.


    In case of properly secured networks, the device will fail to authenticate to
    the wrong network and no connection will be established. In the case of unprotected
    networks, however, the device will connect to the wrong SSID, and it may take
    some time for the user to recognize that they are not connected to their usual
    network.


    # Incorrect Passphrase


    On a wireless network that uses a shared key for authentication, mistyping the
    key will cause the connection attempt to fail. Passphrases are case sensitive,
    and they are often masked in the interface, making it easy for users to mistype
    them without noticing.


    As noted in Chapter 21, "Network Troubleshooting Methodology,"trouhooters should
    always question the obvious. When a user reports that they are unable to connect
    to the network, the troubleshooter should make sure they are typing the correct
    passphrase before exploring more complicated possibilities.


    # Encryption Protocol Mismatch


    Encryption issues are one of the most common problems faced by wireless troubleshooters.
    For a client device to connect to a WAP, both must be configured to use the same
    encryption protocol. With an incorrect passphrase, an encryption protocol mismatch
    will prevent the client from establishing a connection to the network. For example,
    a user might easily select the Wi-Fi Protected Access (WPA) security protocol
    instead of WPA2. Despite being different versions of the protocol, the two are
    not compatible, and the connection will fail.


    For troubleshooters, the easiest way to determine whether a connection problem
    is due to a security issue is to temporarily configure the client device and the
    WAP with no'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Chapter 24 • Troubleshooting Wireless Connectivity


    security at all. If the client can successfully connect to an open network, but
    not to a secured one, then the problem is definitely related to the selection
    and configuration of the security protocol.


    Depending on the client device interface, it might be necessary for the user or
    the troubleshooter to delete (or forget) the SSID connection before re-creating
    it with the correct security protocol selected.


    # Insufficient Wireless Coverage


    Insufficient wireless coverage can refer to a network in which there are users
    too far from the nearest access point to connect reliably to the network. The
    term can also refer to an access point that is overwhelmed with traffic. Both
    of these conditions can potentially cause degraded performance and dropped connections.
    In both cases solutions are typically the same for signal loss due to attenuation,
    discussed earlier: move the WAP, add a WAP, or replace the antenna.


    # Captive Portal Issues


    As noted in Chapter 18, "Network Hardening," a captive portal is a web page through
    which new users must post before they can access a wireless network. Found mostly
    on publicfacing websites, captive portals typically require users to identify
    themselves and agree to an acceptable policy before they are permitted to access
    the wireless network.


    Some users might be puzzled by the appearance of the captive portal and think
    that they are being redirected to another website. In other cases, networks protected
    by captive portals impose a throttle on the throughput to prevent users from monopolizing
    the network''s bandwidth. This too might confuse users, leading them to request
    technical support.


    # Client Dissociation Issues


    Client disassociation is a sudden, unplanned disconnection from a wireless network.
    This can occur for many reasons, several of which have been discussed in this
    chapter, such as attenuation, interference, and excessive traffic. However, client
    disassociation can also be the result of a deliberate attack, intended as the
    opening salvo of a denial-of-service attack.


    By transmitting Wi-Fi management frames, attackers can forcibly dissociate a client
    device from its current wireless network and associate it with the attackers''
    own, for whatever nefarious ends they have in mind. The solution for this type
    of attack is to use a Wi-Fi implementation that supports the IEEE 802.11w standard
    for protected management frames.'
  merge: -1
  img_proc: true
