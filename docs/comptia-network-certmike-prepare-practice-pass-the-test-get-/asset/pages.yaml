- pgno: 263
  md: '# VIRTUAL PRIVATE NETWORKS


    A virtual private network (VPN) is a means for connecting computers or networks
    together using a secure tunnel carried by an unsecured network, such as the Internet.
    This means all of the packets containing the VPN traffic are encrypted and encapsulated
    within standard IP packets so that they can be safely transmitted over an unsecured
    network.


    # Client-to-Site VPN


    The primary use for a VPN is to provide a client workstation with access to a
    VPN server at a remote site, which in turn provides access to the site''s network.
    The typical client-to-site VPN scenario is that of a user at a remote location
    connecting to a company network using the Internet. At the server is a device
    that listens for connection requests from the Internet. This device can be a router
    or a VPN server product running on a computer, but there are also specialized
    devices VPN concentrators that can handle connections from many clients at once.
    These severs and routers the additional burden of processing connections.


    It is also possible to create VPN connections using other carriers, such as wide
    area network (WAN) or even local area network (LAN) connections. For example,
    administrators take advantage of VPN security by using them within a facility
    to connect and manage their services.


    # Site-to-Site VPN


    VPNs have also become a popular solution for site-to-site connections. For years,
    leased lines and other WAN connection types were the standard for links between
    sites at distant locations. However, leased lines are expensive and inflexible;
    the cost is based on the length of the connection, and the customer pays for a
    set amount of bandwidth day and night, whether or not they use it.


    By contrast, a site-to-site VPN connection requires only that each site has a
    VPN server and a connection to a local Internet service provider (ISP). The cost
    is much lower than that of a leased line or any other WAN technology, and increasing
    the VPN''s bandwidth requires a change in the contract with the ISPs at both sites.


    # Clientless VPN


    A remote access typically requires a VPN client software product. The VPN client
    is responsible for establishing and maintaining one end of the tunnel. However,
    VPN products are now available that use the Secure Sockets Layer/Transport Layer
    Security (SSL/TLS) encryption capabilities built into current web browsers to
    create the client end of the tunnel. No special software installation is required
    at the client end and a web-based user interface enables remote users to access
    resources on the network at the server end.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Split Tunnel vs. Full Tunnel


    When a VPN client connects to a remote VPN server, it creates a new logical network
    connection. However, the client''s original (unencrypted) connection to the Internet
    is still in place. VPN clients typically provide two options for use of these
    connections, as follows:


    +   **Split Tunnel:** In a split tunnel, both of the network connections remain
    active, with all company traffic going through the VPN connection, while the system
    uses its original, unprotected connection for Internet access. This reduces the
    traffic passing through the VPN tunnel but presents a potential security hazard
    if the Internet connection is unprotected.

    **Full tunnel:** In a full tunnel, only the VPN tunnel connection remains active,
    with all company traffic going to the remote network. The client therefore accesses
    the Internet through the remote network, providing it with the additional security
    monitoring and protection of the company infrastructure.


    Remote Desktop Connection (RDC) (see Figure 19.1) is a graphical application that
    enables a client user to connect to a host at another location and control it


    ![](img/131506e178f74f7b4704a0aa0fe03dae_264_0.png)


    FIGURE 19.1 The Remote Desktop Connection client interface'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'as though the user was seated in front of it. Once connected, everything the
    client user does occurs on the host machine; the client and the host exchange
    only keyboard, mouse, and display traffic.


    RDC is a tool, originally created by Microsoft, that uses a proprietary Remote
    Desktop Protocol (RDP) to carry traffic between the client and the host. RDC enables
    administrators to access servers from anywhere, telecomputers to access their
    company workstations, and troubleshooters to work on users problems without traveling.


    All Microsoft operating systems since Windows XP in 2001 have included an RDC
    client, and there are now client ports available for virtually every other popular
    operating system, including those for smartphones and other mobile devices. The
    server side of the RDC application for a single remote user is provided in the
    Pro versions of the current Microsoft operating systems. There is also a Windows
    Server role called Desktop Services, which enables clients to access session desktops,
    virtual desktops, and RemoteApps on the host server’s network.


    # EXAM TIP


    Now called Remote Desktop Services, the server-based RDP product was called Terminal
    Services until the release of Windows Server 2008. Candidates for the Network+
    exam should be aware that documentation might be available under the earlier name.


    # REMOTE DESKTOP GATEWAY


    Remote Desktop Gateway (RD Gateway) is a role servicethat is, a subcomponent—of
    the Remote Desktop Services role in Windows Server. RD Gateway provides Remote
    Desktop clients with a secure, encrypted RDP connection to the server, through
    which they can access resources. In addition, RD Gateway can work with other servers
    in the network to provide certificate-based authentication and authorization services
    for connecting users.


    RD Gateway is designed to provide secure access to Remote Desktop servers and
    other resources on the host network without the need for a VPN server. The server
    running the RD Gateway service is typically located on a perimeter network, where
    it is both accessible from the Internet and can access resources running on the
    internal network. Clients connecting to RD Gateway can access virtual desktops,
    Remote Desktop servers, and RemoteApp applications on the host network.


    Telnet is a simple, character-based program that enables a user to connect to
    a computer at a remote location and execute commands. However, Telnet is also
    insecure, sending passwords and other input in clear text. Secure Shell (SSH)
    is a character-based remote access protocol that differs from Telnet mainly in
    SSH encrypts the connection between the client and the server. SSH also authenticates
    both the client and the server daemon before it permits the connection to be established.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Virtual Desktop 235


    ![](img/131506e178f74f7b4704a0aa0fe03dae_266_0.png)


    SSH Client

    SSH Server


    FIGURE 19.2 SSH secure channel establishment


    Originally created for use on Unix/Linux systems, and using the same command-line
    interface, SSH is an enormous improvement over Telnet. This is primarily because
    SSH ensures the confidentiality and integrity of all of its client/server traffic
    using public key encryption, as shown in Figure 19.2, while Telnet transmits over
    the network in unencrypted format, including usernames and passwords.


    # VIRTUAL NETWORK COMPUTING (VNC)


    Virtual Network Computing (VNC) is a graphical remote control application similar
    in function to Remote Desktop Connection, with the exception that VNC was designed
    from its inception to be platform independent. VNC requires the installation of
    software product at both ends of the connection: a client and a server. There
    is also a protocol that carries the traffic between the client and the server
    called Remote Frame Buffer (RFB). Unlike RDC, the VNC software is not supplied
    with operating systems, nor is it.


    # VIRTUAL DESKTOP


    A virtual desktop is an operating system image, hosted on a server, that a user
    can access from a client device at any remote location. Like RDC, the virtual
    desktop and all of its applications run on the server. A virtual desktop arrangement
    uses a Virtual Desktop Infrastructure (VDI) at the server end, which hosts multiple
    desktop images for different users. The device from which the user accesses the
    virtual desktop functions only as a thin client, exchanging keystrokes, mouse
    movements, and display traffic with the server.

    There are notable advantages to this arrangement. The user''s device only needs
    resources sufficient to run the virtual desktop client software; any applications
    running on a user''s virtual desktop actually execute on the VDI server, using
    the server''s processors, memory, storage, and other resources. This means that
    virtually any device can function as a virtual'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Chapter 19 $\cdot$ Remote Access


    desktop client, including devices that are not capable of running the desktop
    operating system themselves, such as smartphones and other mobile devices.

    In addition, all of a virtual desktop user''s applications, data, and configuration
    settings remain on the VDI server, protected by the enterprise infrastructure
    either in the company data center or in the cloud. Some organizations deploy all
    of their workstations as virtual desktops. For example, a user can work in a particular
    document until quitting time, then go home, leaving the document open on their
    virtual desktop, and later connect to the same desktop from their home computer
    and resume working where they left off.


    Some organizations maintain a VDI in their own data centers, but others implement
    it in their own cloud infrastructure. Cloud service providers also provide virtual
    desktops to customers by individual subscription, marketing the product as a service
    (DaaS).


    # AUTHENTICATION AND AUTHORIZATION CONSIDERATIONS


    Many remote access solutions are available with security capabilities that vary
    widely, but all them suffer from the same fundamental weakness: they open a great
    big door to your network with flashing lights and a neon WELCOME sign. The nature
    of the protection that network administrators provide at that door must be a critical
    part of any remote access server deployment.

    *Authentication* is the basic credential check that all remote users undergo before
    they gain any access to the host network. Many remote access server products are
    capable of using other services on the network for authentication, such as RADIUS,
    TACACS+, and Directory. The authentication process for remote access users should
    be, if anything, more rigorous than that for on-premises users. Multifactor authentication,
    a practice that seemed extreme just a few years ago, is now commonplace, typically
    using a username/password and a one-time code sent to a smartphone or email address.


    Authorization is the process of controlling access to specific network resources,
    often employing a system of permissions that enables administrators to precisely
    tune the access to specified users. The theory of least permissions, in which
    users are granted the minimum access they need to perform their tasks, applies
    to remote access even more strenuously than it does for an on-premises user.


    # IN-BAND VS. OUT-OF-BAND MANAGEMENT


    Network devices, such as routers, have three categories of network traffic, called
    planes. The data plane and the control plane consist of the actual user traffic
    being processed'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# In-band vs. Out-of-band Management


    the device, while the management plane handles the traffic generated by administrators
    as they monitor and configure the device.


    In most cases, network devices default to the standard network interfaces for
    all three planes. In other words, the management traffic is mingled with the data
    and control traffic. This is known as in-band management, with the term band referring
    to the device''s standard network interfaces. Under normal conditions, in-band
    management is a perfectly serviceable arrangement, but if there would be a fault
    that affects the device''s network interfaces, administrators might be left with
    no means of accessing the management plane to troubleshoot the problem.


    For this reason, many network devices have an alternative means of accessing the
    management plane. Any mechanism that provides access to a device''s management
    plane through other than the standard network interfaces is called out-of-band
    management.


    For many devices, their out-of-band management capabilities take the form of an
    extra network interface, such as an Ethernet or USB port, typically labeled Console.
    Administrators can plug a device into the Console, such as a laptop, a terminal,
    or via a dial-up modem, and gain access to the device''s command-line interface.
    In addition to providing monitoring and troubleshooting access, the Console interface
    provides the administrator with the management plane access needed to perform
    the initial setup and configuration of the device.


    # CERTMIKE EXAM ESSENTIALS


    +   A virtual private network is a secure connection between a client and a network
    or between two networks. Using the Internet or any other carrier, the VPN endpoints
    establish a secure, encrypted connection between called a tunnel.


    +   Remote control programs allow users to perform actions on a system at a distant
    location. Early applications, such as Telnet and SSH, are character-based and
    provide access to the command-line interface only. The more recent remote control
    products, such as Remote Desktop and VNC, are graphical, enabling users to take
    full control of a remote system.


    +   All types of remote access introduce serious security vulnerabilities to a
    network. The procedures for authenticating and authorizing remote access users
    should be more stringent than for internal users.'
  merge: -1
  img_proc: true
