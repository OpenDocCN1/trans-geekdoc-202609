  md: '# Chapter 4 • IP Addressing


    # Converting Binaries and Decimals


    The Network+ exam typically includes questions on subnetting that require students
    to calculate IP addresses. When calculating addresses manually, the biggest problem
    is often converting between binary and decimal values. To convert a binary value
    into a decimal, assign decimal values to each of the binary bits, incrementing
    them from right to left and doubling them, as follows:


    | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    |---|---|---|---|---|---|---|---|

    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    Then, plug the bits of the binary value to be converted, in this case 1011000,
    and add the decimals for each of the 1 bits together, resulting in 172, as follows:


    | 1 | 0 | 1 | 1 | 0 | 0 | 0 |

    |---|---|---|---|---|---|---|

    | 128 | 64 | 32 | 16 | 8 | 4 | 2 |


    128 + 32 + 8 = 172


    To convert a decimal to binary, subtract each of the incremented values, from
    left to right, from the number to be converted. For each of the incremented values
    it is possible to subtract, assign a binary value of 1. For all of the other values,
    assign a 0. Starting with 172, it is possible to subtract 128, 32, 8, and 4, resulting
    in a binary value of 1011000, as shown:


    ![](img/131506e178f74f7b4704a0aa0fe03dae_79_0.png)


    | 1 | 0 | 1 | 1 | 0 | 0 | 0 | = 1011000 |


    # IPv4 vs. IPv6


    Internet Protocol version 6 expands the IP address space from 32 bits, which increases
    the number of possible IP addresses from 2³² (or 4.2 billion) to 2¹²⁸ (or 3.4×10³⁸
    or 340 undecillion, a 39-digit number). The notation of IPv6 addresses is also
    completely different from that of IPv4. Instead of decimal numbers, an IPv6 address
    consists of 16-bit hexadecimal numbers, separated by colons, as follows:


    XX:XX:XX:XX:XX:XX:XX


    Each of the Xs represents 1 byte (8 bits), which in hexadecimal notation requires
    two characters. Therefore, a typical IPv6 address looks like the following:


    ```

    21cd:0053:0000:0000:fe8b:04f2:003c:c394

    ```'
