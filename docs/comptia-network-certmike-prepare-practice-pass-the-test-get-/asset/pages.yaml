    +   - Mesh

    - Star/hub-and-spoke

    - Bus

    - Ring

    - Hybrid

    - Network types and characteristics

    - Service-related entry points

    - Virtual network concepts

    - Provider links


    # NETWORK TOPOLOGIES


    In networking terminology, a topology is a definition of the manner in which a
    network medium is installed. Originally coined to describe cable installations,
    the topology of a'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Chapter 2 • Network Topologies


    network specifies how the cables are installed and how the computers and other
    devices are connected to each other.


    For example, the most commonly used topology in cabled local area networks (LANs)
    today is the star topology (see Figure 2.1), sometimes called a hub-and-spoke
    topology because of the diagram''s resemblance to a wheel.


    ![](img/131506e178f74f7b4704a0aa0fe03dae_49_0.png)


    FIGURE 2.1 A cabled local area network using a star topology


    In a star topology, each computer or other device has its own dedicated connection
    to a central cabling nexus called a switch. The switch relays the traffic it receives
    from each computer to the appropriate recipient on the network by transmitting
    all of it through one of its other ports. Older star networks might use a hub
    instead of a switch. A hub is a physical layer device that forwards incoming traffic
    through all of its ports instead of just one, forming a true shared network medium.


    Virtually all cabled LANs installed today use the Ethernet protocol with unshielded
    twisted pair cable in a star topology. To build larger networks, it is possible
    to switch switches forming a hierarchical star topology in which the computers
    on all of the switches communicate with each other.


    Before star topology became ubiquitous as for cabled LANs, there were other topologies
    in use, including the following:


    +   Bus Early Ethernet networks used coaxial cable in a bus topology, in which
    each device is connected to the next device, forming a chain. The bus topology
    is no longer used primarily because of its lack of fault tolerance. A cable break
    or a malfunctioning network interface adapter in one of the computers splits the
    network in two, with the devices on one segment unable to communicate with the
    other segment.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'A ring topology is essentially a bus with the ends of the chain connected together
    so that traffic can circulate around the whole network. An early protocol called
    Token Ring used a topology in which the computers passed a small token frame from
    system to system around the ring. This functioned as a media access control mechanism
    because only the device in possession of the token was permitted to transmit its
    data. Another obsolete protocol called Fiber Distributed Data Interface (FDDI)
    called for fiber-optic cable in a physical topology, or a double ring for fault
    tolerance.


    A hybrid topology is a network that uses elements of two or more topologies on
    one network. For example, the ring topology of a Token Ring was virtual in most
    instances; the physical network was a star, with all of the devices connected
    to a central hub called a multation access unit (MAU). The signals, all of them,
    traveled in a ring, with the MAU sending each packet out to a computer and waiting
    for its return before sending it to the next computer. Another hybrid topology
    was the star, in which multiple networks were connected to a backbone that used
    bus topology.


    A mesh topology, theoretically, describes a network in which each computer has
    a separate connection to every other computer, providing full redundancy and fault
    tolerance. For aabled LAN, a mesh topology would in most cases be impossible,
    or at least impractical. However, wide area network (WAN) connections between
    remote offices can conceivably use any topology, including a mesh. A WAN topology
    in which each site is connected to two or more other sites is called a partial
    mesh. This arrangement provides fault tolerance in the case of a WAN link failure,
    but it is also extremely expensive.


    # NETWORK TYPES AND CHARACTERISTICS


    The word network has different meanings in different contexts, even within the
    IT field. Technically, any group of computers that are connected together so that
    they can share data is a network. However, networking has evolved rapidly over
    the decades, and so has the definition of a network. The Network+ exam expects
    candidates to be familiar with the following network types:


    Local Area Network (LAN) collection of computers and other devices in the same
    geographic area, such as a room, floor, or building, connected using cables or
    a wireless medium so they share data. To connect a LAN to another network, a router
    is necessary. This creates a network of networks, also known as an internet.


    Wireless Area Network (WLAN) collection of computers in a limited geographic area
    that are connected using a wireless network medium, such as Wi-Fi, the radio-based
    technology defined in the IEEE 802.11 standards.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 2 · Network Topologies


    Wide Area Network (WAN) A point-to-point link between two remote locations, typically
    provided by a third-party carrier. WANs are generally slower than LANs, but they
    can span longer distances. A WAN link can connect a single user to a remote LAN
    or connect two LANs, enabling users at each site to access resources at the other
    site.


    Metropolitan Area Network (MAN) A collection of computers in a larger geographic
    area than a LAN, such as a neighborhood, district, or city. A MAN is essentially
    a collection of LANs connected together using WAN technology, such as fiber-optic
    links, to form an interconnect.


    Personal Area Network (PAN) A collection of devices, such as smartphones, tablets,
    and laptops, that are in close proximity and usually belonging to a single person.
    A PAN is typically wireless, connecting the devices using a short-range medium
    such as infrared or Bluetooth, but it can also use cable connections, such as
    Universal Serial Bus (USB).


    Campus Area Network (CAN) Larger than a LAN, but smaller than a MAN or WAN, which
    is a collection of LANs connected together using WAN links to service a school,
    enterprise, housing, or government campus. Unlike MANs or WANs, which typically
    rely on third-party service providers for their WAN connections, the networking
    equipment is usually owned by the campus tenant.


    Storage Area Network (SAN) A collection of storage devices, such as disk arrays
    or network attached (SAN) units, connected to a network that provides servers
    with either direct block-level access or filesystem to the devices. The servers
    can access the storage as though it was installed locally. High-end SANs are typically
    fiber-optic networks dedicated to storage traffic, with block-level storage devices
    running a specialized protocol as Fibre Channel. However, there are lower-cost
    alternatives, such as iSI, which enables storage traffic to coexist with TCP/IP
    traffic on a standard Ethernet network.


    > EXAM TIP


    Objective 1.2 for the Network+ introduces some concepts that are explored in later
    chapters. For example, SANs receive only the most rudimentary coverage here but
    are examined further in Objective 1.7. Exam candidates should be conscious of
    these scattered topics so to evaluate how much time and preparation they deserve.


    Software-Defined Wide Area Network (SDWAN) A type of wide area network in which
    the hardware providing the WAN connectivity is separated from links, that controls
    the traffic. This enables the network to combine various WAN technologies and
    dynamically route traffic by selecting the link that is most appropriate for the
    data being transmitted and the most efficient, based on current network conditions.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'concept is similar to that of software-defined networking (SDN), which separates
    the network control function from the network forwarding function. Instead of
    both functions performed by individual routers, in SDN the routers still do the
    packet forwarding, but the control of the routing for the entire network is located
    in a centralized control unit.


    **Multip Label Switching (MPLS)** A packet routing technique that applies labels
    to packets and routes them based solely on the path information in the label,
    rather than using the packet''s destination address. MPLS network adds a 32-bit
    MPLS header to each packet, making it possible to route the traffic without consulting
    the data link and network headers. MPLS can therefore handle multiple protocols,
    including Frame Relay and Asynchronous Transfer Mode (ATM), as well as IP and
    Ethernet. Its functionality is referred to as a layer 2. protocol.


    **Multipoint Generic Routing Encapsulation (mGRE)** Generic Routing Encapsulation
    (GRE) is a tunneling protocol that encapsulates network layer data and transmits
    it over an established point-to-point link, such as a virtual private network
    (VPN). Multipoint Generic Routing Encapsulation (mGRE) expands on that by dynamically
    creating new tunnels between points as needed. This eliminates the need for administrators
    to create individual tunnel mappings between sites.


    # EXAM TIP


    The objectives for the Network+ exam sometimes includes elements that seem out
    of place, such as the inclusion of MPLS and mGRE in a list of network types. Both
    of these protocols that run on networks and provide traffic handling alternatives
    to the usual LAN and WAN technologies, but they are not network types in the sense
    that you might have an MPLS instead of a LAN. However, exam candidates should
    still have a basic familiarity with these technologies.


    # NETWORK ROLES


    The roles of the computers on a network can vary depending on the operating systems
    (OSs) that are running and the hardware used to construct them. Network communication
    frequently involves two roles: the server and the client. A server is a computer
    that provides services to other computers. A *client* is a computer that generates
    requests for services and sends them to servers.


    For example, a web server listens for incoming requests from the network and responds
    to them by supplying web content. Client computers running a web browser generate
    the requests when a user types a web address or clicks a hyperlink.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Chapter 2 • Network Topologies


    There are two basic network role configurations, as follows:


    +   * Client/server: Describes a network that uses one dedicated server and client
    computers. Novel NetWare, for example, was the server OS for a client/server network
    that possessed virtually no client capabilities. It had a rudimentary character-based
    interface and could not run client applications. Client computers ran requests
    to the server.

    * Peer-to-peer: Describes a network on which the computers are capable of functioning
    as both clients and servers. Today''s OSs, such as Windows and Unix/Linux, include
    both server and client capabilities. On a network that consists only of Windows
    workstations, for example, any computer can function as a server for the other
    computers and can also run client applications.

    Even a computer running a Windows Server operating system has full client capabilities.


    # SERVICE-RELATED ENTRY POINTS


    While it is possible for a LAN or an internet to operate independently from all
    outside services, most networks have connections with third-party providers. Nearly
    all networks today have a connection to an Internet service provider (ISP), but
    businesses often have additional connections, such as those to telephone carriers
    and WAN service providers.


    These connections to outside services require an entry point, a physical interface
    where the client''s internal equipment meets the service provider. This is often
    referred to as a demarcation point (or demarc) because it specifies the place
    where the client''s responsibility for the connection ends and the provider''s
    responsibility begins. Any technical issues outside the demarc are the provider''s
    responsibility; for issues inside the network, the client is responsible.


    The demarcation point takes the form of a network interface device (NID), by containing
    the connection—electrical or optical—between the two networks. In its most basic
    form, an NID is a physical layer device. However, for some connections, additional
    equipment is needed. For example, a leased line requires a channel service unit
    (CSU) and a data service unit (DSU), usually packaged in one device called CSU/DSU.
    In some cases, the service provider might choose to install an NID with additional
    capabilities called a smart-jack. A smart jack might have to amplify or decode
    signals, and it usually includes various types of diagnostics, such as a switchable
    loopback function and alarm notification capabilities. These diagnostics enable
    the service provider to monitor the connection remotely and perform rudimentary
    tests without having to send a technician to the site.


    # VIRTUAL NETWORK CONCEPTS


    Virtualization has become a standard part of enterprise networking for most people
    working in IT. In its most basic form, a virtualization server running a software
    component'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'called a hypervisor hosts multiple virtual machines (VMs). Each VM has its
    own virtualized hardware environment, so an administrator can install a standard
    operating system and applications on it.


    Like a physical computer, for a VM to function on a network, it must have the
    standard networking hardware devices, as a network interface adapter and access
    to a switch. As part of its virtualized hardware configuration, a VM includes
    software-based, virtualized versions of these devices, some of which are described
    in this section.


    # Hypervisor


    The hypervisor is the software component that abstracts the physical hardware
    of the computer and supplies a virtualized version of hardware to each VM. There
    are two types of hypervisors used in use, based on how the software runs in relation
    to the operating system, as follows:


    +   * **Type 1:** Usually implemented as part of an operating system product,
    the Type hypervisor loads the OS and exists as an abstraction layer between the
    VMs and the physical hardware. The hypervisor creates partitions, first of which
    is the parent partition and the others child partitions. The partition partition
    partition, which manages the physical hardware and runs the virtualization stack
    that creates the partitions. In this arrangement, there is no underlying operating
    system splitting resources with the hypervisor.

    * **Type 2:** Implemented as a stand-alone process that runs on top of existing
    operating system, the Type 2 hypervisor must have processor resources among the
    host OS and divide its allocation of resources among the guest VMs. Used in workstation-based
    virtualization products, Type 2 hypervisors typically do not provide the performance
    needed to host production servers.


    # Virtual Network Interface Card (vNIC)


    Every computer, even a virtual, needs a network interface adapter to connect to
    the local network. In a virtualized environment, therefore, to connect a VM to
    a network, it must have a virtual network interface card (vNIC).


    A vNIC performs many of the same functions as a physical network interface adapter,
    as implementing a data link layer protocol and getting packets for transmission
    to the network. With some virtualization products, it is even possible to install
    more than one vNIC in a single VM and create multiple networks within the virtualized
    environment.


    # vSwitch


    In a virtualized environment, a vSwitch performs the same role as a physical switch
    on a LAN. A switch is a data link layer device that functions as the communications
    nexus for a LAN. Each computer connected to one of the switches can communicate
    with the other connected computers by sending traffic through the switch.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Virtualization server administrators can create and configure vSwitches as
    needed, even creating vSwitches that are shared by multiple virtualization servers.
    The vNICs in the virtual machines connect to a vSwitch, which creates a virtual
    network internal to the computer. The VMs can all communicate with each other
    by sending traffic through the vSwitch.

    For this, virtual network to communicate with the physical network outside, the
    vSwitch must connect to the physical network interface adapter in the computer.
    The physical adapter has a connection to a physical switch, which provides the
    virtualization server—and all the virtual machines on it—with access to the physical
    network.


    # # Network Function Virtualization (NFV)


    Network function virtualization (NFV) is a type of network architecture in which
    specific working devices are implemented in a logical form called virtualized
    network function (VNF). VNFs can provide the functionality of firewalls, load
    balancers, intrusion detection systems (IDS), and other devices. Administrators
    can then deploy the VNFs as needed around the enterprise using standard hypervisor-based
    virtualization servers.


    # # PROVIDER LINES


    Most networks have a link to an ISP, providing users with access to the Internet.
    There are several technologies that a network can use for this access. The selection
    of an appropriate connection type is a decision based on cost, transmission speed,
    synchronicity, and availability. Most used ISP links are as follows:


    **Cable** Most cable television providers can supply Internet access as well as
    residential as business customers. In most cases, the Internet access is asymmetrical,
    meaning that the downstream stream (from the provider to the customer) is faster
    than the upstream speed. However, some providers have business-oriented services
    with more upstream bandwidth.


    **Digital Subscriber Line (DSL)** Asymmetric digital subscriber line (ADSL) is
    a telecommunications technology that splits the bandwidth of a standard wide area
    carrier line and dedicates part of that to network data, leaving the voice service
    intact. Because ADSL is asymmetric, downstream traffic is much faster than upstream.
    Primarily intended for residential or SOHO (small office, home office) Internet
    connections, ADSL is less popular than other types of provider links. However,
    it is the only alternative for some customers. For business customers, carriers
    might provide other DSL technologies with symmetrical speed and greater bandwidth,
    as a high-rate digital subscriber line (HDL).


    **Satellite** Uses a dish installed by a satellite ISP at the client''s location
    to access a communications satellite and connect to the Internet through it. There
    are two types of satellite service. In the *one-way service*, the customer receives
    downstream traffic through the satellite at high speed, whereas upstream traffic
    uses a slower land-based connection.'
  merge: -1
