    which could explain the performance degradation when the VPN is connected.


    B. is incorrect because a VPN is just a network connection, albeit a well-protected
    one, and not a remote control solution.


    C. is correct when users connect to a remote network using a full tunnel VPN client,
    they become a participant on that network, which includes the remote network''s
    Internet connection. Therefore, all requests and replies must pass through the
    VPN tunnel, incurring slight processing delays as data is encrypted and unencrypted.


    D. is incorrect because the VPN tunnel does not restrict the bandwidth of a connection.
    The only restrictions are in the devices'' connections to the Internet.


    Correct Answer: A and C'
