    There are two types of routing, depending on how the routing table is formed:
    static routing and dynamic routing, as defined in the following sections.


    # Static Routing


    In static routing, administrators create the entries in the routing table manually,
    using a tool such as route, a command-line utility that can display, modify, and
    create routing table entries. In static routing, manual entries remain in force
    until someone changes them. For small networks that do not change frequently,
    this is an acceptable solution. However, some networks have extremely routing
    tables, and some large enterprise networks have traffic conditions that change
    frequently, requiring updates to the routing tables. For cases as these, static
    routing is impractical.


    # Dynamic Routing


    For installations where static routing is impractical, usually because routing
    tables are too large or volatile to maintain, dynamic routing is the preferred
    solution. Dynamic routing is a technique for automatically building and updating
    routing tables. Routers do this by running routing protocols that allow them to
    exchange information with other routers in the area.


    By publishing their routing table information using these protocols, routers learn
    what lies beyond the network segments to which they are directly connected. This
    allows the routers to make more intelligent decisions about how to forward packets
    to a particular destination efficiently.


    Dynamic routing is where the metric value included for each entry in a routing
    table becomes important. Routing protocols modify this value for specific destinations
    to indicate the relative efficiency of a route to that destination. If a router
    providing access to a particular destination has many hops away, it will have
    a higher metric value. Large networks have multiple routes to a destination, which
    can the form of routing table entries. When there are multiple entries to choose
    from in the routing table, routers always choose the one with the lowest metric
    value.


    There are many routing protocols designed to service particular types of routers.
    Some of the most commonly used routing protocols are described next.


    # Routing Information Protocol (RIP)


    The Routing Information Protocol (RIP) is one of the oldest and simplest of the
    protocols. RIP works by transmitting the entire routing table over all available
    interfaces every'
