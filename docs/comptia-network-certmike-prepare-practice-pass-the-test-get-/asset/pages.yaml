- pgno: 91
  md: '# APPLICATION LAYER PROTOCOLS


    The TCP/IP suite includes many great application layer protocols, which typically
    work with applications or services running on a system to generate data for transmission
    over the network. The protocol passes the data down through the OSI model layers
    for encapsulation, starting with either TCP or UDP at the transport layer.


    Application layer protocols are identified by the ports they use, which are given
    by the Internet Assigned Numbers Authority (IANA). The TCP and UDP headers both
    contain 16-bit fields for the port numbers of the application layer protocols
    that are the source and destination of the data. This allows the transport layer
    protocols on receiving systems by passing incoming data to the correct protocol
    at the application layer.


    Because of the 16-bit Source and Destination Port fields in the TCP and UDP headers,
    there are 2^16, 65,536, possible port numbers available. The IANA has defined
    three types of port numbers and has assigned them the ranges of values shown in
    Table 5.2.


    # TABLE 5.2 TCP/ip port ranges


    | Port number range | Port type | Description |

    | --- | --- | --- |

    | 0 to 1,023 | Well-known | Permanently assigned to commonly used network services
    |

    | 1,024 to 49,151 | Registered | Assigned to specific services on request by their
    developers |

    | 49,152 to 65,535 | Dynamic, private, or ephemeral | Unregistered ports that
    can be used for private or temporary purposes, such as port numbers self-assigned
    by clients for a single network transaction |


    The Network+ exam calls for candidates to be familiar with the protocols in Table
    5.3, their basic functions, and the port numbers they use. Note, however, these
    are default port numbers that can sometimes be modified by administrators. Web
    servers, for example, use port 80 for HTTP traffic by default, but administrators
    often use alternative port numbers for security purposes.


    # EXAM TIP


    Network+ questions sometimes test the candidate''s familiarity with port number
    assignments by using them as part of IP addresses or uniform resource locators
    (URLs). The combination of an IP address and a port number is called a socket;
    it is noted by appending the port number to the address, separated by a colon,
    as follows: 192.168.45.96:80. To specify the URL for a web server that uses a
    non-default port, you append the port number in the same way, as follows: http://www.contoso.com:49853.'
  merge: -1
  img_proc: true
