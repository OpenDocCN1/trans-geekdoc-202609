- pgno: 158
  md: '# Practice Question 1 Explanation


    A. is correct because the Routing Information Protocol is a distance vector protocol
    that evaluates routes based on the number of hops between the source and the destination.
    Because the branch offices are connected using WAN links running at different
    speeds, hop counts are not a reliable means of evaluating the efficiency of the
    branch office routes.


    B. is incorrect because Open Shortest First (OSPF) is a link state routing protocol
    that does not rely on hop counts to evaluate routes.


    C. is correct because the Enhanced Interior Gateway Routing Protocol (EIGRP) is
    a hybrid routing protocol that relies on other factors in addition to hop counts
    to evaluate routes.


    D. is incorrect because Border Gateway Protocol (BGP) is a path vector routing
    protocol that does not rely solely on hop counts to evaluate routes.


