- pgno: 64
  md: '# Fiber-Optic Cables


    The primary alternative to copper-based cables for networking is fiber optic.
    Fiber-optic cables carry signals in the form of optical impulses generated by
    a laser or light-emitting diode (LED). A fiber-optic cable consists of a glass
    or plastic core that is the signal conductor, surrounded by layers of reflective
    cladding, buffering, and a protective shield.

    Compared to copper cables, fiber optic is much more efficient. It can span distances,
    up to 120 kilometers, and is completely resistant to EMI, crosstalk, and many
    other types of interference. However, fiber-optic cable is also more expensive
    than UTP and more difficult to install, and requires specialized tools to training
    and troubleshoot.


    There are many different types of fiber-optic cable, but they fall into two main
    categories, as follows:


    +   **Single-mode** Uses a light source to generate a single beam of light. Single-mode
    fiber can span distances to 120 kilometers and achieve higher speeds than multimode.


    +   **Multimodal** Uses an LED light source to generate multiple light impulses
    travel through the core and off the cladding to propagate the signal. Multimodal
    fiber is relatively inexpensive compared to single-mode, but it only spans distances
    up to one kilometer and at lower speeds.


    # CONNECTOR TYPES


    Network cables require connectors at both ends to plug into computers, patch panels,
    and other devices. Patch cables are available with connectors already attached,
    but for permanent cable installations, technicians pull cable to the required
    locations and attach the connectors to both ends.


    # Copper Cable Connectors


    The RG-59 and RG-6 coaxial cables used for television installations, cable modem
    connections, and other video applications use F-type connectors, which are screw-on
    connectors with the core protruding from the end. The IEEE 802.3 (Ethernet) standards
    and the+ exam objects no longer include coaxial-based Ethernet specifications,
    so the Bayonet--Concelman (BNC) and N-type connectors for RG-58 and RG-8 cables
    are no longer covered.


    Most twisted pair use registered (RJ) connectors, which are the standard snap-in
    modular connectors used by telephones and desktop computers. RJ11 is the six-pin
    modular jack in most phones, although standard telephone connections use only
    two of the pins.


    Internal LANs constructed with UTP and STP cables typically use the RJ45 connector
    to attach computers to wall plates and switches to patch panels. The RJ45 connector
    is slightly larger than the RJ11 and has eight pins to accommodate standard four-pair
    cabling. Both the RJ11 and RJ45 connectors have a latch to hold them in place
    in the socket.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Fiber-Optic Cable Connectors


    Unlike the connectors for copper cables, which are generally standardized, fiber-optic
    cables can use several different types of connectors, including the following:


    +   Straight TP (ST) A bayonet-type connector that locks into the socket with
    a half-twist


    +   Subscriber Connector (SC) A push-pull connector with a key to prevent twisting
    in the socket, and in some cases, a locking latch


    +   Local Connector (LC) A small form-factor connector similar to the SC but approximately
    half the size, with a key to lock the male securely in the socket


    +   Mechanical Transfer-Registered Jack (MT-RJ) A small form-factor connector
    with duplex cores that are similar in size to an RJ45 connector


    The ST and SC connectors are traditionally the most popular choices for fiber-optic
    cables, but the smaller factors, such as MT-RJ and LC, have become more common,
    because they conserve space on switches and patch panels.


    The interface between the fiber core in the cable and that in the socket is an
    important part of achieving a good-quality fiber-optic connection. Fiber-optic
    connectors are generally available in two interface formats, as:


    +   Ultra-Physical Contact (UPC) The fiber core is polished to a zero-degree (flat)
    surface. The join between the cores can cause some light to be reflected back
    along the cable, causing return loss. However, the join between the flat surfaces
    reduces the amount of insertion loss caused by attenuation.


    +   Angled Physical Contact (APC) The fiber core is polished to an eight-degree
    angle so that reflected light is diverted to the cabling to reduce return loss.
    However, the amount of insertion loss is greater than in a UPC connection. APC
    connectors are distinguished by a green boot or boot and must only be joined to
    other APC connectors; joining an APC to a UPC connector results in extremely high
    insertion loss.


    # Transceivers and Media Converters


    A transceiver is a device that transmits and receives signals. Network interface
    adapters (NICs) in computers generally have a built-in transceiver suitable for
    use with a given network medium, usually twisted pair. However, some devices,
    such as switches and routers, are equipped with small form-factor pluggable (SFP)
    slots that allow


    > EXAM TIP 8P8 is the actual name of the four-pair connector intended for data
    networking. However, the term RJ45—intended for telephone installations—is much
    more prevalent, over the Network+ exam.'
