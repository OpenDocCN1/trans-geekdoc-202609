    The columns in this routing table contain the following information:


    **Network Destination** Identifies a host or network address of a destination
    reachable by the router.


    **Netmask** Contains the subnet mask value for the network destination address
    that indicates the division between the network bits and the host bits.


    **Gateway** Identifies the router that will be the next hop for packets to go
    to the network address.


    **Interface** Specifies which of its network interfaces the router should use
    to reach the intended gateway.


    **Metric** Specifies the relative value of the route. When a routing table contains
    multiple routes to a specific destination, the router uses the gateway with the
    lowest metric value. The functions of the entries in the sample routing table
    are as follows:


    +   - The first entry in the routing table (0.0.0.0) is the *default route (also
    known as the *default gateway)*), which specifies the router that the system should
    use when it fails to find a packet''s destination address in its routing table.

    - The second entry (127.0.0.0) is the standard IP loopback network address, which
    sends traffic directly to the system''s input buffer without transmitting it over
    the network.

    - The third and fourth entries specify the networks to which Router A is directly
    connected: 192.168.2.0 and 192.168.14.0.

    - The fifth entry indicates that to send traffic to the 192.168.9.0 network, Router
    A must use its 192.168.2.100 interface to forward the traffic to Router B''s'
