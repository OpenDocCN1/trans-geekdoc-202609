  md: '# Hardening and Security Policies


    # Standard Operating Procedures


    In a well-organized IT operation, personnel perform tasks according to standard
    operating procedures (SOPs) that should be carefully documented and maintained.
    This makes it possible for anyone in the department to complete a particular task
    using consistent and approved company procedures.


    While SOPs might be conceived and created at various times by people in various
    departments and locations, the resulting documents be gathered into a single manual
    that can function as a centralized resource for the entire department.


    # HARDENING AND SECURITY POLICIES


    Network administrators must consider a great security issues when designing, implementing,
    and maintaining an enterprise network. The Network+ exam debates an entire objective
    to security issues, but this section concerns the policies that many organizations
    use to document their security procedures.


    Some of these policies are as:


    +   **Password Policy** Specifies the administrative requirements for user passwords,
    such as minimum length, complexity, reuse limitations, and frequency of change.
    Other less tangible policies might include restrictions on choosing appropriate
    passwords, sharing passwords, and writing passwords down obvious places. In addition
    to document of policies, many operating systems and applications can enforce them
    by requiring users to comply with established policies.


    +   **Acceptable Use Policy (AUP)** Specifies the approved and disapproved uses
    for the company''s network equipment and services, including hours of use, personal
    use restrictions, and forbidden practices. For example, the AUP might specify
    how the firm has the right to read and retain all email created using the company''s
    domain name and how users are not permitted to use the company email for illegal
    purposes. The creation of this policy will likely require input from the organization''s
    Legal and Human Resources departments.


    +   **Bring Your Own Device (BYOD) Policy** The increasing mobility of network
    users and the use of employees'' smartphones and other devices for business purposes
    has led to the establishment of policies regarding the types of devices that employees
    are permitted to use the company network, how they are permitted to use them,
    and the security settings they must configure. In some cases, users are required
    to register their devices with a mobile device management (MDM) product that ensures
    a secure configuration on their devices and provides a means for the company to
    recover or erase data from a lost or stolen phone.


    +   **Remote Access Policy** Specifies who is permitted to access company network
    resources from remote locations, using virtual private network (VPN) connections
    or other means, and what they are permitted to do with those resources. The policy'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'describe the security infrastructure for remote network access, as required
    authentication and authorization mechanisms.


    **Onboarding and Offboarding Policy** Specifies the procedures for adding new
    users and removing them from the company network, including discussion of the
    other required policies and revocation of access to all network services and company
    data immediately on separation from the firm.


    **Security Policy** Functions as an umbrella document that includes all of the
    other policies applicable to company employees, including the password, BYOD,
    and AUP policies.


    **Data Loss Prevention (DLP)** A mechanism, such as an email filter, that prevents
    confidential data from being sent outside the company, either accidentally or
    deliberately.


    # COMMON DOCUMENTATION


    Documentation is a critical part of any IT department''s operations. Keeping track
    of what has done and when they did it prevents unnecessary repetition of tasks,
    and documenting the layout of the network enables technicians to locate equipment
    easily. Documentation maintained by a typical enterprise IT department includes
    the following:


    +   **Physical Network Diagram** Indicates how network devices are physically
    connected to each other, but not necessarily their proximity, nor is the diagram
    drawn to scale.


    +   **Floor Plan** Depicts the physical layout and dimensions of the network site
    and the locations of the cables, wireless access points, and other network devices
    within each room. The diagram is typically drawn to scale and is often based on
    an overlay of the architectural blueprint for the facility. A floor plan also
    includes the locations of equipment and architectural barriers that might interfere
    with cable installations or wireless network transmissions.


    +   **Rack Diagram** Most data centers use vertical equipment racks to house servers,
    switches, routers, and other devices, as in Figure 14.1. Racks are typically 73.5
    inches high and numbered from bottom to top. Many rack-mounted devices are similar
    in appearance, and a rack diagram identifies the precise locations of the devices
    housed in a data center''s racks.


    +   **Intermediate Distribution Frame (IDF)/Main Distribution Frame (MDF) Documentation**
    The MDF is the location in the facility where the internal network and demarcation
    points for any external network services, such as WAN and telecommunications,
    meet. The MDF is often located in the company''s data center itself or in a separate
    room near the place where cables for outside services enter the building. In addition
    to equipment as patch panels and punchdown boxes, the MDF houses the backbone
    network switch, which provides connections to multiple IDFs scattered'
