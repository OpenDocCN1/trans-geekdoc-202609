  md: '# BANDWIDTH MANAGEMENT


    Routers are network layer (layer 3) devices. The layer primarily responsible for
    the end-to-end communication between source and destination systems, the network
    layer is the perfect place to implement other network technologies. One of these
    is bandwidth management, which refers to mechanisms for controlling the allocation
    of bandwidth to specific types of traffic.


    Networks carry different types of traffic with different transmission requirements.
    For example, file transfers must be bit-perfect, but they can tolerate a delay
    and some retransmitted packets. Web traffic can also tolerate delays and a few
    frames lost. Steaming audio and video can buffer their traffic and tolerate a
    few dropped frames caused by lost or corrupted packets. However, applications
    as Voice over IP (VoIP) and ISCI work in real time. Transmission delays and lost
    bits can result in calls being dropped or corrupted. By managing the bandwidth,
    administrators can see to it that the traffic is prioritized so that applications
    receive the bandwidth


    # Traffic Shaping


    Traffic shaping is a technique for delaying network traffic—usually in a buffer—to
    achieve an agreed-upon transmission rate. The technique can be applied to all
    traffic or to generate specified applications. For example, Internet service providers
    can use traffic shaping to limit the bandwidth used by peer-to-peer file applications,
    allowing other types of traffic to proceed without limits. In other cases, service
    providers can use traffic shaping to ensure that their clients receive the bandwidth
    specified in their service level agreements. Enterprise administrators also limit
    the bandwidth they receive from their owners, to avoid data rates that can incur
    additional charges.


    Traffic shaping tools—allow administrators to monitor the traffic on their networks,
    to determine who is using bandwidth, at what time, and for what purpose. With
    that information, administrators can decide what limits need to be imposed and
    create rules to implement them. Traffic shaping can work by regulating either
    the bandwidth used to transmit data or the time during which the transmission
    occurs. For example, to prevent a 1 Gbps interface from exceeding a transmission
    speed of 500 Mbps, a router can transmit at its normal speed for half the time
    and buffer the outgoing data for the other half.


    # Quality of Service (QoS)


    When a network becomes congested with traffic, there are two possible solutions:
    increase the bandwidth or use the existing bandwidth more. Quality of Service
    (QoS) is a means of doing the latter, by prioritizing network traffic so that
    applications can always have the bandwidth they require available to them. To
    use QoS, network administrators must evaluate the types of traffic carried by
    the network, create categories for them, and establish priorities among the categories.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# Bandwidth Management\n\nQoS works by embedding codes in packets' IP headers.\
    \ Routers that support QoS read the codes on incoming packets and act on each-packet\
    \ to the priorities assigned to its code. For example, high-priority traffic,\
    \ such as VoIP calls, would always be transmitted immediately, whereas packets\
    \ with lesser priorities might be buffered for a period of time before transmission\
    \ or discarded, depending on the network's congestion level.\n\nThe most commonly-used\
    \ mechanism for coding traffic at layer 3 is called Differentiated Services, or\
    \ DiffServ. Most of the shaping and conditioning tools mentioned earlier can also\
    \ function as traffic classifiers by using DiffServ codes to packets as they enter\
    \ the network. The Differentiated Services field in a standard Internet Protocol\
    \ (IP) header contains a 6-bit differentiated code point (DSCP) that identifies\
    \ the traffic category of the data in the packet. The DiffServ standards allow\
    \ the creation of categories to the administrators of the network.\n\n# EXAM TIP\n\
    \nQuality of Service (QoS) can be implemented by routers at the network layer\
    \ (layer 3) or by switches at the data link layer (layer 2). At layer 2, QoS works\
    \ by reading a 3-bit Class of Service (CoS) code in the 802.1Q frame. Exam candidates\
    \ should be aware that they might encounter QoS in discussions of switches as\
    \ well as routers.\n\n# CERTMIKE EXAM ESSENTIALS\n\n+    A router is a network\
