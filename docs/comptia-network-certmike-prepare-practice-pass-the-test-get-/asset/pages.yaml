  md: 'There is also a coaxial cable called twinaxial that uses the same basic construction
    except there are two copper conductors at the core of the cable instead of just
    one. Used primarily in data centers for short-range, high-speed links, twinaxial
    is less expensive to purchase and easier to install than fiber-optic cable.


    # Twisted Pair Cable


    The copper cable that is most prevalent in local area networking today is twisted
