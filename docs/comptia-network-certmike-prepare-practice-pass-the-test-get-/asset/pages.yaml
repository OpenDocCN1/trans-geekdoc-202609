- pgno: 187
  md: '# PERFORMANCE METRICS


    Users can frequently detect variations in the performance of a device or a network,
    but these are just subjective impressions, not objective studies. To track the
    performance of a device, you must quantify its performance by observing the changing
    values of certain hardware components and system processes. These values are called
    performance metrics.


    There are many different tools for measuring performance metrics, some of which
    software built into the device''s operating system, whereas others are third-party
    software or hardware products. This section describes some of the most important
    performance metrics for network devices and for the network itself.


    # Device Metrics


    Individual network devices have all performance metrics, but they differ in how
    they can measure and in the importance of each metric to the overall performance
    of the device. For example, servers, like all computers, have many components
    that administrators monitor on a regular basis. Servers are among the most important
    devices to monitor many users depend on them. However, workstations monitoring
    as well as other network devices, like switches and routers.


    Some of the critical performance metrics are described next.


    # Temperature


    Most electronic devices generate heat and have some means of dissipating it. Excessive
    heat can shorten the life of a device, cause it to shut down, or in extreme cases
    damage the components.


    Chief among the computer components that generate heat is the central processing
    unit (CPU). Fans and vent air circulation to dissipate heat, and there are typically
    sensors in the computer that monitor the temperature and can take action by shutting
    down the system if it gets too hot. In addition, tools such as the Network Management
    Protocol (SNMP) can access the data generated by the temperature, enabling administrators
    to monitor the system and detect a potential problem before it occurs.


    Computers are not the only devices that can overheat. Switches and routers have
    CPUs and other heat-generating components as well. Monitoring temperatures throughout
    the data center is an important part of keeping the network running smoothly.


    # CPU Usage


    The central processing unit (CPU) utilization metric for a computer or other network
    device indicates how hard the device is working. The more applications and services
    running on a server, for example, the higher its CPU utilization figures will
    be. CPU utilization is typically expressed as a percentage of the processor''s
    maximum capacity. The higher the metric value, the more the processor is generating.


    On a large network with many servers, it is a good idea for administrators to
    monitor the CPU utilization metric on all of them and try to keep them balanced.
    If the CPU utilization'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'on one specific server frequently runs high, though, administrators might consider
    taking action in one of two ways:


    +   - Add more processing power to the server with more or better CPUs.

    - Migrate applications or services to other servers.


    Switches and routers have CPUs also, and high utilization values can be one indicator
    of high traffic levels, with network metrics such as latency.


    # Memory


    Memory utilization can be another indicator that a device is working too hard
    and might be suffering a reduction in performance. Computers and other network
    devices might have several types of memory, but *random access memory (RAM)* is
    the one that is dependent on the applications the device is running. Some operating
    systems, when they start to run on RAM, begin swapping of the memory contents
    to disk. Since disk storage access times are far slower than RAM access times
    (milliseconds versus nanoseconds), swapping memory can cause RAM utilization values
    that are typically accompanied by increased values of CPU and storage metrics.
    When this problem occurs, administrators can address it in one of two ways:


    +   - Add the system''s application load

    - Add more RAM to the system


    # Network Metrics


    In addition to monitoring the metrics for the components of individual devices,
    it is important to monitor the performance of the network itself.


    # Bandwidth


    The most essential network performance metric to monitor is its *bandwidth*. There
    are two bandwidth metrics to consider:


    **Available Bandwidth** The amount of bandwidth that the network is capable of
    providing


    **Bandwidth Utilization** The amount of bandwidth that is actually utilized at
    a given time, also known as the network''s *throughput*.


    The available bandwidth, essentially the speed of a network connection, is usually
    measured in megabits or gigabits per second (Mbps or Gbps). This is the transmission
    speed that the hardware—cables, switches, routers, and network adapters—is designed
    to provide.


    Depending on the tool used, the bandwidth utilization metric can be noted as a
    percentage of the available bandwidth or as raw Mbps or Gbps figure. Bandwidth
    utilization values can differ depending on where the measurement is taken, the
    time of day it is taken, and how the network is being used at the time.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'When bandwidth utilization values are high, it can indicate a temporary traffic
    condition, but when they are consistently high, the connection might be overloaded
    with traffic. When this occurs, administrators can take any of the following actions:


    +   * Increase the available bandwidth by upgrading the network hardware.

    * Move servers or other devices to a less-trafficked network segment.

    * Move applications or services that generate large amounts of traffic to servers
    on another network segment.


    # EXAM TIP


    The abbreviations Mb and Gb, with a lowercase b, stand for megabytes and gigabytes,
    which are typically used to measure network speeds. MB and GB, with a capital
    B, stand for megabytes and gigabytes, which are used to measure storage transfer
    rates. Network+ exam candidates should be aware of the differences in the abbreviations
    and how they are used.


    # Latency


    Latency is the delay that is incurred between the transmission of a packet and
    its receipt at the destination. Typically measured in milliseconds, latency and
    its value as a metric depending on the location of the destination being measured.
    There are many reasons packets can be delayed, including excessive traffic on
    the network, an overloaded switch, a malfunctioning network adapter, or any number
    of other causes.


    The effect of latency is different depending on the type of traffic on the network.
    A brief delay in accessing a file from a server is not a big problem, but for
    real-time protocols such as VoIP or iSCSI, even a slight amount of additional
    latency can affect the quality of a voice call or data transfer.


    # Jitter


    The latency of a network is usually a relatively stable condition. Metric values
    can vary over time, but they tend to remain consistent from second to second.
    If they don''t, and there are different latency measurements for successive packets
    transmitted to the same destination, this is called jitter.


    The value of the jitter metric is a calculation of the difference between latency
    values for successive packets, usually expressed in milliseconds.

    Networks can tolerate latency far better than they can tolerate jitter. In particular,
    jitter can interfere with real-time data transmissions such as those for VoIP.


    # SNMP


    There are many tools that can monitor performance metrics. Operating systems typically
    have some means of gathering metric values, such as the Windows Performance Monitor,'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'for example, but one of the oldest and most comprehensive network-based tools
    of this kind is the Simple Monitoring Protocol (SNMP). SNMP is a centralized monitoring
    tool that can gather information from devices all over the network—including servers,
    workstations, switches, routers, and printers—and display it to administrators
    of the central management console.


    SNMP consists of three basic components, as follows:


    +   **SNMP Agents** Software components that run on a managed device and gather
    data they send to the MMS (next item). Some agents are built into devices such
    as switches and routers, whereas others have to be installed by users.


    +   **Network Management System (NMS)** The NMS is the central console that receives
    all the information from the SNMP agents.


    +   **Information Management Base (MIB)** An MIB is a database of components on
    a managed device called identifiers (OIDs), which are capable of supplying performance
    metrics and other information to the NMS. The OIDs store information about the
    components as variables. The NMS can modify variables within the OIDs to remotely
    reconfigure the device.


    +   SNMP agents communicate with the NMS using message types, including GetRequest
    messages that an NMS sends to an agent, requesting the values of specific OID
    variables; SetRequest messages that supply revised values for specific OID variables;
    traps, unsolicited messages sent by an agent to the NMS containing information
    about an important event.


    # # NETWORK DEVICE LOGS


    Most network devices generate logs of their activity, and in some cases many different
    types of logs. Monitoring logs is an important part of maintaining a network.
    Some of the log types are described in this section.


    # ## Traffic Logs


    Many devices can monitor traffic of their experiences, and in some cases, administrators
    can specify exactly what traffic should be logged. For example, a firewall can
    handle a great deal of traffic, and the vast majority of log entries will be for
    traffic that is successfully admitted through the firewall. However, it is also
    possible, in the case of firewalls, to adjust the logging levels to retain only
    the exceptions—that is, the packets that are blocked by the firewall because they
    do not conform to its rules.


    # ## Audit Logs


    Auditing is a feature provided in many operating systems and network devices that
    allows administrators to specify what information should be captured by the device''s
    audit logs. Auditing generally provides administrators with more granularity in
    what components'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'to monitor and what activities to. For example, an administrator can opt to
    audit user logins to a server. Selecting all of the logins will produce a log
    of log entries, including successful logins. Administrators might have reason
    to monitor all of the logins, and it is also possible to select just the failed
    logins to let administrators know when someone attempts a brute-force password
    attack.


    Auditing can also be centralized on the network. One way to do this is to use
    an authentication, authorization, and accounting (AAA) server such as Remote Authentication
    Dial-In Service (RADIUS).


    # Syslog


    One of the problems with monitoring logs is that devices typically store their
    logs locally, and the prospect of examining the logs on every network device individually
    can be daunting to administrators. *Syslog* is a mechanism for sending log entries
    from a network device to a central server, where they are added to a single log
    covering all of the devices in one.


    Syslog consists of the following elements:


    +   - A syslog server

    - Client applications on the individual network devices

    - A syslog message format


    Syslog messages, in addition to the actual log information generated by the device,
    include a timestamp to indicate when the event occurred. Though not required by
    the standard, many network devices include a Facility code that indicates the
    type of message and a Severity code that indicates the nature of the event stimulating
    the log entry. The *Severity level* used in syslog messages are shown in Table
    13.1.


    # TABLE 13.1 Syslog severity values


    | Code | Severity | Keyword | Description |

    |---|---|---|--|

    | 0 | Emergency | emer | System is unusable |

    | 1 | Alert | alert | Action must be taken immediately |

    | 2 | Critical | crit | Critical conditions |

    | 3 | Error | err | Error conditions |

    | 4 | Warning | warning | Warning conditions |

    | 5 | Notice | notice | Normal but significant condition |

    | 6 | Informational | info | Informational messages |

    | 7 | Debug | debug | Debug-level messages |'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Log Reviews


    Log reviews are an important part of monitoring network and device performance.
    How-ever, the biggest problem with reviewing logs is the sheer amount of data
    they often contain. For example, the logs maintained by a web server typically
    have entries for every user that connects to it. A busy website might handle thousands
    or millions of hits each day, resulting in massive logs that administrators cannot
    easily read and interpret manually. Instead, use tools that read and interpret
    the log files for them, so they can concentrate on the most important data.


    # INTERFACE ERRORS OR ALERTS


    Operating systems maintain statistics for every network interface adapter, speci-f
    elements such as how many bytes and packets it has transmitted and received. The
    means of accessing this information differs depending on the device, but in many
    cases, there are Get-NetAdapterStatistics cmdlet in Windows PowerShell or the
    ifstat command in Linux.


    NetFlow is a proprietary tool that administrators use to gather statistical data
    about the IP traffic that routers and switches receive and send through each of
    their ports. Routers and switches periodically send the NetFlow data they gather
    to a central server. That server, called a NetFlow collector, collates the data
    from all the devices into a single timestamped bottleneck and other problems.


    Some of the most important statistics are as follows:


    +   **Link State (Up/Down)** Specifies whether the interface is physically connected
    to the network. A down state could be the result of an issue with the interface
    itself, a config-ration setting on the device, a hardware problem with the network,
    or a problem with the device at the end of the connection.


    +   **Speed/Duplex** Specifies the interface''s available bandwidth and whether
    it is function-ing in full-duplex or half-duplex mode. Mismatched duplex settings
    at end of a connection prevents the device from accessing the network.


    +   **Send/Receive Traffic** Specifies the number of packets and/or bytes that
    the interface has transmitted and received, as shown in the following example
    from the Get-NetAdapterStatistics output:


    ```

    SentBroadcastBytes : 2183533

    SentBroadcastPackets : 43528

    SentBytes : 9726451193

    SentMulticastBytes : 21784625

    SentMulticastPackets : 91880

    SentUnicastBytes : 9702483035

    SentUnicastPackets : 37057942

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Cyclic Redundancy Checks (CRCs) Specifies the number of packets that have failed
    the interface''s data link layer checksum test.


    **Protocol Packet and Byte Counts** Break by protocols the number of bytes and/or
    packets that the interface has transmitted and received.


    Interlaces can also track the number of packet errors that occur, generating statistics
    the following:


    **CRC Errors** Indicate that packets are arriving through the interface in a damaged
    state. Regularly increasing values indicate a problem with the device''s interface,
    the network medium, or the device at the other end of the connection.


    **Giants** Frames received by the interface that are larger than the network''s
    maximum transmission unit (MTU) size, which on Ethernet networks is 1500.


    **Runts** Frames received by the interface that are smaller than 64 bytes. Giants
    and runts can be the result of collisions on a half-duplex network or a malfunctioning
    network-adapter.


    **Encapsulation Errors** Indicate that the data layer encapsulation process is
    not occurring properly. One common cause is plugging a host into a switch port
    that has been configured as a trunk port. The switch is expecting 802.1X frame
    headers but is receiving 802.3 headers.


    # ENVIRONMENTAL SENSORS


    As noted earlier, high temperatures are bad for computers and other electronics.
    Network devices can overheat because of internal problems, certainly but one of
    the other possible causes of overheating is external: the temperature and other
    environmental factors in the room where the devices are located.


    Large networks typically have their sensitive equipment located in a data center,
    and most data centers have environmental systems that maintain appropriate temperature
    and humidity levels. Data centers are also equipped with sensory equipment that
    only monitors the climatic conditions, but also detects smoke, fire, flood, and
    other environmental disasters. Sensors can monitor the data center''s electrical
    power supply, checking for surges, sags, and other fluctuations. Any of these
    conditions, when their levels fall outside of a safe range, can negatively affect
    the performance of the network and even damage the hardware.


    # BASELINES


    All of the metrics that indicate the performance level of a network fluctuate
    over time. Most of the actual metric values are meaningful only in relation to
    their previous values.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Uptime/Downtime


    A specified number of collisions or CRC errors, for example, are only cause for
    alarm if the values increase over time.


    To maintain records of a network''s performance, administrators typically take
    baseline readings of metrics under normal operational conditions, taken with the
    same tools that administrators will use to monitor the levels in the future. One
    common practice is to take readings during a normal business day and off hours,
    when the business is not operating. This provides a comparison indicating certain
    metrics increase when the network is actively in use. With the baselines in place,
    administrators can continue to monitor the network''s metrics, and comparing with
    the baseline, determine if the network''s performance levels are changing over
    time.


    # UPTIME/DOWNTIME


    A network''s uptime/downtime figure indicates the amount of time that a particular
    network service is online and accepting requests from clients. The statistic is
    usually expressed as a percentage of particular time. Uptime/downtime figures
    are frequently specified in the contracts that clients sign with service providers.
    For example, the provider and the client might agree that the service must be
    available to the client 99.99 percent of the time, collectively called a "four
    nines" contract, or a penalty applies. Both parties to an agreement like this
    should monitor the uptime/downtime of the service independently. SNMP is capable
    of doing this, as are any other tools.


    # CERTMIAKE EX ESSENTIALS


    +   Performance metrics are statistics that enable administrators to objectively
    monitor the ongoing operations of networked devices and of the network itself.
    Metrics for computers include CPU usage and memory consumption, whereas network
    metrics include the available bandwidth and bandwidth utilization.


    +   Logs are an excellent resource that administrators should monitor regularly.
    Auditing enables administrators to select the precise information to gather about
    a particular resource. Many tools are available for filtering and interpreting
    log files.


    +   Network interfaces maintain statistics about their configuration settings
    and the amounts of traffic they send and receive. Operating systems typically
    have some means of displaying this information, often a command-line utility.'
  merge: -1
  img_proc: true
