- pgno: 293
  md: '# Practice Question 1 Explanation


    A. is incorrect although Alice checks the obvious by having the user confirm that
    the network cable is plugged in, that technique does not account for the other
    elements in her troubleshooting.


    B. is incorrect the divide and conquer approach would not begin at the top of
    the OSI model and work its way down.


    C. is correct because Alice begins at the top of the OSI model (the application
    layer) by checking the system''s email capabilities and ends at the bottom by
    checking the computer''s physical layer connection to the network.


    D. is incorrect because Alice''s process begins by checking the system''s email
    capability, which is an application layer function at the top of the OSI model,
    not the bottom.


    Correct Answer: C


    # Practice Question 2 Explanation


    A. is correct because the test confirms Ralph''s theory of probable cause, the
    next step would be to devise a plan of action to address the cause and resolve
    the problem.


    B. is incorrect because while replacing components by guesswork could conceivably
    resolve the problem, it would more likely be a waste of time and hardware.


    C. is correct because the test indicates that Ralph''s first theory of probable
    cause is disapproved, the next logical step is to devise another theory.


    D. is incorrect because obvious solutions should have already been considered
    during the creation of the first theory.


    Correct Answers: A and C'
