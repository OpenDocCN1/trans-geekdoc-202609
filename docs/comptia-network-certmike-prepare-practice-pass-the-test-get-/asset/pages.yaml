  md: '# Service Models


    administration tasks—everything above the Hypervisor layer—is left to the consumer.
    The cloud provider is responsible for the physical server, the operating system
    running the hypervisor, and the physical network that connects it to the world,
    but the VMs and the software running on it are the sole responsibility of the
    consumer.


    # Platform as a Service (PaaS)


    A third-party cloud provider supplies the consumer with access to a physical server
    running a hypervisor and responsibility for the virtual machines running on that
    hypervisor. In PaaS, the responsibility of the provider is extended up the Runtime
    layer, meaning that provider must update and maintain the operating systems on
    the VMs. The consumer is only responsible for the applications they install on
    the VMs, for their own data, and for the users who run the applications. PaaS
    was originally designed as a tool for Internet-based application development that
    allowed people to run their code on a consistent platform without having to create
    new VMs and restart the OSs for each test.


    # Software as a Service (SaaS)


    A third-party cloud provider supplies the consumer with Internet-based application
    or service running on their servers. In an SaaS environment, the provider’s responsibility
    extends up through the application layer. The consumer supplies only the data
    they use and the users who will run the application. The consumer sees only the
    application and a limited set of configuration settings; they have no way of knowing
    about the server running the application, the VM hosting the server, or the hypervisor
    providing the VM.


    # Desktop as a Service (DaaS)


    Not a NIST designation but included in the Network+ exam objectives, DaaS is a
    new designation for a technology that has been known as desktop virtualization,
    remote desktop, and terminal services. A third-party cloud provider supplies the
    consumer with a fully configured desktop workstation running on a VM, which users
    can access from any location using a thin client, such as a web browser. The client
    and the VM only exchange interface information, such as keystrokes, mouse movements,
    and display video; every operating system and application processing occurs in
    the cloud.


    > EXAM TIP

    Today’s IT world, appending the phrase “as a Service to almost any word increases
    its marketing value. As a result, Network+ exam candidates might run across many
    other -aaS abbreviations, but they should be aware that the only official NIST
    designations are IaaS, PaaS, and SaaS.


    # Infrastructure as Code


    Infrastructure as Code (IaC) is a technique for automating the process of building
    a platform for the development and testing of code. In a large software development
    environment, there might be many people working on the code for one application,
    all of whom have'
