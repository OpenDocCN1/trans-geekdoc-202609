- pgno: 10
  md: '# # ABOUT THE AUTHORS


    **Mike Chapple, PhD**, is the author of the best-selling CISSP (ISC)² Certified
    Information Systems Security Professional Official Study Guide (Sybex, 2021) and
    the CISSP (ISC)² Official Practice Tests (Sybex, 2021). He is an information technology
    professional with two decades of experience in higher education, the private sector,
    and government.


    Mike serves as Teaching Professor in the IT, Analytics, and Operations department
    at the University of Notre Dame’s Mendoza College of Business, where he teaches
    undergraduate and graduate courses on cybersecurity, cloud computing, data management,
    and business analytics.


    Before returning to Notre Dame, Mike served as executive vice president and chief
    information officer of the Brand Institute, a Miami-based marketing consultancy.
    Mike also spent four years in the information security research group at the National
    Security Agency and served as an active duty intelligence officer in the U.S.
    Air Force.

    Mike has written more than 25 books. He has earned his B.S. and Ph.D. degrees
    from Notre Dame in computer science and engineering. Mike also holds an MBA from
    Auburn University. Mike holds the IT Fundamentals. (ITF+), Cybersecurity Analyst
    (GYSA+), Data+, Security+, Certified Information Security Manager (CISM), Certified
    Cloud Security Professional (CCSP), and Certified Information Systems Security
    Professional (CISSP) certifications.

    Learn more about Mike and his other security certification materials at his website,
    CertMike.com.


    **Craig Zacker** is the author or co-author of dozens of books, manuals, articles,
    and websites on computer and networking topics. He has also been an English professor,
    a technical and copy editor, a network administrator, a webmaster, a corporate
    trainer, a technical support engineer, a minicomputer operator, a literature and
    philosophy student, a library clerk, a photographic darkroom technician, a shipping
    clerk, and a newspaper boy.'
