  md: '# CHAPTER 15


    # High Availability and Disaster Recovery


    Objective 3.3: Explain high availability and disaster recovery concepts and summarize
    which is the best solution.


    This chapter examines some of the high availability and disaster recovery concepts
    implemented on a typical enterprise network. The Network+ exam expects candidates
    to be familiar with these basic networking concepts.

    In this chapter, you''ll learn everything you need to know about Network+ Objective
    3.3, including the following topics:


    +   * Load balancing

    * Multipathing

    * Network interface card (NIC) teaming

    * Redundant hardware/clusters

    * Facilities and infrastructure support

    * Redundancy and high availability (HA) concepts

    * Network device backup/restore'
