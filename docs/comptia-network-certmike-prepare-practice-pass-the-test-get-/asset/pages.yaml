    # DEPLOYMENT MODELS


    The use of word cloud in the context of computing has become common at all levels
    of IT expertise, but not as many people can define the term. The cloud refers
    to any number of Internet-based services and solutions that are available on demand
    and typically purchased by lease or subscription. For end users, the cloud is
    typically a place'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Chapter 8 · Cloud Computing


    where they can store their files and personal data. However, for IT professionals,
    the cloud can provide a huge variety of services in addition to storage, including
    virtualized implementations of the servers for which they would at one time have
    had to purchase a new computer. Organizations can now replace entire data centers
    and software libraries with cloud services.


    One of the greatest advantages of the cloud in enterprise networking is its flexibility.
    Some companies start from nothing and build their network in the cloud. However,
    many organizations have already made large investments in data centers and physical
    computing hardware. Their expansion into the cloud is likely to be more modest,
    and they will be concerned about combining the new cloud services with their existing
    operations.


    For this reason, there are several different cloud deployment models or architectures
    that can adopt, which are described in the following sections.


    # Public


    A public cloud is a service or services provided by a third-party cloud provider
    that are available as a product to any qualified customer, called a cloud consumer.
    The facilities where the services are owned by the third-party provider, with
    access to the services to subscribers or through the Internet.


    As renting a house instead of buying it, public clouds require little to no initial
    outlay, but they also provide no equity. Public cloud services are highly flexible;
    consumers can expand their services to accommodate busy periods or company growth
    and scale them as needed. The consumers pay only for the resources they are actually
    using. Another benefit is that large cloud providers often furnish additional
    fault tolerance and security features, such as redundant hardware, data backups,
    and colocated data centers.


    # Private


    A private cloud is one in which the hardware and services are reserved for the
    consumer''s exclusive use. The hardware and the facility where it is located can
    be owned and managed by the consumer or by a third party, and it can be located
    on the consumer''s premises or elsewhere.


    Technically, any private network that is purchased and operated by a private organization
    is, by definition, a private cloud. However, in most cases the term refers to
    the involvement of a third party in space. For example, a company can purchase
    its own servers and other data center hardware and engage a third-party provider
    to house them and provide power, environment, security, and other services. This
    is sometimes called a hosted private cloud.


    Despite its substantial initial outlay for hardware, its ongoing depreciation
    in value, and the additional costs for personnel and upkeep, a private cloud can
    be beneficial for several reasons, including security and administrative control.
    A private cloud is also completely customizable to the consumer''s needs and might
    provide features and services that are not available through public cloud offerings.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Community


    A community cloud is one in which several organizations, usually engaged in the
    same business or concern with common needs, share a cloud infrastructure that
    can be owned and operated by members of the community or by a third-party provider.
    Typical examples of community clouds are ones operated by educational or health-care
    communities.


    # Hybrid


    A hybrid cloud is a combination of public, private, or community cloud resources
    that are connected by technology that enables them to interact and function together.
    For example, an organization with an internal data center functioning as a private
    cloud might use public resources to temporarily add servers or expand the network''s
    capabilities in ways during busy times. The process of adding cloud resources
    to enhance an existing network infrastructure is called cloudbursting.


    # SERVICE MODELS


    Cloud providers can typically provide products using a variety of service models,
    which specify how the administration tasks are split between the consumer and
    the provider. The cloud infrastructure can be split into eleven layers, as shown
    in Table 8.1.


    **TABLE 8.1** Cloud infrastructure layers


    | Layer | Function |

    |---|---|

    | People | The end users running applications |

    | Data | The information created or utilized by applications |

    | Application | A software program running on a virtual machine |

    | Runtime | An intermediate software layer, such as .NET or Java |

    | Middleware | Software that provides intermediate services between an operating
    system and applications |

    | Operating System | Software providing the basic functions of a virtual machine
    |

    | Virtual Network | The logical connections between virtual machines |'
