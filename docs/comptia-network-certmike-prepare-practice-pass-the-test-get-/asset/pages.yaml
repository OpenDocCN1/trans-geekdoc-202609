  md: '106  Chapter 9 • Network Devices


    # Hubs


    A hub—also known as a multiport repeater—is a cabling nexus—that is, a network
    connectivity device that takes the form of a box with a row of ports, typically
    for unshielded twisted pair (UTP) cables. Plugging computers and other devices
    into the ports connects them together, forming a local area network (LAN) with
    a shared network medium.


    A hub is a physical layer device that forwards all signals entering through any
    one of its ports out through all the other hubs. Hubs do not recognize or process
    data in any way; they simply relay electrical signals.

    The first Ethernet specification to use UTP cable—called 10BaseT—required the
    use of a hub to create a shared network medium. As the Ethernet specifications
    evolved, so did the capabilities of hubs. However, once switches began to appear
    at comparable prices, hubs quickly became obsolete and are rarely used today.


    # Repeaters


    A repeater is a device that extends the range of a network medium by amplifying
    signals as they pass through it. By adding a repeater, the network can mitigate
    the effects of signal attenuation, the gradual reduction of a signal''s amplitude
    as it passes through a network medium.


    In computer networking, the term repeater was originally used to refer to devices
    that extend the range of cable connections. The hubs used in early UTP data networks
    were multiport repeaters. Long-distance fiber-optic connections also use repeaters
    to boost their signals. Today, the term is more often used to refer to wireless
    repeaters, which extend the range of Wi-Fi signals.


    # Media Converters


    A media converter is essentially a repeater that connects two different network
    media. The device appears as a simple box with two types of cable connector in.
    Internally, the media converter receives signals from one connector, translates
    the signals from one media type to another, and then retrans them out through
    the other connector.


    For example, in an Ethernet network, a media converter can connect a UTP cable
    segment to a fiber-optic segment. This can extend the range of a network connection
    because fiber-optic cables exceed the 100 meter limit of nearly all UTP segments.
    The conversion to fiber-optic cable can also provide immunity to electromagnetic
    and other types of interference. There have been a variety of media converters
    used in data networking, for connections between UTP and fiber optic, between
    single-mode and multimode fiber optic, and between coaxial and fiber optic.


    # Switches


    A switch is a network connectivity device that operates at the physical and data
    link layers (layers 1 and 2) of the OSI reference model. A switch is essentially
    an intelligent hub that reads the data link layer header of incoming packets and
    keeps track of the MAC addresses assigned to each connected device. Data entering
    through any one of the switch''s ports'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Networking Devices 107


    gets forwarded, in a hub, but only through the port providing access to the intended
    recipient. This means that, unlike a hub, a switch does not create a shared network
    medium; each connected device has its own collision domain, essentially a dedicated
    duplex connection to every other device. This reduces the amount of extraneous
    traffic on the network, eliminates the packet collisions that are a normal occurrence
    on a hub-based Ethernet network, and enables the connected devices to transmit
    and receive data simultaneously.


    Switches are the essential building blocks of today''s local area networks. At
    the low end, a switch looks very much like a hub—that is, a box with many of ports
    in it. Small, unmanned switches are typically used for residential and small business
    networks. Many of the multifunction routers used for residential installations
    have switched ports for cable device connections.


    At the high end, enterprise datacenters typically have rack-mounted switches dozens
    of ports. These switches often have additional features built into them, including
    support for virtual LANs (VLANs) and management capabilities that allow administrators
    to configure and monitor them remotely.


    The basic functions of a switch are performed at layer 2 of the OSI model. Data
    link protocols always include a header containing the MAC addresses of each packet''s
    source and destination. By reading this information, the switch builds a table
    containing the MAC address of each device and the number of the switch port to
    which the device is connected. This allows the switch to know which port to use
    to forward packets to a specific device. By connecting multiple switches together,
    each network device can communicate with every other device.


    In addition to their layer 2 functionality, switches have routing capabilities.
    These are called layer 3 switches or multilayer switches because, in addition
    to normal switching function, they can operate at the network layer by routing
    data packets to other subnets. Multilayer switches typically have the same capabilities
    as a stand-alone router; they maintain routing tables based on IP addresses and
    the same routing protocols.


    # Bridges


    A bridge is a data link connectivity device that predates switches but that performs
    essentially the same function, on two ports instead of many. A bridge connects
    similar network segments, and keeps the traffic on the two segments separated
    as much as possible. By reading the MAC addresses from incoming packets—just like
    a switch—for example, when a device on one side of the bridge transmits to a device
    on the other side, the bridge forwards the packets to the other segment. However,
    if a device transmits to the same segment, the bridge does not forward the packets,
    reducing unnecessary traffic.


    Switching has made physical bridges unnecessary on mostabled networks, but the
    bridging concept is frequently used to control traffic between wireless and wired
    networks. For example, in the case of the multifunction home router that has both
    Wi-Fi capability and ports for Ethernet cables, the device''s multiple functions
    is to function as a wireless bridge between the two types of connections.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Routers


    A router is a network layer (layer 3) device that connects two network segments
    together, forming an internetwork. The public Internet is the ultimate example
    of an internetwork, with thousands of segments connected by routers. Unlike switches,
    which work with MAC addresses at the data link layer, routers identify systems
    by their network IP addresses.


    Every router maintains a routing table, which contains information about other
    networks. As incoming data packets arrive, the router reads each packet''s destination
    address in its IP header and uses the information in the routing table to forward
    the packet toward its destination.


    As switches, routers can range from small, inexpensive devices used in homes and
    small businesses to elaborate devices found in data centers. High-end routers
    incorporate a variety of additional functions, including management capabilities,
    network address translation, and firewalls.


    > EXAM TIP

    Router are known by many different names, depending on the context in which they
    are used. In TCP/IP parlance, a router is called a gateway. When routing is incorporated
    into a switch, it is called a layer 3 switch or a multilayer switch.


    # Access Points


    An access point (AP)—sometimes referred to as a wireless access point (WAP)—is
    a layer 2 connectivity device that enables wireless clients to join a wireless
    LAN (WLAN) in infrastructure mode. In its most basic form, it is an access point
    only; its function is a switch that connects the wireless devices and enables
    them to communicate with each other. In an enterprise environment, there might
    be access points scattered across the facility to provide widely dispersed users
    access to the wireless network.


    In many cases, access points have other capabilities as well. Access points intended
    for residential or small business use are typically function as a DHCP server,
    a firewall, and a router to an Internet service provider''s (ISP''s) network,
    as well as a bridge to wired network devices.


    # Wireless LAN Controllers


    Large enterprises with many wireless clients have dozens of access points, and
    configuring and managing them individually can become a time-consuming chore for
    IT personnel. A wireless LAN controller is a device that functions as a central
    connection point for all of the access points. Instead of configuring the APs
    individually, administrators can create the network configuration once, on the
    wireless LAN controller, and the controller pushes it out to all of the individual
    access points using a specialized protocol, such as Control and Provisioning of
    Wireless Access Points (CAPWAP).'
  merge: -1
  img_proc: true
