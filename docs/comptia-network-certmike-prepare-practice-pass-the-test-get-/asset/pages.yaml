  md: '# Routing 123


    > EXAM TIP

    There are many other routing protocols, but RIP, OSPF, EIGRP, and BGP are the
    only names in the Network+ exam objectives. Candidates for the exam should be
    aware of these four protocols, their types, and in what situations they are used.


    # Administrative Distance


    Administrative distances (ADs) are set values that routers use to evaluate the
    trustworthiness of paths to the network to a given destination, based on the source
    of each path. AD values range from 0 to 255. When selecting a route to a destination,
    a router always chooses the path with the lowest AD. Directly connected networks
    have an AD value of 0, and static routes have a value of 1, these are always the
    routes chosen first. Table 10.2 lists the AD values for the most commonly used
    routing protocols. primary function of administrative distance values is to allow
    routers to compare routes generated by different routing protocols. Routers use
    AD values to evaluate routes first. It is only when the AD for two routes are
    the same that the router uses their metrics to evaluate.


    # TABLE 10.2 Administrative distance values for route sources


    | Route source | Default AD |

    | Connected network interface | 0 |

    | Static route | 1 |

    | External BGP | 20 |

    | Internal EIGRP | 90 |

    | OSPF | 110 |

    | RIP | 120 |

    | External EIGRP | 170 |

    | Internal BGP | 200 |

    | Route never used | 255 |'
  merge: -1
