- pgno: 272
  md: '# CHAPTER 20


    # Physical Security


    # Objective 4.5: Explain the importance of physical security.


    **When** the issue of IT security hazards comes up, many network administrators
    think first of Internet-based cyberattacks and software vulnerabilities. They
    might forget that an intruder can also walk through the front door and attack
    the network in person. Physical security is no less important than cybersecurity
    to an enterprise''s overall security posture. This chapter examines some of the
    physical security mechanisms administrators frequently implement on a typical
    enterprise network. The Network+ exam expects candidates to be familiar with these
    basic concepts.


    In this chapter, you''ll learn everything you need to know Network+ Objective
    4.5, including the following topics:


    +   * Detection methods

    * Prevention methods

    * Asset disposal


    # DETECTION METHODS


    The two main areas of physical security are the detection methods that allow administrators
    to monitor vulnerable network equipment and the prevention methods that block
    unauthorized access to that equipment. Detection devices tell administrators when
    and how an intrusion has occurred and can sometimes provide evidence of the intruder''s
    identity. Some of the detection methods used to provide a network with physical
    protection are described in this section.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Camera


    Video surveillance captures the most information of any the standard detection
    methods, allowing network administrators to see events as they happen and record
    them for archiving. Unlike many detection methods that rely solely on numerical
    data, such as access auditing, cameras allow administrators to see that something
    was not just done, but who did it.


    Early video surveillance systems used closed circuit television (CCTV) cameras
    connected to a central recorder using coaxial cables. These were dedicated systems,
    separate from any other network. Today, video surveillance cameras typically connect
    to networks using Ethernet cables or Wi-Fi and save their information as digital
    video. This arrangement is not only less expensive than CCTV, since it can use
    existing equipment, but it can also take advantage of the network''s own infrastructure.
    For, Power over Ethernet (PoE) can provide the cameras with electricity over the
    network cable, and administrators can place the cameras'' switchports into their
    own VLAN, keeping their traffic separate from the rest of the network.


    # Motion Detection


    Motion detection equipment is described as any device capable of sensing the passage
    of a human through a specific area. The motion detectors that most people use
    are small boxes affixed to the wall containing passive infrared (PIR) sensors.
    Humans generate heat, and heat shows up on infrared, these devices can sense changes
    in the infrared pattern of a room and generate a signal that triggers an alert
    or an alarm. There are also devices intended for larger areas that use microwaves
    instead of infrared


    In addition to infrared and microwave sensors, there are many other types of devices
    that can be considered motion detectors, including pressure pads under carpeting
    that detects footsteps, electric eye beams that signal an alarm when interrupted,
    and sound sensors that react to excessive noise. Unlike cameras, motion detectors
    can tell when someone enters a protected area, but they can''t identify who that
    is.


    # Asset Tags


    Asset tagging is the process of assigning unique identifiers to company-owned
    hardware assets to facilitate the tracking of each device, both in its physical
    location and in its life cycle. Simple put, asset tagging is a solution to the
    problem of how to identify one particular computer when the company has purchased
    hundreds of them.


    Originally, asset tagging consisted of affixing a unique number to each device
    and using that on all of its documentation, as trouble tickets and service contracts.
    The products created to facilitate asset tagging have evolved over the years.
    The first solution was probably an indelible ink marker, but this soon become
    impractical. Later, it became possible to purchase sets of adhesive metal plates
    with serialized asset numbers, which could be placed outside or inside the device''s
    case. Later still, products with barcodes appeared.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Today, asset tagging manufacturers have greatly expanded the functionality
    of their products by creating tags using radio frequency identification (RFID)
    chips or other wireless tracking mechanisms. This can enable network administrators
    to not only identify devices, but actually track their locations within the facility.


    # Tamper Detection


    Tamper detection is any mechanism that can detect when a particular device, container,
    or facility has been opened by unauthorized persons. At its simplest, there are
    detection tapes and stickers that administrators can place on computers or other
    devices in such a way that when someone opens the device''s case, the tape is
    broken.


    Of course, mechanical tamper detection devices like this require someone to see
    the broken tape, which means regular inspection of network devices. Better than
    these mechanisms that can generate a signal when they detecting and alert an appropriate
    administrator. Many servers have switches into their cases that are tripped when
    someone opens it. The switch is typically connected to the motherboard so that
    the computer receives the tamper detection signal and can take action on it, such
    as generating an SNMP trap.


    # PREVENTION METHODS


    It is important to be able to detect an attack or intrusion when it occurs, but
    it is far more preferable to prevent those incidents from happening before they
    occur. While some intrusion methods involve the application of technology or hardware,
    others are a matter of careful planning and communication, with end users and
    IT support personnel. This section describes some of the commonly used attack
    methods for enterprise networks.


    # Employee Training


    While there are many types of attacks and intrusions that administrators can prevent
    by applying technology, it is important to remember that end users nearly outnumber
    IT personnel. They can be the organization''s first line of defense, as long as
    they know what to look for and what to do when a security event occurs. Employee
    training is the answer to that.


    Security training for end users consists largely of things they should look out
    for that can indicate an incident attack, or even one in progress, such as phishing
    messages, social engineering contacts, tailating attempts, and other suspicious
    behaviors. End users should also be informed about security-related policies and
    the reasons for them, such as mandatory password changes and multifactor authentication.


    In the same way, IT personnel—and especially the first-line people—should receive
    regular training to keep them updated about changing conditions and threats. The
    main problem with all of this is keeping the attention of the users long enough
    for the message to penetrate. Videos, paper handouts, emails, and intranet websites
    can all help'
  merge: -1
  img_proc: true
