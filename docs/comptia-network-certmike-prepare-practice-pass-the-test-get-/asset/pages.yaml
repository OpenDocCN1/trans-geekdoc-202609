  img_proc: true
- pgno: 129
  md: '# Chapter 8 • Cloud Computing


    # Security Implications


    Security is a vital concern for all networks, and cloud-based networks add some
    special security implications that administrators should address. Risk management
    is a part of every network operation, but when dealing with a third party, such
    as a cloud provider, all issues of concern should be documented in the contract
    between the parties involved. The contract should clearly delineate the responsibilities
    of both the provider and the consumer with regard to security.


    Cloud service contracts nearly always include a service-level agreement (SLA)
    specifying that the services furnished by the provider be available a certain
    percentage of the time. However, the contract should also specify other aspects
    of the provider''s security posture, such as what steps the provider should take
    to protect the consumer''s data. Questions such as whether the data is backed
    up, where the backups are stored, whether the data is encrypted at rest, and whether
    the cloud facility has physical security all be documented. Depending on the services
    provided and the nature of the contract, some of these tasks might be left to
    the consumer, but the contract should make clear.


    By definition, using public cloud services takes some of the vital network security
    issues out of the hands of the consumer. User identities are typically maintained
    in the cloud, so there might be authentication and authorization traffic passing
    between the consumer''s site and the cloud provider''s network. This traffic is
    vulnerable and should be encrypted, as any sensitive data is transmitted to or
    from the cloud.


    Hybrid cloud implementations are particularly vulnerable, due to the exchange
    of data that frequently occurs between local, private cloud storage and the public
    cloud services. Administrators must be conscious of where their data is located
    at all times and how it is used. For example, if a company that maintains a private
    data center because they use highly sensitive data adds to some cloud services,
    they must consider whether the data will have to leave the private network and
    be transmitted to the cloud. Cloud consumers often take the step of creating a
    VPN tunnel to the cloud facility so that the data can be encrypted and digitally
    signed for transit. In some cases, consumers restrict their use of the cloud to
    applications and services that are not particularly sensitive and leave their
    most classified data on the private network.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# CERTMIKE EXAM ESSENTIALS


    +   * NIST defines cloud deployment models that specify the basic architecture
    of a cloud network implementation, including public, in which a third-party cloud
    provider makes services available to any consumer; private, a cloud implementation
    reserved for a consumer''s exclusive use; community, in which a group of consumers
    in the same business share a cloud infrastructure; and hybrid, which is an implementation
    that combines public and private cloud resources.


    +   * NIST''s cloud service models define how responsibility for the cloud network
    is divided between the provider and the consumer. IaaS provides access to a hypervisor
    on which the consumer can create VMs. PaaS provides consumers with installed VMs
    on which they can deploy applications for development and testing. SaaS is a fully
    installed application or service, access to which is furnished to consumers.


    +   * Infrastructure as Code (IaC) is a technique for scripting the process of
    infrastructure deployment to automate the creation of development platforms.


    +   * Multitenancy, in which many consumers share the same hardware infrastructure;
    elasticity, which enables cloud services to scale out by adding servers when the
    consumer''s needs change; and scalability, which allows consumers to scale their
    servers by adding memory, storage, or other resources, are all aspects of cloud
    networking that administrators must consider when evaluating cloud services.'
