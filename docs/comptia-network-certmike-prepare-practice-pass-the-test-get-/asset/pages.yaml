  img_proc: true
- pgno: 339
  md: '# Certificate Issues


    deliver as strong signal as possible to the destination. Signals on fiber networks
    attenuate like any others, and many factors can contribute to the signal loss,
    including overlong cable segments, number of splices, and unclean connections.


    Certificate errors appear in browsers when a user attempts to access a server
    secured with Transport Layer Security (TLS). The error indicates that there is
    something wrong with the certificate presented by the server, usually one of the
    following things:


    +   **The certificate is expired or not valid.** Certificates have expiration
    dates, after which they should be renewed with the issuing authority.


    +   **The certificate was not issued by a trusted authority.** In some cases,
    certificates are self-issued by the server, which is a common practice during
    testing and evaluation, but not appropriate for a production server.


    +   **The certificate was issued for a different server.** Certificates are issued
    for particular hostnames. If the certificate specifies a different hostname, then
    troubleshooters should be suspicious.


    In any of cases, it is possible to bypass the error and proceed to the site using
    an unsecured connection. Whether it is safe to do depends on the nature of the
    site and what the users plan to do. Always be careful when accepting a certificate
    error because there is always the possibility the certificate actually is forged
    or invalid, meaning that some malicious activity may be taking place.


    # Hardware Failure


    Hardware fails at time, and there is not much network troubleshooter can do about
    except prepare for eventality. That preparation involves throwing money at the
    problem. One way to prepare for hardware failures is to install redundant components
    in places where device operation is critical. Servers with redundant power supplies
    and fault-tolerant arrays, are less likely to suffer service outages than those
    without those features. Another form of preparation is to enter service contracts
    for critical components that guarantee a turnaround for repair or replacement.


    # Host-Based/Network-Based Firewall Settings


    Firewalls are configurable filters that allow or deny the passage of traffic to
    from specific networks or hosts. When a server is running an application, its
    host-based firewall must be configured to allow traffic from clients to reach
    it. The firewall on a web server, for example, must be configured to allow incoming
    traffic through port 80. If that port is blocked by a firewall rule, then clients
    cannot access the web server.


    When troubleshooting a communication problem in which host-based firewall settings
    are a possible cause, one of the easiest ways to check that hypothesis is to turn
    off the firewall temporarily. If the problem goes away, then the troubleshooter
    knows to start looking at the settings of the host-based firewall.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The same principles hold true for network-based firewalls, typically located
    between an internal network and the Internet between a screened (or perimeter)
    subnet and the internal network. Troubleshooters can check the firewall logs to
    see if any traffic related to a problematic connection was blocked by the firewall.
    The general rule of least privilege applies to all firewalls; let only the essential
    traffic through and block everything else. The difference using network-based
    firewalls is that the stakes are far higher since these firewalls are the network''s
    protection against Internet intruders.


    # Blocked Services, Ports, or Addresses


    For network communication to occur, the systems must have the correct TCP and
    UDP ports open so that packets can enter and leave the systems from places. Most
    applications and services open the ports they need during installation, but firewalls—either
    on the host or on the network—can block these essential ports, rendering the application
    or service inaccessible from the network. When applying the least privilege principle
    to a network, administrators inadvertently block essential ports they were not
    aware an application needed. As mentioned earlier, when dealing with network communication
    problems, troubleshooters should always keep firewall rules in mind as potential
    sources of blockages.


    The net command can list the open ports on a system, as shown in Chapter 23, "Network
    Software Tools and Commands." A port scanner can detect open ports on the network.
    Both are useful tools when to troubleshoot a malfunctioning (or nonfunctioning)
    application.


    # Incorrect VLAN


    As noted in this chapter, an incorrect VLAN assignment is essentially the virtualized
    equivalent of connecting a device to the wrong device. The device will likely
    be assigned an incorrect IP address and will be unable to access the user''s familiar
    resources. It is also possible that the device could receive enhanced privileges
    as a result of connecting to the wrong VLAN. Troubleshooters should check the
    VLAN configuration at the switch when these wrong situations occur.


    # DNS Issues


    The Domain Name System (DNS) resolves server and domain names to IP addresses.
    If name resolution fails to occur, it might appear to the average user as though
    the network connection is down, but that might not be so. It is only the DNS that
    is experiencing a problem. A network might have a DNS server on the internal network,
    or it might be the ISP''s DNS server. While, the DNS relies on other servers on
    the Internet, when the Internet connection goes down, DNS does as well.


    In cases of DNS issues, the name resolution is not working at all or it is returning
    incorrect information. Troubleshooting a name resolution failure typically starts
    with checking that the host is configured with the correct DNS server address.
    If is, the next step is to check the DNS server the host is configured to use.
    The DNS service or'
