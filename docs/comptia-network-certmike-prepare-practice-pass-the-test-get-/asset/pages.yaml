- pgno: 128
  md: 'optic—installed expressly for the purpose of making this connection, or it
    could be a leased line contracted through a telecommunications provider. This
    is the most expensive alternative to an open Internet connection, but when the
    data in question is highly classified, the cost must be warranted.


    # ## Multitenancy


    Multitenancy refers to the sharing of cloud resources among multiple consumers.
    When a consumer enters into a contract with a provider for access to certain cloud
    resources, there is usually no mention of what servers are used, where they are
    located, or what other consumers might be sharing the same hardware. For most
    consumers, this is not a major problem because virtual machines are generally
    isolated from each other. That isolation is not perfect, and if a consumer''s
    application or data is extremely sensitive, providers can usually provide a consumer
    with dedicated hardware that is not shared with other tenants (at an additional
    cost).


    In a private cloud environment, multitenancy and isolation between networks in
    the same enterprise can be an issue. For example, a development network in which
    people are testing code must be kept separate from the production network.


    # ## Elasticity


    One of the major advantages of cloud-based networking is the ability of the services
    to expand and contract base on the needs of the consumer. Because the servers
    and other network components are virtualized, it is a simple matter to expand
    or them based on the consumer''s needs and regress them, if necessary. With many
    cloud providers, the process by which this elasticity is applied can even be automated
    that when a website''s incoming traffic reaches a certain threshold, additional
    virtual machines are automatically added to the server farm. At the end of the
    busy season, when traffic dies down, the additional servers are removed, and the
    consumer only pays for the time they were actually running.


    # ## Scalability


    Elasticity refers to the ability of cloud resources to expand and contract base
    on the needs of the consumer. Typically, this means adding more servers, a process
    known as scaling out. With cloud services, however, it is also possible to scale
    up by enhancing the capabilities of the existing servers.


    This scalability in two directions enables consumers to provide their networks
    with additional servers and their servers with additional memory, storage, bandwidth,
    or virtually any other resource in minutes, instead of hours or days. The cloud
    consumers pay only for the resources they use. To the consumer, the pool of available
    resources they can access seems virtually limitless.'
