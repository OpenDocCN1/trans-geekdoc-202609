- pgno: 224
  md: '# CHAPTER 16


    # Security Concepts


    # Objective 4.1:

    Explain common

    security concepts.


    *This chapter* examines some of the security concepts implemented on a typical
    enterprise network. The Network+ exam expects candidates to be familiar with these
    basic concepts.

    In this chapter, you''ll learn everything you need to know about Network+ objective
    4.1, including the following topics:


    +   * Confidentiality, integrity, availability (CIA)

    * Threats

    * Vulnerabilities

    * Exploits

    * Least privilege

    * Role-based access

    * Zero trust

    * Defense in depth

    * Authentication methods

    * Risk management

    * Security information and event management (SIEM)


    # CONFIDENTIALITY, INTEGRITY, AND

    ILABILITY


    The fundamental security goals of an enterprise network are to maintain the confidentiality,
    integrity, and availability (CIA) of the organization''s data. This is known as
    the CIA triad. The elements of the triad are defined as follows:'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Confidentiality The prevention of data access by anyone other than authorized
    sonnel, using tools as physical locks, authentication mechanisms, data encryption,
    and firewalls


    Integrity A mechanism that ensures that data has not been modified, accidentally
    or deliberately by unauthorized individuals, while being transmitted over the
    network or stored on a server. The mechanism is typically a digital signature
    containing hashes and checksums


    Availability The continued accessibility of the data under all circumstances,
    including deliberate attacks and natural disasters, using fault tolerance and
    high availability mechanisms such as backups, RAID arrays, server farms, and other
    redundant components


    # THREATS


    In enterprise networking, a threat is anything that could possibly endanger the
    network itself or its data. The word threat has connotations of malicious attackers
    deliberately getting the network, but there are many other types of threats that
    are just as damaging. Threats to a network can be classified as internal or external.
    External threats originating from outside the firewall and the company facilities.
    In most cases, access to the network comes in the Internet connection, but an
    external threat can also enter a company building and physically disrupt the network
    by vandalism, theft, or sabotage. External threats also include natural disasters,
    such as hurricanes and earthquakes. Protection includes firewalls and access control
    for the cyberthreat and physical barriers against intrusion, such as key card
    entry systems, cameras, and guards. Internal threats originate behind the firewall
    and the company facilities. These threats are often harder to detect and can be
    even more malicious. Disgruntled employees might already have the physical or
    digital network access they need to cause trouble, whether they come about it
    legitimately or not. Even if the employees are no longer with the company, they
    are considered an internal threat because that is how they gained their network
    privileges. Internal threats also include accidental occurrences that cause network
    damage, which range from shared passwords to inadvertent deletion to coffee spilled
    on electronics in the data center. Protection against internal threats begins
    with careful allocation of access permissions, both digital and physical, and
    auditing of both successful and unsuccessful accesses to sensitive data and facilities.


    # VULNERABILITIES


    In an enterprise network, vulnerabilities are security weaknesses, whether in
    hardware, software, or personnel, which enable unauthorized exposure of data or
    other resources, and which have not been addressed by any sort of compensating
    control, countermeasure, or safeguard. Where hardware is concerned, a vulnerability
    can be as simple as an unlocked'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'data center door. In software, vulnerabilities are the basis for an arms race,
    attackers seeking them and protecting them. Personnel vulnerabilities typically
    take the form of individuals with access permissions they do not need and should
    not have.


    Addressing vulnerabilities is one of the primary reasons software products are
    updated on a regular basis. However, tracking vulnerabilities and collaborating
    with others to define and resolve them can be difficult because people experience
    the same vulnerability in different ways, making classification a problem. To
    address this problem, it was necessary to devise a method of identifying and tracking
    vulnerabilities.


    # Common Vulnerabilities and Exposures


    Common Vulnerabilities and Exposures (CVE) is a registry for known vulnerabilities
    in publicly released software products. Entries in the registry are assigned a
    unique CVE identifier, as CVE-2022-34720, which is the number for a Windows Internet
    Key Exchange (IKE) Extension Denial of Service Vulnerability, by a CVE Numbering
    Authority (CNA). Once a vulnerability is identified and classified can be referenced
    by CVE number, the process of defining, tracking, and mitigating the vulnerability
    is much easier.


    # Zero-Day


    Zero-day is for a term used to describe a vulnerability that has become public
    knowledge and for which countermeasure has not yet been devised or released. The
    term refers to a problem that administrators have zero days to fix because there
    is no remedy available. A zero-day attack is a network infiltration that occurs
    during that period between the discovery of the vulnerability and the release
    of a patch or workaround.


    # EXPLOITS


    If a vulnerability is a weakness, then an exploit is the means by which someone
    can take advantage of vulnerability. In most cases, an exploit takes the form
    of a script or other code that is designed to take advantage of a vulnerability
    to gain access to sensitive resources. More serious than the existence of a zero-day
    vulnerability, a zero-day exploit is a proven method for infiltrating a system
    using a vulnerability that has not yet been documented or mitigated.


    # LEAST PRIVILEGE


    Least privilege is a security principle stating that individuals should have the
    network and data access they need to perform their jobs and no more than that.
    Many applications and operating systems leave their administrative functions open
    by default, which enables both users and intruders to access controls that can
    damage the system or the network.


    For example, users who have administrative privileges on their workstations can
    conceivably alter configuration settings that might render the computer unusable.
    This is not'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'a catastrophe, it adds to the workload of the first-line IT workers. Even worse,
    those users might fall victim to a phishing or social engineering attack and grant
    an intruder access to their systems, providing that intruder with the same administrative
    access.


    To apply the principle of least privilege, administrators should grant users the
    permissions they need. For example, users should receive read-only access to files
    unless them is part of their job. The principle becomes more complicated with
    supervisors and IT personnel who do administrative access at times. These users
    should have two accounts, one with administrative privileges and one with basic
    user privileges, and they should only use the administrative account when they
    need to perform administrative tasks. The less often the administrative privileges
    are used, the less they will be compromised.


    # ROLE-BASED ACCESS


    Role-based access is a technique designed to simplify the permissions assignment
    process, enabling administrators to apply the least privilege principle more easily.
    The process of assigning users the permissions they need to work while denying
    everything else can be lengthy and time-consuming, especially when there are dozens
    or hundreds of users to configure.


    Rather than configure each user account individually, administrators can create
    a group or other element that is dedicated to a single role or job, and possesses
    all of the permissions needed to perform that job. Then, by adding the users who
    perform that job to the group or assigning them inherit the permissions they need.
    When a user leaves the job or the company, simply removing them from the group
    revokes the permissions they no longer need.


    # ZERO TRUST


    The traditional security model for network calls for people connected to the network
    to be treated as trusted and those outside the network to non-trustworthy. With
    the increasing number of network threats and vulnerabilities today, this model
    is increasingly naive. Zero trust is a security principle where all with no access
    to the network at all are then granted the permissions they need to perform their
    tasks.


    Zero trust means everything users do on the network they because they have been
    authenticated and authorized for each particular task at the time access is required.
    This generally means that authentication traffic on the network increases, users
    have to supply access credentials more often, and there are more IT help requests
    from people with login problems, but this is the price of security.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# DEFENSE IN DEPTH


    The principle of defense in depth calls for there to be multiple layers of security
    between protected resources and potential intruders. Ideally, the layers should
    consist of different types of security. For example, before a user receive an
    email message, it might have to pass through a firewall, and then be subject to
    access controls, and finally be decrypted. Multiple barriers of different types
    make a system inherently more secure. This section describes some of the security
    mechanisms that an enterprise network might use as part of its defense in depth.


    # Network Segmentation Enforcement


    When a network consists of a single segment, every computer has theoretical access
    to every other computer. However, by splitting the network into multiple segments,
    it is possible to control access among them by using a technique network segmentation
    enforcement.


    There are different means of segmenting a network: it can be done physically by
    separating the devices in different locations and regulating access between them.
    However, a more common solution is to segment the network at the data link layer
    by creating local area networks (VLANs) in the switches and using port security
    to control access to them. This means, after any other security mechanisms that
    might be in place, users must be authenticated before they can gain access to
    a particular VLAN segment.


    # Perimeter Network


    A perimeter network—also called a screened subnet or demilitarized zone (DMZ)—is
    a separate part of an enterprise network that houses the servers requiring a presence
    on the Internet, such as web servers. The perimeter network is located between
    the company''s protected inner network and the Internet.


    Typically, there are two firewalls, one internal at the interface between the
    perimeter network and the inner network and one external between the perimeter
    network and the Internet. In the case of a web server located on the perimeter
    network, the external firewall would be configured to allow only web request traffic
    from the Internet. The internal firewall might allow the web server to communicate
    with back-end servers on the internal network, such as a SQL server, but other
    interaction with the internal network is highly restricted.


    It is also possible, in some cases, for a single next-generation firewall (NGFW)
    separating the enterprise network from the Internet to implement the perimeter
    network and all its necessary rules internally. This eliminates the need for a
    potentially complicated cable installation to create the perimeter network.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Separation of Duties


    Separation of duties is a security principle that is intended to prevent any one
    person from possessing too many administrative privileges. The concept is not
    that employees are untrustworthy, but that defense in depth calls for a division
    of duties. For example, accessing a safe deposit box in a bank requires two people
    with different keys, one from a bank account and one from the box owner. Neither
    is suspected of wrongdoing, but the division of labor prevents unauthorized entry
    to the box by either party.


    As different types of security mechanisms add to the protection of the network,
    separating-administrative duties prevent IT personnel from accidentally or deliberately
    compromising the security of the network.


    # Network Access Control


    Network access control (NAC) is a security mechanism that frequently works with
    the 802.1X authentication protocol to screen users as they connect to the network.
    Some of the common NAC screening criteria include the update status of the operating
    system and applications, whether the computer has an antivirus product installed
    with updated signatures, whether the system is running a properly configured firewall.
    If the systems are not in compliance with the NAC policies, then NAC can prevent
    the users from authenticating and denying them access to the network.


    # Honeypot


    A honeypot is a system with no significant access to sensitive data or services
    that is designed to be a tempting target for potential attackers. By setting up
    a single system or a group of systems (called a honeynet) administrators can gather
    intelligence about attackers and the means they might use to gain access to the
    network. In addition, the honeypot can divert the intruder''s attention from the
    actual network targets. One strategy—called a tarpit—is to configure the honeypot
    or honeynet to run as slowly as possible, so to keep the intruder occupied pursuing
    a false target.


    # AUTHENTICATION METHODS


    Authentication is the process of verifying the identity of a person, device, or
    application attempting to access a protected resource. The process can be simple
    and self-contained, with accounts maintained by an application for its own use,
    but enterprise networks typically use a directory service of some type to store
    user accounts. Users might authenticate many times in the course of a typical
    computer work session, sometimes invisibly and at other times requiring them to
    supply credentials to verify their identities. There are many protocols and concepts
    that can be involved in the authentication process, including those described
    in this section.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Authentication Methods


    # Multifactor


    Multifactor authentication is when a system requires more than one proof of an
    individual''s identity. A typical authentication requires users to supply an account
    name and a password. For a system that has implemented multifactor authentication,
    the users will have to furnish another proof. Depending on the system, the proofs
    required for a multifactor authentication can fall under the following categories:


    +   * Something you: A piece of information that no one else knows but you, such
    as a password or PIN

    * Something you: A physical device, such as a key fob or swipe card, that you
    must be present at the time of authentication

    * Something you: A physical trait or characteristic that is unique to you, such
    as your fingerprint, voice, or face


    The most commonly used multifactor authentication mechanisms today call for a
    password (something you) or a code sent to the user''s smartphone (something you
    have). As long as the factors used for authentication are from different categories,
    the system should be more secure than a typical single-factor authentication system.


    # Authentication, Authorization, and Accounting


    Authentication, authorization, and accounting (AAA) is a model for a centralized
    service that stores user accounts and handles the authentication and authorization
    processes for other devices on the network. The accounting function keeps a record
    of users'' activities. Some products add auditing capabilities, leading to the
    use of the abbreviation AAAA. There are primary AAA products used today, as follows:


    +   * TACACS+: Based on a 1990s protocol that provided authentication services
    for network users, Terminal Access Access-Control System (TACACS+) was developed
    in the 1990s to be a fully-featured authentication, authorization, and accounting
    (AAA) server. TACACS+ uses TCP for its transport communications and encrypts all
    data before transfer.

    * RADIUS: Originally designed in the 1990s to authenticate dial-users for ISPs,
    the Remote Authentication Dial-in Service (RADIUS) is a standards-based protocol
    that provides AAA functions for a variety of network applications, including WLANs,
    remote access connections, and standard cabled networks.


    # Single Sign-On


    Single sign-on (SSO) is an authentication technique that allows users to sign
    on once with their credentials and then access protected resources resources using
    those same credentials. This prevents the users from repeatedly supplying credentials
    whenever they access a new resource.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'On today''s networks, there are many different applications and services that
    require authentication before users can access them. When users have to log into
    each individually, they can easily become frustrated with maintaining passwords
    for multiple user accounts. This can lead the users to create passwords that are
    overly simple, write down passwords in obvious places, or circumvent the company
    password policies in other ways.


    To implement simple sign-on, enterprise networks typically use a centralized directory
    service, such as Active Directory. Once users authenticate to their Active Directory
    accounts the first time, they are issued a digital token that provides them with
    access to the other resources they are authorized to use. After the first sign-in,
    subsequent authentications and authorizations are transparent to the user.


    # LDAP


    Lightweight Directory Access Protocol (LDAP) is an application layer protocol
    commonly used to carry directory service information between clients and servers.
    Based on the earlier Directory Access Protocol (DAP), which was used with the
    now-obsolete X.500 directory service in the 1980s, LDAP is currently the underlying
    communication protocol for Microsoft Active Directory directory service.


    # Kerberos


    Kerberos is an authentication protocol used by the Active directory service for
    communications with clients, servers, and domain controllers. Based on the three-headed
    hellhound of Greek mythology, Kerberos carries authentication traffic from the
    clients and servers to a domain controller, which is the central clearinghouse
    for Active Directory authentication. Both clients and servers request and receive
    tickets from the domain controller, which enable them to authenticate each other.
    The domain controller renews the tickets periodically, as needed, so the clients
    and servers can continue to communicate.


    Kerberos uses strong encryption for all of its communications, but even so, it
    transfers passwords or secret keys over the network. Instead, the authenticating
    system and the domain controller both use a symmetric key to generate keys from
    the user password they have on file. Then, they use those keys to encrypt and
    decrypt messages to each other. If a message encrypted by one using the secret
    key can be decrypted by the system with its own key, then both must have generated
    their keys using the same password, and the authentication is successful.


    # Local Authentication


    Local authentication, as the name implies, is an identity verification process
    that is implemented and executed all on a single system. The operating system
    stores the user accounts and passwords, which the authenticating user specifies
    to gain access to the system. No network communication is involved, so there is
    no danger of passwords compromised from network traffic.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Risk Management


    The problem with local authentication is that each system requires its own set
    of user accounts. When users want to change their passwords, someone must change
    them on every system where each user has an account. Typically, local authentication
    functions only as a fallback that allows users to log on to their computers, when
    the network is down.


    # 802.1X


    802.1X is a standard published by the IEEE defining an authentication method for
    controlling access to networks by manipulating port security settings. An 802.1X
    transaction involves three parties: a switch, an authenticator, and an authentication
    server.


    The supplicant, which is a user or device requesting access to a resource, sends
    an access request and its credentials to the authenticator, which is typically
    a switch, but can also be a wireless access point or a virtual network (VPN) server.
    The authenticator then forwards the credentials to an authentication server, which
    typically runs TACACS+ or RADIUS and verifies the credentials. If the authentication
    is successful, the authentication server informs the authenticator, which grants
    the requested access.


    One of the main advantages of 802.1X is that it enables switches and other devices
    to offload authentication processing to a dedicated authentication server, lessening
    the burden on the switches themselves.


    # Extensible Authentication Protocol


    Extensible Authentication Protocol (EAP) is not really a protocol, but rather
    a framework that extends the 802.1X framework to support a variety of authentication
    mechanisms, including smart cards, fingerprints, and other forms of biometrics,
    as well as passwords. There are many protocols that use the EAP framework, including
    Protected Extensible Authentication Protocol (PEAP), which encapsulates EAP within
    an encrypted TLS tunnel, and Extensible Authentication Protocol-Transport Layer
    Security (EAP-TLS), used on wireless networks.


    # RISK MANAGEMENT


    IT, risk management is the process of identifying potential dangers to the network,
    prioritizing those dangers, and taking steps to minimize or eliminate them. An
    enterprise network should have a formal risk management program in place that
    performs regular assessments of the network''s security posture.


    One of the primary elements of a comprehensive risk management program is to perform
    security risk assessments on a regular basis. These are tests to evaluate the
    network''s resistance to known risks, as with the following:


    +   Threat Assessment Administrators must remain aware of the new threats that
    appear regularly and the dangers they pose to the network. There are many websites
    that track the latest threats and describe their characteristics.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Vulnerability Assessment A scan, typically performed by a third-party software,
    which evaluates the potential vulnerabilities of a network by identifying open
    ports, missing software updates, configuration anomalies, and other weaknesses.


    Penetration Testing A test in which a third party—acting as an intruder—attempts
    to exploit the weaknesses in the network’s security posture under ordinary operating
    conditions and access its protected resources. In many cases, for a more realistic
    assessment, the test is provided with no prior knowledge of the network and the
    company’s IT personnel are not told that the test is pending.


    Posture Assessment Often occurring with a penetration test, a posture assessment
    is a test of how the IT department reacts to a network attack.


    Business Risk Assessment Beyond the existence of vulnerabilities, a business risk
    assessment evaluates vulnerabilities with regard to the dangers they pose to the
    organization’s business interests. This enables the administrators to prioritize
    the vulnerabilities and refine their reaction plans.


    Process Assessment An examination, with an eye to network security, the business
    processes that company workers perform on a regular basis.


    Vendor Assessment An examination of the security posture of the organization’s
    vendors and other business partners, including what access they have to the organization’s
    network and data resources as well as their own security procedures.


    # SIEM


    Security Information and Event Management (SIEM) is an umbrella term used for
    products that combine the functions of security information management (SIM),
    which provides long-term log storage and analysis, and security event management
    (SEM), which provides real-time monitoring of network devices. Available as software,
    hardware, or a managed service, an SIEM product can gather logs from various network
    devices, such as firewalls and switches; collate the information; and then evaluate
    it by comparing the data with known threat behaviors. If the SIEM product detects
    a threat, it can typically notify an administrative contact in various ways. Some
    products can even take action to remediate a threat.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# CERTMIKE EXAM ESSENTIALS


    +   - The CIA triad defines the three basic security goals for an enterprise network:
    confidentiality, integrity, and availability.

    - Defense in depth is a security principle that calls for multiple layers of security
    between the protected material and its potential threats. Some of the associated
    concepts are network segmentation enforcement, perimeter networks, NAC, and honeypots.

    - Authentication is one of the most critical security elements in an enterprise
    network. It can involve many different concepts and technologies, including multifactor
    authentication, AAA, single sign-on, LDAP, Kerberos, 802.1X, and EAP.'
  merge: -1
  img_proc: true
