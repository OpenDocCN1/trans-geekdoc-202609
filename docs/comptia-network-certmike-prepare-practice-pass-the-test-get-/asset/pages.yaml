- pgno: 362
  md: '# ONLINE TEST BANK


    To help you study for your CompTIA Network+ certification exam, register to gain
    one year of FREE access after activation to the online interactive test bank—included
    with your purchase of this book! All of the practice questions in this book are
    included in the online test bank so you can study in a timed and graded setting.


    # REGISTER AND ACCESS

    THE ONLINE TEST BANK


    To register your book and get access to the online test bank, follow these steps:


    +   1. Go to www..wiley.com/go/sysextestprep. You''ll see the “How to Register
    Your Book for Online Access” instructions.

    2. Click “here to register” and select your book from the list.

    3. Complete the required registration information, including answering the security
    verification to prove book ownership. You will be emailed a pin code.

    4. Follow the directions in the email or go to www..wiley.com/go/sysextestprep.

    5. Find your book on that page and click the “Register or Login”link with it.
    Then enter the pin code you received and click the “Activate PIN” button.

    6. On the Create an Account or Login page, enter your username and password, and
    click Login or, if you don''t have an account already, create a new account.

    7. At this point, you should be in the test bank site with your new test bank
    listed at the top of the page. If you do not see it there, please refresh the
    page or log back in.'
