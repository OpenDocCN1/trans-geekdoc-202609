- pgno: 34
  md: '# OSI Model


    # Objective 1.1: Compare and contrast the Open Systems Interconnection (OSI) model
    layers and encapsulation concepts.


    The OSI reference model can serve as a roadmap to many of the other concepts covered
    on the Network+ exam, providing a common lexicon that enables people working with
    these processes to communicate easily.


    In this chapter, you''ll learn everything you need to know about Network+ Objective
    1.1, including the following topics:


    +   - OSI model

    - Data encapsulation and decapsulation within the OSI model concept


    # OSI MODEL


    The Open Systems Interconnection (OSI) reference model is an architectural diagram
    of network communications. The model defines a highly complex process by dividing
    it into its component elements, in this case seven discrete layers, as shown in
    Figure 1.1.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Application


    ![](img/131506e178f74f7b4704a0aa0fe03dae_35_0.png)


    # FIGURE 1.1 The seven layers of the OSI reference model


    The seven layers of the model correspond to various network communications processes
    (called protocols) running on a computer. Table 1.1 lists the model layers, their
    functions, and the protocols that implement them. These protocols are covered
    in more detail throughout this book.


    > ### EXAM TIP


    Memorizing this table is a good idea, as many Network+ exam questions reference
    the various layers of the OSI model, their functions, and their protocols. An
    easy way to remember the order of the layers is with the mnemonic "Please Do Not
    Through Sausage Pizza Away."


    # TABLE 1.1 OSI reference model layers


    | Number | Layer | Main functions | Protocols |

    | --- | --- | --- | --- |

    | 7 | Application | File, print, messaging, and other services | DNS, FTP, HTTP,
    POP3, SMTP, SNMP, DHCP |

    | 6 | Presentation | Syntax translation | |

    | 5 | Session | Dialog control, dialog separation | |'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# OSI Model


    | Number | Layer | Main functions | Protocols |

    | --- | --- | --- | --- |

    | 4 | Transport | Data segmentation, packet acknowledged, error detection and
    correction, flow control, port identification | TCP, UDP |

    | 3 | Network | Addressing, routing, error detection, protocol identification
    | IP, IPv4, IPv6, ICMP |

    | 2 | Data Link | Framing, media access control, protocol identification | IEEE
    802.3 (Ethernet), IEEE 802.11 (Wi-Fi) |

    | 1 | Physical | Network interface hardware, binary signaling | Twisted pair,
    fiber-optic, Wi-Fi |


    # EXAM TIP


    The layers of the OSI model are numbered from the bottom of the stack to the top.
    The physical layer at the bottom is designated as layer 1 and the application
    layer at the top is layer 7. In some references and product documentation, the
    model layers are referenced by number instead of name.


    A protocol is a language that computers use to communicate with each other. Collectively,
    the processes running on the layers of the model are called the protocol stack.
    The network medium (whether a copper cable, fiber-optic cable, or wireless) connects
    to the physical layer at the bottom of the stack, and the signals entering into
    this layer travel up through the layers of the stack to the top of the stack.
    In the same way, data being sent down through the layers and out to the network
    using the connected medium.


    This vertical communication between the layers of the protocol stack takes the
    form of services that the layer above and requests from the layer below. For example,
    when a client application sends a message, it typically generates a request for
    the services of the Simple Mail Transfer Protocol (SMTP), running at the application
    layer. SMTP passes the request down to the next layer, which hands it off to the
    next layer, and so forth, until reaches the bottom layer and is transmitted over
    the network.

    The server receiving the transmission over the network then begins the same process
    in reverse, passing the message up the layers of its own protocol stack until
    it reaches a mail server application on the computer. The protocols running at
    specific layers of the OSI model have complementary functions that make network
    communication possible. The protocols at the individual layers of the model can
    therefore be said to communicate virtually with their counterparts on other systems.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Chapter 1 • OSI Model


    One of the objectives of the OSI model was to define a networking architecture
    that enables manufacturers to create products that communicate readily with those
    of other manufacturers. As long as two computers are running compatible protocols
    at each layer of the OSI model, communication between them is theoretically possible,
    even if they are using different hardware and software.


    While there have been other protocols over the years, LANs today nearly always
    run Ethernet or Wi-Fi at the physical and data link layers, Internet Protocol
    (IP) at the network layer, Transmission Control Protocol (TCP) and User Datagram
    Protocol (UDP) at the transport layer, and a collection of Transmission Control
    Protocol/Internet Protocol (TCP/IP) protocols and services at the application
    layer.


    This TCP/IP protocol suite has a layered architecture similar to that of the OSI
    model, but it has four layers, as shown in Table 1.2, and the layers do not correspond
    exactly to those of the OSI model. Some documents, such as the Requests for Comments
    (RFCs) that define the various TCP/IP protocols, reference the layers of the TCP/IP
    model instead of the OSI layers.


    # TABLE 1.2 Corresponding OSI model and TCP/IP layers


    | OSI model layers | TCP/IP layers |

    |---|---|

    | Application |

    | Presentation | Application |

    | Session | |

    | Transport | Transport |

    | Network | Internet |

    | Data Link | Link |

    | Physical | |


    The seven layers of the OSI reference model are described in more detail in the
    following sections.


    # Layer 1: The Physical Layer


    The physical layer, as the name implies, provides the actual physical connection
    between the computer and the network. The hardware implementing the physical layer
    in a computer—called a network interface adapter—typically includes either a connector
    for a network cable or a transceiver that provides wireless connectivity. In the
    network'
  merge: -1
  img_proc: true
