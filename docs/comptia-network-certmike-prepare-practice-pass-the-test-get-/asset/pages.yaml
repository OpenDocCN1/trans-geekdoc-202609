- pgno: 211
  md: '# LOAD BALANCING


    Load balancing is a high availability technique in which there are multiple servers
    performing the same task and a mechanism that divides the incoming traffic among
    those servers. This prevents any server from being overwhelmed with requests.

    One of the most common load balancing scenarios is that of a server hosting a
    busy website. There are multiple web servers clustered, each of which hosts a
    fully functional copy of the website. A load balancer functions as a gateway to
    the server farm. Incoming requests from clients on the Internet arrive at the
    load balancer, which distributes them among the servers.


    This arrangement enables administrators to add servers to the cluster when the
    load increases or remove them for maintenance. Even if a server should fail, the
    load balancer can redistribute the traffic among the remaining servers, ensuring
    the continued availability of the website.


    The load balancing mechanism can be a software or hardware product, and it can
    distribute the traffic in various ways. For example, some load balancers use a
    round-robin algorithm, which the device distributes the incoming requests by sending
    one to each server in turn. Others monitor the servers in the farm and send incoming
    requests to the server with the fewest active clients.


    # MULTIPATHING


    Multipathing—also known as multipath IO or MPIO—is a fault tolerance mechanism
    usually associated with storage area networks (SANs). SANs can provide a flexible
    and scalable storage infrastructure, but they also add points of failure. When
    a server is connected to its storage through a SAN, there are intervening cables,
    switches, and disk housings that could fail one day.


    To provide fault tolerance and high availability, administrators often design
    the network with redundant paths between the server and the storage devices so
    that if one path should fail, the other continues operating. To implement multip
    multip infrastructure for a SAN, the server needs at least two network interface
    adapters, each of which is connected by a cable to a different switch. The switches
    are then connected to the drive array, which should also have redundant network
    interfaces.


    With this arrangement, the server can tolerate the failure of a network adapter,
    a cable, or a switch. The more redundant components there are on the path from
    the server to its storage, the more tolerant of faults the SAN will be.


    # NIC TEAMING


    Network interface card (NIC) teaming—also called NIC bonding—is a technique for
    joining two network interface adapters together, either combine their bandwidth
    or to provide'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Redundant Hardware/Clusters


    fault tolerance. When creating a NIC team, the administrator typically has a choice
    of operating in either of the following modes:


    +   - Active-active: When both NICs are active, each has its own MAC address and
    its own connection to a switch. The NICs can be connected to the same switch,
    but connecting them to different switches enables the system to tolerate a switch
    failure as well as a NIC or cable failure. When both NICs are active, the bandwidth
    of the adapters is aggregated to provide greater performance.

    - Active-passive: One NIC is always operational, while the other remains in passive
    standby mode so that it can function as a failover option should the active NIC
    malfunction. In some cases, the teamed NICs exchange heartbeat messages so that
    the passive NIC can detect when the active NIC fails and activates itself to take
    over its role.


    > EXAM TIP Network+ objectives and many other sources frequently use the network
    interface card and even many computers and other devices have integrated network
    interface adapters instead of separate expansion cards. Candidates for the Network+
    exam should be aware that the term NIC is used here generically and applies to
    all network interface adapters, not just those of expansion cards.


    # REDUNDANT HARDWARE/CLUSTERS


    The key to network fault tolerance is redundancy. Providing duplicate devices
    for as much of the network infrastructure as possible will make the network more
    resilient. For servers, redundancy can duplicate components inside the computer,
    such as redundant processors, power supplies, hard disks, and network interface
    adapters, or it can mean duplicating servers, creating what is known as a failover
    cluster or server farm. As mentioned earlier regarding NIC teaming, redundant
    servers operate in active- or active-passive mode. In either case, the server
    cluster has a single IP address that represents the cluster itself, including
    all of the servers in it.


    Another use of redundancy is in the storage infrastructure. Servers use the various
    levels defined in the Redundant Array of Independent Disks (RAID) standards to
    maintain duplicate copies of important data on memory disks, either standard hard
    drives or solid-state drives (SSDs), which use memory chips to store data, rather
    than spinning platters.


    For both servers and storage, a key component of redundancy is having an automatic
    failover mechanism that detects when a component malfunctions and brings its fallback
    online without administrative intervention.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'In addition to servers and storage, other network devices can have built-in
    redundancies, including the following:


    **Switches** As noted in Chapter 11, "Switching," designing a network with redundant
    switching paths is relatively common in enterprise networking. However, when the
    switches run in active-active mode, there is a tendency for packets to circulate
    around the network in switching loops. Switches use the Spanning Tree Protocol
    (STP) to put individual switching paths into passive mode to prevent switches
    from repeatedly processing the packets.


    **Routers** Unlike switches, which are invisible to the average network user,
    workstations must have a default gateway address configured, which specifies the
    router the device will use to access outside networks. Because each has its own
    IP address, and there is no mechanism to dynamically change a workstation''s default
    gateway address as network conditions change, administrators use specialized protocols
    called high redundancy protocols (FHRPs), which create a virtual router with its
    own IP and MAC addresses that stands for the redundant physical routers. By using
    the virtual router''s IP address for a workstation''s default gateway, the physical
    routers can change their active and passive roles without affecting the workstation.


    **Firewalls** For load balancing or fault tolerance reasons, an enterprise network
    can use redundant firewalls that operate as a cluster, as servers do, with a single
    IP address representing the cluster. This splits the packet processing load among
    the nodes, ensures high availability, and enables administrators to add and remove
    them from the cluster as needed. Duplicate firewalls might also be required for
    a network with connections to multiple Internet service providers.


    # FACILITIES AND INFRASTRUCTURE SUPPORT


    High availability applies not just to the devices that make up the network, but
    also to the environment in which those devices run. To run efficiently, the network
    equipment in a data center or server closet requires a stable power source and
    an atmosphere with controlled temperature, humidity, and other factors. The data
    center should also have some measures of protection against disasters, such as
    fire suppression equipment and sensors to detect flood conditions and toxic gases,
    as carbon monoxide and radon.


    This section describes some of the devices needed to maintain an environmental
    infrastructure.


    # Uninterruptible Power Supply (UPS)


    An uninterruptible power supply (UPS) is a battery-based backup power source and
    power conditioner. The UPS protects the devices connected to it from damage due
    to power lags'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Facilities and Infrastructure Support


    or spikes also provides a short-term source of power when there is an AC outage.
    UPSs are designed for two purposes: to provide power long enough execute a controlled
    shutdown of the equipment and to keep the equipment running until a generator
    can start and supply a stable, long-term power source:


    UPS products range from small, inexpensive units intended for protecting a small
    computer to large, costly devices in data centers. A UPS accepts power from an
    AC source and also contains a battery; it uses both of these to supply AC power
    to the devices connected to it. However, in the way the UPS handles the changeover
    between AC and battery power is what differentiates the three types of UPSs, which
    are as follows, from most to expensive:


    +   Online: The UPS supplies power to the connected devices from its battery at
    all times and uses the incoming AC source to supply power to the battery circuit
    and also charge the battery. There is no need for switching between power sources
    and no delays.


    +   Interactive: The UPS uses the incoming AC source to supply power to the inverter
    that provides the output power. When the incoming AC fails, the inverter begins
    supplying output AC from the battery. There is no circuit switch from AC to the
    battery-based inverter, so the transition time is minimal.


    +   Standby: The UPS normally supplies the connected device with AC power from
    the source. When the AC power fails, the UPS switches its output over AC to the
    battery-based inverter in a relatively long transition that can take 25 milliseconds
    or more.


    # Power Distribution Units


    A power distribution unit (PDU) is a device that provides multiple electrical
    outlets from a single AC source. The power strip that is probably sitting under
    your desk is technically a PDU, but the one used in data centers are larger, rack-mounted
    devices and often include specialized features.


    When a data center has equipment, such as servers or switches, with redundant
    power supplies for fault tolerance, the recommended practice is to connect each
    of the power supplies to a separate AC source. Some organizations do just by installing
    a rack with two separate PDUs connected to different AC sources, providing separate
    circuits for each of the device''s two power supplies. If one power supply should
    fail, the other is always available to keep the equipment running. Depending on
    the degree of fault tolerance required and the organization''s budget, each PDU
    might also be connected to its own UPS and even its own separate generator.


    # Generator


    Battery-based power sources, such as UPSs, are designed only for short-term use.
    A UPS can provide power through a brief AC outage, but for an extended power failure,
    a UPS is only a stopgap measure. Batteries eventually run down, and when they
    do, the situation is no different from running without a UPS.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 184 Chapter 15 · High Availability and Disaster Recovery


    Battery power can enable administrators to execute a controlled shutdown of the
    equipment, for an extended backup power source, a generator is needed. A generator
    is a device that burns some type of petroleum product to create electricity. Large
    enterprise data centers often have inline generators connected to their power
    source, with a sensor that detects an AC failure and brings the generator online
    automatically. UPSs are still needed, even with a generator, because it can take
    a few minutes for a generator to spin up and start a stable supply. The UPS can
    fill in for those few minutes until the generator is online. Once the power source
    is active and stable, the equipment can keep running as long as the generator''s
    fuel supply holds out.


    # HVAC


    Heating, ventilation and air conditioning (HVAC) are critical services in any
    location where network equipment is running. Data centers can have dozens or hundreds
    of devices in them, all generating large amounts of heat and all highly sensitive
    to temperature and humidity. Most people know that overheating can shorten the
    life of electrical equipment, but excessive cold can lead to moisture condensation
    that is damaging. In the same way, humidity can cause problems if too high (condensation)
    or too low (static). In a well-planned data center, HVAC is an integral part of
    the overall design, with sensor locations and air paths carefully selected to
    provide an ideal operational environment.


    One common design for rows of equipment arranged face-to-face and back-to-back.
    Mounted equipment takes in cool air from the front and exhausts it out the back,
    much hotter. In this design, the face-to-face rows are the cool rows, and the
    back-to-back rows are the hot rows. The ventilation system is then designed with
    intake vents for hot air in the


    HVAC can be more of a problem with server clusters and other intermediate distribution
    frames, which are sometimes located in smaller spaces that are not specifically
    designed for that purpose and may be difficult to heat and cool.


    # Fire Suppression


    In addition to conditioned power sources and the HVAC system, a data center should
    also have some means of fire suppression, both to limit the data center''s vulnerability
    to fire outside and to prevent fire originating within the data center from spreading.
    There are various types of fire suppression systems, the most effective and expensive
    of which floods the data center with inert gas that displaces the oxygen, choking
    out the fire (and any people in the area without breathing equipment).


    The main advantage of an inert gas fire suppression system is that the gas has
    no permanent effect on electrical equipment. These systems are far more expensive
    than those that use water or foam, but the potential cost of replacing water-damaged
    equipment far outweighs the cost of the fire suppression system.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Redundancy and High Availability Concepts


    > EXAM TIP

    Inert gas suppression systems are often incorrectly identified as Halon systems.
    These products no longer use Halon gas, which was found to be toxic, but rather
    inert gas that has the same fire-dampening effect. Candidates for the Network+
    exam should be aware that many Internet sources still use the outdated terminology.


    # REDUNDANCY AND HIGH AVAILABILITY CONCEPTS


    Redundancy is a key concept in the design of network components, as well as in
    the design of the network itself. With many things, redundancy is a trade-off
    between expense and efficiency. Administrators typically choose to install redundant
    components for two reasons: fault tolerance and high availability (HA). Some of
    the concepts involved in designing and building redundant systems are discussed
    next.


    # Active-Active vs. Active-Passive


    As noted earlier in this chapter, redundant systems can typically operate in one
    of two ways, as follows:


    +   **Active-Active** Devices are fully operational at all times, providing fault
    tolerance as well as the opportunity for load balancing.


    +   **Active-Passive** One device is operational at all times, with the other
    left in a standby mode, ready to take over if the active device should fail.


    The active-active and active-passive techniques are common to redundant systems
    at all levels. However, when dealing with redundancy at the enterprise level,
    there are other HA concepts to consider, such as when the enterprise is prepared
    for a major disaster that renders an entire facility unusable.


    # Redundant Data Centers


    The ultimate in data center redundancy is simply to have another data center at
    a different location. For organizations with service requirements that cannot
    tolerate any major downtime, a duplicate data center that can replace the one
    at the company headquarters, it should be damaged or destroyed, is a critical
    requirement.


    Obviously, building an extra redundant data center is a major expense, as is keeping
    it updated and ready for use. To that end, there are three basic configurations
    for redundant data centers. These three types of sites balance the expense of
    construction and'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 186  Chapter 15 · High Availability and Disaster Recovery


    maintenance with the time needed to restore the full functionality of the network
    using the alternative site. The site types are as follows:


    **Cold Site** Not yet a data center at all, a cold site is a leased property with
    all of the building services required for a data center in place, such as power,
    HVAC, and plumbing, but no equipment at all. A cold site is the least expensive
    to construct and maintain but requires the longest time to install, and configure
    all the network equipment.


    **Warm Site** A site falls between hot and cold, in its expense and in the time
    needed to restore functionality. A warm site typically contains all the necessary
    building infrastructure and some or all of the hardware required to rebuild the
    network, so the time to restore functionality is substantially shorter than that
    of a cold and longer than that of a hot site. In some instances, organizations
    shift their equipment to a warm site for use in a backup data center. If a hot
    site''s restore time is measured in minutes, a cold site''s restoration would
    likely take days.


    **Hot Site** A hot is a redundant data center that is fully equipped and ready
    for use, with building infrastructure, service connections, and all networking
    hardware installed and configured. The being online requires only a transfer of
    the latest data. Constructing and maintaining a hot site is typically an enormous
    expense, but in the event of a disaster, the alternative site can be brought online
    in a matter of minutes.


    These cold, warm, and hot site definitions refer to physical data centers, but
    an increasingly popular alternative to these is a cloud site. A cloud is a virtual
    data center created in a cloud network hosted by a service provider. Compared
    to any physical site, a cloud site is far less expensive to build and maintain
    because all the facility and infrastructure costs are absorbed by the service
    provider. Some providers have prepackaged virtual data centers available for this
    purpose.


    # Multiple ISPs and Diverse Paths


    For many organizations, their Internet connection is their life''s blood; they
    cannot function without it, therefore redundancy can be applied to individual
    devices or to the company network, outside service connections can be redundant
    as well.


    One of Internet redundancy (ISP) is to at least two separate connections to the
    Internet service provider, preferably using different routers and carriers. This
    creates diverse paths to the Internet and provides some protection against router
    and carrier failures. However, if the ISP''s owner should fail, then both connections
    will go down. A better solution is to connect the network to multiple ISPs, ideally
    those do not share the same upstream providers. It is even possible to combine
    the two methods by installing multiple connections to each ISP.


    # First-Hop Redundancy Protocols


    As discussed earlier in this chapter, incorporating redundant routers into a network
    requires the use of a specialized protocol called a first-hop redundancy protocol
    (FHRP).'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Redundancy and High Availability Concepts


    FHRP creates a virtualized router with its own IP and MAC addresses. Using those
    addresses, all communication with the redundant physical routers goes through
    the virtual router. Since all of the physical routers are configured to respond
    to the virtual router''s addresses, any one can perform the essential routing
    functions.


    The two most used FHRPs are Virtual Router Redundancy Protocol (VRRP), which is
    based on an open standard, and Hot Standby Router Protocol (HSRP), which is proprietary.
    Both work using the active-passive design, they use different names, with one
    router designated as the primary router (in VRRP) or the active router (in HSRP)
    and the other as a standby or backup router.


    # Other Concepts


    High availability technologies offer involve time measurements for specific events.
    Some of these time measurements are described next.


    # Mean Time To Repair (MTTR)


    Mean time to repair (MTTR) is a technical specification indicating the average
    time—usually in hours—that it takes to repair a specific device, component, or
    service. MTTR values are typically factored into negotiations for service-level
    agreements (SLAs) so that the expected repair or replacement times for specific
    elements do not generate delays in a violation of contract terms.


    # Mean Time Between Failure (MTBF)


    Mean time between failure (MTBF) is a technical specification typically used to
    quantify the reliability of hard drives. Calibrated in hours, the MTBF value specifies
    the average amount of time the disk is expected to operate without a failure.
    Typical MTBF values reach into the millions, however should make clear that they
    are estimated values and not the result of real-time testing.


    # Recovery Time Objective (RTO)


    Recovery time objective (RTO) is essentially a measurement of how much network
    downtime the organization can tolerate before the business process is restored.
    Administrators use this value when designing a network''s fault tolerance and
    availability posture. For example, a low RTO value might mean the difference between
    maintaining a backup data center at a hot site or a warm site.


    # Recovery Point Objective (RPO)


    The recovery point objective (RPO) specifies the maximum length of time allowable
    between a disaster resulting in data loss and the last time the data was backed
    up. Usually measured in hours, the RPO determines how often network backups should
    occur. For example, if the data is backed up once per day, then the RPO could
    conceivably as long as 24 hours. If the organization determines that the RPO must
    be no more than 12 hours, then backups must occur more frequently, at least twice
    a day.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# NETWORK DEVICE BACKUP/RESTORE


    Backups are an essential fault tolerance element of any network, whatever the
    size. The type of backup medium for a network depends on the amount of data that
    needs protection and the amount of time available to perform the backups.


    The traditional medium for backups is magnetic tape, but tape backups are slow,
    and the technology up hard disks is increasingly popular because it is faster
    and provides random access to files without searching through a tape. Cloud backups
    provide an offsite data storage solution, which might or not be practical depending
    on the amount of data involved and the speed of the network''s connection.


    While backups are important, a high availability plan should also include backups
    of device configurations and states. In a disaster recovery situation, servers,
    routers, switches, and other devices must be installed and configured before any
    data is restored. This can be a lengthy process that extends the time needed to
    restore the network to its full functionality.


    The configuration of a device can often be saved as a simple text file in the
    case of a router or switch. Many router and switch include some mechanism for
    backing up the configuration file to a server or removable storage device. Without
    this file, administrators replacing the switch might have to reconfigure each
    port individually.


    In the case of a server, network backups can preserve the data, but replacing
    the server in the event of a disaster by restoring the data from a backup can
    be problematic. The data, as preserved in the backup, expects the server to have
    a specific hardware configuration, which might not be exactly the same in a replacement
    computer. For this reason, many backup products are able to back up the full system
    state, which makes it possible to perform a complete restoration without having
    to reinstall and reconfigure the operating system and the applications.


    # CERMIKE EXAM ESSENTIALS


    +   High availability extends into the data center infrastructure, which must
    include a properly conditioned power supply, HVAC environmental support, and adequate
    fire suppression capabilities.

    Redundant systems can typically operate in an active-active mode, in which both
    devices are always operating and balancing the load, or an active-passive mode,
    in which one device operates while the other remains in a standby state until
    needed.

    Redundant data centers can exist in different states, depending on the organization''s
    operational requirements and budget. Hot sites are ready for use in minutes, warm
    sites in days, and cold sites in weeks or months.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Practice Question 1


    Ralph is deploying a new server in his company''s data center. The server has
