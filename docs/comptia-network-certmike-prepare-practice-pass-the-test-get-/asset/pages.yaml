    # # Hostname


    Hostname is a simple utility found on Windows and Unix/Linux systems that returns
    the name of the current computer, or host. There are no command-line parameters
    or other functions. However, when IT technicians are working with remote systems
    at once, they need a quick reminder of which one they are currently accessing.


    # # Route


    Route is a Windows and Unix/Linux utility that provides access to a system''s
    routing table. All TCP/IP hosts have a routing table, as described in Chapter
    10, "Routing and Bandwidth Management",whether or not they are functioning as
    a router connecting networks. The route print command -n in Windows (or Unix/Linux)
    displays the contents of the system''s routing tables for IP4 and IP6. In addition
    to displaying the routing tables, the route utility can also allow administrators
    to add, modify, and delete routing entries.


    # # Telnet


    Telnet is a communications protocol that allows a user to connect to a remote
    computer and execute commands there. In addition to the protocol itself, Telnet
    also includes a simple CLI with which a user can initiate the connection. Telnet
    is installed by default virtually all Unix/Linux distributions. On Windows workstations,
    a Telnet client is included with the operating system, but users must turn it
    on in the Windows Features dialog box before they can use. Telnet can help troubleshooters
    determine if a system on the network is operating, but it is important to remember
    that telnet transmits over the network is in plain text, including passwords.
    The Secure Shell SSH program is similar to telnet, but it transmits data in encrypted
    format.


    # # Tcpdump


    The tcpdump tool, found only on Unix and Linux platforms, can capture packets
    as they are transmitted and received over a particular network interface and display
    them. With command-line parameters, users can filter the packets to save only
    those with an IP address or port number associated with a specified application
    layer protocol.'
