    For a single predictor variable, the linear regression equation is:


    `y = β[0] + β[1]x + εy`


    where:


    *   `y` is the predicted value.

    *   `β[0]` is the intercept.

    *   `β[1]` is the slope (coefficient) of the predictor variable `x`.

    *   `ε` is the error term.


