    Excel. The menu appears to be associated with a column containing numerical data,
    as indicated by the presence of Number Filters.](images/f0101-01.jpg)


    Responsive design


    In today’s multi-device world, ensure that your visualisations are responsive
    and look great on all screen sizes, from desktops to mobile phones.


    *   Scalable graphics: Use vector graphics or responsive frameworks to ensure
    clarity on any device.


    *   Mobile-friendly layouts: Design with touch interactions in mind for smaller
    screens.


    Accessibility in data visualisation


    *   Colour blindness considerations: Approximately 8 per cent of men and 0.5 per
    cent of women have colour vision deficiency (American Optometric Association,
    2024). To make your visualisations accessible, consider using colour-blind friendly
    palettes and avoid relying solely on colour to convey information.


    *   Colour-blind palettes: There are many tools available in modern applications
    that include palettes designed for accessibility.


    *   Alternative markings: Use patterns or shapes in addition to colour to differentiate
    data points.


    Text and font size


    Ensure that all text in your visualisations is legible. Use clear sans-serif fonts
    and avoid text sizes that are too small.


    *   Minimum font size: Keep font sizes above 12 points for readability.


    *   Contrast: Ensure sufficient contrast between text and background colours.


    Descriptive text and alt text


    Incorporate descriptive text and alternative text (alt text) for users who rely
    on screen readers. This ensures that your visualisations are accessible to individuals
    with visual impairments.


    *   Descriptive labels: Provide context and explanations for charts and graphs.


    Labelling in data visuals


    Use clear and concise labels. Labels are the unsung heroes of data visualisations.
    They provide essential context and help users to understand what they’re looking
    at.


    *   Axis labels: Clearly label axes to indicate what data is being represented.


    *   Data labels: Add labels to data points when necessary for clarity.


    *   Avoiding overlapping labels: Ensure that labels do not overlap or clutter
    the visualisation. This can make the data difficult to interpret and detract from
    the overall design.


    *   Smart placement: Use algorithms to position labels intelligently, avoiding
    overlaps.


    *   Legend use: When space is limited, use a legend to explain colours or symbols.


    Consistency and formatting


    Maintain consistent formatting for labels throughout your visualisations. This
    includes font choice, size and alignment.


    *   Uniform style: Apply a consistent style to all labels for a cohesive look.


    *   Alignment: Align labels neatly to enhance readability and aesthetic appeal.


    BAR CHART


    What is a bar chart?


    Bar charts are one of the most common and versatile types of visualisations, used
    to compare quantities across categories. They display rectangular bars with lengths
    proportional to the values they represent ([Figure 11.3](#22_ch11.xhtml#fig11.3)).


    When to use bar charts


    *   Comparing categories: They are ideal for showing comparisons between discrete
    categories, such as sales across different regions.


    *   Displaying counts: They are useful when illustrating the frequency of different
    values in a data set.


    Remember: Keep your bar chart simple by limiting the number of categories and
    using consistent colour schemes to avoid overwhelming your audience.


    Figure 11.3 Example monthly sales bar chart


    ![Bar graph: Monthly sales, showing Horizontal axis with bars for months January,
    February, March, and April, with sales in dollars reaching heights of 100, 130,
    75, and 50, respectively.](images/f0103-01.jpg)


    HISTOGRAM


    What is a histogram?


    Histograms are similar to bar charts, but are specifically used to display the
    distribution of a continuous data set. They divide data into bins or intervals,
    showing how often data points fall within each interval ([Figure 11.4](#22_ch11.xhtml#fig11.4)).
    The shape of the histogram gives a view of how the data is distributed across
    the range of values.


    When to use histograms


    *   Understanding distribution: They are perfect for visualising the distribution
    of a continuous variable, such as exam scores or ages.


    *   Identifying skewness: They are useful for spotting skewness or outliers in
    your data.


    Remember: Choose an appropriate bin size to ensure your histogram accurately represents
    the data distribution without losing detail.


    Figure 11.4 Example histogram


    ![Histogram: Horizontal axis showing Test scores from 60 to 100. Vertical axis:
    showing Frequency from 0-12. Bars show score distribution:60 - 70, 2; 70-80, 6;
    80-90, 10; 90-100, 8, 100 plus, 4; Text reads No gaps, continuous data.](images/f0104-01.jpg)


    LINE GRAPH


    What is a line graph?


    Line graphs use points connected by lines to represent data points over time.
    They’re perfect for visualising trends in continuous data ([Figure 11.5](#22_ch11.xhtml#fig11.5)).


    Figure 11.5 Example line graph


    ![Line graph: monthly sales performance with Horizontal Months axis, versus vertical
    sales in 1000 dollars. 6 points are plotted randomly on the graph, and a line
    connects each point, showing slopes and trend.](images/f0104-02.jpg)


    When to use line graphs


    *   Tracking changes over time: They are ideal for showing how a variable changes
    over time, such as stock prices or temperature.


    *   Comparing multiple series: They are useful for comparing multiple data series
    on the same graph.


    Remember: Use different line styles or colours to distinguish between multiple
    lines on the same graph, ensuring clarity.


    AREA CHART


    What is an area chart?


    Area charts are like line charts, but the area beneath the line is filled in,
    emphasising the magnitude of change over time. They’re great for visualising cumulative
    data ([Figure 11.6](#22_ch11.xhtml#fig11.6)).


    Figure 11.6 Example area chart


    ![Area chart: Website visitors over time is shown from January to June, for 0
    to 1200. Horizontal axis is labeled as base line. 6 points are plotted randomly
    on the graph, and a line connects each point. The area below the line and above
    the horizontal axis is shaded.](images/f0105-01.jpg)


    When to use area charts


    *   Showing trends over time: They are useful for illustrating trends and comparing
    multiple quantities over time.


    *   Visualising part-to-whole relationships: They are ideal for showing how individual
    parts contribute to a whole over time.


    Remember: Use transparency in overlapping area charts to ensure all data is visible
    and easily interpretable.


    SCATTER PLOT


    What is a scatter plot?


    Scatter plots use dots to represent the values of two numerical variables, allowing
    you to visualise relationships or correlations between them ([Figure 11.7](#22_ch11.xhtml#fig11.7)).


    Figure 11.7 Example scatter plot


    ![Scatter plot: Height in centimeters on x-axis from 150-200, Weight in kilogram
    on y-axis from 40-100, shows positive correlation with an upward trend line.](images/f0106-01.jpg)


    When to use scatter plots


    *   Exploring relationships: They are great for identifying relationships, trends
    or clusters between two variables.


    *   Spotting outliers: They are ideal for detecting outliers that deviate from
    the overall pattern.


    Remember: Consider adding a trendline to your scatter plot to highlight the overall
    direction of the relationship between variables.


    BOX AND WHISKER PLOT


    What is a box and whisker plot?


    Box and whisker plots, or box plots, summarise data by displaying the minimum,
    first quartile, median, third quartile and maximum values. They’re great for visualising
    the spread and skewness of data. They also offer an easy way to interpret potential
    outliers in the data. The size of the box quickly shows the ‘interquartile range’
    ([Figure 11.8](#22_ch11.xhtml#fig11.8)).


    Figure 11.8 Example box and whisker plot'
