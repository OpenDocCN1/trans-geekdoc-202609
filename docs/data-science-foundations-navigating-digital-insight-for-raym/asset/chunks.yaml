- raw: 'Data governance covers both the strategic decisions around how an organisation
    should use and manage data and the operationalisation of that strategy. For mature
    organisations, this will be set out in clear policies with an effective governance
    structure. As a data scientist, you need to adhere to these policies and, if they
    are not in place, the benefits they deliver should be considered. Data governance
    not only ensures the safe use of data but also leads to the efficient use of data.


    Data lifecycle


    The data lifecycle is different from the data analysis lifecycle explored in [Chapter
    3](#14_ch03.xhtml). In this case, it is the lifecycle of the data that is being
    looked at, not the lifecycle of the analysis of data. Unlike man who has seven
    ages, data has four ages.


    Figure 7.4 CRUD, the four ages of data


    ![Flow diagram: Create, record, update and delete.](images/f0046-01.jpg)


    The data lifecycle is often referred to as CRUD ([Figure 7.4](#18_ch07.xhtml#fig7.4)).
    This comes from the operations applied to data in a database: it is created, recorded,
    updated and then deleted. However, it is also useful to data scientists when thinking
    about how we govern our data.


    We create a data set from our sourced data for any data science project. This
    data needs to be stored (recorded), and over the course of the project it will
    be manipulated and updated. Once our project is finished, and the data is of no
    further use, it should be deleted.


    Benefits of data governance


    Data governance can ensure that we take appropriate action at each stage of the
    data lifecycle, resulting in quality data that is used safely and efficiently.


    *   Safety: Data governance can ensure that data is only used for proper purposes.
    This includes restricting access, mandating storage requirements and providing
    for the deletion of data no longer required.


    *   Efficiency: Although data is everywhere, we can forget the costs associated
    with its use. These relate to both the preparation of data and the storage of
    it. Good data governance can promote the efficient use of data through the reuse
    of data and deleting data no longer needed. This reduces both preparation and
    storage costs.


    DATA QUALITY


    You might recall our project looking at phone faults. How would you feel if the
    project used data from five years ago in the analysis? What about if the data
    from the field sales force was missing? What if someone just had some data that
    they thought related to the organisation’s phones? It is likely in all these cases
    that you would be sceptical, to say the least, about the findings of the project.


    The quality of a data source can be seen through three lenses ([Figure 7.5](#18_ch07.xhtml#fig7.5)):


    Figure 7.5 The three lenses of data quality


    ![Pyramid diagram: Data quality at the center, surrounded by Accuracy, at the
    top, Latency on the left, and Lineage on the right.](images/f0047-01.jpg)


    *   Accuracy: Ask the questions: is the data set complete and has the data in
    it been properly recorded? To answer these questions, you really need to understand
    the domain context of the data.


    *   Latency: How old is the data set? Is it still relevant? This can vary with
    context: if you are working with census data, it might be valid for it to be years
    old; if you are looking at financial trading data, minutes or even seconds can
    count.


    *   Lineage: Do you know where the data came from? Can it be trusted? Many people
    trace their family tree to understand their origin and roots. Data lineage is
    about understanding the origin of the data and any changes that have been made
    to it over time. For example, if you took a data set on population from the ONS,
    you would know where it came from and its quality. If the ONS data was taken from
    your organisation’s data warehouse would you be aware of any changes that had
    been made to it? Is there a possibility records have been removed or amended that
    could have an adverse impact on your project?


    Good data governance can help in answering these questions for internal data.
    For external data, open data helps us to address these questions. For other sources,
    do your homework: ask commercial suppliers the questions.


    In considering the quality of the data, it is also important to ask the questions:
    does this data relate to my problem, and will it help explore the hypothesis?
    It might be the most up-to-date, accurate and timely data set, but if it isn’t
    relevant, it hasn’t value.


    METADATA


    To put it simply, metadata is data about data. It can help to govern the data
    we use and, where used effectively, help us to identify good sources of data.
    Going back to our phone analysis, the metadata associated with this could include
    information on when the data was created, last updated and its storage needs (size).
    It could also provide information on the content of the data (e.g. phone usage
    data) for a specified date range and whether it is classified as confidential.
    If we make the metadata accessible to people, then they can understand what data
    is available and its quality.


    As you can see, thought needs to be given to the source of data we use in data
    science projects. There is a plethora of data, and the challenge is finding the
    right data set to use in a model. In some instances, we will need to be creative
    in how we source our data. We also need to recognise the effort that sourcing
    data requires, even if we don’t collect the data ourselves. You will recall the
    iterative nature of the data analysis lifecycle, and sourcing the data can lead
    to both backward iterations to discovery and forward iterations to preparation.


    PRACTICAL TIPS


    *   Remember: garbage in, garbage out.


    *   Consider if there are different sources of data, and their relative merits.


    *   Consider whether the data has the right properties to test the hypothesis.


    *   Consider whether the quality of the data is good enough.


    *   Consider how you will export, transform and load the data.


    *   Make use of and follow internal data governance.


    *   Check it is ethical and lawful to use the data.


    8 PREPARATION


    Preparation conjures up the image of a chef preparing a meal. For you, this might
    be the clinical precision in which they compose and combine the ingredients in
    an orderly and controlled manner, or it could be a more chaotic approach as the
    ingredients are thrown together in a creative maelstrom. Data preparation is not
    dissimilar. It is also referred to as data transformation, manipulation, conditioning
    and wrangling – the latter really emphasising the challenge in taming the data
    ready for analysis.


    It is important that the data sets and the methods we use to build a model for
    a project are well suited to each other. If they are not aligned, then the method
    will fail or deliver a result with limited value. Even if the data sets and methods
    are well suited, the results are likely to be limited if the data is low quality.
    In preparing the data, we need to understand both the form and the quality of
    the data. We can then consider the risks and issues associated with using it and
    take steps to mitigate them. Spending time up front on this pays dividends. The
    allure of developing your models may be strong, but doing this too early, with
    sub-optimal data, will lead to longer timescales or worse: low-quality outcomes
    that (dangerously) might not be recognised as such.


    In this chapter we will take a generic view of the things you might need to consider
    in preparing data. These will vary, depending on your data and the methods you
    are looking to use, and should be carefully considered in relation to each of
    them.


    FORM


    They say form follows function in design, so an object or building shape should
    follow its function. Most pens are round or hexagonal. Why? They are easier to
    grip.'
  fmt: '

