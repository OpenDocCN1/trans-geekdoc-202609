- raw: '*   Data engineer: They will transform the data and make it available in standard
    formats and to a certain quality. This is often the extraction of raw data from
    its sources and then transforming and loading it into a warehouse for analysis.
    However, you will still need to prepare the data to ensure that it meets the needs
    of the project.


    *   Data architect: They define the environment (both technical and non-technical)
    in which the project takes place. For example, they might determine where the
    data can be stored to ensure it is secure. The creation of the environment might
    be undertaken by a technician.


    *   Data compliance officer: Compliance ensure that the data is used in line with
    regulations and the organisation’s policies. This can be in the form of setting
    policies and operating procedures to ensure compliance.


    *   Project manager: They facilitate the activity required to deliver the project.
    Collaboration between the stakeholders is key to the success of most projects,
    and the project manager can play an important role creating an environment that
    encourages and supports this.


    *   Data scientist: They identify the data and methods required, build and analyse
    the models created and communicate the findings.


    In putting the team together, it is worth considering who will provide a check
    and challenge on the models used. Having this process reduces the risk of models
    being used inappropriately and invalid conclusions drawn.


    Many organisations have the role of data analyst. A data analyst might be seen
    as focusing on the descriptive analytics (reporting what has happened), although
    many data analysts take the role of the data scientist in projects.


    We should not forget that data science projects can take place as part of a wider
    programme of work and that other roles will be involved in delivering that programme.
    For example, change management and IT/development operations (DevOps) might be
    involved in operationalising the findings of the data science project.


    UNDERSTANDING THE DOMAIN


    It is said that nothing exists in a vacuum, and that is true of data science.
    The problem being looked at has a real-world context, so it is important to understand
    that context to properly understand the problem – this is often referred to as
    the domain context of the problem. The domain context helps to determine the scope
    and objective of a project. It provides a context in which to understand and interpret
    the data used and models created. It can also influence how the outcomes of the
    project should be communicated, as it gives an indication of the audience. The
    PESTLE framework discussed in [Chapter 2](#13_ch02.xhtml) is a useful tool for
    understanding the external domain of a project.


    Let’s consider how the domain context for phone faults could differ if the organisation
    is an emergency response organisation, phones are used in extreme conditions and
    the reliability of phones could be a matter and life or death. This domain is
    very different from many other organisations that use phones. Likewise, the way
    the results will be communicated is likely to change if the managing director
    initiated the request rather than the phone manager. The managing director will
    have different drivers and knowledge from that of the phone manager.


    RESOURCES


    We have already talked about the people needed to deliver a project. Other resources
    that are required include the tools and infrastructure needed to undertake the
    analysis and, of course, the data itself.


    In many instances, you will be constrained in relation to the tools and infrastructure
    available to you – you will need to work within the existing data architecture
    of your organisation. However, it is beneficial to consider what is available
    and how well that meets the needs of the project. This might highlight challenges
    that will need to be addressed by the project. For example, you might need to
    resolve issues of data storage and computational power, or the tools might not
    provide the capabilities needed to easily prepare the data, or the methods they
    support might be limited.


    It is also essential to understand the potential sources of data. This might throw
    up issues as to the availability and quality of data. It could also uncover issues
    with the right to use that data, or technical challenges of accessing or combining
    the data. At this point, initial consideration can be given to the models you
    might use in the project.


    PROBLEM DEFINITION


    When embarking on any project, it is always important to understand the scope
    and objective of the undertaking. Agreeing and sharing these provides a common
    understanding and an anchor point for decisions. With data science projects, this
    is often done through defining the problem – this is also referred to as framing
    the problem.


    In framing the problem, it is important to understand the context of the problem
    and why it is an important problem. This often requires input from several different
    stakeholders, as different people might have different perspectives.


    Let’s consider a music streaming company, we might have a problem with subscriptions.
    However, stakeholders might have different perceptions of that problem: the sales
    director might see it as one of attracting new subscribers, whereas the finance
    director could see it as one of retention because people don’t use the service.
    Framing the problem helps to resolve these differences.


    In this instance, what might the problem look like if the finance director prevails?
    The idea might be that the more a subscriber uses our services the less likely
    they are to cancel their subscription. Therefore, if we make recommendations of
    music that subscribers enjoy, they will listen more and retain their subscription.
    Recommendations could be based on artist or recording label. In this instance,
    there are several questions to explore:


    *   Does the amount of music streamed affect whether someone retains or cancels
    the service?


    *   Does recommending music lead to people listening more?


    *   If someone likes an artist, which other artists will they like?


    It is also helpful to consider the point at which the project will be complete.
    For our music streaming service, it could be when we know what factors increase
    listening and hence retention. But what if it can’t be demonstrated at what point
    you should stop working on the project? This could be defined in several ways,
    for example time-boxing the activity or setting resource limits. Time-boxing is
    where specific time is assigned to an activity, and that activity ends at the
    end of that time. Thinking about when the project should end before it starts
    is helpful to stop projects getting carried away and going past the point where
    they have no substantive value.


    DEVELOPING THE HYPOTHESIS


    Based on the problem, hypotheses can be developed. A hypothesis is a theory that
    explains a situation that has not been proven, and it provides starting points
    for investigating the problem. Exploring hypotheses allows the problem to be better
    understood, and decisions to be made in relation to it. The hypotheses are tested
    through the creation of models, created from methods and data. These models allow
    the hypotheses to be investigated, providing insight into the problem.


    If we look at our subscriber retention problem, the hypothesis might be simple:
    people who stream more are more likely to retain their subscription. However,
    this problem is quite general; how much streaming are we talking about, and what
    time periods are we considering?


    Our hypothesis could be:


    *   Streaming more than eight hours of music in a month affects whether a subscriber
    will cancel their subscription in the following month.


    If this is proved, then further a hypothesis could be explored delving further
    into the problem. For example:


    *   The greater the number of music recommendations made in a month, the longer
    a subscriber listens to music.


    And then'
