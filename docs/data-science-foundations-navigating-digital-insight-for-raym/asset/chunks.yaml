- raw: 'Plotting a point involves identifying its x coordinate and y coordinate and
    locating its position on the plane. For example, the point (3, 4) is three units
    to the right of the origin and four units up.


    Steps to plot a point:


    1.  Locate the x coordinate: Start at the origin and move horizontally to the
    x coordinate. Positive x values move right; negative x values move left.


    2.  Locate the y coordinate: From the x coordinate position, move vertically to
    the y coordinate. Positive y values move up; negative y values move down.


    3.  Mark the point: Place a dot at the intersection of the horizontal and vertical
    positions. Label the point with its coordinates for clarity.


    Measuring distance between points


    The distance between two points on the Cartesian plane can be calculated using
    the distance formula, derived from the Pythagorean theorem. This formula provides
    a straightforward way to find the straight-line distance (or Euclidean distance)
    between two points.


    Distance formula


    For two points, (x[1], y[1] ) and (x[2], y[2]), the distance d between them is
    given by:


    ![Formula: Distance d equals square root of x 2 minus x 1 squared, plus, y 2 minus
    y 1 squared.](images/f0063-01.jpg)


    Example: calculating distance


    Let’s calculate the distance between the points A(1, 2) and B(4, 6).


    Identify coordinates:


    x[1] = 1, y[1] = 2


    x[2] = 4, y[2] = 6


    Apply the formula:


    ![Equations:6 lines of equations are given. d equals square root of x 2 minus
    x 1 squared, plus, y 2 minus y 1 squared. Values substituted as 4, 1, 6, and 2
    and calculated to get d equals 5.](images/f0064-01.jpg)


    Therefore, the distance between points A(1, 2) and B(4, 6) is five units.


    In [Figure 9.2](#20_ch09.xhtml#fig9.2), the line connecting points A and B represent
    the distance we calculated using the distance formula.


    Figure 9.2 Visualising distance calculation


    ![Graph and Equation: First quadrant plane showing a triangle with points A and
    B at 1 comma 2, 4 comma 6. Distance from A to third point is 4 minus 1 equals
    3. B from another point is 6 minus 2 equals 4. Slope d equals 5. Equation steps
    on right side shows calculations to solve d equals 5.](images/f0064-02.jpg)


    CONCLUSION


    In summary, measures of spread and probability are essential tools in the data
    scientist’s toolkit. They help us to understand variability and uncertainty, allowing
    us to make informed decisions based on data. As you continue your journey in data
    science, these concepts will serve as the building blocks for more advanced analyses,
    guiding you in uncovering insights and making predictions with confidence.


    The Cartesian coordinate system provides a powerful and intuitive way to visualise
    and analyse spatial relationships. By understanding how to plot points and calculate
    distances, you can solve a wide range of mathematical and real-world problems.
    This foundational knowledge will serve you well in your journey through data science
