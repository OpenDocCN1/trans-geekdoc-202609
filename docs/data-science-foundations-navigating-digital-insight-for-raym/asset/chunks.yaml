    ### 3. 决策

    根据包括显著性水平和检验类型在多种因素计算临界值。然后将其与检验统计量进行比较，以确定应该拒绝还是接受零假设。


    #### 业务示例

    某制药公司正在测试新药是否比现有药物更有效地降低血压。假设检验确定观察到的差异是否具有统计学显著性，从而指导产品开发决策。


    ### 如何在不同模型之间选择


    在进行数据科学项目时，你做出的最重要的决策之一是选择正确的方法来分析数据。有许多技术可用——聚类、分类、相关性、回归、时间序列和关联——很容易感到无从从，但别担心。每种方法都有特定的用途，并且最适合某些类型的问题。通过理解这些技术的基础知识，你可以自信地决定使用哪一种。


    让我们从建模技巧的本质区别开始。在聚类、分类、相关性、回归、时间序列和关联之间进行选择，不仅取决于你使用的数据，还取决于你想要什么类型的答案。


    #### 相关性：理解变量之间的关系

    ![图: 相关性示例，显示一条上升的直线大致触及所有点，类似于阶梯。](img/f0072-01.jpg)


    **它是什么？** 相关性衡量两个变量之间关系的强度和方向。它告诉你两个变量是同向移动（正相关）、反向移动（负相关）还是完全没有关系。


    **为什么选择相关性？**

    相关性是探索变量之间关系的理想选择。然而，请记住，相关性并不意味着因果关系——仅仅因为两个事物相关并不意味着一个导致了另一个。


    #### 回归：预测数值

    ![图: 图表的回归模型，显示数据点的散点图，以及一条穿过它们中间并稳步上升的直线。](img/f0073-01.jpg)


    **它是什么？** 回归是一种根据一个或多个输入变量来预测连续数值的方法。它就像通过你的数据绘制一条最佳拟合线来预测。当你的目标是预测一个数字或理解变量之间的关系时，请使用回归。


    **为什么选择回归？**

    当你的输出是一个连续数字且你想量化变量之间的关系时，回归是正确的选择。


    #### 时间序列：分析随时间变化的数据

    ![柱状图: 柱状模型带有触及柱状峰值的钟形曲线。](img/f0073-02.jpg)


    **它是什么？** 时间序列分析关注随时间收集的数据，例如每日股价、每月销售额或每小时温度读数。它被用于识别趋势和季节性并进行预测。有几种算法可以使用，但当你的数据具有时间依赖性且你想预测未来值时，时间序列方法之一将是最好的方法。


    **为什么选择时间序列？**

    时间序列对于理解随时间变化的趋势至关重要的问题非常完美。它对于根据过去数据预测未来结果特别有用。


    #### 分类：将数据划分到类别中

    ![图: 图表上散布着不同类型的数据点以表示分类。](img/f0073-03.jpg)


    **它是什么？** 分类是一种监督学习技术，你将数据点分配给预定义的类别或类。这就像教模型根据带有标记的示例来识别模式。当你有一个具有类别或标记结果的数据集，并且你想预测新数据点属于哪个类别时，请使用分类。


    **为什么选择分类？**

    当你需要做出决策（是/否，A/B/C）或将事物分成不同的组时，分类是你的首选方法。


    #### 聚类：将相似的数据聚合

    ![图: 在第一象限坐标系中显示三个不同的簇。](img/f0073-04.jpg)


    **它是什么？** 当你想要在数据中寻找自然分组或细分时，使用聚类。你在这里并不是为了做预测；相反，你想探索你的数据是如何组织的。当你对数据没有预定义的标签或类别时，它变得特别有用。


    **为什么选择聚类？**

    当你试图揭示数据中的模式或隐藏结构时，聚类是探索性分析的完美选择。


    #### 关联：发现项目之间的关系

    ![图像: 显示一个装满物品的篮子以表示关联。](img/f0074-01.jpg)


    **它是什么？** 关联分析识别数据中的规则或模式，通常用于寻找事务数据中项目之间的关系。它是零售公司所使用的市场篮分析背后的技术。


    **为什么选择关联？**

    当你试图揭示数据数据中的模式或隐藏结构时，关联分析是完美的。


    ### 统计模型：相关性


    #### 理解相关性

    当你想理解某件事是否取决于另一件事时——例如，由于温度发生变化——相关性可以为你提供视角。


    **输出**

    相关性量化变量之间线性关系的强度和方向，表示为 -1 到 +1 之间的相关系数。


    * 正相关：两个变量同向移动。随着一个上升，另一个也上升。

    * 负相关：变量反向移动。随着温度下降，气体消耗增加。

    * 零相关：不存在线性关系。


    **公式**

    皮尔逊相关系数 `r` 计算如下：


    ```

    r = nxy - Σxy / sqrt([nx² - (Σx)²][ny² - (Σy)²])

    ```

    (images/f0074-02.jpg) 其中 `x[i]` 和 `y[i]` 分别是变量 `x` 和 `y` 的数据点。


    ![图像](img/f0075-01.jpg)看起来如何？相关性是讨论数据和统计时过度使用的术语之一。记者经常利用两个数据集的相关性来构建故事，只要这有助于证明某事的发生是某人的错。


    让我们尝试一个例子，观察花在计算机游戏上的时间如何影响成绩。

    我们可以通过询问学校成绩并询问他们每周玩多少小时游戏来收集数据。数据可能如下：


    | 学生 | 成绩 | 玩游戏小时 |

    | --- | --- | --- |

    | A | 45 | 5 |

    | B | 95 | 1.5 |

    | C | 63 | 3.5 |

    | D | 28 | 7.5 |

    | E | 78 | 2.5 |

    | F | 56 | 4 |

    | G | 64 | 4 |


    如果我们绘制数据，图表将为我们提供一个非常清晰的趋势，如图 10.2 所示。


    #### 图 10.2 游戏时间趋势图

    图 10.2 游戏时间趋势图

    ![图: 第一象限平面，横轴显示游戏时间从 0 到 8，纵轴显示考试成绩从 0 到 100。点显示在 1.5, 90；2.5, 78；3.5, 63；5,
    56；4, 64；5, 45，以及 7.5, 28。。](img/f0075-02.jpg)


