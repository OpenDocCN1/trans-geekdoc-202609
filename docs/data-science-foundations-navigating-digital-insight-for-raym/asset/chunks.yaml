  trans: "\nDev 的目标是成为一名酿酒师。尽管他热爱旅行和吸收文化，但他并不打算为此搬到智利甚至法国。他希望在离萨里郡（Surrey）家附近的精良的英国葡萄酒。实现这一梦想的一步是加入\
    \ `SMARTabg`，这是一家软件公司，其产品组合包含了金融交易软件。\n\n对于涉及金融交易的小型组织，获取、存储和解释财务数据的成本是非常昂贵的。Dev\
    \ 意识到，如果有人为他们完成这些工作，根据市场波动为这些组织提供交易信号，他们将受益。\n\n许多此类交易信号是统计模型，例如比较不同时期的移动平均价格，以确定是否存在上升或下降趋势。多个信号组合可以创建一个战略信号，当此类战略信号被用于自动化交易时，它们可以为规范性分析提供基础。在这里，概率发挥了作用：如果五个信号中都指示市场上涨，那么市场上涨的概率要高于三个信号指示上涨的情况。\n\
    \nDev 面临的最大挑战之一是确保他用于开发这些信号的数据质量。财务数据来源非常多；然而，每个来源的质量都不同，且相关的成本也不同。质量越高，所需的数据清洗越少，但成本越高。为了确定不同数据源的质量，Dev\
    \ 取了样本并运行了各种测试，包括识别并调查离群值。这包括查看价格波动的标准差。这种抽样一直持续到上线平台，以检查并维护数据质量。\n\n一旦数据到位，就构建了约\
    \ 200 个模型来启用交易信号，其中许多模型在金融交易领域是常见的。数据的存储方式对模型开发至关重要。对于这个项目，Dev 使用了关系型数据库和 NoSQL\
    \ 数据库（后者存储非结构化数据）。其中一个数据集 (`NoSQL`) 用于社交背景，因为领先人物和机构（如英格兰银行）的评论影响金融市场，而自然语言处理可以帮助解释这些内容。这些注释的文本是非结构化数据，因此不符合关系型数据结构。\n\
    \n在职业生涯中，Dev 通过工作和资质投入了精力建立自己的领域知识。这在项目中帮助了他，既有助于确定数据质量，有助于识别对他们支持的交易员最有用的模型。尽管他强调了领域知识的重要性，但他热于指出，在某些情况下，没有任何知识反而是好事。这使得人们能够不受既有理解和偏见的干扰，专注于模式检测。在他看来，数据科学是具有许多不同背景的人都可以参与的领域。\n\
    \n## 16 结论\n\n本书旨在向你介绍数据科学的世界。我们讨论了数据科学中使用的常用技术和模型，更重要的是，我们描述了如何在组织内部让数据科学取得成功。你有许多道路可以供你进一步探索，我们的目标是为你可以选择的选项提供明灯。\n\
    \n我们探索了数据科学的应用及其对社会的潜在影响。我们深入研究了技术方面，从数据收集和准备到模型构建和评估。我们还触及了较软的技能，例如沟通和利益相关者管理。\n\
    \n## 数据科学的力量\n\n数据科学不仅仅是工具和技术的集合。它是一种强大的方法，可用于解决复杂问题、发现隐藏的洞察并驱动创新。无论你是业务分析师、数据科学家，还是仅仅一个对周围世界好奇的人，数据科学都能帮助你做出更好的决策并实现你的目标。\n\
    \n### 人的因素\n\n虽然数据科学是一个技术领域，但重要的是记住，它最终是由人驱动的。任何数据科学项目的成功都取决于参与人员的技能和创造力。从数据工程师到机器学习专家，每个角色在过程中都至关重要。\n\
    \n数据科学已成为一种变革力量，彻底改变了行业并重塑了社会。通过利用数据的巨大力量，组织可以发现价值的洞察、做出明智的决策并促进创新。\n\n### 数据科学的基础\n\
    \n数据科学的核心建立在对要解决问题的理解、对可用数据的了解以及对如何使用所展示答案的欣赏之上。从事数据科学工作可以走向许多道路，并在使用统计学或机器学习算法与数据工程/编程技能之间取得平衡。这些元素构成了基础，允许数据科学家从大型复杂的数据集中提取有意义的洞察。他们的沟通技能让他们能够向利益相关者分享这些内容。\n\
    \n### 统计与机器学习算法\n\n统计学为分析数据提供了数学框架。假设检验、概率分布和推断统计等技术允许数据科学家理解数据模式并得出结论。机器学习则提供了创建可以从数据中“学习”的模型的工具。这些算法实现了预测、分类、模式识别和决策的能力。\n\
    \n### 数据工程/编程技能\n\n本书的大部分内容侧重于数据科学在组织中使用，描述了某些建模方法。准备、存储、转换和提取是可能涉及数据库以及一系列编程语言的技能。它们允许数据科学家高效地操纵数据、构建模型并实施机器学习算法。这些技能共同赋予了数据科学家将原始数据转化为可操作洞察的能力，从而驱动无数领域的创新。\n\
    \n当算法从数据中学习以做出预测或决策时，应确保每个人都理解所使用的数据和算法。`ML` 的主要类别包括：\n\n- **监督学习**：这使用标记数据来训练模型。\n\
    \    - 示例：\n    - 用于预测房价的`线性回归`。\n    - 用于预测客户是否会流失的`逻辑回归`。\n    - 用于分类任务的`决策树`和支持向量机。\n\
    - **无监督学习**：这使用未标记数据来发现模式。\n    - 示例是`聚类`（例如将客户分分组）。\n- **强化学习**：这涉及训练代理与环境交互并最大化奖励。\n\
    \    - 此类的应用是`机器人`、游戏玩（例如 `AlphaGo`）和`自动驾驶汽车`。\n\n本书的一个主要目标是介绍如何在现实生活中实施数据科学项目。世界上所有复杂的统计模型本身并不能产生巨大的成果。它们需要在业务中被有效地使用。\n\
    \n回顾一下，关键步骤始终应涵盖：\n\n**第一步：识别业务问题 (发现)**\n\n一个成功的数据科学项目对要解决的问题有清晰的定义。确保该问题是具体的、可衡量的并且与你的业务目标保持一致。\n\
    \n"
