- raw: 'Elon Musk raised concern at his private jet’s movements being shared on social
    media, as it would make it easier for someone to attack his family (Halpert and
    Moloney, 2022). Here, he was concerned about harm, but there is also a question
    of someone’s right to control the use of data that relates to them. Do you want
    your data used to identify goods and services you might be interested in? Are
    you happy for it to be used in medical research? How about using it to promote
    political adverts to influence how you vote? Here, we are considering the ethical
    question, not the legal one. The fact that a box has been ticked giving consent
    doesn’t mean someone would be happy for their data to be used that way. The use
    to which the data is to be put might not have been envisaged by them at the time
    they ticked the box. They might also have had little choice but to consent to
    access goods, services or employment. As we will see, ethics and lawfulness overlap.


    Having read this section on ethics, you might think it has provided no answers
    and just raised questions. You would be right, and that is the point of it – to
    think before launching into a data science project and during the project. Think
    about the data used, think about the people involved and think about what might
    be done with the insight generated.


    LEGISLATION AND REGULATION


    Ethics is subjective; helpfully, legislation and regulation are a little more
    objective. These are limits on the use of data that society has set as a standard,
    that have legal consequences if not complied with. Different countries take different
    approaches to setting these standards. Some will have overarching data protection
    laws, such as the UK, others regulate by specific sector, for example the USA.
    We will focus on the UK’s overarching legislation: the Data Protection Act 2018.


    Data Protection Act


    The Data Protection Act 2018 gave effect to the European General Data Protection
    Regulation (GDPR). Rather than set out rules as to how data can be used, it has
    a set of principles that should be followed. The advantage of principles is that
    they can be applied to different situations. Rules tend to address specific scenarios,
    making them complex and inflexible. This does, however, mean the principles require
    interpretation.


    GDPR principles


    This is a brief introduction to the GDPR principles, and we would encourage you
    to explore this subject further to better understand the detail and nuances. You
    will find that these align with many of the ethical considerations we have discussed.
    You should remember that these principles apply to living persons and not to other
    entities, such as companies or those who are dead.


    Lawful, fair and transparent


    *   Lawful: Data should only be processed where lawful under the act and where
    it doesn’t breach other laws such as the Equality Act. Processing is only lawful
    under the act where there is genuine consent or a contractual need, there is a
    legal obligation or public interest, or where there is a legitimate interest in
    processing it and this is not overridden by the individual’s interest. Legitimate
    interest provides a wide basis for the use of data.


    *   Fair: However, the use must also be fair, so the data should be used in line
    with the person’s expectations and should not have an undue adverse effect on
    them.


    *   Transparent: The individual also needs to be informed of the purpose for which
    their data will be processed and the consequences of that processing.


    Limited purpose


    Data should be collected for specific purposes and not processed in a manner incompatible
    with those purposes. However, there are circumstances where the purpose can be
    expanded, including where the new purpose is compatible with the old purpose.


    Data minimisation


    Data should be limited to that necessary for the purpose for which it is being
    processed. If a data item is not needed to achieve the purpose, it should not
    be used.


    Accuracy


    Data should not be inaccurate or misleading.


    Storage limitation


    Data should only be kept for as long as is necessary for the purpose for which
    the data is being processed. However, this doesn’t apply where the person can
    no longer be identified within the data.


    Integrity and confidentiality


    Data should be kept safely and securely. This means protecting it against accidents
    and malicious acts.


    Accountability


    Organisations need to be able to show compliance with the above principles. This
    accountability is to regulators, to the subjects of the data and to the courts.


    Special category data


    Special category data is a subset of personal data that is regarded as more sensitive.
    It includes data relating to:


    *   race and ethnicity;


    *   political opinions, religious or philosophical beliefs and trade union membership;


    *   genetics;


    *   biometrics;


    *   health;


    *   sex life and sexual orientation.


    For special category data, specific conditions are set out for lawful processing
    that could be summarised as specific consent being given or a societal interest
    in the data being processed.


    The ICO


    The Information Commissioner’s Office (ICO) can investigate and take enforcement
    action for breaches of GDPR. This isn’t just against big companies; a school was
    reprimanded in relation to its implementation of facial recognition technology
    for cashless catering (ICO, n.d.).


    INTERNAL POLICIES


    It is good practice for organisations to have policies in place relating to the
    use of data. These policies allow the application of data protection principles,
    and in some cases ethical considerations, to be set out within the organisation.
    For example, the GDPR principles don’t explicitly set out how long data can be
    retained; a policy can clearly set this out, taking account of the circumstances.


    OTHER GOVERNANCE


    You may find that there are other restrictions on the use of data that apply to
    the specific sector in which you work. This might be put in place by a regulatory
    or professional body. An example of this is the Caldicott Principles that apply
    to health and social care. BCS, The Chartered Institute for IT also has a professional
    code of conduct for members. This has four key principles:


    *   You make IT for everyone.


    *   Show what you know, learn what you don’t.


    *   Respect the organisation or individual you work for.


    *   Keep IT real, keep IT professional, pass IT on.


    Within the code, the first duty relates to public interest and includes having
    ‘due regard for … privacy, security and wellbeing of others’.


    COMMERCIAL CONSTRAINTS


    So far, much of our consideration on limiting the use of data has focused on individuals
    and their personal data. However, restrictions on the use of data can be contained
    in contracts. For example, if a contract is agreed to outsource the provision
    of a contact centre, the rights to use the data generated in the operation of
    the contact centre are likely to be set out. This might provide that the data
    can be used to improve the performance of the contact centre, but not shared with
    other customers of the contact centre. Likewise, if third-party data is acquired
    for use in the contact centre, the licence to use that data might restrict the
    purpose and time for which it can be used, for example the right to use the details
    to email customers over a three-month period.


    INTELLECTUAL PROPERTY


    It is important to remember that intellectual property exist in some artefacts
    that can be represented as data, for example copyright in literary works, music
    and images. When working with such data, it is important to understand these rights
    and whether the data can be used in the way you intend.


    RISK MITIGATION STRATEGIES


    There are several strategies that can be adopted to reduce the risk of unethical
    or unlawful use of data.


    Follow policy'
