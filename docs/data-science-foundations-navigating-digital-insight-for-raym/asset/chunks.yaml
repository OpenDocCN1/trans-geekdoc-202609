    ![箱线图：箱体从 22 到 84，中位数位于 42（均值用 ''X'' 标记）。须线延伸至最小值 14 和最大值 98。](img/f0107-01.jpg)


    # 何时使用箱线图


    *   **比较分布**：它们对于比较不同类别之间的数据分布有用。

    *   **识别离群值**：它们是发现数据集中离群值的理想工具。


    **记住**：当你有多个数据集需要进行比较时，箱线图特别有帮助，因为它们为每个分布提供了清晰的总结。


    # 热力图


    ## 什么是热图？


    热图使用颜色在矩阵格式中表示数据值，使其易于视觉化复杂的数据关系。你可以轻松地看到数据中的“热点”在哪里（图 11.9）。


    ## 何时使用热图


    *   **可视化相关性**：它们非常适合显示相关矩阵或多个变量之间的关系。

    *   **突出模式**：它们有助于发现大型数据集中的模式、趋势和异常。


    ### 图 11.9 示例热图


    ![热力图：行显示年龄 26-50 岁。列显示男性和女性。渐变强度表示每日收入，渐变范围从浅/低到深/高。](img/f0108-01.jpg)


    **记住**：选择一种能清晰区分低值和高值的颜色渐变以增强可解释性。


    # 须尾图


    ## 什么是须尾图？


    须尾图以半表格的形式显示定量数据，在保留单个数据点的同时，将它们组织成“干”（stem）和“叶”（leaf）。它们对于小型数据集特别有用。干是数据值的第一部分，叶显示数值的单个末尾部分，例如在图
    11.10 中，`Stem 1` 和 `Leaf 0` 显示数据点 `10`，`Stem 8` 和 `Leaf 7` 表示数据点 `87`（我们可以快速看到有四个
    `87` 的数据点）。


    ## 何时使用须尾图


    *   **探索小型数据集**：它们是在保留原始数据值的同时视觉化小型数据集的理想工具。

    *   **理解分布**：它们对于快速视觉化数据的形状和分布有用。


    ### 图 11.10 示例须尾图


    ![须尾图：干 1-9，叶显示数据分布。干 1: 0, 0, 0, 2。干 2: 3, 3, 3, 3。干 3: 4, 4, 4。干 4: 5, 5, 5。干
    5: 6, 6, 6, 6。干 8: 7, 7, 7。干 9: 8, 8。](img/f0109-01.jpg)


    **记住**：须尾图常用于教学，展示数据和分布。


    # 组合图


    使用多个图表（如散点图和折线图）可以提供更丰富的洞察。


    ## 为什么要组合图表？


    散点图和折线图结合可以传达数据背后更完整的故事。


    ### 讲述完整的故事


    虽然单一图表可以传达数据，但将它们结合可以提供更全面的视角（图 11.9）。


    *   **散点图**：它们通过显示数据点来展示两个变量之间的相关性。

    *   **折线图**：它们强调了随时间变化的趋势。


    ### 组合图的示例


    ![散点图和折线图：横轴显示年龄，纵轴显示收入。折线显示了趋势。](img/f0110-01.jpg)


