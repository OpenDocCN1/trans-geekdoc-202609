    ![](img/cover.jpg)


    ![封面：数据科学基础 导航数字洞察，由 Stephen Mariadas 和 Ian Huke 编写，展示了一艘船在冰雪中航行的场景。](img/cover.jpg)


    一本关于数据科学的卓越指南。清晰且具有实用的视角地涵盖了整个生命周期——对于初学者来说是完美之，对所有人来说都是极佳的参考书。


    > **Chris Weston**，NashTech 技术顾问


    《数据科学基础》（Data Science Foundations）是一本完美的入门指南，通过真实案例对核心概念提供了清晰、引人入胜的概述。任何渴望深入数据科学领域的人的读读。


    > **Jake Wilson 博士**，GHGSat Inc. 数据科学家


    这是一个非常有时代意义的话题，影响着每个人的生活。一本关于其基础的书可能会非常枯燥，但作者在分享概念、原则、方法，以及通过真实的案例和场景使之生动起来之间取得了完美的平衡。我的公司正在使用
    `IoT`（物联网）为客户交付多个项目，这些项目广泛使用数据科学来提供服务；更广泛地说，我们的团队参与了许多涉及数据科学方面（无论是显性的还是隐性的）的项目。这本书绝对会由我手交给那些即将开始新项目的团队成员。强烈推荐。


    > **John Opsblum**，Illuminet Solutions 创始人兼首席咨询官


    这正是我需要的书！它对数据科学提供了卓越、深思且简洁的基础知识，充满了易于理解的案例、实用的技巧以及实现成功数据科学项目的全面框架。关于数据科学、`machine
    learning` 与 `AI` 之间联系的解释，以及对不同数据科学模型的概述，对于增强我的理解具有无价价值。这本书将成为我信赖的伴侣，我确定我会反复翻阅它。


    > **Paul Williamson**，高级业务分析师（私募股权）


    这本书是数据专业人士的必读之书，它将技术深度与实践指导相结合。它完善了模型选择策略并加强了沟通，将原始数据转化为有意义且可操作的洞察。


    > **Raimondo Fanale MBCS**，Intuisco Ltd 研发经理


    对于任何将数据科学视为“黑术”但想要提高对其理解能力的人来说，这是一本“必读”书籍。它引导读者了解数据科学的概念和实践，通过大量使用案例研究和真实世界示例使其真实化。令人清新的是没有术语堆砌，提供了实用的建议并使主题人性化。强烈推荐。


    > **Nigel Turner**，全球数据策略 EMEA 地区首席信息管理顾问


    《数据科学基础》对于那些刚刚开启旅程或已经在从事高级数据分析的人来说，是一份受欢迎的资源。它成功地兼顾了全面性和可读性；涵盖了数据科学的所有领域，但没有假设读者具备先验知识。作者们的一件杰作。


    > **Martin Bell**，BEXIT Ltd 首席兼首席数据科学家


    一个关于数据科学的极佳介绍，涵盖了问题定义、统计学、模型选择、沟通和可视化。清晰简洁，是该领域新手的绝佳起点！


    > **Richard Fritz-Hewer**，CMC Partnership  数据科学家


    ## BCS，英国特许 IT 学会


    `BCS`（即 `The Chartered Institute for IT`）致力于让 `IT` 为社会做出贡献。我们利用网络的力量带来积极、切实的改变。我们捍卫全球
    `IT` 职业行业以及从事该职业的个人的利益，以造福所有人。


    ### 交流 IT 专业知识与经验


    学会促进工业、学术界和商界专家之间的联系，以促进新的思想、教育和知识。


    `BCS`（`The Chartered Institute for IT`）寻求促进 `IT` 职业发展和国家框架。它与政府、行业和相关机构合作，建立良好的实践和行为准则。加入
    70,000 名成员（包括学生、教师、专业人士和从业人员），享受访问国际社区的机会，订阅季度杂志以获取更多信息。


    ## BCS 学习与发展


    `BCS Learning and Development` 是 `BCS` 慈善机构的子公司，慈善号为 `292786`。


