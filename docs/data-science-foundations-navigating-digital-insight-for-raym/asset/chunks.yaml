- raw: 'Mark Twain once used a phrase borrowed from earlier authors that there are
    ‘lies, damn lies and statistics’. He was referring to the way that we can make
    numbers show a message that may not be the correct picture. There are lots of
    words used when describing data that ‘appears’ to have been influenced. Many people
    bandy about the terms ‘skewed’ and ‘biased’ – and also correlation – but we will
    talk about that later in the book.


    Think of modern marketing phrases such as


    ‘You probs prefer Pepsi as 70% of the UK preferred it in blind taste tests’, Pepsi
    Co.


    ‘The world’s favourite airline’, British Airways


    ‘Nine out of ten doctors recommend Tylenol’, Johnson & Johnson


    These rely on the use of figures and statements like ‘prefer’ or ‘favourite’ and
    do not give many details about the sample of people used for their tests, the
    questions asked, when the figures were gathered, removal of any outliers and so
    on.


    As someone wanting to know their way around data, you should spend a few moments
    looking at what statements actually mean. The interpretation of data usually depends
    on the person that is reading it, and the data itself will have gone through a
    number of calculations and aggregations as it made its way onto the report or
    presentation.


    Just as important as understanding the message that has been derived from the
    data is the ability to know whether the source of the data may have been influenced
    too. If you ask a group of young males if they want more football on the TV, there
    is a strong chance that more of them will say ‘Yes’. The person asking the question
    may want to show that there should be more football on TV and can use the results
    from their survey to prove this. If you had asked the same question of a broader
    range of people, there is a strong chance you would get fewer people saying ‘Yes’.


    Let’s explain a few of the key definitions used when we talk about the source
    of our data:


    *   Population: This means every person or thing that could be included in the
    scope of what you are doing (e.g. all customers that use your company, all people
    that watch a specific TV channel).


    *   Sample: This is a (usually) smaller group taken from the population (e.g.
    a group of 100 customers that you would send surveys to from the 100,000 customers
    that your company has).


    *   Sampling: This is how you pick the sample and as it has a potentially significant
    impact on the data, is a discussion that should involve relevant people. It should
    not be done by one person (their preferences may limit who is asked or included).
    At the very least, any results from the data should clearly state how the sample
    was decided upon.


    There are a few ways that you can pick a sample:


    *   Random sampling: Everyone in the population has an equal chance of being chosen,
    like drawing names out of a hat. Many would argue that this should always be used,
    but sometimes you want to make sure that all types of people will definitely be
    included in your work.


    *   Stratified sampling: You divide the population into groups and then pick a
    certain number from each group. An example of this would be ages, where you want
    to make sure that 60–69 year olds are always included in the sample.


    *   Convenience sampling: You pick the easiest people to reach, like your friends.


    *   Skew refers to how data is spread out or ‘leaning’ in one direction (see [Figures
    6.2](#17_ch06.xhtml#fig6.2) and [6.3](#17_ch06.xhtml#fig6.3)). Imagine a set of
    employees. If there are more younger people working in a company, then the spread
    of people would be greater in the lower age groups. In data, if most of the values
    are higher or lower than the average (mean), the data is skewed.


    *   Positive skew: Most data is on the low side.


    *   Negative skew: Most data is on the high side.


    Figure 6.2 Positively skewed data


    ![Graph: A skewed distribution curve is shown with the Mean marked to the right
    of the peak.](images/f0036-01.jpg)


    *   Bias is one of the most popular terms to use when people ‘feel’ that something
    is unfair or not accurate. Bias can happen when your sample or method of sampling
    causes the results to lean a certain way. For example, if you only ask customers
    who buy mobile phones if they would like to buy headphones. Your results might
    be biased because you’ve left out those who are less likely to buy headphones.
    Bias can lead to incorrect conclusions because your sample doesn’t truly represent
    the population, and making sure you know the best way of sampling is the easiest
    way of avoiding bias.


    Figure 6.3 Negatively skewed data


    ![Graph: A skewed distribution curve is shown with the Mean marked to the left
    of the peak.](images/f0037-01.jpg)


    When starting to work with data, you should look into using both quantitative
    and qualitative research to understand the problem you’re addressing, the data
    you need and the context in which you’ll be working.


    QUANTITATIVE RESEARCH


    Data collection and analysis:


    *   Collect existing data: Identify and gather relevant data sets that can help
    to answer your questions. This could be structured data such as numbers, statistics
    or measurements.


    *   Statistical analysis: Use descriptive statistics (mean, median, mode, standard
    deviation) to understand the basic features of the data. Perform exploratory data
    analysis (EDA) to identify patterns, trends and relationships in the data. We
    will talk about this more in [Chapter 10](#21_ch10.xhtml).


    *   Surveys and questionnaires: If you’re collecting your own data, design surveys
    or questionnaires with closed questions to gather numerical data from your target
    audience. Ensure you have a large enough sample size and are covering a range
    of different groups.


    QUALITATIVE RESEARCH


    Problem definition and user research:


    *   Interviews: Conduct in-depth interviews with stakeholders, domain experts
    or management to confirm what question needs to be answered by looking into data.
    This helps in defining the problem and setting expectations.


    *   Focus groups: Organise focus group discussions to gather diverse opinions
    and insights. This is particularly useful for understanding the broader context
    and user behaviour that might not be evident from data alone.


    *   Observation: Observe what happens in a ‘normal’ situation rather than asking
    specific questions. This may highlight unspoken needs and thoughts.


    Learn the context:


    *   Hands-on research: Immerse yourself in the environment where the data will
    be used or where it originates. This helps you to understand the cultural, social
    or organisational context that might affect your work.


    *   Case studies: Study specific examples or cases that are relevant to your work.
    Analysing how similar problems have been addressed can provide valuable insights.


    Literature review:


    *   Academic papers and industry reports: Read existing literature on similar
    projects, methodologies and technologies. This helps you to understand what has
    already been done by others and avoid reinventing the wheel.


    *   Best practices: Identify and understand best practices in using data and in
    your workplace. This can guide your approach and lead you to people that could
    help and advise.


    Qualitative data analysis:


    *   Thematic analysis: Analyse qualitative data from interviews, focus groups
    or open-ended survey questions to identify common themes, patterns and insights.


    *   Content analysis: Categorise textual data to quantify patterns or themes,
    which can then be combined with quantitative data for a richer analysis.


    Integrating different research:


    *   Cross-validate your findings: Use both quantitative and qualitative methods
    to cross-validate your findings. For example, you might use qualitative insights
    from interviews to explain patterns you see in the quantitative data.


    *   Iterative process: Let your qualitative research inform your quantitative
    approach, and vice versa. For instance, initial qualitative findings might help
    to refine your data collection or analysis methods.'
