    the data (or a quarter of the way). In practice, the IQR tells you how much the
    central portion of the data varies, providing insight into the core distribution
    of the data set.


    # PROBABILITY


    In the world of statistics and data science, there is very little we can be certain
    about. Most of the time we will be interpreting a view of data and using what
    we see to draw conclusions. Unfortunately, these views may point towards a trend
    or pattern, but they will almost never ‘prove’ things are true (or false). Probability
    is the language of uncertainty and randomness. It helps us to quantify the likelihood
    of different outcomes and is a cornerstone of statistical inference in data science.


    ### Basic probability concepts


    *   Probability of an event: Probability is a number between 0 and 1 that indicates
    how likely an event is to occur. An event with a probability of 0 will never happen,
    while an event with a probability of 1 is certain.

    *   Complementary events: If the probability of an event happening is `P(A)`,
    the probability of it not happening is `1 – P(A)`. This is the certainty of something
    happening (value of 1) minus the probability of it happening. These are complementary
    events.


    ### Independent and dependent events


    *   Independent events: Two events are independent if the occurrence of one does
    not affect the probability of the other. For example, flipping a coin and rolling
    a die are independent events.

    *   Dependent events: Events are dependent if the outcome of one affects the probability
    of the other. For instance, drawing two cards from a deck without replacement
    makes the second draw dependent on the first.


    ### Conditional probability


    Conditional probability is the probability of an event occurring given another
    event has occurred. It is denoted as `P(A|B)`, meaning the probability of A happening
    given B. This concept is vital in data science.


    ### Probability distributions


    *   Discrete distributions: These describe the probability of outcomes for discrete
    variables, such as the number of heads in coin tosses.

    *   Continuous distributions: These apply to continuous variables like time and
    temperature.


    ### The law of large numbers


    The law of large numbers states that as the number of trials increases, the empirical
    probability (observed frequency) of an event will converge to its theoretical
    probability. It is like saying if you flip a coin enough times, you will see half
    of the outcomes being heads and half being tails. The more times you flip the
    coin, the closer you will get to a perfect half–half. Being able to use vast quantities
    of data is a relatively new functionality for businesses.

