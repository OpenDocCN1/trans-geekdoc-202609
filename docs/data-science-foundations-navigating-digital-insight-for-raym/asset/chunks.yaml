- raw: 'Dev’s ambition is to become a winemaker. Although he adores travel and soaking
    up culture, he isn’t looking to relocate to Chile or even France to do this. He’d
    like to produce fine English wines close to his home in Surrey. A step to fulfilling
    this dream is SMARTabg, a software company that includes financial trading software
    amongst its portfolio of products.


    For smaller organisations involved in financial trading, there is a substantial
    cost in acquiring, storing and interpreting financial data. Dev recognised that
    they would benefit from someone doing this for them, providing those organisations
    with trading signals, depending on the market’s movements.


    Many of these trading signals are statistical models, for example comparing the
    moving average share price over different periods to determine if there is an
    upward or downward trend. Several signals combined create a strategic signal that
    can provide the basis for prescriptive analytics, when such strategic signals
    are used to automate trades. Here, probability comes into play: if five of five
    signals indicate a rising market, the probability of the market rising is higher
    than if three signals indicate it.


    One of the biggest challenges facing Dev was ensuring the quality of the data
    he used to develop these signals. There is a plethora of sources of financial
    data; however, each source is of a different quality and has different costs associated
    with it. The higher the quality, the less data cleansing required, but the higher
    the cost. To determine the quality of different data sources, Dev took samples
    and ran a variety of tests including identifying outliers, which were investigated.
    This included looking at the standard deviation in price movements. This sampling
    continued into the live platform to check and maintain the data quality.


    Once the data was in place, around 200 models were built to enable the trading
    signals, and many of the models are common within the financial trading sector.
    How the data is stored is important for model development. For this project, Dev
    used both relational and NoSQL databases, which store unstructured data. One of
    the data sets (NoSQL) is needed for social context, because commentary by leading
    figures and bodies, such as the Bank of England, affects financial markets, and
    natural language processing can assist in interpreting this. The text of these
    comments is unstructured data, and thus doesn’t fit into a relational data structure.


    Over his career, Dev has spent time and effort building his domain knowledge through
    his work and qualifications. This helped him in this project, both in determining
    the quality of data and in identifying the models of most use to the traders they
    support. Although emphasising the importance of domain knowledge, he is keen to
    point out that in some instances it is good not to have any. This allows a focus
    on pattern detection unencumbered by existing understanding and preconceptions.
    In his view, data science is something that can be engaged with by people with
    many varied backgrounds.


    16 CONCLUSION


    This book is intended to introduce you to the world of data science. We have talked
    through the common techniques and models used within data science and more importantly
    we have described how to make data science a success within an organisation. There
    are plenty of pathways open to you to follow further, and our ambition is to shine
    a light on the options you can choose from.


    We’ve explored applications of data science and its potential impact on society.
    We’ve delved into the technical aspects, from data collection and preparation
    to model building and evaluation. And we’ve also touched on the softer skills,
    such as communication and stakeholder management.


    THE POWER OF DATA SCIENCE


    Data science is more than just a collection of tools and techniques. It’s a powerful
    approach that can be used to solve complex problems, uncover hidden insights and
    drive innovation. Whether you’re a business analyst, a data scientist or just
    someone who’s curious about the world around you, data science can help you to
    make better decisions and achieve your goals.


    The human element


    While data science is a technical field, it’s important to remember that it’s
    ultimately driven by people. The success of any data science project depends on
    the skills and creativity of the individuals involved. From data engineers to
    machine learning experts, each role is crucial in the process.


    Data science has become a transformative force, revolutionising industries and
    reshaping societies. By harnessing the immense power of data, organisations can
    uncover valuable insights, make informed decisions and foster innovation.


    The foundation of data science


    At its core, data science is built on an understanding of the problem to be solved,
    the data available to us and an appreciation of how to use the answers we are
    shown. Taking on a role in data science can lead down many paths and requires
    a balance between using statistics or machine learning algorithms and data engineering/programming
    skills. These elements form the foundation that allows data scientists to extract
    meaningful insights from large, complex data sets. Their communications skills
    allow them then to share this with their stakeholders.


    Statistics and machine learning algorithms


    Statistics provide the mathematical framework for analysing data. Techniques such
    as hypothesis testing, probability distributions and inferential statistics allow
    data scientists to make sense of data patterns and draw conclusions. Machine learning
    provides the tools to create models that ‘learn’ from data. These algorithms enable
    predictions, classifications, pattern recognition and decision-making.


    Data engineering/programming skills


    Much of this book has focused on the use of data science in an organisation, describing
    some of the modelling approaches. Preparing, storing, transforming and extracting
    are skills that are likely to involve databases and potentially a range of programming
    languages. They allow data scientists to manipulate data, build models and implement
    machine learning algorithms efficiently. Together, these skills empower data scientists
    to transform raw data into actionable insights that drive innovation in countless
    fields.


    Where algorithms learn from data to make predictions or decisions, care should
    be taken to ensure that everyone understands both the data being used and the
    algorithm. The key groups of ML fall into:


    Supervised learning: This uses labelled data to train models.


    Examples:


    *   Linear regression for predicting house prices.


    *   Logistic regression for predicting whether a customer will churn.


    *   Decision trees and support vector machines for classification tasks.


    Unsupervised learning: This works with unlabelled data to find patterns.


    An example is clustering (e.g. grouping customers into segments).


    Reinforcement learning: This involves training an agent to interact with an environment
    and maximise rewards.


    Applications for this are robotics, game playing (e.g. AlphaGo) and autonomous
    vehicles.


    A key objective of this book has been to introduce how to implement a data science
    project in real life. All the complex statistical models in the world do not make
    a great outcome on their own. They need to be used effectively in a business.


    While data science has become a powerful tool to make smarter decisions, optimise
    processes and improve customer experiences, implementing a data science project
    can feel overwhelming, especially if your organisation is new to it. We have covered
    the stages of successfully implementing a data science project in a business in
    a simple and practical way.


    As a reminder, the key steps should always cover:


    Step 1: Identify a business problem (discover)


    A successful data science project has a clear definition of the problem you’re
    trying to solve. Make sure the problem is specific, measurable and aligned with
    your business goals.'
