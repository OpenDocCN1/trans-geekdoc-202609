- raw: 'If you think about it, the whole data analysis lifecycle contributes to a
    good user experience. The usefulness, desirability and credibility of the communication
    are dependent upon the framing of the problem, the data sourcing and preparation
    and the methods applied. The design of the communication also plays a part in
    whether these principles are met. Design is similarly an important factor in whether
    the knowledge shared is useful, findable and accessible. How the communication
    is stored and shared also plays a role in whether the knowledge is findable and
    accessible.


    Let’s look at resource planning and how we might communicate our findings. Rather
    than consider this from the data scientist’s perspective, let’s step into the
    shoes of the resource planner. Their need is simple: a forecast of customer contact
    volumes for the next month, updated each week. It might be possible to manually
    pull together a report each week in Excel – consisting of a multitude of different
    rainbow-coloured charts with a full range of models covered. This could be sent
    out by email around the start of the week. Sounds OK? Perhaps not if you compare
    it with a live report that the resource planner can access at any time by clicking
    a link on your intranet home page, and which clearly shows the forecast number
    of contacts for the next month.


    IMPROVING USER EXPERIENCE


    In many instances, the audience might have a preference as to how they are communicated
    with. Often, there are opportunities to improve on this; however, in the first
    instance changing the way you communicate with an audience can have a negative
    effect on the user experience. This doesn’t mean to say that the communication
    shouldn’t change, but it needs to be handled sensitively. The issue is how to
    educate your audience. Consider:


    *   Who will act as an advocate?


    *   Can small changes be made?


    *   Are you able to build a consensus in your audience over time?


    KNOW YOUR AUDIENCE


    In the previous section we stepped into our audience’s shoes. Our audience will
    be made up of the project’s stakeholders or a subset of those stakeholders. These
    stakeholders might have different needs from the communication. Where this is
    the case, the audience should be segmented and appropriate information shared
    with each segment.


    Even for a simple data science project, the audience can often be segmented. It
    is worth considering four potential segments, consisting of:


    *   Technical: This audience will want technical detail of the models used, and
    understands the technical language.


    *   Managerial: This audience wants the key insights expressed in simple non-technical
    terms, with the ability to drill into detail that is relevant to them.


    *   Executive: This audience wants the key insights expressed in simple non-technical
    terms.


    *   Team: Like the executive audience, this one wants key insights expressed in
    simple non-technical terms. However, the scope of information provided might be
    more limited.


    This audience segmentation is a generalisation, providing a useful starting point.
    How might this play out in practice? Let’s take the example of forecasting sales
    for a company with regional sales teams. The executives might want to know what
    the expected sales are going to be. Members of the regional teams are also likely
    to be interested in this. The managers of each regional team could benefit from
    more details (e.g. the forecast for each of their sales representatives). Individual
    forecasts are probably too much detail for the executives and information that
    should not be shared with team members. Colleagues in the data science team are
    likely to want to know about the model used to create the forecast.


    When looking at the different audience segments, it is worth considering their
    level of knowledge and whether they have preconceived ideas that the findings
    might reinforce or challenge. This can require sensitive handling. When communicating
    to different audiences, it’s also important that the fundamental messages are
    consistent, otherwise credibility is undermined and difficult questions are likely
    to be raised.


    DOMAIN CONTEXT


    We talked about the importance of the domain context when looking at the discovery
    stage of the data analysis lifecycle. Domain context is important both in translating
    the information we have as the result of our hypothesis testing into knowledge,
    and in determining how to communicate that knowledge.


    Looking at the outcome of our hypothesis testing in the context of the domain
    to which it relates can help us to understand it. A simple example could be our
    sales forecast: if the model appears weak, could that be due to changed behaviours
    during Covid? Another Covid example is the predicted A-level grades discussed
    in [Chapter 4](#15_ch04.xhtml). The domain context allows us to see that the schools
    with too small a cohort to predict grades are private schools. It also lets us
    recognise that some pupils might be prejudiced by using the model, as they would
    not be awarded the grades their teachers believed they were worthy of.


    The domain context also helps us to understand our audience. How well do they
    understand the domain and how do they perceive it? These are factors to be considered
    in how we communicate our findings. How might we change the way we communicate
    if our sales forecasts show that sales will be significantly lower than the executive
    expect, or one influential region is forecast to perform poorly? Our audience
    is human, and we need to recognise that they will have an emotional reaction to
    our communication.


    INFORMATION TO KNOWLEDGE


    What should you consider when transforming the information you have gleaned from
    your hypothesis testing into knowledge? We have already considered the domain
    context, but what about the results of the hypothesis testing themselves?


    Most models will return a set of performance metrics to assist in determining
    the value of your model. Make sure you understand them and correctly interpret
    them. It is likely that most of your audience will rely on you to do this as they
    will not have the skills and expertise to do it themselves. Where possible, it
    is advisable to have someone else check or confirm your interpretation.


    Once you have interpreted the data, you need to consider how you communicate the
    uncertainty that will inevitably be associated with the patterns found and predictions
    made. We also need to add unpredictable outside factors to the uncertainty in
    our models. There are two points worth considering here:


    *   The strength of the model: If it is a strong model, that should give confidence.
    If it is a weak model, should it be used?


    *   External information: Is there other information that supports or challenges
    the model?


    It is also worth noting that, just because a hypothesis isn’t proved on testing,
    it does not mean that the work hasn’t been worthwhile. It has value in demonstrating
    that something thought to have importance doesn’t. This means it can be excluded
    or downgraded in decision-making and effort, and resources can be put into finding
    those things that are important, for example if your hypothesis is that increasing
    the spend on advertising on a particular platform will increase sales and you
    are unable to prove it, you can redirect that spend to other platforms where you
    do get a return.


    You might also need to be conscious of limitations in the data sets used and,
    where appropriate, communicate them and the potential impact on the findings.


    STORYTELLING


    The idea of telling stories around data has its roots in data journalism. In data
    journalism, data is used to both find and evaluate stories. The story is then
    told based on the data. The story brings a narrative to the data that in turn
    helps the audience to understand the knowledge imparted. It creates an emotive
    response in the audience and acts as a call to action.'
