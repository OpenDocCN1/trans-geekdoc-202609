- raw: 'When we measure things, we use different units of measurement, and these often
    have different ranges. For example, in measuring age we normally use years, and
    this range might be 0 to 120, if you are very lucky. In measuring daily mobile
    phone usage, the unit could be minutes and the range 0 to 1440, if you are an
    insomniac. Differences in the ranges of data can cause models to give undue weight
    to some attributes. In these circumstances, the data is scaled so that the ranges
    across the attributes are the same. This then gives them equal weight in the model.
    There are different techniques to do this, referred to as feature scaling. Each
    attribute (referred to as a feature) is replaced with a value, often with a range
    between 0 and 1 or –1 to 1. In our example, using a range of 0 to 1, if we had
    an age of 120 and scaled it, it would result in a 1. If the age is 60, the value
    would be 0.5. A 1 would also be returned when someone spent 24 hours on the phone
    in a day. If they spent an hour, it would be a 0.042 (to three decimal places).
    This is often referred to as normalisation.


    If we wanted to investigate phone faults using age and time the phone is in use,
    then feature scaling this data would ensure that the model is not influenced by
    time on the phone having a greater range than age.


    Properties of data


    In [Chapter 6](#17_ch06.xhtml) we looked at the properties of data. When preparing
    the data, it is important to understand the properties of the data set used and
    its suitability for the model being built. Rather than revisiting the concepts
    we will look at some practical examples.


    Numeric data


    Many models require the data in them to be numeric rather than textual. This means
    that data might need to be changed from a word into a number. If you look at the
    restructured table of phone faults in [Table 8.2](#19_ch08.xhtml#tab8.2), you
    can see that, rather than recording a yes/no in the field, we have used 1 and
    0. This allows the data set to be used in models that do not accept alpha values.


    Category of data


    Creating additional columns and populating with 1s and 0s might seem a lot of
    hassle. If the model needs numeric values, why not just leave one field and give
    each of the faults a number ([Table 8.5](#19_ch08.xhtml#tab8.5))?


    Table 8.5 Fault types


    | Fault type || Fault type value |


    | --- | --- |


    | Screen || 1 |


    | Operating system || 2 |


    | Processor || 3 |


    The difficulty with this is that the data is ordinal (i.e. it has a rank), and
    this might affect the model. Hence, the addition of columns, one for each of the
    fault types and the recording of the value as a binary (1 or 0), a type of nominal
    data. The technique to move categorical data in one field into binary data in
    many fields is called ‘one-hot encoding’.


    This example considers a model that requires nominal binary data. Other models
    might have different requirements as to the properties of the data used in them.


    PROPERTIES OF DATA SETS


    As well as the data having properties, data sets can also have properties. Two
    properties often encountered are patterns over time and skewness.


    Patterns over time


    When looking for patterns over time, the data might have a trend. It could be
    an upwards trend (values increasing over time) or a downwards trend (values decreasing
    over time). A pattern over time could also be cyclical, for example retail sales
    peaking in the run-up to Christmas every year. Data such as this isn’t stationary,
    and some models require the data to be stationary. Stationary data is where its
    statistical properties, such as mean and variance, don’t vary over time. Where
    the data has a trend or cyclical pattern, the mean and variance do vary over time.
    Tests can be undertaken to determine if the data is stationary and, if it isn’t,
    it might be possible to transform the data so that it is stationary, allowing
    it to be used as part of a model requiring stationary data.


    Skewed data


    We have seen in [Chapter 6](#17_ch06.xhtml) that skewed data is where the data
    is unevenly distributed around the mean. A model’s output can be affected by how
    skewed the data is within it. If this is the case, steps can be taken to normalise
    the data, leading to an even distribution either side of the mean. This even distribution
    is referred to as normal distribution or Gaussian distribution. Statistical tests
    that assume normalised distribution are called parametric tests, those that don’t
    are non-parametric tests.


    QUALITY RISKS


    As we have seen in [Chapter 7](#18_ch07.xhtml), when sourcing our data it is important
    to consider the data quality. Considering the data quality is equally important
    in preparing the data. At this stage, we are looking at the quality risks in the
    data set and the action that needs to be taken to mitigate them. These quality
    risks might be inherent in the source data or have been introduced in the extraction,
    loading or subsequent manipulation of the data.


    Missing values


    Data sets can have missing values for many reasons. These could include data not
    being collected in the first instance or data sets not being complete. Where data
    is found to be missing, this should be investigated. Within our contact centre
    project, the record of the contacts might have been lost or corrupted, potentially
    due to an IT failure.


    When combining data, it is important to consider the way the data is combined,
    as different techniques can produce different combined data sets. A missing value
    in a data set might lead to data in that table and corresponding tables being
    lost. For our contact centre, if there was no data for a particular day in either
    our contacts-dealt-with or people-working tables, we could lose the corresponding
    record in the other table, depending on the approach taken to combine the data.


    Duplication


    There is also a possibility that rows of data might be duplicated when the data
    is combined. Again, we need to take care when selecting how we combine our data
    to avoid this. In doing so, consideration needs to be given to the data structure,
    particularly where the relationships between tables are not 1 to 1. By this, we
    mean that the unique key in one table has multiple records with the same key in
    another table.


    Sample size


    Your data within your data set might be perfect. However, the data set might be
    too small to be effectively used in a model. In most cases the more data you have,
    the more accurate the model you can build. Some models are better at working with
    small data sets than others.


    Outliers


    Where there are outliers in the data set, it is worth considering the cause of
    the outliers, to decide whether to keep or remove the data. For example, if we
    looked at our contact centre data and saw a spike in the number of people working
    due to new trainees being brought on board, we might decide to exclude that data
    as it is not the ‘normal’ operation of the contact centre.


    Bias


    We have considered some of the causes of bias in our data sets in [Chapter 6](#17_ch06.xhtml).
    Bias is an ethical issue, and bias might not be apparent. It is worth thinking
    about how bias might be introduced into the core data set. A classic example is
    if we look at the characteristics that made a person a good recruit for a job.
    If we look at the data in the curriculum vitae of successful applicants for similar
    roles, the data set might be biased due the biases within those recruiting to
    those roles.


    Wrong data set


    Our search for good candidates for a role also illustrates the challenge of ensuring
    we have the right data set to address the problem. It could be argued that the
    data from the curriculum vitae of successful applicants can only help to identify
    the characteristics of successful applicants, but it tells you nothing about whether
    they are good at the job. In this case, another data set would need to be found
    that reflects successful candidates who perform well in the role.


    QUALITY CHECKS'
