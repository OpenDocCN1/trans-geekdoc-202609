    15 CASE STUDIES


    Throughout this book we have included examples to help illustrate key points and
    build your understanding of them. These examples are by their nature simple and
    don’t reflect the complexity of most data science projects. To create a richer
    picture of data science in action, here we have included several case studies
    of projects that have used data science. We are very grateful to the companies
    and individuals who have been willing to share their experiences. When reading
    these case studies, you will see many of the themes discussed in this book brought
    to life. Our contributors have also been kind enough to share their advice on
    data science and entrepreneurship, the latter reflecting the opportunities for
    innovation that data science creates within both markets and organisations.


    INNOVATION FACTORY


    Anwar is a reality TV star, with an interest in data science. It is best not to
    think Love Island in this context. Rather, think Dragons Den or Shark Tank, but
    earlier in the innovation cycle, when people take their vision and make it a reality
    – in other words, develop their product. He acts as an advisor on Stars of Science,
    both on the technical side and, equally important, the business side. He asks
    the questions: who will buy the product and why?


    Stars of Science helped to launch Anwar’s first business (using sound detection
    to alert those with hearing impairment to emergencies). He recognised that being
    able to recognise patterns in sound had wider applications, and founded the Innovation
    Factory to build on this.


    Birmingham, where the Innovation Factory is based, was at the heart of the motor
    industry, and it is still a city of cars. This can lead to congestion, with resulting
    air and noise pollution. Anwar’s theory was that vehicles’ sounds could be used
    to both detect traffic and estimate pollution levels. This led to the creation
    of Traffic Ear, a cost-effective solution for monitoring both traffic and pollution.


    Anwar knew he would need to collect lots of data on traffic to build the algorithms
    and train the models needed. He didn’t quite envisage how hard this would be.
    The hardware was straightforward: acoustic sensors, a camera, an air pollution
    sensor and a central processing unit, along with some microprocessors, adaptors
    and Wi-Fi. Not that hard to put together until you need to fit all the components
    into a discreet box and place it at the top of a lamp post, where it will be subject
    to the prevailing weather.


    The challenge with the data lay in classifying the sounds so that the models could
    identify vehicles, and the emissions associated with them. Anwar, or one of his
    team, could have sat below the sensor and recorded each vehicle that passed to
    associate it to a sound. Nine months of sitting by a dual carriageway, through
    all weathers, didn’t appeal to anyone. This led to the development of a novel
    solution to automate this: using a camera to record details of the vehicle, and
    using this data to label the recorded sounds. This allowed a classification model
    to be constructed, permitting different types of vehicles to be identified just
    by their sound. Other data, such as speed and air pollution, were also used to
    develop sound-based models.


    These models don’t exist in a vacuum, with their outputs being fed into a master
    model that then analyses them to provide holistic information on traffic and pollution
    levels. Anwar was keen to point out that the models used are bound by the data
    collected. In this case, the data set is limited to vehicles travelling up to
    40 miles an hour (the speed limit on the roads where the data was collected).
    So, it would not be possible to extrapolate the data to estimate the pollution
    created by a bus travelling at 60 miles an hour.


    The core technology developed for Traffic Ear is now being applied to other use
    cases. One is on the railways. How do you keep animals off the line and prevent
    trains striking them? The UK has a problem with deer, in Australia it’s kangaroos
    and in India it’s elephants. The answer is to use the Traffic Ear technology to
    detect animals and then use light and sound to scare them away. It’s not that
    simple, as different animals have different behaviours and react in different
    ways. The species of animal needs to be detected along with what it is doing;
    is it just grazing or is it on the move? Anwar has developed a solution using
    generative AI. On the Traffic Ear technology detecting an animal, it plays the
    AI a few seconds of video and it can determine the species and what it is doing.
    This automatically triggers an appropriate response from the 20,000 that are available.
    And, yes, the animal’s reaction is stored so that the data from that interaction
    can be used to improve the model.


    Anwar highlighted the importance of prescriptive analytics, linking the data science
    outcomes to automated actions – in this case, the triggering of a light and sound
    pattern to deter the animal and reduce the risk of a train striking them.


    When asked for advice, his key message was that data science, particularly AI,
    is a fast-developing field and you must invest in your own learning. Your learning
    only sticks when you put it into practice.


    SMART CONTAINER CO


    Some people would say Steve had the dream job, simply cracking open beer and taking
    a few measurements. As for the beer, it had to be disposed of somehow. You can
    imagine the good cheer and wild parties that might follow. Oddly enough, Steve
    isn’t that keen on beer, so the reality was rather different.


    Smart Container Co, based in South Wales, helps companies to see what is happening
    to containers and products in the difficult-to-get-to parts of the supply chain.
    This includes brewers and the kegs in which they transport beverages. Their technology
    tracks and monitors kegs and the drinks inside them. Listening to their clients,
    they realised there were concerns that products could become over- or under-carbonated
    while in the keg, indicating problems with the drink’s quality or a damaged keg
    (with the risk of explosion). This posed the question of how to measure the carbonisation
    of a liquid in a sealed, pressurised keg.


    Steve stepped up to the role of resolving this locked-box puzzle. The hypothesis
    was that ultrasonic readings could be used to determine fill level, and then this
    used to determine the level of carbonisation. A document review revealed very
    limited information on the subject. That which was found had a poor provenance
    (i.e. it wasn’t from verified sources). This meant he needed to collect data himself.


    To accurately collect data, Steve tried several different methods, using drinks
    in a range of containers. Eventually, he settled on filling and pressurising containers
    himself. In doing this, he had to source specialist equipment and learn how to
    use it.


    Once a robust data set had been collected, Steve looked to understand the relationships
    between the data. He initially started out using a simple linear regression model.
    When this didn’t reveal any substantive relationships, he investigated other models.
    This included multivariate and polynomial regression – to no avail, the hypothesis
    remained unproven.


    Steve is very conscious of the old saying ‘garbage in, garbage out’. He recognises
    the importance of data quality and the challenges of measuring it, including the
    tolerances of the machines used for this. He also advocates using someone as a
    sounding board to validate the approaches taken, especially if they have knowledge
    and experience you can tap into. Most of all, he believes that data scientists
    need to be curious about what the data can reveal.'
