  trans: "\n\n让我们来看五笔客户交易：\n\n交易 1：{电池包, 外壳, 屏幕保护}\n交易 2：{电池包, 外壳}\n交易 3：{外壳, 屏幕保护}\n\
    交易 4：{电池包, 外壳, 屏幕保护}\n交易 5：{电池包, 屏幕保护}\n\n* **支持度 (Support)**：项目共同出现的次数占总交易数的百分比。\n\
    * **置信度 (Confidence)**：当购买项目 1 时，购买项目 2 的概率。\n\n让我们寻找一些最小支持度为 40%（在五笔交易中出现两次）的规则：\n\
    \n### 步骤 1：寻找频繁项集\n\n* {电池包} 出现在 4/5 次交易中 = 80%。\n* {外壳} 出现在 出现在 4/5 次交易中 = 80%。\n\
    * {屏幕保护} 出现在 4/5 次交易中 = 80%。\n* {电池包, 外壳} 出现在 3/5 次交易中 = 60%。\n* {电池包, 屏幕保护} 出现在\
    \ 3/5 次交易中 = 60%。\n* {外壳, 屏幕保护} 出现在 3/5 次交易中 = 60%。\n* {电池包, 外壳, 屏幕保护} 出现在 2/5\
    \ 次交易中 = 40%。\n\n### 步骤 2：生成规则并计算置信度\n\n对于 {电池包, 外壳}：\n\n* 如果客户购买电池包，他们会购买外壳：\n\
    * `Confidence = 3/4 = 75%.`。\n* 如果客户购买外壳，他们会购买电池包：\n* `Confidence = 3/4 = 75%.`。\n\
    \n**洞察**：如果有人购买了电池包，有 75% 的概率他们也会购买外壳，因此你可能希望将这些物品放在在一起。\n\n提升度 (Lift) 衡量了项目共同购买的概率相对于独立购买概率的倍数。`lift\
    \ > 1` 意味着项目相互互补，而 `< 1` 则表明它们是替代关系。\n\n让我们为规则 `电池包 → 外壳` 计算所有数据：\n\n1. **支持度**\n\
    \   * `Support(电池包) = 4/5 = 0.8.`\n   * `Support(外壳) = 4/5 = 0.8.`\n   * `Support(电池包,\
    \ 外壳) = 3/5 = 0.6.`\n2. **置信度**\n   * `Confidence = Support(电池包, 外壳) / Support(电池包).`\n\
    \   * `Confidence = 0.6 / 0.8 = 0.75 (75%)`。\n   * **解释**：当人们购买电池包时，75% 的人也购买了外壳。\n\
    3. **提升度**\n   * `Lift = Support (电池包, 外壳) / Support (外壳) × Support (电池包)`\n \
    \  * `Lift = 0.6 / 0.64 = 0.9375`\n\n**关键点**：\n\n1. `Lift = 1`：项目是独立的。\n2. `Lift\
    \ > 1`：项目是互补的。\n   例如：薯片和莎莎酱经常一起购买，`lift = 3.0`。\n3. `Lift < 1`：项目是替代品。\n   例如：可乐和百事乐可能有\
    \ `lift = 0.5`。\n\n从生成的结果中可以假设的一些情况（在 Apriori 算法中称为剪枝）：\n\n* 如果 {项目 1} 不是频繁的，那么\
    \ {项目 1, 项目 2} 就不可能是频繁的，\n* 如果 {项目 1, 项目 2} 不是频繁的，那么 {项目 1, 项目 2, 项目 3} 就不可能是频繁的。\n\
    \n这些属性有助于减少需要检查的组合数量。\n\n![Images](img/f0097-01.jpg)\n\n### 你自己 (KYD)\n\n关联规则挖掘中的常见错误是忽略领域知识和数据背景。对业务实际情况的专家可以帮助为分析选择相关项目，并突出冗余的规则，让你能够关注更有意义的模式。例如，如果你知道每个人在买新手机时总是会买外壳，那么忽略这一点而关注尚未被发现的模式可能是值得的。你还应该注意其他可能影响结果的因素——季节性、位置和客户的人口统计特征都会显著改变购买习惯。\n\
    \n### 业务示例\n\n**产品组合**：杂货店利用关联规则挖掘来识别频繁购买的产品组合，从而指导促销策略和商店布局设计。\n\n* **零售**：杂货店可能会根据面包和牛奶经常一起购买的发现，在货架上将它们放在一起。\n\
    * **电子商务**：在线商店可能会根据购买了与你相同物品的其他客户还购买了什么来向你推荐产品。\n* **网页设计**：网站设计师可能会根据用户浏览行为将相关内容或广告放在一起。\n\
    \n# 11 可视化\n\n## 注意事项\n\n在试图向他人传达信息时，讲述故事是一个被证明有效的策略，但利用统计学的力量也能让你创建出对观众留下深刻印象的可视化。了解人们会“喜欢”看什么，并确保他们“看到”正确的结论，是处理数据的一个关键部分——数字可以转化为故事，洞察可以跃纸而出。在本章中，我们将探索创建引人注目的视化的艺术与科学，这不仅传递信息，还能吸引你的观众。我们将涵盖关键考虑因素，讨论用户体验\
    \ (UX) 和无障碍，并强调清晰标记的重要性。\n\n### 了解你的观众\n\n在开始选择或设计可视化之前，了解谁会看至关重要。他们是精通数据的分析师，还是寻找快速洞察的执行官？了解观众可以帮助你根据需求定制可视化的复杂和风格。分析师可能喜欢具有交互性的可视化，而执行官通常倾向于简洁的概述。\n\
    \n### 选择正确的图类型\n\n选择合适的图类型就像选择正确的工具。不同类型的数据需要不同的表示方式。\n\n![图：柱状图](img/f0099-01.jpg)\n\
    \n**柱状图**：适合比较数量。\n\n![图：折线](img/f0099-02.jpg)\n\n**折线**：显示趋势的理想选择。\n\n![图：饼图](img/f0099-03.jpg)\n\
    \n**饼图**：显示百分比或占比。但要注意，饼图经常被过度依赖并用在错误的地方。请谨慎使用。\n\n![图：散点图](img/f0099-04.jpg)\n\
    \n**散点图**：说明变量之间的关系非常完美。\n\n### 简化、简化、再简化\n\n在可视化方面，少即是多。通过关注最重要的数据点并移除不必要的元素来避免杂乱。简化不仅能提高清晰度，还能让你的可视化更加悦目。\n\
    \n### 明智地使用颜色\n\n颜色是你工具箱中强大的工具，但必须经过思考在使用。保持一致的配色方案，并用颜色突出关键信息，而不是让观众眼花。\n\n*\
    \ **色彩一致**：在可视化之间保持一致以便于解释。许多机构都有可以使用的“主题”或“调色板”。\n* **对比色**：使用对比色来吸引注意数据点。\n\n\
    ## 数据可视化的用户体验\n\n### 直观的设计\n\n有效的可视化应该是直观的，让用户能够快速理解信息。逻辑地排列元素。\n\n* **层级**：组织元素以引导观众先看最重要的信息。\n\
    * **留白**：策略性地使用留白分离元素并提高可读性。\n\n### 交互性\n\n交互元素可以通过允许观众按自己的速度探索数据来增强用户体验。考虑整合工具提示、过滤器和缩放功能以提供更丰富的体验（见图\
    \ 11.1 和 11.2）。\n\n图 11.1 工具提示：悬停在数据点上提供额外信息\n\n![截图：表格单元格中的数据值上显示的工具提示](img/f0100-01.jpg)\n\
    \n图 11.2 过滤器：允许用户自定义视图并关注特定的数据子集\n\n"
