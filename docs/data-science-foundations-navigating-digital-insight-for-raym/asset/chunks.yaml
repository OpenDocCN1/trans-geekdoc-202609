    Data science opens a vast wealth of possibilities and opportunities. However,
    just because we can do something, doesn’t mean we should. What would your response
    be if asked to develop a model to predict the health outcomes for people like
    you? This might have lots of positive benefits in improving health within the
    population, including you. That in turn might lead to economic gains, from which
    you benefit. It could also be good for the company you work for if, for example,
    it was an insurance company who determined premiums based on this information.
    Good for society, good for your company and potentially good for you.'
