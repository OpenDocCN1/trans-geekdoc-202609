    \ which is not likely to be the end of the world. Being able to label the errors\
    \ in your model is key to understanding its impact.\n"
  trans: "\n\n# 12 模型评估\n\n在本章中，我们将深入探讨数据科学模型评估的核心流程。评估对于确保你构建的模型不仅准确，而且具有意义且可靠至关重要。我们将涵盖关键概念和技术，以评估模型性能、解释结果并确保它们在训练数据之外的数据上具有良好的泛化能力。此活动涉及数据分析生命周期中的分析阶段。\n\
    \n让我们从基础开始。当我们谈论模型的输出时，会提到似然、显著性、置信度等，因此让我们从概率开始，我们在第 9 章中提到过概率，但现在将进行详细详细介绍。\n\
    \n## 什么是概率？\n\n定义：概率是衡量一个事件发生可能性的程度。它是一个 0 到 1 之间的数字，其中：\n\n- 概率为 `0` 意味着事件不会发生。\n\
    - 概率为 `1` 意味着事件一定会发生。\n- 之间的概率（例如 `0.5`）意味着事件有一定概率发生。\n\n概率的关键公式：\n\n`P(事件) =\
    \ 有利结果数 ÷ 所有可能结果的总数`\n\n示例 1：掷骰子：\n\n想象你投掷一个标准的六面骰子。掷出 `3` 的概率是多少？\n\n- 有利结果：掷出\
    \ `3`（只有 1 个结果）。\n- 所有可能结果：掷出 `1` 到 `6` 之间的任何数字（6 个结果）。\n`P(掷出 3) = 1 ÷ 6 ≈ 0.167`\n\
    \n所以，掷出 `3` 的概率大约为 16.7%。\n\n示例 2：抛硬币：\n\n如果你抛一个硬币，得到正面的概率是多少？\n\n- 有利结果：正面（1\
    \ 个结果）。\n- 所有可能结果：正面或反面（2 个结果）。\n`P(正面) = 1 ÷ 2 = 0.5`\n\n所以，抛出正面的概率是 50%。\n\n\
    ## 什么是 p 值？\n\n定义：`p-value`（p 值）告诉我们，如果零假设是 true，观测到我们现有数据（或更极端情况）的概率有多大。它是我们数据中“惊讶程度”的衡量。\n\
    \n- 小的 `p-value`（例如 `0.05` 或更小）表明，除非发生了某些意外，否则我们的数据不太可能发生。\n- 大的 `p-value`（例如\
    \ `> 0.05`）意味着我们的数据是一致的，且符合我们的预期。\n\n将 `p-value` 想象为回答这个问题：\n\n如果没有事情发生，观测到此类数据的概率是多少？\n\
    \n人们通常认同，某事发生的 `0.05` 或 5% 的概率是一个良好的工作水平。如果一个事件发生的概率为 5% 或更低，而它确实发生了，在社会科学中我们可以说这种现象概率足够低，足以令我们感到惊讶。有时我们选择的值可能不同，例如\
    \ `0.01`。\n\n## 假设检验：分步指南\n\n假设检验是 le 使用的一种正式过程，用于确定关于总体的假设是否得到样本数据的支持。以下是进行假设检验的步骤：\n\
    \n### 第 1 ：陈述假设\n\n假设检验中总有两个假设：\n\n- 零假设 (`H[0]`)：这是默认假设。它认为没有影响、没有差异或没有关系。\n\
    \  - 示例：硬币是公平的，正面的概率为 `0.5`。\n- 备择假设 (`H[a]`)：这是你试图证明的。它认为存在影响、差异或关系。\n  - 示例：硬币是有偏斜的，正面的概率不是\
    \ `0.5`。\n\n### 第 2 ：选择显著性水平 (α)\n\n显著性水平是决定何时拒绝零假设的阈值。我们何时认为存在偏差？\n\n- 常见选择：`α\
    \ = 0.05` (5%) 或 `α = 0.01` (1%)。\n\n如果 `p-value` 小于 `α`，我们拒绝零假设，这意味着存在某些偏差。请注意，你应该在运行模型之前选择该水平，而不是冒受答案影响的风险。\n\
    \n### 第 3 步：收集数据并计算统计量\n\n统计量是一个总结你的数据的数字，并可以帮助你将其与零假设的预测值进行比较。统计量的类型取决于你正在执行的检验（例如\
    \ `z-test`、`t-test` 等）。\n\n### 第 4 步：计算 p 值\n\n使用统计量和统计表（或软件）找到 `p-value`（也称为临界值）。它告诉你你的数据在零假设下有多不寻常。\n\
    \n### 第 5 步：做出决策\n\n- 如果 `p ≤ α`：拒绝零假设 (`H[0]`)。这意味着有足够的证据支持备择假设 (`H[a]`)。\n-\
    \ 如果 `p > α`：无法拒绝零假设。这意味着没有足够的证据支持 `H[a]`。\n\n假设检验示例：硬币是公平的吗？假设我们抛了硬币 20 次，得到了\
    \ 17 次正面。你怀疑硬币可能是偏斜的。\n\n陈述假设：\n- `H[0]`：硬币是公平的 (`P(正面) = 0.5`)。\n- `H[a]`：硬币是有偏斜的\
    \ (`P(正面) ≠ 0.5`)。\n\n选择显著性水平：\n- `α = 0.05`。\n\n收集数据并计算统计量：\n- 正面次数 = `17`。\n\
    - 总抛掷次数 = `20`。\n\n使用二项检验计算 `p-value`。注意：二项检验是计算在许多独立事件中某事发生或不发生的概率的方法。\n\n计算\
    \ `p-value`：\n使用软件或二项概率表找到得到 17 次或更多正面（或双侧检验中的 17 次或更少正面）的 `p-value`。`p-value`\
    \ 可能是 `0.003`。\n\n做出决策：\n由于 `p = 0.003 < α = 0.05`，我们拒绝零假设。有强有证据表明硬币是有偏斜的。\n\n\
    ## 这是偶然吗？理解显著性\n\n在评估模型时，确定其性能是真实的还是仅仅是随机结果至关重要。显著性检验在这方面很有帮助，它能告诉你某事发生的概率，以便你判断是否发现了某种模式。除了\
    \ p 值和零假设外，你可能会遇到置信区间术语。\n\n- 置信区间：它们提供了一个范围，我们预计真实的性能指标（如准确率、精确率）落在范围内，通常为 95%。\n\
    \n通过使用这些标准，你可以判断你的预测是有意义的还是巧合。\n\n## 模型解释了多少？比较训练集和测试集\n\n在评估模型时，确定其性能是真实的还是仅仅是随机结果至关重要。显著性检验在这方面很有帮助，它能告诉你某事发生的概率，以便你判断是否发现了某种模式。除了\
    \ p 值和零假设外，你可能会遇到置信区间。\n\n- 置信区间：它们提供了一个范围，我们预计真实的性能指标（如准确率、精确率）落在范围内，通常为 95%。\n\
    \n通过使用这些标准，你可以判断你的预测是有意义的还是巧合。\n\n## 模型解释了？\n\n模型评估的一个关键方面是理解模型如何泛化到新的未知数据。这涉及到将其在训练集（用于构建模型的数据）与测试集（模型训练期间未见过的新数据，用于检查结果）上的性能进行比较。\n\
    \n- 过拟合：当模型在训练集上表现异常但在测试集上表现很差时。这意味着模型学习了训练数据的噪声和细节，而不是底层模式。它为了匹配测试集被过度设计。\n-\
    \ 欠拟合：相反，欠拟合发生在模型在训练集和测试集上的表现都很差，表明它没有捕捉到数据的底层趋势。\n- 性能指标：常见的指标包括准确率、精确率、召回率和\
    \ F1 分。然而，在两个集合上监控这些指标是关重要的。两个集合之间的显著差异可能表明过拟合或欠拟合。\n\n在这些集合之间取得正确的平衡可以确保你的模型很好地解释数据并能有效泛化。\n\
    \n### 假阳性和假阴性\n\n在许多现实应用中，并非所有错误都是同等的。如果你构建的模型模型预测某事会发生，但它没有发生，那么这就是错误。这种错误的影响取决于问题的背景。想象预测某人会感冒，但他们没有冒。你可能给了他们一个不需要的疫苗，这可能不是世界末日。标记模型中的错误是理解其影响的关键。\n\
    \n"
