    10 MODEL SELECTION


    WHICH MODEL TO USE?


    Data science is a transformative field that combines statistics, computer science
    and domain expertise to derive actionable insights from data. This chapter delves
    into the core concepts and methodologies of data science, such as hypothesis testing,
    statistical measures, predictive modelling and various analytical techniques,
    enriched with practical business examples to illustrate their applications. There
    are lots of potentially confusing terms to decipher when we start talking about
    statistical techniques, so we will attempt to give you a ‘fact sheet’ on each
    one, linking into examples of how it can be used.


    This book is not intended to teach you the ins and outs of statistical formulae
    – it is much more important that you can understand how appropriate a model is
    to your situation and that you have an awareness of the potential pitfalls of
    using particular data sets with a model. If you can quiz a data scientist on why
    they have used specific data with a specific model, then you are in a very good
    place to apply the important fundamentals of data science.


    We are therefore going to look at some of the key models, but focus on what they
    look like and important factors to consider in your data. Each of the following
    models will contain the basic theory of the statistics involved, but we will add
    examples of what it looks like in real-life:


    ![Image: A confused or questioning monitor screen.](images/f0066-01.jpg)


    Look out for the ‘What does it look like?’ icon.


    ![Image: A surprised microchip.](images/f0066-02.jpg)


    There will also be know your data pointers, ‘KYD yourself’, to help avoid potential
    issues.


    Choosing the right model depends on the hypothesis and the type of data you have.
    Some models are designed for prediction, while others are for classification,
    clustering or association.


    You should also be wary of the human influence on model selection – it’s natural
    to stick to models that you have run before and your tools allow you to build,
    but this doesn’t always mean they are the best option. A good data scientist will
    question the model selection every time, but beware the temptation to take the
    easiest path of running models that are already in place.


    We will start with what data science can be used for and its approaches, before
    talking about some common terms that are often poorly, or even mistakenly, used.
    We can then move on to the core categories of modelling that are increasingly
    used by budding data scientists.


    Approaches to data science


    To better understand what data science does, we can split it into three main types
    of analytics: descriptive, predictive and prescriptive analytics. Each type represents
    a different stage of understanding and decision-making, and together they provide
    a powerful framework for making informed choices. In the earlier chapters we mentioned
    the different approaches in data analysis. Let’s revisit these terms.


    DESCRIPTIVE ANALYTICS: UNDERSTANDING THE PAST


    Descriptive analytics focuses on summarising historical data to understand past
    events. Techniques such as data aggregation, visualisation and basic statistical
    measures provide insights into trends and patterns. Descriptive analytics is similar
    to being a detective looking at what has happened: it involves analysing historical
    data to understand what has already occurred. The goal is to summarise and interpret
    data in a way that makes it easy to see trends, patterns and key insights.


    Applications:


    *   Business reporting: Creating dashboards to visualise sales performance over
    time.


    *   Customer segmentation: Analysing demographic data to identify key customer
    segments for targeted marketing.


    Examples of descriptive analytics:


    *   A retail store analysing last year’s sales data to see which products sold
    the most.


    *   A website tracking the number of visitors and their behaviour over the past
    month.


    *   A hospital examining patient admission rates over the last year to identify
    seasonal trends.


    Tools and techniques:


    *   Metrics such as averages, totals, percentages and trends.


    *   Data visualisation tools such as bar charts, pie charts and line graphs.


    *   Dashboards that summarise KPIs.


    Descriptive analytics helps you to paint a clear picture of the past, but it doesn’t
    explain why things happened or what might happen next.


    PREDICTIVE ANALYTICS: PEEKING INTO THE FUTURE


    Predictive analytics takes things a step further – it’s like using a crystal ball
    powered by statistics and machine learning to predict what might happen in the
    future. By analysing historical data, predictive models identify patterns and
    relationships that can help to forecast future outcomes.


    Think of predictive analytics as answering the question: what’s likely to happen
    next?


    Applications:


    *   Demand forecasting: Anticipating product demand based on historical sales
    and market trends.


    *   Risk assessment: Predicting credit default risks for loan applicants using
    financial history and behavioural data.'
