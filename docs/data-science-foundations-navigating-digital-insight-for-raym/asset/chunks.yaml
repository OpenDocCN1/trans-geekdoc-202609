  trans: '

    这项案例研究的寥寥数语并反映他们在收集和分析数据上投入的时间和精力。有些人认为这一年的努力是失败的，因为没有发现任何可以确定碳化水平的关系。Steve 和
    Smart Container 公司并非如此认为。结果显示，他们听取了客户的需求，现在他们知道如何衡量碳化了。这使他们发展了如何处理这些问题的思考。通常情况下，假设被视为一个数据科学项目的失败，但实际上它是数据科学项目的一个有效结果，增加了知识和理解。


    # COGNITIVE BUSINESS


    在 `Ratcliffe-On-Soar` 的背景下，英国东米部的 Cognitive Business 公司诞生了。该公司的出现是为了向金融行业提供数据驱动的解决方案。Steve
    描述自己曾是一个物理学家，从事过许多事情，包括数据科学。


    与电力站不同的是，每个电力站都是独特的。Steve 意识到这提供了一个降低成本的机会。预测性维护涉及在某些问题发生之前预测它们，预测性维护可以应用于许多领域。


    第一个挑战是找到数据。通过努力，Steve 和他的团队建立了一个原型，并与大型电力公司共享。他们通过迭代过程来构建模型，这让团队能够开发出健壮的模型，并理解不同因素如何影响数据。


    Steve 和他的团队大量利用机器学习在数据中寻找模式并进行分类。他们通过视觉检查数据并询问为什么发生了这些变化开始。在这里，Steve 的物理学知识发挥了作用。


    输出结果非常透明。这意味着模型做出的任何决策或建议都有审计追踪并可以被合释。Ellie 解释说，这不仅在监管方面（如果有人对自动决策提出质疑）很重要，对于建立潜在客户的信心也很重要。


    预测性维护的挑战之一是数据的可靠性。这意味着为了训练检测模型，需要获得一个丰富的数据集。为了应对这一点，团队通过识别数据中的正常模式开始。数据中开始出现异常，这些异常被用于引导调查，结果随后被反馈到模型中。


    虽然电力站中的概念受到外部因素的影响，为了解决这一挑战，团队构建了许多模型来理解因素如何影响接收的数据。显然，模型的构建和评估过程是自动化的。


    Steve 和他的团队的工作结果使得电力站中未发现的问题可以被识别和调查。这些问题在过去并没有发生过。


    他对数据科学的观点是关注他们所热心的主题，利用数据工具并建立技能。


    # GOOD WITH


    Good With 是一家金融行为分析公司，其使命是改变人们评估信用的方式，促进金融包容，并支持那些被金融服务排除或服务不足群体的健康。Ellie 和她的同事深受自身被金融排除经历的驱动，并将心理学的价值观和背景带到工作中。Ellie
    对数据科学的兴趣源于她作为心理学家开展的研究，后来她转入一家全球金融公司的数据科学团队。


    Good With 开发了两个核心产品：用于衡量财务能力和预测贷款风险的替代评分，以及旨在帮助人们提高金融养和管理金钱情感方面的个性化学习之旅。该框架的个性化很大程度上受画像（目标观众的代表）的驱动。应用于此工作的流程如下。


    ### 初步研究


    初步定性研究识别了四种不同的财务画像。Ellie 想使用数据科学的定量方法验证这些画像。通过问卷和访问银行记录收集了大约 90 个人的数据。数据经过了预处理，以探索关键特征之间的相关性。这包括对财务交易的文本描述应用自然语言处理以进行分类，以及查看账户余额跌至
    `£0` 的频率。并不意外的是，例如，高财务压力与透支使用之间存在正相关。


    ### 聚类分析


    下一步是查看特征是如何分组的，以确定定性研究中显示的画像在数据是否可见。用于相关性分析的预处理特征被加载到无监督 ML 聚类模型中，该模型识别了四个小组。奇的是，这些小组与初步研究识别出的原始画像高度对齐。有了数据支撑画像，Good
    With 能够开发个性化学习路径，并将数据提供给贷款人，允许他们做出更好的贷款决策，从而使此前被排除的客户受益。


    在有序的过程中结合几个不同的模型会产生非常透明的输出集。这意味着模型做出的任何决策或建议都有审计追踪并可以被解释。


    Ellie 意识到围绕财务和心理健康的广泛问题本可以被探索。在决定探索哪些问题时，团队问了以下问题：


    *   监管会允许他们做什么？

    *   理解问题如何带来商业利益？

    *   对个人会有什么影响？


    Ellie 使用了心理健康的例子：查看人们的财务数据可以用于预测抑郁水平。在医疗环境中这是有益的。然而，对于 Good With 来说，这没有价值，并且可能感到被侵犯，或者对个人产生其他不利。此外，涉及到特殊类别数据（健康），增加了监管的复杂性，这意味着这是他们不会探索的领域。

    '
