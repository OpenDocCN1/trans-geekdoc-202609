  trans: '


    ![截图：一个下拉菜单，可能来自类似 Microsoft Excel 的电子表格程序。由于存在“数字筛选”，可以推断该菜单似乎与一个包含数值数据的列相关。](img/f0101-01.jpg)


    # 响应式设计


    在当今多设备的世界中，请确保您的可视化图具有响应式，并且从桌面电脑到手机手机的所有屏幕尺寸上都有良好的显示。


    - 可缩放图形：使用矢量图形或响应式框架，以确保在任何设备上都清晰。

    - 移动优先布局：在为较小屏幕设计时，考虑触控交互。


    # 数据可视化的无障碍性


    - 色盲考量：大约有 8% 的男性和 0.5% 的女性有色视觉障碍（美国眼科协会，2024 年）。为了让您的可视化图具有无障碍性，请考虑使用色盲友好的调色板，并避免仅依赖颜色来传递信息。

    - 色盲调色板：现代应用程序提供了许多工具，包含了为无障碍设计的调色板。

    - 替代标记：除了颜色外，还使用图案或形状来区分数据点。


    # 文字与字体大小


    确保可视化图中的所有文字都是可读的。使用清晰的无衬线字体，并避免过小的字体大小。


    - 最小字体大小：保持字体大小在 12 点以上以确保可读性。

    - 对比：确保文本与背景颜色之间有足够的对比度。


    # 描述性文本和替代文本


    为屏幕阅读器用户加入描述性文本和替代文本（alt text）。这确保了视觉障碍人士也能访问您的可视化图。


    - 描述性标签：为图表和图形提供上下文和解释。


    # 数据可视化中的标签


    使用清晰简洁的标签。标签是数据可视化的无名英雄。它们提供了必要的上下文，并帮助用户理解他们正在看的内容。


    - 轴标签：清晰地标记坐标轴，以表示代表什么数据。

    - 数据标签：在需要清晰时，为数据点添加标签。

    - 避免标签重叠：确保标签不会重叠或使可视化图拥挤。这会导致数据难以解释并损害整体设计。

    - 智能放置：使用算法智能地放置标签，避免重叠。

    - 图例使用：当空间有限时，使用图例来解释颜色或符号。


    # 一致性与格式


    在整个可视化图中保持标签格式的一致。这包括字体选择、大小和对齐。


    - 统一风格：对所有标签应用统一风格，以获得协调的视觉效果。

    - 对齐：整齐对齐标签以增强可读审美审美。


    # 柱状图


    ## 什么是柱状图？


    柱状图是最常见且多功能的可视化类型之一，用于比较不同类别之间的数量。它们显示矩形条，其长度与代表的值成比例（图 11.3）。


    ## 何时使用柱状图


    - 比较类别：它们非常适用于离散类别之间的比较，例如不同地区的销售情况。

    - 显示计数：它们在说明数据集中不同值的频率时非常有用。


    记住：通过限制类别数量和使用一致的颜色方案来保持柱状图简单，避免让观众感到无力。


    ### 图 11.3 月销售柱状图示例


    ![柱状图：月销售额，横轴显示 1 月、2 月、3 月和 4 月的柱条，销售额以美元计算分别达到 100、130、75 和 50。](img/f0103-01.jpg)


    # 直方图


    ## 什么是直方图？


    直方图与柱状图类似，但专门用于显示连续数据集的分布。它们将数据分为分箱或区间，显示数据点落在每个区间的频率（图 11.4）。直方图的形状提供了数据在取值范围内分布情况的视图。


    ## 何时使用直方图


    - 理解分布：它们非常适合连续变量（如考试分数或年龄）的分布。

    - 识别偏态：它们对于发现数据中的偏态或离群值非常有用。


    记住：选择合适的箱宽，以确保直方图准确表示数据分布而不丢失细节。


    ### 图 11.4 直方图示例


    ![直方图：横轴显示从 60 到 100 的测试分数。纵轴：显示 0-12 的频率。柱条显示分数分布：60-70（2 个）；70-80（6 个）；80-90（10
    个）；90-100（8 个）；100 以上（4 个）。文字显示“无间隙，连续数据”。](img/f0104-01.jpg)


    # 折线图


    ## 什么是折线图？


    折线图使用线条连接的点来表示随时间变化的数据点。它们非常适合可视化连续数据的趋势（图 11.5）。


    ### 图 11.5 折线图示例


    ![折线图：月销售绩效，横轴为月份，纵轴为单位 1000 美元的销售额。图上随机绘制了 6 个点，线条连接每个点，显示了斜率和趋势。](img/f0104-02.jpg)


    ## 何时使用折线图


    - 跟踪随时间的变化：它们非常适用于显示变量随时间的变化，例如股票价格或温度。

    - 比较多个序列：它们用于在同一张图上比较多个数据系列。


    记住：使用不同的线型或颜色来区分同一张图上的多条线，以确保清晰度。


    # 面积图


    ## 什么是面积图？


    面积图类似于折线图，但线条下方的区域被填充，强调了随时间变化的幅度。它们非常适合可视化累计数据（图 11.6）。


    ### 图 11.6 面积图示例


    ![面积图：从 1 月到 6 月的网站访问量，范围从 0 到 1200。横轴为基准线。图上随机绘制了 6 个点，线条连接每个点。线条下方和横轴以上的区域被阴影处理。](img/f0106-01.jpg)


    ## 何时使用散点图


    - 探索关系：它们对于识别两个变量之间的关系、趋势或聚类。

    - 发现离群值：它们非常适合检测偏整体模式的离群值。


    记住：考虑在散点图中添加趋势线，以突出变量之间关系的总体方向。


    # 箱线图


    ## 什么是箱线图？


    箱线图（或箱图）通过显示最小值、第一四位数、中位数、第三四位数和最大值来总结数据。它们非常适合可视化数据的分布和偏态。它们还提供了一种解释数据中潜在离群值的简单方法。箱的大小可以快速显示“四分位距”（图
    11.8）。


    ### 图 11.8 箱线图示例


