    ![](images/cover.jpg)


    ![Cover: Data Science Foundations Navigating digital insight by Stephen Mariadas
    and Ian Huke showing a ship navigating through ice.](images/cover.jpg)


    A brilliant guide to data science. Covers the full lifecycle with clarity and
    practical insight – perfect for newcomers but a fantastic reference for all.


    Chris Weston, Technology Consultant, NashTech


    Data Science Foundations is the perfect beginner’s guide, offering a clear, engaging
    overview of key concepts with real-world examples. A must-read companion for anyone
    eager to dive into data science.


    Jake Wilson PhD, Data Scientist, GHGSat Inc.


    This is a very topical subject, affecting everyone’s lives, and a book on its
    foundations could have been very dry, but the authors have struck the right blend
    of sharing the concepts, principles and approaches and bringing it to life with
    real-world examples and scenarios. My company is delivering several projects for
    clients using IoT (Internet of Things) which extensively use data science to deliver
    a service, and more broadly our teams get involved in many projects where there
    is a data science aspect (obvious or discrete). This book will definitely be the
    one I hand to our team members who are about to embark on a new project. Highly
    recommended.


    John Opsblum, Co-Founder and Chief Consulting Officer, Illuminet Solutions


    This was the book that I needed! An excellent, thoughtful and concise grounding
    in data science, packed with relatable examples, practical tips and a comprehensive
    framework for achieving successful data science projects. The explanations of
    the link between data science, machine learning and AI, as well as the overview
    of the different data science models, were invaluable in enhancing my understanding.
    This book will become a trusted companion, one that I am sure I will return to
    again and again.


    Paul Williamson, Senior Business Analyst (Private Equity)


    A must-read for data professionals, this book blends technical depth with practical
    guidance. It refines model selection strategies and enhances communication, turning
    raw data into meaningful, actionable insights.


    Raimondo Fanale MBCS, R&D Manager, Intuisco Ltd


    For anyone who views data science as a dark art, but wants to improve their understanding
    of it, this is a ‘must read’ book. It guides the reader through data science concepts
    and practices, making it real through its extensive use of case studies and real
    world examples. Refreshingly jargon free, it offers practical advice and humanises
    the topic. Strongly recommended.


    Nigel Turner, Principal Information Management Consultant EMEA, Global Data Strategy


    Data Science Foundations is a welcome addition to the resources available to those
    beginning their journey or those already practicing advanced data analysis. It
    manages to be both comprehensive and readable; all areas of data science are covered,
    but no prior knowledge is assumed. A splendid piece of work by the authors.


    Martin Bell, CEO and Chief Data Scientist, BEXIT Ltd


    A fantastic introduction to data science, covering problem definition, statistics,
    model selection, communication and visualisation. Clear and concise, it’s an excellent
    starting point for anyone new to the field!


    Richard Fritz-Hewer, Data Scientist, CMC Partnership


    BCS, THE CHARTERED INSTITUTE FOR IT


    BCS, The Chartered Institute for IT, is committed to making IT good for society.
    We use the power of our network to bring about positive, tangible change. We champion
    the global IT profession and the interests of individuals, engaged in that profession,
    for the benefit of all.


    Exchanging IT expertise and knowledge


    The Institute fosters links between experts from industry, academia and business
    to promote new thinking, education and knowledge sharing.


    Supporting practitioners


    Through continuing professional development and a series of respected IT qualifications,
    the Institute seeks to promote professional practice tuned to the demands of business.
    It provides practical support and information services to its members and volunteer
    communities around the world.


    Setting standards and frameworks


    The Institute collaborates with government, industry and relevant bodies to establish
    good working practices, codes of conduct, skills frameworks and common standards.
    It also offers a range of consultancy services to employers to help them adopt
    best practice.


    Become a member


    Over 70,000 people including students, teachers, professionals and practitioners
    enjoy the benefits of BCS membership. These include access to an international
    community, invitations to a roster of local and national events, career development
    tools and a quarterly thought-leadership magazine. Visit [www.bcs.org](http://www.bcs.org)
    to find out more.


