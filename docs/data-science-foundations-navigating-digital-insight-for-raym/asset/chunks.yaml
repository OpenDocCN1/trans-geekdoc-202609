    `k-means` 聚类将生成一个图形化可视化结果，显示数据点围绕给定数量的中心点（质心）分组。图 10.6 中的示例有四个类和四个质心，显示数据可以被清晰地分为四个独立的组。


    ## 公式


    `k-means` 聚类的目的是最小化所有数据点与质心之间所有距离的总和。我们通过改变质心的位置并不断尝试，直到找到一个使总和最小的点。因此，我们使用的与累加所有点与质心之间距离之的公式是：


    ![Formula: J equals Sum of j equals 1 to n, sum of I equals 1 to c, double vertical
    bars across x I to d j squared.](img/f0090-02.jpg)


    其中 `n` 是聚类的数量，`c` 是数据点的数量，右半部分衡量每个数据点与质心之间的距离。


    ![Images](img/f0091-01.jpg)


    ## 它看起来是什么样的？


    `k-means` 聚类涉及大量的计算，因为我们必须检查所有数据点与不同质心的关系。为了展示其工作原理的一个非常简单的示例，让我们尝试一个小型数据集。使用以下关于六个学生身高（cm）和体重（kg）的数据，我们可以尝试将他们分为两类：


    | 学生 || 身高 (cm) || 体重 (kg) |

    | --- | --- | --- |

    | A || 160 || 55 |

    | B || 170 || 65 |

    | C || 165 || 60 |

    | D | 180 || 80 |

    | E | 175 || 75 |

    | F | 190 || 90 |


    ### 步骤 1 ：k-means 中的 ‘k’ 是什么？


    `k-means` 中的 `k` 是你想要创建的类（组）的数量。在这里，我们将使用 `k = 2` 根据身高和体重将学生分为两组。


    ### 步骤 2 ：初始化聚类中心


    首先，我们随机挑选两个点作为“起始聚类中心”。让我们随机选择：


    *   聚类中心 1 (`C[1]`): (160, 55) → 同学生 A。

    *   聚类中心 2 (`C[2]`): (190, 90) → 同学生 F。


    这些中心只是起始点。当我们计算出更好的聚类分组时，它们将会移动。


    ### 步骤 3 ：将每个学生分配到最近的类中


    现在，对于每个学生，我们根据在第 9 章中描述的距离公式，计算哪个聚类中心更近——`C[1]` 还是 `C[2]`。


    #### 欧式距离公式


    让我们计算每个学生到两个聚类中心的距离：


    ![Table: 6 by 6 format. Student, height in centimeters, weight in kilograms, Distance
    to C1, Distance to C2, closest cluster. A, 160, 55,0,50, C 1; B, 170, 65, 14.14,
    36.06, C1; C, 165, 60, 7.07, 42.72, C1; D, 180, 80, 36.06, 14.14, C2, E, 175,
    75, 29.15, 18.03, C2; and F, 190, 90, 50, 0, and C2.](img/f0092-01.jpg)


    这给了我们结果：


    类 1 (`C[1]`): 学生 A, B, C

    类 2 (`C[2]`): 学生 D, E, F


    ### 步骤 4 ：重新计算聚类中心


    在将学生分配到类之后，我们重新计算每个类的中心（质心）。要找到新的质心：


    *   计算该类中所有学生身高和体重的平均值。


    类 1 的新质心 (`C[1]`):


    类 1 中的学生：A (160, 55), B (170, 65), C (165, 60)


    ![Math Equations: New height equals 160 plus 170 plus 165 divided by 3 equals
    165. New weight equals 55 plus 65 plus 60 divided by 3 equals 60.](img/f0092-02.jpg)


    新的 `C[1]` = (165, 60)


    类 2 的新质心 (`C[2]`):


    类 2 中的学生：D (180, 80), E (175, 75), F (190, 90)


    ![Math Equations: New height equals 180 plus 175 plus 190 divided by 3 equals
    181.67. New weight equals 80 plus 75 plus 90 divided by 3 equals 81.67.](img/f0092-03.jpg)


    新的 `C[2]` = (181.67, 81.67)


    ### 步骤 5 ：重复分配和重新计算


    现在我们重复步骤 3（将学生分配到最近的类）和步骤 4（重新计算聚类中心），直到聚类中心不再发生显著移动（这被称为收敛）。


    让我们再进行一次分配学生到类的迭代：


    ![Table: 6 by 6 format. Student, height in centimeters, weight in kilograms, Distance
    to new C1, Distance to new C2, closest cluster. A, 160, 55,7.07,36.53, C 1; B,
    170, 65, 7.07, 23.28, C1; C, 165, 60, 0,27.21, C1; D, 180, 80, 25,2.36, C2; E,
    175, 75, 18.03, 8.33, C2; and F, 190, 90, 36.06, 12.5, C2.](img/f0093-01.jpg)


    *   类 1 (`C[1]`): 学生 A, B, C

    *   类 2 (`C[2]`): 学生 D, E, F


    ![Images](img/f0093-02.jpg)


    '
