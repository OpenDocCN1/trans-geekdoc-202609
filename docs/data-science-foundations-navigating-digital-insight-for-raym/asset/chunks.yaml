- raw: 'In our introduction we saw how data science has changed sport. This is a small
    example of how data science is fundamentally transforming the way organisations
    and societies operate. From its foundations in statistics and ML to its applications
    in real-world decision-making, data science empowers us to uncover insights, solve
    problems and innovate. By embracing data science responsibly and addressing its
    ethical challenges, we can harness its power to build smarter solutions, improve
    lives and shape a brighter future. As technology advances and new data sources
    emerge, the possibilities for innovation are endless. From personalised medicine
    to autonomous vehicles, data science is at the forefront of some of the most exciting
    developments of our time.


    While data science can be a complex and challenging field, it’s also incredibly
    rewarding. By mastering the fundamentals and staying up to date with the latest
    trends, you can unlock the full potential of data and make a real difference in
    the world.


    GLOSSARY


    3Vs: Relates to the volume, velocity and variety of Big Data.


    5Vs: Adds veracity and variability to the 3Vs.


    Accuracy: The completeness of a data set.


    Administrative data: Data that has been generated through the activities of an
    organisation.


    Aggregation: Combining data – often used to report on a group rather than individuals,
    where individuals might be recognised if reported on individually.


    Agile: Often used to refer to iterative and incremental methods of project delivery
    – the term relates to software delivery methods based on principles set out in
    the Agile Manifesto.


    AI Act 2024: European Union regulations for the use of artificial intelligence.


    Algorithm: A sequence of steps or instructions to solve a problem, which might
    be found in a method.


    Apriori algorithm: A method used in data mining to find frequent item sets and
    generate association rules.


    ARIMA: A statistical method used for forecasting time series data by analysing
    past values – it uses a mix of moving averages and regression methods.


    Array: A structured collection of items, often in rows and columns, used in programming
    and data analysis.


    Artificial intelligence: Where a computer system performs a task normally done
    by a human.


    Association rules: Patterns that show relationships between variables in data
    – often used in market basket analysis.


    Bias: A systematic error that leads to incorrect results – it can happen in data
    collection or analysis.


    Big Data: Used to describe the prevalence of data in today’s society, having three
    key core concepts: volume, velocity, variety (the 3Vs).


    Box and whisker plot: A graphical representation that shows the distribution of
    data based on five summary statistics.


    Cartesian plane: A two-dimensional space defined by an x axis (horizontal) and
    a y axis (vertical) used to plot points.


    Categorical: Data that can be placed into groups.


    Classification: A method of grouping data into categories based on characteristics.


    Clustering: A technique that groups similar data points together without predefined
    categories.


    Correlation: A measure of how two variables are related – it shows whether they
    move together or in opposite directions.


    CRUD: Create, read, update, delete – often referred to as the data lifecycle.


    Data analysis lifecycle: A framework setting out the iterative steps needed to
    successfully deliver a data project.


    Data classification: This can have different meanings:


    *   A way of categorising data to support good governance.


    *   To define the nature of the data, for example structured/unstructured.


    *   A method for analysing data.


    Data governance: Sets out the strategy of managing data and operationalises it.


    Data lake: A data store where the data has been stored in its raw format.


    Data lifecycle: The lifecycle of a data item or data set, often referred to as
    CRUD.


    Data mart: A subset of a data warehouse focused on a specific domain, for example
    sales.


    Data Protection Act 2018: The UK law giving effect to GDPR.


    Data science: Using analytical methods in an endeavour to gain insight from diverse
    data, or the art of finding patterns in data.


    Data set: A collection of data.


    Data storytelling pyramid: A framework for narrative consisting of background,
    trigger, key findings and action.


    Data structure: Refers to the structure in which data is held, for example a table.


    Data type: How data is held in a field, for example integer – it can also refer
    to whether the data is public, open, administrative or research.


    Data warehouse: A data store where the data is used for reporting – the data is
    often prepared to enable this.


    Decision tree: A flowchart-like structure that helps to make decisions based on
    different conditions.


    Deep learning: A term used to describe the use of neural networks with many layers.


    Derived data: Where new data is created from combining or transforming existing
    data.


    Descriptive analytics: Analysing data to describe what happened – it uses past
    data to summarise results.


    DIKW: A framework representing data, information, knowledge and wisdom.


    Domain: The context in which the project is taking place – this informs the problem,
    the stakeholders and the interpretation of outputs.


    ELT: The process of extracting, loading and transforming data.


    Enrich: Where additional data is added to a data set.


    Ethics: The principles by which we and society judge our own and others’ behaviours
    – these change over time.


    ETL: The process of extracting, transforming and loading data.


    Export: Where data is taken from a data store.


    Feature: Key characteristic or attribute of a data set.


    Feature scaling: Creating a common scale for different features, that is, ensuring
    they have the same range.


    Foundational model: A form of generative AI that has been pre-trained and can
    be adapted to different uses.


    Four pillars of data storytelling: Design principles to aid the visualisation
    of data storytelling consisting of symbols, colour, captions and editorial layout.


    GDPR: The General Data Protection Regulation contains the European Union’s rules
    for use of data.


    General AI: Artificial intelligence that can handle all tasks a human can undertake.


    Generative AI: Artificial intelligence that generates new data or content.


    Granularity: The level of detail in the data.


    Hallucination: Where artificial intelligence makes something up, that is, returns
    an incorrect result.


    Heat map: A graphical representation of data where values are depicted by colour
    – it helps to visualise data density.


    Histogram: A graphical representation of the distribution of numerical data showing
    the frequency of data points in intervals.


    Hybrid: A method of project delivery combining aspects of linear and iterative
    and incremental methods.


    Hypothesis: A theory that provides a starting point for an investigation.


    Hypothesis testing: A test to determine statistically the extent to which a hypothesis
    can be explained by the data.


    ICO: The Information Commissioner’s Office can investigate and take enforcement
    action for breaches of data protection laws.


    Imputation: Where a value is given to a missing data item, often determined from
    the data around it.


    Insight: An understanding of what the model has revealed upon evaluation.


    Intellectual property: Refers to created works such as music, art and literature.


    Internet of things: A network of interconnected devices embedded with sensors
    and software.


    Interval: A type of quantitative data where the difference between values is meaningful,
    but there is no true zero – an example is temperature in Celsius.


    Latency: The delay in transferring or processing data.


    Lineage: The origin and history of the data set.


    Linear regression: A statistical method that models the relationship between a
    dependent variable and one or more independent variables using a straight line.


    Lists: A simple collection of items, usually in a specific order.


    Load: Where data is placed in a data store.'
  fmt: '

    In our introduction we saw how data science has changed sport. This is a small
    example of how data science is fundamentally transforming the way organisations
    and societies operate. From its foundations in statistics and ML to its applications
    in real-world decision-making, data science empowers us to uncover insights, solve
    problems and innovate. By embracing data science responsibly and addressing its
    ethical challenges, we can harness its power to build smarter solutions, improve
    lives and shape a brighter future. As technology advances and new data sources
    emerge, the possibilities for innovation are endless. From personalised medicine
    to autonomous vehicles, data science is at the forefront of some of the most exciting
    developments of our time.


    While data science can be a complex and challenging field, it’s also incredibly
    rewarding. By mastering the fundamentals and staying up to date with the latest
    trends, you can unlock the full potential of data and make a real difference in
    the world.


    # GLOSSARY


    3Vs: Relates to the volume, velocity and variety of Big Data.


    5Vs: Adds veracity and variability to the 3Vs.


    **Accuracy**: The completeness of a data set.


    **Administrative data**: Data that has been generated through the activities of
    an organisation.


    **Aggregation**: Combining data – often used to report on a group rather than
    individuals, where individuals might be recognised if reported on individually.


    **Agile**: Often used to refer to iterative and incremental methods of project
    delivery – the term relates to software delivery methods based on principles set
    out in the Agile Manifesto.


    **AI Act 2024**: European Union regulations for the use of artificial intelligence.


    **Algorithm**: A sequence of steps or instructions to solve a problem, which might
    be found in a method.


    **Apriori algorithm**: A method used in data mining to find frequent item sets
    and generate association rules.


    **ARIMA**: A statistical method used for forecasting time series data by analysing
    past values – it uses a mix of moving averages and regression methods.


    **Array**: A structured collection of items, often in rows and columns, used in
    programming and data analysis.


    **Artificial intelligence**: Where a computer system performs a task normally
    done by a human.


    **Association rules**: Patterns that show relationships between variables in data
    – often used in market basket analysis.


    **Bias**: A systematic error that leads to incorrect results – it can happen in
    data collection or analysis.


    **Big Data**: Used to describe the prevalence of data in today’s society, having
    three key core concepts: volume, velocity, variety (the 3Vs).


    **Box and whisker plot**: A graphical representation that shows the distribution
    of data based on five summary statistics.


    **Cartesian plane**: A two-dimensional space defined by an x axis (horizontal)
    and a y axis (vertical) used to plot points.


    **Categorical**: Data that can be placed into groups.


    **Classification**: A method of grouping data into categories based on characteristics.


    **Clustering**: A technique that groups similar data points together without predefined
    categories.


    **Correlation**: A measure of how two variables are related – it shows whether
    they move together or in opposite directions.


    **CRUD**: Create, read, update, delete – often referred to as the data lifecycle.


    **Data analysis lifecycle**: A framework setting out the iterative steps needed
    to successfully deliver a data project.


    **Data classification**: This can have different meanings:

    * A way of categorising data to support good governance.

    * To define the nature of the data, for example structured/unstructured.

    * A method for analysing data.


    **Data governance**: Sets out the strategy of managing data and operationalises
    it.


    **Data lake**: A data store where the data has been stored in its raw format.


    **Data lifecycle**: The lifecycle of a data item or data set, often referred to
    as CRUD.


    **Data mart**: A subset of a data warehouse focused on a specific domain, for
    example sales.


    **Data Protection Act 2018**: The UK law giving effect to GDPR.


    **Data science**: Using analytical methods in an endeavour to gain insight from
    diverse data, or the art of finding patterns in data.


    **Data set**: A collection of data.


    **Data storytelling pyramid**: A framework for narrative consisting of background,
    trigger, key findings and action.


    **Data structure**: Refers to the structure in which data is held, for example
    a table.


    **Data type**: How data is held in a field, for example integer – it can also
    refer to whether the data is public, open, administrative or research.


    **Data warehouse**: A data store where the data is used for reporting – the data
    is often prepared to enable this.


    **Decision tree**: A flowchart-like structure that helps to make decisions based
    on different conditions.


    **Deep learning**: A term used to describe the use of neural networks with many
    layers.


    **Derived data**: Where new data is created from combining or transforming existing
    data.


    **Descriptive analytics**: Analysing data to describe what happened – it uses
    past data to summarise results.


    **DIKW**: A framework representing data, information, knowledge and wisdom.


    **Domain**: The context in which the project is taking place – this informs the
    problem, the stakeholders and the interpretation of outputs.


    **ELT**: The process of extracting, loading and transforming data.


    **Enrich**: Where additional data is added to a data set.


    **Ethics**: The principles by which we and society judge our own and others’ behaviours
    – these change over time.


    **ETL**: The process of extracting, transforming and loading data.


    **Export**: Where data is taken from a data store.


    **Feature**: Key characteristic or attribute of a data set.


    **Feature scaling**: Creating a common scale for different features, that is,
    ensuring they have the same range.


    **Foundational model**: A form of generative AI that has been pre-trained and
    can be adapted to different uses.


    **Four pillars of data storytelling**: Design principles to aid the visualisation
    of data storytelling consisting of symbols, colour, captions and editorial layout.


    **GDPR**: The General Data Protection Regulation contains the European Union’s
    rules for use of data.


    **General AI**: Artificial intelligence that can handle all tasks a human can.


    **Generative AI**: Artificial intelligence that generates new data or content.


    **Granularity**: The level of detail in the data.


    **Hallucination**: Where artificial intelligence makes something up, that is,
    returns an incorrect result.


    **Heat map**: A graphical representation of data where values are depicted by
    colour – it helps to visualise data density.


    **Histogram**: A graphical representation of the distribution of numerical data
    showing the frequency of data points in intervals.


    **Hybrid**: A method of project delivery combining aspects of linear and iterative
    and incremental methods.


    **Hypothesis**: A theory that provides a starting point for an investigation.


    **Hypothesis testing**: A test to determine statistically the extent to which
    a hypothesis can be explained by the data.


    **ICO**: The Information Commissioner’s Office can investigate and take enforcement
    action for breaches of data protection laws.


    **Imputation**: Where a value is given to a missing data item, often determined
    from the data around it.


    **Insight**: An understanding of what the model has revealed upon evaluation.


    **Intellectual property**: Refers to created works such as music, art and literature.


    **Internet of things**: A network of interconnected devices embedded with sensors
    and software.


    **Interval**: A type of quantitative data where the difference between values
    is meaningful, but there is no true zero – an example is temperature in Celsius.


    **Latency**: The delay in transferring or processing data.


    **Lineage**: The origin and history of the data set.


    **Linear regression**: A statistical method that models the relationship between
    a dependent variable and one or more independent variables using a straight line.


    **Lists**: A simple collection of items, usually in a specific order.


    **Load**: Where data is placed in a data store.

