    Imagine you’re tracking your weight over a year. Time series analysis is like\
    \ looking at how your weight changes month by month, spotting any patterns (like\
    \ gaining weight during the holidays) and predicting what your weight might be\
    \ next month. It deals with data that happens over time, like stock prices, weather\
    \ patterns or website traffic.\n\n## When to use time series analysis:\n\n*  \
    \ **Forecasting**: Use for predicting future values, for example predicting next\
    \ year’s sales for a business.\n*   **Trend spotting**: Use for identifying long-term\
    \ patterns, for example seeing if the number of tourists visiting a city is increasing\
    \ or decreasing over time.\n*   **Seasonality detection**: Use for finding repeating\
    \ patterns within a certain time period, for example noticing that ice cream sales\
    \ are always higher in the summer.\n*   **Anomaly detection**: Use for finding\
    \ unusual or unexpected events, for example spotting a sudden drop in website\
    \ traffic.\n\n## Components of time series:\n\n*   **Trend**: The long-term movement\
    \ in the data.\n*   **Seasonality**: Regular, repeating patterns or cycles.\n\
    *   **Noise**: Random variability not attributed to trend or seasonality.\n\n\
    ## Techniques for time series forecasting:\n\n*   **Exponential smoothing**: This\
    \ applies exponentially decreasing weights to past observations for forecasting,\
    \ which means it gives less weight to older values.\n*   **Autoregressive integrated\
    \ moving average (ARIMA)**: this is a model capturing trend and seasonality in\
    \ time series data. It uses elements of regression and moving averages.\n\n##\
    \ STATISTICAL MODEL – AUTOREGRESSIVE INTEGRATED MOVING AVERAGE\n\n### Understanding\
    \ time series analysis – ARIMA\n\n`ARIMA` breaks down into three main components:\n\
    \n*   `AR` (auto regressive): this means the model uses past values to predict\
    \ future ones. You may remember that we used the word ‘regression’ in our linear\
    \ regression model – it is a similar principle here.\n*   `I` (integrated): this\
    \ means the model looks at changes between values instead of the raw data. This\
    \ helps to deal with trends or data that changes over time.\n*   `MA` (moving\
    \ average): this uses a mean average of the data, but, instead of looking at all\
    \ of the data items, it will use a certain number of past and future values. This\
    \ forces the model to keep re-evaluating the ‘average’ based on nearby values.\n\
    \nWhen you want to understand how data moves with time, you have to take account\
    \ of changes in the trend. The `ARIMA` model is adept at using relevant values\
    \ to predict the next changes by focusing on a moving picture of the data.\n\n\
    ### The output\n\nThe `ARIMA` model will predict future values, and these tend\
    \ to be plotted on a graph.\n\n### The formula\n\nThe simplest `ARIMA` method\
    \ is known as the Box–Jenkins model. It is a combination of the linear trend and\
