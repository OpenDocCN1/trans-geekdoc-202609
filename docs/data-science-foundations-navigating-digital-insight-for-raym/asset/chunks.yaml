    based on past data, for example predicting how many ice creams you’ll sell based
    on the temperature.

    *   Understanding relationships: If you want to see how two things are connected,
    for example seeing if there’s a link between hours of study and exam scores.

    *   Finding trends: If you want to spot patterns in data, for example seeing if
    sales increase steadily over time.


    ### The output


    Linear regression will produce an equation that shows how a variable is affected
    by one or more other variables. It will give weightings to each of the variables,
    and you can use this equation to predict other outcomes by inputting different
