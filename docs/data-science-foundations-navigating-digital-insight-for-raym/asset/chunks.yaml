- raw: "Let’s look at five customer transactions:\n\nTransaction 1: {battery pack,\
    \ case, screen protector}\n\nTransaction 2: {battery pack, case}\n\nTransaction\
    \ 3: {case, screen protector}\n\nTransaction 4: {battery pack, case, screen protector}\n\
    \nTransaction 5: {battery pack, screen protector}\n\n*   Support: How often items\
    \ appear together as a percentage of total transactions.\n\n*   Confidence: How\
    \ likely it is that item 2 is purchased when item 1 is purchased.\n\nLet’s find\
    \ some rules with minimum support of 40 per cent (appears in two out of five transactions):\n\
    \nStep 1: Find frequent item sets\n\n*   {battery pack} appears in 4/5 transactions\
    \ = 80 per cent.\n\n*   {case} appears in 4/5 transactions = 80 per cent.\n\n\
    *   {screen protector} appears in 4/5 transactions = 80 per cent.\n\n*   {battery\
    \ pack, case} appears in 3/5 transactions = 60 per cent.\n\n*   {battery pack,\
    \ screen protector} appears in 3/5 transactions = 60 per cent.\n\n*   {case, screen\
    \ protector} appears in 3/5 transactions = 60 per cent.\n\n*   {battery pack,\
    \ case, screen protector} appears in 2/5 transactions = 40 per cent.\n\nStep 2:\
    \ Generate rules and calculate confidence\n\nFor {battery pack, case}:\n\n*  \
    \ If customer buys battery pack, they buy a case:\n\n*   Confidence = 3/4 = 75\
    \ per cent.\n\n*   If customer buys a case, they buy a battery pack:\n\n*   Confidence\
    \ = 3/4 = 75 per cent.\n\nInsight: If someone buys battery pack, there’s a 75\
    \ per cent chance they’ll also buy a case, so you might want to place these items\
    \ near each other.\n\nLift measures how much more likely items are to be bought\
    \ together compared to if they were bought independently. A lift > 1 means items\
    \ complement each other, while < 1 suggests they substitute each other.\n\nLet’s\
    \ calculate everything for the rule ‘battery pack → case’:\n\n1.  Support \n\n\
    \    *   Support(battery pack) = 4/5 = 0.8.\n\n    *   Support(case) = 4/5 = 0.8.\n\
    \n    *   Support(battery pack, case) = 3/5 = 0.6.\n\n2.  Confidence \n\n    *\
    \   Confidence = Support(battery pack, case) / Support(battery pack).\n\n    *\
    \   Confidence = 0.6 / 0.8 = 0.75 (75 per cent).\n\n    *   Interpretation: When\
    \ people buy battery pack, 75 per cent also buy case.\n\n3.  Lift \n\n    *  \
    \ Lift = Support (battery pack, case) / Support (case) × Support (battery pack)\n\
    \n    *   Lift = 0.6 / 0.64 = 0.9375\n\nKey points:\n\n1.  Lift = 1: Items are\
    \ independent.\n\n2.  Lift > 1: Items are complementary.\n\n    Example: chips\
    \ and salsa are quite commonly bought together and might have lift = 3.0.\n\n\
    3.  Lift < 1: Items are substitutes.\n\nExample: Coke and Pepsi might have lift\
    \ = 0.5.\n\nSome things that you can assume from the results you generate (known\
    \ as pruning in Apriori):\n\n*   If {Item 1} isn’t frequent, then {Item 1, Item\
    \ 2} can’t be frequent,\n\n*   If {Item 1, Item 2} isn’t frequent, then {Item\
    \ 1, Item 2, Item 3} can’t be frequent.\n\nThese properties help to reduce the\
    \ number of combinations to check.\n\n![Images](images/f0097-01.jpg)\n\nKYD yourself\n\
    \nA common mistake in association rule mining is ignoring the domain knowledge\
    \ and context of the data. Experts in what is actually happening in a business\
    \ can help to select relevant items for the analysis and highlight rules that\
    \ are redundant, allowing you to focus on the more meaningful patterns. For example,\
    \ if you know that everyone always buys a case with a new phone, then it could\
    \ be worth ignoring this to focus on patterns that have not been realised. You\
    \ should also take warnings for other factors that might affect results – seasonality,\
    \ location and demographics of the customers can change buying habits significantly.\n\
    \nBusiness examples\n\nProduct combinations: A grocery store uses association\
    \ rule mining to identify frequently purchased product combinations, informing\
    \ cross-promotional strategies and store layout designs.\n\n*   Retail: A grocery\
    \ store might place bread and milk next to each other on the shelves based on\
    \ the discovery that they are often bought together.\n\n*   E-commerce: Online\
    \ stores might recommend products to you based on what other customers who bought\
    \ the same items as you also purchased.\n\n*   Web design: Website designers might\
    \ place related content or advertisements together based on user browsing behaviour.\n\
    \n11 VISUALISATIONS\n\nCONSIDERATIONS\n\nTelling your story is a well-proven tactic\
    \ when trying to get a message across to others, but using the power of statistics\
    \ can also enable you to create visualisations that leave lasting impressions\
    \ on your audience. Knowing what people will ‘enjoy’ looking at, and ensuring\
    \ they ‘see’ the right conclusions, are a critical part of working with data –\
    \ numbers can transform into stories, and insights leap off the page. In this\
    \ chapter, we’ll explore the art and science of creating compelling visualisations\
    \ that not only convey information but also engage your audience. We’ll cover\
    \ key considerations, discuss user experience (UX) and accessibility and stress\
    \ the importance of clear labelling.\n\nKnow your audience\n\nBefore you even\
    \ start choosing or designing your visualisation, it’s crucial to understand who\
    \ will be viewing it. Are they data-savvy analysts or business executives looking\
    \ for quick insights? Knowing your audience helps you to tailor the complexity\
    \ and style of your visualisations to meet their needs. Analysts might appreciate\
    \ detailed visualisations with interactive elements. Executives often prefer high-level\
    \ overviews with clear, concise messages.\n\nChoose the right chart type\n\nSelecting\
    \ the appropriate chart type is like choosing the right tool for a job. Different\
    \ types of data and messages call for different visual representations.\n\n![Logo:\
    \ bar graphs.](images/f0099-01.jpg)\n\nBar charts: These are great for comparing\
    \ quantities across categories.\n\n![Logo: line graph.](images/f0099-02.jpg)\n\
    \nLine charts: They are ideal for showing trends over time.\n\n![Logo: pie chart](images/f0099-03.jpg)\n\
    \nPie charts: These are useful for displaying percentages or the share of a whole.\
    \ Be careful, though, because pie charts are often over-relied upon and used for\
    \ the wrong purposes. Use sparingly.\n\n![Logo: Scatter plot.](images/f0099-04.jpg)\n\
    \nScatter plots: These are perfect for illustrating relationships between variables.\n\
    \nSimplify, simplify, simplify\n\nWhen it comes to visualisations, less is often\
    \ more. Avoid clutter by focusing on the most important data points and removing\
    \ unnecessary elements. Simplicity not only enhances clarity but also makes your\
    \ visualisations more aesthetically pleasing.\n\nUse colour wisely\n\nColour can\
    \ be a powerful tool in your visualisation arsenal, but it must be used thoughtfully.\
    \ Stick to a cohesive colour scheme and use colour to highlight key information\
    \ rather than overwhelm the viewer.\n\n*   Consistent colours: Maintain consistency\
    \ across visualisations for easy interpretation. Lots of organisations have a\
    \ ‘theme’ or ‘palette’ of colours to use.\n\n*   Contrasting colours: Use contrast\
    \ to draw attention to important data points.\n\nUSER EXPERIENCE IN DATA VISUALISATION\n\
    \nIntuitive design\n\nAn effective visualisation should be intuitive, allowing\
    \ users to grasp the message quickly. Arrange elements logically and ensure that\
    \ the flow of information is natural.\n\n*   Hierarchy: Organise elements to guide\
    \ the viewer’s eye to the most important information first.\n\n*   White space:\
    \ Use white space strategically to separate elements and improve readability.\n\
    \nInteractivity\n\nInteractive elements can enhance user experience by allowing\
    \ viewers to explore data at their own pace. Consider incorporating features like\
    \ tooltips, filters and zooming to provide a richer experience ([Figures 11.1](#22_ch11.xhtml#fig11.1)\
    \ and [11.2](#22_ch11.xhtml#fig11.2)).\n\nFigure 11.1 Tooltips: offer additional\
    \ information when hovering over data points\n\n![Screenshot: A tool tip shown\
    \ over a data value in a table cell.](images/f0100-01.jpg)\n\nFigure 11.2 Filters:\
    \ allow users to customise views and focus on specific data subsets"
