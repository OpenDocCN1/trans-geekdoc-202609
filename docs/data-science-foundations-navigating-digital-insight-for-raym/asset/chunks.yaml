- raw: 'Imagine you’re tracking your weight over a year. Time series analysis is like
    looking at how your weight changes month by month, spotting any patterns (like
    gaining weight during the holidays) and predicting what your weight might be next
    month. It deals with data that happens over time, like stock prices, weather patterns
    or website traffic.


    When to use time series analysis:


    *   Forecasting: Use for predicting future values, for example predicting next
    year’s sales for a business.


    *   Trend spotting: Use for identifying long-term patterns, for example seeing
    if the number of tourists visiting a city is increasing or decreasing over time.


    *   Seasonality detection: Use for finding repeating patterns within a certain
    time period, for example noticing that ice cream sales are always higher in the
    summer.


    *   Anomaly detection: Use for finding unusual or unexpected events, for example
    spotting a sudden drop in website traffic.


    Components of time series:


    *   Trend: The long-term movement in the data.


    *   Seasonality: Regular, repeating patterns or cycles.


    *   Noise: Random variability not attributed to trend or seasonality.


    Techniques for time series forecasting:


    *   Exponential smoothing: This applies exponentially decreasing weights to past
    observations for forecasting, which means it gives less weight to older values.


    *   Autoregressive integrated moving average (ARIMA): This is a model capturing
    trend and seasonality in time series data. It uses elements of regression and
    moving averages.


    STATISTICAL MODEL – AUTOREGRESSIVE INTEGRATED MOVING AVERAGE


    Understanding time series analysis – ARIMA


    ARIMA breaks down into three main components:


    *   AR (auto regressive): This means the model uses past values to predict future
    ones. You may remember that we used the word ‘regression’ in our linear regression
    model – it is a similar principle here.


    *   I (integrated): This means the model looks at changes between values instead
    of the raw data. This helps to deal with trends or data that changes over time.


    *   MA (moving average): This uses a mean average of the data, but, instead of
    looking at all of the data items, it will use a certain number of past and future
    values. This forces the model to keep re-evaluating the ‘average’ based on nearby
    values.


    When you want to understand how data moves with time, you have to take account
    of changes in the trend. The ARIMA model is adept at using relevant values to
    predict the next changes by focusing on a moving picture of the data.


    The output


    The ARIMA model will predict future values, and these tend to be plotted on a
    graph.


    The formula


    The simplest ARIMA method is known as the Box–Jenkins model. It is a combination
    of the linear trend and the moving average.


    Y[t] = δ + ϕ[1] Y[t–1] + ϕ[2] Y[t–2] + … + ϕ[p] Y[t–p]


    \+ ∊[t] + θ[1]∊[t–1] + θ[2]∊[t–2] + … + θ[q]∊[t–q]


    ![Images](images/f0082-01.jpg)


    What does it look like?


    Applying ARIMA takes a number of steps, and it will certainly be necessary to
    use tools to calculate results on any reasonable-size data set. Let’s work through
    the steps that are taken as an example of what happens during the process.


    Using some basic mobile phone sales data, let’s try and predict what will happen
    in Week 8:


    | Week || Mobile phones sold |


    | --- | --- |


    | 1 || 500 |


    | 2 || 520 |


    | 3 || 530 |


    | 4 || 570 |


    | 5 || 580 |


    | 6 || 600 |


    | 7 || 630 |


    Step 1: Check if the data is stationary


    ARIMA works best when your data does not have any trends (also known as seasonality).
    We are therefore aiming to make the data stationary.


    To make data stationary (i.e. remove the trend), we calculate the difference between
    consecutive values. This is called ‘differencing’.


    | Week || Mobile phones sold || First difference (change) |


    | --- | --- | --- |


    | 1 || 500 || – |


    | 2 || 520 || 520 – 500 = 20 |


    | 3 || 530 || 530 – 520 = 10 |


    | 4 || 570 || 570 – 530 = 40 |


    | 5 || 580 || 580 – 570 = 10 |


    | 6 || 600 || 600 – 580 = 20 |


    | 7 || 630 || 630 – 600 = 30 |


    We can see that the differences (20, 10, 40, 10, 20, 30) don’t have a clear trend
    – they are not obviously increasing or decreasing.


    Step 2: Identify the ARIMA parameters (p, d, q)


    ARIMA has three main parameters:


    1.  p (auto regressive order): This is the number of past values (lags) the model
    looks at. For example, if p = 1, the model uses the previous one week’s sales
    to make predictions.


    2.  d (differencing order): This is the number of times the data is differenced
    to make it stationary. From Step 1, we differenced the data once, so d = 1.


    3.  q (moving average order): This is the number of past errors the model uses
    to make predictions. For example, if q = 1, the model uses the error from the
    last week.


    We’ll use p \= 1, d \= 1 and q \= 1 for this example (this is a common starting
    point).


    Step 3: Create the ARIMA model


    The ARIMA model combines the three components (AR, I, MA) to forecast future values.
    Here’s how it works:


    1.  AR: The model predicts the next value using the previous value(s), for example
    if sales increased by 20 phones last week, they might increase by 20 again this
    week.


    2.  I: The model works with the differenced data – changes in sales, not the raw
    sales.


    3.  MA: The model adjusts its prediction using past errors.


    Step 4: Fit the model to the data


    Let’s fit the ARIMA(1, 1, 1) model to our data:


    Formula for ARIMA(1, 1, 1):


    Forecast = (AR part)+(MA part)+(differencing part)


    AR part: This looks at the previous value.


    MA part: This adjusts for past errors.


    Differencing part: This accounts for the change between values.


    The ARIMA model predicts the next week’s sales using the next steps:


    Step 5: Forecast for Week 8


    1.  Start with the differenced data: From Week 7, the difference was +30 (change
    in sales from Week 6 to Week 7).


    2.  Use AR: Look at the previous difference (+30) to predict the next difference.
    If p = 1, the model assumes the next difference might be similar (i.e. close to
    +30).


    3.  Add MA: Adjust for past errors. Let’s say the model underestimated Week 7’s
    sales by 10 phones. The MA component corrects this by taking 10 from the prediction.


    4.  Combine everything: The model predicts the next difference as


    Next Difference = (Previous Difference) + (Error Adjustment)


    For our example:


    Next Difference = 30 + (−10) = 20


    Undo the differencing: To get the actual forecasted sales for Week 8, we add the
    predicted difference (+20) to the sales from Week 7 (630):


    Week 8 Sales = 630 + 20 = 650


    Step 6: Forecast for future weeks


    You can repeat this process for additional weeks. For Week 9:


    1.  Use the predicted difference from Week 8 (+20).


    2.  Add it to the predicted sales for Week 8 (650):


    Week 9 Sales = 650 + 20 = 670


    Final forecast:


    *   Week 8: 650 phones.


    *   Week 9: 670 phones.


    ![Images](images/f0084-01.jpg)


    KYD yourself


    When you are picking the AR order (p), differencing order (d) and the moving average
    order (q), you will need to know the context of your data. If there is something
    ‘special’ that happened as a one-off, this can affect how you look at the pattern
    or trend. A common problem for many time series analyses over the past few years
    has been the effect of the Covid pandemic – trends that would have followed through
    the years have been radically changed during a very different time. Knowing whether
    to include, exclude or deal with this data is important to the potential predictions.


    Evaluating time series models


    Metrics such as mean absolute percentage error (MAPE) and root mean squared error
    (RMSE) assess forecast accuracy.


    Business example


    An airline uses time series analysis to forecast passenger demand, thereby optimising
    flight schedules and pricing strategies.


    CLASSIFICATION


    Understanding classification'
