  trans: '


    - **保持联系**：这种策略适用于利益相关者有很大兴趣但权力较小的情况。在这种情况下，关键在于提供足够的信息和参与以满足他们的兴趣。

    - **持续关注**：如果利益相关者没有真正的权力和兴趣，那么对他们进行关注是明智的，以观察是否发生变化。如果发生了，就可以采用其他策略。


    这可以通过权力-利益矩阵（Newcombe, 2003）进行可视化处理，如 图 2.4 所示。你会发现这种矩阵有多个版本，其中一些更为复杂，包含了更广泛的管理策略。


    ### 图 2.4 通用权力-利益矩阵


    ![网格：四个象限 - 高权力、低兴趣：维持好关系；高权力、高兴趣：保持密切联系；低权力、高兴趣：保持联系；低权力、低兴趣：持续关注。](img/f0010-01.jpg)


    我们的手机项目利益相关者如 图 2.5 所示。这是一个简单的示例，为了清晰起见，你可以在每个框中放置多个利益相关者。我们将利益相关者放在特定的框中呢？


    ### 图 2.5 手机项目的权力-利益矩阵


    ![网格：四个象限：高权力、低兴趣：监管机构；高权力、高兴趣：赞助者；低权力、高兴趣：项目后期员工；低权力、低兴趣：项目早期员工。](img/f0011-01.jpg)


    - **赞助者**：这是他们的项目，他们对范围、资源和交付负责。因此，他们拥有高权力和高兴趣。

    - **监管机构**：监管机构对项目的兴趣有限（如果没有的话），但如果他们愿意可以干预——这赋予了他们高权力，但低兴趣。

    - **员工（项目后期）**：此时，员工已经了解了对他们影响（在本例中是转向一款不受欢迎的手机）。因为这一点，他们有高兴趣，但权力很小。

    - **员工（项目早期）**：对员工的影响尚未知，因此他们兴趣有限，权力也很小。


    ## 沟通计划


    使用权力-利益矩阵确定的策略可以用于创建沟通计划。这只是列出了将如何与利益相关者进行沟通。可以通过一对一会话、会议或书面更新来实现。这些可以是专门为项目设置的，也可以是现有的沟通渠道。


    手机分析的沟通计划示例如 图 2.6 所示。计划显示了如何与每个利益相关者小组进行沟通。拥有沟通计划可以降低不同利益相关者未能适当参与项目的风险。与利益相关者一样，沟通计划在整个项目过程中应该保持审查状态——它是一份动态文档。我们在
    第 13 章 中考虑了分析的沟通。


    值得注意的是，在这个例子中，沟通计划重点关注合规团队，他们在该项目中代表监管机构。他们了解法规，并在需要时代表项目向监管机构汇报。


    ### 图 2.6 手机项目的沟通计划


    ![项目利益相关者沟通计划：赞助者、监管机构、早期员工和后期员工。](img/f0012-01.jpg)


    关于利益相关者的最后一点：他们对问题和数据科学的理解程度各不相同。理解这一点并调整你的语言和解释以反映这一点是非常关重要的。


    ## 实用技巧


    - 在项目开始时考虑你的利益相关者是谁。

    - 利益相关者可能来自组织内部或外部。

    - 在整个项目过程中对你的利益相关者进行审查。

    - 考虑利益相关者的权力和兴趣，以指导你如何与他们互动。

    - 创建沟通计划（即使只是与经理的定期沟通）。

    - 思考与更广泛利益相关者小组相关的任何风险。


    ## 3 项目交付


    采用数据科学的项目有许多不同的形式。有些（例如药物研究）可能需要多年时间，而另一些可以在下午内交付。然而，它们都有一些共同的活动。


    如果你在一个小企业工作并希望预测明年的利润情况，你需要：弄清楚你正在做什么；寻找并准备数据；确定用于分析数据的方法；构建你的模型；评估结果；然后分享你的发现。如果你在制药公司负责医学试验，也需要同样的活动。然而，在第一种情况下，你可能一天内完成所有工作；而在后一种情况下，可能需要一个团队花费数年。


    因此，你需要考虑如何规划和管理这些活动。这包括理解要探索的问题空间，以及执行它所需的资源和时间。如果这样做之后项目看起来是可行的，你就不需要聚集这些资源，创建一个团队来交付并管理活动直到完成。


    ## 数据分析生命周期


    人们对数据科学的结果感到非常兴奋，但往往不理解获得该结果所付出的努力。数据分析生命周期是一个成功交付数据项目所需步骤的框架。它可以帮助规划工作和管理利益相关者的预期。


    生命周期有很多版本，而且像所有框架一样，它可以根据你的需求进行调整。我们在 图 3.1 中使用的版本用与数据科学相关的术语描述了步骤。


    外环显示了从发现到沟通的总体流程，而内环显示它是迭代的。步骤可以在任何点以任何次数返回并重新访问。循环性质也反映了在回答一个问题时会产生其他问题，因此存在从沟通返回到发现的流。


    每一步都对数据科学计划的成功做出贡献：


    - **发现**：考虑并定义分析将探索的问题，以及开展该分析所需的资源。


    ### 图 3.1 数据分析生命周期


    ![生命周期：显示了如发现、获取、准备、探索、创建、分析和沟通等阶段。在“沟通”和“发现”之外和之间给出了另一个运营化因素。](img/f0014-01.jpg)


    - **获取**：寻找可用于回答问题的可用数据。

    - **准备**：确保数据的质量和格式符合分析要求。

    - **探索**：研究回答问题的合适方法，以及使用可用数据构建有效模型的能力。

    - **创建**：构建用于分析的实际模型。

    - **分析**：评估已创建的模型。

    - **沟通**：分享从模型分析中获得的洞察。

    - **运营化**：将分析嵌入到组织的日常运行中。许多数据科学项目是一次性的调查，因此这一步骤并不总是发生。


    让我们回到手机故障示例。数据分析生命周期的步骤看起来是什么样的？


    - **发现**：我们可能会通过电子邮件或门户接收请求。可能会与赞助者进行讨论，以澄清他们从分析中需要。然后可能会通过电子邮件确认。

    - **获取**：在考虑了回答问题所需的数据后，我们可能会查看可用数据，以识别用于分析的合适数据集。


    '
