- raw: 'As we previously discussed, data science is an amalgamation of different disciplines,
    which in turn have their own branches and specialisms. This makes it a large and
    amorphous topic, which is rapidly forging new ground. In this book we have taken
    the essential core knowledge and set it out to form the foundations of data science.
    However, we don’t want this to be a dusty academic tome. So, to aid you in applying
    this knowledge to the real world, we have included case studies and practical
    tips.


    PRACTICAL TIPS


    *   You will always be learning; data science is a big topic.


    *   To be a data scientist, you need to embrace a range of skills and expertise.


    *   If in doubt about what someone means, ask them to clarify:


    *   People have different understandings of data science.


    *   Terminology can have different meanings in different contexts.


    2 STAKEHOLDERS


    When we do something, other people normally have a stake in it. The stake they
    have can vary. It might be that they contribute to it, benefit from it, are affected
    by it or have some other interest in it. These people are stakeholders. This is
    true of data science projects, which can have a wide range of stakeholders, as
    we will see in this chapter.


    It is fair to say that not all stakeholders are equal; not only are the reasons
    they have a stake different, but they also have different levels of interest in
    the project and different levels of ability to influence it. Let us imagine we
    work for a company that wants to understand whether the phones issued to employees
    are likely to develop a fault in the next six months. The person responsible for
    phones is going to be very interested in the outcome. They are likely to benefit
    from the project by being able to make better informed decisions in their role.
    They are also likely to have a lot of influence over the project as they have
    responsibility for the area that is being investigated. Conversely, if you have
    a phone provided by the company, you could be affected by the outcome of the investigation
    – your phone’s reliability might be improved. However, it is unlikely that you,
    as one phone user, will have influence over the project and it is likely that
    other things will be higher on your priority list than this project. These different
    levels of interest and influence – or power, as influence is often termed – determine
    how we engage and communicate with the various stakeholders.


    Data science projects can have a far-reaching impact, as we have seen in [Chapter
    1](#12_ch01.xhtml), when looking at smoking and cancer. This means that the stakeholders
    can be quite removed from the immediate project. We saw above that employees were
    likely to have little interest or power over the investigation of phone reliability,
    but what about former employees, people who have left the company, but whose phone
    usage data is used in the analysis? They are further removed but still a stakeholder.


    As we will see in [Chapter 4](#15_ch04.xhtml), when looking at ethics and lawfulness,
    understanding the wider group of stakeholders is essential for good data science.
    This is particularly important when people’s data is being used, and they should
    be seen a key stakeholder in any project regardless of their power over and interest
    in it.


    IDENTIFYING STAKEHOLDERS


    In [Chapter 1](#12_ch01.xhtml) we suggested you think about the stakeholders in
    the analysis of the link between smoking and cancer. Who did you come up with?
    One simple view of the stakeholders is shown in [Figure 2.1](#13_ch02.xhtml#fig2.1).
    We have made it generic and from the standpoint of one tobacco company.


    Figure 2.1 Stakeholders in the research looking at the link between smoking and
    cancer


    ![Radial Diagram: Various stakeholders related to the tobacco industry.](images/f0005-01.jpg)


    The question you might be asking is why each of the groups shown is a stakeholder
    in the analysis. The simple answer is that they all have a stake in undertaking
    the analysis and/or its outcome. The stakes in our example are:


    *   Research institutes: These are the institutes carrying out the analysis for
    the tobacco company. They are doing the work.


    *   Tobacco farmers: If the analysis shows (as it did) that smoking is harmful
    it could impact their businesses.


    *   Health boards: The outcome of the analysis is likely to influence public policy
    and health care provision.


    *   Cigarette production line workers: Like the tobacco farmers, their livelihoods
    could be impacted by the analysis.


    *   Company directors: The analysis will influence decisions they make, and hence
    the future of the company.


    *   Company shareholders: The return they get on their investment in the company
    could be impacted by the research.


    *   Other tobacco companies: The findings of the analysis could impact their business
    in the same way as it impacts the tobacco company commissioning the analysis.


    *   Smokers: If the analysis shows that smoking is linked to cancer, they might
    change their smoking habits. They also need to provide their data to make the
    data science happen.


    *   Potential smokers: Like smokers, the findings might influence their view of
    smoking and ultimately whether they take it up or not. Their data is also needed
    for the research.


    *   Health service providers: These are the bodies that provide health care, which
    might be public or private. Showing a link with cancer could impact how they treat
    patients with smoking-related cancers and the health care advice they give.


    The stakeholders go much wider than this. If we think about the health implications
    of smoking, then the funders of health care, whether insurance companies or taxpayers,
    will be interested. This in turn would create interest from people paying for
    services. In fact, the public’s interest in the first instance is likely to be
    driven by wider health concerns rather than the financial implications. By this
    point, both politicians and governments will be showing an interest.


    It isn’t always obvious who is going to be interested in a data science project.
    It is unlikely those who developed the dynamic pricing for concert tickets would
    have expected this to draw comment from the United Kingdom’s prime minister. Those
    comments came following the public reaction to prices charged for the Oasis 2025
    tour (McArthur and Youngs, 2024).


    From the above, we can see that a wide range of people have a stake in the analysis.
    Understanding who they are and why they have a stake in the analysis is important.
    This can affect how a problem is framed and how the outcome is communicated, including
    who to. More importantly, who the stakeholders are needs to be understood to identify
    any ethical issues – if they are not clear, ethical considerations might not be
    apparent.


    The stakeholder wheel


    The representation of the smoking and cancer stakeholders above uses the ‘stakeholder
    wheel’ ([Figure 2.2](#13_ch02.xhtml#fig2.2)). This is a useful framework for helping
    to identify the stakeholders in any piece of analysis. It sets out the different
    categories of stakeholder, and these can be considered to see if they apply to
    your project.


    Figure 2.2 The stakeholder wheel


    ![Wheel diagram: Stakeholders in the middle surrounded by labels representing
    various stakeholder groups: Society, Partners, Suppliers, Regulators, Employees,
    Managers, Owners, Competitors, Customers, and Data subjects.](images/f0006-01.jpg)


    The categories are:


    *   Partners: These are organisations that provide specialist services to an organisation.
    These include organisations to whom data services are outsourced.


    *   Suppliers: These are organisations that provide the goods and services an
    organisation uses. These could be impacted by analysis that is undertaken, for
    example changes in demand for their goods and services or in contractual terms
    because of a data science project.'
