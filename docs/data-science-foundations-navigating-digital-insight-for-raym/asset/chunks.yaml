- raw: 'Using the formula for the correlation coefficient, the value for these two
    sets of data gives us an answer of –0.97. As the value can only go between +1
    and –1, this shows there is a very strong negative correlation – the more hours
    spent gaming, the lower the test score.


    It is worth noting that ‘Test score’ is shown on the vertical, or y, axis and
    ‘Hours gaming’ is shown on the horizontal, or x, axis. It is normal practice to
    use the y axis for the variable that you think changes based on the other one.
    In this case, we are saying that the test scores are aligned to gaming hours.
    (You could also argue that ‘Hours gaming’ is not the cause of the test scores,
    but that is a debate to be held.)


    ![Images](images/f0076-01.jpg)


    KYD yourself


    Correlation can happen by chance between two completely independent things. For
    examples, the number of people streaming TV programmes is rising steadily, as
    is the Earth’s average surface temperature. You are likely to be able to show
    a positive ‘correlation’ figure between these two things but that does not necessarily
    mean there is a relationship between the two things. Understanding the context
    of the data and whether there could be a relationship between them is absolutely
    critical.


    You should also be aware of people using the word ‘correlated’ without any backup
    information. Don’t be afraid to ask about the data that has been used and exactly
    how strong (or weak) the correlation is.


    Business example


    A marketing team uses correlation analysis to identify the relationship between
    advertising spend and sales revenue, guiding budget allocation decisions. Are
    sales impacted by the amount of television adverts broadcast?


    STATISTICAL MODEL: LINEAR REGRESSION


    What is linear regression?


    Imagine you’re trying to predict how much your plant will grow based on how much
    water you give it. Linear regression is like drawing a straight line through a
    bunch of data points to show the relationship between these two things. It helps
    us to understand how one thing changes when another thing changes.


    Linear regression models the relationship between a continuous target variable
    and one or more predictor variables by fitting a linear equation to the data.


    When to use linear regression:


    *   Predicting outcomes: If you want to forecast what might happen in the future
    based on past data, for example predicting how many ice creams you’ll sell based
    on the temperature.


    *   Understanding relationships: If you want to see how two things are connected,
    for example seeing if there’s a link between hours of study and exam scores.


    *   Finding trends: If you want to spot patterns in data, for example seeing if
    sales increase steadily over time.


    The output


    Linear regression will produce an equation that shows how a variable is affected
    by one or more other variables. It will give weightings to each of the variables,
    and you can use this equation to predict other outcomes by inputting different
    values.


    An example is:


    y = 2.2x + 0.5


    We can put a value in for the x part of the equation, say 10, and the calculation
    would give us an answer of the y value being 2.2 × 10 + 0.5 = 22.5. We can tell
    that, when x is 10, y is likely to be 22.5.


    The formula


    For a single predictor variable, the linear regression equation is:


    y = β[0] + β[1]x + εy


    where:


    *   y is the predicted value.


    *   β[0] is the intercept.


    *   β[1] is the slope (coefficient) of the predictor variable x.


    *   ε is the error term.


    Now, what does this actually mean? Well, linear regression models one (or more)
    things against another. For example, we could be looking at how many mobile phones
    fail as they get older. If the number of phones failing increases as their age
    increases, we may be able to predict how many phones will fail after a number
    of years. In this equation, y is the number of phones, and x the number of years.
    If we can come up with a pattern, then the other parts of the equation just tell
    us the scale of the problem and what the starting point is.


    ![Images](images/f0078-01.jpg)


    What does it look like?


    Let’s try an example of looking at how mobile phones fail over time.


    If we had the following data, we could plot this to see if there are any patterns.


    | Phone age (years) || Battery capacity (%) |


    | --- | --- |


    | 0 || 100 |


    | 1 || 97 |


    | 2 || 93 |


    | 3 || 90 |


    | 4 || 84 |


    | 5 || 79 |


    | 6 || 72 |


    | 7 || 65 |


    The plot would show a trend for battery capacity reducing with age, as shown in
    [Figure 10.3](#21_ch10.xhtml#fig10.3).


    Figure 10.3 Plot chart of battery capacity


    ![Graph: A first quadrant plane with horizontal axis showing phone age in years
    from 0 to 8, and vertical axis showing battery capacity from 0 to 100 in 10 increments.
    Points are shown at 0 comma 100; 1 comma 97; 2 comma 93; 3 comma 90; 4 comma 84;
    5 comma 79, 6 comma 72 and 7 comma 65. ](images/f0078-02.jpg)


    A natural next step is to add a line of best fit, showing the direction that the
    data is headed in. This line of best fit is actually calculated using linear regression
    ([Figure 10.4](#21_ch10.xhtml#fig10.4)).


    Figure 10.4 Linear regression of battery capacity


    ![Graph: A first quadrant plane with horizontal axis showing phone age in years
    from 0 to 8, and vertical axis showing battery capacity from 0 to 100 in 10 increments.
    Points are shown at 0 comma 100; 1 comma 97; 2 comma 93; 3 comma 90; 4 comma 84;
    5 comma 79, 6 comma 72 and 7 comma 65. ](images/f0079-01.jpg)


    The line has an equation; in this case it is y = −4.9762x + 102.42. We can use
    this equation to ‘try-out’ different values of x (the age of the phone). This
    could lead to a prediction on what the capacity is after 10 years.


    Evaluating model performance


    There are some technical measures that can quantify how well the model is performing.
    It can be evaluated using metrics such as mean absolute error (MAE), mean squared
    error (MSE) and R-squared. These metrics assess how well the model’s predictions
    align with actual values.


    Example:


    *   MAE: This is the average absolute difference between predicted and actual
    values.


    *   MSE: This is the average squared difference, highlighting larger errors.


    *   R-squared: This is the proportion of variance in the target variable explained
    by the model.


    ![Images](images/f0079-02.jpg)


    KYD yourself


    Linear regression is quite a straightforward technique to apply. The key warnings
    when using it with your data are related to the ‘linear’ approach. A lot of real-life
    data does not follow a nice, simple straight-line approach. Imagine the battery
    capacity prediction: do we really think that it will take 20 years for the battery
    to be 0 per cent capacity? Or do we think that after 10 years things are going
    to be behaving quite differently?


    Business examples


    *   Weather forecasting: Meteorologists use linear regression to predict tomorrow’s
    temperature based on today’s weather patterns.


    *   Business decisions: Companies use it to forecast sales, plan inventory and
    set prices.


    *   Medical research: Doctors use it to understand the relationship between risk
    factors and diseases.


    PREDICTING VALUE OVER TIME: TIME SERIES ANALYSIS


    Time series analysis involves forecasting future values based on historical data
    collected over time, used in various domains to predict trends and patterns. When
    we look at data across time, things might be more complicated than a straight
    line (as we saw in linear regression). Often, we can see movements across different
    times of year – think about sales around Christmas. Many time series analysis
    methods take account of this ‘seasonality’ and use mathematical techniques to
    model them. The equations used in these methods are more complex and beyond the
    scope of this book, but the modern data scientist would use tools to run the models,
    so the important priority is understanding what the model shows rather than the
    calculations themselves.'
