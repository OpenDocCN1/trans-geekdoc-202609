    \ the use of them being described as deep learning.\n\n# Artificial Intelligence\n\
    \nNASA describes AI in relation to complex tasks normally performed by humans.\
    \ AI is sometimes split into narrow AI and general AI. This is to distinguish\
    \ between AI that can do specific tasks a human and AI that can do all tasks ([Figure\
    \ 14.3](#25_ch14.xhtml#fig14.3)).\n\n## Narrow AI\n\nNarrow AI is AI that is designed\
    \ to perform a specific task. As such, it only has a narrow range of capabilities.\
    \ In the last century, you would need to look at the images of the road to identify\
    \ them: a human task. We can now use ML to do this. This ML is performing a narrow\
    \ AI task. It can identify potholes, but is unlikely to be able to spot missing\
    \ tiles. It is good at one specific task that would previously involved a human.\n\
    \n## General AI\n\nGeneral AI is AI that can handle all the tasks that a human\
    \ can undertake. At the time of writing, general AI has yet to be created. AI\
    \ that goes beyond human capabilities is referred as super AI.\n\n## Generative\
    \ AI\n\nGenerative AI has a different meaning from general AI, although they sound\
    \ very similar. This type of AI is called generative as it generates new data.\
    \ Depending on the model being used, this can be in different forms including\
    \ images, words and sounds. This AI is seen as being creative because it produces\
    \ new material that, due to the data it is built on, is meaningful. Therefore,\
    \ it might generate computer code that works or a picture of a subject and in\
    \ a style that people relate to. Generative AI is not general AI, it still lacks\
    \ all human capabilities. Take large language models: these are a type of generative\
    \ AI that create text reflecting natural language. Although not covering all human\
    \ capabilities, they can be applied to many different tasks requiring the generation\
    \ of natural language whether it be a chatbot to book an appointment or advice\
    \ on data protection.\n\nFigure 14.3 Hierarchy of AI definitions ![Nested Diagram:\
    \ AI is the largest, containing Narrow AI, which contains Generative AI, which\
    \ encloses Foundation models.](images/f0132-01.jpg)\n\n# Foundational Models\n\
    \nFoundational models are a form of generative AI. They are trained using extremely\
    \ large quantities of diverse data. This creates a model that is pre-trained and\
    \ can be adapted to different uses. As a result, new applications can be created\
    \ much quicker and at significantly lower cost than would otherwise be the case.\
    \ Foundational models work by predicting the next item in a sequence. In the case\
    \ of language, this might be the next letter or word. The sequence then builds\
    \ up into a comprehensible and meaningful language.\n\n# Risks of AI\n\nWe will\
    \ take a step back from the end of the world as an AI risk and focus on the more\
    \ technical risks relating to AI outputs. The main risks can be summarised as:\n\
    \n*   `Bias`: Does the AI produce outputs that are in some way biased?\n*   `Hallucination`:\
    \ Has the AI made something up, so the output is in some way incorrect?\n*   `Transparency`:\
    \ Can you understand how the AI has reached the outcome it has?\n*   `Privacy`:\
    \ Do you understand, and are you happy with, the way the data you have provided\
    \ is being used?\n\nIn using AI within your work, it is important to understand\
    \ your organisation’s policy in relation to AI. This will be designed to help\
    \ mitigate these risks.\n\n# Regulation of AI\n\nThere are different approaches\
    \ to the regulation of AI. The UK has a ‘pro-innovation’ approach to AI regulation.\
    \ This sets out five principles to be used by regulators, to regulate the use\
    \ of AI within their specific sectors (Department for Science, Innovation and\
    \ Technology, 2023). These are aligned to the risks outlined above and expressed\
    \ as:\n\n*   `safety, security and robustness`\n*   `appropriate transparency\
    \ and explainability`\n*   `fairness`\n*   `accountability and governance`\n*\
    \   `contestability and redress`\n\nThe USA also has a pro-innovation approach\
    \ to regulation. This can be compared to China, who regulates specific AI products\
    \ (e.g. generative AI).\n\nThe EU was seen to take the lead on data protection\
    \ and might be seen to be doing the same in relation to AI regulation. This is\
    \ through the `AI Act 2024`, which provides a set of controls on AI based on the\
    \ potential risk the AI poses. It is also proposing legislation to make it easier\
    \ to seek redress where AI causes loss or damage (European Parliament, n.d.).\n\
    \n Practical Tips\n\n*   Use the language of data science, ML and AI in a way\
    \ that is meaningful to your audience.\n*   Consider the risks relating to each\
    \ particular use of AI.\n*   Before adopting a complex or expensive solution,\
    \ consider if a simpler, cheaper one would be equally effective.\n*   Remember\
    \ that ethics and lawfulness relate to the use of data in AI.\n"
  trans: "\n如果你仔细考虑，当你知道自己在寻找什么时（在我们的案例中是路水坑），监督学习是非常棒的。在这些情况下，无监督学习可能没有那么有效。例如，在观察道路图像时，它可能会检测到与人行道是否存在或图像捕捉时间相关的模式。然而，当你不确定要预测什么时，无监督学习就能发挥它的作用，例如如果你正在寻找模式来帮助发现故障，但不知道这些故障长什么样。\n\
    \n可以将这些方法结合，以实现监督学习和无监督学习的优点。\n\n# 数据科学与机器学习\n\n数据科学用于开发机器学习。如果你看我们的图像识别示例，你会看到我们探索过的一些数据科学方法正被应用。在我们的监督机器学习中，使用分类来识别路水坑。在我们的无监督机器学习中，我们正在使用聚类来确定道路的状况。\n\
    \n# 神经网络\n\n神经网络是机器学习的一个分支，也是人工智能的基础。它们试图模拟大脑的工作方式，通过神经元之间的不同连接在响应输入时发射，从而产生输出。如果你看到一个球向你飞来（`input`），你会决定（`神经元发射`）是否接住它（`output`）。\n\
    \n这里提供的神经网络解释是简单的，旨在提供基础理解。神经网络由层层节点（也称为神经元）组成。一层的节点与相邻层的节点连接。其中一层是输入层，一层是输出层。之间可能有一层或多层节点（图\
    \ 14.2）。\n\n当节点接收到输入时，它会为下一层的节点提供一个值。该层中的每个节点将根据来自上一层的输入计算出一个值，并发送到下一层。这个过程不断重复直到到达输出层，那里是返回结果的地方。\n\
    \n图 14.2 神经网络 ![图：一个包含一个输入节点、两个隐藏层和一个输出节点的简单神经网络图。连接器显示了节点之间的信息流。](img/f0131-01.jpg)\n\
    \n每个连接都有一个与其相关的权重。发送节点的值通过连接器的权重进行调整，下一层节点接收到的是这个调整后的值。节点接收到的值会被相加，并根据该节点的唯一值进行调整。这决定了发送到下一层的值。在训练神经网络时，每个连接器相关的权重会不断改变，直到神经网络返回一个最佳结果。这种学习方法被称为`back\
    \ propagation`。它通常与强化学习一起使用，强化学习与环境交互来最大化奖励。\n\n更复杂的神经网络版本用于生成式 AI。这些网络有许多层，大量的层导致它们被描述为深度学习。\n\
    \n# 人工智能\n\nNASA 结合人类通常执行的复杂任务来描述人工智能。人工智能有时分为狭义人工智能（Narrow AI）和通用人工智能（General\
    \ AI）。这是区分可以执行特定任务的人工智能和可以执行所有任务的人工智能（图 14.3）。\n\n## 狭义人工智能\n\n狭义人工智能是为了执行特定任务设计的。因此，它的能力范围很窄。在上个世纪，你需要观察道路图像来识别它们：这是一项人类任务。我们现在可以使用机器学习来做到这一点。这种机器学习正在执行狭义人工智能任务。它可以识别路水坑，但不太可能发现缺失的瓷砖。它擅长于以前需要人类完成的特定任务。\n\
    \n## 通用人工智能\n\n通用人工智能是能够处理人类可以承担的所有任务的人工智能。在编写此时，通用人工智能尚未被。超越人类能力的人工智能被称为超级人工智能。\n\
    \n## 生成式人工智能\n\n生成式人工智能与通用人工智能含义不同，尽管它们听起来非常相似。这种人工智能被称为生成式，因为它生成了新的数据。根据所使用的模型，这可以是不同的形式，包括图像、文字和声音。这种人工智能被认为是具有创造力的，因为它产生了新的材料，由于其构建的基础数据，这些材料是有意义的。因此，它可能会生成运行的计算机代码或以人们产生共鸣风格的主题图片。生成式人工智能不是通用人工智能，它仍然缺乏所有人类能力。以大语言模型：它们是生成式人工智能的一种类型，创建反映自然语言的文本。虽然没有涵盖所有人类能力，但它们可以应用于许多需要生成自然语言的任务，无论是用于预约的聊天机器人，还是关于数据保护的建议。\n\
    \n图 14.3 人工智能定义层级 ![嵌套图：人工智能是最大的，包含了狭义人工智能，狭义人工智能包含了生成式人工智能，后者包含了基础模型。](img/f0132-01.jpg)\n\
    \n# 基础模型\n\n基础模型是生成式人工智能的一种形式。它们使用海量的多样化数据进行训练。这创建了一个预训练的模型，并可以适应不同的用途。结果是，创建新应用程序可以比其他情况快得多，成本也显著低得多。基础模型通过预测序列中的下一个项目来工作。在语言情况下，这可能是下一个字母或单词。然后序列汇聚成可理解且有意义的语言。\n\
    \n# 人工智能风险\n\n我们将从“世界末日”式的 AI 风险跳出来，专注于与 AI 输出相关的更技术风险。主要风险可以总结为：\n\n*   `Bias`：AI\
    \ 是否产生了某种程度上带有偏见的输出？\n*   `Hallucination`：AI 是否编造了某些内容，导致输出在某种程度上是不正确的？\n*   `Transparency`：你能否理解\
    \ AI 是如何得出其结果的？\n*   `Privacy`：你是否理解并满意你提供的数据的使用方式？\n\n在工作中使用 AI，了解贵机构有关 AI 的政策至关重要。这将有助于降低这些风险。\n\
    \n# 人工智能监管\n\n人工智能的监管有不同的方法。英国对 AI 监管采取“亲创新”的方法。这规定了监管机构使用的五项原则，以监管其特定部门内 AI 的使用（科学、创新和技术部，2023）。这些原则与上述概述的风险对齐，并表达为：\n\
    \n*   `safety, security and robustness`\n*   `appropriate transparency and explainability`\n\
    *   `fairness`\n*   `accountability and governance`\n*   `contestability and redress`\n\
    \n美国也采取亲创新的监管方法。这可以与中国相比，中国监管特定的 AI 产品（例如生成式 AI）。\n\n欧盟被认为在数据保护方面处于领先，并在 AI 监管方面可能被视为这样做。这是通过《2024\
    \ 年 AI 法案》实现的，该法根据 AI 带来的潜在风险提供了一系列控制措施。它还提议立法，以便在 AI 导致损失或损害时更容易寻求救济（欧洲议会，无日期）。\n\
    \n 实用技巧\n\n*   以对你的观众有意义的方式使用数据科学、机器学习和人工智能语言。\n*   考虑与 AI 的每种特定用途相关的风险。\n*  \
    \ 在采用复杂或昂贵的解决方案之前，考虑更简单、更便宜的方案是否同样有效。\n*   记住伦理和合法性与 AI 中数据的使用有关。\n\n"
