- raw: 'The use of the four pillars is shown in the draft storyboard in [Figure 13.5](#24_ch13.xhtml#fig13.5).
    Symbols are used to illustrate the subject and themes within the narrative; captions
    are used to signpost the meaning of the symbols; contrast is used to show the
    forecast NPS and additional contact time that could make a difference to customer
    satisfaction. Finally, the editorial layout supports telling the story in five
    steps.


    RECOMMENDATIONS


    Recommendations will often flow from investigating our problem and testing our
    hypothesis. However, it is very easy to make recommendations to address something
    our investigation has revealed that are not backed up by the hypothesis testing
    or other evidence.


    Going back to our contact centre example, we recommend that contact time is increased
    to improve customer satisfaction. However, we don’t know that this is the case
    from the analysis we have undertaken. Yes, satisfaction is forecast to continue
    to fall, and yes there is correlation between contact time and satisfaction. That
    doesn’t mean that shorter contact time is the cause of lower customer satisfaction.
    It is a theory, hence the proposal of A/B testing to develop understanding.


    When putting forward recommendations, be clear as to which can be evidenced and
    which are only theories.


    OPERATIONALISE


    Where there is an ongoing need for the knowledge, then there is a need to operationalise
    the production of a report. This might be through repeating the process you have
    used to investigate the problem and test your hypotheses. However, this process
    might need to change to deliver a good user experience.


    At this point it is worth revisiting the stakeholder needs. They are likely to
    be different from a one-off investigation. A key question is how frequently they
    need the report and when it needs to be received by. Also, the scope of the information
    required might change. In this instance, the problem will need to be reframed.
    There might also be benefit in automating the process, both to speed up its production
    and to increase trust by reducing errors.


    PRACTICAL TIPS


    *   Understand your audience and their needs.


    *   Consider all aspects of the user experience.


    *   Ask what knowledge can be derived from the information obtained from your
    models.


    *   Thinking about the domain should assist in generating knowledge from information.


    *   Consider who or what the subject of the story should be.


    *   Plan the story you want to tell and how you will visualise it.


    *   Beware of telling a story people want to hear, rather than the one that should
    be told.


    14 MACHINE LEARNING AND ARTIFICIAL INTELLIGENCE


    In [Chapter 1](#12_ch01.xhtml) we recalled the dystopian future of Terminator:
    a future where machines have taken over the world and determine to eradicate humans.
    This has been a reference point for many of those writing about the risks of artificial
    intelligence. But what is artificial intelligence? How does machine learning relate
    to it? Where does data science fit into this?


    As with so many other terms we have come across, there is no consensus on the
    term artificial intelligence. The UK government define it by its adaptivity and
    its autonomy (Department for Science, Innovation and Technology, 2023). This is
    looking at AI from a technology and risk perspective, the adaptative and autonomous
    characteristics of the technology making it difficult to explain, predict and
    control. A similar approach is taken to defining AI in Section 3 of the EU’s Artificial
    Intelligence Act, which also refers to adaptiveness and autonomy (European Union,
    2025), these characteristics allowing the AI system to infer and act on implicit
    as well as explicit objectives. Both of these definitions have been drafted in
    relation to regulating AI. A step back from these takes us to a wider definition,
    which NASA has succinctly stated as:


    Artificial intelligence refers to computer systems that can perform complex tasks
    normally done by human-reasoning, decision making, creating, etc. (NASA, 2024)


    Therefore, we can see AI as adaptive and autonomous technology that performs tasks
    that have previously been the preserve of humans. This includes a wide range of
    applications, from dealing with a customer query to creating visual images – taking
    on the human roles in both call centres and creative endeavours.


    AI is currently built on digital technology, and a key component of this is machine
    learning (ML). What is machine learning? Well, it is a machine that can learn.
    We can think of this as software that is designed to perform a task or tasks,
    whose performance of the task improves the more it undertakes the task (Mitchell,
    1997). AI is built on complex ML techniques that give it the ability to adapt
    and act autonomously.


    That’s great, but where does data science fit into this? Data science is fundamental
    to ML. Machine learning is based on the application of algorithms (based on algebra,
    statistics and probability) to data, which – as you know – is data science.


    To summarise, data science methods are used to develop ML. ML can be applied to
    data science problems and to create AI ([Figure 14.1](#25_ch14.xhtml#fig14.1)).
    This means that, to an extent, the terminology can be used interchangeably, for
    example image recognition technology could be the application of data science,
    the use of ML or an example of AI.


    Figure 14.1 The relationship between data science, machine learning and artificial
    intelligence


    ![Flow chart: Data science used to develop machine learning, which used to create
    artificial intelligence.](images/f0129-01.jpg)


    MACHINE LEARNING


    We have defined ML as software that is designed to perform a task or tasks, and
    the performance of the task improves the more it undertakes the task. Let’s take
    image recognition, a technology that uses ML: the more images you show it, the
    better it will be at identifying the images. How does it do this?


    Training and predicting


    For ML to work, the models need to be trained. Only when it has been trained can
    it be used to predict.


    Training involves exposing the ML to data from which it can learn. What if you
    were asked to develop image recognition to determine whether there were potholes
    in the road? How would you train it? In this instance, you could train it by allowing
    the ML to consume many images of roads with potholes and those without.


    Once the ML has been trained, it can be used to predict. In our example, our image
    recognition system could be shown an image of a road and it would predict whether
    the road has potholes in it or not. A classification model.


    Learning approaches


    There are two common methods of learning: supervised and unsupervised.


    Supervised learning


    In supervised learning, the data used is labelled or tagged. This allows the ML
    to identify the patterns in the data associated with labels. The more data it
    consumes, the better the data patterns associated with the labels, and thus the
    better the ML is at applying labels based on the data presented.


    How would this work with our pothole images? In this instance, you might expose
    lots of images of roads to the ML. Those with potholes in them would be labelled
    ‘pothole’, and those without wouldn’t. The ML would identify the patterns in the
    data associated with the ‘pothole’ label and, when shown an image with those patterns,
    would identify them as being associated with the label ‘pothole’, thus allowing
    potholed roads to be identified.


    Unsupervised learning


    In the case of unsupervised learning, the data used is not labelled or tagged.
    Instead, the ML looks for patterns within the data. It can then cluster the data
    based on those patterns.


    How would this work for pothole detection? Simply put, the ML would consume images
    of roads with and without potholes. It would detect patterns in the data that
    distinguished the pothole images from those without, in effect creating two clusters:
    those with and those without potholes.'
