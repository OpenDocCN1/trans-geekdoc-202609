- raw: "By combining both types of research, you’ll gain a deeper, more comprehensive\
    \ understanding of your problem, the data and the best approach to arrive at a\
    \ solution. This holistic view increases the chances of your results being successful\
    \ and effective.\n\nTHINGS TO NOTE\n\nThe world of data is rapidly changing the\
    \ way we work. The ‘traditional’ methods of analysing and summarising data should\
    \ be challenged. The sheer quantity of data available to us can be daunting, and\
    \ knowing how to ‘pull’ the right parts from this will take some time and effort.\
    \ Before you even think about extracting data, you should look into what data\
    \ you could use. Qualitative data is much easier to handle than it ever used to\
    \ be, especially when used with tools that AI can support. These views of data\
    \ can add to or change the perceptions of management and the direction of the\
    \ company strategy. If you are thinking even further ahead, question what other\
    \ types of data there could be. Could images or video add any useful information\
    \ and, if so, how do you get at that data as part of your sample?\n\n7 SOURCING\n\
    \nOne of the key ingredients of data science is, as the name applies, data. As\
    \ we have discussed in the previous chapter, the data used in any project can\
    \ be the difference between a good outcome and a bad one. To be clear, a good\
    \ outcome isn’t just proving a hypothesis. Failing to prove a hypothesis can be\
    \ equally valuable, potentially avoiding making a poor decision based on a false\
    \ premise.\n\nSourcing data isn’t just about finding some data, it is about ensuring\
    \ the data set contains the data items needed and has the right data properties\
    \ to allow the analysis. In some instances, the source data might need to be manipulated\
    \ to derive data. In [Chapter 8](#19_ch08.xhtml) we have an example of this in\
    \ data granularity, where daily data is used to calculate a monthly figure.\n\n\
    Remember, just because data is available, it doesn’t mean that you can use it.\
    \ There are both legal and ethical constraints that need to be considered. These\
    \ are addressed in [Chapter 4](#15_ch04.xhtml).\n\nBIG DATA\n\nData is everywhere\
    \ in the world around us. We are surrounded by the radio frequencies that carry\
    \ data for the devices we use every day. This data permeates all aspects of our\
    \ lives, whether it is checking social media or tapping a payment card to travel\
    \ on the Tube. The acceleration in data has led to the term Big Data and three\
    \ concepts relating to it: volume, velocity and variety. These are known as the\
    \ 3Vs ([Figure 7.1](#18_ch07.xhtml#fig7.1)), and can be useful in helping us to\
    \ consider some of the challenges related to sourcing data.\n\n*   Volume: This\
    \ considers the amount of data that is generated. Think about how much data a\
    \ quick coffee stop can generate. As you walk through the door, the security camera\
    \ will record you, the coffee machine will log its use, your payment will be recorded\
    \ and that’s all before you hit social media while you enjoy the caffeine hit.\
    \ If you look at all the activities in a day that generate data, both human and\
    \ automated, that’s a lot of data.\n\n*   Velocity: Think about the speed at which\
    \ the data is created and processed. The camera is a real-time recording, the\
    \ payment is processed in the time it takes to say ‘thanks’, the coffee machine\
    \ will instantaneously flag if it needs attention (after all, time is money) and\
    \ your social interaction is co-temporal. As you can see, much of the data around\
    \ us is moving fast – very fast.  \n\n    Figure 7.1 The 3Vs of Big Data\n\n \
    \   ![Pyramid diagram: Big Data at the center, surrounded by Volume, at the top,\
    \ Velocity on the left, and Variety on the right, representing the three Vs of\
    \ big data.](images/f0041-01.jpg)\n\n*   Variety: We can see the variety of data\
    \ being created. We have the unstructured data of video and social media alongside\
    \ the structured data of the payment and internet of things (the coffee machine\
    \ sending its data). If we want to use this data, we need to be able to store\
    \ it and, equally important, be able to access it.\n\nOther Vs have been added\
    \ to the 3Vs, and reference is often made to the 5Vs.\n\n*   Veracity: This relates\
    \ to the quality and accuracy of the data. Data quality is covered in more detail\
    \ later in this chapter.\n\n*   Variability: Organisations might have inconsistencies\
    \ in their data. Take employees: in one system this might refer to people with\
    \ employment contracts, in another it might include agency staff.\n\nFor us as\
    \ data scientists, this all creates challenges in identifying and accessing the\
    \ data we need. It can also cause issues as we address the constraints of storing\
    \ and processing the data.\n\nDATA COLLECTION\n\nWe talked about several different\
    \ sources of data when having our coffee break. These use different methods to\
    \ collect the data:\n\n*   Cameras record digital images, which are data. These\
    \ can be video or still images.\n\n*   Sensors automatically record data and frequently\
    \ send it to a central data repository. This includes the coffee machine recording\
    \ usage and flagging any issues.\n\n*   Transferred data occurs when you add your\
    \ favourite snack to the coffee, because the barista might scan the barcode on\
    \ it, transferring data from the item to the point-of-sale system. The same is\
    \ true when you tap your card to pay for it, your details on the card are read\
    \ by the system.\n\n*   Human entry via keyboards, mice, touch screens and other\
    \ data entry devices. In the coffee shop, the barista might use a touch screen\
    \ to record the sale of your coffee. You also enter data when you give the coffee\
    \ shop a five-star review on the shop’s app.\n\n*   Derived data is created when\
    \ existing data is taken and manipulated to develop a new data set. The coffee\
    \ shop might take all your coffee transactions and determine from this what customer\
    \ persona you fit.\n\n*   Synthetic data is created when a data set is artificially\
    \ generated. This can be beneficial where there is limited real-world data or\
    \ concerns exist about its quality. In some instances, rather than using actual\
    \ customer data, an organisation will synthesise customer data to overcome privacy\
    \ concerns.\n\nIt is also worth considering how these different collection methods\
    \ can be joined. Let’s take our coffee machine. Its sensors record how hot the\
    \ water is. This data is then transferred to head office. Here, an algorithm is\
    \ applied using this and other data to determine whether the machine needs a service,\
    \ resulting in a request to maintenance, where a service call is automatically\
    \ scheduled. This is an example of the internet of things in action, where devices\
    \ collect and share information with each other.\n\nWhen we collect data from\
    \ people, it is often in the form of having them enter data into a system or complete\
    \ a survey. We consider the risks relating to this and how they can be mitigated\
    \ further on in this chapter.\n\nPRINCIPLES OF DATA: DATA TYPES\n\nIn sourcing\
    \ data, different types of data can be considered. The data types we are considering\
    \ here are the data types associated with the principles of data. The term ‘data\
    \ type’ is used in different contexts, where it has a different meaning, an example\
    \ being data types used by computers. We can think of the principles of data,\
    \ data types, as indicating the availability of data and the reason for its creation\
    \ ([Figure 7.2](#18_ch07.xhtml#fig7.2)). The difficulty with these labels is that\
    \ they can have slightly different meanings depending on who you are talking to.\
    \ If you come across these terms, it is always worth checking which are relevant\
    \ and their meaning in the context you find them.\n\nAvailability refers to how\
    \ accessible the data is, and has three broad categories:"
