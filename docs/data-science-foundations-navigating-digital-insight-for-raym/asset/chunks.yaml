    使用相关系数公式，这两组数据得出的结果为 –0.97。由于该值只会在 +1 和 –1 之间变化，这表明之间存在极强的负相关性——游戏时间越长，测试分数越低。


    值得注意的是，“测试分数”显示在垂直轴（或 `y` 轴）上，而“游戏时间”显示在水平轴（或 `x` 轴）上。做法是用 `y` 轴表示你认为根据另一个变量而变化的变量。在这种情况下，我们认为测试分数与游戏时间是挂钩的。（你也可以认为“游戏时间”并不是测试分数的原因，但这是一个待讨论的问题。）


    ![Images](img/f0076-01.jpg`)


    ## 了解你自己 (KYD yourself)


    相关性可能偶然出现在两个完全独立的事之间。例如，观看电视节目的人数正在稳定增长，地球的平均表面温度也是如此。你可能可以在这两者之间显示出正的“相关性”数值，但这并不意味着它们之间一定存在关系。理解数据的背景以及它们之间是否存在关系至关重要。


    你应该意识到，有些人在没有任何依据信息的情况下使用“相关”一词。不要害怕询问使用了哪些数据，以及相关性究竟有多强（或多弱）。


    ## 业务示例


    营销团队使用相关性分析来识别广告支出与销售收入之间的关系，从而指导预算分配决策。销售额受电视广告播放的影响吗？


    ## 统计模型：线性回归


    ### 什么是线性回归？


    想象你正试图根据给植物浇的水来预测它将长多高。线性回归就像在许多数据点中画一条直线，以展示这两者之间的关系。它帮助我们理解当一个事物变化时，另一个事物是如何变化的。


    线性回归通过对数据拟合线性方程，对连续目标变量与一个或多个预测变量之间的关系。


    ### 何时使用线性回归：


    *   **预测结果**：如果你想根据历史数据预测未来可能发生的情况，例如根据温度预测将售出多少冰淇淋。

    *   **理解关系**：如果你想看两个事物是如何联系的，例如查看学习时间与考试成绩之间是否存在联系。

    *   **发现趋势**：如果你想发现数据中的模式，例如查看销售额是否随着时间的推移而稳定增长。


    ### 输出结果


    线性回归将产生一个方程，显示一个变量如何受到一个或多个变量的影响。它会给每个变量分配权重，你可以通过输入不同的值使用该方程来预测其他结果。


    例如：


    `y = 2.2x + 0.5`


    我们可以为方程的 `x` 部分输入一个值，比如 10，计算结果将是 `y` 值为 `2.2 × 10 + 0.5 = 22.5`。我们可以说，当 `x` 为
    10 时，`y` 可能为 22.5。


    ### 公式


    对于单个预测变量，线性回归方程为：


    `y = β[0] + β[1]x + εy`


    其中：


    *   `y` 是预测值。

    *   `β[0]` 是截距。

    *   `β[1]` 是预测变量 `x` 的斜率（系数）。

    *   `ε` 是误差项。


    现在，这实际上意味着什么？嗯，线性回归是针对一个（或多个）事物对另一个事物进行建模。例如，我们可以观察手机手机随着年龄的增长而故障的数量。如果手机故障的数量随着年龄的增长而增加，我们可能就能预测年后会有多少手机故障。在这个方程中，`y`
    是手机数量，`x` 是年数。如果我们能得出一个模式，那么方程的其他部分只需告诉我们问题的规模以及起点是哪里。


    ![Images](img/f0078-01.jpg`)


    ### 它看起来像什么？


    让我们尝试观察手机是如何随时间推移而故障的。


    如果我们有以下数据，我们可以将其绘制成图以查看是否存在模式。


    | 手机年龄（年） || 电池电量 (%) |

    | --- | --- |

    | 0 || |


