- raw: '*   False positive (Type I error): This occurs when the model predicts a positive
    outcome incorrectly. For example, diagnosing someone as having a disease when
    they don’t.


    *   False negative (Type II error): This happens when the model misses a positive
    outcome, such as failing to detect a disease in a patient who actually has it.


    The consequences of these errors vary by context. In medical diagnosis, a false
    negative might be more critical than a false positive. However, in spam detection,
    false positives (marking legitimate emails as spam) might be more problematic.


    The numbers of errors are often shown in a simple table called a confusion matrix.
    It shows how well your model’s predictions align with the actual outcomes in your
    data. If we use the spam emails example, when detecting an email as spam we can
    have one of four outcomes:


    | 1. || We mark it spam, and it is || – got it right. |


    | --- | --- | --- |


    | 2. || We mark it spam, and it isn’t || – got it wrong (false positive). |


    | 3. || We do not mark it spam, and it is || – got it wrong (false negative).
    |


    | 4. || We do not mark it spam, and it isn’t || – got it right. |


    After testing the model on 100 emails, you compare the model’s predictions with
    the actual classifications. Here is what a confusion matrix would look like:


    |  || Predicted: spam || Predicted: not spam |


    | --- | --- | --- |


    | Actual: spam || 40 (true positives) || 10 (false negatives) |


    | Actual: not spam || 15 (false positives) || 35 (true negatives) |


    To evaluate these errors, metrics such as precision (how many predicted positives
    are actual positives) and recall (how many actual positives are correctly identified)
    are utilised.


    The F1 score is a commonly used metric that combines precision and recall into
    a single score. The F1 score is particularly useful when you want to balance precision
    and recall, such as in cases where false positives or false negatives are equally
    important.


    HOW TO INTERPRET THE MODEL


    Understanding and interpreting the model’s outcomes is just as critical as building
    it. Here’s how you can approach it:


    *   R-squared: This indicates how well the data fits a regression model. R-squared
    is expressed as a percentage between 0 and 100. A higher R-squared value generally
    means a better fit, but it’s important to consider other factors as well, such
    as the complexity of the model and the sample size.


    *   Feature importance: Many models, especially decision trees and ensembles,
    provide insights into which features are most influential in making predictions.
    Analysing feature importance can help to explain the model’s decisions and identify
    the key drivers of outcomes.


    *   Partial dependence plots: These visualise the relationship between a particular
    feature and the predicted outcome, holding other features constant. This helps
    in understanding how changes in a feature affect the model’s predictions.


    *   Residual analysis: By examining residuals (the differences between observed
    and predicted values), you can assess whether the model’s predictions are unbiased
    and identify any patterns it failed to capture.


    *   Model explainability tools: Advanced techniques such as SHAP (SHapley Additive
    exPlanations) and Local Interpretable Model-agnostic Explanations (LIME) can break
    down complex models to explain individual predictions, enhancing transparency
    and trust in the model. These are a little beyond the scope of this book, but
    worth looking into when you are further into your data science journey.


    Support, confidence and lift: evaluating rules


    In association rules and other recommendation systems, three key metrics help
    to evaluate the strength of rules derived from data:


    *   Support: This indicates how frequently an item set appears in the data set.
    For example, if 30 per cent of transactions include bread, the support for bread
    is 0.30.


    *   Confidence: This measures the likelihood that a rule holds true. If 80 per
    cent of transactions that include bread also include butter, the confidence for
    the rule ‘bread → butter’ is 0.80.


    *   Lift: This evaluates the strength of an association rule relative to random
    chance. A lift value greater than 1 indicates a positive association, suggesting
    that the occurrence of one item increases the likelihood of the other.


    These metrics help to determine the usefulness and relevance of the discovered
    patterns or rules. By thoughtfully interpreting the model, you can ensure its
    predictions are not only accurate but also understandable and actionable.


    13 COMMUNICATION


    You might recall that we talked about framing the problem and developing a hypothesis
    back at the beginning of the data analysis lifecycle, in discovery. Having completed
    all the hard work in investigating the problem and drawing insight from it, we
    now need to communicate our findings. If we communicate them well, people will
    have knowledge that can inform and influence their decisions and actions. However,
    sub-optimal communication might mean that people don’t properly understand, and
    result in poor decisions. It is therefore important to think carefully about and
    invest time in how we communicate our findings. We need to ensure that it is meaningful
    to and resonates with our audience.


    The data, information, knowledge, wisdom (DIKW) pyramid (Wikipedia, n.d.) helps
    us to think about the differences between the data, our tested hypotheses, the
    insight from these and the actions that result.


    In our version of this model ([Figure 13.1](#24_ch13.xhtml#fig13.1)), data represents
    the raw data that we sourced, information derives from our testing of our hypotheses,
    knowledge is what we will communicate and wisdom is what we hope our audience
    will gain from our communication. To derive knowledge from the information, we
    will need to combine our information with other information derived from the domain
    in which we are working.


    Figure 13.1 The DIKW model


    ![Pyramid diagram: Bottom to top levels as follows: Data, information, knowledge,
    and wisdom.](images/f0119-01.jpg)


    PRINCIPLES OF USER EXPERIENCE


    Communication can be made in many forms, including written, visual and oral. Often,
    it is a combination of these – for example, a presentation. In this case, the
    presentation materials will normally be made up of words and images, with a voice-over
    by the presenter. In this instance, there is an opportunity to explain and react
    to an audience. Where a written or visual report is produced and made available
    to the audience, the opportunity to explain further does not exist. It is important
    to understand the communication channel to ensure that you tailor your communication
    to deliver a good user experience.


    When considering user experience, the user experience honeycomb can be a useful
    guide (Morville, 2004). Although developed for user interfaces, it sets out seven
    principles of user experience that can help when thinking about how and what to
    communicate ([Figure 13.2](#24_ch13.xhtml#fig13.2)).


    Figure 13.2 The user experience honeycomb


    ![Diagram: Six hexagons labelled: Useful, Desirable, Accessible, Credible, Findable,
    Usable, around central Valuable.](images/f0120-01.jpg)


    Let’s consider what this means in terms of communicating our findings, in relation
    to our problem and having tested our hypothesis.


    *   Usable: Is it easy for the audience to engage with?


    *   Useful: Does it meet the audience’s needs?


    *   Desirable: Does the audience want to use it?


    *   Findable: Can the audience locate the information they need? Both within the
    communication and where to find the communication?


    *   Accessible: Can those with disabilities access it?


    *   Credible: Do and should the audience trust it?


    *   Valuable: If all the above are met, then do the audience value it?'
