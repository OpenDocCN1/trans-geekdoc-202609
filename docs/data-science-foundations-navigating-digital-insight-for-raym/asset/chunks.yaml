    想象你正在追踪一年的体重变化。时间序列分析就像观察你的体重每个月的变化，识别任何模式（例如假期期间体重增加），并预测你下个月的可能是多少。它处理随时间发生的数据，例如股票价格、天气模式或网站流量。


    ## 何时使用时间序列分析：


    *   **预测 (Forecasting)**：用于预测未来值，例如预测企业明年的销售额。

    *   **趋势识别 (Trend spotting)**：用于识别长期模式，例如观察访问某城市的游客人数随时间推是在增加还是减少。

    *   **季节性检测 (Seasonality detection)**：用于寻找特定时期内重复的模式，例如注意到冰淇淋销量在夏天总是更高。

    *   **异常检测 (Anomaly detection)**：用于发现异常或意外之外的事件，例如发现网站流量的突然下降。


    ## 时间序列的组成部分：


    *   **趋势 (Trend)**：数据的长期移动方向。

    *   **季节性 (Seasonality)**：规律性的、重复模式或周期。

    *   **噪声 (Noise)**：不归因于趋势或季节性的随机波动。


    ## 时间序列预测技术：


    *   **指数平滑 (Exponential smoothing)**：对过去的观测值应用指数级减少的权重进行预测，这意味着它给旧值赋予较小的权重。

    *   **自回归整合移动平均 (ARIMA)**：这是一个捕捉时间序列数据中趋势和季节性的模型。它利用了回归和移动平均的元素。


    ## 统计模型 – 自回归整合移动平均


    ### 理解时间序列分析 – ARIMA


    `ARIMA` 分解为三个主要部分：


    *   `AR` (自回归，auto regressive)：这意味着模型使用过去的值来预测未来的值。你可能还记得我们在线性回归模型中使用过“回归”一词——这里的原理是类似的。

    *   `I` (整合，integrated)：这意味着模型查看值与值之间的变化而不是原始数据。这有助于处理趋势或随时间变化的数据。

    *   `MA` (移动平均，moving average)：这使用数据的均值平均，但它不是查看所有的数据项，而是使用特定数量的过去和未来值。这迫使模型根据邻近值重新评估“平均值”。


    当你想要理解数据如何随时间移动时，必须考虑趋势的变化。`ARIMA` 模型擅长通过关注数据的动态画面，利用相关值来预测下次变化。


    ### 输出


    `ARIMA` 模型将预测未来值，这些值通常会被绘制在图表中。


    ### 公式


    最简单的 `ARIMA` 方法被称为 Box–Jenkins 模型。它是线性趋势和移动平均的结合。


    ```

    Y[t] = δ + ϕ[1] Y[t–1] + ϕ[2] Y[t–2] + … + ϕ[p] Y[t–p] + ∊[t] + θ[1]∊[t–1] + θ[2]∊[t–2]
    + … + θ[q]∊[t–q]

    ```


    ![Images](img/f0082-01.jpg)


    ### 它看起来是什么样的？


    应用 `ARIMA` 需要若干步骤，对于任何合理规模的数据集，确实需要使用工具来计算结果。让我们通过这些步骤作为示例，说明过程中发生了什么。


    使用一些基本的手机销售数据，让我们尝试预测第 8 周会发生什么：


    | 周数 | 手机销量 |

    | --- | --- |

    | 1 | 500 |

    | 2 | 520 |

    | 3 | 530 |

    | 4 | 570 |

    | 5 | 580 |

    | 6 | 600 |

    | 7 | 630 |


    #### 第 1 步：检查数据是否平稳


    当数据没有任何趋势（也称为季节性）时，`ARIMA` 的效果最好。因此，我们的目标是使数据平稳。


    为了使数据平稳（即消除趋势），我们计算连续值之间的差值。这被称为“差分”（differencing）。


    | 周数 | 手机销量 | 一阶差分（变化） |

    | --- | --- | --- |

    | 1 | 500 | – |

    | 2 | 520 | 520 – 500 = 20 |

    | 3 | 530 | 530 – 520 = 10 |

    | 4 | 570 | 570 – 530 = 40 |

    | 5 | 580 | 580 – 570 = 10 |

    | 6 | 600 | 600 – 580 = 20 |

    | 7 | 630 | 630 – 600 = 30 |


    我们可以看到，差值（20, 10, 40, 10, 20, 30）没有明显的趋势。


    #### 第 2 步：识别 ARIMA 参数 (p, d, q)


    `ARIMA` 有三个主要参数：


    1.  `p` (自回归阶数)：模型查看的过去值（滞后值）的数量。例如，如果 `p = 1`，模型使用上周的销售额进行预测。

    2.  `d` (差分阶数)：数据为了平稳而微分次数。从第 1 步来看，我们对数据进行了一次差。

    3.  `q` (移动平均)：这使用数据的均值平均，但不是查看所有数据项，而是使用特定数量的过去和未来值。这迫使模型根据邻近值重新评估“平均值”。


    当你想要理解数据如何随时间移动时，必须考虑趋势的变化。`ARIMA` 模型擅长通过关注数据的动态画面，利用相关值来预测下次变化。

