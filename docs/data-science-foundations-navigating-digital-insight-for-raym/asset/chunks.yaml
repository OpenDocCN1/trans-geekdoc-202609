- raw: 'Examples of predictive analytics:


    *   An e-commerce platform predicting which customers are likely to make a purchase,
    based on their browsing history.


    *   A weather app predicting tomorrow’s temperature and chance of rain.


    Tools and techniques:


    *   Statistical models such as linear regression and time series forecasting.


    *   Machine learning algorithms such as decision trees, random forests and neural
    networks.


    *   Risk assessments and probability scores.


    Predictive analytics gives you a glimpse into the future, but it doesn’t tell
    you what to do with that information.


    PRESCRIPTIVE ANALYTICS: DECIDING WHAT TO DO


    Prescriptive analytics is the final and most advanced stage. It’s not just about
    understanding the past or predicting the future – it helps you to decide what
    actions to take to achieve the best outcome. Prescriptive models combine data,
    predictions and optimisations to recommend the best course of action.


    Think of prescriptive analytics as answering the question: what should we do about
    it?


    Applications:


    *   Pricing strategy: Optimising prices for maximum profit while considering competitor
    pricing and customer price sensitivity.


    *   Supply chain optimisation: Recommending inventory levels and logistics strategies
    to minimise costs and improve efficiency.


    Examples of prescriptive analytics:


    *   A delivery company optimising routes to minimise fuel costs and delivery times.


    *   A marketing team deciding which promotional emails to send to different customer
    groups to maximise conversions.


    *   A hospital determining how to allocate resources during a busy flu season
    to ensure patient care.


    Tools and techniques:


    *   Optimisation algorithms and simulations.


    *   Decision trees and what-if analysis.


    *   Advanced AI systems such as recommendation engines.


    Prescriptive analytics empowers decision-makers by providing actionable insights,
    often using real-time data.


    HOW THEY WORK TOGETHER


    To see how these three analytic types work together, imagine you’re managing a
    coffee shop:


    *   Descriptive analytics: You analyse last month’s sales data and learn that
    lattes are your best-selling product on weekdays.


    *   Predictive analytics: You use this data to predict that latte sales will likely
    increase in the winter months when it’s colder.


    *   Prescriptive analytics: Based on this prediction, you decide to stock up on
    latte ingredients, introduce winter-themed latte flavours and adjust staff schedules
    to handle higher customer volumes.


    When combined, descriptive, predictive and prescriptive analytics create a full-circle
    approach to data-driven decision-making.


    UNDERSTANDING THE DATA FOR YOUR MODEL


    The very first step in creating a model is to fully understand the data you have
    (and would like to have). As with many technical processes, this has been given
    a definition – exploratory data analysis (EDA), as discussed in [Chapter 6](#17_ch06.xhtml).
    During this stage of work, the explore stage of the data analysis lifecycle, it
    is always recommended that you visualise your data set – this could take the form
    of different charts and graphs that will help you see what the data looks like.
    We will talk more about visualisations in [Chapter 11](#22_ch11.xhtml).


    There are also some figures that can be calculated to show how the data is spread
    out, describe the values using an average view and highlight how consistent they
    are. We mentioned these earlier in the book, but here we will go into how they
    are calculated. Central tendency (mean, median and mode) gives you a single figure
    that describes the group of numbers, but just as important is understanding how
    your data is spread out, which is where variance and standard deviation come into
    play.


    Variance: Variance measures how far your data points are from the mean (average).
    A high variance means your data points are very spread out, while a low variance
    means they’re tightly clustered around the mean. Variance helps to assess data
    variability, informs risk assessment and forms a basis for other statistical concepts
    such as standard deviation and covariance.


    For a data set with n observations and a mean ![Images](images/x-bar.jpg), variance
    *σ*² is calculated as:


    ![Formula: Sigma squared equals Sum of x i minus x bar squared, the whole divided
    by n.](images/f0070-01.jpg)


    We use a squared value to take account of distance away rather than just above
    or below the mean. It also helps to emphasise the effect of extreme values.


    Standard deviation: Standard deviation is just the square root of variance. It’s
    easier to interpret because it’s in the same units as your data. A small standard
    deviation means your data points are close to the mean, while a large standard
    deviation means they’re more spread out. The value of the standard deviation can
    be directly compared to the data that you are using, for example if the standard
    deviation of house prices is 2450, then this will be in £s and you can immediately
    see how close values are to the mean house price.


    Standard deviation is calculated using the formula


    ![Formula: Sigma equals Sum of x i minus x bar squared, the whole divided by n.](images/f0070-02.jpg)


    Why these matter


    Variance and standard deviation help you to understand the ‘spread’ of your data.
    You can see how a distribution with a standard deviation of 9.79 looks in [Figure
    10.1](#21_ch10.xhtml#fig10.1).


    *   As an example, if you’re analysing house prices and the standard deviation
    is very high, it means house prices vary a lot in your data set.


    *   If standard deviation is low, most houses in your data set are similarly priced.


    Knowing this can help you to decide whether you need to apply transformations
    or focus on outliers.


    Business example


    An investment firm evaluates the standard deviation of portfolio returns to assess
    volatility and guide asset allocation decisions. If the standard deviation is
    a large number, they will need to focus on how different the portfolio returns
    are – do some customers make a lot while others are losing out? If the standard
    deviation is low, then the investment firm can have some confidence that the returns
    are reasonably consistent among the portfolios and if they change something then
    they could consider it may affect a majority of portfolios.


    Figure 10.1 Example of standard deviation measures from the mean in a data set


    ![Histogram: Distribution of data from 0 to 90, with the mean at 50 point 1 9,
    and S D marked as plus or minus 1 on either side.](images/f0071-01.jpg)


    UNDERSTANDING THE HYPOTHESIS


    What is a hypothesis?


    In data science, a hypothesis is a formal statement proposing a potential explanation
    or relationship between variables. It serves as a foundation for testing assumptions
    and drawing conclusions based on data-driven evidence. As a science, there are
    clear rules on how we should propose – and test – our hypothesis.


    Types of hypotheses


    *   Null hypothesis (H[0]): This assumes no effect or relationship between variables.
    It acts as the default assumption tested against the alternative hypothesis.


    *   Alternative hypothesis (H[A]): This suggests that an effect or relationship
    exists. Researchers aim to support this hypothesis through statistical testing.


    Formulating a hypothesis


    Crafting a hypothesis involves identifying a research question and developing
    a testable statement. For example, a retail chain might investigate the effect
    of a new store layout on sales:


    *   H[0]: The new store layout does not affect sales.


    *   H[A]: The new store layout increases sales.


    Hypothesis testing


    Hypothesis testing involves statistical methods to determine whether to reject
    the null hypothesis:


    1.  Selecting a significance level (α): Commonly set at 0.05 (5 per cent), this
    represents the probability of rejecting the null hypothesis when true (Type I
    error).


    2.  Calculating a test statistic: This quantifies the difference between observed
    data and the null hypothesis, using metrics such as t\-score or z\-score.'
