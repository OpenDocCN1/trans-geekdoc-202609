- raw: 'But would it be good for everyone? Will individuals be affected? Potentially
    even you. It could cause you embarrassment if your medical details were shared.
    There is a risk of losing out financially if, for example, your insurance premiums
    rose as a result. Worse still, you might be denied access to services. This could
    limit both your quality of life and life expectancy. How do you balance the different
    interests?


    This balance can be considered at several different levels. We might start by
    asking: is it legal to do this? Our ability to do so could be constrained by regulations
    or contractual obligations. Then, do we have a professional duty? Perhaps one
    imposed by our membership of an organisation or group. Finally, is it morally
    right? A question of ethics.


    WHEN TO CONSIDER?


    Issues can arise with the ethical and lawful use of data at all stages of a project.
    Their consideration should be ongoing, with thought given as to whether issues
    might already have arisen or might arise later in the project.


    As you will see, there are no clear rules on what is ethical, and lawfulness can
    be subject to interpretation. However, there are questions you can ask at each
    stage of the data analysis lifecycle to help identify potential ethical or legal
    issues.


    Discovery


    Has a data impact assessment taken place, or an ethical review? A data protection
    impact assessment, often referred to as a DIPA, will consider data protection
    risks and set out how they will be mitigated. For research projects, ethical approval
    may be required, which often entails an ethical review and then approval by an
    ethics board. Both of these activities provide a reference point for the project’s
    appropriate use of data.


    Source


    Is the quality of the data understood? Poor-quality data can lead to ethical issues,
    for example if it has bias in it.


    Is the lineage of the data known? If you don’t know the lineage of the data, how
    do you know that you have permission to use it?


    Prepare, explore, create and analyse


    Are you using the data as intended? Referencing a DIPA, ethical approval and the
    lineage can assist in this.


    Are you doing anything to it that will impact the data quality?


    Are you using data that you don’t really need? In this case, should you be using
    it?


    Is your analysis objective?


    If using personal information, do you need to?


    Communicate


    Is the analysis being used for the intended purpose?


    Are the outcomes of the analysis objectively presented and interpreted?


    Can you explain the model to your stakeholders?


    Operationalise


    Has the data or its use changed on being operationalised?


    How will the model be kept under review?


    Let us consider a project to help recruitment, looking to identify good candidates
    who would be good at a job. Potential data sources could well be biased. If we
    used that data, could it prejudice or harm future applicants for the job? If so,
    it would seem unethical to use the data. We could also ask ourselves whether people
    giving data to apply for a job would be happy to have their data used to help
    predict whether future applicants would be successful in that role. They might
    have signed a consent clause, but is this really consent to the use of the data
    in this way? This might mean the data’s use in this way isn’t lawful. In fact,
    both questions might make us consider the use of the data both unethical and unlawful.


    Looking forward, what are the implications of undertaking the analysis? We might
    predict health outcomes to improve the health of the general population. However,
    as we have already alluded to, it might also be used to target specific individuals
    and treat them differently. Again, they could be prejudiced by this, raising the
    question of whether this is ethical and lawful.


    WHO MIGHT BE IMPACTED?


    The stakeholder wheel we discussed in [Chapter 2](#13_ch02.xhtml) is a useful
    tool for identifying stakeholders in a project, including those who provide data
    and benefit from the analysis. Considering lawfulness and ethics in relation to
    each stakeholder can help to identify any risks that need to be addressed.


    ETHICS


    You may recall the stakeholders we looked at in the analysis of the link between
    smoking and cancer. One of those stakeholders was the tobacco companies. How did
    they react to the research findings? Ultimately, they lied about them – a very
    clear example of unethical behaviour related to data science.


    However, the ethics of a situation are not always so clear-cut. Let’s consider
    another example. In 2020, exams for A-levels were cancelled due to the Covid pandemic
    (BBC, 2020). The question, then, was how to award grades to those who were due
    to sit them. Data science to the rescue: look at the historic performance of schools
    and then apply a similar profile of grades to the current cohorts in any school
    – a rigorous scientific approach compared to the alternative of relying on teachers’
    assessment.


    This might have been fair for a lot of students, but what about those whose grades
    were downgraded from their teacher’s prediction? Add to this that certain schools
    were too small to be included in the model, so their pupils’ grades weren’t downgraded.
    An ethical question was whether to use the model, given the perceived unfairness
    to some individuals. The result was a backtrack and use of teacher assessment,
    an approach that could also be critiqued.


    What are ethics?


    Ethics are frequently discussed, but often not defined. What are they? This is
    something that was debated in ancient civilisations and is still debated now.
    For our purposes, we will define them as the principles by which we and society
    judge our and others’ behaviours. It is important to recognise that ethics change
    over time; some argue that ethical rules should never be broken, others argue
    that they are flexible and depend on context.


    Although there is no legal sanction for behaving unethically if that behaviour
    does not break the law, it is important as it is fundamental to trust and in turn
    reputation. If you are not concerned about reputation, it’s worth remembering
    the £37 billion loss of value in Facebook when questions were raised as to how
    data was collected and used by Cambridge Analytica in election campaigns (BBC,
    2018).


    Ethical questions


    The subjectiveness of ethics means we can’t set out a clear set of ethical rules
    to follow. To help navigate this tricky subject, we suggest asking the following
    two questions:


    Will this harm anyone?


    Are people happy for their data to be used in this way?


    Will it harm?


    Harm can occur in many forms. It could be direct harm, or it could be indirect.
    Harm doesn’t have to be physical; it could be harmful to other aspects of our
    lives, including educational prospects, financial well-being and social relationships.
    When thinking about harm, we need to consider the risk of harm and that others
    would regard as harmful what we might consider to be benign.


    What ethical considerations might there be if we wanted to explore minority groups’
    experiences of services to support them? This should be beneficial in understanding
    how services could be improved. However, it could also have adverse consequences
    for those involved in the research. It might lead to the targeting of those contributing
    to and undertaking the research by those opposed to those minority groups. This
    doesn’t mean the research shouldn’t take place, but steps should be taken to mitigate
    the risk of harm. Many organisations will have processes in place to review the
    ethics of research projects and, where they are not in place, individuals and
    teams should undertake appropriate reviews. Here, we have an example of an ethical
    consideration in relation to the collection of data.


    Are people happy?'
