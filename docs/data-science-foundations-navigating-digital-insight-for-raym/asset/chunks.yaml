    \n## 有效探究\n\n为了定义问题以及调查该问题所需的资源（以及任何限制条件），需要有效的探究。这既涉及案头研究，也涉及与一系列利益相关者交流。在与利益相关者交谈之前进行案头研究可能会有益的。这能让你向利益相关者提出更好的问题，并提高与他们交谈时的公信力，从而提高获取信息的质量，并减少每个人投入的时间和精力的。\n\
    \n一个良好的起点是理解问题所在的领域。关于此点的良好信息来源是外部新闻、行业特定网站和技术网站。然后，你可以利用组织的内部资源开始查看问题空间的具体细节。这些资源在不同组织之间有所不同：在某些组织中，可能是查看网络看看能发现什么，在另一些组织则是查阅内网。寻找之前的类似数据科学项目可能会有用。\n\
    \n确定了工具和数据源后，一些初步的探索工作将非常有帮助。这有助于识别需要解决的限制和挑战。理解这些可以帮助构建问题以及探索它的计划。启动一个无法交付的项目是没有意义的。\n\
    \n与利益相关者互动有不同的方法。最常用的两种方法是访谈和研讨会。访谈是一一对的对话。它们在建立关系方面非常有用，并提供了深度提问的机会。研讨会是小组活动，在需要共享信息和建立共识时是有效的。发现阶段可能会同时利用这两种技术。然而，无论你使用哪种，确保你做好了充分准备以使它们成为有效且积极的活动至关重要。对于访谈，准备通常表现为开发一套要使用的问题。这通常由开放式问题组成，辅以更具体的后续问题，以便进行有效且知情的挑战。对于研讨会，结构化时间的使用方式以及你需要的互动有助于保持研讨会处于正轨，并让人们关注预期结果。\n\
    \n## 实践技巧\n\n*   花时间理解项目领域以及它将交付的环境。\n*   识别交付项目所需的技能和专业知识。\n*   理解谁将提供技能和专业知识：“团队”。\n\
    *   确定交付项目所需的资源以及这些资源是否可用。\n*   清晰地界定问题并识别要测试的假设。\n*   思考可能使用的数据源和模型。\n*   借鉴他人的知识和专业知识。\n\
    \n## 数据的 6 个属性\n\n###正确属性的重要性\n\n历史充斥着许多根据人们的直觉和耳边风语做出的决策的例子。在现代世界中，我们喜欢相信自己是基于“数据”来建立未来的，并对可能发生的事情更有把握。人类心理学稍微超出了本书的范畴，但要做出伟大的决策仍然需要“正确”的数据。\n\
    \n当经理使用电子表格中的数字和百分比时，他们看的是数字：这项关键性能指标（`KPI`）已经达成；我们相对于目标的执行情况如何，等等。我们预计每个人都知道（而且大多数人确实知道）100\
    \ 百分意味着什么，以及满足这个目标意味着某些意义。然而，人们使用的词汇呢？“这是一个非常棒的结果”、“糟糕的客户服务”、“我真的非常失望”。我们如何利用不同客户和同事的思想和词汇来获取正在发生什么的视图？很多时候，这些信息被证明比单纯的数字有用得多。\n\
    \n知道我们正在使用什么类型的数据非常重要，它会引导我们走向特定的方向。我们中的许多人从小就习惯处理数值数据，但在现代世界中收集信息有许多不同的方式。有时，如果某种处理方式对我们来说太“困难”，我们就会避免它，有时我们会被引导。\n\
    \n*(注：此处原文后续出现了大量完全重复，译文已去重)*\n\n知道我们正在使用什么类型的数据非常重要，它会引导我们走向特定的方向。我们中的许多人从小就习惯处理数值数据，但在现代世界中收集信息有许多不同的方式。有时，如果某种处理方式对我们来说太“困难”，我们就会避免它，有时我们会被引导。\n\
    \n*(注：由于原文存在异常重复，此处仅翻译了核心内容)*\n\n知道我们正在使用什么类型的数据非常重要，它会引导我们走向特定的方向……\n\n"
