- raw: '*   Regulators: Most organisations are subject to regulation that might be
    general or specific to the sector. Most organisations are subject to regulations
    relating to their use of data. These regulations are shaped, implemented and enforced
    by regulatory authorities.


    *   Employees: These are the people who work within an organisation and, like
    suppliers, could be impacted by the analysis undertaken.


    *   Managers: This group are the people commissioning and acting on the data analysis.


    *   Owners: There are several different ways an organisation can be owned. For
    a commercial organisation, it could be direct ownership by individuals or through
    shares. This group tends to provide oversight and can set strategy. Not-for-profit
    organisations tend to be ‘owned’ by trustees. Data science can affect their investment
    decisions and how they shape the organisation’s future.


    *   Competitors: Most organisations have competitors, whether it be for customers
    or funding. The industry they are in could be impacted by insight gained by another
    organisation (as with tobacco), or how that organisation acts in response to the
    insight gained (such a launching a new product).


    *   Customers: This group might change their behaviours because of data science.
    This could be through consuming more product (e.g. streaming another movie based
    on a recommendation) or stop using a product (as many people have done with tobacco).


    *   Data subjects: These are the people whose data is used by a project. For the
    smoking and cancer analysis, it would be the smokers and non-smokers who were
    subject to the research. It is important to identify this group of stakeholders
    as you need to understand them to ensure their data is used ethically and lawfully.


    *   Society: This is a bit of a catch-all. Is the project likely to have a wider
    impact on society? If so, who might be interested? In considering this, you might
    want to focus in on specific segments of society. For example, if looking at the
    accident and emergency waiting times for a particular hospital, there might be
    little national interest but lots of local interest.


    The stakeholder wheel is a framework that can be adapted to the projects you undertake.


    What changes might we make if we were working on data science projects for a recruitment
    company? A common stakeholder is likely to be candidates for the roles being recruited.
    To state the obvious, just because they don’t easily fit into any categories on
    the stakeholder wheel, it doesn’t mean they shouldn’t be considered.


    INVESTIGATING STAKEHOLDERS


    It is all very well us talking about the importance of stakeholders and the need
    to engage with them, but how do we practically work out who they are? In some
    instances, it might be obvious, we might have undertaken a very similar project
    before and the person commissioning the work or the project manager should be
    able to give some pointers. However, the stakeholder landscape does change, so
    it is beneficial to keep them under review both at the start of a project, however
    familiar, and as a project progresses.


    Identifying stakeholders requires some research. This research takes two forms:
    talking to people and checking out documents. The two go hand in hand – talking
    to people can reveal sources to check out, and looking at sources can reveal people
    to talk to.


    A good starting point for identifying internal stakeholders is an organisation
    chart and the organisation’s intranet. This can show departments and people who
    might be interested. This then provides a basis for talking to colleagues to gain
    any insight they have. Your initial research should help to engage them in the
    conversation, as you will be able to question and explore what they have to say
    and they won’t feel that you are just leaning on them for an easy life.


    At this point, you should have a list of potential stakeholders. It is then a
    matter of reaching out them. As you reach out to people, they can often advise
    you of other people who will have an interest in the project, resulting in an
    expanding network. This can be prevalent in a larger organisation with complex
    structures and reporting lines. It is also worth remembering that people who don’t
    consider themselves stakeholders early on in a project might become interested
    later. Stakeholders can be an ever-moving feast.


    Conversations and research can not only identify the internal stakeholders, but
    also external ones. People in an organisation normally understand who their external
    stakeholders are. If there are questions in relation to this, a PESTLE analysis
    can help. This looks at the external factors relating to a project by considering
    the following elements:


    *   Political: Including policies implemented and those advocated by political
    parties and interest groups.


    *   Economic: Covering both the current position and trends and expectations,
    for example in levels of wealth and availability of finance.


    *   Socio-cultural: Reflecting changes in the population and their interests.


    *   Technological: The availability of and expected advances in technology.


    *   Legal: Laws and regulation, including expected changes.


    *   Environmental: Current themes and interest in the natural world.


    [Figure 2.3](#13_ch02.xhtml#fig2.3) briefly looks at dynamic concert ticket pricing
    in this context. When looking at these elements, you can see how dynamic ticket
    pricing could attract a lot of interest from a range of stakeholders. Hindsight
    is a wonderful thing.


    Figure 2.3 Dynamic pricing PESTLE


    ![Table: Two columns showing the six PESTLE factors — Political, Economic, Socio-cultural,
    Technological, Legal, and Environmental — in one column, with their explanations
    in the second column.](images/f0009-01.jpg)


    MANAGING STAKEHOLDERS


    As we have discussed, a data science project can have a wide group of disparate
    stakeholders. They will have different stakes in the project, which means that
    we will need to deal with them differently. This poses the problem of how to work
    out how to manage each stakeholder effectively to achieve good project outcomes.
    Fortunately, we have some frameworks that can help us in this. The first is the
    power interest grid, which in turn can help us to develop a communication plan.


    Power and interest


    We have already emphasised the different degrees of power over the project and
    interest in it that stakeholders have. In our phone project, the phone manager,
    who we will refer to as the sponsor of the project, will have lots of power and
    a high level of interest. Compare this with employees who will have little interest
    and little power (at least initially). In terms of managing these stakeholders,
    it would be sensible to put more effort into the sponsor than the employees. However,
    life isn’t simple, and you have stakeholders, such as regulators, who have substantial
    powers but little interest in specific projects. The regulator could impose large
    fines if employee data was misused in the phone analysis, but it is unlikely to
    be concerned with the project unless things go wrong. As for employees, if the
    project results in changes to the phone service provided (e.g. the adoption of
    a more reliable but a less popular phone), they might suddenly have a lot of interest
    although still very little power.


    To help us navigate this, we can consider different strategies depending on the
    level of power and interest a stakeholder has. Potential strategies include:


    *   Keep close: This is where you keep your stakeholder closely informed of what
    is happening so that their views can be understood and considered. This strategy
    tends to be applied with high power, high influence stakeholders.


    *   Keep onside: In this instance, enough is done to ensure that the stakeholder
    is satisfied that everything is in order and they don’t need to get to involved.
    This is often used for stakeholders who have a lot of power but little interest.'
