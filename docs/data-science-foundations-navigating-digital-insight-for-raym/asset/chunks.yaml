  trans: "\n通过结合这两种研究，你将对问题获得更深入、更全面的理解。这种整体视角增加了结果成功且有效的概率。\n\n# 注意事项\n\n数据世界正在迅速改变我们的工作方式。传统的分析和总结数据的方法面临挑战。我们可用的海量数据可能令人生畏，而且如何从中提取正确的部分将花费一些时间和精力。在考虑提取数据之前，你应该看看数据的易变性。定性数据现在比以前更容易处理得多，特别是当使用\
    \ AI 工具时。这些数据视角可以增加对管理和数据策略的影响。如果你进一步思考，数据可以是其他类型。\n\n# 7 数据获取\n\n数据科学的核心要素之一是数据获取，正如其名所示。正如我们在之前的章节中讨论过的，任何项目产生的数据都可以决定结果的好坏。要清楚地说，数据获取不仅仅是找到数据，它关于确保数据集包含了所需的项并具有正确的属性以进行分析。在某些情况下，数据可能需要进行操纵（处理）以得出结论，这将在第\
    \ 8 章 中进行讨论。\n\n请记住，仅仅因为数据可用并不意味着你可以使用它。有法律和伦理限制需要考虑。这些内容将在第 4 章 中介绍。\n\n## 大数据\n\
    \n数据无处不在。我们被每天使用的设备的数据频率所包围。数据渗透到我们生活的各个方面，无论是查看社交媒体还是刷卡出行。数据的加速导致了“大数据”术语及其相关的三个概念：量、速度和多样性。这些被称为\
    \ 3V（图 7.1），有助于我们考虑数据获取挑战。\n\n*   **量 (Volume)**：考虑的是生成的数据量。思考咖啡机可以产生多少数据。\n*\
    \   **速度 (Velocity)**：思考数据创建和处理的速度。摄像头是实时记录，咖啡机会即时标记是否需要注意（毕竟时间就是金钱），你的社交互动是同步时的。你可以看到，我们周围的大部分数据移动得很快——非常快。\n\
    \n    图 7.1 大数据的 3V\n\n    ![金字塔图：中心是大数据，四周是量，顶部左侧是速度，右侧是多样性，代表大数据的三个 V。](img/f0041-01.jpg)\n\
    *   **多样性 (Variety)**：我们可以看到创建的数据的多样性。我们有视频和社交媒体等非结构化数据，以及来自物联网（咖啡机发送的数据）的结构化数据。如果我们想使用这些数据，我们需要能够存储它们，同样能够访问它们。\n\
    \n在 3V 的基础上增加了其他 V，人们经常提到 5V。\n\n*   **真实性 (Veracity)**：这涉及到数据的质量和准确性。数据质量将在本章后部分详细介绍。\n\
    *   **变异性 (Variability)**：组织的数据可能存在不一致之处。以员工为例：在一个系统中这可能指的是有雇合同的人，而在另一个系统中可能包括机构人员。\n\
    \n对于我们这些数据科学家来说，这一切在识别和访问数据方面制造了挑战。\n\n## 数据收集\n\n我们讨论了几种收集数据的方法，包括：\n\n*   摄像头记录数字图像，即视频或静态图像。\n\
    *   传感器自动记录数据并频繁发送到中央存储库。\n*   数据传输发生在你刷卡支付时，系统会读取卡上的详细信息。\n*   通过键盘、鼠标、触摸屏和其他数据输入设备进行的人工输入。\n\
    \n以我们的咖啡机为例。它的传感器记录水有多热。这些数据然后传输到总部。在这里，应用了一种算法利用这些数据和其他数据来判断机器是否需要维护，从而向维护部门发出请求，自动安排服务电话。这是物联网运行的一个示例，设备相互收集并共享信息。\n\
    \n当我们从人们那里收集数据时，通常是以让他们将数据输入系统或完成问卷的形式。我们考虑与此相关的风险，以及在章节后半部分如何缓解这些风险。\n\n# 数据原则：数据类型\n\
    \n在获取数据时，可以考虑不同类型的数据。我们在这里考虑的数据类型是与数据原则相关的数据类型。“数据类型”一词在不同的语境下有不同的含义，例如计算机使用的数据类型。我们可以将数据原则、数据类型看作是数据可用性和创建原因的指示（图\
    \ 7.2）。\n\n通过结合这两种研究，你将对问题获得更深入、更全面的理解。这种整体视角增加了结果成功且有效的概率。\n"
