- raw: 'Classification is a supervised learning technique used to categorise data
    points into predefined classes or labels. It is widely applied in applications
    such as spam detection, image recognition and medical diagnosis. Imagine you have
    a box of mixed fruits. Classification is like sorting those fruits into piles
    – apples in one pile, oranges in another and so on. In data science, it’s about
    categorising data points into different groups or classes based on their characteristics.


    Common classification algorithms


    *   Logistic regression: A simple and interpretable model for binary classification.


    *   Decision trees: A tree-based model that splits data into branches based on
    feature values.


    *   Support vector machines: A model that finds the optimal hyperplane to separate
    classes.


    *   Random forests: An ensemble method that combines multiple decision trees for
    improved accuracy.


    Evaluating classification models


    Classification models are evaluated using metrics such as accuracy, precision,
    recall and F1-score. Confusion matrices provide insights into model performance
    by showing the true positive, false positive, true negative and false negative
    rates.


    With such a range of different algorithms available, it is worth understanding
    the nuances of each one. For the sake of an example, we will work through one
    of the more common approaches: decision trees.


    The output


    STATISTICAL MODEL – DECISION TREES


    Figure 10.5 Decision tree for budget and brand


    ![Decision tree: Budget as high, medium, low, leading to brand selection, as A,
    B and C with yes or no outcomes.](images/f0086-01.jpg)


    A decision tree model will show outcomes from various ‘decisions’ in the form
    of a tree. The decision tree in [Figure 10.5](#21_ch10.xhtml#fig10.5) show whether
    someone will buy our new phone based on their current phone brand and budget.
    The nodes give the outcome based on these factors.


    The formula


    At first glance, decision trees might seem like they’re just branching diagrams
    to make decisions, but behind the scenes, there’s some maths involved to figure
    out how to split the data at each step. A decision tree works by splitting the
    data into smaller groups at each step (called nodes) to make the groups as ‘pure’
    as possible. Pure means that most of the items in a group belong to the same category
    (e.g. all ‘Yes’ or all ‘No’). There are different ways of calculating how pure
    things are; one of the common methods is using entropy and information gain. Entropy
    measures uncertainty, and information gain tells us how much we reduce uncertainty
    by splitting:


    ![Formula: H equals minus sum of c, probability of c, log base 2 of probability
    of c.](images/f0086-02.jpg)


    To determine the best split, decision trees rely on a mathematical concept called
    information gain.


    H[attr] is the entropy


    ![Formula: H attribute equals minus sum of v, probability of v, sum of c, probability
    of c or v, log base 2, probability of c or v.](images/f0087-01.jpg)


    where c is the outcome, v is the attribute and p is the probability of it occurring.


    InfoGain[attr] = H – H[attr]


    InfoGain = H: This means that the attribute and outcome are correlated and H is
    on a scale of 0 to 1, so InfoGain can be up to 1 too.


    When InfoGain = 0, it means that there is no link between the attribute and outcome.


    ![Images](images/f0087-02.jpg)


    What does it look like?


    We can gather data on a customer’s previous phone and see if they then bought
    our phone.


    ![Table: Data values of 10 customers, listed across budget, brand preference,
    screen size, camera quality and whether phone is bought.](images/f0087-03.jpg)


    To create a decision tree, we’ll decide which feature splits the data best at
    each step. Investigating the data set we can see:


    Feature 1: Budget


    *   High budget: Mostly ‘Yes’ outcomes.


    *   Low budget: Mostly ‘No’ outcomes.


    *   Medium budget: Mixed outcomes.


    Splitting by Budget seems promising because it separates ‘Yes’ and ‘No’ outcomes
    quite well. Budget can be used as our root node.


    We can then branch out based on the values of the Budget feature:


    Branch 1: Budget = high


    The data for High Budget customers looks like this:


    ![Table: 3 Data sets for 4 values, Brand preference, screen size, camera quality,
    and whether phone is bought is given as follows: A, large, high, Yes; C, large,
    high, Yes; A, large, low, yes.](images/f0088-01.jpg)


    All outcomes are ‘Yes’, so this branch ends with Buy phone = Yes.


    Branch 2: Budget = low


    The data for Low Budget customers looks like this:


    ![Table: 4 Data sets for 4 values, Brand preference, screen size, camera quality,
    and whether phone is bought is given as follows: B, small, low, No; A, Small,
    low, No; C, small, high, No; and B, small, low, No.](images/f0088-02.jpg)


    All outcomes are ‘No’, so this branch ends with Buy phone = No.


    Branch 3: Budget = medium


    The data for Medium Budget customers looks like this:


    ![Table: 3 Data sets for 4 values, Brand preference, screen size, camera quality,
    and whether phone is bought is given as follows: A, medium, medium, yes; B, medium,
    medium, No; and C, medium, medium, Yes.](images/f0088-03.jpg)


    For Medium Budget customers, the best split comes from Brand preference:


    *   Brand A and Brand C → Mostly ‘Yes’.


    *   Brand B → Mostly ‘No’.


    This gives us enough information to create a visualisation of the decision tree,
    as shown in [Figure 10.5](#21_ch10.xhtml#fig10.5).


    ![Images](images/f0089-01.jpg)


    KYD yourself


    Decision trees use a training set of data to work out the most likely outcomes.
    Anytime you use a set of data to train a model, you should know how good the data
    is. Any bias or trends in the data will be a fundamental inclusion in the predictions
    that a decision tree produces.


    Business examples


    *   Online shopping: Websites use classification to recommend products to you
    based on your past purchases and browsing history.


    *   Fraud detection: Banks use it to identify fraudulent transactions in credit
    card statements.


    *   Spam filters: Email providers use it to filter out unwanted emails.


    CLUSTERING


    Understanding clustering


    Clustering is an unsupervised learning technique that groups similar data points
    together based on their features, used for EDA, pattern recognition and data compression.
    Imagine you have a box of mixed chocolates. Clustering is like sorting those chocolates
    into piles based on their similarities, such as colour, shape or filling. In data
    science, it’s about grouping data points together that are like each other.


    Common clustering algorithms


    *   k\-means: A partitioning method that assigns data points to clusters based
    on their proximity to cluster centroids.


    *   Hierarchical clustering: A method that builds a hierarchy of clusters using
    either an agglomerative or divisive approach.


    *   Density-based spatial clustering of applications with noise: A method that
    identifies clusters based on the density of data points, allowing for the detection
    of arbitrarily shaped clusters (sometimes abbreviated to DBSCAN).


    When to use clustering:


    *   Customer segmentation: Grouping customers with similar buying habits to tailor
    marketing campaigns.


    *   Image analysis: Grouping similar images together, like photos of cats or landscapes.


    *   Anomaly detection: Finding unusual data points that don’t fit into any group,
    which could indicate fraud or system failures.


    *   Document clustering: Grouping similar documents together, such as news articles
    on the same topic.


    Evaluating clustering results


    Clustering results are evaluated using metrics such as silhouette score, Davies-Bouldin
    index and within-cluster sum of squares. Visualisation techniques such as scatter
    plots and dendrograms also aid in assessing cluster quality.


    The output


    Figure 10.6 k\-means clustering example


    ![Graph: Four different clusters of varied data values plotted across feature
    1, and 2. The centroids of central points are also marked as big X.](images/f0090-01.jpg)'
