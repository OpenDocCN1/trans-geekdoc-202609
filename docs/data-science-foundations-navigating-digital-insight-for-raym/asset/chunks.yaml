    In the 19th century, Gustav Freytag put forward a pyramid model for narrative
    that has been adapted to data storytelling (Dykes, 2019). In this model, the narrative
    consists of four stages and a hook (which we have called a trigger), a version
    of which is shown in [Figure 13.3](#24_ch13.xhtml#fig13.3).


    ### Figure 13.3 Data storytelling pyramid


    ![Pyramid: Base represents background, rising from trigger, then key findings,
    peaking at enlightenment, and descending to action.](images/f0123-01.jpg)


    The stages are:


    *   **Background**: This is explaining the background to the problem.

    *   **Key findings**: These are what the key findings were, the information.

    *   **Enlightenment**: This is the insight and knowledge gained.

    *   **Action**: This is the options and suggested actions.


    The **Trigger** is what caused the problem being investigated.


    In preparing your narrative, think about the subject of the narrative. We often
    base the narrative around the data scientist, the actions they perform and what
    they find. Changing the subject of the narrative can create a stronger connection
    with the audience. That subject could be a person, place, object or even a concept.
    Building the backstory not only provides context, but is an opportunity to build
    empathy and trust.


    We can compare the narrative for an investigation into contact centre performance:
    one as a data scientist might present it, the other with the customer as the subject
    following the narrative model. This is set out in [Table 13.1](#24_ch13.xhtml#tab13.1).


    ### Table 13.1 Narrative comparison for contact centre performance investigation


    | Data scientist as the subject | Customer as the subject |

    | --- | --- |

    | Took contact data from the source. | Customer interactions are important for
    our brand, especially when the customer has a problem. |

    | Analysed the trend of customer satisfaction. | How customers experience our
    contact centre is important to their brand perception and our net promoter score
    (NPS). |

    | Downward trend in NPS.`Correlation` between reduced staff contact time and NPS.
    | Customers’ willingness to recommend us is falling, and is projected to continue
    to fall as we reduce staff contact handling times. |

    | Customers are becoming less satisfied, and this looks to be an ongoing trend.This
    is correlated to shorter contact time with each customer.Qualitative feedback
    from customer comments indicates the lack of time contributes to a poor experience.
    | If the trend in NPS continues, we will be in the bottom quartile for customer
    experience compared to our major competitors within six months. |

    | Increase contact centre staffing. | Our customer experience could be improved
    by allowing staff more time to handle each customer contact, resulting in an increase
    in brand value and NPS.Recommend `A/B testing` of contact handling times to determine
    impact on NPS. |


    Note the use of qualitative as well as quantitative data within the story. The
    qualitative feedback, potentially via a survey, provides evidence of shorter contact
    time causing reduced customer satisfaction. In thinking about your narrative,
    don’t lose sight of the fact that the detail in the data science can still be
    drilled into if needed when telling the customer story.


    It is often said that conflict makes a good story. It can be helpful to think
    of this in terms of competing interests. If you take our contact centre example,
    the competing interests could be between keeping costs down and keeping customer
    satisfaction high.


    Just in case you haven’t come across net promoter score, it is a measure of how
    likely a customer is to recommend an organisation to others. `A/B testing` is
    where you trial two competing services to determine which performs best. In this
    case, the services are distinguished by the amount of time allowed for each contact.


    ### RISKS IN STORYTELLING


    Within any set of data, many stories can be found. Back in [Chapter 5](#16_ch05.xhtml)
    we discussed how the problem should be framed and the hypothesis developed. This
    determines to an extent the stories we will find in our data. Therefore, these
    are important steps in determining the story our data will tell. However, once
    we have gained the knowledge from testing the hypotheses, we still have choices
    around the story we tell. If you take our contact centre example, the story might
    have been one of how reducing contact time was expected to result in cost efficiencies.


    Selecting the right stories to tell can raise ethical questions. Have the stories
    people might not want to hear been buried? In our contact centre, do people want
    to hear the story of declining staff welfare being correlated to shorter customer
    contact times?


    We also need to consider whether we are spinning a story to meet a particular
    end.


    ### VISUALISING A STORY


    We have already discussed how to visualise our data in [Chapter 11](#22_ch11.xhtml),
    but how do we visualise our story? The four pillars for data storytelling set
    out (Feigenbaum and Alamhodaei, 2020) ([Figure 13.4](#24_ch13.xhtml#fig13.4)).


    *   **Symbols**: These are frequently used to aid communication. Drive down a
    road and you will see them, whether it is a sign warning or a school crossing.
    To be effective, the symbols need to resonate with your audience and be relevant
    to them. Beware of picking a symbol just because it seems a good idea; ask yourself
    how your audience would view it.


    Figure 13.4 The four pillars of data storytelling


    ![Diagram: Symbols, colour, captions, and editorial layout standing as four pillars.](images/f0126-01.jpg)


    *   **Colour**: This can be used to draw attention to important information. For
    example, in a chart looking at forecast sales figures for a team, those team members
    who had received training might be shown in a different colour. In this case,
    it might illustrate the effect additional training has had on expected performance.
    In using colour, give thought to the use of contrasts to aid accessibility. People
    attach meaning to colour – for example, green for good and red for bad, or blue
    for cold and red for hot. Using these associations can aid communication and cause
    confusion if ignored. It is also important to consider any cultural differences
    in colour association that might cause confusion. If we created clusters of sales
    regions, we might choose to show the best performing cluster in green and the
    worst performing in red.


    *   **Captions**: The symbols used to aid storytelling can have different meanings,
    and captions help to guide people in interpreting the symbols and thus aid their
    comprehension of the story being told. Using an unhappy face in telling our contact
    centre story helps to convey feeling; however, we would need a caption to distinguish
    the customer from the contact handler.


    *   **Editorial layout**: This is the arrangement of the visual elements of the
    story in a way that supports the narrative. This might be the layout of a dashboard,
    the order of a slide presentation or even the flow of a comic strip.


    Figure 13.5 Draft storyboard


    ![Sketch: Hand-drawn showing customer feedback leading to N P S, feedback channels
    as phone or laptop to happy or sad), N P S or time and call time or N P S graphs,
    bottom quartile analysis with sentiment, and a note about A or B testing.](images/f0126-02.jpg)

    '
