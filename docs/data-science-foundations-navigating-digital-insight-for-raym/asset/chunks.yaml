    - 检查你公司关于 AI 使用的政策。


    # 15 个案例研究


    在本书中，我们包含了一些示例，以帮助说明关键点并建立你对这些要点的理解。这些示例本质上是简单的，不能反映大多数数据科学项目的复杂性。为了更生动地展示数据科学的实际应用场景，我们在这里包含了几个使用过数据科学的项目案例研究。我们非常感谢愿意分享经验的公司和个人。在阅读这些案例研究时，你将看到书中讨论的许多主题变得生动。我们的贡献者还慷慨地分享了关于数据科学和创业的建议，后者反映了数据科学在市场和组织内部创造的创新机会。


    ## 创新工厂 (INNOVATION FACTORY)


    Anwar 是一位真人秀明星，但他对数据科学感兴趣。在这种背景下，最好不要考虑`Love Island（爱情岛），相反，可以想想`Dragons Den（龙之穴）或`Shark
    Tank（鲨鱼坦克），但是在创新周期的早期，即人们将愿景变为现实——换句话说，就是开发他们的产品。他在`Stars of Science（科学之星）中担任顾问，既负责技术方面，也同样负责业务方面。他提出的问题是：谁会买这个产品？为什么买？


    `Stars of Science` 帮助 Anwar 启动了他的第一个业务（使用声音检测来提醒听力障碍人士注意紧急情况）。他意识到识别声音模式具有更广泛的应用，并创立了`Innovation
    Factory`以此为基础。


    `Innovation Factory`所在的伯明翰曾是汽车工业的心脏，它仍是一座汽车城。这会导致拥堵，并产生空气和噪音污染。Anwar 的理论是，车辆的声音可以同时检测交通流量并估算污染水平。这导致了`Traffic
    Ear（交通耳朵）`的诞生，这是一种监测交通和污染的成本效益。


    Anwar 知道需要收集大量的交通数据来构建算法并训练所需的模型。他并没有完全预见到会有多困难。硬件非常简单：声学传感器、摄像头、空气污染传感器和一个中央处理器，以及一些微处理器、适配器和`Wi-Fi`。在需要将所有组件装进一个隐蔽的盒子里并将其放置在灯柱顶部以承受恶劣天气影响之前，组装并不困难。


    数据的挑战在于如何对声音进行分类，以便模型能够识别车辆及其相关的排放物。Anwar 或他的团队成员本可以坐在传感器下方，记录经过的每辆车辆并将其与声音关联。在双向车道旁坐九个月，无论天气如何，这对任何人都没有吸引力。这导致了一种新型自动化解决方案的开发：使用摄像头记录车辆细节，并使用这些数据对录制的声音进行标记。这使得构建分类模型成为可能，允许仅通过声音就能识别不同类型的车辆。其他数据（如速度和空气污染）也被用于开发基于声音的模型。


    这些模型并非存在于真空之中，它们的输出被输入到一个主模型，然后由该主模型进行分析，以提供有关交通和污染水平的整体信息。Anwar 强调强调，所使用的模型受限于收集的数据。在这种情况下，数据集限制于速度不超过每小时
    40 英里的车辆（收集数据道路的限速）。因此，无法通过外推这些数据来估算以每小时 60 英里速度行驶的巴士所产生的污染。


    为`Traffic Ear` 开发的核心技术现在正应用于其他用例。其中之一是铁路。如何让动物远离铁路线并防止火车撞击它们？英国面临鹿的问题，澳大利亚是袋鼠，而印度是象。答案是使用`Traffic
    Ear`技术检测动物，然后使用光和声将它们赶走。这并不简单，因为不同的动物有不同的行为，反应方式也不同。需要检测动物的物种以及它们正在做什么；它们是在吃草还是在移动？Anwar
    开发了一种使用生成式 AI 的解决方案。当`Traffic Ear`技术检测到动物时，它会向`AI`播放几秒钟的视频，AI 就能判断物种和它正在做什么。这会自动触发
    20,000 个可用设备中的相应响应。而且，是的，动物的反应会被存储，以便可以使用该互动数据来改进模型。


    Anwar 强调了规范性分析的重要性，将数据科学的结果与自动操作联系起来——在本例中，就是触发光声模式来威慑动物并减少火车撞击它们的风险。


    当被请求建议时，他的核心信息是数据科学（特别是`AI`）是一个快速发展的领域，你必须投资于自己的学习。只有当你付诸实践时，你的学习才能真正掌握。


    ## 智能集装箱公司 (SMART CONTAINER CO)


    有些人会说 Steve 拥有理想的工作，只需打开啤酒瓶并进行几次测量。至于啤酒，得以某种方式处理掉。你可以想象随之而来的欢快气氛和狂野派对。奇怪的是，Steve
    对啤酒并不感兴趣，所以现实大不相同。


    `Smart Container Co` 位于威尔士南部，帮助公司了解供应链中难以触及部分的集装箱和产品的情况。这包括酿酒厂和他们运输饮料的桶。他们的技术跟踪并监控桶及其内部的饮料。通过听取客户的需求，他们意识到担心产品在桶中可能会变得过度碳化或碳化不足，这表明饮品质量存在问题或桶已损坏（有爆炸风险）。这提出了一个如何测量密封加压桶内液体碳化程度的问题。


    Steve 站出来解决这个这个“黑箱”谜题。假设是可以使用超声波读数来确定填充水平，然后以此确定碳化水平。文献审查显示，关于该主题的信息非常有限。发现的信息来源并不可靠（即不是来自经过验证的来源）。这意味着他需要自己收集数据。


    为了准确收集数据，Steve 尝试了几种不同的方法，使用了各种容器中的饮料。最终，他决定自己对容器进行填充和加压。在这个过程中，他必须采购专业设备并学习如何使用它。


    一旦收集到健壮的数据集，Steve 开始试图理解数据之间的关系。他最初开始使用简单的线性回归模型。当这没有揭示任何实质关系时，他研究了其他模型。这包括多变量回归和多项式回归——无果，假设仍未得到证实。


    '
