    \ but will go into more detail now.\n\n## WHAT IS PROBABILITY?\n\nDefinition:\
    \ Probability is the measure of how likely an event is to happen. It’s a number\
    \ between 0 and 1, where:\n\n- A probability of `0` means the event will definitely\
    \ not happen.\n- A probability of `1` means the event will definitely happen.\n\
    - A probability in between (e.g. `0.5`) means there’s some chance the event will\
    \ occur.\n\nKey formula for probability:\n\n`P(Event) = Number of favourable outcomes\
    \ ÷ Total number of possible outcomes`\n\nExample 1: rolling a die:\n\nImagine\
    \ you roll a standard six-sided die. What’s the probability of rolling a `3`?\n\
    \n- Favourable outcome: Rolling a `3` (just 1 outcome).\n- Total possible outcomes:\
    \ Rolling any number from `1` to `6` (6 outcomes).\n`P(Rolling a 3) = 1 ÷ 6 ≈\
    \ 0.167`\n\nSo, the probability of rolling a `3` is roughly 16.7 per cent.\n\n\
    Example 2: flipping a coin:\n\nIf you flip a coin, what’s the probability of getting\
    \ heads?\n\n- Favourable outcome: Heads (1 outcome).\n- Total possible outcomes:\
    \ Heads or tails (2 outcomes).\n`P(Heads) = 1 ÷ 2 = 0.5`\n\nSo, there’s a 50 per\
    \ cent chance of flipping heads.\n\n## WHAT IS A P-VALUE?\n\nDefinition: A `p-value`\
    \ tells us how likely it is to observe the data we have (or something more extreme)\
    \ if the null hypothesis is true. It is a measure of ‘surprise’ in our data.\n\
    \n- A small `p-value` (e.g. `0.05` or less) suggests that our data is unlikely\
    \ to happen unless something unexpected is happening.\n- A large `p-value` (e.g.\
    \ `> 0.05`) means our data is consistent and as we expected.\n\nThink of the `p-value`\
    \ as answering this question:\n\nWhat is the probability of observing data like\
    \ this if there is nothing going on?\n\nIt is commonly accepted that a `0.05`,\
    \ or 5 per cent, chance of something happening is a good level to work at. If\
    \ there is a 5 per cent chance, or less, of an event occurring, and it does happen,\
    \ we can say in the social sciences this is unlikely enough to surprise us. Sometimes\
    \ the value we choose can be different, for example `0.01`.\n\n## HYPOTHESIS TESTING:\
    \ A STEP-BY-STEP GUIDE\n\nHypothesis testing is a formal process we use to determine\
    \ whether a hypothesis about a population is supported by sample data. Here are\
    \ the steps to conduct a hypothesis test:\n\n### Step 1: State the hypotheses\n\
    \nThere are always two hypotheses in hypothesis testing:\n\n- Null hypothesis\
    \ (`H[0]`): This is the default assumption. It states that there is no effect,\
    \ no difference or no relationship.\n  - Example: A coin is fair, and the probability\
    \ of heads is `0.5`.\n- Alternative hypothesis (`H[a]`): This is what you’re trying\
    \ to prove. It states that there is an effect, a difference or a relationship.\n\
    \  - Example: The coin is biased, and the probability of heads is not `0.5`.\n\
    \n### Step 2: Choose a significance level (α)\n\nThe significance level is the\
    \ threshold for deciding when to reject the null hypothesis. When would we think\
    \ that there is a bias?\n\n- Common choices: `α = 0.05` (5 per cent) or `α = 0.01`\
    \ (1 per cent).\n\nIf the `p-value` is less than `α`, we reject the null hypothesis,\
    \ and this means that there is some bias. Be aware that you should choose the\
    \ level before we run our model and not risk being influenced by our answers.\n\
    \n### Step 3: Collect data and calculate the test statistic\n\nThe test statistic\
    \ is a number that summarises your data and helps you to compare it with what\
    \ the null hypothesis predicts. The type of test statistic depends on the test\
    \ you’re performing (e.g. `z-test`, `t-test`, etc.).\n\n### Step 4: Calculate\
    \ the p-value\n\nUsing the test statistic and a statistical table (or software),\
    \ find the `p-value` (also referred to as the critical value). This tells you\
    \ how unusual your data is under the null hypothesis.\n\n### Step 5: Make a decision\n\
    \n- If `p ≤ α`: Reject the null hypothesis (`H[0]`). This means there’s enough\
    \ evidence to support the alternative hypothesis (`H[a]`).\n- If `p > α`: Fail\
    \ to reject the null hypothesis. This means there’s not enough evidence to support\
    \ `H[a]`.\n\nExample of hypothesis testing: Is a coin fair? Let’s say you flip\
    \ a coin 20 times and get 17 heads. You suspect the coin might be biased.\n\n\
    State the hypotheses:\n- `H[0]`: The coin is fair (`P(Heads) = 0.5`).\n- `H[a]`:\
    \ The coin is biased (`P(Heads) ≠ 0.5`).\n\nChoose a significance level:\n- `α\
    \ = 0.05`.\n\nCollect data and calculate the test statistic:\n- Number of heads\
    \ = `17`.\n- Total flips = `20`.\n\nUse a binomial test to calculate the `p-value`.\
    \ Note: the binomial test is a method of calculating the probability of something\
    \ happening or not happening in many independent events.\n\nCalculate the `p-value`:\n\
    Using software or a binomial probability table, find the `p-value` for getting\
