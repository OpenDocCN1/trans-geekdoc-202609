    19 世纪，古斯塔·弗莱塔格（Gustav Freytag）提出了一种叙事金字塔模型，该模型已被应用于数据故事讲述（Dykes, 2019）。在该模型中，叙事由四个阶段和一个钩子（我们称为触发器）组成，其版本如图图
    13.3](#24_ch13.xhtml#fig13.3）所示。


    ### 图 13.3 数据故事讲述金字塔


    ![金字塔：底部代表背景，从触发器上升，然后是关键发现，在启示达到顶点，最后下降到行动。](img/f0123-01.jpg)


    阶段如下：


    *   **背景 (Background)**：这是解释问题的背景。

    *   **关键发现 (Key findings)**：这些是关键发现，即信息。

    *   **启示 (Enlightenment)**：这是获得的洞察和知识。

    *   **行动 (Action)**：这是选项和建议的行动。


    **触发器 (Trigger)** 是导致所调查问题的原因。


    在准备你的叙事时，思考叙事的主体。我们通常围绕数据科学家、他们执行的行动以及他们的发现来构建叙事。改变叙事的主体可以与观众建立更强烈的联系。该主体可以是一个人、地方、物体甚至是一个概念。构建背景故事不仅提供了上下文，还是建立共情和信任的机会。


    我们可以对比一项关于呼叫中心性能调查的叙事：一种是以数据科学家的视角呈现，另一种是以客户为主体并遵循叙事模型的。这在表 13.1 中列出。


    ### 表 13.1 呼叫中心性能调查的叙事对比


    | 以数据科学家为主体 | 以客户为主体 |

    | --- | --- |

    | 从源获取了联系数据。 | 客户互动对我们的品牌非常重要，特别是当客户遇到问题时。 |

    | 分析了客户满意度的趋势。 | 客户对我们呼叫中心的体验对他们的品牌感知和我们的净推荐值（NPS）至关重要。 |


    '
