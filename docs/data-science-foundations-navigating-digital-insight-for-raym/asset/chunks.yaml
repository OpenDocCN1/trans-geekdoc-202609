    绘制点涉及识别其 `x` 坐标和 `y` 坐标，并确定其在平面上的位置。例如，点 `(3, 4)` 位于原点右侧三个单位、上方四个单位处。


    ### 绘制点的步骤：


    1. 确定 `x` 坐标：从原点开始，水平移动到 `x` 坐标。正 `x` 值向右移动；负 `x` 值向左移动。

    2. 确定 `y` 坐标：从 `x` 坐标位置开始，垂直移动到 `y` 坐标。正 `y` 值向上移动；负 `y` 值向下移动。

    3. 标记点：在水平和垂直位置的交处画一个点。为了清晰起见，用坐标标记该点。


    ### 测量点之间的距离


    笛卡尔平面上两点之间的距离可以使用距离公式计算，该公式源于勾股定理该公式提供了一种寻找两点之间直线距离（或欧几里得距离）直接方法。


    #### 距离公式


    对于两个点 `(x[1], y[1])` 和 `(x[2], y[2])`，它们之间的距离 `d` 由下公式给出：


    ![公式: 距离 d 等于 x 2 减 x 1 的平方，加上 y 2 减 y 1 的平方。](img/f0063-01.jpg)


    #### 示例：计算距离


    让我们计算点 `A(1, 2)` 和 `B(4, 6)` 之间的距离。


    识别坐标：

    `x[1] = 1`, `y[1] = 2`

    `x[2] = 4`, `y[2] = 6`


    应用公式：

    ![方程: 给出了 6 行方程。d 等于 x 2 减 x 1 的平方，加上 y 2 减 y 1 的平方。代入数值 4, 1, 6 和 2 并计算得到 d 等于
    5。](img/f0064-01.jpg)


    因此，点 `A(1, 2)` 和 `B(4, 6)` 之间的距离为五个单位。


    在图 9.2 中，连接点 `A` 和 `B` 的线代表我们使用距离公式计算出的距离。


    #### 图 9.2 距离计算的可视化

    ![图表和方程: 第一象限平面显示一个三角形，点 A 和 B 分位于 1, 2 和 4, 6。从 A 到第三点的距离为 4 - 1 等于 3。B 到另一个点的距离为
    6 - 2 等于 4。斜率为 5。右侧的方程步骤显示了求解 d 等于 5 的计算。](img/f0064-02.jpg)


    # 10 模型选择


    ## 结论


    总结，离散程度和概率是数据科学家工具箱中的本质工具。它们帮助我们理解变异性和不确定性，让我们能够根据数据做出明智的决策。在你继续数据科学之旅时，这些概念将成为更高级分析的基石，引导你自信地发现洞解并做出预测。


    笛卡尔坐标系提供了一种强大且直观的方法来可视化和分析空间关系。通过理解如何绘制点和计算距离，你可以解决广泛的数学和现实世界问题。这些基础知识将在你的数据科学之旅及以后受益。


    ## 使用哪种模型？


    数据科学是一个变革性的领域，它结合了统计学、计算机科学和领域知识从数据中得出可操作的洞解。本章深入探讨了数据科学的核心概念和方法，例如假设检验、统计测量、预测建模和各种分析技术，并辅以实用的业务案例来说明它们的应用。当我们开始谈论统计技术时，有很多可能令人困惑的术语需要解读，因此我们将尝试为每种技术提供一份“事实表”，并将其与如何使用它的示例联系起来。


    本书的目的不是教你统计公式的细节——更重要的是，你能够理解某个模型对于你的情况是否合适，并且你对在特定模型中使用特定数据集的潜在陷阱要有认识。如果你可以质问数据科学家他们为什么对特定模型使用特定数据，那么你就非常准备好应用数据科学的重要基础知识了。


    因此，我们将查看一些关键模型，但重点关注它们的外观以及在你的数据中需要考虑的重要因素。以下每个模型将包含涉及的统计学的基本理论，但我们将增加它们在现实生活中样的示例：


    ![图像: 一个困惑--01.](img/f0066-01.jpg)

    ![图像: 一个惊讶-02.](img/f0066-02.jpg)


    ### 数据科学的方法


    为了更好地理解数据科学做什么，我们可以将其分为三个主要类型：描述性分析、预测性分析和规范性分析。每种类型代表了理解和决策的不同阶段，它们共同提供了一个强大的框架。在早的章节中，我们提到了不同的方法。


    #### 描述性分析：理解过去


    描述性分析侧重于总结历史数据以理解过去发生的事件。数据聚合、可视化和基础统计测量等技术提供了对趋势和模式的洞察。描述性分析类似于像侦探一样观察已经发生了什么：它涉及分析历史数据以理解已经发生的情况。目标是以易于看到的方式对数据进行总结解释。


    **应用：**

    * 业务报告：创建仪表板以可视化随时间演变的销售表现。

    * 客户细分：分析人口统计数据以识别用于目标营销的关键客户群体。


    **描述性分析示例：**

    * 零售店分析去年的销售数据以查看哪些产品最畅销。

    * 网站跟踪过去一个月的访问人数和他们的行为。

    * 医院检查过去一年的入院率以识别季节性趋势。


    **工具和技术：**

    * 指标，如平均值、总和、百分比和趋势。

    * 数据可视化工具，如柱图、饼图和折线图。

    * 总结关键绩效指标（KPI）的仪表板。


    #### 预测性分析：窥视未来


    预测性分析更进一步————它就像使用统计学和机器学习驱动的水晶球来预测未来可能发生什么。通过分析历史数据，预测模型可以识别有助于预测未来结果的模式和关系。


    将预测性分析设为回答问题：接下来可能会发生什么？


    '
