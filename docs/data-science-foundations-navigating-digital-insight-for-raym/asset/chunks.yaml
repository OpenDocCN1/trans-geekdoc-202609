    # 分类 (Classification)


    分类是一种监督学习技术，用于将数据点归类为预定义的类别或标签。它被广泛应用于垃圾邮件检测、图像识别和医学诊断等场景中。想象你有一盒混合的水果。分类就像是将这些水果分成不同的堆——苹果分一一堆，橘子分另一一堆，以此此类推。在数据科学中，它是根据数据点的特征将数据点分为不同的组或类。


    ## 常见的分类算法


    - `Logistic regression`：一种用于二分类的简单且具有解释性的模型。

    - `Decision trees`：一种基于树的模型，根据特征值将数据划分成分支。

    - `Support vector machines`：一种寻找最优超平面来分离类别的模型。

    - `Random forests`：一种集成方法，通过结合多个决策树来提高准确性。


    ## 评估分类模型


    分类模型使用准确率（accuracy）、精确率（precision）、召回率（recall）和 `F1-score` 等指标进行评估。混淆矩阵通过显示真阳性、假阳性、真阴性和假阴性率，提供关于模型性能的洞察。


    鉴于有这么多不同的算法可用，了解每种算法的细微差别是有值的。为了说明，我们将介绍最常用的方法之一：决策树。


    ## 输出


    ### 统计模型 – 决策树 (STATISTICAL MODEL – DECISION TREES)


    图 10.5 预算和品牌的决策树


    ![决策树：预算被分为高、中、低，导致品牌选择为 A、B 和 C，结果为是或否。](img/f0086-01.jpg)


    决策树模型将以树的形式显示各种“决策”的结果。图 10.5 显示了根据目前的手机品牌和预算，人们是否会购买我们的新手机。节点根据这些因素给出结果。


    ### 公式


    初看之下，决策树似乎只是用来做决策的分支图，但在背后涉及到数学计算，以确定每一步如何划分数据。决策树的工作原理是在每一步将数据拆分成更小的组（称为 `nodes`），以使这些组尽可能“纯”。纯意味着某组中的大多数项目属于同一个类别（例如，全是“是”或全是“否”）。计算纯度有多种方法，一种常用方法是使用熵（entropy）和信息增（information
    gain）。熵衡量不确定性，而信息增告诉我们通过划分减少了多少不确定性：


    ![公式：H 等于 c 的所有概率乘以 c 的概率以 2 为底的对数的负。](img/f0086-02.jpg)


    为了确定最佳划分点，决策树依赖于一种被称为信息增的数学概念。


    `H[attr]` 是熵


    ![公式：H 属性等于 v 的所有概率乘以 c 的所有概率乘以 c 或 v 的概率乘以 c 或 v 的概率以 2 为底的对数的负和。](img/f0087-01.jpg)


    其中 `c` 是结果，`v` 是属性，`p` 是其发生的概率。


    `InfoGain[attr] = H – H[attr]`


    `InfoGain = H`：这意味着属性和结果之间存在相关性，且 `H` 的范围是 0 到 1，因此 `InfoGain` 也可以达到 1。


    当 `InfoGain = 0` 时，意味着属性和结果之间没有联系。


    ![图像](img/f0087-02.jpg)


    ### 它看起来是什么样的？


    我们可以收集客户之前使用的手机数据，并看看他们随后是否购买我们的手机。


    ![表格：10 个客户的数据值，按预算、品牌偏好、屏幕尺寸、摄像头质量以及是否购买手机列表。](img/f0087-03.jpg)


    为了创建决策树，我们将决定每一步哪种特征对数据的划分最好。研究数据集可以看到：


    特征 1：预算 (Budget)


    - 高预算：大部分是“是”的结果。

    - 低预算：大部分是“否”的结果。

    - 中等预算：混合结果。


    通过 `Budget` 进行划分似乎很有前景，因为它很好地分开了“是”和“否”的的结果。`Budget` 可以作为我们的根节点。


    然后我们可以根据 `Budget` 特征的值进行分支：


    #### 分支 1：预算 = 高 (high)


    高预算客户的数据如下：


    ![表格：针对 4 个值的 3 个数据集，品牌偏好、屏幕尺寸、摄像头质量以及是否购买手机的情况如下：A、大、高、是；C、大、高、是；A、大、低、是。](img/f0088-01.jpg)


    所有结果都是“是”，因此该分支以 `Buy phone = Yes` 结束。


    #### 分支 2：预算 = 低 (low)


    低预算客户的数据如下：


    ![表格：针对 4 个值的 4 个数据集，品牌偏好、屏幕尺寸、摄像头质量以及是否购买手机的情况如下：B、小、低、否；A、小、低、否；C、小、高、否；以及 B、小、低、否。](img/f0088-02.jpg)


    所有结果都是“否”，因此该分支以 `Buy phone = No` 结束。


    #### 分支 3：预算 = 中 (medium)


    中等预算客户的数据如下：


    ![表格：针对 4 个值的 3 个数据集，品牌偏好、屏幕尺寸、摄像头质量以及是否购买手机的情况如下：A、中、中、是；B、中、中、否；以及 C、中、中、是。](img/f0088-03.jpg)


    对于中等预算客户，最佳划分来自品牌偏好：


    - 品牌 A 和 C → 大部分是“是”。

    - 品牌 B → 大部分是“否”。


    这给了我们足够的信息来可视化 10.5。


    ![图像](img/f0089-01.jpg)


    ### 你自己知道


    决策树使用训练数据集来推断最可能的结果。每当你使用一组数据训练模型时，你应该知道数据的好坏。数据中的任何偏差或趋势将是决策树预测的基础。


    ### 业务示例


    - 在线购物：网站根据过去的购买向你推荐产品。

    - 客户细分：对具有相似购买习惯的分组以定制营销活动。

    - 图像分析：将相似的图像聚集在一起，例如猫或风景。

    - 异常检测：寻找不属于任何类的异常数据点，这可能指示欺诈或系统故障。

    - 文档聚类：将相似的文章聚集在一起。

    - 垃圾邮件过滤器：邮件提供商利用它过滤邮件。


    # 聚类 (Clustering)


    ## 理解聚类


    聚类是一种监督学习技术，根据特征将相似的数据点聚集在一起，用于探索性数据分析（EDA）、模式识别和数据压缩。想象你有一盒混合的巧克力。聚类就像根据相似性将这些巧克力分成堆，例如颜色、形状或填充。


    ## 常见的聚类算法


    - `k-means`：一种划分方法，根据数据点到聚类质心的距离将其分配到簇中。

    - `Hierarchical clustering`：一种使用凝聚法或分裂法构建聚类层次结构的方法。

    - `DBSCAN`：基于密度的空间聚类算法，有时简写为噪声处理。


    ## 评估聚类结果


    聚类结果使用轮廓系数（silhouette score）、戴维斯鲍丁指数（Davies-Bouldin index）和类内平方和进行评估。可视化技术（如散点图和树图）有助于评估簇质量。


    ## 输出


    图 10.6 k-means 聚类示例


    ![图：在特征 1 和 2 上绘制的具有不同数据值的四个不同簇。中心点的质心也被标记为大的 X。](img/f0090-01.jpg)


