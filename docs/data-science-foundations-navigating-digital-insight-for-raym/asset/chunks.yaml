    \ TRAIN AND TEST\n\nA critical aspect of model evaluation is understanding how\
    \ well the model generalises to new, unseen data. This involves comparing its\
    \ performance on the training set (the data used to build the model) with the\
    \ test set (new data not seen by the model during training and therefore a way\
