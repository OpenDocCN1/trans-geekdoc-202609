    书中表达的观点仅代表作者，不代表学会或 `BCS Learning and Development` 的观点，除非另有明确说明。尽管作者和 `BCS Learning
    and Development` 在准备本书时已尽力小心，但作者和出版方 `BCS Learning and Development` 对书中包含信息的准确性或完整性不作任何保证，对于因本出版物的任何信息或其中的任何说明或建议而导致的任何损失或损害不承担责任。


