    MEASURES OF SPREAD


    Imagine you have a data set of exam scores for a class of students. While the
    average score gives you an idea of how the class performed overall, it doesn’t
    tell you how varied the scores are. Measures of spread help you to understand
    the diversity in your data.


    Range


    The range is the simplest measure of spread. It is calculated by subtracting the
    smallest value in the data set from the largest value. For example, if the highest
    exam score is 95 and the lowest is 65, the range is 95 – 65 = 30. The advantage
    of using the range as a measure is that it is easy to compute and therefore understand.
    But be careful, the range can be misleading because it only considers the extreme
    values and these should be evaluated carefully.


    Variance


    Variance gives a more comprehensive measure of spread by considering how each
    data point differs from the mean. To calculate variance, you take each data point,
    subtract the mean, square the result and then find the average of these squared
    differences. A high variance indicates that the data points are spread out over
    a wide range, while a low variance suggests that they are clustered closely around
    the mean.


    Standard deviation


    Standard deviation is simply the square root of the variance. It provides a measure
    of spread in the same units as the data, making it easier to interpret. In our
    exam score example, if the standard deviation is 10, you can say that most students’
    scores are within 10 points of the average.


    Interquartile range (IQR)


    The interquartile range focuses on the middle 50 per cent of the data, making
    it a robust measure of spread that is less affected by outliers. It is calculated
    by subtracting the first quartile (25th percentile) from the third quartile (75th
    percentile). The ‘percentile’ is just a technical term for how far through the
    data the values are, that is, the 25th percentile is 25 per cent of the way through
    the data (or a quarter of the way). In practice, the IQR tells you how much the
    central portion of the data varies, providing insight into the core distribution
    of the data set.


    PROBABILITY


    In the world of statistics and data science, there is very little we can be certain
    about. Most of the time we will be interpreting a view of data and using what
    we see to draw conclusions. Unfortunately, these views may point towards a trend
    or pattern, but they will almost never ‘prove’ things are true (or false). Probability
    is the language of uncertainty and randomness. It helps us to quantify the likelihood
    of different outcomes and is a cornerstone of statistical inference in data science.


    Basic probability concepts


    *   Probability of an event: Probability is a number between 0 and 1 that indicates
    how likely an event is to occur. An event with a probability of 0 will never happen,
    while an event with a probability of 1 is certain.


    *   Complementary events: If the probability of an event happening is P(A), the
    probability of it not happening is 1 – P(A). This is the certainty of something
    happening (value of 1) minus the probability of it happening. These are complementary
    events.


    Independent and dependent events


    *   Independent events: Two events are independent if the occurrence of one does
    not affect the probability of the other. For example, flipping a coin and rolling
    a die are independent events.


    *   Dependent events: Events are dependent if the outcome of one affects the probability
    of the other. For instance, drawing two cards from a deck without replacement
    makes the second draw dependent on the first.


    Conditional probability


    Conditional probability is the probability of an event occurring given that another
    event has already occurred. It is denoted as P(A|B), meaning the probability of
    event A happening given that B has happened. This concept is vital in data science
    for understanding relationships between variables.


    Probability distributions


    *   Discrete distributions: These describe the probability of outcomes for discrete
    random variables, such as the number of heads in coin tosses. Common examples
    include the binomial and Poisson distributions.


    *   Continuous distributions: These apply to continuous random variables and include
    distributions such as the normal distribution, which is crucial in data science
    for modelling natural phenomena and statistical inference. Common examples of
    continuous variables are time, speed and temperature.


    The law of large numbers


    The law of large numbers states that as the number of trials increases, the empirical
    probability (observed frequency) of an event will converge to its theoretical
    probability. This principle underpins much of statistical reasoning, reinforcing
    the reliability of large data sets in making predictions. It is like saying if
    you flip a coin enough times, you will see half of the outcomes being heads and
    half being tails. The more times you flip the coin, the closer you will get to
    a perfect half–half. Being able to use vast quantities of data is a relatively
    new functionality for businesses. The tools now available to a wide range of people
    give us access to manipulate and analyse far greater amounts of data, and this
    is turn allows us to build better models that provide stronger pictures of the
    data.


    NAVIGATING THE CARTESIAN PLANE AND MEASURING DISTANCES


    In the realm of mathematics and data science, the Cartesian coordinate system
    serves as a fundamental framework for understanding spatial relationships and
    measuring distances. A number of statistical models use the concept of distance,
    so it is important to talk about the Cartesian plane ([Figure 9.1](#20_ch09.xhtml#fig9.1)).
    We will explain how to plot points and how to calculate distances between them
    using simple language and visual aids to ensure clarity and comprehension.


    Figure 9.1 The Cartesian coordinate plane


    ![Graph: Four quadrant plane is shown with labels. A point 3 comma 4 is plotted
    and labeled.](images/f0062-01.jpg)


    Understanding the Cartesian coordinate system


    The Cartesian coordinate system, named after the French mathematician René Descartes,
    is a two-dimensional plane for plotting points, lines and shapes. It consists
    of two perpendicular axes: the horizontal axis (x axis) and the vertical axis
    (y axis). These axes intersect at a point called the origin, labelled as (0, 0).


    In [Figure 9.1](#20_ch09.xhtml#fig9.1), the plane is divided into four quadrants:


    *   Quadrant I: Both x and y are positive.


    *   Quadrant II: x is negative, y is positive.


    *   Quadrant III: Both x and y are negative.


    *   Quadrant IV: x is positive, y is negative.


    Each point on the plane is represented by a pair of coordinates (x, y), indicating
    its position relative to the origin.


