    ## EFFECTIVE ENQUIRY


    To define the problem and the resources needed to investigate it (along with any
    constraints), effective enquiry is required. This will involve both desk-based
    research and speaking to a range of stakeholders. Undertaking the desk-based research
    before speaking to stakeholders can be beneficial. It allows better questions
    to be asked of stakeholders and improves your credibility when talking to them,
    enhancing the quality of information gained and reducing the overall time and
    effort for everyone.


    A good starting point is to understand the domain of the problem. A good source
    of information on this is external news, and sector-specific and technical websites.
    You can then start looking at the specifics of the problem space using your organisation’s
    internal resources. These will vary across organisations: in some, it might be
