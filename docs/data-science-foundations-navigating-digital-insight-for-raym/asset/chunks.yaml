    Where your organisation has a policy in place, follow it. This means you need
    to know where the policies are, what is in them and who to ask if something isn’t
    clear. Just keep in mind that the policy might not properly reflect the legal
    and regulatory standards to which you will be held.


    ## Data classification


    Where your organisation has a data classification policy, understand the classification
    that applies to the data you plan to use and apply the appropriate classification
    to the data sets you create. Data classification in this context means applying
    a label to the data, which then sets out how the data items should be used and
    managed. Example classifications are given in [Table 4.1](#15_ch04.xhtml#tab4.1).


    These are examples, and your organisation might have different classification
    levels and controls related to them. It is also worth remembering that data classification
    is sometimes used to refer to whether data is structured or unstructured, and
    whether it is qualitative or quantitative. There are also classification methods
    used to analyse data. To avoid confusion, check the context of its use.


    ### Table 4.1 Examples of data classification


    | Data || Classification || Rationale |

    | --- | --- | --- |

    | Statutory accounts || Open | These are a matter of public record, and anyone
    can access them. |

    | Balanced business scorecard || Internal | This shows employees how the organisation
    is performing, so it is open to anyone in the organisation. However, the information
    isn’t public and shouldn’t be shared outside the organisation. |

    | Forecast sales || Confidential | Only authorised people should have access to
    the information in the organisation, as it is commercially sensitive. |

    | Diversity data || Secret | Due to the sensitivity of the data, access and use
    of the data has additional controls. |


    ## Obfuscation and redaction


    This is where parts of the data are made unclear (obfuscation) or blanked (redaction).
    Take, for example, a sales forecast. You might produce a report showing the employee
    names for the manager, but fictionalise or blank them out when shared with the
    team. The manager might have a legitimate interest knowing how everyone is performing,
    whereas the team members are unlikely to. In doing this, you need to be careful
    that people cannot work out who everyone is through other information people have
    available.


    ## Aggregation


    Aggregation is used where there is a small data set, and it can be easy to work
    out who data relates to even where it is obfuscated or redacted. This might be
    based on information in the data set or other information that people have access
    to. This could include inferences made about people and individuals’ interaction
    with them. In these cases, you can aggregate the data set so that individuals
    are not represented. Aggregating the data means that it is displayed for a group
    rather than by individual. In many instances, small groups will be excluded from
    reporting, to protect privacy.


    ## Anonymising data


    In this case, you remove all personal data. However, you need to be aware that
    some of the data you retain might allow someone to be identified. For example,
    if you leave an Internet Protocol (`IP`) address and an age in a record, it is
    likely these data items could be used to identify an address and a particular
    person living there. Data could be changed for an ID or `token`, which removes
    personal data, for example each employee could be given a unique reference number.
    However, it should be remembered that the individual could be identified by someone
    who has the data set containing the unique reference numbers and names. You might
    recall that data where people can’t be identified falls outside of `GDPR`. However,
    even where data has been anonymised, it is often still possible to identify someone,
    for example combining anonymised mobile phone data with geolocation data from,
    say, a tweet can identify the user of the phone (Palmer, 2013). Therefore, this
    `GDPR` exemption should be used with caution.


    ## Access controls


    If you want to ensure someone doesn’t misuse data, then a good way to stop it
    is to prevent them gaining access to the data in the first place. Access controls
    can be applied to both where data is stored and where it is reported. Many organisations
    have policies that set out who can access data and how permissions to access it
    are granted.


    ## PRACTICAL TIPS


    * Ethics and lawfulness are different, although they often align.

    * Ethics are not defined and can change with context and time.

    * Data regulation is based on principles that need interpretation, not on rules.

    * Other laws, not just data protection, govern the use of data.

    * Make sure you understand your organisation’s policies on the use of data.

    * Consider the ethical and lawful use of data at the start of the project.

    * Keep the ethical and lawful use of data under review throughout the project.


    ## 5 DISCOVERY


    When an organisation kicks off a data science project, one person is normally
    made accountable for its delivery: the sponsor. They might be the person who came
    up with the idea or someone to whom the responsibility has been delegated. One
    of their roles is to initiate the project.


    The first step in the data analysis lifecycle is discovery. Discovery is when
    the project is investigated to understand its objectives, scope, resource needs
    and constraints. Constraints might be time, financial, technology and, of course,
    data. An important part of discovery is determining whether the project is feasible.
    This includes not only whether it is worth doing, but also whether it has the
    resources (including expertise) to deliver it. Sometimes this will be referred
    to as a feasibility study.


    The scope and scale of discovery will vary. Before starting a project, it is worth
    spending time to consider what it will take to deliver, the challenges you might
    encounter, whose help you’ll need and ultimately whether it is worth doing. It
    could save you a lot of angst and heartache. This is true both for a simple sales
    forecast and pharmaceutical research, although in the latter case discovery is
    likely to be a significantly larger undertaking.


    Discovery is the time to start looking at stakeholders. Important stakeholders
    in the project we haven’t considered are the delivery team.


    ## THE TEAM


    To help identify who should be in the team, we think about roles involved in a
    data science project and the skills and expertise they bring. The descriptions
    we have used are generic, and different organisations might have their own role
    titles and definitions. In looking at this, we should remember that one person
    might play many, if not all, the roles. For larger projects, such as pharmaceutical
    trials, the roles might be broken down further with greater specialisation. When
    identifying the team, you might want to consider the data analysis lifecycle and
    who you will need help from in each step to make the project a success. Roles
    you might find on a project are illustrated in [Figure5.1](#16_ch05.xhtml#fig5.1)
    and include:


    * Sponsor: They set the direction of the project through defining its objectives
    and scope. This is likely to be a senior person, accountable for the project.
    In the setting of direction, the sponsor is likely to consult with others.


    Figure 5.1 Generic data science project roles


    ![Data scientist radial diagram: Sponsor sets direction, SME provides expertise,
    PM facilitates activity, Compliance ensures compliance, Researcher gathers data,
    Architect defines environment, Engineer prepares data.](images/f0028-01.jpg)


    * Subject matter expert: They provide the domain knowledge. They are key to the
    definition of the problem, understanding the data and analysing the results.


    * Researcher: In some instances, work will need to be undertaken to gather the
    data needed for the project. This could be through studies, experiments or surveys.
    Often, the data has already been collected.

