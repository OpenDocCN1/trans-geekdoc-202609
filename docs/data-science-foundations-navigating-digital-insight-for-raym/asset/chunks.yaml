    - **Keep informed**: This strategy is employed where stakeholders have lots of
    interest but little power. In this instance, it is about providing sufficient
    information and engagement to satisfy their interest.

    - **Keep track**: If a stakeholder hasn’t any real power or interest, it is sensible
    to keep track of them to see if this changes. If it does, one of the other strategies
    can be employed.


    This can be visualised in a power interest grid (Newcombe, 2003), illustrated
    in [Figure 2.4](#13_ch02.xhtml#fig2.4). You will find various versions of this
    grid, some which are more complex, containing a wider range of management strategies.


    ### Figure 2.4 A generic power interest grid


    ![Grid: Four quadrants -High power, low interest: keep onside; high power, high
    interest: keep close; low power, high interest: keep informed; low power, low
    interest: keep track.](images/f0010-01.jpg)


    Our phone project stakeholders are shown in [Figure 2.5](#13_ch02.xhtml#fig2.5).
    It is a simple example, and you could have multiple stakeholders in each of the
    boxes for clarification. Why have we placed the stakeholders in the particular
    boxes?


    ### Figure 2.5 Power interest grid for phone project


    ![Grid: Four quadrants: High power, low interest: regulators; high power, high
    interest: sponsors; low power, high interest: late project employees; low power,
    low interest: early project employees.](images/f0011-01.jpg)


    - **Sponsor**: It is their project, and they are accountable for the scope, resources
    and delivery. Therefore, they have high power and high interest.

    - **Regulator**: The regulator has limited, if any interest, in the project, but
    could intervene if they wish – giving them high power, but low interest.

    - **Employees (late project)**: At this point, the employees understand the impact
    on them (in this case a move to a less popular phone). They have a high interest
    because of this, but little power.

    - **Employees (early project)**: The impact on employees isn’t known, so they
    have little interest and little power.


    ## Communication plan


    The strategies identified using the power interest grid can be used to create
    a communication plan. This simply sets out how the stakeholders will be communicated
    with. This could be through one-to-one sessions, meetings or written updates.
    These could be set up specifically for the project or be existing communication
    channels.


    An example of the communication plan for the phone analysis is shown in [Figure
    2.6](#13_ch02.xhtml#fig2.6). The plan shows how each stakeholder group will be
    communicated with. Having a communication plan mitigates the risk that different
    stakeholders aren’t appropriately engaged in the project. As with stakeholders,
    the communication plan should be kept under review throughout the project – it
    is a living document. We consider communication of the analysis in [Chapter 13](#24_ch13.xhtml).


    It is worth noting in this example that the communication plan focuses on the
    compliance team, who represent the regulator in this project. They understand
    the regulations and, if needed, would represent the project to the regulator.


    ### Figure 2.6 Communication plan for phone project


    ![Project stakeholder communication plan: Sponsor, Regulator, Early Employees,
    and Late Employees.](images/f0012-01.jpg)


    One final point on stakeholders: they will have different levels of understanding
    of the problem and data science. It is important to understand this and adapt
    your language and explanations to reflect this.


    ## PRACTICAL TIPS


    - Consider who your stakeholders are at the start of the project.

    - Stakeholders can be inside and outside your organisation.

    - Keep your stakeholders under review throughout the project.

    - Consider the power and interest of stakeholders to inform how you engage with
    them.

    - Create a communication plan (even if it is just a regular catch-up with your
    manager).

    - Think through any risks related to wider stakeholder groups.


    ## 3 PROJECT DELIVERY


    Projects that employ data science come in many different forms. Some, such as
    pharmaceutical research, might take many years, others can be delivered in an
    afternoon. However, they all have some common activities.


    If you are in a small business and looking to predict profitability for the next
    year, you need to: work out what you are doing; find and prepare your data; determine
    the methods to be used to analyse it; build your model; evaluate the outcome;
    and then share your findings. The same activities are required if you are working
    for a pharmaceutical company on medical trials. However, in the first instance
    you might do everything in a day, in the latter case it is likely to take a team
    of people years.


    Therefore, you need to consider how the activities are going to be planned and
    managed. This includes understanding the problem space to be explored along with
    the resources and time needed to do it. If, having done this, the project looks
    feasible, you then need to bring those resources together, creating a team to
    deliver and manage the activities to fruition.


    ## DATA ANALYSIS LIFECYCLE


    People can get very excited about the outcome of data science, but frequently
    don’t appreciate the effort that goes into that result. The data analysis lifecycle
    is a framework that looks at the steps needed to successfully deliver a data project.
    It can help in planning work and managing stakeholder expectations.


    There are many versions of the lifecycle, and, like all frameworks, it can be
    adapted for your needs. The one we have used in [Figure 3.1](#14_ch03.xhtml#fig3.1)
    describes the steps in terms that easily relate to data science.


    The outer ring shows the overall flow through the steps from discovery to communication,
    while the inner ring shows that it is iterative. A step may be returned to and
    revisited at any point and any number of times. The circular nature also reflects
    that in answering one question others will arise, hence the flow from communication
    back to discovery.


    Each step contributes to the success of the data science initiative:


    - **Discover**: considers and defines the problem that the analysis will explore
    and the resources that will be needed to undertake it.


    ### Figure 3.1 Data analysis lifecycle


    ![Lifecycle: Stages such as Discover, Source, Prepare, explore, create, Analyse,
    and communicate are shown. Another factor operationalise is given outside and
    between communicate and Discover.](images/f0014-01.jpg)


    - **Source**: looks for and at the data that is available to answer the question.

    - **Prepare**: ensures the data is of a quality and format to be used in the analysis.

    - **Explore**: investigates appropriate methods to answer the questions and the
    ability to use the available data to build effective models.

    - **Create**: builds the actual models to be used in the analysis.

    - **Analyse**: evaluates the models created.

    - **Communicate**: shares the insight gained from the analysis of the models.

    - **Operationalise**: embeds the analysis into the regular operation of an organisation.
    Many data science projects are a one-off investigation and therefore this step
    doesn’t always take place.


    Let us return to our phone fault example. What might the steps in the data analysis
    lifecycle look like?


    - **Discover**: We might receive a request by email or via a portal. A discussion
    might take place with the sponsor to clarify what they need from the analysis.
    This then might be confirmed by email.

    - **Source**: Having considered the data we need to answer this question, we might
    look at the data available to identify suitable data sets to be used in the analysis.

