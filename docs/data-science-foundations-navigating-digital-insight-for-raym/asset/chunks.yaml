    AUTHORS


    Stephen Mariadas is CEO of an institute of technology. He has a depth of understanding
    in technical skills and a wide range of experience in both industry and education.
    Having held the position of chief information officer for a European airline he
    moved into education 12 years ago. He has been instrumental in building digital
    and data apprenticeships across the South West region. Steve was awarded a Technical
    Teaching Fellowship by the Royal Commission for the Exhibition of 1851 on delivering
    data skills to industry. He also works closely with a number of multi-nationals
    on their data skills strategy.


    Ian Huke qualified as a lawyer, specialising as a litigator before starting to
    develop legal software. Moving into financial services, he worked for both start-up
    companies and leading insurance and banking firms. Here he created and led several
    business analysis functions engaged in all aspects of change. Having become an
    independent consultant, he found his work was increasingly focused on data science,
    leading to a large dose of imposter syndrome. This book is inspired by his search
    for the knowledge to enable him to flourish in this domain.


    FOREWORD


    In my years of navigating the mathematically beautiful waters of artificial intelligence
    and more recently surfing the waves of societal and business interest in generative
    AI in particular, I’ve seen firsthand how the currents of skills that make up
    ‘Core’ data science practice then feed in to create the most powerful AI models
    and the most interesting applications.


    In both the past and present, it’s clear that a strong foundation in data science
    skills and knowledge isn’t just beneficial – it’s essential – it is the foundations
    on which so many emerging technologies are based, whether that’s AI or other emerging
    technologies like quantum computing. Data Science Foundations provides that bedrock
    and it’s the kind of text I wish we had had to hand in the early days of training
    data scientists in industry.


    What strikes me most about this book is its emphasis on democratising data science
    and considering projects holistically. It goes beyond the algorithms and coding,
    addressing the critical importance of understanding stakeholders, ethical considerations
    and effective communication. In today’s world, where AI systems can have profound
    societal impacts, this broader perspective is non-negotiable. We can no longer
    afford to train data skills in a vacuum.


    In today’s rapidly evolving world, data science stands as a beacon of innovation
    and insight. This book is designed to introduce you to the fascinating realm of
    data science, guiding you through the essential techniques and models that define
    the field. More importantly, it aims to show you how to harness the power of data
    science to achieve success within your organisation. This book is unique in the
    way that it covers all the practical concepts of getting a data science project
    up and running, without the need for deep technical knowledge.


    The book’s structure mirrors the data analysis lifecycle, a framework that while
    seemingly straightforward, is often oversimplified in educational settings. It
    correctly highlights the iterative nature of this process, reminding us that real-world
    data science is rarely a linear progression. This emphasis on iteration and adaptability
    is crucial for anyone working with data, where experimentation and refinement
    are the name of the game.


    While data science is inherently technical, it is ultimately driven by people.
    The success of any data science project hinges on the skills and creativity of
    the individuals involved. From data engineers to machine learning experts, each
    role is vital in the journey from raw data to actionable insights.


    As data science continues to grow in influence, addressing its ethical implications
    is critical. This book highlights the importance of fairness, privacy, transparency
    and accountability in data science practices. Looking ahead, advancements in AI,
    big data and cloud computing promise to further revolutionise the field, making
    data science more accessible and impactful.


    I hope this book inspires you to explore the vast opportunities within data science
    and empowers you to make a real difference in the world.


