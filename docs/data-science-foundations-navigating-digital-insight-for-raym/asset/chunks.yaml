    ### 3. Making a decision

    A critical value is calculated based on a number of factors including the significance
    level and test type. This is then compared to the test statistic to determine
    whether the null hypothesis should be rejected or accepted.


    #### Business example

    A pharmaceutical company tests whether a new drug reduces blood pressure more
    effectively than an existing drug. The hypothesis test determines if the observed
    difference is statistically significant, guiding product development decisions.


    ### HOW TO CHOOSE BETWEEN DIFFERENT MODELS


    When working on a data science project, one of the most important decisions you’ll
    make is choosing the right method to analyse your data. With so many techniques
    available – clustering, classification, correlation, regression, time series and
    association – it’s easy to feel overwhelmed, but don’t worry. Each method serves
    a specific purpose and is best suited for certain types of problems. By understanding
    the basics of these techniques, you can confidently decide which one to use.


    Let’s start with the fundamental differences in the modelling techniques. Choosing
    between clustering, classification, correlation, regression, time series and association
    is not just about the data you are using but also depends on what type of answer
    you are after.


    #### Correlation: understanding relationships between variables

    ![Graph: A correlation sample shown with a line rising touching all the points
    roughly similar to a staircase.](images/f0072-01.jpg)


    **What is it?** Correlation measures the strength and direction of the relationship
    between two variables. It tells you whether two variables move together (positive
    correlation), move in opposite directions (negative correlation) or have no relationship
    at all.


    **Why choose correlation?**

    Correlation is ideal for exploring relationships between variables. However, remember
    that correlation does not imply causation – just because two things are related
    doesn’t mean one causes the other.


    #### Regression: predicting numerical values

    ![Graph: A regression model of graph, showing a scattered plot of data points,
    and a line passing almost inbetween them steadily rising.](images/f0073-01.jpg)


    **What is it?** Regression is a method used to predict a continuous numerical
    value based on one or more input variables. It’s like drawing a best-fit line
    through your data to make predictions. Use regression when your goal is to predict
    a number or understand the relationship between variables.


    **Why choose regression?**

    Regression is the right choice when your output is a continuous number and you
    want to quantify relationships between variables.


    #### Time series: analysing data over time

    ![Bar diagram: Bar models with a bell-shaped curve touching the peak points of
    the bars.](images/f0073-02.jpg)


    **What is it?** Time series analysis focuses on data that is collected over time,
    such as daily stock prices, monthly sales or hourly temperature readings. It’s
    used to identify trends and seasonality and make forecasts. There are several
    algorithms that can be used, but when your data is time-dependent and you want
    to predict future values, one of the time series methods will be the best approach.


    **Why choose time series?**

    Time series is perfect for problems where understanding trends over time is crucial.
    It’s especially useful for forecasting future outcomes based on past data.


    #### Classification: sorting data into categories

    ![Graph: Different types of data points are shown scatter on a graph to represent
    classification.](images/f0073-03.jpg)


    **What is it?** Classification is a supervised learning technique where you assign
    data points to predefined categories or classes. It’s like teaching a model to
    recognise patterns based on labelled examples. Use classification when you have
    a data set with categories or labelled outcomes and you want to predict which
    category new data points belong to.


    **Why choose classification?**

    Classification is your go-to method when you need to make decisions (yes/no, A/B/C)
    or split things into distinct groups.


    #### Clustering: grouping similar data together

    ![Graph: three different clusters are shown in the first quadrant coordinate plane.](images/f0073-04.jpg)


    **What is it?** Use clustering when you want to find natural groupings or segments
    in your data. You’re not looking to make predictions here; instead, you want to
    explore how your data is organised. It’s particularly useful when you don’t have
    predefined labels or categories for your data.


    **Why choose clustering?**

    Clustering is perfect for exploratory analysis when you’re trying to uncover patterns
    or hidden structures in your data.


    #### Association: discovering relationships between items

    ![Image: A basket full of items shown to represent association.](images/f0074-01.jpg)


    **What is it?** Association analysis identifies rules or patterns in your data,
    often used to find relationships between items in transactional data. It’s the
    technique behind market basket analysis used by retailing companies. It will help
    find patterns or rules about how items co-occur in a data set, and can be particularly
    good at looking through large amounts of data to spot these patterns.


    **Why choose association?**

    Association is great for uncovering hidden relationships and making recommendations,
    particularly in huge amounts of retail or e-commerce transactions.


    ### STATISTICAL MODEL: CORRELATION


    #### Understanding correlation

    When you want to understand if one thing happens because of another – for example,
    whether people buy shorts when the temperature goes up – correlation can give
    you a view of how ‘related’ one thing is to another. There are some questions
    to ask that require domain understanding, though. Which of the variables depends
    on the other? Do people buy more knives because there is more knife-crime or is
    there more knife-crime because more knives are bought?


    **The output**

    Correlation quantifies the strength and direction of a linear relationship between
    two variables, expressed as a correlation coefficient between –1 and +1.


    * Positive correlation: Both variables move in the same direction. As one goes
    up, so does the other one.

    * Negative correlation: Variables move in opposite directions. As the temperature
    drops, more gas is used for heating.

    * Zero correlation: No linear relationship exists.


    **The formula**

    Pearson’s correlation coefficient, `r`, is calculated as:


    ```

    r = nΣxy - ΣxΣy / sqrt([nΣx² - (Σx)²][nΣy² - (Σy)²])

    ```

    (images/f0074-02.jpg) where `x[i]` and `y[i]` are data points for variables `x`
    and `y`, respectively.


    ![Images](images/f0075-01.jpg)


    What does it look like? Correlation is one of the most over-used terms when talking
    about data and statistics. Journalists will quite often use the correlation of
    two data sets to build a story when it helps to justify that it is someone’s fault
    for something happening.


    Let’s try an example of looking how time spent on computer games affects student
    grades.

    We can gather data on students by asking for their test grades at school and also
    asking how many hours a week they spend gaming. The data may look like this:


    | Student | Test score | Hours gaming |

    | --- | --- | --- |

    | A | 45 | 5 |

    | B | 95 | 1.5 |

    | C | 63 | 3.5 |

    | D | 28 | 7.5 |

    | E | 78 | 2.5 |

    | F | 56 | 4 |

    | G | 64 | 4 |


    If we plot the data, the chart would give us a very clear picture of a trend,
    as shown in Figure 10.2.


    #### Figure 10.2 Chart of hours gaming trend

    Figure 10.2 Chart of hours gaming trend

    ![Graph: A first quadrant plane with horizontal axis showing hours gaming from
    0 to 8, and vertical axis o test score from 0 to 100. Points are shown at 1.5
    comma 90; 2.5 comma 78; 3.5 comma 63; 5 comma 56; 4 comma 64; 5 comma 45, and
    7.5 comma 28. ](images/f0075-02.jpg)

