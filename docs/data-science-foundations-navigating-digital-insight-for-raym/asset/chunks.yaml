- raw: "*   Public data: This is generally taken to mean any data that is publicly\
    \ accessible, that is, anyone can access it. This includes data found on the internet\
    \ and social media. It is worth remembering that just because something can be\
    \ accessed doesn’t mean it can be used. If you are intending to go on holiday,\
    \ then the flight times and prices presented to you online are public data. That\
    \ doesn’t necessarily give you a catch-all right to collect and use them.\n\n\
    *   Open data: This is a subset of public data, normally released by a government\
    \ or its agents. In this instance, the data is of a known quality, and it has\
    \ a licence associated with it that determines how it can be used. The benefit\
    \ of this is that the data is transparent and therefore can be used with confidence.\
    \ This doesn’t mean the data is free; in some instances, a fee might be payable\
    \ for its use. Census data published by the Office of National Statistics (ONS)\
    \ is an example of this type of data. \n\n    Figure 7.2 Types of data (availability\
    \ and creation)\n\n    ![Classification diagram,: Data categories are displayed\
    \ based on Availability, which includes Open, Public, and Proprietary types. Creation\
    \ categories include Research and Administrative or Operational types.](images/f0043-01.jpg)\n\
    \n*   Proprietary data: This is data that is not publicly available. The individual\
    \ or organisation who owns it has not made it public and they control how it is\
    \ used.\n\nCreation refers to how the data was generated. It can be split into\
    \ two categories:\n\n*   Administrative and operational data: This is the data\
    \ generated through the activities of an organisation, and the terms aren’t mutually\
    \ exclusive. The transaction details of our coffee purchase are administrative\
    \ and operational data. Similarly, if we grew coffee and recorded the yield of\
    \ the crops and the weight of beans roasted, these would also be administrative\
    \ and operational data.\n\n*   Research data: Where data is specifically collected\
    \ for a study or from an experiment, it is research data. Thinking back to the\
    \ link between smoking and cancer, the data used to prove this would be research\
    \ data. This data tends to be academic in nature, so if you respond to a survey\
    \ about your morning coffee it might be better seen as administrative or operational\
    \ data as it has been collected to run an organisation better.\n\nFINDING DATA\n\
    \nWhen sourcing data there are various places we can find it. We might already\
    \ have it in our organisation. If we haven’t got it, we might be able to obtain\
    \ it from a third party. Failing that, we will need to collect it ourselves.\n\
    \nIn a world of Big Data, organisations hold a lot of data. This is proprietary,\
    \ administrative and operational data. It is not always clear what data is available\
    \ nor its quality. Data governance, covered later in this chapter, can assist\
    \ with this.\n\nIt is possible to source open and public data. In some instances,\
    \ data is published online. This can provide a rich source of data (e.g. Census\
    \ data). It is also possible to purchase data from third parties; an example of\
    \ this is financial trading data. Data can also be obtained from social media\
    \ and other websites using approaches such as screen scraping or via their application\
    \ programming interfaces.\n\nThere is huge variation in the scope and scale of\
    \ data collection activities. Consider the effort involved in collecting data\
    \ in a pharmaceutical trial compared to a small customer survey. Thought must\
    \ be given to the method of data collection to ensure the quality of the data.\
    \ In all instances, don’t underestimate the effort involved because there are\
    \ often unforeseen challenges that need to be resolved, as can be seen in our\
    \ case studies in [Chapter 15](#26_ch15.xhtml).\n\nWhen we rely on people to collect\
    \ data, we need to remember they are human, and humans make errors. This is particularly\
    \ the case when typing in information. Therefore, it is helpful to ensure that\
    \ the data people are entering is validated. This might be through using drop\
    \ downs or tick boxes or checking the format of the information. Think about when\
    \ you enter an address to have your latest online purchase sent to. You might\
    \ type in the address and the system will check that the postcode is valid. It’s\
    \ even better if the postcode is used to look up the address, allowing you to\
    \ select your postal address from a trusted source. In this instance, there is\
    \ less chance of your parcel going astray. It also results in quality data for\
    \ our algorithm to help us better profile our customers.\n\nNo doubt you are frequently\
    \ asked to take part in a survey, normally on your customer experience or a product\
    \ you have bought. The challenge with surveys is ensuring you have a representative\
    \ set of data and that the questions you ask are clear. You might think that this\
    \ is easy, but even the experts get it wrong, as can be seen the UK 2021 census.\
    \ In this case, the statistics on gender identity were downgraded from official\
    \ statistics, due to potential confusion over the question being asked (Melley,\
    \ 2024).\n\nSTORING DATA\n\nIn many instances, organisations set up separate data\
    \ stores, which allow data to be accessed without affecting operational systems.\
    \ They also have the advantage of data reuse, reducing costs and increasing efficiency.\
    \ Three types of stores are often referred to:\n\n*   Data lake: This is a store\
    \ of data in its raw format, which can contain structured, unstructured and semi-structured\
    \ data. The data can come from many different sources. For example, data from\
    \ the enterprise resource planning (ERP), customer relationship management (CRM)\
    \ and email systems might all be placed in the data lake.\n\n*   Data warehouse:\
    \ This is a store of data used for reporting. It is normally at an enterprise\
    \ level, bringing together data from different systems. In most cases, the data\
    \ has undergone a level of data preparation, covered in [Chapter 8](#19_ch08.xhtml).\
    \ Looking at our example, subsets of the ERP and CRM data might be brought together\
    \ into the data warehouse, for example customer and supplier data.\n\n*   Data\
    \ mart: This is a subset of a data warehouse focused on a single domain of an\
    \ organisation. This could be in the form of customer and sales details being\
    \ taken from the data warehouse and placed in a sales data mart.\n\nIt is important\
    \ to note that not all organisations will have these data stores and data might\
    \ also be found in other locations, for example on shared drives or in document\
    \ repositories.\n\nMOVING DATA\n\nIt is worth considering the process of moving\
    \ data into these data stores from source systems. Similar processes are used\
    \ to take data from the data stores to the tools you use. The process has three\
    \ stages:\n\n1.  Extract: Accessing the source system and retrieving the data\
    \ required.\n\n2.  Transform: Preparing the data from the source system. This\
    \ might include bringing different data sets together, restructuring the data\
    \ and addressing quality issues.\n\n3.  Load: Writing the data sets to the new\
    \ data store.\n\nThese can be done in two different orders: ETL and ELT, as set\
    \ out in [Figure 7.3](#18_ch07.xhtml#fig7.3).\n\nFigure 7.3 ETL and ELT\n\n![Flow\
    \ diagram: Two pipelines: E T L: Extract, transform, load and E L T: Extract,\
    \ load, and transform.](images/f0045-01.jpg)\n\nThe fundamental difference in\
    \ the processes is where the transformation (data preparation) takes place. If\
    \ we take a data lake, it is likely that ELT will be used. The raw data from the\
    \ source will be placed in the data lake. For a data warehouse and data mart,\
    \ it is likely that ETL will be used, as the data will be transformed to ensure\
    \ the quality of the data loaded in the warehouse or mart. Many data scientists\
    \ favour ELT, as they gain access to the raw data, which potentially presents\
    \ more analytical possibilities.\n\nDATA GOVERNANCE"
  fmt: "\n## Data Types\n\n* **Public data**: This is generally taken to mean any\
    \ data that is publicly accessible, that is, anyone can access it. This includes\
    \ data found on the internet and social media. It is worth remembering that just\
    \ because something can be accessed doesn’t mean it can be used. If you are intending\
    \ to go on holiday, then the flight times and prices presented to you online are\
    \ public data. That doesn’t necessarily give you a catch-all right to collect\
    \ and use them.\n* **Open data**: This is a subset of public data, normally released\
    \ by a government or its agents. In this instance, the data is of a known quality,\
    \ and it has a licence associated with it that determines how it can be used.\
    \ The benefit of this is that the data is transparent and therefore can be used\
    \ with confidence. This doesn’t mean the data is free; in some instances, a fee\
    \ might be payable for its use. Census data published by the Office of National\
    \ Statistics (ONS) is an example of this type of data.\n\n  Figure 7.2 Types of\
    \ data (availability and creation)\n\n  ![Classification diagram,: Data categories\
    \ are displayed based on Availability, which includes Open, Public, and Proprietary\
    \ types. Creation categories include Research and Administrative or Operational\
    \ types.](images/f0043-01.jpg)\n\n* **Proprietary data**: This is data that is\
    \ not publicly available. The individual or organisation who owns it has not made\
    \ it public and they control how it is used.\n\n### Creation\nCreation refers\
    \ to how the data was generated. It can be split into two categories:\n\n* **Administrative\
    \ and operational data**: This is the data generated through the activities of\
    \ an organisation, and the terms aren’t mutually exclusive. The transaction details\
    \ of our coffee purchase are administrative and operational data. Similarly, if\
    \ we grew coffee and recorded the yield of the crops and the weight of beans roasted,\
    \ these would also be administrative and operational data.\n* **Research data**:\
    \ Where data is specifically collected for a study or from an experiment, it is\
    \ a research data. Thinking back to the link between smoking and cancer, the data\
    \ used to prove this would be research data. This data tends to be academic in\
    \ nature, so if you respond to a survey about your morning coffee it might be\
    \ better seen as administrative or operational data as it has been collected to\
    \ run an organisation better.\n\n## Finding Data\n\nWhen sourcing data there are\
    \ various places we can find it. We might already have it in our organisation.\
    \ If we haven’t got it, we might be able to obtain it from a third party. Failing\
    \ that, we will need to collect it ourselves.\n\nIn a world of Big Data, organisations\
    \ hold a lot of data. This is proprietary, administrative and operational data.\
    \ It is not always clear what data is available nor its quality. Data governance,\
    \ covered later in this chapter, can assist with this.\n\nIt is possible to source\
    \ open and public data. In some instances, data is published online. This can\
    \ provide a rich source of data (e.g. Census data). It is also possible to purchase\
    \ data from third parties; an example of this is financial trading data. Data\
    \ can also be obtained from social media and other websites using approaches such\
    \ as screen scraping or via their application programming interfaces.\n\nThere\
    \ is huge variation in the scope and scale of data collection activities. Consider\
    \ the effort involved in collecting data in a pharmaceutical trial compared to\
    \ a small customer survey. Thought must be given to the method of data collection\
    \ to ensure the quality of the data. In all instances, don’t underestimate the\
    \ effort involved because there are often unforeseen challenges that need to be\
    \ resolved, as can be seen in our case studies in [Chapter 15](#26_ch15.xhtml).\n\
    \nWhen we rely on people to collect data, we need to remember they are human,\
    \ and humans make errors. This is particularly the case when typing in information.\
    \ Therefore, it is helpful to ensure that the data people are entering is validated.\
    \ This might be through using drop downs or tick boxes or checking the format\
    \ of the information. Think about when you enter an address to have your latest\
    \ online purchase sent to. You might type in the address and the system will check\
    \ that the postcode is valid. It’s even better if the postcode is used to look\
    \ up the address, allowing you to select your postal address from a trusted source.\
    \ In this instance, there is less chance of your parcel going astray. It also\
    \ results in quality data for our algorithm to help us better profile our customers.\n\
    \nNo doubt you are frequently asked to take part in a survey, normally on your\
    \ customer experience or on a product you have bought. The challenge with surveys\
    \ is ensuring you have a representative set of data and that the questions you\
    \ ask are clear. You might think that this is easy, but even the experts get it\
    \ wrong, as can be seen the UK 2021 census. In this case, the statistics on gender\
    \ identity were downgraded from official statistics, due to potential confusion\
    \ over the question being asked (Melley, 2024).\n\n## Storing Data\n\nIn many\
    \ instances, organisations set up separate data stores, which allow data to be\
    \ accessed without affecting operational systems. They also have the advantage\
    \ of data reuse, reducing costs and increasing efficiency. Three types of stores\
    \ are often referred to:\n\n* **Data lake**: This is a store of data in its raw\
    \ format, which can contain structured, unstructured and semi-structured data.\
    \ The data can come from many different sources. For example, data from the enterprise\
    \ resource planning (`ERP`), customer relationship management (`CRM`) and email\
    \ systems might all be placed in the data lake.\n* **Data warehouse**: This is\
    \ a store of data used for reporting. It is normally at an enterprise level, bringing\
    \ together data from different systems. In most cases, the data has undergone\
    \ a level of data preparation, covered in [Chapter 8](#19_ch08.xhtml). Looking\
    \ at our example, subsets of the `ERP` and `CRM` data might be brought together\
    \ into the data warehouse, for example customer and supplier data.\n* **Data mart**:\
    \ This is a subset of a data warehouse focused on a single domain of an organisation.\
    \ This could be in the form of customer and sales details being taken from the\
    \ data warehouse and placed in a data mart.\n\nIt is important to note that not\
    \ all organisations will have these data stores and data might also be found in\
    \ other locations, for example on shared drives or in document repositories.\n\
    \n## Moving Data\n\nIt is worth considering the process of moving data into these\
    \ data stores from source systems. Similar processes are used to take data from\
    \ the data stores to the tools you use. The process has three stages:\n\n1. `Extract`:\
    \ Accessing the source system and retrieving the data required.\n2. `Transform`:\
    \ Preparing the data from the source system. This might include bringing different\
    \ sets together, restructuring the data and addressing quality issues.\n3. `Load`:\
    \ Writing the data sets to the new data store.\n\nThese can be done in two different\
    \ orders: `ETL` and `ELT`, as set out in [Figure 7.3](#18_ch07.xhtml#fig7.3).\n\
    \n  Figure 7.3 ETL and ELT\n\n  ![Flow diagram: Two pipelines: E T L: Extract,\
    \ transform, load and E L T: Extract, load, and transform.](images/f0045-01.jpg)\n\
    \nThe fundamental difference in the processes is where the transformation (data\
    \ preparation) takes place. If we take a data lake, it is likely that `ELT` will\
    \ be used. The raw data from the source will be placed in the data lake. For a\
    \ data warehouse and data mart, it is likely that `ETL` will be used, as the data\
    \ will be transformed to ensure the quality of the data loaded in the warehouse\
    \ or mart. Many data scientists favour `ELT`, as they gain access to the raw data,\
    \ which potentially presents more analytical possibilities.\n"
  trans: "\n\n## 数据类型\n\n*   **公开数据 (Public data)**：这通常指任何公开访问的数据，即任何人都可以访问。这包括在互联网和社交媒体上找到的数据。值得注意的是，仅仅某些东西可以访问并不意味着就可以被使用。如果你打算去度假，那么网上展示给你的航班时间和价格就是公开数据。但这并不一定意味着你拥有收集和使用这些数据的全权权利。\n\
    *   **开放数据 (Open data)**：这是公开数据的子集，通常由政府或其代理发布。在这种情况下，数据的质量是已知的，并且带有相关的许可协议，规定了如何使用它。这样做的好处是数据是透明的，因此可以放心地使用。这并不意味着数据是免费的；在某些情况下，使用它可能需要支付费用。国家统计局（ONS）发布的人口普查数据就是这类数据的示例。\n\
    \n  图 7.2 数据类型（可用性与创建）\n\n  ![分类图：根据可用性显示数据类别，包括开放数据、公开数据和专有数据。创建类别包括研究型和行政型或运营型。](img/f0043-01.jpg)\n\
    \n*   **专有数据 (Proprietary data)**：指非公开的数据。拥有这些数据的个人或组织未将其公开，并控制其使用方式。\n\n### 创建\
    \ (Creation)\n创建指的是数据生成的方式。它可以分为两类：\n\n*   **行政和运营数据 (Administrative and operational\
    \ data)**：这是通过组织活动产生的数据，这两个术语并不是互斥的。我们购买咖啡的交易细节就是行政和运营数据。同样，如果我们种植咖啡并记录作物产量和烘焙咖啡豆的重量，这些也将属于行政和运营数据。\n\
    *   **研究数据 (Research data)**：专门为研究或通过实验收集的数据即为研究数据。回想吸烟与癌症之间的关系，用于证明这一点的的数据就是研究数据。这类数据通常具有学术性质，因此如果你回答了关于早晨咖啡的调查，它可能被被视为行政或运营数据，因为这些数据是为了更好地运营组织而收集的。\n\
    \n## 寻找数据 (Finding Data)\n\n在寻找数据时，我们有很多地方可以找到它。我们可能已经在组织内部拥有了这些数据。如果我们还没有，可能可以从第三方处获取。如果还是不行，我们就需要自己收集。\n\
    \n在大数据时代，组织持有大量数据。这些是专有的、行政和运营数据。目前并不总是清楚哪些数据可用以及其质量如何。本章稍后介绍的数据治理可以提供帮助。\n\n\
    获取开放数据和公开数据是可能的。在某些情况下，数据发布在网上。这可以提供丰富的数据源（例如，人口普查数据）。也可以从第三方购买数据；金融交易数据就是一个例子。还可以通过屏幕抓取或通过其应用程序编程接口（API）从社交媒体和其他网站获取数据。\n\
    \n数据收集活动的范围和规模存在巨大差异。考虑一下在药物试验中收集数据的投入与小型客户调查相比的努力。必须考虑数据收集的方法，以确保数据质量。在所有情况下，都不要低估其中涉及的精力，因为通常会有需要解决的预见挑战，正如我们在第\
    \ 15 章中的案例所示。\n\n当我们依靠人员来收集数据时，我们需要记住他们是人，而人会出错。在输入信息时情况尤为如此。因此，确保人们输入的数据经过验证是有帮助的。这可以通过下拉菜单、复选框或检查信息格式来实现。想一下你输入地址以收货最新的在线购物物品时。你可能输入地址，系统会检查邮政编码是否有效。如果用邮政编码来查询地址会更好，让你能够从可靠来源选择你的邮政地址。在这种情况下，你的包裹丢失的概率较小。这也能为我们的算法提供高质量数据，帮助我们更好地建立客户画像。\n\
    \n毫无疑问，你经常被邀请参加调查，通常是关于你的客户体验或你购买过的产品。调查的挑战在于确保你拥有一组具有代表的数据，并且你提出的问题是的。你可能认为这很容易，但即使专家也会出错，正如英国\
    \ 2021 年的人口普查所示。在这种情况下，由于对提问可能产生混淆，性别认同统计数据已从官方统计中降级（Melley, 2024）。\n\n## 存储数据\
    \ (Storing Data)\n\n在许多情况下，组织会建立独立的数据存储器，允许在不影响运营系统的情况下访问数据。它们还有数据重用的优势，可以降低成本并提高效率。通常提到三种类型的存储器：\n\
    \n*   **数据湖 (Data lake)**：这是以原始格式存储的数据，可以包含结构化、非结构化和半结构化数据。数据可以来自许多不同的来源。例如，来自企业资源计划\
    \ (`ERP`)、客户关系管理 (`CRM`) 和电子邮件系统的数据都可以被放在数据湖中。\n*   **数据仓库 (Data warehouse)**：这是用于报告的数据存储器。它通常处于企业级，汇总了来自不同系统的数据。在大多数情况下，数据已经过某种数据准备，这将在第\
    \ 8 章中介绍。看看我们的示例，`ERP` 和 `CRM` 数据的子集可能会汇总数据仓库中，例如客户和供应商数据。\n*   **数据市 (Data mart)**：这是数据数据的子集，专注于组织的单一领域。这可以是从数据仓库中提取客户和销售详情并放入数据市。\n\
    \n注意的是，并非所有组织都有这些数据存储器，数据也可能出现在其他位置，例如共享驱动器或文档库。\n\n## 移动数据 (Moving Data)\n\n\
    考虑从源系统将数据移动到这些存储器的过程是值得的。类似的过程也用于从存储器提取你使用的工具。该过程有三个阶段：\n\n1.  提取 (Extract)：访问源系统并检索所需的数据。\n\
    2.  转换 (Transform)：对来自源系统的数据进行准备。这可能包括汇总不同的集合、重构数据以及解决质量问题。\n3.  加载 (Load)：将数据集写入新的数据存储器。\n\
    \n这些可以通过两种不同的顺序进行：`ETL` 和 `ELT`，正如图 7.3 所示。\n\n  图 7.3 ETL 和 ELT\n\n  ![流程图：两条流水线：\
    \ ETL：提取、转换、加载以及 ELT：提取、加载、转换](img/f0045-01.jpg)\n\n过程根本区别在于转换（数据准备）发生在哪里。如果我们采用数据湖，可能会使用\
    \ `ELT`。来自源的原始数据将被放在数据湖中。对于数据仓库和数据市，可能会使用 `ETL`，因为数据将进行转换以确保加载到仓库或市中的数据质量。许多数据科学家倾向于\
    \ `ELT`，因为他们可以获得原始数据，这可能提供了更多的分析可能性。\n\n"
