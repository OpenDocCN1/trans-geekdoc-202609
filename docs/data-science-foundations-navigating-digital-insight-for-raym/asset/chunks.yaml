    \ of time series:\n\n*   **Trend**: The long-term movement in the data.\n*   **Seasonality**:\
    \ Regular, repeating patterns or cycles.\n*   **Noise**: Random variability not\
    \ attributed to trend or seasonality.\n\n## Techniques for time series forecasting:\n\
    \n*   **Exponential smoothing**: This applies exponentially decreasing weights\
    \ to past observations for forecasting, which means it gives less weight to older\
    \ values.\n*   **Autoregressive integrated moving average (ARIMA)**: this is a\
    \ model capturing trend and seasonality in time series data. It uses elements\
    \ of regression and moving averages.\n\n## STATISTICAL MODEL – AUTOREGRESSIVE\
    \ INTEGRATED MOVING AVERAGE\n\n### Understanding time series analysis – ARIMA\n\
    \n`ARIMA` breaks down into three main components:\n\n*   `AR` (auto regressive):\
    \ this means the model uses past values to predict future ones. You may remember\
    \ that we used the word ‘regression’ in our linear regression model – it is a\
    \ similar principle here.\n*   `I` (integrated): this means the model looks at\
    \ changes between values instead of the raw data. This helps to deal with trends\
    \ or data that changes over time.\n*   `MA` (moving average): this uses a mean\
    \ average of the data, but, instead of looking at all of the data items, it will\
    \ use a certain number of past and future values. This forces the model to keep\
    \ re-evaluating the ‘average’ based on nearby values.\n\nWhen you want to understand\
    \ how data moves with time, you have to take account of changes in the trend.\
    \ The `ARIMA` model is adept at using relevant values to predict the next changes\
    \ by focusing on a moving picture of the data.\n\n### The output\n\nThe `ARIMA`\
    \ model will predict future values, and these tend to be plotted on a graph.\n\
    \n### The formula\n\nThe simplest `ARIMA` method is known as the Box–Jenkins model.\
    \ It is a combination of the linear trend and the moving average.\n\n```\nY[t]\
    \ = δ + ϕ[1] Y[t–1] + ϕ[2] Y[t–2] + … + ϕ[p] Y[t–p] + ∊[t] + θ[1]∊[t–1] + θ[2]∊[t–2]\
    \ + … + θ[q]∊[t–q]\n```\n\n![Images](images/f0082-01.jpg)\n\n### What does it\
    \ look like?\n\nApplying `ARIMA` takes a number of steps, and it will certainly\
    \ be necessary to use tools to calculate results on any reasonable-size data set.\
    \ Let’s work through the steps that are taken as an example of what happens during\
    \ the process.\n\nUsing some basic mobile phone sales data, let’s try and predict\
    \ what will happen in Week 8:\n\n| Week | Mobile phones sold |\n| --- | --- |\n\
    | 1 | 500 |\n| 2 | 520 |\n| 3 | 530 |\n| 4 | 570 |\n| 5 | 580 |\n| 6 | 600 |\n\
    | 7 | 630 |\n\n#### Step 1: Check if the data is stationary\n\n`ARIMA` works best\
    \ when your data does not have any trends (also known as seasonality). We are\
    \ therefore aiming to make the data stationary.\n\nTo make data stationary (i.e.\
    \ remove the trend), we calculate the difference between consecutive values. This\
    \ is called ‘differencing’.\n\n| Week | Mobile phones sold | First difference\
    \ (change) |\n| --- | --- | --- |\n| 1 | 500 | – |\n| 2 | 520 | 520 – 500 = 20\
    \ |\n| 3 | 530 | 530 – 520 = 10 |\n| 4 | 570 | 570 – 530 = 40 |\n| 5 | 580 | 580\
    \ – 570 = 10 |\n| 6 | 600 | 600 – 580 = 20 |\n| 7 | 630 | 630 – 600 = 30 |\n\n\
    We can see that the differences (20, 10, 40, 10, 20, 30) don’t have a clear trend\
    \ – they are not obviously increasing or decreasing.\n\n#### Step 2: Identify\
    \ the ARIMA parameters (p, d, q)\n\n`ARIMA` has three main parameters:\n\n1. \
    \ `p` (auto regressive order): this is the number of past values (lags) the model\
    \ looks at. For example, if `p = 1`, the model uses the previous one week’s sales\
    \ to make predictions.\n2.  `d` (differencing order): this is the number of times\
    \ the data is differenced to make it stationary. From Step 1, we differenced the\
    \ data once.\n3.  `q` (moving average): this uses a mean average of the data,\
    \ but, instead of looking at all of the data items, it will use a certain number\
    \ of past and future values. This forces the model to keep re-evaluating the ‘average’\
    \ based on nearby values.\n\nWhen you want to understand how data moves with time,\
    \ you have to take account of changes in the trend. The `ARIMA` model is adept\
    \ at using relevant values to predict the next changes by focusing on a moving\
    \ picture of the data.\n\n(Note: The source text provided contained several repeated\
    \ sections; I have formatted the core content once to ensure clarity and professional\
    \ documentation standards.)\n"
