- raw: 'The few words of this case study don’t reflect the time and effort that went
    into the collection and analysis of the data. Some would see the year of effort
    as a failure, as no relationship was found that could allow carbonisation levels
    to be determined. Steve and Smart Container Co don’t see it that way. The results
    showed they were listening to their client, and they now know how not to measure
    carbonisation. This has allowed them to develop their thinking on how they could.
    Often, failure to prove the hypothesis is seen as a project failure, and buried.
    whereas it is in fact a valid outcome of a data science project and increases
    knowledge and understanding.


    COGNITIVE BUSINESS


    In the shadow of Ratcliffe-On-Soar, the last coal fired power station in the UK,
    you will find Ty and his company Cognitive Business. This area of the East Midlands
    is the historic epicentre of the UK power industry. Cognitive Business has emerged
    from this environment to provide data-driven solutions to the wind industry. Ty
    describes himself as a physicist who does lots of other things, including some
    data science.


    Wind farms differ from power stations in one important respect: whereas each power
    station is unique, in a field of wind turbines, each will be similar. Ty recognised
    that this presented an opportunity to reduce costs and downtimes through predictive
    maintenance. Predictive maintenance involves working out when something is about
    to go wrong so that it can be fixed before it does. This was on the basis that
    the learning from one turbine could be intelligently applied to many.


    The first challenge was finding data on wind farms. With some effort, Ty and his
    team tracked down open data on a small wind farm. This allowed the team to build
    a prototype that they could then share with a large energy generator. This generator
    saw the benefits, and gave access to the data from one of their farms, allowing
    a robust model to be developed through an iterative process.


    Ty and his team make considerable use of machine learning to find patterns in
    the data and classify it. However, they start by visually inspecting the data
    and asking themselves questions around why changes they spot had occurred. Here,
    Ty’s knowledge of physics comes in useful: industrial machines obey the laws of
    physics, and thus the laws of physics should connect the data, these connections
    providing a focus for the automated investigations.


    One of the challenges in predictive maintenance is the reliability of industrial
    machinery – it’s very reliable. This means you don’t get a rich data set of faults,
    which means data to train fault detection models on can be in short supply. To
    counter this, the team started by identifying the normal patterns within the data.
    Anomalies in the data started emerging, which could signify faults. These anomalies
    were used to guide engineering investigations, the outcome of which was then fed
    back into the models.


    Although the turbines in a wind farm might notionally be the same, they are affected
    by external factors. This includes the wind direction, humidity and where they
    are physically located within the farm. To address this challenge, the team built
    millions of models to understand how the different factors affected the sensor
    data received. Clearly, each model could not be handcrafted, and so the process
    of model building and evaluation was automated.


    As a result of the work by Ty and his team, previously unknown faults in wind
    farms can be identified and investigated. The fault does not have to have occurred
    in the past.


    His view on data science is to focus on subjects you are passionate about. Find
    the data, use the free tools and build your skills.


    GOOD WITH


    Good With are a financial behavioural analytics company who are on a mission to
    change the way people are assessed for credit, to promote financial inclusion
    and support the mental well-being of groups who are excluded or underserved by
    financial services. Ellie and her colleagues are driven by their own experiences
    of financial exclusion, and bring their shared values and backgrounds in psychological
    sciences to their work. Ellie’s interest in data science grew from applying statistical
    techniques to the research she undertook as a psychologist, which she later transferred
    to working in a data science team for a global financial company.


    Good With have developed two core products: an alternative score for measuring
    financial capability and predicting borrowing risk, and a personalised learning
    journey designed to help people develop financial literacy and manage the emotional
    aspects of managing money. The personalisation of this framework is in part driven
    by personas (representations of the target audience). The process applied to this
    work is outlined below.


    Initial qualitative research identified four different financial personas for
    young people. Ellie wanted to validate these personas, using quantitative methods
    from data science. Data was collected from around 90 individuals using a questionnaire
    and by accessing their banking histories. The data was pre-processed to allow
    the correlation between key features to be explored. This included applying natural
    language processing to the text descriptions of financial transactions to classify
    spending, as well as looking at how often account balances fell below £0. It was
    unsurprising that, for example, high financial stress had a positive relationship
    with overdraft usage.


    The next step was to see how the features grouped together, to identify whether
    the personas shown in the qualitative research were visible in the data. The pre-processed
    features used in the correlation analysis were loaded into an unsupervised ML
    clustering model, which identified four different groups. Remarkably, these groups
    were closely aligned to the original personas identified through the initial research.
    With the data to underpin the personas, it has been possible for Good With to
    develop the personalised learning pathways and make data available to lenders
    to allow them to make better lending decisions, to the benefit of previously excluded
    customers.


    Combining several different models in an ordered process results in a very transparent
    set of outputs. This means that any decision or recommendation made by the model
    has an audit trail and can be justified. Ellie explained this was important not
    only from a regulatory aspect (should someone challenge an automated decision),
    but also to build confidence in prospective customers.


    Ellie recognises that a wide range of questions around financial and mental well-being
    could have been explored. In deciding what problems to explore the team asked
    the questions:


    *   What would the regulation allow them to do?


    *   How would understanding the problem lead to commercial benefits?


    *   How would the individual be affected?


    Ellie uses the example of mental health: looking at people’s financial data could
    be used to predict levels of depression. In a medical setting this might be beneficial.
    However, for Good With it didn’t have value and might feel intrusive or be otherwise
    detrimental to the individual. Furthermore, special category data (health) was
    involved, increasing the regulatory complications, meaning that this was an area
    they would not explore.


    When working with data, Ellie highlights the importance of understanding the regulations.
    She has found that, although it might have slowed the work down, it meant the
    project didn’t try to run before it could walk, leading to better problem definition
    and insight. She also emphasised the need to understand the implications of applying
    the data science in the real world, for example better lending decisions could
    increase lending, leading to lenders running out of money. However, her most important
    insight was that a data scientist isn’t there to know the answer to a problem,
    but to bring their creativity to answering it.


    SMARTabg'
