    保留所有权利。


    出版于


    `BCS Learning and Development`，属于 `BCS`, `The Chartered Institute for IT`, `3
    Newbridge Square`, Swindon, `SN1 1BY`, UK. [www.bcs.org](http://www.bcs.org)


    欧盟 `GPSR` 授权代表：`LOGOS EUROPE`, `9 Rue Poussin`, `17000 La Rochelle`, France. Contact@logoseurope.eu


    平装版 ISBN：`978-1-78017-6994`


    PDF ISBN：`978-1-78017-7007`


    ePUB ISBN：`978-1-78017-7014`


    ![图标：一本带有平装可用的书。](img/copy.jpg)


    英国出版数据


    英国图书馆有本书的 `CIP` 目录记录。


