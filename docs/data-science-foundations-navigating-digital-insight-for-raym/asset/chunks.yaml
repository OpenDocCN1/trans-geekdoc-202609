- raw: 'Some quality checks require understanding the data set and the domain to which
    it relates, others can be done by looking at the quality of the data source. For
    example, in looking at data to help find good candidates for a role, you need
    to consider whether the data sets have missing data. This could be done by looking
    at the data set for blank or null fields. However, it could be harder to determine
    if there was bias in the data set, for example because a recruiter had previously
    rejected candidates based on their age. In this instance, knowledge of the domain
    and comparing the data set to other similar data sets is likely to be helpful.


    Visual inspection


    A visual inspection of the data can be helpful to identify any anomalies that
    require investigation. Where the data set is large, a sample of the data can be
    inspected, and there are tools to assist in this. For example using filters to
    look for specific values and using conditional formatting to highlight them. Some
    tools are more sophisticated, for example they might help to identify duplicates.
    A visual inspection of the data is always a good idea.


    Graphical inspection


    The data can be presented graphically to help identify any anomalies in it. Box
    plots are effective in identifying outliers, and skew in data is apparent if plotted
    in a histogram. Graphically presenting null values or duplicate records can also
    assist in identifying potential issues.


    Cross checks


    Where data has been transformed, it can be cross checked against the source data
    or data sets created during the transformation. Where the data structure hasn’t
    changed, checking that the number of rows correspond can be helpful, as well as
    comparing statistics relating to the data (e.g. the mean value of a column). Check
    sums can still be used where the data had been manipulate, for example if we take
    a daily record of hours worked and derive the total hours worked per month, the
    total of both over any period should be the same. More detailed checks can be
    carried out by looking at fields and columns to check data isn’t missing or corrupted.


    Data quality dashboard


    If a data set is updated on a regular basis, you might consider setting up a data
    quality dashboard. This would reduce the effort in quality checking the data and
    provide confidence in the data science and insights driven by it.


    MITIGATION STRATEGIES


    When a data quality issue is found, you need to decide how to mitigate the risk
    it poses. There are several strategies that can be adopted, and thought needs
    to be given to how the strategy will affect the data set and model of which it
    is part.


    *   Accept: This is where the issue identified is accepted and you proceed to
    use the data set with the quality issue in it.


    *   Correct: In some instances, it is possible to correct the data quality issue.
    This might be a manual or automated process.


    *   Remove: The poor-quality data is removed from the data set. This is often
    through deleting the row or column of data that contains the issue. Removing data
    can lead to bias in the data set, especially when the data that is missing is
    not random. For example, if everyone occasionally forgot to enter data into a
    system, this is more random than if one member of staff consistently failed to
    load data.


    *   Imputation: In this instance, a value is determined for the missing data item
    and that value is used as a substitute. The substitute value is normally an estimate
    based on other data in the data set.


    *   Enrich: If a data set lacks the data it needs, it can be enriched. The data
    set could be missing data, or the data set might be too small. In some instances,
    there might not be sufficient variation in the data for the model to be effective.
    Enrichment is where additional data is added to address the issue. This data might
    be from an additional data source or it might be synthetic. When enriching data,
    the costs, the appropriateness of the data used and the ethical questions in relation
    to this need to be considered.


    *   Discard: In some cases, the data just won’t be up to job and the whole data
    set will need to be discarded. In this case, it is worthwhile understanding why
    it was discarded to allow the earlier detection of those issues in other data
    sets.


    As already mentioned, the preparation of data is closely related to the sourcing
    of data. Once a candidate data source has been found, then initial preparation
    work can take place. This might reveal issues with the source data that need to
    be addressed. The methods used in the model also influence the data preparation.
    It is important that the properties of the data fit the method used and that the
    data is good quality. Both of these aspects can affect the output of the model
    and, where this isn’t understood, can lead to decisions being made and actions
    taken on misleading insight.


    PRACTICAL TIPS


    *   Allow lots of time for preparation.


    *   Identify the activities that need to be undertaken to ensure the data has
    the correct form.


    *   Consider whether any transformation undertaken could introduce data quality
    risks.


    *   Consider what activities need to be taken to mitigate the quality risks in
    the data.


    *   Determine how you will check the quality of the data.


    *   Ask yourself whether your data set is suitable to test your hypothesis.


    9 BASIC CONCEPTS


    In the world of data science, we often talk about data points, averages and trends.
    However, understanding the variability and uncertainty inherent in data is just
    as crucial. Measures of spread and probability provide us with the tools to do
    just that. This chapter will explore these fundamental concepts in an approachable
