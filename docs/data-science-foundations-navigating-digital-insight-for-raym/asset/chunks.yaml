    1 INTRODUCTION


    Brad Pitt might not be the first person you think of when talking about data science.
    However, he both produced and stared in the hit movie Moneyball (Miller, 2011).
    This told the tale of a minor baseball team and how it used data science to compete
    with the major teams with significantly larger budgets. It’s a great underdog
    film, but what is really interesting is how the data science was adopted and changed
    baseball, in fact changed all sports. If movies aren’t your thing, the film is
    based on a book, which tells the true story (Lewis, 2004).


    You can see the impact of data science not only in sport but also in the world
    around you. Want to stream some TV or music? You are bound to have recommendations
    made to you, but have you ever thought that the TV programmes themselves are only
    made because the ‘data’ says they will be popular? All courtesy of data science.
    Of course they are the visible manifestation of its use. It has applications across
    society. Look closely at any sector and you’ll find data science at work.


    Data science has, and continues to have, a huge impact on the society we live
    in. It is hard to separate debate around artificial intelligence (AI) from the
    movie Terminator (Cameron, 1984), where the robots take over and wage war on humankind.
    Of more immediate concern might be the effect of AI on the nature of work. We
    are not here to talk about AI in great detail, but we are keen to explain the
    foundations to the data science that allows AI to have the capability that it
    does. Although largely outside the scope of this book, AI might be seen by some
    as the current pinnacle of data science. We cover their relationship in [Chapter
    14](#25_ch14.xhtml).


    We have written this book as an introduction to data science – to help you unlock
    its potential and be part of this force that is fundamental to shaping the society
    in which we live. Before we explore this, let’s first consider what we mean by
    data science.


    There is debate as to where the term data science originates, and no consensus
    on its exact meaning. However, the definitions tend to focus on two aspects: the
    disciplines involved in undertaking the analysis; and the type of analysis undertaken.


    Advancements in digital technology have been a key driver behind its development,
    enabling the more effective use of mathematical and statistical methods in understanding
    and interacting with the world around us. However, for this to have value, it
    requires domain knowledge to identify the problems and opportunities to which
    it is applied. As you will discover, data science is a multidisciplinary activity
    that will require you to develop skills and knowledge in all the above.


    Data science requires data analysis to be undertaken. Data analysis is often broken
    down into three components:


    *   Descriptive analytics: where data is analysed to explain what has happened.


    *   Predictive analytics: where data is analysed to predict what might happen.


    *   Prescriptive analytics: where data is used to determine a course of action.


    Sticking with sport, let’s take football (also known as soccer) – by many measures
    the biggest sport in the world. Descriptive analytics would be the number of goals
    scored by a player. You might be curious and want to know how many goals a player
    might be expected to score in a season. In doing this, you would be entering the
    realm of predictive analytics. Taking this a stage further, you could look to
    use the data to pick a team based on, among other things, the number of goals
    scored – this would be prescriptive analytics.


    These three categories provide a useful model when we talk about data analytics.
    You can use them to help communicate what you can achieve with data. However,
    it is important that we don’t forget that the world is complex and, although data
    science can be seen as the predictive and prescriptive analytics, it cuts across
    them all and some data analytics doesn’t easily fit within one of these descriptions.


    For this book, we have defined data science as using analytical methods, in an
    endeavour to gain insight from diverse data. This definition might be useful for
    writing a book, but we admit isn’t very exciting and engaging. If asked:


    ‘What is data science?’


    you might like to answer


    ‘The art of finding patterns in data.’


    Why art? Data science involves creative thinking, about the challenges to be addressed,
    the sources, preparation and visualisation of the data and, of course, how it
    is communicated to stakeholders.


    What are patterns? Earlier we mentioned streaming services. If you looked at the
    number of people streaming each month over a period, you might see that the numbers
    increase by a certain amount each month. This regular increase is a pattern and
    might be used to predict the number of people streaming in the future. In this
    case, the pattern is an upwards trend. Another pattern could be in the types of
    films you like to watch or music you like to listen to. By looking at patterns
    in the characteristics of these, held in the data, films and music with similar
    characteristics can be found and recommended to you. So, we can say a pattern
    is an arrangement or sequence of data normally found through examining a model.


    Data science can be compared to an iceberg, which is mostly hidden in the ocean.
    Most people only see a very small part of what is going on. For every hypothesis
    reported on and visualisation shared, many, potentially complex, steps have been
    taken. We will explore these steps in detail.


    We have already noted the societal impact of data science. This raises questions
    as to when it is appropriate to use data science and how the insight generated
    is used. As early as the 1950s the links between smoking and cancer were known.
    However, this wasn’t something that the tobacco industry welcomed, leading to
    the use of public relations, lawyers and untruths to refute this. We will look
    at the regulatory and ethical issues related to data science.


    Data science is often applied with a very specific audience in mind. How do you
    communicate findings in a way that is both accurate and meaningful to them? Your
    intended audience might not be the only people with an interest in or to be affected
    by the work. Therefore, we will also consider stakeholders. Take a moment to consider
    the smoking example: who do you consider to be stakeholders? We will come back
    to this in [Chapter 2](#13_ch02.xhtml).


    The software tools for data science are wide ranging. There are numerous specialist
    proprietary systems that can be used. Tools are also prevalent in spreadsheets
    and readily available as open-source software. Given the number of tools available
    and their many differences, we will not be looking at any specific software. We
    will, however, examine the different methods that you can apply, using the tools
    of your choice, to answer questions and gain insight. The value of your work will
    depend upon the selection of the right methods to address the problem or opportunity
    presented, and the quality and properties of the data they are applied to.


    Data science in practice can take many forms, from major pharmaceutical research
    lasting years to a simple forecast of sales using Excel. For the purposes of this
    book, we will use the catch-all term ‘project’ to describe data science initiatives
    and activities in all their forms.'
