  trans: '

    在引言中，我们看到了数据科学如何改变体育运动。这是一个数据科学如何从根本上改变组织和社会运作方式的微小示例。从其统计学和机器学习的基础到其在现实决策中的应用，数据科学赋予了我们发现洞察、解决问题和创新的能力。通过负责任地拥抱数据科学并应对其伦理挑战，我们可以利用它的力量构建更智能的解决方案，改善生活并塑造更光明的未来。随着技术的进步和新数据源的出现，创新的可能性是无限的。从个性化医疗到自动驾驶汽车，数据科学处于我们时代一些最令人兴奋的发展前沿。


    虽然数据科学是一个复杂且充满挑战的领域，但它也非常有回报。通过掌握基础知识并跟上最新趋势，你可以释放数据的全部潜力，为世界带来真正的改变。


    # 术语表


    3Vs：涉及大数据的量（volume）、速度（velocity）和多样性（variety）。


    5Vs：在 3Vs 的基础上增加了真实性（veracity）和变异性（variability）。


    **Accuracy** 准确性：数据集的完整性。


    **Administrative data** 行政性数据：通过组织活动产生的数据。


    **Aggregation** 聚合：合并数据——通常用于报告群体而非个人，如果对个人进行单独报告，这些个人可能会被识别出来。


    **Agile** 敏捷：通常用于指迭代和增量式的项目交付方法——该术语与基于《敏捷宣言》中列出的原则的软件交付方法有关。


    **AI Act 2024** 2024 年人工智能法案：欧盟关于人工智能使用的法规。


    **Algorithm** 算法：解决问题的系列步骤或指令，可能存在于某种方法中。


    **Apriori algorithm** 先验算法：一种用于数据挖掘的方法，用于寻找频繁项集并生成关联规则。


    **ARIMA** 预测模型：一种用于通过分析过去值来预测时间序列数据的统计方法——它结合了移动平均和回归方法。


    **Array** 数组：一种结构化的项目集合，通常以行和列的形式存在，用于编程和数据分析。


    **Artificial intelligence** 人工智能：计算机执行通常由人类完成的任务。


    **Association rules** 关联规则：显示数据中变量之间关系的模式——通常用于市场篮子分析。


    **Bias** 偏差：导致错误结果的系统性错误——可能发生在数据收集或分析中。


    **Big Data** 大数据：用于描述当今社会中数据的普及，具有三个关键核心概念：量、速度、多样性（3Vs）。


    **Box and whisker plot** 箱线图：一种基于五项汇总统计显示数据分布的图表表示。


    **Cartesian plane** 直卡尔坐标平面：由 x 轴（水平）和 y 轴（垂直）定义的二维空间，用于绘制点。


    **Categorical** 分类数据的：可以被分组的数据。


    **Classification** 分类：根据特征将数据分为不同类别的方法。


    **Clustering** 聚类：一种在没有预定义类别的情况下将相似的数据点分组的技术。


    **Correlation** 相关性：衡量两个变量之间关联程度程度——它显示它们是同向移动还是反向移动。


    **CRUD** 创建、读取、更新、删除——通常被称为数据生命周期。


    **Data analysis lifecycle** 数据分析生命周期：一个规定了成功交付数据项目所需的迭代步骤的框架。


    **Data classification** 数据分类：可以有不同的含义：

    * 一种对数据进行分类以支持良好治理的方法。

    * 定义数据的性质，例如结构化/非结构化。

    * 一种分析数据的方法。


    **Data governance** 数据治理：制定管理数据的策略并将其运营化。


    **Data lake** 数据湖：以原始格式存储数据的数据存储。


    **Data lifecycle** 数据生命周期：一个数据项或数据集的生命周期，通常被称为 CRUD。


    **Data mart** 数据市：数据仓库的子集，专注于特定领域，例如销售。


    **Data Protection Act 2018** 2018 年数据保护法：赋予 GDPR 力的英国法律。


    **Data science** 数据科学：使用分析方法试图从多样化数据中获得洞察，或在数据中寻找模式的艺术。


    **Data set** 数据集：一组数据。


    **Data storytelling pyramid** 数据叙事金字塔：一种用于叙事的框架，包含背景、触发、发现和行动。


    **Data structure** 数据结构：数据存储的方式，例如表格。


    **Data type** 数据类型：数据存储的形式，例如整数。


    **Data warehouse** 数据仓库：存储数据的存储器，通常用于报告。


    **Decision tree** 决策树：一种帮助决策的流程图式结构。


    **Deep learning** 深度学习：具有许多层的神经网络的使用。


    **Derived data** 派生数据：通过合并或转换产生的新数据。


    **Descriptive analytics** 描述性分析：分析数据以描述发生了什么。


    **DIKW**：代表数据、信息、知识和智慧的框架。


    **Domain** 领域：项目发生的上下文——这影响结果。


    **ELT** 提取、加载和转换的过程。


    **Enrich** 丰富：在数据中添加额外数据。


    **Ethics** 伦理：我们判断他人行为的原则——这些随时间变化。


    **ETL** 提取、转换和加载的过程。


    **Export** 导出：从数据存储中取出。


    **Feature** 特征：数据集的关键特征或属性。


    **Feature scaling** 特征缩放：为特征创建一个相同的范围，确保它们一致。


    **Foundational model** 基础模型：经过预训练并可以适应不同用途的生成式人工智能。


    **Four pillars of data storytelling** 数据叙事的四大支柱：辅助数据叙事的设计原则，由符号、颜色、说明和编辑布局组成。


    **GDPR** 通用数据保护条例：欧盟关于数据使用的规则。


    **General AI** 通用人工智能：可以处理人类所有任务的人工智能。


    **Generative AI** 生成式人工智能：生成新数据或内容的人工智能。


    **Granularity** 粒度：数据的详细程度。


    **Hallucination** 幻觉：人工智能编造内容，即返回错误结果。


    **Heat map** 热图：一种用颜色表示值的图表表示——有助于可视化数据密度。


    **Histogram** 直方图：显示数值数据分布的图表表示，显示区间内数据点的频率。


    **Hybrid** 混合：结合了线性和迭代增量方法的交付方法。


    **Hypothesis** 假设：为调查提供起点的理论。


    **Hypothesis testing** 假设检验：一种在统计上确定数据能在多大程度上解释假设的方法。


    **ICO** 信息专员办公室可以调查违反数据保护法的行为并采取行动。


    **Imputation** 归补：为缺失数据项赋值，通常根据周围的数据确定。


    **Insight** 洞察：模型在评估后揭示的理解。


    **Intellectual property** 知识产权：指音乐、艺术和文学等作品。


    **Internet of things** 物联网：嵌入传感器和软件的互联设备网络。


    **Interval** 间隔：一种定量数据类型，值之间的差异是有意义的，但没有真正的零——例如摄氏温度。


    **Latency** 延迟：数据传输或处理的延迟。


    **Lineage** 血缘：数据集的来源和历史。


    **Linear regression** 线性回归：使用直线对因变量与一个多个自变量之间的关系的统计方法。


    **Lists** 列表：简单的项目集合，通常按特定顺序。


    **Load** 加载：将数据放入数据存储器。

    '
