  \n\n\n# 数组\n\n数组代表由一个名称组合的变量集合。数组的每个值都通过索引标识，索引指定在变量数组名后的方括号 `[]` 中。索引与其对应值的组合被称为数组单元。\n\
  \n```php\n<?\n$i = 1024;\n$a[1] = 'abc';\n$a[2] = 100;\n$a['test'] = $i - $a[2];\n\
  \necho of $a[1]. \"br\\n\";\necho of $a[2]. \"br\\n\";\necho of $a['test']. \"br\\\
  n\";\n?>\n```\n\n在给出的示例中，索引为 `1` 的 `$a` 数组单元出现在第三行；值 `abc` 被分配给数组单元。同一行也出现了 `$a`\
  \ 数组，因为这是在数组上下文中第一次提到变量 `$a`，数组会被自动创建。在第四行中，数值 `100` 被分配给索引为 `2` 的数组单元。在第五行中，等于\
  \ `$i` 和 `$a[2]` 差值被赋值给索引为 `test` 的 `$a` 数组单元。\n\n如你所见，数组的索引可以是数字也可以是字符串。\n\n在其他编程语言（例如\
  \ Perl）中，具有字符串索引的数组被称为哈希（`hash`），是独立的数据类型。在 PHP 中，实际上所有数组都是哈希，但字符串和数字都可以作为索引。\n\n\
  在上一个示例中，数组是在描述第一个数组单元时自动创建的。但也可以显式地设置数组：\n\n```php\n<?\n$i = 1024;\n$a = array (1=>'abc',\
  \ 2=> 100, 'test '=> of $i-100);\nprint_r ($a);\n?>\n```\n\n最后一个示例创建的数组 `$a` 与上一个示例中的数组完全相同。这里的每个数组单元按\
  \ `索引 => 值` 的形式设置。在创建测试元素时，有必要直接指定值 `100`，因为这次我们是“一次性”创建数组，而 PHP 在创建阶段并不知道其元素的值。\n\
  \n在第四行中，为了输出数组的值，我们使用了 `print_r()` 函数，它非常方便将数组内容输出到屏幕上——首先是为了调试。\n\n`print_r` 函数的输出行由普通的换行符\
  \ `\\n` 分隔，而不是标签 `<br>`。为了方便阅读，可以将 `print_r` (`.`) 输出包裹在 `<pre>...</pre>` 标签输出运算符中：\n\
  \n```php\necho of '<pre>';\nprint_r ($a);\necho' </pre>'; \n```\n\n如果显然没有指定索引，那么\
  \ PHP 数组将表现出类似于其他语言中数值数组的特征：下一个元素将具有连续的数字索引。计数从零开始。示例如下：\n\n```php\n<?\n$operating_systems\
  \ = array ('Windows', 'Linux', 'FreeBSD', 'OS/2');\n$operating_systems[] = 'MS-DOS';\n\
  \necho of \"<pre>\";\nprint_r ($operating_systems);\necho\" </pre>\";\n?>\n```\n\
  \n输出：\n```\nArray\n(\n    [0] => Windows\n    [1] => Linux\n    [2] => FreeBSD\n\
  \    [3] => OS/2\n    [4] => MS-DOS\n)\n```\n\n在这里我们显然没有指定索引：PHP 自动从零开始分配了数字索引。当使用此类记录形式时，可以通过\
  \ `for` 循环访问数组。数组单元的数量通过 `count` 运算符（或其同义词 `size of`）返回：\n\n```php\n<?\n$operating_systems\
  \ = array ('Windows', 'Linux', 'FreeBSD', 'OS/2');\n$operating_systems[] = 'MS-DOS';\n\
  \necho of '<table border=1>';\nfor ($i=0; $i <count ($operating_systems); $i ++)\
  \ {\necho' <tr> <td>'. $i.' </td> <td>'.$operating_systems[$i].' </td> </tr>';\n\
  }\necho' </table>';\n?>\n```\n\n记录的形式可以混合。请注意在手动安装某些索引后，PHP 自动分配了哪些索引。\n\n```php\n\
  <?\n$languages = array (\n1 => 'Assembler',\n'C ++',\n'Pascal',\n'scripting' =>\
  \ 'bash'\n);\n$languages['PHP'] = 'PHP';\n$languages[100] = 'Java';\n$languages[]\
  \ = 'Perl';\n\necho of \"<pre>\";\nprint_r ($languages);\necho\" </pre>\";\n?>\n\
  ```\n\n输出：\n```\nArray\n(\n    [1] => Assembler\n    [2] => C ++\n    [3] => Pascal\n\
  \    [scripting] => bash\n    [PHP] => PHP\n    [100] => Java\n    [0] => Perl\n\
  )\n```\n\n如你所见，数组的索引可以是数字也可以是字符串。（等等，上面的输出显示 Perl 的索引是 `[0]`）。\n\n（注：原文包含大量重复章节，此处已按照逻辑流进行处理。）\n\
  \n\n\n由于常量名不以任何特殊字符开头，因此在双引号中无法放置常量值（因为无法区分哪里是常量名，哪里只是文本）。\n\n## 4. 表单\n\n### 头部保留\n\
  打印友好版本\n\n1. HTML 表单。`$_GET` 和 `$_POST` 数组\n2. `htmlspecialchars()`\n3. `phpinfo()`\n\
  \n### HTML 表单。`$_GET` 和 `$_POST` 数组\n\n如果你还没有忘记第 1 章的内容，那么就不必再次提醒：表单是 Web 服务器与浏览器之间数据交换的主要方式，即提供用户交互——这正是\
  \ Web 编程所需的。\n\n为了进一步阅读，必须对第 1 章描述的 Web 编程基础有清晰的理解。如果你是初，我再次建议仔细重读。\n\n所以，我们将选取第\
  \ 1 章中你已经熟悉的例子：\n\n```html\n<html>\n<body>\n<?php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    echo '<h1> Hi, <b>'. $_POST['name'].</body></h1>!';\n}\n?>\n\
  <form method=\"POST\" action=\"<?= $_SERVER['PHP_SELF']?>\">\n    Enter your name:\
  \ <input type=\"text\" name=\"name\">\n    <br>\n    <input type=\"submit\" name=\"\
  okbutton\" value=OK>\n</form>\n</body>\n</html>\n```\n\n第 8-12 行给表单包含两个元素：`name`\
  \ 和 `okbutton`。`method` 属性指定了发送 POST 表单的方法（见第 1 章），`action` 属性指定的表单目标 URL 由服务器变量\
  \ `PHP_SELF` 的值填充——当前执行的脚本地址。\n\n`<?= $_SERVER['PHP_SELF']?>` 是 `echo` 的简写形式：`<?php\
  \ echo $_SERVER['PHP_SELF'];?>`。\n\n假设我们在 `name` 字段输入了值 `Bryan` 并点击了 OK 按钮。同时，浏览器向服务器发送\
  \ POST 请求。请求体：`name=okbutton=OK`。PHP 自动填充 `$_POST` 数组：\n\n```php\n$_POST['name']\
  \ = Bryan\n$_POST['okbutton'] = 'OK'\n```\n\n实际上，`Bryan` 值是以 `urlencode` 格式进入浏览器的；对于\
  \ windows-1251 编码，该值看起来为 `%C2%E0%F1%FF`。但由于 PHP 会自动执行必要的解码，我们可以“忘记”这一特性——我们不需要手动处理\
  \ HTTP 请求。\n\n由于请求体中只输入了名称和值，而没有表单元素的类型，PHP 并不知道 `$_POST['name']` 对应的是输入行、按钮还是列表。但通常来说，这些信息对我们完全并不需要。\n\
  \n由于提交按钮上写了什么对我们来说是可选的，在第 11 行可以删除 `name` 属性，将按钮的描述简化为 `<input type=\"submit\" value=OK>`。在这种情况下，浏览器将发送\
  \ `name=Bryan` 的 POST 请求。\n\n现在 - 同样的操作，但针对 GET 表单：\n\n```html\n<html>\n<body>\n\
  <?php\nif (isset($_GET['name'])) {\n    echo '<h1> Hi, <b>'.$_GET['name'].</body></h1>!';\n\
  }\n?>\n<form action=\"<?= $_SERVER['PHP_SELF']?>\">\n    Enter your name: <input\
  \ type=\"text\" name=\"name\">\n    <br>\n    <input type=\"submit\" value=OK>\n\
  </form>\n</body>\n</html>\n```\n\n在第 8 行同样可以写成 `<form method=\"GET\">`：`GET` 是默认方法。这次浏览器发送的是\
  \ GET 请求，等同于在地址栏中输入地址：`http://address-name/script-name.php?name`。\n\nPHP 处理 GET\
  \ 表单的方式与 POST 相同，不同在于填充的是（猜三次就知道了）一个 `$_GET` 数组。\n\n根本区别在于第 4 行。由于在浏览器地址栏中直接输入地址就是\
  \ GET 请求，因此检查 `if ($_SERVER['REQUEST_METHOD'] == 'GET')` 是没有意义的：在这种情况下我们发现的一切——都只是某人没有向我们的脚本发送\
  \ POST 表单；;) 因此，我们求助于 `isset()` 结构，如果该变量已定义（即已赋值），则返回 `true`；如果变量未定义则返回 `false`。如果表单已填写——正如你所理解的，PHP\
  \ 会自动为 `$_GET['name']` 分配对应的值。\n\n通过 `isset()` 检查的方法是通用的，也可以用于 POST 表单。此外，它更优，因为它允许发现表单中哪些字段被填充了。\n\
  \n在许多旧书和文章中声称：\n1. 来自 GET 和 POST 表单的数据都直接进入变量（在本例中为 `$name`），且 POST 数据具有优先级。\n2.\
  \ `$_GET` 和 `$_POST` 分别存储在 `$_GET_VARS` 和 `$_POST_VARS` 中。\n\n（注：原文后续存在大量重复且混乱的内容，已按要求提取核心逻辑）\n\
  \n\n\n问题在于，如果这些 `POST` 变量没有定义——如果表单尚未填写，它们将未被定义——`PHP` 将抛出关于使用未赋值变量的警告（这非常合理：这种信息可以让你快速发现变量名中难以察觉的拼写错误，并警告网站上可能存在的“漏洞”）。当然，你可以直接在表单中放置带有\
  \ `isset...` 的代码，但这会显得代码过于臃肿。\n\n明白了吗？现在试着在给定的代码中找出一个错误。嗯，不是绝对的错误，而是一个缺陷。\n\n###\
  \ `htmlspecialchars()`\n\n没找到吗？我来提示。例如，在“name”字段中输入一个双引号和一些文本，例如“123”。提交表单并查看接收页面的源代码。在第四行会有类似这样的内容：\n\
  \n`Enter your name: <input type= \"text\" of name= \"name\" value= \"\" 123\">`\n\
  \n那是——没什么事。但如果狡猾的用户输入了 JavaScript 代码呢？\n\n为了解决这个问题，必须使用 `htmlspecialchars()` 函数，它会将某些特殊字符替换为\
  \ HTML 实体表示（例如，引号会被替换为 `&quot;`）：\n\n```php\n<html>\n<body>\n<?php\n$name = isset\
  \ ($_POST['name'])? htmlspecialchars($_POST['name']):' ';\n$year = isset ($_POST['year'])?\
  \ htmlspecialchars($_POST['year']):' ';\n\nif (isset($_POST['name'], $_POST['year']))\
  \ {\n    if ($_POST['name'] ==' ') {\n        echo 'Enter a name! <br>';\n    }\
  \ else if ($_POST['year'] <1900 || $_POST['year']> 2016) {\n        echo 'Specify\
  \ by echo year of birth! Tolerance range of values: 1900. 2016 <br>';\n    } else\
  \ {\n        echo 'Hello, '. $name.'! <br>';\n        $age = 2016 - $_POST['year'];\n\
  \        echo 'to you '. $age.' years <br>';\n    }\n    echo' <hr>';\n}\n?>\n<form\
  \ method=\"post\" action=\"<?= <?= $_SERVER['PHP_SELF']?>\">\nEnter your name: <input\
  \ type=\"text\" name=\"name\" value=\"<?= $name?>\">\n<br>\nEnter your year of birth:\
  \ <input type=\"text\" name=\"year\" value=\"<?= $year?>\">\n<input type=\"submit\"\
  \ of value= OK>\n</form>\n</head>\n</html>\n```\n\n重复实验，并确信现在 HTML 代码是正确的。\n\n记住——当显示可能包含\
  \ HTML 特殊字符的变量内容时，必须始终使用 `htmlspecialchars()` 函数。\n\n### `phpinfo()`\n\n`phpinfo()`\
  \ 函数是 `PHP` 中最重要的函数之一。它输出关于 `PHP` 设置、各种配置变量的值的信息……\n\n为什么我在关于表单的章节提到它？`phpinfo()`\
  \ 是最方便的调试工具。`phpinfo()` 还会显示所有 `$_GET`、`$_POST` 和 `$_SERVER` 变量的值。所以如果表单中的变量“丢失”了，寻找它的最简单方法就是使用\
  \ `phpinfo` 函数。为了让该函数只显示变量值（而不需要滚动十页纸），应该这样调用：`phpinfo(INFO_VARIABLES)`；或者——使用绝对值\
  \ `phpinfo(32);`。\n\n示例：\n\n```php\n<html>\n<body>\n<form method=\"post\" action=\"\
  <?= <?= $_SERVER['PHP_SELF']?>\">\nEnter your name: <input type=\"text\" name=\"\
  name\">\n<input type=\"submit\" of value= OK>\n</form>\n<?php\nphpinfo(32);\n?>\n\
  </body>\n</html>\n```\n\n或者，例如这种情况：你想获取访客的 IP 地址。你记得相应的变量存储在 `$_SERVER` 数组中，但——运气不佳——你忘记了变量具体叫什么名字。此外，我们调用\
  \ `phpinfo(32);`，在页面中查找 IP 地址，并找到了它——在 `$_SERVER[\"REMOTE_ADDR\"]` 这一行。\n\n"
