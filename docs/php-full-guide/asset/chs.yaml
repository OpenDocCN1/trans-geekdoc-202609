- "# PHP 全栈指南\n\n\n\n\n\n欢迎来到 Web 编程的世界！在课程中，我将尝试教你，而你反过来也将尝试学习创建各种 Web 应用程序，从基础示例到功能完整的产品。\n\
  \n我在此要指出，我在编写这些内容时，假设你已经掌握了 HTML 标记语言的基础，并且至少有简短的编程经验。否则……嗯，你懂的。\n\n但是在开始学习 PHP\
  \ 语言之前，让我们先理解什么是 Web 编程。\n\n## I. 什么是 Web 编程。主要技术\n\n### I-1. 客户端-服务器\n\n如果你已经尝试过（并且可以，即使不成功）进行编程，例如使用\
  \ Delphi、Visual Basic 甚至是 Visual C++，那么你已经习惯了这种程序运行的方案：点击按钮 - 执行代码 - 显示结果，而这一切都在同一台计算机上完成。\n\
  \n在 Web 编程中，一切都不同。\n\n你是否想过当你在浏览器地址栏输入 URL（统一资源定位符，或者通俗地说——地址）时会发生什么？工作原理如下：\n\n\
  1. 浏览器与服务器建立连接\n2. 浏览器向服务器发送请求以获取页面\n3. 服务器为浏览器创建响应（通常是 - HTML 代码）并关闭连接\n4. 浏览器处理\
  \ HTML 代码并显示页面\n\n请注意**加粗**的部分。在你在屏幕上看到请求的页面之前，与服务器的连接已经关闭，它已经忘记了你。当你输入另一个（或同一个）地址，或者点击链接，或者按下\
  \ HTML 表单的按钮时——同样的方案将再次重复。\n\n这种工作方案被称为“客户端-服务器”。在这种情况下客户端是浏览器。\n\n因此，与 Web 服务器的连接只持续几秒钟（或几秒钟的一部分），这是从点击链接（或通过其他方式请求）到开始显示页面之间的时间。在连接期间，大多数浏览器会显示某个指示器，例如，MS\
  \ Internet Explorer 在右上角会显示动画。\n\n细心的读者会在这里注意到 - 既然我我已经读完了页面，指示器仍然显示连接过程呢？这是因为像\
  \ `<img src=...>` 标签（加载图像）以及其他一些标签仅仅是另一个服务器请求 - 并且它的执行方式与其他任何请求一样 - 遵循同样的方案。而且从服务器的角度来看，图片请求完全独立于\
  \ HTML 别名请求。\n\n为了永远摆脱对 HTTP 作为“黑盒”的认知，我们将通过 telnet “伪装”浏览器：\n\n1. 启动 `telnet www.php5.com\
  \ 80`\n2. 在终端窗口中输入以下内容（如果没有显示 - 也不糟糕）：\n\n```\nGET/HTTP/1.0 [我们在此按回车]\nHost: www.php5.com\
  \ [我们在这里按两次回车]\n```\n\n点击回车通常对应于 CR + LF 字符组合，标记为 `\\r\\n`。该标记将在后续使用。\n\n屏幕上将运行\
  \ `http://www.php5.com/` 页面的 HTML 代码。如你所示 - 并没有什么困难。\n\n当前页面的源代码几乎可以在任何浏览器中查看，只需在“查看|源代码”菜单中选择即可。\n\
  \n图片、框架 - 所有这些额外的请求都是一样的。实际上，浏览器窗口中的图片是从哪里来的：在解析（处理）HTML 代码时，浏览器遇到 `<img src=\"\
  picture\">` 标签会发送额外的服务器请求 - 图片请求，并将其显示在有 `<img...>` 标签的网站上。图片请求从服务器看来与 HTML 别名请求是完全独立的。\n\
  \n```\ntelnet www.php5.com 80\nGET /HTTP/1.0\nHost: www.php5.com\n```\n\n屏幕上将运行\
  \ `http://www.php5.com/` 页面的 HTML 代码。如你所示 - 并没有什么困难。\n\n当前页面的源代码几乎可以在任何浏览器中查看，只需在“查看|源代码”菜单中选择即可。\n\
  \n### I-2. HTML 表单。发送数据的方法\n\n在示例中：\n\n1. `<form method=\"GET\" action=\"/cgi-bin/handler.php\"\
  >`\n2. `<input type=\"text\" name=\"name\">`\n3. `<input type=\"submit\" value=\"\
  OK\">`\n4. `</form>`\n\n这是发送数据的常用 HTML 表单。\n\n让我们详细考虑这些表单。在表单中，以下属性是可选的：\n\n- `action`：指定表单提交的\
  \ URL（绝对路径或相对路径）。\n- `method`：指定发送表单的方法。在示例中，我们使用的是 \"GET\"。\n\n如果不指定 `method`，大多数浏览器将默认使用\
  \ \"GET\"。当使用 `GET` 方法时，表单的数据附加在 URL 后面。你可以在浏览器地址栏中看到它：`http://example.com/cgi-bin/handler.php?name=Bryan&okbutton=OK`。这就是\
  \ `GET` 方法的工作方式。\n\n实际上，发送表单有两种主要方法：\n\n- `GET`：表单数据附加在 URL 后面传输。\n- `POST`：表单数据在请求体中传输。\n\
  \n如果没有指定 `method` 属性——默认是 \"GET\"。\n\n`<input>` 标签通过 `type` 属性设置表单元素：\n\n- `text`：设置一个单行文本框。\n\
  - `submit`：设置一个点击即可提交的按钮。\n\n其他值也是可能的（且 `<input>` 不是设置表单元素的唯一标签），但我们将在后续章节中考虑它们。\n\
  \n那么，当我们点击 OK 时会发生什么？\n\n1. 浏览器读取表单元素，并根据它们的 `name` 和 `value` 属性创建表单数据。假设输入的名字是\
  \ Bryan。在这种情况下，这些表单数据为 `name=Bryan&okbutton=OK`。\n2. 浏览器与服务器建立连接，向服务器发送 `action`\
  \ 属性指定的文档请求，使用 `method` 属性指定的发送方法（在本例中为 \"GET\"），在请求中传输这些表单。\n3. 服务器分析收到的请求，创建响应，发送给浏览器并关闭连接。\n\
  4. 浏览器显示从服务器接收的文档。\n\n手动（通过 telnet 工具）发送相同的请求如下（假设网站域名为 www.example.com）：\n\n```\n\
  telnet www.example.com 80\nGET /cgi-bin/handler.php?name=Bryan&okbutton=OK HTTP/1.0\\\
  r\\n\nHost: www.example.com\\r\\n\n\\r\\n\n```\n\n正如你可能猜到的那样，点击带有 \"GET\" 方法的提交按钮，与在浏览器地址栏中输入相应的\
  \ URL（带有签名问号和表单数据）是类似的：`http://www.example.com/cgi-bin/handler.php?name=Bryan&okbutton=OK`。\n\
  \n实际上，当你从从服务器请求任何文档时，总是使用 `GET` 方法，无论你是刚刚输入了它的 URL 还是点击了链接。使用 `<form method=\"GET\"\
  ...>` 时，问号和这些表单数据只是被添加到 URL 之后。\n\n如果 `method` 属性没有指定——它意为为 \"GET\"。\n\n- `POST`：表单数据在请求体中传输。\n\
  \n\n\n\n\n也许，这些来自 `telnet-ohms` 的技术细节和练习对你来说极其无聊，甚至没有必要（“这里 PHP 在哪呢？”）。但并非徒劳。这些是\
  \ `HTTP` 协议下的基础知识，每个 Web 程序员都需要烂记于心，而且这并不是理论知识——这一切在实践中都是实用的。\n\n现在我们将把表单的第一行替换为以下内容：\n\
  \n1.<form method= \"POST\" action= \"/cgi-bin/form\\_handler.cgi\">`\n\n我们指定了发送方法为\
  \ `\"POST\"`。在这种情况下，数据传输到服务器的方式略有不同：\n\n```\ntelnet www.example.com 80\nPOST/cgi-bin/form_handler.cgi\
  \ HTTP/1.0\\r\\n\nHost: www.example.com\\r\\n\nContent-Type: application/x-www-form-urlencoded\\\
  r\\n\nContent-Length: 22\\r\\n\n\\r\\n\nname=Bryan&okbutton=OK\n```\n\n使用 `POST`\
  \ 方法时，这些表单会位于“两个回车符”之后——即在请求体中。以上所有内容实际上都是请求头（而当我们使用 `GET` 方法时，这些表单是在请求头中的）。为了让服务器知道在哪个字节结束读取请求体，请求头中有一行\
  \ `Content-Length`；这些表单将传输的内容类似于 `параметр1=значение1&параметр2=значение2...`，且值是以\
  \ `urlencode` 类型传输的——即与通过 `GET` 方法的方式相同，但在请求体中——向服务器报告请求头 \"Content-Type: application/x-www-form-urlencoded\"\
  。\n\n这种 `urlencode` —— 限制略小。\n\n`POST` 方法的优点是——对表单数据行的长度没有限制。使用 `POST` 方法时，无法像使用\
  \ `GET` 方法那样简单地通过“访问链接”来发送表单。\n\n为了表述简洁，我们将引入术语 `\"GET form\"` 和 `\"POST form\"\
  `，其中前缀对应 `<form>` 标签 `method` 属性的值。\n\n当使用 `POST form` 时，可以在其 `action` 属性的问号后面指定\
  \ `GET form` 参数。因此，`POST` 方法也包含了 `GET` 方法。\n\n### I-3. CGI 技术\n\n我们通过上一章理解了如何创建\
  \ HTML 表单，以及浏览器如何将其中输入的数据发送到服务器。但目前还不清楚服务器将如何处理这些数据。\n\nWeb 服务器本身仅能够提供请求的页面，仅此而已，而所有传输的这些表单对它来说是是无关。为了能够用任何程序处理这些数据并动态地为浏览器创建响应，发明了\
  \ `CGI` 技术（通用网关接口）。\n\n让我们来看这个 URL：`http://www.example.com/cgi-bin/form\\_handler.cgi`。关于它可以提出的第一个假设是它是正常的：服务器提供了来自\
  \ `cgi-bin` 目录的 `form_handler.cgi` 文件内容。然而，在 `CGI` 技术的情况下，情况是不同的。服务器启动 `form_handler.cgi`\
  \ 程序并将这些表单传输给它。程序创建文本并作为请求的响应传输给浏览器。\n\n`form_handler.cgi` 程序可以用任何编程语言编写，最重要的是在程序中遵守\
  \ `CGI` 标准。例如，可以使用流行的脚本语言 `Perl`。也可以用 `SI` 编写一切。或者用 Shell 脚本……但作为示例，我们将用 `SI` 编写这个程序。但在最初，我们将理解\
  \ Web 服务器与 `CGI` 程序之间存在的数据交换。\n\n在 `CGI` 程序启动之前，服务器会设置环境变量（这些在执行 `PATH` 命令时你很熟悉）。在任何稍微正式一点编程语言中，都有读取环境变量的手段。`CGI`\
  \ 标准定义了一组非常大量的变量，这些变量在 `CGI` 程序启动之前应该被定义。现在我们只考虑其中三个：\n\n- `REQUEST_METHOD` - 数据传输方法——`GET`\
  \ 或 `POST`（还有其他其他的，但目前我们不考虑它们）\n- `QUERY_STRING` - 支持 URL 中问号后面的部分，换句话说，这些是 `GET\
  \ forms`。\n- `CONTENT_LENGTH` - 请求体长度（这些 `POST forms`）。\n\n当服务器启动 `CGI` 程序时，请求体以标准输入\
  \ (`stdin`）的形式传输给程序——就像这些数据是从键盘输入的一样。\n\n当程序将浏览器的响应输出到标准输出 (`stdout`）——“在屏幕上”。这个输出被\
  \ Web 服务器截获并传输到浏览器。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n\
  {\n    //我们读取 Web 服务器设置的环境变量\n    char * query_string = getenv (\"QUERY_STRING\"\
  );\n    char * request_method = getenv (\"REQUEST_METHOD\");\n\n    char * post_data;//存储\
  \ POST 请求数据的缓冲区\n    int post_length = 0;//请求体长度\n\n    if (strcmp (request_method,\
  \ \"POST\") == 0) {//如果接收到 POST 请求，\n        post_length = atoi (getenv (\"CONTENT_LENGTH\"\
  ));//首先我们从\n        //环境变量中读取它的长度，\n        if (post_length){//如果它不为零，\n       \
  \     post_data = (char *) malloc(post_length+1);//我们为缓冲区选择内存，\n            fread\
  \ (post_data, post_length, 1, stdin);//我们从标准输入读取请求体，\n            post_data[post_length]\
  \ = 0;//我们用零字节完成这一行。\n        }\n    }\n\n    //我们显示响应头...\n    printf (\"Content-type:\
  \ text/html\\r\\n\\r\\n\");\n\n    //并它的正文：\n    printf (\"<h1>Hello!</h1>\\r\\\
  n\");\n\n    if (strlen(query_string)) {\n        printf (\"<p>GET form Parameters:\
  \ %s</r\\n\", query_string);\n    }\n\n    if (post_length) {\n        printf (\"\
  <p>POST form Parameters: %s (request body length: %d)</r\\n\", post_data, post_length);\n\
  \        free(post_data);//不要忘记释放 17 行选择的内存\n    }\n\n    return 0;\n}\n```\n\n\
  这是一个用 `SI` 编写的基础 CGI 程序，显示从 Web 服务器接收的表单内容。浏览器作为结果将收到类似的代码（如果是上一个例子中的 `POST form`）：\n\
  \n```html\n<h1>Hello!</h1>\n<p>POST form Parameters: name=Bryan&okbutton=OK (request\
  \ body length: 22)</p>\n```\n\n至于同时在用户屏幕上显示什么，我想显然不需要评论的。\n\n\n\n\n现在我们来看 Apache\
  \ 服务器。它本质上是模块化的，还允许通过在配置文件中添加一行来连接扩展功能（好吧，是两行）。如果有一种脚本语言，能够通过模块连接到 Apache 并运行在 Web\
  \ 之上，那就太好了，不是吧？嗯，你已经明白我想表达什么了——那就是 PHP。原则上讲，PHP 可以被编译，也可以像 Perl 一样使用——但通常适用于非标准的\
  \ Web 服务器或特殊的“癖好者”。\n\n## PHP：超文本预处理器\n\n11994 年，一位名叫 Rasmus Lerdorf 的程序员在苦恼于经典的\
  \ CGI 模块后，决定编写几个自己的 Perl 脚本，用以更方便地创建自己的主页，并将这项活动命名为 Personal Page（PHP）。过了一段时间，它需要处理表单，而且为了提高效率，所有内容都用\
  \ C 语言进行了重写——Personal Page 2.0 就此诞生了。Rasmus 遵循开源原则的作品被公开供大家审阅。\n\n1997 年，两位程序员 ——\
  \ Andi Gutmans 和 Zeev Suraski 发现了 PHP —— 当时他们正在寻找一种方便的 Web 脚本工具。这个想法让他们很愉快，但 PHP\
  \ 的功能和运行速度仍不尽人意。Andi 和 Zeev 决定从零开始重写 PHP。这种语言变得通用而强大，并很快吸引了大量 Web 开发者的关注：到 1998\
  \ 年底，PHP3 已用于约 10% 的 Web 服务器。“Personal Page”这个朴素的名字已经不再符合现实，于是根据 Unix 的传统，名称被更改为\
  \ PHP: Hypertext Preprocessor（PHP：超文本预处理器）。\n\nPHP4 的“引擎” Zend Engine 是通过共同努力开发的，从那以后\
  \ PHP 社区不断成长。在 2000 年，PHP 的一个版本在不到半年内就成为了 Unix（以及不仅是 Unix）Web 开发的标准：每个尊重自律的主机都提供了对\
  \ PHP 的支持。现在，基于新 Zend Engine 的 PHP5 开发即将结束……\n\n不过，感性性的内容就到此为止。让我们来看一个简单的脚本。\n\n\
  ## 2. 安装与 Apache+PHP 配置\n\n保留头部\n打印友好版本\n\n### Apache 安装\n\n1. **Apache 安装** \n\
  \   - 1. 在 Windows 操作系统中\n   - 2. 在 Unix 类操作系统中\n2. **PHP 安装**\n   - 1. 在 Windows\
  \ 操作系统中\n   - 2. 在 Unix 类操作系统中\n3. **Apache+PHP 配置**\n   - 4. PHP5\n\n### 简单脚本\n\
  \n与 SI 或 Perl 不同，PHP 脚本代表的是普通的、通常是 HTML 的页面：“就像这样”写的标签会被“原样”传输，如果它是一个普通的 html 别名。脚本由特殊标签\
  \ `<?php` 和 `?>` 组成，我们在其中使用 `echo` 运算符来输出文本。这种块可以根据需要任意存在，之间的所有内容都会被解释为普通的 html。\n\
  \nGET 请求的变量进入数组 `$_GET`，POST 请求的变量进入数组 `$_POST`，服务器变量（如 IP 地址类型、脚本名称等）进入 `$_SERVER`，“点”运算符\
  \ `.` —— 用于字符串的字符串连接……而且所有的内部处理操作（读取标准输入和环境变量、URL 解码）已经由 PHP 完成了。这很方便，不是吗？\n\n此外，为什么我们需要两个文件——一个带有表单的\
  \ HTML 和一个 PHP 脚本？一个脚本就足够了：\n\n```php\n<html>\n<body>\n<?php\nif ($_SERVER['REQUEST_METHOD']\
  \ == 'POST') {\n    echo \"<h1> Hi, \" . $_POST['name'] . \"</h1>!\";\n}\n?>\n<form\
  \ method=\"POST\">\n    Enter your name: <input type=\"text\" name=\"name\">\n \
  \   <br>\n    <input type=\"submit\" name=\"okbutton\" value=\"OK\">\n</form>\n\
  </body>\n</html>\n```\n\n我们从表单标签中删除了 `action` 属性——这意味着表单提交到“自身”，即发送到当前 URL。这有时被称为“回传表单”。在第\
  \ 4 行，通过 `if` 运算符检查是否使用了 POST 方法加载文档（类似于 SI 示例中第 13 行的内容），如果是，则在下一行显示问候语。\n\n在这个简单的程序——即某种\
  \ Web 版本的“Hello World”上——我们也将完成输入章节。\n\n\n\n\n在 `configure` 阶段，你可能会看到与系统缺少必要库相关的错误。这些库需要根据发行包中\
  \ `INSTALL` 文件的说明进行下载和设置（通常 - 顺序是相同的：`/ configure && make && make install`）。这项工作非常漫长且无味，因此长期以来，大多数\
  \ Unix 系统都包含了这种或那种更方便的软件安装工具。\n\n### FreeBSD\n\nFreeBSD 包含了用于软件安装的特殊手段 - `ports`（`ports`\
  \ 系统），它代表了一组脚本，这些脚本会自动下载、配置、编译和安装软件产品，包括启动所需的库（依赖项 - `dependences`）。我在此不再详细阐述，因为在\
  \ FreeBSD 中操作 ports 的方法在《FreeBSD 手册》（FreeBSD Handbook）和系列书中都有描述。假设你的系统中 ports 库已经安装并更新。\n\
  \n我们进入 Apache port 目录：\n\n```bash\ncd/usr/ports/www/apache13\n```\n\n我们以 root 身份启动编译和\
  \ Apache 安装团队（发行包会自动下载）：\n\n```bash\nsu\nmake install\n```\n\n如果必要在系统加载时自动启动 Apache，我们需要在\
  \ `/etc/rc.conf` 中注册：\n\n```ini\napache_enable= \"YES\"\n```\n\n实际上，就是这些；;)\n\n\
  如果需要精细配置，请研究 `Makefile` 并在 `make install` 命令后添加必要的参数（例如，`make install WITH_APACHE_SUEXEC=yes`\
  \ - 用于支持 `sexec`）。\n\n### Red Hat Linux 和其他基于 RPM 的发行包（ASP, Mandrake...）\n\nRed\
  \ Hat Linux 包含了 `RPM` 包管理器。RPM 的安装方法本质上是另一种方式 - `.rpm` 数据包包含了已经编译好的二进制文件。这节省了时间（不需要编译任何东西），但剥夺了按你意收集程序的机会。\n\
  \n要从 rpm 安装 Apache，需要加载 Apache 1.3 的 `.rpm-file`（从哪里找 - 请搜索 Google：Apache Software\
  \ Foundation (apache.org) 并不扩展 RPM）并启动：`rpm - Uvh apache`。\n\n### Gentoo Linux\n\
  \nGentoo Linux 是 “BSD 风格的 Linux”，它本质上包含 `portages` - 一个与 FreeBSD 使用的类似的 ports 系统。通过\
  \ `emerge` 命令进行安装，例如：\n\n```bash\ncd/usr/portage/net-www/apache\nsu\nemerge apache-1.3.31.ebuild\n\
  ```\n\n不要只运行 `emerge apache` - 这将导致 Apache 2 的安装。\n\n为了在系统加载时自动启动 Apache，输入：\n\n\
  ```bash\nrc-update add apache default\n```\n\n### 其他 Linux 发行包\n\n其他 Linux 发行包（Debian,\
  \ Slackware...）包含自己的包管理器 - 请参考文档。无论（即使在其他 Unix OS 中），你都可以手动编译并设置 Apache - 如上所述。\n\
  \n# III. PHP 安装\n\n### III-1 Windows 系列操作系统的安装\n\n从 `www.php.net/downloads.php`\
  \ 页面下载 Windows Binaries ZIP 压缩包（PHP 4.x.x Zip 包）。\n\n不要使用 “PHP 4.x.x installer”\
  \ - 那没有很多必要的文件！\n\n将压缩包解压到 `C:\\PHP`（或任何地方 - 但后文假设你选择了 `C:\\PHP`）。将 `php4ts.dll`\
  \ 文件复制到 `C:\\WINDOWS\\SYSTEM32`（或相应的目录）。将 `php.ini-dist` 文件复制到 `C:\\WINDOWS` 并将其重命名为\
  \ `php.ini`。\n\n### III-2 Unix 系列操作系统的 PHP 安装\n\nPHP 的安装过程与 Apache 的安装类似，不同之处在于编译\
  \ PHP 时你需要指定更多的配置选项。\n\n从源码手动编译 - 为此目的，首次启动需要通过 `www.php.net/downloads.php` 下载并解压源码。`/\
  \ configure` 也有助于研究编译的参数列表（非常令人印象）。\n\n无论如何，参数 `with-apxs=/put/k/apxs` 是必须的 - 它用于编译\
  \ Apache 的 `mod_php` 模块。例如，如果 Apache 设置在 `/usr/local`，则参数看起来如下： - `with-apxs=/usr/local/sbin/apxs`。\n\
  \n配置完成后，启动 `make` 和 `make install`。\n\n你使用的连接不同扩展的选项越多，越需要手动下载和设置必要的库。当然，最好使用你操作系统的包管理器或\
  \ ports。\n\n无论选择何种方式，成功安装后，将 `php.ini-dist` 复制为 `php.ini`：\n\n```bash\ncd/usr/local/etc\n\
  cp php.ini-dist php.ini\n```\n\n（取决于操作系统，`/usr/local/etc` 可以替换为 `directory/etc`\
  \ 等）。\n\n### FreeBSD\n\n从 FreeBSD ports 设置 PHP 是很方便的。\n\n在使用 `su` 命令获取超级用户权限后，我们进入目录\
  \ `/usr/ports/lang/php4`。\n\n从 ports 编译 PHP 有两种方式 - 交互式和通过 make 参数参数。\n\n在第一种情况下，我们直接启动\
  \ `make install` 命令。make 将下载并解压 PHP 发行包，屏幕上会出现一个可能的配置选项列表的窗口 - 只需在需要的旁边打“叉”即可。\n\
  \n交互式方法尽管方便，但有一个缺点 - 选择选择的参数无法保存以便反复用于相同的配置。可以在命令行中指定所有必要参数，例如 `make install WITH_MYSQL=YES\
  \ WITH_GD=YES`。所有可能的选项在 `/usr/ports/lang/php4/scripts/php4_options` 中（更新：最近，PHP\
  \ port 决定在所有情况下静态链接扩展时是不可能的）。或者，如果是动态扩展，在 `/usr/ports/lang/php4` 中 `make install`。对于\
  \ php5 也是如此。然而，当使用 PHP 作为 Apache 模块时，动态扩展你不必为此担心。\n\n### Red Hat Linux 和其他基于 RPM\
  \ 的发行包（ASP, Mandrake...）\n\n如前所述，Red Hat 包包含了已经编译好的二进制文件，你应该在互联网上找到适合你的配置 rpm 并使用\
  \ rpm 命令进行设置。\n\n### Gentoo Linux\n\nGentoo portage 中的 PHP（Apache 模块）位于 `/usr/portage/dev-php/mod_php`。指示配置参数使用\
  \ `USE` 变量（可能的 USE 值列表在 `gentoo.org/guid/use-index`）。可以编辑 `etc/make.conf`，但更方便的方法是：\n\
  \n```bash\nUSE=\"gd mysql\" emerge mod_php\n```在这种情况下，`USE` 变量仅在 emerge 运行时建立 (“以确保任何库都不会拖入\
  \ XFree86”)）。安装后，`php.ini` 文件（确是软链接）位于 `/etc/apache/conf`。\n\n# IV. Apache+PHP 配置\n\
  \n如果尚未通过安装程序完成，请在 Apache 配置文件 `httpd.conf` 中添加以下行：\n\nWindows 系统：\n\n```apache\n\
  LoadModule php4_module C:/php/sapi/php4apache.dll\n```\n\nUnix 系统：\n\n在最后一个 `LoadModule`\
  \ 指令之后：\n\n```apache\nLoadModule php4_module libexec/apache/libphp4.so\n```\n\n\
  所有系统：\n\n在最后一个 `AddModule` 指令之后：\n\n```apache\nAddModule mod_php4.c\n```\n\n在 `<IfModule\
  \ mod_mime.c>` 块中：\n\n```apache\nAddType application/x-httpd-php .php\n```\n\n在\
  \ `DirectoryIndex` 行中指定 `index.php`：\n\n```apache\nDirectoryIndex index.php index.html\n\
  ```\n\n### 扩展连接\n\n在 Windows 中，要连接扩展需要在 `php.ini` 中取消注释对应的 `extension=...` 行，同时不要忘记在\
  \ `extension_dir` 行中注册它们的路径（通常它们在 php4 的 `c:\\php\\extensions` 和 php5 的 `c:\\php\\\
  ext` 中）。\n\n\n\n\n\n在 Unix 中（除非你没有指定参数的共享属性 - 这在汇编时是...），扩展是通过 PHP 的重新组装连接的。\n\n\
  ## php.ini 设置\n\n如果你不是偶然来到这篇文章的（通过 Google 搜索，并认为对于下载的论坛或聊天，Web 服务器是必要的），并且正准备学习\
  \ PHP - 请按照如下方式设置指定变量的值。此外，请不要争论。至于为什么以及如何 - 我稍后会解释。\n\n`register_globals = off`\n\
  \n`magic_quotes_gpc = off`\n\n`magic_quotes_runtime = off`\n\n`error_reporting =\
  \ E_ALL` - 并且完全如此，任何 `E_ALL & ~ E_NOTICE` 等均可！\n\n`display_errors = on` \n\n## Apache\
  \ 启动\n\n现在一切都准备好启动 Apache 了。在 Windows 中：\n\n`net start apache`\n\n在 Unix 中：\n\n\
  ```\napachectl start\n```\n\n## V. PHP5 安装\n\nApache+PHP5 的建立方法与 Apache+PHP4 相同\
  \ - 只需将本指令中所有的 PHP4 替换为 PHP5（包括文件名和配置指令中的名称）。\n\n特别对于 Windows/Apache/PHP5，必须在 `httpd.conf`\
  \ 中注册：\n\n```\nLoadModule php5_module C:/php5/php5apache.dll\nAddModule mod_php5.c\n\
  AddType application/x-httpd-php .php \n```\n\nPHP 自助手册：第 3 章 PHP 语法基础\n\n## 头部目录\n\
  \n打印友好版本\n\n1. PHP 程序的结构\n2. 变量与数据类型\n3. 条件语句\n    1. `if`\n    2. `switch`\n4.\
  \ 循环\n    1. `while`\n    2. `do... while`\n    3. `for`\n5. 数组\n    1. `Foreach`\
  \ 循环\n    2. list 和 each 构造结构\n6. 常量\n\n## PHP 程序的结构\n\n与传统的脚本语言（如 Perl）不同，PHP 程序通过代码插入表示\
  \ HTML 页面。对比一下：\n\nPerl 脚本：\n\n```perl\n#!/usr/local/bin/perl\nprint \"Content-type:\
  \ text/html\\n\\n\";\nprint \" html\\n<head> <title> Hello World </title> </head>\
  \ \\n\";\nprint \" <body> <h1> of Hello World! </h1></body> \\n\";\nprint \" </</html>\"\
  ;\n```\n\nPHP 脚本（是的，这是 PHP 的程序；)):\n\n```html\n<html>\n<head> <title> of Hello World\
  \ </title> </head>\n<body> <h1> of Hello World! </h1></body>\n</html>\n```\n\n```\n\
  \n如你所见，PHP 的基础程序就是一个普通的 HTML 页面。关于头部 `Content-type: text/html` 的输出，PHP 也独立地处理了。\n\
  \n直接将 PHP 代码（即 - 不是 HTML）放置在标签 `<?` 和 `?>` 之间。位于这些标签之间的所有内容在显示时会被此块中的脚本替换为 HTML\
  \ 代码（在特定情况下 - 如果脚本没有显示内容 - 则直接“消失”）。\n\n通常，一种通用的（即保证在任何配置下都能工作的 PHP）但更长的 PHP 代码指定方式是标签\
  \ `<? php...?>`。这种较长的记录形式用于 XML 和 PHP 的组合，因为 `<?...?>` 标签被用于 XML 标准中。\n\n为了将 `<?`\
  \ 标签识别为 PHP 块的开头，由 `php.ini` 文件中的 `short_open_tag` 指令决定（默认开启）。如果你想开发不受此配置影响的运行脚本，请使用长开启标签\
  \ `<? php`。我将使用缩写形式。\n\n让我们来看一个简单的示例。\n\n1. `<html>`\n2. `<head> <title> of Hello\
  \ World </title> </head>`\n3. `<body> <h1> of Hello World! </h1>`\n4. `<p> Current\
  \ date: `\n5. `<?` \n6. `echo date (\"d.m.Y\");`\n7. `?>`\n8. `</body>`\n9. `</html>`\n\
  \n为了完成示例，请将它们复制到位于配置文件 `Apache httpd.conf` 中 `DocumentRoot` 指令对应的目录文件中（例如，在名为 `test.php`\
  \ 的文件中），并在浏览器地址栏（`http://localhost/test.php`）访问保存的脚本 (`test.php`）。如果你还没有设置 Apache+PHP（如果是这样的话），请参上一章。\n\
  \n如果今天是 2016 年 7 月 27 日，执行脚本后浏览器将接收到以下 HTML 代码：\n\n```html\n<html>\n<head> <title>\
  \ of Hello World </title> </head>\n<body> <h1> of Hello World! </h1>\n<p> Current\
  \ date:\n27.07.2016 </body>\n</html>\n```\n\n第 5、6、7 行是 PHP 代码插入。第 5 行和第 7 行分别是开启标签和结束标签。将它们放置在单独行上是完全可选的\
  \ - 这样做是为了阅读方便。\n\n在第 6 行使用了用于在浏览器中输出的 `echo` 操作符。它显示了 `date()` 函数的执行结果 - 在这种情况下是当前日期。\n\
  \n第 6 行是完成的表达式。PHP 中的每个表达式都以分号 `;` 结束。是分号，而不是换行符 - 不要忘记这一点，特别是如果你之前编写过 Visual Basic\
  \ 或 ASP 的话。\n\n留心的读者会注意到 `</body>` 标签与 `date()` 函数生成的文本位于同一行，尽管 `</body>` 在源代码中是单独占一行的。这是因为\
  \ PHP 会丢弃紧跟结束标签 `?>` 之后的换行符 - 这样做的特殊目的是在不希望出现额外空格的 HTML 片段中，不需要通过将关闭 PHP 标签与后续 HTML\
  \ 代码写在同一来赋予脚本可读性。如果需要空格 - 请在 `?>` 之后插入空行。\n\n## 变量与数据类型\n\nPHP 中的变量以 `$` 符号开头，后跟任意一组拉丁字母、数字和下划线符号\
  \ `_`；同时数字不能直接跟在 `$` 符号之后。\n\n变量名的大小写非常敏感：`$A` 和 `$a` 是两个不同的变量。\n\n为变量赋值时使用 `=`\
  \ 操作符。\n\n示例：\n\n1. `<?`\n2. `$a = 'test';`\n3. `$copyOf_a = $a;`\n4. `$Number100\
  \ = 100;`\n5. `$a echo;`\n6. `$copyOf_a echo;`\n7. `$Number100 echo;`\n8. `?>`\n\
  \n这段代码将显示：`test100`。\n\n你监控变量名：可能使用 `$a21` 或 `$zzz`。这里使用了 `$username`，理解起来非常容易。\n\
  \n在第 2 行，变量 `$a` 被赋值为值：在 PHP 中，变量在第一次赋值时被创建；如果未给变量赋值 - 则变量不存在。\n\n在第 3 行，变量 `$copyOf_a`\
  \ 被赋值为变量 `$a` 的值；在这种情况下（我们看 2）值为 'test'。在第 4 行，名为 `$Number100` 的变量被赋值为数值 100。\n\n\
  如你所见，PHP 存在类型，即语言区分数据类型 - 字符串、数字等。然而，这里的 PHP 是一种弱类型语言 - 数据类型之间的转换会自动发生。例如，程序 `<?\
  \ echo '100' + 1;?>` 将显示数字 101：在数值上下文中，字符串会自动转换为数字（在这种情况下 - 字符串 '100' 在用于组合时将转换为数字，因为字符串没有定义加法）。\n\
  \n这种行为（以及不需要显式定义变量甚至没有可能）使得 PHP 与 Perl 和 Basic 相似，但它可能会受到严格语言（如 SI 和 Pascal）追随者的敌视。当然，准确定义变量和要求显式类型转换可以减少编程错误的可能性，但对于首先是用于快速开发脚本的解释型语言\
  \ PHP 来说，语法的严格性在编码速度上得到了很好的补偿。而且它总是乐意地报告未定义的 PHP 变量 - 如果当然没有禁止的话……然而，我继续前进。\n\n\
  让我们再看又一个示例：\n\n1. `<?`\n2. `$greeting = 'Hi';`\n3. `$name = Bryan;`\n4. `$message\
  \ = \"$greeting, $name!\";`\n5. `$message echo;`\n6. `?>`\n\n\n\n\n第四行值得特别关注。在双引号中指定了最后几行定义的变量。如果执行这个程序（你已经写好了吗？），在浏览器窗口中将显示\
  \ `Hi, Bryan` 这行！实际上，双引号的主要特征还包括：在成对字符内指定的变量名会被替换为这些变量对应的值。\n\n此外，在双引号中，还会识别由两个字符组成的特殊转义组合，其中第一个字符是反斜杠（`\\\
  \\`）。最常用的控制字符有：\n\n- `\\r` - 回车 (CR)\n- `\\n` - 换行 (NL)\n- `\\\"` - 双引号\n- `\\$`\
  \ - 符号字符（`$`）\n- `\\\\` - 实际上是反斜杠（`\\`）\n\n字符 `\\r` 和 `\\\\` 通常与 `\\n` 一起使用，形式为组合\
  \ `\\r\\n` - 这在 Windows 中表示换行，许多 TCP/IP 协议也是这样命名的。在 Unix 中，换行由单个字符 `\\n` 表示；通常这种换行方式也用于\
  \ HTML 文档（当然，这只影响 HTML 代码，而不影响浏览器的显示（除非文本被放入 `<pre>...</pre>` 标签对中）：正如我们所知，为了显示换行，使用的是\
  \ `<br>` 标签）。\n\n提供的反斜杠应用列表中剩余的三个点是转义（屏蔽）的示例 - 即取消字符的特殊作用。因此，双引号将表示行尾，美元符号表示变量名的开头，而反斜杠则表示转义组合的开头（我们在这里也提到了这一点；))）。在转义时，字符被按“原样”感知，且不会执行任何特殊操作。\n\
  \n转义（不是指反斜杠，而是这种原理；）在 PHP 中用于许多情况下 - 所以我们还会多次遇到这种方法。\n\n如果在单引号中替换引号，浏览器中将直接显示它们内部的内容（显示\
  \ `$greeting`、`$name`！）。单引号中以 `\\\\` 开头的字符组合也不会发生任何形式的转换，有两个例外：`\\'` - 行中的单引号；`\\\
  \\` - 反斜杠（数量仅为一个）。\n\n让我们稍微修改一下上一个例子：\n\n```php\n1.<?\n2.$greeting = 'Hi';\n3.$name\
  \ = Bryan;\n4.$message = $greeting.','. $name.'!';\n5.$message echo;\n6.?>\n```\n\
  \n这次我们没有开始使用双引号的“兼容性”：在第 4 行中，变量名和字符串常量是通过连接运算符（行关联）编写的。在 PHP 中，连接由点号 ``.` 表示。该程序执行的结果与上一个示例相似。\n\
  \n我建议使用这种编写方法，理由是充分的：\n\n- 变量名在视觉上与行值分得更开朗，这在带有代码高亮的编辑器中效果远优于其他所有方法；\n- `PHP` 解释器处理此类记录的速度稍快一点；\n\
  - `PHP` 能够更准确地追踪变量名中的拼写错误；\n- 你不会犯下类似的错误：例如 `$message = \"$greetingBryan\"` - 在这种情况下，`PHP`\
  \ 不会产生 \"HiBryan\"，而是空行，因为 `$greetingBryan` 会被识别为一个变量名，而我们并没有定义该变量。\n\n然而，双引号是非常强大的。\n\
  \n\n\n\n```php\n8.} else {//除了相等外，无一剩余 \n9.echo' to $i is equal to $j';\n10.}\n\
  11.?>\n```\n\n对于额外的“分支”，使用了 `if` 运算符... `else if`... `else`。正如关于 `if` 的情况一样，`else`\
  \ 块也可以是缺少的。根据最近的建议，我结论将所有的 `echo` 运算符都写在了大括号中，尽管不加大括号它们也能完美工作。\n\n顺便说一下，在第 `8` 行\
  \ - 注释。它是提供给阅读者的信息，`PHP` 会忽略它。注释有两种类型：单行注释，像这里这样 - 以 `//` 开始并延伸到行尾；以及多行注释 - 位于两对字符\
  \ `/*` 和 `*/` 之间的所有内容都被视为注释。\n\n`look//` 注释是少数几个指令以换行符结束的例之一。我提醒一下 - `PHP` 在大多数情况下对行的换行是不敏感的：之前所有的例子都可以写在一行。\n\
  \n### Switch\n\n需要根据同一个变量或表达式的值来实现“分支”。可以写出像这样的：\n\n```php\nif ($i == 1) {\n   \
  \ //对应 $i == 1 的代码\n} else if ($i == 2) {\n    //对应 $i == 2 的代码\n} else if ($i ==\
  \ 3) {\n    //对应 $i == 3 的代码...\n}\n```\n\n但有一个运算符，对于这种情况更方便 - `switch`。它看起来是这样：\n\
  \n```php\n<?\n$i = 1;\nswitch ($i) {\n    case 1:\n    echo 'one';\n    break;\n\
  \    case 2:\n    echo 'two';\n    break;\n    case 3:\n    echo 'tri';\n    break;\n\
  \    default:\n    'I am able to consider echo only to three!;)';\n}\n?>\n```\n\n\
  观察程序执行的结果，改变第二行中 `$i` 的值。正如你已经确定的理解的，`switch` 括号中指定变量（尽管也可以是表达式 - 例如 `try $i+1`），而\
  \ `case XXX` 行对应括号内事实的值。\n\n在 `case-a` 之间的运算符不需要在大括号中结束 - 每一个分支都以 `break` 运算符结束。\n\
  \n`default` 的特殊条件对应于“所有其余部分”（`if... else if. `else` 中的 `else` 类似物）。`default` 总是位于最后，因此这里的\
  \ `break` 是可选的。正如 `else` 情况一样，`default` 的条件也可以是缺少的。\n\n如果你突然忘记指定 `break`，所有后续的行\
