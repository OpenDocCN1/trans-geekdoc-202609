- raw: "The matter is that if these POST variables are not defined - and will be if\
    \ the form was not filled yet, - PHP will give warnings of use of unassigned variables\
    \ (and, it is quite reasonable: such message allows to find quickly hardly detectable\
    \ typos in names of variables, and also warns about possible \"holes\" on the\
    \ website). It is possible to place, of course, a code with isset... directly\
    \ in a form, but it will turn out it is too bulky. \n\nUnderstood? And now try\
    \ to find an error in the given code. Well, not absolutely an error, - but a defect.\
    \ \n\nhtmlspecialchars ()\n\nDid not find? I will prompt. Enter, for example,\
