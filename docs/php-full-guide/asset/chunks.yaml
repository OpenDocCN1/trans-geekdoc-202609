- raw: "At the stage configure probably you will see the errors connected with absence\
    \ in system of necessary libraries. They need to be downloaded and set according\
    \ to the instructions which are in files of INSTALL of distribution kits (usually\
    \ - it is the same sequence. / configure && make && make install). This business\
    \ quite long and boring, therefore for a long time the majority of Unix-systems\
    \ include this or that more convenient installation facility of the software.\
    \ \n\nFreeBSD\n\nFreeBSD includes special means for software installation - ports\
    \ (ports) representing a set of the scripts which are automatically downloading,\
    \ configuring, compiling and installing software products including libraries,\
    \ necessary for start (dependences - dependences). I will not paint in detail\
    \ here as in FreeBSD to work with ports - it is described in FreeBSD Handbook\
    \ and a set of books. Let's assume that in your system the library of ports is\
    \ set and updated. \n\nЈ we Pass into the directory of Apache port:\n\n$ cd/usr/ports/www/apache13\
    \ \n\nЈ we Start the team of assembly and the Apache installation from under root'a\
    \ (the distribution kit will be downloaded automatically):\n\n$ su\n\n\\# make\
    \ install \n\nЈ If it is necessary to start automatically Apache when loading\
    \ - we register in / etc/rc.conf:\n\napache\\_enable= \"YES\"\n\nActually, that's\
    \ all.;) \n\nIn need of thin configuration study Makefile and add necessary parameters\
    \ after the make install team (for example, make install WITH\\_APACHE\\_SUEXEC=yes\
    \ - for support of suexec).\n\nRed Hat Linux and other RPM-based distribution\
    \ kits (ASP, Mandrake...)\n\nRed Hat Linux includes the RPM package manager. The\
    \ installation approach from RPM essentially another - .rpm-packets contain already\
    \ compiled binary files. It gives a gain in time (it is necessary to compile nothing),\
    \ however, deprives of an opportunity to collect the program as you want. \n\n\
    For the Apache installation from rpm it is necessary to load the Apache 1.3 .rpm-file\
    \ (from where - look for Google: Apache Software Foundation (apache.org) does\
    \ not extend RPM and start: rpm - Uvh apache. \n\nGentoo Linux\n\nGentoo Linux\
    \ - the \"BSD style Linux\" which is inherently - contains portages - system of\
    \ ports similar on used in FreeBSD. Installation is made by means of the emerge\
    \ team, for example:\n\n$ cd/usr/portage/net-www/apache\n\n$ su\n\n\\# emerge\
    \ apache-1.3.31.ebuild\n\nDo not start just emerge apache - it will lead to the\
    \ Apache 2 installation.\n\nFor automatic start of Apache when loading, enter\n\
    \n\\# rc-update add apache default\n\nOther Linux distribution kits\n\nOther Linux\
    \ distribution kits (Debian, Slackware...) contain own package managers - address\
    \ documentation. Anyway (even in case of other Unix OS) you can compile and set\
    \ Apache manually - as it is described above. \n\nIII. PHP installation\n\nIII-1.\
    \ PHP installation in Windows family OS\n\nDownload from the www.php.net/downloads.php\
    \ page Windows Binaries ZIP archive (PHP 4.x.x Zip package). \n\nDo not swing\
    \ \"PHP 4.x.x installer\" - there are no many necessary files!\n\nUnpack archive\
    \ in C:\\\\PHP (or to any other place - but it will be assumed further that you\
    \ selected C:\\\\PHP). Copy the php4ts.dll file in the C:\\\\WINDOWS\\\\SYSTEM32\
    \ (or the corresponding directory). Copy the php.ini-dist file in the C:\\\\WINDOWS\
    \ и rename it in php.ini directory. \n\nIII-2. PHP installation in Unix family\
    \ OS\n\nInstallation process of PHP is similar to the Apache installation except\
    \ that at assembly of PHP you need to specify much more configuration options.\
    \ \n\nAt manual assembly from sources - for this purpose it is necessary to download\
    \ and unpack the source code with www.php.net/downloads.php - at first start.\
    \ / configure - help also study the parameter list of assembly (very impressive).\
    \ \n\nAnyway, parameter - with-apxs=/put/k/apxs is required - it is necessary\
    \ for assembly of the module of the Apache of mod\\_php. For example, if Apache\
    \ is set in / usr/local, then parameter will look as follows: - with-apxs=/usr/local/sbin/apxs.\
    \ \n\nAfter configuring, start make, and make install. \n\nThe more you use the\
    \ options connecting different expansions the more it is required to download\
    \ and set necessary libraries manually. It is better to use, of course, a package\
    \ manager or ports of your OS. \n\nIrrespective of the selected way, after successful\
    \ installation, copy php.ini-dist in php.ini: \n\ncd/usr/local/etc\n\ncp php.ini-dist\
    \ php.ini\n\n(depending on OS, instead of / usr/local/etc can be used by directory/etc,\
    \ etc.). \n\nFreeBSD\n\nIt is convenient to PHP to set from FreeBSD ports. \n\n\
    Having used the su team for obtaining the rights of the superuser, we will pass\
    \ into directory/usr/ports/lang/php4. \n\nThere are two options of assembly of\
    \ PHP from ports - interactive and by means of make team parameters. \n\nIn the\
    \ first case, we will just start the make install team. After make will download\
    \ and will unpack the PHP distribution kit, on the screen the window with the\
    \ list of possible options of configuring will appear - just put \"crosses\" against\
    \ necessary. \n\nThe interactive way, at all its convenience, has a shortcoming\
    \ - the parameters selected once cannot be saved for use of the same configuration\
    \ repeatedly. It is possible to specify all necessary parameters in the command\
    \ line, for example make install WITH\\_MYSQL=YES WITH\\_GD=YES. The list of possible\
    \ options is in the /usr/ports/lang/php4/scripts/php4\\_options file (this file,\
    \ by the way, and the script displaying a window in an interactive mode uses).\
    \ \n\nUpdate: recently (probably, from a big hangover) the meyntener of PHP port\
    \ decided to remake everything. And not only solved (alas). Now assembly of PHP\
    \ with static linking of expansions (i.e. compilation of PHP and the selected\
    \ expansions in one so-file) from ports is impossible. Or handles, or - if dynamic\
    \ (shared) expansions arrange - cd/usr/ports/lang/php4, make install, cd/usr/ports/lang/php4\\\
    _extensions, make install. For php5 - similarly. Corresponding lines extension=.\
    \ will register in php.ini automatically. However, when using PHP as Apache-module,\
    \ dynamic expansions at all not more slowly static so you should not be upset\
    \ especially about it. \n\nRed Hat Linux and other RPM-based distribution kits\
    \ (ASP, Mandrake...)\n\nAs as it was already told, Red Hat-packets contain already\
    \ compiled binary files, you should find on the Internet ready rpm with the configuration\
    \ which is most suitable you and to set it, having used the rpm team. \n\nGentoo\
    \ Linux\n\nGentoo-portage PHP (Apache module) there is in / usr/potrage/dev-php/mod\\\
    _php. For the indication of the configure parameters use the USE variable (the\
    \ incomplete list of possible USE values in Gentoo Linux: www.gentoo.org/dyn/use-index.xml).\
    \ It is possible to edit etc/make.conf, but it is more convenient so: \n\n\\#\
    \ USE= \"gd mysql pdf xml xslt-X\" emerge mod\\_php \n\nIn this case, the USE\
    \ variable is established only on runtime of the emerge team. (\" - X\" - for\
    \ a guarantee that any library will not pull along XFree86). \n\nAfter installation,\
    \ the php.ini file (to be exact - symlink on it) is in / etc/apache/conf. \n\n\
    IV. Apache+PHP configuration\n\nIf it was not made yet by the installation program\
    \ of packets/ports, add the next lines to the configuration file of Apache httpd.conf:\
    \ \n\nЈ For OS Windows:\n\nLoadModule php4\\_module C:/php/sapi/php4apache.dll\
    \ \n\nЈ For OS Unix:\n\nafter the last directive LoadModule\n\nLoadModule php4\\\
    _module libexec/apache/libphp4.so\n\nЈ For all OS:\n\nafter the last directive\
    \ AddModule\n\nAddModule mod\\_php4.c\n\nIn the <IfModule mod\\_mime.c> block\n\
    \nAddType application/x-httpd-php .php\n\nPrescribe in the line DirectoryIndex\
    \ to index.php:\n\nDirectoryIndex index.php index.html \n\nConnection of expansions\n\
    \nIn Windows, for connection of expansions it is necessary to uncomment the corresponding\
    \ lines extension=... in php.ini, without having forgotten to register a way to\
    \ them in the line extension\\_dir=. (usually they are in c:\\\\php\\\\extensions\
    \ for php4 and in c:\\\\php\\\\ext for php5). "
