- raw: "As the name of a constant does not begin with any special character, in double\
    \ quotes value of a constant cannot be placed (as there is no opportunity to distinguish\
    \ where a constant name and where - just the text). \n\n4\\. Forms\n\nKeeping\
    \ of the head \n\nPrinter-friendly version\n\n1.HTML forms. Arrays of $ \\_GET\
    \ and $ \\_POST\n\n2.htmlspecialchars ()\n\n3.phpinfo ()\n\nHTML forms. Arrays\
    \ of $ \\_GET and $ \\_POST\n\nIf you did not forget chapter 1 material yet, then\
    \ it is hardly worth reminding: forms are the main way of data exchange between\
    \ the Web server and the browser, that is provide user interaction - actually\
    \ what and requires web programming. \n\nFor further reading a clear understanding\
    \ of the web programming bases described in chapter 1 is obligatory. If you the\
    \ beginner, I advise once again attentively to re-read it.\n\nSo, we will take\
    \ already familiar to you on chapter 1 an example: \n\n1.<html>\n\n2.<body>\n\n\
    3.<?\n\n4.if ($ \\_SERVER \\['REQUEST\\_METHOD'\\] == 'POST') {\n\n5.echo' <h1>\
    \ Hi, <b>'. $ \\_POST \\['name'\\].' </b> </h1>!';\n\n6.}\n\n7.?>\n\n8.<form method=\
    \ \"POST\" action=\" <?= $ \\_SERVER \\['PHP\\_SELF'\\]?>\">\n\n9.Enter your name:\
    \ <input type= \"text\" name= \"name\">\n\n10.<br>\n\n11.<input type= \"submit\"\
    \ of name= \"okbutton\" value= OK>\n\n12.</form>\n\n13.</body>\n\n14.</html>\n\
    \nThe form given in lines 8-12 contains two elements: name and okbutton. The method\
    \ attribute specifies a method of sending the POST form (see chapter 1), the action\
    \ attribute specifying URL to which the form goes is filled with value of the\
    \ server PHP\\_SELF variable - the address of the script which is carried out\
    \ at present. \n\n<?= $ \\_SERVER \\['PHP\\_SELF'\\]?> - contracted form of record\
    \ for echo: <? echo $ \\_SERVER \\['PHP\\_SELF'\\];?>. \n\nLet's assume, in the\
    \ field of name we entered value Bryan, and pressed the OK button. At the same\
    \ time the browser sends a POST request to the server. Request body: name=okbutton=OK.\
    \ PHP autocompletes an array of $ \\_POST:\n\n$ \\_POST \\['name'\\] = Bryan\n\
    \n$ \\_POST \\['okbutton'\\] = 'OK'\n\nActually, Bryan value goes the browser\
    \ in an urlencode-look; for the coding windows-1251 this value looks as %C2%E0%F1%FF.\
    \ But, as PHP automatically carries out necessary decoding, we can \"forget\"\
    \ about this feature - yet it is not necessary to work with HTTP requests manually.\n\
    \nAs in a body of a request only names and values are entered, but not types of\
    \ elements of forms, PHP does not know, there corresponds $ \\_POST \\['name'\\\
    ] to entry line, the button, or the list. But this information, in general, is\
    \ not necessary to us at all.  \n\nAs know what is written on the submit button,\
    \ to us it is optional, in line 11 it is possible to delete name attribute, having\
    \ reduced the description of the button to <input type= \"submit\" of value= OK>.\
    \ In this case, the browser will send name= POST request Bryan. \n\nAnd now -\
    \ the same, but for a GET form: \n\n1.<html>\n\n2.<body>\n\n3.<?\n\n4.if (isset\
    \ ($ \\_GET \\['name'\\])) {\n\n5.echo' <h1> Hi, <b>'. $ \\_GET \\['name'\\].'\
    \ </b> </h1>!';\n\n6.}\n\n7.?>\n\n8.<form action=\" <?= $ \\_SERVER \\['PHP\\\
    _SELF'\\]?>\">\n\n9.Enter your name: <input type= \"text\" name= \"name\">\n\n\
    10.<br>\n\n11.<input type= \"submit\" of value= OK>\n\n12.</form>\n\n13.</body>\n\
    \n14.</html>\n\nIn line 8 it would be possible to write <form method= \"GET\"\
    > equally well: GET - a method by default. This time the browser sends a GET request\
    \ which is equivalent to input in an address bar of the address: http://address-name/script-name.php?name.\
    \ \n\nPHP with GET forms arrives in the same way as with POST, with that difference\
    \ that is filled (guess from three times) an array of $ \\_GET. \n\nCardinal difference\
    \ - in line 4. As simple input of the address in a line of the browser is a GET\
    \ request, check of if ($ \\_SERVER \\['REQUEST\\_METHOD'\\] == 'GET') is senseless:\
    \ everything that we in this case will find out - what someone from not figs to\
    \ do did not send a POST form to our script.;) Therefore we resort to construction\
    \ of isset () which returns true if this variable is defined (i.e. value was appropriated\
    \ to it), and false - if the variable is not defined. If the form was filled -\
    \ as you already understood, PHP automatically appropriates to $ \\_GET \\['name'\\\
    ] the corresponding value. \n\nWay of check by means of isset () - universal,\
    \ it would be possible to use also for a POST form. Moreover, it is more preferable\
    \ as allows to find out what fields of a form are filled. \n\nIn many old books\
    \ and articles it is claimed that:\n\n1\\. Data both from GET, and from POST forms\
    \ get directly to variables (in our case - $name), and POST data are more priority,\
    \ i.e. \"rub clean\" GET data;\n\n2\\. Also data of GET and POST forms are stored\
    \ respectively in arrays of $HTTP\\_GET\\_VARS and $HTTP\\_POST\\_VARS.\n\nThis\
    \ information is very long time ago obsolete. Years three as. Web programming,\
    \ and, in particular, PHP develops in high gear. Remember this moment not to be\
    \ trapped with old books or scripts. \n\nInquisitive readers can receive particulars\
    \ here, and also proceed here.\n\nLittle more difficult example. \n\n1.<html>\n\
    \n2.<body>\n\n3.<?\n\n4.if (isset ($ \\_POST \\['name'\\], $ \\_POST \\['year'\\\
    ])) {\n\n5.if ($ \\_POST \\['name'\\] ==' ') {\n\n6.echo 'Enter a name! <br>';\n\
    \n7.} else if ($ \\_POST \\['year'\\] <1900 || $ \\_POST \\['year'\\]> 2016) {\n\
    \n8.'Specify by echo year of birth! Tolerance range of values: 1900. 2016 <br>';\n\
    \n9.} else {\n\n10.echo 'Hello, '. $ \\_POST \\['name'\\].'! <br>';\n\n11.$age\
    \ = 2016 - $ \\_POST \\['year'\\];\n\n12.echo 'to you '. $age.' years <br>';\n\
    \n13.}\n\n14.echo' <hr>';\n\n15.}\n\n16.?>\n\n17.<form method= \"post\" action=\"\
    \ <?= $ \\_SERVER \\['PHP\\_SELF'\\]?>\">\n\n18.Enter your name: <input type=\
    \ \"text\" name= \"name\">\n\n19.<br>\n\n20.Enter your year of birth: <input type=\
    \ \"text\" name= \"year\">\n\n21.<input type= \"submit\" of value= OK>\n\n22.</form>\n\
    \n23.</body>\n\n24.</html>\n\nNo new receptions are used here. Understand, execute\
    \ a code, try to modify... \n\nLet's change the last example that the user did\
    \ not need to fill fields repeatedly. For this purpose we will fill value attributes\
    \ of elements of a form with just entered values. \n\n1.<html>\n\n2.<body>\n\n\
    3.<?\n\n4.$name = isset ($ \\_POST \\['name'\\])? $ \\_POST \\['name'\\]:' ';\n\
    \n5.$year = isset ($ \\_POST \\['year'\\])? $ \\_POST \\['year'\\]:' ';\n\n6.\
    \ \n\n7.if (isset ($ \\_POST \\['name'\\], $ \\_POST \\['year'\\])) {\n\n8.if\
    \ ($ \\_POST \\['name'\\] ==' ') {\n\n9.echo 'Enter a name! <br>';\n\n10.} else\
    \ if ($ \\_POST \\['year'\\] <1900 || $ \\_POST \\['year'\\]> 2016) {\n\n11.'Specify\
    \ by echo year of birth! Tolerance range of values: 1900. 2016 <br>';\n\n12.}\
    \ else {\n\n13.echo 'Hello, '. $ \\_POST \\['name'\\].'! <br>';\n\n14.$age = 2016\
    \ - $ \\_POST \\['year'\\];\n\n15.echo 'to you '. $age.' years <br>';\n\n16.}\n\
    \n17.echo' <hr>';\n\n18.}\n\n19.?>\n\n20.<form method= \"post\" action=\" <?=\
    \ $ \\_SERVER \\['PHP\\_SELF'\\]?>\">\n\n21.Enter your name: <input type= \"text\"\
    \ name= \"name\" value=\" <?= $name?>\">\n\n22.<br>\n\n23.Enter your year of birth:\
    \ <input type= \"text\" name= \"year\" value=\" <?= $year?>\">\n\n24.<input type=\
    \ \"submit\" of value= OK>\n\n25.</form>\n\n26.</body>\n\n27.</html>\n\nLines\
    \ 4 and 5 can appear a little unclear. Everything is very simple: X = A? B: C\
    \ - abbreviated notation of a condition of if (A) X=B else X=C. The line 4 could\
    \ be written so: \n\nif (isset ($ \\_POST \\['name'\\]))\n\n  $name = $ \\_POST\
    \ \\['name'\\];\n\nelse\n\n  $name =' ';\n\nThe construction used in lines 21\
    \ and 23 <?= $foo?> - and it is simpler than that: this reduction for <? $foo\
