- raw: "Perhaps, all these technical details and exercises from telnet-ohms seem to\
    \ you incredibly boring and even unnecessary (\"and at what here PHP?\"). And\
    \ in vain. These are the basics under the HTTP protocol which each Web programmer\
    \ needs to know by heart, and it is not theoretical knowledge - all this is useful\
    \ in practice. \n\nNow we will replace the first line of our form with following:\
    \ \n\n1.<form method= \"POST\" action= \"/cgi-bin/form\\_handler.cgi\">\n\nWe\
    \ specified a method of sending \"POST\". In this case data go to the server a\
    \ little in a different way: \n\ntelnet www.example.com 80\n\nPOST/cgi-bin/form\\\
    _handler.cgi HTTP/1.0\\\\r\\\\n\n\nHost: www.example.com\\\\r\\\\n\n\nContent-Type:\
    \ application/x-www-form-urlencoded\\\\r\\\\n\n\nContent-Length: 22\\\\r\\\\n\n\
    \n\\\\r\\\\n\n\nname=Bryan&okbutton=OK\n\nWhen using the POST method these forms\
    \ go after \"two Enter-ov\" - in a request body. Everything that above - actually\
    \ request heading (and when we used the GET method, these forms went in heading).\
    \ In order that the server knew on what byte to finish reading a body of a request,\
    \ at heading there is a line Content-Length; about the same that these forms will\
