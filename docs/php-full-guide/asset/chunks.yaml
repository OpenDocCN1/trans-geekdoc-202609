    \ 在大多数情况下对行的换行是不敏感的：之前所有的例子都可以写在一行。\n\n### Switch\n\n需要根据同一个变量或表达式的值来实现“分支”。可以写出像这样的：\n\
    \n```php\nif ($i == 1) {\n    //对应 $i == 1 的代码\n} else if ($i == 2) {\n    //对应\
