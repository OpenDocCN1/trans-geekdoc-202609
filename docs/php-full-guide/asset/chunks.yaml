- raw: "The special attention is deserved by the fourth line. In double quotes the\
    \ variables defined the last lines are specified. If to execute this program (you\
    \ already made it?), in a window of the browser the line Hi, Bryan will be displayed!.\
    \ Actually, the main feature of double quotes also consists in it: names of the\
    \ variables specified in couple of characters\" are replaced with the values corresponding\
    \ to these variables. \n\nIn addition, in double quotes the special managing combinations\
    \ consisting of two characters, first of which - the return slash will be recognized\
    \ (\\\\). The following control characters are most often used: \n\nЈ \\\\r -\
    \ carriage return (CR)\n\nЈ \\\\n - line feed (NL)\n\nЈ \\\\\" - a double quote\n\
    \nЈ \\\\$ - the character of dollar ($)\n\nЈ \\\\\\\\-actually, the return slash\
    \ (\\\\)\n\nCharacters \\\\r and \\\\are usually used by n together, in the form\
    \ of combination \\\\r\\\\n - line feed in Windows and many is so designated by\
    \ TCP/IP protocols. In Unix the new line is designated by one character \\\\n;\
    \ usually such way of line feed is used also in HTML documents (of course, it\
    \ influences only a HTML code, but not display in the browser (if only the text\
    \ is not put into couple of tags <pre>... </pre>): for the displayed line feed,\
    \ as we know, the tag <br> is used). \n\nThe remained three points from the provided\
    \ list of application of the return slash are examples of shielding - cancellings\
    \ of special action of the character. So, the double quote would designate a line\
    \ end, the dollar character - the beginning of a name of a variable, and the return\
    \ slash - the beginning of a managing combination (about which we here also speak;)).\
    \ When shielding, the character is perceived \"as it is\", and any special actions\
    \ is not made. \n\nShielding (not the return slash, but the principle;)) in PHP\
    \ it is used in many cases - so we will meet this approach still more than once.\n\
    \nIf in given to replace quotes on unary, in the browser what in them is written\
    \ ($greeting, $name is displayed!). The combinations of characters beginning with\
    \ \\\\in single quotes also will not be transformed in any way, behind two exceptions:\
    \ \\\\' - a single quote in a line; \\\\\\\\-the return slash (in quantity one\
    \ piece. \n\nLet's a little change our last example: \n\n1.<?\n\n2.$greeting =\
    \ 'Hi';\n\n3.$name = Bryan;\n\n4.$message = $greeting.','. $name.'!';\n\n5.$message\
    \ echo;\n\n6.?>\n\nThis time we did not begin to use \"complaisance\" of double\
    \ quotes: in line 4 names of variables and string constants are written through\
    \ the operator of concatenation (association of lines). In PHP concatenation is\
    \ designated by a point-. The result of accomplishment of this program is similar\
    \ to the previous example. \n\nI recommend to use this writing method - on that\
    \ is enough reasons: \n\nЈ Names of variables are more accurately visually separated\
    \ from line values that it is the best of all considerably in the editor with\
    \ code illumination;\n\nЈ the PHP Interpreter processes such record a little quicker;\n\
    \nЈ PHP will be able to trace more accurately a typo in a variable name;\n\nЈ\
    \ you do not make a mistake, similar following: $message = \"$greetingBryan\"\
    \ - PHP in this case will bring not \"HiBryan\", but blank line because $greetingBryan\
    \ will be recognized as a name variable, and we do not have that.\n\nHowever,\
    \ double quotes are very popular, and you for certain will meet them in a set\
    \ of the scripts available in network. \n\nBy the way, in the last two examples\
    \ there is no need for definition of a variable of $message at all: lines 4 and\
    \ 5 can be reduced to $greeting echo.','. $name.'!';. And if $message variable\
    \ can be necessary for us in the following code - it is possible to write $message\
    \ echo = to $greeting.','. $name.'!'; and it will work. It is connected with the\
    \ fact that result of the expression containing assign is the appropriated value.\
    \ It is especially convenient at assignment of the same value to several variables.\
    \ For example, if variable $a and $b need to appropriate the same value (we will\
    \ tell, number from a floating point 10.34), it is possible to write $a = to $b\
    \ = 10.34;.\n\nThe set of the embedded functions for work with lines is provided\
    \ in PHP. Them you can find the description in official documentation. \n\nIn\
    \ addition to lines and numbers, there is one more simple, but important data\
    \ type - Boolean (bool) to which two special values belong: true (truth) and false\
    \ (lie). At automatic reduction of types, false there corresponds to number 0\
    \ and blank line (''), true - to all the rest. Boolean values are often applied\
    \ together with conditional statements about which we farther also will talk.\
    \ \n\nConditional statements\n\nif\n\nOften (yes what here to say, practically\
    \ in any program) there is a need of accomplishment of a different code depending\
    \ on certain conditions. Let's review an example: \n\n1.<?\n\n2.$i = 10;\n\n3.$j\
    \ = 5 \\* 2;\n\n4.if ($i == $j)\n\n5.echo 'Variable $i and $j Have Identical Values';\n\
    \n6.else\n\n7.echo 'Variable $i and $j Have Different Values';\n\n8.?>\n\nHere\
    \ the if operator is used. else - conditional statement. In a general view it\
    \ looks so:\n\nif (condition)\n\nexpression\\_1;\n\nelse\n\nexpression\\_2; \n\
    \nIn this case, a condition is the result of comparison of variables values of\
    \ $i and $j. Comparison operator - == - two equality signs. As 5\\*2 equals 10,\
    \ and, respectively, 10 equals;), the line 5 will be executed, and we will see\
    \ that variables have equal values. Change, for example, a line 2 to $i = 11,\
    \ and you will see that the echo operator will be executed from a line 7 (as the\
    \ condition is false). In addition to ==, there are also other comparison operators:\
    \ \n\n! = - not equally;\n\n<-it is less;\n\n\\> - it is more;\n\n<= - it is less\
    \ or equally;\n\n\\> = - it is more or equally. \n\nExperiment, changing comparison\
    \ operator and variables values. (For logical correctness of output to the screen,\
    \ it will be required to change, of course, and the texts output by echo operators).\
    \ \n\nDo not confuse comparison operator == to assignment statement =! If you\
    \ make such mistake, the condition will always be correct if the value corresponding\
    \ to Boolean true, and always false is appropriated - if value corresponds to\
    \ false. (See above about boolean values and what they correspond to).\n\nIf the\
    \ else block is only required to perform operation if the condition is satisfied...\
    \ it is possible to lower: \n\n1.<?\n\n2.$i = 10;\n\n3.$j = 5 \\* 2;\n\n4.if ($i\
    \ == $j)\n\n5.echo 'Variable $i and $j Have Identical Values';\n\n6.?>\n\nIn this\
    \ case, if the condition is false, in the browser nothing will be displayed. \n\
    \nIndents before the lines echo... are made for convenience of reading, but PHP\
    \ they do not speak about anything. The following example works not as it is possible\
    \ to expect: \n\n1.<?\n\n2.$i = 10;\n\n3.$j = 11;\n\n4.if ($i> of $j)\n\n5.$diff\
    \ = $j - $i;\n\n6.echo' is more than $j, than $i; the difference between $j and\
    \ $i makes '. $diff;//INCORRECTLY!\n\n7.?>\n\nContrary to possible expectations,\
    \ the line 6 will be executed though the condition ($i> of $j) is false. The matter\
    \ is that to if (...) only the following expression - a line 5 belongs. The line\
    \ 6 is carried out anyway - action of if (.) does not extend to it any more. For\
    \ obtaining the necessary effect it is necessary to use a statement block which\
    \ is set by curly brackets: \n\n1.<?\n\n2.$i = 10;\n\n3.$j = 11;\n\n4.if ($i>\
    \ of $j) {\n\n5.$diff = $j - $i;\n\n6.echo' is more than $j, than $i; the difference\
    \ between $j and $i makes '. $diff;\n\n7.}\n\n8.?>\n\nNow everything works correctly.\
    \ \n\nCurly brackets can be used even if inside - only one operator. I recommend\
    \ to arrive quite so - less chances to be mistaken. It does not affect productivity\
    \ in any way, but increases readability. \n\nIt is often necessary to enter additional\
    \ conditions (if so... and if in a different way... otherwise) or even (if so.\
