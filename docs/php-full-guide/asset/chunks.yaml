    在 `configure` 阶段，你可能会看到与系统缺少必要库相关的错误。这些库需要根据发行包中 `INSTALL` 文件的说明进行下载和设置（通常 - 顺序是相同的：`/
    configure && make && make install`）。这项工作非常漫长且无味，因此长期以来，大多数 Unix 系统都包含了这种或那种更方便的软件安装工具。


    ### FreeBSD


    FreeBSD 包含了用于软件安装的特殊手段 - `ports`（`ports` 系统），它代表了一组脚本，这些脚本会自动下载、配置、编译和安装软件产品，包括启动所需的库（依赖项
    - `dependences`）。我在此不再详细阐述，因为在 FreeBSD 中操作 ports 的方法在《FreeBSD 手册》（FreeBSD Handbook）和系列书中都有描述。假设你的系统中
    ports 库已经安装并更新。


    我们进入 Apache port 目录：


    ```bash

    cd/usr/ports/www/apache13

    ```


    我们以 root 身份启动编译和 Apache 安装团队（发行包会自动下载）：


    ```bash

    su

    make install

    ```


    如果必要在系统加载时自动启动 Apache，我们需要在 `/etc/rc.conf` 中注册：


    ```ini

    apache_enable= "YES"

    ```


    实际上，就是这些；;)


    如果需要精细配置，请研究 `Makefile` 并在 `make install` 命令后添加必要的参数（例如，`make install WITH_APACHE_SUEXEC=yes`
    - 用于支持 `sexec`）。


    ### Red Hat Linux 和其他基于 RPM 的发行包（ASP, Mandrake...）


    Red Hat Linux 包含了 `RPM` 包管理器。RPM 的安装方法本质上是另一种方式 - `.rpm` 数据包包含了已经编译好的二进制文件。这节省了时间（不需要编译任何东西），但剥夺了按你意收集程序的机会。


    要从 rpm 安装 Apache，需要加载 Apache 1.3 的 `.rpm-file`（从哪里找 - 请搜索 Google：Apache Software
    Foundation (apache.org) 并不扩展 RPM）并启动：`rpm - Uvh apache`。


    ### Gentoo Linux


    Gentoo Linux 是 “BSD 风格的 Linux”，它本质上包含 `portages` - 一个与 FreeBSD 使用的类似的 ports 系统。通过
    `emerge` 命令进行安装，例如：


    ```bash

    cd/usr/portage/net-www/apache

    su

    emerge apache-1.3.31.ebuild

    ```


    不要只运行 `emerge apache` - 这将导致 Apache 2 的安装。


    为了在系统加载时自动启动 Apache，输入：


    ```bash

    rc-update add apache default

    ```


    ### 其他 Linux 发行包


    其他 Linux 发行包（Debian, Slackware...）包含自己的包管理器 - 请参考文档。无论（即使在其他 Unix OS 中），你都可以手动编译并设置
    Apache - 如上所述。


    # III. PHP 安装


    ### III-1 Windows 系列操作系统的安装


    从 `www.php.net/downloads.php` 页面下载 Windows Binaries ZIP 压缩包（PHP 4.x.x Zip 包）。


    不要使用 “PHP 4.x.x installer” - 那没有很多必要的文件！


    将压缩包解压到 `C:\PHP`（或任何地方 - 但后文假设你选择了 `C:\PHP`）。将 `php4ts.dll` 文件复制到 `C:\WINDOWS\SYSTEM32`（或相应的目录）。将
    `php.ini-dist` 文件复制到 `C:\WINDOWS` 并将其重命名为 `php.ini`。


    ### III-2 Unix 系列操作系统的 PHP 安装


    PHP 的安装过程与 Apache 的安装类似，不同之处在于编译 PHP 时你需要指定更多的配置选项。


    从源码手动编译 - 为此目的，首次启动需要通过 `www.php.net/downloads.php` 下载并解压源码。`/ configure` 也有助于研究编译的参数列表（非常令人印象）。


    无论如何，参数 `with-apxs=/put/k/apxs` 是必须的 - 它用于编译 Apache 的 `mod_php` 模块。例如，如果 Apache
    设置在 `/usr/local`，则参数看起来如下： - `with-apxs=/usr/local/sbin/apxs`。


    配置完成后，启动 `make` 和 `make install`。


    你使用的连接不同扩展的选项越多，越需要手动下载和设置必要的库。当然，最好使用你操作系统的包管理器或 ports。


    无论选择何种方式，成功安装后，将 `php.ini-dist` 复制为 `php.ini`：


    ```bash

    cd/usr/local/etc

    cp php.ini-dist php.ini

    ```


    （取决于操作系统，`/usr/local/etc` 可以替换为 `directory/etc` 等）。


    ### FreeBSD


    从 FreeBSD ports 设置 PHP 是很方便的。


    在使用 `su` 命令获取超级用户权限后，我们进入目录 `/usr/ports/lang/php4`。


    从 ports 编译 PHP 有两种方式 - 交互式和通过 make 参数参数。


    在第一种情况下，我们直接启动 `make install` 命令。make 将下载并解压 PHP 发行包，屏幕上会出现一个可能的配置选项列表的窗口 - 只需在需要的旁边打“叉”即可。


    交互式方法尽管方便，但有一个缺点 - 选择选择的参数无法保存以便反复用于相同的配置。可以在命令行中指定所有必要参数，例如 `make install WITH_MYSQL=YES
    WITH_GD=YES`。所有可能的选项在 `/usr/ports/lang/php4/scripts/php4_options` 中（更新：最近，PHP
    port 决定在所有情况下静态链接扩展时是不可能的）。或者，如果是动态扩展，在 `/usr/ports/lang/php4` 中 `make install`。对于
    php5 也是如此。然而，当使用 PHP 作为 Apache 模块时，动态扩展你不必为此担心。


    ### Red Hat Linux 和其他基于 RPM 的发行包（ASP, Mandrake...）


    如前所述，Red Hat 包包含了已经编译好的二进制文件，你应该在互联网上找到适合你的配置 rpm 并使用 rpm 命令进行设置。


    ### Gentoo Linux


    Gentoo portage 中的 PHP（Apache 模块）位于 `/usr/portage/dev-php/mod_php`。指示配置参数使用 `USE`
    变量（可能的 USE 值列表在 `gentoo.org/guid/use-index`）。可以编辑 `etc/make.conf`，但更方便的方法是：


    ```bash

    USE="gd mysql" emerge mod_php

    ```在这种情况下，`USE` 变量仅在 emerge 运行时建立 (“以确保任何库都不会拖入 XFree86”)）。安装后，`php.ini` 文件（确是软链接）位于
    `/etc/apache/conf`。


    # IV. Apache+PHP 配置


    如果尚未通过安装程序完成，请在 Apache 配置文件 `httpd.conf` 中添加以下行：


    Windows 系统：


    ```apache

    LoadModule php4_module C:/php/sapi/php4apache.dll

    ```


    Unix 系统：


    在最后一个 `LoadModule` 指令之后：


    ```apache

    LoadModule php4_module libexec/apache/libphp4.so

    ```


    所有系统：


    在最后一个 `AddModule` 指令之后：


    ```apache

    AddModule mod_php4.c

    ```


    在 `<IfModule mod_mime.c>` 块中：


    ```apache

    AddType application/x-httpd-php .php

    ```


    在 `DirectoryIndex` 行中指定 `index.php`：


    ```apache

    DirectoryIndex index.php index.html

    ```


    ### 扩展连接


    在 Windows 中，要连接扩展需要在 `php.ini` 中取消注释对应的 `extension=...` 行，同时不要忘记在 `extension_dir`
    行中注册它们的路径（通常它们在 php4 的 `c:\php\extensions` 和 php5 的 `c:\php\ext` 中）。


