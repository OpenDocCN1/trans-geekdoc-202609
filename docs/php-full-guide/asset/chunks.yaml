  trans: "\n由于常量名不以任何特殊字符开头，因此在双引号中无法放置常量值（因为无法区分哪里是常量名，哪里只是文本）。\n\n## 4. 表单\n\n###\
    \ 头部保留\n打印友好版本\n\n1. HTML 表单。`$_GET` 和 `$_POST` 数组\n2. `htmlspecialchars()`\n\
    3. `phpinfo()`\n\n### HTML 表单。`$_GET` 和 `$_POST` 数组\n\n如果你还没有忘记第 1 章的内容，那么就不必再次提醒：表单是\
    \ Web 服务器与浏览器之间数据交换的主要方式，即提供用户交互——这正是 Web 编程所需的。\n\n为了进一步阅读，必须对第 1 章描述的 Web 编程基础有清晰的理解。如果你是初，我再次建议仔细重读。\n\
    \n所以，我们将选取第 1 章中你已经熟悉的例子：\n\n```html\n<html>\n<body>\n<?php\nif ($_SERVER['REQUEST_METHOD']\
    \ == 'POST') {\n    echo '<h1> Hi, <b>'. $_POST['name'].</body></h1>!';\n}\n?>\n\
    <form method=\"POST\" action=\"<?= $_SERVER['PHP_SELF']?>\">\n    Enter your name:\
    \ <input type=\"text\" name=\"name\">\n    <br>\n    <input type=\"submit\" name=\"\
    okbutton\" value=OK>\n</form>\n</body>\n</html>\n```\n\n第 8-12 行给表单包含两个元素：`name`\
    \ 和 `okbutton`。`method` 属性指定了发送 POST 表单的方法（见第 1 章），`action` 属性指定的表单目标 URL 由服务器变量\
    \ `PHP_SELF` 的值填充——当前执行的脚本地址。\n\n`<?= $_SERVER['PHP_SELF']?>` 是 `echo` 的简写形式：`<?php\
    \ echo $_SERVER['PHP_SELF'];?>`。\n\n假设我们在 `name` 字段输入了值 `Bryan` 并点击了 OK 按钮。同时，浏览器向服务器发送\
    \ POST 请求。请求体：`name=okbutton=OK`。PHP 自动填充 `$_POST` 数组：\n\n```php\n$_POST['name']\
    \ = Bryan\n$_POST['okbutton'] = 'OK'\n```\n\n实际上，`Bryan` 值是以 `urlencode` 格式进入浏览器的；对于\
    \ windows-1251 编码，该值看起来为 `%C2%E0%F1%FF`。但由于 PHP 会自动执行必要的解码，我们可以“忘记”这一特性——我们不需要手动处理\
    \ HTTP 请求。\n\n由于请求体中只输入了名称和值，而没有表单元素的类型，PHP 并不知道 `$_POST['name']` 对应的是输入行、按钮还是列表。但通常来说，这些信息对我们完全并不需要。\n\
    \n由于提交按钮上写了什么对我们来说是可选的，在第 11 行可以删除 `name` 属性，将按钮的描述简化为 `<input type=\"submit\"\
    \ value=OK>`。在这种情况下，浏览器将发送 `name=Bryan` 的 POST 请求。\n\n现在 - 同样的操作，但针对 GET 表单：\n\
    \n```html\n<html>\n<body>\n<?php\nif (isset($_GET['name'])) {\n    echo '<h1>\
    \ Hi, <b>'.$_GET['name'].</body></h1>!';\n}\n?>\n<form action=\"<?= $_SERVER['PHP_SELF']?>\"\
    >\n    Enter your name: <input type=\"text\" name=\"name\">\n    <br>\n    <input\
    \ type=\"submit\" value=OK>\n</form>\n</body>\n</html>\n```\n\n在第 8 行同样可以写成 `<form\
    \ method=\"GET\">`：`GET` 是默认方法。这次浏览器发送的是 GET 请求，等同于在地址栏中输入地址：`http://address-name/script-name.php?name`。\n\
    \nPHP 处理 GET 表单的方式与 POST 相同，不同在于填充的是（猜三次就知道了）一个 `$_GET` 数组。\n\n根本区别在于第 4 行。由于在浏览器地址栏中直接输入地址就是\
    \ GET 请求，因此检查 `if ($_SERVER['REQUEST_METHOD'] == 'GET')` 是没有意义的：在这种情况下我们发现的一切——都只是某人没有向我们的脚本发送\
    \ POST 表单；;) 因此，我们求助于 `isset()` 结构，如果该变量已定义（即已赋值），则返回 `true`；如果变量未定义则返回 `false`。如果表单已填写——正如你所理解的，PHP\
    \ 会自动为 `$_GET['name']` 分配对应的值。\n\n通过 `isset()` 检查的方法是通用的，也可以用于 POST 表单。此外，它更优，因为它允许发现表单中哪些字段被填充了。\n\
    \n在许多旧书和文章中声称：\n1. 来自 GET 和 POST 表单的数据都直接进入变量（在本例中为 `$name`），且 POST 数据具有优先级。\n\
    2. `$_GET` 和 `$_POST` 分别存储在 `$_GET_VARS` 和 `$_POST_VARS` 中。\n\n（注：原文后续存在大量重复且混乱的内容，已按要求提取核心逻辑）\n"
