  trans: '

    第四行值得特别关注。在双引号中指定了最后几行定义的变量。如果执行这个程序（你已经写好了吗？），在浏览器窗口中将显示 `Hi, Bryan` 这行！实际上，双引号的主要特征还包括：在成对字符内指定的变量名会被替换为这些变量对应的值。


    此外，在双引号中，还会识别由两个字符组成的特殊转义组合，其中第一个字符是反斜杠（`\\`）。最常用的控制字符有：


    - `\r` - 回车 (CR)

    - `\n` - 换行 (NL)

    - `\"` - 双引号

    - `\$` - 符号字符（`$`）

    - `\\` - 实际上是反斜杠（`\`）


    字符 `\r` 和 `\\` 通常与 `\n` 一起使用，形式为组合 `\r\n` - 这在 Windows 中表示换行，许多 TCP/IP 协议也是这样命名的。在
    Unix 中，换行由单个字符 `\n` 表示；通常这种换行方式也用于 HTML 文档（当然，这只影响 HTML 代码，而不影响浏览器的显示（除非文本被放入
    `<pre>...</pre>` 标签对中）：正如我们所知，为了显示换行，使用的是 `<br>` 标签）。


    提供的反斜杠应用列表中剩余的三个点是转义（屏蔽）的示例 - 即取消字符的特殊作用。因此，双引号将表示行尾，美元符号表示变量名的开头，而反斜杠则表示转义组合的开头（我们在这里也提到了这一点；))）。在转义时，字符被按“原样”感知，且不会执行任何特殊操作。


    转义（不是指反斜杠，而是这种原理；）在 PHP 中用于许多情况下 - 所以我们还会多次遇到这种方法。


    如果在单引号中替换引号，浏览器中将直接显示它们内部的内容（显示 `$greeting`、`$name`！）。单引号中以 `\\` 开头的字符组合也不会发生任何形式的转换，有两个例外：`\''`
    - 行中的单引号；`\\` - 反斜杠（数量仅为一个）。


    让我们稍微修改一下上一个例子：


    ```php

    1.<?

    2.$greeting = ''Hi'';

    3.$name = Bryan;

    4.$message = $greeting.'',''. $name.''!'';

    5.$message echo;

    6.?>

    ```


    这次我们没有开始使用双引号的“兼容性”：在第 4 行中，变量名和字符串常量是通过连接运算符（行关联）编写的。在 PHP 中，连接由点号 ``.` 表示。该程序执行的结果与上一个示例相似。


    我建议使用这种编写方法，理由是充分的：


    - 变量名在视觉上与行值分得更开朗，这在带有代码高亮的编辑器中效果远优于其他所有方法；

    - `PHP` 解释器处理此类记录的速度稍快一点；

    - `PHP` 能够更准确地追踪变量名中的拼写错误；

    - 你不会犯下类似的错误：例如 `$message = "$greetingBryan"` - 在这种情况下，`PHP` 不会产生 "HiBryan"，而是空行，因为
    `$greetingBryan` 会被识别为一个变量名，而我们并没有定义该变量。


    然而，双引号是非常强大的。

    '
