    - `\\$` - the character of dollar (`$`)\n- `\\\\` -actually, the return slash\
    \ (`\\`)\n\nCharacters `\\r` and `\\\\` are usually used by `n` together, in the\
    \ form of combination `\\r\\n` - line feed in Windows and many is so designated\
