  trans: "\n现在我们来看 Apache 服务器。它本质上是模块化的，还允许通过在配置文件中添加一行来连接扩展功能（好吧，是两行）。如果有一种脚本语言，能够通过模块连接到\
    \ Apache 并运行在 Web 之上，那就太好了，不是吧？嗯，你已经明白我想表达什么了——那就是 PHP。原则上讲，PHP 可以被编译，也可以像 Perl\
    \ 一样使用——但通常适用于非标准的 Web 服务器或特殊的“癖好者”。\n\n## PHP：超文本预处理器\n\n11994 年，一位名叫 Rasmus\
    \ Lerdorf 的程序员在苦恼于经典的 CGI 模块后，决定编写几个自己的 Perl 脚本，用以更方便地创建自己的主页，并将这项活动命名为 Personal\
    \ Page（PHP）。过了一段时间，它需要处理表单，而且为了提高效率，所有内容都用 C 语言进行了重写——Personal Page 2.0 就此诞生了。Rasmus\
    \ 遵循开源原则的作品被公开供大家审阅。\n\n1997 年，两位程序员 —— Andi Gutmans 和 Zeev Suraski 发现了 PHP ——\
    \ 当时他们正在寻找一种方便的 Web 脚本工具。这个想法让他们很愉快，但 PHP 的功能和运行速度仍不尽人意。Andi 和 Zeev 决定从零开始重写 PHP。这种语言变得通用而强大，并很快吸引了大量\
    \ Web 开发者的关注：到 1998 年底，PHP3 已用于约 10% 的 Web 服务器。“Personal Page”这个朴素的名字已经不再符合现实，于是根据\
    \ Unix 的传统，名称被更改为 PHP: Hypertext Preprocessor（PHP：超文本预处理器）。\n\nPHP4 的“引擎” Zend\
    \ Engine 是通过共同努力开发的，从那以后 PHP 社区不断成长。在 2000 年，PHP 的一个版本在不到半年内就成为了 Unix（以及不仅是 Unix）Web\
    \ 开发的标准：每个尊重自律的主机都提供了对 PHP 的支持。现在，基于新 Zend Engine 的 PHP5 开发即将结束……\n\n不过，感性性的内容就到此为止。让我们来看一个简单的脚本。\n\
    \n## 2. 安装与 Apache+PHP 配置\n\n保留头部\n打印友好版本\n\n### Apache 安装\n\n1. **Apache 安装**\
    \ \n   - 1. 在 Windows 操作系统中\n   - 2. 在 Unix 类操作系统中\n2. **PHP 安装**\n   - 1. 在 Windows\
    \ 操作系统中\n   - 2. 在 Unix 类操作系统中\n3. **Apache+PHP 配置**\n   - 4. PHP5\n\n### 简单脚本\n\
    \n与 SI 或 Perl 不同，PHP 脚本代表的是普通的、通常是 HTML 的页面：“就像这样”写的标签会被“原样”传输，如果它是一个普通的 html\
    \ 别名。脚本由特殊标签 `<?php` 和 `?>` 组成，我们在其中使用 `echo` 运算符来输出文本。这种块可以根据需要任意存在，之间的所有内容都会被解释为普通的\
    \ html。\n\nGET 请求的变量进入数组 `$_GET`，POST 请求的变量进入数组 `$_POST`，服务器变量（如 IP 地址类型、脚本名称等）进入\
    \ `$_SERVER`，“点”运算符 `.` —— 用于字符串的字符串连接……而且所有的内部处理操作（读取标准输入和环境变量、URL 解码）已经由 PHP\
    \ 完成了。这很方便，不是吗？\n\n此外，为什么我们需要两个文件——一个带有表单的 HTML 和一个 PHP 脚本？一个脚本就足够了：\n\n```php\n\
    <html>\n<body>\n<?php\nif ($_SERVER['REQUEST_METHOD'] == 'POST') {\n    echo \"\
    <h1> Hi, \" . $_POST['name'] . \"</h1>!\";\n}\n?>\n<form method=\"POST\">\n  \
    \  Enter your name: <input type=\"text\" name=\"name\">\n    <br>\n    <input\
    \ type=\"submit\" name=\"okbutton\" value=\"OK\">\n</form>\n</body>\n</html>\n\
    ```\n\n我们从表单标签中删除了 `action` 属性——这意味着表单提交到“自身”，即发送到当前 URL。这有时被称为“回传表单”。在第 4 行，通过\
    \ `if` 运算符检查是否使用了 POST 方法加载文档（类似于 SI 示例中第 13 行的内容），如果是，则在下一行显示问候语。\n\n在这个简单的程序——即某种\
    \ Web 版本的“Hello World”上——我们也将完成输入章节。\n\n"
