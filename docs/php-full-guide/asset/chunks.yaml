    ;\nprint \" html\\n<head> <title> Hello World </title> </head> \\n\";\nprint \"\
    \ <body> <h1> of Hello World! </h1></body> \\n\";\nprint \" </</html>\";\n```\n\
    \nPHP script (yes, it is the program for PHP;)): \n\n```html\n<html>\n<head> <title>\
    \ of Hello World </title> </head>\n<body> <h1> of Hello World! </h1></body>\n\
    </html>\n```\n\nAs you can see, the elementary program for PHP is a normal HTML\
    \ page. About output of the heading `Content-type: text/html` `PHP` took care\
    \ independently too. \n\nDirectly a PHP code (which - not HTML is placed between\
    \ tags `<?` and `?>`. Everything that is located between these tags, is replaced\
    \ on displayed by a script in this block a HTML code (in that specific case -\
    \ if the script displays nothing - just \"disappears\")). \n\nIn general, universal\
    \ (that is - PHP which is guaranteed working at any configuration), but longer\
    \ way of the specification of a PHP code - tags `<? php...?>`. Such long form\
    \ of record is used at combination of XML and PHP as a tag `<?...?>` it is used\
    \ in the XML standard.\n\nFor recognition of a tag `<?` as the beginnings of the\
    \ PHP block the directive `short_open_tag` of the `php.ini` file (by default -\
    \ it is included) answers. If you want to develop the scripts working irrespective\
    \ of this configuration use long opening tag `<? php`. I will use the contracted\
    \ form.\n\nLet's review a simple example. \n\n1. `<html>`\n2. `<head> <title>\
    \ of Hello World </title> </head>`\n3. `<body> <h1> of Hello World! </h1>`\n4.\
    \ `<p> Current date: `\n5. `<?` \n6. `echo date (\"d.m.Y\");`\n7. `?>`\n8. `</body>`\n\
    9. `</html>`\n\nFor accomplishment of examples, copy them in the file located\
    \ in the directory, corresponding to the directive `DocumentRoot` of the configuration\
    \ file `Apache httpd.conf` (for example, in the file with the name `test.php`),\
    \ and execute them, having addressed the saved script (`test.php`) from an address\
    \ bar of the browser (`http://localhost/test.php`). And if you did not set Apache+PHP\
    \ yet (as so?;), address the previous chapter.\n\nIf today - the 27th of July,\
    \ 2016, as a result of execution of a script the browser receives the following\
    \ HTML code: \n\n```html\n<html>\n<head> <title> of Hello World </title> </head>\n\
    <body> <h1> of Hello World! </h1>\n<p> Current date:\n27.07.2016 </body>\n</html>\n\
    ```\n\nLines 5,6,7 - a PHP code insert. On lines 5 and 7 are located respectively\
    \ the opening and closing tag. Them it is absolutely optional to locate on separate\
    \ lines - it is made for reasons of convenience of reading. \n\nIn line 6 the\
    \ `echo` operator used for output in the browser is located. It displays a result\
    \ of execution of the function of `date()` - in this case it is current date.\
    \ \n\nThe line 6 is the finished expression. Each expression in PHP comes to an\
    \ end with a semicolon-`;`. A semicolon, but not line feed - do not forget about\
    \ it, especially if you programmed on Visual Basic or ASP earlier.\n\nThe attentive\
    \ reader will notice that the tag `</body>` is located on the same line, as the\
    \ text created by the `date()` function though he `</body>` is in the source code\
    \ on a separate line. The matter is that PHP discards the line feed following\
    \ right after closing tag `?>` - it is made specially that in HTML fragments where\
    \ excess spaces are undesirable, there was no need to endow readability of a script,\
    \ writing the closing PHP tag on one line with the subsequent HTML code. If the\
    \ space is necessary - insert later`?>` blank line.\n\n## Variables and data types\n\
    \nVariables in PHP begin with a sign of `$` which any set of Latin letters, digits\
    \ and a sign of underlining follows: `_`, at the same time the digit cannot follow\
    \ `$` sign at once.\n\nThe letter case in a name of a variable matters: `$A` and\
    \ `$a` are two different variables.\n\nFor assignment of a variable of value the\
    \ operator `=` is used. \n\nExample: \n\n1. `<?`\n2. `$a = 'test';`\n3. `$copyOf_a\
    \ = $a;`\n4. `$Number100 = 100;`\n5. `$a echo;`\n6. `$copyOf_a echo;`\n7. `$Number100\
    \ echo;`\n8. `?>`\n\nThis code will display: `testtest100`. \n\nYou monitor what\
    \ you name variables: it is unlikely you in half a year remember for what the\
    \ variable of `$a21` or `$zzz` is used. And here for what `$username` is used,\
    \ to understand quite easily.\n\nIn a line of 2nd variable of `$a` test value\
    \ is appropriated. Lines in PHP register in quotes - unary or double (we will\
    \ consider distinction between different quotes a bit later). The expression is\
    \ also fair that the variable `$a` is initialized by test value: in PHP the variable\
    \ is created at the first assignment of value; if value was not appropriated to\
    \ a variable - the variable is not defined, that is it does not exist. \n\nIn\
    \ line 3 the variable `$copyOf_a` is initialized by variable value of `$a`; in\
    \ this case (we watch a 2) this value - 'test'. In line with number 4 of a variable\
    \ with a name `$Number100` numerical value 100 is appropriated. \n\nAs you can\
    \ see, in PHP there is a typification, that is language distinguishes data types\
    \ - lines, numbers, etc. However, at this PHP is language with weak typification\
    \ - conversions between data types happen automatically by the set rules. For\
    \ example, program `<? echo '100' + 1;?>` will display number 101: the line will\
    \ automatically be transformed to number when using in a numerical context (in\
    \ this case - the line '100', when using as composed, will be transformed to number\
    \ 100 as addition operation for lines is not defined). \n\nSuch behavior (and\
    \ also lack of need (and even opportunities) is explicit to define variables)\
    \ makes related PHP with Perl and Basic, however, it is possible, will be given\
    \ a hostile reception by adherents of strict languages, such as the SI and Pascal.\
    \ Of course, need of accurate definition of variables and the requirement of explicit\
    \ reduction of types reduces number of possible errors of programming, however,\
    \ of PHP, first of all, an interpreted language for rapid development of scripts,\
    \ and not severity of syntax is with interest compensated by coding speed. And\
    \ will always obligingly report about unassigned variable of PHP - if, of course,\
    \ not to prohibit it to... However, I run forward.\n\nLet's review one more example:\
    \ \n\n1. `<?`\n2. `$greeting = 'Hi';`\n3. `$name = Bryan;`\n4. `$message = \"\
    $greeting, $name!\";`\n5. `$message echo;`\n6. `?>`\n"
  trans: "\n\n在 Unix 中（除非你没有指定参数的共享属性 - 这在汇编时是...），扩展是通过 PHP 的重新组装连接的。\n\n## php.ini\
    \ 设置\n\n如果你不是偶然来到这篇文章的（通过 Google 搜索，并认为对于下载的论坛或聊天，Web 服务器是必要的），并且正准备学习 PHP - 请按照如下方式设置指定变量的值。此外，请不要争论。至于为什么以及如何\
    \ - 我稍后会解释。\n\n`register_globals = off`\n\n`magic_quotes_gpc = off`\n\n`magic_quotes_runtime\
    \ = off`\n\n`error_reporting = E_ALL` - 并且完全如此，任何 `E_ALL & ~ E_NOTICE` 等均可！\n\n\
    `display_errors = on` \n\n## Apache 启动\n\n现在一切都准备好启动 Apache 了。在 Windows 中：\n\n\
    `net start apache`\n\n在 Unix 中：\n\n```\napachectl start\n```\n\n## V. PHP5 安装\n\
    \nApache+PHP5 的建立方法与 Apache+PHP4 相同 - 只需将本指令中所有的 PHP4 替换为 PHP5（包括文件名和配置指令中的名称）。\n\
    \n特别对于 Windows/Apache/PHP5，必须在 `httpd.conf` 中注册：\n\n```\nLoadModule php5_module\
    \ C:/php5/php5apache.dll\nAddModule mod_php5.c\nAddType application/x-httpd-php\
    \ .php \n```\n\nPHP 自助手册：第 3 章 PHP 语法基础\n\n## 头部目录\n\n打印友好版本\n\n1. PHP 程序的结构\n\
    2. 变量与数据类型\n3. 条件语句\n    1. `if`\n    2. `switch`\n4. 循环\n    1. `while`\n   \
    \ 2. `do... while`\n    3. `for`\n5. 数组\n    1. `Foreach` 循环\n    2. list 和 each\
    \ 构造结构\n6. 常量\n\n## PHP 程序的结构\n\n与传统的脚本语言（如 Perl）不同，PHP 程序通过代码插入表示 HTML 页面。对比一下：\n\
    \nPerl 脚本：\n\n```perl\n#!/usr/local/bin/perl\nprint \"Content-type: text/html\\\
    n\\n\";\nprint \" html\\n<head> <title> Hello World </title> </head> \\n\";\n\
    print \" <body> <h1> of Hello World! </h1></body> \\n\";\nprint \" </</html>\"\
    ;\n```\n\nPHP 脚本（是的，这是 PHP 的程序；)):\n\n```html\n<html>\n<head> <title> of Hello\
    \ World </title> </head>\n<body> <h1> of Hello World! </h1></body>\n</html>\n\
    ```\n\n```\n\n如你所见，PHP 的基础程序就是一个普通的 HTML 页面。关于头部 `Content-type: text/html` 的输出，PHP\
    \ 也独立地处理了。\n\n直接将 PHP 代码（即 - 不是 HTML）放置在标签 `<?` 和 `?>` 之间。位于这些标签之间的所有内容在显示时会被此块中的脚本替换为\
    \ HTML 代码（在特定情况下 - 如果脚本没有显示内容 - 则直接“消失”）。\n\n通常，一种通用的（即保证在任何配置下都能工作的 PHP）但更长的\
    \ PHP 代码指定方式是标签 `<? php...?>`。这种较长的记录形式用于 XML 和 PHP 的组合，因为 `<?...?>` 标签被用于 XML\
    \ 标准中。\n\n为了将 `<?` 标签识别为 PHP 块的开头，由 `php.ini` 文件中的 `short_open_tag` 指令决定（默认开启）。如果你想开发不受此配置影响的运行脚本，请使用长开启标签\
    \ `<? php`。我将使用缩写形式。\n\n让我们来看一个简单的示例。\n\n1. `<html>`\n2. `<head> <title> of Hello\
    \ World </title> </head>`\n3. `<body> <h1> of Hello World! </h1>`\n4. `<p> Current\
    \ date: `\n5. `<?` \n6. `echo date (\"d.m.Y\");`\n7. `?>`\n8. `</body>`\n9. `</html>`\n\
    \n为了完成示例，请将它们复制到位于配置文件 `Apache httpd.conf` 中 `DocumentRoot` 指令对应的目录文件中（例如，在名为\
    \ `test.php` 的文件中），并在浏览器地址栏（`http://localhost/test.php`）访问保存的脚本 (`test.php`）。如果你还没有设置\
    \ Apache+PHP（如果是这样的话），请参上一章。\n\n如果今天是 2016 年 7 月 27 日，执行脚本后浏览器将接收到以下 HTML 代码：\n\
    \n```html\n<html>\n<head> <title> of Hello World </title> </head>\n<body> <h1>\
    \ of Hello World! </h1>\n<p> Current date:\n27.07.2016 </body>\n</html>\n```\n\
    \n第 5、6、7 行是 PHP 代码插入。第 5 行和第 7 行分别是开启标签和结束标签。将它们放置在单独行上是完全可选的 - 这样做是为了阅读方便。\n\
    \n在第 6 行使用了用于在浏览器中输出的 `echo` 操作符。它显示了 `date()` 函数的执行结果 - 在这种情况下是当前日期。\n\n第 6 行是完成的表达式。PHP\
    \ 中的每个表达式都以分号 `;` 结束。是分号，而不是换行符 - 不要忘记这一点，特别是如果你之前编写过 Visual Basic 或 ASP 的话。\n\
    \n留心的读者会注意到 `</body>` 标签与 `date()` 函数生成的文本位于同一行，尽管 `</body>` 在源代码中是单独占一行的。这是因为\
    \ PHP 会丢弃紧跟结束标签 `?>` 之后的换行符 - 这样做的特殊目的是在不希望出现额外空格的 HTML 片段中，不需要通过将关闭 PHP 标签与后续\
    \ HTML 代码写在同一来赋予脚本可读性。如果需要空格 - 请在 `?>` 之后插入空行。\n\n## 变量与数据类型\n\nPHP 中的变量以 `$`\
    \ 符号开头，后跟任意一组拉丁字母、数字和下划线符号 `_`；同时数字不能直接跟在 `$` 符号之后。\n\n变量名的大小写非常敏感：`$A` 和 `$a`\
    \ 是两个不同的变量。\n\n为变量赋值时使用 `=` 操作符。\n\n示例：\n\n1. `<?`\n2. `$a = 'test';`\n3. `$copyOf_a\
    \ = $a;`\n4. `$Number100 = 100;`\n5. `$a echo;`\n6. `$copyOf_a echo;`\n7. `$Number100\
    \ echo;`\n8. `?>`\n\n这段代码将显示：`test100`。\n\n你监控变量名：可能使用 `$a21` 或 `$zzz`。这里使用了 `$username`，理解起来非常容易。\n\
    \n在第 2 行，变量 `$a` 被赋值为值：在 PHP 中，变量在第一次赋值时被创建；如果未给变量赋值 - 则变量不存在。\n\n在第 3 行，变量 `$copyOf_a`\
    \ 被赋值为变量 `$a` 的值；在这种情况下（我们看 2）值为 'test'。在第 4 行，名为 `$Number100` 的变量被赋值为数值 100。\n\
    \n如你所见，PHP 存在类型，即语言区分数据类型 - 字符串、数字等。然而，这里的 PHP 是一种弱类型语言 - 数据类型之间的转换会自动发生。例如，程序\
    \ `<? echo '100' + 1;?>` 将显示数字 101：在数值上下文中，字符串会自动转换为数字（在这种情况下 - 字符串 '100' 在用于组合时将转换为数字，因为字符串没有定义加法）。\n\
    \n这种行为（以及不需要显式定义变量甚至没有可能）使得 PHP 与 Perl 和 Basic 相似，但它可能会受到严格语言（如 SI 和 Pascal）追随者的敌视。当然，准确定义变量和要求显式类型转换可以减少编程错误的可能性，但对于首先是用于快速开发脚本的解释型语言\
    \ PHP 来说，语法的严格性在编码速度上得到了很好的补偿。而且它总是乐意地报告未定义的 PHP 变量 - 如果当然没有禁止的话……然而，我继续前进。\n\n\
    让我们再看又一个示例：\n\n1. `<?`\n2. `$greeting = 'Hi';`\n3. `$name = Bryan;`\n4. `$message\
    \ = \"$greeting, $name!\";`\n5. `$message echo;`\n6. `?>`\n\n"
