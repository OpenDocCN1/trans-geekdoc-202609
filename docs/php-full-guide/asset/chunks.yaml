    # 目录


    - 第一部分：什么是 Web 编程。主要技术

    - 第二部分：PHP：超文本预处理器

    - 第三部分：PHP 安装

    - 第四部分：Apache+PHP 配置

    - 第五部分：PHP5 安装


    欢迎来到 Web 编程的世界！在课程中，我将尝试教你，而你反过来也将尝试学习创建各种 Web 应用程序，从基础示例到功能完整的产品。


    我在此要指出，我在编写这些内容时，假设你已经掌握了 HTML 标记语言的基础，并且至少有简短的编程经验。否则……嗯，你懂的。


    但是在开始学习 PHP 语言之前，让我们先理解什么是 Web 编程。


    ## I. 什么是 Web 编程。主要技术


    ### I-1. 客户端-服务器


    如果你已经尝试过（并且可以，即使不成功）进行编程，例如使用 Delphi、Visual Basic 甚至是 Visual C++，那么你已经习惯了这种程序运行的方案：点击按钮
    - 执行代码 - 显示结果，而这一切都在同一台计算机上完成。


    在 Web 编程中，一切都不同。


    你是否想过当你在浏览器地址栏输入 URL（统一资源定位符，或者通俗地说——地址）时会发生什么？工作原理如下：


    1. 浏览器与服务器建立连接

    2. 浏览器向服务器发送请求以获取页面

    3. 服务器为浏览器创建响应（通常是 - HTML 代码）并关闭连接

    4. 浏览器处理 HTML 代码并显示页面


    请注意**加粗**的部分。在你在屏幕上看到请求的页面之前，与服务器的连接已经关闭，它已经忘记了你。当你输入另一个（或同一个）地址，或者点击链接，或者按下 HTML
    表单的按钮时——同样的方案将再次重复。


    这种工作方案被称为“客户端-服务器”。在这种情况下客户端是浏览器。


    因此，与 Web 服务器的连接只持续几秒钟（或几秒钟的一部分），这是从点击链接（或通过其他方式请求）到开始显示页面之间的时间。在连接期间，大多数浏览器会显示某个指示器，例如，MS
    Internet Explorer 在右上角会显示动画。


    细心的读者会在这里注意到 - 既然我我已经读完了页面，指示器仍然显示连接过程呢？这是因为像 `<img src=...>` 标签（加载图像）以及其他一些标签仅仅是另一个服务器请求
    - 并且它的执行方式与其他任何请求一样 - 遵循同样的方案。而且从服务器的角度来看，图片请求完全独立于 HTML 别名请求。


    为了永远摆脱对 HTTP 作为“黑盒”的认知，我们将通过 telnet “伪装”浏览器：


    1. 启动 `telnet www.php5.com 80`

    2. 在终端窗口中输入以下内容（如果没有显示 - 也不糟糕）：


    ```

    GET/HTTP/1.0 [我们在此按回车]

    Host: www.php5.com [我们在这里按两次回车]

    ```


    点击回车通常对应于 CR + LF 字符组合，标记为 `\r\n`。该标记将在后续使用。


    屏幕上将运行 `http://www.php5.com/` 页面的 HTML 代码。如你所示 - 并没有什么困难。


    当前页面的源代码几乎可以在任何浏览器中查看，只需在“查看|源代码”菜单中选择即可。


    图片、框架 - 所有这些额外的请求都是一样的。实际上，浏览器窗口中的图片是从哪里来的：在解析（处理）HTML 代码时，浏览器遇到 `<img src="picture">`
    标签会发送额外的服务器请求 - 图片请求，并将其显示在有 `<img...>` 标签的网站上。图片请求从服务器看来与 HTML 别名请求是完全独立的。


    ```

    telnet www.php5.com 80

    GET /HTTP/1.0

    Host: www.php5.com

    ```


    屏幕上将运行 `http://www.php5.com/` 页面的 HTML 代码。如你所示 - 并没有什么困难。


    当前页面的源代码几乎可以在任何浏览器中查看，只需在“查看|源代码”菜单中选择即可。


    ### I-2. HTML 表单。发送数据的方法


    在示例中：


    1. `<form method="GET" action="/cgi-bin/handler.php">`

    2. `<input type="text" name="name">`

    3. `<input type="submit" value="OK">`

    4. `</form>`


    这是发送数据的常用 HTML 表单。


    让我们详细考虑这些表单。在表单中，以下属性是可选的：


    - `action`：指定表单提交的 URL（绝对路径或相对路径）。

    - `method`：指定发送表单的方法。在示例中，我们使用的是 "GET"。


    如果不指定 `method`，大多数浏览器将默认使用 "GET"。当使用 `GET` 方法时，表单的数据附加在 URL 后面。你可以在浏览器地址栏中看到它：`http://example.com/cgi-bin/handler.php?name=Bryan&okbutton=OK`。这就是
    `GET` 方法的工作方式。


    实际上，发送表单有两种主要方法：


    - `GET`：表单数据附加在 URL 后面传输。

    - `POST`：表单数据在请求体中传输。


    如果没有指定 `method` 属性——默认是 "GET"。


    `<input>` 标签通过 `type` 属性设置表单元素：


    - `text`：设置一个单行文本框。

    - `submit`：设置一个点击即可提交的按钮。


    其他值也是可能的（且 `<input>` 不是设置表单元素的唯一标签），但我们将在后续章节中考虑它们。


    那么，当我们点击 OK 时会发生什么？


    1. 浏览器读取表单元素，并根据它们的 `name` 和 `value` 属性创建表单数据。假设输入的名字是 Bryan。在这种情况下，这些表单数据为 `name=Bryan&okbutton=OK`。

    2. 浏览器与服务器建立连接，向服务器发送 `action` 属性指定的文档请求，使用 `method` 属性指定的发送方法（在本例中为 "GET"），在请求中传输这些表单。

    3. 服务器分析收到的请求，创建响应，发送给浏览器并关闭连接。

    4. 浏览器显示从服务器接收的文档。


    手动（通过 telnet 工具）发送相同的请求如下（假设网站域名为 www.example.com）：


    ```

    telnet www.example.com 80

    GET /cgi-bin/handler.php?name=Bryan&okbutton=OK HTTP/1.0\r\n

    Host: www.example.com\r\n

    \r\n

    ```


    正如你可能猜到的那样，点击带有 "GET" 方法的提交按钮，与在浏览器地址栏中输入相应的 URL（带有签名问号和表单数据）是类似的：`http://www.example.com/cgi-bin/handler.php?name=Bryan&okbutton=OK`。


    实际上，当你从从服务器请求任何文档时，总是使用 `GET` 方法，无论你是刚刚输入了它的 URL 还是点击了链接。使用 `<form method="GET"...>`
    时，问号和这些表单数据只是被添加到 URL 之后。


    如果 `method` 属性没有指定——它意为为 "GET"。


    - `POST`：表单数据在请求体中传输。


    '
