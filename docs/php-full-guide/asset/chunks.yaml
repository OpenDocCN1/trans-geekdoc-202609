  trans: "\n# 数组\n\n数组代表由一个名称组合的变量集合。数组的每个值都通过索引标识，索引指定在变量数组名后的方括号 `[]` 中。索引与其对应值的组合被称为数组单元。\n\
    \n```php\n<?\n$i = 1024;\n$a[1] = 'abc';\n$a[2] = 100;\n$a['test'] = $i - $a[2];\n\
    \necho of $a[1]. \"br\\n\";\necho of $a[2]. \"br\\n\";\necho of $a['test']. \"\
    br\\n\";\n?>\n```\n\n在给出的示例中，索引为 `1` 的 `$a` 数组单元出现在第三行；值 `abc` 被分配给数组单元。同一行也出现了\
    \ `$a` 数组，因为这是在数组上下文中第一次提到变量 `$a`，数组会被自动创建。在第四行中，数值 `100` 被分配给索引为 `2` 的数组单元。在第五行中，等于\
    \ `$i` 和 `$a[2]` 差值被赋值给索引为 `test` 的 `$a` 数组单元。\n\n如你所见，数组的索引可以是数字也可以是字符串。\n\n\
    在其他编程语言（例如 Perl）中，具有字符串索引的数组被称为哈希（`hash`），是独立的数据类型。在 PHP 中，实际上所有数组都是哈希，但字符串和数字都可以作为索引。\n\
    \n在上一个示例中，数组是在描述第一个数组单元时自动创建的。但也可以显式地设置数组：\n\n```php\n<?\n$i = 1024;\n$a = array\
    \ (1=>'abc', 2=> 100, 'test '=> of $i-100);\nprint_r ($a);\n?>\n```\n\n最后一个示例创建的数组\
    \ `$a` 与上一个示例中的数组完全相同。这里的每个数组单元按 `索引 => 值` 的形式设置。在创建测试元素时，有必要直接指定值 `100`，因为这次我们是“一次性”创建数组，而\
    \ PHP 在创建阶段并不知道其元素的值。\n\n在第四行中，为了输出数组的值，我们使用了 `print_r()` 函数，它非常方便将数组内容输出到屏幕上——首先是为了调试。\n\
    \n`print_r` 函数的输出行由普通的换行符 `\\n` 分隔，而不是标签 `<br>`。为了方便阅读，可以将 `print_r` (`.`) 输出包裹在\
    \ `<pre>...</pre>` 标签输出运算符中：\n\n```php\necho of '<pre>';\nprint_r ($a);\necho'\
    \ </pre>'; \n```\n\n如果显然没有指定索引，那么 PHP 数组将表现出类似于其他语言中数值数组的特征：下一个元素将具有连续的数字索引。计数从零开始。示例如下：\n\
    \n```php\n<?\n$operating_systems = array ('Windows', 'Linux', 'FreeBSD', 'OS/2');\n\
    $operating_systems[] = 'MS-DOS';\n\necho of \"<pre>\";\nprint_r ($operating_systems);\n\
    echo\" </pre>\";\n?>\n```\n\n输出：\n```\nArray\n(\n    [0] => Windows\n    [1] =>\
    \ Linux\n    [2] => FreeBSD\n    [3] => OS/2\n    [4] => MS-DOS\n)\n```\n\n在这里我们显然没有指定索引：PHP\
    \ 自动从零开始分配了数字索引。当使用此类记录形式时，可以通过 `for` 循环访问数组。数组单元的数量通过 `count` 运算符（或其同义词 `size\
    \ of`）返回：\n\n```php\n<?\n$operating_systems = array ('Windows', 'Linux', 'FreeBSD',\
    \ 'OS/2');\n$operating_systems[] = 'MS-DOS';\n\necho of '<table border=1>';\n\
    for ($i=0; $i <count ($operating_systems); $i ++) {\necho' <tr> <td>'. $i.' </td>\
    \ <td>'.$operating_systems[$i].' </td> </tr>';\n}\necho' </table>';\n?>\n```\n\
    \n记录的形式可以混合。请注意在手动安装某些索引后，PHP 自动分配了哪些索引。\n\n```php\n<?\n$languages = array (\n\
    1 => 'Assembler',\n'C ++',\n'Pascal',\n'scripting' => 'bash'\n);\n$languages['PHP']\
    \ = 'PHP';\n$languages[100] = 'Java';\n$languages[] = 'Perl';\n\necho of \"<pre>\"\
    ;\nprint_r ($languages);\necho\" </pre>\";\n?>\n```\n\n输出：\n```\nArray\n(\n  \
    \  [1] => Assembler\n    [2] => C ++\n    [3] => Pascal\n    [scripting] => bash\n\
    \    [PHP] => PHP\n    [100] => Java\n    [0] => Perl\n)\n```\n\n如你所见，数组的索引可以是数字也可以是字符串。（等等，上面的输出显示\
    \ Perl 的索引是 `[0]`）。\n\n（注：原文包含大量重复章节，此处已按照逻辑流进行处理。）\n"
