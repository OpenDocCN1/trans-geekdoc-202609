  trans: "\n\n也许，这些来自 `telnet-ohms` 的技术细节和练习对你来说极其无聊，甚至没有必要（“这里 PHP 在哪呢？”）。但并非徒劳。这些是\
    \ `HTTP` 协议下的基础知识，每个 Web 程序员都需要烂记于心，而且这并不是理论知识——这一切在实践中都是实用的。\n\n现在我们将把表单的第一行替换为以下内容：\n\
    \n1.<form method= \"POST\" action= \"/cgi-bin/form\\_handler.cgi\">`\n\n我们指定了发送方法为\
    \ `\"POST\"`。在这种情况下，数据传输到服务器的方式略有不同：\n\n```\ntelnet www.example.com 80\nPOST/cgi-bin/form_handler.cgi\
    \ HTTP/1.0\\r\\n\nHost: www.example.com\\r\\n\nContent-Type: application/x-www-form-urlencoded\\\
    r\\n\nContent-Length: 22\\r\\n\n\\r\\n\nname=Bryan&okbutton=OK\n```\n\n使用 `POST`\
    \ 方法时，这些表单会位于“两个回车符”之后——即在请求体中。以上所有内容实际上都是请求头（而当我们使用 `GET` 方法时，这些表单是在请求头中的）。为了让服务器知道在哪个字节结束读取请求体，请求头中有一行\
    \ `Content-Length`；这些表单将传输的内容类似于 `параметр1=значение1&параметр2=значение2...`，且值是以\
    \ `urlencode` 类型传输的——即与通过 `GET` 方法的方式相同，但在请求体中——向服务器报告请求头 \"Content-Type: application/x-www-form-urlencoded\"\
    。\n\n这种 `urlencode` —— 限制略小。\n\n`POST` 方法的优点是——对表单数据行的长度没有限制。使用 `POST` 方法时，无法像使用\
    \ `GET` 方法那样简单地通过“访问链接”来发送表单。\n\n为了表述简洁，我们将引入术语 `\"GET form\"` 和 `\"POST form\"\
    `，其中前缀对应 `<form>` 标签 `method` 属性的值。\n\n当使用 `POST form` 时，可以在其 `action` 属性的问号后面指定\
    \ `GET form` 参数。因此，`POST` 方法也包含了 `GET` 方法。\n\n## I-3. CGI 技术\n\n我们通过上一章理解了如何创建\
    \ HTML 表单，以及浏览器如何将其中输入的数据发送到服务器。但目前还不清楚服务器将如何处理这些数据。\n\nWeb 服务器本身仅能够提供请求的页面，仅此而已，而所有传输的这些表单对它来说是是无关。为了能够用任何程序处理这些数据并动态地为浏览器创建响应，发明了\
    \ `CGI` 技术（通用网关接口）。\n\n让我们来看这个 URL：`http://www.example.com/cgi-bin/form\\_handler.cgi`。关于它可以提出的第一个假设是它是正常的：服务器提供了来自\
    \ `cgi-bin` 目录的 `form_handler.cgi` 文件内容。然而，在 `CGI` 技术的情况下，情况是不同的。服务器启动 `form_handler.cgi`\
    \ 程序并将这些表单传输给它。程序创建文本并作为请求的响应传输给浏览器。\n\n`form_handler.cgi` 程序可以用任何编程语言编写，最重要的是在程序中遵守\
    \ `CGI` 标准。例如，可以使用流行的脚本语言 `Perl`。也可以用 `SI` 编写一切。或者用 Shell 脚本……但作为示例，我们将用 `SI`\
    \ 编写这个程序。但在最初，我们将理解 Web 服务器与 `CGI` 程序之间存在的数据交换。\n\n在 `CGI` 程序启动之前，服务器会设置环境变量（这些在执行\
    \ `PATH` 命令时你很熟悉）。在任何稍微正式一点编程语言中，都有读取环境变量的手段。`CGI` 标准定义了一组非常大量的变量，这些变量在 `CGI`\
    \ 程序启动之前应该被定义。现在我们只考虑其中三个：\n\n- `REQUEST_METHOD` - 数据传输方法——`GET` 或 `POST`（还有其他其他的，但目前我们不考虑它们）\n\
    - `QUERY_STRING` - 支持 URL 中问号后面的部分，换句话说，这些是 `GET forms`。\n- `CONTENT_LENGTH` -\
    \ 请求体长度（这些 `POST forms`）。\n\n当服务器启动 `CGI` 程序时，请求体以标准输入 (`stdin`）的形式传输给程序——就像这些数据是从键盘输入的一样。\n\
    \n当程序将浏览器的响应输出到标准输出 (`stdout`）——“在屏幕上”。这个输出被 Web 服务器截获并传输到浏览器。\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    //我们读取 Web 服务器设置的环境变量\n\
    \    char * query_string = getenv (\"QUERY_STRING\");\n    char * request_method\
    \ = getenv (\"REQUEST_METHOD\");\n\n    char * post_data;//存储 POST 请求数据的缓冲区\n\
    \    int post_length = 0;//请求体长度\n\n    if (strcmp (request_method, \"POST\")\
    \ == 0) {//如果接收到 POST 请求，\n        post_length = atoi (getenv (\"CONTENT_LENGTH\"\
    ));//首先我们从\n        //环境变量中读取它的长度，\n        if (post_length){//如果它不为零，\n     \
    \       post_data = (char *) malloc(post_length+1);//我们为缓冲区选择内存，\n           \
    \ fread (post_data, post_length, 1, stdin);//我们从标准输入读取请求体，\n            post_data[post_length]\
    \ = 0;//我们用零字节完成这一行。\n        }\n    }\n\n    //我们显示响应头...\n    printf (\"Content-type:\
    \ text/html\\r\\n\\r\\n\");\n\n    //并它的正文：\n    printf (\"<h1>Hello!</h1>\\r\\\
    n\");\n\n    if (strlen(query_string)) {\n        printf (\"<p>GET form Parameters:\
    \ %s</r\\n\", query_string);\n    }\n\n    if (post_length) {\n        printf\
    \ (\"<p>POST form Parameters: %s (request body length: %d)</r\\n\", post_data,\
    \ post_length);\n        free(post_data);//不要忘记释放 17 行选择的内存\n    }\n\n    return\
    \ 0;\n}\n```\n\n这是一个用 `SI` 编写的基础 CGI 程序，显示从 Web 服务器接收的表单内容。浏览器作为结果将收到类似的代码（如果是上一个例子中的\
    \ `POST form`）：\n\n```html\n<h1>Hello!</h1>\n<p>POST form Parameters: name=Bryan&okbutton=OK\
    \ (request body length: 22)</p>\n```\n\n至于同时在用户屏幕上显示什么，我想显然不需要评论的。\n\n"
