  fmt: "\nThe matter is that if these `POST` variables are not defined - and will\
    \ be if the form was not filled yet, - `PHP` will give warnings of use of unassigned\
    \ variables (and, it is quite reasonable: such message allows to find quickly\
    \ hardly detectable typos in names of variables, and also warns about possible\
    \ \"holes\" on the website). It is possible to place, of course, a code with `isset...`\
    \ directly in a form, but it will turn out it is too bulky.\n\nUnderstood? And\
    \ now try to find an error in the given code. Well, not absolutely an error, -\
    \ but a defect.\n\n### `htmlspecialchars()`\n\nDid not find? I will prompt. Enter,\
    \ for example, in the field \"name\" a double quote and some text, for example,\
    \ \"123\". Send a form, and look at the source code of the received page. In the\
    \ fourth line there will be something like:\n\n`Enter your name: <input type=\
    \ \"text\" of name= \"name\" value= \"\" 123\">`\n\nThat is - anything good. And\
    \ if the cunning user entered a JavaScript-code?\n\nFor a solution of this problem\
    \ it is necessary to use the `htmlspecialchars()` function which will replace\
    \ sample digits with their HTML representation (for example, a quote - on `&quot;`):\n\
    \n```php\n<html>\n<body>\n<?php\n$name = isset ($_POST['name'])? htmlspecialchars($_POST['name']):'\
    \ ';\n$year = isset ($_POST['year'])? htmlspecialchars($_POST['year']):' ';\n\n\
    if (isset($_POST['name'], $_POST['year'])) {\n    if ($_POST['name'] ==' ') {\n\
    \        echo 'Enter a name! <br>';\n    } else if ($_POST['year'] <1900 || $_POST['year']>\
    \ 2016) {\n        echo 'Specify by echo year of birth! Tolerance range of values:\
    \ 1900. 2016 <br>';\n    } else {\n        echo 'Hello, '. $name.'! <br>';\n \
    \       $age = 2016 - $_POST['year'];\n        echo 'to you '. $age.' years <br>';\n\
    \    }\n    echo' <hr>';\n}\n?>\n<form method=\"post\" action=\"<?= <?= $_SERVER['PHP_SELF']?>\"\
    >\nEnter your name: <input type=\"text\" name=\"name\" value=\"<?= $name?>\">\n\
    <br>\nEnter your year of birth: <input type=\"text\" name=\"year\" value=\"<?=\
    \ $year?>\">\n<input type=\"submit\" of value= OK>\n</form>\n</body>\n</html>\n\
    ```\n\nRepeat experiment and be convinced that now the HTML code is correct.\n\
    \nRemember - the `htmlspecialchars()` function needs to be used always when contents\
    \ of a variable at which there can be HTML special characters are displayed.\n\
    \n### `phpinfo()`\n\nThe `phpinfo()` function - one of the most important in `PHP`.\
    \ It outputs information on the `PHP` settings, values of various configuration\
    \ variables...\n\nWhy I mention it in chapter devoted to forms? `phpinfo()` -\
    \ the most convenient debugging tool. `phpinfo()`, in addition, displays values\
    \ of all `$_GET`, `$_POST` and `$_SERVER` - variables. So if the variable of a\
    \ form \"was lost\" to find the easiest way in what business - to use the `phpinfo`\
    \ function. In order that function displayed only variables values (and you had\
    \ not to scroll ten pages), it should be caused as follows: `phpinfo(INFO_VARIABLES)`;\
    \ or - that they is absolute are `phpinfo(32);`.\n\nExample:\n\n```php\n<html>\n\
    <body>\n<form method=\"post\" action=\"<?= <?= $_SERVER['PHP_SELF']?>\">\nEnter\
    \ your name: <input type=\"text\" name=\"name\">\n<input type=\"submit\" of value=\
    \ OK>\n</form>\n<?php\nphpinfo(32);\n?>\n</body>\n</html>\n```\n\nOr, for example,\
    \ such situation: you want to learn the visitor's IP address. You remember that\
    \ the corresponding variable is stored in an array of `$_SERVER`, but - here an\
    \ ill luck - forgot, how exactly the variable is called. Besides, we cause `phpinfo(32);`\
    \ we look for the IP address in the plate and we find it - in the line `$_SERVER[\"\
    REMOTE_ADDR\"]`.\n"
  trans: "\n问题在于，如果这些 `POST` 变量没有定义——如果表单尚未填写，它们将未被定义——`PHP` 将抛出关于使用未赋值变量的警告（这非常合理：这种信息可以让你快速发现变量名中难以察觉的拼写错误，并警告网站上可能存在的“漏洞”）。当然，你可以直接在表单中放置带有\
    \ `isset...` 的代码，但这会显得代码过于臃肿。\n\n明白了吗？现在试着在给定的代码中找出一个错误。嗯，不是绝对的错误，而是一个缺陷。\n\n\
    ### `htmlspecialchars()`\n\n没找到吗？我来提示。例如，在“name”字段中输入一个双引号和一些文本，例如“123”。提交表单并查看接收页面的源代码。在第四行会有类似这样的内容：\n\
    \n`Enter your name: <input type= \"text\" of name= \"name\" value= \"\" 123\"\
    >`\n\n那是——没什么事。但如果狡猾的用户输入了 JavaScript 代码呢？\n\n为了解决这个问题，必须使用 `htmlspecialchars()`\
    \ 函数，它会将某些特殊字符替换为 HTML 实体表示（例如，引号会被替换为 `&quot;`）：\n\n```php\n<html>\n<body>\n\
    <?php\n$name = isset ($_POST['name'])? htmlspecialchars($_POST['name']):' ';\n\
    $year = isset ($_POST['year'])? htmlspecialchars($_POST['year']):' ';\n\nif (isset($_POST['name'],\
    \ $_POST['year'])) {\n    if ($_POST['name'] ==' ') {\n        echo 'Enter a name!\
    \ <br>';\n    } else if ($_POST['year'] <1900 || $_POST['year']> 2016) {\n   \
    \     echo 'Specify by echo year of birth! Tolerance range of values: 1900. 2016\
    \ <br>';\n    } else {\n        echo 'Hello, '. $name.'! <br>';\n        $age\
    \ = 2016 - $_POST['year'];\n        echo 'to you '. $age.' years <br>';\n    }\n\
    \    echo' <hr>';\n}\n?>\n<form method=\"post\" action=\"<?= <?= $_SERVER['PHP_SELF']?>\"\
    >\nEnter your name: <input type=\"text\" name=\"name\" value=\"<?= $name?>\">\n\
    <br>\nEnter your year of birth: <input type=\"text\" name=\"year\" value=\"<?=\
    \ $year?>\">\n<input type=\"submit\" of value= OK>\n</form>\n</head>\n</html>\n\
    ```\n\n重复实验，并确信现在 HTML 代码是正确的。\n\n记住——当显示可能包含 HTML 特殊字符的变量内容时，必须始终使用 `htmlspecialchars()`\
    \ 函数。\n\n### `phpinfo()`\n\n`phpinfo()` 函数是 `PHP` 中最重要的函数之一。它输出关于 `PHP` 设置、各种配置变量的值的信息……\n\
    \n为什么我在关于表单的章节提到它？`phpinfo()` 是最方便的调试工具。`phpinfo()` 还会显示所有 `$_GET`、`$_POST` 和\
    \ `$_SERVER` 变量的值。所以如果表单中的变量“丢失”了，寻找它的最简单方法就是使用 `phpinfo` 函数。为了让该函数只显示变量值（而不需要滚动十页纸），应该这样调用：`phpinfo(INFO_VARIABLES)`；或者——使用绝对值\
    \ `phpinfo(32);`。\n\n示例：\n\n```php\n<html>\n<body>\n<form method=\"post\" action=\"\
    <?= <?= $_SERVER['PHP_SELF']?>\">\nEnter your name: <input type=\"text\" name=\"\
    name\">\n<input type=\"submit\" of value= OK>\n</form>\n<?php\nphpinfo(32);\n\
    ?>\n</body>\n</html>\n```\n\n或者，例如这种情况：你想获取访客的 IP 地址。你记得相应的变量存储在 `$_SERVER` 数组中，但——运气不佳——你忘记了变量具体叫什么名字。此外，我们调用\
    \ `phpinfo(32);`，在页面中查找 IP 地址，并找到了它——在 `$_SERVER[\"REMOTE_ADDR\"]` 这一行。\n\n"
