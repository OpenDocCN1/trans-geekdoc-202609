    At the stage `configure` probably you will see the errors connected with absence
    in system of necessary libraries. They need to be downloaded and set according
    to the instructions which are in files of `INSTALL` of distribution kits (usually
    - it is the same sequence. `/ configure && make && make install`). This business
    quite long and boring, therefore for a long time the majority of Unix-systems
    include this or that more convenient installation facility of the software.


    ### FreeBSD


    FreeBSD includes special means for software installation - `ports` (`ports`) representing
    a set of the scripts which are automatically downloading, configuring, compiling
    and installing software products including libraries, necessary for start (dependences
    - `dependences`). I will not paint in detail here as in FreeBSD to work with ports
    - it is described in FreeBSD Handbook and a set of books. Let''s assume that in
    your system the library of ports is set and updated.


    Ј we Pass into the directory of Apache port:


    ```bash

    cd/usr/ports/www/apache13

    ```


    Ј we Start the team of assembly and the Apache installation from under root''a
    (the distribution kit will be downloaded automatically):


    ```bash

    su

    make install

    ```


    If it is necessary to start automatically Apache when loading - we register in
    `/etc/rc.conf`:


    ```ini

    apache_enable= "YES"

    ```


    Actually, that''s all.;)


    In need of thin configuration study `Makefile` and add necessary parameters after
    the make install team (for example, `make install WITH_APACHE_SUEXEC=yes` - for
    support of `sexec`).


    ### Red Hat Linux and other RPM-based distribution kits (ASP, Mandrake...)


    Red Hat Linux includes the `RPM` package manager. The installation approach from
    RPM essentially another - `.rpm`-packets contain already compiled binary files.
    It gives a gain in time (it is necessary to compile nothing), however, deprives
    of an opportunity to collect the program as you want.


    For the Apache installation from rpm it is necessary to load the Apache 1.3 `.rpm-file`
    (from where - look for Google: Apache Software Foundation (apache.org) does not
    extend RPM and start: `rpm - Uvh apache`).


    ### Gentoo Linux


    Gentoo Linux - the "BSD style Linux" which is inherently - contains `portages`
    - system of ports similar on used in FreeBSD. Installation is made by means of
    the `emerge` team, for example:


    ```bash

    cd/usr/portage/net-www/apache

    su

    emerge apache-1.3.31.ebuild

    ```


    Do not start just `emerge apache` - it will lead to the Apache 2 installation.


    For automatic start of Apache when loading, enter


    ```bash

    rc-update add apache default

    ```


    ### Other Linux distribution kits


    Other Linux distribution kits (Debian, Slackware...) contain own package managers
    - address documentation. Anyway (even in case of other Unix OS) you can compile
    and set Apache manually - as it is described above.


    # III. PHP installation


    ### III-1 PHP installation in Windows family OS


    Download from the `www.php.net/downloads.php` page Windows Binaries ZIP archive
    (PHP 4.x.x Zip package).


    Do not swing "PHP 4.x.x installer" - there are no many necessary files!


    Unpack archive in `C:\PHP` (or to any other place - but it will be assumed further
    that you selected `C:\PHP`). Copy the `php4ts.dll` file in the `C:\WINDOWS\SYSTEM32`
    (or the corresponding directory). Copy the `php.ini-dist` file in the `C:\WINDOWS`
    and rename it in `php.ini` directory.


    ### III-2 PHP installation in Unix family OS


    Installation process of PHP is similar to the Apache installation except that
    at assembly of PHP you need to specify much more configuration options.


    At manual assembly from sources - for this purpose it is necessary to download
    and unpack the source code with `www.php.net/downloads.php` - at first start.
    `/ configure` - help also study the parameter list of assembly (very impressive).


    Anyway, parameter - `with-apxs=/put/k/apxs` is required - it is necessary for
    assembly of the module of the Apache of `mod_php`. For example, if Apache is set
    in `/usr/local`, then parameter will look as follows: - `with-apxs=/usr/local/sbin/apxs`.


    After configuring, start `make`, and `make install`.


    The more you use the options connecting different expansions the more it is required
    to download and set necessary libraries manually. It is better to use, of course,
    a package manager or ports of your OS.


    Irrespective of the selected way, after successful installation, copy `php.ini-dist`
    in `php.ini`:


    ```bash

    cd/usr/local/etc

    cp php.ini-dist php.ini

    ```


    (depending on OS, instead of `/usr/local/etc` can be used by `directory/etc`,
    etc.).


    ### FreeBSD


    It is convenient to PHP to set from FreeBSD ports.


    Having used the `su` team for obtaining the rights of the superuser, we will pass
    into directory`/usr/ports/lang/php4`.


    There are two options of assembly of PHP from ports - interactive and by means
    of make team parameters.


    In the first case, we will just start the `make install` team. After make will
    download and will unpack the PHP distribution kit, on the screen the window with
    the list of possible options of configuring will appear - just put "crosses" against
    necessary.


    The interactive way, at all its convenience, has a shortcoming - the parameters
    selected once cannot be saved for use of the same configuration repeatedly. It
    is possible to specify all necessary parameters in the command line, for example
    `make install WITH_MYSQL=YES WITH_GD=YES`. The list of possible options is in
    the `/usr/ports/lang/php4/scripts/php4_options` file (this file, by the way, and
    the script displaying a window in interactive).


    Update: recently (probably, from a big hangover) the PHP port decided to remake
    everything. Now assembly of PHP with static linking of expansions (i.e. compilation
    of PHP and the selected expansions in one so) from ports is impossible. Or handles,
    - if dynamic (shared) expansions arrange - `/usr/ports/lang/php4`, `make install`.
    For php5 - similarly. However, when using PHP as Apache-module, dynamic expansions
    at all not more so you should not be upset about it.


    ### Red Hat Linux and other RPM-based distribution kits (ASP, Mandrake...)


    As it was already told, Red Hat-packets contain already compiled binary files,
    you should find on the Internet ready rpm with the configuration which is most
    suitable you and to set it, having used the rpm team.


    ### Gentoo Linux


    Gentoo-portage PHP (Apache module) there is in `/usr/portage/dev-php/mod_php`.
    For the indication of the configure parameters use the `USE` variable (the incomplete
    list of possible USE values in Gentoo: `www.gentoo.org/dyn/use-index`). It is
    possible to edit `etc/make.conf`, but it is more convenient so:


    ```bash

    USE= "gd mysql pdf xslt-X" emerge mod_php

    ```


    In this case, the `USE` variable is established only on runtime of the emerge
    team (" for a guarantee that any library will not pull along XFree86"). After
    installation, the `php.ini` file (to be exact - symlink on it) is in `/etc/apache/conf`.


    # IV. Apache+PHP configuration


    If it was not made yet by the installation program of packets/ports, add the next
    lines to the configuration file of Apache `httpd.conf`:


    For OS Windows:


    ```apache

    LoadModule php4_module C:/php/sapi/php4apache.dll

    ```


    For OS Unix:


    after the last directive `LoadModule`:


    ```apache

    LoadModule php4_module libexec/apache/libphp4.so

    ```


    For all OS:


    after the last directive `AddModule`:


    ```apache

    AddModule mod_php4.c

    ```


    In the `<IfModule mod_mime.c>` block:


    ```apache

    AddType application/x-httpd-php .php

    ```


    Prescribe in the line `DirectoryIndex` to `index.php`:


    ```apache

    DirectoryIndex index.php index.html

    ```


    ### Connection of expansions


    In Windows, for connection of expansions it is necessary to uncomment the corresponding
    lines `extension=...` in `php.ini`, without having forgotten to register a way
    to them in the line `extension_dir=.` (usually they are in `c:\php\extensions`
    for php4 and in `c:\php\ext` for php5).

