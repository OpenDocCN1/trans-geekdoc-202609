- raw: "6.}\n\n7.}\n\n8.?>\n\nArrays\n\nThe array represents a set of the variables\
    \ combined by one name. Each value of an array is identified by an index which\
    \ is specified after a variable array name in square brackets. The combination\
    \ of an index and the value corresponding to it is called an array cell. \n\n\
    1.<?\n\n2.$i = 1024;\n\n3.$a \\[1\\] = 'abc';\n\n4.$a \\[2\\] = 100;\n\n5.$a \\\
    ['test'\\] = $i - $a \\[2\\];\n\n6. \n\n7.echo of $a \\[1\\]. \"br\\\\n\";\n\n\
    8.echo of $a \\[2\\]. \"br\\\\n\";\n\n9.echo of $a \\['test'\\]. \"br\\\\n\";\n\
    \n10.?>\n\nIn the given example, $a array cell with an index 1 appears in a line\
    \ three; line abc value is appropriated to an array cell. The same line also $a\
    \ array as this first mentioning of a variable of $a in the context of an array,\
    \ the array is created automatically appears. In line 4 numerical value 100 is\
    \ appropriated to an array cell with an index 2. In line 5 the value equal to\
    \ a difference of $i and $a \\[2\\] be assigned to $a array cell with the line\
    \ test index. \n\nAs you can see, the index of an array can be both number, and\
    \ line. \n\nIn other programming languages (for example, Perl) the arrays having\
    \ line indexes are called hashes (hash), and are separate data type. In PHP, in\
    \ fact, all arrays are hashes, however both the line, and number can serve as\
    \ an index.\n\nIn the previous example the array was created automatically at\
    \ the description of the first array cell. But the array can be set and it is\
    \ explicit: \n\n1.<?\n\n2.$i = 1024;\n\n3.$a = array (1=>'abc', 2=> 100, 'test\
    \ '=> of $i-100);\n\n4.print\\_r ($a);\n\n5.?>\n\nThe array of $a created in the\
    \ last example is completely similar to an array from the previous example. Each\
    \ array cell here is set in a look an index => value. During creation of the test\
    \ element it was necessary to specify value 100 directly as this time we create\
    \ an array \"at one stroke\", and values of its elements at a stage of creation\
    \ are unknown to PHP. \n\nIn line 4 for output of value of an array we used the\
    \ print\\_r function () which is very convenient for output of contents of arrays\
    \ to the screen - first of all, for debugging. \n\nLines in output of the print\\\
    _r function are divided by normal line feed \\\\n, but not a tag <br>. For convenience\
    \ of reading, the line print\\_r (.) it is possible to surround with operators\
    \ of output of tags <pre>... </pre>: \n\necho of '<pre>';\n\nprint\\_r ($a);\n\
    \necho' </pre>'; \n\nIf obviously not to specify indexes, then the property of\
    \ arrays of PHP characteristic of numerical array in other languages is shown\
    \ here: the next element will have a serial numerical index. Numbering starts\
    \ from scratch. Example: \n\n1.<?\n\n2.$operating\\_systems = array ('Windows',\
    \ 'Linux', 'FreeBSD', 'OS/2');\n\n3.$operating\\_systems \\[\\] = 'MS-DOS';\n\n\
    4. \n\n5.echo of \"<pre>\";\n\n6.print\\_r ($operating\\_systems);\n\n7.echo\"\
    \ </pre>\";\n\n8.?>\n\nOutput: \n\nArray\n\n(\n\n    \\[0\\] => Windows\n\n   \
    \ \\[1\\] => Linux\n\n    \\[2\\] => FreeBSD\n\n    \\[3\\] => OS/2\n\n    \\\
    [4\\] => MS-DOS\n\n)\n\nHere we obviously did not specify indexes: PHP automatically\
    \ appropriated numerical indexes, since zero. When using such form of record the\
    \ array can be touched by means of the cycle for. The quantity of array cells\
    \ is returned by count operator (or its synonym, size of): \n\n1.<?\n\n2.$operating\\\
    _systems = array ('Windows', 'Linux', 'FreeBSD', 'OS/2');\n\n3.$operating\\_systems\
    \ \\[\\] = 'MS-DOS';\n\n4. \n\n5.echo of '<table border=1>';\n\n6.for ($i=0; $i\
    \ <count ($operating\\_systems); $i ++) {\n\n7.echo' <tr> <td>'. $i.' </td> <td>'.\
    \ $operating\\_systems \\[$i\\].' </td> </tr>';\n\n8.}\n\n9.echo' </table>';\n\
    \n10.?>\n\nStyles of record can be mixed. Pay attention to what indexes are automatically\
    \ appropriated to PHP after installation of some indexes manually. \n\n1.<?\n\n\
    2.$languages = array (\n\n3.1 => 'Assembler',\n\n4.'C ++',\n\n5.'Pascal',\n\n\
    6.'scripting' => 'bash'\n\n7.);\n\n8.$languages \\['PHP'\\] = 'PHP';\n\n9.$languages\
    \ \\[100\\] = 'Java';\n\n10.$languages \\[\\] = 'Perl';\n\n11. \n\n12.echo of\
    \ \"<pre>\";\n\n13.print\\_r ($languages);\n\n14.echo\" </pre>\";\n\n15.?>\n\n\
    Output: \n\nArray\n\n(\n\n    \\[1\\] => Assembler\n\n    \\[2\\] => C ++\n\n\
        \\[3\\] => Pascal\n\n    \\[scripting\\] => bash\n\n    \\[php\\] => PHP\n\
    \n    \\[100\\] => Java\n\n    \\[101\\] => Perl\n\n)\n\nForeach loop\n\nArray,\
    \ similar to previous, it is difficult to touch by means of for. For search of\
    \ array cells the special for each loop is provided: \n\n1.<?\n\n2.$languages\
    \ = array (\n\n3.1 => 'Assembler',\n\n4.'C ++',\n\n5.'Pascal',\n\n6.'scripting'\
    \ => 'bash'\n\n7.);\n\n8.$languages \\['PHP'\\] = 'PHP';\n\n9.$languages \\[100\\\
    ] = 'Java';\n\n10.$languages \\[\\] = 'Perl';\n\n11.?>\n\n12.<table>\n\n13.<tr>\n\
    \n14.<the> Index </th>\n\n15.<th> Value </th>\n\n16.</tr>\n\n17.<?\n\n18.for each\
    \ ($languages as of $key => $value) {\n\n19.echo' <tr> <td>'. $key.' </td> <td>'.\
    \ $value.' </td> </tr>';\n\n20.}\n\n21.?>\n\n22.</table>\n\nThis cycle works as\
    \ follows: as emergence in a code of the program of array cells $languages, variable\
    \ $key and $value be assigned respectively an index and value of the next element,\
    \ and the loop body is carried out. \n\nIf indexes do not interest us, the cycle\
    \ can be written as follows: for each ($languages as of $value). \n\nConstructions\
    \ of list and each\n\nIn addition to already considered construction of array,\
    \ there is a construction of list supplementing it being some kind of antipode\
    \ of array: if the last is used for creation of an array from a set of values,\
    \ then list, on the contrary, fills the listed variables with values from an array.\
    \ \n\nLet's say we have $lang array = array ('php', 'Perl', 'basic'). Then construction\
    \ of list ($a, $b) = $lang will appropriate to $a variable PHP value, and $b -\
    \ 'perl'. Respectively, list ($a, $b, $c) = $lang will in addition appropriate\
    \ $c = to 'basic'. \n\nIf in an array of $lang there was only one element, PHP\
    \ would issue the note on lack of the second array cell.\n\nAnd if we are interested\
    \ not only in values, but also indexes? Let's use construction of each which returns\
    \ couples an index value. \n\n1.<?\n\n2.$browsers = array (\n\n3.'MSIE' => 'Microsoft\
    \ Internet Explorer 6.0',\n\n4.'Gecko' => 'Mozilla Firefox 0.9',\n\n5.'Opera'\
    \ => 'Opera 7.50'\n\n6.);\n\n7. \n\n8.list ($a, $b) = each ($browsers);\n\n9.list\
    \ ($c, $d) = each ($browsers);\n\n10.list ($e, $f) = each ($browsers);\n\n11.$a\
    \ echo.': '. $b. \"br\\\\n\";\n\n12.$c echo.': '. $d. \"br\\\\n\";\n\n13.$e echo.':\
    \ '. $f. \"br\\\\n\";\n\n14.?>\n\nAt first sight the fact that in lines different\
    \ values are appropriated to 8-10 variables though expressions to the right of\
    \ an assignment sign absolutely identical can surprise. The matter is that each\
    \ array has a hidden pointer of the current element. Initially he points to the\
    \ first element. Construction of each advances the pointer on one element. \n\n\
    This feature allows to touch an array by means of the normal cycles while and\
    \ for. Of course, earlier considered foreach loop is more convenient, and it is\
    \ worth preferring it, but construction with use of each is quite widespread,\
