    strategies for larger robot teams, and personalizing HRC to adapt to human habits
    while enhancing safety and interpretability. Table III succinctly encapsulates
    these domains by detailing key objectives, challenges addressed, RL approaches,
    methodology highlights, outcomes, and future directions, alongside representative
    studies demonstrating RL''s transformative impact on robotics.


    ## III. CHALLENGES, STATE OF THE ART, AND FUTURE DIRECTIONS


    There has been a significant progress in the field of RL for optimization in automation;
    however, there are still challenges to be addressed. Table IV gives a comparison
    of these challenges, along with the state of the art in the field and future directions
    that we will discuss in this section.


    ### A. Sample Efficiency and Scalability


    Sample efficiency and scalability are vital in RL to minimize training data and
    ensure solutions scale with task complexity. These challenges are particularly
    important in real-world applications where data collection is expensive or time-consuming
    [71], [72].

    Current efforts to enhance sample efficiency and scalability include making past
    samples more reflective of the current model [71], [72], using evolution strategies
    and efficient memory in experience replay [73], [74], incorporating offline data
    for online learning [75], [76], and leveraging adaptive learning techniques [77],
    [78].

    Future research should aim at algorithms with adaptive learning rates, domain-specific
    knowledge integration, efficient computational resource use, and cross-domain
    transfer learning to further improve sample efficiency and scalability in RL applications.


    ### B. Safety and Robustness


    Ensuring safety and robustness in RL is crucial, especially for applications in
    critical domains like autonomous driving and healthcare. Safe RL algorithms aim
    to learn policies that satisfy safety constraints during both training and deployment
    [107].

    Current strategies for ensuring safety include developing concepts of safety robustness
    [79], frameworks for robust policies [80], tackling observational adversarial
    attacks [81], integrating robust-control-barrier-function layers [82], managing
    safety requirements with robust action governor [83], enforcing safety via robust
    Model Predictive Control (MPC) [84], offering robustness guarantees [85], [86],
    improving policy robustness through falsification-based adversarial learning [87],
    and inducing a safety curriculum [108].


