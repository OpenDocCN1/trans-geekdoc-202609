    # A. Manufacturing


    RL is revolutionizing manufacturing through advancements in production scheduling,
    inventory management, maintenance planning, and process control, showcasing its
    potential to tackle complex optimization challenges within this sector. In production
    scheduling, RL methods surpass traditional models by adeptly handling uncertainties,
    thereby enhancing profitability and customer service [6], [12]–[15]. For inventory
    management, RL techniques, particularly Deep Reinforcement Learning (DRL) and
    Multi-agent Reinforcement Learning (MARL), offer innovative solutions for managing
    stochastic demands and complex supply chains, leading to improved sales and reduced
    wastage [8], [16]–[19]. Maintenance planning benefits from RL’s dynamic optimization
    capabilities, utilizing real-time data for maintenance schedules, thus improving
    system reliability and reducing downtimes [20]–[24]. In process control, RL’s
    adaptability ensures product quality and operational efficiency, with methodologies
    like Explainable RL and DRL enhancing process understanding and control strategies
    [7], [25]–[28]. Future directions point towards developing risk-sensitive formulations,
    leveraging real-world data, and integrating smart systems to further enhance manufacturing
    efficiency. Table I encapsulates these insights by outlining key objectives, challenges
    addressed, RL approaches, outcomes, and future directions, alongside representative
    studies that underscore RL’s transformative impact on manufacturing.


    # B. Energy Systems


    RL and DRL are transforming energy systems, offering innovative solutions across
    demand response, microgrid management, renewable energy integration, and Heating,
    Ventilation, and Air Conditioning (HVAC) control to optimize and enhance grid
    stability, sustainability, and energy efficiency. Demand response strategies benefit
    from DRL and MARL to dynamically adjust energy usage in response to utility signals,
    achieving up to 22% energy savings and more efficient


    electricity management [29]–[34]. In microgrid management, DRL and MARL approaches
    enhance grid resilience by optimizing energy distribution and usage, resulting
    in improved cost efficiency and increased system reliability [35]–[40]. For renewable
    energy integration, RL’s capability to handle the variability of renewable sources
    leads to more effective energy dispatch strategies, ensuring grid stability and
    maximizing the use of renewable resources [4], [31], [41]–[44]. HVAC systems,
    as major energy consumers, see optimizations through DRL and batch RL methods,
    achieving significant reductions in energy consumption while maintaining occupant
    comfort [29], [45]–[49]. Looking ahead, the future promises advancements in adaptive
    strategies and bridging the simulation-experiment gap for demand response, enhanced
    learning efficiency for microgrid management, scalability and adaptability improvements
    in renewable energy integration, and wider applicability of pre-trained models
    for HVAC control. This narrative is encapsulated in the Table II, which outlines
    the key objectives, challenges addressed, RL methodologies, and outcomes for each
    sub-domain, alongside future research directions and representative studies illustrating
    RL’s significant role in advancing energy systems.


    # C. Robotics


    RL is revolutionizing robotics, making significant strides across motion planning,
    grasping and manipulation, multi-robot coordination, and human-robot collaboration,
    thereby addressing intricate challenges inherent in the field. In motion planning,
    RL, particularly DRL and innovative methodologies like curriculum learning, empowers
    robots to adeptly navigate and execute tasks in dynamic environments, enhancing
    adaptability and task performance [50]–[52], [63]. Grasping and manipulation benefit
    from DRL’s ability to process complex sensor inputs, enabling robots to interact
    with diverse objects and environments with unprecedented flexibility and efficiency
    [53], [54], [64]–[66]. Multi-robot coordination leverages DRL and MARL to facilitate
    sophisticated collaborative strategies among robots, optimizing collective actions
