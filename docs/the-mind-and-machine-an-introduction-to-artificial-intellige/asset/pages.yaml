  md: "+   - Reactive Machines: These are the simplest type of AI, and they do not\
    \ possess the ability to form memories or use past experiences to inform current\
    \ decisions. They can only react to the current situation and perform a predetermined\
    \ task.\n+   \n+   - Limited Memory: These types of AI have the ability to use\
    \ past experiences to inform current decisions, but they do not possess the ability\
    \ to form long-term memories.\n+   \n+   - Theory of Mind: This type of AI is\
    \ capable of understanding and simulating human emotions and mental states.\n\
    +   \n+   - Self-Aware: This is the most advanced type of AI, and it is capable\
    \ of understanding and"
  merge: -1
