    \nDr. K.M.M. Vishvak Chanthar,  \nEndocrine and Breast Surgeon,  \nSanjay Gandhi\
    \ Postgraduate Institute of Medical Sciences, Lucknow\n\n## Foreword\n\nDevelopments\
    \ in Artificial Intelligence, especially explorations of its creative potential,\
    \ are all over the news these days without there being any broader understanding\
    \ of its character. It is already used extensively on the internet, in manufacturing\
    \ and industry, medicine, filmmaking, military and intelligence systems, surveillance\
