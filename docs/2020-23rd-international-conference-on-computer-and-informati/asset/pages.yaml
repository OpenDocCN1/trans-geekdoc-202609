    # II. METHODOLOGY


    This work is adopted via machine learning methods where hotel booking data were
    processed to obtain good results. Figure 1 shows how numerous models were proposed
    to investigate this dataset and evaluate the effects of individual models. The
    proposed approach is much more elaborate as follows:


    # A. Data Description


    This data was generated by Antonio, Almeida, and Neves [2] that contain two hotel
    booking information like resort (H1) and hotel (H2). It was gathered from their
    database using Transacting-Structured Query Language (TSQL) query. All instances
    containing hotel or customer identification were removed. Then, we combined the
    datasets with 31 variables where 40,060 observations of H1 and 79,330 observations
    of H2. However, a city hotel had a higher cancellation rate (38%) than a resort
    hotel (27.69%). This table contains three years of information from 1st July,
