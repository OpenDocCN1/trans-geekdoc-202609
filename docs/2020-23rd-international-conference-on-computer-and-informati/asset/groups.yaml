    ## E. 评估指标


    使用多种评估方法来执行机器学习模型并在所有模型中探索最佳模型。混淆矩阵将实例表示为正类 (TP)、假正 (FP)、真负 (TN) 和负类 (FN)。模型性能通过不同的指标进行评估：准确率
    (Accuracy)、AUROC 和 F 值 (F-Measure)。


    * 准确率：代表分类器的效率，使用以下公式衡量正确性：


    > Accuracy = \frac{TP + TN}{TP + TN + FP + FN} (1)


    * AUROC：提供了分类器与负类分离的概率。然而，可以通过以下公式确定，其中正性率 (TPR) 和真负性率 (TNR) 为：


    > AUROC = \frac{TPR + TN}{TPR + FN} (2)


    * F 值：精确率 (Precision) 定义为少数实例除以总实例数；召回率 (Recall) 是正确分类相似记录的性能。因此，F 值是精确率和召回率的调和平均数，表示如下：


    > Precision = \frac{TP}{TP + FP} (3)


    > Recall = \frac{TP}{TP + FN} (4)


    > F-Measure = \frac{2 \times Precision \times Recall}{Precision + Recall} (5)


