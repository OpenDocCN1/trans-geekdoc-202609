    ## E. Evaluation Metrics


    Various evaluation is used to execute machine learning models and explored the
    best model among all them. Confusion matrix represent instances as positive (TP),
    false positive (FP), true negative (TN) and negative (FN). The performance of
    the model is evaluated by different metrics: Accuracy, AUROC and F-Measure in
    this.


    * Accuracy: represents the efficiency of the classifier that measures the correctness
    using the following equation:


    > Accuracy = \frac{TP + TN}{TP + TN + FP + FN} (1)


    * AUROC: provides the probabilities how well the classifiers are separated from
    negative classes. However, it can be determined by following equation where true
    positive rate (TPR) and true negative rate (TNR) are:


    > AUROC = \frac{TPR + TN}{TPR + FN} (2)


    * F-Measure: Precision defines the number of smaller instances divided by the
    total number of instances. and recall the performance of correctly classified
    similar records and So, F-measure is the harmonic mean of precision and recall
    that represents as follows:


    > Precision = \frac{TP}{TP + FP} (3)


    > Recall = \frac{TP}{TP + FN} (4)


    > F-Measure = \frac{2 \times Precision \times Recall}{Precision + Recall} (5)


