    (GB)、随机森林 (RF)、XGBoost (XGB)、决策树 (DT)、逻辑回归 (LR)、k 近邻 (KNN) 和高斯朴素贝叶斯 (GNB)，并分析单个分类器的性能，以估计它们的表现如何以及构建更高效的模型。因此，大多数模型在之前的工作中被广泛应用于不同类型的数据集学习项目中
