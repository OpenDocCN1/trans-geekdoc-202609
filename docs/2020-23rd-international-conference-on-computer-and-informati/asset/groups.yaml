    ### A. 数据描述


    此数据由 Antonio, Almeida 和 Neves [2] 生成，包含两种酒店信息，如度假村 (H1) 和酒店 (H2)。使用事务结构化查询语言 (TSQL)
    查询从其数据库中收集。删除了所有包含酒店或身份信息的实例。然后，我们将 40,060 个 H1 和 79,330 个 H2 合并在一起。然而，城市酒店的取消率
    (38%) 高于度假酒店 (27.69%)。该表包含从 2015 年 7 月 1 日到 2017 年 8 月 31 日三年的信息。


    ### B. 数据预处理与探索


    数据预处理用于清理和处理数据集以供未来分析。此外，为了构建泛化的机器学习模型，仔细检查了异常值、缺失值和数据净化等不同情况。该数据集包含三个缺失值


