    ***摘要*—酒店预订取消对酒店业的需求管理决策影响巨大。本工作的目标是调查来自 Kaggle 数据的酒店预订取消数据集中，使用的不同机器学习方法的影响。然后，通过特征选择方法在原始数据和数据集中实施了不同的特征转换技术。在原始数据和子数据集中采用了多种分类器，并探索了最佳方法。在所有方法中，我们发现
    XGB 是处理数据集最频繁的方法。单个分类器产生了最高的准确率。该方法也可以作为互补工具，更有效地研究酒店预订取消。


    ***索引术语*—酒店预订取消，机器学习，特征转换，特征选择，分类


    ## I. 引言


    在酒店行业中，酒店预订取消是关于接受需求决策的重要组成部分。它影响酒店的预计收入。酒店管理部门通过分析这些过程来关注客户的需求。酒店预订取消可能有许多原因，如设施缺乏、意外优惠、义务、疾病和计划变更。根据
    [6], [7]，由于客户处理倾向的变化，取消率正在大幅增加。有时，他们可能会评估多个选项和政策，最终拒绝所有选项。为了最大限度地减少损失，酒店官方采取了严格的取消规则和政策。然而，在某些情况下，灵活性是有益的，因为会损害服务质量，且低额/不可退款政策也会减少收入和预订数量
    [5, 16]。因此，一些酒店实施了过拟合策略导致在拒绝提供服务时产生糟糕体验 [12]。


    近年来，机器学习被广泛用于提取重要信息并预测酒店旅游管理领域的各个方面。酒店预订取消有多种原因，但这些原因并没有明确或准确说明。Morales 和 Wang
    [11] 指出，很难想象能够以高准确率预测预订是否会被取消。然而，Huang 等人 [9] 的几项工作开发了酒店取消。例如，一种基于人工神经网络 (ANN)
    的客户预测模型，其中生成了反向传播 (BPN) 和通用回归神经网络 (RNN) 来预测酒店取消。在台湾的西餐连锁店，Anton [3] 提供了一种类似的使用
    XGBoost (XGB) 的酒店预订策略技术，用于预测哪些预订可能取消，并通过支持向量机 (SVM) 和 ANN 等分类方法在四个酒店数据集中未进行特征选择，而是预测取消概率。他们
    [1] 提出了一种基于机器学习的决策支持系统，显示了两种方法重要性，并评估了决策树、决策森林、类似支持向量机的方法捕捉取消模式的能力，并衡量了随时间变化的预测精确度。Sam
    [13] 在乘客姓名数据集中使用 ANN 实现并使用遗传算法优化了随机森林、SVM、决策树和 ANN。在这项工作中，我们提出了一种利用客户实例估算收入的酒店预订取消方法。然后，实施了并恰当地地探索了各种特征选择和分类方法以寻找最佳方案。该方法估计了客户需求，并减少了酒店预订取消过程中的不确定性，有助于收益管理、库存分配、物资采购和定价决策。


