    ***Abstract*—Hotel booking cancellation is a substantial effect on demand management
    decisions in the hospitality industry. The goal of this work is to investigate
    the effects of different machine learning methods used in hotel booking cancellation
    dataset from Kaggle data. Then, different feature transformation techniques were
    implemented in primary and dataset using feature selection methods. Various classifiers
    were employed into primary and subsets and explored the best approaches. Among
    all the methods, we found XGB is the most frequent method to handle datasets.
    Individual classifiers generated the highest accuracy. This method can also be
    used as the complementary tool to investigate hotel booking cancellation more
    effectively.


    ***Index Terms*—Hotel Booking Cancellation, Machine Learning, Feature Transformation,
    Feature Selection, Classification


    # I. INTRODUCTION


    In the hotel industry, hotel booking cancellation is as a major part for decision
    making regarding accepted demands. It affects the estimated revenue of the hotel.
    The authority of hotel management are concerned by customer''s requirement by
    analyzing these processes. There might be many reasons for hotel booking cancellation
    such as lack of facilities, unexpected offers, obligations, illnesses, and de-change.
    According to [6], [7], the cancellation rates are increasing greatly for the dealing
    tendency of customers. Sometimes, they may evaluate multiple options and policies,
    and finally reject all of them. To minimize losses, hotel authority employed strict
    cancellation rules and policies. However, flexibility might be beneficial in certain
    circumstances because it hurts the quality of service and low refund/non-refundable
    policies decreases revenue as well as number of bookings [5, 16]. Consequently,
    some hotels are implemented overfitting strategies to get terrible experience
    where they deny service provision [12].


    In recent years, machine learning is widely used to extract significant information
    and predict various aspects in the hotel and tourism management field. Various
    reasons are happened to cancel hotel booking, but they are not specified or accurately.
    Morales and Wang [11] stated that it is hard to imagine one can predict whether
    a booking will be cancelled or not with high accuracy. However, several works
    by Huang et al. [9] developed hotel cancellation. For instance an artificial network
    (ANN) based customer prediction model where backpropagation (BPN) and general
    regression neural network (RNN) were generated to predict hotel cancellation.
    In Western restaurant chain in Taiwan, Anton [3] provided a similar hotel booking
    strategies strategies of techniques using XGBoost (XGB) to predict which booking
    are likely to cancel and not make feature selection through classification methods
    like support vector machine,SVM) and ANN into four hotel datasets and predict
    the cancellation probability. They [1] proposed the machine learning based decision
    support system which showed the importance of two methods and evaluated the decision
    tree, decision forest, jungle like support vector machine to capture the patterns
    of cancellations and measured predicted precision over time. Sam [13] implemented
    random forest, SVM, decision tree, and ANN optimized with genetic algorithms in
    Passenger Name dataset using ANN. In this work, we proposed a hotel booking cancellation
    method that estimates the revenue using customer instances. Then, various feature
    selection, and classification methods were implemented and explored the best appropriately.
    It is estimated the demand of customers and reduced uncertainty in hotel booking
    cancellation process that is helpful for revenue management, inventory allocation,
    supplies purchases and pricing decisions as.'
