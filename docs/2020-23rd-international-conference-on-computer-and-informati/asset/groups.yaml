    在实验中，我们分别使用 scikit-learn 库实现了不同的特征转换、选择和分类技术。表 III 显示了所有实验结果，但 GB 在主数据集、min 和
    z 转换数据集上显示出最高准确率。此外，它在主数据上显示了最佳 AUROC 和 F 值。此外，LR 在平方根、min-max、z 和 z 平方转换数据集上显示了最高
    AUROC 和 F 值。XGB 在主数据上显示了最高准确率和 AUROC。然而，LR 在主数据、min-max 和 z 数据集上显示了最高 F 值。XGB
    在主数据上显示了最高 AUROC。它在平方根、min-max 和 z 转换数据集上显示了最佳 AUROC 和 F 值。XGB 在主数据和转换数据集上显示了最高准确率。因此，检测最佳算法是非常困难的。在子集中，GB
    在主数据上是最佳分类器，RF 在转换数据上表现最佳。在 GB 子集中，XGB 在主数据上是最佳分类器。在 XGB 子集中，主数据比转换数据更重要。因此，特征转换技术并不更好。在模型比较中，通过探索
    AUROC 和 F 值，GB 和 XGB 在主数据上生成的输出是更灵活的分类器，除了 IGAE 子集外。


