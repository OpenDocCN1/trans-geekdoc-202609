    $$

    \frac{\partial f}{\partial f} = 1 = (UG)

    $$


    **Step 2:** By using *equation (3.65)*, we get the following local gradient by
    substituting the value of $x = 1.37$ that we computed during the forward pass
    in *figure 3.36*.


    $$

    \frac{\partial f}{\partial x} = \frac{\partial}{\partial x}\left(\frac{1}{x}\right)
    = -\frac{1}{x^2} = -\frac{1}{(1.37)^2} = -0.53 = (LG)

    $$


    Further, the net value at this point is $T = UG \times LG = (1) \times (-0.53)
    = -0.53$. The value $T = -0.53$ is now considered/treated as UG for *step 3*.


