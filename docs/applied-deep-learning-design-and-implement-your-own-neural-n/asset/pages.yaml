    # # Hyper planes


    In geometry, a hyperplane can be defined as a subspace whose dimension of its
    ambient space is one more than that of its subspace. So accordingly, the hyperplane
    of the space is two-dimensional if the dimension of the corresponding space is
    three. The hyperplane can be used in any type of general space in which the concept
    of subspace dimensions is present.


    Figure 1.39 shows the hyperplane of two dimensions, and its space dimensions are
    three:


    ![](img/7e519fee1b702b91799cdf1664598392_78_0.png)


    *Figure 1.39: 2-D hyperplane*


    When it comes to machine learning, hyperplanes can be defined as the decision
    boundaries which are used for the classification of data points. As the data point
    lying on one side of the hyperplane can be termed as one class, and data points
    lying on the other side of the hyperplane as another class.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'The number of dimensions of the hyperplane relies on the number of features.
    So, let us say if the input features are two, and then the hyperplane is just
    a line. However, if the number of features is three, then the hyperplane becomes
    a 2-D plane. The equation of 2 feature hyperplane is given by the following:


    $y = mx + b$ (1.33)


    where $m$ is the slope of the line and $b$ is the intercept on the $y$-axis. The
    equation of hyperplane having more than two features is given by the following:


    $w^T x + b = 0$ (1.34)


    Where $w$ is a set of weights, $b$ is biased, and $x$ denotes the input vector
    and $w^T x$ represents the dot product of two vectors. Suppose we have two vectors:


    $x = \begin{pmatrix} 1 \\ x \\ y \end{pmatrix} \text{ and } w = \begin{pmatrix}
    -b \\ -m \\ 1 \end{pmatrix}$


    Then,


    $w^T x = -b * 1 + (-m) * x + 1 * y$ (1.35)


    $w^T x = y - mx - b$ (1.36)


    Figure 1.40 shows a straight line where R$^2$ represents the subspace of 2-D:


    ![](img/7e519fee1b702b91799cdf1664598392_79_0.png)


    Figure 1.40: Hyperplane in R$^2$ is a line'
  merge: -1
  img_proc: true
