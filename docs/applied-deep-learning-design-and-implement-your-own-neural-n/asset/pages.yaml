  md: '# CHAPTER 4


    # Convolutional Neural Networks


    CNN is the heart of deep learning. This chapter discusses the concepts of convolutional
    neural networks (CNN), architectures, components, and parameters used in various
    applications. The difference between fully connected layers and CNN layers is
    also discussed in this chapter. The datasets such as MNIST, ImageNet, and CIFAR-10
    consist of various types of images of different sizes, which are used in the study
    of convolutional neural networks. The main objective of CNN is to perform image
    classification by training different filters based on the input dataset and backpropagation.
    The difference between machine learning and deep learning is that in deep learning,
    the filters are automatically trained, and objects are classified, but in machine
    learning, filters remain fixed.


    The basic concepts of image processing, such as the size of filters, type of filters,
    correlation, convolution, padding, and stride, are also discussed in this chapter,
    which are helpful for the readers to understand CNN. They can design their own
    CNN models for image classification for different applications.


    Furthermore, in this chapter, the one-dimensional, two-dimensional, and three-dimensional
    convolutions are discussed with proper examples. Moreover, the entire CNN architecture
    and various components, such as convolution, ReLu, Max pooling, fully connected
    layers, and Softmax, are discussed in detail. In the later section, after a discussion
    of all the layers of convolutional neural networks, CNN is discussed'
