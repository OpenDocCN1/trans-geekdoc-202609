- pgno: 235
  md: '# Spatial filters


    The spatial filter is the filter used for filtering or passing certain frequency
    components. For example, a filter that passes high frequencies is known as a high-pass
    filter.


    A spatial filter consists of two elements as follows:


    +   - A neighborhood (typically a small rectangle).

    +   - A predefined operation is performed on the pixels of the spatial image incorporated
    by the neighborhood.


    The filtering process generates a new matrix of a pixel having coordinates the
    same as the coordinates of the neighborhood center. Spatial filters are broadly
    categorized as smoothing and sharpening filters, which are discussed as follows.


    # Smoothing filters (low pass filters)


    In image processing, smoothing filters are used for noise reduction and for blurring
    an image. Blurring is a pre-processing task used in the removal of a small amount
    of information from the input image. Blurring can also be used for noise reduction
    from an image.


    Smoothing filters are of the following two types:


    +   - Linear smoothing filter (mean filter)

    +   - Non-linear smoothing filter (order statistics filter)


    # Linear smoothing filter (mean filter)


    Linear smoothing filter or mean filter is the average or mean of the pixels enclosed
    in the filter mask’s neighborhood. These filters are also known as low-pass averaging
    filters. These filters work by replacing every pixel’s value of the input image
    with the intensity levels in the filter mask’s defined neighborhood.


    Mean filters are of two types as follows:


    +   - Box filter or an averaging filter: In the box filter, all coefficients of
    the filter are the same. Figure 4.12 shows a box filter:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '| 1 | 1 | 1 |

    | 1 | 1 | 1 |

    | 1 | 1 | 1 |


    Figure 4.12: Box or average filter


    +   - Weighted average filter: In the weighted average filter, the coefficients
    of the filter are different. The value of the center pixel is higher than the
    remaining values of the coefficients:


    | 1 | 2 | 1 |

    | 2 | 4 | 2 |

    | 1 | 2 | 1 |


    Figure 4.13: Weighted average filter


    # Non-linear smoothing filter (order statistics filter)


    An order statistics filter works on the principle of ordering the pixels enclosed
    in the area of the input image masked by the filter. Then, the value of the center
    pixel is replaced by the pixel value calculated by the result of the ranking.


    Non-linear smoothing filters are classified as follows:


    +   - Min filter: This filter is also known as the minimum filter, as in this,
    the value of the center pixel is replaced by the minimum pixel value present in
    the filter window.


    +   - Max filter: This filter is also known as the maximum filter, as the value
    of the center pixel is replaced by the maximum pixel value present in the filter
    window.


    +   - Median filter: It is the best filter in the category of the non-linear smoothing
    filter. It replaces the neighborhood of the pixel with the median of the intensity
    values after sorting the pixel values.'
