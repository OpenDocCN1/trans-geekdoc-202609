    # # Fully connected layer


    Fully connected layer, also known as FC layer, is an important component of CNN.
    FC layer drives the final output of the classification. It takes input in the
    form of pooled feature maps. It flattens the output from the previous layers and
    converts it into a single vector of different values, where each value represents
    the feature of the particular label.


    For example, if the input image shows cat, then the features representing the
    fur or whiskers have high values of the probabilities.


    Consider three pooled feature maps as shown in figure 4.93:


