    processing, video generation, semantic segmentation, and so on, and achieved significant
    success in the respective area. GANs showed amazing results in computer vision,
    such as plausible image generation, facial attribute manipulations, image-to-image
    translations, and so on.


    # ## Structure


    In this chapter, we will cover the following topics:


    +   - Introduction to GAN

    +   - Basics of generative models

    +   - Generative adversarial networks

    +   - Understanding probability distributions

    +   - Mathematical generalization of GAN'
