  md: '# About the Authors


    +   Dr. Neeraj Kumar (SMIEEE) (2019, 2020, 2021 highly-cited researcher from WoS)
    is working as a Dean DCT and Full-time professor in the Department of Computer
    Science and Engineering, Thapar Institute of Engineering and Technology (Deemed
    to be University), Patiala (Pb.), India. He is also an adjunct professor at various
    organizations in India and abroad. He has published more than 600 technical research
    papers (DBLP Link) in top-cited journals and conferences which are cited more
    than 40,000 times from well-known researchers across the globe with a current
    h-index of 110 (Google Scholar Link). He was named a highly cited researcher in
    2019, 2020, and 2021 in the Web of Science (WoS) list. He has guided many research
    scholars leading to Ph.D. (16) and M.E. / M.Tech (24). His research is funded
    by various competitive agencies across the globe. His broad research areas are
    Green computing and Network management, IoT, Big Data Analytics, Deep learning,
    and cyber-security.


    +   Dr. Rajkumar Tekchandani (B.Tech, M.Tech, Ph.D, CSE) is working as an Assistant
    Professor in the Department of Computer Science and Engineering, Thapar Institute
    of Engineering and Technology (Deemed to be University), Patiala (Pb.), India.
    He has previously worked in the Department of Computer Science and Engineering
    at Dr. B.R Ambedkar National Institute of Technology, Jalandhar, Punjab. He has
    fourteen years of academic experience in Computer Science and Engineering. He
    has published numerous technical research papers in top-cited journals and conferences
    with a current h-index of 12. He is supervising research scholars leading to Ph.D.
    and guided M.E. / M.Tech (18). His broad research areas are Deep Learning, Machine
    Learning, Cognitive Science, Natural Language Processing, and Software Code Clone
    Detection.'
