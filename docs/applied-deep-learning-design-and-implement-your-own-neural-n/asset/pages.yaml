- pgno: 42
  md: '# Recommendation systems


    Another type of problem that can be addressed is a recommendation system, or even
    called as a recommendation engine. These systems are kind of data filtering systems,
    and they make recommendations for different types of applications, such as books,
    products, articles, restaurants, music, movies, and so on. In recommendation systems,
    two common methods are collaborative and content-based filtering.


    The use of recommendation systems can be easily seen on Amazon and Netflix. Netflix
    makes recommendation systems to keep its viewers busy and intends to have plenty
    of content to see. So, in order to keep their users watching Netflix, they provide
    these types of recommendations such as Top Picks for Alex, Because you watched
    ..., and Suggestions for you.


    Amazon also does the same thing in order to increase its sales by up-selling,
    maintaining sales by user engagement, and so on. They provide recommendations
    such as Related to items you viewed, Customers who bought this item also bought,
    and More items to consider.


    # Anomaly detection


    Another type of problem is anomaly detection. We think that data coming from a
    particular source is sensible and well-behaved, but actually, this is not the
    case in most of the cases. Sometimes, there exists irrelevant data because of
    errors or faults in the measurement and also because of fraud. Sometimes, it can
    be due to the measurements that are anomalous and revealing the deteriorating
    piece of electronics or hardware.


    Anomalies can even denote the real problems sometimes and cannot be easily described.
    For example, consider a defect in manufacturing. In such type of cases, the detection
    of anomalies offers a degree of control of quality and also the perception that
    whether the steps taken to minimize the defects have actually worked or not. In
    both cases, there are possible cases when it can be helpful to determine the values
    of the anomaly, and specific machine learning algorithms can be applied carefully
    in such cases.


    # Machine learning techniques


    The machine learning techniques are divided into two broad learning techniques,
    namely, deep learning and shallow learning, and further classification of the
    two techniques of machine learning is shown in figure 1.14:'
