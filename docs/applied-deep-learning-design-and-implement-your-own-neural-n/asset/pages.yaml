    Now, we know that \(a_i\) is a pre-activation function given as follows:


    $$

    a_i = WS(i-1) + b

    $$


    And is the representation after applying the non-linearity activation function,
    which can be given as follows:


    $$

    S_i = \sigma(a_i)

    $$


    Now, using the chain rule of differentiation we can write \(\frac{\partial S(i)}{\partial
    S(i-1)}\) as follows:


    $$

    \frac{\partial S(i)}{\partial S(i-1)} = \frac{\partial S(i)}{\partial (a_i)} \frac{\partial
    (a_i)}{\partial S(i-1)} \quad (6.17)

    $$


    Now, let us expand \(a_i\) and \(S_i\) we get the following:


    $$

    a_i = [a_{i1}, a_{i2}, a_{i3}, ..... ....... a_{id}]

    $$


    $$

    S_i = [\sigma(a_{i1}), \sigma(a_{i2}), \sigma(a_{i3}) ..... .... \sigma(a_{id})]

    $$


    Where \(a_i\) is a d-dimension vector and S is the non-linear activation applied
    to the \(a_i\).


    Now, as we are interested in finding


    $$

    \frac{\partial S(i)}{\partial S(i-1)} = \frac{\partial S(i)}{\partial (a_i)} \frac{\partial
