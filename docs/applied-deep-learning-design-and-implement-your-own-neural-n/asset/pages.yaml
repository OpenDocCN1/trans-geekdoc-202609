    # # Introduction to neuron


    The neuron is the main functional block of the nervous system. Also known as a
    biological neuron, it is a nerve cell used in the transmission of data or information
    through the body cells. These nerve cells are responsible for the communication
    of information or data in both chemical and electrical forms.


    ![](img/7e519fee1b702b91799cdf1664598392_137_0.png)


    Figure 3.1: Biological neuron


    A typical biological neuron is shown in figure 3.1. To understand the artificial
    neural network, one should understand the working of the biological neuron. A
    biological neuron consists of a cell body with a nucleus inside.'
