    model is trained for 20 epochs, and it took around 90 minutes to train the model.
    The learning rate is set to a small value in order to have better learning. Beta1
    is a hyperparameter for the Adam optimizer, which computes the moving average
    of the gradient, and beta1 controls the decay rates of these moving averages.
    These parameters are described in the DCGAN paper in much detail. The last parameter
    ngpu tells if GPU is available or not. If this number is greater than zero, then
    the code will run on GPUs; otherwise, it will run on the CPU.


