    Similarly, the RGB color images in a computer are represented with three different
    grayscale image matrices indicating one for each, “Red”, “Green”, and “Blue”.


    # Spatial filtering


    Spatial filtering is a technique used in image processing to change the pixel
    intensity according to the neighborhood intensities. By using the process of spatial
    filtering, an input image is convoluted by using a Filter F having dimensions
    (x, y), where x is the height of the filter and y is the width of the filter.
    The mathematical equation (4.1) to find out the convolution of the input image
    I(i, j) is given as follows:


    ```

    I''(i, j) = I(i, j) * F(x, y)  (4.1)

    ```


    To understand spatial filtering, we need to understand two very important concepts
    about image processing, that is, correlation and convolution. In the next sub-sections,
    we discuss these in detail.'
