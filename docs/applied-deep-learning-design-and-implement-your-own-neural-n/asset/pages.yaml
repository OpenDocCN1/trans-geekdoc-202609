  md: '# Divisive clustering algorithm [hierarchical]


    This clustering algorithm is also known as a top-down method. In this algorithm,
    there is no need to pre-specify the total number of clusters. This approach of
    clustering requires a technique to split a cluster that contains the complete
    data and continues by splitting the clusters in a recursive manner until the data
    has been split into a group of single clusters.


    Following are the steps for the divisive (top-down) algorithm:


    +   1. Start by taking all the data points in a single cluster.

    +   2. After every iteration, remove outsider data points from the specified (cohesive)
    cluster.

    +   3. Stop when the iteration reaches as a single cluster that cannot be further
    disintegrated.


    Figure 1.37 shows an example of a divisive clustering algorithm:


