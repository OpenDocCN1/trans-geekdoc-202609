  md: 'Now say \( y_{(t)} \) is the value we got after making the prediction, and
    \( Y(t) \) is the actual output value; the cross-entropy loss can be calculated
    as follows:


    \( E(t)[Y(t), y(t)] = -Y(t)log(y(t)) \) (6.11)

    \( E(t)[Y, y] = -\Sigma Y(t)log(y(t)) \) (6.12)


    So, we have to calculate this loss for all the input time stamps and then add
    them to find the total loss. Here, the weights are the same for each timestamp.
    Let us brief out the steps to be followed for backpropagation in RNN:


    ![](img/7e519fee1b702b91799cdf1664598392_474_0.png)


    Figure 6.69: Recurrent neural network (many-to-many)


    ![](img/7e519fee1b702b91799cdf1664598392_474_1.png)


    Figure 6.70: Backpropagation in time (BPTT)


    +   1. First, cross-entropy loss (error) is calculated by using the predicted
    and actual output values.


    +   2. The network must be rolled for every timestamp.'
