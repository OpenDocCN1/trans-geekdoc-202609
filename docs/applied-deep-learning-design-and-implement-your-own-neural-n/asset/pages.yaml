    # Deep stacking


    Convolutional layers can be repeated several times, and the output of the previous
    layer acts as input to the next layer, as shown in figure 4.151:


    ![](img/7e519fee1b702b91799cdf1664598392_323_1.png)


    Figure 4.151: Deep stacking of convolutional layers'
