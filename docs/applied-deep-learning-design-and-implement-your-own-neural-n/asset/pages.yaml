    # Objectives


    By the end of this chapter, the reader will be able to understand the working
    of GAN and its architecture. You will understand the working of a generator and
    discriminator for classification between real and fake images. Furthermore, you
    will be able to understand how GAN is trained on a dataset and what is the role
    of backpropagation during the training phase. Moreover, you can comprehend the
    concepts of probability distribution and loss functions in GAN. Finally, various
    types of GANs are discussed for more understanding to the reader, along with their
    application in various fields.


    # Introduction to GAN


    The credit for GAN goes to Ian Goodfellow and his fellow researchers at the University
    of Montreal in the year 2014. GANs are a deep learning technique for generating
    fairly realistic synthetic samples that appear to be different and indistinguishable
    from real samples, although as real as the original. In a sense, GANs can be considered
    robotic artists, generating impressive outputs or, we can even say, generating
    art. GANs are the techniques that are used for both semi-supervised and unsupervised
    learning.


    To understand the working of GANs intuitively, consider an example of a forger
    and an art dealer. The forger is the one who tries to create a fake painting by
    any famous artist, for example, Picasso. Initially, the forger is not as efficient
    in making a fake painting, so he tries to merge and mixes some of his own fake
    work with authentic Picasso’s work and shows it to an art dealer. After an assessment,
    the art dealer immediately recognizes it as fake and gives it back to the forger.
    The forger then tries to improve his art and learns to make a more convincing
    fake painting, which the art dealer may again reject as he is an expert in his
    work. Now, as time goes by, the forger becomes competent enough at imitating the
    style of Picasso and generating better paintings. On the other hand, the art dealer
    becomes an expert in spotting fakes. In this competing situation, the forger reaches
    such expertise that it can generate excellent fake Picasso paintings that can
    even confuse the art dealer.'
