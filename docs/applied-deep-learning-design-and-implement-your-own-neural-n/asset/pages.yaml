    # # Activation function


    An activation function is a function that decides if a node or neuron has to be
    activated or not by determining the weighted sum. The aim of the activation function
    is the initiation of the non-linear property into the output of the node or neuron.


    A neural network without any activation function is actually considered as only
    a regression model having linearity property.


    The activation function makes the backpropagation (which plays an important role
    in a neural network) possible because the gradients are provided with the errors
    to update the biases and weights.


    # # Need for non-linear activation functions


    A neural network with no activation function is only a basic linear model of regression.
    It is the activation function that performs the transformation (non-linear)'
  merge: -1
  img_proc: true
