  md: 'Now, here is the final derivative of S4, that is, \(\frac{\partial S4}{\partial
    W}\) can be divided into two parts shown as follows:


    **Explicit derivative**: While calculating the explicit derivative of \(\frac{\partial
    S4}{\partial W}\), we can take all the other inputs as constant.


    **Implicit derivative**: In this part, we sum all the indirect paths which are
    joining S4 to W.


    So, we can write the preceding total derivative as the sum of the explicit and
    implicit derivatives as follows:


    \(\frac{\partial S4}{\partial W} = \frac{\partial^* S4}{\partial W} + \frac{\partial
    S4}{\partial S3} \frac{\partial S3}{\partial W}\)


    where \(\frac{\partial^* S4}{\partial W}\) is the explicit derivative and \(\frac{\partial
    S4}{\partial S3} \frac{\partial S3}{\partial W}\) is the implicit derivative.
    And * sign in explicit derivative indicates that we are taking the derivative
    concerning W only and taking all other parameters constant.


    So, now we have


    \(\frac{\partial S4}{\partial W} = \frac{\partial^* S4}{\partial W} + \frac{\partial
    S4}{\partial S3} \frac{\partial S3}{\partial W}\)


