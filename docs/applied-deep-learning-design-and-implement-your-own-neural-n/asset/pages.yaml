  md: '# Parametric ReLU activation function


    Parametric ReLU (PReLU) is another type of leaky ReLU activation function which,
    instead of having a predefined slope as 0.01, adjusts it by a parameter of the
    neural network: \(\alpha x, x < 0\). Figure 3.45 depicts the plot of the Parametric
    ReLU activation function:


    ```

    \( f(x) = \begin{cases} \alpha x, x < 0 \\ x, x \ge 0 \end{cases} \) (3.74)


    \( f''(x) = \begin{cases} \alpha, x < 0 \\ 1, x \ge 0 \end{cases} \)

    ```


    ![](img/7e519fee1b702b91799cdf1664598392_206_0.png)


    **Figure 3.45:** Parametric ReLU activation function


    # Exponential ReLU activation function


    Similar to leaky ReLU, exponential ReLU has a small slope for negative values.
    Figure 3.46 shows the plot of the exponential ReLU activation function:


    ```

    \( f(x) = \begin{cases} \alpha(e^x - 1), \\ \quad \text{for } x < 0 \\ x \text{
    for } x > 0 \end{cases} \) (3.75)


    \( f''(x) = \begin{cases} f(x) + \alpha, \\ \quad \text{for } x < 0 \\ 1, x \ge
    0 \end{cases} \)

    ```'
