  md: 'considered activation function, as \(\frac{\partial L}{\partial w}\) directly
    depends on the difference between the predicted and actual \((a_i - y_i)\) values
    and our main objective is to reduce this, to have the best fit.


    The following formula shows the gradient descent algorithm for updating the weight
    factor to achieve local/global minima.


    \(w'' = w - \eta * \frac{\partial L}{\partial w}\)


    By substituting \(\frac{\partial L}{\partial w}\) in the preceding equation, we
    get the updated weights. \(\frac{\partial L}{\partial w}\) represents the slope
    of the gradient descent, and \(\eta\) denotes the learning rate. The dimension
    of \(\frac{\partial L}{\partial w} = \frac{1}{N} \sum_i x_i * (a_i - y_i)\) (equation
    (3.34)) equals to \(D \times K\) as follows:


    \(\frac{\partial L}{\partial w} = [((x_{N \times D})(a_i - y_i)_{N \times K})]\)

    \(\frac{\partial L}{\partial w} = [((x_{D \times N}^T)(a_i - y_i)_{N \times K})]\)

    \(\frac{\partial L}{\partial w} = \left( \frac{\partial L}{\partial w_{D \times
    K}} \right)\)


    Cross-entropy function works best for the neurons having the sigmoid activation
    function. Moreover, the larger the error, the faster the neuron learns as \(\frac{\partial
    L}{\partial w} \propto (a[predicted] - y[actual])\). It is free from activation
    functions or their derivative \(\delta''(z)\).


