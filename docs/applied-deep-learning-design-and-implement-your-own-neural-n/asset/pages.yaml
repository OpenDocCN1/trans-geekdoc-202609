- pgno: 353
  md: 'Figure 4.193 shows the basic structure of an inception block having four parallel
    paths. The convolution layers of window sizes of 1*1, 3*3, and 5*5 are used in
    the inception block. Two middle paths use 1*1 convolution followed by 3*3 and
    5*5 to reduce the size of input channels (depth) before passing it to the next
    convolution layer. So, at the right side (fourth path) of the inception module,
    3*3 max pooling is used with a stride of two. When we do max pooling, then depth
    does not get affected. In this inception module, we do pooling in such a way that
    the size of the input image remains the same. For getting the same size, we have
    to do padding such that the input image size will remain the same. For example,
    say my feature size from the previous layer is 12*12*480. Then, after applying
    max pooling with stride two, it gets reduced to, say, 6*6*480. So, to make it
    as 12*12*480 after applying max pooling, we have to do padding of two on all the
    sides. Furthermore, we have to apply 48 filters of size 1*1*480 so that we get
    the same output as 12*12*48 through the fourth path. So, the size of all the outputs
    from each and every path of the inception module is the same as 12*12*48, which
    are to be concatenated finally to get aggregated feature maps as shown in figure
    4.193:


    # GoogleNet


    GoogleNet is another type of CNN architecture that uses a stack of nine inception
    modules, and finally, average pooling is done to predict the output. The use of
    max pooling initially before the inception module reduces the dimension size of
    the input image by a significant amount. The initial part of the GoogleNet is
    similar to AlexNet, and the stack of the multiple blocks is taken from the VGGNet.


    In the architecture of GoogLeNet, as shown in figure 4.194, initially, we perform
    normal convolution to reduce the size of the input image by applying certain convolutions.
    As if we apply the inception module directly to the image, after applying 1*1
    convolutions, we get a lot of feature maps, and that leads to a lot of computations
    and parameters.


    **Role of side branches in GoogLeNet:** In figure 4.195, some side branches have
    evolved in the fourth and seventh inception modules. What is the role of these
    side branches? When we are concatenating **inception modules (IM)** in between,
    we are getting some features. With side branches, we take in between features
    and do some type of classification and check whether these features are worthy
    or not for the final classification. It is a type of regularization. We are regularizing
    our network and saying that not only do the final features have to be good, but
    whatever we are getting here with the side branches also has to do something related
    to my final classification. There also has to be some kind of understanding of
    what our classification problem'
