    # AlexNet


    LeNet-5 was proposed by Alex Krizhevsky, Ilya Sutskever, and Geoffrey Hinton in
    2012. The goal of AlexNet-5 was to make the process of image classification more
    accurate.


    AlexNet architecture consists of five convolutional layers, three pooling layers,
    and two fully-connected layers. It is divided into two parts over two GPUs. As
    it is a heavy network, in order to enhance the processing of AlexNet, one part
    is handled by one GPU, and the second part is handled by the second GPU, as shown
    in figure. 4.171:


    ![](img/7e519fee1b702b91799cdf1664598392_333_0.png)


    Figure 4.171: AlexNet architecture. Source: Krizhevsky, Alex, Ilya Sutskever,
    and Geoffrey E. Hinton, “Imagenet classification with deep convolutional neural
    networks”, Advances in neural information processing systems, 2012


    Every convolutional network takes a very specific type of input. AlexNet takes
    the input image as 227 * 227 * 3. So, if your image is of the size, say, 1024
    * 1024 * 3,'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'then you have to resize your image using bilinear interpolation. But it may
    not be very useful as most of the resizing operations are lossy; that is, most
    of the image information can be lost. So, another way is to work over different
    parts of an image and then combine these features.


    Figure 4.172 shows the architecture of AlexNet:


    ![](img/7e519fee1b702b91799cdf1664598392_334_0.png)


    Figure 4.172: Simplified AlexNet architecture. “Source: Krizhevsky, Alex, Ilya
    Sutskever, and Geoffrey E. Hinton, “Imagenet classification with deep convolutional
    neural networks”, Advances in neural information processing systems, 2012”


    Table 4.3 shows the detailed architecture view of AlexNet. The output of the last
    fully-connected layer is fed to 1,000 SoftMax output neurons, which provide the
    class distribution over different 1,000 class labels. As we go down the network,
    we are applying more and more filters, i.e., we are asking more and more questions,
    but our spatial resolution keeps on decreasing due to convolution, stride, and
    pooling. At some point of time, we have to decide where we have to stop, and now
    we have to open it. In this way, in AlexNet architecture, we got a feature vector
    like 6*6*256, so these are the important features that we get. If we do a lot
    of aggregation, then useful information will be lost, and we will be left with
    only global information that may not be much useful for classification.


    So we want to go up to that limit where we feel that after this, if we go, then
    we will have a huge amount of losses, and it may not be a very suitable feature
    vector size to solve the classification problem. We can see that most of the weights
    in AlexNet are actually coming from fully connected layers; that is, (4096*4096)
    are the number of weights that exist between Fully Connected Layer 1 and Fully
    Connected Layer 2 in AlexNet as shown in figure 4.172. Moreover, we do not use
    much fully connected layers as weights become exponential.'
