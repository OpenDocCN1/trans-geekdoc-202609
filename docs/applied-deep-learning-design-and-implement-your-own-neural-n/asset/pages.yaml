    # Log-likelihood


    Consider the following mean square error function.


    \( L = \sum_{n=1}^{N} (target_n - prediction_n)^2 \)


    \( L = \Sigma_{n=1}^N(t_n - y_n)^2 \quad (3.5) \)


    where \( t_n \) represents the target value and \( y_n \) denotes the predicted
    value.


    Minimize the squared error is the same as to maximize the log-likelihood (MLE)
    when the error is Gaussian distributed. The random variable Gaussian distribution
    probability density function PDF is given as follows:


    \( t_n = \prod_{n=1}^N \frac{1}{\sqrt{2\pi\sigma^2}} exp(\frac{-1}{2\sigma^2}
    (t_n - y_n)^2) \quad (3.6) \)


    \( t_n \sim N(y_n, \sigma^2) \)


    Where \( y_n \) is mean and \( \sigma^2 \) is variance of Gaussian PDF. For MLE:


    \( y_n \sim f(x_n; w) \)


    and


    \( w = arg max(L) \)


    Relationship between log-likelihood equivalence and mean square error function'
