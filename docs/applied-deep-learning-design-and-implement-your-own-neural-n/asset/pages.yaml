- pgno: 514
  md: 'Now, in the process of backpropagation, if we follow the path from $h(t)$ to
    $h(t-1)$, as shown in *figure 7.10*:


    ![](img/7e519fee1b702b91799cdf1664598392_514_0.png)


    Figure 7.10: Path of backpropagation in LSTM


    Then, the backpropagation process here will already cover the Gradient $\frac{\partial
    E}{\partial h(t)}$ where $E$ is the cross-entropy loss error here. Therefore,
    we do not have to find out this part here, and hence, we need to find the gradients
    for $o(t)$ and $c(t)$, that is, $\nabla o(t)$ and $\nabla c(t)$.


    So, let us calculate $\nabla o(t)$ first,


    $\Delta o(t) = \frac{\partial E}{\partial o(t)}$


    Applying the chain rule, we get the following:


    $\Delta o(t) = \frac{\partial E}{\partial o(t)} = \frac{\partial E}{\partial h(t)}
    \times \frac{\partial h(t)}{\partial o(t)}$

    $\Delta o(t) = \frac{\partial E}{\partial o(t)} = \nabla h(t) \times tanh(c(t))$


    Thus,


    $\Delta o(t) = \nabla h(t) \times tanh(c(t))$


    Now, let us calculate $\nabla c(t)$,


    $\Delta c(t) = \frac{\partial E}{\partial c(t)}$


    Applying the chain rule, we get the following:


    $\Delta c(t) = \frac{\partial E}{\partial c(t)} = \frac{\partial E}{\partial H(t)}
    \times \frac{\partial H(t)}{\partial c(t)}$

    $\Delta c(t) = \frac{\partial E}{\partial c(t)} = \nabla h(t) \times o(t) \times
    (1 - tanh^2(c(t)))$


    Therefore,


    $\Delta c(t) = \nabla h(t) \times o(t) \times (1 - tanh^2(c(t)))$'
  merge: -1
