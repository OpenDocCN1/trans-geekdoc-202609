  md: '# Identity mapping


    Identity mapping ensures that the output of any multi-layer neural network is
    equal to its input. The neural network having identity mapping is also known as
    a replicator. Identity mapping simplifies the process of unsupervised learning,
    and also, the hidden layers of such a type of neural network can be used in data
    compression and detection of features.


    The identity mapping function is illustrated in figure 2.14:


    ![](img/7e519fee1b702b91799cdf1664598392_124_0.png)


