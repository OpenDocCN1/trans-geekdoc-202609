  md: '# Backward pass


    While in the backward pass, our purpose is to calculate the gradients for every
    input with respect to the final value of the output. The gradients are crucial
    while training the neural network by using gradient descent.


    Let us take an example where we are looking for the following value of gradients:


    \(\frac{\partial x}{\partial k}; \frac{\partial y}{\partial k}; \frac{\partial
    z}{\partial k}\)


    We first start the backward pass by determining the derivative of the final value
    of the output with respect to the final value of the output itself. Hence, it
    ends up as the identity derivation with the final value as one.


    \(\frac{\partial h}{\partial h} = 1\)


    So, the computational graph looks as follows:


    ![](img/7e519fee1b702b91799cdf1664598392_190_0.png)


    Figure 3.31: Computational graph for the backward pass


    Also, we perform the backward pass by using the * operator. Here, we computed
    the value of the gradients at q and z. Since h = q*z, we know that:


    \(\frac{\partial h}{\partial z} = q\)


    \(\frac{\partial h}{\partial q} = z\)'
