  md: '# Image classification


    The process of image classification refers to a computer vision task of extracting

    different object classes from an image:


    ![](img/7e519fee1b702b91799cdf1664598392_373_0.png)


    Figure 5.6: Image classification


    Figure 5.6 shows an example of image classification that detects the label of
    cat. But

    how this image classification is performed? To predict a label from an image,
    there

    is a specific image classification pipeline to be followed, which is given as
    follows:


    +   • **Input section**: The input section consists of a set of M images, where
    each

    +   image is labeled as a different L number of classes. This set is termed the

    +   training-set.


    +   • **Learning section**: This section is used to learn or train the model as
    to how

    +   each class looks like using the training dataset. This step is referred to
    as

    +   classifier-training.


    +   • **Evaluation section**: In this section, the evaluation of the model is
    performed

    +   by providing the model with a new set of images known as test-dataset and

    +   asking the classifier to predict the labels of different images.


    **Example 5.1**: Let us take an image of a cat and try to predict it. The model
    is trained

    with four labels, namely, mug, dog, cat, and mango, as we know that the computer

    sees an image as a 3-D array of pixels. In figure 5.6, the image is 220 pixels
    wide and

    300 pixels tall and is an RGB image in nature. So, the image has number of pixels.

    The trained model predicts the label of the image, as shown in figure 5.7:'
