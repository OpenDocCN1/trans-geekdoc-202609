- pgno: 224
  md: '2. **Hidden layer**: The output from the input layer is passed through the
    hidden layer. Depending upon the size of the data and model, there can be many
    layers. Every hidden layer may have a different number of features. The hidden
    layers execute computations on the weighted inputs and provide the net output,
    which is fed as an input to the next layer with activation functions to provide
    the actual output.


    3. **Output layer**: This is the last layer of a neural network that provides
    outputs corresponding to the given inputs. By using activation functions such
    as SoftMax, the output of each class is converted into a probability value. A
    neural network with a single hidden layer is shown in figure 4.4.


    ![](img/7e519fee1b702b91799cdf1664598392_224_0.png)


    Figure 4.4: Conventional neural network with a hidden layer (hi)


    We have already discussed traditional neural networks that are known as multi-layer
    perceptron in Chapter 3: Intuition of Neural Networks.


    # Drawbacks of traditional neural networks and emergence of CNN


    Traditional neural networks have many drawbacks, especially when we talk about
    image processing. These networks use one perceptron for each input which makes'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'them unsuitable for large weights. For example, we have an RGB image of pixel
    size (424*424). Then, 15,000 weights need to be updated, which becomes difficult
    and may result in overfitting. One more drawback of these neural networks is that
    when an image is fed into them, it results in the loss of spatial information.
    For example, if we consider an image of size (1024*1024), then the total number
    of pixels is 10,48,576. So, when we consider the input as 10,48,576, and we input
    these number of input values in a fully connected network, then the neural network
    becomes complex. If the number of neurons in the hidden layer is 1,000, then the
    number of weight parameters is 10,48,586 x 1,000 = 10485860000. Hence, it is difficult
    to handle this big number of parameters. Moreover, we know that when we consider
    images, we know that the pixel values (intensity) are highly correlated in an
    image. So, when we flatten the pixel values of an image, the spatial relationships
    get destroyed. That is when convolutional neural networks come into the picture.
    Convolution neural networks work on the basis of the neighborhood, as most of
    the useful information in the case of images in image processing lies in the neighborhood
    of the center pixel. We can understand this more by correlating it with the real-world
    scenario as follows.


    For example, say I want to get information about a student named Tarun in my third-year
    class of image processing at Thapar University. Now, I want to access information
    about him, such as how he is in image processing, whether he plays cricket, is
    he a good swimmer, and so on. Then, what is the best possible way to retrieve
    this information. Is it a good approach that I ask about Tarun to the entire Thapar
    University to get these answers? Will I get useful information about Tarun? Moreover,
    I get a vast amount of information that may not be useful to me and difficult
    to summarize. Then, what is the solution for this? Probably, I will ask these
    questions to classmates of Tarun as they are in the close neighborhood of Tarun
    and they know a lot about him, and they will return valid and confined answers
    to the questions asked. The same is the case when we are dealing with images.
    There exists a strong correlation among the pixel values that lie in the neighborhood
    of an image. So, most of the useful information about a pixel exists in the neighborhood
    as compared to the pixels that lie far away. Convolution neural networks deal
    with the convolutional filters that are correlated with the pixel values of the
    neighborhood.


    Another drawback of traditional neural networks is that these networks react differently
    with the input image and the shifted image of the input image. For example, if
    a car appears at the top of an image in one picture and at the bottom of an image
    in the other picture, the neural network corrects itself after every input and
    assumes that the car always appears at the bottom of the image. So, to overcome
    the aforementioned constraints and challenges, the need for CNN arises, which
    is discussed as follows.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'A CNN is a neural network having one or more convolutional layers. These are
    made of neurons having the capability to learn biases and weights. These are similar
    to **artificial neural networks (ANN)** but with a reduced number of parameters
    in the network. The main difference between ANN and CNN is that the CNNs take
    input as images and explore the neighborhood. CNN is mainly used for image processing,
    classification, segmentation, and also for other auto-correlated data.


    The advantage of CNN over a simple neural network is that the CNNs are easier
    to train and have a smaller number of parameters with an equal number of hidden
    layers.


    # CNN architecture


    CNN architecture is designed according to the connectivity configuration of neurons
    inside the human brain. A typical CNN architecture is shown in **figure 4.5**:


    ![](img/7e519fee1b702b91799cdf1664598392_226_0.png)


    Figure 4.5: Convolutional neural network


    # Layers of CNN


    The various layers of CNN shown in **figure 4.5** are as follows.


    +   - **Input layer:** This layer takes the input in the form of an image and
    passes it to the convolution layer. The input layer of the CNN takes an image
    as an input having dimensions: _(width * height * depth)_. Image is a representation
    of a matrix of pixel values. For example, if we have an RGB image of width = 48
    and height = 48, then the dimension of the input image is (48 * 48 * 3). Here,
    the depth of 3 represents the channels _R_, _G_, and _B_ of the image.


    +   - **Convolutional layer:** The main objective of the convolution layer is
    to extract the features of the input image. This layer creates a feature map to
    predict'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'the class of every feature by using a filter that scans the pixel values from
    left to right and then from top to bottom of the input image. Feature map is the
    output obtained by sliding the filter over the input image to compute the convolution
    operation. In figure 4.5, the second layer acts as a convolutional layer and consists
    of convolutional filters. If we correlate it as a neural network, then the first
    layer is the input layer (Input Image) and the second layer acts as a hidden layer
    (Convolution Layer 1). The neuron is just a filter that is embedded inside the
    weight parameters. The filter is just a question that is applied to the elements
    of an input layer. For example, it asks the question of each pixel of an image
    as to whether the pixel contains an edge element. The difference between a fully
    connected layer and a convolutional layer is that in the fully connected layer,
    each neuron is connected to each and every element of the input, and this neuron
    asks questions to each and every element of the input. In CNN, we are concerned
    about the images and pixel values in the images (intensity), which are highly
    correlated. The pixel values are not just random numbers. There exists a high
    spatial correlation between pixel elements. So, if we apply a fully connected
    layer on images, then first, we flatten this, and the filter embedded inside the
    weight parameters of the neuron asks the question to each and every input pixel,
    and the responses are collected. In these responses, most of the values are quite
    low or zero; only a few responses have high values of interest. Moreover, the
    flattening of input pixel values destroys spatial relationships among pixels up
    to a large extent. That is why to preserve spatial relationships and to retrieve
    only useful information, convolution layers are used in CNN. The process of convolution
    works in the neighborhood instead of the entire input. The hyperparameters associated
    with the convolutional network are the number of filters you want to apply and
    the size of each filter. The size of the filter is the number of parameters or
    weights associated. The size of the filter depends on what type of features we
    are looking for in our image. Sometimes, we need 3 × 3, 5 × 5, 7 × 7, and so on.
    Moreover, we can understand this by imagining we are in an airplane. When it just
    takes off from the runway, then only the airport and some ground staff are visible,
    that is, our local area, that is, 3 × 3 (covers local area). As we ascend, the
    upward view becomes more (global area). The same is the case with the size of
    the filters. It depends upon what we want to see. If we want to see just a local
    region of an image, then we need a 3 × 3 filter. Else, if we want to see a global
    region, then we apply 5 × 5, 7 × 7, or any other large-size filter. The difference
    between a fully connected layer and CNN is shown in figure 4.6:'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/7e519fee1b702b91799cdf1664598392_228_0.png)


    Figure 4.6: Differences between the fully connected layer and CNN layer


    +   **Pooling layer:** The pooling layer performs down-sampling. It extracts the
    information obtained from the convolutional layer and preserves the most important
    information required to make the prediction. The unnecessary information is not
    carried forward for further processing in the next layers. The hyperparameters
    associated with pooling are Window size and Window stride. Pooling is used to
    reduce the size, the feature, or activation maps. For example, a feature map obtained
    after convolution of the size 224 x 224 x 3 can be reduced to 112 x 112 x 3 after
    applying pooling with some window size and stride.


    +   **Fully connected layer:** This layer connects every node of one layer to
    every node of another layer. This layer applies the weights over the output generated
    from the pooling layer to predict the correct label. The main aim of the fully
    connected layer is to take pooled feature maps from the pooling layer and use
    those feature maps for the classification of the image to predict a label. The
    hyper-parameters associated with fully connected layers are the number of fully
    connected layers and the number of neurons in each and every fully connected layer.


    +   **Output layer:** This layer generates the final value to predict the class
    of an image.'
  merge: -1
