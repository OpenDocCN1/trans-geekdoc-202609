  md: 'Also, we already know the values of z and q from the forward pass. Therefore,
    we get the following:


    ```

    \frac{\partial h}{\partial z} = 3

    ```


    And


    ```

    \frac{\partial h}{\partial q} = 3

    ```


    Also, we compute the value of gradients at x and y, respectively, as follows:


    ```

    \frac{\partial h}{\partial x}; \frac{\partial h}{\partial y}

    ```


    Even though x and h are only two hops located away in the graph (figure 3.31).
    So to compute the values proficiently, we will use the differentiation chain rule.
    By applying the chain rule, we get as follows:


    ```

    \frac{\partial h}{\partial x} = \frac{\partial h}{\partial q} * \frac{\partial
    q}{\partial x}

    \frac{\partial h}{\partial y} = \frac{\partial h}{\partial q} * \frac{\partial
    q}{\partial q}

    ```


    But we know that the value of \frac{\partial h}{\partial y}=3, \frac{\partial
    q}{\partial x} and \frac{\partial q}{\partial y} are easy since q depends on x
    and y directly.


    ```

    q = x + y =>> \frac{\partial x}{\partial q} = 1, \frac{\partial y}{\partial q}
    = 1

    ```


    Therefore, we get the following:


    ```

    \frac{\partial h}{\partial k} = \frac{\partial h}{\partial q} * \frac{\partial
    q}{\partial x} = 3 * 1 = 3

    ```


    Also, for the input y:


    ```

    \frac{\partial h}{\partial y} = \frac{\partial h}{\partial q} * \frac{\partial
    q}{\partial y} = 3 * 1 = 3

    ```


