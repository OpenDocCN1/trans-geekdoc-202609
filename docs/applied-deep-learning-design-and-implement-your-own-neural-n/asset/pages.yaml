  md: '# Artificial intelligence


    In computer science, artificial intelligence is also called machine intelligence.
    It is the intelligence demonstrated by machines, such as humans display natural
    intelligence. AI includes the process of reasoning, self-correction, and learning.
    It can be classified as either strong or weak. Strong AI is also termed artificial
    general intelligence and is basically an AI system that consists of comprehensive
    human cognitive capabilities. This type of AI system can find a solution without
    the use of human involvement, even when given with an unfamiliar task. Moreover,
    weak AI, known as narrow AI, is an AI system that is trained and intended for
    a specific task.


    For example, Siri (Apple’s virtual personal assistant) is considered as a weak
    AI. Figure 1.11 represents an image of AI:


    ![](img/7e519fee1b702b91799cdf1664598392_39_0.png)


    # Machine learning and its goals


    Machine learning can be defined as the scientific study of statistical models
    and algorithms, which computer systems use to execute an explicit task without
    using categorical instructions. Thus, it depends upon the inference and patterns
    instead. It can be observed as a subset of artificial intelligence (AI). A good
    generalization ability is the main objective of machine learning algorithms.


    The following are the goals of machine learning algorithms:


    +   - Regression

    +   - Binary and multi-class classification'
  merge: -1
  img_proc: true
