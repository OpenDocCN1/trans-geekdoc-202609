    # Concept of stride in CNN


    While performing the convolution operation, the filter is moved across the input
    image from top-to-bottom, left-to-right, with a pre-defined column change on the
    horizontal movement, followed by a predefined row change in the vertical movement.


    The predefined amount of movement, the filter possesses the input image and is
    known as the stride. The default stride in two dimensions is (1,1) for horizontal
    and vertical movement. However, we can change the stride size accordingly. The
    size of the stride directly links with the size of the resultant feature map:


    ![](img/7e519fee1b702b91799cdf1664598392_261_1.png)


    Figure 4.46: Convolution with a stride of 1 (one)'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'For example, we have an input image of size 6*6; when we apply stride of (1,1)
    and perform the convolution operation with the filter of size 3*3, the resultant
    matrix is of size 4*4 as shown in figure 4.46:


    ![](img/7e519fee1b702b91799cdf1664598392_262_0.png)


    Figure 4.47: Convolution with a stride of two


    Also, when we apply a stride of (2, 2) on a 7*7 input image, the resulting matrix
    is of size 3*3, as shown in figure 4.47. In 2D convolution, the output size of
    a convolution operation is given as follows:


    ```

    Output_{Size} = \frac{N - F}{Stride} + 1

    ```


    where N is the size of the input image, and F is the filter size.


    **Example 4.7:** Suppose we have the following image pixel matrix of size (7 *
    7) as shown in figure 4.48:


    ![](img/7e519fee1b702b91799cdf1664598392_262_1.png)


