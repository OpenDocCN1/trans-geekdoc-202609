  md: '# Matrix representation of an image


    Almost every digital image has its own matrix. In a computer, a digital image
    is represented as a pixel matrix. In a digital grayscale image, each pixel is
    represented by an integer ranging from {0, 1, 2, ...... 255}, that is, f(x,y)
    = z, where (x,y) is the spatial location and z is the corresponding intensity
