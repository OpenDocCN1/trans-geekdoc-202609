  md: '# Loss function and optimizer


    As highlighted by the DCGAN paper, the Binary cross-entropy loss function and

    Adam optimizer are used.


    ```

    # Initialize BCELoss function

    loss_function = nn.BCELoss()


    # Create batch of latent vectors that we will use to visuali

    ze

    # the progression of the generator

    fixed_noise = torch.randn(64, latent_vec, 1, 1, device=devic

    e)


    # Establish convention for real and fake labels during train

    ing

    real_label = 1

    fake_label = 0

    ```


    # Training of GAN


    After defining the complete frame for GAN, the next step is the training of the
    model.

    GAN training basically consists of two parts: the first is training the discriminator,

    and the second is training the generator. The model is trained on 10 and 20 epochs
    to

    see the effects of epochs on the learning of the GAN. In the training of discriminator,

    the aim is to maximize the objective function, and it is further a two-step process.

    In the first step, the discriminator is trained on a batch of real samples from
    the

    training set. In the forward pass, the loss, and in the backward pass, the gradient

    is accumulated. Similarly, in the second step, loss and gradient are accumulated,

    but this time for a batch of fake samples with the current generator. Now with
    the

    gradient accumulated from both batches, the Adam optimizer is called for updating

    the discriminator.


    In the training of the generator, the goal is to minimize the objective function
    in

    order to generate better fakes. The generator generates the new sample, which
    is

    given to the discriminator for classification as real or fake, or we can say that
    aim is

    to maximize log(D(G(z))). Based on the output, the optimizer is used to update
    the

    generator’s parameters.'
