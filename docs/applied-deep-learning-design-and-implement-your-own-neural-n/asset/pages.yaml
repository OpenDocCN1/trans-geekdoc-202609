- pgno: 24
  md: '# # Basics of Artificial Intelligence and Machine Learning


    # ## Introduction


    Artificial intelligence is the demonstration of intelligent processes by machines,
    especially computer systems similar to human intelligence. The process of artificial
    intelligence includes learning, reasoning, and self-correction. This chapter covers
    the basic concepts related to artificial intelligence, such as patterns, classification,
    and regression problems. In this chapter, we briefly describe the basic concept
    of machine learning algorithms along with their types, such as deep learning and
    shallow learning techniques.


    # ## Structure


    In this chapter, we will cover the following topics:


    +   - Patterns

    +   - Intra-class variability

    +   - Inter-class similarity

    +   - Pattern analysis tasks

    +   - Data and its types in machine learning'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - Machine learning feature set

    +   - Types of Regression

    +   - Classification

    +   - Clustering

    +   - Agglomerative clustering

    +   - Divisive clustering algorithms

    +   - Clustering applications

    +   - Hands-on session on AI and machine learning basics


    # Objectives


    After going through this chapter, you will be able to understand the basic concepts
    of machine learning and its types. You will understand the types of classification
    and regression problems. You will get a brief idea about clustering algorithms
    and will be able to perform clustering algorithms in R.


    # Patterns


    In the last few years, pattern analysis has been one of the emerging trends in
    the research community. A pattern can be termed as a type of theme of repeating
    events or elements of a set of objects. The elements repeat themselves in a manner
    which can be predictable. In the digital world, a pattern is almost everything.
    For example, the color of clothes, speech patterns, and so on. It can either be
    observed mathematically or physically by using some type of algorithm.


    A pattern can be a proven solution in a specified manner for a common problem.
    In 1979, Alexander quoted Each pattern is a three-part rule, which expresses a
    relation between a certain context, a problem, and a solution. According to the
    Gang of Four, a pattern can be summarized into four different parts: a context
    where the pattern can be useful, the issues which are addressed by the patterns,
    the forces used for forming a solution and the solution that resolves those forces.


    Example 1: Consider the following example and try to complete these patterns.


    +   - 1,2,3,4,5,6,...,24,25,26,27,28.

    +   - 1,3,5,7,9,11,...,25,27,29,31,33

    +   - 2,3,5,7,11,13,...,29,31,37,41,43

    +   - 1,4,9,16,25,36,...,121,144,169,196'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - 1,2,4,8,16,32,64,...,1024,2048,4096,8192

    +   - 1,1,2,3,5,8,13,...,55,89,144,233,377

    +   - 1,1,2,4,7,13,24,...,81,149,274,504,927

    +   - 3,5,12,24,41,63,..., 201,248,300,357,419

    +   - 2,7,12,17,22,27,32,...,42,47,52,57,62

    +   - 1,6,19,42,59,...,95,117,156,191,?


    As per the preceding example, it is easy to fill the patterns initially, but as
    we progress downwards, it becomes a little bit complex. So, the pattern is defined
    as any regularity or structure in data and pattern analysis is the automatic discovery
    of patterns in data.


    # Pattern representation


    In the field of computer science, a pattern is represented by using vector feature
    values. The feature is any distinct characteristic, quality, or aspect. Features
    can be numeric (for example, width and height) or symbolic. Suppose if there are
    d features of an object; then the combination of these d features can be represented
    as a column vector of dimension-d known as a feature vector. Space which is defined
    by the d-dimension feature vector, is called a feature space. Then, the objects
    are represented as some points in the feature space, and that representation is
    termed as a scatter plot. Figure 1.1 shows various pattern representations:


    ![](img/7e519fee1b702b91799cdf1664598392_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/7e519fee1b702b91799cdf1664598392_27_0.png)


    1(c)

    Figure 1.1 (a)-(c): Pattern representation, dimension space of vector, and different
    classes of patterns.


    Figure 1.1(a)—(c) represents the vector of size d, the dimension space of the
    vector and classes of patterns.


    # Analysis of patterns


    It is a phase of pattern recognition that uses the existing knowledge present
    in data to uncover patterns using techniques of data analysis. Pattern analysis
    deals with the detection of patterns of the data from the same source automatically,
    making predictions of the data coming from the source. The information coming
    from the source can be of any form, such as text, images, family trees, records
    of commercial transactions, and so on.


    The identification of the patterns from a finite data set has very distinctive
    and different challenges. So, in order to design an effective pattern analysis
    algorithm, one should consider three key features as follows.


    # Robustness


    The first challenge for designing an effective pattern analysis algorithm is the
    fact that when it comes to real-time applications, data can be demolished by noise
    because of the randomness of the wireless channel or by virtue of human errors.
    So, while designing the algorithm, it must be kept in mind that the algorithms
    must identify the approximate patterns and can handle noisy data smoothly such
    that it'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'should not affect the output of patterns or data analysis techniques. The algorithms
    that possess this property are considered robust.


    # Computational efficiency


    As the amount of data is increasing enormously day by day, the designed algorithm
    must be able to handle larger datasets due to the enormous increase in data with
    time. So, if the algorithm works well for small objects, it should also work well
    for large datasets. Basically, computationally efficient algorithms are those
    whose resources scale increases polynomially with an increase in the size of the
    data.


    # Statistical ability


    This property is the most basic property an algorithm should have, which states
    that the patterns that are identified by the algorithm are genuine and have an
    accidental relation with the data set attributes. We can define this property
    as if we apply the algorithm to the new data coming from the same source so that
    it should be able to identify a similar type of pattern. Thus, the output of the
    algorithm should be sensitive to the data source and not to the particular dataset.
    So, if the algorithm is sensitive only to a particular dataset, it can be termed
    as stable for short, and if the algorithm gives similar types of patterns from
    all the datasets coming from the same source, then such an algorithm can be termed
    as statistically stable.


    # Pattern classes


    A pattern class can be defined as a collection of similar types of objects that
    may not be identical. A class consists of exemplars, prototypes, paradigms, and
    learning / training samples. Figure 1.2 represents different types of class variabilities:


    ![](img/7e519fee1b702b91799cdf1664598392_28_0.png)


    Figure 1.2 (a): Low inter-class and high intra-class variability. (b) Low intra-class
    and high inter-class variability.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'There are the following two types of variability and one type of similarity
    in the pattern class:


    +   - Intra-class variability

    +   - Inter-class variability


    Machine learning algorithms have to deal with these variabilities and similarities.


    # Intra-class variability


    It refers to the deviations in the particular class score for a specific object
    which is not a part of the systematic difference. So, basically, it is within
    the class variability. It can be used to map different types of objects. If we
    talk about land covers, then bare soil, forests, and rocks can be mapped using
    intra-class variability. It is the variation that exists between all the samples
    of a particular class that are used to learn the machine.


    Intra-class variability uses a tool named as **feature space** which predicts
    the patterns according to their features by using spectral signatures. So, according
    to the specific requirement, an appropriate feature space can be chosen.


    # Inter-class variability


    Inter-class variability means the variability among the different types of classes
    in a dataset. It can be used in cases where one needs to separate different classes
    that exist in the dataset. Also, the accuracy of the classification of objects
    depends upon inter-class variability. *Figure 1.2(a)* represents the patterns
    having low inter-class and high intra-class variability, whereas *Figure 1.2(b)*
    represents the patterns having low intra-class and high inter-class variability.
    For an ideal clustering algorithm, the intra-class variability should be minimum,
    whereas inter-class variability should be maximum. This is an important criterion
    for getting classes of different patterns. In classification, there exists a labeled
    dataset, so inter and intra-class variability does not exist in supervised learning.
    The inter-class and intra-class variability is dependent on a distance metric.


    # Inter-class similarity


    In inter-class similarity, the data is similar, almost nearest to each other and
    belongs to the same cluster. The outcomes are calculated as the ratio of the total
    summation distance to the summation of all the distances within one cluster of
    the dataset. Inter-class similarity can be seen in *figure 1.3*:'
  merge: -1
  img_proc: true
- pgno: 30
  md: '| 0D | I1 |

    |---|---|

    | B8 | 2Z |


    Figure 1.3: Inter-class similarity


    If you observe I1, both I and 1 look similar, but they are actually different.
    Here, I represent an alphabet, and 1 represents a number. So, this shows the inter-class
    similarity. The interclass similarity shows the similarity with other classes.


    # Pattern analysis tasks


    When we discuss the importance of patterns in data, the main aim of pattern analysis
    is the frequent prediction of data features as the function of the values of the
    other features. So, it is expected that the tasks associated with pattern analysis
    isolate a common feature, that is, their prediction intention. The training data
    arrives as (X, Y), where X is the feature set called as vector and represented
    as X= { x''1, x''2,... x''n}. A function f" is required to predict the class label
    Y'' on the basis of feature set X''. Basically, there are three types of pattern
    analysis tasks namely supervised, semi-supervised, and unsupervised tasks. We
    will discuss all these types of tasks in detail.


    # Pattern classification—supervised tasks


    The supervised tasks are pattern analysis tasks where there is an incorporated
    label for each output. For such types of tasks, a pattern can be sought in the
    form of the following:


    ```

    f(x, y) = L(y, g(x))

    ```


    Where denotes the loss function and g is the prediction function. It gives the
    variation between the true value y and the output of the prediction function,
    so when the pattern is detected, it is expected that the loss is zero. Figure
    1.4 shows the process of classification using feature extraction:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/7e519fee1b702b91799cdf1664598392_31_0.png)


    # Figure 1.4: Pattern classification


    For example, if we take the label as Y = Wild Animals, that is, a class, then
    the feature set is X = {Canines, strips, carnivores}. If a particular object,
    say, Tiger has these features, then our prediction algorithm f predicts this object
    Tiger in Y. Figure 1.4 depicts the pattern classification process where X represents
    a feature vector.


    # Pattern clustering-unsupervised tasks


    Unsupervised tasks do not have labels on them. These types of tasks are only available
    as the training data and labels should be predicted for the use of test data.
    Basically, there are two methods used for unsupervised tasks named as cluster
    analysis and a principal component. Cluster analysis is a sub-branch of machine
    learning that groups the unlabeled or unclassified data.


    Cluster analysis is used for unsupervised tasks in the grouping of datasets with
    other attributes. Cluster analysis identifies the common identities in the data
    sample present and then further reacts on the basis of the absence or presence
    of such common entities from the new data coming from the same data source.


    # Semi-supervised tasks


    In semi-supervised tasks, the distinct label or feature is known partially. For
    example, consider a case of ranking where we only have relative ordering in the
    training set. But our objective is to provide the same ordering of the new data
    coming from the same source. For these types of issues, a value function is assumed,
    and suggestion for its value is made in the process of training data. So, new
    data from the same data source is assessed by using the output of the value function.


    In another type of situation, there can be a transduction case in which partial
    information is present regarding the labels. In such type of cases, only some
    data arrives with the incorporated label, so the task becomes to predict the label
    for the data that is not labeled. The main aim here is to have the combination
    of the querying cost and generalization error.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # Data and its types in Machine Learning


    Data can be defined as a set of values with respect to quantitative or qualitative
    variables. Nowadays, almost everything can be represented as data. Understanding
    the different data types is essential for machine learning models. From a machine-learning
    perspective, mostly the data can be divided into four basic types as follows:


    +   1. Numerical data

    +   2. Text data

    +   3. Time series data

    +   4. Categorical data


    Figure 1.5 shows different types of datasets used in machine learning:


    ![](img/7e519fee1b702b91799cdf1664598392_32_0.png)


    **Figure 1.5:** Types of data


    # ## Numerical data


    Numerical data is a type of data in which data points are numerical values. It
    can also be termed quantitative data. For example, the number of cars sold in
    the past month. Numerical data can be divided into discrete or continuous data.
    Discrete data is a set of distinct values, whereas continuous data is any value
    within a specified range. For example, a student’s score marks as 10, 20, 30,
    40, 50, and 60. Then, this is referred to as numeric data within the range of
    0 to 100.


    # ## Time series data


    Time series data can be defined as an order of the numbers collected at regular
    intervals of time. It has application in the case of finance. There is a temporal
    value attached to the time series. So, it can be something like a timestamp that
    comes as trends in time.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'For example, measuring the environmental sensor data after every month is a
    time-series data. The difference between numerical and time series data is that
    time series follow an implied ordering, whereas numeric data may consist of a
    bunch of values, but it does not have any ordering sequence.


    # # Text data


    Basically, words are text data. While using machine learning techniques, we convert
    the words into numbers by using appropriate functions such as word formulation
    function such as word2vec. For example, while reading this book, you are actually
    reading the text data.


    # # Categorical data


    Categorical data is a set of variables that consist of a large number of label
    values instead of numeric values. In categorical data, the total number of values
    is represented by a fixed set.


    Categorical variables can also be termed as nominals. For example:


    +   - A color variable contains the values: green, blue, and red

    +   - A pet variable contains the values: cat and dog

    +   - T-shirt size as S, M, L, and XL


    Figure 1.6 shows a bar graph of categorical data:


    ![](img/7e519fee1b702b91799cdf1664598392_33_0.png)


    Figure 1.6: Categorical data representation


    Figure 1.6 shows a bar graph of categorical data in which fruit classes are divided
    into five categories, such as apple, banana, and so on and the number of pieces
    is shown for each fruit. Here, each value represents a different category.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Issues with the categorical data


    Some machine learning algorithms work fine with categorical data. For example,
    the use of a decision tree algorithm, such as split theory based on information
    gain, is suitable for learning from the categorical data without performing any
    data transformation. However, many machine learning algorithms do not work on
    labeled data as they require all the input and output variables to be in the numeric
    state.


    This can be viewed as a constraint for clustering-based algorithms, so the categorical
    data have to be converted into numerical data. Also, if the output variable is
    categorical, then there is a need for converting the predictions into a categorical
    form so that it can be used for a particular type of application.


    Hence, now the question arises as to how to convert categorical data into numeric
    data.


    The conversion of the categorical data into numeric data can be done by using
    the following encoding techniques:


    +   - Integer encoding

    +   - One-hot encoding


    Both these techniques are explained as follows.


    # # Integer encoding


    Integer encoding is the first step for the conversion of categorical data into
    numeric data. Here, each unique object or class is assigned a value different
    from other classes. For example, we have three objects, namely, apples, banana,
    and orange. Table 1.1 shows an example of integer encoding:


    | Class | Number |

    |-------|--------|

    | Apple | 1      |

    | Banana| 2      |

    | Orange| 3      |


    Table 1.1: Integer encoding


    Integer encoding can be easily reversible as 1 → apple, 2 → banana and 3 → orange.


    The advantage of integer encoding is that the integer values have a numerically
    ordered relationship among themselves which machine learning algorithms can easily
    understand.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# One-hot encoding


    In machine learning, one hot encoding includes a collection of bits that represent
    the data using a unique 1-bit representation for a unique class (high/ON) and
    the rest of the bits having a value as 0 (low/OFF). It is used for multi-class
    classification. Apart from this, the representation of the data in which there
    is only a single 0 bit is present, and the rest of the bits are 1 is called as
    one-cold. Table 1.2 represents the one hot and binary representation of a number
    from 0 to 9:


    | Number | Binary representation | One-hot representation |

    |---|---|---|

    | 0 | 0000 | 0000000001 |

    | 1 | 0001 | 0000000010 |

    | 2 | 0010 | 0000000100 |

    | 3 | 0011 | 0000001000 |

    | 4 | 0100 | 0000010000 |

    | 5 | 0101 | 0000100000 |

    | 6 | 0110 | 0001000000 |

    | 7 | 0111 | 0010000000 |

    | 8 | 1000 | 0100000000 |

    | 9 | 1001 | 1000000000 |


    Table 1.2: Binary and one hot representation


    One-hot encoding is generally used to represent the different states of the state
    machine. Moreover, in binary or gray code, the decoder helps in determining the
    state of the machine. But in the case of the one-hot state machine, there is no
    need for the decoder.


    Table 1.3 represents the label encoding method in which the objects are divided
    categorically; for example, Apple is labeled into category 1:


    | Fruit name | Categorical | Calories |

    |---|---|---|

    | Apple | 1 | 95 |

    | Banana | 2 | 70 |

    | Orange | 3 | 65 |


    Table 1.3: Label encoding'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Table 1.4 represents one-hot encoding where each object has only a single 1-bit
    (high).


    | Apple | Banana | Orange | Calories |

    |---|---|---|---|

    | 1 | 0 | 0 | 95 |

    | 0 | 1 | 0 | 70 |

    | 0 | 0 | 1 | 65 |


    # # Machine learning feature set


    In pattern recognition and machine learning, a feature can be defined as a distinct
    computable characteristic or property of a phenomenon. Choosing effective, informative,
    and discriminative features are considered as an important role in classification,
    regression, and pattern recognition. Different types of features are discussed
    as follows.


    # ## Handcrafted features


    Handcrafted features refer to the derived properties for use in different algorithms
    in which the data is present in the image itself. For example, edges and corners
    are the two simple features which can be extracted from images. A simple edge
    detection algorithm such as Laplacian based on differentiation (rate of change)
    works by determining the regions in the image where the intensity of the image
    changes quickly.


    To understand it in simple language, we know that a usual image is nothing but
    a 2D matrix (or multiple matrices when there are multiple channels like RGB (**Red,
    Green, and Blue**). Figure 1.7 represents an image in gray-scale with intensity
    values from 0 to 255:


    ![](img/7e519fee1b702b91799cdf1664598392_36_0.png)


    **Figure 1.7: Gray-scale image**'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In the case of a gray-scale image (8-bit) (or a black and white image), the
    image is usually a matrix of two-dimension with pixel values ranging from 0 to
    255, where 255 denotes complete white and 0 denotes complete black and the range
    from 0 to 255 represents grey-scale image as shown in figure 1.7.


    # # Spatio temporal features


    Space-time features capture the distinctive shapes in a video. It provides a self-determined
    representation of events that occurred with time during different types of motion
    in a scene. Spatiotemporal features are generally extracted from the video directly
    and avoid the possible failures of pre-processing techniques such as tracking
    and motion segmentation.


