  md: "# # Discriminator network\n\n```\nclass Discriminator(nn.Module):\n    def\
    \ __init__(self, n_gpu):\n        super(Discriminator, self).__init__()\n    \
    \    self.n_gpu = n_gpu\n        self.main = nn.Sequential(\n        # input is\
    \ (n_channel) x 64 x 64\n        nn.Conv2d(n_channel, dis_fmap, 4, 2, 1, bias=False),\n\
    \        nn.LeakyReLU(0.2, inplace=True),\n        # state size. (dis_fmap) x\
    \ 32 x 32\n        nn.Conv2d(dis_fmap, dis_fmap*2, 4, 2, 1, bias=False),\n   \
    \     nn.BatchNorm2d(dis_fmap * 2),\n        nn.LeakyReLU(0.2, inplace=True),\n\
    \        # state size. (dis_fmap*2) x 16 x 16\n        nn.Conv2d(dis_fmap * 2,\
    \ dis_fmap * 4, 4, 2, 1, bias=\n        False),\n        nn.BatchNorm2d(dis_fmap*4),\n\
    \        nn.LeakyReLU(0.2, inplace=True),\n        # state size. (dis_fmap*4)\
    \ x 8 x 8\n        nn.Conv2d(dis_fmap * 4, dis_fmap * 8, 4, 2, 1, bias=\n    \
    \    False),\n        nn.BatchNorm2d(dis_fmap * 8),\n        nn.LeakyReLU(0.2,\
    \ inplace=True),\n        # state size. (dis_fmap*8) x 4 x 4\n        nn.Conv2d(dis_fmap\
    \ * 8, 1, 4, 1, 0, bias=False),\n        nn.Sigmoid()\n        )\n    def forward(self,\
    \ input):\n        return self.main(input)\n```\n\nThe discriminator is basically\
    \ a binary classification convolutional network, which classifies between _real(1)_\
    \ and _fake(0)_ images by taking images as input and giving a scalar probability,\
    \ that is, 0 or 1. As mentioned in the DCGAN paper, the discriminator consists\
    \ of a series of **Conv2d**, **leakyReLU**, and **BatchNorm2d** layers and, finally,\
    \ the sigmoid activation function to produce the final probability.\n\nAs done\
    \ in the case of the generator network, the discriminator is created, initialized\
    \ with the random values through the weight **init()** function, and finally,\
    \ printed to see the structure of the discriminator object."
