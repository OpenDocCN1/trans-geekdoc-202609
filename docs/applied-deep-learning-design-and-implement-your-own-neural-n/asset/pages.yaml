  md: 'In this chapter, we will discuss the learning of internal gated cells of LSTM
    using backpropagation with time. So, now let us take the LSTM cell for the process
    of backpropagation as follows:


    ![](img/7e519fee1b702b91799cdf1664598392_513_0.png)


    Figure 7.9: Back-propagation in LSTM Gated unit


    So, here, the backpropagation trains all these gates used in the gated unit of
    LSTM. Let us start with the block output h(t) first. In the forward pass, we calculated
    block output as follows:


    ```

    h_t = \gamma_o \odot \tanh c_t

