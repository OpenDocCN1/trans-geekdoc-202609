    # # Case studies of CNN


    The following are the case studies in the CNN, which are explained as follows:


    +   - LeNet-5

    +   - AlexNet

    +   - ZFNet

    +   - VGGNet

    +   - ResNet

    +   - GoogLeNet


    # ## LeNet-5


    LeNet-5 was proposed by Yann LeCun, Leon Bottou, Yoshua Bengio, and Patrick Haffner
    in 1998. It was the first CNN architecture. The goal of LeNet-5 was to recognize
    hand-written and machine-printed digits.'
