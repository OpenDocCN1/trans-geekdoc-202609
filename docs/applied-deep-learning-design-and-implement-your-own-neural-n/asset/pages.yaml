    From the two networks in the Siamese network, we get the output as $f(x(1))$ and
    $f(x(2))$. Therefore, the similarity distance between these two images can be
    given as follows:


    ```

    $d(x(1), x(2)) = f(x(1)) - f(x(2)) < t$

    ```


    So, here in the Siamese network, the parameter learning takes place such that
    if the two input pictures to a Siamese network are of the same person, then, $d(x(1),
    x(2))$ is within threshold value $t$.


