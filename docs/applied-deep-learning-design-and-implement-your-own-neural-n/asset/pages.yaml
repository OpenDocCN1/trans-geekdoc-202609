    # Fundamentals of gradient descent


    A gradient is a function having a vector value that represents the tangent''s
    slope of the plot of a function while pointing in the direction of the highest
    rate of increase for the function. In other words, it is the derivative that indicates
    the slope of the function.


    Consider a 3-D graph, as shown in figure 3.15, having a cost function. The main
    aim is to start from the right corner (topmost) of the mountain to the dark-blue
    sea, that is, toward the bottom of the mountain. The darts denote the route of
    steepest descent from any of the known points, that is, the direction that reduces
    the cost function as fast as possible.


    Initiating from the topmost of the mountain, we take the first movement downhill
    toward the direction indicated by the descent gradient. In the next step, we recalculate
    the steepest descent (while passing from the coordinates of our newest point)
    and take one more step in the direction specified by it. We continue this process
    repeatedly till we get to the desired location of the graph or to that point where
    we are no longer required to move downhill, that is, a local minimum point. Figure
    3.16 shows the process of gradient descent:'
