    # Agglomerative clustering algorithm [hierarchical]


    This clustering algorithm is also known as the bottom-up approach. The agglomerative
    clustering algorithm also does not require the number of clusters to be pre-specified.
    At first, the bottom-up algorithms consider the data set as a ton of single clusters
    at the outset and further agglomerates into pairs of clusters until all clusters
    have been combined into a single cluster that contains data of all the clusters.


    The following are the steps for the agglomerative (bottom-up) algorithm:


    +   1. Start by taking all the data points in their own cluster.

    +   2. Calculate Euclidean distance after each iteration and then combine two
    clusters having minimum distance.

    +   3. Stop when the iteration reaches a combined single cluster. Otherwise, repeat
    Step 2.'
