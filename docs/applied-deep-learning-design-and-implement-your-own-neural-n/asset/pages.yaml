- pgno: 230
  md: '# Correlation


    Correlation is the method of moving a filter or kernel over the spatial image
    to calculate the Sum of Products (SoP) at each location. It is the function of
    the displacement of the filter across the image. The process of correlation is
    shown in figure 4.8:


    ![](img/7e519fee1b702b91799cdf1664598392_230_0.png)


    Figure 4.8: Process of correlation in the spatial domain


    So, we can say that the first value of the correlation output relates to the zeroth
    (0th) displacement of the filter, as shown in figure 4.9:


    ![](img/7e519fee1b702b91799cdf1664598392_230_1.png)


    Figure 4.9: Zeroth displacement of the filter in 1-dimension.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'And the second correlation output value corresponds to the first displacement,
    as shown in figure 4.10, and so on:


    ![](img/7e519fee1b702b91799cdf1664598392_231_0.png)


    # Figure 4.10: First displacement of the filter in 1-dimension.


    Suppose we have an image $I$ and a kernel/filter $F$. Then, the mathematical representation
    of the cross-correlation for 1-D is given as follows.


    ```

    F.I(x) = \Sigma_{i=-N}^{N} F(i)I(x+i) \qquad (4.2)

    ```


    The cross-correlation in a 2D spatial image is very simple. Here, we first take
    a kernel of a specific size and locate the filter over a local region in the spatial
    domain of the image, and the size of the selected region is the same as that of
    the filter. This process is repeated by shifting the same filter over the entire
    region of the image.


    Similarly, the mathematical representation of the correlation for 2-D is given
    as follows:


    ```

    F.I(x,y) = \Sigma_{j=-N}^{N} \Sigma_{i=-N}^{N} F(i,j)I(x+i, y+j) \qquad (4.3)

    ```


    # Example 4.1: Suppose we have the 3*3 input image as follows:


    ```

    I(x, y) = \begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{bmatrix}

    ```


    The filter used is an average filter which is used to find the correlation of
    the input image.


    ```

    F = \begin{bmatrix} 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \end{bmatrix}

    ```'
