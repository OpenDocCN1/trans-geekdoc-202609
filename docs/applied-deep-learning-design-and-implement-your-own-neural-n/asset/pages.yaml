- pgno: 324
  md: 'The process is like conv-pool, conv-pool, and so on. It depends on us how deep
    we want to stack the layers. We have to decide where to stop and then aggregate
    the responses. Every time it is not possible that we apply filters, and so on.
    We have to aggregate the responses and do the voting. As shown in figure 4.151,
    the 4*4 responses are aggregated at last, where top left (1.00) is the response
    for the top left section of the figure showing X, top right (0.55) is the response
    for the top right section, bottom left (0.55) is the response for the bottom left
    section and bottom right (1.00) is the response for the bottom right section of
    the image X shown to convolutional network with respect to Filter 1. Similarly,
    for the remaining two filters, aggregated responses are generated (see figure
    4.151). In CNN, we cannot ask very specific questions (filters). If we ask very
    specific questions, then the CNN model becomes complicated, and if it becomes
    complicated, then it may cause overfitting of data. So generally, we ask very
    general questions such as left line, right line, and center element (filters)
    so that we get global information and our model does not get overfitted. Asking
    a question means applying filters, and these questions are built using the proposed
    objective function.


    # Fully connected layer in CNN


    After deep stacking, we get a considerable amount of aggregated features in the
    form of two-dimensional arrays (see figure 4.151). We can use the output of one
    convolutional layer for the input of the next convolutional layer, and we have
    intermediate categories called as hidden units in a neural network. We can stack
    as many layers together as we can, but in the end, they all end up with voting
    for X or O. Whosoever gets the most votes wins. So, for voting, we have to flatten
    these reduced set of two-dimensional features (figure 4.151) in a one-dimensional
    feature set as shown in figure 4.152:


    ![](img/7e519fee1b702b91799cdf1664598392_324_0.png)


    Figure 4.152: Flattened feature or activation maps as a one-dimensional array'
  merge: -1
  img_proc: true
