    \ results as flow charts like tree structure where the branch of the tree represents\
    \ the outcome, and the node represents the value of the attribute. The classes\
    \ are represented by the tree nodes.\n\nLet us take an example where we have to\
    \ classify a cat, sparrow, and bat based on their attributes. Figure 1.29 shows\
    \ the decision tree for our example:\n\n![](img/7e519fee1b702b91799cdf1664598392_60_0.png)\n\
    \n# ID3 algorithm\n\nThe main algorithm to build the decision tree is ID3. It\
    \ follows a greedy, top-down search approach through possible branches. It uses\
    \ entropy and information gain to build the decision tree.\n\n# Entropy\n\nEntropy\
    \ is defined as the measure of disorder, uncertainty, or impurity of a dataset.\
    \ It controls the decision of splitting the data. ID3 algorithm uses entropy to\
    \ determine the homogeneity of the sample. Mathematically, entropy can be represented\
    \ as follows:\n\n```\nE(S) = \\sum_{j=1}^n -P_j log_2 P_j\t(1.18)\n```\n\nwhere\
    \ P_j is the probability of class j in the dataset.\n\n# Information gain\n\n\
    Information gain is the measure of information given by the feature about the\
    \ class. It is used to construct the decision tree. The decision tree algorithm\
    \ maximizes"
