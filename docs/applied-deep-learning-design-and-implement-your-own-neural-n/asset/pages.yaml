    # Introduction to convolutional neural networks (CNN)


    A computer observes an input image as a collection of different pixel values.
    Depending upon the size and resolution of the input image, it sees an array of
    pixels, where 1 represents that the input image is black and white. For example,
    we have an RGB input image of size as shown in figure 4.1:


    ![](img/7e519fee1b702b91799cdf1664598392_222_0.png)


    Figure 4.1: Grayscale image


    To describe an image in image processing, we need the coordinate system. The coordinate
    system, which is used to relate elements with each other, is called the user space.
    Figure 4.2 shows a coordinate system used in the Spatial domain representation
    of an image:


    ![](img/7e519fee1b702b91799cdf1664598392_222_1.png)


    Figure 4.2: Spatial domain coordinate system'
