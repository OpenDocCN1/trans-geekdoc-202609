    gradient router, and the **MUL** gate acts as gradient switcher.


    The output of reverse pass differentiation of the sigmoid gate in *figure 3.37*
    is computed as follows. Starting from the R.H.S of *figure 3.37*, we computed
    the UGs and LGs as follows:


