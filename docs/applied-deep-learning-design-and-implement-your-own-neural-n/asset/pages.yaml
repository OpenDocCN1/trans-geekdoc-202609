    ![](img/7e519fee1b702b91799cdf1664598392_223_0.png)


    ![](img/7e519fee1b702b91799cdf1664598392_223_1.png)


    **Figure 4.3** (a): Original image.


    **Figure 4.3** (b): Input in the spatial domain.


    **Figure 4.3** (c): Binary representation in spatial domain representation of
    figure 4.3 (b).


    Neural networks generally consist of the following three layers:


    +   1. **Input layer**: It is the first layer of a neural network. It takes the
    input to the model. The total number of neurons in this layer is the same as the
    total number of features in the input data. Taking an image as an input, the total
    number of neurons is equal to the total number of pixels that represent an image.'
