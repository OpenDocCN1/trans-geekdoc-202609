    So, the dimensions of the following:


    \( y = [((x_{N \times D})(w_{D \times M}) + b_{N \times M}) \cdot v_{M \times
    K}] + c_{N \times K} \)

    \( y = [(k_{N \times M} + b_{N \times M}) \cdot v_{M \times K}] + c_{N \times
    K} \)

    \( y = [(k''_{N \times M}) \cdot v_{M \times K}] + c_{N \times K} \)

    \( y = [k''''_{N \times K}] + c_{N \times K} \)

    \( y = k''''''_{N \times K} \)


    Where \( k \) denotes the size of the output vector or a number of classes for
    the prediction of samples:


    \( p(y = 1|x) \)


    The values of the feature set \( x \) as \( x_1 \) (having technical degree),
    and \( x_2 \) (number of hours spent each day) for the first student is as follows:


    \( x = \begin{bmatrix} x_1 \\ x_2 \end{bmatrix} = \begin{bmatrix} 0 \\ 3.5 \end{bmatrix}
    \)

    \( z_1 = \tanh(\sum_{i=1}^{2} w_{i1} x_i + b_1) \)

    \( z_1 = \tanh(w_{11}x_1 + w_{21}x_2 + b_1) \)

    \( z_1 = \tanh(0.5 * 0 + 0.7 * 3.5 + 0.4) \)

    \( z_1 = 0.993 \)

    \( z_2 = \tanh(\sum_{i=1}^{2} w_{i2} x_i + b_2) \)

    \( z_2 = \tanh(w_{13}x_1 + w_{22}x_2 + b_1) \)

    \( z_2 = \tanh(0.1 * 0 + (-0.3) * 3.5 + 0.1) \)

    \( z_2 = -0.739 \)

    \( z_3 = \tanh(\sum_{i=1}^{2} w_{i3} x_i + b_3) \)

    \( z_3 = \tanh(w_{13}x_1 + w_{23}x_2 + b_3) \)

    \( z_3 = \tanh(-0.3 * 0 + 0.2 * 3.5 + 0) \)

    \( z_3 = 0.604 \)'
