  md: "# Weights initialization\n\nAccording to the model specifications given in\
    \ the paper, all the weights are randomly initialized from a normal distribution,\
    \ with a mean as 0 and a standard deviation as 0.2. These initial values are passed\
    \ through the weight init() function as input and later to all convolutional,\
    \ convolutional-transpose, and batch normalization layers.\n\n# Generator network\n\
    \nThe main function of the generator is to map the latent space vector into the\
    \ training data distribution. The structure of the generator is constructed as\
    \ specified in the DCGAN paper. A Generator class is made having init() and forward\
    \ function.\n\n```\n# custom weights initialization called on netG and netD\n\
    def weights_init(m):\n    classname = m.__class__.__name__\n    if classname.find('Conv')\
    \ != -1:\n        nn.init.normal_(m.weight.data, 0.0, 0.02)\n    elif classname.find('BatchNorm')\
    \ != -1:\n        nn.init.normal_(m.weight.data, 1.0, 0.02)\n        nn.init.constant_(m.bias.data,\
    \ 0)\n```\n\nThe init function is used to define all the layers of the generator\
    \ model, and the forward function is used to pass the input through all the defined\
    \ layers. There are five convolutional-transpose layers followed by a batch normalization\
    \ layer and a ReLU activation function. Finally, the output of the generator is\
    \ passed through tanh function. The application of the batch normalization function\
    \ after each convolution-transpose layer is the critical contribution of the DCGAN\
    \ paper:"
  merge: -1
  img_proc: true
- pgno: 603
  md: "```\n```python\n# Generator Code\nclass Generator(nn.Module):\n    def __init__(self,\
    \ n_gpu):\n        super(Generator, self).__init__()\n        self.n_gpu = n_gpu\n\
    \        self.main = nn.Sequential(\n            # input is Z, going into a convolution\n\
    \            nn.ConvTranspose2d( latent_vec, gen_fmap*8, 4, 1, 0, bias=False),\n\
    \            nn.BatchNorm2d(gen_fmap * 8),\n            nn.ReLU(True),\n     \
    \       # state size. (gen_fmap*8) x 4 x 4\n            nn.ConvTranspose2d(gen_fmap*8,\
    \ gen_fmap*4, 4, 2, 1, bias=False),\n            nn.BatchNorm2d(gen_fmap * 4),\n\
    \            nn.ReLU(True),\n            # state size. (gen_fmap*4) x 8 x 8\n\
    \            nn.ConvTranspose2d( gen_fmap,gen_fmap*4, 4, 2, 1, bias=False),\n\
    \            nn.BatchNorm2d(gen_fmap * 2),\n            nn.ReLU(True),\n     \
    \       # state size. (gen_fmap*2) x 16 x 16\n            nn.ConvTranspose2d(\
    \ gen_fmap*2, gen_fmap, 4, 2, 1, bias=False),\n            nn.BatchNorm2d(gen_fmap),\n\
    \            nn.ReLU(True),\n            # state size. (gen_fmap) x 32 x 32\n\
    \            nn.ConvTranspose2d( gen_fmap,n_channel, 4, 2, 1, bias=False),\n \
    \           nn.Tanh()\n            # state size. (n_channel) x 64 x 64\n     \
    \   )\ndef forward(self, input):\n    return self.main(input)\n```\n```\n\nHere,\
    \ the generator is instantiated, and the weight **init()** function is applied\
    \ to initialize all the weights and the layers. Finally, the generator object\
    \ structure can be checked by printing the model, which is shown in the output.\n\
    \n```\n```python\n# Create the generator\nG_network = Generator(n_gpu).to(device)\n\
    \n# Handle multi-gpu if desired\nif (device.type == 'cuda') and (n_gpu > 1):\n\
    \    G_network = nn.DataParallel(G_network, list(range(n_gpu)))\n\n# Apply the\
    \ weights_init function to randomly initialize all weights\n# to mean=0, stdev=0.2.\n\
    G_network.apply(weights_init)\n\n# Print the model\nprint(G_network)\n```\n```"
