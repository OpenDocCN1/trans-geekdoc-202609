    # Inception module


    Inception modules in CNN use stacked (1*1) convolution to perform the computation
    more efficiently in deep neural networks. Along with the computational costs,
    these modules also solve the issue of overfitting effectively. Moreover, if we
    want to mix different-sized filters within a single convolutional layer, it gives
    different features'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'like fine-level or coarse-level features. All the filters, such as 3*3, 5*5,
    and 1*1, are concatenated in a single module, and it reduces the number of computations
    also. Before moving to the inception module, first let us discuss (1*1) convolution.


    # (1 * 1) Convolution


    The convolution of size (1*1) means mapping the input pixel with all its channels
    to the output pixel. It is used to reduce the computation complexity by reducing
    the dimensionality of the feature map. The 1*1 convolutions reduce the depth of
    feature maps.


    Suppose we have an input of size (12*12*480), and we want to perform a (5*5) convolution
    as follows:


    ![](img/7e519fee1b702b91799cdf1664598392_351_0.png)


    If we observe figure 4.190, 48 filters of size (5*5) are used to convolve the
    input image of size (12*12*480). Then, the number of operations involved in convolution
    is given as (12*12*48)*(5*5*480) = 82.944 Million. But, if we use (1*1) convolution
    before using the (5*5) filter, then the number of activation maps gets reduced
    to 16, as shown in figure 4.191:


    ![](img/7e519fee1b702b91799cdf1664598392_351_1.png)'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Now, observe figure 4.192:


    ![](img/7e519fee1b702b91799cdf1664598392_352_0.png)


    Figure 4.192: Inception process


    First, we have used 16 filters of size (1*1*480), and then 48 filters of size
    (5*5*16) are used to convolve on the feature maps got after (1*1) convolutions
    of size (12*12*16). So after applying 48 filters of (5*5*16) size, we get the
    final number of activation maps as (12*12*48) same as we got in figure 4.192,
    but with a reduced number of computations as follows. The size of the final feature
    map remains the same as in figure 4.192. Then, there is the number of operations
    involved in (1*1) convolution followed by (5*5) convolution.


    The total number of operations required for (1*1*480) convolution:


    (12 * 12 * 16) * (1 * 1 * 480) = 1.105 Million


    And the total number of operations required for (5*5*16) convolution:


    (12 * 12 * 48) * (5 * 5 * 16) = 2.76 Million


    Adding these two, we get 1.105 + 2.76 = 3.865 Million. In total, 3.865 Million
    is much smaller as compared to 82.944 Million. Hence, adding (1*1) convolution
    helps in reducing the model size, which is good to handle overfitting problems:


    ![](img/7e519fee1b702b91799cdf1664598392_352_1.png)


    Figure 4.193: Structure of the inception block'
