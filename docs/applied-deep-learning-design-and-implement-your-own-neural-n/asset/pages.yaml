    # # Bounding box regression in RCNN


    Now, let us consider we have a predicted bounding box having coordinates as follows:


    ```

    P = (P_x, P_y, P_w, P_h)

    ```'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'Where $P_x$, and $P_y$ are center coordinates and $P_w$ and $P_h$ are width
    and height of bounding box, respectively.


    While the coordinates of the actual bounding box are given as follows:


    $g = (g_x, g_y, g_w, g_h)$


    Then, the regression is configured such that it performs the scale-invariant transformation
    between the centers of two bounding boxes and also performs log-scale transformation
    with respect to the height and width of the two boxes.


    ![](img/7e519fee1b702b91799cdf1664598392_399_0.png)


    **Figure 5.48: Transformation between predicted and output bounding box**


    As shown in the predecon figure, all the transformations take $P$ as the input
    and can be given as follows:


    $g_x = P_w d_x(P) + P_x$

    $g_y = P_h d_y(P) + P_y$

    $g_w = P_w exp(d_w(P))$

    $g_h = P_h exp(d_h(P))$


    The advantage of applying these transformations is that all the bounding boxes
    having corresponding functions, say, $d_i$, where $i$ can be $x, y, w,$ and $h$
    can be provided values between -$\infty$ to +$\infty$.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'The target values can be given as follows:


    $t_x = \frac{(g_x - P_x)}{P_w}$


    and


    $t_y = \frac{(g_y - P_y)}{P_h}$


    and


    $t_w = log \frac{g_w}{P_w}$


    and


    $t_h = log \frac{g_h}{P_h}$


    The standard model of regression, which can be used to solve the issue while reducing
    the SSE loss, along with the regularization, is given as follows:


    $L_{regr} = \sum_{i=(x,y,w,h)} (t_i - d_i(P))^2 + \partial(w)^2$


