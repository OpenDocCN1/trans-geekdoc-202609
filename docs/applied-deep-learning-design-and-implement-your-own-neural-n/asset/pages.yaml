  md: '![](img/7e519fee1b702b91799cdf1664598392_490_0.png)


    One more trick to avoid exploding gradient problem. Suppose we have a gradient
    vector whose magnitude is very large; that is,


    ∂W >>> 1


    One way is to normalize it in such a way that its magnitude becomes less than
    N, that is,


    ||∂W|| < N


    Now, let us summarize the solutions to avoid vanishing and exploding gradient
    problems. To avoid the exploding gradient problem, we can use the following methods:


    +   • Use truncated backpropagation with time: As discussed previously, we can
    use truncated BPT to avoid the exploding gradient problem as instead of starting
    the process of back-propagation always at the last timestamp, we can choose a
    smaller time stamp to say 8.

    +   • Adjust the learning rate using some methods, such as RMS propagation.

    +   • Clip the gradients at threshold value:'
