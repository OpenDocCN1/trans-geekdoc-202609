    # Sequence prediction


    Sequence prediction is a method that uses existing sequence data for predicting
    the upcoming values in the sequence. These sequences can be in the form of symbols,
    such as letters in a word or numeric values in time series problems. Figure 6.47
    shows an example of the sequence prediction model.


    For example:


    +   - Given alphabets: a, b, c, d, e

    +   - Predict: f'
  merge: -1
  img_proc: true
- pgno: 461
  md: '![](img/7e519fee1b702b91799cdf1664598392_461_0.png)


    Figure 6.47: Example of the sequence prediction problem


    Here, we will discuss the different models for the process of sequence prediction.
    For that, we are using the following terminologies:


    +   - x: Value of the input sequence, which can be bounded by a time stamp such
    as x(1).

    +   - u: Value of the hidden state bounded by a time stamp such as u(1).

    +   - y: Value of the output state bounded by a time stamp such as y(1).


    Let us discuss each of the models one by one as follows.


    # One-to-one sequence prediction model


    The one-to-one sequence prediction model provides a single output for every single
    input data. Figure 6.48 shows the one-to-one sequence prediction model:


    ![](img/7e519fee1b702b91799cdf1664598392_461_1.png)


    Figure 6.48: One-to-one sequence prediction model'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'Here, the internal state for the initial timestamp is equal to 0, then further
    the internal state changes concerning different time steps, as shown in figure
    6.49:


    ![](img/7e519fee1b702b91799cdf1664598392_462_0.png)


    Figure 6.49: One-to-one sequence prediction model over different time stamps


    In such a case, while making the sequence prediction, the model produces one timestamp
    result for every timestamp input signal.


    # One-to-many sequence prediction model


    The one-to-many sequence prediction model provides multiple outputs for every
    single input data. Figure 6.50 shows the one-to-many sequence prediction model:


    ![](img/7e519fee1b702b91799cdf1664598392_462_1.png)


    Figure 6.50: One-to-many sequence prediction model over different time stamps


    Here, the internal state changes with every produced value of output. This type
    of model can be used for the process of image captioning in which an input image
    is provided to the model and it provides the output as a generation of words.'
