    # # Logistic regression


    Logistic regression is a general linear regression model. It is a method used
    in machine learning for statistics and defines as a type of machine learning algorithm
    that can be used for problems related to classification. It is an analytical analysis
    method used to build on the idea of probability. It is the suitable analysis of
    regression which works best when the dependent variable is binary. Similar to
    other regression analysis methods, logistic regression can be based on predictive
    analysis. It is used to define the data and also in finding the association between
    a binary variable, which is dependent on one or more insignificant, interval,
    ordinal independent variables, and so on.


    It is basically a classification method that can be used in assigning the observed
    values as the classes of discrete sets. For example, whether received an e-mail
    is spam or not, online transaction is fraud or not, the tumor is benign or malignant,
    and so on. So basically, logistic regression converts its output by using the
    sigmoid function that returns the value as “0” or “1”, that is, binary classification.


    For a better understanding of linear regression, let us take an example.


