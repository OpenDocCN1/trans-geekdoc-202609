  md: '# # Average pooling


    Average pooling is a type of pooling process that selects and provides the average
    value of the pixel from the feature map’s region scanned by the filter, but max-pooling
    provides the output as the most prominent feature of the feature map. The average
    pooling provides the average of the feature present in the filter scanned area.
    Suppose we have a feature map of size  obtained after the convolution operation,
    as shown in figure 4.90:


    | 1 | 3 | 2 | 1 |

    |---|---|---|---|

    | 2 | 9 | 1 | 1 |

    | 1 | 3 | 2 | 3 |

    | 5 | 6 | 1 | 2 |


