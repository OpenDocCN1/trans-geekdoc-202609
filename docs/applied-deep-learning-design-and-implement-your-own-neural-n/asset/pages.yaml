- pgno: 168
  md: 'To make an update into the parameters, we need to take the gradient of the
    present parameters and then multiply it with the learning rate. Here, the learning
    rate decides how fast we go to the global minima.


    # ADAGRAD


    ADAGRAD descent algorithm uses an adaptive technique to update the learning rate.
    Depending upon the previous iterations of the change in gradient, the learning
    rate is updated as follows. Pseudo-code for the ADAGRAD descent algorithm is given
    as follows:


    ```

    gradient_component = previous_gradient_component + (gradient * gradient)

    learning_rate_change = square root(grad_component) + epsilon

    adapted learning_rate = learning rate * learning_rate_change

    update = adapted learning rate(alpha) * gradient of the parameters

    parameter(new) = parameter(old) – update

    ```


    where epsilon is a constant that is used to keep the rate of change of the learning
    rate in check.


    # Vanishing and exploding gradient problems


    Sometimes gradient keeps on decreasing layer by layer. When the number of layers
    is too large, the gradient becomes so small that it cannot be used. This problem
    is called as vanishing gradient problem. While on the other hand, if the gradient
    increases by a very large value during training such that it overshoots the global
    minima of the gradient curve, then this situation leads to an exploding gradient
    problem.


    # Backpropagation in neural networks


    Backpropagation algorithm is an artificial neural network algorithm in which the
    information flows in the forward direction, but the propagation error flows in
    the backward direction. The backpropagation algorithm was originally proposed
    in the 1970s, but it gained popularity through a publication by Rumelhart et al.
    in 1986. Figure 3.22 shows a back propagation neural network with a single hidden
    layer:'
