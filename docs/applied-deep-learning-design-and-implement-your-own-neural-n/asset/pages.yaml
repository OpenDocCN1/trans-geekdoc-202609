    +   - Recommendation systems

    +   - Supervised and unsupervised anomaly detection


    These are explained as follows:


    # Regression


    Regression is an elegant word to describe that a model will allocate a continuous
    value (response) to a data observation different from a discrete class. We will
    discuss Regression in detail in the upcoming section.


    # Classification


    Problems related to classification involve the insertion of a data point in a
    pre-defined category of class. In some cases, the classification problem performs
    the assignment of a class in an observation, whereas in other cases, the main
    objective is to predict the chances that the observation, which addresses the
    given classes. We will discuss Classification in detail further in the Classification
    section.


    Figure 1.12 represents the classification based on different scenes:


    ![](img/7e519fee1b702b91799cdf1664598392_40_0.png)


    Figure 1.12: Image classification based on different scenes


    # Clustering


    Clustering is defined as an unsupervised technique for determining the alignment
    and organization of a given data set. It is a method of collecting information
    into clusters or groups. Each cluster is considered by an enclosed set of data
    points and the centroid of the cluster. The centroid of the cluster is the average
    of all the data points. We will discuss this in detail in the Clustering section.'
