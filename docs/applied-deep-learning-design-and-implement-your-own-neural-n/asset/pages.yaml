- pgno: 273
  md: 'After convolving the input image of 32 × 32 × 3 with the single filter of size
    5 × 5 × 3, we get the single output activation map of 28 × 28 × 1. Here, the size
    gets reduced as we have not padded the input image by 2, and stride is of one:


    ```

    Output_{size with padding} = \frac{N + (2 \times P) - F}{Stride} + 1

    ```


    The preceding formula computes the size of the activation map. So, in this case,
    the value of N = 32, P=0, F=5, stride=1 where N is the input image size, P is
    padding, and F is the size of filter.


    By substituting these values in the equation as [OutputSize with padding = \frac{N+(2\times
    P)-F}{Stride} + 1], we get the following:


    ```

    Output_{size with padding} = \frac{32 + (2 \times 0) - 5}{1} + 1 = 28

    ```


    Hence, the size of the activation map is (28 × 28). Furthermore, if the number
    of filters is two, the total number of activation maps is also two of 28 × 28
    size, as shown in figure 4.61:


    ![](img/7e519fee1b702b91799cdf1664598392_273_0.png)


    # Figure 4.61: Process of convolution with two 3-D filter of size 5 × 5 × 3


