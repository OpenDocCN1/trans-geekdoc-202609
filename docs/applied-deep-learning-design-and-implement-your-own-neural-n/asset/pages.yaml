  md: '# # Edge detection


    The most important thing to learn in image processing is edge detection. Edge
    detection is the first thing that CNN performs in image processing.


    ![](img/7e519fee1b702b91799cdf1664598392_246_0.png)


    Figure 4.24: Edges in an Image


    In edge detection, we generally have two categories—Vertical Edge Detection and
    Horizontal Edge Detection. Figure 4.25 shows the vertical and horizontal edges
    of an image:


    ![](img/7e519fee1b702b91799cdf1664598392_246_1.png)


    Figure 4.25: Horizontal and vertical edge detection


    # # Image gradient


    The image gradient is defined as the vector of the first-order derivatives of
    an image at the location (x, y). It is used to determine the direction and strength
    of an edge in an input image. It is represented as follows:'
  merge: -1
  img_proc: true
- pgno: 247
  md: '```

    $$ grad f(x, y) = \nabla f(x, y) = \left[ \frac{\partial f}{\partial x}(x, y),
    \frac{\partial f}{\partial y}(x, y) \right] = [G_x, G_y] \quad (4.23) $$

    ```


    This vector points in the direction of the largest rate of change of f(x, y).
    The magnitude of the image gradient is given as follows:


    ```

    $$ Mag\left( \nabla f(x, y) \right) = \sqrt{G_x^2 + G_y^2} \quad (4.24) $$

    ```


    Also, the direction of the image gradient is given as follows:


    ```

    $$ \beta\left( \nabla f(x, y) \right) = tan^{-1} \left( \frac{G_y}{G_x} \right)
    \quad (4.25) $$

    ```


    Let us take an example where there is a change in the intensity levels in only
    a horizontal direction, as shown in figure 4.26:


    ![](img/7e519fee1b702b91799cdf1664598392_247_0.png)


    **Figure 4.26:** Change of pixel intensity values in the horizontal direction


    For the only change in the x-direction, the image gradient is given as follows:


    ```

    $$ \nabla f(x, y) = \left[ \frac{\partial f}{\partial x}(x, y), 0 \right] $$

    ```


    Similarly, the change in the intensity levels in only the vertical direction is
    shown in figure 4.27:


    ![](img/7e519fee1b702b91799cdf1664598392_247_1.png)


    **Figure 4.27:** Change of pixel intensity values in the vertical direction'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'For a change only in the y-direction, the image gradient is given as follows:


    \(\nabla f(x, y) = \left[0, \frac{\partial f}{\partial y}(x, y)\right]\)


    Also, figure 4.28 shows the scenario when there is a change in both directions:


    ![](img/7e519fee1b702b91799cdf1664598392_248_0.png)


    Figure 4.28: Change of pixel intensity values in both directions


    For the change in both x and y directions, the image gradient is given as follows:


    \(\nabla f(x, y) = \left[\frac{\partial f}{\partial x}(x, y), \frac{\partial f}{\partial
    y}(x, y)\right]\)


    So, the direction of the image gradient is given as follows:


    \(\beta(\nabla f(x, y)) = \tan^{-1}\left(\frac{\frac{\partial f}{\partial y}(x,
    y)}{\frac{\partial f}{\partial x}(x, y)}\right)\)


    Let us take an example. Suppose we have zoomed area of an image that contains
    an edge, as shown in figure 4.29:


    ![](img/7e519fee1b702b91799cdf1664598392_248_1.png)


    Figure 4.29: Zoomed section of an image “I” containing straight edge segment.'
