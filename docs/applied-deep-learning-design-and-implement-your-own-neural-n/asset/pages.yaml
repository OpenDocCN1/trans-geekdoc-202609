- pgno: 52
  md: '# Binary logistic regression


    Binary or binomial logistic regression handles the situations for which the detected
    outcome of a dependent variable can be only two types of values, 1 or 0. For example,
    alive versus dead or loss versus win. In binary logistic regression, the output
    is coded as 0 or 1. So, it denotes that the regression taking place is a straightforward
    interpretation. This type of regression can be used for the prediction of the
    odds for a case depending upon the observed values of the predictors or, say,
    independent variables.


    # Multinomial logistic regression


    Multinomial logistic regression handles the situations of the cases when the output
    can be of more than two possible types and is not in an ordered sequence. It compares
    multiple groups by using a combination of multiple binary logistic regressions.


    For example, suppose we want to study the difference in behavior among Bachelor’s,
    Master’s, and PhD students. The multinomial logistic regression will compare the
    Bachelor’s students to Master’s and PhD students, similarly comparison of Master’s
    students with bachelor’s and PhD students will take place. For each independent
    class, there will be at least two comparisons.


    Some more examples are as follows:


    +   - Nature of person (rude, introvert, and humble)

    +   - Color of flower (green, yellow, and red)


    # Cost function


    In terms of linear regression, the cost function denotes the objective function,
    which is optimized; that is, in the case of linear regression, we first define
    a cost function and then minimize it to develop a model with a minimum error rate.'
