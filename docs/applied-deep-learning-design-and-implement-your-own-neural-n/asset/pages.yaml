    # # Siamese networks


    Siamese network is another type of neural network that possesses several instances
    for a single model. They also show the same type of architecture. We need Siamese
    neural networks when dealing with a limited amount of data or do not have the
    complete data set.


    Traditional neural networks learn the task of prediction when trained with several
    classes. But if we want to insert or delete some classes to the data set, it cannot
    be performed in the case of traditional neural networks because, in such cases,
    one needs to update the whole neural network and train the model on the complete
    data set. The following figure shows a traditional Artificial Neural Network:


    ![](img/7e519fee1b702b91799cdf1664598392_543_0.png)


    **Figure 7.30: Traditional ANN**'
  merge: -1
  img_proc: true
- pgno: 544
  md: 'While Siamese neural networks learn using a similarity function, they can be
    trained for two same images, which gives the advantage of classifying a new class
    of objects without retraining the network.


    The Siamese neural network is shown in figure 7.31. In these types of networks,
    we have given a pair of images, and we have to find how similar they are to each
    other. The solution to this is to build two identical networks, as shown in figure
    7.31:


    ![](img/7e519fee1b702b91799cdf1664598392_544_0.png)


    # Figure 7.31: Siamese neural network


    Siamese neural network is mostly used for one-short learning. Now, what is one-shot
    learning? Before moving to one-shot learning, we need to know how classification
    is carried out.


    The process of classification involves learning a neural network-based model by
    providing numerous examples of different classes. Then, the trained model is used
    to predict the new objects of the classes being trained.


    But in one-shot learning, a smaller number of examples of each class is provided
    to the model for training purposes. Then, the trained model is used to predict
    many new objects of the classes provided while training.


    Siamese neural network is used in the case of one-short learning. Siamese network
    is a neural network architecture having two neural networks running in parallel,
    which take different inputs and then their outputs are combined to make the predictions.'
