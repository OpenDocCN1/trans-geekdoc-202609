    # # Backpropagation in RNN


    Now, let us understand back-propagation in RNN to know how the process of weight
    updation takes place in RNN.


    We know that in forward propagation, input values enter the network and then move
    only forward at every timestamp. But while using the backpropagation, we are moving
    back concerning time to update the weights, and hence, we also call backpropagation
    through time (BPTT). Refer to figure 6.68 for an example:


    ![](img/7e519fee1b702b91799cdf1664598392_473_1.png)


    Figure 6.68: Unfolding of RNN in time'
