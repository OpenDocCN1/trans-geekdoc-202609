  md: 'to the inputs to the neuron and makes it adapt to perform and learn more complex
    calculations. Let us discuss some of the commonly used activation functions.


    # # Different types of activation functions


    # ## Linear activation function


    The linear function is an activation function having a mathematical equation same
    as that of a straight line as follows:


    y = mx (3.68)


    Where x and y are the coordinates and m is a constant.


    Irrespective of the number of layers present in the neural network, if all the
    layers possess the property of linearity, then the activation function of the
    final layer is a linear activation function of the input layer. The range of the
    linear activation function varies from [-∞, ∞]. The linear activation function
    is used at the output layer only. Let us take an example of the use of a linear
    activation function.


    Example 3.5: The price calculation of a house is considered to be a regression
    problem. This problem is dependent upon the number of features such as the total
    covered area, number of rooms, number of bathrooms, and the corresponding price.
    It consists of dependent and independent variables. In the equation of linear
    function ᷑ = ᷑ ᷑ , ᷑ is the independent variable and y is the dependent variable.


    The cost of the house can be low or high, so here a linear activation function
    is used at the output layer. Figure 3.38 depicts the curve for the linear activation
    function:


    ![](img/7e519fee1b702b91799cdf1664598392_200_0.png)


    Figure 3.38: Linear activation function'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # Sigmoid function


    It is a non-linear activation function, when plotted, depicts an S-shaped graph.
    Its range lies between 0 and 1. It is easy to understand and use.


    The equation of the sigmoid activation function is given as follows:


    P = \frac{1}{1+e^{-x}} (3.69)


    Figure 3.39 depicts the plot of the sigmoid function:


    ![](img/7e519fee1b702b91799cdf1664598392_201_0.png)


    Figure 3.39: Sigmoid activation function


    It is commonly used in the case of classification (binary), where the output layer
    provides results as either 1 or 0. The value of the sigmoid activation function
    varies in the range of 0 to 1. The predicted output is as follows:


    Output = \begin{cases} 1, & Result > 0.5 \\ 0, & Result \le 0.5 \end{cases}


    Hence, if the resultant value is more than 0.5, the forecasted output is 1; otherwise,
    the forecasted output is 0.


    # # ReLU activation function


    Rectified Linear Unit (ReLU) is the most commonly used activation function. Unlike
    the linear and sigmoid activation functions, which are implemented at the output
    layer of the neural network, ReLU is implemented at the hidden layers of the neural
    network.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The equation for the ReLU activation function is given as follows:


    A(x) = max. (0, x) (3.70)


    So, the aim of the ReLU function is to remove the negative values. It provides
    output as x if x is positive and 0 if the value of x is negative.


    Figure 3.40 shows the curve plotted for the ReLU activation function:


    ![](img/7e519fee1b702b91799cdf1664598392_202_0.png)


    Figure 3.40: ReLU activation function


    ReLU does not have the problem of vanishing gradient, which is suffered by other
    activation functions like Tanh or Sigmoid.


    # # Leaky ReLU activation function


    ReLU is also not free from drawbacks, some of which are the following:


    +   - ReLU is non-zero-centered.

    +   - It is not differentiable at zero.


    Apart from these drawbacks, the ReLU activation function also has a major issue
    named as Dying ReLU problem, where some ReLU neurons die for all inputs and remain
    inactive no matter what input is supplied.


    Hence, no gradient flows, and if a large number of dead neurons are there in a
    neural network, then its performance is affected, which can be corrected by making
    use of Leaky ReLU such that its slope is changed left of x = 0 (that is, on negative
    axis), which results in a leak and leads to an extension in the range of ReLU.'
  merge: -1
  img_proc: true
