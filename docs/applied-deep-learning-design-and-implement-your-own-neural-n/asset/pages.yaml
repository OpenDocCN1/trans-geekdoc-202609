  md: '# # Convolutional neural network with example (Implementation: How CNN works?)


    We start with a simple classification problem where we have to predict whether
    this image has X or O. We have to train our CNN so that it does the right classification
    when a new object is shown to this. Figure 4.104 shows the problem. Figure 4.105
    shows the spatial representation of X or O in the spatial domain. Figure 4.106
    defines various possible spatial positions of X or O that are obtained using translation,
    scaling, and rotation. Figure 4.107 represents the problem of deciding the similarity
    between the two images. One way to find similarities between two images is by
    matching. So, finding the similarity between two images is basically a metric
    learning problem. If we want to find whether it is X or O, then it becomes a classification
    problem. At last, if we want that what is inside the image, then this is basically
    an object detection problem. Figure 4.108 represents the values of a particular
    pixel where a white intensity pixel is represented by 1, whereas a black intensity
    pixel is represented by -1. The X (cross) at the pixel values in figure 4.109
    represents the region of the two images in figure 4.108 that are not matching.
    Figure 4.110 represents that the two images are not matching with each other.
    Convolutional networks (ConvNets) match the pixels of the image, as shown in figure
    4.111. They match the regions of an image. Figure 4.112 represents the possible
    three matching patterns of X. Basically, these are called as convolutional filters,
    which are applied on the given image to generate activation maps to train the
    model:


    Two Dimensional array of pixel


    ![](img/7e519fee1b702b91799cdf1664598392_299_0.png)


    Figure 4.104: Simple classification problem'
