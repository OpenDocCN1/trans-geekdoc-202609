- pgno: 480
  md: 'Here, c is the true class at timestamp t


    T is the total number of timestamps;


    $\gamma_{tc}$ is the predicted probability of a character at timestamp t.


    Now, for the back-propagation, we need to find out the gradients also concerning
    U, V, and W.


    So, first, let us look at the derivative of the loss function $L(\theta)$ concerning
    V as follows:


    $$

    \frac{\partial L(\theta)}{\partial V}

    $$


    And here, V is a matrix, so we can write as following:


    $$

    \nabla_V L(\theta)

    $$


    So, we have discussed how to do this derivative in the section backpropagation
    in the previous chapter. So we can write the following:


    $$

    \frac{\partial L(\theta)}{\partial V} = \sum_{t=1}^T \frac{\partial L_t(\theta)}{\partial
    V} \quad (6.13)

    $$


    Where each term in the summation is the derivative of the loss function concerning
    the output layer weights. Now, let us look at the derivative of the loss function
    concerning W as follows:


    $$

    \frac{\partial L(\theta)}{\partial W}

    $$


    Can be given as follows:


    $$

    \frac{\partial L(\theta)}{\partial W} = \sum_{t=1}^T \frac{\partial L_t(\theta)}{\partial
    W} \quad (6.14)

    $$


    +   - Now, according to the chain rule of derivatives, the value of $\frac{\partial
    L_t(\theta)}{\partial W}$ can be determined by adding the gradients of all the
    paths from $L_t(\theta)$ to the value of W.

    +   - So, can you tell what are all the paths which are connecting W to the loss
    function $L_t(\theta)$? So, here we will have t paths.

