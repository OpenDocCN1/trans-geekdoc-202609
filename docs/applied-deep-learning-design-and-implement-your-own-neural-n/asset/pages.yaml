    Now, the filter that is to be applied is the same 3-D filter as we have used in
    the section Convolution in 2-D. Instead of 2-D convolution, now convolution is
    also 3-D, as we are moving our filter in the x, y, and z directions. In 3-D convolution,
    the movement of the filter is also in the direction of z along with the x and
