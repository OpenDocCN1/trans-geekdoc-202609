- pgno: 345
  md: '# Mathematical formulation to learn Identity mapping in Residual Network (ResNet)


    In figure 4.183, we have considered three layers as lth layer, (l + 1)th layer,
    and (l + 2)th layer:


    ![](img/7e519fee1b702b91799cdf1664598392_345_0.png)


    Figure 4.183: Convolutional neural network


    Where, $a^l$ is the activation function at lth layer, $a^{l+1}$ is the activation
    function at (l + 1) th layer and $a^{l+2}$ is the activation function at (l +
    2)th layer. From figure 4.183, we can say that the output from layer (l+1) is
    given as follows:


    $z^{(l+1)} = w^{(l+1)}. a^l + b^{(l+1)}$


    Now, as we are using non-linearity, then


    $a^{(l+1)} = G(z^{(l+1)})$


    Where G is the ReLU activation function. Similarly, $z^{(l+2)}$ is expanded as
    follows:


    $z^{(l+2)} = w^{(l+2)}. a^{(l+1)} + b^{(l+2)}$


    And


    $a(l + 2) = G(z^{(l+2)})$


    Now, for establishing the residual connection, we connect $a^l$ to (l + 2) layer,
    as shown in figure 4.184:'
  merge: -1
  img_proc: true
- pgno: 346
  md: '![](img/7e519fee1b702b91799cdf1664598392_346_0.png)


    Here, we connect \(a^l\) to \((l + 2)\) layer before non-linearity, then after
    the connection, we apply the non-linearity. So, the residual connection output
    is as follows:


    ```

    \(a^{(l+2)} = G(z^{(l+2)} + a^l)\)

    ```


    Now, as we know:


    ```

    \(z^{(l+2)} = w^{(l+2)} . a^{(l+1)} + b^{(l+2)}\)

    ```


    Therefore,


    ```

    \(a^{(l+2)} = G(w^{(l+2)} . a^{(l+1)} + b^{(l+2)} + a^l)\)

    ```


    So, residual network means taking input from one layer, then skipping one layer
    and adding it to the next layer before applying non-linearity.


    If we are not performing well with the upcoming few layers, then we will apply
    L2 regularization and keep on reducing the weights such that both, that is, \(w^{(l+2)}\)
    and \(b^{(l+2)}\) becomes very low, that is, almost equal to ZERO. Then, \(a^{(l+2)}\)
    gets reduced as follows:


    ```

    \(a^{(l+2)} = G(a^l)\)

    ```


    As \(a^l\) is the activation function defined as \(a^l = G(z^{(l)})\):


    ```

    \(a^{(l+2)} = G(G(z^{(l)})) = G(a^l) = a^l\)

    ```'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'In the preceding equation, we applied ReLU over a ReLU, that is, \( G(G(z^{(l)}))\)
    and we got the same output. As ReLU is used to replace the negative value with
    zero and only retain positive value, for example, we have a value of \( z^{(l)}
    = 0.96 \) and then we apply ReLU over this, that is, \( G(z^{(l)}) = G(0.96) =
    0.96 = say(a^l)\), that is, \( a^l = 0.96 \). Now if we again apply ReLU over
    this, that is, \( G(G(z^{(l)})) = G(a^l) = G(0.96) = 0.96 = a^l \). Therefore,
    \( a^{(l+2)} = a^l \).


    So, by reducing the weights and biases, what we learnt at \( a^l \) reappears
    at \( a^{(l+2)} \), i.e., identity mapping. By adding more and more layers, we
    can achieve a good amount of non-linearity. In these types of residual blocks,
    we get more performance by adding more and more layers, or we will not get anything
    less than what we have achieved before. Also, there exists one more problem with
    respect to the dimension of \( z^{(l+2)} \) and \( a^l \) as both are added for
    getting residual connection output. As \( a^{(l+2)} = G(z^{(l+2)} + a^l) \) and
    we can see here that \( z^{(l+2)} + a^l \) are added by assuming the same dimensions.
    But they may have different dimensions say \( z^{(l+2)} = 256 \) and \( a^l =
    128 \). So, to resolve this issue, we have to learn a matrix \( W_s \), in such
    a way that both dimensions can be same. For this, either we can do padding or
    reduce the size to fixed size so that both factors can be added easily. So, the
    equation for \( a^{(l+2)} \) gets modified as follows: \( a^{(l+2)} = G(z^{(l+2)}
    + W_s a^l) \)


    Figure 4.185 shows the series residual connection among various convolutional
    layers:


    ![](img/7e519fee1b702b91799cdf1664598392_347_0.png)


    Figure 4.185: Residual connections


    Figures 4.186 and 4.187 show the architecture of a 34-layered plain neural network
    and the ResNet, respectively:'
