- pgno: 287
  md: '# Pooling layer in CNN


    The pooling layer in CNN is used to reduce the size of the feature maps to speed
    up the computation and also makes the feature detection more robust. The pooling
    process performs scanning a 2-D filter over each of the channels of the feature
    map and finally reduces the features lying within the region of the image, which
    is scanned by the filter without losing much important information. Suppose we
    have a feature map of the size (n_h * n_w * n_c) obtained after the convolution
    operation. Then, after pooling, the size of the output is as follows:


    $$

    \frac{(n_h - f + 1)}{s} * \frac{(n_w - f + 1)}{s} * n_c

    $$


    Where n_h represents the height of the feature map

    n_w represents the width of the feature map

    n_c represents the total channels in the feature map

    f represents the size of the filter used

    and s represents the length of the stride


    The pooling layer reduces the number of learning parameters significantly along
    with the computation time to train the network. Pooling is divided into the following
    two parts:


    +   1. Max pooling

    +   2. Average pooling


    # Max pooling


    Max pooling is a type of pooling process that selects and provides the maximum
    value of the pixel from the feature map’s region scanned by the filter. Thus,
    max-pooling provides the output as the most prominent feature of the feature map.
    Pooling does not require any parameters:


    | 1 | 3 | 2 | 1 |

    |---|---|---|---|

    | 2 | 9 | 1 | 1 |

    | 1 | 3 | 2 | 3 |

    | 5 | 6 | 1 | 2 |


    Figure 4.81: Feature or activation map'
  merge: -1
  img_proc: true
