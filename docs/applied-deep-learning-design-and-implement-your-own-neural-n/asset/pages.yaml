  md: 'Now, \( p(y=1 given x) \) is given by the following:


    \( p(y=1|x) = \sigma(\sum_{j=1}^3 V_j z_j + c) \)

    \( p(y=1|x) = \sigma(v_1z_1 + v_2z_2 + v_3z_3 + c) \)

