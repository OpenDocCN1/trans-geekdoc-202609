    # Intersection over Union (IOU)


    Now, we got our bounding box. But how do we decide if the bounding box is giving
    us good results or not? So, here intersection over union is used. Intersection
    over union actually determines the intersection over the union of the actual versus
    predicted bounding box.


    ![](img/7e519fee1b702b91799cdf1664598392_389_0.png)


    Figure 5.31: Actual versus predicted bounding boxes


    In figure 5.31, we can observe the actual bounding box as a red box and the predicted
    bounding box as a blue box. Now, how do we determine if the prediction is good
    or not?


    So, Intersection over Union (IOU) creates a region of the intersection over union
    for both of the boxes, as shown in figure 5.32:'
  merge: -1
  img_proc: true
- pgno: 390
  md: '![](img/7e519fee1b702b91799cdf1664598392_390_0.png)


    Figure 5.32: IOU region


    $IOU = \frac{Intersection Area}{Union Area}$


    $IOU = \frac{Region of yellow box}{Region of green box}$


    So, if


    $IOU > 5$


    Then, the prediction is said to be Good. And if


    $IOU \le 5$


    Then, the prediction is said to be Bad. However, we can change the threshold value
    of 0.5 according to our needs.


    # Non-max suppression


    Non-max suppression can also increase the significance of the output of the YOLO
