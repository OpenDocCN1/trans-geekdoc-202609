    +   - Siamese networks

    +   - Triplet loss


    # # Introduction


    In the previous chapter, we have discussed sequence prediction using RNN. RNN
    works well for short-term dependencies; however, it has certain limitations, as
    follows:


    +   - Because of the vanishing gradient issue, if we want to use a long chain
    of RNN having multiple hidden layers, it becomes difficult for RNN to remember
    all the past information; that is, it can remember only a certain amount of information
    from the incidences that happened in the past. Therefore, it affects the performance
    of the RNN by limiting its effectiveness when it needs to go back deeper into
    the context.

    +   - The other limitation of the RNN is that there is very weak control over
    the information which needs to be carried forward and how much information regarding
    past incidences needs to be forgotten.


    The preceding two problems can be mitigated by using LSTM. They are a special
    type of RNN. Unlike RNNs, they are capable of learning long-term dependencies.
    Before LSTM, we will discuss GRU. Moving from RNN to LSTM, in LSTM, we replace
    the hidden layer node with a Gated unit, as shown in figure 7.1.


    # # Simple GRU


    There exist two types of dependencies, short-term and long-term dependencies.
    For example, Rohit is known as a hit-man. He is the captain of Mumbai Indians.
    There exists a dependency between Rohit and Him. Another example is, five people
    are going with us to Himani Chamunda Temple, and all of them are good trekkers.
    There exists a short-term dependency between “five and people” and “people and
    are”; there exists a long-term dependency between five people and them. RNNs are
    capable of learning short-term dependencies but are unable to remember long-term'
  merge: -1
  img_proc: true
