    # Forget gate


    It is the first gate of the LSTM cell, and it decides which data or information
    to keep and what information to forget. Forget gate is also called a remember
    vector. It takes input from two different sources as follows:


    +   - The output from the previously hidden layer node, that is, h(t − 1).

    +   - Finally, current input, that is, x(t).

    +   - And multiply it with the previous memory state value c(t-1).'
