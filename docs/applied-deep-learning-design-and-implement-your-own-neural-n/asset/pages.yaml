  md: '# # Many-to-one sequence prediction model


    The many-to-one sequence prediction model provides one output for multiple input
    data. Figure 6.51 shows the many to one sequence prediction model:


    ![](img/7e519fee1b702b91799cdf1664598392_463_0.png)


    Figure 6.51: Many-to-one sequence prediction model over different time stamps


    Here, the internal state changes when every value of input before producing the
    actual output value. In this type of a case, the model uses a sequence of recently
    produced observations to predict the further values of time stamps.


    # # Many to many sequence prediction model


    The many-to-many sequence prediction model provides multiple outputs for multiple
    input data. Figure 6.52 shows the many to one sequence prediction model:


    ![](img/7e519fee1b702b91799cdf1664598392_463_1.png)


    Figure 6.52: Many-to-many sequence prediction model over different time stamps'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'It is the combination of one-to-many and many-to-one models. Here, the model
    uses the recent sequence of observations to predict the multiple output values.


    **In the case of many-to-many sequence prediction models, the number of inputs
    does not have to match with the total number of outputs.**


    # RNN architecture


    Now, to understand the working of RNN, let us discuss the basic architecture of
    RNN, as shown in figure 6.53:


    ![](img/7e519fee1b702b91799cdf1664598392_464_0.png)


    **Figure 6.53: RNN architecture**


    We can represent the RNN by using the following function:


    ```

    h_{(t)} = f_c(h_{(t-1)} \times x_{(t)}) (6.3)

    ```


    Where


    +   - h(t) is the new state; [history vector],

    +   - f_c is the function with parameter c,

    +   - h(t – 1) is the old state; [previous history vector],

    +   - x(t) is the input vector at time step t.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# # Connect with realization of RNN


    Let us take an example of RNN for the use case of Natural Language Processing
    for a better understanding of RNN. Let us say the model is provided with the following
    four letters as HELL, and the model has to predict the last letter as O. The common
    form of RNN can be explained in figure 6.54:


    ![](img/7e519fee1b702b91799cdf1664598392_465_0.png)


    Figure 6.54: RNN input-output model


    Now, let us use the preceding structure of RNN to predict the fifth letter of
    the word HELLO. In the preceding structure, the center box named RNN uses a Recurrence
    formula [equation (6.3)] on the values of the input vector and the previous state
    of the input vector.


    So, here letter H is the first letter, and there is nothing as its previous input.
    Now, after that, the letter E has been provided to the RNN, in which a recurrence
    formula is used with the current input E and the previous input state H.


    This is according to different time stamps of the input. So suppose, if at timestamp
    t the input to the RNN is E, then the input was H at the time stamp t-1. And then,
    finally, using the recurrence formula, we get the current state. The formula is
    given as follows:


    ```

    h_{(t)} = f_c(h_{(t-1)}, x_{(t)})

    ```


    Where h(t) is the current state.


    h_{(t-1)} is the previous state.'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'x_(t) is the current input.


    Now, we have all the previous inputs as well as present input states for each
    letter HELL; therefore, all these inputs are given to the neural network for each
    letter separately. Here each input is called the time stamp input.


    Now, let us say the activation function we are using here is the tanh activation
    function, then the current state at time stamp t is given as follows:


    ```

    h_(t) = tanh(W_(hh) * h_(t-1) + W_(xh) * x_(t)) (6.4)

    ```


    Where W_(hh) is the weight of recurrent input [NN-1 (fully connected network taking
    I/P as h_(t-1) and producing output as h_(t)]; (see table 6.3). W_(xh) is the
    weight of the input neuron. [NN-2 (matrix multiplication converting x to h]. Both
    NN-1 and NN-2 have the same dimensions, so the addition between W_(hh)h_(t-1)
    and W_(xh)x_(t) will be possible (see table 6.3). Here, in this case, we can observe
    that the recurrent neuron is taking only the successive previous state to get
    the output. If we have longer sequences, the result can be obtained by using multiple
    previous states.


    So from the current state, we can calculate the output state by using the following
    equation:


    ```

    y_(t) = W_(hy) * h_(t)

    ```


    W_(hy) is NN-3 that will convert state (see table 6.3), we can calculate the output:


