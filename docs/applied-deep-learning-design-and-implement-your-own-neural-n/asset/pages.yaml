    A batch size of 128 is used, meaning that the number of training examples used
    in one iteration as mentioned in the paper of DCGAN. The dataset has colored images,
    so nc, that is, the number of channels are three, each for red, green, and blue.
    The input to the Generator is a latent vector, that is, nz (random vector noise)
    with size 100. The size of the latent vector can be varied depending on the complexity
    of the distribution; such as for MNIST, good results can be obtained with 16 variables,
    and in the case of sophisticated datasets the value can be increased to even 1000.


