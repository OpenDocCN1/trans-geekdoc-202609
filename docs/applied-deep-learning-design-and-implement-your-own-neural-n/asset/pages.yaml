  md: '# Region proposal networks (RPN)


    As we know that the feature maps from convolution layers are passed through RPNs.
    Then RPNs actually use the sliding window technique on these feature maps. For
    every sliding window, it produces K number of anchor boxes having different shapes,
    as shown in figure 5.63:


    ![](img/7e519fee1b702b91799cdf1664598392_412_0.png)


    Figure 5.63: SoftMax and Linear regression layers


    We have discussed anchor boxes in the previous section, and they are basically
    bounding boxes of different shapes. For every anchor box, RPNs predict the following:


    +   • The probability that it is an object

    +   • Bounding box regressions


    Now, there is a possibility that after getting output from RPN, there may be some
    proposals that do not have classes assigned to them. So, in this case, every proposal
    can be cropped such that every proposal has an object.


    For this purpose, we use the RoI pooling layer, which extracts feature maps of
    a fixed specific size from every anchor box, as shown in figure 5.64:'
  merge: -1
  img_proc: true
- pgno: 413
  md: '![](img/7e519fee1b702b91799cdf1664598392_413_0.png)


    # Figure 5.64: RoI pooling Layer


    After that, the generated feature maps from the RoI pooling layer are passed through
    a fully connected layer following regression and SoftMax layer to make bounding
    box predictions.


