  md: '# Cell update unit


    ```

    c_t = \gamma_u \odot \tilde{c}_t + (1 - \gamma_u) \odot c_{t-1} (7.5)

    ```


    If \(\gamma_u = 1\), then it signifies that update the cell content by \(c_t\),
    else remains the same and if \(\gamma_u = 0\), then \(c_t = c_{t-1}\).


    # Full gated recurrent unit


    In addition to simple GRU, full GRU includes one more gate as a relevance gate.
    It is used to show the relevance of each bit in the cell state. It is another
    neural network that is parameterized by \((W_r, b_r)\), where \(W_r\) is weight
    and \(b_r\) is corresponding bias with input as \((c_{t-1}, x_t)\). It is represented
    by \(\gamma_r\). It includes the following equations:


    ```

    \tilde{c}_t = tanh[(W_c (\gamma_r \odot c_{t-1}, x_t) + b_c] (7.6)


    \gamma_u = \sigma[(W_u (c_{t-1}, x_t) + b_u] (7.7)


    Relevance Gate: \gamma_r = \sigma[(W_r (c_{t-1}, x_t) + b_r] (7.8)


    c_t = \gamma_u \odot \tilde{c}_t + (1 - \gamma_u) \odot c_{t-1} (7.9)

    ```


    # GRU to LSTM transition


    In the case of LSTM, there is no relevance gate [equation (7.10)], and in LSTM,
    there are two new gates as forget gate (\(\gamma_f\)) and Output gate (\(\gamma_o\)).
    The following potential cell update unit (\(\widetilde{c}_t\)) and cell update
    gate (\(c_t\)) of GRU is updated as follows:


    ```

    \tilde{c}_t = tanh[(W_c (h_{t-1}, x_t) + b_c] (7.10)

    ```


    ```

    c_t = \gamma_u \odot \tilde{c}_t + (1 - \gamma_u) \odot c_{t-1} (7.11)

    ```


    In this equation, \(\gamma_u \odot \tilde{c}_t\) represents what to update and
    \((1 - \gamma_u) \odot c_{t-1}\) represents what not to update. So in the case
    of LSTM, this equation (7.11) is modified as shown in equation (7.12):


    ```

    c_t = \gamma_u \odot \tilde{c}_t + \gamma_f \odot c_{t-1} (7.12)

    ```


    In the case of GRU, \(h_t = c_t\) (refer to Chapter 6: Sequence Modeling in Neural
    Networks and Recurrent Neural Networks (RNN) section 6.8.2 for \(h_t\), it is
    a (100 x 1 dimensional history update vector)), but in the case of LSTM \(h_t
    \neq c_t\), the forget gate is parameterized using \((W_f, b_f)\), where \(W_f\)
    is weight and \(b_f\) is corresponding bias with input as \((h_{t-1}, x_t)\).
    The equation for forget gate is represented in equation (7.13). LSTM will learn
    the forget gate separately.'
