- pgno: 138
  md: 'The cell body of the biological neuron transmits signals to other neurons in
    the form of electrical signals. The path that the neurons use to transmit signals
    to other neurons is called as axon.


    To receive the transmitted signals, each neuron uses dendrites that are attached
    to the cell body of every neuron. Between the axon of one neuron and the dendrite
    of the other neuron, there is a small gap known as synapses. So, whenever a signal
    reaches the end of a neuron, the release of neurotransmitters takes place, which
    carries the transmitted signal to the next neuron across synapses.


