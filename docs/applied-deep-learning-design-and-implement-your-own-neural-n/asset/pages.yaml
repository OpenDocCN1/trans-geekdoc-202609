- pgno: 440
  md: '# # Why RNN is required?


    In a feed-forward neural network, data flows in the forward direction only, starting
    from the input nodes, then passing through hidden nodes, and finally, moving toward
    the output node. The problems with the feed-forward neural network are as follows:


    +   * No future scope.

    +   * Decisions always depend on the current output.

    +   * No memory of past observations.

    +   * No cycles or loops in these neural networks.

    +   * Cannot handle the sequential data.

    +   * Cannot memorize the previous input data.

    +   * Considers only the current input.


    So all the upper issues can be solved by using RNN. In _figure 6.17_ of an RNN,
    _B_ from the _X_ input node is going to _h"_ hidden state and _A_ output from
    _h_ hidden state is going to the _Y_ output node, and _C_ in the middle shows
    what is going on in the hidden layers. Hidden layers here produce data that is
    fed into the next hidden layer. This allows the model to handle sequential data
    effectively as it considers the current input with the previously received input:


    ![](img/7e519fee1b702b91799cdf1664598392_440_0.png)


    Figure 6.17: Recurrent neural network


    The advantages of RNN are as follows:


    +   * It can handle sequential data effectively.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '+   - Due to its internal memory, it can memorize the previous inputs.

    +   - Along with the current input, it also considers the previous inputs.


    # # Realization of RNN


    In table 6.1, we have figured out three problems for the realization of neural
    networks:


    | Problem 1 (fixed rule) | Problem 2 (round-robin schedule) | Problem 3 (round
    robin schedule + input as weather) |

    | :--- | :--- | :--- |

    | If weather is sunny then Lime Juice and if weather is rainy then hot coffee.
    | In this output has to be fed back as input. Network need to remember the last
    drink served. Lime juice --> hot coffee--> orange juice (Input as weather is not
    considered) | If sunny then repeat the last day drink and if rainy serve the next
    day drink according to round robin schedule. In this we have to take an input
    of weather of today. |


    Let us take an example to understand the RNN completely. A boy drinks three types
    of drinks say Hot Coffee (rainy), Lime Juice(sunny), and Orange Juice, as shown
    in figure 6.18:


    ![](img/7e519fee1b702b91799cdf1664598392_441_0.png)


    Figure 6.18: Boy drinks these liquids'
