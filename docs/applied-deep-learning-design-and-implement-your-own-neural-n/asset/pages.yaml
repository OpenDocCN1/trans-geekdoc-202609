    # Semi-supervised GAN


    In supervised learning, the model is trained with the help of labeled data, where
    each sample of the dataset is tagged to some class or label. Therefore, these
    models are considered easy to train and more trustworthy in their predictions.
    On the other hand, in unsupervised learning, data is not labeled, so these models
    are difficult to train and are computationally complex. In machine learning, training
    versatile datasets play a very crucial role. Availability of data is not an issue
    nowadays, thanks to the internet, which provides us with vast and virtually limitless
    data in the form of text, images, audio, video, and so on. But this data is not
    labeled, and it is one of the main bottlenecks in training machine learning algorithms.
    It is not at all possible to label this much amount of data because it is a very
    time-consuming, tedious, and expansive process. The complexity of this process
    can be judged by the fact that it took nearly two and a half years to hand-annotate
    (label the classes) about three million images in the ImageNet dataset.


    Semi-supervised learning, as the name suggests, is in the middle of both supervised
    and unsupervised methods and uses both labeled and unlabeled data elements for
    training. It uses only a small subset of labeled data (approximately 2%–3% complete
    dataset) and has shown great results in classifying new unlabeled data and achieved
    accuracy close to supervised learning models.


    In semi-supervised GAN, the discriminator is a multi-class classifier instead
    of just binary classifying as real or fake, as shown in figure 8.13. Now, the
    discriminator is'
