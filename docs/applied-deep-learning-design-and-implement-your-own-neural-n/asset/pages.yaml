    # ResNET


    ResNET stands for residual network. Deep learning architectures like CNN have
    achieved image classification results almost similar to human minds. However,
    with an increase in the number of layers in deep neural networks, the accuracy
    of the model becomes saturated and then suddenly degrades.


    Figure 4.181 shows the various CNN case studies along with the error rate and
    the number of layers that are presented at the ImageNet Large Scale Visual Recognition
    Challenge (ILSVRC) during successive years starting from 2010 to 2015:


    ![](img/7e519fee1b702b91799cdf1664598392_343_1.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'The ILSVRC evaluates algorithms for object detection and image classification
    at a large scale. In this, we notice that starting from ILSVRC''10, the number
    of layers is shallow, and it gets increased up to 152 when RESNET is introduced
    during ILSVRC''15. The error rate is considerably reduced from 28.7% to 3.57%
    from ILSVRC''10 to ILSVRC''15, as shown in figure 4.181. The error rate of ResNets
    is just 3.57%. In figure 4.182, graphs show the performance comparison of plain
    nets and ResNets on the CIFAR-10 dataset.


    The CIFAR-10 dataset (Canadian Institute For Advanced Research) is a collection
    of images that are commonly used to train machine learning and computer vision
    algorithms. It consists of 60,000 color images with the size of each image as
    32 × 32, divided into 10 classes, with 6,000 images per class. There are 50,000
    training images and 10,000 test images. It shows the advantage of ResNets over
    simple convolutional networks. In figure 4.182 (a), we can see some solid (test)
    and dashed sinusoidal waves. The solid lines represent the test data, whereas
    the dashed lines represent the training data. We can see in figure 4.182(a) that
    even after increasing the number of layers, the accuracy does not get increased,
    and we are getting more error rates for the increased number of layers.


    For example, the error rate for a 56-layer convolutional network is much more
    than the 20-layer convolutional network, as shown in figure 4.182(a). So, from
    here, the need for ResNets comes into the scenario [figure 4.182 (b)]. In the
    case of ResNets, as shown in figure 4.182(b), we can see that the error percentage
    decreases with an increase in the number of layers. Moreover, if ResNet does not
    perform well by adding more and more layers, we will not get anything less than
