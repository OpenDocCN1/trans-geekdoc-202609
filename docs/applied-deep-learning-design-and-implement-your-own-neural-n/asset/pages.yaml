    The equation for the forget fate can be written as follows:


    $$\gamma_f = \sigma[(W_f (h_{t-1}, x_t) + b_f]$$


    Or


    $$f(t) = \sigma[(W(F)[h(t-1), x(t)] + b(t)]$$


    Where Wf and bf are weight and bias, respectively. In forget gate’s input and
