- pgno: 5
  md: '# Preface


    This book covers many different aspects of deep learning and the importance of
    deep learning in the field of computer science and other allied areas. This book
    also introduces the importance of deep learning in the real world. It shows how
    the deep learning techniques are important for various aspects of computer science.
    This book solves the basic understanding of neural networks. It also gives importance
    to convolutional neural networks for the purpose of image-based classification.
    Moreover, all the deep learning concepts are implemented in hands-on sessions
    using Python’s libraries. This book gives information about the usefulness of
    deep learning and machine learning worldwide.


    This book takes theoretical as well as practical approaches for deep learning
    readers. It covers all the concepts related to deep learning in the simplest way
    with real-world examples. It will cover information on machine learning, deep
    learning techniques, Neural networks, and convolutional neural networks. It can
    be used for classification purposes in various domains. You can design your own
    neural networks by going through the entire book.


    This book is divided into 08 chapters. They will cover the basics of artificial
    intelligence, machine learning, deep learning, the intuition of neural networks,
    CNN, object detection and localization, RNN, LSTM, and GANs. This book also includes
    review questions, MCQs, Web resources, and hands-on sessions using Python at the
    end of each chapter. for the readers to get more interest and joy in exploring
    deep learning techniques. The details are listed below:


    **Chapter 1: Basics of Artificial Intelligence and Machine Learning** - Provide
    a brief idea about machine learning and its types with a proper explanation of
    classification and regression problems. In this chapter, there is a brief explanation
    of the clustering algorithms with solved examples. The readers will know the difference
    between binary and multi-class classification and the regression. The readers
    will understand the main concept of clustering and its types. Moreover, this will
    provide insights about various clustering algorithms along with its applications.
    Further, the basics of machine learning and artificial intelligence are implemented
    using python in this chapter.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '**Chapter 2: Introduction to Deep Learning with Python** - Covers the basics
    of deep learning concepts along with the libraries and datasets used in Python.
    Furthermore, it also discusses various loss functions. In the chapter, a single-layer
    neuron is also covered. Additionally, the fundamentals of the SVM classifier and
    performance indicators are discussed.


    **Chapter 3: Intuition of Neural Networks** - This chapter will focus on the intuition
    of neural networks in depth. In this chapter, we will learn from perceptron’s
    activation functions. Moreover, we have discussed the working of gradient descent,
    cost functions, and the relationship between log-likelihood and MSE. Furthermore,
    gradient descent for linear regression and back-propagation in Neural networks
    with corresponding loss functions is described in detail. In this chapter, we
    have explored the effect of integration on the derivative of the cost function.
    At last, various computational graphs, along with gradients and different types
    of activation functions, are discussed with examples.


    **Chapter 4: Convolutional Neural Networks**- This chapter will cover convolutional
    Neural Networks. In this chapter, we have explored various layers of CNN. We have
    discussed the concepts of padding, stride, and pooling in CNN with suitable examples,
    along with one- and two-dimensional convolution. We have also visualized the working
    of a three dimensional filter in 2-D convolution. Moreover, we have shown the
    working of CNN with an illustrative example under the section How CNN works? Finally,
    CNN case studies are discussed with their architectures with corresponding parameters.
    At last, the reader can build their own CNN model for image classification by
    going through the entire chapter.


    **Chapter 5: Localization and Object Detection** - In this chapter, we explored
    various tasks related to computer vision, such as object detection, localization,
    classification, and segmentation. Furthermore, we have discussed extracting various
    objects from a scene or an image. We have also analyzed two parts of image segmentation,
    semantic and instance-based segmentation. In this chapter, we will understand
    the working of the widely used object detection algorithm as YOLO. Finally, you
    will study and compare various object detection algorithms using convolutional
    neural networks such as RCNN, Fast RCNN, and Faster RCNN. At last, you will explore
    the image segmentation algorithm as Mask RCNN on the COCO data set.


    **Chapter 6: Sequence Modeling in Neural Networks and Recurrent Neural Networks
    (RNN)** - It mainly focuses on Recurrent Neural Networks. In this'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'chapter, we have explored the basics of recurrent neural networks with the
    help of suitable examples and mathematical formulations. Further, we have realized
    recurrent neural networks with the help of three other neural networks. We have
    also visualized recurrence relationships in RNN using matrix augmentation. Moreover,
    we have illustrated the concept of backpropagation in time compared to RNN. Furthermore,
    various sequence predictions and applications of RNNs in the real world are discussed.
    At last, the reader can build their own RNN using hands-on sessions.


    Chapter 7: Gated Recurrent Unit, Long Short-Term Memory, and Siamese Networks
    - It will focus on GRU, LSTM, and Siamese networks. In this chapter, we have discussed
    Simple Gated recurrent units with an understanding of input and cell update units.
    Furthermore, we discussed Full Gated Recurrent Units and showed the concept of
    relevance gate in full GRU. Furthermore, we covered the transition of GRU to LSTM.
    We have also seen various gates as input, output, and forget gate, and showed
    the importance of LSTM over RNN. Moreover, we comprehend the concept of back-propagation
    in LSTM. In this chapter, we have also discussed various applications of LSTM
    and types of long short-term memory networks such as vanilla, stacked, CNN, encoder–decoder,
    and bidirectional. Finally, Siamese networks and triplet loss function are discussed.


    Chapter 8: Generative Adversarial Networks - The chapter will mainly focus on
    the intuition of GAN. We have discussed the architecture of GAN along with the
    generator and discriminator function. Moreover, we discussed the working of backpropagation
    during the training process of GAN for classification between real and fake images.
    Furthermore, this chapter has discussed various types of GAN, such as Cycle GAN,
    Pix GAN, Dual GAN, Stack GAN, and so on. Finally, various applications of GAN
    in the real world are discussed in detail.'
  merge: -1
  img_proc: true
