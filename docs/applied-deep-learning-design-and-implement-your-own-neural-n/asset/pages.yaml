  md: 'to get the final original input image with the object detection. What is the
    problem with CNN being used for object detection?


    The problem here is when we divide the image into different regions and then perform
    the detection part, the detected object may have a different spatial location
    and also aspect ratios. For example, in some regions, the object may cover almost
    all of the region, whereas in some cases, the objects may cover only a small portion
    of the image region, and even the shapes of the objects may differ.


    To solve this issue, there will be a requirement for more number of regions, which
    will consume more computational power eventually. Therefore, to solve this issue,
    we use region-based CNN (RCNN).


    # Region-based CNN


    To solve the issue of working on a large number of regions of an input image,
    RCNN was proposed. This algorithm uses a number of boxes in an input image and
    checks if these boxes have any object present in them or not.


    The selective search algorithm is used in RCNN for extracting these objects from
    the input image. So, what is a selective search algorithm, and how it can be used
    to identify different boxes? The selective search algorithm takes an input image
    of any size, as shown in figure 5.44:


    ![](img/7e519fee1b702b91799cdf1664598392_396_0.png)


    Figure 5.44: Input image for selective search


    Then, the selective search algorithm generates the sub-segmentation of the input
    image, such that multiple boxes (regions) can be obtained from the image, as shown
    in figure 5.45:'
