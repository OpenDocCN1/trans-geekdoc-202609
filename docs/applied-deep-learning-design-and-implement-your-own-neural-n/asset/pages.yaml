  md: '# Loss calculation


    The error is calculated as the difference between the predicted and actual output.
    Here, we have used the squared error loss function, which is given as follows:


    ```

    l(W, B) = \sum_{i=1}^m 0.5 (O_i - Y_i)^2 \quad (3.40)

    ```


    Where W and B denote the corresponding weight and bias.


    ```

    l(W, B) = (0.50) * (0.710)^2 + 0,5 * (0.4)^2

    ```


    ```

    l(W, B) = 0.17

    ```


    # Calculating backpropagation of the error


    The main parameters of the backpropagation are bias and weight. While performing
    the parameter update, the aim is to change the bias, and weights should be changed
    in such a manner that the loss function reaches to 0. To achieve this, the values
    of actual output and targeted output should be close or the same.


    So, what should be the value of We if the value of l(W, B) = 0.


    In other words, we can say that how will l(W, B) change when there is a change
    in the value of We, which can be given as the partial derivative as follows:


    ```

    \partial l(W, B)/\partial W_e

    ```


    By using the chain rule:


    ```

    \frac{\partial l(W, B)}{\partial W_e} = \frac{\partial l(W, B)}{\partial y_1}
    * \frac{\partial y_1}{\partial i_3} * \frac{\partial i_3}{\partial W_e}

    ```


    ```

    \frac{\partial l(W, B)}{\partial y_1} = \frac{\partial(0.5(O_a - y_1)^2 - 0.5(O_b
    - y_2)^2}{\partial y_1}

    ```


    ```

    = 2 * 0.5(O_a - y_1)^{2-1}(-1) + 0

    ```


    ```

    = -(O_a - y_1)

    ```


    ```

    = -(0 - 0.710)

    ```


    ```

    = 0.710

    ```


    The main purpose of using 0.5 in the loss function is to keep the calculation
    of the derivative simple. We know that:


    ```

    \frac{\partial f(x)}{\partial x} = f(x) * [1 - f(x)]

    ```'
