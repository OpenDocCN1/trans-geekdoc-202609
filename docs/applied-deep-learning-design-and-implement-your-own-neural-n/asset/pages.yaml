    shape, and size compatibility:


    ![](img/7e519fee1b702b91799cdf1664598392_397_1.png)


    Figure 5.46: Combined regions


    Then, the final obtained region generates the detected locations also known as
    the regions of interest. RCNN uses the following steps to detect objects in an
    input image. The architecture of RCNN is shown in figure 5.47.


    +   - First, RCNN takes a pre-trained CNN.'
