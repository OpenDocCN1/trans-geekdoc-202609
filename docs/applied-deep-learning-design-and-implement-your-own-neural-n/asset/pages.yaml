    Applying the chain rule, we get the following:


    \(\Delta f(t) = \frac{\nabla E}{\nabla f(t)} = \frac{\nabla E}{\nabla c(t)} \times
    \frac{\nabla c(t)}{\nabla f(t)}\)


    Putting \(c(t) = i(t) \times o(t) + f(t) \times c(t - 1)\) in the preceding equation,
