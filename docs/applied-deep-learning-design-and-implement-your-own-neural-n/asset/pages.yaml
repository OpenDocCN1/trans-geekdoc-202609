    # Unsupervised learning


    In the case of unsupervised learning algorithms, updates of biases and weights
    are done in reply to input to the neural network only. Here, target outputs are
    not available. So, how can we provide training to a neural network if we do not
    even know what the neural network is supposed to perform? Many unsupervised learning
    algorithms execute a certain type of clustering algorithm.


    # Reinforcement learning


    The reinforcement learning method is almost analogous to the supervised-learning.
    The only difference is in the place of being delivered with the true output for
    each of the neural network inputs; here, the learning algorithm is only provided
    with a grade. The score or grade can be defined as a measure of the neural network’s
    performance with respect to a sequence of inputs. Reinforcement learning is not
    as common as supervised learning. It is most suitable for control system-based
    applications.


