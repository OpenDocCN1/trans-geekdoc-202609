  md: 'So, the updated value of \(\Delta c(t)\) is given as follows:


    \(\Delta c(t)_{updated} = \Delta c(t) + \nabla h(t) \times o(t) \times (1 - tanh^2(c(t)))\)


    Now, let us derive the backpropagation w.r.t. \((t)\); in the forward pass, we
    calculated the cell state output as follows:


    \(c(t) = i(t) \times o(t) + f(t) \times c(t - 1)\)


    Here, we need to find out the derivatives, such as \(\nabla i(t), \nabla o(t),
    \nabla f(t)\) and \(\nabla c(t - 1)\).


    First, let us calculate \(\nabla i(t)\)


    \(\Delta i(t) = \frac{\nabla E}{\nabla i(t)}\)


    Applying the chain rule, we get the following:


    \(\Delta i(t) = \frac{\nabla E}{\nabla i(t)} = \frac{\nabla E}{\nabla c(t)} \times
    \frac{\nabla c(t)}{\nabla i(t)}\)


    Putting \(c(t) = i(t) \times o(t) + f(t) \times c(t - 1)\) in the preceding equation,
    we get the following:


    \(\Delta i(t) = \frac{\nabla E}{\nabla i(t)} = \frac{\nabla E}{\nabla c(t)} \times
    \frac{\nabla (i(t) \times o(t) + f(t) \times c(t - 1))}{\nabla i(t)}\)


    Differentiating, we get the following:


    \(\Delta i(t) = \frac{\nabla E}{\nabla i(t)} = \Delta c(t) \times o(t)\)


    Thus,


    \(\Delta i(t) = \Delta c(t) \times o(t)\)


    Now, let us calculate \(\nabla o(t)\)


    \(\Delta o(t) = \frac{\nabla E}{\nabla o(t)}\)


    Applying the chain rule, we get the following:


    \(\Delta o(t) = \frac{\nabla E}{\nabla o(t)} = \frac{\nabla E}{\nabla c(t)} \times
    \frac{\nabla c(t)}{\nabla o(t)}\)


    Putting \(c(t) = i(t) \times o(t) + f(t) \times c(t - 1)\) in the preceding equation,
    we get


    \(\Delta o(t) = \frac{\nabla E}{\nabla o(t)} = \frac{\nabla E}{\nabla c(t)} \times
    \frac{\nabla (i(t) \times o(t) + f(t) \times c(t - 1))}{\nabla o(t)}\)'
