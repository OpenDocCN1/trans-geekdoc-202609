    as every region is passed through CNN separately |

    | Fast RCNN | 2 seconds | Every input image is provided to CNN once only where
    through which feature maps are extracted, then further selective search algorithm
    is used for making the predictions. It consists of a single model which is a combination
    of all the three models used in the RCNN. | Even fast RCNN uses a selective search
