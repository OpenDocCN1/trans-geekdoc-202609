    # # Convolution in 3-D


    In the previous sections, we have discussed 2-D convolution. Now, let us say we
    have a video, and we want to extract relevant features from different frames of
    the video. As we know, the video is nothing but a sequence of frames (images)
    that are moving with respect to time. So, if the refresh rate of the video is
    60 Hz, then it means that 60 frames are moving in one second, and each frame contains
    different information. The features associated with videos are called spatiotemporal
    features. The word spatiotemporal is the combination of two features—spatial,
    that is, (x,y), and temporal means (t), that is, time. So, to detect these spatiotemporal
    features in a video, we need to convolve it with a 3-D convolution:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/7e519fee1b702b91799cdf1664598392_283_0.png)


