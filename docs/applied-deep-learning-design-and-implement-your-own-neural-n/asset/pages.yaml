    # Different types of gradient descent algorithms


    Following are the various gradient descent algorithms. It includes the vanilla
    descent algorithm ADAGRAD, exploding and vanishing gradients.


    # Vanilla Descent algorithm


    The vanilla descent algorithm is one of the simplest gradient descent techniques.
    The word *vanilla* stands for purity or without any contamination. In the vanilla
    descent algorithm, we take small steps toward the direction of the global minima
    by determining the gradient of the cost function.


    Pseudo-code for the vanilla descent algorithm is given as follows:


    ```

    \( update = learning \ rate(\alpha) * gradient \ of \ the \ parameters \)

    \( parameter(new) = parameter(old) - update \)

    ```'
