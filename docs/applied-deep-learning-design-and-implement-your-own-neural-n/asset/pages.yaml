- pgno: 76
  md: 'Let us assume that a coin is flipped a few times, and we have got the results
    as "$y_1,.....,y_n$" which are either "HEADS" or "TAILS". Let "p" be the probability
    of getting "HEADS". Suppose the coin is tossed "100" times and "40" times we get
    "HEADS", then "p=0.4". By using MLE, we will prove that the guess of "p=\Sigma
    y_i / n" is the most likely value for "p".


    So, let us write the function of the likelihood.


    ```

    $L_Y(p) = f(y_i; p) = \prod_{y \in Y} p^{\Sigma y_i}(1-p)^{n-\Sigma y_i}$ (1.28)

    ```


    Now taking log both sides, we get:


    ```

    $log L_Y(p) = \Sigma y_i log p + (n - \Sigma y_i)log(1 - p)$ (1.29)

    ```


    To maximize, set the first derivative of the function to 0.


    ```

    $\frac{\partial log L_Y(p)}{\partial p} = 0$ (1.30)

    ```


    ```

    $\frac{\Sigma y_i}{p} - \frac{n-\Sigma y_i}{1-p} = 0$ (1.31)

    ```


    Solving, we get:


    ```

    $p = \frac{\Sigma y_i}{n}$ (1.32)

    ```


    Equation 1.32 represents the most likely value of p for our observation.


    # Statistical models


    A statistical model can be defined as a mathematical model that represents a set
    of statistical assumptions regarding sample data generation. The statistical model
    denotes the process of data generation. Table 1.18 gives a comparative analysis
    between statistical modeling and machine learning on the basis of various parameters:


    | Parameter | Statistical modeling | Machine learning |

    |---|---|---|

    | Graphs versus models | It uses models to make predictions. | Graphs are used
    for the training and testing of the data. |

    | Interval of confidence | Captures the uncertainty and variability of the parameters.
    | Captures the uncertainty in information gain. |

    | Parameters versus weights | Statistical modeling stresses more on the magnitude.
    Parameters are used here for the interpretation of the data. | In this case, weights
    are used to maximize hand-tuning and scoring accuracy. |

    | Distribution | Prior well-defined distribution is used. | The unknown prior
    distribution is used. |'
