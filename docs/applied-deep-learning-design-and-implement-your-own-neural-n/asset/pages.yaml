    # Different types of model-fitting and dropout in neural networks


    Model fitting is a method to measure how well a deep learning model shows the
    results on new testing data after being trained with the training data. Model
    fitting is divided into three parts: under-fitting, balanced-fitting, and over-fitting,
    as shown in figure 4.175:'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Balanced Fitting


    ![](img/7e519fee1b702b91799cdf1664598392_340_0.png)


    # Under Fitting


    ![](img/7e519fee1b702b91799cdf1664598392_340_1.png)


    # Over Fitting


    ![](img/7e519fee1b702b91799cdf1664598392_340_2.png)


    # Figure 4.175: Different types of model fitting


    Model fitting is very important in deep learning. If the model is not correctly
    fitted, then it may not provide correct or accurate outputs on the test data.


    Underfitting happens when a model can neither fit the training data nor work on
    the new test data. Under-fitting model even performs poorly on the training data
    itself. In figure 4.70, the under-fitting model is represented by a straight line,
    but it cannot even distinguish between the two types of classes.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Over-fitting happens when a model is trained with the *training data* at a
    higher extent. In this case, the users achieve a very good fit of the model on
    the training data itself. However, the model cannot work well with new test data.
    It simply means learning the parameters specifically to the training data, which
    does not work with the test data.


    So, the model has to be balanced-fitted so that it should work well for both the
    training and test data.


    The term *dropout* in neural networks refers to dropping out some units of layers
    in a neural network. In other words, dropout is the process of ignoring some units
    (neurons) in the training phase of neurons in the neural network. It is used to
    prevent over-fitting of data.


    So, dropping out means those neurons may not be considered in both forward pass
    and backward pass. Figure 4.176 shows the standard neural network:


    ![](img/7e519fee1b702b91799cdf1664598392_341_0.png)


    **Figure 4.176: Neural network**


    Figure 4.177 shows a neural network after applying dropout. We randomly drop some
    of the neurons, and then the error is adjusted using backpropagation. Large errors
    are adjusted a lot, whereas, in the case of small errors, they are adjusted a
    bit. In case of no error, we stop:'
  merge: -1
  img_proc: true
