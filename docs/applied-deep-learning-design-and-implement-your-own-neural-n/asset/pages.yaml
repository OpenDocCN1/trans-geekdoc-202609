    # Pooling in CNN


    Pooling is used for shrinking the image stack. It is used to reduce the size of
    features. It is independent of the parameters; that is, pooling does not require
    any parameters. It is noted that if we want to reduce the size of the image, then
    we have to use image processing methods such as bilinear interpolation. But, if
    we want to reduce the size of our feature or activation map, then pooling is used
    in CNN. In the case of big images, say 1024*1024, there are too many responses.
    So, to aggregate this information, pooling is used. Generally, max pooling is
    used to get a robust set of features. Max pooling gives the maximum value. It
    is a non-democratic approach; that is, no voting is considered, we just pick the
    maximum value. What is the advantage of pooling? It can be understood with a real-life
    example as follows. Consider we have a class of 80 students, and we have assigned
    a project to each one of them. So, if we assign that every student in the class
    has to submit an individual project, then we get 80 projects. Furthermore, we
    do not want to evaluate all of these'
  merge: -1
  img_proc: true
- pgno: 317
  md: '80 projects. So, to reduce our load, we change the approach by creating a group
    of four students and distributing one project among these four students. Now,
    by following this approach, we have to check 20 projects. Later on, we decide
    to give grades to the students of each group. So, to do differentiation among
    grades, we have to decide who did the maximum work among the four in the assigned
    project. Hence, we assign the maximum marks to the student who has contributed
    the most in the project. The same is the concept with Max pooling. We choose the
    maximum response among the set of responses, as shown in figure 4.138. The steps
    of max pooling are as follows:


    +   1. Pick a window size of two (refer figure 4.138)

    +   2. Pick a stride of two (refer figure 4.139)

    +   3. Move your window across activation maps (refer figures 4.140 and 4.142)

    +   4. From each window, pick the maximum value (refer figures 4.138 to 4.145)


    ![](img/7e519fee1b702b91799cdf1664598392_317_0.png)


    # Figure 4.138: Max pooling


    When we apply filters (questions) to the same pixel (x,y), then the pixel generates
    responses with respect to each and every filter (question) so that we have the
    pattern we are looking for. But when we aggregate all these responses of filters
    (averaging) for the same pixel, then no one answers that we have this pattern.
    If we use average pooling, then everything gets diminished. If we want to aggregate
    within the layer, then we use max pooling, as shown in figure 4.138. So, we use
    max pooling as it generates the maximum (high) response within a layer. Computation
    gets extensively reduced by virtue of pooling:'
  merge: -1
  img_proc: true
