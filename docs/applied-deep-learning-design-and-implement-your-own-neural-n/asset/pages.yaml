  md: 'Then, the correlation is given as follows:


    \( I(x, y).F = \begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{bmatrix}
    \cdot \begin{bmatrix} 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \end{bmatrix}
    = \begin{bmatrix} C_{11} & C_{12} & C_{13} \\ C_{21} & C_{22} & C_{23} \\ C_{31}
    & C_{32} & C_{33} \end{bmatrix} \)


    Suppose we want to calculate \( C_{22} \). Here, it is a central pixel. So, we
    can calculate the cross-correlation without any padding. The correlation for this
    point can be given as follows, that is, the Sum of product of the values except
    5 (five) that is at \( C_{22} \).


    \( C_{22} = 1 * \frac{1}{9} + 2 * \frac{1}{9} + 3 * \frac{1}{9} + 4 * \frac{1}{9}
    + 6 * \frac{1}{9} + 7 * \frac{1}{9} + 8 * \frac{1}{9} + 9 * \frac{1}{9} = 4.44
    \)


    \( = \begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{bmatrix} \cdot \begin{bmatrix}
    1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \end{bmatrix} = \begin{bmatrix}
    C_{11} & C_{12} & C_{13} \\ C_{21} & 4.44 & C_{23} \\ C_{31} & C_{32} & C_{33}
    \end{bmatrix} \)


    Similarly, suppose we want to calculate \( C_{11}() \). Now, this is a boundary
    pixel. So first, we have to do the padding (padding is done to match the size
    of the input image equal before processing) of zeros to the input image matrix
    as follows:


    \( I(x, y) = \begin{bmatrix} 0 & 0 & 0 & 0 \\ 0 & 1 & 2 & 3 \\ 0 & 4 & 5 & 6 \\
    0 & 7 & 8 & 9 \end{bmatrix} \)


    So,


    \( I(x, y).F = \begin{bmatrix} 0 & 0 & 0 & 0 \\ 0 & 1 & 2 & 3 \\ 0 & 4 & 5 & 6
    \\ 0 & 7 & 8 & 9 \end{bmatrix} \cdot \begin{bmatrix} 1/9 & 1/9 & 1/9 \\ 1/9 &
    1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \end{bmatrix} \)


    \( C_{11} = 0 * \frac{1}{9} + 0 * \frac{1}{9} + 0 * \frac{1}{9} + 0 * \frac{1}{9}
    + 0 * \frac{1}{9} + 2 * \frac{1}{9} + 0 * \frac{1}{9} + 4 * \frac{1}{9} + 5 *
    \frac{1}{9} = \frac{11}{9} \)


    Therefore, we obtain the following:


    \( \begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{bmatrix} \cdot \begin{bmatrix}
    1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \\ 1/9 & 1/9 & 1/9 \end{bmatrix} = \begin{bmatrix}
    \frac{11}{9} & C_{12} & C_{13} \\ C_{21} & 4.44 & C_{23} \\ C_{31} & C_{32} &
    C_{33} \end{bmatrix} \)


    # Convolution


    The other important term in image processing is convolution. The convolution process
    is almost the same as the correlation process but has a small difference. In the
    convolution process, the filter is first reversed by a 180-degree angle and then
    applied to the spatial domain of the image.'
