  md: 'Now, let us discuss different types of machine-learning techniques.


    # # Discriminative learning techniques


    Working with **discriminative models**, if one wants to predict the label Cᵢ for
    a given object D, then according to Naïve Bayes Theorem:


    P(A|B) = \frac{P(B|A)P(A)}{P(B)} \quad (1.1)


    Where P(A) is the probability of occurrence of event A. P(B) is the probability
    of occurrence of event B. P(B | A) is the probability of event B, given that event
    A has occurred. P(A | B) is the probability of event A, given that event B has
    occurred


    **Example 2:** We want to find out a patient’s probability of having cancer disease
    if they are alcoholic. **ABC** is the test to diagnose cancer disease.


    +   - A denotes the event *Patient has cancer disease*. Previous data tells us
    that 10% of patients coming to the clinic have cancer disease. P(A) = 0.2.

    +   - B denotes the event of the litmus test that the *Patient is an alcoholic*;
    5% of the clinic’s patients are alcoholics. P(B) = 0.08.

    +   - In total, 7% are alcoholics among those patients who are diagnosed with
    liver disease. This is B | A: the probability that a patient is alcoholic, given
    that they have cancer disease, is 5%.


    Applying the Naïve Bayes theorem, we get,


    P(A | B) = (0.05 * 0.2)/0.08 = 0.125.


    Therefore, there is a 12.5% probability that a patient has cancer if he is an
    alcoholic.


    Let "Cᵢ represents the label / class, and d represent the object. So, by applying
    Naïve Bayes theorem, we get, whether an object d belongs to a particular class
    Cᵢ or not.


    P(Cᵢ|d) = \frac{P(d|Cᵢ)P(Cᵢ)}{P(d)} \quad (1.2)


    where


    +   - P(Cᵢ) = Probability of the hypothesis Cᵢ.

    +   - P(d) = Probability of the object d

    +   - P(d|Cᵢ) = Probability of occurrence of d given Cᵢ.

    +   - P(Cᵢ|d) = Probability of occurrence of Cᵢ given d.'
  merge: -1
  img_proc: true
