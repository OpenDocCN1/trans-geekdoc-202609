- pgno: 509
  md: '![](img/7e519fee1b702b91799cdf1664598392_509_0.png)


    Figure 7.5: Input or potential cell update modulation gate \(\tilde{c}_t\) or
    \(c''(t)\) of LSTM


    Here, as the input gate uses the sigmoid activation function, it will again give
    values between 0 and 1.


    Now, because the LSTM cell equation performs the summation of previous state cells
    along with the current input, therefore, using the Sigmoid activation function
    can only help add more data to the memory and will not remove or forget data from
    memory. For example, if we have a floating-point number as output between 0 and
    1, then the number will never come to 0 as output, and thus, the data will never
    be forgotten by the memory. Therefore, we use the input modulation gate, which
    uses tanh activation function that gives the output in the range of -1 and 1,
    and thus, allowing the cell state the forget or remove the data from memory.


    The equation for the input modulation gate is given as follows:


    ```

    \(\tilde{c}_t = tanh[(W_c (h_{t-1}, x_t) + b_c]\)

    ```


    Or


    ```

    \(c''(t) = tanh[(W(c)[h(t - 1), x(t)] + b(c)]\)

