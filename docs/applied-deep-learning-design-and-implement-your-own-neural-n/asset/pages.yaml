    # # Huber loss


    It is the combination of both mean square error and mean absolute error. It is
    quadratic in nature for small errors and linear for large errors. It is denoted
    by the delta parameter.


    ```

    L_\delta = \{ 0.5(t - p)^2, \quad \text{if } |t - p| < \tau \\

    \tau |t - p| - 0.5\tau^2, \quad \text{Otherwise}

    ```


    where \(\tau\) is a parameter such that \(\tau \in \mathbb{R}^+\), and R is a
    real number.'
