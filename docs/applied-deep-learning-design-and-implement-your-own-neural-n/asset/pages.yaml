    In the field of machine learning and deep learning, probability distribution is
    a must concept to understand. It helps in better understanding and analysis of
    the huge amount of data, which is given as input to machine learning algorithms.
    Distributions help in better visualization of the data and understanding what
    is happening underneath. Let us begin to understand this concept with the help
    of a simple example. When we roll a die, there will be a chance for six possible
    outcomes, as it is a random event. We can represent the outcomes of a random event
    with the help of a random variable. If x is a random variable, then its probability
    distribution is described by p(x), which implies all the possible outcomes of
    a random event along with their corresponding probabilities.


    For the random variables having discrete value as an outcome, like flipping a
    coin or rolling a die, discrete probability distributions are used for representation.
    And for those random variables whose outcomes are continuous, like the price of
    houses, it is better to describe them with continuous probability distributions.


    There are more than 20 different types of probability distributions widely used
    in the field of data science in both discrete and continuous space to model various
    real-life phenomena, such as normal, binomial, exponential, Poisson distribution,
    and many more. Some of the well-known distributions are shown in figure 8.5:


