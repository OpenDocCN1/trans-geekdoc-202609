    # Clustering


    It is a kind of learning method which is unsupervised. A learning method is said
    to be unsupervised in which we have to draw the references from the given datasets
    containing input data but do not have any labelled responses. Usually, it can
    be used as a process to discover the expressive structure, descriptive underlying
    procedures, procreative features, and grouping characteristics in the set of examples
    of a dataset.


    Clustering is the assignment of separating the data points or population into
    a number of clusters so that the data points, which belong to the same groups,
    become more similar to other data points of the same group, and become more unlike
    the data points of the other groups. It is essentially an assembly of substances
    on the source of likeness and unlikeness among them.


    For example, figure 1.32 shows the data points, which are clustered, composed,
    and can be categorized into a category of a single group:'
