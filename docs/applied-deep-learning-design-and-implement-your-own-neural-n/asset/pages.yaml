    # # Dual GAN


    Image-to-image translations come under the computer vision and image processing
    field, where images from one domain are mapped into another domain. Image-to-image
    translations have a scope in numerous applications such as black and white to
    colored transfer, stylization, image segmentation, season transformations, sketches-to-photos,
    and so on. The previously-discussed models in this domain, that is, conditional
    GAN, have shown improvements in this field, but it requires labeled data on which
    the training of the model is conditioned. Now, the main issue with conditional
    GAN is the non-availability of labeled data and the difficulty in converting huge
    datasets with millions of images to labeled datasets. To overcome this need for
    labeled data for GAN training, Zili proposed a novel approach, Dual GAN, which
    is an unsupervised dual-learning framework inspired by the Dual-learning approach
    in natural language translations. In this dual-learning approach for natural language
    translation, two different language translators are trained simultaneously, for
    example, Chinese-to-Russian and Russian-to-Chinese. In this arrangement, one translation
    becomes the primal task, and the reverse translation becomes the dual-task. Now,
    while working in pairs under closed-loop forces both translators to learn through
    reinforcement learning.


    Figure 8.14 features the architecture of dual-GAN:


    ![](img/7e519fee1b702b91799cdf1664598392_586_0.png)


    Figure 8.14: The architecture of dual-GAN'
  merge: -1
  img_proc: true
- pgno: 587
  md: 'Inspired by the preceding concept, dual GAN is trained in an unsupervised manner,
    where two unlabeled and unpaired datasets belonging to the source(U) and target(V)
    image domains, respectively, are used for training. As shown in figure 8.14, there
    are two generator networks and two discriminator networks used to implement their
    approach.


    Now, the primal task of the dual GAN is to train the generator GA that can map
    from domain U to V, that is, (GA: U → V), and the reverse task, that is, the dual
    task, is to train generator GB that can map in reverse from domain V to U that
    is, (GB: V →U). To measure the learning progress of both the generators GA and
    GB, two discriminators, DA and GB, respectively, are there that can identify the
    fake and real images from their corresponding domains.


    Table 8.5 shows the inputs, outputs, and aims of generator and discriminator networks
    in dual-GAN:


    | DualGAN | Input | Output | Aim |

    |---|---|---|---|

    | Generator (GA) | Noise Vector (z) and images from domain:U | New generated samples
    in domain:V | Realistic new samples in domain:V |

    | Generator (GB) | Noise Vector (z) and images from domain:V | New generated samples
    in domain:U | Realistic new samples in domain:U |

    | Discriminator (DA) | Real and generated samples by GA in domain:V | Probability
    score to identifying real or fake samples in domain:V | Correctly identify between
    real or fake sample in domain:V |

    | Discriminator (DA) | Real and generated samples by GB in domain:U | Probability
    score to identifying real or fake samples in domain:U | Correctly identify between
    real or fake sample in domain:U |


    Table 8.5: Inputs, outputs, and aim of generator and discriminator networks in
    dual-GAN


    The loss function computed is used to provide feedback for updates in the corresponding
    models.


    # # Pix-to-Pix GAN


    Pix-to-pix GAN is based on the conditional GAN, which gives control over target
    image generation in image-to-image translation, conditioned on some input images
    instead of class or label or tags. This model was suggested by Phillip in the
    year 2018 paper Image-to-image translations with conditional adversarial networks.
    This model is'
  merge: -1
  img_proc: true
- pgno: 588
  md: 'designed to make it useful for general image-to-image translations. As the
    name itself suggests, Pix2pix images are translated on a pixel-by-pixel basis.
    The generator and discriminator networks are doing the usual tasks discussed in
    the previous models. The discriminator identifies real and fake images and the
    generator’s aim is to generate images to make the discriminator confused but on
    a pixel-by-pixel basis. The Pix-to-pix model is trained in both the source and
    target image pairs. By image pairs, it means that if a GAN is to be trained to
    translate day-time images to night-time images, then we need the exact same images
    taken at the day-time and at night-time, respectively. As this model is for general
    purposes, it can be trained on a wide range of image translations such as image-to-sketch,
    day-to-night images, aerial view-to-map view, thermal-to-colored photos, and so
    on, as shown in figure 8.15:


    ![](img/7e519fee1b702b91799cdf1664598392_588_0.png)


    Figure 8.15: Generator structure in pix-to-pix GAN


    Pix-to-pix GAN uses U-Net architecture which is similar to auto-encoders architecture.
    Auto-encoders are artificial neural networks that can be used in computer vision
    for unsupervised learning. Auto-encoders consists of two main components: an encoder
    and a decoder. The encoder function is to extract the main features of the image
    and reduce it to a compressed latent representation (or bottleneck). The second
    component is the decoder, which takes this latent representation as input and
    tries to reconstruct the original image out of it.


    Figure 8.16 shows the basic structure of encoder–decoder in auto-encoders. Auto-encoders
    are generative models in which the encoder takes an input image and compresses
    or downsamples it to some representation, layer by layer. This is taken as input
    by the decoder to upsample or un-compress it and regenerate the image again over
    some layers, as shown in figure 8.16:'
  merge: -1
  img_proc: true
- pgno: 589
  md: '![](img/7e519fee1b702b91799cdf1664598392_589_0.png)


    # Figure 8.16: Auto-encoder architecture


    In this down-sampling up-sampling process, some low-level and local information
    gets lost during the process of compression. It is very crucial in image-to-image
    translations to share this low-level information between the input and output
    layers. So, to overcome this issue, U-Net uses skip-connections among corresponding
    encoder–decoder layers having the same sized feature map to pass on this local
    information and be able to generate sharp images.


    Figure 8.17 shows the U-Net architecture and the skip connection in between the
    layers. It is called U-Net because of the formation of a U-like shape due to these
    skip connections in between the corresponding layers of encoder and decoder. The
    authors have used Patch GAN (a term coined by authors), in which the model takes
    an n*n patch image and predicts real or fake for every pixel in that patch, thereby
    giving sharp and detailed images, as needed, for example, image-to-sketch translations:


    ![](img/7e519fee1b702b91799cdf1664598392_589_1.png)


    # Figure 8.17: U-net architecture'
  merge: -1
  img_proc: true
