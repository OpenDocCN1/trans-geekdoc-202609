  md: '# Manhattan distance


    Say there are four points or locations, as shown in figure 7.28:


    ![](img/7e519fee1b702b91799cdf1664598392_537_0.png)


    Figure 7.28: Manhattan distance metric


    Now, we want to find out the distance between two locations; we use Manhattan
    distance here. Manhattan distance is defined as the sum of the absolute distance
    of their coordinates.


    Mathematically, the Manhattan distance is given as follows:


    ```

    D(A, B) = |x1 - x2| + |y1 - y2|

    ```


    # Cosine similarity for sparse vector or sparce data set


    It determines the normalization of two objects, therefore, finding the angle of
    separation θ. It judges the two input vectors rather than their magnitude. Here,
    the data objects are considered vectors:


    ![](img/7e519fee1b702b91799cdf1664598392_537_1.png)


    Figure 7.29: Cosine angle similarity'
