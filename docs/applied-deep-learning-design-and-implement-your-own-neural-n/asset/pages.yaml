  md: '![](img/7e519fee1b702b91799cdf1664598392_447_0.png)


    # Figure 6.27: RNN input-output model


    Permutation matrix:


    ```

    \[ \begin{bmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{bmatrix} \begin{bmatrix}
    a \\ b \\ c \end{bmatrix} = \begin{bmatrix} c \\ a \\ b \end{bmatrix} \tag{6.1}
    \]

    ```


    As we can see permutation matrix makes different permutation as \(\begin{bmatrix}
    a \\ b \\ c \end{bmatrix}\) will get converted into \(\begin{bmatrix} c \\ a \\
    b \end{bmatrix}\) and if we provide \(\begin{bmatrix} c \\ a \\ b \end{bmatrix}\)
    as input then \(\begin{bmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{bmatrix}
    \begin{bmatrix} c \\ a \\ b \end{bmatrix} = \begin{bmatrix} b \\ c \\ a \end{bmatrix}\)
    and further if we take \(\begin{bmatrix} b \\ c \\ a \end{bmatrix}\) as input
    then \(\begin{bmatrix} 0 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 0 \end{bmatrix} \begin{bmatrix}
    b \\ c \\ a \end{bmatrix} = \begin{bmatrix} a \\ b \\ c \end{bmatrix}\). So we
    got a cyclic order using permutation matrix \(\begin{bmatrix} a \\ b \\ c \end{bmatrix}
    \rightarrow \begin{bmatrix} c \\ a \\ b \end{bmatrix} \rightarrow \begin{bmatrix}
    b \\ c \\ a \end{bmatrix} \rightarrow \begin{bmatrix} a \\ b \\ c \end{bmatrix}\).
    Similarly, in figure 6.28 permutation'
  merge: -1
  img_proc: true
