    # Importance of ReLU in the convolution layer


    We have discussed the ReLU activation function in the previous chapters. It stands
    for the rectified linear unit. It helps in adding the non-linearity to a learning
    model, which helps in better training of the model weights for any generalized
    case.


    Figure 4.77 shows the curve for the ReLU activation function:


    ![](img/7e519fee1b702b91799cdf1664598392_284_0.png)


    **Figure 4.77:** ReLU activation function


    For values less than 0, the ReLU does not update the parameters, and all the negative
    values are referred to as zero. So, the ReLU function removes the negative values.
    It provides output as $x$ if $x$ is positive and 0 if the value of $x$ is negative.'
  merge: -1
  img_proc: true
