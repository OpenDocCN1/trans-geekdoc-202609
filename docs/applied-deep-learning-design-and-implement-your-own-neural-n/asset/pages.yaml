    # Basics of generative models


    Deep learning primarily deals with supervised and unsupervised learning, along
    with two major categories of models: descriptive models and generative models.
    One should have a clear idea about these terms to have a better understanding
    of these concepts.


    Supervised learning is currently a dominating branch of deep learning, which deals
    with discriminative models. Here, the algorithm learns the mapping from the input
    (variable X) to the output (variable Y). The main goal of the algorithm is to
    learn this mapping efficiently, such that when a new input is given to the algorithm,
    it can predict the correct output. Generally, most of the deep learning applications
    today belong to this category. For example, image classification, natural language
    processing, speech recognition, object detection, and so on.'
  merge: -1
