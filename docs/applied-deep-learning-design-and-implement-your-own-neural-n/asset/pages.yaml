    # ## Introduction


    A neural network can be defined as a network consisting of a cluster of nodes
    or neurons. A neural network can be either biological, consisting of biological
    neurons, or artificial neural networks for solving problems related to Artificial
    Intelligence (AI). This chapter covers the basic concepts related to AI, such
    as neurons, neural networks, and feed-forward and backpropagation neural networks.
    In this chapter, we briefly describe the basic concepts of activation function
