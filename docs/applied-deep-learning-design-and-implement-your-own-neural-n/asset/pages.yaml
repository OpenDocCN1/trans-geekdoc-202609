- pgno: 565
  md: 'In terms of the data distribution, discriminative models classify the data
    points of the input data distribution, or in other words, what input data points
    belong to which output class. Discriminative models learn the boundaries of the
    classes present in the input distribution. Unsupervised learning is another branch
    of deep learning that is gaining popularity these days. It involves summarizing
    or automatically learning and discovering the patterns present in the data distribution
    or understanding the correlation present in the input data, such that it can generate
    new data samples that match the input data distribution and appears to belong
    to the original dataset.


    After training, when a random input is given to the generative model, it tries
    to transform it into a new sample that appears to belong to the input original
    dataset. So, in general terms, generative models summarize the data distributions.
    Nowadays, these generative models are gaining popularity because of the scope
    they are providing in generating new plausible samples that do not exist in the
    dataset and giving a chance to create a robust dataset. With a versatile dataset,
    deep learning models could learn better and perform successfully.


    # ## Generative adversarial networks


    For a better understanding of GAN, try to understand the individual term in GAN
    as follows:


    +   - **Generative**: That is capable of generating something new.

    +   - **Adversarial**: That works competitively.

    +   - **Network**: Any deep learning model.


    The name itself suggests the basic idea behind GANs. It is an unsupervised deep
    learning architecture in which two deep learning models, such as neural networks
    or convolutional neural networks, are trained in an adversarial manner to generate
    new samples.


    # ## GAN architecture


    The GAN architecture involves two sub-networks working in an adversarial manner,
    a generator (G) and a discriminator (D). Here both the generator and the discriminator
    are neural networks.'
