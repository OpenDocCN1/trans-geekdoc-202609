    # # Vanishing gradient and exploding gradient problems in RNN


    So, in vanishing gradient, what happens is when we get the predicted output from
    the model, we calculate the error by subtracting the predicted output from the
    actual output as follows:


    $e = Actual Output - Predicted Output$


    So, we calculate the error using the preceding equation. Now, after that, we calculate
    the change in error concerning the change in weight or concerning any other variable
    by using the following equation:


    \(\Delta w = n.\frac{\partial e}{\partial w}\)


    Where w is the weight of the parameter and n is the learning rate here. Then,
    we must add the change in weight to the old weight to get a new weight as follows:


    $w = w + \Delta w$'
