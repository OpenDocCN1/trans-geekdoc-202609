    \(\begin{bmatrix} z_1 \\ z_2 \\ z_3 \end{bmatrix} = tanh(w^T x + b)\)


    \( x = \begin{bmatrix} 0 & 3.5 \\ 1 & 2 \\ 1 & 0.5 \end{bmatrix}_{3*2} \)


