  md: '# Overview of VPC


    +   VPC peering is a concept used to connect a VPC network in one project to another
    or across two different organizations. Permissions are required at each end to
    authorize the creation of a VPC peer with no IP address overlaps.


    +   There are multiple options to secure hybrid connectivity; you can connect
    your on-premises environment to Google Cloud with a VPN or a dedicated interconnect.
    We will look at hybrid connectivity in more detail later in the chapter, under
    the Hybrid connectivity options section.


    +   For cases where you need to access Access Service Edge and Software Defined-Wide
    Area Network (SD-WAN) and you require the use of Generic Routing Encapsulation
    (GRE), you can use VPC, which supports GRE. Other options as VPN and Interconnect
    support the tiers, Tier Tier and the same capability. You can terminate GRE on
    your instance and forward the traffic to its respective location.


