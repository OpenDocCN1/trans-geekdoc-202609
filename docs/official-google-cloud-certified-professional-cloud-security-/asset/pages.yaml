- pgno: 273
  md: 'The EKM creation flow is as follows:


    +   Establish an account with the partner. They have their own portal where you
    manage the keys.

    Create a key or use an existing key. This has a unique URI or key path. Copy this
    path to use in Step 4.

    Next, grant your Google Cloud project workload service account access to the key
    in the external key management partner system.

    In your Google Cloud project, you create a Cloud EKM key, using the URI or key
    path for the externally managed key.


    While Cloud EKM seems like a great option to use, there are some considerations
    you should be aware of:


    +   Cloud EKM can be used with Hosted Private HSM to create a single-tenant HSM
    solution integrated with Cloud KMS. Choose a Cloud EKM partner that supports single-tenant
    HSMs.

    When you use a Cloud EKM key, Google has no control over the availability of your
    externally managed key in the partner system. Google cannot recover your data
    if you lose your keys outside of Google Cloud.

    Review the guidelines about external key management partners and regions when
    choosing the locations for your Cloud EKM keys.

    Review the Cloud EKM service-level agreement (SLA).

    Communicating with an external service over the internet can lead to problems
    with reliability, availability, and latency. For applications with a low tolerance
    for these types of risks, consider using Cloud HSM or Cloud KMS to store your
    key material.

    You will need a support contract with the external key management partner. Google
    Cloud support can only provide support for issues in Google Cloud services and
    cannot directly assist with issues on external systems. You may need to work with
    support on both sides to troubleshoot interoperability issues.


    # Restrictions


    Here are some general restrictions you should be aware of while using Cloud EKM:


    +   Automatic rotation is not supported.

    When you create a Cloud EKM key using the API or the Google Cloud CLI, it must
    not have an initial key version. This does not apply to Cloud EKM keys created
    using the Cloud console.

    Cloud EKM operations are subject to specific quotas in addition to the quotas
    on Cloud KMS operations.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "When it comes to symmetric encryption keys, be aware of these restrictions:\n\
    \n+   * Symmetric encryption keys are only supported for the following:\n    *\
    \ CMEKs in supported integration services\n    * Symmetric encryption and decryption\
    \ using Cloud KMS directly\n    * Data that is encrypted by Cloud EKM using an\
    \ externally managed key cannot be decrypted without using Cloud EKM\n\nWhen it\
    \ comes to asymmetric signing keys, be aware of these restrictions:\n\n+   * Asymmetric\
    \ signing keys are limited to a subset of Cloud KMS algorithms\n    * Asymmetric\
    \ signing keys are only supported for the following:\n        * Asymmetric signing\
    \ using Cloud KMS directly\n        * Custom signing key with Access Approval\n\
    \    * Once an asymmetric signing algorithm is set on a Cloud EKM key, it cannot\
    \ be modified\n    * Signing must not be on the data field\n\nNow that you understand\
    \ various Cloud KMS offerings, let us look at some of the best practices for Cloud\
    \ KMS.\n\n# Cloud KMS best practices\n\nKey access and ring access are managed\
    \ by organizing keys into key rings and projects, and by granting IAM roles to\
    \ the keys, key rings, and projects. As you build your cloud environment, follow\
    \ the guidance in the following list for how to design your key resource hierarchy\
    \ to reduce risk:\n\n+   * Create a dedicated project for Cloud KMS that is separate\
    \ from workload projects.\n* Add key rings into the dedicated Cloud KMS project.\
    \ Create key rings as needed to impose a separation of duties.\n* Monitor privileged\
    \ admin operations: key deletion operations for out-of-band key creation are considered\
    \ a privileged operation.\n* Review CMEK-related findings in Security Command\
    \ Center.\n* Use encryption keys with the appropriate key strength and protection\
    \ level for data sensitivity or classification. For example, for sensitive data,\
    \ use keys with a higher strength. Additionally, use encryption keys with different\
    \ protection levels for different data types."
  merge: -1
