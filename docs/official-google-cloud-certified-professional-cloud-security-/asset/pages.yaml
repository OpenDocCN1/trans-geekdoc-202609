- pgno: 163
  md: 'At the time of writing, Google has a presence in more than 200 countries, with
    29 regions, 88 zones, and 146 PoP or edge locations. As part of Google''s strategy
    to expand, there are more regions announced every year.


    Each region has at least two zones, and some have more than two zones to provide
    additional capacity and resilience. This is dictated by demand. As a rule of thumb,
    there are always two zones to provide fault tolerance and high availability. In
    order to address the resiliency and availability of your services, it is highly
    recommended to identify them, which is `<region>`, for example, us-central. Furthermore,
    a, b, or c is used to identify the zone, for example, us-east1-a. You can select
    any of these zones to deploy your cloud services, as compute instances.


    Google Cloud service availability is also region-specific. You can see whether
    the service you want is available in the region of choice by navigating to `https://packt.link/ehHg8`.


    We will now take a look at different types of resources that are either global,
    regional, or zonal in nature. As names suggest, global resources are global in
    nature, which means when configured inside a project, these resources can be accessed
    by any other resource in any zone as long as they are in the same project. VPC
    networks, firewall rules, routes, images, and snapshots are all examples of global
    resources.


    Regional resources are only available in the region; for example, the subnets
    that you create are accessible only in the regions they are in and cannot cross
    a regional boundary. Some examples of regional resources include managed instance
    groups and cloud interconnects.


    Zonal or per-zone resources are created in a zone and are available only within
    that zone. A compute instance that is created requires a zone to be specified
    where the resource will exist. This resource can access any other global or regional
    resources but cannot access any other per-zone resource, such as a disk.


    > Note

    For more details on which services are global, regional, or zonal, you can refer
    to `https://packt.link/41g8M`'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# VPC deployment models


    VPC can be deployed in different models based on your network architecture requirements.
    In this section, we will look at the different models that are available and how
    you can create them. We will look at the two VPC modes that can be used to create
    a VPC network: auto mode and custom mode. After that, we will look at Shared VPC
    networks, what they are, and how to create one. In the next section, we will go
    over VPC peering, a technique for connecting VPCs that are located in different
    organizations but can be connected peers.


    ![](img/f681dfc12450e3a4c257352b70dbceca_164_0.png)


    Figure 7.3 – Google network components


    We will use the illustration shown in Figure 7.3 to understand a few concepts
    before we jump into the deployment models. A VPC as a resource is created inside
    the project and is global in nature. Once you create the VPC network, you have
    the option to create a global VPC with all regions in scope or customize which
    region(s) you want to use. We will look at this in the next section on how to
    create a VPC using the two modes. Within each region, there are zones. You can
    select one, two, or three (if available) zones to create resources. For example,
    to create an instance, you need to specify which zone you want to use in which
    region. Furthermore, you can create subnets inside the zone. We will cover how
    to create subnets in the following sections, but in Google Cloud, subnets are
    regional resources; therefore, they can span across zones, as shown in Figure
    7.3. In summary, you can create a single VPC network spanning multiple regions
    and provide connectivity to your cloud resources.'
