    # Importing a key (BYOK)


    Google allows you to bring your own cryptographic key material. You can import
    that using Software or Cloud HSM protection level. We will step-by-step instructions
    on how to do this. Before we do that, let us understand the reasons why you want
    to import a key:


    +   - You may be using cryptographic keys that were created on your premises or
    in an external KMS.

    - If you migrate an application to Google Cloud or you add cryptographic support
    to an existing Google Cloud application, you can import the relevant keys into
    Cloud KMS.

    - As part of import, Cloud KMS generates a wrapping key, which is a public/private
    key pair, using one of the supported import methods. Encrypting your key material
    with this wrapping protects your material in transit.

    - This KMS public wrapping key is used to encrypt, on the client, the key to be
    imported. The private key making this public key is stored within Google Cloud
    and is used to unwrap the key after it reaches the Google Cloud project. The import
    method you chooses determines the algorithm to create the wrapping key.


    We begin to go over instructions on how to bring your key, make sure of the following
    prerequisites:


    +   - Prepare the local system by choosing one of the following options. Automatic
    key wrapping is recommended for most users.

