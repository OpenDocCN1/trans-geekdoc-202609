- pgno: 436
  md: '# Container Security


    +   - **GKE console:** In the **Kubernetes Engine** section of the Google Cloud
    console, select the Kubernetes nodes listed in Workloads, and then the **Container**
    or **Audit Logs** link.

    - **Monitoring console:** In the **Kubernetes Engine** section of the Monitoring
    console, select the appropriate cluster, nodes, pods, or containers to view the
    associated logs.

    - **gcloud command line tool:** Using the `gcloud logging` read command, select
    the appropriate cluster, node, pod, and container logs.


    These are all the methods of logging that should be conversant with. Here are
    some best practices for containerized applications when it comes to logging:


    +   - Use the native logging mechanisms of containers to write the logs to `stdout`
    and `stderr`.

    - If your application cannot be easily configured to write logs to `stdout` and
    `stderr`, you can use a sidecar pattern for logging.

    - Log directly with structured logging with different fields. You can search your
    logs more effectively on those fields.

    - Use severities for better filtering and reducing noise. By default, logs written
    to the INFO level and logs written to the standard error are on the ERROR level.
    Structured logs with a JSON payload can include a severity, which defines the
    log severity.

    - Use the links to the logs directly from the **Kubernetes Engine** section of
    the Console for containers, which makes it quick to find the logs corresponding
    to the container.


    Now that we have logging and auditing out of the way, let us move on to understand
    how GKE does isolation.


    # Network Policies


    Use Kubernetes NetworkPolicies for certain applications in your cluster if you
    wish to manage traffic flow at the IP address or port level (OSI layer 3 or 4).
    Network policies are an application-centric construct that allows you to declare
    how a pod can communicate across the network with various entities (we use the
    term *entity* to avoid confusing terms like *endpoints* and *services*, which
    have unique Kubernetes implications). Other connections are not affected by NetworkPolicies
    since they have a pod on one or both ends.


    To manage communication between your cluster''s pods and services, you can utilize
    GKE''s network policy enforcement. Pod-level firewall rules are created using
    the Kubernetes Network Policy API to construct a network policy. These firewall
    rules control which pods and services in your cluster communicate with one another.


    When your cluster is hosting a multi-level application, defining a network policy
    allows you to enable things such as defense in depth. For example, you can set
    up a network policy to prevent a compromised frontend service from communicating
    directly with a billing or accounting server many tiers down.'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'A network policy can also help your application host data from several users
    at the same time. You can, for example, define a tenant-per-namespace paradigm
    to provide secure multi-tenancy. Network policy rules can ensure that pods and
    services in one namespace cannot access pods and services in another namespace
    in such a model.


    Another form of network isolation is by using a feature called GKE private clusters,
    whereby you can host a private cluster, that is, a cluster with no public IP address.
    Let us understand this.


    # GKE private clusters


    In private clusters, nodes only have internal IP addresses to isolate nodes from
    inbound and outbound connectivity to the internet.


    Worker nodes in a private cluster only have internal IP addresses. The control
    plane, on the other hand, has both a private and a public destination. When creating
    a private cluster, you can disable access to the public endpoint. An internal
    load balancer provides access to the private endpoint. If you wish to reach the
    control plane from a GCP region other than where it is deployed, you will need
    to allow global access. Let us look at the architecture of private clusters now:


    ![](img/f681dfc12450e3a4c257352b70dbceca_437_0.png)


    Figure 15.4 – Private clusters


    As seen in Figure 15.4, using a private cluster has the additional security benefit
    that nodes are not exposed to the internet. As with public clusters, you can also
    use GKE''s authorized networks feature with private clusters to restrict access
    to the master API.'
  merge: -1
  img_proc: true
- pgno: 438
  md: 'A service mesh is an increasingly popular method of implementing network policies
    for GKE. We will understand that now.


    # Service mesh


    A service mesh is a Layer 7 proxy. Microservices can use this service mesh to
    abstract the network. This effectively abstracts inter-process and service-to-service
    communications are handled as a set of network proxies. These proxies, in Kubernetes,
    the service mesh is usually implemented as a sidecar of an application, serve
    as an entry point for service mesh functionality and manage communication between
    microservices. Istio is a popular open service mesh that connects, manages, and
    secures microservices in a consistent manner. It allows you to manage traffic
    flows between services, enforce access controls, and aggregate telemetry without
    modifying the service code. The following are the benefits that Istio offers:


    +   - Automatic load balancing for HTTP, gRPC, WebSocket, MongoDB, and TCP traffic

    - Fine-grained control of traffic behavior with routing rules, retries, failovers,
    and fault injection

    - A configurable policy layer and API that supports access controls, rate limits,
    and quotas

    - Automatic metrics, logs, and traces for all traffic within a cluster, including
    cluster ingress and egress

    - Secure service-to-service communication in a cluster with strong identity-based
    authentication and authorization

    - You configure Istio access control, routing rules, and so on by using a custom
    Kubernetes API, either via kubectl or the Istio command-line tool istioctl, which
    provides extra validation


    Google recommends using Anthos Service Mesh, Google''s full-supported distribution
    of Istio.

    When you create or update a cluster with Istio on GKE, the core Istio components
    are installed:


    +   - The istio control plane, which provides the following:

    - Traffic management

    - Security

    - Observability

    - The Istio ingress gateway, which provides an ingress point for traffic from
    outside the cluster


    The installation also adds you the Istio sidecar proxy to your service workloads,
    allowing them to communicate with the control plane and join the Istio mesh.


    So far, we have understood the GKE security features. Now, we will look at how
    to secure a container image, which can be a source of vulnerability.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# Container image security


    Container images are *baked* by a pipeline, a series of steps that add the required
    components on each other. The application is deployed on the very top, as a last
    step. The following figure shows the process of a container pipeline published
    by NIST.


    ![](img/f681dfc12450e3a4c257352b70dbceca_439_0.png)


    Figure 15.5 – Container pipeline


    In 15.5, as recommended by NIST `https://packt.link/luNhB`, the container pipeline
    follows a controlled process for image generation:


    +   1. Developer systems generate images and send them for testing and accreditation.

    2. Testing and accreditation systems validate and verify the contents of images,
    sign images, and send images to the registry.

    3. Registries store images and distribute them to the orchestrator upon request.

    4. Orchestrators convert images into containers and deploy containers to hosts.

    5. Hosts run and stop containers as directed by the orchestrator.


    Now that you understand what the pipeline does, here are some best practices for
    container image security recognized by Google:


    +   * Use Google-maintained base images

    * Do not rely on packages in third-party repositories (if possible, host an internal
    repository of the packages that are scanned for vulnerability)

    * Do not include secrets in images'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Container Security


    +   - Scan images for vulnerabilities

    - Stop the deployment of the container if the images do not pass attestations
    (see the Binary Authorization section later in the chapter)


    Now that you understand the best practices for image security, let us see how
    to scan an image for vulnerabilities on Google Cloud.


    # Container vulnerability scanning on Google Cloud


    Container scanning is a service on Google Cloud that identifies known vulnerabilities
    in Debian, Ubuntu, Alpine, Red Hat, and CentOS packages inside the container on
    GCP. This feature can be enabled in Artifact Registry.


    There are two types of scans supported by container scanning:


    +   - On-demand scanning: Using the gcloud CLI, you may scan images locally on
    your PC or in your registry on demand. This gives you the freedom to tailor your
    CI/CD pipeline to your specific needs, for example, when you need to obtain vulnerability
    results.

    - Automated scanning: Container Analysis searches images in Artifact Registry
    and Container Registry for vulnerabilities and keeps the vulnerability information
    up to date. Scanning and continuous analysis are the two major jobs in this technique.


    When new images are uploaded to Artifact Registry or Container Registry, Container
    Analysis examines them. This extracts information on the container''s system packages.
    Based on the image''s digest, the images are only scanned once. This means that
    adding or changing tags will not result in new scans; only changing the image''s
    content would. Here is what happens when you enable scanning:


    +   - When you upload an image, Container Analysis occurs occurrences for vulnerabilities
    found. It continually checks the information for scanned images in Artifact Registry
    and Container Registry for additional vulnerabilities after the initial scan.

    - Container Analysis changes the metadata of the scanned images as new and updated
    vulnerability information is received from vulnerability sources, establishing
    new vulnerability occurrences for fresh images, and eliminating vulnerability
    occurrences that are no longer valid.

    - Container Analysis only updates vulnerability metadata for images pushed or
    pulled in the previous 30 days. Vulnerability metadata older than 30 days is archived
    by Container Analysis. To re-scan an image with archived vulnerability metadata,
    push or pull that image.'
  merge: -1
  img_proc: true
- pgno: 441
  md: "You can also utilize manifest lists to scan for vulnerabilities. A manifest\
    \ list is a collection of links to manifest files for various platforms. They\
    \ allow a single image to work with numerous system architectures or variations.\
    \ Only Linux amd64 images are supported by Container Analysis vulnerability scanning.\
    \ Please note that if your manifest list points to more than one Linux amd64 image,\
    \ only the first one will be scanned.\n\nContainer scanning uses the following\
    \ severity levels:\n\n+   * Critical\n* High\n* Medium\n* Low\n* Minimal\n\nThere\
    \ are two types of severity associated with a vulnerability:\n\n+   * Effective\
    \ severity: The Linux distribution's designated severity level. Container scanning\
    \ employs the severity level supplied by the provider if distribution-specific\
    \ severity levels are not available.\n* CVSS score: The Common Vulnerability Scoring\
    \ System (CVSS) score and associated severity level, with two scoring versions:\n\
    \    * CVSS 2.0: Available when using the API, the Google Cloud CLI, and the GUI\n\
    \    * CVSS 3.1: Available when using the API and the gcloud CLI\n\nNow that you\
    \ understand container vulnerability scanning, let us see how to gate your deployment\
    \ in case there are vulnerabilities or a critical step in the container pipeline\
    \ is missing.\n\n# Binary Authorization\n\nYou can utilize Binary Authorization\
    \ to construct a vulnerability allowlist as part of your Cloud Build workflow\
    \ based on the vulnerability information provided by Container Analysis. The build\
    \ will fail if the vulnerabilities contradict the allowlist's policy."
  merge: -1
  img_proc: true
- pgno: 442
  md: 'Container Analysis and Binary Authorization can be combined to provide attestations,
    which can prohibit known security vulnerabilities in container images from running
    in your production environment. Let us look at a process flow of how Binary Authorization
    can be incorporated into your pipeline:


    ![](img/f681dfc12450e3a4c257352b70dbceca_442_0.png)


    Figure 15.6 – Binary Authorization


    As Figure 15.6, Binary Authorization works by doing the following:


    +   - Ensuring that only trusted code is deployed to your environment.

    - Enforcing that certain signatures are on images deployed to production.

    - Signing the build using Private PGP. PGP stands for Pretty Good Privacy. The
    public key is uploaded to the GKE admission controller for verification.


    > Note

    PGP is a widely used encryption software program that allows users to encrypt
    and decrypt electronic messages, files, and data. PGP uses a combination of symmetric-key
    and public-key cryptography to provide strong encryption and digital signatures.


    Here are the components that make up Binary Authorization:


    +   - Policies govern the deployment of container images to GKE through a set
    of rules:

    - Rules are part of a policy that defines constraints that container images must
    pass before they can be deployed. Most often, a rule will require one or more
    digitally signed attest. An attestation is a digitally signed record that signifies
    the associated container image was built by the successful execution of a specific,
    required process. This is a Continuous Integration stage artifact.'
  merge: -1
  img_proc: true
- pgno: 443
  md: '+   - A verified attestation is a statement by an attestor that a container
    image is ready for deployment. This is a Continuous Deployment stage artifact.


    +   - A signer is a person or an automated process that creates an attestation
    by signing a unique container image descriptor with a private key.


    +   - Binary Authorization uses an attestor to verify the attestation at container
    deploy time with a public key.


    Under the hood, Binary Authorization acts as a Kubernetes admission controller.


    In GKE, this is implemented with the pod creation API, using the ImagePolicy admission
    controller. Binary Authorization supports using binary authorization to override
    an authorization policy.


    ![](img/f681dfc12450e3a4c257352b70dbceca_443_0.png)


    Figure 15.7 – Binary Authorization in the CI/CD pipeline


    In Figure 15.7, you can see how Binary Authorization can stop untrusted code from
    deploying in the production GKE cluster.


    Now that you understand the basics of the container pipeline and what Google Cloud
    products you can use for image vulnerability and to stop the deployment of untrusted
    code, let us move on to understand the certificate services of GKE.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# Cluster Certificate Authority (CA)


    GKE cluster communicates with various components to keep the cluster healthy.
    The intracluster communication happens over mutual TLS (mTLS). Here are various
    components of the cluster that uses mTLS:


    +   * Control plane to node

    * Node to node

    * Pod to pod

    * etcd to etcd (multiple instances of etcd)

    * Control plane to etcd


    Now let us understand the various components of the GKE Public Key Infrastructure
    (PKI) system that help with mTLS. We will start with the cluster root CA.


    # The cluster root CA


    In GKE, the cluster root CA is used by the API server and kubelet to establish
    trust. Each cluster has its own CA, if one CA is compromised, it doesn''t affect
    other clusters. The API server and kubelet''s client certificates are verified
    by the cluster root CA, ensuring a shared trust between control planes and nodes.
    A non-exportable root key managed by an internal Google service handles the CA
    and signs certificate requests from kubelet. Even if the API server is compromised,
    the CA remains secure, safeguarding other clusters. Additionally, a separate-cluster
    etcd CA is used to validate etcd''s certificates.


    In Kubernetes, there is an API called certificates.k8s.io that allows you to create
    TLS certificates that are signed by your own CA (if required). You can then use
    these certificates and CA to establish trust in your workloads.


    Let us understand the role of the API server and cluster novel.


    # The API server and kubelet


    The API server and kubelet rely on the cluster root CA for trust. In GKE, the
    control plane API certificate is signed by the cluster root CA. Each cluster runs
    its own CA so that if one cluster''s CA is compromised, it is affected. Let us
    see some more details here:


    +   * An internal Google service manages root keys for this CA, which are non-exportable.
    This service accepts certificate signing requests, including those from the kubelets
    in each GKE cluster. Even if the API server in a cluster were compromised, the
    CA would not be compromised, so no other clusters would be affected.'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# GKE security features


    +   - Each node in the cluster is injected with a shared secret at creation, which
    it can use to submit certificate signing requests to the cluster root CA and obtain
    kubelet client certificates. These certificates are then used by the kubelet to
    authenticate its requests to the API server. This shared secret is reachable by
    pods on the node, unless Shielded GKE nodes, Workload Identity, or metadata concealment.


    +   - The API server and kubelet certificates are valid for five years but can
    be manually rotated sooner by performing credential rotation.


    Let us understand etcd certificate exchange now.


    # etcd


    In GKE, etcd relies on a per-cluster etcd certifying authority for trust. Let
    us see how etcd makes a cluster safe:


    +   - Root keys for the etcd CA are distributed to the metadata of each VM on
    which the control plane runs.


    +   - Any code executing on control plane VMs, or with access to compute metadata
    for these VMs, can sign certificates as the CA. Even if etcd in a cluster were
    compromised, the CA would not be shared between clusters, no other clusters would
    be affected.


    +   - The etcd certificates are valid for five years.


    It is recommended that you perform certificate rotation to rotate all your cluster''s
    API server and kubelet certificates. There is no need for you to initiate certificate
    rotation in etcd; this is handled by GKE.


    Now that you understand GKE requirements and methods for the certificates, let
    us move on to understand the Workload Identity feature of GKE. This is different
    from the service account Workload Identity you studied earlier.


    # GKE Workload Identity


    Workload Identity is an identity federation that allows K8s workloads to securely
    access Google Cloud services. On Autopilot clusters, Workload Identity is enabled
    by default. Workload Identity maps a pod to a K8s Service account (KSA) and KSA
    to an IAM service account.


    Without Workload Identity, this is what you need to do to access a Google Cloud
    service:


    +   1. Create an IAM service account.


    +   2. Create keys for a service account.


    +   3. Import service account keys as a K8s secret.'
  merge: -1
  img_proc: true
- pgno: 446
  md: 'On a K8s workload, you would usually follow the following steps for your application
    (running on a pod) to communicate with Google Cloud services, for example, Cloud
    Storage:


    +   1. Define a volume with the secret.

    2. Mount the volume inside the container.

    3. Point $GOOGLE_APPLICATION_CREDENTIALS at the key file.

    4. The workload can now authenticate to Google Cloud APIs as that service account.


    This is toome to set up and harden. A better option is to use Workload Identity.
    With Workload Identity, you can do the following:


    +   1. Enable Workload Identity for GKE cluster.

    2. Run a workload using a dedicated KSA.

    3. Grant KSA access to desired Google Cloud resources using IAM roles.

    4. The workload can now access Google Cloud Storage APIs by presenting (short-lived,
    auto-rotated) KSA tokens.


    You can see Workload Identity removes a lot of steps and makes GKE workloads more
    secure than using service account keys.


    So far, we have seen various security features of GKE. Now let us look at the
    best practices recommended by CIS.


    # Center for Internet Security (CIS) best practices


    Here are some security best practices to harden your GKE cluster security. These
    are presented in the Google Cloud documentation as well CIS GKE benchmarks, make
    sure to understand them:


    +   * Upgrade your GKE infrastructure in a timely fashion

    * Restrict network access to the control plane and nodes

    * Consider managing Kubernetes RBAC users with Google Groups for RBAC

    * Enable Shielded GKE nodes

    * Choose a hardened node image with the containerd runtime

    * Enable Workload Identity

    * Harden workload isolation with GKE Sandbox

    * Enable security bulletin notifications

    * Use least-privilege Google service accounts

    * Restrict access to cluster API discovery'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# Container security best practices


    +   * Use namespaces and RBAC to restrict access to cluster resources

    * Restrict traffic among pods with a network policy

    * Consider encrypting Kubernetes secrets using keys managed in Cloud KMS

    * Use admission controllers to enforce policies

    * Restrict the ability of workloads to self-modify

    * Audit your cluster configurations for deviations from your defined settings

    * Ensure legacy Compute Engine instance metadata APIs are disabled and also ensure
    the GKE metadata server is enabled

    * Ensure Basic authentication using static passwords is disabled

    * Ensure authentication with Client Certificates is disabled

    * Leave Logging enabled

    * Leave the Kubernetes web UI (dashboard) disabled

    * Disable Attribute-Based Access Control (ABAC), and instead use RBAC in GKE

    * Do not disable the DenyServiceExternalIP admission controller


    Now let us see some best practices for containers in general.


    # Container security best practices


    Here are a few general best practices when using containers for your application
    development process. We will look at these in three parts: the build phase, the
    distribution/deployment phase, and the production/run phase. These go hand in
    hand with your CI/CD security:


    +   * Security in the container build phase: This is where the container starts:


    +   * Source image control: In this phase, you write the code to create a container.
    Follow these best practices for this phase:


    +   i. Avoid retrieving/using source images with unknown/untrusted publishers.

    ii. If a third-party image is used, it is strongly recommended to identify and
    document detailed information, such as the version/build of code included and
    information about the creator of the image.

    iii. Never include code from unverified/untrusted sources in an image.

    iv. Use digital signature/checksum verification services on images whenever possible.

    v. Prior to completing image creation, all dependencies and libraries in source
    images should contain the latest security updates.'
  merge: -1
  img_proc: true
- pgno: 448
  md: "# Container Security\n\n+   vi. Less is more—include only core, necessary software/code\
    \ in a base image. This alleviates future work and maintenance load from a security\
    \ perspective.\nvii. Never include code from unverified/untrusted sources in an\
    \ image.\n\n+   * Security/vulnerability scanning: In this phase, you have the\
    \ container image ready. Follow these best practices for scanning containers:\n\
    \    i. It is recommended to perform security and vulnerability scanning on images\
    \ regularly. Most security scanning services can be integrated with the container\
    \ environment and batched to automatically perform security scanning.\n    ii.\
    \ It is recommended to leverage security scanning tools. Clair is an open source\
    \ security scanner developed by CoreOS and is widely used for container scanning.\
    \ There are other commercial scanners available on the market as well.\n    iii.\
    \ Use both static scanning (for example, package integrity verification) and dynamic\
    \ scanning (for example, binary-level code analysis and/or application behavior\
    \ analysis) in the security program.\n\n+   * Security in the container distribution\
    \ phase: In this phase, your container is scanned and ready for deployment. Follow\
    \ these best practices:\n    * Container registry security:\n        i. Access\
    \ to the registry should go through proper authentication and authorization processes.\n\
    \        ii. Always connect to the registry through securely encrypted channels.\
    \ Images usually contain confidential business components and applications—in\
    \ some cases, they contain user data. Connecting to the registry through secure\
    \ channels can ensure data confidentiality and avoid data leakage through successful\
    \ man-in-the-middle attacks.\n        iii. Data security protection mechanisms\
    \ offered by the registry provider should be reviewed and evaluated prior to container\
    \ deployment.\n\n+   * Version control:\n    iv. Proper tooling, such as change\
    \ management, audit, and continuous delivery and integration tools are critical\
    \ for image version control. Good version control tools are essential in urgent\
    \ situations, such as when an emergency rollback is needed."
  merge: -1
  img_proc: true
- pgno: 449
  md: '+   * Security in the container run phase: Now we are ready to deploy the container
    on GKE. Follow these best practices for production:


    +   * Authentication/account management: Here are the best practices when it comes
    to authentication:


    +   i. Access to the container runtime environment should go through proper authentication
    and authorization processes.


    +   ii. Many authentication issues happen when users'' credentials are poorly
    managed (for example, username/password leakage through social engineering or
    phishing, or credentials are not properly terminated/transferred when a user leaves
    the organization). We recommend using the organization''s account management system
    for container account management/authentication/authorization and performing regular
    audits and account privilege reviews.


    +   iii. Use RBAC to regulate access to container resources. The least privilege
    principle should be applied.


    +   * Attack surface reduction: Here are best practices on production clusters
    to minimize the risk of compromising your cluster:


    +   i. To minimize the risk of being targeted and attacked, critical features
    in container images, such as root access and kernel capabilities, should be activated/enabled
    only when needed monitoring.


    +   ii. As part of the best practices, grant cluster-level permissions only to
    trusted administrators and restrict access based on the principle of least privilege.


    +   * Patch management: It''s recommended to keep your images up to date with
    the latest version. Here are some best practices:


    +   i. Subscribe to relevant system/library update feeds and apply the latest
    patches to container images.


    +   ii. Use version control features from the container registry (or other tools)
    to maintain an audit trail of container image updates. Critical information, such
    as timestamps, patch details, and known issues (such as side effects) should be
    documented for compliance purposes.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# Container Security


    +   - **Secret management**: Secret management is one of the largest attack planes.
    Follow these best practices to minimize the risk due to secret leaks:


    +   i. Secrets, or sensitive data, should not be stored within an image. They
    should be stored outside of the image and be called dynamically at runtime.


    +   ii. Major orchestration platforms, such as Kubernetes and Docker Swarm, provide
    native secret management features. Configure the settings properly so that the
    sensitive data is handled securely when it is stored in a container and when it
    is transmitted between different services.


    +   iii. If the organization has an existing secret management system, it should
    be integrated with the container environment by providing secrets from the non-container
    environment, through a secure/encrypted channel.


    This concludes the best practices for container pipelines, from building to running.


    # Summary


    We covered a lot of ground in this and the previous chapter when it comes to container
    security. We went over the basics of CI/CD security and we understood what containers
    are. Kubernetes paved the way for modernizing deployments. The deployments that
    used to take hours are now deployed in minutes and it''s easy to scale deployments.
    Kubernetes GKE is Google''s managed offering for Kubernetes, which takes away
    the pain of management and the complexity. GKE is headed toward more robust, self-healing
    features. Granted, container and Kubernetes security can be quite challenging
    to understand, but our hope is that these last two chapters make it easy for you
    to find a solid foundation


    Congratulations! You have reached the end of this book. We hope you''ve enjoyed
    reading it as much as enjoyed putting it together. We have covered a lot of ground
    on the different security offerings in Google Cloud, and we hope you feel confident
    in your knowledge of them. Our ultimate goal is to help you become a certified
    Google Cloud security engineer and a trusted practitioner in your everyday work.
    Go out there and ace those exams! Best of luck to you!


    # Further reading


    For information on container security, refer to the following links:


    +   - A simple IAP proxy for accessing a private GKE master control plane: https://packt.link/1XbwP


    +   - Best practices for building containers: https://packt.link/UUz4G'
