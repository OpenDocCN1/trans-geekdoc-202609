- pgno: 266
  md: '# Google Cloud Management Service


    When you use HSM-backed keys and key versions, the Google Cloud project that makes
    the cryptographic request incurs cryptographic operation quota usage, and the
    Google Cloud project that contains the HSM keys incurs HSM QPM quota usage.


    > Note

    You can find more information on Cloud KMS in the Google Cloud documentation for
    quotas.


    Here are some architectural characteristics of Cloud HSM that you should be aware
    of:


    +   The Cloud HSM service provides hardware-backed keys to Cloud KMS. It offers
    Google Cloud customers the ability to manage and use cryptographic keys that are
    protected by fully managed HSMs in data centers.


    +   The service is available and auto-scales horizontally. It is designed to be
    extremely resilient to the unpredictable demands of workloads.


    +   Keys are cryptographically bound to the Cloud KMS region where the key ring
    was defined. You may choose to make keys global or enforce strict regional restrictions.


    +   With Cloud HSM, the keys that you create and use cannot be exported outside
    of the cluster of HSMs belonging to the region specified at the time of key creation.


    +   Using Cloud HSM, you can verify attest that your cryptographic keys are created
    and used exclusively within a hardware device.


    +   No application changes are required for existing Cloud KMS customers to use
    Cloud HSM: the Cloud HSM services are accessed using the same API and client libraries
    as the Cloud KMS software backend.


    +   If you choose to, use a PKCS#11-compliant C++ library, libkmspl11.so, to interact
    with Cloud HSM from your application. You use this library typically for the following
    purposes:


    +   Creating signatures, certifications, or certificate signing requests (CSRs)
    using the command line


    +   TLS web session signing in web servers such as Apache or NGINX by Cloud HSM
    keys


    +   Migrating your application to a Google Cloud project that uses PKCS#11 APIs


    This library authenticates Google Cloud using a service account. The library uses
    a YAML file to store the Cloud KMS configurations. Use the following link to learn
    about this: https://packt.link/H53BX.


    Let us look at the HSM key hierarchy now.'
