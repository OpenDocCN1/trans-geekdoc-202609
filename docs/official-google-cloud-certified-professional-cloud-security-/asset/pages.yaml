- pgno: 344
  md: '# Cloud Logging


    +   - Logs: In Google Cloud resources, such as a Google Cloud project, a log is
    a named collection of log entries. There can be no logs unless there are log entries.
    A log''s name is identified by the full path of the resource to which the log
    entries belong, followed by a simple log ID, such as syslog, or a structured ID
    that includes the log writer, such as compute.googleapis.com/activity.


    +   - Retention period: Log entries are stored in Cloud Logging for a specific
    period of time known as the retention period. Each log type has a different retention
    period. You have the ability to create custom retention periods to store logs
    for longer periods than the defaults that are available in Cloud Logging.


    +   - Queries and filters: Queries are written in the Logging query language.
    Queries return the matching log entries. The Logs Explorer and the Logging API
    both employ queries to select and display log entries.


    Filters are queries in the Logging query language that are used by logs to direct
    logs that match a given expression to a storage destination. Filters are also
    used to redirect matching logs to Cloud Monitoring.


    +   - Log Router: In order to reach the Cloud Logging API, all collected logs
    must first go through the Log Router. For each log entry, the Log Router checks
    against pre-existing rules to identify which log entries should be excluded (discarded).
    We will cover the Log Router in more detail later in this chapter.


    +   - Sinks: A sink consists of a filter and a storage destination. The filter
    log entries to send to the sink.


    +   - Log-based metrics: You can define metrics for the logs and then create alerts
    and triggers based on those metrics.


    +   - Access control: You can control who has access to the logs using Cloud IAM
    permissions.


    Each of the log types is categorized based on the log type, such as security,
    user, or platform. We will look at all these categories more detail in the next
    section.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Log categories


    In this section, we broadly divide logs into three categories. We will look at
    each category from the perspective of security.


    ![](img/f681dfc12450e3a4c257352b70dbceca_345_0.png)


    Figure 12.3 – Log categories


    Figure 12.3 illustrates the different types of log categories: security logs,
    user logs, and platform logs. Security logs consist of admin activity logs, data
    access logs, system event logs, and transparency logs. User logs are generated
    by user software, services, or applications and are written to Cloud Logging using
    a logging agent, the Cloud Logging API, or the Cloud Logging client libraries.
    Google Cloud Platform logs are service-specific logs that can help you better
    understand the Google Cloud services you''re using. VPC flow logs, firewall logs,
    and other API logs are examples of platform logs.


    Our focus will be only on logs that are useful from a security perspective. This
    doesn''t necessarily mean that we will only look at the security category. We
    will also look at user logs and platform logs, specifically the subordinate log
    types within these categories that pertain to security.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Security logs


    Cloud Logging offers two forms of security logs: Cloud Audit Logs and Access Transparency
    Logs. Cloud Audit Logs generates the following types of audit logs for each cloud
    project, folder, and organization:


    +   - Admin Activity audit logs include information on API calls and actions that
    potentially alter cloud resource settings. Activities such as creating a virtual
    machine or altering Cloud IAM permissions are examples of changes that are captured
    by Admin Activity audit logs. You can''t configure, exclude, or disable these
    types of logs. They''re always recorded for security reasons. Admin Activity audit
    logs are created even if the Cloud Logging API is disabled. The retention period
    for administrator activity records is 400 days.

    - Data Access audit logs show who accessed what data, the access time, and what
    actions were performed. Data Access audit logs are retained for 30 days. All Google
    Cloud services are supported. Data access audit logs are disabled by default.

    - System Event audit logs: Events that alert resource configurations are recorded
    in System Event audit logs. These logs are generated automatically by Google''s
    systems, not by users. System Event audit logs cannot be configured, excluded,
    or they are always written.

    - Policy Denied audit logs: Policy Denied audit logs are created when a Google
    Cloud service rejects a user or service account access for a security policy violation.
    VPC Service Controls determines policies and sends Cloud Logging Policy Denied
    audit logs. Your Cloud project gets charged for Policy Denied audit log storage.
    You can''t disable Policy Denied audit logs, but you can exclude them from Cloud
    Logging.


    The next type of security log is Access Transparency. Access Transparency provides
    logs based on the actions taken by Google staff when accessing your Google Cloud
    content. Access Transparency logs can help you track the compliance posture of
    your organization with regard to your legal and regulatory requirements. We recommend
    Access Transparency in depth in Chapter 3, Trust and Compliance.


    # User logs


    As mentioned earlier, user logs, sometimes referred to as user-written logs, are
    written to Cloud Logging using an agent, the Cloud Logging API, or client libraries.
    Let''s take a look at the user-agent log type:


    +   - Cloud Logging agent: An agent can be installed to stream logs from instances
    to Cloud Logging. The Cloud Logging agent is based on Fluentd and is preconfigured
    by default to syslog logs and common third-party tools'' logs (for example, MySQL,
    PostgreSQL, MongoDB, Cassandra, and Apache). It is possible to customize the pre-configured
    Fluentd agent configurations as required.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Platform logs


    Next, we will look at examples of platform logs:


    +   - **VPC logs**: VPC flow logs contain granular VM flow-level network telemetry
    from Google Cloud. VPC flow logs provide insights into VPC traffic, traffic planning,
    a better understanding of networking costs, and forensics in the case of security-related
    incidents. VPC logs are aggregated collections of packets for a interval and for
    a given connection. These are default retained for 30 days and they do not lead
    to any performance degradation. The VPC flow log includes a 5-tuple—for the source
    IP address, destination IP address, source port number, destination port number,
    and protocol (TCP or UDP)—and the timestamp. The metrics includes packets, bytes
    (throughput), RTT for TCP flows, VPC annotations (region, zone, and VM name),
    and geographic annotations (country, region, and city). Logs are collected on
    each VM connection and aggregated at 5-second intervals. Google samples about
    out of every 10 packets.

    - **Firewall logs**: You can enable firewall rule logging individually for each
    firewall rule. Firewall rule logging only records TCP and UDP connections. Log
    entries are written from the perspective of VM instances.

    - **NAT logs**: You can enable NAT logging on a NAT gateway instance. You can
    choose to generate logs for the creation of NAT connections and when packets are
    dropped because no port was available for NAT. Cloud NAT logs both TCP and UDP,
    including dropped egress packets. Dropped ingress packets (for example, if an
    inbound reply to an egress request was dropped) are not logged.


    We have covered the different types of logs and their relevant examples. We will
    now consider the retention of logs. Defining a retention period gives you the
    ability to change the log period to match your compliance or regulatory requirement.
    Let''s take a look at the key log types and their associated log retention periods
    in the following section.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Log retention


    Cloud Logging retention is critical for many organizations due to compliance requirements.
    The default retention period is often not sufficient; therefore, many customers
    configure custom retention periods for their logs. Longer retention periods come
    at a higher cost.


    | Retention | Cost |

    |---|--|

    | Admin audit logs | 13 months (400 days) | Free |

    | System Event audit logs | 13 months (400 days) | Free |

    | Access Transparency logs | 13 months (400 days) | Free |

    | Data access logs | 30 days | $0.50 per GB over 50GB/Month |

    | All other logs | 30 days | $0.50 per GB over 50GB/Month |

    | Workspace admin console logs | 6 months | Free |

    | Log sink | Indefinite | Based on service option (GCS, BQ, Pub/Sub)


    Figure 12.4 - Cloud Logging default retention periods and costs


    12.4 shows the default retention periods and the associated costs for the different
    types of logs that we have covered. The costs are correct at the time of writing
    and may change.


    Next, we''ll explore the topic of log management. We will learn about log producers
    and consumers and understand how a log router works. We will also discuss exporting
    logs and creating log sinks in detail.


    # Log management


    A key component of logging is the ability to export logs so they can be consumed
    by a service running on the cloud or by a third-party solution. You will also
    learn how to aggregate logs, build log pipelines, perform log analysis, and deliver
    logs to SIEM solutions.


    # Log producers


    All resources that generate logs, such as products, services, and applications,
    whether they are in the cloud or a hybrid environment, are classified as log producers.
    Google Cloud services or services running in your on-premises data center or a
    third-party cloud service provide'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Log consumers


    Log consumers are services such as centralized logging solutions and SIEM solutions.
    Any service that has the ability to consume logs and provide functions such as
    alerting, troubleshooting applications, and business intelligence is considered
    a log consumer. Cloud Logging on Google Cloud is an example of such a service.


    # Log Router


    The term Log Router has been used a few times in the chapter; we will now look
    at the workings of the Log Router in more detail to understand what it is and
    how it works. A Log Router ensures that logs are collected from producers and
    delivered to the consumer.


    ![](img/f681dfc12450e3a4c257352b70dbceca_349_0.png)'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'Figure 12.5 shows how a Log Router works. Logs are transmitted to the Cloud
    Logging API, where they are processed by the Log Router. These logs include audit
    logs, platform logs, and user-written logs. The Log Router compares each log entry
    to the rules that are already in place to determine which log entries should be
    ingested and stored, which log entries should be included in exports, and which
    log entries should be discarded.


    To export logs, create a filter that selects the relevant log entries to export,
    and then select a destination. You can choose from these options:


    +   - JSON files can be created in Google Cloud Storage buckets.

    - Tables can be created in BigQuery datasets.

    - JSON messages can also be delivered via Pub/Sub topics. This option also supports
    third-party integrations, such as Splunk.


    Alternatively, you can create another Google Cloud project and have the log entries
    stored in Cloud Logging buckets.


    Sinks are used to store the filter and the final destination. Google Cloud projects,
    organizations, files, and billing accounts can all be used as sinks. We covered
    sinks earlier in this chapter. We will look at them in more detail when we look
    at log exports in the following section.


    # Log sinks and exports


    Before we look at exporting logs, it''s important to understand log sinks and
    inclusion/exclusion filters. Sinks tell Cloud Logging where to send logs. With
    sinks, you can send some or all of your logs to destinations that can handle them.
    Sinks are part of a specific Google Cloud resource, such as a project, billing
    account, folder, or organization. When a resource gets a log entry, the Log Router
    sends the log entry to the appropriate sinks and, if enabled, the Log Router forwards
    it to any ancestral sinks that belong to the resource hierarchy. The log entry
    is ultimately sent to the destination associated with the sink.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Log management


    Log Search – Analysis

    Log-based metrics

    Alerting on Logs

    Dashboards


    ![](img/f681dfc12450e3a4c257352b70dbceca_351_0.png)


    Figure 12.6 – Log exports and sinks


    Figure 12.6 shows the relationships between sinks, filters, and exports. By defining
    one or more sinks that have a log query and an export destination, you can easily
    export logs from a database. New log entries are compared to each sink as they
    are received by Cloud Logging. When an entry matches a sink filter, it is written
    to the sink''s destination.


    If no filters are attached to a sink, all logs will match and be forwarded to
    their final destination. The inclusion filter can be used to choose specific logs
    for the sink. Alternatively, you can use exclusion filters to keep unwanted logs
    out of the sink altogether. Filters are defined using the Logging query language.


    Log buckets are used by Cloud Logging to store and organize data in your Google
    Cloud projects, billing accounts, folders, and groups. Using Cloud Logging, you
    can study your logs in real time by having them indexed, optimized, and provided
    to you. Logging buckets are distinct from Cloud Storage buckets, despite the similarity
    of their names. Log buckets should be considered a local resource. You can pinpoint
    the location of the servers and storage facilities that handle your logs.


    Next, we will look at the steps for how to create a log export.'
  merge: -1
  img_proc: true
