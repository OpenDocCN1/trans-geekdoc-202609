    # Understanding IAM policy inheritance works


    We will cover IAM depth in Chapter 6, Google Cloud Identity and Access Management.
    In this section, we will understand how IAM policy inheritance works in organizations.
    Cloud IAM allows you to configure fine-grained access to your Google resources.
    It lets you configure who (users) have access (permissions/roles) to what (resources)
    by means of an IAM policy.


    The following figure depicts how IAM policy inheritance works, which is top-down,
    meaning you can configure an IAM policy at the organization level, folder level,
    or project level, and even at the resource level. If you recall from previous
    sections, we looked at how an organization hierarchy is created based on account
    boundaries.


    ![](img/f681dfc12450e3a4c257352b70dbceca_71_0.png)


    Figure 4.4 - IAM policy inheritance


    > Note

    The effective policy for a resource is the union of the policy set at that resource
    and the policy inherited from its parent.


    Essentially, this means is that resources inherit the policy from the project,
    and the project inherits the policy from the folders and the organization. From
    the preceding figure, if you give Alice, the user, the role of Project Editor
    at the folder level, Alice will have access as Project Editor for all the projects
    that are under the specific folder. If you assign Bob the role of an instance
    admin at the resource level for a given project, then Bob will only have access
    as an instance admin for the compute instance in that particular project.'
