    \ risky policy settings using the Cloud Asset Inventory API by looking for service\
    \ accounts that have an owner role. The following command is an example of such\
    \ a query:\n\n```\ngcloud asset search-all-iam-policies \\\n  --scope=organizations/123456\
    \ \\\n  --query='roles/owner serviceAccoun\\' \\\n  --page-size=50 \\\n  --flatten='policy.bindings[].members'\
    \ \\\n  --forma='table=resource.segment(3):label=RESOURCE TYPE, resource.basename():label=RESOURCE,\
    \ policy.bindings.member' \\\n  | grep serviceAccount\n```\n\nUsing the Cloud\
    \ Asset Inventory search function can help you answer questions such as these:\n\
    \n+   * What IAM policies contain `foo@bar.com`?\n* Which resources are owner\
    \ to the world (containing `allUsers`)?\n* Who has an owner role in my organization?\n\
    * Are there any users with *.setIAMPolicy permissions?\n\nBesides searching policies,\
    \ you can also search for resources, such as listing all the resources within\
    \ your project, finding VMs in the EU region, or finding BigQuery datasets labeled\
    \ as sensitive. All these capabilities give you powerful access to reduce the\
    \ time it takes and retrieve information to take corrective action. Next, let's\
    \ take a look at how you can export asset-related information."
