    # Best practices and design considerations


    In this section, we will look at some VPC best practices and design considerations
    that you need to factor in when designing and building your secure network on
    Google Cloud. From an exam perspective, is important to understand these as you
    will find questions about best practices.


    # VPC best practices


    For VPC, some of the best practices include the following:


    +   - Prevent overlapping IPs and control subnet creation by creating VPC networks
    using custom subnet creation.


    +   - Reduce management and topology complexity by making use of Shared VPC where
    possible.


    +   - Group similar applications into fewer, more manageable, and larger subnets.'
