  md: '# GCDS features and capabilities


    Let''s look at some of the capabilities that GCDS has to offer. It is important
    from an exam perspective to understand what GCDS can and cannot do:


    +   - GCDS is available as a download on your server. It comes packaged with all
    necessary components, and once installed, you can begin the setup process. There
    are also built-in security features in GCDS to ensure your content is secure during
    the synchronization. Before any synchronization can begin, an OAuth token is created
    using Configuration Manager, which is used to connect to your Google account.
    You will further need to authorize GCDS with your Google account for authentication.

    - GCDS lets you sync information such as organizational units, mailing lists,
    users and their related attributes (you have the option to specify this), extended
    user information (again, you can specify what to synchronize), and calendar information,
    such as rooms, contacts, and passwords.

    - Using configuration you will be able to specify which attributes you want to
    include, exclude, or create exceptions for.

    - To make the entire setup of GCDS easy to use, you have the option, if you are
    using Microsoft AD or Open LDAP to use the default settings in Configuration Manager.

    - With GCDS, you have the ability to create exclusion rules where you can specify
    what you want to include in your sync. All of this can be easily managed and configured
    from Configuration Manager, which we will see a bit later.


    Now, let us understand how GCDS works.


    # How does GCDS work?


    By using GCDS, the Google Cloud Identity domain''s data can be automatically provisioned
    from your LDAP directory server by adding, editing, and deleting users, groups,
    and non-employee contacts. Your LDAP directory server''s data is safe and secure.


    Configuration Manager is a GUI-based wizard that walks you through the steps to
    configure synchronization. You set up your directory server settings and connection,
    configure the Google Cloud Identity domain settings, and select what LDAP data
    to synchronize and what to exclude.


    The following steps explain how GCDS data flows:


    +   - Relevant data is exported in a list from an LDAP server. You can set up
    rules to specify how this is generated.

    - GCDS connects to the Google Workspace domain and generates a list of users,
    groups, and shared contacts that you specify.

    - GCDS compares these lists and generates a list of changes.'
