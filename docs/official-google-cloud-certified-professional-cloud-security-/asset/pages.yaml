    # Access Approval


    Next, we will look at what Access Approval is and how it works. Access Approval
    ensures that you as a customer give your consent to Google support engineers to
    access the content in your environment. If you decide, for whatever reason, you
    don''t want to give that permission, access will be denied. Irrespective of whether
    you approved access or denied access, a transparency log activity entry will be
