    # Additional security features


    There are some additional security features that are available in Cloud Identity
    that are not part of the exam''s scope. Therefore, we will briefly cover them
    here for the purpose of completeness. There will be links in this section and
    in the Further reading section on some of these additional topics, which you need
    to refer to. These features include the following:


    +   - Google cloud security center: The security center provides capabilities
    as advanced security analytics and visibility into security-related issues, all
    from a central dashboard. From the security dashboard, you can view reports, as
    reports on user login attempts, file exposure, DLP events, spam-related information,
    OAuth grant activity, user reports, and on.


    > Note

    You can find a full list of reports that you can view from the dashboard here:

    https://packt.link/ygLH


    Another key capability of the security center is the security investigation tool,
    which lets you identify, triage, and take action on security-related events.


    > Note

    You can learn more about the security investigation tool here:

    https://packt.link/ovam0.


    Finally, the dashboard also provides you with an overview of your security health,
    which gives you visibility of the admin console and its related activities.


    +   - Monitor and enforce password requirements: You can enforce strong passwords
    based on your organization''s policy. This includes the length, complexity, and
    expiration of your passwords. You can also stop password reuse so users cannot
    reuse previously used passwords. The monitoring function lets you monitor the
    password strength.


    > Note

    You can read more about this topic at this link: https://packt.link/Rol3H.'
