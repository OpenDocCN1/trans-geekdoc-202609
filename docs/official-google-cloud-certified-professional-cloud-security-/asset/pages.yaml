- pgno: 144
  md: "# Google Cloud Identity and Access Management\n\nThe version field is set to\
    \ 3 in this example because of a condition expression in the policy. The policy's\
    \ role binding lists only until July 1, 2022, and only for the Google groups prod-dev@acme.com\
    \ prod-example@acme-project-id.iam.serviceaccount.com.\n\nLet us see an example\
    \ now that shows a policy with conditional and unconditional role bindings.\n\n\
    In this example an IAM policy contains both conditional and unconditional role\
    \ bindings for the same role:\n\n```\n{\"bindings\": [\n  {\n    \"members\":\
    \ [\n      \"serviceAccount:prod@acme-project-id.iam.serviceaccount.com\"\n  \
    \  ],\n    \"role\": \"roles/appendine.deployer\"\n  },\n  {\n    \"members\"\
    : [\n      \"group:prod@acme.com\",\n      \"serviceAccount:prod@acme-project-id.iam.serviceaccount.com\"\
    \n    ],\n    \"role\": \"roles/appendine.deployer\",\n    \"condition\": {\n\
    \      \"title\": \"Expires_July_1_2024\",\n      \"description\": \"Expires on\
    \ July 1, 2024\",\n      \"expression\": \"request.time < timestamp('2024-07-01T00:00:00.000Z')\"\
    \n    }\n  ],\n  \"etag\": \"BwUjMhCsZyP =\",\n  \"version\": 3\n}prod@acme-project-id.iam.serviceaccount.com\n\
    ```\n\nThe serviceAccount:prod@acme-project-id.iam.serviceaccount.com is included\
    \ in two role bindings for the same role in this case. No conditions are attached\
    \ to the first binding. Until July 1, 2024, the second role binding grants the\
    \ role.\n\nIn Google Cloud IAM, conditional role bindings take precedence over\
    \ role bindings without conditions. When a conditional role binding is specified\
    \ for a principal, it overrides any non-conditional role bindings for that principal.\
    \ This means that the conditions defined in the role binding will determine whether\
    \ the principal is granted the specified role. If the conditions are not met,\
    \ non-conditional role bindings will not be considered for that principal."
