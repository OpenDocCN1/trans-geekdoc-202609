    Transfer Protocol

    (SMTP) is always denied.


    All communication between a VM and its corresponding metadata server (169.254.169.254)

    is allowed.


    Firewall rules support both IPv4 and IPv6 addresses, but a single firewall rule
    can only have

    either IPv4 or IPv6.


    Each firewall rule has an owner or deny associated with it, and you have the option
    to disable

    firewall rules.


    ICMP response traffic is allowed through the firewall rules.


    All firewall rules are tracked irrespective of the protocol used.


    This concludes our coverage of the firewall features; it’s good to remember these
    from an exam

    perspective. Next, we move on to the different components of firewall rules.


    # Components of firewall rules


    There are a few key components of firewall rules that we need to understand as
    it’s important for

    configuration. Let us look at what these components are:


    +   - Direction of the rule: Ingress rules govern connections from specific sources
    to Google Cloud

    target, while egress rules govern connections from targets to specific destinations.

    - Priority: The rule that is used is based on a number of factors. Rules with
    lower priority

    conflict are ignored and only the rules with the highest priority (the lowest
    priority number)

    and match the traffic are used.

    - Action: The action determines whether the rule allows or denies connections.

    - Enforcement status: Firewall rules can be either enabled or disabled without
    you having to

    delete them.

    - Target: The target specifies the instances to which a particular rule applies.

    - Source: The source is a filter for ingress rules or a destination filter for
    egress rules.

    - Protocol: The protocol might be TCP, UDP, or ICMP, and the destination port
    might be 22,

    80, or 443, for instance.

    - Logs: This option logs connections that match the rule to Cloud Logging.'
