- pgno: 99
  md: 'It is assumed that you understand how SAML 2.0 works. In this section, we will
    only look at how to configure SSO using SAML and not cover the foundational knowledge
    of how Google implements SAML. If you wish to understand more about how SSO using
    SAML works on Google Cloud, please refer to the *Further reading* at the end of
    this chapter.


    For the purpose of the exam, we will walk through the steps required to configure
    SSO using SAML for a custom application.


    Before we begin, ensure that you have the **Assertion Consumer Service (ACS)**
    URL and the entity ID, as they will be required when you configure your external
    IdP and optionally start a URL. Also, determine at this stage whether your external
    IdP supports **multi-factor authentication (MFA)**; if it does, you can configure
    the option to use MFA by external IdP, but if some reason your custom application
    does not support MFA, you can configure Google Identity to enforce MFA.


    Now let''s look at the steps required to complete the setup using SAML for a custom
    application:


    +   1. Begin logging in to the admin console at `admin.google.com`.

    2. Navigate from the main console to **Apps | Web and mobile apps**.

    3. From there, select **Add app | Add custom SAML app**.


    ![](img/f681dfc12450e3a4c257352b70dbceca_99_0.png)'
