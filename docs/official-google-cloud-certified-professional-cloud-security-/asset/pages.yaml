- pgno: 410
  md: '# Security Command Center


    +   - Impair Defenses: Two-Step Verification Disabled

    - Initial Access: Government-Based Attack

    - Persistence: SSO Enablement Toggle

    - Persistence: SSO Settings Changed

    - Impair Defenses: Strong Authentication Disabled


    This concludes the section on ETD. Let us look at KTD now.


    # Counter Threat Detection


    KTD is another built-in service within SCC Premium that supports threat detection
    on the GKE platform. Please verify the version of the GKE cluster you are running
    to make sure it is supported. Refer to the Google Cloud documentation for supported
    versions. KTD gathers and analyzes low-level observable behavior in the guest
    kernel of your containers to generate insights.


    Here are the findings generated by KTD:


    +   - Added Binary Executed: A binary that was not part of the original container
    image was executed. Attackers commonly install exploitation tooling and malware
    after the initial compromise.

    - Added Library Loaded: A library that was not part of the original container
    image was loaded. Attackers might load malicious libraries into existing programs
    to bypass code execution protections and hide malicious code.

    - Malicious Script Executed: A machine learning model identified an executed Bash
    script as malicious. Attackers can use Bash to transfer tools and execute commands
    without binaries.

    - Reverse Shell Attack: A process with stream redirection to a remote-connected
    socket. With a reverse shell, an attacker can communicate from a compromised workload
    to an attacker-controlled machine. The attacker can command and control the workload
    to perform desired actions, for example, as part of a botnet.


    Now that we know how KTD works, let us move on to learning how VM Threat Detection
    works.


    # VM Threat Detection


    VM Threat Detection (VMTD) is a built-in feature of SCC Premium that detects threats
    at the hypervisor level. VMTD detects coin mining software, which is one of the
    most typical forms of software found in cloud environments.


    VMTD is a part of the SCC Premium threat detection suite, and it is meant to work
    alongside ETD and KTD. This feature is now in general availability (GA) as of
    July 2022. The certification exam will not have any questions on it at the time
    of publication of this book; it may be added in the future.'
  merge: -1
  img_proc: true
- pgno: 411
  md: "# Threat detection\n\nThe service executes scans from the hypervisor into the\
    \ guest VM's live memory regularly halting the guest's activity. VMTD analyzes\
    \ information about software running on VMs, such as a list of application names,\
    \ per-process CPU usage, hashes of memory pages, CPU hardware performance counters,\
    \ and information about executed machine code, using Google Cloud's threat detection\
    \ rules to see whether it matches crypto mining signatures.\n\nBecause VMTD operates\
    \ outside the guest VM instance, it does not require guest agents or specific\
    \ guest OS configuration, and it is immune to complex malware countermeasures.\
    \ Inside the guest VM, no CPU cycles are used, and network access is not required.\
    \ Signatures do not need to be updated, and the service does not need to be managed.\
    \ VMTD is not supported on confidential computing since it operates with hardware\
    \ encryption of memory.\n\nThe capabilities of Google Cloud's hypervisor are required\
    \ for VMTD; it cannot be used in on-premises or other public cloud settings.\n\
    \nHere are the threats it will alert you to:\n\n+   - **Execution: Cryptocurrency\
    \ Mining Hash**: Matches memory hashes of running programs against known memory\
    \ hashes of cryptocurrency mining software.\n- **Execution: Cryptocurrency Mining\
    \ YARA Rule**: Matches memory patterns, such as proof-of-work constants, known\
    \ to be used by cryptocurrency mining software.\n- **Execution: Cryptocurrency\
    \ Mining Combined Detection**: Combines multiple categories of findings detected\
    \ within a one-hour period. The threats are rolled into a single finding.\n\n\
    You have seen how VMTD can be used; now let us look at the last topic of threat\
    \ detection, anomaly detection.\n\n# Anomaly detection\n\n**Anomaly detection**\
    \ is a built-in feature that uses external behavior signals to detect anomalies.\
    \ It shows details about security abnormalities found in your projects and VM\
    \ instances, such as potential credentials and currency mining. When you subscribe\
    \ to the SCC Standard or Premium tier, anomaly detection is turned on immediately,\
    \ and the results are displayed on the SCC dashboard.\n\nThis feature is available\
    \ for the Standard and Premium versions of SCC. Here are the findings detected\
    \ by anomaly detection. They are generated in the following two categories:\n\n\
    +   - **Potential for compromise:**\n    - `account_has_leaked_credentials`: Credentials\
    \ for a Google Cloud service account are accidentally leaked online or are compromised.\n\
    \    - `resource_compromised_alert`: Potential compromise of a resource in your\
    \ organization."
  merge: -1
  img_proc: true
- pgno: 412
