- pgno: 121
  md: '# Best practices for predefined roles


    Not every task requires a comprehensive list of permissions. Instead, prioritize
    the relevant permissions needed for the specific task. If a predefined role includes
    the required permissions, it is likely to include other permissions as well. Take
    this opportunity to identify the most impactful permissions needed. In general,
    fewer predefined roles provide more potent permissions.


    The following types of IAM permissions are *considered* powerful:


    +   * Resource creation and deletion permissions

    * Permissions to gain access to confidential information, such as encryption keys
    or **Personal Identifiable Information (PII)**

    * Permissions to configure a resource''s IAM policy

    * The ability to make changes to organizational structures, folders, and projects

    * Permission to assign IAM policies


    Compare these to the following permissions, which are less powerful:


    +   * Resource listing permissions

    * Access rights to non-sensitive data

    * The ability to change settings that provide negligible risk, such as Compute
    Engine virtual instances'' minimum CPU platform


    Once you have discovered the required permissions, compile a list of roles that
    might be a good fit.

    To assign permissions to a single Google Cloud service, you must identify as many
    specified roles as possible. For example, it is unlikely that a single role will
    contain the relevant permissions for both services if a principal needs to access
    Cloud Storage and administer Cloud SQL databases. If a role exists, it may have
    unrelated permissions. Choosing a specific role that satisfies the requirements
    for Cloud Storage access and another one with SQL permissions can help reduce
    risk.


    Let us look at some of the best practices for role assignments.


    # Assigning roles to resources


    Select where you need to grant the predefined roles in the resource hierarchy.
    Here are a few points to consider:


    +   * You can grant roles on lower-level resources (for example, a Compute Engine
    VM or a Cloud Storage bucket) if you just need access to them.

    * To allow access to a project, folder, or organization''s resources, grant the
    appropriate roles at that level. You can use IAM conditions to provide a role
    solely on a particular resource in the project, folder, or organization.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'You can use tags to define IAM policies for cloud services that support tags.
    Do not confuse labels and tags. Tags are an IAM construct and are defined at an
    organization level.


    Let us use an example to demonstrate this.


    If the principal needs access to a single Cloud Spanner database but several VM
    instances, you want to choose the Cloud Spanner admin role over the database and
    the Compute Admin role on the project (in addition to the Service Account Role
    since some compute instances are preconfigured to use a service account).


    You may verify which resources the principal can access and troubleshoot access
    difficulties you want using the IAM Policy Analyzer and Policy Troubleshooter
    (part of the Policy Intelligence tools, which are beyond the scope of this book).


    You may have granted fewer permissions than the principal requires if the principal
