- pgno: 356
  md: '# Log archiving and aggregation


    The process of archiving logs is like the process outlined in the previous section.
    You create a log sink, specify the inclusion and exclusion criteria, and choose
    the Google Cloud Storage bucket as the destination.


    ![](img/f681dfc12450e3a4c257352b70dbceca_356_0.png)


    Figure 12.10 shows an illustration of what the log archiving pipeline looks like.
    You collect the logs using Cloud Logging and create a log sink with Cloud Storage
    as the destination.


    ![](img/f681dfc12450e3a4c257352b70dbceca_356_1.png)


    Figure 12.11 – Log aggregation


    Log centralization is a typical requirement for auditing, archiving, and ensuring
    the non-repudiation of data and is considered a best practice. To achieve it,
    it is possible to configure aggregate exports at the organization level. This
    ensures that all logs on all projects (new and existing) in the organization are
    exported to a central location. Figure 12.11 shows how you can configure log aggregation
    based on your requirements. You can aggregate logs at the project, folder, or
    organization level.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Real-time log analysis and streaming


    As mentioned earlier, Cloud Logging is a collection of different components. We
    have the Cloud Logging API, where all the logs are delivered. We also have the
    Log Router, where you can create your inclusion and exclusion filter to redirect
    the logs to a log sink. We also looked at several choices for logs after they''ve
    been removed from a log sink. With Google Cloud Storage, you can store the logs
    and apply lifecycle management rules based on your retention policy. If you wish
    to analyze the collected logs, you can do so with BigQuery.


    In this section we will look at storing logs in BigQuery for analytics. At the
    time of writing, there is a built-in feature that Google Cloud has called Log
    Analytics. This feature is still in preview, will not feature in the exam. In
    addition to Log Analytics, you can also create a pipeline that streams to BigQuery.


    ![](img/f681dfc12450e3a4c257352b70dbceca_357_0.png)


    Figure 12.12 – Log streaming pipeline


    Figure 12.12 illustrates a log streaming pipeline using Cloud Logging, Pub/Sub,
    and a DataFlow pipeline that triggers a Cloud Data Loss Prevention (DLP) template.
    DLP inspects sensitive data as personally identifiable information (PII) to remove
    sensitive data before storing it for analytics in BigQuery. In our example, we
    are exporting through Pub/Sub, then through Dataflow, and lastly to BigQuery.
    Dataflow is very useful for processing logs in real time and at scale. However,
    we don''t need to stream logs; we can simply create a log sink and deliver to
    BigQuery.


    BigQuery enables you to store data in a cost and effective manner. Its easy-to-use
    SQL interface can provide a solid foundation for creating AI models and simplifying
    data operations. Data Studio and Looker are two tools that can be used to visualize
    BigQuery results. Visualization is out of scope for our discussion. BigQuery offers
    an easy-to-use and powerful capability to run queries to help you with analytics
    that you can use for troubleshooting and security incident response. In the next
    section, we will discuss an example of exporting logs to address compliance requirements.
    We will also cover the configuration aspects of the log pipeline described here.


    The Logs Dashboard displays the severity and error data for resources in your
    Cloud project. The Logs Dashboard allows you to spot patterns in your systems''
    activity, keep track of your workloads, and diagnose address issues. All the log-based
    metrics are preconfigured and cannot be modified. The Logs Dashboard only shows
    statistics for resources that generate log data.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'You can also use Logs Explorer to analyze logs. With Logs Explorer, you can
    run queries using the Logging query language based on your criteria, which can
    include logical operations such as AND and OR on the resource type.


    Log Analytics can reduce the need to send logs to different systems to address
    separate use cases. We will briefly cover three common use cases. The first is
    for DevOps, resolving issues quickly is critical to maintaining reliability. Log
    Analytics help uncover patterns and correlate data across services. Faster troubleshooting
    can also help improve the speed of software development by reducing the time spent
    on debugging.


    The second is for security. Investigations are a critical part of understanding
    and remediating security threats. Log Analytics can identify logs across large
    time ranges, which often mean large data volumes.


    The third is for IT operations, managing a fleet of different services is a core
    part of IT operations. It''s important to understand the events and trends across
    the whole fleet. Log Analytics can help identify patterns and fleet performance
    over time.


    There are many other ways that Log Analytics helps enable business decisions,
    including analyzing business data reported in logs. By unlocking valuable insights,
    Log Analytics brings new value to your logs.


    We have covered Log Analytics and how you can use BigQuery and third-party applications
    for analytics. The next section will cover how to meet your compliance and regulatory
    requirements using log exports.


    # Exporting logs for compliance


    In this section, we will look at exporting logs to meet compliance requirements.
    Configuring log exports is an important topic in the exam. There are some advanced
    export configurations that you can practice, such as exporting logs for security
    and analytics and configuring logs to go to Elastic or Splunk when you are using
    a third-party SIEM tool.


    In this example, we will export logs to a Cloud Storage bucket. We will then look
    at how to limit access to the logs. The logs can be moved to Nearline or Coldline
    storage classes and then deleted by Cloud Storage''s object lifecycle management
    capability.


    There are five steps to the configuration of log exports:


    +   1. First, we will begin the setup by creating a logging export bucket in Cloud
    Storage.'
  merge: -1
  img_proc: true
