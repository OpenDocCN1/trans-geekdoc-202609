- pgno: 405
  md: '# Best practices for WSS


    You should use WSS with caution because it populates fields, buttons, clicks links,
    and performs other actions. This is especially true if you are scanning production
    resources. WSS may trigger features that alter the condition of your data or system,
    resulting in unfavorable outcomes. Here are some best practices:


    +   * Use a test environment for scanning: Create a separate App Engine and load
    your application and there to create a test environment. When you upload your
    application using the Google Cloud CLI, you can provide the target project as
    a command-line argument.

    * Create a test account: Create a user account with no access to sensitive data
    or potentially dangerous operations that you do wish to activate. When users log
    in for the first time, many applications need to go through a unique process,
    such as accepting terms and creating a profile. A test account for an initial
    user may have different results than an established user account due to the different
    workflow. After the first-time flow is complete, scan using an account that is
    in the typical user state.

    * Deactivate UI elements: Apply the no-click CSS class to individual user interface
    elements that you do not wish to activate. Regardless of whether they are inline
    JavaScript, attached using addEventListener, or attached by specifying the appropriate
    event handler property, event handlers attached to this element are not enabled
    during crawling and testing.

    * Use backup data: Before scanning, consider making a backup of your data.

    * Exclude URLs: You can exclude patterns from being crawled or tested. See the
    following link for further details on the syntax: https://packt.link/nldrwr

    * Scope of the scan: Before you, check your app for any features that could affect
    data, users, or systems in ways that go beyond the scope of your scan.


    So far, we have seen vulnerability detection findings when using SCC. Now we will
    look at the threat detection capabilities of SCC.


    # Threat detection


    Google Cloud provides several types of threat detection via SCC Premium:


    +   * Event Threat Detection

    * Container Threat Detection

    * VM Threat Detection

    * Anomaly Detection'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Security Command Center


    Let us start with ETD.


    # Event Threat Detection


    Event Threat Detection (ETD) is a built-in feature of the SCC Premium tier that
    watches your Google Cloud environment in real time and detects threats within
    your systems. New detectors are added to ETD regularly to discover emerging threats
    at cloud scale.


    ETD produces security findings by matching events in your Cloud Logging and Google
    Workspace logs streams to known indicators of compromise (IoCs). IoCs, developed
    by Google security sources, identify potential vulnerabilities and attacks. ETD
    also detects threats by identifying known adversarial tactics, techniques, and
    procedures in your logging stream, and detecting deviations from the historically
    observed behavior of your Google Cloud organization.


    Here are some ETD features that you should be aware of:


    +   - Project-specific logs are consumed when they become accessible by ETD. Cloud
    Logging records API calls and all operations that create, read, or modify resource
    configuration or metadata. Google Workspace logs keep track of user sign-ins to
    your domain and actions taken in the Google Workspace Admin console.

    - ETD leverages logs to swiftly detect threats. It uses Google''s proprietary
    threat intelligence and detection technology to identify threats in near-time.

    - ETD also logs to SCC and Cloud Logging projects.

    - You can use Cloud Functions to process data from Cloud Logging and Google Workspace
    Logging to automate responses to threats.

    - You can also use Chronicle to explore findings. Chronicle is a Google Cloud
    service that lets you investigate threats and track them over time.


    Now that you know what ETD is, let us see what it needs to detect threats.


    # Unsafe IAM changes


    ETD finds external group members and examines each affected group''s IAM roles
    using Cloud Audit Logs to see whether the groups have been granted sensitive responsibilities.
    This data is used to detect the potentially dangerous modifications in privileged
    Google groups.


    Unsafe changes in Google groups that involve high- or medium-sensitivity roles
    result in findings. The severity grade attributed to findings is influenced by
    the sensitivity of the roles:


    +   - Billing, firewall settings, and logging are all controlled by high-sensitivity
    roles in businesses. Findings that correspond to these responsibilities are given
    a high severity rating.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'Editing permissions on Google Cloud resources, as well as viewing and executing
    permissions on data storage services that often hold sensitive data, are available
    to principals in medium-sensitivity positions. The severity of discoveries is
    determined by the resource:


    +   - Findings are categorized as *High* severity if medium-sensitivity roles
    are awarded at the organizational level


    +   - Findings are categorized as *Medium* severity if medium-sensitivity responsibilities
    are provided at lower levels in resource hierarchy (folders, projects, and buckets,
    for example)


    Look at Google Cloud''s documentation for information on all highly privileged
    IAM changes. The link is provided at the end of this chapter.


    Let us look at the types of logs ETD needs to be detect threats.


    # Various log types for ETD


    Admin Activity logs, which are part of Cloud Audit Logs, are automatically consumed
    by ETD (see the following list). Admin Activity logs are created automatically
    and do not require any configuration. Furthermore, turning on extra logs, which
    the service analyzes to detect specific threats, improves the performance of ETD.
    Here are various logs that you will need to enable specifically:


    +   - SSH logs/syslog


    +   - Data Access logs (part of Cloud Audit Logs)


    +   - VPC flow logs


    +   - Cloud DNS logs


    +   - Firewall rules logs


    +   - Cloud NAT logs


    +   - GKE Data Access audit logs


    +   - HTTP(S) load balancing backend service logs


    +   - MySQL Data Access audit logs


    +   - PostgreSQL Data Access audit logs


    +   - Resource Manager Data Access audit logs


    +   - SQL Server Data Access audit logs'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Security Command Center


    > Note

    With frequent sampling and short aggregation periods, ETD works best. There may
    be a delay between the occurrence and detection of an event if you use lower sample
    rates or longer aggregation intervals. This lag can make evaluating any malware,
    cryptomining, or phishing traffic more difficult.


    When you turn on a log for ETD to scan, make sure you understand how Cloud Logging
    charges for the log data. After turning on a log, monitor the log for a couple
    of days to ensure the log doesn''t incur any unexpected Cloud Logging costs.


    Although the scanning of logs by ETD does not incur any additional costs, depending
    on the volume of log data that your organizations and projects produce, Cloud
    Logging may charge you for the ingestion and storage of the log data.


    Here are Admin Activity logs that ETD scans automatically – you do not need to
    turn on or configure these:


    +   - BigQueryAuditMetadata Data Access logs

    - Cloud DNS Admin activity logs

    - GKE Admin Activity audit logs

    - IAM Admin Activity audit logs

    - MySQL Admin Activity logs

    - PostgreSQL Admin Activity logs

    - SQL Server Admin Activity logs

    - VPC Controls Audit logs


    Now that we have looked at Google Cloud logs, let us quickly understand the Workspace
    logs that ETD uses.


    # Google Workspace audit logs


    These are enabled and maintained in your Google Workspace environment, although
    they must be shared with Google Cloud for ETD to access and detect Google Workspace
    threats:


    +   - Login Audit logs (for Data Access audit logs)

    - Admin Audit logs (for Admin Activity audit logs)


    Now you know which logs ETD uses to detect threats, let us look at the findings
    ETD generates.'
  merge: -1
  img_proc: true
- pgno: 409
