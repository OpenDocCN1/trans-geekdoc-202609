- pgno: 427
  md: '# What is Kubernetes?


    Now that you understand Kubernetes, we should also understand what Kubernetes
    is not:


    +   - Kubernetes doesn''t impose restrictions on supported applications. Kubernetes
    promises to serve stateless, stateful, and data-processing workloads. Anything
    that runs in a container should run well on Kubernetes.

    - Kubernetes does not build or deploy source code. CI/CD procedures are driven
    by organizational cultures and preferences and technical constraints.

    - Kubernetes does not include application-level services such as middleware (message
    buses), data processing frameworks (Spark), databases (MySQL), caches, or cluster
    storage systems (Ceph). Applications running on Kubernetes can access such components
    via portable interfaces such as the Open Service Broker API. The Kubernetes Open
    Service Broker (OSB) is a component that allows Kubernetes users to easily provide
    and manage services from a variety of providers.

    - Kubernetes has no configuration language/system (for example, Jsonnet). It exposes
    a declarative API that can target any declarative specification.

    - Kubernetes has no extensive configuration, maintenance, management, or self-healing
    systems.

    - Kubernetes isn''t an orchestration platform. Orchestration is the execution
    of a defined workflow: first do, A, then B, then C. Kubernetes, on the other hand,
    is a collection of independent, composable control processes that continuously
    strive to achieve the desired state. So, it does not matter how you go from state
    A to C. It also removes the need for centralized control. It makes the system
    more powerful, robust, resilient, and extensible.


    Everything at Google runs on containers, such as Gmail, Search, Maps, and even
    Google Cloud Platform (GCP). Google is said to deploy over 4 billion containers
    every week.


    Now us look at Google Cloud''s managed Kubernetes platform, called GKE.


    # GKE


    Google Kubernetes Engine (GKE) is a managed platform for Kubernetes on Google
    Cloud. It provides the following additional features on top of K8s:


    +   - Kubernetes clusters as a service

    - It runs Kubernetes on GCE

    - It is integrated with GCP

    - It supports heterogeneous and multi-zone clusters

    - It manages Kubernetes (auto-upgrades, scaling, healing, monitoring, backup,
    and so on)


    Let us now look at the architecture of GKE.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# GKE architecture


    In GKE, the master is the control plane that manages the entire lifecycle of a
    cluster. The cluster master is responsible for deciding what runs on all the cluster''s
    nodes and acts as a unified endpoint that provides the Kubernetes API Server for
    the cluster. The project that holds the control plane is managed by Google for
    you. You do not get access to this project.


    ![](img/f681dfc12450e3a4c257352b70dbceca_428_0.png)


    Figure 15.3 – GKE architecture


    Are the key components of GKE:


    +   - Control plane: The control plane is the central management component of
    GKE. It includes various services that handle cluster management, scheduling,
    and communication between different components. The control plane manages the
    state of the cluster and ensures that the desired configuration is maintained.
    The control plane is managed by Google in a Google managed project. Customers
    do not have access to this project. The control plane in GKE is designed for high
    availability and fault tolerance. It runs across multiple compute instances (VMs)
    distributed across different availability zones within a region. The control plane
    consists of several components, including the following:

    - kube-apiserver: This provides the API endpoint for interacting with the cluster.
    It handles authentication, authorization, and validation of API requests.

    - etcd: This is a distributed key-value store to store the cluster''s configuration
    data and state.

    - kube-scheduler: This assigns pods to nodes based on resource requirements, constraints,
    and availability.

    - kube-controller-manager: This runs various controllers responsible for maintaining
    the desired state of the cluster, handling replication, scaling, and other cluster-level
    operations.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '+   cloud-controller-manager: This interacts with GCP APIs to manage resources
    such as load balancers, disks, and network routes.


    +   Customer node VM: Nodes are the worker machines in GKE cluster in a customer
    project. Each node runs the Kubernetes components necessary for managing containers,
    such as the kubelet, kube-proxy, and container runtime (for example, Docker).
    Nodes are responsible for running the containerized applications and scaling resources
    based on demand.


    +   Cluster: A GKE cluster is a set of compute instances (nodes) that run containerized
    applications. The cluster is managed by the control plane and provides the underlying
    infrastructure to deploy and manage containers. It can span multiple availability
    zones for high availability and resilience.


    +   Pods: The smallest deployable units in Kubernetes. They encapsulate one or
    more containers and share the same network namespace and storage volumes. Pods
    are scheduled and managed by Kubernetes, and they provide an isolated environment
    for running applications.


    +   Services: Services provide network connectivity and load balancing for pods
    within a GKE cluster. They define a stable endpoint that can be used to access
    the application running inside the pods. Services can be exposed internally within
    the cluster or externally to the internet.


    +   Load balancers: GKE integrates with Google Cloud Balancing to distribute traffic
    across multiple nodes and services. Load balancers help distribute requests to
    pods within the cluster and provide scalability and high availability for applications.


    +   Persistent storage: GKE supports various options for persistent storage. It
    integrates with Google Cloud Storage, Persistent Disk, and other solutions to
    provide durable and scalable storage for applications running in the cluster.
    Persistent volumes can be dynamically provisioned and attached to pods.


    +   Container Registry: GKE integrates with Google Container Registry, which is
    a private container image registry. It allows you to store and manage your container
    images securely. Container Registry provides an easy way to store, share, and
    deploy container images for your applications.


    +   kubectl: kubectl is a command-line tool to interact with Kubernetes clusters.
    It is part of the official Kubernetes distribution and provides a convenient interface
    for managing and controlling Kubernetes resources. With kubectl, you can deploy
    and manage applications, inspect and modify cluster resources, view logs, execute
    commands within containers, and perform various other administrative tasks within
    a Kubernetes environment. It supports a wide range of commands and options to
    interact with the Kubernetes API server and control the desired state of your
    cluster.


    These are the key components of GKE that work together to enable the efficient
    deployment and management of containerized applications using Kubernetes. GKE
    abstracts away all the complexities of managing the underlying infrastructure,
    allowing developers to focus on building and deploying their applications. Now
    that we understand GKE architecture at a high level, it is imperative to understand
    Google''s shared responsibility model.'
