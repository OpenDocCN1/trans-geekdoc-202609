- pgno: 55
  md: '# Security and privacy of data


    Earlier in the chapter, we covered the data privacy principles adhered to by Google.
    In the previous chapter, we also covered how Google Cloud enforces the security
    of data by default, such as encrypting data in transit by default. When you store
    your data on Google Cloud, you will read and write data; thus, there will be times
    when data will be out of Google-enforced security boundaries. Enforcing the encryption
    of data in transit ensures that data is secure.


    When data is stored in Google Cloud Storage, the encryption of data at rest is
    enforced by default. This improves the security posture for any organization adopting
    Google Cloud, as you don''t have to manage the underlying encryption technology
    to manage the lifecycle or encrypt data because these are fully managed by Google
    Cloud.


    Google Cloud provides flexible options to help align with Google privacy principles
    and control your data. You can choose the level of control over your keys. For
    example, you can use Google Cloud Key Management Service (KMS) to create and manage
    your own keys, or import your own keys and store them in software, which would
    be KMS, or in Cloud Hardware Security Module (HSM), which is a FIPS 140-2 Level
    2 certified appliance.


    Many customers who have stringent compliance and regulatory requirements have
    the option of using an external key management (EKM) system. EKM systems are hosted
    by Google partners and are integrated with external HSMs. Google has built partnerships
    with selected EKM vendors, who integrate their EKM solutions with Google Cloud
    KMS. With this option, customers can use the existing key store, which can be
    HSM-based, and use the EKM solution to point to the keys. This gives customers
    the greatest control over their keys as Google does not persist them. At the time
    of writing, only Google Cloud provides such a capability to customers via its
    partners: Equinix, Fortanix, Thales, and unbound.


    On the topic of data privacy and security, another key is a requirement for many
    customers and is also a growing regulatory requirement for data residency. Google
    is committed to meeting customer needs with data residency. There are several
    capabilities and assurances that Google provides to help meets this requirement.
    Data residency can only be provided for the services listed here: https://packt.link/ENTE8.
    Let''s look at some of the capabilities that Google Cloud offers for data residency:


    +   You can control where you store your data. This applies to ensuring that your
    data stays in a physical geographical location, also known as a Google region.
    Google provides assurance, in the form of compliance reports, that Google will
    under no circumstances move or copy your data to another region. This can only
    happen if you decide to move your data. You can also apply an organization policy
    at the folder or project level, whereby resource constraint is applied to enforce
    that only approved regions can be used to launch new services. This can be further
    combined with Cloud IAM, where you can enable or disable certain services for
    users that they do not move data to locations outside of the approved geographical
    regions.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'While restricting data localization to a certain location is important, another
    control that is available to further ensure data localization Cloud KMS. Cloud
    KMS has data regionalization assurances in place. Therefore, as a customer, in
    order to maintain the data residency of your keys and data, you need both your
    keys and your data to be within the boundaries of a specific Google Cloud location.
    This can be achieved by creating a key ring in Cloud KMS that is bound to a specific
    location.


    ![](img/f681dfc12450e3a4c257352b70dbceca_56_0.png)


    Figure 3.5 – Google Cloud KMS5 geo-location configuration for key ring


    **Customer-Managed Encryption Keys (CMEKs)** provide additional data security
    controls. They also ensure that resource creators choose the appropriate locations
    for their resources.


    +   Another Cloud product that can help ensure that only users from a certain
    location access data via VPC Service Controls. This product allows you to enforce
    egress and ingress policies as well as to define IP address ranges and geo-locations
    from which you want users to access services and data. Combined with a Cloud IAM
    policy, you can allow only authorized users from locations that you define. All
    Google Cloud services inside the service perimeter, a virtual boundary inside
    the Private Cloud, can be based on a defined policy. This ensures that data is
    not moved to locations that are not allowed.


    Google recently announced a new feature, **Key Access Justifications (KAJ)**.
    Every time there is a request to decrypt using Cloud KMS or an external KMS, a
    detailed justification is provided including details as which key was requested
    to decrypt the data. This is combined with a mechanism where you can approve or
    deny key access using an automated policy that you can configure. Using these
    controls, you can also limit Google''s ability to decrypt your data. As the owner
    of the data, you are the arbitrator of who has access to your data and not the
    cloud provider.


    # Third-party risk assessments


    A third-party risk assessment or vendor risk assessment is often a requirement
    for many regulated customers who want assurance from Google Cloud about specific
    controls. An example of this would be a financial institution such as a bank that
    wants to host workloads on Google Cloud and needs Google Cloud to complete a vendor
    questionnaire. Google Cloud provides self-assessment'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'questionnaires. These are complimentary documents that cover Google Cloud''s
    security controls and can help customers assess the security of their service.
    These self-assessments are available via Google Compliance Manager, which can
    be accessed here: https://packt.link/B15d7.


    Some of the available assessments are as follows:


    +   - Google Cloud Security Alliance (CSA) STAR self-assessment is available here:
    https://packt.link/rnqoe.

    - The Standardized Information Gathering (SIG) core questionnaire can be accessed
