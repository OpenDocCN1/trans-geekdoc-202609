- pgno: 392
  md: "As shown in Figure 14.1, SCC is a collection of various modules providing detection\
    \ and alerting capability:\n\n+   **Cloud Asset Inventory** (CAI) CAI provides\
    \ full visibility of all assets in your Google Cloud organization. You can search\
    \ by type of resources, projects, and locations. CAI also provides all IAM policies\
    \ in your Google Cloud organization.\n\n+   **Vulnerability Findings**: You can\
    \ detect misconfigurations and vulnerabilities in your Google Cloud organization\
    \ using SHA, VM Manager, WSS, and Rapid Vulnerability Detection.\n\n+   **Event\
    \ Threat Detection** (ETD): ETD is a collection of threat detection capabilities\
    \ that provides alerts on threats to your Google Cloud organization. It will also\
    \ alert threats to containers and VMs.\n\nNow we get over these capabilities and\
    \ the details of how SCC generates findings.\n\n# Cloud Asset Inventory\n\nCAI\
    \ provides a list of asset metadata for your cloud resources based on when they\
    \ were created and/updated. Note that the roles in SCC are assigned at various\
    \ levels of your Google Cloud resource hierarchy. The amount of access you have\
    \ determines your ability to see, edit, create, or change findings, assets, and\
    \ security sources. Typically, security operations have access to see findings\
    \ at the organization level, while project teams have access to see at the project\
    \ level.\n\nAs a member of the security team, you need to know how to query assets\
    \ to quickly find what has changed in your cloud environment. For example, it\
    \ would be highly suspicious behavior if you found accelerator-optimized machines\
    \ (GPUs and HPC) being unexpectedly provisioned.\n\nLet us go over various features\
    \ of CAI so you can understand how it works and how to use it.\n\n# Listing assets\n\
    \nAssets are Google Cloud resources within your Google Cloud organization, such\
    \ as Compute Engine instances, projects, BigQuery datasets, or Cloud Storage buckets.\n\
    \nThe following command can be used to list assets for a given Google Cloud organization:\n\
    \n```\nORGANIZATION_ID=12344321\ngcloud scc assets list $ORGANIZATION_ID\n```\n\
    \nThe output will look like this:\n\n```\nasset:\n  createTime: '2021-10-05T17:55:14.823Z'\n\
    \  iamPolicy:\n    policyBlob: '{\"bindings\":[{role\":\"roles/owner\",\"members\"\
    :[\"serviceAccount:SERVICE_ACCOUNT@PROJECT_ID.iam.\"}]}\n```"
  merge: -1
  img_proc: true
- pgno: 393
