- pgno: 47
  md: '# #3 Trust and Compliance


    In this chapter, we will look at the very important aspects of trust and compliance.
    The first part of the chapter focuses on trust, including how Google enables security
    and privacy provides customers with full transparency. We will walk through examples
    of how you can access transparency logs and how they are used. The last part of
    the chapter covers the different compliance standards and programs that Google
    Cloud is compliant with, and how you can gain access to compliance reports. We
    will look at ways to access compliance reports using Compliance Reports Manager.


    In this chapter, we will cover the following topics:


    +   * Security and data privacy

    * Building trust using access transparency and access approval

    * Understanding compliance on Google Cloud


    # ## Establishing and maintaining trust


    Data privacy and the protection of customer data are critical in establishing
    trust. There is no shortcut to it: time and experience are the only two factors
    that help in maintaining and establishing trust. Translating to the cloud means
    that customers have the luxury of spending time whether a cloud service provider
    (CSP) can be trusted. Therefore, CSPs such as Google Cloud use compliance in order
    to demonstrate and establish trust.


    Google creates trust by means of transparency. The Google Cloud Enterprise Privacy
    Commit dictate how Google Cloud protects the privacy of its customers. Let’s take
    a look at the privacy principles that Google defines:


    +   * As a customer, you control and own your data. You define and control where
    you want to store your data (in terms of geographical location), and only you
    can decide where you want to move/copy your data to. Google does not have any
    control over copying or replicating data outside of the region you have selected.
    Google only processes the data as per the various agreements.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - Customer data is used for any ads or targeting other users for ads. Customer
    data does not belong to Google, which is very clearly stated by Google’s policies
    and principles. Google Cloud will never use customer data in other Google products,
    including ads, or use customer data for any purposes not discussed in mutual agreements
    with customers.


    +   - As part of the many different compliance programs that Google Cloud is compliant
    with, Google transparently collects data that it requires to perform necessary
    business functions and is aligned with compliance standards such as ISO 27001,
    SOC 2, GDPR, and other privacy best practices.


    +   - None of the data hosted on Google Cloud is shared by Google to any partners
    or third parties for any purpose. Google’s policies on data handling are very
    well defined and have procedural and technical controls built around them. Google
    has a very high bar for how customer data is stored, hosted, and served. Furthermore,
    Google’s compliance reports and legal agreements with customers provide details
    on Google Cloud’s compliance with regard to using customer data in accordance
    with legal, compliance, and regulatory requirements. Google never sells or uses
    customer data outside of the scope of the aforementioned obligations.


    +   - Every Google product has both security and privacy built into it from the
    beginning. There are well-defined policies and controls that dictate how the security
    and privacy of each product are managed and designed. These are considered of
    the highest importance.


    As we can now see, building a trusted cloud environment that customers rely on
    for their business-critical information requires security, transparency, and privacy
    to be built into it. Google’s principles ensure that these are addressed. It is
    difficult to establish trust in the absence of these principles and independent
    auditors to demonstrate adherence to the compliance standards.


    In the next section, we will look at how transparency is provided by Google Cloud.
    We will walk through a common scenario to help you understand how transparency
    logs and access approval work on Google Cloud.


    # Access Transparency and Access Approval


    Before we discuss the Access Transparency and Access Approval products, let’s
    understand why they are so important. Discussed in the previous section how transparency
    logs play a key role in establishing trust, and it also helps Google to differentiate
    its security posture. At the time of writing, other major **cloud providers (CSPs)**
    do not offer transparency logs. Customers who are highly regulated or have compliance
    requirements need to view and share logs of activities performed by the CSPs.
    Analysts such as Gartner have highlighted transparency logs as a key feature for
    CSPs.


    Now that we have established the importance of transparency for CSPs, we will
    look at the product capability that Google offers. Google has two products for
    transparency: **Access Transparency**, which provides near real-time logs whenever
    Google administrators access your Google Cloud environment, and **Access Approvals**,
    where you can control administrative access to your data.'
