- pgno: 366
  md: '# Overview of image management


    A Google Compute Engine image is a pre-configured virtual machine (VM) image that
    can be used to quickly deploy applications and services to Google Compute Engine.
    An image includes the operating system, configuration settings, and any other
    software required for the application or service to run. Securing a Google Compute
    Engine image is important to prevent unauthorized users and malicious actors from
    accessing applications and services. This can be done by setting up strong access
    control measures with identity and Access Management (IAM) tools, securing user
    accounts, and using encryption and authentication measures. Regularly updating
    the image with the latest patches and using intrusion detection and prevention
    systems can also help protect the image from potential security threats. Let’s
    understand the concept of image management used for hardening a Compute Engine
    image.


    An image in Compute Engine refers to an immutable disk image. This is not to be
    confused with a container or Docker image. We will cover container image security
    in Chapter 15, Container Security. The disk image is used to create a VM. Let’s
    take a look at Figure 13.1.


    ![](img/f681dfc12450e3a4c257352b70dbceca_366_0.png)


    Figure 13.1 – A pipeline for creating a VM image


    A machine image includes all of the configuration, metadata, permissions, and
    data from multiple disks of a VM instance. This information may be retrieved quickly
    and easily. Performing system maintenance, creating backups and recoveries, and
    cloning instances are just some of the many for machine images.


    The following data from the source instance is captured by a machine image:


    +   - Type of machine

    - Metadata of instance'
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   * Labels


    +   * Network tags


    +   * Preventative maintenance plan


    +   * Volume mapping


    +   * Hard drive information that persists across reboots


    +   * Where relevant, Unified Extensible Firmware Interface (UEFI) settings


    +   * A machine image does not capture data in memory and in the local SSD. However,
    local SSD device mapping and information about the original instance, as its name
    or IP address, can be captured.


    There are two types of image options available within the Google Cloud environment:


    +   * Public images: Google, some source groups, or third-party businesses produce
    and maintain these images. These images are accessible to all Google projects;
    no further IAM permissions are required. They can be downloaded for free. Some
    of the images are premium, for which you must pay. A list of public and premium
    images can be found in the Google Cloud documentation.


    +   * Custom images: These are your images, and they are only accessible through
    the cloud project in which you created them. By granting appropriate IAM permissions,
    you can share these with other projects. They incur a cloud storage fee, but there
    is no usage fee in Compute Engine.


    Let''s next explore more details about custom images and the options available,
    both manual and automated, to bake images.


    # Custom images for Google Compute Engine


    It is possible to customize your Compute Engine by way of a startup script, which
    allows you to install the necessary software components and handle the image.
    An efficient method is to create a custom image with your specific needs of security
    configurations and image standards. There are three ways you can customize an
    image. The process of customization is generally referred to as image baking:


    +   * Manual baking


    +   * Automated baking


    +   * Import an existing image


    The images needs to be encrypted and that can be achieved either by using Google''s
    default encryption keys or by using your own encryptions keys (customer-managed
    encryption keys).'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Image Hardening and CI/CD Security


    Changing or baking images offers the following benefits:


    +   - Shorter boot time for applications to be ready

    - A more stable environment for applications to be installed

    - Easier to go back to older versions of the image

    - During application startup, there are fewer external services that need to be
    used

    - Scaling compute instances that have identical software versions


    # Manual baking


    When you start the process of establishing a VM instance from a public image,
    you will have the opportunity to create a custom image for that instance. You
    are then able to customize the newly created instance with the applications and
    settings of your choosing the new instance has been created. After you have finished
    configuring those features, you will be able to create a custom image based on
    that instance.


    # Automated baking


    If you only have a few images that need to be managed, manual baking is an easy
    method to get started. If you have many custom images, however, employing the
    manual technique of management becomes more challenging and difficult to audit.
    HashiCorp Packer is a free and open source program that makes the process of creating
    images reproducible, auditable, and configurable.


    To learn more about creating an automated image-creation pipeline, visit the link
    provided in the Further reading section. It explains how to use Jenkins, Packer,
    and Kubernetes to build images. You can also use Packer as part of a Spinnaker
    pipeline to generate images.


    # Importing existing images


    You can migrate images by exporting them from your existing cloud infrastructure
    and moving them to Google Cloud Compute Engine. Another way to get your old images
    onto your new computer is to use Google Cloud Migrate for Compute Engine.


    Migrate for Compute Engine is a suite of tools and a service that streamlines
    the process of migrating machines from one platform to another with minimal disruption.
    This is made possible via continuous replication at the block level. Creating
    images can be done by manually baking on Compute Engine after migrating your VMs
    there.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# Encrypting images


    By default, Google''s encryption keys are used to encrypt all Compute Engine disks.
    Disk images are likewise encrypted during creation. You also have the option of
    using your own encryption keys throughout the disk creation process. If you want
    to produce an encrypted image after you''ve made the disk, you''ll need to supply
    the relevant command with the encryption keys. **Encryption at rest** in the Google
    Cloud documentation has more details about customer-supplied encryption keys.
    Images that are made from disks are also protected by encryption. Alternatively,
    you can provide your own encryption keys when you create the disks. Then, after
    you create the disk, you can create an encrypted image by giving the image command
    the keys you want.


    Refer to the encryption at rest documentation link in the *Further reading* section.
    This document provides an overview of encryption at rest features available in
    Google Cloud. It explains why encryption is important, how it works, and what
    tools are available to make encryption easier to manage.


    # Image management pipeline


    In this section, we will look at the process of creating an image management pipeline.
    The process involves a few procedures, and we will look at the high-level steps,
    including prerequisites that you need to meet before you build your image factory.
    Let''s now look at the steps:


    +   1. Create a strategy for managing image lifecycles, such as golden image promotion,
    versioning, deprecation, and deletion.

    2. Bake a golden image, and use an automated compliance check, such as Chef InSpec.

    3. Ensure that an organization policy is in place to limit the compute images
    available to individuals working on specific projects.


    You will also need to meet a couple of prerequisites:


    +   * Ensure you have a Google Cloud account.

    * You either need to have Project Editor access for an existing project, or you
    need organization permissions to be able to create a new project under the organization.


    The process of creating an image is quite similar to the process of creating source
    code. You will have access to a repository that stores the base image as well
    as the templates that you will need to construct an image build. The following
    is a tutorial that will walk you through the process of building an image.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Creating a VM image using Packer and Cloud Build


