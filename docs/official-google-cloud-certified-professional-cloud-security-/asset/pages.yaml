    So, far we have looked at what predefined roles are and the best practices surrounding
    their assignment. Now let us look at custom roles.


    # Custom roles


    In some instances, the predefined roles do not solve the purpose, or you would
    want to scale down the permissions the principal might get to a more appropriate
    level based on your requirements. In that case, you can create custom roles. The
    IAM Role Recommender (covered as part of IAM Policy Intelligence) also provides
    recommendations to create custom roles based on usage patterns. Note that some
    IAM permissions (labeled TESTING and NOT_SUPPORTED) are not supported in custom
    roles. In fact, always use permissions with the SUPPORTED label.


    Consider the following points while creating custom roles:


    +   - Permissions that are only available in folders or organizations cannot be
    included in a custom role created at the project level. Because a project cannot
    contain other projects, for example, the resourcemanager.organizations.get permission
    cannot be used in a custom role at the project level; as result, the permission
    is only applicable at the folder or organization level.


    +   - If you create a custom role for a certain project or organization, you can
    only use that role there. Individuals in other projects and organizations, and
    resources within them, cannot be granted that role.'
