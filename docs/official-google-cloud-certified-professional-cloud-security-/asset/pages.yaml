    Email: jdoe <doe@acme.com>\nFound unverified result \nDetector Type: PrivateKey\n\
    Decoder Type: PLAIN\n```\n\nAs you can see, Trufflehog has found a private key\
    \ in the Git repository. It also shows the email of the committer that committed\
    \ the key.\n\nSo far, we have seen ways of managing security around service account\
    \ keys. We will move on to understand a few more features of service accounts,\
    \ such as how to create short-lived credentials."
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Service account impersonation


    One of the key features of IAM is that you can impersonate a service account.
    Impersonation is the ability to let other users and resources act like the service
    account. We will look at that later in the section:


    +   * Service Account User: This role has iam.serviceAccounts.actAs permission,
    which allows principals to access all the resources that the service account can
    access through their own account. Suppose the principal is a user and has the
    Service Account User role. The principal can then impersonate the service account
    to set up Cloud SQL on that service account''s project.

    * This role also lets link a service account to a resource. However, this will
    not allow the principal to create a short-term OAuth token for the service accounts
    or use the Google Cloud CLI to impersonate service accounts. If you would like
    that, then you need to have the Service Account Token Creator role.

    * Service Account Token Creator: This allows principals to impersonate service
    accounts to create OAuth 2.0 access tokens, which you can use to authenticate
    with Google APIs. It also allows principals to sign JSON Web Tokens (JWTs) and
    sign binary blobs so that they can be used for authentication.


    To impersonate service accounts from outside of Google Cloud or from GKE workloads,
    use the Workload Identity role.


    There are a couple of considerations when granting impersonation capabilities
    to principals:


    +   * Be careful when granting the role on a project, folder, or organization.
    This will allow a principal to act on any service accounts created within that
    project, folder, or organization. This is not a customary practice.


    +   * Granting the role on a specific service account will allow a principal to
    act in the place of another user on that account. This is a customary practice.


    Now let us see how to handle service account access across projects.


    # Cross-project service account access


    When managing service accounts in an enterprise environment, it can be managed
    in a single project. That way, you can provide greater control over service account
    governance and the lifecycle process, and monitor the activity for any threat
    vector. This design pattern can be quite useful when you have a project implementing
    automation or monitoring tasks that span multiple projects and need to have access
    to them. This requires the ability of a service account from one project to be
    able to call resources from other projects.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/f681dfc12450e3a4c257352b70dbceca_135_0.png)


    As depicted in Figure 6.5, to support this, Google Cloud has introduced the ability
    to allow access to service accounts to resources projects. The default behavior
    is you can create a service account in one project and attach it to a resource
    in another. If you do not want this behavior, set an organization policy to prevent
    it.


    In the organization policy for the project where your service accounts are located,
    check the following Boolean constraints:


    +   - Make sure that the iam.disableCrossProjectServiceAccountUsage Boolean constraint
    is not enforced for the project. When this constraint is not enforced, Cloud IAM
    adds a project lien that prevents the project from being deleted. This lien has
    the origin iam.googleapis.com/cross-project-service-accounts. It is strongly recommended
    that you do not delete this lien.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'It is recommended that the iam.restrictCrossProjectServiceAccountLienRemoval
    Boolean constraint is enforced for the project. This Boolean constraint ensures
    that principals can remove the project lien if they have the resourcemanager.projects.updateLiens
    permission at the organization level. If this constraint is not enforced, principals
    can remove the project lien if they have this permission at the project level.


    Before you enable this feature, it is recommended that you create a proper design
    and understand all the dependencies that this process may bring across the enterprise,
    and make sure that you have considered the pros and cons of such a decision. If
    you update the organization policy, it is strongly recommended not to change it,
    especially in the production environment, as your Google Cloud resources might
    not work correctly.


    Before we move on service account activity, let us quickly go over how to configure
    WIF.


    # Configuring Workload Identity Federation with Okta


    WIF enables access to Google Cloud services without the need for service account
    keys, thereby allowing access from on-premises or other cloud providers. In the
    following configuration, we assume the use of a third-party OIDC provider as Okta
    for connecting to Google Cloud services. The client credentials flow, as defined
    in OAuth 2.0 RFC 6749, will be utilized. This flow requires the application to
    authenticate itself by passing the client ID and client Secret, after which a
    token is obtained. Machine-to-Machine (M2M) applications such as CLIs, batch jobs,
    or backend services authenticate and authorize as the application itself rather
    than a user. In such scenarios, typical authentication schemes such as username
    + password or social logins are not applicable. Instead, the OAuth client credentials
    flow is used.


    > Note\If your application requires a user context, consider using OAuth2.0 to
    access Google APIs on behalf of the user rather than WIF. You can find the details
    at https://packt.link/Uycpj.'
