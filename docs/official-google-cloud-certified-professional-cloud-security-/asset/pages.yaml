- pgno: 75
  md: '# Policy inheritance


    Organization policy inheritance works by applying the policy at the node level
    (organization/folder/project), where the policy will be inherited by the resources.
    You can also create custom policies at child nodes, and these can either merge
    or overwrite the inherited policy.


    Let''s further understand the policy inheritance rules to better understand how
    policies are evaluated and applied:


    +   - The first rule applies when no policy is defined. A resource doesn''t inherit
    or have a policy anywhere in the hierarchy, then the constraint''s default behavior
    is enforced.

    - The second rule states that if a resource has a policy set, it will override
    any policy set for that node. However, there is an exception to this rule. If
    the policy has the inheritParent attribute set to true, the resource node will
    inherit the policy from the parent node. In this case, the node-level policy will
    be merged with the inherited policy, and the two will be reconciled and evaluated.

    - The third rule is if a resource has inheritParent = false set, the resource
    will not inherit the policy from the parent node. If a policy is configured at
    the resource level, it will take effect; if no policy is configured, then the
    default behavior of the policy will be enforced as defined in the first rule.

    - The fourth rule is about managing conflicting policies. Let''s consider an example
    where you have a policy constraint defined at the folder that allows the project/123,
    and you have another policy constraint at the project level under the folder that
    denies the value project/123. In such circumstances, a parent policy allows an
    action and the project level denies the same action. DENY will always take precedence.
    This is how policies are merged. It is also highly recommended as a best practice
    to not create policy conflicts where one policy contradicts another. This results
    in confusion about the actual purpose of the policy.


    An important note on exceptions that applies to policy merges: for all organization
    policies that are derived from Boolean constraints, do not merge. For example,
    say you have defined a policy constraint at the folder level and set enforcement
    to true. Another policy constraint for the project under the folder is set to
    false. In this case, the most specific policy action, false, will take effect.'
  merge: -1
  img_proc: true
