    # Cloud NAT


    Cloud NAT is a topic that does not appear a lot in the exam. However, it is important
    to know how it works and the cases for why you would need NAT. We will also look
    at the Google Cloud implementation of NAT architecture, which is different from
    the traditional NAT architecture.


