- pgno: 159
  md: '# 7 Virtual Private Cloud


    In this chapter, we will look at Google Cloud Virtual Private Cloud (VPC). The
    chapter will focus on the network security concepts within Google Cloud, although
    we will cover some foundational networking concepts that are essential. We will
    begin by looking at how Google Cloud''s global footprint is structured with virtual
    regions and zones. Then we will cover the key concepts of VPC, such as global
    VPC versus regional, how to create custom IP address subsets, micro-segmentation,
    custom routing, and the different types of firewall rules and their usage. We
    will look at some design patterns for VPC, focusing on shared VPC in particular
    and its importance from a security perspective, and we will get an overview of
    the different types of connectivity options that are available to connect Google
    Cloud to your on-premises or third-party cloud provider using different options.
    Finally, we will look at DNSSEC and some load balancer options available to handle
    TLS.


    In this chapter, we will cover the following topics:


    +   - Introduction to VPC

    - Google regions and zones

    - VPC deployment models

    - Micro-segmentation

    - Cloud DNS

    - Load balancers

    - Hybrid connectivity options

    - Best practices and design considerations


    # Overview of VPC


    Google Cloud VPC is a virtual network built on Google''s internal production network
    and is based on Andromeda, which is Google''s implementation of its software-defined
    network. Andromeda is out of scope for the exam, but those who want to understand
    more about the underlying network and how it is built can read more about it by
    using the link in the Further reading section.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Virtual Private Cloud


    You can think of Google Cloud VPC as a virtual network, which is very similar
    to a physical environment but more powerful due to its software-defined nature.
    At a high level, VPC is responsible for providing underlying connectivity to your
    Google Cloud services, such as Compute Engine (virtual machines), Google Kubernetes
    Engine (GKE), Google App Engine (GAE), and any other Google Cloud services are
    built on top of these services. VPC natively provides load balancing and proxy
    services, which help distribute traffic to backend services, and provides the
    capability to connect your Google Cloud to either your on-premises data center
    or other cloud service providers.


    Let''s understand some of the key features that VPC offers, as it will help you
    understand what capabilities are offered and how to use them in your network design:


    +   A VPC is a global resource, including its components, such as the routes and
    the firewall rules. We will look at global/regional/zonal resources in the Google
    Cloud regions and zones section.


    +   With VPC, you have the ability to enable IPv4-based subnets. These subnets
    are regional. IPv6 is also supported, where you can enable IPv6 on supported subnets;
    the only exception is that auto-mode VPC cannot have IPv6, but if you add a custom
    subnet to the auto mode VPC, you can enable IPv6 on that subnet. The important
    thing to note here is auto mode VPC networks do not support dual-stack subnets.


    +   Firewall rules are used to control the traffic from the instances. When you
    create firewall rules for the network, they control the traffic, these rules are
    in fact applied the VM interface. This then lets you control which VMs communicate
    with each other on which ports. We will cover firewall rules in more detail in
    the Micro-segmentation section of this chapter.


    +   When you create a VPC network, all the resources inside the network with IPv4
    addressing communicate with each other without the need for any additional rules.
    Some restrictions may apply if you create firewall rules to control the traffic
    inside the VPC network.


    +   VM instances are created inside the VPC network and have a private IPv4 address
    communicate with Google APIs and services. Google Cloud has private access, which
    we will cover later in this chapter, that instances communicate with Google APIs
    and services even if they don''t have an external IP address.


    +   Fine-grained identity and access management policies are available for network
    administration. You can create custom rules to give the relevant privileges to
    your network team to manage VPC and its associated components.


    +   Shared VPC is a deployment model that can be used to centralize network functions
    in a common host project. Other services'' projects can consume network services
    from the shared VPC host project, such as IP address, subnet, and hybrid connectivity,
    as long as they are part of the same organization.'
  merge: -1
  img_proc: true
