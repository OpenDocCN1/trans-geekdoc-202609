    \ risks in containers\n\nNIST defines cybersecurity as relating to the loss of\
    \ confidentiality, integrity, and availability of information and its potential\
    \ adverse impact on an organization or business. The NIST definition of container\
    \ security includes the following:\n\n+   - Image risks: Image configuration defects,\
    \ embedded malware, embedded clear text secrets, the use of untrusted images\n\
    - Registry risks: Insecure registry connections, stale images, and inadequate\
    \ authentication and authorization to the registry are common risks\n- Orchestrator\
    \ risks: Unrestricted administrative access, unauthorized access, poorly separated\
    \ inter-container network traffic, and the mixing of workload sensitivity levels\n\
    - Container risks: Vulnerabilities within the runtime software, unbounded network\
    \ access from containers, insecure container runtime configurations, app vulnerabilities,\
    \ and rogue containers\n- Host OS risks: Large attack surface, shared kernel,\
    \ vulnerabilities in host OS components, unauthorized user access permissions,\
    \ manipulation with the host OS system, and unauthorized hosts joining the cluster\
    \ and running containers\n\nConsider these risks, at a high level, the container\
    \ threats in the cloud can be separated into three categories:\n\n+   - Container\
    \ infrastructure security: Is your infrastructure secure for deploying containers?\
    \ The threats in this category include the following:\n  - Privilege escalation\n\
    \  - Credential compromise\n  - Kubernetes API compromise\n  - Overprivileged\
    \ users"
