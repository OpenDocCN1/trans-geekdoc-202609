- pgno: 230
  md: 'Figure 8.15 shows how Cloud NAT works. Cloud NAT is offered as a managed service
    that provides high availability and seamless scalability. It allows outbound connections
    only to the internet, whereas inbound traffic is allowed only if it is in response
    to a connection initiated by an instance. Cloud NAT is a regional resource, fully
    distributed and software-defined. There are no intermediate NAT proxies in the
    data path. NAT configuration is stored in the control plane and is pushed to the
    hosts; this means NAT keeps working regardless of the control plane state, and
    there are no choke points or performance penalties. Cloud NAT also supports aliases
    on VMs and relies on the default internet route in VPC.


    It is important to note that there are cases when NAT is not performed even when
    configured. They are as follows:


    +   * The VM has an external IP.

    * The default internet route has changed.

    * There''s communication between backend VMs and the load balancer proxy.

    * There''s communication with Google APIs (Private Access is used instead).


    Next, we will look how you can create a Cloud NAT instance for a GCE instance
    that does not have an external IP address and wants to communicate with the internet.
    There are eight key steps involved in the configuration:


    +   1. First, create a VPC network and a subnet as covered in Chapter 7, Virtual
    Private Cloud.

    2. Then, create a VM instance without an external IP address. It is important
    to select the No External Interface option under the Networking tab of the GCE
    instance creation wizard.

    3. Create an ingress firewall rule to allow SSH connections. This is similar to
    how we created a firewall rule to allow IAP in the IAP section. Ensure the source
    IAP range is specified, that is the range, 35.235.240.0/20.


    +   4. Navigate to the Identity-Aware Proxy settings and under SSH & TOC RESOURCES,
    select Add Member and give the IAP-secured Tunnel User permission. Again, this
    step is similar to what we configured in the Using Cloud IAP for TCP forwarding.


    +   5. In this step, we will navigate to the GCE page and log in via SSH from
    the console to the GCE instance that we created in Step 2. Once you have successfully
    logged in to the GCE instance via SSH, from the command-line interface (CLI),
    use the curl example.com command. This should not result in any output.'
  merge: -1
  img_proc: true
