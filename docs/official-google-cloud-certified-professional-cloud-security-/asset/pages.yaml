- pgno: 426
  md: '+   Faster time to market:


    +   Small features can be rolled out multiple times a day rather than waiting
    weeks to deploy


    +   Containers are easy to roll back, so if a feature fails in canary deployment,
    it can be quickly rolled back without impacting customers


    Now that you understand the basics of containers and why to use containers, we
    will look at how to run containers in a scalable fashion using a container orchestrator
    such as Kubernetes.


    # What is Kubernetes?


    Kubernetes, also known as K8s, is an open source system for automating the deployment,
    scaling, and management of containerized applications. The name Kubernetes originates
    from Greek, meaning helman or pilot. In simple terms, think of K8s as the orchestrator
    for your container fleet. It tracks how many containers are needed, when one is
    performing well, and how to direct your traffic, among other things.


    Here are some features provided by K8s:


    +   Load balancing and service discovery: Kubernetes exposes a container using
    an independent IP address or DNS name. Kubernetes may load balance and spread
    the traffic to keep the deployment state.


    +   Storage management: Kubernetes can allow you to mount storage, also called
    volume, containers in the pods can read and write to; for example, on GKE you
    can mount volumes such as emptyDir, ConfigMap, Secret, and so on.


    +   Rollouts and rollbacks: Kubernetes does an automated rollout and rollback
    for you. You all need to define the desired state of your application.


    +   Packing: Bin packing is done automatically for you. Bin packing is a scheduling
    strategy used by the Kubernetes scheduler to optimize the allocation of resources
    across nodes in a cluster. The goal of bin packing is to maximize the utilization
    of available resources while minimizing waste.


    +   Self-healing: This is a feature of Kubernetes implemented as auto-repair in
    GKE. Auto-repair makes periodic checks on the health of cluster nodes. If a node
    fails a health check, Kubernetes will try to restart that node.


    +   Management of secrets and configurations: Kubernetes lets you deploy secrets,
    as OAuth tokens, passwords, and so on, securely. These are stored unencrypted
    in the K8s database. Secrets are kept separately from the pods that use them.
    That way, you do not need to embed secrets within your application code. GKE provides
    many advanced features for secret management.'
