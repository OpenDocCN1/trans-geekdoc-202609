- pgno: 73
  md: '# Applying constraints using the Organization Policy Service


    The Organization Policy Service provides you with a centralized and programmatic
    method to apply constraints across your organization and the respective cloud
    resources. We often dictate requirements that need to be applied organization-wide;
    these constraints are non-negotiable and every resource in your cloud environment
    has to adhere. This is where Organization Policy Service comes in, giving you
    the ability to centrally apply these policies to avoid or mitigate misconfigurations
    downstream in your projects and cloud resources. This helps you create guardrails
    that you can define, which can be based on regulatory requirements or internal
    compliance. The development teams who are now consuming Google Cloud services
    not to worry about applying these policies and duplicating the effort. This further
    reduces the number of errors that may happen as you are now centrally in control
    of applying organization-wide constraints.


    It is important to know the difference between IAM and Organization Policy Service
    constraints. While IAM focuses on who can execute an authorized action on a particular
    resource, policy constraints focus on the what, making what are enforced on the
    resources dictating how they can be configured. An example would be giving access
    to a user called Bob to perform administrative functions on Compute Engine using
    an IAM policy, but by defining a constraint of not allowing external IP addresses
    to be assigned to the compute, you can restrict Bob from configuring an external
    IP address for any instance under the organization.


    Let’s further understand how an organization policy is applied, as per Figure
    4.6.


    ![](img/f681dfc12450e3a4c257352b70dbceca_73_0.png)


    Figure 4.6 – Organization policy'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'As per the preceding illustration, an Organization Policy Administrator can
    apply an Org Policy at the organization, folder, or project level. An Org Policy
    must define a set of constraints that enforce restrictions as part of the policy.
    Once the constraints are defined, the policy can then be applied at the level
    decided by the administrator. Note that an Org Policy can be overridden at a lower
    level if needed by an Organization Policy Administrator. Next, we will take a
    look at the different types of constraints that can be applied.


    # Organization policy constraints


    Constraints, simply put, but restrictions that can be applied to a resource. You
    have the ability to apply these constraints at different node levels, such as
    organization-wide or at the folder or project level. Google Cloud defines these
    constraints as a guardrail that defines and cannot be for a particular resource.


    Every constraint is defined by a set of attributes and include a unique name such
    as constraints-compute.disableSerialAccess, a human-friendly name with a description
    of what the constraint is, followed by the default behavior of the constraint.


    Figure 4.7 shows a list of few constraints that are highly recommended for GCP
    cloud environment to enforce.


    | Services | Constraints | Description | Useful for |

    | --- | --- | --- | --- |

    | Google Compute Engine | External IPs for VM instances | Defines a set of VM
    Instances allowed to use external IP addresses. | Ensuring minimal attack surface.
    VMs should generally get internal IPs only. |

    | | Skip default network creation | Skips the creation of the default network
    and related resources during project creation. | Enforcing usage of centrally
    managed and secured VPC networks. |

    | | Require OS Login | Enables OS on all newly created projects. | Restforcing
    access to VMs to centrally managed by IAM, and not SSH keys for project/VM metadata.
    |

    | Cloud IAM | Domain restricted sharing | Defines the set of members (domains)
    that can be added to Cloud IAM policies. | Protecting against malicious acts and
    human mistakes by restricting access only for users in wholesale domains. |

    | GCP | Resource restriction (beta) | Defines the set of locations where location-based
    GCP resources can be created. | Compliance with regulations that restrict location.
    |

    | Cloud Storage | Enforce bucket policy only | Requires buckets to use Bucket
    Policy only where this constraint. | Object-level access policies do not consider
    bucket-level policy. They are hard to get visibility into, and can become a security
    risk. |


    Figure 4.7 – Example organization policy constraints


    > Note

    You can find a complete list of supported constraints at https://packt.link/Onku2.'
  merge: -1
