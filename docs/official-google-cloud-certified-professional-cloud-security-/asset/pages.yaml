    # Continuous compliance monitoring


    In a regulated organization, compliance takes precedence as it is mandated by
    regulations; however, compliance is now generally enforced by all security-conscious
    organizations, regardless of regulations. SCC provides the ability to continuously
    monitor your Google Cloud compliance posture by doing the following:


    +   - Identifying compliance violations in your Google Cloud assets helps you
    resolve them by following actionable suggestions


    +   - Reviewing and exporting compliance reports to ensure all your resources
    are meeting their compliance requirements


    +   - Supporting compliance standards, such as these:


    +   - Payment Card Industry Data Security Standard (PCI DSS v3.2.1)


    +   - International Organization for Standardization (ISO 27001)


    +   - National Institute of Standards and Technology (NIST 800-53)


    +   - Center for Internet Security (CIS) 1.0 and 1.1 benchmarks


    Now let us look at how SCC supports these standards.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# CIS benchmarks


    SCC supports CIS benchmarks for Google Cloud. CIS 1.0 and CIS 1.1 are still supported,
    but eventually, they will be deprecated. It is recommended to use or transition
    to using the latest benchmark, CIS 1.2:


    +   - CIS Google Cloud Computing Foundations Benchmark v1.2.0 (CIS Google Cloud
    Foundation 1.2)

    - CIS Google Cloud Computing Foundations Benchmark v1.1.0 (CIS Google Cloud Foundation
    1.1)

    - CIS Google Cloud Computing Foundations Benchmark v1.0.0 (CIS Google Cloud Foundation
    1.0)


    # Additional standards


    The PCI DSS and the OWASP Foundation do not supply or approve additional compliance
    mappings, which are included for reference only. To manually check for these violations,
    consult the PCI Standard 3.2.1 (PCI-DSS v3.2.1), OWASP Top Ten, NIST 800-53, and
    ISO 27001.


    Note that this feature is exclusive for customers to check for violations of compliance
    regulations. The mappings are not intended to be used as the foundation for, or
    as a substitute for, an audit, certification, or report of compliance with any
    regulatory or industry benchmarks or standards for your products or services.


    So far, we have seen how SCC generates the finding by using various modules. Let
    us now move on to see how we can export the findings for analysis. The findings
    can also be sent for remediation in SOAR tools such as Google Chronicle SOAR.


    # Exporting SCC findings


    SCC allows you to export SCC data, including assets, findings, and security marks
    to another system on a one-time basis of your choice:


    +   - Exports of discoveries, assets, and security marks on a one-time basis

    - Continuous exports, which automatically export new discoveries to Pub/Sub SCC
    for Premium users, and allow you to export data using the SCC.API or the Google
    Cloud console

    - You may also export your results to BigQuery


    Let us look at these now.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# # One-time exports


    You can manually transmit and download current and historical findings and assets
    in JSON or JSON format via one-time exports using the Google Cloud console. You
    can upload data to a Cloud Storage bucket and download it to your local machine.
    You need to take security measures to ensure all locally stored findings are stored
    safely.


    # ## Exporting data using SCC API


    Using the SCC API, you may export assets, results, and security marks to a Cloud
    Storage bucket. The API results for discoveries or assets can be retrieved or
    exported once you have listed:


    +   - The ListFindings and ListAssets API methods are used to list findings or
    assets with any connected security markings. The methods return assets or findings
    in JSON format, complete with all their characteristics, attributes, and related
    marks. If you need data in a different format for your application, you will need
    to develop additional code to convert the JSON output.

    - The GroupAssets or GroupFindings methods are utilized if the groupBy field is
    set to a value. The GroupAssets and GroupFindings deliver a list of assets or
    findings for an organization, grouped by properties.


    # ## Continuous exports


    SCC Premium clients use continuous exports to automate the process of exporting
    SCC findings to Pub/Sub:


    +   - New discoveries are immediately exported to selected Pub/Sub topics in near-real
    time when they are written, allowing you to integrate them into your existing
    process

    - Using the SCC API, you may set up Pub/Sub finding notifications to SCC

    - To set up Pub/Sub topics, construct finding filters, and create NotificationConfig
    files (files that contain notification configuration options), you must utilize
    the Google Cloud CLI


    Now let us go over how to use Pub/Sub for continuous exports.


    # ## Configuring Pub/Sub exports


    Continuous exports let you automate the export of all future findings to Pub/Sub
    or create filters to export future findings that meet specific criteria. You can
    filter findings by category, source, asset type, security marks, severity, state,
    and other variables. Let us see how to set up an export now.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# Creating continuous exports


    Your organization can create a maximum of 500 continuous exports. To create an
    export for Pub/Sub, do the following:


    +   Go to the SCC **Findings** page in the Cloud console. In the **Filter** field,
    select the attributes, properties, or security marks you want to filter findings
    and enter the desired variables. A blank filter is evaluated as a wildcard and
    all findings are exported.

    Click **Export**, and then, under **Continuous**, click **Pub/Sub**.

    Review your filter to ensure it is correct and, if necessary, return to the **Findings**
    page to modify it.

    Under **Continuous export name**, enter a name for the export.

    Under **Export to**, select a project for your export.

    Under **Pub/Sub/Subtopic**, select the topic where you want to create findings.
    To create a topic, do the following:

    I. Select **Create a topic**.

    II. Fill out **Topic ID**, and then select other options as needed.

    III. Click **Create Topic**.


    +   Click **Save**. You will see a confirmation and are returned to the **Findings**
    page.

    Follow the guide to create a subscription for your Pub/Sub topic.


    The Pub/Sub export configuration is complete. To publish notifications, a service
    account is created for you in the form of `service-org-ORGANIZATION_ID@gcp-sa-scc-notification.iamserviceaccount.com`.
    This service account is automatically granted the `securitycenter.notificationServiceAgent`
    role at the organization level. This service account is required for notifications
    to function.


    BigQuery is a popular tool for the analysis of vast amounts of data. Now let us
    look at how to export findings to BigQuery for analysis.


    # Exporting findings to BigQuery


    Any new discoveries in SCC can be immediately exported to a BigQuery table. The
    data can then be integrated into current workflows and a unique analysis can be
    created. You can use this functionality to export findings based on your needs
    at the organization, folder, and project levels.


    Because it is fully managed and does not need manual procedures or custom code,
    this feature is the ideal solution for exporting SCC findings to BigQuery.'
  merge: -1
  img_proc: true
- pgno: 416
  md: "Here are a few points that you need to know before you export your findings\
    \ to BigQuery:\n\n+   - You create an export configuration to export findings\
    \ to BigQuery. You can create export configurations at the project, folder, or\
    \ organization level. For example, if you want to export findings from a project\
    \ to a BigQuery dataset, you create an export configuration at the project level\
    \ to export only the findings related to that project. Optionally, you can specify\
    \ filters to export certain findings.\n- You can create a maximum of 500 export\
    \ configurations to BigQuery for your organization. You can use the same dataset\
    \ for multiple export configurations. If you use the same dataset, all updates\
    \ will be made to the same findings table.\n- When you create your first export\
    \ configuration, a service account is automatically created for you. This service\
    \ account is required to create or update the findings table within a dataset\
    \ and to export findings to that service. It has service-org-ORGANIZATION_ID@gcp-sa-scc-notification.iam.gerviceaccount.com\
    \ and is granted the BigQuery Data Editor (roles/bigquery.dataEditor) role at\
    \ the BigQuery dataset level.\n\nNow let us go over the steps for exporting the\
    \ SCC findings to BigQuery:\n\n+   1. Go to the Google Cloud console.\n2. Select\
    \ the project for which you enabled the SCC API.\n3. Click Activate Cloud Shell.\n\
    4. To create a new export configuration, run the following command:\n\n```\ngcloud\
    \ scc exports create BIG_QUERY_EXPORT \\\n  --dataset=DATASET_NAME \\\n  --folder=FOLDER_ID\
    \ | --organization=ORGANIZATION_ID \\\n  --project=PROJECT_ID \\\n  [description=DESCRIPTION]\
    \ \\\n  --filter=FILTER\n```\n\nReplace the following preceding command:\n\n+\
    \   - Replace BIG_QUERY_EXPORT with a name for this export configuration.\n- Replace\
    \ DATASET_NAME with the name of the BigQuery dataset; for example, projects/<PROJECT_ID>/datasets/<DATASET_ID>.\n\
    - Replace FOLDER_ID, ORGANIZATION_ID, and PROJECT_ID with the name of your folder,\
    \ organization, or project. You must set one of these options. For folders and\
    \ organizations, the name is the folder ID or the organization ID. For projects,\
    \ the name is the project number or the project ID."
  merge: -1
  img_proc: true
- pgno: 417
  md: 'Replace DESCRIPTION with a human-readable description of the export configuration.

    This variable is optional.


    Replace FILTER with an expression that defines what findings to include in the
    export. For example, if you want to filter on the XSS_SCRIPTING category, type
    "category=\\\XSS_SCRIPTING\". This variable is optional.


    To verify the details of the export configuration, run the following command:


    ```

    gcloud bcc bexports get BIG_QUERY_EXPORT | --folder=FOLDER_ID \

    |--organization=ORGANIZATION_ID |--project=PROJECT_ID

    ```


    Replace the following:


    +   Replace BIG_QUERY_EXPORT with the name for this export configuration.


    +   Replace FOLDER_ID, ORGANIZATION_ID, and PROJECT_ID with the name of your folder,
    organization, or project. You must set one of these options. For folders and organizations,
    the name is the folder ID or the organization ID. For projects, the name is the
    project number or the project ID.


    You should see the findings in your BigQuery dataset about 15 minutes after you
    create the export configuration. After the BigQuery table is created, any new
    and updated findings that match your filter and scope will appear in the table
    in near-real time. Check out the Google Cloud documentation for useful queries
    to view the findings.


    We have seen how to export findings via Pub/Sub. These findings can be sent to
    SOAR tools to build an automated response. We will quickly go over that workflow
    now.


    # Automating a findings response


    Google provides procedures for the following four types of SOAR products for exporting
    SCC alerts and findings:


    +   Palo Alto Cortex XSOAR


    +   Elastic Stack


    +   Splunk


    +   IBM QRadar'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 394 Security Command Center


    However, you can set up an integration using Pub/Sub to any other product if it
    can ingest and parse the Pub/Sub message.


    ![](img/f681dfc12450e3a4c257352b70dbceca_418_0.png)


    Figure 14.2 – Automating SCC response


    Figure 14.2 shows an architecture of a simple workflow to automate a response
    based on SCC alerts and findings. The steps in the workflow are listed as follows.
    Each of these steps represents an action that can be taken either manually or
    automated. Understanding the various categories of threats and vulnerability findings
    is critical before building such a workflow.


    Let us quickly run through these steps:


    +   1. SCC alerts and findings are exported to the SIEM tool of your choice. As
    you saw in the previous section, you can export alerts and findings using continuous
    exports.

    2. An SIEM alert is generated based on a pre-defined criterion. Your SIEM tool
    will have logic for how to interpret the alert categories and what severity they
    are.

    3. The SOC analyst collects information, understands the context, and classifies
    the incident.

    4. The SOC analyst opens an IT service management ticket and assigns it to the
    appropriate operations team.

    5. The operations team remediates the issue or contacts the project team that
    owns the asset generated the alert for remediation.

    6. If the alert is new, the security team creates preventative controls and updates
    the security policy.'
  merge: -1
