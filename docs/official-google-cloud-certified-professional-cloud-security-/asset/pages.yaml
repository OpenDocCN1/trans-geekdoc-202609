- pgno: 93
  md: '+   4. The other important configuration is to let users specify whether the
    device they are logging in from is a trusted device. With this setting in place,
    when users first log in, they will be prompted with a username and password and
    will be asked whether they want to remember the device. If the user selects this
    option, then the next time they log in, they will not be prompted for 2SV. This
    will remain in place unless the user deletes the cookies or access is revoked.


    +   5. As part of your 2SV policy, you can also create an exception group for
    users to the policy may not apply. This can be done for a variety of users; although
    it is not recommended, you do have the option to configure it


    +   6. Next, you can give your users time to enroll in 2SV, from zero to six months.
    This helps you in rolling out 2SV if it''s being done for the first time. Users
    will get time to configure their 2SV, and after that, they will be able to log
    in. If they do not do by the enrollment deadline, they will be unable to log in.


    +   7. Finally, you have the option to select the verification methods. As a best
    practice, selecting **Only security key** is recommended as it is the most secure
    option. But you are not limited to that and have the option to configure other
    options, such as **Any verification codes via text, phone call**, which will enable
    all supported verification methods. Based on your organizational requirements,
    you can select these options.


    +   8. Other configuration options include the ability to configure a suspension
    policy and the ability to use backup codes.


    > Note

    You can read more about these settings using the following link:

    https://packt.link/BVasl. For the purpose of the exam, you should be able to configure
    a 2SV policy as explained earlier.'
  merge: -1
