- pgno: 275
  md: "The following list provides guidance on how to apply IAM roles to support your\
    \ security and administrative needs:\n\n+   - Avoid the basic project-wide roles,\
    \ such as owner, editor, and viewer, on projects that host keys or on enclosing\
    \ folders or organizations. Instead, designate an organization administrator that\
    \ is granted at the organization level, as noted on the Cloud KMS separation of\
    \ duties.\n- The Organization Admin functions as the administrator for all the\
    \ organization's cryptographic keys. Grant other IAM roles at the project level.\
    \ If you have further concerns about the separation of duties, grant IAM roles\
    \ at the key ring level or key level.\n- Use Cloud KMS predefined roles for least\
    \ privilege and separation of duties. For example, the following:\n  - Separate\
    \ administration roles (roles/cloudkms.admin and roles/cloudkms.importer) and\
    \ use roles for keys\n  - Limit the use of roles/cloudkms.admin to members of\
    \ the security administration team and to service accounts that are responsible\
    \ for creating keys and objects through tools such as Terraform\n  - For asymmetric\
    \ keys, grant roles that need private key access (roles/cloudkms.cryptoDecrypter\
    \ and roles/cloudkms.signer) separately from roles that do not need private key\
    \ access (roles/cloudkms.publicKeyViewer and roles/cloudkms.signerVerifier)\n\
    \  - In general, grant the most limited set of permissions to the lowest object\
    \ in the resource hierarchy\n\nNow that you are familiar with the best practices\
    \ for key management, let us understand some important decisions for key management\
    \ that you must make for your Cloud KMS infrastructure.\n\n# Cloud KMS infrastructure\
    \ decisions\n\nWhen you are setting up Cloud KMS for a project, you you make make\
    \ several decisions regarding your keys. The following table provides you with\
    \ guidance on what factors to consider when you create keys and key rings.\n\n\
    | Key attribute | Key attribute guidance |\n| Key location | Choose the location\
    \ that is geographically closest to the data on which you will be performing cryptographic\
    \ operations. Use the same ring location for CMEKs used for the data they are\
    \ encrypting. For more information, see choosing the best type of location in\
    \ the Cloud KMS documentation. |"
  merge: -1
