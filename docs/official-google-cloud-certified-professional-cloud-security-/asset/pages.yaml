    - Google Cloud data processing and security terms (https://packt.link/qQMu6) are
    also available to customers, covering how Google processes customer data.


    Besides these resources, Google Cloud provides security whitepapers on topics
    ranging from data encryption and privacy to incident response and compliance,
    which can be used to understand Google Cloud-specific security controls. The whitepapers
    can be accessed here: https://packt.link/c0aIn.


    # Compliance in the cloud


    In this section, we will cover two topics: how you can access the compliance reports
    that are made available by Google Cloud, and some of the tools and capabilities
    that are available to achieve continuous compliance in the cloud.


    Google products undergo compliance reviews by independent third parties, and the
    relevant compliance reports are made available to customers. There are two sets
    of compliance reports: one set can be downloaded from the Google Cloud website
    and is generally available to anyone; the other set can be requested by a Google
    Technical Account Manager (TAM) if the Google customer has a TAM assigned to their
    organization. You can find Google''s compliance reports here: https://packt.link/eaDuj.
    New Google Cloud products often have a delay of a few months before they are added
    to the compliance scope. Google has a scheduled review cycle, and new products
    are added based on that. Each product undergoes SOC 2 and ISO audits first, followed
    by market-specific certifications.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Trust and Compliance


    Google is compliant with international standards such as ISO 27001, ISO 27017,
    ISO 27018, SOC 2, and SOC 3. Besides these, there are some country-specific compliance
    frameworks, as FedRAMP for the US and MTCS for Singapore. Similarly, for other
    countries, such as Germany and Australia, Google Cloud is compliant with their
    respective in-country privacy requirements. It is important to note that every
    Google Cloud region is compliant with a consistent set of standards. Even though
    FedRAMP may not be relevant to customers in some parts of the world, Google Cloud
    regions are compliant with these standards. This is one of the key advantages
    to customers who have all compliance standards built into Google Cloud. While
    Google Cloud is compliant with standards standards across all regions, certain
    regions may not be compliant with certain local laws and regulations. This means
    that specific regulations that are applicable in the region must be taken into
    consideration when assessing compliance with any particular standard. For example,
    some regions may not be compliant with certain security standards, or a region
    may have specific data protection laws that must be adhered to. It is important
    to ensure that the region where you are using Google Cloud''s services is compliant
