    # Asset management using Cloud Asset Inventory


    Cloud Asset Inventory plays a key role in security as it gives you the ability
    to view your assets in near real time and also to detect the associated changes
    to the asset. Previously, Cloud Asset Inventory was accessible either via the
    CLI or Command Center, but with recent changes, you can now access Cloud Asset
    Inventory via the Google Cloud console.


    Cloud Asset Inventory is a metadata inventory service that lets you search, export,
    monitor, and analyze metadata related to supported Google Cloud assets. All metadata
    related to an asset is presented on a timeline where you can view historical information
    (the past five weeks) to get insights into changes to an asset. Before we look
    at some cases that Cloud Asset Inventory can help with, let''s understand some
    key concepts.


    An asset is a Google Cloud resource or a policy object. Cloud Asset Inventory
    collects metadata about resources, such as for Compute Engine, storage buckets
    of App Engine, and so on. Policy-related metadata includes IAM policies, organization
    constraint policies, and Access Context Manager policies. The third type of metadata
    information is collected for runtime information such as OS inventory, which includes
    the operating system and installed and available packages for a given Compute
    Engine virtual machine.


    > Note

    You can view the full list of all supported assets at https://packt.link/GWLD3.


    Now let''s look at some of the key attributes and features of Cloud Asset Inventory.'
  merge: -1
