- pgno: 33
  md: '# Google Cloud Security Concepts


    In this chapter, we will cover Google Cloud''s security and compliance fundamentals.
    We will take a look at how Google Cloud secures its cloud infrastructure using
    strategies such as defense in depth and zero trust. On the compliance side, we
    will look at different compliance standards and frameworks that Google Cloud is
    compliant with. Google has a unique approach to shared security responsibility
    and recently adopted the shared fate concept. We will look at these ideas to get
    a better understanding of Google''s responsibility and the customer''s responsibility
    when it comes to security.


    After that, we will look at the key pillars of security that Google Cloud applies
    to a trusted infrastructure that doesn''t rely on a single technology but multiple
    stacks. We will get a better understanding of each of those stacks and how and
    where they are applied. Finally, we will briefly cover key aspects such as threat
    and vulnerability management from a Google infrastructure perspective.


    The key topics in the chapter include the following:


    +   * Overview of Google Cloud security

    * Shared security responsibility

    * Addressing compliance with Google Cloud

    * The key pillars of security by design

    * Threat and vulnerability management


    # Overview of Google Cloud security


    The concepts in this chapter do not appear in the exam and are not part of the
    exam blueprint. As a Google Cloud security professional who will be responsible
    for securing enterprise workloads and making them compliant, it''s important that
    you gain a sound understanding of how Google secures its infrastructure. As a
    security practitioner myself, I have seen many customers who like to understand'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'such as the underlying infrastructure is secured, the hypervisor is secured,
    how Google achieves multi-tenancy, and what compliance objectives are and not
    met. To be able to advise your customers or internal teams, it''s essential to
    know about these topics.


    Google Cloud provides a very comprehensive set of security documentation on these
    topics and it''s highly recommended that you read them all. This chapter is a
    summary of some of the key topics you must know. There are links at the end of
    this chapter for you to refer to these documents.


    Google has the mission to build the most trusted cloud. In order to achieve this,
    Google has implemented multiple layers of security to protect its infrastructure,
    the data, and its users. Let''s further understand how Google Cloud doesn''t rely
    on single technologies to make it secure, but builds progressive layers of security
    that deliver true defense in depth.


    Google, from the beginning, built its infrastructure to be multi-tenant, and the
    hardware is Google built, managed, hardened, and operated. All identities, whether
    they are users or services, cryptographically authenticated, and only authorized
    binaries are allowed to run. Google applies zero-trust principles where there
    is no trust between services, and multiple mechanisms are applied to establish
    trust. As a Google Cloud user, you have the option to use the Google-owned end-to-end
    encrypted network. Google enforces Transport Layer Security (TLS) for its exposed
    Application Programming Interfaces (APIs) across its network, and any data stored
    on Cloud is encrypted by default. This makes things much simpler for organisers
    as it removes the overhead of managing encryption infrastructure and the lifecycle
    of the encryption keys. You can find more on encryption and key management in
    Chapter 9, Google Cloud Management Service. The scale of Google''s network allows
    it to absorb the largest of DDoS attacks; protection from volumetric attacks (Layers
    3 and 4) is applied by default. Last and most importantly, Google provides 24x7
    security operations to detect threats and respond to security incidents.


    In order to strengthen its security posture, Google has end-to-end provenance.
    Google servers are custom-built for the sole purpose of running Google services
    and do not include unnecessary components as video cards that can introduce vulnerabilities.
    The same applies to software, including the operating system (OS), which is a
    stripped-down, hardened version of Linux. Google has also built Titan, a custom
    security chip that offers first-nanosecond boot identity and allows for both server
    and peripherals to validate low-level components using the BIOS, bootloader, and
    kernel OS image during each boot or update cycle. Titan uses cryptographic signatures
    and is embedded across Google''s hardware infrastructure, servers, storage arrays,
    and PixelBooks and the Pixel phones. Google has developed its own network hardware
    and software to enhance performance and security, resulting in custom data center
    designs that incorporate various layers of physical and logical protection. Moreover,
    by maintaining end-to-end control over its hardware stack, Google minimizes the
    risk of third-party vendors interfering. In the event of a vulnerability, Google''s
    security teams can promptly create and deploy a solution without relying on external
    parties.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Shared security responsibility


