- pgno: 433
  md: '# GKE security features


    Let us look at how GKE provides access control.


    # Access control


    GKE supports two options for managing access to resources within the Google Cloud
    project and its clusters:


    +   - Kubernetes Role-Based Access Control (RBAC)

    - Identity and Access Management (IAM)


    These methods are similar in function, but they are focused on different types
    of resources. Let us look at them now.


    # Kubernetes RBAC


    This is a built-in feature of Kubernetes that grants granular permissions to Kubernetes
    cluster objects. Within the cluster, permissions are represented by ClusterRole
    or Role objects. Roles in Kubernetes RBAC provide permissions at the namespace
    level, while ClusterRoles offer cluster-wide permissions. Proper use of Roles
    and ClusterRoles is crucial for maintaining security by adhering to the principle
    of least privilege and enabling the separation of duties. Regular review and auditing
    of Roles and ClusterRoles are essential to ensure that permissions align with
    security requirements. RoleBinding objects allow Kubernetes users, Google Cloud
    users, Google Cloud service accounts, and Google groups to have access to roles.


    Kubernetes RBAC is the ideal choice if you utilize GKE and need fine-grained rights
    for every item and operation in your cluster. GKE has built-in support for RBAC
    that allows you to create fine-grained rules that exist within the GKE cluster.
    A Role is scoped to a specific object or a type of Kubernetes object and defines
    which actions (called verbs) the role grants in relation to that object. A RoleBinding
    is also a Kubernetes object, which grants roles to users. In GKE, the subject
    can be any of the following principals:


    +   - Cloud Identity user

    - Google Cloud IAM service account

    - Kubernetes service account

    - Cloud Identity Service group


    Now, let us understand IAM for GKE.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# IAM


    IAM oversees Google Cloud resources, such as clusters and the types of things
    that can be accessed by GKE. GKE permissions/roles are assigned to IAM principals.


    Within IAM, there is no way to provide permissions to individual Kubernetes objects.
    For example, you can give a user permission to create Custom Resource Definitions
    (CRDs), but you cannot give them permission to create only one CustomResourceDefinition
    or to define configuration to a specific namespace or project cluster. If an IAM
    role is applied at the folder level, it grants rights to all clusters in the project
    or all clusters in child projects.


    IAM is a suitable choice if you use different Google Cloud components and do not
    need to maintain detailed Kubernetes-specific rules.


    IAM and Kubernetes RBAC collaborate to help you manage cluster access. RBAC regulates
    access at the cluster and namespace levels, whereas IAM manages access at the
    project level. To work with resources in your cluster, an entity must have proper
    rights at both levels.


    Now let us use GKE manages secrets.


    # Secrets


    Secrets are Kubernetes objects that store sensitive data in your clusters, such
    as passwords, OAuth tokens, and SSH keys. Secrets are more secure than plaintext
    ConfigMaps or Pod specs for storing sensitive data. Secrets provide control over
    how sensitive data is utilized and decrease the chance of unauthorized persons
    accessing it. You can create a secret using the kubectl CLI or a YAML file.


    Now let us understand how GKE tracks changes and activity.


    # Auditing


    According to the Kubernetes documentation, Kubernetes auditing provides a security-relevant,
    chronological set of records documenting the sequence of actions in a cluster.
    The cluster audits the activities generated by users, by applications that use
    the Kubernetes API, and by the control plane itself.


    Auditing allows cluster administrators to answer the following questions:


    +   * What happened?

    * When did it happen?

    * Who initiated it?

    * Where was it observed?

    * From where was it initiated?

    * To where was it going?'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# GKE security features 411


    Audit records begin their lifecycle inside the kube-apiserver component. Each
    record on each stage of its execution generates an audit event, which is then
    pre-processed according to a certain policy and written to a backend. The policy
    determines what''s recorded and the backends persist the records. The current
    backend implementations include log files and webhooks.


    The Kubernetes documentation goes on to say that each request can be recorded
    with an associated stage. The defined stages are as follows:


    +   * RequestReceived: The stage for events generated as soon as the audit handler
    receives the request, and before it is delegated down the handler chain.

    * ResponseStarted: Once the response headers are sent, but before the response
    body is sent. This stage is only generated for long-running requests (for example,
    watch).

    * ResponseComplete: The response has been completed and no more bytes will be
    sent.

    * Panic: Events generated when a panic occurred.


    The GKE audit policy defines rules about how events should be recorded and what
    data they should. GKE receives the log entries from the Kubernetes API server,
    and applies its policy to determine which entries get to the project''s logs.
    For the most part, GKE applies the following rules to log entries that come from
    the Kubernetes API server:


    +   * Entries that represent create, delete, and update requests go to the Admin
    Activity log

    * Entries that represent get, list, and updateStatus requests go to the Data Access
    log


    Admin Activity logs are turned on by default in your Google Cloud project. They
    can''t be turned off; however, you must turn on Data Access logs. Let us move
    on to understanding the features of GKE logging.


    # Logging


    By default, GKE clusters are natively integrated with Cloud Logging (Monitoring).
    When you create a GKE cluster, both Monitoring and Cloud Logging are enabled by
    default. This means you get a monitoring dashboard specifically tailored for Kubernetes
    and your logs are sent to Cloud Logging''s dedicated, persistent datastore and
    indexed for both searches and visualization in the Cloud Logs Viewer.


    There are several ways to access your logs in Cloud Logging depending on your
    use case.


    You can access your logs using the following:


    +   * Cloud Logging console: You can see your logs directly from the Cloud Logging
    console by using the appropriate logging filters to select Kubernetes resources
    such as cluster, node, pod, or container logs. Here are some sample Kubernetes-related
    queries to help you get started.'
  merge: -1
