- pgno: 319
  md: '# Allowing access to protected resources within the VPC Service Controls perimeter


    Use access levels to allow access to protected Google Cloud resources within service
    perimeters from outside a perimeter. An access level specifies a set of requirements
    that must be met in a request to be honored. Various variables, such as IP address
    and user identity, can be used to determine access levels.


    To configure access levels, you use Access Context Manager. Let''s take a look
    at it in more detail next.


    # Access Context Manager


    Access Context Manager is a policy engine that allows administrators to create
    access control policies based on factors such as user geolocation and source IP
    address. These policies can be used as part of VPC Service Controls to ensure
    that a set of controls is applied to protect data in the project from adversaries.


    Here are some rules defining access levels:


    +   - Only requests from a perimeter for resources of a protected service inside
    a perimeter are allowed.

    - Access levels allow ingress only. Use an egress policy to allow access from
    a protected resource inside a perimeter to resources outside the boundary.

    - The ingress and egress rules define which identities and resources are granted
    access to and from the perimeter. Cases that formerly needed one or more perimeter
    bridges can be replaced and simplified with ingress and egress rules. A perimeter
    bridge is a feature of Google Cloud VPC networks that allows users to securely
    and reliably connect a secure connection between two VPC networks. With these
    features, you are able to share resources, such as applications and databases,
    across the two networks. This provides an additional layer of security to protect
    resources from unauthorized access. Additionally, the perimeter bridge makes easier
    to manage traffic between the two networks.

    - Even though an access level normally accepts the external request, requests
    for a protected resource in a perimeter that originate from another perimeter
    are denied. You will need to add appropriate rules to get the desired action by
    applying ingress/egress rules.

    - For IP-based allowlists, you can only utilize public IP address ranges in the
    access levels. Internal IP addresses are not allowed in these allowlists at the
    time of writing. A VPC network has internal IP addresses, and VPC networks must
    be referenced by its containing project via an entrance or egress rule, or a service
    boundary.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Now let us look at how to configure a VPC Service Controls perimeter.


    # Configuring a VPC Service Controls perimeter


    To configure a VPC Service Controls perimeter, you should follow these high-level
    steps:


    +   1. Set up access levels.

    2. Create an access policy (aka perimeter).

    3. Secure Google-managed resources with service perimeters.

    4. Set up VPC-accessible services to add additional restrictions to how services
    can be used inside your parameters (optional).

    5. Set up private connectivity from a VPC network (optional).

    6. Allow context-aware access from outside a service perimeter using ingress rules
    (optional).

    7. Configure secure data exchange using ingress and egress rules (optional).


    You also have the option to create an access level that will determine how your
    perimeter will be accessed. Let us look at that now.


    # Creating an access level


    The following examples explain how to create an access level using different conditions:


    +   1. Open the Access Context Manager page in the Cloud console and then open
    the Access Context Manager page.

    2. If you are prompted, select your organization.

    3. At the top of the Access Context Manager page, click New.

    4. In the New Access Level pane, do the following:

    . In the Access level title box, enter a name for the access level.

    II. Click Add Attribute and select IP Subnetworks. The supported access level
    attributes are as follows:

    ni. IP subnets

    ii. Regions

    iii. Access level dependency

    iv. Principals

    v. Device policy

    III. In the IP Subnetworks box, enter an IPv4 or IPv6 CIDR block—for example,
    93.184.216.0/32.'
