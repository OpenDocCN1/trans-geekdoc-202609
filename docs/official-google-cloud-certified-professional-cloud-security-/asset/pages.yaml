- pgno: 211
  md: 'Based on your requirements, you can choose either of them. VPC comes with routing
    where you have the next hop already configured, and that is the default internet
    gateway. The VMs have the default internet gateway, where the packets are sent
    when the VM inside VPC sends a request to the Google APIs. Although the term default
    internet gateway suggests that all traffic is sent to the internet, it is not
    true. The default internet gateway routes traffic from VPCs to Google APIs within
    Google''s network. Google does not allow routing traffic to Google APIs and services
    through other VPC instances or custom hops.


    If your VPC has a default route pointing towards the default internet gateway,
    you can route all requests from your VM to the Google APIs and services without
    configuring custom routes.


    You can create a custom route and define the next hop in case where you want to
    direct the traffic to Cloud VPN or an internal load balancer. In those cases,
    you can define a custom route with the next relevant hop.


