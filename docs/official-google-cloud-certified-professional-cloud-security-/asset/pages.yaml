- pgno: 342
  md: '# Introduction to Google Cloud logging


    Cloud Logging is a managed service on Google Cloud. It gives you the ability to
    collect, store, search, analyze, monitor, and set alerts based on logs that are
    collected. You can use Cloud Logging to collect log data from over 150 applications,
    Google Cloud components, third-party cloud providers, and any combination of cloud
    platforms (hybrid environments). Cloud Logging, formerly known as Stackdriver,
    is part of Google Cloud''s operations suite. It includes a console interface called
    the Logs Explorer, query logs, and an API to manage logs programmatically.


    ![](img/f681dfc12450e3a4c257352b70dbceca_342_0.png)


    Cloud Logging is one of the four components of Google Cloud''s operations suite,
    as shown in Figure 12.1. Let''s explore each of these components in depth. Cloud
    Logging captures all logs and provides searching and filtering capabilities. Cloud
    Logging derives metrics from logs, creates dashboards, outliers, and provides
    the ability to export logs for reporting and analytics. We will cover these in
    more depth later in this chapter.


    Application Performance Management (APM) combines the monitoring and troubleshooting
    capabilities of Cloud Logging and Cloud Monitoring with Cloud Trace, Cloud Debugger,
    and Cloud Profiler, to help reduce latency and cost so you can run more efficient
    applications. This is out of scope of the Google Professional Security Engineer
    exam.


    Additionally, the Google Cloud operations suite offers multi-cloud capabilities
    in its support of both Google Cloud and Amazon Web Services and also monitor on-premises
    resources and integrate with partner solutions.'
  merge: -1
  img_proc: true
