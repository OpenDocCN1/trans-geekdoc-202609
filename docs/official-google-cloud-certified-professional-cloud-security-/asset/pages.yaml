- pgno: 115
  md: '# # 6 Google Cloud Identity and Access Management


    In this chapter, we will explore Google Cloud Identity and Access Management (IAM),
    an essential service to comprehend for the exam. With IAM, you can authorize cloud
    services, and assign appropriate access to users and applications. Acquiring a
    good understanding of IAM is crucial to ensure that your cloud implementation
    follows the principle of least privilege, restricting access to only what is necessary.

    In this chapter, we will cover the following topics:


    +   - Overview of IAM

    - IAM roles and permissions

    - Service accounts

    - IAM policy bindings

    - IAM conditions

    - Cloud Storage, IAM, and ACLs

    - Logging and IAM APIs


    # ## Overview of IAM


    In the previous chapter, we discussed Google Cloud Identity and its role in authentication,
    user management, and device management in Google Cloud and Google Workspace. Now,
    let us explore IAM, which focuses on authorization in Google Cloud. Authorization
    is a key principle of cloud computing, addressing various requirements and ensuring
    secure access to resources. Some of the problems it solves are the following:


    +   - How do I grant access to people and workloads?

    - How do I provide time-bound access?'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Google Cloud Identity Access Management


    +   - How do I create service accounts with the least privilege?

    - How do I enable services in a particular project but not others?

    - How do I grant just the right access to users?

    - How do I operate in multi-cloud environments?

    - How do I find over-provisioned access?

    - How do I troubleshoot access issues?


    ![](img/f681dfc12450e3a4c257352b70dbceca_116_0.png)


    In Figure 6.1, you can see how IAM works on the principle of who (identity) has
    what access (role) to which resource. The principal entity is usually a user,
    group, or service account. However, there are other principals, as explained later.
    The role is a set of fine-grained permissions. Permissions are predefined actions
    that you can take on a particular resource (for example, BigQuery). Permissions
    for a given resource are fixed and cannot be created. We will talk about service
    accounts later in this chapter. At this point, the thing to remember is a service
    account represents a service or application identity in Google Cloud. It is one
    of the most important distinctions in how Google Cloud handles permissions for
    workloads. *'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Overview of IAM


    In Cloud IAM, the following principals are supported:


    +   - Google account (a Gmail account is a form of Google account): Individuals
    who use a personal Google cloud have a Google account. This could be a developer,
    an administrator, or anyone else who works with the service. A person can be identified
    by any email address that is linked to a Google account. This can be gmail.com
    or any other domain.

    - Service account: A service account is an identity for an application or VM instance
    instead of a person. Service accounts are principals as well as resources. We
    will see more on this later.

    - Google group: A Google group is a group of Google accounts and service accounts.
    There is a unique email address for each Google group. Google groups provide a
    convenient way to apply IAM policies to groups of individuals. Instead of individually
    managing access controls for each person, you can add or modify access controls
    for an entity simultaneously. Additionally, you can easily add or remove members
    from a Google group, eliminating the need to modify IAM policies for user removals.

    - Google Workspace account: A Google Workspace account is a Google account linked
    to your organization-specific Google Workspace. It has business email. Google
    Workspace contains Google apps as Docs, Slides, and Sheets in addition to other
    apps that you may have learned.

    - Cloud Identity domain: Cloud Identity domains are like a Google Workspace account
    but without any of the Google apps. If your organization does not use Google Workspace,
    then you typically get a free edition of Cloud Identity. Note that there are features
    that only a premium edition of Cloud Identity can offer. Refer to Google support
    documentation for a comparison between free and premium editions.

    - All authenticated users: allAuthenticatedUsers is a unique identifier for all
    service accounts and all people on the internet who have signed in with their
    Google account, that is, any authenticated Identity. People who do not have a
    Google Workspace account or Cloud Identity domain can still use this identifier.
    For example, they can use their personal Gmail accounts. Users who have not been
    authenticated, as anonymous visitors, are not on the list. Some types of resources
    do not work with this type of principal.

    - All users: The default value is allUsers, which is a unique identifier that
    represents everyone who is on the internet, whether they are authenticated or
    not. Some types of resources do not work with this type of principal.


    Now that you understand the types of principals, let us look at how they get to
    cloud resources.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# IAM roles and permissions


    The role is a grouping of permissions in Google Cloud. Permissions cannot be granted
    to principals directly.


    There are three types of roles possible within IAM:


    +   - Basic roles or legacy roles

    - Predefined roles

    - Custom roles


    # Basic roles


    There are three basic roles that exist in IAM. These are considered legacy now
    and were introduced prior to IAM:


    +   - Viewer: Permissions for read-onlys actions that do not affect the state,
    such as viewing (but not modifying) existing resources or data

    - Editor: All Viewer permissions, plus permissions for actions that modify state,
    such as changing resources

    - Owner: All Editor permissions and the ability to manage roles and permissions
    for a project and all resources within the project


    It is important to note that the basic roles are meant to make you productive
    in time but are not recommended for production usage. In particular, the Editor
    and Owner roles grant a lot of permissions under the cover and will create over-permissive
    access in your Google Cloud environment. Enterprises usually figure out a custom
    owner role that has the right permissions to do the job and is not overly restrictive.


    # Predefined roles


    IAM provides service-specific predefined roles that are created by Google Cloud
    for easy assignment. These roles are usually product- or service-level roles based
    on a predefined set of permissions, for example, BigQuery Data Viewer. These roles
    are maintained by Google. In other words, changes in permissions (addition/deprecation)
    are taken care of Google, hence it is not recommended to create custom roles for
    services.


    At any level of the resource hierarchy, you can grant the same user various roles.
    For instance, the same user can have the roles of Compute Network Admin and Logs
    Viewer on a project and simultaneously also have the role of BigQuery Editor on
    a particular BigQuery dataset within that project.


    Now that you understand what predefined roles are, let us look at how to choose
    a predefined role for your workload. We will take the example of BigQuery roles.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Choosing predefined roles


    There are a lot of predefined roles in IAM. Usually, these roles are tailored
    for a given cloud service. Let us take the example of BigQuery. Here are the predefined
    roles supplied by Google for BigQuery:


    +   - BigQuery Admin

    - BigQuery Connection Admin

    - BigQuery Connection User

    - BigQuery Data Editor

    - BigQuery Data Owner

    - BigQuery Data Viewer

    - BigQuery Filtered Data Viewer

    - BigQuery Job User

    - BigQuery Metadata Viewer

    - BigQuery Read Session User

    - BigQuery Resource Admin

    - BigQuery Resource Editor

    - BigQuery Resource User


    How do you decide which predefined role to use? Consider the following steps:


    +   1. Identify the necessary permissions.

    2. Find the role/s that contain the permissions.

    3. Choose the most appropriate roles matching the permissions. This could be one
    role or multiple roles making sure least privileges are granted.

    4. Decide at level of the resource hierarchy to grant the role.

    5. Grant the role to a principal, and use conditions if needed.


    It is also important to understand at what level (resource/folder/organization)
    the role should be granted to the principal. We make this point often since it
    is important to know the difference, as it impacts the ability of what the user
    can do.


    Let us take an example of the BigQuery User role. Review the permissions it contains:


    +   - bigquery.bireservations.get

    - bigquery.capacityComments.get'
  merge: -1
