  md: 'This concludes the best practices for CI/CD security. Next, we''ll look at
    Shielded VMs, what they are, and how and where to use them.


    # Shielded VMs


    Shielded VMs on Google Cloud are protected against rootkits and bootkits by a
    set of security safeguards. Shielded VMs safeguard company workloads from dangers
    as remote attacks, privilege escalation, and hostile insiders.


    Shielded VMs'' verifiable integrity is achieved using the following features:


    +   - Secure Boot

    - Virtual trusted platform module (vTPM)-enabled Measured Boot

    - Integrity monitoring


    Let us look at each of them in detail.


    # Secure Boot


    Secure Boot checks all boot components'' digital signatures and stops the booting
    process if the signature verification fails. Let''s look at how Secure Boot for
    Shielded VMs works.


    Shielded VM instances run software that has been certified and confirmed by Google''s
    Certificate Authority Service. This makes sure the firmware of the instance hasn''t
    been changed and gives Secure Boot its foundation of trust. The UEFI 2.3.1 firmware
    protects the certificates that include the keys that software vendors use to sign
    the system firmware, the system boot loader, and any binaries they load. Shielded
    VMs use UEFI firmware.


    The UEFI firmware checks each boot component''s digital signature against a secure
    repository of permitted keys. Each boot component that isn''t signed properly,
    or at all, isn''t allowed to run.


    If this happens, an entry will appear in the VM instance''s serial console log
    with the strings UEFI: Failed to load image and **Status: Security Validation**,
    as well as a description of the boot option that failed.


    Now that we know Secure Boot works, let''s take a look at Google''s secure chip
    called a virtual Trusted Platform Module (vTPM).


    # Virtual Trusted Platform Module (vTPM)


    A vTPM is a specialized computer chip that can be used to protect assets used
    to authenticate access to your system, such as keys and certificates. Let''s look
    at some key aspects of vTPMs:'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'The BoringSSL library is used by the Shielded VM vTPM, which is fully compatible
    with the Trusted Computing Group (TCG) library specification 2.0. The BoringCrypto
    module is used by the BoringSSL library.


    > Note

    You can refer to NIST Cryptographic Module Validation Program Certificate #3678
    for FIPS 140-2 (https://packt.link/x1N4p) data on the BoringCrypto module.


    +   - Measured Boot is enabled by the Shielded VM vTPM, which performs the measurements
    required to generate a known good boot baseline, called the integrity policy baseline.
    See if anything has changed, the integrity policy baseline is compared to measurements
    from successive VM boots.

    - The vTPM can also be used to secure secrets by shielding or sealing them.


    We will now look at the importance of integrity monitoring and how it helps in
    understanding the security state of the VM.


    # Integrity monitoring


    Integrity monitoring assists in understanding and making decisions regarding the
    state of your VMs. Let''s look at how the process of integrity monitoring works:


    +   - Measured Boot uses Platform Configuration Registers (PCRs) to hold information
    about the components and component load order of both the integrity policy baseline
    (a known good boot sequence) and the most recent boot sequence for integrity monitoring.

    - Integrity monitoring compares the most recent boot measurements to the integrity
    policy baseline and returns two pass/fail outcomes, one for the early boot sequence
    and the other for the late boot sequence, depending on whether they match or:

    - The boot sequence from the start of the UEFI firmware until it delivers control
    to the bootloader is known as early boot.

    - The boot sequence from the bootloader to the operating system kernel is known
    as late boot.

    - An integrity validation failure occurs if any section of the most recent boot
    sequence does not match the baseline.


    In summary, integrity monitoring for VMs is a service that uses multiple layers
    of intelligence to identify and respond to potential security threats. It is an
    important tool for protecting cloud-hosted VMs from malicious actors, malicious
    software, and potential configuration vulnerabilities.'
