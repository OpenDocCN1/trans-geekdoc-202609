    # DLP use cases


    You have seen how DLP can be used to inspect, identify, and re-identify sensitive
    data in your workloads. Now let us understand various use cases to see how DLP
    fits:


    +   - discover sensitive data: With Cloud DLP, you can automatically understand
    and manage your data risk across your entire enterprise. Continuous data visibility
    can assist you in making more informed decisions, managing and reducing data risk,
    and being compliant. Data profiling is simple to set up on the Cloud console,
    and there are no jobs or overhead to worry about, so you can focus on the results
    and your business.


    +   - Classify data across your enterprise: Cloud DLP can help you categorize
    your data, whether it''s on or off the cloud, and provide the insights you need
    to ensure correct governance, management, and compliance. Publish summary findings
    to other services such as Data Catalog, Security Command Center, Cloud Monitoring,
    and Pub/Sub or save comprehensive findings to BigQuery for study. In the Cloud
    console, you may audit and monitor your data, or you can use Google Data Studio
    or another tool to create custom reports and dashboards.'
  merge: -1
  img_proc: true
