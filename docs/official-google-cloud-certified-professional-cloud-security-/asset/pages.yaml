    # Physical and hardware security


    In this section, we will look at how Google provides the physical security of
    its facilities, hardware data, provenance, and finally, we will look at boot-level
    security. Together, all these components cater to what we call low-level security
    controls for Google Cloud.


    All data that cater to Google Cloud services are designed and built as per Google''s
    stringent physical and access controls. Through the security by design principle,
    Google also implements redundant security layers for physical security.


    Google employs a range of controls to ensure secure access to its data centers,
    limiting it only to those who require it to do the job. In terms of physical security,
    Google has implemented multiple layers of protection across its global data center
    facilities. These measures include the use of Closed-Circuit Television (CCTV),
    vehicle barriers, biometric identification systems, access restrictions for authorized
    personnel, through background checks for employees with facility access, as well
    as the deployment of laser-based intrusion detection and metal detectors.


    At some sites, Google operates some of its servers inside a third-party data center.
    In those situations, Google ensures that all additional physical security controls
    mandated by Google are deployed on top of what the data center already has in
    place. These physical security controls also form part of many compliance programs.
    Therefore, it''s important for Google, in order to stay compliant, to adhere to
    consistent physical security controls for each of its facilities.


    Google has a complex infrastructure consisting of thousands of servers and plenty
    of network equipment in each of its data centers. Google custom-designs this equipment,
    which includes the server infrastructure and the network equipment.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'In order to eliminate supply chain risks, Google has a process in place to
    vet every component vendor and audit and validate the security of the components.
    As covered in earlier sections on end-to-end provenance, all of Google''s server
    and network infrastructure components have a hardware security chip built; these
    custom chips are designed by Google. With the deployment of these chips, security
    is further enhanced and Google is able to not only identify the hardware but also
    authenticate devices.


    Secure boot controls are increasingly common, and more and more customers are
    expecting their cloud service providers to have them in. Google is leading the
    space in securing the boot stack and machine identity. A secure boot is built
    into servers to ensure that the right software is running. In order to ensure
    this, Google employs techniques such as cryptographic signatures in its low-level
    components, including the kernel, BIOS, bootloader, and base operating system.
    Every time the server boots or updates, these signatures are validated. In order
    to establish a hardware root of trust, every server in the Google data center
    has an identity bound to the root of trust and the software. When using an API,
    the same authentication credentials are used for all calls made in order to manage
    the underlying systems and perform administrative tasks. To manage a large fleet
    of servers and to ensure they are updated and patched in a timely manner, Google
    has created automation systems to detect and diagnose both hardware and software-related
    issues where, if required, machines are removed from the service spectrum.


    # Threat and vulnerability management


    The reason for covering threat and vulnerability management at this point is that
    the components that form this domain, such as vulnerabilities, malware protection,
    incident response, and security monitoring, are key for customers adopting the
    cloud. Questions relating to how a cloud service provider manages threats and
    vulnerabilities are some of the top concerns of customers. Therefore, as security
    practitioners and engineers, it''s important to understand and be able to articulate
    how Google Cloud provides capabilities to manage threats and vulnerabilities.


    As part of its vulnerability management program, to keep its infrastructure secure
    from cyber threats, Google has technological controls, techniques, and processes
    to address a multitude of attack vectors. Google actively scans for security-related
    threats and has manual and automated penetration testing, security assurance programs,
    and a very mature security system that includes automated code scanning and manual
    reviews. The aim is to ensure that if a vulnerability is identified, it is proactively
    managed, contained, and controlled. Each identified vulnerability is assigned
    a priority based on its severity, and the respective team and owners are assigned
    to mitigate and fix the vulnerability.'
