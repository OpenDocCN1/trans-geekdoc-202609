- pgno: 374
  md: '# Image Hardening and CI/CD Security


    You can share images by giving different IAM roles to different projects inside
    an organization. Image Creation Project, represented in Figure 13.3, is the project
    that holds the images that you want to share with other projects, and it must
    have the IAM roles and policies applied to it:


    +   - Allow users of User Group to create instances from these images by granting
    them the compute.imageUser role

    - Allow Image Creation User to create instances in this project by granting them
    the compute.instanceAdmin role

    - Allow Image User to create images and disks in this project by granting them
    the compute.storageAdmin role


    In your projects to be able to use the shared images, you will need to ensure
    that your users have access to the compute.image API. The compute.imageUser role
    allows other users to create instances by giving them the compute.instanceAdmin
    role.


    # Image lifecycle


    After you''ve built up an image pipeline, you''ll need to keep the images up to
    date. While the pipeline creates them, you must make sure that your deployment
    techniques use the most recent versions. You''ll also need a method for curating
    images so that no outdated or obsolete images are accidentally used. With the
    image lifecycle, you can achieve that. Next, we will look at image families, which
    we covered earlier, in the Overview of image management section, that is, public
    image families and custom image families.


    # Image families


    With Compute Engine''s images, you can rest assured that your automation systems
    will always be able to make use of the most up-to-date images. An image collection
    can be organized into a family by the administrator. Then, instead of remembering
    specific image names, users will just need to remember the name of the image family.
    Since every image has a distinct name, image-build pipelines frequently generate
    names for images that include information about the program, the date, and the
    version, such as my-application-v3-20210101. Instead of always having to change
    the image''s name in automation tools, you may just refer to the family name.
    Having the most up-to-date version, such as my-application, is a breeze when you
    use image families.


    There are distinct categories for the various types of public image family always
    links to the most up-to-date version of an image in their respective region. The
    zonal fault tolerance of your workflows is improved by the fact that newly released
    images are made available in image families at different times across zones upon
    their initial global release.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'Using a custom image family, you can create your own images. The image used
    to create the family is linked to the most up-to-date version of that image. Deprecating
    the most up-to-date image in a family is one way to revert to an older version
    of the family''s images (if the previous image is not deprecated).


    You may more easily manage the images in your project with the assistance of image
    families, which help group images that are related together and allow you to roll
    ahead and back between specific image versions.


    # Deprecating an image


    You also have the ability, as an administrator, to roll back the image to which
    the image family is pointing by deprecating the image and entering the following
    command:


    ```

    gcloud compute images deprecate nginx-v3-20191019 --state DEPRECATED

    ```


    The following table shows the various stages of deprecation you can choose from:


    | State | Description |

    | --- | --- |

    | DEPRECATED | Although the image is marked as DEPRECATED, it can still be used
    for creating a VM. However, new links to this image are not allowed. Additionally,
    image families no longer refer to this image, even if it is the most-to-date image
    |

    | OBSOLETE | The image has been deemed obsolete and is no longer available for
    use. Attempts to use this image in a request will result in an error message.
    Links to this image that already exist are still valid |

    | DELETED | If you try to use a deleted image, an error message will be returned.
    |


