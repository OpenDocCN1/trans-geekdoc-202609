- pgno: 268
  md: '# Datastore protection


    HSMs are not used as permanent storage for keys; they store keys only while while
    they are being used. Because HSM storage is constrained, the HSM keys are encrypted
    and stored in the Cloud KMS key datastore.


    # Rotation policy


    Several types of keys are involved in Cloud HSM''s key protection strategy. Customers
    rotate their own keys and rely on Cloud KMS to rotate the HSM keys.


    # Provisioning and handling process


    The provisioning of HSMs is carried out in a lab equipped with numerous physical
    and logical safeguards, including, for example, multi-party authorization controls
    to help prevent single-actor compromise.


    The following are Cloud HSM system-level invariants:


    +   - The key is generated on an HSM and, throughout its lifetime, never leaves
    the well-defined boundaries of HSMs


    +   - It may be replicated on other HSMs, or on backup HSMs


    +   - It can be used as a KEK to directly or indirectly wrap customer keys that
    HSMs use


    +   - Customer keys cannot be extracted as plaintext. Customer keys cannot be
    moved outside the region of origin


    +   - All configuration changes to provisioned HSMs are guarded through multiple
    security safeguards


    +   - Administrative operations are logged, adhering to the separation of duties
    between Cloud HSM administrators and logging administrators


    +   - HSMs are designed to be protected from tampering (such as the insertion
    of malicious hardware or software modifications, or unauthorized extraction of
    secrets) throughout the operational lifecycle


    # Vendor-controlled firmware


    HSM firmware is digitally signed by the HSM vendor. Google cannot create or update
    the HSM firmware. All firmware from the vendor is signed, including development
    firmware that is used for testing.


    # Regionality


    Customer keys are assigned to specific geographic regions because of their binding
    to a specific HSM root key. For example, a key created specifically in the us-west-1
    region cannot migrate into the us-east-1 region or the US multi-region. Similarly,
    a key created in the US multi-region cannot migrate into or of the us-west-1 region.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "# Strict security procedures safeguard HSM hardware\n\nAs mandated by FIPS\
    \ 140-2 level 3, HSM devices have built-in mechanisms to protect against\nand\
    \ provide evidence of physical tampering.\n\nIn addition to the assurances provided\
    \ by the HSM hardware itself, the infrastructure for Cloud HSM\n managed according\
    \ to Google infrastructure security design.\n\n> Note\nYou can find more information\
    \ at the following link: https://packt.link/B8pgP.\n\nDocumented, auditable procedures\
    \ protect the integrity of each HSM during provisioning, deployment,\nand production:\n\
    \n+   * All HSM configurations must be verified by multiple Cloud HSM site reliability\
    \ engineers (SREs) before the HSM can be deployed to a data center\n* After an\
    \ HSM is put into service, configuration change can only be initiated and verified\
    \ by\nmultiple Cloud HSM SREs\n* An HSM can only receive firmware that is signed\
    \ by the HSM manufacturer\n* HSM hardware is not directly exposed to any network\n\
    * Servers that host HSM hardware are prevented from running unauthorized processes\n\
    \n# Service and tenant isolation\n\nThe Cloud HSM architecture ensures that HSMs\
    \ are protected from malicious or inadvertent interference\nfrom other services\
    \ or tenants.\n\nAn HSM is part of this architecture accepts requests only from\
    \ Cloud HSM, and the Cloud HSM\nservice accepts requests only from Cloud KMS.\
    \ Cloud KMS enforces that callers have appropriate\nIAM permissions on the keys\
    \ that they attempt to use. Unauthorized requests do not reach HSMs.\n\n# Key\
    \ creation flow in HSM\n\nWhen you create an HSM-backed key, the Cloud KMS API\
    \ does not create the key material but\nrequests that the HSM creates it."
  merge: -1
  img_proc: true
- pgno: 270
  md: "An HSM can only create keys in locations it supports. Each partition on an\
    \ HSM contains a wrapping key corresponding to a Cloud KMS location. The wrapping\
    \ key is shared among all partitions that support a Cloud KMS location. The key-creation\
    \ process looks like this:\n\n+   1. The KMS API Google Front End Service (GFE)\
    \ routes the key creation request to a Cloud KMS server in the location that corresponds\
    \ to the request.\n2. The Cloud KMS API verifies the identity, the caller's permission\
    \ to create keys in the project, and that the caller has a sufficient request\
    \ quota.\n3. The Cloud KMS API forwards the request to Cloud HSM.\n4. Cloud HSM\
    \ directly interfaces with the HSM. The HSM does the following:\n   I. Creates\
    \ the key and wraps it with the location-specific wrapping key.\n   II. Creates\
    \ the attestation statement for the key and signs it with the partition signing\
    \ key.\n\n+   After Cloud HSM returns the wrapped key and attestation to Cloud\
    \ KMS, the Cloud KMS API wraps the HSM-wrapped key according to the Cloud KMS\
    \ hierarchy, then writes it to the project.\n\nThis design ensures that the key\
    \ cannot be unwrapped or used outside of an HSM, cannot be extracted from the\
    \ HSM, and exists in its unwrapped state only within locations you intend.\n\n\
    # Key attestations\n\nIn cryptography, an attestation is a machine-readable, programmatically\
    \ provable statement that a piece of software makes about itself. Attestations\
    \ are a key component of trusted computing and may be required for compliance\
    \ reasons.\n\nTo view the attestations, you request a cryptographically signed\
    \ attestation statement from the HSM, along with the certificate chains used to\
    \ sign it. The attestation statement is produced by the HSM hardware and signed\
    \ by certificates owned by Google and by the HSM manufacturer (currently, Google\
    \ uses Marvell HSM devices).\n\nAfter downloading the attestation statement and\
    \ the certificate chains, you can check its attributes or verify the validity\
    \ of the attestation using the certificate chains.\n\nGoogle has developed an\
    \ attestation script, an open source Python script that you can use to verify\
    \ the attestations. You can view the source code for the script to learn more\
    \ about the attestation format and how verification works, or as a model for a\
    \ customized solution, at the following link: https://packt.link/ANloU."
  merge: -1
  img_proc: true
- pgno: 271
  md: "# Note\n\nTo learn more about how to view and verify attestations, see the\
    \ following Google Cloud documentation: https://packt.link/2A5Er.\n\n# Cryptographic\
    \ operation flow in HSM\n\nWhen you perform a cryptographic operation in Cloud\
    \ KMS, you do not need to know whether you are using an HSM-backed or software\
    \ key. When the Cloud KMS API detects that an operation involves an HSM-backed\
    \ key, it forwards the request to an HSM in the same location:\n\n+   1. The GFE\
    \ routes the request to a Cloud KMS server in the appropriate location. The Cloud\
    \ KMS API verifies the caller's identity, the caller permission to access the\
    \ key and perform the operation, and the project's quota for cryptographic operations.\n\
    2. The Cloud KMS API retrieves the wrapped key from the datastore and decrypts\
    \ one level of encryption using the Cloud KMS master key. The key is still wrapped\
    \ with the Cloud HSM wrapping key for the Cloud KMS location.\n3. The Cloud KMS\
    \ API detects that the protection level is HSM and the partially unwrapped key,\
    \ along with the inputs to the cryptographic operation, to Cloud HSM.\n4. Cloud\
    \ HSM directly interfaces with the HSM. The HSM does the following:\n   I. Checks\
    \ that the wrapped key and its attributes have been modified.\n   II. Unwraps\
    \ the key and load it into its storage.\n   III. Performs the cryptographic operation\
    \ and returns the result.\n\n+   5. The Cloud KMS API passes the result back to\
    \ the caller.\n\nCryptographic operations using HSM-backed keys are performed\
    \ entirely within an HSM in the configured location, and only the result is visible\
    \ to the caller. Now that we have looked Cloud HSM, let us move on and understand\
    \ Cloud External Key Manager (EKM). This is the newest offering from Google for\
    \ cloud key management.\n\n# Cloud EKM\n\nCloud EKM is one of the newest offerings\
    \ for data protection. With Cloud EKM, you use the keys that you manage within\
    \ an EKM partner.\n\nCloud EKM provides several benefits:\n\n+   Key provenance:\
    \ You control the location and distribution of your externally managed keys. Externally\
    \ managed keys are never cached or stored within Google Cloud. Instead, Cloud\
    \ EKM communicates directly with the external key management partner for each\
    \ request."
  merge: -1
