- pgno: 140
  md: '# Google Cloud Identity Access Management


    So far, we have seen user-managed service accounts, but there are some service
    accounts that are created and managed by Google. We will take a brief look at
    them before moving on to IAM policy bindings.


    # Service agents


    Google will create a service account for you in your project if you use one of
    the managed services (for example, Security Command Center or DLP). These are
    called service agents. Here are a couple of examples of what service agents work
    like:


    +   * **Security Center Agent**: service-53984177202@security-center-api-staging.iam.gserviceaccount.com

    * **Risk Manager Service Agent**: organizations-720164443624@gcp-sa-riskmanager.iam.gserviceaccount.com


    The service agent typically has the following:


    +   * The domain name used in the service agent''s email address

    * The role that the service agent is granted on the project

    * After you activate an API that uses the service agent, Google grants the role
    automatically


    There are some considerations when it comes to service agents:


    +   * Service agent role'' permissions are subject to change at any time.

    * Google can introduce new service agents at any time, both for existing services
    and for new services. In addition, the format of each service agent''s email address
    is subject to change.

    * Do not assign any principal impersonation ability to these service accounts.


    > Note

    All service accounts can be impersonated but some allow impersonation.


    +   * Keys for service agents cannot be created.


    Now that we have covered service accounts in detail, we will move on and learn
    about IAM policy bindings in depth.


    # IAM policy bindings


    In Google Cloud, access is managed through an IAM policy binding. An IAM policy
    is attached to a particular resource (remember, a resource could be a service
    account). An IAM policy contains a collection of role bindings that associate
    with one or more principals.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Recall that a principal could be one or more of the following:


    +   * A Google account (a Gmail account is a form of Google account)

    * A service account

    * A Google group

    * A Google Workspace account

    * A Cloud Identity domain

    * All authenticated users

    * All users


    IAM policy bindings (sometimes called bindings) associate a role to the principals
    both on the resource that the policy is attached to and on all the resource''s
    descendants (for example, a policy attached to a folder is applicable to all the
    resources underneath that folder).


    # Policy structure


    IAM policies consist of role definitions and additional details. A role binding
    defines the resources that can be accessed by specific users or groups. A role
    is associated with one or more principals, along with any applicable conditions.
    Metadata, including the tag and version, provides extra information about the
    policy.


    Let us understand some principles in creating IAM policies:


    +   * There can be up to 1,500 principals in each IAM policy. Up to 250 unique
    groups can be specified in a single policy. Note that if you employ IAM conditions
    or grant roles to many principals with lengthy identifiers, IAM may limit the
    policy to a smaller number of principals.

    * IAM tracks the number of times each principal appears in the role bindings of
    the allow policy. No principals that in more than one role are deduplicated by
    this method. For example, the principal user alice@acme.com occurs in 50 role
    bindings in the allow policy; you could add 1,450 additional principals to the
    role bindings in the allow policy. Regardless of the number of individual members
    of a domain or Google group, the domain or group is counted as a single principal.

    * Any additional information about the request, such as its origin or target resource,
    can be used as a condition to further restrict role binding. Conditional access
    is often used to determine whether a user''s request can be granted. The term
    conditional role binding refers to a role binding that includes a condition. Some
    Google Cloud services do not accept conditions in IAM policies.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Google Identity Access Management\n\nNow we understand the principles, let\
    \ us look at the structure of the policy. The IAM policy includes the following\
    \ fields:\n\n+   - An etag field, which is used for concurrency control, ensures\
    \ that policies are updated consistently. Concurrency control is supported by\
    \ IAM via an etag field in the policy. Every time an IAM policy is updated, the\
    \ value of the etag field is updated as well. As a result, an IAM policy with\
    \ an etag field but no role bindings is ineffective.\n- There is an optional version\
    \ column that indicates the policy's schema number.\n- Additionally, the IAM policy\
    \ can include an auditConfig field, which defines how each service logs activities\
    \ for each service type, including organizations, folders, projects, and billing\
    \ accounts.\n\nWithin 60 seconds of making an IAM policy modification, the new\
    \ policy will take effect. The change can take up to seven minutes, to propagate\
    \ Google Cloud in some instances.\n\nHere is an example of a simple policy:\n\n\
    ```\n{\n  \"bindings\": [\n    {\n      \"members\": [\n        \"user:bob@acme.com\"\
    \n      ],\n      \"role\": \"roles/owner\"\n    }\n  ],\n  \"etag\": \"BwUjMhSzpY\
    \ =\"\n  \"version\": 1\n}\n```\n\nThe Owner base role is provided to bob@acme.com\
    \ without restrictions in the simple policy example here. The access granted to\
    \ bob@acme.com by this position is virtually limitless.\n\nHere is an example\
    \ of a policy that has multiple roles bound to it. Each role binding confers a\
    \ to its recipient:\n\n```\n{\n  \"bindings\": [\n    {\n      \"members\": [\n\
    \        \"user:bob@acme.com\"\n      ],\n      \"role\": \"roles/resourcemager.organizationAdmin\"\
    \n    }\n}\n```"
  merge: -1
