- pgno: 267
  md: '# HSM key hierarchy


    In 9.7, Cloud KMS is the proxy for HSM. Cloud HSM root keys wrap customer keys,
    and then Cloud KMS wraps the HSM keys that are passed to Google Datastore for
    storage.


    ![](img/f681dfc12450e3a4c257352b70dbceca_267_0.png)


    Figure 9.7 – HSM key hierarchy


    Cloud HSM has a key (not shown) that controls the migration of material inside
    the Cloud HSM administrative domain. A region might have multiple HSM administrative
    domains.


    The HSM root key has two characteristics:


    +   - Customer keys wrapped by HSM root keys can be used on the HSM, but the HSM
    never returns the plaintext of the customer key


    +   - The HSM only uses the customer key for operations'
