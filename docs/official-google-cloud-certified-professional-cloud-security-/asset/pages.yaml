- pgno: 82
  md: '# Asset export


    With asset export, you can export all resources and policies using the Cloud Asset
    Inventory API. Using the ExportAssets API, you can export all assets at a given
    timestamp to a Cloud Storage file or BigQuery table. Further, you can use the
    ListAssets API to list all assets at a given timestamp and can use the GetAssetsHistory
    API to retrieve change history of specific assets for a given timeframe. Cloud
    Asset Inventory provides time metadata on resources, IAM policies, organization
    policies, and access policies. A five-week history is available to export.


    # Asset monitoring


    You can monitor your Google Cloud assets by using the real-time notification APIs,
    which can create feeds to receive asset changes in real time through Cloud Pub/Sub.
    This allows you to select interesting changes by specifying types, and Common
    Expression Library (CEL) conditions upon any data field. For example, in order
    to detect whether an @gmail account has been newly added to IAM policy, you use
    the following:


    ```

    temporal_asset.iam_policy.bindings.filter(b, b.members.exists(m, endWith("@gmail.com")).size()
    > temporal_asset.prior_asset.iam_policy.bindings.filter(b, b.members.exists(m,
    endWith("@gmail.com"))).size()0)

    ```


    This provides a continuous monitoring capability for sensitive resources and policies
    such as firewalls and IAM policies.


    # Asset analyzer


    Using a policy analyzer, you can get more details on the impact of policies on
    your cloud resources. You can answer questions such as Who can access what and
    why? You can find out who can read sensitive data from a BigQuery dataset or who
    has access to a Cloud Storage bucket and at what time.


    This is an extremely useful and powerful capability to help you gain control and
    visibility of your Google Cloud environment. Another useful feature is Asset Insights,
    which can give you details on IAM policies that are applied to your resources
    and detect risky policies so you can take corrective action.


    Another update to Cloud Asset Inventory, which is now available for use, is Asset
    Relationships. Some assets are related to each other; for instance, a server may
    be connected via a firewall rule to access a MySQL database. In situations where
    a network administrator modifies a firewall rule that breaks the connectivity
    between the web application and the database, you can establish a relationship
    based on policies and resources to help troubleshoot the issue and identify who
    (the user) did what (the action) to a resource(s) that led to an incident.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Best practices and design considerations


    Cloud Asset Inventory is not part of the exam blueprint, you may see indirect
    references to assets and policies, and it will benefit you as a Google Cloud Security
    engineer to have a foundational understanding of how asset management is done
    on Google Cloud and, more importantly, its relevance to security.


    We will next look at some of the best practices and design considerations that
    you should know about and how they apply to the resources in your project.


    # Best practices and design considerations


    Some of the design considerations are to understand how the resources will be
    managed inside the project. Using one project might be a good idea to keep it
    simple, but the isolation and separation of duties will be needed. On the flip
    side, if you use too many projects, there will be a lot of overhead to manage
    the projects, but you will achieve the separation of duties and the isolation
    required.


    Some of the design considerations to follow when breaking down resources and workloads
    into projects are follows. Bear in mind that all these considerations are related:


    +   You don''t want a misconfiguration or a compromise in one operating environment
    to impact the other. A key consideration is to reduce the blast radius.


    +   Quotas and limits are applied at the project level. It is undesirable for
    a dev/test project to consume the quota required by a prod project, or that one
    app consumes the quota of another.


    +   You want to break down cloud resources in a way that will ensure least-privilege
    access. A key consideration is reducing administrative complexity.


    +   It''s easier to track billing at the project level.


    +   Ensure the separation of duties. For example, you might want to separate central
    networking projects from app projects to achieve the separation of duties between
    networking teams and development teams.


    +   You want to achieve all the above for different operating environments by
    separating accordingly (for example, prod, test, dev, staging, and user acceptance
    testing).


    The preceding considerations help us understand how and when to consider breaking
    down resources and projects. Further to this, some key considerations for managing
    projects are having one project per application, using data classification as
    a way to keep sensitive data in separate projects and not mixing different data
    classifications, and finally, using consistent project ID naming conventions.


    The best practice is to use workload- and environment-specific projects, and as
    project creation is a repetitive task, Infrastructure as Code and automation should
    be leveraged.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'In terms of folder design considerations, try not to replicate your organization
    structure. Many examples cited here use that construct for the purpose of illustration.
    The key is to understand the workflow and access pattern. When designing your
    folder structure, the key questions to ask are these:


    +   - What is the access pattern today?

    - Does an entire team that works on an app need access to all of its components?

    - Do you have separation of access policies between different operating environments?


    This will help you understand how to organize your folder structure based on workflow
    and access control that fits your organization''s needs.


    There is almost never a need for multiple organizations. Usually, an organization
    can lump all of its data that''s subject to compliance policies into a single
    folder structure to separate it from all projects and ensure that the organization
    admins are trained in the handling of all types of compliant information.


    # Organization


    ![](img/f681dfc12450e3a4c257352b70dbceca_84_0.png)


    Figure 4.11 - Example organization structure


    Let''s consider this example: if you have to create multiple organizations, you
    can use folders to group projects based on business units, development environments,
    and teams to share common IAM permissions and organizational policies. The IAM
    permissions will use the inheritance model, and for organizational policies, you
    may make exceptions per project.


    Use multiple organizations only if teams handle data to mutually exclusive compliance
    policies (for example, HIPAA data needs to be separated from PCI data). Some key
    design considerations for managing multiple organizations include the following:


    +   - Each organization should have its own Cloud Identity account and will need
    admin accounts provisioned and managed independently

    - It requires managing multiple Cloud Identity directories (users, groups, domains)

    - IAM policies should be decentralized

    - Organization-level policies will need to be duplicated'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   - Any changes/updates to policies will need to be appropriated and applied
    to each organization


    +   - Organization-level dashboards will only provide a view of their own environment


    +   - Environments are separated by organizations


    +   - Combining environments or restructuring is very difficult


    +   - Projects cannot be easily moved between organizations


    +   - Shared VPC can only be used to share network resources within the same organization


    +   - Future-wide GCP features may not be able to be fully leveraged or may require
    workarounds to apply to all environments


    It''s important to keep these considerations in mind when looking to deploy multiple
    organizations and avoid complexity. The best practice, wherever possible, is to
    use folders to separate business units.


    # Summary


    In this chapter, we learned how to organize your Google Cloud infrastructure and
    manage your available resources. We discussed the basics of creating folders and
    projects, as well as the features available to you you want to enforce organizational
    policy constraints on them. If you''re planning on using IAM or firewall rules
    in your infrastructure, we also went over how policy inheritance works and how
    it might aid in your organizational structure. We wrapped up by reviewing Cloud
    Asset and some best practices for managing your resources.


    In the next chapter, we will do a deep dive into Cloud Identity.


    # Further reading


    For more information on GCP compliance, refer to the following links:


    +   - Resource Manager how-to: https://packt.link/RtxyV


    +   - Best Practices: GCP Resource Organization and Access Management (Cloud Next''19):
    https://packt.link/Z350x


    +   - Creating and managing organizational policies: https://packt.link/OegQi


    +   - Cloud Asset Inventory how-guide: https://packt.link/MexmV


    +   - Understanding Cloud Asset Inventory: https://packt.link/L91Io'
  merge: -1
  img_proc: true
