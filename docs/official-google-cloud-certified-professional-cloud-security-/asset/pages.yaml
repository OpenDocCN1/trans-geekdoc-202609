- pgno: 394
  md: "# Security Command Center\n\nFilter expressions must use the following comparison\
    \ operators and sub-fields must be numbers, strings, or Booleans:\n\n+   Strings:\n\
    \  * Full equality, =\n  * Partial string matching, =\n* Numbers:\n  * Inequalities,\
    \ <, >, >==\n  * Equality =\n* Booleans:\n  * Equality =\n\nNow let us see how\
    \ to create a filter and use it in a command to filter assets:\n\nLet us see some\
    \ examples of how to construct a filter.\n\nTo find a project with a specific\
    \ owner, you can form a filter like this:\n\n```\n\"security_center_properties.resource_type\
    \ = \\\"google.cloud.\nresourcemanager.Project\\\" AND security_center_properties.resource_\n\
    owners = \\\"USER\\\"\"\n```\n\nIn this example, $USER is typically in the format\
    \ user: someone@domain.com. This compares the $USER using the substring operator\
    \ , so an exact match is not necessary.\n\nTo find firewall rules using HTTP ports,\
    \ you can create a filter like this:\n\n```\n\"security_center_properties.resource_type\
    \ = \\\"google.compute.\nFirewall\\\" AND resource_properties.name =\\\"default-allow-http\\\
    \"\n```\n\nNow let us see a few examples of filters based on time conditions.\
    \ To find project assets created or before a specific time, create a filter as\
    \ follows.\n\nLet us say our requirement is for querying assets that were generated\
    \ on or before July 18, 2019 at 8:26:21 PM GMT."
  merge: -1
  img_proc: true
- pgno: 395
  md: 'You can express time with the create_time filter in the following forms and
    types:


    ```

    Unix time (milliseconds) as an integer literal

    "create_time <= 15634181581000"

    RFC 3339 as a string literal

    "create_time <= "2019-07-10T18T20:26:21+00:00"

    ```


    # Listing assets at a point in time


    The previous examples demonstrate how to create a list of an organization''s current
    assets. You can also view a historical snapshot of an organization''s assets using
    SCC.


    The following example retrieves the current state of all assets at a point in
    time. Millisecond time resolutions are supported by SCC:


    ```

    # ORGANIZATION_ID=12344321

    # READ_TIME follows the format YYYY-MM-DDThh:mm:ss.ffffff

    READ_TIME=2019-02-28T00:06:86LZ

    gcloud cc assets list $ORGANIZATION_ID -read time=$READ_TIME

    ```


    # Listing assets that changed state


    A prime requirement is to be able to find assets that changed state after a certain
    time. You can compare an asset at two points in time to see whether it was added,
    removed, or present at the specified time using SCC.


    The following example compares projects that exist at READ_TIME to a previous
    point in time by COMPARE_DURATION. Note that COMPARE_DURATION is provided in seconds.


    When COMPARE_DURATION is set, the stateChange attribute in the result of the list
    asset query is updated with one of the following values:


    +   - ADDED: The asset was not present at the start of compareDuration, but was
    present at readTime

    - REMOVED: The asset was present at the start of compareDuration, but was not
    present at readTime

    - ACTIVE: The asset was present at both the start and the end time defined by
    compareDuration and readTime'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Security Command Center


    Now let us see how to use the filter for this condition:


    ```

    # ORGANIZATION_ID=12344321

    # READ_TIME follows the format YYYY-MM-DDThh:mm:ss.ffffff

    READ_TIME=2019-02-28T07:00:06.812Z

    FILTER="security_center_properties.resource_type="google.cloud.

    resourcemager.Project="*"

    COMPARE_DURATION=8640s

    ```


    Now execute the following using the preceding filter:


    ```

    gcloud scc assets list $ORGANIZATION_ID --read-time=$READ_TIME

    --filter="$FILTER"

    --compare-duration=$COMPARE_DURATION

    ```


    We will take a bit of export and look at an important aspect of asset analysis:
    BigQuery exports. You can export assets to BigQuery and run queries using SQL.
    Let us see how to do that.


    # Exporting assets to BigQuery


    In this section, we will quickly see how to export assets to BigQuery and run
    data analysis on your asset inventory. BigQuery provides a SQL-like experience
    for users to analyze data and produce meaningful insights using the power of custom
    scripts.


    Before you execute the queries, follow this URL to set up BigQuery export of assets:

    https://packt.link/wvQq.


    Let us look at some of the most run queries for assets. Replace PROJECT_ID, DATASET_ID,
    and\TABLE_NAME with the appropriate values for your project:


    +   1. Find the count of asset type using the following query:


    ```

    SELECT asset_type, COUNT(*) AS asset_count

    FROM `PROJECT_ID.DATASET_ID.TABLE_NAME`

    GROUP BY asset_type

    ORDER BY asset_count DESC

    ```


    +   2. To find an organization, folder or project that allows creating using a
    public IP, run the following query. This query is useful because allowing public
    IPs with Cloud SQL instances can introduce vulnerabilities unless SSL or a proxy
    is configured:


    ```

    SELECT name

    FROM `PROJECT_ID.DATASET_ID.TABLE_NAME`

    JOIN UNNEST(org_policy) AS op

    WHERE

    op.constraint = "constraints/sql.restrictPublicIp"

    AND (op.boolean_policy IS NULL OR op.boolean_policy.enforced = FALSE);

    ```'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Cloud Asset Inventory 373


    The preceding two queries are for general cloud assets; however, one of the important
    aspects of asset inventory is to find IAM policies that potentially violate your
    organization''s security policies. Let us look at these now. Replace PROJECT_ID,
    DATASET_ID, and TABLE_NAME with the appropriate values for your project.


    3. To find IAM policies that grant access to Gmail accounts, run the following
    query. This query is useful to see whether there has been any escalation from
    your Google Cloud organization to consumer accounts:


    ```

    SELECT name, asset_type, bindings.role

    FROM PROJECT_ID.DATASET_ID.TABLE_NAME

    JOIN UNNEST (iam_policy.bindings) AS bindings

    JOIN UNNEST (bindings.members) AS principals

    WHERE principals like %@gmail.com

    ```


    4. To find IAM policies that grant access to users rather than groups (as you
    know this is an anti-pattern for IAM access control), run the following query:


    ```

    SELECT name, asset_type, bindings.role, members

    FROM ''asset-inventory-api.iam_asset_inventory.iam_policy_inventory''

    JOIN UNNEST (iam_policy.bindings) AS bindings

    JOIN UNNEST (bindings.members) AS members

    WHERE members like "@acme.com"order by name

    ```


    5. To find IAM policies containing all service accounts, run the following query.
    This query is important to find out which service accounts are granted privileged
    roles:


    ```

    SELECT name, asset_type, bindings.role, members

    FROM ''asset-inventory-api.iam_asset_inventory.iam_policy_inventory''

    JOIN UNNEST (iam_policy.bindings) AS bindings

    JOIN UNNEST (bindings.members) AS members

    WHERE members like "serviceAccount%"

    order by name

    ```


    6. To find IAM policies that are granted using groups, execute a query like this:


    ```

    SELECT name, asset_type, bindings.role, members

    FROM ''asset-inventory-api.iam_asset_inventory.iam_policy_inventory''

    JOIN UNNEST (iam_policy.bindings) AS bindings

    JOIN UNNEST (bindings.members) AS members

    WHERE members like "group%"

    order by name

    ```


    Now that we have a solid understanding of how to query assets either using SCC
    or BigQuery, we will move on to another module of SCC for detecting misconfigurations.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Detecting security misconfigurations and vulnerabilities


    Most of the cloud threats that you find will be due to security misconfigurations
    or a lack of understanding how the cloud works. So, it is critical to understand
    how to find misconfigurations and how to quickly analyze and fix them. SCC reports
    findings from four categories of detectors:


    +   - Security Health Analytics

    - Rapid Vulnerability Detection

    - Web Security Scanner

    - VM Manager vulnerabilities


    Now us look at each of them to understand the details.


    # Security Health Analytics


    SHA is a service within SCC that has built-in detectors to identify misconfigurations.
    SHA automatically scans your Google Cloud organization for known vulnerable configurations
    against compliance benchmarks as CIS, PCI DSS, NIS 800-53, ISO 27001, and the
    OWASP Top 10. SHA scans begin around an hour after SCC is turned on and can be
    done in one of modes: batch mode, which conducts scans twice a day; 12 hours apart;
    and real-time mode, which executes scans in response to asset configuration changes.


    SHA scans are available in three different modes:


    +   - Batch scan: All detectors are set to run two or more times per day for all
    enrolled organizations. Detectors run on various schedules to satisfy service-level
    objectives (SLOs). Detectors execute batch scans every 6 or 12 hours to meet 12-
    and 24-hour SLOs, respectively. Interim batch scan resources and policy changes
    are not immediately collected and applied in the next batch scan.


    > Note

    Batch scan timetables are performance goals rather than service assurances.


    +   - Real-time scan: When CAI reports a change in an asset''s configuration,
    supported detectors begin scanning. The findings are sent to SCC right away.

    - Mixed mode: Some detectors that offer real-time scans may not be able to detect
    changes in all supported assets in real time. Configuration updates for some assets
    are caught immediately, while batch scans capture changes for others. In the tables
    on this page, exceptions are highlighted.'
  merge: -1
  img_proc: true
