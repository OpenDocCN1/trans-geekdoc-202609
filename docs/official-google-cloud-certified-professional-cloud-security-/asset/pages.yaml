- pgno: 196
  md: 'In Figure 7.25, you first assign a name to your private zone in the Zone field.
    Then, specify DNS name, which is the domain name, and then set the DNSSEC option
    to On. Once completed, click the CREATE button.


    In the most basic form, DNSSEC works by including a digital signature in responses
    to DNS queries. So, for every DNS zone, public and private keys are created. Cloud
    DNS serves the public key (DSKEY), resource record signatures (RRSIG), and non-existence
    (NSEC) records to authenticate your zone''s contents. These are automatically
    managed by Cloud DNS when you have enabled DNSSEC.


    An important thing to note is that for DNSSEC to work, your registrar and registry
    should support DNSSEC for your top-level domain. This means that for DNSSEC to
    be effective, the company that is responsible for registering the domain name
    (registrar) and the company that is responsible for maintaining the database of
    domain names and their associated IP addresses (registry) must support DNSSEC
    for the top-level domain (for example, .com, .org, and so on).


    If you are unable to add a Delegation Sign (DS) record through your registrar
    to enable DNSSEC, enabling on Cloud DNS will have no effect. Another thing to
    be aware of is that DNSSEC is not encrypted; keys are used to authenticate the
    resolver, not to encrypt client-server queries and resolutions.


    If you are migrating from your DNSSEC-signed zone to Cloud DNS, you can use the
    Transfer state when enabling DNSSEC for your public zone. The Transfer state copies
    you relevant keys, such as the key signing key (KSK) and zone signing key (ZSK),
    from your old zone to Cloud DNS. You should keep the state as Transfer until all
    DNS changes have propagated to the authoritative DNS server and then change the
    state to On.


    # Load balancers


    In this section, we will look at load balancing. There are many different load
    balancers that are available on Google Cloud. We will look at each of the different
    types of load balancers, what they are, and when to use which type of load balancer
    based on the traffic type. We will go over a decision tree that helps you decide
    what type of load balancer would meet your requirements, with some limitations
    as well.


    The other aspects that we will cover include the difference between external and
    internal load balancers and when to use which and why; regional versus global
    load balancers; and some considerations from a network tier perspective, as some
    load balancers are only supported by Premium Tier while others are also supported
    by Standard Tier. This is an important thing to be aware of both from a cost and
    security perspective.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Load balancers


    Let us start by looking at the different types of load balancers:


    +   - Global HTTP(S) load balancer:** This load balancer handles both HTTP and
    HTTPS traffic is a proxy-based Layer 7 function that caters to your services and
    is configured behind a single external IP address. It can service traffic to different
    types of Google Cloud services as backends, such as Google Compute Engine, Google
    GKE, and Cloud Storage. You can use an external HTTP(S) load balancer to distribute
    and manage traffic for your hybrid workloads in an on-premises environment as
    well. This load balancer is implemented on Google Front End (GFE) and is global
    when using Premium Tier but can be configured to regional using Standard Tier.


    +   - Regional TCP/UDP load balancer:** This is also referred as a regional network
    load balancer and is configured as a pass-through. It balances the traffic for
    VMs in the same region. This is offered as a managed service and can cater to
    any client on the internet, using Google Compute Engine (NAT). With an external
    IP address and clients using Cloud Network Address Translation, this load balancer
    is not a proxy, and it distributes traffic to the backend VMs at the packet''s
    source and destination IP address and protocol. The traffic is terminated directly
    to the client and not through the load balancer.


    +   - SSL proxy load balancer (global):** This is a reverse proxy load balancer
    that distributes SSL traffic to the nearest backend VMs. The SSL proxy load balancer
    terminating the TLS requests and forwards the traffic to the backend VM as TLS
    or TCP. With the HTTP(S) load balancer, based on the network tier, you can configure
    the SSL proxy load balancer by using Premium Tier or configure it to be regional
    if using Standard Tier. Both IPv4 and IPv6 are supported, and the traffic is intelligently
    routed to the backends based on capacity. Self-managed and Google-managed certificates
    are supported. You can also control the SSL features on the load balancer by configuring
    SSL policies.


    +   - TCP proxy load balancer (global):** This is a reverse proxy load balancer,
    and it distributes the traffic to the VMs as globally inside the Google Cloud
    VPC network. It uses a single external IP address for all users globally. All
    TCP traffic coming from the external is terminated at the load balancer and can
    be routed to the VMs as TCP or SSL. With this load balancer, you can have global
    load balancing if using Premium Tier or regional load balancer if using Standard
    Tier.


    +   - Internal TCP/UDP load balancer:** This load balancer distributes traffic
    to your internal VMs within the region in a VPC. A typical use case is using internal
    load balancers in a three-tier web architecture, where they can be deployed with
    an external load balancer. In this architecture, you will have an external HTTP(S)
    load balancer in front of your web servers and then have internal load balancers
    behind the web servers to cater and scale traffic to your VMs, which are private
    and only accessible within the VPC network.'
  merge: -1
  img_proc: true
- pgno: 198
