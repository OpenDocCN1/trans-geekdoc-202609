- pgno: 244
  md: '# Overview of Cloud KMS


    With Cloud KMS, Google''s focus is to provide a scalable, reliable, and performant
    solution with a wide spectrum of options that you can control on a platform that
    is straightforward to use. Let us start with a quick overview of the Cloud KMS
    architecture.


    # Cloud KMS Platform


    ![](img/f681dfc12450e3a4c257352b70dbceca_244_0.png)


    Figure 9.1 – The Cloud KMS architecture


    The key components of the Cloud KMS platform are depicted in Figure 9.1. Administrators
    can access key management services through the Google Cloud console or CLI, as
    well as through the REST or gRPC APIs. A REST API or gRPC is used by applications
    to access key management services.


    When creating a Cloud KMS platform, you can select a protection level to define
    which backend the key should use. The Cloud KMS platform has two backends (excluding
    Cloud EKM): the software and HSM protection levels. The software protection level
    is for keys that are protected by the hardware security module.


    Cloud KMS cryptographic operations are performed by FIPS 140-2-validated modules.
    Keys with the software protection level, and the cryptographic operations performed
    with them, comply with FIPS 140-2 Level 1. Keys with the HSM protection level,
    and the cryptographic operations performed with them, comply with FIPS 140-2 Level
    3.


    Let us now see the current offerings of Cloud KMS.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Current Cloud KMS encryption offerings


    In this section, we will look at various KMS offerings. The offerings are based
    on the source of the key material, starting from Google-managed encryption and
    going up to where the key material is managed entirely.


    Current Google Cloud portfolio


    | DEFAULT ENCRYPTION | CLOUD KMS | CLOUD HSM | KEY IMPORT | CUSTOMER-SUPPLIED
    ENCRYPTION KEYS | EXTERNAL KEY MANAGER |

    |---|---|---|---|---||}{

    | Google''s default data-at-rest encryption. Customers no access to keys or control
    of rotation. | Customer keys generated and stored by Google. | Customer keys generated
    by Google and stored in HSM. | Customer can import and use key material in Google
    HSM. | Keys owned by customer and provided each API call to be used externally
    to access data. | Keys stored in a management system of your choice, outside of
    Google Cloud. |


    Source of key material


    Google controls key material


    Customer controls key material


    Figure 9.2 – Google Cloud encryption offerings


    Figure 9.2 shows different offerings of encryption on Google Cloud.


    Cloud KMS is supported by five design pillars:


    +   1. **Customer control**: You can use Cloud KMS to handle software and hardware
    encryption keys, or you can provide your own via the key functionality.

    2. **Control and monitoring of access**: You can manage permissions on individual
    keys and how they are used.

    3. **Regionality**: Regionalization is built into Cloud KMS. Only the Cloud location
    you choose is used to produce, store, and process keys in the service.

    4. **Durability**: Cloud KMS meets the most stringent durability requirements.
    Cloud KMS checks and backs up all key material and metadata on a regular basis
    to protect against data corruption and ensure that data can be correctly decrypted.

    5. **Security**: Cloud KMS is fully linked with **Identity and Access Management
    (IAM)** and Cloud Audit Logs controls, providing robust protections against unauthorized
    access to keys. Cloud Audit Logs helps you understand who used a key and when.


    Now that you understand the underlying principles of the Cloud KMS offerings,
    let us learn the basics of key management.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Encryption and key management in Cloud KMS


    In this section, we will learn the basics of key management as it relates to Cloud
    KMS.


    ![](img/f681dfc12450e3a4c257352b70dbceca_246_0.png)


    Figure 9.3 – Key structure


    Figure 9.3 shows the structure of keys in Cloud KMS. Let us learn about the terms
    of key management:


    +   * Key: A named object representing a cryptographic key that is used for a
    specific purpose. The key material—the actual bits used for cryptographic operations—can
    change over time as we create new keys. Key version and other attributes of the
    key are connected with and managed the key. Thus, the key is the most important
    object for understanding Cloud KMS usage. Cloud KMS supports both asymmetric keys
    and symmetric keys. A symmetric key is used for symmetric encryption to protect
    some corpus of data—for example, using AES-256 GCM mode to encrypt a block of
    plaintext. An asymmetric key can be used for asymmetric encryption, or for creating
    digital signatures.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   Key ring: A grouping of keys for organizational purposes. A key ring belongs
    to a Google Cloud project and resides in a specific location. Each inherits policies
    from the key that contains them. Grouping keys with related permissions in a key
    ring lets you grant, revoke, or modify permissions to those at the key ring level
    without needing to act on each key individually. Key rings provide convenience
    and categorization, but if the grouping of key rings is not useful to you, you
    can manage permissions directly on keys. To prevent resource collisions, a key
    ring cannot be deleted. Key rings and keys do not have billable costs or quota
    limitations, so their continued existence does not affect costs or production
    limits.


    +   Key metadata: Resource names, properties of Cloud KMS resources such as IAM
    policies, key type, key size, state, and any data derived from them. Key metadata
    can be managed differently than the key material.


    +   Key version: Represents the key material associated with a key at some point
    in time. The key version is the version that contains the actual key material.
    Versions are numbered sequentially, beginning with version 1. When a key is rotated,
    a new version is created with new key material. The same key could have multiple
    versions over time, limiting the use of any single version. Symmetric keys will
    always have a primary version. This version is used for encrypting by default.
    When Cloud KMS performs decryption using symmetric keys, it automatically identifies
    which key version is needed to perform the decryption. A key version can only
    be used when it is enabled. Key versions in any state other than destroyed incur
    costs.


    +   Purpose: A key''s purpose determines whether the key can be used for encryption
    or for signing. You choose the purpose when creating the key, and all versions
    have the same purpose. The purpose of a symmetric key is always symmetric encrypt/decrypt.
    The purpose of an asymmetric key is either asymmetric encrypt/decrypt or asymmetric
    signing. You create a key with a specific purpose in mind and it cannot be changed
    after the key is created.


    +   State: A key version''s state is one of the following:


    +   - Enabled


    +   - Disabled


    +   - Destroyed


    Let us move on to understand the key hierarchy in Cloud KMS.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Key hierarchy


    The following diagram shows the key hierarchy of Cloud KMS. Cloud KMS uses Google''s
    internal KMS in that Cloud-KMS-encrypted keys are wrapped by Google''s KMS. Cloud
    KMS uses the same root of trust as Google''s Cloud KMS.


    ![](img/f681dfc12450e3a4c257352b70dbceca_248_0.png)


    Figure 9.4 – Key hierarchy


    Figure 9.4 shows the key hierarchy in Cloud KMS. There are several layers in the
    hierarchy:


    +   * Data encryption key (DEK): A key used to encrypt actual data. DEKs are managed
    by Google Cloud service on your behalf.

    * Key encryption key (KEK): A key used to encrypt, or wrap, a data encryption
    key. All Cloud KMS platform options (software, hardware, and external backends)
    let you control the KEK.

    * KMS master key: The key used to encrypt the KEK. This key is distributed in
    memory. The KMS master key is backed up on hardware devices. This key is responsible
    for encrypting KEKs.

    * KMS master key: Google''s internal KMS key.


    Now that you understand how key hierarchy works, let us go over the basics of
    encryption.


    # Envelope encryption


    As depicted in Figure 9.5, the process of encrypting data is to generate a DEK
    locally, encrypt data with the DEK, use a KEK to wrap the DEK, and then store
    the encrypted data and the wrapped DEK together. The KEK never leaves Cloud KMS.
    This is called envelope encryption. This section is more about understanding how
    Google handles envelope encryption, which is not something Google Cloud customers
    need to manage.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Encryption and key management in Cloud KMS


    Encrypted data chunk stored with wrapped DEK

    KEK stored in KMS


    ![](img/f681dfc12450e3a4c257352b70dbceca_249_0.png)


    Application

    KMS


    Figure 9.5 – Envelope encryption


    Here are the steps that are followed to encrypt data using envelope encryption:


    +   - A DEK is generated locally, specifying a cipher type and a key material
    to generate the key.

    - This DEK is used to encrypt the data.

    - A new KEK is either generated or an existing KEK from Cloud KMS is used—based
    on user preference. This KEK is used to wrap the data.

    - The wrapped DEK is stored with the encrypted data.


    Now let see the steps that are followed to decrypt data using envelope encryption.


    As depicted in Figure 9.6, the process of decrypting data is to retrieve the encrypted
    data and the wrapped DEK, retrieve the wrapped DEK, use the KEK to unwrap the
    DEK, and then use the unwrapped DEK to decrypt the data. The KEK never leaves
    Cloud KMS.


    ![](img/f681dfc12450e3a4c257352b70dbceca_249_1.png)


    Application

    Return encrypted data

    Storage system

    KMS


    Figure 9.6 – Envelope encryption


    To decrypt data using envelope encryption, you do the following:


    +   - Retrieve the encrypted data and the wrapped DEK.

    - Use the KEK stored in Cloud KMS to unwrap the encrypted DEK.

    - Use the plaintext DEK to decrypt the encrypted data.


    Now that we understand the basics of keys and envelope encryption, let us look
    at key management options within Cloud KMS.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Key management options


    In this section, we will cover several aspects of key management that are either
    Google-managed or customer-managed. It is important to know which option is best
    suited to which scenario so that you can make the right decision for a given use
    case.


    # Google Cloud''s default encryption


    Google Cloud stores all data encrypted at rest using a Google-managed default
    encryption key. The key is the AES-256 symmetric encryption key. There is no setup
    of keys or configuration required to turn on this; by default all users use this
    type of encryption. Google manages the keys and the rotation period of these keys.
    Google Cloud''s default encryption is best suited for customers who do not have
    specific requirements related to compliance or regional requirements for cryptographic
    key material. It is simple to use and does not require additional configuration
    to create keys, hence there is no cost to use it.


    # Customer-managed encryption keys (CMEKs)


    Some customers of Google Cloud have stringent regulatory and compliance requirements
    to have control over the keys used to encrypt data at rest. To help with these
    requirements, Google Cloud offers the ability to encrypt data related to those
    services using an encryption key managed by the customer within Cloud KMS. CMEKs
    mean that the customer decides the key type (software versus hardware), algorithm
    strength, and key rotation period when creating a key in Cloud KMS.


    CMEKs give you control over aspects of the key lifecycle, including (not limited
    to) the following:


    +   * Customers can disable the keys used to safeguard data at rest, limiting
    Google''s ability to decode

    * Customers can protect their data by utilizing a key that is personal to their
    location

    * Customers can rotate the keys used to protect the data either automatically
    or manually

    * Customers can use a Cloud HSM, a Cloud External Key Manager (EKM), or an existing
    key that they import into Cloud KMS to protect their data


    Customer-Managed Encryption Keys (CMEKs) are a supported feature in certain Google
    Cloud services. Let''s explore what it entails for services for CMEK support.


    # CMEK integrations


    When a service supports CMEKs, it is said to have a CMEK integration. Some services,
    such as GKE, have multiple CMEK integrations for protecting several types of data
    related to the service.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Key management options 227


    For the exact steps to enable CMEKs, see the documentation for the relevant Google
    Cloud service.

    You can expect to follow steps like these:


    +   1. You create or import a Cloud KMS key, selecting a location as is geographically
    near as possible to the location of the service''s resources. The service and
    the key can be in the same project or different projects. This is the CMEK.

    2. You grant the CryptoKey Encrypter/Decpter IAM role (roles/cloudkms.cryptoKeyEncrypterDecrypter)
    on the CMEK to the service account for that service.

    3. You configure the service to use a CMEK to protect your data. For example,
    you can configure a GKE cluster to use a CMEK to protect data at rest on the boot
    disks of nodes.


    +   * If an account has a cryptoKeyEncrypterDecrypter role, it can encrypt and
    decrypt its data. If you disable or revoke the CMEK, then data cannot be accessed.


    > Note The rotation of the CMEK will not impact data availability since the service
    keeps track of which CMEK version was used to encrypt the data and will use that
    version to decrypt it.


    # CMEK compliance


    Some services do not directly store data, or store data for only a brief period
    as an intermediate step in a long-running operation. For this type of workload,
    it is not practical to encrypt each separately. These services do not offer CMEK
    integrations, but can offer CMEK compliance, with no configuration on your part.


    A CMEK-compliant service encrypts temporary data by using an ephemeral key that
    only exists in memory and is never written to disk. When the temporary data is
    no longer needed, the ephemeral key is flushed from memory, and the encrypted
    data cannot be accessed, even if the storage resource still exists.


    A CMEK-compliant service might offer the ability to send its output to a service
    with a CMEK integration, such as Cloud Storage.


    # Customer-supplied encryption key


    You can provide your own AES-256 key, encoded in standard Base64, as an additional
    layer on top of Google-managed encryption keys. This key is known as a customer-supplied
    encryption key (CSEK).


    The CSEK is currently supported by only two services: Cloud Storage and Compute
    Engine.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# CSEKs with Cloud Storage


    If you provide a CSEK, Cloud Storage does not permanently store your key on Google''s
    servers or otherwise manage your key.


    Instead, provide you your key for each Cloud Storage operation, and your key is
    purged from Google''s servers after the operation is complete. Cloud Storage stores
    only a cryptographic hash of the key so that future requests can be validated
    against the hash. Your key cannot be recovered from this hash, and the hash cannot
    be used to decrypt your data. Here are the best practices when using CSEKs:


    +   - You should back up each key to a secure location and take precautions to
    ensure that keys are not shared with untrusted parties

    - If any file or machine containing the encryption is compromised, you should
    immediately perform key rotation for all objects encrypted with the compromised
    key


    When you apply a customer-supplied encryption key to an object, Cloud Storage
    uses the key when encrypting:


    +   - The object''s data

    - The object''s CRC32C checksum

    - The object''s MD5 hash


    Cloud Storage uses standard server-side keys to encrypt the remaining metadata
    for the object, including the object''s name. This allows you to read and update
    general metadata, as well as list and delete objects, without needing the CSEK.
    However, to perform any of these actions, you must have sufficient permission
    to do so.


    For example, if an object is encrypted with a CSEK, the key must be used to perform
    operations on the object such as downloading or moving it. If you attempt to decrypt
    the object''s metadata without providing the key, you receive metadata, such as
    the object name and content type, but not the object''s CRC32C checksum or MD5
    hash. If you supply your key with the request for the object metadata, the object''s
    CRC32C checksum and MD5 hash are included with the metadata.


    The following restrictions apply when using CSEKs:


    +   - Cloud Transfer Service and Cloud Dataflow do not currently support objects
    encrypted with CSEKs.

    - You cannot use the Google Cloud console to download objects that are encrypted
    with a CSEK. Similarly, when you use the Google Cloud console to upload an object,
    you cannot encrypt the object with a CSEK.

    - You can only set CSEKs on individual objects. You cannot set a default CSEK
    for a bucket.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Key management options


    +   - If you are performing a composition operation on objects encrypted by CSEKs,
    the component objects must be encrypted by the same key, and you need to provide
    the key with the compose request. The resulting composite object is encrypted
    by the same key.


    Now that you understand the restrictions of CSEKs with Google Cloud Storage, here
    is how you can use CSEKs with gsutil.


    # CSEKs with gsutil


    To use a CSE with gsutil, add the encryption_key parameter to the [GSUtil] section
    of your boto configuration file. encryption_key is an RFC 6848 Base64-encoded
    string of your AES-256 encryption key.


    You can optionally specify one or more decryption keys, up to 100. While the encryption_key
    option is used by gsutil as both an encryption and decryption key, any decryption_key
    options you specify are used only to decrypt objects. Multiple decryption keys
    must be listed in the boto configuration file as follows:


    ```

    decryption_key1 = ...

    dryption_key2 = ...

    dryption_key3 = ...

    ```


    If you have encryption or decryption keys in your boto configuration file, they
    are used for all gsutil commands. When decrypting, gsutil calculates the SHA256
    hash of the supplied encryption and decryption keys and selects the correct key
    to use for a particular object by matching the SHA256 hash in the object''s metadata.


    Objects encrypted with CSEKs require the matching decryption key during encryption
    key rotation. If an object is encrypted using a CSEK, you can rotate the object''s
    key by rewriting the object. Rewrites are supported through the JSON API, but
    not the XML API.


    Now that we have seen how CSEKs are used with Cloud Storage, let us see how they
    can be used with Compute Engine.


    # CSEKs with Compute Engine


    Compute Engine encrypts all data at rest on the persistent disks using Google
    default encryption keys. You can bring your own encryption key if you want to
    control and manage this encryption yourself.


    If you provide your own encryption key, Compute Engine uses your key to protect
    the Google-generated keys used to encrypt and decrypt your data. Only users who
    can provide the correct key can use resources protected by a CSEK.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Google Cloud Key Management Service


    Google does not store your keys on its servers, and it cannot access your protected
    data unless you provide it to them. This also implies that if you forget or lose
    your key, Google will be unable to recover it, as well as any data encrypted with
    it.


    Google discards the cryptographic keys when you destroy a persistent disk, making
    the data unrecoverable. This is an irreversible procedure.


    There are technical restrictions in using CSEKs with Compute Engine:


    +   - You can only encrypt new persistent disks with your own key. You cannot
    encrypt existing persistent disks with your own key.

    - You cannot use your own keys with local SSDs because local SSDs do not persist
    beyond the life of a VM. Local SSDs are already protected with an ephemeral key
    that Google does not retain.

    - Compute Engine does not store encryption keys with instance templates, so you
    need to store your keys in Cloud KMS to encrypt disks in a managed instance.


    Now you understand the restrictions of using CSEKs with Compute Engine, please
    look at the Google Cloud documentation on how to use CSEKs with Compute Engine.
    Try out a few of these use cases on your own to get a fair idea of what a CSEK
    is:


    +   - Encrypt a new persistent disk with a CSEK

    - Create a snapshot from a disk encrypted with a CSEK

    - Create a new image from a disk or custom image encrypted with a CSEK

    - Encrypt an imported image with a CSEK

    - Create a persistent disk from a resource encrypted with a CSEK

    - Attach a disk encrypted with a CSEK to a new VM

    - Start or restart VMs that have disks encrypted with a CSEK


    So far, we have seen different types of keys and where you can use them. Let us
    move on now to understand symmetric and asymmetric key operations.


    # Symmetric key encryption


    Recall that symmetric keys are used for encryption to protect some data—for example,
    using AES-256 in GCM mode to encrypt a block of plaintext.'
  merge: -1
  img_proc: true
- pgno: 255
  md: "# Creating a symmetric key\n\nTo create a symmetric key, you will first need\
    \ to create a key ring. The key ring determines the location of the key. Let us\
    \ start with creating that.\n\n# Step 1: Creating a key ring\n\nHere is a gcloud\
    \ kms keyrings command to create a key ring:\n\n```\ngcloud kms keyrings create\
    \ key-ring-name \\\n  --location location\n```\n\nReplace key-ring-name with a\
    \ name for the key ring to hold the key. Replace location with the Cloud KMS location\
    \ for the key ring and its keys.\n\n# Step 2: Creating a key\n\nUse the following\
    \ command to create a key in an existing key ring:\n\n```\ngcloud kms keys create\
    \ key \\\n  --keyring key-ring-name \\\n  --location location \\\n  --purpose\
    \ \"encryption\"\n```\n\nReplace key with the name of the key you would like to\
    \ use and key-ring-name with the name of the key you created in the previous step.\
    \ Replace location with the Cloud KMS location of the key ring. Note the *purpose*\
    \ of this key.\n\n# Step 3: Setting a key rotation period and starting time\n\n\
    Once the key is created, you can set a rotation period with a starting time. Here\
    \ is the command that will allow you to do so:\n\n```\ngcloud kms keys create\
    \ key \\\n  --keyring key-ring-name \\\n  --location location \\\n  --purpose\
    \ \"encryption\" \\\n  --rotation-period rotation-period \\\n  --next-rotation-time\
    \ next-rotation-time\n```\n\nReplace key with a name for the key. Replace key-ring-name\
    \ with the name of the existing key ring where the key will be located. Replace\
    \ location with the Cloud KMS location for the ring. Replace rotation-period with\
    \ an interval such as 30d to rotate the key every 30 days. Replace next-rotation-time\
    \ with a timestamp at which to begin the first rotation, such as 1970-01-01T01:02:03."
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Now that you have created a key for symmetric encryption, let us see how to
    use it to encrypt content.


    # Encrypting content with a symmetric key


    Here is a command to use an existing key for encryption:


    ```

    gcloud kms encrypt \

    --key key \

    --keyring key-ring-name \

    --location location \

    --plaintext-file file-with-data-to-encrypt \

    --ciphertext-file file-to-store-encrypted-data

    ```


    Replace key with the name of the key to use for encryption. Replace key-ring-name
    with the name of the key where the key is located. Replace location with the Cloud
    KMS location for the key ring. Replace file-with-data-to-encrypt and file-to-store-encrypted-data
    with the local file paths (include the actual filename as well) for reading the
    plaintext data and saving the encrypted output.


    This command will produce a file containing encrypted data. The name of the file
    is the one you provided for the ciphertext-file argument.


    Now that you have seen how to encrypt the content, let us see how to decrypt it.


    # Decrypting content with a symmetric key


    Here is a command to use an existing key for decryption:


    ```

    gcloud kms decrypt \

    --key key \

    --keyring key-ring-name \

    --location location \

    --ciphertext-file file-path-to-encrypted-data \

    --plaintext-file file-path-to-store-plaintext

    ```


    Replace key with the name of the key to use for encryption. Replace key-ring-name
    with the name of the key where the key is located. Replace location with the Cloud
    KMS location for the key ring. Replace file-path-with-encrypted-data and file-path-to-store-plaintext
    with the local file paths (include the actual filename as well) for reading the
    plaintext data and saving the encrypted output.


    This command will produce a file containing decrypted data. The name of the file
    is the one you have provided for plaintext-file.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# Asymmetric key encryption\n\nNow that you have seen symmetric key encryption\
    \ and decryption using Cloud KMS, let us move on to see how to use asymmetric\
    \ key encryption.\n\n# Asymmetric key encryption\n\nThe following section describes\
    \ the flow for using an asymmetric key to encrypt and decrypt data. Asymmetric\
    \ key encryption involve a key pair (public and private key pair). As the name\
    \ suggests, the private key is not shared while the public key is. There are two\
    \ participants in this workflow—a sender and a recipient. The sender creates a\
    \ ciphertext using the recipient’s public key, and then the recipient decrypts\
    \ the ciphertext using the private key it holds. Only someone with knowledge of\
    \ the private key can decrypt the ciphertext.\n\nCloud KMS provides the following\
    \ functionality as it relates to asymmetric encryption:\n\n+   - The ability to\
    \ create an asymmetric key with the purpose of ASYMMETRIC_DECRYPT. For information\
    \ about algorithms Cloud KMS supports, see asymmetric encryption algorithms in\
    \ the Google Cloud documentation.\n- CloudMS keys also support ASYMMETRIC_SIGN\
    \ (ECC and RSA).\n- The ability to retrieve the public key for an asymmetric key.\
    \ You use the public key to encrypt data. Cloud KMS does not provide a method\
    \ to analytically encrypt data. Instead, you encrypt data using openly available\
    \ SDKs and tools, such as OpenSSL. These SDKs and tools require the public key\
    \ that you retrieve from Cloud KMS.\n- The ability to decrypt data with an asymmetric\
    \ key.\n\nNow us look at the steps to be able to do asymmetric encryption and\
    \ signing. Similar to symmetric key creation, in order to create an asymmetric\
    \ key, you will first need to create a key ring. The key ring determines the location\
    \ of the key. Let us start.\n\n# Step 1: Creating a key ring\n\nUse the following\
    \ command to create a key ring for your asymmetric key:\n\n```\ngcloud kms keyrings\
    \ create key-ring-name \\\n  --location location\n```\n\nReplace key-ring-name\
    \ with a name for the key ring. Replace location with the Cloud KMS location for\
    \ the key ring and its keys."
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Step 2: Creating an asymmetric decryption key


    Follow these steps to create an asymmetric decryption key on the specified key
    ring and location. These examples use the software protection level and an rsa-decrypt-oaep-2048-sha256
    algorithm. When you first create the key, the key''s initial version has a state
    of pending generation. When the state changes to enabled, you can use:


    Replace key name with the new key. Replace key-ring-name with the name of the
    existing key ring where the key will be located. Replace location with the KMS
    location for the key ring.


    # Step 3: (Optional) Creating an asymmetric signing key


    Follow these steps to create an asymmetric signing key on the specified key ring
    and location. The following commands use the software protection level and the
    rsa-sign-pkcs1-2048-sha256 algorithm. When you first create the key, the key''s
    initial version has a state of pending generation. When the state changes to enabled,
    you can use the:


    ```

    gcloud kms keys create key \

    --keyring key-ring-name \

    --location location \

    --purpose "asymmetric-signing" \

    --default-algorithm "rsa-sign-pkcs1-2048-sha256"

    ```


    Now let us on to understand how to use an asymmetric key.


    # Encrypting data with an asymmetric key


