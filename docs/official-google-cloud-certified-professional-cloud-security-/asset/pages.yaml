- pgno: 283
  md: '# 10 Cloud Data Loss Prevention


    In this chapter, we will look at Google Cloud data loss protection products and
    capabilities. **Data Loss Prevention (DLP)** is a strategy for detecting and preventing
    the exposure and exfiltration of sensitive data. Google''s DLP strategy involves
    a layered approach. In addition to a proper organizational hierarchy, network
    security, IAM access, and **VPC Service Controls (VPC-SC)**, DLP plays a key role
    in data protection.


    Cloud DLP is quite widely used in data pipelines, especially for data warehouses.
    Protecting confidential data is one of the critical aspects of data workloads,
    so Cloud DLP helps customers gain visibility of sensitive data across the organization.
    We will look at several features of Cloud DLP, how to configure the product to
    do inspection and de-identification, and some best practices. There are few tutorials
    in the chapter, so to try out examples to get a solid understanding.


    In this chapter, we will cover the following topics:


    +   * Overview of Cloud DLP

    * DLP architecture

    * How DLP discovery works

    * De/re-identification of data

    * How to create a DLP scan job

    * DLP use cases

    * How to mask and tokenize sensitive data

    * Best practices and design considerations

    * Data exfiltration controls'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Overview of Cloud DLP


    Cloud DLP offers some key features for Google''s:


    +   - BigQuery-based data warehouses can be profiled to detect sensitive data,
    allowing for automated data discovery. You can scan the entire Google Cloud organization
    or choose folders or projects with the profiler''s flexibility.

    - Over 150 built-in information detectors are available in Cloud DLP. Because
    DLP is API-based, it can be used to swiftly scan, discover, and classify data
    from anywhere.

    - Support for Cloud Storage, Datastore, and BigQuery is built in: Cloud DLP comes
    with built-in support for these storage options.

    - You can calculate the level of risk to your privacy: quasi-identifiers are data
    elements or combinations of data that can be linked to a single individual or
    a small group of people. Cloud DLP gives you the option to examine statistical
    features such as k-anonymity and l-diversity, allowing you to assess the risk
    of data re-identification.

    - DLP classification results can be delivered to BigQuery for more thorough analysis
    or exported to your analytical instrument of choice. BigQuery and Data Studio
    can be used to create bespoke reports.

    - Cloud DLP secures your data by storing it in memory. The data in the backend
    is not persistent. In addition, the data is subject to various independent third-party
    audits to ensure data confidentiality, privacy, and safety.

    - Cloud DLP may be swiftly deployed using reusable templates, with periodic scans
    monitoring the data and Pub/Sub notifications for integration into serverless
    architectures.

    - To suit your company''s needs, you can add your own custom info types, alter
    detection levels, and establish detection rules.


    Now that you understand Cloud DLP''s capabilities at a high level, let us understand
    the DLP architecture.


    # DLP architecture options


    Cloud DLP primarily is seen in three architecture patterns: the content/streaming
    and storage methods and a hybrid architecture that combines these two patterns.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Content methods


    In this architecture, the data is streamed to the Cloud DLP APIs for inspection/classification
    or de-identification/transformation. A synchronous API response is received from
    Cloud DLP. In this case, the client application is expected to process the response.
    This architecture is typically seen in data pipelines or call center applications
    where real-time response is needed.


    ![](img/f681dfc12450e3a4c257352b70dbceca_285_0.png)


    Figure 10.1 – Content method architecture


    As shown in Figure 10.1, using content inspection, you stream small payloads of
    data to Cloud DLP along with instructions about what to inspect for. Cloud DLP
    inspects the data for sensitive content and personally identifiable information
    (PII) and returns the results of its scan back to you.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Storage methods


    In this architecture option, a job is set up by a trigger to scan for sensitive
    data. The results of the scans are published so that action can be taken based
    on the results. The results can be pushed to Security Operations Center (SOC)
    tools such as Security Command Center so security responders can take action or
    an automated response detection can be built using Cloud Functions or a more sophisticated
    product such as SOA.


    ![](img/f681dfc12450e3a4c257352b70dbceca_286_0.png)


    Figure 10.2 – Storage method architecture


    As shown in Figure 10.2, in this architecture option, you tell Cloud DLP what
    to inspect and then Cloud DLP runs a job that scans the repository. After the
    scan is complete, Cloud DLP saves a summary of the results of the scan back to
    the job. You can additionally specify that the results are sent to another Google
    Cloud project for analysis, as a separate BigQuery table or Security Command Center.


    The type of scan typically involves those Google Cloud projects where you do not
    expect to have sensitive data. For projects that are meant to have sensitive data
    such as cardholder data or PII, you should also invest in data exfiltration controls
    such as VPC Service Controls for DLP.


    # Hybrid methods


    Hybrid jobs and triggers enable you to broaden the scope of protection that Cloud
    DLP provides beyond simple content inspection requests and Google Cloud Storage
    (GCS) repository scanning.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# DLP architecture options


    ![](img/f681dfc12450e3a4c257352b70dbceca_287_0.png)


    Figure 10.3 – Hybrid inspection architecture


    As shown in 10.3, you may feed data from practically any source—including sources
    outside Google Cloud—directly to Cloud DLP via hybrid jobs and job triggers, and
    Cloud DLP will analyze the data for sensitive information and automatically record
    and aggregate the scan results for further analysis.


    Hybrid jobs and job triggers encompass a set of asynchronous API methods that
    allow you to scan payloads of data from virtually any source for sensitive information,
    and then store the findings in Google Cloud. Hybrid jobs enable you to write your
    own data crawlers that behave and serve data similarly to the Cloud DLP storage
    methods.


    Hybrid environments are common in enterprises. Many organizations store and process
    sensitive data using some combination of the following:


    +   - Other cloud providers

    - On-premises servers or other data repositories

    - Non-native storage systems, such as systems running inside a virtual machine

    - Web and mobile apps

    - Google Cloud-based solutions'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Cloud Data Loss Prevention


    Using hybrid jobs, Cloud DLP can inspect data sent to it from any of these sources.
    Example scenarios include the following:


    +   - Inspect stored data in Amazon Relational Database Service (RDS), MySQL running
    inside a virtual machine, or an on-premises database

    - Inspect and tokenize data as you migrate from on-premises to the cloud, or between
    production, development, and analytics

    - Inspect and de-identify transactions from a web or mobile application before
    storing the data at rest


    The basic workflow for hybrid jobs and triggers is as follows:


    +   - You write a script or create a workflow that sends data to Cloud DLP for
    inspection along with some metadata.

    - You configure and create a hybrid job resource or trigger and enable it to activate
    when it receives data.

    - Your script or workflow runs on the client side and sends data to Cloud DLP.
    The data includes an activation message and the job''s identifier, which triggers
    the inspection.

    - Cloud DLP inspects the data according to the criteria you set in the hybrid
    job or trigger.

    - Cloud DLP saves the results of the scan to the hybrid job resource, along with
    the metadata that you provide. You can examine the results using the Cloud DLP
    UI in the Console.

    - Optionally, Cloud DLP can run post-scan actions, such as saving inspection results
    to a BigQuery table or notifying you by email or Pub/Sub.


    A hybrid job enables you to create, activate, and stop jobs so that you can trigger
    actions whenever you need them. By ensuring that your script or code sends data
    that includes the hybrid job''s identifier, you don''t need to update your script
    or code whenever a new job is started.


    Now that you understand the different inspection methods, let us get started with
    some fundamental aspects of DLP.


    # Cloud DLP terminology


    Before you jump into defining Cloud DLP inspection templates, let us go over some
    important terminology that you will see in the templates.


    # DLP infoTypes


    Information types, also known as infoTypes, are sensitive data kinds that Cloud
    DLP is preconfigured to scan and identify—for instance, US Security numbers, credit
    card numbers, phone numbers, zip codes, and names. Built-in and custom InfoTypes
    are supported by Cloud DLP.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'There is a detector for each infoType defined in Cloud DLP. To identify what
    to look for and how to transform findings, Cloud DLP employs infoType detectors
    in its scan configuration. When showing or reporting scan findings, infoNames
    are also used. Cloud DLP releases new infoType detectors and groups regularly.
    Call the Cloud DLP REST API''s infoTypes.list method to receive the most-to-date
    list of built-in infoTypes.


    Please keep in mind that the built-in infoType detectors are always reliable.
    Google suggests that you evaluate your settings to ensure they comply with your
    regulatory requirements.


    Here are some examples of infoType detectors (this is not an exhaustive list):


    +   - ADVERTISING_ID: Identifiers used by developers to track users for advertising
    purposes. These include Google Play Advertising IDs, Amazon Advertising IDs, Apple’
    Advertising (IDFA), and Apple''s Identifier For Vendor (IDFV).


    +   - AGE: An age measured in months or years.


    +   - CREDIT_CARD_NUMBER: A credit card number is 12 to 19 digits. They are used
    for payment transactions globally.


    +   - CREDIT_CARD_TRACK: A credit card track number is a variable-length alphanumeric
    string. It is used to store cardholder information.


    +   - DATE: A date. This infoType includes most dates, including the names of
    common world holidays.


    +   - DATE_OF_BIRTH: A date that is identified by context as a date of birth.
    Note that this is not recommended for use during latency-sensitive operations.


    +   - DOMAIN_NAME: A domain name as defined by the DNS standard.


    +   - EMAIL_ADDRESS: An email address identifies the mailbox that are sent to
    or from. The maximum length of the domain name is 255 characters, and the maximum
    length of the local part is 64 characters.


    +   - US_SECURITY_NUMBER: A United States Social Security number (SSN) is a nine-digit
    number issued to US citizens, permanent residents, and temporary residents. This
    detector will not match against numbers with all zeros in any digit group (that
    is, 000-####, ###-00-####, or ###-##-0000), against numbers with 666 in the first
    digit group, or numbers whose first digit is nine.


    Now we have seen the overview of the Cloud DLP info types, let us understand the
    technical terms that you will frequently come across while working with Cloud
    DLP.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Data de-identification


    **De-identification** is a term used to represent a process that removes personal
    information from a dataset. You will also come across the term *redaction* in
    relation to Cloud DLP. Redaction in general refers to the removal or masking of
    information, while de-identification refers to a process of changing it so no
    longer identify the original text or are able to derive from it. De-identified
    data is considered suitable for applications since it doesn''t contain PII that
    can be used to trace the results back to the user. There are several ways data
    can be de-identified:


    +   - Masking sensitive data by partially or fully replacing characters with a
    symbol, such as an asterisk (*) or hash (#)

    - Replacing each instance of sensitive data with a token, or surrogate, string

    - Encrypting and replacing sensitive data with a randomly generated or pre-determined
    key


    Cloud DLP supports the following methods of de-identification:


    +   - **Masking:** Replaces the original data with a specified character, either
    partially or completely.

    - **Replacement:** Replaces original data with a token or name of the infoType
    if detected.

    - **Date shifting:** Date-shifting techniques shift a set of dates but preserve
    the sequence and duration of a period of time. Shifting dates is usually done
    in relation to an individual or an entity. That is, each individual''s dates are
    shifted by an amount of time that is unique to that individual.

    - **Generalization and bucketing:** Generalization is the process of taking a
    distinguishing value and abstracting it into a more general, less distinguishing
    value. Generalization attempts to preserve utility value while also reducing the
    identifi of the data. One generalization technique that Cloud DLP supports is
    bucketing. With bucketing, you group records into smaller buckets in an attempt
    to minimize the risk of an attacker associating sensitive information with identifying
    information. Doing so can retain meaning, but it will also obscure the individual
    values that have too few participants.

    - **Pseudonymization:** This is a de-identification technique that replaces sensitive
    values with cryptographically generated tokens

    - **Two-way tokenization pseudonymization:** Re the original data with a token
    that is deterministic, preserving referential integrity. You can use the token
    to join data or use the token in aggregate analysis. You can reverse or de-tokenize
    the data using the same key you used to create the token. There are two methods
    for two-way tokenization:'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Cloud DLP terminology 267


    +   Deterministic Encryption (DE) using AES-SIV: Advanced Encryption Standard-Synthetic
    Initialization Vector (AES-SIV) is a cryptographic mode of operation designed
    to provide secure and authenticated encryption of data. It is based on the Advanced
    Encryption Standard (AES) block cipher and is intended for applications that require
    both data and data integrity. It is commonly used for protecting data stored in
    databases, files, or other forms of persistent storage. AES-SIV also provides
    a way to protect against replay attacks and can be used to construct secure communication
    protocols. Using AES-SIV, an input value is replaced with a value that has been
    encrypted using the AES-SIV encryption algorithm with a cryptographic key, encoded
    using base64, and then prepended with a surrogate annotation, if specified. This
    method produces a hashed value, which does not preserve the character set or the
    length of the input value. Encrypted, hashed values can be re-identified using
    the original cryptographic key and the entire output value, including surrogate
    annotation. Learn more about the format of values tokenized using AES-SIV encryption.


    +   Format Preserving Encryption (FPE) with Flexible Format-Preserving Encryption
    (FFX) is an encryption technique that encrypts data while preserving the format
    of the original data. This means FPE can be used to encrypt data such as credit
    card numbers, SSNs, and other sensitive data without changing the format of the
    original data. FFX is used to protect data when it is stored or transmitted and
    to prevent unauthorized access to the data. Using FPE-FFX, an input value is replaced
    with a value that has been encrypted using the FPE-FFX encryption algorithm with
    a cryptographic key, and then prepended with a surrogate annotation, if specified.
    By design, both the character set and the length of the input value are preserved
    in the output value. Encrypted values can be re-identified using the original
    cryptographic key and the entire output value, including the surrogate annotation.


    +   One-way tokenization using cryptographic hashing pseudonymization: An input
    value is replaced with a value that has been encrypted and hashed using Hash-Based
    Message Authentication Code Secure Hash Algorithm 256 or HMAC-SHA56 on the input
    value with a cryptographic key. The hashed output of the transformation is always
    the same length and can''t be re-identified. Learn more about the format of values
    tokenized using cryptographic hashing.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Refer to the following table for a comparison of these three pseudonymization
    methods.


    | | Deterministic encryption using AES-SIV | Format preserving encryption | Cryptographic
    hashing |

    |---|---|---|---|

    | Encryption type | AES-SIV | FPR-FFX | HMAC-SHA256 |

    | Supported input values | At least 1 char long; no character set limitations.
    | At least 2 chats long; must be encoded as ASCII. | Must be a string or integer
    value. |

    | Surrogate annotation | Optional | Optional | N/A |

    | Context tweak | Optional | Optional | N/A |

    | Character set and length preserved | No | Yes | No |

    | Reversible | Yes | Yes | No |

    | Referential integrity | Yes | Yes | Yes |


    Table 10.1 – Comparison of the pseudonymization methods


    # Method selection


    Choosing the best de-identification method can vary based on your use case. For
    example, if a legacy app is processing the de-identified records, then format
    preservation might be important. If you''re dealing with strictly formatted 10-digit
    numbers, FPE preserves the length (10 digits) and character set (numeric) of an
    input for legacy system support.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'However, if strict formatting isn''t required for legacy compatibility, as
    is the case for values in the cardholder''s name column, DE is the preferred choice
    because it has a stronger authentication method. FPE and DE enable the tokens
    to be reversed or de-tokenized. If you don''t need de-tokenization, then cryptographic
    hashing provides integrity that the tokens cannot be reversed.


    Other methods—such as masking, bucketing, date-shifting, and replacement—are also
    good for values that don''t need to retain full integrity: For example, bucketing
    an age value (for example, 27) to an age range (20-30) can still be analyzed while
    reducing the uniqueness that might lead to the identification of an individual.


    # Token encryption keys


    A cryptographic key, also known as a token encryption key, is necessary for cryptographic
    de-identification transformations. The same token encryption key that is used
    to de-identify the original value is also used to re-identify it. This book does
    not cover the secure development and maintenance of token encryption keys.


    However, there are a few key aspects to keep in mind that will be applied later
    in the lessons:


    +   - In the template, avoid using plaintext keys. Instead, build a wrapped key
    with Cloud KMS.


    +   - To limit the danger of keys being compromised, use different token encryption
    keys for each data element.


    +   - Token encryption keys should be rotated. Although the wrapped key can be
    rotated, the token encryption key cannot be rotated because it compromises the
    tokenization''s integrity. You must re-tokenize the entire dataset when the key
    is rotated.


    Now that we are familiar with the basics of de-identification and which method
    is better suited for our case use, let us walk through how to create an inspection
    template. Later we will look at how to use de-identification.


    Remember that Cloud DLP requires an inspection of the data before de-identification
    can be performed. The Cloud DLP inspection process identifies the infoTypes that
    further can be used in de-identification. The inspection step is not optional.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Creating a Cloud DLP inspection template


    The first step in using classification capabilities is to create an inspection
    template. The inspection template will store all the data classification requirements:


    +   1. In the Cloud console, use Cloud DLP.

    2. From the CREATE menu, choose Template.


    ![](img/f681dfc12450e3a4c257352b70dbceca_294_0.png)


    Figure 10.4 – Creating a DLP inspection template


    +   3. Alternatively, click the following button: Create new template.


    This page contains the following sections:


    +   * Define template

    * Configure detection


    # Defining the template


    Under Define template, enter an identifier for the inspection template. This is
    how you will refer to the template when you run a job, create a job trigger, and
    so on. You can use letters, numbers, and hyphens. If you want, you can also enter
    a more human-friendly display name, well as a description to better remember what
    the template does.


    # Configuring detection


    Next, you configure what Cloud DLP detects in your content by choosing an infoType
    and other options.


    Under InfoTypes, choose the infoType that correspond to a data type you want to
    scan for. You can also leave this field blank to scan for all infoTypes. More
    information about each detector is provided in the Further reading section at
    the end of this chapter.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'You can also add custom infoType detectors in the Custom infoTypes section,
    and customize both built-in and custom infoType detectors in the Inspection rulesets
    section.


    # Custom infoTypes


    Be aware that any custom infoType detector you create is specific to this workflow
    and cannot be reused elsewhere. The only exception is Stored infoType, which requires
    that you create the stored custom infoType detector before specifying it.


    To add a custom infoType detector, do the following:


    +   1. Click Add custom infoType.


    +   2. Choose the type of custom infoType detector you want to create:


    +   **Words or phrases:** Matches on one or more words or phrases that you enter
    into the field. Use this custom infoType name when you have just a few words or
    phrases to search for. Give your custom infoType name, and then type the word
    or phrase you want custom DLP to match. To search for multiple words or phrases,
    press Enter after each one.


    +   **Dictionary path:** Searches your content for items in lists of words and
    phrases. The list is stored in a text file in Cloud Storage. Use this custom infoType
    when you have anywhere from a few to several thousand words or phrases to search
    for. This method is also useful if your list contains sensitive elements and you
    don''t want to store them inside of a job or template. Give your custom infoType
    name, and then, under Dictionary location, enter or browse to the Cloud Storage
    path where the dictionary file is stored.


    +   **Regular expression (regex):** Matches content based on a regular expression.
    Give your custom infoType name, and then, in the Regex field, enter a regex pattern
    to match words and phrases. See the supported syntax in Google Cloud documentation
    at https://pack.link/DRR06.


    +   **Stored infoType:** This adds a stored dictionary detector, which is a kind
    of detector that is built from either a large text file stored in Cloud Storage
    or a single column of a BigQuery table. Use this custom infoType when you have
    anywhere from several hundred thousand to millions of words or phrases to search
    for. Be aware that this is the only option in this menu which you must have already
    created the stored infoType to use it. Give your custom infoType name (different
    from the name you gave the stored infoType), and then, in the Stored infoType
    field, enter the name of the stored infoType.


    +   3. Click Add custom infoType again to add additional custom infoType detectors.


    Now let us see how to use rulesets to customize the infoTypes to match your requirements.
    This helps you to avoid false positives.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Inspection rulesets


    Inspection rulesets allow you to customize both built-in and custom infoType detectors
    using context rules. The two types of inspection rules are as follows:


    +   - **Exclusion rules**, which help exclude false or unwanted findings

    - **Hotword rules**, which help adjust the likelihood of the finding based on
    how near the hotword is to the finding


    To add a ruleset, first, specify one or more built-in or custom infoType detectors
    in the infoTypes Section. These are the infoType detectors that your rules will
    be modifying. Then, do the following:


    +   1. Click in the **Choose infoTypes** field. The infoType or infoTypes you
    specified previously appear below the field in a menu, as shown in *Figure 10.5*.


    > Adds hotword and exclusion rules to further extend built-in and custom infoType
    detectors with powerful context rules. Learn more


    ![](img/f681dfc12450e3a4c257352b70dbceca_296_0.png)


    Figure 10.5 – Choosing infoTypes for Inspection rulesets'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Choose an infoType from the menu, and then click Add rule. A menu appears with
    two options:

    Hotword rule and Exclusion rule.


    For hotwords, choose Hotword rule. Then, the following:


    +   I. In the Hotword field, enter a regular expression that Cloud DLP should
    look for.

    II. From the Hotword proximity menu, choose whether the hotword you entered is
    before or after the chosen infoType.

    III. In Hotword distance from infoType, enter the approximate number of characters
    between the hotword and the chosen infoType.

    IV. In Confidence level adjustment, choose whether to assign matches to a fixed
    likelihood level or to decrease the likelihood level by a certain amount.

    V. In the Exclude field, enter a regular expression (regex) that Cloud DLP should
    look for.

    VI. From the Matching type, choose one of the following:


    +   - Full match: The finding must completely match the regex.


    +   - Partial match: A substring of the finding can match the regex.


    +   - Inverse match: The finding doesn''t match the regex.


    For exclusion rules, choose Exclude rules. Then, the following:


    You can add additional hotword or exclusion rules and rulesets to further refine
    your scan results.


    # Confidence threshold


    Every time Cloud DLP detects a potential match for sensitive data, it assigns
    it a likelihood value on a scale from Very unlikely to Very likely. When you set
    a likelihood value here, you are instructing Cloud DLP to only match data that
    corresponds to that likelihood value or higher.


    The default value of Possible is sufficient for most purposes. If you routinely
    get matches that are too broad, move the slider. If you get too few matches, move
    the slider down.


    When you''re done, click Create to create the template. The template''s summary
    information page appears.


    Let us discuss some of the best practices for inspection.'
  merge: -1
  img_proc: true
- pgno: 298
  md: "# Best practices for inspecting sensitive data\n\nThere are several things\
    \ that you need to consider before starting an inspection. We will go over them\
    \ now:\n\n+   * **Identify and prioritize scanning**: It's important to identify\
    \ your resources and specify which have the highest priority for scanning. When\
    \ just getting started, you may have a large backlog of data that needs classification,\
    \ and it will be impossible to scan it all immediately. Choose data initially\
    \ that poses the highest risk—for example, data that is frequently accessed, or\
    \ unknown.\n* **Reduce latency**: Latency is affected by several factors: the\
    \ amount of data to scan, the storage repository being scanned, and the type and\
    \ number of infoTypes that are enabled. To help reduce job latency, you can try\
    \ the following:\n    * Enable sampling.\n    * Avoid enabling infoTypes you don't\
    \ need. While useful in certain scenarios, some infoTypes—including PERSON_NAME,\
    \ FEMALE_NAME, MALE_NAME, FIRST_NAME, LAST_NAME, DATE_OF_BIRTH, LOCATION, STREET_ADDRESS,\
    \ and ORGANIZATION_NAME—can make requests much slower than requests that do not\
    \ include them.\n    * Always specify infoTypes explicitly. Do not use an empty\
    \ infoTypes list.\n* Consider organizing the data to be inspected into a table\
    \ with rows and columns, if possible, to reduce network trips.\n* **Limit the\
    \ scope of your first scans**: For the best results, limit the scope of your first\
    \ scans instead of scanning all of your data. Start with a few requests. Your\
    \ findings will be meaningful when you fine-tune what enable and what rules might\
    \ be needed to reduce false positives. Turning on all infoTypes if you don't need\
    \ them, as false positives or undesired findings may make it harder to assess\
    \ your risk. While useful in certain scenarios, some infoTypes such as TIME, DOMAIN_NAME,\
    \ and URL detect a broad range of findings and may not be useful to turn on.\n\
    * **Limit the amount of content inspected**: If you are scanning BigQuery tables\
    \ or Cloud Storage buckets, Cloud DLP includes a way to scan a subset of the dataset.\
    \ This has the effect of providing a sampling of scan results without incurring\
    \ the potential costs of scanning an entire dataset.\n\n> Note\\Due to the need\
    \ to scan the entire image for sensitive data, sampling is not supported for image\
    \ file types. Any images scanned will be billed according to the size of the image\
    \ file."
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Inspecting and de-identifying PII data


    +   - **Inspect data on-premises or in other clouds:** If the data to be scanned
    resides on-premises or outside of Google Cloud, the API methods use content.inspect
    and de-identify to scan the content to classify findings and pseudonymized content
    without persisting the content outside of your local storage.


    We have seen how to inspect data and best practices around data inspection. Let
    us now understand how to de-identify sensitive data.


    # Inspecting and de-identifying PII data


    To de-identify sensitive data, use Cloud DLP''s content .deidentify method.


    There are three parts to a de-identification API call:


    +   - **The data to inspect:** A string or table structure (WidgetItem object)
    for the API to inspect.

    - **What to inspect for:** Configuration information (InspectConfig) such as types
    of data (or infoTypes) to look for, whether to filter findings that are a certain
    likelihood threshold, whether to return no more than a certain number of results,
    and so on. Not specifying exactly one infoType in an Inspect argument is equivalent
    to specifying all built-in infoTypes. Doing so is not recommended, as it can decrease
    performance and cost.

    - **What to do with the inspection findings:** Configuration information (IdentifyConfig)
    that defines how you want the sensitive data de-identified. This argument is covered
    in more detail in the following section.


    The API returns the items you gave it, in the same format, but any text identified
    as containing sensitive information according your criteria is de-identified.
    Now let us look at various de-identification transformations.


    # De-identification transformations


    We saw how to inspect data many times you want to inspect and de-identify the
    data. Now we will see how to do that using transformations supported by DLP. You
    may specify one or more transformations when you set the de-identification configuration
    (IdentifyConfig). There are two categories of transformations:


    +   - **InfoTransformations:** Transformations that are only applied to values
    within the submitted text that are identified as a specific infoType.

    - **RecordTransformations:** Transformations that are only applied to values within
    submitted tabular data that are identified as a specific infoType, or on an entire
    column of tabular data.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Cloud Data Loss Prevention


    Now let us go over each deidification configuration.


    # replaceConfig


    replaceConfig will replace any sensitive data with a string you specify.


    # redactConfig


    redactConfig redacts a value by removing it completely.


    # characterMaskConfig


    Setting characterMaskConfig to a CharacterMaskConfig object partially masks a
    string by replacing a given number of characters with a fixed character. Masking
    can start from the beginning or end of the string.


    # cryptoHashConfig


    Setting cryptoHashConfig to a CryptoHashConfig object performs pseudonymization
    on an input value by generating a surrogate value using cryptographic hashing.


    This method replaces the input value with an encrypted digest, or hash value.
    The digest is computed by the SHA-256 hash of the input value. The method outputs
    a base64-encoded representation of the hashed output. Currently, only string and
    integer values can be.


    # dateShiftConfig


    Setting dateShiftConfig to a DateShiftConfig object performs date shifting on
    input value by shifting the dates by a random number of days.


    Date-shifting techniques randomly shift a set of dates but preserve the sequence
    and duration of a period of time. Shifting dates is usually done in relation to
    an individual or an entity. You might want to shift all of the dates for a specific
    individual using the same shift difference or use a separate differential for
    each individual.


    Now that you have understood different methods of de-identification, let us go
    over a tutorial on how to do this in practice. Make sure you have a Google Cloud
    project ready to execute the steps covered next.


    # Tutorial: How to identify and tokenize sensitive data


    Cloud DLP supports both reversible and non-reversible cryptographic methods. In
    order to re-identify content, you need to use a reversible method. The cryptographic
    method described here is called deterministic encryption using Advanced Encryption
    Standard in Synthetic Initialization Vector mode (AES-SIV). We recommend this
    among all reversible cryptographic methods that Cloud DLP supports because it
    provides the highest level of security.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "# Tutorial: How to de-identify and tokenize sensitive data 277\n\nIn this tutorial,\
    \ we're going to see how to generate a key to de-identify sensitive text into\
    \ a cryptographic token. In order to restore (re-identify) that text, you need\
    \ the cryptographic key that you used during de-identification and the token.\n\
    \nBefore you begin, make sure you have the following roles in your Google Cloud\
    \ project:\n\n+   * Service account admin, to be able to create service accounts\n\
    * Service usage admin, to be able to enable services\n* Security admin, to be\
    \ able to grant roles\n\nOnce you have the following roles, follow these steps.\
    \ The steps will walk you through the process of creating an AES key to de-identify\
    \ sensitive text into a cryptographic token:\n\n+   1. In the Google Cloud console,\
    \ on the project selector page, select or create a new Google Cloud project.\n\
    2. Make sure that billing is enabled for your cloud project.\n3. Enable the Cloud\
    \ DLP and Cloud KMS APIs.\n4. Create a service account by following the next steps:\n\
    \n+   I. In the Service account name field, navigate to the Service create account\
    \ page.\nII. In the Service account name field, enter a name. The Cloud console\
    \ fills in the Service account ID field based on this name. In the Service account\
    \ description field, enter a description.\nIII. Click Create and continue.\nIV.\
    \ To provide access to your project, grant the following role(s) to your service\
    \ account: Project > DLP Administrator.\n\n> Note\n production environments, do\
    \ not grant the Owner, Editor, or Viewer roles. Instead, grant a predefined role\
    \ or custom role that meets your needs.\n\n+   V. Click Continue.\nVI. Click Done\
    \ to finishing the service account.\n\nDo not close your browser window. You will\
    \ use it in the next step."
  merge: -1
  img_proc: true
- pgno: 302
  md: '5. Create a service account key:


    +   I. In the Cloud console, click the email address for the service account that
    you just created.

    II. Click Keys.

    III. Click Add key, then click Create new key.

    IV. Click Create. A JSON key file is downloaded to your computer.


    Note

    It is against security practice to create a key and keep it forever. You should
    delete this key as soon as your tutorial is finished.


    +   V. Click Close.


    6. Set the GOOGLE_APPLICATION_CREDENTIALS environment variable to the path of
    the JSON file that contains your service account key. This variable only applies
    to your current shell session, so if you open a new session, set the variable
    again.


    Now that you have the right service account, we will create a KMS key that will
    be used to wrap the AES key used for the actual encryption of the DLP token.


    # Step 1: Creating a key ring and a key


    Before you start this procedure, decide where you want Cloud DLP to process your
    de-identification and re-identification requests. When you create a Cloud KMS
    key, you must store it either globally or in the same region that you will use
    for your Cloud DLP requests. Otherwise, the Cloud DLP requests will fail.


    You can find a list of supported locations in Cloud DLP locations. Take note of
    name of your chosen region (for example, us-west1).


    This procedure uses global as the location for all API requests. If you want to
    use a different region, replace global with the region name.


    Create a key ring:


    ```

    gcloud kms keyrings create "dlp-keyring" --location "global"

    ```


    Create a key:


    ```

    gcloud kms keys create "dlp-key" --location "global" --keyring "dlp-keyring" --purpose
    "encryption"

    ```'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Tutorial: How to de-identify and tokenize sensitive data


    List your key ring and key:


    ```

    gcloud kms keys list --location "global" --keyring "dlp-keyring"

    ```


    You will get the following output:


    ```

    NAME: projects/PROJECT_ID/locations/global/keyRings/dlp-keyring/

    cryptoKeys/dlp-key

    PURPOSE: ENCRYPT DECRYPT

    ALGORITHM: GOOGLE_SYMMETRIC_ENCRYPTION

    PROTECTION_LEVEL: SOFTWARE

    LABELS:

    PRIMARY_ID: 1

    PRIMARY_STATE: ENABLED

    ```


    In this output, PROJECT_ID is the ID of your project.

    The path under NAME is the full resource name of your Cloud KMS key. Take note
    of it because the de-identify and re-identify requests require it.


    # Step 2: Creating a base64-encoded AES key


    This section describes how to create an Advanced Encryption Standard (AES) key
    and encode it in base64 format. This key will be used to encrypt the actual sensitive
    data. As you can see, you have complete control over the generation and maintenance
    of this key.


    > Note

    These steps use the openssl and base64 commands, but there are a few other ways
    to perform this task based on your security policies.


    Now use the following command to create a 256-bit key in the current directory:


    ```

    openssl rand -out /.aes_key.bin" 32

    ```


    The aes_key.bin file is added to your current directory.


    Encode the AES key as a base64 string:


    ```

    base64 -i /.aes_key.bin

    ```


    You will get an output similar to the following:


    ```

    uED6/yKx+zCg2zcZ1DBwpwvzMVNK/c+JwWs7OwpkMc/s=

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: "# Cloud Data Loss Prevention\n\n> > Warning\nDo not use this example key to\
    \ protect actual sensitive workloads. This key is provided only to serve as an\
