    # Source Composition Analysis (SCA)


    Source Composition Analysis (SCA) is a process used in CI/CD pipelines to assess
    the security posture of the source code used in development. SCA runs scans on
    the source code to identify vulnerabilities and security issues. SCA is used to
    detect any malicious or unauthorized code that may have been introduced into the
    development process. SCA should be placed near the beginning of the CI/CD pipeline,
    ideally before the code is even checked, in order to get an initial assessment
    of the security posture of the code before it is released to the public.


    # Static Application Security Testing (SAST)


    Static Application Security Testing (SAST) is a process of analyzing the source
    code of an application for potential security vulnerabilities. It is typically
    done before the application is deployed, and it is the first step of the security
    testing process. It can detect security issues in the source code, such as missing
    input validation, hardcoded credentials, SQL injection, and cross-site scripting
