- pgno: 387
  md: '# Key features of Google Cloud Confidential Computing


    When you use a Confidential VM, your data and applications stay private and encrypted
    when they are being used. This is a type of Compute Engine VM. It runs on hosts
    that have AMD EPYC processors that have AMD Secure Encrypted Virtualization (SEV).
    Confidential VMs run on these hosts. Adding SEV to a Confidential VM has the following
    features and benefits:


    +   - Isolation: Encryption keys are made by the AMD Secure Processor (SP) when
    a VM is created, and they only live on the AMD System-on-Chip (SOC). These keys
    can''t be found by Google, which makes them more private.

    - Attesting: Confidential VMs use the vTPM. Whenever an SEV-based confidential
    VM starts up, an event is made that launch attestation report.

    - High performance: AMD SEV has a lot of power for a lot of complicated tasks.
    Confidential VMs have little or no effect on most applications, with a performance
    loss of zero to 6% when it is turned on for most applications.


    In addition to Compute Engine, the following Google Cloud Confidential services
    are also available:


    +   - Confidential Google Kubernetes nodes require all of your GKE nodes to use
    Confidential VMs

    - Dataproc Confidential Compute uses Confidential VMs in Dataproc clusters


    # Benefits of Confidential Computing


    Let us look at some of the key benefits of using Google Cloud Confidential Computing:


    +   - Google Cloud''s customers don''t have to choose between usability, performance,
    and confidentiality. Google''s goal is to make confidential computing easy. The
    transition to Confidential VMs is seamless—all workloads you can run today as
    a Confidential VM without the need to change anything.

    - With Confidential VMs, customers do not need to make any changes to their applications.
    Entire VMs can be run in a confidential manner.

    - The VM memory is encrypted by a key per VM and generated in hardware (AMD).
    The keys are ephemeral and not extractable by anyone, including Google.

    - Finally, customers can protect their data end to end, from data-in-transit to
    data-at-rest, and finally to data-in-use.'
