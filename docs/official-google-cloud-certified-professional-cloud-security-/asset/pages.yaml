  md: '# Separation of duties:


    +   - Use aggregated exports to a different project that is owned by a different
    team

    - Cloud Storage is recommended for log archival


    # Least privilege:


    +   - Grant the minimum required permissions on a project, so users cannot remove
    the logs

    - Enforce the Bucket Policy Only feature (effectively disabling object-level permissions)


    # Non-repudiation:


    +   - In case of Cloud Storage, configure Bucket Lock to ensure the retention
    of objects within the bucket. This prevents deletion of the bucket or underlying
    objects by anyone until all objects have reached the end of their retention period.

    - Additionally, enable object versioning for the bucket.


    Google Cloud provides a comprehensive set of solutions to ensure your organization''s
    logs are secured, monitored, and compliant with industry regulations.


    # Logging and auditing best practices


    In this section, we will cover some logging and auditing best practices. From
    an exam perspective, you are not really tested with questions on these practices,
    but you may find indirect references to them. Since Data Access audit logs are
    not enabled by default, it''s important that you review and enable Data Access
    audit logs for relevant services.


    > Note

    You can find more details on how to enable these logs at https://packt.link/w0ZWY.


    Let''s look at some best practices for logging and auditing:


    +   - Ensure that you specify the correct log storage destination—Google Cloud
    Storage for archival and retention and BigQuery for analytics and forensics

    - Configure appropriate permissions for the access of your logs

    - Ensure sensitive data is stripped from the logs before they are stored

    - Periodically review your audit logs that are stored in Cloud Logging, BigQuery,
    or your third-party SIEM solutions'
  merge: -1
