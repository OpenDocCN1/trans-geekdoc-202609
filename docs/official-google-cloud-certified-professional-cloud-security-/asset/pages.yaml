- pgno: 124
  md: 'You can only use some permissions if you combine them with another related
    one. It is necessary to employ the read-modify-write permission while changing
    an IAM policy, for example. You will also need the getIAMPolicy permission for
    that service in addition to the setIAMPolicy permission to make changes to the
    IAM policy.


    This concludes our discussion of IAM. We will go over best practices for managing
    privileged roles and move on to service accounts in the next section.


    # Best practices for managing privileged roles and separation of duties


    Managing privileged roles and ensuring the separation of duties is crucial for
    maintaining a secure and compliant environment in Google Cloud. Here are some
    best practices for managing privileged roles and implementing separation of duties
    using IAM roles:


    +   - Principle of least privilege: Adhere to the principle of least privilege
    when assigning roles and permissions. Only grant users and service accounts the
    minimum permissions necessary to perform their designated tasks. Avoid assigning
    permissions that go beyond your job requirements.


    +   - Role-Based Access Control (RBAC): Utilize Google Cloud IAM''s RBAC model
    to define and assign roles based on job functions and responsibilities. Identify
    privileged roles that have elevated permissions and ensure they are only assigned
    to authorized individuals who require those privileges for their specific tasks.


    +   - Segregation of duties: Implement segregation of duties to prevent conflicts
    of interest and reduce the risk of abuse or unauthorized actions. Separate critical
    functions and assign them to different individuals or teams. This ensures that
    no single person has control over sensitive operations.


    +   - Predefined roles: Leverage predefined roles provided by Google Cloud IAM.
    These roles are designed with specific responsibilities and permissions, making
    it easier to assign appropriate privileges. Regularly review and update roles
    to align with changes in job functions and responsibilities.


    +   - Custom roles: Create custom roles when predefined roles do not meet your
    specific requirements. This allows for fine-grained control over permissions and
    ensures that privileged roles are tailored to your organization''s needs. Exercise
    caution when defining custom roles and regularly review and audit them.


    +   - Role hierarchy: Establish a role hierarchy to manage privileged roles effectively.
    Consider creating a tiered structure where higher-level roles inherit permissions
    from lower-level roles. This ensures a logical and controlled flow of permissions
    and allows for easier management of access control.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Service accounts


    +   Dual control and approval processes: Implement dual control mechanisms and
    approval processes for critical actions or changes that require privileged access.
    This involves requiring multiple authorized individuals to review and approve
    such actions, reducing the risk of unauthorized or accidental actions.


    +   Regular reviews and audits: Conduct regular reviews and audits of privileged
    roles and their assigned permissions. Validate that the permissions assigned are
    necessary and appropriate. Remove any unnecessary or outdated permissions and
    ensure that roles align with current job functions and responsibilities.


    +   Monitoring and logging: Implement robust monitoring and logging mechanisms
    to track privileged activities and detect any unusual or unauthorized actions.
    Enable the logging of IAM role changes, permission modifications, and administrative
    actions to ensure an audit trail and facilitate incident response.


    +   Continuous Education and Awareness: Provide ongoing education and training
    to privileged users, administrators, and stakeholders regarding the importance
    of role management, separation of duties, and best practices in access control.
    Foster a culture of security awareness and accountability within your organization.


    By implementing these best practices, organizations can effectively manage privileged
    roles, enforce separation of duties, and maintain a secure and compliant environment
    in Google Cloud. Regular reviews, defined processes, and continuous monitoring
    help ensure that access privileges remain aligned with business requirements and
    minimize the risk of unauthorized access or malicious actions.


    # Policy binding


    IAM policy binding is how you assign roles to principals to be able to access
    resources. The binding can exist at the resource level (not all resources support
    this), project level, folder level, or organization level. It is important to
    understand at what level the binding should be created to achieve the least privileged
    access while fulfilling business goals.


    The higher in the Google Cloud resource hierarchy the binding is created, the
    larger the effect it has on downstream resources such as folders, projects, and
    actual workloads. For this, be careful where you define your IAM policy binding.
    We will see more on IAM policy binding later, in the IAM policy binding section.


    # Service accounts


    Google cloud service accounts are a critical part of the platform. A cloud resource
    or workload uses a specific type of account. To make an application deployed (for
    example, Compute Engine, App Engine, or GKE) or a workload (Dataproc, Dataflow,
    and on) utilizes service accounts. Using a service account as an identity, the
    application can access cloud resources (either in the same or a different project)
    based on the role it has been assigned.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Google Cloud Identity Access Management


    There are some main differences between a service account and a user account:


    +   - Service accounts have no ability to log in to the Cloud console like a normal
    user.

    - Public and private RSA key pairs are used to authenticate the service account
    and sign the API request.

    - A service account can be impersonated by a human or another service account.

    - Service accounts are not visible in Cloud Identity because they belong to the
    Cloud managed domain. While service accounts can be added to a Google group, it
    is not recommended since groups are meant for specific purposes that service accounts
    do not fit into.

    - A service account is not created in your Google Workspace domain. They are not
    under the control of your Google Workspace and Cloud Identity administrators.
    They live in Google Cloud and should be managed there.


    ![](img/f681dfc12450e3a4c257352b70dbceca_126_0.png)


    Figure 6.3 – Service account and resource


    As depicted in Figure 6.3, service accounts get access to perform actions on a
    Google Cloud resource via an IAM role, just like users. Now we will see how to
    manage the lifecycle of service accounts.


    # Creating a service account


    Service accounts can be created under the IAM | Service accounts menu in the Cloud
    console. Service accounts can also be created using gcloud, REST APIs, or client
    libraries.


    To create a service account, the user should have the Service Account Admin role
    (roles/iam.serviceAccountAdmin) to wait.


    It is recommended to wait for a minimum of 60 seconds before you use the service
    account post creation.


    # Disabling a service account


    You can disable a service account either by using the Cloud console, gcloud, or
    APIs. However, note that if a resource is using a service account, after disabling
    the resource can no longer access Google Cloud resources.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Deleting a service account


    If a service account is deleted, its role bindings are not instantly eliminated;
    they are automatically purged from the system within 60 days. Do not include deleted
    service accounts in your quota. It is best practice to disable a service account
    before deleting it to make sure your production workloads are not negatively impacted.


    # Undeleting a service account


    You can use the gcloud command to undelete a deleted service account in some cases
    if it meets the following criteria:


    +   - The service account was deleted less than 30 days ago

    - There is no existing service account with the same name as the deleted service
    account


    You will need the numeric ID of the service account to undelete it.

    Now that we have looked at what service accounts are, let look at how to use them.
    To be able to use a service account, you need a service account key or workload
    identity federation.


    # Service account keys


    When you create a service account key, you are creating a private-public key pair.
    The public key is stored within Google Cloud, and you get a private part of that
    key pair. This is how you establish the identity of the service account. The key
    is used to authenticate service account to Google Cloud from outside of Google
    Cloud. Within Google Cloud, you do not need keys (except for GKE). These keys
    need to be stored securely as leakage of the key in the wrong hands could cause
    unauthorized access to your Google Cloud environment. Crypto mining is one of
    the biggest misuses of such keys.


    Google Cloud, however, has introduced a more secure access method called Workload
    Identity Federation (WIF). WIF allows your workloads to access resources directly,
    using a short-lived access token, and eliminates the maintenance and security
    burden associated with service account keys. WIF may be suitable in some scenarios
    such as multi-cloud authentication (for example, calling Google Cloud APIs from
    AWS or Azure) or, in some cases, hybrid cloud workloads. You will see more details
    on this in the Configuring Workload Identity Federation using Okta section.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Google Cloud Identity Access Management


    Here is a decision tree that you can use to determine when you need to generate
    service account keys.


    ![](img/f681dfc12450e3a4c257352b70dbceca_128_0.png)


    Figure 6.4 – Decision tree for service account keys


    As you can see in Figure 6.4, you can select the right way to connect to Google
    Cloud APIs from hybrid workloads in a secure way. We recommend incorporating this
    decision tree in your organization process for development teams to refer to.
    Now, let us look at how to manage the lifecycle of service account keys.


    # Creating a service account key


    Service account keys can be generated through the Cloud console, gcloud, using
    the APIs, or one of the client libraries. The key is either in the format of JSON
    or PKCS#12 (P12 for backward compatibility).'
