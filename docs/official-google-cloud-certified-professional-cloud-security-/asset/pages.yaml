- pgno: 403
  md: "# Web Security Scanner\n\nWSS scans your App Engine, GKE, and Compute Engine\
    \ web apps for security flaws. It crawls your apps, following all links that fall\
    \ within the scope of your application’s entry URLs, and tries to test as many\
    \ user inputs and event handlers as possible. WSS only works with public URLs\
    \ and IP addresses that are not behind a firewall.\n\nApp Engine standard and\
    \ flexible environments, Compute Engine instances, and GKE resources are also\
    \ presently supported by WSS.\n\nWSS works with your secure design and development\
    \ procedures. It uses a combination of automated and manual techniques to scan\
    \ web applications and services for common vulnerabilities such as SQL injection,\
    \ cross-site scripting, and other security issues. It works by sending a series\
    \ of requests to the target application or service and then analyzing the responses\
    \ for possible vulnerabilities. WSS can also be used to conduct manual security\
    \ reviews by providing detailed advice and steps to address any identified vulnerabilities.\n\
    \nThe OWASP Top Ten, a publication that ranks and provides remedial assistance\
    \ for the top 10 critical online security vulnerabilities, is supported by WSS.\n\
    \nThere are two types of scans WSS supports:\n\n+   **Managed scans**: Managed\
    \ scans detect and scan public web endpoints once a week automatically:\n  * These\
    \ scans do not employ authentication and perform GET-only queries, so no forms\
    \ are submitted on live websites.\n  * Managed scans are done independently of\
    \ custom scans defined at the project level. Managed scan finds are automatically\
    \ available on the SCC Vulnerabilities tab and related reports when you use WSS\
    \ as a service.\n\nA managed scan is especially useful without involving individual\
    \ project teams, as you can utilize managed scans to centrally manage web application\
    \ vulnerability detection for projects in your organization. You can work with\
    \ those teams later to set up more comprehensive bespoke scans after the discoveries\
    \ are made.\n\n+   **Custom scans**: WSS custom scans provide detailed information\
    \ on application vulnerabilities such as obsolete libraries, cross-site scripting,\
    \ and mixed content usage."
  merge: -1
  img_proc: true
