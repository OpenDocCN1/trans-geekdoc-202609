    # Controlling access to the images


    To split workloads, environments, and user access, you will usually need different
    Google Cloud projects. Although most cloud workloads do not require sharing between
    projects, images are an excellent choice for doing so. You can follow a consistent
    approach to distributing images with best practices for security, permission,
    package management, and operations pre-configured for the rest of the company
    by using a shared collection of images.


    ![](img/f681dfc12450e3a4c257352b70dbceca_373_0.png)


    Figure 13.3 – Sharing images between projects'
