- pgno: 422
  md: '# Overview of containers


    A container is a lightweight, standalone executable package that contains everything
    needed to run an application, including the code, runtime, libraries, and dependencies.
    Containers are designed to be easily portable between different computing environments,
    making them an ideal solution for modern application deployment. Everything at
    Google runs in containers, from Gmail to YouTube to Search. Development teams
    can now move more quickly, distribute software easily, and operate at unprecedented
    scale thanks to containerization.


    Containers with security advantages enhance their architecture:


    +   - Containers are short-lived and frequently re-deployed

    - Containers are intentionally immutable; a modified container is a default security
    alert

    - Good security defaults are one-line changes; setting secure configurations is
    easy

    - With isolation technologies, you can increase security without adding resources


    Google invests in security: here is Google’s container security philosophy:


    +   - Prioritize security by default: Google believes in giving users the power
    of Kubernetes without making them security experts.

    - Integrate the best of Google Cloud Platform security: Integrations with IAM,
    audit logging, VPCs, encryption by default, and Security Command Center.

    - Strong security culture: Google dedicates a large amount of resources to securely
    designing and running systems. Security is an integral part of Google’s culture,
    products, and operations.


    But before we dive deeper into container security, let us first understand what
    containers are.


    # Container basics


    Traditionally, applications used to be deployed on dedicated servers. To run an
    application, you would do the following:


    +   1. Purchase hardware.

    2. Install the OS.

    3. Install dependencies.

    4. Deploy application code.

    5. Make sure the application is the same across all environments.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Container basics


    This took a lot of time and resources to deploy and maintain. It was not portable
    and was difficult to scale. VMware popularized running multiple servers and operating
    systems (OSs) on the same hardware using a hypervisor. Each virtual machine (VM)
    has its own dedicated resources, memory, CPU, and storage, which are allocated
    by the hypervisor that manages them. VMs are isolated from each other and from
    the host machine, providing greater security and flexibility but requiring more
    resources and longer startup times. Containers share the host machine''s OS kernel
    and use containerization to isolate the application from other processes on the
    host. Because they do not need to emulate an entire OS, containers are much smaller
    and faster to start up than VMs.


    Now let see how containers are structured.


    # What are containers?


    Containers are a method of packaging an application executable and its dependencies
    (runtime, system tools, system libraries, configuration, and so on) and running
    the package as a set of resource-isolated processes.


    | Dedicated server | Virtual machine | Container |

    | :--- | :--- | :--- |

    | Application code | Application code | Application code |

    | Dependencies | Dependencies | Dependencies |

    | Kernel | Kernel | Kernel + container runtime |

    | Hardware | Hardware + supervisor | Hardware |


    Deployment ~months Not portable Low utilization | Deployment ~days (mins) Hypervisor
    specific Low isolation, tied to OS | Deployment ~mins (secs) Portable Very efficient


    > Figure 15.1 – Container structure


    Containers raise the abstraction one more level and virtualize the OS. They are
    extremely portable and can be run locally or in the cloud without any changes.
    Lightweight containers do not carry a full OS and can be packed tightly onto available
    resources. Fast startup is no more starting a process on the OS.'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Container Security


    Containers use the concept of a layered filesystem. The base image layers are
    all read-only. Updates are made to a small read-write layer built on top of a
    base image. Each container has its own writable container layer. All changes are
    stored in this layer.


    Multiple containers share the same underlying read-only image. Any changes to
    levels are first copied to the container layer where changes are then overlaid
    for that container. The base image is shared across containers, taking less disk
    space and enabling fast container start times.


    | Container 1 | Container 2 | Container 3 |

    |---|---|--|

    | Thin R/W layer | Thin R/W layer | Thin R/W layer |

    | 91e54dfb1179 | | 0 B |

    | d74508fb6632 | | 1.895 KB |

    | c22013c84729 | | 194.5 KB |

    | d3a1f33e8a5a | | 188.1 MB |


    ubuntu:15.04


    > Figure 15.2 – Container layers


    Let us go over some terminology in the container space:


    +   * Container image: A container image is created by assembling the application
    code and dependencies into a single package that can be easily distributed and
    deployed. Once an image is created, it can be stored in a container registry,
    such as Docker Hub or Google Container Registry, and then used to spin up one
    or more containers on a Kubernetes cluster.

    * Container: A container running in a pod is an instantiated container image.

    * Container host: The container host is the computer that runs the containerized
    processes, commonly called containers.

    * Registry server: A registry server is just a fancy file server where container
    images are stored.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '**Container orchestrator:** This is software that manages containers. Google
    GKE, AWS EKS, Azure AKS, and Red Hat OpenShift are examples of container orchestrators.
    A container orchestrator serves two purposes:


    +   - Container workloads are dynamically scheduled in a cluster of machines.


    +   - It uses an uniform application definition file to set up the cluster.


    +   - **Kubernetes:** Kubernetes is an open source container orchestrator, developed
    by Google.


    +   - **Namespaces:** Think of a namespace as a virtual mechanism to group containers
    within your Kubernetes cluster. You can have multiple namespaces inside a single
    cluster.


    +   - **Docker:** Docker is the container runtime that builds, runs, and monitors
    containers. Other runtimes include LXC, systemd-spawn, CoreOS rkt, and others.


    +   - **Cgroups:** Control groups, or cgroups, is a feature of Linux that contains
    the resources (CPU, memory, and so on) allocated to processes. The kubelet and
    the underlying runtime, such as Docker, use cgroups to enforce resource management
    for pods and containers.


    +   - **Container registry:** A container registry is a repository that holds
    container images not yet deployed. Cloud providers including Google will provide
    a registry service in the cloud. For example, Google has Artifact Registry and
    Container Registry (deprecated) for container images.


    Now that we understand the basic terminology of containers, let us understand
    the advantages of using containers.


    # Advantages of containers


    There are many advantages of running containerized applications. Here are some:


    +   - **Separation of code and computing:**


    +   - Consistency across dev, test, and production


    +   - Consistency across bare-metal, VMs, and the cloud


    +   - No more worked on my computer


    +   - **Packed applications:**


    +   - Agile application creation and deployment


    +   - Containers aid massively in a Continuous Integration/Delivery/DevOps process


    +   - **Conducive for microservices:**


    +   - Container deployments are introspective


    +   - Isolated/loosely coupled, conducive to distributed systems, and elastic'
