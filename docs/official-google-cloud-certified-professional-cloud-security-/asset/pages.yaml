    Now that we have to generate a service account key, let us look at some of the
    best practices associated with service account keys.


    # Best practices when managing service account keys


    As a Google Cloud security practitioner, it is critical that you securely manage
    the key that grants access to your service account. Here are a few things to keep
    in mind:


    +   - Determine whether you need to use service account keys or whether your application
    could use a more secure method as WIF.

    - The service accounts created for development purposes shouldn''t have access
    to production resources.

    - Have a procedure to rotate your service account keys. Rotate them often—daily,
    if possible—in development environments.

    - Developers should download a new key every day, and enable this by developing
    a daily key rotation mechanism.

    - You can develop an audit process by monitoring the usage of the service account
    keys. The serviceAccount.keys.list() API method will allow you to find all the
    keys associated with a given service account. You can match keys with audit logs.
    Any suspicious activity can be alerted for further investigation.

    - Local development should always be done using the client libraries and Google
    Application Credentials.

    - Make it possible for developers to upload their private keys to external code
    repositories. There are several ways to achieve this, as we will see in the latter
    part of this chapter.

    - Finally, perform periodic key scans on external repositories and correct any
    issues that are discovered. There are commercial products available on the market
    that will alert you to key leakage. Security Command Center Premium, a native
    Google Cloud offering, also has this capability. More on this in Chapter 14, Security
    Command Center.


    Key rotation is one of the best practices we have mentioned. Now let us see how
    to do this.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Key rotation


    Once you have conducted proper research and determined the necessity of using
    service account keys, it is crucial to prioritize regular rotation of the keys
    for development purposes. Implementing a key rotation process is essential to
    minimize the risk of any potential leaks or unauthorized access. The following
    outlines a recommended approach for effectively rotating service account keys:


    +   - Keyrotator is a simple CLI tool written in Python that you can use as is
    or as the basis for a service account rotation process. Run it as a cron job on
    an admin instance, say, at midnight, and write the new key to Cloud Storage for
    developers to download in the morning.

    - Create a dedicated project setup for shared resources.

    - Create a bucket in the dedicated project; do NOT make it publicly accessible.

    - Create a group for the developers who need to download the new daily key.

    - For additional security, you can have each developer use their own key. This
    will require you to provide a storage bucket for each developer in the project.
    This will also reduce the risk of non-repudiation.

    - Grant access to the bucket by granting the storage.objectViewer to your developer
    group for the project with the storage bucket.


    A common issue in developing a process for key rotation is accidentally committing
    the key to the source repository. We will take an example of GitHub and show how
    to detect a key that has been committed to GitHub.


    # Preventing committing keys to external source code repositories


    Your CI/CD pipeline should have the ability to detect a key being pushed to Git.
    If a key is found, the push should fail. A tool called git secrets can be used
    for this purpose. It will be invoked automatically when you run the git commit
    command.


    You will need to configure git to check for patterns that match the service account
    key file. For example, you can use the following command to detect private keys:


    ```

    git secrets --add ''private_key''

    git secrets --add ''private_key_id''

    ```


    Now, when you try to run git commit and it detects these two keywords, you will
    receive an error message and be unable to do commit unless you remove the key
    file.'
  merge: -1
  img_proc: true
- pgno: 133
  md: "# Scanning external repositories for keys\n\nThere are various commercial products\
    \ available that monitor service account key leakage in public source repositories.\
