    \    organizations/ORGANIZATION_ID\n  resourceParentDisplayName: ORGANIZATION_NAME\n\
    \  resourceProject: //cloudresourcemanager.googleapis.com/projects/PROJECT_NUMBER\n\
    \  resourceDisplayName: PROJECT_ID\n  resourceType: google.cloud.resourcemanager.Project\n\
    \  securityMarks:\n    name: organizations/ORGANIZATION_ID/assets/ASSET_ID/securityMarks\n\
    \    updateTime: '2021-10-05T17:54.823Z'\n```\n\nAs you can see, you are going\
    \ to get a very large list of assets, so it is imperative to understand how to\
    \ filter them by. Let us look at that now.\n\n# Filtering assets\n\nAn organization\
    \ may have many assets. Because there are no filters in the preceding example,\
    \ all assets are returned. You can utilize filters in SCC to get information about\
    \ certain assets. Filters, where like clauses in SQL queries, only apply to objects\
    \ returned by the API instead of columns.\n\nThe examples sample output displays\
    \ certain fields and subfields, as well as their characteristics, that can be\
    \ utilized in filters. The SCC API accepts complete JSON arrays and objects as\
    \ potential property types. You can refine your results by using the following\
    \ filters:\n\n+   - Array elements\n- Full JSON objects with partial string matching\
    \ within the object\n- JSON object subfields"
