  md: '# Hybrid connectivity options


    Throughout this chapter, we have made references to hybrid connectivity. The term
    hybrid connectivity means that you can join your Google Cloud network to your
    on-premises network and a third-party cloud provider using multiple connectivity
    options. We will look at two options: Cloud VPN (IPSec) and Cloud Interconnect.


    Before we look at the different connectivity options, it''s important to understand
    what Cloud Router is, as it is a key component when creating a Google Cloud-based
    VPC. Cloud Router is a managed service and a regional resource. It is responsible
    for exchanging routes between your VPC and your on-premises network via BGP. Dynamic
    routing options include both regional and global. With regional routing, Cloud
    Router shares routes only in the region where Cloud Router is provisioned. With
    global routing, it shares routes for all subnets in the VPC network.


    ![](img/f681dfc12450e3a4c257352b70dbceca_201_0.png)


    Figure 7.29 shows how Cloud Router exchanges routes using BGP with a connected
    network.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Virtual Private Cloud


    Let us now look at the connectivity options that are available for building hybrid
    connections with Google Cloud:


    +   - Cloud VPN (IPSec-based): Creating a Cloud VPN instance, which is an IPSec-based
    VPN over the internet, is the fastest and easiest way to connect your cloud environment
    with other clouds or with your on-premises network. You can leverage your existing
    internet connection. This option supports a bandwidth of 1,5-3 Gbps per tunnel,
    depending on peer location or within Google Cloud (Direct peer), with multi-tunnel
    support for higher bandwidth. A VPN device at the on-premises data center is required
    to support IPSEC/IKE/Multi-tunnel protocols.


    ![](img/f681dfc12450e3a4c257352b70dbceca_202_0.png)


    Static, public IP required


    Google recommends reserving RFC 1918 IP space to avoid overlap


    Static, public IP required


    Figure 7.30 – Cloud VPN


    Figure 7.30 illustrates how a VPN using IPSec is established with Google Cloud.
    This deployment type supports static or dynamic (BGP)-based VPNs. You also have
    the option to configure high availability using gateways with two different interfaces.


    +   - Cloud Interconnect: Using dedicated Cloud Interconnect, you can connect
    your on-premises network with dedicated private links that do not traverse the
    public internet. The traffic takes fewer hops and a high level of reliability
    and security. Your VPN network internal (RFC 1918) IP addresses are directly accessible
    from your on-premises network.


    There is no requirement for establishing a VPN or NAT. It supports high bandwidth
    from 8x10 Gbps, or 2x100 Gbps, depending on the need. You can further reduce your
    egress costs as traffic remains internal. It works with Private Google Access
    to allow Google API access through internal links. Although the traffic is unencrypted,
    you can use a self-managed IPS VPN if that''s a requirement. Cloud VPN over Cloud
    Interconnect is not supported. You can create VLAN attachments and associate them
    with Cloud Router. You can also attach to multiple VPCs, Cloud Router is used
    to dynamically exchange routes.'
