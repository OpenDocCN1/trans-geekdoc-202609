    # VPC peering


    VPC peering allows you to exchange the internal IP addressing of one VPC network
    with another VPC network irrespective of whether the VPC network is in the same
    project or belongs to another organization. The two main use cases for VPC peering
    include allowing your applications in one VPC network to communicate with services
    in another VPC network without needing to traverse the internet and keeping traffic
    within the Google Cloud network. Software as a Service (SaaS) providers can also
    expose their services privately to their users on Google Cloud by configuring
    VPC peering.


    ![](img/f681dfc12450e3a4c257352b70dbceca_177_0.png)


    Figure 7.13 shows two VPC networks that are peers and have subnet ranges in each
    of the networks that are exchanged once the peering is established.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Virtual Private Cloud


    Some of the key advantages of VPC peering are as follows:


    +   * Network latency: As the traffic stays within the Google network and is local
    rather than traversing the internet, there is lower network latency.

    * Network security: Application owners do not need to make their services publicly
    accessible, reducing the attack surface.

    * Egress traffic is charged, but when VPC peering, your traffic stays within the
    Google network, no egress network charges will be applied, which helps in reducing
    the cost.


    Next, we will look at some of the key properties of VPC peering:


    +   * VPC peering supports Compute Engine, GKE, and GAE.

    * Even though VPC networks are peered, they are administratively separate; that
    is, you can manage VPC attributes such as routing, firewall rules, and subnets
    per VPC and it has no impact on the peering.

    * VPC peering requires setup on both sides. Administrators for the VPC networks
    have to complete the configuration on each side to complete the setup. We will
    look at this process in our VPC setup walk-through.

    * Both static and dynamic routes can be exchanged.

    * You can peer multiple VPCs together (limits apply).

    * IAM permissions are required to have the ability to create and manage VPC peers.

    * An organization policy administrator can apply the constraint to restrict VPC
    peering and define a set of VPC networks that can peer.


    The following restrictions need to be taken into consideration before setting
    up VPC peering:


    +   * IP addresses cannot overlap. Both VPC peers should have different IP address
    ranges.

    * You cannot select which subnet routes can be shared; once peering is established,
    all routes are exchanged between the peering VPC networks.

    * Dynamic routes can overlap with a peer network''s subnet route, although overlapping
    destination ranges are silently dropped.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   - Only direct peering is supported; you cannot translate transit peers.


    +   - Tags and service accounts cannot be used across the peering networks.


    +   - Internal DNS names for compute engines are not accessible across the peering
    networks.


    +   - Firewall rules are not exchanged across the peering networks, and you need
    to create rules to allow ingress firewall traffic from compute instances. The
    default behavior is to block the ingress traffic to VMs by applying an ingress
    deny firewall rule.


    +   - Furthermore, you need to create firewall rules to restrict the access of
