    # How hierarchical firewall policies work


    Although hierarchical firewall policies are out of scope for the exam, they are
    included here for completeness and awareness. Hierarchical firewall policies are
    applied in a similar way to how you apply IAM policies and constraints for an
    organization. You can enforce these policies at the organization root or folder
    level. This lets you create a consistent set of network policies across the entire
    organization.


    Hierarchical firewall policies are similar to VPC firewall rules, where you can
    create allow deny rules. The only difference is that hierarchical firewall rules
    allow you to delegate rules by applying a goto_next action. Also, lower-level
    rules cannot override higher-level rules that are defined by the network administrators
    and are applied organization-wide.


    There are some specifications defined for hierarchical firewall policies. Let’s
    understand them, including the evaluation criteria:


    +   * You can create hierarchical firewall policies at the organization and folder
    level.

    * Creating a policy does not enforce it, unless you apply it at the level you
    want to, such as at the organization or folder level.

    * Rule evaluation is based on the resource hierarchy. All rules at a given level
    are evaluated before moving to the next level.

    * The goto_next action lets you delegate the evaluation of the policy to a lower-level
    policy at the next level.

    * Using resource targets as virtual machine instances, subnets, or specific services
    such as Google Kubernetes Engine (GKE) clusters, you can create hierarchical policies
    for specific VPCs and VMs. This can help you manage exceptions for certain VM
    groups.

    * You can include either an IPv4 or IPv6 address as part of the policy but cannot
    include both in the same policy.'
  merge: -1
