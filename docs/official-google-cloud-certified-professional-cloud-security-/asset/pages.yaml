- pgno: 182
  md: '# Subnets


    Creating subnets for different types of workloads is a key micro-segmentation
    strategy. In this section, we will look at what types of subnets you can create
    and how to apply those subnets to your network design. Irrespective of what type
    of subnet you create, using either auto mode or custom mode, on Google Cloud there
    are two types of Classless Inter-Domain Routing (CIDR) ranges: primary and secondary:
    Let us look at Figure 7.16 to better understand the difference between the two
    and when one over the other.


    | Configuration | Primary | Secondary |

    | --- | --- | --- |

    | Used for | Mandatory - one per subnet | Optional - multiple ranges are supported
    | Allocation of VM primary reserved IPs | Allocating a different IP to multiple
    microservices running in a VM (e.g., containers, GKE pods) |

    | Extendable | Range can be extended, but not shrunk | No |


    ![](img/f681dfc12450e3a4c257352b70dbceca_182_0.png)


    The primary CIDR range is mandatory in a subnet; the secondary range is optional.
    The VMs, load balancers, and so on get IP addresses from the primary CIDR range.
    The secondary ranges are used for allocating IP addresses and microservices such
    as containers. You can extend the primary IP address range but cannot reduce the
    size of the IP range. Secondary IP address ranges cannot be extended and are fixed.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Custom routing


    You can also use VPC routes to create custom routing to restrict and manage access
    to your services. Custom routing is a combination of both static and/or dynamic
    routing. In Figure 7.15, you can see different types of VPC routes that are supported,
    along with other attributes. Let us look at the different options available.


    | Route | Type | Created by | Next Hop | Restrictions | Exchanged with VPC Peering
    |

    | --- | --- | --- | --- | --- | --- |

    | Subnet route | System | System | VPC network | Cannot be removed | Automatic
    |

    | Static route | Custom | User | Instance IP Cloud VPN | Must be broader than
    a subnet IP range | Flag controlled |

    | Dynamic route | Custom | Cloud router (BGP session) | BGP peer | Must be broader
    than a subnet IP range | Flag controlled |


    Figure 7.15 – VPC routes


    Google Cloud supports three different route types: system-generated routes, static
    custom routes, and dynamic routes. System-generated routes are created by the
    system and cannot be removed. These include routes added to communication between
    subnets, exchange routing information via VPC peering, and those exchanged using
    Cloud Router.


    Static routes are added by the user manually and are also called custom routes.
    Using static routes, you can define a next hop, such as an internal TCP/UDP load
    balancer or Cloud VPN for connecting to on-premises services.


    Dynamic routes are also classified as custom routes and are dynamically updated,
    such as creating a Border Gateway Protocol (BGP) peer via Cloud Router (we will
    cover Cloud Router in the Hybrid connectivity options section later in this chapter).
    The next hop is always a BGP peer, as this is configured point-to-point between
    two autonomous systems to dynamically exchange routing information.


    You should not apply custom routes to instances as they will not persist once
    the instance reboots. You can, however, apply routes to all instances using tags
    and service accounts.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Firewall rules


    Firewall rules are one of the most important parts of network security. In this
    section, we will look at how firewall rules work, the evaluation criteria, the
    different types of firewall rules that you can create (ingress/egress), 5-tuple
    rules, and tag-service-account-based firewall rules.


    | Target | Ingress rule | Source |

    | --- | --- | --- |

    | Network | ✓ Service account | Allow/Deny IP range/CIDR instances by tag or service
    account |

    | VM | Ingress rule ✓ Target tag | |

    | | Ingress rule ✓ All instances in network | |

    | | Egress rule ✓ Service account | Allow/Deny IP range/CIDR |

    | | Egress rule ✓ Target tag | |

    | | Egress rule ✓ All instances in network |


    Figure 7.18 – VPC firewall rules


    Let us look at some of the firewall rule features shown in Figure 7.18:


    +   - Firewall rules are stately in nature and are applied to a network inside
    a project. This means, for example, if you create an ingress deny on port 22,
    you don''t need to configure an equivalent egress deny rule.

    - Enforcement is done on the host level, which means there is a negligible performance
    penalty.

    - The control paths that you can manage using firewall rules are VM to VM, VM
    to the internet, and VM to on-premises.

    - For every VPC, two implied rules for ingress/egress are created, which cannot
    be deleted: a rule to block all incoming connections and another rule to allow
    all outgoing connections.'
  merge: -1
  img_proc: true
- pgno: 185
