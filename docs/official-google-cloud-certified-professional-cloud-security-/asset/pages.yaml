    # User provisioning in Cloud Identity


    Google Cloud requires users and groups to be pre-provisioned in Cloud Identity.
    The following screenshot shows the options available to help you do so. We briefly
    cover which options are recommended and why:


    | Method | Effort | Staff Involved | Notes |

    | --- | --- | --- | --- |

    | Manual Provisioning | High | Google Admin | Easiest method, but not scalable
    |

    | CSV Upload via Google Admin | Medium | Google Admin | More flexibility, but
    not scalable |

    | Google Cloud Directory Sync (GCDS) | Medium | LDAP Admin | Integrates with LDAP,
    scalable, requires no programming |

    | Third-Party Tools (Okta, Ping, etc.) | Medium | LDAP Admin | Scalable, may incur
    additional cost |

    | Admin SDK Directory API | High | LDAP Admin Development Staff | Scalable, flexible,
    requires in-depth programming |


    Figure 5.1 – User provisioning options in Google Cloud Identity


    Based on the methods listed in Figure 5.1, you can choose to manually add users
    to Cloud Identity as it''s an easy option and requires little effort if you only
    have 5-10 users to add. The effort required increases if you have more users to
    add.


    The next option is to use a CSV file where you can upload users in bulk; this
    is more convenient if you add more users at once. However, you need to prepare
    your CSV file by listing the users'' details, such as first name, last name, email
    address, password, and org path. Listing passwords in CSV files is not recommended,
