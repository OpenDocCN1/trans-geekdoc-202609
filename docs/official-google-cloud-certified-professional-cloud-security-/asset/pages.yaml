  md: "The group:prod@acme.com Google group, on the other hand, is only included if\
    \ the role binding conditions are met. As a result, it is only in effect until\
    \ July 1, 2024.\n\nNow let look at how policy inheritance works in Google Cloud.\n\
    \n# # Policy inheritance and resource hierarchy\n\nPolicy inheritance describes\
    \ how policies are applied to resources that are lower in the resource hierarchy.\
    \ The term effective policy refers to a resource's policies being passed through\
    \ all its parents, all the way up the resource hierarchy. In that sequence, it\
    \ is a combination of the following:\n\n+   * The policy set on the resource\n\
    * The policies set on all of the resource's ancestry resource levels in the hierarchy\n\
    \nEach role binding (acquired from parent resources) has an impact on the resource's\
    \ effective policy is assessed separately. If any higher-level role bindings provide\
    \ access, a specific access request is granted. The access grant scope expands\
    \ when a new role binding is added to any level of the resource; inherited policy.\n\
    \nTo understand policy inheritance, let us consider a scenario where you grant\
    \ a user, Bob, two different IAM roles at different levels in the resource hierarchy.\n\
    \nTo grant Bob a role at the organization level, you set the following policy\
    \ for your organization:\n\n```\n{\n  \"bindings\": [\n    {\n      \"members\"\
    : [\n        \"user:bob@acme.com\"\n      ],\n      \"role\": \"roles/storage.objectViewer\"\
    \n    }\n  ],\n  \"etag\": \"BwujMjhCsNaY=\",\n  \"version\": 1\n}\n```\n\nThis\
    \ policy grants Bob Storage Object Viewer role (roles/storage.objectViewer). Since\
    \ you set the policy at the organization level, Bob can use these permissions\
    \ for all projects and all Cloud Storage objects in the organization."
  merge: -1
  img_proc: true
- pgno: 146
  md: "To grant Bob a role at the project level, you set the following policy on the\
    \ project:\n\n```\n{\n  \"bindings\": [\n    {\n      \"members\": [\n       \
    \ \"user:bob@acme.com\"\n    ],\n      \"role\": \"roles/storage.objectCreator\"\
    \n    }\n  ],\n  \"etag\": \"BwUjhCsNaY =\",n  \"version\": 1\n}\n```\n\nThis\
    \ policy grants Bob the Storage Object Creator role (roles/storage.objectCreator),\
    \ which lets him create Cloud Storage objects. Since this policy is set on the\
    \ project level, Bob can create a cloud storage object only in the project.\n\n\
    Let's summarize this particular example:\n\n+   - A policy at the organization\
    \ level grants the ability to list and get all Cloud Storage objects under this\
    \ organization\n- A policy at the project level, for the given project, grants\
    \ the ability to create objects within that project\n\nNow you have learned how\
    \ IAM policies work, let us look at some of the best practices.\n\n# IAM Conditions\n\
    \nYou can provide access to principals only if certain requirements are met using\
    \ IAM Conditions. A condition is part of the role binding. If a condition exists,\
    \ access is only permitted if the condition expression evaluates to true. Each\
    \ condition expression is made up of a series of logical statements that indicate\
    \ which attributes should be checked. Let us take a look at the structure within\
    \ IAM conditions.\n\nThe IAM policy binding structure looks like this. The condition\
    \ object within IAM structure will have the conditions:\n\n```\n{\n  \"bindings\"\
    : [\n    {\n      \"role\": ...,\n      \"members\": ...\n    }\n  ]\n```"
