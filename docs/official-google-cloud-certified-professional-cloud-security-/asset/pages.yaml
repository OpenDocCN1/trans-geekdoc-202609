  md: '# Cloud Data Loss Prevention


    +   * Protect sensitive data as you migrate to the cloud: You can evaluate and
    classify sensitive data in both structured and unstructured workloads with Cloud
    DLP.


    ![](img/f681dfc12450e3a4c257352b70dbceca_312_0.png)


    Figure 10.6 - DLP pattern for Dataflow and Data Fusion pipeline


    As in Figure 10.6, here are a couple of patterns that you can employ to use Cloud
    DLP:


    +   * Use Cloud DLP + Dataflow to tokenize data before loading it into BigQuery

    * Use Cloud DLP + Cloud Fusion to tokenize data from Kafka Streams


    By obfuscating the sensitive identifiers, de-identification techniques such as
    tokenization (pseudonymization) preserve the utility of your data for joining
    or analytics while decreasing the danger of handling the data. If you don''t want
    the data to end up in the data warehouse, you can create a quarantine pipeline
    to send it to a sensitive dataset (with very limited permissions).


    +   * Use Cloud DLP in contact center chats to de-identify PII: Cloud DLP can
    be used to mask any PII in support chats to make sure the agent doesn''t get hold
    of any customer data.


    We have seen some examples of workloads that you can use DLP for; now let us learn
    some best practices while using DLP.'
