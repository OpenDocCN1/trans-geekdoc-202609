- pgno: 17
  md: '# Preface


    Organizations are increasingly adopting cloud migration for several reasons, including
    scalability, cost-efficiency, and agility. Cloud platforms offer the ability to
    scale resources on demand, reduce infrastructure costs, and quickly adapt to changing
    business needs. As a result, businesses are seeking to leverage the benefits of
    cloud computing, leading to rising demand for cloud security. Cloud security plays
    a crucial role in cloud computing, and cloud service providers such as Google
    Cloud invest heavily in security measures such as encryption, access controls,
    threat detection, and incident response. By migrating to the cloud, organizations
    can leverage the expertise and infrastructure of cloud providers to enhance their
    overall security posture, protecting against breaches, unauthorized access, and
    other cyber threats. There is now growing demand for skilled professionals who
    can ensure the security of these cloud environments.


    Data breaches and security incidents have become a major concern for businesses.
    The role of a Google Cloud security engineer involves implementing robust security
    measures, designing secure architectures, and managing access controls to safeguard
    data from unauthorized access, breaches, and other security threats. The Google
    Professional Cloud Security Engineer Certification acts as a testimony to your
    proficiency in securing cloud environments and demonstrates your commitment to
    professional development. It enhances your credibility and opens up new career
    opportunities in the field of cloud security.


    This book will introduce you to a range of essential topics. It will provide an
    understanding of cloud security fundamentals and the shared responsibility model.
    The book will go-depth into the security features and services offered by Google
    Cloud, such as IAM, network security, container security, and Security Command
    Center. It will also address secure cloud architecture and design, data protection
    and encryption, security operations compliance and governance, and best practices.
    Additionally, the book has two full mock exams to aid in exam preparation. By
    covering these topics thoroughly, the book prepares you to excel in the certification
    exam and thrive as a cloud practitioner using Google Cloud.


    By the end of this book, you will have gained the knowledge and skills required
    to pass the Google Cloud Security Engineer Certification exam and implement architectural
    best practices and strategies in your day-to-day work.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Who this book is for


    This book is for IT professionals, cybersecurity specialists, system administrators,
    and any technology enthusiasts aspiring to strengthen their understanding of Google
    Cloud security and elevate their career trajectory. We delve deep into the core
    elements needed to successfully attain the Google Professional Security Engineer
    certification—a credential that stands as a testament to your proficiency in leveraging
    Google Cloud technologies to design, develop, and manage a robust, secure infrastructure.
    As businesses increasingly migrate their operations to the cloud, the demand for
    certified professionals in this field has skyrocketed. Earning this certification
    not only validates your expertise but also makes you part of an elite group of
    GCP Security Engineers, opening doors to opportunities that can significantly
    advance your career. Whether you''re seeking to gain a competitive edge in the
    job market, earn higher pay, or contribute at a higher level to your current organization,
    this book will guide you every step of your journey to becoming a certified Google
    Cloud Security Engineer.


    # What this book covers


    Chapter 1, About the Google Professional Cloud Security Engineer Exam, focuses
    on the Google Professional Security Engineer Certification and provides guidance
    on how to register for the exam. This chapter also covers the outline of the exam.


    Chapter 2, Google Cloud Security Concepts, covers how Google secures its cloud
    infrastructure. You will learn how shared security responsibility is applied to
    the different Google Cloud services, the defense-in-depth model that Google deploys
    in its infrastructure at various layers, and how the isolation and security of
    data are achieved. Other areas covered include threat and vulnerability management,
    security monitoring, and data residency.


    Chapter 3, Trust and Compliance, looks at two essential aspects of cloud architecture.
    The first part of the chapter focuses how Google builds security and provides
    customers with full transparency. Data security is all about control, and you
    will learn how Google Cloud empowers its consumers to own, control, and protect
    their data. The second part of the chapter covers the different compliance standards
    and programs that Google Cloud is compliant with and how you can gain access to
    compliance reports. It also gives an introduction to advanced topics that will
    be discussed later in the book when covering continuous monitoring and maintaining
    compliance.


    Chapter 4, Resource Management, covers Google Cloud Resource Manager and how resources
    are organized. It also covers IAM policies, organizational policy controls, Cloud
    Asset Inventory, and firewall rules that can be applied and inherited via the
    resource hierarchy.


    Chapter 5, Understanding Google Cloud Identity, introduces Google Cloud Identity.
    You will learn how to design and build your authentication strategy on Google
    Cloud using Cloud Identity. The topics include user lifecycle management, device
    security, cloud directory, account security, app management, identity federation,
    and single sign-on.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Preface xi


    Chapter 6, Google Cloud Identity and Access Management, takes a deep dive into
    Google Cloud Identity and Access Management. It covers IAM roles, permissions
    and conditions, service accounts, how to manage service account keys, IAM policy
    intelligence, along with best practices and design considerations.


    Chapter 7, Virtual Cloud, covers network security concepts within Google Cloud.
    You will look at what a VPC is and the different types of VPC models, and how
    to do micro-segmentation using subnets, custom routing, and reveal firewalls.
    Furthermore, you will also look at DNSSEC in Google Cloud and different types
    of load balancers.


    Chapter 8, Advanced Network Security, teaches you how to secure your cloud using
    the advanced network security features that are available on Google Cloud. This
    chapter also covers Identity-Aware Proxy, Private Google Access, VPC Service Controls,
    DDoS, and the application firewall.


    Chapter 9, Google Cloud Key Management Service, lays the foundation for understanding
    the key hierarchy in Google Key Management Service (KMS) and how envelope encryption
    works. In this chapter, you will look at different types of encryption keys, their
    purpose, and how Google does encryption and key management, including coverage
    of the underlying cryptographic operation. The chapter also covers concepts such
    as binding your key to the cloud.


    Chapter 10, Cloud Data Loss Prevention, guides you on how to use Google Cloud
    Data Loss Prevention (DLP) to secure sensitive data. It covers techniques used
    to scan sensitive data by creating scan jobs and also how to enforce DLP rules
    to redact sensitive data using techniques as masking, redaction, and tokenization.


    Chapter 11, Secret Manager, guides you on how to use Google Cloud Secret Manager
    to create secrets that are used during runtime by your applications.


    Chapter 12, Cloud Logging, covers how Cloud Logging works on Google Cloud. You
    will look at the different log types keys and components for logging and learn
    how to build a centralized logging system for continuous monitoring.


    Chapter 13, Image Hardening and CI/CD Security, teaches you how to harden compute
    images for virtual machines and containers. It covers how to manage, secure, patch,
    and harden images, and how to build image management pipelines. Furthermore, you
    will look at building security scanning of the CI/CD pipeline. Finally, this chapter
    covers some Google Cloud Compute Engine security capabilities as Shielded VMs
    and confidential computing.


    Chapter 14, Security Command Center, explores the capabilities offered by Security
    Command Center and teaches you how to configure and use Security Command Center''s
    capabilities to detect threats, vulnerabilities, and misconfigurations. You will
    also look at how Security Command Center can be used to build automated incident
    response and integrate its findings with third-party security information and
    event management tools such as Splunk.'
