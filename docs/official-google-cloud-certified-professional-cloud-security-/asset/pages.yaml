- pgno: 313
  md: '# Best practices for Cloud DLP


    It can be difficult to figure out where Cloud DLP fits in your architecture or
    to identify requirements for Cloud DLP. Here are some best practices for you to
    understand how to use Cloud DLP in various scenarios:


    +   - Data profiling versus inspection jobs: Data profiling allows you to scan
    BigQuery tables in a scalable and automated manner without the need for orchestrating
    jobs. Considering the growth of data and the increasing number of tables, leveraging
    profiling features is recommended as it takes care of orchestration and running
    inspection jobs behind the scenes without any overhead. The inspection jobs can
    complement profilers when deeper inspection scans are needed. For example, if
    there are around 25,000 tables to be scanned, the recommendation is to scan all
    the tables with a profiler and then do a deep scan of 500 tables to flag sensitive/unstructured
    data that needs a more exhaustive investigation.


    ![](img/f681dfc12450e3a4c257352b70dbceca_313_0.png)


    Figure 10.7 – Decision tree for inspection


    Figure 10.7 shows a decision tree on when to use inspection jobs versus data profiling
    services.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Leverage built-in rules wherever possible: Cloud DLP’s built-in inspection
    templates should be used wherever possible. With over 150 built-in templates,
    Cloud DLP allows us to detect and classify data with speed and scale. For example,
    the US_HEALTHCARE_NPI can detect the 10-digit national provider number used for
    Medicare services. The use of built-in info saves the time and effort needed to
    create and maintain custom rules for standard infoTypes.


    Trigger Cloud DLP scans based on events: Cloud DLP''s data profiling capability
    allows the automated scanning of all BigQuery tables and columns in your organization,
    folders, and projects. However, there might be a need for triggers that will enable
    the scan to run on new files that get uploaded to Cloud Storage or a new message
    that''s added to Pub/Sub topics. To support this use case, Eventarc API or other
    BigQuery sink listeners can be configured to identify the change events that will
    eventually trigger a Cloud DLP scan.


    ![](img/f681dfc12450e3a4c257352b70dbceca_314_0.png)'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'As shown in Figure 10.8, the pattern shows an example of a file upload or a
    Pub/Sub message triggering an Eventarc trigger. Based on the event, a cloud function
    will be triggered that will start the Cloud DLP scan.


    +   * Provide necessary permissions to the service account: Cloud DLP creates
    service agent accounts by default, which will have the necessary permissions to
    run Cloud DLP scan jobs. Alternatively, if you are scanning a restricted table
    or file, the relevant IAM roles must be added to the Cloud DLP service account.
    If you are using a Cloud Function or Cloud Run instance to trigger Cloud DLP jobs,
    those service accounts must have the `dlp.jobTriggers` permission to successfully
    start the Cloud DLP scan job.

    * Publish Cloud DLP tags to Data Catalog: Once the classification is complete,
    the results are sent to Data Catalog so that the tables are tagged, only the right
    people get access to the data, and any sensitive data is protected. Cloud DLP
    allows native integration with the Data Catalog, so once we scan the BigQuery
    tables, it can send the tagging results to Data Catalog in the form of tag templates.
    The findings will be included in the summary form for the table in Data Catalog.

    * Restrict access prior to running Cloud DLP scans: Access to any BigQuery tables
    must be restricted until the Cloud DLP profiling is complete. To achieve this
    goal, the Cloud DLP profiler must be enabled, and only after it passes the policy
    checks should the data assets be moved to a state where quarantine can be added
    to policy tags for all new tables so that users won''t have access. Once Cloud
    DLP identifies sensitive data, a policy tag can be created in the form of a hierarchy
    of high, medium, and low to further restrict access depending on the content Cloud
    DLP identifies.


    We have seen best practices for how to use Cloud DLP in various scenarios. Now
    let us switch gears and look at how to control data exfiltration and the best
    practices to prevent it.


    # Data exfiltration and VPC Service Controls


    In the public cloud, there are several threats that organizations need to understand
    before deploying critical workloads. Here are a few threats that would lead to
    data exfiltration:


    +   * Misconfigured IAM policies

    * Malicious insiders copying data to an unauthorized destination

    * Compromised code copying data to an unauthorized destination

    * Access to data from unauthorized clients using a stolen credential'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Here are various paths via which data can be exfiltrated in the cloud:


    +   * Internet <-> service (stolen credentials)

    * Copy to internet

    * Service <-> service (insider threat)

    * Copy from one storage service to another

    * VPC <-> service (compromised VM)

    * Copy to consumer Google services

    * Copy to public GCS buckets/BigQuery dataset/GCR repo


    Google Cloud offers some excellent offerings to stop the exfiltration of data
    as a part of its data loss prevention portfolio of products. VPC Service Controls
    extends a security perimeter around multi-tenant Google Cloud services such as
    **Google Cloud Storage (GCS)**, **BigQuery**, and **Google Container Registry
    (GCR)**. VPC Service Controls isolates Google Cloud-managed resources from the
    internet, unauthorized networks, and unauthorized Google Cloud resources. allows
    you to configure a security perimeter around the data resources of your Google-managed
    services such as GCS, BigQuery, and Cloud BigTable and control the movement of
    data across the perimeter boundary.


    Let us look at the architecture of VPC Service Controls now.


    # Architecture of VPC Service Controls


    Let us see a common VPC Service Controls architecture.'
