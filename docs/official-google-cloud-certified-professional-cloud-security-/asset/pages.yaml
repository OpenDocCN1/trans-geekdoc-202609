    \ create 1000 \\\n  --security-policy POLICY_NAME \\\n  --expression \"evaluatePreconfiguredExpr('provider-a')\"\
    \ \\\n  --action \"allow\"\n```\n\nCustom named IP address lists are not possible\
    \ to construct. Only third-party providers who work with Google and maintain named\
    \ IP address lists can use this capability. CloudFlare and Imperva are a couple\
    \ of the providers who partner with Google Cloud to supply named IP lists for\
    \ Google's named IP list service."
  merge: -1
