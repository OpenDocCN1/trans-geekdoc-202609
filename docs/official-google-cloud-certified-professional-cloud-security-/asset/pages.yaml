    +   2. Navigate to the left-hand side menu to Security | Authentication | 2-step
    verification (see Figure 5.2). In the settings, select the organizational group
    from the left where you want to enforce the 2SV policy.


    Security > 2-Step Verification


    ![](img/f681dfc12450e3a4c257352b70dbceca_92_0.png)


    Figure 5.2 – Account security (2SV)


    +   3. From the configuration options available here, you can set Enforcement
    to On or Off or schedule it to turn on for specific data. Selecting On will enforce
