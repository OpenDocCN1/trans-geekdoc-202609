    to best practices.


    So far, we have looked at IAM; now we will shift gears and look at access control
    for Cloud Storage. Cloud Storage is one of the original Google Cloud products
    and has evolved to have some fine-grained access policies (ACLs), so we will also
    look at those.


    # Cloud Storage ACLs


    Cloud Storage provides separate access control in IAM. There are two ways, in
    fact: a more uniform way of doing access via IAM and a legacy way of doing access
    via fine-grained ACLs. Object ACLs do not appear in the hierarchy of IAM policies,
    so please be aware of how your Cloud Storage buckets are controlled. When evaluating
    how to access one of your objects, make sure you check the ACLs for the object,
    in addition to checking your project- and bucket-level IAM policies. This could
    get convoluted, so the recommendation is to use uniform access control using IAM
    in most cases.


    # Access Control Lists (ACLs)


    You can use an ACL to determine who has access to your buckets and objects, as
    well as what level of access they have. ACLs are applied to specific buckets and
    objects in Cloud Storage. There are one or more entries in each ACL. An entry
    allows a certain user (or group) to carry out specific tasks. Each entry is made
    up of two bits of:


    +   - A *permission*, defines what actions can be performed (for example, read
    or write)

    - A *scope* (sometimes referred to as a grantee), defines who can perform the
    specified actions (for example, a specific user or group of users)


    Consider the following scenario: you have a bucket from which you want anonymous
    users to be able to access objects, but you also want your collaborator to be
    able to add and delete objects from the bucket. Your ACL would be made up of two
    entries in this case:


    +   - In one entry, you would give `READER` permission to a scope of `allUsers`

    - In the other entry, you would give `WRITER` permission to the scope of your
    `collaborator` (there are several ways to specify this person, such as by their
    email)'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Here are some points to consider when using ACLs:


    +   - You can only make up to 100 ACLs for a bucket or object.


    +   - When the entry scope is a group or domain, it counts as one ACL entry, no
    matter how many users are in the group or domain.


    +   - When a user tries to access a bucket or storage object, the Cloud Storage
    system looks at the bucket or object''s ACL. If the ACL gives the user permission
    to do what is being asked, the request is granted. If the request fails, and a
    403 Forbidden error is sent back.


    Let us look at ACL permissions now.


    # ACL permissions


    Permissions describe what can be given to a bucket or object. Cloud Storage lets
    you assign concentric permissions for your buckets and objects within the bucket.


    What are concentric permissions?


    You do not have to assign multiple scopes to ACLs in Cloud Storage to give more
    than one permission. When you give someone WRITER permission, you also give them
    READER permission, and when you give someone OWNER permission, you also give them
    READER and WRITER permission.


    Based on how objects are uploaded, object ACLs are applied accordingly:


    +   - Authenticated uploads: You (the person who uploaded the object) are listed
    as the object owner. Object ownership cannot be changed by modifying ACLs. You
    can change object ownership only by replacing an object. The project owners and
    project editor group have OWNER permission on the object.


    +   - Anonymous uploads: If an anonymous user uploads an object, which is possible
    if a bucket gives the allUsers WRITER or OWNER permission, the object gets the
    default ACLs.


    # Best practices for Cloud Storage access while using ACLs


    ACLs require active management, like other administrative settings. Before sharing
    a bucket or object with other users, consider who you want to share it with and
    what function each person will play. In projects, usage patterns, and organizational
    ownership may need you to modify bucket and ACL settings over time, especially
    if you manage them for a large organization or a large team. Consider these recommended
    practices when evaluating and planning your access control settings:


    +   - Do not use sensitive information in the Cloud Storage bucket name.


    +   - Follow the principle of least privilege when granting access to buckets
    and objects. This will make sure that data contained in the bucket is not accidentally
    exposed.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Google Cloud Identity Access Management


    +   - Do not grant OWNER permission to anyone in the organization. Typically,
    you want the IaC service account to have ownership of the buckets.


    +   - Be aware of how you grant permissions to anonymous users. The allUsers and
    allAuthenticatedUsers provide access to everyone on the internet - be they anonymous
    users or logged in with a Google account. You may not want this behavior.


    +   - Avoid setting ACLs in inaccessible objects. An inaccessible object is an
    that cannot be downloaded (read) and can only be deleted. This can happen when
    the owner of an object leaves a project without granting anyone else OWNER or
    READER permission on the object.


    +   - Make sure to delegate administrative control of your buckets. By default,
    project owners have OWNER permissions. Make sure not to assign this role to individuals.


    +   - Make sure you understand Cloud Storage''s interoperable behavior before
    using it.


    # Uniform bucket-level access


    Cloud Storage has uniform bucket-level access to support the system''s uniform
    permissions. When you use this feature on a bucket, all ACLs for Cloud Storage
    resources in the bucket are disabled, and access to Cloud Storage resources is
    allowed solely through IAM. You have 90 days after enabling consistent bucket-level
    access to revoke your decision.


    Keep in mind that enabling uniform bucket-level access revokes access for users
    who get access purely through object ACLs and prevents users from managing rights
    through bucket ACLs. Before enabling consistent bucket-level access, read the
    Google Cloud product documentation when moving an existing bucket and consider
    whether it''s the right thing to do in your situation.


    # Using uniform bucket-level access in practice


    When you use uniform bucket-level access? Uniform bucket-level access streamlines
    how you offer access to Cloud Storage resources. Using consistent bucket-level
    access also enables you to use features such as Domain Restricted Sharing and
    IAM Conditions.


    You might not want to use uniform bucket-level access and instead keep fine-grained
    ACLs in the following situations:


    +   - You legacy ACLs to control bucket object access


    +   - You want an object''s uploader to have full control over that object but
    to have less access to the objects


    +   - You want to use the XML API to view or set bucket permissions'
  merge: -1
  img_proc: true
