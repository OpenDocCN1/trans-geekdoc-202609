- pgno: 59
  md: '# Compliance in the cloud


    We''ll now take a brief look at some of the key international standards that Google
    Cloud is compliant with. The intent is not to cover them in depth but at a high
    level for your understanding of the scope of these compliance standards. From
    an exam perspective, you will not be tested on your knowledge of compliance standards:


    +   - ISO 27001: This is an Information Security Management System (ISMS) framework,
    consisting of 14 groups, 35 control objectives, and 114 controls. ISMSs are documented
    based on ISO 27001 standards, which provide guidelines for setting up, implementing,
    operating, monitoring, reviewing, maintaining, and enhancing them. As one of the
    core compliance programs, ISO 27001 encompasses all types of organizations (commercial
    businesses, government agencies, and non-profit organizations). Google undergoes
    a yearly third-party audit to certify individual products against this standard.

    - ISO 27002: The ISMS controls the implementation details. This is not a certification
    standard but rather an advisory document containing a list of best practices and
    guidelines that organizations can use to meet the controls listed in the ISO 27001
    standard. It recommends security controls to mitigate risks to the confidentiality,
    integrity, and availability of information. Since this is an advisory document,
    organizations can choose to use these controls, or a completely different set
    to certify against the ISO 27001 standard.

    - ISO 27017: This framework is an extension of ISO 27001 and focuses specifically
    on information security relating to cloud computing beyond the general guidelines
    in the preceding document. This standard advises cloud service providers and customers
    to create a matrix of individual and shared responsibilities.

    - ISO 27018: This is a set of security guidelines that specifically focus on the
    processing and protection of Personally Identifiable Information (PII). It extends
    the control objectives of ISO 27002, which is a broader standard for information
    security management systems. Security safeguards for public cloud service providers
    as PII processors are the primary emphasis of this standard.


    In the next section, we will take a look at how you can download these compliance
    reports using Reports Manager.


    # Compliance reports


    Compliance Reports Manager provides Google Cloud customers with the ability to
    download selected compliance reports directly from https://packt.link/C6JRN. New
    reports are launched at the end of every month.


    You can access Reports Manager via this link: https://packt.link/yBhnU.'
  merge: -1
