- pgno: 62
  md: 'In this section, we will look at cloud-native capabilities that are available
    on Google Cloud that can help you achieve continuous compliance. Continuous compliance
    means that you can run your compliance checks on your cloud assets against the
    policy that is being implemented. Whenever an asset changes its state, as a running
    Google Compute Engine resource with new vulnerabilities, the compliance-as-code
    policy executes to check the state and returns a result to indicate compliance
    or non-compliance. If compliant, no action is required; however, depending on
    your organizational maturity, you can take different actions. For example, you
    might just want a notification to be sent to your security and compliance teams
    to take action and review the finding, or you can build an automated process that
    means once an asset is found to be non-compliant, a Cloud Functions script will
    execute and take corrective action to make the asset compliant.


    ![](img/f681dfc12450e3a4c257352b70dbceca_62_0.png)


    Figure 3.10 – Continuous compliance pipeline


    Google Cloud offers a comprehensive set of tools and services that help organizations
    ensure that their systems and applications remain in compliance with laws and
    regulations. This includes automated compliance checks, continuous monitoring,
    and alerting capabilities to help organizations respond quickly to potential issues.'
