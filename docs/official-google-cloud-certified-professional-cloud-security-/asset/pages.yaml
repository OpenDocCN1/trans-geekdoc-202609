- pgno: 147
  md: "# IAM policy bindings\n\n```\n\"condition\": ...\n...,\n...\n```\n\nThe condition\
    \ object has the following structure: {\n\n```\n\"condition\": {\n  \"title\"\
    : ...,\n  \"description\": ...,\n  \"expression\": ...\n}\n```\n\nLet us go over\
    \ the syntax of condition:\n\n+   - title is required; however, description is\
    \ optional.\n- expression is required where you will define logic for conditional\
    \ evaluation.\n- You would use **Common Expression Language (CEL)** to define\
    \ your logic using logical operators such as (&&), or (||), or inverse (! ) to\
    \ define conditions. You can have up to 12 logical operators in each expression.\n\
    \nCheck the Google Cloud documentation for a list of resources that accept condition\
    \ role bindings and attributes supported by conditions.\n\nHere are the different\
    \ elements of conditions:\n\n+   - **Variables**: These are attributes such as\
    \ `request.time` (of type Timestamp) or `resource.name` (of type String). These\
    \ variables are populated with values based on the context at runtime.\n- **Operators**:\
    \ Every data type (for example, String or Timestamp) supports a set of operators\
    \ that can be used to create a logical expression, for example, `resource.service\
    \ == \"compute.googleapis.com\"`. Operators are used for comparing values in a\
    \ `resource.service` with a literal value. For example, `compute.googleapis.com`.\n\
    - **Functions**: These support more complex operations, for example, if you needed\
    \ to match a part of a string, you should use `request.path.startsWith(\"/acmeBucket\"\
    )`.\n- **Logical operators**: Conditions support three logical operators: &&,\
    \ ||, and ! They make it possible to use multiple input variables in a condition\
    \ expression. For example, `request.time.getFullYear() < 2020 && resource.service\
    \ == \"compute.googleapis.com\"` joins two simple statements."
  merge: -1
