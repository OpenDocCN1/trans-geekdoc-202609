- pgno: 389
  md: "# 14\n\n# Security Command Center\n\nIn this chapter, we will look at the capabilities\
    \ of Google's Security Command Center. The exam typically has questions on how\
    \ to configure and use Security Command Center (SCC) to monitor the security posture\
    \ of your Google Cloud organization. You may also get questions on how to detect\
    \ threats and vulnerabilities in your cloud environment and workloads. This is\
    \ one of the critical aspects of security operations, so make sure you understand\
    \ it very well.\n\nIn this chapter, we will cover the following topics:\n\n+ \
    \  - Overview of SCC\n- Core services:\n  - Cloud Asset Inventory\n  - Detecting\
    \ security misconfiguration using Security Health Analytics\n  - VM Manager\n\
    - Rapid vulnerability detection\n- Threat detection\n- Continuous compliance monitoring\
    \ using SCC\n- Exporting SCC findings\n- Automating findings responses\n\n# Overview\
    \ of SCC\n\nGoogle introduced SCC in mid-2018. SCC provides many features to monitor\
    \ your organization’s security controls, detect threats, and use alerts to automate\
    \ security responses."
  merge: -1
