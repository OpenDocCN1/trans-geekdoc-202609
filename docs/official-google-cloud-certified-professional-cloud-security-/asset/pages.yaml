- pgno: 276
  md: '# Google Cloud Management Service


    | Key attribute | Key attribute guidance |

    | --- | --- |

    | Key protection level | Use protection level EXTERNAL when your workloads require
    keys to be maintained outside of the Google Cloud infrastructure in a partner
    system.<br>Use protection level HSM when your workloads require keys to be protected
    in FIPS 140-2 Level 3-certified hardware security modules (HSMs).<br>Use protection
    level SOFTWARE when your workload does not require keys to be maintained outside
    of Google Cloud and does not require keys to be protected with FIPS 140-2 Level
    3-certified hardware.<br>Choose appropriate protection levels for development,
    staging, and production environments. Because the Cloud KMS API is the same regardless
    of the protection level, you can use different protection levels in different
    environments, and you can relax protection levels where there is no production
    data. |

    | Key source | Allow Cloud KMS to generate keys unless you have workload requirements
    that require keys to be generated in a specific manner or environment. For externally
    generated keys, use Cloud KMS key to import them as described in the Importing
    keys into Cloud KMS section. |

    | Key rotation | For symmetric encryption, configure automation key rotation by
    setting a key rotation period and starting time when you create the key.<br>For
    asymmetric encryption, you must manually rotate keys, as the new public key must
    be distributed before the key pair can be used. Cloud KMS does not support automatic
    key rotation for asymmetric keys.<br>If you have indications that keys have been
    compromised, manually rotate the keys and re-encrypt data that was encrypted by
    the compromised keys as soon as possible. To re-encrypt data, you typically download
    the old data, decrypt it with the old key, encrypt the old data using the new
    key, and then re-upload the re-encrypted data. |

    | Key destruction | Destroy old keys when there is no data encrypted by those
    keys. |

    | Key attribute | Key attribute guidance


