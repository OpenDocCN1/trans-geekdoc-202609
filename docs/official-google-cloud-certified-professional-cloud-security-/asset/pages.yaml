- pgno: 38
  md: '# Security by design


    Google''s approach to security by design is to ensure that multiple technology
    stacks are deployed to secure the infrastructure, identities, services, and users.
    Figure 2.3 highlights the different layers of security that are built into the
    Google Cloud infrastructure.


    # Defense in depth at scale


    ![](img/f681dfc12450e3a4c257352b70dbceca_38_0.png)


    Figure 2.3 – Google defense in depth


    In this section, we will cover the key concepts, from operational security to
    physical security, that Google uses to deliver true defense in depth and at scale.


    # Operational security


    Google''s operational security covers aspects such as how Google deploys software
    services, secures devices and credentials, addresses inner threats, and manages
    intrusion detection. Let''s look at each of these concepts briefly.


    In order to securely deploy software services, Google has secure central control
    and conducts two-way reviews. Furthermore, Google also provides libraries that
    prevent developers from introducing certain vulnerabilities such as XSS attacks
    in web applications. In addition to automated tools for source code analysis and
    identifying bugs, manual security testing is also conducted. These manual tests
    are run by experts covering areas such as web security, cryptography, and operating
    systems.


    Google also runs a Vulnerability Rewards Program where they pay anyone who discovers
    and discloses bugs in Google''s infrastructure or applications.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Security by design


    Google implements robust security measures to protect employee devices and credentials.
    In fact, Google leverages a service accessible to all clouds to safeguard its
    own devices and user credentials. ThroughCorp Enterprise, Google ensures that
    appropriate users have timely access to designated applications. This approach
    involves continuous monitoring of devices and users, regular patching and updates,
    enforcement of strong authentication measures, and utilization of two-factor authentication
    (2FA). Additionally, application-level access controls access to internal applications
    solely for authorized users accessing the service from managed devices and network
    addresses or geolocations align with the established policy.


    To address insider risk, all privileged user access is actively monitored. To
    further limit employee access, any privileged action that can be performed using
    automation is done. All users who have access to end-user data have their activity
    logged and monitored by the security team for access and patterns. https://packet.link/FuBbM


    Google uses sophisticated intrusion detection techniques, where all data processing
    pipelines integrate with both host- and network-level signals. These signals are
    combined with detection rules and machine learning to identify potential threats
    that are monitored and actioned by security operation teams around the clock.
    Google also conducts an active Red Team exercise to improve security and its overall
    effectiveness.


    # Network security


    We have covered how Google owns, operates, and manages its own private network,
    which is fully encrypted and has TLS enforced. This not only delivers lower latency
    but improves security. Once customers'' traffic is on Google''s network, it no
    longer transits the public internet, making it less likely to be attacked, intercepted,
    or manipulated in transit. This besides, Google ensures its Google Front Ends
    (GFEs). When a service wants to make itself available on the internet, it can
    register with the GFE. The GFE performs a number of functions, such as ensuring
    that the correct certificates are used for terminating TLS and applying best practices
    as perfect forward secrecy. Google also provide protection against DDoS attacks.
    Google has multi-tier and multi-layer protection for DDoSes to ensure that the
    services being GFEs are protected from volumetric attacks. Besides GFEs, there
    are multiple layers of hardware- and software-based load balancers that are both
    network- and application-aware. All these security controls, together with Google’s
    global-scale infrastructure, ensure that the largest of the DDoS attacks can be
    mitigated and managed.


    Besides these network-based security controls, Google further enforces user authentication
    before it allows any access to its network. The user authentication goes beyond
    a simple username and password and also intelligently challenges users for additional
    information based on risk factors. These risk factors include information about
    the device the user is logging in, such as the IP address and geographical location
    of the device. Once past controls, the user is prompted for a second factor before
    access is granted.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Data security


    Google ensures that data in motion and data at rest are secured. We''ve already
    covered how Google enforces TLS for all data in motion and encryption by default
    for data at rest. In addition to the default encryption of data at rest, as a
    Google Cloud user, you also get the option to select a different options for how
    you can encrypt data. Recall the previous section on data privacy and Google''s
    commitment to establishing itself as a trusted cloud provider; as a Google Cloud
    customer have full control and ownership over your data you may choose to use
    the default encryption or use Cloud Key Management Service. Alternatively, you
    can use Cloud Key Management Service and import your own key material, or you
    can go the Bring Your Own Key (BYOK) route or multi-tenant Cloud HSM, which provides
    FIPS 140-2 Level 3 protection for your keys. If you are in a highly regulated
    environment and need to retain full control of the keys and the infrastructure,
    you have the option to use a Google-partner-external HSM that is integrated with
    an external key management service and is accessed via Google''s Cloud Key Management
    Service.


    The challenge with data security is that data has to remain secure throughout
    its lifecycle. When the data is created, shared, stored, analyzed, archived, or
    deleted, it has to be secured. This brings us to how Google manages the data deletion
    side of things. A key concern for customers is when you stop using a service that
    you''ve stored sensitive data, when you delete the data how can you be sure that
    the data will be wiped from physical media as well? Let''s take a quick look at
    the controls and compliance side of data deletion. When you want to delete data
    on Google Cloud, it''s not immediately deleted but is marked as deletion, so,
    if you accidentally deleted your data, you have the option to recover it. After
    the data is scheduled for deletion, it is deleted in accordance with service-specific
    policies.


    Google details the entire handling and data governance as part of their called
    Trusting your Data with Google Cloud Platform; a link to this resource can be
    found in the Further section of this chapter. We will be covering the data management
    side of things in more detail in the next chapter on trust and compliance on Google
    Cloud.


    # Services and identity


    For human-to-system interaction or for calls between systems (such as inter-service
    access), Google provides cryptographic authentication and authorization at the
    application layer before any access is granted. Although there are network-perimeter-based
    controls and network segmentation and firewall rules, Google does not rely solely
    on that and zero-trust principles. Each service that''s running also has an associated
    service account, including the cryptographic credentials that are used for authenticating
    and authorizing when a remote call is initiated to access other services. Besides,
    there is a number of techniques used, such as isolating and sandboxing in order
    to protect services that might be running on the same machine. Some of the techniques
    used are language- and kernel-based sandboxing, hardware virtualization, and Linux
    user separation.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Besides the techniques discussed here, Google''s infrastructure provides strong
    privacy and integrity for the data that traverses its networks. All protocols
    for applications such as HTTP are encapsulated inside the remote procedure call
    infrastructure. To provide greater control, every service owner has the ability
    to provide the crypto-based protection level required for remote procedure calls;
    for example, service owners can enable integrity-level protection for data that
