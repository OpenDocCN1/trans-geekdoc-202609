- pgno: 234
  md: '# Google Cloud Armor


    This section covers DDoS protection and the use of WAFs to provide safety for
    your web-based infrastructure. You can protect your Google Cloud workloads from
    a wide range of threats, including DDoS attacks and application attacks, such
    as XSS and SQL injection, with Cloud Armor (SQLi). Some capabilities are built
    in to provide automated protection, while others require manual configuration.
    We will look at those capabilities of WAFs in more detail in this section:


    ![](img/f681dfc12450e3a4c257352b70dbceca_234_0.png)


    Figure 8.18 - How Google Cloud Armor secures your infrastructure


    Cloud Armor leverages Google''s global and distributed infrastructure to detect
    and absorb attacks and filter traffic through configurable security policies at
    the edge. It should be kept in mind that several aspects of Google Cloud Armor
    are only available for applications running behind an external HTTP(S) load balancer.
    Figure 8.18 illustrates the placement of Cloud Armor, which is in line with the
    external load balancer, providing the ability to create IP allow and deny lists,
    enforce geo-location-based rules, and configure the WAF and custom rules from
    Layer 3 to Layer 7.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'There are some Layer 3 and Layer 4 protections built into Cloud Armor that
    do not require any user configuration. These pre-built rules provide protection
    against volumetric attacks such as DNS amplification, SYN floods, Slowloris, and
    so on.


    ![](img/f681dfc12450e3a4c257352b70dbceca_235_0.png)


    Figure 8.19—DDoS protection against volumetric attacks


    Figure 8.19 illustrates the built-in security policies for Cloud Armor that provide
    protection against these common types of volumetric attacks.


    Next, we will look at how Cloud Armor works and some deployment models that will
    help you understand the use cases. As mentioned earlier, Google Cloud Armor is
    always in line and scales to match Google''s global network. It protects applications
    and services behind external HTTP(S) load balancers, SSL proxy load balancers,
    or TCP proxy load balancers for DDoS attacks on the network or protocol. Because
    it can detect and counter network threats, Cloud Armor''s balancing policies will
    only allow properly formatted requests. Custom Layer 7 filtering policies, including
    predefined WAF rules to limit OWASP Top 10 vulnerability risks, are also available
    to back services behind an external HTTP(S) load balancer. Google Cloud Edge can
    be used to define rules that enable or restrict access to your external HTTP(S)
    load balancer, as near as is feasible to the source of incoming traffic, through
    the use of security policies. A firewall can be set up to block unwanted traffic
    from accessing or consuming resources in your private cloud.


    Cloud Armor is available in two tiers, called Managed Protection Standard and
    Managed Protection Plus. The key difference between them is the DDoS response
    team and cost protection that Plus provides compared to the Standard edition.
    There is no difference in the capabilities of the product.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Advanced Network Security


    Let''s take a look at the Cloud Armor deployment models before we dive deep into
    some technical aspects as security policies and WAF rules.


    ![](img/f681dfc12450e3a4c257352b70dbceca_236_0.png)


    Figure 8.20 – Cloud Armor deployment models


    We will use 8.20 to look at the deployment models:


    +   - Cloud Armor supports the protection of Cloud Content Delivery Network (CDN)
    origin servers by enforcing Cloud Armor security policies on dynamic requests
    as well as cache misses missed by the CDN origin server. Most applications are
    often complex, serving both cacheable static content and dynamic requests from
    the same services. Cloud Armor is a security service that can protect websites
    and applications from malicious attacks. It is able to inspect and filter requests
    that are sent to the origin servers of CDN. This helps to prevent so-called cache-buster
    attacks, which are attempts to bypass the cache and force the origin servers to
    send updated content. Additionally, Cloud Armor can help protect dynamic portions
    of websites and applications from the 10 most common security vulnerabilities
    as defined by OWASP.


    +   - There is often a need to enforce a consistent set of security controls to
    applications no matter where they are deployed, whether they are migrating to
    Google Cloud or running in a hybrid configuration. With internet Network Endpoint
    Groups (NEGs), you can leverage all of Google’s edge infrastructure, including
    global load balancers, Cloud CDN, and Cloud Armor, to protect your website or
    applications no matter where they are hosted. Cloud Armor can help protect your
    applications, from DDoS attacks or other common web attacks, without you having
    to deploy your applications on Google Cloud.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Note

    NEGs do not fall within the scope of the exam. You can refer to the Further reading
    section to read more about NEGs and how to configure them.


    +   - With GKE Ingress support for Cloud Armor, you can protect your containerized
    workloads by placing them behind Google''s global load balancers and configuring
    Cloud Armor security policies for Layer 7 filtering and WAF use cases.


    We will now look at the key components of Cloud Armor in more detail, with examples
    of how to configure them.


    # Security policies


    In Cloud Armor, you can build security policies that help you defend applications
    operating behind a load balancer against DDoS and other web-based attacks, regardless
    of whether the apps are deployed on Google Cloud or in a hybrid or multi-cloud
    architecture. It is possible to stop traffic before it reaches your load-balanced
    backend services and buckets using security policies filter Layer 3 and Layer
    7 requests for common exploits. An IP address, an IP range, a region code, and
    request headers are only a few examples of the conditions used to filter traffic
    by security policies.


    ![](img/f681dfc12450e3a4c257352b70dbceca_237_0.png)'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Advanced Network Security


    This section will take a closer look at security policies, looking at factors
    such as the requirements before you develop a policy and some of security policies''
    most important features (as depicted in Figure 8.21). Backend services behind
    an external load balancer are only able to access the security policies available
    to those services. Instance groups, serverless NEGs, internet NEGs and Google
    Cloud Storage buckets are all supported backend services for Google App Engine,
    Cloud Run, and Cloud Functions. You must employ internet NEGs for all of your
    hybrid or multi-cloud protection needs.


    Security policies cannot be applied until the load balancer is an HTTP(S) load
    balancer and the backend service''s external load balancing scheme and the backend
    service''s protocol are met – the protocol must be either HTTP, HTTPS, or HTTP/2.


    There are two categories of security policies that you can configure – security
    policies and edge security policies. Instance groups or NEGs, neglecting internet,
    zone, and serverless NEGs, can be used to filter and protect backend services.
    The actions associated with backend security policies allow, deny, redirect (to
    GoogleCAPTCHA), throttle, and rate-based for each source range or geography. You
    can also create WAF rules and IP lists, using Layer 7 filtering and adaptive protection
    (adaptive protection is a new feature and currently out of scope for the exam).


    For edge security policies, you can create and allow deny based on source IP and
    source geography. These policies allow users to establish access control and filtering
    policies for cached information. When compared to backend security policies, edge
    security policies only allow for filtering based on a handful of criteria. A backend
    policy cannot be used to set an edge security policy.


    At the edge of Google''s network – upstream of the Cloud cache – edge security
    measures are installed and implemented. Two levels of security can be provided
    by coexisting backend security policies and edge security policies. Regardless
    of the resources that a backend service refers to, they can be applied simultaneously
    (for example, instance groups or network endpoint groups). In order to secure
    backend, you must use edge security policies. You should keep in mind that edge
    security policies are examined and executed prior to IAP. An edge security policy
    blocks a request before the identity of the requester is evaluated by IAP.


    Rule evaluation for a security policy is determined by rule priority. When determining
    which rules are evaluated first, look at the rule with the lowest numeric value.
    This rule has the highest logical priority and is evaluated first.


    If none of the higher priority rules is met, or if other rules are present, a
    default rule is applied to all security policies. A priority of 2147483647 is
    automatically assigned to the default rule, which is always included in the policy.


    Although the default rule cannot be deleted, you can change the default action
    associated with the rule. It is possible to change the default rule''s action
    from allow to deny.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Google Cloud Armor 215


    Use the Google Cloud Armor custom rules to define expressions in the match condition
    of one or more rules. When Cloud Armor receives a request, it analyzes it against
    the following expressions. Depending on whether the rules are met, inbound traffic
    is either denied or allowed. There are some instances of Cloud Armor expressions
    written in the Common Expression Language (CEL):


    +   - To define expressions in a rule, use the gcloud --expression flag or the
    Google Cloud console.


    +   - In the following example, requests from 2001:db8::32 in the AU region match
    the following expression:


    ```

    origin.region_code == "AU" && inRange(origin.ip,

    2001:db8::32);

    ```


    +   - The following example matches requests from 192.0.2.0/24 and with a user
    agent that contains the string WordPress:


    ```

    inRange(origin.ip, ''192.0.2.0/24'') && has(request,

    headers[''user-agent'']) && request.headers[''user-agent'']

    contains(''WordPress'')

    ```


    # WAF rules


    In this section, we look at the different types of rules that you can create.
    There are some WAF rules that can be pre-configured, but you have the option of
    creating custom rules to meet your requirements. Let''s take a look at the options
    available.


    You can create IP-address-based rules both at the edge and for your backend services.
    These rules are the IP address allowlist- and denylist-based rules. Both ipv4
    and ipv6 are supported. HTTP 403 (Unauthorized), 404 (Access Denied), and 502
    (Bad Gateway) responses are all possible outcomes of denies. An HTTP 429 is an
    error code that is returned when an application has exceeded a number of requests.
    This is usually caused by an action rule that limits the number of requests that
    can be made in a given period of time.


    There are pre-configured rules based on the OWASP ModSecurity rule set version
    3.0. These rules can provide you with protection from the following types of attacks:


    +   - SQL injection


    +   - Cross-site scripting (XSS) attacks


    +   - Local file inclusion (LFI) attacks


    +   - Remote file inclusion (RFI) attacks


    +   - Remote code execution (RCE)'
  merge: -1
  img_proc: true
- pgno: 240
  md: "Use rate-limiting rules to restrict requests per client based on the threshold\
    \ you define, or temporarily ban clients who exceed the threshold for the duration\
    \ you set.\n\nThere are bot management rules as well (in preview only), which\
    \ are out of the scope of the exam. Pre-configured rules also exist for named\
