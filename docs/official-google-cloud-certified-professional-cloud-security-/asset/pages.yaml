- pgno: 207
  md: '# 8


    # Advanced Network Security


    In this chapter, we will look at advanced network security. This chapter is an
    extension of the previous chapter and part of the overall network security domain.
    The chapter will focus more on how to secure your Google Cloud environment using
    the advanced network security features that are available on Google Cloud. We
    will be discussing context-aware security and its related topics, such as Identity-Aware
    Proxy and Private Google Access. We will explore their purpose and learn how to
    configure them for various cases.


    After that, we will look at Google Cloud Virtual Private Cloud (VPC), where you
    can define a context-aware approach to secure your resources. To secure your web
    applications on Google Cloud, we will look at web application firewalls, followed
    by learning how you can use services such as Cloud Armor to protect your environment
    from distributed denial-of-service attacks. We conclude this chapter by looking
    at network logging and monitoring and some best practices and design considerations.


    In this chapter, we will cover the following topics:


    +   * Private Google Access

    * Identity-Aware Proxy

    * Cloud NAT

    * Cloud Armor


    # Private Google Access


    Private Google Access addresses the challenge where you want virtual machines
    (VMs)/Google Compute Engine (GCE) instances that do not have external IP addresses
    but addresses to access Google APIs. Instances without public IP addresses cannot
    access Google Cloud''s public API endpoints – but the Private Access service enables
    that capability. Let''s look at some use cases on why Private Google Access is
    required before we learn how to configure the service.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Advanced Network Security


    VMs often have to communicate with managed services, for example, Google Cloud
    Storage, BigQuery, and GCE. Managed services have a public endpoint, for example,
    storage.googleapis.com. Assigning an external IP address to every VM that needs
    to communicate with a public API wouldn''t be a practical or secure approach due
    to the shortage of valid IPv4 addresses. Private Google Access allows communication
    with Google API public endpoints without requiring an external IP. When interconnecting
    with on-premises Cloud Virtual Private Network (VPN) or Cloud Interconnect, it
    is possible to extend this so that access from on-premises to Google APIs remains
    internal. We will study more details on when we discuss connectivity options.


    ![](img/f681dfc12450e3a4c257352b70dbceca_208_0.png)


    Figure 8.1 – Private Google Access


    Figure 8.1 provides a high-level overview of how Private Google Access, when enabled,
    provides access to the public Google Cloud API securely via private connectivity.


    Private Google Access is enabled on a subnet-by-subnet basis; this setting is
    available to you under the VPC subset. Let’s consider an example where you have
    two subnets (subnet-a and subnet-b) inside a VPC with four VMs. Subnet-a has Private
    Google Access enabled and subnet-b does not have Private Google Access. VM1 and
    VM2 are in subnet-a and VM3 and VM4 are in subnet-b. VM1 and VM3 have private
    addresses and VM2 and VM4 have external IP addresses. Based on these settings,
    the following is as:


    +   - VM1 can access Google APIs as it is part of subnet-a with Private Google
    Access.


    +   - VM3, on the other hand, has a private IP address but is inside subnet-b,
    which does not have Private Google Access enabled; therefore, it cannot access
    Google APIs.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Private Google Access 185


    +   - Finally, VM2 and VM4 both have an external IP address and therefore are
    able to access Google APIs irrespective of whether they are in a subnet with Private
    Access enabled.


    ![](img/f681dfc12450e3a4c257352b70dbceca_209_0.png)


    # Figure 8.2 – Private Google Access for on-premises services


    In 8.2, we have an example architecture of how you can use Private Google Access
    to allow your on-premises services to access Google APIs over Cloud VPN. This
    same design principle applies if you have Cloud Interconnect connected to Cloud
    VPN.


    Next, we will look at how you configure Private Google Access for your subnets.
    But first, we will look at some prerequisites before you do so:


    +   - The VM interface should be in a subnet that has Private Google Access enabled.

    - An external IP address should not be assigned to the VM.

    - The source IP address of the packet from which the traffic is sent must match
    the IP address of the primary interface of the VM. Alternatively, it can match
    an internal IP address that is from an alias range.

    - The following network requirements must also be met:


    +   - Private Google Access can only be enabled on VPC networks; legacy networks
    are not supported as you cannot create subnets in a legacy network.

    - Enabling Private Google Access does not automatically enable it for all APIs.
    You have to individually select which APIs you need to enable Private Google Access
    for.

    - If you will be using either of the `private.googleapis.com` or `restricted.googleapis.com`
    domain names, you will need to create DNS records to direct the traffic to the
    IP address that is associated with these domains.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "+   * You will need to configure a route to the public endpoints with the default\
    \ internet gateway as the next hop.\n* You will need the egress firewall rules\
    \ to prevent traffic to the IP address ranges used by Google APIs and services.\n\
    * Correct network admin identity and access management (IAM) permissions are required\
    \ for the configuration.\n\nEnabling Private Google Access is a very straightforward\
