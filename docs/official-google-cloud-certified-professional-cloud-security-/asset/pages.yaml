    \ and connected environments? Is Cloud DNS and DNSSEC be factored into your public\
    \ zones?\n  * What strategies will be used to connect Google Cloud with corporate\
    \ networks? Will you use hybrid connectivity options?\n  * How will your resources\
    \ communicate with the internet? Will you use external load balancing Global or\
    \ regional?\n\nIt is important not just to understand best practices but also\
    \ to consider answering the preceding questions around design considerations,\
    \ which will help you define requirements and build a resilient and secure network\
    \ on Google Cloud and across your hybrid network.\n\n# Summary\n\nIn this chapter,\
    \ we covered VPC and the concepts of regions and zones and how they are designed.\
    \ We looked at VPC models such as Shared VPC and VPC peering. We covered micro-segmentation\
