- pgno: 277
  md: "Let us look at a few other factors involved in decision-making.\n\n# Application\
    \ data encryption\n\nYour application might use Cloud KMS by calling the API directly\
    \ to encrypt, decrypt, sign, and verify data. Applications that handle data encryption\
    \ directly should use the envelope encryption approach, which provides better\
    \ application availability and scaling behavior.\n\n> Note\nOrder to perform application\
    \ data encryption in this way, your application must have IAM access to both the\
    \ key and the data.\n\n# Integrated Google Cloud encryption\n\nBy default, Google\
    \ Cloud encrypts all your data at rest and in transit without requiring any explicit\
    \ setup by you. This default encryption for data at rest, which is transparent\
    \ to you, uses Cloud KMS behind the scenes and manages access to the keys on your\
    \ behalf.\n\n# CMEKs\n\nFor more control over the keys for encrypting data at\
    \ rest in a Google Cloud project, you can use several Google Cloud services that\
    \ offer the ability to protect data related to those services by using encryption\
    \ keys managed by the customer within Cloud KMS. These encryption keys are called\
    \ CMEKs.\n Cloud products that offer CMEK integration might require the keys to\
    \ be hosted in the same location as the data used with the key. Cloud KMS might\
    \ use different names for some locations than other services use. For example,\
    \ the Cloud KMS multi-regional location Europe corresponds to Cloud Storage multi-regional\
    \ location EU. Cloud KMS also has some locations that are not available in all\
    \ other services. For example, the Cloud KMS dual-regional location euro5 has\
    \ no counterpart in Cloud Storage. You need to identify these requirements before\
    \ you create the Cloud KMS ring so that the key is created in the correct location.\
    \ Keep in mind that you cannot delete a key ring.\n\n# Importing keys into Cloud\
    \ KMS\n\nYour workloads might require you to generate the keys outside of Cloud\
    \ KMS. In this case, you can import key material into Cloud KMS. Furthermore,\
    \ you might need to provide assurance to reliable parties on the key generation\
    \ and import processes. These additional steps are referred to as a key ceremony."
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Google Cloud Management Service\n\nYou use a key ceremony to help people\
    \ trust that the key is stored and used securely. Two examples of key ceremonies\
    \ are the DNSSEC root key signing key (KSK) ceremony and the ceremony used by\
    \ Google to create root CA keys. Both ceremonies support high transparency and\
    \ high assurance requirements because the resulting keys must be trusted by the\
    \ entire internet community.\n\nDuring the key ceremony, you generate the key\
    \ material and encrypt known plaintext to ciphertext. You import the key material\
    \ into Cloud KMS and use the ciphertext to verify the imported key. After you\
    \ have successfully completed the key ceremony, you can enable the key in Cloud\
    \ KMS and use it for cryptographic operations.\n\nBecause key ceremonies require\
    \ a lot of setup and staffing, you should carefully choose which keys require\
    \ ceremonies.\n\n> Note\nThis is a high-level description of the key ceremony.\
    \ Depending on the key's trust requirements, you might need more steps.\n\n# Cloud\
    \ KMS API\n\nThe Cloud KMS service has an endpoint of cloudkms.googleapis.com.\
    \ Here are a few widely used endpoints that you should be aware of:\n\n+   * projects.locations\n\
    * projects.locations.ekmConnections\n* projects.locations.keyRings\n  * create\n\
    \  * list\n  * get\n  * getIamPolicy\n  * setIamPolicy\n* projects.locations.keyRings.cryptoKeys\n\
    \  * create\n  * decrypt\n  * encrypt\n  * get"
  merge: -1
  img_proc: true
