    Now that we have looked at IAM roles and best practices for key management, let
    us look at Cloud HSM offers coming next.


    # Cloud HSM


    Cloud HSM is a cloud-hosted HSM service that allows you to host encryption keys
    and perform cryptographic operations in a cluster of FIPS 140-2 Level 3 certified
    HSMs. The Cloud HSM cluster is managed by Google for you; you do not get access
    to the physical device. You do not need to patch or scale it for multi-regional
    applications. Cloud HSM uses Cloud KMS as its frontend to interact with the Cloud
    HSM backend. This abstracts the communication with Cloud HSM, so you do not need
    to use Cloud HSM-specific code.'
