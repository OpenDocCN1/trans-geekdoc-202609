    Google Cloud supports several cloud services for Cloud EKM for CMEK encryption.
    Please refer to the Google Cloud documentation for currently supported services.


    # The architecture of Cloud EKM


    Figure 9.8 shows the architecture of Cloud EKM.


    ![](img/f681dfc12450e3a4c257352b70dbceca_272_0.png)


    Figure 9.8 – Cloud EKM architecture'
