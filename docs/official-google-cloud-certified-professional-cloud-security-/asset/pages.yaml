- pgno: 430
  md: '# GKE shared responsibility model


    Google is responsible for the following aspects of GKE security:


    +   - The hardware, firmware, kernel, OS, storage, network, and other components
    of the underlying infrastructure. This includes encrypting data at rest, encrypting
    data in transit, custom-designed hardware, private network connections, physical
    access protection for data centers, and secure software development methods.

    - The OS for the nodes, such as Container-Optimized OS (COS) or Ubuntu. GKE makes
    changes to these images available as soon as possible. These images are automatically
    installed if you have auto-upgrade enabled. This is the foundation of your container;
    it is different from the operating system that runs inside it.

    - Kubernetes is a container orchestration system. GKE provides the most recent
    Kubernetes upstream versions and supports numerous minor versions. It is Google''s
    responsibility to update these, including patches.

    - The control plane, which manages the VMs, the API server, and other components
    that run on those VMs, as well as the etcd database, is managed by GKE. This includes
    upgrades and patches, scalability, and repairs, all of which are backed up by
    a Service-Level Agreement (SLA).

    - IAM, Cloud Audit Logging, Cloud Logging, Cloud Key Management Service, Cloud
    Security Command Center, and other Google Cloud integrations. These controls are
    also accessible for IaaS workloads on Google Cloud.


    Now let us see what Google Cloud customers are responsible for:


    +   - The nodes on which workloads are executed. Any additional software installed
    on the nodes, as well as any configuration changes made to the default, are your
    responsibility.

    - Customers are also in charge of keeping their nodes up to date. Google automatically
    supplies hardened VMs and configurations, maintains the containers to run GKE,
    and provides OS patches—all they need to do is upgrade. If you use auto-upgrade,
    Google will handle.

    - The workloads themselves, which include your application code, Dockerfiles,
    container images, data, RBAC/IAM rules, and running containers and pods. help
    safeguard your containers, you can use GKE security features and other Google
    Cloud products such as Container Threat Detection (KTD), part of Security Command
    Center. Sometimes Google customers also use third-party products such as Twistlock
    for runtime protections.


    Now that you understand GKE architecture and the shared responsibility model,
    let us see what are the challenges for container security.'
  merge: -1
  img_proc: true
