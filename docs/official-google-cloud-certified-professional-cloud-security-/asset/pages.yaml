- pgno: 49
  md: 'Access Transparency and Access Approval


    # Access Transparency


    Access Transparency logs are a feature provided by Google Cloud that offer customers
    visibility into the actions performed by Google employees when they access customer
    data. These logs provide a detailed record of any access made by Google''s support
    and engineering teams to customer data or stored within Google Cloud services.
    Access Transparency logs help customers manage regulatory compliance requirements,
    security audits, and internal governance policies. By providing a comprehensive
    record of access activities, these logs contribute to building trust and ensuring
    the integrity and privacy of customer data within the Google Cloud platform. Google
    follows a set of best practices to control access to customer data. These best
    practices include the following:


    +   * Least privilege: Access by Google employees is denied by default. And when
    access is granted, it is both conditional and temporary limited to only what is
    necessary for a user to perform their role and function


    +   * Limit access to data: It is extremely difficult for Google employees to
    singularly access customer data without another individual being involved. Therefore,
    quorum-based access control for data is enforced.


    +   * All access must be justified: Google personnel, by default, do not have
    access to customer data. When Google personnel have privileged access, they must
    have the required permissions, business justification, and consent. Again, quorum-based
    controls apply to ensure that there is no oversight of the task being performed.


    +   * Monitoring and alerting: Monitoring and response processes exist to identify,
    triage, and remediate violations of these access controls.


    As you can see, there are a number of procedural and technological controls and
    policies in place to ensure that insider risk and administrative privileges are
    managed and controlled. When any of these activities happen due to business requirements
    for a customer environment, Google logs the activities and shares them when the
    customer requests the transparency logs. Customers request Access Transparency
    logs by enabling the service through the Identity and Access Management section
    of the Google Cloud console.


    Adding transparency to purpose-built tools has a clear intent: to establish trust
    and help customers in gaining visibility of their data and demonstrate adherence
    to compliance requirements with auditors.


    A key distinction between Access Transparency logs and admin activity logs is
    that admin activity logs are limited to recording the actions of the users or
    administrators of your Google Cloud organization, whereas Access Transparency
    logs record actions taken by Google employees. Access Transparency logs include
    detail such as the impacted resource and the relevant action taken, the time of
    the action, the reason, and information about who accessed it.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'There are many reasons why you want to have access to transparency logs. Let''s
    take a look at some of them:


    +   - To verify that the Google personnel who accessed your content did so with
    a valid business justification, such as support requests

    - To verify that Google support engineers have not made an error while performing
    instructions you as a customer provided with them

    - To verify and track compliance with legal or regulatory requirements

    - To collect and analyze transparency logs and ingest them in a security information
