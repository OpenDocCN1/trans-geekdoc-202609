    \ For the purpose of the exam, you need to know what types of rules exist and\
    \ how they work. You are not tested on writing custom WAF rules.\n\n# Named IP\
    \ lists\n\nUsing the named IP list feature in Cloud Armor, you can reference third-party\
    \ maintained IP ranges and addresses within a security policy. You don't have\
    \ to specify individual IP addresses. Instead, you can reference entire list containing\
    \ multiple IP addresses that you would like to allow or deny. It is important\
    \ to note that named IP lists are not security policies, but they can be specified\
