- pgno: 390
  md: '# Security Command Center


    Here are some of the key features of SCC:


    +   Gain centralized visibility and control over your Google Cloud data and resources:

    - SCC gives enterprises centralized visibility of their cloud assets across App
    Engine, BigQuery, Cloud SQL, Cloud Storage, Compute Engine, Identity and Access
    Management (IAM), Google Kubernetes Engine (GKE), and more.

    - SCC enables enterprises to quickly find out how many projects in their environment,
    what resources are located, and which service accounts have been added or removed.
    You can leverage SCC REST API to access assets and findings and make it easier
    to integrate with existing systems.

    - You can view your Google Cloud asset history to understand exactly what changed
    in your environment and respond to the most pressing issues.

    - You can receive notifications about new findings or updates to existing findings.
    The notifications are typically delivered within six to twelve minutes, ensuring
    that you stay informed and take appropriate actions.


    +   Find and fix misconfigurations:

    - Security Health Analytics (SHA) is a built-in service in SCC that helps you
    identify security misconfigurations in your Google Cloud assets and resolve them
    by following actionable recommendations.

    - Web Security Scanner (WSS) is a built-in service in SCC that can automatically
    detect web applications running in Google Cloud and scan for web app vulnerabilities.
    This can help you catch web application vulnerabilities before they hit production
    and reduce your exposure to risks.


    +   Report on and maintain compliance:

    - SCC Premium helps you identify compliance violations in your Google Cloud assets
    and resolve them by following actionable recommendations.

    - You can review and export compliance reports to help ensure all your resources
    are meeting their compliance requirements.


    +   Detect threats targeting your Google Cloud assets:

    - Event Threat Detection is a built-in service in SCC Premium that helps customers
    detect threats using logs running in Google Cloud at scale:

    - Uncover suspicious cloud-based activity using Google''s unique threat intelligence'
  merge: -1
  img_proc: true
- pgno: 391
  md: '+   - Use kernel-level instrumentation to identify potential compromises of
    containers, including suspicious binaries


    +   - Combine threat intelligence from first- and third-party providers, such
    as Palo Alto Networks, to better protect your enterprise from costly and high-risk
    threats


    +   - Detect whether your virtual machines (VMs) are being used for abuse cases,
    such as coin mining


    +   - Respond to threats by using a Cloud Pub/Sub event or Cloud Functions and
    reduce your time to resolution


    +   - Container Threat Detection (KTD) is a built-in service in SCC that detects
    the most common runtime attacks and alerts you to any suspicious activity


    Now that you have a brief idea of what SCC can do, let us dive deep into the core
    services of SCC.


    # Core services


    Core services contribute to various parts of the security architecture of your
    Google Cloud organization for detection and alerting. The following diagram shows
    the core services offered by SCC.


