  md: '# About the reviewers


    Hector Diaz is a Cloud Security Architect at Google, partnering with highly-regulated
    organizations to design and operate secure and compliant cloud environments. Before
    joining Google, Hector spent 15 years architecting security and Cloud solutions
    for customers in the financial, retail, and telecommunications industries to achieve
    their business goals.


    Assaf Namer is a Cybersecurity leader, Principal Cloud Security Architect, security
    patent holder, and mentor. He has worked on few startups as well as industry giants
    such as Intel, AWS, and Google. Assaf is the creator of a few security blueprints
    and has led some of the largest cloud agreements, and offers government security
    advice. He holds a master''s degree in Cybersecurity, MBA, and a professional
    program in AI/ML from MIT.


    Lanre Ogunmola is a Cloud Security Architect at Google Cloud and has more than
    15 years of work experience with a strong focus on data protection, cryptography,
    threat modeling, and risk assessment. He holds an MS in Cybersecurity from the
    University of Nebraska and has earned CISP, CCSP, CISA, CISM, CKA, CKS, and other
    Google Cloud certifications. Outside of work, he loves watching soccer and experiencing
    new cultures.


    Holly Willey is a Cloud Security Architect who helps organizations craft secure,
    scalable, and resilient systems in the cloud that address their business needs.
    She has worked as an architect for Google Cloud, ServiceNow, and AWS, as well
    as in engineering roles at Splunk and F5 Networks. Her early career included more
    than a decade spent designing, building, and supporting mission-critical databases
    for financial services, telecommunications, and e-commerce companies. Holly holds
    an M.A. in Teaching Mathematics and Science from Seattle Pacific University and
    a B.A. in Business Administration from the University of Washington.'
