    In this section, we looked at how you can enable Private Google Access for subnets
    that can allow your VMs—either on-premises or on Google Cloud—to secure access
    to Google APIs.


    # Identity-Aware Proxy


    IAP lets you configure authorization to secure remote access to your VMs and applications.
    IAP and load balancers are in front of all your data requests. This provides a
    much simpler administration process, with less operational overhead, than more
    traditional VPN solutions. There is no VPN to implement and no VPN clients to
    install. It also makes the end user experience more streamlined as the user no
    longer has to launch the VPN client and sign in to the VPN.


    In comparison to a traditional VPN, IAP takes the approach of application-based
    access control instead of network-based access control. Access is only possible
    through IAP by users who have been configured with the right identity provider,
    2FA. Configure authorization using Cloud IAM, users need the IAP-secured Web App
    User Role on the resource project to be configured. We will look at the steps
    on how to configure that in the Enabling IAP for on-prem section later in this
    chapter.


    Using IAP, you can not only secure access to resources on Google Cloud, such as
    GCE, Google App Engine, and GKE, but you can also secure access for your on-premises
    or third-party cloud provider. We will look at an example of how you can configure
    secure access using IAP for on-premises resources later in this section.


    IAP has tight integration with some other Google Cloud products, such as Cloud
    IAM, Cloud Identity, and Access Context Manager. You can configure Access Context
    Manager to enforce additional security checks when giving access to a user. For
    example, you can check for geo-location, enforce IP address whitelisting, and
    also endpoint device checks, such as checking for X.509 certificates, checking
    for disk encryption, and not only give you visibility of the user context and
    aspects such as single and multi-factor authentication but also perform device
    checks before access is granted. The authentication server utilizes the request
    credentials, if they are legitimate, to determine the user''s identity (email
    address and user ID). When a user is authenticated, the authentication server
    examines their IAM role to see whether they are allowed to access the resource
    in question.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Identity-Aware Proxy


    ![](img/f681dfc12450e3a4c257352b70dbceca_217_0.png)


    Figure 8.7 – How IAP works with App Engine


    Let''s look at Figure 8.7 to understand how IAP works with App Engine. When an
    application or resource is protected by IAP, only users with the appropriate IAP
    rights (the IAP-secured Web App User role) can access it. In order to access protected
    resources, IAP runs both authentication and authorization checks on the requesting
    user.


    IAP intercepts the request to the resource and checks to see whether IAP is enabled
    for the service. If this option is enabled, any IAP credentials that appear in
    the request headers or cookies are submitted to an IAP authentication server.
    An OAuth 2.0 Google account sign-in flow that stores a token for future sign-ins
    is redirected to the user if they do not have browser credentials.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Advanced Network Security


    For GKE and GCE, users can bypass IAP authentication if they can access the VM''s
    application-serving port. IAP-secured applications can''t be protected from code
    executing on a different VM since firewall restrictions can''t stop it. A similar
    aspect applies to Cloud Run, where, if a user has an auto-signed URL, they can
    bypass the IAP authentication. To safeguard against traffic that does not originate
    from the serving infrastructure, you must implement firewall rules and a load
    balancer. Other alternatives, such as using ingress controls for Cloud Run and
    App Engine, can be used to sign headers.


    Next, we will cover how IAP can work to support your on-premises applications''
    access. There is a new component that will be introduced in the setup, the IAP
    connector. We will understand what this connector is and also look under the hood
    of the IAP connector. From an exam perspective, you will not be tested on your
    knowledge of how an IAP connector works, but it''s good to understand it anyway.


    ![](img/f681dfc12450e3a4c257352b70dbceca_218_0.png)


    Figure 8.8 - How IAP for on-premises works'
  merge: -1
  img_proc: true
- pgno: 219
  md: "# Identity-Aware Proxy\n\nWe will use the illustration given in Figure 8.8\
    \ to understand the flow and the key components of IAP\nfor-premises. We will\
    \ then look at how secure access is given to applications that are connected\n\
    ia a hybrid connector from Google Cloud to on-premises.\n\nThe initial part of\
    \ the workflow is similar to how IAP works for App Engine, as explained earlier.\
    \ There\nis no difference between the authentication and authorization checks\
    \ that are performed for the user.\nThe request is then sent to the IAP connector,\
    \ which forwards the request to the on-premises network\nover a site-to-site connection\
    \ by Interconnect.\n\nIAP targets on-premises applications with the use of an\
    \ IAP connector. You can create an IAP\nconnector from the IAM dashboard of the\
    \ Google Cloud console. An IAP connector is deployed using\na configurable Google\
    \ Cloud Deployment manager. This template deploys the resources that\nneed host\
    \ and run the IAP connector. Inside your Google Cloud project, the template deploys\n\
    An Ambassador proxy on a GKE cluster. This proxy is responsible for routing the\
    \ traffic that is secured\nby Cloud Identity to your on-premises applications,\
    \ directly applying Google Cloud Identity and\nAccess Management (Cloud IAM) policies.\n\
    \nYou have to define the mappings for the IAP connector. Every routing name must\
    \ correspond\nan an ambassador-created GCE backend resource. The mapping parameter\
    \ has to define the routing\nwith the source and destination. This is to ensure\
    \ that the requests can be routed from the source\nto the correct destination,\
    \ which could be an application on the on-premises network. The following\nexample\
    \ shows what a mapping should look like:\n\n```\nrouting:\n  - name: crm\n   \
    \ mapping:\n      name: host\n      source: www.crm-domain.com\n      destination:\
    \ crm-internal.domain.com\n  - name: sub\n      source: customer.hr-domain.com\n\
    \      destination: customer.hr-internal.domain.com\n  - name: billing\n    mapping:\n\
    \      name: host\n      source: www.billing-domain.com\n      destination: billing-internal.domain.com\n\
    ```\n\nIn this example, we route the incoming requests coming from www.crm-domain.com\
    \ to\ncrm-internal.domain.com and therefore create a mapping for both the host\
    \ and subdomain\nas well. Later, we will look at the steps to enable IAP for on-premises\
    \ applications."
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Advanced Network Security


    An important point to note here is IAP by default is integrated with Google identities
    and uses services such as Google Cloud Identity and Cloud IAM. However, you do
    have the option to use external identities instead of Google Cloud Identity Platform,
    which is Google’s customer IAM solution. Google Cloud Identity Platform can be
    used with IAP. Google Cloud Identity Platform is a completely different product
    and is not in scope for the exam.


    Next, we will look at how to use TCP forwarding for IAP. use cases are limited
    to supporting applications that use HTTP or HTTPS. At the time of writing this
    book, there is no support for thick clients. But you can use TCP forwarding to
    support both Secure Shell (SSH) and Remote Desktop Protocol (RDP). It is for users
    to connect to any TCP port on GCE via TCP forwarding, IAP opens a listening port
    and sends all traffic to the chosen instance. IAP uses HTTPS to encrypt client-side
    traffic. The gcloud compute ssh encapsulates SSH in HTTPS and passes it to the
    remote instance, eliminating the need for a listening port when using SSH with
    gcloud. TCP forwarding only works with GCE using IAP and not with on-premises
    apps.


    # Enabling IAP for on-premises


    There are four different configurations that you should be familiar with: enabling
    IAP for on-premises apps, enabling IAP for App Engine, enabling IAP for GKE, and
    enabling IAP for GCE. In the following example, you will see how Cloud IAP for
    App Engine is enabled and how access policies for your app are added.


    IAP lets you manage access to services hosted on App Engine, GCE, or an HTTPS
    balancer. Perform the following steps to configure IAP for App Engine:


    +   1. Open the menu on the left side of the Google Cloud console.

    2. Click Security.

    3. Select Identity-Aware Proxy. The resources of a project are listed on the Identity-Aware
    Proxy page. If you haven''t already, make sure you''ve configured your OAuth Consent
    screen.

    4. After doing that, come back to the Identity-Aware Proxy page. Follow the steps
    to configure the consent screen:


    +   I. Go to the OAuth consent screen.

    II. Under Support email, select the address that you want to display as a public
    contact. The email address must belong to the currently logged-in user account
    or a Google Group to which the currently logged-in user belongs.'
  merge: -1
  img_proc: true
