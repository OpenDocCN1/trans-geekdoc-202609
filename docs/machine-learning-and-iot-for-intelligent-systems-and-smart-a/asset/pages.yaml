    **FIGURE 1.4** Contourlet Decomposition.


    Laplacian Pyramid captures point discontinuities, and directional filter bank
    connects these point discontinuities and transforms them into linear structure.
    Given the original image is decomposed by laplacian pyramids into various bands
    of frequencies, and where the use of pyramid structure enhances the edge features
    in the image, the low pass band is further sub-sampled to get frequency bands.
    The directional filter bank is used to generate necessary directions required
    from each scale. Contourlets capture contours along geometric smoothness in all
    possible directions, so that contourlet transform performs better in capturing
    the intrinsic geometric features such as edges, curves and contours [25].'
