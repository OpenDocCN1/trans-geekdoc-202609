    # 1.3.1 LOGISTIC REGRESSION


    Logistic regression is a popular algorithm used for modeling classification problems.
    It builds the model by expressing the hyperplane that separates two datasets.
    It estimates the relationship between the dependent and the independent variable.
    The resultant outcome from logistic regression will be always categorical whereas
    in case of linear regression the relation is always described by continuous dependent
    variables. The two types of logistic regression are (i) Binary Classification
    and (ii) Multi class classification. Logistic regression uses sigmoid curve which
    maps the relation between the dependent and the independent variable, and calculates
    the probability that the feature vector represents an object belonging to the
    class.


    +   * Advantages

    * Easy to implement and quite easy to train.

    * Provides good accuracy when dataset is linearly separable.

    * Works fast in classifying unknown records.


    +   * Disadvantages

    * It cannot solve non-linear problems.

    * Predicts only discrete functions.


    # 1.3.2 K-NEAREST NEIGHBOR


    K-NN is a type of supervised machine learning algorithm that works by classifying
    the new data based on a similarity measure. K-NN works for both regression and
    classification problems. K-NN is a non-parametric method and called lazy learning
    algorithm. In K-NN, a new instance is classified by majority votes for its neighbor
    class. The K-NN algorithm is measured by distant functions like Euclidean, Manhattan,
    Minkowski etc. The value of K is always chosen to be odd for making decisions.
    If the value of K is too small, then it will be sensitive to noise points, and
    a larger K includes majority votes from other classes.


    +   * Advantages

    * Simple and intuitive.

    * No training period as it is a lazy learner.


    +   * Disadvantages

    * Does not work with high dimensionality.

    * Large samples are needed for accuracy.'
  merge: -1
  img_proc: true
