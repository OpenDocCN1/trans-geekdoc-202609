  md: '# ## 11.2 LITERATURE REVIEW


    Intelligent Tutoring System is categorized into the following four basic models
    taking from the mechanism based on a wide-ranging agreement in the middle of researcher
    [9]. The models are: Domain representation, Student representation, Tutoring representation,
    and User interface representation. For modeling domain values, the domain model
    is used, and is also called the cognitive model, the mode of specialized knowledge.
    The domain model is designed on the ACT-R theory of education and in this way
    it applies to learning. It attempts to have a clear understanding of the probable
    steps needed to solve a problem [10]. Especially, domain representation consists
    of the concept, regulations, and investigative strategy of the domain which the
    classes are tutoring. They will provide the knowledge of the expert in their tutoring
    English subjects, a benchmark for estimating the student’s presentation or for
    becoming aware of error [11].


    A standard interactive tutoring system (SILS) is introduced taking into consideration
    the student’s study and superimposes resting on the domain model. It is conceptually
    well-crafted, while being an essential component of a SILS that caters to students’
    cognitive and emotional states. And their development of tutoring process is made
    advanced in this domain. At the same time, the students must work gradually from
    beginning to end on their problem-solving procedure [12]. An SILS fits into place
    in an expansion call model tracing. At any time, the instance of students’ models
    deviate from their domain model, this arrangement identify, or streams, avoid
    the error occurrences. Alternatively, the constraint-based online teacher develops
    the student model which represents and superimposes on top of the constraint set
    [13]. The student outcomes or solutions in opposition to the constraint set are
    also recognized, satisfied and dishonored by the constraint-based tutor. If any
    constraint is violated, the attained results of the student’s results are wrong
    [14-16]. In addition, the SILS make available the comment based on errors on those
    constraints. Constraint-based tutor provide feedbacks over errors in addition
    to some optimistic feedback too.


    In view of SILS the fact is the IL technology skills are very essential in education
    process. It increases the expectations for educational institutions, which forces
    students to make the choice of a specific school a priority. The Learning Resource
    Management Programs increase substantially the SILS competence [17]. SILS competency
    combined with the real-time environment has enhanced the classroom teaching. The
    current scenario shows that the world is becoming digitalized. With this development,
    teaching and learning processes also improve day by day based on the digital techniques.
    Also, the implementation of electronic teaching methods improve the students’
    learning abilities [18]. There are many potential benefits in using SILS, particularly,
    in distance education such as benefits of time saving, book free study, easy understanding
    and easy study material access.


    Artificial Neural Network (ANN) is the major branch of Artificial Intelligence
    network system to solve the numerous real-time problems in life. ANN has solved
    important challenges like real estate, finance, healthcare, education, medicine,
    pattern recognition, and many more fields [19]. Because of the multilayer perception
    of ANN, it is able to represent the non-linear function map among input and'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'output. ANN network has been equipped with the powerful yet computationally
    efficient techniques. It is important to determine the correlation between the
    input and output of the model in order to properly utilize ANN [20]. ANN studies
    have been conducted and forecasting of the success of various departments has
    been conclusively demonstrated.


    Because ANN is used to measure student achievement assessments and to track them
    in teaching and learning programs, it is utilized to assist in teaching and learning
    [2]. RNN is effective for forecasting several different types of school admission
    results across various timeframes. The findings show that ANN can increase the
    effectiveness of a school admission system with an accuracy of seventy percentages
    [21]. The use of a multilayer perceptron recurrent neural network (RNN) for back
    propagation learning is implemented in this research. RNN is used in this study
    to calculate the SILS among the students English language skills of the online
    schools.


    # ## 11.3 METHODS AND MATERIALS


    An academic instructor association is required to smooth out the progress of the
    student who might still triumph over the coming to a standstill of his problem-solving
    skills. The student’s abilities can be represented as a manufactured set and by
    exchanging of a few words the object arrangement that is fundamental to problem
    solving can be accomplished. Then, the training given in the problem-solving environment
    must be fulfilled. The system should strive to spread an abstract sense of the
    challenge of resolving knowledge that occupies less memory load, and instant feedback
    on errors made is provided. Adjust the grain size of teaching with tutoring and,
    then, smooth out the progress of successive approximation to the target skill.
    In providing for the nonattendance of face-to-face communication lags, the students’
    tutoring inspiration in the aspects of web-based interactive tutoring system is
    given a push forward.


    For these reasons, and for the proper utilization of the communication stuff,
    the boundary between teacher and student and self-adaptableness of students, as
    well as improve the communication between them, a new web-based standard intelligent
    tutoring system is introduced. Then, in order to strengthen the tutoring motivations
    of students, and based on their results, to perk up teaching priorities, a web-based
    Classiter tool is used. The amazing advancement of artificial intelligence in
    e-learning brings the guarantee of its fulfilling the increasing demand to acquire
    multi-disciplinary, multilingual knowledge and skills to the most. The school’s
    staff and students must put pressure on the academicians to ensure transfer of
    adequate quality knowledge and skills. This research discusses the main components
    of Standard Intelligent Tutoring System (SILS). The system provides faculty members
    with a simple and detailed method for tracking the success of students by browsing
    a range of intelligent systems reports. Figure 11.1 shows the basic intelligent
    tutoring system.'
