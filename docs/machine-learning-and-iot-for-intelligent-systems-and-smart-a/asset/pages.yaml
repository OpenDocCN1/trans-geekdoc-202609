    # ### 2.1 INTRODUCTION


    The essential advantage in using microstrip antennas lies in the fact that they
    possess high power gain and omni-directional radiation patterns that are particularly
    useful in applications such as mobile communications, given mobile services need
    wideband frequency operations and will find these antennas suitable for attaining
    higher accuracy in their services offering. It is a critical design issue to implement
    printed antennas for achieving multiple application level services provided by
    mobile communication applications.'
