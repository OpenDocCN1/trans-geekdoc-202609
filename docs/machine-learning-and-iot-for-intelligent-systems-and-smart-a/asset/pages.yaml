    # ## 6.3 PROPOSED METHODOLOGY


    # ### a. Restricted Boltzmann Machine


    Restricted Boltzmann machine is an improved, organized neural network, which contains
    the network of neurons and where each neuron, while activating, will hold approximately
    random behavior. The RBM consists of visible and hidden layer of neurons [19,20].
    RBM is represented by bipartite graphs, where each neuron in the visible layer
    is interconnected with all the neurons in hidden layer, and there should not be
    any connection between the neurons in visible layer. Likewise, there should not
    be any linking between the neurons in hidden layer. A bidirectional and symmetric
    connection is established among the neurons with same weightage during the training
    and testing phase.


    A graphical portrayal for RBM is shown in Figure 6.3, in which the neurons v0,
    v1, v2, v3 belong to the visible layer and the neurons h0, h1, h2 belong to the
    hidden layer.


    RBM is processed and constructed on an energy function defined by input and hidden
    neurons. The main goal of the learning process in RBM is to reduce the energy
    cost, which means that the overall energy function described by the RBM should
    be minimized.


    Geoffrey [21] has stated that in RBM, the energy function of the units available
    in both visible and hidden layer is distinct as


    ![](img/93c6e2919cb9917d1bdd8f6271e04df4_115_0.png)


    **FIGURE 6.3** Graphical depiction of an RBM.'
