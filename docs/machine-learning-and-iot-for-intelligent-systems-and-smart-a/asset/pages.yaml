    computerized techniques. Bio-sensors, using either electrochemical devices or
    fiber-optics, are used for detecting microorganisms in food, military application
    and clinical work. For example, for detection of candida albicans, an immunosensor
    is used. Again, optical sensor is used to detect bacillus anthracis. In USA, several
    systems have been developed to detect bioweapons; while to detect biological agents
    that cause metabolic damage, polyvalent immunosensor has been developed. Combination
    of neural informational network, electronic nose and laser eyes to detect particle
    densities with alarm has been developed.


