    # ## 2.7 DESIGN OF MSA FOR IOT APPLICATIONS


    Patch dimensions of rectangular microstrip antennas aim to achieve the pattern
    maximum to be normal to the patch. It is a crucial factor to analyze microstrip
    antenna design factors since it operates in narrow bandwidth and also operates
    in close vicinity of resonant frequency. Several research works are performed
    on conventional rectangular slotted microstrip patch antenna and a promising precise
    performance is observed. The proposed work aims to provide the antenna with dual
    resonant frequencies of 2.39 GHZ–3.15 GHZ which can effectively be used IoT applications.
    Researchers also designed and simulated circular-shaped micro-strip patch antenna
    for IoT device, where performance of antenna is analyzed through S1, 1 parameter
    and gain.'
