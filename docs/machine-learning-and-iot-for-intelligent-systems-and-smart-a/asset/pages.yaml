- pgno: 74
  md: '# 3.6 CONCLUSION


    An analytical and design methodology of the Fuzzy tuned Artificial Neural Network
    (FANN) controller for grid connected two stage single phase inverter with LCL-T
    filter has been presented using closed loop operation.


    The performance of inverter was found to be better for fuzzy tuned Artificial
    Neural Network LCL-T designed filter inverter, and it gives better results compared
    to the traditional inverter using PID controller.


    Harmonic distortion in total (THD) for output inverter voltage was about 5%.


    The steady state stability analysis of the proposed system was analyzed using
    state space equations and simulation was done using MATLAB. The controller performance
    was compared with conventional controller (PID). Finally, the simulated results
    showed that the closed loop controller based Fuzzy tuned Artificial Neural Network
    (FANN) yielded better control strategies. A model of single phase 300 W, 50 Hz
    inverter was designed and demonstrated. The harmonics spectrum analysis was presented,
    and the conclusion is that the Fuzzy tuned Artificial Neural Network (FANN) controller
    performance was better under both conditions.


