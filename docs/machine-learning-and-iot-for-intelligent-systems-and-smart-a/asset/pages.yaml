    the WHO states that many vulnerable people have a high chance to catch this virus
    and which can later cause perilous damages [36]. An effective treatment is highly
    in demand to treat this virus. However, the current focus of the researchers is
    to find antivirals or a vaccine. Nevertheless, not a few research studies are
    conducting their studies on analyzing the ultrasound videos of lungs for early
    prediction of COVID-19 infected patients to control the spread of the virus while
    waiting for the pending vaccine treatment.


    This study analyzes the inspiration (inhalation) and expiration (exhalation) patterns
    of lungs to identify the specific changes of COVID-19 infected patients. For this
    analysis, the ultrasound videos of lungs are taken into consideration be- cause
    they can provide many lung movement information that can be taken in with just
    a single glance of the eyes. The motion that happens during breathing will be'
