  md: '# ## 1.3.3 DECISION TREES


    Decision trees are supervised models where we split the data by making decisions
    using a series of conditions to form a tree-like structure. Decision tree classifier
    works for both classification and prediction. A decision tree consists of three
    nodes namely root node, branch node and leaf node. A root node is the initial
    step in the decision tree that can split into maximum branches. Root node features
    are extracted by attribute selection measures. An attribute selection measure
    is repeated till a leaf node is present. The impurity measures of decision tree
    are given by


    $$\text{Entropy} = - \sum_{i=1}^{n} p \bigg( \frac{i}{t} \bigg) \log_2 p \bigg(
    \frac{i}{t} \bigg) \tag{1.17}$$


    $$\text{Gini} = 1 - \sum_{i=1}^{n} p \bigg( \frac{i}{t} \bigg)^2 \tag{1.18}$$


    +   Advantages


    - Nonlinear relationship parameters will not affect performance.

    - Easy to interpret.

    - Need of domain knowledge is not necessary.


    +   Disadvantages


    - Always restricted to one output attribute.

    - Unstable classifier depends on the dataset.

    - It generates a complex tree when the dataset is numeric.


