  md: 'In feature extraction, the features that carry the most important information
    about the image are extracted by various decomposition methods such as wavelet,
    cur-velet, contourlet, shearlet and bendlet.


    # 1.2.1   FOURIER TRANSFORM (FT)


    The fourier transform, which is used to analyze the frequency content of the stationary
    signals, decomposes the signal f(t) into the sum of its sine and cosine components.


    The continuous fourier transform is given by


    ```

    F{f(t)} = ∫_{-∞}^{∞} f(t)e^{-jωt}dt  (1.1)

    ```


    The inverse fourier transform is given by


    ```

    F^{-1}{f(t)} = ∫_{-∞}^{∞} f(t)e^{jωt}dt  (1.2)

    ```


    The discrete fourier transform of the two-dimensional signal is given by


    ```

    F(k, l) = Σ_{i=0}^{M-1} Σ_{j=0}^{N-1} f(i, j)e^{-j2π( ki/M + jl/N )}  (1.3)

    ```


    The inverse fourier transform of two-dimensional signal is given by


    ```

    f(i, j) = 1/MN Σ_{i=0}^{M-1} Σ_{j=0}^{N-1} F(K, l)e^{j2π( ki/M + jl/N )}  (1.4)

    ```


    Where M, N represent variable size and i, j represent continuous variable.


    # Drawbacks


    The Fourier Transform does not provide time information when the signal occurs
    but gives the frequency information that exists in the signal.


    It is not suitable for non-stationary signals.


    # 1.2.2   SHORT TIME FOURIER TRANSFORM (STFT)


    In STFT, the non-stationary signals are analyzed by windowing the signal, i.e
    the signal is divided into segments and each segment is stationary.


    STFT is represented by


    ```

    STFT(t'', f) = ∫ x(t) * w(t - t'''')e^{-jωt}dt  (1.5)

    ```'
