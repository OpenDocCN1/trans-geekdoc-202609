    State space model is a mathematical model of state variables, where output and
    input are related by differential equations. The number of states, outputs, inputs,
    the vector variables, algebraic equations and differential equations are written
    as matrix equations. The time-domain approach (also known as the “state space
    representation”) examine systems with multiple inputs and outputs. The circuit
    contains the number of inductors and capacitors. The state variables signify the
    magnetic and electric fields of the inductors and capacitors, respectively. The
    state equation provides system behavior. The state model gives the time history
    of the state variables.


    ```

    $$\dot{X} = Ax + Bu \tag{3.1}$$

    ```


