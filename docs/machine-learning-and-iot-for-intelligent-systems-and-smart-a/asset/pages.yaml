    # 4.2.2.1 Block Matching Algorithm


    The block matching algorithms were used to evaluate the motion in the frames of
    video sequences. In these algorithms, each frame is divided into groups of neighbouring
    pixels called macroblocks. The overall goal is to locate each macroblock of the
    current frame for a candidate block in reference frame by exploring the displacement
    of motion between the blocks. Each displacement will produce a motion vector of
    a current block in the current frame by considering its position in the reference
    frame. In simple words, this algorithm can search and locate similar macroblocks
    between frames. Various search algorithms were adopted based on the applications
    to fulfil the above task.


    The Adaptive Rood Pattern Search (ARPS) is one of the commonly used block matching
    algorithms [39]. Nie et al. [40] introduced the ARSP as a simple and fastest block-matching
    motion estimation algorithm which has two stages, namely: initial search and refined
    local search. The size of the Adaptive Rood Search (ARS) for each macroblock is
    dynamically determined based on the available motion'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'vectors of neighboring blocks in the first stage. At the same time, a Unit-size
    Rood Pattern (URP) is exploited unrestrctedly and repeatedly until the final macroblock
    is found.


    To befit different motion contents of the video sequence for each macroblock,
    the ARSP will exploit a higher distribution of macro vectors in both horizontal
    and vertical directions, alongwith spatial inter-block correlation. Further, it
    will exploit the adjustable rood-shaped search pattern with a search point indicated
    by the predicted motion vector, which is shown by:


    $\Gamma = Round |\overline{MV_{predicted}}|$ $(4.1)$


    $\Gamma = Round [\sqrt{MV_{predicted}^{2} (x) + MV_{predicted}^{2} (y)}]$ $(4.2)$


    $\Gamma = Max \{|MV_{predicted} (x)|, |MV_{predicted} (y)|\}$ $(4.3)$


    where, $MV_{predicted} (x)$ is horizontal component of Motion Vector (MV), and
    $MV_{predicted} (y)$ is vertical component of the Motion Vector (MV) [40].


    The search speed and quality of the performance will be influenced by the shape
    and size of the search [41]. Through a performance-based study on block matching
    algorithms, Choudhury et al. [39] concluded that ARPS algorithm is more eco- nomic
    and has good prediction quality compared to other search algorithms for motion
    estimation with very low complexity. Therefore, the ARSP is adopted as a block
    matching algorithm in this work.


    # 4.2.2.2 **Region-Wise Edge Factor-Based Motion Vector Extraction**


    The edge factor-based detection is used to identify the non-rigid boundary of
    the object. Edge factor-based detection aims to detect the changes, from the structure
    which could be evaluated by the motion pixels. The region-wise edge factor-based
    motion vectors were extracted to get a deeper understanding of the changes in
    functionalities of the lungs [42,43].


    Due to the virus infection, inspiration and expiration patterns of the lungs will
    be affected. Thus, the region-wise edge factor-based motion vectors were extracted
    using the NRB algorithm to detect the non-rigid structure changes of lungs. The
    frame of the ultrasound video sequence is divided into nine regions. The proposed
    region-wise separation is shown in Figure 4.3.


