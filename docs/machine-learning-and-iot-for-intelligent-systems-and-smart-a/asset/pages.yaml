    # ### 7.4 CONCLUSION


    Edge detector collects crucial edge information in order to protect the image
    imperativer information. Using MICT algorithm, the original image is processed
    and the edge information is coded.


    The final output image is generated by combining the decoded edge information
    with the decompressed image. According to the results, it is established that
    the extended approach provides better results on increasing the compressed sizes
    of the images. When compared to the MICT algorithm, the proposed algorithm improves
    the image fidelity of the reconstructed image.


