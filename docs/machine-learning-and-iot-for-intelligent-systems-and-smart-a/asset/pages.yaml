    # 1.2.3.4 Discrete Shearlet Transform


    Shearlets which is based on multilevel and multi-direction transform are developed
    efficiently to analyze the anisotropic features. The important property of shearlet
    is that it allows optimally sparse approximation for cartoon-like functions. Shearlets
    are constructed by parabolic scaling, shearing, and translation. (Figure 1.5)
    depicts discrete shearlet transform where a shearlet is constructed at first decomposition
    of the image and then localized with direction information to get an optimally
    sparse approximation for the function.


    Shearlet Transform can be written as


    ```

    ST(ψ) = T_t D_α D_S ψ (1.11)

    ```


