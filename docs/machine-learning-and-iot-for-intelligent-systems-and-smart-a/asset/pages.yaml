  md: 'Accuracy is also a major factor to be considered in such design cases. There
    are multiple parameters that decide the performance of the antenna such as patch
    dimensions of microstrip antenna. Fabrication technique used in microstrip antenna
    design is easy and low cost [1,2]. For example, photo etching mechanism is another
    approach of fabrication of microstrip antennas which is commonly termed as patch,
    where various patterns and shapes for patches like square, hexagonal, rectangular,
    trapezoidal etc. are commonly in use. In this chapter, we have proposed an artificial
    neural network (ANN) modeling method for synthesis and analysis of microstrip
    antennas. Thus, an antenna is a radiating device that radiates electromagnetic
    energy in desired directions, where omni-directional; semi-directional and directional
    antennas are used. Antennas are used to redirect the radio frequencies provided
    by the transmitter to the receiver in free space [3]. Antenna is required to cover
    various frequency bandwidths or wide frequency band. It is expected that the antenna
    size should be small and its performance can be affected by changing the geometries
    of mounting devices [4]. Nowadays, demand for low cost antenna can be fulfilled
    by reduced size and compressed architecture for antennas. A microstrip antenna
    has several benefits when compared to supplementary antennas such as low weight,
    low cost, low profile, low scattering cross section, option of underiviating and
    rounded polarization with particular feed and can be simply incorporated for microwave
    circuits [5]. There are numerous procedures for investigation of microstrip antenna
    with some of the popular procedures being transmission line, full wave and cavity.
    The earliest model of microstrip antenna, among all, is the transmission line
    model because of its good physical insight, where the design procedure for this
    antenna assumed this information with dielectric constant of the substrate ($\epsilon_r$),
    resonant frequency (f) and substrate height (h) [6]. A microstrip antenna is well-defined
    according to an array of dual radiating contracted apertures, with height h, width
    w and implanted L distance apart. The antenna design procedure is as follows:
    To find the width of the patch in practical cases for better radiation efficiencies,
    we follow Equation (2.1).


    ```

    w = $\frac{1}{2f\sqrt{\epsilon_{er}\mu_0}}\sqrt{\frac{2}{\epsilon_r+1}}$    (2.1)

    ```


    Here $\epsilon_{el}\mu_0 = \text{c} = 3 \times 10^8$ m/s and f is resonant frequency.


    Effective dielectric constant of antenna for w/h > 1 is given in Equation (2.2).


    ```

    $\epsilon_{reff} = \frac{\epsilon_r+1}{2} + \frac{\epsilon_r-1}{2}\frac{1}{\sqrt{1+12\frac{h}{w}}}$    (2.2)

    ```


    Patch width and length are calculated by Equations (2.3) and (2.4).


    ```

    w'' = $\frac{v_0}{2f_r}\sqrt{\frac{2}{\epsilon_r+1}}$    (2.3)

    ```'
