  md: 'A dictionary learned from training data patches is a standard approach for
    image restoration and k-means clustering. For pattern classification and recognition,
    the DL is also applied [14]. To implement relationship among various, either heterogeneous
    or homogeneous information sources, the multimodal-task driven DL technique is
    applied. A Bayesian approach for learning DD (Discriminative dictionary) was introduced
    in order to build a relationship between the atoms as well as class labels for
    dictionary. The DSC (Discriminative Sparse Coding) technique was proposed for
    increased discriminability with added robust classification. LR DDL (Low rank
    double DL) model was proposed in which one learns a discriminative D from ruined
    data.


    # 5.2.1 SP AND DL


    A secondary dictionary constructing model is implemented for every cluster. An
    entire dictionary is created by combining the training outputs once the secondary
    dictionary is learnt. An image fusion model using GP representation (Group-Sparse)
    is implemented, and DL constructed. A compact DL method is presented for multi
    modal based image fusion. To get the fundamental characteristics of source images
    and retain the hierarchical compositions of inactive wavelet, the sub-bands are
    proposed [12]. This method is not a robust one as it is based on MTA and represents
    various components of input images through only one dictionary. Images generally
    require structures with various spatial morphologies. Huge dictionaries and extra
    added training data are required in order to restructure an improved quality image.


