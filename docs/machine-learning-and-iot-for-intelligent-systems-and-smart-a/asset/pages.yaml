    $s = O_m(E) = \{l_1 \times [\sigma(V_2 \delta (V_1, E))] + l_2 \times \sigma(E)\}
    \times 2 \quad (5.11)$


    Notable improvements in CS block:


    +   - The enduring function of (4) makes use of inputs and the outputs of the
    three-layered network. The complexity faced in the training routine is reduced.

    - The weakening of significant information caused by performing several manipulations
    can be reduced.


    # 5.3.2  ENHANCED EFFECTIVE GENERATIVE ADVERSARIAL NETWORKS


    The SR technique comprises GAN framework and the boosted CS block. This block
    is attached with producer and divider, followed by the fusion function. The Figure
    5.1 depicts the proposed method.


    # 5.3.3  THE PRODUCER AND THE DISCRIMINATOR


    The EDSR technique implemented by Lim et al. was simplified to perform producer
    of GAN model. The novel EDSR has Resblocks and kernels. Then, the boosted CS block
    was appended with the CNN. The discriminator comprises eight convolutional layers
    with kernels. Later, the fusion block merges the extracted features from the least
    3 layers. The discriminator processes the low level frequency details, and the
    unwanted details are subsequently reduced. The classification process is accomplished
    by processing pooling function, convolution constructions and Sigmoid triggering
    function. The following block diagram Figure 5.2 depicts the proposed method.


    # 5.3.4  FUSION SCHEME


    The WNN construction in the image decomposition technique, the learned $\mathrm{SP_c}$,
    is clear. The reformed image done by $\mathrm{SP_c}\mathrm{SP_d}$ is noiseless.
    $\mathrm{LR_c}\mathrm{SP_c}$ are the coefficients with higher norm values which
    correspond to the patches with prominent information.

    The fusion operation for training GAN technique is performed. The loss function
    is used to combine loss (L), comparative opposition loss, sensitivity loss and
    MSEL (Mean Square Error loss).'
