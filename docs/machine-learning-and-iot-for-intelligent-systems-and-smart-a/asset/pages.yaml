  md: 'Where, $\delta$ is the momentum which is used to increase the learning process
    when the contrastive divergence objective function is much steeper and narrow
    and learning rate is represented by $\varepsilon$.


    To obtain the impartial sample data of $\langle v_i h_j \rangle_{data}$ is not
    a tough job, given no direct link among hidden units in RBM. For any arbitrarily
    chosen training data, $v$, the binary state, $h_j$, of each hidden unit, $j$,
    is fixed to probability 1.


    ```

    $$p (h_j = 1|v) = \sigma(B_j + \sum_{i} v_i W_{ij}) \tag{6.10}$$

    ```


    ```

    $$p (v_j = 1|h) = \sigma(W_i + \sum_{j} h_j W_{ij}) \tag{6.11}$$

    ```


    (Geoffrey 2002) presented a quick learning process and subsequently all the binary
    states of the hidden units are calculated concurrently by Equation (6.10). The
    amendment in a weight is provided by Equation (6.12):


    ```

    $$\Delta W_{ij} = \varepsilon(\langle v_i h_j \rangle_{data} - \langle v_i h_j
    \rangle_{recon}) \tag{6.12}$$

    ```


    The learning rule should equal the exchange objective function by the new name:
    contrastive divergence (Geoffrey 2002), and it is characterized by the discrepancy
    between two Kullback-Liebler divergences; by a small disturbance in the objective
    function.


    # ## 6.4 IMPLEMENTATION


    +   a. **The Proposed Methodology**


    Here, the proposed methodology is described with appropriate algorithms and methods.
    The diagrammatic representation of the proposed methodology is given in Figure
    6.4.


    The gathered input data is normalized based on min-max normalization. The normalized
    input data are fed to the RBM to predict the Parkinson’s disease and provides
    the result in two classes: namely, severe and non-severe.


    # ### 6.4.1 DATA COLLECTION


    In this proposed model, Parkinson’s Telemonitoring Voice Data Set is utilized
    based on the UCI Machine Learning Repository. More than 40 patients were sampled
    with parameters like patient number, patient age, patient gender, time intermission
    and voice measures. There are more than 5,000 voice footages of the patients and
    dataset is of CSV format. It has 200 recorded data from each patient.'
