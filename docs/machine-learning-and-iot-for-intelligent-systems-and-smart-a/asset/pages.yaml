    # ### 9.1 INTRODUCTION


    MRI – Magnetic Resonance Imaging – is one of the well-recognized modalities in
    medical imaging applications as it visualizes various abnormalities in the brain
    by exhibiting the soft tissue details. By using the information captured from
    MRI, the'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'computer aided diagnosis system is helping the medical experts in diagnosing
    the abnormalities in the brain and to carry out a treatment accordingly. Brain
    tumor is a condition where the growth of brain cells or tissues is abnormal and
    where brain cells grow in an uncontrolled manner. Based on the scale of malignant
    cells, brain tumor can be categorized as low grade glioma, which in turn includes
    grade 1 and 2; and high grade glioma, with grade 3 and 4. By diagnosing the nature
    of the tumor like grade, size of the malignant cell and the type, a treatment
    will be decided by the medical experts. MRI exhibits contrast of brain tissues
    more effectively than can be done by the modalities like computed tomography.
    Various MRI modalities namely T1, T2, FLAIR, T1-CE are used for brain tumor detection.


    Malignant brain tissues in analogous to the normal brain cells are identified
    by segmenting the brain tumor, and with the results of segmented brain tissues,
    treatment can be planned, given planning is helpful in tracking the advancement
    of the tumor cells. Physical segmentation is an intense task in terms of time
    and complexity of the task as it needs to handle the heterogeneous characteristics
    of the tumor cells. The limitation in segmenting the brain tumor manually is in
    the emergence of the need to carry out the segmentation of brain tumor automatically.
    There are two types of brain tumor segmentation methods [1]. The first is the
    generative model in which information about the manifestation and location of
    the normal-healthy and malignant brain tissue needs to be provided prior to segmentation
    being carried out. Example for generative model is atlas-based models. The second
    type, i.e. discriminative model like machine learning model based SVM and random-forests,
    relies upon prior information to a small scale but where the image features are
    learnt from the annotated trained images to a large scale.


    In the realm of Machine Learning (ML) approaches, techniques like convolutional
    neural networks become more dominantly prevailing in the field of deep learning.
    A variation of CNN which is known as deep convolutional neural network automatically
    extracts the significant features of the images by tuning convolutional and pooling
    layers of the networks. Due to its prevailing nature, CNN is used in a wide range
    of medical applications. Depending upon the size of training data being utilized,
    potential of CNN is decided. CNN starts to over-fit if the size of the data is
    undersized. In this case, classification’s efficacy is improved by utilizing the
    techniques to carry out transfer learning.


    Tasks like segmentation and classification are performed in an excellent fashion
    by feeding the network with multi-convolutional layers to generate better results,
    rather than the manual segmentation and classification using convolutional neural
    network. In recent times, diverse CNN models are being used for segmentation of
    medical images like RestNet, SgeNet and GoogLeNet.


    # 9.2 RELATED WORKS


    Multimodal MRI is the primary and the most significant method for viewing and
    diagnosing the tumor. Once diagnosed, it is critical to formulate the diagnosis
    and chalk out the treatment plan as features like location, scale of growth and
    quantity of the tumor cells need to be determined for the accurate segmentation.
    With the advancement in Computer Vision, it is possible to perform the segmentation
    task'
