- pgno: 7
  md: '# Preface


    This book includes all associated topics to Machine learning, Big data, Internet
    of things and applications in Internet of things. The main objective of this book
    is to fetch numerous innovative studies in Machine learning, Big data and Internet
    of Things. It supports the researchers, engineers and students in several interdisciplinary
    domains to support realistic applications. The book presents an overview of the
    different algorithms by focusing on the advantages, disadvantages and applications
    of each algorithm in the field of Machine learning and IOT. The book provides
    machine learning (ML) techniques to address both intelligence and configurability
    to various IoT devices. The book also reports the challenges and the future directions
    in the IoT and machine learning. This book comes with an energy-efficient cross
    layer model and energy-related routing metric combination to prolong the lifetime
    of low power IoT networks. This book deals with Machine Learning which is subset
    of AI that uses computational statistics to find a mathematical model describing
    Input and Output Data. Machine Learning techniques have been successfully involved
    in a various applications including assistance in medical diagnosis and analyzing
    disease based on clinical and laboratory symptoms with appropriate data to give
    more efficient result for diagnosing disease.


    Though these new skills are prodigious, they result in numerous challenges including
    resource constraints of IoT devices, poor interoperability, heterogeneity of IoT
    system and several privacy and security vulnerabilities. They also expose severe
    IoT security challenges. Further, traditional security approaches against the
    most prominent attacks are insufficient. Therefore, enabling the IoT devices to
    learn and adapt to various threats dynamically and addressing them proactively
    need immediate attention. In this regard, machine learning (ML) techniques are
    employed to address both intelligence and reconfigurability to various IoT devices.


    **Outcome:**


    +   * Apply different AI techniques including machine learning and deep learning

    * Perform supervised and unsupervised machine learning for IoT data

    * Implement distributed processing of IoT data in AI platforms

    * Implementing AI from case studies in Personal IoT and Industrial IoT'
