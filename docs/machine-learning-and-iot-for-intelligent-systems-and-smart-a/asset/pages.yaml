    Nasir et al. [15], who extracted three features namely color, texture and histogram-oriented
    gradients features for melanoma detection, selected the superior features as input
    to SVM classifier for the classification of melanoma images. Rahul et al. [16],
    who discussed a skin cancer classification system in which the pre-processing
    step is carried out by median filtering and enhancement using histogram equalization
    methods, used the residual convolutional neural network as classifier to classify
    the images; but with the drawback that the noise gets enhanced due to enhancement
    in the preprocessing stage. Wavelet based skin cancer classification system developed
    by [17] decomposes the image to give approximate and detailed coefficients which
    are ploughed back into the probabilistic neural network for further classification.
    Another Wavelet based resnet model was used by [18] but it requires large amounts
    of training data to perform better classification than expectation.


    Donoho et al. [19] developed continuous curvelet transform for detecting curves
    in the medical image but the construction of the waveform was not built-in to
    work with a discrete domain directly. While deep neural network-based classification
    was presented by [20] for the classification of melanoma and non-melanoma images,
    the drawback of this method is that only biopsy proven images were considered
    in classification module. Deep learning methods were presented by Goyal et al.
    [21] for lesion segmentation in skin cancers, where the lesion are segmented exactly
    from the dermoscopic images and various metrics such as specificity, sensitivity
    and accuracy calculated to measure the performance of the method.'
