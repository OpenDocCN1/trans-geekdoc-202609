    # ## 6.2 LITERATURE SURVEY


    Recently, there have been many advances in Parkinson''s disease identification
    techniques to detect the disease at an early stage [6,7]. If Parkinson''s disease
    is identified at an early stage, the impact and severity of the disease may be
    reduced. Based on voice data and speech signals, enormous amount of research has
    been made in pre-processing, feature selection, classification, with prediction
    techniques being implemented and developed using artificial intelligence techniques
    [8,9].


    Mamoshina et al. [10] proposed a deep learning technique which involves multiple
    hidden layers to achieve a higher level of abstraction to predict the disease.
    Preprocessing is done first, in order to process the raw data and to achieve the
    quality data. Next, unsupervised deep learning technique is implemented to achieve
    the higher level of abstraction. Finally, supervised learning technique is applied
    to retrieve the final prediction results.


    Indira R. et al. [11] implemented a machine learning technique using speech/voice
    of the person to detect the disease. Fuzzy C-means clustering algorithm in association
    with pattern recognition technique is utilized to identify the person who has
    Parkinson''s disease and who does not have Parkinson''s disease. The experimental
    results achieve 68.04%, 75.34%, and 45.83% for accuracy, sensitivity and specificity,
    respectively.


    Betala E. et al. [12] projected an SVM and k-Nearest Neighbor (k-NN) algorithm
    by recording the voice of one afflicted with Parkinson''s disease. The features
    like age and gender are selected for the experiments. For evaluation purpose,
    the voice recording based on age and gender is taken at three months interval.
    In order to distinguish significant difference in voice during the evaluation
    time, SVM method is utilized to calculate UDRS value.


    A. Tsanas et al. [13] anticipated the speech signal algorithm for nonlinear signal
    method with a huge dataset. The algorithm was implemented in addition with classification
    algorithm, and support visibility of repeated, isolated, less cost, precise UDRS
    tele-monitoring with respect to speech examination.


    A. Sharma et al. [14] planned and executed ANN, pattern recognition and SVM so
    as to help experts to predict the Parkinson''s disease. The results say around
    85% accuracy for predicting the disease from the voice signal of one with Parkinson''s
    disease while comparing with the normal person.


    Shabbakhi et al. [15] offered genetic algorithm and support vector machine for
    categorizing normal people from people with Parkinson''s disease. Based on the
    fourteen main features of the voice signals, the accuracy obtained is 94.50, 93.66
    and 94.22 for 4, 7 and 9 features correspondingly.'
