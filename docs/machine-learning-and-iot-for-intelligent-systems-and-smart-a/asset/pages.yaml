  md: '# 5.1 INTRODUCTION


    In the era of medical tools and advanced diagnostic technology, image fusion is
    a primary and dominant tool. The various wide-ranging modalities like MRI, PET
    and CT are used to obtain images. Each modality has their own pros and cons with
    different purpose in order to scan objects. The information retrieved from a single
    modality image is not sufficient because of its intended use, affected by the
    inadequate spatial resolution and parameters like different scanning time. So,
    this insufficient image information leads to inaccurate detection of disease symptoms;
    in other words, undersized anatomical landmark segmentation and pathologies. Over
    many decades, numerous methods and techniques have been invented to get better
    resolution of source images [1]. The traditional methods like cubic interpolations,
    and its versions, work with an original image which data has to be preserved causing
    sharp edge information of boundaries to fail to achieve better resolution as many
    edges have a gradal. The SR (Super Resolution) reconstruction methodologies were
    introduced and became popular in the field of resolution enhancement where the
    original data might not even exist. The better PSNR (Peak Signal-to-Noise Ratio)
    is done [2] with the single image SR technique, which was proposed by using Random-forest
    model collection approach [3] and the high resolution-from-low resolution images
    were obtained. The Multi-Kernel vector regression-based SR technique was proposed
    specifically for the decomposition of source images. The experimental results
    from the SR technique were still not able to bring back the eminence images even
    though these techniques were considered as effective.


    Image fusion in the medical era of technical tools and advanced technologies has
    become an effective information merging method and numerous techniques were proposed
    in the recent years. The MTA (Multi-scale Analysis) is a popular and commonly
    used method which includes DWT, ST, Curvelet and Contourlet transform (CT) and
    NSCT (Non Sub-sampled CT) [4]. To decompose a source image is to convert it into
    various sub-bands. Then, these divided-by-sub-bands-components are fused together
    based on the fusion technology used. But the entropy of pixels or coefficients
    are not always found and leads to loss of significant information resulting in
    poor image quality.


    Due to superior advancements in the DL arena in medical image processing, some
    of the new SR based approaches and Sparse Representation (SpR) were proposed.
    The SpR based technique discovers the sparse regions from the source images using
    the given dictionary. The target image is obtained by merging the coefficients
    and the dictionary [5]. But in these methods, usually one and only dictionary
    is used to signify various morphological areas of the input images. The suboptimal
    illustration of intrinsic details is the result of these techniques. Even though
    these methods are successfully implemented, still the target images are obtained
    with noise. In order to avoid this issue, de-noising the source image is the initial
    strategy followed by fusion. By implementing this method, the artifacts created
    from de-noising propagate and magnify while performing fusion [6]. This chronological
    method may cause information loss.'
