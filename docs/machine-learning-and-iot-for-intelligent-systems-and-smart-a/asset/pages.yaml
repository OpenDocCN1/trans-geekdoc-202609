    # **6.4.2 DATA PREPROCESSING**


    The dataset is normalized from 0 to 1 with the help of min-max normalization approach.


    Normalized Value of x = $\frac{x - \min(x)}{\max(x) - \min(x)}$  (6.13)


    Here, x is the column value, min(x) represents the minimum value for that column
    and max(x) is the maximum value.


    To provide randomness, input values are shuffled and fed into the training model
    based on lambda function. After, based on the input values, the data and weights
    of each layer are processed in the training model so as to evaluate the function
    efficiently and predict the Parkinson’s disease.


    # **6.4.3 DEEP LEARNING ALGORITHM WITH RBM**


    After completion of data collection and data, the input values are fed to the
    restricted Boltzmann machine.


    The RBM assembled for the proposed methodology is depicted in Figure 6.5. In order
    to perform the summarization process, RBM is employed in two phases namely training
    phase and testing phase. In the training phase, RBM should be'
