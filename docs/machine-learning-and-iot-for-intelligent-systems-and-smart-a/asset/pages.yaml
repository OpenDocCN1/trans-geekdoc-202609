    # 9.5 DISCUSSION


    The proposed model performs the brain tumor detection, segmentation and grading
    by involving the deep learning approaches that used CNN along with UNet, and the
    techniques of transfer learning by using pre-trained convolutional based VGG-19
    network. During the first stage of the network, the input images of MRI brain
    are sliced such that it can be categorized as normal tissue, low grade and high
    grade of the condition glioma. During epoch 6, the hybird network model achieves
    99.8% of accuracy during training, and 96.4% of accuracy during the validation
    of data. During the testing phase, 99.3% of accuracy, 100% of specificity, 97.8%
    of sensitivity and the 0.99 Area Under Curve are obtained. The average dice index
    value obtained by the proposed system is 0.93 for tumor detection, and 0.84 for
    tumor segmentation.'
