    # 1.1 INTRODUCTION


    The incidence of malignant melanoma is in the majority cases fatal and increasing
    worldwide. According to the 2020 Melanoma Skin Cancer Report of the Global Cancer
    Observatory, there were 287,723 cases of melanoma and 1,042,056 of non-melanoma
    cancers recorded globally with a greater number of cases in Australia and the
    United States of America than anywhere else in the world [1]. Gender-wise, men
    are 10% more likely to develop melanoma skin cancer than women and 4% more likely
    to die from melanoma than women. (Figure 1.1) gives a snapshot of growth of skin
    cancer from current to future projected levelsand (Table 1.1) gives projected
    levels of new cases of skin cancer.


    The two major types of skin cancers are Melanoma and Non-Melanoma. Melanoma arises
    from malignant melanocytic cells of the epidermis and this cell produce melanin
    pigment which decides the color of the skin. The malignant melanocytic cells grow
    abnormally and invade other skin cells forming a big mass of cells called the
    tumor. Early detection and treatment profoundly lead to prognosis of the disease.
    With many skin imaging techniques developed in recent years for assisting dermatologists
    to detect the melanoma, some of the techniques are (i) Total Body Photograph [2]
    (ii) Ultrasonography [3] (iii) Epiluminescence Microscopy [4] (iv) Cross Polarization
    Epiluminescence and (v) Optical Coherence Tomography. Dermatologists use noninvasive
    methods [5] like dermoscopic and macroscopic methods to identify melanoma in dermoscopic
    images. Dermoscopy provides better diagnosis as compared to that with the naked
    eye [6,7].


    Based on the deep residual network, the Sultana et al. [8]-developed skin cancer
    classification system by using the regularized fisher platform and the convolutional
    neural network to extract the low discriminative function to classify the melanoma.
    Sonia et al. [9] proposed the non-subsampled contourlet transform to extract features
    using local binary pattern and gray level co-occurrence matrix, but due to high
    dimensionality, it cannot extract texture features effectively. Many approaches
    have been developed to identify melanoma from normal images. Zaquot et al. [10]
    used ABCD techniques to identify melanoma performing median filtering in pre-processing
    and feature extraction by entropy and bifold methods. Ma et al. [11] developed
    skin cancer classification system by extracting ABCDE features that contain both
    shape and color features. Machine learning algorithms like decision tree, K-nearest
    neighbors, and artificial neural networks were used by [12] to compare the performance
    of each algorithm for melanoma classification. Also, melanoma is identified by
    its seven characteristics using the so-called seven-point checklist [13] and its
    three characteristics using the so-called three-point checklist [14].'
