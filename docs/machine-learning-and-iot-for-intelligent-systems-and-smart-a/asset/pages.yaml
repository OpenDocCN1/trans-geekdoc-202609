  md: '# ## 4.1 INTRODUCTION


    An estimated 334 million people who are exposed to viruses in the air may develop
    respiratory diseases that could cause severe damages to the lungs and other organs
    of the respiratory system. The lungs are one of the most critical organs in the
    body that allow the flow of oxygen to our body and the flow out of carbon dioxide
    that keep us healthy and capable of normal work and life. Numerous lung diseases
    may preclude the intake of enough oxygen to the body and may cause severe damages
    to other organs, as well as to the blood circulation. Lung diseases can happen
    due to problems in the airways, lung tissues and the blood vessels. Some lung
    disorders or respiratory failures may have origin from birth, and those diseases
    are called chronic lung diseases [1]. The most common and severe chronic lung
    diseases that occur in the airways are asthma, chronic bronchitis and emphysema.
    These diseases can cause severe damages to the lungs over time. During our breathing,
    the lung tissues and muscles help to expand the lungs like a balloon. However,
    if there is inflammation of the tissues, then the lungs may fail to fully expand,
    and the lungs will have to put in a high effort to deliver the oxygen to the blood
    and expel the carbon dioxide from the body.


    Many other lung syndromes affect the blood vessels in the lungs, such as scarring,
    clotting or inflammation of the blood vessels [2]. The lung circulation diseases
    can cause critical damages to the functionality of the heart and brain that later
    cause death. Many lung diseases are combined with the various disorders of the
    airways, lung tissues and lung circulation. The most common lung diseases are:
    swelling and inflammation of bronchial tubes, Chronic Obstructive Pulmonary Disease
    (COPD), pneumonia, lung cancer, blockages in the arteries, and abnormal fluid
    build ups in the lungs [2]. The detection of these respiratory diseases is widely
    examined by medical video and image analyzing tools. Among many available medical
    examination tools, the ultrasound video analysis plays a crucial role in supplementing
    the varieties of information on lungs’ functional behaviour to detect any present
    respiratory disease. The combination of traditional methods on the lung disease
    diagnostic process and modern technology may have a higher impact by detecting
    the diseases when still in milder stages. Thus, machine learning can be defined
    as the most influential technological approach in the medical field. The varieties
    of machine learning techniques give many opportunities to select the best method
    to assess the best results since they offer significant advantages in health care
    data analytics and evaluation tasks.


    The integration of machine learning algorithms in the healthcare system may deploy
    many flexible and scalable solutions in classifying and predicting different types
    of diseases for early diagnosis such as medical image analysis, video analysis,
    sound analysis or laboratory findings. Manogaran et al. [3] used Orthogonal Gamma
    Distribution with a Machine Learning Approach (OGDMLA) to evaluate the Magnetic
    Resonance Imaging (MRI) images to detect brain tumors. Milani et al. [4] identified
    the normal and abnormal heart sounds using Principal Component Analysis (PCA)
    along with Artificial Neural Networks (ANN), while Cruz et al. [5] applied ANN
    for cancer prediction. Verma et al. [6] introduced the k-Nearest Neighbor (kNN)
    algorithm to identify the kidney stones by analyzing the ultrasound images of
    the kidneys. Roy chowdhury et al. [7] analyzed the fundus images to'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'identify the severity grade for diabetic retinopathy (DR) using Gaussian Mixture
    Model (GMM), Support Vector Machine (SVM), kNN, and AdaBoost. [8] applied Classification
    Tree (CT) machine learning algorithm to predict the increased blood pressure by
    body mass index (BMI). D''Souza et al. [9] applied Decision Tree (DT) and SVM
    machine learning models to differentiate HPV-positive and HPV-negative patients
    by Head and Neck Squamous Cell Carcinoma (HNSCC). Zhang et al. [10] applied Convolutional
    Neural Networks (CNN) to detect lung tumors from the Positron Emission Tomography
