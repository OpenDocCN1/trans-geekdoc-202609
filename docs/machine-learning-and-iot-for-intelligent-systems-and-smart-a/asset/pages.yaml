    \ values.\n7. On comparing with original image and restored pixel values, calculate\
    \ PSNR.\n8. If the PSNR value is about 36 dB, go to step 9. Else, repeat the process\
    \ with the next threshold (Th) to classify relevant coefficients from the remaining\
    \ approximation coefficients.\n9. Build compressed bitstream by arithmetic encoding\
    \ the significant approximation wavelet coefficients.\n10. Decompress the bitstream\
    \ and decode it.\n11. Use IDWT to reassemble the original image.\n\n# ## 7.2.2\
    \ ALGORITHM OF THE PROPOSED DATA REDUCTION METHOD WITH ENHANCED EDGE INFORMATION\n\
    \n+   1. Read the input image.\n2. Extract the original edge pixels.\n3. The edge\
