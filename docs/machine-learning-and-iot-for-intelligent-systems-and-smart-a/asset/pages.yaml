  md: '# 8.2.2 Binary Bioweapon


    To use the form of pathogen, the parts of a two-component system containing innocuous
    parts are mixed. Multiple plasmids that code for virulence or any special characteristics
    contained by many pathogenic bacteria are used to create a bioweapon. The virulence
    of plague, anthrax and other diseases are enhanced by these plasmids and can be
    transferred often across species barrier to different kinds of bacteria [19].
    A virulent plasmid and host bacteria can be produced in required quantity for
    bioweapons.


    # 8.2.3 Gene Therapy as Bioweapon


    Gene therapy is a permanent replacement in genetic composition of any person by
    replacing faulty gene or repairing it. The two classes of gene therapy involve
    somatic cell line (therapeutic) and germ cell line (reproductive). Changes in
    DNA of somatic cell could not be passed onto next generations but only affects
    individual; however, changes in DNA of germ cell would be followed by next generations.
    The first genetically altered primate was produced by the virus of jellyfish gene
    into rhesus monkey egg [20].


    # 8.2.4 Stealth Virus


    A cryptic viral infection which enters the human genome and remains dormant for
    extended time periods is the stealth virus. The triggering of this virus is later
    done by external stimulant. Through this external stimulus, the virus gets activated
    and causes a disease. Herpes virus is carried by many humans which can be activated
    to cause genital lesions or oral lesions. Some people who had chicken pox earlier
    in life carries vericella virus. Segments of DNA (Oncogenes), when triggered,
    can initiate misbehavior and wild cellular growth. Some genes can cause cancer
    [21].


    A stealth virus can infect the genome of the population through a bioweapon and
    can be triggered anytime for a targeted population; or, the government can be
    blackmailed by the threat of its triggering [22].


    # 8.2.5 Hot Swapping Disease


    A zoonotic disease is transmissible to human by a virus in the animal species.
    These viruses have a natural animal reservoir in which they reside and cause no
    damage or very little damage to that animal. However, when transferred to human
    they cause significant disease. Examples of natural animal reservoirs are water
    fowl for eastern equine encephalitis, birds for west line virus, but for ebola
    virus and corona virus, and rodents for hanta virus. HIV virus which is natural
    reservoir for chimpanzee becomes disease in humans as AIDS [23]. The bioweapon
    can contain these viruses taken from animals as hot swapping disease.'
