    \n# **3.1 INTRODUCTION**\n\nThe importance of power generation in an inverter\
    \ connected to the grid tied system used direct interconnection to the grid and\
    \ Renewable Energy System. SE (Sustainable Energy) or Renewable Energy has recently\
    \ gained attention around the world as power generation using these resources\
    \ is environmentally friendly and is of less cost compared to traditional fuels.\
    \ Sustainable energy sources produced high quantities of power and with better\
    \ regulation, given these energy sources can be effectively utilized and can convert\
    \ energy into power which can be connected to the power grid. Power electronics-\
    \ based circuits are needed to execute necessary functions.\n\nThe initial function\
    \ of the converter is by increasing input DC voltage from input side and its conversion\
    \ into AC with constant amplitude ranges. Another function is to produce maximum\
    \ power from PV source materials. Finally, AC voltage and AC current have the\
    \ less Harmonic components which are minimized by using line filters. Given the\
    \ AC voltage and current contains more harmonics due to switching operation, the\
    \ filters reduce the harmonics. The Regulated AC output is given to the grid at\
    \ a constant frequency.\n\nThe controller is used to operate the system as a closed\
    \ loop function. The grid voltage is sensed and monitored by the controller to\
    \ regulate the output voltage and grid voltage. The intelligent controller (Fuzzy\
    \ Tuned Artificial Neural Network) is used for closed loop operation of the two-stage\
    \ inverter system. The proposed inverter performance is analyzed and compared\
    \ with that of the conventional controller.\n\n# **3.2 LITERATURE SURVEY**\n\n\
    Many researchers focus on other energy sources like PV (Photo Voltaic), Fuel Cells,\
    \ Solar and Wind Turbines that are already popular due to the environmental issues\
    \ related with the prevalent use of fossil fuels. Chen et al. [1] used high efficient\
    \ grid based module along with switching technique, Zero Voltage Switching (ZVS).\
    \ The stability analysis of the system with capacitor current closed loop damping\
    \ technique was designed. Hybrid control in the DC-AC stage and average modeling\
    \ was also presented. LLC topology was analyzed and demonstrated with MPPT technique.\
    \ The performance of controller and converter was not presented.\n\nMahesh Kumar\
