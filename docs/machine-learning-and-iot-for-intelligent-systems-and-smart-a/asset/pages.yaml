    SVM are supervised machine learning algorithms that work for both regression and
    classification. SVM works on the principle of decision planes that have decision
    boundaries. SVM are constructed with a hyperplane that has maximum margin. (Figure
    1.8) depicts an SVM hyperplane that classifies data based on maximum margin.


    ![](img/93c6e2919cb9917d1bdd8f6271e04df4_27_0.png)


    FIGURE 1.8 SVM Hyper Plane.'
