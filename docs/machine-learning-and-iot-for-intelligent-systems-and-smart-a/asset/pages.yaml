    # 12.1 INTRODUCTION


    The growing population and urbanization are causing hectic and complicated transportation
    system. The effect of overland transportation can be externalized sometimes, as
    accidents. The past data shows heavy loss of human life due to sudden accidents.
    The structure of road and traffic is increased with a new vehicle every year.
    The new number of vehicles is up to one million every year. The record shows,
    each year, around 1.2 million people have died due to road accidents and around
    50 million have been injured. Therefore, an effective prevention and solution
    system needs to be put in place to minimize or stop road accidents for the benefit
    of human lives. For safety in the road against accidents, prediction can be helpful.
    This prediction is based on data collection. Hence, prediction for an accident
    in the road is considered to be a critical part of the safety program.


    The most effective way to minimize road accidents is the use of a subsidiary discipline
    of artificial intelligence which is called machine learning. The use of machine
    learning technique is boundless. Machine Learning uses different functional methods
    for granting legitimate and reliable decisions with the help of experiences. The
    best part of machine learning is that it can import information from the source
    of data and use this in a statistical method. Thus, creating a machine learning-based
    application can be very effective in predicting road accidents with help from
    data.'
