  md: '# Computational Intelligence in Engineering Problem Solving


    Series Editor: Nilanjan Dey


    Computational Intelligence (CI) can be framed as a heterogeneous domain that harmonized
    and coordinated several technologies, such asprobabilistic reasoning, artificial
    life, multi-agent systems, neuro-computing, fuzzy systems, and evolutionary algorithms.
    Integrating several isciplines, such as Machine Learning (ML), Artificial Intelligence
    (AI), Decision Support Systems (DSS), and Database Management Systems (DBMS) increases
    the CI power and impact in several engineering applications. This book series
    provides a well-standing forum to discuss the characteristics of CI systems in
    engineering. It emphasizes on the development of CI techniques and their role
    as well as the state-of-the- art solutions in different real world engineering
    applications. The book series is proposed for researchers, academics, scientists,
    engineers and professionals who are nvolved in the new techniques of CI. CI techniques
    including artificial fuzzy logic and neural networks are presented for biomedical
    image processing, power systems, and reactor applications.


    # Applied Machine Learning for Smart Data Analysis


    Nilanjan Dey, Sanjeev Wagh, Parkshith N. Mahalle, Mohd. Shafi Pathan


