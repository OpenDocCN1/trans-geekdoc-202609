  md: 'The wavelet transform analyzes a set of scaling coefficients and wavelet coef-
    ficients, respectively. In two dimensional matrices, wavelet transform is applied
    row-wise and, then, column-wise. It creates four different sub-bands namely LL,
    HL, LH and HH. The edge information has to be obtained from the sub-band. To preserve
    edges to achieve a resultant image with a higher content of visual in- formation,
    edge detection is frequently used to extract the edge information [14]. This paper
    shows how to yield image with optimum CR without sacrificing diag- nostic information
    and also with high data level fidelity.


    # 7.2 METHODOLOGY


    The medical images are decomposed into low-frequency and high-frequency components
    using the Daubechies wavelet filter. Because of its high energy com- paction,
    this wavelet is superior in providing high-quality reconstructed images. Using
    one-dimensional wavelet decomposition in the image, the proposed data reduction
    algorithm is developed.


    To get the appropriate coefficient for data reduction, the coefficient must be
    selected by means of thresholding. Data reduction algorithm ought not to have
    a visual quality for clinical images. To remove this bias in images, the output
    metric is used as the quality parameter for data reduction. Original image x(i,
    j) of size M × N pixels is associated with reconstructed image xR(i, j) of size
    M × N pixels to calculate PSNR, as shown in Equation (7.1).


    ```

    PSNR in dB = 10 log10(255²/MSE) (7.1)

    ```


    The study is proposed in order to create images with the highest visual quality.


    To start with we decompose the original image using Daubechies wavelet. DWT is
    determined for a collection of digital filters. On decomposing the image, we obtain
    different frequency sub-bands using wavelet transform.


    To extract high level information, a low pass filter is used, and for detailed
    information, a high pass filter. Filtering the image gives a low pass and a high
    pass image for the row processing, which sub-images are processed by mean-time
    filter by a factor of two at column processing stage to produce four sub-bands:
    LL, LH, HL and HH. In the proposed method, in one-stage decomposition of DWT,
    the sub- band coefficients and detailed coefficients are obtained. Since errors
    are more likely to occur at the edges than in the uniform areas, the original
    edges of the image are retained. In the reconstruction process, the edge information
    of the wavelet trans- form sub-band is given more weightage.


    The wavelet transform is essentially a complication procedure in signal pro- cessing.
    The difficulty in passing an image through a low pass filter is similar to passing
    the image in high pass filter. The vertical edges of the original image are represented
    by the LH sub-band, the horizontal edges by the HL sub-band, and the diagonal
    edges by the HH sub-band.


    An edge image is generated using LH, HH and HL coefficients as follows: The corresponding
    element em,n in the edge image [14] is given by Equation (7.2)'
