- pgno: 130
  md: '$Em,n = \sqrt{V_{mn}^{2} + d_{m,n}^{2} + h_{m,n}^{2}}$ (7.2)


    where V$_{m,n}$ is LH sub-band element, d$_{m,n}$ is HH sub-band element and h$_{m,n}$
    is HL sub-band element.


    E$_{m,n}$ value is calculated for all the sub-band coefficients which leads to
    the formation of sub-band improved edge coefficients along the other side of less-dominant
    smooth area coefficients.


    The decoded edge information replaces the decompressed image edges. Under LL sub-band,
    edge image is stored and the sub-band coefficient of LH, HL and HH are fixed to
    zero when detecting edges. The inverse wavelet transform is used to get the desired
    edge image using sub-band. The original image edge pixels are removed. Edge information
    is used as support information to maintain proper image vision quality.


    The flattened edges of the boundary are shown in the Beizer curve. The morphological
    method to detect the boundary fails in some cases. For the same case, wavelet
    transform technique detects the boundary accurately, thus enhancing the edges
    of the image.


    The edge knowledge is made up of a sequence of zeros with identical values, as
    well as edge pixels. For processing the edge information, the proposed method
    employs run length coding. This is the simplest compression technique available
    for data compression, mainly for long and repeated characters. The edges of the
    images are replaced with decoded edge information in data reduction algorithm
    for obtaining good quality image. As a result, image edges are seen in the output
    image.


    The proposed procedure [15] is mainly focused on the process of original image.
    Original image is decomposed using Daubechies wavelet algorithm.


    Based on the incidence of each coefficient, the threshold is calculated in the
    approximation sub-band. On decomposing the images, threshold approximation coefficient
    is commonly used. The importance of the approximation coefficients is determined
    by comparing them to the determined threshold.


    Instead of considering only the coefficients equal to the threshold as stated
    in the previous algorithm, any of the sub-band approximation coefficients with
    a scale equal to or greater than the threshold is defined as important coefficients.
    This happens so that the dominant coefficient is selected even if its frequency
    of occurrence is less and this avoids creation of false boundaries in the reconstructed
    image.


    So, in the proposed method, the sub-band approximation coefficients are larger
    or equivalent to the threshold coefficients that were selected as important coefficients,
    and the balance approximation coefficients are retained. Pixel values are reconstructed
    using IDWT using the significant approximation coefficients chosen by the above
    procedure. The PSNR is then determined by comparing with original image’s pixel
    information that has been reconstructed.


    If required PSNR is obtained. Then, with the significant approximation sub-band
    coefficients, the image with better visual quality can be obtained. So those coefficients
    can be further processed. If required PSNR is not obtained, the procedure of identification
    of significant coefficients are repeated on remaining approximation'
