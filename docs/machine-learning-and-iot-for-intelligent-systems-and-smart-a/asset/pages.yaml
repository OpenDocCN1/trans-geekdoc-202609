    where, *a* is extracted motion vector value (prior to the measuring growth), *r*
    is growth rate, *x* is number of time intervals that have passed [44].


    Then the PCA is applied to the calculated exponential growth values (y) to reduce
    the input features and identify the most important features that may provide better
    classification results in the classification process. Before applying the PCA,
    the feature matrix is formed as *m* × *n*, where the *m* rows are the lung ultrasound
    video samples, and *n* columns are the calculated exponential growth values. Then
    the PCA of *m* × *n* feature matrix is calculated by:


    ```

    Y = P(X)                                                                                                               (4.5)

    ```


    where, *X* is *m* × *n* feature matrix, *Y* is transformed matrix, and *P* is
    *m* × *n* projection matrix.


    The main advantage of using PCA in this proposed method is its ability to transmit
    the most relevant features in descending order [45]. The first column of the transformed
    matrix (*Y*) consists of the principal components which have the maximal amount
    of variance. Subsequently, the first three (03) principal components are input
    to the supervised classification models at the classification process to achieve
    better classification results.


