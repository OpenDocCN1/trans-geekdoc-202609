    like segmentation and classification are carried out with ease because of which
    the medical experts show interest in adopting those CNN models for processing
    the various medical imaging-related applications, thus, providing high throughput
    and accuracy.


    In medical image processing, exercising Deep Neural Networks, at first, used CNN
    based architecture to carry out the task of pixel-wise classification of electron-microscopy
    neuron images into membrane and non-membrane pixels. But, there are several challenges
    in medical image analysis and segmentation as segmentation exhibits heterogeneity
    in representing the patient data, given the same pathology can exist across patients
    in various manners. In performing segmentation of medical images, the data available
    is a major constraint and to be considered before deciding segmentation method
    to apply. For instance, when size of data is small and even where the available
    data is inconsistent, then segmentation to be done with CNN trained on such data
    is to invite the problem of over-fitting. Irrespective of these shortcomings,
    CNN based techniques perform better in terms of carrying out the task of segmenting
    the medical images with greater accuracy compared with the generative models [2].


    [3] used CNN for MRI brain tumor segmentation, in which the proposed system involves
    two-phase training in order to handle the tumor label imbalance by feeding the
    network with features inclusive of local level and global level. [4] anticipated
    3D CNN model for the segmentation of tumor with 11 layers of learning, namely
    Deep Medic. Pereira et al. implemented the brain tumor segmentation of LGG and
    HGG using two CNN. [5] implemented UNet for segmenting the neuron structures from
    the electron microscopic images.


    [6] proposed fully convolutional architecture where the input to the network is
    a complete image and the volume of semantic segmentation is the result. [7] explored
    the fully convolutional architecture by using VGG model and demonstrated that
    the proposed system provides more accuracy when compared to pixel-based techniques
    with low cost of computation. [8] proposed a system which performed the segmentation
    of multimodal MRI brain images at the volumetric level. [3] segmented the individual
    MRI slices with which the process of segmentation is taken forward towards examining
    the presence of brain tumor. [9] proposed segmentation of tumor in MRI brain by
    combining CNN with other numerical methods.


    [10] implemented pixel-based UNet for performing the segmentation of brain tumor
    in MRI images. [11] achieved segmentation of brain tumor by utilizing fully convolutional
    networks.


    Towards the face of achieving better performance at a higher level during the
    processes such as detecting and segmenting tumor in the brain tissues, where the
    data available is minimal, transfer learning techniques are being used widely.
    [12] demonstrated that CNN learn analogous image features from the trained datasets
    even when the networks differ in terms of tasks and statistics. Despite the benefit
    in using transfer learning in analyzing the medical images, however, the availability
    of datasets for medical images is, in turn, a critical factor. The biomedical
    image datasets greatly vary in size, i.e. large-scale datasets of medical images
    are rare to'
