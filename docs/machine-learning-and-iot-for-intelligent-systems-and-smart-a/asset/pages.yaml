    # **8.2 GENETICALLY ENGINEERED PATHOGEN**


    # **8.2.1 DESIGNER GENES**


    A human molecular blueprint was provided by the human genome project which decoded
    alphabets of life which has complete genome sequence and known for 205 naturally
    occurring plasmids, 599 viruses, one fungus, 31 bacteria, one plant and two animals.
    These blueprints enable a manufacturer of bioweapon to make microorganism more
    harmful and critically life threatening. From the designer genes, the microbiologist
    can develop synthetic virus, synthetic genes or even a new microorganism. Some
    of the bacteria develop resistance to antiviral agents or antibiotics; again,
    identifying antibiotic resistant genes, an organism can be developed which can
    render resistance to antibodies. For example, genes with beta-lactamase codes
    defeat action of penicillin [17].


    Analogous to natural mutation, entire virlines may be created. By swapping out
    variant or synthetic genes or by inducing hybridization of viral straits, a new
    strain of influenza can be created. Altering common virus influenza slightly can
    make it more deadly. It becomes possible to choose the most lethal characteristics,
    as the database of microbial genomes with its part list is available. The entire
    gene could be stitched together with some animal viruses [18] to produce bioweapons.'
