    Here, the RBM is assigned with un-identified input values and known parameter
    values to hidden units. Now, the trained RBM will clearly identify the optimal
    features and provide the accurate prediction class in the testing phase.


    # 6.5 RESULT ANALYSIS


    Result analysis of the proposed methodology is analyzed here. The investigation
    about the projected methodology is carried out giving the step-by-step procedure
    of the methodology. The computed evaluation measures for classification accuracy
    based on total UPDRS score is 98.826% and 84.562% for training dataset and test
    dataset, respectively. While comparing with the existing methodology proposed
    by Nilashi et al. [23] and Srishiti et al. [24], the classification accuracy is
    21.85% for the total UPDRS score. The comparison graph value based on classification
    for total UPDRS score is shown in Figure 6.7.


    The computed evaluation measures for classification accuracy based on motor UPDRS
    score is 90.273% and 86.344% for training dataset and test dataset, respectively.
    While comparing with the existing methodology, the classification accuracy is
    shown to be 21.85%. The comparison graph value based on classification is depicted
    as in Figure 6.8.'
