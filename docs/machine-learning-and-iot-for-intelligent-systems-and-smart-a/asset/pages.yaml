  md: 'Where LOWER, HIGHER is the lower and higher bound of the given input values,
    A is the parameter determined in the learning process which ranges from 0.2 to
    0.5.


    After, the contrastive divergence algorithm is used to find the contrastive divergence
    (CD) value which is computed by data $< v_i , \ h_j> 0$ and reconstructed value
    $<v_i , \ h_j> n$, as shown in Figure 6.6 which is used to update the weight as
    given in Equations (6.16) and (6.17)


    $\mathrm{CD}= < v_i , \ h_j> 0- < v_i , \ h_j> n$ (6.16)


    $W''=W+ \varepsilon * \mathrm{CD}$ (6.17)


    Here $\varepsilon$ is the learning rate which ranges from 0.2 to 0.5, where n
    represents the total number of iterations. Updated weight $\mathrm{W}''$ is sentence
    score for the given feature vector $f v_{i, j}$.


    The steps involved in contrastive divergence algorithm for calculating reconstruction
    value:


    +   * Step 1. Assign input data to the visible neurons $v_{i}$

    * Step 2. Calculate $h_{j}$ for each hidden neuron and obtain the $<v_{i}, h_{j}>
    0$ value.

    * Step 4. Calculate $h_{j}$ using $v_{i}$ from Step 3 and compute $<v_{i}, h_{j}>
    1$ value as shown in Figure 6.4.

    * Step 3. Now compute $v_{i}$ value based on the obtained $h_{j}$ value in Step
    2 which is called reconstruction

    * Step 5. Repeat $n$ times steps 3 and 4 to calculate $<v_{i}, h_{j}> n$.


    The overall algorithm for RBM is given below:


    +   * Step 1. For each input value do:

    * Step 2. Assign matrices value as $\mathrm{CD} \mathrm{i}=0$, $\mathrm{CD}_{j}=0$,
    i.e., weights between visible and hidden layer

    * Step 3. Carry out steps 1 to 5 in the algorithm for calculating the reconstruction
    value.

    * Step 5. Accumulate $\mathrm{CD} \mathrm{j}=\mathrm{CD} \mathrm{j}+<\mathrm{v}_{\mathrm{i}}/
    h_{j}> n$ based on the updated values of hidden layer $h_{j}$

    * Step 6. Calculate average of $\mathrm{CD} \mathrm{i}$ and $\mathrm{CD} \mathrm{j}$'
