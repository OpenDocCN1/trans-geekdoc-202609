  md: 'E(v, h, Θ) = $-$ $\sum_{i=1}^{I} \sum_{j=1}^{J} W_{ij}v_{i}h_{j} - \sum_{i=1}^{I}
    B_{i}v_{i} - \sum_{j=1}^{J} C_{j}h_{j}$ (6.1)


    In Equation (6.1), v represents visible unit, h represents the hidden unit, $\Theta
    = (W, B, C)$ represents the bias value where W interacts symmetrically between
    v and h, W is the weightage that ranges between visible units i inside v in addition
    to hidden units j inside h, B and C is bias value of v and h, respectively, I,
    J are number of units in visible and hidden layers.


    Joint distribution of RBM given by energy function is shown in Equation (6.2)


    p(v, h, Θ) = $\frac{1}{z} e^{-E(v, h, \Theta)}$ (6.2)


    In Equation (6.2), the Z is partition function or normalization factor is shown
    in Equation (6.3)


    $Z = \sum_{v,h} e^{-E(v, h, \Theta)}$ (6.3)


    Visible layer probability, v, is represented in Equation (6.4)


    p(v) = $\frac{1}{Z} \sum_{h} e^{-E(v, h, \Theta)}$ (6.4)


    The derivative of log probability for the training data based on weightage is
    shown in Equation (6.5)


    $\frac{\partial \log p(v)}{\partial W_{ij}} = \langle v_{i}h_{j}\Theta_{j} \rangle_{data}
    - \langle v_{i}h_{j}\Theta_{j} \rangle_{recon}$ (6.5)


    The angle brackets are used to convey the opportunity beneath the distribution
    specified by the consequent subscript, which leads to straightforward learning
    rule to carry out stochastic steepest ascent based on log probability of the training
    data:


    $\Delta W_{ij} = \epsilon_{W_{ij}} (\langle v_{i}h_{j}\Theta_{j} \rangle_{data}
    - \langle v_{i}h_{j}\Theta_{j} \rangle_{recon})$ (6.6)


    $W_{ij} = \delta W_{ij} + \Delta W_{ij} = \delta W_{ij} + \epsilon_{W_{ij}} (\langle
    v_{i}h_{j}\Theta_{j} \rangle_{data} - \langle v_{i}h_{j}\Theta_{j} \rangle_{recon})$
    (6.7)


    Other parameters such as B and C (Equation (6.8) and Equation (6.9) are also calculated
    in the same way.


    $B_{ij} = \delta B_{ij} + \Delta B_{ij} = \delta B_{ij} + \epsilon_{B_{ij}} (\langle
    v_{i}h_{j}\Theta_{j} \rangle_{data} - \langle v_{i}h_{j}\Theta_{j} \rangle_{recon})$
    (6.8)


    $C_{ij} = \delta C_{ij} + \Delta C_{ij} = \delta C_{ij} + \epsilon_{C_{ij}} (\langle
    v_{i}h_{j}\Theta_{j} \rangle_{data} - \langle v_{i}h_{j}\Theta_{j} \rangle_{recon})$
    (6.9)'
