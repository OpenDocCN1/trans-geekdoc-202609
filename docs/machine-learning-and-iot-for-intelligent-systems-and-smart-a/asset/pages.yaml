  md: '# 1.2.3.1 Discrete Wavelet Transform


    The Discrete wavelet transform is obtained by sampling of the continuous wavelet
    transform. It decomposes the image into sub-bands by processing rows and columns
    separately and by down sampling the image by a factor of 2 using FIR filters.
    As a result, four bands namely LL, LH, HL and HH are obtained. LL (approximate
    image) contains low horizontal and low vertical frequency information that has
    been obtained from low pass image. The other three bands LH, HL and HH give detailed
    information of horizontal, vertical and diagonal directions obtained from the
    high pass image. (Figure 1.2) depicts discrete wavelet transform that decomposes
    the image into 2 sub-bands for rows and down-samples each of these sub-bands by
    a factor of 2 to give four sub-bands when processing columns.


    Discrete wavelet transform of 2D image of size M×N is expressed as Approximate
    Coefficients


    ```

    Wϕ(j_0, m, n) = 1/\sqrt{mn} ∑_{x=0}^{m-1} ∑_{y=0}^{n-1} f(x, y)ϕj_0, m, n(x, y)
    (1.8)

    ```


    Detailed Coefficients


    ```

    W^{i}_ψ(j_0, m, n) = 1/\sqrt{mn} ∑_{x=0}^{m-1} ∑_{y=0}^{n-1} f(x, y)ψ^{j_i}_0,
    m, n(x, y) (1.9)

    ```


    Where, i= {H, V, D}


    # Drawbacks


    +   - Wavelet transform can capture frequency content only in limited directions,
    so it has poor directionality.

    - Inefficient for capturing anisotropic features like lines and curves.


    ![](img/93c6e2919cb9917d1bdd8f6271e04df4_20_0.png)


    **FIGURE 1.2** Wavelet Decomposition Filter Bank.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - Many coefficients are needed to capture point singularities.


    # 1.2.3.2 Discrete Curvelet Transform


    Curvelet transform [23] is a multiscale geometric transform that can represent
    edges and curve singularities effectively compared to wavelets. Curvelets can
    represent images in various levels and directions. Generally, curvelets exist
    at all scales, locations, and orientations of curves in the image. Curvelets very
    well capture anisotropic features and obey parabolic scaling law. The parabolic
    scaling law states


    Width = Length²


    The curvelet transform is given by


    C(j, θ, k₁, k₂) = \sum_{\substack{0\le x<M\\0\le y<N}} f(x, y), \Phi_{j,\theta,k_1
    k_2}(x,y) \tag{1.10}


    +   Where,θ = Orientation

    k₁, k₂ = Spatial Location of curvelets

    f(x,y) = Input image having dimension M×N


    Image decomposition in curvelet transform consists of following steps. In the
    first step, the image is decomposed into sub bands by applying wavelet transform.
    Then each sub band is smoothly windowed as squares by parabolic scaling and each
    square is applied with discrete ridgelet transform. The wedges of parabolic shape
    in the fourier plane are obtained by a radial window function and an angular window
    function. The radial window is responsible for image decomposition into scales,
    and the angular window is responsible for orientation and direction. Finally,
    curvelet coefficients are obtained by applying IFFT to all the wedges. (Figure
    1.3) depicts curvelet transform as a combination of parabolic scaling of a sub-band
    into a smooth square window, and discrete ridgelet transform applied on each square
    thereafter.


    # Drawbacks


    +   - Construction is easy in continuous domain and difficult to implement in
    discrete domain.

    - Difficult to sample on the rectangular grid.

    - Curvelet involves rotations and these operators will not preserve digital lattice.


    # 1.2.3.3 Discrete Contourlet Transform


    Do M N et al. [24] proposed a multiscale and multi-direction transform which is
    useful in capturing contours in medical images. The above depiction allows approximate
    images to be gained from coarse to fine resolutions. Discrete curvelet transform
    is constructed by combining Laplacian Pyramid (LP) and Directional Filter Bank
    (DFB) (Figure 1.4).'
