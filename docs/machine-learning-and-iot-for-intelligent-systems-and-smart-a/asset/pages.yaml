    is depicted by the layer’s h and w, whereas, the color channel is represented
    using the layer d (when $d = 1$, the image possesses the gray-scale intensity;
    and it is RGB, when $d = 3$). If the input date vector $x_{ij}$ exists in a location
    (i,j) of a specific layer, then the output vector $y_{ij}$ is calculated by using
    the formula given in Equation (9.1).


    $y_{ij} = \hat{f}_{ks} \left( (x_{ii + \delta_{i,s}+\delta_j^j}, 0 \le \delta_r,
    \; \delta_{jk}) \right)$

    (9.1)


    In Equation (9.1), size of the kernel is given as k, factor of sub-sampling is
    represented as s, $\hat{f}_{ks}$ represents the nature of the layer used.


    For the image segmentation of the biomedical images, UNet architecture is the
    most widely-used fully convolutional network. The name of the architecture is
    implied due to its U shape as it holds two ways. The left side represents the
    layer for contracting, i.e. encoder, and the right side of the U shape represents
    the layer for expanding, i.e. decoder. The output is a feature map/vector in the
    encoder holding the information from the input, whereas, the decoder is the same
    as encoder but it acts in the opposite fashion where it extracts the feature map
    from the expanding layer, thus, providing the exact match as output for the input.
    The number of feature maps is reduced by increasing the input matrix, which is
    the process carried out by the encoder. The process involved in the decoder is
    to minimize the number of feature maps by restoring the matrix to its actual size.
    Thus, the segmentation results are figured out by taking all the pixels of the
    image with the ground truth.


    The UNet model is used to make decisions by transmitting the feature map from
    the subsequent levels of the contracting path, which is analogous to the path
    of expanding, which makes the classifier capable of handling the features at varying
    scales and complexities. Hence, UNet is capable of working on datasets that are
    relatively small in size. Often, more time is spent on execution in the UNet architecture.
    In order to overcome this shortcoming, transfer learning is integrated with UNet
    model. Transfer learning uses pre-trained models to advance the target task learning
    by incorporating the information from the source. Distinct architectural models
    like AlexNet, ZFNet, VGG Net and LeNet are considered as suitable models for developing
    the hybrid approach, along with UNet model. The performance of such hybrid models
    can be improved by using VGG network, where the size of kernel is small with a
    deep convolutional neural network.


    The proposed scheme aims at developing a hybrid model, where the UNet is integrated
    with another model named VGG-19. The aim of this integration is to overcome the
    limitation of UNet, which takes considerable amount of time for execution by reducing
    the layers and the parameters of UNet model. The reason behind the selection of
    VGG-19 network is that it consists of the contracting layer similar to UNet, and
    the parameter count is less than that of UNet. Models of segmentation consist
    of contracting and expanding layer, in general. This is modified in the VGG-19
    network by adding extra expanding layers that hold up-sampling layers, and, at
    the closing stages of VGG-19 network’s convolutional'
