    # 4.4 CONCLUSION


    Many patients are not diagnosed with respiratory diseases at an early stage and
    are unaware of theirs carrying a disease. Due to their lack of awareness, any
    mild lung disease may cause severe damages to the lungs and respiratory system.
    The early prevention of respiratory diseases is needed to decrease their vilest
    versions and reduce the risk to life. The proposed methodology of this study can
    predict the COVID-19 infected patients by lung ultrasound video analysis. Prior
    to the feature analysis, the videos are sent through NRB algorithm to convert
    them as image frames and to extract features. In the NRB algorithm, the changes
    in the pixels of the extracted consequent image frames are examined by Adaptive
    Rood Pattern Search (ARPS) algorithm. Furthermore, the region-wise edge factor-based
    motion vectors are extracted from all the frames. The results achieved by the
    region-wise analysis of extracted motion vectors show that the fourth (04) and
    seventh (07) regions have dynamic variations compared to other regions, which
    means that COVID-19 virus may affect the functionality of all the regions except
    regions four (04) and seven (07). These results are further analyzed using Moving
    Exponential Growth (MEG) statistical function and found that the motion vector
    analysis has a high impact on identifying the functional patterns of COVID-19
    infected lungs from the normal lungs.


    Moreover, the computed MEG values are examined by applying DT, LR, LDA, SVM, kNN
    and RF supervised classifiers and achieved acceptable classification accuracies
    only from SVM, kNN and RF classification models. Results obtained from the DT,
    LR and LDA classification models are not exactly accurate as they provided a very
    low sensitivity and specificity values, especially both DT and LR models have
    zero (0) sensitivity rate. However, the sensitivity of SVM, kNN and RF classification
    models are extremely high. It can be seen from the results, the performance of
    the SVM, kNN and RF classification models are identical. Thus, it can be concluded
    why the NRB algorithm has caused an enormous influence to select the best features
    for the classifiers.


    The achieved classification results can be used to warn COVID-19 infected people
    early on to take the proper precautions to prevent theirs being in danger of a
    severe lung problem. Additionally, this method is fast and convenient to be used
    by any user to predict their lung behaviour. Given ultrasound is a widely used
    cost-effective method in clinical studies to diagnose various diseases, including
    lung damages, however, due to each ultrasound video length, the time span of the
    clarification method proposed in this study may vary. Subsequently, if an ultrasound
    video length is longer, more time will be taken to extract the frames and these
    features. Similarly,'
