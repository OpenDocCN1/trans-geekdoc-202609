  md: '# # 7.1 INTRODUCTION


    The aim of the data reduction method in medical applications is to compress the
    size of the image without losing medically sensitive information. As a result,
    creating an effective compression scheme is a continuing problem in the medical
    industry.


    Coding approaches such as spatial domain technique and transform domain technique
    can all be used to minimize data [1]. A combination of spatial domain procedure
    and coding approaches to work on the image pixels is followed. Image transformations
    are used for pixel decorrelation in the transformation domain technique, and information
    packed coefficients are quantized and coded. The most commonly used transform
    techniques are DCT, Discrete Cosine Transform, and DWT, Discrete Wavelet Transform.
    The most commonly used coding techniques are Huffman coding and Arithmetic coding
    in entropy [2].


    The image is divided into sub-images using the Joint Photographic Experts Group
    (JPEG) compression standard, based on Discrete Cosine Transform (DCT) technique.
    The sub-images are subjected to DCT, and the resulting coefficients are quantized
    and coded [3]. One of the drawbacks of DCT is the creation of blocking artifacts.


    Wavelet transform-based methods have been shown to be superior to DCT-based methods
    in terms of providing high compression rates while preserving reasonable image
    quality [4,5].


    Following the implementation of DWT, a wide range of wavelet-based compression
    methods on the works are carried out. Embedded Zero Tree Wavelet (EZW), which
    uses parent-child dependencies among sub-band coefficients at the sub-band level,
    is one; and Set Partitioning in Hierarchical Trees (SPIHT), which uses self-similarity
    between sub-bands of a wavelet decomposed image, is another; while JPEG2000 algorithm
    [6–8], which uses Embedded Block Coding with Optimized Truncation (EBCOT), is
    a third commonly used approach.


    Initially the researchers mentioned that compression ratio of 9:1 can be restored
    for diagnosis of medical images. The effect will not degrade the visual quality.
    Sone et al. [9] suggest that the compression ratio is accepted for 10:1.


    A combination of without-loss and with-loss techniques based on neural network
    vector quantization and Huffman coding with a compression ratio between 5 and
    10 is evaluated. Chen [10] suggested an algorithm based on the SPIHT algorithm
    for medical image compression. To conduct sub-band decomposition, an 8 x 8 DCT
    method is used. The data is then structured using SPIHT. This is a block-based
    strategy with a higher degree of difficulty. The author demonstrated that certain
    modifications are needed for its application in the medical domain in order to
    eliminate blocking objects [10].


    To search for zero crossing in the second derivative images, and to locate zero
    edges, Laplacian-based edge detection method is used. To identify the second derivative
    and locate the edges, Laplacian detector is chosen. On applying Laplacian of Gaussian,
    the noise is removed by smoothing of edges. But, Laplacian detectors are unable
    to find the edge orientation. To overcome this issue, Canny Detector [11,12] is
    proposed, which is used to detect the edges with high speed and better accuracy
    [13]. Canny edge detector shows decrease in performance for noise-laden images.'
