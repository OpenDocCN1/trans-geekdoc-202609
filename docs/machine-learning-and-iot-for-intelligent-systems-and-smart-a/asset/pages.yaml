    # 2.4 DESIGN & ANALYSIS OF MSA USING ANN


    # 2.4.1 ARTIFICIAL NEURAL NETWORK


    Multilayer Perceptron Neural Networks (MLPNNs) have a vast field of applications
    [21,22]. It follows the back propagation algorithm. Similar to any neural network,
    it also consists of input layer, a hidden layer and the output layer. The inputs
    of hidden layer is assigned from the input layer as $x_j$ [23]. The neurons in
    hidden layer aggregates $x_j$ values and assigns weight to obtain output data
    $y_i$ as shown in Equation (2.7).


    $y_{i}=f(\sum w_{i j} x_{j})$ (2.7)


    Here $f$ notation represents hyperbolic or sigmoid tangent function. Similarly,
    the output layer values are also aggregated.


    ANN works on adjusting the weights of neurons using learning algorithm. Back propagation
    learning algorithm [24] can make the alteration in $w_{i j}(k)$ *between* $i$
    and $j$ as shown in Equation (2.8).


    $\Delta w_{i j}(k)=\alpha \delta_{i} x_{j}+\mu \Delta w_{i j}(k-1)$ (2.8)


    Here $\alpha$ is the learning coefficient, $x_{i}$ is input value, $\mu$ is momentum
    coefficient, and $\delta_{i}$ depends on the position of the neuron $i$ whether
    it is a hidden neuron or an output one [25,26]. Gradient descent algorithm can
    be used to train the NN.


    Artificial Intelligence in the Estimation is shown in Equations (2.9) and (2.10).


    $y_{i}=f(\sum w_{i j} x_{j})$ (2.9)'
