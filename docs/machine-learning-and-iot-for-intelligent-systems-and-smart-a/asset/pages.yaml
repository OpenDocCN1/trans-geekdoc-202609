    # ## 2.2 MACHINE LEARNING IN MSA DESIGN


    It is necessary to develop a method to predict the resonance frequency of an antenna
    and artificial intelligence (AI) may be the advanced approach that is needed.
    AI application is found in several fields starting from communication to industrial
    automation with its promised reduction in costs for the users a reality. We have
    a detailed study of communication networks and services based on AI in [7]. Given,
    nowadays, these techniques in antenna design and optimization have achieved faster
    convergence, ML is a predictive learning based approach which is also a subset
    of AI which predicts outputs from its past experiences. An artificial neural network
    (ANN) in machine learning is an immensely comparable extended processor that has
    the same tendency for storing practical information and creating it accessible
    for usage. It looks like the human mind in two respects: first, information is
    attained by a net over a learning procedure, and two, neuron linking assets are
    identified as synaptic loads that can be used to store the observed knowledge.
    It has been observed that in dynamic era, artificial neural network has exceptional
    contributions and important advancements in the field of wireless communication.
    One can also request continuous target attribute regression. The results agree
