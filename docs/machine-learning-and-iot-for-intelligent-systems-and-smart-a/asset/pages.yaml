  md: '# 9.6 CONCLUSION AND FUTURE WORK


    Automatic brain tumor detection, segmentation and grading are thus implemented
    by using fully convolutional network and transfer learning techniques using VGG-19
    network to the MRI images. The experimental comparison of the proposed system
    with that of the existing techniques helps to identify that the implemented transfer
    learning using VGG-19 network outperforms the existing techniques like CNN, Random
    Forest, etc. The accuracy of the VGG-19 network is improved by deploying future
    fusion technique, thus, increasing the performance of the system. The scope of
    the proposed system shall be extended by including the enhancement of the feature
    map construction by taking into account texture and shape features. Classification
    accuracy can be improved further by adjusting the network’s fully connected and
    dropout layers. Concatenation of features can be improved to give better outcomes.


