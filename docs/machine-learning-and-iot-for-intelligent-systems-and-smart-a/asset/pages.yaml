    # 3.3 PROPOSED SYSTEM


    In the first stage, the PV panel provides DC power supply and it is fed to the
    converter. The converter boosts the PV power which is fed to the single-phase
    full bridge inverter. In the next stage, using inverted gate switching pulse,
    conversion of DC to AC voltage happens. The phase output voltage of inverter is
    coupled with LCL-T filter, as shown in Figure 3.1.


    The switching frequency can control the output voltage as the phase difference
    varies between the inverters. Instantaneous power from PV panel is found by Maximum
    Power Point Tracking Algorithm. (Trabelsi et al. 2011). When PV panel voltage
    is greater than reference voltage, the DC-link regulator output voltage gets increased
    which results in large current flow.


    Figure 3.2 shows inverter fed grid. The resonant converter circuit consists of
    inductance $L_{S1}$, capacitor $C_{P}$ and series inductance $L_{S2}$. $M_{1}$–$M_{4}$
    is switching device'
