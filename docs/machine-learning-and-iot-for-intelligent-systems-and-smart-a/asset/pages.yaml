    # ## 4.2 PROPOSED METHODOLOGY


    The necessary steps of the proposed lung ultrasound video classification methodology
    are shown in Figure 4.1. The input ultrasound videos were collected and preprocessed
    before being divided into training and testing datasets. Then, features were extracted
    from both training and testing datasets. The extracted features were further processed
    before the classification task was accomplished. Finally, the supervised machine
    learning approach was implemented to predict the COVID-19 infected people from
    the normal people.


    # ### 4.2.1 DATA COLLECTION AND PRE-PROCESSING


