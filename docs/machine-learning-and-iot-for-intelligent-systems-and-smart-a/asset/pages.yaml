    # **12.13 TYPES OF VEHICLES INVOLVED IN ROAD ACCIDENTS**


    The accident on national highways, state highways or other roads is high because
    the same road is shared by all, by both motorized vehicle users and pedestrians.
    Almost 73.5% of accidents has occurred on two wheelers, 13.1% has occurred on
    cars, 13.1% has occurred on jeeps and taxis. 6.9% has occurred on buses, 6.3%
    has occurred on auto rickshaws (Figure 12.2).


    To our knowledge, over speeding is the primary cause of road accidents. There
    are some statistics for India which shows that in 2016, 73,896 people died because
    of over speeding. Due to rush, overtaking claimed 9562 people. There are many
    people who “drive under the influence of alcohol”; and this reason claimed 6131
    people. Most people of India are aware of the correct reason of deaths, but there
    are 5705 deaths because of driving on the wrong side of the road. While crossing
    the road from the wrong way or ignoring the red signal, 4055 people died. The
    use of a mobile phone during driving took the life of 2138 people in India. Sickness
    or falling asleep or fatigue has claimed the life of 1796 people in India in 2016.
    Some other incorrect actions of drivers killed 17,943 people. Death because of
    “not wearing helmets” is 10,135. Four wheeler seat belt is a must. Five thousand
    six hundred thirty-eight people have died in a road accident in India just because
    of not wearing seat belts.


