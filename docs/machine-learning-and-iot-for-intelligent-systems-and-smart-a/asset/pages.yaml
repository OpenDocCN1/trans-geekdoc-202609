  md: 'The methods to conduct de-noising and image fusion at the same time might produce
    good results. The concurrent methods proposed for suppressing noise as well as
    retaining significant information were not always dovetailed to give results [7].
    A precise SR method was proposed by CNN based on VGG-net. CNN (Convolutional Neural
    Networks) was introduced first for a single-image SR and invented SRCNN technique.
    For grayscale based medical images, the fundamental composition of SR and CNN
    methods was proposed in [8].


    The Residual NN (ResNet) was introduced for image fusion and 52 layer-recursive
    networks were proposed [4]. In this approach, SR performance was improved by Residual
    NN. The unnecessary models were detached or removed while enlarging model size
    in Residual NN and were shown to have reasonable improvements. The Residual-dense
    block [9] and additionally taken up with results to train much deeper networks
    along with channel consideration. The PSNR performance was successfully achieved
    in this method.


    SR based medical images are still considered as an open challenge even though
    various methods or technologies have been proposed in recent decades. The reconstructions
    of medical images are still not achieved for high up-scaling subject. In this
    proposed method, the image is modeled with low-rank sparse technology and it removes
    noise from the ruined images based on LRSD and DL [10]. To generate LR and Sparse
    dictionaries, alongwith influential classification capability, enforcing LR and
    sparse restrictions over the LR sparse mechanisms is needed. The learned dictionaries
    are formulated for sparse-coding model. Notably, noises are suppressed from the
    source images by improving weighted-nuclear standard on the part of the sparse
    model. The source images are decomposed into low rank and sparse modules, followed
    by the coefficient representations using its corresponding dictionaries being
    obtained. While fusing images, the coefficients of the similar modules from different
    source images are merged by the fusion rule called “max-absolute”. Next, the fused
    or merged LR sparse modules are reconstructed by integrating the coefficients
    and its corresponding dictionaries [11]. The SR technique using GAN framework
    is initiated. The CS block (Compression and Stimulation Block) is increased by
    gaining significant information during decreasing unwanted information. Embedding
    CSB with EDSR is carried out. Finally, a novel fusion loss gains the limitations
    on low features to obtain the SR model.


    The proposed EEGAN based SR methods is applied on four medical image datasets
    using increased CS Block, with the fusion loss and results from comparison with
    other existing models visualized.


    # 5.2 RELATED WORK


    In SpR and LR learning, choosing a dictionary D is mandatory and decisive as the
    functionalities of these kinds of learning methods are highly dependent. Usually,
    D can neither be logically intended nor learned from a training data [12]. The
    curvetails are chosen as a dictionary to find or discover the smooth arcs, boundaries
    and anisotropic compositions. The DCT dictionary is selected to explore the textural
    content as it can signify intermittent structures like texture sparsely [13].
    The logical dictionaries are generally not adaptable and not sufficient to categorize
    natural image dispositions.'
