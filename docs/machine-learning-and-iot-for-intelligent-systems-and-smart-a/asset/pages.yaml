    ```


    From the above stated function, the learned dictionaries are discriminative for
    partitioning the LR from SP modules.


    # 5.3 PROPOSED WORK


    # 5.3.1 DECOMPOSING LR AND SP


    The LR_{D}SP_{D} learned dictionary can partition the input images into corresponding
    LR and SP modules. For the fused target image without any noises, the following
    decomposition technique can be used:


    ```

    $b = (\widehat{SP_{C}}, \widehat{LR_{C}}) $

    $b = \boldsymbol{A}\boldsymbol{M}_{b}\{\|R-\widehat{LR_{D}}-SP_{D}\widehat{SP_{C}}\|^{2}_{G}+P_{3}\|LR_{D}\widehat{LR_{C}}\|_{*}+P_{3}\|LR_{D}\widehat{LR_{C}}\|_{*}+P_{1}\|\widehat{LR_{C}}\|_{l}
    $

    $+P_{2}\|\widehat{SP_{C}}\|_{l}\}$ (5.5)

    ```


    Here, the P_{1}, P_{2} and P_{3} are referred as scalar parameters. $\mathbf{R}=[\mathbf{r}_{1},\mathbf{r}_{2},\dots,\mathbf{r}_{i}]\in\mathbf{T}^{\mathbf{M}\times\mathbf{N}}$
    and $\mathbf{r}_{i}$ is considered as rth vector formed by reconstructing the
    rth patch of the input image. LR_{C}SP_{C} are referred as corresponding coefficients.


