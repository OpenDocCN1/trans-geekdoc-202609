    3. Using Daubechies wavelet, low-frequency and high-frequency components are obtained\
    \ by decomposing the image into approximation sub-band and information sub-band,\
    \ respectively.\n4. Approximation sub-band important coefficients recognition\n\
    \t4.1. Calculate threshold (Th).\n\t4.2. Compare C and threshold, Th.\n\t4.3.\
    \ If coefficient C > = threshold, Th, the coefficient is considered important.\
