  md: 'to shortage of information that is information loss. The WNN (Weighted Nuclear
    Norm) assigns various weights to various solitary values and can solve this issue.
    For noise decomposition, the WNN technique is used as it is considered to be robust
    to the noise. The redefined form is shown below based on WNN:


    ```

    $$b = \mathcal{A}\mathit{M}_b \{ \| Y = LR_{D}\overline{\widehat{LR}_{C}} - SP_{D}\overline{\widehat{SP}_{C}}
    \|^{2}_{G} + P_{3} \| LR_{D}\overline{\widehat{LR}_{C}} \|_{*} + P_{4} \| SP_{D}\overline{\widehat{SP}_{C}}
    \|_{/ , *} + P_{1} \| \overline{\widehat{LR}_{C}} \|_{I} + P_{2} \| \overline{\widehat{SP}_{C}}
    \|_{I} \} \tag{5.6}$$

    ```


    Here, the WNN is defined as $\| \cdot \|_{*,*} \triangleq \sum_{i}\sigma_{i}\omega_{i}(\cdot)$
    and $\sigma_{i}$ is considered as the i$^{\text{th}}$ remarkable data of $\cdot$
    and $\omega_{i}$ which is greater than zero represents the i$^{\text{th}}$ weight
    to $\sigma_{i}$. The parameter $P_{4}$ controls the involvement in the WNN. In
    order to retain the edge details of input image during de-noising, the WNN assigns
    various weights to various particular or remarkable data. While removing noise,
    significant information may smoothen out. The boundary details of an image are
    nothing but sparse modules and fusion techniques can enhance this significant
    information. The boundary details are retained and can be enhanced with the help
    of following method.


    ```

    $$(b) = \mathcal{A}\mathit{M}_{b} \{ \| LR - LR_{D}\overline{\widehat{LR}_{C}}
    - SP_{D}\overline{\widehat{SP}_{C}} \|^{2}_{G} + P_{4} \| SP_{D}\overline{\widehat{SP}_{C}}
    \|_{W,*} + P_{3} \| LR_{D}\overline{\widehat{LR}_{C}} \|_{*} + P_{5} \| SP_{D}\overline{\widehat{SP}_{C}}
    \|_{I} + P_{1} \| \overline{\widehat{LR}_{C}} \|_{I} + P_{2} \| \overline{\widehat{SP}_{C}}
    \|_{I} \} \tag{5.7}$$

    ```


    The primary function of the CS block is to adapt and recalibrate the features
    of source images by forming interdependencies among channels. Initially, the CS
    block compressing feature as follows


    ```

    $$\underline{E}_{d} = \frac{1}{IV} \sum_{I=1}^{I} \sum_{V=1}^{V} y_{d}(t, u) \tag{5.8}$$

    ```


    Where, E$_{d}$ denotes the compressed feature corresponding to the d$^{\text{th}}$
    feature map $y_{d}$, ''I'' denotes height and ''V'' denotes the width of $y_{d}$.
    The compressed features are given as input to a three layered NN. The output dimension
    is same as dimension of the layer. The following expression depicts the actual
    CS block function:


    ```

    $$V_{s} = O(E) = \sigma \left(V_{2}\delta \left(V_{1}, E\right)\right) \tag{5.9}$$

    ```


    Where $V_{s} = [v_{1}, v_{2}, v_{1}, \dots v_{s}]$ represents the scale vector
    of actual feature maps and $O(\cdot)$ denotes the actual activation function.
    $\mathbf{E} = [e_{1}, e_{2}, e_{1} \dots e_{s}]$ represents the feature vector
    of source image. $\sigma$ denotes the sigmoid function and $\delta$ represents
    the ReLU function. $V_{1}$ and $V_{2}$ represent the weight of the source layer
    and destination layer, respectively. The final outcome of CS block is attained
    with:


    ```

    $$\overline{y}_{d} = y_{d} \cdot V_{d} \tag{5.10}$$

    ```'
