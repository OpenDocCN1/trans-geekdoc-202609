    are subject to preprocessing to eject hair and noise etc. which is helpful in
    obtaining an image of very good quality [27,28]. Given the Modified Otsu thresholding
    algorithm is ideal for image segmentation, the various algorithms, for example,
    border irregularity, spread area, axis length, etc. are used for feature classification
    stage; and the extracted features are processed with the intention of classifying
    the image as mole, benign, suspicious or highly suspicious skin lesions [29].
    The following steps are carried out in a diagnosis of melanoma skin cancer:


    +   1.  Acquisition of image lesion.

    2.  Preprocessing of image to reduce noise and various irregularities.

    3.  Segmentation of the lesion area carried from the outer area.

    4.  Extraction features from input image.

    5.  Classification based on the extracted features.


    Feature extraction characterized by identifying specific features or characters
    that are primarily responsible for melanoma detection. Frequently, all skin lesions
    must not have all the ABCD feature (combination of features like e.g. A + B, A
    + C, B + C, A + B + C, etc.) [30,31]. Figure 10.2 block diagram is used to pictorially
    depict the general outline of methodology for melanoma detection.


