  md: '![](img/93c6e2919cb9917d1bdd8f6271e04df4_119_0.png)


    # **FIGURE 6.5** Block diagram of restricted Boltzmann machine.


    trained with the known values. In Second phase, the RBM should be tested for the
    unknown values.


    # **6.4.4** TRAINING PHASE


    The restricted Boltzmann machine is trained to learn from the training dataset
    in the training phase. Based on the energy function, the RBM score is generated
    for all the sentences. According to Yoshua [22], to train the RBM contrastive
    divergence learning algorithm is used.


    Here, $v_{i}$ and $h_{j}$ represent the visible layer neurons and hidden layer
    neurons. The feature vector $f^{v_{i}j}$ is availed as input towards the visible
    layer neurons $v_{i}$. Hidden layer neurons $h_{j}$ is calculated based on (6.14).


    ```

    $h_{j}=F(\sum\left(v_{i}{ }^{*} W_{i j}+\mathrm{N}(0,\right.$ Sigma)) $)$ (6.14)

    ```


    Where $v_{i}$ represents the neurons in the input layer or visible layer, $W_{i
    j}$ represents the weights between the visible and hidden neurons in the matrix
    form of $i$ x j, N(0, sigma) represents the normal distribution to have zero mean
    and unit standard deviation; the non linear function F is represented by Equation
    (6.15).


    ```

    $\mathrm{F}=\mathrm{LOWER}+(\mathrm{HIGHER}-\mathrm{LOWER}) /(1.0+\exp (-\mathrm{A}
    * \mathrm{h}_{j}))$ (6.15)

    ```'
