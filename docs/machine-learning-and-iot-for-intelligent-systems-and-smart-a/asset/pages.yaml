  md: '# Editors’ Biographies


    ![](img/93c6e2919cb9917d1bdd8f6271e04df4_9_0.png)


    Dr. Madhumathy P. is working as a professor at Dayananda Sagar Academy of Technology
    and Management, Bengaluru, Karnataka, India. She completed her engineering from
    Anna University in 2006. M.E (gold med alist) from AVIT in 2009 and Ph.D. from
    Anna University in 2015. With rich experience in teaching for about 14 years,
    her area of interests include Computer Networks, Wireless Communication, Wireless
    sensor Networks, Internet of Things, Wireless Channel Modeling, Mobile Communication
    and topics related to Networks and Wireless Communication domains. Having published
    more than 75 papers in international, national journals and conferences, she is
    a life member in ISTE and senior member from IEEE, and is serving as a reviewer
    for IEEE, IET, Springer, Inderscience and Elsevier journals. She has registered
    and published three Indian patent. Having received a grant for the title “A Complex
    Programmable Logic Device Based Green House Monitoring System for Agriculture”
    from VGST, Govt. of Karnataka, under SMYSR program, she has published a book titled
    “Computer Communication Networks” with ISBN number 978-81-937245-1-4. She has
    acted as publication chair for international IEEE conference held at DSATM, and
    has conducted and coordinated many workshops and FDPs.


    ![](img/93c6e2919cb9917d1bdd8f6271e04df4_9_1.png)


    Dr. M. Vinoth Kumar, obtained his Bachelor’s degree in Computer Science and Engineering
    from Periyar University, Salem, Tamilnadu, India. He obtained his Master’s degree
    in Computer Science and Engineering and his PhD in Computer Science majoring in
    Agent Programming from Anna University, Chennai, Tamilnadu, India. Currently,
    he is an associate professor at the Faculty of Information Science and Engineering,
    Dayananda Sagar Academy of Technology and Management, Bangalore, Karnataka, India.
    His specializations include Artificial Intelligence, Machine learning and Big
    Data Computing. His current research interests are convolutional neural network
    and medical image processing. Having published 45 research papers in reputed national,
    International journals and conferences, he has filed 6 innovative patents and
    1 patent is granted by the Indian patent office. Reviewer and editorial member
    in Indexed national and International Journals, he is the life member of Computer
    Society of India(CSI), Indian Science Congress Association(ISCA) and associate
    member of Institute of Engineers(India), Indian Society of Technical Education(ISTE).'
