    # ## 9.3 PROPOSED SYSTEM


    Image segmentation has achieved significant improvement, in terms of its results,
    by utilizing fully convolutional network (FCN) with the integration of transfer
    learning. Various deep learning techniques like GoogLeNet, RestNet and SegNet
    had been deployed to perform the task of segmentation depending on the nature
    of application [20]. A fully convolutional network is one of the techniques to
    perform semantic segmentation under the deep learning approaches. Fully convolutional
    network can be recognized as an advance technique over the existing CNN. A typical
    CNN comprises of convolution, pooling and finally fully connected layers as its
    essential components. Here, in the FCN, the fully connected layer has been replaced
    by convolutional layer with which the FCN is capable of classifying each'
