- pgno: 200
  md: '# SECTION 17: PENNSYLVANIA ROUTE 414 TO PENNSYLVANIA ROUTE 287

    BLACKWELL TO MORRIS/ANTRIM

    TIOGA STATE FOREST, PRIVATE LAND


    Section 17 begins at Blackwell and ends along PA 287, just west of Antrim, north
    of Morris, and south of Wellsboro.


    Features include Pine Creek, Stony Fork Creek, Wilson Creek and Anna S. Mine''s
    Haunted Vista. Camping is prohibited along the Pine Creek Rail Trail and along
    Stony Fork Creek. Section 17 was opened in 2005 and 2006.


    Caution! This section is underlain by the gas-rich Marcellus Shale formation.
    Interruptions in the footpath are possible due to increasing gas production activity.
    Please check the trail conditions at http://www.hike-mst.org before you hike.
    As of mid-2011 no surface activity is planned on any state land in this section.


    # GENERAL DESCRIPTION


    MST follows Pine Creek upstream from Blackwell at the bottom of Pennsylvania''s
    Grand Canyon on Pine Creek Rail Trail, and then climbs Stone Quarry Run to the
    Canyon''s East Rim. MST traverses the rim it crosses over the top to descend Stony
    Fork. A wet crossing of Stony Fork Creek leads the hiker to ascend Roland Run
    to the broad plateau of Tannery Hill. A descent into Slide Hollow connects to
    a side trail to Morris village. MST gently rises back to the plateau edge to cross
    Rattler Run high up. Trail descends into Basswood Run, rises through rocks to
    the west rim of Wilson Creek, dances over crevices on the very edge of the rim,
    and passes remains of an old coal mine with a panoramic viewpoint before descending
    to Wilson Creek on a narrow gravel road.'
