    Mountain and follows this ridge to Stillhouse Hollow. It then descends

    steply and follows Greens Valley to Big Flat where it turns and de-

    sc to Little Poe Valley. Beyond Poe Valley State Park it follows

    the crest of Little Poe Mountain. After descending to cross Little Poe'
