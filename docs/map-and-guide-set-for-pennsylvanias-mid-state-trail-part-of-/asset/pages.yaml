  md: '# # SECTION 8: PENNSYLVANIA ROUTE 26 TO DETWEILER JUNCTION

    JO HAYS VISTA TO DETWEILER JUNCTION WITH GREENWOOD SPUR OF THE MST AND GREAT EASTERN
    TRAIL IN PENNSYLVANIA ROTHROCK STATE FOREST


    The Jo Hays Vista on PA 26 is 3.2 km uphill from the intersection with PA 45 at
    the flashing traffic signal in Pine Grove Mills. There is ample parking at the
    vista.


    Detweiler junction is reached by descending on the MST .28 km from the switchback
    intersection of Bear Meadows Rd. and gated Detweiler Rd. (sec.8 NB 24.05 km).
    There is limited parking at this location which can be accessed by driving 11.75
    km south on Bear Meadows Rd. from US 322 east of Boalsburg or by driving 3.06
    km north on Bear Meadows Rd. from Stone Creek Rd. just west of Alan Seeger picnic
    area.


    Intermediate access points are Laurel Run, Bear Gap and Bear Meadows roads .This
    section has a fairly good supply of springs and there is primitive camping at
    Beaver Pond and elsewhere in Shaver Creek Valley. Primitive camping is also available
    on Musser Trail, San Spring Loop , Gettysburg trail, and in Detweiler Valley.
    Features of this section are Little Flat Fire Tower, Thickhead Wild Area, Indian
    Wells, and the virgin timber in Detweiler Natural Area.


    This section was opened in 1972 and reached its present alignment ten relocations
    later.


