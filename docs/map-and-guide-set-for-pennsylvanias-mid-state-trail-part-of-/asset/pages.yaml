- pgno: 213
  md: '# SECTION 18: PENNSYLVANIA ROUTE 287 TO US ROUTE 6 MORRIS/ANTRIM TO ROUTE US
    6 TIOGA STATE FOREST, PRIVATE LAND


    Section 18 begins along PA 287, just west of Antrim and north of Morris, and ends
    along US 6.


    Features include several waterfalls, the ghost town of Landrus, and the opportunity
    to see wildlife while passing through relatively open areas on private land. Section
    18 opened north to the end of State Forest in 2007 and 2011, and south to Mudge
    Road in 2009. As of this writing an unblazed gap remains.


    Caution! This section is underlain by the gas-rich Marcellus Shale formation.
    Interruptions in the footpath are possible due to increasing gas production activity.
    Please check the trail conditions on http://www.hike-mst.org before you hike.


    # GENERAL DESCRIPTION


    MST climbs a privately owned mountain on road, trail, and track, and then traverses
    restored mine land and commercial timberland astounding-in wildlife in a narrow,
    rough, sometimes rocky route closed during the high hunting seasons. Entering
    State Forest, MST soon descends the remote valley of Nickel Run, an Exceptional
    Value Wild Trout stream. A short side trail descends to a waterfall on Nickel
    Run and campsites with swimming holes. MST slabs down a boulders mountainside
    to Landrus, an old coal mining village with many intriguing foundations. The path
    ascends Babb Creek through remote forest, changing sides of the main stream in
    the middle of a roadless gap to view two waterfalls on tributaries. Leaving State
    Forest, MST heads north to Hills Creek State Park on the other side of the rural
    farming community of Charleston Township.'
