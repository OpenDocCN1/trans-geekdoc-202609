- pgno: 285
  md: '# SECTION E: JACKSON TRAIL

    PENNSYLVANIA ROUTE 26 TO MID STATE TRAIL

    ROTHROCK STATE FOREST


    The Jackson Trail provides a scenic shortcut for hikers who do not need water
    or a place to camp. The Jackson Trail is very rocky as it follows the crest of
    Tussey Ridge from the Jo Hays Vista on PA 26, 3.2 km above Pine Grove Mills, to
    where the Mid State Trail climbs back out of Shaver Creek Valley. There is no
    intermediate access and there are no springs or streams. The Jackson Trail was
    opened in 1979


    # GENERAL DESCRIPTION


    The Jackson Trial follows the crest of Tussey Ridge northeast from Pennsylvania
    route 26 to a junction with the main trail. There are few changes in elevation
    but the footway is frequently very rocky. There are many views to both sides of
    the ridge, but no springs or streams. Take your time and stop to enjoy the views.


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_285_0.png)'
  merge: -1
  img_proc: true
