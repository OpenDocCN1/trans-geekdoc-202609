- pgno: 23
  md: '# SECTION 1: MARYLAND TO PA 326 2nd CROSSING

    MASON-DIXON LINE TO RAINSBURG GAP

    BUCHANAN STATE FOREST, PRIVATE LAND, SGL 97


    Section 1 follows Tussey Mountain through Buchanan State Forest and small sections
    of private land and State Game Land 97. A relocation in 2009 moved the trail kilometers
    west to align with a realignment of Great Eastern Trail within Maryland’s Green
    Ridge State Forest. A second, smaller relocation moved MST off Martin Hill Road
    into Martin Hill Wild Area. Future relocations are planned in and near Martin
    Hill Wild Area so continue to check www.hike-mst.org for updates.


    The southern end of the section at the Mason-Dixon line can be reached from exit
    56 on I-68, north on Flintstone Creek Road to an all way stop then right on Black
    Valley Road, unnumbered in MD, that becomes PA 326 and MST at the border.


    The northern end of the section, which is partway down the east side of Rainsburg
    Gap is on PA 326 between Rainsburg and Chanesville and can be reached by driving
    south on PA 326 from Bedford. Better parking is in the ATV access trail lot at
    the top of the mountain in Rainsburg Gap, nearly at the south end of Section 2.


    Primitive camping along the trail is possible at a few points within the State
    Forest. Camping is prohibited in the Sweet Root Natural Area, and the brief interludes
    of State Game Land and private land.


    Intermediate access is available from Beans Cove and seasonal forestry roads Martin
    Hill Road and Tower Road. Features of section 1 are Martin Hill Wild Area, Sweet
    Root Natural Area, and Martin Hill itself, the highest point on the Mid State
    Trail. Section 1 was opened in 1994 and significantly relocated in 2009.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# GENERAL DESCRIPTION


    After a short road walk just north of the M-D line MST enters Buchuchanan State
    Forest and climbs Tussey Mountain on Burnt Mills Trail into Martin Hill Wild Area.
    It then turns north on Dickens Trail and new trails eventually following Tussey
    Mountain XC Ski Trail to Beans Cove Gap. Continuing north it climbs to the top
    of Martin Hill and then traverses Sweet Root Natural Area before reaching PA 326
    between Rainsburg and Chaneysville.'
