  md: '# SECTION 14: PENNSYLVANIA ROUTE 150 TO PENNSYLVANIA ROUTE 44

    WEST BRANCH SUSQUEHANNA TO RAMSEY

    TIADAGHTON STATE FOREST


    Section 14 begins on PA 150 across from the Susque Valley Animal Hospital between
    Chatham Run and Charlton. It ends on PA 44 on the outskirts of Ramsey. There is
    limited day parking along PA 44 at this point but do not block access to Pine
    Creek.


    Features of this section are the flagship store in Woolrich (fill pack) and the
    crossing of Pine Creek between Camp Kline and Ramsey on the Pine Creek Rail Trail
    bridge. The only shelters along MST are on this section at Woolrich Park and Bonnell
    Flats.


    There is intermediate access to section 14 on the Gravel Hill, Mill, Big Spring
    and Bull Run roads. Section 14 was opened in 1983 and relocated to the rail trail
    bridge in 2001.


    Caution! This section is underlain by the gas-rich Marcellus Shale formation.
    Interruptions in the footpath are possible due to increasing gas production activity.
    Please check the trail conditions on http://www.hike-mst.org before you hike.


    # GENERAL DESCRIPTION


    The Mid State Trail follows high ground east of Chatham Run to Gravel Hill Road.
    It then follows Park Ave. through Woolrich, passing the flagship store. It crosses
    on open field before escaping to the woods. It climbs the Allegheny Front on private
    land before entering Tiadaghton State Forest. It crosses the historic Coudersport
    Pike at Big Spring and then descends the north ridge of Nepley Fork to Gamble
    Run. It next ascends the Shultz Fork and descends to Pine'
  merge: -1
  img_proc: true
