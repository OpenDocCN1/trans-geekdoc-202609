  md: '# SECTION C: REEDS GAP SPUR

    REEDS GAP STATE PARK TO POE PADDY STATE PARK

    BALD EAGLE STATE FOREST


    The Reeds Gap Spur begins at Reeds Gap State Park and ends at a junction with
    the Mid State Trail in Poe Paddy State Park. Reeds Gap State Park is located in
    New Lancaster Valley east of Milroy and US 322. Poe Paddy State Park is located
    at the junction of Big Poe and Swift Run roads with Poe Paddy Drive in Bald Eagle
    State Forest. This is a long pants and heavy boot trail that goes across the grain
    of the ridge and valley region with a vertical rise of over 940 meters in the
    south to north direction. There is a fair amount of water along this trail but
    it is not evenly distributed. Primitive camping sites are available at Little
    Weikert Run and in Bear Gap (NOT at the picnic area). The Reeds Gap Spur was opened
    in 1985 and is shown on Map 307-310. Check with the Reeds Gap park office for
    overnight parking instructions. (717) 667-3622


    # GENERAL DESCRIPTION


    From Reeds Gap State Park the spur climbs through the gap of the same name on
    its way to the top of Thick Mountain. It follows Thick Mountain east and then
    descends into Treaster Valley by way of Bear Gap Trail. Turning it follows Treaster
    Run before climbing Treaster Mountain. Continuing it climbs over Strongs Mountain
    descends to Weikert Run and then ascends White Mountain along the wild area boundary.
    Next to descends to a crossing of Swift Run and follows the Swift Run Road to
    Poe Paddy State Park.'
  merge: -1
  img_proc: true
