  md: '# NB SB (km) Features/Directions


    17.90 Incline house. Tioga Coal Company built a narrow gauge railroad in 1903
    to here from Rattler Mine 5 km northwest. Coal descended the mountain rim to a
    tipple in Morris to transfer to the Erie Railroad. Management shut the mine in
    1909 by telling the mule drivers to send the other miners home while they packed
    their bags and hurriedly left town. Below the incline house, the unblazed incline
    gets steeper as it descends to private land.


    NB: Drop on switchback to lower side of incline house then gently ascend old narrow
    gauge grade.


    SB: Switchback up to pass around the rim through saplings, crossing and/or following
    several old skid trails, then descend to Slide Hollow.


