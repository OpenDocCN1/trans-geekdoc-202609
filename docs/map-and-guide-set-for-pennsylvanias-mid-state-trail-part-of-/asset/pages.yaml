- pgno: 260
  md: '# SECTION A: GREENWOOD SPUR

    PA 305 TO DETWEILER JUNCTION

    ROTHROCK STATE FOREST


    Greenwood Furnace State Park is on PA 305 between Belleville and McAlevys Fort.
    Detweiler Junction is reached from Bear Meadows Road at the junction with Detweiler
    Road. The orange blazed Standing Stone Trail connecting the Greenwood Spur to
    the Tuscarora Trail near Cowans Gap State Park begins on the south side of PA
    305 across the park office.


    Water is available at several springs along this section as well as at the state
    park. Features of the spur are the historic sites at Greenwood Furnace, Alan Seeger
    Natural Area and Greenwood Fire Tower on top of Broad Mountain.


    There is primitive camping at the Maggi Cutoff and along Detweiler Run but camping
    is prohibited in Alan Seeger NA. Intermediate access to the spur is available
    via Seeger and Stone Creek roads. The Greenwood Spur, the first major side trail
    in the Mid State system, was opened in 1974.


    The Greenwood Spur is part of the Great Eastern Trail connecting the northern
    terminus of the Standing Stone Trail to the Mid State trail. See page 16 of this
    trail guide for more information regarding the Great Eastern Trail or visit the
    website www.hike-sst.org or www.greateasterntrail.org for up-to-date information.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# GENERAL DESCRIPTION


    The yellow blazed Greenwood Spur starts at Broad Mountain Road in Greenwood Furnace
    State Park. It passes several historic sites and some large white pines on a pleasant
    woods trail. Turning north it switchbacks halfway up Broad Mountain on old charcoal
    roads, passing several charcoal flats, and then ascends directly on the Collier
    Trail to the summit and Greenwood Fire Tower where it picks up the Johnson Trail.
    After descending Broad Mountain on switchbacks it passes through a stand of ancient
    hemlocks and thickets of giant rhododendrons in Alan Seeger Natural Area. It then
    follows Detweiler Run partly on the old grade of Monroe Kulp and D. Beidelheimer’s
    narrow gauge railroad and partly on new trail to the northern terminus with the
    orange blazed Mid State Trail at Detweiler Junction.


    When leaving a car overnight at Greenwood Furnace please check in with the park
    office at the junction of PA 305 and Broad Mountain Road. Parking at the northern
    terminus of this spur can be found along Detweiler Run Road, just north of its
    terminus with the orange-blazed Mid State Trail (Detweiler Junction). When parking
    here, do not block the access gate. Parking for day hikes can also be found at
    the picnic areas within Alan Seeger Natural Area.'
  merge: -1
  img_proc: true
