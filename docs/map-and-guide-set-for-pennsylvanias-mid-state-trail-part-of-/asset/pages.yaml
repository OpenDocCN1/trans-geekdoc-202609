- pgno: 176
  md: '# SECTION 15: PENNSYLVANIA ROUTE 44 TO STATE ROUTE 4001


    # WEST BRANCH TO LITTLE PINE TIADAGHTON STATE FOREST


    The southern trail head for Section 15 is on PA 44 at the state forest boundary
    at the east edge of Ramsey. PA 44 can best be reached from the interchange on
    US 220 just west of Jersey Shore. The trail head is about 12.1 km north of US
    220. There is limited parking on the south side of PA 44. NO PARKING in downtown
    Ramsey. Do not block access to Pine Creek. The northern trail head is on SR 4001
    at Little Pine State Park. There is plenty of parking at the park check but in
    with the park office or contact station (570-753-6000). Little Pine State Park
    has both family camping and a group camping area. SR 4001 is the paved road along
    Little Pine Creek from Waterville on PA 44 to English Center on PA 287. The trail
    head is about 6.4 km north of Waterville.


    This section has a fair supply of springs and streams and there are primitive
    camping sites along Ramsey Run and at Parker Hollow. Intermediate access is available
    from Ramsey Road and Dam Run Road. Section 15 was opened in 1983 and the south
    end was relocated in 2001.


    Caution! This section is underlain by the gas-rich Marcellus Shale formation.
    Interruptions in the footpath are possible due to increasing gas production activity.
    Please check the trail conditions on http://www.hike-mst.org before you hike.


    # GENERAL DESCRIPTION


    The Mid State Trail switchbacks up the extremely steep slope of Houselander Mountain
    to the top of the plateau. It dips into Dry Hollow'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'and then descends the Second Fork of Ramsey Run. It regains the plateau by
    following Ramsey Run. It descends very steeply to Dam Run and then follows a Civilian
    Conservation Corps trail to Little Pine State Park.


