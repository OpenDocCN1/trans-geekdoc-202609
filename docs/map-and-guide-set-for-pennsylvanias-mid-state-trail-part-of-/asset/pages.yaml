  md: Pine Creek. After descending the northwest corner of Round Top it follows roads,
    most of them paved, on the crossing of the West Branch Valley. The West Branch
    itself is crossed on a road bridge. Three historic sites, Fort Horn (1777), a
    Delaware Indian Village and ruins of the Pennsylvania Canal are passed on the
    valley crossing.
