  md: '# SECTION 19: US ROUTE 6 TO PENNSYLVANIA ROUTE

    287

    WHITNEYVILLE TO HAMMOND

    PRIVATE LAND, HILLS CREEK STATE PARK, STATE

    GAME LAND 37, TIOGA-HAMMOND LAKES


    Section 19 begins at US 6 and ends at the second crossing of PA 287.


    Features include pastoral countryside, glacial remnants, a wetland and

    a lake. Section 19 was opened from Hills Creek State Park to Ives Run

    Recreation Area in 2003, and extended south to US 6 in 2008 and

    2009.


    Caution! This section is underlain by the gas-rich Marcellus Shale for-

    m-ation. Interruptions in the footpath are possible due to increasing

    gas production activity. Please check the trail conditions on http://

    www.hike-mst.org before you hike.


    # GENERAL DESCRIPTION


    MST winds through rolling farmland to Hills Creek State Park, cross-

    over the dam and alongside the lake. From the north end of Hills

    Creek Lake MST climbs a ridge of glacial drift and crosses the State

    Park campground. A short connecting stretch of township roads leads

    to SGL 37 where MST ascends a ridgeline leading to the high plateau,

    descends the headwaters of Stephen Run, ascends a higher point

    non the plateau, then descends the east fork and main stem of Ives Run

    to Hammond Lake. MST ascends through abandoned farmland across

    PA 287.'
