- pgno: 7
  md: '# INTRODUCTION


    The Mid State Trail (MST) is an old fashioned wilderness foot path across Pennsylvania
    from Bedford County in the south to Tioga County. Features of the MST are its
    many views and side trails, its sense of isolation and remoteness, and its use
    of metric measure. Unique features are the tunnel under Paddy Mountain and a portion
    of the Greatland Indian Path near Ravensburg State Park. The latter is believed
    to be one of two or three bits of unaved Indian paths on public lands in Penn
    Woods. The Burnt Cabins to Franktown Path is crossed in SGL 118.


    The Mid State Trail Association (MSTA) is an organization of trail overseers and
    others formed in 1982 and dedicated to the completion, maintenance, and preservation
    of the Mid State Trail System.


    Most of the Mid State Trail is on public lands including State Forests, State
    Game Lands and State Parks. The MST links or traverses state game lands, two scout
    camps, four state wild areas, three state forest picnic areas, five state forests,
    eight state parks, ten state forest natural areas, the Woolrich factory outlet
    store and a token roadside rest. On State Game Lands, all users of the trail should
    be aware of the Game Lands regulations posted at each Game Landing area and on
    www.pgc.state.pa.us. All non-hunters must wear fluorescent orange between November
    15th and December 15th. Wearing orange is strongly recommended from Columbus Day
    weekend to the end of the year, and especially during spring gobbler season from
    the last weekend of April through the week before Memorial Day.


    # PRIVATE LAND


    Some parts of MST, especially those closer to the Maryland and New York borders,
    cross private land.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Although the voluntary, willing permission MSTA has secured individual and
    corporate landowners takes various forms, common rules for hiking MST across private
    land are:


    +   - Stay on trail. Leash your dog (not exceeding 2 m) and clean up any waste
    left behind.

    - Do not use any vehicles, ATV''s, horses, or bikes (all of which the owner probably
    uses himself to be very careful you''re not talking to the owner if you confront
    a rider, he pays the taxes and the mortgage and you don''t).

    - Respect owners'' property and privacy (a similar trail was closed when hikers
    set up a picnic lunch on the front lawn of the owners'' house, and refused to
    move when the owner asked them to).

    - Don''t pick up anything or leave anything behind (this goes for all trails,
    but especially on private land where one indiscretion can result in the trail
    being closed forever).

    - No camping (exception: as of the date of publication, camping for one night
    only is allowed at two locations noted in this Guide on Wool-rich, Inc. Property,
    and one location on section 18 in Tioga County, ONLY).

    - No fires.

    - No alcohol, and certainly no illegal substances.

    - If the blazes and signs disagree with the Guide andor maps, follow the blazes
    and posted instructions!

    - Stay off private land during posted hunting season closures: closures are noted
    where possible in this Guide.

    - Even when not closed, strongly consider avoiding private land during spring
    and fall turkey seasons, and fall/winter deer and bear seasons.

    - No hunting (that''s for you, the owners'' cousins probably hunt it.


    The Golden Rule: Be courteous of the rights of private landowners-just as you
    would expect an uninvited guest on your own property to behave.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Finally, if you do not intend to follow all of these rules while passing through
    private land on the MST, please hike another trail so that polite, quiet hikers
    can continue to enjoy in peaceful perpetuity of the diversity of features along
    MST''s private land sections.


    # FOOT PATH ONLY


    The main trail and side trails are described in both northbound and southbound
    directions in a table format. The trail description is separated into twenty sections
    divided by paved roads or highways (expecting the division between secs. 8 and
    9). Crossings of roads that can be navigated by an ordinary car at sometime in
    the year are noted as intermediate access points. The MST is still a rugged and
    demanding trail.


    In Rothrock State Forest the MST consists largely of ridge top trail built since
    1969 by the Hiking Division of the Penn State Outing Club and other groups. East
    of Stillhouse Hollow in Bald Eagle, Tiadhton, and Tioga State Forests the MST
    follows many old trails linked with lengths of new trail. Other groups which have
    helped build the MST include convict laborers from Huntington State Prison, Standing
    Stone Garden Club trail crews, CETA, Girl Scouts, Youth Conservation Corps, Boy
    Scouts, adjudicated juveniles, community service workers, PSU Faculty Women''s
    Club Hiking Interest Group, Bucknell University Outing Club, Susquehanna University
    Outing Club, Asaph Trail Club, as well as volunteers of the Keystone Association
    and of course the Mid State Trail Association.


    The Mid State Trail was designed, built, and is maintained for foot travel only.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# MARKING


    The main trail is paint blazed with orange rectangles of 5 cm by 15 cm. Blazed
    side trails are marked with blue or yellow rectangles of the same size. A double
    blaze, one above the other, warns of an approaching turn. If a large enough tree
    is available the upper blaze may be offset in the direction of the turn. Trail
    signs have been installed at many trail junctions and road crossings.


    # RELOCATIONS AND EXTENSIONS


    The Green Mountain Club of Vermont has a saying: “You never get a trail in the
    right place on the first try.” We did a little better than this but we still didn''t
    get 100%. You can access the most up-to-date information concerning relocations
    and trail extensions on the Mid State Trail website, http://www.hike-mst.org.


    # MID STATE TRAIL PATCH AND MISCELLANEOUS


    A Mid State Trail patch is available from:

    Mid State Trail Association

    P.O. Box 885

    Huntingdon, PA 16652

    http://www.hike-mst.org


    Scouts hiking the MST for the 80 km (50 mile) award should contact the Mid State
    Trail Association at the above address with respect to their conservation work.


    The hiker is on his own and must assume his own liability, realizing the difficulties
    and possible dangers involved. Anyone hiking the MST does so at his or her own
    risk.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# WATER


    The ridge route of much the MST means springs and streams are few and far between.
    It is frequently necessary to find water on side trails both marked and unmarked.
    In many cases these junctions have been signed but distances and directions to
    the water supply are given only in this guide. "Reliable" is used here to mean
    a water source that does not dry up in August and September. Probably none of
    these springs or streams could pass the presumptive tests of public health departments.
    Giardia is known to be present in several water sources near the MST. MST springs
    are certified only to contain a substantial proportion of dihydrogen monooxide
    when flowing (H$_2$O).


    Water that presumably does meets is available from pumps or faucets at Stone Valley,
    Penn Roosevelt, Greenwood Furnace, Poe Valley, Poe Paddy, R.B. Winter, Ravensburg,
    Camp Kline, Little Pine, Black-well Canoe Access, Hills Creek, Ives Run, Tioga
    Heritage, and Cow-anesque. But only in season. The fastest method to purify water
    for drinking is a submicron filter of which there is a bewildering variety available.
    Boiling water in the field to purify it is recommended only by those who haven''t
    tried it.


    Hikers are strongly urged to carry one or more canteens, water bottles, hydration
    bladders, or a water bag on the MST.


    # CAMPING


    State park camping is available at Greenwood Furnace, Penn Roosevelt, Poe Valley,
    Reeds Gap, Poe Paddy, R.B. Winter, Ravensburg, Little Pine, and Hills Creek at
    the prevailing state park fees and only in season. Other public campgrounds at
    prevailing fees are at Ives Run at Hammond Lake, and Tompkins both operated by
    US Army Corps of Engineers. Tioga Heritage private campground is'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'directly on MST near Tioga. Group camping areas are available at Poe Paddy,
    Little Pine, and Hills Creek must be reserved in advance. Primitive or backpack
    camping (still free) is permitted elsewhere in the state forest (following published
    PA-DCNR primitive camping guidelines) except within sight of roads, and where
    posted or noted in this guide or on the MST maps, but prohibited in Natural Areas
    and State Game Lands. Boundaries of the natural areas are shown on MST maps but
    are generally not marked on the ground. The better primitive camp sites are identified
    in the guide. Check with the relevant state office to see if camping permits are
    required. As of the writing of this guide per 17 Pa. Code 21.61, they are not
    required for one night stands.


    Primitive camp sites are operated strictly on a pack in, pack it out basis. It
    you packed that bottle, can or aluminum foil in full, you can certainly pack it
    out empty. If you find trash at a camp site or along the trail, please try and
    find room for it in your pack or pockets. Become familiar with and practice “Leave
    no Trace” principles.


    At primitive camp sites, dispose of dishwasher and wash water at least 70 m (200
    feet) from the nearest stream or spring. Somebody else downstream may be depending
    on the same stream for drinking water. Fecal matter must be buried in the top
    15 cm (6 in) of soil and at least 100 m (300 feet) from the nearest water supply.
    Do not camp within sight (70 m) of any road.


    # CAMP FIRES


    A few years ago ,when classes were finished at Penn State University, students
    hit the trail to decompress from the pressures of finals and the academic year.
    When it got dark they set up camp where they were along the trail and they lit
    campfires. The weather was dry and two of these got away that night. One fire
    started in Pine'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Swamp and burned uphill over Tussey Mountain. This fire did minimal damage
    along the main trail in the valley but at the ridgetop where it crossed the Jackson
    Trail it killed just about everything.


    The other fire was on Fourth Mountain between Fleet Foot and North Meadows Trails.
    The chestnut oaks were killed but some pines survived. The burn area is in no
    hurry to come back to trees and has become a large patch of huckleberry and Mountain
    Laurel. Fleet Foot Trail has vanished in the brush which encroaches on the main
    trail as well. Keeping Fourth Mountain open is another challenge as brush grows
    fast in the open sunlight. Bears are attracted to the berry patch.


    Neither of these fires should have happened. Open fires at primitive camp sites
    are prohibited during periods of high fire danger. These dates are March 1st to
    May 25th and October 1st to December 1st. At other times use common sense in building
    ground fires. Try to find a spot that has been used before. Close in your camp
    fire with rocks, remove all flammable material from the immediate area and keep
    your fire small. Don’t leave your fire unattended, not even for a couple of minutes.
    An unexpected gust of wind could take it completely out of your control by the
    time you get back to camp. Make sure by pouring water on it that camp fire is
    completely out before you break camp. The Mid State Trail Association urges you
    to use a backpacking stove (Optimus, Primus, Svea, MSR, etc.) as they present
    a minimal fire hazard. If campfires are built on the top of narrow ridges they
    can be seen for great distances. When these fires are reported forestry has to
    check them out on the ground. Please refrain from building fires in such locations.
    It makes a lot of extra work for forestry and doesn''t earn us any friends.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The Mid State has had other fires as well, such as those on Little Poe Mountain,
    South White Deer Mountain, and Ramsey, but these fires were not caused by hikers.
    Please be very careful with fire.


    # USING THE COLOR MSTA MAPS


    Each of the color maps currently issued by MSTA is based on the Universal Transverse
    Mercator (UTM) grid, North American Datum (NAD) 1983, at 1:50,000 scale, except
    for blown-up areas in insets (such as the Tussey Mountain Urban Forest Interface
    near State College on Map 307-310). This means that moving 1 centimeter on the
    basic map is equivalent to moving 500 meters on the ground. This is roughly half
    the scale used by USGS 7.5 minute topographic maps (which are 1:24,000) but it
    is the same scale used on Canadian topographic maps. If you can find one, Natural
    Resources Canada gives away a little plastic scale that is very handy for reading
    distance kilometers directly from 1:50,000 scale maps.


    The grid lines on the map are spaced every 1000 meters and each is labeled with
    a two digit number. This two digit number is the thousands and ten-thousands of
    meters in the UTM coordinate system. In order to locate yourself globally you
    also need the hundred-thousand and the million place – these are the smaller numbers
    that appear once per edge of each map panel. Finally you need the UTM Zone designation
    – that inconspicuous bit of information is emplaced in the legend of the MSTA
    color map sheet. Most of Pennsylvania and sections 7 through 20 of MST is in Zone
    18, however western PA hence southern-most MST sections 1 through 6 is in Zone
    17.


    Here is an example. Let''s say someone tells you to meet them at UTM Zone 18 NAD
    1983, Northing 4511833, Easting 258024, near Beaver Pond in Huntington County.
    Think of these numbers as 45 11833 and 2 58024 respectively. If you''re looking
    at the correct panel on Map'
  merge: -1
  img_proc: true
- pgno: 15
  md: '370-310 the “45” and the “2” are shown once each edge in tiny type. So if you
    look 833 meters north of the “11” line and 24 meters east of the “58” line you
    should find the campsite.


    If you are navigating using a Global Positioning System (GPS) device, you can
    probably set it to read your position directly in UTM. If you do this sure the
    units of length are not any other units, and that the datum is NAD 1983 not, say,
    NAD 1927.


    If you are navigating using a compass after the batteries in your GPS unit go
    dead, you should have prepared first by finding out your magnetic declination
    relative to the UTM grid moves every year and no magnetic declination is shown
    on the MSTA maps. Remember the MSTA map north is not true but UTM grid north –
    hence you need to add the local grid and the magnetic declination to find the
    declination you will use for your hike. The UTM grid should you have read to this
    point not knowing what “declination” is, consult any standard reference or the
    Internet to learn map and compass use.


    Topographic contour lines at 50 or 25 meter intervals relate to mean sea level
    are shown on the maps. Reading contour line topographic maps is an art that can
    be easily learned from numerous sources. When you compare MSTA maps to other topographic
    maps, be aware that 50 meters is a much greater interval than most other maps
    you will see. In other words, when the contour lines get close together on an
    MSTA map, the terrain is truly steep – but if the contour lines are far apart,
    that doesn’t mean the terrain is flat.


    Color shading on the maps represents different land ownership – each land owner
    has different rules as stated elsewhere in the Guide. Light green on the MSTA
    maps does NOT represent what it does on a USGS topographic map. A light green
    color on the MSTA map'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'represents State Forest Land, which may or may not be wooded. Light yellow
    represents Game Lands where camping is not allowed – again, these tracts may or
    not be wooded. White areas on the map typically represent private lands -- again,
    these may or not be wooded. Other colors may appear as included in the legend
    to each map. The land ownership shown on the maps is derived from various sources
    but is not accurate as a survey. If in doubt, look closely for land owner-boundaries.
    In PA along MST, public land boundaries are typically marked by white blotches
    on trees. State Game Land boundaries are typically better marked as State Forests.


    # ELEVATION PROFILES


    This edition of the trail guide is the first to include elevation profiles for
    each section of the trail. These profiles are displayed in a horizontal orientation
    on the the page immediately following the general description of the section.
    Using these profiles will help in visualizing the difficulty of hiking this particular
    section of the trail by visually representing the elevation changes found along
    the trail. The vertical exaggeration for these profiles is 5:1. This means that
    for every meter plotted on the x-axis (distance), a corresponding meter on the
    y-axis (elevation) is plotted at five meters. This vertical exaggeration is constant
    on all elevation profiles for each section.


    One additional note regarding the elevation profiles: you may notice a discrepancy
    between the distances displayed on the elevation profiles versus listed in the
    guide text. The distances on the elevation profiles will seem to be shorter. This
    is because the elevation profiles are generated from GPS data whereas the guide
    text indicate the distance measured on the trail using a surveyor''s wheel. Distances
    calculated using a GPS are typically shorter because they do not take into account
    changes in elevation and also because of the interpretation that place between
    data points. Always refer to the distance reported in the'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'guide text as the more accurate data when quoting distance on the Mid State
    Trail.


    # TRAIL OVERSEERS


    Routine maintenance of the Mid State Trail is performed by volunteer overseers.
    Their tasks include removing blowdowns, cutting back encroaching brush, improving
    the footway and repainting the blazes. An individual overseer is assigned a section
    about 3 km long but organization may be assigned that a longer section of trail.
    The overseer system is responsible for the generally good condition of the Mid
    State Trail. An overseer is expected to make a minimum of three trips per year
    over his or her section. Individual overseers’ efforts are currently coordinated
    by volunteer Regional Managers based in the areas of Everett, State College, Woolrich,
    and Tioga. The “Manual for Maintenance of Mid State Trail” and the “DCNR Trail
    Marking Guidelines” are posted to the MSTA web site.


    As with any group of volunteers there is a high turnover and sections become available
    when overseers move away from the area. The extensions have created many opportunities
    for new overseers. Some overseers come all the way from Pittsburgh, Philadelphia,
    and even Virginia to help maintain the Mid State Trail while others live within
    walking distance. If you would like to adopt a section of the MST, visit the Mid
    State Trail Association website at www.hike-mst.org for more information.


    # GREAT EASTERN TRAIL


    Mid State Trail is part of the Great Eastern Trail (GET) network of footpaths.
    The Great Eastern Trail provides a premier hiking experience on a series of existing
    trails that are becoming linked to each other into a long-distance footpath in
    the Appalachian Mountains stretching'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'ultimately from Alabama to the Finger Lakes Trail in New York.


    In southern Pennsylvania and Maryland, the Great Eastern Trail divides into an
    east route and a west route.


    GET''s west route from the Potomac River traverses the Chesapeake & Ohio Canal
    National Historic Park to near Little Orleans, MD whence it passes through Maryland''s
    Green Ridge State Forest to a junction with MST at the Mason-Dixon Line. GET''s
    west route continues on MST to Detweiler Run in Huntington County.


    The east route uses Tuscarora Trail north from Hancock, MD to a junction with
    Standing Stone Trail near Cowans Gap State Park in Fulton County, PA; hence north
    to Greenwood Furnace State Park where it follows MST''s Greenwood spur north to
    Detweiler Run Natural Area.


    Great Eastern Trail follows MST exclusively through northcentral Pennsylvania
    to the New York border where it meets Crystal Hills Trail, a branch of NY''s Finger
    Lakes Trail crossing eastern Steuben County.


    Mid State Trail Association is a participating member of Great Eastern Trail Association.
    For more information about GET, check out www.greateasterntrail.net.


    # METRICATION


    The MST was the first hiking trail in the United States to use metric measure.
    The second edition of the guide (1973) was completely metric. Metrication is a
    patriotic measure designed to help end our cultural isolation and ease our chronic
    balance of payments problems. All trail distances, with the exception of a few
    side trails, have been measured'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'with a Rolata measuring wheel of two meter circumference, or by GPS when wheel
    data are not available. Side trails measured with a homemade wheel are only given
    to 0.1 km. By pure serendipity the initials of the Mid State Trail taken from
    state planning maps of the late ''60s also stand for the Metric System Trail.


    # USE OF THE MAIL DROP & FOOD STORES


    The MST is so long that it would be extremely difficult to carry enough food to
    hike the entire trail without any resupply. There are several small post offices,
    grocery stores, park offices and other facilities within hiking range of the MST.
    A mail drop of nonishable food should be addressed to:


    Your Name

    c/o General Delivery

    Post Office Name, PA Zip Code


    and marked:

    HOLD FOR MID STATE TRAIL HIKER


    Allow plenty of time for your mail drop to arrive before you do. It wouldn''t
    hurt to write or call the postmaster involved ahead of time. REMEMBER: POST OFFICES
    ARE CLOSED ON SUNDAYS AND FREQUENTLY ON SATURDAYS AS WELL. AS OF 2012, MANY RURAL
    POST OFFICES HAVE REDUCED THEIR HOURS TO AS LITTLE AS 30 MINUTES PER DAY. Please
    give a park office advance notice if you are going to send them a food drop. Park
    offices are generally open on weekends in summer. Even if a park office is closed
    you can wait for the park ranger to show up and retrieve your package. Please
    visit www.hike-mst.org for a comprehensive and up-to-date list of mail drops,
    food stores, and other services along the Mid State Trail.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# HANDICAPPED ACCESS


    Most of the Mid State Trail is an old fashioned wilderness footpath but there
    is one section suited for wheelchair access. This is the Penn Creek Path from
    near Poe Paddy State Park to Cherry Run. This is a former railroad grade and the
    bridge over Penn Creek has been decked and a smooth stairway built through the
    tunnel under Paddy Mountain. It parallels Penn Creek for 4 km with repeated views
    of this trout stream. Penn Creek Path is closed to all motor vehicles but is open
    to horses and bikes. Since it is short and flat it is of little interest to mountain
    bikes and is used mostly by family types. Many horses refuse to cross the old
    railroad bridge when blindfolded so horse use is minimal. Section 6, the Lower
    Trail, is entirely suitable for wheelchair access. Also, the Moccassin Trail/MST
    on the north shore of Cowanesque Lake, just south of the NY border, is suitable
    for backcountry wheelchairs for 6 km.


    # ADVERSE CONDITIONS AND TRAIL DAMAGE


    On the trail if you encounter horses, bikes, ATVs or industrial disruptions such
    as a pipeline crossing the path, a gas company representative, even just horse
    tracks or dung, on the trail report the incident to the applicable volunteer Regional
    Manager. Contact information is available on the MSTA web site: www.hike-mst.org.
    You may also use on the Trail Damage or Illegal Incursion Report Form from the
    Keystone Trails Association web site: www.kta-hike.org. Do not confront the possible
    illegal user or other individual, as are likely better armed than you, or may
    be the landowner, or both. Please report the situation to the volunteer Regional
    Manager. Please wait a couple of days at least for our volunteers to investigate
    the situation before spewing about the situation on your favorite web forum.'
  merge: -1
  img_proc: true
