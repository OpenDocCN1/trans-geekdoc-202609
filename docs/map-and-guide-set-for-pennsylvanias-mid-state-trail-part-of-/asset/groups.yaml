    # 导言


    中州足迹（MST）是一条穿越宾夕法尼亚州的、从贝德福县到纽约州的古老徒步路径。MST 的特点是其许多景观和支线、其隔绝感和偏远感，以及其独特特征如 Paddy
    Mountain 下的隧道以及位于 Ravensburg 公园附近的 Burnt Cabins 路径118。


    在 Rothrock 国家森林内，中州足迹主要由 1969 年以来由宾夕法尼亚州户外俱乐部徒步部门和其他团体建造的脊线步道组成。Stillhouse Hollow
    以东，跨越 Bald Eagle、Tiadhton 和 Tioga 国家森林，中州足迹遵循了许多古径，并连接了若干段新步道。其他帮助建造 MST 的团体包括亨敦州监狱的囚犯劳工、Standing
    Stone 花园步道队、CETA、女童军、青年保护队、男童军、受审青少年、社区服务人员、PSU Faculty妇女俱乐部徒步兴趣小组、Bucknell 大学户外俱乐部、Susquehanna
    大学户外俱乐部、Asaph 步道俱乐部，以及 Keystone Association 的志愿者，当然还有中州足迹协会的志愿者。


    中州足迹协会（MSTA）是一个成立于 1982 年的步道维护者和其他组织，致力于完成、维护和保护中州足迹系统。


    # 私有土地


    MST 的部分区域（特别是靠近马里兰州和纽约边界的部分）穿越了私人土地。虽然这些是自愿的，但 MST 的共同规则如下：


    - 留在步道上。牵好你的狗并清理任何垃圾。

    - 不要使用任何车辆、ATV、马匹或自行车。

    - 尊重所有者的财产和隐私。

    - 不要捡走任何东西或留下任何东西。

    - 禁止露营（本指南中提到的两个地点除外）。

    - 禁止生火。

    - 禁止饮酒，更严禁毒品。

    - 如果步道标记和标志与指南不符，请遵循标记和现场指示！

    - 在关闭期间不要进入私人土地：指南中尽可能注明了关闭情况。

    - 即使未关闭，强烈建议在春秋两季避开私人土地。

    - 禁止狩猎。


    黄金法则：尊重私人土地所有者的权利，就像你希望不请自来的客在你土地上表现一样。


    最后，如果你不打算在穿越 MST 私有土地时遵守上述所有规则，请选择其他步道，以便礼貌、安静的徒步者能够永久地享受 MST 多样化的特征。


    # 仅限足径


    主道和支线均以表格形式描述了北向和南向的方向。步道描述分为二十个部分，由铺设道路或公路划分（除第 8 部分和第 9 部分之间）。普通汽车全年可以通过的道路交叉口标记为中间接入点。MST
    仍然是一条崎岖且具有挑战性的步道。


    中州足迹的设计、建造和维护仅供步行使用。


    '
