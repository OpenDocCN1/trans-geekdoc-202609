    # SECTION 11: PENNSYLVANIA ROUTE 45 TO PENNSYYL-

    ANIA ROUTE 192

    HAIRY JOHN''S TO R. B. WINTER

    BALD EAGLE STATE FOREST


    R. B. Winter State Park is just east of the Centre-Union County line on PA 192.
    It is 27 km west of Lewisburg. Check in with the park office for overnight parking
    at R. B. Winter (570) 966-1455.


    Hairy John''s picnic area is midway between Woodward and Laurelton Village on
    PA 45. Overnight parking at Hairy John''s is not recommended.


    Primitive camping along the trail is available near Buffalo and Pine Creeks, Panther
    Run and in Brush Hollow. Camping is prohibited in the Hook Natural Area to the
    east of Kessler Trail between Pine Creek and Negro Hollow Roads. Principle feature
    of section 11 is the Hook Natural Area, largest in the state.


    There is intermediate access on Stony Run, Pine Creek and Stover Gap Roads.


    # GENERAL DESCRIPTION


    The trail climbs Winkelblech Mountain and then turns east crossing Sheesley Run
    and climbing over Buffalo Mountain. It then descends Sharpback Mountain, crosses
    Pine Creek and climbs Buck Ridge. It continues across the grain of the country
    by climbing over Shriner Mountain. It then turns east through Brush Hollow, which
    it follows all the way to PA 192 and Rapid Run. This section is entirely within
    Bald Eagle State Forest.'
