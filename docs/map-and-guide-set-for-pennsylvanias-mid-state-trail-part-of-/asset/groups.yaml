    # 第 15 段：宾夕法尼亚 44 号路到州道 4001 号

    # 西支到 LITTLE PINE TIADAGHTON 州立森林


    第 15 段的南侧起点位于 Ramsey 东侧州森林边界的 PA 44 路。到达 PA 44 的最佳路线是从 Jersey Shore 西侧的 US 220
    号交汇处出发。起点位于 US 220 以北约12.1 公里处。PA 44 南侧停车位有限。Ramsey 中心禁止停车。不要阻塞前往松溪的通道。北方起点位于
    Little Pine 州立公园（Little Pine State Park）的 SR 4001 路。公园内有充足停车位，请向公园办公室或联系站登记（570-753-6000）。Little
    Pine 州立公园有家庭营地和团体营地区。SR 4001 是沿 PA 44 上的 Waterville 到 PA 287 上的 English Center
    的铺装路。起点位于 Waterville 以北约6.4 公里处。


    此段有足够的泉水和溪流，Ramsey Run 沿线 Parker Hollow 有原始营地。可以通过 Ramsey Road 和 Dam Run Road
    进入中间区域。第 15 段于 1983 年开放，南端于 2001 年重新定位。


    警告！此路段位于富气的马塞勒斯页岩（Marcellus Shale）地层。由于天然气生产活动增加，步径可能会中断。请在徒步前通过 http://www.hike-mst.org
    查看路况。


    # 总体描述


    中州步径沿着 Houselander Mountain 陡峭的山坡 U 型弯爬到高原顶部。它进入了 Dry Hollow


