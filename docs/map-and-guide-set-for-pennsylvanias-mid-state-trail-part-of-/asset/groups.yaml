  - '[PAGE 7]


    # INTRODUCTION


    The Mid State Trail (MST) is an old fashioned wilderness foot path across Pennsylvania
    from Bedford County in the south to Tioga County. Features of the MST are its
    many views and side trails, its sense of isolation and remoteness, and its use
    of metric measure. Unique features are the tunnel under Paddy Mountain and a portion
    of the Greatland Indian Path near Ravensburg State Park. The latter is believed
    to be one of two or three bits of unaved Indian paths on public lands in Penn
    Woods. The Burnt Cabins to Franktown Path is crossed in SGL 118.


    The Mid State Trail Association (MSTA) is an organization of trail overseers and
    others formed in 1982 and dedicated to the completion, maintenance, and preservation
    of the Mid State Trail System.


    Most of the Mid State Trail is on public lands including State Forests, State
    Game Lands and State Parks. The MST links or traverses state game lands, two scout
    camps, four state wild areas, three state forest picnic areas, five state forests,
    eight state parks, ten state forest natural areas, the Woolrich factory outlet
    store and a token roadside rest. On State Game Lands, all users of the trail should
    be aware of the Game Lands regulations posted at each Game Landing area and on
    www.pgc.state.pa.us. All non-hunters must wear fluorescent orange between November
    15th and December 15th. Wearing orange is strongly recommended from Columbus Day
    weekend to the end of the year, and especially during spring gobbler season from
    the last weekend of April through the week before Memorial Day.


    # PRIVATE LAND


    Some parts of MST, especially those closer to the Maryland and New York borders,
    cross private land.'
  - '[PAGE 8]


    Although the voluntary, willing permission MSTA has secured individual and corporate
    landowners takes various forms, common rules for hiking MST across private land
    are:


    +   - Stay on trail. Leash your dog (not exceeding 2 m) and clean up any waste
    left behind.

    - Do not use any vehicles, ATV''s, horses, or bikes (all of which the owner probably
    uses himself to be very careful you''re not talking to the owner if you confront
    a rider, he pays the taxes and the mortgage and you don''t).

    - Respect owners'' property and privacy (a similar trail was closed when hikers
    set up a picnic lunch on the front lawn of the owners'' house, and refused to
    move when the owner asked them to).

    - Don''t pick up anything or leave anything behind (this goes for all trails,
    but especially on private land where one indiscretion can result in the trail
    being closed forever).

    - No camping (exception: as of the date of publication, camping for one night
    only is allowed at two locations noted in this Guide on Wool-rich, Inc. Property,
    and one location on section 18 in Tioga County, ONLY).

    - No fires.

    - No alcohol, and certainly no illegal substances.

    - If the blazes and signs disagree with the Guide andor maps, follow the blazes
    and posted instructions!

    - Stay off private land during posted hunting season closures: closures are noted
    where possible in this Guide.

    - Even when not closed, strongly consider avoiding private land during spring
    and fall turkey seasons, and fall/winter deer and bear seasons.

    - No hunting (that''s for you, the owners'' cousins probably hunt it.


    The Golden Rule: Be courteous of the rights of private landowners-just as you
    would expect an uninvited guest on your own property to behave.'
  - '[PAGE 9]


    Finally, if you do not intend to follow all of these rules while passing through
    private land on the MST, please hike another trail so that polite, quiet hikers
    can continue to enjoy in peaceful perpetuity of the diversity of features along
    MST''s private land sections.


    # FOOT PATH ONLY


    The main trail and side trails are described in both northbound and southbound
    directions in a table format. The trail description is separated into twenty sections
    divided by paved roads or highways (expecting the division between secs. 8 and
    9). Crossings of roads that can be navigated by an ordinary car at sometime in
    the year are noted as intermediate access points. The MST is still a rugged and
    demanding trail.


    In Rothrock State Forest the MST consists largely of ridge top trail built since
    1969 by the Hiking Division of the Penn State Outing Club and other groups. East
    of Stillhouse Hollow in Bald Eagle, Tiadhton, and Tioga State Forests the MST
    follows many old trails linked with lengths of new trail. Other groups which have
    helped build the MST include convict laborers from Huntington State Prison, Standing
    Stone Garden Club trail crews, CETA, Girl Scouts, Youth Conservation Corps, Boy
    Scouts, adjudicated juveniles, community service workers, PSU Faculty Women''s
    Club Hiking Interest Group, Bucknell University Outing Club, Susquehanna University
    Outing Club, Asaph Trail Club, as well as volunteers of the Keystone Association
    and of course the Mid State Trail Association.


    The Mid State Trail was designed, built, and is maintained for foot travel only.'
