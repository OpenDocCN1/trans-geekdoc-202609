    | NB (km) | 特征/方向 | SB (km) | |

    | :--- | :--- | :--- | :--- |

    | 10.42 | 跨过溪流。NB：重新回到旧木栈道。 | SB：向右边缘，沿着上方与 Nickel Run 平行的标记路径行走。 | |

    | 10.68 | 在旧木栈道上跨过常年的 Nickel Run、EV 和野生鳟溪流。有水。附近有营地，但此处全地形车（ATV）侵入是个问题。NB：直向南走（没错，没错），沿着变窄的旧路，很快会经过左侧一块侵蚀得奇特的巨大岩石。
    | SB：在旧木栈道的空地上轻缓上爬。 | |

    | 11.59 | 旧小路交汇处。MST 顺着山坡向下（NB），向上（SB）。黄色标记的环形小径径向西南延伸，交替下降至 Nickel Run 一处 10
    米高瀑布的顶部（在非常干旱的夏季可能会干涸），以及旧的 Arnot & Pine Creek 铁路（建于 1878 年，1952 年废弃，一直是纽约州伊利诺铁路的支线，通往
    Morris，它从未到达过常年 Babb Creek 旁边的营地和游泳点的 Pine Creek）。沿着整个侧面回到这里会使你的徒步增加 2.57 公里，重新爬升
    90 米。 | | |


