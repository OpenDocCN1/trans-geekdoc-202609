  - "[PAGE 241]\n\n# SECTION 20: PENNSYLVANIA ROUTE 287 TO NY BOR-\\NDER HAMMOND LAKE\
    \ TO NY BORDER\nPRIVATE LAND, COWANESQUE LAKE\n\nSection 20 begins on PA Route\
    \ 287 in front of U.S. Army Corps of\nEngineers Ives Recreation Area on Hammond\
    \ Lake between\nMiddlebury Center and Tioga, and ends at the New York State line\n\
    west of Lawrenceville, PA.\n\nFeatures include pastoral views, waterfalls, birdwatching\
    \ hot spots,\n a ghost town. Section 20 opened by stages from 2002 to 2009. During\n\
    scheduled hunting season closures, road detours will add either 1.1 km\nor 4.4\
    \ km to the length of the section between Hammond Lake and\nTioga Heritage Campground.\
    \ Check detailed trail description care-\nfully, and also check hike-mst.org for\
    \ updates.\n\nCaution! This section is underlain by the gas-rich Marcellus for-\n\
    ation. Interruptions in the footpath are possible due to increasing\ngas production\
    \ activity. Please check the trail conditions on http://\nwww.hike-mst.org before\
    \ you hike.\n\n# GENERAL DESCRIPTION\n\nMST ascends through abandoned farmland\
    \ across PA 287 eventually\ninto privately owned woodlots. A peak offers sweeping\
    \ views of Elk-\nhorn Creek valley. MST then descends to Elkhorn Creek, passing\
    \ a\nfall. MST then ascends through both abandoned and well-used\npastures to\
    \ a high point with south then east views, past a licensed\nhunting preserve and\
    \ through woods and fields on private land, and\nthen follows a narrow dirt road\
    \ descending Baldwin Creek to Cow-\\anesque Lake. MST circumnavigates the south\
    \ shore, head, and north\nshore of this reservoir on old roads, new trails, and\
    \ two PENNDOT"
