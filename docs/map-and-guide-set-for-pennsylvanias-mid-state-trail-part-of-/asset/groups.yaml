    # PRIVATE LAND


    Some parts of MST, especially those closer to Maryland and New York borders, cross
    private land. Although voluntary, common rules for MST:


    - Stay on trail. Leash your dog and clean up any waste left.

    - Do not use any vehicles, ATVs, horses, or bikes.

    - Respect owners'' property and privacy.

    - Don''t pick up anything or leave behind.

    - No camping (except at two locations noted in this Guide).

    - No fires.

    - No alcohol, and certainly no illegal substances.

    - If the blazes and signs disagree with the Guide, follow the blazes and posted
    instructions!

    - Stay off private land during posted closures: closures are noted where possible
    in this Guide.

    - Even when not closed, strongly consider avoiding private land during spring
    and fall seasons.

    - No hunting.


    The Golden Rule: Be courteous of the rights of private landowners as you would
    expect an uninvited guest on your own property to behave.


    Finally, if you do not intend to follow all of these rules while passing through
    private land on the MST, please hike another trail so that polite, quiet hikers
    can continue to enjoy in perpetuity of the diversity of features along MST.


    # FOOT PATH ONLY


    The main trail and side trails are described in both northbound and southbound
    directions in a table format. The trail description is separated into twenty sections
    divided by paved roads or highways (expect the division between secs. 8 and 9).
    Crossings of roads that can be navigated by an ordinary car at sometime in the
