    ## 第 14 节：宾夕法尼亚州 150 号公路至宾夕法尼亚州 44 号公路

    ## 苏斯奎哈纳河西支 到 RAMSEY

    ### TIADAGHTON 州立森林


    第 14 节于 Chatham Run 和 Charlton 之间的 Susque Valley Animal Hospital 对面的 PA 150 开始，结束于
    Ramsey 郊外的 PA 44。在此处 PA 44 沿线有有限的白天停车位，但请勿阻塞进入 Pine Creek 的通道。


    本节的特征是 Woolrich 的旗舰店（可补补包）以及在 Camp Kline 和 Ramsey 之间通过 Pine Creek 径路桥跨越 Pine Creek。MST
    沿线唯一的避难所位于本节的 Woolrich Park 和 Bonnell Flats。


    通过 Gravel Hill、Mill、Big Spring 和 Bull Run 路可以中间进入第 14 节。第 14 节于 1983 年开放，并于 2001
    年迁至铁道径路桥。


    注意！本节下方是富含气体的 Marcellus 页岩层。由于天然气开采活动日益增加，步径可能会中断。徒步前请访问 http://www.hike-mst.org
    检查径路状况。


    ## 总体描述


    州中部步道（Mid State Trail）顺着 Chatham Run 东侧的高地延伸至 Gravel Hill Road。然后沿着 Park Ave.
    穿过 Woolrich，经过旗舰店。它在开阔地带跨越，进入 Tiadaghton 州立森林前沿 Park Ave。它在 Big Spring 处跨越 Couders
    Pike，南向 Negley Fork。MST 沿着 Shultz Fork 下降至 Pine Creek。在 Ramsey 和 Camp Kline 之间通过桥梁跨越
    Pine Creek。在 Ramsey 市中心南向。


