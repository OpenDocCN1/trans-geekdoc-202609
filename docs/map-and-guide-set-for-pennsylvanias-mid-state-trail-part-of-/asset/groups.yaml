    # SECTION 5: PENNSYLVANIA ROUTE 164 TO PENNSYLVANIA ROUTE 866

    OLD ROADSIDE REST TO WILLIAMSBURG

    STATE GAME LANDS 73 AND 118


    The southern trailhead is the old roadside rest at the top of Tussey Ridge on
    PA 164 east of Martinsburg. The old route of PA 164 is gated off but there is
    space for several cars to park if the gate is not blocked. The northern trailhead
    is the parking lot for the Lower Trail on East First Street and Liberty in Williamsburg
    where there is plenty of parking space. Features of this section are commanding
    views in both directions from four pipeline swaths across Tussey Ridge. Water
    is very scarce along this section. There are some intermittent springs along the
    gated maintenance road south of Drab Corner and a more reliable spring on an old
    road immediately north of Drab Corner. There are six gaps along this portion of
    the bench and a number of old roads may lead to springs in these gaps but they
    have not been explored. Game commission regulations do not permit such routes
    to be marked. No camping on game lands.


    There is intermediate access to SR 2011 at Salems Church on Mill Lane (T 369)
    at a crossroads identified as Beavertown on USGS map and as Drab on PA transportation
    map. There is plenty of parking space at a game food field on the bench. Access
    also available from Tussey Mtn. Road above Marklesburg. Section 5 was opened in
    1997.


    # GENERAL DESCRIPTION


    From the old roadside rest the trail follows crest of Tussey Ridge paralleling
    the boundary of SGL 73. At the pipeline the trail turns west and picks up an old
    road which follows to the gated maintenance road on the bench. This road is followed
    to the large clearing at Drab Corner. Here the trail turns right on jeep road
    and then left on an old logging road. At the end of logging road it climbs to
    the top of Tussey Ridge and continues along the top to another pipeline swath.
    It continues on jeep road, crossing two more pipelines and turns left on Tussey
    Mtn. Road. It then turns right on Biddle Road and continues on Lower Creek Road
    to reach the Lower Trail Parking lot at First and Liberty.


