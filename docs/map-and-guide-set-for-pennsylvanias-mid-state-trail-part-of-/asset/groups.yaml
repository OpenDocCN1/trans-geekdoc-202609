    # 致所有步道者的公告


    中州足迹协会已尽力在本出版物中提供关于中州足迹最准确、最新的信息。然而，步道状况在不断变化。自然灾害、林业活动和人类开发只是导致中州足迹需要更改路线的少数事件之一。书中描述的路线会随着时间的推移而可能并将发生，因此，任何出版的路线在您阅读本公告时都不能被视为精确准确的。使用本指南的徒步者应自担风险，且在使用本书时应结合当前的地图、指南针或
    GPS，以及常识性的措施。请务必告知他人您的徒步计划。访问中州足迹网站（http://www.hike-mst.org）获取有关步道改道的最新信息。


    # 前言


    本步道指南的第一版印于 1972 年。当时，名称已从“中阿勒根尼”（Central Allegheny）（*它实际上位于阿拉拉契亚山脊与山谷地区，而非阿勒根尼山区，且该名称与穿越宾夕法尼亚州的另一条足道引起了混淆）改为“中州足迹”（Mid
    State Trail），以符合森林和水利部于 1970 年发布的规划文件《户外休闲视界》（OUTDOOR RECREATION HORIZONS）。参阅本文第
    137 页的地图，可以对这条宾州森林最长步道的当前路线有良好的预示。


    1973 版是第一个公制版，也是最后一个自出版版。1974 版至第 5 版用少量的黄铜夹在一起，由于在这些期间步道多次搬迁，这种设计允许插入新页面，但指南是商业打印的。第
    6 版和第 7 版采用装订，第 8 版是首个由中州足迹协会打印的。第 9 版变成了真正的平装书。第 11 版是首个覆盖整个州（从马里兰州到纽约州）的版本。本版是《宾夕法尼亚州中州足迹指南》的第
    12 出版物，包含了许多提供中州足迹额外入口的支线，并提供了不同步道段落的海拔剖面。


