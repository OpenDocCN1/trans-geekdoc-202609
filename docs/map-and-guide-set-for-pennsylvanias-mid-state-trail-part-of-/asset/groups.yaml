    PA 26 号公路上的 Jo Hays Vista 位于 Pine Grove Mills 闪光交通信号灯与 PA 45 交汇处上坡 3.2 公里处。观景台有充足的停车位。


    Detweiler 交汇处需要从 Bear Meadows Rd 与带门的 Detweiler Rd 的 U 型路口处沿 MST 下降 .28 公里到达（第
    8 部分 NB 24.05 km）。此地停车位有限，可以从 Boalsburg 以东的 US 322 沿 Bear Meadows Rd 南行 11.75
    公里到达，或从 Alan Seeger 野餐区以西的 Stone Creek Rd 北行 3.06 公里到达。


    中间接入点有 Laurel Run、Bear Gap 和 Bear Meadows 路。此段有相当充足的泉，在 Beaver Pond 和 Shaver Creek
    山谷其他处有原始营地。Musser 径径、San Spring Loop、Gettysburg 径径以及 Detweiler 山谷也有原始营地。此部分的特征包括
    Little Flat 火塔、Thickhead 野生保护区、Indian Wells 以及 Detweiler 自然区的原始木材。


    该部分于 1972 年开放，在经过10 次搬迁后形成了目前的路线。


    ## 通用描述


    从 PA 26 号公路出发，径径沿 Tussey Mountain 的东南侧进入 Shavers Creek 山谷和原 Beaver Pond 休闲区。随后它向上爬升
    Tussey Mountain 并向东转弯。在经过 Musser 径径后，MST 继续在 Skyline 径径上。MST 沿脊线向东行到达 Little Flat
    火塔，随后向西南转向并进入 Thickhead 野生保护区。它顺着 Fourth Mountain 的脊线，在 Big Flat 与 Thickhead Mountain
    交汇。在沿着 Thickhead（即第五座山）穿过 Gettys Gap 后，它下降到 Detweiler 山谷，该交汇处也是宾夕尼亚州大东方径径 (GET)
    东、西两条路线的汇点。从 Bear Meadows Meadows 下方的 Greenwood Spur 交汇处向南徒步大东方径径 (GET)，可到达 Greenwood
    Furnace 州公园内 Standing Stone 径径的北起点。


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_95_0.png)

    Tom Thwaites 纪念碑


    ## 第 8 部分海拔剖


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_96_0.png)


