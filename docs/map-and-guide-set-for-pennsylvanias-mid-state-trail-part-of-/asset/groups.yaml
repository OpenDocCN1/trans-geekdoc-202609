    版权所有。未经中州足迹协会书面许可，不得以任何方式再复制本书的任何部分，但批判性文章或评论中使用的简短引文除外。


    封面照片：中州足迹 Hairy John''s 野餐区附近的初秋徒步，由 Scott Adams 提供。

    封底照片：Sand Run 瀑布（Sand Run Falls）和印第井景观（Indian Wells Vista），由 Daryl Warren 提供。


    由中州足迹协会有限公司出版，P.O. Box 885, Huntingdon, PA 16652。

    ISBN: 978-1-931496-11-7

    第十二版


