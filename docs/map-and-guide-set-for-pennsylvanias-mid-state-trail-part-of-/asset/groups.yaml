    Road and to the southeast it is 1.59 km to Pennsylvania Furnace Road. 11.07


    21.55 Pass two two ancient hemlocks. These trees must have grown very slowly on
    the ridge top. They must have been struck repeatedly by lightning. View to northwest.
    10.70


    23.54 View to southeast. MST continues over open ledges with repeated views. 8.71'
