  - '[PAGE 269]


    # SECTION B: IRONSTONE TRAIL

    INDIAN STEPS TO BEAVER POND


    The Ironstone Trail is a 17 km spur of the Mid State Trail providing two connections
    between Stone Valley Recreation Area (Penn State University-PSU) and the Mid State
    Trail. The Ironstone is blazed yellow by Rothrock Forest land and yellow over
    blue on PSU land. Together with 6 km of the MST it makes a 23 km boot-ing circuit
    hike. Features of the Ironstone Loop are the steps on Leading Ridge, Shavers Creek
    Environmental Center and Monroe Iron Furnace. Intermediate access is available
    on Harry''s Valley Rd., Charter Oak Rd., Shavers Creek Environmental Center, Red
    Rose Rd., PA 26, and Pine Swamp Rd.. The Ironstone Trail was opened in 1979. Primitive
    camping is permitted as per DCNR regulations on the yellow blasted portions of
    the trail. Camping is not permitted on the yellow sections which are on PSU land.
    Nice primitive campsites are located at Garner Run and at the junction with the
    MST at Beaver Pond. Water is available at Garner Run in Harry''s Valley, a piped
    spring at 5.49 km NB (11.65 km SB), Shaver''s Creek, and the Shaver''s Creek Environmental
    Center.


    # GENERAL DESCRIPTION


    The Ironstone Trail descends Tussey Mtn. crosses Harry''s Valley and turns southwest
    along Leading Ridge. It then descends into Stone Val-ley on a jeep road through
    the water-shed research area and traverses evergreen plantations and a meadow
    to a junction with Lake Trail in Stone Valley Recreation Area. Near Shaver''s
    Creek Environmental Center the Ironstone Trail diverges from the Lake Trail for
    a distance before picking up Shaver''s Creek to PA 26. After passing Monroe Iron
    Furnace the Ironstone follows old charcoal roads and trails to a junc-tion with
    the Mid State Trail near Beaver Pond.'
  md: '

    # GENERAL DESCRIPTION


    The yellow blazed Greenwood Spur starts at Broad Mountain Road in Greenwood Furnace
    State Park. It passes several historic sites and some large white pines on a pleasant
    woods trail. Turning north it switchbacks halfway up Broad Mountain on old charcoal
    roads, passing several charcoal flats, and then ascends directly on the Collier
    Trail to the summit and Greenwood Fire Tower where it picks up the Johnson Trail.
    After descending Broad Mountain on switchbacks it passes through a stand of ancient
    hemlocks and thickets of giant rhododendrons in Alan Seeger Natural Area. It then
    follows Detweiler Run partly on the old grade of Monroe Kulp and D. Beidelheimer’s
    narrow gauge railroad and partly on new trail to the northern terminus with the
    orange blazed Mid State Trail at Detweiler Junction.


    When leaving a car overnight at Greenwood Furnace please check in with the park
    office at the junction of PA 305 and Broad Mountain Road. Parking at the northern
    terminus of this spur can be found along Detweiler Run Road, just north of its
    terminus with the orange-blazed Mid State Trail (Detweiler Junction). When parking
    here, do not block the access gate. Parking for day hikes can also be found at
    the picnic areas within Alan Seeger Natural Area.


