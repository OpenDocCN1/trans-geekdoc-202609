    # NOTICE TO ALL TRAIL USERS


    Every effort has been made by the Mid State Trail Association to provide the most
    accurate and up-to-date information about the Mid State Trail in this publication.
    However, conditions on the trail are constantly changing. Acts of nature, forestry
    practices, and human developments are only a small number of events that necessitate
    the rerouting of the Mid State Trail. Changes to the route described within this
    publication can and will occur over time and, therefore, no published route can
    be regarded as precisely accurate at the time you read this notice. Hikers using
    this publication should do so at their own risk and the use of this publication
    should be in conjunction with current maps, as well as a compass or GPS, and with
    common sense precautions. Always tell someone of your hiking plans. Visit the
    Mid State Trail website (http://www.hike-mst.org) for the most recent information
    regarding trail reroutes.


    # PREAMBLE


    The first edition of this trail guide was printed in 1972. Already the name had
    been changed from Central Allegheny (It was in the Appalachian Ridge and Valley
    Region NOT the Alleghenies and the name produced confusion with that trail that
    crosses Pennsylvania) to Mid State Trail in compliance with OUTDOOR RECREATION
    HORIZONS, a planning document issued in 1970 by the Department of Forests and
    Waters. See map on page 137 of this document for a good deal of foreshadowing
    of the current route of the longest trail in Penn''s Woods.


    The 1973 edition was the first metric and the last self-publishing edition. The
    1974 to Fifth editions were held together with little brass clips allowing the
    insertion of new pages as the trail was relocated repeatedly during these years
    but the guides were printed commercially. The 6th and 7th editions were stapled
    and the 8th was the first to be printed by Mid State Trail Association. The 9th
    edition became a real paperback book. The 11th edition was the first to cover
    the trail through the entire state, from Maryland to New York. This edition is
    the 12th publication of the Guide to Pennsylvania Mid State Trail and incorporates
    the many spurs that offer additional access to the Mid State Trail, as well as
    providing elevation profiles of the various trail sections.


