    # SECTION 6: PENNSYLVANIA ROUTE 866 TO US ROUTE 22

    WWILLIAMBURG TO ALFARATA

    LOWER TRAIL


    The southern trailhead is the Williamsburg parking lot at First and Liberty in
    Williamsburg. The northern trailhead is the Alfarata parking lot on the Alexandria
    Road just off US 22. Features of the Lower Trail are its grade separation and
    historic remains of the Pennsylvania Canal and charcoal iron industries. A grassy
    swath is provided for hikers on the east side of the Lower Tail , a crushed stone
    grade in the middle for bikes and another grass strip on the west side for horses.
    Lower Trail is owned and operated by Rails-to-Trails of Central Pennsylvania.
    Lodging can be found in Williamsburg at the Blue Lantern Bed & Breakfast located
    at 327 High St. The phone number is 814-407-4031.


    There is intermediate access from T 454, and SR 2017. There is no water along
    the Lower Trail.


    The Lower Trail was opened in 1994.


    # GENERAL DESCRIPTION


    Lower Tail is unblazed and follows bed of the Petersburg branch of Pennsylvania
    Railroad, abandoned in 1982. The railroad had in turn followed the route of the
    Pennsylvania Canal. It crosses Frankstown branch once near before reaching Etna
    Furnace. It crosses twice more near Etna Furnace and then enters a canyon before
    reaching US 22 and the Alfarata trailhead. Mid State turns west on Alexandria
    Road (SR 4014) to reach the Hall Trail on Short Mountain.'
