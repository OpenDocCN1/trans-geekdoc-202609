    Greenwood Furnace State Park is on PA 305 between Belleville and McAlevys Fort.
    Detweiler Junction is reached from Bear Meadows Road at the junction with Detweiler
    Road. The orange blazed Standing Stone Trail connecting the Greenwood Spur to
    the Tuscarora Trail near Cowans Gap State Park begins on the south side of PA
    305 across the park office.


