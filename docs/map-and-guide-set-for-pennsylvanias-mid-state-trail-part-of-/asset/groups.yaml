    # SECTION 20: PENNSYLVANIA ROUTE 287 TO HAMMOND LAKE TO BORDER COWANESQUE


    第 20 段起始于 PA 287 附近的美国陆军工程部队的 Hammond 湖，结束于 Lawrenceville 西侧的纽约州边界。特征包括田园风景、瀑布、观鸟点以及一座废镇。在计划狩猎关闭期间（11月15日至12月15日），最短的路线是继续北上
    PA 287 走 4.3 km，然后左转进入 SR 4024/Elkhorn Rd 走 3.3 km，在 6.29 处重新汇合。有一条未铺装的绕行路可用，但比
    MST 路线长 4.4 km，比绕过的铺装路线长 3.1 km。详见 3.08 处的未铺装绕行路线描述。


    # GENERAL DESCRIPTION


    MST 穿过 PA 287 进入私有林地。一个高点可以俯瞰 Elkhorn 山谷的景色。MST 然后向下到达 Elkhorn Creek，经过一处瀑布。MST
    然后穿过废弃和经常使用的田地到达高处，然后沿着窄土路到达 Cowanesque Lake。MST 绕过水库的南岸和北岸，经过旧路、新径和两座 PENDOT
    桥，经过 Nelson 村的旧现址。一条短侧径通往 Cowanesque 河上的 Nelson 瀑布。之后 MST 离开湖，沿着石子路上纽约边界。


