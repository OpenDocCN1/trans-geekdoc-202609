    19.70 Parking lot, 6.4 miles from PA 49 west of US 15 Lawrenceville exit. South
    end of skiable, accessible to backcountry wheelchairs, Moccasin Trail section.
    Unblazed trail across PA 49 trail-west compass-south leads from here to Nelson
    Falls in 220 m. Waterfall began when flood waters from a 1936 hurricane cut through
    a long bend in the river. Floods in 1946 finished-creating the island opposite
    the viewpoint. Fast water, high flow, over the rocks to deep dangerous pool. Swimming,
    or climbing down from the vista to the fast eroding riverbank, is prohibited.
    Look closely at the soil exposed in the cut above the rocks. Alternating layers
    of sand, silt, and clay, or varves, show this was the bottom of a glacial lake
    much larger and higher than today’s reservoir. Thanks to Glen Mallory of Lawrenceville
    for geological information.


