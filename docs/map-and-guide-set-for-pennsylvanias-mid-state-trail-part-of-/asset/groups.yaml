    # 第18 节：宾夕法尼亚州287 号公路至美国 6 号公路 MORRIS/ANTRIM 到 6 号公路 TIOGA 州林，私有土地


    第18 节起始于 PA 287，位于 Antrim 以西、Morris 以北，沿 US 6 号路结束。


    特征包括几处瀑布、Landrus 鬼镇，以及在穿过私有土地上相对开阔区域时观察野生动物的机会。第18 节分别于 2007 年和2011 年向北到达州林末端，并在2009
    年向南到达 Mudge Road。截至本文写作，仍留有一个未标记的间隙。


    注意！此路段下方是富含气的马塞勒斯页岩（Marcellus Shale）地层。由于产气活动增加，步道可能会中断。徒步前请在 http://www.hike-mst.org
    检查路径状况。


    # 总体描述


    MST 沿着道路、小径和轨道爬上一座私人所有的山脉，然后穿过修复的矿区和商业林地，这些区域在狭窄、崎岖、有时多岩石的路径上，在狩猎旺季会关闭。进入州林后，MST
    很快进入了 Nickel Run 的偏远山谷，这是一条极高价值野生鳟鱼溪。一条短侧径通往 Nickel Run 上的瀑布和带有游泳池的营地。MST 顺着岩石山坡向下到达
    Landrus，这是一个古老的煤矿村，有许多引人入胜的基础。路径穿过偏远森林的 Babb Creek，在没有道路的间隙中间跨越主流两侧，以观察支流上的两处瀑布。离开州林后，MST
    向北前往位于 Charleston 镇这个农村农场社区另一边的 Hills Creek 州立公园。


