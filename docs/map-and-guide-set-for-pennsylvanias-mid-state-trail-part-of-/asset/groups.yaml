    # SECTION 7: US ROUTE 22 TO PENNSYLVANIA ROUTE

    26


    # LOWER TRAIL TO JO HAYS VISTA

    ROTHROCK STATE FOREST


    The Alfarata Mid State Trailhead is located at the junction of US 22 and Alexandria
    Rd.(SR 4014) at the west end of the bridge over the Frankstown Branch of the Juniata
    River, about 1.6 km east of Water Street. The northern trailhead of the Lower
    Trail, with ample parking, is about 300 m east on the Alexandria Rd.. Jo Hays
    Vista is located on PA 26 about 3.2 km from the flashing traffic light (junction
    of routes PA 26 and PA 45) in Pine Grove Mills. Section 7 can also be reached
    by the yellow blazed Yellow Arrow - Rainbow side trails starting from a gravel
    parking area (former Colerain Picnic Area), which is 3.1 km northeast of Spruce
    Creek Village at the junction of PA 45 and Colerain Rd.. Principle features of
    this section are the many views from Tussey Ridge.


    Intermediate access points are the Little Juniata Natural Area parking lot, Colerain
    Road and Pennsylvania Furnace Road. Primitive camping along the trail is available
    at several sites, all dry, identified in the detailed trail data.


    Water is very scarce on this section. Springs are available on the bench partway
    down the northwest side of Tussey Ridge. Blazed state trails lead to some of these
    springs but others are reached only by unmarked trails. Section 7 was opened in
    1972 and has since been relocated or extended nine times.


    # GENERAL DESCRIPTION


    From US Route 22 the trail climbs steeply to reach state land and then continues
    across Short Mountain. The trail keeps to the east'
