    # NB Features/Directions SB (km)


    ### Concrete foundation. The coal from the Anna S. deep mine (1905 to 1937) traveled
    in buckets on a cable tramway supported on this foundation across the Wilson Creek
    valley to the railroad at Antrim. As most of the Anna S. miners lived in Antrim,
    some may have been tempted to ride on the buckets to save the walk across the
    valley. According to local legend (not supported by records of the state mine
    inspectors), once on a winter night, the tram stopped, leaving the last miner
    to freeze to death perched on the small bucket high above the valley.


