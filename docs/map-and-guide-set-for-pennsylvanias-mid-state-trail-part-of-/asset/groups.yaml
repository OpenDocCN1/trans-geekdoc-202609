  mdcn: '


    # 标记


    主径道由 5 cm x 15 cm 的橙色矩形油漆标记。侧径道用同样大小的蓝色或黄色矩形标记。双重标记（一处叠在另一处下方）警告前方有转弯。如果有足够大的树木，上方的标记可以向转弯方向稍微偏移。在许多径道交汇处和道路交叉口已安装了径道标志。


    # 迁移与延伸


    佛蒙特州绿山俱乐部（Green Mountain Club of Vermont）有一句话：“你第一次尝试不可能把径道修在正确的地方。”我们做得比这好一点点，但仍然没有达到
    100%。您可以在中州径道网站 http://www.hike-mst.org 获取有关线路迁移和径道延伸的最新信息。


    # 中州径道补章与杂项


    可以在以下处获取中州径道补章：

    - 中州径道协会 (Mid State Trail Association)

    - P.O. Box 885

    - Huntingdon, PA 16652

    - http://www.hike-mst.org


    为了获得 80 公里（50 英里）奖章而徒步旅行 MST 的童子军应通过上述地址联系中州径道协会，向其说明他们的保护工作。


    徒步者需自备装备并承担自身责任，并考虑到涉及的困难和潜在危险。任何徒步 MST 的人均需自担风险。


    # 水


    MST 大部分路线沿脊线，这意味着泉水和溪流稀少。经常需要在已标记或未标记的侧径道上寻找水源。在许多情况下，这些交汇处有标记，但距离水源的距离和方向仅在本指南中提供。这里的“可靠”是指在
    8 月和 9 月不会干涸的水源。这些泉水或溪流可能都无法通过公共卫生部门的假设测试。已知 MST 附近的几个水源中存在贾第亚虫（Giardia）。MST 的泉水仅认证在流动时含有相当比例的单氧化二氢（H22O）。


    假设符合饮用水标准可以在 Stone Valley、Penn Roosevelt、Greenwood Furnace、Poe Valley、Poe Paddy、R.B.
    Winter、Ravensburg、Camp Kline、Little Pine、Blackwell Canoe Access、Hills Creek、Ives
    Run、Tioga Heritage 和 Cow-anesque 的水泵或水龙头获得。但仅限季节性。净化饮用水最快的方法是亚微米过滤器，种类多到令人眼花缭乱。只有没试过的人才会在野外通过煮水净化。


    强烈建议徒步者在 MST 上携带一个或多个水壶、水瓶、水袋或水包。


    # 露营


    Greenwood Furnace、Penn Roosevelt、Poe Valley、Reeds Gap、Poe Paddy、R.B. Winter、Ravensburg、Little
    Pine 和 Hills Creek 提供按现行州公园收费的露营，且仅限季节。其他按现行收费的公共营地位于 Hammond Lake 的 Ives Run
    和 Tompkins，均由美国陆军兵团运营。Tioga Heritage 私人营地直接位于 Tioga 附近的 MST 旁。Poe Paddy、Little
    Pine 和 Hills Creek 提供团体露营区，必须提前预订。州森林的其他地方（遵循已发布的 PA-DCNR 原始露营指南）允许原始或背包露营（仍为免费），但在道路视范围内、本指南或
    MST 地图上标记或注明的地方除外，且自然区（Natural Areas）和州游戏地（State Game Lands）禁止。自然区的边界显示在 MST 地图上，但通常在地面没有标记。指南中标识了更好的原始营地。请咨询相关州办公室以查看是否需要露营许可。根据本指南编写时的
    17 Pa. Code 21.61，单晚露营不需要许可。


    原始营地的运作严格遵守“带入什么，带出什么”的原则。如果你装满了那个瓶子、罐头或铝箔，你完全可以把它们空瓶一起带走。如果你在营地或沿途途中发现垃圾，请尝试在你的背包或口袋里找空间放入它们。熟悉并实践“无痕山”（Leave
    no Trace）原则。


    在原始营地，请在距离最近溪流或泉水至少 70 米（200 英尺）的地方处理洗碗水和洗涤水。下游可能有人同一条溪流饮用水。粪便必须埋在表层 15 cm（6 英寸）的土壤中，且距离最近水源至少
    100 米（300 英尺）。不要在任何道路的视范围内（70 米）内露营。


    # 营火


    几年前，当宾夕尼亚州立大学课程结束时，学生们来到径道以缓解期末考试和学年的压力。天黑后，他们在径道沿线扎营并生了营火。那天天气干燥，当晚有两处火失控了。一处火发生在
    Pine Swamp，并顺着 Tussey Mountain 向上山蔓延。这处火对山谷主径道的破坏很小，但在它与 Jackson Trail 相交的脊顶，它杀死了几乎所有的植物。


    另一处火发生在 Fleet Foot 径道和 North Meadows 径道之间的 Fourth Mountain。栗橡树被烧死了，但一些松树存了下来。火灾区域急于恢复树木，已变成大片的越橘和山月桂。Fleet
    Foot 径道消失在侵入主径道的灌木中。保持 Fourth Mountain 的开阔是另一个挑战，因为灌木在直射阳光下生长得很快。熊会被浆果丛吸引。


    这两处火本不应该发生。在高火灾风险期间，禁止在原始营地生明火。这些日期是 3 月 1 日至 5 月 25 日，以及 10 月 1 日至 12 月 1 日。其他时间请凭常识使用便携式炉具（Optimus、Primus、Svea、MSR
    等），因为它们火灾危害极小。如果你在窄脊上生火，意料之外的阵风可能会在你回到营地前让火失控。通过浇水确保你的火完全熄灭。请不要在这些地点生火。这增加了森林部门的工作，并让我们得罪。


    中州也发生过其他火灾，例如 Poe Mountain、White Deer Mountain 和 Ramsey，但这些火灾并非徒步者引起。处理火灾时请非常小心。


    # 使用 MSTA 彩色地图


    MSTA 发行的彩色地图均基于通用墨卡托（UTM）网格，北美坐标基系（NAD）1983，比例尺为 1:50,000，局部放大的区域除外（例如地图 307-310
    上 State College 附近的 Tussey Forest Interface）。这意味着基础地图上移动 1 厘米相当于在地面上移动 500 米。这大约是
    USGS 7.5 分地形图（1:24,000）比例尺的一半，但与加拿大地形图比例尺相同。如果你能找到，加拿大资源部分发的小比例尺非常便于直接从 1:50,000
    地图上读取公里。


    地图上的网格线每 1000 米设置一条，每条都有双数字标记。这个双数字是 UTM 坐标系中的千位和万位。为了确定位置，还需要十万位和百万位——这些是出现在每个地图面板边缘的小数字。最后你需要
    UTM 区域标识——这一不起眼的信息位于 MSTA 彩色地图的图例中。宾夕尼亚州大部分地区以及 MST 的第 7 至 20 段位于 18 区，然而，宾夕尼亚州西部因此最南端的
    MST 第 1 至 6 段位于 17 区。


    这是一个例子。假设有人告诉你在 UTM 区 18、NAD 1983、北纬 4511833、东经 258024，位于 Huntington县的 Beaver
    Pond 处会合。将这些数字视为 45 11833 和 2 58024。如果你正在看正确的地图面板，


