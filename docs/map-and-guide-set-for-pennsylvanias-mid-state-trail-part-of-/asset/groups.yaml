  - '[PAGE 57]


    # SECTION 4: PENNSYLVANIA ROUTE 36 TO PENNSYLV-NIA ROUTE 164

    YELLOW CREEK TO OLD ROADSIDE REST\STATE GAME LAND 73


    The southern trailhead is on PA 36 just west of New Frontier Restaurant. There
    is a fair amount of parking at a pullout along the highway. The northern trailhead
    is at the old roadside rest at the top of Tussey Ridge on PA 164. There is limited
    parking but do not block the gate on the old road.


    There is intermediate access from unpaved Maple Run- Ravers Gap Road (changes
    name at township boundary) and from paved Henrietta Mountain Road. There is a
    sizeable parking lot on Ravers Gap Road on the east side of Maple Run but very
    limited parking along Henrietta Mtn. Road. No winter maintenance on Maple Run
    Road and not much more in summer.


    Maple Run Valley is the principal feature of this section and there is plenty
    of water along the run but little elsewhere. Maple Run is the one place where
    the trail leaves the bench or top of Tussey Ridge.


    Section 4 was opened in 1998.


    # GENERAL DESCRIPTION


    From PA 36 the trail climbs steeply on stone steps and sidehill construction to
    an old woods road. It continues to climb on the road before the corner of state
    game land. It then descends to Maple Run Valley and continues north to Ravers
    Gap Road without crossing the run. Here it turns left and then right again on
    a gated management road which is followed to Old (Henrietta) Mtn. Road. The trail
    then turns right and climbs to the top of Tussey Ridge where it turns left on'
  - '[PAGE 58]


    another gated management road. This road is followed nearly to PA 164 where it
    turns right onto trail and climbs to a crossing of PA 164 at the ridge top across
    from the old roadside rest.'
  - '[PAGE 59]


