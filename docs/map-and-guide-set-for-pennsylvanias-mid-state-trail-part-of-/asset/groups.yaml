    # 概述


    黄色标记的格林伍德支线（Greenwood Spur）起始于格林伍德炉州立公园（Greenwood Furnace State Park）的宽山路。它沿着一条宜人的森林小径经过了几处历史遗迹和一些巨大的白松。向北转弯后，在广山山上通过旧木炭路折回，经过几个炭场，然后直接沿着科利尔径（Collier
    Trail）上升至山顶和格林伍德火火塔，在那里与约翰逊径（Johnson Trail）汇合。在通过折回路下广山后，它穿过阿兰·西格自然区（Alan Seeger
    Natural Area）的一片古冷杉林和巨大的杜鹃丛。随后，它沿着德特维勒溪（Detweiler Run）前进，部分路位于 Monroe Kulp 和 D.
    Beidelheimer 窄轨铁路的旧路基，部分路为新径，最终在德特维勒交汇处（Detweiler Junction）与橙色标记的中州径（Mid State
    Trail）汇合到达北端。


    如果在格林伍德炉过夜停车，请在 PA 305 号线与宽山路交处的公园办公室报到。该支线北端的停车位位于德特维勒溪路，就在其与橙色标记的中州径起点（德特维勒交汇处）以北。在此处停车时请勿阻塞通道门。日游停车位也可以在阿兰·西格自然区的野餐区找到。


