    # 第 10 段：US 322 号线至 PA 45 号线

    从七山到 Hairy John’s

    秃鹰州立森林


    七山路边休息区（Seven Mountains Roadside Rest）从春末到秋初开放，但停车仅限两小时。如需更安全或过夜停车，请拨打七山童子营（814）
    364-1017，该营地位于 US 322 向北约 1 英里的 Sand Mountain Road 上。通过 Stillhouse Hollow Road
    进入 MST。


    Hairy John’s 野餐区位于伍德沃德（Woodward）与秃鹰州立森林办公室之间的 PA 45 路。不建议在 Hairy John''s 过夜停车。Hairy
    John Vonada 是一位隐居者，在家人死于瘟疫后住在旧驿道上。


    沿径道在绿谷（Greens Valley）、小波伊溪（Little Poe Creek）、Libby Run 以及熊之谷（Bear Gap）设有原始营地。在彭溪（Penn’s
    Creek）旁边的铁路路基沿禁止露营。波伊谷（Poe Valley）和波伊洼地（Poe Paddy）按现行的州立公园费用提供州立公园营地。


    通往 Stillhouse Hollow、Millheim Siglerville、Big Poe、Cherry Run、Rupp Hollow 和 Woodward
    Gap 路的中途接驳。第 10 段于 1972 年开放至 Poe Paddy，并在 1976 年延伸至 Hairy Johns。


    # 总体描述


    从穿越 US 322 的涵洞开始，MST 爬上长山（Long Mountain）的山脊，并沿着山脊到达 Stillhouse Hollow。随后陡坡下降并沿着绿谷
    到达大平地（Big Flat），在该处转弯并下降到小波伊谷（Little Poe Valley）。波伊谷州立公园之外，它沿着小波伊山（Little Poe
    Mountain）的山脊延伸。在下降越过小波伊溪后，爬过长山，最后通过干谷径道（Dry Hollow Trail）下降到波伊洼地。


    一段短的路面步行将 MST 引向废弃的铁路路基。在旧铁路桥上越过彭溪，隧道提供了穿过波迪山的方法。MST 沿着铁路路基和新径道到达 Cherry Run，部分路面步行使径道穿过
    Cherry Run Gap。随后，MST 爬过厚山（Thick Mountain），向东穿过 Sand Hollow，到达位于 PA 45 路 上的 Hairy
    John’s 野餐区。


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_118_0.png)


    MST 越过彭溪并朝波迪隧道（Paddy Tunnel）方向前进


