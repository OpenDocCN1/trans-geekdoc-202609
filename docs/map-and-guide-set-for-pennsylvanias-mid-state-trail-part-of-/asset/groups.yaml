    ## 第 4 节：宾夕法尼亚州 36 号至宾夕法尼亚州 164 号

    ### YELLOW CREE 到旧路休息区 - 73 号狩猎场

    南起点位于 PA 36，New Frontier 餐厅西侧。公路旁有一个路口，有充足的停车位。北起点位于 PA 164 上 Tussey Ridge 顶部的旧路休息区。此处停车位有限，请勿阻挡旧路入口。

    从未铺面的 Maple Run-Ro Gap Road（在镇界处更名）以及铺好的 Henrietta Mountain Road 均可中间进入。Maple
    Run 东侧的 Rovers Gap Road 有一个大型停车场，但 Henrietta Mountain Road 沿线停车非常有限。Maple Run
    路冬季不维护，夏季维护也不多。

    Maple Run 谷是本节的主要特征，沿溪流有充足水源，但其他地方较少。Maple Run 是路径离开平台或 Tussey Ridge 顶部的地方。

    第 4 节于 1998 年开放。


    ## 总体描述

    从 PA 36 出，路径通过石阶和护坡结构陡升，到达一条旧林路。在狩猎场转角前继续沿路向上。随后向下进入 Maple Run 谷，向北继续到 Rovers
    Gap Road 而不跨越溪流。在此左转后再次右转进入一条管理的路，一直到 Old (Henrietta) Mn. Road。路径随后右转爬上 Tussey
    Ridge 顶部，在那里左转进入另一条管理的路。这条路几乎一直延伸到 PA 164，随后右转进入路径，爬到山脊对面旧路休息区的 PA 164 交叉口。


