  - '[PAGE 43]


    # SECTION 3: SR 1004 TO PA ROUTE 36 NASHCOM TO YELLOW CREEK EVEREVERETT & SGL
    73


    The southern trailhead is located on SR 1004/Ashcom Rd, a paved road through the
    gap in Tussey ridge just west of Everett and south of the turnpike. There is minimal
    parking along SR 1004 0.3 km east of the trailhead. Parking may be found in Everett
    itself. The northern trailhead is on PA 36 just west of New Frontier Restaurant
    east of Loysburg. There is a fairly large pullout along the highway here along
    the Game land boundary.


    There is intermediate access from a side trail (the start of a pending relocation)
    to a SGL parking area behind Everett Area Business Park, and also a side management
    road to a SGL parking area off a lane leaving SR 1005 at the head of Snake Spring
    Valley. Features of this section are the Earlston Furnace Cinder Piles, small
    town America in Everett Borough, largest town directly on MST, and remnants of
    the abandoned Huntington and Broad Top Railroad.


    There is no known water source along this entire section but there may seeps along
    the bench north of Snake Spring Valley. Near the south end MST is very close to
    the Raystown Branch but this river water requires filtration and disinfection.
    Get water at commercial establishments in Everett. Section 3 opened in 2001 and
    relocated partially in 2010. Future relocations are planned so check http://www.hike-mst.org
    for updates.


    # GENERAL DESCRIPTION


    From the trail head in SGL 97 the trail proceeds along SR 1004 and turns north
    at Cornell Road passing over the turnpike. It squeezes on trail passing remnants
    of the Earlston Furnace and railroad grades'
  - '[PAGE 44]


    between the PA Turnpike and the Raystown Branch on the Weicht Bridge and turns
    east the levee at the north side. It turns again at Spring St. passing through
    downtown Everett. Trail turns west on Third St. passing under US 30 and proceeds
    on abandoned grade of Huntingdon and Broad Top Railroad and follows a jeep road
    out to Mt. Dallas Road (T 455). At west end of Mt. Dallas it follows US 30 across
    a short bridge before turning north on Snake Spring Valley Rd. (SR 1005) for a
    little less than 3 km. Rising along a farm lane, MST regains ridgetop footpath
    with views and rocks. (An alternate route through Everett, for now follows PA
    26 north to Everett Area Business Park, proceeding west on Industrial Blvd then
    through a log yard to reach an SGL parking area and a seep trail slabbing up the
    east side of Tussey on SGL 73 to reach the ridgetop.) It then follows the maintenance
    road along the bench on the west side of Tussey and down to a crossing of Yellow
    Creek. A new bridge or relocation is planned here so check http://www.hike-mst.org
    for updates. The trail proceeds along PA 36 to reach the next corner of SGL 73.'
