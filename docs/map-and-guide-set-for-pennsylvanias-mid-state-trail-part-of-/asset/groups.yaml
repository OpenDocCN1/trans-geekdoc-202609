  mdcn: '

    穿过 Short Mountain 一侧，然后访问 Barree 市中心，最后在公路桥上跨越小朱尼塔河（Little Juniata）。从小朱尼塔河自然保护区的停车场出发，步径陡峭爬升
    400 多米到达一个壮丽的观景点。从那里开始，MST 沿着 Tussey 岭脊的山顶延伸 24 公里，经过著名的“印第安阶梯”（Indian Steps）到达
    PA 26。步道多石石、崎岖且充满挑战性。它与宾夕法尼亚州和缅因州阿帕拉契山径最艰难的部分相当，在岩石间跨越时很难保持节奏。但山脊顶部没有剧烈的起伏，有许多观景点，向西北可以俯瞰荒地（Barrens），向东南可以俯瞰石谷（Stone
    Valley）。


