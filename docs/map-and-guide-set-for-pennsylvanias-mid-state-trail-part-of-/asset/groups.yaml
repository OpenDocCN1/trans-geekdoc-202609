    370-310 the “45” and the “2” are shown once each edge in tiny type. So if you
    look 833 meters north of the “11” line and 24 meters east of the “58” line you
    should find the campsite.


    If you are navigating using a Global Positioning System (GPS) device, you can
    probably set it to read your position directly in UTM. If you do this sure the
    units of length are not any other units, and that the datum is NAD 1983 not, say,
    NAD 1927.


    If you are navigating using a compass after the batteries in your GPS unit go
    dead, you should have prepared first by finding out your magnetic declination
    relative to the UTM grid moves every year and no magnetic declination is shown
    on the MSTA maps. Remember the MSTA map north is not true but UTM grid north –
    hence you need to add the local grid and the magnetic declination to find the
    declination you will use for your hike. The UTM grid should you have read to this
    point not knowing what “declination” is, consult any standard reference or the
    Internet to learn map and compass use.


    Topographic contour lines at 50 or 25 meter intervals relate to mean sea level
    are shown on the maps. Reading contour line topographic maps is an art that can
    be easily learned from numerous sources. When you compare MSTA maps to other topographic
    maps, be aware that 50 meters is a much greater interval than most other maps
    you will see. In other words, when the contour lines get close together on an
    MSTA map, the terrain is truly steep – but if the contour lines are far apart,
    that doesn’t mean the terrain is flat.


    Color shading on the maps represents different land ownership – each land owner
    has different rules as stated elsewhere in the Guide. Light green on the MSTA
    maps does NOT represent what it does on a USGS topographic map. A light green
    color on the MSTA map'
  - '[PAGE 16]


    represents State Forest Land, which may or may not be wooded. Light yellow represents
    Game Lands where camping is not allowed – again, these tracts may or not be wooded.
    White areas on the map typically represent private lands -- again, these may or
    not be wooded. Other colors may appear as included in the legend to each map.
    The land ownership shown on the maps is derived from various sources but is not
    accurate as a survey. If in doubt, look closely for land owner-boundaries. In
    PA along MST, public land boundaries are typically marked by white blotches on
    trees. State Game Land boundaries are typically better marked as State Forests.


    # ELEVATION PROFILES


    This edition of the trail guide is the first to include elevation profiles for
    each section of the trail. These profiles are displayed in a horizontal orientation
    on the the page immediately following the general description of the section.
    Using these profiles will help in visualizing the difficulty of hiking this particular
    section of the trail by visually representing the elevation changes found along
    the trail. The vertical exaggeration for these profiles is 5:1. This means that
    for every meter plotted on the x-axis (distance), a corresponding meter on the
    y-axis (elevation) is plotted at five meters. This vertical exaggeration is constant
    on all elevation profiles for each section.


    One additional note regarding the elevation profiles: you may notice a discrepancy
    between the distances displayed on the elevation profiles versus listed in the
    guide text. The distances on the elevation profiles will seem to be shorter. This
    is because the elevation profiles are generated from GPS data whereas the guide
    text indicate the distance measured on the trail using a surveyor''s wheel. Distances
    calculated using a GPS are typically shorter because they do not take into account
    changes in elevation and also because of the interpretation that place between
    data points. Always refer to the distance reported in the'
  - '[PAGE 17]


    guide text as the more accurate data when quoting distance on the Mid State Trail.


    # TRAIL OVERSEERS


    Routine maintenance of the Mid State Trail is performed by volunteer overseers.
    Their tasks include removing blowdowns, cutting back encroaching brush, improving
    the footway and repainting the blazes. An individual overseer is assigned a section
    about 3 km long but organization may be assigned that a longer section of trail.
    The overseer system is responsible for the generally good condition of the Mid
    State Trail. An overseer is expected to make a minimum of three trips per year
    over his or her section. Individual overseers’ efforts are currently coordinated
    by volunteer Regional Managers based in the areas of Everett, State College, Woolrich,
    and Tioga. The “Manual for Maintenance of Mid State Trail” and the “DCNR Trail
    Marking Guidelines” are posted to the MSTA web site.


    As with any group of volunteers there is a high turnover and sections become available
    when overseers move away from the area. The extensions have created many opportunities
    for new overseers. Some overseers come all the way from Pittsburgh, Philadelphia,
    and even Virginia to help maintain the Mid State Trail while others live within
    walking distance. If you would like to adopt a section of the MST, visit the Mid
    State Trail Association website at www.hike-mst.org for more information.


    # GREAT EASTERN TRAIL


    Mid State Trail is part of the Great Eastern Trail (GET) network of footpaths.
    The Great Eastern Trail provides a premier hiking experience on a series of existing
    trails that are becoming linked to each other into a long-distance footpath in
    the Appalachian Mountains stretching'
  - '[PAGE 18]


    ultimately from Alabama to the Finger Lakes Trail in New York.


    In southern Pennsylvania and Maryland, the Great Eastern Trail divides into an
    east route and a west route.


    GET''s west route from the Potomac River traverses the Chesapeake & Ohio Canal
    National Historic Park to near Little Orleans, MD whence it passes through Maryland''s
    Green Ridge State Forest to a junction with MST at the Mason-Dixon Line. GET''s
    west route continues on MST to Detweiler Run in Huntington County.


    The east route uses Tuscarora Trail north from Hancock, MD to a junction with
    Standing Stone Trail near Cowans Gap State Park in Fulton County, PA; hence north
    to Greenwood Furnace State Park where it follows MST''s Greenwood spur north to
    Detweiler Run Natural Area.


    Great Eastern Trail follows MST exclusively through northcentral Pennsylvania
    to the New York border where it meets Crystal Hills Trail, a branch of NY''s Finger
    Lakes Trail crossing eastern Steuben County.


    Mid State Trail Association is a participating member of Great Eastern Trail Association.
    For more information about GET, check out www.greateasterntrail.net.


    # METRICATION


    The MST was the first hiking trail in the United States to use metric measure.
    The second edition of the guide (1973) was completely metric. Metrication is a
    patriotic measure designed to help end our cultural isolation and ease our chronic
    balance of payments problems. All trail distances, with the exception of a few
    side trails, have been measured'
  - '[PAGE 19]


    with a Rolata measuring wheel of two meter circumference, or by GPS when wheel
    data are not available. Side trails measured with a homemade wheel are only given
    to 0.1 km. By pure serendipity the initials of the Mid State Trail taken from
    state planning maps of the late ''60s also stand for the Metric System Trail.


    # USE OF THE MAIL DROP & FOOD STORES


    The MST is so long that it would be extremely difficult to carry enough food to
    hike the entire trail without any resupply. There are several small post offices,
    grocery stores, park offices and other facilities within hiking range of the MST.
    A mail drop of nonishable food should be addressed to:


    Your Name

    c/o General Delivery

    Post Office Name, PA Zip Code


    and marked:

    HOLD FOR MID STATE TRAIL HIKER


    Allow plenty of time for your mail drop to arrive before you do. It wouldn''t
    hurt to write or call the postmaster involved ahead of time. REMEMBER: POST OFFICES
    ARE CLOSED ON SUNDAYS AND FREQUENTLY ON SATURDAYS AS WELL. AS OF 2012, MANY RURAL
    POST OFFICES HAVE REDUCED THEIR HOURS TO AS LITTLE AS 30 MINUTES PER DAY. Please
    give a park office advance notice if you are going to send them a food drop. Park
    offices are generally open on weekends in summer. Even if a park office is closed
    you can wait for the park ranger to show up and retrieve your package. Please
    visit www.hike-mst.org for a comprehensive and up-to-date list of mail drops,
    food stores, and other services along the Mid State Trail.'
