    # SECTION 3: SR 1004 TO YELLOW CREEK


    The southern trailhead is located on 1004 0.3 km. There is parking in Everett.
    The northern trailhead is on PA 36 just west of Loysburg. Features of this section
    are the Earlston Furnace Cinder Piles, small town Everett, largest town directly
    on MST, and remnants of the Huntingdon and Top Railroad.


    There is no known water source along this entire section but there may seeps along
    the bench north of Snake Valley. Near the south end MST is very close to the Raystown
    Branch but this river water requires filtration and disinfection. Get water at
    commercial establishments in Everett. Section 3 opened in 2001 and relocated partially
    in 2010. Future relocations are planned so check http://www.hike-mst.org for updates.


    # GENERAL DESCRIPTION


    From the trail head in SGL 97 trail proceeds along SR 1004 and turns north at
    Cornell Road passing over the turnpike. It squeezes on trail passing remnants
    of the Earlston Furnace and railroad grades.

