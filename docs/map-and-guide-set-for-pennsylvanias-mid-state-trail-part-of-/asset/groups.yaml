    # SECTION 12: PENNSYLVANIA ROUTE 192 TO PENNSYL-

    VANIA ROUTE 880


    # R. B. WINTER TO RAVENSBURG

    BALD EAGLE AND TIADAGTON STATE FORESTS


    Raymond B. Winter State Park is just east of the Centre-Union County line on PA
    192. It is 27 km west of Lewisburg. Ravensburg State Park is on PA 880 about 5
    km north of Exit 192 (near the village of Carroll, signed “Jersey Shore” on I-80
    and south of Rauchtown). Check with the R. B. Winter Park office after overnight
    parking at both parks (570) 966-1455. Overnight parking at Ravensburg State Park
    is not recommended.


    Primitive camping is available along Spruce Run, near Rendezvous Spring, in Fourth
    Gap on Nittany Mountain, near Gas Line Spring, White Deer Creek, and along the
    lower Dunbar Trail, Intermediate access is available at R. B. Winter and tent-only
    area with showers at Ravensburg. Section 12 was opened in 1981 has been relocated
    four times and severed twice.


    # GENERAL DESCRIPTION


    The Mid State Trail follows Bake Oven ridge to Sand Mountain when it turns north
    and crosses Spruce Run and Chestnut Flat before climbing over Naked Mountain.
    Next it crosses White Deer Creek and Nittany Mountain. North of I-80 the MST continues
    across the landscape by climbing over Tea Knob, Last Ridge and Brushy Ridge. In
    White Deer Hole the trail turns west and climbs over Big Mountain before descending
    to Sand Flat and then to PA 880 and Ravensburg State Park.


