    # SECTION 20: PENNSYLVANIA ROUTE 287 TO HAMMOND LAKE TO BORDER COWANESQUE LAKE


    Section 20 begins on PA Route 287 in front of U.S. Army Corps Engineers Ives Recreation
    Area on Hammond Lake between Middlebury Center and Tioga, and ends at the New
    York State line west of Lawrenceville, PA. Features include pastoral views, waterfalls,
    birdwatching hot spots, a ghost town. Section 20 opened by stages from 2002 to
    2009. During scheduled hunting closures, road detours will add either 1.1 km or
    4.4 km to the length of the section between Hammond Lake and Tioga Heritage Campground.
    Check detailed trail description, and also check hike-mst.org for updates.


    # GENERAL DESCRIPTION


    MST ascends through abandoned farmland across PA 287 into privately owned woodlots.
    A peak offers sweeping views of Elkhorn Creek valley. MST then descends to Elkhorn
    Creek, passing a fall. MST then ascends through both abandoned and well-used pastures
    to a high point with south then east views, past a hunting preserve and through
    woods and fields on private land, and then follows a narrow dirt road descending
    Baldwin Creek to Cowanesque Lake. MST circumnigates the south shore, head, and
    north shore of this reservoir on old roads, new trails, and two PENNDOT bridges,
    passing the former and present sites of Nelson village. A short side trail leads
    to Nelson Falls on Cowanesque River. After this extended passage MST leaves the
    lake and heads up a gravel road to the New York border.


