    # 第 13 段：宾夕法尼亚州880路至宾夕法尼亚州150路

    # 雷文斯堡州立公园 (Ravensburg State Park) 至西支萨斯奎哈纳-蒂亚达格顿和秃鹰州森林


    雷文斯堡州立公园位于 PA 880 路，介于 I-80 号线192 号出口（靠近 Carroll 村，有“泽西西岸”标志牌）和 Rauchtown 之间。请拨
    R. B. Winter 办公室 (570) 966-1455 咨询过夜停车，不建议在雷文斯堡过夜停车。


    西支径起点位于 PA 150 路，介于 Chatham Run 和 Charlton 之间。可以通过美国 220 号公路的 Avis 或 Woolrich
    出口到达 PA 150 路。


    大岛小径 (Great Island Path) 提供原始营地，雷文斯堡的 Yarns Run 州立公园提供仅限帐篷营地，按常规州立公园收费。


    Shaw Mountain、Ramm 路和 Pine 路 (T 418) 提供中等便利通行。第 13 段于 1983 年开放。该路段沿有充足的泉水和溪流，但在沿路步行部分没有。


    # 总体描述


    从雷文斯堡公园办公室出发，小径横跨 PA 880 路，沿着州森林边界一直延伸到下一个山口。在这里，它沿着大岛印第小径 (Great Island Indian
    Path) 的路线爬升。随后横跨山顶到达 Ramm 路，沿着尼彭斯山谷 (Nippenose Valley) 的边缘向北转。它离开道路以避开一片私有土地，然后进入
    Yarns Run 山谷。它爬上圆顶 (Round Top) 的南侧，俯瞰西支山谷和松溪 (Pine Creek) 的自然景观。在下到圆顶西北角后，它沿着道路（大部分为铺设路）跨越西支山谷。西支本身通过公路桥跨越。穿越山谷时有三个历史遗迹：霍恩堡
    (1777)、一个特拉华印第安人村和宾夕法尼亚运河的遗址。


