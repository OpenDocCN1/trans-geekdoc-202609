  - '[PAGE 10]


    # MARKING


    The main trail is paint blazed with orange rectangles of 5 cm by 15 cm. Blazed
    side trails are marked with blue or yellow rectangles of the same size. A double
    blaze, one above the other, warns of an approaching turn. If a large enough tree
    is available the upper blaze may be offset in the direction of the turn. Trail
    signs have been installed at many trail junctions and road crossings.


    # RELOCATIONS AND EXTENSIONS


    The Green Mountain Club of Vermont has a saying: “You never get a trail in the
    right place on the first try.” We did a little better than this but we still didn''t
    get 100%. You can access the most up-to-date information concerning relocations
    and trail extensions on the Mid State Trail website, http://www.hike-mst.org.


    # MID STATE TRAIL PATCH AND MISCELLANEOUS


    A Mid State Trail patch is available from:

    Mid State Trail Association

    P.O. Box 885

    Huntingdon, PA 16652

    http://www.hike-mst.org


    Scouts hiking the MST for the 80 km (50 mile) award should contact the Mid State
    Trail Association at the above address with respect to their conservation work.


    The hiker is on his own and must assume his own liability, realizing the difficulties
    and possible dangers involved. Anyone hiking the MST does so at his or her own
    risk.'
  - '[PAGE 11]


    # WATER


    The ridge route of much the MST means springs and streams are few and far between.
    It is frequently necessary to find water on side trails both marked and unmarked.
    In many cases these junctions have been signed but distances and directions to
    the water supply are given only in this guide. "Reliable" is used here to mean
    a water source that does not dry up in August and September. Probably none of
    these springs or streams could pass the presumptive tests of public health departments.
    Giardia is known to be present in several water sources near the MST. MST springs
    are certified only to contain a substantial proportion of dihydrogen monooxide
    when flowing (H$_2$O).


    Water that presumably does meets is available from pumps or faucets at Stone Valley,
    Penn Roosevelt, Greenwood Furnace, Poe Valley, Poe Paddy, R.B. Winter, Ravensburg,
    Camp Kline, Little Pine, Black-well Canoe Access, Hills Creek, Ives Run, Tioga
    Heritage, and Cow-anesque. But only in season. The fastest method to purify water
    for drinking is a submicron filter of which there is a bewildering variety available.
    Boiling water in the field to purify it is recommended only by those who haven''t
    tried it.


    Hikers are strongly urged to carry one or more canteens, water bottles, hydration
    bladders, or a water bag on the MST.


    # CAMPING


    State park camping is available at Greenwood Furnace, Penn Roosevelt, Poe Valley,
    Reeds Gap, Poe Paddy, R.B. Winter, Ravensburg, Little Pine, and Hills Creek at
    the prevailing state park fees and only in season. Other public campgrounds at
    prevailing fees are at Ives Run at Hammond Lake, and Tompkins both operated by
    US Army Corps of Engineers. Tioga Heritage private campground is'
  - '[PAGE 12]


    directly on MST near Tioga. Group camping areas are available at Poe Paddy, Little
    Pine, and Hills Creek must be reserved in advance. Primitive or backpack camping
    (still free) is permitted elsewhere in the state forest (following published PA-DCNR
    primitive camping guidelines) except within sight of roads, and where posted or
    noted in this guide or on the MST maps, but prohibited in Natural Areas and State
    Game Lands. Boundaries of the natural areas are shown on MST maps but are generally
    not marked on the ground. The better primitive camp sites are identified in the
    guide. Check with the relevant state office to see if camping permits are required.
    As of the writing of this guide per 17 Pa. Code 21.61, they are not required for
    one night stands.


    Primitive camp sites are operated strictly on a pack in, pack it out basis. It
    you packed that bottle, can or aluminum foil in full, you can certainly pack it
    out empty. If you find trash at a camp site or along the trail, please try and
    find room for it in your pack or pockets. Become familiar with and practice “Leave
    no Trace” principles.


    At primitive camp sites, dispose of dishwasher and wash water at least 70 m (200
    feet) from the nearest stream or spring. Somebody else downstream may be depending
    on the same stream for drinking water. Fecal matter must be buried in the top
    15 cm (6 in) of soil and at least 100 m (300 feet) from the nearest water supply.
    Do not camp within sight (70 m) of any road.


    # CAMP FIRES


    A few years ago ,when classes were finished at Penn State University, students
    hit the trail to decompress from the pressures of finals and the academic year.
    When it got dark they set up camp where they were along the trail and they lit
    campfires. The weather was dry and two of these got away that night. One fire
    started in Pine'
  - '[PAGE 13]


    Swamp and burned uphill over Tussey Mountain. This fire did minimal damage along
    the main trail in the valley but at the ridgetop where it crossed the Jackson
    Trail it killed just about everything.


    The other fire was on Fourth Mountain between Fleet Foot and North Meadows Trails.
    The chestnut oaks were killed but some pines survived. The burn area is in no
    hurry to come back to trees and has become a large patch of huckleberry and Mountain
    Laurel. Fleet Foot Trail has vanished in the brush which encroaches on the main
    trail as well. Keeping Fourth Mountain open is another challenge as brush grows
    fast in the open sunlight. Bears are attracted to the berry patch.


    Neither of these fires should have happened. Open fires at primitive camp sites
    are prohibited during periods of high fire danger. These dates are March 1st to
    May 25th and October 1st to December 1st. At other times use common sense in building
    ground fires. Try to find a spot that has been used before. Close in your camp
    fire with rocks, remove all flammable material from the immediate area and keep
    your fire small. Don’t leave your fire unattended, not even for a couple of minutes.
    An unexpected gust of wind could take it completely out of your control by the
    time you get back to camp. Make sure by pouring water on it that camp fire is
    completely out before you break camp. The Mid State Trail Association urges you
    to use a backpacking stove (Optimus, Primus, Svea, MSR, etc.) as they present
    a minimal fire hazard. If campfires are built on the top of narrow ridges they
    can be seen for great distances. When these fires are reported forestry has to
    check them out on the ground. Please refrain from building fires in such locations.
    It makes a lot of extra work for forestry and doesn''t earn us any friends.'
  - '[PAGE 14]


    The Mid State has had other fires as well, such as those on Little Poe Mountain,
    South White Deer Mountain, and Ramsey, but these fires were not caused by hikers.
    Please be very careful with fire.


    # USING THE COLOR MSTA MAPS


    Each of the color maps currently issued by MSTA is based on the Universal Transverse
    Mercator (UTM) grid, North American Datum (NAD) 1983, at 1:50,000 scale, except
    for blown-up areas in insets (such as the Tussey Mountain Urban Forest Interface
    near State College on Map 307-310). This means that moving 1 centimeter on the
    basic map is equivalent to moving 500 meters on the ground. This is roughly half
    the scale used by USGS 7.5 minute topographic maps (which are 1:24,000) but it
    is the same scale used on Canadian topographic maps. If you can find one, Natural
    Resources Canada gives away a little plastic scale that is very handy for reading
    distance kilometers directly from 1:50,000 scale maps.


    The grid lines on the map are spaced every 1000 meters and each is labeled with
    a two digit number. This two digit number is the thousands and ten-thousands of
    meters in the UTM coordinate system. In order to locate yourself globally you
    also need the hundred-thousand and the million place – these are the smaller numbers
    that appear once per edge of each map panel. Finally you need the UTM Zone designation
    – that inconspicuous bit of information is emplaced in the legend of the MSTA
    color map sheet. Most of Pennsylvania and sections 7 through 20 of MST is in Zone
    18, however western PA hence southern-most MST sections 1 through 6 is in Zone
    17.


