  - '[PAGE 33]


    # SECTION 2: PENNSYLVANIA ROUTE 326 TO STATE ROUTE 1004 RAINSBURG GAP TO EVERETT
    BUCHANAN STATE FOREST & STATE GAME LAND 97


    Section 2 was the hardest part of the entire trail to locate and build. The bench
    on the west side of Tussey makes the trail possible but most of this bench is
    still in private hands. The intervening ridge tops are very tough but extraordinarily
    scenic. The views have been compared to those from North Fork Mountain in West
    Virginia. No camping is permitted on gameland and there is no reliable water source
    along the trail. Only on the management road at Biddle Place is water likely to
    be found about 200 meters below the trail.


    Rainsburg Gap, on PA 326 between Rainsburg and Chaneysville can be reached by
    driving south on PA 326 from east of Bedford. Ashcom Rd (S R 1004) goes west through
    the gap in Tussey Ridge from Everett next to the PA turnpike. Nearest turnpike
    interchange is at Bedford.


    There is intermediate access to Section 2 from top of Rainsburg Gap, Biddle Place
    and Ashcom but only by means of gated management roads. A yellow blazed trail
    leads to the gamelands from a parking area on Sherry Road near Rainsburg but does
    NOT connect with MST or even climb to the bench.


    Section 2 was opened in 1998.


    # GENERAL DESCRIPTION


    From PA 326 across from Garlick Trail MST slabs up Tussey Ridge and then turns
    north along the boundary of Buchanan State Forest and Game Land 97. Above Rainsburg
    it descends to the bench. It reclaims Tussey Ridge and crosses a pipeline with
    views in both direc-'
  - '[PAGE 34]


    tions Above Biddle Place it again descends to the bench and follows a gated maintenance
    road. It then reclumbs the ridge. Above Ashcom it descends to the bench one last
    time and follows another gated maintenance road and then old logging roads before
    descending to S R 1004.


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_34_0.png)


    Hiker at pipeline view north of Rainsburg Gap'
