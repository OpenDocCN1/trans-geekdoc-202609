  mdcn: '


    # 无障碍通道


    中州步道（Mid State Trail）的大部分是老式的荒野小径，但有一段适合轮椅通行。这是从波伊帕迪州公园（Poe Paddy State Park）附近到切里径（Cherry
    Run）的宾溪径。这里曾是铁路路基，跨越宾溪的桥已经铺设了板材，并在帕迪山（Paddy Mountain）下方的隧道建造了平稳的楼梯。它与宾溪平行 4 公里，可以多次看到这条鳟鱼溪。宾溪径不对所有机动车辆开放，但对马匹和自行车开放。由于路程短且平坦，对山地自行车吸引力不大，主要供家庭游客。许多马匹在蒙眼时拒绝通过那座旧铁路桥，因此马匹的使用极少。第
    6 段（下段径）完全适合轮椅通行。此外，位于纽约州边界南部科瓦内斯克湖（Cowanesque Lake）北岸的响蛇小径/MST 有 6 公里的路适合越野轮椅通行。


    # 恶劣状况和径径损坏


    在径路上，如果你遇到马匹、自行车、全地形越野车（ATVs）或工业干扰（如穿越径路的管道、天然气公司代表，甚至只是马迹或粪便），请向相应的志愿者区域经理报告该事件。联系信息可在
    MSTA 网站获取：www.hike-mst.org。你也可以使用来自凯斯通步道协会（Keystone Trails Association）网站（www.kta-hike.org）上的“径径损坏或非法入侵报告表”。不要与可能的非法使用者或其他对峙，因为他们可能比你更有武器，或者可能是土地所有者，两者兼有。请向志愿者区域经理汇报情况。在在你喜爱的网络论坛上发泄不满情绪之前，请至少等待几天让我们的志愿者调查情况。


    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_21_0.png)


    从1983年起，中州步道之父汤姆·索韦斯（Tom Thwaites）在宾夕法尼亚州伍尔奇（Woolrich）北部的 MST 上测量距离。


