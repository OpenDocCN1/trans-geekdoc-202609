  mdcn: '

    沿 Silver Branch 的州立森林向东环绕游戏狩场地 - 州立森林边界。随后它在 Wolf Run 保护区的东端穿过 Sebring Branch
    的源头。MST（密西西州步道）进入 Jacobs Run 的上游，穿过 Oregon Hill 并下降到 Browns Fork。从那里向东转弯，在 SGL
    75 的 Trout Run 地块接上一条管理道路。越过 Trout Run 后，MST 向上进入 Hoyt Hollow，然后沿 Big Run 上游到达
    Brill Hollow。穿过 Gillespie Point 后，下降至 Blackwell 的 PA 414 号公路。


