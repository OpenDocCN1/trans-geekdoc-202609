    Landrus 路旁的石头纪念碑旁有土路停车场。在路的另一侧/南侧，红色标记的 Bear Run 径径经过 Bloss Mountain 的瀑布。在 Bear
    Run 径径上方几米处有一个草地平地溢流停车场，就在石头纪念碑的视线之外。 | 24.23 | |

    | 14.08 旧马车道交叉口。MST 继续直行（NB 看起来右转）。向上的路径引导 0.92 公里到达 Landrus 矿山的旧倾倒场。该区域常见潮湿点。
