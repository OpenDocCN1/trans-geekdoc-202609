    edition of the guide (1973) was completely metric. Metrication is a patriotic
    measure designed to help end our cultural isolation and ease our chronic balance
    of payments problems. All trail distances, with the exception of a few side trails,
    have been measured with a Rolata measuring wheel of two meter circumference, or
    by GPS when wheel data are not available. Side trails measured with a homemade
    wheel are only given to 0.1 km. By pure serendipity the initials of the Mid State
    Trail taken from state planning maps of the late ''60s also stand for Metric System.


