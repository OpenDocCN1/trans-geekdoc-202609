    ...边界。从 US 322 西向继续，直到与 Sand Mountain Rd 相交处，在该处可以转入 US 322 东向方向。此路段有丰富的泉水，Detewiler
    谷有原始营地。在 Penn Roosevelt 可以按照通常的州立公园费用进行露营。该路段的特征包括 Thickhead 野生区（Thickhead Wild
    Area）、Detewiler 自然保护区的原始木材以及 Lewistown-Belfonte 收费公路（1821）。


    ## 总体描述


    第 9 段的起点是 Bear Meadows Road 下方的 Greenwood Spur 交汇处。该交汇处也是宾夕法尼亚州大东方足径（GET）东线和西线的交汇点。沿着
    Greenwood Spur（即 GET 的东线）向南徒足将到达 Greenwood Furnace 州立公园和石石径（Standing Stone Trail）的北起点。从
    Detweiler 交汇处开始，MST 向东北方向沿着旧 Kulp 和 Reichley Bros. 铁路旧址延伸，沿着 Detewiler 谷前进，小径绕过
    Detewiler 自然保护区的边缘。随后，它越过 Thickhead 山的南支，离开 Thickhead 野生区并下降到 Penn Roosevelt 州立公园。最后，它爬上
    Broad 山并向东延伸至 Bald Mountain。穿过一个高山谷后，到达 US 322 下方的涵洞。


