    # SECTION 9: DETWEILER JUNCTION TO U.S. RT 322

    DETWEILER JUNCTION WITH GREENWOOD SPUR AND

    EASTERN ROUTE OF THE GREAT EASTERN TRAIL TO

    SEVEN MOUNTAINS

    ROTHROCK STATE FOREST


    Detweiler junction is reached by descending on the MST .28km from the switchback
    intersection of Bear Meadows Rd. and gated Detweiler Rd. (sec. 8 NB 24.05km).
    There is limited parking at this location which can be accessed by driving 11.75km
    south on Bear Meadows Rd. from east of US322 east of Boalsburg or by driving 3.06km
    north on Bear Meadows Rd. from Stone Creek Rd. just west of Alan Seeger picnic
    area.


    The Seven Mountains Roadside Rest accessible only from the west-bound lane of
    US 322 between Milroy and Potters Mills is open only in season. Use one of the
    blue blazed side trails to reach MST on Long Mountain. Parking at the rest area
    is limited to two hours to discourage drug trafficking and prostitution. No parking
    is permitted at the trail crossing under US 322. For more secure, or overnight,
    calling Seven Mountains Scout Camp (814) 364-1017 located on Sand Mountain Road
    1.6km farther north on US 322. Reach MST via Stillhouse Hollow Road.


    There is some parking at the start of the Ben Jacobs Jeep Trail that can be reached
    from the eastbound lane of US 322 a few hundred meters beyond the roadside rest.
    Use your turn flashers and make frantic hand signals if you intend to turn on
    the Ben Jacobs as other drivers do NOT expect turns on this divided four lane
    highway. MST crosses Ben Jacobs Trail a few hundred meters from US 322.


    Intermediate access point is Penn Roosevelt State Park which can be reached via
    Stone Creek Road between US 322 and Alan Seeger picnic area. Stone Creek Road
    can be entered only from US 322 east-'
