    # SECTION 13: PENNSYLVANIA ROUTE 880 TO PENNSYLVANIA ROUTE 150

    RAVENSBURG STATE PARK TO WEST BRANCH SUSQUE-HANNA TIADAGTON AND BALD EAGLE STATE
    FORESTS


    Ravensburg State Park is on PA 880 between exit 192 (near the village of Carroll,
    signed “Jersey Shore”) on I-80 and Rauchtown. Call R. B. Winter office (570) 966-1455
    for overnight parking at Ravensburg overnight parking at Ravensburg is not recommended.


    The West Branch trail head is on PA 150 between Chatham Run and Charlton. PA 150
    can be reached either from the Avis or Woolrich exits on U.S. 220.


    Primitive camping is available at Great Island Path, and Yarns Run State Park
    tenting only camping is available at Ravensburg at the prevailing state park fees.


    Intermediate access is available on Shaw Mountain, Ramm and Pine roads (T 418).
    Section 13 was opened in 1983. There is a fair supply of springs and streams along
    this section but none on the road walking portion.


    # GENERAL DESCRIPTION


    From the Ravensburg Park office trail crosses PA 880 and continues along the state
    forest boundary to the next gap to the. Here it climbs along the route of the
    Great Island Indian Path. It then traverses the mountain top to the Ramm Road
    where it turns north along the edge of Nippenose Valley. It leaves the road to
    avoid a tract of private land and then dips into Yarns Run Valley. It climbs the
    south side of Round Top to a natural vista of the West Branch Valley and Pine
    Creek. After descending the northwest corner of Round Top it follows roads, most
    of them paved, on the crossing of the West Branch Valley. The West Branch itself
    is crossed on a road bridge. Three historic sites, Fort Horn (1777), a Delaware
    Indian Village and ruins of the Pennsylvania Canal are passed on the valley crossing.


