  mdcn: '


    370-310，“45”和“2”以极小字体显示在每条边线上。因此，如果你在“11”线以北833米处、“58”线以东24米处，你应该能找到营地。


    如果你使用全球定位系统（GPS）设备进行导航，可能会将其设置为直接以 UTM 格式读取你的位置。在此操作时，请确保长度单位不是其他任何单位，并且基准面是 NAD
    1983 而不是例如 NAD 1927。


    如果你在 GPS 设备电池耗尽后使用指南针进行导航，你应该先做好准备，查明你相对于 UTM 网格的磁偏角每年都会变化，且 MSTA 地图上没有显示磁偏角。请记住，MSTA
    地图的北向不是真北，而是 UTM 网格北——因此，你需要加上本地网格北和磁偏角，才能找到你徒步时将使用的偏角。如果你读到这里还不知道什么是“偏角”，请咨询任何标准参考资料或互联网以学习地图和指南针的使用。


    地图上以 50 米或 25 米为间隔的相对于平均海平面的等高线。阅读等高线地图是一门可以从许多来源轻松学会的艺术。当你将 MSTA 地图与其他等高地图比较时，请注意
    50 米的间隔比你看到的大多数地图都要大得多。换句话说，当 MSTA 地图上的等高线密集时，地形确实非常陡峭——但如果等高线相距远，并不意味着地形平坦。


    地图上的颜色着色代表不同的土地所有权——每个土地所有者都有《指南》其他部分说明的不同规则。MSTA 地图上的浅绿色**并不**代表它在 USGS 等高地图上的含义。MSTA
    地图上的浅绿色代表州林用地，可能有森林也可能没有森林。浅黄色代表狩猎场（Game Lands），那里禁止露营——同样，这些区域可能有森林也可能没有。地图上的白色区域通常代表私有土地——同样，这些地方可能有森林也可能没有。其他颜色可能出现在每张地图的图例中。地图上显示的土地所有权源于各种来源，但并非精确的测量结果。如有疑问，请仔细观察土地所有者的边界。在宾夕法尼亚州的
    MST 沿线，公共边界通常由树上的白色斑点标记。州狩猎场的边界通常比州林标记得更好。


    # 海拔剖面图


    本版徒步指南首次包含了每个路段的海拔剖面图。这些图表以水平方向显示在紧随该段通用描述后的页面上。使用这些图表通过视觉化表示沿途的海拔变化，有助于直可视化该特定路段徒步的难度。这些剖面图的垂直放大比例为
    5:1。这意味着在 x 轴（距离）上绘制的每米，y 轴（海拔）上对应的米会被绘制为五米。这种垂直放大比例在每个路段的所有海拔剖面图中保持不变。


    关于海拔剖面图的额外说明：你可能会发现剖面图上显示的距离与指南文中列出的距离之间存在差异。剖面图上的距离看起来会短一些。这是因为剖面图是根据 GPS 数据生成的，而指南文中指示的是使用测距轮在步路上测量的距离。使用
    GPS 计算的距离通常较短，因为它们没有考虑海拔的变化，而且由于对数据点之间的解释原因。在引用 Mid State Trail 的距离时，请始终参考指南文中报告的距离作为更准确的数据。


    # 监护员


    Mid State Trail 的日常维护由志愿者监护员执行。他们的任务包括移除倒塌树木、修剪侵入的灌木、改善路面以及重新绘制标记（blazes）。一名监护员被分配一段约
    3 公里的路段，但组织可能会分配一段更长的路。监护员系统负责维持 Mid State Trail 的良好状况。预计每位监护员每年在其负责的路段至少走三趟。个人监护员的工作目前由位于
    Everett、State College、Woolrich 和 Tioga 地区的志愿者区域经理协调。《Mid State Trail 维护手册》和《DCNR
    步道标记指南》已发布在 MSTA 网站上。


    与任何志愿者团体一样，人员变动率很高，当监护员离开该地区时，就会有空段空出来。这种接替为新监护员创造了许多机会。有些监护员从匹兹堡堡、费城甚至弗弗吉尼亚州远道而来，帮助维护
    Mid State Trail，而另一些人则住在步行范围内。如果你想领养 MST 的某一段，请访问 Mid State Trail 协会网站 www.hike-mst.org
    获取更多信息。


    # 大东步道


    Mid State Trail 是大东步道 (GET) 步道网络的一部分。大东步道在系列现有步道上提供了顶级的徒步体验，这些步道正在连接成一条穿越阿巴拉契山脉的长距离步道，最终从阿拉巴马州延伸到纽约州的指湖径。


    在宾夕法尼亚州南部和马里兰州，大东步道分为东线和西线。


    GET 西线从波托马克河出发，穿越切萨皮克与俄亥运河国家历史公园，到达马里兰州的小奥尔良附近，随后通过马里兰州的格林岭州森林，在梅森-迪奇森线与 MST 交汇。GET
    西线继续沿 MST 往至亨廷顿县的 Detweiler 跑。


    东线从马里兰州汉考克出发向北使用 Tuscarora 步道，在宾夕法尼亚州富尔顿县 Cowans Gap 州公园附近的 Standing Stone Trail
    交汇；随后向北到达 Greenwood Furnace 州公园，在那里沿 MST 向北进入 Detweiler Run 自然区。


    大东步道完全穿过宾夕法尼亚州北部，到达纽约州边界，与 Crystal Hills 径（纽约指湖径的分支）相遇。


    Mid State Trail 协会是大东协会的参与成员。有关 GET 的更多信息，请查阅。


    # 公制


    MST 是美国第一个使用公制的步道。指南第二版（1973年）完全采用公制。公制是一项旨在结束文化孤立和缓解长期收支平衡问题的爱国措施。除少数侧径外，所有路径距离均使用周长两米的测距轮测量，或在没有轮数据的情况下使用
    GPS。用自制轮测量的侧径仅精确到 0.1 公里。纯属巧合，Mid State Trail 的首字母在 60 年代末州规划图中也代表公制单位。


    # 邮件补给与食品商店的使用


    MST 非常长，如果不进行补给，携带步行全程所需的食品将极其困难。在 MST 的步行范围内有几个小型邮局、杂货店、公园办公室和其他设施。非易腐食品的邮寄地址应为：


    你的名字

    c/o General Delivery

    邮局名称, PA ZIP 代码


    并标记为：

    HOLD FOR MID STATE TRAIL HIKER


    在你到达之前，留出充足的时间让邮件送达。提前写信或致电相关的邮局长也没有坏处。记住：邮局周日休息，周六也经常休息。截至 2012 年，许多农村邮局的营业时间已缩至每天仅
    30 分钟。如果你向公园办公室发送食品补给，请提前通知。公园办公室在夏季通常开放。即使公园办公室关闭，你也可以等待公园护林出现并领取包裹。请访问 www.hike-mst.org
    获取 Mid State Trail 沿线邮件补给点、食品商店和其他服务的完整列表。


    '
