    # 第 19 节：美国 6 号公路至宾夕法尼亚州 287 号公路

    WHITNEYVILLE 到 HAMMOND

    私有土地，HILLS CREEK 公园，州立狩猎场区 37 号，TIOGA-HAMMOND 湖


    第 19 节起始于美国 6 号公路，结束于 PA 287 号公路的第二个交叉口。


    特征包括田园乡村乡村、冰川遗迹、湿地和一个湖泊。第 19 节曾于 2003 年从 Hills Creek 公园开放至 Ives Run 休闲区，并在 2008
    年和 2009 年向南延伸至美国 6 号公路。


    注意！此路段位于富含气体的马塞勒斯页岩层上。由于气体开采活动增加，小径可能会出现中断。徒步前请在 http://www.hike-mst.org 检查路况。


    # 总体描述


    MST 穿过起伏的农田到达 Hills Creek 公园，跨越大坝并沿湖行。从 Hills Creek 湖的北端开始，MST 爬过一条冰川漂积物脊，穿越州立公园营地。一段简短的镇道连接段通往
    SGL 37，在那里 MST 爬上通往高高原的脊线，下降 Stephen Run 的源头，爬上高原上的更高点，然后沿 Ives Run 的东支和主干向下到达
    Hammond 湖。MST 穿过 PA 287 号公路，穿越废弃农田。


    ![](img/852e0f48d73c19a29ec51af9e23ebcc_229.png)


