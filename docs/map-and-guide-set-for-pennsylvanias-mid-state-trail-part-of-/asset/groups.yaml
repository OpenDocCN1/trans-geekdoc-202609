  md: '

    bound. From US 322 westbound continue to the intersection with Sand Mountain Rd.
    where the crossover to US 322 east can be taken. This section has a fairly good
    supply of springs and there is primitive camping in Detewiler Valley. State park
    camping at the usual state park fees is available at Penn Roosevelt. Features
    of this section are Thickhead Wild Area, the virgin timber in Detewiler Natural
    Area, and the Lewistown-Belfonte turnpike (1821).


    ## GENERAL DESCRIPTION


    The start point of section 9 is the junction with the Greenwood Spur below Bear
    Meadows Road. This junction is also the meeting point of the east and west routes
    of the Great Eastern Trail (GET) in Pennsylvania. Hiking south on the Greenwood
    Spur which is the eastern route of the GET will lead to Greenwood Furnace State
    Park and the northern trailhead for the Standing Stone Trail. From Detewiler junction
    the MST heads northeast on the old Kulp and Reichley Bros. railroad grades which
    are followed up Detewiler Valley where the trail skirts the edge of Detewiler
    Natural Area. It then crosses the south prong of Thickhead Mountain, leaving the
    Thickhead Wild Area and descending to Penn Roosevelt State Park. Lastly, it climbs
    Broad mountain and follows it east to Bald Mountain. After crossing a high valley
    it reaches the culvert under US 322.


