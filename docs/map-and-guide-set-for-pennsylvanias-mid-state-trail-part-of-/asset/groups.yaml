    In 1969 students from the Hiking Division of the Penn State Outing Club led by
    Thomas Thwaites began building the Mid State Trail. Over the years, as the trail
    grew, the need for maintainers of the trail grew as well. In 1982 Dr. Thwaites
    created the Mid State Trail Association (MSTA) to recruit volunteers and attract
    supporting members. Since then, the volunteers of the Mid State Trail Association,
    along with overseers of the trail, have spent countless hours maintaining and
    growing the trail. Bisecting the state, from the Maryland border to the New York
    state line, the Mid State Trail traverses some of the most scenic and beautiful
    parts of Pennsylvania.


