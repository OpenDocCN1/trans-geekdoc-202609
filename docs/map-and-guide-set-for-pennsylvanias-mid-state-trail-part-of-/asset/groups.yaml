    # 第 17 段：宾法尼亚 414 号公路至 287 号公路（布莱威尔至莫里斯/安特姆）提奥加州森林，私有土地


    第 17 段始于布莱威尔，结束于 PA 287，此处位于安特姆以西、莫里斯以北和威尔斯伯堡以南。景点包括松溪、斯托尼福克溪、威尔逊溪和 Anna S. 矿的幽灵景观。松溪铁路沿线斯托尼福克溪沿禁止露营。第
    17 段于 2005-2006 年开放。


    注意！该段位于富含马塞勒斯页岩地层上。由于产产增加，步径可能会中断。徒步前请登录 http://www.mst.org 检查步径情况。该段任何州土地均未计划地表活动。


    # 总体描述


    MST 沿松溪铁路步径从宾法尼亚大峡谷底部的布莱威尔处向上游延伸，然后爬升至采石场溪到达峡谷东缘。MST 横跨山缘，从顶部越过下降到斯托尼福克。斯托尼溪的湿过过引导徒步者登上罗兰德溪到达丹纳山的宽阔高原。下降进入滑空谷，连接到通往莫里斯村的小径。MST
    缓升回到高原边缘，在高处穿过蛇行叉。步径进入巴斯伍德溪，穿岩石上升到威尔逊溪西缘，在山缘边缘的缝隙间穿行，经过旧煤矿遗迹和一个全景景台，最后沿窄碎石路下降到威尔逊溪。


    # 第 17 段等高线图

    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_201_0.png)


    # 宾法尼亚 414 号公路至 287 号公路（布莱威尔/莫里斯/安特姆）详细描述


    # NB (km)


    0.00 PA 414，布莱威尔酒店前的铁路步径（撰稿时关闭）。划艇停车场（配水泵、外厕和垃圾桶）在 PA 414 前 0.15 km 处。过停车场后再 0.18
    km，即穿过桥后后是波恩径，它是中州步径和西缘步径之间的连接径。请参阅指南 D 部分获取波恩径的详细步径数据。


    2.40 NB: 沿松溪铁路向北/右走。NB 徒步者检查 PA 414 单车桥布朗溪的情况。如果不理想，强烈建议沿 PA 414 向东前往莫里斯。

    SB: 左转，沿 PA 414 穿过布朗溪。


    1.90 越过采石场溪的桥，由桩子标记。禁止露营。


    2.10 NB: 穿过桥，右转进入石阶绕左转至陡峭小径，在急转弯后很快变缓。

    SB: 左转，沿松溪铁路向南走到达布莱威尔。


