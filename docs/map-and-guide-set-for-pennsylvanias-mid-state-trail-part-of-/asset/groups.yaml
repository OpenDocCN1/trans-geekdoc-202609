    # NB Features/Directions SB (km)


    19.16 Main intersection of old Nelson. On NE corner, picture an old Victorian
    home with widow’s walk, not relocated but bulldozed. Fuel up at the gas stations
    on two other corners. Funeral on SW corner, now passed on itself. At the corner,
    an unblazed side trail descends trail-compass-north to lake shore in 65 m. The
    concrete steps barely holding on between tree roots, beside road on your right,
    once descended to homes on either side at the edge of the lake, the Lugg family
    farm now under the lake. The farm house moved up the hill behind you was at the
    time occupied by Ila Lugg Wiley, who in 70''s fought to move the village as a
    community, not just the individual residents. She lived a long full life nearly
    100 years. Imagine her daughter as a little girl, learning to ride a bicycle,
    straying from the road into a tree, now visible as a large stump in the lake.
    The fertile bottom land on both sides once grew tobacco. Or turn uphill from the
    corner on an overgrown gated road to reach new highway in 104 m.


