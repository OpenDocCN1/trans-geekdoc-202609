    # NB 北向/SB 南向 方向 (km)


    ### 混凝土基础。来自 Anna S. 深层矿（1905年至1937年）的煤炭曾通过桶子在支撑在这一基础上的缆索电道车跨越威尔尔逊溪（Wilson Creek）山谷，到达
    Antrim 的铁路。由于大多数 Anna S. 的矿工住在 Antrim，有些人可能曾动过乘坐桶子以节省穿过山谷的步行路。根据当地传说（没有州矿业检查员的记录支持），在一次冬夜，电道车停电了，导致最后一名矿工坐在高悬山谷上方的小桶上被冻死。**


    22.23


    1.77


    NB: 在卡车道上保持平路。


    SB: 向左下山卡车道。向左看标记物。


    “幽灵全景（Haunted Vista）”。威尔尔逊溪山谷的全景、接下来的 4 公里 MST 路线以及对岸的 Antrim。这堆岩石的底部正在侵蚀并降低下方
    150 米处威尔尔逊溪的水质。长期计划要求移除这一景观中的人为元素。**不要在此处生火**，这里的营地火灾极难扑灭，**你将承担所产生的费用**。


