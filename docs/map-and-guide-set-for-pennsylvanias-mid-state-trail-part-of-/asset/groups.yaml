    ![](img/852e0f48d73c19a29ec51af9e23eb3cc_291_0.png)


    1969年，宾州州大学野外俱乐部（Penn State Outing Club）徒步部门在 Thomas Thwaites 的带领下，开始修建中州步道。多年来，随着步道的扩张，对步道维护人员的需求也随之增加。1982年，Thwaites
    博士建立了中州步道协会（MSTA），旨在招募志愿者并吸引支持成员。从那时起，中州步道协会的志愿者同步道监管者花费了无数小时维护和扩展步道。中州步道横穿整个州，从马里兰州边界到纽约州界，穿越了宾夕法尼亚州一些风景最优美的部分。


