    图 2：所提方法、随机采样法和基于熵方法的每周期平均交并系数（mOU）。


    本报告中的方法通过在每个周期内采样最少代表性的交测线来达到最佳效果。这是因为在每个周期中，网络被强制学习与训练集差异最大的样本，以搜索对所学自动编码器流形性能的实验。


    最后，3a 和 3b 展示了两个不同活动周期下数据集中交测线的重建误差剖面和交叉熵剖面（高亮部分）。请注意，只有在具有地面真值（在本情况下为真实值）时才能观察到潜变量，而前者适用于没有地面真值的情景。有趣的是，如图所示，交叉熵误差剖面最终决定了与重建误差剖面相关的性能。例如，在交测线
    500 附近有一个峰值，大约在另一个处也有一个峰值。这表明网络尝试为重建和分割任务学习相似的表示，因此在某一个任务中表现较差的训练样本在另一个任务中也可能表现。


    ## 4. 结论


    ![](img/766fb7f81122e8d898202e3a8c3d3113_3_1.png)


    图 3：两个重建误差剖面及其相应的熵误差剖面图。


    本文描述了一种主动学习方案，用于在对手动分割的数据集进行解释任务时识别出最具信息量的样本。在初始和已标记的交测线上，针对重建（无监督）和分割（有监督）任务联合训练了一个编码器-解码器架构。网络用于对训练实例进行推理，以获得重建误差剖面。随后对对应误差最大的训练示例进行标记，并添加到数据集中用于下一个训练周期。其底层假设是，由于网络的共享表示，该样本提供了关于分割任务数据集最丰富的信息。通过与文献中的其他标准采样方法进行比较，验证了该方法的有效性。所提方法在完整数据集上达到了
    0.773 的最高 mOU 值，优于其他方法。


