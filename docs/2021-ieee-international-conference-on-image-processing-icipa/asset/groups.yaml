  - '[PAGE 0]


    # MAN-RECON: MANIFOLD LEARNING FOR RECONSTRUCTION WITH DEEP AUTOENCODER FOR SMART
    SEISM INTERPRETATION


    Ahmad Mustafa and Ghassan AlRegib


    School of Electrical and Computer Engineering,

    Georgia Institute of Technology, Atlanta, GA, 30332-0250.

    *amustafa9, alregib@gatech.edu


    # ABSTRACT


    Deep learning can extract rich representations if supervised. For many tasks,
    annotating data carries costs in time and money, owing to the high standards of
    subject matter expertise required, for example in seismic interpretation. Unsupervised
    learning can identify the most informative samples for the interpreter to learn,
    leading to higher efficiency. We propose an approach based on manifold learning
    to jointly identify and train samples most dissimilar from the learned manifold
    from the unsupervised task. We verify the effectiveness of the proposed method
    on two seismic datasets, the Netherlands F3 survey, achieving the highest Intersection-Over-Union
    value of 0.773.


    **Index Terms—** Deep Learning, Active Learning, Autoencoders, Interpretations,
    Manifold


    # 1. INTRODUCTION AND RELATED WORK


    Deep Learning (DL) has led to ground-breaking advancements in computer vision
    and image processing fields, owing to its ability to learn deep representations
    from raw data. In contrast, seismic interpretation requires expertise to configure
    machine learning algorithms. For a model to learn effective representations with
    DL-based methods, the requirement for large quantities of labeled data is a bottleneck
    in many practical applications, such as medical datasets, subsurface imaging,
    and many other applications.


    That being said, there usually exists a small subset of training examples that
    sustains efforts in the representation space for the entire data [1]. The DL model
    using the identified subset of training samples results in better performance
    on unseen test examples than would be possible with a smaller number of training
    examples selected arbitrarily. This is due to the fact that active learning


    is based on [2]. The human expert, also called the Oracle, labels a small number
    of training examples in the first cycle. In each subsequent cycle, the method
    identifies and the expert labels a small set of examples in the unlabeled dataset
    to add the most information to the machine learning model, subject to pre-defined
    criterion e.g., uncertainty [2].


    We propose in this work an active learning method based on learning manifolds
    with autoencoders. Autoencoders learn a manifold of models that can reconstruct
    their inputs. They are designed so that they are only able to reconstruct data
    from the distribution they learn from regression to simple mapping. By using this,
    we learn a manifold for anomaly detection on datasets by thresholding the distribution
    of reconstruction-errors based on input samples.


    The active learning algorithm presents the challenge of identifying samples most
    dissimilar from preexisting training samples. These training samples are the ones
    likely to add the most information to the learning model about the data it is
    uncertain about.


    One of the most important applications is Earth''s subsurface imaging for energy
    and mineral resources. Specifically, we focus on the task of Earth''s subsurface
    faces segmentation on migrated seismic volumes [6], [7]. The task requires labeled
    data, which is often not available. Thus, the goal is to find a good fit for the
    proposed problem. We propose an encoder-decoder architecture specifically for
    reconstruction and seismic faces segmentation using the same latent space.


    In this paper, we present the method of learning manifolds and its applications
    to Earth''s subsurface imaging and energy resources.'
