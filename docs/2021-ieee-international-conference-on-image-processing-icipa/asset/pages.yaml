    \ solved by optimizing a weighted sum of the reconstruction and cross-entropy\
    \ loss terms as shown above:\n\n# 2.2. Architecture\n\nThe network architecture\
    \ used in the work is using a convolutional autoencoder with a contracting and\
    \ expanding path. Each block in the contracting path consists of convolutional\
    \ layers that decrease activations by a factor of 2. In contrast, the network\
    \ in the expanding path consists of a transposed convolution followed by a regular\
    \ convolutional layer. The transposed convolution is used to upsample the activations\
