    # 4. CONCLUSION


    ![](img/766fb7f81122e8d898202e3a8c3d3113_3_1.png)


    Fig. 3: Plots of two reconstruction error profiles and their corresponding entropy
    error profiles.


    The paper describes an active learning setup to identify the most informative
    examples encountered with the tasks of interpretation on a manually segmented
    dataset. An encoder-decoder architecture is jointly trained for the tasks of reconstruction
    (unsupervised) and segmentation (supervised) on an initially and labeled crosline
    section. The network is used to perform inference on training instances to obtain
    a reconstruction error profile. The training example corresponding to the highest
    error is then labeled, and added to the dataset for the next training cycle. The
    underlying assumption is that the sample provides the most information about the
    dataset for the segmentation task due to the shared representation of the network.
    The efficiency of the method is verified by comparing it to other standard sampling
    approaches in the literature. The proposed work reaches the highest mOU value
    of 0.773 on the complete dataset over other approaches.'
