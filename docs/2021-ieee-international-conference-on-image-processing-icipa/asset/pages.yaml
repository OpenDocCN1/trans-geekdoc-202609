    \ in the dimensions of the activations. Overall, it is a very standard encoder-decoder\
    \ architecture used to achieve a more global receptive field while minimizing\
    \ the number of channels to learn a rich representation where the decoder reverses\
    \ the denoising effect of the encoder with a simultaneous reduction in channel\
    \ size.\n\nThe input to the network is a complete seismic section containing 255\
