    manner using any other boosting approach and generalizes by optimization of an
    arbitrary differentiable loss function [24][25].


    +   4) AdaBoost Classifier : AdaBoost is an ensemble method which is classifier
    in an iterative fashion [26][27]. In each iteration, it chooses the one weak classifier
    and re-learns to the weighted error function.


