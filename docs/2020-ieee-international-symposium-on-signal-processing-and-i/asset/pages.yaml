    # III. QUANTUM COMPUTING AND ARTIFICIAL INTELLIGENCE


    # A. Quantum Computing


    Quantum computing (QC) is a function of Quantum Mechanics and Quantum Information
    [12]. The Quantum Information that contains the state of QC. QC has the properties
    of Quantum Mechanics like Superposition and Tunneling [12]. Quantum Information
    algorithms are used within the realm of Artificial Intelligence in Quantum system.
    QML [13] is a field that aims to copy quantum algorithms to perform ML tasks [14],
    QML makes a revolution in speed and performance [15].


    # B. Artificial Intelligence


    The binary classification (Duda 2001) is the classifier which distinguishes entity
    into two categories as classification rule [16]. Dwave quantum engine has been
    steered by a discrete optimization engine, which tasks formed as a unconstrained
    binary optimization (QBO) [17][18].


    Training a binary with the quantum adiabatic algorithm (Naveen et al., 2008),
    which explained binary classification using ensemble method is measurable to the
    QC. The tasks were designed in such a way that rapid linear classification of
    group of weak learners and QC to modify the weights and process of learning that
    attempts to reduce the error and number of weak learners [17][19].


    # C. Artificial Intelligence Models


