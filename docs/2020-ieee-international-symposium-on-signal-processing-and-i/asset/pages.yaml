    ***Abstract—** This paper presents a quantum version of machine learning (ML)
    algorithm applied to a diabetes dataset. Diabetes is a sixth disease in the world
    and unfortunately to millions are affected every year. Using various quantum (QC)
    with Quantum Machine Learning (QML) techniques in the healthcare system to improve
    and accelerate the accuracy of existing ML models. This quantum system tackles
    a binary classification problem of patients with two different classes: patients
    with diabetes and without diabetes. We compare classical and quantum algorithms
    using Random Forest, Gradient Boosting, AdaBoost, XGBoost, Qboost.


    ***Index Terms—** Binary classification, Type 2 Diabetes Mellitus, Qboost, Quantum
    vs Classical computing.


    Diabetes is the sixth cause of death in the world, but Type 2 diabetes mellitus
    is a leading public health issue that presents a considerable risk involving [1–2].
    46 million people are living with diabetes, 232 million people are living with
    undiagnosed diabetes, 4.2 million mortalities happen annually [3]. This disease
    can affect all the vital organs of the human body, which may cause some of the
    major diseases such as blindness, renal failure, hypertension, and stroke. The
    increasing risk factors of diabetes patients may rise to 700 million by 2045 worldwide,
    374 million are growing at risk of Type 2 diabetes. 11 million children are living
    with diabetes and 22 million newborns are affected during pregnancy [4]. In addition
