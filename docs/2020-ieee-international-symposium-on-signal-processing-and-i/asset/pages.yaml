    It uses non-leaf design to a variety of rules and leaves to identify identities
    (+/-) for every data [20]. It is necessary to format a decision tree by alerting
    with the entropy. Controlling the depth of a decision tree determines the subsets
    of the datasets. Here $c_n$ is the feature detector, $w_n$ are the weights and
    b is to be optimized.


    +   2) Forest Classifier : Random forest (RF) is an ensemble method, it merges
