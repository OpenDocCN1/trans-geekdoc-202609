    # IV. EXPERIMENT DESIGN AND RESULTS


    # A. Experiment Design


    The training of the models is implemented using Python 3 and ML scikit library.
    The help of the API (Application Programming Interface) to prepare and acquire
    the DWA system Quantum Processing Unit (QPU). Whereas the DWA system allows Qboost
    to run on a dedicated QPU. The training data is used to build each classifier,
    and the test data is compared with classifiers with given known labels. The labels
    +1 and -1 are representing diabetes with acute and diabetes without acute respect,
    respectively, we split the data into 80% for training and 20% for testing, keeping
    the same ratio of classes in the subset (50% of +1 and 50% of -1).


    Ensemble methods [25] construct a strong classifier to enhance the predictive
    model by gathering all weak classifiers: like bagging, boosting and voting to
    improve prediction.


