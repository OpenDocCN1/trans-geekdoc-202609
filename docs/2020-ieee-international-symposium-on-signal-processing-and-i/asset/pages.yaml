    # V. CONCLUSION


    In this study, we proved that our approach towards the binary classification of
    datasets using the new models are feasible and fast, when run on a quantum system.
    The new models are based on the ensemble learning by combining classical and quantum
    classifiers to get a result. The obtained results are satisfactory with accuracies
    of 69% and 68.38%, a Recall and F1-score are 69% and 68.38% for the binary classification
    in the Classical and Quantum system. The testing system is important for better
    accuracy, but the classical system takes longer than the quantum system to classify
    our datasets. We conclude that including more and more algorithms in the


    Voting system remains the same. The Voting Model 1 and Voting Model 2 takes less
    classification time in comparison to voting time 1, we choose the voting model
    2 have better performance than the voting Model 1. Quantum algorithms like New
    Model 1 and New Model 2 produces the similar accuracy, recall, F1 scores and reduces
    the computational time. QC will be a useful and faster system in real-time application.
    The future direction is to train with different datasets like qSVM and multi-label
    classification of our improved system.


