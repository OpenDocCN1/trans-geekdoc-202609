    ## V. 结论


    在这项研究中，我们证明了使用新模型对数据集进行二分类的方法在量子系统上运行时是可行且快速的。所获得的结果令人满意，准确率达到 69% 和 68.38%。测试系统对于提高准确性至关重要，但经典系统所需的时间比量子系统长。在医学领域，需要高特异性。我们选择投票模型
    2 是因为它优于模型 1。新模型 1 和新模型 2 等量子算法产生了相似的准确率、召回率、F1 分数并减少了计算时间。量子计算在实时应用中将是一个有用且快速的系统。未来的方向是使用不同的数据集进行
    qSVM 和多标签分类。


