    ## 机器学习应用于糖尿病数据集

    量子与经典分类


    Danyal Maheshwari

    eVida 研究小组

    德比大学

    西班牙比尔巴鄂

    danyal.maheshwari@uod.edu


    Begona Garcia-Zapirin

