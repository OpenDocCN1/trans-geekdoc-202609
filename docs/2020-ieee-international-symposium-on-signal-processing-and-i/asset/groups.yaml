    ## V. CONCLUSION


    In this study, we proved that our approach towards the binary classification of
    datasets using the new models are feasible and fast, when run on quantum system.
    The obtained results are satisfactory with accuracies of 69% and 68.38% for. The
    testing system is important for better accuracy, but the classical system takes
    longer than the quantum system. In the medical field, high specificity is required.
    We choose voting model 2 have better performance than voting 1. Quantum algorithms
    like New Model 1 and New Model 2 produce similar accuracy, recall, F1 scores and
    reduce computational time. QC will be a useful and faster system in real-time
    application. The future direction is to train with different datasets like qSVM
    and multi-label classification of our improved system.


