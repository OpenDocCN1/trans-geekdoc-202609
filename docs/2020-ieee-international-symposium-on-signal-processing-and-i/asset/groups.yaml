    美国肯塔基州路易斯维尔

    danielsiersoso@louville.edu


    ***摘要—** 本介绍了一种应用于糖尿病数据集的机器学习（ML）算法的量子版本。糖尿病是世界第六大疾病，遗憾的是，每年有数百万人受影响。在医疗保健系统中使用各种量子（QC）结合量子机器学习（QML）技术，以提高和加速现有机器学习模型的准确性。该量子系统解决了两个不同类患者的二分类分类问题：糖尿病患者和非糖尿病患者。我们比较了使用随机森林、梯度提升、AdaBoost、XGBoost
    和 Qboost 的经典算法与量子算法。


    ***索引术—** 二分类分类、2 型糖尿病、Qboost、量子与经典计算。


    糖尿病是全球第六大死因，但 2 型糖尿病是一个重大的公共健康问题，构成了巨大的风险 [1–2]。有 4600 万糖尿病患者，2.32 亿人患有未诊断的糖尿病，每年有
    420 万人死亡 [3]。这种疾病会影响人体的所有重要器官，可能导致盲目、肾衰竭、高血压和中风等某些主要疾病。全球糖尿病患者的风险因素到 2045 年可能会增加到
    7 亿，其中 3.74 亿面临 2 型糖尿病的风险。1100 万儿童患有糖尿病，2200 万新生在怀孕期间受到影响 [4]。此外，T2DM 的复杂性和流行性可能会导致医疗成本增加。一些研究表明，控制血糖水平是阻止
    T2DM 进展和复杂化的重要方面。糖尿病患者血糖的降低减少了入院率和死亡率 [5]。已有若干研究致力于分析机器学习和深度学习来预测 T2DM 患者的急性结果
    [11][6][7–8]。所有这些经典方法都使用传统计算机。本文使用了量子处理单元（QPU）并将其与经典方法进行比较。QC 是指数级的，且许多技术已经实现了极高的速度。QC
    技术已准备好达到在未来必须实现现实世界应用的水平 [7]。在医疗保健系统中使用 QML 技术的 QC 来提高和加速现有机器学习模型的准确性，是否能允许不同的方法理解复杂性？量子机器学习，例如应用于糖尿病数据集的
    Qboost 分类器，将其与经典分类器进行性能比较。这为将真实世界数据集应用于 QML 技术的研究提供了有用信息 [9]。本文从准确性、特异性等方面比较了经典算法和量子算法。


    ## I. 引言


    本文由 5 部分组成。第一部分介绍量子计算、机器学习和糖尿病。第二部分介绍经典算法和量子算法。第四部分涵盖了实验设计和结果评估，而结论在最后部分。


    ## II. 材料


    ### A. 患者与数据

    本研究基于 Oskaziteta（基础健康服务）的电子健康记录（EHRs）。在本研究中，分析和临床参数信息是从 PEST 数据库获取的。在该数据库中，分析是根据国际疾病分类修订版（ICD-CM）进行的，并应用了分期系统调度。它属于分析、治疗和化学类别。2010
    年，PEST（分层计划数据库）启动，旨在根据约翰·霍普金斯调整临床组-max 系统对巴斯克公民进行分类 [10]。从之前的文献中可以获得更详细的说明 [11]。关于
    2 型糖尿病出现在特定年龄（但更多发生在 40 岁或以后），患者在 35 岁的情况已被排除。这是在三个时期内建立并完成的（年份：2001-09-01 至 2008-08-31；年份：2008-09-01
    至 2010-08-31；年份：2010-09-01 至 2011-08-31）。贯穿期间。


    ## III. 量子计算与人工智能


    ### A. 量子计算

    量子计算（QC）是量子力学的功能 [12]。QC 技术已准备好达到在未来必须实现现实世界应用的水平 [7]。在医疗保健系统中使用 QML 技术的 QC 来提高和加速现有机器学习模型的准确性，是否能允许不同的方法理解复杂性？量子机器学习，例如应用于糖尿病数据集的
    Qboost 分类器，将其与经典分类器进行性能比较。


    ### B. 人工智能

    将真实世界数据集应用于 QML 技术的研究 [9]。本文从准确性、特异性等方面比较了经典算法和量子算法。


