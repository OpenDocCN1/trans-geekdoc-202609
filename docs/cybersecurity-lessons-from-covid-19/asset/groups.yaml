    # CRUISIN’ FOR A BRUISIN’


    The travel industry is taking a beating over CoVID-19. First it was the airlines
    who were the bad guys, for spreading it around the globe. Then it was the cruise
    ship industry, for being floating Petri dishes for growing new cases and becoming
    virus hot spots all on their own.


    Frankly, I’m a bit surprised. With all the norovirus activity on cruise ships
    over the past decade, I would have thought they’d have had a better handle on
    how to deal with highly contagious viruses specifically. You know: building with
    easily cleanable surfaces, having highly filtered ventilation systems—that sort
    of thing. But no, apparently they just sailed along, blithely throwing infected
    passengers off ships and trying to avoid giving refunds. Until now.


    Once again, yet another example of how most people refuse to prepare, even when
    they’ve been given mild warnings that something might happen.


    Until it’s too late …


    The various ships that were quarantined, or refused berthing rights, provided
    ample fodder for the news media to find discontented passengers who were only
    too willing to complain about their situations.


    These various interviews got to be pretty boring after a while. They tended to
    sound the ‘Somebody (else) has to do something!’ drum pretty consistently. And
    then when somebody did do something, were the interviewees grateful? No, something
    was always wrong. ‘We had to pay for our flights home!’ ‘We had to quarantine
    ourselves once we got home!’ ‘The quarantine accommodations provided for us weren’t
    in four-star hotels!’


    I’m sorry but, as an emergency management worker, I have pretty much zero sympathy
    for these stories. Emergency management is for emergencies. It isn’t going to
    be perfect; it’s part of a vastly imperfect situation. We are trying to provide
    you with the basic necessities of life. You have food and shelter and will survive
    the next two weeks. If you feel that your situation is not optimal right now,
    you might want to factor that in the next time you want to do something ‘exciting’.


    # RISK MANAGEMENT


    So people have lost jobs, friends, family members, life as they know it, and lives.


    And the authorities are telling people, begging people, to stay apart and stay
    inside and stay away from crowds.'
