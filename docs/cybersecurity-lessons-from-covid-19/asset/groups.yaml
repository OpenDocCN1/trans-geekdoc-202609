    detecting a whole virus or just the parts of it that we are using as signatures.
    We know that masks, even N95 masks, aren’t perfect, and we know that masks are
    better at preventing you (if you are already infected) from spreading the virus
    to those around you than they are at protecting you from getting the virus. We
    know that if you are in a particularly high-risk environment, wearing a mask is
    better than nothing. But we don’t know how much better than nothing, and we don’t
    yet have really good data about which high-risk environments are those that a
    mask might provide protection in. Therefore, we are talking about risk (which
    we will discuss further later on) and, as we in security know all too well, risk
    always involves a level of chance and probability.


    Because of the probabilities involved as well as the huge areas where we simply
    don’t yet have enough information, even an expert is going to have trouble giving
    you a hard-and-fast, yes-or-no answer to any question. If you stay at least two
    metres away from everyone, are you safe? Well, not really. There are still surfaces
    that someone infected might have touched or breathed droplets onto. Or the droplets
    may be smaller or the air currents might be stronger. There is not a magical barrier
    at two metres, but there is a good chance that the distance will keep you safe.
    Or safer. Are you safer at two metres than one and a half? Yes. How much safer?
    Don’t know. Is a two-metre distance a good rule? Yes. Is it perfect? No.


    Vancouver has a rather infamous area known as the Downtown Eastside. In a confined
    area (30 blocks), there is a large population (roughly 15,000) of street people,
    most having underlying health conditions. When the pandemic hit, it was considered
    a kind of foregone conclusion that the virus would sweep the area and cause massive
    damage and a huge death rate.


    Didn’t happen.


    Now a study is under way to try to find out why. It’s possible that simply some
    kind of social isolation between the street population and the rest of society
    has kept them safe. But it may be due to some kind of immune system protection
    that could be further examined and developed. It’ll be interesting to find out.


    Because there are so many areas where our knowledge is limited and imperfect,
    experts may (quite legitimately) disagree on various points. Different ideas and
    the importance of certain ideas may come into contention. So, in regard to masks
    (which have come to be a huge source of contention and which we will return to
    in other parts of this book), one expert may (quite honestly and truthfully) say
    that masks do not provide much absolute protection in terms of keeping you from
    getting infected. (As Tevye would say, you’re right.) Another expert, just as
    honestly, could point out that, in areas of high viral load, a mask (backed up
    by a gown and face shield) is better than nothing. (As Tevye would say, you’re
    right.) Yet another expert might note that, in populations where the rates of
    infection are higher and because of asymptomatic transmission, wearing a mask
    demonstrates that you are concerned (to the point of personal inconvenience) about
    protecting those around you rather than yourself. (As'
  - '[PAGE 31]


    Tevye would say, you’re right.) And then some random bystander would point out
    that all of these points of view seem to contradict each other. (To which Tevye
    would say, you know, you also are right.)


    Because of the lack of knowledge, both on the part of the general public and also
    because the experts can’t give 100% assurance (which is another thing that we
    know in security: 100% protection is impossible), the fear comes back into play.
    Mr. John Q. Public doesn’t know. And the experts he is hearing on the news media
    don’t seem to be able to give single, solid, consistent, one-size-fits-all answers.
    So his decision-making starts to fixate on concepts that are backed, if at all,
    by very flimsy evidence.


    In evolutionary terms, this is actually a good thing. Over a large population,
    the people who fixate on good ideas tend to survive and so those ideas become
    part of either brain patterns or culture and get passed along. Those who fixate
    on, well, not-very-useful ideas tend to die and remove themselves from the gene
    and culture pools. If you’ve got hundreds of thousands of independent individuals
    and many years to do the weeding, it’ll benefit the species.


    Unfortunately, in a modern, complex, and interdependent society, with a disease
    that arises out of nowhere and spreads rapidly through the population, fixating
    on random concepts just isn’t very effective. You don’t have the time for evolutionary
    pressures to work, and random chance is still very much involved. Some people
    with good ideas get unlucky and die. Many people with really stupid ideas survive,
    simply because they haven’t encountered the virus in a way that has all the factors
    necessary for infection. And because our society is so interdependent, you, having
    good ideas, may still be at risk because you have to rely, for many of the essentials
    of life, on people who may believe that there are Ayurvedic cures for the disease
    and therefore don’t think that handwashing or physical distancing is important.


    But errors, ignorance, fear, and even the honest contention of ideas don’t cover
    all of the untruth that is being spread about CoVID-19. Unfortunately, as we have
    seen during every major disaster, there are those who are willing and eager to
    spread lies for their own benefit.


    There are many such frauds. One type of fraud is simply clickbait. People create
    Websites or mailing lists or post on social media with an attractive (to some)
    or appalling story. They usually say that the story is true. The point is to get
    people to visit a Website. The fact that people visit the site drives numbers
    that are used, sometimes completely fraudulently, to claim advertising revenue.
    In other cases, the Website may be used to spread malware. Or sometimes they are
    setting up supposed charitable sites and simply raking in the donations. Or, under
    the guise of signing people up for a cause or campaign, to phish for personal
    information, which can then be used in further frauds.


    A huge attack on Washington State and its unemployment system netted hundreds
    of millions of dollars for a gang (probably based in Nigeria). The'
  - '[PAGE 32]


    gang used personal data gathered from previous data breaches, and possibly phishing
    attacks, to generate huge numbers of phony claims. The US Secret Service issued
    an alert, noting that North Carolina, Massachusetts, Rhode Island, Oklahoma, Wyoming,
    and Florida were also subject to attacks. Part of the scam, in this case, relied
    upon the fact that regular postal mail was used as part of the check on fraud
    in the system but, owing to the pandemic, postal mail was being delayed.


    At about the same time, here in Canada, we found out about a completely evil scam
    where the fraudsters would call up seniors and, for a fee, help them apply for
    the Canada Emergency Response Benefit (CERB). The CERB is a program for laid-off
    workers and applying for it is free. Not only would the seniors be out the fee,
    but if they did manage to get the benefit, they would be on the hook to pay it
    back since they were ineligible.


    Sometimes, the stories themselves are attacks. Many nation-states are known for
    disinformation. In the past, fooling your enemy was seen as a legitimate tactic
    of war. These days, many nations seem to see themselves as constantly at war—with
    everyone. Therefore, creating a story that keeps another government off balance
    is a good thing. Creating a story that keeps the other country’s population off
    balance, and possibly distrustful of their own government, is possibly even better.
    (So, even if you don’t like the party in power, don’t be too quick to believe
    anything bad you hear about them. You may be being manipulated by someone else.
    The Carnegie Mellon study found that most of the postings from bot accounts were
    aimed at creating division in America.)


    Sometimes, it isn’t even to their own benefit. As the saying goes, some people
    just want to watch the world burn.


    # AVAILABILITY


    # COVID-19, Toilet Paper, Hoarding, and Emergency Preparedness


    Toilet paper? Really?


    Of course, I’d seen the news stories showing streams of shoppers with carts full
    of toilet paper. The news stories all showed Costco, so I was hoping that maybe
    it was only a Costco issue. But, no. On my way home one night, I stopped for some
    groceries and the toilet paper aisle in my local Save-On was pretty bare. And
    it got worse.'
