    Not only do the factors of age and underlying medical conditions come into play,
    but also the factors of close proximity, lack of ‘personal space’, common eating
    and recreational areas, and staff constantly moving between residents. As generally
    provided in Western societies, elder care is almost a ‘perfect storm’ of risk
    factors for this particular disease.


