    Training in all of this is available. And, in an emergency, having trained people
    is probably more important than having stockpiles of tents. Trained people can
    make or improvise shelter.


    Maybe your municipality or county doesn’t have a formal emergency structure. In
    that case, there are organizations covering the gap. In Canada, the Red Cross
    and Salvation Army are two of the groups that have been working on this for years
    and have specialists. In BC, we have courses provided by the Justice Institute
    in a number of areas. The provincial government has created a marvellous structure,
    ensuring consistent organizational layout for all sizes and types of disasters
    and all types of response. But we don’t bother reinventing the wheel. In our formal
    training curriculum, a number of the courses are prepared, provided, and run by
    the groups that have been doing it for years and know it best. If your government
    doesn’t have the courses available, find those who do. They are around.


    (For those who have security related certifications, like the CISSP [Certified
    Information Systems Security Professional], ongoing professional education is
    a requirement. Constant complaints are that training is expensive and getting
    the credits costs too much. All kinds of training related to business continuity
    and disaster recovery are available and most of them are free.)


    Get trained. Volunteer. You’ll get a wealth of experience that will help you plan
    for all kinds of events, not just for major disasters but for the minor incidents
    that plague us and our companies every day. You’ll be ready for the big stuff
    too. You’ll be able to keep yourself and those near to you safe. You’ll be able
    to make a difference to others, certainly reducing suffering and possibly saving
    lives. If and when something major happens, you will be a part of the infrastructure
    necessary for the response to be effective. You’ll be part of the solution rather
    than part of the problem.


    # LEADERSHIP


    In all of this there has to be leadership. There is a requirement for a champion
    to get BCP going in the first place. Someone has to do the herding of cats that
    is typical of the planning process itself. The team must be driven through the
    tough times when it seems nobody is on your side. There is a need to encourage
    and acknowledge the team on the rare occasions when somebody does notice that
    they’ve done something important. And, most of all, somebody has to be in charge
    during the actual disaster.'
