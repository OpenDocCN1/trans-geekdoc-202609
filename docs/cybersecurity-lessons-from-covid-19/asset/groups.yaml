    他们实际上并没有违反任何规则。那个不戴口罩的人？她患有慢性阻塞性肺病，对她来说口罩几乎是死刑。那个戴口罩的人？他没有新冠肺炎，但感冒了需要买杂货，但想尽量减少把感冒传染给别人的风险。


    我确实理解一些记者以及他们的部分动机。我们都承受着巨大的压力。我们可能正处于生命危险之中。我们肯定没有过着我们希望的生活：我们所知晓的生活已被无限期暂停。而那个‘无限期’只会加剧压力。我们不知道这什么时候会结束。我们想要有人来责怪。比那些做我们不赞同的事的傻瓜更好的替罪羊还有谁呢？好吧，亚历山大·索尔仁尼琴观察到了非常相似的事情，并注意到了公众的相同反应。在《古拉格群岛》（Harper
    & Row, 1973）中，他写道：‘如果一切都这么简单就好了！如果世上真有在暗中作恶的坏人，只要把他们从我们中间分离出来消灭掉就够了。但善恶的分界线贯穿于每个人的心灵。而谁愿意毁掉自己心灵的一部分呢？’


    有一个很棒的原则，当你觉得人们似乎专门以伤害你为目的行事时。它被称为 Hanlon’s razor，其表述大致为‘Never attribute to malice
    that which can be adequately explained by stupidity’。换句话说，停下来，深呼吸一下，考虑也许他们并不是要‘get’你。也许他们不知道你知道的事。也许他们没有你聪明。也许从他们的角度来看，他们已经尽力了，即使这种尽力并不完美。也许，与其对他们发动攻击，更有效的做法是思考如何帮助他们做出更好的决策并采取更好的行动。


    听起来不错，我听到你这么说。但这对安全有什么启示呢？嗯，想一想的话，相当多。甚至在我们深入探讨人员管理问题之前，先想一件事。为什么我们要做安全？


    我们做安全并不是因为我们懂技术。（希望我们有这方面的背景。）我们做安全也不是因为好玩。我认为它很有趣：很多人不同意。其中一个就是我的朋友 Ron，他在三十多年里一直是温哥华安全特别兴趣小组（SIG）的坚定支持者。他为我们辛勤工作，做了许多没人愿意做的琐碎行政工作，而且总是可靠。当他从安全领域的日常工作退休时，我问他是否还会来参加
    SIG 会议。他说不会：他从来就不是特别对安全感兴趣，只是把它当作工作来做。


    虽然这不是职业规划的好例子，但它是对“我们为什么要做安全，或应该做安全”这个问题的完美回答。Ron 做安全（而且做得很好）是为了支持他的企业。我们做安全是为了支持各自的企业、雇主和同事。


    我们这样做是为了对周围的人友善，并保护同事的安全，有时也保护社区的安全。


    从这个角度来看，对你对安全的整体态度可能极其重要。作为安全专业人员，我们常被视为阻碍：我们是‘the knights who say no’。我们是总是告诉别人他们不能做什么的人。而我们自己也常常如此看待自己：我们是知道风险的人，必须阻止这些傻瓜伤害自己。


    但，当你换个角度想——我们实际上是来帮忙的——这会带来很大不同。我们说“不”是有实际原因的，并不是为了阻碍，所以也许我们不必说“不”。也许我们可以说‘yes,
    but’。所以当下一个 C-suite 高管从机上杂志得到下一个伟大点子，想在所有登录上实施区块链时，你可以告诉他区块链是一个引人入胜的研究领域，你非常乐意帮助实施，但要正确设置需要大量工作，所以你假设他会支持你要求
    $500 K 的初始实施费用以及额外两个全职等效（FTE）岗位来管理和维护它。


    好吧，也许这是一个糟糕的例子——你知道他不会同意，你再也听不到这件事了，所以这相当于说不。那么，也许，当你发现很多员工选择非常愚蠢的密码时，你可以在密码选择的安全意识培训中先说，你知道员工想完成任务，他们的系统账户就是为了帮助他们工作。但如果他们选择容易猜的密码且账户被黑，公司必须在问题解决前收回他们的账户（因此也相当于收回他们的职位），而你有一些建议可以帮助确保他们的账户更安全。你是来帮忙的。为了友善。


    ## 保持冷静


    2020 年 5 月 22 日，Dr. Bonnie Henry 被 Gitxsan First Nation ‘adopted’ 并被赋予一个 Gitxsan
    名字。该省的首席医生被命名为 ‘Gyatsit sa ap dii’ m’，意为 ‘one who is calm among us’。


