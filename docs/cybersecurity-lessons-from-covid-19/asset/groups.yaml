    freeze. They tend to build false rationales to justify avoiding the issue or not
    doing anything. The first thing you have to do is raise awareness and educate
    before you can help people to realize they need to follow some guidance in order
    to stay safe. If they don’t freeze, they tend to build the most wildly inaccurate
    mental models of the situation, based on little or no evidence at all, and this
    misinformation needs to be challenged before the reality can be taught.


    I well remember the day when, talking to a long-time friend who was an educated
    and experienced businessman and CEO of a very large enterprise, I mentioned our
    research into virus writers. He was absolutely shocked. ‘People write these things?’
    he said. Yes, of course. How did he think they came about? ‘I thought they just
    sort of … developed’. he said, rather miserably. I did once do a calculation about
    how long it would take for a computer virus to ‘just develop’. I came up with
    an answer that was longer than the lifetime of the universe. I may be wrong because
    a more famous virus researcher did the same thing and came up with a shorter answer.
    But we agree that the answer is more than millions of years.


    In security, if you are successful, people will think you have overreacted. The
    Michelangelo virus in 1992 was the first time that we in the computer virus research
    community were successfully able to warn people and raise awareness of a pending
    virus threat. We got hundreds of thousands of people around the world to check
    their computers, and they found millions of copies of the virus. Before the virus
    was due to trigger (because of the leap year) on March 5. (It had been around
    for over a year before that.) And on March 6, all the news stories were not about
    how well we had done, but about how the warning and ‘panic’ had been a hoax.


    We are all in this together. A computer virus researcher sees security from the
    inside out. Most security people grew up with the bastion mentality: we are on
    the inside and the bad guys are on the outside. We build walls and protections
    and try to protect from attacks from the outside. If a bad guy is attacking you,
    it isn’t my problem. As a matter of fact, it’s a good thing, from my perspective,
    because while he is attacking you, he is too busy to be attacking me.


    A computer virus researcher realizes that this viewpoint is very badly flawed.
    Attacks can come from within as well as without. If someone attacks you with a
    computer virus, then it is a concern for me because, if you get infected, you
    will be sending out copies of the virus as well. An attack on one person raises
    the threat level for the entire community.


    For years, therefore, I have been emphasizing the idea of a kind of public health
    security awareness campaign. I have put it to major corporations that they should
    be promoting and paying for security awareness campaigns, not just for their employees
    but for the general public. As well as the public relations and goodwill value
    for the enterprise, it is to the corporation’s advantage.'
