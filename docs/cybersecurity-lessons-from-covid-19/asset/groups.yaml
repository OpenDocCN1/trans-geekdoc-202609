    We do not yet know all about SARS-CoV-2 or COVID-19. We do have some information
    about various risk factors.


    First, there are risks regarding becoming infected. One is location. As many epidemiologists
    have pointed out, the pandemic is not universally and evenly affecting everyone.
    It is best seen as a series of local epidemics. Some locations have been hit very
    severely. Some, even some not far away from hard-hit areas, get off lightly.


    We don’t know all of the factors involved in geographic risks. Some have posited
