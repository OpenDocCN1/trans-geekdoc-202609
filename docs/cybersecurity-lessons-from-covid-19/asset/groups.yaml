    scotia-online-covid19 doesn''t exist.


    But, being as paranoid as I am, I noticed that O (capital letter ''o'') and 0
    (digit zero) look the same in most screen fonts.


    And, voila! scotia-0nline-c0vid19.com (with zeroes in 0nline and c0vid19) does
    exist! It''s registered in Panama. A lot of companies with questionable business
    models are registered in Panama.


    (I''d advise not going anywhere near it.)


    This one was directly targeted at my bank account, but there are huge numbers
    of scams that spring up with every disaster. As noted previously, some pretend
    to be charities, some will target relief programs, and many are just more of the
    same in terms of the regular ongoing run of spam and scams. But a number of the
    frauds do seem to be specific to the pandemic.


    There are the puppy scams. With everyone staying at home, huge numbers of lonely
    people are suddenly wanting a pet. (Making such a major, ongoing, and life-modifying
