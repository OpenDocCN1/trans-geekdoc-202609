    +   - Don’t panic-buy, horde, or misuse masks and gloves.

    +   - Keep (six feet) away from me.

    +   - Now go wash your hands.


    # ''ACTUAL FACE'' MASKS


    Danielle Baskin had an idea for a silly art project. The idea has taken off.


    Her concept is to print the images of partial faces on face masks. It could be
    your face. It could be a random face. It could be an artificially generated face.


    There are many uses for the idea. It could be used to provide masks for medical
    staff so they aren’t as scary to kids they are treating. Or they could be used
    to ‘create’ a face to unlock your phone, so that your actual image isn’t being
    used for that purpose. (It could be used to avoid all kinds of surveillance in
    that regard. Lots and lots of people who live under authoritarian regimes are
    very interested. Of course, it could also be used to avoid legitimate identification
    so you can engage in nefarious activities.)


    # STATISTICS AND PROTECTION


    Remdesivir works against CoVID-19!


    Sort of.


    When it comes to trials of this kind, you have to look at the details, not just
    the headlines. This trial does appear to have good design with randomization and
    a control group with a placebo. That’s good.


    The results, as reported so far, are positive. That’s good.


    For those who took the remdesivir, recovery time was shorter. That’s good.


    It’s particularly good in situations where the medical system is being overwhelmed
    and getting people out of the hospital is a priority. But the recovery time was
    an average of 11 days (versus 15 days for the control group). That’s not exactly
    earth-shaking. Also, we probably need to look at the definition of ‘recovery’
    and particularly look at long-term effects like ongoing respiratory and neurological
    problems that have been reported in some ‘recovered’ patients.


    For those who took the remdesivir, mortality was lower. That’s good. But the mortality
    was still 8% for those on remdesivir versus 11.6% for those on placebo. Again,
    not a result that you want to rely on when people start thinking, ‘Oh, there is
    a treatment, so I don’t have to worry as much about getting infected!’'
