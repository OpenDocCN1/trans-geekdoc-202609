    # Expanding Security


    # 1


    # The CIA Triad


    First, we need a little bit of history. Going back, way back, originally there
    was ‘computer security’. This was the physical securing of the computer. Computers,
    back in the dark ages before you were born, were huge and expensive machines.
    They needed power, they needed air conditioning, and they needed meddlesome people
    kept away from them since they were also fairly delicate but unusual in construction
    and operation.


    Over time, computers became more common, cheaper, and also more robust. As computers
    grew cheaper and as the storage and memory systems became larger, even more data
    was stored on them. Eventually, people realized that the data had a value and
    that the value of the data often exceeded the cost of the physical hardware. At
    this point, we started talking about data security.


    Initially, we were concerned only with confidentiality. Could we keep the data
    safe from prying eyes? During this time in history, computers were expensive,
    and while business was using them, they were still mostly the preserve of the
    government and the military. The government and the military have always been
    concerned with people (mostly enemies but often their own citizenry) not knowing
    certain things. So the main concerns of data security were keeping people out
    and locking the data up.


    But, as more companies and people started using computers, many started to realize
    that there was no particular point in keeping the data locked up if it wasn’t
    available to them. That, in fact, there was sometimes a very solid business value
    in making the data available to your customers and others. And, once they had
    realized the importance of availability, there was also a realization that even
    having the data available was no good if you couldn’t rely on the integrity of
    the data: had the data been improperly modified in some way? Did the changing
    world mean that the data no longer corresponded to the real world? Could you be
    sure that the person the data stated had said or done something had, in fact,
    said or done it?'
