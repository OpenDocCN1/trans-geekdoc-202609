    the design of any protections must delay the successful attack. You can’t guarantee
    that your safeguard will prevent someone from getting in or getting at your data
    or messing with your system, so you need to make the safeguard stall the attacker
    long enough to give you time to detect the attack and respond to it.


    This is the point of bending the curve. Follow the rules, stay home, keep two
    metres away from other people, wash your hands. It won’t (and can’t) guarantee
    that you won’t get infected but it will delay the spread and allow us time to
    do contact tracing, ramp up testing, and prevent the overrun of the medical system—time
    to find treatments that work and develop and test a vaccine.


    # FUNCTIONAL AND ASSURANCE REQUIREMENTS


    When we say that security architecture is about requirements, we should note that
    there are two different types of requirements. The first type, functional requirements,
    is undoubtedly the one we think about most. Functional requirements are what we
    want the system to do, or not do, to protect an asset. For example, if we are
    talking about security management, a functional requirement might be a security
    policy. In access control, it might be a requirement to have passwords to protect
    accounts. (Don’t worry: in a minute, we’ll argue about whether passwords are any
    good.) In physical security, it might be a fence or a wall to prevent unrestricted
    access.


    Assurance requirements are quite different. An assurance requirement is some way
    of determining whether your functional requirement is actually protecting you—if
    it is doing what you actually think it is doing. For example, in regard to our
    security policies in security management, we have auditors who read our policies
    and consider whether they are truly adequate or whether they have gaps that need
    to be addressed. The policy is the functional requirement; the audit is the assurance
    requirement.


    In regard to passwords, we might run password crackers against our systems to
    see if some of the passwords are weak and need to be strengthened. We might also
    have system auditing that checks whether our accounts are being misused or abused
    in some way that indicates they have been compromised. Auditors (more technically
    oriented this time) might point out that passwords are an inherently weak system
    anyway, and we might want to move to multifactor authentication. A wall or fence
    might have an alarm or closed circuit television system that will detect whether
    someone gets over or past it. Some assurance requirements are there to assess
    whether your control is properly functioning; others try to determine whether
    the control is actually doing any good.'
  - '[PAGE 56]


    As you can see from these examples, you can have different types of assurance
    requirements for a given functional requirement. Also, different controls for
    addressing a given functional requirement may have factors and ease for providing
    assurance requirements. In a restaurant, for example, there is a functional requirement
    for hygiene and sanitation. Commonly, the control for this is handwashing. But,
    in that case, the only assurance requirements available are having signs in the
    washroom reminding staff to wash their hands or doing lab cultures on swabs from
    the hands of the staff (which would cost too much and take too long). Some restaurants,
    particularly fast-food places, now have their staff wear disposable gloves when
    preparing food. In terms of the functional requirement of hygiene, washing hands
    and wearing gloves both fulfil the need. But gloves provide an assurance requirement
    that patrons can actually see for themselves. (Yes, OK, gloves aren’t perfect,
    and if the staff wear them between preparing food and other tasks or wear them
    too long without changing them, then both functional and assurance requirements
    are void.)


    In terms of the pandemic, and particularly in terms of the public perception of
    steps being taken, the functional and assurance requirements are vastly different.
    The functional requirements are extremely visible, immediate, and inconvenient.
    Stay home. Don’t go to work. Don’t go to shops, bars, restaurants, or movie theatres
    or to visit Granma. Stay two metres away from anyone and everyone. Wash your hands.
    All the time. If your hands get chapped, use hand cream. (That’s a kind of layered
    defence, remember? Or possibly a compensating control.) The assurance requirements,
    on the other hand, are invisible, long term, subtle, and inconvenient. You can’t
    see the virus without an electron microscope. You can’t see it passing between
    people, six feet away or not. You can’t see it on your hands or surfaces, and
    you can’t tell whether washing your hands kills it or washes it off. You can’t
    see if you or anyone else is infected. You can see some symptoms, like coughing
    or fever (if you have a temperature ‘gun’), but you can’t see if someone is infected
    and asymptomatic.


    Tests to detect the virus require labs and supplies, time, and training. Contact
    tracing really tells you only whom to test. Infection data really tells you only
    how effective you were at preventing spread of the infection two weeks ago. Death
    rates are definitely an after-the-fact indication.


    # SIMPLE


    We tend to think of security as complicated, a complex interaction of convoluted
    systems. In a lot of ways that is quite true. But some pieces and parts of security
    can be incredibly simple. So simple they almost sound silly.'
