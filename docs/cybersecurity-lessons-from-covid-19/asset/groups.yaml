  - '[PAGE 13]


    but possibly difficult to do. When you are under stress, you make bad assessments.
    And one of the assessments that may be in error is how stressed you are and therefore
    how bad the decisions you’re making are. This is related to the impairment of
    how well you can determine yourself to be impaired if you are impaired and also
    the Dunning–Kruger effect. But taking care of yourself does lead us to a couple
    of other points.


    A friend, who is a doctor, asked whether he should volunteer to go back to work,
    as a front-line physician, during the coronavirus/COVID-19/SARS-CoV-2 crisis.
    So what can retired doctors (and nurses and engineers, etc.) do during COVID-19?


    As we know from emergency management, the first rule is not only ‘First, do no
    harm’ but more specifically ‘First, do no harm—to yourself’. You (and I) are old,
    Father William. Not only are the old particularly susceptible to the virus, but
    (for reasons not yet either verified or fully understood) front-line medical workers
    also seem to be particularly susceptible. Going back in as a front-line worker
    may not be the best use of your skills and experience.


    Right off the top, may I suggest that you start reaching out to other retired
    doctors (and other professionals)? I know that lots of them have already volunteered
    to return to active service. But I suspect that some of them are concerned, as
    you are, about the dangers (or are under family pressure) and may be wondering
    about how best to proceed. You could be the founder of Doctors (Nurses, Engineers,
    etc.) Without Pay Cheques and get a wealth of skill and experience mobilized in
    some interesting new directions. Yes, with the hoarding and panic-buying going
    on, we are having to spend more time just getting the necessities of life, but
    we still have some time to contribute.


    One of the first things to do is search out and fight mis- and disinformation
    with facts and analysis. Most people don’t have your knowledge of disease, disease
    vectors, hygiene rules, transmission vectors, the lifetime of an infectious agent
    outside the body, the difference in effectiveness between soap and hand sanitizer,
    or even the difference between a bacterium and a virus. Most people are scared
    because they are relatively ignorant about these things. (They may not be completely
    ignorant and may not be ignorant of other things, but they don’t know as much
    as you do about the specifics.) They are bombarded by news stories about people
    becoming sick and people dying. They are scared (and also don’t know as much as
    we do about risk analysis and calculation). They feel powerless, and ‘wash your
    hands’ doesn’t feel like it should be enough. People feel scared and don’t have
    enough information, so they either don’t do anything and ignore the whole situation
    or believe any random myth they hear because at least it seems like they are doing
    something.


    You could also reach out to students. A lot of them have a lot of time on their
    hands right now. Even if they aren’t fully trained, most of them have more information
    than the general public and can help. Students will also greatly'
  - '[PAGE 14]


    benefit from working with you and the rest of us old codgers while we try to help
    in various ways, and they’ll get valuable practical experience in the things medical
    (and nursing and engineering and computer security) schools can’t teach them.
    They’ve got more energy than we do. And there are some interesting projects they
    can assist.


    As well as the misinformation, there are other questions to be researched. Not
    being on the front lines, you/we may not be able to research or answer them directly.
    But some old physician somewhere may have an insight that might be key. These
    are questions like: Are/Why are front-line medical workers at greater risk of
    CoVID-19? Is ibuprofen actually a risk? Are vitamins C and D actually a benefit?
    When (and how much)? Lots of questions fall into this category.


    But, probably more importantly, there are some projects that can be undertaken
    without direct front-line contact or exposure. For example, there was great concern
    over the availability of ventilators. Multiple projects are looking into low-cost,
    easy-to-manufacture, ‘open source design’ ventilators. (A number of these projects
    are being carried out by students.) One hospital in Canada is putting out videos
    showing how, with extra tubing and connectors, you can get one ventilator to support
    up to three patients. You need to get a retired respirologist to see if it will
    work and a retired engineer to see if it is feasible for manufacture by anyone
    with less than an engineering doctorate. Also, you, as a risk manager, need to
    look at the various designs, noting that (in this case) the best may very well
    be the enemy of the good and that something that is only 80% effective but can
    be built with scuba tanks and a child’s toy may well save more lives than something
    that is 99.44% effective but requires a piece of The One True Cross to work. (You
    may need retired politicians to place these ideas in front of the authorities
    or retired businessmen to set up manufacturing.)


    Think outside the box. A lot of us started work before there was a box.


    Now go wash your hands.


    What is the great lesson that CoVID-19 is teaching us? Well, history tends to
    teach us that history teaches us nothing, but let’s be a bit more hopeful for
    a moment. There are many lessons to be learned. This book started as a compilation
    of lessons for my security colleagues. But a few of them are more generally appropriate.
    And there are a number of them.


    If you believe everything you read, you had better not read. I know. Terrible
    thing to say. But it is true that a little knowledge is a dangerous thing. Not
    half so dangerous as a lot of ignorance, I suppose. And there have been huge amounts
    of mis- (and even dis-) information around this virus and the related disease.
    So, please: wash your hands. Don’t drink bleach. Keep physically distant from
    people and don’t try to find loopholes around those rules. Stick to the basics.


    More problems are caused by our overreactions than by the original event. Having
    huge amounts of toilet paper will not keep you from getting infected.'
