  mdcn: "\n\n## 11 法律、调查与伦理\n\n### 越界\n\n> “那些为了获得一点暂时的安全而放弃基本自由的人，既不配得到自由，也不配得到安全。”\n\
    > \n> ——本杰明·富兰克林，《宾夕法尼亚历史评论》（1759年）\n\n许多司法管辖区正在利用 COVID-19 危机为自己谋利。政府使用接触追踪应用程序和系统对公民进行监视，或利用关于隔离和社交距离的规定来禁止抗议和压制异议。美国多个州认定，在所有医疗机构中，唯独堕胎诊所属于非必要机构，应予以关闭。在安全领域，我们必须谨慎，确保我们制定的政策是出于真正的安全原因，而不是为了其他目的。（从伦理角度来看，我们必须只将权力用于善，绝不用于恶。）\n\
    \n就疫情而言，这未必简单。与大多数情况一样（但比大多数情况更为明显），COVID-19 指出我们必须平衡相互冲突的法律原则，并仔细审视原始宪法文件的意图。美国人会说，他们被承诺了生命、自由和追求幸福。难道他们没有自由权，可以不受封锁令限制地经营自己的生意吗？难道他们无权通过去夜总会来追求幸福吗？啊，是的，但“生命”排在第一位。\n\
    \n### 隐私\n\n除了接触追踪之外，COVID-19 还涉及大量隐私问题。首先，这是一个医疗问题，而医疗信息似乎是人们第二大隐私关注点（第一大是薪资水平）。在许多情况下，这种担忧是相当合理的：被诊断患有某些疾病可能会导致失业或失去保险保障，而且在太多情况下，你会被社区排斥，往往是因为一些根本不是你的错的事情。\n\
    \n### 证据\n\n证据规则之一是，要在法庭上出示证据，证据必须与案件相关。疫情期间进行并发表的各种类型测试和多项研究，已经证明了这一点的重要性。\n\n\
    例如，RNA 检测发现，在粪便中检测到了 SARS-CoV-2。这是否意味着污水是一种感染风险？（你看，先别急着反驳。污水从来都是有害物质，除了 SARS-CoV-2\
    \ 之外，你还可能从中感染多种恶性疾病。）嗯，我们不知道。我们知道 RNA 检测能检测出病毒代码的片段，但这些片段即使检测到，也未必表明病毒具有活性。或许需要更多研究，但目前没有其他证据表明粪便污染是病毒的主要传播途径。（我们能在污水中检测到病毒，这或许能为我们提供一种工具，用来了解病毒在特定社区中的流行程度，但这一点也需要更多研究。）\n\
    \n同样，有研究表明，在感染者离开后数小时内，可以通过 RNA 检测在空气中检测到病毒。这是否意味着 SARS-CoV-2 是一种空气传播病毒，并且可以通过空气中的这些颗粒进行传播？嗯，同样，也未必。基于上述相同的原因，我们可能检测到的是无活性的病毒痕迹，因此我们还不真正知道气溶胶传播到底有多大的危险。到目前为止，实际传播的证据似乎表明感染风险较低。我们能用\
    \ RNA 检测检测到空气中的病毒碎片这一事实，与我们的感染风险并无真正关联。\n\n### 种族主义\n\n我不知道它究竟属于法律还是伦理，但它肯定属于这个领域。\n\
    \n在这场可怕的危机中，最让我感到恐惧（可能比所有其他令人反感的问题都更甚）的，是公开而 blatant 的种族主义人身攻击和不当行为急剧而迅速地上升。它表现在很多方面：街头的言语骚扰、公共交通上的身体攻击、种族主义涂鸦，甚至排斥移民和关闭并无必要关闭的边境。\n\
    \n也许是因为我是加拿大人，才觉得这如此令人深感不安。不幸的是，加拿大并非对种族主义免疫，但我们确实有一种民族特性：宽容到近乎纵容。相比于美国，我们是一个世界性的、多语言的社会。美国人谈论“大熔炉”，每个人都来到美国并成为美国人；而加拿大则谈论文化马赛克，每个人都来到加拿大并从自己的原居地贡献一些东西。有一个全国性的笑话：加拿大人的定义就是“有资历的\
    \ DP”。对于非加拿大人，我必须解释一下，DP 代表“displaced person”（流离失所者），这是一个古老的术语（可追溯至两次世界大战），指难民，但\
    \ DP 本身也是一个种族主义词汇。因此，这个笑话不仅关乎国家的人口构成（每个加拿大人都是 DP：即使是原住民也是从其他地方来到这里的，很可能来自西伯利亚），也是对种族主义本身的巧妙讽刺（以及对那些可能认为自己超脱于种族主义或对种族主义免疫的加拿大人更为直接的自我嘲讽）。（加拿大的笑话确实往往复杂而多层。抱歉。）\n\
    \n乔治·弗洛伊德 /“黑人的命也是命”抗议活动可能与背后的文化力量有关。如前所述，执法中的种族偏见并不是什么新鲜事，而且广为人知并得到承认，尽管大多没有得到有效解决。此前还有过其他死亡事件和其他抗议活动。科林·卡佩尼克多年来一直在进行他本人完全非暴力的抗议。当然，这场运动之所以能取得如此大的成功，很可能仅仅是因为人们厌倦了疫情期间不得不待在家里，迫切需要一个外出的借口，以便和人们待在一起。但同样似乎表明，社会在此时似乎已经准备好更认真地审视这个问题。这个问题不可能一夜之间解决，但如果这场可怕的混乱能带来一些有意义的改变，那将是令人振奋的。\n\
    \n## 12 友善。冷静。安全。\n\n### 友善\n\n加拿大不列颠哥伦比亚省（BC）的省卫生官邦妮·亨利博士，在数月里几乎每天都代表政府发声（公平地说，也是政府应对新冠病毒危机措施的设计者），应对这场危机。几乎每天下午\
    \ 3 点，她都会举行虚拟新闻发布会，记者通过电话接入提交问题。在这一点上，我不想详细讨论邦妮博士的资历、背景或她出色的指导。我想说的是，这些新闻发布会充分证明了“圣人般的耐心”这个词就是为邦妮博士这样的人而造的。\n\
    \n日复一日，记者们提出愚蠢的问题、无法回答的问题、已经被充分回答过的问题，以及旨在诱导出耸人听闻的“金句”的诱导性问题。日复一日，邦妮博士让那些追求轰动效应的记者失望，却让其他人安心。她回答了那些愚蠢的、无法回答的、反复出现的问题，而我从未见过她发脾气，即使我在家里已经因为他们在第\
    \ 17 次试图得到一个“一刀切”的引语而大发脾气，以便日后用来攻击亨利博士并提高报纸销量。\n\n记者们无休止重复的最常见问题之一是某种变体的“我们应该如何凶狠地攻击那些在排队时不与他人保持六英尺距离、经过免洗洗手液机却不用、或者去海滩而我感觉不安全的人？”邦妮博士的回答始终是她三重箴言的第一部分：友善。\n\
    \n她通常还会解释为什么不应该对每一起看似违规的行为立即动怒。首先，你并不了解全部情况。公园里那一打人？也许他们都是同一个家庭、同一个住户的成员。他们只是出去呼吸新鲜空气。他们小心翼翼地与所有不属于其家庭的人保持距离。\n\
    \n"
