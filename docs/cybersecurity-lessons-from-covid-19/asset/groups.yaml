    这也提醒了我，如今，帮派聚在一起的电影和电视节目会立刻引发“你们靠得太近了！”的情绪反应。（黑帮电影中，敌对帮派在巨大的仓库里“会面”，每个人都保持着偏执的距离，手放在枪上，这会引发“这才像话”的反应。）


