  mdcn: "\n人们开始逐渐适应它，不再将其视为威胁。因此，随着疫情持续，人们开始松懈，不再像危机初期那样自觉遵守规则。别这样。\n\n在研制出（并测试）有效疫苗，且疫苗剂量足以覆盖几乎所有人之前，我们不能放弃这些规则。尽管各种限制措施可能旷日持久，尽管病例数量可能正在下降，我们仍需遵守规则，坚守世界卫生组织提出的“五项英雄行动”。\n\
    \n除去全球新冠病例最多的几个国家（目前是美国、巴西、俄罗斯和印度），世界上大多数地方要么病例数相对较少，要么已经渡过了第一波疫情。尽管每一起死亡都是损失，各类企业都遭受了严重损害，但封锁措施和世界卫生组织“五项英雄行动”中的基本卫生规则确实在遏制疾病方面颇有成效。几乎所有类型的企业都在以各种方式调整：制造商改产高需求产品，餐馆转向外卖模式，体育联盟正在制定至少能进行电视转播比赛的方案。（活动策划者在创造性调整和替代方案方面似乎行动迟缓，这颇为奇怪。）\n\
    \n曲线已被压平。我们现在知道该怎么做才能将疾病传播速度降至可控水平，即使我们永远无法治愈它。\n\n当然，我们实际上必须去做那些我们知道应该做的事情。当我完成本书正文和最后编辑时，我非常担心大量大型私人派对的举行，这些派对完全违背了我们所知的避免感染的一切原则。也许，作为一个物种，如果我们连几年没有大型音乐会、酒精、大型派对和完全不考虑后果的行为都熬不过去，那我们就不配生存。你想和一大群素不相识的陌生人聚在一起？可惜不行。我想拥抱我的孙子孙女，想去参加会议，想去餐馆坐在那里吃热腾腾的食物，而不必非得带回家后吃凉的。不能。这是紧急情况，我们必须举止得当。\n\
    \n（我有没有提到那些让人联想到两次世界大战及类似事件的梗图？那些梗图指出，那些人都必须冒着生命危险去拯救人类，而你要拯救世界只需要待在家看电视。）\n\n\
    你对所有规则感到厌倦了？好吧，我们也许可以把规则减少到一条。如果我们戒酒几年，我们很可能会活下来。看看事实吧。酒吧必须关闭和受限。酒吧供应酒。餐厅被施加了新规定。餐厅供应酒。音乐会被禁止。音乐会涉及酒（即使不该有）。我们不能去体育场馆。体育场馆供应酒。聚会是危险的。聚会通常涉及酒。（面对现实吧：除了十岁孩子的生日派对，每个派对都有酒，即便是那种派对，父母们大概也在喝。）为什么阴谋论者还没盯上这一点？酒精导致冠状病毒的证据远比\
    \ 5G 导致冠状病毒的证据多得多，而那些戴锡箔帽的人正在外面烧毁手机信号塔。\n\n我们还没有找到治愈方法。羟氯喹似乎无效，甚至危险（除非得到非常谨慎的管理）。夹竹桃苷来自一种有毒植物。（很多药物都来自有毒植物，但迄今还没有真正证据表明夹竹桃苷有任何医学益处。）瑞德西韦似乎确实能略微缩短病程，略微降低死亡可能性。地塞米松似乎显示出一些希望，但（在撰写本文时）我们对其益处（和风险）还所知甚少。但我们对这场疫情才应对了不到一年。而且，如果还需要一段时间，我们知道该怎么做来争取时间。遵守规则。\n\
    \n我们还没有疫苗。还没有。我们从未成功研制并测试过针对这类病毒的有效疫苗。我们确实有 1000 多个候选疫苗，而且以往已有多种方法为各种病毒研制出疫苗。我们知道必须做什么来为研发和测试争取时间。\n\
    \n最近有一本关于气候变化的新书，*《不宜居住的地球》*（Tim Duggan Books，2019），作者是戴维·华莱士-威尔斯。他指出，认识到全球气候变化是由人类造成的，这应该给我们带来安慰，而非绝望。我们对这一变化负有责任，因此我们掌握着主动权，能够改变现状。按照类似的逻辑，就疫情而言，我们确实知道如何战胜它。我们只需遵守规则。\n\
    \n几天前，我首次就这本书所基于的演讲做了实际报告。有一个问题让我觉得相当奇怪，我也不确定是什么促使了这个问题，但有人问道，鉴于正在进行中的各种研究，把精力浪费在新颖研究上，而这些精力本可用于重现早期研究的成果——而重现是检验科学研究的试金石。如我所说，我不确定是什么引发了这个问题，但我必须假设，这源于一种担忧，即研究不知何故被新问题分散了注意力，应该在继续前进之前完成现有工作。但科学不是单打独斗。全世界数十万人在关注已经完成的工作、正在进行的工作，以及可能完成的工作。如果你觉得这还不够，也许你该鼓励你的孩子在学校更认真地上科学课，长大后投身研究。但我认为我们不必担心现有研究不会得到检验和质疑。伟大的冰球守门员雅克·普兰特曾问道：“你是否想要这样一份工作：当你犯错时，一个大红灯亮起，15000\
    \ 人发出嘘声？”在这方面，科学比冰球糟糕得多。在科学中，当你做对了某件事，你的朋友们都会试图证明你错了。\n\n四十年前，我读了亚历山大·索尔仁尼琴的*《古拉格群岛》*（Harper\
    \ & Row，1973）。其中有几段文字至今仍留在我心中。就像这一段：\n\n> 生活中最主要的东西是什么，它所有的谜团是什么？如果你愿意，我现在就为你解答。不要追求虚幻的东西——财产和地位：这一切都是一年又一年以你的神经为代价换来的，却在一夜之间被剥夺。生活要有一种超越生活的稳定优越感——不要害怕不幸，也不要渴望幸福；毕竟，它们其实都一样：苦不会永远持续，甜也永远不会满溢到杯外。如果你没有在寒冷中冻僵，如果渴和饿没有啃噬你的内脏，如果你的背没有折断，如果你的脚还能走路，如果双臂还能弯曲，如果双眼还能看见，双耳还能听见，那么你该嫉妒谁？又为什么嫉妒？我们对他人的嫉妒最吞噬我们。擦擦眼睛，净化心灵——并在这世上最珍视那些爱你、愿你安好的人。不要伤害他们，不要责骂他们，永远不要带着愤怒与他们分离；毕竟，你根本不知道：这可能是你被捕前的最后一个行动，而这就是他们记忆中留下的你的样子！\n\
    \n这里或许才是最终的安全课。专注于重要的事情。安全，如同生活，充满了琐碎的细节。不要因为它们就在眼前而陷入非本质的细枝末节。\n\n- **I**\n \
