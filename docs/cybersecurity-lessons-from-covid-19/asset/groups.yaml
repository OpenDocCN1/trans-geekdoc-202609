    less severe symptoms, lower need for hospitalization, and fewer deaths. Those
    in their thirties have more, those in their fifties even more, and those in their
    eighties are at extreme risk if infected. As always when talking of risk, probabilities,
    not certainty, are the order of the day. There are children who have died and
    centenarians who have survived.


    Once infected, men seem to have worse outcomes than women do. The data may be
    slightly skewed by the fact that men hide problems and symptoms and therefore
    may simply be sicker once they admit that they are sick. However, death rates
    tend to confirm that men are more seriously affected.


    A number of underlying health factors seem to be related to worse outcomes. Those
    with diabetes and high blood pressure seem to generate more hospitalizations,
    complications, and deaths. The same holds true for obesity, although obesity is
    also strongly tied to conditions like diabetes and stressed cardiac systems, so
    possibly this is simply the same risk factor being seen from different sides.


    CoVID-19 has been a terror for the elderly, particularly for those in care homes.
    Not only do the factors of age and underlying medical conditions come into play,
    but also the factors of close proximity, lack of ‘personal space’, common eating
    and recreational areas, and staff constantly moving between residents. As generally
    provided in Western societies, elder care is almost a ‘perfect storm’ of risk
    factors for this particular disease.


    There is yet another area of risk. We are used to infections where, once you have
    been sick and recovered, you are cured. In most cases of CoVID-19, this is the
    pattern we see. But there are some who do eventually fight off the virus infection
    and start to recover but still have lingering aftereffects. Many have respiratory
    symptoms and difficulties that persist for months. There are reports of weakness
    and fatigue. The loss of a sense of smell and taste can linger for some time.
    There are also reports of delusions and dementia. We do not yet have enough information
    to know how frequently this may be the case, nor how long it can last. In some
    cases, the disabilities may be permanent.


    There are many parallels between risk in disease and risk in security. We do not
    know all the factors. We do not have all the information. We work, as best we
    can, partly in the dark. We try to tease out, as best we can, those threats that
    we can see, and we protect imperfectly against those we can only theorize about.


    # METRICS


    Security supports business. Security is business, and requires management. And,
    as the old mantra has it, you can’t manage what you can’t measure. In'
