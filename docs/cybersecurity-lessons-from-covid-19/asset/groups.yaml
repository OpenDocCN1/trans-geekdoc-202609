    of layered defence, remember? Or possibly a compensating control.) The assurance
    requirements, on the other hand, are invisible, long term, subtle, and inconvenient.
    You can’t see the virus without an electron microscope. You can’t see it passing
    between people, six feet away or not. You can’t see it on your hands or surfaces,
    and you can’t tell whether washing your hands kills it or washes it off. You can’t
    see if you or anyone else is infected. You can see some symptoms, like coughing
    or fever (if you have a temperature ‘gun’), but you can’t see if someone is infected
    and asymptomatic.


    Tests to detect the virus require labs and supplies, time, and training. Contact
    tracing really tells you only whom to test. Infection data really tells you only
    how effective you were at preventing spread of the infection two weeks ago. Death
    rates are definitely an after-the-fact indication.


    ## SIMPLE


    We tend to think of security as complicated, a complex interaction of convoluted
    systems. In a lot of ways that is quite true. But some pieces and parts of security
    can be incredibly simple. So simple they almost sound silly.


    ## 5 Business Continuity and Disaster Recovery Planning


    It is always difficult to push for an increase in any business budget, and security
    is harder than most. Security is seen as a cost without any possibility of revenue
    generation. Security and business continuity planning (BCP) are seen as insurance:
    maybe you need to have them, but you want to pay as little as possible. It takes
    forever, and an awful lot of work and convincing, to start any new project. It’s
    difficult when any existing work demonstrates an increased need for more resources.
    And BCP is possibly one of the hardest areas for which to get funding.


    As many BCP specialists know, the best argument for doing BCP is having the business
    across the street burn down.


    Well, right now, an awful lot of businesses across an awful lot of streets are
    burning down. Every week during the month of May in 2020, a major corporation
    filed for bankruptcy protection. Not just little mom-and-pop operations, which
    were going out of business so fast that nobody was keeping track. Early on, somebody
    said that COVID-19 made all our business continuity pandemic planning redundant.
    COVID-19 has a number of lessons for pandemic planning, but it certainly doesn’t
    make BCP redundant. Check your supply chains. Find (and eliminate) single points
    of failure. Build redundancy. Do succession planning. The necessity for all of
    these has been amply demonstrated during the pandemic. They are all part of a
    real business continuity plan.


    As I keep telling people in business continuity and disaster recovery seminars,
    use anything and everything you can to promote the need for disaster


    the movies since the theatres weren’t open. In the northern hemisphere, the virus
    hit as planting season was starting, but travel restrictions meant seasonal farm
    workers weren’t available. Some of the food supply was hit in very odd ways: there
    was lots of food, but all the food that was normally sold to restaurants was not
    moving, while grocery stores were having a hard time keeping shelves stocked because
    of (a) panic-buying, (b) food-processing plants being hit by virus outbreaks,
    and (c) all the people who would normally have been eating in restaurants who
    were suddenly cooking at home. (The occasional shortages of certain types of food
    fuelled more panic-buying.)


    The supply chain has become extremely important and, at the same time, extremely
    complex. JIT supply, which has been very popular in terms of cost savings, has
    left very little margin of time for reactions when some disaster strikes. The
    radically increased demand for face masks and other personal protective equipment
    for the medical field, in response to the crisis, has pointed out just how complex
    the situation is becoming. An American company is one of the major suppliers of
    N95 standard face masks. At one point, there was a short-lived threat, by American
    authorities, to commandeer the entire supply of those masks for the American market,
    which would have cut off significant supplies to the Canadian market. Fortunately,
    saner heads prevailed, and nobody had to find out how well the masks could be
    made without the specialized fibre that comes from a mill on Vancouver Island.
    In Canada.


    Similarly complex supply chains apply in regard to the reagents used in testing
    for the virus, in terms of both the RNA tests and the serology tests. And for
    pretty much every technical marvel we are coming to rely upon in our increasingly
    technologically dependent world. Phones sold by American corporations are made
    in China but require chips fabricated in the US—with elements mined in China.
    And that’s a very simple supply chain these days.


    Tying this back to capital risk, there is a grave danger of putting all your eggs
    in one supply basket for cost savings. JIT and single-source supply chains do
    trim margins and result in financial savings. But if that supply basket is jeopardized
    by a minor glitch in a complex web that is completely outside your control, your
    business may fail.


    ## TRAINING


    Those of us in the security communities are always interested in disasters. We
    are forever dealing with crises, both large and small, assessing risks, planning
    and comparing mitigation strategies, and looking at the management of it all.
    So I recall that, when Hurricane Katrina struck, there were endless discussions

