    been sick and recovered, you are cured. In most cases of COVID-19, this is the
    pattern we see. But there are some who do eventually fight off the virus infection
    and start to recover but still have lingering aftereffects. Many have respiratory
    symptoms and difficulties that persist for months. There are reports of weakness
    and fatigue. The loss of a sense of smell and taste can linger for some time.
    There are also reports of delusions and dementia. We do not yet have enough information
    to know how frequently this may be the case, nor how long it can last. In some
    cases, the disabilities may be permanent.


    There are many parallels between risk in disease and risk in security. We do not
    know all the factors. We do not have all the information. We work, as best we
    can, partly in the dark. We try to tease out, as best we can, those threats that
    we can see, and we protect imperfectly against those we can only theorize about.


