    Somebody asked what would happen to all the surplus toilet paper once the crisis
    was over. Toilet paper, if kept properly, has an expiry date of 937,164 weeks
    and two days. Store in a cool, dark place. Toilet paper rolls will not breed if
    kept away from wild trees. Every few months, check for evidence of dust bunnies:
    if found, remove the dust bunnies with tweezers and store in separate cages according
    to nationality.


    - (a) kill viruses and at the same time (b) not kill people (or at least seriously
    compromise respiratory systems).


    Disinfecting sprays seem to have become an enormous business. As I write this,
    schools are reopening and the news is showing school desks and classrooms being
    sprayed. Airlines are trying to convince passengers that airplanes are safe and
    so there are videos of the insides of planes being sprayed (sometimes with ‘electrostatic’
    sprays). A French company is selling booths that spray you as you walk through
    them.


    What is the content of the spray? Nobody seems to be asking that question. As
    previously noted, when people are scared and perfect information is not available,
    we, as human beings, tend to grasp at straws. When people are scared, you, as
    a government, must be seen to be doing something even if the ‘something’ does
    nothing to address the actual risk. Mexico had booths like those the French company
    is selling. They sprayed a diluted bleach solution. The bleach was concentrated
    enough to discolour fabrics and irritate skin but not concentrated enough to kill
    many viruses. A colleague in Saudi Arabia noted similar booths that sprayed a
    dilute acetic acid solution that was not strong enough to kill the virus but definitely
    left you smelling like a heavy batch of fish and chips.


    A new market has opened up for devices that shine ultraviolet (UV) light. UV does
    kill viruses and even bacteria and sometimes very effectively. Also, UV, in small
    doses, is safe: it’s present in sunlight. A surface placed in direct sunlight
    will be disinfected of SARS-CoV-2 within about four hours. (A recent study found
    that 90% of the virus was gone, in summer, within half an hour.) The thing is,
    the part of the UV spectrum that does the cleansing (known as UV-C) is mostly
    filtered by the atmosphere. (Also by glass, as is used in windows.) An ordinary
    decorative ‘blacklight’ is not going to disinfect anything. And any UV-C source
    that is strong enough to kill viruses is potentially strong enough to do some
    serious damage to you.


    When I worked at the hospital, we had a UV-C device for debriding wounds. I never
    used it. The only people who were allowed to use it were a specialized office
    in the physio department since, if misused, it could be very dangerous. A careless
    exposure of less than a minute could cause damage that would strip the skin off
    your arms. When I worked in industrial first aid, we were taught about ‘arc flash
    conjunctivitis’. When arc welders are careless with welding goggles, the UV light
    produced by their welding can damage the surface of their eyes.


    We are seeing many different types of UV devices being sold to disinfect different
    things. We are being shown videos of devices (even one walk-through booth) that
    shine a vaguely purplish light that is supposed to kill viruses. If you can ‘see’
    the UV light that is strong enough to kill viruses, it is strong enough to damage
    your eyes.


    ## SOCIAL ENGINEERING


    Security theatre is doing—or, really, being seen to do—something that actually
    isn’t going to have any particular effect on the risk or threat people are worried
    about. That doesn’t mean it doesn’t do anything. It keeps people calm. In some
    situations, that can be quite important.


    In security, when we talk about social engineering, we tend to talk about attackers
    using it as a tool. We are simply using a fancy term for lying. Just about every
    form of fraud uses some kind of social engineering. Malware uses a version of
    social engineering via some kind of implied lie about what the program does (or
    doesn’t do). Some of the biggest names on the black side of technology weren’t
    really that technically adept: they were just good at lying.


    But we can use the power of social engineering for good as well as evil. I’m a
    teacher at heart. I am always using social engineering, mostly to get people to
    try things they never thought they could do. If you are a manager, one of the
    two things you are always managing is people. It’s handy to know some social engineering
    in order to manage them more effectively. (Someone has noted that people will
    run downstairs faster if you announce that there is leftover food from a meeting
    than if you yell ‘Fire!’)


    Dr. Bonnie Henry, in her daily press briefings, was constantly being asked what
    fines or punishments there would be for infractions of, for example, directives
    about gathering in public spaces or non-essential travel to common tourist destinations.
    (We have a lot of those in British Columbia.) Her answer was always the same.
    She refused to name punishments and instead stated she was sure that most people
    in the province were trying to do the right things and to keep themselves and
    their loved ones safe. Dr. Bonnie employs social engineering. What she said is
    absolutely correct: most people do try to cooperate and follow policies and guidelines.
    But she also knows that you catch more flies with honey than vinegar. If you assume
    that people will not cooperate and therefore you set up punishments and negative
    consequences, you make people feel badly about the whole situation. In that case,
    people are less apt to cooperate and will tend to spend more time and effort finding
    loopholes and ways around the rules rather than finding ways to live within them.
    If you say that you are sure people are doing the right thing, they tend to feel
    positive about the situation and are less inclined to amplify any minor grievances
    into a major problem.


    Use social engineering and get it to work for you rather than against. As someone
    else has pointed out, if we had called it the ‘stay-at-home challenge’ instead
    of ‘lockdown’ and posted it on social media, the virus would have been eliminated
    by now.


    ## SECURITY SELF-THEATRE? (COVID-19 AND MASKS)


    One thing that has bugged me ever since it entered the news cycle is the issue
    of face masks. OK, particularly in view of the hugely divisive, contentious, and
    frequently changed advice about masks, I have to make several important points.
    First, masks do provide you with some slight protection if you are in a situation
    (such as public transit) where physical distancing is not possible to enforce.
    Second, masks do provide some prevention of transmission if you are infected (whether
    you know you are infected or not). Third, if you are in an area of extreme public
    transmission of the virus, having any additional protection is good. Fourth, masks
    alone, in the absence of other protective actions, will not keep you from becoming
    infected.


    Masks won’t keep you from getting COVID-19 or any other droplet-borne virus. (At
    least, they don’t reduce your risk very much.) The paper face masks provide next
    to no protection in this regard, and the N95 masks aren’t much better. Droplet-borne
    viruses will still get on your skin, on your face, and into your eyes, and simple
    daily activities make you touch your skin, face, mouth, and eyes and provide the
    viruses a path inside. You don’t need to inhale the virus to get it, and if you
    do get COVID-19, it’s as likely that it will be from some pathway other than inhaling
    it. This is why frequent (very frequent) hand-washing is important. (Hand sanitizer
    is good, too. If you use it frequently.)


    This advice, by the way, applies to influenza as well. Which brings up another
    point: if you are worried about the COVID-19 virus and haven’t gotten a flu shot,
    you are engaging in risky behaviour. Even in China, you are much, much more likely
    to get the flu than COVID-19. Even in China, the likelihood that the next person
    you meet will have COVID-19 is about 0.0001. (Probably somewhat less.) But if
    you go out into a crowd (if you can find a crowd in China these days), you are
    likely to encounter somebody with the flu. Having a flu shot probably doesn’t
    reduce your risk of getting COVID-19, but it does reduce your risk of getting
    the flu. If you get the flu, then you may have to get tested for COVID-19, and
    the fact puts that much more demand on the health system and resources.


    Given the furore over masks, you probably really don’t care what my opinion on
    masks is. What you should care about, though, is what it says about risk assessment
    and risk management.

