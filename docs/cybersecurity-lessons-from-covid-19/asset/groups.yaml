    them. One such app was specifically aimed at novice investors just getting into
    the trading game. However, it had an unusual user interface that did not always
    display the complete state of the trader’s financial situation (and does, in fact,
    make it look very much like an online game). It would, on occasion, display status
    after only part of a trade had been completed and, in this case, could show the
