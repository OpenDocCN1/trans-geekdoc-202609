  - '[PAGE 106]


    until now. As soon as a whole bunch of people started using it, a whole bunch
    of security researchers started noting various security weaknesses. There was
    the aforementioned Zoombombing. There was the zealous overemphasis on ‘selling’
    the security features of Zoom, which had significant weaknesses. For example,
    Zoom calls were said to be encrypted. The encryption algorithm used was AES (Advanced
    Encryption Standard), which is an accepted and highly regarded function. However,
    it does allow you to use keys of differing lengths, and Zoom used 128 bits, which
    is very much weaker than the usual standard of 256 bits. In addition, Zoom calls
    were ‘link’-encrypted, which means that Zoom would have been able to read any
    of the traffic since all of it went through Zoom servers. Those concerned with
    privacy are much more interested in ‘end-to-end’ encryption (sometimes referred
    to as E2EE), which means that only those who are actually parties to the call
    can access the content.


    Then there was China. Zoom is ostensibly an American company. However, more than
    80% of the product research and development goes on in China. And, in some early
    tests, in calls that had no parties in China, the meeting traffic ended up going
    through servers in China. More recently, an activist who had been using Zoom meetings
    for planning a protest to mark the anniversary of the Tiananmen Square massacre
    had his Zoom account deactivated.


    Zoom has said that it is not owned by the Chinese Communist Party. Mind you, the
    same thing is said about pretty much all the companies that are owned by the Chinese
    Communist Party. Zoom has said that the traffic which routed through China was
    due to an error in server configuration, and, I note, no recent analysis has demonstrated
    the same routing. Zoom has promised that all ‘verified’ Zoom accounts will be
    able to use stronger and end-to-end encryption. And the activist did have his
    account reinstated.


    However, I think it would be a good idea, in national security terms, for everyone,
    as much as possible, to use Zoom for inconsequential family parties and so forth
    so that important business and government meetings might be lost in the chaff.


    At which point, I have to tell you about the dogs.


    Number One Daughter has recently moved. Beautiful place, beautiful view, built
    on a slope, **way too many** stairs for us to live there. For complicated reasons,
    she now has two dogs: Marley, who is very old, shouldn’t have lived anywhere near
    this long and has arthritis among other things, and Fera, who is young, high-strung,
    somewhat nervous, and **extremely high-energy**. Despite disparate ages and temperaments,
    ‘the pack’ has a great relationship.


    Marley doesn’t do stairs any better than I do. She has developed a weird front-legs-together-back-legs-together
    double-bounce method of travelling **down** stairs but can’t climb back up. But
    when she gets to the bottom of the house, she can exit out the deck, then down
    more stairs, then up the slope (which is steep but at least not stairs) to the
    front door.'
