    A false-positive error means that the system, whatever it is supposed to do or
    find, reports that there is a problem when there actually isn’t. In terms of an
    antivirus scanner (for computer viruses), this means that the scanner tells you
    that your computer is infected by a virus when there is no virus. In terms of
    firewalls, it means that your firewall tells you there has been an attack on your
    network when there actually wasn’t. In terms of a contact-tracing application,
    it should tell us when you have been in the vicinity of an infected person. And
    by ‘in the vicinity’, we can use Dr. Bonnie Henry’s phrase of ‘location, duration,
    relation’. You should have been close enough to that person (within two metres
    or six feet), for long enough (say, ten minutes), and doing something with them
    that is likely to get you infected. (This last one can be difficult for an app
    to figure out.) A false positive for contact tracing might tell you that you have
    been close enough to get infected because you were at the store and the clerk
    was infected whereas, in fact, you were separated from the clerk by a full Plexiglas
    barrier and didn’t exchange any physical objects and there is no way you could
    have been infected.


    A false negative is, of course, the opposite. The system doesn’t alert you to
    the fact that there was a contact that might have infected you.


    In regard to the contact-tracing apps on smartphones, a number of issues can lead
    to false positives. The location data for the apps is usually based on GPS and
    Bluetooth, neither of which is particularly reliable when it comes to determining
    distances of from 1.8 to 2.2 metres between phones. Neither of those technologies
    will be aware that you are behind a wall, curtain, or partition. In addition,
    you can be close to someone, for some time, and still not get infected: risk always
    involves an element of probability.


    There are a number of reasons why your contact-tracing app might not tell you
    that you had contact with an infected person. There is the aforementioned issue
    of the accuracy of the distance. (Plus the fact that the virus can travel farther
    than two metres: it’s not likely but it is possible.) The app might not properly
    transmit or copy the random code that is exchanged with most apps. Then again,
    the infected person you are near may simply not have a tracing app on their phone
    or (as is very likely with everyone designing their own) not one that is compatible
    with yours.


    Now, you might think that of the two problems, a false negative is the greater
    evil. After all, you want the app to tell you if you are at risk and it might
    not do so. That’s bad. And you actually have no idea if you are safe or clear.


    But, actually, in our current situation, false positives are the bigger problem.
