    feet’, ‘two metres’, and ‘fingertip to fingertip’ rules come from.)


    The size of the droplets, and the inability to hang in the air, is why masks aren’t
    very effective at preventing people from becoming infected with the virus (although
    they do help in some specific and dangerous situations where you are encountering
    a number of people with a high viral load who are coughing up a large number of
    droplets). Masks are somewhat more effective at preventing people who are sick
    from spreading infections since the masks, even just dust masks, catch the droplets.
    If you catch the virus, you probably won’t breathe it in. You will probably touch
