    I am not a doctor. I am not a virologist. This is not a medical book. But I put
    myself through university by working in the medical field, first as a practical
    nurse (I spent considerable time working in an isolation ward) and later as an
    industrial first-aid attendant. I''ve also been an emergency management volunteer
    for a couple of decades. But this is not medical advice. I am a security professional,
    not a medical professional (any more). I will express opinions on some of the
    medical issues. I''d like to think my opinions on medical issues are informed,
    but they are only opinions.


    One more medical point. ‘Coronavirus’ is a class or family of viruses that have
    similar basic physical structures. SARS-CoV-2 is one member of the coronavirus
    class and, before it had an official name, was referred to simply as a new, or
    novel, coronavirus. SARS-CoV-2 causes a disease called CoVID-19. A lot of people
    get these confused and think coronavirus, SARS-CoV-2, and CoVID-19 are all the
    same thing. They are related but there are distinctions. I may, in this book,
    sometimes use them interchangeably, and, if I do, I may sometimes use them the
    wrong way. If so, please forgive me. This book isn’t medical advice, it’s just
    using coronavirus, SARS-CoV-2, and CoVID-19 and the crisis arising from them as
    an illustration of security principles.


    This book is based on a number of individual observations, lessons, short articles,
    and other bits and pieces that I wrote and noted as the crisis went on. You can
    write a book that’s just a random collection of idle thoughts. (I’ve reviewed
    a number of them.) But it’s tedious and difficult for the reader, and the lack
    of structure and discipline makes it more or less inevitable that the author will
    forget or neglect something important. I have therefore opened with a chapter
    using the CIA (confidentiality, integrity, and availability) triad and then I’ll
    use the old ten-domain model that the International Information Systems Security
    Certification Consortium (or ISC)² used to use to arrange and organize exam and
    educational materials by subject, to structure most of the rest of it. (I know
    the newer eight-domain model is more holistic and therefore more representative
    of the reality of information security, but the ten-domain model, though arbitrary,
    is somewhat cleaner academically and easier to use for a book or course structure.)
    Hopefully, that will give us a place for everything and an easier way to find
    references.


    Who is the audience for this book? Well, as I mentioned, it started out as lessons,
    notes, and reminders for my colleagues in the profession of information security.
    However, I’m a teacher, and I’m always thinking of my classes in security whenever
    I am writing anything. So, while this is not a complete guide to security, it
    is for students of security a kind of giant case study, pointing out many of the
    most foundational concepts of security as they have been illustrated by the current
    crisis. But, since it is a current crisis, this book is also a ‘hot topic’ and
    so there are probably some non-professionals and non-students in the general population
    who may be interested. And, in the general'
