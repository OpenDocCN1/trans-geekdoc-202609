    Right now, we have an amazingly comprehensive example of how not to lead during
    a crisis. All you have to do is look at what is happening there and not do that.


    A leader has to listen. You can’t know everything: nobody knows everything. You
    need people around you who are gathering information, on an ongoing basis, and
    presenting it to you. The information is going to be imperfect since the whole
    situation is one enormous imperfection. You can’t demand that they bring you only
    solid information. You have to be able to deal with ambiguity and realize that
    the people you are relying upon are facing problems of their own. You have to
    know enough about the various aspects of the situation to take incomplete and
    possibly erroneous reports, figure out what is probably happening, and still make
    decisions.


    You have to be willing to make mistakes. You have to accept that you will. As
    G. K. Chesterton said, if a job is worth doing, it is worth doing badly. In any
    disaster, the best is very definitely the enemy of the good. If you are not willing
    to make mistakes, you are going to do nothing, and doing nothing is going to cause
    damage and suffering.


    You then have to be willing to admit that you have made mistakes if later data
    contradicts the imperfect or erroneous information you had to begin with. Anybody
    who points out that something is wrong is your friend, not your enemy. And you
    have to be willing to get on with the job without trying to assign blame. It’s
    not about you. It’s about the job, the crisis, and the people who are in trouble.


    You have to do what you can. And not worry about what you can’t do. As the Serenity
    Prayer says, you must have the courage to change what must change, the serenity
    to accept what can’t, and the wisdom to know the difference.


    You have to be consistent. Yes, I know that that statement comes into conflict
    with the fact that you have to change and adapt as the situation (or your knowledge
    of it) changes. So you have to be consistent about staying aware, about supporting
    those who support you, about the focus on the primary goal. You are a leader:
    you cannot check to see what is popular today. You have to choose the right goal
    and get everyone to work towards it.


    You have to motivate those who are doing the job(s) for you. You have to reassure
    them. Even if you’re not terribly happy with how someone is doing their job, if
    they are contributing something, remember that you catch more flies with honey
    than vinegar. (Also, in the middle of a crisis is not a great time to be making
    important decisions such as whether to fire someone.) You also have to keep them
    aware of the real problems they are facing. You can’t support people simply by
    saying that rainbows and unicorns are around the corner.


    And you have to take care of yourself. You have to make sure that you are not
    becoming too tired, too stressed, too depressed, and too distracted and therefore
    starting to make bad decisions. You have to pay attention to yourself and your
    level of coping.'
