    in. 的空间。我不知道他在找什么，但他显然从来没找到。我在这道不寻常但不可预测的障碍后面等了大约两分钟，他一直在游荡。最后，他看着我问道，“你不想从我身边过去吗？”然后走开了，嘲笑地看着我。


