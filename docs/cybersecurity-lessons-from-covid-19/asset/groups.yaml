    the numbers it has collected over the past 14 days.


    Unlike a centralized approach, this does not require big horsepower to centrally
    crunch large volumes of data and there is no central cache of personally identifiable
    information. Of course, it also means that the authorities do not automatically
    get a list of names for contact tracing (unless you turn yourself in).


    As I mentioned earlier, there are variations in regard to this basic idea. As
    noted, more or less data can be sent to the central database. Sometimes, the number
    pseudo-randomly generated is itself hidden further by hashing which hides the
    actual data but can be used for comparison. If this area interests you, there
    are a number of resources for further study. Possibly the first is the paper which
    gives the technical details of the DP-3T model, which allows for low-cost, decentralized,
    and hybrid models for proximity tracing. It also details the privacy risks of
    all three versions:


    https://github.com/DP-3T/documents/blob/master/DP3T%20White%20Paper.pdf.


