    Zoom, as a company, appears to have concentrated on ease of use, ease of installation,
    and functionality to the almost total exclusion of security. Up until now. As
    soon as a whole bunch of people started using it, a whole bunch of security researchers
    started noting various security weaknesses. There was the aforementioned Zoombombing.
