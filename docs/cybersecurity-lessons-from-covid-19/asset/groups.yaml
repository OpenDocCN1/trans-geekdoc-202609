    ## 作者


    **Robert Slade** 在大学期间曾在医院工作，后来担任工业急救员。之后他发现自己是一名教师，并且作为信息安全专家，他在六大洲教授过课程。在此期间，他还撰写了关于计算机病毒、软件取证和安全术语的书籍。（*Robert
    Slade 的计算机病毒指南*，1995、1996，Springer-Verlag；*病毒揭秘*，2001，Osborne McGraw-Hill：*软件取证*，2004，McGraw-Hill；以及*信息安全词典*，2006，Syngress）。他更愿意花时间和孙子孙女们在一起，而不是再写一本书。要让他认真对待“传记”写作几乎是不可能的，但关于他的更多信息，任何人都想知道的话，可以在
    Twitter @rslade 上找到。


    ## 引言*


    由于本书的很大一部分将涉及灾难和恐怖事件，而且你们所有人都会有很多关于人们在疫情期间表现不佳的例子，让我先从一个积极的角度开始。


    一个来自泰国的年轻人在新加坡遇到了他的女朋友。新加坡在早期成为了 COVID-19 的热点地区。这个泰国人的家人住在曼谷，曼谷也报告了 COVID-19 病例，尽管当时数字没有新加坡那么高。


    当他们听说有人恐慌性购买，口罩和洗手液等健康用品缺货时，他们设法搞到各种口罩寄过去。他们还塞了一瓶洗手液。他们支付了 860 泰铢的国际快递费，只为了他们的朋友能尽快收到包裹。这大约相当于
    30 美元，可能比口罩和洗手液本身还要贵。


    灾难会激发出人性中最坏的一面，但也会激发出最好的一面。


    这是关于安全的第一课。这是我一直在努力向我的学生强调的一个关于安全的基本观点。人既是最大的安全弱点，也是最大的安全优势。人会疲劳、犯错、被欺骗、做出错误的决定。机器不会（如果编程正确的话，但这种情况几乎从未发生过）。但人也能意识到，一个遵守所有规则的人可能仍然在试图蒙混过关。机器做不到。


    我是从一个特权的位置来看待 COVID-19 大流行的。我的工作没有突然消失，我的财务状况也不会消失，除非整个世界经济崩溃。（如果崩溃了，你也不会读这本书了，对吧？）此外，我住在加拿大，如果我需要的话，那里有像样的医疗系统。（另一方面，我又老又胖，还是男性，有糖尿病和高血压，这些都是在感染后出现最坏结果的主要风险因素，所以如果有任何
    SARS-CoV-2 病毒落在我身上，我就完蛋了。）


    卫生纸？我有一些，部分原因是我是一名应急志愿者，而且这是我通常作为家庭灾难应急包而储备的一部分，但主要是因为我很节俭，讨厌按原价购买，所以我倾向于在打折时买很多。（它不会变质。）理发？很久很久以前我就知道，我不够帅，无法胜任那些外表至关重要的职业，比如推销员、骗子、新闻主播、政客或名人超模。我的头发留得比较短，但我偏好的发型最好被描述为“易于打理”。


    我住在不列颠哥伦比亚省（BC），这是一个美丽的地方，如果你不能旅行，在这里度过危机是很棒的。而且特别幸运的是，在这个特殊时期，我们省政府的卫生部长 Adrian
    Dix 和首席医疗卫生官 Bonnie Henry 博士在位。（我们离奇地、随机地幸运，因为学校春假的日期可能早在几年前就定好了，恰好落在正确的时间，因此家长们有准备让孩子不上学，但还没有出发去那些可能带来灾难性后果的假期和旅行。）我们定期会有官方更新（通常被称为“Bonnie
    博士秀，Adrian Dix 和 [手语翻译] Nigel Howard 联合出演”）。（在本书中，你会听到更多关于 Bonnie 博士的内容。）所呈现的材料清晰、诚实、真实、信息丰富，考虑到我们对病毒知识的巨大空白，尽可能全面，而且奇怪地令人安心。此外，所采取的决定和命令使
    BC 省比几乎所有同等规模或更大的司法管辖区都更安全。（另一方面，我可以诚实地说，鉴于地理性爆发的反复无常，截至 2020 年 3 月 22 日，BC 省
    90% 的 COVID 相关死亡和加拿大 50% 的相关死亡发生在离我三个街区以内。也许认识我是一件危险的事。）


    许多人将大流行的日期定在 3 月 11 日。毕竟，这是世界卫生组织第一次愿意使用“大流行”这个词的日期。这也是那场臭名昭著的篮球比赛的日期，基本上结束了我们所知的体育运动。但对我而言，日期是
    3 月 10 日。三月是温哥华安全界的一个重要月份。在 3 月 10 日早上的咖啡时间，我安排了两场会议和两场演讲。到晚餐时，一切都消失了。


