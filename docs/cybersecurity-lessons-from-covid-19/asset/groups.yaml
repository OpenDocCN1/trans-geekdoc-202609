  - '[PAGE 96]


    At 8:30 AM, it showed a two-hour wait. (I had moved about three spaces in line
    by that time.)


    This testing centre is co-located with an urgent primary care centre (UPCC). The
    line-up is just for the CoVID-19 testing. UPCC patients bypass the line, and staff
    (or security) send them directly to the office. CoVID-19 testing people get taken
    in when the UPCC office is not too busy with other people.


    Up in the UPCC clinic, things are a bit more confused. There is a wait for registration.
    Once registered, you have a bit more freedom. (By the time I was registered, it
    was 10:30 AM, so I talked to the desk and then went and moved my car so I wouldn’t
    overstay the parking limit.) You wait for a while and then see triage. Everybody
    goes through triage, UPCC and testing alike. Once you’re through triage, there
    is yet another waiting area for CoVID-19 testing: they ‘batch’ the CoVID-19 tests
    in groups of four. (This is part of the reason the line-ups in the foyer and outside
    are inconsistent in movement. Also, UPCC cases may be given priority, depending
    upon severity.) Once the CoVID-19 group area is full, a ‘batch’ takes only about
    ten minutes.


    I was done about four hours after I first arrived. I figured that the people at
    the end of the outside line, when I left (at 11:30 AM), were looking at about
    a six-hour wait. (The Website estimated wait time, at that point, was showing
    ten minutes, so obviously it applies only to the UPCC patients and not the CoVID
    testing. Operations lesson: be clear in your communications.)


    The BC testing system has a number of options for letting you know your results.
    (My doctor had noted, when she asked me to get tested, that if the test was positive
    the testing centre would call me, and if it was negative, she would.) I registered
    (online) for notification via text message. I got my result (negative, thanks)
    about 25 hours after I was swabbed.


    As noted, this is an experience with a relatively robust and well-planned system.
    However, as also noted, there are always ways to improve, particularly as situations
    change.


    This experience also points out how important it is that we start planning (now,
    even before we have a vaccine) a distribution system and operation for whatever
    vaccine is developed. The plan may have to undergo some modification as we encounter
    special issues. For example, the vaccine candidates from Pfizer and Moderna apparently
    have pretty stringent refrigeration requirements.'
  - '[PAGE 97]


    # Telecommuni-

    cations and

    Networking

    Security **10**


    During the coronavirus/COVID-19/SARS-CoV-2 crisis, a number of people have said
    that they will be doing events remotely, and I’m quite sure that even more will
    be jumping on the bandwagon.


    In 1985, I ran the technical side of the World Logo Conference (WLC), which was
    the first ever fully integrated onsite/online conference. Subsequently, I worked
    as a data communications consultant in a wide variety of similar situations and
    events. I’ve done a number of online courses, Webinars, Webcasts, remote presentations,
    and other such events. That’s thirty-five years of experience in the field. (Longer,
    really, because my previous experience was what placed me in the WLC job.)


    Holding the onsite side of the hybrid conference in Paradise Valley, Squamish,
    British Columbia, was a non-trivial task. We used CompuServe, about three modems,
    lots of floppy disks for other machines (mostly reporting feedback from the onsite
    sessions), and rolls and rolls of printer paper tacked up to ‘corkboards’ along
    the walls. We had 75 participants onsite and 200 from around the world. I remember
    moderating one session at 5 AM. As far as I know, nobody has ever done anything
    like it since. I’d really like to attempt another hybrid conference to determine
    whether we can’t do better with the technology that we now have available.


    Warning: videoconferencing is not the same as having a face-to-face meeting. I’m
    sure that various psychology grad students are, at this very moment, doing tests
    to find out why this is so, in order to write theses and dissertations on the
    topic. We have trouble trusting discussions in videoconferencing'
  - '[PAGE 98]


    because we look at the picture of the person on the screen, rather than at the
    Webcam, and thus appear to be avoiding eye contact. Eye contact is one of the
    body language cues we use to assess whether someone is trustworthy. We have become
    used to sitting around a large table and talking to each other. We have gotten
    used to various protocols regulating who is allowed to speak and when. The examples
    of how to do this can be used to teach network access protocols: there is the
    sequential ‘round-robin’ protocol (known in networking as polling), the ‘talking
    stick’ (token passing), or the cocktail party (carrier-sense multiple access with
    collision detection, or CSMA/CD). We are able to figure out, from body language
    and other clues, when somebody might actually be saying something important. We
    are able, in the long periods that someone is just burbling on, to hold side discussions
    with colleagues. We are able, when we are speaking, to figure out whether we have
    convinced someone or are holding their attention, again by subtle body language
    indicators.


    With videoconferencing, almost all of this is lost. Most people don’t understand
    the significance of lighting or camera placement and feel that, if they can be
    seen at all, it’s fine. The pictures you see of people are thus from odd angles
    and with strange shadows, and people simply do not look like the ones you know.
    The pictures are generally small, and you lose a great deal of what body language
    normally tells you. In particular, since everyone is in their own frame and those
    frames cannot be arranged by seating preference or even your own choice, almost
    all normal indications of social dynamics and alliances are lost.


    There is a condition jokingly referred to as ‘Zoom fatigue’. It is no joke. It’s
    quite real. Videoconferencing is not something we are used to, and it contributes
    real stress in an already stressful situation. There are a number of additional
    factors involved in planning a meeting, conference, or seminar via videoconferencing.
    Videoconferencing is not an easier way to meet: it requires much more preparation
    and background resources than an in-person meeting and some significant additional
    supports to make people feel comfortable and to provide for work to be done.


    It’s been surprising how arduous it is to raise interest in setting up or attending
    an online meeting or presentation. Someone else complained about it: ‘Even CPE
    [Continuing Professional Education] won’t get my co-workers to attend. I hear
    the response, “If I’m not being paid to attend, I won’t attend”. So much for learning,
    sharing knowledge, and networking’.


    Part of the problem may be that everyone has become habituated to the low quality
    of ‘Webinars’—thinly disguised sales pitches with almost zero information content—that
    vendors put out. Now we are seeing similar things happening to conferences: in
    order to maximize revenue/profit, conference organizers are signing up all the
    vendors they can, letting them give sales'
  - '[PAGE 99]


    pitches as ‘presentations’ and putting no effort in (and leaving little time for)
    any actual presentations based on research or analysis.


    There’s also the fact that those of us in security, unlike a huge proportion of
    the population, (a) can work from home, (b) are working from home, and (c) in
    many cases are busier than ever (with fewer resources being provided by employers).
    I can see that—with everybody ‘maxed out’—meetings, presentations, conferences,
    and Webinars would be a lower priority.


    The fact that everyone is busy is bringing another problem to the fore. I had
    a meeting this week with other security leaders, and a good chunk of the first
    part was taken up with stories of burnout, stress, the need to take time off,
    the need to force people to take some time off to rebalance, and so forth. We
    probably need to take some care that we don’t become too stressed. That can be
    difficult. Under stress, your analysis and decisions—including the assessment
    of how much stress you are under and how it is affecting you—may be affected.


    These days, if you are doing an event or even just working from home, you probably
    want to do it with video calls or videoconferencing. And, even if your company
    has all kinds of teleconferencing equipment, it’s probably at the office and you’re
    probably at home. So you probably want one of the various videoconferencing programs.


    You can try a lot of them free of charge. You can even use a lot of them free
    of charge, subject to some limitations. There are a number of options, which have
    varying strengths and weaknesses.


    There is WhatsApp. Most people will think of it in terms of text chat, but it
    can make audio or video calls and even group video calls. However, it does have
    a four-participant limit for the video calls, and it doesn’t have some of the
    integrated functions that others do. WhatsApp, of course, is owned by Facebook,
    so you may be concerned about how much of your data is being sold, although the
    content of the calls themselves is encrypted and therefore protected. Also, your
    WhatsApp account is tied to your cell phone number. There is a way to make it
    work with a computer, laptop, or tablet, but it’s cumbersome, and while you are
    using WhatsApp on your computer, you probably can’t use it on your phone.


    Oddly, Snapchat, for video calls, does have a higher limit of 16 if you are willing
    to make the sacrifice of your security professional’s soul. Also, I am reliably
    informed by a Certified Young Person that the quality of Snapchat videoconferencing
    is appalling.


    Google, of course, has a foot in the videoconferencing door with Duo and Hangouts.
    The Vancouver Security Special Interest Group (SIG) used to Webcast its meetings
    with Hangouts, which has since fallen out of favour with our video team. We did
    do a test with Meet but the results were mixed (details in a bit).'
