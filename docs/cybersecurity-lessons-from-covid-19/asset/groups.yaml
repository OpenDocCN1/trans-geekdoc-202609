    # Physical Security


    # 6


    There is, in physical security, a concept known as ‘situational awareness’. As
    the name suggests, it is a simple idea, basically just being aware of the situation
    around you. Those who are really into physical security, which is generally the
    military and those ex-military personnel who do ‘personal security’ details, emphasize
    the topic. The theory is that if you are truly aware of the situation around you,
    you will know about any dangers before they get to you.


    In reality, of course, we are all somewhat aware of our immediate situation (except
    for those walking around with cell phones). At the same time, it is impossible
    to be completely aware of our surroundings. There are limits to our perception,
    and we don’t always have the knowledge to infer implications from clues that we
    can perceive. (In a foreign country where I had just arrived, I remarked that
    the farmers in this locale seemed very prosperous, surprising my hosts. A friend
    studying agriculture had once described a particular brand of silo that was both
    expensive and highly productive. Since there were a number of them in the countryside,
    it indicated that the local farmers (a) had enough money to buy them and (b) thereby
    would have increased their revenue.)


    But it is true that most of us do not pay enough attention to what is happening
    in our vicinity. We are used to living in a society where dangers do not lurk
    around every corner, and we expect that the government or the police or various
    other authorities will keep us safe. We tend to expect this even if we don’t particularly
    like or trust the government or the police or various other authorities (which
    I find rather inconsistent) and fail to understand that we are part of the government.
    (If you want the government to do something, maybe you should take the initiative.
    But I digress.) We rail against food agencies for not allowing unpasteurized milk,
    but we expect the food agencies to ensure that anything we buy (including from
    illegal roadside vendors) is safe and uncontaminated. We object to financial regulations
    but expect that we will be kept safe from fraudulent investment schemes or failing
    banks. It is likely that we should be paying more attention to what goes on around
    us.


    (The strongest illustration I ever saw of this was at Disneyland. Nothing was
    ‘real’, and everyone expected everything to be completely safe. I got the'
