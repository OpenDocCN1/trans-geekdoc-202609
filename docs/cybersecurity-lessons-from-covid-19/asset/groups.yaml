    # Security Operations


    9


    # DO WHAT YOU HAVE BEEN TOLD


    > > The future is in our hands, and we must continue to wash them.

    > >

    > > —Dr. Bonnie Henry


    You may have noticed, gentle reader, that I have, at various points in this book,
    dropped the adjuration to wash your hands into seemingly unrelated text. There
    is yet another lesson in my doing so: when teaching security awareness, remember
    that your primary model is advertising. Repetition, repetition, repetition. Drive
    the point home. Keep reminding people. In as many different ways as you can. Or
    just keep repeating the point.


    Now go wash your hands.


    There is yet another security lesson related to this one: the most important acts
    and principles are the simple ones. You don’t need hydroxychloroquine, you don’t
    really need remdesivir, you probably won’t need a ventilator. But you do need
    to take simple precautions: so simple that many people probably think, ‘It can’t
    be that easy’. It can and it is and you need to do it. (Them?)


    The World Health Organization is currently promoting Five Heroic Acts (which is
    rather brave of them since the phrase obviously pokes fun at the Chinese Communist
    Party with its humourless fondness for unimaginative and baldly descriptive naming
    conventions). There is absolutely no surprise in any of the ‘acts’. In no particular
    order of importance, they are:


    +   - Keep your distance. (Yup. The old six feet/two metres rule.)

    +   - Sneeze into your elbow. (Which is only code for ‘don’t cough onto people’
    and, if you do cough into your hands, don’t just ignore the fact that you’ve coughed
    germs onto your hands and then touch everything with virus-laden hands.)'
