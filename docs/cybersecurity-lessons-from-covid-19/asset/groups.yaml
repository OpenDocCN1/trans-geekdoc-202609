    # SOCIAL ENGINEERING


    Security theatre is doing—or, really, being seen to do—something that actually
    isn’t going to have any particular effect on the risk or threat people are worried
    about. That doesn’t mean it doesn’t do anything. It keeps people calm. In some
    situations, that can be quite important.


    In security, when we talk about social engineering, we tend to talk about attackers
    using it as a tool. We are simply using a fancy term for lying. Just about every
    form of fraud uses some kind of social engineering. Malware uses a version of
    social engineering via some kind of implied lie about what the program does (or
    doesn’t do). Some of the biggest names on the black side of technology weren’t
    really that technically adept: they were just good at lying.


    But we can use the power of social engineering for good as well as evil. I’m a
    teacher at heart. I am always using social engineering, mostly to get people to
    try things they never thought they could do. If you are a manager, one of the
    two things you are always managing is people. It’s handy to know some social engineering
    in order to manage them more effectively. (Someone has noted that people will
    run downstairs faster if you announce that there is leftover food from a meeting
    than if you yell ‘Fire!’)


    Dr. Bonnie Henry, in her daily press briefings, was constantly being asked what
    fines or punishments there would be for infractions of, for example, directives
    about gathering in public spaces or non-essential travel to common tourist destinations.
    (We have a lot of those in British Columbia.) Her answer was always the same.
    She refused to name punishments and instead stated she was sure that most people
    in the province were trying to do the right things and to keep themselves and
    their loved ones safe. Dr. Bonnie employs social engineering. What she said is
    absolutely correct: most people do try to cooperate and follow policies and guidelines.
    But she also knows that you catch more flies with honey than vinegar. If you assume
    that people will not cooperate and therefore you set up punishments and negative
    consequences, you make people feel badly about the whole situation. In that case,
    people are less apt to cooperate and will tend to spend more time and effort finding
    loopholes and ways around the rules rather than finding ways to live within them.
    If you say that you are sure people are doing the right thing, they tend to feel
    positive about the situation and are less inclined to amplify any minor grievances
    into a major problem.


    Use social engineering and get it to work for you rather than against. As someone
    else has pointed out, if we had called it the ‘stay-at-home challenge’'
