    我热爱公共图书馆。图书馆关闭时我非常难过。所以当我们公共图书馆设法建立了“外带”系统时，我很高兴。他们创建的这套系统有些奇怪的组成部分，但总体相当安全，而且非常便捷。第一件事与归还资料有关。对书籍进行有效消毒是不可能的，所以他们干脆不尝试。“投书箱”系统仍然保留，而且他们在三天内不会触碰任何归还的物品。简单有效。这保证了工作人员的安全，也进而保证了读者的安全。


