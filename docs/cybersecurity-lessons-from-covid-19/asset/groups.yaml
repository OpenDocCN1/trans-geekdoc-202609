    ![](img/f10cbbf38a9bd03e417173238b05b3fa_103_0.png)


    Zoom 无需安装测试 1.


    我使用从未用于 Zoom 会议的主邮箱地址注册，这导致了：


    ![](img/f10cbbf38a9bd03e417173238b05b3fa_103_1.png)


    Zoom 无需安装测试 2.


    我点击了提供的链接（那个 lo-o-o-ng 长 URL），结果如下：


    ![](img/f10cbbf38a9bd03e417173238b05b3fa_104_0.png)


    Zoom 无需安装测试 3.


    在此我必须强烈指出，我没有点击“下载并运行 Zoom”链接。我点击的是“从浏览器加入”链接。不幸的是，这带来了：


    ![](img/f10cbbf38a9bd03e417173238b05b3fa_104_1.png)


    Zoom 无需安装测试 4.


    这绝对不在我的任何浏览器中。它是 Zoom。


    此时，回看我的浏览器，我截取了以下屏幕截图：


    会议需要注册才能加入，不支持从浏览器加入。

    如果您已安装 Zoom 客户端，请尝试启动会议。否则，请下载 Zoom。


    ![](img/f10cbbf38a9bd03e417173238b05b3fa_105_0.png)


    Zoom 无需安装测试 5.


    有两点需要注意。第一，我绝对没有点击“下载 Zoom”链接。第二，注意屏幕底部的关于 Zoom_5a9bf98c8b046661.exe 的消息。我既没有运行它也没有保存它。如前所述，Zoom
    出现的原因是之前通过另一个浏览器进行的安装。


    所以 Zoom 在把软件安装到你的机器上方面非常“贴心”。作为一名恶意软件研究员，我对此感受并不确定。一方面，你大概可以让任何拥有浏览器的人加入会议，无论他们是否有
    Zoom 账号或是否使用过 Zoom。（这一点似乎与另一位朋友的经历相矛盾，他相当绝望地尝试加入一次 Zoom 会议却毫无成功。）另一方面，作为一种路过式下载，它效果很好，而我并不太高兴我的机器上安装了大量我从未授权其访问的东西。


    Zoom 会议安全吗？


    作为一家公司，Zoom 似乎将重点放在易用性、易安装性和功能性上，几乎完全排除了安全性。直到现在。一旦大量人开始使用它，大量安全研究人员就开始指出各种安全弱点。前面提到的
    Zoombombing 就是其中之一。还有对 Zoom 安全功能的“销售”过度强调，而这些功能存在重大弱点。例如，Zoom 通话据说已加密。使用的加密算法是
    AES（高级加密标准），这是一种被接受且备受推崇的函数。然而，它允许使用不同长度的密钥，而 Zoom 使用的是 128 位，远弱于通常标准的 256 位。此外，Zoom
    通话是“链接”加密的，这意味着 Zoom 能够读取任何流量，因为所有流量都经过 Zoom 服务器。关心隐私的人更感兴趣的是“端到端”加密（有时称为 E2EE），这意味着只有实际参与通话的人才能访问内容。


    然后是中国的因素。Zoom 名义上是一家美国公司。然而，超过 80% 的产品研发工作在中国进行。而且，在一些早期测试中，在没有任何参与者在中国的通话中，会议流量最终还是经过了中国的服务器。更近期的情况是，一名曾使用
    Zoom 会议策划六四天安门大屠杀纪念抗议活动的活动人士，其 Zoom 账号被停用。


    Zoom 表示它不属于中国共产党。顺便说一句，几乎所有被中国共产党拥有的公司都这么说。Zoom 表示经由中国路由的流量是由于服务器配置错误所致，我注意到，没有最近的分析显示相同的路由情况。Zoom
    承诺所有“已验证”的 Zoom 账号都将能够使用更强且端到端的加密。而且该活动人士的账号确实已被恢复。


    然而，我认为从国家安全角度来看，让每个人尽可能多地使用 Zoom 进行无关紧要的家庭聚会等活动，以便重要的商业和政府会议能在杂音中被掩盖，这是一个好主意。


    说到这里，我不得不跟你说说狗的事。


    大女儿最近搬家了。地方很漂亮，景色也很美，建在斜坡上，**way too many** 楼梯，我们住那里的话楼梯太多了。基于复杂的原因，她现在养了两只狗：Marley，年纪很大，不应该活这么久，还有关节炎等毛病；Fera
    年轻、紧张、有些神经质，而且 **extremely high-energy**。尽管年龄和性情差异很大，‘the pack’ 的关系非常好。


    Marley 下楼梯和我一样糟糕。她发展出一种奇怪的前腿并拢后腿并拢的双重弹跳方式来 travelling **down** 楼梯，但无法爬回去。不过当她走到房子底部时，她可以从露台出去，然后再下更多的楼梯，再沿着斜坡（很陡但至少不是楼梯）走到前门。


    scotia-online-covid19 不存在。


    但由于我足够偏执，我注意到 O（大写字母 ''o''）和 0（数字零）在大多数屏幕字体中看起来一样。


    而且，瞧！scotia-0nline-c0vid19.com（0nline 和 c0vid19 中使用了零）确实存在！它注册在巴拿马。很多商业模式可疑的公司都在巴拿马注册。


    （我建议不要靠近它。）


    这个是直接针对我的银行账户的，但每次灾难都会冒出大量诈骗。正如之前所述，有些假装成慈善机构，有些会针对救济项目，而许多只是常规持续的垃圾邮件和诈骗的延续。但其中一些欺诈似乎确实是疫情特有的。


    还有小狗诈骗。随着大家都待在家里，大量孤独的人突然想要一只宠物。（在危机和高压力时期做出如此重大、持续且改变生活的决定也许不是最好的主意，但我们在业务连续性规划中已经讨论过这一点。）因此，诈骗者注意到市场爆炸式增长，很乐意卖给你小狗！当然，大多数情况下，这些小狗根本不存在。而且，当然，你会用信用卡付款。它们会偷走你的卡。


    这就引出了运输钓鱼。疫情期间商店关闭，大家都待在家里，你很可能在网上订购过东西。（亚马逊、eBay 以及任何有在线业务的公司都在做着大生意。）所以你习惯于收到货物运输通知。你可能收到过几封声称来自快递公司的邮件，要求你在他们交付寄给你包裹前支付运费。这似乎可能合理，而且费用通常非常小。


    现在，这里有两点需要注意。一是数百万笔非常小的费用加起来仍然是一大笔现金。另一点是，当你用信用卡支付那笔很小的费用时，你就提供了诈骗者进行其他、更大额信用卡收费所需的所有信息。


    ## COVID-19、“羞辱”与网络欺凌


    最近看新闻时，我看到两位来自不同省份的政府官员和一位电视评论员建议，如果你看到任何囤积的证据，就应该在社交媒体上“羞辱”那些人。


    我能理解这种挫败感。我真的能。囤积是阴险的，在危机期间对整个社区造成极大破坏。那些‘批量购买’以高价转售的人是可鄙的。（我不在乎你是否认为这是‘美国方式’。它就是可鄙的。）那些偷窃医院物资的人绝对应该被起诉。


    但我不认为那些推荐公开社交媒体羞辱的人了解社交媒体。“羞辱”与网络欺凌仅一步之遥。如果社交媒体关乎任何事，那就是不成比例的过度反应。它没有关闭开关，没有审查或审核，也没有“被遗忘权”或补救手段。我们已经在危机期间看到误传或被误解的帖子疯狂传播，我们还会看到更多。不要火上浇油。


    这部分本应放在诚信部分，因为许多呼吁羞辱的言论事实上是基于错误信息甚至简单的误解。正如 Bonnie 博士对几乎所有记者关于人们身处错误地点或做错事的问题的回应，你可能不知道全部故事。


    例如，在封锁期间，有一些团体（大多在政治光谱的右翼，有时甚至比阿提拉大汗还要右一点）举行抗议，要求人们“解放”和“重新开放”各州。有些团体设有网站以组织抗议。研究这一现象的人发现，一些具有相似模式的域名是由一个人注册的，他们开始在社交媒体上发起攻击该人的运动。


    问题是那个人与抗议活动没有任何关联。他后来自称是一名年老的嬉皮士，在政治上如果有什么倾向的话，算是稍微偏左。他事实上注意到了完全相同的网站和域名模式，并注册了大量这些域名，以便抗议团体无法使用它们。这对他来说代价不菲。起初是经济上的，后来则是那些同样反对抗议的人对他进行的攻击。（好事无好报。）


    然后是星巴克的咖啡师。服务一名顾客时，他注意到她没有戴口罩。在他甚至来不及指出公司关于口罩的政策前，她（a）感到冒犯，（b）拍了他的照片，（c）连同他的名字一起发布在
    Facebook 上，期望大家都去星巴克侮辱他。结果并没有她想象的那样。大量网民在线上表达对他的支持，有人还为他发起了一个 GoFundMe 页面用于“小费”。他至少获得了
    8 万美元的小费。


    网络羞辱真的很难做到恰到好处。

    '
