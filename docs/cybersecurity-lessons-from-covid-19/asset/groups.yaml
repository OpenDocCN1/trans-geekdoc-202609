    # CONTROLS


    We in the security field are ‘controls’ freaks. Not control freaks (although some
    say we are that too). We are continually interested in controls that enable us
    to safeguard systems and data.


    Controls come in a number of forms. They may be administrative, such as policies
    and standards. Some controls are physical, as walls and removable media are. Increasingly,
    many controls are technical (or logical) measures like encryption and antivirus
    scanning. In planning and considering the types of controls we have, their effectiveness,
    and new ones we may need, we find it helpful to categorize controls into these
    different types. This tripartite arrangement of security controls has developed
    from the normal divisions of responsibility in business: management, physical
    plant, and operations (technical, in the case of information systems).


    We divide controls into other classes as well. Corrective controls are applied
    when others have failed (helping to build our defence-in-depth strategies), directive
    controls provide guidance, deterrent controls use social pressures to reduce threats
    from human attackers, detective controls determine that a breach has taken place
    (and may gather or analyze information about it), preventive controls reduce our
    vulnerability to threats, and recovery controls assist us to resume operations
    after an incident. This six-way partition of security actions has its roots in
    military and law enforcement studies. Compensating controls may be a seventh class;
    they are very similar to corrective, although they also include provisions for
    the normally expected run of errors.


    As we create security controls, the finer gradations and the more subtle the distinctions
    we can make between safeguards, the better our analysis of our total security
    posture. Having two taxonomies of controls, though, frequently confuses both students
    of security and security practitioners, who want to know whether a preventive
    control is supposed to fit under administrative or physical controls and questions
    of a similar nature.


    In fact, the two classifications are orthogonal. Trying to fit corrective, directive,
    detective, deterrent, preventive, and recovery divisions into the administrative/technical/physical
    structure does not fit, nor should it. The approaches, philosophies, and intents
    are quite distinct in the two different formations. Some time back, I created
    a ‘controls matrix’ to illustrate this issue'
  - '[PAGE 92]


    for students of security, and it turned out to be a remarkably useful security
    framework for analyzing your existing security strategies.


    At any rate, I was intrigued to find, in the various discussions about the COVID-19
    pandemic, that the administrative/technical/physical division of security controls
    has shown up. The names are slightly different. Technical controls, in a medical
    situation, tend to be treatments of various types, whether those are preventive
    treatments (like gloves or vaccines) or actual treatments for the disease. Physical
    controls, in medical terms, seem to be called engineering controls, like the Plexiglas
    shields being put up in retail establishments. Administrative controls are, as
    they are in security, the policies and tend to be referred to just as ‘rules’
    or ‘directives’.


    # INFORMATION SECURITY FOR

    WORK-FROM-HOMERS


    During the pandemic, one of the many things I saw posted was a page of advice
    on how to work from home. It was the standard, pedestrian, banal, ‘get yourself
    organized’ advice that everyone always posts about working from home. I’ve been
    an ‘independent consultant’ for a few decades. I also wrote four (or six, depending
    on how you count them) books, which involves a lot of working from home. Here
    are some of my tips on working from home:


    You may not have enough distractions at home. You know home. You are intimately
    familiar with everything in it. Familiarity breeds contempt.


    If you have access to a young child (or possibly someone with Down’s syndrome
    or dementia), they view the world in a different way. This can be extremely valuable
    to you. (Many people will think I am joking about this. Absolutely not.) If you
    work at it, you can take this experience with alternative views and, with practice,
    begin to look at the world differently yourself.


    You are unsupervised at home. This can be a great advantage. It is possible that
    you may simply slack off. However, it is also possible that you can look at what
    you are doing, and how, and figure out what is actually worth doing.


    When you work from home, you can develop an ‘always on’ mindset. This may come
    about in two ways. You may be a natural workaholic and just get ‘stuck in’. Or
    you may think that what you are doing is actually important. This can create a
    serious and damaging delusion. Once again, look at what you are doing and try
    to determine whether it is actually worth your effort and attention.'
  - '[PAGE 93]


    You may feel lonely and isolated at home. Especially if you don’t have a spouse
    or children. Then again, you have the Internet. Good grief! You can talk to anyone
    in the world! About all kinds of topics! How can you feel lonely and isolated?


    If you have a spouse or kids, you may feel that you can’t be with them. You may
    feel that you have to lock yourself in your home office for eight hours a day
    and not talk to anyone. That’s ridiculous. Talk to them. Play with your kids.
    Go for walks. (Stay away from anyone on the street, though.) Make multiple short
    blocks of time to lock yourself in your office if you must. You will be much more
    productive, in one hour, after you’ve spent some time actually talking to your
    spouse or playing with your kids. (And, again, how much of what you are doing
    at ‘work’ actually needs to be done?)


    You may need to be motivated. Why? Isn’t your work important or interesting enough?
    If that’s so, it should be motivation to find a different job. (You can search
    for one on the Internet.)


    Get distracted. Look out the window. Talk to someone on the Internet. Talk to
    your kids. Clean up your desk or office. You can find some interesting new ideas.


    Don’t procrastinate. (At least, not right away.) Do something. Anything, really.
    If a job looks too big and daunting, do something related to it to chip away at
    it.


    Create a schedule. It does help. But create it. Don’t just impose it on you and
    those around you. Find something that works for everyone.


    # TESTING OPERATIONS


    Security operations can be simple. But they can also become very complicated.
    A number of factors need to be assessed in any situation to make sure your operations
    are going as planned.


    The province of BC (British Columbia, where I live), in Canada, as previously
    noted, has had relatively low numbers overall. However, during July and August
    of 2020, there was a surge in cases. Even though BC has had a decent system for
    testing, the additional stress showed up a number of weaknesses and points out
    the types of things you should consider in any security operation. It also demonstrates
    that there are a number of limiting factors that should be considered in any operation,
    not just the maximum capacity of the system at the centre of it. The lab capacity
    for CoVID-19 tests in BC is 8,000 tests per day and, even with the surge, nowhere
    near that many are being'
  - '[PAGE 94]


    carried out. But, as this experience indicates, a number of issues can impede
    access to a test.


    Recently, a number of reports have shown that the elderly, despite showing no
    symptoms other than fatigue, can very rapidly move from fatigue to pneumonia and
    then death. So, even though I had no symptoms other than fatigue, my doctor wanted
    me to get tested. There is one (1) testing location on the North Shore. There
    is no available street parking around it. There is no street parking longer than
    one hour for three blocks in any direction. There is some pay parking a few blocks
    away, but you have to pay in advance (and thus know how long you are going to
    need to park). (I could take the bus, of course, but these days you have to factor
    that as an extra risk.)


    I went to the testing location and parked in a one-hour spot. Walked over. There
    was a serious lack of signage outside or at the doors of the building. None. (Operations
    lesson: extra information and signage are always good things.) Inside I did see
    a line-up of people, which I took to be a positive indication, so I joined them.
    Then, eventually, a staffer came along and told me that (a) the line-up actually
    started outside (I had noticed a few people seemingly milling about) and (b) the
    wait time was three hours. I asked what time the testing centre opened. She said
    8 AM but that people were lined up inside, even though they weren’t supposed to,
    when she got there at 7:30 AM. I left.


    Starting with the BC Centre for Disease Control (BCCDC) Website, I eventually
    found some information about the testing centre. It wasn’t easy. (Operations lesson:
    Website design, interface design, and information flow considerations are all
    non-trivial tasks.) The front page of the BCCDC Website right now gives CoVID
    info, but the first time is about the self-assessment tool which the government
    provides (which has no testing information) and the second is CoVID information
    for the public. Far down on that page it mentions testing. The testing information
    link gives you a list of symptoms to decide whether you should get tested. Then
    it mentions travel and twice more suggests the self-assessment tool. Finally,
    there is a terse link labelled ‘Collection centre finder’. (Operations lesson:
    consider what people might want to be most concerned to know.)


    (There is also an automated bot, the ‘BCCDC COVID-19 Digital Assistant’, which
    you can ‘ask’ a question. When I typed in ‘north shore testing centre’, I got
    a canned piece of info again talking about symptoms but finally giving a link
    to the testing information page.)


    That collection centre finder link brings up a map where you can zoom in and finally
    find that, yes, there is only one testing centre on the North Shore. (I first
    tried this on a smartphone, and the interface there is not easy. Operations lesson:
    note interface differences on different devices.) Clicking on the red dot provides
    some information, including the address and (finally!) times of opening. It’s
    open from 8 AM to 10 PM, except 9 AM to 5 PM on Sunday.'
