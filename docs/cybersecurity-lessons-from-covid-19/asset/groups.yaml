    Institute）在多个领域提供的课程。省政府创建了一个出色的架构，确保各类规模和类型的灾害以及所有类型的应对措施都能保持一致的组织布局。但我们不会费心去重新发明轮子。在我们的正式培训课程中，不少课程是由那些多年来一直在做并且最了解的团体来准备、提供和运营的。如果你的政府没有提供这些课程，那就去找那些有提供的人。他们就在那里。


