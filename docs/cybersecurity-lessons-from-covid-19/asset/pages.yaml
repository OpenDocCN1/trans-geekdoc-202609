  md: '# Author


    **Robert Slade** worked his way through university in a hospital and later as
    an industrial first aid attendant. Later he found out he was a teacher, and, as
    an information security maven, he taught on six continents. Along the way, he
    also wrote books on computer viruses, software forensics, and security terminology.
    (*Robert Slade’s Guide to Computer Viruses*, 1995, 1996, Springer-Verlag; *Viruses
    Revealed*, 2001, Osborne McGraw-Hill: *Software Forensics*, 2004, McGraw-Hill;
    and *Dictionary of Information Security*, 2006, Syngress). He’d much rather be
    spending time with his grandchildren than writing another book. It is next to
    impossible to get him to take ‘bio’ writing seriously, but more information than
    anyone would want to know about him is available on Twitter @rslade.'
