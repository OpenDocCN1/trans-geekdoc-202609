- pgno: 21
  md: 'There are also issues in regard to the ability of users to interact with the
    devices and understand the reality of their capabilities and responses. (My mother
    is in a care facility, which is, of course, keeping visitors away. I have a Facetime
    call, which the staff will be handling, booked with her in a few hours. My mom
    does NOT handle technology well.)


    # SECURITY, PRIVACY, AND CONTACT TRACING


    Because security is not a single ‘thing’, its parts sometimes come into conflict
    with each other. Confidentiality and availability are often in conflict, almost
    inherently so. When you are responsible for security, you are doing a balancing
    act—often several such acts at once.


    Well, has there ever been a more glaring conflict between security and privacy?
    We, globally, are in the midst of a pandemic. Contact tracing is one of the absolutely
    vital tools for containing the spread of the virus (particularly since many of
    the testing tools that we would otherwise rely upon are slow, error-prone, or
    in limited supply; we will talk more about testing and errors later). Public health
    and our populations as a whole need (rather desperately) information not only
    about specific community transmissions and infections but also about patterns,
    processes, and actual risks of transmission, and masses of contract tracing data
    would be vital to providing the basis for this research.


    At the same time, certain governments (probably all governments if they thought
    they could get away with it) are absolutely salivating at the thought of the surveillance
    possibilities they could gain through contact-tracing data. Yes, Google and Apple,
    in their cooperative work on the issue, have just (as I write) strongly come out
    in opposition to location data being part of contact tracing, but location should
    not be too hard to infer from the masses of contact data that could be gathered.
    Certainly, your familial, social, work, and other contact data would allow all
    kinds of surveillance possibilities. Whom do you meet? Whom do you meet frequently?
    Whom do you meet surreptitiously? And, since de-anonymization is so easy, what
    troublesome ideas and philosophies do they have that you might share?


    Governments aren’t the only ones. Companies would love to know whether you are
    social or a homebody and just how social you are. Simply looking at the number
    of close contacts you have would give them lots of information about the types
    of things you do and like and might be tempted to buy. And do'
  merge: -1
  img_proc: true
