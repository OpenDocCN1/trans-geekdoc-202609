- pgno: 11
  md: '# Introduction*


    Since much of this book will deal with disasters and horrors and since all of
    you will have numerous examples of how people behaved badly during the pandemic,
    let me start on a positive note.


    A young man from Thailand met his girlfriend in Singapore. Singapore, early on,
    became a CoVID-19 hotspot. The Thai family lives in Bangkok, which also reported
    CoVID-19 cases, although the numbers at the time weren’t as high as Singapore’s.


    When they heard about the panic-buying and health equipment like masks and hand
    sanitizers being out of stock, they managed to get their hands on a variety of
    masks to send over. They threw in a bottle of hand sanitizer. They paid 860 Thai
    baht for international express shipping just so their friends could get the package
    as soon as possible. That roughly converts to a whopping US$30, which probably
    cost more than the masks and the sanitizer.


    Disasters bring out the worst in people, but they also bring out the best.


    Here is the first lesson about security. This is a fundamental point about security
    that I try to emphasize to my students all the time. People are, at one and the
    same time, both your greatest security weakness and your greatest security strength.
    People get tired, make errors, get fooled, and make bad decisions. Machines don’t
    (if programmed properly, which hardly ever happens). But people can also figure
    out that someone who is following all the rules might still be trying to pull
    a fast one. Machines can’t.


    I am seeing the CoVID-19 pandemic from a position of privilege. My job didn’t
    suddenly disappear, and my finances won’t either unless the entire world economy
    collapses. (If it does, you aren’t going to be reading this book, now are you?)
    In addition, I live in Canada, which has a decent medical system if I need it.
    (On the other hand, I am old, male, and fat and have diabetes and high blood pressure,
    all major risk factors for worst-case outcomes if I do get infected, so if any
    stray SARS-CoV-2 virus lands on me, I’m toast.)


    Toilet paper? I had some, partly since I’m an emergency volunteer and it’s part
    of the stock I tend to keep around as the household disaster kit, but mostly because
    I’m cheap and hate to buy it at full price, so I tend to buy a lot when it’s on
    sale. (It doesn’t go bad.) Haircut? I learned—long, long ago—that I'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'am not handsome enough to get any of those jobs where initial appearance is
    vital, like salesman, con man, news anchor, politician, or celebrity supermodel.
    I keep my hair fairly short, but my preferred hairstyle is best described as ‘low
    maintenance’.


    I live in British Columbia (BC), which is a beautiful place to have to ride out
    a crisis if you can’t travel, and it is supremely fortunate in the government
    that we have in office at this particular time, our provincial Health Minister,
    Adrian Dix, and our Chief Medical Health Officer, Dr. Bonnie Henry. (We were oddly,
    and randomly, lucky in that the dates of the school spring break, set possibly
    years in advance, just happened to fall at the right time so that parents were
    prepared to have the kids out of school but had not yet left for vacations and
    travel that could have been devastating.) On a regular basis, we have an official
    update (which is generally referred to as ‘The Dr. Bonnie Show co-starring Adrian
    Dix and [ASL interpreter] Nigel Howard’). (You will, in the course of this book,
    hear more about Dr. Bonnie.) The material presented is clear, honest, factual,
    informative, as comprehensive as possible given the gaping holes in our knowledge
    about the virus, and, oddly, quite reassuring. In addition, the decisions and
    orders that have been taken have kept BC safer than just about any other jurisdiction
    of its size or larger. (I can, on the other hand, quite honestly say, given the
    vagaries of geographic outbreaks, that as of March 22, 2020, 90% of the CoVID-related
    deaths that had occurred in BC and 50% of those in Canada had occurred within
    three blocks of me. It’s possible I am a dangerous person to know.)


    Many people date the pandemic from March 11. This is, after all, the date on which
    the World Health Organization was first willing to use the word ‘pandemic’. It
    is also the date of the infamous basketball game that basically ended sports as
    we know it. For me, though, the date was March 10. March is a big month for the
    security community in Vancouver. At coffee time on the morning of March 10, I
    had two conferences and two presentations lined up. By dinner time, it was all
    gone.


    I recently saw a headline that asked, ‘Have you lost your purpose since CoVID-19?’
    I realize that many people would: most people either are defined (by society)
    or define themselves by the job they hold. I’ve been self-employed or making my
    own jobs for three decades. And most of my colleagues are in jobs where they can,
    and are helping others to, work from home. We’re busier than ever. I don’t have
    enough hours in the day.


    Mental health turns out to have been a much bigger issue during this pandemic
    than I would have expected. I recently attended a (virtual) meeting with some
    of the leaders in the security world, and the first few minutes were filled with
    stories of having to deal with stress, having to take time off, needing to force
    people to take time off, and other such issues. So I guess one of the next security
    lessons is that you have to take care of yourself. Which is easy to say'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'but possibly difficult to do. When you are under stress, you make bad assessments.
    And one of the assessments that may be in error is how stressed you are and therefore
    how bad the decisions you’re making are. This is related to the impairment of
    how well you can determine yourself to be impaired if you are impaired and also
    the Dunning–Kruger effect. But taking care of yourself does lead us to a couple
    of other points.


    A friend, who is a doctor, asked whether he should volunteer to go back to work,
    as a front-line physician, during the coronavirus/COVID-19/SARS-CoV-2 crisis.
    So what can retired doctors (and nurses and engineers, etc.) do during COVID-19?


    As we know from emergency management, the first rule is not only ‘First, do no
    harm’ but more specifically ‘First, do no harm—to yourself’. You (and I) are old,
    Father William. Not only are the old particularly susceptible to the virus, but
    (for reasons not yet either verified or fully understood) front-line medical workers
    also seem to be particularly susceptible. Going back in as a front-line worker
    may not be the best use of your skills and experience.


    Right off the top, may I suggest that you start reaching out to other retired
    doctors (and other professionals)? I know that lots of them have already volunteered
    to return to active service. But I suspect that some of them are concerned, as
    you are, about the dangers (or are under family pressure) and may be wondering
    about how best to proceed. You could be the founder of Doctors (Nurses, Engineers,
    etc.) Without Pay Cheques and get a wealth of skill and experience mobilized in
    some interesting new directions. Yes, with the hoarding and panic-buying going
    on, we are having to spend more time just getting the necessities of life, but
    we still have some time to contribute.


    One of the first things to do is search out and fight mis- and disinformation
    with facts and analysis. Most people don’t have your knowledge of disease, disease
    vectors, hygiene rules, transmission vectors, the lifetime of an infectious agent
    outside the body, the difference in effectiveness between soap and hand sanitizer,
    or even the difference between a bacterium and a virus. Most people are scared
    because they are relatively ignorant about these things. (They may not be completely
    ignorant and may not be ignorant of other things, but they don’t know as much
    as you do about the specifics.) They are bombarded by news stories about people
    becoming sick and people dying. They are scared (and also don’t know as much as
    we do about risk analysis and calculation). They feel powerless, and ‘wash your
    hands’ doesn’t feel like it should be enough. People feel scared and don’t have
    enough information, so they either don’t do anything and ignore the whole situation
    or believe any random myth they hear because at least it seems like they are doing
    something.


    You could also reach out to students. A lot of them have a lot of time on their
    hands right now. Even if they aren’t fully trained, most of them have more information
    than the general public and can help. Students will also greatly'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'benefit from working with you and the rest of us old codgers while we try to
    help in various ways, and they’ll get valuable practical experience in the things
    medical (and nursing and engineering and computer security) schools can’t teach
    them. They’ve got more energy than we do. And there are some interesting projects
    they can assist.


    As well as the misinformation, there are other questions to be researched. Not
    being on the front lines, you/we may not be able to research or answer them directly.
    But some old physician somewhere may have an insight that might be key. These
    are questions like: Are/Why are front-line medical workers at greater risk of
    CoVID-19? Is ibuprofen actually a risk? Are vitamins C and D actually a benefit?
    When (and how much)? Lots of questions fall into this category.


    But, probably more importantly, there are some projects that can be undertaken
    without direct front-line contact or exposure. For example, there was great concern
    over the availability of ventilators. Multiple projects are looking into low-cost,
    easy-to-manufacture, ‘open source design’ ventilators. (A number of these projects
    are being carried out by students.) One hospital in Canada is putting out videos
    showing how, with extra tubing and connectors, you can get one ventilator to support
    up to three patients. You need to get a retired respirologist to see if it will
    work and a retired engineer to see if it is feasible for manufacture by anyone
    with less than an engineering doctorate. Also, you, as a risk manager, need to
    look at the various designs, noting that (in this case) the best may very well
    be the enemy of the good and that something that is only 80% effective but can
    be built with scuba tanks and a child’s toy may well save more lives than something
    that is 99.44% effective but requires a piece of The One True Cross to work. (You
    may need retired politicians to place these ideas in front of the authorities
    or retired businessmen to set up manufacturing.)


    Think outside the box. A lot of us started work before there was a box.


    Now go wash your hands.


    What is the great lesson that CoVID-19 is teaching us? Well, history tends to
    teach us that history teaches us nothing, but let’s be a bit more hopeful for
    a moment. There are many lessons to be learned. This book started as a compilation
    of lessons for my security colleagues. But a few of them are more generally appropriate.
    And there are a number of them.


    If you believe everything you read, you had better not read. I know. Terrible
    thing to say. But it is true that a little knowledge is a dangerous thing. Not
    half so dangerous as a lot of ignorance, I suppose. And there have been huge amounts
    of mis- (and even dis-) information around this virus and the related disease.
    So, please: wash your hands. Don’t drink bleach. Keep physically distant from
    people and don’t try to find loopholes around those rules. Stick to the basics.


    More problems are caused by our overreactions than by the original event. Having
    huge amounts of toilet paper will not keep you from getting infected.'
