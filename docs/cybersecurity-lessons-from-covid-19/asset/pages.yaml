- pgno: 115
  md: '# Be Kind. Be Calm. Be Safe 12


    # BE KIND


    Dr. Bonnie Henry, provincial health officer for the province of British Columbia
    (BC), in Canada, was, on an almost daily basis, for months on end, the voice (and,
    to be fair, the architect) of the government’s response to the coronavirus crisis.
    Almost every day at 3 PM, she would hold a virtual press conference with reporters
    calling in by phone to submit questions. At this point, I do not want to dwell
    on Dr. Bonnie’s qualifications, background, or the excellence of her guidance.
    I do want to say that these press conferences amply demonstrated that Dr. Bonnie
    is the person for whom the phrase ‘patience of a saint’ was meant to describe.


    Day after day, reporters asked dumb questions, questions with no answers, questions
    that had been amply answered, and trick questions meant to elicit some sensational
    sound bite. Day after day, Dr. Bonnie disappointed the journalists of the sensational
    and reassured the rest of us. She answered the dumb, impossible, and repeated
    questions, and I never, ever saw her lose her temper, even when I, at home, was
    losing mine, at their 17th attempt to obtain a ‘one size fits all’ quote that
    could later be used to attack Dr. Henry and boost newspaper sales.


    One of the most common questions that reporters would endlessly repeat was some
    variation on ‘How viciously should we attack people who don’t keep six feet away
    from other people in line or pass a hand-sanitizer dispenser without gooping their
    hands or go to the beach when I don’t feel safe doing so?’ Dr. Bonnie’s constant
    answer was the first part of her triple mantra: Be kind.


    She usually backed it up with a rationale for not taking instant offence at every
    perceived infraction. For one thing, you don’t know everything. That group of
    a dozen people in the park? Maybe they are all members of one family and household.
    They are going outside and breathing some fresh air. They are carefully keeping
    distanced from everyone who is not part of their household.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'They aren’t actually breaking any rules. That person not wearing a face mask?
    She has chronic obstructive pulmonary disease, and a mask is almost a death sentence
    for her. That person wearing a face mask? He doesn’t have CoVID-19 but does have
    a cold and needs groceries but wants to minimize the risk of spreading his cold
    to anyone else.


    I do understand some of the journalists and some of their motivation. We are all
    under enormous stress. We are possibly in danger of our lives. We are certainly
    not living as we would wish: life, as we know it, has been indefinitely suspended.
    And that ‘indefinitely’ only adds to the stress. We don’t know when this will
    end. And we want someone to blame. What better candidates than those fools who
    are doing what we don’t approve of? Well, Aleksandr Solzhenitsyn observed very
    much the same thing and noted the same reaction from the general public. In The
    Gulag Archipelago (Harper & Row, 1973), he noted: ‘If only it were all so simple!
    If only there were evil people somewhere insidiously committing evil deeds, and
    it were necessary only to separate them from the rest of us and destroy them.
    But the line dividing good and evil cuts through the heart of every human being.
    And who is willing to destroy a piece of his own heart?’


    There is a wonderful principle for when you feel like people are acting specifically
    in such a way as to cause you harm. It is called Hanlon’s razor and it is formulated
    along the lines of ‘Never attribute to malice that which can be adequately explained
    by stupidity’. In other words, stop, take a breath, and consider that maybe they
    aren’t out to ‘get’ you. Maybe they don’t know what you know. Maybe they aren’t
    as smart as you. Maybe, from their perspective, they are doing the best they can,
    even if that best isn’t perfect. Maybe, instead of going on the attack against
    them, it might be more effective to think about how you might help them make better
    decisions and take better actions.


    How nice, I hear you say. But what does this teach us about security? Well, quite
    a lot, when you think about it. Even before we delve into personnel management
    issues, think about one thing. Why are we doing security?


    We aren’t doing security just because we know the technology. (Hopefully we have
    this background.) We aren’t doing security just because it’s fun. I think it is:
    a lot of people disagree. One of them is my friend Ron, who was an absolutely
    stalwart support for the Vancouver Security Special Interest Group (SIG) for over
    three decades. He worked hard for us, he did lots of the unregarded admin jobs
    that nobody wanted to perform, and he was always reliable. When he retired from
    his day job in security, I asked if he was still going to come out to the SIG
    meetings. He said that he wouldn’t: he had never been all that interested in security
    and just did it because it was his job.


    While that is not a great example for career planning, it is an absolutely perfect
    answer to the question of why we are doing, or should do, security. Ron did security
    (and very well too) to support his enterprise. We are doing security to support
    our respective businesses, employers, and fellow workers.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'We are doing it to be kind to those around us and to keep our colleagues safe
    and sometimes to keep our communities safe as well.


    Looking at it from this perspective can be extremely important in terms of your
    overall attitude to security. We, as security professionals, are often seen as
    impediments: we are ‘the knights who say no’. We are the people who are always
    telling others what they can’t do. And we, all too often, see ourselves that way:
    we are the ones who know the risks, and we have to keep these fools from hurting
    themselves.


    But, when you turn it around—we actually are here to help—it can make a big difference.
    There is an actual reason we say no, and it isn’t just to impede things, so maybe
    we don’t have to say no. Maybe we can say ‘yes, but’. So when the next C-suite
    executive comes up with the next great idea he got from an in-flight magazine
    to implement blockchain on all your logins, you can tell him that blockchain is
    a fascinating field of study and you’d dearly love to help implement it, but it
    does take a lot to set it up correctly, so you assume he’ll be supporting your
    ask for $500 K for the initial implementation and the extra two full-time equivalent
    (FTE) positions to manage and maintain it.


    OK, perhaps that is a bad example—you know he won’t, and you’ll never hear about
    it again, so that’s equivalent to saying no. So, maybe, when you find that lots
    of the staff are choosing really stupid passwords, you can start your security
    awareness sessions on password choice by saying that you know the staff want to
    perform their tasks, and their system accounts are there to help them in their
    jobs. But if they choose easy-to-guess passwords and their accounts are hacked,
    the company has to take their accounts (and therefore their jobs) away until things
    can be fixed, and you have some pointers that help to ensure their accounts are
    safer. You are there to help. To be kind.


    # BE CALM


    On May 22, 2020, Dr. Bonnie Henry was ‘adopted’ by the Gitxsan First Nation and
    given a Gitxsan name. The province’s top doctor was named ‘Gyatsit sa ap dii’
    m’, meaning ‘one who is calm among us’.


    It is well known that, when making a business continuity plan, you always try
    to be as detailed as possible so that the people following the plan do not have
    to make decisions while they are stressed and at their worst.


    Be calm. Take a breath. Relax. Change the things you must change, let go of the
    things you can’t, and know the difference.


    Once again, many reporters had a constant theme in all the question periods following
    Dr. Henry’s press briefings. Whom do we blame? Whom can we'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'punish? Who is at fault? Whom do we call out? Whom can we rail about in our
    editorials? The reasons they want to blame someone vary. Why is there a shortage
    of PPE (personal protective equipment)? Why are people going to the vacation house?
    Why are people congregating at the beach? Why are protesters showing up in large
    crowds? Why don’t people use masks? Why are people relying on masks? Why aren’t
    you making stronger rules about masks? But mostly they all want someone to scream
    at.


    I can understand the feeling. We are faced with a big, scary, complex, unknown
    risk on top of risk on top of more risks. Everyone is frightened. Everyone is
    tense. Everyone is short on sleep and having bad dreams and feeling helpless.
    It’s quite clear why everyone wants someone to blame for this whole mess or even
    just a little part of it. It’s also completely useless. Trying to assign blame
    in the middle of a disaster is one of the worst decisions you can make. And also
    the least productive.


    # BE SAFE


    As previously noted, the primary rule in emergency management is ‘First, do no
    harm—to yourself’. If you do not take care of yourself first, you can’t help others
    and you risk becoming part of the problem. Especially in a pandemic, as with the
    computer virus example I gave earlier, if you become infected, you might require
    medical resources that are in short supply and high demand, and you become a source
    of risk to everyone around you, most particularly to those closest to you.


    Firefighters are brave: that is not in question. But, movies and TV shows notwithstanding,
    they do not just run pell-mell into a burning building to save someone. They have
    trained and practiced. They have protective equipment and spend hours making sure
    that equipment is maintained and ready to use at need. When they do run into a
    burning building to save someone, it is with a plan of how they will run back
    out again. (A young friend, who was, at the time, interested in becoming a firefighter,
    once ran into a burning house to put out the fire. Since the house was, as they
    say, ‘fully involved’ and he was armed with a one-pound dry-chemical fire extinguisher,
    I had to risk my life by running in after him to haul him out.) (OK, it was necessary
    in that instance, but I do not recommend it.)


    Another factor to note: many people are starting to show signs of ‘quarantine
    fatigue’. This is a special case of ‘caution fatigue’, a well-known psychological
    phenomenon that is a result of the way that humans react to threats and stress.
    We are wired to react to changes, and when a threat is prolonged, we'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'start to become acclimated to it and no longer regard it as a threat. Therefore,
    as the pandemic goes on, people start to relax their following of the rules that
    they willingly followed at the beginning of the crisis. Don’t.


    We can’t give up on the rules until we develop (and test) an effective vaccine
    and have enough doses of it for almost everyone. Even though various restrictions
    may be dragging on and even though case numbers may be going down, follow the
    rules and stick with the World Health Organization’s Five Heroic Acts.'
