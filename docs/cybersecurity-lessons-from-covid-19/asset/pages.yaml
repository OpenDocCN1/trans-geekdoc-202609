  md: 'So what does Krispy Kreme (in New South Wales, Australia) do to aid things
    in this situation? They have a donut giveaway to celebrate their 83rd birthday.
    It was a success.


    If you think drawing big crowds, in this environment, is a success.


    # RISK FACTORS


    As has been said, we are all in the same storm, but we are not all in the same
    boat. As I noted in the Introduction, I am writing from a position of privilege.
    Even though an outbreak occurred three blocks away from where I live, management
    of public health in my province has been highly effective and I am at very low
    risk. (I can safely type those words since, if I die, I won’t finish this book
    and nobody will ever read this.)


    We do not yet know all about SARS-CoV-2 or COVID-19. We do have some information
    about various risk factors.


    First, there are risks regarding becoming infected. One is location. As many epidemiologists
    have pointed out, the pandemic is not universally and evenly affecting everyone.
    It is best seen as a series of local epidemics. Some locations have been hit very
    severely. Some, even some not far away from hard-hit areas, get off lightly.


    We don’t know all of the factors involved in geographic risks. Some have posited
    that hot and dry locations have less risk of transmission. Looking at which countries
    have been hardest hit might seem to support this idea, but it’s hard to say for
    certain.


    There are some indications that children don’t transmit the virus to one another
    as well as older populations do. (Which kind of flies in the face of the point
    of faith among teachers that kids are little germ factories, spreading diseases
    every September when school reopens.) There are some other data that, combined
    with this observation, might support the hypothesis that children are at lower
    risk of getting COVID-19 than adults.


    Infection rates do seem to show that, across many countries, more women get the
    disease than men. However, this might be due to the fact that women are more highly
    represented in nursing and other ‘public facing’ occupations (such as retail clerking),
    so possibly this relates more to occupation than to gender.


    Once someone has the disease, the risk factors are somewhat clearer. Those who
    are older have a greater risk of showing severe symptoms, have a greater risk
    of requiring hospitalization, have a greater risk of complications, and a greater
    risk of death. And, quite clearly from the data, the older you are, the greater
    the risk in each of these areas. Young people generally have'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'less severe symptoms, lower need for hospitalization, and fewer deaths. Those
    in their thirties have more, those in their fifties even more, and those in their
    eighties are at extreme risk if infected. As always when talking of risk, probabilities,
    not certainty, are the order of the day. There are children who have died and
    centenarians who have survived.


    Once infected, men seem to have worse outcomes than women do. The data may be
    slightly skewed by the fact that men hide problems and symptoms and therefore
    may simply be sicker once they admit that they are sick. However, death rates
    tend to confirm that men are more seriously affected.


    A number of underlying health factors seem to be related to worse outcomes. Those
    with diabetes and high blood pressure seem to generate more hospitalizations,
    complications, and deaths. The same holds true for obesity, although obesity is
    also strongly tied to conditions like diabetes and stressed cardiac systems, so
    possibly this is simply the same risk factor being seen from different sides.


    CoVID-19 has been a terror for the elderly, particularly for those in care homes.
    Not only do the factors of age and underlying medical conditions come into play,
    but also the factors of close proximity, lack of ‘personal space’, common eating
    and recreational areas, and staff constantly moving between residents. As generally
    provided in Western societies, elder care is almost a ‘perfect storm’ of risk
    factors for this particular disease.


    There is yet another area of risk. We are used to infections where, once you have
    been sick and recovered, you are cured. In most cases of CoVID-19, this is the
    pattern we see. But there are some who do eventually fight off the virus infection
    and start to recover but still have lingering aftereffects. Many have respiratory
    symptoms and difficulties that persist for months. There are reports of weakness
    and fatigue. The loss of a sense of smell and taste can linger for some time.
    There are also reports of delusions and dementia. We do not yet have enough information
    to know how frequently this may be the case, nor how long it can last. In some
    cases, the disabilities may be permanent.


    There are many parallels between risk in disease and risk in security. We do not
    know all the factors. We do not have all the information. We work, as best we
    can, partly in the dark. We try to tease out, as best we can, those threats that
    we can see, and we protect imperfectly against those we can only theorize about.


    # METRICS


    Security supports business. Security is business, and requires management. And,
    as the old mantra has it, you can’t manage what you can’t measure. In'
