  md: '# Cryptography (Yes, Really)


    As I mentioned, when I first thought about structuring this material based on
    the security domains, my immediate thought was that cryptography would be a non-issue.
    I was wrong again. It was that same day on which I found out about the Decentralized
    Privacy-Preserving Proximity Tracing (DP-3 T) and related protocols in regard
    to contact tracing.


    As we discussed in Chapter 1 on confidentiality, integrity, and availability (CIA),
    the DP-3 T protocol is not the only version of contact tracing that is available.
    It is the type of protocol that most privacy experts are promoting. It is useful
    for contact tracing. At the same time, surveillance and abuse of the contact data
    base is prevented. Here is a rough outline of the basic privacy protecting concepts.


    Each day, or at some other regular preset period, my phone generates a new number,
    also known as a beacon, which is similar to a nonce or salt. It is simply a piece
    of data, preferably random and long enough so that someone else is unlikely to
    have the same random number. My phone is regularly broadcasting that number. Just
    as yours is broadcasting your number. You could just keep the same number for
    a longer period of time, but the longer it is being used and broadcast, the more
    possible it is for someone to start tracking you by using that number. You could
    also choose or generate a new beacon every time you broadcast. There are three
    reasons you might not want to: (1) generating pseudo-random numbers is always
    a non-trivial task, (2) you will have to store that much more data, and (3) using
    a new beacon for every broadcast means you can calculate the duration of contact
    (which is important to the risk of infection) only if you also store at least
    the time the beacon was sent and transmit that data to the database.


    When you and I are both at the same locale (or at least close enough for Bluetooth
    to pick up the broadcasts), your phone records my number for that day, possibly
    along with when and where it was ‘seen’ or ‘heard’. There are going to be variations
    in the implementation of the protocol, depending upon how privacy-emphasizing
    you want to make it. It will still work with just random numbers, and obviously
    including time and location provides more'
