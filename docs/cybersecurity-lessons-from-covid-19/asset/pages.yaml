- pgno: 122
  md: 'Absent the world leaders in CoVID-19 cases (currently the US, Brazil, Russia,
    and India), most places in the world either have relatively low numbers of cases
    or have passed through the first wave. While every death is a loss and businesses
    of all types have suffered serious damage, lockdowns and the basic hygiene rules
    of the World Health Organization’s Five Heroic Acts do seem to be effective in
    containing the disease. Enterprises of almost all types are adjusting in various
    ways: manufacturers are retooling to produce high-demand items, restaurants are
    going to a takeout model, and sports leagues are figuring out procedures for at
    least holding televised competitions. (Events planners do seem to be slow off
    the mark in terms of creative adjustments and alternatives, which seems rather
    odd.)


    The curve has been flattened. We now know what we need to do to slow the spread
    of the disease to manageable levels, even if we never cure it.


    Of course, we actually have to do the things we know we should be doing. As I
    am finishing up the text and last edits of this book, there is great concern over
    the number of very large private parties that are going on in contravention of
    everything we know about how to avoid infection. Maybe we don’t deserve to survive,
    as a species, if we can’t go a couple of years without mass concerts, alcohol,
    huge parties, and completely thoughtless behaviour. You want to get together with
    a whole bunch of random strangers? Too bad. I want to hug my grandchildren, go
    to conferences, and go to restaurants and sit there and eat hot food without having
    to eat it cold after taking it all the way home. Can’t. This is an emergency and
    we have to behave appropriately.


    (Have I mentioned the memes harkening back to the two World Wars and similar events?
    The memes point out that those people had to risk their lives to save humanity
    and all you have to do to save the world is stay home and watch TV.)


    You’re tired of all the rules? Well, we could probably reduce them to just one.
    We’ll probably survive if we give up alcohol for a couple of years. Look at the
    facts. Bars have to be closed and restricted. Bars serve alcohol. Restaurants
    have new rules imposed. Restaurants serve alcohol. Concerts are banned. Concerts
    involve alcohol (even when they aren’t supposed to). We can’t go to sports arenas.
    Sports arenas serve alcohol. Parties are dangerous. Parties usually involve alcohol.
    (Let’s face it: every party except birthdays for ten-year-olds has alcohol, and
    even then the parents are probably drinking.) Why aren’t the conspiracy theorists
    on to this? There is much more evidence that alcohol causes coronavirus than that
    5G does, and the tin-foil-hat crowd is out there burning down cell towers.


    We haven’t yet found a cure. Hydroxychloroquine seems to be useless and even dangerous
    (unless very carefully managed). Oleandrin comes from a poisonous plant. (Lots
    of drugs do, but there isn’t really any evidence yet that oleandrin has any medical
    benefits.) Remdesivir does seem to slightly reduce'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'time sick and slightly reduce the possibility of death. Dexamethasone seems
    to be showing some promise, but we don’t know much about the benefits (and risks)
    yet (as of this writing). But we’ve been at this less than a year. And, if it
    is going to take a while, we know what we have to do to buy time. Follow the rules.


    We haven’t got a vaccine. Yet. We have never successfully created and tested an
    effective vaccine for this class of viruses. We do have more than 1000 candidates,
    and we have a number of approaches that have led to vaccines for a wide variety
    of viruses in the past. And we know what we have to do to buy time for the development
    and testing.


    There is a recent book on climate change, *The Uninhabitable Earth* (Tim Duggan
    Books, 2019), by David Wallace-Wells. He notes that the realization that global
    climate change is caused by humans should give us comfort, not despair. We are
    responsible for the change and therefore we are in command and can change the
    situation. By similar logic, in terms of the pandemic, we do know how to beat
    it. We just have to follow the rules.


    A couple of days ago, I gave the first actual presentation of the talk on which
    this book is based. There was one question that I found rather odd, and I’m not
    sure that I understood what motivated it, but someone asked whether, in view of
    the various research being done, effort was being wasted on novel research, that
    could be put into reproducing the results of earlier research, which is the acid
    test for scientific research. As I said, I’m not sure what prompted the question,
    but I have to assume it is based on a fear that somehow the research is being
    distracted by new questions and should be finishing the existing work before moving
    on. But science is not a single effort. Hundreds of thousands of people around
    the world are looking at what has been done, what is being done, and what could
    be done. If you think that isn’t enough, maybe you should encourage your children
    to pay closer attention to science classes in school and get into research when
    they grow up. But I don’t think we need worry that existing research will not
    be tested and challenged. Jacques Plante, the great ice hockey goalie, once asked:
    ‘How would you like to have a job where, when you make a mistake, a big red light
    comes on and 15,000 people boo?’ Science is much, much worse, in that regard,
    than hockey. In science, when you do something right, all of your friends try
    to prove you wrong.


    Forty years ago, I read Aleksandr Solzhenitsyn’s *The Gulag Archipelago* (Harper
    & Row, 1973). Some of the passages have stayed with me ever since. Like this one:


    > What about the main thing in life, all its riddles? If you want, I’ll spell
    it out for you right now. Do not pursue what is illusory—property and position:
    all that is gained at the expense of your nerves decade after decade, and is confiscated
    in one fell night. Live with a steady superiority over'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'life—don’t be afraid of misfortune, and do not yearn after happiness; it is,
    after all, all the same: the bitter doesn’t last forever, and the sweet never
    fills the cup to overflowing. It is enough if you don’t freeze in the cold, and
    if thirst and hunger don’t claw at your insides. If your back isn’t broken, if
    your feet can walk, if both arms can bend, if both eyes see, and if both ears
    hear, then whom should you envy? And why? Our envy of others devours us most of
    all. Rub your eyes and purify your heart—and prize above all else in the world
    those who love you and who wish you well. Do not hurt them or scold them, and
    never part from any of them in anger; after all, you simply do not know: it might
    be your last act before your arrest, and that will be how you are imprinted in
    their memory!


    Here, perhaps, is the final security lesson. Concentrate on what is important.
    Security, like life, is full of trivial details. Do not get caught up in non-essentials
    just because they are immediately in front of you.'
