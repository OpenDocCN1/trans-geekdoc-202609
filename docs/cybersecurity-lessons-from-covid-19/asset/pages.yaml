  md: 'The greater the knowledge of computer security there is in the general population,
    the lower the threat to the company—any company.


    So it is with CoVID-19. We are all in this together. Many have noted that we are
    all in the same storm, but we are not in the same boat. My threat level is not
    the same as my granddaughter’s; she is young, female, and fit and has no underlying
    health conditions. My threat level is also not the same as that of my friend in
    the United States, who has said there is no point in going to the doctor since,
    even if diagnosed, she would not be able to do anything about it since she doesn’t
    have medical insurance. (As a Canadian, I find that appalling but unfortunately
    completely logical.) But we are all in the same storm. We follow directives to
    stay two metres apart, wash our hands, avoid crowds and concerts, and not visit
    old relatives, not only because of our personal danger of getting infected but
    because every individual infection adds to the total risk for our immediate communities
    and society as a whole. We bend the curve (and not the rules) even though the
    same total number of people may die. We do this because the overwhelming collapse
    of the medical system and infrastructure as a whole may not affect me personally
    but is a bad thing overall. Not hoarding N95 masks and other personal protective
    equipment, thus leaving it for those who really need it, keeps nurses and other
    medical personnel safe and thus keeps us all safer.


    # TOILET PAPER (RECIDIVUS)


