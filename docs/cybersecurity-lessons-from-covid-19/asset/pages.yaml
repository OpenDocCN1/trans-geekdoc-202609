- pgno: 29
  md: 'There is misinformation being distributed. There is also deliberate disinformation.
    Sometimes, the untruths arise from simple ignorance. There is a lot of ignorance
    to go around, particularly about a virus we didn’t even know existed last year.
    Over the next few years, a lot of people will be doing a lot of study and research
    to find out more about coronaviruses as a class and about this one in particular.
    If only we knew now what we will know in a few years, we would be in good shape.
    But we don’t know that yet. We are fighting, sometimes literally, for our lives
    (and the lives of those we hold dear) against an enemy we can only dimly perceive,
    and we have very little information about how it lives, attacks, and can in turn
    be attacked.


    We fear the virus because it is dangerous. But we also fear the virus because
    we know so little about it. And that fear, arising out of our ignorance, can have
    a very strange effect on our decision-making. I saw this when I was studying computer
    viruses. In the early days, very few of us had a good understanding of how computer
    viruses worked, and most computer users and managers developed some very strange
    attitudes. Some, not knowing what viruses were or how to protect against them,
    decided (on the basis of no evidence at all) that the risk wasn’t very big and
    viruses could be ignored. Mac users, particularly, developed a myth that Macs
    were immune and therefore they, as Mac users, were safe and need not take any
    precautions. (There were, in the early days, fewer strains of malware for Macs,
    but when they did hit a group of Mac users, the infection rates were much higher
    than in comparable groups of DOS users.) Many managers decided that viruses were
    a risk only if you used pirated software and, if you didn’t, you were safe. (In
    the early days, the most prevalent and successful types of computer virus were
    the class of boot sector infecters, which travelled on floppy disks regardless
    of whether any software was present.)


    We know a little about the SARS-CoV-2 virus. We know it is spread by droplets.
    We know most of those droplets fall to the ground or onto surfaces. We know that
    the highest risk of getting the disease is being in close (less than two metres)
    proximity to an infected person over a period of time. We know that it is unlikely
    you will get the disease from just one virus landing on you; you probably need
    a number of them (roughly a thousand?) getting onto or into your mucus membranes
    before you get infected. We know that the droplets produced by normal breathing
    put out about 20 virus particles per breath and that vociferous argument or heavy
    exercise (or, apparently, singing) puts out about 200.


    Even in that limited subset of knowledge, there are so many things we don’t yet
    know. We do know that some of the droplets are small enough that they hang in
    the air for some time, like aerosols. We don’t know how many of those small, fine
    droplets have viable viruses in them. The tests that are available to us at the
    moment don’t give us a lot of information about whether we are'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'detecting a whole virus or just the parts of it that we are using as signatures.
    We know that masks, even N95 masks, aren’t perfect, and we know that masks are
    better at preventing you (if you are already infected) from spreading the virus
    to those around you than they are at protecting you from getting the virus. We
    know that if you are in a particularly high-risk environment, wearing a mask is
    better than nothing. But we don’t know how much better than nothing, and we don’t
    yet have really good data about which high-risk environments are those that a
    mask might provide protection in. Therefore, we are talking about risk (which
    we will discuss further later on) and, as we in security know all too well, risk
    always involves a level of chance and probability.


    Because of the probabilities involved as well as the huge areas where we simply
    don’t yet have enough information, even an expert is going to have trouble giving
    you a hard-and-fast, yes-or-no answer to any question. If you stay at least two
    metres away from everyone, are you safe? Well, not really. There are still surfaces
    that someone infected might have touched or breathed droplets onto. Or the droplets
    may be smaller or the air currents might be stronger. There is not a magical barrier
    at two metres, but there is a good chance that the distance will keep you safe.
    Or safer. Are you safer at two metres than one and a half? Yes. How much safer?
    Don’t know. Is a two-metre distance a good rule? Yes. Is it perfect? No.


    Vancouver has a rather infamous area known as the Downtown Eastside. In a confined
    area (30 blocks), there is a large population (roughly 15,000) of street people,
    most having underlying health conditions. When the pandemic hit, it was considered
    a kind of foregone conclusion that the virus would sweep the area and cause massive
    damage and a huge death rate.


    Didn’t happen.


    Now a study is under way to try to find out why. It’s possible that simply some
    kind of social isolation between the street population and the rest of society
    has kept them safe. But it may be due to some kind of immune system protection
    that could be further examined and developed. It’ll be interesting to find out.


    Because there are so many areas where our knowledge is limited and imperfect,
    experts may (quite legitimately) disagree on various points. Different ideas and
    the importance of certain ideas may come into contention. So, in regard to masks
    (which have come to be a huge source of contention and which we will return to
    in other parts of this book), one expert may (quite honestly and truthfully) say
    that masks do not provide much absolute protection in terms of keeping you from
    getting infected. (As Tevye would say, you’re right.) Another expert, just as
    honestly, could point out that, in areas of high viral load, a mask (backed up
    by a gown and face shield) is better than nothing. (As Tevye would say, you’re
    right.) Yet another expert might note that, in populations where the rates of
    infection are higher and because of asymptomatic transmission, wearing a mask
    demonstrates that you are concerned (to the point of personal inconvenience) about
    protecting those around you rather than yourself. (As'
