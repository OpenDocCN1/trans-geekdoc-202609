  md: 'the droplets are heavy and therefore fall out of the air fairly quickly. They
    can’t travel very far from the person who produced them. (This is where the ‘six
    feet’, ‘two metres’, and ‘fingertip to fingertip’ rules come from.)


    The size of the droplets, and the inability to hang in the air, is why masks aren’t
    very effective at preventing people from becoming infected with the virus (although
    they do help in some specific and dangerous situations where you are encountering
    a number of people with a high viral load who are coughing up a large number of
    droplets). Masks are somewhat more effective at preventing people who are sick
    from spreading infections since the masks, even just dust masks, catch the droplets.
    If you catch the virus, you probably won’t breathe it in. You will probably touch
    a surface (any surface, even the surface of yourself or another person) where
    a droplet landed and then touch the mucus membranes of your eyes, nose, or mouth,
    which are nice and moist and which SARS-CoV-2 really likes. And the virus remains
    viable. And infects. (Are your eyes getting itchy just thinking about this? When
    was the last time you touched your eyes because they felt itchy? You touch your
    face a lot more than you realize. This is why constant handwashing (with soap)
    or hand-sanitizing is important. The outer envelope of a coronavirus is mostly
    a layer of fat, and if you have studied chemistry, it easy to see why coronaviruses
    really don’t like soap or alcohol.)


    # TESTING


    You may have heard that CoVID-19 can be detected in the air hours after an infected
    person has been there. You may have heard that CoVID-19 can be detected on surfaces
    up to three days after an infected person has been there (depending on the type
    of surface). There is a difference between ‘can be detected’ and ‘is viable’.
    Remember that our current tests for CoVID-19 are checking for strings of the virus’s
    RNA in the same way that computer antivirus programs check for strings of code
    that are unique to the computer virus. The virus or fragments of the virus (even
    if not wet or viable) can hang in the air or be on surfaces and be detected by
    RNA tests long after it has ceased to be viable and infectious.


    There is another type of test involving the antibodies we spoke of earlier. Serology
    tests will not detect the virus directly but will detect whether someone has been
    sufficiently exposed to the virus to develop specific defences, such as antibodies,
    to the virus. This would indicate that a person has had the virus (and then recovered)
    regardless of whether they demonstrated any symptoms.'
