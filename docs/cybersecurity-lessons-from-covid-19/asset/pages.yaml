- pgno: 112
  md: '# PRIVACY


    Quite apart from contact tracing, any number of privacy issues are involved with
    COVID-19. For one thing, it’s a medical issue, and medical information seems to
    be the second (how much you are paid is the first) highest privacy concern people
    have. It’s quite a legitimate concern in many cases: being diagnosed with certain
    diseases can lose you a job or insurance coverage, and in all too many cases,
    you become shunned by the community, often for something that is not your fault
    in any way.


    # EVIDENCE


    One of the rules of evidence is that, in order to present it in court, it must
    be relevant to the case. The importance of this has been illustrated by the different
    types of testing and various pieces of research that have been conducted and published
    while the pandemic has been raging.


    For example, RNA testing has revealed that SARS-CoV-2 has been detected in feces.
    Does this mean that sewage is an infection risk? (Look, work with me here. Sewage
    is always noxious stuff, and you can become infected with a number of nasty diseases
    from it, quite apart from SARS-CoV-2.) Well, we don’t know. We know that the RNA
    tests detect sections of the virus code, but they don’t necessarily indicate that
    the virus, even when detected, is viable. Possibly more study is warranted, but
    at the moment, no other evidence indicates that fecal contamination is a major
    vector of the virus. (The fact that we can detect the virus in sewage may provide
    us with a tool for finding out how prevalent the virus is in a given community,
    but we need more study on that too.)


    In the same way, we have studies indicating that the virus can be detected (via
    RNA tests) in the air for hours after an infected person has left. Does that mean
    that SARS-CoV-2 is an airborne virus and that transmission can take place by these
    particles in the air? Well, again, not necessarily. For the same reasons given
    above, we may be detecting non-viable traces of the virus, so we don’t yet really
    know what danger there is in aerosol transmission. So far, the evidence of actual
    transmission seems to indicate that the risk of infection is low. The fact that
    we can use RNA tests to detect viral fragments in the air is not really relevant
    to our risk of infection.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# RACISM


    I don’t know whether it properly belongs with law or ethics, but it certainly
    belongs in this domain.


    One thing that has horrified me, possibly above all the other repellent issues
    in this awful crisis, is the extreme and rapid rise of overt and blatant racist
    physical attacks and misbehaviour. It has been seen in many ways: verbal harassment
    on the street, physical attacks on transit, racist graffiti, all the way up to
    shunning migrants and the closing of borders where no real need to do so exists.


    It is possibly because I am Canadian that I find it so deeply disturbing. Canada,
    unfortunately, is not immune to racism, but we do have, as a national characteristic,
    tolerance-to-the-point-of-vice. Much more than the United States, we are a cosmopolitan
    and polyglot society. Whereas Americans talk about the ‘melting pot’, where everyone
    comes to the US and becomes American, Canada talks of the cultural mosaic, where
    everyone comes to Canada and contributes something from their point of origin.
    There is a national joke that the definition of a Canadian is a DP with seniority.
    For non-Canadians, I have to explain that DP stands for ‘displaced person’, an
    old term (dating from the two World Wars) for refugee, but also that DP is itself
    a racist term. Thus, the joke is not just about the demographic composition of
    the country (every Canadian is a DP: even the First Nations peoples came here
    from somewhere else, most likely Siberia) but is also a sly dig at racism itself
    (and a slightly more overt self-mockery of Canadians who may think they are above
    or immune to racism). (Canadian jokes do tend to be complex and layered. Sorry.)


    The George Floyd/Black Lives Matter protests may relate to whatever cultural forces
    are behind the racism. As previously noted, racial bias in law enforcement is
    nothing new and is widely known and acknowledged, though mostly without being
    effectively addressed. There have been other deaths and other protests. Colin
    Kaepernick had his own, completely non-violent, protest for many years. It is,
    of course, entirely possible that much of the success of the movement has simply
    been because people were fed up with having to stay at home during the pandemic
    and badly wanted an excuse to go outside and be with people. But it also seems
    that society appears to have been ready, at this point, to take a more serious
    look at the issue. It will not be fixed overnight, but it would be heartening
    if some meaningful change came out of this terrible mess.'
  merge: -1
  img_proc: true
