  md: 'scotia-online-covid19 doesn''t exist.


    But, being as paranoid as I am, I noticed that O (capital letter ''o'') and 0
    (digit zero) look the same in most screen fonts.


    And, voila! scotia-0nline-c0vid19.com (with zeroes in 0nline and c0vid19) does
    exist! It''s registered in Panama. A lot of companies with questionable business
    models are registered in Panama.


    (I''d advise not going anywhere near it.)


    This one was directly targeted at my bank account, but there are huge numbers
    of scams that spring up with every disaster. As noted previously, some pretend
    to be charities, some will target relief programs, and many are just more of the
    same in terms of the regular ongoing run of spam and scams. But a number of the
    frauds do seem to be specific to the pandemic.


    There are the puppy scams. With everyone staying at home, huge numbers of lonely
    people are suddenly wanting a pet. (Making such a major, ongoing, and life-modifying
    decision at a time of crisis and high stress is perhaps not the best of ideas,
    but we covered that in business continuity planning.) So the scammers, noting
    the exploding market, are happy to sell you puppies! By and large, of course,
    puppies that don''t exist. And, of course, you will be paying by credit card.
    Which they''ll steal.


    Which brings us to the shipping phish. You will probably have ordered something
    online during the pandemic since stores were closed and everyone was staying home.
    (Amazon and eBay and everyone who has any kind of online presence have been doing
    land-office business.) So you''re used to receiving notices of items shipping.
    And you might have received a few emails claiming to be from a courier company,
    asking you to pay delivery charges before they can deliver a parcel that is addressed
    to you. That seems possibly reasonable, and the charges are usually very small.


    Now, there are two items to note here. One is that millions of very small charges
    still add up to a lot of cash. The other is that, when you pay that very small
    charge with your credit card, you are providing all the information that the scammers
    need in order to make other, much larger charges on your credit card.


    # COVID-19, ‘SHAMING’, AND CYBERBULLYING


    Watching the news recently, I saw two different government officials, from different
    provinces, and one television commentator recommend that, if you saw any evidence
    of hoarding, you should ‘shame’ the perps on social media.'
