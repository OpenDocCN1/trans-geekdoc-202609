- pgno: 23
  md: 'In researching this issue, I came across a couple of Websites that seemed to
    be trying to do contact tracing. Having assessed that they were somewhat legitimate
    and not just trying to feed malware, I checked them out. One seemed to detect
    that I was in Canada, but (I assume) you can select Canada, Mexico, or the USA.
    The first screen asked if you are feeling well or not. If well, it asks if you''ve
    received a flu shot, how old you are, gender, and partial postal or zip code.
    (When you drop though from that, it asks for your cell phone number to send you
    reminders, but that isn''t mandatory. I assume that the same is true if unwell,
    but I didn''t want to deliberately feed it false data.) If unwell, it asks you
    to specify from 13 symptoms (or ''other'').


    Are the Web-based systems useful? Good? A problem?


    The use of most contact-tracing apps is (at least somewhat) voluntary, and I can''t
    see any form of integrity checking, so I don''t know how susceptible such systems
    would be to attack with false or flood false data. At the moment, I can''t see
    evidence of any privacy issues. (I didn''t give the one I tested my phone number.)


    Of course, there are people who will want to deliberately fill whatever system
    is in place with false data. The type of people who write their names on bathroom
    walls will take a burner phone with a contact-tracing app, deliberately place
    it near the phone of an infected person, and then hide it behind a seat on public
    transit so as to falsely create as many contacts as they can. A sufficient number
    of such actions might create a kind of denial of service of the contact-tracing
    system by flooding it with false data to the point that real data gets lost in
    the fog. Nation-state actors might deliberately mount such an attack simply to
    generate confusion and mistrust in a certain jurisdictions'' medical and medical
    management systems.


    Contact tracing, so far, is being implemented by individual jurisdictions—sometimes
    not even nationwide but on a state or provincial level. Once people start travelling
    again, are any of the various contact-tracing apps or protocols going to talk
    to each other?


    There are also technical issues of background operation, access requirements,
    function requirements, and power consumption which present major problems to be
    solved. Most of the apps seems to rely on broadcasting beacons or nonces via Bluetooth
    to be picked up by other phones in the vicinity. The thing is that broadcasting,
    of whatever type, is one of the most power-consuming functions on a phone and
    therefore drains the battery fairly quickly. Since this affects the overall operation
    of the phone, Bluetooth is often turned off by default, and the user who wants
    to use Bluetooth functions needs to turn it on. In fact, Apple and Google (as
    the major vendors of smartphone operating systems) have fairly strict limitations
    on permitting any applications to turn Bluetooth on. In addition, smartphones,
    unlike computer operating systems, do not deal easily with multitasking or multiple
    applications running at once.'
  merge: -1
  img_proc: true
