  md: '# # Application

    # Security


    ![](img/f10cbbf38a9bd03e417173238b05b3fa_75_0.png)


    Many of you will wonder if, just like cryptography, there are very few aspects
    of applications security where the pandemic and related issues can point out any
    lessons. Well, it turns out that there are a few.


    Malware tends to get lumped in with the application security domain. Since that’s
    where I started my security career, let’s begin there. Along the way, we’ll pass
    a number of other application security factors.


    # ## A COMPUTER VIRUS EXPERT

    ## LOOKS AT COVID-19


    First off, let me say that, while ‘virus’ was and is a reasonably good choice
    as a term for replicating malware, it doesn’t do to push the analogy too far.
    A computer—any computer, even a supercomputer—is a fairly simple entity in comparison
    with the complexity of the human body. And it’s easy to say whether or not a computer
    is infected with a computer virus. It’s pretty quantum. The computer is either
    infected or not. Either a computer virus is running in memory or it’s not.


    When I worked in the isolation ward and in industrial first aid, I learned a lot
    of things that later pointed out just how different biological and computer viruses
    were. And, when you study the various fields of science, which I did, you can
    analyze some of the factors that determine how viruses work.


    In comparison with a computer, any body is more akin to, well, the Internet itself—a
    network of billions of computers (all the cells in your body), any one of which
    may or may not be infected.


    A computer virus is just code. I have several thousand computer viruses in the
    office with me. Hundreds of them are on each of the computers I have.'
