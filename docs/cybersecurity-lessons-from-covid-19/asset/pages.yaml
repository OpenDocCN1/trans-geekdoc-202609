  md: 'people, even less than that. Whatever the false-positive error rate is for
    the contact-tracing app, it is bound to be much more than 1%. So, for any contact-tracing
    app, if it gives you an alert that you might have been in a situation where you
    might have been infected, the alert is much more likely to be a false positive
    than a true risk. Knowing that, are you going to go into quarantine for two weeks
    every time you get an alert? Even if the government mandates quarantine on that
    basis, we are going to be quarantining many, many more people who are not sick
    than those people who are. Lots of workers, who may be important to their companies
    and society, are going to be forced to stay home.


    The same holds true for tests for the virus. At the moment, everybody is eagerly
    looking forward to serology tests for CoVID-19. These are tests (usually blood
    tests) that determine whether you have antibodies related to defence against the
    SARS-CoV-2 virus.


    At least, they try to determine that. Because, well, errors.


    If the test has 99% specificity and you live in an area where only 1% of the population
    is actually infected, then when you get a ‘positive’ test and are reassured that
    you are immune, you actually have only a 50/50 chance that you encountered the
    virus and do have any defence. (In British Columbia [BC], where I live, the infection
    rate is about 0.03%, so the chance that a positive test is of any use at all is
    far worse.)


    And this initial discussion of errors leads nicely into a more general discussion
    of integrity as the next pillar of security.


    There is no point in keeping your information safe from prying eyes, or theft,
    if it is incorrect. There is a reason that the most widely known mantra of the
    computer era is ‘Garbage in, garbage out’.


    So many problems related to computers and systems can be traced to problems with
    information being incorrect. Maybe it was wrong when it was entered. Maybe it
    was incorrectly modified. Maybe it was incomplete. Maybe it was false information
    that someone fed you, hoping you would believe it and act in error.


    The CoVID-19 pandemic has created so many examples of this problem. We are faced
    with a new virus and our information about it is so very paltry. We don’t even
    know much about the class of virus. What is a coronavirus?


    (I thought it was called coronavirus because of the ‘crowns’ of protein spikes
    that stick out of the fat layer. Speaking of information integrity, I was wrong.
    Back when the scientist who discovered the class of coronavirus named it, we couldn’t
    yet see that level of detail. What she saw, at the resolution available on the
    electron microscopes of the time, was that it had the appearance of the corona
    around the sun when the sun was viewed through a high cirrus cloud. Canadian content
    time: the name is because of the electron microscope, a Canadian invention.)'
