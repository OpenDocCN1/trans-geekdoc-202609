- pgno: 109
  md: 'I can understand the frustration. I really can. Hoarding is insidious and is
    terribly destructive to the community as a whole during a crisis. Those who are
    ‘bulk buying’ in order to resell at a huge mark-up are despicable. (I don’t care
    if you think it’s the ‘American Way’. It’s despicable.) Those who are stealing
    hospital supplies should definitely be prosecuted.


    But I don’t think those who recommend public social media shaming understand social
    media. ‘Shaming’ is one post away from cyberbullying. If social media is about
    anything, it’s about disproportionate overreaction. It has no off switch, no censorship
    or moderation, and no ‘right to be forgotten’ or means of redress. We’ve already
    seen instances of mistaken or misunderstood postings going wildly viral during
    this crisis, and we’re going to see more. Don’t add to them.


    This bit possibly should have been up with the section on integrity because many
    of the calls for shaming are, in fact, based on misinformation or even simple
    misunderstandings. As Dr. Bonnie said in response to pretty much every reporter’s
    question about people being in the wrong place or doing the wrong thing, you may
    not know the whole story.


    As an example, at one point during the lockdown, a number of groups (mostly on
    the right of the political spectrum and sometimes slightly to the right of Attila
    the Hun) were holding protests calling on people to ‘liberate’ and ‘reopen’ various
    states. Some had Websites in order to organize the protests. People researching
    the phenomenon found that a number of domains with similar patterns had been registered
    by one person, and they started a campaign to attack that person on social media.


    The problem was that that person had no connection with the protests. He later
    described himself as an aging hippie and, if anything, somewhat left-leaning politically.
    He had, in fact, noticed exactly the same pattern of Websites and domains and
    had registered a large number of those domains so that the protest groups could
    not use them. At considerable cost to himself. Financially, initially, but later
    in terms of the attacks made against him by those who also opposed the protests.
    (No good deed goes unpunished.)


    Then there was the Starbucks barista. Serving a customer, he noted that she wasn’t
    wearing a face mask. Before he could even point out the company policy about face
    masks, she (a) took offence, (b) took his picture, and (c) posted it on Facebook,
    along with his name, expecting everyone to go to the Starbucks and insult him.
    It didn’t quite work out the way she thought. Tons of people expressed support
    for him online, and one started a GoFundMe page for ‘tips’ for him. He got at
    least $80,000 in tips.


    Online shaming is really hard to do just right.'
