  md: 'significantly lower transmission rates of the virus. (You cannot call the observation
    a ‘study’ since the sample size is very small. We are talking about whole countries
    and not just countries but ‘countries with high rates of CoVID-19’, which takes
    you down to a double handful. A ‘double handful’ is not a statistically valid
    sample set.) There are two additional (and easily observable) factors that may
    affect the transmission rate without recourse to the idea that masks prevent infection.
    The first is that masks are demonstrably effective at reducing the probability
    that those who have the virus (and 25% to 50% of those who are infected show few
    or no symptoms and don’t know they are infected) will directly pass the virus
    to others. (Masks, of pretty much any kind, tend to vastly reduce the droplets
    breathed or spit out by those infected, simply by trapping the droplets as they
    come into contact with the fabric or paper of the mask.) The second factor is
    that those countries with low transmission rates also have authoritarian governments,
    which can quickly and effectively mandate that people must stay home and isolate
    themselves.


    Recently, on the Dr. Bonnie Show (co-starring Adrian Dix and Nigel Howard), a
    reporter ‘asked’ a ‘question’ designed to give warning that he would be running
    a story on the dinner-time news hour that N95 masks were available, at various
    locations, and implying that the provincial government was not doing enough to
    find masks for medical personnel through local sources. Without even having to
    draw breath, Dr. Bonnie pointed out that N95 (and I myself have been guilty of
    being careless with this distinction) is not a type of mask but a type of filtering
    material. It is a filter that can trap or eliminate 95% of particles of more than
    5 microns in size. Once you have that filtering material, you can use it in dust
    masks (which you can usually buy at any hardware store), face-fitting masks, medical
    masks (needing water-repellent coverings and possibly other capabilities), and
    various types of respirators (with or without built-in goggles).


    With your own, homemade masks, you might be protecting others, but it’s not highly
    probable. Yes, masks trap droplets, but that matters only if you are infected.
    Even if you live in the United States (as I write this, the world leader in cases
    and deaths), there is only one chance in one hundred that you have or have had
    the virus. And if you know you are infected, wearing a mask does nothing if you
