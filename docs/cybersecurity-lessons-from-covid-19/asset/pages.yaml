  md: 'Masks are not magic. In my opinion, there is as-close-to-zero-as-makes-no-difference
    evidence that masks prevent normal people, in normal situations, from becoming
    infected. ‘Magical thinking’ will not help us in this virus crisis. And it may
    do an awful lot of harm.


    There are reasons to wear masks. Workers in medical situations are likely to encounter,
    without warning, persons with high viral loads. Workers in medical situations,
    likely dealing with all kinds of people with immune systems that are compromised
    for various reasons, should take every precaution against transmission of the
    virus they may not yet be aware they are carrying. If you are forced into a situation
    where you cannot guarantee physical distancing (like public transport of various
    kinds), a mask does not replace the better forms of protection but will give you
    some small amount of additional protection. And, in some situations, social engineering
    comes into play again, and wearing a mask may help calm people you have to deal
    with, even if it provides no actually necessary protection against infection.


    (By the way, if you are forced into close proximity and you don’t have a mask
    available, breathe through your nose. The nose isn’t perfect, but it is a rather
    remarkable filter, designed by millions of years of evolution. It is actually
    a little susceptible to infection by SARS-CoV-2, but it’s less susceptible than
    your mouth, and breathing out through your nose means you produce far less in
    the way of droplets to spread the virus if you have it.)


    Now go wash your hands.


