- pgno: 56
  md: 'As you can see from these examples, you can have different types of assurance
    requirements for a given functional requirement. Also, different controls for
    addressing a given functional requirement may have factors and ease for providing
    assurance requirements. In a restaurant, for example, there is a functional requirement
    for hygiene and sanitation. Commonly, the control for this is handwashing. But,
    in that case, the only assurance requirements available are having signs in the
    washroom reminding staff to wash their hands or doing lab cultures on swabs from
    the hands of the staff (which would cost too much and take too long). Some restaurants,
    particularly fast-food places, now have their staff wear disposable gloves when
    preparing food. In terms of the functional requirement of hygiene, washing hands
    and wearing gloves both fulfil the need. But gloves provide an assurance requirement
    that patrons can actually see for themselves. (Yes, OK, gloves aren’t perfect,
    and if the staff wear them between preparing food and other tasks or wear them
    too long without changing them, then both functional and assurance requirements
    are void.)


    In terms of the pandemic, and particularly in terms of the public perception of
    steps being taken, the functional and assurance requirements are vastly different.
    The functional requirements are extremely visible, immediate, and inconvenient.
    Stay home. Don’t go to work. Don’t go to shops, bars, restaurants, or movie theatres
    or to visit Granma. Stay two metres away from anyone and everyone. Wash your hands.
    All the time. If your hands get chapped, use hand cream. (That’s a kind of layered
    defence, remember? Or possibly a compensating control.) The assurance requirements,
    on the other hand, are invisible, long term, subtle, and inconvenient. You can’t
    see the virus without an electron microscope. You can’t see it passing between
    people, six feet away or not. You can’t see it on your hands or surfaces, and
    you can’t tell whether washing your hands kills it or washes it off. You can’t
    see if you or anyone else is infected. You can see some symptoms, like coughing
    or fever (if you have a temperature ‘gun’), but you can’t see if someone is infected
    and asymptomatic.


    Tests to detect the virus require labs and supplies, time, and training. Contact
    tracing really tells you only whom to test. Infection data really tells you only
    how effective you were at preventing spread of the infection two weeks ago. Death
    rates are definitely an after-the-fact indication.


    # SIMPLE


    We tend to think of security as complicated, a complex interaction of convoluted
    systems. In a lot of ways that is quite true. But some pieces and parts of security
    can be incredibly simple. So simple they almost sound silly.'
