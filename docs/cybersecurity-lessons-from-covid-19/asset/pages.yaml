  md: 'The probabilities can add up. If you pass someone on the street or in a store,
    there is maybe a one in a million chance you will become infected. (Don’t quote
    me on the ‘million’. It’s just for this example.) That isn’t big. (If you own
    a pool, the chance that you will die by drowning is twice that level, but many
    people accept the risk.) We could avoid that risk by not going out, but then there
    is a risk we could starve to death, so we have to calculate and balance those
    risks. But if we encounter ten people at that store, those risks add up, so now
    we are at one in a hundred thousand. And if we go to ten stores, then we go to
    one in ten thousand. And if we keep that up for ten days, then we go to one in
    a thousand, and if we keep it up for three months, we are at 1 %. Which starts
    to sound like it might be a bit dangerous when the impact is that we might die.


    So we have rules. But the rules are based on probabilities. It’s not that at six
    feet you are safe but at five foot six inches you will be infected, but rather
    that it is unlikely that droplets will easily jump six feet. They will more easily
    jump three feet, although it’s still not guaranteed. Rinsing your hands with water
    will get rid of 80% of germs on your hands. Washing with soap and water for 20
    seconds and the proper process will get rid of 99.9% of germs. However, if you
    are pretty sure that you’ve touched something that might be dangerous but you
    can’t, right now, wash thoroughly but you can, right now, rinse your hands, then
    rinsing your hands right now is better than doing nothing. (Although you should
    make sure you wash your hands thoroughly as soon as you can.) All of our ‘six
    feet’. ‘wash hands’. and ‘don’t congregate’ rules are risk mitigation.


    (No, for those students of risk management, there is no risk transfer in this
    scenario.)


    And remember the tests that can’t tell the difference between viable and dead
    viruses and the studies that say the virus can live on surfaces for three days
    (if metal or plastic) or four hours (if copper or cardboard or steel but in direct
    sunlight)? It’s not that all the virus copies stay alive for 72 hours and then
    die on the 73rd. Copies of the virus are dying all the time, and after a certain
    number of hours, half of them are dead, and after that same number of hours, half
    of the remaining ones are dead, and all that time the viral load is going down
    and the probability that there will be enough copies of the virus to actually
    infect you is decreasing.


    So you calculate the risks and assess them the same way you calculate that it
    is unlikely you will be stabbed to death if you go to a party. (Wait. You were
    at a party? During the CoVID-19 crisis? What kind of risk management decision
    is that?)


    So what lessons have I learned, as a virus researcher, that this virus has reminded
    me about?


    As I have mentioned before, I have seen (over and over again) that when people
    don’t understand something, and are afraid of it, they tend to'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'freeze. They tend to build false rationales to justify avoiding the issue or
    not doing anything. The first thing you have to do is raise awareness and educate
    before you can help people to realize they need to follow some guidance in order
    to stay safe. If they don’t freeze, they tend to build the most wildly inaccurate
    mental models of the situation, based on little or no evidence at all, and this
    misinformation needs to be challenged before the reality can be taught.


    I well remember the day when, talking to a long-time friend who was an educated
    and experienced businessman and CEO of a very large enterprise, I mentioned our
    research into virus writers. He was absolutely shocked. ‘People write these things?’
    he said. Yes, of course. How did he think they came about? ‘I thought they just
    sort of … developed’. he said, rather miserably. I did once do a calculation about
    how long it would take for a computer virus to ‘just develop’. I came up with
    an answer that was longer than the lifetime of the universe. I may be wrong because
    a more famous virus researcher did the same thing and came up with a shorter answer.
    But we agree that the answer is more than millions of years.


    In security, if you are successful, people will think you have overreacted. The
    Michelangelo virus in 1992 was the first time that we in the computer virus research
    community were successfully able to warn people and raise awareness of a pending
    virus threat. We got hundreds of thousands of people around the world to check
    their computers, and they found millions of copies of the virus. Before the virus
    was due to trigger (because of the leap year) on March 5. (It had been around
    for over a year before that.) And on March 6, all the news stories were not about
    how well we had done, but about how the warning and ‘panic’ had been a hoax.


    We are all in this together. A computer virus researcher sees security from the
    inside out. Most security people grew up with the bastion mentality: we are on
    the inside and the bad guys are on the outside. We build walls and protections
    and try to protect from attacks from the outside. If a bad guy is attacking you,
    it isn’t my problem. As a matter of fact, it’s a good thing, from my perspective,
    because while he is attacking you, he is too busy to be attacking me.


    A computer virus researcher realizes that this viewpoint is very badly flawed.
    Attacks can come from within as well as without. If someone attacks you with a
    computer virus, then it is a concern for me because, if you get infected, you
    will be sending out copies of the virus as well. An attack on one person raises
    the threat level for the entire community.


    For years, therefore, I have been emphasizing the idea of a kind of public health
    security awareness campaign. I have put it to major corporations that they should
    be promoting and paying for security awareness campaigns, not just for their employees
    but for the general public. As well as the public relations and goodwill value
    for the enterprise, it is to the corporation’s advantage.'
