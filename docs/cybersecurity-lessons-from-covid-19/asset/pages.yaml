    \ in place for real reasons of security and not for other purposes. (In terms\
    \ of ethics, we must use our powers only for good, never for evil.)\n\nThis isn’t\
    \ necessarily simple, in terms of the pandemic. Like most situations (but more\
    \ explicitly than most situations), CoVID-19 points out that we have to balance\
    \ competing legal principles and carefully examine the intent of the original\
    \ constitutional documents. Americans would say that they are promised life, liberty,\
    \ and the pursuit of happiness. Don’t they have the right of liberty to conduct\
    \ their businesses without being restricted by lockdown orders? Don’t they have\
    \ the right to pursue happiness by going to nightclubs? Ah yes, but ‘life’ comes\
    \ first."
