- pgno: 39
  md: 'The trouble is that, at the moment (and in the midst of a crisis), a lot of
    people—some authoritative but with specialized agendas, some not authoritative,
    and some merely visible and persuasive—are saying (on the basis of very limited
    evidence) that masks might be good for you and, besides, what could it hurt?


    Let’s look at the (remarkably few) benefits and the (much greater) risks. There
    are quite a number of reasons that it might hurt a lot.


    The first is, what do you mean by ‘masks’? There are dust masks, which are intended
    to keep you from breathing in relatively large particles like sawdust. There are
    surgical masks, which look almost identical to dust masks but are made differently
    and of different materials and to different standards, intended to keep you from
    breathing (or, more realistically, spitting) out droplets of who-knows-what over
    patients with open wounds. There are slightly form-fitting masks made of specially
    porous materials that provide a larger surface to breathe through and so filter
    smaller particles, droplets, and some aerosols out of the air you are breathing
    in. (These also tend to catch most droplets that you are breathing out, but probably
    not all, and not aerosols, since, when you breathe out, your breath tends to push
    the mask away from your face and allow your breath, aerosols, and some droplets
    to escape above, below, and to the sides of the mask. The same happens with dust
    and surgical masks.) Then there are extended form-fitting respirators, many with
    integrated face or eye shields and with filters to deal with specific particle
    sizes.


    (I should also mention the various masks with valves. These masks have one-way
    valves to reduce the extra effort needed to breathe through masks, even though
    masks have not been demonstrated to actually cause hypoxia or other medical difficulties.
    In regard to the current situation, though, the major benefit is to block the
    droplets that you, or any infected person, are breathing out and that may be spreading
    viruses to other people. The problem is, those one-way valves are open to breathing
    out, so they are not as effective in the way that we want masks to be effective
    in the pandemic we are facing.)


    And then there are homemade masks, fashioned from whatever fabric is to hand,
    to whatever design comes to mind, with little or no regard for porosity, thread
    count, or the ability to trap whatever particles are being breathed in or out.
    Some are cotton, which is cheap and probably relatively effective at stopping
    droplets that you breathe out. Some are artificial fabrics, threads of plastic,
    and probably less effective. Then there is the question of stitching folds or
    layers into the fabric of the mask. (Which is a nice illustration of layered defence:
    if your protection is imperfect, back it up with more, even if also imperfect.)
    I carry around a bandana just in case someone is upset by the fact that I don’t
    wear a mask. When I need it, I fold it in half, diagonally, and tie it around
    the back of my neck, like a bank or train robber in an old-fashioned'
