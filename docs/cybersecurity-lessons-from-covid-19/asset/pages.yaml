  img_proc: true
- pgno: 40
  md: 'western movie. It covers from the bridge of my nose down below my chin and
    can even be tucked into the neck of my shirt for more complete coverage. Otherwise
    it sits in my back pocket.


    I am not advocating for any particular style of homemade mask. Nor am I going
    to fault any specific pattern or design as such. But the major factor involved
    in using a homemade mask is that they aren’t made to any specific pattern. Or
    with any standard of fabric. If a mask covers your mouth and nose, it will somewhat
    impede and possibly trap droplets you breathe out. But, beyond that, there isn’t
    much you can say. How much such a mask reduces the risk of your transmitting the
    virus is open to question. How much such a mask protects you is even more so.
    (The one advantage homemade masks do have is that you can make a lot of them and
    therefore you can carry enough that they are ‘single-use’ and thrown into the
    washing machine after every use.)


    On the nightly news, one news anchor proudly showed off a face mask that his wife
    had crafted. It had a lovely pattern on the fabric and was lined with plastic
    from a bag. Excuse me? Plastic? Non-breathable, non-porous plastic? I’m not sure
    what that is supposed to do. Any breathing is going to take place around the edges
    of the mask. A normal person, under no effort or stress, is probably not going
    to be harmed by it, but anybody with respiratory problems who uses it may be in
    serious difficulty. It may, almost accidentally, trap droplets that are breathed
    out, but otherwise I can’t see any possible benefit at all.


    So, when you just say ‘masks’, it doesn’t give you a lot of information about
    the level of risk and the level to which the masks reduce the risk. The first
    lesson about risk management is that you can’t say much about the risks if your
    situation and many of the variables in it are so very … variable.


    But, I hear you cry, while all of this calls into question the effectiveness of
    masks, it still doesn’t show that masks (other than the plastic-lined ones) are
    harmful. So who’s hurt if I choose to wear a mask?


    Well, first off, we currently have a worldwide shortage of proper masks (and other
    medical equipment). If you are wearing a mask and don’t need it, you may be (and
    likely are) depriving some front-line worker who may actually need it. In fact,
    if you have a proper mask these days, you probably got it on the black market
    and you are, even if only in a small way, supporting criminal activity that extends
    up to massive theft of hospital supplies and the fraudulent production of ‘certified’
    medical equipment that is not up to anybody’s standard. So you are probably hurting
    those doing the most to keep us safe. (And from there on down to legitimate manufacturers
    and the legitimate economy.)


    And, even if you have made your own (probably ineffective) mask, you may be hurting
    yourself. We know that frequent, even obsessive, handwashing is effective. We
    know that physical distancing and self-isolation are effective. We know that avoiding
    touching your face is important. Wearing a mask gives you'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'a feeling of security and safety. An almost certainly false sense of security
    and safety. And if wearing a mask makes you feel more comfortable and you stop,
    or even reduce, constant handwashing or are less careful about physical distancing
    or go out more frequently, you are putting yourself (and likely others) at greater
    risk. And we also know that properly donning and doffing a face mask are non-trivial
    tasks, and most people don’t know how to do these things properly.


    Sometimes, the rules about masks are security theatre. In a number of jurisdictions,
    masks are now mandated when you’re out in public. There still isn’t any evidence
    that this makes a really significant difference in terms of preventing the spread
    of the virus. It does provide some protection, of course, but we don’t really
    know how much. The most effective orders for preventing the spread of the disease
    would be to enforce isolation and distancing and to close bars, nightclubs, and
    casinos. But these types of orders would be politically unpopular. So, instead,
    political leaders can order people to wear masks, knowing that the orders may
    or may not be followed and may or may not protect the population, but at least
    the political leaders can be seen to be doing something (whether or not it works)
    and don’t have the political downside of ordering the things that actually do
    work.


    A further lesson of the mask situation is this: we, as human beings, are really
    terrible at assessing risk. This whole novel coronavirus/SARS-CoV-2/CoVID-19/pandemic
    thing is just too huge and complex for us to take in. There are too many parts
    to it. Medical parts. Public health parts. Social parts. Psychological parts.
    Financial parts. Governmental parts. All of them interacting in complicated ways.
    We have difficulty figuring out what’s important or true and what’s not.


    But masks—masks are simple. We can understand masks. Or at least we think we can.
    So we fixate on them.


    Partly this inability to properly manage risks has to do with our evolution. Our
    attention to threats was formed eons ago, when threats, to be important, had to
    be nearby, moving (usually charging at us), and fairly straightforward. Our world
    has changed since then. (Mostly, we changed it.) We now have to pay attention
    to threats that are physically far away from us, possibly moving very slowly (so
    we have to look far into the future), and often extremely complex. We aren’t built
    for that kind of risk assessment. At least, not automatically. So we have to build
    and use risk analysis frameworks and plans in order to ensure that we do, accurately,
    figure out what is a danger to us. And, as the saying goes, learn from the mistakes
    of others: you’ll never live long enough to make them all yourself. When someone
    sets out some rules, it may be that there is a very good reason for them.


    +   - Wash your hands.

    +   - If you didn’t got a flu shot, get one.'
