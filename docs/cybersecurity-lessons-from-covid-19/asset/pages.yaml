  md: '# Security Architecture


    OK, I suppose the first point to address is, what the heck is architecture? Architecture
    is one level of abstraction above design.


    ‘Oh, thanks’, I hear you cry. ‘That’s really helpful’.


    OK, let me put it to you in more concrete terms. What is architecture? An architect
    is the guy who makes the plans for constructing a building, right?


    Let’s suppose you want a house. What are the parts we want to put together. OK,
    yes, you over on the side, in the pink shirt. Walls? OK, that’s a good thought,
    but this house is going to be built on a little island in the South Pacific. We
    don’t want walls since (a) they are going to trap humidity in and (b) they are
    going to keep the cooling breezes out.


    Right, then, walls are out, but what other parts do we want for this house? OK,
    I know you are all scared now that I’ve turned down your first idea, but you know
    that I can stand here all day, and this book isn’t going to go on until I get
    an answer. OK, yes, you in the back. A roof? Excellent. Basically, any type of
    house we want to build will need a roof of some kind.


    Look at that word. ‘Need’. Architecture is, very roughly, the refinement of requirements.
    What do we need out of the system? What do we want it to do? What do we really,
    ultimately, want to get out of it? Don’t get too hung up on details: those will
    come later in design and implementation.


    # BEND THE CURVE, NOT THE RULES


    I don’t know who came up with that slogan—I first heard it from Health Minister
    Adrian Dix—but it’s a great one. It reminds you that there is a reason for the
    rules. There is a requirement behind the rules. We need the rules. Because we
    need to bend the curve.


