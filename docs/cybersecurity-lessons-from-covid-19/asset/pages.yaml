  md: '# # Access Control


    # ## 3


    # ## DEFENCE IN DEPTH/LAYERED DEFENCE


    One of the foundational principles of access control is the realization that you
    might fail. In fact, that any kind of protection you set up will fail at some
    point. No defence is ever going to withstand every attack mounted against it.


    Therefore, we rely on a fundamental concept referred to as defence in depth (or
    layered defence). The idea is that whatever safeguard you put in place has some
    kind of weakness. You want to set up a compensating control that will, well, compensate
    for that weakness. You want to know what and where your existing weaknesses are
    and choose other countermeasures and controls that will provide support and backstops
    for those holes. Since your compensating controls may (will) themselves have vulnerabilities,
    we build multiple layers of defence.


    So it is with the response to CoVID-19. A first step, when a new disease appears,
    is to try to prevent geographic spread. So we may try to restrict travel. We will
    ask travellers if they have been to an affected area, and we may not admit them
    if they have been. But there are holes in that policy. People may lie about where
    they have been or may have been infected in a different location because of transmissions
    we may not know about. So we do not rely on screening questions only. We do symptom
    checks. We may check temperatures since we know that fever is one of the symptoms
    of CoVID-19.


    But temperature and symptom checks have weaknesses as well since people can be
    asymptomatic or presymptomatic. So relying solely on travel restrictions is foolish.
    We must prepare another layer of defence since we have to assume that the travel
    limitations will not be a perfect protection. We have to prepare our medical system
    to be alert for signs of the disease in our population, and we need diagnostic
    tests to confirm whether people in our area have become infected. But the tests,
    as we know, have error rates and detect only once people'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'have become infected or ill. So we need to build an additional layer of defence
    in terms of preparing our medical system to handle a possible surge in infections.


    Part of the preparation of the medical system is ensuring that there are adequate
    supplies of personal protective equipment for nurses, doctors, and others on the
    front lines of the system, who must inherently deal directly with infected patients.
    Another part is obtaining equipment and drugs that are known to have some benefit
    for patients with severe symptoms, such as drugs and ventilators. Yet another
    is clearing non-emergency patients and procedures out of the system, as far as
    possible, to build margin for a surge of cases should infections get out of control.


    And so it goes.


    Once the virus has become established in our populations (pretty much inevitably),
    we have other safeguards, such as advice or guidance (or, in some cases, directives)
    about the need for physical isolation and limitation of contacts. There is the
    physical isolation, which reduces the possibility of transmission between people.
    But that can’t be complete since we still need to go and buy groceries. So if
    we can’t isolate from others, at least we can stay two metres away from them.
    But we still need to open doors and pick up items we want to buy. So there is
    constant handwashing to kill and remove the virus when we touch those surfaces
    we must when we go out to obtain supplies. But we don’t have options to wash our
    hands all the time we are out, so hand sanitizer is a fallback to handwashing.


    I love public libraries. I was very sad when the libraries closed. So I was delighted
    when our public library managed to institute a ‘takeout’ system. They have created
    a system that has some strange components but is overall quite safe and yet very
    accessible. The first thing has to do with returning materials. It’s going to
    be impossible to effectively disinfect books, so they don’t even try. The ‘drop
    box’ system is still in place, and they don’t touch any of the returned items
    for three days. Simple and effective. It keeps the staff safe and by extension
    the patrons as well.


    In terms of taking materials out, they use the online catalogue and the existing
    ‘holds’ system. You place a hold on an item, and the staff place it on the holds
    shelf under your name. Normally, you’d get a notification and then come in, take
    the item from the shelf, and check out the item. Now, though, when you get the
    notification, you apply for a reserved time to come and pick up your items on
    hold. This reservation system reduces the number of people who will be coming
    to the library at any given time and therefore reduces the possibility of a crowd.
    The afternoon before your reserved pickup time, the library staff check out your
    items, eliminating the need for you to actually come in to the library, and place
    them in a paper bag, which reduces problems with handling and transfer. At the
    appointed time, at the entrance of the library, you hold your identification up
    to a window, so the staff can see it and tell who'
