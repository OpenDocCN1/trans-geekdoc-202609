  md: 'They are of almost no risk to anyone since they are all either on floppy disks
    (those are of no risk to anyone who doesn’t have a floppy disk drive any longer)
    or in ‘zoo’ directories. They aren’t going to execute. They won’t replicate unless
    I copy them somewhere. (No, don’t ask. We old malware researchers are funny that
    way.)


    A biological virus is alive. Actually, get a few microbiologists in a room together
    and making that statement is a good way to start an argument. There are a large
    number of factors that we generally consider necessary for life and that viruses
    don’t have. But we can say that viruses are, at some point, viable and will replicate
    (under the right conditions) and, at another point, are not viable and won’t replicate.


    It’s rather difficult to say that a person (a body) is infected or not. I probably
    have some rhinovirus in me somewhere, but I don’t (at the moment) have a cold
    (that I know of). I probably have some flu virus (viruses?) in me somewhere, but
    I don’t have the flu. There is a progression in most virus infections. A virus
    lands on you or you inhale or ingest one. (Actually, it’s probably more than one
    ‘copy’ of the same virus. Infectious disease people talk about viral ‘load’ in
    reference to the number of viruses that you need to infect, that you have, or
    that you shed while you are infectious.) Your body has defences that are running
    all the time to fight off viruses, bacteria, parasites, and other things that
    shouldn’t be in your body. But if there are enough copies of the virus, they may
    either get past or overwhelm your defences and begin to replicate.


    At that point, you probably can be said to be infected, but you probably don’t
    know it yet. The virus is attacking and spreading in your body but not to the
    point of causing symptoms yet. That is why you can be infected, and infectious,
    before you realize it.


    The virus replicates by inserting its own genetic material into one of your cells
    and forcing the cell to reproduce it (generally destroying your cell in the process).
    (The genetic material of CoVID-19 is RNA rather than DNA, but in highly simplified
    terms, since we use RNA in the process of recreating our own DNA, this is not
    a problem. For CoVID-19. It is kind of a problem for us.) Viruses tend to prefer
    certain types of cells. CoVID-19 prefers lung tissue (among other types). Once
    a virus has started to reproduce on a large scale in your body, the fact that
    you are losing some of your cells, and the fight that your defences are making
    against the virus, produces symptoms. At this point, you are infected, and infectious,
    and probably know something is wrong.


    Your defences have some generic ways to identify and fight off intruders. (These
    are akin to the change detection or activity monitoring types of computer antivirus
    programs.) But, when an infection actually takes hold, your body’s defences learn
    how to recognize and target the specific infection. This process often involves
    antibodies. (This is similar to computer virus signature scanning types of antiviral
    programs.) (We’ll come back to antibodies.) These'
