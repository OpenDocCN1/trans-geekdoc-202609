  md: 'dulled by repetition that it has lost meaning. There is a curve to every epidemic.
    The infection is introduced into a population. It starts with low numbers, very
    likely a single individual. Given that everyone who is infected infects more than
    one other person, the graph of the number of people infected in each time period
    starts off small and slowly but then increases and then increases very rapidly.
    At some point, (a) a vaccine is developed, (b) the population develops immunity,
    or (c) the population starts to die off, so there are fewer people to infect,
    and then the curve slows and eventually reaches a maximum peak. After that it
    drops down and tails off. (Until the next wave. Historically, there has never
    been an epidemic without a second wave.)


    If you can trace and isolate every infected individual, then you can stop the
    epidemic, usually before it becomes an epidemic. This has, fortunately, happened
    with the Ebola outbreaks so far. With most other infections, and specifically
    with CoVID-19, this has not been possible. However, with certain safeguards in
    place, you can ensure that the rise of the curve is not as rapid and that the
    peak is not as high. This does tend to stretch out the curve, so that, in the
    end, similar numbers of people may get infected. Why, then, take those countermeasures
    if the same number of people are going to be infected?


    The point is to reduce that peak. In any community, there is a limit to available
    medical resources. Hospitals do not have enough beds for every person in their
    catchment area. (Likely, there is roughly one hospital bed for every 2000 population.)
    Therefore, if a lot of people get sick all at once, the medical system will be
    overwhelmed. If people who have severe symptoms can’t obtain treatment effectively,
    more of them will die. If the number of people who get infected is spread out
    over time, then there is less probability that the system will be overwhelmed.
    Therefore, fewer people overall will die.


    In fact, ‘bending’ the curve probably does mean that fewer people will get infected.
    That is what happened in Canada. A number of the provinces and territories had
    relatively few infections. But four had a significant number. British Columbia
    (BC) had some of the earliest infections and outbreaks. But it also had the earliest
    health directives closing, for example, bars and casinos, and restricting gatherings
    of more than 50 people. Even though the directives were less draconian than in
    some other provinces, the fact that they were implemented early meant that BC,
    relative to population, had only a third of the infections of Alberta (next door)
    and even lower rates when compared with Ontario and Quebec.


    Even in Quebec, the health directives ensured that the medical system was never
    overrun. And the fact that the curve is flattened means that more time is available
    for other activities, such as research on treatments and a possible vaccine.


    Time is often vitally important in security. Winn Schwartau has written an excellent
    book entitled Time-Based Security (Inter pact Press, 1999). It is based on the
    premise, noted in the previous chapter on access control, that we must assume
    our protections will fail at some point. Schwartau therefore asserts that'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'the design of any protections must delay the successful attack. You can’t guarantee
    that your safeguard will prevent someone from getting in or getting at your data
    or messing with your system, so you need to make the safeguard stall the attacker
    long enough to give you time to detect the attack and respond to it.


    This is the point of bending the curve. Follow the rules, stay home, keep two
    metres away from other people, wash your hands. It won’t (and can’t) guarantee
    that you won’t get infected but it will delay the spread and allow us time to
    do contact tracing, ramp up testing, and prevent the overrun of the medical system—time
    to find treatments that work and develop and test a vaccine.


    # FUNCTIONAL AND ASSURANCE REQUIREMENTS


    When we say that security architecture is about requirements, we should note that
    there are two different types of requirements. The first type, functional requirements,
    is undoubtedly the one we think about most. Functional requirements are what we
    want the system to do, or not do, to protect an asset. For example, if we are
    talking about security management, a functional requirement might be a security
    policy. In access control, it might be a requirement to have passwords to protect
    accounts. (Don’t worry: in a minute, we’ll argue about whether passwords are any
    good.) In physical security, it might be a fence or a wall to prevent unrestricted
    access.


    Assurance requirements are quite different. An assurance requirement is some way
    of determining whether your functional requirement is actually protecting you—if
    it is doing what you actually think it is doing. For example, in regard to our
    security policies in security management, we have auditors who read our policies
    and consider whether they are truly adequate or whether they have gaps that need
    to be addressed. The policy is the functional requirement; the audit is the assurance
    requirement.


    In regard to passwords, we might run password crackers against our systems to
    see if some of the passwords are weak and need to be strengthened. We might also
    have system auditing that checks whether our accounts are being misused or abused
    in some way that indicates they have been compromised. Auditors (more technically
    oriented this time) might point out that passwords are an inherently weak system
    anyway, and we might want to move to multifactor authentication. A wall or fence
    might have an alarm or closed circuit television system that will detect whether
    someone gets over or past it. Some assurance requirements are there to assess
    whether your control is properly functioning; others try to determine whether
    the control is actually doing any good.'
