    \ go to the following link:\n\n[http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\n\
    \nUpon entering this link, find this figure:\n\n![e319d84467.png](images/00006.jpeg)\n\
    \nOnce you’ve installed the JDK, you are able to launch Eclipse accordingly.\n\
    \nThe folder that was extracted from the Eclipse download will contain an eclipse.exe\
    \ that can be launched. Once this has been launched, you will be met with the\
    \ following figure:\n\n![https://lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf\\\
    _NCgjhG604yFXhZCBsy3GfC1y\\_wg6v4gEp4uFNT80](images/00007.jpeg)\n\nAll this prompt\
    \ is asking for is where to set up the output directory for where all the code\
    \ written by you is going to be saved. Once this has been selected accordingly,\
    \ click “OK” to continue.\n\nYou should now be on this screen (or something similar):\n\
    \n![https://lh4.googleusercontent.com/VGvC-jry3vINgfeT3wHIxCNknMZ42pgBwnuoQoVyeW2QyyeIcbrRPvsLebgE8ED5nQvKz4adYyc3smu1QDvifZxfKuu9kxPvBmbA3KOIx8oK5nfz7U5En8o0j\\\
    _ZRrxpagxUV1cE](images/00008.jpeg)\n\nInstructions:\n\n1.  Click File\n\n2.  Click\
    \ New → Java Project\n\n![https://lh3.googleusercontent.com/Uul4AHUr2ZURDElR9Y503X0iTSRDnAT0yK1j5R489G0kjKa8knxzkCrbXTZOkZPVBJ57VzYFAv2MCDPQ98GergtcUD9efhjBn8WoeWPLAZ9c-p1Jofiju6tB-mtiEMfP4v4Ia08](images/00009.jpeg)\n\
    \n3.               Type in a project name in the “Project name:” field\n\n4. \
