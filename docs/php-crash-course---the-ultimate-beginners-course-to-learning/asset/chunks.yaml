    \ time in minutes by 60 (60 minutes in an hour) and the result will be the minutes\
    \ counter of a clock. Notice that when using modulo, you can only get numbers\
    \ from 0 to any number lower than your operator (which can also be a decimal).\n\
    \nOther mathematical operators like exponents, roots, rounding, etc, are not default\
    \ operations and are actually functions which we will discuss later. Be aware,\
