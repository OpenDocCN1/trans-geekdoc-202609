  trans: "\n你需要注意的下一点是，每当你想要插入字符串类型（文本）的信息时，必须将其用引号括起来。例如，如果你想在第一个列（first name）的第二条记录（行）中插入数据，并将其从“Peter”改为“John”——那么你必须使用引号来标出这条新信息。同样，一旦我们实际上开始编写用于此类操作的查询，这对你来说将更有意义。此外，我刚刚解释的是在数据库中更新数据的概念，这正是我们在本指南此章节之后很快要讨论的内容。\n\
    \n接下来，你必须记住的下一个语法规则是，如果你正在更新或插入任何数值类型的数据，则不能加引号。在许多编程语言中（包括 `PHP`），当你声明变量时，如果变量值是数字，你不需要给它的值加引号。这样，程序就可以区分文本（string）和数字（int/double/float）之间的区别。\n\
    \n最后，如果你想设置任何内容或添加任何 `NULL`（简单来说就是让该特定区域的记录为空），那么该关键字不能加引号。如果加了引号，它会被误认为是字符串，因此在特定记录中将字面打印出\
    \ `NULL` 这个单词。\n\n现在要实际向表中插入数据，我们必须使用以下格式的查询：\n\n```sql\nINSERT INTO table_name\
    \ (column1, column2, column3)\nVALUES (value1, value2, value3)\n```\n\n在此之前，我们创建了一个名为\
    \ `Employee_table` 的表，包含五个列：“id”、“firstname”、“lastname”、“email”和“birth_date”。\n\
    \n为了通过 `PHP` 代码实际创建它，你必须执行以下操作：\n\n### 面向对象格式示例：\n\n```php\n<?php\n$server_name\
    \ = \"localhost\";\n$username = \"username\";\n$password = \"password\";\n$dbname\
    \ = \"dbName\";\n\n// 建立连接\n$conn = new mysqli($server_name, $username, $password,\
    \ $dbname);\n\n// 检查连接\nif ($conn->connect_error) {\n    die(\"Connection failed:\
    \ \" . $conn->connect_error);\n}\n$sql = \"INSERT INTO Employee_table (firstname,\
    \ lastname, email)\nVALUES ('Bob', 'Doe', 'bob@example.com')\";\n$conn->close();\n\
    ?>\n```\n\n### 非面向对象格式示例：\n\n```php\n<?php\n$server_name = \"localhost\";\n$username\
    \ = \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// 建立连接\n\
    $conn = mysqli_connect($server_name, $username, $password, $dbname);\n\n// 检查连接\n\
    if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\
    $sql = \"INSERT INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob',\
    \ 'Doe', 'bob@hotmail.com')\";\nmysqli_close($conn);\n?>\n```\n\n关于向 MySQL 插入数据还有很多东西需要学习，但这是一份\
    \ `PHP` 指南，而不是 `MySQL` 指南。让我们回顾理解 MySQL 的最后两个基础步骤。让我们学习如何从表中检索数据或从从表中 `SELECT`\
    \ 数据。以下是查询格式：\n\n```sql\nSELECT column_name(s) FROM table_name\n```\n\n或者，我们可以使用\
    \ `*` 字符来选择表中所有的列：\n\n```sql\nSELECT * FROM table_name\n```\n\n### 面向对象格式示例：\n\
    \n```php\n<?php\n$server_name = \"localhost\";\n$username = \"username\";\n$password\
    \ = \"password\";\n$dbname = \"dbName\";\n\n// 建立连接\n$conn = new mysqli($server_name,\
    \ $username, $password, $dbname);\n\n// 检查连接\nif ($conn->connect_error) {\n  \
    \  die(\"Connection failed: \" . $conn->connect_error);\n}\n$sql = \"SELECT column_name(s)\
    \ FROM table_name\";\n$result = $conn->query($sql);\nif ($result->num_rows > 0)\
    \ {\n    while($row = $result->fetch_assoc()) {\n        echo \"id: \" . $row[\"\
    column_name(s)\"].\"<br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n$conn->close();\n\
    ?>\n```\n"
- fmt: "\nWe have now learned about PHP and MySQL and the underlying power they possess\
    \ when working together. Now let’s work on applying our knowledge to real-world\
    \ projects. Let’s work on creating a login system and see how it may work. Let’s\
    \ start with a simple HTML form to work with. An HTML form is going to allow us\
    \ to send a query to PHP with information to work with. There are two methods\
    \ when configuring a property of the form. This property is called an HTTP Request\
    \ Method.\n\n## HTTP Request Methods\n\nThere are two types of HTTP Request methods:\
    \ `GET` and `POST`. When sending information from PHP, one can either request\
    \ data or submit data. `POST` submits data to be processed, whereas `GET` requests\
    \ data. When pressing the submit button on a form, the information gets passed\
    \ to the URL, and the `GET` method takes the information from the URL and processes\
    \ it however it was coded to be processed in the code. `POST` on the other hand\
    \ does not use the URL to process data, but rather directly submits data for PHP\
    \ to process the code. When submitting a form with `GET`, it will display information\
    \ on the URL, with each key and value of the form separated by an `&` symbol and\
    \ the start symbol would be `?`.\n\n## Creating the HTML Form\n\nNow let’s get\
    \ into the creation of the HTML form. The first thing we must know is the form\
    \ tag, this can simply be written as `<form>` and ending with `</form>`.\n\n```html\n\
    <form>\n\n</form>\n```\n\nOnce this has been complete, we must define the `action`\
    \ attribute of the form. This action attribute is in charge of telling the form\
    \ where to redirect the page to, which will receive the information submitted\
    \ in the form with the specified method (`GET` / `POST`). So essentially, most\
    \ of the time, the `action` attribute’s value is a php file. In this case, we’re\
    \ going to be using the file name itself: `login.php`. This form is also being\
    \ created in this file, so it will essentially redirect itself back to itself\
    \ in order to send the information to the PHP code in the file. Therefore, we\
    \ are going to set the action attribute’s value to “login.php”.\n\n```html\n<form\
    \ action = “login.php”>\n\n</form>\n```\n\nNext, we must define the type of method\
    \ we’re using. Since we want to do the more conventional way of submitting the\
    \ information, we are going to use the `POST` method. Both methods can accomplish\
    \ the same task but the `GET` method has a few security issues. Since the information\
    \ shows up in the URL, many people would be able to see the password submitted\
    \ in the form. Due to this, we are going to using the `POST` method which is more\
    \ discrete. In order to do this, we must use the `method` form attribute and set\
    \ the value accordingly to `POST`.\n\n```html\n<form action = “login.php” method\
    \ = “POST”>\n\n</form>\n```\n\nNow that we have created the skeleton of our form,\
    \ let’s fill it with text boxes to allow the user to input information in it.\
    \ In order to create a textbox, we must use the `input` tag.\n\n```html\n<input>\n\
    ```\n\nNow there are a few attributes we are going to need to add to this input\
    \ tag. We are going to need to look over the `type`, `name`, `id` and `value`\
    \ attributes. The `type` attribute is essentially a way to tell the textbox what\
    \ type of input it will be receiving and how it will interpret it. The `type`\
    \ can be set to “text” to indicate that it will be receiving and displaying test.\
    \ This can also be set to “password” which would then process the text and display\
    \ it as asterisks (stars). Next, we are going to the `name` attribute. The `name`\
    \ attribute is simply like the `id` tag in which it identifies itself to the PHP\
