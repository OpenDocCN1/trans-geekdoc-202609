  trans: '


    我们现在学习了 PHP 和 MySQL 以及它们协作工作时所拥有的底层力量。现在，让我们把所学的知识应用到现实项目中。让我们创建一个登录系统，看看它是如何运行的。我们先从一个简单的
    HTML 表单开始。HTML 表单允许我们向 PHP 发送带有待处理信息的查询。在配置表单属性时有两种方法，该属性被称为 HTTP 请求方法。


    ## HTTP 请求方法


    HTTP 请求方法有两种类型：`GET` 和 `POST`。从 PHP 发送信息时，可以请求数据或提交数据。`POST` 提交待处理的数据，而 `GET`
    则是请求数据。当点击表单上的提交按钮时，信息会被传递到 URL，`GET` 方法从 URL 获取信息，并按照代码中编写的方式对其进行处理。另一方面，`POST`
    不使用 URL 处理数据，而是直接提交数据供 PHP 处理代码。当使用 `GET` 提交表单时，信息将显示在 URL 上，表单的每个键和值之间用 `&` 符号隔开，起始符号为
    `?`。


    ## 创建 HTML 表单


    现在让我们开始创建 HTML 表单。我们必须知道的第一点是表单标签，它可以简单地写为 `<form>` 并以 `</form>` 。


    ```html

    <form>


    </form>

    ```


    一旦完成，我们必须定义表单的 `action` 属性。该 `action` 属性负责告诉表单将页面重定向到哪里，那里将通过指定的方法（`GET` / `POST`）接收表单提交的信息。因此，大多数
    `action` 属性的值是一个 php 文件。在这种情况下，我们将使用文件名本身：`login.php`。此表单也在文件中创建，因此它本质上会将自己重定向回自身，以便信息发送到文件中的
    PHP 代码。因此，我们将 `action` 属性的值设置为“login.php”。


    ```html

    <form action = “login.php”>


    </form>

    ```


    接下来，我们必须定义正在使用的方法类型。由于我们想采用更常规的方式提交信息，我们将使用 `POST` 方法。这两种方法都可以完成相同的任务，但 `GET`
    方法存在一些安全问题。由于信息显示在 URL 中，许多人将看到表单中提交的密码。因此，我们将使用更隐蔽的 `POST` 方法。为了实现这一点，我们必须使用
    `method` 表单属性并将值相应设置为 `POST`。


    ```html

    <form action = “login.php” method = “POST”>


    </form>

    ```


    现在我们已经创建了表单的骨架，让我们用文本框填充它，允许用户在其中输入信息。为了创建一个文本框，我们必须使用 `input` 标签。


    ```html

    <input>

    ```


    现在有几个我们需要添加到此 `input` 标签的属性。我们需要查看 `type`、`name`、`id` 和 `value` 属性。`type` 属性本质上是告诉文本框它将接收什么类型的输入以及如何解释它。`type`
    可以设置为“text”，表示它将接收并显示文本。它也可以设置为“password”，这样它就会处理文本并将其显示为星号。接下来我们看 `name` 属性。`name`
    属性类似于 `id` 标签，它在提交表单通信其值时向 PHP 代码标识其身份。`id` 属性也是如此。`id` 属性用于标识身份。`value` 属性则用于设置默认值。最后，我们还需要添加密码框。


    ```html

    <input type = “text” name = “username” id = “username">

    <input type = “password” name = “password” id = “password">

    <form action = “login.php” method = “POST”>

    </form>


    ## PHP 处理


    现在我们已经通过通过 PHP 完成了 HTML 表单，让我们开始编写 PHP 代码。（此处为翻译后续的逻辑说明）


