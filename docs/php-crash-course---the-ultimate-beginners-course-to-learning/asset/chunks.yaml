    局部变量仅在方法、块或构造函数内部声明。它们仅在方法、块或构造函数创建时被创建，并在方法结束时立即被销毁。你只能在调用局部变量的方法、块或构造函数内部访问它们，在调用处之外的地方是不可见的。局部变量没有默认值。


    # 数据类型


    如上所述，变量用于存储数据。PHP 拥有多种内置变量数据类型，用于存储预定义类型的数据。这些数据类型被称为原始数据类型。这些数据类型是编程语言中最基础的数据类型。你也可以创建自己的数据类型，我们稍后会介绍。PHP
    共有 8 种原始数据类型。


    ### byte

    byte 数据类型是一个 8 位符号位补码整数。它在声明时的默认值为 0，最大值为 127，最小值为 -128。当你想要节省内存空间时（特别是在大型数组中），byte
    很有用。


    示例：

    ```php

    $b = 1; // 值为 1

    ```


    ### short

    short 数据类型是一个 16 位符号位补码整数。它的最大范围是 32,767，最小值为 -32,768。short 用于节省内存或使你的代码更清晰。


    示例：

    ```php

    $s = 100; // 值为 100

    ```


    ### int

    int 数据类型是一个 32 位符号位补码整数。它的最大值为 2,147,483,647 (2³¹ - 1)，最小值为 - 2,147,483,648 (-2³¹)。除非考虑内存问题，int
    是整数最常用的数据类型。


    示例：

    ```php

    $i = 10000000000; // 值为 10000000000

    ```


    ### long

    long 数据类型是一个 64 位符号位补码整数。它的最大值为 9,223,372,036,854,775,807 (2⁶³ - 1)，最小值为 -9,223,372,036,854,775,808
    (-2⁶³)。当需要处理比 int 更大的数字时，使用这种数据类型。


    示例：

    ```php

    $n = 1; // 值为 1

    ```


    ### float

    浮点数据类型是双精度 64 位 IEEE 754 浮点数。其最小和极大范围太大，在此讨论。在需要精度（如货币）时，永远不要使用 float。


    示例：

    ```php

    $f = 120.5; // 值为一百二十点五

    ```


    ### double

    double 双点类型是双精度 64 位 IEEE 754 浮点数。它通常是小数的首选数据类型。其最小和极大范围无法在此讨论。在需要精度（如货币）时，永远不要使用
    float。


    示例：

    ```php

    $d = 120.5; // 值为一百二十点五

    ```


    ### bool

    bool 数据类型表示 1 位数据。它可以包含两个值：true 或 false。它用于简单的标志位，以跟踪真或假条件。


    示例：

    ```php

    $b = true; // 值为 true

    ```


    ### char

    char 数据类型是单个 16 位字符。它的最小值为 `0000` (0)，最大值为 `ffff` (65,535)。


    示例：

    ```php

    $c = ''w''; // 返回 ''w''

    ```


    ### String

    另一种常用的数据类型是 String。String 不是原始数据类型，但它是存储文本的类型。


    示例：

    ```php

    $cat = "meow"; // 将 cat 设置为 "meow"

    ```


    # 声明变量


    变量声明包含两个部分：变量名和存储的值。注意命名变量有一特定的约定和规则。变量名可以是任意字母和数字，但必须以字母、美元符号 `$` 或下划线 `_` 开头，否则将导致错误。常见的命名约定是以小写开头，后续单词大写。例如，如果变量名为
    `theName`，第一个单词 `the` 是小写，后续单词 `Name` 以大写开头。


    示例：

    ```php

    $theName = 123; // 值为 123

    ```

    在上面的示例中，数据类型是 `int`，变量名为 `theName`，其中存储的值是 `123`。你也可以声明变量但不向其存储值。


    示例：

    ```php

    $name; // 无值

    ```

    你可以在稍后对其进行赋值。


    # 使用变量


    变量声明后，你可以读取它的值或更改它。在变量初始声明后，你只需通过名称引用它；只有在声明变量时才需要指定其数据类型。


    示例：

    ```php

    $name = 2; // 将 int "name" 设置为 2

    ```


    变量也可以相加：


    示例：

    ```php

    $a; // 无值

    $b = 1; // 值为 1

    $c = 2; // 值为 2

    $a = $b + $c; // 将 a 设置为 b 的值

    ```

    在上面的示例中，我们将 `a` 的值设置为 `b` 和 `c` 的之和。加号被称为运算符，我们将在下一节中介绍。


    在某种程度上，也可以组合不同数据类型的变量值。


    示例：

    ```php

    $test = "0"; // 将 test 设置为 "0"

    $test += 2; // test 现在是整数

    $test = 3.3; // test 现在是浮点数

    $test = "5"; // test 现在是字符串

    ```

