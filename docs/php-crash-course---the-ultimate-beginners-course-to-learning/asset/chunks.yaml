    Local variables are only declared within methods, blocks or constructors. They
    are only created when the method, block or constructor is created, and then destroyed
    as soon as the method ends. You can only access local variables within the method,
    block, or constructor it is called, and are not visible outside of where it is
    called. Local variables do not have a default value.


    # Data Types


    As said above, variables are used to store data. PHP has multiple built in variable
    data types that are used to store predefined types of data. These data type are
    called primitive data types. These data types are the most basic data types that
    are in the programming language. You can also create your own data types, which
    we will go over later. PHP has 8 primitive data types.


    ### byte

    The byte data type is a 8-bit signed two’s complement integer. It has a default
    value of zero when it is declared, a maximum value of 127 and a minimum value
    of -128. A byte is useful to use when you want to save memory space, especially
    in large arrays.


    Example:

    ```php

    $b = 1; // has a value of one

    ```


    ### short

    The short data type is a 16-bit signed two’s complement integer. Its maximum range
    is 32,767 and its minimum value is -32,768. A short is used to save memory, or
    to clarify your code.


    Example:

    ```php

    $s = 100; // has a value of one

    ```


    ### int

    The int data type is a 32-bit signed two’s complement integer. Its maximum value
    is 2,147,483,647 (231 -1), and its minimum value is - 2,147,483,648 (-231). Int
    is the most common used data type for integral numbers, unless memory is a concern.


    Example:

    ```php

    $i = 10000000000; // has a value of one

    ```


    ### long

    The long data type is a 64-bit signed two’s complement integer. Its maximum value
    is 9,223,372,036,854,775,807 (2^63 -1), and its minimum value is -9,223,372,036,854,775,808
    (-2^63). This data type is used when a larger number is required to work with
    than would be possible with an int.


    Example:

    ```php

    $n = 1; // has a value of one

    ```


    ### float

    The floating point data type is double-precision 64-bit IEEE 754 floating point.
    The min and max range is too large to discuss. A float is never to be used when
    precision is necessary, such as currency.


    Example:

    ```php

    $f = 120.5; // value of one thousand hundred, and a half

    ```


    ### double

    The double point type is a double-precision 64-bit IEEE 754 floating point. It
    is often the data type of choice for decimal numbers. The min and max range is
    too large to discuss. A float is never to be used when precision is necessary,
    such as currency.


    Example:

    ```php

    $d = 120.5; // value of one thousand hundred, and a half

    ```


    ### bool

    A bool data type represents one bit of data. It can contain two values: true or
    false. It is used for simple flags to track true or false conditions.


    Example:

    ```php

    $b = true; // has a value of true

    ```


    ### char

    The char data type is a single 16-bit character. Its minimum value is `0000` (0)
    and its maximum value is `ffff` (65,535).


    Example:

    ```php

    $c = ''w''; // returns the letter "w"

    ```


    ### String

    Another commonly used data type is String. String is not a primitive data type,
    but is a very used data type which stores strings of text.


    Example:

    ```php

    $cat = "meow"; // sets value of cat to "meow"

    ```

    This example gets a string named `cat`, and sets it to the string that spell out
    "meow".


    # Declaring a Variable


    The declaration of a variable has two parts to it: the variable name and the stored
    value. Note that there is a specific convention and set of rules to be used when
    naming variables. A variable name can be any length of letters and numbers, but
    it must start with a letter, the dollar sign `$` or an underscore `_`, or else
    it would return a syntax error. It is also common naming convention to start the
    name with a lowercase letter, followed with each following word starting with
    a capital letter. For example, if the variable name was `theName`, the first word
    `the` starts with a lower case, and each following word, in this case `Name`,
    starts with a capital letter.


    Example:

    ```php

    $theName = 123; // value of 123

    ```

    In the example above, the data type is `int`, the name of the variable is `theName`,
    and the value stored inside that is `123`. You can also declare a variable without
    storing a value in it.


    Example:

    ```php

    $name; // no value

    ```

    You can do this if you choose to later declare it.


    # Using a Variable


    After a variable is declared, you can then read its value, or change it. After
    the variable was initially declared, you can reference it only by its name; you
    only need to declare its data type when you are declaring the variable.


    Example:

    ```php

    $name = 2; // sets the int "name" to a value of 2

    ```


    Variables can also be added together:


    Example:

    ```php

    $a; // no value

    $b = 1; // value of one

    $c = 2; // value of two

    $a = $b + $c; // sets a to the value of b.c

    ```

    In the example above, we set the value of `a`, to equal the value of `b` and `c`
    added together. The addition sign is known as an operator, which we will go over
    in the following section.


    It is also possible to combine values of variables that are different data types
    to a certain extent.


    Example:

    ```php

    $test = "0"; // sets value of test to "0"

    $test += 2; // test is now integer

    $test = 3.3; // test is now float

    $test = "5"; // test is now string

    ```

