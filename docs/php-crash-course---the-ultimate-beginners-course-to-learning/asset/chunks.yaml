    </table>\n\n# 编程中的调试与优化\n\n有时在编程时，你的代码可能会产生错误的输出。这被称为逻辑错误。浏览器不会告诉你任何问题，因为从技术上讲你的代码遵循了规则，就像编写任何语言的语法一样，但你的段落并不符合逻辑。最常见的调试方法就是使用\
    \ `console.log` 并打印变量以找出问题所在。\n\n另一个可以被认为是调试的问题是优化。当你写完代码后，可能会想直接留下它继续处理其他任务，但这可能并不是你想要的。也就是说，如果程序最终得到了结果，但花费了很长时间，那么它并不好。尽管如此，没有单一的策略可以优化代码。有时你的逻辑只是实现某种功能的方法，有时取决于你的实现方式。注意未使用的变量，因为它们会占用处理时间和内存。这是由于一种被称为垃圾回收的系统。它遍历代码中的所有变量并删除不再有效的变量。例如，如果你创建了一个\
    \ `for Loop`，循环结束后变量就不有效了，应该将其删除以节省内存。这会占用少量的处理时间。\n\n这是一个优化示例。假设你想计算两个点之间的距离。`Math`\
    \ 类告诉我们使用勾股定理。但这相当慢。首先计算机必须对两边进行平方（这在性能上是非常昂贵的），然后相加，最后开根。这计算出了两点之间的准确距离。然而，另一种解决方案可以使用曼哈顿距离。这不会给你准确的距离，但在精确数值不重要而速度更重要的情况下，它是很有用的。要计算曼哈顿距离，只需对\
    \ x 和 y 分量取绝对值（绝对值意味着将数值变为正数，所以 -7 变成 7，8 保持不变）然后相加。这会给出一个不准确的距离，但它比对应的准确方法快得多。\n\
    \n# 结语\n\n这是你作为 PHP 程序员之旅的开始。通过本指南，你仅仅触及皮角，因为学习语言的语法和约定只是开始。编程最重要的部分是逻辑方面。当然，你可能知道如何遍历像购物列表之类的变量数组，但如果有人要求你用编程知识处理图像，通过\
    \ API 的帮助和一些思考，你可以发现自己如何反转图像颜色、翻转、旋转、缩放等。\n\n"
