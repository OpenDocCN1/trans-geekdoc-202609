  trans: "\n\n随着时间的推移，代码又经历了一次彻底的改新，1996 年 4 月，Rasmus 引入了 `PHP/FI`。这一版本的 `PHP` 将其演变成了一个广泛的工具集，并成为了一种独立的编程语言。它包含了对\
    \ `DBM`、`MySQL` 和 `Postgres95` 数据库、cookie、用户自定义函数支持等功能。\n\n尽管 `PHP` 的开发时间很短，但它在年轻的\
    \ Web 开发领域迅速流行起来。1998 年的调查显示，有近 60,000 个域名在他们的主机服务器上安装并正在使用 `PHP`。在当时，这个数字占了互联网上所有域名的\
    \ 1%。\n\n这种编程语言 `PHP` 主要由个人个人开发，他为 Web 开发社区带来了一种简单而强大的编程语言——这种语言可以完成许多伟大的工作，我们将在本指南中详细介绍这些内容。\n\
    \n## 什么是 PHP？\n\n`PHP` 是一种服务端编程语言，可用于让静态网页更具动态性，因为它可以在服务器后端执行逻辑操作，并相应地在页面上返回/输出结果。`PHP`\
    \ 的一个缺点是，页面必须重新加载才能让服务器接收并进行相应的处理。有很多方法可以避免这一点，在不重新加载页面的情况下使其动态化。可以通过 `PHP` 和\
    \ `AJAX` 的混合实现，我们将在指南稍后部分讨论。\n\n现在让我们来看看为什么 `PHP` 是一种非常棒的编程语言。它是一种快速且易于使用的服务端脚本语言，专为\
    \ Web 开发以及许多其他用途设计。它还拥有出色的社区支持，有助于解决开发者在使用 `PHP` 时经常遇到的许多问题。\n\n由于它拥有大量的优秀社区支持，有很多免费的第三方程序可以帮助并简化\
    \ `PHP` 编程。考虑到 `PHP` 拥有社区支持，人们也会考虑到 `PHP` 强大的内置函数列表，这让开发者减少了担心自定义函数编码的时间，可以更多地关注他们需要完成的任务。\n\
    \n我们讨论了很多 `PHP` 是一个服务端脚本语言，但我们还没有真正讨论过这意味着什么。脚本语言有两种类型：服务端和客户端。客户端语言的示例是 `Javascript`，而服务端语言的示例是\
    \ `PHP`。\n\n它们之间的区别在于，客户端语言（如 `Javascript`）只需要浏览器来编译和解释其语言，而 `PHP` 则依赖服务器来编译和解释其语言，并将信息发送到浏览器进行解释。`PHP`\
    \ 的许多用途之一是处理数据库，通常使用 `MySQL` 数据库，它对此有极好的内置支持。\n\n# 第 2 章\n\n## 设置 MySQL 和 PHP\n\
    \n你想做的第一件事是下载 `XAMPP`，它允许你运行 `PHP` 代码并操作 `MySQL` 数据库。成功安装 `XAMPP` 后——进入安装目录并执行\
    \ `xampp.control.exe`。然后，点击 `Apache` 和 `MySQL` 启动按钮。\n\n点击 `MySQL` 行的启动按钮。\n\n\
    ![enter image description here](img/00001.jpeg)\n\n当 `MySQL` 成功启动后，还有几件事你必须完成。管理和管理\
    \ `MySQL` 服务器及其数据库实际上有两种不同的方法。\n\n启动 `apache` 服务，打开浏览器并输入 `localhost` 或 `127.0.0.1`。完成后，会出现\
    \ `XAMPP` 状态页面。导航到安全设置并更改你的 `MySQL` root 密码。然后你就可以访问 `localhost` 下的 `PHPMyAdmin`，或者下载一个\
    \ Windows `MySQL` 客户端。例如 `Navicat` 或 `MySQL Workbench`。安装完成后，你就可以用设置的密码登录你的 `MySQL`\
    \ 服务器。因此，你可以使用第三方程序访问数据库，也可以使用 `XAMPP` 内置的 `PhpMyAdmin`。\n\n![enter image description\
    \ here](img/00002.jpeg)\n\n对于 `PHP` 文件，你必须进入安装 `XAMPP` 的目录并找到名为 `htdocs` 的文件夹。该文件夹将包含当你访问\
    \ `localhost/filename.html` 时出现的所有文件。所以，如果你在 `htdocs` 文件夹中有一个 `index.html` 文件，你可以相应地引用它。在这里，你可以创建一个包含\
    \ `PHP` 代码和 `HTML` 代码的 `.php` 文件并放入文件夹。然后你就可以调用它。\n\n# 第 3 章\n\n## HTML 和 CSS\
    \ 基础\n\n### HTML\n\n为了理解 `HTML` 如何工作，我们必须查看基础。`HTML` 代表超文本标记语言。它用于创建网页。\n\n`HTML`\
    \ 中有很多你可以查询的标签。让我们来看各种示例并识别一些有用的标签。\n\n```html\n<html>\n<head>\n<title></title></head>\n\
    <body>\n</body>\n</html>\n```\n\n```html\n<html>\n<head>\n    <title>Example of\
    \ <p> tag</title>\n</head>\n<body>\n    <p>This is a paragraph.</p>\n</body>\n\
    </html>\n```\n\n"
- fmt: "\n# Example of “<p>” tag\n\n```html\n<html>\n  <head>\n    <title> Example\
    \ of “<p>” tag </title>\n  </head>\n  <body>\n    <h1> This is a heading.</h1>\n\
    \  </body>\n</html>\n```\n\nThis `<h1>` tag used in the above example simply bolds\
    \ the text in between it and enlarges it. All properties of tags that you will\
    \ be using are editable through CSS which we will be going through soon.\n\nHere\
    \ is an example using both tags that we have learned and showing the output. Note\
    \ that once you have created a file with HTML in it, you must save the file with\
    \ a `.html` extension. You can then open the file and test it out by opening with\
    \ a browser of your choice.\n\n```html\n<html>\n  <head>\n    <title> Example\
    \ of “<p>” tag </title>\n  </head>\n  <body>\n    <h1> This is a heading.</h1>\n\
    \  </body>\n</html>\n```\n\nOutput:\n\n![https://lh4.googleusercontent.com/VNQxDcrXmEWh9xtMPONP15Kin9EwzHCIOuLVJnwN5qPMwfwl3srEFNUzO8WgBBmOsD7ejN1WUfBG6UPE763FLlZghEOFEG58K-eepDLp1VE-T6tbZZRaV631EeavzkJiIrbJCn4](images/00003.jpeg)\n\
    \nFinally, let’s go over the idea of commenting in HTML. Sometimes you might want\
    \ to code something but not exactly print it to the screen, but just want to explain\
    \ a statement that you are doing or adding a reminder in the code without having\
    \ it translate visually on the web browser so that it won’t be able to see it.\n\
    \nYou can comment by starting your comment with `<!--` and ending it with `-->`.\
    \ Therefore, if I wanted to comment a certain line, I would do the following with\
    \ a functioning paragraph:\n\n```html\n<p> This is paragraph text </p>\n<!-- This\
    \ line prints out a paragraph that says “This is a paragraph text” -->\n```\n\n\
    There are tags, and then there are attributes, which contain values which are\
    \ then used to determine how the tag’s contents are displayed or are interpreted\
    \ by CSS or PHP. Two important attributes to note when going into PHP and CSS\
    \ are: `id` and `class`. You can use these on any appropriate tag like the `<p>`\
    \ tag within the `<body>` tag.\n\nThe format of how an attribute works is like\
    \ the following:\n\n```html\n<p id = \"content\"> This is the content of the webpage.\
    \ </p>\n```\n\nAs shown in the example, in order to declare an attribute, you\
    \ must make space within the first tag which is `<p>` and then name the known\
    \ attribute, so `id` for example. Then to give it a value, you must have an equal\
    \ sign and then quotation marks and the value within the quotation marks. In this\
    \ case, this paragraph contains the attribute `id=\"content\"` - this can be used\
    \ as a reference for languages like CSS and PHP through the use of selectors you\
    \ will be learning about.\n\nThere are still many tags that you can learn in HTML\
    \ but these are the basic tags you need to start writing. Also, you should understand\
    \ the basic structure of an HTML document. Let’s review:\n\n- `<html>` and `</html>`\
    \ defines the HTML document, and the tag itself defines the content within it\
    \ so the browser is able to interpret it.\n- `<head>` and `</head>` provide information\
    \ about the document and initialize any external scripts or sheets.\n- `<title>`\
    \ and `</title>` simply give to the browser to display a title of the HTML document.\n\
    - `<body>` and `</body>` holds all the content of the document which includes\
    \ paragraphs, navigation bars, images, etc.\n- `<h1>` and `</h1>` formats text\
    \ in between as a header or a title.\n- `<p>` and `</p>` formats text in between\
    \ as a paragraph.\n\n## CSS\n\nCSS stands for “Cascading Style Sheets” and essentially\
    \ styles how HTML elements are displayed on the web browser. Now, before we move\
    \ on, let’s quickly over how commenting works in CSS. Just like in HTML, commenting\
    \ is useful and can also be done in CSS, but it has different syntax. In order\
    \ to comment in CSS, you use the following notation: `/* This is a comment */`.\n\
    \nThe text between the slash symbol is not processed and is simply there for human\
    \ reading. To begin a comment you must do `/*` and to end a comment you must do\
    \ `*/`. Let’s scan through the idea of how to write CSS code.\n\nExample:\n\n\
    ```css\np {\n  color: red;\n  font-size: 14px;\n}\n```\n\nIn the above example,\
    \ there are a few critical things to note of the format in the above CSS. The\
    \ element we must specify when writing CSS is the tag name or selector.\n\n```css\n\
    p {\n  color: red;\n  font-size: 14px;\n}\n```\n\nThe text indicates the selector,\
    \ which is the `<p>` tag, which handles the paragraphs of the document. If you\
    \ place any text between `<p>` in the body, you will now see the text being red\
    \ and the font size being 14 pixels. Let’s move on to analyzing this further.\n\
    \n```css\np {\n  color: red;\n  font-size: 14px;\n}\n```\n\nThe text indicates\
    \ the property in the above example. In every selected tag, you must indicate\
    \ properties of that tag, like the color of the text, the size of the text, the\
    \ style of the text, the font-weight and much more. You can always look for any\
    \ property that you’re wanting on the internet. There are many properties and\
    \ we won’t be going over them in this guide. There are different properties that\
    \ are applied to different tags. For the “p” tag in this instance, we can reference\
    \ the color property and the font-size property. Upon referencing them within\
    \ curly braces (which simply indicates the block of properties that applies to\
    \ the selector which is `p`) and then assigning it to a certain value.\n\n```css\n\
    p {\n  color: red;\n  font-size: 14px;\n}\n```\n\nTo assign a certain value to\
    \ the property of `color`, you must make a colon symbol which simply separates\
    \ the property and the value, and then type out a value accordingly. Once you\
    \ have written out the property and the value, use the semi-colon as a way to\
    \ let the browser know that you have ended that statement so it can read the next\
    \ statement.\n\nWhen working with colors, instead of using the standard red, blue,\
    \ white, yellow, etc - you can reference more specific colors depending on the\
    \ RGB values (Red, Green, Blue) which can be obtained using [http://html-codes.info](http://html-codes.info).\n\
    \nTo review CSS let’s look at it:\n\n1. `p`\n2. `{`\n3. `color: red;`\n4. `font-size:\
    \ 14px;`\n5. `}`\n\nThe code above takes the color of the paragraph. Each line\
    \ has been numbered, but wouldn’t be included in the code. You can do this many\
    \ times. Well, let’s first go over how you can actually start coding your HTML\
    \ document with CSS. To begin, you must go in your `<head>` tags and input the\
    \ following:\n\n```html\n<html>\n  <head>\n    <title>The webpage</title>\n  \
    \  <style type=\"text/css\">\n      p {\n        color: red;\n        font-size:\
    \ 14px;\n      }\n    </style>\n  </head>\n</html>\n```\n"
