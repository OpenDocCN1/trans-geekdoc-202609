    This can be useful to find out if a number is even. Simply modulus by `2` and
    if it is `0`, the number is even, otherwise it is odd. This can also be useful
    when trying to find the number of minutes, like on a clock. Simply modulus the
    time in minutes by `60` (`60` minutes in an hour) and the result will be the minutes
    counter of a clock. Notice that when using modulo, you can only get numbers from
    `0` to any number lower than your operator (which can also be a decimal).


    Other mathematical operators like exponents, roots, rounding, etc, are not default
    operations and are actually functions which we will discuss later. Be aware, that
    expressions follow BEDMAS (or PEMDAS, whichever you were taught). Either way,
    here are some expressions and their values.


    ```

    7 * (3 % 2) = 7

    (8 - 1.3) * 6 - 8 / (0 - 4) = 62

    ```


    Keywords are the next division of programming. There are many, which we will get
    around to as we learn different parts of programming. Some common ones are `$`,
    `for`, `while`, `return`, `function`, and `break`. The computer looks for these
    special words to perform specific actions within your code. That is a very generic
    description, but they have a very broad range. Be wary of writing them down when
    you do not mean to use it. If used improperly, it can not only cause mistakes
    in code execution, but can simply make your code not run at all due to an error
    in syntax.


    Statements are the next division of programming. Statements always end in a semicolon
    (except in very specific circumstances). Notice that `console.log` ends in a semicolon,
    and therefore is a statement. This is indicative of the fact that `console.log`
    is a function, but we’ll get to that.


    Let’s begin with a very common and important statement. This has to do with variables.
    Variables are values that are stored inside memory for reuse later in your code,
    often several times. Variables let us give names to stored values. Imagine variables
    like a box, specifically a moving box. When you get the box out, you write the
    name of it on the side of the box so you can know what should be inside the box.
    This is called variable declaration. You are pulling out memory (the box), giving
    it a variable name (writing on the side of the box), and also telling it where
    the box should be, or rather what kind of “scope” the variable has, but we’ll
    come back to that.


    ## The Arithmetic Operators


    ### Addition


    `5+5 = 10`


    ```

    $x = 5;

    $y = 5;

    $sum = 0;

    $sum = $x.$y;

    ```


    In the example above, a variable of `sum` is taking the addition of two variables
    (`x` and `y`) and adding them together to produce the value of `10`.


    ### Subtraction


    `10-5 = 5`


    ```

    $x = 10;

    $y = 5;

    $total = 0;

    $total= $x - $y;

    ```


    In the example above, a variable of `total` is taking the subtraction of two variables
    (`x` and `y`) and subtracting them together to produce the value of `5`.


    ### Multiplication


    `5*4 = 20`


    ```

    $x = 5;

    $y = 4;

    $total = 0;

    $total= $x * $y;

    ```


    In the example above, a variable of `total` is taking the multiplication of two
    variables (`x` and `y`) and multiplying them together to produce the value of
    `20`.


    ### Division


    `20/5 = 4`


    ```

    $x = 20;

    $y = 5;

    $total = 0;

    $total= $x / $y;

    ```


    In the example above, a variable of `total` is taking the division of two variables
    (`x` and `y`) and dividing them together to produce the value of `20`.


    ### Modules


    `7 % 2 = 1`


    ```

    $x = 7;

    $y = 2;

    $total = 0;

    $total= $x % $y;

    ```


    In the example above, a variable of `total` is taking the remainder of two variables
    (`x` and `y`) and by finding how many times `2` multiplies in to `7` evenly before
    it can’t, and the remainder is the output. For example:


    How many times does `2` get in to `7`?


    `3` times.


    `2 * 3 = 6`


    `7 - 6 = 1`


    Therefore, `7` modules `2` is `1`.


    ### Post-Incrementation


    `5++ = 6`


    ```

    $x = 5;

    $y = $x++;

    $x =;

    ```


    In the example above, a variable of `x` is incremented by the value of `1`. Notice
    that when using post-increment, the value is returned before the increment.


    ### Pre-Incrementation


    `++x = 6`


    ```

    $x = 5;

    $y = ++$x;

    $x =;

    ```


    In the example above, a variable of `x` is incremented by the value of `1`. Notice
    that when using pre-increment, the value is returned after the increment.


    ### Post-Decrementing


    `5-- = 4`


    ```

    $x = 5;

    $y = $x--;

    $x = =;

    ```


    In the example above, a variable of `x` is decremented by the value of `1`. Notice
    that when using post-decrement, the value is returned before the decrement.


    ### Pre-Decrementing


    `--x = 4`


    ```

    $x = 5;

    $y = --$x;

    $x = =;

    ```


    In the example above, a variable of `x` is decremented by the value of `1`. Notice
    that when using pre-decrement, the value is returned after the decrement.


    ## The Assignment Operators


    The assignment operators are used when assigning values, the most commonly used
    being (`=`). Here are examples:


    ### Equal Sign: `=`


    ```

    $x = 5;

    ```


    In this example, `x` is assigned the value `5`.


    ### Add-Equal Sign: `+=`


    ```

    $x += 5;

    ```


    In this example, `x` becomes `10` because you are adding the value of `5` to the
    existing value of `x`.


    ### Subtract-Equal Sign: `-=`


    ```

    $x -= 5;

    ```


    In this example, `x` becomes `0` because you are subtracting the value of `5`
    from the existing value of `x`.


    ### Multiplication-Equal Sign: `*=`


    ```

    $x *= 5;

    ```


    In this example, `x` becomes `25` because you are multiplying the existing value
    of `x` by `5`.


    ### Division-Equal Sign: `/=`


    ```

    $x /= 5;

    ```


    In this example, `x` becomes `1` because you are dividing the existing value of
    `x` by `5`.


    ### Modules-Equal Sign: `%=`


    ```

    $x %= 5;

    ```


    In this example, `x` becomes `0` because you are finding the remainder in `(5/5)`.


    Another important thing to understand when working with numbers in PHP is that
    it matters how you declare your number. If you declare it with a decimal value,
    when you divide it, it will output as a decimal number if it doesn’t divide by
    two evenly, while if you declare it with an integer value (whole number) it will
    divide by two and round down if it divides unevenly.


    For example:


    ```

    $numberWithDecimal = 5.5;

    $wholeNumber = 5;

    ```

