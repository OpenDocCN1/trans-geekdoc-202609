    # 引言


    ## 欢迎来到你的新编程语言


    所以，你决定学习 `PHP Programming` 了吗？很好，恭喜你，欢迎来到你的新编程语言！你会喜欢它的！


    在 Eprogramy，我们相信良好教育的基础是提供能够开启未来之门的工具。不可否认，世界已经进入了一个我们一切触手可及的时代。社会需求已经变化。因此，今天的沟通方式也发生了变化。沟通开启了大门，因此我们的挑战是学习如何用一种新的语言进行交流：这就是编程语言。


    也许道路是困难辛苦的，但我们将为读者提供工具，让学习变得愉快且富有成果。我们将展示学习编程所需的所有方面。从基础知识到解决最常见的编程问题，以及更多、更多内容。


    我们清楚自己在做什么，并相信你完全有能力吸收我们的教学。


    未来的门已经开启。让我们一起一步步迈前进。


    让我们开始吧！


    Eprogramy 团队


    # 第 1 章


    # PHP 编程语言


    ## PHP 历史


    `PHP` 的第一个形态是用 C 语言编写的一组简单的通用网关接口 (`CGI`) 二进制文件。`PHP` 由 Rasmus Lerdorf 于 1994
    年创建。随着对功能需求的增加，产生了更多的 `PHP` 工具。通过这种方式，它产生了规模庞大得多且丰富的实现。


    1995 年 6 月，`PHP` 工具的源代码向公众发布，允许开发者以他们想要的方式使用它。由于这种灵活性，许多开发者提供了错误修复，并帮助 `PHP` 变得比以往任何时候都更加强大。


    '
- fmt: "\nIn time, the code received another complete makeover, and in April of 1996,\
    \ Rasmus introduced `PHP/FI`. This version of `PHP` evolved it into a wide suite\
    \ of tools into a programming language in its own right. It included built-in\
    \ support for `DBM`, `MySQL`, and `Postgres95` databases, cookies, user-defined\
    \ function support, and much more.\n\nAlthough `PHP` lived a short development\
    \ time, it went through a growing popularity in the young world of web development.\
    \ Surveys took place in 1998 that indicated that nearly 60,000 domains were using\
    \ `PHP` on their host server, and had it installed. At the time, this number was\
    \ 1% of all domains on the internet. \n\nThe programming language, `PHP`, was\
    \ developed primarily by an individual, who has brought a simple, yet powerful\
    \ programming language to the web development community—one that can be used to\
    \ do many great things, which we’ll be going over in this guide.\n\n## What is\
    \ PHP?\n\n`PHP` is a server-side programming language that can be used to make\
    \ static web pages more dynamic in the sense where it can do logical operations\
    \ in the backend of a server and return/output results accordingly on a page.\
    \ One downside to `PHP` is that a page must be reloaded in order for information\
    \ to be received by the server and processed accordingly. There are many ways\
    \ to get around this to make the page dynamic without reloading it. This can be\
    \ done using a hybrid of `PHP` and `AJAX`, and this will be talked about later\
    \ on in the guide.\n\nNow let’s go over why `PHP` is a great programming language\
    \ to know. It is a quick and easy to use server-side scripting language designed\
    \ for web development and also many other uses. It also has great community support\
    \ which helps out with many solutions to problems that developers face commonly\
    \ with `PHP`. \n\nDue to the fact that it has a lot of great community support,\
    \ there are many third-party programs available for free to help out and ease\
    \ the use of programming `PHP`. Considering that `PHP` has community support also\
    \ leads one to think of the great list of inbuilt functions for `PHP` that will\
    \ allow a developer less time to worry about custom coding his own functions and\
    \ worry more about what he needs accomplished.\n\nWe have talked a lot about how\
    \ `PHP` is a server-side scripting language but we haven’t really talked about\
    \ what that means. There are two types of scripting languages: server side and\
    \ client side. An example of a client-side language would be `Javascript` and\
    \ an example of a server-side language would be `PHP`. \n\nThe difference between\
    \ them is that a client-side language, like `Javascript`, simply needs the browser\
    \ to compile and interpret its language, whereas `PHP` depends on the server to\
    \ compile and interpret its language and send the info to the browser to interpret.\
    \ One of the many uses `PHP` is used for is to handle databases, commonly with\
    \ the `MySQL` database which it has great inbuilt support for.\n\n# Chapter 2\n\
    \n## Setting up MySQL and PHP\n\nThe first thing you want to do is download `XAMPP`,\
    \ which will allow you to run `PHP` code and manipulate `MySQL` databases. After\
    \ the successful installation of `XAMPP` – go to the folder it was installed and\
    \ execute `xampp.control.exe`. Then, press the start button at `Apache` and `MySQL`.\n\
    \nPress the start button at the `MySQL` row.\n\n![enter image description here](images/00001.jpeg)\n\
    \nWhen `MySQL` has successfully started, there are still a few more things you\
    \ must do. There are two different ways to actually manage and administrate the\
    \ `MySQL` server and its databases.\n\nStart the `apache` server and open your\
    \ browser and type in `localhost` or `127.0.0.1`. Once you have done this, then\
    \ an `XAMPP` status page should appear. Navigate to the security settings and\
    \ change your `MySQL` root password. Then, you are able to browse to `PHPMyAdmin`\
    \ under `localhost` or you can download a Windows `MySQL` client. An example would\
    \ be `Navicat` or `MySQL Workbench`. Once you have installed it, you’re able to\
    \ log in to your `MySQL` Server with the password that you set. So you can either\
    \ use a third-party program to access your database or use `PhpMyAdmin` built\
    \ into `XAMPP`.\n\n![enter image description here](images/00002.jpeg)\n\nNow for\
    \ `PHP` files, you must head to the `XAMPP` directory where it was installed and\
    \ find a folder named `htdocs`. This folder is going to contain all the files\
    \ that will pop up when you do `localhost/filename.html`. So if you have an `index.html`\
    \ file in the `htdocs` folder, you can refer to it accordingly. Over here, you\
    \ can create a `.php` extension file with `PHP` code and `HTML` code and put it\
    \ in the folder. Then you can call it.\n\n# Chapter 3\n\n## Basics of HTML and\
    \ CSS\n\n### HTML\n\nIn order to understand how `HTML` works, we must look at\
    \ the fundamentals. `HTML` stands for HyperText Markup Language. It is used to\
    \ create web pages.\n\nThere are many tags in `HTML` that you could look up. Let’s\
    \ look at a variety of examples and identify some helpful tags.\n\n```html\n<html>\n\
    <head>\n<title></title></head>\n<body>\n</body>\n</html>\n```\n\n```html\n<html>\n\
    <head>\n    <title>Example of <p> tag</title>\n</head>\n<body>\n    <p>This is\
    \ a paragraph.</p>\n</body>\n</html>\n```\n"
