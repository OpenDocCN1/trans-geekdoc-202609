    _f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g](images/00005.jpeg)\n\
    \nThen, select either the Windows 32 Bit OS or Windows 64 depending on the type\
    \ of OS / processor you have.\n\nOnce the IDE has been installed, we’ll move on\
