    ;   \n\n$cart\\_array\\[\"onion\"\\] = \"1.00\";   \n\n$cart\\_array\\[\"lettuce\"\
    \\] = \"2.40\";   \n\n$cart\\_array\\[\"tomato\"\\] = \"1.00\";   \n\necho \"\
    John has an average of: “ . $students\\_array\\[“John”\\] . \".\"; \n\nprint\\\
    _r($students\\_array);\n\nprint\\_r($cart\\_array);   \n\n?>\n\nOutput:\n\nJohn\
    \ has an average of: 84 in school.  \n\nArray ( \\[John\\] => 84  \\[Bob\\] =>\
    \ 87 \\[Jane\\] => 91\\[Thomas\\] => 94 \\[Matthew\\] => 92\\[Peter\\] => 76 )\n\
    \nNow this is great and all, having arrays, and being able to hold big databases\
    \ of names, or social security numbers, etc - but imagine trying to print all\
    \ these values out manually by pointing out the index of the array and retrieving\
    \ the value. Well, let’s think about it, if I want to print out multiple values\
    \ from an array from multiple different index values, then I must alert all the\
    \ different indexes of the array, therefore I can conclude that I could use a\
    \ Loop to affect the variable of the index to alert and retrieve the values of\
    \ the array variable. For example:\n\n              $names = new array(“John”,\
    \ “Bob”, “Tom”);\n\n              for ($i = 0; $i < count($names); $i++) {\n\n\
                                echo(names\\[$i\\]);\n\n}\n\nIn the above example,\
    \ a variable of name “names” is being declared with three values of “John”, “Bob”\
    \ and “Tom” - once the array variable has been set. We are Looping the i variable\
    \ until it reaches right before the length of the array (number of elements held\
    \ in the array) in order to print them out. Then, we alert the array’s index values\
    \ out by placing the i in the brackets next to the array’s name in order to refer\
    \ to the specific index, which then prints out the names accordingly. So the output\
    \ of this code would be:\n\nJohn\n\nBob\n\nTom\n\nUsing our understanding from\
    \ arrays and Loops , we have managed to combine their use to output all the elements\
    \ from the array. The idea of this concept of combining Loops and arrays to work\
    \ together is just one way you can use Loops or arrays to do what you want. The\
    \ whole idea of programming comes from thinking outside of the box by deciding\
    \ how you are able to manipulate numbers and strings and functionality of the\
    \ language in order to compute the targeted algorithm that you’re aiming to accomplish\
    \ (algorithm: set of steps to complete to accomplish a certain goal).\n\n## Multidimensional\
    \ Arrays\n\nMulti-Dimensional arrays are greatly useful in programming. They are\
    \ basically arrays within a single dimensional array. Essentially, each index\
    \ of a single dimensional array will now hold another array. If the index of the\
    \ single array, holds an array of indexes which also holds an array, that would\
    \ then be a third dimension array.  But in this case, we’ll be going over a two\
    \ dimensional array. In order to create a two dimensional array, you would create\
    \ the array like you would last time except you would then use the “array” keyword\
    \ with parenthesis again within the initial parent array() to indicate that you’re\
    \ creating children, and hence, another dimension.\n\n$employees = array(\n\n\
    'names' => array('John','Peter'),\n\n'salaries' => array('40000', '25000'));\n\
    \nIn order to access the array, you would do the following:\n\nprint $employees\\\
    ['names'\\]\\[0\\];            // John\n\nprint $employees\\['salaries'\\]\\[0\\\
    ];            // 40000\n\nEach level of the array is a dimension, and in the beginning,\
    \ we have been using one dimensional until now. These are called multi-dimensional\
    \ arrays due to the fact that they have more one than dimension. In order to manipulate\
    \ this multidimensional array, we can do the following:\n\n$employees\\[‘names’\\\
    ]\\[0\\] = “Tod”;\n\nIn order to actually iterate through each dimension of a\
    \ multi-dimensional array, we can use a foreach Loop or a for Loop. Here’s an\
    \ example:\n\n$names = array('employee\\_names' => array('John','Peter'));\n\n\
    foreach ($names as $n => $names\\_array) {\n\n    foreach ($names\\_array as $x\
    \ => $y) {\n\n        print \"Hello: \".$y.\"\\\\n\";\n\n    }\n\n}\n\nOutput:\n\
    \nHello John\n\nHello Peter\n\n# Chapter 8\n\n# Functions and Classes\n\nA function\
    \ is a block of code that can be run at any point in your program with a single\
    \ line of code, and it can be used as many times as you’d like. This allows you\
    \ to write a block of code once, and then be able to use it as many times as you’d\
    \ like throughout your code. To create a function, simply write “function”, a\
    \ variable name, and then brackets, followed by squiggly brackets, which hold\
    \ your code.\n\nfunction printSomething()\n\n{\n\n              echo(“Something\
    \ I guess? I don’t know...”);\n\n}\n\nThis is a very simple function. Between\
    \ the normal brackets, you can place variable names. These are called parameters.\
    \ These parameters will allow you to give values to the code, which could give\
    \ you a different output.\n\nfunction printSomething($times)\n\n{\n\n             \
    \ for($i = 0; $i < $times; $i++)\n\n              {\n\n                           \
    \ echo(“Mum!”);\n\n}\n\n}\n\nThis function uses a variable called times, runs\
    \ a Loop for that number of times, and in each Loop prints “Mum!”. So if you run\
    \ this code with a value of 7, “Mum!” will print out 7 times. You can have as\
    \ many parameters as you want (although the fewer the better). Just separate each\
    \ variable name with a comma.\n\nfunction printSomething($times, $whatToPrint)\n\
    \n{\n\n              for($i = 0; $i < times; $i++)\n\n              {\n\n             \
    \               echo($whatToPrint);\n\n}\n\n}"
