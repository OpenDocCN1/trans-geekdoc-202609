    \ not greater than b \");\n\n}\n\nIn this example, I changed the position of the\
    \ bracket from the NOT operator to extend to both operands. Now for the statement\
    \ to be true, “a” has to NOT equal to 20, AND “a” must NOT be greater than “b”.\
    \ In this situation the statement will return false, because “a” is greater than\
