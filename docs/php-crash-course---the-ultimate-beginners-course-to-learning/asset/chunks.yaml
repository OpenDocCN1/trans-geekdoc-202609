    \ of PHP. It’s like writing in any language. You may follow the rules of the language,\
    \ like grammar, structure, etc, but your paragraphs don’t necessarily have to\
    \ make sense. The most common method of debugging is simply using `console.log`\
    \ and printing out variables to find where values stop making sense. Then you\
    \ can find the lines that are causing the error and debug that.\n\nOne thing that\
    \ may or not be considered debugging is optimization. Once you’ve written your\
    \ code, it may be tempting to just leave it and continue on with other tasks,\
    \ but this may not be what you want to do. If your program gets the desired results\
    \ eventually, but it takes a long amount of time, then it is not very good. That\
    \ said, there is no single strategy to make code more optimized. Sometimes your\
    \ logic could simply be a long method of doing something, and sometimes it could\
    \ be how you implement that logic. Be wary of creating unused variables, as they\
    \ can take up processing time and memory. This is because of a system called garbage\
    \ collection. It goes through all the variables in your code and removes any ones\
    \ that are no longer valid. For example, if you make a for Loop, after the `for\
    \ Loop`, that variable is not valid, so it should be deleted to save on memory.\
    \ This takes up (small) amounts of processing time.\n\nHere is an optimization\
    \ example. Say you want to find the distance from one point to another. `Math`\
    \ class tells us to use Pythagorean theorem. But this is rather slow. First the\
    \ computer must square both sides (which is quite expensive—performance-wise),\
    \ then add them, then square root them. This calculates the accurate distance\
    \ between two points. Another solution though, could be to use Manhattan distance.\
    \ This will not get you accurate distances, but it could be good in situations\
    \ where the exact value is not important, and speed is more important. To do Manhattan\
    \ distance, simply absolute (which means to make a value positive, so -7 becomes\
    \ 7 and 8 remains 8) both the x and y components and then add them. This gives\
    \ you an inaccurate distance, but it is much faster than its accurate counterpart.\n\
    \n# Final Words\n\nThis is the start of your journey as a PHP programmer. You\
