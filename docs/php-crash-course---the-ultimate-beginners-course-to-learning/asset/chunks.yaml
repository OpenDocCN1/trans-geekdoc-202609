    The download of these two tools will put you on your way to becoming a Java programmer.
    An IDE (integrated development environment) is a packaged application program
    used by programmers because it contains necessary tools in order to process and
    execute code. An IDE contains a code editor, a compiler, a debugger, and a graphical
    user interface (GUI). There are many different type of IDE’s but the most commonly
    used ones are:


    1. Netbeans

    2. Eclipse


    In this guide, it would be recommended to use Eclipse because of its simplistic
    nature. In order to download Eclipse, please use the following link:


    [https://eclipse.org/downloads/](https://eclipse.org/downloads/)


    Once you have reached this link, you will have to find this:


    ![https://lh5.googleusercontent.com/L1DhiS0lHF2Wt52-NpfmrM1VQ\_f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g](images/00005.jpeg)


    Then, select either the Windows 32 Bit OS or Windows 64 depending on the type
    of OS / processor you have.


    Once the IDE has been installed, we’ll move on to downloading and installing the
    JDK which will allow us to interact with a coding editor in order to execute and
    create Java code.


    To download the JDK, go to the following link:


    [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)


    Upon entering this link, find this figure:


    ![e319d84467.png](images/00006.jpeg)


    Once you’ve installed the JDK, you are able to launch Eclipse accordingly.


    The folder that was extracted from the Eclipse download will contain an `eclipse.exe`
    that can be launched. Once this has been launched, you will be met with the following
    figure:


    ![https://lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf\_NCgjhG604yFXhZCBsy3GfC1y\_wg6v4gEp4uFNT80](images/00007.jpeg)


    All this prompt is asking for is where to set up the output directory for where
    all the code written by you is going to be saved. Once this has been selected
    accordingly, click “OK” to continue.


    You should now be on this screen (or something similar):


    ![https://lh4.googleusercontent.com/VGvC-jry3vINgfeT3wHIxCNknMZ42pgBwnuoQoVyeW2QyyeIcbrRPvsLebgE8ED5nQvKz4adYyc3smu1QDvifZxfKuu9kxPvBmbA3KOIx8oK5nfz7U5En8o0j\_ZRrxpagxUV1cE](images/00008.jpeg)


    ### Instructions


    1. Click `File`

    2. Click `New` → `Java Project`


    ![https://lh3.googleusercontent.com/Uul4AHUr2ZURDElR9Y503X0iTSRDnAT0yK1j5R489G0kjKa8knxzkCrbXTZOkZPVBJ57VzYFAv2MCDPQ98GergtcUD9efhjBn8WoeWPLAZ9c-p1Jofiju6tB-mtiEMfP4v4Ia008](images/00009.jpeg)

    3. Type in a project name in the “Project name:” field

    4. Click “Finish”

    5. Now right click `src` → `New` → `Class`


    ![https://lh3.googleusercontent.com/c1DJ75yt6\_Bp0f-XdRKqu2Z7WY\_Q3PbDSjkXq-iWmI-NTzRdaUrqLpIzKBx6nnvTPiwAR19HRF8giYlstqw8LeRR4uWDrdwXuXO-ZsPT9SR6but78QppV2bkSRK7N7IzPWjP-OE](images/00010.jpeg)

    6. Fill in the name field to anything with letters and no special characters.
    Example: “ThisIsAClass”

    7. Click Finish


    You will now be presented with a screen that says:


    ```java

    public class ThisIsAClass {

    }

    ```


    You have successfully completed the installation of Java!


