  trans: "\n在上面的示例中，我们通过仅切换括号的位置就显著改变了程序的逻辑。注意现在括号包围了两个内部操作数，而不是两对括号包围着每对外部操作数。要让此语句现在返回\
    \ `true`，必须有 3 个不同的条件返回 `true`。变量 `a` 必须等于 `20`，并且 `a` 必须大于 `b` 或者不等于 `20`；并且\
    \ `a` 必须小于 `b`。根据这个新逻辑，第一个操作数必须为真，且第二个或第三个操作数中必须有一个为真。此外，`a` 必须小于 `b`。该语句将返回 `false`。它将通过第一个条件，因为\
    \ `a` 不等于 `20`。它将通过第二个条件，因为它大于 `b`，但会在最后一个条件失败，因为 `a` 并不小于 `b`。由于这需要三个正确的条件，而只有一个符合，因此语句返回\
    \ `false` 并打印“wrong”。\n\n## 赋值\n\n我们现在将完成另一个作业，以确保我们理解了关于运算符的所有内容。我们有三个朋友想知道他们的钱和其他人相比有多少。我们将编写一个程序，输出谁比谁富有。我们将有三个名为\
    \ `bob`、`john` 和 `tom` 的整数。我们将给他们每一个人分配一个不同的值，程序必须输出谁更富有。它还必须告诉我们是否有人的金额相同。\n\n\
    例如：\n\n如果 `bob = 20`，`tom = 10` 且 `john = 5`，输出必须是：\n“bob 比 tom 富，而 tom 比 john\
    \ 富”\n\n但但如果 `bob = 20`，`tom = 20` 且 `john = 5`，输出必须是：\n“bob 和 tom 一样富有，他们都比 john\
    \ 富”\n\n程序需要适用于每可能的结果。我强烈建议你自己尝试运行这个程序，并在查看答案之前尽可能地努力解决它。编程的很大一部分是解决问题和理解代码，因此我建议你先尝试自己想出来。\n\
    \n## 答案与解释\n\n注意，程序将通过代码中的注释进行解释。\n\n```php\n// 可以随意更改这些值\n\n$tom = 10; // tom\
    \ 拥有的钱\n$bob = 20; // bob 拥有的钱\n$john = 10; // john 拥有的钱\n\n/* 我们首先检查是否每个人的金额都相同\n\
    \ * 注意我从未检查过 tom 是否等于 john，因为如果\n * tom 等于 bob 且 bob 等于 john，那么显然\n * tom 等于 john\n\
    \ */\nif ($tom == $bob && $bob == $john) {\n    echo(\"Everyone has the same amount\
    \ of money\");\n}\n\n/*\n * 如果第一个语句返回 false\n * 我接下来检查特殊情况，即 tom 和 bob 的金额相同\n\
    \ * 而 john 不是\n */\nelse if ($tom == $bob && $bob != $john) {\n    /*\n    * 现在我检查\
    \ bob 是否大于小于 john\n    * 然后输出正确的答案\n    */\n    if ($bob > $john) {\n        echo(\"\
    tom is just as rich as bob, both are richer than john\");\n    } else if ($bob\
    \ < $john) {\n        echo(\"tom is just as rich as bob, both are more poor than\
    \ john\");\n    }\n}\n\n/*\n * 我重复与上一个相同的过程，但针对不同的人\n */\nelse if ($tom == $john\
    \ && $john != $bob) {\n    if ($john > $bob) {\n        echo(\"tom is just as\
    \ rich as john, both are richer than bob\");\n    } else if ($john < $bob) {\n\
    \        echo(\"tom is just as rich as john, both are more poor than bob\");\n\
    \    }\n}\n\n/*\n * 最后一组名字组合，\n * 与上一个语句相同\n */\nelse if ($john == $bob && $bob\
    \ != $tom) {\n    if ($bob > $tom) {\n        echo(\"bob is just as rich as john,\
    \ both are richer than tom\");\n    } else if ($bob < $tom) {\n        echo(\"\
    bob is just as rich as john, both are more poor than tom\");\n    }\n}\n\n/*\n\
    \ * 现在我检查最后可能的组合\n * 即每个人的金额都不同\n * 下六个语句涵盖了每可能的结果\n */\nelse if ($tom > $bob\
    \ && $bob > $john) {\n    echo(\"tom is richest, followed by bob, followed by\
    \ john\");\n} else if ($tom > $john && $john > $bob) {\n    echo(\"tom is richest,\
    \ followed by john, followed by bob\");\n} else if ($bob > $tom && $tom > $john)\
    \ {\n    echo(\"bob is richest, followed by tom, followed by john\");\n} else\
    \ if ($bob > $john && $john > $tom) {\n    echo(\"bob is richest, followed by\
    \ john, followed by tom\");\n} else if ($john > $bob && $bob > $tom) {\n    echo(\"\
    john is richest, followed by bob, followed by tom\");\n} else if ($john > $tom\
    \ && $tom > $bob) {\n    echo(\"john is richest, followed by tom, followed by\
    \ bob\");\n}\n```\n\n编写代码时，对所有逻辑进行注释是非常重要的，这样没有写代码的人就可以轻松理解并编辑它。我建议在编写代码时，根据你认为所需的程度进行注释。我也鼓励你尝试找到更好的解决问题的方法。也许你可以用四分之一的长度来编写它。\n\
    \n# 第 7 章 循环与数组\n\n指南的这一部分很重要，因为它涵盖了编程中一个最重要的概念。循环（Loops）正如其名所示——它们是允许你根据要求，按一定次数运行特定代码块的函数。在介绍数组之前，我们先介绍循环的工作原理。\n\
    \n## 循环\n\nPHP 中的循环与许多其他编程语言基本相同。其语法也相当直观。在每个循环中，都设置了一个条件供循环检查其是否为真，直到情况发生反转时，循环本身才会退出。例如，如果你创建一个循环并要求它在停止前运行特定代码块\
    \ 10 次，有几种方法可以实现，因为有不同类型的循环。循环的一般思路如下：\n\n```php\nLoop (condition) {\n    // 代码块\n\
    }\n```\n"
- fmt: "\nIn order to create a Loop in PHP - we must understand the different type\
    \ of Loops and when they are useful. Let’s go over these types of Loops and then\
    \ I’ll explain how each of them work as we go through and by the end, you should\
    \ have gained a good understanding of how Loops work.\n\n### For Loops\n\n```php\n\
    for ($x = 0; $x < 10; $x++) {\n    echo(\"Hi \".$x);\n}\n```\n\nThere are quite\
    \ a few things that are going on in the above example so let’s go over it line\
    \ by line. The first line says:\n\n`for ($x = 0; $x < 10; $x++)`\n\nIn the above\
    \ statement, it is a conventional standard for the `for` Loop. We must first declare\
    \ the variable, so let’s start by declaring the `x` variable and make it an `int`\
    \ starting at 0. Next, let’s add a semicolon to separate that specific component\
    \ of the `for` Loop by adding a condition. That is why I did `$x < 10` which simply\
    \ says that for however long that `x` is less than 10, run the block of code that\
    \ is under my curly braces (`{` and `}`). This statement is now separated by another\
    \ semi-colon to let the final element of the `for` Loop to be entered. This is\
    \ the part where you tell the specific variable that you declared, to do a certain\
    \ arithmetic operation. In this case, we are telling `x` to increment each time\
    \ the Loop passes.\n\nLet’s go over this in a pseudocode approach (english-readable):\n\
    \n```pseudocode\nfor ( declare variable; create condition for variable; affect\
    \ variable) {\n    // Run this block of code\n}\n```\n\nOnce it runs the block\
    \ of code, it will go back to the first statement and check whether or not the\
    \ condition is still met. It will skip declaring the variable since it will notice\
    \ that it has already been declared. It will then skip to affecting the variable\
    \ before checking to see if the condition is met.\n\nHere’s a blueprint to follow\
    \ for the `for` Loop or any Loop for that matter:\n\nDeclares Variable → Checks\
    \ Condition → Runs block of code → Affects Variable → Checks Condition → Runs\
    \ block of code → Affects Variable → Checks Condition → Runs block of code → Repeat\
    \ starting from “Affect Variable”\n\nNow if we look back at the code we created\
    \ with a little modification on alert:\n\n```php\nfor ($x = 0; $x < 10; $x++)\
    \ {\n    echo(\"Current Number: \".$x);\n}\n```\n\nWe can see that this Loop is\
    \ simply incrementing `x` from 0 to 9, so technically 10 iterations since 0 is\
    \ inclusive. Therefore, the Loop alerts the following as the output:\n\nCurrent\
    \ Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent\
    \ Number: 4\nCurrent Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent\
    \ Number: 8\nCurrent Number: 9\n\nRemember how I said that a `for` Loop’s last\
    \ statement is the arithmetic operation for the variable that has been declared\
    \ - well the variable can be affected in any way, you can increment by 2’s if\
    \ you wanted to as well.\n\nNow that we know how a `for` Loop works, it will be\
    \ easier to understand how a `while` Loop and a `do-while` Loop work.\n\n### While\
    \ Loop\n\nThe only difference with a `while` Loop compared to a `for` Loop is\
    \ that it only carries the condition of the Loop, and not the variable. Therefore,\
    \ you must actually declare the variable outside of the scope of the Loop before\
    \ affecting it in the Loop to carry out a certain condition.\n\nFor example:\n\
    \n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"Current number: \".$x);\n   \
    \ $x++;\n}\n```\n\nIn the example above, as seen, a `while` Loop simply checks\
    \ for a condition and when it has been met, runs the block of code, and then affects\
    \ the variable `x` so it goes back to checking the condition when the block of\
    \ code is done executing, and simply continues to do it until `x` is not less\
    \ than 10. The output for this is the same as the `for` Loop output:\n\nCurrent\
    \ Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent\
    \ Number: 4\nCurrent Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent\
    \ Number: 8\nCurrent Number: 9\n\nThere are things that can go wrong with this\
    \ `while` Loop like the accidental creation of an infinite Loop. For example:\n\
    \n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"Current number: \".$x);\n}\n\
    ```\n\nIn the above example, it is doing exactly the previous Loop was doing except\
    \ the output (which is to alert a certain piece of text) would be infinitely displaying\
    \ because the variable `x` is never being affected.\n\nThe final type of Loop\
    \ we will be covering is the do-while Loop. This Loop does everything the `while`\
    \ Loop does, except it does something at least once regardless of the condition.\n\
    \nFor example:\n\n```php\n$x = 0;\ndo {\n    echo(\"Current number: \".$x);\n\
    \    x++;\n} while ($x < 10)\n```\n\nThe above example simply runs the iteration\
    \ of the block of code at least once regardless of the condition that is given\
    \ at the end before testing the condition. This can be useful if you ever wanted\
    \ a Loop to do something, except at least do it once before checking the condition.\n\
    \n### Continue Keyword\n\nThe `continue` keyword is used when you want to skip\
    \ an iteration of a Loop. For example:\n\n```php\n$x = 0;\nwhile ($x < 10) {\n\
    \    if ($x == 5) {\n        continue;\n    }\n    echo($x);\n}\n```\n\nIn the\
    \ above example, we are checking if `x` is equal to 5, if it is then what we do\
    \ is skip the iteration of the Loop, meaning the output of this Loop becomes:\n\
    \nCurrent Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\n\
    Current Number: 4\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent\
    \ Number: 9\n\nAs seen in the output above, the Loop skips 5 because it was told\
    \ to skip that iteration of the Loop before it even had the chance to alert the\
    \ number.\n\n### Break Keyword\n\nThe `break` keyword is used when you want to\
    \ break out of the Loop. For example:\n\n```php\n$x = 0;\nwhile ($x < 10) {\n\
    \    if ($x == 5) {\n        break;\n    }\n    echo($x);\n}\n```\n\nIn the above\
    \ example, we are checking if `x` is equal to 5, if it is then what we do is break\
    \ out of the Loop, meaning the output of this Loop becomes:\n\nCurrent Number:\
    \ 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number:\
    \ 4\n\nAs seen in the output above, the Loop breaks out once it reaches the fifth\
    \ iteration meaning, to essentially stop the Loop from continuing on any further.\n\
    \nIf we combine the conceptual understanding of Loops and arrays, we can come\
    \ up with complex code - that is why we will be learning arrays before we look\
    \ at a real-world application where this may be useful to use so you can gain\
    \ a better understanding of why Loops and arrays are helpful. You will be using\
    \ Loops and arrays a lot when programming even if it doesn’t seem like it right\
    \ now.\n\n## Arrays\n\nArrays in programming are helpful because it allows you\
    \ to create lists of strings/numbers/objects or whatever data type you can think\
    \ of. Again, this might not be apparent at first but will be when you start to\
    \ program and realize that you may need to use arrays in certain instances. So\
    \ an array is basically a single variable that holds multiple values that can\
    \ be accessed individually. Let’s go over the syntax of how an array declaration\
    \ would work.\n\nIn order to declare a variable, you must do the following:\n\n\
    ```php\n$names = array(\"John\", \"Bob\", \"Tom\");\n```\n\nIn the example above,\
    \ what we are doing is declaring a variable with the name of `names`, and then\
    \ we are assigning it a list of values, which are of string type. So in order\
    \ to assign values to the array, we added `array()` which simply set the boundaries\
    \ for the array. Then, we noted that the array type is string by surrounding each\
    \ element by quotation marks and then adding a comma in between each element to\
    \ indicate that it is a different element in the array.\n\nIn order to access\
    \ specific element values from the array, we use the following syntax:\n"
