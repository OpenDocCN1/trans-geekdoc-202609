    # JAVA 速成课程 - 12 小时内学习 Java 编程的终极入门课程预览


    # 引言


    # 欢迎来到你的新编程语言


    所以，你决定学习 `Java` 编程了吗？很好，恭喜你，并欢迎来到你的新编程语言！你会爱它的！


    在 Eprogramy，我们相信良好教育的基础是提供能够开启未来之门的工具。不可否认，世界已经进入了一个我们一切都触手可及的时代。社会需求已经改变。因此，今天的沟通也发生了变化。沟通开启了大门，因此学习如何沟通是我们的挑战。在
    Eprogramy，我们希望你学会如何用一种新语言交流：编程语言。这种语言允许我们使用电脑或笔记本电脑进行创作。


    也许道路是艰难艰辛的，但我们将为读者提供让学习变得有趣且富有成果的工具。我们将展示学习编程所需的所有方面。从软件的安装到最常见编程问题的解决，以及更多、更多。始终通过大量的示例提供帮助，这将有助于更好地理解。


    我们清楚自己在做什么，并相信你完全有能力吸收我们的教学。


    未来的大门已经开启。让我们一起一步步前进。


    让我们开始吧！


    Eprogramy 团队


    # 第 1 章


    # Java 编程语言


    ## Java 的历史


    `Java` 是一种首次于 1995 年公开提供的编程语言，由 Sun Microsystems（太阳公司）的 James Gosling 于 1991 年创建。Sun
    Microsystems 后被 Oracle（甲骨文）收购，现在是负责该编程语言命运的实体。`Java` 随后在通用公共许可证（GPL）下成为开源可用。


    `Java` 的语法很大程度上源自 `C` 和 `C++`，但它简化了内存管理（垃圾回收过程在 `Java` 中是自动化的）。


    `Java` 最初是为交互式电视设计的，但超越了电视行业。`Java` 有五项设计原则：


    1. 必须是简单的、面向对象的且熟悉的

    2. 必须是健壮且安全的

    3. 必须是架构无关且可移植的

    4. 必须是高性能的

    5. 必须是解释性的、多线程且动态的


    另一个重要的设计目标是可移植性，这是 `Java` 成功的关键因素。在这种语境下，可移植性意味着编写的 `Java` 代码可以在任何硬件操作系统组合上执行。


    遗憾的是，`Java` 比 `C++` 等语言慢（需要更多内存），但随着时间的推移，`Java` 1.1 被引入，执行速度得到了显著提高。


    `Java` 是专为面向对象语言构建的，这现在还没有太大意义，但在稍后的指南中将会。面向对象编程允许创建高效、组织良好且强大的代码，并在文中贯穿。


    ## 什么是 Java？


    `Java` 是一种具有多平台能力的编程语言，这意味着你可以为任何设备编写 `Java`，无论是安卓手机、Windows 电脑还是苹果产品。由于 `Java`
    的灵活性，它使其成为全球许多程序员最流行的编程语言之一。`Java` 可用于创建 Web 应用程序、游戏、Windows 应用、数据库系统等。


    `Java` 因其简单性和强大性而与其他编程语言不同。`Java` 是一种简单的编程语言，因为它在内存管理或处理相互继承关系的复杂类群方面对用户要求极低。虽然这现在听起来没什么意义，但在接触
    `Java` 的继承点时会有意义。


    `Java` 程序通过 Java 虚拟机（JVM）运行，它本质上是操作系统的软件实现，用作执行 Java 程序的一种。编译器（将代码转换为计算机可读指令的过程）分析
    Java 代码并将其转换为字节码，允许计算机理解并相应执行程序员发出的指令。


    在下载和安装 `Java` 时，该平台的发行有两种方式：Java 运行环境（JRE）和 Java 开发工具包（JDK）。`JRE` 本质上是运行 Java
    程序的 Java 虚拟机（JVM）。而 `JDK` 则是功能齐全的 Java 开发包，包含了 `JRE`、编译器、工具等。


    只想在机器上运行 Java 程序的普通用户只需要安装 `JRE`，因为它包含了如前所述允许 Java 程序执行的 `JVM`。另一方面，Java 程序员必须下载
    `JDK` 才能实际编写 Java 程序。


    # 第 2 章


    # Java 安装


    为了在机器上安装 Java，你需要下载以下内容：


    1.  Java 开发者使用的 IDE

    2.  Java JDK

