  trans: "\n\n```php\n<?php\n$server_name = \"localhost\";\n\n$username = \"username\"\
    ;\n\n$password = \"password\";\n\n// 连接\n$con = new mysqli($server_name, $username,\
    \ $password);\n\n// 检查连接\nif ($con->connect_error) {\n    die(\"Connection failed:\
    \ \" . $con->connect_error);\n}\n\n// 创建数据库\n$sql = \"CREATE DATABASE dbName\"\
    ;\nif ($con->query($sql) === TRUE) {\n    echo \"Database created successfully\"\
    ;\n} else {\n    echo \"Error creating database: \" . $con->error;\n}\n$con->close();\n\
    ?>\n```\n\n### 非对象格式示例\n\n```php\n<?php\n$server_name = \"localhost\";\n\n$username\
    \ = \"username\";\n$password = \"password\";\n\n// 连接\n$con = mysqli_connect($server_name,\
    \ $username, $password);\n\n// 检查连接\nif (!$con) {\n    die(\"Connection failed:\
    \ \" . mysqli_connect_error());\n}\n\n// 创建数据库\n$sql = \"CREATE DATABASE dbName\"\
    ;\nif (mysqli_query($con, $sql)) {\n    echo \"Database created successfully\"\
    ;\n} else {\n    echo \"Error creating database: \" .mysqli_error($con);\n}\n\
    mysqli_close($con);\n?>\n```\n\n现在我们已经创建了数据库，可以继续在数据库中创建一个表。该表将包含数据的列和行。为了做到这一点，我们必须理解\
    \ MySQL 查询语言的工作原理。同样，我们将在阅读和练习的过程中逐渐熟悉它。在这种情况下，查询字符串为：\n\n```sql\nCREATE TABLE\
    \ Employee_table (\nid INT(6) UNSIGNED AUTO_INCREMENT PRIMARY KEY,\nfirstname\
    \ VARCHAR(30) NOT NULL,\nlastname VARCHAR(30) NOT NULL,\nemail VARCHAR(50),\n\
    birth_date TIMESTAMP\n```\n\n现在这看起来很复杂，其实非常简单——记住；如果你忘记了任何语法，可以随时参考文档，因为文档详尽且易于阅读。如所示，每个表都应该有一个主键列（在本例中为\
    \ `ID`），它的值会随表中的每个新记录或行而改变。\n\n创建表的第一个元素是使用 `CREATE TABLE` 关键字并对其进行命名。接下来，我们使用普通括号来包围我们想要添加到表的所有不同列。要实现这一点，我们只需命名我们想要添加的列，然后添加我们希望它的数据类型。稍后我会列出所有数据类型，在此之前，让我们先看看数据类型之后编写的内容：\n\
    \n在数据类型之后，你可以为每列列指定其他属性（可选）：\n\n- `NOT NULL` - 每个段都必须包含该区域的值，不允许无效属性。\n- `DEFAULT`\
    \ - 设置在没有传递其他值时包含的默认值。\n- `UNSIGNED` - 用于数字排序，强制将设置的数据为正数和零。\n- `AUTO INCREMENT`\
    \ - 每当包含另一个记录时，MySQL 实际上会将该字段的估值增加 1。\n- `PRIMARY KEY` - 用于在表上唯一地识别部分。设置了 `PRIMARY\
    \ KEY` 的部分通常是一个 ID 数字，并且会被频繁使用。\n\n现在实际上在数据库中实现表的创建，以下是代码中的实现方式：\n\n### 对象格式示例\n\
    \n```php\n<?php\n$server_name = \"localhost\";\n\n$username = \"username\";\n\
    $password = \"password\";\n$dbname = \"dbName\";\n\n// 连接\n$con = new mysqli($server_name,\
    \ $username, $password, $dbname);\n\n// 检查连接\nif ($con->connect_error) {\n   \
    \ die(\"Connection failed: \" . $con->connect_error);\n}\n$sql = \"INSERT INTO\
    \ Employee_table (firstname, lastname, email)\nVALUES ('Bob', 'Doe', 'bob@hotmail.com')\"\
    ;\n$con->close();\n?>\n```\n\n### 非对象格式示例\n\n```php\n<?php\n$server_name = \"\
    localhost\";\n\n$username = \"username\";\n$password = \"password\";\n$dbname\
    \ = \"dbName\";\n\n// 连接\n$con = mysqli_connect($server_name, $username, $password,\
    \ $dbname);\n\n// 检查连接\nif (!$con) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\n$sql = \"INSERT INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob',\
    \ 'Doe', 'bob@hotmail.com')\";\nmysqli_close($con);\n?>\n```\n\n## SQL 数据类型\n\n\
    现在，是 MySQL 中使用的以下数据类型：\n\n- **Text**: 用于内容或内容与数字的混合。最大 255 个字符。\n- **Memo**: Memo\
    \ 用于较大规模的内容。最多 65,536 个字符。注意：你不能对备注字段排序。在任何情况下，它们都是可的。\n- **Byte**: 允许 0 到 255\
    \ 的之间的整数（1 字节）。\n- **Integer**: 允许 -32,768 到 32,767 之间的整数（2 字节）。\n- **Long**:\
    \ 允许 -2,147,483,648 到 2,147,483,647 之间的整数（4 字节）。\n- **Single**: 精确点。将处理大多数小数（4\
    \ 字节）。\n- **Double**: 浮点数。将处理大多数小数（8 字节）。\n- **Currency**: 用于现金。持有多达 15 位美元，外加\
    \ 4 位小数（8 字节）。\n- **AutoNumber**: 给每个记录分配一个它自己的编号，通常从 1 开始（4 字节）。\n- **Date/Time**:\
    \ 用于日期和时间（8 字节）。\n- **Yes/No**: 逻辑字段可以显示为 Yes/No、True/False 或 On/Off。在代码中，利用常量\
    \ True 和 False（对应于 -1 和 0）。注意：Yes/No 字段中不允许 Null 属性（1 位）。\n- **Ole Object**: 可以存储图片、声音、功能或高达\
    \ 1GB 的不同 `BLOBs`。\n- **Hyperlink**: 包含到不同记录的连接，包括页面。\n- **Lookup Wizard**: 允许你编写选择列表，然后可以下拉列表（4\
    \ 字节）。\n\n## SQL 基础排序\n\n在 MySQL 中有三种基础排序：内容、数字和 Date/Time 排序。\n\n- `CHAR(size)`:\
    \ 持有一个修改后的字符串（可以包含字母、数字和特殊字符）。修改后的尺寸在括号中指定。可以存储 255 个字符。\n- `VARCHAR(size)`: 持有一个变长度字符串（可以包含字母、数字和特殊字符）。最大尺寸在括号中指定。可以存储\
    \ 255 个字符。注意：如果你放入大于 255 的值，它将变为 `TEXT` 排序。\n- `TINYTEXT`: 持有一个最大长度为 255 个字符的字符串。\n\
    - `TEXT`: 持有一个最大长度为 65,535 个字符的字符串。\n- `BLOB`: 用于 `BLOBs`（二进制大对象）。持有 65,535 字节的信息。\n\
    - `MEDIUMTEXT`: 持有一个最大长度为 16,777,215 个字符的字符串。\n- `MEDIUMBLOB`: 用于 `BLOBs`（二进制大对象）。持有高达\
    \ 16,777,215 字节的信息。\n- `LONGTEXT`: 持有一个最大长度为 4,294,967,295 个字符的字符串。\n- `LONGBLOB`:\
    \ 用于 `BLOBs`（二进制大对象）。持有高达 4,294,967,295 字节的信息。\n- `ENUM(x,y,z,etc.)`: 允许你输入属性列表。你可以在\
    \ `ENUM` 列表中列最多 65535 个属性。如果嵌入了不在列表中的属性，将嵌入空值。注意：属性按照你输入的顺序排序。你以这种组织方式输入可能的值：`ENUM('X','Y','Z')`。\n\
