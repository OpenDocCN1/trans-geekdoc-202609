    真正的编程发生在大脑的逻辑部分。这与你学习任何其他语言相似，例如学习英语。你可能理解语法规则和惯例，如在句末加句号，但能够写出清晰、逻辑化、深思熟虑且结构化的文章才是真正的技能所在。这一概念同样适用于编程，编写代码的人必须知道如何运用他对所用语言（如
    `PHP`）规则的知识，并利用它为自己服务，编写出整洁的程序。


    对编程的知识和理解确实是伟大的，因为它是最接近“力量”的东西。你可以字面面上从一个空白的记事本从零开始创建某些东西，并让它运行你想要实现的功能。无论是创建一个分析股市并做出预测的机器人，还是创建一个游戏。这个选择权属于你。


    在这份指南中，你学习了 `PHP` 的基础知识。你还没有学习该语言中可以使用的所有可能的方法，但这并不是重点。本指南的目的是引导你开启一段旅程，去发现你所需的类和方法，帮助你创建你理想的程序。你已经获得了理解阅读
    API 的最佳知识，能够理解它所表达的内容并添加到你的代码中。


    祝你作为一名新手 `PHP` 程序员之路好运！


    Eprogramy


    附：还有一件事。在 Eprogramy，我们想送你一份礼物。如果你像我们一样喜欢 `JavaScript`，那么你可能也会喜欢 `Java`。因此，在下一节中，你将看到我们的“JAVA
    速成课程 - 12 小时内学习 Java 编程的终极入门课程”的预览。


    我知道你会喜欢的！


    你可以在亚马逊上找到它，就在我们 Eprogramy 的名下，或者点击这个链接：


    ![](http://www.amazon.com/Java-Ultimate-Beginners-Learning-Programming-ebook/dp/B00Y96U1D2)


