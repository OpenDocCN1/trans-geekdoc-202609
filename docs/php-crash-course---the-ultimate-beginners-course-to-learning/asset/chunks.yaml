    \ way, here are some expressions and their values.\n\n7 \\* (3 % 2) =  7\n\n(8\
    \ - 1.3) \\* 6 - 8 / (0 - 4) = 62\n\nKeywords are the next division of programming.\
    \ There are many, which we will get around to as we learn different parts of programming.\
    \ Some common ones are “$”, “for”, “while”, “return”, “function”, and “break”.\
    \ The computer looks for these special words to perform specific actions within\
    \ your code. That is a very generic description, but they have a very broad range.\
    \ Be wary of writing them down when you do not mean to use it. If used improperly,\
    \ it can not only cause mistakes in code execution, but can simply make your code\
    \ not run at all due to an error in syntax. \n\nStatements are the next division\
    \ of programming. Statements always end in a semicolon (except in very specific\
    \ circumstances). Notice that console.log ends in a semicolon, and therefore is\
    \ a statement. This is indicative of the fact that console.log is a function,\
    \ but we’ll get to that.\n\nLet’s begin with a very common and important statement.\
    \ This has to do with variables. Variables are values that are stored inside memory\
    \ for reuse later in your code, often several times. Variables let us give names\
    \ to stored values. Imagine variables like a box, specifically a moving box. When\
    \ you get the box out, you write the name of it on the side of the box so you\
    \ can know what should be inside the box. This is called variable declaration.\
    \ You are pulling out memory (the box), giving it a variable name (writing on\
    \ the side of the box), and also telling it where the box should be, or rather\
    \ what kind of “scope” the variable has, but we’ll come back to that. \n\n## The\
    \ Arithmetic Operators\n\n### Addition\n\n5+5 = 10\n\n$x = 5;\n\n$y = 5;\n\n$sum\
    \ = 0;\n\n$sum = $x.$y;\n\nIn the example above, a variable of sum is taking the\
    \ addition of two variables (x and y) and adding them together to produce the\
    \ value of 10.\n\n### Subtraction\n\n10-5 = 5\n\n$x = 10;\n\n$y = 5;\n\n$total\
    \ = 0;\n\n$total= $x - $y;\n\nIn the example above, a variable of total is taking\
    \ the subtraction of two variables (x and y) and subtracting them together to\
    \ produce the value of 5.\n\n### Multiplication\n\n5\\*4 = 20\n\n$x = 5;\n\n$y\
    \ = 4;\n\n$total = 0;\n\n$total= $x \\* $y;\n\nIn the example above, a variable\
    \ of total is taking the multiplication of two variables (x and y) and multiplying\
    \ them together to produce the value of 20.\n\n### Division\n\n20/5 = 4\n\n$x\
    \ = 20;\n\n$y = 5;\n\n$total = 0;\n\n$total= $x / $y;\n\nIn the example above,\
    \ a variable of total is taking the division of two variables (x and y) and dividing\
    \ them together to produce the value of 20.\n\n### Modules\n\n7 % 2 = 1\n\n$x\
    \ = 7;\n\n$y = 2;\n\n$total = 0;\n\n$total= $x % $y;\n\nIn the example above,\
    \ a variable of total is taking the remainder of two variables (x and y) and by\
    \ finding how many times 2 multiplies in to 7 evenly before it can’t, and the\
    \ remainder is the output. For example:\n\nHow many times does 2 get in to 7?\n\
    \n3 times.\n\n2 \\* 3 = 6\n\n7 - 6 = 1\n\nTherefore, 7 modules 2 is equal to 1\
    \ because that is the remainder.\n\n### Post-Incrementation\n\n5.1 = 6\n\n$x =\
    \ 5;\n\nx++;\n\n$y = 0;\n\n$y = $x++;\n\nIn the example above, a variable of x\
    \ is being incremented by the value of 1. Therefore, the value of x must now be\
    \ 6 because x.1 = 6 as $x = 5. If you were to print out the value of x, the output\
    \ would be 6. You can do x++ again and the value would then become 7. The value\
    \ of y on the other hand is still 6 because it is post incrementing meaning that\
    \ the value of x has changed by an increment of 1 (to 7), but the value of y has\
    \ yet to be changed until it is called again (y = x++) which in the case would\
    \ be y = 7.\n\n### Pre-Incrementation\n\n5.1 = 6\n\n$x = 5;\n\n++$x;\n\n$y = 0;\n\
    \n$y = ++$x;\n\nIn the example above, a variable of x is being incremented just\
    \ like it was when it was post-incrementing as a variable by itself. The value\
    \ of y on the other hand changes directly to 6 because it is pre-incrementing\
    \ meaning that the value of x has changed by an increment of 1, and the value\
    \ of y changes, meaning that y = 7.\n\n### Post-Decrementing\n\n5 - 1 = 4\n\n\
    $x = 5;\n\nx--;\n\n$y = 0;\n\n$y = $x--;\n\nIn the example above, a variable of\
    \ x is being decremented by the value of 1. Therefore, the value of x must now\
    \ be 4 because x - 1 = 4 as before $x = 5. If you were to print out the value\
    \ of x, the output would be 4. You can do x-- again and the value would then become\
    \ 3. The value of y on the other hand is still 4 because it is post decrementing\
    \ meaning that the value of x has changed by a decrement of 1, but the value of\
    \ y has yet to be changed until it is called again (y = x--) which in the case\
    \ would be y = 3.\n\n### Pre-Decrementing\n\n5 - 1 = 4\n\n$x = 5;\n\n\\--x;\n\n\
    $y = 0;\n\n$y = --$x;\n\nIn the example above, a variable of x is being decremented\
    \ by the value of 1. Therefore, the value of x must now be 4 because x - 1 = 4\
    \ as before $x = 5. If you were to print out the value of x, the output would\
    \ be 4. You can do --x again and the value would then become 3. The value of y\
    \ on the other hand is 3 because it is pre decrementing meaning that the value\
    \ of x has changed by a decrement of 1, and the value of  y has changed.\n\n##\
    \ The Assignment Operators\n\nThe assignment operators are operators that are\
    \ used when assigning variables values, the most commonly used operator being\
    \ (=). Here are a list of examples:\n\nEqual Sign: =\n\n              $x = 5;\n\
    \n              In this example, if you were to print out x, the value would be\
    \ 5 because you assigned the variable x equal to 5.\n\nAdd-Equal Sign: +=\n\n\
    $x = 5;\n\n              $x += 5;\n\nIn this example, if you were to print out\
    \ x, the value would be 10 because you are adding the value of 5 on to the value\
    \ of x. This statement is the same thing as saying $x = x.5 → x += 5.\n\nSubtract-Equal\
    \ Sign: -\\=\n\n$x = 5;\n\n              $x -= 5;\n\nIn this example, if you were\
    \ to print out x, the value would be 0 because you are subtracting the value of\
    \ 5 from the value of x. This statement is the same thing as saying $x = x - 5\
    \ → x -= 5.\n\nMultiplication-Equal Sign: -\\=\n\n$x = 5;\n\n              $x\
    \ \\*= 5;\n\nIn this example, if you were to print out x, the value would be 25\
    \ because you are multiplying the value of 5 on to the value of x. This statement\
    \ is the same thing as saying $x = x \\* 5 → x \\*= 5.\n\nDivision-Equal Sign:\
    \ -\\=\n\n$x = 5;\n\n              $x /= 5;\n\nIn this example, if you were to\
    \ print out x, the value would be 1 because you are dividing the value of 5 on\
    \ to the value of x. This statement is the same thing as saying $x = x / 5 → x\
    \ /= 5.\n\nModules-Equal Sign: -\\=\n\n$x = 5;\n\n              $x %= 5;\n\nIn\
    \ this example, if you were to print out x, the value would be 0 because you are\
    \ finding the remainder in (5/5). This statement is the same thing as saying $x\
    \ = x % 5 → x %= 5.\n\nAnother important thing to understand when working with\
    \ numbers in PHP is that it matters how you declare your number. If you declare\
    \ it with a decimal value, when you divide it, it will output as a decimal number\
    \ if it doesn’t divide by two evenly, while if you declare it with an integer\
    \ value (whole number) it will divide by two and round down if it divides unevenly.\n\
    \nFor example:\n\n$numberWithDecimal = 5.5;\n\n$wholeNumber = 5;"
