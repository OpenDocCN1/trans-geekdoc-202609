  trans: "\n\n为了解释上述每个功能：我们做的第一件事是创建一个名为 `setStudentName` 的函数，它接受一个变量名为 `$name` 的参数，然后将类变量\
    \ `$studentName` 设置为输入的变量名。接着，我们的下一个函数思路与上一个方法相同，只是它允许老师输入学生的平均分。然后，我们将类变量赋值为输入到函数中的变量。最后，为了获取变量的值，我们创建一个名为\
    \ `getStudentName` 的函数，它只需返回类中 `$studentName` 变量的值。我们对 `getStudentAverage` 函数应用了相同的理念，它只需返回类中变量\
    \ `$average` 的学生平均分。\n\n现在，为了实际引用该类及其变量/方法，我们必须在类定义之外的 PHP 执行代码中使用特殊语法。为了引用一个类，我们必须创建一个对象，对象基本上是一个持有类的变量，因为类可以被视为一个对象，因为它包含了函数/属性/变量，使其具有独特性。为了实际创建这个对象，我们必须使用\
    \ `new` 关键字，它基本上在任何声明类/对象时使用。例如：\n\n```php\n<?php\nclass Marks {\n    var $studentName;\n\
    \    var $average;\n    function setStudentName($name) {\n        $studentName\
    \ = $name;\n    }\n    function setStudentAverage($avg) {\n        $average =\
    \ $avg;\n    }\n    function getStudentName() {\n        return $studentName;\n\
    \    }\n    function getStudentAverage() {\n        return $average;\n    }\n\
    }\n// $objectName = new Marks(); 类声明的示例结构\n?>\n```\n\n现在，为了创建这个对象，我们将执行以下操作：\n\
    \n```php\n<?php\nclass Marks {\n    var $studentName;\n    var $average;\n   \
    \ function setStudentName($name) {\n        $studentName = $name;\n    }\n   \
    \ function setStudentAverage($avg) {\n        $average = $avg;\n    }\n    function\
    \ getStudentName() {\n        return $studentName;\n    }\n    function getStudentAverage()\
    \ {\n        return $average;\n    }\n}\n$marksObject = new Marks();\n?>\n```\n\
    \n现在我们已经知道如何引用类了，那么如何引用类内部的内容呢？我们使用一个连字符和一个指向右侧的箭头（->）来表示对象到达某个变量/函数必须经过的路径。例如：\n\
    \n```php\n<?php\nclass Marks {\n    var $studentName;\n    var $average;\n   \
    \ function setStudentName($name) {\n        $studentName = $name;\n    }\n   \
    \ function setStudentAverage($avg) {\n        $average = $avg;\n    }\n    function\
    \ getStudentName() {\n        return $studentName;\n    }\n    function getStudentAverage()\
    \ {\n        return $average;\n    }\n}\n$marksObject = new Marks();\n// 我想让 marksObject\
    \ 引用 $studentName 并将其输出……\n?>\n```\n\n为了实际实现，你必须执行以下操作：\n\n```php\n<?php\nclass\
    \ Marks {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n      \
    \  return $studentName;\n    }\n    function getStudentAverage() {\n        return\
    \ $average;\n    }\n}\n$marksObject = new Marks();\necho ($marksObject -> studentName);\n\
    ?>\n```\n\n在上面的代码中，`$marksObject` 引用了 `studentName` 变量而没有美元符号，因为你不需要使用它。我们告诉类引用其内部的变量名\
    \ `studentName` 并将其输出。但由于 `studentName` 还没有由用户设置，它将无法输出正确的值。你可能想到的另一个问题是，如果我们直接引用变量\
    \ `studentName` 而不是使用函数来获取值，那么我们为什么还要创建一个函数来做这件事呢？嗯，其实并没有特殊理由——这仅仅是一种惯例，也是为了演示目的，向你展示类和函数如何协同工作的概念。\n\
    \n现在，为了实际引用一个函数，你与引用变量时的操作是相同的，但这次你需要在所引用的内容末尾加上括号，以指定你指向的是函数而不是变量名。\n\n```php\n\
    <?php\nclass Marks {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n      \
    \  return $studentName;\n    }\n    function getStudentAverage() {\n        return\
    \ $average;\n    }\n}\n?>\n```\n\n"
