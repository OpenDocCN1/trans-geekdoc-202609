    \ Loop and a do-while Loop work.\n\n### While Loop\n\nThe only difference with\
    \ a while Loop compared to a for Loop is that it only carries the condition of\
    \ the Loop, and not the variable. Therefore, you must actually declare the variable\
    \ outside of the scope of the Loop before affecting it in the Loop to carry out\
    \ a certain condition. \n\nFor example:\n\n              $x = 0;\n\nwhile ($x\
    \ < 10) {\n\n              echo(“Current number: “.$x);\n\n              $x++;\n\
    \n}\n\nIn the example above, as seen, a while Loop simply checks for a condition\
    \ and when it has been met, runs the block of code, and then affects the variable\
    \ x so it goes back to checking the condition when the block of code is done executing,\
    \ and simply continues to do it until x is not less than 10. The output for this\
    \ is the same as the for Loop output:\n\nCurrent Number: 0\n\nCurrent Number:\
    \ 1\n\nCurrent Number: 2\n\nCurrent Number: 3\n\nCurrent Number: 4\n\nCurrent\
    \ Number: 5\n\nCurrent Number: 6\n\nCurrent Number: 7\n\nCurrent Number: 8\n\n\
    Current Number: 9\n\nThere are things that can go wrong with this while Loop like\
    \ the accidental creation of an infinite Loop. For example:\n\n$x = 0;\n\nwhile\
    \ ($x < 10) {\n\n              echo(“Current number: “.$x);\n\n}\n\nIn the above\
    \ example, it is doing exactly everything the previous Loop was doing except the\
    \ output (which is to alert a certain piece of text) would be infinitely displaying\
    \ because the variable x is never being affected. \n\nThe final type of Loop we\
    \ will be covering is the do-while Loop. This Loop does everything the while Loop\
    \ does, except it does something at least once regardless of the condition before\
    \ resorting to depending on the condition.\n\nFor example:\n\n$x = 0;\n\ndo {\n\
    \n              echo(“Current number: “.$x);\n\nx++;\n\n} while ($x < 10)\n\n\
    The above example simply runs the iteration of the block of code at least once\
    \ regardless of the condition that is given at the end before actually testing\
    \ the condition. This can be useful if you ever wanted a Loop to do something,\
    \ except at least do it once before checking the condition.\n\n### Continue Keyword\n\
    \nThe continue keyword is used when you want to skip an iteration of a Loop. For\
    \ example:\n\n              $x = 0;\n\n              while ($x < 10) {\n\n             \
    \               if ($x == 5) {\n\n                                          continue;\n\
    \n}\n\n                            echo($x);\n\n}\n\nIn the above example, we\
    \ are checking if x is equal to 5, if it is then what we do is skip the iteration\
    \ of the Loop, meaning the output of this Loop then becomes:\n\nCurrent Number:\
    \ 0\n\nCurrent Number: 1\n\nCurrent Number: 2\n\nCurrent Number: 3\n\nCurrent\
    \ Number: 4\n\nCurrent Number: 6\n\nCurrent Number: 7\n\nCurrent Number: 8\n\n\
    Current Number: 9\n\nAs seen in the output above, the Loop skips 5 because it\
    \ was told to skip that iteration of the Loop before it even had the chance to\
    \ alert the number out.\n\n### Break Keyword\n\nThe continue keyword is used when\
    \ you want to break out of the Loop. For example:\n\n              $x = 0;\n\n\
                  while ($x < 10) {\n\n                            if ($x == 5) {\n\
    \n                                          break;\n\n}\n\n                           \
    \ echo($x);\n\n}\n\nIn the above example, we are checking if x is equal to 5,\
    \ if it is then what we do is break out of the Loop, meaning the output of this\
    \ Loop then becomes:\n\nCurrent Number: 0\n\nCurrent Number: 1\n\nCurrent Number:\
    \ 2\n\nCurrent Number: 3\n\nCurrent Number: 4\n\nAs seen in the output above,\
    \ the Loop breaks out once it reaches the fifth iteration meaning, to essentially\
    \ stop the Loop from continuing on any further.\n\nIf we combine the conceptual\
    \ understanding of Loops and arrays, we can come up with complex code - that is\
    \ why we will be learning arrays, before we look at a real-world application where\
    \ this may be useful to use so you can gain a better understanding of why Loops\
    \ and arrays are helpful. You will be using Loops and arrays a lot when programming\
    \ even if it doesn’t seem like it right now.\n\n## Arrays\n\nArrays in programming\
    \ are helpful because it allows you to create lists of strings/numbers/objects\
    \ or whatever data type you can think of. Again, this might not be apparent at\
    \ first but will be when you start to program and realize that you may need to\
    \ use arrays in certain instances. So an array is basically a single variable\
    \ that holds multiple values that can be accessed individually. Let’s go over\
    \ the syntax of how an array declaration would work.\n\nIn order to declare a\
    \ variable, you must do the following:\n\n              $names = array( “John”,\
    \ “Bob”, “Tom”);\n\nIn the example above, what we are doing is declaring a variable\
    \ with the name of names, and then we are assigning it a list of values, which\
    \ are of string type. So in order to assign values to the array, we added array()\
    \ which simply set the boundaries for the array. Then, we noted that the array\
    \ type is string by surrounding each element by quotation marks and then adding\
    \ a comma in between each element to indicate that it is a different element in\
    \ the array.\n\nIn order to access specific element values from the array, we\
    \ use the following syntax:"
