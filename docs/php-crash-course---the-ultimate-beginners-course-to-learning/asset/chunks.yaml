    \ $a = 20;\n\n$b = 20;\n\nif ($a == 20 && $a == $b) {              \n\necho(\"\
    a is equal to 20 and b \");\n\n}\n\nelse {              \n\necho(\"a is not equal\
    \ to 20 or a is not equal to b\");\n\n}\n\nIn this Example, we check to see if\
