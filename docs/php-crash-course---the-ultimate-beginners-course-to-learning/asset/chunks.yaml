    \ are incredibly useful, especially when your code becomes exceedingly lengthy.\
    \ Rather than have similar code all throughout your code, you could use a function\
    \ to only have the code written out once, and called where it needs to run. Functions\
    \ also allow us to make code clearer just as comments do, but in the form of the\
    \ function name. For example, say you have some hard-to-read or confusing code\
    \ that prints the output of your code. You could make a function called \"printOutput\"\
    . This makes it easier to read code, because instead a block of code, you have\
    \ a single line that just tells you what it's doing: printing the output.\n\n\
    Ex 1 (Basic function):\n\n<?php\n\n              function SaySomething() {  \n\
    \n echo \"Hello world!\";  \n\n                            }  \n\n             \
    \ SaySomething();\n\n?>\n\nEx 2 (Feeding two arguments):\n\n<?php\n\n             \
    \ function Birthday($name, $year) {  \n\n                  echo $name.\"Born in\"\
    .$year. \"<br>\";  \n\n              }  \n\n              Birthday(\"John\", 1987);\n\
    \n?>\n\nEx 3 (Default Argument Value):\n\n<?php\n\n              function SetFavoriteColor($color\
    \ = white) {  \n\n                                echo \"The color is : $color\
    \ <br>\";  \n\n              }  \n\n              SetFavoriteColor(\"Blue\");\
    \  \n\n              SetFavoriteColor(); // will use the default value of white\
    \  \n\n?>\n\nEx 4 (Returning Values):\n\n<?php\n\n              function Add($fNum,\
    \ $sNum) {  \n\n                  $sum = $fNum + $sNum;  \n\n                 \
    \ return $sum;  \n\n              }  \n\n              echo \"5 + 10 = \".(Add(5,10));\n\
    \n?>\n\nNext, let’s talk about classes or objects:\n\nA class is simply a section\
    \ filled with functions, more often than not, similar functions bunched up together\
    \ with a similar purpose within a section that can then be referred to and called.\
    \ Think of the class as a parent directory to a function within that class as\
    \ a sub directory. This can be used to organize your code and refer to different\
    \ classes which handle different branches of functions.\n\nIn order to create\
    \ a class, we must use the class keyword followed by the class name which is then\
    \ followed by an opening brace and a closing brace.\n\nClass ClassName {\n\n             \
    \ // contents of class here\n\n}\n\nNot only can there be functions in a class,\
    \ but there can also be variables in a class that can be referred to. Let’s start\
    \ out by making two random variables and sticking it in the class just for example\
    \ purposes. Let’s also call our class Marks as we will be working with manipulating\
    \ student marks when a teacher inputs them, as a real world application to object\
    \ oriented use. One thing to note is that when creating global variables in your\
    \ class, they must start with the “var” keyword to signify that they are indeed\
    \ a class variable. Ofcourse outside of classes, this term doesn’t need to be\
    \ used. For example:\n\nclass Marks {\n\n              var $studentName;\n\n             \
    \ var $average;\n\n}\n\nIn the code above, the first thing that happens is we\
    \ create a global class variable named studentName and declare it but not yet\
    \ assign it. We do the same for average. The goal for the following variables\
    \ is to essentially allow the teacher to input a student name and then input the\
    \ average the student received. Then, the teacher is able to retrieve these values\
    \ at any time he wants. A real world application of this would have an interface\
    \ but I’m going to show you a skeleton of the functionality.\n\nclass Marks {\n\
    \n              var $studentName;\n\n              var $average;\n\n             \
    \ function setStudentName($name) {\n\n                            $studentName\
    \ = $name;\n\n              }\n\n              function setStudentAverage($avg)\
    \ {\n\n                            $average = $avg;\n\n              }\n\n             \
    \ function getStudentName() {\n\n                            return $studentName;\n\
    \n              }\n\n              function getStudentAverage() {\n\n             \
    \               return $average;\n\n              }\n\n}"
