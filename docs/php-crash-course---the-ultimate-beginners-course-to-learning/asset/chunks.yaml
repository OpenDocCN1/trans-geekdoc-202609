  trans: "\n\n# “<p>”标签的示例\n\n```html\n<html>\n  <head>\n    <title> “<p>”标签的示例 </title>\n\
    \  </head>\n  <body>\n    <h1> 这是一个标题。</h1>\n  </body>\n</html>\n```\n\n上述示例中使用的\
    \ `<h1>` 标签的作用仅仅是将其包含的文本进行**加粗**并放大。你将要用到的所有标签的属性都可以通过 CSS 进行编辑，而我们很快就会学习到这部分内容。\n\
    \n这里有一个同时使用我们已经学过的两个标签的示例，并展示了输出结果。请注意，一旦你创建了包含 HTML 的文件，必须以 `.html` 扩展名保存该文件。然后你可以打开该文件并使用你选择的浏览器打开它进行测试。\n\
    \n```html\n<html>\n  <head>\n    <title> “<p>”标签的示例 </title>\n  </head>\n  <body>\n\
    \    <h1> 这是一个标题。</h1>\n  </body>\n</html>\n```\n\n输出：\n\n![`lh4.googleusercontent.com/VNQxDcrXmEWh9xtMPONP15Kin9EwzHCIOuLVJnwN5qPMwfwl3srEFNUzO8WgBBmOsD7ejN1WUfBG6UPE763FLlZghEOFEG58K-eepDLp1VE-T6tbZZRaV631EeavzkJiIrbJCn4`](img/00003.jpeg)\n\
    \n最后，让我们来看一下 HTML 中注释的概念。你有时想编写某些代码但并不恰恰将其打印到屏幕上，只是想解释你正在执行的操作，或者在代码中添加提醒，而不让它在网页浏览器中显示，这样用户就看不到它。\n\
    \n你可以通过以 `<!--` 开始注释并以 `-->` 结束来进行注释。因此，如果我想注释某一行，我会对一个正常的段落如下操作：\n\n```html\n\
    <p> 这是一个段落文本 </p>\n<!-- 这一行打印出一个显示“这是一个段落文本”的段落 -->\n```\n\n有标签，也有属性，属性包含值，这些值被用于决定标签的内容如何显示，或者被\
    \ CSS 或 PHP 如何解释。在学习 PHP 和 CSS 时需要注意的两个重要属性是：`id` 和 `class`。你可以将它们用于任何适当的标签上，例如\
    \ `<body>` 标签内的 `<p>` 标签。\n\n属性的工作格式如下：\n\n```html\n<p id = \"content\"> 这是网页的内容。\
    \ </p>\n```\n\n如示例所示，为了声明一个属性，你必须在第一个标签（即 `<p>`）中留出空间，然后命名已知的属性，例如 `id`。然后为了给它赋值值，你必须有一个等号，然后是引号以及引号内的值。在这种情况下，此段落包含了属性\
    \ `id=\"content\"` —— 这可以通过你将要学习的选择器，作为 CSS 和 PHP 等语言的引用。\n\nHTML 中仍然有许多你可以学习的标签，但这些是你开始编写代码时需要的基础标签。此外，你还应该理解\
    \ HTML 文档的基本结构。让我们回顾一下：\n\n- `<html>` 和 `</html>` 定义了 HTML 文档，标签本身定义了其中的内容，以便浏览器能够对其进行解析。\n\
    - `<head>` 和 `</head>` 提供有关文档的信息并初始化任何外部脚本或样式表。\n- `<title>` 和 `</title>` 仅仅提供给浏览器显示\
    \ HTML 文档的标题。\n- `<body>` 和 `</body>` 容纳文档的所有内容，包括段落、导航栏、图像等。\n- `<h1>` 和 `</h1>`\
    \ 定义一级标题。\n\n"
- fmt: "\n```html\n</style>\n</head>\n<body>\n    <h1> This is Header text</h1>\n\
    \    <p id=\"content\"> This is the content of the webpage. </p>\n</body>\n</html>\n\
    ```\n\nIn order to start coding CSS in an HTML document, you must use the `style`\
    \ tag with the help of the `type` attribute which references to the standard convention\
    \ `text/css` which you must use every time you want to write CSS in your HTML\
    \ document. Within this `style` tag, is your CSS code which references successfully\
    \ to all `p` tags in the HTML document. Well, what if you’d like to only reference\
    \ a specific paragraph?\n\nNow the reason I like to call `p` as a selector instead\
    \ of a tag is because the term selector is a general term and what can be put\
    \ in the position of `p` is also general. Instead of putting an actual tag that\
    \ is being referenced in the HTML document, you are able to reference an `id`\
    \ by using a hashtag and then the `id` name accordingly:\n\n```css\n#idname {\n\
    \    color: red;\n    font-size: 12px;\n}\n```\n\nYou can also use the selector\
    \ to reference a tag with a `class` attribute with a certain name. For example:\n\
    \n```css\n.classname {\n    color: red;\n    font-size: 12px;\n}\n```\n\nNow you\
    \ must be wondering why `id` or `class` could ever become helpful. Let me enlighten\
    \ you with the following sample code:\n\n```html\n<html>\n    <head>\n       \
    \ <title> This the webpage title </title>\n        <style type=\"text/css\">\n\
    \            #content {\n                color: red;\n                font-size:\
    \ 14px;\n            }\n        </style>\n    </head>\n    <body>\n        <h1>\
    \ This is Header text</h1>\n        <p id=\"content\"> This the content of the\
    \ webpage. </p>\n    </body>\n</html>\n```\n\nIn the above example, you can see\
    \ that we listed a specific paragraph to be affected by the change we listed in\
    \ the CSS within the `head` tag. This is one way that you can use the `id` selector.\
    \ To use the `class` selector (not really a big difference, just preferences)\
    \ is to do the following:\n\n```html\n<html>\n    <head>\n        <title> This\
    \ the webpage title </title>\n        <style type=\"text/css\">\n            .content\
    \ {\n                color: red;\n                font-size: 14px;\n         \
    \   }\n        </style>\n    </head>\n    <body>\n        <h1> This is Header\
    \ text</h1>\n        <p class=\"content\"> This is the content of the webpage.\
    \ </p>\n    </body>\n</html>\n```\n\nIn the code above, instead of using a hashtag\
    \ symbol to select a specific attribute with a specified `id` name, but rather\
    \ a `class` name this time. Using this knowledge of selectors, we can reference\
    \ specific HTML elements using `PHP` and use that to manipulate the tags by adding\
    \ attributes or changing the content within the tags and making them dynamic to\
    \ user interaction.\n\nIn CSS, there are different ways to actually implement\
    \ the styling language into the HTML. I have already showed you one way, which\
    \ is to have it in the `head` tag with a `style` tag. Well, there are three different\
    \ types of ways to implement CSS, one way is inline, other way is internal, which\
    \ is the way we did it and the other way is to do it externally. The way we did\
    \ it directly in the `head`, internally. To make it external, instead of having\
    \ the CSS code within the tags, we have the `style` tag reference a file that\
    \ contains all the CSS code.\n\nLet’s simply look at examples of how each way\
    \ works. Remember, if you reference a certain file, like a CSS one in this instance,\
    \ if you don’t list the direct directory path (e.g. `C:\\Program Files (x86)\\\
    Crazybump`) and just the name, then it will resort to looking at the root directory\
    \ your HTML file which is referencing is in.\n\n### External CSS\n\nFilename:\
    \ `Learn.html`\n\n```html\n<html>\n    <head>\n        <title> This the webpage\
    \ title </title>\n        <link rel=\"stylesheet\" type=\"text/css\" href=\"pageStyle.css\"\
    ><!-- This is the line used in the head to reference an external file -->\n  \
    \  </head>\n    <body>\n        <h1> This is Header text</h1>\n        <p id=\"\
    content\"> This is the content of the webpage. </p>\n    </body>\n</html>\n```\n\
    \n```css\npageStyle.css\n#content {\n    color: red;\n    font-size: 14px;\n}\n\
    ```\n\nNow, since we’ve already gone over internal and external CSS, we can look\
    \ at inline. This is not a big difference, just preferences:\n\n```html\n<p style=\"\
    color: red; font-size: 14px;\" id=\"content\"> This is the content of the webpage.\
    \ </p>\n```\n\nThis above is an example:\n\n```html\n<html>\n    <head>\n    \
    \    <title> This the webpage title </title>\n    </head>\n    <body>\n      \
    \  <h1> This is Header text</h1>\n        <p class=\"content\"> This is the content\
    \ of the webpage. </p>\n    </body>\n</html>\n```\n"
