  trans: "\n\n```php\necho($names[0]);\n```\n\n在上面的示例中，我们正在做的是输出数组索引为 0 的值。在数组中，我们通过索引值来引用数组的值——而索引值从\
    \ 0 开始。因此，“John”是索引 0，“Bob”是索引 1，而“Tom”是索引 2。数组本身的长度为 3。为了获取数组的长度，我们使用以下属性：\n\n\
    ```php\necho(count($names));\n```\n\n由于通常的来说，数组都是对象（你稍后将学习到这意味着什么），它们拥有变量和函数，而长度是数组的一个属性，因此可以通过\
    \ `names` 变量来访问它，因为它是一个数组类型的变量。这段代码的输出将是 3，因为它会将数组的第一个元素计为 1，然后是 2，以此以此类推。\n\n\
    现在，假设我们想声明一个数组，但在代码的稍后部分之前不给它分配任何值。那么你可以执行以下操作：\n\n```php\n$names = [];\n$names[0]\
    \ = \"John\";\n$names[1] = \" Bob\";\n$names[2] = \"Tom\";\n```\n\n在上面的示例中，我们正在声明一个空数组，并准备向其中添加元素，我们通过引用一个尚不存在的索引并赋予它一个特定的值来实现。现在，我们可以引用\
    \ `names` 数组的索引并检索出分配给它的相应值。\n\n```php\necho($names[0]);\n```\n\n上面的示例现在返回“John”，因为它被赋值了字符串\
    \ John。需要注意的是点是，你可以简单地通过对想要覆盖的特定索引使用赋值运算符来覆盖索引值，然后赋予它其他值。\n\n声明 PHP 数组的另一种方法是执行以下操作：\n\
    \n```php\n// 声明带有键 (KEY) 和值 (VALUE) 的关联数组\n$students_array = array(\n    \"John\"\
    \ => \"84\",\n    \"Bob\" => \"87\",\n    \"Jane\" => \"91\",\n    \"Thomas\"\
    \ => \"94\",\n    \"Matthew\" => \"92\",\n    \"Peter\" => \"76\"\n);\n// 显示整个\
    \ students_array\necho \"John has an average of: \" . $students_array[\"John\"\
    ] . \".\";\nprint_r($students_array);\n```\n\n输出：\nJohn has an average of: 84\n\
    Array ([John] => 84 [Bob] => 87 [Jane] => 91 [Thomas] => 94 [Matthew] => 92 [Peter]\
    \ => 76)\n\n关联数组是一种持有键的数组，而键又持有值，要引用数组的值，你只需引用键的名字。这是声明关联数组的另一种方法：\n\n```php\n\
    <?php\n// 逐个赋值\n$cart_array[\"cereal\"] = \"5.00\";\n$cart_array[\"coffee beans\"\
    ] = \"2.50\";\n$cart_array[\"bananas\"] = \"3.50\";\n$cart_array[\"onion\"] =\
    \ \"1.00\";\n$cart_array[\"lettuce\"] = \"2.40\";\n$cart_array[\"tomato\"] = \"\
    1.00\";\necho \"John has an average of: \" . $students_array[\"John\"] . \".\"\
    ;\nprint_r($students_array);\nprint_r($cart_array);\n?>\n```\n\n输出：\nJohn has\
    \ an average of: 84\nArray ([John] => 84 [Bob] => 87 [Jane] => 91 [Thomas] =>\
    \ 94 [Matthew] => 92 [Peter] => 76)\n\n现在，拥有数组并能够存储姓名、社会安全号等大型数据库——这确实很棒——但想象一下尝试通过指定数组索引并检索值来手动打印所有这些值。嗯，让我们想想，如果我想从数组的多个索引值中打印多个值，那么我必须输出数组的所有索引，因此我得出结论，我可以使用循环（Loop）来影响索引变量，从而输出并检索数组的值。例如：\n\
    \n```php\n$names = array(\"John\", \"Bob\", \"Tom\");\nfor ($i = 0; $i < count($names);\
    \ $i++) {\n    echo($names[$i]);\n}\n```\n\n在上面的示例中，我们声明了一个名为 `names` 的变量，并带有三个值\
    \ \"John\"\"Bob\" 和 \"Tom\"——一旦数组变量被设置。我们正在循环 `i` 变量，直到它到达数组长度之前（数组中持有的元素数量），以便打印它们。然后，我们通过在数组名称旁边的括号中放置\
    \ `i` 来输出数组的索引值，以便引用特定索引，相应地打印名称。所以这段代码的输出将是：\n\nJohn\nBob\nTom\n\n通过我们对数组和循环的理解，已经成功地将它们的使用结合起来，输出数组中的所有元素。将循环和数组结合工作的概念只是你使用循环或数组来实现你所想要的事情的一种方法。编程的核心理念源于跳出框架思考，决定你如何操作数字、字符串以及语言的功能，以计算你想要实现的目标算法（算法：完成目标所需的一系列步骤）。\n\
    \n## 多维数组\n\n多维数组在编程中非常有用。它们实际上是嵌套在单个数组中的数组。每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
    \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
    \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
    \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
    \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
    \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
    \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
    \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
    \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
    \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
    \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
    \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
    \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n## 第 8 章：函数与类\n\n\
    函数是一段可以在程序中任何一点通过单行代码运行的代码块，并且你可以根据需要多次使用它。要创建一个函数，只需编写 `function`、一个变量名，然后是圆括号，紧接着是大括号，其中包含你的代码。\n\
    \n```php\nfunction printSomething() {\n    echo(\"Something I guess? don’t know...\"\
    );\n}\n```\n\n这是一个非常简单的函数。在普通括号之间，你可以放置变量名。这些被称为参数。这些参数允许你给代码提供值，从而可能产生不同的输出。\n\
    \n```php\nfunction printSomething($times) {\n    for($i = 0; $i < $times; $i++)\
    \ {\n        echo(\"Mum!\");\n    }\n}\n```\n\n这个函数使用一个名为 `times` 的变量，运行指定次数的循环，并在每个循环中打印“Mum!”。所以如果你运行这段代码并传入值\
    \ 7，“Mum!”将打印 7 次。你可以有任意数量的参数（尽管越少越好）。只需用逗号分隔每个变量名即可。\n\n```php\nfunction printSomething($times,\
    \ $whatToPrint) {\n    for($i = 0; $i < $times; $i++) {\n        echo($whatToPrint);\n\
    \    }\n}\n```\n"
- fmt: "\nThis function will print out whatever `whatToPrint` is set to for however\
    \ many times `times` is set. So how do we use this code? To make this code run,\
    \ simply type the function name, followed by brackets, which contain values, separated\
    \ by commas, which should relate to what the function is using it for. For example,\
    \ for our function, our first parameter is the `times` variable, so we should\
    \ only be putting a number as the value for our first parameter, specifically\
    \ a whole number (although in this case, whether the number is whole or not is\
    \ not important). As well, for the second parameter, we should put what we want\
    \ to print. This is called \"calling\" a function.\n\n```\necho(7.\"I like to\
    \ move it, move it!\");\n```\n\nWe can call our function as many times as we want,\
    \ whenever we want. Something interesting about functions is that you can use\
    \ functions as values when setting variables, and then call them from these variables.\
    \ The difference between calling a function, and using it as a value, is that\
    \ when calling a function, you use brackets with parameters in them, while when\
    \ using a function as a value, you do not place brackets.\n\n### Returning Values\n\
    \nAn important feature of functions is the fact that you can “return” values.\
    \ This means that the function will act as the returned value when called. To\
    \ return a value, simply use the `return` keyword, followed by a value. Here is\
    \ an example. To use the returned value, simply imagine the function call as being\
    \ the returned value.\n\n```php\nfunction calculateHalfCircumference($radius)\n\
    {\n    return 3.14*$radius;\n}\n\n$circumference = 2*calculateHalfCircumference(7);\n\
    \necho($circumference);\n```\n\nIn this example, we create a function, and return\
    \ half of the circumference (why you would want to do this, I do not know, but\
    \ for the sake of an example, that is what we will do). Outside the function,\
    \ we create a variable, and set it to twice the returned value of our function,\
    \ which we know will be half the circumference of our circle. This means we are\
    \ getting the total circumference, which we print out. \n\nReturning also has\
    \ a secondary function. It stops execution of a function. This means that say\
    \ you have a Loop in your function that runs for a long time, but you want it\
    \ to stop after an if-statement runs. Just use the `return` keyword and it will\
    \ stop the rest of the Loop from running. The `return` keyword does not need a\
    \ value to be returned either. You can use the `return` keyword on its own to\
    \ end execution of your function where it may be.\n\n```php\nfunction kindaUseless($number)\n\
    {\n    $i = 0;\n    while(true)\n    {\n        $i++;\n        if($number == $i)\n\
    \        {\n            echo($i);\n            echo(\"That’t the best way to do\
    \ that\");\n            return;\n        }\n    }\n}\n```\n\nThis is not a very\
    \ useful example, but it shows the syntax of it. This Loop will run as long as\
    \ true. This Loop will run forever. We also have a variable called `$i` that we\
    \ simply make up. In each iteration, we check if the number we are looking for\
    \ is equal to `$i`. If it is, we print out `$i` and also something about this\
    \ function. Finally, we return the function. Since the function stops execution\
    \ after it’s returned, the infinite Loop is escaped, and our program can continue.\
    \ This is extremely useful, in situations where you want to limit the number of\
    \ iterations. For example, if you are searching for something in an array, and\
    \ you find it, you may want to return right there, to avoid more iterations on\
    \ looking for something.\n\nFunctions are incredibly useful, when your code becomes\
    \ lengthy. Rather than have similar code throughout your code, you could use a\
    \ function to have the code written out once, and called where it needs to run.\
    \ Functions also allow us to make code clearer as comments do, but in the form\
    \ of the function name. For example, say you have some hard-to-read or confusing\
    \ code that prints the output of your code. You could make a function called `printOutput`.\
    \ This makes it easier to read code because instead a block of code, you have\
    \ a single line that tells you what it's doing: printing the output.\n\n#### Ex\
    \ 1 (Basic function):\n```php\nfunction SaySomething() {\n    echo \"Hello world!\"\
    ;\n}\nSaySomething();\n```\n\n#### Ex 2 (Feeding arguments):\n```php\nfunction\
    \ Birthday($name, $year) {\n    echo $name.\"Born in\".$year.\"<br>\";\n}\nBirthday(\"\
    John\", 1987);\n```\n\n#### Ex 3 (Default Argument Value):\n```php\nfunction SetFavoriteColor($color\
    \ = white) {\n    echo \"The color is : $color <br>\";\n}\nSetFavoriteColor(\"\
    Blue\");\nSetFavoriteColor(); // will use the default value of white\n```\n\n\
    #### Ex 4 (Returning Values):\n```php\nfunction Add($fNum, $sNum) {\n    $sum\
    \ = $fNum + $sNum;\n    return $sum;\n}\necho (5+10);\n```\n\n### Classes\n\n\
    Next, let’s talk about classes: a class is simply a section with functions, often\
    \ bunched up together with a similar purpose. To create a class, you must use\
    \ the `class` keyword followed by the name, followed by an opening and closing\
    \ brace. Inside the class, you can have functions and variables.\n\nThe goal of\
    \ a class is to organize your code and allow variables to be global. For example,\
    \ we create a class named `Marks`.\n\n```php\nclass Marks {\n    var $studentName;\n\
    \    var $average;\n}\n```\n\nIn the code above, the first thing that happens\
    \ is we create a global variable named `$studentName` and not yet assign it. We\
    \ do the same for `$average`. The goal for the variables is to allow the teacher\
    \ to input student and then the average. The teacher is able to retrieve values\
    \ at any time.\n\n```php\nclass Marks {\n    var $studentName;\n    var $average;\n\
    \n    function setStudentName($name) {\n        $studentName = $name;\n    }\n\
    \n    function setStudentAverage($avg) {\n        $average = $avg;\n    }\n\n\
    \    function getStudentName() {\n        return $studentName;\n    }\n\n    function\
    \ getStudentAverage() {\n        return $average;\n    }\n}\n```\n"
