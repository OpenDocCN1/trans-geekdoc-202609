  trans: "\n为了在 PHP 中创建循环（Loop）——我们必须理解不同类型的循环以及它们的适用场景。让我们来看看这些循环类型，然后我将在讲解过程中解释它们各自是如何运作的，到结束时，你应该已经对循环的工作原理有一个良好的理解。\n\
    \n### For 循环 (For Loops)\n\n```php\nfor ($x = 0; $x < 10; $x++) {\n    echo(\"\
    Hi \".$x);\n}\n```\n\n上面的示例中发生了很多操作，所以让我们逐行分析。第一行写道：\n\n`for ($x = 0; $x < 10;\
    \ $x++)`\n\n在上述语句中，这是 `for` 循环的常规标准。我们必须首先声明变量，所以让我们从声明变量 `x` 开始，并将其设置为从 0 开始的\
    \ `int`（整数）。接下来，让我们添加一个分号，通过添加条件将 `for` 循环的特定部分隔离开。这就是为什么我写了 `$x < 10`，它简单表示只要\
    \ `x` 小于 10，就运行我大括号（`{` 和 `}`）下面的代码块。该语句现在由另一个分号隔开，以便进入 `for` 循环的最后一个元素。这部分是你告诉你声明的特定变量执行特定的算术操作。在这种情况下，我们告诉\
    \ `x` 在每次循环通过时递增。\n\n让我们用伪代码（英语可读方式）来过一遍：\n\n```pseudocode\nfor (声明变量; 为变量创建条件;\
    \ 影响变量) {\n    // 运行此代码块\n}\n```\n\n一旦运行了代码块，它将返回第一个语句并检查条件仍然满足。它将跳过变量声明，因为它会注意到变量已经声明过了。然后它将在检查条件是否满足之前跳到影响变量的部分。\n\
    \n以下是适用于 `for` 循环或任何循环可以遵循的蓝图：\n\n声明变量 → 检查条件 → 运行代码块 → 影响变量 → 检查条件 → 运行代码块 →\
    \ 影响变量 → 检查条件 → 运行代码块 → 从“影响变量”开始重复\n\n现在让我们回看我们对 alert 进行稍小修改后创建的代码：\n\n```php\n\
    for ($x = 0; $x < 10; $x++) {\n    echo(\"Current Number: \".$x);\n}\n```\n\n\
    我们可以看到这个循环简单地将 `x` 从 0 递增到 9，所以从技术上是有 10 次迭代，因为 0 是包含在内的。因此，循环输出如下内容：\n\nCurrent\
    \ Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent\
    \ Number: 4\nCurrent Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent\
    \ Number: 8\nCurrent Number: 9\n\n记得我说过 `for` 循环的最后一个语句是对已声明变量的算术操作吗——很好，变量可以以任何方式受到影响，如果你愿意，也可以每次递增\
    \ 2。\n\n现在我们知道了 `for` 循环是如何工作的，理解 `while` 循环和 `do-while` 循环的工作原理就会变得容易。\n\n###\
    \ While 循环 (While Loop)\n\n`while` 循环与 `for` 循环的唯一区别在于它只带有循环条件而不包含变量。因此，你必须在循环内部影响变量以执行特定条件之前，先在循环范围之外声明变量。\n\
    \n例如：\n\n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"Current number: \".$x);\n\
    \    $x++;\n}\n```\n\n在上面的示例中，如所示，`while` 循环简单地检查条件，当满足条件时运行代码块，然后影响变量 `x`，这样在代码块执行完成后它会返回检查条件，并继续这样做直到\
    \ `x` 不小于 10。它的输出与 `for` 循环的输出相同：\n\nCurrent Number: 0\nCurrent Number: 1\nCurrent\
    \ Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent Number: 5\nCurrent\
    \ Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number: 9\n\n这个 `while`\
    \ 循环可能会出现问题，比如意外创建无限循环。例如：\n\n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"\
    Current number: \".$x);\n}\n```\n\n在上面的示例中，它执行的操作与上一个循环完全一样，但输出（即显示某些文本）会无限次显示，因为变量\
    \ `x` 永远没有受到影响。\n\n我们将涵盖的最后一种循环类型是 `do-while` 循环。这种循环执行 `while` 循环所做的一切，但它至少会执行一次。\n\
    \n例如：\n\n```php\n$x = 0;\ndo {\n    echo(\"Current number: \".$x);\n    $x++;\n\
    } while ($x < 10);\n```\n\n上面的示例无论条件如何都会至少运行代码块，这在检查条件之前执行某些很有用。\n\n### Continue\
    \ 关键字 (Continue Keyword)\n\n`continue` 关键字用于你想跳过循环的迭代时。例如：\n\n```php\n$x = 0;\n\
    while ($x < 10) {\n    if ($x == 5) {\n        continue;\n    }\n    echo($x);\n\
    }\n```\n\n在上面的示例中，我们正在检查 `x` 是否等于 5，如果是的话，我们就会跳过该迭代，这意味着此循环的输出变为：\n\nCurrent Number:\
    \ 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number:\
    \ 4\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number:\
    \ 9\n\n如上面的输出所示，循环在 5 处跳过，因为它没有机会显示该数字。\n\n### Break 关键字 (Break Keyword)\n\n`break`\
    \ 关键字用于你想跳出循环时。例如：\n\n```php\n$x = 0;\nwhile ($x < 10) {\n    if ($x == 5) {\n\
    \        break;\n    }\n    echo($x);\n}\n```\n\n在上面的示例中，我们正在检查 `x` 是否等于 5，如果是的话我们就会跳出循环，这意味着此循环的输出变为：\n\
    \nCurrent Number: 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\n\
    Current Number: 4\n\n如上面的输出所示，循环在达到此处时跳出，基本上是停止继续运行。\n\n## 数组 (Arrays)\n\n编程中的数组是有用的，因为它允许你创建字符串/数字/对象或你可以想到的任何数据类型的列表。再次，这最初可能并不明显，但当你开始编程并意识到某些情况下你可能需要数组时，你就明白了。所以数组基本上是一个包含多个单独访问值的单个变量。让我们来看看数组声明语法是如何工作的。\n\
    \n为了声明变量，你必须执行以下操作：\n\n```php\n$names = array(\"John\", \"Bob\", \"Tom\");\n```\n\
    \n在上面的示例中，我们正在声明一个名为 `names` 的变量，然后为它分配了一个值列表，这些值是字符串类型。因此，为了给数组赋值，我们添加了 `array()`，它只是设置了数组的边界。然后，我们通过给每个元素加上引号并指定数组类型为字符串，并在每个元素之间添加逗号以表示它是数组中的不同元素。\n\
    \n为了从数组访问特定的元素值，我们使用以下语法：\n\n"
- fmt: "\n```php\necho($names[0]);\n```\n\nIn the above example, what we are doing\
    \ is alerting the value of the array’s index of 0. In arrays, we refer to the\
    \ values of the array through the index value - and the index value starts at\
    \ 0. Therefore, “John” is index of 0, “Bob” is index of 1 and “Tom” is the index\
    \ of 2. The length of the array itself is 3. In order to get the length of the\
    \ array we use the following property:\n\n```php\necho(count($names));\n```\n\n\
    Since arrays in general are objects (you will learn what this means later) they\
    \ have variables and functions, and length is a property of arrays, and therefore\
    \ can be accessed by the `names` variable since it is a variable of array type.\
    \ The output of this piece of code would be 3 since it would count the first element\
    \ of the array as 1 and then 2 and so forth.\n\nNow let’s say that we want to\
    \ declare an array but not assign it any values until later in the code. Then\
    \ you would do the following:\n\n```php\n$names = [];\n$names[0] = \"John\";\n\
    $names[1] = \" Bob\";\n$names[2] = \"Tom\";\n```\n\nIn the above example, we are\
    \ declaring an empty array that we are preparing to add elements to, and we do\
    \ so by referring to an index that doesn’t yet exist and give it a certain value.\
    \ Now we can refer to the `names` array’s index and retrieve the appropriate value\
    \ that was assigned to it.\n\n```php\necho($names[0]);\n```\n\nThe above example\
    \ now returns “John” as it was assigned the string John. One thing to note is\
    \ that you’re able to overwrite index values by simply using the assignment operator\
    \ for the certain index that you would like to overwrite and then assign it something\
    \ else.\n\nThe other way of declaring a PHP array is by doing the following:\n\
    \n```php\n// declaring an associative array with KEY and VALUE\n$students_array\
    \ = array(\n    \"John\" => \"84\",\n    \"Bob\" => \"87\",\n    \"Jane\" => \"\
    91\",\n    \"Thomas\" => \"94\",\n    \"Matthew\" => \"92\",\n    \"Peter\" =>\
    \ \"76\"\n);\n// displays the whole students_array\necho \"John has an average\
    \ of: \" . $students_array[\"John\"] . \".\";\nprint_r($students_array);\n```\n\
    \nOutput:\nJohn has an average of: 84\nArray ([John] => 84 [Bob] => 87 [Jane]\
    \ => 91 [Thomas] => 94 [Matthew] => 92 [Peter] => 76)\n\nAn associative array\
    \ is an array which holds keys which hold values and to refer to the array’s values,\
    \ you would refer to the key’s name. This is another way of declaring an associative\
    \ array:\n\n```php\n<?php\n// assigning values one one\n$cart_array[\"cereal\"\
    ] = \"5.00\";\n$cart_array[\"coffee beans\"] = \"2.50\";\n$cart_array[\"bananas\"\
    ] = \"3.50\";\n$cart_array[\"onion\"] = \"1.00\";\n$cart_array[\"lettuce\"] =\
    \ \"2.40\";\n$cart_array[\"tomato\"] = \"1.00\";\necho \"John has an average of:\
    \ \" . $students_array[\"John\"] . \".\";\nprint_r($students_array);\nprint_r($cart_array);\n\
    ?>\n```\n\nOutput:\nJohn has an average of: 84\nArray ([John] => 84 [Bob] => 87\
    \ [Jane] => 91 [Thomas] => 94 [Matthew] => 92 [Peter] => 76)\n\nNow this is great\
    \ and all, having arrays, and being able to hold big databases of names, or social\
    \ security numbers, etc - but imagine trying to print all these values manually\
    \ by pointing out the index of the array and retrieving the value. Well, let’s\
    \ think about it, if I want to print out multiple values from an array from multiple\
    \ index values, then I must alert all the indexes of the array, therefore I can\
    \ conclude that I could use a Loop to affect the variable of the index to alert\
    \ and retrieve the values of the array. For example:\n\n```php\n$names = array(\"\
    John\", \"Bob\", \"Tom\");\nfor ($i = 0; $i < count($names); $i++) {\n    echo($names[$i]);\n\
    }\n```\n\nIn the above example, a variable of name `names` is being declared with\
    \ three values of \"John\", \"Bob\" and \"Tom\" - once the array variable has\
    \ been set. We are Looping the `i` variable until it reaches right before the\
    \ length of the array (number of elements held in the array) in order to print\
    \ them out. Then, we alert the array’s index values out by placing the `i` in\
    \ the brackets next to the array’s name in order to refer to the specific index,\
    \ which then prints out the names accordingly. So the output of this code would\
    \ be:\n\nJohn\nBob\nTom\n\nUsing our understanding from arrays and Loops, have\
    \ managed to combine their use to output all the elements from the array. The\
    \ idea of this concept of combining Loops and arrays to work together is just\
    \ one way you can use Loops or arrays to do what you want. The whole idea of programming\
    \ comes from thinking outside of the box by deciding how you are able to manipulate\
    \ numbers and strings and functionality of the language in order to compute the\
    \ targeted algorithm that you’re aiming to accomplish (algorithm: set of steps\
    \ to complete to accomplish a certain goal).\n\n## Multidimensional Arrays\n\n\
    Multi-Dimensional arrays are greatly useful in programming. They are basically\
    \ arrays within a single dimensional array. Essentially, each index of a single\
    \ dimensional array will now hold another array. If the index of the single array,\
    \ holds an array of indexes which also holds an array, that would then be a third\
    \ dimension array. But in this case, we’ll be going over a two dimensional array.\
    \ In order to create a two dimensional array, you would create the array like\
    \ you would last time except you would then use the `array` keyword with parenthesis\
    \ again within the initial parent `array()` to indicate that you’re creating children,\
    \ and hence, another dimension.\n\n```php\n$employees = array(\n    'names' =>\
    \ array('John','Peter'),\n    'salaries' => array('40000', '25000')\n);\n```\n\
    \nIn order to access the array, you would do the following:\n\n```php\nprint $employees['names'][0];\
    \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\nEach level of the\
    \ array is a dimension, and in the beginning, we have using one. To manipulate\
    \ this multidimensional array, we can do the following:\n\n```php\n$names = array('John','Peter');\n\
    foreach ($names as $n => $names_array) {\n    foreach ($names_array as $x => $y)\
    \ {\n        print \"Hello: \".$y.\"\\n\";\n    }\n}\n\n\nOutput:\nHello: John\n\
    Hello: Peter\n\n## Chapter 8: Functions and Classes\n\nA function is a block of\
    \ code that can be run at any point in your program with a single line of code,\
    \ and it can be used as many times as you’d like. To create a function, simply\
    \ write `function`, a variable name, and then brackets, followed by squiggly brackets,\
    \ which hold your code.\n\n```php\nfunction printSomething() {\n    echo(\"Something\
    \ I guess? don’t know...\");\n}\n```\n\nThis is a very simple function. Between\
    \ the normal brackets, you can place variable names. These are called parameters.\
    \ These parameters will allow you to give values to the code, which could give\
    \ you a different output.\n\n```php\nfunction printSomething($times) {\n    for($i\
    \ = 0; $i < $times; $i++) {\n        echo(\"Mum!\");\n    }\n}\n```\n\nThis function\
    \ uses a variable called `times`, runs a Loop for that number of times, and in\
    \ each Loop prints “Mum!”. So if you run this code with a value of 7, “Mum!” will\
    \ print out 7 times. You can have as many parameters as you want (although the\
    \ fewer the better). Just separate each variable name with a comma.\n\n```php\n\
    function printSomething($times, $whatToPrint) {\n    for($i = 0; $i < $times;\
    \ $i++) {\n        echo($whatToPrint);\n    }\n}\n```\n"
