    \               }\n\n              }\n\n              $marksObject = new Marks();\n\
    \n              $marksObject -> setStudentName(“Peter”);\n\n              $marksObject\
    \ -> setStudentAverage(80);\n\n              echo ($marksObject -> getStudentName());\n\
    \n              echo ($marksObject -> getStudentAverage());\n\n?>\n\nIn the above\
    \ code, we are simply referencing the two functions to set the variables in the\
    \ class to a certain value we input in the argument. Then, we actually output\
    \ the values we set the variables to in the end.\n\n# Chapter 9\n\n# Useful Functions\
    \ in PHP\n\nNow that you know how to actually use a PHP function, here is a compiled\
    \ list of useful functions you will find really helpful in PHP to use. You can\
    \ always refer back to this list when working with your code.\n\n## String Functions\n\
    \naddcslashes() \n\nGives back a string with oblique punctuation lines before\
    \ the predefined characters \n\naddslashes() \n\nGives back a string with oblique\
    \ punctuation lines before predefined characters \n\nbin2hex() \n\nChanges over\
    \ a string of ASCII characters to hexadecimal qualities \n\nslash() \n\nExpels\
