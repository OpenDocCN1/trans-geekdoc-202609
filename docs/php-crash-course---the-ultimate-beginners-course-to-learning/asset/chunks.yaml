  trans: "\n\n`>=` 此运算符用于检查某个值是否大于或等于另一个值。如果运算符前面的变量值大于或等于后面的变量，它将返回 `true`。如果后面的变量大于但不等于前面的变量，则它将返回\
    \ `false`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\nif ($a >= $b) {\n    echo(\"a is\
    \ larger or equal to b\");\n} else {\n    echo(\"a is not larger or equal to b\"\
    );\n}\n```\n在这个示例中，`$a` 和 `$b` 的值均为 20。虽然 `$a` 不大于 `$b`，但它等于 `$b`，因此该语句返回 `true`，代码最终打印\
    \ \"a is larger or equal to b\"。\n\n`<=` 此运算符用于检查某个值是否小于或等于另一个值。如果运算符前面的变量值小于或等于后面的变量，它将返回\
    \ `true`。如果后面的变量小于但不等于前面的变量，则它将返回 `false`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\n\
    if ($a <= $b) {\n    echo(\"a is larger than b\");\n} else {\n    echo(\"a is\
    \ not larger than b\");\n}\n```\n这个示例与上一个相同，只是运算符从 `>=` 更改为了 `<=`。虽然运算符变了，但结果是相同的。由于\
    \ `$a` 等于 `$b`，这段代码将返回 `true`，并打印 \"a is larger than b\"。\n\n## 逻辑运算符\n\nPHP 支持\
    \ 3 种可以在逻辑中使用使用的逻辑运算符，它们通常与关系运算符结合使用。\n\n`&&` 这被称为逻辑与（AND）运算符。如果该运算符前后的操作数都返回\
    \ `true`，则条件返回 `true`。如果两个操作数都为 `false`，或者其中一个操作数为 `false`，条件将返回 `false`。**两个**操作数都必须为\
    \ `true`，条件才会返回 `true`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\nif ($a == 20 && $a\
    \ == $b) {\n    echo(\"a is equal to 20 and b \");\n} else {\n    echo(\"a is\
    \ not equal to 20 or a is not equal to b\");\n}\n```\n在这个示例中，我们检查 `$a` 是否等于 20，**并且**\
    \ `$a` 是否等于 `$b`。这两个条件被称为操作数。由于 `$a` 等于 20 且等于 `$b`，该语句返回 `true`，我们在控制台打印 \"a\
    \ is larger than b\"。\n\n示例 2：\n```php\n$a = 20;\n$b = 30;\nif ($a == 20 && $a\
    \ == b) {\n    echo(\"a is equal to 20 and b\");\n} else {\n    echo(\"a is not\
    \ equal to 20 or a is not equal to b\");\n}\n```\n在下一个示例中，我们检查的内容与第一个示例完全相同。然而，这次的区别在于我们将\
    \ `$b` 的值从 20 更改为了 30。这意味着当我们运行这段代码时，if 语句将返回 `false`，因为尽管 `$a` 等于 20，但它并不等于 `$b`。因此我们打印出\
    \ \"a is not equal to 20 or a is not equal to b\"。请注意顺序并不重要。如果第一个操作数是 `false`\
    \ 而不是第二个，我们将得到相同的结果。\n\n`||` 运算符被称为逻辑或（OR）运算符。如果第一个操作数**或者**第二个操作数为 `true`，语句将返回\
    \ `true`。这意味着如果第一个操作数返回 `false` 而第二个为 `true`，语句仍然会返回 `true`，反之亦然。如果两个操作数都为 `true`，语句也会返回\
    \ `true`。本质上，当使用或运算符时，至少有一个必须返回 `true`。\n\n示例：\n```php\n$a = 20;\n$b = 30;\nif\
    \ ($a == 20 || $a == $b) {\n    echo(\"a is equal to 20 or b\");\n} else {\n \
    \   echo(\"a is not larger than b\");\n}\n```\n在这个示例中，我们检查 `$a` 是否等于 20，**或者**\
    \ `$a` 是否等于 `$b`。在这种情况下，`$a` 等于 20 但不等于 `$b`。由于这些操作数中只需要一个为 `true`，整个语句将返回 `true`。因此程序将打印\
    \ \"a is equal to 20 or b\"。\n\n示例 2：\n```php\n$a = 20;\n$b = 20;\nif ($a == 20\
    \ || $a == $b) {\n    echo(\"a is equal to 20 and b \");\n} else {\n    echo(\"\
    a is not equal to 20 or b \");\n}\n```\n在这个示例中，我将上一个示例中 `$b` 的值从 30 改为了 20。这意味着\
    \ `$a` 等于 20 且 `$a` 等于 `$b`。两个操作数都返回 `true`，因此语句返回 `true`。这是因为或运算符要求 1 个或多个运算符为\
    \ `true`。此程序将在控制台输出 \"a is equal to 20 and b\"。\n\n`!` 此运算符被称为逻辑非（NOT）运算符。它用于反转其操作数的逻辑状态。该操作数可以与其他任何操作数配合使用以反转其输出。如果操作数返回\
    \ `true`，在应用逻辑非运算符后，该操作数将返回 `false`。\n\n示例：\n```php\n$a = 21;\n$b = 20;\nif (\
    \ !(a == 20) && $a > b) {\n    echo(\"a is not equal to 20, and a is greater than\
    \ b\");\n} else {\n    echo(\"a is equal to 20, and a is not greater than b \"\
    );\n}\n```\n在这个示例中，我们检查 `$a` 的值是否等于 20，并检查 `$a` 是否大于 `$b`。由于 `$a` 既不等于 20 又大于\
    \ `$b`，我们可以在控制台打印 \"a is not equal to 20, and a is greater than b\"。\n\n示例 2：\n\
    ```php\n$a = 21;\n$b = 20;\nif ( !(a == 20 && $a > $b) ) {\n    echo(\"a is not\
    \ equal to 20, and a is greater than b \");\n} else {\n    echo(\"a is equal to\
    \ 20, and a is not greater than b \");\n}\n```\n在这个示例中，我改变了括号的位置，使其逻辑非运算符扩展到两个操作数。现在要使语句为\
    \ `true`，`$a` 必须不等于 20 且 `$a` 大于 `$b`。在这种情况下，语句将返回 `false`，因为 `$a` 大于 `$b`。由于操作数的影响，它需要小于\
    \ `$b` 才能返回 `true`。因此此程序将返回 \"a is equal to 20, a is greater than b\"。\n\n## 组合运算符\n\
    \n在 PHP 中，可以使用你需要的任意运算符。\n\n示例：\n```php\n$a = 21;\n$b = 20;\nif ((a == 20 && $a\
    \ > $b) || ($a != 20 && $a < $b)) {\n    echo(\"correct\");\n} else {\n    echo(\"\
    wrong\");\n}\n```\n通过这个示例，我们可以看到如何实现更复杂的语句。在这里，我们对两个操作数使用了或运算符，然而每个操作数内部又包含了一个逻辑与运算符。因此，要使该语句返回\
    \ `true`，`$a` 必须等于 20 且大于 `$b`，或者 `$a` 不等于 20 且小于 `$b`。请注意，我们使用括号是为了让代码更易理解，并防止代码误读我们的逻辑。\n\
    \n"
- fmt: "\nIn the above example, we have significantly changed the logic of the program,\
    \ by only switching the position of a bracket. Notice how now the brackets surround\
    \ the two inner operands, instead of two pairs of brackets surrounding each pair\
    \ of outer operands. For this statement to return true now, 3 different conditions\
