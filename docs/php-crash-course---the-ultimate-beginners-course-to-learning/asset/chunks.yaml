  trans: "\n\n```html\n</style>\n</head>\n<body>\n    <h1> This is Header text</h1>\n\
    \    <p id=\"content\"> This is the content of the webpage. </p>\n</body>\n</html>\n\
    ```\n\n为了在 HTML 文档中开始编写 CSS 编码，你必须使用 `style` 标签，并借助 `type` 属性，该属性引用了标准规范 `text/css`，并且每当你想在\
    \ HTML 文档中编写 CSS 时，都必须使用它。在这个 `style` 标签内部是你的 CSS 代码，它能够成功地引用 HTML 文档中的所有 `p`\
    \ 标签。那么，如果你只想引用特定的段落呢？\n\n现在，我之所以喜欢将 `p` 称为“选择器”（selector）而不是“标签”（tag），是因为“选择器”是一个通用术语，而可以放在\
    \ `p` 位置的内容也是通用的。你不需要直接放入 HTML 文档中被引用的实际标签，而是可以使用井号（#）后跟相应的 `id` 名称来引用 `id`：\n\
    \n```css\n#idname {\n    color: red;\n    font-size: 12px;\n}\n```\n\n你也可以使用选择器来引用带有特定名称\
    \ `class` 属性的标签。例如：\n\n```css\n.classname {\n    color: red;\n    font-size: 12px;\n\
    }\n```\n\n现在你可能在想为什么 `id` 或 `class` 会会有什么帮助。让我通过下面的示例代码来为你解疑疑惑：\n\n```html\n<html>\n\
    \    <head>\n        <title> This the webpage title </title>\n        <style type=\"\
    text/css\">\n            #content {\n                color: red;\n           \
    \     font-size: 14px;\n            }\n        </style>\n    </head>\n    <body>\n\
    \        <h1> This is Header text</h1>\n        <p id=\"content\"> This the content\
    \ of the webpage. </p>\n    </body>\n</html>\n```\n\n在上面的示例中，你可以看到我们列出了一个特定的段落，受我们在\
    \ `head` 标签内 CSS 中列出的更改的影响。这是使用 `id` 选择器的一种方法。要使用 `class` 选择器（其实没有太大区别，只是偏好问题），则需要执行以下操作：\n\
    \n```html\n<html>\n    <head>\n        <title> This the webpage title </title>\n\
    \        <style type=\"text/css\">\n            .content {\n                color:\
    \ red;\n                font-size: 14px;\n            }\n        </style>\n  \
    \  </head>\n    <body>\n        <h1> This is Header text</h1>\n        <p class=\"\
    content\"> This the content of the webpage. </p>\n    </body>\n</html>\n```\n\n\
    在上面的代码中，我们没有使用井号符号来选择具有指定 `id` 名称的特定属性，而是这次使用了 `class` 名称。利用这些关于选择器的知识，我们可以使用\
    \ `PHP` 引用特定的 HTML 元素，并借此添加属性或更改标签内的内容来操纵这些标签，使它们对用户交互具有动态性。\n\n在 CSS 中，有不同的方法可以将样式语言实际实现在\
    \ HTML 中。我已经向你展示了一种方法，即在 `head` 标签中使用 `style` 标签。事实上，实现 CSS 有三种不同类型：一种是内联的（inline），另一种是内部的（internal，即我们刚才的方法），还有一种是外部的（external）。要将其变为外部，我们不再在标签内编写\
    \ CSS 代码，而是让 `style` 标签引用一个包含所有 CSS 代码的文件。\n\n让我们简单看看每种方法的工作原理的示例。请记住，如果你引用了某个文件（在此例中为\
    \ CSS 文件），如果你没有列出直接目录路径（例如 `C:\\Program Files (x86)\\Crazybump`）而只写名称，那么它将退而回到\
    \ HTML 文件所在的根目录中查找。\n\n### 外部 CSS\n\n文件名：`Learn.html`\n\n```html\n<html>\n   \
    \ <head>\n        <title> This the webpage title </title>\n        <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"pageStyle.css\"><!-- 这是在 head 中用于引用外部文件的行\
    \ -->\n    </head>\n    <body>\n        <h1> This is Header text</h1>\n      \
    \  <p id=\"content\"> This is the content of the webpage. </p>\n    </body>\n\
    </html>\n```\n\n```css\npageStyle.css\n#content {\n    color: red;\n    font-size:\
    \ 14px;\n}\n```\n\n现在，既然我们已经讨论了内部和外部 CSS，我们可以看看内联的。这没有太大区别，只是偏好问题：\n\n```html\n\
    <p style=\"color: red; font-size: 14px;\" id=\"content\"> This is the content\
    \ of the webpage. </p>\n```\n\n上面的是一个示例：\n\n```html\n<html>\n    <head>\n    \
    \    <title> This the webpage title </title>\n    </head>\n    <body>\n      \
    \  <h1> This is Header text</h1>\n        <p class=\"content\"> This is the content\
    \ of the webpage. </p>\n    </body>\n</html>\n```\n\n"
