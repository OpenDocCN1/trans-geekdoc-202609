    \ in the guide.\n\nNow let’s go over why PHP is a great programming language to\
    \ know. It is a quick and easy to use server side scripting language designed\
    \ for web development and also many other uses. It also has great community support\
    \ which helps out with many solutions to problems that developers face commonly\
    \ with PHP. \n\nDue to the fact that it has a lot of great community support,\
    \ there are many third party programs available for free to help out and ease\
    \ the use of programming PHP. Considering that PHP has community support also\
    \ leads one to think of the great list of inbuilt functions for PHP that will\
    \ allow a developer less time to worry about custom coding his own functions and\
    \ worry more about what he needs accomplished.\n\nWe have talked a lot about how\
    \ PHP is a server side scripting language but we haven’t really talked about what\
    \ that means. There are two types of scripting languages: server side and client\
    \ side. An example of a client side language would be Javascript and an example\
    \ of a server side language would be PHP. \n\nThe difference between them is that\
    \ a client-side language, like Javascript, simply needs the browser to compile\
    \ and interpret its language, whereas PHP depends on the server to compile and\
    \ interpret its language and send the info to the browser to interpret. One of\
    \ the many uses PHP is used for is to handle databases, commonly with the MySQL\
    \ database which it has great inbuilt support for.\n\n# Chapter 2\n\n# Setting\
    \ up MySQL and PHP\n\nThe first thing you want to do is download XAMPP, which\
    \ will allow you to run PHP code and manipulate MySQL databases. After the successful\
    \ installation of XAMPP – go to the folder it was installed and execute xampp.control.exe.\
    \ Then, press the start button at Apache and MySQL.\n\nPress the start button\
    \ at the MySQL row.\n\n![enter image description here](images/00001.jpeg)\n\n\
    When MySQL has successfully started, there are still a few more things you must\
    \ do. There are two different ways to actually manage and administrate the MySQL\
    \ server and its databases.\n\nStart the apache server and open your browser and\
    \ type in localhost or 127.0.0.1. Once you have done this, then an XAMPP status\
    \ page should appear. Navigate to the security settings and change your MySQL\
    \ root password. Then, you are able to browse to PHPMyAdmin under localhost or\
    \ you can download a Windows MySQL client. An example would be Navicat or MySQL\
    \ Workbench. Once you have installed it, you’re able to log in to your MySQL Server\
    \ with the password that you set. So you can either use a third party program\
    \ to access your database or use PhpMyAdmin built in to XAMPP.\n\n![enter image\
    \ description here](images/00002.jpeg)\n\nNow for PHP files, you must head to\
    \ the XAMPP directory where it was installed and find a folder named “htdocs.”\
    \ This folder is going to contain all the files that will popup when you do localhost/filename.html.\
    \ So if you have an index.html file in the htdocs folder, you can refer to it\
    \ accordingly. Over here, you can create a .php extension file with PHP code and\
    \ HTML code and put it in the folder. Then you can call it in the browser and\
    \ it will execute. Reason you can’t just test it like a normal HTML file is because\
    \ since PHP depends on a server, like MySQL does, it must be done this way. If\
    \ you’re using a web hosting service, contact them to sort out how to do what\
    \ we did just now over XAMPP.\n\n# Chapter 3\n\n# Basics of HTML and CSS\n\n##\
    \ HTML\n\nIn order to understand how we can implement the PHP language and work\
    \ with it, we must understand the fundamentals of how a web page in its most basic\
    \ form works. HTML stands for HyperText Markup Language. It is the standard mark\
    \ up language used to create static web pages. That is why, with the help of PHP,\
    \ we can make these web pages more dynamic and responsive. \n\n### Tags\n\nIn\
    \ HTML, there is a standard convention to starting a statement, and ending one.\
    \ In English, we must start our sentences with a capital letter and end them with\
    \ a period to maintain a standard flow of writing which is easy to interpret.\
    \ Well, HTML uses the idea of “Tags” to be able to understand what exactly you\
    \ are writing. There are a few vital tags you must remember in HTML, and understand\
    \ what they are used for.\n\nIn any HTML file, there is a standard structure that\
    \ must be followed. Here is sample code showing an example of it:\n\n<html>\n\n\
    <head>\n\n              <title> This the webpage title </title>\n\n</head>\n\n\
    <body>\n\n              This is the content of the webpage.\n\n</body>\n\n</html>\n\
    \nWhen you are making a tag, you must start it with a “<” symbol and then indicate\
    \ the name of the tag, and then end it off with “>” symbol. Then, the “inner”\
    \ portion of the tag, or within the tag, goes the rest of the code. To end the\
    \ tag, you do the same convention as starting the tag, except end it with a “/”.\
    \ This is why you see the top of document as: <html> and the end of the document\
    \ as </html>.\n\nVisual demonstration:\n\n<tagname> content within tag </tagname>\n\
    \nNow let’s analyze the sample code down:\n\n<html>\n\nThis is the tag that indicates\
    \ when the HTML portion of the site will be, so it must be presented in every\
    \ HTML document. The tag is then closed at the end of the document. Therefore,\
    \ the <html> tag is the parent of all the tags within it, the children.\n\n<head>\n\
    \nThis is the tag that would hold all the header information when loading a web-page.\
    \ Everything within this tag will not be shown to the user, and is mostly used\
    \ to initialize scripts to ready them for use. An example would be to set a script\
    \ tag in the head section to prepare for use for the rest of the HTML document.\
    \ We will have to do this when learning about the jQuery library.\n\n<title>\n\
    \nThe contents of this tag will hold the title of the webpage.\n\n<body>\n\nThis\
    \ is the whole content part of the website. Just line in any essay, you have your\
    \ thesis, body and conclusion. This is the same idea in the form of tags.\n\n\
    There are many other tags in HTML that you could look up online. Let’s look at\
    \ a variety of examples and identify some helpful tags.\n\n<html>\n\n             \
    \ <head>\n\n                            <title> Example of “<p>” tag </title>\n\
    \n              </head>\n\n              <body>\n\n                           \
    \ <p> This is a paragraph. </p>\n\n              </body>\n\n</html>\n\nThe bolded\
    \ tag in the above example essentially describes a paragraph and formats it in\
    \ such a way where it has proper padding/spacing without you having to format\
    \ it yourself through the use of CSS (ability to style HTML elements).\n\n<html>\n\
    \n              <head>"
