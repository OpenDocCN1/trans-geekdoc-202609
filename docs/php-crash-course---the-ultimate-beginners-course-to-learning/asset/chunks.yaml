    \               font-size: 14px;\n\n              }\n\nThe bolded text indicates\
    \ the property in the above example. In every selected tag, you must indicate\
    \ properties of that tag, like the color of the text, the size of the text, the\
    \ style of the text, the font-weight and much more. You can always look for any\
    \ property that you’re wanting on the internet. There are many properties and\
    \ we won’t be going over them in this guide. There are different properties that\
    \ are applied to different tags. For the “p” tag in this instance, we can reference\
    \ the color property and the font-size property. Upon referencing them within\
    \ curly braces (which simply indicates the block of properties that applies to\
    \ the selector which is p) and then assigning it to a certain value.\n\n             \
    \ p {\n\n                            color: red;\n\n                           \
    \ font-size: 14px;\n\n              }\n\nTo assign a certain value to the property\
    \ of color, you must make a colon symbol which simply separates the property and\
    \ the value, and then type out a value accordingly. Once you have written out\
    \ the property and the value, use the semi-colon as a way to let the browser know\
    \ that you have ended that statement so it can read the next statement.\n\nWhen\
    \ working with colors, instead of using the standard red, blue, white, yellow,\
    \ etc - You can reference more specific colors depending on the RGB values (Red,\
    \ Green, Blue) which can be obtained using an HTML color selector. This is a link\
    \ of a site that can give you HTML color codes for use in your CSS. \n\nLink:\
    \ [http://html-color-codes.info/](http://html-color-codes.info/) \n\nTo review\
    \ CSS syntax let’s look at it in the following approach:\n\n1.  p \n\n2.  { \n\
    \n3.  color: \n\n4.  red; \n\n5.  }\n\nThe code above takes the color of the paragraph\
    \ and changes the color to red. Each line has been numbered, but wouldn’t be included\
    \ in the code. It is numbered so we can scan through each line and go over how\
    \ it works.\n\n1\\. Selector/Tag\n\n2\\. Indicating the start of the selector\
    \ properties\n\n3\\. Property/Attribute name with a colon to prepare to indicate\
    \ the value\n\n4\\. Value of the Property/Attribute and then a semi-colon to indicate\
    \ the end of statement\n\n5\\. Indicating the end of the selector properties for\
    \ the certain selector which was p\n\nRemember, you can do this as many times,\
    \ just remember to separate the selector blocks so the browser doesn’t get confused.\
    \ Well, let’s first go over how you can actually start coding in your HTML document\
    \ with CSS. To begin, you must go in between your <head> </head> tags and input\
    \ the following:\n\n<html>\n\n              <head>\n\n                           \
    \ <title> This the webpage title </title>\n\n                            <style\
    \ type = \"text/css\">\n\n                                          p {\n\n             \
    \                                           color: red;\n\n                           \
    \                             font-size: 14px;\n\n                           \
    \               }"
