    \ example:\n\nIf bob = 20, tom = 10, and john = 5, the output must be:\n\n“bob\
    \ is richer than tom, who is richer than john”\n\nBut if bob = 20, tom = 20, and\
    \ john = 5, the output must be:\n\n“bob is just as rich as tom, both are richer\
    \ than john”\n\nThe program needs to work for each possible outcome. I highly\
    \ encourage you to try this program by yourself and struggle through it as much\
    \ as you can before you look at the answer. A big part of programming is problem\
    \ solving and understanding code, so I recommend you try to figure it out by yourself\
    \ first.\n\nAnswer and explanation\n\nNote that the program will be explained\
    \ through comments in the code.\n\n                   // feel free to change these\
    \ values around\n\n                   $tom = 10; //amount of money tom has\n\n\
                       $bob = 20; // amount of money bob has\n\n                  \
    \ $john = 10; // amount of money john has\n\n                   /\\* We first\
    \ check if everyone has the same amount of money\n\n                   \\*  note\
    \ how I never check if tom is equal to john, because if\n\n                  \
    \ \\*  tom is equal to bob and bob is equal to john, then obviously\n\n                  \
    \ \\*  tom is equal to john\n\n                   \\*/\n\n                   if\
    \ ($tom == $bob && $bob == $john) {\n\n                            echo(\"Everyone\
    \ has the same amount of money\");\n\n                   }\n\n                  \
    \ /\\*\n\n                   \\*  If the first statement returns false\n\n                  \
    \ \\*  I next check the unique case where tom and bob have the same amount\n\n\
                       \\*  but john does not\n\n                   \\*/\n\n                  \
    \ else if ($tom == $bob && $bob != $john) {\n\n                            /\\\
    *\n\n                            \\* I now check if bob is greater or less than\
    \ john\n\n                            \\* and then output the correct answer\n\
    \n                            \\*/\n\n                            if ($bob > $john)\
    \ {\n\n                                               echo(\"tom is just as rich\
    \ as bob, both are richer than john\");\n\n                            }\n\n                           \
    \ else if ($bob < $john) {\n\n                                               echo(\"\
    tom is just as rich as bob, both are more poor than john\");\n\n                           \
    \ }\n\n                   }\n\n                   /\\*\n\n                   \\\
    * I repeat the same process as the previous statement but with different people\n\
    \n                   \\*/\n\n                   else if ($tom == $john && $john\
    \ != $bob) {\n\n                            if ($john > $bob) {\n\n                                \
    \               echo(\"tom is just as rich as john, both are richer than bob\"\
    );\n\n                            }\n\n                            else if ($john\
    \ < $bob) {\n\n                                               echo(\"tom is just\
    \ as rich as john, both are more poor than bob\");\n\n                           \
    \ }\n\n                   }\n\n                   /\\*\n\n                   \\\
    * The last possible combination of names,\n\n                   \\* same check\
    \ as previous statement\n\n                   \\*/\n\n                   else\
    \ if ($john == $bob && $bob != $tom) {\n\n                            if ($bob\
    \ > $tom) {\n\n                                               echo(\"bob is just\
    \ as rich as john, both are richer than tom\");\n\n                           \
    \ }\n\n                            else if ($bob < $tom) {\n\n                                \
    \               echo(\"bob is just as rich as john, both are more poor than tom\"\
    );\n\n                            }\n\n                   }\n\n                  \
    \ /\\*\n\n                   \\* Now I check the last possible combinations\n\n\
                       \\* where each person has different amounts of money\n\n                  \
    \ \\* the next 6 statements cover each possible outcome\n\n                  \
    \ \\*/\n\n                   else if ($tom > $bob && $bob > $john) {\n\n                           \
    \ echo(\"tom is richest, followed by bob, followed by john\");\n\n                  \
    \ }\n\n                   else if ($tom > $john && $john > $bob) {\n\n                           \
    \ echo(\"tom is richest, followed by john, followed by bob\");\n\n                  \
    \ }\n\n                   else if ($bob > $tom && $tom > $john) {\n\n                           \
    \ echo(\"bob is richest, followed by tom, followed by john\");\n\n                  \
    \ }\n\n                   else if ($bob > $john && $john > $tom) {\n\n                           \
    \ echo(\"bob is richest, followed by john, followed by tom\");\n\n                  \
    \ }\n\n                   else if ($john > $bob && $bob > $tom) {\n\n                           \
    \ echo(\"john is richest, followed by bob, followed by tom\");\n\n                  \
    \ }\n\n                   else if ($john > $tom && $tom > $bob) {\n\n                           \
    \ echo(\"john is richest, followed by tom, followed by bob\");\n\n                  \
    \ }\n\n              }\n\nWhen writing code it is important to comment all of\
    \ your logic so that someone who has not written it can easily understand and\
    \ edit it. I recommend that when you write code you comment it as much as you\
    \ feel is required. I also encourage you to try to find a better way to solve\
    \ this problem. Maybe there is a way you can write this in a quarter of the length;\
    \ with programming, there is never only one answer.\n\n# Chapter 7\n\n# Loops\
    \ and Arrays\n\nThis section of the guide is important because it covers one of\
    \ the most important concepts in programming. Loops are what it says they are\
    \ - they are simply functions that allow you to Loop a certain block of code for\
    \ a certain amount of iterations depending on what you ask of it. Although this\
    \ may not seem useful right now, when you start to apply your knowledge to real\
    \ programming applications, you will find use of them. Before we cover arrays,\
    \ let’s go over how Loops work.\n\n## Loops \n\nLoops in PHP are relatively the\
    \ same as many other programming languages. The syntax for it is also pretty straight\
    \ forward. In every Loop, there is a condition that is set forth for the Loop\
    \ to check whether or not it is true and until the case is the opposite, is when\
    \ the Loop itself would break out itself. For example, if you were to create a\
    \ Loop and say that I want it to run a certain block of code 10 times before stopping,\
    \ there are a few ways to do this because there are a different type of Loop.\
    \ A general idea of a Loop is the following:\n\n              Loop (condition)\
    \ {\n\n                            // block of code\n\n}"
