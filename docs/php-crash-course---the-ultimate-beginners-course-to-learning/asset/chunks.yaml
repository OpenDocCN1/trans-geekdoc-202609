  trans: "\n此函数将根据 `times` 设置的次数，打印出 `whatToPrint` 设置的任何内容。那么我们如何使用这段代码呢？要让这段代码运行，只需输入函数名，后面跟着括号，括号内包含用逗号隔开的值，这些值应该与函数的用途相关。例如，对于我们的函数，第一个参数是\
    \ `times` 变量，因此我们应该只给第一个参数传递一个数字作为值，具体来说是一个整数（尽管在这种情况下，数字是否为整数并不重要）。同样，对于第二个参数，我们应该放入我们想要打印的内容。这被称为“调用”函数。\n\
    \n```\necho(7.\"I like to move it, move it!\");\n```\n\n我们可以根据需要、在任何时间、多次调用我们的函数。函数的一个有趣点点是，在设置变量时，你可以将函数作为值，然后通过这些变量调用它们。调用函数与将其作为值使用的区别在于：在调用函数时，你使用带有参数的括号；而将函数作为值使用时，不需要放置括号。\n\
    \n### 返回值\n\n函数的一个重要特性是可以“返回”（return）值。这意味着函数在被调用时将作为返回的值。要返回一个值，只需使用 `return`\
    \ 关键字，后跟一个值。这是一个示例。要使用返回的值，只需将函数调用想象成返回的值即可。\n\n```php\nfunction calculateHalfCircumference($radius)\n\
    {\n    return 3.14*$radius;\n}\n\n$circumference = 2*calculateHalfCircumference(7);\n\
    \necho($circumference);\n```\n\n在这个示例中，我们创建了一个函数，并返回周长的一半（我不知道你为什么要这么做，但为了示例，我们将这样做）。在函数外部，我们创建了一个变量，并将其设置为函数返回值的两倍，我们知道这将是圆的周长。这意味着我们得到了总周长并将其打印出来。\n\
    \n返回还有一个次要功能：它会停止函数的执行。这意味着假设你的函数中有一个运行很长的循环（Loop），但你希望它在运行完一个 `if` 语句后停止。只需使用\
    \ `return` 关键字，它就会停止循环剩余部分的运行。`return` 关键字也不需要返回任何值。你可以单独使用 `return` 关键字来在函数的任何位置结束其执行。\n\
    \n```php\nfunction kindaUseless($number)\n{\n    $i = 0;\n    while(true)\n  \
    \  {\n        $i++;\n        if($number == $i)\n        {\n            echo($i);\n\
    \            echo(\"That’t the best way to do that\");\n            return;\n\
    \        }\n    }\n}\n```\n\n这不是一个非常有用的示例，但它展示了语法。这个循环只要条件为 `true` 就会一直运行。这个循环将永远运行。我们还创建了一个名为\
    \ `$i` 的变量。在每次迭代中，我们检查查找的数字是否等于 `$i`。如果是，我们就打印出 `$i` 以及一些关于这个函数的内容。最后，我们返回该函数。由于函数在返回后会停止执行，因此跳出了无限循环，我们的程序可以继续运行。这在那些想要限制迭代次数的情况下非常有用。例如，如果你在数组中搜索某个东西，并找到了它，你可能希望在当时直接返回，以避免更多次数的迭代。\n\
    \n当你的代码变得很长时，函数是非常实用的。与其在整个代码中编写相似的代码，不如使用一个函数将代码编写一次，并在需要运行的地方调用。函数还允许我们像注释一样使代码更清晰，但它是代码形式的。\n\
    \n#### 示例 1（基础函数）：\n```php\nfunction SaySomething() {\n    echo \"Hello world!\"\
    ;\n}\nSaySomething();\n```\n\n#### 示例 2（传递参数）：\n```php\nfunction Birthday($name,\
    \ $year) {\n    echo $name.\"Born in\".$year.\"<br>\";\n}\nBirthday(\"John\",\
    \ 1987);\n```\n\n#### 示例 3（默认参数值）：\n```php\nfunction SetFavoriteColor($color =\
    \ white) {\n    echo \"The color is : $color <br>\";\n}\nSetFavoriteColor(); //\
    \ 使用默认值 white\n```\n\n#### 示例 4（返回值）：\n```php\nfunction Add($fNum, $sNum) {\n\
    \    $sum = $fNum + $sNum;\n    return $sum;\n}\necho (5+10);\n```\n\n### 类\n\n\
    接下来让我们来说类：类类是将具有目的函数聚集在一起的部分。要创建一个类，你需要使用 `class` 关键字，后跟类名，然后是大括号。在类内部，你可以拥有函数和变量。\n\
    \n类的目标是组织你的代码并允许变量是全局的。例如，我们创建一个名为 `Marks` 的类。\n\n```php\nclass Marks {\n    var\
    \ $studentName;\n    var $average;\n}\n```\n\n在上面的代码中，首先发生的是我们创建一个名为 `$studentName`\
    \ 的全局变量，还没有给它赋值。对 `$average` 也是如此。变量的目标是允许老师输入学生和平均分。老师可以随地获取值。\n\n```php\nclass\
    \ Marks {\n    var $studentName;\n    var $average;\n\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n\n    function getStudentName() {\n    \
    \    return $studentName;\n    }\n\n    function getStudentAverage() {\n     \
    \   return $average;\n    }\n}\n```\n"
- fmt: "\nSo to explain each functionality above. The first thing we do is create\
    \ a function with the name of `setStudentName` and it asks for an argument of\
    \ variable name `$name` and then sets the class variable `$studentName` to the\
    \ variable name inputted. Then our next function simply has the same idea as the\
    \ previous method except it allows the teacher to input an average for the student.\
    \ Then we set the class variable equal to the variable inputted in to the function.\
    \ Finally, in order to retrieve the variable’s value, we create a function of\
    \ name `getStudentName` which simply returns the value of the `$studentName` variable\
    \ in the class. We apply the same philosophy to the `getStudentAverage` function\
    \ which simply returns the average of the student of the variable `$average` in\
    \ the class.\n\nNow in order to actually reference the class and its variables\
    \ / methods we must use special syntax in the PHP code outside of the class for\
    \ the executing code. In order to reference a class, we must create an object,\
    \ which is pretty much a variable that holds the class as the class can be seen\
    \ as an object since it holds functions / properties / variables which makes itself\
    \ unique. In order to actually create this object, we must use the `new` keyword\
    \ which basically is used whenever declaring a class/object. Example:\n\n```php\n\
    <?php\nclass Marks {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n      \
    \  return $studentName;\n    }\n    function getStudentAverage() {\n        return\
    \ $average;\n    }\n}\n// $objectName = new Marks(); Example Skeleton of class\
    \ declaration\n?>\n```\n\nNow in order to create this object, we will do the following:\n\
    \n```php\n<?php\nclass Marks {\n    var $studentName;\n    var $average;\n   \
    \ function setStudentName($name) {\n        $studentName = $name;\n    }\n   \
    \ function setStudentAverage($avg) {\n        $average = $avg;\n    }\n    function\
    \ getStudentName() {\n        return $studentName;\n    }\n    function getStudentAverage()\
    \ {\n        return $average;\n    }\n}\n$marksObject = new Marks();\n?>\n```\n\
    \nNow that we know how to reference the class, how do we reference what is within\
    \ the class? Well we use a dash and an arrow pointing to the right to signify\
    \ the path the object must take to get to a certain variable / function. For example:\n\
    \n```php\n<?php\nclass Marks {\n    var $studentName;\n    var $average;\n   \
    \ function setStudentName($name) {\n        $studentName = $name;\n    }\n   \
    \ function setStudentAverage($avg) {\n        $average = $avg;\n    }\n    function\
    \ getStudentName() {\n        return $studentName;\n    }\n    function getStudentAverage()\
    \ {\n        return $average;\n    }\n}\n$marksObject = new Marks();\n// I want\
    \ marksObject to reference the $studentName and echo it…\n?>\n```\n\nIn order\
    \ to actually do it, you must do the following:\n\n```php\n<?php\nclass Marks\
    \ {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n      \
    \  return $studentName;\n    }\n    function getStudentAverage() {\n        return\
    \ $average;\n    }\n}\n$marksObject = new Marks();\necho ($marksObject -> studentName);\n\
    ?>\n```\n\nIn the above code, the `$marksObject` references the `studentName`\
    \ variable without the dollar sign because you don’t have to use it. We then tell\
    \ the class to refer to the variable name `studentName` within it and it echoes\
    \ out. But since `studentName` hasn’t been set by the user, it is not going to\
    \ be able to echo out a proper value. Another thing you might be wondering is,\
    \ if we’re referencing the variable `studentName` directly instead of using a\
    \ function to retrieve the value, then why did we create a function to do just\
    \ that? Well, no reason really – it’s just convention and also for example purposes\
    \ to show you the idea of how classes and functions can work together.\n\nNow\
    \ in order to actually reference a function, you do the same thing you do when\
    \ you are referencing a variable except this time you add parenthesis to the end\
    \ of the thing that you are referencing in order to specify that you’re pointing\
    \ to a function and not a variable name. Example:\n\n```php\n<?php\nclass Marks\
    \ {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
    \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
    \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n      \
    \  return $studentName;\n    }\n    function getStudentAverage() {\n        return\
    \ $average;\n    }\n}\n?>\n```\n"
