    \ This is Header text </h1>\n\n                            <p id = \"content\"\
    > This is the content of the webpage. </p>\n\n              </body>\n\n</html>\n\
    \nFilename: pageStyle.css\n\n#content {\n\n              color: red;\n\n             \
