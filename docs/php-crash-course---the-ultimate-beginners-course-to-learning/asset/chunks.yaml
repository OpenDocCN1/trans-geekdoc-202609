    \ be talking about soon after this section of the guide.\n\nMoving on, the next\
    \ syntax rule you must remember is that if you’re updating or inserting data of\
    \ any numeric value, it must not be quoted. In many programming languages, even\
    \ including `PHP`, when you are declaring variables, you don’t set your value\
    \ of the variable in quotes if it is a number. That way, the program can differentiate\
    \ the difference between what text (string) is and what a number (int/double/float)\
    \ is. \n\nFinally, if you’re ever wanting to set anything or add anything `NULL`\
    \ which simple means to make the record at that specific section empty, then that\
    \ keyword must not be quoted. If it is quoted, it will be mistaken as a string,\
    \ and therefore have the world `NULL` literally be printed out in the specific\
    \ record.\n\nNow to actually insert data into table, we must the following format\
    \ as a query:\n\n```sql\nINSERT INTO table_name (column1, column2, column3)\n\
    VALUES (value1, value2, value3)\n```\n\nNow previously, we created a table named\
    \ `Employee_table` with the five columns as “id”, “firstname”, “lastname”, “email”,\
    \ and “birth_date”.\n\nIn order to actually create it through `PHP` code, you\
    \ must do the following:\n\n### OBJECT ORIENTED Format Example:\n\n```php\n<?php\n\
    $server_name = \"localhost\";\n$username = \"username\";\n$password = \"password\"\
    ;\n$dbname = \"dbName\";\n\n// Establishing a connection\n$conn = new mysqli($server_name,\
    \ $username, $password, $dbname);\n\n// Check connection\nif ($conn->connect_error)\
    \ {\n    die(\"Connection failed: \" . $conn->connect_error);\n}\n$sql = \"INSERT\
    \ INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob', 'Doe', 'bob@example.com')\"\
    ;\n$conn->close();\n?>\n```\n\n### Without Object Oriented Format Example:\n\n\
    ```php\n<?php\n$server_name = \"localhost\";\n$username = \"username\";\n$password\
    \ = \"password\";\n$dbname = \"dbName\";\n\n// Establishing a connection\n$conn\
    \ = mysqli_connect($server_name, $username, $password, $dbname);\n\n// Check connection\n\
    if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\
    $sql = \"INSERT INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob',\
    \ 'Doe', 'bob@hotmail.com')\";\nmysqli_close($conn);\n?>\n```\n\nThere are still\
    \ much more things to learn regarding inserting data into MySQL but this is a\
    \ `PHP` guide, not a `MySQL` guide. Let’s go over the last two final basic steps\
    \ for understanding MySQL. Let’s learn how to retrieve data from tables or `SELECT`\
    \ data from tables. Here is the query format:\n\n```sql\nSELECT column_name(s)\
    \ FROM table_name\n```\n\nOr we can use the `*` character to select ALL columns\
    \ from a table:\n\n```sql\nSELECT * FROM table_name\n```\n\n### OBJECT ORIENTED\
    \ Format Example:\n\n```php\n<?php\n$server_name = \"localhost\";\n$username =\
    \ \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// Establishing\
    \ a connection\n$conn = new mysqli($server_name, $username, $password, $dbname);\n\
    \n// Check connection\nif ($conn->connect_error) {\n    die(\"Connection failed:\
    \ \" . $conn->connect_error);\n}\n$sql = \"SELECT id, firstname, lastname FROM\
    \ Employee_table\";\n$result = $conn->query($sql);\nif ($result->num_rows > 0)\
    \ {\n    // output data of each row\n    while($row = $result->fetch_assoc())\
    \ {\n        echo $row[\"id\"]. \" - Name: \". $row[\"firstname\"]. \" \" . $row[\"\
    lastname\"].\"<br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n$conn->close();\n\
    ?>\n```\n\nExactly is happening here? Well, first of all, we must set up an SQL\
    \ query that selects id, firstname, and lastname from `Employee_table`. The next\
    \ line will then run the query and put the resulting data in a variable `$result`.\
    \ Then a function checks if more than zero rows have been returned and if they\
    \ have, a function `fetch_assoc()` puts all the results in an associative array\
    \ that is then looped to echo the results.\n\n### Without Object Oriented Example:\n\
    \n```php\n<?php\n$server_name = \"localhost\";\n$username = \"username\";\n$password\
    \ = \"password\";\n$dbname = \"dbName\";\n// Establishing a connection\n$conn\
    \ = mysqli_connect($server_name, $username, $password, $dbname);\n// Check connection\n\
    if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n\
    $sql = \"SELECT id, firstname, lastname FROM Employee_table\";\n$result = mysqli_query($conn,\
    \ $sql);\nif (mysqli_num_rows($result) > 0) {\n    while($row = mysqli_fetch_assoc($result))\
    \ {\n        echo $row[\"id\"]. \" - Name: \". $row[\"firstname\"]. \" \" . $row[\"\
    lastname\"].\"<br>\";\n    }\n} else {\n    echo \"0 results\";\n}\nmysqli_close($conn);\n\
    ?>\n```\n\n## Deleting Data\n\nLet us go over the idea of deleting data from a\
    \ `MySQL` Table using `MySQLi`. The query format to do so would be the following:\n\
    \n```sql\nDELETE FROM table_name\nWHERE some_column = some_value\n```\n\nTable\
    \ before deletion:\n\n| id | firstname | lastname | email | birth_date |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| 1 | John | Doe | john@example.com | 2015-10-24\
    \ 14:26:15 |\n| 2 | Mary | Moe | mary@example.com | 2015-10-23 10:22:30 |\n| 3\
    \ | Jane | Lane | julie@example.com | 2015-10-26 10:48:23 |\n\n### OBJECT ORIENTED\
    \ Format Example:\n\n```php\n<?php\n$server_name = \"localhost\";\n$username =\
    \ \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// Establishing\
    \ a connection\n$conn = new mysqli($server_name, $username, $password, $dbname);\n\
    \n// Check connection\nif ($conn->connect_error) {\n    die(\"Connection failed:\
    \ \" . $conn->connect_error);\n}\n// sql to delete a record\n$sql = \"DELETE FROM\
    \ Employee_table WHERE id=3\";\n$conn->close();\n?>\n```\n\n### Without Object\
    \ Oriented Format Example:\n\n```php\n<?php\n$server_name = \"localhost\";\n$username\
    \ = \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// Establishing\
    \ a connection\n$conn = mysqli_connect($server_name, $username, $password, $dbname);\n\
    \n// Check connection\nif (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
    }\n// sql to delete a record\n$sql = \"DELETE FROM Employee_table WHERE id=3\"\
    ;\nmysqli_close($conn);\n?>\n```\n\nTable after deletion:\n\n| id | firstname\
    \ | lastname | email | birth_date |\n| :--- | :--- | :--- | :--- | :--- |\n| 1\
    \ | John | Doe | john@example.com | 2015-10-24 14:26:15 |\n| 2 | Mary | Moe |\
    \ mary@example.com | 2015-10-23 10:22:30 |\n"
