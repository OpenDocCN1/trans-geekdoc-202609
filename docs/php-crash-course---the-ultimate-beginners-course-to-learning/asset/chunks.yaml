    \ equal to “b”, this code will return true, printing “a is larger than b” to the\
    \ console.\n\n## The Logical Operators\n\nPHP supports 3 Logical Operators that\
    \ can be used in your logic, which will often be used in conjunction with Relational\
    \ Operators.\n\n&&                                  This is known as the logical\
