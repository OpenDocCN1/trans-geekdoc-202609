    # Introduction


    ## Welcome to Your New Programming Language


    So, you''ve decided to learn `PHP Programming`? Well, congratulations and welcome
    to your new Programming Language! You''re going to love it!


    In Eprogramy we believe that the foundation of a good education is to provide
    the tools able to open the doors of the future. It is indisputable that the world
    has entered an era in which we all have everything at the fingertips. Social needs
    have changed. Thus, today communication has changed. Communication opens doors,
    so it is our challenge to learn how to communicate with a new language: The programming
    language.


    Maybe the road is difficult and hard, but we will give the reader the tools to
    make learning enjoyable and fruitful. We''ll show all aspects necessary to learn
    how to program. From the ABC''s to the solution of the most common programming
    problems and much, much more.


    We know what we do and believe that you are fully capable of incorporating our
    teachings.


    The doors of the future are here. Let''s go step by step together.


    Let''s get started!


    Eprogramy Team


    # Chapter 1


    # PHP Programming Language


    ## History of PHP


    The first incarnation of `PHP` was a simple set of Common Gateway Interface (`CGI`)
    binaries which were written with the C programming language. `PHP` was created
    in 1994 by Rasmus Lerdorf. As more functionality was in demand, more `PHP` tools
    were produced. Through this, it produced a much larger and richer implementation.


    In June 1995, the source code for `PHP` tools was released to the public which
    allowed developers to use it in any way they wanted. Due to this flexibility,
    many developers offered bug fixes and helped `PHP` grow bigger than ever.

