  trans: "\n现在我们已经回顾了所有用于处理变量的操作符，让我们来看处理变量的一些特殊情况。首先，如果你想将两个字符串连接在一起，方法是将它们拼接（将它们连接在一起），只需简单地使用\
    \ `.` 运算符即可。\n\n例如：\n\n```php\n$x = \"Hello\";\n$y = \"World\";\n$line = $x.\"\
    \ \".$y;\necho $line;\n```\n\n在这种情况下，`line` 的值将是不带引号的“Hello World”。\n\n下一个特殊情况是尝试将一个字符串和一个数字相加。例如：\n\
    \n```php\n$line = 15.“test”;\n```\n\n变量 `line` 现在将持有不带引号的值“15test”，因为 PHP 不理解你为什么要尝试向字符串中添加一个数字，所以它在后台会自动将其处理为如下形式：\n\
    \n```php\n$line = “15”. “test”;\n```\n\n记住在 PHP 中，你可以动态更新变量，例如：\n\n```php\n$x;\
    \ // 未定义\n$x = 10; // x 是一个数字\n$x = “This is text”; // x 现在是一个字符串\n```\n\n在整个指南中，你会看到我使用双引号来表示字符串\
    \ - 实际上并不重要 - 你也可以使用单引号来声明字符串变量。单引号和双引号使用的用点在于，如果你在字符串变量外部使用双引号，并想在内部使用它，PHP 就会产生困惑，因此为了避免混淆，你需要在让\
    \ PHP 字符串变量产生困惑的双引号之前放置一个转义字符：`\\\\`，这会在输出字符串时简单地跳过该双引号并忽略 `\\\\`。另一种方法是简单地用单引号包裹你的字符串变量，这样就可以在字符串变量内部使用双引号而不会让\
    \ PHP 产生困惑——反之亦然。\n\n示例：\n\n```php\n$text = \"It’s great to learn!\"; // 双引号内有单引号\n\
    $text = \"Their name is ‘Microsoft’\"; // 双引号内单引号\n$text = 'Their name is “Microsoft”';\
    \ // 单引号内双引号\n```\n\n# 第 6 章\n\n## 布尔逻辑\n\n布尔值（Boolean）是一个持有 `true` 或 `false`\
    \ 值的变量——这些变量可以通过操作来在逻辑上拆解条件以做出决策。\n\n### If 语句\n\n简单来说，`if` 语句用于检查某物是真还是假。要创建一个\
    \ `if` 语句，你只需要编写单词 `if` 后跟着两个圆括号。`if` 语句内部的块是在满足 `if` 语句的条件时将执行的代码块。`if` 语句还可以包含\
    \ `else if` 语句和 `else` 语句。当 `if` 语句返回假时，`else if` 语句将运行。然而，它也包含自己的参数，该参数必须返回真。`else`\
    \ 语句同样在 `if` 语句返回假时被调用，`else` 语句与 `else if` 语句的区别在于，`else` 语句的运行不需要任何参数为真。\n\n\
    示例：\n\n```php\n$a = 10;\n$b = 20;\nif ($a == $b) {\n    echo(\"a is equal to b\
    \ \");\n}\nelse if ($a > $b) {\n    echo(\"a is greater than b \");\n}\nelse {\n\
    \    echo(\"a is not equal to b or greater than b \");\n}\n```\n\n此示例中使用的操作符（`==`\
    \ 和 `>`）在下文中解释。在以下代码中，我们首先检查 `a` 是否等于 `b`。如果为真，只需打印“a is equal to b”并忽略其余代码。如果\
    \ `a` 不等于 `b`，它将向下执行并调用 `else if`。`else` 是由于第一个 `if` 返回了假。`else if` 的 `if` 部分会检查它自己的参数，恰好是\
    \ `a` 是否大于 `b`。如果 `a` 大于 `b`，我们就会打印“a is greater than b”。然而，由于 `a` 小于 `b`，我们继续向下并简单地调用\
    \ `else`。当所有上述参数都返回假时，`else` 运行。它不需要自己的参数为真。注意，每个 `if` 语句后面都可以跟跟无限数量的 `else if`\
    \ 语句，但只能有一个 `else` 语句。同样注意，你不能在 `if` 语句和 `else` 语句之间放置代码，因为代码将找不到 `else`。此外，`else`\
    \ 语句要求在其之前有一个 `if` 语句，因为为了调用 `else` 语句，其前的 `if` 语句必须为假。同样重要的是，在另一个 `if` 语句**内部**包含一个\
    \ `if` 语句是可能的。这被称为**嵌套嵌套 if 语句**。\n\n示例：\n\n```php\n$a = 20;\n$b = 30;\nif ($a\
    \ == 20) {\n    if ($a < $b) {\n        echo(\"a is less than b and it is equal\
    \ to 20\");\n    }\n}\n```\n\n在这个示例中，我们首先检查 `a` 的值是否等于 `b` 的值。如果是，我们再检查 `a` 的值是否小于\
    \ `b` 的值。如果是这种情况，我们会打印“a is less than b and it is equal to 20”。\n\n### 关系运算符\n\
    \nPHP 支持 6 种关系运算符，用于比较变量的值：\n\n`==`：此运算符检查两个值是否相等。如果相等，它返回真。如果不相等，它返回假。\n\n示例：\n\
    \n```php\n$a = 10;\n$b = 10;\nif ($a == $b) {\n    echo(\"they are the same\"\
    );\n}\n```\n此代码检查 `a` 是否等于 `b`。如果为真，则括号内的代码将执行。\n\n`!=`：此运算符检查两个值是否不相等。如果不相等，它返回真。如果相等，它返回假。\n\
    \n示例：\n\n```php\n$a = 10;\n$b = 20;\nif ($a != $b) {\n    echo(\"they are not\
    \ the same\");\n}\n```\n此代码检查 `a` 是否等于 `b`。由于 `a` 不等于 `b`，它打印“they are not the\
    \ same”。\n\n`>`：此运算符检查一个值是否大于另一个。如果运算符前面的变量大于后面变量的值，它返回真。如果前面的小于后面的，它返回假。\n\n\
    示例：\n\n```php\n$a = 20;\n$b = 10;\nif ($a > $b) {\n    echo(\"a is larger than\
    \ b\");\n}\nelse {\n    echo(\"a is not larger than b\");\n}\n```\n此示例检查 `a` 是否大于\
    \ `b`。由于 `a` 大于 `b`，`if` 语句返回真。\n\n`<`：此运算符检查一个值是否小于另一个。如果运算符前面的变量小于后面变量的值，则代码返回真；否则，它返回假。\n\
    \n示例：\n\n```php\n$a = 10;\n$b = 20;\nif ($a < $b) {\n    echo(\"a is smaller than\
    \ b\");\n}\nelse {\n    echo(\"a is not smaller than b\");\n}\n```\n此示例检查 `a`\
    \ 是否小于 `b`。由于 `a` 小于 `b`，`if` 语句返回真。\n"
- fmt: "\n`>=` This operator checks to see if something is greater than Or Equal to\
    \ something else. If the value of the variable before it is greater than Or Equal\
    \ to the variable after it, then it will return true. If the variable after it\
    \ is greater but not equal to the variable before it, it will return false.\n\n\
    Example:\n```php\n$a = 20;\n$b = 20;\nif ($a >= $b) {\n    echo(\"a is larger\
    \ or equal to b\");\n} else {\n    echo(\"a is not larger or equal to b\");\n\
    }\n```\nIn this example, `$a` and `$b` have a value of 20. Although `$a` is not\
    \ greater than `$b`, it is EQUAL to `$b`, therefore the statement returns true,\
    \ and the code ends up printing \"a is larger or equal to b\".\n\n`<= This operator\
    \ checks to see if something is less than Or Equal to something else. If the value\
    \ of the variable before it is less than Or to the variable after it, then it\
    \ will return true. If the variable after it is less but not equal to the variable\
    \ before it, it will return false.\n\nExample:\n```php\n$a = 20;\n$b = 20;\nif\
    \ ($a <= $b) {\n    echo(\"a is larger than b\");\n} else {\n    echo(\"a is not\
    \ larger than b\");\n}\n```\nThis example is identical to the one before except\
    \ the operator was changed from `>=` to `<=`. Although the operator has changed,\
    \ the result is the same. Since `$a` is equal to `$b`, this code will return true,\
    \ printing \"a is larger than b\".\n\n## Logical Operators\n\nPHP supports 3 Logical\
    \ Operators that can be used in your logic, which will often be used in conjunction\
    \ with Relational Operators.\n\n`&&` This is known as the AND operator. If the\
    \ operands before and after this operator both return true, then the condition\
    \ returns true. If both of the operands are false, or one operand is false, the\
    \ condition will return false. BOTH operands MUST be true for the condition to\
    \ return true.\n\nExample:\n```php\n$a = 20;\n$b = 20;\nif ($a == 20 && $a ==\
    \ $b) {\n    echo(\"a is equal to 20 and b \");\n} else {\n    echo(\"a is not\
    \ equal to 20 or a is not equal to b\");\n}\n```\nIn this Example, we check to\
    \ see if `$a` is equal to 20, AND if `$a` is equal to `$b`. These two conditions\
    \ will be referred to as operands. Since `$a` is equal to 20, and equal to `$b`,\
    \ the statement returns true, and we print to the console \"a is larger than b\"\
    .\n\nExample 2:\n```php\n$a = 20;\n$b = 30;\nif ($a == 20 && $a == b) {\n    echo(\"\
    a is equal to 20 and b\");\n} else {\n    echo(\"a is not equal to 20 or a is\
    \ not equal to b\");\n}\n```\nIn this next example, we check the exact same thing\
    \ as the first example. The difference this time, however, is that we changed\
    \ the value of `$b` from 20 to 30. This means that when we run this code, the\
    \ if statement will return false because although `$a` is equal to 20, it is not\
    \ equal to `$b`. Therefore we print out \"a is not equal to 20 or a is not equal\
    \ to b\". Take note that the order does not matter. If the first operand was false\
    \ instead of the second, we would have the same result.\n\n`||` Operator is known\
    \ as the OR operator. If the first operand OR the second operand is true, the\
    \ statement will return true. This means that if the first operand returns false\
    \ and the second is true, the statement will still return true, and vice versa.\
    \ The statement will also return true if both operands are true. Essentially,\
    \ when using an OR operator, at least one must return true.\n\nExample:\n```php\n\
    $a = 20;\n$b = 30;\nif ($a == 20 || $a == $b) {\n    echo(\"a is equal to 20 or\
    \ b\");\n} else {\n    echo(\"a is not larger than b\");\n}\n```\nIn this example,\
    \ we check to see if `$a` is equal to 20, OR if `$a` is equal to `$b`. In this\
    \ case, `$a` is equal to 20 and is not equal to `$b`. Since only one of these\
    \ operands need to be true, the statement as a whole will return true. Therefore\
    \ the program will print \"a is equal to 20 or b\".\n\nExample 2:\n```php\n$a\
    \ = 20;\n$b = 20;\nif ($a == 20 || $a == $b) {\n    echo(\"a is equal to 20 and\
    \ b \");\n} else {\n    echo(\"a is not equal to 20 or b \");\n}\n```\nIn this\
    \ example, I have the value of `$b` from the previous example from 30 to 20. This\
    \ means that `$a` is equal to 20 and `$a` is equal to `$b`. Both operands return\
    \ true, therefore the statement returns true. This is due to the fact that an\
    \ OR operator requires 1 or more of the operators to be true. This program will\
    \ output \"a is equal to 20 and b\" to the console.\n\n`!` This operator is known\
    \ as the logical NOT operator. It is used to reverse the logical state of its\
    \ operand. This operand can be used with any other operand to reverse its output.\
    \ If an operand was returning true, after applying the logical NOT operator, the\
    \ operand will return false.\n\nExample:\n```php\n$a = 21;\n$b = 20;\nif ( !(a\
    \ == 20) && $a > b) {\n    echo(\"a is not equal to 20, and a is greater than\
    \ b\");\n} else {\n    echo(\"a is equal to 20, and a is not greater than b \"\
    );\n}\n```\nIn this example, we check to see if the value of `$a` does not equal\
    \ to 20, and we check if `$a` is greater than `$b`. Since `$a` is both not equal\
    \ to 20, and greater than `$b`, we can print out to the console \"a is not equal\
    \ to 20, and a is greater than b\".\n\nExample 2:\n```php\n$a = 21;\n$b = 20;\n\
    if ( !(a == 20 && $a > $b) ) {\n    echo(\"a is not equal to 20, and a is greater\
    \ than b \");\n} else {\n    echo(\"a is equal to 20, and a is not greater than\
    \ b \");\n}\n```\nIn this example, I changed the position of the bracket from\
    \ the NOT operator to extend to both operands. Now for the statement to be true,\
    \ `$a` has to NOT equal to 20, AND `$a` must be greater than `$b`. In this situation\
    \ the statement will return false, because `$a` is greater than `$b`. Due to the\
    \ operand it needs to be less than `$b` for the statement to return true. Therefore\
    \ this program will return \"a is equal to 20, a is greater than b\".\n\n## Combining\
    \ Operators\n\nIn PHP, it is possible to use as many operators as you require.\n\
    \nExample:\n```php\n$a = 21;\n$b = 20;\nif ((a == 20 && $a > $b) || ($a != 20\
    \ && $a < $b)) {\n    echo(\"correct\");\n} else {\n    echo(\"wrong\");\n}\n\
    ```\nWith this example, we can see how we can achieve much more complicated statements.\
    \ Here, we apply an OR operator with two operands, however, each operand also\
