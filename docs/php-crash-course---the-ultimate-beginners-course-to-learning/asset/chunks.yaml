  trans: "\n\n# 第 12 章：创建注册系统\n\n注册系统与登录系统类似，不同在于 MySQL 查询是向 MySQL 数据库插入数据，而不是在数据库中进行选择/搜索数据。由于我们已经涵盖了许多表单及其属性的含义，因此在本节中我们将快速带过。\n\
    \n我们必须做的第一件事是为注册创建一个表单。我们希望用户输入他们想要的用户名、电子邮箱、密码，最后是验证密码。这是一个相当简单的注册表单，但足够有效，可以让你理解它的工作原理。我们的表单现在看起来像这样：\n\
    \n```html\n<form action=\"register.php\" method=\"POST\">\n    <input type=\"\
    text\" name=\"username\" id=\"username\" value=\"username\">\n    <input type=\"\
    text\" name=\"email\" id=\"email\" value=\"email\">\n    <input type=\"password\"\
    \ name=\"password\" id=\"password\" value=\"password\">\n    <input type=\"password\"\
    \ name=\"password_verify\" id=\"password_verify\" value=\"password\">\n    <input\
    \ type=\"submit\" value=\"Register\">\n</div>\n</form>\n```\n\n如所示，为了安全起见，我们将此注册表单使用\
