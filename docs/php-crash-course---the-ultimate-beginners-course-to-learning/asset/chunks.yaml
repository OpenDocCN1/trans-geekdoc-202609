- fmt: "\nNow that we have went over all the operators that we can use to work with\
    \ variables, let’s go over some special cases with variables. First of all, if\
    \ you would like to join two strings together, the way to do that is to concatenate\
    \ them together (join them together) and to do that is to simply use the `.` operator.\n\
    \nFor example:\n\n```php\n$x = \"Hello\";\n$y = \"World\";\n$line = $x.\" \".$y;\n\
    echo $line;\n```\n\nThe value of `line` in the case would be “Hello World” without\
    \ the quotation marks.\n\nThe next special case is when trying to add a string\
    \ and a number together. So for example:\n\n```php\n$line = 15.“test”;\n```\n\n\
    The variable of `line` will now hold the value of “15test” without quotation marks,\
    \ as it won’t understand why you’re trying to add a number to a string, so it\
    \ will automatically treat it as the following in the backend:\n\n```php\n$line\
    \ = “15”. “test”;\n```\n\nRemember that in PHP, you can update variables dynamically,\
    \ so for example:\n\n```php\n$x; // undefined\n$x = 10; // x is a number\n$x =\
    \ “This is text”; // x is now a string\n```\n\nThroughout this guide, you’ve been\
    \ seeing me use double quotation marks for strings - it actually doesn’t matter\
    \ - you’re able to use single quotes to declare string variables as well. The\
    \ catch with single quotes and double quotes usage is that if you’re using double\
    \ quotation marks outside your string variable, and want to use it inside, PHP\
    \ will get confused, so in order to make it unconfused, you are to place an escape\
    \ character: `\\\\` right before the double quotation mark that is confusing the\
    \ PHP string variable which will simply bypass that double quotation mark and\
    \ ignore the `\\\\` when outputting the string. Another way is to simply surround\
    \ your string variable with single quotes and be able to use double quotation\
    \ marks within your string variable without confusing PHP - or vice versa.\n\n\
    Examples:\n\n```php\n$text = \"It’s great to learn!\"; // Single quote inside\
    \ double quotes\n$text = \"Their name is ‘Microsoft’\"; // Single quotes inside\
    \ double quotes\n$text = 'Their name is “Microsoft”'; // Double quotes inside\
    \ single quotes\n```\n\n# Chapter 6\n\n## Boolean Logic\n\nA Boolean is a variable\
    \ that holds the value of either `true` or `false` - and these variables can be\
    \ manipulated to logically breakdown conditions to come up with a decision.\n\n\
    ### If Statements\n\nAn `if` statement, simply put, checks to see IF something\
    \ is true, or false. To create an `if` statement, you simply write the word `if`\
    \ followed by two rounded brackets. Within an `if` statement is the block of code\
    \ that will execute if the condition of the `if` statement is met. `if` statements\
    \ can also include `else if` statements, and `else` statements. An `else if` statement\
    \ will run if the `if` statement returns false. However, it also contains its\
    \ own parameter that must return true. An `else` statement also is called if the\
    \ `if` statement returns false, the difference between an `else` statement, and\
    \ an `else if` statement, is that no parameters need to be true for an `else`\
    \ statement to run.\n\nExample:\n\n```php\n$a = 10;\n$b = 20;\nif ($a == $b) {\n\
    \    echo(\"a is equal to b \");\n}\nelse if ($a > $b) {\n    echo(\"a is greater\
    \ than b \");\n}\nelse {\n    echo(\"a is not equal to b or greater than b \"\
    );\n}\n```\n\nThe operands used in this example (`==` and `>`) are explained below.\
    \ In the following code, we first check to see if `a` is equal to `b`. If that\
    \ is true, we simply print “a is equal to b” and ignore the rest of the code.\
    \ If `a` does not equal `b`, then it goes down and calls the `else if`. The `else`\
    \ is due to the first `if` returning false. The `if` part of `else if` is checking\
    \ its own parameters, which happen to be whether `a` is greater than `b`. If `a`\
    \ is greater than `b`, then we would have printed “a is greater than b”. However,\
    \ since `a` is less than `b`, we go further down and simply call `else`. The `else`\
    \ runs if all the above parameters return false. It does not require its own parameter\
    \ to be true. Note that each `if` statement can have an infinite amount of `else\
    \ if` statements which follow it, but only one `else` statement. Also note that\
    \ you cannot have code between an `if` statement and an `else` statement, because\
    \ the code would not be able to find the `else`. As well, an `else` statement\
    \ requires there to be an `if` statement before it, since for an `else` statement\
    \ to be called, an `if` statement HAS to false before it. It is also important\
    \ to know that it is possible to have an `if` statement INSIDE of another `if`\
    \ statement. This is called a NESTED `if` statement.\n\nExample:\n\n```php\n$a\
    \ = 20;\n$b = 30;\nif ($a == 20) {\n    if ($a < $b) {\n        echo(\"a is less\
    \ than b and it is equal to 20\");\n    }\n}\n```\n\nIn this example, we first\
    \ check to see if the value of `a` is equal to the value of `b`. If it is, we\
    \ then check to see if the value of `a` is less than the value of `b`. If this\
    \ statement also returns true, we can print “a is less than b and it is equal\
    \ to 20”. This can work with many `if` statements as you would like. This can\
    \ be useful to check parameters separately, or if you want to add additional logic.\
    \ You will understand fully the way an `if` statement works by the end of this\
    \ section.\n\n### Relational Operators\n\nPHP supports 6 different types of relational\
    \ operators, which can be used to compare the value of variables. They are the\
    \ following:\n\n`==`: This operator checks to see if two integers are equal to\
    \ each. If they are equal, the operator returns true. If they are not, it returns\
    \ false.\n\nExample:\n\n```php\n$a = 10;\n$b = 10;\nif ($a == $b) {\n    echo(\"\
    they are the same\");\n}\n```\nThis code checks to see IF `a` is equal to the\
    \ value of `b`. Since the value of `a` is equal to the value of `b`, the value\
    \ within the brackets will be true. This ends up causing the above code to print\
    \ out the statement “they are the same”.\n\n`!=`: This operator checks to see\
    \ if two things NOT equal the same thing. If two things NOT equal the same thing,\
    \ then it will return true. If they DO the same thing, it will return false.\n\
    \nExample:\n\n```php\n$a = 10;\n$b = 20;\nif ($a != $b) {\n    echo(\"they are\
    \ not the same\");\n}\n```\nThis code will check if `a` does not equal `b`. Since\
    \ `a` does not equal to `b`, the program will print “they are not the same” in\
    \ the console.\n\n>`: This operator checks to see if something is Greater than\
    \ something else. If the value of the variable in front of it is greater than\
    \ the value of the variable after it, it will return true. If the value of the\
    \ variable in front of it is less than the variable after it, it will return false.\n\
    \nExample:\n\n```php\n$a = 10;\n$b = 20;\nif ($a > $b) {\n    echo(\"a is larger\
    \ than b\");\n}\nelse {\n    echo(\"a is not larger than b\");\n}\n```\nThis example\
    \ checks to see if `a` is larger than `b`. Since `a` is not larger than `b`, this\
    \ `if` statement will return false. Instead, it will print “a is not larger than\
    \ b”, because the code passes the failed `if` statement and calls the `else` statement.\n\
    \n`<`: This operator checks to see if something is less than something else. If\
    \ the value of the variable before the operator is less than the value of the\
    \ operator after the variable, then the code will return true; else, it will return\
    \ false.\n\nExample:\n\n```php\n$a = 10;\n$b = 20;\nif ($a < $b) {\n    echo(\"\
    a is larger than b\");\n}\nelse {\n    echo(\"a is not larger than b\");\n}\n\
    ```\nThis example is just like the one before it, however, the operator changed\
    \ from greater than, to less than. Therefore the `if` statement will return true\
    \ this time. Since the value of `a` is less than the value of `b`, and the program\
    \ will print to the console “a is larger than b”.\n"
  raw: "Now that we have went over all the operators that we can use to work with\
    \ variables, let’s go over some special cases with variables. First of all, if\
    \ you would like to join two strings together, the way to do that is to concatenate\
    \ them together (join them together) and to do that is to simply use the “.” operator.\n\
    \nFor example:\n\n              $x = \"Hello\";\n\n              $y = \"World\"\
    ;\n\n              $line = $x.\" \".$y;\n\n              echo $line;\n\nThe value\
    \ of line in the case would be “Hello World” without the quotation marks. \n\n\
    The next special case is when trying to add a string and a number together. So\
    \ for example:\n\n$line = 15.“test”;\n\nThe variable of line will now hold the\
    \ value of “15test” without quotation marks, as it won’t understand why you’re\
    \ trying to add a number to a string, so it will automatically treat it as the\
    \ following in the backend:\n\n$line = “15”. “test”;\n\nRemember that in PHP,\
    \ you can update variables dynamically, so for example:\n\n$x; // undefined\n\n\
    $x = 10; // x is a number\n\n$x = “This is text”; // x is now a string\n\nThroughout\
    \ this guide, you’ve been seeing me use double quotation marks for strings - it\
    \ actually doesn’t matter - you’re able to use single quotes to declare string\
    \ variables as well. The catch with single quotes and double quotes usage is that\
    \ if you’re using double quotation marks outside your string variable, and want\
    \ to use it inside, PHP will get confused, so in order to make it unconfused,\
    \ you are to place an escape character: “\\\\” right before the double quotation\
    \ mark that is confusing the PHP string variable which will simply bypass that\
    \ double quotation mark and ignore the “\\\\” when outputting the string. Another\
    \ way is to simply surround your string variable with single quotes and be able\
    \ to use double quotation marks within your string variable without confusing\
    \ PHP - or vice versa.\n\nExamples:\n\n$text = \"It’s great to learn!\";             \n\
    \n// Single quote inside double quotes\n\n$text = \"Their name is ‘Microsoft’\"\
    ;    \n\n// Single quotes inside double quotes\n\n$text = 'Their name is “Microsoft”';\
    \    \n\n// Double quotes inside single quotes\n\n# Chapter 6\n\n# Boolean Logic\n\
    \nA Boolean is a variable that holds the value of either true or false - and these\
    \ variables can be manipulated to logically breakdown conditions to come up with\
    \ a decision.\n\n## If Statements\n\nAn if statement, simply put, checks to see\
    \ IF something is true, or false. To create an if statement, you simply write\
    \ the word if followed by two rounded brackets. Within an if statement is the\
    \ block of code that will execute if the condition of the if statement is met.\
    \ if statements can also include else if statements, and else statements. An else\
    \ if statement will run if the if statement returns false. However, it also contains\
    \ its own parameter that must return true. An else statement also is called if\
    \ the if statement returns false, the difference between an else statement, and\
    \ an else if statement, is that no parameters need to be true for an else statement\
    \ to run.\n\n                     Example:\n\n$a = 10;\n\n$b = 20;\n\nif ($a ==\
    \ $b) {\n\necho(\"a is equal to b \");\n\n}\n\nelse if ($a > $b) {             \
    \ \n\necho(\"a is greater than b \");\n\n}\n\nelse {              \n\necho(\"\
    a is not equal to b or greater than b \");\n\n}\n\nThe operands used in this example\
    \ (“==” and “>”) are explained below. In the following code, we first check to\
    \ see if “a” is equal to “b”. If that is true, we simply print “a is equal to\
    \ b” and ignore the rest of the code. If “a” does not equal “b”, then it goes\
    \ down and calls the else if. The else is due to the first if returning false.\
    \ The if part of else if is checking its own parameters, which happen to be whether\
    \ “a” is greater than “b”. If “a” is greater than b, then we would have printed\
    \ “a is greater than b”. However, since “a” is less than “b”, we go further down\
    \ and simply call else. The else runs if all the above parameters return false.\
    \ It does not require its own parameter to be true. Note That each if statement\
    \ can have an infinite amount of else if statements which follow it, but only\
    \ one else statement. Also Note that you cannot have code between an if statement\
    \ and an else statement, because the code would not be able to find the else.\
    \ As well, an else statement requires there to be an if statement before it, since\
    \ for an else statement to be called, an if statement HAS to equal false immediately\
    \ before it. It is also important to know that it is possible to have an if statement\
    \ INSIDE of another if statement. This is called a NESTED if statement.\n\n                    \
    \ Example:\n\n                     $a = 20;\n\n$b = 30;\n\nif ($a == 20) {             \
    \ \n\nif ($a < $b) {\n\necho(\"a is less than b and it is equal to 20\");\n\n\
    }\n\n}\n\nIn this example, we first check to see if the value of “a” is equal\
    \ to the value of “b”. If it is, we then check to see if the value of “a” is less\
    \ than the value of “b”. If this statement also returns true, we can print to\
    \ the console “a is less than b and it is equal to 20”. This can work with as\
    \ many if statements as you would like. This can be useful if completely necessary\
    \ to check the parameters separately, or if you want to add additional logic between\
    \ each check.\n\nYou will understand fully the way an if statement works by the\
    \ end of this section.\n\n## The Relational Operators\n\nPHP supports 6 different\
    \ types of relational operators, which can be used to compare the value of variables.\
    \ They are the following:\n\n\\==                   This operator checks to see\
    \ if the value of two integers are equal to each other. If they are the equal,\
    \ the operator returns true. If they are not, it returns false.\n\nExample:\n\n\
    $a = 10;\n\n$b = 10;\n\nif ($a == $b) {              \n\necho(\"they are the same\"\
    );\n\n}\n\nThis code checks to see IF the value of “a” is equal to the value of\
    \ “b”. Since the value of “a” is equal to the value of “b”, the value within the\
    \ brackets will be true. This ends up causing the above code to print out the\
    \ statement “they are the same”.\n\n!=                    This operator checks\
    \ to see if the value of two things DO NOT equal the same thing. If two things\
    \ DO NOT equal the same thing, then it will return true. If they DO equal the\
    \ same thing, it will return false.\n\n                     Example:\n\n$a = 10;\n\
    \n$b = 20;\n\nif ($a != $b) {              \n\necho(\"they are not the same\"\
    );\n\n}\n\nThis code will check if “a” does not equal “b”. Since “a” does not\
    \ equal to “b”, the program will print “they are not the same” in the console.\n\
    \n\\>                              This operator Checks to see if something is\
    \ Greater than something else. If the value of the variable in front of it is\
    \ greater than the value of the variable after it, it will return true. If the\
    \ value of the variable in front of it is less than the value of the variable\
    \ after it, it will return false.\n\nExample:\n\n$a = 10;\n\n$b = 20;\n\nif ($a\
    \ > $b) {              \n\necho(\"a is larger than b\");\n\n}\n\nelse {             \
    \ \n\necho(\"a is not larger than b\");\n\n}\n\nThis example checks to see if\
    \ “a” is larger than “b”. Since “a” is not larger than “b”, this if statement\
    \ will return false. Instead, it will print “a is not larger than b”, because\
    \ the code passes the failed if statement and calls the else statement.\n\n<                 \
    \                      This operator checks to see if something is less than something\
    \ else. If the value of the variable before the operator is less than the value\
    \ of the operator after the variable, then the code will return true; else, it\
    \ will return false.\n\n                     Example:\n\n$a = 10;\n\n$b = 20;\n\
    \nif ($a < $b) {\n\necho(\"a is larger than b\");\n\n} \n\nelse {                            \
    \ \n\necho(\"a is not larger than b\");\n\n}\n\nThis example is just like the\
    \ one before it, however, the operator changed from greater than, to less than.\
    \ Therefore the if statement will return true this time. Since the value of “a”\
    \ is less than the value of “b”, and the program will print to the console “a\
    \ is larger than b”."
