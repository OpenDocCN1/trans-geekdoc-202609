    \n                            <title> This the webpage title </title>\n\n             \
    \ </head>\n\n              <body>\n\n                            <h1> This is\
    \ Header text </h1>\n\n                            <p style = \"color: red; font-size:\
    \ 14px\" id = \"content\"> This is the content of the webpage. </p>\n\n             \
    \ </body>\n\n</html>\n\nWe have finally went over the fundamentals of HTML and\
    \ CSS and can finally get started on understanding how to implement PHP!\n\n#\
    \ Chapter 4\n\n# PHP Variables\n\n## What is a Variable?\n\nA variable is essentially\
    \ a storage unit that holds a certain type of data. It is named by the programmer,\
    \ and is used to identify the data it stores. A variable can usually be accessed\
    \ or changed at any time. You can write information to it, take information from\
    \ it, and even copy the information to store in another variable.\n\n## Variable\
    \ Types\n\nIn PHP, a variable has a specific type, which would determine what\
    \ size it is, and the layout of its memory. The PHP language defines 3 types of\
    \ variables:\n\n### Instance Variables\n\nInstance variables are declared within\
    \ a class but outside of any method, constructor or block. Instance variables\
    \ are created with the keyword “new” and are destroyed when the object is destroyed.\
    \ An instance variable is visible to all methods, constructors and blocks, within\
    \ the class that it is declared in. All instance variables have a default value,\
    \ unlike local variables which do not have default values. All these terms like\
    \ “classes”, “methods”, “constructors” will be explained at a later time in the\
    \ guide.\n\n### Class/Static Variables\n\nStatic Variables are declared outside\
    \ of any method, constructor, or block, and are declared with the keyword “static”.\
    \ If a variable is static, only one instance of that variable will exist, regardless\
    \ of how many instances of the object are called. Static variables are rarely\
    \ used except for constant values, which are variables that are never changed.\n\
    \n### Local Variables"
