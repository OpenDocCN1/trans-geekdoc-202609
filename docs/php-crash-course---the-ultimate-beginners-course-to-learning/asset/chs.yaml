  \ 团队\n\n# 第 1 章\n\n## Java 编程语言\n\n### Java 的历史\n\n`Java` 是一种首次于 1995 年公开提供的编程语言，由\
  \ Sun Microsystems（太阳公司）的 James Gosling 于 1991 年创建。Sun Microsystems 后被 Oracle（甲骨文）收购，现在是负责该编程语言命运的实体。`Java`\
  \ 随后在通用公共许可证（GPL）下成为开源可用。\n\n`Java` 的语法很大程度上源自 `C` 和 `C++`，但它简化了内存管理（垃圾回收过程在 `Java`\
  \ 中是自动化的）。\n\n`Java` 最初是为交互式电视设计的，但超越了电视行业。`Java` 有五项设计原则：\n\n1. 必须是简单的、面向对象的且熟悉的\n\
  2. 必须是健壮且安全的\n3. 必须是架构无关且可移植的\n4. 必须是高性能的\n5. 必须是解释性的、多线程且动态的\n\n另一个重要的设计目标是可移植性，这是\
  \ `Java` 成功的关键因素。在这种语境下，可移植性意味着编写的 `Java` 代码可以在任何硬件操作系统组合上执行。\n\n遗憾的是，`Java` 比 `C++`\
  \ 等语言慢（需要更多内存），但随着时间的推移，`Java` 1.1 被引入，执行速度得到了显著提高。\n\n`Java` 是专为面向对象语言构建的，这现在还没有太大意义，但在稍后的指南中将会。面向对象编程允许创建高效、组织良好且强大的代码，并在文中贯穿。\n\
  \n### 什么是 Java？\n\n`Java` 是一种具有多平台能力的编程语言，这意味着你可以为任何设备编写 `Java`，无论是安卓手机、Windows\
  \ 电脑还是苹果产品。由于 `Java` 的灵活性，它使其成为全球许多程序员最流行的编程语言之一。`Java` 可用于创建 Web 应用程序、游戏、Windows\
  \ 应用、数据库系统等。\n\n`Java` 因其简单性和强大性而与其他编程语言不同。`Java` 是一种简单的编程语言，因为它在内存管理或处理相互继承关系的复杂类群方面对用户要求极低。虽然这现在听起来没什么意义，但在接触\
  \ `Java` 的继承点时会有意义。\n\n`Java` 程序通过 Java 虚拟机（JVM）运行，它本质上是操作系统的软件实现，用作执行 Java 程序的一种。编译器（将代码转换为计算机可读指令的过程）分析\
  \ Java 代码并将其转换为字节码，允许计算机理解并相应执行程序员发出的指令。\n\n在下载和安装 `Java` 时，该平台的发行有两种方式：Java 运行环境（JRE）和\
  \ Java 开发工具包（JDK）。`JRE` 本质上是运行 Java 程序的 Java 虚拟机（JVM）。而 `JDK` 则是功能齐全的 Java 开发包，包含了\
  \ `JRE`、编译器、工具等。\n\n只想在机器上运行 Java 程序的普通用户只需要安装 `JRE`，因为它包含了如前所述允许 Java 程序执行的 `JVM`。另一方面，Java\
  \ 程序员必须下载 `JDK` 才能实际编写 Java 程序。\n\n# 第 2 章\n\n## Java 安装\n\n为了在机器上安装 Java，你需要下载以下内容：\n\
  \n1.  Java 开发者使用的 IDE\n2.  Java JDK\n\n\n\n\n下载这两个工具将开启你通往 Java 程序员的之路。IDE（集成开发环境）是程序员使用的程序化应用程序，因为它包含了处理和执行代码所需的各种工具。一个\
  \ IDE 包含一个代码编辑器、一个编译器、一个调试器和一个图形用户界面（GUI）。有许多不同的 IDE，但最常用的有：\n\n1. Netbeans\n2.\
  \ Eclipse\n\n在本指南中，由于 Eclipse 的简单易用性，推荐使用它。要下载 Eclipse，请使用以下链接：\n\n[`eclipse.org/downloads/`](https://eclipse.org/downloads/)\n\
