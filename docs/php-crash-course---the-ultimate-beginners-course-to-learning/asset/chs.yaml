- "# PHP：速成课程 - 在 12 小时内学习 PHP 编程的终极初学者指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n# 欢迎来到你的新编程语言\n\
  \n所以，你决定学习 `PHP Programming` 了吗？很好，恭喜你，欢迎来到你的新编程语言！你会喜欢它的！\n\n在 Eprogramy，我们相信良好教育的基础是提供能够开启未来之门的工具。不可否认，世界已经进入了一个我们一切触手可及的时代。社会需求已经变化。因此，今天的沟通方式也发生了变化。沟通开启了大门，因此我们的挑战是学习如何用一种新的语言进行交流：这就是编程语言。\n\
  \n也许道路是困难辛苦的，但我们将为读者提供工具，让学习变得愉快且富有成果。我们将展示学习编程所需的所有方面。从基础知识到解决最常见的编程问题，以及更多、更多内容。\n\
  \n我们清楚自己在做什么，并相信你完全有能力吸收我们的教学。\n\n未来的门已经开启。让我们一起一步步迈前进。\n\n让我们开始吧！\n\nEprogramy\
  \ 团队\n\n# 第 1 章\n\n## PHP 编程语言\n\n### PHP 历史\n\n`PHP` 的第一个形态是用 C 语言编写的一组简单的通用网关接口\
  \ (`CGI`) 二进制文件。`PHP` 由 Rasmus Lerdorf 于 1994 年创建。随着对功能需求的增加，产生了更多的 `PHP` 工具。通过这种方式，它产生了规模庞大得多且丰富的实现。\n\
  \n1995 年 6 月，`PHP` 工具的源代码向公众发布，允许开发者以他们想要的方式使用它。由于这种灵活性，许多开发者提供了错误修复，并帮助 `PHP` 变得比以往任何时候都更加强大。\n\
  \n\n\n\n\n随着时间的推移，代码又经历了一次彻底的改新，1996 年 4 月，Rasmus 引入了 `PHP/FI`。这一版本的 `PHP` 将其演变成了一个广泛的工具集，并成为了一种独立的编程语言。它包含了对\
  \ `DBM`、`MySQL` 和 `Postgres95` 数据库、cookie、用户自定义函数支持等功能。\n\n尽管 `PHP` 的开发时间很短，但它在年轻的\
  \ Web 开发领域迅速流行起来。1998 年的调查显示，有近 60,000 个域名在他们的主机服务器上安装并正在使用 `PHP`。在当时，这个数字占了互联网上所有域名的\
  \ 1%。\n\n这种编程语言 `PHP` 主要由个人个人开发，他为 Web 开发社区带来了一种简单而强大的编程语言——这种语言可以完成许多伟大的工作，我们将在本指南中详细介绍这些内容。\n\
  \n### 什么是 PHP？\n\n`PHP` 是一种服务端编程语言，可用于让静态网页更具动态性，因为它可以在服务器后端执行逻辑操作，并相应地在页面上返回/输出结果。`PHP`\
  \ 的一个缺点是，页面必须重新加载才能让服务器接收并进行相应的处理。有很多方法可以避免这一点，在不重新加载页面的情况下使其动态化。可以通过 `PHP` 和 `AJAX`\
  \ 的混合实现，我们将在指南稍后部分讨论。\n\n现在让我们来看看为什么 `PHP` 是一种非常棒的编程语言。它是一种快速且易于使用的服务端脚本语言，专为 Web\
  \ 开发以及许多其他用途设计。它还拥有出色的社区支持，有助于解决开发者在使用 `PHP` 时经常遇到的许多问题。\n\n由于它拥有大量的优秀社区支持，有很多免费的第三方程序可以帮助并简化\
  \ `PHP` 编程。考虑到 `PHP` 拥有社区支持，人们也会考虑到 `PHP` 强大的内置函数列表，这让开发者减少了担心自定义函数编码的时间，可以更多地关注他们需要完成的任务。\n\
  \n我们讨论了很多 `PHP` 是一个服务端脚本语言，但我们还没有真正讨论过这意味着什么。脚本语言有两种类型：服务端和客户端。客户端语言的示例是 `Javascript`，而服务端语言的示例是\
  \ `PHP`。\n\n它们之间的区别在于，客户端语言（如 `Javascript`）只需要浏览器来编译和解释其语言，而 `PHP` 则依赖服务器来编译和解释其语言，并将信息发送到浏览器进行解释。`PHP`\
  \ 的许多用途之一是处理数据库，通常使用 `MySQL` 数据库，它对此有极好的内置支持。\n\n# 第 2 章\n\n## 设置 MySQL 和 PHP\n\n\
  你想做的第一件事是下载 `XAMPP`，它允许你运行 `PHP` 代码并操作 `MySQL` 数据库。成功安装 `XAMPP` 后——进入安装目录并执行 `xampp.control.exe`。然后，点击\
  \ `Apache` 和 `MySQL` 启动按钮。\n\n点击 `MySQL` 行的启动按钮。\n\n![enter image description here](img/00001.jpeg)\n\
  \n当 `MySQL` 成功启动后，还有几件事你必须完成。管理和管理 `MySQL` 服务器及其数据库实际上有两种不同的方法。\n\n启动 `apache` 服务，打开浏览器并输入\
  \ `localhost` 或 `127.0.0.1`。完成后，会出现 `XAMPP` 状态页面。导航到安全设置并更改你的 `MySQL` root 密码。然后你就可以访问\
  \ `localhost` 下的 `PHPMyAdmin`，或者下载一个 Windows `MySQL` 客户端。例如 `Navicat` 或 `MySQL Workbench`。安装完成后，你就可以用设置的密码登录你的\
  \ `MySQL` 服务器。因此，你可以使用第三方程序访问数据库，也可以使用 `XAMPP` 内置的 `PhpMyAdmin`。\n\n![enter image\
  \ description here](img/00002.jpeg)\n\n对于 `PHP` 文件，你必须进入安装 `XAMPP` 的目录并找到名为 `htdocs`\
  \ 的文件夹。该文件夹将包含当你访问 `localhost/filename.html` 时出现的所有文件。所以，如果你在 `htdocs` 文件夹中有一个 `index.html`\
  \ 文件，你可以相应地引用它。在这里，你可以创建一个包含 `PHP` 代码和 `HTML` 代码的 `.php` 文件并放入文件夹。然后你就可以调用它。\n\n\
  # 第 3 章\n\n## HTML 和 CSS 基础\n\n### HTML\n\n为了理解 `HTML` 如何工作，我们必须查看基础。`HTML` 代表超文本标记语言。它用于创建网页。\n\
  \n`HTML` 中有很多你可以查询的标签。让我们来看各种示例并识别一些有用的标签。\n\n```html\n<html>\n<head>\n<title></title></head>\n\
  <body>\n</body>\n</html>\n```\n\n```html\n<html>\n<head>\n    <title>Example of\
  \ <p> tag</title>\n</head>\n<body>\n    <p>This is a paragraph.</p>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n### “<p>”标签的示例\n\n```html\n<html>\n  <head>\n    <title> “<p>”标签的示例\
  \ </title>\n  </head>\n  <body>\n    <h1> 这是一个标题。</h1>\n  </body>\n</html>\n```\n\
  \n上述示例中使用的 `<h1>` 标签的作用仅仅是将其包含的文本进行**加粗**并放大。你将要用到的所有标签的属性都可以通过 CSS 进行编辑，而我们很快就会学习到这部分内容。\n\
  \n这里有一个同时使用我们已经学过的两个标签的示例，并展示了输出结果。请注意，一旦你创建了包含 HTML 的文件，必须以 `.html` 扩展名保存该文件。然后你可以打开该文件并使用你选择的浏览器打开它进行测试。\n\
  \n```html\n<html>\n  <head>\n    <title> “<p>”标签的示例 </title>\n  </head>\n  <body>\n\
  \    <h1> 这是一个标题。</h1>\n  </body>\n</html>\n```\n\n输出：\n\n![`lh4.googleusercontent.com/VNQxDcrXmEWh9xtMPONP15Kin9EwzHCIOuLVJnwN5qPMwfwl3srEFNUzO8WgBBmOsD7ejN1WUfBG6UPE763FLlZghEOFEG58K-eepDLp1VE-T6tbZZRaV631EeavzkJiIrbJCn4`](img/00003.jpeg)\n\
  \n最后，让我们来看一下 HTML 中注释的概念。你有时想编写某些代码但并不恰恰将其打印到屏幕上，只是想解释你正在执行的操作，或者在代码中添加提醒，而不让它在网页浏览器中显示，这样用户就看不到它。\n\
  \n你可以通过以 `<!--` 开始注释并以 `-->` 结束来进行注释。因此，如果我想注释某一行，我会对一个正常的段落如下操作：\n\n```html\n<p>\
  \ 这是一个段落文本 </p>\n<!-- 这一行打印出一个显示“这是一个段落文本”的段落 -->\n```\n\n有标签，也有属性，属性包含值，这些值被用于决定标签的内容如何显示，或者被\
  \ CSS 或 PHP 如何解释。在学习 PHP 和 CSS 时需要注意的两个重要属性是：`id` 和 `class`。你可以将它们用于任何适当的标签上，例如\
  \ `<body>` 标签内的 `<p>` 标签。\n\n属性的工作格式如下：\n\n```html\n<p id = \"content\"> 这是网页的内容。\
  \ </p>\n```\n\n如示例所示，为了声明一个属性，你必须在第一个标签（即 `<p>`）中留出空间，然后命名已知的属性，例如 `id`。然后为了给它赋值值，你必须有一个等号，然后是引号以及引号内的值。在这种情况下，此段落包含了属性\
  \ `id=\"content\"` —— 这可以通过你将要学习的选择器，作为 CSS 和 PHP 等语言的引用。\n\nHTML 中仍然有许多你可以学习的标签，但这些是你开始编写代码时需要的基础标签。此外，你还应该理解\
  \ HTML 文档的基本结构。让我们回顾一下：\n\n- `<html>` 和 `</html>` 定义了 HTML 文档，标签本身定义了其中的内容，以便浏览器能够对其进行解析。\n\
  - `<head>` 和 `</head>` 提供有关文档的信息并初始化任何外部脚本或样式表。\n- `<title>` 和 `</title>` 仅仅提供给浏览器显示\
  \ HTML 文档的标题。\n- `<body>` 和 `</body>` 容纳文档的所有内容，包括段落、导航栏、图像等。\n- `<h1>` 和 `</h1>`\
  \ 定义一级标题。\n\n\n\n\n\n```html\n</style>\n</head>\n<body>\n    <h1> This is Header\
  \ text</h1>\n    <p id=\"content\"> This is the content of the webpage. </p>\n</body>\n\
  </html>\n```\n\n为了在 HTML 文档中开始编写 CSS 编码，你必须使用 `style` 标签，并借助 `type` 属性，该属性引用了标准规范\
  \ `text/css`，并且每当你想在 HTML 文档中编写 CSS 时，都必须使用它。在这个 `style` 标签内部是你的 CSS 代码，它能够成功地引用\
  \ HTML 文档中的所有 `p` 标签。那么，如果你只想引用特定的段落呢？\n\n现在，我之所以喜欢将 `p` 称为“选择器”（selector）而不是“标签”（tag），是因为“选择器”是一个通用术语，而可以放在\
  \ `p` 位置的内容也是通用的。你不需要直接放入 HTML 文档中被引用的实际标签，而是可以使用井号（#）后跟相应的 `id` 名称来引用 `id`：\n\n\
  ```css\n#idname {\n    color: red;\n    font-size: 12px;\n}\n```\n\n你也可以使用选择器来引用带有特定名称\
  \ `class` 属性的标签。例如：\n\n```css\n.classname {\n    color: red;\n    font-size: 12px;\n\
  }\n```\n\n现在你可能在想为什么 `id` 或 `class` 会会有什么帮助。让我通过下面的示例代码来为你解疑疑惑：\n\n```html\n<html>\n\
  \    <head>\n        <title> This the webpage title </title>\n        <style type=\"\
  text/css\">\n            #content {\n                color: red;\n             \
  \   font-size: 14px;\n            }\n        </style>\n    </head>\n    <body>\n\
  \        <h1> This is Header text</h1>\n        <p id=\"content\"> This the content\
  \ of the webpage. </p>\n    </body>\n</html>\n```\n\n在上面的示例中，你可以看到我们列出了一个特定的段落，受我们在\
  \ `head` 标签内 CSS 中列出的更改的影响。这是使用 `id` 选择器的一种方法。要使用 `class` 选择器（其实没有太大区别，只是偏好问题），则需要执行以下操作：\n\
  \n```html\n<html>\n    <head>\n        <title> This the webpage title </title>\n\
  \        <style type=\"text/css\">\n            .content {\n                color:\
  \ red;\n                font-size: 14px;\n            }\n        </style>\n    </head>\n\
  \    <body>\n        <h1> This is Header text</h1>\n        <p class=\"content\"\
  > This the content of the webpage. </p>\n    </body>\n</html>\n```\n\n在上面的代码中，我们没有使用井号符号来选择具有指定\
  \ `id` 名称的特定属性，而是这次使用了 `class` 名称。利用这些关于选择器的知识，我们可以使用 `PHP` 引用特定的 HTML 元素，并借此添加属性或更改标签内的内容来操纵这些标签，使它们对用户交互具有动态性。\n\
  \n在 CSS 中，有不同的方法可以将样式语言实际实现在 HTML 中。我已经向你展示了一种方法，即在 `head` 标签中使用 `style` 标签。事实上，实现\
  \ CSS 有三种不同类型：一种是内联的（inline），另一种是内部的（internal，即我们刚才的方法），还有一种是外部的（external）。要将其变为外部，我们不再在标签内编写\
  \ CSS 代码，而是让 `style` 标签引用一个包含所有 CSS 代码的文件。\n\n让我们简单看看每种方法的工作原理的示例。请记住，如果你引用了某个文件（在此例中为\
  \ CSS 文件），如果你没有列出直接目录路径（例如 `C:\\Program Files (x86)\\Crazybump`）而只写名称，那么它将退而回到 HTML\
  \ 文件所在的根目录中查找。\n\n### 外部 CSS\n\n文件名：`Learn.html`\n\n```html\n<html>\n    <head>\n\
  \        <title> This the webpage title </title>\n        <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"pageStyle.css\"><!-- 这是在 head 中用于引用外部文件的行 -->\n    </head>\n\
  \    <body>\n        <h1> This is Header text</h1>\n        <p id=\"content\"> This\
  \ is the content of the webpage. </p>\n    </body>\n</html>\n```\n\n```css\npageStyle.css\n\
  #content {\n    color: red;\n    font-size: 14px;\n}\n```\n\n现在，既然我们已经讨论了内部和外部 CSS，我们可以看看内联的。这没有太大区别，只是偏好问题：\n\
  \n```html\n<p style=\"color: red; font-size: 14px;\" id=\"content\"> This is the\
  \ content of the webpage. </p>\n```\n\n上面的是一个示例：\n\n```html\n<html>\n    <head>\n\
  \        <title> This the webpage title </title>\n    </head>\n    <body>\n    \
  \    <h1> This is Header text</h1>\n        <p class=\"content\"> This is the content\
  \ of the webpage. </p>\n    </body>\n</html>\n```\n\n\n\n\n局部变量仅在方法、块或构造函数内部声明。它们仅在方法、块或构造函数创建时被创建，并在方法结束时立即被销毁。你只能在调用局部变量的方法、块或构造函数内部访问它们，在调用处之外的地方是不可见的。局部变量没有默认值。\n\
  \n## 数据类型\n\n如上所述，变量用于存储数据。PHP 拥有多种内置变量数据类型，用于存储预定义类型的数据。这些数据类型被称为原始数据类型。这些数据类型是编程语言中最基础的数据类型。你也可以创建自己的数据类型，我们稍后会介绍。PHP\
  \ 共有 8 种原始数据类型。\n\n### byte\nbyte 数据类型是一个 8 位符号位补码整数。它在声明时的默认值为 0，最大值为 127，最小值为\
  \ -128。当你想要节省内存空间时（特别是在大型数组中），byte 很有用。\n\n示例：\n```php\n$b = 1; // 值为 1\n```\n\n\
  ### short\nshort 数据类型是一个 16 位符号位补码整数。它的最大范围是 32,767，最小值为 -32,768。short 用于节省内存或使你的代码更清晰。\n\
  \n示例：\n```php\n$s = 100; // 值为 100\n```\n\n### int\nint 数据类型是一个 32 位符号位补码整数。它的最大值为\
  \ 2,147,483,647 (2³¹ - 1)，最小值为 - 2,147,483,648 (-2³¹)。除非考虑内存问题，int 是整数最常用的数据类型。\n\
  \n示例：\n```php\n$i = 10000000000; // 值为 10000000000\n```\n\n### long\nlong 数据类型是一个\
  \ 64 位符号位补码整数。它的最大值为 9,223,372,036,854,775,807 (2⁶³ - 1)，最小值为 -9,223,372,036,854,775,808\
  \ (-2⁶³)。当需要处理比 int 更大的数字时，使用这种数据类型。\n\n示例：\n```php\n$n = 1; // 值为 1\n```\n\n###\
  \ float\n浮点数据类型是双精度 64 位 IEEE 754 浮点数。其最小和极大范围太大，在此讨论。在需要精度（如货币）时，永远不要使用 float。\n\
  \n示例：\n```php\n$f = 120.5; // 值为一百二十点五\n```\n\n### double\ndouble 双点类型是双精度 64 位\
  \ IEEE 754 浮点数。它通常是小数的首选数据类型。其最小和极大范围无法在此讨论。在需要精度（如货币）时，永远不要使用 float。\n\n示例：\n```php\n\
  $d = 120.5; // 值为一百二十点五\n```\n\n### bool\nbool 数据类型表示 1 位数据。它可以包含两个值：true 或 false。它用于简单的标志位，以跟踪真或假条件。\n\
  \n示例：\n```php\n$b = true; // 值为 true\n```\n\n### char\nchar 数据类型是单个 16 位字符。它的最小值为\
  \ `0000` (0)，最大值为 `ffff` (65,535)。\n\n示例：\n```php\n$c = 'w'; // 返回 'w'\n```\n\n\
  ### String\n另一种常用的数据类型是 String。String 不是原始数据类型，但它是存储文本的类型。\n\n示例：\n```php\n$cat\
  \ = \"meow\"; // 将 cat 设置为 \"meow\"\n```\n\n## 声明变量\n\n变量声明包含两个部分：变量名和存储的值。注意命名变量有一特定的约定和规则。变量名可以是任意字母和数字，但必须以字母、美元符号\
  \ `$` 或下划线 `_` 开头，否则将导致错误。常见的命名约定是以小写开头，后续单词大写。例如，如果变量名为 `theName`，第一个单词 `the` 是小写，后续单词\
  \ `Name` 以大写开头。\n\n示例：\n```php\n$theName = 123; // 值为 123\n```\n在上面的示例中，数据类型是 `int`，变量名为\
  \ `theName`，其中存储的值是 `123`。你也可以声明变量但不向其存储值。\n\n示例：\n```php\n$name; // 无值\n```\n你可以在稍后对其进行赋值。\n\
  \n## 使用变量\n\n变量声明后，你可以读取它的值或更改它。在变量初始声明后，你只需通过名称引用它；只有在声明变量时才需要指定其数据类型。\n\n示例：\n\
  ```php\n$name = 2; // 将 int \"name\" 设置为 2\n```\n\n变量也可以相加：\n\n示例：\n```php\n$a;\
  \ // 无值\n$b = 1; // 值为 1\n$c = 2; // 值为 2\n$a = $b + $c; // 将 a 设置为 b 的值\n```\n\
  在上面的示例中，我们将 `a` 的值设置为 `b` 和 `c` 的之和。加号被称为运算符，我们将在下一节中介绍。\n\n在某种程度上，也可以组合不同数据类型的变量值。\n\
  \n示例：\n```php\n$test = \"0\"; // 将 test 设置为 \"0\"\n$test += 2; // test 现在是整数\n$test\
  \ = 3.3; // test 现在是浮点数\n$test = \"5\"; // test 现在是字符串\n```\n\n\n\n\n这可以用于判断一个数字是否为偶数。只需对\
  \ `2` 取模，如果结果为 `0` 则该数字为偶数，否则为奇数。这在尝试查找分钟（例如在时钟上）时也有用。只需将分钟数除以 `60`（一小时 `60` 分钟），结果将是时钟的分钟计数。注意，使用取模运算时，你只能得到从\
  \ `0` 到小于你运算符的任何数字（该运算符也可以是小数）。\n\n其他数学运算符（如指数、根、舍入等）并不是默认操作，它们实际上是函数，我们稍后会讨论。请注意，表达式遵循\
  \ BEDMAS（或 PEMDAS，取决于你学的是哪种）。无论如何，这里是一些表达式及其对应的值。\n\n```\n7 * (3 % 2) = 7\n(8 -\
  \ 1.3) * 6 - 8 / (0 - 4) = 62\n```\n\n关键字是编程的下一个划分。有很多关键字，我们会在学习编程的不同部分时遇到它们。一些常见的包括\
  \ `$`、`for`、`while`、`return`、`break`、`function`。这些词用于在代码中执行特定操作。这是一个非常通用的描述，但它们的范围很广。注意，如果不恰当地使用它们，可能会导致代码出现语法错误。\n\
  \n语句是编程的下一个划分。语句总是以分号结尾（在某些特殊情况下）。注意 `console.log` 也以分号结尾，这表明 `console.log` 是一个函数，但我们将稍后讨论它。这是一个重要的语句。变量是存储在内存中以便复用的值。变量就像一个盒子，具体地想象一个盒子。当你取出盒子时，你在盒子上写下名字，这样你就知道里面是什么了。这被称为变量声明。变量有作用域（scope），这决定了它们在何处可以访问，我们稍后会回到这一点。\n\
  \n### 算术运算符\n\n### 加法\n\n`5+5 = 10`\n\n```\n$x = 5;\n$y = 5;\n$sum = 0;\n$sum =\
  \ $y;\n```\n\n在上面的示例中，变量 `sum` 将两个变量（`x` 和 `y`）相加并得到值 `10`。\n\n### 减法\n\n`10-5 =\
  \ 5`\n\n```\n$x = 10;\n$y = 5;\n$total = 0;\n$total = $x - $y;\n```\n\n在上面的示例中，变量\
  \ `total` 将两个变量（`x` 和 `y`）相减并得到值 `5`。\n\n### 乘法\n\n`5*4 = 20`\n\n```\n$x = 5;\n\
  $y = 4;\n$total = 0;\n$total = $x * $y;\n```\n\n在上面的示例中，变量 `total` 将两个变量（`x` 和 `y`）相乘并得到值\
  \ `20`。\n\n### 除法\n\n`20/5 = 4`\n\n```\n$x = 20;\n$y = 5;\n$total = 0;\n$total =\
  \ $x / $y;\n```\n\n在上面的示例中，变量 `total` 将两个变量（`x` 和 `y`）相除并得到值 `4`。\n\n### 取模\n\n\
  `7 % 2 = 1`\n\n```\n$x = 7;\n$y = 2;\n$total = 0;\n$total = $x % $y;\n```\n\n在上面的示例中，变量\
  \ `total` 取两个变量（`x` 和 `y`）的余数，通过寻找 `2` 能整除 `7` 几次来确定余数。例如：\n`2` 能整除 `7` 几次？`3` 次。\n\
  `2 * 3 = 6`\n`7 - 6 = 1`\n因此，`7` 取模 `2` 为 `1`。\n\n### 后自增\n\n`5++ = 6`\n\n```\n\
  $x = 5;\n$y = $x++;\n$x = 0;\n```\n\n在上面的示例中，变量 `x` 增加了值 `1`。注意，当使用后自增时，返回的是增加之前的值。\n\
  \n### 前自增\n\n`++x = 6`\n\n```\n$x = 5;\n$y = ++$x;\n$x = 0;\n```\n\n在上面的示例中，变量 `x`\
  \ 增加了值 `1`。注意，当使用前自增时，返回的是增加之后的值。\n\n### 后自减\n\n`5-- = 4`\n\n```\n$x = 5;\n$y =\
  \ $x--;\n$x = 0;\n```\n\n在上面的示例中，变量 `x` 减了值 `1`。注意，当使用后自减时，返回的是减少之前的值。\n\n### 前自减\n\
  \n`--x = 4`\n\n```\n$x = 5;\n$y = --$x;\n$x = 0;\n```\n\n在上面的示例中，变量 `x` 减了值 `1`。注意，当使用前自减时，返回的是减少之后的值。\n\
  \n### 赋值运算符\n\n赋值运算符用于变量赋值，最常用的是 `=`。以下是示例：\n\n### 等号 `=`\n\n```\n$x = 5;\n```\n\
  \n在上面的示例中，`x` 被赋值为值 `5`。\n\n### 加等号 `+=`\n\n```\n$x += 5;\n```\n\n在上面的示例中，`x` 变为\
  \ `10`，因为你将值 `5` 加到了 `x` 的现有值上。\n\n### 减等号 `-=`\n\n```\n$x -= 5;\n```\n\n在上面的示例中，`x`\
  \ 变为 `0`，因为你从 `x` 的现有值中减去了值 `5`。\n\n### 乘等号 `*=`\n\n```\n$x *= 5;\n```\n\n在上面的示例中，`x`\
  \ 变为 `25`，因为你将 `x` 的现有值乘以 `5`。\n\n### 除等号 `/=`\n\n```\n$x /= 5;\n```\n\n在上面的示例中，`x`\
  \ 变为 `1`，因为你将 `x` 的现有值除以 `5`。\n\n### 取模等号 `%=`\n\n```\n$x %= 5;\n```\n\n在上面的示例中，`x`\
  \ 变为 `0`，因为你正在寻找 `(5/5)` 中的余数。\n\n\n\n\n现在我们已经回顾了所有用于处理变量的操作符，让我们来看处理变量的一些特殊情况。首先，如果你想将两个字符串连接在一起，方法是将它们拼接（将它们连接在一起），只需简单地使用\
  \ `.` 运算符即可。\n\n例如：\n\n```php\n$x = \"Hello\";\n$y = \"World\";\n$line = $x.\" \"\
  .$y;\necho $line;\n```\n\n在这种情况下，`line` 的值将是不带引号的“Hello World”。\n\n下一个特殊情况是尝试将一个字符串和一个数字相加。例如：\n\
  \n```php\n$line = 15.“test”;\n```\n\n变量 `line` 现在将持有不带引号的值“15test”，因为 PHP 不理解你为什么要尝试向字符串中添加一个数字，所以它在后台会自动将其处理为如下形式：\n\
  \n```php\n$line = “15”. “test”;\n```\n\n记住在 PHP 中，你可以动态更新变量，例如：\n\n```php\n$x; //\
  \ 未定义\n$x = 10; // x 是一个数字\n$x = “This is text”; // x 现在是一个字符串\n```\n\n在整个指南中，你会看到我使用双引号来表示字符串\
  \ - 实际上并不重要 - 你也可以使用单引号来声明字符串变量。单引号和双引号使用的用点在于，如果你在字符串变量外部使用双引号，并想在内部使用它，PHP 就会产生困惑，因此为了避免混淆，你需要在让\
  \ PHP 字符串变量产生困惑的双引号之前放置一个转义字符：`\\\\`，这会在输出字符串时简单地跳过该双引号并忽略 `\\\\`。另一种方法是简单地用单引号包裹你的字符串变量，这样就可以在字符串变量内部使用双引号而不会让\
  \ PHP 产生困惑——反之亦然。\n\n示例：\n\n```php\n$text = \"It’s great to learn!\"; // 双引号内有单引号\n\
  $text = \"Their name is ‘Microsoft’\"; // 双引号内单引号\n$text = 'Their name is “Microsoft”';\
  \ // 单引号内双引号\n```\n\n# 第 6 章\n\n## 布尔逻辑\n\n布尔值（Boolean）是一个持有 `true` 或 `false` 值的变量——这些变量可以通过操作来在逻辑上拆解条件以做出决策。\n\
  \n### If 语句\n\n简单来说，`if` 语句用于检查某物是真还是假。要创建一个 `if` 语句，你只需要编写单词 `if` 后跟着两个圆括号。`if`\
  \ 语句内部的块是在满足 `if` 语句的条件时将执行的代码块。`if` 语句还可以包含 `else if` 语句和 `else` 语句。当 `if` 语句返回假时，`else\
  \ if` 语句将运行。然而，它也包含自己的参数，该参数必须返回真。`else` 语句同样在 `if` 语句返回假时被调用，`else` 语句与 `else if`\
  \ 语句的区别在于，`else` 语句的运行不需要任何参数为真。\n\n示例：\n\n```php\n$a = 10;\n$b = 20;\nif ($a ==\
  \ $b) {\n    echo(\"a is equal to b \");\n}\nelse if ($a > $b) {\n    echo(\"a is\
  \ greater than b \");\n}\nelse {\n    echo(\"a is not equal to b or greater than\
  \ b \");\n}\n```\n\n此示例中使用的操作符（`==` 和 `>`）在下文中解释。在以下代码中，我们首先检查 `a` 是否等于 `b`。如果为真，只需打印“a\
  \ is equal to b”并忽略其余代码。如果 `a` 不等于 `b`，它将向下执行并调用 `else if`。`else` 是由于第一个 `if` 返回了假。`else\
  \ if` 的 `if` 部分会检查它自己的参数，恰好是 `a` 是否大于 `b`。如果 `a` 大于 `b`，我们就会打印“a is greater than\
  \ b”。然而，由于 `a` 小于 `b`，我们继续向下并简单地调用 `else`。当所有上述参数都返回假时，`else` 运行。它不需要自己的参数为真。注意，每个\
  \ `if` 语句后面都可以跟跟无限数量的 `else if` 语句，但只能有一个 `else` 语句。同样注意，你不能在 `if` 语句和 `else` 语句之间放置代码，因为代码将找不到\
  \ `else`。此外，`else` 语句要求在其之前有一个 `if` 语句，因为为了调用 `else` 语句，其前的 `if` 语句必须为假。同样重要的是，在另一个\
  \ `if` 语句**内部**包含一个 `if` 语句是可能的。这被称为**嵌套嵌套 if 语句**。\n\n示例：\n\n```php\n$a = 20;\n\
  $b = 30;\nif ($a == 20) {\n    if ($a < $b) {\n        echo(\"a is less than b and\
  \ it is equal to 20\");\n    }\n}\n```\n\n在这个示例中，我们首先检查 `a` 的值是否等于 `b` 的值。如果是，我们再检查\
  \ `a` 的值是否小于 `b` 的值。如果是这种情况，我们会打印“a is less than b and it is equal to 20”。\n\n###\
  \ 关系运算符\n\nPHP 支持 6 种关系运算符，用于比较变量的值：\n\n`==`：此运算符检查两个值是否相等。如果相等，它返回真。如果不相等，它返回假。\n\
  \n示例：\n\n```php\n$a = 10;\n$b = 10;\nif ($a == $b) {\n    echo(\"they are the same\"\
  );\n}\n```\n此代码检查 `a` 是否等于 `b`。如果为真，则括号内的代码将执行。\n\n`!=`：此运算符检查两个值是否不相等。如果不相等，它返回真。如果相等，它返回假。\n\
  \n示例：\n\n```php\n$a = 10;\n$b = 20;\nif ($a != $b) {\n    echo(\"they are not the\
  \ same\");\n}\n```\n此代码检查 `a` 是否等于 `b`。由于 `a` 不等于 `b`，它打印“they are not the same”。\n\
  \n`>`：此运算符检查一个值是否大于另一个。如果运算符前面的变量大于后面变量的值，它返回真。如果前面的小于后面的，它返回假。\n\n示例：\n\n```php\n\
  $a = 20;\n$b = 10;\nif ($a > $b) {\n    echo(\"a is larger than b\");\n}\nelse {\n\
  \    echo(\"a is not larger than b\");\n}\n```\n此示例检查 `a` 是否大于 `b`。由于 `a` 大于 `b`，`if`\
  \ 语句返回真。\n\n`<`：此运算符检查一个值是否小于另一个。如果运算符前面的变量小于后面变量的值，则代码返回真；否则，它返回假。\n\n示例：\n\n```php\n\
  $a = 10;\n$b = 20;\nif ($a < $b) {\n    echo(\"a is smaller than b\");\n}\nelse\
  \ {\n    echo(\"a is not smaller than b\");\n}\n```\n此示例检查 `a` 是否小于 `b`。由于 `a` 小于\
  \ `b`，`if` 语句返回真。\n\n\n\n\n`>=` 此运算符用于检查某个值是否大于或等于另一个值。如果运算符前面的变量值大于或等于后面的变量，它将返回\
  \ `true`。如果后面的变量大于但不等于前面的变量，则它将返回 `false`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\n\
  if ($a >= $b) {\n    echo(\"a is larger or equal to b\");\n} else {\n    echo(\"\
  a is not larger or equal to b\");\n}\n```\n在这个示例中，`$a` 和 `$b` 的值均为 20。虽然 `$a` 不大于\
  \ `$b`，但它等于 `$b`，因此该语句返回 `true`，代码最终打印 \"a is larger or equal to b\"。\n\n`<=` 此运算符用于检查某个值是否小于或等于另一个值。如果运算符前面的变量值小于或等于后面的变量，它将返回\
  \ `true`。如果后面的变量小于但不等于前面的变量，则它将返回 `false`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\n\
  if ($a <= $b) {\n    echo(\"a is larger than b\");\n} else {\n    echo(\"a is not\
  \ larger than b\");\n}\n```\n这个示例与上一个相同，只是运算符从 `>=` 更改为了 `<=`。虽然运算符变了，但结果是相同的。由于\
  \ `$a` 等于 `$b`，这段代码将返回 `true`，并打印 \"a is larger than b\"。\n\n## 逻辑运算符\n\nPHP 支持\
  \ 3 种可以在逻辑中使用使用的逻辑运算符，它们通常与关系运算符结合使用。\n\n`&&` 这被称为逻辑与（AND）运算符。如果该运算符前后的操作数都返回 `true`，则条件返回\
  \ `true`。如果两个操作数都为 `false`，或者其中一个操作数为 `false`，条件将返回 `false`。**两个**操作数都必须为 `true`，条件才会返回\
  \ `true`。\n\n示例：\n```php\n$a = 20;\n$b = 20;\nif ($a == 20 && $a == $b) {\n    echo(\"\
  a is equal to 20 and b \");\n} else {\n    echo(\"a is not equal to 20 or a is not\
  \ equal to b\");\n}\n```\n在这个示例中，我们检查 `$a` 是否等于 20，**并且** `$a` 是否等于 `$b`。这两个条件被称为操作数。由于\
  \ `$a` 等于 20 且等于 `$b`，该语句返回 `true`，我们在控制台打印 \"a is larger than b\"。\n\n示例 2：\n```php\n\
  $a = 20;\n$b = 30;\nif ($a == 20 && $a == b) {\n    echo(\"a is equal to 20 and\
  \ b\");\n} else {\n    echo(\"a is not equal to 20 or a is not equal to b\");\n\
  }\n```\n在下一个示例中，我们检查的内容与第一个示例完全相同。然而，这次的区别在于我们将 `$b` 的值从 20 更改为了 30。这意味着当我们运行这段代码时，if\
  \ 语句将返回 `false`，因为尽管 `$a` 等于 20，但它并不等于 `$b`。因此我们打印出 \"a is not equal to 20 or a\
  \ is not equal to b\"。请注意顺序并不重要。如果第一个操作数是 `false` 而不是第二个，我们将得到相同的结果。\n\n`||` 运算符被称为逻辑或（OR）运算符。如果第一个操作数**或者**第二个操作数为\
  \ `true`，语句将返回 `true`。这意味着如果第一个操作数返回 `false` 而第二个为 `true`，语句仍然会返回 `true`，反之亦然。如果两个操作数都为\
  \ `true`，语句也会返回 `true`。本质上，当使用或运算符时，至少有一个必须返回 `true`。\n\n示例：\n```php\n$a = 20;\n\
  $b = 30;\nif ($a == 20 || $a == $b) {\n    echo(\"a is equal to 20 or b\");\n} else\
  \ {\n    echo(\"a is not larger than b\");\n}\n```\n在这个示例中，我们检查 `$a` 是否等于 20，**或者**\
  \ `$a` 是否等于 `$b`。在这种情况下，`$a` 等于 20 但不等于 `$b`。由于这些操作数中只需要一个为 `true`，整个语句将返回 `true`。因此程序将打印\
  \ \"a is equal to 20 or b\"。\n\n示例 2：\n```php\n$a = 20;\n$b = 20;\nif ($a == 20\
  \ || $a == $b) {\n    echo(\"a is equal to 20 and b \");\n} else {\n    echo(\"\
  a is not equal to 20 or b \");\n}\n```\n在这个示例中，我将上一个示例中 `$b` 的值从 30 改为了 20。这意味着\
  \ `$a` 等于 20 且 `$a` 等于 `$b`。两个操作数都返回 `true`，因此语句返回 `true`。这是因为或运算符要求 1 个或多个运算符为\
  \ `true`。此程序将在控制台输出 \"a is equal to 20 and b\"。\n\n`!` 此运算符被称为逻辑非（NOT）运算符。它用于反转其操作数的逻辑状态。该操作数可以与其他任何操作数配合使用以反转其输出。如果操作数返回\
  \ `true`，在应用逻辑非运算符后，该操作数将返回 `false`。\n\n示例：\n```php\n$a = 21;\n$b = 20;\nif ( !(a\
  \ == 20) && $a > b) {\n    echo(\"a is not equal to 20, and a is greater than b\"\
  );\n} else {\n    echo(\"a is equal to 20, and a is not greater than b \");\n}\n\
  ```\n在这个示例中，我们检查 `$a` 的值是否等于 20，并检查 `$a` 是否大于 `$b`。由于 `$a` 既不等于 20 又大于 `$b`，我们可以在控制台打印\
  \ \"a is not equal to 20, and a is greater than b\"。\n\n示例 2：\n```php\n$a = 21;\n\
  $b = 20;\nif ( !(a == 20 && $a > $b) ) {\n    echo(\"a is not equal to 20, and a\
  \ is greater than b \");\n} else {\n    echo(\"a is equal to 20, and a is not greater\
  \ than b \");\n}\n```\n在这个示例中，我改变了括号的位置，使其逻辑非运算符扩展到两个操作数。现在要使语句为 `true`，`$a` 必须不等于\
  \ 20 且 `$a` 大于 `$b`。在这种情况下，语句将返回 `false`，因为 `$a` 大于 `$b`。由于操作数的影响，它需要小于 `$b` 才能返回\
  \ `true`。因此此程序将返回 \"a is equal to 20, a is greater than b\"。\n\n## 组合运算符\n\n在 PHP\
  \ 中，可以使用你需要的任意运算符。\n\n示例：\n```php\n$a = 21;\n$b = 20;\nif ((a == 20 && $a > $b)\
  \ || ($a != 20 && $a < $b)) {\n    echo(\"correct\");\n} else {\n    echo(\"wrong\"\
  );\n}\n```\n通过这个示例，我们可以看到如何实现更复杂的语句。在这里，我们对两个操作数使用了或运算符，然而每个操作数内部又包含了一个逻辑与运算符。因此，要使该语句返回\
  \ `true`，`$a` 必须等于 20 且大于 `$b`，或者 `$a` 不等于 20 且小于 `$b`。请注意，我们使用括号是为了让代码更易理解，并防止代码误读我们的逻辑。\n\
  \n\n\n\n在上面的示例中，我们通过仅切换括号的位置就显著改变了程序的逻辑。注意现在括号包围了两个内部操作数，而不是两对括号包围着每对外部操作数。要让此语句现在返回\
  \ `true`，必须有 3 个不同的条件返回 `true`。变量 `a` 必须等于 `20`，并且 `a` 必须大于 `b` 或者不等于 `20`；并且 `a`\
  \ 必须小于 `b`。根据这个新逻辑，第一个操作数必须为真，且第二个或第三个操作数中必须有一个为真。此外，`a` 必须小于 `b`。该语句将返回 `false`。它将通过第一个条件，因为\
  \ `a` 不等于 `20`。它将通过第二个条件，因为它大于 `b`，但会在最后一个条件失败，因为 `a` 并不小于 `b`。由于这需要三个正确的条件，而只有一个符合，因此语句返回\
  \ `false` 并打印“wrong”。\n\n## 赋值\n\n我们现在将完成另一个作业，以确保我们理解了关于运算符的所有内容。我们有三个朋友想知道他们的钱和其他人相比有多少。我们将编写一个程序，输出谁比谁富有。我们将有三个名为\
  \ `bob`、`john` 和 `tom` 的整数。我们将给他们每一个人分配一个不同的值，程序必须输出谁更富有。它还必须告诉我们是否有人的金额相同。\n\n\
  例如：\n\n如果 `bob = 20`，`tom = 10` 且 `john = 5`，输出必须是：\n“bob 比 tom 富，而 tom 比 john 富”\n\
  \n但但如果 `bob = 20`，`tom = 20` 且 `john = 5`，输出必须是：\n“bob 和 tom 一样富有，他们都比 john 富”\n\
  \n程序需要适用于每可能的结果。我强烈建议你自己尝试运行这个程序，并在查看答案之前尽可能地努力解决它。编程的很大一部分是解决问题和理解代码，因此我建议你先尝试自己想出来。\n\
  \n## 答案与解释\n\n注意，程序将通过代码中的注释进行解释。\n\n```php\n// 可以随意更改这些值\n\n$tom = 10; // tom 拥有的钱\n\
  $bob = 20; // bob 拥有的钱\n$john = 10; // john 拥有的钱\n\n/* 我们首先检查是否每个人的金额都相同\n * 注意我从未检查过\
  \ tom 是否等于 john，因为如果\n * tom 等于 bob 且 bob 等于 john，那么显然\n * tom 等于 john\n */\nif\
  \ ($tom == $bob && $bob == $john) {\n    echo(\"Everyone has the same amount of\
  \ money\");\n}\n\n/*\n * 如果第一个语句返回 false\n * 我接下来检查特殊情况，即 tom 和 bob 的金额相同\n * 而\
  \ john 不是\n */\nelse if ($tom == $bob && $bob != $john) {\n    /*\n    * 现在我检查 bob\
  \ 是否大于小于 john\n    * 然后输出正确的答案\n    */\n    if ($bob > $john) {\n        echo(\"\
  tom is just as rich as bob, both are richer than john\");\n    } else if ($bob <\
  \ $john) {\n        echo(\"tom is just as rich as bob, both are more poor than john\"\
  );\n    }\n}\n\n/*\n * 我重复与上一个相同的过程，但针对不同的人\n */\nelse if ($tom == $john && $john\
  \ != $bob) {\n    if ($john > $bob) {\n        echo(\"tom is just as rich as john,\
  \ both are richer than bob\");\n    } else if ($john < $bob) {\n        echo(\"\
  tom is just as rich as john, both are more poor than bob\");\n    }\n}\n\n/*\n *\
  \ 最后一组名字组合，\n * 与上一个语句相同\n */\nelse if ($john == $bob && $bob != $tom) {\n    if\
  \ ($bob > $tom) {\n        echo(\"bob is just as rich as john, both are richer than\
  \ tom\");\n    } else if ($bob < $tom) {\n        echo(\"bob is just as rich as\
  \ john, both are more poor than tom\");\n    }\n}\n\n/*\n * 现在我检查最后可能的组合\n * 即每个人的金额都不同\n\
  \ * 下六个语句涵盖了每可能的结果\n */\nelse if ($tom > $bob && $bob > $john) {\n    echo(\"tom\
  \ is richest, followed by bob, followed by john\");\n} else if ($tom > $john &&\
  \ $john > $bob) {\n    echo(\"tom is richest, followed by john, followed by bob\"\
  );\n} else if ($bob > $tom && $tom > $john) {\n    echo(\"bob is richest, followed\
  \ by tom, followed by john\");\n} else if ($bob > $john && $john > $tom) {\n   \
  \ echo(\"bob is richest, followed by john, followed by tom\");\n} else if ($john\
  \ > $bob && $bob > $tom) {\n    echo(\"john is richest, followed by bob, followed\
  \ by tom\");\n} else if ($john > $tom && $tom > $bob) {\n    echo(\"john is richest,\
  \ followed by tom, followed by bob\");\n}\n```\n\n编写代码时，对所有逻辑进行注释是非常重要的，这样没有写代码的人就可以轻松理解并编辑它。我建议在编写代码时，根据你认为所需的程度进行注释。我也鼓励你尝试找到更好的解决问题的方法。也许你可以用四分之一的长度来编写它。\n\
  \n# 第 7 章 循环与数组\n\n指南的这一部分很重要，因为它涵盖了编程中一个最重要的概念。循环（Loops）正如其名所示——它们是允许你根据要求，按一定次数运行特定代码块的函数。在介绍数组之前，我们先介绍循环的工作原理。\n\
  \n## 循环\n\nPHP 中的循环与许多其他编程语言基本相同。其语法也相当直观。在每个循环中，都设置了一个条件供循环检查其是否为真，直到情况发生反转时，循环本身才会退出。例如，如果你创建一个循环并要求它在停止前运行特定代码块\
  \ 10 次，有几种方法可以实现，因为有不同类型的循环。循环的一般思路如下：\n\n```php\nLoop (condition) {\n    // 代码块\n\
  }\n```\n\n\n\n为了在 PHP 中创建循环（Loop）——我们必须理解不同类型的循环以及它们的适用场景。让我们来看看这些循环类型，然后我将在讲解过程中解释它们各自是如何运作的，到结束时，你应该已经对循环的工作原理有一个良好的理解。\n\
  \n### For 循环 (For Loops)\n\n```php\nfor ($x = 0; $x < 10; $x++) {\n    echo(\"Hi\
  \ \".$x);\n}\n```\n\n上面的示例中发生了很多操作，所以让我们逐行分析。第一行写道：\n\n`for ($x = 0; $x < 10; $x++)`\n\
  \n在上述语句中，这是 `for` 循环的常规标准。我们必须首先声明变量，所以让我们从声明变量 `x` 开始，并将其设置为从 0 开始的 `int`（整数）。接下来，让我们添加一个分号，通过添加条件将\
  \ `for` 循环的特定部分隔离开。这就是为什么我写了 `$x < 10`，它简单表示只要 `x` 小于 10，就运行我大括号（`{` 和 `}`）下面的代码块。该语句现在由另一个分号隔开，以便进入\
  \ `for` 循环的最后一个元素。这部分是你告诉你声明的特定变量执行特定的算术操作。在这种情况下，我们告诉 `x` 在每次循环通过时递增。\n\n让我们用伪代码（英语可读方式）来过一遍：\n\
  \n```pseudocode\nfor (声明变量; 为变量创建条件; 影响变量) {\n    // 运行此代码块\n}\n```\n\n一旦运行了代码块，它将返回第一个语句并检查条件仍然满足。它将跳过变量声明，因为它会注意到变量已经声明过了。然后它将在检查条件是否满足之前跳到影响变量的部分。\n\
  \n以下是适用于 `for` 循环或任何循环可以遵循的蓝图：\n\n声明变量 → 检查条件 → 运行代码块 → 影响变量 → 检查条件 → 运行代码块 → 影响变量\
  \ → 检查条件 → 运行代码块 → 从“影响变量”开始重复\n\n现在让我们回看我们对 alert 进行稍小修改后创建的代码：\n\n```php\nfor\
  \ ($x = 0; $x < 10; $x++) {\n    echo(\"Current Number: \".$x);\n}\n```\n\n我们可以看到这个循环简单地将\
  \ `x` 从 0 递增到 9，所以从技术上是有 10 次迭代，因为 0 是包含在内的。因此，循环输出如下内容：\n\nCurrent Number: 0\n\
  Current Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent\
  \ Number: 5\nCurrent Number: 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number:\
  \ 9\n\n记得我说过 `for` 循环的最后一个语句是对已声明变量的算术操作吗——很好，变量可以以任何方式受到影响，如果你愿意，也可以每次递增 2。\n\n\
  现在我们知道了 `for` 循环是如何工作的，理解 `while` 循环和 `do-while` 循环的工作原理就会变得容易。\n\n### While 循环\
  \ (While Loop)\n\n`while` 循环与 `for` 循环的唯一区别在于它只带有循环条件而不包含变量。因此，你必须在循环内部影响变量以执行特定条件之前，先在循环范围之外声明变量。\n\
  \n例如：\n\n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"Current number: \".$x);\n\
  \    $x++;\n}\n```\n\n在上面的示例中，如所示，`while` 循环简单地检查条件，当满足条件时运行代码块，然后影响变量 `x`，这样在代码块执行完成后它会返回检查条件，并继续这样做直到\
  \ `x` 不小于 10。它的输出与 `for` 循环的输出相同：\n\nCurrent Number: 0\nCurrent Number: 1\nCurrent\
  \ Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent Number: 5\nCurrent Number:\
  \ 6\nCurrent Number: 7\nCurrent Number: 8\nCurrent Number: 9\n\n这个 `while` 循环可能会出现问题，比如意外创建无限循环。例如：\n\
  \n```php\n$x = 0;\nwhile ($x < 10) {\n    echo(\"Current number: \".$x);\n}\n```\n\
  \n在上面的示例中，它执行的操作与上一个循环完全一样，但输出（即显示某些文本）会无限次显示，因为变量 `x` 永远没有受到影响。\n\n我们将涵盖的最后一种循环类型是\
  \ `do-while` 循环。这种循环执行 `while` 循环所做的一切，但它至少会执行一次。\n\n例如：\n\n```php\n$x = 0;\ndo\
  \ {\n    echo(\"Current number: \".$x);\n    $x++;\n} while ($x < 10);\n```\n\n\
  上面的示例无论条件如何都会至少运行代码块，这在检查条件之前执行某些很有用。\n\n### Continue 关键字 (Continue Keyword)\n\n\
  `continue` 关键字用于你想跳过循环的迭代时。例如：\n\n```php\n$x = 0;\nwhile ($x < 10) {\n    if ($x\
  \ == 5) {\n        continue;\n    }\n    echo($x);\n}\n```\n\n在上面的示例中，我们正在检查 `x`\
  \ 是否等于 5，如果是的话，我们就会跳过该迭代，这意味着此循环的输出变为：\n\nCurrent Number: 0\nCurrent Number: 1\n\
  Current Number: 2\nCurrent Number: 3\nCurrent Number: 4\nCurrent Number: 6\nCurrent\
  \ Number: 7\nCurrent Number: 8\nCurrent Number: 9\n\n如上面的输出所示，循环在 5 处跳过，因为它没有机会显示该数字。\n\
  \n### Break 关键字 (Break Keyword)\n\n`break` 关键字用于你想跳出循环时。例如：\n\n```php\n$x = 0;\n\
  while ($x < 10) {\n    if ($x == 5) {\n        break;\n    }\n    echo($x);\n}\n\
  ```\n\n在上面的示例中，我们正在检查 `x` 是否等于 5，如果是的话我们就会跳出循环，这意味着此循环的输出变为：\n\nCurrent Number:\
  \ 0\nCurrent Number: 1\nCurrent Number: 2\nCurrent Number: 3\nCurrent Number: 4\n\
  \n如上面的输出所示，循环在达到此处时跳出，基本上是停止继续运行。\n\n## 数组 (Arrays)\n\n编程中的数组是有用的，因为它允许你创建字符串/数字/对象或你可以想到的任何数据类型的列表。再次，这最初可能并不明显，但当你开始编程并意识到某些情况下你可能需要数组时，你就明白了。所以数组基本上是一个包含多个单独访问值的单个变量。让我们来看看数组声明语法是如何工作的。\n\
  \n为了声明变量，你必须执行以下操作：\n\n```php\n$names = array(\"John\", \"Bob\", \"Tom\");\n```\n\
  \n在上面的示例中，我们正在声明一个名为 `names` 的变量，然后为它分配了一个值列表，这些值是字符串类型。因此，为了给数组赋值，我们添加了 `array()`，它只是设置了数组的边界。然后，我们通过给每个元素加上引号并指定数组类型为字符串，并在每个元素之间添加逗号以表示它是数组中的不同元素。\n\
  \n为了从数组访问特定的元素值，我们使用以下语法：\n\n\n\n\n\n```php\necho($names[0]);\n```\n\n在上面的示例中，我们正在做的是输出数组索引为\
  \ 0 的值。在数组中，我们通过索引值来引用数组的值——而索引值从 0 开始。因此，“John”是索引 0，“Bob”是索引 1，而“Tom”是索引 2。数组本身的长度为\
  \ 3。为了获取数组的长度，我们使用以下属性：\n\n```php\necho(count($names));\n```\n\n由于通常的来说，数组都是对象（你稍后将学习到这意味着什么），它们拥有变量和函数，而长度是数组的一个属性，因此可以通过\
  \ `names` 变量来访问它，因为它是一个数组类型的变量。这段代码的输出将是 3，因为它会将数组的第一个元素计为 1，然后是 2，以此以此类推。\n\n现在，假设我们想声明一个数组，但在代码的稍后部分之前不给它分配任何值。那么你可以执行以下操作：\n\
  \n```php\n$names = [];\n$names[0] = \"John\";\n$names[1] = \" Bob\";\n$names[2]\
  \ = \"Tom\";\n```\n\n在上面的示例中，我们正在声明一个空数组，并准备向其中添加元素，我们通过引用一个尚不存在的索引并赋予它一个特定的值来实现。现在，我们可以引用\
  \ `names` 数组的索引并检索出分配给它的相应值。\n\n```php\necho($names[0]);\n```\n\n上面的示例现在返回“John”，因为它被赋值了字符串\
  \ John。需要注意的是点是，你可以简单地通过对想要覆盖的特定索引使用赋值运算符来覆盖索引值，然后赋予它其他值。\n\n声明 PHP 数组的另一种方法是执行以下操作：\n\
  \n```php\n// 声明带有键 (KEY) 和值 (VALUE) 的关联数组\n$students_array = array(\n    \"John\"\
  \ => \"84\",\n    \"Bob\" => \"87\",\n    \"Jane\" => \"91\",\n    \"Thomas\" =>\
  \ \"94\",\n    \"Matthew\" => \"92\",\n    \"Peter\" => \"76\"\n);\n// 显示整个 students_array\n\
  echo \"John has an average of: \" . $students_array[\"John\"] . \".\";\nprint_r($students_array);\n\
  ```\n\n输出：\nJohn has an average of: 84\nArray ([John] => 84 [Bob] => 87 [Jane] =>\
  \ 91 [Thomas] => 94 [Matthew] => 92 [Peter] => 76)\n\n关联数组是一种持有键的数组，而键又持有值，要引用数组的值，你只需引用键的名字。这是声明关联数组的另一种方法：\n\
  \n```php\n<?php\n// 逐个赋值\n$cart_array[\"cereal\"] = \"5.00\";\n$cart_array[\"coffee\
  \ beans\"] = \"2.50\";\n$cart_array[\"bananas\"] = \"3.50\";\n$cart_array[\"onion\"\
  ] = \"1.00\";\n$cart_array[\"lettuce\"] = \"2.40\";\n$cart_array[\"tomato\"] = \"\
  1.00\";\necho \"John has an average of: \" . $students_array[\"John\"] . \".\";\n\
  print_r($students_array);\nprint_r($cart_array);\n?>\n```\n\n输出：\nJohn has an average\
  \ of: 84\nArray ([John] => 84 [Bob] => 87 [Jane] => 91 [Thomas] => 94 [Matthew]\
  \ => 92 [Peter] => 76)\n\n现在，拥有数组并能够存储姓名、社会安全号等大型数据库——这确实很棒——但想象一下尝试通过指定数组索引并检索值来手动打印所有这些值。嗯，让我们想想，如果我想从数组的多个索引值中打印多个值，那么我必须输出数组的所有索引，因此我得出结论，我可以使用循环（Loop）来影响索引变量，从而输出并检索数组的值。例如：\n\
  \n```php\n$names = array(\"John\", \"Bob\", \"Tom\");\nfor ($i = 0; $i < count($names);\
  \ $i++) {\n    echo($names[$i]);\n}\n```\n\n在上面的示例中，我们声明了一个名为 `names` 的变量，并带有三个值\
  \ \"John\"\"Bob\" 和 \"Tom\"——一旦数组变量被设置。我们正在循环 `i` 变量，直到它到达数组长度之前（数组中持有的元素数量），以便打印它们。然后，我们通过在数组名称旁边的括号中放置\
  \ `i` 来输出数组的索引值，以便引用特定索引，相应地打印名称。所以这段代码的输出将是：\n\nJohn\nBob\nTom\n\n通过我们对数组和循环的理解，已经成功地将它们的使用结合起来，输出数组中的所有元素。将循环和数组结合工作的概念只是你使用循环或数组来实现你所想要的事情的一种方法。编程的核心理念源于跳出框架思考，决定你如何操作数字、字符串以及语言的功能，以计算你想要实现的目标算法（算法：完成目标所需的一系列步骤）。\n\
  \n## 多维数组\n\n多维数组在编程中非常有用。它们实际上是嵌套在单个数组中的数组。每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
  \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
  \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
  \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
  \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
  \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
  \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
  \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
  \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
  \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n每一层数组都是一个维度。在这种情况下，我们使用两个维度。我们可以创建一个多维数组：\n\
  \n```php\n$employees = array(\n    'names' => array('John','Peter'),\n    'salaries'\
  \ => array('40000', '25000')\n);\n```\n\n为了访问数组，你可以执行以下操作：\n\n```php\nprint $employees['names'][0];\
  \ // John\nprint $employees['salaries'][0]; // 40000\n```\n\n## 第 8 章：函数与类\n\n函数是一段可以在程序中任何一点通过单行代码运行的代码块，并且你可以根据需要多次使用它。要创建一个函数，只需编写\
  \ `function`、一个变量名，然后是圆括号，紧接着是大括号，其中包含你的代码。\n\n```php\nfunction printSomething()\
  \ {\n    echo(\"Something I guess? don’t know...\");\n}\n```\n\n这是一个非常简单的函数。在普通括号之间，你可以放置变量名。这些被称为参数。这些参数允许你给代码提供值，从而可能产生不同的输出。\n\
  \n```php\nfunction printSomething($times) {\n    for($i = 0; $i < $times; $i++)\
  \ {\n        echo(\"Mum!\");\n    }\n}\n```\n\n这个函数使用一个名为 `times` 的变量，运行指定次数的循环，并在每个循环中打印“Mum!”。所以如果你运行这段代码并传入值\
  \ 7，“Mum!”将打印 7 次。你可以有任意数量的参数（尽管越少越好）。只需用逗号分隔每个变量名即可。\n\n```php\nfunction printSomething($times,\
  \ $whatToPrint) {\n    for($i = 0; $i < $times; $i++) {\n        echo($whatToPrint);\n\
  \    }\n}\n```\n\n\n\n此函数将根据 `times` 设置的次数，打印出 `whatToPrint` 设置的任何内容。那么我们如何使用这段代码呢？要让这段代码运行，只需输入函数名，后面跟着括号，括号内包含用逗号隔开的值，这些值应该与函数的用途相关。例如，对于我们的函数，第一个参数是\
  \ `times` 变量，因此我们应该只给第一个参数传递一个数字作为值，具体来说是一个整数（尽管在这种情况下，数字是否为整数并不重要）。同样，对于第二个参数，我们应该放入我们想要打印的内容。这被称为“调用”函数。\n\
  \n```\necho(7.\"I like to move it, move it!\");\n```\n\n我们可以根据需要、在任何时间、多次调用我们的函数。函数的一个有趣点点是，在设置变量时，你可以将函数作为值，然后通过这些变量调用它们。调用函数与将其作为值使用的区别在于：在调用函数时，你使用带有参数的括号；而将函数作为值使用时，不需要放置括号。\n\
  \n## 返回值\n\n函数的一个重要特性是可以“返回”（return）值。这意味着函数在被调用时将作为返回的值。要返回一个值，只需使用 `return` 关键字，后跟一个值。这是一个示例。要使用返回的值，只需将函数调用想象成返回的值即可。\n\
  \n```php\nfunction calculateHalfCircumference($radius)\n{\n    return 3.14*$radius;\n\
  }\n\n$circumference = 2*calculateHalfCircumference(7);\n\necho($circumference);\n\
  ```\n\n在这个示例中，我们创建了一个函数，并返回周长的一半（我不知道你为什么要这么做，但为了示例，我们将这样做）。在函数外部，我们创建了一个变量，并将其设置为函数返回值的两倍，我们知道这将是圆的周长。这意味着我们得到了总周长并将其打印出来。\n\
  \n返回还有一个次要功能：它会停止函数的执行。这意味着假设你的函数中有一个运行很长的循环（Loop），但你希望它在运行完一个 `if` 语句后停止。只需使用 `return`\
  \ 关键字，它就会停止循环剩余部分的运行。`return` 关键字也不需要返回任何值。你可以单独使用 `return` 关键字来在函数的任何位置结束其执行。\n\
  \n```php\nfunction kindaUseless($number)\n{\n    $i = 0;\n    while(true)\n    {\n\
  \        $i++;\n        if($number == $i)\n        {\n            echo($i);\n  \
  \          echo(\"That’t the best way to do that\");\n            return;\n    \
  \    }\n    }\n}\n```\n\n这不是一个非常有用的示例，但它展示了语法。这个循环只要条件为 `true` 就会一直运行。这个循环将永远运行。我们还创建了一个名为\
  \ `$i` 的变量。在每次迭代中，我们检查查找的数字是否等于 `$i`。如果是，我们就打印出 `$i` 以及一些关于这个函数的内容。最后，我们返回该函数。由于函数在返回后会停止执行，因此跳出了无限循环，我们的程序可以继续运行。这在那些想要限制迭代次数的情况下非常有用。例如，如果你在数组中搜索某个东西，并找到了它，你可能希望在当时直接返回，以避免更多次数的迭代。\n\
  \n当你的代码变得很长时，函数是非常实用的。与其在整个代码中编写相似的代码，不如使用一个函数将代码编写一次，并在需要运行的地方调用。函数还允许我们像注释一样使代码更清晰，但它是代码形式的。\n\
  \n### 示例 1（基础函数）：\n```php\nfunction SaySomething() {\n    echo \"Hello world!\"\
  ;\n}\nSaySomething();\n```\n\n### 示例 2（传递参数）：\n```php\nfunction Birthday($name,\
  \ $year) {\n    echo $name.\"Born in\".$year.\"<br>\";\n}\nBirthday(\"John\", 1987);\n\
  ```\n\n### 示例 3（默认参数值）：\n```php\nfunction SetFavoriteColor($color = white) {\n \
  \   echo \"The color is : $color <br>\";\n}\nSetFavoriteColor(); // 使用默认值 white\n\
  ```\n\n### 示例 4（返回值）：\n```php\nfunction Add($fNum, $sNum) {\n    $sum = $fNum +\
  \ $sNum;\n    return $sum;\n}\necho (5+10);\n```\n\n### 类\n\n接下来让我们来说类：类类是将具有目的函数聚集在一起的部分。要创建一个类，你需要使用\
  \ `class` 关键字，后跟类名，然后是大括号。在类内部，你可以拥有函数和变量。\n\n类的目标是组织你的代码并允许变量是全局的。例如，我们创建一个名为 `Marks`\
  \ 的类。\n\n```php\nclass Marks {\n    var $studentName;\n    var $average;\n}\n```\n\
  \n在上面的代码中，首先发生的是我们创建一个名为 `$studentName` 的全局变量，还没有给它赋值。对 `$average` 也是如此。变量的目标是允许老师输入学生和平均分。老师可以随地获取值。\n\
  \n```php\nclass Marks {\n    var $studentName;\n    var $average;\n\n    function\
  \ setStudentName($name) {\n        $studentName = $name;\n    }\n\n    function\
  \ setStudentAverage($avg) {\n        $average = $avg;\n    }\n\n    function getStudentName()\
  \ {\n        return $studentName;\n    }\n\n    function getStudentAverage() {\n\
  \        return $average;\n    }\n}\n```\n\n\n\n\n为了解释上述每个功能：我们做的第一件事是创建一个名为 `setStudentName`\
  \ 的函数，它接受一个变量名为 `$name` 的参数，然后将类变量 `$studentName` 设置为输入的变量名。接着，我们的下一个函数思路与上一个方法相同，只是它允许老师输入学生的平均分。然后，我们将类变量赋值为输入到函数中的变量。最后，为了获取变量的值，我们创建一个名为\
  \ `getStudentName` 的函数，它只需返回类中 `$studentName` 变量的值。我们对 `getStudentAverage` 函数应用了相同的理念，它只需返回类中变量\
  \ `$average` 的学生平均分。\n\n现在，为了实际引用该类及其变量/方法，我们必须在类定义之外的 PHP 执行代码中使用特殊语法。为了引用一个类，我们必须创建一个对象，对象基本上是一个持有类的变量，因为类可以被视为一个对象，因为它包含了函数/属性/变量，使其具有独特性。为了实际创建这个对象，我们必须使用\
  \ `new` 关键字，它基本上在任何声明类/对象时使用。例如：\n\n```php\n<?php\nclass Marks {\n    var $studentName;\n\
  \    var $average;\n    function setStudentName($name) {\n        $studentName =\
  \ $name;\n    }\n    function setStudentAverage($avg) {\n        $average = $avg;\n\
  \    }\n    function getStudentName() {\n        return $studentName;\n    }\n \
  \   function getStudentAverage() {\n        return $average;\n    }\n}\n// $objectName\
  \ = new Marks(); 类声明的示例结构\n?>\n```\n\n现在，为了创建这个对象，我们将执行以下操作：\n\n```php\n<?php\n\
  class Marks {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
  \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
  \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n        return\
  \ $studentName;\n    }\n    function getStudentAverage() {\n        return $average;\n\
  \    }\n}\n$marksObject = new Marks();\n?>\n```\n\n现在我们已经知道如何引用类了，那么如何引用类内部的内容呢？我们使用一个连字符和一个指向右侧的箭头（->）来表示对象到达某个变量/函数必须经过的路径。例如：\n\
  \n```php\n<?php\nclass Marks {\n    var $studentName;\n    var $average;\n    function\
  \ setStudentName($name) {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
  \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n        return\
  \ $studentName;\n    }\n    function getStudentAverage() {\n        return $average;\n\
  \    }\n}\n$marksObject = new Marks();\n// 我想让 marksObject 引用 $studentName 并将其输出……\n\
  ?>\n```\n\n为了实际实现，你必须执行以下操作：\n\n```php\n<?php\nclass Marks {\n    var $studentName;\n\
  \    var $average;\n    function setStudentName($name) {\n        $studentName =\
  \ $name;\n    }\n    function setStudentAverage($avg) {\n        $average = $avg;\n\
  \    }\n    function getStudentName() {\n        return $studentName;\n    }\n \
  \   function getStudentAverage() {\n        return $average;\n    }\n}\n$marksObject\
  \ = new Marks();\necho ($marksObject -> studentName);\n?>\n```\n\n在上面的代码中，`$marksObject`\
  \ 引用了 `studentName` 变量而没有美元符号，因为你不需要使用它。我们告诉类引用其内部的变量名 `studentName` 并将其输出。但由于 `studentName`\
  \ 还没有由用户设置，它将无法输出正确的值。你可能想到的另一个问题是，如果我们直接引用变量 `studentName` 而不是使用函数来获取值，那么我们为什么还要创建一个函数来做这件事呢？嗯，其实并没有特殊理由——这仅仅是一种惯例，也是为了演示目的，向你展示类和函数如何协同工作的概念。\n\
  \n现在，为了实际引用一个函数，你与引用变量时的操作是相同的，但这次你需要在所引用的内容末尾加上括号，以指定你指向的是函数而不是变量名。\n\n```php\n\
  <?php\nclass Marks {\n    var $studentName;\n    var $average;\n    function setStudentName($name)\
  \ {\n        $studentName = $name;\n    }\n    function setStudentAverage($avg)\
  \ {\n        $average = $avg;\n    }\n    function getStudentName() {\n        return\
  \ $studentName;\n    }\n    function getStudentAverage() {\n        return $average;\n\
  \    }\n}\n?>\n```\n\n\n\n\n\n## 字符串函数\n\n`chunk_split()` 根据预定的 ASCII 估值返回字符\n\n\
  `chunk_split()` 将字符串分割成一系列较小的部分\n\n`convert_cyr_string()` 将字符串从一种西里尔字母集转换到另一种\n\n\
  `convert_uudecode()` 解码一个经过 uuencode 编码的字符串\n\n`convert_uuencode()` 利用 uuencode\
  \ 计算对字符串进行编码\n\n`count_chars()` 返回用于字符串字符串的字符统计数据\n\n`crc32()` 计算字符串的 32 位的 CRC\
  \ 值\n\n`tomb()` 受限的字符串加密（哈希）\n\n`reverberation()` 产生一个或多个字符串\n\n`blast()` 将字符串拆分为一个簇\n\
  \n`fprintf()` 将格式化后的字符串组合并输出到预定的输出流中\n\n`get_html_translation_table()` 返回 `htmlspecialchars()`\
  \ 和 `htmlentities()` 使用的解释表\n\n`hebrev()` 将希伯来文内容转换为视觉内容\n\n`hebrevc()` 将希伯来文内容转换为视觉内容，并将换行符（`\\\
  n`）转换为 `<br>`\n\n`hex2bin()` 将十六进制属性字符串转换为 ASCII 字符\n\n`html_entity_decode()` 将\
  \ HTML 实体转换为字符\n\n`htmlentities()` 将字符转换为 HTML 实体\n\n`htmlspecialchars_decode()`\
  \ 将某些预定义的 HTML 实体转换为字符\n\n`htmlspecialchars()` 将某些预定义的字符转换为 HTML 元素\n\n`implode()`\
  \ 将数组组件组合成一个字符串\n\n`join()` `implode()` 的别名\n\n`lcfirst()` 将字符串的第一个字符转换为小写\n\n`levenshtein()`\
  \ 返回两个字符串之间的 Levenshtein 距离\n\n`localeconv()` 返回与区域相关的数字和货币相关的组织数据\n\n`ltrim()`\
  \ 从字符串的左侧移除空格或不同的字符\n\n`md5()` 计算字符串的 MD5 哈希值\n\n`md5_file()` 确定文件的 MD5 哈希值\n\n\
  `metaphone()` 确定字符串的元音键\n\n`money_format()` 返回一个格式化为货币字符串的字符串\n\n`nl_langinfo()`\
  \ 返回特定的区域数据\n\n`nl2br()` 在字符串每个换行符前面嵌入 HTML 换行符\n\n`number_format()` 形成带有千分位分隔符的数字\n\
  \n`ord()` 返回字符串第一个字符的 ASCII 估值\n\n`parse_str()` 将查询字符串解析为变量\n\n`print()` 产生一个或多个字符串\n\
  \n`printf()` 产生一个格式化的字符串\n\n`quoted_printable_decode()` 将引义的可打印字符串转换为 8 位字符串\n\n\
  `quoted_printable_encode()` 将 8 位字符串转换为引义的可打印字符串\n\n`quotemeta()` 对元字符进行转义\n\n`rtrim()`\
  \ 从字符串的右侧移除空格或不同的字符\n\n`setlocale()` 设置区域数据\n\n`sha1()` 计算字符串的 SHA-1 哈希值\n\n`sha1_file()`\
  \ 计算文件的 SHA-1 哈希值\n\n`similar_text()` 计算两个字符串之间的相似度\n\n`soundex()` 计算字符串的 soundex\
  \ 键\n\n`sprintf()` 将格式化后的字符串组合到变量\n\n`sscanf()` 按照格式从字符串中解析数据\n\n`str_getcsv()`\
  \ 将 CSV 字符串解析为一个簇\n\n`str_ireplace()` 在字符串中替换某些字符（不区分大小写）\n\n`str_pad()` 将字符串填充到另一个长度\n\
  \n`str_repeat()` 按指定的次数重复字符串\n\n`str_replace()` 在字符串中替换某些字符（区分大小写）\n\n`str_rot13()`\
  \ 对字符串执行 ROT13 编码\n\n`str_shuffle()` 随机重排字符串中的所有字符\n\n`str_split()` 将字符串分割为一个簇\n\
  \n`str_word_count()` 计算字符串中的单词数量\n\n`strcasecmp()` 比较两个字符串（不区分大小写）\n\n`strchr()`\
  \ 在另一个字符串中找到字符串的第一次出现（`strstr()` 的别名）\n\n`strcmp()` 比较两个字符串（区分大小写）\n\n`strcoll()`\
  \ 比较两个字符串（基于区域的字符串比较）\n\n`strcspn()` 返回在字符串中找到任何预定义字符中的片段之前的字符数量\n\n`strip_tags()`\
  \ 从字符串中移除 HTML 和 PHP 标签\n\n`stripcslashes()` 反转用 `addcslashes()` 转义的字符串\n\n`stripslashes()`\
  \ 反转用 `addslashes()` 转义的字符串\n\n`stripos()` 返回字符串在另一个字符串中第一次出现的位置（不区分大小写）\n\n`stristr()`\
  \ 在另一个字符串中找到字符串的第一次出现（不敏感/不区分大小写）\n\n`strlen()` 返回字符串的长度\n\n`strnatcasecmp()` 利用“自然排序”计算分析两个字符串（不区分大小写）\n\
  \n`strnatcmp()` 利用“自然排序”计算分析两个字符串（区分大小写）\n\n`strncasecmp()` 前 n 个字符的字符串相关性（不区分大小写）\n\
  \n`strncmp()` 前 n 个字符的字符串相关性（区分大小写）\n\n`strpbr()` 查找字符串是否包含字符集中的任何字符\n\n`strpos()`\
  \ 返回字符串在另一个字符串中第一次出现的位置（区分大小写）\n\n`strrchr()` 在另一个字符串中找到字符串的最后一次\n\n`strrev()` 反转字符串\n\
  \n`strripos()` 在另一个字符串中找到字符串的最后一次的位置（不区分大小写）\n\n`strpos()` 返回字符串在另一个字符串中最后一次的位置（区分大小写）\n\
  \n`strspn()` 返回字符串中包含预定义字符的字符数量\n\n## 数值函数\n\n`abs()` 返回数字的绝对值（正估值）\n\n`acos()`\
