  \ - 返回 `e` (PHP 4)\n- `M_EULER`: 0.57721566490153286061 - 返回欧拉常数 (PHP 4)\n- `M_LNPI`:\
  \ 1.144729885849001744 - 返回 PI 的自然对数：`log_e(pi)` (PHP 5.2)\n- `M_LN2`: 0.693147180599453092\
  \ - 返回 2 的自然对数：`log_e 2` (PHP 4)\n- `M_LN10`: 2.3025850929940456402 - 返回 10 的自然对数：`log_e\
  \ 10` (PHP 4)\n- `M_LOG2E`: 1.426950408889634074 - 返回以 2 为底的 E 数：`log_2 e` (PHP\
  \ 4)\n- `M_LOG10E`: 0.4342944819032518275 - 返回以 10 为底的 E 数：`log_10 e` (PHP 4)\n\
  - `M_PI`: 3.14159265358979323846 - 返回 Pi (PHP 4)\n- `M_PI_2`: 1.57079632679489661923\
  \ - 返回 `Pi/2` (PHP 4)\n- `M_PI_4`: 0.78539816339744830962 - 返回 `Pi/4` (PHP 4)\n\
  - `M_1_PI`: 0.31830988618379067154 - 返回 `1/Pi` (PHP 4)\n- `M_2_PI`: 0.63661977236758134308\
  \ - 返回 `2/Pi` (PHP 4)\n- `M_SQRTPI`: 1.7724538509051602729 - 返回 PI 的平方根：`sqrt(pi)`\
  \ (PHP 5.2)\n- `M_2_SQRTPI`: 1.1283791670951257390 - 返回 2 除以 PI 的平方根：`2/sqrt(pi)`\
  \ (PHP 4)\n- `M_SQRT1_2`: 0.7071067811865475244 - 返回 1 除以 2 的平方根\n\n\n\n\n\n```php\n\
  <?php\n$server_name = \"localhost\";\n\n$username = \"username\";\n\n$password =\
  \ \"password\";\n\n// 连接\n$con = new mysqli($server_name, $username, $password);\n\
  \n// 检查连接\nif ($con->connect_error) {\n    die(\"Connection failed: \" . $con->connect_error);\n\
  }\n\n// 创建数据库\n$sql = \"CREATE DATABASE dbName\";\nif ($con->query($sql) === TRUE)\
  \ {\n    echo \"Database created successfully\";\n} else {\n    echo \"Error creating\
  \ database: \" . $con->error;\n}\n$con->close();\n?>\n```\n\n### 非对象格式示例\n\n```php\n\
  <?php\n$server_name = \"localhost\";\n\n$username = \"username\";\n$password = \"\
  password\";\n\n// 连接\n$con = mysqli_connect($server_name, $username, $password);\n\
  \n// 检查连接\nif (!$con) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n\
  }\n\n// 创建数据库\n$sql = \"CREATE DATABASE dbName\";\nif (mysqli_query($con, $sql))\
  \ {\n    echo \"Database created successfully\";\n} else {\n    echo \"Error creating\
  \ database: \" .mysqli_error($con);\n}\nmysqli_close($con);\n?>\n```\n\n现在我们已经创建了数据库，可以继续在数据库中创建一个表。该表将包含数据的列和行。为了做到这一点，我们必须理解\
  \ MySQL 查询语言的工作原理。同样，我们将在阅读和练习的过程中逐渐熟悉它。在这种情况下，查询字符串为：\n\n```sql\nCREATE TABLE Employee_table\
  \ (\nid INT(6) UNSIGNED AUTO_INCREMENT PRIMARY KEY,\nfirstname VARCHAR(30) NOT NULL,\n\
  lastname VARCHAR(30) NOT NULL,\nemail VARCHAR(50),\nbirth_date TIMESTAMP\n```\n\n\
  现在这看起来很复杂，其实非常简单——记住；如果你忘记了任何语法，可以随时参考文档，因为文档详尽且易于阅读。如所示，每个表都应该有一个主键列（在本例中为 `ID`），它的值会随表中的每个新记录或行而改变。\n\
  \n创建表的第一个元素是使用 `CREATE TABLE` 关键字并对其进行命名。接下来，我们使用普通括号来包围我们想要添加到表的所有不同列。要实现这一点，我们只需命名我们想要添加的列，然后添加我们希望它的数据类型。稍后我会列出所有数据类型，在此之前，让我们先看看数据类型之后编写的内容：\n\
  \n在数据类型之后，你可以为每列列指定其他属性（可选）：\n\n- `NOT NULL` - 每个段都必须包含该区域的值，不允许无效属性。\n- `DEFAULT`\
  \ - 设置在没有传递其他值时包含的默认值。\n- `UNSIGNED` - 用于数字排序，强制将设置的数据为正数和零。\n- `AUTO INCREMENT`\
  \ - 每当包含另一个记录时，MySQL 实际上会将该字段的估值增加 1。\n- `PRIMARY KEY` - 用于在表上唯一地识别部分。设置了 `PRIMARY\
  \ KEY` 的部分通常是一个 ID 数字，并且会被频繁使用。\n\n现在实际上在数据库中实现表的创建，以下是代码中的实现方式：\n\n### 对象格式示例\n\
  \n```php\n<?php\n$server_name = \"localhost\";\n\n$username = \"username\";\n$password\
  \ = \"password\";\n$dbname = \"dbName\";\n\n// 连接\n$con = new mysqli($server_name,\
  \ $username, $password, $dbname);\n\n// 检查连接\nif ($con->connect_error) {\n    die(\"\
  Connection failed: \" . $con->connect_error);\n}\n$sql = \"INSERT INTO Employee_table\
  \ (firstname, lastname, email)\nVALUES ('Bob', 'Doe', 'bob@hotmail.com')\";\n$con->close();\n\
  ?>\n```\n\n### 非对象格式示例\n\n```php\n<?php\n$server_name = \"localhost\";\n\n$username\
  \ = \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// 连接\n$con\
  \ = mysqli_connect($server_name, $username, $password, $dbname);\n\n// 检查连接\nif\
  \ (!$con) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n$sql\
  \ = \"INSERT INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob', 'Doe',\
  \ 'bob@hotmail.com')\";\nmysqli_close($con);\n?>\n```\n\n## SQL 数据类型\n\n现在，是 MySQL\
  \ 中使用的以下数据类型：\n\n- **Text**: 用于内容或内容与数字的混合。最大 255 个字符。\n- **Memo**: Memo 用于较大规模的内容。最多\
  \ 65,536 个字符。注意：你不能对备注字段排序。在任何情况下，它们都是可的。\n- **Byte**: 允许 0 到 255 的之间的整数（1 字节）。\n\
  - **Integer**: 允许 -32,768 到 32,767 之间的整数（2 字节）。\n- **Long**: 允许 -2,147,483,648 到\
  \ 2,147,483,647 之间的整数（4 字节）。\n- **Single**: 精确点。将处理大多数小数（4 字节）。\n- **Double**: 浮点数。将处理大多数小数（8\
  \ 字节）。\n- **Currency**: 用于现金。持有多达 15 位美元，外加 4 位小数（8 字节）。\n- **AutoNumber**: 给每个记录分配一个它自己的编号，通常从\
  \ 1 开始（4 字节）。\n- **Date/Time**: 用于日期和时间（8 字节）。\n- **Yes/No**: 逻辑字段可以显示为 Yes/No、True/False\
  \ 或 On/Off。在代码中，利用常量 True 和 False（对应于 -1 和 0）。注意：Yes/No 字段中不允许 Null 属性（1 位）。\n-\
  \ **Ole Object**: 可以存储图片、声音、功能或高达 1GB 的不同 `BLOBs`。\n- **Hyperlink**: 包含到不同记录的连接，包括页面。\n\
  - **Lookup Wizard**: 允许你编写选择列表，然后可以下拉列表（4 字节）。\n\n## SQL 基础排序\n\n在 MySQL 中有三种基础排序：内容、数字和\
  \ Date/Time 排序。\n\n- `CHAR(size)`: 持有一个修改后的字符串（可以包含字母、数字和特殊字符）。修改后的尺寸在括号中指定。可以存储\
  \ 255 个字符。\n- `VARCHAR(size)`: 持有一个变长度字符串（可以包含字母、数字和特殊字符）。最大尺寸在括号中指定。可以存储 255 个字符。注意：如果你放入大于\
  \ 255 的值，它将变为 `TEXT` 排序。\n- `TINYTEXT`: 持有一个最大长度为 255 个字符的字符串。\n- `TEXT`: 持有一个最大长度为\
  \ 65,535 个字符的字符串。\n- `BLOB`: 用于 `BLOBs`（二进制大对象）。持有 65,535 字节的信息。\n- `MEDIUMTEXT`:\
  \ 持有一个最大长度为 16,777,215 个字符的字符串。\n- `MEDIUMBLOB`: 用于 `BLOBs`（二进制大对象）。持有高达 16,777,215\
  \ 字节的信息。\n- `LONGTEXT`: 持有一个最大长度为 4,294,967,295 个字符的字符串。\n- `LONGBLOB`: 用于 `BLOBs`（二进制大对象）。持有高达\
  \ 4,294,967,295 字节的信息。\n- `ENUM(x,y,z,etc.)`: 允许你输入属性列表。你可以在 `ENUM` 列表中列最多 65535\
  \ 个属性。如果嵌入了不在列表中的属性，将嵌入空值。注意：属性按照你输入的顺序排序。你以这种组织方式输入可能的值：`ENUM('X','Y','Z')`。\n\
  - `SET`: 与 `ENUM` 相似，但 `SET` 最多可以包含 64 个属性并可以存储多个决策。\n- `TINYINT(size)`: -128 到\
  \ 127 典型值。0 到 255 `UNSIGNED`。最大位数在括号中指定。\n- `SMALLINT(size)`: -32,768 到 32,767 典型值。0\
  \ 到 65,535 `UNSIGNED`。最大位数在括号中指定。\n\n\n\n\n\n`MEDIUMINT(size)` 典型范围 -8388608 到 8388607。0\
  \ 到 16777215 为 UNSIGNED\\*。极端的位数可以在括号中确定。\n\n`INT(size)` 典型范围 -2147483648 到 2147483647。0\
  \ 到 4294967295 为 UNSIGNED\\*。极端的位数可以在括号中确定。\n\n`BIGINT(size)` 典型范围 -9223372036854775808\
  \ 到 9223372036854775807。0 到 18446744073709551615 为 UNSIGNED\\*。极端的位数可以在括号中确定。\n\n\
  `FLOAT(size,d)` 带有带有浮点小数点的小型数字。最大位数由 `size` 参数决定。小数点一侧的最大位数由 `d` 参数指定。\n\n`DOUBLE(size,d)`\
  \ 带有漂移小数点的巨大数字。最大位数由 `size` 参数指定。小数点一侧的最大位数由 `d` 参数决定。\n\n`DECIMAL(size,d)` 一个被存储为字符串的\
  \ `DOUBLE`，考虑了修改的小数点。最大位数由 `size` 参数决定。小数点一侧的最大位数由 `d` 参数指定。\n\n\\*整数类型有一个名为 `UNSIGNED`\
  \ 的额外选项。通常，数字从负值范围到正值。包含 `UNSIGNED` 特性会将该范围向上移动，使其从零而不是负数开始。\n\n`DATE()` 日期。格式：YYYY-MM-DD\n\
  \n注意：支持范围从 '1000-01-01' 到 '9999-12-31'。\n\n`DATETIME()` \\*日期和时间的混合体。格式：YYYY-MM-DD\
  \ HH:MI:SS\n\n注意：支持范围从 '1000-01-01 00:00:00' 到 '9999-12-31 23:59:59'。\n\n`TIMESTAMP()`\
  \ \\*时间戳。`TIMESTAMP` 特性存储为自 Unix 纪（'1970-01-01 00:00:00' UTC）之后的秒数。设计：YYYY-MM-DD\
  \ HH:MI:SS\n\n注意：支持范围从 '1970-01-01 00:00:01' UTC 到 '2038-01-19 03:14:07' UTC。\n\n\
  `TIME()` 时间。格式：HH:MI:SS\n\n注意：支持范围从 '-83:59:59' 到 '83:59:59'。\n\n`YEAR()` 两位或四位设计的年份。\n\
  \n注意：四位设计中允许的值：1901 到 2155。两位设计中允许的数值：70 到 69，即 1970 年到 2069 年。\n\n\\*即使 `DATETIME`\
  \ 和 `TIMESTAMP` 返回相同的格式，它们的工作方式也是出乎意料的。在 `INSERT` 或 `UPDATE` 中，`TIMESTAMP` 自然地将其设置为当前日期和时间。`TIMESTAMP`\
  \ 同样有不同的配置，如 `YYYYMMDDHH`、`YYMMDDHH`、`YYYYMMDD` 或 `YYMMDD`。\n\n## SQL Server 数据类型\n\
  \n### 字符串类型\n\n| 信息类型 | 说明 | 存储 |\n| :--- | :--- | :--- |\n| `char(n)` | 固定长度字符字符串。最大\
  \ 8,000 个字符 | 定义宽度 |\n| `varchar(n)` | 变长度字符字符串。最大 8,000 个字符 | 2 字节 + 长度 |\n| `varchar(max)`\
  \ | 变长度字符字符串。最大 1,073,741,824 个字符 | 2 字节 + 长度 |\n| `text` | 变长度字符字符串。最大 2GB 的内容数据\
  \ | 4 字节 + 长度 |\n| `nchar` | 固定长度 Unicode 字符串。最大 4,000 个字符 | 定义宽度 x 2 |\n| `nvarchar`\
  \ | 变长度 Unicode 字符串。最大 4,000 个字符 | |\n| `nvarchar(max)` | 变长度 Unicode 字符串。最大 536,870,912\
  \ 个字符 | |\n| `ntext` | 变长度 Unicode 字符串。最大 2GB 的内容信息 | |\n| `bit` | 允许 0, 1 或 NULL\
  \ | |\n| `binary(n)` | 固定长度二进制字符串。最大 8,000 字节 | |\n| `varbinary` | 变长度二进制字符串。最大\
  \ 8,000 字节 | |\n| `varbinary(max)` | 变长度二进制字符串。最大 2GB | |\n| `image` | 变长度二进制字符串。最大\
  \ 2GB | |\n\n### 数字类型\n\n| 信息类型 | 说明 | 存储 |\n| :--- | :--- | :--- |\n| `tinyint`\
  \ | 允许从 0 到 255 的整数 | 1 字节 |\n| `smallint` | 允许在 -32,768 到 32,767 之间的整数 | 2 字节 |\n\
  | `int` | 允许 -2,147,483,648 到 2,147,483,647 之间的整数 | 4 字节 |\n| `bigint` | 允许 -9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 之间的整数 | 8 字节 |\n| `decimal(p,s)` | 固定精度和标度的数字。允许 -10³⁸+1\
  \ 到 10³⁸-1 之间的数字。`p` 参数显示可以存储的最大位数（包括小数点两侧）。`p` 必须是 1 到 38 之间的值。默认为 18。`s` 参数显示小数点右一侧存储的最大位数。`s`\
  \ 必须是 0 到 `p` 之间的数值。默认为 0 | 5-17 字节 |\n| `numeric(p,s)` | 固定精确度和标度的数字。允许 -10³⁸+1\
  \ 到 10³⁸-1 之间的数字。`p` 参数演示了可以存储的最大总位数（包括小数点两侧）。`p` 必须是 1 到 38 之间的值。默认为 18。`s` 参数显示小数点右一侧存储的最大位数。`s`\
  \ 必须是 0 到 `p` 之间的数值。默认为 0 | 5-17 字节 |\n| `smallmoney` | 从 -214,748.3648 到 214,748.3647\
  \ 的货币信息 | 4 字节 |\n| `money` | 从 -922,337,203,685,477.5808 到 922,337,203,685,477.5807\
  \ 的货币信息 | 8 字节 |\n| `float(n)` | 从 -1.79E+308 到 1.79E+308 的浮点精确数字信息。`n` 参数演示字段应占用\
  \ 4 还是 8 字节。`float(24)` 占用 4 字节字段，`float(53)` 占用 8 字节字段。`n` 的默认值为 53 | 4 或 8 字节\
  \ |\n| `real` | 从 -3.40E+38 到 3.40E+38 的浮点精确数字信息 | 4 字节 |\n| `datetime` | 从 1753-01-01\
  \ 到 9999-12-31，精度为 3.33 毫秒 | 8 字节 |\n| `datetime2` | 从 0001-01-01 到 9999-12-31，精度为\
  \ 100 纳秒 | 6-8 字节 |\n| `smalldatetime` | 从 1900-01-01 到 2079-06-06，精度为 1 分钟 | 4\
  \ 字节 |\n| `date` | 存储日期。从 0001-01-01 到 9999-12-31 | 3 字节 |\n| `time` | 存储时间，精度为\
  \ 100 纳秒 | 3-5 字节 |\n| `datetimeoffset` | 与 `datetime2` 相同，增加了时间偏移量 | 8-10 字节 |\n\
  | `timestamp` | 存储一个特殊数字，每当列创建或更改时都会重新设计。时间戳值基于内部时钟且不进行比较。每个表只能有一个 timestamp 变量\
  \ | |\n\n\n\n\n\n你需要注意的下一点是，每当你想要插入字符串类型（文本）的信息时，必须将其用引号括起来。例如，如果你想在第一个列（first name）的第二条记录（行）中插入数据，并将其从“Peter”改为“John”——那么你必须使用引号来标出这条新信息。同样，一旦我们实际上开始编写用于此类操作的查询，这对你来说将更有意义。此外，我刚刚解释的是在数据库中更新数据的概念，这正是我们在本指南此章节之后很快要讨论的内容。\n\
  \n接下来，你必须记住的下一个语法规则是，如果你正在更新或插入任何数值类型的数据，则不能加引号。在许多编程语言中（包括 `PHP`），当你声明变量时，如果变量值是数字，你不需要给它的值加引号。这样，程序就可以区分文本（string）和数字（int/double/float）之间的区别。\n\
  \n最后，如果你想设置任何内容或添加任何 `NULL`（简单来说就是让该特定区域的记录为空），那么该关键字不能加引号。如果加了引号，它会被误认为是字符串，因此在特定记录中将字面打印出\
  \ `NULL` 这个单词。\n\n现在要实际向表中插入数据，我们必须使用以下格式的查询：\n\n```sql\nINSERT INTO table_name\
  \ (column1, column2, column3)\nVALUES (value1, value2, value3)\n```\n\n在此之前，我们创建了一个名为\
  \ `Employee_table` 的表，包含五个列：“id”、“firstname”、“lastname”、“email”和“birth_date”。\n\n\
  为了通过 `PHP` 代码实际创建它，你必须执行以下操作：\n\n### 面向对象格式示例：\n\n```php\n<?php\n$server_name =\
  \ \"localhost\";\n$username = \"username\";\n$password = \"password\";\n$dbname\
  \ = \"dbName\";\n\n// 建立连接\n$conn = new mysqli($server_name, $username, $password,\
  \ $dbname);\n\n// 检查连接\nif ($conn->connect_error) {\n    die(\"Connection failed:\
  \ \" . $conn->connect_error);\n}\n$sql = \"INSERT INTO Employee_table (firstname,\
  \ lastname, email)\nVALUES ('Bob', 'Doe', 'bob@example.com')\";\n$conn->close();\n\
  ?>\n```\n\n### 非面向对象格式示例：\n\n```php\n<?php\n$server_name = \"localhost\";\n$username\
  \ = \"username\";\n$password = \"password\";\n$dbname = \"dbName\";\n\n// 建立连接\n\
  $conn = mysqli_connect($server_name, $username, $password, $dbname);\n\n// 检查连接\n\
  if (!$conn) {\n    die(\"Connection failed: \" . mysqli_connect_error());\n}\n$sql\
  \ = \"INSERT INTO Employee_table (firstname, lastname, email)\nVALUES ('Bob', 'Doe',\
  \ 'bob@hotmail.com')\";\nmysqli_close($conn);\n?>\n```\n\n关于向 MySQL 插入数据还有很多东西需要学习，但这是一份\
  \ `PHP` 指南，而不是 `MySQL` 指南。让我们回顾理解 MySQL 的最后两个基础步骤。让我们学习如何从表中检索数据或从从表中 `SELECT` 数据。以下是查询格式：\n\
  \n```sql\nSELECT column_name(s) FROM table_name\n```\n\n或者，我们可以使用 `*` 字符来选择表中所有的列：\n\
  \n```sql\nSELECT * FROM table_name\n```\n\n### 面向对象格式示例：\n\n```php\n<?php\n$server_name\
  \ = \"localhost\";\n$username = \"username\";\n$password = \"password\";\n$dbname\
  \ = \"dbName\";\n\n// 建立连接\n$conn = new mysqli($server_name, $username, $password,\
  \ $dbname);\n\n// 检查连接\nif ($conn->connect_error) {\n    die(\"Connection failed:\
  \ \" . $conn->connect_error);\n}\n$sql = \"SELECT column_name(s) FROM table_name\"\
  ;\n$result = $conn->query($sql);\nif ($result->num_rows > 0) {\n    while($row =\
  \ $result->fetch_assoc()) {\n        echo \"id: \" . $row[\"column_name(s)\"].\"\
  <br>\";\n    }\n} else {\n    echo \"0 results\";\n}\n$conn->close();\n?>\n```\n\
  \n\n\n\n我们现在学习了 PHP 和 MySQL 以及它们协作工作时所拥有的底层力量。现在，让我们把所学的知识应用到现实项目中。让我们创建一个登录系统，看看它是如何运行的。我们先从一个简单的\
  \ HTML 表单开始。HTML 表单允许我们向 PHP 发送带有待处理信息的查询。在配置表单属性时有两种方法，该属性被称为 HTTP 请求方法。\n\n##\
  \ HTTP 请求方法\n\nHTTP 请求方法有两种类型：`GET` 和 `POST`。从 PHP 发送信息时，可以请求数据或提交数据。`POST` 提交待处理的数据，而\
  \ `GET` 则是请求数据。当点击表单上的提交按钮时，信息会被传递到 URL，`GET` 方法从 URL 获取信息，并按照代码中编写的方式对其进行处理。另一方面，`POST`\
  \ 不使用 URL 处理数据，而是直接提交数据供 PHP 处理代码。当使用 `GET` 提交表单时，信息将显示在 URL 上，表单的每个键和值之间用 `&` 符号隔开，起始符号为\
  \ `?`。\n\n## 创建 HTML 表单\n\n现在让我们开始创建 HTML 表单。我们必须知道的第一点是表单标签，它可以简单地写为 `<form>` 并以\
  \ `</form>` 。\n\n```html\n<form>\n\n</form>\n```\n\n一旦完成，我们必须定义表单的 `action` 属性。该\
  \ `action` 属性负责告诉表单将页面重定向到哪里，那里将通过指定的方法（`GET` / `POST`）接收表单提交的信息。因此，大多数 `action`\
  \ 属性的值是一个 php 文件。在这种情况下，我们将使用文件名本身：`login.php`。此表单也在文件中创建，因此它本质上会将自己重定向回自身，以便信息发送到文件中的\
  \ PHP 代码。因此，我们将 `action` 属性的值设置为“login.php”。\n\n```html\n<form action = “login.php”>\n\
  \n</form>\n```\n\n接下来，我们必须定义正在使用的方法类型。由于我们想采用更常规的方式提交信息，我们将使用 `POST` 方法。这两种方法都可以完成相同的任务，但\
  \ `GET` 方法存在一些安全问题。由于信息显示在 URL 中，许多人将看到表单中提交的密码。因此，我们将使用更隐蔽的 `POST` 方法。为了实现这一点，我们必须使用\
  \ `method` 表单属性并将值相应设置为 `POST`。\n\n```html\n<form action = “login.php” method =\
  \ “POST”>\n\n</form>\n```\n\n现在我们已经创建了表单的骨架，让我们用文本框填充它，允许用户在其中输入信息。为了创建一个文本框，我们必须使用\
  \ `input` 标签。\n\n```html\n<input>\n```\n\n现在有几个我们需要添加到此 `input` 标签的属性。我们需要查看 `type`、`name`、`id`\
  \ 和 `value` 属性。`type` 属性本质上是告诉文本框它将接收什么类型的输入以及如何解释它。`type` 可以设置为“text”，表示它将接收并显示文本。它也可以设置为“password”，这样它就会处理文本并将其显示为星号。接下来我们看\
  \ `name` 属性。`name` 属性类似于 `id` 标签，它在提交表单通信其值时向 PHP 代码标识其身份。`id` 属性也是如此。`id` 属性用于标识身份。`value`\
  \ 属性则用于设置默认值。最后，我们还需要添加密码框。\n\n```html\n<input type = “text” name = “username” id\
  \ = “username\">\n<input type = “password” name = “password” id = “password\">\n\
  <form action = “login.php” method = “POST”>\n</form>\n\n## PHP 处理\n\n现在我们已经通过通过\
