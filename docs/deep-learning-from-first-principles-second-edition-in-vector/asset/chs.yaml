  \ 7. 梯度下降优化技术\n\n> **人工智能是新电力。–** 安德鲁·吴教授\n>\n> **人类和动物的大部分学习都是无监督学习。如果智力是一块蛋糕，无监督学习就是蛋糕本身，监督学习是蛋糕上的糖霜，强化学习则是糖霜上的樱桃。我们知道如何制作糖霜和樱桃，却不知道如何制作蛋糕。我们需要先解决无监督学习问题，才能考虑实现真正的\
  \ AI。–** Yann LeCun，2016 年 3 月 14 日 (Facebook)\n\n### 1. 简介\n\n在《从原理到深度学习》第 7 章中，我实现了随机梯度下降\
