  ### 5.2 R\n\n```r\n############################################################################################################\n\
  #\n# File : DLfunctions5.R\n# Author : Tinniam V Ganesh\n# Date : 22 Mar 2018\n\
  #\n##########################################################################################################\n\
  \nlibrary(ggplot2)\nlibrary(PRROC)\nlibrary(dplyr)\n\n# 计算向量的 Sigmoid 函数值\nsigmoid\
  \ <- function(Z) {\n  A <- 1 / (1 + exp(-Z))\n  cache <- Z\n  retvals <- list(\"\
  A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n\n# 计算向量的 Relu(旧版) (性能杀手!)\nreluOld <-\
  \ function(Z) {\n  A <- apply(Z, 1:2, function(x) max(0, x))\n  cache <- Z\n  retvals\
  \ <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n\n# 计算向量的 Relu(当前版) (性能好得多!)\n\
  relu <- function(Z) {\n  # 执行 Relu。将小于等于 0 的值设为 0\n  Z[Z < 0] = 0\n  A = Z\n  cache\
  \ <- Z\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n\n# 计算向量的\
  \ Tanh 激活函数值\ntanhActivation <- function(Z) {\n  A <- tanh(Z)\n  cache <- Z\n  retvals\
  \ <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n\n# 计算向量的 Softmax 函数值\nsoftmax\
  \ <- function(Z) {\n  # 获取未归一化的概率\n  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  A\
  \ = exp_scores / rowSums(exp_scores)\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n\
  \  return(retvals)\n}\n\n# 计算 Relu 的导数\n# g'(z) = 1 if z > 0 and 0 otherwise\nreluDerivative\
  \ <- function(dA, cache) {\n  Z <- cache\n  dZ <- dA\n  # 创建一个值 > 0 的逻辑矩阵\n  a <-\
  \ Z > 0\n  # 当 z <= 0 时，也应将 dz 设为 0。执行逐元素乘法\n  dZ <- dZ * a\n  return(dZ)\n}\n\n\
  # 计算 Sigmoid 的导数\n# Derivative g'(z) = a * (1-a)\nsigmoidDerivative <- function(dA,\
  \ cache) {\n  Z <- cache\n  s <- 1 / (1 + exp(-Z))\n  dZ <- dA * s * (1 - s)\n \
  \ return(dZ)\n}\n\n# 计算 Tanh 的导数\n# Derivative g'(z) = 1 - a²\ntanhDerivative <-\
  \ function(dA, cache) {\n  Z = cache\n  a = tanh(Z)\n  dZ = dA * (1 - a²)\n  return(dZ)\n\
  }\n\n# 此函数用于计算 Softmax 导数\n# 在 Y==1 的行中填充 1 矩阵\n# 可能需要扩展以支持 K 个类别。目前\n# 支持 K=3 和\
  \ K=10\npopMatrix <- function(Y, numClasses) {\n  a = rep(0, times = length(Y))\n\
  \  Y1 = matrix(a, nrow = length(Y), ncol = numClasses)\n  # 在 Y 为类别值的行和列设为 1\n \
  \ if (numClasses == 3) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y == 1, 2] = 1\n    Y1[Y\
  \ == 2, 3] = 1\n  } else if (numClasses == 10) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y\
  \ == 1, 2] = 1\n    Y1[Y == 2, 3] = 1\n    Y1[Y == 3, 4] = 1\n    Y1[Y == 4, 5]\
  \ = 1\n    Y1[Y == 5, 6] = 1\n    Y1[Y == 6, 7] = 1\n    Y1[Y == 7, 8] = 1\n   \
  \ Y1[Y == 8, 9] = 1\n    Y1[Y == 9, 0] = 1\n  }\n  return(Y1)\n}\n\n# 计算 Softmax\
  \ 导数\nsoftmaxDerivative <- function(dA, cache, y, numTraining, numClasses) {\n \
  \ # Note : dA not used. dL/dZ = dL/dA * dA/dZ = pi-yi\n  Z <- cache\n  # 计算 Softmax\n\
  \  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  probs = exp_scores / rowSums(exp_scores)\n\
  \  # 创建一个零矩阵\n  Y1 = popMatrix(y, numClasses)\n  dZ = probs - Y1\n  return(dZ)\n\
  }\n\n# 初始化 L 层模型\n# Input : 各层单元数向量\n# Returns: 所有层的初始权重和偏置矩阵\ninitializeDeepModel\
  \ <- function(layerDimensions) {\n  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n\
  \  # 注意第 'l' 层的权重矩阵大小为 (l, l-1)\n  # 偏置是大小为 (l, 1) 的向量\n  # 遍历层维度 1.. L\n  # R 语言索引从\
  \ 1 开始\n  for (l in 2:length(layerDimensions)) {\n    # 初始化大小为 l x l-1 的小随机数矩阵\n\
  \    # 创建大小为 l x l-1 的随机数\n    w = rnorm(layerDimensions[l] * layerDimensions[l-1])\
  \ * 0.01\n    # 用初始权重创建大小为 l x l-1 的权重矩阵并\n    # 加入列表 W1, W2... WL\n    layerParams[[paste('W',\
  \ l-1, sep=\"\")]] = matrix(w, nrow = layerDimensions[l], ncol = layerDimensions[l-1])\n\
  \    layerParams[[paste('b', l-1, sep=\"\")]] = matrix(rep(0, layerDimensions[l]),\
  \ nrow = layerDimensions[l], ncol = 1)\n  }\n  return(layerParams)\n}\n\n# 计算深度网络前向传播中第\
  \ 'l' 层的激活值\n# Input : A_prev - 上一层的激活值\n# W, b - 权重和偏置矩阵及向量\n# activationFunc -\
  \ 激活函数 - sigmoid, tanh, relu 等\n# Returns : forward_cache, activation_cache, cache\n\
  # :\n# Z = W * X + b\n# A = sigmoid(Z), A = Relu(Z), A = tanh(Z)\nlayerActivationForward\
  \ <- function(A_prev, W, b, activationFunc) {\n  # 计算 Z\n  z = W %*% A_prev\n  #\
  \ 按列广播偏置 'b'\n  Z <- sweep(z, 1, b, '+')\n  forward_cache <- list(\"A_prev\" = A_prev,\
  \ \"W\" = W, \"b\" = b)\n  # 计算 Sigmoid 激活值\n  if (activationFunc == \"sigmoid\"\
  ) {\n    vals = sigmoid(Z)\n  } else if (activationFunc == \"relu\") { # 计算 Relu\
  \ 激活值\n    vals = relu(Z)\n  } else if (activationFunc == 'tanh') { # 计算 Tanh 激活值\n\
  \    vals = tanhActivation(Z)\n  } else if (activationFunc == 'softmax') {\n   \
  \ vals = softmax(Z)\n  }\n  # 创建前向和激活缓存列表\n  cache <- list(\"forward_cache\" = forward_cache,\
  \ \"activation_cache\" = vals[['Z']])\n  retvals <- list(\"A\" = vals[['A']], \"\
  cache\" = cache)\n  return(retvals)\n}\n\n# 计算第 1..L 层的前向传播\n# Input : X - 输入特征\n\
  # parameters: 权重和偏置\n# hiddenActivationFunc - relu/sigmoid/tanh\n# outputActivationFunc\
  \ - 隐藏层激活函数 sigmoid/softmax\n# Returns : AL\n# caches\n# 前向传播在第 1..L-1 层使用 Relu/tanh\
  \ 激活，第 L 层使用 Sigmoid 激活\nforwardPropagationDeep <- function(X, parameters, hiddenActivationFunc\
  \ = 'relu', outputActivationFunc = 'sigmoid') {\n  caches <- list()\n  # 设置 A 为\
  \ X (A0)\n  A <- X\n  L <- length(parameters) / 2 # 神经网络层数\n  # 从第 1 层循环到第 L 层\n\
  \  for (l in 1:(L-1)) {\n    A_prev <- A\n    # Zi = Wi x Ai-1 + bi and Ai = g(Zi)\n\
  \    # 设置第 'l' 层的 W 和 b\n    # 遍历 W1, W2... WL-1\n    W <- parameters[[paste(\"\
  W\", l, sep=\"\")]]\n    b <- parameters[[paste(\"b\", l, sep=\"\")]]\n    # 使用激活函数计算第\
  \ 'l' 层的前向传播\n    actForward <- layerActivationForward(A_prev, W, b, activationFunc\
  \ = hiddenActivationFunc)\n    A <- actForward[['A']]\n    # 追加缓存 A_prev, W, b,\
  \ Z\n    caches[[l]] <- actForward\n  }\n}\n```\n\n\n\n\n\n# 既然这是二分类，请在最后一层使用 sigmoid\
  \ 激活函数\n\n## 设置最后一层的权重和偏置\n\n```r\nW <- parameters[[paste(\"W\", L, sep=\"\")]]\n\
  b <- parameters[[paste(\"b\", L, sep=\"\")]]\n```\n\n## 计算 sigmoid 激活\n\n```r\n\
  actForward = layerActivationForward(A, W, b, activationFunc = outputActivationFunc)\n\
  AL <- actForward[['A']]\n```\n\n## 追加通过最后一层的前向传播输出\n\n```r\ncaches[[L]] <- actForward\n\
  ```\n\n## 创建一个包含最终输出和缓存的列表\n\n```r\nfwdPropDeep <- list(\"AL\"=AL, \"caches\"=caches)\n\
  return(fwdPropDeep)\n```\n\n---\n\n# 函数 `pickColumns()`\n\n此函数用于 `computeCost()`\
  \ 中。\n\n## 选取列\n\n**输入**：\n- `AL`\n- `Y`\n- `numClasses`\n\n**输出**：`a`\n\n```r\n\
  pickColumns <- function(AL, Y, numClasses) {\n  if (numClasses == 3) {\n    # 选取\
  \ y 值为 0、1 或 2 的元素并生成一个向量\n    a = c(AL[Y==0,1], AL[Y==1,2], AL[Y==2,3])\n  } else\
  \ if (numClasses == 10) {\n    # 选取 y 值为 0,1,2..,9 的元素\n    a = c(AL[Y==0,1], AL[Y==1,2],\
  \ AL[Y==2,3], AL[Y==3,4], AL[Y==4,5],\n          AL[Y==5,6], AL[Y==6,7], AL[Y==7,8],\
  \ AL[Y==8,9], AL[Y==9,10])\n  }\n  return(a)\n}\n```\n\n---\n\n# 计算代价\n\n## 输入\n\
  - `AL`\n- `Y`\n- `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n- `numClasses`\n\
  \n## 输出\n- `cost`\n\n```r\ncomputeCost <- function(AL, Y, outputActivationFunc=\"\
  sigmoid\", numClasses=3) {\n  if (outputActivationFunc == \"sigmoid\") {\n    m\
  \ = length(Y)\n    cost = -1/m * sum(Y * log(AL) + (1-Y) * log(1-AL))\n  } else\
  \ if (outputActivationFunc == \"softmax\") {\n    # 选取列\n    m = length(Y)\n   \
  \ a = pickColumns(AL, Y, numClasses)\n    # 取对数\n    correct_probs = -log(a)\n \
  \   # 计算损失\n    cost = sum(correct_probs) / m\n  }\n  # cost = -1/m * sum(a+b)\n\
  \  return(cost)\n}\n```\n\n---\n\n# 计算通过一层的反向传播\n\n## 输入\n- 神经网络参数 - `dA`\n- `cache`\
  \ - `forward_cache` 与 `activation_cache`\n- 输出值 `Y`\n- `activationFunc`\n- `numClasses`\n\
  \n## 返回\n- 梯度 - `dA_prev`、`dW`、`db`\n\n**公式**：\n- `dL/dWi = dL/dZi * Al-1`\n- `dl/dbl\
  \ = dL/dZl`\n- `dL/dZ_prev = dL/dZl * W`\n\n```r\nlayerActivationBackward <- function(dA,\
  \ cache, Y, activationFunc, numClasses) {\n  # 获取 A_prev、W、b\n  forward_cache <-\
  \ cache[['forward_cache']]\n  activation_cache <- cache[['activation_cache']]\n\
  \  A_prev <- forward_cache[['A_prev']]\n  numtraining = dim(A_prev)[2]\n\n  # 获取\
  \ Z\n  activation_cache <- cache[['activation_cache']]\n\n  if (activationFunc ==\
  \ \"relu\") {\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if (activationFunc\
  \ == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, Y, numtraining, numClasses)\n  }\n\n  # 检查是否为 softmax\n  if\
  \ (activationFunc == 'softmax') {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n\
  \    dW = 1/numtraining * A_prev %*% dZ\n    db = 1/numtraining * matrix(colSums(dZ),\
  \ nrow=1, ncol=numClasses)\n    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n\
  \    b <- forward_cache[['b']]\n    numtraining = dim(A_prev)[2]\n    dW = 1/numtraining\
  \ * dZ %*% t(A_prev)\n    db = 1/numtraining * rowSums(dZ)\n    dA_prev = t(W) %*%\
  \ dZ\n  }\n\n  retvals <- list(\"dA_prev\"=dA_prev, \"dW\"=dW, \"db\"=db)\n  return(retvals)\n\
  }\n```\n\n---\n\n# 计算通过所有层的 1 个周期的反向传播\n\n## 输入\n- `AL`：L 层网络的输出 - 权重\n- `Y` 真实输出\n\
  - `caches` -- 包含以下内容的缓存列表：\n  - 每个 `layerActivationForward()` 的缓存，激活函数为 \"relu\"\
  /\"tanh\"（即 `caches[[l]]`，l 的范围为 L-1，也就是 l = 0...L-2）\n  - `layerActivationForward()`\
  \ 的缓存，激活函数为 \"sigmoid\"（即 `caches[[L-1]]`）\n- `hiddenActivationFunc` - 隐藏层的激活函数\
  \ - relu/tanh/sigmoid\n- `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n- `numClasses`\n\
  \n## 返回\n- `gradients` -- 包含梯度的列表\n  - `gradients[[\"dA\" + str(l)]]`\n  - `gradients[[\"\
  dW\" + str(l)]]`\n  - `gradients[[\"db\" + str(l)]]`\n\n```r\nbackwardPropagationDeep\
  \ <- function(AL, Y, caches, hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\", numClasses) {\n  # 初始化梯度\n  gradients = list()\n\n  # 设置层数\n  L = length(caches)\n\
  \  numTraining = dim(AL)[2]\n\n  if (outputActivationFunc == \"sigmoid\")\n    #\
  \ 初始化反向传播\n    # dl/dAL = -(y/a) - ((1-y)/(1-a)) - 在输出层\n    dAL = -( (Y/AL) - (1\
  \ - Y)/(1 - AL))\n  else if (outputActivationFunc == \"softmax\") {\n    dAL = 0\n\
  \    Y = t(Y)\n  }\n\n  # 获取最后一层的梯度\n  # 输入：\"AL, Y, caches\"。\n  # 输出：\"gradients[[\"\
  dAL\"]], gradients[[\"dWL\"]], gradients[[\"dbL\"]]\"\n  # 从第 L 层开始\n  # 获取当前缓存\n\
  \  current_cache = caches[[L]]$cache\n\n  # gradients[[\"dA\" + str(L)]], gradients[[\"\
  dW\" + str(L)]], gradients[[\"db\" + str(L)]] =\n  # layerActivationBackward(dAL,\
  \ current_cache, activationFunc = \"sigmoid\")\n  retvals <- layerActivationBackward(dAL,\
  \ current_cache, Y, activationFunc = outputActivationFunc, numClasses)\n\n  # 创建梯度列表\n\
  \  # 注意：取 dA 的转置\n  if (outputActivationFunc == \"sigmoid\")\n    gradients[[paste(\"\
  dA\", L, sep=\"\")]] <- retvals[['dA_prev']]\n  else if (outputActivationFunc ==\
  \ \"softmax\")\n    gradients[[paste(\"dA\", L, sep=\"\")]] <- t(retvals[['dA_prev']])\n\
  \n  gradients[[paste(\"dW\", L, sep=\"\")]] <- retvals[['dW']]\n  gradients[[paste(\"\
  db\", L, sep=\"\")]] <- retvals[['db']]\n\n  # 反向遍历\n  for (l in (L-1):1) {\n  \
  \  # 计算 L-1 到 1 层的梯度，针对 Relu/tanh\n    # 输入：\"gradients[[\"dA\" + str(l + 2)]],\
  \ caches\"。\n    # 输出：\"gradients[[\"dA\" + str(l + 1)]] , gradients[[\"dW\" + str(l\
  \ + 1)]] , gradients[[\"db\" + str(l + 1)]]\"\n    current_cache = caches[[l]]$cache\n\
  \    retvals = layerActivationBackward(gradients[[paste('dA', l+1, sep=\"\")]],\
  \ current_cache, activationFunc = hiddenActivationFunc)\n\n    gradients[[paste(\"\
  dA\", l, sep=\"\")]] <- retvals[['dA_prev']]\n    gradients[[paste(\"dW\", l, sep=\"\
  \")]] <- retvals[['dW']]\n    gradients[[paste(\"db\", l, sep=\"\")]] <- retvals[['db']]\n\
  \  }\n\n  return(gradients)\n}\n```\n\n---\n\n# 执行梯度下降\n\n## 输入\n- 权重和偏置\n- `gradients`\n\
  - `learningRate`\n- `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n\n## 输出\n\
  - `parameters`\n\n```r\ngradientDescent <- function(parameters, gradients, learningRate,\
  \ outputActivationFunc=\"sigmoid\") {\n  L = length(parameters) / 2 # 神经网络中的层数\n\
  \n  # 每个参数的更新规则。使用 for 循环。\n  for (l in 1:(L-1)) {\n    parameters[[paste(\"W\"\
  , l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] - learningRate * gradients[[paste(\"\
  dW\", l, sep=\"\")]]\n    parameters[[paste(\"b\", l, sep=\"\")]] = parameters[[paste(\"\
  b\", l, sep=\"\")]] - learningRate * gradients[[paste(\"db\", l, sep=\"\")]]\n \
  \ }\n\n  if (outputActivationFunc == \"sigmoid\") {\n    parameters[[paste(\"W\"\
  , L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * gradients[[paste(\"\
  dW\", L, sep=\"\")]]\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] - learningRate * gradients[[paste(\"db\", L, sep=\"\")]]\n \
  \ } else if (outputActivationFunc == \"softmax\") {\n    parameters[[paste(\"W\"\
  , L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * gradients[[paste(\"\
  dW\", L, sep=\"\")]]\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] - learningRate * gradients[[paste(\"db\", L, sep=\"\")]]\n \
  \ }\n\n  return(parameters)\n}\n```\n\n---\n\n# 执行 L 层深度学习模型\n\n## 输入\n- `X` - 输入特征\n\
  - `Y` 输出\n- `layersDimensions` - 层的维度\n- `hiddenActivationFunc` - 隐藏层的激活函数 relu/tanh/sigmoid\n\
  - `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n- `learningRate`\n- `numIterations`\n\
  \n## 输出\n- 每次迭代后更新的权重\n\n```r\nL_Layer_DeepModel <- function(X, Y, layersDimensions,\n\
  \                              hiddenActivationFunc='relu', outputActivationFunc=\
  \ 'sigmoid',\n                              learningRate = 0.5,\n              \
  \                numIterations = 10000,\n                              print_cost=FALSE)\
  \ {\n```\n\n\n\n\n\n# 将成本向量初始化为 NULL\n\n```r\ncosts <- NULL\n```\n\n# 参数初始化。\n\n\
  ```r\nparameters = initializeDeepModel(layersDimensions)\n```\n\n# 循环（梯度下降）\n\n\
  ```r\nfor( i in 0:numIterations){\n\n  # 前向传播：[LINEAR -> RELU]*(L-1) -> LINEAR ->\
  \ SIGMOID/SOFTMAX。\n  retvals = forwardPropagationDeep(X, parameters, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc)\n  AL <- retvals[['AL']]\n  caches\
  \ <- retvals[['caches']]\n\n  # 计算成本。\n  cost <- computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions[3])\n\n  # 反向传播。\n  gradients = backwardPropagationDeep(AL,\
  \ Y, caches, hiddenActivationFunc, outputActivationFunc=outputActivationFunc, numClasses=layersDimensions[3])\n\
  \n  # 更新参数。\n  parameters = gradientDescent(parameters, gradients, learningRate,\
  \ outputActivationFunc=outputActivationFunc)\n\n  if(i %% 1000 == 0){\n    costs\
  \ = c(costs, cost)\n    print(cost)\n  }\n}\n\nretvals <- list(\"parameters\"=parameters,\
  \ \"costs\"=costs)\nreturn(retvals)\n```\n\n# 使用随机梯度下降执行 L 层深度学习模型\n\n**输入：**\n\
  - `X` - 输入特征\n- `Y` - 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` -\
  \ 隐藏层激活函数 relu/tanh/sigmoid\n- `outputActivationFunc` - 输出层激活函数 sigmoid/softmax\n\
  - `learning rate` - 学习率\n- `mini_batch_size` - 小批量大小\n- `num of epochs` - 迭代轮数\n\
  \n**输出：** 每次迭代后更新的权重\n\n```r\nL_Layer_DeepModel_SGD <- function(X, Y, layersDimensions,\n\
  \                                  hiddenActivationFunc='relu',\n              \
  \                    outputActivationFunc= 'sigmoid',\n                        \
  \          learningRate = .3,\n                                  mini_batch_size\
  \ = 64,\n                                  num_epochs = 2500,\n                \
  \                  print_cost=FALSE){\n\n  set.seed(1)\n  # 将成本向量初始化为 NULL\n  costs\
  \ <- NULL\n\n  # 参数初始化。\n  parameters = initializeDeepModel(layersDimensions)\n\n\
  \  seed = 10\n\n  # 迭代轮数循环\n  for( i in 0:num_epochs){\n    seed = seed + 1\n  \
  \  minibatches = random_mini_batches(X, Y, mini_batch_size, seed)\n\n    for(batch\
  \ in 1:length(minibatches)){\n      mini_batch_X = minibatches[[batch]][['mini_batch_X']]\n\
  \      mini_batch_Y = minibatches[[batch]][['mini_batch_Y']]\n\n      # 前向传播：\n\
  \      retvals = forwardPropagationDeep(mini_batch_X, parameters, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc)\n      AL <- retvals[['AL']]\n    \
  \  caches <- retvals[['caches']]\n\n      # 计算成本。\n      cost <- computeCost(AL,\
  \ mini_batch_Y, outputActivationFunc=outputActivationFunc, numClasses=layersDimensions[length(layersDimensions)])\n\
  \n      # 反向传播。\n      gradients = backwardPropagationDeep(AL, mini_batch_Y, caches,\
  \ hiddenActivationFunc, outputActivationFunc=outputActivationFunc, numClasses=layersDimensions[length(layersDimensions)])\n\
  \n      # 更新参数。\n      parameters = gradientDescent(parameters, gradients, learningRate,\
  \ outputActivationFunc=outputActivationFunc)\n    }\n\n    if(i %% 100 == 0){\n\
  \      costs = c(costs, cost)\n      print(cost)\n    }\n  }\n\n  retvals <- list(\"\
  parameters\"=parameters, \"costs\"=costs)\n  return(retvals)\n}\n```\n\n# 预测给定输入的输出\n\
  \n**输入：**\n- `parameters` - 参数\n- `X` - 输入\n- `hiddenActivationFunc` - 隐藏层激活函数\n\
  \n**输出：** 预测结果\n\n```r\npredict <- function(parameters, X, hiddenActivationFunc='relu'){\n\
  \  fwdProp <- forwardPropagationDeep(X, parameters, hiddenActivationFunc)\n  predictions\
  \ <- fwdProp$AL > 0.5\n  return (predictions)\n}\n```\n\n# 预测输出\n\n```r\npredictProba\
  \ <- function(parameters, X, hiddenActivationFunc, outputActivationFunc){\n  retvals\
  \ = forwardPropagationDeep(X, parameters, hiddenActivationFunc, outputActivationFunc=\"\
  softmax\")\n  if(outputActivationFunc ==\"sigmoid\")\n    predictions <- retvals$AL\
  \ > 0.5\n  else if (outputActivationFunc ==\"softmax\")\n    predictions <- apply(retvals$AL,\
  \ 1, which.max) - 1\n  return (predictions)\n}\n```\n\n# 绘制决策边界\n\n**注意：** 此函数使用\
  \ `ggplot2`。\n\n```r\nplotDecisionBoundary <- function(z, retvals, hiddenActivationFunc,\
  \ lr){\n  # 查找数据的最小值和最大值\n  xmin <- min(z[,1])\n  xmax <- max(z[,1])\n  ymin <-\
  \ min(z[,2])\n  ymax <- max(z[,2])\n\n  # 创建数值网格\n  a = seq(xmin, xmax, length=100)\n\
  \  b = seq(ymin, ymax, length=100)\n  grid <- expand.grid(x=a, y=b)\n  colnames(grid)\
  \ <- c('x1', 'x2')\n  grid1 <- t(grid)\n\n  # 预测该网格的输出\n  q <- predict(retvals$parameters,\
  \ grid1, hiddenActivationFunc)\n  q1 <- t(data.frame(q))\n  q2 <- as.numeric(q1)\n\
  \  grid2 <- cbind(grid, q2)\n  colnames(grid2) <- c('x1', 'x2', 'q2')\n\n  z1 <-\
  \ data.frame(z)\n  names(z1) <- c(\"x1\", \"x2\", \"y\")\n  atitle = paste(\"Decision\
  \ boundary for learning rate:\", lr)\n\n  # 绘制边界轮廓\n  ggplot(z1) +\n    geom_point(data\
  \ = z1, aes(x = x1, y = x2, color = y)) +\n    stat_contour(data = grid2, aes(x\
  \ = x1, y = x2, z = q2, color=q2), alpha = 0.9) +\n    ggtitle(atitle)\n}\n```\n\
  \n# 预测给定数据集的概率分数\n\n**输入：**\n- `parameters` - 参数\n- `X` - 输入\n\n**输出：** 输出的概率\n\n\
  ```r\ncomputeScores <- function(parameters, X, hiddenActivationFunc='relu'){\n \
  \ fwdProp <- forwardPropagationDeep(X, parameters, hiddenActivationFunc)\n  scores\
  \ <- fwdProp$AL\n  return (scores)\n}\n```\n\n# 创建随机小批量\n\n**输入：**\n- `X` - 输入特征\n\
  - `Y` - 输出\n- `miniBatchSize` - 小批量大小\n- `seed` - 随机种子\n\n**输出：** `mini_batches`\
  \ - 小批量列表\n\n```r\nrandom_mini_batches <- function(X, Y, miniBatchSize = 64, seed\
  \ = 0){\n  set.seed(seed)\n\n  # 获取训练样本数量\n  m = dim(X)[2]\n\n  # 初始化小批量\n  mini_batches\
  \ = list()\n\n  # 创建一个小于 m 的随机数列表\n  permutation = c(sample(m))\n\n  # 随机打乱训练数据\n\
  \  shuffled_X = X[, permutation]\n  shuffled_Y = Y[1, permutation]\n\n  # 计算小批量数量\n\
  \  numCompleteMinibatches = floor(m / miniBatchSize)\n\n  batch = 0\n  for(k in\
  \ 0:(numCompleteMinibatches-1)){\n    batch = batch + 1\n\n    # 设置小批量的下界和上界\n \
  \   lower = (k * miniBatchSize) + 1\n    upper = ((k + 1) * miniBatchSize)\n\n \
  \   mini_batch_X = shuffled_X[, lower:upper]\n    mini_batch_Y = shuffled_Y[lower:upper]\n\
  \n    # 将其添加到小批量列表中\n    mini_batch = list(\"mini_batch_X\"=mini_batch_X, \"mini_batch_Y\"\
  =mini_batch_Y)\n    mini_batches[[batch]] = mini_batch\n  }\n\n  # 如果批量大小不能被小批量大小整除\n\
  \  if(m %% miniBatchSize != 0){\n    p = floor(m / miniBatchSize) * miniBatchSize\n\
  \n    # 设置最后一批的开始和结束\n    q = p + m %% miniBatchSize\n\n    mini_batch_X = shuffled_X[,\
  \ (p+1):q]\n    mini_batch_Y = shuffled_Y[(p+1):q]\n\n    mini_batch = list(\"mini_batch_X\"\
  =mini_batch_X, \"mini_batch_Y\"=mini_batch_Y)\n    mini_batches[[batch]] = mini_batch\n\
  \  }\n\n  # 返回小批量列表\n  return(mini_batches)\n}\n```\n\n### 5.3 Octave\n\n```matlab\n\
  ############################################################################################################\n\
  #\n# File: DLfunctions5.m\n# Developer: Tinniam V Ganesh\n# Date : 23 Mar 2018\n\
  #\n##########################################################################################################\n\
  \n1;\n\n# 定义 Sigmoid 函数\nfunction [A, cache] = sigmoid(Z)\n  A = 1 ./ (1 + exp(-Z));\n\
  \  cache = Z;\nend\n\n# 定义 Relu 函数\nfunction [A, cache] = relu(Z)\n  A = max(0,\
  \ Z);\n  cache = Z;\nend\n\n# 定义 Tanh 函数\nfunction [A, cache] = tanhAct(Z)\n  A\
  \ = tanh(Z);\n  cache = Z;\nend\n\n# 定义 Softmax 函数\nfunction [A, cache] = softmax(Z)\n\
  \  # 获取未归一化的概率\n  exp_scores = exp(Z');\n\n  # 对每个样本进行归一化\n  A = exp_scores ./ sum(exp_scores,\
  \ 2);\n  cache = Z;\nend\n\n# 定义稳定 Softmax 函数\nfunction [A, cache] = stableSoftmax(Z)\n\
  \  # 按每行的最大值进行归一化\n  shiftZ = Z' - max(Z', [], 2);\n  exp_scores = exp(shiftZ);\n\
  \n  # 对每个样本进行归一化\n  A = exp_scores ./ sum(exp_scores, 2);\n  # disp(\"sm\")\n  #\
  \ disp(A);\n  cache = Z;\nend\n\n# 定义 Relu 导数\nfunction [dZ] = reluDerivative(dA,\
  \ cache)\n  Z = cache;\n  dZ = dA;\n\n  # 获取大于 0 的元素\n  a = (Z > 0);\n\n  # 仅选择\
  \ Z > 0 的那些元素\n  dZ = dZ .* a;\nend\n\n# 定义 Sigmoid 导数\nfunction [dZ] = sigmoidDerivative(dA,\
  \ cache)\n  Z = cache;\n  s = 1 ./ (1 + exp(-Z));\n  dZ = dA .* s .* (1 - s);\n\
  end\n\n# 定义 Tanh 导数\nfunction [dZ] = tanhDerivative(dA, cache)\n  Z = cache;\n \
  \ a = tanh(Z);\nend\n```\n\n\n\n\n\n# Octave/Matlab 神经网络实现代码\n\n## 核心计算函数\n\n```octave\n\
  dZ = dA .* (1 - a .^ 2);\n```\n\n## 辅助函数\n\n### popMatrix\n填充矩阵，在 Y=1 的行放置 1。\n\n\
  ```octave\nfunction [Y1] = popMatrix(Y, numClasses)\n    Y1 = zeros(length(Y), numClasses);\n\
  \    if (numClasses == 3)  # For 3 output classes\n        Y1(Y == 0, 1) = 1;\n\
  \        Y1(Y == 1, 2) = 1;\n        Y1(Y == 2, 3) = 1;\n    elseif (numClasses\
  \ == 10)  # For 10 output classes\n        Y1(Y == 0, 1) = 1;\n        Y1(Y == 1,\
  \ 2) = 1;\n        Y1(Y == 2, 3) = 1;\n        Y1(Y == 3, 4) = 1;\n        Y1(Y\
  \ == 4, 5) = 1;\n        Y1(Y == 5, 6) = 1;\n        Y1(Y == 6, 7) = 1;\n      \
  \  Y1(Y == 7, 8) = 1;\n        Y1(Y == 8, 9) = 1;\n        Y1(Y == 9, 10) = 1;\n\
  \    endif\nend\n```\n\n### softmaxDerivative\n定义 Softmax 导数。\n\n```octave\nfunction\
  \ [dZ] = softmaxDerivative(dA, cache, Y, numClasses)\n    Z = cache;\n    # get\
  \ unnormalized probabilities\n    shiftZ = Z' - max(Z', [], 2);\n    exp_scores\
  \ = exp(shiftZ);\n    # normalize them for each example\n    probs = exp_scores\
  \ ./ sum(exp_scores, 2);\n    # dZ = pi - yi\n    yi = popMatrix(Y, numClasses);\n\
  \    dZ = probs - yi;\nend\n```\n\n### stableSoftmaxDerivative\n定义稳定 Softmax 导数。\n\
  \n```octave\nfunction [dZ] = stableSoftmaxDerivative(dA, cache, Y, numClasses)\n\
  \    Z = cache;\n    # get unnormalized probabilities\n    exp_scores = exp(Z');\n\
  \    # normalize them for each example\n    probs = exp_scores ./ sum(exp_scores,\
  \ 2);\n    # dZ = pi - yi\n    yi = popMatrix(Y, numClasses);\n    dZ = probs -\
  \ yi;\nend\n```\n\n## 模型初始化\n\n### initializeDeepModel\n为 L 层初始化模型。\n\n```octave\n\
  function [W, b] = initializeDeepModel(layerDimensions)\n    rand(\"seed\", 3);\n\
  \    # note the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n    # The\
  \ Bias is a vectors of size (l,1)\n    # Loop through the layer dimension from 1..\
  \ L\n    # Create cell arrays for Weights and biases\n    for l = 2:size(layerDimensions)(2)\n\
  \        W{l-1} = rand(layerDimensions(l), layerDimensions(l-1)) * 0.01; # Multiply\
  \ by .01\n        b{l-1} = zeros(layerDimensions(l), 1);\n    endfor\nend\n```\n\
  \n## 前向传播\n\n### layerActivationForward\n计算深度网络中第 `l` 层的激活值。\n\n```octave\nfunction\
  \ [A, forward_cache, activation_cache] = layerActivationForward(A_prev, W, b, activationFunc)\n\
  \    # Compute Z\n    Z = W * A_prev + b;\n    # Create a cell array\n    forward_cache\
  \ = {A_prev, W, b};\n    # Compute the activation for sigmoid\n    if (strcmp(activationFunc,\
  \ \"sigmoid\"))\n        [A, activation_cache] = sigmoid(Z);\n    elseif (strcmp(activationFunc,\
  \ \"relu\"))  # Compute the activation for Relu\n        [A, activation_cache] =\
  \ relu(Z);\n    elseif (strcmp(activationFunc, 'tanh'))  # Compute the activation\
  \ for tanh\n        [A, activation_cache] = tanhAct(Z);\n    elseif (strcmp(activationFunc,\
  \ 'softmax'))  # Compute the activation for softmax\n        # [A, activation_cache]\
  \ = softmax(Z);\n        [A, activation_cache] = stableSoftmax(Z);\n    endif\n\
  end\n```\n\n### forwardPropagationDeep\n计算第 1 到 L 层的前向传播。\n\n```octave\nfunction\
  \ [AL, forward_caches, activation_caches] = forwardPropagationDeep(X, weights, biases,\
  \ hiddenActivationFunc='relu', outputActivationFunc='sigmoid')\n    # Create an\
  \ empty cell array\n    forward_caches = {};\n    activation_caches = {};\n    #\
  \ Set A to X (A0)\n    A = X;\n    L = length(weights);  # number of layers in the\
  \ neural network\n    # Loop through from layer 1 to upto layer L\n    for l = 1:L-1\n\
  \        A_prev = A;\n        # Zi = Wi x Ai-1 + bi and Ai = g(Zi)\n        W =\
  \ weights{l};\n        b = biases{l};\n        [A, forward_cache, activation_cache]\
  \ = layerActivationForward(A_prev, W, b, activationFunc=hiddenActivationFunc);\n\
  \        forward_caches{l} = forward_cache;\n        activation_caches{l} = activation_cache;\n\
  \    endfor\n    # Since this is a binary classification use the sigmoid activation\
  \ function in last layer\n    W = weights{L};\n    b = biases{L};\n    [AL, forward_cache,\
  \ activation_cache] = layerActivationForward(A, W, b, activationFunc=outputActivationFunc);\n\
  \    forward_caches{L} = forward_cache;\n    activation_caches{L} = activation_cache;\n\
  end\n```\n\n## 成本计算\n\n### pickColumns\n选取 Y==1 的列，用于 `computeCost`。\n\n```octave\n\
  function [a] = pickColumns(AL, Y, numClasses)\n    if (numClasses == 3)\n      \
  \  a = [AL(Y == 0, 1); AL(Y == 1, 2); AL(Y == 2, 3)];\n    elseif (numClasses ==\
  \ 10)\n        a = [AL(Y == 0, 1); AL(Y == 1, 2); AL(Y == 2, 3); AL(Y == 3, 4);\
  \ AL(Y == 4, 5);\n             AL(Y == 5, 6); AL(Y == 6, 7); AL(Y == 7, 8); AL(Y\
  \ == 8, 9); AL(Y == 9, 10)];\n    endif\nend\n```\n\n### computeCost\n计算成本。\n\n\
  ```octave\nfunction [cost] = computeCost(AL, Y, outputActivationFunc=\"sigmoid\"\
  , numClasses)\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n        numTraining\
  \ = size(Y)(2);\n        # Element wise multiply for logprobs\n        cost = -1/numTraining\
  \ * sum((Y .* log(AL)) + (1 - Y) .* log(1 - AL));\n    elseif (strcmp(outputActivationFunc,\
  \ 'softmax'))\n        numTraining = size(Y)(2);\n        Y = Y';\n        # Select\
  \ rows where Y=0,1,and 2 and concatenate to a long vector\n        a = pickColumns(AL,\
  \ Y, numClasses);\n        # Select the correct column for log prob\n        correct_probs\
  \ = -log(a);\n        # Compute log loss\n        cost = sum(correct_probs) / numTraining;\n\
  \    endif\nend\n```\n\n## 反向传播\n\n### layerActivationBackward\n计算单层的反向传播。\n\n```octave\n\
  function [dA_prev, dW, db] = layerActivationBackward(dA, forward_cache, activation_cache,\
  \ Y, activationFunc, numClasses)\n    A_prev = forward_cache{1};\n    W = forward_cache{2};\n\
  \    b = forward_cache{3};\n    numTraining = size(A_prev)(2);\n    if (strcmp(activationFunc,\
  \ \"relu\"))\n        dZ = reluDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc,\
  \ \"sigmoid\"))\n        dZ = sigmoidDerivative(dA, activation_cache);\n    elseif\
  \ (strcmp(activationFunc, \"tanh\"))\n        dZ = tanhDerivative(dA, activation_cache);\n\
  \    elseif (strcmp(activationFunc, \"softmax\"))\n        # dZ = softmaxDerivative(dA,\
  \ activation_cache, Y, numClasses);\n        dZ = stableSoftmaxDerivative(dA, activation_cache,\
  \ Y, numClasses);\n    endif\n    # Check if softmax\n    if (strcmp(activationFunc,\
  \ \"softmax\"))\n        W = forward_cache{2};\n        b = forward_cache{3};\n\
  \        dW = 1/numTraining * A_prev * dZ;\n        db = 1/numTraining * sum(dZ,\
  \ 1);\n        dA_prev = dZ * W;\n    else\n        W = forward_cache{2};\n    \
  \    b = forward_cache{3};\n        dW = 1/numTraining * dZ * A_prev';\n       \
  \ db = 1/numTraining * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\nend\n\
  ```\n\n### backwardPropagationDeep\n计算深度网络的反向传播。\n\n```octave\nfunction [gradsDA,\
  \ gradsDW, gradsDB] = backwardPropagationDeep(AL, Y, activation_caches, forward_caches,\
  \ hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\", numClasses)\n \
  \   # Set the number of layers\n    L = length(activation_caches);\n    m = size(AL)(2);\n\
  \    if (strcmp(outputActivationFunc, \"sigmoid\"))\n        # Initializing the\
  \ backpropagation\n        # dl/dAL = -(y/a + (1-y)/(1-a)) - At the output layer\n\
  \        dAL = -((Y ./ AL) - (1 - Y) ./ (1 - AL));\n    elseif (strcmp(outputActivationFunc,\
  \ \"softmax\"))\n        dAL = 0;\n        Y = Y';\n    endif\n    # Since this\
  \ is a binary classification the activation at output is sigmoid\n    # ... (代码截断，原文未提供完整实现)\n\
  end\n```\n\n\n\n\n\n# 获取最后一层的梯度\n\n## 输入\n`AL`, `Y`, `caches`\n\n## 输出\n`gradients[\"\
  dAL\"]`, `gradients[\"dWL\"]`, `gradients[\"dbL\"]`\n\n```matlab\nactivation_cache\
  \ = activation_caches{L};\nforward_cache = forward_caches(L);\n\n# 注意：元胞数组包含一个前向缓存数组。要访问它，我们需要包含索引\
  \ {1}\n[dA, dW, db] = layerActivationBackward(dAL, forward_cache{1}, activation_cache,\
  \ Y, activationFunc = outputActivationFunc, numClasses);\n\nif (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n    gradsDA{L} = dA;\nelseif (strcmp(outputActivationFunc, \"softmax\"\
  ))\n    gradsDA{L} = dA'; # 注意转置\nendif\n\ngradsDW{L} = dW;\ngradsDB{L} = db;\n\
  ```\n\n## 反向遍历\n\n```matlab\nfor l = (L-1):-1:1\n    # 计算第 L-1 到第 1 层的梯度，适用于 Relu/tanh\n\
  \    # 输入：\"gradients[\"dA\" + str(l + 2)], caches\"\n    # 输出：\"gradients[\"dA\"\
  \ + str(l + 1)], gradients[\"dW\" + str(l + 1)], gradients[\"db\" + str(l + 1)]\"\
  \n    \n    activation_cache = activation_caches{l};\n    forward_cache = forward_caches(l);\n\
  \    \n    # dA_prev_temp, dW_temp, db_temp = layerActivationBackward(gradients['dA'+str(l+1)],\
  \ current_cache, activationFunc = \"relu\")\n    \n    # dAl 是第 l 层激活值的导数，是第一个元素\n\
  \    dAl = gradsDA{l+1};\n    \n    [dA_prev_temp, dW_temp, db_temp] = layerActivationBackward(dAl,\
  \ forward_cache{1}, activation_cache, Y, activationFunc = hiddenActivationFunc,\
  \ numClasses);\n    \n    gradsDA{l} = dA_prev_temp;\n    gradsDW{l} = dW_temp;\n\
  \    gradsDB{l} = db_temp;\nendfor\nend\n```\n\n# 执行梯度下降\n\n## 输入\n- 权重和偏置\n- 梯度\n\
  - 学习率\n- `outputActivationFunc`\n\n## 输出\n- 权重，偏置\n\n```matlab\nfunction [weights,\
  \ biases] = gradientDescent(weights, biases, gradsW, gradsB, learningRate, outputActivationFunc=\"\
  sigmoid\")\n    L = size(weights)(2); # 神经网络中的层数\n    \n    # 每个参数的更新规则。\n    for\
  \ l = 1:(L-1)\n        weights{l} = weights{l} - learningRate * gradsW{l};\n   \
  \     biases{l} = biases{l} - learningRate * gradsB{l};\n    endfor\n    \n    if\
  \ (strcmp(outputActivationFunc, \"sigmoid\"))\n        weights{L} = weights{L} -\
  \ learningRate * gradsW{L};\n        biases{L} = biases{L} - learningRate * gradsB{L};\n\
  \    elseif (strcmp(outputActivationFunc, \"softmax\"))\n        weights{L} = weights{L}\
  \ - learningRate * gradsW{L}';\n        biases{L} = biases{L} - learningRate * gradsB{L}';\n\
  \    endif\nend\n```\n\n# 执行 L 层深度学习模型\n\n## 输入\n- `X` - 输入特征\n- `Y` - 输出\n- `layersDimensions`\
  \ - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数 `relu` / `tanh`\n- `outputActivationFunc`\
  \ - 输出层激活函数 `sigmoid` / `softmax`\n- 学习率\n- 迭代次数\n\n## 输出\n- 每次迭代后更新的权重和偏置\n\n```matlab\n\
  function [weights, biases, costs] = L_Layer_DeepModel(X, Y, layersDimensions, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", learning_rate = .3, num_iterations = 10000)\
  \ # lr was 0.009\n    rand(\"seed\", 1);\n    costs = [];\n    \n    # 参数初始化。\n\
  \    [weights, biases] = initializeDeepModel(layersDimensions);\n    \n    # 循环（梯度下降）\n\
  \    for i = 0:num_iterations\n        # 前向传播：[LINEAR -> RELU]*(L-1) -> LINEAR ->\
  \ SIGMOID。\n        [AL, forward_caches, activation_caches] = forwardPropagationDeep(X,\
  \ weights, biases, hiddenActivationFunc, outputActivationFunc=outputActivationFunc);\n\
  \        \n        # 计算代价。\n        cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n        \n        #\
  \ 反向传播。\n        [gradsDA, gradsDW, gradsDB] = backwardPropagationDeep(AL, Y, activation_caches,\
  \ forward_caches, hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n        \n        #\
  \ 更新参数。\n        [weights, biases] = gradientDescent(weights, biases, gradsDW, gradsDB,\
  \ learning_rate, outputActivationFunc=outputActivationFunc);\n        \n       \
  \ # 每 1000 次迭代打印一次代价\n        if (mod(i, 1000) == 0)\n            costs = [costs,\
  \ cost];\n            # disp (\"Cost after iteration\"), disp(i), disp(cost);\n\
  \            printf(\"Cost after iteration i=%i cost=%d\\n\", i, cost);\n      \
  \  endif\n    endfor\nend\n```\n\n# 执行带随机梯度下降的 L 层深度学习模型\n\n## 输入\n- `X` - 输入特征\n\
  - `Y` - 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数 `relu`\
  \ / `tanh`\n- `outputActivationFunc` - 输出层激活函数 `sigmoid` / `softmax`\n- 学习率\n- `mini_batch_size`\n\
  - Epoch 数\n\n## 输出\n- 每次迭代后更新的权重和偏置\n\n```matlab\nfunction [weights, biases, costs]\
  \ = L_Layer_DeepModel_SGD(X, Y, layersDimensions, hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\", learning_rate = .3, mini_batch_size = 64, num_epochs = 2500) # lr was\
  \ 0.009\n    rand(\"seed\", 1);\n    costs = [];\n    \n    # 参数初始化。\n    [weights,\
  \ biases] = initializeDeepModel(layersDimensions);\n    \n    seed = 10;\n    \n\
  \    # 循环（梯度下降）\n    for i = 0:num_epochs\n        seed = seed + 1;\n        [mini_batches_X,\
  \ mini_batches_Y] = random_mini_batches(X, Y, mini_batch_size, seed);\n        minibatches\
  \ = length(mini_batches_X);\n        \n        for batch = 1:minibatches\n     \
  \       X = mini_batches_X{batch};\n            Y = mini_batches_Y{batch};\n   \
  \         \n            # 前向传播：[LINEAR -> RELU]*(L-1) -> LINEAR -> SIGMOID/SOFTMAX。\n\
  \            [AL, forward_caches, activation_caches] = forwardPropagationDeep(X,\
  \ weights, biases, hiddenActivationFunc, outputActivationFunc=outputActivationFunc);\n\
  \            # disp(batch);\n            # disp(size(X));\n            # disp(size(Y));\n\
  \            \n            # 计算代价。\n            cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n            # disp(cost);\n\
  \            \n            # 反向传播。\n            [gradsDA, gradsDW, gradsDB] = backwardPropagationDeep(AL,\
  \ Y, activation_caches, forward_caches, hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n            \n     \
  \       # 更新参数。\n            [weights, biases] = gradientDescent(weights, biases,\
  \ gradsDW, gradsDB, learning_rate, outputActivationFunc=outputActivationFunc);\n\
  \        endfor\n        \n        # 每 1000 次迭代打印一次代价\n        if (mod(i, 1000)\
  \ == 0)\n            costs = [costs, cost];\n            # disp (\"Cost after iteration\"\
  ), disp(i), disp(cost);\n            printf(\"Cost after iteration i=%i cost=%d\\\
  n\", i, cost);\n        endif\n    endfor\nend\n```\n\n# 绘制代价与迭代次数关系图\n\n```matlab\n\
  function plotCostVsIterations(maxIterations, costs)\n    iterations = [0:1000:maxIterations];\n\
