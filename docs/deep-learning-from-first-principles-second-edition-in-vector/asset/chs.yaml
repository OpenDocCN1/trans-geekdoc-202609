  \ dim(parameters[[paste('b',l,sep=\"\")]])`\n\n`s[[paste('db',l,sep=\"\")]] = matrix(rep(0,sz[1]*sz[2]),\
  \ nrow=sz[1],ncol=sz[2])`\n\n`}`\n\n`return(s)`\n\n`}`\n\n# 初始化 Adam\n\n# 输入：parameters\n\
  \n# 返回：(v,s) - 初始 Adam 参数\n\n`initializeAdam <- function(parameters){`\n\n`L <-\
