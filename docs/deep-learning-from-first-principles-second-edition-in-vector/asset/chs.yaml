  # -*- coding: utf-8 -*-\n############################################################################################################\n\
  #\n# 文件：`DLfunctions7.py`\n# 开发者：Tinniam V Ganesh\n# 日期：2018 年 4 月 16 日\n#\n##########################################################################################################\n\
  \nimport numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib\nfrom matplotlib\
  \ import cm\nimport math\nimport sklearn\nimport sklearn.datasets\n\n# 计算向量的 Sigmoid\n\
  def sigmoid(Z):\n    A = 1 / (1 + np.exp(-Z))\n    cache = Z\n    return A, cache\n\
  \n# 计算向量的 Relu\ndef relu(Z):\n    A = np.maximum(0, Z)\n    cache = Z\n    return\
  \ A, cache\n\n# 计算向量的 Tanh\ndef tanh(Z):\n    A = np.tanh(Z)\n    cache = Z\n  \
  \  return A, cache\n\n# 计算向量的 Softmax\ndef softmax(Z):\n    # 获取未归一化的概率\n    exp_scores\
  \ = np.exp(Z.T)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores, axis=1,\
  \ keepdims=True)\n    cache = Z\n    return A, cache\n\n# 计算向量的稳定 Softmax\ndef stableSoftmax(Z):\n\
  \    # 以数值稳定的方式计算向量 x 的 softmax。\n    shiftZ = Z.T - np.max(Z.T, axis=1).reshape(-1,\
  \ 1)\n    exp_scores = np.exp(shiftZ)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    cache = Z\n    return A, cache\n\n# 计算 Relu 的导数\n\
  def reluDerivative(dA, cache):\n    Z = cache\n    dZ = np.array(dA, copy=True)\
  \  # 只是将 dz 转换为正确的对象。\n    # 当 z <= 0 时，也应将 dz 设为 0。\n    dZ[Z <= 0] = 0\n    return\
  \ dZ\n\n# 计算 Sigmoid 的导数\ndef sigmoidDerivative(dA, cache):\n    Z = cache\n   \
  \ s = 1 / (1 + np.exp(-Z))\n    dZ = dA * s * (1 - s)\n    return dZ\n\n# 计算 Tanh\
  \ 的导数\ndef tanhDerivative(dA, cache):\n    Z = cache\n    a = np.tanh(Z)\n    dZ\
  \ = dA * (1 - np.power(a, 2))\n    return dZ\n\n# 计算 Softmax 的导数\ndef softmaxDerivative(dA,\
  \ cache, y, numTraining):\n    # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z\
  \ = cache\n    # 计算 softmax\n    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n  \
  \  probs = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n    # 计算得分上的梯度\n\
  \    dZ = probs\n    # dZ = pi- yi\n    dZ[range(int(numTraining)), y[:, 0]] -=\
  \ 1\n    return dZ\n\n# 计算稳定 Softmax 的导数\ndef stableSoftmaxDerivative(dA, cache,\
  \ y, numTraining):\n    # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z = cache\n\
  \    # 计算稳定 softmax\n    shiftZ = Z.T - np.max(Z.T, axis=1).reshape(-1, 1)\n   \
  \ exp_scores = np.exp(shiftZ)\n    # 对每个样本进行归一化\n    probs = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    # 计算得分上的梯度\n    dZ = probs\n    # dZ = pi- yi\n  \
  \  dZ[range(int(numTraining)), y[:, 0]] -= 1\n    return dZ\n\n# 初始化模型\n# 输入：特征数量、隐藏单元数量、输出单元数量\n\
  # 返回：权重和偏置矩阵及向量\ndef initializeModel(numFeats, numHidden, numOutput):\n    np.random.seed(1)\n\
  \    W1 = np.random.randn(numHidden, numFeats) * 0.01  # 乘以 .01\n    b1 = np.zeros((numHidden,\
  \ 1))\n    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n    # 创建神经网络参数字典\n    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2':\
  \ b2}\n    return nnParameters\n\n# 初始化 L 层模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  def initializeDeepModel(layerDimensions):\n    np.random.seed(3)\n    # 注意第 'l'\
  \ 层的权重矩阵大小为 (l, l-1)\n    # 偏置是大小为 (l, 1) 的向量\n    # 遍历层维度 1..L\n    layerParams\
  \ = {}\n    for l in range(1, len(layerDimensions)):\n        layerParams['W' +\
  \ str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l - 1]) * 0.01\n\
  \        layerParams['b' + str(l)] = np.zeros((layerDimensions[l], 1))\n       \
  \ np.savetxt('W' + str(l) + '.csv', layerParams['W' + str(l)], delimiter=',')\n\
  \        np.savetxt('b' + str(l) + '.csv', layerParams['b' + str(l)], delimiter=',')\n\
  \    return layerParams\n\n# L 层模型的 He 初始化\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  # He 初始化将随机数乘以 sqrt(2 / layerDimensions[l-1])\ndef HeInitializeDeepModel(layerDimensions):\n\
  \    np.random.seed(3)\n    # 注意第 'l' 层的权重矩阵大小为 (l, l-1)\n    # 偏置是大小为 (l, 1) 的向量\n\
  \    # 遍历层维度 1..L\n    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n\
  \        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l\
  \ - 1]) * np.sqrt(2 / layerDimensions[l - 1])\n        layerParams['b' + str(l)]\
  \ = np.zeros((layerDimensions[l], 1))\n    return layerParams\n\n# L 层模型的 Xavier\
  \ 初始化\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n# Xavier 初始化将随机数乘以 sqrt(1 / layerDimensions[l-1])\n\
  def XavInitializeDeepModel(layerDimensions):\n    np.random.seed(3)\n    # 注意第 'l'\
  \ 层的权重矩阵大小为 (l, l-1)\n    # 偏置是大小为 (l, 1) 的向量\n    # 遍历层维度 1..L\n    layerParams\
  \ = {}\n    for l in range(1, len(layerDimensions)):\n        layerParams['W' +\
  \ str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l - 1]) * np.sqrt(1\
  \ / layerDimensions[l - 1])\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n```\n\n\n\n\n# 神经网络优化算法与前向/反向传播实现\n\n## 参数初始化\n\n\
  ### 初始化速度 (Momentum)\n```python\nlayerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\nreturn layerParams\nreturn Z, cache\n```\n\n**函数签名**：`initializeVelocity(parameters)`\n\
  - **输入**：`parameters` - 模型参数字典\n- **返回**：`v` - 初始速度字典\n\n```python\ndef initializeVelocity(parameters):\n\
  \    L = len(parameters) // 2  # 层数\n    v = {}\n    for l in range(L):\n      \
  \  v[\"dW\" + str(l+1)] = np.zeros((\n            parameters['W' + str(l+1)].shape[0],\n\
  \            parameters['W' + str(l+1)].shape[1]\n        ))\n        v[\"db\" +\
  \ str(l+1)] = np.zeros((\n            parameters['b' + str(l+1)].shape[0],\n   \
  \         parameters['b' + str(l+1)].shape[1]\n        ))\n    return v\n```\n\n\
  ### 初始化 RMSProp 参数\n**函数签名**：`initializeRMSProp(parameters)`\n- **输入**：`parameters`\
  \ - 模型参数字典\n- **返回**：`s` - 初始 RMSProp 字典\n\n```python\ndef initializeRMSProp(parameters):\n\
  \    L = len(parameters) // 2\n    s = {}\n    for l in range(L):\n        s[\"\
  dW\" + str(l+1)] = np.zeros((\n            parameters['W' + str(l+1)].shape[0],\n\
  \            parameters['W' + str(l+1)].shape[1]\n        ))\n        s[\"db\" +\
  \ str(l+1)] = np.zeros((\n            parameters['b' + str(l+1)].shape[0],\n   \
  \         parameters['b' + str(l+1)].shape[1]\n        ))\n    return s\n```\n\n\
  ### 初始化 Adam 参数\n**函数签名**：`initializeAdam(parameters)`\n- **输入**：`parameters` -\
  \ 模型参数字典\n- **返回**：`v, s` - Adam 优化器所需的动量和 RMSProp 参数\n\n```python\ndef initializeAdam(parameters):\n\
  \    L = len(parameters) // 2\n    v = {}\n    s = {}\n    for l in range(L):\n\
  \        v[\"dW\" + str(l+1)] = np.zeros((\n            parameters['W' + str(l+1)].shape[0],\n\
  \            parameters['W' + str(l+1)].shape[1]\n        ))\n        v[\"db\" +\
  \ str(l+1)] = np.zeros((\n            parameters['b' + str(l+1)].shape[0],\n   \
  \         parameters['b' + str(l+1)].shape[1]\n        ))\n        s[\"dW\" + str(l+1)]\
  \ = np.zeros((\n            parameters['W' + str(l+1)].shape[0],\n            parameters['W'\
  \ + str(l+1)].shape[1]\n        ))\n        s[\"db\" + str(l+1)] = np.zeros((\n\
  \            parameters['b' + str(l+1)].shape[0],\n            parameters['b' +\
  \ str(l+1)].shape[1]\n        ))\n    return v, s\n```\n\n## 前向传播\n\n### 单层前向激活\n\
  **函数签名**：`layerActivationForward(A_prev, W, b, keep_prob=1, activationFunc=\"relu\"\
  )`\n- **输入**：\n  - `A_prev` - 上一层激活值\n  - `W, b` - 权重矩阵和偏置向量\n  - `keep_prob` -\
  \ Dropout 保留概率\n  - `activationFunc` - 激活函数：`sigmoid`, `tanh`, `relu`, `softmax`\n\
  - **返回**：`A, cache` - 当前层激活值和缓存\n\n```python\ndef layerActivationForward(A_prev,\
  \ W, b, keep_prob=1, activationFunc=\"relu\"):\n    Z = np.dot(W, A_prev) + b\n\
  \    forward_cache = (A_prev, W, b)\n    \n    if activationFunc == \"sigmoid\"\
  :\n        A, activation_cache = sigmoid(Z)\n    elif activationFunc == \"relu\"\
  :\n        A, activation_cache = relu(Z)\n    elif activationFunc == 'tanh':\n \
  \       A, activation_cache = tanh(Z)\n    elif activationFunc == 'softmax':\n \
  \       A, activation_cache = stableSoftmax(Z)\n    \n    cache = (forward_cache,\
  \ activation_cache)\n    return A, cache\n```\n\n### 深层网络前向传播\n**函数签名**：`forwardPropagationDeep(X,\
  \ parameters, keep_prob=1, hiddenActivationFunc='relu', outputActivationFunc='sigmoid')`\n\
  - **输入**：\n  - `X` - 输入特征\n  - `parameters` - 权重和偏置参数\n  - `keep_prob` - Dropout\
  \ 保留概率\n  - `hiddenActivationFunc` - 隐藏层激活函数：`relu`/`tanh`\n  - `outputActivationFunc`\
  \ - 输出层激活函数：`sigmoid`/`softmax`\n- **返回**：`AL, caches, dropoutMat` - 最终激活值、缓存列表、Dropout\
  \ 掩码字典\n\n```python\ndef forwardPropagationDeep(X, parameters, keep_prob=1,\n  \
  \                         hiddenActivationFunc='relu', outputActivationFunc='sigmoid'):\n\
  \    caches = []\n    dropoutMat = {}\n    A = X\n    L = len(parameters) // 2\n\
  \    \n    for l in range(1, L):\n        A_prev = A\n        A, cache = layerActivationForward(\n\
  \            A_prev, parameters['W'+str(l)], parameters['b'+str(l)],\n         \
  \   keep_prob, activationFunc=hiddenActivationFunc\n        )\n        # Dropout\n\
  \        D = np.random.rand(A.shape[0], A.shape[1])\n        D = (D < keep_prob)\n\
  \        dropoutMat[\"D\" + str(l)] = D\n        A = np.multiply(A, D)\n       \
  \ A = np.divide(A, keep_prob)\n        caches.append(cache)\n    \n    # 最后一层\n\
  \    AL, cache = layerActivationForward(\n        A, parameters['W'+str(L)], parameters['b'+str(L)],\n\
  \        activationFunc=outputActivationFunc\n    )\n    caches.append(cache)\n\
  \    return AL, caches, dropoutMat\n```\n\n## 代价函数计算\n\n### 标准代价函数\n**函数签名**：`computeCost(parameters,\
  \ AL, Y, outputActivationFunc=\"sigmoid\")`\n- **输入**：\n  - `parameters` - 模型参数\n\
  \  - `AL` - 最终层激活值\n  - `Y` - 真实标签\n  - `outputActivationFunc` - 输出层激活函数\n- **返回**：`cost`\
  \ - 计算得到的代价\n\n```python\ndef computeCost(parameters, AL, Y, outputActivationFunc=\"\
  sigmoid\"):\n    if outputActivationFunc == \"sigmoid\":\n        m = float(Y.shape[1])\n\
  \        cost = -1/m * np.sum(Y * np.log(AL) + (1-Y) * (np.log(1-AL)))\n       \
  \ cost = np.squeeze(cost)\n    elif outputActivationFunc == \"softmax\":\n     \
  \   Y = Y.T\n        m = float(len(Y))\n        correct_logprobs = -np.log(AL[range(int(m)),\
  \ Y.T])\n        cost = np.sum(correct_logprobs) / m\n    return cost\n```\n\n###\
  \ 带正则化的代价函数\n**函数签名**：`computeCostWithReg(parameters, AL, Y, lambd, outputActivationFunc=\"\
  sigmoid\")`\n- **输入**：额外参数 `lambd` - 正则化系数\n- **返回**：`cost` - 包含 L2 正则化项的代价\n\n\
  ```python\ndef computeCostWithReg(parameters, AL, Y, lambd, outputActivationFunc=\"\
  sigmoid\"):\n    if outputActivationFunc == \"sigmoid\":\n        m = float(Y.shape[1])\n\
  \        cost = -1/m * np.sum(Y * np.log(AL) + (1-Y) * (np.log(1-AL)))\n       \
  \ cost = np.squeeze(cost)\n    elif outputActivationFunc == \"softmax\":\n     \
  \   Y = Y.T\n        m = float(len(Y))\n        correct_logprobs = -np.log(AL[range(int(m)),\
  \ Y.T])\n        cost = np.sum(correct_logprobs) / m\n    \n    # L2 正则化项\n    L\
  \ = int(len(parameters) / 2)\n    L2RegularizationCost = 0\n    for l in range(L):\n\
  \        L2RegularizationCost += np.sum(np.square(parameters['W'+str(l+1)]))\n \
  \   L2RegularizationCost = (lambd / (2*m)) * L2RegularizationCost\n    cost = cost\
  \ + L2RegularizationCost\n    return cost\n```\n\n## 反向传播\n\n### 单层反向传播 (含 Dropout)\n\
  **函数签名**：`layerActivationBackward(dA, cache, Y, keep_prob=1, activationFunc=\"relu\"\
  )`\n- **输入**：\n  - `dA` - 当前层激活值的梯度\n  - `cache` - 前向传播缓存 (`forward_cache`, `activation_cache`)\n\
  \  - `Y` - 真实标签 (softmax 需要)\n  - `keep_prob` - Dropout 保留概率\n  - `activationFunc`\
  \ - 激活函数类型\n- **返回**：`dA_prev, dW, db` - 上一层激活梯度、权重梯度、偏置梯度\n\n```python\ndef layerActivationBackward(dA,\
  \ cache, Y, keep_prob=1, activationFunc=\"relu\"):\n    forward_cache, activation_cache\
  \ = cache\n    A_prev, W, b = forward_cache\n    numtraining = float(A_prev.shape[1])\n\
  \    \n    if activationFunc == \"relu\":\n        dZ = reluDerivative(dA, activation_cache)\n\
  \    elif activationFunc == \"sigmoid\":\n        dZ = sigmoidDerivative(dA, activation_cache)\n\
  \    elif activationFunc == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n\
  \    elif activationFunc == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA,\
  \ activation_cache, Y, numtraining)\n    \n    if activationFunc == 'softmax':\n\
  \        dW = 1/numtraining * np.dot(A_prev, dZ)\n        db = 1/numtraining * np.sum(dZ,\
  \ axis=0, keepdims=True)\n        dA_prev = np.dot(dZ, W)\n    else:\n        dW\
  \ = 1/numtraining * (np.dot(dZ, A_prev.T))\n        db = 1/numtraining * np.sum(dZ,\
  \ axis=1, keepdims=True)\n        dA_prev = np.dot(W.T, dZ)\n    \n    return dA_prev,\
  \ dW, db\n```\n\n### 带正则化的单层反向传播\n**函数签名**：`layerActivationBackwardWithReg(dA, cache,\
  \ Y, lambd, activationFunc)`\n- **输入**：额外参数 `lambd` - 正则化系数\n- **返回**：`dA_prev,\
  \ dW, db` - 包含正则化项的梯度\n\n> **注意**：原文仅给出了函数签名和数学公式注释，未提供完整实现代码。核心梯度公式：\n> - `dL/dWi\
  \ = dL/dZi * Al-1 + (lambd/m) * Wi`\n> - `dl/dbl = dL/dZl`\n> - `dL/dZ_prev = dL/dZl\
  \ * W`\n\n\n\n\n\n# 神经网络反向传播与优化算法实现\n\n## `layerActivationBackwardWithReg` 函数\n\n\
  ```python\ndef layerActivationBackwardWithReg(dA, cache, Y, lambd, activationFunc):\n\
  \    forward_cache, activation_cache = cache\n    A_prev, W, b = forward_cache\n\
  \    numtraining = float(A_prev.shape[1])\n    # print(\"n=\",numtraining)\n   \
  \ # print(\"no=\",numtraining)\n\n    if activationFunc == \"relu\":\n        dZ\
  \ = reluDerivative(dA, activation_cache)\n    elif activationFunc == \"sigmoid\"\
  :\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA, activation_cache, Y,\
  \ numtraining)\n\n    if activationFunc == 'softmax':\n        # Add the regularization\
  \ factor\n        dW = 1/numtraining * np.dot(A_prev, dZ) + (lambd/numtraining)\
  \ * W.T\n        db = 1/numtraining * np.sum(dZ, axis=0, keepdims=True)\n      \
  \  dA_prev = np.dot(dZ, W)\n    else:\n        # Add the regularization factor\n\
  \        dW = 1/numtraining * (np.dot(dZ, A_prev.T)) + (lambd/numtraining) * W\n\
  \        # print(\"dW=\",dW)\n        db = 1/numtraining * np.sum(dZ, axis=1, keepdims=True)\n\
  \        # print(\"db=\",db)\n        dA_prev = np.dot(W.T, dZ)\n\n    return dA_prev,\
  \ dW, db\n```\n\n## `backwardPropagationDeep` 函数\n\n```python\ndef backwardPropagationDeep(AL,\
  \ Y, caches, dropoutMat, lambd=0, keep_prob=1,\n                            hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\"):\n    \"\"\"\n    Compute the backpropagation\
  \ for 1 cycle\n\n    Input:\n        AL: Output of L layer Network - weights\n \
  \       Y: Real output\n        caches: list of caches containing:\n           \
  \ - dropoutMat\n            - lambd\n            - keep_prob\n            - every\
  \ cache of layerActivationForward() with \"relu\"/\"tanh\"\n              (it's\
  \ caches[l], for l in range(L-1) i.e l = 0...L-2)\n            - the cache of layerActivationForward()\
  \ with \"sigmoid\" (it's caches[L-1])\n        hiddenActivationFunc: Activation\
  \ function at hidden layers - relu/sigmoid/tanh\n        outputActivationFunc: Activation\
  \ function at output - sigmoid/softmax\n\n    Returns:\n        gradients: A dictionary\
  \ with the gradients\n            gradients[\"dA\" + str(l)] = ...\n           \
  \ gradients[\"dW\" + str(l)] = ...\n            gradients[\"db\" + str(l)] = ...\n\
  \    \"\"\"\n    # initialize the gradients\n    gradients = {}\n\n    # Set the\
  \ number of layers\n    L = len(caches)\n    m = float(AL.shape[1])\n\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        Y = Y.reshape(AL.shape)  # after this line, Y is the\
  \ same shape as AL\n\n        # Initializing the backpropagation\n        # dl/dAL=\
  \ -(y/a + (1-y)/(1-a)) - At the output layer\n        dAL = - (np.divide(Y, AL)\
  \ - np.divide(1 - Y, 1 - AL))\n    else:\n        dAL = 0\n        Y = Y.T\n\n \
  \   # Since this is a binary classification the activation at output is sigmoid\n\
  \    # Get the gradients at the last layer\n    # Inputs: \"AL, Y, caches\".\n \
  \   # Outputs: \"gradients[\"dAL\"], gradients[\"dWL\"], gradients[\"dbL\"]\"\n\
  \    current_cache = caches[L-1]\n\n    if lambd == 0:\n        gradients[\"dA\"\
  \ + str(L)], gradients[\"dW\" + str(L)], gradients[\"db\" + str(L)] \\\n       \
  \     = layerActivationBackward(dAL, current_cache, Y, activationFunc=outputActivationFunc)\n\
  \    else:  # Regularization\n        gradients[\"dA\" + str(L)], gradients[\"dW\"\
  \ + str(L)], gradients[\"db\" + str(L)] \\\n            = layerActivationBackwardWithReg(dAL,\
  \ current_cache, Y, lambd, activationFunc=outputActivationFunc)\n\n    # Note dA\
  \ for softmax is the transpose\n    if outputActivationFunc == \"softmax\":\n  \
  \      gradients[\"dA\" + str(L)] = gradients[\"dA\" + str(L)].T\n\n    # Traverse\
  \ in the reverse direction\n    for l in reversed(range(L-1)):\n        # Compute\
  \ the gradients for L-1 to 1 for Relu/tanh\n        # Inputs: \"gradients[\"dA\"\
  \ + str(l + 2)], caches\".\n        # Outputs: \"gradients[\"dA\" + str(l + 1)]\
  \ , gradients[\"dW\" + str(l + 1)] , gradients[\"db\" + str(l + 1)]\"\n        current_cache\
  \ = caches[l]\n        # dA_prev_temp, dW_temp, db_temp = layerActivationBackward(gradients['dA'+str(l+2)],\
  \ current_cache, activationFunc = \"relu\")\n\n        if lambd == 0:\n        \
  \    # In the reverse direction use the same dropout matrix\n            # Random\
  \ dropout\n            # Multiply dA'l' with the dropoutMat and divide to keep the\
  \ expected value same\n            D = dropoutMat[\"D\" + str(l+1)]\n\n        \
  \    # Drop some dAl's\n            gradients['dA'+str(l+2)] = np.multiply(gradients['dA'+str(l+2)],\
  \ D)\n            # Divide by keep_prob to keep expected value same\n          \
  \  gradients['dA'+str(l+2)] = np.divide(gradients['dA'+str(l+2)], keep_prob)\n\n\
  \            dA_prev_temp, dW_temp, db_temp = \\\n                layerActivationBackward(gradients['dA'+str(l+2)],\
  \ current_cache, Y, keep_prob=1, activationFunc=hiddenActivationFunc)\n        else:\n\
  \            dA_prev_temp, dW_temp, db_temp = \\\n                layerActivationBackwardWithReg(gradients['dA'+str(l+2)],\
  \ current_cache, Y, lambd, activationFunc=hiddenActivationFunc)\n\n        gradients[\"\
  dA\" + str(l + 1)] = dA_prev_temp\n        gradients[\"dW\" + str(l + 1)] = dW_temp\n\
  \        gradients[\"db\" + str(l + 1)] = db_temp\n\n    return gradients\n```\n\
  \n## `gradientDescent` 函数\n\n```python\ndef gradientDescent(parameters, gradients,\
  \ learningRate, outputActivationFunc=\"sigmoid\"):\n    \"\"\"\n    Perform Gradient\
  \ Descent\n\n    Input:\n        parameters: Weights and biases\n        gradients:\
  \ gradients\n        learningRate: learning rate\n        outputActivationFunc:\
  \ Activation function at output - sigmoid/softmax\n\n    Output:\n        Updated\
  \ weights after 1 iteration\n    \"\"\"\n    L = int(len(parameters) / 2)\n\n  \
  \  # Update rule for each parameter.\n    for l in range(L-1):\n        parameters[\"\
  W\" + str(l+1)] = parameters['W'+str(l+1)] - learningRate * gradients['dW' + str(l+1)]\n\
  \        parameters[\"b\" + str(l+1)] = parameters['b'+str(l+1)] - learningRate\
  \ * gradients['db' + str(l+1)]\n\n    if outputActivationFunc == \"sigmoid\":\n\
  \        parameters[\"W\" + str(L)] = parameters['W'+str(L)] - learningRate * gradients['dW'\
  \ + str(L)]\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate\
  \ * gradients['db' + str(L)]\n    elif outputActivationFunc == \"softmax\":\n  \
  \      parameters[\"W\" + str(L)] = parameters['W'+str(L)] - learningRate * gradients['dW'\
  \ + str(L)].T\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate\
  \ * gradients['db' + str(L)].T\n\n    return parameters\n```\n\n## `gradientDescentWithMomentum`\
  \ 函数\n\n```python\ndef gradientDescentWithMomentum(parameters, gradients, v, beta,\
  \ learningRate, outputActivationFunc=\"sigmoid\"):\n    \"\"\"\n    Update parameters\
  \ with momentum\n\n    Input:\n        parameters\n        gradients\n        v\n\
  \        beta\n        learningRate\n        outputActivationFunc: softmax/sigmoid\n\
  \n    Output:\n        Updated parameters and velocity\n    \"\"\"\n    L = len(parameters)\
  \ // 2  # number of layers in the neural networks\n\n    # Momentum update for each\
  \ parameter\n    for l in range(L-1):\n        # Compute velocities\n        # v['dWk']\
  \ = beta * v['dWk'] + (1-beta) * dWk\n        v[\"dW\" + str(l+1)] = beta * v[\"\
  dW\" + str(l+1)] + (1-beta) * gradients['dW' + str(l+1)]\n        v[\"db\" + str(l+1)]\
  \ = beta * v[\"db\" + str(l+1)] + (1-beta) * gradients['db' + str(l+1)]\n\n    \
  \    # Update parameters with velocities\n        parameters[\"W\" + str(l+1)] =\
  \ parameters['W' + str(l+1)] - learningRate * v[\"dW\" + str(l+1)]\n        parameters[\"\
  b\" + str(l+1)] = parameters['b' + str(l+1)] - learningRate * v[\"db\" + str(l+1)]\n\
  \n    if outputActivationFunc == \"sigmoid\":\n        v[\"dW\" + str(L)] = beta\
  \ * v[\"dW\" + str(L)] + (1-beta) * gradients['dW' + str(L)]\n        v[\"db\" +\
  \ str(L)] = beta * v[\"db\" + str(L)] + (1-beta) * gradients['db' + str(L)]\n\n\
  \        parameters[\"W\" + str(L)] = parameters['W'+str(L)] - learningRate * gradients['dW'\
  \ + str(L)]\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate\
  \ * gradients['db' + str(L)]\n    elif outputActivationFunc == \"softmax\":\n  \
  \      v[\"dW\" + str(L)] = beta * v[\"dW\" + str(L)] + (1-beta) * gradients['dW'\
  \ + str(L)].T\n        v[\"db\" + str(L)] = beta * v[\"db\" + str(L)] + (1-beta)\
  \ * gradients['db' + str(L)].T\n\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)]\
  \ - learningRate * gradients['dW' + str(L)].T\n        parameters[\"b\" + str(L)]\
  \ = parameters['b'+str(L)] - learningRate * gradients['db' + str(L)].T\n\n    return\
  \ parameters, v\n```\n\n## `gradientDescentWithRMSProp` 函数\n\n```python\ndef gradientDescentWithRMSProp(parameters,\
  \ gradients, s, beta1, epsilon, learningRate, outputActivationFunc=\"sigmoid\"):\n\
  \    \"\"\"\n    Update parameters with RMSProp\n\n    Input:\n        parameters\n\
  \        gradients\n        s\n        beta1\n        learningRate\n        outputActivationFunc:\
  \ sigmoid/softmax\n\n    Output:\n        Updated parameters and RMSProp\n    \"\
  \"\"\n    L = len(parameters) // 2  # number of layers in the neural networks\n\n\
  \    # Momentum update for each parameter\n    for l in range(L-1):\n        # Compute\
  \ RMSProp\n        # ... (代码未完整提供)\n```\n\n\n\n\n\n# RMSProp 参数更新\n\n```python\n\
  s['dWk'] = beta1 * s['dWk'] + (1 - beta1) * dWk**2 / sqrt(s['dWk'])\ns[\"dW\" +\
  \ str(l+1)] = beta1 * s[\"dW\" + str(l+1)] + (1 - beta1) * \\\n    np.multiply(gradients['dW'\
  \ + str(l+1)], gradients['dW' + str(l+1)])\ns[\"db\" + str(l+1)] = beta1 * s[\"\
  db\" + str(l+1)] + (1 - beta1) * \\\n    np.multiply(gradients['db' + str(l+1)],\
  \ gradients['db' + str(l+1)])\n```\n\n```python\nparameters[\"W\" + str(l+1)] =\
  \ parameters['W' + str(l+1)] - \\\n    learningRate * gradients['dW' + str(l+1)]\
  \ / np.sqrt(s[\"dW\" + str(l+1)] + epsilon)\n\nparameters[\"b\" + str(l+1)] = parameters['b'\
  \ + str(l+1)] - \\\n    learningRate * gradients['db' + str(l+1)] / np.sqrt(s[\"\
  db\" + str(l+1)] + epsilon)\n```\n\n## Sigmoid 输出层处理\n\n```python\nif outputActivationFunc\
  \ == \"sigmoid\":\n    s[\"dW\" + str(L)] = beta1 * s[\"dW\" + str(L)] + (1 - beta1)\
  \ * \\\n        np.multiply(gradients['dW' + str(L)], gradients['dW' + str(L)])\n\
  \    s[\"db\" + str(L)] = beta1 * s[\"db\" + str(L)] + (1 - beta1) * \\\n      \
  \  np.multiply(gradients['db' + str(L)], gradients['db' + str(L)])\n\n    parameters[\"\
  W\" + str(L)] = parameters['W' + str(L)] - \\\n        learningRate * gradients['dW'\
  \ + str(L)] / np.sqrt(s[\"dW\" + str(L)] + epsilon)\n\n    parameters[\"b\" + str(L)]\
  \ = parameters['b' + str(L)] - \\\n        learningRate * gradients['db' + str(L)]\
  \ / np.sqrt(s[\"db\" + str(L)] + epsilon)\n```\n\n## Softmax 输出层处理\n\n```python\n\
  elif outputActivationFunc == \"softmax\":\n    s[\"dW\" + str(L)] = beta1 * s[\"\
  dW\" + str(L)] + (1 - beta1) * \\\n        np.multiply(gradients['dW' + str(L)].T,\
  \ gradients['dW' + str(L)].T)\n    s[\"db\" + str(L)] = beta1 * s[\"db\" + str(L)]\
  \ + (1 - beta1) * \\\n        np.multiply(gradients['db' + str(L)].T, gradients['db'\
  \ + str(L)].T)\n\n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - \\\
  \n        learningRate * gradients['dW' + str(L)].T / np.sqrt(s[\"dW\" + str(L)]\
  \ + epsilon)\n\n    parameters[\"b\" + str(L)] = parameters['b' + str(L)] - \\\n\
  \        learningRate * gradients['db' + str(L)].T / np.sqrt(s[\"db\" + str(L)]\
  \ + epsilon)\n```\n\n```python\nreturn parameters, s\n```\n\n# Adam 优化器实现\n\n##\
  \ 函数签名\n\n```python\ndef gradientDescentWithAdam(parameters, gradients, v, s, t,\n\
  \                            beta1=0.9, beta2=0.999, epsilon=1e-8,\n           \
  \                 learningRate=0.1, outputActivationFunc=\"sigmoid\"):\n```\n\n\
  **输入参数：**\n- `parameters`：模型参数\n- `gradients`：梯度\n- `v`：一阶矩估计\n- `s`：二阶矩估计\n- `t`：时间步\n\
  - `beta1`：一阶矩衰减率\n- `beta2`：二阶矩衰减率\n- `epsilon`：数值稳定常数\n- `learningRate`：学习率\n-\
  \ `outputActivationFunc`：输出层激活函数 (sigmoid/softmax)\n\n**输出：**\n- 更新后的 `parameters`、`v`、`s`\n\
  \n## 核心实现\n\n```python\nL = len(parameters) // 2\n\n# 初始化偏差修正字典\nv_corrected = {}\n\
  s_corrected = {}\n\n# 前 L-1 层的 Adam 更新\nfor l in range(L-1):\n    # 计算一阶矩估计 (动量)\n\
  \    v[\"dW\" + str(l+1)] = beta1 * v[\"dW\" + str(l+1)] + \\\n        (1 - beta1)\
  \ * gradients['dW' + str(l+1)]\n    v[\"db\" + str(l+1)] = beta1 * v[\"db\" + str(l+1)]\
  \ + \\\n        (1 - beta1) * gradients['db' + str(l+1)]\n\n    # 偏差修正一阶矩\n    v_corrected[\"\
  dW\" + str(l+1)] = v[\"dW\" + str(l+1)] / (1 - np.power(beta1, t))\n    v_corrected[\"\
  db\" + str(l+1)] = v[\"db\" + str(l+1)] / (1 - np.power(beta1, t))\n\n    # 计算二阶矩估计\
  \ (RMSProp)\n    s[\"dW\" + str(l+1)] = beta2 * s[\"dW\" + str(l+1)] + \\\n    \
  \    (1 - beta2) * np.multiply(gradients['dW' + str(l+1)], gradients['dW' + str(l+1)])\n\
  \    s[\"db\" + str(l+1)] = beta2 * s[\"db\" + str(l+1)] + \\\n        (1 - beta2)\
  \ * np.multiply(gradients['db' + str(l+1)], gradients['db' + str(l+1)])\n\n    #\
  \ 偏差修正二阶矩\n    s_corrected[\"dW\" + str(l+1)] = s[\"dW\" + str(l+1)] / (1 - np.power(beta2,\
  \ t))\n    s_corrected[\"db\" + str(l+1)] = s[\"db\" + str(l+1)] / (1 - np.power(beta2,\
  \ t))\n\n    # 参数更新\n    d1 = np.sqrt(s_corrected[\"dW\" + str(l+1)] + epsilon)\n\
  \    d2 = np.sqrt(s_corrected[\"db\" + str(l+1)] + epsilon)\n\n    parameters[\"\
  W\" + str(l+1)] = parameters['W' + str(l+1)] - \\\n        (learningRate * v_corrected[\"\
  dW\" + str(l+1)] / d1)\n    parameters[\"b\" + str(l+1)] = parameters['b' + str(l+1)]\
  \ - \\\n        (learningRate * v_corrected[\"db\" + str(l+1)] / d2)\n```\n\n##\
  \ Sigmoid 输出层特殊处理\n\n```python\nif outputActivationFunc == \"sigmoid\":\n    # 第\
  \ L 层一阶矩\n    v[\"dW\" + str(L)] = beta1 * v[\"dW\" + str(L)] + (1 - beta1) * gradients['dW'\
  \ + str(L)]\n    v[\"db\" + str(L)] = beta1 * v[\"db\" + str(L)] + (1 - beta1) *\
  \ gradients['db' + str(L)]\n\n    # 偏差修正\n    v_corrected[\"dW\" + str(L)] = v[\"\
  dW\" + str(L)] / (1 - np.power(beta1, t))\n    v_corrected[\"db\" + str(L)] = v[\"\
  db\" + str(L)] / (1 - np.power(beta1, t))\n\n    # 第 L 层二阶矩\n    s[\"dW\" + str(L)]\
  \ = beta2 * s[\"dW\" + str(L)] + (1 - beta2) * \\\n        np.multiply(gradients['dW'\
  \ + str(L)], gradients['dW' + str(L)])\n    s[\"db\" + str(L)] = beta2 * s[\"db\"\
  \ + str(L)] + (1 - beta2) * \\\n        np.multiply(gradients['db' + str(L)], gradients['db'\
  \ + str(L)])\n\n    # 偏差修正\n    s_corrected[\"dW\" + str(L)] = s[\"dW\" + str(L)]\
  \ / (1 - np.power(beta2, t))\n    s_corrected[\"db\" + str(L)] = s[\"db\" + str(L)]\
  \ / (1 - np.power(beta2, t))\n\n    # 参数更新\n    d1 = np.sqrt(s_corrected[\"dW\"\
  \ + str(L)] + epsilon)\n    d2 = np.sqrt(s_corrected[\"db\" + str(L)] + epsilon)\n\
  \n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - \\\n        (learningRate\
  \ * v_corrected[\"dW\" + str(L)] / d1)\n    parameters[\"b\" + str(L)] = parameters['b'\
  \ + str(L)] - \\\n        (learningRate * v_corrected[\"db\" + str(L)] / d2)\n```\n\
  \n## Softmax 输出层特殊处理\n\n```python\nelif outputActivationFunc == \"softmax\":\n \
  \   # 第 L 层一阶矩 (转置)\n    v[\"dW\" + str(L)] = beta1 * v[\"dW\" + str(L)] + (1 -\
  \ beta1) * gradients['dW' + str(L)].T\n    v[\"db\" + str(L)] = beta1 * v[\"db\"\
  \ + str(L)] + (1 - beta1) * gradients['db' + str(L)].T\n\n    # 偏差修正\n    v_corrected[\"\
  dW\" + str(L)] = v[\"dW\" + str(L)] / (1 - np.power(beta1, t))\n    v_corrected[\"\
