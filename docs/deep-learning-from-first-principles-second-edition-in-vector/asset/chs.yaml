  \ A= Relu(Z), A= tanh(Z)`\n\n`layerActivationForward <- function(A_prev, W, b, activationFunc){`\n\
  \n`# 计算 Z`\n\n`z = W %*% A_prev`\n\n`# 按列广播偏置 'b'`\n\n`Z <-sweep(z,1,b,'+')`\n\n\
  `forward_cache <- list(\"A_prev\"=A_prev, \"W\"=W, \"b\"=b)`\n\n`# 计算 sigmoid 的激活值`\n\
  \n`if(activationFunc == \"sigmoid\"){`\n\n`vals = sigmoid(Z)`\n\n`} else if (activationFunc\
