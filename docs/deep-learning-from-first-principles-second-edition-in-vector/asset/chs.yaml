  @author: Ganesh\n\"\"\"\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport\
  \ matplotlib\nimport matplotlib.pyplot as plt\nfrom matplotlib import cm\nimport\
  \ math\n\n# 计算向量的 sigmoid\ndef sigmoid(Z):\n    A=1/(1+np.exp(-Z))\n    cache=Z\n\
  \    return A,cache\n\n# 计算向量的 Relu\ndef relu(Z):\n    A = np.maximum(0,Z)\n   \
  \ cache=Z\n    return A,cache\n\n# 计算向量的 tanh\ndef tanh(Z):\n    A = np.tanh(Z)\n\
  \    cache=Z\n    return A,cache\n\n# 计算向量的 softmax\ndef softmax(Z):\n    # 获取未归一化的概率\n\
  \    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    cache=Z\n    return A,cache\n\n# 计算向量的稳定 Softmax\n\
  def stableSoftmax(Z):\n    # 以数值稳定的方式计算向量 x 的 softmax。\n    shiftZ = Z.T - np.max(Z.T,axis=1).reshape(-1,1)\n\
  \    exp_scores = np.exp(shiftZ)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    cache=Z\n    return A,cache\n\n# 计算 Relu 的导数\ndef\
  \ reluDerivative(dA, cache):\n    Z = cache\n    dZ = np.array(dA, copy=True) #\
  \ 只是将 dz 转换为正确的对象。\n    # 当 z <= 0 时，也应将 dz 设为 0。\n    dZ[Z <= 0] = 0\n    return\
  \ dZ\n\n# 计算 Sigmoid 的导数\ndef sigmoidDerivative(dA, cache):\n    Z = cache\n   \
  \ s = 1/(1+np.exp(-Z))\n    dZ = dA * s * (1-s)\n    return dZ\n\n# 计算 tanh 的导数\n\
  def tanhDerivative(dA, cache):\n    Z = cache\n    a = np.tanh(Z)\n    dZ = dA *\
  \ (1 - np.power(a, 2))\n    return dZ\n\n# 计算 Softmax 的导数\ndef softmaxDerivative(dA,\
  \ cache,y,numTraining):\n    # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z =\
  \ cache\n    # 计算 softmax\n    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n    probs\
  \ = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n    # 计算分数上的梯度\n   \
  \ dZ = probs\n    # dZ = pi - yi\n    dZ[range(int(numTraining)),y[:,0]] -= 1\n\
  \    return(dZ)\n\n# 计算稳定 Softmax 的导数\ndef stableSoftmaxDerivative(dA, cache,y,numTraining):\n\
  \    # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算稳定 softmax\n\
  \    shiftZ = Z.T - np.max(Z.T,axis=1).reshape(-1,1)\n    exp_scores = np.exp(shiftZ)\n\
  \    # 对每个样本进行归一化\n    probs = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n\
  \    #print(probs)\n    # 计算分数上的梯度\n    dZ = probs\n    # dZ = pi - yi\n    dZ[range(int(numTraining)),y[:,0]]\
  \ -= 1\n    return(dZ)\n\n# 初始化模型\n# 输入：特征数量\n# 隐藏单元数量\n# 输出单元数量\n# 返回：nnParameters\
  \ 字典\ndef initializeModel(numFeats,numHidden,numOutput):\n    np.random.seed(1)\n\
  \    W1=np.random.randn(numHidden,numFeats)*0.01 # 乘以 .01\n    b1=np.zeros((numHidden,1))\n\
  \    W2=np.random.randn(numOutput,numHidden)*0.01\n    b2=np.zeros((numOutput,1))\n\
  ```\n\n\n\n\n\n# 创建神经网络参数字典\n\n```python\nnnParameters = {'W1': W1, 'b1': b1, 'W2':\
  \ W2, 'b2': b2}\nreturn nnParameters\n```\n\n# 初始化 L 层模型\n\n**输入**：每层单元数列表\n**返回**：Z,\
  \ cache\n\n```python\ndef initializeDeepModel(layerDimensions):\n    np.random.seed(3)\n\
  \    # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n    # 从 1 循环到 L 的层维度\n\
  \    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n        layerParams['W'\
  \ + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l-1]) * 0.01 \
  \ # 乘以 .01\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l], 1))\n\
  \    return layerParams\n```\n\n# 计算深度网络前向传播中第 'l' 层的激活值\n\n**输入**：\n- `A_prev`\
  \ - 上一层的激活值\n- `W`, `b` - 权重和偏置矩阵及向量\n- `activationFunc` - 激活函数 - sigmoid, tanh,\
  \ relu 等\n\n**返回**：`A`, `cache`\n\n**公式**：\n- `Z = W * X + b`\n- `A = sigmoid(Z)`,\
  \ `A = Relu(Z)`, `A = tanh(Z)`\n\n```python\ndef layerActivationForward(A_prev,\
  \ W, b, activationFunc):\n    # 计算 Z\n    Z = np.dot(W, A_prev) + b\n    forward_cache\
  \ = (A_prev, W, b)\n\n    # 计算 sigmoid 的激活值\n    if activationFunc == \"sigmoid\"\
  :\n        A, activation_cache = sigmoid(Z)\n    # 计算 Relu 的激活值\n    elif activationFunc\
  \ == \"relu\":\n        A, activation_cache = relu(Z)\n    # 计算 tanh 的激活值\n    elif\
  \ activationFunc == 'tanh':\n        A, activation_cache = tanh(Z)\n    elif activationFunc\
  \ == 'softmax':\n        A, activation_cache = stableSoftmax(Z)\n\n    cache = (forward_cache,\
  \ activation_cache)\n    return A, cache\n```\n\n# 计算第 1..L 层的前向传播\n\n**输入**：\n\
  - `X` - 输入特征\n- `parameters` - 权重和偏置\n- `hiddenActivationFunc` - 隐藏层激活函数 Relu/tanh\n\
  - `outputActivationFunc` - 输出层激活函数 - sigmoid/softmax\n\n**返回**：`AL`, `caches`\n\n\
  前向传播在第 1..L-1 层使用 Relu/tanh 激活函数，在第 L 层使用 sigmoid 激活函数。\n\n```python\ndef forwardPropagationDeep(X,\
  \ parameters, hiddenActivationFunc='relu', outputActivationFunc='sigmoid'):\n  \
  \  caches = []\n    # 将 A 设为 X (A0)\n    A = X\n    L = int(len(parameters) / 2)\
  \  # 神经网络中的层数\n\n    # 从第 1 层循环到第 L 层\n    for l in range(1, L):\n        A_prev\
  \ = A\n        # Zi = Wi x Ai-1 + bi and Ai = g(Zi)\n        # A, cache = layerActivationForward(A_prev,\
  \ parameters['W'+str(l)], parameters['b'+str(l)], activationFunc = \"relu\")\n \
  \       A, cache = layerActivationForward(A_prev, parameters['W'+str(l)], parameters['b'+str(l)],\
  \ activationFunc=hiddenActivationFunc)\n        caches.append(cache)\n        #\
  \ print(\"l=\",l)\n        # print(A)\n\n    # 因为这是二分类，在最后一层使用 sigmoid 激活函数\n  \
  \  AL, cache = layerActivationForward(A, parameters['W'+str(L)], parameters['b'+str(L)],\
  \ activationFunc=outputActivationFunc)\n    caches.append(cache)\n    return AL,\
  \ caches\n```\n\n# 计算代价\n\n**输入**：\n- `AL` - 最后一层的激活值\n- `Y`\n- `outputActivationFunc`\
  \ - 输出层激活函数 - sigmoid/softmax\n\n**输出**：`cost`\n\n```python\ndef computeCost(AL,\
  \ Y, outputActivationFunc=\"sigmoid\"):\n    if outputActivationFunc == \"sigmoid\"\
  :\n        m = float(Y.shape[1])\n        # 对 logprobs 进行逐元素相乘\n        cost = -1/m\
  \ * np.sum(Y * np.log(AL) + (1-Y) * (np.log(1-AL)))\n        cost = np.squeeze(cost)\n\
  \    elif outputActivationFunc == \"softmax\":\n        # 注意：对 Y 进行转置以用于 softmax\n\
  \        Y = Y.T\n        m = float(len(Y))\n        # 计算对数概率。根据输出 y 取正确类别的对数概率\n\
  \        correct_logprobs = -np.log(AL[range(int(m)), Y.T])\n        # 计算损失\n  \
  \      cost = np.sum(correct_logprobs) / m\n    return cost\n```\n\n# 计算 1 个周期的反向传播\n\
  \n**输入**：\n- 神经网络参数 - `dA`\n- `cache` - `forward_cache` & `activation_cache`\n-\
  \ `Y`\n- `activationFunc` - relu, tanh, sigmoid, softmax\n\n**返回**：`dA_prev`, `dW`,\
  \ `db`\n\n**公式**：\n- `dL/dWi = dL/dZi * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev\
  \ = dL/dZl * W`\n\n```python\ndef layerActivationBackward(dA, cache, Y, activationFunc):\n\
  \    forward_cache, activation_cache = cache\n    A_prev, W, b = forward_cache\n\
  \    numtraining = float(A_prev.shape[1])\n    # print(\"n=\",numtraining)\n   \
  \ # print(\"no=\",numtraining)\n\n    if activationFunc == \"relu\":\n        dZ\
  \ = reluDerivative(dA, activation_cache)\n    elif activationFunc == \"sigmoid\"\
  :\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA, activation_cache, Y,\
  \ numtraining)\n\n    if activationFunc == 'softmax':\n        dW = 1/numtraining\
  \ * np.dot(A_prev, dZ)\n        db = 1/numtraining * np.sum(dZ, axis=0, keepdims=True)\n\
  \        dA_prev = np.dot(dZ, W)\n    else:\n        # print(numtraining)\n    \
  \    dW = 1/numtraining * (np.dot(dZ, A_prev.T))\n        # print(\"dW=\",dW)\n\
  \        db = 1/numtraining * np.sum(dZ, axis=1, keepdims=True)\n        # print(\"\
  db=\",db)\n        dA_prev = np.dot(W.T, dZ)\n\n    return dA_prev, dW, db\n```\n\
  \n# 计算 1 个周期的反向传播\n\n**输入**：\n- `AL`：L 层网络的输出 - 权重\n- `Y` 真实输出\n- `caches` -- 包含以下内容的缓存列表：\n\
  \  - 每个 `layerActivationForward()` 的缓存，激活函数为 \"relu\"/\"tanh\" (即 `caches[l]`, l\
  \ 取值范围为 range(L-1) 即 l = 0...L-2)\n  - `layerActivationForward()` 的缓存，激活函数为 \"sigmoid\"\
  \ (即 `caches[L-1]`)\n- `hiddenActivationFunc` - 隐藏层激活函数 - relu/sigmoid/tanh\n- `outputActivationFunc`\
  \ - 输出层激活函数 - sigmoid/softmax\n\n**返回**：\n- `gradients` -- 包含梯度的字典\n  - `gradients[\"\
  dA\" + str(l)] = ...`\n  - `gradients[\"dW\" + str(l)] = ...`\n  - `gradients[\"\
  db\" + str(l)]`\n\n```python\ndef backwardPropagationDeep(AL, Y, caches, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\"):\n    # 初始化梯度\n    gradients = {}\n\n    # 设置层数\n\
  \    L = len(caches)\n    m = float(AL.shape[1])\n\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        Y = Y.reshape(AL.shape)  # 执行此行后，Y 的形状与 AL 相同\n     \
  \   # 初始化反向传播\n        # dl/dAL = -(y/a + (1-y)/(1-a)) - 在输出层\n        dAL = - (np.divide(Y,\
  \ AL) - np.divide(1 - Y, 1 - AL))\n    else:\n        dAL = 0\n        Y = Y.T\n\
  \n    # 因为这是二分类，输出层的激活函数是 sigmoid\n    # 获取最后一层的梯度\n    # 输入：\"AL, Y, caches\"。\n\
  \    # 输出：\"gradients[\"dAL\"]\", \"gradients[\"dWL\"]\", \"gradients[\"dbL\"]\"\
  \n    current_cache = caches[L-1]\n    gradients[\"dA\" + str(L)], gradients[\"\
  dW\" + str(L)], gradients[\"db\" + str(L)] = \\\n        layerActivationBackward(dAL,\
  \ current_cache, Y, activationFunc=outputActivationFunc)\n\n    # 注意 softmax 的 dA\
  \ 是转置后的\n    if outputActivationFunc == \"softmax\":\n        gradients[\"dA\" +\
  \ str(L)] = gradients[\"dA\" + str(L)].T\n\n    # 反向遍历\n    for l in reversed(range(L-1)):\n\
  \        # 计算 L-1 到 1 层的 Relu/tanh 梯度\n        # 输入：\"gradients[\"dA\" + str(l +\
  \ 2)]\", caches\"。\n        # 输出：\"gradients[\"dA\" + str(l + 1)]\", \"gradients[\"\
  dW\" + str(l + 1)]\", \"gradients[\"db\" + str(l + 1)]\"\n        current_cache\
  \ = caches[l]\n        # dA_prev_temp, dW_temp, db_temp = layerActivationBackward(gradients['dA'+str(l+2)],\
  \ current_cache, activationFunc = \"relu\")\n        dA_prev_temp, dW_temp, db_temp\
  \ = \\\n            layerActivationBackward(gradients['dA'+str(l+2)], current_cache,\
  \ Y, activationFunc=hiddenActivationFunc)\n\n        gradients[\"dA\" + str(l +\
  \ 1)] = dA_prev_temp\n        gradients[\"dW\" + str(l + 1)] = dW_temp\n       \
  \ gradients[\"db\" + str(l + 1)] = db_temp\n\n    return gradients\n```\n\n# 执行梯度下降\n\
  \n**输入**：\n- 权重和偏置\n- `gradients`\n- `learningRate`\n- `outputActivationFunc` -\
  \ 输出层激活函数 - sigmoid/softmax\n\n**返回**：`parameters`\n\n```python\ndef gradientDescent(parameters,\
  \ gradients, learningRate, outputActivationFunc=\"sigmoid\"):\n    L = int(len(parameters)\
  \ / 2)\n    # 每个参数的更新规则。\n    for l in range(L-1):\n        parameters[\"W\" + str(l+1)]\
  \ = parameters['W'+str(l+1)] - learningRate * gradients['dW' + str(l+1)]\n     \
  \   parameters[\"b\" + str(l+1)] = parameters['b'+str(l+1)] - learningRate * gradients['db'\
  \ + str(l+1)]\n```\n\n\n\n\n\n# 深度学习模型实现\n\n## 参数更新逻辑\n\n```python\nif outputActivationFunc\
  \ == \"sigmoid\":\n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - learningRate\
  \ * gradients['dW' + str(L)]\n    parameters[\"b\" + str(L)] = parameters['b' +\
  \ str(L)] - learningRate * gradients['db' + str(L)]\nelif outputActivationFunc ==\
  \ \"softmax\":\n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - learningRate\
  \ * gradients['dW' + str(L)].T\n    parameters[\"b\" + str(L)] = parameters['b'\
  \ + str(L)] - learningRate * gradients['db' + str(L)].T\nreturn parameters\n```\n\
  \n## L 层深度学习模型 (梯度下降)\n\n### 函数签名\n```python\ndef L_Layer_DeepModel(X1, Y1, layersDimensions,\n\
  \                      hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\"\
  ,\n                      learningRate=0.3, num_iterations=10000, print_cost=False):\n\
  ```\n\n### 参数说明\n- `X1` - 输入特征\n- `Y1` - 输出标签\n- `layersDimensions` - 各层维度\n- `hiddenActivationFunc`\
  \ - 隐藏层激活函数 (`relu`/`tanh`/`sigmoid`)\n- `outputActivationFunc` - 输出层激活函数 (`sigmoid`/`softmax`)\n\
  - `learningRate` - 学习率\n- `num_iterations` - 迭代次数\n- `print_cost` - 是否打印成本\n\n###\
  \ 实现代码\n```python\nnp.random.seed(1)\ncosts = []\n\n# 参数初始化\nparameters = initializeDeepModel(layersDimensions)\n\
  \n# 梯度下降循环\nfor i in range(0, num_iterations):\n    # 前向传播: [LINEAR -> RELU]*(L-1)\
  \ -> LINEAR -> SIGMOID/SOFTMAX\n    AL, caches = forwardPropagationDeep(X1, parameters,\n\
  \                                        hiddenActivationFunc=\"relu\",\n      \
  \                                  outputActivationFunc=outputActivationFunc)\n\
  \    \n    # 计算成本\n    cost = computeCost(AL, Y1, outputActivationFunc=outputActivationFunc)\n\
  \    \n    # 反向传播\n    gradients = backwardPropagationDeep(AL, Y1, caches,\n   \
  \                                     hiddenActivationFunc=\"relu\",\n         \
  \                               outputActivationFunc=outputActivationFunc)\n   \
  \ \n    # 更新参数\n    parameters = gradientDescent(parameters, gradients,\n      \
  \                           learningRate=learningRate,\n                       \
  \          outputActivationFunc=outputActivationFunc)\n    \n    # 每 1000 次迭代打印/记录成本\n\
  \    if print_cost and i % 1000 == 0:\n        print(\"Cost after iteration %i:\
  \ %f\" % (i, cost))\n        costs.append(cost)\n\n# 绘制成本曲线\nplt.plot(np.squeeze(costs))\n\
  plt.ylabel('cost')\nplt.xlabel('No of iterations (x100)')\nplt.title(\"Learning\
  \ rate =\" + str(learningRate))\nplt.savefig(\"fig1\", bbox_inches='tight')\n\n\
  return parameters\n```\n\n## L 层深度学习模型 (随机梯度下降)\n\n### 函数签名\n```python\ndef L_Layer_DeepModel_SGD(X1,\
  \ Y1, layersDimensions,\n                          hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\",\n                          learningRate=0.3,\
  \ mini_batch_size=64,\n                          num_epochs=2500, print_cost=False):\n\
  ```\n\n### 参数说明\n- `X1` - 输入特征\n- `Y1` - 输出标签\n- `layersDimensions` - 各层维度\n- `hiddenActivationFunc`\
  \ - 隐藏层激活函数 (`relu`/`tanh`/`sigmoid`)\n- `outputActivationFunc` - 输出层激活函数 (`sigmoid`/`softmax`)\n\
  - `learningRate` - 学习率\n- `mini_batch_size` - 小批量大小\n- `num_epochs` - 训练轮数\n- `print_cost`\
  \ - 是否打印成本\n\n### 实现代码\n```python\nnp.random.seed(1)\ncosts = []\n\n# 参数初始化\nparameters\
  \ = initializeDeepModel(layersDimensions)\nseed = 10\n\n# 训练轮数循环\nfor i in range(num_epochs):\n\
  \    # 重新打乱数据集\n    seed = seed + 1\n    minibatches = random_mini_batches(X1, Y1,\
  \ mini_batch_size, seed)\n    \n    # 遍历每个小批量\n    for minibatch in minibatches:\n\
  \        (minibatch_X, minibatch_Y) = minibatch\n        \n        # 前向传播\n    \
  \    AL, caches = forwardPropagationDeep(minibatch_X, parameters,\n            \
  \                                hiddenActivationFunc=\"relu\",\n              \
  \                              outputActivationFunc=outputActivationFunc)\n    \
  \    \n        # 计算成本\n        cost = computeCost(AL, minibatch_Y,\n           \
  \                outputActivationFunc=outputActivationFunc)\n        \n        #\
  \ 反向传播\n        gradients = backwardPropagationDeep(AL, minibatch_Y, caches,\n \
  \                                           hiddenActivationFunc=\"relu\",\n   \
  \                                         outputActivationFunc=outputActivationFunc)\n\
  \        \n        # 更新参数\n        parameters = gradientDescent(parameters, gradients,\n\
  \                                     learningRate=learningRate,\n             \
  \                        outputActivationFunc=outputActivationFunc)\n    \n    #\
  \ 每 100 个 epoch 打印/记录成本\n    if print_cost and i % 100 == 0:\n        print(\"Cost\
  \ after epoch %i: %f\" % (i, cost))\n        costs.append(cost)\n\n# 绘制成本曲线\nplt.plot(np.squeeze(costs))\n\
  plt.ylabel('cost')\nplt.xlabel('No of iterations')\nplt.title(\"Learning rate =\"\
  \ + str(learningRate))\nplt.savefig(\"fig1\", bbox_inches='tight')\n\nreturn parameters\n\
  ```\n\n## 随机小批量生成\n\n### 函数签名\n```python\ndef random_mini_batches(X, Y, miniBatchSize=64,\
  \ seed=0):\n```\n\n### 参数说明\n- `X` - 输入特征\n- `Y` - 输出标签\n- `miniBatchSize` - 小批量大小\n\
  - `seed` - 随机种子\n\n### 实现代码\n```python\nnp.random.seed(seed)\n\n# 获取训练样本数\nm = X.shape[1]\n\
  \n# 初始化小批量列表\nmini_batches = []\n\n# 生成随机排列索引\npermutation = list(np.random.permutation(m))\n\
  \n# 打乱训练数据\nshuffled_X = X[:, permutation]\nshuffled_Y = Y[:, permutation].reshape((1,\
  \ m))\n\n# 计算完整小批量数量\nnumCompleteMinibatches = math.floor(m / miniBatchSize)\n\n\
  # 生成完整小批量\nfor k in range(0, numCompleteMinibatches):\n    mini_batch_X = shuffled_X[:,\
  \ k * miniBatchSize : (k + 1) * miniBatchSize]\n    mini_batch_Y = shuffled_Y[:,\
  \ k * miniBatchSize : (k + 1) * miniBatchSize]\n    mini_batch = (mini_batch_X,\
  \ mini_batch_Y)\n    mini_batches.append(mini_batch)\n\n# 处理剩余样本 (最后一个不完整批次)\nif\
  \ m % miniBatchSize != 0:\n    l = math.floor(m / miniBatchSize) * miniBatchSize\n\
  \    mini_batch_X = shuffled_X[:, l:m]\n    mini_batch_Y = shuffled_Y[:, l:m]\n\
  \    mini_batch = (mini_batch_X, mini_batch_Y)\n    mini_batches.append(mini_batch)\n\
  \nreturn mini_batches\n```\n\n## 决策边界绘制 (2D)\n\n### 函数签名\n```python\ndef plot_decision_boundary(model,\
  \ X, y, lr, fig):\n```\n\n### 参数说明\n- `model` - 输入模型\n- `X` - 特征数据\n- `y` - 标签数据\n\
  - `lr` - 学习率\n- `fig` - 保存图片路径\n\n### 实现代码\n```python\n# 设置网格范围\nx_min, x_max =\
  \ X[0, :].min() - 1, X[0, :].max() + 1\ny_min, y_max = X[1, :].min() - 1, X[1, :].max()\
