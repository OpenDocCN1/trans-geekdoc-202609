  在下面的 Python 代码中，我对手写数字 '5' 和 '非 5'（即所有其他数字）执行了一个简单的二分类。我将在第 5 章使用 Softmax 分类器对所有数字进行正确分类。\n\
  \n```python\nimport os\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n\
  execfile(\"./DLfunctions34.py\")\n\n# Load MNIST\nexecfile(\"./load_mnist.py\")\n\
  \n# Set the training and test data and labels\ntraining = list(read(dataset='training',\
  \ path=\"./mnist\"))\ntest = list(read(dataset='testing', path=\"./mnist\"))\n\n\
  lbls = []\npxls = []\n\nprint(len(training))\n\n# Select the first 10000 training\
  \ data and the labels\nfor i in range(10000):\n    l, p = training[i]\n    lbls.append(l)\n\
  \    pxls.append(p)\n\nlabels = np.array(lbls)\npixels = np.array(pxls)\n\n# Set\
  \ y=1 when labels == 5 and 0 otherwise\ny = (labels == 5).reshape(-1, 1)\nX = pixels.reshape(pixels.shape[0],\
  \ -1)\n\n# Create the necessary feature and target variable\nX1 = X.T\nY1 = y.T\n\
  \n# Create the layer dimensions. The number of features are 28 x 28 = 784 since\
  \ the 28 x 28\n# pixels is flattened to single vector of length 784.\n# 784 – No\
  \ of input features = 28 x28\n# 15, 9 – 2 hidden layers with 15 and 9 hidden activation\
  \ units\n# 1 – 1 activation unit in the output layer (sigmoid)\nlayersDimensions\
  \ = [784, 15, 9, 7, 1]  #\n\n# Execute the L-Layer Deep Learning Network\n# hidden\
  \ activation function – relu\n# learning rate – 0.1\nparameters = L_Layer_DeepModel(X1,\
  \ Y1, layersDimensions,\n                               hiddenActivationFunc='relu',\
  \ learning_rate=0.1,\n                               num_iterations=1000, fig=\"\
  fig7.png\")\n\n# Read the Test data and labels\nlbls1 = []\npxls1 = []\n\nfor i\
  \ in range(800):\n    l, p = test[i]\n    lbls1.append(l)\n    pxls1.append(p)\n\
  \ntestLabels = np.array(lbls1)\ntestData = np.array(pxls1)\n\nytest = (testLabels\
  \ == 5).reshape(-1, 1)\nXtest = testData.reshape(testData.shape[0], -1)\nXtest1\
  \ = Xtest.T\nYtest1 = ytest.T\n\n# Predict based on test data\nyhat = predict(parameters,\
  \ Xtest1)\n\nfrom sklearn.metrics import confusion_matrix\n\n# Compute the confusion\
  \ matrix\na = confusion_matrix(Ytest1.T, yhat.T)\n\n# Print accuracy, precision,\
  \ recall and F1 score\nfrom sklearn.metrics import accuracy_score, precision_score,\
  \ recall_score, f1_score\n\nprint('Accuracy: {:.2f}'.format(accuracy_score(Ytest1.T,\
  \ yhat.T)))\nprint('Precision: {:.2f}'.format(precision_score(Ytest1.T, yhat.T)))\n\
  print('Recall: {:.2f}'.format(recall_score(Ytest1.T, yhat.T)))\nprint('F1: {:.2f}'.format(f1_score(Ytest1.T,\
  \ yhat.T)))\n\n# Plot the Precision-Recall curve\nprobs = predict_proba(parameters,\
  \ Xtest1)\n\nfrom sklearn.metrics import precision_recall_curve\n\nprecision, recall,\
  \ thresholds = precision_recall_curve(Ytest1.T, probs.T)\nclosest_zero = np.argmin(np.abs(thresholds))\n\
  closest_zero_p = precision[closest_zero]\nclosest_zero_r = recall[closest_zero]\n\
  \n# Plot precision-recall curve\nplt.xlim([0.0, 1.01])\nplt.ylim([0.0, 1.01])\n\
  plt.plot(precision, recall, label='Precision-Recall Curve')\nplt.plot(closest_zero_p,\
  \ closest_zero_r, 'o', markersize=12, fillstyle='none', c='r', mew=3)\nplt.xlabel('Precision',\
  \ fontsize=16)\nplt.ylabel('Recall', fontsize=16)\nplt.savefig(\"fig8.png\", bbox_inches='tight')\n\
