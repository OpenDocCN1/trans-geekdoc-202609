  relu\")\n    [AL, forward_caches, activation_caches] = forwardPropagationDeep(X,\
  \ weights, biases, hiddenActivationFunc);\nend\n```\n\n\n\n\n\n# 创建随机小批量。返回包含小批量的元胞数组\n\
  \n**输入**：`X`，`Y`  \n**输入**：小批量大小  \n**输入**：种子\n\n**输出**：小批量 `X` 和 `Y`\n\n```matlab\n\
  function [mini_batches_X mini_batches_Y] = random_mini_batches(X, Y, miniBatchSize\
  \ = 64, seed = 0)\n\nrand(\"seed\", seed);\n\n# 获取训练样本数量\nm = size(X)(2);\n\n# 创建一个小于\
  \ m 的随机数列表\npermutation = randperm(m);\n\n# 随机打乱训练数据\nshuffled_X = X(:, permutation);\n\
  shuffled_Y = Y(:, permutation);\n\n# 计算小批量数量\nnumCompleteMinibatches = floor(m/miniBatchSize);\n\
  \nbatch = 0;\n\nfor k = 0:(numCompleteMinibatches-1)\n    # 设置每个小批量的开始和结束\n    batch\
  \ = batch + 1;\n    lower = (k * miniBatchSize) + 1;\n    upper = (k + 1) * miniBatchSize;\n\
  \    mini_batch_X = shuffled_X(:, lower:upper);\n    mini_batch_Y = shuffled_Y(:,\
  \ lower:upper);\n\n    # 创建元胞数组\n    mini_batches_X{batch} = mini_batch_X;\n   \
  \ mini_batches_Y{batch} = mini_batch_Y;\nendfor\n\n# 如果批量大小不能整除小批量数量\nif mod(m,\
  \ miniBatchSize) != 0\n    # 设置最后一个小批量的开始和结束\n    l = floor(m/miniBatchSize) * miniBatchSize;\n\
  \    m = l + mod(m, miniBatchSize);\n    mini_batch_X = shuffled_X(:, (l+1):m);\n\
  \    mini_batch_Y = shuffled_Y(:, (l+1):m);\n    batch = batch + 1;\n    mini_batches_X{batch}\
  \ = mini_batch_X;\n    mini_batches_Y{batch} = mini_batch_Y;\nendif\n\nend\n```\n\
  \n# 7. 附录 6 - 深度学习中的初始化、正则化\n\n### 6.1 Python\n\n```python\n# -*- coding: utf-8\
  \ -*-\n############################################################################################################\n\
  #\n# File: DLfunctions61.py\n# Developer: Tinniam V Ganesh\n# Date : 16 Apr 2018\n\
  #\n##########################################################################################################\n\
  \nimport numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib\nimport\
  \ matplotlib.pyplot as plt\nfrom matplotlib import cm\nimport math\nimport sklearn\n\
  import sklearn.datasets\n\n# 计算向量的 Sigmoid\ndef sigmoid(Z):\n    A = 1/(1+np.exp(-Z))\n\
  \    cache = Z\n    return A, cache\n\n# 计算向量的 Relu\ndef relu(Z):\n    A = np.maximum(0,\
  \ Z)\n    cache = Z\n    return A, cache\n\n# 计算向量的 tanh\ndef tanh(Z):\n    A =\
  \ np.tanh(Z)\n    cache = Z\n    return A, cache\n\n# 计算向量的 Softmax\ndef softmax(Z):\n\
  \    # 获取未归一化的概率\n    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n    A = exp_scores\
  \ / np.sum(exp_scores, axis=1, keepdims=True)\n    cache = Z\n    return A, cache\n\
  \n# 计算向量的稳定 Softmax\ndef stableSoftmax(Z):\n    # 以数值稳定的方式计算向量 x 的 softmax\n   \
  \ shiftZ = Z.T - np.max(Z.T, axis=1).reshape(-1, 1)\n    exp_scores = np.exp(shiftZ)\n\
  \    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n\
  \    cache = Z\n    return A, cache\n\n# 计算 Relu 的导数\ndef reluDerivative(dA, cache):\n\
  \    Z = cache\n    dZ = np.array(dA, copy=True)  # 只是将 dz 转换为正确的对象。\n    # 当 z\
  \ <= 0 时，也应将 dz 设为 0。\n    dZ[Z <= 0] = 0\n    return dZ\n\n# 计算 Sigmoid 的导数\ndef\
  \ sigmoidDerivative(dA, cache):\n    Z = cache\n    s = 1/(1+np.exp(-Z))\n    dZ\
  \ = dA * s * (1-s)\n    return dZ\n\n# 计算 tanh 的导数\ndef tanhDerivative(dA, cache):\n\
  \    Z = cache\n    a = np.tanh(Z)\n    dZ = dA * (1 - np.power(a, 2))\n    return\
  \ dZ\n\n# 计算 Softmax 的导数\ndef softmaxDerivative(dA, cache, y, numTraining):\n  \
  \  # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算 softmax\n\
  \    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n    probs = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    # 计算分数的梯度\n    dZ = probs\n    # dZ = pi- yi\n   \
  \ dZ[range(int(numTraining)), y[:, 0]] -= 1\n    return dZ\n\n# 计算稳定 Softmax 的导数\n\
  def stableSoftmaxDerivative(dA, cache, y, numTraining):\n    # 注意：未使用 dA。dL/dZ =\
  \ dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算稳定 softmax\n    shiftZ = Z.T - np.max(Z.T,\
  \ axis=1).reshape(-1, 1)\n    exp_scores = np.exp(shiftZ)\n    # 对每个样本进行归一化\n  \
  \  probs = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n    # 计算分数的梯度\n\
  \    dZ = probs\n    # dZ = pi- yi\n    dZ[range(int(numTraining)), y[:, 0]] -=\
  \ 1\n    return dZ\n\n# 初始化模型\n# 输入：特征数量\n# 隐藏单元数量\n# 输出层单元数量\n# 返回：权重和偏置矩阵及向量\n\
  def initializeModel(numFeats, numHidden, numOutput):\n    np.random.seed(1)\n  \
  \  W1 = np.random.randn(numHidden, numFeats) * 0.01  # 乘以 .01\n    b1 = np.zeros((numHidden,\
  \ 1))\n    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n    # 创建神经网络参数字典\n    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2':\
  \ b2}\n    return nnParameters\n\n# 为 L 层初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  def initializeDeepModel(layerDimensions):\n    np.random.seed(3)\n    # 注意第 'l'\
  \ 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n    # 从 1 循环到 L\n    layerParams =\
  \ {}\n    for l in range(1, len(layerDimensions)):\n        layerParams['W' + str(l)]\
  \ = np.random.randn(layerDimensions[l], layerDimensions[l-1]) * 0.01  # 乘以 .01\n\
  \        layerParams['b' + str(l)] = np.zeros((layerDimensions[l], 1))\n    return\
  \ layerParams\n\n# 为 L 层进行 He 初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n# He 初始化将随机数乘以\
  \ sqrt(2/layerDimensions[l-1])\ndef HeInitializeDeepModel(layerDimensions):\n  \
  \  np.random.seed(3)\n    # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n\
  \    # 从 1 循环到 L\n    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n\
  \        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l-1])\
  \ * np.sqrt(2/layerDimensions[l-1])\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n\n# 为 L 层进行 Xavier 初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  # Xavier 初始化将随机数乘以 sqrt(1/layerDimensions[l-1])\ndef XavInitializeDeepModel(layerDimensions):\n\
  \    np.random.seed(3)\n    # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n\
  \    # 从 1 循环到 L\n    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n\
  \        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l-1])\
  \ * np.sqrt(1/layerDimensions[l-1])\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n\n# 计算深度网络中第 'l' 层的前向传播激活值\n# 输入：A_prev - 上一层的激活值\n\
  # W,b - 权重和偏置矩阵及向量\n# keep_prob\n# activationFunc - 激活函数 - sigmoid, tanh, relu 等\n\
  # 返回：该层的激活值\n# Z = W * X + b\n# A = sigmoid(Z), A= Relu(Z), A= tanh(Z)\ndef layerActivationForward(A_prev,\
  \ W, b, keep_prob=1, activationFunc=\"relu\"):\n    # 计算 Z\n    Z = np.dot(W, A_prev)\
  \ + b\n    forward_cache = (A_prev, W, b)\n    # 计算 sigmoid 的激活值\n    if activationFunc\
  \ == \"sigmoid\":\n        A, activation_cache = sigmoid(Z)\n    # 计算 Relu 的激活值\n\
  \    elif activationFunc == \"relu\":\n        A, activation_cache = relu(Z)\n \
  \   # 计算 tanh 的激活值\n    elif activationFunc == 'tanh':\n        A, activation_cache\
  \ = tanh(Z)\n    elif activationFunc == 'softmax':\n        A, activation_cache\
  \ = stableSoftmax(Z)\n    cache = (forward_cache, activation_cache)\n    return\
  \ A, cache\n\n# 计算第 1..L 层的前向传播\n```\n\n\n\n\n\n# Input: X - 输入特征\n\n# Parameters:\
  \ 权重和偏置\n\n# keep_prob\n\n# hiddenActivationFunc - 隐藏层的激活函数 Relu/tanh\n\n# outputActivationFunc\
  \ - 输出层的激活函数 - sigmoid/softmax\n\n# Returns: AL\n\n# caches\n\n# dropoutMat\n\n\
  # 正向传播在第 1 层到 L-1 层使用 Relu/tanh 激活函数，在第 L 层使用 sigmoid 激活函数\n\n```python\ndef forwardPropagationDeep(X,\
  \ parameters, keep_prob=1,\n                           hiddenActivationFunc='relu',\
  \ outputActivationFunc='sigmoid'):\n    caches = []\n\n    # 初始化 dropout 矩阵\n  \
  \  dropoutMat = {}\n\n    # 将 A 设为 X (A0)\n    A = X\n\n    L = int(len(parameters)\
  \ / 2)  # 神经网络中的层数\n\n    # 从第 1 层循环到第 L 层\n    for l in range(1, L):\n        A_prev\
  \ = A\n\n        # Zi = Wi x Ai-1 + bi 和 Ai = g(Zi)\n        A, cache = layerActivationForward(A_prev,\
  \ parameters['W' + str(l)], parameters['b' + str(l)], keep_prob, activationFunc=hiddenActivationFunc)\n\
  \n        # 随机丢弃一些激活单元\n        # 创建一个与 A 形状相同的矩阵\n        D = np.random.rand(A.shape[0],\
  \ A.shape[1])\n        D = (D < keep_prob)\n\n        # 我们需要在反向传播中使用相同的 'dropout'\
  \ 矩阵\n        # 保存 dropout 矩阵以供反向传播使用\n        dropoutMat[\"D\" + str(l)] = D\n\n\
  \        A = np.multiply(A, D)\n        A = np.divide(A, keep_prob)\n\n        caches.append(cache)\n\
  \n    # 由于这是二分类，在最后一层使用 sigmoid 激活函数\n    AL, cache = layerActivationForward(A,\
  \ parameters['W' + str(L)], parameters['b' + str(L)], activationFunc=outputActivationFunc)\n\
  \    caches.append(cache)\n\n    return AL, caches, dropoutMat\n```\n\n# 计算代价\n\n\
  # Input: parameters\n\n# : AL\n\n# : Y\n\n# : outputActivationFunc - 输出层的激活函数 -\
  \ sigmoid/softmax/tanh\n\n# Output: cost\n\n```python\ndef computeCost(parameters,\
  \ AL, Y, outputActivationFunc=\"sigmoid\"):\n    if outputActivationFunc == \"sigmoid\"\
  :\n        m = float(Y.shape[1])\n\n        # 对 logprobs 进行逐元素相乘\n        cost =\
  \ -1 / m * np.sum(Y * np.log(AL) + (1 - Y) * (np.log(1 - AL)))\n        cost = np.squeeze(cost)\n\
  \n    elif outputActivationFunc == \"softmax\":\n        # 对 softmax 进行 Y 的转置\n\
  \        Y = Y.T\n        m = float(len(Y))\n\n        # 计算对数概率。基于输出 y 获取正确类别的对数概率\n\
  \        correct_logprobs = -np.log(AL[range(int(m)), Y.T])\n\n        # 计算损失\n\
  \        cost = np.sum(correct_logprobs) / m\n\n    return cost\n```\n\n# 计算带正则化的代价\n\
  \n# Input: parameters\n\n# : AL\n\n# : Y\n\n# : lambd\n\n# : outputActivationFunc\
  \ - 输出层的激活函数 - sigmoid/softmax/tanh\n\n# Output: cost\n\n```python\ndef computeCostWithReg(parameters,\
  \ AL, Y, lambd,\n                       outputActivationFunc=\"sigmoid\"):\n   \
  \ if outputActivationFunc == \"sigmoid\":\n        m = float(Y.shape[1])\n\n   \
  \     # 对 logprobs 进行逐元素相乘\n        cost = -1 / m * np.sum(Y * np.log(AL) + (1 -\
  \ Y) * (np.log(1 - AL)))\n        cost = np.squeeze(cost)\n\n        # 正则化代价\n \
  \       L = int(len(parameters) / 2)\n        L2RegularizationCost = 0\n       \
  \ for l in range(L):\n            L2RegularizationCost += np.sum(np.square(parameters['W'\
  \ + str(l + 1)]))\n        L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \        cost = cost + L2RegularizationCost\n\n    elif outputActivationFunc ==\
  \ \"softmax\":\n        # 对 softmax 进行 Y 的转置\n        Y = Y.T\n        m = float(len(Y))\n\
  \n        # 计算对数概率。基于输出 y 获取正确类别的对数概率\n        correct_logprobs = -np.log(AL[range(int(m)),\
  \ Y.T])\n\n        # 计算损失\n        cost = np.sum(correct_logprobs) / m\n\n     \
  \   # 正则化代价\n        L = int(len(parameters) / 2)\n        L2RegularizationCost\
  \ = 0\n        for l in range(L):\n            L2RegularizationCost += np.sum(np.square(parameters['W'\
  \ + str(l + 1)]))\n        L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \        cost = cost + L2RegularizationCost\n\n    return cost\n```\n\n# 计算包含 dropout\
  \ 的单周期反向传播\n\n# Input: 神经网络参数 - dA\n\n# # cache - forward_cache 和 activation_cache\n\
  \n# # 输入特征\n\n# # keep_prob\n\n# # 输出值 Y\n\n# Returns: 梯度\n\n# dL/dWi = dL/dZi *\
  \ Al-1\n\n# dl/dbl = dL/dZl\n\n# dL/dZ_prev = dL/dZl * W\n\n```python\ndef layerActivationBackward(dA,\
  \ cache, Y, keep_prob=1,\n                            activationFunc=\"relu\"):\n\
  \    forward_cache, activation_cache = cache\n    A_prev, W, b = forward_cache\n\
  \    numtraining = float(A_prev.shape[1])\n\n    # print(\"n=\", numtraining)\n\
  \    # print(\"no=\", numtraining)\n\n    if activationFunc == \"relu\":\n     \
  \   dZ = reluDerivative(dA, activation_cache)\n    elif activationFunc == \"sigmoid\"\
  :\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA, activation_cache, Y,\
  \ numtraining)\n\n    if activationFunc == 'softmax':\n        dW = 1 / numtraining\
  \ * np.dot(A_prev, dZ)\n        db = 1 / numtraining * np.sum(dZ, axis=0, keepdims=True)\n\
  \        dA_prev = np.dot(dZ, W)\n    else:\n        # print(numtraining)\n    \
  \    dW = 1 / numtraining * (np.dot(dZ, A_prev.T))\n        # print(\"dW=\", dW)\n\
  \        db = 1 / numtraining * np.sum(dZ, axis=1, keepdims=True)\n        # print(\"\
  db=\", db)\n        dA_prev = np.dot(W.T, dZ)\n\n    return dA_prev, dW, db\n```\n\
  \n# 计算带正则化的单周期反向传播\n\n# Input: dA - 神经网络参数\n\n# # cache - forward_cache 和 activation_cache\n\
  \n# # 输出值 Y\n\n# # lambd\n\n# # activationFunc\n\n# Returns dA_prev, dW, db\n\n\
  # Returns: 梯度\n\n# dL/dWi = dL/dZi * Al-1\n\n# dl/dbl = dL/dZl\n\n# dL/dZ_prev =\
  \ dL/dZl * W\n\n```python\ndef layerActivationBackwardWithReg(dA, cache, Y, lambd,\
  \ activationFunc):\n    forward_cache, activation_cache = cache\n    A_prev, W,\
  \ b = forward_cache\n    numtraining = float(A_prev.shape[1])\n\n    # print(\"\
  n=\", numtraining)\n    # print(\"no=\", numtraining)\n\n    if activationFunc ==\
  \ \"relu\":\n        dZ = reluDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"sigmoid\":\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif\
  \ activationFunc == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n\
  \    elif activationFunc == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA,\
  \ activation_cache, Y, numtraining)\n\n    if activationFunc == 'softmax':\n   \
  \     # 添加正则化因子\n        dW = 1 / numtraining * np.dot(A_prev, dZ) + (lambd / numtraining)\
  \ * W.T\n        db = 1 / numtraining * np.sum(dZ, axis=0, keepdims=True)\n    \
  \    dA_prev = np.dot(dZ, W)\n    else:\n        # 添加正则化因子\n        dW = 1 / numtraining\
  \ * (np.dot(dZ, A_prev.T)) + (lambd / numtraining) * W\n        # print(\"dW=\"\
  , dW)\n        db = 1 / numtraining * np.sum(dZ, axis=1, keepdims=True)\n      \
  \  # print(\"db=\", db)\n        dA_prev = np.dot(W.T, dZ)\n\n    return dA_prev,\
  \ dW, db\n```\n\n# 计算单周期反向传播\n\n# Input: AL: L 层网络的输出 - 权重\n\n# # Y 真实输出\n\n# #\
  \ caches -- 包含以下内容的缓存列表：\n\n# # dropoutMat\n\n# # lambd\n\n# # keep_prob\n\n# #\
  \ 每个 layerActivationForward() 的缓存，激活函数为 \"relu\"/\"tanh\"\n# # (即 caches[l]，l 的范围为\
  \ range(L-1)，即 l = 0...L-2)\n\n# # layerActivationForward() 的缓存，激活函数为 \"sigmoid\"\
  \ (即 caches[L-1])\n\n# # hiddenActivationFunc - 隐藏层的激活函数 - relu/sigmoid/tanh\n\n\
  # # outputActivationFunc - 输出层的激活函数 - sigmoid/softmax\n\n# Returns:\n\n# gradients\
  \ -- 一个包含梯度的字典\n\n# gradients[\"dA\" + str(l)] = ...\n\n# gradients[\"dW\" + str(l)]\
  \ = ...\n\n```python\ndef backwardPropagationDeep(AL, Y, caches, dropoutMat, lambd=0,\
  \ keep_prob=1,\n                            hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\"):\n    # 初始化梯度\n    gradients = {}\n\n    # 设置层数\n    L = len(caches)\n\
  \    m = float(AL.shape[1])\n\n    if outputActivationFunc == \"sigmoid\":\n   \
  \     Y = Y.reshape(AL.shape)  # 执行此行后，Y 的形状与 AL 相同\n\n        # 初始化反向传播\n     \
  \   # dl/dAL = -(y/a + (1-y)/(1-a)) - 在输出层\n        dAL = - (np.divide(Y, AL) -\
  \ np.divide(1 - Y, 1 - AL))\n    else:\n        dAL = 0\n        Y = Y.T\n\n   \
  \ # 由于这是二分类，输出层的激活函数是 sigmoid\n    # 获取最后一层的梯度\n    # Inputs: \"AL, Y, caches\"\
  。\n    # Outputs: \"gradients[\"dAL\"], gradients[\"dWL\"], gradients[\"dbL\"]\"\
  \n    current_cache = caches[L - 1]\n\n    if lambd == 0:\n        gradients[\"\
  dA\" + str(L)], gradients[\"dW\" + str(L)], gradients[\"db\" + str(L)] \\\n    \
  \        = layerActivationBackward(dAL, current_cache,\n                       \
  \               Y, activationFunc=outputActivationFunc)\n    else:  # 正则化\n```\n\
  \n\n\n\n\n# 深度学习模型实现\n\n## 反向传播\n\n```python\ngradients[\"dA\" + str(L)], gradients[\"\
  dW\" + str(L)], gradients[\"db\" + str(L)] \\\n= layerActivationBackwardWithReg(dAL,\
  \ current_cache,\nY, lambd, activationFunc=outputActivationFunc)\n\n# 注意：softmax\
  \ 的 dA 是转置\nif outputActivationFunc == \"softmax\":\n    gradients[\"dA\" + str(L)]\
  \ = gradients[\"dA\" + str(L)].T\n\n# 反向遍历\nfor l in reversed(range(L-1)):\n   \
  \ # 计算 L-1 到 1 层的梯度，针对 Relu/tanh\n    # 输入：\"gradients[\"dA\" + str(l + 2)], caches\"\
  。\n    # 输出：\"gradients[\"dA\" + str(l + 1)] , gradients[\"dW\" + str(l + 1)] ,\
  \ gradients[\"db\" + str(l + 1)]\n    current_cache = caches[l]\n    # dA_prev_temp,\
  \ dW_temp, db_temp =\n    # layerActivationBackward(gradients['dA'+str(l+2)], current_cache,\
  \ activationFunc=\"relu\")\n\n    if lambd == 0:\n        # 反向传播时使用相同的 dropout 矩阵\n\
  \        # 随机 dropout\n        # 将 dA'l' 与 dropoutMat 相乘并除以 keep_prob 以保持期望值不变\n\
  \        D = dropoutMat[\"D\" + str(l+1)]\n        # 丢弃部分 dAl\n        gradients['dA'+str(l+2)]\
  \ = np.multiply(gradients['dA'+str(l+2)], D)\n        # 除以 keep_prob 以保持期望值不变\n\
  \        gradients['dA'+str(l+2)] = np.divide(gradients['dA'+str(l+2)], keep_prob)\n\
  \        dA_prev_temp, dW_temp, db_temp = \\\n            layerActivationBackward(gradients['dA'+str(l+2)],\
  \ current_cache, Y, keep_prob=1, activationFunc=hiddenActivationFunc)\n    else:\n\
  \        dA_prev_temp, dW_temp, db_temp = \\\n            layerActivationBackwardWithReg(gradients['dA'+str(l+2)],\
  \ current_cache, Y,\n            lambd, activationFunc=hiddenActivationFunc)\n\n\
  \    gradients[\"dA\" + str(l + 1)] = dA_prev_temp\n    gradients[\"dW\" + str(l\
  \ + 1)] = dW_temp\n    gradients[\"db\" + str(l + 1)] = db_temp\n\nreturn gradients\n\
  ```\n\n## 梯度下降\n\n```python\n# 执行梯度下降\n# 输入：权重和偏置\n# ：梯度\n# ：学习率\n# ：outputActivationFunc\
  \ - 输出层激活函数 - sigmoid/softmax\n# 输出：1 次迭代后更新的权重\n\ndef gradientDescent(parameters,\
  \ gradients,\n                    learningRate, outputActivationFunc=\"sigmoid\"\
  ):\n    L = int(len(parameters) / 2)\n    # 每个参数的更新规则。\n    for l in range(L-1):\n\
  \        parameters[\"W\" + str(l+1)] = parameters['W'+str(l+1)] - learningRate\
  \ * \\\n                                     gradients['dW' + str(l+1)]\n      \
  \  parameters[\"b\" + str(l+1)] = parameters['b'+str(l+1)] - learningRate * \\\n\
  \                                     gradients['db' + str(l+1)]\n\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)] -\
  \ learningRate * \\\n                                   gradients['dW' + str(L)]\n\
  \        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate * \\\
  \n                                   gradients['db' + str(L)]\n    elif outputActivationFunc\
  \ == \"softmax\":\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)] -\
  \ learningRate * \\\n                                   gradients['dW' + str(L)].T\n\
  \        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate * \\\
  \n                                   gradients['db' + str(L)].T\n\n    return parameters\n\
  ```\n\n## L 层深度学习模型（批量梯度下降）\n\n```python\n# 执行 L 层深度学习模型\n# 输入：X - 输入特征\n# ：Y 输出\n\
  # ：layersDimensions - 层维度\n# ：hiddenActivationFunc - 隐藏层激活函数 relu/tanh/sigmoid\n\
  # ：outputActivationFunc - 输出层激活函数 sigmoid/softmax\n# ：学习率\n# ：lambd\n# ：keep_prob\n\
  # ：迭代次数\n# ：initType\n# 输出：parameters\n\ndef L_Layer_DeepModel(X1, Y1, layersDimensions,\n\
  \                      hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\"\
  ,\n                      learningRate=.3, lambd=0, keep_prob=1, num_iterations=10000,\n\
  \                      initType=\"default\", print_cost=False, figure=\"figa.png\"\
  ):\n    np.random.seed(1)\n    costs = []\n\n    # 参数初始化。\n    if initType == \"\
  He\":\n        parameters = HeInitializeDeepModel(layersDimensions)\n    elif initType\
  \ == \"Xavier\":\n        parameters = XavInitializeDeepModel(layersDimensions)\n\
  \    else:  # 默认\n        parameters = initializeDeepModel(layersDimensions)\n\n\
  \    # 循环（梯度下降）\n    for i in range(0, num_iterations):\n        AL, caches, dropoutMat\
  \ = forwardPropagationDeep(X1, parameters, keep_prob,\n                        \
  \                                hiddenActivationFunc=\"relu\",\n              \
  \                                          outputActivationFunc=outputActivationFunc)\n\
  \n        # 正则化参数为 0\n        if lambd == 0:\n            # 计算成本\n            cost\
  \ = computeCost(parameters, AL, Y1,\n                               outputActivationFunc=outputActivationFunc)\n\
  \        # 包含 L2 正则化\n        else:\n            # 计算成本\n            cost = computeCostWithReg(parameters,\
  \ AL, Y1, lambd,\n                                      outputActivationFunc=outputActivationFunc)\n\
  \n        # 反向传播。\n        gradients = backwardPropagationDeep(AL, Y1, caches, dropoutMat,\
  \ lambd, keep_prob,\n                                            hiddenActivationFunc=\"\
  relu\",\n                                            outputActivationFunc=outputActivationFunc)\n\
  \n        # 更新参数。\n        parameters = gradientDescent(parameters, gradients,\n\
  \                                     learningRate=learningRate,\n             \
  \                        outputActivationFunc=outputActivationFunc)\n\n        #\
  \ 每 1000 次训练示例打印一次成本\n        if print_cost and i % 1000 == 0:\n            print(\"\
  Cost after iteration %i: %f\" % (i, cost))\n\n        if print_cost and i % 1000\
  \ == 0:\n            costs.append(cost)\n\n    # 绘制成本曲线\n    plt.plot(np.squeeze(costs))\n\
  \    plt.ylabel('Cost')\n    plt.xlabel('迭代次数 (x1000)')\n    plt.title(\"Learning\
  \ rate =\" + str(learningRate))\n    plt.savefig(figure, bbox_inches='tight')\n\
  \    # plt.show()\n    plt.clf()\n    plt.close()\n\n    return parameters\n```\n\
  \n## L 层深度学习模型（随机梯度下降）\n\n```python\n# 执行 L 层深度学习模型 随机梯度下降\n# 输入：X1 - 输入特征\n# ：Y1\
  \ - 输出\n# ：layersDimensions - 层维度\n# ：hiddenActivationFunc - 隐藏层激活函数 relu/tanh/sigmoid\n\
  # ：outputActivationFunc - 输出层激活函数 - sigmoid/softmax\n# ：学习率\n# ：mini_batch_size\n\
  # ：num_epochs\n# 输出：parameters\n\ndef L_Layer_DeepModel_SGD(X1, Y1, layersDimensions,\n\
  \                          hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\",\n                          learningRate=.3, mini_batch_size=64, num_epochs=2500,\n\
  \                          print_cost=False):  # lr was 0.009\n    np.random.seed(1)\n\
  \    costs = []\n\n    # 参数初始化。\n    parameters = initializeDeepModel(layersDimensions)\n\
  \    seed = 10\n\n    # 循环遍历 epoch 数量\n    for i in range(num_epochs):\n       \
  \ # 定义随机小批量。我们增加种子以便在每个 epoch 后以不同方式重新打乱数据集\n        seed = seed + 1\n        minibatches\
  \ = random_mini_batches(X1, Y1, mini_batch_size, seed)\n        batch = 0\n\n  \
  \      # 遍历每个小批量\n        for minibatch in minibatches:\n            # print(\"\
  batch=\", batch)\n            batch = batch + 1\n\n            # 选择一个小批量\n     \
  \       (minibatch_X, minibatch_Y) = minibatch\n\n            # 执行前向传播\n       \
  \     AL, caches = forwardPropagationDeep(minibatch_X,\n                       \
  \                         parameters,\n                                        \
  \        hiddenActivationFunc=\"relu\",\n                                      \
  \          outputActivationFunc=outputActivationFunc)\n\n            # 计算成本\n  \
  \          cost = computeCost(AL,\n                               minibatch_Y,\n\
  \                               outputActivationFunc=outputActivationFunc)\n   \
  \         # print(\"minibatch_Y=\", minibatch_Y.shape)\n\n            # 反向传播。\n\
  \            gradients = backwardPropagationDeep(AL, minibatch_Y,\n            \
  \                                    caches,\n                                 \
  \               hiddenActivationFunc=\"relu\",\n                               \
  \                 outputActivationFunc=outputActivationFunc)\n\n            # 更新参数。\n\
  \            parameters = gradientDescent(parameters, gradients,\n             \
  \                            learningRate=learningRate,\n                      \
  \                   outputActivationFunc=outputActivationFunc)\n\n        # 每 100\
  \ 个 epoch 打印一次成本\n        if print_cost and i % 100 == 0:\n            print(\"\
  Cost after epoch %i: %f\" % (i, cost))\n\n        if print_cost and i % 100 == 0:\n\
  \            costs.append(cost)\n\n    # 绘制成本曲线\n    plt.plot(np.squeeze(costs))\n\
  \    plt.ylabel('cost')\n    plt.xlabel('迭代次数')\n    plt.title(\"Learning rate =\"\
  \ + str(learningRate))\n    # plt.show()\n    plt.savefig(\"fig1\", bbox_inches='tight')\n\
  \    plt.close()\n\n    return parameters\n```\n\n## 创建随机小批量\n\n```python\n# 创建随机小批量\n\
  # 输入：X - 输入特征\n# ：Y - 输出\n# ：miniBatchSize\n# ：seed\n# 输出：mini_batches\n\ndef random_mini_batches(X,\
  \ Y, miniBatchSize=64, seed=0):\n    np.random.seed(seed)\n\n    # 获取训练样本数量\n  \
  \  m = X.shape[1]\n\n    # 初始化小批量\n    mini_batches = []\n\n    # 创建一个小于 m 的随机数列表\n\
  \    permutation = list(np.random.permutation(m))\n\n    # 随机打乱训练数据\n    shuffled_X\
  \ = X[:, permutation]\n    shuffled_Y = Y[:, permutation].reshape((1, m))\n\n  \
  \  # 计算小批量数量\n    numCompleteMinibatches = math.floor(m / miniBatchSize)\n\n   \
  \ # 针对小批量数量\n    for k in range(0, numCompleteMinibatches):\n        # 设置每个小批量的开始和结束\n\
  ```\n\n\n\n\n\n# Python 实现\n\n## 创建小批量\n\n```python\nmini_batch_X = shuffled_X[:,\
  \ k*miniBatchSize : (k+1) * miniBatchSize]\nmini_batch_Y = shuffled_Y[:, k*miniBatchSize\
  \ : (k+1) * miniBatchSize]\nmini_batch = (mini_batch_X, mini_batch_Y)\nmini_batches.append(mini_batch)\n\
  ```\n\n## 处理剩余批次\n\n```python\n# if m % miniBatchSize != 0:. 该批次不能被小批量大小整除\nif m\
  \ % miniBatchSize != 0:\n    l = math.floor(m/miniBatchSize)*miniBatchSize\n   \
  \ # 设置最后一个小批量的起始和结束位置\n    m = l + m % miniBatchSize\n    mini_batch_X = shuffled_X[:,\
  \ l:m]\n    mini_batch_Y = shuffled_Y[:, l:m]\n    mini_batch = (mini_batch_X, mini_batch_Y)\n\
  \    mini_batches.append(mini_batch)\n\nreturn mini_batches\n```\n\n## 绘制决策边界（版本\
  \ 1）\n\n```python\n# 绘制决策边界\n# 输入：输入模型、X、Y、sz - 隐藏单元数量、lr - 学习率、保存的图形文件名\n# 返回：无\n\
  def plot_decision_boundary(model, X, y, lr, figure1=\"figb.png\"):\n    print(\"\
  plot\")\n    # 设置最小值和最大值并给予一些边距\n    x_min, x_max = X[0, :].min() - 1, X[0, :].max()\
  \ + 1\n    y_min, y_max = X[1, :].min() - 1, X[1, :].max() + 1\n    colors = ['black',\
  \ 'gold']\n    cmap = matplotlib.colors.ListedColormap(colors)\n    h = 0.01\n \
  \   # 生成一个点网格，点之间的距离为 h\n    xx, yy = np.meshgrid(np.arange(x_min, x_max, h), np.arange(y_min,\
  \ y_max, h))\n    # 预测整个网格的函数值\n    Z = model(np.c_[xx.ravel(), yy.ravel()])\n \
  \   Z = Z.reshape(xx.shape)\n    # 绘制等高线和训练样本\n    plt.contourf(xx, yy, Z, cmap=\"\
  coolwarm\")\n    plt.ylabel('x2')\n    plt.xlabel('x1')\n    x = X.T\n    y = y.T.reshape(300,)\n\
  \    plt.scatter(x[:, 0], x[:, 1], c=y, s=20)\n    print(X.shape)\n    plt.title(\"\
  Decision Boundary for learning rate:\" + lr)\n    plt.savefig(figure1, bbox_inches='tight')\n\
  \    # plt.show()\n```\n\n## 预测函数\n\n```python\ndef predict(parameters, X, keep_prob=1,\
  \ hiddenActivationFunc=\"relu\", outputActivationFunc=\"sigmoid\"):\n    A2, cache,\
  \ dropoutMat = forwardPropagationDeep(X, parameters, keep_prob=1, hiddenActivationFunc=\"\
  relu\", outputActivationFunc=outputActivationFunc)\n    predictions = (A2 > 0.5)\n\
  \    return predictions\n\ndef predict_proba(parameters, X, outputActivationFunc=\"\
  sigmoid\"):\n    A2, cache = forwardPropagationDeep(X, parameters)\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        proba = A2\n    elif outputActivationFunc == \"softmax\"\
  :\n        proba = np.argmax(A2, axis=0).reshape(-1, 1)\n    print(\"A2=\", A2.shape)\n\
  \    return proba\n```\n\n## 绘制决策边界（版本 2）\n\n```python\n# 绘制决策边界\n# 输入：输入模型、X、Y、sz\
  \ - 隐藏单元数量、lr - 学习率、保存的图形文件名\n# 返回：无\ndef plot_decision_boundary1(X, y, W1, b1,\
  \ W2, b2, figure2=\"figc.png\"):\n    # plot_decision_boundary(lambda x: predict(parameters,\
  \ x.T), x1, y1.T, str(0.3), \"fig2.png\")\n    h = 0.02\n    x_min, x_max = X[:,\
  \ 0].min() - 1, X[:, 0].max() + 1\n    y_min, y_max = X[:, 1].min() - 1, X[:, 1].max()\
  \ + 1\n    xx, yy = np.meshgrid(np.arange(x_min, x_max, h), np.arange(y_min, y_max,\
  \ h))\n    Z = np.dot(np.maximum(0, np.dot(np.c_[xx.ravel(), yy.ravel()], W1.T)\
  \ + b1.T), W2.T) + b2.T\n    Z = np.argmax(Z, axis=1)\n    Z = Z.reshape(xx.shape)\n\
  \    fig = plt.figure()\n    plt.contourf(xx, yy, Z, cmap=plt.cm.Spectral, alpha=0.8)\n\
  \    print(X.shape)\n    y1 = y.reshape(300,)\n    plt.scatter(X[:, 0], X[:, 1],\
  \ c=y1, s=40, cmap=plt.cm.Spectral)\n    plt.xlim(xx.min(), xx.max())\n    plt.ylim(yy.min(),\
  \ yy.max())\n    plt.savefig(figure2, bbox_inches='tight')\n```\n\n## 加载数据集\n\n\
  ```python\n# 加载圆环数据集\ndef load_dataset():\n    np.random.seed(1)\n    train_X, train_Y\
  \ = sklearn.datasets.make_circles(n_samples=300, noise=.05)\n    np.random.seed(2)\n\
