  \n1;\n\n# 定义 sigmoid 函数\nfunction a = sigmoid(z)\n  a = 1 ./ (1 + exp(-z));\nend\n\
  \n# 计算损失\n# 输入：numTraining, Y, A\n# 输出：loss\nfunction loss = computeLoss(numtraining,\
  \ Y, A)\n  loss = -1/numtraining * sum((Y .* log(A)) + (1-Y) .* log(1-A));\nend\n\
  \n# 执行前向传播\n# 输入：w, b, X, Y\n# 输出：loss, dw, db, dZ\nfunction [loss, dw, db, dZ]\
  \ = forwardPropagation(w, b, X, Y)\n  % 计算 Z\n  Z = w' * X + b;\nend\n```\n\n\n\n\
  \n## 附录 2 - 实现一个简单的神经网络\n\n### 2.1 Python\n\n```python\n##############################################################################################\n\
  #\n# Created by: Tinniam V Ganesh\n# Date : 11 Jan 2018\n# File: DLfunctions.py\n\
  #\n##############################################################################################\n\
  \nimport numpy as np\nimport matplotlib\nimport matplotlib.pyplot as plt\n\n# 计算向量的\
  \ Sigmoid 函数值\n# 输入: z\n# 输出: a\ndef sigmoid(z):\n    a = 1 / (1 + np.exp(-z))\n\
  \    return a\n\n# 根据数据集计算模型形状\n# 输入: X, Y\n# 返回: modelParams\ndef getModelShape(X,\
  \ Y):\n    numTraining = X.shape[1]  # 训练样本数量\n    numFeats = X.shape[0]     # 输入特征数量\n\
  \    numHidden = 4             # 隐藏层单元数量\n    numOutput = Y.shape[0]    # 输出单元数量\n\
  \n    # 创建一个值字典\n    modelParams = {\n        \"numTraining\": numTraining,\n  \
  \      \"numFeats\": numFeats,\n        \"numHidden\": numHidden,\n        \"numOutput\"\
  : numOutput\n    }\n    return modelParams\n\n# 初始化模型\n# 输入: 特征数量, 隐藏单元数量, 输出单元数量\n\
  # 返回: 权重和偏置矩阵及向量\ndef initializeModel(numFeats, numHidden, numOutput):\n    np.random.seed(2)\n\
  \    W1 = np.random.randn(numHidden, numFeats) * 0.01  # 乘以 .01\n    b1 = np.zeros((numHidden,\
  \ 1))\n    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n\n    # 创建神经网络参数字典\n    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2':\
  \ b2}\n    return nnParameters\n\n# 计算神经网络的前向传播\n# 输入: X, nnParameters\n# 返回: 第\
  \ 2 层的激活值, 输出以及第 1 层和第 2 层的激活值\ndef forwardPropagation(X, nnParameters):\n    #\
  \ 获取参数\n    W1 = nnParameters[\"W1\"]\n    b1 = nnParameters[\"b1\"]\n    W2 = nnParameters[\"\
  W2\"]\n    b2 = nnParameters[\"b2\"]\n\n    # 计算输入层的 Z1\n    Z1 = np.dot(W1, X)\
  \ + b1\n\n    # 使用 tanh 激活函数计算输出 A1。\n    # tanh 激活函数的表现优于 sigmoid 函数\n    A1 =\
  \ np.tanh(Z1)\n\n    # 计算第 2 层的 Z2\n    Z2 = np.dot(W2, A1) + b2\n\n    # 使用 sigmoid\
  \ 激活函数计算输出 A2\n    A2 = sigmoid(Z2)\n\n    cache = {'Z1': Z1, 'A1': A1, 'Z2': Z2,\
  \ 'A2': A2}\n    return A2, cache\n\n# 计算代价\n# 输入: A2, Y\n# 输出: cost\ndef computeCost(A2,\
  \ Y):\n    m = float(Y.shape[1])\n\n    # 对 logprobs 进行逐元素相乘\n    cost = -1 / m\
  \ * np.sum(Y * np.log(A2) + (1 - Y) * (np.log(1 - A2)))\n    cost = np.squeeze(cost)\n\
  \    return cost\n\n# 计算 1 个周期的反向传播\n# 输入: 神经网络参数 - 权重和偏置, 两层的 Z 和激活值,\n#      \
  \ 输入特征, 输出值 Y\n# 返回: 梯度\ndef backPropagation(nnParameters, cache, X, Y):\n    numtraining\
  \ = float(X.shape[1])\n\n    # 获取参数\n    W1 = nnParameters[\"W1\"]\n    W2 = nnParameters[\"\
  W2\"]\n\n    # 获取神经网络缓存\n    A1 = cache[\"A1\"]\n    A2 = cache[\"A2\"]\n\n    #\
  \ 计算梯度\n    dZ2 = A2 - Y\n    dW2 = 1 / numtraining * np.dot(dZ2, A1.T)\n    db2\
  \ = 1 / numtraining * np.sum(dZ2, axis=1, keepdims=True)\n    dZ1 = np.multiply(np.dot(W2.T,\
  \ dZ2), (1 - np.power(A1, 2)))\n    dW1 = 1 / numtraining * np.dot(dZ1, X.T)\n \
  \   db1 = 1 / numtraining * np.sum(dZ1, axis=1, keepdims=True)\n\n    # 创建一个字典\n\
  \    gradients = {\n        \"dW1\": dW1,\n        \"db1\": db1,\n        \"dW2\"\
  : dW2,\n        \"db2\": db2\n    }\n    return gradients\n\n# 执行梯度下降\n# 输入: 权重和偏置,\
  \ 梯度, 学习率\n# 输出: 1 次迭代后更新的权重\ndef gradientDescent(nnParameters, gradients, learningRate):\n\
  \    W1 = nnParameters['W1']\n    b1 = nnParameters['b1']\n    W2 = nnParameters['W2']\n\
  \    b2 = nnParameters['b2']\n\n    dW1 = gradients[\"dW1\"]\n    db1 = gradients[\"\
  db1\"]\n    dW2 = gradients[\"dW2\"]\n    db2 = gradients[\"db2\"]\n\n    W1 = W1\
  \ - learningRate * dW1\n    b1 = b1 - learningRate * db1\n    W2 = W2 - learningRate\
  \ * dW2\n    b2 = b2 - learningRate * db2\n\n    # 更新神经网络参数\n    updatedNNParameters\
  \ = {\n        \"W1\": W1,\n        \"b1\": b1,\n        \"W2\": W2,\n        \"\
  b2\": b2\n    }\n    return updatedNNParameters\n\n# 通过最小化代价计算神经网络\n# 输入: 输入数据 X,\
  \ 输出 Y, 隐藏层隐藏单元数量,\n#       迭代次数\n# 返回: 神经网络更新后的权重和偏置向量\ndef computeNN(X, Y, numHidden,\
  \ learningRate, numIterations=10000):\n    np.random.seed(3)\n\n    modelParams\
  \ = getModelShape(X, Y)\n    numFeats = modelParams['numFeats']\n    numOutput =\
  \ modelParams['numOutput']\n\n    costs = []\n    nnParameters = initializeModel(numFeats,\
  \ numHidden, numOutput)\n\n    W1 = nnParameters['W1']\n    b1 = nnParameters['b1']\n\
  \    W2 = nnParameters['W2']\n    b2 = nnParameters['b2']\n\n    # 执行梯度下降\n    for\
  \ i in range(0, numIterations):\n        # 评估前向传播以计算输出层的激活值\n        A2, cache =\
  \ forwardPropagation(X, nnParameters)\n\n        # 根据输出激活值和 Y 计算代价\n        cost\
  \ = computeCost(A2, Y)\n\n        # 执行反向传播以计算梯度\n        gradients = backPropagation(nnParameters,\
  \ cache, X, Y)\n\n        # 使用梯度更新每次迭代的权重。\n        nnParameters = gradientDescent(nnParameters,\
  \ gradients, learningRate)\n\n        # 每 1000 次迭代打印一次代价\n        if i % 1000 ==\
  \ 0:\n            costs.append(cost)\n            print(\"Cost after iteration %i:\
  \ %f\" % (i, cost))\n\n    return nnParameters, costs\n\n# 为给定输入计算预测值\n# 输入: 神经网络参数,\
  \ 输入数据\ndef predict(nnParameters, X):\n    A2, cache = forwardPropagation(X, nnParameters)\n\
  \    predictions = (A2 > 0.5)\n    return predictions\n\n# 绘制决策边界\n# 输入: 输入模型, X,\
  \ Y, 要保存的图形文件名\n# 返回: 空\ndef plot_decision_boundary_n(model, X, y, fig):\n    #\
  \ 设置最小值和最大值并给予一些边距\n    x_min, x_max = X[0, :].min() - 1, X[0, :].max() + 1\n```\n\
  \n\n\n\n\n# Python 实现\n\n```python\ny_min, y_max = X[1, :].min() - 1, X[1, :].max()\
  \ + 1\n\ncolors = ['black', 'gold']\n\ncmap = matplotlib.colors.ListedColormap(colors)\n\
