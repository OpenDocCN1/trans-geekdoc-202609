  \ cmap=\"coolwarm\")\nplt.ylabel('x2')\nplt.xlabel('x1')\nplt.scatter(X[0, :], X[1,\
  \ :], c=y, s=7, cmap=cmap)\nplt.title(\"Decision Boundary for learning rate:\" +\
  \ lr)\nplt.savefig(fig, bbox_inches='tight')\n```\n\n## 预测函数\n\n### 二分类预测\n```python\n\
  def predict(parameters, X):\n    A2, cache = forwardPropagationDeep(X, parameters)\n\
