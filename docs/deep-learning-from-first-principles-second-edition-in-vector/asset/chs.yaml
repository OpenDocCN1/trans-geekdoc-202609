  \n# 3. 伯努利双纽线\n\n为了增加趣味性，我创建了伯努利双纽线的二维图形来执行非线性分类。双纽线由以下方程给出：\n\n$$ (x² + y²)² -\
  \ 2a²(x² - y²) \\le 0 $$\n\n## 3a. 使用深度学习网络对双纽线进行分类 – Relu 激活函数 (Python)\n\n```python\n\
  import os\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nos.chdir(\"C:\\\
  \\software\\\\DeepLearning-Posts\\\\part3\")\nexecfile(\"./DLfunctions33.py\")\n\
  \n# 创建数据集\nx1 = np.random.uniform(0, 10, 2000).reshape(2000, 1)\nx2 = np.random.uniform(0,\
  \ 10, 2000).reshape(2000, 1)\nX = np.append(x1, x2, axis=1)\n\n# 创建一个平方值 <0.4 的值子集。执行\
  \ ravel() 以展平此向量\n# 创建方程\n# (x² + y²)² - 2a²*(x² - y²) <= 0\na = np.power(np.power(X[:,\
  \ 0] - 5, 2) + np.power(X[:, 1] - 5, 2), 2)\nb = np.power(X[:, 0] - 5, 2) - np.power(X[:,\
  \ 1] - 5, 2)\nc = a - (b * np.power(4, 2)) <= 0\nY = c.reshape(2000, 1)\n\n# 创建双纽线的散点图\n\
  plt.scatter(X[:, 0], X[:, 1], c=Y, marker='o', s=15, cmap=\"viridis\")\nZ = np.append(X,\
  \ Y, axis=1)\nplt.savefig(\"fig50.png\", bbox_inches='tight')\nplt.clf()\n\n# 设置分类数据\n\
  X2 = X.T\nY2 = Y.T\n\n# 这些设置效果最好\n# 设置用于 Relu 激活函数的深度学习层维度\n# 2 - 输入特征\n# 7, 4 –\
  \ 2 个隐藏层，分别含 7 和 4 个隐藏单元\n# 1 – 输出层含 1 个 Sigmoid 激活单元\nlayersDimensions = [2, 7,\
  \ 4, 1]\n\n# 执行 L 层深度学习网络\n# 隐藏层激活函数 – relu\n# 学习率 – 0.5\nparameters = L_Layer_DeepModel(X2,\
  \ Y2, layersDimensions,\n                               hiddenActivationFunc='relu',\n\
  \                               learning_rate=0.5,\n                           \
  \    num_iterations=10000,\n                               fig=\"fig5.png\")\n\n\
  # 绘制决策边界\nplot_decision_boundary(lambda x: predict(parameters, x.T), X2, Y2, str(2.2),\
  \ \"fig6.png\")\n\n# 计算混淆矩阵\nyhat = predict(parameters, X2)\nfrom sklearn.metrics\
  \ import confusion_matrix\na = confusion_matrix(Y2.T, yhat.T)\n\n# 打印准确率、精确率、召回率和\
  \ F1 分数\nfrom sklearn.metrics import accuracy_score, precision_score, recall_score,\
  \ f1_score\nprint('Accuracy: {:.2f}'.format(accuracy_score(Y2.T, yhat.T)))\nprint('Precision:\
  \ {:.2f}'.format(precision_score(Y2.T, yhat.T)))\nprint('Recall: {:.2f}'.format(recall_score(Y2.T,\
  \ yhat.T)))\nprint('F1: {:.2f}'.format(f1_score(Y2.T, yhat.T)))\n\n## Accuracy:\
  \ 0.93\n## Precision: 0.77\n## Recall: 0.76\n## F1: 0.76\n```\n\n通过进一步调优，我们可以获得更好的性能。请自行尝试修改代码。\n\
