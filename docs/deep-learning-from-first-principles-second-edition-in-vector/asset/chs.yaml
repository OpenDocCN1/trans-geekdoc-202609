  \n![Image 40](img/index-30_1.jpg)\n\n# 6. 用于逻辑回归的神经网络 - Octave 代码\n\n```octave\n\
  1;\n\n# 定义 sigmoid 函数\nfunction a = sigmoid(z)\n  a = 1 ./ (1 + exp(-z));\nend\n\
  \n# 计算损失\nfunction loss = computeLoss(numtraining, Y, A)\n  loss = -1 / numtraining\
  \ * sum((Y .* log(A)) + (1 - Y) .* log(1 - A));\nend\n\n# 执行前向传播\nfunction [loss,\
  \ dw, db, dZ] = forwardPropagation(w, b, X, Y)\n  # 计算 Z\n  Z = w' * X + b;\n  numtraining\
  \ = size(X)(1, 2);\n  # 计算 sigmoid\n  A = sigmoid(Z);\n  # 计算损失。注意这是逐元素乘积\n  loss\
  \ = computeLoss(numtraining, Y, A);\n  # 计算梯度 dZ, dw 和 db\n  dZ = A - Y;\n  dw =\
  \ 1 / numtraining * X * dZ';\n  db = 1 / numtraining * sum(dZ);\nend\n\n# 计算梯度下降\n\
  function [w, b, dw, db, losses, index] = gradientDescent(w, b, X, Y, numIerations,\
  \ learningRate)\n  # 初始化 losses 和 index\n  losses = [];\n  index = [];\n  # 循环遍历迭代次数\n\
  \  for i = 1:numIerations\n    [loss, dw, db, dZ] = forwardPropagation(w, b, X,\
  \ Y);\n    # 执行梯度下降\n    w = w - learningRate * dw;\n```\n\n\n\n\n\n# 实现简单神经网络\n\
  \n## 简介\n\n在第一章中，我用向量化的 Python、R 和 Octave 实现了逻辑回归，这是一个想成为神经网络的网络（没有隐藏层的神经网络）。在第二章中，我实现了一个常规但略显原始的神经网络（仅有\
  \ 1 个隐藏层的神经网络）。本章实现了手动创建数据集的分类，其中两个类的不同簇是线性不可分的。\n\n神经网络在学习各种类别之间的非线性边界方面表现良好。最初使用逻辑回归进行分类。然后在同一数据集上使用一个简单的\
  \ 3 层神经网络并绘制决策边界。普通逻辑回归表现相当差。使用带有径向基核的 SVM 在创建非线性边界方面会表现好得多。本章调用的函数实现见附录 2 - 实现简单神经网络。您可以从\
  \ GitHub 克隆和分叉 3 层神经网络的向量化实现（Python、R 和 Octave）：\n\n[DeepLearningFromFirstPrinciples](https://github.com/tvganesh/DeepLearningFromFirstPrinciples/tree/master/Chap2-SimpleNeuralNetwork)\n\
  \n## 3 层神经网络\n\n下图展示了一个带有 1 个隐藏层的 3 层神经网络（NN）的简单表示。\n\n在上述神经网络中，输入层有两个输入特征，隐藏层有三个隐藏单元，输出层有一个输出单元，因为它处理二分类问题。隐藏层的激活单元可以是\
  \ `tanh`、`sigmoid`、`relu` 等。输出层的激活函数是 `sigmoid`，用于处理二分类。\n\n### 重要结果（记忆复习！）\n\n\
  **前向传播**\n\n```math\n# Superscript indicates layer '1'\nZ^{[1]} = W^{[1]} X + b^{[1]}\n\
  A^{[1]} = \\tanh(Z^{[1]})\n```\n\n```math\n# Superscript indicates layer '2'\nZ^{[2]}\
  \ = W^{[2]} A^{[1]} + b^{[2]}\nA^{[2]} = \\sigma(Z^{[2]})\n```\n\n因此：\n\n```math\n\
  A^{[1]} = \\tanh(Z^{[1]})\nA^{[2]} = \\sigma(Z^{[2]})\n```\n\n同理：\n\n```math\n\\\
  frac{\\partial A^{[1]}}{\\partial Z^{[1]}} = 1 - (A^{[1]})²\n\\frac{\\partial A^{[2]}}{\\\
  partial Z^{[2]}} = A^{[2]}(1 - A^{[2]})\n```\n\n这些方程可以写为：\n\n**I) 一些重要结果（记忆复习！）**\n\
  \n```math\n\\frac{d}{dx}\\tanh(x) = 1 - \\tanh²(x) \\quad \\text{(a)}\n```\n\n```math\n\
  \\frac{d}{dx}\\sigma(x) = \\sigma(x)(1 - \\sigma(x)) \\quad \\text{(b)}\n```\n\n\
  使用 (a) 我们可以得到：\n\n```math\n\\frac{\\partial A^{[1]}}{\\partial Z^{[1]}} = 1 - (A^{[1]})²\n\
  ```\n\n以及：\n\n```math\n\\frac{\\partial A^{[2]}}{\\partial Z^{[2]}} = A^{[2]}(1\
  \ - A^{[2]})\n```\n\n(b)\n\n现在：\n\n```math\n\\frac{\\partial L}{\\partial Z^{[2]}}\
  \ = A^{[2]} - Y\n```\n\n```math\n\\frac{\\partial L}{\\partial W^{[2]}} = \\frac{\\\
  partial L}{\\partial Z^{[2]}} (A^{[1]})^T\n```\n\n```math\n\\frac{\\partial L}{\\\
  partial b^{[2]}} = \\frac{\\partial L}{\\partial Z^{[2]}}\n```\n\n```math\n\\frac{\\\
  partial L}{\\partial Z^{[1]}} = (W^{[2]})^T \\frac{\\partial L}{\\partial Z^{[2]}}\
  \ \\odot (1 - (A^{[1]})²)\n```\n\n```math\n\\frac{\\partial L}{\\partial W^{[1]}}\
  \ = \\frac{\\partial L}{\\partial Z^{[1]}} X^T\n```\n\n```math\n\\frac{\\partial\
  \ L}{\\partial b^{[1]}} = \\frac{\\partial L}{\\partial Z^{[1]}}\n```\n\n(c)\n\n\
  因为：\n\n```math\n\\frac{\\partial \\tanh(x)}{\\partial x} = 1 - \\tanh²(x)\n```\n\
  \n并且使用 (c) 我们得到：\n\n```math\n\\frac{\\partial L}{\\partial Z^{[1]}} = (W^{[2]})^T\
  \ \\frac{\\partial L}{\\partial Z^{[2]}} \\odot (1 - (A^{[1]})²)\n```\n\n使用 (b)\
  \ 中 `sinhx` 和 `coshx` 导数的值我们得到：\n\n因为：\n\n```math\n\\frac{d}{dx}\\sinh(x) = \\cosh(x),\
  \ \\quad \\frac{d}{dx}\\cosh(x) = \\sinh(x)\n```\n\n(d)\n\n**II) 导数**\n\n对数损失如下所示：\n\
  \n```math\nL = -[Y \\log(A^{[2]}) + (1-Y)\\log(1-A^{[2]})]\n```\n\n因为：\n\n```math\n\
  \\frac{\\partial L}{\\partial A^{[2]}} = -\\frac{Y}{A^{[2]}} + \\frac{1-Y}{1-A^{[2]}}\n\
  ```\n\n因此：\n\n```math\n\\frac{\\partial L}{\\partial Z^{[2]}} = A^{[2]} - Y\n```\n\
  \n见第一章 equation (2)\n\n因此：\n\n```math\n\\frac{\\partial L}{\\partial W^{[2]}} =\
  \ \\frac{\\partial L}{\\partial Z^{[2]}} (A^{[1]})^T \\quad \\text{(e)}\n```\n\n\
  ```math\n\\frac{\\partial L}{\\partial b^{[2]}} = \\frac{\\partial L}{\\partial\
  \ Z^{[2]}} \\quad \\text{(f)}\n```\n\n以及：\n\n```math\n\\frac{\\partial L}{\\partial\
  \ Z^{[1]}} = (W^{[2]})^T \\frac{\\partial L}{\\partial Z^{[2]}} \\odot (1 - (A^{[1]})²)\n\
  ```\n\n以及：\n\n```math\n\\frac{\\partial L}{\\partial W^{[1]}} = \\frac{\\partial\
  \ L}{\\partial Z^{[1]}} X^T \\quad \\text{(g)}\n```\n\n```math\n\\frac{\\partial\
  \ L}{\\partial b^{[1]}} = \\frac{\\partial L}{\\partial Z^{[1]}} \\quad \\text{(h)}\n\
  ```\n\n**III) 反向传播**\n\n使用 II) 中的导数，我们可以使用链式法则推导出以下结果：\n\n(i)\n\n```math\n\\frac{\\\
  partial L}{\\partial Z^{[2]}} = A^{[2]} - Y\n```\n\n```math\n\\frac{\\partial L}{\\\
  partial W^{[2]}} = \\frac{1}{m} \\frac{\\partial L}{\\partial Z^{[2]}} (A^{[1]})^T\n\
  ```\n\n```math\n\\frac{\\partial L}{\\partial b^{[2]}} = \\frac{1}{m} \\sum \\frac{\\\
  partial L}{\\partial Z^{[2]}}\n```\n\n```math\n\\frac{\\partial L}{\\partial Z^{[1]}}\
  \ = (W^{[2]})^T \\frac{\\partial L}{\\partial Z^{[2]}} \\odot (1 - (A^{[1]})²)\n\
  ```\n\n```math\n\\frac{\\partial L}{\\partial W^{[1]}} = \\frac{1}{m} \\frac{\\\
  partial L}{\\partial Z^{[1]}} X^T\n```\n\n```math\n\\frac{\\partial L}{\\partial\
  \ b^{[1]}} = \\frac{1}{m} \\sum \\frac{\\partial L}{\\partial Z^{[1]}}\n```\n\n\
  使用 (i) 和 (e) 的结果我们得到：\n\n(j)\n\n(k)\n\n以及：\n\n化简得到：\n\n(l) 和\n\n(m)\n\n**IV) 梯度下降**\n\
  \n## Octave 代码实现\n\n```octave\nb = b - learningRate * db;\n\nif (mod(i, 100) ==\
  \ 0)\n    # Append index and loss\n    index = [index i];\n    losses = [losses\
  \ loss];\nendif\nend\nend\n\n# Determine the predicted value for dataset\nfunction\
  \ yPredicted = predict(w, b, X)\n    m = size(X)(1, 2);\n    yPredicted = zeros(1,\
  \ m);\n    # Compute Z\n    Z = w' * X + b;\n    # Compute sigmoid\n    A = sigmoid(Z);\n\
  \    for i = 1:size(X)(1, 2),\n        # Set predicted as 1 if A > 0.5\n       \
  \ if (A(1, i) >= 0.5)\n            yPredicted(1, i) = 1;\n        else\n       \
  \     yPredicted(1, i) = 0;\n        endif\n    end\nend\n\n# Normalize by dividing\
  \ each value by the sum of squares\nfunction normalized = normalize(x)\n    # Compute\
  \ Frobenius norm. Square the elements, sum rows and then find square root\n    a\
  \ = sqrt(sum(x .^ 2, 2));\n    # Perform element wise division\n    normalized =\
  \ x ./ a;\nend\n\n# Split into train and test sets\nfunction [X_train, y_train,\
  \ X_test, y_test] = trainTestSplit(dataset, trainPercent)\n    # Create a random\
  \ index\n    ix = randperm(length(dataset));\n    # Split into training\n    trainSize\
  \ = floor(trainPercent / 100 * length(dataset));\n    train = dataset(ix(1:trainSize),\
  \ :);\n    # And test\n    test = dataset(ix(trainSize + 1:length(dataset)), :);\n\
  \    X_train = train(:, 1:30);\n    y_train = train(:, 31);\n    X_test = test(:,\
  \ 1:30);\n    y_test = test(:, 31);\nend\n\n# Read the data\ncancer = csvread(\"\
  cancer.csv\");\n\n# Split as train and test\n[X_train, y_train, X_test, y_test]\
  \ = trainTestSplit(cancer, 75);\n\n# Initialize w and b\nw = zeros(size(X_train)(1,\
  \ 2), 1);\nb = 0;\n\n# Normalize training\nX_train1 = normalize(X_train);\nX_train2\
  \ = X_train1';\ny_train1 = y_train';\n\n# Perform gradient descent\n[w1, b1, dw,\
  \ db, losses, idx] = gradientDescent(w, b, X_train2, y_train1, numIterations=3000,\
  \ learningRate=0.75);\n\n# Normalize X_test\nX_test1 = normalize(X_test);\n# Transpose\
  \ X_train so that we have a matrix as (features, numSamples)\nX_test2 = X_test1';\n\
  y_test1 = y_test';\n\n# Use the values of the weights generated from Gradient Descent\n\
  yPredictionTest = predict(w1, b1, X_test2);\nyPredictionTrain = predict(w1, b1,\
  \ X_train2);\n\n# Compute Accuracy\ntrainAccuracy = 100 - mean(abs(yPredictionTrain\
  \ - y_train1)) * 100\ntestAccuracy = 100 - mean(abs(yPredictionTest - y_test1))\
  \ * 100\n\ntrainAccuracy = 90.845\ntestAccuracy = 89.510\n\ngraphics_toolkit('gnuplot')\n\
  plot(idx, losses);\ntitle('Gradient descent- Cost vs No of iterations');\nxlabel('No\
  \ of iterations');\nylabel('Cost');\n```\n\n## 结论\n\n本章从一个简单的 2 层神经网络实现逻辑回归开始。显然，这个简单神经网络的性能与高度优化的\
  \ sklearn 逻辑回归相比相对较差。这是因为上述神经网络没有任何隐藏层。深度学习和神经网络之所以能取得非凡的性能，是因为存在深层隐藏层。\n\n---\n\
