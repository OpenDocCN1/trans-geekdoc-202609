  \n# We need to determine the predicted values from the learnt data\n# Forward propagation\
  \ through hidden layer with Relu units\nA1, cache1 = layerActivationForward(X.T,\
  \ W1, b1, 'relu')\n\n# Forward propagation through output layer with Softmax\nA2,\
  \ cache2 = layerActivationForward(A1, W2, b2, 'softmax')\n\n# Compute predicted\
  \ values from weights and biases\nyhat = np.argmax(A2, axis=1)\n\n# Compute the\
