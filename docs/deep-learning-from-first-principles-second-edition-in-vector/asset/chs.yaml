  \ 414](img/index-347_5.jpg)\n\n![Image 415](img/index-347_6.jpg)\n\n## 附录 A：神经网络——反向传播的机制\n\
  \n### 1. 简介\n\n20 世纪 80 年代开始的“反向传播算法”初期工作，引发了对神经网络和反向传播应用的极大兴趣。\n\n“反向传播”算法利用梯度下降法，计算神经网络中权重关于误差函数的最小值。在多层神经网络中，使误差/代价函数最小化的权重组合，被视为学习问题的解决方案。\n\
  \n在上述神经网络中，感知机和单层神经网络只有在样本空间线性可分时才能分类。对于非线性决策边界，需要具有反向传播功能的多层神经网络来生成更复杂的边界。反向传播算法利用梯度下降法在权重空间中计算误差函数的最小值。这种梯度计算要求激活函数既可微又连续。因此，Sigmoid\
  \ 或 Logistic 函数通常被选作每一层的激活函数。\n\n本文探讨一个包含 1 个输入层、1 个隐藏层和 1 个输出层的 3 层神经网络。在很大程度上，本文基于\
  \ Matt Mazur 详细的“反向传播分步示例”、Hinton 教授在 Coursera 上的“用于机器学习的神经网络”以及其他一些资料来源。\n\n虽然\
  \ Matt Mazur 的文章使用示例数值，但我推导了隐藏层和输入层中每个权重的梯度导数公式。我打算在 Octave、R 和 Python 中实现反向传播的向量化版本。因此，本文是那项工作的前奏。\n\
  \n3 层神经网络如下所示：\n\n![Image 416](img/index-349_1.jpg)\n\n![Image 417](img/index-349_2.jpg)\n\
