  \n### 3.3c 带 Softmax 激活函数的 MNIST 数据集 – Octave\n\n下面的代码在 Octave 中实现了一个带 Softmax 输出激活单元的\
  \ L 层深度学习网络，用于对 MNIST 数据集中的 10 个手写数字进行分类。遗憾的是，Octave 一次只能索引大约 10000 个训练样本，当我尝试创建批次大小为\
  \ 20000 时，出现了错误 `error: out of memory or dimension too large for Octave’s index\
  \ type error: called from…`。所以，我不得不想个变通办法，创建一个批次大小为 10000（随机）的批次，然后使用 1000 个样本的小批次并执行随机梯度下降。性能表现良好。\n\
  \nOctave 在批次大小为 10000 和小批次为 1000 的情况下大约需要 15 分钟。\n\n```octave\n# Pseudo code that\
  \ could be used since Octave only allows 10K batches\n# at a time\n# Randomly create\
  \ weights\n[weights biases] = initialize_weights()\n\nfor i=1:k\n    # Create a\
  \ random permutation and create a random batch\n    permutation = randperm(10000);\n\
  \    X=trainX(permutation,:);\n    Y=trainY(permutation,:);\n\n    # Compute weights\
  \ from SGD and update weights in the next batch update\n    [weights biases costs]=L_Layer_DeepModel_SGD(X,Y,mini_bactch=1000,weights,\
  \ biases,...);\n    ...\nEndfor\n\n# Load the MNIST data\nload('./mnist/mnist.txt.gz');\n\
  \n#Create a random permutatation from 60K\npermutation = randperm(10000);\ndisp(length(permutation));\n\
  \n# Use this 10K as the batch\nX=trainX(permutation,:);\nY=trainY(permutation,:);\n\
  \n# Set layer dimensions\n# 784 – Number of input features – 28 x28\n# 15 9 – 2\
  \ hidden layers with 15 and 9 activation units\n# 10 – 10 activation units at the\
  \ output layer\nlayersDimensions=[784, 15, 9, 10];\n\n# Run Stochastic Gradient\
  \ descent with batch size=10K and\nmini_batch_size=1000\n# with 'relu' activation\
  \ in hidden layer and 'softmax' activation at the output layer\n[weights biases\
  \ costs]=L_Layer_DeepModel_SGD(X', Y', layersDimensions, hiddenActivationFunc='relu',\n\
  outputActivationFunc=\"softmax\",\nlearningRate = 0.01,\nmini_batch_size = 2000,\
  \ num_epochs = 5000);\n```\n\n![Image 269](img/index-190_1.jpg)\n\n### 4. 结束语\n\n\
  以下是我在本系列及其他项目中使用 Python、R 和 Octave 后的一些结束语：\n\n1.  **Python** 凭借其高度优化的 `numpy` 库，非常适合创建深度学习模型，因为这类模型涉及大量矩阵操作。在深度学习计算方面，Python\
  \ 是名副其实的主力军。\n2.  **R** 在处理矩阵或返回多个值方面与其表亲 Python 相比略显笨拙。但 R 的统计库、`dplyr` 和 `ggplot`\
  \ 确实优于 Python 的同类库。此外，我发现 R 处理数据框比 Python 好得多。\n3.  **Octave** 是一种务实、极简的语言，在处理矩阵方面非常高效。它非常适合从头实现机器学习和深度学习。但是，Octave\
  \ 也有其问题，无法处理大尺寸矩阵，且缺乏 R 和 Python 的统计库。这些可能存在于它的兄弟 Matlab 中。\n\n### 5. 结论\n\n从头构建深度学习网络颇具挑战性、耗时但仍是一项令人兴奋的任务。虽然不同语言中操纵矩阵、求列和、查找包含\
