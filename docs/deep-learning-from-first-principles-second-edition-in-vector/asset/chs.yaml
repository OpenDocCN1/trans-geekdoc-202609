  \n## 3.1a Dropout：圆环数据 – Python\n\n**Dropout** 正则化技术被 **Alex Krizhevsky**、**Ilya\
  \ Sutskever** 和 **Geoffrey E. Hinton** 教授在 **“使用深度卷积神经网络进行 ImageNet 分类”** ([`www.nvidia.cn/content/tesla/pdf/machine-learning/imagenet-classification-with-deep-convolutional-nn.pdf`](https://www.nvidia.cn/content/tesla/pdf/machine-learning/imagenet-classification-with-deep-convolutional-nn.pdf))\
  \ 一文中极其有效地用于防止过拟合。\n\nDropout 技术的工作原理是在前向传播周期中，根据 `keep_prob` 标准在每个隐藏层中随机丢弃一组激活单元。以下是\
  \ Octave 代码。系统会为每一层创建一个 ‘dropoutMat’，用于指定要丢弃的单元。**注意**：在反向传播周期计算梯度时，必须使用相同的 `dropoutMat`。因此，dropout\
  \ 矩阵被存储在一个元胞数组中。\n\n```matlab\nfor l = 1:L-1\n    ...\n    D = rand(size(A)(1),\
  \ size(A)(2));\n    D = (D < keep_prob);\n    # 将部分隐藏单元置零\n    A = A .* D;\n   \
  \ # 除以 keep_prob 以保持 A 的期望值不变\n    A = A ./ keep_prob;\n    # 将 D 存储在 dropoutMat\
  \ 元胞数组中\n    dropoutMat{l} = D;\n    ...\nendfor\n```\n\n在反向传播周期中，我们有：\n\n```matlab\n\
  for l = (L-1):-1:1\n    ...\n    D = dropoutMat{l};\n    # 根据相同的 dropout 矩阵将 dAl\
  \ 置零\n    dAl = dAl .* D;\n    # 除以 keep_prob 以维持期望值\n    dAl = dAl ./ keep_prob;\n\
  \    ...\nendfor\n```\n\n```python\nimport numpy as np\nimport matplotlib\nimport\
  \ matplotlib.pyplot as plt\nimport sklearn.linear_model\nimport pandas as pd\nimport\
  \ sklearn\nimport sklearn.datasets\nexec(open(\"DLfunctions61.py\").read())\n```\n\
  \n# 加载数据\n\n```python\ntrain_X, train_Y, test_X, test_Y = load_dataset()\n```\n\n\
  # 设置层维度\n\n```python\n# 2 – 输入特征数量\n# 7 – 1 个隐藏层 7 个隐藏单元\n# 1 – 输出层 1 个 sigmoid\
  \ 激活单元\nlayersDimensions = [2, 7, 1]\n```\n\n# 训练 L 层深度学习网络\n\n```python\n# 隐藏层激活函数\
  \ – relu\n# 输出层激活函数 – sigmoid\n# 学习率 – 0.6\n# keep_prob=0.7\nparameters = L_Layer_DeepModel(train_X,\
  \ train_Y, layersDimensions,\n                               hiddenActivationFunc\
  \ = 'relu',\n                               outputActivationFunc = \"sigmoid\",\n\
  \                               learningRate = 0.6,\n                          \
  \     keep_prob = 0.7,\n                               num_iterations = 9000,\n\
  \                               initType = \"default\",\n                      \
  \         print_cost = True,\n                               figure = \"fig11.png\"\
  )\n```\n\n# 清除绘图\n\n```python\nplt.clf()\nplt.close()\n```\n\n# 绘制决策边界\n\n```python\n\
  plot_decision_boundary(lambda x: predict(parameters, x.T, keep_prob = 0.7), train_X,\
  \ train_Y, str(0.6), figure1 = \"fig12.png\")\n```\n\n![Image 302](img/index-245_1.jpg)\n\
