  \ * v_corrected[[paste(\"db\", l, sep=\"\")]] / d2\n  }\n\n  # 计算第 L 层\n  if(outputActivationFunc\
  \ == \"sigmoid\") {\n    v[[paste(\"dW\", L, sep=\"\")]] = beta1 * v[[paste(\"dW\"\
  , L, sep=\"\")]] +\n      (1 - beta1) * gradients[[paste('dW', L, sep=\"\")]]\n\
