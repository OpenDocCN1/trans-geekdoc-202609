  \ list(\"forward_cache\"=forward_cache, \"activation_cache\"=vals[['Z']])`\n\n`retvals\
  \ <- list(\"A\"=vals[['A']],\"cache\"=cache)`\n\n`return(retvals)`\n\n`}`\n\n# 计算第\
  \ 1..L 层的前向传播\n\n# 输入：`X` - 输入特征\n\n# `parameters`：权重和偏置\n\n# `keep_prob`\n\n# `hiddenActivationFunc`\
  \ - relu/sigmoid/tanh\n\n# `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n\n\
