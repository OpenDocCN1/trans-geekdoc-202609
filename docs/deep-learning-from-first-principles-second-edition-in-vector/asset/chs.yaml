  \n`s[[paste('dW',l,sep=\"\")]] = matrix(rep(0,sz[1]*sz[2]), nrow=sz[1],ncol=sz[2])`\n\
  \n`# 获取偏置矩阵的大小`\n\n`sz <- dim(parameters[[paste('b',l,sep=\"\")]])`\n\n`v[[paste('db',l,sep=\"\
  \")]] = matrix(rep(0,sz[1]*sz[2]), nrow=sz[1],ncol=sz[2])`\n\n`s[[paste('db',l,sep=\"\
  \")]] = matrix(rep(0,sz[1]*sz[2]), nrow=sz[1],ncol=sz[2])`\n\n`}`\n\n`retvals <-\
  \ list(\"v\"=v,\"s\"=s)`\n\n`return(retvals)`\n\n`}`\n\n# 计算深度网络前向传播中第 'l' 层的激活值\n\
  \n# 输入：`A_prev` - 上一层的激活值\n\n# `W,b` - 权重和偏置矩阵及向量\n\n# `activationFunc` - 激活函数 -\
