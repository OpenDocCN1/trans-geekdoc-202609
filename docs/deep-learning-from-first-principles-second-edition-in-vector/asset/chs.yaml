  \ = db\\_temp;\nendfor\nend\n\n\\# 执行梯度下降\n\\# 输入：权重和偏置\n\\# ：梯度\n\\# ：学习率\n\\#\
  \ 输出：1 次迭代后更新的权重和偏置\nfunction \\[weights, biases\\] = gradientDescent(weights, biases,\
  \ gradsW, gradsB, learningRate)\n    L = size(weights)(2); \\# 神经网络中的层数\n    \\\
  # 每个参数的更新规则。\n    for l = 1:L\n        weights{l} = weights{l} - learningRate *\
