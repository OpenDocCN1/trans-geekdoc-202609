  \ retvals, hiddenActivationFunc=\"relu\", lr=0.5)\n```\n\n## 1.2b He 初始化 – R\n\n\
  He 初始化在 R 中的代码如下：\n\n```r\n# He Initialization model for L layers\n# Input: List\
  \ of units in each layer\n# Returns: Initial weights and biases matrices for all\
  \ layers\n# He initialization multiplies the random numbers with sqrt(2/layerDimensions[previouslayer])\n\
  HeInitializeDeepModel <- function(layerDimensions) {\n  set.seed(2)\n  # Initialize\
  \ empty list\n  layerParams <- list()\n  # Note the Weight matrix at layer 'l' is\
  \ a matrix of size (l, l-1)\n  # The Bias is a vectors of size (l, 1)\n  # Loop\
  \ through the layer dimension from 1.. L\n  # Indices in R start from 1\n  for (l\
  \ in 2:length(layerDimensions)) {\n    # Initialize a matrix of small random numbers\
  \ of size l x l-1\n    # Create random numbers of size l x l-1\n    w = rnorm(layerDimensions[l]\
  \ * layerDimensions[l-1])\n    # Create a weight matrix of size l x l-1 with this\
  \ initial weights and\n    # Add to list W1, W2... WL\n    # He initialization -\
  \ Divide by sqrt(2/layerDimensions[previous layer])\n    layerParams[[paste('W',\
  \ l-1, sep=\"\")]] = matrix(w, nrow=layerDimensions[l], ncol=layerDimensions[l-1])\
  \ * sqrt(2/layerDimensions[l-1])\n    layerParams[[paste('b', l-1, sep=\"\")]] =\
  \ matrix(rep(0, layerDimensions[l]), nrow=layerDimensions[l], ncol=1)\n  }\n  return(layerParams)\n\
  }\n```\n\n下面的 R 代码使用 He 初始化来学习数据：\n\n```r\nsource(\"DLfunctions61.R\")\n\n# Load\
  \ the data\nz <- as.matrix(read.csv(\"circles.csv\", header=FALSE))\nx <- z[, 1:2]\n\
  y <- z[, 3]\nX <- t(x)\nY <- t(y)\n\n# Set the layer dimensions\n# 2 – number of\
  \ input features\n# 11 – 1 hidden layer 11 hidden units\n# 1 – 1 sigmoid activation\
  \ unit at the output layer\nlayersDimensions = c(2, 11, 1)\n\n# Train a L-layer\
  \ Deep learning network with He initialization\n# hidden Activation function – relu\n\
  # output activation function – sigmoid\n# learning rate – 0.5\nretvals = L_Layer_DeepModel(X,\
  \ Y, layersDimensions,\n                            hiddenActivationFunc='relu',\n\
  \                            outputActivationFunc=\"sigmoid\",\n               \
  \             learningRate=0.5,\n                            numIterations=9000,\n\
  \                            initType=\"He\",\n                            print_cost=TRUE)\n\
  \n# Plot the cost vs iterations\niterations <- seq(0, 9000, 1000)\ncosts = retvals$costs\n\
  df = data.frame(iterations, costs)\n```\n\n\n\n\n\n![Image 280](img/index-209_1.jpg)\n\
