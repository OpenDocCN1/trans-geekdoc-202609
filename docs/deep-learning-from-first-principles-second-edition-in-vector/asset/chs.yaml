  ![Image 364](img/index-300_10.jpg)\n\n## 5.1. 带 Adam 的随机梯度下降\n\n自适应矩估计是动量（一阶矩）和\
  \ RMSProp（二阶矩）的结合。Adam 的公式如下。\n\n一阶矩的移动平均\n\n一阶矩的偏差修正\n\n类似地，二阶矩的移动平均 - RMSProp\n\
  \n\n\n\n# 二阶矩的偏差修正\n\nAdam 梯度下降由以下公式给出\n\nAdam 在 R 语言中的代码片段包含在下文中\n\n## 使用 Adam\
  \ 执行梯度下降\n\n**输入：**\n- 权重和偏置\n- `beta1`\n- `epsilon`\n- `gradients`（梯度）\n- `learning\
  \ rate`（学习率）\n- `outputActivationFunc` - 隐藏层的激活函数 sigmoid/softmax\n\n**输出：** 1 次迭代后的更新权重\n\
  \n```r\ngradientDescentWithAdam <- function(parameters, gradients, v, s, t, beta1=0.9,\
  \ beta2=0.999, epsilon=10^-8,\n                                    learningRate=0.1,\
  \ outputActivationFunc=\"sigmoid\") {\n\n  L = length(parameters)/2 # 神经网络中的层数\n\
  \  v_corrected <- list()\n  s_corrected <- list()\n\n  # 每个参数的更新规则。\n  for(l in\
  \ 1:(L-1)) {\n\n    # v[['dWk']] = beta * v[['dWk']] + (1-beta)*dWk\n    v[[paste(\"\
  dW\", l, sep=\"\")]] = beta1 * v[[paste(\"dW\", l, sep=\"\")]] +\n      (1 - beta1)\
  \ * gradients[[paste('dW', l, sep=\"\")]]\n\n    v[[paste(\"db\", l, sep=\"\")]]\
  \ = beta1 * v[[paste(\"db\", l, sep=\"\")]] +\n      (1 - beta1) * gradients[[paste('db',\
  \ l, sep=\"\")]]\n\n    # 计算一阶矩的偏差修正估计。\n    v_corrected[[paste(\"dW\", l, sep=\"\
  \")]] = v[[paste(\"dW\", l, sep=\"\")]] / (1 - beta1^t)\n    v_corrected[[paste(\"\
  db\", l, sep=\"\")]] = v[[paste(\"db\", l, sep=\"\")]] / (1 - beta1^t)\n\n    #\
  \ 梯度的逐元素乘法\n    s[[paste(\"dW\", l, sep=\"\")]] = beta2 * s[[paste(\"dW\", l, sep=\"\
  \")]] +\n      (1 - beta2) * gradients[[paste('dW', l, sep=\"\")]] *\n      gradients[[paste('dW',\
  \ l, sep=\"\")]]\n\n    s[[paste(\"db\", l, sep=\"\")]] = beta2 * s[[paste(\"db\"\
  , l, sep=\"\")]] +\n      (1 - beta2) * gradients[[paste('db', l, sep=\"\")]] *\n\
  \      gradients[[paste('db', l, sep=\"\")]]\n\n    # 计算二阶矩的偏差修正估计。\n    s_corrected[[paste(\"\
  dW\", l, sep=\"\")]] = s[[paste(\"dW\", l, sep=\"\")]] / (1 - beta2^t)\n    s_corrected[[paste(\"\
  db\", l, sep=\"\")]] = s[[paste(\"db\", l, sep=\"\")]] / (1 - beta2^t)\n\n    #\
  \ 更新参数。\n    d1 = sqrt(s_corrected[[paste(\"dW\", l, sep=\"\")]] + epsilon)\n  \
  \  d2 = sqrt(s_corrected[[paste(\"db\", l, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
  W\", l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] -\n      learningRate\
  \ * v_corrected[[paste(\"dW\", l, sep=\"\")]] / d1\n    parameters[[paste(\"b\"\
  , l, sep=\"\")]] = parameters[[paste(\"b\", l, sep=\"\")]] -\n      learningRate\
  \ * v_corrected[[paste(\"db\", l, sep=\"\")]] / d2\n  }\n\n  # 针对 sigmoid 激活函数计算第\
  \ L 层\n  if(outputActivationFunc == \"sigmoid\") {\n\n    v[[paste(\"dW\", L, sep=\"\
  \")]] = beta1 * v[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta1) * gradients[[paste('dW',\
  \ L, sep=\"\")]]\n\n    v[[paste(\"db\", L, sep=\"\")]] = beta1 * v[[paste(\"db\"\
  , L, sep=\"\")]] +\n      (1 - beta1) * gradients[[paste('db', L, sep=\"\")]]\n\n\
  \    # 计算一阶矩的偏差修正估计。\n    v_corrected[[paste(\"dW\", L, sep=\"\")]] = v[[paste(\"\
  dW\", L, sep=\"\")]] / (1 - beta1^t)\n    v_corrected[[paste(\"db\", L, sep=\"\"\
  )]] = v[[paste(\"db\", L, sep=\"\")]] / (1 - beta1^t)\n\n    # 梯度的逐元素乘法\n    s[[paste(\"\
  dW\", L, sep=\"\")]] = beta2 * s[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta2)\
  \ * gradients[[paste('dW', L, sep=\"\")]] *\n      gradients[[paste('dW', L, sep=\"\
  \")]]\n\n    s[[paste(\"db\", L, sep=\"\")]] = beta2 * s[[paste(\"db\", L, sep=\"\
  \")]] +\n      (1 - beta2) * gradients[[paste('db', L, sep=\"\")]] *\n      gradients[[paste('db',\
  \ L, sep=\"\")]]\n\n    # 计算二阶矩的偏差修正估计。\n    s_corrected[[paste(\"dW\", L, sep=\"\
  \")]] = s[[paste(\"dW\", L, sep=\"\")]] / (1 - beta2^t)\n    s_corrected[[paste(\"\
  db\", L, sep=\"\")]] = s[[paste(\"db\", L, sep=\"\")]] / (1 - beta2^t)\n\n    #\
  \ 更新参数。\n    d1 = sqrt(s_corrected[[paste(\"dW\", L, sep=\"\")]] + epsilon)\n  \
  \  d2 = sqrt(s_corrected[[paste(\"db\", L, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] -\n      learningRate\
  \ * v_corrected[[paste(\"dW\", L, sep=\"\")]] / d1\n    parameters[[paste(\"b\"\
  , L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\")]] -\n      learningRate\
  \ * v_corrected[[paste(\"db\", L, sep=\"\")]] / d2\n\n  } else if (outputActivationFunc\
  \ == \"softmax\") { # 针对 softmax 激活函数计算第 L 层\n\n    v[[paste(\"dW\", L, sep=\"\"\
  )]] = beta1 * v[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta1) * t(gradients[[paste('dW',\
  \ L, sep=\"\")]])\n\n    v[[paste(\"db\", L, sep=\"\")]] = beta1 * v[[paste(\"db\"\
  , L, sep=\"\")]] +\n      (1 - beta1) * t(gradients[[paste('db', L, sep=\"\")]])\n\
  \n    # 计算一阶矩的偏差修正估计。\n    v_corrected[[paste(\"dW\", L, sep=\"\")]] = v[[paste(\"\
  dW\", L, sep=\"\")]] / (1 - beta1^t)\n    v_corrected[[paste(\"db\", L, sep=\"\"\
  )]] = v[[paste(\"db\", L, sep=\"\")]] / (1 - beta1^t)\n\n    # 梯度的逐元素乘法\n    s[[paste(\"\
  dW\", L, sep=\"\")]] = beta2 * s[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta2)\
  \ * t(gradients[[paste('dW', L, sep=\"\")]]) *\n      t(gradients[[paste('dW', L,\
  \ sep=\"\")]])\n\n    s[[paste(\"db\", L, sep=\"\")]] = beta2 * s[[paste(\"db\"\
  , L, sep=\"\")]] +\n      (1 - beta2) * t(gradients[[paste('db', L, sep=\"\")]])\
  \ *\n      t(gradients[[paste('db', L, sep=\"\")]])\n\n    # 计算二阶矩的偏差修正估计。\n   \
  \ s_corrected[[paste(\"dW\", L, sep=\"\")]] = s[[paste(\"dW\", L, sep=\"\")]] /\
  \ (1 - beta2^t)\n    s_corrected[[paste(\"db\", L, sep=\"\")]] = s[[paste(\"db\"\
  , L, sep=\"\")]] / (1 - beta2^t)\n\n    # 更新参数。\n    d1 = sqrt(s_corrected[[paste(\"\
  dW\", L, sep=\"\")]] + epsilon)\n    d2 = sqrt(s_corrected[[paste(\"db\", L, sep=\"\
  \")]] + epsilon)\n    parameters[[paste(\"W\", L, sep=\"\")]] = parameters[[paste(\"\
  W\", L, sep=\"\")]] -\n      learningRate * v_corrected[[paste(\"dW\", L, sep=\"\
  \")]] / d1\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"b\"\
  , L, sep=\"\")]] -\n      learningRate * v_corrected[[paste(\"db\", L, sep=\"\"\
  )]] / d2\n  }\n\n  return(parameters)\n}\n```\n\n## 5.1a. 带 Adam 优化的随机梯度下降 – Python\n\
  \n```python\nimport numpy as np\nimport matplotlib\nimport matplotlib.pyplot as\
  \ plt\nimport sklearn.linear_model\nimport pandas as pd\nimport sklearn\nimport\
  \ sklearn.datasets\n\nexec(open(\"DLfunctions7.py\").read())\n\n# 加载 MNIST\nexec(open(\"\
  load_mnist.py\").read())\n\ntraining = list(read(dataset='training', path=\".\\\\\
  mnist\"))\ntest = list(read(dataset='testing', path=\".\\\\mnist\"))\n\nlbls = []\n\
  pxls = []\n\nprint(len(training))\n\n# for i in range(len(training)):\nfor i in\
