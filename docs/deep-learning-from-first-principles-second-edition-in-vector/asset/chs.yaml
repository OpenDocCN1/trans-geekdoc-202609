  ```\n\n![Image 262](img/index-167_1.jpg)\n\n### 3.1b 具有 Softmax 激活函数的螺旋数据集 – Python\n\
  \n第 4 章的螺旋数据被用来测试具有 Softmax 激活函数的完整 L 层深度学习网络在多类分类任务上的正确性。\n\n```python\nimport\
  \ numpy as np\nimport matplotlib\nimport matplotlib.pyplot as plt\nimport pandas\
  \ as pd\nfrom sklearn.datasets import make_classification, make_blobs\nexec(open(\"\
  DLfunctions51.py\").read())\n\n# Create an input data set - Taken from CS231n Convolutional\
  \ Neural networks\n# http://cs231n.github.io/neural-networks-case-study/\nN = 100\
  \ # number of points per class\nD = 2 # dimensionality\nK = 3 # number of classes\n\
  X = np.zeros((N*K, D)) # data matrix (each row = single example)\ny = np.zeros(N*K,\
  \ dtype='uint8') # class labels\n\n# Loop over K\nfor j in range(K):\n    ix = range(N*j,\
  \ N*(j+1))\n    r = np.linspace(0.0, 1, N) # radius\n    t = np.linspace(j*4, (j+1)*4,\
  \ N) + np.random.randn(N)*0.2 # theta\n    X[ix] = np.c_[r*np.sin(t), r*np.cos(t)]\n\
  \    y[ix] = j\n\nX1 = X.T\nY1 = y.reshape(-1, 1).T\n\n# Set the parameters of the\
  \ DL network\nnumHidden = 100 # No of hidden units in hidden layer\nnumFeats = 2\
  \ # dimensionality\nnumOutput = 3 # number of classes\n\n# Set the dimensions of\
  \ the layers\nlayersDimensions = [numFeats, numHidden, numOutput]\n\n# Execute the\
  \ L-layer DL network with hidden activation=relu and softmax output function\nparameters\
  \ = L_Layer_DeepModel(X1, Y1, layersDimensions, hiddenActivationFunc='relu', outputActivationFunc=\"\
  softmax\", learningRate=0.6, num_iterations=9000, print_cost=True)\n```\n\n## Cost\
