  end\n\n## 5. 附录 4 - 带有 Softmax 的深度学习网络\n\n### 4.1 Python\n\n```python\n# -*- coding:\
  \ utf-8 -*-\n\"\"\"\n############################################################################################################\n\
  #\n# File: DLfunctions41.py\n# Developer: Tinniam V Ganesh\n# Date : 26 Feb 2018\n\
  #\n##########################################################################################################\n\
  @author: Ganesh\n\"\"\"\n\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  import matplotlib\nimport matplotlib.pyplot as plt\nfrom matplotlib import cm\n\n\
  # 计算向量的 Relu\ndef relu(Z):\n    A = np.maximum(0, Z)\n    cache = Z\n    return\
  \ A, cache\n\n# 计算向量的 Softmax\ndef softmax(Z):\n    # 获取未归一化的概率\n    exp_scores\
  \ = np.exp(Z.T)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores, axis=1,\
  \ keepdims=True)\n    cache = Z\n    return A, cache\n\n# 计算 Relu 的导数\ndef reluDerivative(dA,\
  \ cache):\n    Z = cache\n    dZ = np.array(dA, copy=True)  # 只是将 dz 转换为正确的对象。\n\
  \    # 当 z <= 0 时，也应将 dz 设为 0。\n    dZ[Z <= 0] = 0\n    return dZ\n\n# 计算 Softmax\
  \ 的导数\ndef softmaxDerivative(dA, cache, y, numTraining):\n    # 注意：未使用 dA。dL/dZ\
  \ = dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算 Softmax\n    exp_scores = np.exp(Z.T)\n\
  \    # 对每个样本进行归一化\n    probs = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n\
  \    # 计算得分的梯度\n    dZ = probs\n    # dZ = pi- yi\n    dZ[range(int(numTraining)),\
  \ y] -= 1\n    return dZ\n\n# 初始化模型\n# 输入：特征数量\n# 隐藏单元数量\n# 输出单元数量\n# 返回：权重和偏置矩阵及向量\n\
  def initializeModel(numFeats, numHidden, numOutput):\n    np.random.seed(1)\n  \
  \  W1 = np.random.randn(numHidden, numFeats) * 0.01  # 乘以 .01\n    b1 = np.zeros((numHidden,\
  \ 1))\n    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n    # 创建神经网络参数字典\n    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2':\
  \ b2}\n    return nnParameters\n\n# 计算深度网络前向传播中第 'l' 层的激活值\n# 输入：A_prev - 上一层的激活值\n\
  # W,b - 权重和偏置矩阵及向量\n# activationFunc - 激活函数 - sigmoid, tanh, relu 等\n# 返回：A, cache\n\
  # :\n# Z = W * X + b\n# A = sigmoid(Z), A= Relu(Z), A= tanh(Z)\ndef layerActivationForward(A_prev,\
  \ W, b, activationFunc):\n    # 计算 Z\n    Z = np.dot(W, A_prev) + b\n    forward_cache\
  \ = (A_prev, W, b)\n    # 计算 Sigmoid 的激活值\n    if activationFunc == \"sigmoid\"\
  :\n        A, activation_cache = sigmoid(Z)\n    # 计算 Relu 的激活值\n    elif activationFunc\
  \ == \"relu\":\n        A, activation_cache = relu(Z)\n    # 计算 Tanh 的激活值\n    elif\
  \ activationFunc == 'tanh':\n        A, activation_cache = tanh(Z)\n    # 计算 Softmax\
  \ 的激活值\n    elif activationFunc == 'softmax':\n        A, activation_cache = softmax(Z)\n\
  \    cache = (forward_cache, activation_cache)\n    return A, cache\n\n# 计算 1 个周期的反向传播\n\
  # 输入：神经网络参数 - dA\n# # cache - forward_cache & activation_cache\n# # y\n# # activationFunc\n\
  # 返回：dA_prev, dW, db\n# dL/dWi = dL/dZi * Al-1\n# dl/dbl = dL/dZl\n# dL/dZ_prev\
  \ = dL/dZl * W\ndef layerActivationBackward(dA, cache, y, activationFunc):\n   \
  \ forward_cache, activation_cache = cache\n    A_prev, W, b = forward_cache\n  \
  \  numtraining = float(A_prev.shape[1])\n    if activationFunc == \"relu\":\n```\n\
  \n\n\n\n\n### 4.2 R\n\n############################################################################################################\n\
  #\n# 文件：DLfunctions41.R\n# 开发者：Tinniam V Ganesh\n# 日期：2018 年 2 月 26 日\n#\n##########################################################################################################\n\
  \n### 激活函数与导数\n\n#### ReLU\n```r\nrelu <- function(Z) {\n  A <- apply(Z, 1:2, function(x)\
  \ max(0, x))\n  cache <- Z\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n\
  }\n```\n\n#### Softmax\n```r\nsoftmax <- function(Z) {\n  # 获取未归一化的概率\n  exp_scores\
  \ = exp(t(Z))\n  # 对每个样本进行归一化\n  A = exp_scores / rowSums(exp_scores)\n  retvals\
  \ <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\n#### ReLU 导数\n```r\n\
  reluDerivative <- function(dA, cache) {\n  Z <- cache\n  dZ <- dA\n  # 创建一个值 > 0\
  \ 的逻辑矩阵\n  a <- Z > 0\n  # 当 z <= 0 时，也应将 dz 设为 0。执行逐元素乘法\n  dZ <- dZ * a\n  return(dZ)\n\
  }\n```\n\n#### Softmax 导数\n```r\nsoftmaxDerivative <- function(dA, cache, y, numTraining)\
  \ {\n  # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n  Z <- cache\n  # 计算 softmax\n\
  \  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  probs = exp_scores / rowSums(exp_scores)\n\
  \  # 获取 0、1 和 2 类的数量并存入 a,b,c\n  a = sum(y == 0)\n  b = sum(y == 1)\n  c = sum(y\
  \ == 2)\n  # 根据每个类别的 yi 创建 yi 矩阵\n  m = matrix(rep(c(1, 0, 0), a), nrow = a, ncol\
  \ = 3, byrow = T)\n  n = matrix(rep(c(0, 1, 0), b), nrow = b, ncol = 3, byrow =\
  \ T)\n  o = matrix(rep(c(0, 0, 1), c), nrow = c, ncol = 3, byrow = T)\n  # 垂直堆叠它们\n\
  \  yi = rbind(m, n, o)\n  dZ = probs - yi\n  return(dZ)\n}\n```\n\n### 模型初始化\n```r\n\
  initializeModel <- function(numFeats, numHidden, numOutput) {\n  set.seed(2)\n \
  \ a <- rnorm(numHidden * numFeats) * 0.01 # 乘以 .01\n  W1 <- matrix(a, nrow = numHidden,\
  \ ncol = numFeats)\n  a <- rnorm(numHidden * 1)\n  b1 <- matrix(a, nrow = numHidden,\
  \ ncol = 1)\n  a <- rnorm(numOutput * numHidden) * 0.01\n  W2 <- matrix(a, nrow\
  \ = numOutput, ncol = numHidden)\n  a <- rnorm(numOutput * 1)\n  b2 <- matrix(a,\
  \ nrow = numOutput, ncol = 1)\n  parameters <- list(\"W1\" = W1, \"b1\" = b1, \"\
  W2\" = W2, \"b2\" = b2)\n  return(parameters)\n}\n```\n\n### 前向传播\n```r\nlayerActivationForward\
  \ <- function(A_prev, W, b, activationFunc) {\n  # 计算 Z\n  z = W %*% A_prev\n  Z\
  \ <- sweep(z, 1, b, '+')\n  forward_cache <- list(\"A_prev\" = A_prev, \"W\" = W,\
  \ \"b\" = b)\n  # 计算 sigmoid 的激活值\n  if (activationFunc == \"sigmoid\") {\n    vals\
  \ = sigmoid(Z)\n  } else if (activationFunc == \"relu\") { # 计算 relu 的激活值\n    vals\
  \ = relu(Z)\n  } else if (activationFunc == 'tanh') { # 计算 tanh 的激活值\n    vals =\
  \ tanhActivation(Z)\n  } else if (activationFunc == 'softmax') {\n    vals = softmax(Z)\n\
  \  }\n  cache <- list(\"forward_cache\" = forward_cache, \"activation_cache\" =\
  \ vals[['Z']])\n  retvals <- list(\"A\" = vals[['A']], \"cache\" = cache)\n  return(retvals)\n\
  }\n```\n\n### 反向传播\n```r\nlayerActivationBackward <- function(dA, cache, y, activationFunc)\
  \ {\n  # 获取 A_prev,W,b\n  forward_cache <- cache[['forward_cache']]\n  activation_cache\
  \ <- cache[['activation_cache']]\n  A_prev <- forward_cache[['A_prev']]\n  numtraining\
  \ = dim(A_prev)[2]\n  # 获取 Z\n  if (activationFunc == \"relu\") {\n    dZ <- reluDerivative(dA,\
  \ activation_cache)\n  } else if (activationFunc == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA,\
  \ activation_cache)\n  } else if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA,\
  \ activation_cache)\n  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, y, numtraining)\n  }\n  # 检查是否为 softmax\n  if (activationFunc\
  \ == 'softmax') {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n\
  \    dW = 1 / numtraining * A_prev %*% dZ\n    db = 1 / numtraining * matrix(colSums(dZ),\
  \ nrow = 1, ncol = 3)\n    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n\
  \    b <- forward_cache[['b']]\n    numtraining = dim(A_prev)[2]\n    dW = 1 / numtraining\
  \ * dZ %*% t(A_prev)\n    db = 1 / numtraining * rowSums(dZ)\n    dA_prev = t(W)\
  \ %*% dZ\n  }\n  retvals <- list(\"dA_prev\" = dA_prev, \"dW\" = dW, \"db\" = db)\n\
  \  return(retvals)\n}\n```\n\n### 决策边界绘制\n```r\nplotDecisionBoundary <- function(Z,\
  \ W1, b1, W2, b2) {\n  xmin <- min(Z[, 1])\n  xmax <- max(Z[, 1])\n  ymin <- min(Z[,\
  \ 2])\n  ymax <- max(Z[, 2])\n  # 创建网格点\n  a = seq(xmin, xmax, length = 100)\n \
  \ b = seq(ymin, ymax, length = 100)\n  grid <- expand.grid(x = a, y = b)\n  colnames(grid)\
  \ <- c('x1', 'x2')\n  grid1 <- t(grid)\n  # 基于网格点预测输出\n  retvals <- layerActivationForward(grid1,\
  \ W1, b1, 'relu')\n  A1 <- retvals[['A']]\n  cache1 <- retvals[['cache']]\n  forward_cache1\
  \ <- cache1[['forward_cache1']]\n  activation_cache <- cache1[['activation_cache']]\n\
  \  retvals = layerActivationForward(A1, W2, b2, 'softmax')\n  A2 <- retvals[['A']]\n\
  \  cache2 <- retvals[['cache']]\n  forward_cache2 <- cache2[['forward_cache1']]\n\
  \  activation_cache2 <- cache2[['activation_cache']]\n  # 从 softmax 概率中选取概率最高的一个\n\
  \  q = apply(A2, 1, which.max)\n  q1 <- t(data.frame(q))\n  q2 <- as.numeric(q1)\n\
  \  grid2 <- cbind(grid, q2)\n  colnames(grid2) <- c('x1', 'x2', 'q2')\n  z1 <- data.frame(Z)\n\
  \  names(z1) <- c(\"x1\", \"x2\", \"y\")\n  atitle = paste(\"Decision boundary\"\
  )\n  ggplot(z1) +\n    geom_point(data = z1, aes(x = x1, y = x2, color = y)) +\n\
  \    stat_contour(data = grid2, aes(x = x1, y = x2, z = q2, color = q2), alpha =\
  \ 0.9) +\n    ggtitle(atitle) + scale_colour_gradientn(colours = brewer.pal(10,\
  \ \"Spectral\"))\n}\n```\n\n### 预测\n```r\ncomputeScores <- function(parameters,\
  \ X, hiddenActivationFunc = 'relu') {\n  fwdProp <- forwardPropagationDeep(X, parameters,\
  \ hiddenActivationFunc)\n  scores <- fwdProp$AL\n  return(scores)\n}\n```\n\n###\
