  \n    # Plot the contour and training examples\n    plt.contourf(xx, yy, Z, cmap=plt.cm.Spectral)\n\
  \n    plt.ylabel('x2')\n\n    plt.xlabel('x1')\n\n    plt.scatter(X[0, :], X[1,\
  \ :], c=y, cmap=cmap)\n\n    plt.title(\"Decision Boundary for hidden layer size:\"\
  \ + sz + \" and learning rate:\" + lr)\n\n    plt.savefig(fig, bbox_inches='tight')\n\
  ```\n\n### 2.2 R 实现\n\n```r\n##############################################################################################\n\
  #\n# Created by: Tinniam V Ganesh\n# Date : 11 Jan 2018\n# File: DLfunctions2_1.R\n\
  #\n##############################################################################################\n\
  \nlibrary(ggplot2)\n\n# Sigmoid function\nsigmoid <- function(z) {\n  a <- 1 / (1\
  \ + exp(-z))\n  a\n}\n\n# Compute the model shape given the dataset\n# Input : X\
  \ - features\n# Y - output\n#\n# Returns: no of training samples, no features, no\
  \ hidden, no output\ngetModelShape <- function(X, Y) {\n  numTraining <- dim(X)[2]\
  \ # No of training examples\n  numFeats <- dim(X)[1]    # No of input features\n\
  \  numHidden <- 4           # No of units in hidden layer\n\n  # If Y is a row vector\
  \ set numOutput as 1\n  if (is.null(dim(Y)))\n    numOutput <- 1 # No of output\
  \ units\n  else\n    numOutput <- dim(Y)[1]\n\n  # Create a list of values\n  modelParams\
  \ <- list(\"numTraining\" = numTraining, \"numFeats\" = numFeats,\n            \
  \          \"numHidden\" = numHidden, \"numOutput\" = numOutput)\n\n  return(modelParams)\n\
  }\n\n# Initialize the model\n# Input : number of features\n# number of hidden units\n\
  # number of units in output\n# Returns: Weight and bias matrices and vectors\ninitializeModel\
  \ <- function(numFeats, numHidden, numOutput) {\n  set.seed(2)\n  w <- rnorm(numHidden\
  \ * numFeats) * 0.01\n  W1 <- matrix(w, nrow = numHidden, ncol = numFeats) # Multiply\
  \ by .01\n  b1 <- matrix(rep(0, numHidden), nrow = numHidden, ncol = 1)\n\n  w <-\
  \ rnorm(numOutput * numHidden)\n  W2 <- matrix(w, nrow = numOutput, ncol = numHidden)\n\
  \  b2 <- matrix(rep(0, numOutput), nrow = numOutput, ncol = 1)\n\n  # Create a list\
  \ of the neural network parameters\n  nnParameters <- list('W1' = W1, 'b1' = b1,\
  \ 'W2' = W2, 'b2' = b2)\n\n  return(nnParameters)\n}\n\n# Compute the forward propagation\
  \ through the neural network\n# Input : Features\n# Weight and bias matrices and\
  \ vectors\n# Returns : The Activation of 2nd layer\n# : Output and activation of\
  \ layer 1 & 2\nforwardPropagation <- function(X, nnParameters) {\n  # Get the parameters\n\
  \  W1 <- nnParameters$W1\n  b1 <- nnParameters$b1\n  W2 <- nnParameters$W2\n  b2\
  \ <- nnParameters$b2\n\n  z <- W1 %*% X\n\n  # Broadcast the bias vector for each\
  \ row. Use 'sweep' The value '1' for MARGIN\n  # indicates sweep each row by this\
  \ value( add a column vector to each row).\n  # If we want to sweep by column use\
  \ '2' for MARGIN. Here a row vector is added to\n  # column (broadcasting!)\n  Z1\
  \ <- sweep(z, 1, b1, '+')\n\n  # Compute the output A1 with the tanh activation\
  \ function. The tanh activation function\n  # performs better than the sigmoid function\n\
  \  A1 <- tanh(Z1)\n\n  # Compute Z2 of the 2nd layer\n  z <- W2 %*% A1\n\n  # Broadcast\
  \ the bias vector for each row. Use 'sweep'\n  Z2 <- sweep(z, 1, b2, '+')\n\n  #\
  \ Compute the output A1 with the tanh activation function. The tanh activation function\n\
  \  # performs better than the sigmoid function\n  A2 <- sigmoid(Z2)\n\n  cache <-\
  \ list('Z1' = Z1, 'A1' = A1, 'Z2' = Z2, 'A2' = A2)\n\n  return(list('A2' = A2, 'cache'\
  \ = cache))\n}\n\n# Compute the cost\n# Input : Activation of 2nd layer\n# : Output\
  \ from data\n# Output: cost\ncomputeCost <- function(A2, Y) {\n  m <- length(Y)\n\
  \  cost <- -1/m * sum(Y * log(A2) + (1 - Y) * log(1 - A2))\n  # cost <- -1/m * sum(a\
  \ + b)\n  return(cost)\n}\n\n# Compute the backpropagation for 1 cycle\n# Input\
  \ : Neural Network parameters - weights and biases\n# # Z and Activations of 2 layers\n\
  # # Input features\n# # Output values Y\n# Returns: Gradients\nbackPropagation <-\
  \ function(nnParameters, cache, X, Y) {\n  numtraining <- dim(X)[2]\n\n  # Get parameters\n\
  \  W1 <- nnParameters$W1\n  W2 <- nnParameters$W2\n\n  # Get the NN cache\n  A1\
  \ <- cache$A1\n  A2 <- cache$A2\n\n  dZ2 <- A2 - Y\n  dW2 <- 1/numtraining * dZ2\
  \ %*% t(A1)\n  db2 <- 1/numtraining * rowSums(dZ2)\n\n  dZ1 <- t(W2) %*% dZ2 * (1\
  \ - A1²)\n  dW1 <- 1/numtraining * dZ1 %*% t(X)\n  db1 <- 1/numtraining * rowSums(dZ1)\n\
  \n  gradients <- list(\"dW1\" = dW1, \"db1\" = db1, \"dW2\" = dW2, \"db2\" = db2)\n\
  \  return(gradients)\n}\n\n# Gradient descent\n# Perform Gradient Descent\n# Input\
  \ : Weights and biases\n# : gradients\n# : learning rate\n# output : Updated weights\
  \ after 1 iteration\ngradientDescent <- function(nnParameters, gradients, learningRate)\
  \ {\n  W1 <- nnParameters$W1\n  b1 <- nnParameters$b1\n  W2 <- nnParameters$W2\n\
  \  b2 <- nnParameters$b2\n\n  dW1 <- gradients$dW1\n  db1 <- gradients$db1\n  dW2\
  \ <- gradients$dW2\n  db2 <- gradients$db2\n\n  W1 <- W1 - learningRate * dW1\n\
  \  b1 <- b1 - learningRate * db1\n  W2 <- W2 - learningRate * dW2\n  b2 <- b2 -\
  \ learningRate * db2\n\n  updatedNNParameters <- list(\"W1\" = W1, \"b1\" = b1,\
  \ \"W2\" = W2, \"b2\" = b2)\n  return(updatedNNParameters)\n}\n\n# Compute the Neural\
  \ Network by minimizing the cost\n# Input : Input data X,\n# Output Y\n# No of hidden\
  \ units in hidden layer\n# No of iterations\n# Returns Updated weight and bias vectors\
  \ of the neural network\ncomputeNN <- function(X, Y, numHidden, learningRate, numIterations\
  \ = 10000) {\n  modelParams <- getModelShape(X, Y)\n  numFeats <- modelParams$numFeats\n\
  \  numOutput <- modelParams$numOutput\n\n  costs <- NULL\n  nnParameters <- initializeModel(numFeats,\
  \ numHidden, numOutput)\n  W1 <- nnParameters$W1\n  b1 <- nnParameters$b1\n  W2\
  \ <- nnParameters$W2\n  b2 <- nnParameters$b2\n\n  # Perform gradient descent\n\
  \  for (i in 0:numIterations) {\n    # Evaluate forward prop to compute activation\
  \ at output layer\n    # print(\"Here\")\n    fwdProp <- forwardPropagation(X, nnParameters)\n\
  \n    # Compute cost from Activation at output and Y\n    cost <- computeCost(fwdProp$A2,\
  \ Y)\n\n    # Perform backprop to compute gradients\n    gradients <- backPropagation(nnParameters,\
  \ fwdProp$cache, X, Y)\n\n    # Use gradients to update the weights for each iteration.\n\
  \    nnParameters <- gradientDescent(nnParameters, gradients, learningRate)\n\n\
  \    # Print the cost every 1000 iterations\n    if (i %% 1000 == 0) {\n      costs\
  \ <- c(costs, cost)\n      print(cost)\n    }\n  }\n\n  nnVals <- list(\"nnParameter\"\
  \ = nnParameters, \"costs\" = costs)\n  return(nnVals)\n}\n\n# Predict the output\n\
  predict <- function(parameters, X) {\n  fwdProp <- forwardPropagation(X, parameters)\n\
  \  predictions <- fwdProp$A2 > 0.5\n  return(predictions)\n}\n\n# Plot a decision\
  \ boundary\n# This function uses the contour method\ndrawBoundary <- function(z,\
  \ nn) {\n  # Find the minimum and maximum of the 2 features\n  xmin <- min(z[, 1])\n\
  \  xmax <- max(z[, 1])\n  ymin <- min(z[, 2])\n  ymax <- max(z[, 2])\n\n  a <- seq(xmin,\
  \ xmax, length = 100)\n  b <- seq(ymin, ymax, length = 100)\n\n  grid <- expand.grid(x\
  \ = a, y = b)\n  grid1 <- t(grid)\n\n  q <- predict(nn$nnParameter, grid1)\n\n \
  \ # Works\n  contour(a, b, z = matrix(q, nrow = 100), levels = 0.5)\n}\n```\n\n\n\
  \n\n\n## R 代码示例\n\n```r\ncol=\"black\", drawlabels=FALSE, lwd=2, xlim=range(2,10))\n\
  points(z[,1], z[,2], col=ifelse(z[,3]==1, \"coral\", \"cornflowerblue\"), pch=18)\n\
  ```\n\n### 绘制决策边界 (使用 ggplot2)\n\n```r\nplotDecisionBoundary <- function(z, nn,\
  \ sz, lr) {\n  xmin <- min(z[,1])\n  xmax <- max(z[,1])\n  ymin <- min(z[,2])\n\
