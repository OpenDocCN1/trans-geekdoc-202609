  \n### 2. 初始化技术\n\n通常的初始化技术是生成高斯或均匀随机数，并乘以一个像 0.01 这样的小值。用于加速收敛的两种技术是“He 初始化” [(https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/He_Delving_Deep_into_ICCV_2015_paper.pdf)](https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/He_Delving_Deep_into_ICCV_2015_paper.pdf)。\n\
  \n\n\n\n\n# 初始化技术\n\n这些初始化技术使梯度下降能够更快收敛。\n\n## 1.1a 默认初始化 – Python\n\n此技术仅根据高斯分布或均匀分布将权重初始化为较小的随机值。\n\
  \n```python\nimport numpy as np\nimport matplotlib\nimport matplotlib.pyplot as\
  \ plt\nimport sklearn.linear_model\nimport pandas as pd\nimport sklearn\nimport\
  \ sklearn.datasets\nexec(open(\"DLfunctions61.py\").read())\n\n# Load the data\n\
  train_X, train_Y, test_X, test_Y = load_dataset()\n\n# Set the layers dimensions\n\
  # 2 – number of input features\n# 7 – 1 hidden layer 7 hidden units\n# 1 – 1 sigmoid\
  \ activation unit at the output layer\nlayersDimensions = [2, 7, 1]\n\n# Train a\
  \ L-layer deep learning network with random initialization\n# hidden Activation\
  \ function – relu\n# output activation function – sigmoid\n# learning rate – 0.6\n\
  parameters = L_Layer_DeepModel(train_X, train_Y, layersDimensions, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", learningRate=0.6, num_iterations=9000, initType=\"\
  default\", print_cost=True, figure=\"fig1.png\")\n\n# Clear the plot\nplt.clf()\n\
  plt.close()\n\n# Plot the decision boundary\nplot_decision_boundary(lambda x: predict(parameters,\
  \ x.T), train_X, train_Y, str(0.6), figure1=\"fig2.png\")\n```\n\n![Image 270](img/index-198_1.jpg)\n\
  ![Image 271](img/index-198_2.jpg)\n![Image 272](img/index-199_1.jpg)\n\n## 1.1b\
  \ He 初始化 – Python\n\n[He 初始化](https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/He_Delving_Deep_into_ICCV_2015_paper.pdf)\
  \ 将随机权重乘以 `sqrt(2/layerDimensions[previous layer])`。\n\n```python\nimport numpy\
  \ as np\nimport matplotlib\nimport matplotlib.pyplot as plt\nimport sklearn.linear_model\n\
  import pandas as pd\nimport sklearn\nimport sklearn.datasets\nexec(open(\"DLfunctions61.py\"\
