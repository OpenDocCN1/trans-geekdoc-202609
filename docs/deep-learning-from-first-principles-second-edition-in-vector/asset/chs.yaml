  \n\n\n\n## 4. 附录 3 - 构建 L 层深度学习网络\n\n### 3.1 Python\n\n```python\n# -*- coding:\
  \ utf-8 -*-\n\n\"\"\"\n############################################################################################################\n\
  #\n# File: DLfunctions34.py\n# Developer: Tinniam V Ganesh\n# Date : 30 Jan 2018\n\
  #\n##########################################################################################################\n\
  @author: Ganesh\n\"\"\"\n\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  import matplotlib\nimport matplotlib.pyplot as plt\nfrom matplotlib import cm\n\n\
  # 计算向量的 Sigmoid 函数值。同时返回 Z\ndef sigmoid(Z):\n    A = 1 / (1 + np.exp(-Z))\n    cache\
  \ = Z\n    return A, cache\n\n# 计算向量的 Relu 函数值\ndef relu(Z):\n    A = np.maximum(0,\
  \ Z)\n    cache = Z\n    return A, cache\n\n# 计算向量的 tanh 函数值\ndef tanh(Z):\n   \
  \ A = np.tanh(Z)\n    cache = Z\n    return A, cache\n\n# 计算 Relu 的导数\n# g'(z) =\
  \ 1 if z > 0 and 0 otherwise\ndef reluDerivative(dA, cache):\n    Z = cache\n  \
  \  dZ = np.array(dA, copy=True)  # 只是将 dz 转换为正确的对象。\n    # 当 z <= 0 时，也应将 dz 设为\
  \ 0。\n    dZ[Z <= 0] = 0\n    return dZ\n\n# 计算 Sigmoid 的导数\n# Derivative g'(z)\
  \ = a * (1-a)\ndef sigmoidDerivative(dA, cache):\n    Z = cache\n    s = 1 / (1\
  \ + np.exp(-Z))\n    dZ = dA * s * (1 - s)\n    return dZ\n\n# 计算 tanh 的导数\n# Derivative\
  \ g'(z) = 1 - a²\ndef tanhDerivative(dA, cache):\n    Z = cache\n    a = np.tanh(Z)\n\
  \    dZ = dA * (1 - np.power(a, 2))\n    return dZ\n\n# 初始化模型\n# Input : number\
  \ of features (特征数量)\n# number of hidden units (隐藏单元数量)\n# number of units in output\
  \ (输出单元数量)\n# Returns: Weight and bias matrices and vectors (权重和偏置矩阵及向量)\ndef initializeModel(numFeats,\
  \ numHidden, numOutput):\n    np.random.seed(1)\n    W1 = np.random.randn(numHidden,\
  \ numFeats) * 0.01  # Multiply by .01 (乘以 .01)\n    b1 = np.zeros((numHidden, 1))\n\
  \    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n    # Create a dictionary of the neural network parameters (创建神经网络参数字典)\n\
  \    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2': b2}\n    return nnParameters\n\
  \n# 为 L 层初始化模型\n# Input : List of units in each layer (每层单元数量的列表)\n# Returns: Initial\
  \ weights and biases matrices for all layers (所有层的初始权重和偏置矩阵)\ndef initializeDeepModel(layerDimensions):\n\
  \    np.random.seed(3)\n    # note the Weight matrix at layer 'l' is a matrix of\
  \ size (l, l-1)\n    # (注意第 'l' 层的权重矩阵是大小为 (l, l-1) 的矩阵)\n    # The Bias is a vectors\
  \ of size (l, 1)\n    # (偏置是大小为 (l, 1) 的向量)\n    # Loop through the layer dimension\
  \ from 1.. L. Initialize an empty dictionary\n    # (遍历 1..L 的层维度。初始化一个空字典)\n  \
  \  layerParams = {}\n    for l in range(1, len(layerDimensions)):\n        # Append\
  \ to dictionary (添加到字典)\n        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l],\
  \ layerDimensions[l-1]) * 0.01\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n\n# 计算深度网络中第 'l' 层的前向传播激活值\n# Input : A_prev - Activation\
  \ of previous layer (上一层的激活值)\n# W, b - Weight and bias matrices and vectors (权重和偏置矩阵及向量)\n\
  # activationFunc - Activation function - sigmoid, tanh, relu etc (激活函数 - sigmoid,\
  \ tanh, relu 等)\n# Returns : The Activation of this layer (该层的激活值)\n# Z = W * X\
  \ + b\n# A = sigmoid(Z), A = Relu(Z), A = tanh(Z)\ndef layerActivationForward(A_prev,\
  \ W, b, activationFunc):\n    # Compute Z (计算 Z)\n    Z = np.dot(W, A_prev) + b\n\
  \    forward_cache = (A_prev, W, b)\n    # Compute the activation for sigmoid (计算\
  \ sigmoid 的激活值)\n    if activationFunc == \"sigmoid\":\n        A, activation_cache\
  \ = sigmoid(Z)\n    # Compute the activation for Relu (计算 Relu 的激活值)\n    elif activationFunc\
  \ == \"relu\":\n        A, activation_cache = relu(Z)\n    # Compute the activation\
  \ for tanh (计算 tanh 的激活值)\n    elif activationFunc == 'tanh':\n        A, activation_cache\
  \ = tanh(Z)\n    # Cache the forward-cache and activation_cache (缓存 forward-cache\
  \ 和 activation_cache)\n    cache = (forward_cache, activation_cache)\n    return\
  \ A, cache\n\n# 计算第 1..L 层的前向传播\n# Input : X - Input Features (输入特征)\n# parameters:\
  \ Weights and biases (权重和偏置)\n# hiddenActivationFunc - Activation function at hidden\
  \ layers Relu/tanh (隐藏层激活函数 Relu/tanh)\n# Returns : AL, caches\n# The forward propagation\
  \ uses the Relu/tanh activation from layer 1..L-1 and sigmoid activation at layer\
  \ L\n# (前向传播在第 1..L-1 层使用 Relu/tanh 激活函数，在第 L 层使用 sigmoid 激活函数)\ndef forwardPropagationDeep(X,\
  \ parameters, hiddenActivationFunc='relu'):\n    caches = []\n    # Set A to X (A0)\
  \ (将 A 设为 X (A0))\n    A = X\n    L = int(len(parameters) / 2)  # number of layers\
  \ in the neural network (神经网络中的层数)\n    # Loop through from layer 1 to upto layer\
  \ L (从第 1 层循环到第 L 层)\n    for l in range(1, L):\n        A_prev = A\n        A,\
  \ cache = layerActivationForward(A_prev, parameters['W' + str(l)], parameters['b'\
  \ + str(l)], activationFunc=hiddenActivationFunc)\n        caches.append(cache)\n\
  \    # Since this is binary classification use the sigmoid activation function in\
  \ last layer\n    # (因为这是二分类，所以在最后一层使用 sigmoid 激活函数)\n    AL, cache = layerActivationForward(A,\
  \ parameters['W' + str(L)], parameters['b' + str(L)], activationFunc=\"sigmoid\"\
  )\n    caches.append(cache)\n    return AL, caches\n\n# 计算代价\n# Input : Activation\
  \ of last layer, Output from data (最后一层的激活值，数据的输出)\n# Output: cost (代价)\ndef computeCost(AL,\
  \ Y):\n    m = float(Y.shape[1])\n    # Element wise multiply for logprobs (逐元素相乘以计算对数概率)\n\
  \    cost = -1 / m * np.sum(Y * np.log(AL) + (1 - Y) * (np.log(1 - AL)))\n    cost\
  \ = np.squeeze(cost)\n    return cost\n\n# 计算单层的反向传播\n# Input : Neural Network parameters\
  \ - dA, cache - forward_cache & activation_cache\n# (神经网络参数 - dA, cache - forward_cache\
  \ 和 activation_cache)\n# Input features, Output values Y (输入特征，输出值 Y)\n# Returns:\
  \ Gradients (梯度)\n# dL/dWi = dL/dZi * Al-1\n# dl/dbl = dL/dZl\n# dL/dZ_prev = dL/dZl\
  \ * W\ndef layerActivationBackward(dA, cache, activationFunc):\n    forward_cache,\
  \ activation_cache = cache\n    # Compute derivative based on activation function\
  \ (根据激活函数计算导数)\n    if activationFunc == \"relu\":\n        dZ = reluDerivative(dA,\
  \ activation_cache)\n    elif activationFunc == \"sigmoid\":\n        dZ = sigmoidDerivative(dA,\
  \ activation_cache)\n    elif activationFunc == \"tanh\":\n        dZ = tanhDerivative(dA,\
  \ activation_cache)\n    # Compute gradients (计算梯度)\n    A_prev, W, b = forward_cache\n\
  \    numtraining = float(A_prev.shape[1])\n    dW = 1 / numtraining * (np.dot(dZ,\
  \ A_prev.T))\n    db = 1 / numtraining * np.sum(dZ, axis=1, keepdims=True)\n   \
  \ dA_prev = np.dot(W.T, dZ)\n    return dA_prev, dW, db\n\n# 计算一个周期内所有层的反向传播\n#\
  \ Input : AL: Output of L layer Network - weights, Y Real output\n# (AL: L 层网络的输出\
  \ - 权重，Y 真实输出)\n# caches -- list of caches containing:\n# (caches -- 包含以下内容的缓存列表：)\n\
  # every cache of layerActivationForward() with \"relu\"/\"tanh\" (it's caches[l],\
  \ for l in range(L-1) i.e l = 0...L-2)\n# (每个带有 \"relu\"/\"tanh\" 的 layerActivationForward()\
  \ 缓存 (即 caches[l], l 取值范围为 range(L-1) 即 l = 0...L-2))\n# the cache of layerActivationForward()\
  \ with \"sigmoid\" (it's caches[L-1])\n# (带有 \"sigmoid\" 的 layerActivationForward()\
  \ 缓存 (即 caches[L-1]))\n# hiddenActivationFunc - Activation function at hidden layers\
  \ (隐藏层激活函数)\n# Returns: gradients -- A dictionary with the gradients\n# (gradients\
  \ -- 包含梯度的字典)\n# gradients[\"dA\" + str(l)] = ..., gradients[\"dW\" + str(l)] =\
  \ ...\ndef backwardPropagationDeep(AL, Y, caches, hiddenActivationFunc='relu'):\n\
  \    # initialize the gradients (初始化梯度)\n    gradients = {}\n    # Set the number\
  \ of layers (设置层数)\n    L = len(caches)\n    m = float(AL.shape[1])\n    Y = Y.reshape(AL.shape)\
  \  # after this line, Y is the same shape as AL\n    # (执行此行后，Y 的形状与 AL 相同)\n  \
  \  # Initializing the backpropagation (初始化反向传播)\n    # dl/dAL = -(y/a + (1-y)/(1-a))\
  \ - At the output layer\n    # (dl/dAL = -(y/a + (1-y)/(1-a)) - 在输出层)\n    dAL =\
  \ - (np.divide(Y, AL) - np.divide(1 - Y, 1 - AL))\n    # Since this is a binary\
  \ classification the activation at output is sigmoid\n    # (因为这是二分类，所以输出层的激活函数是\
  \ sigmoid)\n    # Get the gradients at the last layer (获取最后一层的梯度)\n    current_cache\
  \ = caches[L-1]\n    gradients[\"dA\" + str(L)], gradients[\"dW\" + str(L)], gradients[\"\
  db\" + str(L)] = layerActivationBackward(dAL, current_cache, activationFunc=\"sigmoid\"\
  )\n    # Traverse in the reverse direction (反向遍历)\n    for l in reversed(range(L-1)):\n\
  \        # Compute the gradients for L-1 to 1 for Relu/tanh (计算第 L-1 到第 1 层针对 Relu/tanh\
  \ 的梯度)\n        current_cache = caches[l]\n        dA_prev_temp, dW_temp, db_temp\
  \ = layerActivationBackward(gradients['dA' + str(l+2)], current_cache, activationFunc=hiddenActivationFunc)\n\
  \        gradients[\"dA\" + str(l + 1)] = dA_prev_temp\n        gradients[\"dW\"\
  \ + str(l + 1)] = dW_temp\n        gradients[\"db\" + str(l + 1)] = db_temp\n  \
  \  return gradients\n\n# 执行梯度下降\n# Input : Weights and biases, gradients, learning\
  \ rate (权重和偏置，梯度，学习率)\n# Output : Updated weights after 1 iteration (1 次迭代后的更新权重)\n\
  def gradientDescent(parameters, gradients, learningRate):\n    L = len(parameters)\
  \ / 2\n```\n\n```matlab\nplot(iterations, costs, color=col(i), \"linewidth\", 3);\n\
  hold off;\ntitle(\"Cost vs no of iterations for different number of hidden units\"\
  );\nxlabel(\"No of iterations\");\nylabel(\"Cost\");\nlegend('4', '9', '12');\n\
  endfor\nend\n```\n\n\n\n\n\n# 每个参数的更新规则\n\n```python\nfor l in range(L):\n    parameters[\"\
  W\" + str(l+1)] = parameters['W'+str(l+1)] - learningRate * gradients['dW' + str(l+1)]\n\
  \    parameters[\"b\" + str(l+1)] = parameters['b'+str(l+1)] - learningRate * gradients['db'\
  \ + str(l+1)]\nreturn parameters\n```\n\n# 执行 L 层深度学习模型\n\n**输入**：\n- `X` - 输入特征\n\
  - `Y` 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数 relu /tanh\n\
  - `learning rate` - 学习率\n- `num of iterations` - 迭代次数\n\n**输出**：更新后的权重和偏置\n\n```python\n\
  def L_Layer_DeepModel(X, Y, layersDimensions, hiddenActivationFunc='relu', learning_rate\
  \ = .3, num_iterations = 10000, fig=\"figx.png\"): # lr was 0.009\n    np.random.seed(1)\n\
  \    costs = []\n\n    # 初始化参数\n    parameters = initializeDeepModel(layersDimensions)\n\
  \n    # 执行梯度下降\n    for i in range(0, num_iterations):\n        # 执行一轮前向传播\n   \
  \     AL, caches = forwardPropagationDeep(X, parameters, hiddenActivationFunc)\n\
  \n        # 计算成本。\n        cost = computeCost(AL, Y)\n\n        # 通过 1 轮反向传播计算梯度\n\
  \        gradients = backwardPropagationDeep(AL, Y, caches, hiddenActivationFunc)\n\
  \n        # 更新参数。\n        parameters = gradientDescent(parameters, gradients, learning_rate)\n\
  \n        # 存储成本\n        if i % 100 == 0:\n            print (\"Cost after iteration\
  \ %i: %f\" %(i, cost))\n\n        if i % 100 == 0:\n            costs.append(cost)\n\
  \n    # 绘制成本图\n    fig1 = plt.plot(np.squeeze(costs))\n    fig1 = plt.ylabel('cost')\n\
  \    fig1 = plt.xlabel('No of iterations(per 100)')\n    fig1 = plt.title(\"Learning\
  \ rate =\" + str(learning_rate))\n    # plt.show()\n    fig1.figure.savefig(fig,\
  \ bbox_inches='tight')\n    plt.clf()\n\n    return parameters\n```\n\n# 绘制决策边界\n\
  \n**输入**：\n- 输入模型\n- `X`\n- `Y`\n- `sz` - 隐藏单元数量\n- `lr` - 学习率\n- 保存为的图片文件\n\n**返回**：空\n\
