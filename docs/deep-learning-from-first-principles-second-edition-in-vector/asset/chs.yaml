  \n## 2.1. 带学习率衰减的随机梯度下降\n\n在随机梯度下降中，每个 epoch 使用略微不同的样本，当使用固定学习率时，梯度下降算法会在峡谷中振荡并在极小值附近游荡。在“学习率衰减”技术中，学习率随着\
  \ epoch 数量的增加而缓慢减小，变得越来越小，以便梯度下降能朝极小值迈出更小的步伐。\n\n学习率衰减有几种技术：\n\na) 指数衰减：\nb) 1/t\
  \ 衰减：\nc)\n\n在我的实现中，我使用了“指数衰减”。Python 的代码片段如下：\n\n```python\nif lrDecay == True:\n\
  \    # decay the learning rate exponentially\n    learningRate = np.power(decayRate,\
  \ (num_epochs/1000)) * learningRate\n```\n\n## 2.1a. 带学习率衰减的随机梯度下降 – Python\n\n\
