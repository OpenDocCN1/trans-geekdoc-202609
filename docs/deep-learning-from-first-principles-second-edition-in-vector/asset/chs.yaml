  \ = z` 当 `z > 0` 时，`0` 当 `z <= 0` 时 → `g'(z) = 1` 当 `z > 0` 时，`0` 当 `z <= 0` 时\n\
  \n\n\n\n\n下面包含了用于 Python、R 和 Octave 的多层向量化深度学习网络的实现。对于所有这些实现，最初我都会创建深度学习网络的大小和配置，即层维度。因此，例如，长度为\
