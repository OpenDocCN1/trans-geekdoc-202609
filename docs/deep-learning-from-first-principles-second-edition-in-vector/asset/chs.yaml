  \nimport numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib\nimport\
  \ matplotlib.pyplot as plt\nfrom matplotlib import cm\nimport math\nimport sklearn\n\
  import sklearn.datasets\n\n# 计算向量的 Sigmoid 函数值\ndef sigmoid(Z):\n    A = 1/(1+np.exp(-Z))\n\
  \    cache = Z\n    return A, cache\n\n# 计算向量的 Relu 函数值\ndef relu(Z):\n    A = np.maximum(0,\
  \ Z)\n    cache = Z\n    return A, cache\n\n# 计算向量的 tanh 函数值\ndef tanh(Z):\n   \
  \ A = np.tanh(Z)\n    cache = Z\n    return A, cache\n\n# 计算向量的 Softmax 函数值\ndef\
  \ softmax(Z):\n    # 获取未归一化的概率\n    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n\
  \    A = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n    cache = Z\n\
  \    return A, cache\n\n# 计算向量的数值稳定 Softmax 函数值\ndef stableSoftmax(Z):\n    # 以数值稳定的方式计算向量\
  \ x 的 softmax。\n    shiftZ = Z.T - np.max(Z.T, axis=1).reshape(-1, 1)\n    exp_scores\
  \ = np.exp(shiftZ)\n    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores, axis=1,\
  \ keepdims=True)\n    cache = Z\n    return A, cache\n\n# 计算 Relu 的导数\ndef reluDerivative(dA,\
  \ cache):\n    Z = cache\n    dZ = np.array(dA, copy=True)  # 只是将 dz 转换为正确的对象。\n\
  \    # 当 z <= 0 时，也应将 dz 设为 0。\n    dZ[Z <= 0] = 0\n    return dZ\n\n# 计算 Sigmoid\
  \ 的导数\ndef sigmoidDerivative(dA, cache):\n    Z = cache\n    s = 1/(1+np.exp(-Z))\n\
  \    dZ = dA * s * (1-s)\n    return dZ\n\n# 计算 tanh 的导数\ndef tanhDerivative(dA,\
  \ cache):\n    Z = cache\n    a = np.tanh(Z)\n    dZ = dA * (1 - np.power(a, 2))\n\
  \    return dZ\n\n# 计算 Softmax 的导数\ndef softmaxDerivative(dA, cache, y, numTraining):\n\
  \    # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算 Softmax\n\
  \    exp_scores = np.exp(Z.T)\n    # 对每个样本进行归一化\n    probs = exp_scores / np.sum(exp_scores,\
  \ axis=1, keepdims=True)\n    # 计算分数上的梯度\n    dZ = probs\n    # dZ = pi- yi\n  \
  \  dZ[range(int(numTraining)), y[:, 0]] -= 1\n    return dZ\n\n# 计算稳定 Softmax 的导数\n\
  def stableSoftmaxDerivative(dA, cache, y, numTraining):\n    # 注意：未使用 dA。dL/dZ =\
  \ dL/dA * dA/dZ = pi-yi\n    Z = cache\n    # 计算稳定 Softmax\n    shiftZ = Z.T - np.max(Z.T,\
  \ axis=1).reshape(-1, 1)\n    exp_scores = np.exp(shiftZ)\n    # 对每个样本进行归一化\n  \
  \  probs = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n    # 计算分数上的梯度\n\
  \    dZ = probs\n    # dZ = pi- yi\n    dZ[range(int(numTraining)), y[:, 0]] -=\
  \ 1\n    return dZ\n\n# 初始化模型\n# 输入：特征数量\n# 隐藏单元数量\n# 输出单元数量\n# 返回：权重和偏置矩阵及向量\n\
  def initializeModel(numFeats, numHidden, numOutput):\n    np.random.seed(1)\n  \
  \  W1 = np.random.randn(numHidden, numFeats) * 0.01  # 乘以 .01\n    b1 = np.zeros((numHidden,\
  \ 1))\n    W2 = np.random.randn(numOutput, numHidden) * 0.01\n    b2 = np.zeros((numOutput,\
  \ 1))\n    # 创建神经网络参数字典\n    nnParameters = {'W1': W1, 'b1': b1, 'W2': W2, 'b2':\
  \ b2}\n    return nnParameters\n\n# 为 L 层初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  def initializeDeepModel(layerDimensions):\n    np.random.seed(3)\n    # 注意第 'l'\
  \ 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n    # 从 1 循环到 L\n    layerParams =\
  \ {}\n    for l in range(1, len(layerDimensions)):\n        layerParams['W' + str(l)]\
  \ = np.random.randn(layerDimensions[l], layerDimensions[l-1]) * 0.01  # 乘以 .01\n\
  \        layerParams['b' + str(l)] = np.zeros((layerDimensions[l], 1))\n       \
  \ np.savetxt('W' + str(l) + '.csv', layerParams['W' + str(l)], delimiter=',')\n\
  \        np.savetxt('b' + str(l) + '.csv', layerParams['b' + str(l)], delimiter=',')\n\
  \    return layerParams\n\n# 为 L 层进行 He 初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  # He 初始化将随机数乘以 sqrt(2/layerDimensions[l-1])\ndef HeInitializeDeepModel(layerDimensions):\n\
  \    np.random.seed(3)\n    # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n\
  \    # 从 1 循环到 L\n    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n\
  \        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l-1])\
  \ * np.sqrt(2/layerDimensions[l-1])\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n\n# 为 L 层进行 Xavier 初始化模型\n# 输入：每层单元数量的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  # Xavier 初始化将随机数乘以 sqrt(1/layerDimensions[l-1])\ndef XavInitializeDeepModel(layerDimensions):\n\
  \    np.random.seed(3)\n    # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n    # 偏置是大小为 (l,1) 的向量\n\
  \    # 从 1 循环到 L\n    layerParams = {}\n    for l in range(1, len(layerDimensions)):\n\
  \        layerParams['W' + str(l)] = np.random.randn(layerDimensions[l], layerDimensions[l-1])\
  \ * np.sqrt(1/layerDimensions[l-1])\n        layerParams['b' + str(l)] = np.zeros((layerDimensions[l],\
  \ 1))\n    return layerParams\n\n# 初始化速度\n# 输入：parameters\n# 返回：v - 初始速度\ndef initializeVelocity(parameters):\n\
  \    L = len(parameters) // 2  # 创建一个整数\n    v = {}\n    # 使用与 W 相同的维度初始化速度\n  \
  \  for l in range(L):\n        v[\"dW\" + str(l+1)] = np.zeros((parameters['W' +\
  \ str(l+1)].shape[0], parameters['W' + str(l+1)].shape[1]))\n        v[\"db\" +\
  \ str(l+1)] = np.zeros((parameters['b' + str(l+1)].shape[0], parameters['b' + str(l+1)].shape[1]))\n\
  \    return v\n\n# 初始化 RMSProp 参数\n# 输入：每层单元数量的列表\n# 返回：s - 初始 RMSProp\ndef initializeRMSProp(parameters):\n\
  \    L = len(parameters) // 2  # 创建一个整数\n    s = {}\n    # 使用与 W 相同的维度初始化速度\n  \
  \  for l in range(L):\n        s[\"dW\" + str(l+1)] = np.zeros((parameters['W' +\
  \ str(l+1)].shape[0], parameters['W' + str(l+1)].shape[1]))\n        s[\"db\" +\
  \ str(l+1)] = np.zeros((parameters['b' + str(l+1)].shape[0], parameters['b' + str(l+1)].shape[1]))\n\
  \    return s\n\n# 初始化 Adam 参数\n# 输入：每层单元数量的列表\n# 返回：v 和 s - Adam 参数\ndef initializeAdam(parameters):\n\
  \    L = len(parameters) // 2  # 神经网络中的层数\n    v = {}\n    s = {}\n    # 初始化 v,\
  \ s。\n    for l in range(L):\n        v[\"dW\" + str(l+1)] = np.zeros((parameters['W'\
  \ + str(l+1)].shape[0], parameters['W' + str(l+1)].shape[1]))\n        v[\"db\"\
  \ + str(l+1)] = np.zeros((parameters['b' + str(l+1)].shape[0], parameters['b' +\
  \ str(l+1)].shape[1]))\n        s[\"dW\" + str(l+1)] = np.zeros((parameters['W'\
  \ + str(l+1)].shape[0], parameters['W' + str(l+1)].shape[1]))\n        s[\"db\"\
  \ + str(l+1)] = np.zeros((parameters['b' + str(l+1)].shape[0], parameters['b' +\
  \ str(l+1)].shape[1]))\n    return v, s\n\n# 计算深层网络前向传播中第 'l' 层的激活值\n# 输入：A_prev\
  \ - 上一层的激活值\n# W,b - 权重和偏置矩阵及向量\n# keep_prob\n# activationFunc - 激活函数 - sigmoid,\
  \ tanh, relu 等\n# 返回：A, cache\n# :\n# Z = W * X + b\n# A = sigmoid(Z), A= Relu(Z),\
  \ A= tanh(Z)\ndef layerActivationForward(A_prev, W, b, keep_prob=0, activationFunc=\"\
  relu\"):\n    # 计算 Z\n    Z = np.dot(W, A_prev) + b\n    forward_cache = (A_prev,\
  \ W, b)\n```\n\n```matlab\ncontour(X1, X2, vals, \"linewidth\", 4);\nprint -dpng\
  \ \"fig-o1.png\"\nend\n```\n\n\n\n\n# 计算 Sigmoid 的激活值\n\n```python\nif activationFunc\
  \ == \"sigmoid\":\n    A, activation_cache = sigmoid(Z)\n```\n\n# 计算 Relu 的激活值\n\
  \n```python\nelif activationFunc == \"relu\":\n    A, activation_cache = relu(Z)\n\
  ```\n\n# 计算 Tanh 的激活值\n\n```python\nelif activationFunc == 'tanh':\n    A, activation_cache\
  \ = tanh(Z)\n```\n\n```python\nelif activationFunc == 'softmax':\n    A, activation_cache\
  \ = stableSoftmax(Z)\n```\n\n```python\ncache = (forward_cache, activation_cache)\n\
  return A, cache\n```\n\n# 计算第 1 层到第 L 层的前向传播\n\n**输入**：`X` - 输入特征\n\n**参数**：权重和偏置\n\
  \n**keep_prob**\n\n**hiddenActivationFunc** - 隐藏层的激活函数 Relu/tanh\n\n**outputActivationFunc**\
  \ - 输出层的激活函数 - sigmoid/softmax\n\n**返回**：`AL`、`caches`、`dropoutMat`\n\n前向传播在第 1\
  \ 层到第 L-1 层使用 Relu/tanh 激活函数，在第 L 层使用 Sigmoid 激活函数。\n\n```python\ndef forwardPropagationDeep(X,\
  \ parameters, keep_prob=0, hiddenActivationFunc='relu', outputActivationFunc='sigmoid'):\n\
  \    caches = []\n    # 初始化 dropout 矩阵\n    dropoutMat = {}\n    # 将 A 设为 X (A0)\n\
  \    A = X\n    L = len(parameters) // 2  # 神经网络中的层数\n    # 从第 1 层循环到第 L 层\n   \
  \ for l in range(1, L):\n        A_prev = A\n        # Zi = Wi x Ai-1 + bi 且 Ai\
  \ = g(Zi)\n        A, cache = layerActivationForward(A_prev, parameters['W' + str(l)],\
  \ parameters['b' + str(l)], keep_prob, activationFunc=hiddenActivationFunc)\n  \
  \      # 随机丢弃一些激活单元\n        # 创建一个与 A 形状相同的矩阵\n        D = np.random.rand(A.shape[0],\
  \ A.shape[1])\n        D = (D < keep_prob)\n        # 我们需要在反向传播中使用相同的 'dropout'\
  \ 矩阵\n        # 保存 dropout 矩阵以供反向传播使用\n        dropoutMat[\"D\" + str(l)] = D\n\
  \        A = np.multiply(A, D)\n        A = np.divide(A, keep_prob)\n        caches.append(cache)\n\
  \    # 最后一层\n    AL, cache = layerActivationForward(A, parameters['W' + str(L)],\
  \ parameters['b' + str(L)], activationFunc=outputActivationFunc)\n    caches.append(cache)\n\
  \    return AL, caches, dropoutMat\n```\n\n# 计算代价\n\n**输入**：最后一层的激活值，数据的输出 `Y`、`outputActivationFunc`\
  \ - 输出层的激活函数 - sigmoid/softmax\n\n**输出**：cost\n\n```python\ndef computeCost(AL,\
  \ Y, outputActivationFunc=\"sigmoid\"):\n    if outputActivationFunc == \"sigmoid\"\
  :\n        m = float(Y.shape[1])\n        # 对 logprobs 进行逐元素相乘\n        cost = -1/m\
  \ * np.sum(Y * np.log(AL) + (1 - Y) * (np.log(1 - AL)))\n        cost = np.squeeze(cost)\n\
  \    elif outputActivationFunc == \"softmax\":\n        # 对 softmax 进行 Y 的转置\n \
  \       Y = Y.T\n        m = float(len(Y))\n        # 计算对数概率。根据输出 y 获取正确类别的对数概率\n\
  \        correct_logprobs = -np.log(AL[range(int(m)), Y.T])\n        # 计算损失\n  \
  \      cost = np.sum(correct_logprobs) / m\n    return cost\n```\n\n# 计算带正则化的代价\n\
  \n**输入**：`parameters`、`AL`、`Y`、`lambd`、`outputActivationFunc` - 输出层的激活函数 - sigmoid/softmax/tanh\n\
  \n**输出**：cost\n\n```python\ndef computeCostWithReg(parameters, AL, Y, lambd, outputActivationFunc=\"\
  sigmoid\"):\n    if outputActivationFunc == \"sigmoid\":\n        m = float(Y.shape[1])\n\
  \        # 对 logprobs 进行逐元素相乘\n        cost = -1/m * np.sum(Y * np.log(AL) + (1\
  \ - Y) * (np.log(1 - AL)))\n        cost = np.squeeze(cost)\n        # 正则化代价\n \
  \       L = int(len(parameters) / 2)\n        L2RegularizationCost = 0\n       \
  \ for l in range(L):\n            L2RegularizationCost += np.sum(np.square(parameters['W'\
  \ + str(l + 1)]))\n        L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \        cost = cost + L2RegularizationCost\n    elif outputActivationFunc == \"\
  softmax\":\n        # 对 softmax 进行 Y 的转置\n        Y = Y.T\n        m = float(len(Y))\n\
  \        # 计算对数概率。根据输出 y 获取正确类别的对数概率\n        correct_logprobs = -np.log(AL[range(int(m)),\
  \ Y.T])\n        # 计算损失\n        cost = np.sum(correct_logprobs) / m\n        #\
  \ 正则化代价\n        L = int(len(parameters) / 2)\n        L2RegularizationCost = 0\n\
  \        for l in range(L):\n            L2RegularizationCost += np.sum(np.square(parameters['W'\
  \ + str(l + 1)]))\n        L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \        cost = cost + L2RegularizationCost\n    return cost\n```\n\n# 计算 1 个周期的反向传播\n\
  \n**输入**：神经网络参数 - `dA`、`cache` - forward_cache 和 activation_cache、输入特征、`keep_prob`、输出值\
  \ `Y`\n\n**返回**：梯度\n\n- `dL/dWi = dL/dZi * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev\
  \ = dL/dZl * W`\n\n```python\ndef layerActivationBackward(dA, cache, Y, keep_prob=1,\
  \ activationFunc=\"relu\"):\n    forward_cache, activation_cache = cache\n    A_prev,\
  \ W, b = forward_cache\n    numtraining = float(A_prev.shape[1])\n    if activationFunc\
  \ == \"relu\":\n        dZ = reluDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"sigmoid\":\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif\
  \ activationFunc == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n\
  \    elif activationFunc == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA,\
  \ activation_cache, Y, numtraining)\n    if activationFunc == 'softmax':\n     \
  \   dW = 1/numtraining * np.dot(A_prev, dZ)\n        db = 1/numtraining * np.sum(dZ,\
  \ axis=0, keepdims=True)\n        dA_prev = np.dot(dZ, W)\n    else:\n        dW\
  \ = 1/numtraining * (np.dot(dZ, A_prev.T))\n        db = 1/numtraining * np.sum(dZ,\
  \ axis=1, keepdims=True)\n        dA_prev = np.dot(W.T, dZ)\n    return dA_prev,\
  \ dW, db\n```\n\n# 计算带正则化的 1 个周期的反向传播\n\n**输入**：`dA` - 神经网络参数、`cache` - forward_cache\
  \ 和 activation_cache、输出值 `Y`、`lambd`、`activationFunc`\n\n**返回**：`dA_prev`、`dW`、`db`\n\
  \n**返回**：梯度\n\n- `dL/dWi = dL/dZi * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev =\
  \ dL/dZl * W`\n\n```python\ndef layerActivationBackwardWithReg(dA, cache, Y, lambd,\
  \ activationFunc):\n    forward_cache, activation_cache = cache\n    A_prev, W,\
  \ b = forward_cache\n    numtraining = float(A_prev.shape[1])\n    # print(\"n=\"\
  , numtraining)\n    # print(\"no=\", numtraining)\n    if activationFunc == \"relu\"\
  :\n        dZ = reluDerivative(dA, activation_cache)\n    elif activationFunc ==\
  \ \"sigmoid\":\n        dZ = sigmoidDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"tanh\":\n        dZ = tanhDerivative(dA, activation_cache)\n    elif activationFunc\
  \ == \"softmax\":\n        dZ = stableSoftmaxDerivative(dA, activation_cache, Y,\
  \ numtraining)\n    if activationFunc == 'softmax':\n        # 添加正则化因子\n       \
  \ dW = 1/numtraining * np.dot(A_prev, dZ) + (lambd/numtraining) * W.T\n        db\
  \ = 1/numtraining * np.sum(dZ, axis=0, keepdims=True)\n        dA_prev = np.dot(dZ,\
  \ W)\n    else:\n        # 添加正则化因子\n        dW = 1/numtraining * (np.dot(dZ, A_prev.T))\
  \ + (lambd/numtraining) * W\n        # print(\"dW=\", dW)\n        db = 1/numtraining\
  \ * np.sum(dZ, axis=1, keepdims=True)\n        # print(\"db=\", db)\n        dA_prev\
  \ = np.dot(W.T, dZ)\n    return dA_prev, dW, db\n```\n\n# 计算 1 个周期的反向传播\n\n**输入**：\n\
  - `AL`：L 层网络的输出 - 权重\n- `Y`：真实输出\n- `caches`：包含以下内容的缓存列表：\n  - `dropoutMat`\n  -\
  \ `lambd`\n  - `keep_prob`\n  - 每个带有 \"relu\"/\"tanh\" 的 `layerActivationForward()`\
  \ 的缓存（即 `caches[l]`，l 的范围为 L-1，也就是 l = 0...L-2）\n  - 带有 \"sigmoid\" 的 `layerActivationForward()`\
  \ 的缓存（即 `caches[L-1]`）\n- `hiddenActivationFunc` - 隐藏层的激活函数 - relu/sigmoid/tanh\n\
  - `outputActivationFunc` - 输出层的激活函数 - sigmoid/softmax\n\n**返回**：\n- `gradients`\
  \ -- 一个包含梯度的字典\n  - `gradients[\"dA\" + str(l)] = ...`\n  - `gradients[\"dW\" +\
  \ str(l)] = ...`\n  - `gradients[\"db\" + str(l)] = ...`\n\n```python\ndef backwardPropagationDeep(AL,\
  \ Y, caches, dropoutMat, lambd=0, keep_prob=1, hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\"):\n    # 初始化梯度\n    gradients = {}\n    # 设置层数\n    L = len(caches)\n\
  \    m = float(AL.shape[1])\n    if outputActivationFunc == \"sigmoid\":\n     \
  \   Y = Y.reshape(AL.shape)  # 执行此行后，Y 的形状与 AL 相同\n        # 初始化反向传播\n        #\
  \ dl/dAL = -(y/a + (1-y)/(1-a)) - 在输出层\n        dAL = - (np.divide(Y, AL) - np.divide(1\
  \ - Y, 1 - AL))\n    else:\n        dAL = 0\n        Y = Y.T\n    # 由于这是二分类，输出层的激活函数是\
  \ sigmoid\n    # 获取最后一层的梯度\n    # 输入：\"AL, Y, caches\"。\n```\n\n\n\n\n# 输出：`gradients[\"\
  dAL\"]`、`gradients[\"dWL\"]`、`gradients[\"dbL\"]`\n\n```python\ncurrent_cache =\
  \ caches[L-1]\n\nif lambd == 0:\n    gradients[\"dA\" + str(L)], gradients[\"dW\"\
  \ + str(L)], gradients[\"db\" + str(L)] \\\n        = layerActivationBackward(dAL,\
  \ current_cache,\n                                  Y, activationFunc=outputActivationFunc)\n\
  else:  # 正则化\n    gradients[\"dA\" + str(L)], gradients[\"dW\" + str(L)], gradients[\"\
  db\" + str(L)] \\\n        = layerActivationBackwardWithReg(dAL, current_cache,\n\
  \                                         Y, lambd, activationFunc=outputActivationFunc)\n\
  \n# 注意 softmax 的 dA 是转置\nif outputActivationFunc == \"softmax\":\n    gradients[\"\
  dA\" + str(L)] = gradients[\"dA\" + str(L)].T\n\n# 反向遍历\nfor l in reversed(range(L-1)):\n\
  \    # 计算 L-1 到 1 层的梯度，针对 Relu/tanh\n    # 输入：`gradients[\"dA\" + str(l + 2)]`、`caches`。\n\
  \    # 输出：`gradients[\"dA\" + str(l + 1)]`、`gradients[\"dW\" + str(l + 1)]`、`gradients[\"\
  db\" + str(l + 1)]`\n    current_cache = caches[l]\n\n    # dA_prev_temp, dW_temp,\
  \ db_temp = layerActivationBackward(gradients['dA'+str(l+2)], current_cache, activationFunc=\"\
  relu\")\n\n    if lambd == 0:\n        # 反向传播时使用相同的 dropout 矩阵\n        # 随机失活\n\
  \        # 将 dA'l' 与 dropoutMat 相乘并除以 keep_prob 以保持期望值不变\n        D = dropoutMat[\"\
  D\" + str(l+1)]\n        # 丢弃部分 dAl\n        gradients['dA'+str(l+2)] = np.multiply(gradients['dA'+str(l+2)],\
  \ D)\n        # 除以 keep_prob 以保持期望值不变\n        gradients['dA'+str(l+2)] = np.divide(gradients['dA'+str(l+2)],\
  \ keep_prob)\n        dA_prev_temp, dW_temp, db_temp = \\\n            layerActivationBackward(gradients['dA'+str(l+2)],\
  \ current_cache, Y, keep_prob=1, activationFunc=hiddenActivationFunc)\n    else:\n\
  \        dA_prev_temp, dW_temp, db_temp = \\\n            layerActivationBackwardWithReg(gradients['dA'+str(l+2)],\
  \ current_cache, Y, lambd, activationFunc=hiddenActivationFunc)\n\n    gradients[\"\
  dA\" + str(l + 1)] = dA_prev_temp\n    gradients[\"dW\" + str(l + 1)] = dW_temp\n\
  \    gradients[\"db\" + str(l + 1)] = db_temp\n\nreturn gradients\n```\n\n# 执行梯度下降\n\
  \n**输入：**\n- `parameters`：权重和偏置\n- `gradients`\n- `learningRate`\n- `outputActivationFunc`：输出层激活函数\
  \ - sigmoid/softmax\n\n**输出：** 1 次迭代后更新的权重\n\n```python\ndef gradientDescent(parameters,\
  \ gradients, learningRate, outputActivationFunc=\"sigmoid\"):\n    L = int(len(parameters)\
  \ / 2)\n\n    # 每个参数的更新规则。\n    for l in range(L-1):\n        parameters[\"W\" +\
  \ str(l+1)] = parameters['W'+str(l+1)] - learningRate * \\\n            gradients['dW'\
  \ + str(l+1)]\n        parameters[\"b\" + str(l+1)] = parameters['b'+str(l+1)] -\
  \ learningRate * \\\n            gradients['db' + str(l+1)]\n\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)] -\
  \ learningRate * \\\n            gradients['dW' + str(L)]\n        parameters[\"\
  b\" + str(L)] = parameters['b'+str(L)] - learningRate * \\\n            gradients['db'\
  \ + str(L)]\n    elif outputActivationFunc == \"softmax\":\n        parameters[\"\
  W\" + str(L)] = parameters['W'+str(L)] - learningRate * \\\n            gradients['dW'\
  \ + str(L)].T\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)] - learningRate\
  \ * \\\n            gradients['db' + str(L)].T\n\n    return parameters\n```\n\n\
  # 使用动量法更新参数\n\n**输入：**\n- `parameters`\n- `gradients`\n- `v`\n- `beta`\n- `learningRate`\n\
  - `outputActivationFunc`：softmax/sigmoid\n\n**输出：** 更新后的参数和速度\n\n```python\ndef\
  \ gradientDescentWithMomentum(parameters, gradients, v, beta, learningRate, outputActivationFunc=\"\
  sigmoid\"):\n    L = len(parameters) // 2  # 神经网络中的层数\n\n    # 每个参数的动量更新\n    for\
  \ l in range(L-1):\n        # 计算速度\n        # v['dWk'] = beta * v['dWk'] + (1-beta)\
  \ * dWk\n        v[\"dW\" + str(l+1)] = beta * v[\"dW\" + str(l+1)] + (1-beta) *\
  \ gradients['dW' + str(l+1)]\n        v[\"db\" + str(l+1)] = beta * v[\"db\" + str(l+1)]\
  \ + (1-beta) * gradients['db' + str(l+1)]\n\n        # 使用速度更新参数\n        parameters[\"\
  W\" + str(l+1)] = parameters['W' + str(l+1)] - learningRate * \\\n            v[\"\
  dW\" + str(l+1)]\n        parameters[\"b\" + str(l+1)] = parameters['b' + str(l+1)]\
  \ - learningRate * \\\n            v[\"db\" + str(l+1)]\n\n    if outputActivationFunc\
  \ == \"sigmoid\":\n        v[\"dW\" + str(L)] = beta * v[\"dW\" + str(L)] + (1-beta)\
  \ * gradients['dW' + str(L)]\n        v[\"db\" + str(L)] = beta * v[\"db\" + str(L)]\
  \ + (1-beta) * gradients['db' + str(L)]\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)]\
  \ - learningRate * \\\n            gradients['dW' + str(L)]\n        parameters[\"\
  b\" + str(L)] = parameters['b'+str(L)] - learningRate * \\\n            gradients['db'\
  \ + str(L)]\n    elif outputActivationFunc == \"softmax\":\n        v[\"dW\" + str(L)]\
  \ = beta * v[\"dW\" + str(L)] + (1-beta) * gradients['dW' + str(L)].T\n        v[\"\
  db\" + str(L)] = beta * v[\"db\" + str(L)] + (1-beta) * gradients['db' + str(L)].T\n\
  \        parameters[\"W\" + str(L)] = parameters['W'+str(L)] - learningRate * \\\
  \n            gradients['dW' + str(L)].T\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)]\
  \ - learningRate * \\\n            gradients['db' + str(L)].T\n\n    return parameters,\
  \ v\n```\n\n# 使用 RMSProp 更新参数\n\n**输入：**\n- `parameters`\n- `gradients`\n- `s`\n\
  - `beta1`\n- `learningRate`\n- `outputActivationFunc`：sigmoid/softmax\n\n**输出：**\
  \ 更新后的参数和 RMSProp\n\n```python\ndef gradientDescentWithRMSProp(parameters, gradients,\
  \ s, beta1, epsilon, learningRate, outputActivationFunc=\"sigmoid\"):\n    L = len(parameters)\
  \ // 2  # 神经网络中的层数\n\n    # 每个参数的 RMSProp 更新\n    for l in range(L-1):\n       \
  \ # 计算 RMSProp\n        # s['dWk'] = beta1 * s['dWk'] + (1-beta1) * dWk**2\n   \
  \     s[\"dW\" + str(l+1)] = beta1 * s[\"dW\" + str(l+1)] + (1-beta1) * \\\n   \
  \         np.multiply(gradients['dW' + str(l+1)], gradients['dW' + str(l+1)])\n\
  \        s[\"db\" + str(l+1)] = beta1 * s[\"db\" + str(l+1)] + (1-beta1) * \\\n\
  \            np.multiply(gradients['db' + str(l+1)], gradients['db' + str(l+1)])\n\
  \n        # 使用 RMSProp 更新参数\n        parameters[\"W\" + str(l+1)] = parameters['W'\
  \ + str(l+1)] - \\\n            learningRate * gradients['dW' + str(l+1)] / np.sqrt(s[\"\
  dW\" + str(l+1)] + epsilon)\n        parameters[\"b\" + str(l+1)] = parameters['b'\
  \ + str(l+1)] - \\\n            learningRate * gradients['db' + str(l+1)] / np.sqrt(s[\"\
  db\" + str(l+1)] + epsilon)\n\n    if outputActivationFunc == \"sigmoid\":\n   \
  \     s[\"dW\" + str(L)] = beta1 * s[\"dW\" + str(L)] + (1-beta1) * \\\n       \
  \     np.multiply(gradients['dW' + str(L)], gradients['dW' + str(L)])\n        s[\"\
  db\" + str(L)] = beta1 * s[\"db\" + str(L)] + (1-beta1) * \\\n            np.multiply(gradients['db'\
  \ + str(L)], gradients['db' + str(L)])\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)]\
  \ - \\\n            learningRate * gradients['dW' + str(L)] / np.sqrt(s[\"dW\" +\
  \ str(L)] + epsilon)\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)]\
  \ - \\\n            learningRate * gradients['db' + str(L)] / np.sqrt(s[\"db\" +\
  \ str(L)] + epsilon)\n    elif outputActivationFunc == \"softmax\":\n        s[\"\
  dW\" + str(L)] = beta1 * s[\"dW\" + str(L)] + (1-beta1) * \\\n            np.multiply(gradients['dW'\
  \ + str(L)].T, gradients['dW' + str(L)].T)\n        s[\"db\" + str(L)] = beta1 *\
  \ s[\"db\" + str(L)] + (1-beta1) * \\\n            np.multiply(gradients['db' +\
  \ str(L)].T, gradients['db' + str(L)].T)\n        parameters[\"W\" + str(L)] = parameters['W'+str(L)]\
  \ - \\\n            learningRate * gradients['dW' + str(L)].T / np.sqrt(s[\"dW\"\
  \ + str(L)] + epsilon)\n        parameters[\"b\" + str(L)] = parameters['b'+str(L)]\
  \ - \\\n            learningRate * gradients['db' + str(L)].T / np.sqrt(s[\"db\"\
  \ + str(L)] + epsilon)\n\n    return parameters, s\n```\n\n# 使用 Adam 更新参数\n\n**输入：**\n\
  - `parameters`\n- `gradients`\n- `v`\n- `s`\n- `t`\n- `beta1`\n- `beta2`\n- `epsilon`\n\
  - `learningRate`\n- `outputActivationFunc`：sigmoid/softmax\n\n**输出：** 更新后的参数和 RMSProp\n\
  \n```python\ndef gradientDescentWithAdam(parameters, gradients, v, s, t,\n     \
  \                       beta1=0.9, beta2=0.999, epsilon=1e-8,\n                \
  \            learningRate=0.1, outputActivationFunc=\"sigmoid\"):\n    L = len(parameters)\
  \ // 2\n\n    # 初始化一阶矩估计，Python 字典\n    v_corrected = {}\n\n    # 初始化二阶矩估计，Python\
  \ 字典\n    s_corrected = {}\n\n    # 对前 L-1 层执行 Adam\n    for l in range(L-1):\n\
  \        # 计算动量\n```\n\n\n\n\n\n# Adam 优化器参数更新实现\n\n## 核心更新逻辑（第 l+1 层）\n\n```python\n\
  v[\"dW\" + str(l+1)] = beta1 * v[\"dW\" + str(l+1)] + (1 - beta1) * gradients['dW'\
  \ + str(l+1)]\nv[\"db\" + str(l+1)] = beta1 * v[\"db\" + str(l+1)] + (1 - beta1)\
  \ * gradients['db' + str(l+1)]\n\n# 计算一阶矩的偏差修正估计。\nv_corrected[\"dW\" + str(l+1)]\
  \ = v[\"dW\" + str(l+1)] / (1 - np.power(beta1, t))\nv_corrected[\"db\" + str(l+1)]\
  \ = v[\"db\" + str(l+1)] / (1 - np.power(beta1, t))\n\n# 平方梯度的移动平均，类似 RMSProp\n\
  s[\"dW\" + str(l+1)] = beta2 * s[\"dW\" + str(l+1)] + (1 - beta2) * np.multiply(gradients['dW'\
  \ + str(l+1)], gradients['dW' + str(l+1)])\ns[\"db\" + str(l+1)] = beta2 * s[\"\
  db\" + str(l+1)] + (1 - beta2) * np.multiply(gradients['db' + str(l+1)], gradients['db'\
  \ + str(l+1)])\n\n# 计算二阶原始矩的偏差修正估计。\ns_corrected[\"dW\" + str(l+1)] = s[\"dW\" +\
  \ str(l+1)] / (1 - np.power(beta2, t))\ns_corrected[\"db\" + str(l+1)] = s[\"db\"\
  \ + str(l+1)] / (1 - np.power(beta2, t))\n\n# 更新参数。\nd1 = np.sqrt(s_corrected[\"\
  dW\" + str(l+1)] + epsilon)\nd2 = np.sqrt(s_corrected[\"db\" + str(l+1)] + epsilon)\n\
  \nparameters[\"W\" + str(l+1)] = parameters['W' + str(l+1)] - (learningRate * v_corrected[\"\
  dW\" + str(l+1)] / d1)\nparameters[\"b\" + str(l+1)] = parameters['b' + str(l+1)]\
  \ - (learningRate * v_corrected[\"db\" + str(l+1)] / d2)\n```\n\n## 输出层特殊处理\n\n\
  ### Sigmoid 激活函数\n\n```python\nif outputActivationFunc == \"sigmoid\":\n    # 计算第\
  \ L 层的一阶矩\n    v[\"dW\" + str(L)] = beta1 * v[\"dW\" + str(L)] + (1 - beta1) * gradients['dW'\
  \ + str(L)]\n    v[\"db\" + str(L)] = beta1 * v[\"db\" + str(L)] + (1 - beta1) *\
  \ gradients['db' + str(L)]\n\n    # 计算一阶矩的偏差修正估计。\n    v_corrected[\"dW\" + str(L)]\
  \ = v[\"dW\" + str(L)] / (1 - np.power(beta1, t))\n    v_corrected[\"db\" + str(L)]\
  \ = v[\"db\" + str(L)] / (1 - np.power(beta1, t))\n\n    # 计算第 L 层的二阶矩\n    s[\"\
  dW\" + str(L)] = beta2 * s[\"dW\" + str(L)] + (1 - beta2) * np.multiply(gradients['dW'\
  \ + str(L)], gradients['dW' + str(L)])\n    s[\"db\" + str(L)] = beta2 * s[\"db\"\
  \ + str(L)] + (1 - beta2) * np.multiply(gradients['db' + str(L)], gradients['db'\
  \ + str(L)])\n\n    # 计算二阶原始矩的偏差修正估计。\n    s_corrected[\"dW\" + str(L)] = s[\"dW\"\
  \ + str(L)] / (1 - np.power(beta2, t))\n    s_corrected[\"db\" + str(L)] = s[\"\
  db\" + str(L)] / (1 - np.power(beta2, t))\n\n    # 更新参数。\n    d1 = np.sqrt(s_corrected[\"\
  dW\" + str(L)] + epsilon)\n    d2 = np.sqrt(s_corrected[\"db\" + str(L)] + epsilon)\n\
  \n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - (learningRate * v_corrected[\"\
  dW\" + str(L)] / d1)\n    parameters[\"b\" + str(L)] = parameters['b' + str(L)]\
  \ - (learningRate * v_corrected[\"db\" + str(L)] / d2)\n```\n\n### Softmax 激活函数\n\
  \n```python\nelif outputActivationFunc == \"softmax\":\n    # 计算一阶矩\n    v[\"dW\"\
  \ + str(L)] = beta1 * v[\"dW\" + str(L)] + (1 - beta1) * gradients['dW' + str(L)].T\n\
  \    v[\"db\" + str(L)] = beta1 * v[\"db\" + str(L)] + (1 - beta1) * gradients['db'\
  \ + str(L)].T\n\n    # 计算一阶矩的偏差修正估计。\n    v_corrected[\"dW\" + str(L)] = v[\"dW\"\
  \ + str(L)] / (1 - np.power(beta1, t))\n    v_corrected[\"db\" + str(L)] = v[\"\
  db\" + str(L)] / (1 - np.power(beta1, t))\n\n    # 计算二阶矩\n    s[\"dW\" + str(L)]\
  \ = beta2 * s[\"dW\" + str(L)] + (1 - beta2) * np.multiply(gradients['dW' + str(L)].T,\
  \ gradients['dW' + str(L)].T)\n    s[\"db\" + str(L)] = beta2 * s[\"db\" + str(L)]\
  \ + (1 - beta2) * np.multiply(gradients['db' + str(L)].T, gradients['db' + str(L)].T)\n\
  \n    # 计算二阶原始矩的偏差修正估计。\n    s_corrected[\"dW\" + str(L)] = s[\"dW\" + str(L)] /\
  \ (1 - np.power(beta2, t))\n    s_corrected[\"db\" + str(L)] = s[\"db\" + str(L)]\
  \ / (1 - np.power(beta2, t))\n\n    # 更新参数。\n    d1 = np.sqrt(s_corrected[\"dW\"\
  \ + str(L)] + epsilon)\n    d2 = np.sqrt(s_corrected[\"db\" + str(L)] + epsilon)\n\
  \n    parameters[\"W\" + str(L)] = parameters['W' + str(L)] - (learningRate * v_corrected[\"\
  dW\" + str(L)] / d1)\n    parameters[\"b\" + str(L)] = parameters['b' + str(L)]\
  \ - (learningRate * v_corrected[\"db\" + str(L)] / d2)\n\nreturn parameters, v,\
  \ s\n```\n\n# L 层深度学习模型执行\n\n## `L_Layer_DeepModel` 函数\n\n**功能**：执行 L 层深度学习模型（批量梯度下降）\n\
  \n**参数**：\n- `X1`：输入特征\n- `Y1`：输出标签\n- `layersDimensions`：各层维度\n- `hiddenActivationFunc`：隐藏层激活函数（`relu`/`tanh`/`sigmoid`）\n\
