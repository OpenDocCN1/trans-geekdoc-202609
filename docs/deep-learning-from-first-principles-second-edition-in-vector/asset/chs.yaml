  \n因为 `dE/da_o = -(t - a_o)`\n\n现在考虑 (B) 中的第 2 项：\n\n`da_o/dz_o = a_o(1 - a_o)`\n\
  \n使用结果 (A)：\n\n`dE/dw_o = dE/da_o * da_o/dz_o * dz_o/dw_o`\n\n(B) 中的第 3 项：\n\n`dz_o/dw_o\
  \ = a_h`\n\n![Image 447](img/index-352_1.jpg)\n\n![Image 448](img/index-352_2.jpg)\n\
  \n![Image 449](img/index-352_3.jpg)\n\n\n\n# 3) 隐藏层\n\n计算出梯度后，我们现在通过计算新权重来执行梯度下降，假设一个学习率。如果我们对输出层执行此操作，将获得更新后的权重。\n\
  \n我们现在计算总误差随权重 $w_{ij}$ 的变化而变化的情况 – (C)\n\n利用链式法则，我们得到 – (D)\n\n考虑 (C) 中的第 1 项：\n\
  \n现在我们有了 – (E) 和 – (F)，从而得到以下结果：\n\n将 (D)、(E) 和 (F) 结合起来，我们得到：\n\n这可以表示为：\n\n利用这个导数，计算出\
  \ $w_{ij}$ 的新值。\n\n因此有 2 个重要结果：\n- **在输出层我们有：** $\\frac{\\partial E}{\\partial w_{ij}}\
  \ = \\delta_j \\cdot o_i$\n- **在每个隐藏层我们计算：** $\\frac{\\partial E}{\\partial w_{ij}}\
  \ = \\delta_j \\cdot o_i$（其中 $\\delta$ 是反向传播的）\n\n反向传播在早期非常成功，但该算法确实存在一些问题，例如“梯度消失”和“梯度爆炸”问题。然而，它是神经网络的一项关键发展，反向传播梯度的问题已通过动量法和自适应学习率等技术得到解决。\n\
  \n在本文中，我推导了输出层和隐藏层的权重。正如我上面提到的，我打算在未来几天内用 Octave、R 和 Python 实现反向传播算法的向量化版本。\n\n\
  ---\n\n## 2. 附录 1 – 作为神经网络的逻辑回归\n\n### 1.1 Python 函数\n\n```python\n##############################################################################################\n\
  #\n# Created by: Tinniam V Ganesh\n# Date : 4 Jan 2018\n# File: DLfunctions1.py\n\
  #\n##############################################################################################\n\
  \nimport numpy as np\nimport pandas as pd\nimport os\nimport matplotlib.pyplot as\
  \ plt\nfrom sklearn.model_selection import train_test_split\n\n# 定义 sigmoid 函数\n\
  def sigmoid(z):\n    a = 1 / (1 + np.exp(-z))\n    return a\n\n# 初始化权重和偏置\ndef initialize(dim):\n\
  \    w = np.zeros(dim).reshape(dim, 1)\n    b = 0\n    return w\n\n# 计算损失\n# 输入：numTraining,\
  \ Y, A\n# 输出：loss\ndef computeLoss(numTraining, Y, A):\n    loss = -1/numTraining\
  \ * np.sum(Y * np.log(A) + (1-Y) * (np.log(1-A)))\n    return loss\n\n# 执行前向传播\n\
  # 输入：w, b, X, Y\n# 输出：gradients, loss (字典)\ndef forwardPropagation(w, b, X, Y):\n\
  \    # 计算 Z\n    Z = np.dot(w.T, X) + b\n\n    # 确定训练样本数量\n    numTraining = float(len(X))\n\
  \n    # 计算 sigmoid 激活函数的输出\n    A = sigmoid(Z)\n\n    # 计算损失\n    loss = computeLoss(numTraining,\
  \ Y, A)\n\n    # 计算梯度 dZ, dw 和 db\n    dZ = A - Y\n    dw = 1/numTraining * np.dot(X,\
  \ dZ.T)\n    db = 1/numTraining * np.sum(dZ)\n\n    # 以字典形式返回结果\n    gradients =\
  \ {\"dw\": dw, \"db\": db}\n    loss = np.squeeze(loss)\n    return gradients, loss\n\
  \n# 计算梯度下降\n# 输入：w, b, X, Y, numIterations, learningRate\n# 输出：params, grads, losses,\
  \ idx\ndef gradientDescent(w, b, X, Y, numIterations, learningRate):\n    losses\
  \ = []\n    idx = []\n\n    # 迭代\n    for i in range(numIterations):\n        gradients,\
  \ loss = forwardPropagation(w, b, X, Y)\n\n        # 获取导数\n        dw = gradients[\"\
  dw\"]\n        db = gradients[\"db\"]\n\n        w = w - learningRate * dw\n   \
  \     b = b - learningRate * db\n\n        # 存储损失\n        if i % 100 == 0:\n  \
  \          idx.append(i)\n            losses.append(loss)\n\n    # 设置参数和梯度\n   \
  \ params = {\"w\": w, \"b\": b}\n    grads = {\"dw\": dw, \"db\": db}\n    return\
  \ params, grads, losses, idx\n\n# 预测训练集的输出\n# 输入：w, b, X\n# 输出：yPredicted\ndef predict(w,\
  \ b, X):\n    size = X.shape[1]\n    yPredicted = np.zeros((1, size))\n    Z = np.dot(w.T,\
  \ X)\n\n    # 计算 sigmoid\n    A = sigmoid(Z)\n\n    for i in range(A.shape[1]):\n\
  \        # 如果值 > 0.5 则设为 1\n        if A[0][i] > 0.5:\n            yPredicted[0][i]\
  \ = 1\n        else:\n            # 否则设为 0\n            yPredicted[0][i] = 0\n \
  \   return yPredicted\n\n# 归一化数据\n# 输入：x\n# 输出：x (归一化后)\ndef normalize(x):\n   \
  \ x_norm = None\n    x_norm = np.linalg.norm(x, axis=1, keepdims=True)\n    x =\
  \ x / x_norm\n    return x\n```\n\n### 1.2 R\n\n```r\n##################################################################################\n\
  #\n# Created by: Tinniam V Ganesh\n# Date : 4 Jan 2018\n# File: DLfunctions1.R\n\
  #\n##################################################################################\n\
  \nsource(\"RFunctions-1.R\")\n\n# 定义 sigmoid 函数\nsigmoid <- function(z) {\n  a <-\
  \ 1 / (1 + exp(-z))\n  a\n}\n\n# 计算损失\n# 输入：numTraining, Y, A\n# 输出：loss\ncomputeLoss\
  \ <- function(numTraining, Y, A) {\n  loss <- -1/numTraining * sum(Y * log(A) +\
  \ (1-Y) * log(1-A))\n  return(loss)\n}\n\n# 计算前向传播\n# 输入：w, b, X, Y\n# 输出：fwdProp\
  \ (列表)\nforwardPropagation <- function(w, b, X, Y) {\n  # 计算 Z\n  Z <- t(w) %*%\
  \ X + b\n\n  # 设置样本数量\n  numTraining <- ncol(X)\n\n  # 计算激活函数\n  A <- sigmoid(Z)\n\
  \n  # 计算损失\n  loss <- computeLoss(numTraining, Y, A)\n\n  # 计算梯度 dZ, dw 和 db\n \
  \ dZ <- A - Y\n  dw <- 1/numTraining * X %*% t(dZ)\n  db <- 1/numTraining * sum(dZ)\n\
  \n  fwdProp <- list(\"loss\" = loss, \"dw\" = dw, \"db\" = db)\n  return(fwdProp)\n\
  }\n\n# 执行一个梯度下降周期\n# 计算梯度下降\n# 输入：w, b, X, Y, numIterations, learningRate\n# 输出：gradDescnt\
  \ (列表)\ngradientDescent <- function(w, b, X, Y, numIterations, learningRate) {\n\
  \  losses <- NULL\n  idx <- NULL\n\n  # 循环迭代次数\n  for(i in 1:numIterations) {\n\
  \    fwdProp <- forwardPropagation(w, b, X, Y)\n\n    # 获取导数\n    dw <- fwdProp$dw\n\
  \    db <- fwdProp$db\n\n    # 执行梯度下降\n    w <- w - learningRate * dw\n    b <-\
  \ b - learningRate * db\n\n    l <- fwdProp$loss\n\n    # 存储损失\n    if(i %% 100\
  \ == 0) {\n      idx <- c(idx, i)\n      losses <- c(losses, l)\n    }\n  }\n\n\
  \  # 返回权重和损失\n  gradDescnt <- list(\"w\" = w, \"b\" = b, \"dw\" = dw, \"db\" = db,\
  \ \"losses\" = losses, \"idx\" = idx)\n  return(gradDescnt)\n}\n\n# 计算输入的预测值\n#\
  \ 预测训练集的输出\n# 输入：w, b, X\n# 输出：yPredicted\npredict <- function(w, b, X) {\n  m <-\
  \ dim(X)[2]\n\n  # 创建一个全 0 向量\n  yPredicted <- matrix(rep(0, m), nrow = 1, ncol\
  \ = m)\n\n  Z <- t(w) %*% X + b\n\n  # 计算 sigmoid\n  A <- sigmoid(Z)\n\n  for(i\
  \ in 1:dim(A)[2]) {\n    # 如果 A > 0.5 设值为 1\n    if(A[1, i] > 0.5)\n      yPredicted[1,\
  \ i] <- 1\n    else\n      # 否则设为 0\n      yPredicted[1, i] <- 0\n  }\n  return(yPredicted)\n\
  }\n\n# 归一化矩阵\n# 输入：x\n# 输出：normalized\nnormalize <- function(x) {\n  # 创建矩阵的范数。执行矩阵的\
  \ Frobenius 范数\n  n <- as.matrix(sqrt(rowSums(x²)))\n\n  # 按行按范数扫描。注意函数中的 '1' 表示对每一行执行操作\n\
  \  normalized <- sweep(x, 1, n, FUN = \"/\")\n  return(normalized)\n}\n```\n\n###\
  \ 1.3 Octave\n\n```octave\n##############################################################################################\n\
