  \ R\n\n```r\n############################################################################################################\n\
  #\n# File : DLfunctions33.R\n# Author : Tinniam V Ganesh\n# Date : 30 Jan 2018\n\
  #\n##########################################################################################################\n\
  \nlibrary(ggplot2)\nlibrary(PRROC)\nlibrary(dplyr)\n\n# 计算向量的 Sigmoid\nsigmoid <-\
  \ function(Z) {\n    A <- 1 / (1 + exp(-Z))\n    cache <- Z\n    retvals <- list(\"\
  A\" = A, \"Z\" = Z)\n    return(retvals)\n}\n\n# 计算向量的 Relu\nrelu <- function(Z)\
  \ {\n    A <- apply(Z, 1:2, function(x) max(0, x))\n    cache <- Z\n    retvals\
  \ <- list(\"A\" = A, \"Z\" = Z)\n    return(retvals)\n}\n\n# 计算向量的 tanh 激活\ntanhActivation\
  \ <- function(Z) {\n    A <- tanh(Z)\n    cache <- Z\n    retvals <- list(\"A\"\
  \ = A, \"Z\" = Z)\n    return(retvals)\n}\n\n# 计算 Relu 的导数\n# g'(z) = 1 if z >0\
  \ and 0 otherwise\nreluDerivative <- function(dA, cache) {\n    Z <- cache\n   \
  \ dZ <- dA\n    # 创建一个值 > 0 的逻辑矩阵\n    a <- Z > 0\n    # 当 z <= 0 时，也应将 dz 设为 0。执行逐元素乘法\n\
  \    dZ <- dZ * a\n    return(dZ)\n}\n\n# 计算 Sigmoid 的导数\n# 导数 g'(z) = a * (1-a)\n\
  sigmoidDerivative <- function(dA, cache) {\n    Z <- cache\n    s <- 1 / (1 + exp(-Z))\n\
  \    dZ <- dA * s * (1 - s)\n    return(dZ)\n}\n\n# 计算 tanh 的导数\n# 导数 g'(z) = 1\
  \ - a²\ntanhDerivative <- function(dA, cache) {\n    Z = cache\n    a = tanh(Z)\n\
  \    dZ = dA * (1 - a²)\n    return(dZ)\n}\n\n# 初始化 L 层模型\n# 输入：每层单元数列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  initializeDeepModel <- function(layerDimensions) {\n    set.seed(2)\n    # 初始化空列表\n\
  \    layerParams <- list()\n    # 注意第 'l' 层的权重矩阵是大小为 (l,l-1) 的矩阵\n    # 偏置是大小为 (l,1)\
  \ 的向量\n    # 从 1 循环到 L\n    # R 中索引从 1 开始\n    for(l in 2:length(layersDimensions))\
  \ {\n        # 初始化一个大小为 l x l-1 的小随机数矩阵\n        # 创建大小为 l x l-1 的随机数\n        w\
  \ = rnorm(layersDimensions[l] * layersDimensions[l-1]) * 0.01\n        # 用这些初始权重创建一个大小为\
  \ l x l-1 的权重矩阵并\n        # 添加到列表 W1,W2... WL\n        layerParams[[paste('W', l-1,\
  \ sep=\"\")]] = matrix(w, nrow=layersDimensions[l], ncol=layersDimensions[l-1])\n\
  \        layerParams[[paste('b', l-1, sep=\"\")]] = matrix(rep(0, layersDimensions[l]),\
  \ nrow=layersDimensions[l], ncol=1)\n    }\n    return(layerParams)\n}\n\n# 计算深度网络前向传播中第\
  \ 'l' 层的激活值\n# 输入：A_prec - 上一层的激活值\n# W,b - 权重和偏置矩阵及向量\n```\n\n\n\n\n\n# activationFunc\
  \ - 激活函数 - sigmoid、tanh、relu 等\n\n# 返回值(list) ：该层的激活值\n\n# ：\n\n# Z = W * X + b\n\
  \n# A = sigmoid(Z), A= Relu(Z), A= tanh(Z)\n\n```\nlayerActivationForward <- function(A_prev,\
  \ W, b, activationFunc){\n\n# 计算 Z\nz = W %*% A_prev\n\n# 按列广播偏置 'b'\nZ <- sweep(z,\
  \ 1, b, '+')\n\nforward_cache <- list(\"A_prev\"=A_prev, \"W\"=W, \"b\"=b)\n\n#\
  \ 计算 sigmoid 的激活值\nif(activationFunc == \"sigmoid\"){\n  vals = sigmoid(Z)\n} else\
  \ if (activationFunc == \"relu\"){ # 计算 relu 的激活值\n  vals = relu(Z)\n} else if(activationFunc\
  \ == 'tanh'){ # 计算 tanh 的激活值\n  vals = tanhActivation(Z)\n}\n\n# 创建前向缓存和激活缓存的列表\n\
  cache <- list(\"forward_cache\"=forward_cache, \"activation_cache\"=vals[['Z']])\n\
  retvals <- list(\"A\"=vals[['A']], \"cache\"=cache)\nreturn(retvals)\n}\n```\n\n\
  # 计算第 1..L 层的前向传播\n\n# 输入 ：X - 输入特征\n\n# 参数：权重和偏置\n\n# 返回值 (list) ：AL\n\n# 缓存\n\n\
  # 前向传播在第 1..L-1 层使用 Relu/tanh 激活函数，在第 L 层使用 sigmoid 激活函数\n\n```\nforwardPropagationDeep\
  \ <- function(X,\n                                   parameters,\n             \
  \                      hiddenActivationFunc='relu'){\n\n  caches <- list()\n\n \
  \ # 将 A 设为 X (A0)\n  A <- X\n\n  L <- length(parameters)/2 # 神经网络中的层数\n\n  # 从第\
  \ 1 层循环到第 L-1 层\n  for(l in 1:(L-1)){\n    A_prev <- A\n\n    # Zi = Wi x Ai-1 +\
  \ bi 和 Ai = g(Zi)\n    # 设置第 'l' 层的 W 和 b\n    # 从 W1,W2... WL-1 循环遍历\n    W <-\
  \ parameters[[paste(\"W\", l, sep=\"\")]]\n    b <- parameters[[paste(\"b\", l,\
  \ sep=\"\")]]\n\n    # 使用激活函数计算第 'l' 层的前向传播\n    actForward <- layerActivationForward(A_prev,\
  \ W, b, activationFunc = hiddenActivationFunc)\n    A <- actForward[['A']]\n\n \
  \   # 追加缓存 A_prev,W,b, Z\n    caches[[l]] <- actForward\n  }\n\n  # 由于这是二分类，在最后一层使用\
  \ sigmoid 激活函数\n  # 设置最后一层的权重和偏置\n  W <- parameters[[paste(\"W\", L, sep=\"\")]]\n\
  \  b <- parameters[[paste(\"b\", L, sep=\"\")]]\n\n  # 计算 sigmoid 激活值\n  actForward\
  \ = layerActivationForward(A, W, b, activationFunc = \"sigmoid\")\n  AL <- actForward[['A']]\n\
  \n  # 追加最后一层前向传播的输出\n  caches[[L]] <- actForward\n\n  # 创建最终输出和缓存的列表\n  fwdPropDeep\
  \ <- list(\"AL\"=AL, \"caches\"=caches)\n  return(fwdPropDeep)\n}\n```\n\n# 计算代价\n\
  \n# 输入 ：最后一层的激活值\n\n# ：来自数据的输出\n\n# 输出：代价\n\n```\ncomputeCost <- function(AL, Y){\n\
  \n  # 对数概率的逐元素相乘\n  m = length(Y)\n  cost = -1/m * sum(Y * log(AL) + (1-Y) * log(1-AL))\n\
  \  # cost = -1/m * sum(a+b)\n  return(cost)\n}\n```\n\n# 计算通过某层的反向传播\n\n# 输入 ：神经网络参数\
  \ - dA\n\n# # cache - forward_cache 与 activation_cache\n\n# # 输入特征\n\n# # 输出值 Y\n\
  \n# 返回：梯度列表\n\n# dL/dWi = dL/dZi * Al-1\n\n# dl/dbl = dL/dZl\n\n# dL/dZ_prev = dL/dZl\
  \ * W\n\n```\nlayerActivationBackward <- function(dA, cache, activationFunc){\n\n\
  \  # 获取 A_prev, W, b\n  forward_cache <- cache[['forward_cache']]\n\n  # 获取 Z\n\
  \  activation_cache <- cache[['activation_cache']]\n\n  if(activationFunc == \"\
  relu\"){\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if(activationFunc\
  \ == \"sigmoid\"){\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if(activationFunc == \"tanh\"){\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  }\n\n  A_prev <- forward_cache[['A_prev']]\n  W <- forward_cache[['W']]\n  b\
  \ <- forward_cache[['b']]\n\n  numtraining = dim(A_prev)[2]\n  dW = 1/numtraining\
  \ * dZ %*% t(A_prev)\n  db = 1/numtraining * rowSums(dZ)\n  dA_prev = t(W) %*% dZ\n\
  \n  retvals <- list(\"dA_Prev\"=dA_prev, \"dW\"=dW, \"db\"=db)\n  return(retvals)\n\
  }\n```\n\n# 计算通过所有层的 1 个周期的反向传播\n\n# 输入 ：AL: L 层网络的输出 - 权重\n\n# # Y 真实输出\n\n# #\
  \ caches -- 包含以下内容的缓存列表：\n\n# 每个 `layerActivationForward()` 的缓存，带有 \"relu\"/\"tanh\"\
  \n\n# #(即 `caches[l]`, l 的范围为 L-1，即 l = 0...L-2)\n\n# #`layerActivationForward()`\
  \ 的缓存，带有 \"sigmoid\" (即 `caches[L-1]`)\n\n# hiddenActivationFunc - 隐藏层的激活函数\n\n\
  #\n\n# 返回：\n\n# gradients -- 包含梯度的列表\n\n# gradients[\"dA\" + str(l)] = ...\n\n#\n\
  \n```\nbackwardPropagationDeep <- function(AL, Y,\n                            \
  \        caches,\n                                    hiddenActivationFunc='relu'){\n\
  \n  # 初始化梯度\n  gradients = list()\n\n  # 设置层数\n  L = length(caches)\n  numTraining\
  \ = dim(AL)[2]\n\n  # 初始化反向传播\n  # dl/dAL = -(y/a) - ((1-y)/(1-a)) - 在输出层\n  dAL\
  \ = -( (Y/AL) - (1 - Y)/(1 - AL))\n\n  # 由于这是二分类，输出层的激活函数为 sigmoid\n  # 获取最后一层的梯度\n\
  \  # 输入: \"AL, Y, caches\"。\n  # 输出: \"gradients[\"dAL\"]\", gradients[\"dWL\"]\"\
  , gradients[\"dbL\"]\"\n  # 从第 L 层开始\n  # 获取当前缓存\n  current_cache = caches[[L]]$cache\n\
  \n  # gradients[\"dA\" + str(L)], gradients[\"dW\" + str(L)], gradients[\"db\" +\
  \ str(L)] =\n  layerActivationBackward(dAL, current_cache, activationFunc = \"sigmoid\"\
  )\n  retvals <- layerActivationBackward(dAL, current_cache, activationFunc = \"\
  sigmoid\")\n\n  # 创建梯度列表\n  gradients[[paste(\"dA\", L, sep=\"\")]] <- retvals[['dA_Prev']]\n\
  \  gradients[[paste(\"dW\", L, sep=\"\")]] <- retvals[['dW']]\n  gradients[[paste(\"\
  db\", L, sep=\"\")]] <- retvals[['db']]\n\n  # 反向遍历\n  for(l in (L-1):1){\n    #\
  \ 计算 L-1 到 1 层的梯度 (Relu/tanh)\n    # 输入: \"gradients[\"dA\" + str(l + 2)]\", caches\"\
  。\n    # 输出: \"gradients[\"dA\" + str(l + 1)]\" , gradients[\"dW\" + str(l + 1)]\"\
  \ , gradients[\"db\" + str(l + 1)]\"\n    current_cache = caches[[l]]$cache\n  \
  \  retvals = layerActivationBackward(gradients[[paste('dA', l+1, sep=\"\")]], current_cache,\n\
  \                                      activationFunc = hiddenActivationFunc)\n\
  \    gradients[[paste(\"dA\", l, sep=\"\")]] <- retvals[['dA_Prev']]\n    gradients[[paste(\"\
  dW\", l, sep=\"\")]] <- retvals[['dW']]\n    gradients[[paste(\"db\", l, sep=\"\"\
  )]] <- retvals[['db']]\n  }\n  return(gradients)\n}\n```\n\n# 执行梯度下降\n\n# 输入 ：权重和偏置\n\
  \n# ：梯度\n\n# ：学习率\n\n# 输出：1 次迭代后更新的权重列表\n\n```\ngradientDescent <- function(parameters,\
  \ gradients, learningRate){\n\n  L = length(parameters)/2 # 神经网络中的层数\n\n  # 每个参数的更新规则。使用\
  \ for 循环。\n  for(l in 1:L){\n    parameters[[paste(\"W\", l, sep=\"\")]] = parameters[[paste(\"\
  W\", l, sep=\"\")]] -\n      learningRate * gradients[[paste(\"dW\", l, sep=\"\"\
  )]]\n    parameters[[paste(\"b\", l, sep=\"\")]] = parameters[[paste(\"b\", l, sep=\"\
  \")]] -\n      learningRate * gradients[[paste(\"db\", l, sep=\"\")]]\n  }\n  return(parameters)\n\
  }\n```\n\n# 执行 L 层深度学习模型\n\n# 输入 ：X - 输入特征\n\n# ：Y 输出\n\n# ：layersDimensions - 层维度\n\
  \n# ：hiddenActivationFunc - 隐藏层激活函数 relu /tanh\n\n# ：学习率\n\n# ：迭代次数\n\n# 输出：更新后的权重和偏置\n\
  \n```\nL_Layer_DeepModel <- function(X, Y, layersDimensions,\n                 \
  \             hiddenActivationFunc='relu',\n                              learningRate\
  \ = .3,\n                              numIterations = 10000, print_cost=FALSE){\n\
  \n  # 初始化代价向量为 NULL\n  costs <- NULL\n\n  # 参数初始化。\n  parameters = initializeDeepModel(layersDimensions)\n\
  \n  # 循环 (梯度下降)\n  for(i in 0:numIterations){\n    # 前向传播: [LINEAR -> RELU]*(L-1)\
  \ -> LINEAR -> SIGMOID.\n    retvals = forwardPropagationDeep(X, parameters, hiddenActivationFunc)\n\
  \    AL <- retvals[['AL']]\n    caches <- retvals[['caches']]\n\n    # 计算代价。\n \
  \   cost <- computeCost(AL, Y)\n\n    # 反向传播。\n    gradients = backwardPropagationDeep(AL,\
  \ Y, caches, hiddenActivationFunc)\n\n    # 更新参数。\n    parameters = gradientDescent(parameters,\
  \ gradients, learningRate)\n    if(i %% 1000 == 0){\n      costs = c(costs, cost)\n\
  \      print(cost)\n    }\n  }\n  retvals <- list(\"parameters\"=parameters, \"\
  costs\"=costs)\n  return(retvals)\n}\n```\n\n\n\n\n# 给定输入预测输出\n\n## 输入 : parameters\n\
  \n## : X\n\n## 输出: predictions\n\n```r\npredict <- function(parameters, X, hiddenActivationFunc='relu'){\n\
  \  fwdProp <- forwardPropagationDeep(X, parameters, hiddenActivationFunc)\n  predictions\
  \ <- fwdProp$AL > 0.5\n  return (predictions)\n}\n```\n\n# 绘制决策边界\n\n## 此函数使用 ggplot2\n\
  \n```r\nplotDecisionBoundary <- function(z, retvals, hiddenActivationFunc, lr){\n\
  \  # 找到数据的最小值和最大值\n  xmin <- min(z[,1])\n  xmax <- max(z[,1])\n  ymin <- min(z[,2])\n\
  \  ymax <- max(z[,2])\n  \n  # 创建一个值的网格\n  a = seq(xmin, xmax, length=100)\n  b\
  \ = seq(ymin, ymax, length=100)\n  grid <- expand.grid(x=a, y=b)\n  colnames(grid)\
  \ <- c('x1', 'x2')\n  grid1 <- t(grid)\n  \n  # 预测该网格的输出\n  q <- predict(retvals$parameters,\
  \ grid1, hiddenActivationFunc)\n  q1 <- t(data.frame(q))\n  q2 <- as.numeric(q1)\n\
  \  grid2 <- cbind(grid, q2)\n  colnames(grid2) <- c('x1', 'x2', 'q2')\n  \n  z1\
  \ <- data.frame(z)\n  names(z1) <- c(\"x1\", \"x2\", \"y\")\n  atitle = paste(\"\
  Decision boundary for learning rate:\", lr)\n  \n  # 绘制边界的等高线\n  ggplot(z1) +\n\
  \    geom_point(data = z1, aes(x = x1, y = x2, color = y)) +\n    stat_contour(data\
  \ = grid2, aes(x = x1, y = x2, z = q2, color=q2), alpha = 0.9) +\n    ggtitle(atitle)\n\
  }\n```\n\n# 给定数据集预测概率得分\n\n## 输入 : parameters\n\n## : X\n\n## 输出: 输出的概率\n\n```r\n\
  computeScores <- function(parameters, X, hiddenActivationFunc='relu'){\n  fwdProp\
