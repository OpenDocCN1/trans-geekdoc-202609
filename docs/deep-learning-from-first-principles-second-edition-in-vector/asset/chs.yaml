  \n1;\n\n# Define sigmoid function\n# 定义 sigmoid 函数\n\n```octave\nfunction [A,cache]\
  \ = sigmoid(Z)\n\nA = 1 ./ (1+ exp(-Z));\n\ncache=Z;\n\nend\n```\n\n# Define Relu\
  \ function\n# 定义 Relu 函数\n\n```octave\nfunction [A,cache] = relu(Z)\n\nA = max(0,Z);\n\
  \ncache=Z;\n\nend\n```\n\n# Define Relu function\n# 定义 Relu 函数\n\n```octave\nfunction\
  \ [A,cache] = tanhAct(Z)\n\nA = tanh(Z);\n\ncache=Z;\n\nend\n```\n\n# Define Softmax\
  \ function\n# 定义 Softmax 函数\n\n```octave\nfunction [A,cache] = softmax(Z)\n\n# get\
  \ unnormalized probabilities\n# 获取未归一化的概率\n\nexp_scores = exp(Z');\n\n# normalize\
  \ them for each example\n# 为每个样本进行归一化\n\nA = exp_scores ./ sum(exp_scores,2);\n\n\
  cache=Z;\n\nend\n```\n\n# Define Stable Softmax function\n# 定义稳定 Softmax 函数\n\n\
  ```octave\nfunction [A,cache] = stableSoftmax(Z)\n\n# Normalize by max value in\
  \ each row\n# 按每行的最大值进行归一化\n\nshiftZ = Z' - max(Z',[],2);\n\nexp_scores = exp(shiftZ);\n\
  \n# normalize them for each example\n# 为每个样本进行归一化\n\nA = exp_scores ./ sum(exp_scores,2);\n\
  \n#disp(\"sm\")\n\n#disp(A);\n\ncache=Z;\n\nend\n```\n\n# Define Relu Derivative\n\
  # 定义 Relu 导数\n\n```octave\nfunction [dZ] = reluDerivative(dA,cache)\n\nZ = cache;\n\
  \ndZ = dA;\n\n# Get elements that are greater than 0\n# 获取大于 0 的元素\n\na = (Z > 0);\n\
  \n# Select only those elements where Z > 0\n# 仅选择 Z > 0 的那些元素\n\ndZ = dZ .* a;\n\
  \nend\n```\n\n# Define Sigmoid Derivative\n# 定义 Sigmoid 导数\n\n```octave\nfunction\
  \ [dZ] = sigmoidDerivative(dA,cache)\n\nZ = cache;\n\ns = 1 ./ (1+ exp(-Z));\n\n\
  dZ = dA .* s .* (1-s);\n\nend\n```\n\n# Define Tanh Derivative\n# 定义 Tanh 导数\n\n\
  ```octave\nfunction [dZ] = tanhDerivative(dA,cache)\n\nZ = cache;\n\na = tanh(Z);\n\
  \ndZ = dA .* (1 - a .^ 2);\n\nend\n```\n\n# Populate a matrix with 1s in rows where\
  \ Y=1\n# 在 Y=1 的行中用 1 填充矩阵\n\n# This function may need to be modified if K is not\
  \ 3, 10\n# 如果 K 不是 3 或 10，可能需要修改此函数\n\n# This function is used in computing the\
  \ softmax derivative\n# 此函数用于计算 softmax 导数\n\n```octave\nfunction [Y1] = popMatrix(Y,numClasses)\n\
  \nY1=zeros(length(Y),numClasses);\n\nif(numClasses==3) # For 3 output classes\n\
  # 适用于 3 个输出类别\n\nY1(Y==0,1)=1;\n\nY1(Y==1,2)=1;\n\nY1(Y==2,3)=1;\n\nelseif(numClasses==10)\
  \ # For 10 output classes\n# 适用于 10 个输出类别\n\nY1(Y==0,1)=1;\n\nY1(Y==1,2)=1;\n\n\
  Y1(Y==2,3)=1;\n\nY1(Y==3,4)=1;\n\nY1(Y==4,5)=1;\n\nY1(Y==5,6)=1;\n\nY1(Y==6,7)=1;\n\
  \nY1(Y==7,8)=1;\n\nY1(Y==8,9)=1;\n\nY1(Y==9,10)=1;\n\nendif\n\nend\n```\n\n# Define\
  \ Softmax Derivative\n# 定义 Softmax 导数\n\n```octave\nfunction [dZ] = softmaxDerivative(dA,cache,Y,\
  \ numClasses)\n\nZ = cache;\n\n# get unnormalized probabilities\n# 获取未归一化的概率\n\n\
  shiftZ = Z' - max(Z',[],2);\n\nexp_scores = exp(shiftZ);\n\n# normalize them for\
  \ each example\n# 为每个样本进行归一化\n\nprobs = exp_scores ./ sum(exp_scores,2);\n\n# dZ\
  \ = pi- yi\n\nyi=popMatrix(Y,numClasses);\n\ndZ=probs-yi;\n\nend\n```\n\n# Define\
  \ Stable Softmax Derivative\n# 定义稳定 Softmax 导数\n\n```octave\nfunction [dZ] = stableSoftmaxDerivative(dA,cache,Y,\
  \ numClasses) Z = cache;\n\n # get unnormalized probabilities\n # 获取未归一化的概率\n\n\
  exp_scores = exp(Z');\n\n# normalize them for each example\n# 为每个样本进行归一化\n\nprobs\
  \ = exp_scores ./ sum(exp_scores,2);\n\n# dZ = pi- yi\n\nyi=popMatrix(Y,numClasses);\n\
  \ndZ=probs-yi;\n\nend\n```\n\n# Initialize model for L layers\n# 为 L 层初始化模型\n\n\
  # Input : List of units in each layer\n# 输入：每层单元数列表\n\n# Returns: Initial weights\
  \ and biases matrices for all layers\n# 返回：所有层的初始权重和偏置矩阵\n\n```octave\nfunction\
  \ [W b] = initializeDeepModel(layerDimensions)\n\nrand (\"seed\", 3);\n\n# note\
  \ the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n# 注意第 'l' 层的权重矩阵大小为\
  \ (l,l-1)\n\n# The Bias is a vectors of size (l,1)\n# 偏置是大小为 (l,1) 的向量\n\n# Loop\
  \ through the layer dimension from 1.. L\n# 遍历层维度 1..L\n\n# Create cell arrays for\
  \ Weights and biases\n# 为权重和偏置创建元胞数组\n\nfor l =2:size(layerDimensions)(2)\n\nW{l-1}\
  \ = rand(layerDimensions(l),layerDimensions(l-1))*0.01; #\n\nMultiply by .01\n\n\
  b{l-1} = zeros(layerDimensions(l),1);\n\nendfor\n\nend\n```\n\n# He Initialization\
  \ for L layers\n# L 层的 He 初始化\n\n# Input : List of units in each layer\n# 输入：每层单元数列表\n\
  \n# Returns: Initial weights and biases matrices for all layers\n# 返回：所有层的初始权重和偏置矩阵\n\
  \n```octave\nfunction [W b] = HeInitializeDeepModel(layerDimensions)\n\nrand (\"\
  seed\", 3);\n\n# note the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n\
  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n\n# The Bias is a vectors of size (l,1)\n# 偏置是大小为 (l,1)\
  \ 的向量\n\n# Loop through the layer dimension from 1.. L\n# 遍历层维度 1..L\n\n# Create\
  \ cell arrays for Weights and biases\n# 为权重和偏置创建元胞数组\n```\n\n\n\n\n# 神经网络深度学习实现代码\n\
  \n## He 初始化\n\n```matlab\nfor l = 2:size(layerDimensions)(2)\n    W{l-1} = rand(layerDimensions(l),\
  \ layerDimensions(l-1)) * sqrt(2 / layerDimensions(l-1)); % Multiply by .01\n  \
  \  b{l-1} = zeros(layerDimensions(l), 1);\nendfor\n```\n\n## Xavier 初始化\n\n```matlab\n\
  % Xavier Initialization for L layers\n% Input : List of units in each layer\n% Returns:\
  \ Initial weights and biases matrices for all layers\nfunction [W b] = XavInitializeDeepModel(layerDimensions)\n\
  \    rand(\"seed\", 3);\n    % note the Weight matrix at layer 'l' is a matrix of\
  \ size (l,l-1)\n    % The Bias is a vectors of size (l,1)\n    % Loop through the\
  \ layer dimension from 1.. L\n    % Create cell arrays for Weights and biases\n\
  \    for l = 2:size(layerDimensions)(2)\n        W{l-1} = rand(layerDimensions(l),\
  \ layerDimensions(l-1)) * sqrt(1 / layerDimensions(l-1)); % Multiply by .01\n  \
  \      b{l-1} = zeros(layerDimensions(l), 1);\n    endfor\nend\n```\n\n## 初始化速度\n\
  \n```matlab\n% Initialize velocity\n% Input : weights, biases\n% Returns: vdW, vdB\
  \ - Initial velocity\nfunction [vdW vdB] = initializeVelocity(weights, biases)\n\
  \    L = size(weights)(2); % Create an integer\n    % Initialize a cell array\n\
  \    v = {};\n    % Initialize velocity with the same dimensions as W\n    for l\
  \ = 1:L\n        sz = size(weights{l});\n        vdW{l} = zeros(sz(1), sz(2));\n\
  \        sz = size(biases{l});\n        vdB{l} = zeros(sz(1), sz(2));\n    endfor;\n\
  end\n```\n\n## 初始化 RMSProp\n\n```matlab\n% Initialize RMSProp\n% Input : weights,\
  \ biases\n% Returns: sdW, sdB - Initial RMSProp\nfunction [sdW sdB] = initializeRMSProp(weights,\
  \ biases)\n    L = size(weights)(2); % Create an integer\n    % Initialize a cell\
  \ array\n    s = {};\n    % Initialize velocity with the same dimensions as W\n\
  \    for l = 1:L\n        sz = size(weights{l});\n        sdW{l} = zeros(sz(1),\
  \ sz(2));\n        sz = size(biases{l});\n        sdB{l} = zeros(sz(1), sz(2));\n\
  \    endfor;\nend\n```\n\n## 初始化 Adam\n\n```matlab\n% Initialize Adam\n% Input :\
  \ parameters\n% Returns: vdW, vdB, sdW, sdB - Initial Adam\nfunction [vdW vdB sdW\
  \ sdB] = initializeAdam(weights, biases)\n    L = size(weights)(2); % Create an\
  \ integer\n    % Initialize a cell array\n    s = {};\n    % Initialize velocity\
  \ with the same dimensions as W\n    for l = 1:L\n        sz = size(weights{l});\n\
  \        vdW{l} = zeros(sz(1), sz(2));\n        sdW{l} = zeros(sz(1), sz(2));\n\
  \        sz = size(biases{l});\n        sdB{l} = zeros(sz(1), sz(2));\n        vdB{l}\
  \ = zeros(sz(1), sz(2));\n    endfor;\nend\n```\n\n## 层前向激活计算\n\n```matlab\n% Compute\
  \ the activation at a layer 'l' for forward prop in a Deep Network\n% Input : A_prev\
  \ - Activation of previous layer\n% W,b - Weight and bias matrices and vectors\n\
  % activationFunc - Activation function - sigmoid, tanh, relu etc\n% Returns : The\
  \ Activation of this layer\n% :\n% Z = W * X + b\n% A = sigmoid(Z), A= Relu(Z),\
  \ A= tanh(Z)\nfunction [A forward_cache activation_cache] = layerActivationForward(A_prev,\
  \ W, b, activationFunc)\n    % Compute Z\n    Z = W * A_prev + b;\n    % Create\
  \ a cell array\n    forward_cache = {A_prev W b};\n    % Compute the activation\
  \ for sigmoid\n    if (strcmp(activationFunc, \"sigmoid\"))\n        [A activation_cache]\
  \ = sigmoid(Z);\n    elseif (strcmp(activationFunc, \"relu\")) % Compute the activation\
  \ for Relu\n        [A activation_cache] = relu(Z);\n    elseif (strcmp(activationFunc,\
  \ 'tanh')) % Compute the activation for tanh\n        [A activation_cache] = tanhAct(Z);\n\
  \    elseif (strcmp(activationFunc, 'softmax')) % Compute the activation for tanh\n\
  \        % [A activation_cache] = softmax(Z);\n        [A activation_cache] = stableSoftmax(Z);\n\
  \    endif\nend\n```\n\n## 深度网络前向传播\n\n```matlab\n% Compute the forward propagation\
  \ for layers 1..L\n% Input : X - Input Features\n% parameters: Weights and biases\n\
  % keep_prob\n% hiddenActivationFunc - Activation function at hidden layers Relu/tanh/sigmoid\n\
  % outputActivationFunc- sigmoid/softmax\n% Returns : AL, forward_caches, activation_caches,\
  \ dropoutMat\n% The forward propoagtion uses the Relu/tanh activation from layer\
  \ 1..L-1 and sigmoid actiovation at layer L\nfunction [AL forward_caches activation_caches\
  \ dropoutMat] = forwardPropagationDeep(X, weights, biases, keep_prob=1, hiddenActivationFunc='relu',\
  \ outputActivationFunc='sigmoid')\n    % Create an empty cell array\n    forward_caches\
  \ = {};\n    activation_caches = {};\n    dropoutMat = {};\n    % Set A to X (A0)\n\
  \    A = X;\n    L = length(weights); % number of layers in the neural network\n\
  \    % Loop through from layer 1 to upto layer L\n    for l = 1:L-1\n        A_prev\
  \ = A;\n        % Zi = Wi x Ai-1 + bi and Ai = g(Zi)\n        W = weights{l};\n\
  \        b = biases{l};\n        [A forward_cache activation_cache] = layerActivationForward(A_prev,\
  \ W, b, activationFunc=hiddenActivationFunc);\n        D = rand(size(A)(1), size(A)(2));\n\
  \        D = (D < keep_prob);\n        % Multiply by DropoutMat\n        A = A .*\
  \ D;\n        % Divide by keep_prob to keep expected value same\n        A = A ./\
  \ keep_prob;\n        % Store D\n        dropoutMat{l} = D;\n        forward_caches{l}\
  \ = forward_cache;\n        activation_caches{l} = activation_cache;\n    endfor\n\
  \    % Since this is binary classification use the sigmoid activation function in\n\
  \    % last layer\n    W = weights{L};\n    b = biases{L};\n    [AL, forward_cache\
  \ activation_cache] = layerActivationForward(A, W, b, activationFunc = outputActivationFunc);\n\
  \    forward_caches{L} = forward_cache;\n    activation_caches{L} = activation_cache;\n\
  end\n```\n\n## 选择列\n\n```matlab\n% Pick columns where Y==1\n% This function is used\
  \ in computeCost\nfunction [a] = pickColumns(AL, Y, numClasses)\n    if (numClasses\
  \ == 3)\n        a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3)];\n    elseif (numClasses\
  \ == 10)\n        a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3); AL(Y==3,4); AL(Y==4,5);\n\
  \             AL(Y==5,6); AL(Y==6,7); AL(Y==7,8); AL(Y==8,9); AL(Y==9,10)];\n  \
  \  endif\nend\n```\n\n## 计算代价函数\n\n```matlab\n% Compute the cost\n% Input : AL-Activation\
  \ of last layer\n% : Y-Output from data\n% : outputActivationFunc- sigmoid/softmax\n\
  % : numClasses\n% Output: cost\nfunction [cost] = computeCost(AL, Y, outputActivationFunc=\"\
  sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n   \
  \     numTraining = size(Y)(2);\n        % Element wise multiply for logprobs\n\
  \        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n   \
  \     % disp(cost);\n    elseif (strcmp(outputActivationFunc, 'softmax'))\n    \
  \    numTraining = size(Y)(2);\n        Y = Y';\n        % Select rows where Y=0,1,and\
  \ 2 and concatenate to a long vector\n        % a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3)];\n\
  \        a = pickColumns(AL, Y, numClasses);\n        % Select the correct column\
  \ for log prob\n        correct_probs = -log(a);\n        % Compute log loss\n \
  \       cost = sum(correct_probs) / numTraining;\n    endif\nend\n```\n\n## 带正则化的代价函数计算\n\
  \n```matlab\n% Compute the cost with regularization\n% Input : weights\n% : AL -\
  \ Activation of last layer\n% : Output from data\n% : lambd\n% : outputActivationFunc-\
  \ sigmoid/softmax\n% : numClasses\n% Output: cost\nfunction [cost] = computeCostWithReg(weights,\
  \ AL, Y, lambd, outputActivationFunc=\"sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        numTraining = size(Y)(2);\n        % Element wise multiply\
  \ for logprobs\n        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n\
  \        % Regularization cost\n        L = size(weights)(2);\n        L2RegularizationCost\
  \ = 0;\n        for l = 1:L\n            wtSqr = weights{l} .* weights{l};\n   \
  \         % disp(sum(sum(wtSqr,1)));\n            L2RegularizationCost += sum(sum(wtSqr,\
  \ 1));\n        endfor\n        L2RegularizationCost = (lambd / (2 * numTraining))\
  \ * L2RegularizationCost;\n        cost = cost + L2RegularizationCost;\n    elseif\
  \ (strcmp(outputActivationFunc, 'softmax'))\n        numTraining = size(Y)(2);\n\
  \        Y = Y';\n        % Select rows where Y=0,1,and 2 and concatenate to a long\
  \ vector\n        % a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3)];\n        a = pickColumns(AL,\
  \ Y, numClasses);\n        % Select the correct column for log prob\n        correct_probs\
  \ = -log(a);\n        % Compute log loss\n        cost = sum(correct_probs) / numTraining;\n\
  \        % Regularization cost\n        L = size(weights)(2);\n        L2RegularizationCost\
  \ = 0;\n        for l = 1:L\n            % Compute L2 Norm\n            wtSqr =\
  \ weights{l} .* weights{l};\n            % disp(sum(sum(wtSqr,1)));\n          \
  \  L2RegularizationCost += sum(sum(wtSqr, 1));\n        endfor\n        L2RegularizationCost\
  \ = (lambd / (2 * numTraining)) * L2RegularizationCost;\n        cost = cost + L2RegularizationCost;\n\
  \    endif\nend\n```\n\n## 层反向传播计算\n\n```matlab\n% Compute the backpropoagation\
  \ for 1 cycle\n% Input : Neural Network parameters - dA\n% # cache - forward_cache\
  \ & activation_cache\n% # Input features\n% # Output values Y\n% # outputActivationFunc-\
  \ sigmoid/softmax\n% # numClasses\n% Returns: Gradients\n% dL/dWi = dL/dZi * Al-1\n\
  % dl/dbl = dL/dZl\n% dL/dZ_prev = dL/dZl * W\nfunction [dA_prev dW db] = layerActivationBackward(dA,\
  \ forward_cache, activation_cache, Y, activationFunc, numClasses)\n    A_prev =\
  \ forward_cache{1};\n```\n\n\n\n\n\n# 神经网络反向传播实现\n\n## 核心函数：`layerActivationBackwardWithReg`\n\
  \n```matlab\nfunction [dA_prev dW db] = layerActivationBackwardWithReg(dA, forward_cache,\
  \ activation_cache, Y, lambd=0, activationFunc, numClasses)\n    A_prev = forward_cache{1};\n\
  \    W = forward_cache{2};\n    b = forward_cache{3};\n    numTraining = size(A_prev)(2);\n\
  \n    if (strcmp(activationFunc, \"relu\"))\n        dZ = reluDerivative(dA, activation_cache);\n\
  \    elseif (strcmp(activationFunc, \"sigmoid\"))\n        dZ = sigmoidDerivative(dA,\
  \ activation_cache);\n    elseif (strcmp(activationFunc, \"tanh\"))\n        dZ\
  \ = tanhDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc, \"\
  softmax\"))\n        % dZ = softmaxDerivative(dA, activation_cache, Y, numClasses);\n\
  \        dZ = stableSoftmaxDerivative(dA, activation_cache, Y, numClasses);\n  \
  \  endif\n\n    if (strcmp(activationFunc, \"softmax\"))\n        W = forward_cache{2};\n\
  \        b = forward_cache{3};\n        % Add the regularization factor\n      \
  \  dW = 1/numTraining * A_prev * dZ + (lambd/numTraining) * W';\n        db = 1/numTraining\
  \ * sum(dZ, 1);\n        dA_prev = dZ * W;\n    else\n        W = forward_cache{2};\n\
  \        b = forward_cache{3};\n        % Add the regularization factor\n      \
  \  dW = 1/numTraining * dZ * A_prev' + (lambd/numTraining) * W;\n        db = 1/numTraining\
  \ * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\nend\n```\n\n### 功能说明\n-\
  \ **输入**：\n  - `dA`：神经网络参数\n  - `forward_cache` 和 `activation_cache`：前向传播缓存\n  -\
  \ `Y`：输出值\n  - `lambd`：正则化参数\n  - `activationFunc`：激活函数类型（sigmoid/softmax）\n  -\
  \ `numClasses`：类别数量\n- **输出**：梯度 `dA_prev`、`dW`、`db`\n- **核心公式**：\n  - `dL/dWi =\
  \ dL/dZi * Al-1`\n  - `dl/dbl = dL/dZl`\n  - `dL/dZ_prev = dL/dZl * W`\n\n---\n\n\
  ## 深层网络反向传播：`backwardPropagationDeep`\n\n```matlab\nfunction [gradsDA gradsDW gradsDB]\
  \ = backwardPropagationDeep(AL, Y, activation_caches, forward_caches, dropoutMat,\
  \ lambd=0, keep_prob=1, hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\"\
  , numClasses)\n    % Set the number of layers\n    L = length(activation_caches);\n\
  \    m = size(AL)(2);\n\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n  \
  \      % Initializing the backpropagation\n        % dl/dAL = -(y/a + (1-y)/(1-a))\
  \ - At the output layer\n        dAL = -((Y ./ AL) - (1 - Y) ./ (1 - AL));\n   \
  \ elseif (strcmp(outputActivationFunc, \"softmax\"))\n        dAL = 0;\n       \
  \ Y = Y';\n    endif\n\n    % Get the gradients at the last layer\n    activation_cache\
  \ = activation_caches{L};\n    forward_cache = forward_caches(L);\n\n    if (lambd\
  \ == 0)\n        [dA dW db] = layerActivationBackward(dAL, forward_cache{1}, activation_cache,\
  \ Y, activationFunc = outputActivationFunc, numClasses);\n    else\n        [dA\
  \ dW db] = layerActivationBackwardWithReg(dAL, forward_cache{1}, activation_cache,\
  \ Y, lambd, activationFunc = outputActivationFunc, numClasses);\n    endif\n\n \
  \   if (strcmp(outputActivationFunc, \"sigmoid\"))\n        gradsDA{L} = dA;\n \
  \   elseif (strcmp(outputActivationFunc, \"softmax\"))\n        gradsDA{L} = dA';\
  \ % Note the transpose\n    endif\n\n    gradsDW{L} = dW;\n    gradsDB{L} = db;\n\
  \n    % Traverse in the reverse direction\n    for l = (L-1):-1:1\n        activation_cache\
  \ = activation_caches{l};\n        forward_cache = forward_caches(l);\n        dAl\
  \ = gradsDA{l+1};\n\n        if (lambd == 0)\n            % Get the dropout mat\n\
  \            D = dropoutMat{l};\n            % Multiply by the dropoutMat\n    \
  \        dAl = dAl .* D;\n            % Divide by keep_prob to keep expected value\
  \ same\n            dAl = dAl ./ keep_prob;\n\n            [dA_prev_temp, dW_temp,\
  \ db_temp] = layerActivationBackward(dAl, forward_cache{1}, activation_cache, Y,\
  \ activationFunc = hiddenActivationFunc, numClasses);\n        else\n          \
  \  [dA_prev_temp, dW_temp, db_temp] = layerActivationBackwardWithReg(dAl, forward_cache{1},\
  \ activation_cache, Y, lambd, activationFunc = hiddenActivationFunc, numClasses);\n\
  \        endif\n\n        gradsDA{l} = dA_prev_temp;\n        gradsDW{l} = dW_temp;\n\
  \        gradsDB{l} = db_temp;\n    endfor\nend\n```\n\n### 参数说明\n- **输入**：\n  -\
  \ `AL`：第 L 层网络的输出（权重）\n  - `Y`：真实输出\n  - `activation_caches`、`forward_caches`：包含各层缓存的列表\n\
  \  - `dropoutMat`：Dropout 掩码矩阵\n  - `lambd`：正则化参数\n  - `keep_prob`：保留概率\n  - `hiddenActivationFunc`：隐藏层激活函数（sigmoid/tanh/relu）\n\
  \  - `outputActivationFunc`：输出层激活函数（sigmoid/softmax）\n  - `numClasses`：类别数量\n- **输出**：\n\
  \  - `gradsDA`、`gradsDW`、`gradsDB`：梯度字典\n\n---\n\n## 梯度下降更新：`gradientDescent`\n\n\
  ```matlab\nfunction [weights biases] = gradientDescent(weights, biases, gradsW,\
  \ gradsB, learningRate, outputActivationFunc=\"sigmoid\")\n    L = size(weights)(2);\
  \ % number of layers in the neural network\n\n    % Update rule for each parameter.\n\
  \    for l = 1:(L-1)\n        weights{l} = weights{l} - learningRate * gradsW{l};\n\
  \        biases{l} = biases{l} - learningRate * gradsB{l};\n    endfor\n\n    if\
  \ (strcmp(outputActivationFunc, \"sigmoid\"))\n        weights{L} = weights{L} -\
  \ learningRate * gradsW{L};\n        biases{L} = biases{L} - learningRate * gradsB{L};\n\
  \    elseif (strcmp(outputActivationFunc, \"softmax\"))\n        % 此处原文截断，推测为类似更新逻辑\n\
  \    endif\nend\n```\n\n### 更新规则\n- 权重更新：`weights{l} = weights{l} - learningRate\
  \ * gradsW{l}`\n- 偏置更新：`biases{l} = biases{l} - learningRate * gradsB{l}`\n\n\n\n\
  \n\n# 权重更新公式\n\n```matlab\nweights{L} = weights{L} - learningRate * gradsW{L}';\n\
  biases{L} = biases{L} - learningRate * gradsB{L}';\n```\n\n# 带动量的梯度下降\n\n## 输入参数\n\
  \n- `parameters`\n- `gradients` - `gradsDW`, `gradsDB`\n- `v` - `vdW`, `vdB`\n-\
  \ `beta`\n- `learningRate`\n- `outputActivationFunc`\n\n## 输出\n\n- 更新后的权重，偏置\n\n\
  ## 函数定义\n\n```matlab\nfunction [weights biases] = gradientDescentWithMomentum(weights,\
  \ biases, gradsDW, gradsDB, vdW, vdB, beta, learningRate, outputActivationFunc=\"\
  sigmoid\")\n```\n\n## 实现细节\n\n`L = size(weights)(2);` # 神经网络中的层数\n\n### 各参数的更新规则\n\
  \n```matlab\nfor l = 1:(L-1)\n    # 计算速度\n    # v['dWk'] = beta * v['dWk'] + (1-beta)\
  \ * dWk\n    vdW{l} = beta * vdW{l} + (1 - beta) * gradsDW{l};\n    vdB{l} = beta\
  \ * vdB{l} + (1 - beta) * gradsDB{l};\n\n    weights{l} = weights{l} - learningRate\
  \ * vdW{l};\n    biases{l} = biases{l} - learningRate * vdB{l};\nendfor\n```\n\n\
  ### 输出层处理\n\n```matlab\nif (strcmp(outputActivationFunc, \"sigmoid\"))\n    vdW{L}\
  \ = beta * vdW{L} + (1 - beta) * gradsDW{L};\n    vdB{L} = beta * vdB{L} + (1 -\
  \ beta) * gradsDB{L};\n    weights{L} = weights{L} - learningRate * vdW{L};\n  \
  \  biases{L} = biases{L} - learningRate * vdB{L};\n\nelseif (strcmp(outputActivationFunc,\
  \ \"softmax\"))\n    vdW{L} = beta * vdW{L} + (1 - beta) * gradsDW{L}';\n    vdB{L}\
  \ = beta * vdB{L} + (1 - beta) * gradsDB{L}';\n    weights{L} = weights{L} - learningRate\
  \ * vdW{L};\n    biases{L} = biases{L} - learningRate * vdB{L};\nendif\n```\n\n\
  # RMSProp 优化算法\n\n## 输入参数\n\n- `parameters` - `weights`, `biases`\n- `gradients`\
  \ - `gradsDW`, `gradsDB`\n- `s` - `sdW`, `sdB`\n- `beta1`\n- `epsilon`\n- `learningRate`\n\
  - `outputActivationFunc`\n\n## 输出\n\n- RMSProp 更新后的权重和偏置\n\n## 函数定义\n\n```matlab\n\
  function [weights biases] = gradientDescentWithRMSProp(weights, biases, gradsDW,\
  \ gradsDB, sdW, sdB, beta1, epsilon, learningRate, outputActivationFunc=\"sigmoid\"\
  )\n```\n\n## 实现细节\n\n`L = size(weights)(2);` # 神经网络中的层数\n\n### 各参数的更新规则\n\n```matlab\n\
  for l = 1:(L-1)\n    sdW{l} = beta1 * sdW{l} + (1 - beta1) * gradsDW{l} .* gradsDW{l};\n\
  \    sdB{l} = beta1 * sdB{l} + (1 - beta1) * gradsDB{l} .* gradsDB{l};\n    weights{l}\
  \ = weights{l} - learningRate * gradsDW{l} ./ sqrt(sdW{l} + epsilon);\n    biases{l}\
  \ = biases{l} - learningRate * gradsDB{l} ./ sqrt(sdB{l} + epsilon);\nendfor\n```\n\
  \n### 输出层处理\n\n```matlab\nif (strcmp(outputActivationFunc, \"sigmoid\"))\n    sdW{L}\
  \ = beta1 * sdW{L} + (1 - beta1) * gradsDW{L} .* gradsDW{L};\n    sdB{L} = beta1\
  \ * sdB{L} + (1 - beta1) * gradsDB{L} .* gradsDB{L};\n    weights{L} = weights{L}\
  \ - learningRate * gradsDW{L} ./ sqrt(sdW{L} + epsilon);\n    biases{L} = biases{L}\
  \ - learningRate * gradsDB{L} ./ sqrt(sdB{L} + epsilon);\n\nelseif (strcmp(outputActivationFunc,\
  \ \"softmax\"))\n    sdW{L} = beta1 * sdW{L} + (1 - beta1) * gradsDW{L}' .* gradsDW{L}';\n\
  \    sdB{L} = beta1 * sdB{L} + (1 - beta1) * gradsDB{L}' .* gradsDB{L}';\n    weights{L}\
  \ = weights{L} - learningRate * gradsDW{L}' ./ sqrt(sdW{L} + epsilon);\n    biases{L}\
  \ = biases{L} - learningRate * gradsDB{L}' ./ sqrt(sdB{L} + epsilon);\nendif\n```\n\
  \n# Adam 优化算法\n\n## 输入参数\n\n- `parameters` - `weights`, `biases`\n- `gradients`\
  \ - `gradsDW`, `gradsDB`\n- `v` - `vdW`, `vdB`\n- `s` - `sdW`, `sdB`\n- `t`\n- `beta1`\n\
  - `beta2`\n- `epsilon`\n- `learningRate`\n\n## 输出\n\n- 更新后的权重和偏置\n\n## 函数定义\n\n\
  ```matlab\nfunction [weights biases] = gradientDescentWithAdam(weights, biases,\
  \ gradsDW, gradsDB, vdW, vdB, sdW, sdB, t, beta1, beta2, epsilon, learningRate,\
  \ outputActivationFunc=\"sigmoid\")\n```\n\n## 实现细节\n\n```matlab\nvdW_corrected\
  \ = {};\nvdB_corrected = {};\nsdW_corrected = {};\nsdB_corrected = {};\n\nL = size(weights)(2);\
  \ # 神经网络中的层数\n```\n\n### 各参数的更新规则\n\n```matlab\nfor l = 1:(L-1)\n    vdW{l} = beta1\
  \ * vdW{l} + (1 - beta1) * gradsDW{l};\n    vdB{l} = beta1 * vdB{l} + (1 - beta1)\
  \ * gradsDB{l};\n\n    # 计算一阶矩的偏差修正估计\n    vdW_corrected{l} = vdW{l} / (1 - beta1^t);\n\
  \    vdB_corrected{l} = vdB{l} / (1 - beta1^t);\n\n    sdW{l} = beta2 * sdW{l} +\
  \ (1 - beta2) * gradsDW{l} .* gradsDW{l};\n    sdB{l} = beta2 * sdB{l} + (1 - beta2)\
  \ * gradsDB{l} .* gradsDB{l};\n\n    # 计算二阶矩的偏差修正估计\n    sdW_corrected{l} = sdW{l}\
  \ / (1 - beta2^t);\n    sdB_corrected{l} = sdB{l} / (1 - beta2^t);\n\n    # 更新参数\n\
  \    d1 = sqrt(sdW_corrected{l} + epsilon);\n    d2 = sqrt(sdB_corrected{l} + epsilon);\n\
  \    weights{l} = weights{l} - learningRate * vdW_corrected{l} ./ d1;\n    biases{l}\
  \ = biases{l} - learningRate * vdB_corrected{l} ./ d2;\nendfor\n```\n\n### 输出层处理\n\
  \n#### Sigmoid 激活函数\n\n```matlab\nif (strcmp(outputActivationFunc, \"sigmoid\"))\n\
  \    vdW{L} = beta1 * vdW{L} + (1 - beta1) * gradsDW{L};\n    vdB{L} = beta1 * vdB{L}\
  \ + (1 - beta1) * gradsDB{L};\n\n    # 计算一阶矩的偏差修正估计\n    vdW_corrected{L} = v{L}\
  \ / (1 - beta1^t);\n    vdB_corrected{L} = v{L} / (1 - beta1^t);\n\n    sdW{L} =\
  \ beta2 * sdW{L} + (1 - beta2) * gradsDW{L} .* gradsDW{L};\n    sdB{L} = beta2 *\
  \ sdB{L} + (1 - beta2) * gradsDB{L} .* gradsDB{L};\n\n    # 计算二阶矩的偏差修正估计\n    sdW_corrected{L}\
  \ = s{L} / (1 - beta2^t);\n    sdB_corrected{L} = s{L} / (1 - beta2^t);\n\n    #\
  \ 更新参数\n    d1 = sqrt(sdW_corrected{L} + epsilon);\n    d2 = sqrt(sdB_corrected{L}\
  \ + epsilon);\n    weights{L} = weights{L} - learningRate * vdW_corrected{L} ./\
  \ d1;\n    biases{L} = biases{L} - learningRate * vdB_corrected{L} ./ d2;\n```\n\
  \n#### Softmax 激活函数\n\n```matlab\nelseif (strcmp(outputActivationFunc, \"softmax\"\
  ))\n    vdW{L} = beta1 * vdW{L} + (1 - beta1) * gradsDW{L}';\n    vdB{L} = beta1\
  \ * vdB{L} + (1 - beta1) * gradsDB{L}';\n\n    # 计算一阶矩的偏差修正估计\n    vdW_corrected{L}\
  \ = vdW{L} / (1 - beta1^t);\n    vdB_corrected{L} = vdB{L} / (1 - beta1^t);\n\n\
  \    sdW{L} = beta2 * sdW{L} + (1 - beta2) * gradsDW{L}' .* gradsDW{L}';\n    sdB{L}\
  \ = beta2 * sdB{L} + (1 - beta2) * gradsDB{L}' .* gradsDB{L}';\n\n    # 计算二阶矩的偏差修正估计\n\
  \    sdW_corrected{L} = sdW{L} / (1 - beta2^t);\n    sdB_corrected{L} = sdB{L} /\
  \ (1 - beta2^t);\n\n    # 更新参数\n    d1 = sqrt(sdW_corrected{L} + epsilon);\n   \
  \ d2 = sqrt(sdB_corrected{L} + epsilon);\n    weights{L} = weights{L} - learningRate\
  \ * vdW_corrected{L} ./ d1;\n    biases{L} = biases{L} - learningRate * vdB_corrected{L}\
  \ ./ d2;\nendif\n```\n\n# L 层深度学习模型执行\n\n## 输入参数\n\n- `X` - 输入特征\n- `Y` - 输出\n-\
  \ `layersDimensions` - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数 relu / tanh\n- `outputActivationFunc`\
  \ - 输出层激活函数 sigmoid / softmax\n- `learning rate`\n- `lambd`\n- `keep_prob`\n- `num\
  \ of iterations`\n\n## 输出\n\n- 每次迭代后更新的权重和偏置\n\n## 函数定义\n\n```matlab\nfunction [weights\
  \ biases costs] = L_Layer_DeepModel(X, Y, layersDimensions, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", learning_rate = .3, lambd=0, keep_prob=1, num_iterations\
  \ = 10000, initType=\"default\") # lr was 0.009\n```\n\n## 实现细节\n\n```matlab\nrand(\"\
  seed\", 1);\ncosts = [];\n\nif (strcmp(initType, \"He\"))\n    # He 初始化\n    [weights\
  \ biases] = HeInitializeDeepModel(layersDimensions);\nelseif (strcmp(initType, \"\
  Xav\"))\n    # Xavier 初始化\n    [weights biases] = XavInitializeDeepModel(layersDimensions);\n\
  else\n    # 默认初始化\n    [weights biases] = initializeDeepModel(layersDimensions);\n\
  endif\n```\n\n### 梯度下降循环\n\n```matlab\nfor i = 0:num_iterations\n    # 前向传播: [LINEAR\
  \ -> RELU]*(L-1) -> LINEAR -> SIGMOID.\n    [AL forward_caches activation_caches\
  \ droputMat] = forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc);\n\n    # 正则化参数为 0\n    if (lambd ==\
  \ 0)\n        # 计算代价\n        cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n    else\n        #\
  \ 计算带正则化的代价\n        cost = computeCostWithReg(weights, AL, Y, lambd, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n    endif\n\n    # 反向传播\n\
  \    [gradsDA gradsDW gradsDB] = backwardPropagationDeep(AL, Y, activation_caches,\
  \ forward_caches, droputMat, lambd, keep_prob, hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n\n    # 更新参数\n    [weights\
  \ biases] = gradientDescent(weights, biases, gradsDW, gradsDB, learning_rate, outputActivationFunc=outputActivationFunc);\n\
  ```\n\n\n\n\n\n# 每 1000 次迭代打印一次成本\n\n```matlab\nif ( mod(i,1000) == 0)\n    costs\
  \ = [costs cost];\n    % disp (\"Cost after iteration\"), L2RegularizationCost(i),\
  \ disp(cost);\n    printf(\"Cost after iteration i=%i cost=%d\\n\", i, cost);\n\
  endif\nendfor\nend\n```\n\n# 使用随机梯度下降执行 L 层深度学习模型\n\n## 输入\n- `X` - 输入特征\n- `Y`\
  \ - 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数：`relu` /\
  \ `tanh` / `sigmoid`\n- `outputActivationFunc` - 输出层激活函数：`sigmoid` / `softmax`\n\
  - `learningRate` - 学习率\n- `lrDecay` - 学习率衰减标志\n- `decayRate` - 衰减率\n- `lambd` -\
  \ 正则化参数\n- `keep_prob` - Dropout 保留概率\n- `optimizer` - 优化器类型\n- `beta` - 动量参数\n\
  - `beta1` - Adam 参数 beta1\n- `beta2` - Adam 参数 beta2\n- `epsilon` - 用于数值稳定性的 Epsilon\n\
  - `mini_batch_size` - 小批量大小\n- `num_epochs` - 迭代轮数\n\n## 输出\n- 每次迭代后更新的权重和偏置\n\n\
  ```matlab\nfunction [weights biases costs] = L_Layer_DeepModel_SGD(X, Y, layersDimensions,\
  \ hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\", learningRate =\
  \ .3, lrDecay=false, decayRate=1, lambd=0, keep_prob=1, optimizer=\"gd\", beta=0.9,\
  \ beta1=0.9, beta2=0.999, epsilon=10^-8, mini_batch_size = 64, num_epochs = 2500)\n\
  \    disp(\"here\");\n    printf(\"learningRate=%f \", learningRate);\n    printf(\"\
  lrDecay=%d \", lrDecay);\n    printf(\"decayRate=%f \", decayRate);\n    printf(\"\
  lambd=%d \", lambd);\n    printf(\"keep_prob=%f \", keep_prob);\n    printf(\"optimizer=%s\
  \ \", optimizer);\n    printf(\"beta=%f \", beta);\n    printf(\"beta1=%f \", beta1);\n\
  \    printf(\"beta2=%f \", beta2);\n    printf(\"epsilon=%f \", epsilon);\n    printf(\"\
  mini_batch_size=%d \", mini_batch_size);\n    printf(\"num_epochs=%d \", num_epochs);\n\
  \n    t = 0;\n    rand (\"seed\", 1);\n    costs = [] ;\n\n    % 参数初始化。\n    [weights\
  \ biases] = initializeDeepModel(layersDimensions);\n\n    if (strcmp(optimizer,\
  \ \"momentum\"))\n        [vdW vdB] = initializeVelocity(weights, biases);\n   \
  \ elseif (strcmp(optimizer, \"rmsprop\"))\n        [sdW sdB] = initializeRMSProp(weights,\
  \ biases);\n    elseif (strcmp(optimizer, \"adam\"))\n        [vdW vdB sdW sdB]\
  \ = initializeAdam(weights, biases);\n    endif\n\n    seed = 10;\n\n    % 循环（梯度下降）\n\
  \    for i = 0:num_epochs\n        seed = seed + 1;\n        [mini_batches_X mini_batches_Y]\
  \ = random_mini_batches(X, Y, mini_batch_size, seed);\n        minibatches = length(mini_batches_X);\n\
  \n        for batch = 1:minibatches\n            X = mini_batches_X{batch};\n  \
  \          Y = mini_batches_Y{batch};\n\n            % 前向传播：[LINEAR -> RELU]*(L-1)\
  \ -> LINEAR -> SIGMOID/SOFTMAX。\n            [AL forward_caches activation_caches\
  \ droputMat] = forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc);\n\n            if (lambd == 0)\n \
  \               % 计算成本。\n                cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n            else\n \
  \               % 计算带正则化的成本\n                cost = computeCostWithReg(weights,\
  \ AL, Y, lambd, outputActivationFunc=outputActivationFunc, numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \            endif\n\n            % 反向传播。\n            [gradsDA gradsDW gradsDB]\
  \ = backwardPropagationDeep(AL, Y, activation_caches, forward_caches, droputMat,\
  \ lambd, keep_prob, hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n\n            if (strcmp(optimizer,\
  \ \"gd\"))\n                % 更新参数。\n                [weights biases] = gradientDescent(weights,\
  \ biases, gradsDW, gradsDB, learningRate, outputActivationFunc=outputActivationFunc);\n\
  \            elseif (strcmp(optimizer, \"momentum\"))\n                [weights\
  \ biases] = gradientDescentWithMomentum(weights, biases, gradsDW, gradsDB, vdW,\
  \ vdB, beta, learningRate, outputActivationFunc);\n            elseif (strcmp(optimizer,\
  \ \"rmsprop\"))\n                [weights biases] = gradientDescentWithRMSProp(weights,\
  \ biases, gradsDW, gradsDB, sdW, sdB, beta1, epsilon, learningRate, outputActivationFunc);\n\
  \            elseif (strcmp(optimizer, \"adam\"))\n                t = t + 1;\n\
  \                [weights biases] = gradientDescentWithAdam(weights, biases, gradsDW,\
  \ gradsDB, vdW, vdB, sdW, sdB, t, beta1, beta2, epsilon, learningRate, outputActivationFunc);\n\
  \            endif\n        endfor\n\n        % 每 1000 次迭代打印一次成本\n        if ( mod(i,\
  \ 1000) == 0)\n            costs = [costs cost];\n            % disp (\"Cost after\
  \ iteration\"), disp(i), disp(cost);\n            printf(\"Cost after iteration\
  \ i=%i cost=%d\\n\", i, cost);\n        endif\n\n        if (lrDecay == true)\n\
  \            learningRate = decayRate^(num_epochs/1000) * learningRate;\n      \
  \  endif\n    endfor\nend\n```\n\n# 绘制成本与迭代次数的关系图\n\n```matlab\nfunction plotCostVsIterations(maxIterations,\
  \ costs, fig1)\n    iterations = [0:1000:maxIterations];\n    plot(iterations, costs);\n\
  \    title (\"Cost vs no of iterations \");\n    xlabel(\"No of iterations\");\n\
  \    ylabel(\"Cost\");\n    print -dpng figReg2-o\nend\n```\n\n# 绘制成本与迭代轮数的关系图\n\
  \n```matlab\nfunction plotCostVsEpochs(maxEpochs, costs, fig1)\n    epochs = [0:1000:maxEpochs];\n\
  \    plot(epochs, costs);\n    title (\"Cost vs no of epochs \");\n    xlabel(\"\
  No of epochs\");\n    ylabel(\"Cost\");\n    print -dpng fig5-o\nend\n```\n\n# 计算给定输入的预测值\n\
  \n## 输入\n- 神经网络参数\n- 输入数据\n\n```matlab\nfunction [predictions] = predict(weights,\
  \ biases, X, keep_prob=1, hiddenActivationFunc=\"relu\")\n    [AL forward_caches\
  \ activation_caches] = forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc);\n\
  \    predictions = (AL > 0.5);\nend\n```\n\n# 绘制决策边界\n\n```matlab\nfunction plotDecisionBoundary(data,\
  \ weights, biases, keep_prob=1, hiddenActivationFunc=\"relu\", fig2)\n    % 绘制由\
  \ SVM 学习的非线性决策边界\n    colormap (\"summer\");\n\n    % 在网格值上进行分类预测\n    x1plot =\
  \ linspace(min(data(:,1)), max(data(:,1)), 400)';\n    x2plot = linspace(min(data(:,2)),\
  \ max(data(:,2)), 400)';\n    [X1, X2] = meshgrid(x1plot, x2plot);\n    vals = zeros(size(X1));\n\
  \n    % 绘制网格的预测\n    for i = 1:size(X1, 2)\n        gridPoints = [X1(:, i), X2(:,\
  \ i)];\n        vals(:, i) = predict(weights, biases, gridPoints', keep_prob, hiddenActivationFunc=hiddenActivationFunc);\n\
  \    endfor\n\n    scatter(data(:,1), data(:,2), 8, c=data(:,3), \"filled\");\n\n\
  \    % 绘制边界\n    hold on\n    % contour(X1, X2, vals, [0 0], 'LineWidth', 2);\n\
  \    contour(X1, X2, vals, \"linewidth\", 4);\n    title ({\"3 layer Neural Network\
  \ decision boundary\"});\n    hold off;\n    print -dpng figReg22-o\nend\n```\n\n\
  # 计算得分\n\n```matlab\nfunction [AL] = scores(weights, biases, X, hiddenActivationFunc=\"\
  relu\")\n    [AL forward_caches activation_caches] = forwardPropagationDeep(X, weights,\
  \ biases, hiddenActivationFunc);\nend\n```\n\n# 创建随机小批量。返回包含小批量的元胞数组\n\n## 输入\n\
  - `X`, `Y`\n- 小批量大小\n\n## 输出\n- 小批量 `X` & `Y`\n\n```matlab\nfunction [mini_batches_X\
  \ mini_batches_Y] = random_mini_batches(X, Y, miniBatchSize = 64, seed = 0)\n  \
  \  rand (\"seed\", seed);\n\n    % 获取训练样本数量\n    m = size(X)(2);\n\n    % 创建一个小于\
  \ m 的随机数列表\n    permutation = randperm(m);\n\n    % 随机打乱训练数据\n    shuffled_X = X(:,\
  \ permutation);\n    shuffled_Y = Y(:, permutation);\n\n    % 计算小批量数量\n    numCompleteMinibatches\
  \ = floor(m / miniBatchSize);\n    batch = 0;\n\n    for k = 0:(numCompleteMinibatches\
  \ - 1)\n        % 设置每个小批量的开始和结束\n        batch = batch + 1;\n        lower = (k\
  \ * miniBatchSize) + 1;\n        upper = (k + 1) * miniBatchSize;\n        mini_batch_X\
  \ = shuffled_X(:, lower:upper);\n        mini_batch_Y = shuffled_Y(:, lower:upper);\n\
  \n        % 创建元胞数组\n        mini_batches_X{batch} = mini_batch_X;\n        mini_batches_Y{batch}\
  \ = mini_batch_Y;\n    endfor\n\n    % 如果批量大小不能整除小批量数量\n    if mod(m, miniBatchSize)\
  \ != 0\n        % 设置最后一个小批量的开始和结束\n        l = floor(m / miniBatchSize) * miniBatchSize;\n\
  \        m = l + mod(m, miniBatchSize);\n        mini_batch_X = shuffled_X(:, (l+1):m);\n\
  \        mini_batch_Y = shuffled_Y(:, (l+1):m);\n        batch = batch + 1;\n  \
  \      mini_batches_X{batch} = mini_batch_X;\n        mini_batches_Y{batch} = mini_batch_Y;\n\
  \    endif\nend\n```\n\n# 绘制决策边界\n\n```matlab\nfunction plotDecisionBoundary1(data,\
  \ weights, biases, keep_prob=1, hiddenActivationFunc=\"relu\")\n    % 在网格值上进行分类预测\n\
  \    x1plot = linspace(min(data(:,1)), max(data(:,1)), 400)';\n    x2plot = linspace(min(data(:,2)),\
  \ max(data(:,2)), 400)';\n    [X1, X2] = meshgrid(x1plot, x2plot);\n```\n\n\n\n\n\
  \n# 代码实现与梯度检查\n\n## 决策边界可视化\n\n```matlab\nvals = zeros(size(X1));\n\nfor i = 1:size(X1,\
  \ 2)\n    gridPoints = [X1(:, i), X2(:, i)];\n    [AL, forward_caches, activation_caches]\
  \ = forwardPropagationDeep(gridPoints', weights, biases, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=\"softmax\");\n    [l, m] = max(AL, [], 2);\n    vals(:,\
  \ i) = m;\nendfor\n\nscatter(data(:,1), data(:,2), 8, c=data(:,3), \"filled\");\n\
  \n% Plot the boundary\nhold on\ncontour(X1, X2, vals, \"linewidth\", 4);\nprint\
  \ -dpng \"fig-o1.png\"\n```\n\n## 辅助函数\n\n### `cellArray_to_vector`\n\n将权重和偏置的 cell\
  \ 数组转换为向量。\n\n```matlab\nfunction [vec] = cellArray_to_vector(weights, biases)\n\
  \    vec = [];\n    for i = 1:size(weights)(2)\n        w = weights{i};\n      \
  \  sz = size(w);\n        % Take transpose before reshaping\n        l = reshape(w',\
  \ sz(1)*sz(2), 1);\n        \n        b = biases{i};\n        sz1 = size(b);\n \
  \       m = reshape(b', sz1(1)*sz1(2), 1);\n        \n        % Concatenate\n  \
  \      vec = [vec; l; m];\n    endfor\nend\n```\n\n### `gradients_to_vector`\n\n\
  将梯度 cell 数组转换为向量。\n\n```matlab\nfunction [vec] = gradients_to_vector(gradsDW, gradsDB)\n\
  \    vec = [];\n    for i = 1:size(gradsDW)(2)\n        gW = gradsDW{i};\n     \
  \   sz = size(gW);\n        % Take transpose before reshaping\n        l = reshape(gW',\
  \ sz(1)*sz(2), 1);\n        \n        gB = gradsDB{i};\n        sz1 = size(gB);\n\
  \        m = reshape(gB', sz1(1)*sz1(2), 1);\n        \n        % Concatenate\n\
  \        vec = [vec; l; m];\n    endfor\nend\n```\n\n### `vector_to_cellArray`\n\
  \n将向量转换回权重和偏置的 cell 数组。\n\n```matlab\nfunction [weights1, biases1] = vector_to_cellArray(weights,\
  \ biases, params)\n    weights1 = {};\n    biases1 = {};\n    start = 1;\n    \n\
  \    for i = 1:size(weights)(2)\n        w = weights{i};\n        sz = size(w);\n\
  \        % Take transpose before reshaping\n        a = params(start:start+sz(1)*sz(2)-1,\
  \ 1);\n        b = reshape(a, sz(2), sz(1));\n        weights1{i} = b';\n      \
  \  start = start + sz(1)*sz(2);\n        \n        b = biases{i};\n        sz =\
  \ size(b);\n        c = params(start:start+sz(1)*sz(2)-1, 1);\n        d = reshape(c,\
  \ sz(2), sz(1));\n        biases1{i} = d';\n        start = start + sz(1)*sz(2);\n\
  \    endfor\nend\n```\n\n### `vector_to_cellArray1`\n\n将向量转换为 cell 数组（用于梯度）。\n\n\
  ```matlab\nfunction [weights1, biases1] = vector_to_cellArray1(weights, biases,\
  \ gradients)\n    weights1 = {};\n    biases1 = {};\n    start = 1;\n    \n    for\
  \ i = 1:size(weights)(2)\n        w = weights{i};\n        sz = size(w);\n     \
  \   % Take transpose before reshaping\n        a = grads(start:start+sz(1)*sz(2)-1,\
  \ 1);\n        b = reshape(a, sz(2), sz(1));\n        weights1{i} = b';\n      \
  \  start = start + sz(1)*sz(2);\n        \n        b = biases{i};\n        sz =\
  \ size(b);\n        c = grads(start:start+sz(1)*sz(2)-1, 1);\n        d = reshape(c,\
  \ sz(2), sz(1));\n        biases1{i} = d';\n        start = start + sz(1)*sz(2);\n\
  \    endfor\nend\n```\n\n## 梯度检查\n\n### `gradient_check_n`\n\n执行梯度检查以验证反向传播实现的正确性。\n\
  \n```matlab\nfunction [difference] = gradient_check_n(weights, biases, gradsDW,\
  \ gradsDB, X, Y, epsilon=1e-7, outputActivationFunc=\"sigmoid\", numClasses)\n \
  \   % Convert cell array to vector\n    parameters_values = cellArray_to_vector(weights,\
  \ biases);\n    \n    % Convert gradient cell array to vector\n    grad = gradients_to_vector(gradsDW,\
  \ gradsDB);\n    \n    num_parameters = size(parameters_values)(1);\n    \n    %\
  \ Initialize\n    J_plus = zeros(num_parameters, 1);\n    J_minus = zeros(num_parameters,\
  \ 1);\n    gradapprox = zeros(num_parameters, 1);\n    \n    % Compute gradapprox\n\
  \    for i = 1:num_parameters\n        % Compute J_plus[i]. Inputs: \"parameters_values,\
  \ epsilon\". Output = \"J_plus[i]\".\n        thetaplus = parameters_values;\n \
  \       thetaplus(i, 1) = thetaplus(i, 1) + epsilon;\n        [weights1, biases1]\
  \ = vector_to_cellArray(weights, biases, thetaplus);\n        [AL, forward_caches,\
  \ activation_caches, droputMat] = forwardPropagationDeep(X', weights1, biases1,\
  \ keep_prob=1, hiddenActivationFunc=\"relu\", outputActivationFunc=outputActivationFunc);\n\
  \        J_plus(i) = computeCost(AL, Y', outputActivationFunc=outputActivationFunc,\
  \ numClasses);\n        \n        % Compute J_minus[i]. Inputs: \"parameters_values,\
  \ epsilon\". Output = \"J_minus[i]\".\n        thetaminus = parameters_values;\n\
  \        thetaminus(i, 1) = thetaminus(i, 1) - epsilon;\n        [weights1, biases1]\
  \ = vector_to_cellArray(weights, biases, thetaminus);\n        [AL, forward_caches,\
  \ activation_caches, droputMat] = forwardPropagationDeep(X', weights1, biases1,\
  \ keep_prob=1, hiddenActivationFunc=\"relu\", outputActivationFunc=outputActivationFunc);\n\
  \        J_minus(i) = computeCost(AL, Y', outputActivationFunc=outputActivationFunc,\
  \ numClasses);\n        \n        % Compute gradapprox[i]\n        gradapprox(i)\
  \ = (J_plus(i) - J_minus(i)) / (2*epsilon);\n    endfor\n    \n    % Compute L2Norm\n\
  \    numerator = L2NormVec(grad - gradapprox);\n    denominator = L2NormVec(grad)\
  \ + L2NormVec(gradapprox);\n    difference = numerator / denominator;\n    \n  \
  \  if difference > 1e-04\n        printf(\"There is a mistake in the implementation\
  \ \");\n        disp(difference);\n    else\n        printf(\"The implementation\
  \ works perfectly\");\n        disp(difference);\n    endif\n    \n    % This can\
  \ be used to compare the gradients from backprop and gradapprox\n    [weights1,\
  \ biases1] = vector_to_cellArray(weights, biases, grad);\n    printf(\"Gradients\
  \ from back propagation\");\n    disp(weights1);\n    disp(biases1);\n    \n   \
  \ [weights2, biases2] = vector_to_cellArray(weights, biases, gradapprox);\n    printf(\"\
  Gradients from gradient check\");\n    disp(weights2);\n    disp(biases2);\nend\n\
  ```\n\n### `L2NormVec`\n\n计算向量的 L2 范数。\n\n```matlab\nfunction [l2norm] = L2NormVec(x)\n\
  \    l2norm = sqrt(sum(x .^ 2));\nend\n```\n\n## 参考文献\n\n1. Deep Learning Specialization\
