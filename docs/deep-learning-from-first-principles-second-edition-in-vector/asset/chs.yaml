  \ Python、R 和 Octave 向量化实现正确。以下是“螺旋”数据集。\n\n```python\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\n\nexec(open(\"././DLfunctions41.py\").read())\n\n# Create\
  \ an input data set - Taken from CS231n Convolutional Neural networks\n# http://cs231n.github.io/neural-networks-case-study/\n\
  N = 100 # number of points per class\nD = 2 # dimensionality\nK = 3 # number of\
  \ classes\n```\n\n\n\n\n# 多类分类与 Softmax 实现\n\n## 数据生成与可视化\n\n```python\nX = np.zeros((N*K,D))\
  \ # data matrix (each row = single example)\ny = np.zeros(N*K, dtype='uint8') #\
  \ class labels\n\nfor j in range(K):\n    ix = range(N*j,N*(j+1))\n    r = np.linspace(0.0,1,N)\
  \ # radius\n    t = np.linspace(j*4,(j+1)*4,N) + np.random.randn(N)*0.2 # theta\n\
  \    X[ix] = np.c_[r*np.sin(t), r*np.cos(t)]\n    y[ix] = j\n\n# Plot the data\n\
  plt.scatter(X[:, 0], X[:, 1], c=y, s=40, cmap=plt.cm.Spectral)\nplt.savefig(\"fig1.png\"\
  , bbox_inches='tight')\n```\n\n![Image 247](img/index-142_1.jpg)\n\n向量化 Python、R\
  \ 和 Octave 代码的实现如下图所示\n\n![Image 248](img/index-143_1.jpg)\n\n## 2.1 使用 Softmax\
  \ 进行多类分类 – Python 代码\n\n一个简单的双层神经网络，包含单个隐藏层，隐藏层有 100 个 Relu 激活单元，输出层使用 Softmax 激活单元，用于多类分类。该深度学习网络绘制了如下所示的\
  \ 3 个类别的非线性边界。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  import os\n\nos.chdir(\"C:/junk/dl-4/dl-4\")\nexec(open(\"././DLfunctions41.py\"\
  ).read())\n\n# Read the input data\nN = 100 # number of points per class\nD = 2\
  \ # dimensionality\nK = 3 # number of classes\n\nX = np.zeros((N*K,D)) # data matrix\
  \ (each row = single example)\ny = np.zeros(N*K, dtype='uint8') # class labels\n\
  \n# Loop\nfor j in range(K):\n    ix = range(N*j,N*(j+1))\n    r = np.linspace(0.0,1,N)\
  \ # radius\n    t = np.linspace(j*4,(j+1)*4,N) + np.random.randn(N)*0.2 # theta\n\
  \    X[ix] = np.c_[r*np.sin(t), r*np.cos(t)]\n    y[ix] = j\n\n# Set the number\
  \ of features, hidden units in hidden layer and number of classes\nnumHidden = 100\
  \ # No of hidden units in hidden layer\nnumFeats = 2 # dimensionality\nnumOutput\
  \ = 3 # number of classes\n\n# Initialize the model\nparameters = initializeModel(numFeats,\
  \ numHidden, numOutput)\nW1 = parameters['W1']\nb1 = parameters['b1']\nW2 = parameters['W2']\n\
  b2 = parameters['b2']\n\n# Set the learning rate\nlearningRate = 0.6\n\n# Initialize\
  \ losses\nlosses = []\n\n# Perform Gradient descent\nfor i in range(10000):\n  \
  \  # Forward propagation through hidden layer with Relu units\n    A1, cache1 =\
  \ layerActivationForward(X.T, W1, b1, 'relu')\n    \n    # Forward propagation through\
  \ output layer with Softmax\n    A2, cache2 = layerActivationForward(A1, W2, b2,\
  \ 'softmax')\n    \n    # No of training examples\n    numTraining = X.shape[0]\n\
  \    \n    # Compute log probs. Take the log prob of correct class based on output\
  \ y\n    correct_logprobs = -np.log(A2[range(numTraining), y])\n    \n    # Compute\
  \ loss\n    loss = np.sum(correct_logprobs) / numTraining\n    \n    # Print the\
  \ loss\n    if i % 1000 == 0:\n        print(\"iteration %d: loss %f\" % (i, loss))\n\
  \    losses.append(loss)\n    \n    dA = 0\n    \n    # Backward propagation through\
  \ output layer with Softmax\n    dA1, dW2, db2 = layerActivationBackward(dA, cache2,\
  \ y, activationFunc='softmax')\n    \n    # Backward propagation through hidden\
  \ layer with Relu unit\n    dA0, dW1, db1 = layerActivationBackward(dA1.T, cache1,\
  \ y, activationFunc='relu')\n    \n    # Update paramaters with the learning rate\n\
  \    W1 += -learningRate * dW1\n    b1 += -learningRate * db1\n    W2 += -learningRate\
  \ * dW2.T\n    b2 += -learningRate * db2.T\n\n# Plot losses vs iterations\ni = np.arange(0,\
  \ 10000, 1000)\nplt.plot(i, losses)\nplt.xlabel('Iterations')\nplt.ylabel('Loss')\n\
  plt.title('Losses vs Iterations')\nplt.savefig(\"fig2.png\", bbox=\"tight\")\n\n\
