  ![Image 341](img/index-281_5.jpg)\n![Image 342](img/index-281_6.jpg)\n\n## 3.1.\
  \ 具有动量的随机梯度下降\n\n具有动量的随机梯度下降使用了上述的指数加权平均方法，因此比横向移动更快地进入峡谷。公式如下：\n\n其中 `v_dW` 和 `v_db`\
  \ 是动量项，它们与对应层 `l` 的相应梯度 `dW` 和 `db` 进行指数加权。\n\nR 语言中具有动量的随机梯度下降代码片段如下所示：\n\n```r\n\
  # 执行具有动量的梯度下降\n# 输入 : 权重和偏置\n#       : beta\n#       : 梯度\n#       : 学习率\n#    \
  \   : outputActivationFunc - 隐藏层的激活函数 sigmoid/softmax\n# 输出 : 1 次迭代后更新的权重\ngradientDescentWithMomentum\
  \ <- function(parameters, gradients, v, beta, learningRate, outputActivationFunc=\"\
  sigmoid\") {\n  L = length(parameters) / 2 # 神经网络中的层数\n\n  # 每个参数的更新规则。使用 for 循环。\n\
  \  for (l in 1:(L-1)) {\n    # 计算速度\n    # v['dWk'] = beta * v['dWk'] + (1-beta)\
  \ * dWk\n    v[[paste(\"dW\", l, sep=\"\")]] = beta * v[[paste(\"dW\", l, sep=\"\
  \")]] +\n      (1 - beta) * gradients[[paste('dW', l, sep=\"\")]]\n    v[[paste(\"\
  db\", l, sep=\"\")]] = beta * v[[paste(\"db\", l, sep=\"\")]] +\n      (1 - beta)\
  \ * gradients[[paste('db', l, sep=\"\")]]\n\n    # 使用速度更新参数\n    parameters[[paste(\"\
  W\", l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] -\n      learningRate\
  \ * v[[paste(\"dW\", l, sep=\"\")]]\n    parameters[[paste(\"b\", l, sep=\"\")]]\
  \ = parameters[[paste(\"b\", l, sep=\"\")]] -\n      learningRate * v[[paste(\"\
  db\", l, sep=\"\")]]\n  }\n\n  # 如果输出激活函数是 sigmoid，则计算第 L 层\n  if (outputActivationFunc\
  \ == \"sigmoid\") {\n    v[[paste(\"dW\", L, sep=\"\")]] = beta * v[[paste(\"dW\"\
  , L, sep=\"\")]] +\n      (1 - beta) * gradients[[paste('dW', L, sep=\"\")]]\n \
  \   v[[paste(\"db\", L, sep=\"\")]] = beta * v[[paste(\"db\", L, sep=\"\")]] +\n\
  \      (1 - beta) * gradients[[paste('db', L, sep=\"\")]]\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] -\n      learningRate\
  \ * v[[paste(\"dW\", l, sep=\"\")]]\n    parameters[[paste(\"b\", L, sep=\"\")]]\
  \ = parameters[[paste(\"b\", L, sep=\"\")]] -\n      learningRate * v[[paste(\"\
  db\", l, sep=\"\")]]\n  } else if (outputActivationFunc == \"softmax\") { # 如果输出激活函数是\
  \ Softmax\n    v[[paste(\"dW\", L, sep=\"\")]] = beta * v[[paste(\"dW\", L, sep=\"\
  \")]] +\n      (1 - beta) * t(gradients[[paste('dW', L, sep=\"\")]])\n    v[[paste(\"\
  db\", L, sep=\"\")]] = beta * v[[paste(\"db\", L, sep=\"\")]] +\n      (1 - beta)\
  \ * t(gradients[[paste('db', L, sep=\"\")]])\n    parameters[[paste(\"W\", L, sep=\"\
  \")]] = parameters[[paste(\"W\", L, sep=\"\")]] -\n      learningRate * t(gradients[[paste(\"\
  dW\", L, sep=\"\")]])\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] -\n      learningRate * t(gradients[[paste(\"db\", L, sep=\"\
  \")]])\n  }\n  return(parameters)\n}\n```\n\n### 3.1a. 具有动量的随机梯度下降 – Python\n\n\
