  plt.clf()\nplt.close()\n```\n\n# 创建随机小批量\n\n**输入：**\n- `X` - 输入特征\n- `Y` - 输出\n\
  - `miniBatchSize`\n- `seed`\n\n**输出：** `mini_batches`\n\n```python\ndef random_mini_batches(X,\
  \ Y, miniBatchSize=64, seed=0):\n    np.random.seed(seed)\n\n    # 获取训练样本数量\n  \
  \  m = X.shape[1]\n\n    # 初始化小批量\n    mini_batches = []\n\n    # 创建一个小于 m 的随机数列表\n\
  \    permutation = list(np.random.permutation(m))\n\n    # 随机打乱训练数据\n    shuffled_X\
  \ = X[:, permutation]\n    shuffled_Y = Y[:, permutation].reshape((1, m))\n\n  \
  \  # 计算小批量的数量\n    numCompleteMinibatches = math.floor(m / miniBatchSize)\n\n  \
  \  # 遍历小批量的数量\n    for k in range(0, numCompleteMinibatches):\n        # 设置每个小批量的开始和结束\n\
  \        mini_batch_X = shuffled_X[:, k * miniBatchSize: (k + 1) * miniBatchSize]\n\
  \        mini_batch_Y = shuffled_Y[:, k * miniBatchSize: (k + 1) * miniBatchSize]\n\
  \        mini_batch = (mini_batch_X, mini_batch_Y)\n        mini_batches.append(mini_batch)\n\
  \n    # 如果 m % miniBatchSize != 0：批量不能被小批量大小整除\n    if m % miniBatchSize != 0:\n\
  \        l = math.floor(m / miniBatchSize) * miniBatchSize\n\n        # 设置最后一个小批量的开始和结束\n\
  \        m = l + m % miniBatchSize\n        mini_batch_X = shuffled_X[:, l:m]\n\
  \        mini_batch_Y = shuffled_Y[:, l:m]\n        mini_batch = (mini_batch_X,\
  \ mini_batch_Y)\n        mini_batches.append(mini_batch)\n\n    return mini_batches\n\
  ```\n\n# 绘制决策边界\n\n**输入：**\n- 输入模型\n- `X`\n- `Y`\n- `sz` - 隐藏单元数量\n- `lr` - 学习率\n\
