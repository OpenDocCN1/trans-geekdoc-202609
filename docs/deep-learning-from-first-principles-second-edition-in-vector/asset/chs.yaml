  \ => 原始字典\n\n# 将权重、偏置字典转换为向量\n\n**输入：** 参数字典\n**返回：** 向量\n\n```python\ndef dictionary_to_vector(parameters):\n\
  \    \"\"\"\n    将所有参数字典展开为满足特定所需形状的单个向量。\n    \"\"\"\n    keys = []\n    count\
  \ = 0\n\n    for key in parameters:\n        # 展平参数\n        new_vector = np.reshape(parameters[key],\
  \ (-1, 1))\n        keys = keys + [key] * new_vector.shape[0]\n\n        if count\
  \ == 0:\n            theta = new_vector\n        else:\n            theta = np.concatenate((theta,\
  \ new_vector), axis=0)\n\n        count = count + 1\n\n    return theta, keys\n\
  ```\n\n# 将梯度字典转换为向量\n\n**输入：**\n- `parameters`\n- `gradients`（梯度字典）\n\n**返回：** 梯度向量\n\
  \n```python\ndef gradients_to_vector(parameters, gradients):\n```\n\n\n\n\n# 将所有梯度字典展平为满足特定所需形状的单个向量。\n\
  \n```python\nkeyvals = []\n\nL = len(parameters) // 2\n\ncount = 0\n\nfor l in range(L):\n\
  \    # 展平参数\n    keyvals.append('dW' + str(l + 1))\n    keyvals.append('db' + str(l\
  \ + 1))\n\nfor key in keyvals:\n    new_vector = np.reshape(gradients[key], (-1,\
  \ 1))\n    if count == 0:\n        theta = new_vector\n    else:\n        theta\
  \ = np.concatenate((theta, new_vector), axis=0)\n    count = count + 1\n\nreturn\
  \ theta\n```\n\n# 将向量转换为字典\n\n**输入**：`parameters`，`theta`\n\n**返回**：`parameters1`（字典）\n\
  \n```python\ndef vector_to_dictionary(parameters, theta):\n    # 从满足特定所需形状的单个向量中展开所有参数字典。\n\
  \    start = 0\n    parameters1 = {}\n\n    # 遍历键\n    for key in parameters:\n\
  \        (a, b) = parameters[key].shape\n        # 创建字典\n        parameters1[key]\
  \ = theta[start:start + a * b].reshape((a, b))\n        start = start + a * b\n\n\
  \    return parameters1\n```\n\n# 将向量转换为字典\n\n**输入**：`parameters`，`theta`\n\n**返回**：`parameters1`（字典）\n\
  \n```python\ndef vector_to_dictionary2(parameters, theta):\n    # 从满足特定所需形状的单个向量中展开所有参数字典。\n\
  \    start = 0\n    parameters2 = {}\n\n    # 遍历键\n    for key in parameters:\n\
  \        (a, b) = parameters[key].shape\n        # 创建键值对\n        parameters2['d'\
  \ + key] = theta[start:start + a * b].reshape((a, b))\n        start = start + a\
  \ * b\n\n    return parameters2\n```\n\n# 执行梯度检查\n\n**输入**：`parameters`，`gradients`，`train_X`，`train_Y`，`epsilon`，`outputActivationFunc`\n\
  \n**返回**：None\n\n```python\ndef gradient_check_n(parameters, gradients, train_X,\
  \ train_Y, epsilon=1e-7, outputActivationFunc=\"sigmoid\"):\n    # 设置变量\n    parameters_values,\
  \ _ = dictionary_to_vector(parameters)\n    grad = gradients_to_vector(parameters,\
  \ gradients)\n    num_parameters = parameters_values.shape[0]\n\n    J_plus = np.zeros((num_parameters,\
  \ 1))\n    J_minus = np.zeros((num_parameters, 1))\n    gradapprox = np.zeros((num_parameters,\
  \ 1))\n\n    # 使用双侧导数计算 gradapprox\n    for i in range(num_parameters):\n      \
  \  # 计算 J_plus[i]。输入：\"parameters_values, epsilon\"。输出 = \"J_plus[i]\"。\n      \
  \  thetaplus = np.copy(parameters_values)\n        thetaplus[i][0] = thetaplus[i][0]\
  \ + epsilon\n        AL, caches, dropoutMat = forwardPropagationDeep(train_X,\n\
  \                                                        vector_to_dictionary(parameters,\
  \ thetaplus), keep_prob=1,\n                                                   \
  \     hiddenActivationFunc=\"relu\", outputActivationFunc=outputActivationFunc)\n\
  \        J_plus[i] = computeCost(AL, train_Y, outputActivationFunc=outputActivationFunc)\n\
  \n        # 计算 J_minus[i]。输入：\"parameters_values, epsilon\"。输出 = \"J_minus[i]\"\
  。\n        thetaminus = np.copy(parameters_values)\n        thetaminus[i][0] = thetaminus[i][0]\
  \ - epsilon\n        AL, caches, dropoutMat = forwardPropagationDeep(train_X,\n\
  \                                                        vector_to_dictionary(parameters,\
  \ thetaminus), keep_prob=1,\n                                                  \
  \      hiddenActivationFunc=\"relu\", outputActivationFunc=outputActivationFunc)\n\
  \        J_minus[i] = computeCost(AL, train_Y, outputActivationFunc=outputActivationFunc)\n\
  \n        # 计算 gradapprox[i]\n        gradapprox[i] = (J_plus[i] - J_minus[i]) /\
  \ (2 * epsilon)\n\n    # 通过计算差值，将 gradapprox 与反向传播梯度进行比较。\n    numerator = np.linalg.norm(grad\
  \ - gradapprox)\n    denominator = np.linalg.norm(grad) + np.linalg.norm(gradapprox)\n\
  \    difference = numerator / denominator\n\n    if difference > 1e-5:\n       \
  \ print(\"\\033[93m\" + \"反向传播中存在错误! difference = \" + str(difference) + \"\\033[0m\"\
  )\n    else:\n        print(\"\\033[92m\" + \"你的反向传播工作完美! difference = \" + str(difference)\
  \ + \"\\033[0m\")\n\n    print(difference)\n    print(\"\\n\")\n\n    # 将 grad 转换为字典\n\
  \    m = vector_to_dictionary2(parameters, grad)\n    print(\"来自反向传播的梯度\")\n   \
  \ print(m)\n    print(\"\\n\")\n\n    # 将 gradapprox 转换为字典\n    n = vector_to_dictionary2(parameters,\
  \ gradapprox)\n    print(\"来自梯度检查的 Gradapprox\")\n    print(n)\n```\n\n### 8.2 R\n\
