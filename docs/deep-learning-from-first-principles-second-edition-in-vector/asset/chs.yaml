  \                                hiddenActivationFunc=\"relu\", outputActivationFunc=outputActivationFunc)\n\
  \n        # 正则化参数为 0\n        if lambd == 0:\n            # 计算成本\n            cost\
  \ = computeCost(parameters, AL, Y1, outputActivationFunc=outputActivationFunc)\n\
  \        # 包含 L2 正则化\n        else:\n            # 计算成本\n            cost = computeCostWithReg(parameters,\
  \ AL, Y1, lambd, outputActivationFunc=outputActivationFunc)\n\n        # 反向传播。\n\
  \        gradients = backwardPropagationDeep(AL, Y1, caches, dropoutMat, lambd,\
  \ keep_prob,\n                                            hiddenActivationFunc=\"\
  relu\", outputActivationFunc=outputActivationFunc)\n\n        # 更新参数。\n        parameters\
  \ = gradientDescent(parameters, gradients, learningRate=learningRate, outputActivationFunc=outputActivationFunc)\n\
  \n        # 每 1000 次训练迭代打印一次成本\n        if print_cost and i % 1000 == 0:\n     \
  \       print(\"Cost after iteration %i: %f\" % (i, cost))\n\n        if print_cost\
  \ and i % 1000 == 0:\n            costs.append(cost)\n\n    # 绘制成本曲线\n    plt.plot(np.squeeze(costs))\n\
