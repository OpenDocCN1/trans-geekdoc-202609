  \ – Octave 代码\n\n在 Octave 中构建了一个带有 Softmax 激活单元的 2 层神经网络。同样使用螺旋数据集 (`spiral.csv`)\
  \ 进行 Octave 实现。\n\n```octave\nsource(\"DL41functions.m\")\n\n# 读取螺旋数据\ndata = csvread(\"\
  spiral.csv\");\n\n# 设置数据\nX = data(:,1:2);\nY = data(:,3);\n\n# 设置特征数量、隐藏层隐藏单元数量和类别数量\n\
  numFeats = 2;    # 特征数量\nnumHidden = 100; # 隐藏单元数量\nnumOutput = 3;   # 类别数量\n\n\
  # 初始化模型\n[W1 b1 W2 b2] = initializeModel(numFeats,numHidden,numOutput);\n\n# 初始化损失\n\
  losses = [];\n\n# 初始化学习率\nlearningRate = 0.5;\n\nfor k = 1:10000\n    # 通过带有 Relu\
  \ 单元的隐藏层进行前向传播\n    [A1, cache1, activation_cache1] = layerActivationForward(X',\
  \ W1, b1, activationFunc='relu');\n\n    # 通过带有 Softmax 单元的输出层进行前向传播\n    [A2, cache2,\
  \ activation_cache2] = layerActivationForward(A1, W2, b2, activationFunc='softmax');\n\
  \n    # 训练样本数量\n    numTraining = size(X)(1);\n\n    # 选择 Y=0,1,2 的行并连接成一个长向量\n\
  \    a = [A2(Y==0,1) ; A2(Y==1,2) ; A2(Y==2,3)];\n\n    # 选择正确的列以获取对数概率\n    correct_probs\
  \ = -log(a);\n\n    # 计算对数损失\n    loss = sum(correct_probs) / numTraining;\n\n \
  \   if (mod(k,1000) == 0)\n        disp(loss);\n        losses = [losses loss];\n\
  \    endif\n\n    dA = 0;\n\n    # 通过带有 Softmax 单元的输出层进行反向传播\n    [dA1, dW2, db2]\
  \ = layerActivationBackward(dA, cache2, activation_cache2, Y, activationFunc='softmax');\n\
  \n    # 通过带有 Relu 单元的隐藏层进行反向传播\n    [dA0, dW1, db1] = layerActivationBackward(dA1',\
  \ cache1, activation_cache1, Y, activationFunc='relu');\n\n    # 更新参数\n    W1 +=\
  \ -learningRate * dW1;\n    b1 += -learningRate * db1;\n    W2 += -learningRate\
  \ * dW2';\n    b2 += -learningRate * db2';\nendfor\n\n# 绘制损失与迭代次数关系图\niterations\
  \ = 0:1000:9000\nplotCostVsIterations(iterations, losses)\n\n# 绘制决策边界\nplotDecisionBoundary(X,\
  \ Y, W1, b1, W2, b2)\n```\n\n![Image 255](img/index-158_1.jpg)\n![Image 256](img/index-159_1.jpg)\n\
