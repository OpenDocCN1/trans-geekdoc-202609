  \n### 2. 数值稳定的 Softmax\n\nSoftmax 函数可能因大指数的除法而导致数值不稳定。为解决此问题，我们必须按如下方式实现稳定的 Softmax\
  \ 函数。\n\n因此：\n\n此处 `D` 可以是任意值。常见的选择是：\n\n以下是 Python 中稳定 Softmax 的实现：\n\n```python\n\
  # 一个数值稳定的 Softmax 实现\ndef stableSoftmax(Z):\n    # 以数值稳定的方式计算向量 x 的 softmax。\n \
  \   shiftZ = Z.T - np.max(Z.T, axis=1).reshape(-1,1)\n    exp_scores = np.exp(shiftZ)\n\
  \    # 对每个样本进行归一化\n    A = exp_scores / np.sum(exp_scores, axis=1, keepdims=True)\n\
  \    cache = Z\n    return A, cache\n```\n\n在尝试用 3 种语言创建一个通用的 L 层深度学习网络时，我发现确保模型在较小数据集上正确执行非常有用。在设置矩阵时可能会遇到许多问题，这使得调试变得极其困难。因此，在本文中，我在运行\
  \ MNIST 通用模型之前，先在每种语言中用我之前文章（第 3 章和第 4 章）中使用的 2 个较小数据集运行模型。\n\n\n\n\n此处有个公正的警告：如果你认为仅凭一些机器学习的基础知识就能直接深入深度学习，那你肯定会遇到严重的问题。此外，你的知识体系将是不完整的。你必须对机器学习和统计学习、各种算法、用于选择模型的度量和指标等有良好的掌握。如果你精通所有机器学习模型、机器学习概念、验证技术、分类指标等，将会大有裨益。请查阅互联网/书籍以获取背景知识。\n\
