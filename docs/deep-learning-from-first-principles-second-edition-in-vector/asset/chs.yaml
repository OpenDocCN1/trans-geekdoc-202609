  relu\")\n```\n\n# 4a. 使用 MNIST 进行二分类 – Python 代码\n\n最后，我使用 MNIST 手写数字进行简单分类，根据 Geoffrey\
  \ Hinton 教授的说法，这是“深度学习的果蝇”。\n\n\n\n\n\n# 使用 MNIST 进行二分类\n\n读取 MNIST 数据的 Python 代码取自\
