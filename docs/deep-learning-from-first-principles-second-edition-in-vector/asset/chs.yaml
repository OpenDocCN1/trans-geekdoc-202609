  \ = [2, 7, 1]\n\n# Train a L-layer deep learning network with He initialization\n\
  # hidden Activation function – relu\n# output activation function – sigmoid\n# learning\
  \ rate – 0.6\nparameters = L_Layer_DeepModel(train_X, train_Y, layersDimensions,\
  \ hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\", learningRate=0.6,\
  \ num_iterations=10000, initType=\"He\", print_cost=True, figure=\"fig3.png\")\n\
