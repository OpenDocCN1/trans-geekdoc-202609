  \n**输出**：小批量 `X` 和 `Y`\n\n```matlab\nfunction [mini_batches_X, mini_batches_Y] =\
  \ random_mini_batches(X, Y, miniBatchSize = 64, seed = 0)\n    rand(\"seed\", seed);\n\
  \    \n    % 获取训练样本数量\n    m = size(X)(2);\n    \n    % 创建一个小于 m 的随机数列表\n    permutation\
  \ = randperm(m);\n    \n    % 随机打乱训练数据\n    shuffled_X = X(:, permutation);\n  \
  \  shuffled_Y = Y(:, permutation);\n    \n    % 计算小批量数量\n    numCompleteMinibatches\
  \ = floor(m / miniBatchSize);\n    \n    batch = 0;\n    for k = 0:(numCompleteMinibatches\
  \ - 1)\n        % 设置每个小批量的开始和结束\n        batch = batch + 1;\n        lower = (k\
  \ * miniBatchSize) + 1;\n        upper = (k + 1) * miniBatchSize;\n        \n  \
  \      mini_batch_X = shuffled_X(:, lower:upper);\n        mini_batch_Y = shuffled_Y(:,\
  \ lower:upper);\n        \n        % 创建元胞数组\n        mini_batches_X{batch} = mini_batch_X;\n\
  \        mini_batches_Y{batch} = mini_batch_Y;\n    endfor\n    \n    % 如果批量大小不能被小批量数量整除\n\
  \    if mod(m, miniBatchSize) != 0\n        % 设置最后一个小批量的开始和结束\n        l = floor(m\
  \ / miniBatchSize) * miniBatchSize;\n        m = l + mod(m, miniBatchSize);\n  \
  \      \n        mini_batch_X = shuffled_X(:, (l + 1):m);\n        mini_batch_Y\
  \ = shuffled_Y(:, (l + 1):m);\n        \n        batch = batch + 1;\n        mini_batches_X{batch}\
  \ = mini_batch_X;\n        mini_batches_Y{batch} = mini_batch_Y;\n    endif\nend\n\
