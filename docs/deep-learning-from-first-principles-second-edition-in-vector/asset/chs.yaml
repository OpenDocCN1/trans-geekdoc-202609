  , L, sep=\"\")]] = beta1 * v[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta1)\
  \ * t(gradients[[paste('dW', L, sep=\"\")]])\n    v[[paste(\"db\", L, sep=\"\")]]\
