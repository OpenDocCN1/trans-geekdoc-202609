  \n## 2.1b 正则化：螺旋数据 – Python\n\n```python\nimport numpy as np\nimport matplotlib\n\
  import matplotlib.pyplot as plt\nimport sklearn.linear_model\nimport pandas as pd\n\
  import sklearn\nimport sklearn.datasets\n\nexec(open(\"DLfunctions61.py\").read())\n\
  \nN = 100 # 每个类别的点数\nD = 2 # 维度\nK = 3 # 类别数量\n\nX = np.zeros((N*K, D)) # 数据矩阵（每行\
