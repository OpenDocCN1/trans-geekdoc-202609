  \n# 第 L 层使用 sigmoid 激活函数\n\n`forwardPropagationDeep <- function(X, parameters,keep_prob=1,\
  \ hiddenActivationFunc='relu',`\n\n`outputActivationFunc='sigmoid'){`\n\n`caches\
  \ <- list()`\n\n`dropoutMat <- list()`\n\n`# 将 A 设为 X (A0)`\n\n`A <- X`\n\n`L <-\
  \ length(parameters)/2 # 神经网络中的层数`\n\n`# 从第 1 层循环到第 L 层`\n\n`for(l in 1:(L-1)){`\n\
  \n`A_prev <- A`\n\n`# Zi = Wi x Ai-1 + bi and Ai = g(Zi)`\n\n`# 设置第 'l' 层的 W 和 b`\n\
  \n`# 从 W1,W2... WL-1 循环`\n\n`W <- parameters[[paste(\"W\",l,sep=\"\")]]`\n\n`b <-\
  \ parameters[[paste(\"b\",l,sep=\"\")]]`\n\n`# 使用激活函数计算第 'l' 层的前向传播`\n\n`actForward\
  \ <- layerActivationForward(A_prev,`\n\n`W,`\n\n`b,`\n\n`activationFunc = hiddenActivationFunc)`\n\
  \n`A <- actForward[['A']]`\n\n`# 追加缓存 A_prev,W,b, Z`\n\n`caches[[l]] <-actForward`\n\
  \n`# 随机丢弃一些激活单元`\n\n`# 创建一个与 A 形状相同的矩阵`\n\n`set.seed(1)`\n\n`i=dim(A)[1]`\n\n`j=dim(A)[2]`\n\
  \n`a<-rnorm(i*j)`\n\n`# 将 a 归一化到 0 和 1 之间`\n\n`a = (a - min(a))/(max(a) - min(a))`\n\
  \n`# 创建 D 矩阵`\n\n`D <- matrix(a,nrow=i, ncol=j)`\n\n`# 找出小于等于 keep_prob 的 D`\n\n\
  `D <- D < keep_prob`\n\n`# 移除一些 A`\n\n`A <- A * D`\n\n`# 除以 keep_prob 以保持期望值不变`\n\
  \n`A <- A/keep_prob`\n\n`dropoutMat[[paste(\"D\",l,sep=\"\")]] <- D`\n\n`}`\n\n\
  `# 因为这是二分类，所以在`\n\n`# 最后一层使用 sigmoid 激活函数`\n\n`# 设置最后一层的权重和偏置`\n\n`W <- parameters[[paste(\"\
  W\",L,sep=\"\")]]`\n\n`b <- parameters[[paste(\"b\",L,sep=\"\")]]`\n\n`# 最后一层`\n\
  \n`actForward = layerActivationForward(A, W, b, activationFunc =`\n\n`outputActivationFunc)`\n\
  \n`AL <- actForward[['A']]`\n\n`# 追加通过最后一层前向传播的输出`\n\n`caches[[L]] <- actForward`\n\
  \n`# 创建最终输出和缓存的列表`\n\n`fwdPropDeep <- list(\"AL\"=AL,\"caches\"=caches,\"dropoutMat\"\
  =dropoutMat)`\n\n`return(fwdPropDeep)`\n\n`}`\n\n# 函数 `pickColumns()`。此函数在 `computeCost()`\
  \ 中\n\n# 选取列\n\n# 输入：`AL`\n\n# ：`Y`\n\n# ：`numClasses`\n\n\n\n\n\n# 输出：a\n\n```r\n\
  pickColumns <- function(AL, Y, numClasses) {\n  if (numClasses == 3) {\n    a =\
  \ c(AL[Y == 0, 1], AL[Y == 1, 2], AL[Y == 2, 3])\n  } else if (numClasses == 10)\
  \ {\n    a = c(AL[Y == 0, 1], AL[Y == 1, 2], AL[Y == 2, 3], AL[Y == 3, 4], AL[Y\
  \ == 4, 5],\n          AL[Y == 5, 6], AL[Y == 6, 7], AL[Y == 7, 8], AL[Y == 8, 9],\
  \ AL[Y == 9, 10])\n  }\n  return(a)\n}\n```\n\n# 计算成本\n\n**输入**：\n- `AL`：最后一层的激活值\n\
  - `Y`：来自数据的输出\n- `outputActivationFunc`：隐藏层的激活函数 sigmoid/softmax\n- `numClasses`\n\
  \n**输出**：cost\n\n```r\ncomputeCost <- function(AL, Y, outputActivationFunc = \"\
  sigmoid\", numClasses = 3) {\n  if (outputActivationFunc == \"sigmoid\") {\n   \
  \ m = length(Y)\n    cost = -1 / m * sum(Y * log(AL) + (1 - Y) * log(1 - AL))\n\
  \  } else if (outputActivationFunc == \"softmax\") {\n    # 选择 y 值为 0、1 或 2 的元素并生成一个向量\n\
  \    # 选取列\n    # a = c(AL[Y == 0, 1], AL[Y == 1, 2], AL[Y == 2, 3])\n    m = length(Y)\n\
  \    a = pickColumns(AL, Y, numClasses)\n    # a = c(A2[y = k, k + 1])\n    # 取对数\n\
  \    correct_probs = -log(a)\n    # 计算损失\n    cost = sum(correct_probs) / m\n  }\n\
  \  return(cost)\n}\n```\n\n# 计算带正则化的成本\n\n**输入**：\n- `parameters`\n- `AL`：最后一层的激活值\n\
  - `Y`：来自数据的输出\n- `lambd`\n- `outputActivationFunc`：隐藏层的激活函数 sigmoid/softmax\n- `numClasses`\n\
  \n**输出**：cost\n\n```r\ncomputeCostWithReg <- function(parameters, AL, Y, lambd,\n\
  \                               outputActivationFunc = \"sigmoid\", numClasses =\
  \ 3) {\n  if (outputActivationFunc == \"sigmoid\") {\n    m = length(Y)\n    cost\
  \ = -1 / m * sum(Y * log(AL) + (1 - Y) * log(1 - AL))\n    # 正则化成本\n    L <- length(parameters)\
  \ / 2\n    L2RegularizationCost = 0\n    for (l in 1:L) {\n      L2RegularizationCost\
  \ = L2RegularizationCost +\n        sum(parameters[[paste(\"W\", l, sep = \"\")]]\
  \ ^ 2)\n    }\n    L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \    cost = cost + L2RegularizationCost\n  } else if (outputActivationFunc == \"\
  softmax\") {\n    # 选择 y 值为 0、1 或 2 的元素并生成一个向量\n    # 选取列\n    # a = c(AL[Y == 0,\
  \ 1], AL[Y == 1, 2], AL[Y == 2, 3])\n    m = length(Y)\n    a = pickColumns(AL,\
  \ Y, numClasses)\n    # a = c(A2[y = k, k + 1])\n    # 取对数\n    correct_probs =\
  \ -log(a)\n    # 计算损失\n    cost = sum(correct_probs) / m\n    # 正则化成本\n    L <-\
  \ length(parameters) / 2\n    L2RegularizationCost = 0\n    # 添加 L2 范数\n    for\
  \ (l in 1:L) {\n      L2RegularizationCost = L2RegularizationCost +\n        sum(parameters[[paste(\"\
  W\", l, sep = \"\")]] ^ 2)\n    }\n    L2RegularizationCost = (lambd / (2 * m))\
  \ * L2RegularizationCost\n    cost = cost + L2RegularizationCost\n  }\n  return(cost)\n\
  }\n```\n\n# 计算通过一层的反向传播\n\n**输入**：\n- `dA`：神经网络参数\n- `cache`：forward_cache 与 activation_cache\n\
  - `Y`：输出值\n- `activationFunc`\n- `numClasses`\n\n**返回**：梯度\n\n- `dL/dWi = dL/dZi\
  \ * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev = dL/dZl * W`\n\n```r\nlayerActivationBackward\
  \ <- function(dA, cache, Y, activationFunc, numClasses) {\n  # 获取 A_prev, W, b\n\
  \  forward_cache <- cache[['forward_cache']]\n  activation_cache <- cache[['activation_cache']]\n\
  \  A_prev <- forward_cache[['A_prev']]\n  numtraining = dim(A_prev)[2]\n  # 获取 Z\n\
  \  activation_cache <- cache[['activation_cache']]\n  if (activationFunc == \"relu\"\
  ) {\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if (activationFunc\
  \ == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, Y, numtraining, numClasses)\n  }\n  if (activationFunc == 'softmax')\
  \ {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n    dW = 1 /\
  \ numtraining * A_prev %*% dZ\n    db = 1 / numtraining * matrix(colSums(dZ), nrow\
  \ = 1, ncol = numClasses)\n    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n\
  \    b <- forward_cache[['b']]\n    numtraining = dim(A_prev)[2]\n    dW = 1 / numtraining\
  \ * dZ %*% t(A_prev)\n    db = 1 / numtraining * rowSums(dZ)\n    dA_prev = t(W)\
  \ %*% dZ\n  }\n  retvals <- list(\"dA_prev\" = dA_prev, \"dW\" = dW, \"db\" = db)\n\
  \  return(retvals)\n}\n```\n\n# 计算带正则化的通过一层的反向传播\n\n**输入**：\n- `dA`：神经网络参数\n- `cache`：forward_cache\
  \ 与 activation_cache\n- `Y`：输出值\n- `lambd`\n- `activationFunc`\n- `numClasses`\n\
  \n**返回**：梯度\n\n- `dL/dWi = dL/dZi * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev =\
  \ dL/dZl * W`\n\n```r\nlayerActivationBackwardWithReg <- function(dA, cache, Y,\
  \ lambd, activationFunc, numClasses) {\n  # 获取 A_prev, W, b\n  forward_cache <-\
  \ cache[['forward_cache']]\n  activation_cache <- cache[['activation_cache']]\n\
  \  A_prev <- forward_cache[['A_prev']]\n  numtraining = dim(A_prev)[2]\n  # 获取 Z\n\
  \  activation_cache <- cache[['activation_cache']]\n  if (activationFunc == \"relu\"\
  ) {\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if (activationFunc\
  \ == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, Y, numtraining, numClasses)\n  }\n  if (activationFunc == 'softmax')\
  \ {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n    # 添加正则化因子\n\
  \    dW = 1 / numtraining * A_prev %*% dZ + (lambd / numtraining) * t(W)\n    db\
  \ = 1 / numtraining * matrix(colSums(dZ), nrow = 1, ncol = numClasses)\n    dA_prev\
  \ = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n\
  \    numtraining = dim(A_prev)[2]\n    # 添加正则化因子\n    dW = 1 / numtraining * dZ\
  \ %*% t(A_prev) + (lambd / numtraining) * W\n    db = 1 / numtraining * rowSums(dZ)\n\
  \    dA_prev = t(W) %*% dZ\n  }\n  retvals <- list(\"dA_prev\" = dA_prev, \"dW\"\
  \ = dW, \"db\" = db)\n  return(retvals)\n}\n```\n\n# 计算通过所有层 1 个周期的反向传播\n\n**输入**：\n\
  - `AL`：L 层网络的输出 - 权重\n- `Y`：真实输出\n- `caches`：包含以下内容的缓存列表：\n  - 每个 `layerActivationForward()`\
  \ 的缓存，激活函数为 \"relu\"/\"tanh\"（即 `caches[l]`，l 的范围为 L-1，也就是 l = 0...L-2）\n  - `layerActivationForward()`\
  \ 的缓存，激活函数为 \"sigmoid\"（即 `caches[L-1]`）\n- `dropoutMat`\n- `lambd`\n- `keep_prob`\n\
  - `hiddenActivationFunc`：隐藏层的激活函数 - relu/tanh/sigmoid\n- `outputActivationFunc`：隐藏层的激活函数\
  \ sigmoid/softmax\n- `numClasses`\n\n**返回**：\n- `gradients`：包含梯度的字典\n  - `gradients[\"\
  dA\" + str(l)]`\n  - `gradients[\"dW\" + str(l)]`\n  - `gradients[\"db\" + str(l)]`\n\
  \n```r\nbackwardPropagationDeep <- function(AL, Y, caches, dropoutMat, lambd = 0,\
  \ keep_prob = 0, hiddenActivationFunc = 'relu',\n                              \
  \      outputActivationFunc = \"sigmoid\", numClasses) {\n  # 初始化梯度\n  gradients\
  \ = list()\n  # 设置层数\n  L = length(caches)\n  numTraining = dim(AL)[2]\n  if (outputActivationFunc\
  \ == \"sigmoid\")\n    # 初始化反向传播\n    # dl/dAL = -(y/a) - ((1-y)/(1-a)) - 在输出层\n\
  \    dAL = -((Y / AL) - (1 - Y) / (1 - AL))\n  else if (outputActivationFunc ==\
  \ \"softmax\") {\n    dAL = 0\n    Y = t(Y)\n  }\n  # 获取最后一层的梯度\n  # 输入：\"AL, Y,\
  \ caches\"。\n  # 输出：\"gradients[\"dAL\"], gradients[\"dWL\"], gradients[\"dbL\"\
  ]\n  # 从第 L 层开始\n  # 获取当前缓存\n  current_cache = caches[[L]]$cache\n  if (lambd ==\
  \ 0) {\n    retvals <- layerActivationBackward(dAL, current_cache, Y, activationFunc\
  \ = outputActivationFunc, numClasses)\n  } else {\n    retvals = layerActivationBackwardWithReg(dAL,\
  \ current_cache, Y, lambd, activationFunc = outputActivationFunc, numClasses)\n\
  \  }\n  # 注意：对 dA 进行转置\n  if (outputActivationFunc == \"sigmoid\")\n    gradients[[paste(\"\
  dA\", L, sep = \"\")]] <- retvals[['dA_prev']]\n  else if (outputActivationFunc\
  \ == \"softmax\")\n    gradients[[paste(\"dA\", L, sep = \"\")]] <- t(retvals[['dA_prev']])\n\
  \  gradients[[paste(\"dW\", L, sep = \"\")]] <- retvals[['dW']]\n  gradients[[paste(\"\
  db\", L, sep = \"\")]] <- retvals[['db']]\n  # 反向遍历\n  for (l in (L - 1):1) {\n\
  \    # 计算 L-1 到 1 层的梯度，激活函数为 Relu/tanh\n    # 输入：\"gradients[\"dA\" + str(l + 2)],\
  \ caches\"。\n  }\n}\n```\n\n\n\n\n\n# 输出\n\n`gradients[\"dA\" + str(l + 1)]`, `gradients[\"\
  dW\" + str(l + 1)]`, `gradients[\"db\" + str(l + 1)]`\n\n```r\ncurrent_cache = caches[[l]]$cache\n\
  \nif (lambd == 0) {\n  cat(\"l=\", l)\n  # 获取 dropout 矩阵\n  D <- dropoutMat[[paste(\"\
  D\", l, sep=\"\")]]\n  # 将梯度与 dropout 矩阵相乘\n  gradients[[paste('dA', l+1, sep=\"\
  \")]] = gradients[[paste('dA', l+1, sep=\"\")]] * D\n  # 除以 keep_prob 以保持期望值不变\n\
  \  gradients[[paste('dA', l+1, sep=\"\")]] = gradients[[paste('dA', l+1, sep=\"\"\
  )]] / keep_prob\n  retvals = layerActivationBackward(gradients[[paste('dA', l+1,\
  \ sep=\"\")]], current_cache, Y,\n                                    activationFunc\
  \ = hiddenActivationFunc)\n} else {\n  retvals = layerActivationBackwardWithReg(gradients[[paste('dA',\
  \ l+1, sep=\"\")]], current_cache, Y, lambd,\n                                 \
  \          activationFunc = hiddenActivationFunc)\n}\n\ngradients[[paste(\"dA\"\
  , l, sep=\"\")]] <- retvals[['dA_prev']]\ngradients[[paste(\"dW\", l, sep=\"\")]]\
  \ <- retvals[['dW']]\ngradients[[paste(\"db\", l, sep=\"\")]] <- retvals[['db']]\n\
  }\n\nreturn(gradients)\n}\n```\n\n# 执行梯度下降\n\n**输入**：权重和偏置、梯度、学习率、`outputActivationFunc`\
  \ - 隐藏层的激活函数 sigmoid/softmax\n\n**输出**：1 次迭代后更新的权重\n\n```r\ngradientDescent <- function(parameters,\
  \ gradients, learningRate, outputActivationFunc=\"sigmoid\") {\n  L = length(parameters)/2\
  \ # 神经网络中的层数\n  # 每个参数的更新规则。使用 for 循环。\n  for(l in 1:(L-1)) {\n    parameters[[paste(\"\
  W\", l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] - learningRate * gradients[[paste(\"\
  dW\", l, sep=\"\")]]\n    parameters[[paste(\"b\", l, sep=\"\")]] = parameters[[paste(\"\
  b\", l, sep=\"\")]] - learningRate * gradients[[paste(\"db\", l, sep=\"\")]]\n \
  \ }\n  if(outputActivationFunc == \"sigmoid\") {\n    parameters[[paste(\"W\", L,\
  \ sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * gradients[[paste(\"\
  dW\", L, sep=\"\")]]\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] - learningRate * gradients[[paste(\"db\", L, sep=\"\")]]\n \
  \ } else if (outputActivationFunc == \"softmax\") {\n    parameters[[paste(\"W\"\
  , L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"\
  dW\", L, sep=\"\")]])\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"db\", L, sep=\"\")]])\n\
  \  }\n  return(parameters)\n}\n```\n\n# 执行带动量的梯度下降\n\n**输入**：权重和偏置、`beta`、梯度、学习率、`outputActivationFunc`\
  \ - 隐藏层的激活函数 sigmoid/softmax\n\n**输出**：1 次迭代后更新的权重\n\n```r\ngradientDescentWithMomentum\
  \ <- function(parameters, gradients, v, beta, learningRate, outputActivationFunc=\"\
  sigmoid\") {\n  L = length(parameters)/2 # 神经网络中的层数\n  # 每个参数的更新规则。使用 for 循环。\n\
  \  for(l in 1:(L-1)) {\n    # 计算速度\n    # v[['dWk']] = beta * v[['dWk']] + (1-beta)\
  \ * dWk\n    v[[paste(\"dW\", l, sep=\"\")]] = beta * v[[paste(\"dW\", l, sep=\"\
  \")]] + (1-beta) * gradients[[paste('dW', l, sep=\"\")]]\n    v[[paste(\"db\", l,\
  \ sep=\"\")]] = beta * v[[paste(\"db\", l, sep=\"\")]] + (1-beta) * gradients[[paste('db',\
  \ l, sep=\"\")]]\n    parameters[[paste(\"W\", l, sep=\"\")]] = parameters[[paste(\"\
  W\", l, sep=\"\")]] - learningRate * v[[paste(\"dW\", l, sep=\"\")]]\n    parameters[[paste(\"\
  b\", l, sep=\"\")]] = parameters[[paste(\"b\", l, sep=\"\")]] - learningRate * v[[paste(\"\
  db\", l, sep=\"\")]]\n  }\n  # 计算第 L 层\n  if(outputActivationFunc == \"sigmoid\"\
  ) {\n    v[[paste(\"dW\", L, sep=\"\")]] = beta * v[[paste(\"dW\", L, sep=\"\")]]\
  \ + (1-beta) * gradients[[paste('dW', L, sep=\"\")]]\n    v[[paste(\"db\", L, sep=\"\
  \")]] = beta * v[[paste(\"db\", L, sep=\"\")]] + (1-beta) * gradients[[paste('db',\
  \ L, sep=\"\")]]\n    parameters[[paste(\"W\", L, sep=\"\")]] = parameters[[paste(\"\
  W\", L, sep=\"\")]] - learningRate * v[[paste(\"dW\", l, sep=\"\")]]\n    parameters[[paste(\"\
  b\", L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\")]] - learningRate * v[[paste(\"\
  db\", l, sep=\"\")]]\n  } else if (outputActivationFunc == \"softmax\") {\n    v[[paste(\"\
  dW\", L, sep=\"\")]] = beta * v[[paste(\"dW\", L, sep=\"\")]] + (1-beta) * t(gradients[[paste('dW',\
  \ L, sep=\"\")]])\n    v[[paste(\"db\", L, sep=\"\")]] = beta * v[[paste(\"db\"\
  , L, sep=\"\")]] + (1-beta) * t(gradients[[paste('db', L, sep=\"\")]])\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"\
  dW\", L, sep=\"\")]])\n    parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"db\", L, sep=\"\")]])\n\
  \  }\n  return(parameters)\n}\n```\n\n# 执行带 RMSProp 的梯度下降\n\n**输入**：`parameters`、`gradients`、`s`、`beta1`、`epsilon`、学习率、`outputActivationFunc`\
  \ - 隐藏层的激活函数 sigmoid/softmax\n\n**输出**：1 次迭代后更新的权重\n\n```r\ngradientDescentWithRMSProp\
  \ <- function(parameters, gradients, s, beta1, epsilon, learningRate, outputActivationFunc=\"\
  sigmoid\") {\n  L = length(parameters)/2 # 神经网络中的层数\n  # 每个参数的更新规则。使用 for 循环。\n\
  \  for(l in 1:(L-1)) {\n    # 计算 RMSProp\n    # s[['dWk']] = beta1 * s[['dWk']]\
  \ + (1-beta1) * dWk**2 / sqrt(s[['dWk']])\n    # 梯度的逐元素相乘\n    s[[paste(\"dW\",\
  \ l, sep=\"\")]] = beta1 * s[[paste(\"dW\", l, sep=\"\")]] + (1-beta1) * gradients[[paste('dW',\
  \ l, sep=\"\")]] * gradients[[paste('dW', l, sep=\"\")]]\n    s[[paste(\"db\", l,\
  \ sep=\"\")]] = beta1 * s[[paste(\"db\", l, sep=\"\")]] + (1-beta1) * gradients[[paste('db',\
  \ l, sep=\"\")]] * gradients[[paste('db', l, sep=\"\")]]\n    parameters[[paste(\"\
  W\", l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] - learningRate * gradients[[paste('dW',\
  \ l, sep=\"\")]] / sqrt(s[[paste(\"dW\", l, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
  b\", l, sep=\"\")]] = parameters[[paste(\"b\", l, sep=\"\")]] - learningRate * gradients[[paste('db',\
  \ l, sep=\"\")]] / sqrt(s[[paste(\"db\", l, sep=\"\")]] + epsilon)\n  }\n  # 计算第\
  \ L 层\n  if(outputActivationFunc == \"sigmoid\") {\n    s[[paste(\"dW\", L, sep=\"\
  \")]] = beta1 * s[[paste(\"dW\", L, sep=\"\")]] + (1-beta1) * gradients[[paste('dW',\
  \ L, sep=\"\")]] * gradients[[paste('dW', L, sep=\"\")]]\n    s[[paste(\"db\", L,\
  \ sep=\"\")]] = beta1 * s[[paste(\"db\", L, sep=\"\")]] + (1-beta1) * gradients[[paste('db',\
  \ L, sep=\"\")]] * gradients[[paste('db', L, sep=\"\")]]\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * gradients[[paste('dW',\
  \ l, sep=\"\")]] / sqrt(s[[paste(\"dW\", L, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
  b\", L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\")]] - learningRate * gradients[[paste('db',\
  \ l, sep=\"\")]] / sqrt(s[[paste(\"db\", L, sep=\"\")]] + epsilon)\n  } else if\
  \ (outputActivationFunc == \"softmax\") {\n    s[[paste(\"dW\", L, sep=\"\")]] =\
  \ beta1 * s[[paste(\"dW\", L, sep=\"\")]] + (1-beta1) * t(gradients[[paste('dW',\
  \ L, sep=\"\")]]) * t(gradients[[paste('dW', L, sep=\"\")]])\n    s[[paste(\"db\"\
  , L, sep=\"\")]] = beta1 * s[[paste(\"db\", L, sep=\"\")]] + (1-beta1) * t(gradients[[paste('db',\
  \ L, sep=\"\")]]) * t(gradients[[paste('db', L, sep=\"\")]])\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"\
  dW\", L, sep=\"\")]]) / sqrt(s[[paste(\"dW\", L, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
  b\", L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\")]] - learningRate * t(gradients[[paste(\"\
  db\", L, sep=\"\")]]) / sqrt(s[[paste(\"db\", L, sep=\"\")]] + epsilon)\n  }\n \
  \ return(parameters)\n}\n```\n\n# 执行带 Adam 的梯度下降\n\n**输入**：`parameters`、`gradients`、`v`、`s`、`t`、`beta1`、`beta2`、`epsilon`、学习率、`outputActivationFunc`\
  \ - 隐藏层的激活函数 sigmoid/softmax\n\n**输出**：1 次迭代后更新的权重\n\n```r\ngradientDescentWithAdam\
  \ <- function(parameters, gradients, v, s, t, beta1=0.9, beta2=0.999, epsilon=10^-8,\n\
  ```\n\n\n\n\n\n# Adam 优化器实现\n\n```r\ngradientDescent <- function(parameters, gradients,\
  \ learningRate=0.1, outputActivationFunc=\"sigmoid\") {\n  L = length(parameters)/2\
  \ # 神经网络中的层数\n  v_corrected <- list()\n  s_corrected <- list()\n\n  # 每个参数的更新规则。使用\
  \ for 循环。\n  for(l in 1:(L-1)) {\n    # v[['dWk']] = beta * v[['dWk']] + (1-beta)\
  \ * dWk\n    v[[paste(\"dW\", l, sep=\"\")]] = beta1 * v[[paste(\"dW\", l, sep=\"\
  \")]] +\n      (1 - beta1) * gradients[[paste('dW', l, sep=\"\")]]\n    v[[paste(\"\
  db\", l, sep=\"\")]] = beta1 * v[[paste(\"db\", l, sep=\"\")]] +\n      (1 - beta1)\
  \ * gradients[[paste('db', l, sep=\"\")]]\n\n    # 计算一阶矩的偏差修正估计。\n    v_corrected[[paste(\"\
  dW\", l, sep=\"\")]] = v[[paste(\"dW\", l, sep=\"\")]] / (1 - beta1^t)\n    v_corrected[[paste(\"\
  db\", l, sep=\"\")]] = v[[paste(\"db\", l, sep=\"\")]] / (1 - beta1^t)\n\n    #\
  \ 梯度的逐元素相乘\n    s[[paste(\"dW\", l, sep=\"\")]] = beta2 * s[[paste(\"dW\", l, sep=\"\
  \")]] +\n      (1 - beta2) * gradients[[paste('dW', l, sep=\"\")]] *\n      gradients[[paste('dW',\
  \ l, sep=\"\")]]\n    s[[paste(\"db\", l, sep=\"\")]] = beta2 * s[[paste(\"db\"\
  , l, sep=\"\")]] +\n      (1 - beta2) * gradients[[paste('db', l, sep=\"\")]] *\n\
  \      gradients[[paste('db', l, sep=\"\")]]\n\n    # 计算二阶矩的偏差修正估计。\n    s_corrected[[paste(\"\
  dW\", l, sep=\"\")]] = s[[paste(\"dW\", l, sep=\"\")]] / (1 - beta2^t)\n    s_corrected[[paste(\"\
  db\", l, sep=\"\")]] = s[[paste(\"db\", l, sep=\"\")]] / (1 - beta2^t)\n\n    #\
  \ 更新参数。\n    d1 = sqrt(s_corrected[[paste(\"dW\", l, sep=\"\")]] + epsilon)\n  \
  \  d2 = sqrt(s_corrected[[paste(\"db\", l, sep=\"\")]] + epsilon)\n    parameters[[paste(\"\
