  \ 409](img/index-343_10.jpg)\n\n## 2. 调优超参数的技巧\n\n深度学习网络伴随着大量需要调优的超参数。这些超参数包括：\n\
  \n1.  学习率\n2.  层数\n3.  隐藏单元数量\n4.  迭代次数\n5.  动量 – 0.9\n6.  RMSProp – 0.9\n7.  Adam\
  \ – β1, β2\n8.  学习率衰减\n9.  小批量大小\n10. 初始化方法 – He, Xavier\n11. 正则化\n\n在上述参数中，最关键的是**学习率**。与其尝试随机值，不如尝试在对数尺度上取值。因此，我们可以尝试\
  \ 0.01、0.1、1.0、10 等值。如果发现代价介于 0.01 和 0.1 之间，我们可以使用二分法尝试 0.05。如果需要比 0.01 和 0.05 更大的值，可以尝试\
  \ 0.03，然后不断减半距离等。\n\n动量和 RMSProp 的表现非常好，且在值为 0.9 时效果良好。即便如此，最好还是在对数范围内尝试 `1 - β`\
  \ 的值。因此，`1 - β` 可以是 0.001、0.01、0.1，相应地 `β` 将为 0.999、0.99 或 0.9。\n\n增加隐藏单元数量或隐藏层数量需要循序渐进。我注意到大幅增加隐藏层数量并不能提升性能，有时反而会降低性能。\n\
  \n有时，如果我认为对于某个学习率代价在稳步下降，我会倾向于增加迭代次数。\n\n如果你发现代价在下降过程中出现震荡，添加学习率衰减也可能有所帮助。\n\nXavier\
  \ 和 He 初始化也有助于快速收敛，值得尝试。\n\n## 3. 结束语\n\n随着这系列基于 Python、R 和 Octave 从头实现深度学习的文章接近尾声，我必须承认在这个过程中我学到了很多。\n\
