  \n-(j)\n\n由于 ... 并在 (j) 中使用 (f) 可得 ...\n\n梯度利用 ... 和 ... 的值计算输入层的权重及对应偏置。\n\n书籍\
  \ *Deep Learning* (http://www.deeplearningbook.org/) 中的计算图表示 —— 作者 Ian Goodfellow,\
  \ Yoshua Bengio, Aaron Courville —— 对可视化和计算反向传播非常有用。逻辑回归两层神经网络的计算图如下所示。\n\n![Image\
  \ 38](img/index-20_1.jpg)\n\n## 4. 逻辑回归神经网络 - Python 代码\n\n```python\nimport numpy\
  \ as np\nimport pandas as pd\nimport os\nimport matplotlib.pyplot as plt\nfrom sklearn.model_selection\
  \ import train_test_split\n\n# Define the sigmoid function\ndef sigmoid(z):\n  \
  \  a = 1 / (1 + np.exp(-z))\n    return a\n\n# Initialize weights and biases\ndef\
  \ initialize(dim):\n    w = np.zeros(dim).reshape(dim, 1)\n    b = 0\n    return\
  \ w\n\n# Compute the loss\ndef computeLoss(numTraining, Y, A):\n    loss = -1 /\
  \ numTraining * np.sum(Y * np.log(A) + (1 - Y) * (np.log(1 - A)))\n    return loss\n\
  \n# Execute the forward propagation\ndef forwardPropagation(w, b, X, Y):\n    #\
  \ Compute Z\n    Z = np.dot(w.T, X) + b\n\n    # Determine the number of training\
  \ samples\n    numTraining = float(len(X))\n\n    # Compute the output of the sigmoid\
  \ activation function\n    A = sigmoid(Z)\n\n    # Compute the loss\n    loss =\
  \ computeLoss(numTraining, Y, A)\n\n    # Compute the gradients dZ, dw and db\n\
  \    dZ = A - Y\n    dw = 1 / numTraining * np.dot(X, dZ.T)\n    db = 1 / numTraining\
  \ * np.sum(dZ)\n\n    # Return the results as a dictionary\n    gradients = {\"\
  dw\": dw, \"db\": db}\n    loss = np.squeeze(loss)\n    return gradients, loss\n\
  \n# Compute Gradient Descent\ndef gradientDescent(w, b, X, Y, numIterations, learningRate):\n\
  \    losses = []\n    idx = []\n\n    # Iterate\n    for i in range(numIterations):\n\
  \        gradients, loss = forwardPropagation(w, b, X, Y)\n```\n\n\n\n\n\n# 获取导数\n\
  \n```python\ndw = gradients[\"dw\"]\ndb = gradients[\"db\"]\nw = w - learningRate\
  \ * dw\nb = b - learningRate * db\n```\n\n# 存储损失\n\n```python\nif i % 100 == 0:\n\
  \    idx.append(i)\n    losses.append(loss)\n```\n\n# 设置参数和梯度\n\n```python\nparams\
  \ = {\"w\": w, \"b\": b}\ngrads = {\"dw\": dw, \"db\": db}\nreturn params, grads,\
  \ losses, idx\n```\n\n# 预测训练集的输出\n\n```python\ndef predict(w, b, X):\n    size =\
  \ X.shape[1]\n    yPredicted = np.zeros((1, size))\n    Z = np.dot(w.T, X)\n   \
  \ # 计算 sigmoid\n    A = sigmoid(Z)\n    for i in range(A.shape[1]):\n        # 如果值\
  \ > 0.5 则设为 1\n        if A[0][i] > 0.5:\n            yPredicted[0][i] = 1\n   \
  \     else:\n            # 否则设为 0\n            yPredicted[0][i] = 0\n    return\
  \ yPredicted\n```\n\n# 归一化数据\n\n```python\ndef normalize(x):\n    x_norm = None\n\
  \    x_norm = np.linalg.norm(x, axis=1, keepdims=True)\n    x = x / x_norm\n   \
  \ return x\n```\n\n# 在癌症数据集上运行 2 层神经网络\n\n```python\nfrom sklearn.datasets import\
  \ load_breast_cancer\nfrom sklearn.model_selection import train_test_split\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\n\n# 加载癌症数据\n(X_cancer, y_cancer)\
  \ = load_breast_cancer(return_X_y=True)\n\n# 创建训练集和测试集\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X_cancer, y_cancer, random_state=0)\n\n# 为获得更好性能而归一化数据\n\
  X_train1 = normalize(X_train)\n\n# 创建零向量作为权重。大小为数据集中的特征数 = 30\nw = np.zeros((X_train.shape[1],\
  \ 1))\n# w = np.zeros((30, 1))\nb = 0\n\n# 归一化训练数据以使梯度下降表现更好\nX_train1 = normalize(X_train)\n\
  \n# 转置 X_train 以便得到一个 (features, numSamples) 形状的矩阵\nX_train2 = X_train1.T\n\n# 重塑以移除秩\
  \ 1 数组，然后转置\ny_train1 = y_train.reshape(len(y_train), 1)\ny_train2 = y_train1.T\n\
  \n# 运行梯度下降 4000 次并计算权重\nparameters, grads, costs, idx = gradientDescent(w, b, X_train2,\
  \ y_train2, numIerations=4000, learningRate=0.75)\n\nw = parameters[\"w\"]\nb =\
  \ parameters[\"b\"]\n\n# 归一化 X_test\nX_test1 = normalize(X_test)\n\n# 转置 X_test\
  \ 以便得到一个 (features, numSamples) 形状的矩阵\nX_test2 = X_test1.T\n\n# 重塑 y_test\ny_test1\
  \ = y_test.reshape(len(y_test), 1)\ny_test2 = y_test1.T\n\n# 预测值\nyPredictionTest\
  \ = predict(w, b, X_test2)\nyPredictionTrain = predict(w, b, X_train2)\n\n# 打印准确率\n\
  print(\"train accuracy: {} %\".format(100 - np.mean(np.abs(yPredictionTrain - y_train2))\
  \ * 100))\nprint(\"test accuracy: {} %\".format(100 - np.mean(np.abs(yPredictionTest\
  \ - y_test)) * 100))\n\n# 绘制成本与迭代次数的关系图\nfig1 = plt.plot(idx, costs)\nfig1 = plt.title(\"\
  Gradient descent-Cost vs No of iterations\")\nfig1 = plt.xlabel(\"No of iterations\"\
  )\nfig1 = plt.ylabel(\"Cost\")\n```\n\n![Image 39](img/index-25_1.jpg)\n\n```python\n\
  fig1.figure.savefig(\"fig1\", bbox_inches='tight')\n```\n\n## 训练准确率: 90.3755868545\
  \ %\n\n## 测试准确率: 89.5104895105 %\n\n**注意**：训练集和测试集上的准确率分别为 90.37% 和 89.51%。与 sklearn\
  \ 逻辑回归达到的 96% 相比，这要差一些！但这主要是因为缺少隐藏层，而隐藏层才是神经网络的真正力量。\n\n# 5. 用于逻辑回归的神经网络 - R 代码\n\
  \n```r\nsource(\"RFunctions-1.R\")\n\n# 定义 sigmoid 函数\nsigmoid <- function(z) {\n\
  \  a <- 1 / (1 + exp(-z))\n  a\n}\n\n# 计算损失\ncomputeLoss <- function(numTraining,\
  \ Y, A) {\n  loss <- -1 / numTraining * sum(Y * log(A) + (1 - Y) * log(1 - A))\n\
  \  return(loss)\n}\n\n# 计算前向传播\nforwardPropagation <- function(w, b, X, Y) {\n \
  \ # 计算 Z\n  Z <- t(w) %*% X + b\n  # 设置样本数量\n  numTraining <- ncol(X)\n  # 计算激活函数\n\
  \  A = sigmoid(Z)\n  # 计算损失\n  loss <- computeLoss(numTraining, Y, A)\n  # 计算梯度\
  \ dZ, dw 和 db\n  dZ <- A - Y\n  dw <- 1 / numTraining * X %*% t(dZ)\n  db <- 1 /\
  \ numTraining * sum(dZ)\n  fwdProp <- list(\"loss\" = loss, \"dw\" = dw, \"db\"\
  \ = db)\n  return(fwdProp)\n}\n\n# 执行一轮梯度下降\ngradientDescent <- function(w, b, X,\
  \ Y, numIerations, learningRate) {\n  losses <- NULL\n  idx <- NULL\n  # 循环遍历迭代次数\n\
  \  for (i in 1:numIerations) {\n    fwdProp <- forwardPropagation(w, b, X, Y)\n\
  \    # 获取导数\n    dw <- fwdProp$dw\n    db <- fwdProp$db\n    # 执行梯度下降\n    w = w\
  \ - learningRate * dw\n    b = b - learningRate * db\n    l <- fwdProp$loss\n  \
  \  # 存储损失\n    if (i %% 100 == 0) {\n      idx <- c(idx, i)\n      losses <- c(losses,\
  \ l)\n    }\n  }\n  # 返回权重和损失\n  gradDescnt <- list(\"w\" = w, \"b\" = b, \"dw\"\
  \ = dw, \"db\" = db, \"losses\" = losses, \"idx\" = idx)\n  return(gradDescnt)\n\
  }\n\n# 计算输入的预测值\npredict <- function(w, b, X) {\n  m = dim(X)[2]\n  # 创建一个全 0 向量\n\
  \  yPredicted = matrix(rep(0, m), nrow = 1, ncol = m)\n  Z <- t(w) %*% X + b\n \
  \ # 计算 sigmoid\n  A = sigmoid(Z)\n  for (i in 1:dim(A)[2]) {\n    # 如果 A > 0.5 设值为\
  \ 1\n    if (A[1, i] > 0.5)\n      yPredicted[1, i] = 1\n    else\n      # 否则设为\
  \ 0\n      yPredicted[1, i] = 0\n  }\n  return(yPredicted)\n}\n\n# 归一化矩阵\nnormalize\
  \ <- function(x) {\n  # 创建矩阵的范数。执行矩阵的 Frobenius 范数\n  n <- as.matrix(sqrt(rowSums(x²)))\n\
  \  # 按行按范数扫描。注意函数中的 '1' 表示对每一行执行操作\n  normalized <- sweep(x, 1, n, FUN = \"/\")\n\
  \  return(normalized)\n}\n\n# 在癌症数据集上运行 2 层神经网络\n# 读取数据 (来自 sklearn)\ncancer <-\
  \ read.csv(\"cancer.csv\")\n\n# 重命名目标变量\nnames(cancer) <- c(seq(1, 30), \"output\"\
  )\n\n# 拆分为训练集和测试集\ntrain_idx <- trainTestSplit(cancer, trainPercent = 75, seed =\
  \ 5)\ntrain <- cancer[train_idx, ]\ntest <- cancer[-train_idx, ]\n\n# 设置特征\nX_train\
  \ <- train[, 1:30]\ny_train <- train[, 31]\nX_test <- test[, 1:30]\ny_test <- test[,\
  \ 31]\n\n# 创建一个全 0 矩阵，特征数量为列数\nw <- matrix(rep(0, dim(X_train)[2]))\nb <- 0\nX_train1\
  \ <- normalize(X_train)\nX_train2 = t(X_train1)\n\n# 重塑然后转置\ny_train1 = as.matrix(y_train)\n\
  y_train2 = t(y_train1)\n\n# 执行梯度下降\ngradDescent = gradientDescent(w, b, X_train2,\
  \ y_train2, numIerations = 3000, learningRate = 0.77)\n\n# 归一化 X_test\nX_test1 =\
  \ normalize(X_test)\n# 转置 X_test 以便得到一个 (features, numSamples) 形状的矩阵\nX_test2 =\
  \ t(X_test1)\n\n# 重塑 y_test 并转置\ny_test1 = as.matrix(y_test)\ny_test2 = t(y_test1)\n\
  \n# 使用梯度下降生成的权重值\nyPredictionTest = predict(gradDescent$w, gradDescent$b, X_test2)\n\
  yPredictionTrain = predict(gradDescent$w, gradDescent$b, X_train2)\nsprintf(\"Train\
  \ accuracy: %f\", (100 - mean(abs(yPredictionTrain - y_train2)) * 100))\n```\n\n\
  ## [1] \"Train accuracy: 90.845070\"\n\n```r\nsprintf(\"test accuracy: %f\", (100\
  \ - mean(abs(yPredictionTest - y_test)) * 100))\n```\n\n## [1] \"test accuracy:\
  \ 87.323944\"\n\n```r\ndf <- data.frame(gradDescent$idx, gradDescent$losses)\nnames(df)\
  \ <- c(\"iterations\", \"losses\")\nggplot(df, aes(x = iterations, y = losses))\
  \ + geom_point() + geom_line(col = \"blue\") +\n  ggtitle(\"Gradient Descent - Losses\
