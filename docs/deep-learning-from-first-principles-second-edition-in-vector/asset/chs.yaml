  \n# 9. 结论\n\n本章实现了一个 3 层神经网络，以在执行分类时创建非线性边界。显然，当隐藏单元数量和学习率变化时，神经网络表现非常好。\n\n## 3.\
  \ 构建 L 层深度学习网络\n\n> *“从前，我，庄周，梦见自己是一只蝴蝶，栩栩然蝴蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为蝴蝶与，蝴蝶之梦为周与。”*\n\
  >\n> 摘自 *The Brain: The Story of you* – David Eagleman\n>\n> *“思想是一大堆神经活动的向量”*\n\
  >\n> Geoffrey Hinton 教授\n\n### 1. 简介\n\n这是我关于从头原理用 Python、R 和 Octave 进行深度学习系列的第三章。在第三部分中，我实现了一个任意深度（任意数量的隐藏层）和任意高度（每个隐藏层中任意数量的激活单元）的多层深度学习\
  \ (DL) 网络。第三部分的实现是针对 L 层深度网络的，但不包含任何正则化、早停、动量或学习率自适应技术。\n\n然而，即使是这个最基础的多层 DL，也有足够多的超参数需要微调和调整。\n\
  \n在 Python、R 和 Octave 中实现向量化的 L 层深度学习网络颇具挑战性，因为我们需要跟踪索引、层数和矩阵维度。由于语言差异带来的一些挑战：\n\
  \n1.  Python 和 Octave 允许在单个语句中解包多个返回值。而在 R 中，从列表解包多个返回值需要返回整个列表，然后再单独解包。我确实看到有一个包\
  \ `gsubfn` ([`stackoverflow.com/questions/1826519/how-to-assign-from-a-function-which-returns-more-than-one-value`](https://stackoverflow.com/questions/1826519/how-to-assign-from-a-function-which-returns-more-than-one-value))\
  \ 可以做到这一点。\n2.  Python 和 R 可以分别使用字典或列表从函数保存和返回不同类型的元素。然而，Octave 中没有真正的等价物。我在 Octave\
  \ 中得到的最接近此功能的是“元胞数组”。但元胞数组只能通过索引访问，不能像 Python 字典或 R 列表那样通过键访问。这使得在 Octave 中处理事情稍微困难一些。\n\
  3.  Python 和 Octave 包含隐式广播。在 R 中，广播不是隐式的，但 R 有一个巧妙的函数 `sweep()`，我们可以用它按列或按行进行广播。\n\
  4.  Python 字典或 R 列表在 Octave 中最接近的等价物是元胞数组。然而，我不得不为权重和偏置分别管理单独的元胞数组，并在梯度下降期间分别管理单独的梯度\
  \ `dW` 和 `dB`。\n5.  Python 中的秩-1 numpy 数组有时会令人恼火。这个问题在 R 和 Octave 中不存在。\n\n当前的向量化实现支持\
  \ `relu`、`sigmoid` 和 `tanh` 激活函数。\n\n在使用不同的超参数进行测试时，即 i) 隐藏层的数量，ii) 每层中的激活单元数量，iii)\
  \ 激活函数和 iv) 迭代次数，我发现 L 层深度学习网络对这些超参数非常敏感。调整参数并不容易。增加更多的隐藏层或每层更多的单元并不总是有帮助，有时会导致梯度下降陷入某些局部极小值。这需要相当多的试错，以及对深度学习网络在逻辑变化下如何表现的非常密切的观察。然后我们可以锁定最优解。第\
