  )]] / d2\n  }\n\n  return(parameters)\n}\n```\n\n# L 层深度学习模型执行\n\n## 函数：`L_Layer_DeepModel`\n\
  \n执行一个 L 层深度学习模型。\n\n### 输入参数\n- `X`：输入特征\n- `Y`：输出标签\n- `layersDimensions`：各层维度\n\
  - `hiddenActivationFunc`：隐藏层激活函数，`relu` / `tanh`\n- `outputActivationFunc`：输出层激活函数，`sigmoid`\
  \ / `softmax`\n- `learningRate`：学习率\n- `lambd`：正则化参数\n- `keep_prob`：Dropout 保留概率\n\
  - `numIterations`：迭代次数\n- `initType`：初始化类型\n\n### 输出\n- 更新后的权重参数\n\n```r\nL_Layer_DeepModel\
  \ <- function(X, Y, layersDimensions,\n                              hiddenActivationFunc='relu',\n\
  \                              outputActivationFunc= 'sigmoid',\n              \
  \                learningRate = 0.5,\n                              lambd=0,\n \
  \                             keep_prob=1,\n                              numIterations\
  \ = 10000,\n                              initType=\"default\",\n              \
  \                print_cost=FALSE) {\n  # 将成本向量初始化为 NULL\n  costs <- NULL\n\n  #\
  \ 参数初始化。\n  if (initType == \"He\") {\n    parameters = HeInitializeDeepModel(layersDimensions)\n\
  \  } else if (initType == \"Xav\") {\n    parameters = XavInitializeDeepModel(layersDimensions)\n\
  \  } else {\n    parameters = initializeDeepModel(layersDimensions)\n  }\n\n  #\
  \ 循环（梯度下降）\n  for(i in 0:numIterations) {\n    # 前向传播：[LINEAR -> RELU]*(L-1) ->\
  \ LINEAR -> SIGMOID/SOFTMAX。\n    retvals = forwardPropagationDeep(X, parameters,\
  \ keep_prob,\n                                     hiddenActivationFunc,\n     \
  \                                outputActivationFunc=outputActivationFunc)\n  \
  \  AL <- retvals[['AL']]\n    caches <- retvals[['caches']]\n    dropoutMat <- retvals[['dropoutMat']]\n\
  \n    # 计算成本。\n    if(lambd == 0) {\n      cost <- computeCost(AL,\n           \
  \               Y, outputActivationFunc=outputActivationFunc,\n                \
  \          numClasses=layersDimensions[length(layersDimensions)])\n    } else {\n\
  \      cost <- computeCostWithReg(parameters, AL, Y, lambd,\n                  \
  \               outputActivationFunc=outputActivationFunc,\n                   \
  \              numClasses=layersDimensions[length(layersDimensions)])\n    }\n\n\
  \    # 反向传播。\n    gradients = backwardPropagationDeep(AL, Y, caches, dropoutMat,\
  \ lambd, keep_prob, hiddenActivationFunc,\n                                    \
  \    outputActivationFunc=outputActivationFunc,\n                              \
  \          numClasses=layersDimensions[length(layersDimensions)])\n\n    # 更新参数。\n\
  \    parameters = gradientDescent(parameters, gradients, learningRate, outputActivationFunc=outputActivationFunc)\n\
  \n    if(i %% 1000 == 0) {\n      costs = c(costs, cost)\n      print(cost)\n  \
  \  }\n  }\n\n  retvals <- list(\"parameters\"=parameters, \"costs\"=costs)\n  return(retvals)\n\
  }\n```\n\n# L 层深度学习模型执行（随机梯度下降）\n\n## 函数：`L_Layer_DeepModel_SGD`\n\n执行一个带有随机梯度下降的\
  \ L 层深度学习模型。\n\n### 输入参数\n- `X`：输入特征\n- `Y`：输出标签\n- `layersDimensions`：各层维度\n- `hiddenActivationFunc`：隐藏层激活函数，`relu`\
  \ / `tanh`\n- `outputActivationFunc`：输出层激活函数，`sigmoid` / `softmax`\n- `learningRate`：学习率\n\
  - `lrDecay`：是否启用学习率衰减\n- `decayRate`：衰减率\n- `lambd`：正则化参数\n- `keep_prob`：Dropout\
  \ 保留概率\n- `optimizer`：优化器类型\n- `beta`：动量参数\n- `beta1`：一阶矩估计指数衰减率\n- `beta2`：二阶矩估计指数衰减率\n\
  - `epsilon`：数值稳定性常数\n- `mini_batch_size`：小批量大小\n- `num_epochs`：训练轮数\n\n### 输出\n\
  - 每次迭代后更新的权重\n\n```r\nL_Layer_DeepModel_SGD <- function(X, Y, layersDimensions,\n\
  \                                  hiddenActivationFunc='relu',\n              \
  \                    outputActivationFunc= 'sigmoid',\n                        \
  \          learningRate = .3,\n                                  lrDecay=FALSE,\n\
  \                                  decayRate=1,\n                              \
  \    lambd=0,\n                                  keep_prob=1,\n                \
  \                  optimizer=\"gd\",\n                                  beta=0.9,\n\
  \                                  beta1=0.9,\n                                \
  \  beta2=0.999,\n                                  epsilon=10^-8,\n            \
  \                      mini_batch_size = 64,\n                                 \
  \ num_epochs = 2500) {\n  # 函数体未在输入文本中完全给出\n}\n```\n\n\n\n\n\n# R 语言深度学习模型实现\n\n\
  ## 模型训练主函数\n\n```r\n# 假设这是主训练函数的签名\n# L_layer_model <- function(X, Y, layersDimensions,\
  \ learningRate=0.0075, lambd=0, keep_prob=1,\n#                           optimizer=\"\
  gd\", beta=0.9, beta1=0.9, beta2=0.999, epsilon=1e-8,\n#                       \
  \    mini_batch_size=64, num_epochs=3000, print_cost=FALSE) {\n```\n\n### 超参数打印\n\
  \n```r\nprint(\"Values\")\ncat(\"learningRate= \", learningRate)\ncat(\"\\n\")\n\
  cat(\"lambd=\", lambd)\ncat(\"\\n\")\ncat(\"keep_prob=\", keep_prob)\ncat(\"\\n\"\
  )\ncat(\"optimizer=\", optimizer)\ncat(\"\\n\")\ncat(\"lrDecay=\", lrDecay)\ncat(\"\
  \\n\")\ncat(\"decayRate=\", decayRate)\ncat(\"\\n\")\ncat(\"beta=\", beta)\ncat(\"\
  \\n\")\ncat(\"beta1=\", beta1)\ncat(\"\\n\")\ncat(\"beta2=\", beta2)\ncat(\"\\n\"\
  )\ncat(\"epsilon=\", epsilon)\ncat(\"\\n\")\ncat(\"mini_batch_size=\", mini_batch_size)\n\
  cat(\"\\n\")\ncat(\"num_epochs=\", num_epochs)\ncat(\"\\n\")\n```\n\n### 初始化设置\n\
  \n```r\nset.seed(1)\n\n# Initialize costs vector as NULL\ncosts <- NULL\nt <- 0\n\
  \n# Parameters initialization.\nparameters <- initializeDeepModel(layersDimensions)\n\
  \n# Initialize the optimizer\nif (optimizer == \"momentum\") {\n  v <- initializeVelocity(parameters)\n\
  } else if (optimizer == \"rmsprop\") {\n  s <- initializeRMSProp(parameters)\n}\
  \ else if (optimizer == \"adam\") {\n  adamVals <- initializeAdam(parameters)\n\
  }\n\nseed <- 10\n```\n\n### 训练循环\n\n```r\n# Loop for number of epochs\nfor (i in\
  \ 0:num_epochs) {\n  seed <- seed + 1\n  minibatches <- random_mini_batches(X, Y,\
  \ mini_batch_size, seed)\n  \n  for (batch in 1:length(minibatches)) {\n    mini_batch_X\
  \ <- minibatches[[batch]][['mini_batch_X']]\n    mini_batch_Y <- minibatches[[batch]][['mini_batch_Y']]\n\
  \    \n    # Forward propagation:\n    retvals <- forwardPropagationDeep(mini_batch_X,\
  \ parameters, keep_prob, hiddenActivationFunc,\n                               \
  \       outputActivationFunc = outputActivationFunc)\n    AL <- retvals[['AL']]\n\
  \    caches <- retvals[['caches']]\n    dropoutMat <- retvals[['dropoutMat']]\n\
  \    \n    # Compute cost.\n    if (lambd == 0) {\n      cost <- computeCost(AL,\
  \ mini_batch_Y, outputActivationFunc = outputActivationFunc,\n                 \
  \         numClasses = layersDimensions[length(layersDimensions)])\n    } else {\n\
  \      cost <- computeCostWithReg(parameters, AL, Y, lambd,\n                  \
  \               outputActivationFunc = outputActivationFunc,\n                 \
  \                numClasses = layersDimensions[length(layersDimensions)])\n    }\n\
  \    \n    # Backward propagation.\n    gradients <- backwardPropagationDeep(AL,\
  \ mini_batch_Y, caches, dropoutMat, lambd, keep_prob,\n                        \
  \                 hiddenActivationFunc, outputActivationFunc = outputActivationFunc,\n\
  \                                         numClasses = layersDimensions[length(layersDimensions)])\n\
  \    \n    # Parameter updates based on optimizer\n    if (optimizer == \"gd\")\
  \ {\n      # Update parameters.\n      parameters <- gradientDescent(parameters,\
  \ gradients, learningRate,\n                                    outputActivationFunc\
  \ = outputActivationFunc)\n    } else if (optimizer == \"momentum\") {\n      #\
  \ Update parameters with Momentum\n      parameters <- gradientDescentWithMomentum(parameters,\
  \ gradients, v, beta, learningRate,\n                                          \
  \      outputActivationFunc = outputActivationFunc)\n    } else if (optimizer ==\
  \ \"rmsprop\") {\n      # Update parameters with RMSProp\n      parameters <- gradientDescentWithRMSProp(parameters,\
  \ gradients, s, beta1, epsilon, learningRate,\n                                \
  \               outputActivationFunc = outputActivationFunc)\n    } else if (optimizer\
  \ == \"adam\") {\n      # Update parameters with Adam\n      # Get v and s\n   \
  \   t <- t + 1\n      v <- adamVals[['v']]\n      s <- adamVals[['s']]\n      parameters\
  \ <- gradientDescentWithAdam(parameters, gradients, v, s, t, beta1, beta2, epsilon,\
  \ learningRate,\n                                            outputActivationFunc\
  \ = outputActivationFunc)\n    }\n  }\n  \n  if (i %% 1000 == 0) {\n    costs <-\
  \ c(costs, cost)\n    print(cost)\n  }\n  \n  if (lrDecay == TRUE) {\n    learningRate\
  \ <- decayRate^(num_epochs / 1000) * learningRate\n  }\n}\n\nretvals <- list(\"\
  parameters\" = parameters, \"costs\" = costs)\nreturn(retvals)\n```\n\n## 预测函数\n\
  \n```r\n# Predict the output for given input\n# Input : parameters\n# : X\n# Output:\
  \ predictions\npredict <- function(parameters, X, keep_prob = 1, hiddenActivationFunc\
  \ = 'relu') {\n  fwdProp <- forwardPropagationDeep(X, parameters, keep_prob, hiddenActivationFunc)\n\
  \  predictions <- fwdProp$AL > 0.5\n  return(predictions)\n}\n```\n\n## 决策边界绘制函数\n\
  \n### 版本 1：基于返回值列表\n\n```r\n# Plot a decision boundary\n# This function uses ggplot2\n\
  plotDecisionBoundary <- function(z, retvals, keep_prob = 1, hiddenActivationFunc\
  \ = \"sigmoid\", lr = 0.5) {\n  # Find the minimum and maximum for the data\n  xmin\
  \ <- min(z[, 1])\n  xmax <- max(z[, 1])\n  ymin <- min(z[, 2])\n  ymax <- max(z[,\
  \ 2])\n  \n  # Create a grid of values\n  a <- seq(xmin, xmax, length = 100)\n \
  \ b <- seq(ymin, ymax, length = 100)\n  grid <- expand.grid(x = a, y = b)\n  colnames(grid)\
  \ <- c('x1', 'x2')\n  grid1 <- t(grid)\n  \n  # Predict the output for this grid\n\
  \  q <- predict(retvals$parameters, grid1, keep_prob = 1, hiddenActivationFunc)\n\
  \  q1 <- t(data.frame(q))\n  q2 <- as.numeric(q1)\n  grid2 <- cbind(grid, q2)\n\
  \  colnames(grid2) <- c('x1', 'x2', 'q2')\n  \n  z1 <- data.frame(z)\n  names(z1)\
  \ <- c(\"x1\", \"x2\", \"y\")\n  atitle <- paste(\"Decision boundary for learning\
  \ rate:\", lr)\n  \n  # Plot the contour of the boundary\n  ggplot(z1) +\n    geom_point(data\
  \ = z1, aes(x = x1, y = x2, color = y)) +\n    stat_contour(data = grid2, aes(x\
  \ = x1, y = x2, z = q2, color = q2), alpha = 0.9) +\n    ggtitle(atitle) + scale_colour_gradientn(colours\
  \ = brewer.pal(10, \"Spectral\"))\n}\n```\n\n### 版本 2：直接使用参数\n\n```r\n# Plot a decision\
  \ boundary\n# This function uses ggplot2\nplotDecisionBoundary1 <- function(Z, parameters,\
  \ keep_prob = 1) {\n  xmin <- min(Z[, 1])\n  xmax <- max(Z[, 1])\n  ymin <- min(Z[,\
  \ 2])\n  ymax <- max(Z[, 2])\n  \n  # Create a grid of points\n  a <- seq(xmin,\
  \ xmax, length = 100)\n  b <- seq(ymin, ymax, length = 100)\n  grid <- expand.grid(x\
  \ = a, y = b)\n  colnames(grid) <- c('x1', 'x2')\n  grid1 <- t(grid)\n  \n  retvals\
  \ <- forwardPropagationDeep(grid1, parameters, keep_prob, \"relu\", outputActivationFunc\
  \ = \"softmax\")\n  AL <- retvals$AL\n  \n  # From the softmax probabilities pick\
  \ the one with the highest probability\n  q <- apply(AL, 1, which.max)\n  q1 <-\
  \ t(data.frame(q))\n  q2 <- as.numeric(q1)\n  grid2 <- cbind(grid, q2)\n  colnames(grid2)\
  \ <- c('x1', 'x2', 'q2')\n  \n  Z1 <- data.frame(Z)\n  names(Z1) <- c(\"x1\", \"\
  x2\", \"y\")\n  atitle <- paste(\"Decision boundary\")\n  \n  ggplot(Z1) +\n   \
  \ geom_point(data = Z1, aes(x = x1, y = x2, color = y)) +\n    stat_contour(data\
  \ = grid2, aes(x = x1, y = x2, z = q2, color = q2), alpha = 0.9) +\n    ggtitle(atitle)\
  \ + scale_colour_gradientn(colours = brewer.pal(10, \"Spectral\"))\n}\n```\n\n##\
  \ 概率分数计算\n\n```r\n# Predict the probability scores for given data set\n# Input :\
  \ parameters\n# : X\n# Output: probability of output\ncomputeScores <- function(parameters,\
  \ X, hiddenActivationFunc = 'relu') {\n  fwdProp <- forwardPropagationDeep(X, parameters,\
  \ hiddenActivationFunc)\n  scores <- fwdProp$AL\n  return(scores)\n}\n```\n\n##\
  \ 随机小批量生成\n\n```r\n# Create random mini batches\n# Input : X - Input features\n\
  # : Y - output\n# : miniBatchSize\n# : seed\n# output : mini_batches\nrandom_mini_batches\
  \ <- function(X, Y, miniBatchSize = 64, seed = 0) {\n  set.seed(seed)\n  \n  # Get\
  \ number of training samples\n  m <- dim(X)[2]\n  \n  # Initialize mini batches\n\
  \  mini_batches <- list()\n  \n  # Create a list of random numbers < m\n  permutation\
  \ <- c(sample(m))\n  \n  # Randomly shuffle the training data\n  shuffled_X <- X[,\
  \ permutation]\n  shuffled_Y <- Y[1, permutation]\n  \n  # Compute number of mini\
  \ batches\n  numCompleteMinibatches <- floor(m / miniBatchSize)\n  batch <- 0\n\
  \  \n  for (k in 0:(numCompleteMinibatches - 1)) {\n    batch <- batch + 1\n   \
  \ \n    # Set the lower and upper bound of the mini batches\n    lower <- (k * miniBatchSize)\
  \ + 1\n    upper <- ((k + 1) * miniBatchSize)\n    \n    mini_batch_X <- shuffled_X[,\
  \ lower:upper]\n    mini_batch_Y <- shuffled_Y[lower:upper]\n    \n    # Add it\
  \ to the list of mini batches\n    mini_batch <- list(\"mini_batch_X\" = mini_batch_X,\
  \ \"mini_batch_Y\" = mini_batch_Y)\n    mini_batches[[batch]] <- mini_batch\n  }\n\
  \  \n  # If the batch size does not divide evenly with mini batch size\n  if (m\
  \ %% miniBatchSize != 0) {\n    p <- floor(m / miniBatchSize) * miniBatchSize\n\
  \    \n    # Set the start and end of last batch\n    q <- p + m %% miniBatchSize\n\
  \    \n    mini_batch_X <- shuffled_X[, (p + 1):q]\n    mini_batch_Y <- shuffled_Y[(p\
  \ + 1):q]\n    \n    mini_batch <- list(\"mini_batch_X\" = mini_batch_X, \"mini_batch_Y\"\
  \ = mini_batch_Y)\n    mini_batches[[batch]] <- mini_batch\n  }\n  \n  # Return\
  \ the list of mini batches\n  return(mini_batches)\n}\n```\n\n## 参数向量化转换\n\n```r\n\
  #############\n# Note: Using list_to_vector followed by vector_to_list => original\
  \ list\n##############\n\n# Convert a weight, biases as a list to a vector\n# Input\
  \ : parameter dictionary\n# Returns : vector\nlist_to_vector <- function(parameters)\
  \ {\n  vec <- NULL\n  L <- length(parameters) / 2\n  \n  for (l in 1:L) {\n    vec1\
  \ <- as.vector(t(parameters[[paste('W', l, sep = \"\")]])) # Take transpose\n  \
  \  vec1 <- as.matrix(vec1, nrow = length(vec1), ncol = 1)\n    \n    vec2 <- as.vector(t(parameters[[paste('b',\
  \ l, sep = \"\")]])) # Take transpose\n    vec2 <- as.matrix(vec2, nrow = length(vec2),\
  \ ncol = 1)\n    \n    vec <- rbind(vec, vec1)\n    vec <- rbind(vec, vec2)\n  }\n\
  \  \n  return(vec)\n}\n```\n\n\n\n\n# 将梯度列表转换为向量\n\n# 输入：parameters（参数）\n\n# ：gradient\
  \ list（梯度列表）\n\n# 返回：gradient vector（梯度向量）\n\n```r\ngradients_to_vector <- function(parameters,gradients){\n\
  \nvec <- NULL\n\nL=length(parameters)/2\n\nfor(l in 1:L){\n\nvec1= as.vector(t(gradients[[paste('dW',l,sep=\"\
  \")]])) #Take transpose vec1=as.matrix(vec1,nrow=length(vec1),ncol=1)\n\nvec2= as.vector(t(gradients[[paste('db',l,sep=\"\
  \")]])) #Take transpose vec2=as.matrix(vec2,nrow=length(vec2),ncol=1)\n\nvec <-\
  \ rbind(vec,vec1)\n\nvec <- rbind(vec,vec2)\n\n}\n\nreturn(vec)\n\n}\n```\n\n# 将向量转换为列表\n\
  \n# 这应该是 list_to_vector 的镜像副本\n\n# 输入：parameters（参数）\n\n# ：theta\n\n# 返回：parameters1\
  \ (list)\n\n```r\nvector_to_list <- function(parameters,theta){\n\nL<-length(parameters)/2\n\
  \nstart<-1\n\n parameters1 <- list()\n\nfor(l in 1:L){\n\nm = dim(parameters[[paste('W',l,sep=\"\
  \")]])\n\na = theta[start:(start+m[1]*m[2]-1),1]\n\nparameters1[[paste('W',l,sep=\"\
  \")]] = t(matrix(a,nrow=m[2],ncol=m[1])) start=start+m[1]*m[2]\n\nn = dim(parameters[[paste('b',l,sep=\"\
  \")]])\n\nb= theta[start:(start+n[1]*n[2]-1),1]\n\nparameters1[[paste('b',l,sep=\"\
  \")]]=t(matrix(b,nrow=n[2],ncol=n[1])) start=start+n[1]*n[2]\n\n}\n\nreturn(parameters1)\n\
  \n}\n```\n\n# 将梯度向量转换为梯度列表\n\n# 输入：parameters（参数）\n\n# ：grads\n\n# 返回：gradients1\
  \ (list)\n\n```r\nvector_to_list2 <- function(parameters,grads){\n\nL<-length(parameters)/2\n\
  \nstart<-1\n\ngradients1 <- list()\n\nfor(l in 1:L){\n\nm = dim(parameters[[paste('W',l,sep=\"\
  \")]])\n\na = grads[start:(start+m[1]*m[2]-1),1]\n\ngradients1[[paste('dW',l,sep=\"\
  \")]] = matrix(a,nrow=m[1],ncol=m[2]) start=start+m[1]*m[2]\n\nn = dim(parameters[[paste('b',l,sep=\"\
  \")]])\n\nb= grads[start:(start+n[1]*n[2]-1),1]\n\ngradients1[[paste('db',l,sep=\"\
  \")]]=matrix(b,nrow=n[1],ncol=n[2]) start=start+n[1]*n[2]\n\n}\n\nreturn(gradients1)\n\
  \n}\n```\n\n# 计算 L2 范数\n\n```r\nL2NormVec <- function(x) {\n\n sqrt(sum(x²))\n\n\
  }\n```\n\n# 执行梯度检查\n\n# 输入：parameters（参数）\n\n# ：gradients（梯度）\n\n# ：X\n\n# ：Y\n\n\
  # ：epsilon\n\n# ：outputActivationFunc（输出激活函数）\n\n# 返回：\n\n```r\ngradient_check_n\
  \ <- function(parameters, gradients, X, Y,\n\nepsilon = 1e-7,outputActivationFunc=\"\
  sigmoid\"){\n\n# Convert parameters to a vector\n# 将参数转换为向量\n\nparameters_values\
  \ = list_to_vector(parameters)\n\n# Convert gradients to a vector\n# 将梯度转换为向量\n\n\
  grad = gradients_to_vector(parameters,gradients)\n\nnum_parameters = dim(parameters_values)[1]\n\
  \n#Initialize\n# 初始化\n\nJ_plus = matrix(rep(0,num_parameters),\n\nnrow=num_parameters,ncol=1)\n\
  \nJ_minus = matrix(rep(0,num_parameters),\n\nnrow=num_parameters,ncol=1)\n\ngradapprox\
  \ = matrix(rep(0,num_parameters),\n\nnrow=num_parameters,ncol=1)\n\n# Compute gradapprox\n\
  # 计算 gradapprox\n\nfor(i in 1:num_parameters){\n\n# Compute J_plus[i].\n# 计算 J_plus[i]。\n\
  \nthetaplus = parameters_values\n\nthetaplus[i][1] = thetaplus[i][1] + epsilon\n\
  \nretvals = forwardPropagationDeep(X, vector_to_list(parameters,thetaplus), keep_prob=1,\n\
  \nhiddenActivationFunc=\"relu\",outputActivationFunc=outputActivationFunc) AL <-\
  \ retvals[['AL']]\n\nJ_plus[i] = computeCost(AL, Y,\n\noutputActivationFunc=outputActivationFunc)\n\
  \n# Compute J_minus[i].\n# 计算 J_minus[i]。\n\nthetaminus = parameters_values\n\n\
  thetaminus[i][1] = thetaminus[i][1] - epsilon\n\nretvals = forwardPropagationDeep(X,\n\
  \nvector_to_list(parameters,thetaminus), keep_prob=1,\n\nhiddenActivationFunc=\"\
  relu\",outputActivationFunc=outputActivationFunc) AL <- retvals[['AL']]\n\nJ_minus[i]\
  \ = computeCost(AL, Y,\n\noutputActivationFunc=outputActivationFunc)\n\n# Compute\
  \ gradapprox[i]\n# 计算 gradapprox[i]\n\ngradapprox[i] = (J_plus[i] - J_minus[i])/(2*epsilon)\n\
  \n}\n\n# Compare gradapprox to backward propagation gradients by computing difference.\n\
  # 通过计算差值，将 gradapprox 与反向传播梯度进行比较。\n\nnumerator = L2NormVec(grad-gradapprox)\n\n\
  denominator = L2NormVec(grad) +\n\nL2NormVec(gradapprox)\n\ndifference = numerator/denominator\n\
  \nif(difference > 1e-5){\n\ncat(\"There is a mistake, the difference is too high\"\
  ,difference)\n\n} else{\n\ncat(\"The implementations works perfectly\", difference)\n\
  \n}\n\n# This can be used to check the structure of gradients and gradapprox\n#\
  \ 这可用于检查 gradients 和 gradapprox 的结构\n\nprint(\"Gradients from backprop\")\n\nm=vector_to_list2(parameters,grad)\n\
  \nprint(m)\n\nprint(\"Grad approx from gradient check\")\n\nn=vector_to_list2(parameters,gradapprox)\n\
  \nprint(n)\n\n}\n```\n\n**8.3 Octave**\n\n############################################################################################################\n\
