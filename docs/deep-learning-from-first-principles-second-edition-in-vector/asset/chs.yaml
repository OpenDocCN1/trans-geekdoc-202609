  ```\n\n## 创建随机小批量\n\n### 函数签名\n\n```python\ndef random_mini_batches(X, Y, miniBatchSize=64,\
  \ seed=0):\n```\n\n### 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `X` | 输入特征 |\n| `Y`\
  \ | 输出 |\n| `miniBatchSize` | 小批量大小 |\n| `seed` | 随机种子 |\n\n### 实现\n\n```python\n\
  np.random.seed(seed)\n\n# 获取训练样本数量\nm = X.shape[1]\n\n# 初始化小批量列表\nmini_batches =\
  \ []\n\n# 创建一个小于 m 的随机数列表\npermutation = list(np.random.permutation(m))\n\n# 随机打乱训练数据\n\
  shuffled_X = X[:, permutation]\nshuffled_Y = Y[:, permutation].reshape((1, m))\n\
  \n# 计算小批量数量\nnumCompleteMinibatches = math.floor(m / miniBatchSize)\n\n# 遍历小批量数量\n\
  for k in range(0, numCompleteMinibatches):\n    # 设置每个小批量的开始和结束\n    mini_batch_X\
  \ = shuffled_X[:, k * miniBatchSize: (k + 1) * miniBatchSize]\n    mini_batch_Y\
  \ = shuffled_Y[:, k * miniBatchSize: (k + 1) * miniBatchSize]\n    mini_batch =\
  \ (mini_batch_X, mini_batch_Y)\n    mini_batches.append(mini_batch)\n\n# 如果批量大小不能被小批量大小整除\n\
  if m % miniBatchSize != 0:\n    l = math.floor(m / miniBatchSize) * miniBatchSize\n\
  \    # 设置最后一个小批量的开始和结束\n    m = l + m % miniBatchSize\n    mini_batch_X = shuffled_X[:,\
  \ l:m]\n    mini_batch_Y = shuffled_Y[:, l:m]\n    mini_batch = (mini_batch_X, mini_batch_Y)\n\
  \    mini_batches.append(mini_batch)\n\nreturn mini_batches\n```\n\n## 绘制决策边界\n\n\
