  \")]] = beta2 * s[[paste(\"dW\", L, sep=\"\")]] +\n      (1 - beta2) * gradients[[paste('dW',\
  \ L, sep=\"\")]] *\n      gradients[[paste('dW', L, sep=\"\")]]\n    s[[paste(\"\
  db\", L, sep=\"\")]] = beta2 * s[[paste(\"db\", L, sep=\"\")]] +\n      (1 - beta2)\
  \ * gradients[[paste('db', L, sep=\"\")]] *\n      gradients[[paste('db', L, sep=\"\
  \")]]\n\n    # 计算二阶矩的偏差修正估计。\n    s_corrected[[paste(\"dW\", L, sep=\"\")]] = s[[paste(\"\
