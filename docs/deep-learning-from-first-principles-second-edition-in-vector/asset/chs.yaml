  \    # 可视化数据\n    print(train_X.shape)\n    print(train_Y.shape)\n    print(\"load\"\
  )\n    # plt.scatter(train_X[:, 0], train_X[:, 1], c=train_Y, s=40, cmap=plt.cm.Spectral);\n\
  \    train_X = train_X.T\n    train_Y = train_Y.reshape((1, train_Y.shape[0]))\n\
  \    test_X = test_X.T\n    test_Y = test_Y.reshape((1, test_Y.shape[0]))\n    return\
  \ train_X, train_Y, test_X, test_Y\n```\n\n### 6.2 R 语言实现\n\n```r\n############################################################################################################\n\
  #\n# File : DLfunctions6.R\n# Author : Tinniam V Ganesh\n# Date : 16 Apr 2018\n\
  #\n##########################################################################################################\n\
  \nlibrary(ggplot2)\nlibrary(PRROC)\nlibrary(dplyr)\n```\n\n## 激活函数\n\n### Sigmoid\n\
  \n```r\n# 计算向量的 Sigmoid\nsigmoid <- function(Z) {\n  A <- 1/(1 + exp(-Z))\n  cache\
  \ <- Z\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\n###\
  \ ReLU（旧版本）\n\n```r\n# 计算向量的 ReLU（旧版本）（性能杀手！）\nreluOld <- function(Z) {\n  A <-\
  \ apply(Z, 1:2, function(x) max(0, x))\n  cache <- Z\n  retvals <- list(\"A\" =\
  \ A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\n### ReLU（优化版本）\n\n```r\n# 计算向量的 ReLU（性能更好！）\n\
  relu <- function(Z) {\n  # 执行 ReLU。将小于等于 0 的值设为 0\n  Z[Z < 0] = 0\n  A = Z\n  cache\
  \ <- Z\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\n###\
  \ Tanh\n\n```r\n# 计算向量的 Tanh 激活\ntanhActivation <- function(Z) {\n  A <- tanh(Z)\n\
  \  cache <- Z\n  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\
  \n### Softmax\n\n```r\n# 计算向量的 Softmax\nsoftmax <- function(Z) {\n  # 获取未归一化的概率\n\
  \  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  A = exp_scores / rowSums(exp_scores)\n\
  \  retvals <- list(\"A\" = A, \"Z\" = Z)\n  return(retvals)\n}\n```\n\n## 导数函数\n\
  \n### ReLU 导数\n\n```r\n# 计算 ReLU 的导数\n# g'(z) = 1 if z > 0 and 0 otherwise\nreluDerivative\
  \ <- function(dA, cache) {\n  Z <- cache\n  dZ <- dA\n  # 创建一个值 > 0 的逻辑矩阵\n  a <-\
  \ Z > 0\n  # 当 z <= 0 时，也应将 dz 设为 0。执行逐元素乘法\n  dZ <- dZ * a\n  return(dZ)\n}\n```\n\
  \n### Sigmoid 导数\n\n```r\n# 计算 Sigmoid 的导数\n# 导数 g'(z) = a * (1-a)\nsigmoidDerivative\
  \ <- function(dA, cache) {\n  Z <- cache\n  s <- 1/(1 + exp(-Z))\n  dZ <- dA * s\
  \ * (1 - s)\n  return(dZ)\n}\n```\n\n### Tanh 导数\n\n```r\n# 计算 Tanh 的导数\n# 导数 g'(z)\
  \ = 1 - a²\ntanhDerivative <- function(dA, cache) {\n  Z = cache\n  a = tanh(Z)\n\
  \  dZ = dA * (1 - a²)\n  return(dZ)\n}\n```\n\n### Softmax 辅助函数与导数\n\n```r\n# 此函数用于计算\
  \ Softmax 导数\n# 在 Y==1 的行中填充 1 矩阵\n# 可能需要扩展以支持 K 个类别。目前支持 K=3 和 K=10\npopMatrix\
  \ <- function(Y, numClasses) {\n  a = rep(0, times = length(Y))\n  Y1 = matrix(a,\
  \ nrow = length(Y), ncol = numClasses)\n  # 将 Y 为类别值的行和列设为 1\n  if (numClasses ==\
  \ 3) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y == 1, 2] = 1\n    Y1[Y == 2, 3] = 1\n  }\
  \ else if (numClasses == 10) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y == 1, 2] = 1\n \
  \   Y1[Y == 2, 3] = 1\n    Y1[Y == 3, 4] = 1\n    Y1[Y == 4, 5] = 1\n    Y1[Y ==\
  \ 5, 6] = 1\n    Y1[Y == 6, 7] = 1\n    Y1[Y == 7, 8] = 1\n    Y1[Y == 8, 9] = 1\n\
  \    Y1[Y == 9, 0] = 1  # 注意：R 语言中索引 0 访问最后一个元素，此处可能意指第 10 列\n  }\n  return(Y1)\n\
  }\n\n# 计算 Softmax 导数\nsoftmaxDerivative <- function(dA, cache, y, numTraining, numClasses)\
  \ {\n  # 注意：未使用 dA。dL/dZ = dL/dA * dA/dZ = pi-yi\n  Z <- cache\n  # 计算 Softmax\n\
  \  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  probs = exp_scores / rowSums(exp_scores)\n\
  \  # 创建一个零矩阵\n  Y1 = popMatrix(y, numClasses)\n  dZ = probs - Y1\n  return(dZ)\n\
  }\n```\n\n## 模型初始化\n\n```r\n# 初始化 L 层模型\n# 输入：每层单元数列表\n# 返回：所有层的初始权重和偏置矩阵\ninitializeDeepModel\
  \ <- function(layerDimensions) {\n  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n\
  \  # 注意第 'l' 层的权重矩阵大小为 (l, l-1)\n  # 偏置是大小为 (l, 1) 的向量\n  # 遍历层维度从 1 到 L\n  # R\
  \ 语言索引从 1 开始\n  for (l in 2:length(layerDimensions)) {\n    # 初始化一个大小为 l x l-1 的小随机数矩阵\n\
  \    # 创建大小为 l x l-1 的随机数\n    w = rnorm(layerDimensions[l] * layerDimensions[l-1])\
  \ * 0.01\n    # 用这些初始权重创建一个大小为 l x l-1 的权重矩阵\n    # 并添加到列表 W1, W2... WL 中\n    layerParams[[paste('W',\
  \ l-1, sep=\"\")]] = matrix(w, nrow = layerDimensions[l], ncol = layerDimensions[l-1])\n\
  \    layerParams[[paste('b', l-1, sep=\"\")]] = matrix(rep(0, layerDimensions[l]),\
  \ nrow = layerDimensions[l], ncol = 1)\n  }\n  return(layerParams)\n}\n```\n\n\n\
  \n\n# 用于 L 层的 He 初始化模型\n\n**输入**：每层单元数的向量\n\n**返回**：所有层的初始权重和偏置矩阵\n\nHe 初始化将随机数乘以\
  \ `sqrt(2/layerDimensions[previouslayer])`\n\n```r\nHeInitializeDeepModel <- function(layerDimensions){\n\
  \  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n  # 注意第 'l' 层的权重矩阵是大小为 (l,l-1)\
  \ 的矩阵\n  # 偏置是大小为 (l,1) 的向量\n  # 遍历层维度从 1 到 L\n  # R 语言中的索引从 1 开始\n  for(l in 2:length(layerDimensions)){\n\
  \    # 初始化大小为 l x l-1 的小随机数矩阵\n    # 创建大小为 l x l-1 的随机数\n    w=rnorm(layerDimensions[l]*layerDimensions[l-1])\n\
  \    # 使用这些初始权重创建大小为 l x l-1 的权重矩阵并\n    # 添加到列表 W1,W2... WL 中\n    # He 初始化 - 除以\
  \ sqrt(2/layerDimensions[previous layer])\n    layerParams[[paste('W',l-1,sep=\"\
  \")]] =\n      matrix(w,nrow=layerDimensions[l],\n             ncol=layerDimensions[l-1])*sqrt(2/layerDimensions[l-1])\n\
  \    layerParams[[paste('b',l-1,sep=\"\")]] = matrix(rep(0,layerDimensions[l]),\
  \ nrow=layerDimensions[l],ncol=1)\n  }\n  return(layerParams)\n}\n```\n\n# 用于 L\
  \ 层的 XavInitializeDeepModel 初始化模型\n\n**输入**：每层单元数的向量\n\n**返回**：所有层的初始权重和偏置矩阵\n\n\
  Xavier 初始化将随机数乘以 `sqrt(1/layerDimensions[previouslayer])`\n\n```r\nXavInitializeDeepModel\
  \ <- function(layerDimensions){\n  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n\
  \  # 注意第 'l' 层的权重矩阵是大小为 (l,l-1) 的矩阵\n  # 偏置是大小为 (l,1) 的向量\n  # 遍历层维度从 1 到 L\n  #\
  \ R 语言中的索引从 1 开始\n  for(l in 2:length(layerDimensions)){\n    # 初始化大小为 l x l-1 的小随机数矩阵\n\
  \    # 创建大小为 l x l-1 的随机数\n    w=rnorm(layerDimensions[l]*layerDimensions[l-1])\n\
  \    # 使用这些初始权重创建大小为 l x l-1 的权重矩阵并\n    # 添加到列表 W1,W2... WL 中\n    # Xavier 初始化\
  \ - 除以 sqrt(1/layerDimensions[previous layer])\n    layerParams[[paste('W',l-1,sep=\"\
  \")]] =\n      matrix(w,nrow=layerDimensions[l],\n             ncol=layerDimensions[l-1])*sqrt(1/layerDimensions[l-1])\n\
  \    layerParams[[paste('b',l-1,sep=\"\")]] = matrix(rep(0,layerDimensions[l]),\
  \ nrow=layerDimensions[l],ncol=1)\n  }\n  return(layerParams)\n}\n```\n\n# 计算深度网络中第\
  \ 'l' 层的前向传播激活值\n\n**输入**：\n- `A_prev` - 上一层的激活值\n- `W`, `b` - 权重和偏置矩阵及向量\n- `activationFunc`\
  \ - 激活函数 - sigmoid、tanh、relu 等\n\n**返回**：该层的激活值\n\n**公式**：\n- `Z = W %*% X + b`\n\
  - `A = sigmoid(Z)`, `A = Relu(Z)`, `A = tanh(Z)`\n\n```r\nlayerActivationForward\
  \ <- function(A_prev, W, b, activationFunc){\n  # 计算 Z\n  z = W %*% A_prev\n  #\
  \ 按列广播偏置 'b'\n  Z <- sweep(z, 1, b, '+')\n  forward_cache <- list(\"A_prev\"=A_prev,\
  \ \"W\"=W, \"b\"=b)\n  # 计算 sigmoid 的激活值\n  if(activationFunc == \"sigmoid\"){\n\
  \    vals = sigmoid(Z)\n  } else if (activationFunc == \"relu\"){ # 计算 relu 的激活值\n\
  \    vals = relu(Z)\n  } else if(activationFunc == 'tanh'){ # 计算 tanh 的激活值\n   \
  \ vals = tanhActivation(Z)\n  } else if(activationFunc == 'softmax'){\n    vals\
  \ = softmax(Z)\n  }\n  # 创建前向和激活缓存的列表\n  cache <- list(\"forward_cache\"=forward_cache,\
  \ \"activation_cache\"=vals[['Z']])\n  retvals <- list(\"A\"=vals[['A']], \"cache\"\
  =cache)\n  return(retvals)\n}\n```\n\n# 计算第 1 到 L 层的前向传播\n\n**输入**：\n- `X` - 输入特征\n\
  - `parameters` - 权重和偏置\n- `keep_prob` - Dropout 保留概率\n- `hiddenActivationFunc` -\
  \ relu/sigmoid/tanh\n- `outputActivationFunc` - 输出层的激活函数 sigmoid/softmax\n\n**返回**：\n\
  - `AL` - 输出激活值\n- `caches` - 缓存列表\n- `dropoutMat` - Dropout 矩阵\n\n前向传播在第 1 到 L-1\
  \ 层使用 Relu/tanh 激活函数，在第 L 层使用 sigmoid/softmax 激活函数。\n\n```r\nforwardPropagationDeep\
  \ <- function(X, parameters, keep_prob=1, hiddenActivationFunc='relu',\n       \
  \                            outputActivationFunc='sigmoid'){\n  caches <- list()\n\
  \  dropoutMat <- list()\n  # 将 A 设为 X (A0)\n  A <- X\n  L <- length(parameters)/2\
  \ # 神经网络中的层数\n  # 从第 1 层循环到第 L 层\n  for(l in 1:(L-1)){\n    A_prev <- A\n    # Zi\
  \ = Wi x Ai-1 + bi 和 Ai = g(Zi)\n    # 设置第 'l' 层的 W 和 b\n    # 从 W1,W2... WL-1 循环\n\
  \    W <- parameters[[paste(\"W\",l,sep=\"\")]]\n    b <- parameters[[paste(\"b\"\
  ,l,sep=\"\")]]\n    # 使用激活函数计算通过第 'l' 层的前向传播\n    actForward <- layerActivationForward(A_prev,\
  \ W, b, activationFunc = hiddenActivationFunc)\n    A <- actForward[['A']]\n   \
  \ # 追加缓存 A_prev,W,b, Z\n    caches[[l]] <- actForward\n    # 随机丢弃一些激活单元\n    # 创建一个与\
  \ A 形状相同的矩阵\n    set.seed(1)\n    i=dim(A)[1]\n    j=dim(A)[2]\n    a<-rnorm(i*j)\n\
  \    # 将 a 归一化到 0 和 1 之间\n    a = (a - min(a))/(max(a) - min(a))\n    # 创建矩阵 D\n\
  \    D <- matrix(a, nrow=i, ncol=j)\n    # 找出小于等于 keep_prob 的 D\n    D <- D < keep_prob\n\
  \    # 移除一些 A\n    A <- A * D\n    # 除以 keep_prob 以保持期望值不变\n    A <- A/keep_prob\n\
  \    dropoutMat[[paste(\"D\",l,sep=\"\")]] <- D\n  }\n  # 因为这是二分类，所以在最后一层使用 sigmoid\
  \ 激活函数\n  # 设置最后一层的权重和偏置\n  W <- parameters[[paste(\"W\",L,sep=\"\")]]\n  b <- parameters[[paste(\"\
  b\",L,sep=\"\")]]\n  # 计算 sigmoid 激活值\n  actForward = layerActivationForward(A,\
  \ W, b, activationFunc = outputActivationFunc)\n  AL <- actForward[['A']]\n  # 追加通过最后一层的前向传播输出\n\
  \  caches[[L]] <- actForward\n  # 创建最终输出和缓存的列表\n  fwdPropDeep <- list(\"AL\"=AL,\
  \ \"caches\"=caches, \"dropoutMat\"=dropoutMat)\n  return(fwdPropDeep)\n}\n```\n\
  \n# 函数 `pickColumns()`\n\n此函数用于 `computeCost()`。\n\n**输入**：\n- `AL`\n- `Y`\n- `numClasses`\n\
  \n**输出**：`a`\n\n```r\npickColumns <- function(AL, Y, numClasses){\n  if(numClasses\
  \ == 3){\n    a = c(AL[Y==0,1], AL[Y==1,2], AL[Y==2,3])\n  } else if (numClasses\
  \ == 10){\n    a = c(AL[Y==0,1], AL[Y==1,2], AL[Y==2,3], AL[Y==3,4], AL[Y==4,5],\n\
  \          AL[Y==5,6], AL[Y==6,7], AL[Y==7,8], AL[Y==8,9], AL[Y==9,10])\n  }\n \
  \ return(a)\n}\n```\n\n# 计算代价\n\n**输入**：\n- `AL` - 最后一层的激活值\n- `Y` - 数据的输出\n- `outputActivationFunc`\
  \ - 输出层的激活函数 sigmoid/softmax\n- `numClasses`\n\n**输出**：`cost`\n\n```r\ncomputeCost\
  \ <- function(AL, Y, outputActivationFunc=\"sigmoid\", numClasses=3){\n  if(outputActivationFunc\
  \ == \"sigmoid\"){\n    m = length(Y)\n    cost = -1/m * sum(Y * log(AL) + (1-Y)\
  \ * log(1-AL))\n  } else if (outputActivationFunc == \"softmax\"){\n    # 选择 y 值为\
  \ 0、1 或 2 的元素并生成向量\n    # 选取列\n    # a = c(AL[Y==0,1], AL[Y==1,2], AL[Y==2,3])\n\
  \    m = length(Y)\n    a = pickColumns(AL, Y, numClasses)\n    # a = c(A2[y=k,k+1])\n\
  \    # 取对数\n    correct_probs = -log(a)\n    # 计算损失\n    cost = sum(correct_probs)\
  \ / m\n  }\n  # cost = -1/m * sum(a+b)\n  return(cost)\n}\n```\n\n# 计算带正则化的代价\n\n\
  **输入**：\n- `parameters`\n- `AL` - 最后一层的激活值\n- `Y` - 数据的输出\n- `lambd` - 正则化参数\n-\
  \ `outputActivationFunc` - 输出层的激活函数 sigmoid/softmax\n- `numClasses`\n\n**输出**：`cost`\n\
  \n```r\ncomputeCostWithReg <- function(parameters, AL, Y, lambd,\n             \
  \                  outputActivationFunc=\"sigmoid\", numClasses=3){\n  if(outputActivationFunc\
  \ == \"sigmoid\"){\n    m = length(Y)\n    cost = -1/m * sum(Y * log(AL) + (1-Y)\
  \ * log(1-AL))\n    # 正则化代价\n    L <- length(parameters)/2\n    L2RegularizationCost\
  \ = 0\n    for(l in 1:L){\n      L2RegularizationCost = L2RegularizationCost + sum(parameters[[paste(\"\
  W\",l,sep=\"\")]]²)\n    }\n    L2RegularizationCost = (lambd/(2*m)) * L2RegularizationCost\n\
  \    cost = cost + L2RegularizationCost\n  } else if (outputActivationFunc == \"\
  softmax\"){\n    # 选择 y 值为 0、1 或 2 的元素并生成向量\n    # 选取列\n```\n\n\n\n\n\n# R 语言神经网络实现代码\n\
  \n## 代码片段 1：成本计算与正则化\n\n```r\na = c(AL[Y==0,1], AL[Y==1,2], AL[Y==2,3])\n\nm = length(Y)\n\
  \na = pickColumns(AL, Y, numClasses)\n\n# a = c(A2[y=k,k+1])\n\n# 取对数\ncorrect_probs\
  \ = -log(a)\n\n# 计算损失\ncost = sum(correct_probs) / m\n\n# 正则化成本\nL <- length(parameters)\
  \ / 2\n\nL2RegularizationCost = 0\n\n# 添加 L2 范数\nfor(l in 1:L) {\n  L2RegularizationCost\
  \ = L2RegularizationCost +\n    sum(parameters[[paste(\"W\", l, sep=\"\")]]²)\n\
  }\n\nL2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\ncost = cost\
  \ + L2RegularizationCost\n}\n\nreturn(cost)\n}\n```\n\n## 代码片段 2：单层反向传播\n\n```r\n\
  # 计算通过某层的反向传播\n# 输入：神经网络参数 - dA\n# # cache - forward_cache 与 activation_cache\n\
  # # 输出值 Y\n# # activationFunc\n# # numClasses\n# 返回：梯度\n# dL/dWi = dL/dZi * Al-1\n\
  # dl/dbl = dL/dZl\n# dL/dZ_prev = dL/dZl * W\n\nlayerActivationBackward <- function(dA,\
  \ cache, Y, activationFunc, numClasses) {\n\n  # 获取 A_prev, W, b\n  forward_cache\
  \ <- cache[['forward_cache']]\n  activation_cache <- cache[['activation_cache']]\n\
  \  A_prev <- forward_cache[['A_prev']]\n  numtraining = dim(A_prev)[2]\n\n  # 获取\
  \ Z\n  activation_cache <- cache[['activation_cache']]\n\n  if(activationFunc ==\
  \ \"relu\") {\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if(activationFunc\
  \ == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if(activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if(activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA, activation_cache,\
  \ Y, numtraining, numClasses)\n  }\n\n  if (activationFunc == 'softmax') {\n   \
  \ W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n    dW = 1/numtraining\
  \ * A_prev %*% dZ\n    db = 1/numtraining * matrix(colSums(dZ), nrow=1, ncol=numClasses)\n\
  \    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n\
  \    numtraining = dim(A_prev)[2]\n    dW = 1/numtraining * dZ %*% t(A_prev)\n \
  \   db = 1/numtraining * rowSums(dZ)\n    dA_prev = t(W) %*% dZ\n  }\n\n  retvals\
  \ <- list(\"dA_prev\"=dA_prev, \"dW\"=dW, \"db\"=db)\n  return(retvals)\n}\n```\n\
  \n## 代码片段 3：带正则化的单层反向传播\n\n```r\n# 计算带正则化的通过某层的反向传播\n# 输入：dA - 神经网络参数\n# # cache\
  \ - forward_cache 与 activation_cache\n# # 输出值 Y\n# # lambd\n# # activationFunc\n\
  # # numClasses\n# 返回：梯度\n# dL/dWi = dL/dZi * Al-1\n# dl/dbl = dL/dZl\n# dL/dZ_prev\
  \ = dL/dZl * W\n\nlayerActivationBackwardWithReg <- function(dA, cache, Y, lambd,\
  \ activationFunc, numClasses) {\n\n  # 获取 A_prev, W, b\n  forward_cache <- cache[['forward_cache']]\n\
  \  activation_cache <- cache[['activation_cache']]\n  A_prev <- forward_cache[['A_prev']]\n\
  \  numtraining = dim(A_prev)[2]\n\n  # 获取 Z\n  activation_cache <- cache[['activation_cache']]\n\
  \n  if(activationFunc == \"relu\") {\n    dZ <- reluDerivative(dA, activation_cache)\n\
  \  } else if(activationFunc == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n\
  \  } else if(activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if(activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA, activation_cache,\
  \ Y, numtraining, numClasses)\n  }\n\n  if (activationFunc == 'softmax') {\n   \
  \ W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n    # 添加正则化因子\n    dW\
  \ = 1/numtraining * A_prev %*% dZ + (lambd/numtraining) * t(W)\n    db = 1/numtraining\
  \ * matrix(colSums(dZ), nrow=1, ncol=numClasses)\n    dA_prev = dZ %*% W\n  } else\
  \ {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n    numtraining\
  \ = dim(A_prev)[2]\n    # 添加正则化因子\n    dW = 1/numtraining * dZ %*% t(A_prev) + (lambd/numtraining)\
  \ * W\n    db = 1/numtraining * rowSums(dZ)\n    dA_prev = t(W) %*% dZ\n  }\n\n\
  \  retvals <- list(\"dA_prev\"=dA_prev, \"dW\"=dW, \"db\"=db)\n  return(retvals)\n\
  }\n```\n\n## 代码片段 4：深度网络反向传播\n\n```r\n# 计算通过所有层的 1 个周期的反向传播\n# 输入：AL: L 层网络的输出 -\
  \ 权重\n# Y 真实输出\n# caches -- 包含以下内容的缓存列表：\n# 每个 layerActivationForward() 的缓存，激活函数为\
  \ \"relu\"/\"tanh\"\n# #(即 caches[l]，l 的范围为 L-1，即 l = 0...L-2)\n# #layerActivationForward()\
  \ 的缓存，激活函数为 \"sigmoid\" (即 caches[L-1])\n# dropoutMat\n# lambd\n# keep_prob\n# hiddenActivationFunc\
  \ - 隐藏层的激活函数 - relu/tanh/sigmoid\n# outputActivationFunc - 输出层的激活函数 sigmoid/softmax\n\
  # numClasses\n# 返回：\n# gradients -- 包含梯度的字典\n# gradients[\"dA\" + str(l)]\n# gradients[\"\
  dW\" + str(l)]\n# gradients[\"db\" + str(l)]\n\nbackwardPropagationDeep <- function(AL,\
  \ Y, caches, dropoutMat, lambd=0, keep_prob=0, hiddenActivationFunc='relu',\n  \
  \                                  outputActivationFunc=\"sigmoid\", numClasses)\
  \ {\n\n  # 初始化梯度\n  gradients = list()\n\n  # 设置层数\n  L = length(caches)\n  numTraining\
  \ = dim(AL)[2]\n\n  if(outputActivationFunc == \"sigmoid\")\n    # 初始化反向传播\n   \
  \ # dl/dAL = -(y/a) - ((1-y)/(1-a)) - 在输出层\n    dAL = -( (Y/AL) - (1 - Y)/(1 - AL))\n\
  \  else if(outputActivationFunc == \"softmax\") {\n    dAL = 0\n    Y = t(Y)\n \
  \ }\n\n  # 获取最后一层的梯度\n  # 输入：\"AL, Y, caches\"。\n  # 输出：\"gradients[\"dAL\"], gradients[\"\
  dWL\"], gradients[\"dbL\"]\"\n  # 从第 L 层开始\n  # 获取当前缓存\n  current_cache = caches[[L]]$cache\n\
  \n  if (lambd == 0) {\n    retvals <- layerActivationBackward(dAL, current_cache,\
  \ Y,\n                                       activationFunc = outputActivationFunc,\
  \ numClasses)\n  } else {\n    retvals = layerActivationBackwardWithReg(dAL, current_cache,\
  \ Y, lambd, activationFunc = outputActivationFunc, numClasses)\n  }\n\n  # 注意：取\
  \ dA 的转置\n  if(outputActivationFunc == \"sigmoid\")\n    gradients[[paste(\"dA\"\
  , L, sep=\"\")]] <- retvals[['dA_prev']]\n  else if(outputActivationFunc == \"softmax\"\
  )\n    gradients[[paste(\"dA\", L, sep=\"\")]] <- t(retvals[['dA_prev']])\n\n  gradients[[paste(\"\
  dW\", L, sep=\"\")]] <- retvals[['dW']]\n  gradients[[paste(\"db\", L, sep=\"\"\
  )]] <- retvals[['db']]\n\n  # 反向遍历\n  for(l in (L-1):1) {\n    # 计算 L-1 到 1 层的梯度（针对\
  \ Relu/tanh）\n    # 输入：\"gradients[\"dA\" + str(l + 2)], caches\"。\n    # 输出：\"\
  gradients[\"dA\" + str(l + 1)] , gradients[\"dW\" + str(l + 1)] , gradients[\"db\"\
  \ + str(l + 1)]\"\n    current_cache = caches[[l]]$cache\n\n    if (lambd == 0)\
  \ {\n      # 获取 dropout 矩阵\n      D <- dropoutMat[[paste(\"D\", l, sep=\"\")]]\n\
  \      # 梯度与 dropout 矩阵相乘\n      gradients[[paste('dA', l+1, sep=\"\")]] = gradients[[paste('dA',\
  \ l+1, sep=\"\")]] * D\n      # 除以 keep_prob 以保持期望值不变\n      gradients[[paste('dA',\
  \ l+1, sep=\"\")]] =\n        gradients[[paste('dA', l+1, sep=\"\")]] / keep_prob\n\
  \n      retvals = layerActivationBackward(gradients[[paste('dA', l+1, sep=\"\")]],\
  \ current_cache, Y,\n                                        activationFunc = hiddenActivationFunc)\n\
  \    } else {\n      retvals =\n        layerActivationBackwardWithReg(gradients[[paste('dA',\
  \ l+1, sep=\"\")]], current_cache, Y, lambd,\n                                 \
  \      activationFunc = hiddenActivationFunc)\n    }\n\n    gradients[[paste(\"\
  dA\", l, sep=\"\")]] <- retvals[['dA_prev']]\n    gradients[[paste(\"dW\", l, sep=\"\
  \")]] <- retvals[['dW']]\n    gradients[[paste(\"db\", l, sep=\"\")]] <- retvals[['db']]\n\
  \  }\n\n  return(gradients)\n}\n```\n\n## 代码片段 5：梯度下降参数更新\n\n```r\n# 执行梯度下降\n# 输入：权重和偏置\n\
  # : 梯度\n# : 学习率\n# : outputActivationFunc - 隐藏层的激活函数 sigmoid/softmax\n# 输出：1 次迭代后更新的权重\n\
  \ngradientDescent <- function(parameters, gradients,\n                         \
  \   learningRate, outputActivationFunc=\"sigmoid\") {\n\n  L = length(parameters)\
  \ / 2 # 神经网络中的层数\n\n  # 每个参数的更新规则。使用 for 循环。\n  for(l in 1:(L-1)) {\n    parameters[[paste(\"\
  W\", l, sep=\"\")]] = parameters[[paste(\"W\", l, sep=\"\")]] -\n      learningRate\
  \ * gradients[[paste(\"dW\", l, sep=\"\")]]\n    parameters[[paste(\"b\", l, sep=\"\
  \")]] = parameters[[paste(\"b\", l, sep=\"\")]] -\n      learningRate * gradients[[paste(\"\
  db\", l, sep=\"\")]]\n  }\n\n  if(outputActivationFunc == \"sigmoid\") {\n    parameters[[paste(\"\
  W\", L, sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] -\n      learningRate\
  \ * gradients[[paste(\"dW\", L, sep=\"\")]]\n  }\n}\n```\n\n\n\n\n\n# L 层深度学习模型实现\n\
  \n## 参数更新逻辑\n\n```r\nparameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] -\n  learningRate * gradients[[paste(\"db\", L, sep=\"\")]]\n\
  } else if (outputActivationFunc == \"softmax\") {\n  parameters[[paste(\"W\", L,\
  \ sep=\"\")]] = parameters[[paste(\"W\", L, sep=\"\")]] -\n    learningRate * t(gradients[[paste(\"\
  dW\", L, sep=\"\")]])\n  parameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"\
  b\", L, sep=\"\")]] -\n    learningRate * t(gradients[[paste(\"db\", L, sep=\"\"\
  )]])\n}\nreturn(parameters)\n}\n```\n\n## 函数：`L_Layer_DeepModel`\n\n执行一个 L 层深度学习模型。\n\
  \n### 输入参数\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `X` | 输入特征 |\n| `Y` | 输出标签 |\n| `layersDimensions`\
  \ | 各层维度向量 |\n| `hiddenActivationFunc` | 隐藏层激活函数 (`relu` / `tanh`) |\n| `outputActivationFunc`\
  \ | 输出层激活函数 (`sigmoid` / `softmax`) |\n| `learningRate` | 学习率 |\n| `lambd` | 正则化参数\
  \ |\n| `keep_prob` | Dropout 保留概率 |\n| `numIterations` | 迭代次数 |\n| `initType` |\
  \ 初始化类型 (`default`, `He`, `Xav`) |\n| `print_cost` | 是否打印成本 |\n\n### 输出\n\n更新后的权重参数。\n\
  \n### 代码实现\n\n```r\nL_Layer_DeepModel <- function(X, Y, layersDimensions,\n    \
  \                          hiddenActivationFunc = 'relu',\n                    \
  \          outputActivationFunc = 'sigmoid',\n                              learningRate\
  \ = 0.5,\n                              lambd = 0,\n                           \
  \   keep_prob = 1,\n                              numIterations = 10000,\n     \
  \                         initType = \"default\",\n                            \
  \  print_cost = FALSE) {\n\n  # Initialize costs vector as NULL\n  costs <- NULL\n\
  \n  # Parameters initialization.\n  if (initType == \"He\") {\n    parameters =\
  \ HeInitializeDeepModel(layersDimensions)\n  } else if (initType == \"Xav\") {\n\
  \    parameters = XavInitializeDeepModel(layersDimensions)\n  } else {\n    print(\"\
  Here\")\n    parameters = initializeDeepModel(layersDimensions)\n  }\n\n  # Loop\
  \ (gradient descent)\n  for (i in 0:numIterations) {\n\n    # Forward propagation:\
  \ [LINEAR -> RELU]*(L-1) -> LINEAR -> SIGMOID/SOFTMAX.\n    retvals = forwardPropagationDeep(X,\
  \ parameters, keep_prob,\n                                     hiddenActivationFunc,\n\
  \                                     outputActivationFunc = outputActivationFunc)\n\
  \n    AL <- retvals[['AL']]\n    caches <- retvals[['caches']]\n    dropoutMat <-\
  \ retvals[['dropoutMat']]\n\n    # Compute cost.\n    if (lambd == 0) {\n      cost\
  \ <- computeCost(AL,\n                          Y, outputActivationFunc = outputActivationFunc,\n\
  \                          numClasses = layersDimensions[length(layersDimensions)])\n\
  \    } else {\n      cost <- computeCostWithReg(parameters, AL, Y, lambd,\n    \
  \                             outputActivationFunc = outputActivationFunc,\n   \
  \                              numClasses = layersDimensions[length(layersDimensions)])\n\
  \    }\n\n    # Backward propagation.\n    gradients = backwardPropagationDeep(AL,\
  \ Y, caches, dropoutMat, lambd, keep_prob, hiddenActivationFunc,\n             \
  \                           outputActivationFunc = outputActivationFunc,\n     \
  \                                   numClasses = layersDimensions[length(layersDimensions)])\n\
  \n    # Update parameters.\n    parameters = gradientDescent(parameters, gradients,\
  \ learningRate, outputActivationFunc = outputActivationFunc)\n\n    if (i %% 1000\
  \ == 0) {\n      costs = c(costs, cost)\n      print(cost)\n    }\n  }\n\n  retvals\
  \ <- list(\"parameters\" = parameters, \"costs\" = costs)\n  return(retvals)\n}\n\
  ```\n\n## 函数：`L_Layer_DeepModel_SGD`\n\n执行一个带有随机梯度下降 (SGD) 的 L 层深度学习模型。\n\n### 输入参数\n\
  \n| 参数 | 说明 |\n| :--- | :--- |\n| `X` | 输入特征 |\n| `Y` | 输出标签 |\n| `layersDimensions`\
  \ | 各层维度向量 |\n| `hiddenActivationFunc` | 隐藏层激活函数 (`relu` / `tanh`) |\n| `outputActivationFunc`\
  \ | 输出层激活函数 (`sigmoid` / `softmax`) |\n| `learningRate` | 学习率 |\n| `mini_batch_size`\
  \ | 小批量大小 |\n| `num_epochs` | 训练轮数 |\n| `print_cost` | 是否打印成本 |\n\n### 输出\n\n每次迭代后更新的权重。\n\
  \n### 代码实现\n\n```r\nL_Layer_DeepModel_SGD <- function(X, Y, layersDimensions,\n\
  \                                  hiddenActivationFunc = 'relu',\n            \
  \                      outputActivationFunc = 'sigmoid',\n                     \
  \             learningRate = .3,\n                                  mini_batch_size\
  \ = 64,\n                                  num_epochs = 2500,\n                \
  \                  print_cost = FALSE) {\n\n  set.seed(1)\n\n  # Initialize costs\
  \ vector as NULL\n  costs <- NULL\n\n  # Parameters initialization.\n  parameters\
  \ = initializeDeepModel(layersDimensions)\n\n  seed = 10\n\n  # Loop for number\
  \ of epochs\n  for (i in 0:num_epochs) {\n\n    seed = seed + 1\n    minibatches\
  \ = random_mini_batches(X, Y, mini_batch_size, seed)\n\n    for (batch in 1:length(minibatches))\
  \ {\n\n      mini_batch_X = minibatches[[batch]][['mini_batch_X']]\n      mini_batch_Y\
  \ = minibatches[[batch]][['mini_batch_Y']]\n\n      # Forward propagation:\n   \
  \   retvals = forwardPropagationDeep(mini_batch_X,\n                           \
  \            parameters, hiddenActivationFunc,\n                               \
  \        outputActivationFunc = outputActivationFunc)\n\n      AL <- retvals[['AL']]\n\
  \      caches <- retvals[['caches']]\n\n      # Compute cost.\n      cost <- computeCost(AL,\n\
  \                          mini_batch_Y, outputActivationFunc = outputActivationFunc,\n\
  \                          numClasses = layersDimensions[length(layersDimensions)])\n\
  \n      # Backward propagation.\n      gradients = backwardPropagationDeep(AL, mini_batch_Y,\n\
  \                                          caches, hiddenActivationFunc,\n     \
  \                                     outputActivationFunc = outputActivationFunc,\n\
  \                                          numClasses = layersDimensions[length(layersDimensions)])\n\
  \n      # Update parameters.\n      parameters = gradientDescent(parameters, gradients,\
  \ learningRate, outputActivationFunc = outputActivationFunc)\n    }\n\n    if (i\
  \ %% 100 == 0) {\n      costs = c(costs, cost)\n      print(cost)\n    }\n  }\n\n\
  \  retvals <- list(\"parameters\" = parameters, \"costs\" = costs)\n  return(retvals)\n\
  }\n```\n\n## 函数：`predict`\n\n根据给定输入预测输出。\n\n### 输入参数\n\n*   `parameters`：模型参数\n\
  *   `X`：输入数据\n*   `keep_prob`：Dropout 保留概率 (默认 1)\n*   `hiddenActivationFunc`：隐藏层激活函数\
  \ (默认 `relu`)\n\n### 输出\n\n预测结果 (布尔值)。\n\n### 代码实现\n\n```r\npredict <- function(parameters,\
  \ X, keep_prob = 1, hiddenActivationFunc = 'relu') {\n  fwdProp <- forwardPropagationDeep(X,\
  \ parameters, keep_prob, hiddenActivationFunc)\n  predictions <- fwdProp$AL > 0.5\n\
  \  return(predictions)\n}\n```\n\n## 函数：`plotDecisionBoundary`\n\n绘制决策边界 (使用 `ggplot2`)。\n\
  \n### 输入参数\n\n*   `z`：数据集\n*   `retvals`：包含参数的返回列表\n*   `keep_prob`：Dropout 保留概率\n\
  *   `hiddenActivationFunc`：隐藏层激活函数\n*   `lr`：学习率 (用于标题显示)\n\n### 代码实现\n\n```r\n\
  plotDecisionBoundary <- function(z, retvals, keep_prob = 1, hiddenActivationFunc\
  \ = \"sigmoid\", lr = 0.5) {\n\n  # Find the minimum and maximum for the data\n\
  \  xmin <- min(z[, 1])\n  xmax <- max(z[, 1])\n  ymin <- min(z[, 2])\n  ymax <-\
  \ max(z[, 2])\n\n  # Create a grid of values\n  a = seq(xmin, xmax, length = 100)\n\
  \  b = seq(ymin, ymax, length = 100)\n  grid <- expand.grid(x = a, y = b)\n  colnames(grid)\
  \ <- c('x1', 'x2')\n  grid1 <- t(grid)\n\n  # Predict the output for this grid\n\
  \  q <- predict(retvals$parameters, grid1, keep_prob = 1, hiddenActivationFunc)\n\
  \  q1 <- t(data.frame(q))\n  q2 <- as.numeric(q1)\n  grid2 <- cbind(grid, q2)\n\
  \  colnames(grid2) <- c('x1', 'x2', 'q2')\n\n  z1 <- data.frame(z)\n  names(z1)\
  \ <- c(\"x1\", \"x2\", \"y\")\n  atitle = paste(\"Decision boundary for learning\
  \ rate:\", lr)\n\n  # Plot the contour of the boundary\n  ggplot(z1) +\n    geom_point(data\
  \ = z1, aes(x = x1, y = x2, color = y)) +\n    stat_contour(data = grid2, aes(x\
  \ = x1, y = x2, z = q2, color = q2), alpha = 0.9) +\n    ggtitle(atitle) + scale_colour_gradientn(colours\
  \ = brewer.pal(10, \"Spectral\"))\n}\n```\n\n## 函数：`computeScores`\n\n计算给定数据集的概率分数。\n\
  \n### 输入参数\n\n*   `parameters`：模型参数\n*   `X`：输入数据\n*   `hiddenActivationFunc`：隐藏层激活函数\
  \ (默认 `relu`)\n\n### 输出\n\n输出概率 (`AL`)。\n\n### 代码实现\n\n```r\ncomputeScores <- function(parameters,\
  \ X, hiddenActivationFunc = 'relu') {\n  fwdProp <- forwardPropagationDeep(X, parameters,\
  \ hiddenActivationFunc)\n  scores <- fwdProp$AL\n  return(scores)\n}\n```\n\n##\
  \ 函数：`random_mini_batches`\n\n创建随机小批量数据。\n\n### 输入参数\n\n*   `X`：输入特征\n*   `Y`：输出标签\n\
  *   `miniBatchSize`：小批量大小 (默认 64)\n*   `seed`：随机种子 (默认 0)\n\n### 输出\n\n`mini_batches`\
  \ 列表。\n\n### 代码实现\n\n```r\nrandom_mini_batches <- function(X, Y, miniBatchSize =\
  \ 64, seed = 0) {\n\n  set.seed(seed)\n\n  # Get number of training samples\n  m\
  \ = dim(X)[2]\n\n  # Initialize mini batches\n  mini_batches = list()\n\n  # Create\
  \ a list of random numbers < m\n  permutation = c(sample(m))\n\n  # Randomly shuffle\
  \ the training data\n  shuffled_X = X[, permutation]\n  shuffled_Y = Y[1, permutation]\n\
  \n  # Compute number of mini batches\n  numCompleteMinibatches = floor(m / miniBatchSize)\n\
  \n  batch = 0\n\n  for (k in 0:(numCompleteMinibatches - 1)) {\n\n    batch = batch\
  \ + 1\n\n    # Set the lower and upper bound of the mini batches\n    lower = (k\
  \ * miniBatchSize) + 1\n    upper = ((k + 1) * miniBatchSize)\n\n    mini_batch_X\
  \ = shuffled_X[, lower:upper]\n    mini_batch_Y = shuffled_Y[lower:upper]\n\n  \
  \  # Add it to the list of mini batches\n    mini_batch = list(\"mini_batch_X\"\
  \ = mini_batch_X, \"mini_batch_Y\" = mini_batch_Y)\n    mini_batches[[batch]] =\
  \ mini_batch\n  }\n\n  # If the batch size does not divide evenly with mini batch\
  \ size\n  if (m %% miniBatchSize != 0) {\n\n    p = floor(m / miniBatchSize) * miniBatchSize\n\
  \n    # Set the start and end of last batch\n    q = p + m %% miniBatchSize\n\n\
  \    mini_batch_X = shuffled_X[, (p + 1):q]\n    mini_batch_Y = shuffled_Y[(p +\
  \ 1):q]\n\n    mini_batch = list(\"mini_batch_X\" = mini_batch_X, \"mini_batch_Y\"\
  \ = mini_batch_Y)\n    mini_batches[[batch]] = mini_batch\n  }\n\n  # Return the\
  \ list of mini batches\n  return(mini_batches)\n}\n```\n\n## 函数：`plotDecisionBoundary1`\n\
  \n绘制决策边界 (变体 1，使用 `ggplot2`)。\n\n### 输入参数\n\n*   `Z`：数据集\n*   `parameters`：模型参数\n\
  *   `keep_prob`：Dropout 保留概率\n\n### 代码实现 (片段)\n\n```r\nplotDecisionBoundary1 <-\
  \ function(Z, parameters, keep_prob = 1) {\n\n  xmin <- min(Z[, 1])\n  xmax <- max(Z[,\
  \ 1])\n  ymin <- min(Z[, 2])\n  ymax <- max(Z[, 2])\n  # ... 后续绘图逻辑\n}\n```\n\n\n\
  \n\n# 创建点网格\n\n```r\na = seq(xmin, xmax, length = 100)\nb = seq(ymin, ymax, length\
  \ = 100)\ngrid <- expand.grid(x = a, y = b)\ncolnames(grid) <- c('x1', 'x2')\ngrid1\
  \ <- t(grid)\nretvals = forwardPropagationDeep(grid1, parameters, keep_prob, \"\
  relu\", outputActivationFunc = \"softmax\")\nAL <- retvals$AL\n```\n\n# 从 softmax\
  \ 概率中选取概率最高的一个\n\n```r\nq = apply(AL, 1, which.max)\nq1 <- t(data.frame(q))\nq2\
  \ <- as.numeric(q1)\ngrid2 <- cbind(grid, q2)\ncolnames(grid2) <- c('x1', 'x2',\
  \ 'q2')\nZ1 <- data.frame(Z)\nnames(Z1) <- c(\"x1\", \"x2\", \"y\")\natitle = paste(\"\
  Decision boundary\")\nggplot(Z1) +\n  geom_point(data = Z1, aes(x = x1, y = x2,\
  \ color = y)) +\n  stat_contour(data = grid2, aes(x = x1, y = x2, z = q2, color\
  \ = q2), alpha = 0.9) +\n  ggtitle(atitle) + scale_colour_gradientn(colours = brewer.pal(10,\
  \ \"Spectral\"))\n```\n\n### 6.3 Octave\n\n```octave\n############################################################################################################\n\
  #\n# File : DLfunctions61.m\n# Author : Tinniam V Ganesh\n# Date : 16 Apr 2018\n\
  #\n##########################################################################################################\n\
  \n1;\n\n# 定义 sigmoid 函数\nfunction [A, cache] = sigmoid(Z)\n  A = 1 ./ (1 + exp(-Z));\n\
  \  cache = Z;\nend\n\n# 定义 Relu 函数\nfunction [A, cache] = relu(Z)\n  A = max(0,\
  \ Z);\n  cache = Z;\nend\n\n# 定义 Relu 函数\nfunction [A, cache] = tanhAct(Z)\n  A\
  \ = tanh(Z);\n  cache = Z;\nend\n\n# 定义 Softmax 函数\nfunction [A, cache] = softmax(Z)\n\
  \  # 获取未归一化的概率\n  exp_scores = exp(Z');\n  # 对每个样本进行归一化\n  A = exp_scores ./ sum(exp_scores,\
  \ 2);\n  cache = Z;\nend\n\n# 定义稳定 Softmax 函数\nfunction [A, cache] = stableSoftmax(Z)\n\
  \  # 按每行的最大值进行归一化\n  shiftZ = Z' - max(Z', [], 2);\n  exp_scores = exp(shiftZ);\n\
  \  # 对每个样本进行归一化\n  A = exp_scores ./ sum(exp_scores, 2);\n  #disp(\"sm\")\n  #disp(A);\n\
  \  cache = Z;\nend\n\n# 定义 Relu 导数\nfunction [dZ] = reluDerivative(dA, cache)\n\
  \  Z = cache;\n  dZ = dA;\n  # 获取大于 0 的元素\n  a = (Z > 0);\n  # 仅选择 Z > 0 的那些元素\n\
  \  dZ = dZ .* a;\nend\n\n# 定义 Sigmoid 导数\nfunction [dZ] = sigmoidDerivative(dA,\
  \ cache)\n  Z = cache;\n  s = 1 ./ (1 + exp(-Z));\n  dZ = dA .* s .* (1 - s);\n\
  end\n\n# 定义 Tanh 导数\nfunction [dZ] = tanhDerivative(dA, cache)\n  Z = cache;\n \
  \ a = tanh(Z);\n  dZ = dA .* (1 - a .^ 2);\nend\n\n# 用 1 填充 Y=1 所在行的矩阵\n# 如果 K 不是\
  \ 3 或 10，可能需要修改此函数\n# 此函数用于计算 softmax 导数\nfunction [Y1] = popMatrix(Y, numClasses)\n\
  \  Y1 = zeros(length(Y), numClasses);\n  if (numClasses == 3) # 针对 3 个输出类别\n   \
  \ Y1(Y == 0, 1) = 1;\n    Y1(Y == 1, 2) = 1;\n    Y1(Y == 2, 3) = 1;\n  elseif (numClasses\
  \ == 10) # 针对 10 个输出类别\n    Y1(Y == 0, 1) = 1;\n    Y1(Y == 1, 2) = 1;\n    Y1(Y\
  \ == 2, 3) = 1;\n    Y1(Y == 3, 4) = 1;\n    Y1(Y == 4, 5) = 1;\n    Y1(Y == 5,\
  \ 6) = 1;\n    Y1(Y == 6, 7) = 1;\n    Y1(Y == 7, 8) = 1;\n    Y1(Y == 8, 9) = 1;\n\
  \    Y1(Y == 9, 10) = 1;\n  endif\nend\n\n# 定义 Softmax 导数\nfunction [dZ] = softmaxDerivative(dA,\
  \ cache, Y, numClasses)\n  Z = cache;\n  # 获取未归一化的概率\n  shiftZ = Z' - max(Z', [],\
  \ 2);\n  exp_scores = exp(shiftZ);\n  # 对每个样本进行归一化\n  probs = exp_scores ./ sum(exp_scores,\
  \ 2);\n  # dZ = pi - yi\n  yi = popMatrix(Y, numClasses);\n  dZ = probs - yi;\n\
  end\n\n# 定义稳定 Softmax 导数\nfunction [dZ] = stableSoftmaxDerivative(dA, cache, Y,\
  \ numClasses)\n  Z = cache;\n  # 获取未归一化的概率\n  exp_scores = exp(Z');\n  # 对每个样本进行归一化\n\
  \  probs = exp_scores ./ sum(exp_scores, 2);\n  # dZ = pi - yi\n  yi = popMatrix(Y,\
  \ numClasses);\n  dZ = probs - yi;\nend\n\n# 为 L 层初始化模型\n# 输入：每层单元数的列表\n# 返回：所有层的初始权重和偏置矩阵\n\
  function [W, b] = initializeDeepModel(layerDimensions)\n  rand(\"seed\", 3);\n \
  \ # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n  # 偏置是大小为 (l,1) 的向量\n  # 遍历层维度 1..L\n  # 为权重和偏置创建元胞数组\n\
  \  for l = 2:size(layerDimensions)(2)\n    W{l-1} = rand(layerDimensions(l), layerDimensions(l-1))\
  \ * 0.01; # 乘以 .01\n    b{l-1} = zeros(layerDimensions(l), 1);\n  endfor\nend\n\n\
  # L 层的 He 初始化\n# 输入：每层单元数的向量\n# 返回：所有层的初始权重和偏置矩阵\nfunction [W, b] = HeInitializeDeepModel(layerDimensions)\n\
  \  rand(\"seed\", 3);\n  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n  # 偏置是大小为 (l,1) 的向量\n  #\
  \ 遍历层维度 1..L\n  # 为权重和偏置创建元胞数组\n  for l = 2:size(layerDimensions)(2)\n    W{l-1}\
  \ = rand(layerDimensions(l), layerDimensions(l-1)) * sqrt(2 / layerDimensions(l-1));\
  \ # 乘以 .01\n    b{l-1} = zeros(layerDimensions(l), 1);\n  endfor\nend\n\n# L 层的\
  \ Xavier 初始化\n# 输入：每层单元数的向量\n# 返回：所有层的初始权重和偏置矩阵\nfunction [W, b] = XavInitializeDeepModel(layerDimensions)\n\
  \  rand(\"seed\", 3);\n  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n  # 偏置是大小为 (l,1) 的向量\n  #\
  \ 遍历层维度 1..L\n  # 为权重和偏置创建元胞数组\n  for l = 2:size(layerDimensions)(2)\n    W{l-1}\
  \ = rand(layerDimensions(l), layerDimensions(l-1)) * sqrt(1 / layerDimensions(l-1));\
  \ # 乘以 .01\n    b{l-1} = zeros(layerDimensions(l), 1);\n  endfor\nend\n\n# 计算深度网络中第\
  \ 'l' 层的前向传播激活值\n# 输入：A_prev - 上一层的激活值\n# W,b - 权重和偏置矩阵及向量\n# activationFunc - 激活函数\
  \ - sigmoid, tanh, relu 等\n# 返回：该层的激活值\n# :\n# Z = W * X + b\n# A = sigmoid(Z),\
  \ A= Relu(Z), A= tanh(Z)\nfunction [A, forward_cache, activation_cache] = layerActivationForward(A_prev,\
  \ W, b, activationFunc)\n  # 计算 Z\n  Z = W * A_prev + b;\n  # 创建一个元胞数组\n  forward_cache\
  \ = {A_prev, W, b};\n  # 计算 sigmoid 的激活值\n  if (strcmp(activationFunc, \"sigmoid\"\
  ))\n    [A, activation_cache] = sigmoid(Z);\n  elseif (strcmp(activationFunc, \"\
  relu\")) # 计算 Relu 的激活值\n    [A, activation_cache] = relu(Z);\n  elseif (strcmp(activationFunc,\
  \ 'tanh')) # 计算 tanh 的激活值\n    [A, activation_cache] = tanhAct(Z);\n  elseif (strcmp(activationFunc,\
  \ 'softmax')) # 计算 tanh 的激活值\n    #[A, activation_cache] = softmax(Z);\n    [A,\
  \ activation_cache] = stableSoftmax(Z);\n  endif\nend\n\n# 计算第 1..L 层的前向传播\n# 输入：X\
  \ - 输入特征\n# paramaters: 权重和偏置\n# keep_prob\n# hiddenActivationFunc - 隐藏层激活函数 Relu/tanh/sigmoid\n\
  # outputActivationFunc- sigmoid/softmax\n# 返回：AL\n# caches\n# 前向传播在第 1..L-1 层使用\
  \ Relu/tanh 激活函数，在第 L 层使用 sigmoid 激活函数\nfunction [AL, forward_caches, activation_caches,\
  \ dropoutMat] = forwardPropagationDeep(X, weights, biases, keep_prob = 1, hiddenActivationFunc\
  \ = 'relu', outputActivationFunc = 'sigmoid')\n  # 创建一个空元胞数组\n  forward_caches =\
  \ {};\n  activation_caches = {};\n  dropoutMat = {};\n  # 将 A 设为 X (A0)\n  A = X;\n\
  \  L = length(weights); # 神经网络中的层数\n  # 从第 1 层循环到第 L-1 层\n  for l = 1:L-1\n    A_prev\
  \ = A;\n    # Zi = Wi x Ai-1 + bi 和 Ai = g(Zi)\n    W = weights{l};\n    b = biases{l};\n\
  \    [A, forward_cache, activation_cache] = layerActivationForward(A_prev, W, b,\
  \ activationFunc = hiddenActivationFunc);\n    D = rand(size(A)(1), size(A)(2));\n\
  \    D = (D < keep_prob);\n    # 乘以 DropoutMat\n    A = A .* D;\n    # 除以 keep_prob\
  \ 以保持期望值不变\n    A = A ./ keep_prob;\n    # 存储 D\n    dropoutMat{l} = D;\n    forward_caches{l}\
  \ = forward_cache;\n    activation_caches{l} = activation_cache;\n  endfor\n  #\
  \ 由于这是二分类，在最后一层使用 sigmoid 激活函数\n  W = weights{L};\n  b = biases{L};\n```\n\n\n\n\
  \n\n# 神经网络反向传播实现\n\n## 前向传播缓存存储\n\n```matlab\n[AL, forward_cache, activation_cache]\
  \ = layerActivationForward(A, W, b, activationFunc = outputActivationFunc);\n\n\
  forward_caches{L} = forward_cache;\nactivation_caches{L} = activation_cache;\n```\n\
  \n## 列选择函数 `pickColumns`\n\n此函数用于 `computeCost` 中。\n\n```matlab\nfunction [a] =\
  \ pickColumns(AL, Y, numClasses)\n    if (numClasses == 3)\n        a = [AL(Y==0,1)\
  \ ; AL(Y==1,2) ; AL(Y==2,3)];\n    elseif (numClasses == 10)\n        a = [AL(Y==0,1)\
  \ ; AL(Y==1,2) ; AL(Y==2,3) ; AL(Y==3,4) ; AL(Y==4,5) ;\n             AL(Y==5,6)\
  \ ; AL(Y==6,7) ; AL(Y==7,8) ; AL(Y==8,9) ; AL(Y==9,10)];\n    endif\nend\n```\n\n\
  ## 成本计算函数 `computeCost`\n\n**输入**：\n- `AL`：最后一层的激活值\n- `Y`：数据输出\n- `outputActivationFunc`：sigmoid/softmax\n\
  - `numClasses`：类别数\n\n**输出**：`cost`\n\n```matlab\nfunction [cost] = computeCost(AL,\
  \ Y, outputActivationFunc=\"sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        numTraining = size(Y)(2);\n        # Element wise multiply\
  \ for logprobs\n        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n\
  \    elseif (strcmp(outputActivationFunc, 'softmax'))\n        numTraining = size(Y)(2);\n\
  \        Y = Y';\n        # Select rows where Y=0,1,and 2 and concatenate to a long\
  \ vector\n        a = pickColumns(AL, Y, numClasses);\n        # Select the correct\
  \ column for log prob\n        correct_probs = -log(a);\n        # Compute log loss\n\
  \        cost = sum(correct_probs) / numTraining;\n    endif\nend\n```\n\n## 带正则化的成本计算\
  \ `computeCostWithReg`\n\n**输入**：\n- `weights`：权重\n- `AL`：最后一层的激活值\n- `Y`：数据输出\n\
  - `lambd`：正则化参数\n- `outputActivationFunc`：sigmoid/softmax\n- `numClasses`：类别数\n\n\
  **输出**：`cost`\n\n```matlab\nfunction [cost] = computeCostWithReg(weights, AL, Y,\
  \ lambd, outputActivationFunc=\"sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        numTraining = size(Y)(2);\n        # Element wise multiply\
  \ for logprobs\n        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n\
  \        \n        # Regularization cost\n        L = size(weights)(2);\n      \
  \  L2RegularizationCost = 0;\n        for l = 1:L\n            wtSqr = weights{l}\
  \ .* weights{l};\n            # disp(sum(sum(wtSqr,1)));\n            L2RegularizationCost\
  \ += sum(sum(wtSqr,1));\n        endfor\n        L2RegularizationCost = (lambd /\
  \ (2 * numTraining)) * L2RegularizationCost;\n        cost = cost + L2RegularizationCost;\n\
  \        \n    elseif (strcmp(outputActivationFunc, 'softmax'))\n        numTraining\
  \ = size(Y)(2);\n        Y = Y';\n        # Select rows where Y=0,1,and 2 and concatenate\
  \ to a long vector\n        a = pickColumns(AL, Y, numClasses);\n        # Select\
  \ the correct column for log prob\n        correct_probs = -log(a);\n        # Compute\
  \ log loss\n        cost = sum(correct_probs) / numTraining;\n        \n       \
  \ # Regularization cost\n        L = size(weights)(2);\n        L2RegularizationCost\
  \ = 0;\n        for l = 1:L\n            # Compute L2 Norm\n            wtSqr =\
  \ weights{l} .* weights{l};\n            # disp(sum(sum(wtSqr,1)));\n          \
  \  L2RegularizationCost += sum(sum(wtSqr,1));\n        endfor\n        L2RegularizationCost\
  \ = (lambd / (2 * numTraining)) * L2RegularizationCost;\n        cost = cost + L2RegularizationCost;\n\
  \    endif\nend\n```\n\n## 单层反向传播 `layerActivationBackward`\n\n**输入**：\n- `dA`：神经网络参数梯度\n\
  - `forward_cache` & `activation_cache`：缓存\n- `Y`：输出值\n- `activationFunc`：sigmoid/softmax\n\
  - `numClasses`：类别数\n\n**返回**：梯度 `dA_prev`, `dW`, `db`\n\n```matlab\nfunction [dA_prev,\
  \ dW, db] = layerActivationBackward(dA, forward_cache, activation_cache, Y, activationFunc,\
  \ numClasses)\n    A_prev = forward_cache{1};\n    W = forward_cache{2};\n    b\
  \ = forward_cache{3};\n    numTraining = size(A_prev)(2);\n    \n    if (strcmp(activationFunc,\
  \ \"relu\"))\n        dZ = reluDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc,\
  \ \"sigmoid\"))\n        dZ = sigmoidDerivative(dA, activation_cache);\n    elseif\
  \ (strcmp(activationFunc, \"tanh\"))\n        dZ = tanhDerivative(dA, activation_cache);\n\
  \    elseif (strcmp(activationFunc, \"softmax\"))\n        # dZ = softmaxDerivative(dA,\
  \ activation_cache, Y, numClasses);\n        dZ = stableSoftmaxDerivative(dA, activation_cache,\
  \ Y, numClasses);\n    endif\n    \n    if (strcmp(activationFunc, \"softmax\"))\n\
  \        W = forward_cache{2};\n        b = forward_cache{3};\n        # Add the\
  \ regularization factor\n        dW = 1/numTraining * A_prev * dZ;\n        db =\
  \ 1/numTraining * sum(dZ, 1);\n        dA_prev = dZ * W;\n    else\n        W =\
  \ forward_cache{2};\n        b = forward_cache{3};\n        # Add the regularization\
  \ factor\n        dW = 1/numTraining * dZ * A_prev';\n        db = 1/numTraining\
  \ * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\nend\n```\n\n## 带正则化的单层反向传播\
  \ `layerActivationBackwardWithReg`\n\n**输入**：\n- `dA`：神经网络参数梯度\n- `forward_cache`\
  \ & `activation_cache`：缓存\n- `Y`：输出值\n- `lambd`：正则化参数\n- `activationFunc`：激活函数\n\
  - `numClasses`：类别数\n\n**返回**：梯度 `dA_prev`, `dW`, `db`\n\n```matlab\nfunction [dA_prev,\
  \ dW, db] = layerActivationBackwardWithReg(dA, forward_cache, activation_cache,\
  \ Y, lambd=0, activationFunc, numClasses)\n    A_prev = forward_cache{1};\n    W\
  \ = forward_cache{2};\n    b = forward_cache{3};\n    numTraining = size(A_prev)(2);\n\
  \    \n    if (strcmp(activationFunc, \"relu\"))\n        dZ = reluDerivative(dA,\
  \ activation_cache);\n    elseif (strcmp(activationFunc, \"sigmoid\"))\n       \
  \ dZ = sigmoidDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc,\
  \ \"tanh\"))\n        dZ = tanhDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc,\
  \ \"softmax\"))\n        # dZ = softmaxDerivative(dA, activation_cache, Y, numClasses);\n\
  \        dZ = stableSoftmaxDerivative(dA, activation_cache, Y, numClasses);\n  \
  \  endif\n    \n    if (strcmp(activationFunc, \"softmax\"))\n        W = forward_cache{2};\n\
  \        b = forward_cache{3};\n        # Add the regularization factor\n      \
  \  dW = 1/numTraining * A_prev * dZ + (lambd/numTraining) * W';\n        db = 1/numTraining\
  \ * sum(dZ, 1);\n        dA_prev = dZ * W;\n    else\n        W = forward_cache{2};\n\
  \        b = forward_cache{3};\n        # Add the regularization factor\n      \
  \  dW = 1/numTraining * dZ * A_prev' + (lambd/numTraining) * W;\n        db = 1/numTraining\
  \ * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\nend\n```\n\n## 深层网络反向传播\
  \ `backwardPropagationDeep`\n\n**输入**：\n- `AL`：L 层网络的输出\n- `Y`：真实输出\n- `activation_caches`：激活缓存列表\n\
  - `forward_caches`：前向缓存列表\n- `dropoutMat`：Dropout 矩阵\n- `lambd`：正则化参数\n- `keep_prob`：保留概率\n\
  - `hiddenActivationFunc`：隐藏层激活函数\n- `outputActivationFunc`：输出层激活函数\n- `numClasses`：类别数\n\
  \n**返回**：\n- `gradsDA`, `gradsDW`, `gradsDB`：梯度字典\n\n```matlab\nfunction [gradsDA,\
  \ gradsDW, gradsDB] = backwardPropagationDeep(AL, Y, activation_caches, forward_caches,\
  \ dropoutMat, lambd=0, keep_prob=1, hiddenActivationFunc='relu', outputActivationFunc=\"\
  sigmoid\", numClasses)\n    # Set the number of layers\n    L = length(activation_caches);\n\
  \    m = size(AL)(2);\n    \n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n\
  \        # Initializing the backpropagation\n        # dl/dAL = -(y/a + (1-y)/(1-a))\
  \ - At the output layer\n        dAL = -((Y ./ AL) - (1 - Y) ./ (1 - AL));\n   \
  \ elseif (strcmp(outputActivationFunc, \"softmax\"))\n        dAL = 0;\n       \
  \ Y = Y';\n    endif\n    \n    # Since this is a binary classification the activation\
  \ at output is sigmoid\n    # Get the gradients at the last layer\n    # Inputs:\
  \ \"AL, Y, caches\".\n    # Outputs: \"gradients[\"dAL\"], gradients[\"dWL\"], gradients[\"\
  dbL\"]\"\n    activation_cache = activation_caches{L};\n    forward_cache = forward_caches(L);\n\
  \    \n    # Note the cell array includes an array of forward caches. To get to\
  \ this we need to include the index {1}\n    if (lambd == 0)\n        [dA, dW, db]\
  \ = layerActivationBackward(dAL, forward_cache{1}, activation_cache, Y, activationFunc\
  \ = outputActivationFunc, numClasses);\n    else\n        [dA, dW, db] = layerActivationBackwardWithReg(dAL,\
  \ forward_cache{1}, activation_cache, Y, lambd, activationFunc = outputActivationFunc,\
  \ numClasses);\n    endif\n    \n    if (strcmp(outputActivationFunc, \"sigmoid\"\
  ))\n        gradsDA{L} = dA;\n    elseif (strcmp(outputActivationFunc, \"softmax\"\
  ))\n        gradsDA{L} = dA'; # Note the transpose\n    endif\n    \n    gradsDW{L}\
  \ = dW;\n    gradsDB{L} = db;\n    \n    # Traverse in the reverse direction\n \
  \   for l = (L-1):-1:1\n        # Compute the gradients for L-1 to 1 for Relu/tanh\n\
  \        # Inputs: \"gradients[\"dA\" + str(l + 2)], caches\".\n```\n\n\n\n\n\n\
  # 输出梯度\n\n输出：`gradients[\"dA\" + str(l + 1)]`，`gradients[\"dW\" + str(l + 1)]`，`gradients[\"\
  db\" + str(l + 1)]`\n\n```matlab\nactivation_cache = activation_caches{l};\nforward_cache\
  \ = forward_caches(l);\n\n# dA_prev_temp, dW_temp, db_temp =\nlayerActivationBackward(gradients['dA'+str(l+1)],\
  \ current_cache, activationFunc = \"relu\")\n\n# dAl 第 l 层激活值的导数，是第一个元素 dAl= gradsDA{l+1};\n\
  \nif (lambd == 0)\n    # 获取 dropout 矩阵\n    D = dropoutMat{l};\n    # 乘以 dropout\
  \ 矩阵\n    dAl = dAl .* D;\n    # 除以 keep_prob 以保持期望值不变\n    dAl = dAl ./ keep_prob;\n\
  \    [dA_prev_temp, dW_temp, db_temp] = layerActivationBackward(dAl, forward_cache{1},\
  \ activation_cache, Y, activationFunc = hiddenActivationFunc, numClasses);\nelse\n\
  \    [dA_prev_temp, dW_temp, db_temp] = layerActivationBackwardWithReg(dAl, forward_cache{1},\
  \ activation_cache, Y, lambd, activationFunc = hiddenActivationFunc, numClasses);\n\
  endif\n\ngradsDA{l} = dA_prev_temp;\ngradsDW{l} = dW_temp;\ngradsDB{l} = db_temp;\n\
  endfor\nend\n```\n\n# 执行梯度下降\n\n**输入**：\n- `weights` 和 `biases`\n- `gradients` -\
  \ `gradsW`, `gradsB`\n- `learning rate`\n- `outputActivationFunc`\n\n**输出**：1 次迭代后更新的权重\n\
  \n```matlab\nfunction [weights biases] = gradientDescent(weights, biases, gradsW,\
  \ gradsB, learningRate, outputActivationFunc=\"sigmoid\")\n    L = size(weights)(2);\
  \ # 神经网络中的层数\n    # 每个参数的更新规则。\n    for l = 1:(L-1)\n        weights{l} = weights{l}\
  \ - learningRate * gradsW{l};\n        biases{l} = biases{l} - learningRate * gradsB{l};\n\
  \    endfor\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n        weights{L}\
  \ = weights{L} - learningRate * gradsW{L};\n        biases{L} = biases{L} - learningRate\
  \ * gradsB{L};\n    elseif (strcmp(outputActivationFunc, \"softmax\"))\n       \
  \ weights{L} = weights{L} - learningRate * gradsW{L}';\n        biases{L} = biases{L}\
  \ - learningRate * gradsB{L}';\n    endif\nend\n```\n\n# 执行 L 层深度学习模型\n\n**输入**：\n\
  - `X` - 输入特征\n- `Y` - 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` -\
  \ 隐藏层激活函数 relu / tanh\n- `outputActivationFunc` - 输出层激活函数 sigmoid / softmax\n- `learning\
  \ rate`\n- `lambd`\n- `keep_prob`\n- `num of iterations`\n\n**输出**：每次迭代后更新的权重和偏置\n\
  \n```matlab\nfunction [weights biases costs] = L_Layer_DeepModel(X, Y, layersDimensions,\
  \ hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\", learning_rate =\
  \ .3, lambd=0, keep_prob=1, num_iterations = 10000, initType=\"default\") # lr was\
  \ 0.009\n    rand (\"seed\", 1);\n    costs = [];\n    if (strcmp(initType, \"He\"\
  ))\n        # He 初始化\n        [weights biases] = HeInitializeDeepModel(layersDimensions);\n\
  \    elseif (strcmp(initType, \"Xav\"))\n        # Xavier 初始化\n        [weights\
  \ biases] = XavInitializeDeepModel(layersDimensions);\n    else\n        # 默认初始化。\n\
  \        [weights biases] = initializeDeepModel(layersDimensions);\n    endif\n\n\
  \    # 循环（梯度下降）\n    for i = 0:num_iterations\n        # 前向传播：[LINEAR -> RELU]*(L-1)\
  \ -> LINEAR -> SIGMOID。\n        [AL forward_caches activation_caches droputMat]\
  \ = forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc);\n\n        # 正则化参数为 0\n        if\
  \ (lambd == 0)\n            # 计算成本。\n            cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n        else\n     \
  \       # 计算带正则化的成本\n            cost = computeCostWithReg(weights, AL, Y, lambd,\
  \ outputActivationFunc=outputActivationFunc, numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \        endif\n\n        # 反向传播。\n        [gradsDA gradsDW gradsDB] = backwardPropagationDeep(AL,\
  \ Y, activation_caches, forward_caches, droputMat, lambd, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc, numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \n        # 更新参数。\n        [weights biases] = gradientDescent(weights, biases, gradsDW,\
  \ gradsDB, learning_rate, outputActivationFunc=outputActivationFunc);\n\n      \
  \  # 每 1000 次迭代打印一次成本\n        if (mod(i, 1000) == 0)\n            costs = [costs\
  \ cost];\n            # disp (\"Cost after iteration\"), L2RegularizationCost(i),\
  \ disp(cost); printf(\"Cost after iteration i=%i cost=%d\\n\", i, cost);\n     \
  \   endif\n    endfor\nend\n```\n\n# 使用随机梯度下降执行 L 层深度学习模型\n\n**输入**：\n- `X` - 输入特征\n\
  - `Y` - 输出\n- `layersDimensions` - 层维度\n- `hiddenActivationFunc` - 隐藏层激活函数 relu\
  \ / tanh\n- `outputActivationFunc` - 输出层激活函数 sigmoid / softmax\n- `learning rate`\n\
  - `mini_batch_size`\n- `num of epochs`\n\n**输出**：每次迭代后更新的权重和偏置\n\n```matlab\nfunction\
  \ [weights biases costs] = L_Layer_DeepModel_SGD(X, Y, layersDimensions, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", learning_rate = .3, mini_batch_size = 64, num_epochs\
  \ = 2500) # lr was 0.009\n    rand (\"seed\", 1);\n    costs = [];\n    # 参数初始化。\n\
  \    [weights biases] = initializeDeepModel(layersDimensions);\n    seed = 10;\n\
  \n    # 循环（梯度下降）\n    for i = 0:num_epochs\n        seed = seed + 1;\n        [mini_batches_X\
  \ mini_batches_Y] = random_mini_batches(X, Y, mini_batch_size, seed);\n        minibatches\
  \ = length(mini_batches_X);\n        for batch = 1:minibatches\n            X =\
  \ mini_batches_X{batch};\n            Y = mini_batches_Y{batch};\n            #\
  \ 前向传播：[LINEAR -> RELU]*(L-1) -> LINEAR -> SIGMOID/SOFTMAX。\n            [AL forward_caches\
  \ activation_caches] = forwardPropagationDeep(X, weights, biases, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc);\n            # disp(batch);\n    \
  \        # disp(size(X));\n            # disp(size(Y));\n\n            # 计算成本。\n\
  \            cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n            # disp(cost);\n\
  \n            # 反向传播。\n            [gradsDA gradsDW gradsDB] = backwardPropagationDeep(AL,\
  \ Y, activation_caches, forward_caches, hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n\n            # 更新参数。\n\
  \            [weights biases] = gradientDescent(weights, biases, gradsDW, gradsDB,\
  \ learning_rate, outputActivationFunc=outputActivationFunc);\n        endfor\n\n\
  \        # 每 1000 次迭代打印一次成本\n        if (mod(i, 1000) == 0)\n            costs =\
  \ [costs cost];\n            # disp (\"Cost after iteration\"), disp(i), disp(cost);\
  \ printf(\"Cost after iteration i=%i cost=%d\\n\", i, cost);\n        endif\n  \
  \  endfor\nend\n```\n\n# 绘制成本与迭代次数关系图\n\n```matlab\nfunction plotCostVsIterations(maxIterations,\
