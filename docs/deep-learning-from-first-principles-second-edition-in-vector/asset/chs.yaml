  \ if (numClasses == 3) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y == 1, 2] = 1\n    Y1[Y\
  \ == 2, 3] = 1\n  } else if (numClasses == 10) {\n    Y1[Y == 0, 1] = 1\n    Y1[Y\
  \ == 1, 2] = 1\n    Y1[Y == 2, 3] = 1\n    Y1[Y == 3, 4] = 1\n    Y1[Y == 4, 5]\
  \ = 1\n    Y1[Y == 5, 6] = 1\n    Y1[Y == 6, 7] = 1\n    Y1[Y == 7, 8] = 1\n   \
  \ Y1[Y == 8, 9] = 1\n    Y1[Y == 9, 10] = 1  # 修正：原代码 Y1[Y==9,0] 索引为 0 不合法，推测应为\
  \ 10\n  }\n  return(Y1)\n}\n\n# 计算 Softmax 导数\nsoftmaxDerivative <- function(dA,\
  \ cache, y, numTraining, numClasses) {\n  # 注意：dA 未使用。dL/dZ = dL/dA * dA/dZ = pi-yi\n\
  \  Z <- cache\n  # 计算 Softmax\n  exp_scores = exp(t(Z))\n  # 对每个样本进行归一化\n  probs\
  \ = exp_scores / rowSums(exp_scores)\n  # 创建一个零矩阵\n  Y1 = popMatrix(y, numClasses)\n\
  \  # a=rep(0,times=length(Y))\n  # Y1=matrix(a,nrow=length(Y),ncol=numClasses)\n\
  \  # 将 Y 为类别值的行和列设为 1\n  dZ = probs - Y1\n  return(dZ)\n}\n\n# 初始化 L 层模型\n# 输入：每层单元数的向量\n\
  # 返回：所有层的初始权重和偏置矩阵\ninitializeDeepModel <- function(layerDimensions) {\n  set.seed(2)\n\
  \  # 初始化空列表\n  layerParams <- list()\n  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n  # 偏置是大小为\
  \ (l,1) 的向量\n  # 从 1 循环到 L\n  # R 语言索引从 1 开始\n  for (l in 2:length(layerDimensions))\
  \ {\n    # 初始化一个大小为 l x l-1 的小随机数矩阵\n    # 创建大小为 l x l-1 的随机数\n    w = rnorm(layerDimensions[l]\
  \ * layerDimensions[l-1]) * 0.01\n    # 用这些初始权重创建一个大小为 l x l-1 的权重矩阵\n    # 并添加到列表\
  \ W1,W2... WL 中\n    layerParams[[paste('W', l-1, sep=\"\")]] = matrix(w, nrow =\
  \ layerDimensions[l], ncol = layerDimensions[l-1])\n    layerParams[[paste('b',\
  \ l-1, sep=\"\")]] = matrix(rep(0, layerDimensions[l]), nrow = layerDimensions[l],\
  \ ncol = 1)\n  }\n  return(layerParams)\n}\n\n# L 层模型的 He 初始化\n# 输入：每层单元数的向量\n#\
  \ 返回：所有层的初始权重和偏置矩阵\n# He 初始化将随机数乘以 sqrt(2/layerDimensions[previouslayer])\nHeInitializeDeepModel\
  \ <- function(layerDimensions) {\n  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n\
  \  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n  # 偏置是大小为 (l,1) 的向量\n  # 从 1 循环到 L\n  # R 语言索引从\
  \ 1 开始\n  for (l in 2:length(layerDimensions)) {\n    # 初始化一个大小为 l x l-1 的小随机数矩阵\n\
  \    # 创建大小为 l x l-1 的随机数\n    w = rnorm(layerDimensions[l] * layerDimensions[l-1])\n\
  \    # 用这些初始权重创建一个大小为 l x l-1 的权重矩阵\n    # 并添加到列表 W1,W2... WL 中\n    # He 初始化 -\
  \ 除以 sqrt(2/layerDimensions[previous layer])\n    layerParams[[paste('W', l-1, sep=\"\
  \")]] = matrix(w, nrow = layerDimensions[l], ncol = layerDimensions[l-1]) * sqrt(2\
  \ / layerDimensions[l-1])\n    layerParams[[paste('b', l-1, sep=\"\")]] = matrix(rep(0,\
  \ layerDimensions[l]), nrow = layerDimensions[l], ncol = 1)\n  }\n  return(layerParams)\n\
  }\n\n# L 层模型的 Xavier 初始化\n# 输入：每层单元数的向量\n# 返回：所有层的初始权重和偏置矩阵\n# Xavier 初始化将随机数乘以\
  \ sqrt(1/layerDimensions[previouslayer])\nXavInitializeDeepModel <- function(layerDimensions)\
  \ {\n  set.seed(2)\n  # 初始化空列表\n  layerParams <- list()\n  # 注意第 'l' 层的权重矩阵大小为 (l,l-1)\n\
  \  # 偏置是大小为 (l,1) 的向量\n  # 从 1 循环到 L\n  # R 语言索引从 1 开始\n  for (l in 2:length(layerDimensions))\
  \ {\n    # 初始化一个大小为 l x l-1 的小随机数矩阵\n    # 创建大小为 l x l-1 的随机数\n    w = rnorm(layerDimensions[l]\
  \ * layerDimensions[l-1])\n    # 用这些初始权重创建一个大小为 l x l-1 的权重矩阵\n    # 并添加到列表 W1,W2...\
  \ WL 中\n    # Xavier 初始化 - 除以 sqrt(1/layerDimensions[previous layer])\n    layerParams[[paste('W',\
  \ l-1, sep=\"\")]] = matrix(w, nrow = layerDimensions[l], ncol = layerDimensions[l-1])\
  \ * sqrt(1 / layerDimensions[l-1])\n    layerParams[[paste('b', l-1, sep=\"\")]]\
  \ = matrix(rep(0, layerDimensions[l]), nrow = layerDimensions[l], ncol = 1)\n  }\n\
  \  return(layerParams)\n}\n```\n\n\n\n\n\n# R 语言神经网络实现代码\n\n## 初始化参数\n\n```r\nmatrix(w,\
  \ nrow = layersDimensions[l],\n       ncol = layersDimensions[l-1]) * sqrt(1 / layersDimensions[l-1])\n\
  \nlayerParams[[paste('b', l-1, sep = \"\")]] = matrix(rep(0, layersDimensions[l]),\n\
  \                                                 nrow = layersDimensions[l],\n\
  \                                                 ncol = 1)\n}\nreturn(layerParams)\n\
  }\n```\n\n## 初始化速度\n\n**输入**: `parameters`  \n**返回**: `v` - 初始速度\n\n```r\ninitializeVelocity\
  \ <- function(parameters) {\n  L <- length(parameters) / 2\n  v <- list()\n  \n\
  \  # Initialize velocity with the same dimensions as W\n  for (l in 1:L) {\n   \
  \ # Get the size of weight matrix\n    sz <- dim(parameters[[paste('W', l, sep =\
  \ \"\")]])\n    v[[paste('dW', l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n\
  \                                           nrow = sz[1], ncol = sz[2])\n    \n\
  \    # Get the size of bias matrix\n    sz <- dim(parameters[[paste('b', l, sep\
  \ = \"\")]])\n    v[[paste('db', l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n\
  \                                           nrow = sz[1], ncol = sz[2])\n  }\n \
  \ return(v)\n}\n```\n\n## 初始化 RMSProp\n\n**输入**: `parameters`  \n**返回**: `s` - 初始\
  \ RMSProp\n\n```r\ninitializeRMSProp <- function(parameters) {\n  L <- length(parameters)\
  \ / 2\n  s <- list()\n  \n  # Initialize velocity with the same dimensions as W\n\
  \  for (l in 1:L) {\n    # Get the size of weight matrix\n    sz <- dim(parameters[[paste('W',\
  \ l, sep = \"\")]])\n    s[[paste('dW', l, sep = \"\")]] = matrix(rep(0, sz[1] *\
  \ sz[2]),\n                                           nrow = sz[1], ncol = sz[2])\n\
  \    \n    # Get the size of bias matrix\n    sz <- dim(parameters[[paste('b', l,\
  \ sep = \"\")]])\n    s[[paste('db', l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n\
  \                                           nrow = sz[1], ncol = sz[2])\n  }\n \
  \ return(s)\n}\n```\n\n## 初始化 Adam\n\n**输入**: `parameters`  \n**返回**: `(v, s)` -\
  \ 初始 Adam 参数\n\n```r\ninitializeAdam <- function(parameters) {\n  L <- length(parameters)\
  \ / 2\n  v <- list()\n  s <- list()\n  \n  # Initialize velocity with the same dimensions\
  \ as W\n  for (l in 1:L) {\n    # Get the size of weight matrix\n    sz <- dim(parameters[[paste('W',\
  \ l, sep = \"\")]])\n    v[[paste('dW', l, sep = \"\")]] = matrix(rep(0, sz[1] *\
  \ sz[2]),\n                                           nrow = sz[1], ncol = sz[2])\n\
  \    s[[paste('dW', l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n         \
  \                                  nrow = sz[1], ncol = sz[2])\n    \n    # Get\
  \ the size of bias matrix\n    sz <- dim(parameters[[paste('b', l, sep = \"\")]])\n\
  \    v[[paste('db', l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n         \
  \                                  nrow = sz[1], ncol = sz[2])\n    s[[paste('db',\
  \ l, sep = \"\")]] = matrix(rep(0, sz[1] * sz[2]),\n                           \
  \                nrow = sz[1], ncol = sz[2])\n  }\n  retvals <- list(\"v\" = v,\
  \ \"s\" = s)\n  return(retvals)\n}\n```\n\n## 计算深度网络前向传播中第 `l` 层的激活值\n\n**输入**:\
  \  \n- `A_prev` - 上一层的激活值  \n- `W`, `b` - 权重和偏置矩阵及向量  \n- `activationFunc` - 激活函数：sigmoid、tanh、relu\
  \ 等  \n\n**返回**: 该层的激活值  \n\n**公式**:  \n- `Z = W %*% X + b`  \n- `A = sigmoid(Z)`,\
  \ `A = Relu(Z)`, `A = tanh(Z)`\n\n```r\nlayerActivationForward <- function(A_prev,\
  \ W, b, activationFunc) {\n  # Compute Z\n  z = W %*% A_prev\n  \n  # Broadcast\
  \ the bias 'b' by column\n  Z <- sweep(z, 1, b, '+')\n  \n  forward_cache <- list(\"\
  A_prev\" = A_prev, \"W\" = W, \"b\" = b)\n  \n  # Compute the activation for sigmoid\n\
  \  if (activationFunc == \"sigmoid\") {\n    vals = sigmoid(Z)\n  } else if (activationFunc\
  \ == \"relu\") { # Compute the activation for relu\n    vals = relu(Z)\n  } else\
  \ if (activationFunc == 'tanh') { # Compute the activation for tanh\n    vals =\
  \ tanhActivation(Z)\n  } else if (activationFunc == 'softmax') {\n    vals = softmax(Z)\n\
  \  }\n  \n  # Create a list of forward and activation cache\n  cache <- list(\"\
  forward_cache\" = forward_cache, \"activation_cache\" = vals[['Z']])\n  retvals\
  \ <- list(\"A\" = vals[['A']], \"cache\" = cache)\n  return(retvals)\n}\n```\n\n\
  ## 计算第 1..L 层的前向传播\n\n**输入**:  \n- `X` - 输入特征  \n- `parameters` - 权重和偏置  \n- `keep_prob`\
  \  \n- `hiddenActivationFunc` - relu/sigmoid/tanh  \n- `outputActivationFunc` -\
  \ 隐藏层的激活函数 sigmoid/softmax  \n\n**返回**:  \n- `AL`  \n- `caches`  \n- `dropoutMat`\
  \  \n\n前向传播在第 1..L-1 层使用 Relu/tanh 激活函数，第 L 层使用 sigmoid 激活函数。\n\n```r\nforwardPropagationDeep\
  \ <- function(X, parameters, keep_prob = 1,\n                                  \
  \ hiddenActivationFunc = 'relu',\n                                   outputActivationFunc\
  \ = 'sigmoid') {\n  caches <- list()\n  dropoutMat <- list()\n  \n  # Set A to X\
  \ (A0)\n  A <- X\n  L <- length(parameters) / 2 # number of layers in the neural\
  \ network\n  \n  # Loop through from layer 1 to upto layer L\n  for (l in 1:(L-1))\
  \ {\n    A_prev <- A\n    \n    # Zi = Wi x Ai-1 + bi and Ai = g(Zi)\n    # Set\
  \ W and b for layer 'l'\n    # Loop throug from W1,W2... WL-1\n    W <- parameters[[paste(\"\
  W\", l, sep = \"\")]]\n    b <- parameters[[paste(\"b\", l, sep = \"\")]]\n    \n\
  \    # Compute the forward propagation through layer 'l' using the activation function\n\
  \    actForward <- layerActivationForward(A_prev, W, b,\n                      \
  \                   activationFunc = hiddenActivationFunc)\n    A <- actForward[['A']]\n\
  \    \n    # Append the cache A_prev,W,b, Z\n    caches[[l]] <- actForward\n   \
  \ \n    # Randomly drop some activation units\n    # Create a matrix as the same\
  \ shape as A\n    set.seed(1)\n    i = dim(A)[1]\n    j = dim(A)[2]\n    a <- rnorm(i\
  \ * j)\n    \n    # Normalize a between 0 and 1\n    a = (a - min(a)) / (max(a)\
  \ - min(a))\n    \n    # Create a matrix of D\n    D <- matrix(a, nrow = i, ncol\
  \ = j)\n    \n    # Find D which is less than equal to keep_prob\n    D <- D < keep_prob\n\
  \    \n    # Remove some A's\n    A <- A * D\n    \n    # Divide by keep_prob to\
  \ keep expected value same\n    A <- A / keep_prob\n    \n    dropoutMat[[paste(\"\
  D\", l, sep = \"\")]] <- D\n  }\n  \n  # Since this is binary classification use\
  \ the sigmoid activation function in\n  # last layer\n  # Set the weights and biases\
  \ for the last layer\n  W <- parameters[[paste(\"W\", L, sep = \"\")]]\n  b <- parameters[[paste(\"\
  b\", L, sep = \"\")]]\n  \n  # Last layer\n  actForward = layerActivationForward(A,\
  \ W, b, activationFunc = outputActivationFunc)\n  AL <- actForward[['A']]\n  \n\
  \  # Append the output of this forward propagation through the last layer\n  caches[[L]]\
  \ <- actForward\n  \n  # Create a list of the final output and the caches\n  fwdPropDeep\
  \ <- list(\"AL\" = AL, \"caches\" = caches, \"dropoutMat\" = dropoutMat)\n  return(fwdPropDeep)\n\
  }\n```\n\n## 函数 `pickColumns()`：用于 `computeCost()`\n\n**功能**: 选取列  \n\n**输入**: \
  \ \n- `AL`  \n- `Y`  \n- `numClasses`  \n\n**输出**: `a`\n\n```r\npickColumns <- function(AL,\
  \ Y, numClasses) {\n  if (numClasses == 3) {\n    a = c(AL[Y == 0, 1], AL[Y == 1,\
  \ 2], AL[Y == 2, 3])\n  } else if (numClasses == 10) {\n    a = c(AL[Y == 0, 1],\
  \ AL[Y == 1, 2], AL[Y == 2, 3], AL[Y == 3, 4],\n          AL[Y == 4, 5], AL[Y ==\
  \ 5, 6], AL[Y == 6, 7], AL[Y == 7, 8],\n          AL[Y == 8, 9], AL[Y == 9, 10])\n\
  \  }\n  return(a)\n}\n```\n\n## 计算代价\n\n**输入**:  \n- 最后一层的激活值  \n- 数据输出  \n- `outputActivationFunc`\
  \ - 隐藏层激活函数 sigmoid/softmax  \n- `numClasses`  \n\n**输出**: `cost`\n\n```r\ncomputeCost\
  \ <- function(AL, Y, outputActivationFunc = \"sigmoid\", numClasses = 3) {\n  if\
  \ (outputActivationFunc == \"sigmoid\") {\n    m = length(Y)\n    cost = -1/m *\
  \ sum(Y * log(AL) + (1 - Y) * log(1 - AL))\n  } else if (outputActivationFunc ==\
  \ \"softmax\") {\n    # Select the elements where the y values are 0, 1 or 2 and\
  \ make a vector\n    # Pick columns\n    # a = c(AL[Y == 0, 1], AL[Y == 1, 2], AL[Y\
  \ == 2, 3])\n    m = length(Y)\n    a = pickColumns(AL, Y, numClasses)\n    # a\
  \ = c(A2[y = k, k + 1])\n    \n    # Take log\n    correct_probs = -log(a)\n   \
  \ \n    # Compute loss\n    cost = sum(correct_probs) / m\n  }\n  return(cost)\n\
  }\n```\n\n## 计算带正则化的代价\n\n**输入**:  \n- `parameters`  \n- `AL` - 最后一层的激活值  \n- `Y`\
  \ - 数据输出  \n- `lambd`  \n- `outputActivationFunc` - 隐藏层激活函数 sigmoid/softmax  \n\
  - `numClasses`  \n\n**输出**: `cost`\n\n```r\ncomputeCostWithReg <- function(parameters,\
  \ AL, Y, lambd,\n                               outputActivationFunc = \"sigmoid\"\
  , numClasses = 3) {\n  if (outputActivationFunc == \"sigmoid\") {\n    m = length(Y)\n\
  \    cost = -1/m * sum(Y * log(AL) + (1 - Y) * log(1 - AL))\n    \n    # Regularization\
  \ cost\n    L <- length(parameters) / 2\n    L2RegularizationCost = 0\n    for (l\
  \ in 1:L) {\n      L2RegularizationCost = L2RegularizationCost +\n        sum(parameters[[paste(\"\
  W\", l, sep = \"\")]]²)\n    }\n    L2RegularizationCost = (lambd / (2 * m)) * L2RegularizationCost\n\
  \    cost = cost + L2RegularizationCost\n  } else if (outputActivationFunc == \"\
  softmax\") {\n    # Select the elements where the y values are 0, 1 or 2 and make\
  \ a vector\n    # Pick columns\n    # a = c(AL[Y == 0, 1], AL[Y == 1, 2], AL[Y ==\
  \ 2, 3])\n    m = length(Y)\n    a = pickColumns(AL, Y, numClasses)\n    # a = c(A2[y\
  \ = k, k + 1])\n    \n    # Take log\n    correct_probs = -log(a)\n    \n    # Compute\
  \ loss\n    cost = sum(correct_probs) / m\n    \n    # Regularization cost\n   \
  \ L <- length(parameters) / 2\n  }\n}\n```\n\n\n\n\n\n# L2 正则化成本计算\n\n```r\nL2RegularizationCost\
  \ = 0\n\n# Add L2 norm\nfor (l in 1:L) {\n  L2RegularizationCost = L2RegularizationCost\
  \ +\n    sum(parameters[[paste(\"W\", l, sep = \"\")]]²)\n}\n\nL2RegularizationCost\
  \ = (lambd / (2 * m)) * L2RegularizationCost\ncost = cost + L2RegularizationCost\n\
  ```\n\n# 逐层反向传播计算\n\n## `layerActivationBackward` 函数\n\n**功能**：计算单层的反向传播。\n\n**输入**：\n\
  - `dA`：神经网络参数\n- `cache`：包含 `forward_cache` 和 `activation_cache`\n- `Y`：输出值\n- `activationFunc`：激活函数\n\
  - `numClasses`：类别数量\n\n**返回**：梯度（`dA_prev`、`dW`、`db`）\n\n**核心公式**：\n- `dL/dWi =\
  \ dL/dZi * Al-1`\n- `dl/dbl = dL/dZl`\n- `dL/dZ_prev = dL/dZl * W`\n\n```r\nlayerActivationBackward\
  \ <- function(dA, cache, Y, activationFunc, numClasses) {\n  # Get A_prev, W, b\n\
  \  forward_cache <- cache[['forward_cache']]\n  activation_cache <- cache[['activation_cache']]\n\
  \  A_prev <- forward_cache[['A_prev']]\n  numtraining = dim(A_prev)[2]\n\n  # Get\
  \ Z\n  activation_cache <- cache[['activation_cache']]\n\n  if (activationFunc ==\
  \ \"relu\") {\n    dZ <- reluDerivative(dA, activation_cache)\n  } else if (activationFunc\
  \ == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA, activation_cache)\n  } else\
  \ if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA, activation_cache)\n\
  \  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, Y, numtraining, numClasses)\n  }\n\n  if (activationFunc ==\
  \ 'softmax') {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n \
  \   dW = 1 / numtraining * A_prev %*% dZ\n    db = 1 / numtraining * matrix(colSums(dZ),\
  \ nrow = 1, ncol = numClasses)\n    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n\
  \    b <- forward_cache[['b']]\n    numtraining = dim(A_prev)[2]\n    dW = 1 / numtraining\
  \ * dZ %*% t(A_prev)\n    db = 1 / numtraining * rowSums(dZ)\n    dA_prev = t(W)\
  \ %*% dZ\n  }\n\n  retvals <- list(\"dA_prev\" = dA_prev, \"dW\" = dW, \"db\" =\
  \ db)\n  return(retvals)\n}\n```\n\n## `layerActivationBackwardWithReg` 函数\n\n**功能**：带正则化的逐层反向传播计算。\n\
  \n**输入**：在 `layerActivationBackward` 基础上增加 `lambd` 参数。\n\n**返回**：梯度（`dA_prev`、`dW`、`db`）\n\
  \n```r\nlayerActivationBackwardWithReg <- function(dA, cache, Y, lambd, activationFunc,\
  \ numClasses) {\n  # Get A_prev, W, b\n  forward_cache <- cache[['forward_cache']]\n\
  \  activation_cache <- cache[['activation_cache']]\n  A_prev <- forward_cache[['A_prev']]\n\
  \  numtraining = dim(A_prev)[2]\n\n  # Get Z\n  activation_cache <- cache[['activation_cache']]\n\
  \n  if (activationFunc == \"relu\") {\n    dZ <- reluDerivative(dA, activation_cache)\n\
  \  } else if (activationFunc == \"sigmoid\") {\n    dZ <- sigmoidDerivative(dA,\
  \ activation_cache)\n  } else if (activationFunc == \"tanh\") {\n    dZ <- tanhDerivative(dA,\
  \ activation_cache)\n  } else if (activationFunc == \"softmax\") {\n    dZ <- softmaxDerivative(dA,\
  \ activation_cache, Y, numtraining, numClasses)\n  }\n\n  if (activationFunc ==\
  \ 'softmax') {\n    W <- forward_cache[['W']]\n    b <- forward_cache[['b']]\n\n\
  \    # Add the regularization factor\n    dW = 1 / numtraining * A_prev %*% dZ +\
  \ (lambd / numtraining) * t(W)\n    db = 1 / numtraining * matrix(colSums(dZ), nrow\
  \ = 1, ncol = numClasses)\n    dA_prev = dZ %*% W\n  } else {\n    W <- forward_cache[['W']]\n\
  \    b <- forward_cache[['b']]\n    numtraining = dim(A_prev)[2]\n\n    # Add the\
  \ regularization factor\n    dW = 1 / numtraining * dZ %*% t(A_prev) + (lambd /\
  \ numtraining) * W\n    db = 1 / numtraining * rowSums(dZ)\n    dA_prev = t(W) %*%\
  \ dZ\n  }\n\n  retvals <- list(\"dA_prev\" = dA_prev, \"dW\" = dW, \"db\" = db)\n\
  \  return(retvals)\n}\n```\n\n# 深度网络完整反向传播\n\n## `backwardPropagationDeep` 函数\n\n\
  **功能**：计算所有层的反向传播（1 个周期）。\n\n**输入**：\n- `AL`：L 层网络的输出\n- `Y`：真实标签\n- `caches`：缓存列表，包含：\n\
  \  - 第 1 到 L-1 层：`layerActivationForward()` 的缓存（\"relu\"/\"tanh\"）\n  - 第 L 层：`layerActivationForward()`\
  \ 的缓存（\"sigmoid\"/\"softmax\"）\n- `dropoutMat`：Dropout 矩阵\n- `lambd`：正则化参数\n- `keep_prob`：保留概率\n\
  - `hiddenActivationFunc`：隐藏层激活函数\n- `outputActivationFunc`：输出层激活函数\n- `numClasses`：类别数量\n\
  \n**返回**：`gradients` 字典，包含 `dA[l]`、`dW[l]`、`db[l]`\n\n```r\nbackwardPropagationDeep\
  \ <- function(AL, Y, caches, dropoutMat, lambd = 0, keep_prob = 0,\n           \
  \                         hiddenActivationFunc = 'relu', outputActivationFunc =\
  \ \"sigmoid\", numClasses) {\n  # Initialize the gradients\n  gradients = list()\n\
  \n  # Set the number of layers\n  L = length(caches)\n  numTraining = dim(AL)[2]\n\
  \n  if (outputActivationFunc == \"sigmoid\") {\n    # Initializing the backpropagation\n\
  \    # dl/dAL = -(y/a) - ((1-y)/(1-a)) - At the output layer\n    dAL = -((Y / AL)\
  \ - (1 - Y) / (1 - AL))\n  } else if (outputActivationFunc == \"softmax\") {\n \
  \   dAL = 0\n    Y = t(Y)\n  }\n\n  # Get the gradients at the last layer\n  # Inputs:\
  \ \"AL, Y, caches\"\n  # Outputs: \"gradients[\"dAL\"], gradients[\"dWL\"], gradients[\"\
  dbL\"]\"\n  # Start with Layer L\n  # Get the current cache\n  current_cache = caches[[L]]$cache\n\
  \n  if (lambd == 0) {\n    retvals <- layerActivationBackward(dAL, current_cache,\
  \ Y,\n                                       activationFunc = outputActivationFunc,\
  \ numClasses)\n  } else {\n    retvals = layerActivationBackwardWithReg(dAL, current_cache,\
  \ Y, lambd,\n                                             activationFunc = outputActivationFunc,\
  \ numClasses)\n  }\n\n  # Note: Take the transpose of dA\n  if (outputActivationFunc\
  \ == \"sigmoid\") {\n    gradients[[paste(\"dA\", L, sep = \"\")]] <- retvals[['dA_prev']]\n\
  \  } else if (outputActivationFunc == \"softmax\") {\n    gradients[[paste(\"dA\"\
  , L, sep = \"\")]] <- t(retvals[['dA_prev']])\n  }\n  gradients[[paste(\"dW\", L,\
  \ sep = \"\")]] <- retvals[['dW']]\n  gradients[[paste(\"db\", L, sep = \"\")]]\
  \ <- retvals[['db']]\n\n  # Traverse in the reverse direction\n  for (l in (L -\
  \ 1):1) {\n    # Compute the gradients for L-1 to 1 for Relu/tanh\n    # Inputs:\
  \ \"gradients[\"dA\" + str(l + 2)], caches\"\n    # Outputs: \"gradients[\"dA\"\
  \ + str(l + 1)], gradients[\"dW\" + str(l + 1)], gradients[\"db\" + str(l + 1)]\"\
  \n    current_cache = caches[[l]]$cache\n\n    if (lambd == 0) {\n      # Get the\
  \ dropout matrix\n      D <- dropoutMat[[paste(\"D\", l, sep = \"\")]]\n\n     \
  \ # Multiply gradient with dropout matrix\n      gradients[[paste('dA', l + 1, sep\
  \ = \"\")]] = gradients[[paste('dA', l + 1, sep = \"\")]] * D\n\n      # Divide\
  \ by keep_prob to keep expected value same\n      gradients[[paste('dA', l + 1,\
  \ sep = \"\")]] =\n        gradients[[paste('dA', l + 1, sep = \"\")]] / keep_prob\n\
  \n      retvals = layerActivationBackward(gradients[[paste('dA', l + 1, sep = \"\
  \")]],\n                                        current_cache, Y,\n            \
  \                            activationFunc = hiddenActivationFunc)\n    } else\
  \ {\n      retvals =\n        layerActivationBackwardWithReg(gradients[[paste('dA',\
  \ l + 1, sep = \"\")]],\n                                       current_cache, Y,\
  \ lambd,\n                                       activationFunc = hiddenActivationFunc)\n\
  \    }\n\n    gradients[[paste(\"dA\", l, sep = \"\")]] <- retvals[['dA_prev']]\n\
  \    gradients[[paste(\"dW\", l, sep = \"\")]] <- retvals[['dW']]\n    gradients[[paste(\"\
  db\", l, sep = \"\")]] <- retvals[['db']]\n  }\n\n  return(gradients)\n}\n```\n\n\
  # 梯度下降参数更新\n\n## `gradientDescent` 函数\n\n**功能**：执行梯度下降更新参数。\n\n**输入**：\n- `parameters`：权重和偏置\n\
  - `gradients`：梯度\n- `learningRate`：学习率\n- `outputActivationFunc`：输出层激活函数\n\n**输出**：1\
  \ 次迭代后的更新权重\n\n```r\ngradientDescent <- function(parameters, gradients, learningRate,\
  \ outputActivationFunc = \"sigmoid\") {\n  L = length(parameters) / 2 # number of\
  \ layers in the neural network\n\n  # Update rule for each parameter. Use a for\
  \ loop.\n  for (l in 1:(L - 1)) {\n    parameters[[paste(\"W\", l, sep = \"\")]]\
  \ = parameters[[paste(\"W\", l, sep = \"\")]] -\n      learningRate * gradients[[paste(\"\
  dW\", l, sep = \"\")]]\n    parameters[[paste(\"b\", l, sep = \"\")]] = parameters[[paste(\"\
  b\", l, sep = \"\")]] -\n      learningRate * gradients[[paste(\"db\", l, sep =\
  \ \"\")]]\n  }\n\n  if (outputActivationFunc == \"sigmoid\") {\n    parameters[[paste(\"\
  W\", L, sep = \"\")]] = parameters[[paste(\"W\", L, sep = \"\")]] -\n      learningRate\
  \ * gradients[[paste(\"dW\", L, sep = \"\")]]\n    parameters[[paste(\"b\", L, sep\
  \ = \"\")]] = parameters[[paste(\"b\", L, sep = \"\")]] -\n      learningRate *\
  \ gradients[[paste(\"db\", L, sep = \"\")]]\n  } else if (outputActivationFunc ==\
  \ \"softmax\") {\n    parameters[[paste(\"W\", L, sep = \"\")]] = parameters[[paste(\"\
  W\", L, sep = \"\")]] -\n      learningRate * gradients[[paste(\"dW\", L, sep =\
  \ \"\")]]\n    # 代码截断，原文未提供完整的 softmax 分支 b 参数更新逻辑\n  }\n}\n```\n\n\n\n\n\n# R 语言中的梯度下降优化算法\n\
  \n本文档展示了三种梯度下降优化算法的实现：**Momentum（动量法）**、**RMSProp** 和 **Adam**。每个函数均根据计算出的梯度更新神经网络的参数（权重和偏置）。\n\
  \n## 带动量的梯度下降\n\n### 函数签名\n```r\ngradientDescentWithMomentum <- function(parameters,\
  \ gradients, v, beta, learningRate, outputActivationFunc=\"sigmoid\")\n```\n\n###\
  \ 输入\n- `parameters`：包含权重（`W1`、`W2`、...）和偏置（`b1`、`b2`、...）的列表。\n- `gradients`：包含权重梯度（`dW1`、`dW2`、...）和偏置梯度（`db1`、`db2`、...）的列表。\n\
  - `v`：速度列表（梯度的移动平均值）。\n- `beta`：动量超参数。\n- `learningRate`：学习率 $\\alpha$。\n- `outputActivationFunc`：输出层的激活函数（`\"\
  sigmoid\"` 或 `\"softmax\"`）。默认为 `\"sigmoid\"`。\n\n### 输出\n- 1 次迭代后更新的 `parameters`。\n\
  \n### 算法细节\n1.  **计算层数**：`L = length(parameters) / 2`。\n2.  **遍历隐藏层（1 到 L-1）**：\n\
  \    *   **更新速度**：\n        `v[[\"dW\" + l]] = beta * v[[\"dW\" + l]] + (1 - beta)\
  \ * gradients[[\"dW\" + l]]`\n        `v[[\"db\" + l]] = beta * v[[\"db\" + l]]\
  \ + (1 - beta) * gradients[[\"db\" + l]]`\n    *   **更新参数**：\n        `parameters[[\"\
  W\" + l]] = parameters[[\"W\" + l]] - learningRate * v[[\"dW\" + l]]`\n        `parameters[[\"\
  b\" + l]] = parameters[[\"b\" + l]] - learningRate * v[[\"db\" + l]]`\n3.  **处理输出层\
  \ (L)**：\n    *   **若为 `sigmoid`**：标准速度与参数更新（与隐藏层相同）。\n    *   **若为 `softmax`**：在速度计算和参数更新期间对梯度应用转置\
  \ `t()`。\n        `v[[\"dW\" + L]] = beta * v[[\"dW\" + L]] + (1 - beta) * t(gradients[[\"\
  dW\" + L]])`\n        `parameters[[\"W\" + L]] = parameters[[\"W\" + L]] - learningRate\
  \ * t(gradients[[\"dW\" + L]])`\n        （偏置 `db` 和 `b` 应用类似逻辑）。\n\n---\n\n## 带\
  \ RMSProp 的梯度下降\n\n### 函数签名\n```r\ngradientDescentWithRMSProp <- function(parameters,\
  \ gradients, s, beta1, epsilon, learningRate, outputActivationFunc=\"sigmoid\")\n\
  ```\n\n### 输入\n- `parameters`、`gradients`：同动量法。\n- `s`：缓存列表（平方梯度的移动平均值）。\n- `beta1`：移动平均的衰减率（文献中常记为\
  \ $\\beta_2$）。\n- `epsilon`：用于数值稳定性的小常数（防止除以零）。\n- `learningRate`、`outputActivationFunc`：同动量法。\n\
  \n### 算法细节\n1.  **计算层数**：`L = length(parameters) / 2`。\n2.  **遍历隐藏层（1 到 L-1）**：\n\
  \    *   **更新缓存（平方梯度）**：\n        `s[[\"dW\" + l]] = beta1 * s[[\"dW\" + l]] + (1\
  \ - beta1) * gradients[[\"dW\" + l]] * gradients[[\"dW\" + l]]`\n        （元素级乘法）。\n\
  \    *   **更新参数**：\n        `parameters[[\"W\" + l]] = parameters[[\"W\" + l]] -\
  \ learningRate * gradients[[\"dW\" + l]] / sqrt(s[[\"dW\" + l]] + epsilon)`\n3.\
  \  **处理输出层 (L)**：\n    *   **若为 `sigmoid`**：标准 RMSProp 更新。\n    *   **若为 `softmax`**：对缓存更新和参数更新应用梯度的转置\
  \ `t()`。\n        `s[[\"dW\" + L]] = beta1 * s[[\"dW\" + L]] + (1 - beta1) * t(gradients[[\"\
  dW\" + L]]) * t(gradients[[\"dW\" + L]])`\n        `parameters[[\"W\" + L]] = parameters[[\"\
  W\" + L]] - learningRate * t(gradients[[\"dW\" + L]]) / sqrt(s[[\"dW\" + L]] + epsilon)`\n\
  \n---\n\n## 带 Adam 的梯度下降\n\n### 函数签名\n```r\ngradientDescentWithAdam <- function(parameters,\
  \ gradients, v, s, t, beta1=0.9, beta2=0.999, epsilon=1e-8, learningRate=0.1, outputActivationFunc=\"\
  sigmoid\")\n```\n\n### 输入\n- `parameters`、`gradients`：同上。\n- `v`：速度列表（一阶矩，梯度的移动平均值）。\n\
  - `s`：缓存列表（二阶矩，平方梯度的移动平均值）。\n- `t`：时间步（迭代计数），用于偏差修正。\n- `beta1`：一阶矩估计的指数衰减率（默认 0.9）。\n\
  - `beta2`：二阶矩估计的指数衰减率（默认 0.999）。\n- `epsilon`：数值稳定性常数（默认 1e-8）。\n- `learningRate`：学习率（默认\
  \ 0.1）。\n- `outputActivationFunc`：输出激活函数（默认 `\"sigmoid\"`）。\n\n### 算法细节\n1.  **计算层数**：`L\
  \ = length(parameters) / 2`。\n2.  **初始化修正列表**：`v_corrected <- list()`、`s_corrected\
  \ <- list()`。\n3.  **遍历隐藏层（1 到 L-1）**：\n    *   **更新一阶矩（速度）**：\n        `v[[\"dW\"\
  \ + l]] = beta1 * v[[\"dW\" + l]] + (1 - beta1) * gradients[[\"dW\" + l]]`\n   \
  \ *   **偏差修正（一阶矩）**：\n        `v_corrected[[\"dW\" + l]] = v[[\"dW\" + l]] / (1\
  \ - beta1^t)`\n    *   **更新二阶矩（缓存）**：\n        `s[[\"dW\" + l]] = beta2 * s[[\"\
  dW\" + l]] + (1 - beta2) * gradients[[\"dW\" + l]] * gradients[[\"dW\" + l]]`\n\
  \    *   **偏差修正（二阶矩）**：\n        `s_corrected[[\"dW\" + l]] = s[[\"dW\" + l]] /\
  \ (1 - beta2^t)`\n    *   **更新参数**：\n        `d1 = sqrt(s_corrected[[\"dW\" + l]]\
  \ + epsilon)`\n        `parameters[[\"W\" + l]] = parameters[[\"W\" + l]] - learningRate\
  \ * v_corrected[[\"dW\" + l]] / d1`\n        （偏置 `db`、`b` 使用 `d2` 应用类似逻辑）。\n4. \
  \ **处理输出层 (L)**：\n    *   **若为 `sigmoid`**：使用原始梯度进行标准 Adam 更新。\n    *   **若为 `softmax`**：对矩更新和参数更新使用转置梯度\
  \ `t(gradients[...])`。\n    *   *注意：提供的代码片段在输出层的 `sigmoid` 块（偏差修正计算）处中断。*\n\n---\n\
  \n## 通用实现模式\n\n*   **动态命名**：所有函数均使用 `paste(\"dW\", l, sep=\"\")`（或 `paste0(\"dW\"\
  , l)`）动态访问第 `l` 层的列表元素。\n*   **列表结构**：`parameters`、`gradients`、`v`、`s` 均为 R 列表，其名称遵循\
  \ `\"W1\"`、`\"b1\"`、`\"dW1\"`、`\"db1\"` 等模式。\n*   **输出层处理**：特殊的逻辑分支（`if/else`）根据输出激活函数是\
  \ `sigmoid`（标准）还是 `softmax`（需要转置 `t()`），对最后一层 `L` 进行不同处理。\n*   **原地修改**：函数修改输入列表（`parameters`、`v`、`s`）并返回更新后的\
  \ `parameters`。\n\n\n\n\n\n# Adam 优化算法实现细节\n\n## 参数更新（通用激活函数分支）\n\n```r\nv_corrected[[paste(\"\
  dW\", L, sep=\"\")]] = v[[paste(\"dW\", L, sep=\"\")]] / (1 - beta1^t)\nv_corrected[[paste(\"\
  db\", L, sep=\"\")]] = v[[paste(\"db\", L, sep=\"\")]] / (1 - beta1^t)\n\n# 梯度的逐元素相乘\n\
  s[[paste(\"dW\", L, sep=\"\")]] = beta2 * s[[paste(\"dW\", L, sep=\"\")]] +\n  (1\
  \ - beta2) * gradients[[paste('dW', L, sep=\"\")]] *\n  gradients[[paste('dW', L,\
  \ sep=\"\")]]\n\ns[[paste(\"db\", L, sep=\"\")]] = beta2 * s[[paste(\"db\", L, sep=\"\
  \")]] +\n  (1 - beta2) * gradients[[paste('db', L, sep=\"\")]] *\n  gradients[[paste('db',\
  \ L, sep=\"\")]]\n\n# 计算偏差修正后的二阶矩估计。\ns_corrected[[paste(\"dW\", L, sep=\"\")]]\
  \ = s[[paste(\"dW\", L, sep=\"\")]] / (1 - beta2^t)\ns_corrected[[paste(\"db\",\
  \ L, sep=\"\")]] = s[[paste(\"db\", L, sep=\"\")]] / (1 - beta2^t)\n\n# 更新参数。\n\
  d1 = sqrt(s_corrected[[paste(\"dW\", L, sep=\"\")]] + epsilon)\nd2 = sqrt(s_corrected[[paste(\"\
  db\", L, sep=\"\")]] + epsilon)\nparameters[[paste(\"W\", L, sep=\"\")]] = parameters[[paste(\"\
  W\", L, sep=\"\")]] -\n  learningRate * v_corrected[[paste(\"dW\", L, sep=\"\")]]\
  \ / d1\nparameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\
  \")]] -\n  learningRate * v_corrected[[paste(\"db\", L, sep=\"\")]] / d2\n```\n\n\
  ## 参数更新（Softmax 激活函数分支）\n\n```r\n} else if (outputActivationFunc == \"softmax\"\
  ) {\n\nv[[paste(\"dW\", L, sep=\"\")]] = beta1 * v[[paste(\"dW\", L, sep=\"\")]]\
  \ +\n  (1 - beta1) * t(gradients[[paste('dW', L, sep=\"\")]])\n\nv[[paste(\"db\"\
  , L, sep=\"\")]] = beta1 * v[[paste(\"db\", L, sep=\"\")]] +\n  (1 - beta1) * t(gradients[[paste('db',\
  \ L, sep=\"\")]])\n\n# 计算偏差修正后的一阶矩估计。\nv_corrected[[paste(\"dW\", L, sep=\"\")]]\
  \ = v[[paste(\"dW\", L, sep=\"\")]] / (1 - beta1^t)\nv_corrected[[paste(\"db\",\
  \ L, sep=\"\")]] = v[[paste(\"db\", L, sep=\"\")]] / (1 - beta1^t)\n\n# 梯度的逐元素相乘\n\
  s[[paste(\"dW\", L, sep=\"\")]] = beta2 * s[[paste(\"dW\", L, sep=\"\")]] +\n  (1\
  \ - beta2) * t(gradients[[paste('dW', L, sep=\"\")]]) *\n  t(gradients[[paste('dW',\
  \ L, sep=\"\")]])\n\ns[[paste(\"db\", L, sep=\"\")]] = beta2 * s[[paste(\"db\",\
  \ L, sep=\"\")]] +\n  (1 - beta2) * t(gradients[[paste('db', L, sep=\"\")]]) *\n\
  \  t(gradients[[paste('db', L, sep=\"\")]])\n\n# 计算偏差修正后的二阶矩估计。\ns_corrected[[paste(\"\
  dW\", L, sep=\"\")]] = s[[paste(\"dW\", L, sep=\"\")]] / (1 - beta2^t)\ns_corrected[[paste(\"\
  db\", L, sep=\"\")]] = s[[paste(\"db\", L, sep=\"\")]] / (1 - beta2^t)\n\n# 更新参数。\n\
  d1 = sqrt(s_corrected[[paste(\"dW\", L, sep=\"\")]] + epsilon)\nd2 = sqrt(s_corrected[[paste(\"\
  db\", L, sep=\"\")]] + epsilon)\nparameters[[paste(\"W\", L, sep=\"\")]] = parameters[[paste(\"\
  W\", L, sep=\"\")]] -\n  learningRate * v_corrected[[paste(\"dW\", L, sep=\"\")]]\
  \ / d1\nparameters[[paste(\"b\", L, sep=\"\")]] = parameters[[paste(\"b\", L, sep=\"\
  \")]] -\n  learningRate * v_corrected[[paste(\"db\", L, sep=\"\")]] / d2\n}\n\n\
  return(parameters)\n}\n```\n\n# L 层深度学习模型 (`L_Layer_DeepModel`)\n\n## 函数功能\n执行一个\
  \ L 层深度学习模型。\n\n## 输入参数\n- `X`：输入特征\n- `Y`：输出标签\n- `layersDimensions`：各层维度向量\n-\
  \ `hiddenActivationFunc`：隐藏层激活函数 (`relu` / `tanh`)\n- `outputActivationFunc`：输出层激活函数\
  \ (`sigmoid` / `softmax`)\n- `learningRate`：学习率\n- `lambd`：正则化参数\n- `keep_prob`：Dropout\
  \ 保留概率\n- `numIterations`：迭代次数\n- `initType`：参数初始化类型 (`default`, `He`, `Xav`)\n\
  - `print_cost`：是否打印成本\n\n## 输出\n- 更新后的权重参数\n\n## 实现代码\n\n```r\nL_Layer_DeepModel\
  \ <- function(X, Y, layersDimensions,\n                              hiddenActivationFunc\
  \ = 'relu',\n                              outputActivationFunc = 'sigmoid',\n \
  \                             learningRate = 0.5,\n                            \
  \  lambd = 0,\n                              keep_prob = 1,\n                  \
  \            numIterations = 10000,\n                              initType = \"\
  default\",\n                              print_cost = FALSE) {\n\n  # 初始化成本向量为\
  \ NULL\n  costs <- NULL\n\n  # 参数初始化。\n  if (initType == \"He\") {\n    parameters\
  \ = HeInitializeDeepModel(layersDimensions)\n  } else if (initType == \"Xav\") {\n\
  \    parameters = XavInitializeDeepModel(layersDimensions)\n  } else {\n    parameters\
  \ = initializeDeepModel(layersDimensions)\n  }\n\n  # 循环（梯度下降）\n  for (i in 0:numIterations)\
  \ {\n\n    # 前向传播：[LINEAR -> RELU]*(L-1) -> LINEAR -> SIGMOID/SOFTMAX。\n    retvals\
  \ = forwardPropagationDeep(X, parameters, keep_prob,\n                         \
  \            hiddenActivationFunc,\n                                     outputActivationFunc\
  \ = outputActivationFunc)\n\n    AL <- retvals[['AL']]\n    caches <- retvals[['caches']]\n\
  \    dropoutMat <- retvals[['dropoutMat']]\n\n    # 计算成本。\n    if (lambd == 0) {\n\
  \      cost <- computeCost(AL,\n                          Y, outputActivationFunc\
  \ = outputActivationFunc,\n                          numClasses = layersDimensions[length(layersDimensions)])\n\
  \    } else {\n      cost <- computeCostWithReg(parameters, AL, Y, lambd,\n    \
  \                             outputActivationFunc = outputActivationFunc,\n   \
  \                              numClasses = layersDimensions[length(layersDimensions)])\n\
  \    }\n\n    # 反向传播。\n    gradients = backwardPropagationDeep(AL, Y, caches, dropoutMat,\
  \ lambd, keep_prob, hiddenActivationFunc,\n                                    \
  \    outputActivationFunc = outputActivationFunc,\n                            \
  \            numClasses = layersDimensions[length(layersDimensions)])\n\n    # 更新参数。\n\
  \    parameters = gradientDescent(parameters, gradients, learningRate, outputActivationFunc\
  \ = outputActivationFunc)\n\n    if (i %% 1000 == 0) {\n      costs = c(costs, cost)\n\
  \      print(cost)\n    }\n  }\n\n  retvals <- list(\"parameters\" = parameters,\
  \ \"costs\" = costs)\n  return(retvals)\n}\n```\n\n# L 层深度学习模型（随机梯度下降版） (`L_Layer_DeepModel_SGD`)\n\
  \n## 函数功能\n执行一个使用随机梯度下降 (SGD) 的 L 层深度学习模型。\n\n## 输入参数\n- `X`：输入特征\n- `Y`：输出标签\n\
  - `layersDimensions`：各层维度向量\n- `hiddenActivationFunc`：隐藏层激活函数 (`relu` / `tanh`)\n\
  - `outputActivationFunc`：输出层激活函数 (`sigmoid` / `softmax`)\n- `learningRate`：学习率\n\
  - `lrDecay`：是否启用学习率衰减\n- `decayRate`：衰减率\n- `lambd`：正则化参数\n- `keep_prob`：Dropout\
  \ 保留概率\n- `optimizer`：优化器类型 (`gd`, `momentum`, `rmsprop`, `adam`)\n- `beta`：Momentum/RMSprop\
  \ 的动量参数\n- `beta1`：Adam 的一阶矩估计指数衰减率\n- `beta2`：Adam 的二阶矩估计指数衰减率\n- `epsilon`：数值稳定性常数\n\
  - `mini_batch_size`：小批量大小\n- `num_epochs`：训练轮数\n- `print_cost`：是否打印成本\n\n## 输出\n\
  - 每次迭代后更新的权重\n\n## 实现代码\n\n```r\nL_Layer_DeepModel_SGD <- function(X, Y, layersDimensions,\n\
  \                                  hiddenActivationFunc = 'relu',\n            \
  \                      outputActivationFunc = 'sigmoid',\n                     \
  \             learningRate = .3,\n                                  lrDecay = FALSE,\n\
  \                                  decayRate = 1,\n                            \
  \      lambd = 0,\n                                  keep_prob = 1,\n          \
  \                        optimizer = \"gd\",\n                                 \
  \ beta = 0.9,\n                                  beta1 = 0.9,\n                \
  \                  beta2 = 0.999,\n                                  epsilon = 10^-8,\n\
  \                                  mini_batch_size = 64,\n                     \
  \             num_epochs = 2500,\n                                  print_cost =\
  \ FALSE) {\n\n  # 检查数值\n  cat(\"learningRate= \", learningRate)\n  cat(\"\\n\")\n\
  \  cat(\"lambd=\", lambd)\n  cat(\"\\n\")\n  cat(\"keep_prob=\", keep_prob)\n  cat(\"\
  \\n\")\n  cat(\"optimizer=\", optimizer)\n  cat(\"\\n\")\n  cat(\"lrDecay=\", lrDecay)\n\
  \  cat(\"\\n\")\n  cat(\"decayRate=\", decayRate)\n  cat(\"\\n\")\n  cat(\"beta=\"\
  , beta)\n  cat(\"\\n\")\n  cat(\"beta1=\", beta1)\n  cat(\"\\n\")\n  cat(\"beta2=\"\
  , beta2)\n  cat(\"\\n\")\n  cat(\"epsilon=\", epsilon)\n  cat(\"\\n\")\n  cat(\"\
  mini_batch_size=\", mini_batch_size)\n  cat(\"\\n\")\n  cat(\"num_epochs=\", num_epochs)\n\
  \  cat(\"\\n\")\n\n  set.seed(1)\n\n  # 初始化成本向量为 NULL\n  costs <- NULL\n  t <- 0\n\
  \n  # 参数初始化。\n  parameters = initializeDeepModel(layersDimensions)\n\n  # 初始化优化器\n\
  \  if (optimizer == \"momentum\") {\n    v <- initializeVelocity(parameters)\n \
  \ } else if (optimizer == \"rmsprop\") {\n    s <- initializeRMSProp(parameters)\n\
  \  } else if (optimizer == \"adam\") {\n    adamVals <- initializeAdam(parameters)\n\
  \  }\n\n  seed = 10\n\n  # 循环训练轮数\n  for (i in 0:num_epochs) {\n    seed = seed\
  \ + 1\n    minibatches = random_mini_batches(X, Y, mini_batch_size, seed)\n\n  \
  \  for (batch in 1:length(minibatches)) {\n      mini_batch_X = minibatches[[batch]][['mini_batch_X']]\n\
  \      mini_batch_Y = minibatches[[batch]][['mini_batch_Y']]\n\n      # 前向传播：\n\
  \      retvals = forwardPropagationDeep(mini_batch_X, parameters, keep_prob, hiddenActivationFunc,\n\
  \                                       outputActivationFunc = outputActivationFunc)\n\
  \n      AL <- retvals[['AL']]\n      caches <- retvals[['caches']]\n      dropoutMat\
  \ <- retvals[['dropoutMat']]\n\n      # 计算成本。\n      if (lambd == 0) {\n       \
  \ cost <- computeCost(AL,\n                            mini_batch_Y, outputActivationFunc\
  \ = outputActivationFunc,\n                            numClasses = layersDimensions[length(layersDimensions)])\n\
  \      } else {\n        cost <- computeCostWithReg(parameters, AL, Y, lambd,\n\
  \                                   outputActivationFunc = outputActivationFunc,\n\
  \                                   numClasses = layersDimensions[length(layersDimensions)])\n\
  \      }\n\n      # 反向传播。\n      gradients = backwardPropagationDeep(AL, mini_batch_Y,\
  \ caches, dropoutMat, lambd, keep_prob, hiddenActivationFunc,\n                \
  \                          outputActivationFunc = outputActivationFunc,\n      \
  \                                    numClasses = layersDimensions[length(layersDimensions)])\n\
  \n      if (optimizer == \"gd\") {\n        # 更新参数。\n```\n\n\n\n\n\n### 7.3 Octave\n\
  \n############################################################################################################\n\
  #\n# File : DLfunctions7.R\n# Author : Tinniam V Ganesh\n# Date : 16 Apr 2018\n\
  #\n##########################################################################################################\n\
  \n1;\n\n# 定义 Sigmoid 函数\nfunction [A,cache] = sigmoid(Z)\n    A = 1 ./ (1 + exp(-Z));\n\
  \    cache = Z;\nend\n\n# 定义 Relu 函数\nfunction [A,cache] = relu(Z)\n    A = max(0,\
  \ Z);\n    cache = Z;\nend\n\n# 定义 Tanh 函数\nfunction [A,cache] = tanhAct(Z)\n  \
  \  A = tanh(Z);\n    cache = Z;\nend\n\n# 定义 Softmax 函数\nfunction [A,cache] = softmax(Z)\n\
  \    # 获取未归一化的概率\n    exp_scores = exp(Z');\n    # 对每个样本进行归一化\n    A = exp_scores\
  \ ./ sum(exp_scores, 2);\n    cache = Z;\nend\n\n# 定义稳定 Softmax 函数\nfunction [A,cache]\
  \ = stableSoftmax(Z)\n    # 按每行的最大值进行归一化\n    shiftZ = Z' - max(Z', [], 2);\n  \
  \  exp_scores = exp(shiftZ);\n    # 对每个样本进行归一化\n    A = exp_scores ./ sum(exp_scores,\
  \ 2);\n    # disp(\"sm\")\n    # disp(A);\n    cache = Z;\nend\n\n# 定义 Relu 导数\n\
  function [dZ] = reluDerivative(dA, cache)\n    Z = cache;\n    dZ = dA;\n    # 获取大于\
  \ 0 的元素\n    a = (Z > 0);\n    # 仅选择 Z > 0 的那些元素\n    dZ = dZ .* a;\nend\n\n# 定义\
  \ Sigmoid 导数\nfunction [dZ] = sigmoidDerivative(dA, cache)\n    Z = cache;\n   \
  \ s = 1 ./ (1 + exp(-Z));\n    dZ = dA .* s .* (1 - s);\nend\n\n# 定义 Tanh 导数\nfunction\
  \ [dZ] = tanhDerivative(dA, cache)\n    Z = cache;\n    a = tanh(Z);\n    dZ = dA\
  \ .* (1 - a .^ 2);\nend\n\n# 用 1 填充 Y=1 所在行的矩阵\n# 如果 K 不是 3 或 10，此函数可能需要修改\n# 此函数用于计算\
  \ Softmax 导数\nfunction [Y1] = popMatrix(Y, numClasses)\n    Y1 = zeros(length(Y),\
  \ numClasses);\n    if (numClasses == 3) # 针对 3 个输出类别\n        Y1(Y == 0, 1) = 1;\n\
  \        Y1(Y == 1, 2) = 1;\n        Y1(Y == 2, 3) = 1;\n    elseif (numClasses\
  \ == 10) # 针对 10 个输出类别\n        Y1(Y == 0, 1) = 1;\n        Y1(Y == 1, 2) = 1;\n\
  \        Y1(Y == 2, 3) = 1;\n        Y1(Y == 3, 4) = 1;\n        Y1(Y == 4, 5) =\
  \ 1;\n        Y1(Y == 5, 6) = 1;\n        Y1(Y == 6, 7) = 1;\n        Y1(Y == 7,\
  \ 8) = 1;\n        Y1(Y == 8, 9) = 1;\n        Y1(Y == 9, 10) = 1;\n    endif\n\
  end\n\n# 定义 Softmax 导数\nfunction [dZ] = softmaxDerivative(dA, cache, Y, numClasses)\n\
  \    Z = cache;\n    # 获取未归一化的概率\n    shiftZ = Z' - max(Z', [], 2);\n    exp_scores\
  \ = exp(shiftZ);\n    # 对每个样本进行归一化\n    probs = exp_scores ./ sum(exp_scores, 2);\n\
  \    # dZ = pi - yi\n    yi = popMatrix(Y, numClasses);\n    dZ = probs - yi;\n\
  end\n\n# 定义稳定 Softmax 导数\nfunction [dZ] = stableSoftmaxDerivative(dA, cache, Y,\
  \ numClasses)\n    Z = cache;\n    # 获取未归一化的概率\n    exp_scores = exp(Z');\n    #\
  \ 对每个样本进行归一化\n    probs = exp_scores ./ sum(exp_scores, 2);\n    # dZ = pi - yi\n\
  \n\n\n\n# 矩阵操作与初始化\n\n```matlab\nyi = popMatrix(Y, numClasses);\ndZ = probs - yi;\n\
  ```\n\n# 初始化深度模型 (L 层)\n\n**输入**: 每层单元数的向量  \n**返回**: 所有层的初始权重和偏置矩阵\n\n```matlab\n\
  function [W, b] = initializeDeepModel(layerDimensions)\n    rand(\"seed\", 3);\n\
  \    % note the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n    % The\
  \ Bias is a vectors of size (l,1)\n    % Loop through the layer dimension from 1..\
  \ L\n    % Create cell arrays for Weights and biases\n    for l = 2:size(layerDimensions)(2)\n\
  \        W{l-1} = rand(layerDimensions(l), layerDimensions(l-1)) * 0.01; % Multiply\
  \ by .01\n        b{l-1} = zeros(layerDimensions(l), 1);\n    endfor\nend\n```\n\
  \n# He 初始化 (L 层)\n\n**输入**: 每层单元数的向量  \n**返回**: 所有层的初始权重和偏置矩阵\n\n```matlab\nfunction\
  \ [W, b] = HeInitializeDeepModel(layerDimensions)\n    rand(\"seed\", 3);\n    %\
  \ note the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n    % The Bias\
  \ is a vectors of size (l,1)\n    % Loop through the layer dimension from 1.. L\n\
  \    % Create cell arrays for Weights and biases\n    for l = 2:size(layerDimensions)(2)\n\
  \        W{l-1} = rand(layerDimensions(l), layerDimensions(l-1)) * sqrt(2 / layerDimensions(l-1));\
  \ % Multiply by .01\n        b{l-1} = zeros(layerDimensions(l), 1);\n    endfor\n\
  end\n```\n\n# Xavier 初始化 (L 层)\n\n**输入**: 每层单元数的向量  \n**返回**: 所有层的初始权重和偏置矩阵\n\n\
  ```matlab\nfunction [W, b] = XavInitializeDeepModel(layerDimensions)\n    rand(\"\
  seed\", 3);\n    % note the Weight matrix at layer 'l' is a matrix of size (l,l-1)\n\
  \    % The Bias is a vectors of size (l,1)\n    % Loop through the layer dimension\
  \ from 1.. L\n    % Create cell arrays for Weights and biases\n    for l = 2:size(layerDimensions)(2)\n\
  \        W{l-1} = rand(layerDimensions(l), layerDimensions(l-1)) * sqrt(1 / layerDimensions(l-1));\
  \ % Multiply by .01\n        b{l-1} = zeros(layerDimensions(l), 1);\n    endfor\n\
  end\n```\n\n# 初始化速度\n\n**输入**: `weights`, `biases`  \n**返回**: `vdW`, `vdB` - 初始速度\n\
  \n```matlab\nfunction [vdW, vdB] = initializeVelocity(weights, biases)\n    L =\
  \ size(weights)(2); % Create an integer\n    % Initialize a cell array\n    v =\
  \ {};\n    % Initialize velocity with the same dimensions as W\n    for l = 1:L\n\
  \        sz = size(weights{l});\n        vdW{l} = zeros(sz(1), sz(2));\n       \
  \ sz = size(biases{l});\n        vdB{l} = zeros(sz(1), sz(2));\n    endfor;\nend\n\
  ```\n\n# 初始化 RMSProp\n\n**输入**: `weights`, `biases`  \n**返回**: `sdW`, `sdB` - 初始\
  \ RMSProp\n\n```matlab\nfunction [sdW, sdB] = initializeRMSProp(weights, biases)\n\
  \    L = size(weights)(2); % Create an integer\n    % Initialize a cell array\n\
  \    s = {};\n    % Initialize velocity with the same dimensions as W\n    for l\
  \ = 1:L\n        sz = size(weights{l});\n        sdW{l} = zeros(sz(1), sz(2));\n\
  \        sz = size(biases{l});\n        sdB{l} = zeros(sz(1), sz(2));\n    endfor;\n\
  end\n```\n\n# 初始化 Adam\n\n**输入**: `parameters`  \n**返回**: `vdW`, `vdB`, `sdW`, `sdB`\
  \ - 初始 Adam\n\n```matlab\nfunction [vdW, vdB, sdW, sdB] = initializeAdam(weights,\
  \ biases)\n    L = size(weights)(2); % Create an integer\n    % Initialize a cell\
  \ array\n    s = {};\n    % Initialize velocity with the same dimensions as W\n\
  \    for l = 1:L\n        sz = size(weights{l});\n        vdW{l} = zeros(sz(1),\
  \ sz(2));\n        sdW{l} = zeros(sz(1), sz(2));\n        sz = size(biases{l});\n\
  \        sdB{l} = zeros(sz(1), sz(2));\n        vdB{l} = zeros(sz(1), sz(2));\n\
  \    endfor;\nend\n```\n\n# 计算深度网络前向传播中第 `l` 层的激活值\n\n**输入**: \n- `A_prev` - 上一层的激活值\n\
  - `W`, `b` - 权重和偏置矩阵及向量\n- `activationFunc` - 激活函数 (sigmoid, tanh, relu 等)\n\n**返回**:\
  \ 该层的激活值\n\n**公式**:\n- `Z = W * X + b`\n- `A = sigmoid(Z)`, `A = Relu(Z)`, `A =\
  \ tanh(Z)`\n\n```matlab\nfunction [A, forward_cache, activation_cache] = layerActivationForward(A_prev,\
  \ W, b, activationFunc)\n    % Compute Z\n    Z = W * A_prev + b;\n    % Create\
  \ a cell array\n    forward_cache = {A_prev, W, b};\n    % Compute the activation\
  \ for sigmoid\n    if (strcmp(activationFunc, \"sigmoid\"))\n        [A, activation_cache]\
  \ = sigmoid(Z);\n    elseif (strcmp(activationFunc, \"relu\")) % Compute the activation\
  \ for Relu\n        [A, activation_cache] = relu(Z);\n    elseif (strcmp(activationFunc,\
  \ 'tanh')) % Compute the activation for tanh\n        [A, activation_cache] = tanhAct(Z);\n\
  \    elseif (strcmp(activationFunc, 'softmax')) % Compute the activation for tanh\n\
  \        % [A, activation_cache] = softmax(Z);\n        [A, activation_cache] =\
  \ stableSoftmax(Z);\n    endif\nend\n```\n\n# 计算第 1..L 层的前向传播\n\n**输入**: \n- `X`\
  \ - 输入特征\n- `parameters`: 权重和偏置\n- `keep_prob`\n- `hiddenActivationFunc` - 隐藏层激活函数\
  \ (Relu/tanh/sigmoid)\n- `outputActivationFunc` - 输出层激活函数 (sigmoid/softmax)\n\n\
  **返回**: `AL`, `forward_caches`, `activation_caches`, `dropoutMat`\n\n前向传播在第 1..L-1\
  \ 层使用 Relu/tanh 激活函数，第 L 层使用 sigmoid 激活函数。\n\n```matlab\nfunction [AL, forward_caches,\
  \ activation_caches, dropoutMat] = forwardPropagationDeep(X, weights, biases, keep_prob=1,\
  \ hiddenActivationFunc='relu', outputActivationFunc='sigmoid')\n    % Create an\
  \ empty cell array\n    forward_caches = {};\n    activation_caches = {};\n    dropoutMat\
  \ = {};\n    % Set A to X (A0)\n    A = X;\n    L = length(weights); % number of\
  \ layers in the neural network\n    % Loop through from layer 1 to upto layer L\n\
  \    for l = 1:L-1\n        A_prev = A;\n        % Zi = Wi x Ai-1 + bi and Ai =\
  \ g(Zi)\n        W = weights{l};\n        b = biases{l};\n        [A, forward_cache,\
  \ activation_cache] = layerActivationForward(A_prev, W, b, activationFunc=hiddenActivationFunc);\n\
  \        D = rand(size(A)(1), size(A)(2));\n        D = (D < keep_prob);\n     \
  \   % Multiply by DropoutMat\n        A = A .* D;\n        % Divide by keep_prob\
  \ to keep expected value same\n        A = A ./ keep_prob;\n        % Store D\n\
  \        dropoutMat{l} = D;\n        forward_caches{l} = forward_cache;\n      \
  \  activation_caches{l} = activation_cache;\n    endfor\n    % Since this is binary\
  \ classification use the sigmoid activation function in last layer\n    W = weights{L};\n\
  \    b = biases{L};\n    [AL, forward_cache, activation_cache] = layerActivationForward(A,\
  \ W, b, activationFunc = outputActivationFunc);\n    forward_caches{L} = forward_cache;\n\
  \    activation_caches{L} = activation_cache;\nend\n```\n\n# 选取 Y==1 的列\n\n此函数用于\
  \ `computeCost`。\n\n```matlab\nfunction [a] = pickColumns(AL, Y, numClasses)\n \
  \   if (numClasses == 3)\n        a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3)];\n\
  \    elseif (numClasses == 10)\n        a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3);\
  \ AL(Y==3,4); AL(Y==4,5);\n             AL(Y==5,6); AL(Y==6,7); AL(Y==7,8); AL(Y==8,9);\
  \ AL(Y==9,10)];\n    endif\nend\n```\n\n# 计算代价\n\n**输入**: \n- `AL` - 最后一层的激活值\n\
  - `Y` - 数据输出\n- `outputActivationFunc` - sigmoid/softmax\n- `numClasses`\n\n**输出**:\
  \ `cost`\n\n```matlab\nfunction [cost] = computeCost(AL, Y, outputActivationFunc=\"\
  sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n   \
  \     numTraining = size(Y)(2);\n        % Element wise multiply for logprobs\n\
  \        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n   \
  \ elseif (strcmp(outputActivationFunc, 'softmax'))\n        numTraining = size(Y)(2);\n\
  \        Y = Y';\n        % Select rows where Y=0,1,and 2 and concatenate to a long\
  \ vector\n        % a = [AL(Y==0,1) ; AL(Y==1,2) ; AL(Y==2,3)];\n        a = pickColumns(AL,\
  \ Y, numClasses);\n        % Select the correct column for log prob\n        correct_probs\
  \ = -log(a);\n        % Compute log loss\n        cost = sum(correct_probs) / numTraining;\n\
  \    endif\nend\n```\n\n# 带正则化的代价计算\n\n**输入**: \n- `weights`\n- `AL` - 最后一层的激活值\n\
  - `Y` - 数据输出\n- `lambd`\n- `outputActivationFunc` - sigmoid/softmax\n- `numClasses`\n\
  \n**输出**: `cost`\n\n```matlab\nfunction [cost] = computeCostWithReg(weights, AL,\
  \ Y, lambd, outputActivationFunc=\"sigmoid\", numClasses)\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        numTraining = size(Y)(2);\n        % Element wise multiply\
  \ for logprobs\n        cost = -1/numTraining * sum((Y .* log(AL)) + (1-Y) .* log(1-AL));\n\
  \        % Regularization cost\n        L = size(weights)(2);\n        L2RegularizationCost\
  \ = 0;\n        for l = 1:L\n            wtSqr = weights{l} .* weights{l};\n   \
  \         % disp(sum(sum(wtSqr,1)));\n            L2RegularizationCost += sum(sum(wtSqr,\
  \ 1));\n        endfor\n        L2RegularizationCost = (lambd / (2 * numTraining))\
  \ * L2RegularizationCost;\n        cost = cost + L2RegularizationCost;\n    elseif\
  \ (strcmp(outputActivationFunc, 'softmax'))\n        numTraining = size(Y)(2);\n\
  \        Y = Y';\n        % Select rows where Y=0,1,and 2 and concatenate to a long\
  \ vector\n```\n\n\n\n\n# 代码实现\n\n## 计算损失函数\n\n```matlab\na = [AL(Y==0,1) ; AL(Y==1,2)\
  \ ; AL(Y==2,3)];\na = pickColumns(AL, Y, numClasses);\n\n# 选择用于对数概率的正确列\ncorrect_probs\
  \ = -log(a);\n\n# 计算对数损失\ncost = sum(correct_probs) / numTraining;\n\n# 正则化损失\n\
  L = size(weights)(2);\nL2RegularizationCost = 0;\n\nfor l = 1:L\n    # 计算 L2 范数\n\
  \    wtSqr = weights{l} .* weights{l};\n    # disp(sum(sum(wtSqr,1)));\n    L2RegularizationCost\
  \ += sum(sum(wtSqr, 1));\nendfor\n\nL2RegularizationCost = (lambd / (2 * numTraining))\
  \ * L2RegularizationCost;\ncost = cost + L2RegularizationCost;\n```\n\n## 反向传播单层（无正则化）\n\
  \n```matlab\nfunction [dA_prev, dW, db] = layerActivationBackward(dA, forward_cache,\
  \ activation_cache, Y, activationFunc, numClasses)\n    A_prev = forward_cache{1};\n\
  \    W = forward_cache{2};\n    b = forward_cache{3};\n    numTraining = size(A_prev)(2);\n\
  \n    if (strcmp(activationFunc, \"relu\"))\n        dZ = reluDerivative(dA, activation_cache);\n\
  \    elseif (strcmp(activationFunc, \"sigmoid\"))\n        dZ = sigmoidDerivative(dA,\
  \ activation_cache);\n    elseif (strcmp(activationFunc, \"tanh\"))\n        dZ\
  \ = tanhDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc, \"\
  softmax\"))\n        # dZ = softmaxDerivative(dA, activation_cache, Y, numClasses);\n\
  \        dZ = stableSoftmaxDerivative(dA, activation_cache, Y, numClasses);\n  \
  \  endif\n\n    if (strcmp(activationFunc, \"softmax\"))\n        W = forward_cache{2};\n\
  \        b = forward_cache{3};\n        # 添加正则化因子\n        dW = 1 / numTraining\
  \ * A_prev * dZ;\n        db = 1 / numTraining * sum(dZ, 1);\n        dA_prev =\
  \ dZ * W;\n    else\n        W = forward_cache{2};\n        b = forward_cache{3};\n\
  \        # 添加正则化因子\n        dW = 1 / numTraining * dZ * A_prev';\n        db = 1\
  \ / numTraining * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\nend\n```\n\
  \n## 反向传播单层（带正则化）\n\n```matlab\nfunction [dA_prev, dW, db] = layerActivationBackwardWithReg(dA,\
  \ forward_cache, activation_cache, Y, lambd=0, activationFunc, numClasses)\n   \
  \ A_prev = forward_cache{1};\n    W = forward_cache{2};\n    b = forward_cache{3};\n\
  \    numTraining = size(A_prev)(2);\n\n    if (strcmp(activationFunc, \"relu\"))\n\
  \        dZ = reluDerivative(dA, activation_cache);\n    elseif (strcmp(activationFunc,\
  \ \"sigmoid\"))\n        dZ = sigmoidDerivative(dA, activation_cache);\n    elseif\
  \ (strcmp(activationFunc, \"tanh\"))\n        dZ = tanhDerivative(dA, activation_cache);\n\
  \    elseif (strcmp(activationFunc, \"softmax\"))\n        # dZ = softmaxDerivative(dA,\
  \ activation_cache, Y, numClasses);\n        dZ = stableSoftmaxDerivative(dA, activation_cache,\
  \ Y, numClasses);\n    endif\n\n    if (strcmp(activationFunc, \"softmax\"))\n \
  \       W = forward_cache{2};\n        b = forward_cache{3};\n        # 添加正则化因子\n\
  \        dW = 1 / numTraining * A_prev * dZ + (lambd / numTraining) * W';\n    \
  \    db = 1 / numTraining * sum(dZ, 1);\n        dA_prev = dZ * W;\n    else\n \
  \       W = forward_cache{2};\n        b = forward_cache{3};\n        # 添加正则化因子\n\
  \        dW = 1 / numTraining * dZ * A_prev' + (lambd / numTraining) * W;\n    \
  \    db = 1 / numTraining * sum(dZ, 2);\n        dA_prev = W' * dZ;\n    endif\n\
  end\n```\n\n## 深层网络反向传播\n\n```matlab\nfunction [gradsDA, gradsDW, gradsDB] = backwardPropagationDeep(AL,\
  \ Y, activation_caches, forward_caches, dropoutMat, lambd=0, keep_prob=1, hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", numClasses)\n    # 设置层数\n    L = length(activation_caches);\n\
  \    m = size(AL)(2);\n\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n  \
  \      # 初始化反向传播\n        # dl/dAL = -(y/a + (1-y)/(1-a)) - 在输出层\n        dAL =\
  \ -((Y ./ AL) - (1 - Y) ./ (1 - AL));\n    elseif (strcmp(outputActivationFunc,\
  \ \"softmax\"))\n        dAL = 0;\n        Y = Y';\n    endif\n\n    # 由于这是二分类，输出层的激活函数是\
  \ sigmoid\n    # 获取最后一层的梯度\n    # 输入：\"AL, Y, caches\"。\n    # 输出：\"gradients[\"\
  dAL\"], gradients[\"dWL\"], gradients[\"dbL\"]\"\n    activation_cache = activation_caches{L};\n\
  \    forward_cache = forward_caches(L);\n\n    # 注意：元胞数组包含一个前向缓存数组。要访问它，我们需要包含索引\
  \ {1}\n    if (lambd == 0)\n        [dA, dW, db] = layerActivationBackward(dAL,\
  \ forward_cache{1}, activation_cache, Y, activationFunc = outputActivationFunc,\
  \ numClasses);\n    else\n        [dA, dW, db] = layerActivationBackwardWithReg(dAL,\
  \ forward_cache{1}, activation_cache, Y, lambd, activationFunc = outputActivationFunc,\
  \ numClasses);\n    endif\n\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n\
  \        gradsDA{L} = dA;\n    elseif (strcmp(outputActivationFunc, \"softmax\"\
  ))\n        gradsDA{L} = dA'; # 注意转置\n    endif\n\n    gradsDW{L} = dW;\n    gradsDB{L}\
  \ = db;\n\n    # 反向遍历\n    for l = (L-1):-1:1\n        # 计算 L-1 到 1 层的梯度（针对 Relu/tanh）\n\
  \        # 输入：\"gradients[\"dA\" + str(l + 2)], caches\"。\n        # 输出：\"gradients[\"\
  dA\" + str(l + 1)] , gradients[\"dW\" + str(l + 1)] , gradients[\"db\" + str(l +\
  \ 1)]\"\n        activation_cache = activation_caches{l};\n        forward_cache\
  \ = forward_caches(l);\n\n        # dA_prev_temp, dW_temp, db_temp = layerActivationBackward(gradients['dA'+str(l+1)],\
  \ current_cache, activationFunc = \"relu\")\n        # dAl 第 l 层激活值的导数，是第一个元素\n\
  \        dAl = gradsDA{l+1};\n\n        if (lambd == 0)\n            # 获取 dropout\
  \ 矩阵\n            D = dropoutMat{l};\n            # 乘以 dropout 矩阵\n            dAl\
  \ = dAl .* D;\n            # 除以 keep_prob 以保持期望值不变\n            dAl = dAl ./ keep_prob;\n\
  \n            [dA_prev_temp, dW_temp, db_temp] = layerActivationBackward(dAl, forward_cache{1},\
  \ activation_cache, Y, activationFunc = hiddenActivationFunc, numClasses);\n   \
  \     else\n            [dA_prev_temp, dW_temp, db_temp] = layerActivationBackwardWithReg(dAl,\
  \ forward_cache{1}, activation_cache, Y, lambd, activationFunc = hiddenActivationFunc,\
  \ numClasses);\n        endif\n\n        gradsDA{l} = dA_prev_temp;\n        gradsDW{l}\
  \ = dW_temp;\n        gradsDB{l} = db_temp;\n    endfor\nend\n```\n\n## 梯度下降更新参数\n\
  \n```matlab\nfunction [weights, biases] = gradientDescent(weights, biases, gradsW,\
  \ gradsB, learningRate, outputActivationFunc=\"sigmoid\")\n    L = size(weights)(2);\
  \ # 神经网络中的层数\n\n    # 每个参数的更新规则。\n    for l = 1:(L-1)\n        weights{l} = weights{l}\
  \ - learningRate * gradsW{l};\n        biases{l} = biases{l} - learningRate * gradsB{l};\n\
  \    endfor\n\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n        weights{L}\
  \ = weights{L} - learningRate * gradsW{L};\n        biases{L} = biases{L} - learningRate\
  \ * gradsB{L};\n    elseif (strcmp(outputActivationFunc, \"softmax\"))\n       \
  \ weights{L} = weights{L} - learningRate * gradsW{L}';\n        biases{L} = biases{L}\
  \ - learningRate * gradsB{L}';\n    endif\nend\n```\n\n## 带动量的梯度下降\n\n```matlab\n\
  function [weights, biases] = gradientDescentWithMomentum(weights, biases, gradsDW,\
  \ gradsDB, vdW, vdB, beta,\n```\n\n\n\n\n\n# 优化算法实现\n\n## Momentum 梯度下降\n\n```matlab\n\
  function [weights biases] = gradientDescentWithMomentum(weights, biases, gradsDW,\
  \ gradsDB, vdW, vdB, beta, learningRate, outputActivationFunc=\"sigmoid\")\n   \
  \ L = size(weights)(2); # 神经网络中的层数\n\n    # 每个参数的更新规则。\n    for l = 1:(L-1)\n  \
  \      # 计算速度\n        # v['dWk'] = beta * v['dWk'] + (1-beta) * dWk\n        vdW{l}\
  \ = beta * vdW{l} + (1 - beta) * gradsDW{l};\n        vdB{l} = beta * vdB{l} + (1\
  \ - beta) * gradsDB{l};\n\n        weights{l} = weights{l} - learningRate * vdW{l};\n\
  \        biases{l} = biases{l} - learningRate * vdB{l};\n    endfor\n\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        vdW{L} = beta * vdW{L} + (1 - beta) * gradsDW{L};\n   \
  \     vdB{L} = beta * vdB{L} + (1 - beta) * gradsDB{L};\n\n        weights{L} =\
  \ weights{L} - learningRate * vdW{L};\n        biases{L} = biases{L} - learningRate\
  \ * vdB{L};\n\n    elseif (strcmp(outputActivationFunc, \"softmax\"))\n        vdW{L}\
  \ = beta * vdW{L} + (1 - beta) * gradsDW{L}';\n        vdB{L} = beta * vdB{L} +\
  \ (1 - beta) * gradsDB{L}';\n\n        weights{L} = weights{L} - learningRate *\
  \ vdW{L};\n        biases{L} = biases{L} - learningRate * vdB{L};\n    endif\nend\n\
  ```\n\n## RMSProp 梯度下降\n\n```matlab\n# 使用 RMSProp 更新参数\n# 输入 : parameters - weights,\
  \ biases\n# : gradients - gradsDW, gradsDB\n# : s - sdW, sdB\n# : beta1\n# : epsilon\n\
  # : learningRate\n# : outputActivationFunc\n# 输出 : 更新后的 weights 和 biases RMSProp\n\
  \nfunction [weights biases] = gradientDescentWithRMSProp(weights, biases, gradsDW,\
  \ gradsDB, sdW, sdB, beta1, epsilon, learningRate, outputActivationFunc=\"sigmoid\"\
  )\n    L = size(weights)(2); # 神经网络中的层数\n\n    # 每个参数的更新规则。\n    for l = 1:(L-1)\n\
  \        sdW{l} = beta1 * sdW{l} + (1 - beta1) * gradsDW{l} .* gradsDW{l};\n   \
  \     sdB{l} = beta1 * sdB{l} + (1 - beta1) * gradsDB{l} .* gradsDB{l};\n      \
  \  weights{l} = weights{l} - learningRate * gradsDW{l} ./ sqrt(sdW{l} + epsilon);\n\
  \        biases{l} = biases{l} - learningRate * gradsDB{l} ./ sqrt(sdB{l} + epsilon);\n\
  \    endfor\n\n    if (strcmp(outputActivationFunc, \"sigmoid\"))\n        sdW{L}\
  \ = beta1 * sdW{L} + (1 - beta1) * gradsDW{L} .* gradsDW{L};\n        sdB{L} = beta1\
  \ * sdB{L} + (1 - beta1) * gradsDB{L} .* gradsDB{L};\n        weights{L} = weights{L}\
  \ - learningRate * gradsDW{L} ./ sqrt(sdW{L} + epsilon);\n        biases{L} = biases{L}\
  \ - learningRate * gradsDB{L} ./ sqrt(sdB{L} + epsilon);\n\n    elseif (strcmp(outputActivationFunc,\
  \ \"softmax\"))\n        sdW{L} = beta1 * sdW{L} + (1 - beta1) * gradsDW{L}' .*\
  \ gradsDW{L}';\n        sdB{L} = beta1 * sdB{L} + (1 - beta1) * gradsDB{L}' .* gradsDB{L}';\n\
  \        weights{L} = weights{L} - learningRate * gradsDW{L}' ./ sqrt(sdW{L} + epsilon);\n\
  \        biases{L} = biases{L} - learningRate * gradsDB{L}' ./ sqrt(sdB{L} + epsilon);\n\
  \    endif\nend\n```\n\n## Adam 梯度下降\n\n```matlab\n# 使用 Adam 更新参数\n# 输入 : parameters\
  \ - weights, biases\n# : gradients - gradsDW, gradsDB\n# : v - vdW, vdB\n# : s -\
  \ sdW, sdB\n# : t\n# : beta1\n# : beta2\n# : epsilon\n# : learningRate\n# : outputActivationFunc\n\
  # 输出 : 更新后的 weights 和 biases\n\nfunction [weights biases] = gradientDescentWithAdam(weights,\
  \ biases, gradsDW, gradsDB, vdW, vdB, sdW, sdB, t, beta1, beta2, epsilon, learningRate,\
  \ outputActivationFunc=\"sigmoid\")\n    vdW_corrected = {};\n    vdB_corrected\
  \ = {};\n    sdW_corrected = {};\n    sdB_corrected = {};\n\n    L = size(weights)(2);\
  \ # 神经网络中的层数\n\n    # 每个参数的更新规则。\n    for l = 1:(L-1)\n        vdW{l} = beta1 *\
  \ vdW{l} + (1 - beta1) * gradsDW{l};\n        vdB{l} = beta1 * vdB{l} + (1 - beta1)\
  \ * gradsDB{l};\n\n        # 计算一阶矩的偏差修正估计。\n        vdW_corrected{l} = vdW{l} /\
  \ (1 - beta1^t);\n        vdB_corrected{l} = vdB{l} / (1 - beta1^t);\n\n       \
  \ sdW{l} = beta2 * sdW{l} + (1 - beta2) * gradsDW{l} .* gradsDW{l};\n        sdB{l}\
  \ = beta2 * sdB{l} + (1 - beta2) * gradsDB{l} .* gradsDB{l};\n\n        # 计算二阶矩的偏差修正估计。\n\
  \        sdW_corrected{l} = sdW{l} / (1 - beta2^t);\n        sdB_corrected{l} =\
  \ sdB{l} / (1 - beta2^t);\n\n        # 更新参数。\n        d1 = sqrt(sdW_corrected{l}\
  \ + epsilon);\n        d2 = sqrt(sdB_corrected{l} + epsilon);\n        weights{l}\
  \ = weights{l} - learningRate * vdW_corrected{l} ./ d1;\n        biases{l} = biases{l}\
  \ - learningRate * vdB_corrected{l} ./ d2;\n    endfor\n\n    if (strcmp(outputActivationFunc,\
  \ \"sigmoid\"))\n        vdW{L} = beta1 * vdW{L} + (1 - beta1) * gradsDW{L};\n \
  \       vdB{L} = beta1 * vdB{L} + (1 - beta1) * gradsDB{L};\n\n        # 计算一阶矩的偏差修正估计。\n\
  \        vdW_corrected{L} = vdW{L} / (1 - beta1^t);\n        vdB_corrected{L} =\
  \ vdB{L} / (1 - beta1^t);\n\n        sdW{L} = beta2 * sdW{L} + (1 - beta2) * gradsDW{L}\
  \ .* gradsDW{L};\n        sdB{L} = beta2 * sdB{L} + (1 - beta2) * gradsDB{L} .*\
  \ gradsDB{L};\n\n        # 计算二阶矩的偏差修正估计。\n        sdW_corrected{L} = sdW{L} / (1\
  \ - beta2^t);\n        sdB_corrected{L} = sdB{L} / (1 - beta2^t);\n\n        # 更新参数。\n\
  \        d1 = sqrt(sdW_corrected{L} + epsilon);\n        d2 = sqrt(sdB_corrected{L}\
  \ + epsilon);\n        weights{L} = weights{L} - learningRate * vdW_corrected{L}\
  \ ./ d1;\n        biases{L} = biases{L} - learningRate * vdB_corrected{L} ./ d2;\n\
  \n    elseif (strcmp(outputActivationFunc, \"softmax\"))\n        vdW{L} = beta1\
  \ * vdW{L} + (1 - beta1) * gradsDW{L}';\n        vdB{L} = beta1 * vdB{L} + (1 -\
  \ beta1) * gradsDB{L}';\n\n        # 计算一阶矩的偏差修正估计。\n        vdW_corrected{L} = vdW{L}\
  \ / (1 - beta1^t);\n        vdB_corrected{L} = vdB{L} / (1 - beta1^t);\n\n     \
  \   sdW{L} = beta2 * sdW{L} + (1 - beta2) * gradsDW{L}' .* gradsDW{L}';\n      \
  \  sdB{L} = beta2 * sdB{L} + (1 - beta2) * gradsDB{L}' .* gradsDB{L}';\n\n     \
  \   # 计算二阶矩的偏差修正估计。\n        sdW_corrected{L} = sdW{L} / (1 - beta2^t);\n      \
  \  sdB_corrected{L} = sdB{L} / (1 - beta2^t);\n\n        # 更新参数。\n        d1 = sqrt(sdW_corrected{L}\
  \ + epsilon);\n        d2 = sqrt(sdB_corrected{L} + epsilon);\n        weights{L}\
  \ = weights{L} - learningRate * vdW_corrected{L} ./ d1;\n        biases{L} = biases{L}\
  \ - learningRate * vdB_corrected{L} ./ d2;\n    endif\nend\n```\n\n## L 层深度学习模型\n\
  \n```matlab\n# 执行 L 层深度学习模型\n# 输入 : X - 输入特征\n# : Y 输出\n# : layersDimensions - 层维度\n\
  # : hiddenActivationFunc - 隐藏层激活函数 relu / tanh\n# : outputActivationFunc - 输出层激活函数\
  \ sigmoid / softmax\n# : learning_rate\n# : lambd\n# : keep_prob\n# : num_iterations\n\
  # 输出 : 每次迭代后更新的 weights 和 biases\n\nfunction [weights biases costs] = L_Layer_DeepModel(X,\
  \ Y, layersDimensions, hiddenActivationFunc='relu', outputActivationFunc=\"sigmoid\"\
  , learning_rate = .3, lambd=0, keep_prob=1, num_iterations = 10000, initType=\"\
  default\") # lr was 0.009\n    rand(\"seed\", 1);\n    costs = [];\n\n    if (strcmp(initType,\
  \ \"He\"))\n        # He 初始化\n        [weights biases] = HeInitializeDeepModel(layersDimensions);\n\
  \    elseif (strcmp(initType, \"Xav\"))\n        # Xavier 初始化\n        [weights\
  \ biases] = XavInitializeDeepModel(layersDimensions);\n    else\n        # 默认初始化。\n\
  \        [weights biases] = initializeDeepModel(layersDimensions);\n    endif\n\n\
  \    # 循环 (梯度下降)\n    for i = 0:num_iterations\n        # 前向传播: [LINEAR -> RELU]*(L-1)\
  \ -> LINEAR -> SIGMOID。\n        [AL forward_caches activation_caches droputMat]\
  \ = forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc);\n\n        # 正则化参数为 0\n        if\
  \ (lambd == 0)\n            # 计算代价。\n            cost = computeCost(AL, Y, outputActivationFunc=outputActivationFunc,\
  \ numClasses=layersDimensions(size(layersDimensions)(2)));\n        else\n     \
  \       # 计算带正则化的代价\n            cost = computeCostWithReg(weights, AL, Y, lambd,\
  \ outputActivationFunc=outputActivationFunc, numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \        endif\n\n        # 反向传播。\n        [gradsDA gradsDW gradsDB] = backwardPropagationDeep(AL,\
  \ Y, activation_caches, forward_caches, droputMat, lambd, keep_prob, hiddenActivationFunc,\
  \ outputActivationFunc=outputActivationFunc, numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \n        # 更新参数。\n        [weights biases] = gradientDescent(weights, biases, gradsDW,\
  \ gradsDB, learning_rate, outputActivationFunc=outputActivationFunc);\n\n      \
  \  # 每 1000 次迭代打印一次代价\n        if (mod(i, 1000) == 0)\n            costs = [costs\
  \ cost];\n            # disp(\"Cost after iteration\"), L2RegularizationCost(i),\
  \ disp(cost);\n            printf(\"Cost after iteration i=%i cost=%d\\n\", i, cost);\n\
  \        endif\n    endfor\nend\n```\n\n## 随机梯度下降 L 层深度学习模型\n\n```matlab\n# 执行带随机梯度下降的\
  \ L 层深度学习模型\n# 输入 : X - 输入特征\n# : Y 输出\n# : layersDimensions - 层维度\n```\n\n\n\n\n\
  \n# 参数说明\n\n- `hiddenActivationFunc`：隐藏层激活函数 `relu` / `tanh` / `sigmoid`\n- `outputActivationFunc`：输出层激活函数\
  \ `sigmoid` / `softmax`\n- `learningRate`：学习率\n- `lrDecay`：学习率衰减开关\n- `decayRate`：衰减率\n\
  - `lambd`：正则化参数\n- `keep_prob`：Dropout 保留概率\n- `optimizer`：优化器\n- `beta`：动量参数\n\
  - `beta1`：Adam 一阶矩参数\n- `beta2`：Adam 二阶矩参数\n- `epsilon`：数值稳定常数\n- `mini_batch_size`：小批量大小\n\
  - `num_epochs`：训练轮数\n\n# 输出\n\n- `weights`、`biases`：每次迭代后更新的权重和偏置\n- `costs`：成本记录\n\
  \n# 主函数：`L_Layer_DeepModel_SGD`\n\n```matlab\nfunction [weights biases costs] =\
  \ L_Layer_DeepModel_SGD(X, Y, layersDimensions, ...\n    hiddenActivationFunc='relu',\
  \ outputActivationFunc=\"sigmoid\", ...\n    learningRate = .3, lrDecay=false, decayRate=1,\
  \ ...\n    lambd=0, keep_prob=1, optimizer=\"gd\", ...\n    beta=0.9, beta1=0.9,\
  \ beta2=0.999, epsilon=10^-8, ...\n    mini_batch_size = 64, num_epochs = 2500)\n\
  \ndisp(\"Values\");\nprintf(\"learningRate=%f \", learningRate);\nprintf(\"lrDecay=%d\
  \ \", lrDecay);\nprintf(\"decayRate=%f \", decayRate);\nprintf(\"lambd=%d \", lambd);\n\
  printf(\"keep_prob=%f \", keep_prob);\nprintf(\"optimizer=%s \", optimizer);\nprintf(\"\
  beta=%f \", beta);\nprintf(\"beta1=%f \", beta1);\nprintf(\"beta2=%f \", beta2);\n\
  printf(\"epsilon=%f \", epsilon);\nprintf(\"mini_batch_size=%d \", mini_batch_size);\n\
  printf(\"num_epochs=%d \", num_epochs);\n\nt = 0;\nrand(\"seed\", 1);\ncosts = [];\n\
  \n% 参数初始化。\n[weights biases] = initializeDeepModel(layersDimensions);\n\nif (strcmp(optimizer,\
  \ \"momentum\"))\n    [vdW vdB] = initializeVelocity(weights, biases);\nelseif (strcmp(optimizer,\
  \ \"rmsprop\"))\n    [sdW sdB] = initializeRMSProp(weights, biases);\nelseif (strcmp(optimizer,\
  \ \"adam\"))\n    [vdW vdB sdW sdB] = initializeAdam(weights, biases);\nendif\n\n\
  seed = 10;\n\n% 循环（梯度下降）\nfor i = 0:num_epochs\n    seed = seed + 1;\n    [mini_batches_X\
  \ mini_batches_Y] = random_mini_batches(X, Y, mini_batch_size, seed);\n    minibatches\
  \ = length(mini_batches_X);\n\n    for batch = 1:minibatches\n        X = mini_batches_X{batch};\n\
  \        Y = mini_batches_Y{batch};\n\n        % 前向传播：[LINEAR -> RELU]*(L-1) ->\
  \ LINEAR -> SIGMOID/SOFTMAX。\n        [AL forward_caches activation_caches droputMat]\
  \ = ...\n            forwardPropagationDeep(X, weights, biases, keep_prob, hiddenActivationFunc,\
  \ ...\n            outputActivationFunc=outputActivationFunc);\n\n        if (lambd\
  \ == 0)\n            % 计算成本。\n            cost = computeCost(AL, Y, ...\n      \
  \          outputActivationFunc=outputActivationFunc, ...\n                numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \        else\n            % 计算带正则化的成本\n            cost = computeCostWithReg(weights,\
  \ AL, Y, lambd, ...\n                outputActivationFunc=outputActivationFunc,\
  \ ...\n                numClasses=layersDimensions(size(layersDimensions)(2)));\n\
  \        endif\n\n        % 反向传播。\n        [gradsDA gradsDW gradsDB] = backwardPropagationDeep(AL,\
  \ Y, ...\n            activation_caches, forward_caches, droputMat, lambd, keep_prob,\
  \ ...\n            hiddenActivationFunc, outputActivationFunc=outputActivationFunc,\
