  \ <- c('x1', 'x2', 'q2')\n  \n  z1 <- data.frame(z)\n  names(z1) <- c(\"x1\", \"\
  x2\", \"y\")\n  \n  atitle <- paste(\"Decision boundary for hidden layer size:\"\
  , sz, \"learning rate:\", lr)\n  \n  ggplot(z1) +\n    geom_point(data = z1, aes(x\
  \ = x1, y = x2, color = y)) +\n    stat_contour(data = grid2, aes(x = x1, y = x2,\
  \ z = q2, color=q2), alpha = 0.9) +\n    ggtitle(atitle)\n}\n```\n\n### 绘制决策边界 (使用\
  \ ggplot2 和 stat_contour)\n\n```r\nplotBoundary <- function(z, nn) {\n  xmin <-\
  \ min(z[,1])\n  xmax <- max(z[,1])\n  ymin <- min(z[,2])\n  ymax <- max(z[,2])\n\
  \  \n  a <- seq(xmin, xmax, length=100)\n  b <- seq(ymin, ymax, length=100)\n  \n\
  \  grid <- expand.grid(x=a, y=b)\n  colnames(grid) <- c('x1', 'x2')\n  \n  grid1\
  \ <- t(grid)\n  q <- predict(nn$nnParameter, grid1)\n  q1 <- t(data.frame(q))\n\
  \  q2 <- as.numeric(q1)\n  \n  grid2 <- cbind(grid, q2)\n  colnames(grid2) <- c('x1',\
  \ 'x2', 'q2')\n  \n  z1 <- data.frame(z)\n  names(z1) <- c(\"x1\", \"x2\", \"y\"\
  )\n  \n  data.plot <- ggplot() +\n    geom_point(data = z1, aes(x = x1, y = x2,\
  \ color = y)) +\n    coord_fixed() +\n    xlab('x1') +\n    ylab('x2')\n  \n  print(data.plot)\n\
  \  data.plot + stat_contour(data = grid2, aes(x = x1, y = x2, z = q2), alpha = 0.9)\n\
