- "# 深度学习第一性原理（第2版）：基于向量化的 Python、R 和 Octave 实现\n\n\n\n![Image 1](img/index-1_1.jpg)\n\
  \n\n\n\n\n\n\n## 前言\n\n> *除非你用不止一种方式学习，否则你什么都不懂。* —— Marvin Minsky\n\n过去十余年来，深度学习领域取得了显著进展。这一\
  \ AI 领域已衍生出许多分支——深度置信网络、循环神经网络、卷积神经网络、对抗网络、强化学习、胶囊网络，列表还在不断延长。得益于硬件、存储和云技术的进步，这些年来深度学习也从研究实验室走向了寻常百姓家。\n\
  \n听取深度学习权威人士的观点时，一个共同的主题是：要想很好地掌握深度学习领域，必须学会从零开始构建此类网络。本书正是为此目的而写。\n\n在本书中，我从基础开始实现深度学习网络。每一章都建立在前几章实现的基础之上，因此到第\
  \ 7 章时，我已构建出一个功能齐全、通用的 L 层深度学习网络，包含所有“铃声和哨子”（即各种完善功能）。实现多层深度学习网络所需的所有必要推导均包含在各章节中。书中详细推导了采用\
  \ `relu`、`tanh` 和 `sigmoid` 隐藏层单元，以及 `sigmoid` 和 `softmax` 输出激活单元的前向传播和反向传播循环。这些内容有助于唤醒那些本科微积分知识生疏读者的记忆。\n\
  \n第一章在 Python、R 和 Octave 中推导并实现了作为神经网络的逻辑回归。第二章处理最原始神经网络——仅含一个隐藏层的网络——的推导与实现。第三章延伸第二章的原则，用向量化的\
  \ Python、R 和 Octave 实现了采用 `sigmoid` 激活函数的 L 层深度学习网络。该实现可包含任意数量的隐藏单元和任意数量的隐藏层，用于\
  \ `sigmoid` 激活输出层。第四章介绍了多类分类所需的 `Softmax` 函数。书中推导了 `Softmax` 的雅可比矩阵和交叉熵损失，并将其实现以演示简单螺旋数据集的多类分类。\n\
  \n第五章将第四章的 `softmax` 实现融入第三章的 L 层实现中。借此增强，第五章使用通用的 L 层实现中的 `Softmax` 输出激活单元对 MNIST\
  \ 数字进行分类。\n\n第六章探讨了 He 初始化和 Xavier 初始化等不同的初始化技术。此外，本章还讨论并实现了 L2 正则化和随机 Dropout 技术。第七章考察了学习率衰减、动量法、`rmsprop`\
  \ 和 `adam` 等梯度下降优化技术。第八章讨论了一项确保反向传播实现正确性的关键技术。具体而言，本章讨论并实现了`梯度检验`，并演示了如何查找实现中的 Bug。\n\
  \n所有章节均包含 Python、R 和 Octave 的向量化实现。这些实现是一致的。因此，如果你精通其中任一语言，便可参考其他语言的实现。这应当是学习其他语言的好途径。\n\
  \n**注意**：各章节中调用的函数均包含在附录 1–附录 8 中。\n\n欢迎通过调整超参数来试验这些实现。一个好的学习方法是拆解代码。你也可以尝试增强实现，加入其他激活函数，如\
  \ leaky `relu`、参数化 `relu` 等。也许你可以研究其他正则化或梯度下降优化方法。也可能有机会通过进一步向量化函数来优化我的代码。\n\n本书主要基于\
  \ Andrew Ng 教授的深度学习[专项课程](https://www.coursera.org/specializations/deep-learning)。\n\
  \n我要感谢 Andrew Ng 教授和 Geoffrey Hinton 教授，正是他们通过课程将深度学习这门看似复杂的学科化繁为简，呈现出清晰明了的概念。\n\
  \n希望本书能开启你一段激动人心且充满挑战的深度学习之旅。\n\nTinniam V Ganesh\n\n2018 年 5 月 16 日\n\n## 简介\n\n\
  这是拙作《从零开始深度学习：第二版——基于向量化的 Python、R 和 Octave 实现》的第二版。\n\n鉴于本书约 70% 的内容为代码，我希望让代码更具可读性。因此，在第二版中，我将所有代码字体更改为等宽字体\
  \ Lucida Console。这使代码结构更清晰，更易于理解。我还为所有函数和代码片段添加了行号。最后，我修正了书中的部分错别字。\n\n### 作者其他著作（亚马逊有平装版和\
  \ Kindle 版）\n\n1. **《R 和 Python 实战机器学习：第二版》**——立体式机器学习\n2. **《败给纯粹速度：第三版》**——基于\
  \ yorkr 的板球分析\n3. **《基于 cricketr 的板球分析：第三版》**\n\n## 1. 作为神经网络的逻辑回归\n\n> *\"你看到的不是事物本来的样子，而是你自己的样子。\"\
  *\n>\n> *\"你对物理对象的解读，关乎你大脑的历史轨迹——而与对象本身关系不大。\"*\n>\n> *\"大脑在接收来自眼睛和其他感官的信息之前，就已生成自己的现实。这被称为内部模型。\"\
  *\n>\n> —— David Eagleman，《大脑：你的故事》\n\n\n\n\n\n# 逻辑回归作为两层神经网络\n\n本章探讨将逻辑回归实现为两层神经网络，即仅包含输入层和输出层、没有隐藏层的神经网络。该两层网络分别用\
  \ Python、R 和 Octave 语言实现。之所以加入 Octave，是因为它是 Matlab 的近亲。\n\n这些 Python、R 和 Octave\
  \ 实现是等价的向量化实现。因此，如果你熟悉其中任一语言，就能看懂另外两种语言对应的代码。本章调用的函数实现见附录 1 —— 作为神经网络的逻辑回归。\n\n\
  你也可以从 Github 的 `DeepLearningFromFirstPrinciples` 仓库克隆/下载 Python、R 和 Octave 的向量化代码\
  \ (https://github.com/tvganesh/DeepLearningFromFirstPrinciples/tree/master/Chap1-LogisticRegressionAsNeuralNetwork)。首先，使用\
  \ `sklearn` 的逻辑回归包对 `sklearn` 的癌症数据集执行逻辑回归。如下所示。\n\n## 1. 逻辑回归\n\n```python\nimport\
  \ numpy as np\nimport pandas as pd\nimport os\nimport matplotlib.pyplot as plt\n\
  from sklearn.model_selection import train_test_split\nfrom sklearn.linear_model\
  \ import LogisticRegression\nfrom sklearn.datasets import make_classification, make_blobs\n\
  from sklearn.metrics import confusion_matrix\nfrom matplotlib.colors import ListedColormap\n\
  from sklearn.datasets import load_breast_cancer\n\n# Load the cancer data\n(X_cancer,\
  \ y_cancer) = load_breast_cancer(return_X_y=True)\nX_train, X_test, y_train, y_test\
  \ = train_test_split(X_cancer, y_cancer, random_state=0)\n\n# Call the Logistic\
  \ Regression function\nclf = LogisticRegression().fit(X_train, y_train)\n\n# Print\
  \ accuracy of training and test set\nprint('Accuracy of Logistic regression classifier\
  \ on training set: {:.2f}'.format(clf.score(X_train, y_train)))\nprint('Accuracy\
  \ of Logistic regression classifier on test set: {:.2f}'.format(clf.score(X_test,\
  \ y_test)))\n```\n\n## 逻辑回归分类器在训练集上的准确率: 0.96\n## 逻辑回归分类器在测试集上的准确率: 0.96\n\n![Image\
  \ 2](img/index-15_1.jpg)\n![Image 3](img/index-15_2.jpg)\n\n## 2. 逻辑回归作为两层神经网络\n\
  \n在下一节中，逻辑回归将在 Python、R 和 Octave 中实现为两层神经网络。来自 `sklearn` 的相同癌症数据集被用于在 Python、R 和\
  \ Octave 中训练和测试神经网络。这可以用下图表示。\n\n癌症数据集有 30 个输入特征，目标变量“output”为 0 或 1。因此，输出层将使用 Sigmoid\
  \ 激活函数进行分类。\n\n这个简单的两层神经网络如下所示。\n\n在输入层，有 30 个特征及其对应的权重，这些权重被初始化为较小的随机值。\n\n其中“b”为偏置项。\n\
