- fmt: "\n# How to import and initialize libraries\n\nLibraries are simply a bundle\
    \ of multiple modules that is made available to the Python program in the device.\
    \ These packages are usually stored within the same folder that Python is installed\
    \ in, which by default for is:\n- For Windows users: `C:/Python27/Lib/site-packages/`\n\
    - For Linux users: `/usr/lib/python/site-packages`\n\nLibraries are not immediately\
    \ useable even if they are already in the proper folder, as they must first be\
    \ initialized using the syntax as follows: `library_name/__init__.py` or `library_name/module_name.py`.\
    \ \n\nOnce the library has been initialized, the modules inside can then be imported\
    \ through the process discussed in the previous section, through: `import module_name`.\n\
    \nOnce the libraries have been imported and initialized, we can check as to whether\
    \ they have been properly installed by typing the following in your Python IDE:\n\
    \n```python\n# Checking the versions of each of the libraries\n# This shows the\
    \ Python version installed on the machine\nimport sys\nprint(\"Python: {}\".format(sys.version))\n\
    # This shows the scipy version installed on the machine\nimport scipy\nprint(\"\
    scipy: {}\".format(scipy.__version__))\n# This shows the numpy version installed\
    \ on the machine\nimport numpy\nprint(\"numpy: {}\".format(numpy.__version__))\n\
    # This shows the matplotlib version installed on the machine\nimport matplotlib\n\
    print(\"matplotlib: {}\".format(matplotlib.__version__))\n# This shows the pandasversion\
    \ installed on the machine\nimport pandas\nprint(\"pandas: {}\".format(pandas.__version__))\n\
    # This shows the scikit – learn version installed on the machine\nimport sklearn\n\
    print(\"sklearn: {}\".format(sklearn.__version__))\n```\n\nIf the libraries have\
    \ been installed properly, the output should look something like the following\
    \ lines:\n```\nPython: 3.6.0\nscipy: 1.1.0\nnumpy: 1.14.5\nmatplotlib: 2.2.2\n\
    pandas: 0.23.2\nsklearn: 0.19.2\n```\n\nAt this point, this means that the proper\
    \ libraries have been installed. Do not worry if your library versions do not\
    \ exactly match the ones seen here, as the API does not tend to change drastically,\
    \ and the code that we will discuss shortly is still most likely applicable even\
