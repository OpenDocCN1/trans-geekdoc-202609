    names.append( name ) msg = "%s: %f (%f)" % (name, cv\_results. mean(), cv\_results.
    std()) print( msg ) The previous lines of code build the model and run them using
    our designed ten – fold cross validation test harness. They run the data set through
    each model, and print out the resulting accuracy numbers along with the label.
    Running the said code should result in an output giving the results of each particular
    data model: L D A: 0. 975000 (0. 038188) L R: 0. 966667 (0. 040825) C A R T: 0.
    975000 (0. 038188) N B: 0. 975000 (0. 053359) S V M: 0. 981667 (0. 025000) K N
    N: 0. 983333 (0. 033333) Here we see that the K – Nearest Neighbors has the highest
    accuracy score in our particular test run, at ninety – eight - point three percent
    estimated accuracy. Note however that because of the seed of the pseudo – random
    number generator, there is a chance that the results may differ when you run this
    code, in case the seed is different. We can also create a plot of the test results
    for each algorithm, as the algorithm tested each data model ten times thanks to
    our test harness method. The code to do so is as follows: \# The following lines
    of code compare Algorithms tres= plt.figure() tres.suptitle("Comparing Algorithms")
    ax = tres.add\_subplot(111) plt.boxplot(results) ax.set\_xticklabels(names) plt.show()
    This creates and displays a bar graph with the X axis labeled as the type of test
    and the Y axis labeled as the percent accuracy of each test. For those that want
