    from sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import\
    \ DecisionTreeClassifier\nfrom sklearn.neighbors import KNeighborsClassifier\n\
    from sklearn.discriminant_analysis import LinearDiscriminantAnalysis\nfrom sklearn.naive_bayes\
    \ import GaussianNB\nfrom sklearn.svm import SV\n```\n\nThe preceding lines of\
    \ code allow us to bring over code that allows us to categorize the various flowers\
    \ through the various classifiers, as well as allows us to display our data on\
    \ a matrix and imports various regression functions in order to simplify our task,\
