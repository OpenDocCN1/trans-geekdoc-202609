    # Unsupervised Learning

    In unsupervised learning, the algorithm is made to parse through totally unlabeled
    sets of data in order to train itself. This means that there is a higher possibility
    for errors as to compared to the supervised learning method earlier discussed.
    Unsupervised learning is generally used more for clustering data and values and
    sees the most use in statistical analysis where there is a need for density estimation
    functions. Unsupervised learning is more weighted to finding out probabilities
    of outcomes, such as the probability of `Y` for any particular `X` value, and
    this is why statisticians are the ones that make the most use of this particular
    machine learning task. However, when it comes to more conventional requirements
    such as training a program to recognize or predict particular outcomes given a
    set condition, it would most likely be more effective to make use of a supervised
    learning method rather than the unsupervised counterpart.


    # Machine Learning Applications

    Learning deals with managing possible future input: while requiring, for the most
    part, input – output pairs, the machine learning process is there to teach the
    program what to do with future input. When it comes to machine learning applications,
    this is where the output of the machine learning program is addressed. There are
    multiple application types, too many to discuss here, thanks to the versatility
    and flexibility machine learning offers to users. However, there are a few major
    types, the following which we will discuss here.


    ## Classification

    In data science, more specifically in the fields of statistics and machine learning,
    classification is a type of problem where a particular observation, or data point,
    is placed into a category where it belongs, on the basis of similar characteristics,
    which in this case is based on the training set fed to the program, which contains
    instances or observations which the program can identify the membership of the
    said data points. One common example of a classification output in action would
    be an electronic mail spam filter, which classifies our electronic mail into one
    of two categories: "spam" (unwanted e – mail), and non – spam (legitimate e –
    mail messages). A more advanced type of classification in machine learning is
    how some new programs are trying to provide diagnostic services, and they provide
    diagnoses based on recorded symptoms of the patient as well as certain factors
    such as age, sex, and race, which allows the program to better predict the likely
    diagnosis. Classification is mainly a type of pattern recognition, and is usually
    created through a supervised learning method, where the algorithm is taught using
    a set of data points where properly identified and categorized learning is already
    available. Classifiers are algorithms that implements the classification method,
    but the term "classifier" is also used in order to refer to a mathematical function
    that directs and categorizes input data into a certain category, but for the purposes
    of this guide, classifiers are classification method algorithms. Classifiers are
    usually created by splitting data points into certain variables, which may have
    various properties, such as categorical properties of blood types "A -", "O +",
    "AB +"), ordinal (tall, regular, short), or even integer – valued (such as for
    spam filters which count for the number of occurrences of particular words). Some
    other classifiers are built using comparative observation, which have a function
    that compares distance or similarity between the two.


    ## Clustering

    Much like classification, clustering involves grouping together particular data
    points or observations based on a list of characteristics that would make them
    belong in the same category. However, clustering tends to be of a broader scope,
    and less clear – cut as compared to how classification decides to segment its
    categories. Clustering, or cluster analysis is mostly used by statisticians and
    data scientists, especially when it comes to solving problems of information retrieval,
    data compression, or density estimation functions. As was briefly explained earlier,
    the clustering function is usually created through an unsupervised machine learning
    algorithm, as compared to classification functions created through supervised
    learning. This is because clustering does not emphasize specificity as much and
    works more to gather similar objects together rather than individually define
    each object into a specific class.


    ## Density Estimation

    In what is basically a sub – type of clustering, the density estimation output
    method is an estimate built based on various observations, of an underlying probability
    density function, which is often unobservable. This function usually takes random
    samples from a population, and using the random sample, the unobservable density
    function that is to be estimated tends to be the density distribution of the larger
    population.


    ## Dimensionality Reduction

    Dimensionality reduction is a type of output that tries to reduce the complexity
    of objects and simplifies the input by mapping them into a lower – dimensional
    space, which eventually allows the user to simplify the objects and allow them
    to undergo feature selection or extraction, which is the process of identifying
    the most relevant attributes, or "features", in order to be better able to build
    a model. This is useful especially since there tends to be a problem in the increase
    of available dimensions and as such, sparser relevant data when objects are placed
    in high – dimensional space, so dimensionality reduction is often a necessary
    factor to making objects more accessible and useable.


    ## Regression Analysis

    Regression, a word that many people hear and immediately fear due to its complexity,
    is a statistical process that people use in order to estimate and define relationships
    between and among various variables. Regression as a whole refers to multiple
    techniques that allow us to model the relationship between a dependent variable
    and one or multiple independent variables, known as predictors. Regression analysis
    is very useful for helping us understand how the criterion variable, or the dependent
    variable as it is commonly known, is affected and changes whenever some independent
    variable changes, while the other independent variables, if any, remain fixed.
    Regression analysis is also used to help estimate the conditional expectation
    of the criterion variable given the predictors, so we know what the criterion
    variable''s value the predictors will be once they are fixed. However, there are
    also those that use regression analysis to focus on some location parameters of
    the dependent variable''s distribution in relation to the independent variables.
    Notably, due to the characteristics of regression analysis, where the data points
    fluctuate depending on what is being controlled for, the outputs tend to be in
    a continuous form rather than in a discrete form, matching the changes in real
    – time.

