    already functions as the "training set" for the K – N N machine learning algorithm,
    though no additional explicit training is needed due to the peculiar nature of
    the K – N N algorithm in its'' sensitivity to the locality of the data. If we
    dissect the K – N N method and attempt to implement it into python, it would only
    look like a fairly short snippet of code, which is fitting due to the simplicity
    of the K N N classification method as compared to other data modeling methods:
    def train(X\_train, y\_train): return Remember that the training method of K N
    N is unnecessary, so the train function does literally nothing in this case. The
    major component that we have to write is the prediction function, which computes
    the distance between the object and its neighbors in the "training" set, selects
    the K amount that is closest, performs a vote from the majority, and once this
    is done, assigns a class to the object. def predict(X\_train, y\_train, x\_test,
    k): \# The following lines create the requisite lists distances = \[\] neighbors=
    \[\] for i in range(len(X\_train)): \# The following line computes the euclidean
    distance distance = np.sqrt(np.sum(np.square(x\_test - X\_train\[i, :\]))) \#
    We now add it to the list containing the various distances distances.append(\[distance,
    i\]) \# Now we sort the list from least to greatest distances distances = sorted(distances)
    \# We can now make a list of the targets if k neighbors for i in range(k): index
    = distances\[i\]\[1\] neighbors.append(y\_train\[index\]) \# The following line
    conducts the "vote", I.e returns the most common object k distance away return
    Counter(targets).most\_common(1)\[0\]\[0\] That previous code searched for all
    the objects k distance away from the initial defined object, stored it in the
    neighbors array, and returned the class of object that was most common. Now that
    we have the code that allows us to find the nearest k neighbor, the following
    code allows us to loop every example and make the proper prediction. def kNearestNeighbor
    (X\_train, y\_train, X\_test, predictions, k): \# trains on the input train(X\_train,
    y\_train) \# The following for loop allows the function to run through all the
    objects for i in range( len( X\_test)): predictions. append( predict (X\_train,
    y\_train, X\_test\[i, :\], k)) Now that we have our code, we can now run it alongside
    the optimal K value from the cross – validation method earlier: \# declaring the
    predictions list predictions = \[\] kNearestNeighbor(X\_train, y\_train, X\_test,
    predictions, 7) \# converting the predictions into array data type predictions
    = np. asarray( predictions ) \# Calculating the accuracy of our algorithm accuracy
    = accuracy\_score (y\_test, predictions) print(''\\n Our K - Nearest Neighbors
    algorithm has %d%%'' % accuracy\*100) Classification and Regression Trees Classification
    and regression trees are another fairly simple method of machine learning. The
    main structure of a classification and regression tree, or C A R T for short is
    the binary tree. From the beginning point, the root node x represents an input,
    and from there the tree splits into two paths containing the output variable y
    that results in a prediction. For example, if we have x being 100 kilograms as
    the root node input, and the leaf nodes are if x is greater or equal to 100, then
    it is "heavy", and if x is less than 100, it is "light", y will take on the value
    of "heavy", as x is indeed greater than or equal to 100. If we see this in code,
    it would look like: If x>= 100: Y = "heavy" Else Y = "light" This is a simplistic
    portrayal of a binary tree, but the classification and regression trees simply
    use that branching principle over and over again until the amount of features
    and attributes of the object have been iterated through and the model is capable
    of assigning it to a proper classification. Note that Classification and Regression
    Trees make heavy uses of indexes, so here''s a quick refresher on indexes and
    sorting through them: Indexing for loops (len() function) Indexing is a convenient
    way of parsing through the range much faster. If you imagine the range of a loop
    to be a bunch of boxes stacked on top of each other, you would need to pull out
    all the boxes one by one before reaching the bottom. Indexing provides a way to
    pull out the bottom box, or any box in the sequence as the programmer chooses.
    In order to index a variable, we need to take note of the len() function. This
    len() function allows the programmer to parse a sequence and assign a value to
    it, the value being the number of elements contained within the sequence. For
    example, len(hello) would have a value of 5 due to hello having five characters.
    Now that we have a function that allows us to call length, we simply remember
    our previous lesson in terms of arrays. Each sequence is in fact an array, or
    a "list", and thus we can access the list starting at various points through the
    sequence\[\]. Since we have the word length, such as "hello" having five, we can
    access the third letter easily by calling word\[2\] (remember that the index begins
    at 0), which should call the third element of the word "hello", which is the letter
    l. The following code is a sample of a decision tree classifier using the "gini"
    index: clf\_gini = CRTClassifier(criterion = "gini", random\_state = 100, max\_depth
    = 3, min\_samples\_leaf = 5) clf\_gini.fit (X\_train , y\_train) In addition to
    this, we can include the code of the output in order to see the result using the
    gini tree criterion: CRTClassifier(class\_weight = None, criterion="gini", max\_depth
    = 3, max\_features = None, max\_leaf\_nodes = None, min\_samples\_leaf = 5, min\_samples\_split
    = 2, min\_weight\_fraction\_leaf = 0. 0, presort = False, random\_state = 100,
    splitter = ''best'') Accessing the Gini Index function looks like as follows:
    \# Calculating the Gini index for a split dataset def gini\_index( groups, classes):
    \# count all samples at split point n\_instances = float(sum(\[len(group) for
    group in groups\])) \# Getting the sum of the weighted Gini index for each class
    gini = 0.0 for group in groups: size = float(len (group)) \# avoid divide by zero
    if size == 0: continue score = 0.0 \# Scoring the class based on the score for
    each group for class\_val in classes: p = \[row\[-1\] for row in group\].count(class\_val)
    / size score += p \* p \# Weighting the group score by the relative size gini
    += (1.0 - score) \* (size / n\_ instances) return gini '
