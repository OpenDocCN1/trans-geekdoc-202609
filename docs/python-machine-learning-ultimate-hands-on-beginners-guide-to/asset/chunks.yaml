- fmt: "\n# Creating Data Models\n\nAt this point, we already know how to examine\
    \ our data, manipulate it, and display it either in raw data form, summaries,\
    \ or in graph form. Now we have to create an algorithm to be fully able to create\
    \ a model. In this section, we will be setting aside a validation data set, creating\
    \ a test harness to use a method called the ten–fold cross validation, build five\
    \ different models to test the accuracy of each one, then select a model.\n\n\
    ## Creating a Validation Data Set\n\nAs we know by now, machine learning needs\
    \ to \"learn\" from data points in order to calibrate itself. However, as we have\
    \ a limited data set, the data set of the iris flowers, we will be setting aside\
    \ a few of these data points, which will not go into the algorithm, as we will\
    \ use these data points to test the effectivity and accuracy of our algorithms.\
    \ In order to train our algorithm, we will be splitting the data set 80 percent\
    \ to 20 percent, where eighty percent is our training set, and twenty percent\
    \ is our validation set, meaning that we have a hundred and twenty data points\
    \ to train the algorithm, and the last thirty will be used to see whether or not\
    \ our algorithm has been properly calibrated to give accurate predictions. The\
    \ following code will be used in order to segregate the various data points that\
    \ we need.\n\n```\narray = dataset.values\nX = array[:,0:4]\nY = array[:,4]\n\
    validation_size = 0.20\nseed = 9\nX_train, X_validation, Y_train, Y_validation\
    \ = model_selection.train_test_split(X, Y, test_size=validation_size, random_state=seed)\n\
    ```\n\nThe previous code should now create four separate arrays, where `X_train`\
    \ and `Y_train` are the arrays containing the data points we will use to train\
    \ the algorithm, and the `X_validation` and `Y_validation` are what we will use\
    \ in order to test our calibration.\n\n## Creating a Test Harness\n\nNow that\
    \ we have partitioned our data set into a testing group and a validation group,\
    \ we need to set up a testing method for accuracy. Here we will be making use\
    \ of the ten–fold cross validation to train and test our algorithm, which means\
    \ that it will partition by every ten data points, and train nine points and test\
    \ on the tenth, and repeat this method for all combinations of train–test splits\
    \ that the program will be carrying out. This can be initialized by using the\
    \ following lines of code:\n\n```\nseed = 9\nscoring = \"accuracy\"\n```\n\nThe\
    \ value of the `seed` does not really matter, as this is just a seed for a pseudo–random\
    \ number generator. The `scoring` method is the accuracy of the algorithm, which\
    \ is measured by the ratio of correctly predicted observations over the number\
    \ of total possible observations, multiplied by one hundred in order to result\
    \ in a percentage format. This scoring variable will be used to evaluate each\
    \ model that we will be building.\n\n### Pseudo-random Number Generators\n\nRandom\
    \ numbers are useful for many reasons, as this allows the programmer to better\
    \ replicate the randomness of the real world. However, computers cannot truly\
    \ generate randomness, as they are designed to be precise and iterate rationally.\
    \ As such, there is a pseudo–random number generator that produces a series of\
    \ \"random\" numbers based on the initial \"seed\" used. While these numbers may\
    \ look random, it is important to note that as long as the seed used is the same,\
    \ the same set of numbers will come out. If the seed is not set, then the numbers\
    \ that will come out.\n\n## Building Models\n\nNow we come to the actual part.\
    \ We will test six different models to see which one performs the best. The models\
    \ we will test are:\n- Logistic Regression (`LR`)\n- Discriminant Analysis (`LDA`)\n\
    - K-Nearest Neighbors (`KNN`)\n- Classification Trees (`CART`)\n- Naive Bayes\
    \ (`NB`)\n- Support Machines (`SVM`)\n\nThe following code uses each model in\
    \ turn to check the results:\n\n```\nmodels = []\nmodels.append(('LR', LogisticRegression()))\n\
    models.append(('LDA', LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
    models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
    models.append(('SVM', SVC()))\n\nresults = []\nnames = []\nfor name, model in\
    \ models:\n    kfold = model_selection.KFold(n_splits=10, random_state=seed)\n\
    \    cv_results = model_selection.cross_val_score(model, X_train, Y_train, cv=kfold,\
    \ scoring=scoring)\n    results.append(cv_results)\n    names.append(name)\n```\n\
    \nThe previous lines of code build the model and run them using our designed ten–fold\
    \ cross validation. They run the data set through each model, and print out the\
    \ resulting numbers along with the label:\n\n```\nmsg = \"%s: %f (%f)\" % (name,\
    \ cv_results.mean(), cv_results.std())\nprint(msg)\n```\n\nThe output should look\
    \ like the following:\n- `LDA`: 0.975000 (0.038188)\n- `LR`: 0.966667 (0.040825)\n\
    - `CART`: 0.975000 (0.038188)\n- `NB`: 0.975000 (0.053359)\n- `SVM`: 0.981667\
    \ (0.025000)\n- `KNN`: 0.983333 (0.033333)\n\nHere we see that the `KNN` (K-Nearest\
    \ Neighbors) has the highest accuracy score in our particular test run, at ninety-eight-point\
    \ percent estimated accuracy. Note however that because of the seed of the pseudo–random\
    \ number generator, there is a chance that the results may differ when you run\
    \ this code, in case the seed is different.\n\nWe can also create a plot of the\
    \ test results for each algorithm, as the algorithm tested each data model ten\
    \ times thanks to our test harness method. The code to do so is as follows:\n\n\
    ```python\ntres= plt.figure()\ntres.suptitle(\"Comparing Algorithms\")\nax = tres.add_subplot(111)\n\
    plt.boxplot(results)\nax.set_xticklabels(names)\nplt.show()\n```\n\nThis creates\
    \ and displays a bar graph with the X axis labeled as the type of test and the\
    \ Y axis labeled as the percent accuracy of each test.\n"
