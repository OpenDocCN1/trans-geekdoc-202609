    # Simple Linear Algorithms


    Linear algorithms are used by mathematicians and data scientists in order to create
    mathematical models that attempt to find the most optimal outcome. For this reason,
    linear programming is also known as mathematical optimization. However, it is
    necessary that the requirements are in linear form, meaning that they can be expressed
    in a 2 – dimensional form. It is for this reason that this type of algorithm is
    widely used in planning, routing, and scheduling problems, and is often used by
    engineers in the transport and power sector, as well as economists. In fact, it
    has its roots in mathematicians trying to solve transport and expenditure problems
    during wartime, with Dantzig being one of the most famous examples of those that
    used this in order to benefit their military, in this case the United States Air
    Force right after the Second World War. As mentioned earlier, two of the more
    commonly used data models, Linear Regression and Linear Discriminant Analysis
    are types of Simple Linear Algorithms.


    ## Linear Regression


    Linear regression is a type of linear algorithm, a linear approach that is often
    used to model the relationship between a dependent variable (a variable that has
    a scalar response) and one or more independent variables (also referred to as
    explanatory variables). Depending on whether or not there is only one or multiple
    independent variables, linear regression can be called simple or multiple linear
    regression. However, both these types are different from what is called the multi
    – variate linear regression, as this deals with multiple dependent variables (scalar
    response variables) and the previous two only deal with a singular scalar response
    variable.


    For linear regression algorithms, these relationships are modeled through various
    predictor functions, where the parameters are unknown, but they are extrapolated
    from the data, where the machine learning aspect comes in. These models are called
    linear models. Linear regression focuses mainly on the probability distribution
    of the response of the scalar variable given how the predictor variables (the
    independent variables) value changes, as opposed to other mathematical models
    that try to map the joint probability distribution of all the variables involved.
    Linear regression analysis is one of the most popular types of regression analysis,
    due to the fact that models that have a linear dependency on their unknowns are
    easier to work with as compared to models whose parameters are related to each
    other in a non – linear fashion. In addition, the linear nature allows for easier
    determination of the various statistical attributes of the estimators.


    Linear regression is most commonly used for two general categories. The first
    is prediction: forecasting and error minimization problems tend to have a linear
    regression solution, as a linear regression analysis is helpful in creating a
    predictive model if the user has an established set of observations when it comes
    to the dependent and independent variables, and linear regression can be used
    to extrapolate from there. Once a model has been created, more examples of explanatory
    variables can be collected, and even without an observed reponse value, the model
    should be able to create a reasonable prediction of the value of the response.
    The second major use of linear regression is to explain variation in response
    variables, where such variation can be attributed to the variation in the values
    of the independent variables, allowing the user to quantify the strength of the
    link, or the relationship between the dependent and independent variables, and
    even determine whether or not they are related at all, or if some independent
    variables have a redundant function.


    The following sample code format shows how a linear regression algorithm skeleton
    would go:


    ```python

    #Import other necessary libraries, such as the NumPy Stack

    from sklearn import linear_model

    # Train and Test datasets

    #Identify attributes and dependent variable ( s ) and values must be numerical
    and numpy arrays

    x_train=input_variables_values_training_datasets

    y_train=target_variables_values_training_datasets

    x_test=input_variables_values_test_datasets

    # Creating linear - regression object

    linear = linear_model.LinearRegression()

    # Calibrating the regression model using the assigned training sets and checking
    the score

    linear.fit(x_train, y_train)

    linear.score(x_train, y_train)

    #Checking the equation''s co - efficient and Intercept

    print("The Co – efficient is: \n", linear.coef_)

    print("The Intercept is: \n", linear.intercept_)

    #Predict Output

    predicted= linear.predict(x_test)

    ```


    ## Linear Discriminant Analysis


    Linear discriminant analysis is a common type of statistical analysis similar
    to the famous Fisher''s linear discriminant, which allows the user to find a linear
    amalgamation of attributes that can be used to define multiple classes of objects
    and / or events. The combination from this can be used as a classifier, or even
    used to reduce the dimensionality of an object for further classification later
    on. In fact, Linear discriminant analysis is similar to the ANOVA test (analysis
    of variance) and linear regression analysis, in that all of these types of tests
    try to express the response (dependent) variable as a combination of various attributes.


    However, discriminant analysis uses continuous explanatory (independent) variables
    and a categorical response variable, while ANOVA has categorical explanatory variables
    and a continuous response variable. In this, regression is similar to linear discriminant
    analysis. Linear discriminant analysis looks for linear combinations of the various
    observations which gives a best –fit explanation of the said data. However, unlike
    a similar method known as principal component analysis, linear discriminant analysis
    actively attempts to create a model of the difference of the various classes of
    data. Linear discriminant analysis is best use when the explanatory variables
    are continuous quantities, and where the groups are already known beforehand,
    unlike in cluster analysis when groups are to be determined by the algorithm.
    Discriminant analysis is best used in classification functions, when there is
    a need to distribute objects into classes or categories, assigning them depending
    on their characteristics.


    A Linear Discriminant Analysis Machine Learning algorithm would look like the
    following:


    ```python

    #Import Library

    from sklearn.linear_model import LogisticRegression

    x_train=input_variables_values_training_datasets

    y_train=target_variables_values_training_datasets

    x_test=input_variables_values_test_datasets

    # Creating the object of the logistic regression model

    model = LogisticRegression()

    # Calibrating the regression model using the assigned training sets and checking
    the score

    model.fit(X, y)

    model.score(X, y)

    #Predict Output

    predicted= model.predict(x_test)

    ```

