  trans: "\n\n# 示例神经网络代码\n\n现在我们已经了解了张量的通用背景，让我们来看一个使用 TensorFlow 的简单神经网络代码示例。\n\n\
    ```python\n1) import tensorflow as tf # 导入 tensorflow 库\n2) T, F = 2.0, -2.0 #\
    \ True 的值为 + 2.0，False 的值为 - 2.0。值得注意的是，任何值都可以赋值给 true 或 false，只要它们是不同的\n3) bias\
    \ = 1.0\n4) training_input = [\n    [T, T, bias],\n    [T, F, bias],\n    [F,\
    \ T, bias],\n    [F, F, bias],\n]\n5) \n6) training_output = [\n    [T],\n   \
    \ [F],\n    [F],\n    [F],\n]\n7) \n8) w = tf.Variable (tf.random_normal([3, 1]),\
    \ dtype=tf.float32) # step(x) = { 1 if x > 0; -1 otherwise }\n9) def step(x):\n\
    10)     is_greater = tf.greater(x, 0)\n11)     as_float = tf.to_float(is_greater)\n\
    12)     doubled = tf.multiply(as_float, 2)\n13)     return tf.subtract(doubled,\
    \ 1)\n14) output = step(tf.matmul(training_input, w))\n15) error = tf.subtract(training_output,\
    \ output)\n16) mse = tf.reduce_mean(tf.square(error))\n17) delta = tf.matmul(training_input,\
    \ error, transpose_a = True)\n18) train = tf.assign(w, tf.add(w, delta))\n19)\
    \ sess = tf.Session()\n20) sess.run(tf.global_variables_initializer())\n21) err,\
    \ target = 1, 0\n22) epoch, max_epochs = 0, 10\n23) while err > target and epoch\
    \ < max_epochs:\n24)     epoch += 1\n25)     err, _ = sess.run([mse, train])\n\
    26) print('epoch:', epoch, 'mse:', err)\n27) print(sess.run(w))\n```\n\n### 代码解释\n\
    \n*   **第 1 行**：这一行导入了 `tensorflow` 库，它让我们能够访问神经网络函数，并允许以更高效的方式使用和操作张量。\n*   **第\
    \ 2 行**：此行用于给 `true` 和 `false` 赋值，但在这种情况下我们分配了正 2 和负 2，仅仅是为了反其道而之。说实话，只要它们是不同的，任何值都足够。\n\
    *   **第 3 行**：`bias`（偏置）倾向于由程序员选择的常数，通常为 1 或 -1，神经网络将决定应该乘以哪个常数，以获得需要近似的正确函数。请注意，`bias`\
    \ 通常用于在绘图时将图表向特定方向平移，以便于后续处理。由于 `bias` 在神经网络的所有操作过程中保持不变，它不会改变计算结果或值，但它允许与图形化表示的值进行更简单、更方便的交互。\n\
    *   **第 4 到第 5 行**：这些行是输入数据，将作为神经网络的训练集。包含了 `true` 和 `false` 组合的所有可能值：`True –\
    \ True`、`True – False`、`False – True` 和 `False – False`，以及作为额外偏置项的 `b`。\n*   **第\
    \ 6 到第 7 行**：这些行代表训练集的输出数据，结果分别为 `True`、`False`、`False` 和 `False`。神经网络应该能够检查第\
    \ 4、5 行声明的训练输入值，并检查第 6、7 行的训练输出，因此应该能够近似我们想要创建的 `'AND'` 函数。\n*   **第 8 行**：我们训练集的输入(`x`)\
    \ 和输出(`y`) 数据在整个程序运行期间将保持不变，因此神经网络必须通过估计权重（变量为 `\"w\"`）来近似函数。在这种情况下，`3 x 1` 是因为我们有三个输入值对应一个输出值，因此\
    \ `w` 在训练循环期间不断调整权重以找到正确的值，这就是为什么它被声明为一个变量。使用的变量初始化为正态分布随机数，因此使用了 `tf.random_normal`\
    \ 模块。这一行就是神经网络经常被称为方程 `\"y = Wx\"` 的原因。\n*   **第 9 到第 13 行**：这段代码定义了我们正在使用的模型。它从\
    \ `step` 函数开始，阶跃激活函数对于二分类方法是必要的。这意味着如果需要将输入模式分类为两组中的一组，就可以创建一个带有阶跃激活函数的二分类器来以简化问题。然而，当神经网络变得更深、更复杂时，`step`\
    \ 函数开始失去它的用处，其他激活函数在这些地方变得更有用，例如命名奇幻的 `sigmoid`、`tanh`、`relu` 和 `leakyrelu` 函数，这些都是非线性激活函数。然而，我们当前的\
    \ `step` 函数仅在参数大于 0 时返回值 1，否则返回 -1，这就是为什么赋值给 true 或 false 的值大部分无关。\n*   **第 14\
    \ 到 16 行**：在我们创建 `step` 函数后，我们在这几行中创建了 `output`、`error` 和 `mse`。`error` 函数计算预测值与训练集已知值之间的差异。均方误差（mse）也得到了计算，以检查偏差，并作为估计器的二阶矩，包含了方差（样本之间的距离）和偏差（估计值与真实值之间的距离）。\n\
    *   **第 17 到第 18 行**：权重函数的评估允许我们调整预定义变量的内容，使其成为数值。所需的调整（`delta`）是基于之前几行计算并定义的误差，并被加到权重中以微调算法。\n\
    *   **第 19 到第 20 行**：我们刚刚创建的模型由第 1 行之前实例化的 `sess`（会话）进行评估。注意，这是在任何变量初始化之前发生的。此外，`sess.run`\
    \ 函数允许我们与 TensorFlow 的 C++ 后端集成，让我们能够用 Python 编写代码，但让某些功能在 C++ 中执行，C++ 作为低级语言通常运行速度更快。\n\
    *   **第 21 到 27 行**：现在模型已经完成并由 TensorFlow 会话评估，可以通过 `epoch` 运行，它将通过每次评估 `train`\
    \ 函数自动调整权重。由于我们使用的是真/假输入/输出（即二进制），在某处将出现完美的结果，均方误差值为 0，由于程序的简单性，这将执行得非常快。`sess.run`\
    \ 的返回是连续的，并将返回最近评估的值。每个 `epoch` 还会评估 `mse` 函数以跟踪训练轮次的进度，`train` 函数会根据需要调整权重。\n\
    \n"
