- fmt: "\n# Sample Neural Network Code\n\nNow that we know the general background\
    \ of tensors, let's see an example of a simple neural network code using TensorFlow.\n\
    \n```python\n1) import tensorflow as tf # importing the tensorflow library\n2)\
    \ T, F = 2.0, -2.0 #True has the + 2.0 value and False has - 2.0, notably, any\
    \ value can be assigned to true or false, as long as they are distinct\n3) bias\
    \ = 1.0\n4) training_input = [\n    [T, T, bias],\n    [T, F, bias],\n    [F,\
    \ T, bias],\n    [F, F, bias],\n]\n5) \n6) training_output = [\n    [T],\n   \
    \ [F],\n    [F],\n    [F],\n]\n7) \n8) w = tf.Variable (tf.random_normal([3, 1]),\
    \ dtype=tf.float32) # step(x) = { 1 if x > 0; -1 otherwise }\n9) def step(x):\n\
    10)     is_greater = tf.greater(x, 0)\n11)     as_float = tf.to_float(is_greater)\n\
    12)     doubled = tf.multiply(as_float, 2)\n13)     return tf.subtract(doubled,\
    \ 1)\n14) output = step(tf.matmul(training_input, w))\n15) error = tf.subtract(training_output,\
    \ output)\n16) mse = tf.reduce_mean(tf.square(error))\n17) delta = tf.matmul(training_input,\
    \ error, transpose_a = True)\n18) train = tf.assign(w, tf.add(w, delta))\n19)\
    \ sess = tf.Session()\n20) sess.run(tf.global_variables_initializer())\n21) err,\
    \ target = 1, 0\n22) epoch, max_epochs = 0, 10\n23) while err > target and epoch\
    \ < max_epochs:\n24)     epoch += 1\n25)     err, _ = sess.run([mse, train])\n\
    26) print('epoch:', epoch, 'mse:', err)\n27) print(sess.run(w))\n```\n\n### Code\
    \ Explanation\n\n*   **Line 1**: This line imports the `tensorflow` library that\
    \ gives us access to neural network functions and allows us to make use and operate\
    \ with tensors in a more efficient manner.\n*   **Line 2**: This line is used\
    \ to assign values to `true` and `false`, but in this case we assigned positive\
    \ two and negative two, just to buck the trend. Truth be told, any value will\
    \ suffice, provided that they are distinct.\n*   **Line 3**: `bias` tends to be\
    \ a constant chosen by the programmer, usually just one or negative one, and the\
    \ neural network decides what constant it should be multiplied by in order to\
    \ get the proper function that needs to be approximated. Note that `bias` is usually\
    \ used in order to shift the graph a certain way once it is plotted, in order\
    \ to make it easier to work with. Since the `bias` will remain constant throughout\
    \ the operations in the neural network, it does not change the computation or\
    \ the value, but it allows for easier and more convenient interaction with the\
    \ graphically represented values.\n*   **Line 4 to 5**: These lines are the input\
    \ data that will serve as the training set for the neural network. All the possible\
    \ values of the `true` and `false` combinations are there, `True – True`, `True\
    \ – False`, `False – True`, and `False – False`, along with `b` as an added bias\
    \ term.\n*   **Line 6 to 7**: These lines represent the output data of the training\
    \ set, which results in `True`, `False`, `False`, and `False`, respectively. The\
    \ neural network should be able to examine the training input values declared\
    \ in lines four and five, and examine the training output from lines 6 and 7,\
    \ and as such should be able to approximate the function `'AND'` that we want\
    \ to create.\n*   **Line 8**: The data of the input(`x`) and the output(`y`) of\
    \ our training set will remain constant all throughout our program, so the neural\
    \ network has to approximate the function by estimating the weight, which has\
    \ a variable of `\"w`. In this scenario, `3 x 1` because we have three input values\
    \ corresponding to a single output value, so `w` will constantly adjust the weight\
    \ during the training loops in order to find the proper value, which is why it\
    \ has been declared as a variable. The variables used were initialized to normal\
    \ – distribution random numbers, hence the `tf.random_normal` module usage. This\
    \ line is the reason why neural networks are often referred to as the equation\
    \ `\"y = Wx\"`.\n*   **Line 9 – 13**: This segment of code defines the model that\
    \ we are using. This starts with the `step` function, and step activation functions\
    \ are needed for binary classification methods. This means that if ever it is\
    \ necessary for an input pattern to be categorized into one of two groups, a binary\
    \ classifier with a step activation function can be made of to make things simpler.\
    \ However, when the neural network becomes deeper and more complex, the `step`\
    \ function begins to lose its usefulness, and other activation functions become\
    \ more useful in its place, such as the fancifully named `sigmoid`, `tanh`, `relu`,\
    \ and `leakyrelu` functions, which are non – linear activation functions. However,\
    \ our current `step` function simply returns a value of 1 if the parameter is\
    \ greater than 0, and returns –1 if not, which is the reason why the values we\
    \ assign to true or false are mostly irrelevant.\n*   **Line 14 – 16**: After\
    \ our `step` function has been created, we create the `output`, `error`, and the\
    \ `mse` in these few lines. The `error` function computes how off the predictions\
    \ are from the known values of the training set. The mean squared error is also\
    \ calculated in order to check the deviation of the error, and acts as the second\
    \ moment, containing both the variance (distance between data samples) and bias\
    \ (distance between estimated value and the true value) of the estimator.\n* \
    \  **Line 17 – 18**: The evaluation of the weight functions allows us to adjust\
    \ the content of our pre – defined variables, making it a more number. The desired\
    \ adjustment, or `delta`, was based on the error as computed and defined a few\
    \ lines earlier, and this gets added to the weight in order to fine – tune the\
    \ algorithm.\n*   **Line 19 – 20**: The model that we just created is evaluated\
    \ by the `sess` that was instantiated before the rest of the code, in line 1.\
    \ Note that this happened even before any initializing of variables happened.\
    \ In addition, the `sess.run` function allows us to integrate with the C++ backend\
    \ of `Tensorflow`, allowing us to write this code in Python but have some functions\
    \ carried out in C++, which as a lower level language tends to have faster run\
    \ times.\n*   **Line 21 – 27**: Now that the model has been completed and evaluated\
    \ by the tensorflow session, it can be run through `epoch`, which will automatically\
    \ adjust the weights every time by evaluating the `train` function. As we are\
    \ using a true / false input / output, which is binary, at some point a perfect\
    \ result will occur with a mean squared error value of 0, and due to the simple\
    \ nature of the program, this will execute very quickly. The `sess.run` return\
    \ is continuous, and will return whatever was the latest evaluated value. Each\
    \ `epoch` also evaluates the `mse` function in order to track the progress of\
    \ the training epochs, and the `train` function adjusts the weights as needed.\n"
