    \ Y = \"heavy\"\nElse:\n    Y = \"light\"\n```\n\nThis is a simplistic portrayal\
    \ of a binary tree, but the classification and regression trees simply use that\
    \ branching principle over and over again until the amount of features and attributes\
    \ of the object have been iterated through and the model is capable of assigning\
