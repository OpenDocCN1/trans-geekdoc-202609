    \ support in order to give a better idea of how well the test was run. This should\
    \ look like the following:\n\n```\n      I 0.9 \n[[  7  0  0]\n a  s [ 0 11  \
    \ 1]\n I [ 0    2    9]] \n\nprecision    recall      f1 - score   support\nIris\
    \ - setosa       1.00          1.00          1.00         7\nIris - versicolor\
    \   0.85          0.92          0.88       12\nIris - virginica    0.90      \
    \    0.82          0.86       11\nAverage / total    0.90          0.90      \
    \    0.90       30 \n```\n\n# Conclusion\n\nNow the reader has a working code\
    \ that allows them to use basic machine learning processes. The reader should\
    \ be able to use the previous code in order to create software that can parse\
    \ through data and predict with reasonable accuracy certain results based on the\
    \ correlation between various attributes. The next few chapters will be dealing\
    \ with the concepts that were introduced in the sample code, in order to better\
    \ assist the reader in progressing and learning and developing their own code\
