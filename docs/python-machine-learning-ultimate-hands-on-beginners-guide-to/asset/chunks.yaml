    \ pull out all the boxes one by one before reaching the bottom. Indexing provides\
    \ a way to pull out the bottom box, or any box in the sequence as the programmer\
    \ chooses. In order to index a variable, we need to take note of the `len()` function.\
    \ This `len()` function allows the programmer to parse a sequence and assign a\
    \ value to it, the value being the number of elements contained within the sequence.\
    \ For example, `len(\"hello\")` would have a value of 5 due to hello having five\
    \ characters. Now that we have a function that allows to call length, we simply\
    \ remember our previous lesson in terms of arrays. Each sequence is in fact an\
    \ array, or a \"list\", and thus we can access the list starting at various points\
    \ through the sequence. Since we have the word length, such as \"hello\" having\
    \ five, we can access the third letter easily by calling `word[2]` (remember that\
    \ the index begins at 0), which should call the third element of the word \"hello\"\
    , which is the letter l. The following code is a sample of a decision tree using\
    \ the \"gini\" index:\n\n```python\nclf_gini = CRTClassifier(criterion = \"gini\"\
    , random_state = 100, max_depth = 3, min_samples_leaf = 5)\nclf_gini.fit(X_train,\
    \ y_train)\n```\n\nIn addition to this, we can include the code of the output\
    \ in order to see the result using the gini tree criterion:\n\n```python\nCRTClassifier(class_weight=None,\
