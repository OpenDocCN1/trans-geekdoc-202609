    # 无监督学习

    在无监督学习中，算法被用于解析完全未标记的数据集以进行自我训练。这意味着与之前讨论的监督学习方法相比，出错的可能性更高。无监督学习通常更多用于数据和值的聚类，并在需要密度估计函数的统计分析中得到最广泛的应用。无监督学习侧重于发现结果的概率，例如对于任何特定的
    `X` 值，`Y` 的概率，这就是为什么统计学家是最常使用这一特定机器学习任务的人。然而，当涉及到更常规的需求时，例如训练程序在给定一组条件时识别或预测特定结果，使用监督学习方法可能比使用无监督学习的对应方法更有效。


    # 机器学习应用

    学习涉及管理可能的未来输入：虽然在大多数情况下需要输入-输出对，但机器学习的过程是为了教程序如何处理未来输入。当涉及到机器学习应用时，这就是机器学习程序的输出所处理的地方。得益于机器学习为用户提供的多功能性和灵活性，存在多种应用类型，在此处无法详尽。然而，有几种主要类型，我们将在在此讨论以下类型。


    ## 分类

    在数据科学中，特别是在统计学和机器学习领域，分类是这样一种问题：特定的观测值或数据点根据相似的特征被归入其所属的类别，在这种情况下，分类是基于输入给程序的训练集，该训练集包含了程序可以识别此类数据点成员身份的实例或观测值。分类输出的一个常见示例是电子邮件垃圾过滤器，它将我们的电子邮件归分为两类之一：“垃圾邮件”（不想要的电子邮件）和“非垃圾邮件”（法的电子邮件消息）。机器学习中更高级的分类类型是某些新程序尝试提供诊断服务，它们根据患者记录的症状以及年龄、性别和种族等某些因素提供诊断，这使得程序能够更好地预测可能的诊断结果。分类主要是一种模式识别类型，通常通过监督学习方法创建，其中算法使用一组已经过正确识别和分类学习结果的数据点进行教导。分类器是实现分类方法的算法，但“分类器”一词也用于指代将输入数据引导并归类到特定类别的数学函数，但对于本指南而言，分类器是指分类方法算法。分类器通常通过将数据点拆分为某些变量来创建，这些变量可能具有各种属性，例如血型的分类属性（“A
    -”、“O +”、“AB +”）、序数属性（高、中、矮），甚至是整数值属性（例如用于垃圾过滤器的特定单词出现次数计数）。其他一些分类器是使用比较观察构建的，它们具有一种比较两者之间距离或相似性的函数。


    ## 聚类

    与分类类似，聚类涉及根据一组使它们属于同一类别的特征列表将特定的数据点或观测值分组在一起。然而，聚类的范围通常更广，且与分类决定如何分割其类别的方式相比，其那么清晰。聚类（或聚类分析）主要被统计学家和数据科学家使用，特别是在解决信息检索、数据压缩或密度估计函数问题时。正如之前简要解释的那样，聚类函数通常通过无监督机器学习算法创建，而分类函数则通过监督学习创建。这是因为聚类没有那么强调特殊性，其工作方式更多是于将相似的对象聚集在一起，而不是单独地将每个对象定义到特定的类中。


    ## 密度估计

    在本质上是聚类的一个类型中，密度估计输出方法是基于对底层概率密度函数的各种观测而建立的估计值，而该函数通常是不可观测的。该函数通常从总体中提取随机样本，并使用随机样本对待估计的不可观测密度函数进行估计，其往往是总体的密度分布。


    ## 降维

    降维是一种输出类型，它通过将对象映射到低维空间来降低对象的性并简化输入，最终允许用户简化对象并进行特征选择或提取，即识别最相关属性（“特征”）的过程，以便更好地构建模型。这特别有用，因为当对象放置在高维空间时，由于可用维度的增加会导致相关数据变得稀疏，因此降维通常是使对象更易访问和使用的必要因素。


    ## 回归分析

    回归是一个由于其复杂性让许多人一听就害怕的词，它是人们用来估计和定义各种变量之间关系的统计过程。回归整体指的是多种允许我们对因变量与一个或多个自变量（称为预测变量）之间的关系的技术。回归分析对于帮助我们理解当某个自变量变化时，标准变量（通常称为因变量）是如何受到影响并发生变化的，而其他自变量（如果有）保持不变。回归分析还用于帮助估计给定预测变量的标准变量的条件期望，让我们知道一旦预测变量固定，标准变量的值将是多少。然而，也有人使用回归分析关注因变量相对于自变量分布的某些位置参数。值得注意的是，由于回归分析的特征（即数据点会根据控制变量而波动），其输出倾向于连续形式而非离散形式，以匹配实时变化。


    '
- fmt: '

    # Machine Learning in Python


    Now that we have a basic overview of what machine learning is, and what it can
    be capable of, now we move back into Python, and how we can integrate the two.
    At this point, your `Python` should be set up, and you should already have a basic
    mastery of creating Python code and algorithms, and you should be used to the
    development environment by now, so we can move on to more advanced concepts such
    as these. However, as machine learning is not built – in for Python, unlike many
    of the functions that beginning programmers tend to use, we need to import a few
    libraries in order to give our Python the capability to run machine learning algorithms.
    `Python` is a high – level programming language that was initially developed by
    a programmer by the name of `Guido van Rossum`, and the first publicly available
    version was released in the year 1991. `Python` is commonly used for teaching
    programming to beginners due to its ease of use and simplicity, but due to the
    power of the language, it also functions well in higher – level uses, as it scales
    well and can be used for larger programs. This scaling includes the capability
    to run machine learning functions when certain libraries are imported. There are
    a few libraries that we can make use of, but here we will focus on two major libraries:
    `Scikit – learn` and `TensorFlow`.


    ## Scikit – learn


    `Scikit – learn` is one of the more popular freeware machine learning libraries
    for `Python` and was initially developed in the year 2007 by a programmer known
    as `David Cornapeau`, who was later joined by one `Mattheiu Brucher`, and thanks
    to the involvement of the French Institute for Research in Computer Science and
    Automation, `scikit – learn` was eventually made available for public download
    and use in early 2010. `Scikit – learn` derives its name from the intent of the
    software package, which is to be able to enhance the capabilities of a user who
    is using the `SciPy` toolkit, the scientific library of `Python`, as well as the
    numerical library, `NumPy`. Thus, `scikit – learn` is a module meant for extending
    the `Python` library when it comes to adding various functions and methods for
    classification, regression, and clustering, being a "SciPy toolkit". As mentioned,
    `Scikit – learn` contains classification, clustering, and regression algorithms
    that make use of `gradient boosting`, `random forests`, `support vector machines`,
    `k – means`, and `DBSCAN`, which allows the user a far more expanded range of
    capability for their `Python` usage.


    ## TensorFlow


    `TensorFlow` is a google – created software library initially created for proprietary
    use, but eventually released for public download and use under an open – source
    license in 2015. `TensorFlow` focuses mainly on data – flow programming and is
    a symbolic math library that is used for machine learning that makes use of neural
    network functions. `TensorFlow` is a more advanced programming library that we
    will discuss in more detail as this guide goes along, but for now, we will begin
    with a basic introduction to machine learning functions in `Python`.


    ## What Version of Python to Use?


    By now, the reader should have a familiarity with `Python`, and should already
    have `Python` installed on their machine. For the purposes of this guide, the
    user should be running a modern version of `Python`, `Python 3.5`, but this guide
    is also applicable for users of `Python 2.7`. If by some chance the reader does
    not have `Python` yet, this is how they can install the base version of `Python`:


    ### Installing Python on the Windows Platform


    In order to get `Python` to run on Windows, download an installer from the official
    `Python` website, `www.python.org` or from a mirror website. Once this has been
    downloaded, the `msi` file should run and the default configuration should suffice.


    ### Installing Python on other Platforms


    In order to get `Python` to run on other platforms, the user will have to go to
    the official `Python` website, `www.python.org`, and find the version compatible
    with the hardware the wishes. Some hardware platforms, such as the Raspberry Pi,
    have `Python` automatically installed in their operating systems. Once the user
    has found the file, all that should be done is to download and install it, and
    the default configuration should suffice. However, if the reader wishes, another
    Python application than the base `Python` is available and may be more useful
    to the reader, as this variant, known as `Anaconda`, already has the libraries.


    ### Installing Anaconda on the Windows Platform


    In order to install `Anaconda` on Windows, simply access the site at the following
    link: `https://www.anaconda.com/download/`, and choose which version of `Python`
