    # TensorFlow

    The previous codes and data types were all carried out mainly through the use
    of `scikit – learn`, but what about TensorFlow? TensorFlow is a google – created
    software library initially created for proprietary use, but eventually released
    for public download and use under an open – source license in 2015. TensorFlow
    focuses mainly on data – flow programming and is a symbolic math library that
    is used for machine learning that makes use of neural network functions. Though
    TensorFlow can also be used much like `scikit – learn`, as it also contains numerical
    and scientific functions, its main advantage is in its capability in creating
    neural networks. However, before we can move to that, we first have to learn what
    a tensor is.


    # Tensors

    A tensor is, reduced to its simplest form, a multidimensional data array. So TensorFlow
    is literally named after the flow of tensors, or the continuous flow of operations
    on multidimensional data arrays which neural networks perform. That bit of trivia
    aside, let''s dig a little deeper into the subject of tensors. What one has to
    remember is that computations by neural networks are done on data flow graphs,
    where nodes represent mathematical formulae and operations being carried out by
    the machine, and the edges are the multi – dimensional operators, or tensors that
    contain all the relevant data. Before we go even deeper, however, it is important
    to review a few concepts in linear algebra and vector calculus, as these are keys
    to understanding tensors and why they are so crucial to neural networks.


    ## Plane Vectors

    When a person hears the word vector, they may think of the physics meaning, a
    quantity that has both a magnitude and a direction. However, in data and computer
    science, vectors are referring to something a bit different in concept. While
    similar, the programmer sees a vector as a type of matrix, an ordered collection
    of numbers but with only one column, though it may have multiple rows. In this
    case, if the data is plotted out, it looks one dimensional. In a way, one can
    still imagine these vectors as a scalar value that was given direction, fulfilling
    its definition as we know it from basic physics. However, mathematical vectors
    have a strange characteristic in while their value / magnitude remains fixed and
    absolute, their direction is totally relative based on a given point of reference.


    Now what about plane vectors? Plane vectors are what one may consider the simplest
    type of tensor, and they have much the same characteristics as the standard vector.
    However, plane vectors are found in vector space, a collection of other vectors
    that can interact with each other through mathematical operations. For example,
    we have a `2 x 1` vector. This means that the vector has a pairing of two real
    numbers, a part of two – dimensional space. This leads us to the conventional
    ray vector on the `(x , y)` plane, and we can plot it easily. In a two – dimensional
    space, understanding this vector is easy due to the fact that we are used to working
    with the cartesian coordinate system, and we can simply assign an origin with
    coordinates `(0, 0)` to determine the direction of our created vector. The X coordinate
    is found on the first value of the vector, and the Y coordinate is found on the
    second row value. However, as vectors grow larger, it becomes more complicated.
    Take for example a vector of size `3 x 1`, which can now be visualized as being
    on an `(x , y , z)` coordinate plane, or three – dimensional space. This time
    we can create a three - dimensional figure where we can assign values to the positions
    they hold in the vector space, representing them on the coordinate plane. It gets
    more and more complicated to visualize, however, as the amount of dimensions of
    the vector go up, and this is where the curse of dimensionality begins to kick
    in as explained in an earlier chapter.


    However, one has to remember that the entire point in having a vector is allowing
    one to perform mathematical operations on them. One convenient way of carrying
    out operations is simply expressing vectors as base vectors or unit vectors, simplifying
    the process. Unit vectors are vectors that only have a value of one. These are
    usually denoted by lower case letters with circumflexes, affectionately nicknamed
    "hats". These unit vectors are convenient especially when attempting to express
    a two – dimensional or three – dimensional vector as a sum of multiple orthogonal
    components, such as the x –, y- , and z- axes. Note as well that vectors themselves
    are the sum of their component vectors, and they can be expressed as such if the
    need arises.


    ## Tensor Representation

    Returning to tensors as a whole, in addition to plane vectors, co – vectors and
    linear operators are also certain specialized types of tensors. Remember that
    a vector is a scalar value that has been assigned a single direction. A tensor
    is something that is considered to be the mathematical representation of a physical
    object that has a magnitude and more than one direction, which while difficult
    to fathom, is a concept that is integral to understanding how all this works.


    Scalars are represented by a single number, the magnitude. Vectors are represented
    with a sequence of numbers, corresponding to the dimensions they exist in, such
    as two – dimensional vectors having two assigned values, and three – dimensional
    vectors having three assigned values. Tensors, however, are represented by an
    array of `3R` numbers in three – dimensional space. In this case, the `"R"` in
    `3R` represents the rank of the tensor. For example, a second – rank tensor is
    represented by `3` raised to two, or nine numbers. So to put it mathematically,
    scalars will always only require one number in an `N` – dimensional space, vectors
    will be defined by `N` values in `N` – dimensional space, and tensors will be
    defined by `N^R` values in `N` – dimensional space. This makes scalar values be
    considered as tensors, as they are rank 0 tensors, as anything raised to the 0th
    power results in 1. Scalars are represented by a number, vectors can be represented
    by a set of number, and tensors are represented by an array of numbers.


    How is this important, however? Tensors are special because of how component vectors
    and basis vectors combine. Basis vectors transform between reference frames, but
    the component vectors transform along with them in such a manner as to keep their
    combination the same and maintain a consistent value.

