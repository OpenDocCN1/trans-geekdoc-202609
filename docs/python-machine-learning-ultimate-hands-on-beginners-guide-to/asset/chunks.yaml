  trans: "\n\n# 非线性算法\n\n非线性算法是指任何处理目标函数非线性且问题约束空间不是多面体的算法类型。这些函数包括凹函数、凸函数和二次函数，与标准的线性单纯形法相比，必须使用不同的方法进行求解。这些非线性问题通常是优化问题，即在存在一组未知变量的情况下求解目标函数的极值。\n\
    \n# 支持向量机\n\n支持向量机是机器学习中最流行的模型之一，也称为支持向量网络。这些支持向量机属于监督学习模型，使用学习算法来检查用于分类和标准回归分析的数据。这些模型的工作原理是取一组校准数据点（每个数据点被标记为属于某一个或另一个类别），支持向量机模型接收新样本并根据其特征将其分配给给定的两个类别之一，使得支持向量机算法成为一种非概率二分类线性分类器。支持向量机可以想象为将数据点表示为空间中的点，不同类别之间存在清晰的间隙。支持向量机接收到的任何新数据点都被放置在该空间中，并根据其特征预测它们将被放在间隙的哪侧。除了用于线性分类外，支持向量机还能通过所谓的“核技巧”执行非线性分类，该技巧隐式地将输入置于高维空间。支持向量机也可以无监督学习方法工作，因为无监督学习试图寻找自然簇，任何接收到的新数据都会映射到这些簇中。这种向量聚类算法是标准支持向量机功能的扩展，允许它们利用未标记数据，它由\
    \ Vladimir Vapnik 和 Hava Siegelmann 开发，并已成为工业应用和设置中最流行的聚类算法之一。\n\n支持向量机算法的示例下所示：\n\
    \n```python\nimport numpy as np\nX = np.array([[-2,5,-2], [3,5,-1], [4, 8, -2],\
    \ [2, 4, -1], [6, 5, -1]])\ny = np.array([-1,-1, 1, 1, 1])\ndef svm_sgd(X, Y):\n\
    \    w = np.zeros(len(X[0]))\n    esa = 1\n    era = 100000\n    for era in range(1,epochs):\n\
    \        for i, x in enumerate(X):\n            if (Y[i]*np.dot(X[i], w)) < 1:\n\
    \                w = w + esa * ((X[i] * Y[i]) + (-2*(1 / era)* w))\n         \
    \   else:\n                w = w + esa * (- 2 * (1 / era)* w)\n    return w\n\
    w = svm_sgd(X,y)\nprint(w)\n```\n\n`X` 和 `Y` 数组包含要分类的对象，算法设置为运行 1000000 次，学习参数设置为\
    \ 1，正则化参数为 `1 / era`，因此它随着 `era` 变量的缓慢增加而减小。\n\n# 高斯朴贝叶斯\n\n高斯朴贝叶斯模型基于概率分类器的模型，它们在观察输入后返回其可能属于的一组类别的概率分布，而不是简单地输出输入应该所属的单一最可能类别。高斯朴贝叶斯模型更进一步增加了一个假设，即这些特征之间是强独立的。为了简化这一点，这意味着高斯朴贝叶斯模型不通过关联属性来得出结论，而是独立地获取属性，并平等且独立于任何其他属性地权衡它们对所有者属于某类别概率的贡献。这种方法在开发垃圾邮件过滤器、文本识别和分类时非常流行，甚至在医学领域被用于医疗诊断功能。高斯朴贝叶斯模型的一个优点是它们具有很强的扩展性，在学习问题时只需要对应变量的线性参数，并且可以使用闭式表达式进行极大似然训练，由于其使用了线性时间，与许多其他分类器使用的迭代近似相比，它对资源的消耗要低得多。\n\
    \n# K 近邻\n\nK-近邻算法是一种模式识别算法，它恰好是一种非参数方法，这意味着它不是基于标准概率分布的参数，实际上是基于无分布的，或者说分布的参数是未指定的。K-近邻算法也用于各种数据点的分类和回归，在这些情况下，输入由特征空间中最近的\
    \ `k` 个示例组成。然而，输出取决于是否将 K-NN 方法用于分类或作为回归方法。如果 K-NN 用于分类，则 K-NN 的输出是一个类类别，因为该对象将由其大多数邻居进行分类，被分配到\
    \ `k` 个最近邻居中最常见的类，其中 `k` 是一个分配的小整数。事实上，如果将 `k` 设置为 1，那么问题对象将简单地采用其邻居的类。然而，对于 K-NN\
    \ 回归，输出是对象的所谓的“属性值”。对象的“属性值”通过取最近 `k` 个邻居值的平均值得到。K-NN 方法被称为一种基于实例的学习，或所谓的懒惰学习，因为这种懒惰学习只从局部值进行近似，直到分类本身完成才进行计算。这意味着\
    \ K-NN 算法在机器学习算法中是最容易使用的。然而，K-NN 算法可以通过添加权重方案进行修改，例如，邻居越靠近对象，权重越大。常用的权重方案遵循公式\
    \ `1 / d`，其中 `d` 是对象到邻居的距离。邻居本身取自已识别类（如果使用 K-NN 分类）或已知属性值（如果使用 K-NN 回归）的对象作为 K-NN\
    \ 机器学习算法的“训练集”，由于 K-NN 算法对数据的局部敏感性，不需要显式训练。如果解剖 K-NN 并将其实现到 Python 中，看起来像下面的短代码：\n\
    \n```python\ndef train(X_train, y_train):\n    # 记住 NN 的训练方法是不必要的，train 函数在这种情况下什么都不做。\n\
    \    return\n\ndef predict(X_train, y_train, x_test, k):\n    # 我们必须写的代码主要部分是预测函数，它计算\n\
    \    # 对象与其“训练”集中的邻居之间的距离，\n    # 从多数进行投票，一旦完成，为对象分配一个类。\n    distances = []\n\
    \    neighbors = []\n    for i in range(len(X_train)):\n        # 下面的一行计算欧几得距离\n\
    \        distance = np.sqrt(np.sum(np.square(x_test - X_train[i])))\n        #\
    \ 我们现在将其添加到各种距离的列表中\n        distances.append([distance, i])\n    # 现在从小到大排序列表\n\
    \    distances = sorted(distances)\n    # 现在我们可以创建 targets 列表\n    targets = []\n\
    \    for i in range(k):\n        # 下面的一行执行“投票”，即返回最常见的对象距离\n        index = distances[i][1]\n\
    \        # 将 y_train[index] 存入 neighbors 数组\n        neighbors.append(y_train[index])\n\
    \    # 获取距离对象的 k 个，返回最常见的类\n    return Counter(neighbors).most_common(1)[0][0]\n\
    \ndef kNearestNeighbor(X_train, y_train, x_test, predictions, k):\n    # 允许寻找最近\
    \ k 个邻居的代码允许    # 遍历每个示例并做出预测\n    train(X_train, y_train)\n    for i in range(len(x_test)):\n\
    \        predictions.append(predict(X_train, y_train, x_test[i], k))\n\n# 现在我们有了代码，可以配合交叉验证方法运行最佳\
    \ K 值\npredictions = []\nkNearestNeighbor(X_train, y_train, x_test, predictions,\
    \ 7)\n# 将 predictions 数组类型\npredictions = np.array(predictions)\n# 计算我们算法的准确率\n\
    accuracy = accuracy_score(y_test, predictions)\nprint('\\n Nearest Neighbors algorithm\
    \ has %d%%' % accuracy*100)\n```\n\n# 分类回归树\n\n分类回归树是另一种非常简单的机器学习方法。分类回归树（简称 `CART`）的主要结构是二叉树。从开始点，根节点\
    \ `x` 代表输入，从那里树分成两条包含输出变量 `y` 的路径，产生预测。例如，如果我们有 `x` 为 100 公斤的根节点输入，叶节点如果 `x` 大于等于\
    \ 100 则“重”，如果 `x` 小于 100 则“轻”，由于 `x` 确实大于等于 100，`y` 将取“重”的值。如果在代码中看到它，看起来像：\n\n\
    ```python\nif x >= 100:\n    Y = \"heavy\"\nElse:\n    Y = \"light\"\n```\n\n\
    这是二叉树的简单表示，但分类回归树反复使用该分支原理，直到遍历对象的特征数量且模型能够对其正确分类。注意分类回归树大量使用索引，这里是对索引及其排序的快速回顾：\n\
    \n### 循环索引（len 函数）\n\n索引是快速解析范围的方便方法。如果你将循环范围想象成一组堆叠的盒子，你需要在到达底部之前一个一个取出盒子。索引提供了提取底部或程序员选择的序列中任何盒子的方法。为了对变量进行索引，我们需要注意\
    \ `len()` 函数。此 `len()` 函数允许程序员解析序列并为其赋值，该值为序列中包含的元素数量。例如，`len(\"hello\")` 的值为\
    \ 5，因为 hello 有五个字符。现在我们有了一个可以调用长度的函数，我们只需要记住之前关于数组的课程。每个序列实际上都是数组或“列表”，因此我们可以通过序列从各个点开始访问列表。由于我们有了单词长度（例如\
    \ \"hello\" 有五个），我们可以轻松地通过 `word[2]`（记住索引从 0 开始）访问第三个字母，这应该调用单词 \"hello\" 的第三个元素，即字母\
    \ l。下面的代码是使用“gini”的决策树示例：\n\n```python\nclf_gini = CRTClassifier(criterion = \"\
    gini\", random_state = 100, max_depth = 3, min_samples_leaf = 5)\nclf_gini.fit(X_train,\
    \ y_train)\n```\n\n除此之外，我们还可以输出代码以便使用 gini 树准则查看结果：\n\n```python\nCRTClassifier(class_weight=None,\
    \ criterion=\"gini\", max_depth=3, max_features=None, max_leaf_nodes=None, min_samples_leaf=5,\
    \ min_samples_split=2, min_weight_fraction_leaf=0.0, presort=False, random_state=100,\
    \ splitter='best')\n```\n\n访问 Gini 指数函数如下：\n\n```python\n# 计算划分数据集的 Gini 指数\n\
    def gini_index(groups, classes):\n    # 统计划分点处的所有样本\n    n_instances = float(sum([len(group)\
    \ for group in groups]))\n    # 获取每个类的加权 Gini 指数\n    gini = 0.0\n    for group\
    \ in groups:\n        size = float(len(group))\n        # 如果 size 为 0 则避免除以零\n\
    \        continue\n        score = 0.0\n        # 根据组得分对类评分\n        for class_val\
    \ in classes:\n            p = [row[-1] for row in group].count(class_val) / size\n\
    \            score += p * p\n        # 按相对大小加权组得分\n        gini += (1.0 - score)\
    \ * (size / n_instances)\n    return gini\n```\n\n"
