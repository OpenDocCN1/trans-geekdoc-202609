    ## 机器学习


    ### 什么是机器学习？

    机器学习这一术语包含了一个简单易懂但在执行上极其困难且复杂的概念：计算机或“机器”通过其接收的数据来“学习”，或在特定类型的任务上变得更好，而无需显式编程。这意味着程序员必须能够编写代码以启用这种行为，因为这种对硬编码的独立性高度依赖程序员的算法。机器学习通常通过创建一组算法来完成，这些算法处理输入的数据并使用这些数据作为预测或决策的基础，而这些操作通常是在静态程序中硬编码的。这允许了适应性，程序将根据接收到的数据开始以不同的方式反应，与传统的静态程序相比，后者遵循特定的输入序列总是产生相同的结果。这种从输入数据创建模型在许多情况下是静态程序是不实用或可能的，例如在创建电子邮件垃圾过滤器、检测试图入侵网络安全的恶意入侵者，或者程序员试图实现某种程度的计算机视觉的情况下。这种适应性一直被用于增强计算机各种功能，并在多年来复杂性日益增加。然而，机器学习在数据科学领域远非新概念，事实上，机器学习这一概念被著名数据科学家
    Tom Mitchell 浓缩为一行：“如果一个计算机程序对于某些任务类 T 和性能衡量 P，其在任务 T 中的性能（通过 P 衡量）随着经验 E 的增加而提高，则说该程序从经验
    E 中学习”。


    ### 机器学习任务

    机器学习的“任务”指的是算法应该做什么，以及通过什么方法进行“学习”。因此，机器学习任务通分为大类：


