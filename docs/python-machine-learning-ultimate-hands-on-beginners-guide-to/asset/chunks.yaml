    # TensorFlow

    之前的代码和数据类型主要通过 `scikit – learn` 实现，但 TensorFlow 呢？TensorFlow 是由 Google 创建的软件库，最初用于专有用途，最终在
    2015 年以开源许可发布供公众下载和使用。TensorFlow 主要关注数据流编程，是一个用于利用神经网络函数进行机器学习的符号数学库。虽然 TensorFlow
    也可以像 `scikit – learn` 一样使用（因为它也包含了数值和科学函数），但它的主要优势在于创建神经网络的能力。然而，在进入这一点之前，我们必须首先学习什么是张量（Tensor）。


    # 张量 (Tensors)

    从最的形式来说，张量就是一个多维数据数组。因此，TensorFlow 的字面意思是“张量的流”，即神经网络在多维数据数组上执行的连续操作流。抛开这些冷知识不谈，让我们深入探讨一下张量这个主题。必须记住，神经网络的计算是在数据流图上完成的，其中节点代表数学公式和机器执行的操作，而边则是多维运算符，或包含所有相关数据的张量。然而，在进一步深入之前，回顾线性代数和向量积分中的几个概念是非常重要的，因为这些是理解张量以及它们为何对神经网络如此关重要的关键。


    ## 平面向量 (Plane Vectors)

    当人们听到向量这个词时，可能会想到它的物理学含义，即既有大小又有方向的量。然而，在数据和计算机科学中，向量的概念稍有不同。虽然相似，但程序员将向量视为矩阵的一种，即有序数字集合，但只有一列，尽管它可以有多行。在这种情况下，如果将数据绘制出来，它看起来是一维的。在某种程度上，人们仍然可以将这些向量想象成赋予了方向的标量值，符合我们从基础物理学中熟悉的定义。然而，数学向量有一个奇特的特性：虽然它们的值/大小保持固定且绝对，但它们的方向完全基于给定的参考点是相对的。


    那么平面向量呢？平面向量是人们可能认为是最简单的张量类型，它们与标准向量具有许多相同的特征。然而，平面向量位于向量空间，向量空间是一个可以通过数学运算相互作用的其他向量的集合。例如，我们有一个
    `2 x 1` 向量。这意味着该向量有一对实数组合，是二维空间的一部分。这引出了我们在 `(x , y)` 平面上的常规射线向量，我们可以很容易地绘制出它。在二维空间中，理解这个向量很容易，因为我们习惯于使用笛卡尔坐标系，我们可以简单地分配一个坐标为
    `(0, 0)` 的原点来确定我们创建向量的方向。X 坐标位于向量第一个值上，Y 坐标位于第二行值上。然而，随着向量变大，情况变得变得复杂。以一个大小为 `3
    x 1` 的向量为例，它现在可以被可视化为位于 `(x , y , z)` 坐标平面上，或三维空间。这次我们可以创建一个三维图形，并为它们在向量空间中所处的位置赋值，从而在坐标平面上表示它们。然而，随着向量维数的增加，可视化会变得越来越复杂，这就是在早之前的章节中解释的“维度灾难”开始起作用的地方。


    然而，人们必须记住，拥有向量的意义在于允许人们对其进行数学运算。执行操作的一种方便方法是简单将向量表示为基向量或单位向量，从而简化过程。单位向量是值为 1
    的向量。这些向量通常用带有顶端符号的小写字母表示，被亲切地称为“帽子”（hats）。这些单位向量非常方便，特别是当尝试将二维或三维向量表示为多个正交分量之和时，例如
    x 轴、y 轴和 z 轴。同样注意的是，向量本身是其分量向量之和，在需要时可以这样表示。


    ## 张量表示 (Tensor Representation)

    回到张量的整体，除了平面向量外，协向量（co – vectors）和线性算符也是特定类型的张量。记住，向量是一个被赋予了单一方向的标量值。而张量被认为是一个具有大小和多个方向的物理对象的数学表示，尽管这很难理解，但它是理解这一切运作方式至关重要的概念。


    标量由单个数字表示，即大小。向量由一组数字表示，这些数字与它们所在的维度相对应，例如二维向量有两个赋值值，三维向量有三个赋值值。然而，张量在三维空间中由 `3R`
    个数字组成的数组表示。在这种情况下，`3R` 中的 `"R"` 代表张量的阶数。例如，二阶张量由 `3` 的二次幂表示，即 9 个数字。因此，用数学方法来说，标量在
    `N` 维空间中始终只需要一个数字，向量在 `N` 维空间中由 `N` 个值定义，而张量在 `N` 维空间中由 `N^R` 个值定义。这使得标量值被视为张量，因为它们是零阶张量，因为任何数的
    0 次幂结果都是 1。


    然而，这重要在哪里？张量的特殊之处在于分量向量和基向量结合的方式。基向量在不同的参考系之间变换，但分量向量会随之进行相应的变换，以保持它们的组合不变并维持一致的值。


    '
- fmt: '

    # What is a Neural Network?


    A neural network, more properly known as an artificial neural network, commonly
    abbreviated as `(ANN)`, is a processing method or device loosely modeled after
    the operation of mammalian brains, specifically our human brains. Neural networks
    tend to be organized in layers, with each layer consisting of multiple nodes,
    each with its own activation function. Input patterns are presented to the network
    through the input layer, which transmits the information to other, "hidden" layers
    that carry out the actual data processing through weighted connections. Once the
    data has been processed, they are transmitted to the output layer of the `ANN`.


    What makes the artificial neural network similar to how human brains work is the
    learning process, where the connections and weights between layers are modified
    as input is received, meaning that the more information is fed to the neural network,
    the more it is capable of reaching a reasonable output, much like a child that
    is constantly shown pictures of dogs will learn how a dog looks like.


    ## The Delta Rule and Backpropagation


    Neural networks have numerous types of learning rules, but for now, we will cover
    the most basic one, the delta rule. The delta rule is one of the most common rules,
    as it is utilized by a type of neural network known as backpropagational neural
    networks, or `B P NNs`, which are among the most common types of neural networks.


    Backpropagation stands for the backwards propagation of error. The delta rule
    allows for a supervised learning process that happens each time the network undergoes
    a cycle, or an "epoch", which is whenever a new input pattern is received. Whenever
    an epoch starts, there is a forward flow of output, but a backwards weight adjustment
    happens afterwards. To simplify the process, it is as if when the neural network
    receives an input pattern, it simply hazards a guess as to what it may be. Once
    it does this, it is able to see how far away its answer was from the correct one
    and makes adjustments to the connections in order to be able to make a better
    guess the next time it receives a similar input pattern.


    ## Training vs. Analytical Mode


    Once the neural network has "learned" enough from controlled input where the output
    is known, then it may be employed as an analytical tool to parse data that is
    no longer labeled. In order to carry out this function, the programmer must specify
    that it is no longer carrying out training runs, and the neural network will continue
    to function solely in forward propagation mode, where new input is presented to
    the input pattern and received as normal, and processed similarly as in the training
    mode, but there is no more backpropagation and the output is simply displayed.
    This output from the forward propagation run is then the data model that is used
    for analysis and interpretation by the user.


    The reason that neural networks are not kept on an eternal "training run" is that
    there is a chance that it will become too specialized and "learn" to respond to
    a specific type of input alone, which if likened to a human equivalent, becomes
    rote memorization instead of actual pattern recognition. If ever this over–training
    happens, the neural network loses much of its value as it no longer recognizes
    anything but the single input, and this type of `ANN` is refered as a "grandmothered"
    network.


    ## Neural Networks vs. Conventional Computers


    What is the difference between Neural Networks and Conventional Computers? First
    the reader has to remember how a conventional computer works, and how it processes
    information. Conventional, or "serial" computers have central processors that
    have access to specific memory locations which store both data and instructions.
    Computations are carried out by these processors by reading the instruction and
    data from the specific memory address, which is then executed and the results
    saved in yet another memory location. The standard computing system has a sequential
    and logical method, and a variable''s state can be tracked and be given a defined
    value at any point in the process, from beginning to end.


    However, neural networks do not contain any central processors, but rather have
    a multitude of small simple ones, that do not do much on their own, and in fact
    often simply take the sum of the input from other processors (or "nodes"). Neural
    networks do not access instructions in the conventional way, as they respond in
    parallel to input rather than in a sequential method like conventional computers.
    One of the biggest things as well is that there is no dedicated data storage or
    memory address for neural networks, but instead information is contained in the
    "state" of the network, where the knowledge is the network itself, which then
    becomes more than simply the sum of its parts.

    '
