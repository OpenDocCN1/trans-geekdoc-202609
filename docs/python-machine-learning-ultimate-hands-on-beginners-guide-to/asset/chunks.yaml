    \ min_samples_split=2, min_weight_fraction_leaf=0.0, presort=False, random_state=100,\
    \ splitter='best')\n```\n\nAccessing the Gini Index function looks like as follows:\n\
    \n```python\n# Calculating the Gini index for a split dataset\ndef gini_index(groups,\
    \ classes):\n    # count all samples at split point\n    n_instances = float(sum([len(group)\
    \ for group in groups]))\n    # Getting the sum of the weighted Gini index for\
    \ each class\n    gini = 0.0\n    for group in groups:\n        size = float(len(group))\n\
    \        # avoid divide by zero if size == 0\n        continue\n        score\
