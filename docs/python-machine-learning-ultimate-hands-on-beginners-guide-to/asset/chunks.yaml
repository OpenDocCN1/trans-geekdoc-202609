    # 数据可视化


    现在我们已经掌握了一些可以用于检查数据的基本函数，接下来我们需要找到一种方法来充分利用这些数据。然而，在在此之前，如果我们能够对这些数据进行可视化处理，我们的工作将会变得简单得多。在本节中，我们将探讨两种实现方法：单变量图和多变量图。


    ## 单变量图（箱线图、直方图）


    我们使用单变量图是为了更深入地理解单个变量，从而让我们对属性的分布有更好的认识。我们可以创建的图表类型是箱线图（box and whisper plot），它会创建并显示每个属性的图表。我们可以通过以下代码行来实现：


    ```

    dataset.plot(kind = "box", subplots = True, layout = (2,2), sharex = False, sharey
    = False)

    plt.show()

    ```


    上述代码包含了 `plot` 函数和 `show` 函数。`plot` 函数接受各种参数来创建特定类型的箱图，在这种情况下，它将创建一个二乘二的箱图，并隐藏
    x 和 y 变量名。`show` 函数指示计算机显示所创建的特定图表。我们还可以创建直方图，通过使用以下代码行即可完成：


    ```

    dataset.hist()

    plt.show()

    ```


    这将使用 `hist()` 函数自动创建一个直方图，并通过 `show` 函数指示计算机显示该图表。如果运行该代码，将显示某些变量似乎呈现高斯分布，这在之后我们构建算法时，可能是一个很有用的假设。


    ## 多变量图（散点矩阵）


    多变量图用于检查多个变量之间的关系，与之相比，我们使用单变量图是为了更好地检查单个变量的构建情况。由于我们考虑了多个变量，这里最符合我们目的的图表类型是散点图，它将帮助我们发现每个变量之间的结构化关系。为了创建散点图，我们只需要使用以下代码：


    ```

    scatter_matrix(dataset)

    plt.show()

    ```


    我们正在使用导入的 `scatter_matrix` 函数来轻松地创建一个图表，`dataset` 本身就是放入该函数的参数，通过调用它并利用其内容来构建图表。与之前一样，`show`
    函数的作用是创建一个显示输出。如果用户运行这段代码，我们应该能看到某些关联对，显示了某些变量之间的结构化关系。


