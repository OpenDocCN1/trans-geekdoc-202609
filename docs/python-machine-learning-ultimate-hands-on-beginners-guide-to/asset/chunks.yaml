    # Python 中的机器学习


    现在我们已经对机器学习是什么以及它能做什么有了基本的了解，现在我们回到 Python，以及我们如何将两者结合。到目前为止，你的 `Python` 应该已经配置好了，你应该已经掌握了创建
    Python 代码和算法的基础知识，并且已经习惯了开发环境，因此我们可以转向更高级的概念，例如这些内容。然而，与初学者倾向于使用的许多函数不同，机器学习并不是内置在
    Python 中的，因此我们需要导入几个库，以使我们的 `Python` 具备运行机器学习算法的能力。`Python` 是一种高级编程语言，最初由一位名为
    `Guido van Rossum` 的程序员开发，第一个公开发布的版本于 1991 年发布。由于 `Python` 易于使用且简单，它通常用于向初学者教授编程，但由于该语言的强大性，它在更高级的应用中也运行良好，因为它扩展性很好，并且可以用于大型程序。这种扩展性包括了在导入某些库时运行机器学习函数的能力。我们可以利用的库有很多，但在这里我们将重点关注两个主要的库：`Scikit
    – learn` 和 `TensorFlow`。


    ## Scikit – learn


    `Scikit – learn` 是 `Python` 中最流行的免费机器学习库之一，最初由一位名为 `David Cornapeau` 的程序员于 2007
    年开发，后来有 `Mattheiu Brucher` 的加入，得益于法国计算机科学与自动化研究的参与，`scikit – learn` 最终于 2010 年初开放公共下载和使用。`Scikit
    – learn` 的名称源于该软件软件包的意图，即增强使用 `Python` 科学库 `SciPy` 工具包以及数值库 `NumPy` 的用户的能力。因此，`Scikit
    – learn` 是一个用于扩展 `Python` 库的模块，涉及添加用于分类、回归和聚类的各种函数和方法，它是一个“SciPy 工具包”。如所述，`Scikit
    – learn` 包含了分类、聚类和回归算法，这些算法利用了 `gradient boosting`、`random forests`、`support vector
    machines`、`k – means` 和 `DBSCAN`，这使得用户在使用 `Python` 时拥有更广泛的能力范围。


    ## TensorFlow


    `TensorFlow` 是谷歌创建的一个软件库，最初用于专有用途，但最终于 2015 年在开源许可下开放公共下载和使用。`TensorFlow` 主要关注数据流编程，并且是一个用于神经网络函数的机器学习的符号数学库。`TensorFlow`
    是一个更高级的编程库，我们将随着指南的进行进行更详细的讨论，但现在，我们将从 `Python` 中机器学习函数的基础介绍开始。


    ## 使用哪个版本的 Python？


    到目前为止，读者应该已经熟悉了 `Python`，并且已经在他们的机器上安装了 `Python`。为了本指南而言，用户应该运行现代版本的 `Python`，即
    `Python 3.5`，但本指南也适用于 `Python 2.7` 用户。如果读者由于某种原因还没有 `Python`，他们可以按照以下方式安装基础版本的
    `Python`：


    ### 在 Windows 平台上安装 Python


    为了在 Windows 上运行 `Python`，请从 `Python` 官方网站 `www.python.org` 或镜像网站下载安装程序。一旦下载完成，运行
    `msi` 文件并使用默认配置即可。


    ### 在其他平台上安装 Python


    为了在其他平台上运行 `Python`，用户必须访问 `Python` 官方网站 `www.python.org`，并找到与所需硬件兼容的版本。某些硬件平台（如树莓派）在操作系统系统中已经自动安装了
    `Python`。一旦用户找到了文件，只需下载并安装它，使用默认配置即可。然而，如果读者愿意，还有比基础 `Python` 之外的 Python 应用程序可用，并且可能对读者更有用，因为这种名为
    `Anaconda` 的变体已经包含了这些库。


    ### 在 Windows 平台上安装 Anaconda


    为了在 Windows 上安装 `Anaconda`，只需访问以下链接站点：`https://www.anaconda.com/download/`，并选择用户希望的
    `Python` 版本。建议获取最新版本以利用新功能，但在某些情况下（例如访问某些库或向后兼容性问题），用户可能希望安装旧版本的 `Python`。在安装
    `Anaconda` 应用程序时，确保也安装 GUI。


    ### 安装相关库（如果不使用 Anaconda）


    对于我们在 `Python` 中基础的机器学习使用，我们需要导入五个库。这些库如下：


    1. `Scipy`: `Scipy` 是一个科学 Python 模块，包含了用于优化、线性代数和其他特殊函数的各种模块。它扩展了 `Numpy` 库，并包含在
    `NumPy` 栈中，其中包含了 `matplotlib` 和 `pandas` 模块。

    2. `Numpy`: `NumPy` 是一个数值 Python 模块，提供了快速的数学函数。它还允许使用更健壮的数据结构来记录多维对象。

    3. `Matplotlib`: `Matplotlib` 是 `Python` 的绘图库，通常与 `NumPy` 结合使用。它提供了一个面向对象的应用程序接口，允许用户在标准
    GUI 上使用其函数。

    4. `Pandas`: `Pandas` 模块提供了用于数据处理的 `Data Frame` 对象，提供了读取和写入数据的函数。值得注意的是，Data Frames
    可以在多维数组中存储不同类型的数据。

    5. `sklearn`: `sklearn` 是主要的机器学习库之一，包含了许多与机器学习相关的函数和数学模型。


    如果读者忘记了库，这里有关于库和初始化的快速简报：


