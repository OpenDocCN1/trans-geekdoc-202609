    \ is known as the iris flowers program. The iris flowers program is meant to take\
    \ the iris flowers data set, which contains multiple attributes, and use these\
    \ attributes in order to predict what the species of flowers are from the given\
    \ attributes.\n\n## Iris flowers data set\n\nThe iris flowers data set is one\
    \ of the most well – known data sets, as it has been used as the introductory\
    \ data set for machine learning students and statisticians around the world. This\
    \ data set has a hundred and fifty data points about flowers. Each of these hundred\
    \ and fifty data points about flowers has five attributes:\n- petal length in\
    \ centimeters\n- petal width in centimeters\n- sepal length in centimeters\n-\
    \ sepal width in centimeters\n- species\n\nNote as well that there are three species\
    \ of flowers in this data set, and the hundred and fifty data points are distributed\
    \ accordingly.\n\n## Importing the Requisite Libraries and data\n\nOur first step\
    \ in the process of solving a machine learning problem is to identify and gather\
    \ the data. As we are using iris flower data set, a well – known and publicly\
    \ available data set, our work here will be quick and easy. All we have to do\
    \ is to import the requisite libraries, modules, and objects in order to have\
    \ all the data we need at our fingertips. This can be done by entering the following\
    \ lines of code:\n\n```python\n# Importing the requisite libraries\nimport pandas\n\
