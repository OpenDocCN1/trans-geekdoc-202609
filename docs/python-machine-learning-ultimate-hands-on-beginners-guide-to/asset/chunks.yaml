    # Learning


    Given that machine learning has the word learning in it, learning would be the
    major task of any machine learning algorithm. There are multiple methods of machine
    learning, however, depending on what the aim of the programmer is, as well as
    what kind of data the algorithm is meant to parse. The following should give the
    reader an overview of a few of the more popular and major categories of machine
    learning.


    ## Supervised Learning


    Supervised learning is a method wherein the computer is fed information, usually
    in the format of a paired input – output data and uses this information to construct
    a model which will result in improved predictions or in a more favorable output
    method. It does this by inferring training data through the given "training examples",
    which then allows the machine learning algorithm to eventually produce an inferred
    function using the given examples, that will be used to map more examples and
    will optimally result in determining the classes of unseen instances, which requires
    the algorithm to be able to generalize results from the training data to unseen
    examples in a more reasonable way. Note that the paired teaching data is usually
    referred to as the `vector` for the input half of the pair, and the output portion
    is referred to as the `supervisory signal`.


    ### Steps in Creating a Flowchart to Solving a Supervised Learning Problem


    The first step in creating an algorithm to solve a supervised learning problem
    is to determine the data type of the training examples to be used. For example,
    when writing a program in order to conduct handwriting data analysis, the programmer
    has to decide if they wish to use individual characters, single words, or even
    entire lines at once in order to train the program. Once the type of data has
    been determined, the next step is to gather a sufficient sample size of data in
    order to create the training set to be used for the algorithm. This means that
    multiple input objects should be gathered, and their expected output counterparts
    should also be readied. Once the training set has been completed, the programmer
    needs to then figure out how exactly they wish their input features to be represented.
    This means that the input will be converted into a `vector`, with a number of
    variables describing it. While it is impossible to perfectly describe the object
    due to the "curse of dimensionality", the programmer should be able to include
    a sufficient number of descriptive variables for the computer to have a proper
    idea of the object. Once this has been completed, the programmer can then determine
    how they wish their learning function to be structured and how they want to create
    their algorithm, by using methods such as support vector machines or decision
    – tree creation, algorithm methods that will be discussed in a later chapter.
    Once this has been completed, the programmer can then begin to run the simulation
    to train their program. Note that certain supervised learning algorithms need
    a number of control parameters to be determined by the user, and further adjustment
    may be necessary in order to optimize performance. Once the algorithm has been
    tested and the program has been trained, the programmer can then try and test
    their function on a test set differing from the training set, and check as to
    whether or not their program is able to come up with the reasonably expected output
    results.


    ### Curse of Dimensionality


    While the "curse of dimensionality" sounds like a very complex concept, and one
    that comes from a science fiction or fantasy novel at that, it merely refers to
    how it is difficult to measure three – dimensional physical objects in the high
    – dimensional space that data scientists and mathematicians work in, and the various
    phenomena that arise from this fact. This problem is caused by the fact that as
    the number of dimensions increase, the volume of the space increases at a rapid
    space, so much so that data becomes difficult to gather. One example of how this
    affects data scientists is the organization of data in high – dimensional space.


    ### Semi-supervised Learning


    A subset of the supervised learning method, also known as optimal design, it combines
    elements of supervised learning and unsupervised learning, as unlabeled data are
    included in the training set. This means that the program learns to calibrate
    itself through unlabeled data. In fact, the proportion tends to be skewed in favor
    of unlabeled data, with a small portion of the training set being labeled. This
    can be likened to a math teacher giving worksheets to their students, where the
    first few problems are already solved, with the solution and answer given, and
    the rest of the worksheet is left blank. This method has also been shown to result
    in higher accuracy.


    ### Active Supervised Learning


    Active supervised learning is a type of supervised learning where the program
    is given the ability to actively ask the user regarding the label of the data
    sets. This method uses a combination of labeled and unlabeled data sets, and due
    to the high cost of manually labeling each data set, the active supervised learning
    method can be used. This allows the computer to attempt to learn using the training
    set, but if the margin of error in labeling of a particular data set is too high
    for the program to "tolerate", then the algorithm usually asks the user in order
    that it may properly self – correct. This active participation by a human user
    is the reason that this method is referred to as the active supervised learning
    method, and unlike most other methods where little to no human interaction is
    required once the algorithm starts to run, this method needs a human to be able
    to fully complete its training set.


    ## Reinforcement Learning


    Reinforcement learning is a unique method of supervised learning, in that training
    sets are not provided. Instead, what happens is that the program is left to carry
    out actions in an environment, and it learns based on a rewards and incentives
    method, where if their action is correct, then it is reinforced. This allows the
    program to find different results, and the focus is taken off of correcting sub
    – optimal results, but rather finding the method that results in the best performance.
    This method is often carried out by feedback – intensive activities, such as when
    playing games against a human user or even driving cars. This learning method
    often uses the Monte Carlo heuristic method, which allows the computer to calculate
    probabilities in a resource – starved environment.

