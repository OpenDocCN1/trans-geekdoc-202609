    ## Machine Learning


    ### What is Machine Learning?

    Machine learning as a term encompasses a concept that is simple enough to understand,
    but extremely difficult and complex in its execution: the ability of a computer,
    or a "machine", to "learn", or get better at a specific type of task using data
    that they receive, without being explicitly programmed. This means that the programmer
    must be able to code in such a way to enable this behavior, as this independence
    from hard – coding is highly reliant on the programmer''s algorithm. Machine learning
    is usually done by creating a set of algorithms that process incoming data and
    use this data as basis for predictions or decisions, actions that would normally
    be hard – coded in a static program. This allows for adaptation, and the program
    will begin to react in a different manner depending on the data received, as compared
    to traditional static programs where following a certain series of inputs will
    always result in the same result. This model – creation from inputted data is
    useful in many cases where static traditional programs would be impractical or
    impossible if a favorable result is desired, such as in the creation of electronic
    – mail spam filters, detection of possible malicious intruders attempting to breach
    the security of a network, or in cases where the programmer is attempting to implement
    some level of computer vision. This adaptability has been used to enhance various
    functions of computers and has been growing in complexity through the years. However,
    machine learning is far from a new concept in data science, and in fact, machine
    learning as a concept has been condensed by prominent data scientist Tom Mitchell
    into the line of: "A computer program is said to learn from experience E with
    respect to some class of tasks T and performance measure P if its performance
    at tasks in T, as measured by P, improves with experience E". As machine learning
    is a fairly well – developed concept, there are many things that programmers are
    capable of implementing through it, and there are two general "tasks" that machine
    learning algorithms carry out.


    ### Machine Learning Tasks

    The "tasks" of machine learning refer to what the algorithm is supposed to do,
    and through what method it "learns". As such, there are two general categories
    of machine learning tasks:

