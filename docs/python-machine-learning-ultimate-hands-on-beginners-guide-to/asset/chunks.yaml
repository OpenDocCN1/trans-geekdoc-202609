  trans: "\n\n# 创建数据模型\n\n此时，我们已经知道如何检查数据、处理数据，并以原始数据形式、摘要或图表的形式显示数据。现在，我们必须创建一个算法，以便能够完全地创建一个模型。在本节中，我们将留出一个验证数据集，创建一个测试框架来使用名为“十折交叉验证”的方法，构建五个不同的模型来测试每个模型的准确性，最后选择一个模型。\n\
    \n## 创建验证数据集\n\n正如我们现在所知的，机器学习需要从数据点中“学习”以进行自我校准。然而，由于我们的数据集有限（鸢尾花数据集），我们将留出部分数据点，它们不会进入算法，因为我们将使用这些数据点来测试算法的有效性和准确性。为了训练算法，我们将数据集分为\
    \ 80% 和 20%，其中 80% 是训练集，20% 是验证集，这意味着我们有 120 个数据点来训练算法，而最后 30 个将用于查看我们的算法是否已正确校准以给出准确的预测。将使用以下代码来分离所需的各种数据点。\n\
    \n```\narray = dataset.values\nX = array[:,0:4]\nY = array[:,4]\nvalidation_size\
    \ = 0.20\nseed = 9\nX_train, X_validation, Y_train, Y_validation = model_selection.train_test_split(X,\
    \ Y, test_size=validation_size, random_state=seed)\n```\n\n之前的代码现在将创建四个独立的数组，其中\
    \ `X_train` 和 `Y_train` 是包含我们将用于训练算法的数据点的数组，而 `X_validation` 和 `Y_validation`\
    \ 是我们将用于测试校准的数据。\n\n## 创建测试框架\n\n现在我们已经将数据集划分为测试组和验证组，我们需要为准确性设置一个测试方法。在这里，我们将利用十折交叉验证来训练和测试算法，这意味着它将每十个数据点进行一次划分，训练九个点并在第十个点上测试，并对程序将执行的所有训练-测试组合重复这种方法。可以使用以下几行代码初始化：\n\
    \n```\nseed = 9\nscoring = \"accuracy\"\n```\n\n`seed` 的值并不真正重要，因为它只是伪随机数生成器的一个种子。`scoring`\
    \ 方法是算法的准确率，通过正确预测的观测值数量与总可能观测值数量之比乘以 1 百来得出百分比格式的结果。此评分变量将用于评估我们将构建的每个模型。\n\n\
    ### 伪随机数生成器\n\n随机数出于许多原因非常有用，因为这允许程序员更好地复制现实世界的随机性。然而，计算机无法真正生成随机性，因为它们被设计为精确且理性地迭代。因此，存在一种伪随机数生成器，它根据使用的初始“种子”产生一系列“随机”数字。虽然这些数字看起来是随机的，但重要是，只要使用的种子相同，就会产生相同的数字。如果未设置种子，那么输出的数字将会。\n\
    \n## 构建模型\n\n现在我们进入实际部分。我们将测试六个不同的模型，看看哪一个性能最好。我们将测试的模型是：\n- 逻辑回归 (`LR`)\n- 判别分析\
    \ (`LDA`)\n- K 近邻算法 (`KNN`)\n- 分类树 (`CART`)\n- 朴素贝叶斯 (`NB`)\n- 支持机 (`SVM`)\n\n\
    以下代码依次使用每个模型来检查结果：\n\n```\nmodels = []\nmodels.append(('LR', LogisticRegression()))\n\
    models.append(('LDA', LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
    models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
    models.append(('SVM', SVC()))\n\nresults = []\nnames = []\nfor name, model in\
    \ models:\n    kfold = model_selection.KFold(n_splits=10, random_state=seed)\n\
    \    cv_results = model_selection.cross_val_score(model, X_train, Y_train, cv=kfold,\
    \ scoring=scoring)\n    results.append(cv_results)\n    names.append(name)\n```\n\
    \n之前的代码构建了模型并使用我们设计的十折交叉验证运行它们。它们将数据集通过每个模型，并打印出结果数字以及标签：\n\n```\nmsg = \"%s:\
    \ %f (%f)\" % (name, cv_results.mean(), cv_results.std())\nprint(msg)\n```\n\n\
    输出应该看起来如下：\n- `LDA`: 0.975000 (0.038188)\n- `LR`: 0.966667 (0.040825)\n- `CART`:\
    \ 0.975000 (0.038188)\n- `NB`: 0.975000 (0.053359)\n- `SVM`: 0.981667 (0.025000)\n\
    - `KNN`: 0.983333 (0.033333)\n\n在这里我们看到 `KNN` (K 近邻) 在我们特定的测试运行中具有最高的准确率分，达到九八百分的估计准确率。但请注意，由于伪随机数生成器的种子影响，如果在运行此代码时种子不同，结果可能会不同。\n\
    \n我们还可以为每个算法的测试结果创建一个图表，得益于我们的测试框架方法，对每个数据模型测试了十次。这样做的代码如下：\n\n```python\ntres=\
    \ plt.figure()\ntres.suptitle(\"Comparing Algorithms\")\nax = tres.add_subplot(111)\n\
    plt.boxplot(results)\nax.set_xticklabels(names)\nplt.show()\n```\n\n这将创建并显示一个柱状图，X\
    \ 轴标记为测试类型，Y 轴标记为每次测试的准确率百分比。\n\n"
- fmt: "\n# Making Predictions\n\nNow that we have created the algorithm to test our\
    \ data sets, and we have seen which was predicted to be the most effective test,\
    \ the K – nearest neighbors test, we can now check it against our validation data\
    \ set that was put aside earlier. This secondary test allows us to ensure that\
    \ our algorithm is truly accurate and can properly make predictions as to what\
    \ species the flower is depending on the measurements of the flower petals and\
    \ sepals. The code to do so is as follows:\n\n```python\nknn = KNeighborsClassifier()\n\
    knn.fit(X_train, Y_train)\npredictions = knn.predict(X_validation)\nprint(accuracy_score(Y_validation,\
    \ predictions))\nprint(confusion_matrix(Y_validation, predictions))\nprint(classification_report(Y_validation,\
    \ predictions))\n```\n\nThe code provided will test the algorithm against the\
    \ validation set that we set aside earlier, and will also display the results,\
