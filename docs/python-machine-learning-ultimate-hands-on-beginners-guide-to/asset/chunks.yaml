    # 如何导入和初始化库


    库简单来说就是多个模块的集合，供设备上的 Python 程序使用。这些包通常存储在 Python 安装的同一个文件夹中，默认情况下，路径为：

    - 对于 Windows 用户：`C:/Python27/Lib/site-packages/`

    - 对于 Linux 用户：`/usr/lib/python/site-packages`


    即使库已经位于正确的文件夹中，也无法立即使用，因为它们必须首先使用以下语法进行初始化：`library_name/__init__.py` 或 `library_name/module_name.py`。


    一旦库完成初始化，就可以通过上一节讨论的过程导入内部的模块，即：`import module_name`。


    一旦库被导入并初始化，我们可以在 Python IDE 中输入以下内容，以检查它们是否已正确安装：


    ```python

    # 检查每个库的版本

    # 这显示了机器上安装的 Python 版本

    import sys

    print("Python: {}".format(sys.version))

    # 这显示了机器上安装的 scipy 版本

    import scipy

    print("scipy: {}".format(scipy.__version__))

    # 这显示了机器上安装的 numpy 版本

    import numpy

    print("numpy: {}".format(numpy.__version__))

    # 这显示了机器上安装的 matplotlib 版本

    import matplotlib

    print("matplotlib: {}".format(matplotlib.__version__))

    # 这显示了机器上安装的 pandas 版本

    import pandas

    print("pandas: {}".format(pandas.__version__))

    # 这显示了机器上安装的 scikit – learn 版本

    import sklearn

    print("sklearn: {}".format(sklearn.__version__))

    ```


    如果库已正确安装，输出应该类似于下面的几行：

    ```

    Python: 3.6.0

    scipy: 1.1.0

    numpy: 1.14.5

    matplotlib: 2.2.2

    pandas: 0.23.2

    sklearn: 0.19.2

    ```


    到此时，意味着适当的库已经安装。如果你的库版本与此处看到的并不完全匹配，请不要担心，因为 API 倾向于保持稳定。


    ## Python 机器学习入门：鸢尾花 (Iris Flowers)


    在开始导入并初始化库之前，我们需要通过以下代码来检查它们是否已经正确安装。一旦库初始化完成后，这意味着已经安装了正确的库。如果你的库版本与此处看到的并不完全匹配，请不要担心，因为
    API 倾向于保持稳定。


    ## Python 机器学习入门：鸢尾花


    在开始导入并初始化库之前，我们需要通过以下代码来检查它们是否已经正确安装。一旦库初始化完成后，这意味着已经安装了正确的库。如果你的库版本与此处看到的并不完全匹配，请不要担心，因为
    API 倾向于保持稳定。


    ## 鸢尾花数据集


    鸢尾花数据集是广泛用于机器学习的经典数据集，它包含了许多数据点。鸢尾花数据集具有以下属性：

    - 花片长度

    - 花片宽度

    - 花瓣长度

    - 花瓣宽度

    - 类别


    ## 导入必要的库和数据


    在解决机器学习问题的第一步是识别并收集数据。当我们使用鸢尾花数据集（这是一个公开的数据集）时，我们的工作将变得快速且简单。我们只需要导入必要的库和对象以获取所需的数据。


    一旦完成这些操作，我们所有需要的工具都应该就绪了，我们可以开始将数据加载到机器上。这些数据可以直接从加利福尼亚大学亚文分区的机器学习库下载到我们的机器上，只需要几行简单的代码和网络连接，如以下代码所示：


    ```python

    # 加载数据集

    url = "https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data"

    names = ["sepal - length", "sepal - width", "petal - length", "petal - width",
    "species"]

    dataset = pandas.read_csv(url, names=names)

    ```


    请记住，我们正在使用带有参数的函数，因此一旦加载完成，每列数据都将拥有标签，即花萼长度、花萼宽度、花瓣长度、花瓣宽度和类别。这在我们尝试操作和访问数据时会让我们的工作变得容易得多。


    ```python

    # 导入必要的库

    import pandas

    from pandas.plotting import scatter_matrix

    import matplotlib.pyplot as plt

    from sklearn import model_selection

    from sklearn.metrics import classification_report

    from sklearn.metrics import confusion_matrix

    from sklearn.metrics import accuracy_score

    from sklearn.linear_model import LogisticRegression

    from sklearn.tree import DecisionTreeClassifier

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.discriminant_analysis import LinearDiscriminantAnalysis

    from sklearn.naive_bayes import GaussianNB

    from sklearn.svm import SV

    ```


    上述代码允许我们通过各种分类器对各种花卉进行分类，同时也允许我们在矩阵上显示数据，并导入各种回归函数以简化我们的任务，因为让初级程序员自己编写回归算法来测试基础机器学习程序可能太难了。


