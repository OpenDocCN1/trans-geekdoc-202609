    # Data Visualization


    Now that we have a few basic functions under our belt that we can use to examine
    the data, we now need to find a method to use in order to put this data to good
    use. However, before we can do that, it would make our jobs much easier if we
    could make a visualization of that data. In this section, we will examine two
    methods of doing so: Univariate plots and multivariate plots.


    ## Univariate Plots (Box and Whisper Plot, Histogram)


    We use univariate plots in order to be more capable of understanding single variables,
    which would give us a better idea of the distribution of the attributes. One type
    of plot we can create is the box and whisper plot, which will create and display
    the plot of each attribute. We can do this with the following line of code:


    ```

    dataset.plot(kind = "box", subplots = True, layout = (2,2), sharex = False, sharey
    = False)

    plt.show()

    ```


    The aforementioned code has the `plot` function and the `show` function. The `plot`
    function takes the various arguments to create the type of box, which in this
    case will create a two by two box, with the x and y variable names hidden. The
    `show` function instructs the computer to display the particular graph created.
    Also available for our use is the creation of histogram plots, which can easily
    be done by using the following line of code:


    ```

    dataset.hist()

    plt.show()

    ```


    This will automatically create a histogram graph using the `hist()` function,
    and will instruct the computer to display said graph through the `show` function.
    If the code is run, it will show that some variables seem to have a Gaussian distribution,
    which may be a useful assumption to make later on when it comes to constructing
    our algorithm.


    ## Multivariate Plots (Scatter Matrices)


    Multivariate plots are used to examine the relationships between multiple variables,
    as compared to univariate plots which we use in order to better examine the construction
    of a single variable. As we are taking multiple variables into account, the type
    of graph that would serve our purposes the most here would be a scatter plot graph
    which will help us find structured relationships between each variable. In order
    to create the scatter plot graph, we simply have to use the following code:


    ```

    scatter_matrix(dataset)

    plt.show()

    ```


    We are using the imported `scatter_matrix` function in order to create a graph
    with little fuss, with the `dataset` itself being the argument that we place into
    the function, calling it and using its contents to structure the graph. Much like
    before, the `show` function is there in order to create a displayed output. If
    the user runs this code, we should see that there are certain linked pairs, showing
    a structured relationship between certain variables.

    '
