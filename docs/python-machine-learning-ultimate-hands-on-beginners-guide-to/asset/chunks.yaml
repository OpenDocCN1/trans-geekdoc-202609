- fmt: "\n# Summarizing the Data Set\n\nAt this point, thanks to the previous two\
    \ steps, we have the data that we need for this program, and the tools to analyze\
    \ the data. Now we have to learn how to manipulate this data in order to get a\
    \ tangible result. In this step we will attempt to do four things:\n\n1. First,\
    \ we will get the dimensions of the data set at our disposal.\n2. Second, we will\
    \ try and take a look at the raw data itself.\n3. Third, we will try and get a\
    \ summary of the statistics of each attribute.\n4. Fourth and last, we will try\
    \ to break down the data as per the `species` variable.\n\n## Finding the Dimension\
    \ of the Data Set (Learning the shape property)\n\nRemember how arrays and lists\
    \ work in Python? Each array / list can be imagined in a two dimensional space\
    \ (or three or more) and so we can organize our data as in columns or rows, if\
    \ we are using a two dimensional array.\n\n### List Data Type\nThe `List` data\
    \ type is one of the most useful data types when it comes to organizing data.\
    \ The `list` data type is also commonly known as an \"array\" in other programming\
    \ languages. Lists allow the programmer to store multiple types of data in a single\
    \ longer variable, and call it back using the reference number contained in the\
    \ list.\n\nLists are declared by having brackets beside the variable name, which\
    \ tells Python to read it as a list. For example, `List == \"Hello\"` will simply\
    \ be considered as the String `List` containing the \"Hello\" data. However, `List[0]\
    \ == \"Hello\"` will allow Python to store \"Hello\" in the first element of a\
    \ list. Note that the index of lists begin with '0', not '1', so the first container\
    \ of a list is `[0]`.\n\nLists can contain multiple data types within them, and\
    \ lists can even contain lists inside them. While it may be difficult for a person\
    \ to keep track if the dimensions become too many, two dimensional lists are commonly\
    \ used. `List[[], []]` is an example of a two dimensional list, where the first\
    \ bracket refers to the \"row\", and the second bracket refers to the \"column\"\
    , which is a visual aid many use in order to keep track of how the list stores\
    \ data. \n\nLists in Python are dynamic, meaning that they can store multiple\
    \ data types and have the values contained changed as the program needs them to,\
    \ which differentiates them from a similar data type, the `Tuple`. Now our libraries\
    \ that we have imported give us the ability to access the data set easily, and\
    \ as it has been imported in an array form as declared, we can simply call it\
    \ using the `shape` property written into our modules like so:\n\n```\nprint(dataset.shape)\n\
    ```\n\nThat simple line of code instructs the machine to pull the \"shape\" of\
    \ the dataset, or how many rows and columns it has. As we already know the dimensions\
    \ of our data set, which is a hundred and fifty instances, or \"rows\", and five\
    \ attributes, or \"columns\", this command simply acts to verify, which it should\
    \ by returning a value of: `(150, 5)`.\n\n## Taking a Look at the Raw Data (Learning\
    \ the head() function)\n\nWhile most of the time programmers will not look at\
    \ the raw data when writing their code because it is not their job, and because\
    \ it's often too tedious to scroll past each and every element, there may be some\
    \ instances where it would be useful to be able to take a peek at a few elements\
    \ of the data set here and there. In order to do so, the command is as follows:\n\
    \n```\nprint(dataset.head(20))\n```\n\nThe `head` function instructs the program\
    \ to pull the first x data points from the data set, where x is the argument passed\
    \ into the `head` function. Once the dataset receives the `head()` function call,\
    \ it should print the following data points:\n\n```\nSepal - length sepal - width\
    \ petal - length petal - width species\n0 5.1 3.5 1.4 0.2 Iris-setosa\n1 4.9 3.0\
    \ 1.4 0.2 Iris-setosa\n2 4.7 3.2 1.3 0.2 Iris-setosa\n3 4.6 3.1 1.5 0.2 Iris-setosa\n\
    4 5.0 3.6 1.4 0.2 Iris-setosa\n5 5.4 3.9 1.7 0.4 Iris-setosa\n6 4.6 3.4 1.4 0.3\
    \ Iris-setosa\n7 5.0 3.4 1.5 0.3 Iris-setosa\n8 7.0 3.2 4.7 1.4 Iris-versicolor\n\
    9 6.4 3.2 4.5 1.5 Iris-versicolor\n10 6.9 3.1 5.1 1.5 Iris-versicolor\n11 5.5\
    \ 2.3 4.0 1.3 Iris-versicolor\n12 6.5 2.8 2.6 1.5 Iris-versicolor\n13 5.6 2.7\
    \ 4.5 1.5 Iris-versicolor\n14 6.3 3.3 5.0 1.5 Iris-versicolor\n15 5.8 2.7 5.1\
    \ 1.9 Iris-versicolor\n16 7.1 3.0 5.9 2.9 Iris-virginica\n17 6.3 2.9 5.0 1.8 Iris-virginica\n\
    18 6.5 3.8 4.1 1.5 Iris-virginica\n19 5.7 2.8 4.5 3.1 Iris-virginica\n```\n\n\
    The above should come out as output from the `head()` function, which allows the\
    \ programmer to call the first few elements of the given data set.\n\n## Statistical\
    \ Summary of Data Set (The describe() function)\n\nNow that we know how to obtain\
    \ the dimensions of the data set, as well as take a peek at the first \"x\" elements\
    \ of each set, another handy tool we can use to parse our data set is to examine\
    \ the statistical summary of the elements. The tool that we need in order to do\
    \ this is the `describe()` function, which gives us eight attributes: the count\
    \ of elements, the mean, the standard, the minimum and maximum values, as well\
    \ as three percentiles: twenty five percent, fifty percent, and seventy five percent.\
    \ In order to use the `describe()` function, we write a line of code as follows:\n\
    \n```\nprint(dataset.describe())\n```\n\nWith our given data set, it will summarize\
    \ and display the various attributes that `describe()` uses, as listed above.\
    \ This will result in a table being output, looking something like this:\n\n|\
    \ | sepal-length | sepal-width | petal-length | petal-width |\n|---|---|---|---|---|\n\
    | count | 150.000000 | 150.000000 | 150.000000 | 150.000000 |\n| mean | 5.843333\
    \ | 3.054000 | 3.758667 | 1.198667 |\n| std | 0.828066 | 0.433594 | 1.764420 |\
    \ 0.763161 |\n| min | 4.300000 | 2.000000 | 1.000000 | 0.100000 |\n| 25% | 5.100000\
    \ | 2.800000 | 1.600000 | 0.300000 |\n| 50% | 5.800000 | 3.000000 | 4.350000 |\
    \ 1.300000 |\n| 75% | 6.400000 | 3.400000 | 5.100000 | 1.600000 |\n| max | 7.900000\
    \ | 4.400000 | 6.900000 | 2.500000 |\n\nNote that as the species category simply\
    \ consists of string variables, the `describe()` function is not capable of describing\
    \ them in the given data types, so we only have four columns rather than five.\n\
    \n## Examining the Class Distribution of the Given Data Set (using the groupby()\
    \ function)\n\nHowever, though the previous function, describe () was not able\
    \ to give a description of the classes (our `species` variable), there is a function\
    \ that examines how exactly the various classes are distributed. This function\
    \ is the `groupby()` function, which clusters each element together. This function\
    \ can be called by typing the following line:\n\n```\nprint(dataset.groupby(\"\
    species\").size())\n```\n\nThe argument of the `groupby` function is the particular\
    \ class type that we are looking for, which in this case is the `species` variable.\
    \ The line that we have should result in the following output, given our data\
    \ set:\n\n```\nspecies\nIris-setosa      50\nIris-versicolor   50\nIris-virginica\
    \     50\n```\n"
