    \ seen from the previous code, there are differing data models that statisticians\
    \ and data scientists use in order to parse, organize, and test various data and\
    \ observations. In this chapter we will be examining these models in order to\
    \ give the reader a better understanding of how they were developed, when best\
    \ to use them, and what kind of data they work best with.\n"
