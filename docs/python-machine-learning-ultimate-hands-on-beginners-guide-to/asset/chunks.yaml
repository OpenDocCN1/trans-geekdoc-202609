    # 汇总数据集


    此时，得益于之前的两个步骤，我们已经拥有了程序所需的数据以及分析这些数据的工具。现在，我们必须学习如何操作这些数据以获得实质的结果。在这一步中，我们将尝试完成四件事：


    1. 首先，我们将获取可用数据集的维度。

    2. 第二，我们将尝试查看原始数据本身。

    3. 第三，我们将尝试获取每个属性的统计摘要。

    4. 第四，也是最后，我们将尝试根据 `species` 变量对数据进行分类。


    ## 寻找数据集的维度（学习 shape 属性）


    还记得 Python 中的数组（arrays）和列表（lists）是如何工作的吗？每个数组/列表都可以被想象在二维空间（或三维或更多空间），因此，如果我们使用二维数组，就可以按列或行来组织数据。


    ### List 类型

    `List` 数据类型是组织数据时最有用的数据类型之一。`list` 数据类型在其他编程语言中通常被称为“数组”（array）。列表允许程序员在单个长变量中存储多种类型的数据，并使用列表包含的引用索引来调用它。


    列表是通过在变量名旁边加上括号来声明的，这告诉 Python 将其视为列表。例如，`List == "Hello"` 将被简单视为包含 "Hello" 数据的字符串
    `List`。然而，`List[0] == "Hello"` 将允许 Python 将 "Hello" 存储在列表的第一个元素中。注意列表的索引从''0''开始而不是''1''所以列表的第一个容器是
    `[0]`。


    列表内部可以包含多种数据类型，列表甚至可以嵌套列表。虽然对于人类来说，如果维度太多，可能很难追踪，但二维列表被常用。`List[[], []]` 是一个二维列表的示例，其中第一个括号指的是“行”，第二个括号指的是“列”，这是许多人使用的视觉辅助工具，以便跟踪列表如何存储数据。


    Python 中的列表是动态的，这意味着它们可以存储多种数据类型，并根据程序需要更改其中包含的值，这使它们与相似的数据类型 `Tuple`（元组）区分开来。现在，我们导入的库使我们能够轻松访问数据集，由于它是按照声明的那样以数组形式导入的，我们可以像这样使用模块中编写
    `shape` 属性来调用它：


    ```

    print(dataset.shape)

    ```


    这一行简单的代码指示机器提取数据集的“形状”（shape），即它有多少行和列。由于我们已经知道了数据集的维度，即 150 个实例（或“行”）和 5 个属性（或“列”），此命令的作用仅仅是验证，它应该通过返回一个值：`(150,
    5)`。


    ## 查看原始数据（学习 head() 函数）


    虽然大多数时候，程序员在编写代码时不会查看原始数据，因为这不是他们的工作，而且滚动查看每一个元素通常太无味了，但在某些情况下，能够这里那里查看数据集的几个元素可能是很有用的。为了做到这一点，命令如下：


    ```

    print(dataset.head(20))

    ```


    `head` 函数指示程序从数据集中提取前 x 个点，其中 x 是传递给 `head` 函数的参数。一旦数据集接收到 `head()` 函数调用，它应该打印以下数据点：


    ```

    Sepal - length sepal - width petal - length petal - width species

    0 5.1 3.5 1.4 0.2 Iris-setosa

    1 4.9 3.0 1.4 0.2 Iris-setosa

    2 4.7 3.2 1.3 0.2 Iris-setosa

    3 4.6 3.1 1.5 0.2 Iris-setosa

    4 5.0 3.6 1.4 0.2 Iris-setosa

    5 5.4 3.9 1.7 0.4 Iris-setosa

    6 4.6 3.4 1.4 0.3 Iris-setosa

    7 5.0 3.4 1.5 0.3 Iris-setosa

    8 7.0 3.2 4.7 1.4 Iris-versicolor

    9 6.4 3.2 4.5 1.5 Iris-versicolor

    10 6.9 3.1 5.1 1.5 Iris-versicolor

    11 5.5 2.3 4.0 1.3 Iris-versicolor

    12 6.5 2.8 2.6 1.5 Iris-versicolor

    13 5.6 2.7 4.5 1.5 Iris-versicolor

    14 6.3 3.3 5.0 1.5 Iris-versicolor

    15 5.8 2.7 5.1 1.9 Iris-versicolor

    16 7.1 3.0 5.9 2.9 Iris-virginica

    17 6.3 2.9 5.0 1.8 Iris-virginica

    18 6.5 3.8 4.1 1.5 Iris-virginica

    19 5.7 2.8 4.5 3.1 Iris-virginica

    ```


    以上内容应该是 `head()` 函数的输出，它允许程序员调用给定数据集的前几个元素。


    ## 数据集的统计摘要（describe() 函数）


    现在我们已经知道如何获取数据集的维度，以及如何查看每个集合的前 "x" 个元素，另一个我们可以用来来解析数据集的方便工具是检查元素的统计摘要。我们执行此操作所需的工具是
    `describe()` 函数，它给了我们八个属性：元素计数、平均值、标准差、最小值和最大值，以及三个分位数：25 百分比、50 百分比和 75 百分比。为了使用
    `describe()` 函数，我们写了如下代码行：


    ```

    print(dataset.describe())

    ```


    对于我们给定的数据集，它将汇总并显示 `describe()` 使用的各种属性，如上面所示。这将输出一个表格，看起来如下所示：


    | | sepal-length | sepal-width | petal-length | petal-width |

    |---|---|---|---|---|

    | count | 150.000000 | 150.000000 | 150.000000 | 150.000000 |

    | mean | 5.843333 | 3.054000 | 3.758667 | 1.198667 |

    | std | 0.828066 | 0.433594 | 1.764420 | 0.763161 |

    | min | 4.300000 | 2.000000 | 1.000000 | 0.100000 |

    | 25% | 5.100000 | 2.800000 | 1.600000 | 0.300000 |

    | 50% | 5.800000 | 3.000000 | 4.350000 | 1.300000 |

    | 75% | 6.400000 | 3.400000 | 5.100000 | 1.600000 |

    | max | 7.900000 | 4.400000 | 6.900000 | 2.500000 |


    注意，由于物种类别仅由字符串组成，`describe()` 函数无法以给定的数据类型对其描述，因此我们只有四列而不是五列。


    ## 检查给定数据集的类别分布（使用 groupby() 函数）


    然而，尽管之前的函数 `describe()` 无法对类别（我们的 `species` 变量）进行描述，但有一个函数可以检查各个类别是如何分布的。这个函数是
    `groupby()` 函数，它将每个元素聚集在一起。可以通过输入以下行来调用该函数：


    ```

    print(dataset.groupby("species").size())

    ```


    `groupby` 函数的参数是我们要寻找的特定类别类型，在这种情况下是 `species` 变量。在我们给定的数据集，该行应该产生如下输出：


    ```

    species

    Iris-setosa      50

    Iris-versicolor   50

    Iris-virginica     50

    ```


