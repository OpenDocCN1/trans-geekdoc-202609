  \ 396–403.\n\n# 第 4 章 不同遮照率下光伏系统行为的建模与仿真\n\nMohammed Benchrifa\n\n摩洛哥拉巴特 穆哈默德五世大学\n\
  \n\n\n## 4.1 引言\n\n近年来，世界对能源的需求在所有领域都显著增长，包括工业、农业、交通……[[1, 2 和 3]。遗憾的是，这些大部分能源来自化石燃料，对环境具有非常有害的影响。因此，为了尽量减少污染对环境的影响，可再生能源是理想的解决方案。因此，多个国家已经在可再生能源领域投入了巨资[4,\
  \ 5]。根据定义，可再生能源是指从理论上无限、无时间限制或再生速度快于消耗速度的或资源产生能量的方法。\n\n可再生能源通常被认为与化石燃料能源对立，后者的储量有限且在人类尺度上是不可再生的[6,\
  \ 7]。这种新型能源包括风能（来自风力）、潮汐能（来自波浪和潮汐运动）和太阳光伏能。这种光伏能是指利用半导体材料将阳光直接转化为电能。\n\n光电效应最初由\
  \ E. Becquerel 在 1839 年发现的[8, 9]，他发现某些材料在光照下会产生少量的电。随后，在 1912 年，阿尔伯特·爱因斯坦解释了光电效应[10]，但直到\
  \ 2 世纪 50 年代初，它才在硅光伏（PV）电池中投入应用，其效率水平为 4.5%[11, 21]。\n\n光伏在许多国家的发电占比中已不再处于边缘地位，其用量继续快速增长。然而，这种电力往往具有高度波动性和分散性的特点，这在尝试将这种发电整合到电网时可能会导致问题。因此，理解光伏组件在不同条件下的行为变得越来越重要，以确保生产的可靠性并促进其并入电网[12,\
  \ 13]。\n\n一个光伏系统由几个部分组成：串联并的光伏组件；将组件直流能转换为交流能的逆变器；一套布线系统；以及电池或传输网络[16, 17, 18, 19,\
  \ 20, 21]。\n\n在光伏技术中，很明显组件并不一定能保持其初始性能。某些组件在长时间运行时可能会降化甚至失效。多项研究发现，光伏系统的可靠性高度取决于用于制造光伏组件的材料、温度、湿度和太阳辐射[23,\
  \ 24, 25]。\n\n在此背景下，我们可以注意到光伏发生器常见的缺陷是遮照故障[26, 27, 28, 29, 30, 31]。遮照故障通常由多种原因引起，例如鸟粪、灰尘、雪以及植被和电缆等障碍物……事实上，在本章中，我们特别关注遮照对光伏组件性能的影响。为了可视化这种影响，我们通过改变\
  \ 10%到 100%的遮照率对组件的行为进行了多次仿真。\n\n## 4.2 材料与方法\n\n### 4.2.1 MATLAB/Simulink 介绍\n\n\
  Simulink 是一种用于多域仿真和建模设计的框图环境。它支持系统级设计与仿真、自动代码生成以及嵌入系统的持续测试与验证[32]。\n\n### 4.2.2\
  \ PVSyst 介绍\n\nPVSyst 软件是一种用于离网和并网光伏系统的仿真和计算软件。它由日内瓦大学建立，A. Mermoud 设计。PVSyst 软件有多个输入参数：每月平均太阳辐射、每月平均温度、能量需求、光伏组件的选择及其倾角、电池的选择、充电控制器、逆变器的选择、自持天数输入、太阳覆盖率以及投资成本（材料采购、系统安装成本）。仿真的主要结果是所需的场功率。仿的主要结果是所需的场强、存储容量、组件在特定条件下的特性以及每千瓦时（kWh）的成本[33]。\n\
  \n## 4.3 结果与讨论\n\n### 4.3.1 太阳能电池特性\n\n\n\n\n\n在给定的照射下，光伏电池的特性通过电流电压曲线（`I-V`）来描述，该曲线代表了电池可以采取的所有电气配置。三个物理量定义了这条曲线。第一个量是开路电压\
  \ `Vco`；该值代表未连接的受照电池产生的电压。第二个量是短路电流 `Icc`；该值代表自身短路的的受照电池产生的电流。第三个量是在获得最佳电压和电流时得到的最大功率点（`PMPP`）：`Vopt`、`Iopt`（有时也称为\
  \ `Vmpp`、`Impp`）。\n\n我们还可以绘制一条表示功率随电压变化的特性曲线。在这种情况下，可以清楚地观察到电压 `Vmp` 下的最大功率（图 4.1）。\n\
  \n\n图 4.1 光伏电池的电流电压和功率-电压特性曲线。\n\n### 1. 光伏面板的阴影影响\n\n阴影是光伏安装的首要敌人。被遮挡的电池会限制产生的功率。因此，选择一个尽可能不受环境阴影影响的位置至关重要。\n\
  \n当光伏单元的一部分被遮挡时，组件的这部分照射不足区域可能会发生反向极化。这意味着照射不足的部分的行为不像一个发电机，而是一个接收器（电阻）。因此，照射不足的部分将通过耗散某些功率作为热量来充接收器，这将导致照射不足区域温度升高。这就是反自极化效应。这种局部加热可能会导致热点，从而损坏受影响区域并永久性降低光伏组件的性能。\n\
  \n阴影有两种类型：全阴蔽和部分阴蔽。全阴蔽阻隔了所有辐射（直接辐射和间接辐射）到达光伏电池的任何部分（例如鸟粪、电池板上的树枝、覆盖物）。相比之下，部分阴蔽仅阻止直接辐射到达光伏电池的一部分（例如云层）。\n\
  \n通常，光伏组件的电池是串联连接的。因此，最薄弱的电池将决定并限制其他电池的功率。遮挡其中一个电池的一半或一排电池的一半将根据电池阴影面积的百分比按比例降低功率，在本例中降低\
  \ 50%。一排电池的总阴蔽可以将组件的功率降至零。\n\n还有三种不同的阴影配置。第一种配置是单电池阴蔽，采用的程序确保只有组件中的一个太阳能电池被遮挡。电池的隐藏部分代表阴蔽率。第二种配置是垂直阴蔽（对于\
  \ N 个电池）；在这种情况下，阴影与每个被遮挡的电池平行。第三种配置是垂直或水平阴蔽（对于 N 个电池）；在这种模式下，程序由用等于单个电池表面的覆盖物遮挡组件的电池，使得阴影图案垂直于所有电池，从而确保相同的阴蔽率。\n\
  \n### 2. 阴影对最优 PMPP 功率模拟的影响。\n\n为了说明阴影对光伏设备行为的影响，我们选择一个具有 36 个硅多晶电池、峰值功率为 60 W 模型。我们将电池温度固定在\
  \ 30°C。我们假设电池被遮挡了 `p` 百分比。我们通过以 10% 为步长改变阴蔽百分比来确定最大功率 `PMPP`。我们得到的图如下（图 4.2）。\n\n\
  \n图 4.2 在照度强度为 1000 W/m² 下，电流随电压的变化，阴蔽率分别为 (a) 10%, (b) 20%, (c) 30%, (d) 40%, (e)\
  \ 50%, (f) 60%, (g) 70%, (h) 80 %, (i) 90%。\n\n对于每种阴蔽率（图 4.2），在确定了 0% 到 100% 之间阴蔽率对应的最大功率后，存在相应的最大功率。然后绘制表示这种变化的曲线。\n\
  \n（图 4.3）显示在没有阴影的情况下，PMPP 等于所用组件的峰值功率（60 W）。虽然该 PMPP 随着阴蔽率的增加而减少，但在阴蔽率为 100% 时它趋于\
  \ 0。\n\n\n图 4.3 最大功率 (PMPP) 变化。\n\n`I(V)` 和 `P(V)` 的一般形状显示，由于阴蔽的增加，光伏面板的特性发生了显著畸变。确实，随着阴蔽率的增加，组件的短电流减小（见\
