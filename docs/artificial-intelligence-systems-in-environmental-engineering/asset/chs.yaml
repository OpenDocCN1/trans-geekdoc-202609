  \ | 9.51 | 中钙砂 |\n| E1 | 94.77 | 0.55 | 4.52 | 低钙砂 |\n\nWadi Issen 的松散样本通常不那么钙化，65%\
  \ 的样本是非钙性的或弱钙性的。31% 的样本为中钙性的，仅有一个样本为强钙性的，占样本总数的 4%。后者主要由 Issen 河 右岸支流运送，这些支流起源于主要由碳酸盐海洋和湖泊沉积组成的侏罗纪南北高原。上游段的\
  \ Aoujgal 支流 `E26` 就是这种情况，它横穿了北部的 Ida-Ou-Bouzia 丘；而下游段排水南部 Ida-Ou-Tanan 丘的三个支流分别是\
  \ `E4`、`E2` 和 `E3`，来自 Agadir Imouzgaou、Tasadamt 和 Alemzi。这条河流运送了强碳酸盐沉积物和巨大的石灰岩块，直接向\
  \ Abdelmomen 大坝提供钙砂。\n\n如果径流溶解碳酸盐地层，热量将使水中石灰岩沉淀，从而增加砂土中颗粒状石灰岩的含量。这就是泥质含量极低（`1%`）的钙砂形成形成。\n\
  \n\n\n\n\n边缘未显示磨光或圆化痕迹的磨损形态完全缺失，并不一定意味着沉积是近期的。然而，这至少让我们能够误读所有颗粒，特别是那些由上游 Issen 支流流向上游盆地的沉积物颗粒（如\
  \ `E24` 和 `E17` 的某些颗粒）。另一方面，常见的受撞多面体并不表示由于长距离路径导致的磨损，而是与沿 Oued Issen 建立的采石场冲击有关，如样品\
  \ `E17` 所示。样品 `E17` 和 `E5` 的某些颗粒显示包裹体或杂质，这可能证明酸溶解后替换的假设。结晶空隙会削弱石英的晶体完整性，从而有利于机械冲击，产生许多微裂纹、碎片和片。这进一步证明了其他结晶和再结晶因素在颗粒形态表征中的影响。\n\
  \n### 1.4.3 石英颗粒球率统计分析\n\n除了表面状态外，我们计算了另一个描述形状的参数，即石英颗粒的球率。这让我们能够通过分析 SEM 图像来解释颗粒圆度的演变。对\
  \ 43 个石英颗粒纹理进行统计分析的基本结果如表 1.3 所示，石英颗粒圆度的分布如图 1.8 所示。\n\n\n[图 1.8 Issen Wadi 不同位置石英颗粒圆度的演变。\n\
  \n该参数是根据来自 Issen 床层四个样品的石英颗粒外显观察数字照片分析数据评估的。所得结果证实并完善了形态学观察的结果。为了研究石英颗粒圆度的空间变化而进行的方差分析显示，在\
  \ 10% 的显著性水平和标准差（`0.04` 到 `0.039`）下，不同位点的颗粒参数存在显著差异（表 1.4）。均值最低出现在上游的样品 `E5`，而最高值出现在下游的样品\
  \ `E24`。球率最大值记录于样品 `E24`，而偏度最高值出现在样品 `E5`。最小球率参数记录于样品 `E5`。事实上，该位置所研究参数的低水平主要源于下游岩石的剥落（图\
  \ 1.7）。\n\n表 1.4 SEM 测定的样品石英颗粒球率参数统计\n\n| --- | --- | --- | --- | --- |\n| 数数 |\
