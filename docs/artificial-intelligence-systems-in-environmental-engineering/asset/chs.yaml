  \ 和 `K2O`）（表 3.2）（Regni et al., 2016）。事实上，在土壤中添加橄渣肥通常增加了水溶性有机碳和氮的总浓度，后者主要有助于植物叶片和地上部的发育；钾有助于植物的汁液循环和养分吸收；而磷则刺激根系发育、开花和结果（Cao\
