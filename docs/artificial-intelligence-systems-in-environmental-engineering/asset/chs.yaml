  \ 进行精准气候管理的智能温湿度控制系统\n\nNajlaa Ben-Lhachemi\n摩洛哥拉巴特摩洛穆哈默德五世大学\n\nMohammed Benchrifa\n\
  摩洛哥拉巴特摩穆哈默德五世大学\n\nIbn Tofaïl 大学—肯内特拉园区，摩洛哥肯内特拉\n\nSouad Nasrdine, Jamal Mabrouki,\
  \ Miloudia Slaoui\n摩洛哥拉巴特摩穆哈默德五世大学\n\nDOI: [10.1201/9781003436218-7](https://dx.doi.org/10.1201/9781003436218-7)\n\
  \n## 7.1 引言\n\n工业 4.0 建立在前三次工业革命的原则之上，这些革命分别涉及蒸汽动力、电能和计算机。物联网（IoT）、人工智能（AI）、云计算和机器人技术等先进技术正在整合到这第四次工业革命中，以实现机器之间的通信和自主决策。\n\
  \n其中一项技术就是 AI，它能够通过学习和发展、预测、与其他系统交互，并最终通过评估人类无法处理的海量数据，做出比人类更准确的判断，且误差范围更小。\n\n\
  AI 可以帮助农业部门提高生产力和效率 (5)。最有前景的农业解决方案之一是使用自动化智能温室，因为人类缺乏有效维护这些温室并调节植物生长条件所需的知识和经验。根据\
  \ Chrysanthos Maraveas 的一项研究，智能温室使用了机器人系统、仿生算法、能量管理、机器路径规划、无人机和图像处理在内的多种 AI 技术。商业上可行的农业\
  \ AI 技术不断增多，为农民提供了更高的投资回报、更大的作物产量和更高的资源利用率 [1]。\n\n通过利用传感器和网络应用程序收集的信息进行最佳远程控制，AI\
  \ 可用于远程管理植物生长、温室气候和营养水平。利用这些能力，可以实时跟踪和更改作物参数，以增加产量并减少疾病和天气变化带来的损失。\n\n在另一项研究中，Axel\
  \ Escamilla-Garcia 等人研究了人工神经网络（ANN）在温室技术中的应用，并强调了其与物联网、机器学习（ML）、图像分析和大数据等其他 4.0\
  \ 技术集成的潜力。目前，关于监测方法和管理温室环境的方法有很多研究。报告显示，额外的 ANN 开发研究可以增强其在智能农业和温室生产中的作用 [2]。\n\n\
  2018 年在瓦格宁大学，全球五个小组参加了一项竞赛，将 AI 算法应用于调节科技温室的气候、灌溉和作物生长。在展示团队成果时，Silke Hemming 等人评估了不同气候如何影响作物发育，并讨论了未来提高作物产量和财务表现的教训\
  \ [3]。\n\n在这项工作中，我们将利用 AI 的优势来远程控制温室内部的温度和湿度。我们将提出用于优化控制的流程，同时允许农民在连接互联网的情况下根据需要远程监控并更改参数。\n\
  \n## 7.2 文献综述\n\n### 7.2.1 AI 在温室农业中的应用\n\n人工智能（AI）在温室种植中具有提高作物产量、降低成本和提高生产力以变革农业部门的潜力。\n\
  \nBhanuka Senavirathne 等人在研究中将与温室连接的子系统分为几大类。其中之一是温度调节，这对于保持温室处于适合植物生长的正确温度至关重要。控制湿度是下一步，因为有助于防止真菌感染并管理植物蒸腾。为了给植物提供生长所需的养分，确定最佳营养也至关重要。泵用于浇溉植物并提供它们所需的营养。除了维持温度和湿度外，空气通风对于调节二氧化碳浓度也关重要。最后，人工光被用于延长植物光照时间并为植物生长提供充足的光线\
  \ [4]。\n\n可以使用步骤来概述有效高效控制温室子系统的关键组成部分。首先利用传感器和执行器进行数据采集。传感器收集各种变量的数据，包括温度、湿度、空气质量等。这些设置由执行器控制，以保持环境最有利于植物发育。然后通过对获得的数据进行分析预测温室性能。这使得对温室环境做出判断成为，有助于优化生长条件以获得可能的最高产量和质量。最后，建议使用网络应用程序远程监控和控制温室。借助此应用程序，农民可以远程监控温室状况，实时做出决策以优化生长条件，并控制各种温室子系统，包括灌溉、照明、冷却和通风。\n\
  \n### 7.2.2 局限性、挑战和未来方向\n\n在农业（特别是温室中）实施 AI 可能会遇到某些困难。自学习温室的建设成本很高，特别是考虑到更精确的传感器和控制器的成本。此外，创建该系统需要大量的准确数据。然而，由于许多技术尚未达到商业阶段，农业技术的采用是渐进的。除了传感器、摄像头和一些机器人外，大多数其他技术尚未在领域投入实践。提高摄像头和传感器准确性和有效性的开发正在进行中。机器人通常比人类速度更快、更准确，但它们无法完全取代人类。年轻一代农民比接触较少技术的老一代人更容易接受技术进步。\n\
  \n此外，科学家和工程师与农民以及行业专家合作，设计并实施满足他们的需求且在技术和财务上均可行的解决方案是至关重要的。\n\n需要研究创建能够考虑到农业生态系统复杂性的\
  \ AI 模型，包括植物、昆虫、细菌和土壤之间的相互。此外，研究人员可以考虑使用和开发自然启发的技术用于土壤处理、自动收获以及杀虫剂和肥料的施用。对于农民来说，这些工具更精确、更便宜且易于使用。\n\
  \n在农业中使用基于 AI 的技术可以帮助行业实现其可持续性、生产力和盈利目标。\n\n## 7.3 材料与方法\n\n\n\n\n\n温室远程气候控制系统通常包含若干常用元件：传感器、执行器、微处理器、用户界面和无线通信系统。执行器用于通过开启或关闭风扇或通风口来控制它们，而传感器则用于测量温室内部的各种环境状况，如温度和湿度。系统的核心——微控制器能够根据设定的温度设置处理传感器数据并控制执行器。通过用户界面（通常是网站或移动应用程序）可以实现远程监控和系统控制。由于提到，各种系统组件可以通过\
  \ Wi-Fi 或蓝牙等无线技术进行相互通信，并相互发送用户命令和温度数据，如图 7.1 所示。\n\n![图 7.1 带有 Arduino 的温度传感器 [5]。](images/fig7_1_B.jpg)\n\
  \n图 7.1 带有 Arduino 的温度传感器 [5]。\n\n![图 7.2 带有 Arduino 的湿度传感器 [6]。](images/fig7_2_B.jpg)\n\
  \n图 7.2 带有 Arduino 的湿度传感器 [6]。\n\n传感器是衡量环境许多层面的工具，包括温度、湿度、光照、空气质量等。利用传感器收集的信息，可以实时改变温室内的环境状况。在传感器收集信息的基础上，执行器是调节温室环境状况的设备。得益于通信网络，传感器收集的数据和执行器发出的命令可以在控制系统与温室之间传输。众多设备可以通过\
  \ Wi-Fi 或蓝牙等无线技术连接在一起。控制系统是能够实现监控和管理各种温室设备的计算机程序。此外，它们还可以用于收集数据、评估数据，并根据某些植物的需求制定控制计划。\n\
  \n## 7.4 结果与讨论\n\n### 7.4.1 一种温室控制智能系统的建议\n\n利用传感器，系统（图 7.3）会跟踪温室内部的温度和湿度水平。人工智能（AI）用于评估获取的数据，并发现可能揭示问题或改进温室环境状况的趋势和模式。如果温度或湿度超过预设限值，微处理器会向执行器发送指令，在温度情况下使用冷却或加热系统进行调节，在湿度情况下使用加湿器或除湿器调节。控制系统持续评估温室的环境状况，并根据收集的信息修改给执行器的指令。\n\
  \n![图 7.3 所提议系统的示意图。](img/fig7_3_B.jpg)\n\n图 7.3 所提议系统的示意图。\n\n可以集成用户界面，允许用户实时监控温湿度并根据需要远程修改参数。得益于无线通信系统，用户可以在任何连接互联网的地方监控和管理该系统，这为农民的远程监控提供了便利。\n\
  \n温室温度与预期温度之间的差异（即图 7.4 所示的温室温度控制过程的输入值）决定了主控制器所选的执行器类型（加热或冷却）。与图 7.4 类似，实际湿度与目标湿度之间的差异被用于控制图\
  \ 7.5 中的湿度。在这种情况下，除湿器和加湿器充当执行器。\n\n![图 7.4 显示温度控制过程的流程图。](img/fig7_4_B.jpg)\n\n\
  图 7.4 显示温度控制过程的流程图。\n\n![图 7.5 显示湿度控制过程的流程图。](img/fig7_5_B.jpg)\n\n图 7.5 显示湿度控制过程的流程图。\n\
  \n## 7.5 结论\n\n尽管人口扩张，在农业中使用人工智能可能是保障粮食安全的一种方式。人工智能通过提供精确的天气预报、土壤和作物管理指导以及预防植物病虫的帮助，可以协助农民优化生产并用更少的资源产生更多食物。这有助于减少对环境的影响并确保农业生产的长期可持续性，同时满足全球对食物日益增长的需求。此外，人工智能通过提供有关作物、土壤、天气和市场的准确、精确和实时数据，实现了知情决策，可以帮助农民实现产量最大化并防止损失。\n\
  \n在本研究中，我们介绍了一种利用人工智能管理温室气候的系统。人工智能可以通过传感器评估湿度温度水平来实时改变环境以改善植物生长。例如，如果 CO[2] 水平过低，AI\
  \ 可以改变通风以增加新鲜空气流量；或者在湿度过高时启动风扇循环空气。同样，如果温度升高过多，AI 可以启动冷却设备以将温度保持在理想水平。通过最大化资源利用，这帮助农民增加产量、减少损失并节约能量。此外，种植者可以通过实时监控温室状况对疾病或害虫等可能出现做出快速反应，这有助于降低损失并提高作物质量。最终，旨在提高生产力和产品质量的园艺师可能会发现使用人工智能调节气候是一个实用的工具。\n\
