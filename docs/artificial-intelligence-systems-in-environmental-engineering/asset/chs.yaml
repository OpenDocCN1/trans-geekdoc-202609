  Rachid Tadili\nV 大学\n摩洛哥\n\n# 1. 第 1 章 来自西大特拉斯山脉伊森河谷（Issen Wadi）石英颗粒的扫描电子显微镜（SEM）观察\n\
  \n## 1.1 引言\n\n土壤侵蚀是全球范围内环境最严重的威胁之一 (Mondal et al., 2015)。流域的动态主要取决于环境条件、气候、地质和土地利用情况\
  \ (Rollet, 2007)。在全球范围内，超过 50%的沉积物被水坝拦截 (Vörösmarty et al., 2003)。其他研究还表明，河流固体输入（沙、、石和粘土）的沉积学特征为侵蚀地区和沉积物来源提供了很好的信息\
  \ (Elouden et al., 2005)。石英颗粒表面的微纹理为沉积物的历史提供了见解，特别是明确了运移媒介的性质 (Soyer, 1969)。因此，已列出\
  \ 250 个特征 (Mahaney, 2002)。粒度和岩物学结果结合其他显微性质的研究，将为阿德尔穆门大坝淤积区域的制图做出贡献 (Ed-Dakiri et\
  \ al., 2022)。伊森流域位于一个干旱至半干旱气候区；其特征是面积巨大、地形起伏大、气候过程多样、地形地貌因素变化以及岩性类型多样。伊森盆石英颗粒的显微分析有助于了解流域环境和河谷动态，也可与大阿特拉斯山脉和苏苏斯河右岸的其他流域进行比较。本研究的目标包括：(1)\
  \ 概述伊森盆碎砂质沉积物钙化速率的分布；(2) 利用相关知识解释影响石英颗粒演变的（主要是主干道中的）不同形状和痕迹；(3) 推断主要石英颗粒的空间运移过程，并与主河及主要支流的侵蚀因素和水流起来。\n\
  \n## 1.2 研究区域、数据与方法\n\n### 1.2.1 案例研究：伊森河大流域\n\n\n\n\n\n伊 ssen 盆地是苏斯（Souss）流域重要的分水岭，是摩洛哥中西部苏斯河（Souss\
  \ Wadi）的支流（Ait Haddou et al., 2023）。研究区域 Issen 流域是苏斯河下游的一处干旱地区，面积约 1300 公顷，长约 60\
  \ 公里，宽 35 公里（Ait Haddou et al., 2022a）。拟议的研究流域周长为 218.17 公里，径流密度为 0.85km⁻¹，贯穿干流长度为\
  \ 63 公里。其位于以下经纬度之间，呈东北-西南方向，宽度分别为北纬 30°64' 和 31°07' 以及西经 8.72° 和 9.31°（图 1.1）。它是西部高亚特拉斯山脉（WHA）南部边缘最大的子流域，该流域流经南部亚特拉斯冲积。在该河的河口，建造了\
  \ Abdelmomen 大坝，以确保阿加迪尔大都市约百万人的饮用水供应，这面临着若干环境挑战。从地质上划分，Issen 盆地可分为三个不同区域。东部由高亚特拉斯山的古生纪地体或古代块边界，西部由侏罗纪和白垩纪高原边界（图\
  \ 1.2）。Issen 流域的构造、岩性学和外部地动力学特征表明其地貌对比剧烈（Ait Haddou et al., 2022b）。\n\n\n图 1.1 摩洛哥中西部\
  \ Issen 河的位置及其 Issen 河水域的景观。\n\n\n图 1.2 Issen 盆地的简化地质图和样本位置，摘自 Argana 回廊地质图 (1/100,000)\
  \ (Tixeront, 1974)。\n\n该研究区域气候温暖干燥，平均气温约为 21.85°C。Issen 流域中部平均年降雨量为 302 mm，年蒸发量为\
  \ 2278 mm/year。整个流域的平均降雨侵蚀性约为 537.64 MJ.mm/ha.h.yr（Ait Haddou et al., 2020, Ait\
  \ Haddou et al., 2022b）（图 1.3）。径流的每月和季节分布主要取决于受地中海气候影响的冬季降雨以及其暴发性的物理特性。此外，计算出的 1981–2013\
  \ 年年际流量平均值之间的相关性约为 70%。Issen 河的支流为季节性，每年平均流量几次，主要在冬季和秋季（9 月至次年 2 月）。其他结果强调，Argana\
  \ 盆地的地下水资源非常有限（Ait Haddou et al., 2023）。通常情况下，岩性、土壤类型、气候和河流系统是影响空间水文变率的最常见的参数。\n\
  \n\n图 1.3 Issen 盆地及相邻区域年降水量和降雨侵蚀性的分布。（数据来源：ABH, DREFL; Ait Haddou et al., 2020,\
  \ 2022b.）\n\n### 1.2.2 沉积物\n\n在本研究中，Issen 河的主道采样自 Ait Bkhr 河和 Ait Moussi 河（Issen）的汇合处至\
  \ Abdelmomen 大坝。根据位置和物理限制，采样距离在 3 到 6 公里之间。采样是使用铲子沿河道轴线深度 30 厘米处采集的。采集了约 0.5 kg\
  \ 的沉积物放入塑料袋中，然后标记并留作粒度分析和显微镜分析。\n\n表 1.1 显示了样本的位置、GPS 坐标和测站特征，这些特征也在图 1.2 的地图上所示。\n\
  \n| :--- | --- | :--- |\n| E24 | 12.64 | 上游部分 |\n| E22 | 16.71 | |\n| E20 | 22.56\
  \ | |\n| E17 | 27.64 | |\n| E14 | 33.10 | 中游部分 |\n| E12 | 38.04 | |\n| E25 | 41.65\
  \ | |\n| E9 | 43.73 | 下游部分 |\n| E7 | 48.37 | |\n| E5 | 54 | |\n\n## 1.3 方法\n\n对纹理的确定可以给观察到的材料赋予一个纹理类别（例如：粘质砂、砂质粘土）。这些纹理类别在“纹理三角形”中定义并表示。因此，所使用的图遵循了\
  \ Shepard (1954) 的纹理描述，而术语取自 Flemming (2015)。保留的粒度分类参考自 Blott and Pye (2001)。此外，表\
  \ 1.2 根据碳酸盐含量定义了所有的砂类。电子显微镜（SEM）分析是形态和分布的参考方法（Lee et al., 2019`; Bouchriti et al.,\
  \ 2022）。它们能够确定颗粒的沉积环境、历史，在某些情况下其地理起源（Fournier et al., 2012`）。所使用的方法是使用电子显微镜观察石英颗粒，它们用于确定形态（形状、球度和等）。样本制备和\
  \ SEM 成像是表面纹理观察的第一步，也是最重要的步骤（Vos et al., 2014`）。为了进行这项研究，从 Issen 主道采集了四个砂样本，这些样本在粒度研究中已经过处理，大部分颗粒包裹和粘附颗粒通过使用\
  \ 15% 稀释盐酸（`HCl`）和 50 g/l 焦酸钠溶液的浴法去除。然后用蒸馏水冲洗并干燥。本研究使用的电子显微镜配备了日本电子光学机械（JEOL）制造的\
  \ `SEM-EDS JEOL/EO`。表面分析在摩洛哥阿加迪尔本优尔大学科学学院的研究中心进行。除了表面状态，我们还计算了描述形状的另一个参数。这是石英颗粒的球度，允许我们通过分析\
  \ SEM 图像解释颗粒圆度的演变。\n\n\n\n\n\n使用三角分类法对沉积物进行分类基于三种矿物成分（即石英、粘土和方解石）的相对含量。根据表 1.2 的分类，沿\
  \ Issen Wadi 的样本均显示为低钙砂。其范围从 0.36% 到 16.51%，表明 Issen Wadi 所有调查区域的碳酸盐浓度均低于二十（<20%），相对于所研究的所有组分，这表明轻碳化。Issen\
  \ 盆地三个部分的石灰岩频率的变化汇总在表 1.3 中。\n\n### 表 1.3 Wadi Issen 样本中的总砂、粘土和石灰岩含量及碳酸盐水平\n| 样本\
