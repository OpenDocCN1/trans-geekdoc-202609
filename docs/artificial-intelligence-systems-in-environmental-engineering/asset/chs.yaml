  \n![图 9.5 生奶和热处理后牛奶样本中的 CFU 数量。](img/fig9_5_B.jpg)\n\n图 9.5 生奶和热处理后牛奶样本中的 CFU 数量。\n\
  \n生奶的物理化学分析显示，`SAFILIAT’s` 生奶符合所有分析标准。所有四个样本在 `AC`、`pH`、`MG`、`TP`、`EST` 和 `T` 方面保持稳定。`P2`\
  \ 样本在 `TA` 方面不稳定。在储存阶段（热处理一小时后），`TA` 分析值下降到 `76%`，尽管这会对该 `P2` 品种的稳定性构成威胁，但它符合公司标准。\n\
  \n### 9.4.2 牛奶的微生物分析\n\n该测试对 `84°C` 下处理 15 秒的四个牛奶样本进行，目的是确定生奶和热处理一小时后牛奶中的 `CFU`\
  \ 数量。结果如下表所示，所有四个样本在 `AC`、`pH`、`MG`、`TP`、`EST` 和 `T` 方面保持稳定。`P2` 样本在 `TA` 方面不稳定。在储存阶段（热处理一小时后），`TA`\
  \ 分析值下降到 `76%`，尽管这会对该 `P2` 品种的稳定性构成威胁，但它符合公司标准。\n\n 9.5 结论\n\n热处理是一种对生奶采用的强度较弱的热处理，在\
  \ 83°C 至 88°C 的温度下持续约 15 秒。该处理的目的是杀灭牛奶中的病原菌和大部分常见细菌菌群，尽管其强度低于巴氏杀菌。这些不同阶段确保了牛奶在储存或进一步加工前的质量和安全。\
  \ 物理化学分析显示，`SAFILIAT’s` 生奶符合所有分析标准。所有四个样本在 `AC`、`pH`、`MG`、`TP`、`EST` 和 `T` 方面保持稳定。`P2`\
