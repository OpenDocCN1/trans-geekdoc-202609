  \n使用化肥是一种全球性的做法，旨在提高土壤生产力。然而，过度或不当地使用这些化学品会对人类健康和环境产生有害影响（`Comoretto et al.`, 2007;\
  \ `Nicholls and Altieri`, 2014）。\n\n事实上，农业工业产生了大量的有机废物，这些废物可以被用作肥料，特别是在土壤通常缺乏有机质的地中海国家（`Martínez-Blanco\
  \ et al.`, 2011）。其中一个典型的例子是橄榄产业，该行业具有重大的经济和社会意义，并产生大量废物。\n\n在摩洛哥（全球最大的生产国），农业工业在短的收获季节内产生大量废物，这些废物的逐渐积累或处置不当会对环境产生不利影响。橄榄榨取过程的副产物包括果渣，这是一种通过双相或三相离心获得的湿态材料（`Ameziane\
  \ et al.`, 2018）。\n\n为了进行适当的堆肥，添加了多种调理剂：\n- 牛粪（`Ameziane et al.`, 2020）\n- 橄榄修剪枝（`Regni\
  \ et al.`, 2017; `Proietti et al.`, 2015）\n- 葡萄梗（`Baeta-Hall et al.`, 2005）\n- 锯末和杨树皮（`Filippi\
  \ et al.`, 2002）\n以改善孔隙性。在所有情况下，都获得了含有高有机质和大量营养的最终产品。\n\n然而，显然，应用生或堆后的果渣对土壤性质和作物产量有益（`López-Pieiro\
  \ et al.`, 2008; `Nicholls and Altieri`, 2014）。同样，果渣的使用改善了土壤生物活性（`Innangi et al.`,\
  \ 2017）。果渣改良剂的应用已从橄榄园扩展到草本作物种植（`Del Buono et al.`, 2011; `Alburquerque et al.`,\
  \ 2007; `Brunetti et al.`, 2005; `Tajada and Gonzalez`, 2004）。\n\n然而，滥用生果渣作为改良剂已显示出与发芽和根发育所需时间的问题，由于其高有机负荷、矿盐、低\
  \ pH 值以及植物毒性化合物的存在（`Proietti et al.`, 2015; `Gigliotti et al.`, 2012; `Del Buono\
  \ et al.`, 2011）。因此，堆肥是必要的，以稳定高有机负荷，并获得富含腐殖化合物、阳离子交换能力和保水能力的土壤改良剂（`Mekki et al.`,\
  \ 2013）。\n\n\n\n\n\n本工作的目的是研究由橄榄果渣和牛粪混合而成的堆肥在蚕豆种子萌发期间作为土壤改良剂的有效性。在萌发试验期间，测试了不同浓度的堆肥（5%、10%、15%、20%\
  \ 和 25%），以确定最佳剂量。在生长期间，定期测量了若干参数，包括茎高、叶片数、叶面积以及豆荚的数量和大小。种子成熟后，进行收获，并对其营养价值进行定性分析，测量其蛋白质、脂质、总糖和纤维含量。\n\
  \n# 3. 材料与方法\n\n\n实验旨在通过不同比例的橄榄果渣制堆肥（表 3.1）萌发蚕豆种子，以确定该堆肥的肥力并确定适用于植物的最佳剂量。为此，蚕豆种子用漂白水消毒，用清水彻底清洗，然后用蒸馏水冲洗。随后，它们在\
  \ 225 m² (15*15) 的土壤表面进行萌发。\n\n\n| 粘土含量 (%) | 9 ± 0.044 |\n| 砂粒含量 (%) | 68 ± 0.088\
  \ |\n| 粉粒含量 (%) | 23 ± 0.044 |\n| pH | 7.61 ± 0.044 |\n| 导导率 (μS/cm) | 85.5 ± 0.149\
  \ |\n| 水分含量 (%) | 4.51 ± 0.044 |\n| 有机质含量 (%) | 6.88 ± 0.125 |\n| 总有机碳 % | 4.88\
  \ ± 0.333 |\n| 总氮 % | 0.134 ± 0.02 |\n| 总磷 % | 0.0103 ± 0.003 |\n| 钙 % | 0.48 |\n\
  | 钾 % | 0.0445 |\n| 镁 % | 0.0243 |\n| 钠 % | 0.0092 |\n\n萌发地位于萨勒高等技术学院（摩洛哥萨勒，北纬 34°03′11″，西经\
  \ 6°47′54″，海平面海拔：34 米）。研究的萌发区被分为六块样地。其中五块样地含有特定比例的堆肥，分别对应 5%、10%、15%、20% 和 25% 的堆肥浓度，第六块样地留作对照组，仅含有土壤，其特性如表\
  \ 3.1 所示。在每个样地中，蚕豆种播种密度为 10 粒/1.5 m²，深度为 5 cm，种子间距 10 cm。\n\n\n土壤的物理化特性如表 3.1 所示。\n\
  \n本研究使用的堆肥是近期工作的成果（Ameziane et al., 2020b）。它由 43% 的橄榄果渣和 57% 的牛粪组成，在大 30 升桶中混合。桶上打孔以确保空气流通，并放在阳光充足处。堆肥持续\
  \ 130 天以获得成熟堆肥，其物理化特性如表 3.2 所示。\n\n| COT % | 22.32 ± 0.89 |\n| C/N % | 17.16 |\n\
  | 萌发指数 (%) | 73 ± 0.65 |\n\n每个样地在播种当天灌溉 2 升水，使用来自萨勒高等技术学院的井水，其物理化特性符合摩洛哥灌溉水标准（Secretariat\
  \ of State at the Ministry of Energy, Mines, Water and Environment, in charge of\
  \ Water and Environment, 2007）。植物水分保持在平均 550 mm。\n\n\n\n### 1. 植物材料\n\n所有区域都有 `Vicia\
  \ faba`。对蚕豆进行了定期监测。确定了五个参数：\n\n*   地上部分高度（茎）：使用刻度尺测量。\n*   叶片数：数出每株植物的叶片。\n*   叶面积：通过\
  \ `L` 乘以 `l` 计算面积。\n*   豆荚数量：收获后数出每株植物的豆荚。\n*   豆荚大小：使用刻度带测量。\n\n### 3. 营养质量\n\n\
  萌发试验结束后，收集每个浓度组豆荚中的蚕豆种子，在 60°C 下干燥至恒重，然后磨碎并筛至 0.2 mm，以确定其蛋白质、脂质、总糖和纤维含量。营养评估在拉巴特农业研究中心食品技术部门进行。\n\
  \n#### 3.1. 蛋白质测定\n\n采用 `Kjahl` 法，该方法涉及在硫酸和催化剂的作用下对含氮有机化合物进行热分解。该催化剂含有提高硫酸沸点的 KSO₄\
  \ 以及催化的 CuSO₄。在消解过程中，氮被定量转化为硫酸铵。\n\n随后用氢氧化钠从盐中置换氨，通过蒸汽蒸馏并收集在过量的盐酸中。这是蒸馏步骤。未反应的盐酸量用氢氧化钠进行滴定。这是滴定步骤。氮含量通过公式表示：\n\
  \n```\n%MAT = \\frac{(V_e - V_b) \\times N\\_HCl \\times 14 \\times 6,25}{P_e \\\
  times 100}\n```\n\n其中：\n\n*   `V_e`：滴定样品所需的盐酸体积 (ml)\n*   `V_b`：滴定空白所需的盐酸体积 (ml)\n\
  *   `N_HCl`：盐酸的当量浓度 (N)\n*   `P_e`：样品重量 (mg)\n\n#### 3.2. 脂质测定\n\n`Soxhlet` 法。\n\
  \n\n\n\n对样品进行称重，然后放入纤维素盒中。纤维素盒对溶剂以及溶解在其中的脂肪具有渗透性。加热瓶中的溶剂上升到萃取室，持续 5 到 10 分钟，然后返回瓶中。通过煮沸乙醚对样品进行半连续提取，沸腾乙醚滴入萃取室并逐渐溶解脂肪。含有脂肪的乙醚通过侧弯头处由虹管效应引起的连续溢流返回瓶中。由于只有溶剂可以再次蒸发，脂肪会在瓶中积累，直到提取完成。提取完成后，在\
  \ 100°C 的烘箱中蒸发溶剂，并通过提取出的脂质重量来测量脂质含量 (AOAC, 1990)。\n\n### 3. 总糖测定：Dubois 等人 (1956)\
  \ 苯酚法\n\n总可溶性糖（蔗糖、葡萄糖、果糖、其甲基衍生物和多糖）使用 Dubois 等人 (1956) 苯酚法测定，该方法涉及浓硫酸酸在加热时从糖类中释放出几个水分子。在这种脱水过程中，六碳糖会形成羟甲基糠醛，五碳糖会形成糠醛。这些化合物与苯酚缩合形成颜色复合物（黄橙色）。颜色深浅取决于反应物中糖的含量。使用分光光度计在\
  \ 492 nm 波长下测量吸光度。\n\n### 4. 总纤维测定：NDF 方法\n\n为了测定总纤维含量，使用中性洗涤剂（NDF）溶解食物中的蛋白质、脂质、糖、易消化淀粉和果胶，留下不溶性纤维残留，主要由植物材料的细胞壁成分（纤维素、半纤维素和木质素）和豆中的不可消化氮物质组成。结果以干基基础上报告\
  \ (ISO 16472: 2006)。\n\n## 3.3 统计分析\n\n使用 Windows 版 Statgraphics Centurion XVI 程序对实验数据进行单方差分析\
  \ (ANOVA)，并在显著性水平 `P` < 0.05 下通过最小显著差 (LSD) 进行均值比较。\n\n## 3.4 结果\n\n### 3.4.1 添加有机肥对茎径的影响\n\
  \n与对照组相比，在蚕豆植物中添加不同比例的有机肥改善了茎径 (图 3.1)。事实上，施用 5%、10%、20% 和 25% 肥的植物茎径显著大于对照植物。茎的生长通常与氮充足有关。氮参与植物的多种过程和结构，例如氨基酸的形成，氨基酸形成植物内的蛋白质，对其生长至关重要\
  \ (Jake Munroe, 2018)。\n\n\n#### 3.4.1.1 添加有机肥对叶片数的影响\n\n施用 5%、10%、20% 和 25% 肥的植物叶片数显著大于对照植物。这种叶片效应可以通过有机肥（1.3%）相对于土壤（0.13%）的丰富度来解释\
  \ (ch3.xhtml#ref3_2))。事实上，氮是产生叶片最重要的元素，负责光合作用和发育 (Migout, [2006)。缺氮表现为叶片发黄。![图 3.2\
  \ 不同浓度果渣对叶片数的影响（不同字母的数值差异显著：p < 0.05）。](img/fig3_2)\n\n#### 3.4.1.2 添加有机肥对叶面积的影响\n\
  \n与对照组相比，添加 5%、10%、20% 和 25% 的有机肥导致叶面积显著改善 (ch3.xhtml#ref3_3))。如前所述，发育和生长通常与叶绿素的主要成分——氮（氮）的充足性相关\
  \ (Migout, [2006)。因此，有机肥中该元素浓度（1.3%）相对于土壤（0.134%）的显著差异，可以作为结果的令人说服力的解释。\n\n\n####\
  \ 3.4.1.3 添加有机肥对豆荚数量和大小的影响\n\n在蚕豆植物上使用有机肥导致蚕豆果实产量显著增加，且豆荚大小有显著改善，且在所有剂量下，其结果均与对照植物的产量和大小相比保持显著差异\
  \ (Jake Munroe, 2018)。事实上，所研究的有机肥含有的交换钾水平（2.8%）远高于对照土壤（0.044%） (ch3.xhtml#ref3_2))，这解释了结果实期获得豆荚数量多且体积大。其他作者也得到了类似的结果\
  \ ([Clemente 等人, 2012; Alburquerque 等人, 2011; Walker and Bernal, 2008)，他们认为果渣有机肥中高水平的交换钾导致土壤中有效钾显著增加。这种增加通常反映为在经果渣处理的土壤中生长的植物，其叶片和果实的钾浓度高于接受其他改良剂或未接受改良剂的植物\
  \ (Martínez-Fernández and Walker, 2012)\n\n#### 3.4.1.4 添加有机肥对蚕豆营养质量的影响\n\n由于有机肥含有高营养成分，其添加改善了蚕豆荚的营养质量。与对照发芽种子中的这些元素浓度相比，施用\
  \ 10% 果渣有机肥的植物在蛋白质（8.06 g/100 g）、脂质（1.2 g/100 g）、总糖（9.35 g/100 g）和纤维（4.56 g/100\
  \ g）浓度方面显著提高 ([ch3.xhtml#ref3_4))。\n\n\n\n\n\n\n蚕豆（表 3.4）营养质量的提高在不同比例的堆肥下非常显著，这可以归因于堆肥相比土壤富含了更多的肥效元素，尤其是氮等主要元素，氮在蛋白质和核酸的形成中起着至关重要的作用（Mérigout,\
  \ 2006）。事实上，果实的蛋白质含量与土壤中氮的丰富程度密切相关（Mérigout, 2006），以及堆肥中磷和钾的丰富程度（表 3.1 和 3.2），它们通过改善果实中淀粉、糖和有机酸的合成，刺激根系发育、开花和结果，从而提高了它们的营养质量和口感（Mérigout,\
  \ 2006）。\n\n## 3.5 讨论\n\n橄渣肥已被证明适用于园艺作物的有机肥料（Alburquerque et al., 2006）、橄树（Cayuela\
  \ et al., 2004），同时也作为景观植物基质或生长介的成分（García-Gomez et al., 2002）。\n\n在形态结果方面，观察到与对照组相比，添加不同剂量的橄渣肥增加了茎径、叶数、叶面积，以及豆荚的数量和大小（图\
  \ 3.4）。蚕豆形态上的改善可归因于橄渣肥富含大多数植物生长所需的肥效元素（`NPK`、`P2O5` 和 `K2O`）（表 3.2）（Regni et al.,\
  \ 2016）。事实上，在土壤中添加橄渣肥通常增加了水溶性有机碳和氮的总浓度，后者主要有助于植物叶片和地上部的发育；钾有助于植物的汁液循环和养分吸收；而磷则刺激根系发育、开花和结果（Cao\
  \ et al., 2018; Curaqueo et al., 2014）。同样，Clemente et al. (2012) 和 Pardo et al.\
  \ (2014d) 进行的一项研究显示，在缺乏这两种元素的土壤中用橄渣肥改良两年后，与对照组相比，钾含量增加了 10 倍，磷含量增加了 5 倍（表 3.4）。这种改善对于刺激这些典型贫瘠土壤的生物地球化学循环循环提高其肥力具有重要意义（Pardo\
  \ et al., 2014b）。\n\n\n图 3.4 不同浓度橄渣对蚕豆荚大小和数量的影响（带有不同字母的数值具有显著差异：p < 0.05）。 在形态结果方面，观察到与对照组相比，添加不同剂量的橄渣肥增加了茎径、叶数、叶面积，以及豆荚的数量和大小（图\
