  \n# 第 10 章 智能混合太阳能干燥机内部气候变量表征\n\nMohammed Benchrifa\n摩洛哥拉巴特的穆罕默德五世大学\n伊本托法尔大学—肯尼特拉大学，摩洛哥肯尼特拉\n\
  Jamal Mabrouki 和 Rachid Tadili\n摩洛哥拉巴特的穆罕默德五世大学\n\nDOI: [10.1201/9781003436218-10](https://dx.doi.org/10.1201/9781003436218-10)\n\
  \n## 10.1 引言\n\n水果蔬菜干燥是最古农产品保存方法，因为干燥产品的质量得到了显著提高。干燥农产品的主要目的是将水分含量降低到可以安全长期储存的水平\
  \ [1, 2, 3, 4, 5 和 6]。它还会导致重量和体积的减少，从而降低包装、储存和运输成本 [7, 8, 9, 10, 11 和 12]。干燥食品的选择是基于番茄的。首先，是因为它在全球范围内广泛种植，营养丰富。其次，是因为它们的供应不规律。然而，通过干燥进行保存可以实现其供应的连续性。太阳能干燥被认为是最广泛使用的太阳能系统\
  \ [13]。水果、蔬菜和肉类的干燥是食品行业耗能最高的工艺之一，是减少收获后成本和损失的更好方法 [14]。几个世纪，太阳能干燥在全球范围内户外进行。该过程用于干燥粮食、水果、肉类、鱼和其他用于食用的食品\
  \ [15, 16 和 17]。然而，传统的干燥方法面临许多问题，包括无法正确控制干燥过程、时间不确定、劳动力成本高、所需面积大以及虫害风险 [18]。因此，我们工作的目标是实现并实验一种混合太阳能干燥机，通过添加嵌入式系统使其智能化，然后评估干燥室内不同的气候变量，最后研究该系统对番茄干燥的影响。\n\
  \n## 10.2 材料与方法\n\n### 10.2.1 嵌入式系统\n\n嵌入式系统是一个集成软硬件的复杂系统，旨在提供特定功能。它通常包含一个或多个微处理器，用于运行在设计阶段定义并存储在内存中的一组程序。硬件系统和应用程序（软件）紧密相连，并浸没在硬件中，不像传统的台式个人电脑（PC）环境那样易于辨别\
  \ [19]。\n\n嵌入式系统是自包含的，没有键盘或电脑显示器等标准输入输出。与 PC 不同，嵌入式系统的人机界面（HMI）可以简单到闪烁的发光二极管（LED），也可以复杂到实时夜视系统；通常使用结构通部简单的液晶显示器（LCD）。\n\
  \n嵌入式系统通常在实时（RT）条件下运行：计算操作是响应外部事件（硬件中断）执行的 [20]。\n\n在我们案例中，我们使用了配备有 LM35 温度传感器的\
  \ Arduino ‘mega’ 开发板（图 10.1）来测量干燥机的内部温度，并有一个根据指令开启或关闭风扇的继电器。然而，当温度超过 40°C 时，风扇会自动启动以在整个干燥机循环热能，但当温度低于\
  \ 40°C 时，风扇会自动关闭，因为测试每分钟都会重复一次（图 10.2）。\n\n![Figure 10.1 使用的嵌入式系统。](img/fig10_1_B.jpg)\n\
  \nFigure 10.1 使用的嵌入式系统。\n\n![Figure 10.2 后续步骤流程图。](img/fig10_2_B.jpg)\n\nFigure\
  \ 10.2 后续步骤流程图。\n\n### 10.2.2 测试干燥机的特性\n\n干燥是保存农产品的方法 [21, 22] 和 23]。使用化石燃料干燥消耗大量能量。由于石油近年来上涨并预计将继续上涨，开发无能系统至关重要：太阳能干燥就是一种系统。它只利用太阳能。\n\
  \n太阳干燥机根据加热方法或工作方式通常分为几类。因此，有自然干燥机、直接太阳干燥机、间接太阳干燥机和混合太阳干燥机 [24, 25]。\n\n根据定义，自然干燥机直接利用太阳和空气，其作用没有得到特别的考虑或控制。产品铺在架子上或放在地上。这些干燥机非常便宜，但需要持续的人工干预：下雨时保护产品，频繁混合以防止过热。这种干燥机在农业社区中很常见，用于解决销售前的产品临时储存问题\
  \ [27, 28, 29, 30, 31 和 32]。\n\n在直接太阳干燥机中，阳光直接干燥食物。这种干燥机需要一个底部顶部都有孔的木箱或纸板箱，允许冷空气从底部进入，热空气从顶部排出。该箱包含干燥食物的架子，并覆盖玻璃以增强温室效应\
  \ [33, 34 和 35]。\n\n混合太阳干燥机是直接干燥机的结合。在这些干燥机中，干燥所需的热量由太阳辐射提供，阳光照射直接部分的产品并加热空气。热量和水蒸气的传递是复杂的且不为人知的。混合太阳干燥机由两部分组成：底部是直接干燥部分，当太阳加热该部分的内部空气时，热空气通过孔进入干燥室，即间接干燥部分。空气流经水果和蔬菜，逐渐使它们脱水，并从顶部排出，带有大量水蒸气。\n\
  \n\n\n\n干燥机的直接部分采用的是双层玻璃，这是一种由两块玻璃组成、中间隔着一层静止空气的墙，被称为“空气层”。双层玻璃的优点是它提供了更好的隔热性能，因为空气层是良好的绝缘体，远优于玻璃本身。因此，双层玻璃减少了凝结和热量损失。\n\
  \n厚度通常称为 `a/b/c`。其中 `a`、`b` 和 `c 分别是元件（外层玻璃、空气层、内层玻璃）的毫米毫米。常见的双层玻璃为 `4/3/4/` [7]。在直接部分的底部放置了绝缘材料（`聚苯乙烯`），上方放置了一个将太阳辐射转换为热能的吸收器。\n\
  \n间接部分由干燥室组成，这是一个平行方体形状柜子。其体积为 `(120 cm × 60 cm × 60 cm)` 或 `432 × 10³ cm³`。它的壁由厚度为\
  \ `0.8 cm` 的 `TRESPA` 木板制成。`TRESPA` 是一种极多功能的材料。面板可以轻松与其他材料结合。它在高压和高温下，由高达 70% 的木纤维或纤维素纤维与热固性树脂的混合物制造，`TRESPA`\
  \ 是一种极其稳定、致密的板材。干燥机带有一个铝框玻璃门，用于将产品放入干燥室并在操作结束时取出 [7]。干燥室内放置了三个矩形托盘。网架被木材包围，尺寸为 `(52\
  \ cm × 61 cm)`。其孔径为 `(2.5 mm × 2.5 mm)`。托盘之间的距离为 `32 cm`。这个空间足够允许良好的空气流通（图 10.3）。\n\
  \n![图 10.3 实验性太阳能干燥机。](img/fig10_3_B.jpg)\n\n图 10.3 实验性太阳能干燥机。\n\n### 10.2.3 测量采集遵循的步骤\n\
  \n为了进行不同的测试，我们使用了带有不同测量仪的几种实验设备。使用 `Kepp and Zonen 辐射计` 测量水平面上的总太阳辐射，并使用四个 `热电偶`\
  \ 测量干燥机不同部位的温度。这些 `热电偶` 将温度转换为电压。当由不同金属制成的两个电线连接时，会产生很低的电压。该电压是结点温度以及构成热电偶导线的金属种类的函数。由于金属的温度特性为人所知，很容易将结点产生的电压转换为其温度。\n\
  \n## 10.3 结果与讨论\n\n药用植物和香料植物的干燥对生产者来说通常仍然是一个控制较差且昂贵的过程。药用植物的含水量必须迅速降低以保存，但温度必须保持在低温，以免破坏其活性成分。在整个食品工业中，干燥操作的优化必须满足两个基本要求：必要能量的有限消耗以及干燥产品质量的保护。在这一部分，我们特别关注配备有控制通风系统的混合太阳能干燥机的实验性研究。\n\
  \n太阳能干燥原型机确保了太阳热能的充分利用。为了研究该系统的实用性，有必要研究系统内部的不同变量。因此，在几种仪器的帮助下，测量了干燥机直接部分的辐射、玻璃温度、吸收器温度，以及间接部分第一层和第三层区域的温度。这些测量结果所示图\
  \ 10.4。\n\n![图 10.4 太阳能干燥机内部辐射和温度随时间的变化。(a) 太阳辐射每小时变化；(b) 间接部分温度的变化；(c) 直接部分温度的变化。](img/fig10_4_B.jpg)\n\
  \n图 10.4 太阳能干燥机内部辐射和温度随时间的变化。(a) 太阳辐射每小时变化；(b) 间接部分温度的变化；(c) 直接部分温度的变化。\n\n根据该图（代表干燥机直接部分内部水平面总辐射的变化），我们注意到辐射显著下降，因为它从外部的\
  \ `528 W/m²` 降到内部的 `305 W/m²`，这代表了超过 40% 的太阳辐射损失。这种损失主要是由于玻璃的倾角（大于 `70°`）以及玻璃的性质（双层玻璃）造成的。\n\
  \n至于温度变化，可以看出在直接部分吸收器和内部玻璃的温度可以达到 `35°C`，而在间接部分，温度从一层到另一层降低。这种下降主要是由于通过未隔缘侧壁的热量损失造成的。\n\
  \n## 10.4 结论\n\n我们在地球上接收到的太阳能量是太阳主要以热和光的形式发射的能量。由于太阳是无穷无尽的能源来源且其每日利用至关重要，因此被认为是确保地球生命生存的主要能源资源。这种能量的主要用途是捕获阳光并将其转化为热或电。太阳干燥因地区而异，有不同的方法来确保这一过程的成功。指定区域应具有较高的环境温度和太阳辐射强度。摩洛哥全年大部分时候阳光充足，因此干燥时间和产品质量保持是他选择合适干燥方法的基本标准。干燥是食品工业中有效延长产品保质期的基本过程之一；近年来，太阳能干燥机的使用取得了巨大发展。因此，我们的目标是研究混合太阳能干燥机内部温度和辐射的变化。\n\
  \n实验研究表明通过玻璃的辐射显著减少，从外部的 `528 W/m²` 降到内部的 `305 W/m²`，这代表了超过 40% 的太阳辐射损失。这种损失主要是由于玻璃的倾角（大于\
  \ `70°`）以及玻璃的性质（双层玻璃）造成的。在温度变化方面，直接部分吸收器和内部玻璃的温度可以达到 `35°C`，而在间接部分，温度从一层到另一层降低。这种下降主要是由于通过未隔缘侧壁的热量损失造成的。\n\
