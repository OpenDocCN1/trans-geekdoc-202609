  \n## 8.1 引言\n\n水在干旱和半干旱地区是非常有限的自然资源 [1]。现有资源正受到城市和工业排放对受体环境污染的威胁 [2, 3, 4 和 5]。这些排放可能包含许多固态和溶解物质，以及许多病原微生物，它们威胁着整个环境的质量\
  \ [6, 7 和 8]。即使在水和土地资源充足的情况下，水危机仍被视为全球主要问题和威胁之一 [9]。根据联合国世界水资源开发报告（2014 年），超过两百万吨废水、农业和工业废物未经处理直接被排放到发展中国家的湖泊、河流和其他水体中，导致可用水源受到污染\
  \ [10]。来自家庭、工业、商业和机构的废水含有许多可能对人类健康和环境构成风险的物质 [11]。另一方面，生活废水来自洗厕所以及家庭用水（厨房、浴室、洗衣以及除洗厕所以外的某些家电产生的水）\
  \ [12]。废水中的出物中包括难以生物降解的合成化学化合物，当这些出物排放到受体环境时，在食物链的所有层中都能发现致突变/或致癌毒物 [13]。因此，必须找到替代性的水处理方法\
  \ [14]。近年来，出现了无数计的生物技术应用，例如生物修复，它可以允许在没有这些缺点的情况下进行废水处理 [15]。这一过程涉及使用微生物（通常是细菌或真菌）去除土壤和水中的污染物\
  \ [16]。利用藻类（宏或微藻）从废水和残留空气二氧化碳中去除各种营养盐、重金属和外源性的去除、生物转化或矿化的艺术被称为生物修复 [17, 18]。在处理过程中，会使用氮、磷和其他盐\
  \ [19, 20]。藻类发挥着关键作用 [21, 22]。它们甚至可以产生有机物 [23, 24]。\n\n这项工作的主要目的是评估利用藻类处理废水和消除金属的有效性。\n\
  \n## 8.2 材料与方法\n\n### 8.2.1 微藻培养\n\n微藻培养可以在开放式池塘或光生物反应器中进行 [18]。开放式系统非常常见 [25, 26,\
  \ 27]。微藻生长非常快，预计产量每天约 77 g/m² [28]。\n\n**开放系统：**\n\n使用池塘等开放系统进行藻类培养 [29]。然而，这很难，并且需要对培养基进行严格灭菌以避免污染\
  \ [30]。开放系统的类型包括大型池塘和圆形池塘 [31]。\n\n图 8.1 显示了开放系统的示意图。\n\n![图 8.1 开放系统](img/fig8_1.jpg)\n\
  \n**封闭系统：**\n\n光生物反应器由透明材料制成，以便控制培养参数（温度、二氧化碳和 pH） [32]。它们提供了封闭培养环境，保护培养免受直接污染，减少培养基的蒸发，同时促进二氧化碳的供应\
  \ [33]。光生物反应器允许高效布局，还能去除光合作用产生的氧气。为了更好地控制过程，一种解决方案是进行封闭种植。封闭系统的原理是通过透明材料使微藻与自然光接触。\n\
  \n### 8.2.2 优缺点\n\n根据目标产品的不同，微藻培养系统既有优点也有缺点，它们被分类在表 8.1 中。\n\n**表 8.1 微藻培养系统的优缺点**\n\
  \n| 优点 | 参考文献 | 缺点 | 参考文献 |\n| :--- | :--- | :--- | :--- |\n| **开放系统** | | | |\n\
  | 低成本 | [34] | 难以控制生长条件 | [38] |\n| 维护 | [35] | 污染威胁 | [39] |\n| 建造 | [36] | 蒸发损失\
  \ | [40] |\n| 配置容易完成 | [37] | | |\n\n\n\n\n\n| **封闭式系统** |\n*   控制生长条件和生长参数（`pH`、`CO[2]`、`O[2]`）\n\
  *   避免蒸发以减少 `CO[2]` 损失\n*   实现更高的微藻密度\n\n|| \\[41, 42, 43 和 44]\\] ||\n\n*   过过热\n\
  *   生物污垢\n*   氧气积累\n*   高昂的成本\n\n|| \\[39, 45, 46]\\] |\n\n尽管如此，每个小型或大型作物培养系统的成功取决于许多参数，例如光源的光照强度、气液的最优传输、易用性、低污染水平、低生产成本、最小面积、养分最大化以及温度控制（图\
  \ 8.2）。\n\n![图 8.2 指光生物反应器透视图。](img/fig8_2_B.jpg)\n\n图 8.2 指光生物反应器透视图。\n\n### 8.2.3\
  \ 微藻与养分的相互作用\n\n需要注意的是，光合生物是在不断变化的世界演化的。光合生物通过位于膜中的色素-蛋白复合物从阳光中收集能量，以促进能量传递 [47]。图\
  \ 8.3 显示了微藻的类型和大类，其具有：\n\n![图 8.3 微藻主要类型的分类、其物种及其生物活性。](img/fig8_3_B.jpg)\n\n图 8.3\
  \ 微藻主要类型的分类、其物种及其生物活性。\n\n碳、氮、磷等养分在微藻的细胞代谢和生物化学组成中起着重要作用 [48]。此外，对于微藻的生长，必须存在微元素，特别是金属，如\
  \ `Mg`、`Ca`、`Mn`、`Zn`、`Cu` 和 `Mo` [49, 50]。微藻在固氮和吸收中起着重要作用。它们包括蓝藻，能够结合大气分子氮（`N[2]-N`）并将其转化为氨氮（`NH[3]-N`），可以通过方程式将其释放到环境中\
  \ [51]：\n\n(8.1)\n\n```\n$$N_{2} + 8H^{+} + 8_{e^{-}} + 16 + {ATP}\\overset{\\\\\
  text{Nitrogenase}}{\\rightarrow}2{NH}_{3} + H_{2} + 16\\ {ADP} + 16P_{i}$$\n```\n\
  \n反之，真核微藻根据以下两个方程式同化固氮，如 `NH[4]-N`、`NO[3]-N` 以及硝酸还原酶和亚酸还原酶 [52]：\n\n(8.2)\n\n```\n\
  $${NO}_{3}^{-} + 2H^{+} + 2\\_{e}^{-}\\overset{\\text{Nitrate\\ reductase}}{\\rightarrow}\\\
  \ {NO}_{2}^{-} + H_{2}O$$\n```\n\n(8.3)\n\n```\n$${NO}_{2}^{-} + 8H^{+} + 6\\_{e}^{-}\\\
  overset{\\text{Nitrite\\ reductase}}{\\rightarrow}\\ {NH}_{4}^{+} + 2H\\_{2}O$$\n\
  ```\n\n只要 `NH[4]-N` 的吸收不需要还原步骤，它被认为是微藻的优选氮形式。因此，除了微藻的吸收外，`NH[4]-N` 的去除也可以随着 `pH`\
  \ 值和温度的升高而发生，此时大量的 `NH[4]-N` 可能会挥发 [53, 54]。\n\n## 8.3 结果与讨论\n\n### 8.3.1 利用微藻的废水处理技术\n\
  \n作为一个利用微藻进行废水处理技术的示例（从物理化学分析来看含有高养分），我们以 Gharmouli 等人的工作为例，他们研究了螺旋藻（*Arthrospira\
  \ platensis*）对废水中有机污染物的去除能力。根据这项研究，他们发现在 32°C 温度下，随着硝酸盐值的下降，培养电电率降低，氨和亚酸盐消失，总氮也减少\
  \ [55]。还进行了一项关于废水处理中微藻-细菌复合体系使用的比较研究，以检查和比较与绿藻复合体相关的微生物群。结果显示，大部分氮和碳已被去除，这为…… [56]\
  \ 开启了可能。\n\n### 8.3.2 小球藻属的营养价值\n\n生物技术对微藻和蓝藻的关注集中在它们含有的价值代谢产物上，这些产物可用于医学、工业、能源、农业和食品等领域的广泛应用\
  \ [60]。大多数化妆品作用得到文献的支持和市场的声称，一方面具有抗衰老、保湿、抗氧化和美白功效，另一方面具有抗粉刺和愈合功效 [61]。 \n\n光合微生物正成为废水处理技术中实施的最重要替代方案之一，并引起了对科学和工业界日益普及的微藻的关注。目前对微藻的兴趣正在增长，因为它们能够去除养分。因此，为了选择去除养分的合适物种，必须研究该物种的积累能力及其对毒性影响的耐受性。\n\
