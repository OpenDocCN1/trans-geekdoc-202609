  \ 93–104 (2014)。\n- Zhiying, Li, & Fang, H.: 气候变化对侵蚀的影响。综述。《地球科学评论》，163, 94–117\
  \ (2016)。\n\n# 第 2 章 农业土壤退化对水资源和粮食安全的影响\n\n\n## 2.1 引言\n\n良好的土壤对于支持农业、生物和环境系统至关重要，对土壤资源的威胁被认为是对人类安全的威胁（Amund\
  \ et al. 2015）。人口的快速增长和个人高消费率导致对农产品的需求增加，这对自然资源带来了巨大压力，导致了生态系统的破坏及其各种形式的退化（FAO 2017）。未来人口动态变化的最重要的方面是，绝大多数将位于发展中国家（南亚和撒哈拉以南非洲）。在这些地区，健康土壤有限，容易受到自然人为变量的影响，并随着人口压力增加和气候变化的危害而退化。因此，未来粮食生产的任何增长都必须通过对单位面积上已投入农业生产的养分、水资源等资源进行“垂直增长”来实现（Lal\
  \ 2008）。在威胁土壤的许多因素中，不可持续的农业生产无疑是最大的之一（Kopittke et al. 2019）。改善农业土壤可持续性的努力不仅必须结合生物学和农学学知识，还必须考虑农业生产过程中的人类维度（Lal\
  \ 2008）。近期，人们重新投入努力分析农业背景下土壤健康的经济维度，并将社会科学的见解更好地整合到关于土壤管理的政策讨论中（Kik et al. 2021;\
  \ Jesus et al. 2021）。这包括对脆弱且不稳定环境的开发，这些环境中成分之间的动态平衡是不可逆的，或者说在处理和应对投资方法方面缺乏足够的活性（FAO\
  \ 2017）。\n\n## 2.2 土壤退化\n\n土壤退化可以广义地定义为土壤质量的功能、物理和生物性能下降。这可能现在土壤生物多样性的丢失、肥力的下降（有机质和结构状况）、侵蚀、盐碱度、酸或碱度的不利变化，以及有毒化学品、污染物或过度淹水的影响（Nunes\
  \ et al. 2020）。此外，土壤退化的原因包括不可持续的农业实践；过度放牧；农业、工业和自然污染；以及气候变化的长期影响。土壤退化的示例见图 1 和图\
  \ 6。\n\n\n\n\n\n土壤质量的下降对未来农业和水资源的发展具有重大影响。此外，它对人类健康和生态系统服务也有巨大影响。图 2.7 展示了土壤退化与水、农业，以及人类活动与生态系统之间的关系。\n\
  \n\n图 2.7 土壤退化与水、农业以及人类活动与生态系统之间的关系\n\n## 2.3 历史证据\n\n在青铜时代的美索不达米亚（公元前 4000 年至 1100\
  \ 年），城市中心集中在苏美尔和阿卡德的城市（图 2.8）。这些城市的人口在 50,000 到 80,000 人之间，约有 90%的人口居住在这些地区。在这些王国发展之初，几乎一半的人口在城市周围的大型灌溉农场工作。随着苏美尔人时期现代方法和工具的发展，美索不达米亚见证了灌溉农业的主要进展，仅需\
  \ 1%的社区就能养活大部分人口。鼓励农民关注有效的水资源管理，其中一个面板指出，通过优化的灌溉管理产量可以增加 10%（Mays 2010）。古代农民还使用各种手段灌溉土地，包括桔�（Shadouf）、水轮（Noira）、灌溉渠和水坝。\n\
  ![图 2.8 美索不达米亚古代王国的位置（Donn 2019）](img/fig2_8_B.jpg)\n\n图 2.8 美索不达米亚古代王国的位置 (Donn\
  \ 2019)。\n\n苏美尔文明衰败的主要原因之一是农业生产的下降。楔形文字记录中发现的证据表明了农田盐碱化的程度。例如，据报道，公元前 2400 年谷物酒产量为每公顷\
  \ 2347 升，但到公元前 1700 年，产量已降至每公顷 897 升。土壤盐化的另一个指标是大麦面积的高比例，在公元前 2050 年超过了总种植谷物的 98%。大麦是著名的耐盐作物，通常是用于恢复盐碱沙漠土地进行农业的首选作物。许多水道的泥沙淤积问题广泛存在且影响巨大，因为放弃一些旧水道并建造新水道要容易得多（Mays\
  \ 2010）。\n\n## 2.4 土壤退化与水安全\n\n在所有主要的人类活动中，农业在全球范围内仍是最大的用水户，约占总淡水抽取量的 70%（Hillel\
  \ et al. 2008）。此外，农业部门是淡水抽取的最大来源，而水资源是粮食安全的主要限制因素。\n\n农业是最大的用水者，土壤退化是影响粮食安全的主要因素。这将影响水资源的可用性和土壤图\
  \ 2.9。\n\n等等，让我仔细重新检查一下提供的文本。提供的文本包含一些重复或混乱的句子。我将根据提供的核心内容并在格式规则的基础上对结构进行清理。\n\n\
  图 2.9 土壤与水循环（Montanarella 2015）\n\n\n图 2.9 土壤与水循环\n\n土壤退化是影响灌溉农业可持续性的主要因素之一。土壤盐渍会导致用水超过灌溉需求的倾向。这可能导致水涝问题，进而导致通气性、养分吸收和作物产量下降。如果使用盐水灌溉，并结合施肥不当和灌溉管理不善，盐害将增加。所有这些形式的退化都会直接影响农业生产力和粮食生产。\n\
  \n## 2.5 土壤退化与粮食安全\n\n需要绿色革命来养活增长的人口，这必须基于对土壤和水资源的可持续管理（Lal 2009）。尽管过去几十年在灌溉工程上投入了大量资金，全球灌溉土地仍面临困难。灌溉在为增长的人口提供食物方面发挥着重要作用，贡献了总产量的\
  \ 40%以上。灌溉下的平均谷物产量通常是雨养条件下的两倍（Hillel et al. 2008）。\n\n土地的连续耕作导致作物产量下降，无法应对其他农业生产限制，最终导致粮食短缺、低收入和粮食安全挑战（图\
  \ 2.11）。\n\n\n图 2.11 土壤退化与粮食安全\n\n\n\n\n\n土壤退化对生态系统服务具有重要影响，贫瘠的土壤质量可能会降低生态系统支持确保其可持续性所需的功能或服务的能力。人们对生态系统部分之间相互依存性的意识日益增强，这将给农业更大的压力以减少对生态系统的负面影响，例如通过减少土壤退化和管理碳储。此外，土壤退化对关注土地稳定和植被的环境问题构成了严重威胁（Gobinath\
  \ et al. 2022）。\n\n土地利用的变化会显著减少土壤有机碳（`SOC`）并增加二氧化碳（`CO[2]`）、）、二氧化氮（`NO[2]`）和甲烷（`CH[4]`）的排放。土地从牧场变为耕地会导致土壤有机碳的最大流失。土壤有机质在产生土壤有机碳方面发挥着重要作用。在干旱地区和火灾期间，土壤碳会以二氧化碳的形式返回大气，这直接影响全球变暖和气候变化过程（Lehmann\
  \ et al., 2015）。由于土地和水资源有限，环境规划将日益限制用于耕作的资源释放（Fischer et al. 2010; Molden et al.\
  \ 2007）。\n\n## 2.7 预防和修复退化土壤\n\n保护和修复退化土壤的质量是一项具有挑战性的任务；土壤质量的修复是一项复杂的任务，需要协调的方法。防止土地退化有许多基本程序，描述如下（Dragović\
  \ and Vulević 2020）：\n\n*   人为引起的退化比自然退化发展得更快，可以通过调节人为干预（如森林砍伐、过度放牧和农用地管理不当）来减少或避免。\n\
  *   为了防止土壤退化，必须使用适当的方法监测和评估土壤退化过程（例如基于专家的方法、遥感、建模等）。\n*   必须填补数据空白，实现数据获取和数据可比性，收集更多现场信息，并考虑未来的不确定性。\n\
  *   土壤侵蚀是土壤退化最广泛的形式。土壤侵蚀控制措施包括选择最佳土地利用类型、维持保护植被（树木、覆盖物和作物）以及建设技术工程（例如大坝）。\n*   土壤污染是土壤的化学退化，涉及土壤中存在有害物质。修复选择包括根据退化条件对土壤进行多种化学和物理处理。\n\
  *   盐碱化是一种广泛存在的化学土壤退化类型，发生在干旱和半干旱地区。通过采取适当的灌溉措施、更好地使用肥料或改变土地用途，可以减少盐渍地的扩张。\n*  \
  \ 退化类型的识别对于定义所有后果以及从而预期的预期行动和修复成本至关重要。\n*   意识到几个退化过程可能在同一区域同时发生是必要的。\n*   退化类型的空间范围、程度和速率应作为最佳可持续土地管理实践决策过程的依据。\n\
  \n考虑到近年来取得的技术进步，只要有足够的公众支持、理解和政治意愿，大多数类型的土壤退化可能是可逆的（Lal 2015）。\n\n为了实现目标，开发了某些土壤质量修复策略，包括：(i)\
  \ 创建积极的土壤/生态系统；(ii) 减少土壤侵蚀；(iii) 提高肥料可用性；以及(iv) 增加土壤生物多样性特别是微生物过程（Lal 2015）。最终目标应该是采用整体和综合的方法进行土壤资源管理（Figure\
  \ 2.12）。\n\n\n图 2.12 修复和管理土壤质量以缓解土壤退化风险的三种策略 (Lal 2015)。\n\n## 2.8 结论\n\n土壤退化是对水资源可持续农业的严重威胁。它可以作为自然过程发生，或由人为干预引起。农业中管理不当导致盐碱化和养分运输方面的土壤退化，反而导致水需求增加和土地生产力下降。过量的灌溉水给可用水资源带来了更大的压力，特别是在缺水地区。为了脱这种恶性循环，采取旨在防止和修复退化土壤的策略和技术以确保土壤的可持续性极其重要。此外，在气候变化增加、极端天气频繁的气候范围内，土壤功能将面临压力，需要更好的土壤管理来实现水和粮食安全。\n\
  \n### 建议\n\n可持续土壤管理是土壤退化的关键解决方案。在这方面，深入了解提高水效率的土壤和农学过程极其关键。\n\n长期行动包括改进农业和水管理实践，例如采用适当轮作、增强土壤排水、提高灌溉效率、使用适应气候的作物以及提高农民的能力。可以采用耕作实践改善土壤质量并增加土壤碳，包括最佳施肥和动物粪肥施用。高效的水管理，结合更好的肥料利用和改良作物品种，可以显著减少农业影响。\n\
