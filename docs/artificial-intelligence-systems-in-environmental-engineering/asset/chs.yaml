  \ January 2022.\n\n\n\n\n重组奶是通过处理后的水与奶粉混合得出的。当使用每 100 克奶粉中脂肪含量 1.25%的奶粉时，重组奶被称为脱脂奶。当使用每\
  \ 100 克奶粉中脂肪含量至少 26%的奶粉时，重组奶被称为全脂奶[[4]]。牛奶的主要成分是蛋白质，它们特别受关注，因为它们是决定牛奶技术特性的主要贡献者。蛋白质占牛奶中氮物质的\
  \ 95%，可分为两类：酪蛋白蛋白和乳清蛋白。非蛋白氮由尿素、氨、尿酸、游离氨基酸和肽等多种物质组成。本研究的主要目的是确定生乳的微生物学质量和物理化学性质。在微生物质量方面，必须确定并计数总需氧嗜温菌菌落。在物理化学性质方面，必须测定或测量以下要素：滴定酸度；储存温度；脂肪含量；酒精试验；蛋白质含量；总干物质提取物；pH\
  \ 值。\n\n## 9.2 文献综述\n\n作为人类的第一种食物，牛奶是唯一可以在任何时间、任何地点声称具有通用地位的食物，至少在人类生命的初期[[1]]。牛奶是一种具有相当营养价值的有机食品，其组织化生产可追溯到一万年前。自\
  \ 19 世纪以来，得益于兽医学的进步、高性能品种的选择以及育种实践，产量稳步增长[[2]]。\n\n牛奶是一种不透明的、哑白色、微黄的食物液体，气味温和，味道味甜，在分娩后由牛、羊、羊等哺乳类动物的乳腺分泌，旨在喂养新生幼畜[[3]]]。赋予奶粉的所有名称（即脱水奶或干奶）都是指去除了几乎所有水分的牛奶[[5]]。这种去除过程发生在巴氏杀菌和中温浓缩（71–75°C，持续\
  \ 15–40 秒）之后，因此牛奶在热干燥空气流（约 150°C）加热的干燥塔中被精细粉碎。水分蒸发，由此得到的粉末经过颗粒化过程[[4]]。\n\n### 9.2.1\
  \ 牛奶的化学组成\n\n牛奶是必需营养素的重要来源，也是膳食能量、高质量蛋白质和脂肪的重要来源。它可以对钙、镁、硒、核黄素、维生素 B12 和泛酸的建议营养需求做出重大贡献。乳制品是营养丰富的食品，可用于增加植物饮食的多样性。在脂肪摄入低且获取其他动物源食品有限的人群中，动物牛奶在儿童饮食中可以发挥重要作用[[6]]。\n\
  \n### 9.2.2 牛奶的营养价值与法规\n\n生牛奶含有维持幼年哺乳动物生长的所有营养素：每升牛牛奶含有约 50 克乳糖、32 克蛋白质和 40 克脂肪。一升全脂、半脱脂或脱脂奶的能量潜力分别为\
  \ 2720 KJ、2090 KJ 和 1460 KJ。牛奶是钙和磷极极来源，以及核黄素、硫胺、钴胺和维生素 A 等维生素的良好来源。它含有少量铁和铜，少量的维生素\
  \ C 和烟酸，以及相对较少的维生素 D。它富含必需氨基酸残基蛋白和具有营养价值的矿物质（钙和磷），特别是以磷酸盐、柠檬酸盐的形式存在。牛奶是钙、镁、钾和钠的极佳来源。由\
  \ AFNOR 发布的题为“牛奶滴定酸度”的标准于 1995 年发布，它是滴定酸度测量方法的一部分。该方法，滴定酸度是通过在 75°C 下保持一段时间来测量牛奶酸度的。该文档描述了滴定酸度的方法。滴定酸度通过滴定剂（通常为碱性溶液）加入样品，以达到滴定点。滴定酸度以每升毫摩尔（mol/L）表示，通过滴定剂的量来确定酸度。该\
  \ AFNOR 标准对于化学行业的专业人士具有重要意义。遵循该标准确保了化学行业中滴定酸度结果的一致性[[7, 8]]。\n\n## 9.3 材料与方法\n\n\
  ### 9.3.1 采样、提取与储存\n\n本研究涉及来自四个不同乳厂的生牛奶样本。样本在早晨采集并置于无菌瓶中，然后直接放入冷冻以防止温度升高。\n\n无法在接收后立即进行巴氏杀菌。在处理之前，牛奶必须在储罐中储存几小时或几天。即使进行强化冷藏，也很难避免变质。因此，使用热处理在巴氏杀菌之前预热牛奶，以抑制细菌（特别是病原菌）。牛奶被加热到\
  \ 75°C，许多专家认为热处理对某些孢子有积极影响，因为热处理使许多孢子恢复到营养体状态，能够在随后的巴氏杀菌过程中被杀死。初始温度为 4 至 8°C 的牛奶被加热到\
  \ 75°C，以杀死很大比例的微生物，并在在使用前保持良好的细菌水平。为了实现这一点，生牛奶通过板式杀菌机。杀菌机由三个部分组成：\n\n*   **预热**：来自储罐、温度在\
  \ 4 至 6°C 之间的生牛奶通过预热段，通过冷牛奶/热牛奶回路从热牛奶中回收热量。牛奶因此排出 45°C 的温度，然后送到脱脂机，最后以相同温度返回杀菌机（见图\
  \ 9.1).\n\n*   **加热**：在这一部分，通过热水经逆流板式热交换器将牛奶的温度升高到 75°C。牛奶随后通过恒室，在 75°C 下保持所需的时间。\n\
  \n*   **冷却**：该部分对通过与进入杀菌机的生牛奶间接接触而预冷却的牛奶进行冷却。然后使用冷水进行最终冷却至 6°C。\n\n\n\n\n杀菌过程的各个阶段允许生奶进行预热，使其温度达到\
  \ 75°C 以部分破坏微生物，然后迅速冷却，以在进一步使用前保持其品质 [10, 11]]。\n\n### 1. 物理化学分析\n\n*   在评估牛奶稳定性时，物理化学分析会考虑多种参数。生奶的\
  \ `pH` 值是一个关键参数，因为显著波动可能预示着其化学组成的变化，从而影响其稳定性。酒精测试用于检测牛奶中是否存在异常的酒精，这可能表明存在污染或变质。生奶的储存温度对于防止细菌生长以及维持其品质和稳定性也至关重要。酸酸可能是由于细菌的存在，表明污染或变质。脂肪含量在牛奶稳定性中起着关键作用，因为脂肪有助于形成稳定的乳液。同样，蛋白质对于维持牛奶的胶体结构以及防止凝固或相分离也非常重要。总而言之，评估牛奶稳定性需要考虑\
  \ `pH`、酒精、储存温度、酸度、脂肪含量和蛋白质，以确保其质量和耐用性。\n\n*   正常新鲜牛奶的 `pH` 值约为 6.7。该值在很大程度上归于蛋白质中的碱性电离和可解离酸基、酪蛋白中的磷酸酯基，以及磷酸和柠檬酸。\n\
  \n*   取牛奶样本并煮沸。如果牛奶变酸（形成结块），加工人员必须拒绝接收这种牛奶，因为它在巴杀过程中会变酸，因此无法承受消除细菌所需的温度。\n\n*  \
  \ 取 10 毫升牛奶样本并与 10 毫升 60%浓度的酒精混合。充分混合。如果形成结块（“凝固”），则应拒绝该牛奶，因为这表明可能存在细菌。然而，在酒精测试中凝固的牛奶仍可能耐受巴杀。因此，这并不是一个完全可靠的测试。\n\
  \n*   测量酸度可以指示酸化反应是否已经开始（乳酸发酵菌活动活的指标）。这项测试的优点是易于使用、价格廉且能给出立即结果。离开乳房时，健康牛奶的自然酸度在\
  \ 15°到 21°道恩士之间（羊奶为 14°到 16°）。到达奶制品厂时，测量牛奶酸度以检查发酵是否已经开始。\n\n### 2. 测量牛奶脂肪含量\n\n\
  1.  牛奶脂肪 (`MF`) 分离的原理基于在比重瓶中离心，其中硫酸攻击牛奶成分，但 `MF` 除外。加入异戊醇可促进脂肪分离（图 9.2）。\n\n   \
  \ ![图 9.2 盖伯法。](img/fig9_2_B.jpg)\n\n    图 9.2 盖伯法。\n\n2.  该方法的步骤如下：\n\n    *  \
  \ 向比重瓶中加入 10 ml 硫酸（`d` = 0.818）。\n    *   使用移液管向比重瓶中加入 11 ml 牛奶，将移液管头接触比重瓶，以避免牛奶和硫酸过早混合。\n\
  \    *   接下来，加入 1 ml 异戊醇且不混合液体。\n    *   紧闭比重瓶并剧烈摇晃，直到混合物均匀。\n    *   此时，由于硫酸与牛奶的混合，比重瓶的温度达到约\
  \ 80°C。\n    *   搅拌后，在 65°C 下、1200 rpm 下离心 5 分钟。\n\n3.  读取结果：\n\n    *   从离心机中取出比重瓶，小心调整瓶盖，使脂肪柱的底端对着有数字的标记，尽可能少地移动该柱。\n\
  \    *   应通过将比重瓶移至眼睛前方并记录液面的最低水平来快速读取读数。\n    *   牛奶的正常脂肪含量为 40 g/l。\n\n4.  该方法通过离心和读取比重瓶中的脂肪柱高度来定量分析牛奶的脂肪含量。快速读取以获得准确的测量值。\n\
  \n### 3. 干物质含量测定\n\n*   该方法的原理是将样品在通风烘箱中、103°C 的恒温条件下在坩埚中干燥，直到其重量达到实际上恒定的值。\n* \
  \  该方法的操作如下：\n\n    *   准备坩埚：放在 103 ± 1°C 的烘箱中加热半小时，冷却并称重。\n    *   在准备好的坩埚中称重 1\
  \ ml 样品。\n    *   将样品在 103 ± 1°C 的烘箱中干燥 24 小时，然后在干燥器中冷却 30 分钟。\n\n*   可以根据以下关系读取结果：`干物质百分比\
  \ (MS%) = (m_1 − m_0) × 100/m_2`。其中：`MS`: 干物质的百分比（%），`m_0`: 空坩埚的质量（g），`m_1`:坩埚和牛奶残留物的质量（g），`m_2`:所取的样品重量（g）。\n\
  \n*   该方法通过计算坩埚与残留物之间的质量差来确定牛奶的干物质含量。干物质以百分比表示。\n\n### 4. 微生物分析\n\n*   牛奶微生物分析的目的是检测微生物的存在，评估细菌学质量和安全性，无论是生奶还是巴杀奶。\n\
  *   对于这些微生物分析，关注的是一个特定参数：总需氧菌落 (TAMF)。`FMAT` 测量菌落单位 (`CFU`)。\n*   `CFU` 计数在 30°C\
  \ 下进行，使我们能够区分三类菌群：嗜热菌（最适生长温度为 45°C）、嗜温菌（最适生长温度在 20°C 到 40°C 之间）以及嗜冷菌（最适生长温度为 20°C）。\n\
  *   由于使用的培养基对大多数微生物有利（需氧微生物和严格厌氧微生物外），使用“30°C 嗜温需氧菌”而非“总菌”更为合适。\n*   用于定量微生物的单位是\
  \ `CFU`（菌落形成单位），因为琼脂中可见的菌落可能来自单个微生物、孢子或微生物的组合。\n*   分析步骤如下：\n\n    *   转移到单个培养皿。\n\
  \    *   使用无菌移液管转移 1 ml 待测样品（必要时制备稀释系列）。\n    *   向每个培养皿中倒入约 15 ml 板琼脂 (`PCA`) 培养基。\n\
  \    *   将接种与培养培养充分混合。\n    *   让混合物固化。\n    *   在 30°C ± 1°下培养 3 天。\n    *   对菌落进行计数并选择确认。\n\
  *   这些步骤使得评估牛奶样品中存在的微生物数量成为，提供其细菌学质量和安全性的信息。生奶经过一系列微生物分析以控制其卫生质量 [11]。这些分析总结在表 9.1。\n\
  \n    表 9.1 生奶分析\n\n    | 目标细菌 | 使用的培养基 | 培养温度 | 培养时间 |\n    | --- | --- | --- |\
  \ --- |\n    | 嗜温总菌 | `PCA` | 37°C | 24 小时 |\n    | --- | --- | --- | --- |\n  \
  \  | 总大杆菌 | `VRBL` | 37°C | 24 到 48 小时 |\n\n\n\n\n\n| 肠大杆菌 | VRBL | 44°C | 24 至\
  \ 48 小时 |\n| :--- | :--- | :--- | :--- |\n| 酵母和霉菌 | OGA | 25°C | 3 至 5 天 |\n| 金黄色葡萄球菌\
  \ | BP | 37°C | 24 小时 |\n| 梭菌 SR | VF | 37°C | 24 至 48 小时 |\n\n分析结果如表所示，符合既有标准。该分析在\
  \ 30°C 左右的温度下孵育 72 小时后，使用 `PCA` 进行。\n\n## 9.3.1.1 牛奶接收方法\n\n牛奶接收分为几个阶段。在清空储奶罐之前，会取样在实验室进行物理化学和微生物学分析，并对酸度、脂肪含量、密度和\
  \ `pH` 进行快速测试。\n\n接收阶段如下：\n\n*   **脱气**：牛奶通过一个脱气器，以消除牛奶中存在的气味和气泡。\n*   **过滤**：牛奶通过两个孔径逐渐增加的圆柱金属过滤器，拦截不需要的悬浮物，如碎屑、绒絮等。定期清洗这些过滤器对于保持其效率至关重要。\n\
  *   **冷却**：牛奶在储存前，通过板式换热器冷却至 `4°C`，在换热器中使用逆流冷却水进行冷却。冷却的目的是停止微生物活动。\n*   **储存**：根据牛奶的状态和公司的经营活动，牛奶可以进行储存或直接加工。\n\
  \n**热处理（或预巴氏菌）**：这是一种对生奶采用的强度较弱的热处理，在 83°C 至 88°C 的温度下持续约 15 秒。该处理的目的是杀灭牛奶中的病原菌和大部分常见细菌菌群，尽管其强度低于巴氏杀菌。这些不同阶段确保了牛奶在储存或进一步加工前的质量和安全。\n\
  \n## 9.4 结果与讨论\n\n### 9.4.1 牛奶的物理化学分析\n\n图图 9.3、9.4 和 9.5 展示了三个确定位置四个样本的分析结果，分别为：生奶、热处理牛奶；热处理一小时后的牛奶，如\
  \ `AC`、`MG`、`TP`、`EST`、`T`、`TA`。\n\n![图 9.3 生奶物理化学分析结果。](img/fig9_3_B.jpg)\n\n图\
