    The direct part of the dryer that is made is the double glazing, which is a glass
    wall made up of two panes of glass separated by a layer of still air, known as
    the “air gap”. The advantage of double glazing is that it provides better thermal
    insulation, as the air space is a good insulator, much better than the glass itself.
    Double glazing thus reduces condensation and heat loss.


    The thicknesses are often referred to as `a/b/c`. Where `a`, `b` and `c` are the
    thicknesses in millimeters of the elements (outer pane, air space, inner pane).
    Common double glazing is `4/3/4/` [[7](#ch10.xhtml#ref10_7)]. In the base of the
    direct part an insulation (`polystyrene`) and above an absorber to convert solar
    radiation into heat have been placed.


    The indirect part consists of the drying chamber, which is a cabinet in the form
    of a parallelepiped. Its volume is `(120 cm × 60 cm × 60 cm)` or `432 × 10^3 cm³`.
    Its walls are made of `TRESPA` wood with a thickness of `0.8 cm`. `TRESPA` is
    an extremely versatile material. The panels can easily be combined with other
    materials. Manufactured under high pressure and at high temperature from a mixture
    of up to 70% wood or cellulose fibers and thermosetting resins, `TRESPA` is an
    extremely stable, dense board. The dryer has a glass door with an aluminum frame
    to put product into the drying chamber and to recover it at the end of the operation
    [[7](#ch10.xhtml#ref10_7)]. Three rectangular trays are placed on the drying chamber.
    The mesh rack is surrounded by wood and has a size of `(52 cm × 61 cm)`. Its openings
    are `(2.5 mm × 2.5 mm)`. The distance between the trays is `32 cm`. This space
    is large enough to allow for better air circulation ([Figure 10.3](#ch10.xhtml#fig10_3)).


    ![Figure 10.3 Experimented solar dryer.](images/fig10_3_B.jpg)


    [Figure 10.3 Experimented solar dryer.](#ch10.xhtml#R_fig10_3)


    ### 10.2.3 Steps Followed for the Collection of Measurements


    In order to carry out the different tests we used several experimental devices
    with different measuring instruments. A `Kepp and Zonen pyranometer` was used
    to measure the global solar radiation on a horizontal plane, and four `thermocouples`
    were used to measure the temperature at different parts of the dryer. These `thermocouples`
    convert temperature into voltage. When two electrical wires made of different
    metals are joined, a very low electrical voltage is generated. This voltage is
    a function of the temperature of the junction and the type of metals that make
    up the thermocouple wires. Since the temperature characteristics of metals are
    well known, it is easy to convert the voltage produced by the junction to its
    temperature.


    ## 10.3 Results and Discussion


    The drying of medicinal and aromatic plants often remains a poorly controlled
    and costly process for producers. The water content of a medicinal plant must
    be reduced rapidly to preserve it, but at a low temperature so as not to deteriorate
    its active principles. In the food industry in general, the optimization of the
    drying operation must meet two essential requirements, which are the limited consumption
    of the necessary energy and the preservation of the quality of the dried product.
    In this part we are particularly interested in the experimental study of a mixed
    solar dryer equipped with an intelligent system that controls the ventilation.


    The solar drying prototype ensures the full use of thermal energy from the Sun.
    In order to study the usefulness of this system, it is necessary to study the
    different variables inside the system. Thus, with the help of several instruments,
    the radiation inside the direct part of the dryer, the temperature of the glazing
    and the temperature of the absorber as well as the temperature of the area on
    the first and third floor of the indirect part were measured. The results of these
    measurements are shown in [Figure 10.4](#ch10.xhtml#fig10_4).


    ![Figure 10.4 Solar radiation and temperature variation inside the solar dryer
    as function of time. (a) Solar radiation hourly variation; (b) Variation of temperature
    inside the indirect part; (c) Variation of temperature inside the direct part.](images/fig10_4_B.jpg)


    [Figure 10.4 Solar radiation and temperature variation inside the solar dryer
    as function of time. (a) Solar radiation hourly variation; (b) Variation of temperature
    inside the indirect part; (c) Variation of temperature inside the direct part.](#ch10.xhtml#R_fig10_4)


    According to the figure, which represents the variation of the global irradiation
    on horizontal plane inside the direct part of the dryer, we notice a considerable
    decrease of the radiation since it decreases from `528 W/m²` outside to `305 W/m²`
    inside which represents more than 40% of lost solar radiation. This loss is mainly
    due to the inclination of the glazing, which is greater than `70°`, and to the
    nature of the glazing, which is double-glazed.


    When it comes to temperature variation, it can be seen that in the direct part
    the temperature of the absorber and the internal glazing can reach `35°C`, while
    in the indirect part the temperature decreases from one floor to another. This
    decrease is mainly due to the loss of thermal energy through the uninsulated side
    walls.


    ## 10.4 Conclusion


    The energy we receive from the Sun on Earth is the energy the Sun emits primarily
    in the form of heat and light. Since the Sun is an inexhaustible source of energy
    and its daily utilization is essential, it is considered the main energy resource
    that ensures the survival of life on Earth. The main use of this energy is to
    capture sunlight and convert it into heat or electricity. Sun drying varies from
    region to region, and there are different ways to ensure the success of this process.
    The designated area should have high ambient temperature and high solar radiation
    intensity. Morocco receives plenty of sun on most days of the year, so drying
    time and product quality retention are his basic criteria for choosing the right
    drying method. Drying is one of the basic processes that effectively increases
    the shelf life of products in the food industry; in recent years, the use of solar
    dryers has seen great development. Thus, the aim of our work was to study the
    variation of temperature and radiation inside a mixed solar dryer.


    The experimental study showed a significant reduction in the radiation passing
    through the glass, from `528 W/m²` outside to `305 W/m²` inside, which represents
    more than 40% of the lost solar radiation. This loss is mainly due to the inclination
    of the glazing, which is greater than `70°`, and to the nature of the glazing,
    which is double-glazed. In terms of temperature variation, in the direct part,
    the temperature of the absorber and the internal glazing can reach `35°C`, while
    in the indirect part, the temperature decreases from floor to floor. This decrease
    is mainly due to the loss of thermal energy through the uninsulated side walls.


    ## References


    1.  [Hii, C. L., Law, C. L., & Cloke, M.](#ch10.xhtml#R_ref10_1) (2008). Modelling
    of thin layer drying kinetics of cocoa beans during artificial and natural drying.
    Journal of Engineering Science and Technology, *3*(1), 1–10.

