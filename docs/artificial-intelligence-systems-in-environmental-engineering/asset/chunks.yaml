    Declining soil quality has significant implications for the development of future
    agricultural and water resources. Furthermore, it has great impacts on human health
    and ecosystem services. [Figure 2.7](#ch2.xhtml#fig2_7) illustrates the relationship
    between soil degradation and water; agriculture; and human activity and the ecosystem.


    ![Figure 2.7 Relationship between soil degradation and water; agriculture; and
    human activity and the ecosystem.](images/fig2_7_B.jpg)


    [Figure 2.7 Relationship between soil degradation and water; agriculture; and
    human activity and the ecosystem.](#ch2.xhtml#R_fig2_7)


    ## 2.3 Historical Evidence


    In Mesopotamia during the Bronze Age (4000–1100 BC) urban centers were focused
    in the cities of Sumer and Acad ([Figure 2.8](#ch2.xhtml#fig2_8)). The population
    of these cities was between 50,000 and 80,000, and about 90% of the population
    lived in such areas. At the beginning of the development of these kingdoms, almost
    half of the population worked in the large irrigated farms surrounding each city.
    As modern methods and tools developed during the time of the Sumerians, Mesopotamia
    witnessed major development in irrigated agriculture, with just 1% of the community
    able to feed the rest of the population. Encouraging farmers to focus on effective
    water management, in one panel, it was stated that the yield could be increased
    by 10% with optimal irrigation management ([Mays 2010](#ch2.xhtml#ref2_16)). Ancient
    farmers also used various means to irrigate their land, including Shadouf, waterwheel
    (Noira), irrigation canals, and dams.


    ![Figure 2.8 Location of Ancient Kingdoms in Mesopotamia (Donn 2019).](images/fig2_8_B.jpg)


    [Figure 2.8 Location of Ancient Kingdoms in Mesopotamia](#ch2.xhtml#R_fig2_8)
    ([Donn 2019](#ch2.xhtml#ref2_3)).


    One of the main causes for the deterioration of Sumerian civilization was the
