    characteristics of E24 sample (Issen upstream) with fractures at the level of
    a fracture whose edge is fresh.](#ch1.xhtml#R_fig1_4)


    ![Figure 1.5 Exoscopy of the quartz grains of the E17 sample (upstream part).
    Note the large microfracturation linked to the mechanical action, slightly abraded
    edges with fresh impact marks.](images/fig1_5_B.jpg)


    [Figure 1.5 Exoscopy of the quartz grains of the E17 sample (upstream part). Note
