    \ (`pH`, `CO[2]`, `O[2]`)\n* Avoid evaporation to reduce `CO[2]` losses\n* Achieve\
    \ higher microalgae densities\n\n|| \\[[41](#ch8.xhtml#ref8_41), [42](#ch8.xhtml#ref8_42),\
    \ [43](#ch8.xhtml#ref8_43) and [44](#ch8.xhtml#ref8_44)]\\] ||\n\n* Overheating\n\
    * Biofouling\n* The accumulation of oxygen\n* The high cost of construction\n\n\
    || \\[[39](#ch8.xhtml#ref8_39), [45](#ch8.xhtml#ref8_45), [46](#ch8.xhtml#ref8_46)]\\\
    ] |\n\nDespite this, the success of each small- or large-scale cropping system\
    \ depends on many parameters, such as the efficient intensity of the light source,\
    \ the optimal transfer of gas and liquid, the ease of use, low level of contamination,\
    \ low production, minimum area, nutrient maximization, and temperature control\
    \ ([Figure 8.2](#ch8.xhtml#fig8_2)).\n\n![Figure 8.2 Refers to photobioreactor\
    \ perspective.](images/fig8_2_B.jpg)\n\n[Figure 8.2 Refers to photobioreactor\
    \ perspective.](#ch8.xhtml#R_fig8_2)\n\n### 8.2.3 Interaction of Microalgae with\
    \ Nutrients\n\nIt is important to note that photosynthetic organisms have evolved\
    \ in a constantly changing world. Photosynthetic organisms collect energy from\
    \ sunlight through pigment-protein complexes located in membranes in order to\
    \ promote energy transfer [[47](#ch8.xhtml#ref8_47)]. [Figure 8.3](#ch8.xhtml#fig8_3)\
    \ shows the types and broad classes of microalgae, with characteristics:\n\n![Figure\
    \ 8.3 Classification of the main types of microalgae, their species and their\
    \ biological activities.](images/fig8_3_B.jpg)\n\n[Figure 8.3 Classification of\
    \ the main types of microalgae, their species and their biological activities.](#ch8.xhtml#R_fig8_3)\n\
    \nNutrients such as carbon, nitrogen, and phosphorus play an important role in\
    \ cell metabolism and the biochemical composition of microalgae [[48](#ch8.xhtml#ref8_48)].\
    \ In addition, for microalgae growth, there must be the presence of trace elements,\
    \ especially metals, such as `Mg`, `Ca`, `Mn`, `Zn`, `Cu`, and `Mo` [[49](#ch8.xhtml#ref8_49),\
    \ [50](#ch8.xhtml#ref8_50)]. Microalgae play an important role in nitrogen fixation\
    \ and uptake. They include cyanobacteria that are capable of binding atmospheric\
    \ molecular nitrogen (`N[2]-N`) and converting it to ammonia nitrogen (`NH[3]-N`),\
    \ which can be excreted into the environment by the following equation [[51](#ch8.xhtml#ref8_51)]:\n\
    \n(8.1)\n\n```\n$$N_{2} + 8H^{+} + 8_{e^{-}} + 16 + {ATP}\\overset{\\\\text{Nitrogenase}}{\\\
    rightarrow}2{NH}_{3} + H_{2} + 16\\ {ADP} + 16P_{i}$$\n```\n\nEukaryotic microalgae,\
    \ in turn, are able to assimilate fixed nitrogen such as `NH[4]-N`, `NO[3]-N`\
    \ and nitrate reductase and nitrite reductase according to the following two equations\
    \ [[52](#ch8.xhtml#ref8_52)]:\n\n(8.2)\n\n```\n$${NO}_{3}^{-} + 2H^{+} + 2\\_{e}^{-}\\\
    overset{\\text{Nitrate\\ reductase}}{\\rightarrow}\\ {NO}_{2}^{-} + H_{2}O$$\n\
    ```\n\n(8.3)\n\n```\n$${NO}_{2}^{-} + 8H^{+} + 6\\_{e}^{-}\\overset{\\text{Nitrite\\\
    \ reductase}}{\\rightarrow}\\ {NH}_{4}^{+} + 2H\\_{2}O$$\n```\n\nAs long as `NH[4]-N`\
    \ uptake does not require reduction steps, it is thought to be the preferred form\
    \ of nitrogen for microalgae. Therefore, in addition to the absorption of microalgae,\
    \ the removal of `NH[4]-N` can occur in response to an increase in `pH` and temperature,\
    \ where large amounts of `NH[4]-N` can be volatilized [[53](#ch8.xhtml#ref8_53),\
    \ [54](#ch8.xhtml#ref8_54)].\n\n## 8.3 Results and Discussions\n\n### 8.3.1 Wastewater\
    \ Treatment Techniques Using Microalgae\n\nFor an example of the use of microalgae\
    \ as a wastewater treatment technique which contains a high level of nutrients\
    \ from physicochemical analyses, we take the example of the work elaborated by\
    \ Gharmouli et al., who studied the removal of organic pollutants contained in\
    \ wastewater by *Arthrospira platensis*. Based on this study, they found a decrease\
    \ in electrical conductivity and the absence of ammonia and nitrite in the medium\
    \ with a decrease in nitrate value, as well as total nitrogen under a temperature\
    \ of 32°C [[55](#ch8.xhtml#ref8_55)]. A comparative study on the use of microalgae-bacterial\
    \ consortia in wastewater treatment to examine and compare microbial communities\
    \ associated with a green algae consortium was conducted. The results show that\
    \ a large part of the nitrogen and carbon has been removed, which opens up a [[56](#ch8.xhtml#ref8_56)].\n\
    \n### 8.3.2 Nutritional Value in the Species *Chlorella*\n\nBiotechnology interest\
    \ in microalgae and cyanobacteria has focused on their content in valuable metabolites\
    \ that can be used to develop a wide range of applications in fields such as medicine,\
    \ industry, energy, agriculture, food [[60](#ch8.xhtml#ref8_60)]. Most cosmetic\
    \ actions, supported by the literature and claimed by the market, are, on the\
    \ one hand, anti-aging, moisturizing, antioxidant and lightening properties, and,\
    \ on the other hand, anti-acne and healing properties [[61](#ch8.xhtml#ref8_61)].\
    \ \n\nPhotosynthetic microorganisms are becoming established as one of the most\
    \ important alternatives for implementing it in the techniques of wastewater treatment\
    \ and noted a growing interest, in particular with regard to the microalgae that\
    \ are gradually imposed in the scientific and industrial world. The interest in\
    \ microalgae is currently growing as they are capable of removing nutrients. Therefore,\
    \ in order to select the most appropriate species for the purpose of removing\
    \ nutrients, the species’ ability to accumulate and its tolerance against toxic\
    \ effects must be studied.\n"
  raw: "| **Closed system** |\n\n| \n\n*   Control growing conditions and growth parameters\
    \ (pH, CO[2], O[2])\n\n*   Avoid evaporation to reduce CO[2] losses\n\n*   Achieve\
    \ higher microalgae densities\n\n || \\[[41](#ch8.xhtml#ref8_41), [42](#ch8.xhtml#ref8_42),\
    \ [43](#ch8.xhtml#ref8_43) and [44](#ch8.xhtml#ref8_44)\\] || \n\n*   Overheating\n\
    \n*   Biofouling\n\n*   The accumulation of oxygen\n\n*   The high cost of construction\n\
    \n || \\[[39](#ch8.xhtml#ref8_39), [45](#ch8.xhtml#ref8_45), [46](#ch8.xhtml#ref8_46)\\\
    ] |\n\nDespite this, the success of each small- or large-scale cropping system\
    \ depends on many parameters, such as the efficient intensity of the light source,\
    \ the optimal transfer of gas and liquid, the ease of use, low level of contamination,\
    \ low production, minimum area, nutrient maximization, and temperature control\
    \ ([Figure 8.2](#ch8.xhtml#fig8_2)).\n\n![Figure 8.2 Refers to photobioreactor\
    \ perspective.](images/fig8_2_B.jpg)\n\n[Figure 8.2 Refers to photobioreactor\
    \ perspective.](#ch8.xhtml#R_fig8_2)\n\n### 8.2.3 Interaction of Microalgae with\
    \ Nutrients\n\nIt is important to note that photosynthetic organisms have evolved\
    \ in a constantly changing world. Photosynthetic organisms collect energy from\
    \ sunlight through pigment-protein complexes located in membranes in order to\
    \ promote energy transfer \\[[47](#ch8.xhtml#ref8_47)\\]. [Figure 8.3](#ch8.xhtml#fig8_3)\
    \ shows the types and broad classes of microalgae, with characteristics:\n\n![Figure\
    \ 8.3 Classification of the main types of microalgae, their species and their\
    \ biological activities.](images/fig8_3_B.jpg)\n\n[Figure 8.3 Classification of\
    \ the main types of microalgae, their species and their biological activities.](#ch8.xhtml#R_fig8_3)\n\
    \nNutrients such as carbon, nitrogen, and phosphorus play an important role in\
    \ cell metabolism and the biochemical composition of microalgae \\[[48](#ch8.xhtml#ref8_48)\\\
    ]. In addition, for microalgae growth, there must be the presence of trace elements,\
    \ especially metals, such as Mg, Ca, Mn, Zn, Cu, and Mo \\[[49](#ch8.xhtml#ref8_49),\
    \ [50](#ch8.xhtml#ref8_50)\\]. Microalgae play an important role in nitrogen fixation\
    \ and uptake. They include cyanobacteria that are capable of binding atmospheric\
    \ molecular nitrogen (N[2]\\-N) and converting it to ammonia nitrogen (NH[3]\\\
    -N), which can be excreted into the environment by the following equation \\[[51](#ch8.xhtml#ref8_51)\\\
    ]:\n\n(8.1)  \n\n$$N\\_{2} + 8H^{+} + 8\\_{e^{-}} + 16 + {ATP}\\\\overset{\\\\\
    text{Nitrogenase}}{\\\\rightarrow}2{NH}\\_{3} + H\\_{2} + 16\\\\ {ADP} + 16P\\\
    _{i}$$  \n\nEukaryotic microalgae, in turn, are able to assimilate fixed nitrogen\
    \ such as NH[4]\\-N, NO[3]\\-N and nitrate reductase and nitrite reductase according\
    \ to the following two equations \\[[52](#ch8.xhtml#ref8_52)\\]:\n\n(8.2)  \n\n\
    $${NO}\\_{3}^{-} + 2H^{+} + 2\\_{e}^{-}\\\\overset{\\\\text{Nitrate\\\\ reductase}}{\\\
    \\rightarrow}\\\\ {NO}\\_{2}^{-} + H\\_{2}O$$  \n\n(8.3)  \n\n$${NO}\\_{2}^{-}\
    \ + 8H^{+} + 6\\_{e}^{-}\\\\overset{\\\\text{Nitrite\\\\ reductase}}{\\\\rightarrow}\\\
    \\ {NH}\\_{4}^{+} + 2H\\_{2}O$$  \n\nAs long as NH[4]\\-N uptake does not require\
    \ reduction steps, it is thought to be the preferred form of nitrogen for microalgae.\
    \ Therefore, in addition to the absorption of microalgae, the removal of NH[4]\\\
    -N can occur in response to an increase in pH and temperature, where large amounts\
    \ of NH[4]\\-N can be volatilized \\[[53](#ch8.xhtml#ref8_53), [54](#ch8.xhtml#ref8_54)\\\
    ].\n\n## 8.3 Results and Discussions\n\n### 8.3.1 Wastewater Treatment Techniques\
    \ Using Microalgae\n\nFor an example of the use of microalgae as a wastewater\
    \ treatment technique which contains a high level of nutrients from physicochemical\
    \ analyses, we take the example of the work elaborated by Gharmouli et al., who\
    \ studied the removal of organic pollutants contained in wastewater by *Arthrospira\
    \ platensis*. Based on this study, they found a decrease in electrical conductivity\
    \ and the absence of ammonia and nitrite in the medium with a decrease in nitrate\
    \ value, as well as total nitrogen under a temperature of 32°C \\[[55](#ch8.xhtml#ref8_55)\\\
    ]. A comparative study on the use of microalgae-bacterial consortia in wastewater\
    \ treatment to examine and compare microbial communities associated with a green\
    \ algae consortium was conducted. The results show that a large part of the nitrogen\
    \ and carbon has been removed, which opens up a potentially economically viable\
    \ wastewater treatment process \\[[56](#ch8.xhtml#ref8_56)\\]. A very good result\
    \ is obtained in the work of De La Noue et al., who carried out the study on an\
    \ urban effluent by a culture of the species Scenedesmus on a modified medium,\
    \ in which they noticed a depletion greater than 90% is obtained for 48 hours\
    \ for nitrogen and phosphorus. It appears that the raw effluent provides a growth\
    \ greater than the synthetic medium and comparable to the filtered effluent, which\
    \ indicates the potential for Scenedesmus may be used as a tertiary treatment\
    \ agent \\[[57](#ch8.xhtml#ref8_57)\\]. Also, the work of Fredereque proposes\
    \ a new approach to the production of microalgae in industrial parks to treat\
    \ a mixture of different wastewater that has allowed to climb the main genera\
    \ that take over the algae when growing conditions change. Based on this study,\
    \ he was able to demonstrate that the algae-bacteria consortium used is effective\
    \ in removing certain nutrients from wastewater \\[[58](#ch8.xhtml#ref8_58)\\\
    ]. The application of wastewater contaminated with metals is studied by Samadani.\
    \ In his study, he used green algae *Chlamydomonas reinhardtii* and *Chlamydomonas\
    \ acidophila* to select the species most resistant to Cd. He found that, species\
    \ *C. reinhardtii* showed a higher intracellular Cd accumulation capacity compared\
    \ to *C. acidophila* \\[[59](#ch8.xhtml#ref8_59)\\].\n\n### 8.3.2 Nutritional\
    \ Value in the Species *Chlorella*\n\nBiotechnology interest in microalgae and\
    \ cyanobacteria has focused on their content in valuable metabolites that can\
    \ be used to develop a wide range of different applications in fields such as\
    \ medicine, industry, energy, agriculture, food, and others \\[[60](#ch8.xhtml#ref8_60)\\\
    ]. Most cosmetic actions, supported by the literature and claimed by the market,\
    \ are, on the one hand, anti-aging, including moisturizing, antioxidant and lightening\
    \ properties, and, on the other hand, anti-acne and healing properties \\[[61](#ch8.xhtml#ref8_61)\\\
    ].\n\n## 8.4 Conclusion\n\nPhotosynthetic microorganisms are becoming established\
    \ as one of the most important alternatives for implementing it in the techniques\
    \ of wastewater treatment and noted a growing interest, in particular with regard\
    \ to the microalgae that are gradually imposed in the scientific and industrial\
    \ world. The interest in microalgae is currently growing as they are regarded\
    \ as organisms capable of removing nutrients from wastewater. This work shows\
    \ the importance of the use of microalgae in wastewater treatment. Therefore,\
    \ in order to select the most appropriate species for the purpose of removing\
    \ nutrients from the environment, the species’ ability to accumulate and its tolerance\
    \ against toxic effects must be studied.\n\n## References\n\n1.  [D. Mani and\
    \ C. Kumar](#ch8.xhtml#R_ref8_1), “Biotechnological advances in bioremediation\
    \ of heavy metals contaminated ecosystems: an overview with special reference\
    \ to phytoremediation”, *Int. J. Environ. Sci. Technol*., vol. 11, no. 3, pp.\
    \ 843–872, April 2014, doi: [10.1007/s13762-013-0299-8](http://dx.doi.org/10.1007/s13762-013-0299-8).\n\
    \n2.  [Y. A. Idrissi, A. Alemad, S. Aboubaker, H. Daifi, K. Elkharrim, and D.\
    \ Belghyti](#ch8.xhtml#R_ref8_2), “Caractérisation physico-chimique des eaux usées\
    \ de la ville d’Azilal, Maroc” (Physicochemical characterization of wastewater\
    \ from Azilal city, Morocco), vol. 11, no. 3, p. 12, 2015.\n\n3.  [M. Gafsi, A.\
    \ Kettab, S. Benmamar, and S. Benziada](#ch8.xhtml#R_ref8_3), Cas d’une pollution:\
    \ l’eutrophisation dans les cours d’eau, p. 9, 2008."
