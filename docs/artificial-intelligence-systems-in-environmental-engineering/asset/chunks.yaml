    ## 8.1 Introduction


    Water is a very limited natural resource in arid and semi-arid regions [[1](#ch8.xhtml#ref8_1)].
    The existing resources are threatened by pollution from urban and industrial discharges
    to receptor environments [[2](#ch8.xhtml#ref8_2), [3](#ch8.xhtml#ref8_3), [4](#ch8.xhtml#ref8_4)
    and [5](#ch8.xhtml#ref8_5)]. These releases may contain many substances, both
    solid and dissolved, as well as many pathogenic microorganisms, which threaten
    the quality of the environment as a whole [[6](#ch8.xhtml#ref8_6), [7](#ch8.xhtml#ref8_7)
    and [8](#ch8.xhtml#ref8_8)]. The water crisis is seen as one of the main global
    problems and threats, even if sufficient water and land resources are available
    [[9](#ch8.xhtml#ref8_9)]. According to the United Nations World Water Development
    Report (2014), more than two million tons of wastewater, agricultural and industrial
    waste are dumped untreated into lakes, rivers, and other bodies of water in developing
    countries, ending up polluting the usable water supply [[10](#ch8.xhtml#ref8_10)].
    Wastewater from homes, industries, businesses, and institutions contains many
    substances that may pose risks to human health and the environment [[11](#ch8.xhtml#ref8_11)].
    Domestic wastewater, on the other hand, comes from lavatories as well as household
    water (kitchen, bathroom, laundry, and water generated by certain household appliances
    other than a lavatory) [[12](#ch8.xhtml#ref8_12)]. Among the effluents found in
    the wastewater are synthetic chemical compounds that are difficult to biodegrade,
    and mutagenic and/or carcinogenic toxicants from these effluents can be found
    at all levels of the food chain when they are discharged into receptor environments
    [[13](#ch8.xhtml#ref8_13)]. It is therefore necessary to find an alternative water
    treatment [[14](#ch8.xhtml#ref8_14)]. In recent years, countless biotechnological
    applications have emerged, such as bioremediation, which could allow wastewater
    treatment without all these disadvantages [[15](#ch8.xhtml#ref8_15)]. This process
    involves the use of microorganisms, usually bacteria or fungi, to remove pollutants
    from the soil and water [[16](#ch8.xhtml#ref8_16)]. The art of using algae (either
    macro- or microalgae) in the removal, biotransformation or mineralization of various
    nutrients, heavy metals and xenobiotics from wastewater and residual air carbon
    dioxide is known as bioremediation [[17](#ch8.xhtml#ref8_17), [18](#ch8.xhtml#ref8_18)].
    During this treatment, nitrogen, phosphorus and other salts are used [[19](#ch8.xhtml#ref8_19),
    [20](#ch8.xhtml#ref8_20)]. Algae play key roles [[21](#ch8.xhtml#ref8_21), [22](#ch8.xhtml#ref8_22)].
    They can even produce organic matter [[23](#ch8.xhtml#ref8_23), [24](#ch8.xhtml#ref8_24)].


    The main objective of this work is to evaluate the effectiveness of using algae
    for the treatment of wastewater and the elimination of metals.


    ## 8.2 Materials and Methods


    ### 8.2.1 Microalgae Culture


    The cultivation of microalgae can be carried out in open ponds or photobiactors
    [[18](#ch8.xhtml#ref8_18)]. The use of open systems is quite common [[25](#ch8.xhtml#ref8_25),
    [26](#ch8.xhtml#ref8_26), [27](#ch8.xhtml#ref8_27)]. Microalgae grow very quickly
    with an estimated yield of about 77 g/m²/day [[28](#ch8.xhtml#ref8_28).


    **Open system:**


    Open systems such as ponds are used for algal culture [[29](#ch8.xhtml#ref8_29)].
    However, this is difficult and requires strict sterilization of media to avoid
    contamination [[30](#ch8.xhtml#ref8_30)]. The types of open systems include large
    ponds and circular ponds [[31](#ch8.xhtml#ref8_31)].


    Figure 8.1 shows a representative diagram of an open system.


    ![Figure 8.1 Open system](images/fig8_1.jpg)


    **Closed system:**


    Photobioreactors are made from transparent materials to allow better control of
    culture parameters (temperature, carbon dioxide and pH) [[32](#ch8.xhtml#ref8_32)].
    They offer a closed culture environment, protect the culture from direct contamination,
    and minimize evaporation of the growing medium while facilitating the supply of
    CO2 [[33](#ch8.xhtml#ref8_33)]. The photobioreactor allows the efficient arrangement
    of light but also the removal of oxygen produced by photosynthesis. For better
    control of the process, a possible solution is to carry out closed crops. The
    principle of closed systems is to put microalgae in contact with natural light
    through a transparent material.


    ### 8.2.2 Advantages and Disadvantages


    Microalgae culture systems have both advantages and disadvantages depending on
    the desired products where they are classified in Table 8.1.


    **Table 8.1 Advantages and Disadvantages of Microalgae Culture Systems**


    | Advantages | Ref. | Disadvantages | Ref. |

    | :--- | :--- | :--- | :--- |

    | **Open system** | | | |

    | A low cost | [34] | Difficult to control growing conditions | [38] |

    | Maintenance | [35] | Threats of contamination | [39] |

    | Construction | [36] | Evaporative losses | [40] |

    | Configuration is easy to complete | [37] | | |

