    # Chapter 6 Remote Monitoring of an Inclined Solar Distiller


    Souad Nasrdine


    University Mohammed V in Rabat, Morocco


    Mohammed Benchrifa


    University Mohammed V in Rabat, Morocco


    Ibn Tofaïl University—Kenitra-University Campus, Kenitra, Morocco


    Najlaa Ben-Lhachemi, Jamal Mabrouki, and Miloudia Slaoui


    University Mohammed V in Rabat, Morocco


    DOI: [10.1201/9781003436218-6](https://dx.doi.org/10.1201/9781003436218-6)


    ## 6.1 Introduction


    Water is essential for human life, it makes up 65% of the human body, and covers
    70% of the Earth’s surface. Lately, however, the availability of fresh water is
    decreasing from natural resources more and more due to pollution. Water, climate
    change and falling groundwater levels are observed all around the world. According
    to studies carried out, they have shown that the availability of water should
    decrease by between 10 and 30% in certain arid and semi-arid regions \[[1](#ch6.xhtml#ref6_1)\],
    which will lead us to look for effective and less energy-consuming solutions to
    alleviate water shortages. The most effective way to purify contaminated water
    on a small scale is solar-powered desalination, which uses a free, renewable energy
    source.


    In the field of solar desalination \[[2](#ch6.xhtml#ref6_2)\], the solar still
    is frequently used because of its straightforward construction, but its performance
    is relatively low when compared to other technologies. Several study projects
    are currently in progress to improve the productivity of the simple solar still,
    which was invented in 1872, by the Swedish engineer Charles Wilson \[[3](#ch6.xhtml#ref6_3),
    [4](#ch6.xhtml#ref6_4) and [5](#ch6.xhtml#ref6_5)\]. The solar still works according
    to the same principles as rain: evaporation and condensation. It uses the sun’s
    rays to heat brackish water at the level of the basin, which evaporates, then
    condenses on the front part of the glass. The two main types of solar distillation
    systems currently available are passive systems and active systems \[[6](#ch6.xhtml#ref6_6)\].
    Simple passive stills are the most practical solar distillation system because
    they are less expensive and require no other source of energy apart from the Sun
    to operate. There are several different types of such stills. However, although
    they may differ in terms of materials used, design and functionality, they all
    follow the same basic principles. We find the single-effect still \[[7](#ch6.xhtml#ref6_7)\]
    and the double-effect solar still \[[8](#ch6.xhtml#ref6_8), [9](#ch6.xhtml#ref6_9)\]…
    However, active solar stills use an additional source of energy to speed up the
    evaporation process \[[10](#ch6.xhtml#ref6_10)\]. They may differ in terms of
    materials used, design, and functionality; they all follow the same basic principles.


    The main objective of any solar distillation system is to have the maximum productivity.
    The performance of the still depends on several factors, such as meteorological
    parameters: ambient temperature, solar irradiation, glass temperature and other
    operating and construction parameters.


    In this study, we used AI to optimize the efficiency of solar stills by integrating
    a solenoid valve to ensure the automatic filling of the tank, and we installed
    level sensors to automatically measure productivity and finally notifications
    of alerts are sent to be informed in real time of the problems detected by the
    AI.


    ## 6.2 Literature Review


    Distillers have existed since antiquity in several conventional forms that have
    been developed over time by researchers to achieve a less expensive form using
    solar energy, but the major drawback of this type of distiller is the low production
    of distillate. However, many studies have continued to use various methods to
    increase the production of solar energy, including coupling the solar distiller
    with a preheating system such as solar collectors \[[11](#ch6.xhtml#ref6_11)\],
    using heat storage materials \[[12](#ch6.xhtml#ref6_12)\], nanomaterials \[[13](#ch6.xhtml#ref6_13)\],
    using a condenser to easily condense the steam inside the tank and collect the
    steam droplets \[[14](#ch6.xhtml#ref6_14)\]. Recent studies have been conducted
    using the Internet of Things and Artificial Intelligence to improve the performance
    of the solar distiller by developing a mathematical model to predict the performance
    of solar distillers \[[15](#ch6.xhtml#ref6_15)\].


    ## 6.3 Proposed System


    Our system is composed of a tilted solar still facing south with a corrugated
    zinc absorber to increase the absorption surface, an ordinary glass cover to act
    as a condenser, and two tanks: one dedicated for the feeding the distiller with
    salt water and the other placed at the ends to recover the distillate.


    ## 6.4 Materials and Methods


    ### 6.4.1 The Operating Principle of a Solar Distiller


    This process is used to heat the water by the energy of solar radiation, which
    passes through the transparent glass cover and falls on the corrugated zinc basin,
    which contains saline water. When water is heated, after a while it reaches a
    high temperature, which allows it to evaporate. The temperature difference between
    the surface of the water and the lower surface of the cover causes the condensation
    of steam on the lower part of the cover. This condensed water is collected in
    gutters.


