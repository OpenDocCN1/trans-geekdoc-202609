    ### 5.3.2 Hydrochemical Analysis


    The chemical analyses are illustrated on the `Piper` diagram and the `Schoeller-Berkaloff`
    diagram. The results of the latter show that the water has identical profiles
    in the majority of the sampling points with the exception of the four points `7`,
    `8`, `10`, and `15` which present high values in some chemical elements, namely
    point `7` in `Na^+`, `K^+`, `HCO[3]^−`, `CO[3]^−`, point `8` in `Mg^(2+)`, `Cl^−`,
    for point `10` in `Na^+`, `Cl^−` and for point `15` in `Mg^(2+)`, `Na^+`, `Cl^−`.
    The `Piper` diagram results reveal the appearance of two types of hydrogeochemical
    facies. The most important of these is the chloride and sulphate calcic and magnesian
    facies found at sampling points `1`, `2`, `3`, `4`, `5`, `6`, `8`, `9`, `11`,
    `12`, `13`, `14`, `15`, `16`, `17`, `18` and `19`, occupying `89.47%`, and the
    other is chloride sodium and potassium facies at points `7` and `10` with a percentage
    of `10.52%`.


    ![Figure 5.2 Piper diagram of Angads groundwater in September 2020](images/fig5_2.jpg)


    ![Figure 5.3 (a–b): Schoeller-Berkaloff diagram of Angads groundwater in September
    2020](images/fig5_3.jpg)


    ### 5.4 Discussion


    The representation of the physicochemical analyses of the groundwater from sampling
    points distributed throughout the Angads aquifer using the `Piper` diagram revealed
    the existence of chloride and sulphate calcic and magnesian facies with a percentage
    of `89.47%`. This shows infiltration and dissolution of the Triassic argillo-evaporite
    rocks, generally representing the mineralized waters. These results have been
    confirmed by previous studies such as Amrani’s study, which presents hydrogeochemical
    and principal component analysis (`PCA`) in the explanation of the groundwater
    chemistry of the plio-quaternary aquifer between Timahdite and Almis Guigou (Middle
    Atlas, Morocco), and Chaoui’s study on the vulnerability to pollution of surface
    and groundwater in the Bouchegouf region (North-East Algeria). The use of the
    `Schoeller-Berkaloff` diagram showed that the majority of the sampling points
    have the same patterns, with the exception of the four points `7`, `8`, `10`,
    and `15`. These points have high values of some chemical parameters, namely point
    `7` in `Na^+`, `K^+`, `HCO[3]^−`, `CO[3]^−`, point `8` in `Mg^(2+)`, `Cl^−`, and
    `SO[4]^(3−)`, for point `10` in `Na^+`, `Cl^−` and for point `15` in `Mg^(2+)`,
    `Na^+`, `Cl^−`, and `SO[4]^(2−)`. This explains why the groundwater in the Angads
    aquifer is highly mineralized. These results have been confirmed by previous studies
    such as the study by [15], and another study by Jilali, which presents the hydrochemistry
    and geothermometry of the thermal waters of northeast Morocco.


    This study illustrates the hydrogeochemistry of the groundwater in our study area
    in order to determine the mineralogical composition of this groundwater given
    the importance of this substance for the health of the population.


    ### 5.5 Conclusion


    In this study, we analyzed the physicochemical parameters of the groundwater of
    the Angads aquifer. The representation of these analyses on the `Piper` diagram
    allows us to deduce the predominance of chloride and sulphate calcic and magnesian
    facies with a percentage of `89.47%` at the level of sampling points `1`, `2`,
    `3`, `4`, `5`, `6`, `8`, `9`, `11`, `12`, `13`, `14`, `15`, `16`, `17`, `18` and
    `19`, and another sodium and potassium chloride facies at the two points with
    a percentage of `10.52%` at two points, `7` and `10`. The results of the `Schoeller-Berkaloff`
    diagram show that the majority of the sampling points have the same patterns,
    with the exception of the four points `7`, `8`, `10`, and `15`. These points have
    high values of some chemical parameters, namely point `7` in `Na^+`, `K^+`, `HCO[3]^−`,
    `CO[3]^−`, point `8` in `Mg^(2+)`, `Cl^−`, and `SO[4]^(3−)`, for point `10` in
    `Na^+`, `Cl^−` and for point `15` in `Mg^(2+)`, `Na^+`, `Cl^−`, and `SO[4]^(2−)`.
    This work confirms that the groundwater in our study is mineralized, in order
    to protect it.

