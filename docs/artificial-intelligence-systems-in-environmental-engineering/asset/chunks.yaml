    # Chapter 5 Geochemical Study of the Angads Groundwater (North-East Morocco) Application
    of the Piper and Schoeller-Berkaloff Diagram


    Latifa Taoufiq, Ilias Kacimi, Mohamed Saadi, and Jamal Mabrouki

    University Mohammed V in Rabat, Morocco


    Nordine Nouayti

    Abdelmalek Essaadi University, Al-Hoceima, Morocco


    Nadia Kassou and Tarik Bouramtane

    University Mohammed V in Rabat, Morocco


    Karima El-Mouhdi

    Higher Institute of Nursing Professions and Healthcare Technics, Meknes, Morocco


    DOI: [10.1201/9781003436218-5](https://dx.doi.org/10.1201/9781003436218-5)


    ## 5.1 Introduction


    All over the world, the use of water resources, mainly groundwater, is increasing,
    due to socio-economic and demographic development, as well as the degradation
    in the quality of surface water.


    In Morocco, water availability is very limited and is likely to decrease in the
    long term due to global warming ([[1](#ch5.xhtml#ref5_1)). Indeed, the forecast
    estimates made by the World Bank in 1994 sounded the alarm. Furthermore, renewable
    water resources per capita are likely to decrease by half, from 800 m³ in 1990
    to 400 m³ in 2020, thus classifying Morocco in the category of countries in a
    situation of chronic water stress ([[2](#ch5.xhtml#ref5_2)). Indeed, the composition
    of groundwater reflects interactions with the vegetation cover, the characteristics
    of the soil through which it flows, the inputs from the atmosphere, the presence
    of industrial or agricultural activities, and the lithology of the geological
    formations that host the aquifers ([[3](#ch5.xhtml#ref5_3), [[4](#ch5.xhtml#ref5_4)).
    Moreover, groundwater is traditionally the water resource for human consumption
    and irrigation, as it is less polluting than surface water ([[5](#ch5.xhtml#ref5_5),
    [[6](#ch5.xhtml#ref5_6)). The degradation of groundwater quality is caused by
    various sources of pollution, such as fertilizers, pesticides, untreated water
    discharges, etc., as well as the geological formations that make up the groundwater.
    Hence the need for physicochemical and bacteriological analyses, which constitute
    a reliable source of information to characterize the impact of human, agricultural,
    and industrial activities and of the different landscape units ([[7](#ch5.xhtml#ref5_7)),
    as well as the origin of mineralization.


    The objective of this work is to make a geochemical study of the groundwater of
    the Angads based on the Piper diagram and Schoeller-Berkaloff diagram. The aim
    is to know the state of mineralization of this aquifer to understand the impact
    of various activities.


    ## 5.2 Materials and Methods


    ### 5.2.1 Site


    The study site is represented by the Angads aquifer which covers an area of 460
    km² ([[8](#ch5.xhtml#ref5_8)). It is bounded to the south by Hamra, to the west
    by Megrez ([[9](#ch5.xhtml#ref5_9)), and to the east by Snassen ([[10](#ch5.xhtml#ref5_10)).


    ```

    Figure 5.1 Map of the location

    ```

    (See `images/fig5_1.jpg`)


    ### 5.2.2 Conduct of the Study


    The study was conducted in 2020. Nineteen sampling points were taken throughout
    the study: (a) two boreholes, (b) one well located near and the other wells downstream.


    The geochemical study of groundwater has been represented by two diagrams, the
    first of which is `Piper`, which represents the chemical facies of major cations
    (`Ca2+`, `Mg2+`, `Na+`, `K+`) and major anions (`HCO3-`, `Cl-`, `SO42-`, `NO3-`)
    ([[11](#ch5.xhtml#ref5_11)). The second diagram is `Schoeller-Berkaloff` which
    characterizes the chemical facies of several glasses ([[12](#ch5.xhtml#ref5_12)).
    The cartographic representation of the data was carried out using a Geographic
    Information System (`GIS`).


    ## 5.3 Results


    ### 5.3.1 Physicochemical and Bacteriological Analyses


    The parametric results of the physicochemical analyses of the groundwater from
    nineteen sampling points of the Angads aquifer ([Table 5.1](#ch5.xhtml#table5_1))
    reveal that the `Cond` varies from `10,355 μS/cm-1` to `986 μS/cm-1`, with an
    average of `2463 μS/cm-1` and a standard deviation of `2172`. The `pH` varies
    from 6.95 to 7.55 with a mean of 7.20 and a standard deviation of 0.20. For cations
    such as `Na+` the values vary from `44 mg/l` to `1227 mg/l`, with a mean of `215
    mg/l` and a standard deviation of `265.6`, `K+` values vary between `0.72 mg/l`
    and `15.30 mg/l` with a mean of `6.38 mg/l` and a standard deviation of `146.62`.
    Then, for the anions such as `NO3-`, the values vary between `5.4 mg/l` and `134
    mg/l` with a mean of `50.6 mg/l` and a standard deviation of `39.80`, and for
    `Cl-`, the values vary `172 mg/l` and `3597` with a mean of `607 mg/l` and a standard
    deviation of 788.9.


