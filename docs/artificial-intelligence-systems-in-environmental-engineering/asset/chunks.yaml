    # Chapter 9 Study of Stability and Evolution of Milk Composition, Fat Globule
    Size and Acids in Raw Cow’s Milk under Natural Conditions


    Qisse Najat


    University Mohammed V in Rabat, Morocco


    Mohammed Benchrifa


    University Mohammed V in Rabat, Morocco


    Ibn Tofaïl University—Kenitra-University Campus, Kenitra, Morocco


    Jamal Mabrouki


    University Mohammed V in Rabat, Morocco


    DOI: [10.1201/9781003436218-9](https://dx.doi.org/10.1201/9781003436218-9)


    ## 9.1 Introduction


    In Morocco, milk is an essential part of the diet for many. It is consumed in
    a variety of forms, including liquid milk, dairy products, yoghurt and cheese.
    Milk is the integral product of the complete and uninterrupted milking of a healthy,
    well-nourished and not overworked dairy cow. It must be collected cleanly and
    contain no colostrum \[[1](#ch9.xhtml#ref9_1)\]. Cow’s milk is a product with
    a number of nutritional qualities that explain why it is such an important part
    of the food pyramid. First and foremost, it is very high in calcium, a mineral
    essential for growth and bone health, as well as for a number of biological functions.
    It is one of the foods that provides the most calcium per serving.


    Milk is a complex product; in-depth knowledge of its composition, the structural
    organization of its compounds and its physicochemical properties is essential
    to understanding milk processing, and the products obtained during the various
    treatments applied on an industrial scale \[[2](#ch9.xhtml#ref9_2)\]. Milk is
    the basic raw material in the preparation of a wide range of fermented dairy products,
    representing a wide variety in terms of preparation, presentation and organoleptic
    quality \[[3](#ch9.xhtml#ref9_3)\]. Milk is a complex reaction medium whose primary
    role is to satisfy all the infant’s nutritional needs. It mainly contains carbohydrates,
    fat, proteins and mineral salts. Other constituents found in milk in trace form
    include vitamins, enzymes and dissolved gases. The natural pH of milk is between
    6.6 and 6.8, and is greatly influenced by its composition.'
