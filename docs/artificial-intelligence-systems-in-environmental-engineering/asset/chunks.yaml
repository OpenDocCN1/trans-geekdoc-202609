    The total absence of worn forms whose edges show no trace of polishing or rounding
    does not necessarily indicate that the deposit is recent. However, it does at
    least allows us not to misinterpret all the grains, especially those where the
    deposits are fed by the tributaries from upstream Issen to the upper basin (case
    of some grains of `E24` and `E17`). On the other hand, the commonly impacted polyhedra
    do not indicate wear by the long path travelled but are rather linked to the impact
    of the quarries installed along the Oued Issen, as in the case of sample `E17`.
    Some grains of samples `E17` and `E5` show inclusions or impurities which may
    prove the hypothesis of a replacement following acid dissolution. The crystallization
    voids can weaken the crystalline integrity of the quartz, thus favouring the location
    of a mechanical impact which will provide numerous microfractures, fragments and
    flakes. This further demonstrates the impact of other crystallization and recrystallization
    factors in the characterization of grain morphology.


    ### 1.4.3 Quartz Grain Sphericity Statistical Analysis


    In addition to the surface state, we have calculated another parameter describing
    the shape. This is the sphericity of the quartz particles. This allowed us to
    interpret the evolution of the roundness of the particles through the analysis
    of SEM images. The basic results of statistical analysis of textures on 43 quartz
    grains are given in [Table 1.3](#ch1.xhtml#table1_3) and the distribution of roundness
    of the quartz particles is shown in [Figure 1.8](#ch1.xhtml#fig1_8).


    ![Figure 1.8 Evolution of the roundness of the quartz particles at different locations
    of the Issen Wadi.](images/fig1_8_B.jpg)


    [Figure 1.8 Evolution of the roundness of the quartz particles at different locations
    of the Issen Wadi.](#ch1.xhtml#R_fig1_8)


    This parameter was evaluated on the basis of data from the analysis of digital
    photos of exoscopic observation of quartz grains taken from four samples of the
    Issen bed. The results obtained confirm and complete those of the morphoscopy.
    The results of analysis of variance, carried out to study the spatial variations
    of the roundness of the quartz particles, showed that at the significance level
    of 10%, and standard deviation (`0.04` to `0.039`), there are significant variations
    in parameters of particles among the different sites ([Table 1.4](#ch1.xhtml#table1_4)).
    The lowest value of the mean was observed at sample `E5` in the upstream, while
    highest value was observed at sample `E24` in the downstream. The maximum value
    for sphericity was registered at sample `E24`, while the highest value of skewness
    was observed at sample `E5`. The minimum sphericity parameter was registered at
    sample `E5`. In fact, the low level of the parameters studied in this location
    were originating primarily from the detachment in the rock downstream ([Figure
    1.7](#ch1.xhtml#fig1_7)).


