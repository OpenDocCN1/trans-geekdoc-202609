    # Chapter 10 Characterization of Climatic Variables Inside a Smart Mixed Solar
    Dryer


    Mohammed Benchrifa

    University Mohammed V in Rabat, Morocco

    Ibn Tofaïl University—Kenitra-University Campus, Kenitra, Morocco

    Jamal Mabrouki and Rachid Tadili

    University Mohammed V in Rabat, Morocco


    DOI: [10.1201/9781003436218-10](https://dx.doi.org/10.1201/9781003436218-10)


    ## 10.1 Introduction


    Drying fruits and vegetables is the oldest methods of preserving agricultural
    products, because the quality of dried produce is significantly improved. Drying
    agricultural produce is primarily aimed at reducing the moisture content to a
    level that can be stored safely for a prolonged period [[1](#ch10.xhtml#ref10_1),
    [2](#ch10.xhtml#ref10_2), [3](#ch10.xhtml#ref10_3), [4](#ch10.xhtml#ref10_4),
    [5](#ch10.xhtml#ref10_5) and [6](#ch10.xhtml#ref10_6)]. It also leads to a reduction
    in weight as well as volume, which reduces packaging, storage and transport costs
    [[7](#ch10.xhtml#ref10_7), [8](#ch10.xhtml#ref10_8), [9](#ch10.xhtml#ref10_9),
    [10](#ch10.xhtml#ref10_10), [11](#ch10.xhtml#ref10_11) and [12](#ch10.xhtml#ref10_12)].
    The choice of foodstuffs to be dried was based on the tomato. Firstly, because
    of its widespread cultivation throughout the world, for its richness in nutrients.
    Secondly, because of their irregular availability. However, their preservation
    through drying allows continuity in their availability. Solar drying is considered
    to be the most widely used solar energy system [[13](#ch10.xhtml#ref10_13)]. Drying
    fruit, vegetables and meat is one of the most energy-intensive processes in the
    food industry and is a better way of reducing post-harvest costs and losses [[14](#ch10.xhtml#ref10_14)].
    For centuries, solar drying has been practised in the open air all over the world.
    The process was used to dry grain, fruit, meat, fish and other food products intended
    for consumption [[15](#ch10.xhtml#ref10_15), [16](#ch10.xhtml#ref10_16) and [17](#ch10.xhtml#ref10_17)].
    However, the traditional drying method suffers from many problems, including the
    impossibility of controlling the drying process correctly, time uncertainty, expensive
    labour costs, the large surfaces required, and the risk of being infected by insects
    [[18](#ch10.xhtml#ref10_18)]. Thus, the objective of our work is to realize and
    experiment a mixed solar dryer, to make it intelligent by adding an embedded system
    and then to evaluate the different climatic variables inside the drying chamber
    and, finally, to study the impact of this system on the drying of the tomatoes.


    ## 10.2 Materials and Methods


    ### 10.2.1 Embedded Systems


    An embedded system is a complex system that integrates software and hardware designed
    together to provide specific functionality. It usually contains one or more microprocessors
    to run a set of programs defined at conception and stored in memories. The hardware
    system and the application (software) are intimately linked and immersed in the
    hardware and are not as easily discernible as in a conventional desktop PC (Personal
    Computer) environment [[19](#ch10.xhtml#ref10_19)].


    An embedded system is self-contained and does not have standard inputs/outputs
    such as a keyboard or computer monitor. As opposed to a PC, the Human Machine
    Interface (HMI) of an embedded system can be as simple as a flashing Light Emitter
    Diode (LED) or as complex as a real-time night vision system; Liquid Crystal Display
    (LCD) displays of generally simple structure are commonly used.


    Embedded systems generally operate in real time (RT): computational operations
    are then performed in response to an external event (hardware interrupt) [[20](#ch10.xhtml#ref10_20)].


    In our case we used an Arduino ‘mega’ ([Figure 10.1](#ch10.xhtml#fig10_1)) board
    equipped with a LM35 temperature sensor to measure the internal temperature of
    the dryer and a relay that turns the fan on or off according to the instructions
    given. However, when the temperature exceeds 40°C, the fan is automatically activated
    to circulate thermal energy throughout the dryer, but when the temperature falls
    below 40°C the fan automatically shuts down, knowing that the test is repeated
    after every minute ([Figure 10.2](#ch10.xhtml#fig10_2)).


    ![Figure 10.1 Used embedded system.](images/fig10_1_B.jpg)


    [Figure 10.1 Used embedded system.](#ch10.xhtml#R_fig10_1)


    ![Figure 10.2 Flowchart of follow-up steps.](images/fig10_2_B.jpg)


    [Figure 10.2 Flowchart of follow-up steps.](#ch10.xhtml#R_fig10_2)


    ### 10.2.2 Characteristics of the Tested Dryer


    Drying is a way of conserving agricultural produce [[21](#ch10.xhtml#ref10_21),
    [22](#ch10.xhtml#ref10_22)] and [23](#ch10.xhtml#ref10_23)]. Drying using fossil
    fuels consumes a lot of energy. As the price of oil has been rising in recent
    years and is expected to continue to rise, it is important to develop an energy-free
    system: solar drying is one such system. It uses only the energy of the Sun.


    Solar dryers are generally classified into several categories, depending on the
    heating method or the way they operate. Thus, there are natural dryers, direct
    solar dryers, indirect solar dryers, mixed solar dryers and hybrid solar dryers
    [[24](#ch10.xhtml#ref10_24), [25](#ch10.xhtml#ref10_25) and [26]].


    By definition, natural dryers use the Sun and air directly, whose action is neither
    particularly favoured nor controlled. The product is spread out on racks or placed
    on the ground. These dryers are very cheap, but require regular and sustained
    human intervention: protection or collection of the product in case of rain, frequent
    mixing to avoid overheating of the upper layer. This type of dryer is often traditional
    in farming communities, to address the problem of temporary storage of the product
    while awaiting sale [[27](#ch10.xhtml#ref10_27), [28](#ch10.xhtml#ref10_28), [29](#ch10.xhtml#ref10_29),
    [30](#ch10.xhtml#ref10_30), [31](#ch10.xhtml#ref10_31) and [32](#ch10.xhtml#ref10_32)].


    In direct solar dryers, sunlight dries the food directly. This type of dryer requires,
    for example, a wooden or cardboard box with holes at the bottom and top to allow
    cold air to enter from the bottom and hot air to leave from the top. This box
    contains the racks where the food will be dried and is covered with glass to increase
    the greenhouse effect [[33](#ch10.xhtml#ref10_33), [34](#ch10.xhtml#ref10_34)
    and [35](#ch10.xhtml#ref10_35)].


    Mixed solar dryers are a combination of direct and indirect dryers. In these dryers,
    the heat required for drying is provided by the action of the Sun’s rays, which
    strike the products in the direct section and heat the air. The heat and water
    vapor transfers are complex and not well known. The mixed solar dryer consists
    of two parts: the lower part is the direct dryer, when the Sun heats the internal
    air of this part, the hot air passes to the drying chamber through holes, that
    is the indirect dryer part. The air, circulating through the fruit and vegetables,
    dehydrates them little by little and comes out of the upper part, loaded with
    water vapor.

