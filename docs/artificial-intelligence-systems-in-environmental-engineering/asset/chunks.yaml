    ## 5.1 Introduction


    All over the world, the use of water resources, mainly groundwater, is increasing,
    due to socio-economic and demographic development, as well as the degradation
    in the quality of surface water.


    In Morocco, water availability is very limited and is likely to decrease in the
    long term due to global warming ([1](#ch5.xhtml#ref5_1)). Indeed, the forecast
    estimates made by the World Bank in 1994 sounded the alarm. Furthermore, renewable
    water resources per capita are likely to decrease by half, from 800 m³ in 1990
    to 400 m³ in 2020, thus classifying Morocco in the category of countries in a
    situation of chronic water stress ([2](#ch5.xhtml#ref5_2)). Indeed, the composition
    of groundwater reflects interactions with the vegetation cover, the characteristics
    of the soil through which it flows, the inputs from the atmosphere, the presence
    of industrial or agricultural activities, and the lithology of the geological
    formations that host the aquifers ([3](#ch5.xhtml#ref5_3), [4](#ch5.xhtml#ref5_4)).
    Moreover, groundwater is traditionally the water resource for human consumption
    and irrigation, as it is less polluting than surface water ([5](#ch5.xhtml#ref5_5),
    [6](#ch5.xhtml#ref5_6)). The degradation of groundwater quality is caused by various
    sources of pollution, such as fertilizers, pesticides, untreated water discharges,
    etc., as well as the geological formations that make up the groundwater. Hence
    the need for physicochemical and bacteriological analyses, which constitute a
    reliable source of information to characterize the impact of human, agricultural,
    and industrial activities and of the different landscape units ([7](#ch5.xhtml#ref5_7)),
    as well as the origin of mineralization.


    The objective of this work is to make a geochemical study of the groundwater of
    the Angads aquifer based on the Piper diagram and the Schoeller-Berkaloff diagram.
    The aim is to know the dominant facies in our study area, in order to understand
    the current state of mineralization of this aquifer to protect it from any type
    of contamination.


    ## 5.2 Materials and Methods


    ### 5.2.1 Study Site


    The study site is represented by the Angads aquifer located at the eastern end
    of the Taourirt Oujda corridor ([Figure 5.1](#ch5.xhtml#fig5_1)). This aquifer
    covers an area of 460 km² ([8](#ch5.xhtml#ref5_8)), and is bounded to the south
    by Jbel Hamra, to the west by Jbels Megrez and Tarraza, to the north by the Beni
    Snassen chain ([9](#ch5.xhtml#ref5_9)), and to the east by the Mernia plain ([10](#ch5.xhtml#ref5_10)).


    ![Figure 5.1 Map of the location and hydrological network of the aquifer (14).](images/fig5_1_B.jpg)


    [Figure 5.1 Map of the location and hydrological network of the aquifer](#ch5.xhtml#R_fig5_1)
    ([14](#ch5.xhtml#ref5_14)).


    ### 5.2.2 Conduct of the Study


    The study was conducted in 2020. Nineteen sampling points were taken throughout
    the study area, distributed as follows: (a) two boreholes, (b) one well located
    near and the other downstream of the Oujda public dump, seventeen wells including
    six wells upstream and downstream of the wastewater treatment plant, for the other
    wells are distributed throughout the study area. The choice of these points is
    explained by the fact that they are the most vulnerable to pollution and the most
    used in various fields, whether domestic, industrial, or agricultural.


    The geochemical study of groundwater has been represented by two diagrams, the
    first of which is Piper, which represents the chemical facies from a graphic distribution
    of major cations (Ca^(2+), Mg^(2+), Na^+ and K^+) and major anions (HCO[3]^−,
    Cl^−, SO[4]^(2−) and NO[3]^−) ([11](#ch5.xhtml#ref5_11)). This diagram is made
    up of two triangles representing the anionic and cationic facies and a rhombus
    synthesizing the overall facies ([12](#ch5.xhtml#ref5_12)). The second diagram
    is the Schoeller-Berkaloff diagram which characterizes the chemical facies of
    several glasses of water ([13](#ch5.xhtml#ref5_13)). The cartographic representation
    of the data was carried out using a Geographic Information System (GIS). So far,
    no study has been carried out with a geochemical study. This is an important study
    to know the state of mineralization of groundwater, which is an added value for
    these resources.


