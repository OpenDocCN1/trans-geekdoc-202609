    et al., 2014b）。在形态结果方面，观察到与对照组相比，添加不同剂量的橄渣肥增加了茎径、叶数、叶面积，以及豆荚的数量和大小（图 3.4）。蚕豆形态上的改善可归因于橄渣肥富含大多数植物生长所需的肥效元素（`NPK`、`P2O5`
    和 `K2O`）（表 3.2）（Regni et al., 2016）。事实上，在土壤中添加橄渣肥通常增加了水溶性有机碳和氮的总浓度，后者主要有助于植物叶片和地上部的发育；钾有助于植物的汁液循环和养分吸收；而磷则刺激根系发育、开花和结果（Cao
    et al., 2018; Curaqueo et al., 2014）。同样，Clemente et al. (2012) 和 Pardo et al.
    (2014d) 进行的一项研究显示，在缺乏这两种元素的土壤中用橄渣肥改良两年后，与对照组相比，钾含量增加了 10 倍，磷含量增加了 5 倍（表 3.4）。这种改善对于刺激这些典型贫瘠土壤的生物地球化学循环循环提高其肥力具有重要意义（Pardo
    et al., 2014b）。


    ## 3.6 结论


    总之，对于本实验而言，蚕豆的最佳橄渣肥用量为 `10%`，对应 `4.32 g/m²`。本研究的结果与其他研究一致，这些研究也表明使用橄渣堆肥是一种可持续且具有成本效益的化学肥料替代方案。因此，这种做法有助于促进更加环保和可持续的农业发展。


