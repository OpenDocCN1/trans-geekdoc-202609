    ## 3.1 Introduction


    The use of chemical fertilizers for soil amendment and tillage is a worldwide
    practice aimed at improving or protecting agricultural productivity. However,
    excessive or inappropriate use of these chemical products can have harmful effects
    on human health, wildlife, and the environment ([Comoretto et al., 2007](#ch3.xhtml#ref3_16);
    [Lanfer-Marquez et al., 2005](#ch3.xhtml#ref3_26)). Organic amendments are encouraged
    to enhance the sustainability of agricultural systems, especially in arid and
    semi-arid areas where soils are often very poor in organic matter. The addition
    of organic amendments results in significant changes in the biological, chemical,
    and physical properties of soil, and these changes can influence the mobility
    and persistence of herbicides and thus modify their fate in the environment.


    Indeed, the agri-food industry produces a wide variety of organic waste that can
    potentially be used as fertilizers and amendments for soils due to their high
    content of organic matter (OM) and plant nutrients ([Martínez-Blanco et al., 2011](#ch3.xhtml#ref3_28)).
    A clear example of this issue is the olive oil industry, which has significant
    economic and social importance in Mediterranean countries and generates a huge
    amount of waste, depending on the extraction system used.


    In Morocco, the world’s eighth-largest producer, the agro-industry sector generates
    large amounts of waste and organic by-products during the short olive harvest
    season, whose progressive accumulation or incorrect disposal can have adverse
    effects on the environment. Among the by-products of the olive oil extraction
    process are olive pomace, a wet solid material obtained by continuous two-phase
    or three-phase centrifugation, or by traditional extraction ([Ameziane et al.,
    2018](#ch3.xhtml#ref3_8)). For its proper composting, the addition of several
    bulking agents, such as cattle manure ([Ameziane et al., 2020b](#ch3.xhtml#ref3_7)),
    shredded olive prunings ([Regni et al., 2017](#ch3.xhtml#ref3_39); [Proietti et
    al., 2015](#ch3.xhtml#ref3_37); [Del Buono et al., 2011](#ch3.xhtml#ref3_18)),
    grape stems ([Baeta-Hall et al., 2005](#ch3.xhtml#ref3_9)), sawdust and shavings,
    and poplar bark ([Filippi et al., 2002](#ch3.xhtml#ref3_20)), has been carried
    out to improve its low porosity; in all these cases, final products with high
    content of organic matter and significant amounts of nutrients for plants have
    been obtained.


    However, it is increasingly evident that the application of raw or composted olive
    pomace to soils can have beneficial effects on soil properties and crop productivity
    ([López-Piñeiro et al., 2008](#ch3.xhtml#ref3_27); [Nicholls and Altieri, 2014](#ch3.xhtml#ref3_33)).
    Similarly, the use of olive pomace has led to an improvement in soil biological
    activity ([Innangi et al., 2017](#ch3.xhtml#ref3_23)). The amendment with olive
    pomace has moved beyond olive groves to be used in herbaceous crop cultivation
    ([Del Buono et al., 2011](#ch3.xhtml#ref3_18); [Alburquerque et al., 2007](#ch3.xhtml#ref3_5);
    [Brunetti et al., 2005](#ch3.xhtml#ref3_12); [Tajada and Gonzalez, 2004](#ch3.xhtml#ref3_41)).
    However, the abusive use of raw pomace as an amendment has shown some problems
    related to the time required for germination and root development due to its high
    organic load, mineral salts, low pH, and the presence of phytotoxic compounds
    ([Proietti et al., 2015](#ch3.xhtml#ref3_37); [Gigliotti et al., 2012](#ch3.xhtml#ref3_22);
    [Del Buono et al., 2011](#ch3.xhtml#ref3_18)). Therefore, composting is necessary
    to stabilize the high organic load and benefit from a soil amendment rich in humic
    compounds, cation exchange capacity, and water retention capacity ([Mekki et al.,
    2013](#ch3.xhtml#ref3_30)).'
