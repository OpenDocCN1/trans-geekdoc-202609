    \ sheep, and intended for the feeding of newborn young animals. \\[[3](#ch9.xhtml#ref9_3)\\\
    ] All the names given to powdered milk, i.e. dehydrated or dry milk, refer to\
    \ milk from which almost all the water has been removed \\[[5](#ch9.xhtml#ref9_11)\\\
    ]. This removal takes place after pasteurization and concentration at moderate\
    \ temperature (71–75°C for 15–40 seconds), so the milk is finely pulverized in\
    \ a drying tower heated by a stream of hot, dry air (approx. 150°C). The water\
    \ evaporates, and the powder thus obtained undergoes the granulation process \\\
    [[4](#ch9.xhtml#ref9_4)\\].\n\n### 9.2.1 Chemical Composition of Milk\n\nMilk\
    \ is an important source of essential nutrients and a significant source of dietary\
    \ energy, high-quality protein and fat. It can make a significant contribution\
    \ to the recommended nutritional requirements for calcium, magnesium, selenium,\
    \ riboflavin, vitamin B12 and pantothenic acid. Dairy products are nutritious\
    \ foods that can be used to diversify plant-based diets. In populations with low\
    \ fat intakes and limited access to other foods of animal origin, animal milk\
    \ can play an important role in children’s diets \\[[6](#ch9.xhtml#ref9_5)\\].\n\
    \n### 9.2.2 Nutritional Value of Milk and Regulations\n\nRaw cow’s milk contains\
    \ all the nutrients required for the growth of young mammals: a liter of bovine\
    \ milk contains around 50 g lactose, 32 g protein and 40 g fat. The energy potential\
    \ of a liter of whole, semi-skimmed or skimmed milk is 2720 KJ, 2090 KJ and 1460\
    \ KJ respectively. Milk is an excellent source of calcium and phosphorus, as well\
    \ as vitamins such as riboflavin, thiamine, cobalamin and vitamin A. It contains\
    \ little iron and copper, little ascorbic acid and niacin, and relatively little\
    \ vitamin D. It contains proteins rich in essential amino acid residues and minerals\
    \ of nutritional interest (calcium and phosphorus), notably in the form of phosphates,\
    \ citrates and chlorides of calcium, magnesium, potassium and sodium \\[[7](#ch9.xhtml#ref9_6)\\\
    ]\n\nThe standard published by AFNOR, entitled “Determination of the acidity titratable\
    \ in chemistry”, was published in Paris in 1995. It is part of the AFNOR series\
    \ of standards concerning measurement methods in chemistry. This document describes\
    \ the specific method for determining titratable acidity in chemical samples.\
    \ Titratable acidity is a measure of the acidity of a solution, expressed in millimoles\
    \ of acid per liter (mol/L) or as a percentage of acid. The method described in\
    \ this chapter is based on the use of a titrant, usually a basic solution, which\
    \ is added to the sample to react with the acid species present. Titratable acidity\
    \ is determined by the quantity of titrant required to reach an equivalence point,\
    \ where all acid species have reacted. This AFNOR standard is of significant importance\
    \ for the harmonization of titratable acidity measurement methods in chemistry.\
    \ It provides precise, recognized guidelines for laboratories and professionals\
    \ in the chemical industry. Following this standard ensures the reliability and\
    \ comparability of titratable acidity analysis results, facilitating the exchange\
    \ of information between the various players in the chemical industry \\[[8](#ch9.xhtml#ref9_7),\
    \ [9](#ch9.xhtml#ref9_8)\\].\n\n## 9.3 Material and Methods\n\n### 9.3.1 Sampling,\
    \ Extraction and Storage\n\nThis study involved 4 samples of raw milk from 4 representative\
    \ dairies in the P1, P2, P3 and P4 districts, at 3 different stages of reception.\
    \ The samples were taken in the morning and placed in sterilized vials, which\
    \ were then placed directly in freezers to prevent the temperature from rising.\n\
    \nIt is not possible to pasteurize milk immediately upon receipt. Before it can\
    \ be treated, milk has to be stored in storage tanks for several hours or days.\
    \ Even with intensive refrigeration, it is difficult to avoid serious deterioration\
    \ in its quality. So thermization is used to preheat milk to a lower temperature\
    \ than pasteurization, to temporarily inhibit the growth of bacteria, especially\
    \ pathogens. The milk is heated to 75°C, a combination of temperature and time\
    \ that does not activate the phosphatase enzyme (used to check pasteurization\
    \ efficiency and prevent the multiplication of aerobic spore-forming bacteria).\
    \ After thermization, the milk must be rapidly cooled to 4°C or less, and must\
    \ not be mixed with untreated milk. Many experts believe that thermization has\
    \ a positive effect on certain spore-forming bacteria, as the heat treatment returns\
    \ many spores to a vegetative state, enabling them to be destroyed during subsequent\
    \ pasteurization of the milk. The milk, which is initially at a temperature of\
    \ 4 to 8°C, is heated to 75°C in order to destroy a good proportion of micro-organisms\
    \ and maintain the product at an acceptable bacteriological level until it is\
    \ used. To achieve this, the raw milk is passed through a plate thermizer. The\
    \ thermizer consists of three sections:\n\n*   Preheating: Raw milk, coming from\
    \ the storage tank at a temperature of between 4 and 6°C, passes through a preheating\
    \ section where it recovers heat from the hot milk thanks to a cold milk/hot milk\
    \ circuit. The milk thus emerges at a temperature of 45°C, and is then sent to\
    \ the skimmer before returning to the thermisor at the same temperature ([Figure\
    \ 9.1](#ch9.xhtml#fig9_1)).\n\n    ![Figure 9.1 Receiving, preparing and unloading\
    \ milk.](images/fig9_1_B.jpg)\n\n    [Figure 9.1 Receiving, preparing and unloading\
    \ milk.](#ch9.xhtml#R_fig9_1)\n\n*   Heating: In this section, the temperature\
    \ of the milk is raised to 75°C using hot water via a counter-current plate heat\
    \ exchanger. The milk then passes through a chamberer, where it is maintained\
    \ at a temperature of 75°C for the required time.\n\n*   Cooling: This section\
    \ cools the milk, which has already been precooled by indirect contact with the\
    \ raw milk entering the thermisor. The milk is then subjected to final cooling\
    \ to 6°C using chilled water."
