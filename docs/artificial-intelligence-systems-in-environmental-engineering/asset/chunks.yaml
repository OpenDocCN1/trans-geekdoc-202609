    # Chapter 4 Modelling and Simulation of the Behavior of a Photovoltaic System
    under Different Shading Rates


    Mohammed Benchrifa


    University Mohammed V in Rabat, Morocco


    Ibn Tofaïl University—Kenitra-University Campus, Kenitra, Morocco


    Jamal Mabrouki and Fatine Drhimer


    University Mohammed V in Rabat, Morocco


    DOI: [10.1201/9781003436218-4](https://dx.doi.org/10.1201/9781003436218-4)


    ## 4.1 Introduction


    In recent years, the world demand for energy has grown significantly in all areas,
    including industry, agriculture, transport ….[[[1](#ch4.xhtml#ref4_1), [2](#ch4.xhtml#ref4_2)
    and [3](#ch4.xhtml#ref4_3)]. Unfortunately, most of this energy comes from fossil
    fuels, which have a very harmful impact on the environment. Therefore, in efforts
    to minimize the impact of pollution on the environment, renewable energy is the
    ideal solution. Consequently, several countries have made huge investments into
    the development of renewable energies [[4](#ch4.xhtml#ref4_4), [5](#ch4.xhtml#ref4_5)].
    According to the definition, renewable energy refers to the ways of producing
    energy from sources or resources that are theoretically unlimited, and available
    without time limits, or which can be replenished more quickly than they are consumed.


    Renewable energy is generally considered in opposition to fossil fuel energy,
    which has limited stocks and is non-renewable on a human timescale [[6](#ch4.xhtml#ref4_6),
    [7](#ch4.xhtml#ref4_7)]. This new type of energy includes wind energy (from the
    wind), tidal energy (from waves and tidal movements) and solar photovoltaic energy.
    This photovoltaic energy consists of the direct transformation of sunlight into
    electricity, using a semi-conductor material.


    The photovoltaic effect was initially discovered by E. Becquerel in 1839 [[8](#ch4.xhtml#ref4_8),
    [9](#ch4.xhtml#ref4_9)], who discovered that certain materials would deliver a
    small amount of electricity when exposed to light. Later, in 1912, Albert Einstein
    explained the photoelectric phenomenon [[10](#ch4.xhtml#ref4_10)], but it was
    not until the early 1950s that it was put into practice in a silicon photovoltaic
    (PV) cell, which had an efficiency level of 4.5% [[11](#ch4.xhtml#ref4_11), [21](#ch4.xhtml#ref4_21)].


    Photovoltaics no longer plays a marginal role in the proportion of electricity
    production in many countries, and it use continues to grow very rapidly. However,
    this source of electricity tends to be highly variable and decentralized, which
    can cause problems when attempting to integrate this type of production into the
    grid. It is therefore becoming increasingly important to understand the behavior
    of photovoltaic modules under different conditions to ensure the reliability of
    production and facilitate its integration into the grid [[12](#ch4.xhtml#ref4_12),
    [13](#ch4.xhtml#ref4_13)].


    A photovoltaic system consists of several components: the photovoltaic modules
    in series-parallel; the inverter, which transforms the direct energy from the
    modules into alternating energy; a cabling system; and batteries or a transmission
    network [[16](#ch4.xhtml#ref4_16), [17](#ch4.xhtml#ref4_17), [18](#ch4.xhtml#ref4_18),
    [19](#ch4.xhtml#ref4_19), [20](#ch4.xhtml#ref4_20), [21](#ch4.xhtml#ref4_21)].


    In photovoltaic technology, it is clear that modules do not necessarily maintain
    their initial performance. Some modules may degrade or even fail when operated
    for extended periods. Several studies have found that the reliability of PV systems
    is highly dependent on the material used to construct the PV, temperature, humidity
    and solar radiation [[23](#ch4.xhtml#ref4_23), [24](#ch4.xhtml#ref4_24), [25](#ch4.xhtml#ref4_25)].


    In this context, we can note that the most common defect in a PV generator is
    shading failure [[26](#ch4.xhtml#ref4_26), [27](#ch4.xhtml#ref4_27), [28](#ch4.xhtml#ref4_28),
    [29](#ch4.xhtml#ref4_29), [30](#ch4.xhtml#ref4_30), [31](#ch4.xhtml#ref4_31)].
    Shading failure is usually the result of a variety of causes, for example, bird
    droppings, dust, snow and obstacles such as vegetation and power cables… In fact,
    in this chapter we are particularly interested in the effect of shading on the
    performance of PV modules. In order to visualize this effect we performed several
    simulations of the behavior of a PV module by varying the shading rate from 10%
    to 100%.


    ## 4.2 Materials and Methods


    ### 4.2.1 Presentation of MATLAB/Simulink


    Simulink is a functional diagramming environment for multi-domain simulation and
    model-based design. It supports system-level design and simulation, automatic
    code generation, and the continuous testing and verification of embedded systems
    [[32](#ch4.xhtml#ref4_32)].


    ### 4.2.2 Presentation of PVSyst


    The PVSyst software is a simulation and sizing software for both stand-alone and
    on-grid photovoltaics systems. It was established by Geneva University (Switzerland)
    and designed by A. Mermoud. The PVSyst software has several inputs: average monthly
    solar fluxes, average monthly temperatures, energy requirements, choice of PV
    modules and their inclination, choice of batteries, charge controllers, inverters,
    input of the number of days of autonomy, the solar coverage rate and the investment
    cost (material purchase, system installation cost). The main results of the simulation
    are: the required field power. The main results of the simulation are: the required
    field strength, the storage capacity, the characteristics of the components under
    specific conditions and the cost per kilowatt-hour (kWh) [[33](#ch4.xhtml#ref4_33)].


