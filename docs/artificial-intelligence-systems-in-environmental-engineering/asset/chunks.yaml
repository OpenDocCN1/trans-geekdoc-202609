    本工作的目的是研究由橄榄果渣和牛粪混合而成的堆肥在蚕豆种子萌发期间作为土壤改良剂的有效性。在萌发试验期间，测试了不同浓度的堆肥（5%、10%、15%、20%
    和 25%），以确定最佳剂量。在生长期间，定期测量了若干参数，包括茎高、叶片数、叶面积以及豆荚的数量和大小。种子成熟后，进行收获，并对其营养价值进行定性分析，测量其蛋白质、脂质、总糖和纤维含量。


    ## 3. 材料与方法


    ### 3.2.1 实验设计


    实验旨在通过不同比例的橄榄果渣制堆肥（表 3.1）萌发蚕豆种子，以确定该堆肥的肥力并确定适用于植物的最佳剂量。为此，蚕豆种子用漂白水消毒，用清水彻底清洗，然后用蒸馏水冲洗。随后，它们在
    225 m² (15*15) 的土壤表面进行萌发。


    表 3.1 土壤物理化参数 (Ameziane et al., 2020a)


    | 物理化参数 | 土壤特性 |

    | :--- | --- |

    | 粘土含量 (%) | 9 ± 0.044 |

    | 砂粒含量 (%) | 68 ± 0.088 |

    | 粉粒含量 (%) | 23 ± 0.044 |

    | pH | 7.61 ± 0.044 |

    | 导导率 (μS/cm) | 85.5 ± 0.149 |

    | 水分含量 (%) | 4.51 ± 0.044 |

    | 有机质含量 (%) | 6.88 ± 0.125 |

    | 总有机碳 % | 4.88 ± 0.333 |

    | 总氮 % | 0.134 ± 0.02 |

    | 总磷 % | 0.0103 ± 0.003 |

    | 钙 % | 0.48 |

    | 钾 % | 0.0445 |

    | 镁 % | 0.0243 |

    | 钠 % | 0.0092 |


    萌发地位于萨勒高等技术学院（摩洛哥萨勒，北纬 34°03′11″，西经 6°47′54″，海平面海拔：34 米）。研究的萌发区被分为六块样地。其中五块样地含有特定比例的堆肥，分别对应
    5%、10%、15%、20% 和 25% 的堆肥浓度，第六块样地留作对照组，仅含有土壤，其特性如表 3.1 所示。在每个样地中，蚕豆种播种密度为 10 粒/1.5
    m²，深度为 5 cm，种子间距 10 cm。


    ![](img/figu3_1_B.jpg)


    土壤的物理化特性如表 3.1 所示。


    本研究使用的堆肥是近期工作的成果（Ameziane et al., 2020b）。它由 43% 的橄榄果渣和 57% 的牛粪组成，在大 30 升桶中混合。桶上打孔以确保空气流通，并放在阳光充足处。堆肥持续
    130 天以获得成熟堆肥，其物理化特性如表 3.2 所示。


    表 3.2 成熟堆肥的物理化性质和萌发指数 (Ameziane et al., 2020b)


    | 测量参数 | 成熟堆肥 |

    | :--- | --- |

    | pH | 8.61 ± 0.03 |

    | 湿度 (%) | 30.4 ± 0.14 |

    | EC (mS cm^(−1)) | 2.06 ± 0.22 |

    | OM % | 38.4 ± 0.76 |

    | K[2]O % | 2.8 ± 0.36 |

    | NTK % | 1.3 ± 1.89 |

    | P[2]O[5] % | 0.42 ± 0.86 |

    | COT % | 22.32 ± 0.89 |

    | C/N % | 17.16 |

    | 萌发指数 (%) | 73 ± 0.65 |


    每个样地在播种当天灌溉 2 升水，使用来自萨勒高等技术学院的井水，其物理化特性符合摩洛哥灌溉水标准（Secretariat of State at the
    Ministry of Energy, Mines, Water and Environment, in charge of Water and Environment,
    2007）。植物水分保持在平均 550 mm。


    表 3.3 灌溉水的物理化参数 (Ameziane et al., 2020a)


    | 物理化参数 | 灌溉水特性 |

    | :--- | --- |

    | pH | 7.49 |

    | 导电率 (mS/cm) | 1.02 |

    | 温度 (°C) | 18.1 |

    | 悬浮物 (mg/l) | 232 |

    | 盐度 (ppb) | 0.5 |

    | 硝酸盐 (mg/l) | 192.5 |

    | 氯化物 (mg/l) | 0.03 |

    | 硼 (mg/l) | 0.04 |

    | 硫酸盐 (mg/l) | 21.3 |

    | 磷酸盐 (mg/l) | 0.005 |


    ### 1. 植物材料


    所有区域都有 `Vicia faba`。对蚕豆进行了定期监测。确定了五个参数：


    *   地上部分高度（茎）：使用刻度尺测量。

    *   叶片数：数出每株植物的叶片。

    *   叶面积：通过 `L` 乘以 `l` 计算面积。

    *   豆荚数量：收获后数出每株植物的豆荚。

    *   豆荚大小：使用刻度带测量。


    ### 3. 营养质量


    萌发试验结束后，收集每个浓度组豆荚中的蚕豆种子，在 60°C 下干燥至恒重，然后磨碎并筛至 0.2 mm，以确定其蛋白质、脂质、总糖和纤维含量。营养评估在拉巴特农业研究中心食品技术部门进行。


    #### 3.1. 蛋白质测定


    采用 `Kjahl` 法，该方法涉及在硫酸和催化剂的作用下对含氮有机化合物进行热分解。该催化剂含有提高硫酸沸点的 KSO₄ 以及催化的 CuSO₄。在消解过程中，氮被定量转化为硫酸铵。


    随后用氢氧化钠从盐中置换氨，通过蒸汽蒸馏并收集在过量的盐酸中。这是蒸馏步骤。未反应的盐酸量用氢氧化钠进行滴定。这是滴定步骤。氮含量通过公式表示：


    ```

    %MAT = \frac{(V_e - V_b) \times N\_HCl \times 14 \times 6,25}{P_e \times 100}

    ```


    其中：


    *   `V_e`：滴定样品所需的盐酸体积 (ml)

    *   `V_b`：滴定空白所需的盐酸体积 (ml)

    *   `N_HCl`：盐酸的当量浓度 (N)

    *   `P_e`：样品重量 (mg)


    #### 3.2. 脂质测定


    `Soxhlet` 法。


