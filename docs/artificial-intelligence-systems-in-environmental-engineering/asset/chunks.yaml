    \n## 6.1 Introduction\n\nWater is essential for human life, it makes up 65% of\
    \ the human body, and covers 70% of the Earth’s surface. Lately, however, the\
    \ availability of fresh water is decreasing from natural resources more and more\
    \ due to pollution. Water, climate change and falling groundwater levels are observed\
    \ all around the world. According to studies carried out, they have shown that\
    \ the availability of water should decrease by between 10 and 30% in certain arid\
    \ and semi-arid regions [[1](#ch6.xhtml#ref6_1)], which will lead us to look for\
    \ effective and less energy-consuming solutions to alleviate water shortages.\
    \ The most effective way to purify contaminated water on a small scale is solar-powered\
    \ desalination, which uses a free, renewable energy source.\n\nIn the field of\
    \ solar desalination [[2](#ch6.xhtml#ref6_2)], the solar still is frequently used\
    \ because of its straightforward construction, but its performance is relatively\
    \ low when compared to other technologies. Several study projects are currently\
    \ in progress to improve the productivity of the simple solar still, which was\
    \ invented in 1872, by the Swedish engineer Charles Wilson [[3](#ch6.xhtml#ref6_3)],\
    \ [[4](#ch6.xhtml#ref6_4)], [[5](#ch6.xhtml#ref6_5)].\n\nThe two types of solar\
    \ distillation currently available are passive and active. Passive stills are\
    \ less expensive and require no other source of energy apart from the sun to operate.\
    \ They may differ in terms of materials used, functionality; they all follow the\
    \ same principles. Active stills use an additional source of energy to speed up\
    \ the evaporation process. We find [[6](#ch6.xhtml#ref6_6)], [[7](#ch6.xhtml#ref6_7)],\
    \ [[8](#ch6.xhtml#ref6_8)], [[9](#ch6.xhtml#ref6_9)].\n\nThe main objective of\
    \ any solar distillation system is to have the maximum productivity. The performance\
    \ of the still depends on several factors, such as meteorological parameters:\
    \ ambient temperature, solar irradiation. \n\nIn this study, we used AI to optimize\
    \ the efficiency of solar stills by integrating a `solenoid valve` to ensure the\
    \ automatic filling of the tank, and we installed level sensors to automatically\
    \ measure productivity and finally notifications of alerts are sent to the problems\
    \ detected by the AI.\n\n## 6.2 Literature Review\n\nDistillers have existed in\
    \ antiquity in several conventional forms that have been developed over time to\
    \ achieve a less expensive form using solar energy, but the major drawback of\
    \ this type of distiller is the low production of distillate. However, many studies\
    \ have continued to use various methods to increase the production of solar energy.\n\
    \n## 6.3 Proposed System\n\nOur system is composed of a tilted solar still facing\
    \ south with a corrugated zinc absorber to increase the absorption surface, an\
    \ ordinary glass cover to act as a condenser, and two tanks: one dedicated for\
    \ the feeding the distiller with salt water and the other placed at the ends to\
    \ recover the.\n\n## 6.4 Materials and Methods\n\n### 6.4.1 The Operating Principle\
    \ of a Solar Distiller\n\nThis process is used to heat the water by the energy\
    \ of solar radiation, which passes through the transparent glass cover and falls\
    \ on the corrugated zinc basin, which contains saline water. When water is heated,\
    \ after a while it reaches a high temperature, which allows it to evaporate, then\
    \ condenses on the lower part of the cover.\n\n### 6.4.2 `solenoid valve`\n"
