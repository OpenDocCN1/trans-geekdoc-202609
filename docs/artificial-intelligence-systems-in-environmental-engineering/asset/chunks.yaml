    # Chapter 7 Intelligent Temperature and Humidity Control System Leveraging AI
    for Precise Climate Management


    Najlaa Ben-Lhachemi

    University Mohammed V in Rabat, Morocco


    Mohammed Benchrifa

    University Mohammed V in Rabat, Morocco


    Ibn Tofaïl University—Kenitra-University Campus, Kenitra, Morocco


    Souad Nasrdine, Jamal Mabrouki, and Miloudia Slaoui

    University Mohammed V in Rabat, Morocco


    DOI: [10.1201/9781003436218-7](https://dx.doi.org/10.1201/9781003436218-7)


    ## 7.1 Introduction


    Industry 4.0 was founded on the principles of the first three industrial revolutions,
    which involved, respectively, steam power, electricity, and computers. Advanced
    technologies such as the Internet of Things (IoT), Artificial Intelligence (AI),
    cloud computing, and robotics are being integrated in this fourth industrial revolution
    to enable machine-to-machine communication and autonomous decision-making.


    One such technology is AI, which learns and develops, anticipates, interacts with
    other systems, and ultimately makes judgments that are more accurate by evaluating
    a massive amount of data that humans are unable to do so and with a smaller margin
    of error than they do.


    AI can help the agricultural sector increase productivity and efficiency (5).
    One of the most promising agricultural solutions is the use of automated smart
    greenhouses because humans lack the knowledge and expertise necessary to maintain
    them effectively and regulate plant growth conditions. Various AI technologies,
    including robotic systems, bio-inspired algorithms, energy management, machine
    path planning, drones, and image processing, are used in smart greenhouses, according
    to a study by Chrysanthos Maraveas. Commercially feasible AI technologies for
    agriculture have proliferated, offering farmers larger returns on investment,
    greater crop yields, and improved resource efficiency [[1](#ch7.xhtml#ref7_1)].


    By utilizing the information gathered by sensors and a web application for the
    best remote control, AI may be used to remotely manage plant growth, greenhouse
    climate, and nutrient levels. With the use of these capabilities, crop parameters
    may be tracked and changed in real time to increase output and decrease losses
    brought on by disease and changing weather.


    In another study, Axel Escamilla-Garcia et al. investigated the use of artificial
    neural networks (ANN) in greenhouse technology and highlighted their potential
    for integration with other 4.0 technologies such as IoT, machine learning (ML),
    image analysis, and Big Data. At the moment, there is a lot of research on monitoring
    methods and approaches to manage the environment of a greenhouse. According to
    the report, additional ANN development study could enhance their utility in smart
    agriculture and greenhouse production [[2](#ch7.xhtml#ref7_2)].


    At Wageningen University in 2018, five worldwide teams competed in a contest to
    apply AI algorithms to regulate the climate, irrigation, and crop growth in high-tech
    greenhouses. In their presentation of team findings, Silke Hemming et al. evaluate
    how different climates affect crop development and discuss lessons gained for
    improving crop yield and financial performance in the future [[3](#ch7.xhtml#ref7_3)].


    In this work, we will use AI to our advantage, and to remotely control the temperature
    and humidity inside a greenhouse. We will propose the processes to follow for
    optimal control, while allowing the farmer to monitor and change the parameters
    remotely if necessary while connected to the internet.


    ## 7.2 Literature Review


    ### 7.2.1 AI Applications in Greenhouse Agriculture


    Artificial Intelligence (AI) in greenhouse farming has the potential to revolutionize
    the agricultural sector by raising crop yields, lowering costs, and boosting productivity.


    Bhanuka Senavirathne et al. divided the subsystems connected to greenhouses into
    major categories in their study. One of these categories was temperature regulation,
    which is essential in maintaining the greenhouse at the right temperature for
    plant growth. Controlling humidity is the next step since this helps to prevent
    fungal infections and manage plant transpiration. To give plants the nutrients
    they need to flourish, the identification of optimal nutrition is also crucial.
    Pumps are used to water plants and supply them with the nutrients they require.
    In addition to maintaining temperature and humidity, air ventilation is essential
    for regulating the concentration of carbon dioxide. Finally, artificial light
    is utilized to lengthen the period of time that plants are exposed to light and
    to supply sufficient light for plant growth [[4](#ch7.xhtml#ref7_4)].


    Steps can be used to outline the essential components for effectively and efficiently
    controlling greenhouse subsystems. Data collection utilizing sensors and actuators
    should come first. The sensors collect data on a variety of variables, including
    temperature, humidity, air quality, and others. These settings are controlled
    by actuators to keep the environment ideal for plant development. The performance
    of the greenhouse is then predicted using the analysis of the acquired data. This
    makes it possible to make judgments regarding the greenhouse’s environment that
    help optimize growing conditions for the highest crop production and quality possible.
    Finally, it is advised to use a web application to remotely monitor and control
    the greenhouse. With the help of this application, farmers may remotely monitor
    greenhouse conditions, make decisions in real time to optimize growing conditions,
    and control various greenhouse subsystems, including irrigation, lighting, cooling,
    and ventilation.


    ### 7.2.2 Limitations, Challenges, and Future Directions


    There may be certain difficulties when implementing AI in agriculture, particularly
    in greenhouses. Self-learning greenhouse construction is costly, especially given
    the high cost of more precise sensors and controllers. Additionally, a lot of
    accurate data must be available in order to create this system. However, because
    so many technologies have not yet reached the commercial stage, the adoption of
    agricultural technologies is gradual. The majority of other technologies have
    not yet been put into practice in the field, with the exception of sensors, cameras,
    and some robots. The development of cameras and sensors to improve their accuracy
    and effectiveness is ongoing. Robots are typically faster and more accurate than
    people, yet they cannot replace them entirely. Younger farming generations are
    more receptive to technology advancement than older generations who have had less
    exposure to it.


    Additionally, it is crucial that scientists and engineers collaborate with farmers
    and industry experts to design and implement solutions that address their needs
    and are both technically and financially viable.


    To create AI models that can account for the complexity of agricultural ecosystems,
    including interactions between plants, insects, bacteria, and soil, research is
    required. Additionally, researchers can think about using and creating technologies
    inspired by nature for soil treatment, automated harvesting, and application of
    pesticides and fertilizers. For farmers, these tools are more precise, inexpensive,
    and simple to use.


    Using AI-based technology in agriculture can assist the industry meet its sustainability,
    productivity, and profitability objectives.


