    ![Figure 10.1 Used embedded system.](images/fig10_1_B.jpg)


    [Figure 10.1 Used embedded system.](#ch10.xhtml#R_fig10_1)


    ![Figure 10.2 Flowchart of follow-up steps.](images/fig10_2_B.jpg)


