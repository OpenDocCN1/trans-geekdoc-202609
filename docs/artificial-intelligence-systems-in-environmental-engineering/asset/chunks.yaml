    ]. Domestic wastewater, on the other hand, comes from lavatories as well as household\
    \ water (kitchen, bathroom, laundry, and water generated by certain household\
    \ appliances other than a lavatory) \\[[12](#ch8.xhtml#ref8_12)\\]. Among the\
    \ effluents found in the wastewater are synthetic chemical compounds that are\
    \ difficult to biodegrade, and mutagenic and/or carcinogenic toxicants from these\
    \ effluents can be found at all levels of the food chain when they are discharged\
    \ into receptor environments \\[[13](#ch8.xhtml#ref8_13)\\]. It is therefore necessary\
    \ to find an alternative water treatment \\[[14](#ch8.xhtml#ref8_14)\\]. In recent\
    \ years, countless biotechnological applications have emerged, such as bioremediation,\
    \ which could allow wastewater treatment without all these disadvantages \\[[15](#ch8.xhtml#ref8_15)\\\
    ]. This process involves the use of microorganisms, usually bacteria or fungi,\
    \ to remove pollutants from the soil and water \\[[16](#ch8.xhtml#ref8_16)\\].\
    \ The art of using algae (either macro- or microalgae) in the removal, biotransformation\
    \ or mineralization of various nutrients, heavy metals and xenobiotics from wastewater\
    \ and residual air carbon dioxide is known as phycoremediation \\[[17](#ch8.xhtml#ref8_17),\
    \ [18](#ch8.xhtml#ref8_18) and [19](#ch8.xhtml#ref8_19)\\]. During this treatment,\
    \ carbon, nitrogen, phosphorus and other salts are used by algae as nutrients,\
    \ wastewater or air as appropriate \\[[20](#ch8.xhtml#ref8_20), [21](#ch8.xhtml#ref8_21)\\\
    ]. Algae play key roles in the biological treatment of wastewater by lagoons,\
    \ even as oxygen providers through the photosynthetic process \\[[22](#ch8.xhtml#ref8_22)\\\
    ]. Thus, they promote the oxidation of organic matter by associating in symbiotic\
    \ form with bacteria \\[[23](#ch8.xhtml#ref8_23)\\]. They can even contribute\
    \ directly to the elimination of certain organic derivatives and act as bio-absorbents\
    \ contributing to the elimination of heavy metals and other toxic products \\\
    [[24](#ch8.xhtml#ref8_24)\\].\n\nThe main objective of this work is to evaluate\
    \ the effectiveness of the treatment of domestic wastewater through the use of\
    \ microalgae as a technique of water purification studies, as well as the interest\
    \ of their use for the renewable energy market and for the phycoremediation sector\
    \ in order to achieve the purification of the nutrients and metals contained in\
    \ the wastewater.\n\n## 8.2 Materials and Methods\n\n### 8.2.1 Microalgae Culture\
    \ System\n\nThe cultivation of microalgae using sunlight can be carried out either\
    \ in open-air tanks or using tube-shaped photobioreactors, rectangles, continuous\
    \ stirring reactors or other forms \\[[18](#ch8.xhtml#ref8_18)\\]. Microalgae\
    \ are able to grow quickly and can be grown by different methods and under different\
    \ conditions. This biomass is shown to be an attractive raw material for the rapid\
    \ generation of biomolecules, which can supplement the nutritional, pharmaceutical,\
    \ cosmetic and energy needs of the population \\[[25](#ch8.xhtml#ref8_25), [26](#ch8.xhtml#ref8_26)\\\
    ]. These photosynthetic microorganisms develop very quickly, by transforming about\
    \ 10% of solar energy into biomass with a duplication of between 0.3 and 3 times\
    \ more and an estimated theoretical yield of about 77 g/biomass/m²/day \\[[27](#ch8.xhtml#ref8_27),\
    \ [28](#ch8.xhtml#ref8_28)\\].\n\n1.  **Open system**:\n\n    Open cultures such\
    \ as ponds and uncovered tanks (indoors or outdoors) are more easily contaminated\
    \ than closed culture vessels such as tubes, flasks, carboys, bags, etc. Axenic\
    \ culture can also be chosen, using algal cultures free of any foreign organisms\
    \ such as bacteria; this is expensive and difficult, however, as it requires strict\
    \ sterilization of all glassware, culture media and containers to avoid contamination\
    \ \\[[29](#ch8.xhtml#ref8_29)\\]. The use of open systems as a microalgae culture\
    \ method is quite common. Open systems come in many different forms, each with\
    \ certain advantages and disadvantages. The types of systems that are currently\
    \ used in research and industry include pipe ponds, large shallow ponds, circular\
    \ ponds and closed systems \\[[30](#ch8.xhtml#ref8_30)\\]. [Figure 8.1](#ch8.xhtml#fig8_1)\
    \ shows a representative diagram of an open culture system.\n\n    ![Figure 8.1\
    \ Open system diagram.](images/fig8_1_B.jpg)\n\n    [Figure 8.1 Open system diagram.](#ch8.xhtml#R_fig8_1)\n\
    \n1.  **Closed system**:\n\n    Photobioreactors are reactors made from transparent\
    \ materials. Their design is based on the illuminated surface, the efficiency\
    \ of the mixture and the control of the culture parameters (temperature, carbon\
    \ dioxide and oxygen content, pH), to achieve maximum productivity. Closed systems\
    \ have been designed to address pool problems \\[[31](#ch8.xhtml#ref8_31)\\].\
    \ They offer a closed culture environment; they protect the culture from direct\
    \ contamination; and they allow a better control of the conditions of cultivation.\
    \ The temperature is controlled effectively, the access to light is increased\
    \ compared to the basin, the evaporation of the growing medium is minimized, the\
    \ supply of CO[2] is facilitated, and its losses are limited \\[[32](#ch8.xhtml#ref8_32)\\\
    ]. The photobioreactor allows the efficient arrangement of light but also the\
    \ removal of oxygen produced by photosynthesis \\[[33](#ch8.xhtml#ref8_33)\\].\
    \ For better control of the process, a possible solution is to carry out closed\
    \ crops. The principle of closed systems used for microalgal culture is to put\
    \ microalgae in contact with natural light, combining both through a transparent\
    \ material \\[[29](#ch8.xhtml#ref8_29)\\].\n\n### 8.2.2 Advantages and Disadvantages\n\
    \nMicroalgae culture systems have both advantages and disadvantages depending\
    \ on the desired products where they are classified in [Table 8.1](#ch8.xhtml#table8_1).\n\
    \n [Table 8.1 Advantages and Disadvantages of Microalgae Culture Systems](#ch8.xhtml#R_table8_1)\
    \ \n\n| Advantages  || Ref. || Disadvantages || Ref. |\n\n| --- | --- | --- |\
    \ --- |\n\n| **Open system** |\n\n| --- |\n\n| \n\n*   A low cost\n\n*   Maintenance\n\
    \n*   Construction\n\n*   Configuration is easy to complete\n\n || \\[[34](#ch8.xhtml#ref8_34),\
    \ [35](#ch8.xhtml#ref8_35), [36](#ch8.xhtml#ref8_36) and [37](#ch8.xhtml#ref8_37)\\\
    ] || \n\n*   Difficult to control growing conditions\n\n*   Threats of contamination\n\
    \n*   Evaporative losses\n\n || \\[[38](#ch8.xhtml#ref8_38), [39](#ch8.xhtml#ref8_39)\
