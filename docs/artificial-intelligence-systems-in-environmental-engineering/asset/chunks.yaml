    # 第 5 章 Angads 地水（摩洛哥东北部）的地球化学研究：Piper 图和 Schoeller-Berkaloff 图的应用


    Latifa Taoufiq, Ilias Kacimi, Mohamed Saadi, 和 Jamal Mabrouki

    摩洛哥拉巴特穆罕默德五世大学


    Nordine Nouayti

    摩洛哥胡塞马 Abdelmalek Essaadi 大学


    Nadia Kassou 和 Tarik Bouramtane

    摩洛哥拉巴特穆罕默德五世大学


    Karima El-Mouhdi

    摩洛哥梅尼什护理专业与医疗技术高等学院


    DOI: [10.1201/9781003436218-5](https://dx.doi.org/10.1201/9781003436218-5)


    ## 5.1 引言


    由于社会经济和人口发展以及地表水质恶化，全球范围内水资源（主要是地下水）的使用正在增加。


    在摩洛哥，由于全球变暖，水资源非常有限，且长期来看可能会减少（[1)）。事实上，世界银行在 1994 年做出的预测响了警报。此外，人均可再生水资源可能会从
    1990 年的 800 m³ 减少到 2020 年的 400 m³，从而使摩洛哥处于慢性缺水压力的国家行列（[2)）。事实上，地下水的组成反映了与植被覆盖的相互作用、径流土壤的特征、大气输入、工业或农业活动的存在，以及承载含水层的地质构造岩性学（[3,
    [4)）。此外，地下水传统上是人类消费和灌溉的水资源，因为它比地表水污染少（[5, [6)）。地下水水质的恶化是由多种污染引起的，如化肥、农药、未经处理的废水等，以及构成地下水的地质构造。因此需要进行物理化学和微生物分析，这些分析构成了表征人类、农业和工业活动以及不同景观单元影响的可靠来源（[7)），以及矿物质化的来源。


    本工作的目标是基于 Piper 图和 Schoeller-Berkaloff 图对 Angads 地下水进行地球化学研究。目的是了解矿物质化状态，以理解各种活动的影响。


    ## 5.2 材料与方法


    ### 5.2.1 选址


    研究选址位于 Angads 含水层，面积为 460 km²（[8)）。南接 Hamra，西接 Megrez（[9)），东接 Snassen（[10)）。


    ```

    图 5.1 地位置图

    ```


    ### 5.2.2 研究进行


    研究于 2020 年进行。共采集了 19 个采样点：(a) 两个钻井，(b) 位于下游的井。地下水的地球化学研究由两个图表示，第一个 Piper 图，代表主要阳离子（`Ca2+`,
    `Mg2+`, `Na+`, `K+`）和主要阴离子（`HCO3-`, `Cl-`, `SO42-`, `NO3-`）（[11)）。另一个是 Schoeller-Berkaloff
    图，用于表征多种离子的化学特征（[12)）。数据的制图是使用地理信息系统 (`GIS`) 完成的。


    ## 5.3 结果


    ### 5.3.1 物理化学和微生物分析


    Angads 含水层 19 个采样点的地下水物理化学分析参数结果（表 5.1）显示，`Cond` 从 `10,355 μS/cm-1` 到 `986 μS/cm-1`，平均为
    2463 μS/cm-1，标准差为 2172。`pH` 从 6.95 到 7.55，平均为 7.20，标准差为 0.20。对于 `Na+` 等阳离子，数值从
    44 mg/l 到 1227 mg/l，平均为 215 mg/l，标准差为 265.6；`K+` 在 0.72 mg/l 到 15.30 mg/l 之间变化，平均为
    6.38 mg/l，标准差为 146.62。然后，对于 `NO3-` 等阴离子，数值在 5.4 mg/l 到 134 mg/l 之间变化，平均为 50.6
    mg/l，标准差为 39.80；对于 `Cl-`，数值在 172 mg/l 到 3597 之间变化，平均为 607 mg/l，标准差为 788.9。


