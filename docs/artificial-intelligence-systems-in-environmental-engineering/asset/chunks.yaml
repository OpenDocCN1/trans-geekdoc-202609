    | 最小值 | 0.00 | 0.00 | 0.00 | 0.78 |

    | 最大值 | 0.78 | 0.92 | 0.70 | 0.84 |


    圆度从样品 `E17` 开始下降，并在 54 km 处的下游 `E12` 继续下降。然而，在 `E12` 与 Ida-Ou-Mahmoud (`E6`) 汇合后，颗粒圆度有所增加。这一支流提供了多角度棱角颗粒，破坏了河流颗粒尺寸减小和颗粒圆化的长期趋势。


    ### 1.5 结论


    石英颗粒表面的微纹理提供了沉积物历史的洞察，并规定了导致其成形的搬运者的性质。研究区域——摩洛哥西部高阿特拉斯山的 Issen 盆地——为本工作的研究提供了一个特别合适的测试场。这是由于构造的高效性、地质多样化的地形起伏，主要受地形、地质的影响。


