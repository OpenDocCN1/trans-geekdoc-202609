    | E17 | 98.29 | 0.28 | 1.37 | Low calcareous sand |

    | E13 | 98.88 | 0.15 | 0.92 | Non-calcareous sand |

    | E14 | 93.65 | 1.98 | 3.47 | Low calcareous sand |

    | E6 | 96.22 | 0.25 | 3.38 | Low calcareous sand |

    | E12 | 93.30 | 0.94 | 4.51 | Low calcareous sand |

    | E15 | 91.91 | 1.16 | 6.58 | Moderately calcareous sand |

    | E26 | 86.55 | 0.77 | 11.90 | Moderately calcareous sand |

    | E11 | 92.43 | 0.46 | 6.45 | Moderately calcareous sand |

