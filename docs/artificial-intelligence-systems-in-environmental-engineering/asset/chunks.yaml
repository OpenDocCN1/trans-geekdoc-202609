    ## 3.1 Introduction


    The use of chemical fertilizers is a worldwide practice aimed at improving soil
    productivity. However, excessive or inappropriate use of these chemicals can have
    harmful effects on human health and the environment (`Comoretto et al.`, 2007;
    `Nicholls and Altieri`, 2014).


    Indeed, the agri-industry produces a wide variety of organic waste that can potentially
    be used as fertilizers, especially in Mediterranean countries where soils are
    often poor in organic matter (`Martínez-Blanco et al.`, 2011). A clear example
    of this is the olive industry, which has significant economic and social importance
    and generates large amounts of waste.


    In Morocco, the world’s-largest producer, the agro-industry generates large amounts
    of waste during the short harvest season, whose progressive accumulation or incorrect
    disposal can have adverse effects on the environment. Among the by-products of
    the olive extraction process are `olive pomace`, a wet solid material obtained
    by continuous two-phase or three-phase centrifugation (`Ameziane et al.`, 2018).


    For proper composting, the addition of several bulking agents such as:

    - `cattle manure` (`Ameziane et al.`, 2020)

    - `olive prunings` (`Regni et al.`, 2017; `Proietti et al.`, 2015)

    - `grape stems` (`Baeta-Hall et al.`, 2005)

    - `sawdust and poplar bark` (`Filippi et al.`, 2002)

    has been carried out to improve porosity. In all these cases, final products with
    high content of organic matter and significant amounts of nutrients have been
    obtained.


    However, it is increasingly evident that the application of raw or composted olive
    pomace to soils can have beneficial effects on soil properties and crop productivity
    (`López-Pieiro et al.`, 2008; `Nicholls and Altieri`, 2014). Similarly, the use
    of olive pomace has led to an improvement in soil biological activity (`Innangi
    et al.`, 2017). The amendment with olive pomace has moved beyond olive groves
    to be used in herbaceous crop cultivation (`Del Buono et al.`, 2011; `Alburquerque
    et al.`, 2007; `Brunetti et al.`, 2005; `Tajada and Gonzalez`, 2004).


    However, the abusive use of raw pomace as an amendment has shown some problems
    related to the time required for germination and root development due to its high
    organic load, mineral salts, low pH, and the presence of phytotoxic compounds
    (`Proietti et al.`, 2015; `Gigliotti et al.`, 2012; `Del Buono et al.`, 2011).
    Therefore, composting is necessary to stabilize the high organic load and benefit
    from a soil amendment rich in humic compounds, cation exchange capacity, and water
    retention capacity (`Mekki et al.`, 2013).

