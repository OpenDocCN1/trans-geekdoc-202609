    ## 1.5 Conclusion


    The microtextures on the surface of quartz grains provides an insight into the
    sedimentary history of sediments and specify the nature of the transport agents
    causing their shaping. The study area – the Issen basin in the western High Atlas
    in Morocco – represents a particularly appropriate testing ground for research
    for the purpose of this work. This is due to the high efficiency of tectonics,
    lithology varied terrain relief, conditioned mainly by topographical, geomorphological
    and climatic processes. In this chapter, we have described the sedimentological
    parameters measured (calcemetery of the Oued Issen deposits and exoscopy of quartz
    grains). The surface of the quartz grains of the four samples analyzed is marked
    by numerous traces that have shapes and sizes characteristic of the factors that
    formed them. These factors can be of physical, chemical, mechanical, or biological
    origin. They showed significant spatial variations. The Issen sands essentially
    come from the erosion of the sandstone, areno-lutite and conglomeratic formations
    of the Triassic of the Argana corridor and secondarily from the schists and gewaeks
    of the primary massif. The present study has shown that the right bank tributaries
    draining the Jurassic plateaus are the most active in the distribution of limestone
    in the catchment. However, in general, the sediments are very poor in carbonates
    and fine sedimentation is developed due to significant water erosion.


