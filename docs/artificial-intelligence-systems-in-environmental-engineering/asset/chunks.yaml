    The sample is weighed and then placed in a cellulose cartridge. The cellulose
    cartridge is permeable to the solvent and the fat that is dissolved in it. The
    solvent in the heating flask rises to the extraction chamber for 5 to 10 minutes
    and then returns to the flask. The sample is extracted semi-continuously by boiling
    ethyl ether, which drips into the extraction chamber and gradually dissolves the
    fat. The ethyl ether containing the fat returns to the flask through successive
    spills caused by a siphon effect in the side elbow. As only the solvent can evaporate
    again, the fat accumulates in the flask until the extraction is complete. Once
    the extraction is complete, the solvent is evaporated in an oven at 100°C, and
    the lipid content is measured by the weight of the extracted lipids ([AOAC, 1990](#ch3.xhtml#ref3_1)).


    ### 3. Total sugar determination: [Dubois et al. (1956)](#ch3.xhtml#ref3_19) phenol
    method


    Total soluble sugars (sucrose, glucose, fructose, their methyl derivatives, and
    polysaccharides) are measured using the [Dubois et al. (1956)](#ch3.xhtml#ref3_19)
    phenol method, which involves concentrated sulfuric acid causing the release of
    several water molecules from the sugars when heated. This dehydration is accompanied
    by the formation of hydroxymethylfurfural in the case of hexose and furfural in
    the case of pentose. These compounds condense with phenol to form colored complexes
    (yellow-orange). The intensity of the color varies depending on the amount of
    sugars present in the reaction mixture. The absorbance is measured at a wavelength
    of 492 nm using a spectrophotometer.


    ### 4. Determination of total fiber: NDF method


    To determine the total fiber content, a neutral detergent solution (NDF) is used
    to dissolve proteins, lipids, sugars, easily digestible starches and pectins in
    food, leaving an insoluble fibrous residue that is mainly composed of cell wall
    components of plant materials (cellulose, hemicellulose, and lignin) and indigestible
    nitrogenous matter in the bean. The results are reported on a dry matter basis.
    ([ISO 16472: 2006](#ch3.xhtml#ref3_24)).


    ## 3.3 Statistical analysis


    The experimental data was subjected to a one-way analysis of variance (ANOVA)
    and mean separations were performed by the least significant difference (LSD)
    at a significance level of `P` < 0.05, using the Statgraphics Centurion XVI program
    for Windows.


    ## 3.4 Results


    ### 3.4.1 Effect of Compost Addition on Stem Size


    Compost addition to the fava bean plant improved stem size for the different percentages
    compared to the control ([Figure 3.1](#ch3.xhtml#fig3_1)). Indeed, the stem size
    of plants fertilized with 5%, 10%, 20%, and 25% is significantly greater than
    that of control plants. Stem growth is often linked to nitrogen abundance. Nitrogen
    is involved in several processes and structures in plants, such as the formation
    of amino acids, which form proteins inside the plant, necessary for its growth
    (Jake Munroe, [2018](#ch3.xhtml#ref3_25)).


    ![Figure 3.1 Effects of different concentrations of olive pomace on stem size
    of fava bean plant (values with different letters are significantly different:
    p < 0.05).](images/fig3_1)


    #### 3.4.1.1 The effect of compost addition on number of leaves


    The number of leaves of plants fertilized with 5%, 10%, 20%, and 25% is significantly
    greater than that of control plants. This effect of leaves can be explained by
    the richness of compost (1.3%) compared to the soil (0.13%) ([ch3.xhtml#ref3_2)).
    Indeed, nitrogen is the most important element for the production of leaves, which
    is responsible for photosynthesis and development (Migout, [2006](#ch3.xhtml#ref3_1)).
    A lack of nitrogen manifests in yellowing.


    ![Figure 3.2 Effects of different concentrations of olive pomace on the number
    of leaves (values with different letters are significantly different: p < 0.05).](images/fig3_2)


    #### 3.4.1.2 Effect of compost addition on leaf area


    The addition of compost for 5%, 10%, 20%, and 25% led to a significant improvement
    in the leaf area compared to the control ([ch3.xhtml#ref3_3)). As mentioned earlier,
    the development and growth are often linked to the abundance of nitrogen, the
    main constituent of chlorophyll (Migout, [2006](#ch3.xhtml#ref3_3)). Therefore,
    the significant concentration of this element in the compost (1.3%) compared to
    the soil (0.134%) can be a convincing explanation for the results.


    ![Figure 3.3 Effects of different concentrations of olive pomace on the leaf area
    (values with different letters are significantly different: p < 0.05).](images/fig3_3)


    #### 3.4.1.3 Effect of compost addition on number and size of pods


    The use of compost on the fava bean plant led to a significant increase in the
    production of fava bean fruits and a remarkable improvement in the size of the
    pods, which remained significantly different from the production and size of control
    plants, for all doses (Jake Munroe, [2018](#ch3.xhtml#ref3_25)). Indeed, the studied
    compost presents appreciable levels of exchangeable potassium (2.8%) compared
    to the control soil (0.044%) ([ch3.xhtml#ref3_2)), which explains the high number
    and size of the obtained pods at fruiting. Similar results have been obtained
    by other authors ([Clemente et al., 2012](#ch3.xhtml#ref3_15); [Alburquerque et
    al., 2011](#ch3.xhtml#ref3_3); [Walker and Bernal, 2008](#ch3.xhtml#ref3_42)),
    who state that the high level of exchangeable potassium in olive pomace compost
    causes a significant increase in the availability of potassium in the soil. This
    increase is generally reflected by higher potassium concentrations in the leaves
    and fruits of plants grown in soils treated with olive pomace than those receiving
    other amendments or no amendment (Martínez-Fernández and Walker, 2012](#ch3.xhtml#ref3_29)).


    #### 3.4.1.4 The effect of adding compost on the nutritional quality of fava beans


    Due to the high nutrient content of the compost, its addition has improved the
    nutritional quality of fava bean pods. A significant improvement was observed
    in terms of protein (8.06 g/100 g), lipid (1.2 g/100 g), total sugar (9.35 g/100
    g), and fiber (4.56 g/100 g) concentrations for plants fertilized with 10% olive
    pomace compost compared to the concentrations of these elements in seeds germinated
    in the control ([ch3.xhtml#ref3_4)).

