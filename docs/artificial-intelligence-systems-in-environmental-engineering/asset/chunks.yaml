  trans: "\n\n| **封闭式系统** |\n*   控制生长条件和生长参数（`pH`、`CO[2]`、`O[2]`）\n*   避免蒸发以减少 `CO[2]`\
    \ 损失\n*   实现更高的微藻密度\n\n|| \\[41, 42, 43 和 44]\\] ||\n\n*   过过热\n*   生物污垢\n*  \
    \ 氧气积累\n*   高昂的成本\n\n|| \\[39, 45, 46]\\] |\n\n尽管如此，每个小型或大型作物培养系统的成功取决于许多参数，例如光源的光照强度、气液的最优传输、易用性、低污染水平、低生产成本、最小面积、养分最大化以及温度控制（图\
    \ 8.2）。\n\n![图 8.2 指光生物反应器透视图。](img/fig8_2_B.jpg)\n\n图 8.2 指光生物反应器透视图。\n\n###\
    \ 8.2.3 微藻与养分的相互作用\n\n需要注意的是，光合生物是在不断变化的世界演化的。光合生物通过位于膜中的色素-蛋白复合物从阳光中收集能量，以促进能量传递\
    \ [47]。图 8.3 显示了微藻的类型和大类，其具有：\n\n![图 8.3 微藻主要类型的分类、其物种及其生物活性。](img/fig8_3_B.jpg)\n\
    \n图 8.3 微藻主要类型的分类、其物种及其生物活性。\n\n碳、氮、磷等养分在微藻的细胞代谢和生物化学组成中起着重要作用 [48]。此外，对于微藻的生长，必须存在微元素，特别是金属，如\
    \ `Mg`、`Ca`、`Mn`、`Zn`、`Cu` 和 `Mo` [49, 50]。微藻在固氮和吸收中起着重要作用。它们包括蓝藻，能够结合大气分子氮（`N[2]-N`）并将其转化为氨氮（`NH[3]-N`），可以通过方程式将其释放到环境中\
    \ [51]：\n\n(8.1)\n\n```\n$$N_{2} + 8H^{+} + 8_{e^{-}} + 16 + {ATP}\\overset{\\\
    \\text{Nitrogenase}}{\\rightarrow}2{NH}_{3} + H_{2} + 16\\ {ADP} + 16P_{i}$$\n\
    ```\n\n反之，真核微藻根据以下两个方程式同化固氮，如 `NH[4]-N`、`NO[3]-N` 以及硝酸还原酶和亚酸还原酶 [52]：\n\n(8.2)\n\
    \n```\n$${NO}_{3}^{-} + 2H^{+} + 2\\_{e}^{-}\\overset{\\text{Nitrate\\ reductase}}{\\\
    rightarrow}\\ {NO}_{2}^{-} + H_{2}O$$\n```\n\n(8.3)\n\n```\n$${NO}_{2}^{-} + 8H^{+}\
    \ + 6\\_{e}^{-}\\overset{\\text{Nitrite\\ reductase}}{\\rightarrow}\\ {NH}_{4}^{+}\
    \ + 2H\\_{2}O$$\n```\n\n只要 `NH[4]-N` 的吸收不需要还原步骤，它被认为是微藻的优选氮形式。因此，除了微藻的吸收外，`NH[4]-N`\
    \ 的去除也可以随着 `pH` 值和温度的升高而发生，此时大量的 `NH[4]-N` 可能会挥发 [53, 54]。\n\n## 8.3 结果与讨论\n\n\
    ### 8.3.1 利用微藻的废水处理技术\n\n作为一个利用微藻进行废水处理技术的示例（从物理化学分析来看含有高养分），我们以 Gharmouli 等人的工作为例，他们研究了螺旋藻（*Arthrospira\
    \ platensis*）对废水中有机污染物的去除能力。根据这项研究，他们发现在 32°C 温度下，随着硝酸盐值的下降，培养电电率降低，氨和亚酸盐消失，总氮也减少\
    \ [55]。还进行了一项关于废水处理中微藻-细菌复合体系使用的比较研究，以检查和比较与绿藻复合体相关的微生物群。结果显示，大部分氮和碳已被去除，这为……\
    \ [56] 开启了可能。\n\n### 8.3.2 小球藻属的营养价值\n\n生物技术对微藻和蓝藻的关注集中在它们含有的价值代谢产物上，这些产物可用于医学、工业、能源、农业和食品等领域的广泛应用\
    \ [60]。大多数化妆品作用得到文献的支持和市场的声称，一方面具有抗衰老、保湿、抗氧化和美白功效，另一方面具有抗粉刺和愈合功效 [61]。 \n\n光合微生物正成为废水处理技术中实施的最重要替代方案之一，并引起了对科学和工业界日益普及的微藻的关注。目前对微藻的兴趣正在增长，因为它们能够去除养分。因此，为了选择去除养分的合适物种，必须研究该物种的积累能力及其对毒性影响的耐受性。\n\
    \n"
