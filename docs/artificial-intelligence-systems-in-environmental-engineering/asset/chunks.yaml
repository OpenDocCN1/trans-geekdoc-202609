    # 第 6 章 倾斜太阳蒸馏器的远程监测


    Souad Nasrdine

    摩洛哥拉巴特穆哈德五大学


    Mohammed Benchrifa

    摩洛哥拉巴特穆哈德五大学

    Ibn Tofaïl 大学—内特拉校园，摩洛哥内特拉


    Najlaa Ben-Lhachemi, Jamal Mabrouki, Miloudia Slaoui

    摩洛哥拉巴特穆哈德五大学


    DOI: [10.1201/9781003436218-6](https://dx.doi.org/10.1201/9781003436218-6)


    ## 6.1 引言


    水对人类生命至关重要，它占人体的 65%，覆盖了地球表面 70%。然而，由于污染的影响，自然资源中淡水的可用性日益减少。全球范围内都可以观察到水、气候变化以及地下水位下降的问题。根据开展的研究显示，某些干旱和半干旱地区的水可用性预计将减少
    10%到 30%[1]，这将促使我们寻找有效且能耗更低的解决方案来缓解缺水。小规模净化污染水的有效方法是太阳能海水淡化，它利用免费的可再生能源。


    在太阳能海水淡化领域[2]，太阳蒸馏器因为结构简单而被频繁使用，但与其他技术相比，其性能相对较低。目前有几个研究项目正在进行，旨在提高 1872 由瑞典工程师
    Charles Wilson 发明的简单太阳蒸馏器的效率[3], [4], [5]。


    目前有的两种太阳能蒸馏是被动式和主动式。被动式蒸馏器成本较低，除了太阳外不需要其他能源。它们在使用的材料和功能上可能有所不同，但都遵循相同的原理。主动式蒸馏器使用额外的能源来加速蒸发过程。我们发现[6],
    [7], [8], [9]。


    任何太阳能蒸馏系统的主要目标都是获得最大的产量。蒸馏器的性能取决于多个因素，例如气象参数：环境温度、太阳辐射。


    在研究中，我们利用人工智能来优化太阳蒸馏器的效率，通过集成`电磁阀`确保自动补水，并安装了水位传感器自动测量产量。


    ## 6.2 文献综述


    蒸馏器古代就以多种形式存在，并随着时间的推移发展出利用太阳能的低成本的形式，但这种蒸馏器的主要缺点是蒸馏产量低。然而，许多研究继续尝试各种方法来增加太阳能产量。


