- fmt: '

    Remote climate control systems for greenhouses typically contain a number of common
    elements: sensors, actuators, a microprocessor, a user interface, and a wireless
    communication system. Actuators are used to control them by opening or closing
    fans or vents, while sensors are used to measure the various environmental conditions
    inside the greenhouse, such as temperature and humidity. The system’s brain, the
    microcontroller, enables processing of sensor data and actuator control following
    set temperature settings. Remote monitoring and system control are made possible
    via the user interface, typically via a website or mobile app. The various system
    components may communicate with one other wirelessly and send each other user
    commands and temperature data as mentioned in [Figures 7.1](#ch7.xhtml#fig7_1)
    and [7.2](#ch7.xhtml#fig7_2).


    ![Figure 7.1 Temperature sensor with Arduino [5].](images/fig7_1_B.jpg)


    [Figure 7.1 Temperature sensor with Arduino](#ch7.xhtml#R_fig7_1) \[[5](#ch7.xhtml#ref7_5)\].


    ![Figure 7.2 Humidity sensor with Arduino [6].](images/fig7_2_B.jpg)


    [Figure 7.2 Humidity sensor with Arduino](#ch7.xhtml#R_fig7_2) \[[6](#ch7.xhtml#ref7_6)\].


    Sensors are tools that gauge many aspects of the environment, including temperature,
    humidity, light, air quality, etc. The ambient conditions in the greenhouse can
    be changed in real time using the information gathered by the sensors. On the
    basis of information gathered by sensors, actuators are devices that regulate
    the greenhouse’s ambient conditions. The data gathered by the sensors and the
    commands issued by the actuators can be transferred between the control system
    and the greenhouse thanks to communication networks. The numerous gadgets can
    be linked together via wireless technologies like Wi-Fi or Bluetooth. Control
    systems are computer programs that enable monitoring and management of the various
    greenhouse equipment. Additionally, they can be used to gather data, evaluate
    it, and build control plans based on the requirements of certain plants.


    ## 7.4 Results and Discussion


    ### 7.4.1 Proposal of an Intelligent System for the Control of a Greenhouse


    Using the sensors, the system ([Figure 7.3](#ch7.xhtml#fig7_3)) keeps track of
    the temperature and humidity levels inside the greenhouse. Artificial intelligence
    (AI) is used to evaluate acquired data and find trends and patterns that may reveal
    issues or possibilities to improve greenhouse environmental conditions. The microprocessor
    sends a command to the actuators to regulate the temperature or humidity using
    the cooling or heating system in the case of temperature and the humidifier or
    dehumidifier in the case of humidity if they go above the predefined limits. The
    control system continuously assesses the greenhouse’s environmental conditions
    and modifies the instructions given to the actuators in response to the information
    gathered.


    ![Figure 7.3 Schematization of the proposed system.](images/fig7_3_B.jpg)


    [Figure 7.3 Schematization of the proposed system.](#ch7.xhtml#R_fig7_3)


    It is possible to integrate a user interface to allow the user to monitor the
    temperature and humidity in real time and to modify the parameters remotely according
    to the needs. The user may monitor and manage the system from anywhere with an
    internet connection thanks to the wireless communication system, which makes remote
    monitoring convenient for farmers.


    The difference between the greenhouse temperature and the intended temperature,
    which is the input to the greenhouse temperature control process shown in [Figure
    7.4](#ch7.xhtml#fig7_4), defines the kind of actuator (heating or cooling) selected
    by the supervisor controller. Similar to [Figure 7.4](#ch7.xhtml#fig7_4), the
    difference between the actual and desired humidity is used to control the humidity
    in [Figure 7.5](#ch7.xhtml#fig7_5). The dehumidifier and humidifier are acting
    as actuators in this instance.


    ![Figure 7.4 Flowchart showing the temperature control process.](images/fig7_4_B.jpg)


    [Figure 7.4 Flowchart showing the temperature control process.](#ch7.xhtml#R_fig7_4)


    ![Figure 7.5 Flow chart showing the humidity control process.](images/fig7_5_B.jpg)


    [Figure 7.5 Flow chart showing the humidity control process.](#ch7.xhtml#R_fig7_5)


    ## 7.5 Conclusion


    Despite population expansion, using AI in agriculture may be a way to guarantee
    food security. Artificial Intelligence may assist farmers in optimizing their
    production and generating more food with fewer resources by offering precise weather
    forecasts, guidance on the management of soil and crops, and assistance in preventing
    plant diseases and pests. This could contribute to reducing environmental impact
    and guaranteeing the long-term sustainability of agricultural production while
    meeting the increasing global demand for food. Furthermore, Artificial Intelligence
    enables informed decision-making by providing accurate precise and current data
    about crops, soils, weather, and markets, which can assist farmers in maximizing
    their yields and preventing losses.


    In this study, we present a system for managing the climate within a greenhouse
    using Artificial Intelligence. AI can alter the environment in real time to improve
    plant development by employing sensors to assess humidity and temperature levels.
    For instance, the AI can alter ventilation to boost the flow of fresh air if CO[2]
    levels are too low or can activate fans to circulate air if humidity levels are
    too high. Similarly, if the temperature rises too much, the AI can activate cooling
    devices to keep the temperature at a desirable level. By maximizing the utilization
    of resources, this can assist farmers in increasing yields, minimizing losses,
    and conserving energy. Additionally, growers can respond rapidly to possible issues
    like disease or pests by monitoring greenhouse conditions in real time, which
    can assist lower losses and improve crop quality. In the end, gardeners aiming
    to maximize productivity and raise the caliber of their products may find employing
    AI to regulate greenhouse climatic conditions to be a useful tool.


