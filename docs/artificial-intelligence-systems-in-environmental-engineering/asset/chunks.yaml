    The unconsolidated samples of Wadi Issen are generally not so calcareous, with
    65% of the samples being non-calcareous to weakly calcareous. 31% of the samples
    are moderately calcareous and only one sample is strongly calcareous, representing
    only 4% of the sample. The latter are mainly transported by the tributaries of
    the right bank of the oued Issen which originate in the Jurassic northern and
    southern plateaus with essentially carbonate marine and lacustrine sedimentation.
    This is the case with the Aoujgal tributary E26 in the upstream section of Issen
    crossing the Ida-Ou-Bouzia cuestas to the north and the three tributaries of the
    downstream section draining the Ida-Ou-Tanan cuestas to the south and which are
    E4, E2 and E3, respectively, from Agadir Imouzgaou, Tasadamt and Alemzi. This
    stream transported strongly carbonated sediments with giant limestone blocks and
    directly fed the Abdelmomen dam with calcarenites.


    If run-off water is responsible for the dissolution of the carbonate formations,
    the heat will precipitate the limestone contained in the water, thus increasing
    the granular limestone content of the sands. This is how calcarenites with a very
    low mud content (1%) are formed. From the above, it can be seen that limestone
    is present in many samples, but mainly in contents of less than 10%. One could
    think that two main types of sand exist, those of the left bank poor in limestone
    and are siliceous sands and those of the right bank richer in limestone and are
    calcareous sands or calcarenites.


    ### 1.4.2 Surface Texture of Quartz Grains


    The various sandy materials were photographed using a scanning electron microscope
    ([Figure 1.4](#ch1.xhtml#fig1_4), [Figure 1.5](#ch1.xhtml#fig1_5), [Figure 1.6](#ch1.xhtml#fig1_6)
    and [Figure 1.7](#ch1.xhtml#fig1_7)). This allowed the surface of the grains to
    be qualitatively characterized, in particular their roughness, angularity, and
    sphericity. The analysis of images taken by SEM or exoscopy allows us to observe
    and interpret the surface condition of the quartz grains of the four samples analyzed.
    Thus, all the grains are marked by numerous traces that have distinctive shapes
    and sizes of the factors responsible for their appearance. The mechanical impacts
    observed better affect the quartz grains of the downstream section of Issen, they
    are related to an energetic hydrodynamic context. Dissolution pits can be observed
    on flat surfaces and in cavities. Strong pitting affects the entire surface of
    the grain, this indicates long water transport. Thus, the exoscopic analysis revealed
    analogies in the morphology of the quartz grains. In summary, the surface of the
    quartz grains of the four samples analyzed is marked by numerous traces that have
    shapes and sizes characteristic of the factors that formed them. These factors
    can be of physical, chemical, mechanical, or biological origin.


    ![Figure 1.4 Examples of SEM photographs of quartz grains showing grain surface
    characteristics of E24 sample (Issen upstream) with fractures at the level of
    a fracture whose edge is fresh.](images/fig1_4_B.jpg)


