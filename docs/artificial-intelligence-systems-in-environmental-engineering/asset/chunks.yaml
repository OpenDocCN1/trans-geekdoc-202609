- fmt: '

    The objective of this work is to study the effectiveness of a compost made from
    a mixture of olive pomace and cattle manure, for use as soil amendment during
    the germination of fava bean seeds. Different concentrations of compost (5%, 10%,
    15%, 20%, and 25%) are tested during the germination trial to determine the optimal
    dose. During the growth period, several parameters are regularly measured, including
    stem height, number of leaves, leaf surface area, number and size of pods. After
    seed maturity, they are harvested and subjected to a qualitative analysis of their
    nutritional value, measuring their protein, lipid, total sugar, and fiber content.


    ## 3. Materials And Methods


    ### 3.2.1 Experimental Design


    The experiment aims to germinate fava bean seeds in moderate percentages of compost
    made from olive pomace ([Table 3.1](#ch3.xhtml#table3_1)), in order to identify
    the fertilizing power of this compost and determine the optimal dose useful for
    the plants. To do so, fava bean seeds are disinfected with bleach water, thoroughly
    washed with water, and then rinsed with distilled water. They are then germinated
    on a soil surface of 225 m² (15*15).


    [Table 3.1 Soil Physicochemical Parameters](#ch3.xhtml#R_table3_1) ([Ameziane
    et al., 2020a](#ch3.xhtml#ref3_6))


    | Physicochemical Parameters | Soil Characteristics |

    | :--- | --- |

    | Clay in % | 9 ± 0.044 |

    | Sand in % | 68 ± 0.088 |

    | Silt in % | 23 ± 0.044 |

    | pH | 7.61 ± 0.044 |

    | Electrical conductivity in μS/cm | 85.5 ± 0.149 |

    | Moisture in % | 4.51 ± 0.044 |

    | Organic matter in % | 6.88 ± 0.125 |

    | Total organic carbon % | 4.88 ± 0.333 |

    | Total nitrogen in % | 0.134 ± 0.02 |

    | Total Phosphorus % | 0.0103 ± 0.003 |

    | Calcium % | 0.48 |

    | Potassium % | 0.0445 |

    | Magnesium % | 0.0243 |

    | Sodium % | 0.0092 |


    The germination site is located at the Higher School of Technology in Salé (Salé,
    Morocco, latitude 34°03′11″ North, longitude 6°47′54″ West, altitude above sea
    level: 34 m). The germination area studied is divided into six plots. Five plots
    contain a well-determined amount of compost corresponding to a defined percentage,
    5%, 10%, 15%, 20%, and 25% compost, and the sixth plot is reserved for the control
    which only contains soil, whose characteristics are presented in [Table 3.1](#ch3.xhtml#table3_1).
    In each plot, fava bean seeds are sown (at a rate of 10 seeds/1.5 m²) to a depth
    of 5 cm with a spacing of 10 cm between seeds.


    ![](images/figu3_1_B.jpg)


    The physicochemical characteristics of the soil are presented in [Table 3.1](#ch3.xhtml#table3_1).


    The compost used in this study is the result of recent work ([Ameziane et al.,
    2020b](#ch3.xhtml#ref3_7)). It consists of 43% olive pomace and 57% cattle manure,
    which are mixed in large 30-liter barrels. The barrels are perforated to ensure
    an aerated environment and placed in a sunny location. Composting lasted 130 days
    to obtain mature compost, whose physicochemical characteristics are presented
    in [Table 3.2](#ch3.xhtml#table3_2).


    [Table 3.2 Physicochemical Properties and Germination Index of Mature Compost](#ch3.xhtml#R_table3_2)
    ([Ameziane et al., 2020b](#ch3.xhtml#ref3_7))


    | Measured Parameters | Mature Compost |

    | :--- | --- |

    | pH | 8.61 ± 0.03 |

    | Humidity in % | 30.4 ± 0.14 |

    | EC in mS cm^(−1) | 2.06 ± 0.22 |

    | OM % | 38.4 ± 0.76 |

    | K[2]O % | 2.8 ± 0.36 |

    | NTK % | 1.3 ± 1.89 |

    | P[2]O[5] % | 0.42 ± 0.86 |

    | COT % | 22.32 ± 0.89 |

    | C/N % | 17.16 |

    | The germination index in % | 73 ± 0.65 |


    Each plot was irrigated with 2 liters of water on the day of sowing, using water
    from the well of the Higher School of Technology in Salé, whose physicochemical
    characteristics are in compliance with the Moroccan standard for irrigation water
    ([Secretariat of State at the Ministry of Energy, Mines, Water and Environment,
    in charge of Water and Environment, 2007](#ch3.xhtml#ref3_4)). The plants were
    left to the average of 550 mm.


    [Table 3.3 Physicochemical Parameters of Irrigation Water](#ch3.xhtml#R_table3_3)
    ([Ameziane et al., 2020a](#ch3.xhtml#ref3_6))


    | Physicochemical Parameters | Characteristics of Irrigation Water |

    | :--- | --- |

    | pH | 7.49 |

    | Electrical conductivity in mS/cm | 1.02 |

    | Temperature in °C | 18.1 |

    | Suspended matter in mg/l | 232 |

    | Salinity in ppb | 0.5 |

    | Nitrates in mg/l | 192.5 |

    | Chlorides in mg/l | 0.03 |

    | Boron in mg/l | 0.04 |

    | Sulphates in mg/l | 21.3 |

    | Orthophosphates in mg/l | 0.005 |


    ### 1. Plant material


    The species `Vicia faba` is found in all regions.


    ### 2. Measured parameters


    Regular monitoring of broad bean was carried out. Five parameters were determined:


    *   Height of aboveground (stems): The height was measured using a graduated ruler.

    *   Number of leaves: The number of leaves was counted for each plant.

    *   Leaf surface area: The surface area was calculated by multiplying `L` by `l`
    of each leaf.

    *   Number of pods: After harvest, the number of pods contained in each plant
    was counted.

    *   Pod size: The size of the pods was measured using graduated tape.


    ### 3. Nutritional quality


    At the end of the germination test, and for each percentage, the broad bean seeds
    contained in the pods were collected, dried at 60°C until reaching a constant
    weight, then ground and sieved to 0.2 mm to determine their protein, lipid, total
    sugar, and fiber content. The assessment of the nutritional quality was carried
    out in the laboratory of the Regional Center for Agricultural Research in Rabat,
    Food Technology Unit.


    #### 3.1. Protein determination


    Proteins are determined by the `Kjahlahl method`, which involves the hot decomposition,
    with sulfuric acid and a catalyst, of organic compounds containing nitrogen (proteins
    and nucleic acids). This catalyst contains `K[2]SO[4]`, which increases the boiling
    point of sulfuric acid, and `CuSO_4`, which acts as a catalyst for the reaction.
    Nitrogen is quantitatively converted into ammonium sulfate during the mineralization
    step.


    Ammonia is then displaced from its salt by sodium hydroxide, distilled with steam,
    and collected in a known amount of excess hydrochloric acid. This is the distillation
    step. The amount of hydrochloric acid that did not react is then titrated with
    sodium hydroxide. This is the titration step. The nitrogen content is expressed
    by the formula:


    ```

    %MAT = \frac{(V_e - V_b) \times N\_HCl \times 14 \times 6,25}{P_e \times 100}

    ```


    With:


    *   `V_e`: the volume of HCl used for titrating the sample in ml

    *   `V_b`: the volume of HCl used for titrating the blank in ml

    *   `N_HCl`: the normality of HCl in *N*

    *   `P_e`: the weight of the sample in mg.


    #### 3.2. Lipid determination


    The `Soxhlet method`.

