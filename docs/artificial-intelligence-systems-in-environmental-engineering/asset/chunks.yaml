- fmt: "\nThe various stages of the thermisor allow the raw milk to be preheated,\
    \ to reach a temperature of 75°C for partial destruction of the micro-organisms,\
    \ and then to be rapidly cooled to maintain its quality before further use [[10](#ch9.xhtml#ref9_9),\
    \ [11](#ch9.xhtml#ref9_10)]].\n\n### 1. Physicochemical analysis\n\n*   In assessing\
    \ milk stability, various parameters are taken into account for physicochemical\
    \ analysis. The `pH` of raw milk is a crucial parameter, as significant fluctuations\
    \ can indicate changes in its chemical composition, which can thereby affect its\
    \ stability. The alcohol test detects any abnormal presence of alcohol in the\
    \ milk, which may indicate contamination or spoilage. The storage temperature\
    \ of raw milk is also essential to prevent bacterial growth and maintain its quality\
    \ and stability. High acidity can result from the presence of bacteria, indicating\
    \ contamination or spoilage. Fat content plays a key role in milk stability, as\
    \ fats help to form a stable emulsion. Similarly, proteins are important in maintaining\
    \ the milk’s colloidal structure and preventing coagulation or phase separation.\
    \ In summary, assessing milk stability involves taking into account `pH`, alcohol,\
    \ storage temperature, acidity, fat content and protein, to ensure its quality\
    \ and durability.\n\n*   The `pH` of normal fresh cow’s milk is around 6.7. This\
    \ value is largely due to the basic ionizable and dissociable acid groups in proteins,\
    \ the phosphoric ester groups in caseins, and phosphoric and citric acids.\n\n\
    *   Take a sampling of the milk and bring it to the boil. If the milk turns sour\
    \ (forming lumps), the processor must refuse to take this milk, as it will turn\
    \ sour during pasteurization, and will therefore be unable to withstand the temperatures\
    \ required to eliminate germs.\n\n*   Take a 10 centilitre milk sample and mix\
    \ with 10 centilitres of 60° alcohol. Mix together. If lumps form (“coagulation”),\
    \ the milk should be rejected, as this indicates the probable presence of germs.\
    \ However, it is possible that milk that coagulates in the alcohol test can withstand\
    \ pasteurization. It is therefore not a completely reliable test.\n\n*   Measuring\
    \ acidity provides an indication of whether acidification reactions have begun\
    \ (indicator of lactic acid–fermentation bacteria activity). The advantage of\
    \ this test is that it’s easy to use, inexpensive and gives immediate results.\
    \ On leaving the udder, healthy milk has a natural acidity of between 15° and\
    \ 21° Dornic (14° to 16° for goat’s milk). On arrival at the dairy, milk acidity\
    \ is measured to check that fermentation has not begun.\n\n### 2. Measuring milk\
    \ fat content\n\n1.  The principle of milk fat (`MF`) separation is based on centrifugation\
    \ in a butyrometer, where sulfuric acid attacks the milk components, with the\
    \ exception of the `MF`. The addition of iso-amyl alcohol promotes fat separation\
    \ ([Figure 9.2](#ch9.xhtml#fig9_2)).\n\n    ![Figure 9.2 The GERBER method.](images/fig9_2_B.jpg)\n\
    \n    [Figure 9.2 The GERBER method.](#ch9.xhtml#R_fig9_2)\n\n2.  The procedure\
    \ for this method is as follows:\n\n    *   Add 10 ml sulfuric acid (`d` = 0.818)\
    \ to the butyrometer.\n    *   Using a pipette, add 11 ml of milk to the butyrometer,\
    \ placing the pipette tip in contact with the butyrometer to avoid premature mixing\
    \ of milk and sulfuric acid.\n    *   Next, add 1 ml iso-amyl alcohol without\
    \ mixing the liquids.\n    *   Close the butyrometer tightly and shake vigorously\
    \ until the mixture is homogeneous.\n    *   At this point, the butyrometer reaches\
    \ a temperature of around 80°C, due to the mixing of the sulfuric acid with the\
    \ milk.\n    *   After stirring, centrifuge at 65°C, at 1200 rpm, for 5 minutes.\n\
    \n3.  To read the results:\n\n    *   Remove the butyrometer from the centrifuge\
    \ and carefully adjust the neck cap to position the lower end of the fat column\
    \ opposite a numbered mark, moving the column as little as possible.\n    *  \
    \ The reading should be taken quickly by moving the butyrometer in front of the\
    \ eyes and noting the lowest level of the meniscus.\n    *   The normal fat content\
    \ of milk is 40 g/l.\n\n4.  This method quantifies the fat content of milk by\
    \ centrifugation and reading the fat column level in the butyrometer. The reading\
    \ is taken quickly to obtain an accurate measurement.\n\n### 3. Determination\
    \ of dry matter content\n\n*   The principle of the method is to dry the sample\
    \ in a crucible at a constant temperature of 103°C in a ventilated oven, at atmospheric\
    \ pressure, until its weight reaches a practically constant value.\n*   This method\
    \ works as follows:\n\n    *   Prepare crucibles by placing in oven at 103 ± 1°C\
    \ for half an hour, cooling and weighing.\n    *   Weigh 1 ml of sample into the\
    \ prepared crucibles.\n    *   Dry samples in the oven at 103 ± 1°C for 24 hours,\
    \ then cool in a desiccator for 30 minutes.\n\n*   The results can be read according\
    \ to the following relationship: `Percentage of dry matter (MS%) = (m_1 − m_0)\
    \ × 100/m_2` Where: `MS`: percentage of dry matter in %, `m_0`: mass of empty\
    \ crucible (g), `m_1`: mass of crucible and milk residue (g), `m_2`: weight of\
    \ sample taken (g).\n\n*   This method determines the dry matter content of milk\
    \ by calculating the difference in mass between the crucible and the residue.\
    \ Dry matter is expressed as a percentage.\n\n### 4. Microbiological analysis\n\
    \n*   The aim of microbiological analyses in milk is to detect the presence of\
    \ micro-organisms, assess their bacteriological quality and verify the safety\
    \ level of milk, both for raw and pasteurized.\n*   For these microbiological\
    \ analyses, the focus is on a specific parameter: total aerobic mesophilic flora\
    \ (`TAMF`). `FMAT` measures the number of Colony Forming Units (`CFU`) present\
    \ in a product or on a surface.\n*   `CFU` counts are carried out at a temperature\
    \ of 30°C, enabling us to distinguish three types of flora: thermophilic flora,\
    \ which prefer an optimum growth temperature of 45°C; mesophilic flora, which\
    \ prefer an optimum growth temperature between 20°C and 40°C; and psychrophilic\
    \ flora, which prefer an optimum growth temperature of 20°C.\n*   Since the culture\
    \ medium used is favorable to most micro-organisms, with the exception of demanding\
    \ micro-organisms and strictly anaerobic micro-organisms, it is more appropriate\
    \ to speak of `Mesophilic Aerobic Flora at 30°C` rather than “total flora”.\n\
    *   The unit of measurement used to quantify micro-organisms is the `CFU` (Colony\
    \ Forming Unit), since a colony observable in the agar may originate from a single\
    \ micro-organism, a spore or a combination of micro-organisms.\n*   The analysis\
    \ procedure is as follows:\n\n    *   Transfer to a single Petri dish.\n    *\
    \   Using a sterile pipette, transfer 1 ml of the sample to be tested (or prepare\
    \ a dilution series if necessary).\n    *   Pour approximately 15 ml of Plate\
    \ Culture Agar (`PCA`) culture medium into each Petri dish.\n    *   Mix the inoculum\
    \ thoroughly with the culture medium.\n    *   Allow the mixture to solidify.\n\
    \    *   Incubate plates for 3 days at 30°C ± 1°.\n    *   Count and select colonies\
    \ for confirmation.\n*   These steps make it possible to assess the quantity of\
    \ micro-organisms present in the milk sample, providing information on its bacteriological\
    \ quality and safety. Raw cow’s milk undergoes a series of microbiological analyses\
    \ to control its hygienic quality [[11](#ch9.xhtml#ref9_10)]$. These analyses\
    \ are summarized in [Table 9.1](#ch9.xhtml#table9_1).\n\n    [Table 9.1 Raw Milk\
    \ Analysis](#ch9.xhtml#R_table9_1)\n\n    | Desired Germ || Media Used || Incubation\
    \ Temperature || Incubation Time |\n    | --- | --- | --- | --- |\n    | Mesophilic\
    \ total | `PCA` | 37°C | 24 hours |\n    | --- | --- | --- | --- |\n    | Total\
    \ coliforms | `VRBL` | 37°C | 24 to 48 hours |\n"
