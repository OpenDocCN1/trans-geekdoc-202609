    # 1. Chapter 1 Scanning Electron Microscope (SEM) Observation of Quartz Grains
    from Issen Wadi, Western Atlas


    ## 1.1 Introduction


    Soil erosion is one of the most severe threats to the environment around the world
    (Mondal et al., 2015). The dynamics of a catchment depend essentially on environmental
    conditions, climate, geology, land use and variables (Rollet, 2007). At a global
    level, more than 50% of sediment flows are trapped by dams (Vörösmarty et al.,
    2003). Other studies have also shown that the sedimentological characterization
    of solid inputs (sands, pebbles, and clays) from rivers gives very good information
    on eroded areas and sediment origins (Elouden et al., 2005). The microtextures
    on the surface of quartz grains provide an insight into the sedimentary history
    of sediments, and in particular, specify the nature of the transport agents (Soyer,
    1969). Therefore, about 250 characters have been listed (Mahaney, 2002). The granulometric
    and petrographic results, completed or confronted with others of an exoscopic
    nature, will contribute to the mapping of the zones responsible for the silting
    of the Abdelmomen dam (Ed-Dakiri et al., 2022). The Issen watershed is located
    in a region with an arid to semi-arid climate; it is characterized by its large
    area, varied terrain relief and climatic processes, its variable topographical
    and geomorphological factors and different types of lithology. The exoscopic analysis
    of quartz grains from the Issen basin has contributed to the knowledge of the
    basin environment and the dynamics of the wadi. They could also be used in comparisons
    with the other watersheds of the High Atlas and the right bank of Oued Souss.
    The objectives of this study include: (1) to give an overview of calcareous rate
    distribution in detrital sand-grained sediment supply from the Issen basin; (2)
    to imply the knowledge for interpretation of different shapes and traces affecting
    in terms of the quartz particles evolution, mainly in the main watercourse; (3)
    to deduce spatial transport processes of the main quartz particles, relating to
    erosional factors and currents in the main river and major tributaries.


