    pomace compost increased the stem size, number of leaves, leaf surface area, as
    well as the number and size of pods compared to the control, for different compost
    doses ([Figure 3.4](#ch3.xhtml#fig3_4)). This morphological improvement of the
    fava bean can be attributed to the richness of olive pomace compost in fertilizing
    elements (`NPK`, `P2O5`, and `K2O`) necessary for the growth and development of
    most plants ([Table 3.2](#ch3.xhtml#table3_2)) ([Regni et al., 2016](#ch3.xhtml#ref3_38)).
    Indeed, the addition of olive pomace compost to soils generally increases the
    total concentrations of hydrosoluble organic carbon as well as nitrogen, which
    mainly contributes to the development of plant foliage and aerial parts, potassium,
    which is useful for the circulation of sap and assimilation of nutrients by plants,
    and phosphorus, which stimulates root development, flowering, and fruiting ([Cao
    et al., 2018](#ch3.xhtml#ref3_13); [Curaqueo et al., 2014](#ch3.xhtml#ref3_17)).
    Similarly, a study conducted by [Clemente et al. (2012)](#ch3.xhtml#ref3_15) and
    [Pardo et al. (2014d)](#ch3.xhtml#ref3_36) revealed a 10-fold increase in potassium
    and a 5-fold increase in phosphorus compared to the control in a soil that was
    poor in these two elements, after amending it for two years with olive pomace
    compost ([Table 3.4](#ch3.xhtml#table3_4)). This improvement is of great importance
    for the stimulation of biogeochemical nutrient cycles in these typically poor
    soils and for their fertility ([Pardo et al., 2014b](#ch3.xhtml#ref3_35)).


    ## 3.6 Conclusions


    In conclusion, with regard to this experiment, the optimal dose of olive pomace
    for fava beans is `10%`, which corresponds to `4.32 g/m²`. The results of this
    study are in agreement with those of other research, which have also shown that
    the use of olive pomace compost can be a sustainable and cost-effective alternative
    to chemical fertilizers. Therefore, this practice can contribute to promoting
    more environmentally friendly and sustainable agriculture.

