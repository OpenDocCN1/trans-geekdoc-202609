    \ growth of the Fava bean plants. Adding different doses of compost (5%, 10%,\
    \ 15%, 20%, and 25%) to the Fava bean plants improved their growth parameters.\
    \ The number and leaf area of the plants were significantly higher for all doses\
    \ used compared to the control group. In addition, the stem size of the plants\
    \ was significantly improved compared to the control plants, especially for the\
    \ doses of 5%, 10%, 20%, and 25% of compost. Similarly, the nutritional quality\
    \ of mature fava bean seeds showed significantly higher quality characteristics\
    \ in terms of protein, lipids, total sugars, and fibers compared to seeds grown\
    \ in the control group, especially for seeds from plants fertilized with 10% compost.\
    \ In this regard, it can be said that the optimal dose under conditions similar\
    \ to those in this experiment for the germination of fava beans is 10% compost,\
    \ which corresponds to 4.32 g/m². The results of this study are in agreement with\
    \ those of other research, which have also shown that the use of olive pomace\
