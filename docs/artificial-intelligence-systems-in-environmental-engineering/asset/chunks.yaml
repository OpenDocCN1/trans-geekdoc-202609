    DOI: [10.1201/9781003436218-8](https://dx.doi.org/10.1201/9781003436218-8)


    ## 8.1 引言


    水在干旱和半干旱地区是非常有限的自然资源 [1]。现有资源正受到城市和工业排放对受体环境污染的威胁 [2, 3, 4 和 5]。这些排放可能包含许多固态和溶解物质，以及许多病原微生物，它们威胁着整个环境的质量
    [6, 7 和 8]。即使在水和土地资源充足的情况下，水危机仍被视为全球主要问题和威胁之一 [9]。根据联合国世界水资源开发报告（2014 年），超过两百万吨废水、农业和工业废物未经处理直接被排放到发展中国家的湖泊、河流和其他水体中，导致可用水源受到污染
    [10]。来自家庭、工业、商业和机构的废水含有许多可能对人类健康和环境构成风险的物质 [11]。另一方面，生活废水来自洗厕所以及家庭用水（厨房、浴室、洗衣以及除洗厕所以外的某些家电产生的水）
    [12]。废水中的出物中包括难以生物降解的合成化学化合物，当这些出物排放到受体环境时，在食物链的所有层中都能发现致突变/或致癌毒物 [13]。因此，必须找到替代性的水处理方法
    [14]。近年来，出现了无数计的生物技术应用，例如生物修复，它可以允许在没有这些缺点的情况下进行废水处理 [15]。这一过程涉及使用微生物（通常是细菌或真菌）去除土壤和水中的污染物
    [16]。利用藻类（宏或微藻）从废水和残留空气二氧化碳中去除各种营养盐、重金属和外源性的去除、生物转化或矿化的艺术被称为生物修复 [17, 18]。在处理过程中，会使用氮、磷和其他盐
    [19, 20]。藻类发挥着关键作用 [21, 22]。它们甚至可以产生有机物 [23, 24]。


    这项工作的主要目的是评估利用藻类处理废水和消除金属的有效性。


    ## 8.2 材料与方法


    ### 8.2.1 微藻培养


    微藻培养可以在开放式池塘或光生物反应器中进行 [18]。开放式系统非常常见 [25, 26, 27]。微藻生长非常快，预计产量每天约 77 g/m² [28]。


    **开放系统：**


    使用池塘等开放系统进行藻类培养 [29]。然而，这很难，并且需要对培养基进行严格灭菌以避免污染 [30]。开放系统的类型包括大型池塘和圆形池塘 [31]。


    图 8.1 显示了开放系统的示意图。


    ![图 8.1 开放系统](img/fig8_1.jpg)


    **封闭系统：**


    光生物反应器由透明材料制成，以便控制培养参数（温度、二氧化碳和 pH） [32]。它们提供了封闭培养环境，保护培养免受直接污染，减少培养基的蒸发，同时促进二氧化碳的供应
    [33]。光生物反应器允许高效布局，还能去除光合作用产生的氧气。为了更好地控制过程，一种解决方案是进行封闭种植。封闭系统的原理是通过透明材料使微藻与自然光接触。


    ### 8.2.2 优缺点


    根据目标产品的不同，微藻培养系统既有优点也有缺点，它们被分类在表 8.1 中。


    **表 8.1 微藻培养系统的优缺点**


    | 优点 | 参考文献 | 缺点 | 参考文献 |

    | :--- | :--- | :--- | :--- |

    | **开放系统** | | | |

    | 低成本 | [34] | 难以控制生长条件 | [38] |

    | 维护 | [35] | 污染威胁 | [39] |

    | 建造 | [36] | 蒸发损失 | [40] |

    | 配置容易完成 | [37] | | |


