    The solenoid valve is used to convert electrical energy into mechanical energy.
    It allows autonomous and remote control of the fluid flow in a system. The solenoid
    valve consists of two parts, as shown in [Figure 6.1](#ch6.xhtml#fig6_1). The
    solenoid is made up of a coil which is used to operate the valve by passing an
    electric current through them to create an electromagnetic field and operate the
    valve, this means if it is connected to a controller it can be used in any way
    autonomous and remotely by a computer without the need to physically move to open
    and close the valves. This allows the system to operate much more efficiently
    and safely.


    ![Figure 6.1 Diagram of the inclined solar distiller.](images/fig6_1_B.jpg)


    [Figure 6.1 Diagram of the inclined solar distiller.](#ch6.xhtml#R_fig6_1)


    There are two types of valves: the normally open and normally closed type. In
    our case, we will use the normally closed valve ([Figure 6.2](#ch6.xhtml#fig6_2)).


    ![Figure 6.2 Solenoid valve.](images/fig6_2_B.jpg)


    [Figure 6.2 Solenoid valve.](#ch6.xhtml#R_fig6_2)


    ### 6.4.3 Level Sensor


    A level sensor is an electronic device that measures the level of liquid in a
    tank or other container. Liquid level sensors can operate according to different
    measurement concepts, including pressure, electrical capacity, radiation, ultrasound,
    vibration, and electrical conductivity.


    In this study we will rather be interested in the ultrasonic sensor which works
    by emitting a sound pulse which propagates in the air to the surface of the liquid
    and is reflected when it meets the surface of the liquid, the sensor detects the
    echo and measures the time it takes for the echo to return. The distance between
    the liquid surface and the sensor is calculated using the speed of sound in air.
    [Figures 6.3](#ch6.xhtml#fig6_3) and [6.4](#ch6.xhtml#fig6_4) show respectively
    a sensor and its simplified operating diagram.


    ![Figure 6.3 Level sensor.](images/fig6_3_B.jpg)


    [Figure 6.3 Level sensor.](#ch6.xhtml#R_fig6_3)


    ![Figure 6.4 Operation of level sensor.](images/fig6_4_B.jpg)


    [Figure 6.4 Operation of level sensor.](#ch6.xhtml#R_fig6_4)


    ### 6.4.4 The Arduino Board


    The Arduino board: In reality, it is an open-source platform called `Arduino UNO`,
    which is based on an 8-bit microcontroller and has additional parts that facilitate
    programming and connection to other electronic circuits ([Figure 6.5](#ch6.xhtml#fig6_5)).


    ![Figure 6.5 Arduino board.](images/fig6_5_B.jpg)


    [Figure 6.5 Arduino board.](#ch6.xhtml#R_fig6_5)


    The `Arduino IDE`, which allows you to edit, compile and transfer a program to
    its memory, can be used to program this microcontroller. Just use a `USB/Serial`
    cable to connect the Arduino motherboard to a computer [[16](#ch6.xhtml#ref6_16)].


    ## 6.5 Results and Discussion


    To better manage our system consisting of the solar still, we will automate the
    filling of salt water tank by integrating a solenoid valve that we will control
    using `Arduino` card.


    ### 6.5.1 Flowchart of the Solenoid Valve


    The [Figure 6.6](#ch6.xhtml#fig6_6) shows the flowchart that summarizes the operating
    program of solenoid valve. In fact, when the water level in the tank is lower
    than the low level, the solenoid valve receives the signal to open and when the
    opposite occurs, the solenoid valve is always closed, the cycle repeats until
    the system stops.


    ![Figure 6.6 Flowchart of the solenoid valve. (Lsw: Salt water level; Ll: Low
    level, the low level in case is determined from 1L.)](images/fig6_6_B.jpg)


    [Figure 6.6 Flowchart of the solenoid valve. (Lsw: Salt water level; Ll: Low level,
    the low level in case is determined from 1L.)](#ch6.xhtml#R_fig6_6)


    Developing a monitoring system for the online control of the solar distiller is
    of great importance, because improving the working conditions and productivity
    while monitoring the most important parameters. The realization of this assembly
    will allow us to automate part of the distiller, and to control other parameters
    of the distiller, namely the temperature, the solar radiation, the flow of distilled
    water, in order to arrive at a final system.


    ## 6.6 Conclusion


    Human existence requires the consumption of energy and water. Researchers are
    working to identify strategies to meet the growing demand for water without endangering
    the environment. Among the alternatives found is solar desalination technology,
    which uses solar energy as a power and is an efficient and environmentally friendly
    option. As part of this work, a distiller is already made with zinc absorber;
    we have proposed a flowchart for solenoid valve to be controlled with `Arduino`
    card in order to automate the solar distiller, to increase the production of distilled
    water.


