    \ until its weight reaches a practically constant value.\n\n    *   This method\
    \ works as follows: \n\n        *   Prepare crucibles by placing in oven at 103\
    \ ± 1°C for half an hour, cooling and weighing.\n\n        *   Weigh 1 ml of sample\
    \ into the prepared crucibles.\n\n        *   Dry samples in the oven at 103 ±\
    \ 1°C for 24 hours, then cool in a desiccator for 30 minutes.\n\n    *   The results\
    \ can be read according to the following relationship: Percentage of dry matter\
    \ (MS%) = (*m*₁ − *m*₀) × 100/*m*₂ Where: MS: percentage of dry matter in % *m*₀:\
    \ mass of empty crucible (g) *m*₁: mass of crucible and milk residue (g) *m*₂:\
    \ weight of sample taken (g)\n\n    *   This method determines the dry matter\
    \ content of the sample by calculating the difference in mass between the crucible\
    \ and the milk residue after drying. Dry matter content is expressed as a percentage.\n\
    \n4.  **Microbiological analysis** \n\n    *   The aim of microbiological analyses\
    \ in milk is to detect the presence of micro-organisms, assess their bacteriological\
    \ quality and verify the safety level of milk, both for raw and pasteurized milk.\n\
    \n    *   For these microbiological analyses, the focus is on a specific parameter:\
    \ total aerobic mesophilic flora (TAMF). FMAT is a health indicator that measures\
    \ the number of Colony Forming Units (CFU) present in a product or on a surface.\n\
    \n    *   CFU counts are carried out at a temperature of 30°C, enabling us to\
    \ distinguish three types of flora: thermophilic flora, which prefer an optimum\
    \ growth temperature of 45°C; mesophilic flora, which prefer an optimum growth\
    \ temperature between 20°C and 40°C; and psychrophilic flora, which prefer an\
    \ optimum growth temperature of 20°C.\n\n    *   Since the culture medium used\
    \ is favorable to most micro-organisms, with the exception of demanding micro-organisms\
    \ and strictly anaerobic micro-organisms, it is more appropriate to speak of Mesophilic\
    \ Aerobic Flora at 30°C rather than “total flora”.\n\n    *   The unit of measurement\
    \ used to quantify micro-organisms is the CFU (Colony Forming Unit), since a colony\
    \ observable in the agar medium may originate from a single micro-organism, a\
    \ spore or a combination of micro-organisms.\n\n    *   The analysis procedure\
    \ is as follows: \n\n        *   Transfer to a single sterile Petri dish.\n\n\
    \        *   Using a sterile pipette, transfer 1 ml of the sample to be tested\
    \ (or prepare a dilution series if necessary).\n\n        *   Pour approximately\
    \ 15 ml of Plate Culture Agar (PCA) culture medium into each Petri dish.\n\n \
    \       *   Mix the inoculum thoroughly with the culture medium.\n\n        *\
    \   Allow the mixture to solidify.\n\n        *   Incubate plates for 3 days at\
    \ 30°C ± 1°C.\n\n        *   Count and select colonies for confirmation.\n\n \
    \   *   These steps make it possible to assess the quantity of micro-organisms\
    \ present in the milk sample, providing information on its bacteriological quality\
    \ and safety. Raw cow’s milk undergoes a series of microbiological analyses to\
    \ control its hygienic quality \\[[11](#ch9.xhtml#ref9_10)\\]. These analyses\
    \ are summarized in [Table 9.1](#ch9.xhtml#table9_1).\n\n    [Table 9.1 Raw Milk\
    \ Analysis](#ch9.xhtml#R_table9_1)\n\n    | Desired Germ || Media Used || Incubation\
    \ Temperature || Incubation Time |\n\n    | --- | --- | --- | --- |\n\n    | Mesophilic\
    \ total || PCA || 37°C || 24 hours |\n\n    | --- | --- | --- | --- |\n\n    |\
    \ Total coliforms || VRBL || 37°C || 24 to 48 hours |"
