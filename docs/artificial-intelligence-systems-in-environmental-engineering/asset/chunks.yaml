    # Chapter 1 A Scanning Electron Microscope (SEM) Observation of Quartz Grains
    from Issen Wadi, Western High Atlas, Morocco Implications for the Sedimentary
    Environment


    Mohamed Ait Haddou, Belkacem Kabbachi, Youssef Bouchriti, and Rachid Amiha


    Ibn Zohr University, Agadir, Morocco


    DOI: [10.1201/9781003436218-1](https://dx.doi.org/10.1201/9781003436218-1)


    ## 1.1 Introduction


    Soil erosion is one of the most severe threats to the environment around the world
    ([Mondal et al., 2015](#ch1.xhtml#ref1_11); [Zhiying and Fang, 2016](#ch1.xhtml#ref1_19)).
    It is a worrying environmental challenge in some regions such as Morocco ([Ed-Dakiri
    et al., 2022](#ch1.xhtml#ref1_6)). The dynamics of a catchment depend essentially
    on environmental conditions, climate, geology, land use, and control variables
    related to liquid and solid flows ([Rollet, 2007](#ch1.xhtml#ref1_13)). At a global
    level, more than 50% of sediment flows in regulated basins are trapped by dams
    ([Vörösmarty et al., 2003](#ch1.xhtml#ref1_17)). Other studies have also shown
    that the sedimentological characterization of solid inputs (sands, pebbles, and
    clays) from rivers gives very good information on eroded areas and sediment origins
    such as lithological units, soil types, and mineral assemblages ([Elmouden et
    al., 2005](#ch1.xhtml#ref1_7); [Omdi et al., 2018](#ch1.xhtml#ref1_12)). The microtextures
    on the surface of quartz grains provide an insight into the sedimentary history
    of sediments, and, in particular, specify the nature of the transport agents causing
    their shaping ([Soyer, 1969](#ch1.xhtml#ref1_15); [Vos et al., 2014](#ch1.xhtml#ref1_18)).
    Therefore, about 250 characters have been listed ([Mahaney, 2002](#ch1.xhtml#ref1_10)).
    The granulometric and petrographic results, completed or confronted with others
    of an exoscopic nature, will contribute to the mapping of the zones, potentially
    producing fine sediments responsible for the silting of the Abdelmomen dam. The
    Issen watershed is located in a region with an arid to semi-arid climate; it is
    characterized by its large area, varied terrain relief and climatic processes,
    its variable topographical and geomorphological factors and different types of
    lithology. The exoscopic analysis of quartz grains from the Issen basin has contributed
    to the knowledge of the basin environment and the dynamics of the wadi. They could
    also be used in comparisons with the other watersheds of the High Atlas and the
    right bank of the Oued Souss. The objectives of this study include: (1) to give
    an overview of calcareous rate distribution in detrital sand-grained sediment
    supply from the Issen basin; (2) to imply the knowledge for interpretation of
    different shapes and traces affecting in terms of the quartz particles evolution,
    mainly in the main watercourse; (3) to deduce spatial transport processes of the
    main quartz particles, relating to erosional factors and currents in the main
    river and major tributaries. Understanding the structural and lithological setting,
    terrain characteristics, geomorphological processes, hydrological condition, land
    use/land cover and vegetation status, and other topographic factors, elevation,
    slope, and aspect, is essential for understanding degradation mechanisms and designing
    effective erosion mitigation measures.


