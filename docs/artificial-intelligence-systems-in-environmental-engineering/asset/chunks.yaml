    \ 进行。\n\n## 9.3.1.1 牛奶接收方法\n\n牛奶接收分为几个阶段。在清空储奶罐之前，会取样在实验室进行物理化学和微生物学分析，并对酸度、脂肪含量、密度和\
    \ `pH` 进行快速测试。\n\n接收阶段如下：\n\n*   **脱气**：牛奶通过一个脱气器，以消除牛奶中存在的气味和气泡。\n*   **过滤**：牛奶通过两个孔径逐渐增加的圆柱金属过滤器，拦截不需要的悬浮物，如碎屑、绒絮等。定期清洗这些过滤器对于保持其效率至关重要。\n\
    *   **冷却**：牛奶在储存前，通过板式换热器冷却至 `4°C`，在换热器中使用逆流冷却水进行冷却。冷却的目的是停止微生物活动。\n*   **储存**：根据牛奶的状态和公司的经营活动，牛奶可以进行储存或直接加工。\n\
    \n**热处理（或预巴氏菌）**：这是一种对生奶采用的强度较弱的热处理，在 83°C 至 88°C 的温度下持续约 15 秒。该处理的目的是杀灭牛奶中的病原菌和大部分常见细菌菌群，尽管其强度低于巴氏杀菌。这些不同阶段确保了牛奶在储存或进一步加工前的质量和安全。\n\
    \n## 9.4 结果与讨论\n\n### 9.4.1 牛奶的物理化学分析\n\n图图 9.3、9.4 和 9.5 展示了三个确定位置四个样本的分析结果，分别为：生奶、热处理牛奶；热处理一小时后的牛奶，如\
    \ `AC`、`MG`、`TP`、`EST`、`T`、`TA`。\n\n![图 9.3 生奶物理化学分析结果。](img/fig9_3_B.jpg)\n\n\
    图 9.3 生奶物理化学分析结果。\n\n![图 9.4 热处理一小时后牛奶的物理化学分析结果。](img/fig9_4_B.jpg)\n\n图 9.4 热处理一小时后牛奶的物理化学分析结果。\n\
    \n![图 9.5 生奶和热处理后牛奶样本中的 CFU 数量。](img/fig9_5_B.jpg)\n\n图 9.5 生奶和热处理后牛奶样本中的 CFU\
    \ 数量。\n\n生奶的物理化学分析显示，`SAFILIAT’s` 生奶符合所有分析标准。所有四个样本在 `AC`、`pH`、`MG`、`TP`、`EST`\
    \ 和 `T` 方面保持稳定。`P2` 样本在 `TA` 方面不稳定。在储存阶段（热处理一小时后），`TA` 分析值下降到 `76%`，尽管这会对该 `P2`\
    \ 品种的稳定性构成威胁，但它符合公司标准。\n\n### 9.4.2 牛奶的微生物分析\n\n该测试对 `84°C` 下处理 15 秒的四个牛奶样本进行，目的是确定生奶和热处理一小时后牛奶中的\
    \ `CFU` 数量。结果如下表所示，所有四个样本在 `AC`、`pH`、`MG`、`TP`、`EST` 和 `T` 方面保持稳定。`P2` 样本在 `TA`\
    \ 方面不稳定。在储存阶段（热处理一小时后），`TA` 分析值下降到 `76%`，尽管这会对该 `P2` 品种的稳定性构成威胁，但它符合公司标准。\n\n\
    \ 9.5 结论\n\n热处理是一种对生奶采用的强度较弱的热处理，在 83°C 至 88°C 的温度下持续约 15 秒。该处理的目的是杀灭牛奶中的病原菌和大部分常见细菌菌群，尽管其强度低于巴氏杀菌。这些不同阶段确保了牛奶在储存或进一步加工前的质量和安全。\
