- fmt: "\nSoil degradation has important impacts on ecosystem services, and poor soil\
    \ quality may diminish the ability of ecosystems to support the functions or services\
    \ required to ensure their sustainability. Growing awareness about the interdependence\
    \ of parts of ecosystems will put more pressure on agriculture to reduce negative\
    \ impacts on ecosystems, for example, by reducing soil degradation and managing\
    \ carbon storage. In addition, soil degradation represents a serious threat to\
    \ environmental issues that are concerned with land stability and cover ([Gobinath\
    \ et al. 2022](#ch2.xhtml#ref2_7)).\n\nLand-use change can significantly reduce\
    \ soil organic carbon (`SOC`) and increase carbon dioxide (`CO[2]`), nitrous dioxide\
    \ (`NO[2]`), and methane (`CH[4]`) emissions. Changing the use of land from pasture\
    \ to cultivation area results in the greatest loss of soil organic carbon. Soil\
    \ organic matter plays an important role in creating soil organic carbon. In drought\
    \ regions and during fire events, soil carbon is returned to the atmosphere as\
    \ carbon dioxide, which affects directly the global warming and climate change\
    \ process ([Lehmann et al., 2015](#ch2.xhtml#ref2_24)). Due to limited land and\
    \ water resources, environmental planning will increasingly constrain the release\
    \ of resources for cultivation purposes ([Fischer et al. 2010](#ch2.xhtml#ref2_6);\
    \ [Molden et al. 2007](#ch2.xhtml#ref2_18)).\n\n## 2.7 Preventing and Restoring\
    \ Degraded Soils\n\nProtecting and restoring the quality of degraded soils is\
    \ a challenging task; the restoration of soil quality is a complicated task that\
    \ necessitates a coordinated approach. There are many basic procedures to prevent\
    \ land degradation that are described as follows ([Dragović and Vulević 2020](#ch2.xhtml#ref2_4)):\n\
    \n* Human-induced degradation develops more rapidly than natural degradation and\
    \ can be reduced or avoided by regulating human interventions such as deforestation,\
    \ overgrazing, and the mismanagement of agricultural land.\n* In order to prevent\
    \ soil degradation, it is necessary to monitor and assess soil degradation processes\
    \ using appropriate methods (for example, expert-based, remote sensing, modeling…).\n\
    * It is necessary to close data gaps, enable access to data and data comparability,\
    \ gather more on-the-ground information, and take into account the uncertainty\
    \ of the future.\n* Soil erosion is the most widespread form of soil degradation.\
    \ Soil erosion control measures include the selection of optimal land use, the\
    \ maintenance of a protective cover (trees, mulches, and crops), and the construction\
    \ of technical works (e.g., dams).\n* Soil contamination is the chemical degradation\
    \ of soil that involves the presence of harmful substances in the soil. Remediation\
    \ choices include a variety of chemical and physical treatments of soil, based\
    \ on the degradation conditions.\n* Salinization is a widely present type of chemical\
    \ soil degradation that occurs in both arid and semi-arid areas. The expansion\
    \ of salt-affected soil could be reduced by applying appropriate irrigation practices,\
    \ the better use of fertilizers, or changes in land use.\n* Degradation-type identification\
    \ is important to define all consequences and, thus, the expected required actions\
    \ and cost of restoration.\n* It is essential to be aware that several degradation\
    \ processes may occur simultaneously in the same area.\n* The spatial extent,\
    \ degree, and rate of degradation type should be a base for the decision-making\
    \ process regarding the best sustainable land management practice.\n\nConsidering\
    \ the technological advances that have been made in recent years, most types of\
    \ soil degradation are potentially reversible, as long as there is sufficient\
    \ public support, understanding, and political will ([Lal 2015](#ch2.xhtml#ref2_14)).\n\
    \nTo achieve the target goal, some strategies were developed for soil quality\
    \ restoration, which includes: (i) creating a positive soil/ecosystem; (ii) reducing\
    \ soil erosion; (iii) improving the availability of fertilizers; and (iv) increasing\
    \ soil biodiversity especially the microbial processes ([Lal 2015](#ch2.xhtml#ref2_14)).\
    \ The ultimate goal should be to adopt a holistic and integrated approach to soil\
    \ resource management ([Figure 2.12](#ch2.xhtml#fig2_12)).\n\n![Figure 2.12 Three\
    \ strategies of restoring and managing soil quality for mitigating risks of soil\
    \ degradation (Lal 2015).](images/fig2_12_B.jpg)\n\n[Figure 2.12 Three strategies\
    \ of restoring and managing soil quality for mitigating risks of soil degradation](#ch2.xhtml#R_fig2_12)\
    \ ([Lal 2015](#ch2.xhtml#ref2_14)).\n\n## 2.8 Conclusion\n\nSoil degradation is\
    \ a serious threat to water resources and sustainable agriculture. It could occur\
    \ as a natural process or cause by human intervention. The mismanagement practice\
    \ in agriculture led to soil degradation in terms of salinity and nutrient transportation,\
    \ which in turn caused an increase in water demand and a decrease in land productivity.\
    \ The excess irrigation water puts more pressure on the available water resources,\
    \ especially in water scarcity regions. To emerge from this vicious cycle, it\
    \ is extremely important to adopt strategies and techniques that aim to prevent\
    \ and restore degraded soil to ensure soil sustainability. Moreover, under climate\
    \ change scenarios of increased climatic variability with more extremes of precipitation,\
    \ soil functions will be stressed and better soil management will be required\
    \ to achieve water and food security.\n\n### Recommendations\n\nSustainable soil\
    \ management is a key solution for soil degradation. In this regard, an improved\
    \ understanding of soils and agronomic processes which enhance water use efficiencies\
    \ is extremely critical.\n\nLong-term actions include improving agriculture and\
    \ water management practices, such as adopting proper crop rotation, enhancing\
    \ soil drainage, improving irrigation efficiencies, using crops which are suitable\
    \ for the climate, and capacity building for farmers. Farming practices can be\
    \ employed to improve soil quality and increase soil carbon, including optimal\
    \ fertilization and animal manure application. Efficient water management, along\
    \ with better fertilizer use and improved crop varieties, could significantly\
    \ reduce agricultural effects.\n\n## References\n\n* Amundson, R., Berhe, A.,\
    \ Hopmans, J., Olson, C., Sztein, A., and Sparks, D. ([ch2.xhtml#ref2_1]) (2015).\
    \ “Soil and human security in the 21st century.” Science, 348(6235), 126071.\n\
    * Bekunda, M., Sanginga, N., and Woomer, P. L. ([ch2.xhtml#ref2_2]) (2010). “Restoring\
    \ soil fertility in sub-Sahara Africa.” Advances in Agronomy, 108, 183–236.\n\
    * Donn ([ch2.xhtml#ref2_3]) (2019). “Ancient Mesopotamia.” [https://mesopotamia.mrdonn.org/geography.html](https://mesopotamia.mrdonn.org)\
    \ (Nov. 3). \n* Dragović, N., and Vulević, T. ([ch2.xhtml#ref2_4]) (2020). “Soil\
    \ Degradation Processes, Causes, and Assessment.” In Life on Land, Springer, 928–939.\n\
    * FAO ([ch2.xhtml#ref2_5]) (2017). The Future of Food and Agriculture – Trends\
    \ and Challenges. FAO, Rome.\n* Fischer, M., Bossdorf, O., Gockel, S., Hänsel,\
    \ F., Hemp, A., Hessenmöller, D., Korte, G., Nieschulze, J., Pfeiffer, S., and\
    \ Prati, D. ([ch2.xhtml#ref2_6]) (2010). “Implementing large-scale and long-term\
    \ functional biodiversity research: The biodiversity exploratories.” Basic and\
    \ Applied Ecology, 11(6), 473–485.\n* Gobinath, R., Ganapathy, G. P., Gayathiri,\
    \ E., Salunkhe, A. A., and Pourghasemi, H. R. ([ch2.xhtml#ref2_7]) (2022). “Ecoengineering\
    \ practices for soil degradation protection of vulnerable hill slopes.” Computers\
    \ in Earth and Environmental Sciences, 255–270.\n* Hillel, D., Braimoh, A. K.,\
    \ and Vlek, P. L. G. ([ch2.xhtml#ref2_8]) (2008). “Soil Degradation Under Irrigation.”\
    \ Land Use and Soil Resources, edited by Hamid Reza Pourghasemi, Springer, 101–119.\
    \ Amsterdam: Elsevier.\n"
