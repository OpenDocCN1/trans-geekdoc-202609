    # 第 4 章 不同遮照率下光伏系统行为的建模与仿真


    Mohammed Benchrifa


    摩洛哥拉巴特 穆哈默德五世大学


    摩洛哥肯尼特拉伊本·托法尔大学—肯尼特拉校区


    Jamal Mabrouki 和 Fatine Drhimer


    摩洛哥拉巴特摩穆哈默德五世大学


    DOI: [10.1201/9781003436218-4](https://dx.doi.org/10.1201/9781003436218-4)


    ## 4.1 引言


    近年来，世界对能源的需求在所有领域都显著增长，包括工业、农业、交通……[[1, 2 和 3]。遗憾的是，这些大部分能源来自化石燃料，对环境具有非常有害的影响。因此，为了尽量减少污染对环境的影响，可再生能源是理想的解决方案。因此，多个国家已经在可再生能源领域投入了巨资[4,
    5]。根据定义，可再生能源是指从理论上无限、无时间限制或再生速度快于消耗速度的或资源产生能量的方法。


    可再生能源通常被认为与化石燃料能源对立，后者的储量有限且在人类尺度上是不可再生的[6, 7]。这种新型能源包括风能（来自风力）、潮汐能（来自波浪和潮汐运动）和太阳光伏能。这种光伏能是指利用半导体材料将阳光直接转化为电能。


    光电效应最初由 E. Becquerel 在 1839 年发现的[8, 9]，他发现某些材料在光照下会产生少量的电。随后，在 1912 年，阿尔伯特·爱因斯坦解释了光电效应[10]，但直到
    2 世纪 50 年代初，它才在硅光伏（PV）电池中投入应用，其效率水平为 4.5%[11, 21]。


    光伏在许多国家的发电占比中已不再处于边缘地位，其用量继续快速增长。然而，这种电力往往具有高度波动性和分散性的特点，这在尝试将这种发电整合到电网时可能会导致问题。因此，理解光伏组件在不同条件下的行为变得越来越重要，以确保生产的可靠性并促进其并入电网[12,
    13]。


    一个光伏系统由几个部分组成：串联并的光伏组件；将组件直流能转换为交流能的逆变器；一套布线系统；以及电池或传输网络[16, 17, 18, 19, 20, 21]。


    在光伏技术中，很明显组件并不一定能保持其初始性能。某些组件在长时间运行时可能会降化甚至失效。多项研究发现，光伏系统的可靠性高度取决于用于制造光伏组件的材料、温度、湿度和太阳辐射[23,
    24, 25]。


    在此背景下，我们可以注意到光伏发生器常见的缺陷是遮照故障[26, 27, 28, 29, 30, 31]。遮照故障通常由多种原因引起，例如鸟粪、灰尘、雪以及植被和电缆等障碍物……事实上，在本章中，我们特别关注遮照对光伏组件性能的影响。为了可视化这种影响，我们通过改变
    10%到 100%的遮照率对组件的行为进行了多次仿真。


    ## 4.2 材料与方法


    ### 4.2.1 MATLAB/Simulink 介绍


    Simulink 是一种用于多域仿真和建模设计的框图环境。它支持系统级设计与仿真、自动代码生成以及嵌入系统的持续测试与验证[32]。


    ### 4.2.2 PVSyst 介绍


    PVSyst 软件是一种用于离网和并网光伏系统的仿真和计算软件。它由日内瓦大学建立，A. Mermoud 设计。PVSyst 软件有多个输入参数：每月平均太阳辐射、每月平均温度、能量需求、光伏组件的选择及其倾角、电池的选择、充电控制器、逆变器的选择、自持天数输入、太阳覆盖率以及投资成本（材料采购、系统安装成本）。仿真的主要结果是所需的场功率。仿的主要结果是所需的场强、存储容量、组件在特定条件下的特性以及每千瓦时（kWh）的成本[33]。


    ## 4.3 结果与讨论


    ### 4.3.1 太阳能电池特性


    '
- fmt: '

    Under a given illumination, a PV cell is characterized by a current-voltage curve
    (`I-V`), representing the set of electrical configurations that the cell can take.
    Three physical quantities define this curve. The first quantity is the open-circuit
    voltage `Vco`; this value represents the voltage generated by an illuminated cell
    that is not connected. The second quantity is the short-circuit current `Icc`;
    this value represents the current generated by an illuminated cell that is connected
    to itself. The third quantity is the maximum power point (`PMPP`) obtained for
    an optimal voltage and current: `Vopt`, `Iopt` (sometimes also called `Vmpp`,
    `Impp`).


    We can also draw a characteristic curve representing the power as a function of
    the voltage. In this case, the maximum power reached for the voltage `Vmp` can
    be clearly observed in the ([Figure 4.1](#ch4.xhtml#fig4_1)).


    ![Figure 4.1 Current-voltage and power-voltage characteristic curves of a PV cell.](images/fig4_1_B.jpg)


    [Figure 4.1 Current-voltage and power-voltage characteristic curves of a PV cell.](#ch4.xhtml#R_fig4_1)


    ### 1. Shading effect on photovoltaic panels


    Shade is the first enemy of a photovoltaic installation. A shaded cell will limit
    the generated power. It is therefore imperative to choose a location that is as
    free as possible from shadows caused by the environment.


    When a part of a photovoltaic unit is shaded, this under-irradiated part of the
    module can become inversely polarized. This means that the under-irradiated part
    behaves not as an electrical generator but as a receiver (resistance). The under-irradiated
    part will therefore behave as a receiver by dissipating a certain amount of power
    as heat, which will cause a rise of temperature in the under-irradiated area.
    This is the reverse self-polarization effect. This local heating can lead to hot
    spots which can damage the affected area and permanently degrade the performance
    of the photovoltaic module.


    There are two types of shading: full shading and partial shading. Full shading
    prevents all radiation (direct and indirect) from reaching any part of the PV
    cell (e.g. bird droppings, tree branches on the panel, a cover). By contrast,
    partial shading prevents only direct radiation from reaching a part of the photovoltaic
    cell (e.g. a cloud).


    Often the cells of a photovoltaic module are connected in series. Thus, the weakest
    cell will determine and limit the power of the other cells. Shading half of one
    cell or half of a cell row will decrease the power in proportion to the percentage
    of a cell’s shaded area, in this case by 50%. The total shading of a cell row
    can reduce the power of the module to zero.


    There are also three different shading configurations. The first configuration
    is single-cell shading, in which the procedure adopted ensures that only one solar
    cell of the module is shaded. The hidden part of the cell represents the shading
    rate. The second configuration is vertical shading (for N cells); in this case
    the shading is parallel to each shaded cell. The third configuration is perpendicular
    or horizontal shading (for N cells); in this pattern the procedure consists of
    shading the cells of the module with a single cell surface equivalent cover, so
    that the shading pattern is perpendicular to all cells, thus ensuring the same
    shading rate.


    ### 2. Shading influence of on the optimal PMPP power simulation.


    In order to illustrate the influence of shading on the behavior of a photovoltaic
    device, we will choose a model of 36 silicon-polycrystalline cells with a peak
    power of 60 W. We fix the cell temperature at 30°C. We assume that a cell is shaded
    by a percentage `p`. We determine the maximum power `PMPP` by changing the shading
    percentage by a step of 10%. The graphs we obtained are the following ([Figure
    4.2](#ch4.xhtml#fig4_2)).


    ![Figure 4.2 The variation of current as a function of voltage with an illuminance
    of 1000 W/m2 and a shading rate of (a) 10%, (b) 20%, (c) 30%, (d) 40%, (e) 50%,
    (f) 60%, (g) 70%, (h) 80 %, (i) 90%.](images/fig4_2a_B.jpg)


    [Figure 4.2 The variation of current as a function of voltage with an illuminance
    of 1000 W/m² and a shading rate of (a) 10%, (b) 20%, (c) 30%, (d) 40%, (e) 50%,
    (f) 60%, (g) 70%, (h) 80 %, (i) 90%.](#ch4.xhtml#R_fig4_2)


    For each shading rate ([Figure 4.2](#ch4.xhtml#fig4_2)) there is a corresponding
    maximum power, after having determined these maximum powers for shading rates
    between 0% and 100%. The curve representing this variation is then drawn.


    The ([Figure 4.3](#ch4.xhtml#fig4_3)) shows that in the absence of shading the
    PMPP is equal to the peak power of the module used (60 W). While this PMPP decreases
    as function of shading rate, it tends towards 0 for shading rate of 100%.


    ![Figure 4.3 Maximum power (PMPP) variation.](images/fig4_3_B.jpg)


    [Figure 4.3 Maximum power (PMPP) variation.](#ch4.xhtml#R_fig4_3)


    The general shape of the `I(V)` and `P(V)` characteristics of the photovoltaic
    panel shows significant deformations with increasing shading rate, which implies
    their non-uniformity. Indeed, the reduction of the short-circuit current of the
    shaded cell is evident and the generated current has decreased with the increase
    of shading rate \[[34](#ch4.xhtml#ref4_34), [35](#ch4.xhtml#ref4_35), [36](#ch4.xhtml#ref4_36),
    [37](#ch4.xhtml#ref4_37) and [38](#ch4.xhtml#ref4_38)]]. There is another effect
    due to the shading, that of the displacement of the maximum power point to lower
    voltage values \[[39](#ch4.xhtml#ref4_39), [40](#ch4.xhtml#ref4_40), [41](#ch4.xhtml#ref4_41)
    and [42](#ch4.xhtml#ref4_42)\]. An increase in the shading rate causes a power
    reduction that is dissipated as heat. This effect must be taken into consideration,
    in the case of a system connected to a maximum power point tracking inverter,
    since it can cause a bad exploitation of the photovoltaic system \[[43](#ch4.xhtml#ref4_43),
    [44](#ch4.xhtml#ref4_44) and [45](#ch4.xhtml#ref4_45)]].


    ### 4.4 Conclusion


    The performance of a PV array is strongly influenced by climatic conditions, particularly
    solar irradiation. In this study, we used Matlab Simulink to simulate the operation
    of PV modules under different shading conditions. The main advantage of this model
    lies in its simplicity and ease of implementation, based on the technical specifications
    provided by the manufacturer. The result of this study showed that the generated
    current decreases as the shading rate increases, and that the PMPP drops from
    60 W for 0% to 10 W for 90%. From this we can conclude that the shaded cell will
    limit the power generated by the whole panel and thus reduce its efficiency. Therefore,
    by this paper we were able quantify and visualize the effect of shading on a photovoltaic
    panel under standard conditions of temperature and radiation


    ## References


    1. [Shahzad, Umair](#ch4.xhtml#R_ref4_1) The need for renewable energy sources.
    Energy, 2012, vol. 2, pp. 16–18.

    2. [Prieto, Pedro A., Hall, Charles AS, and Melgar, Rigoberto](#ch4.xhtml#R_ref4_2).
    Spain’s photovoltaic revolution: The energy return on investment. New York: Springer,
    2013.

    3. [Franzitta, Vincenzo, Curto, Domenico, Rao, Davide, et al.](#ch4.xhtml#R_ref4_3)
    Hydrogen production from sea wave for alternative energy vehicles for public transport
    in Trapani (Italy). Energies, 2016, vol. 9, no 10, p. 850.

    4. [Mekhilef, Saidur, Saidur, Rahman, and Safari, Azadeh](#ch4.xhtml#R_ref4_4).
    A review on solar energy use in industries. Renewable and Sustainable Energy Reviews,
    2011, vol. 15, no 4, pp. 1777–1790.

    5. [Kamalapur, G. D. and Udaykumar, R. Y.](#ch4.xhtml#R_ref4_5) Rural electrification
    in India and feasibility of photovoltaic solar home systems. International Journal
    of Electrical Power & Energy Systems, 2011, vol. 33, no 3, pp. 594–599.

