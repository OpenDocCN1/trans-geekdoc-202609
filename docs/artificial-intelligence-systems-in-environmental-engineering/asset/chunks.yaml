  raw: 'Declining soil quality has significant implications for the development of
    future agricultural and water resources. Furthermore, it has great impacts on
    human health and ecosystem services. [Figure 2.7](#ch2.xhtml#fig2_7) illustrates
    the relationship between soil degradation and water; agriculture; and human activity
    and the ecosystem.


    ![Figure 2.7 Relationship between soil degradation and water; agriculture; and
    human activity and the ecosystem.](images/fig2_7_B.jpg)


    [Figure 2.7 Relationship between soil degradation and water; agriculture; and
    human activity and the ecosystem.](#ch2.xhtml#R_fig2_7)


    ## 2.3 Historical Evidence


    In Mesopotamia during the Bronze Age (4000–1100 BC) urban centers were focused
    in the cities of Sumer and Acad ([Figure 2.8](#ch2.xhtml#fig2_8)). The population
    of these cities was between 50,000 and 80,000, and about 90% of the population
    lived in such areas. At the beginning of the development of these kingdoms, almost
    half of the population worked in the large irrigated farms surrounding each city.
    As modern methods and tools developed during the time of the Sumerians, Mesopotamia
    witnessed major development in irrigated agriculture, with just 1% of the community
    able to feed the rest of the population. Encouraging farmers to focus on effective
    water management, in one panel, it was stated that the yield could be increased
    by 10% with optimal irrigation management ([Mays 2010](#ch2.xhtml#ref2_16)). Ancient
    farmers also used various means to irrigate their land, including Shadouf, waterwheel
    (Noira), irrigation canals, and dams.


    ![Figure 2.8 Location of Ancient Kingdoms in Mesopotamia (Donn 2019).](images/fig2_8_B.jpg)


    [Figure 2.8 Location of Ancient Kingdoms in Mesopotamia](#ch2.xhtml#R_fig2_8)
    ([Donn 2019](#ch2.xhtml#ref2_3)).


    One of the main causes for the deterioration of Sumerian civilization was the
    decline in agricultural production. Some pieces of evidence were found in cuneiform
    records indicating the extent of the salinization of agricultural soil. It was
    reported, for example, that the wine production of cereals in 2400 BC was 2347
    liters per hectare, but the level of production had dropped to 897 liters per
    hectare in 1700 BC. Another indicator of soil salinization is the high proportion
    of barley areas, to more than 98% of the total grain planted in 2050 BC. Barley
    is known to be a salt-tolerant crop and is often the first crop used to restore
    saline desert soils for agriculture. The problem of silt deposition in many channels
    was widespread and influential, as it was easier to abandon some of these channels
    and construct new ones ([Mays 2010](#ch2.xhtml#ref2_16)).


    ## 2.4 Soil Degradation and Water Security


    Of all the major human activities, agriculture remains the largest user of water
    at the global level, accounting for about 70% of total freshwater withdrawal ([Hillel
    et al. 2008](#ch2.xhtml#ref2_8)). Moreover, the agricultural sector is the largest
    source of freshwater withdrawal and water is a major constraint to food production
    in most irrigated projects all over the world.


    Whereas agriculture is the largest consumer of water, the pressure on water resources
    will be exacerbated by soil degradation and severe drought stress resulting from
    the projected climate change. Water scarcity is aggravated by soil challenges
    and non-point and point source pollutions ([Lal 2008](#ch2.xhtml#ref2_12)). Water
    and soil relation depends upon different parameters, such as the rate of infiltration
    into the soil and on soil hydraulic conductivity that redistributes water through
    the soil. Similarly, water content and transmission times are also important to
    the function of soil because the contact with soil surfaces and residence time
    in soil are considered to be contamination controls ([Montanarella et al. 2015](#ch2.xhtml#ref2_19)).
    [Figure 2.9](#ch2.xhtml#fig2_9) describes the different roles of soil and their
    impacts on water availability.


    ![Figure 2.9 Soil and the water cycle (Montanarella et al. 2015).](images/fig2_9_B.jpg)


    [Figure 2.9 Soil and the water cycle](#ch2.xhtml#R_fig2_9) ([Montanarella et al.
    2015](#ch2.xhtml#ref2_19)).


    In dry regions, inadequate soil moisture can be mitigated through supplementary
    irrigation, and where excessive precipitation causes problems, waterlogging can
    be relieved by land drainage. Irrigation that enables a shift to intensive land
    use can increase the contaminant load of runoff and drainage water. However, irrigation
    and drainage can have consequences for water regulation services ([McDowell et
    al. 2015](#ch2.xhtml#ref2_17)).


    Furthermore, an appropriate drainage system of soil will reduce water and contaminant
    storage capacity in the landscape; however, it will increase the potential floods
    downstream. Irrigation of agricultural lands accounts for about 70% of ground
    and surface water withdrawals, and in some regions competition for water resources
    is forcing irrigators to tap unsustainable sources ([Montanarella et al. 2015](#ch2.xhtml#ref2_19)).
    The abstraction of surface and groundwater for irrigation introduces some changes
    to the natural water cycle and may stress downstream ecosystems and communities.
    This will affect water security in terms of water availability and a great amount
    of water consumption to deal with soil degradation challenges ([Figure 2.10](#ch2.xhtml#fig2_10)).


    ![Figure 2.10 Soil degradation and water security.](images/fig2_10_B.jpg)


    [Figure 2.10 Soil degradation and water security.](#ch2.xhtml#R_fig2_10)


    ## 2.5 Soil Degradation and Food Security


    The Green Revolution is needed to feed the growing global population, and this
    must be based on sustainable management of soil and water resources ([Lal 2009](#ch2.xhtml#ref2_13)).
    Despite substantial investment in irrigation projects in the past decades, global
    irrigated lands are facing difficult situations. Irrigation plays a major role
    in providing food for the growing population, contributing over 40% to total agricultural
    production. Average cereal yields under irrigation are typically twice those obtained
    under rain-fed conditions ([Hillel et al. 2008](#ch2.xhtml#ref2_8)).


    Soil degradation is one of the main factors affecting the sustainability of irrigated
    agriculture. Soil salinity results in the tendency to apply water in excess of
    irrigation requirements. This may also lead to waterlogging problems, which lead,
    in turn, to reduced aeration, nutrient uptake, and crop yields. Salinity hazards
    will increases if saline water is used for irrigation and when poor fertilizer
    and poor irrigation management are combined. All these forms of degradation directly
    affect the agricultural productivity and food production.


    Furthermore, continuous cultivation of land results in low and declining crop
    yields and an inability to attend to other farm production constraints, and eventually
    to food deficits, low incomes, and food security challenges ([Figure 2.11](#ch2.xhtml#fig2_11)).


    ![Figure 2.11 Soil degradation and food security.](images/fig2_11_B.jpg)


    [Figure 2.11 Soil degradation and food security.](#ch2.xhtml#R_fig2_11)


    Because of the complex causes of low crop yields and their far-reaching effects,
    to ensure food security, no simple intervention is likely to overcome yield limitations,
    uplift households, and restore soil fertility. Rather than that, an integrated
    approach involving access to farm inputs, technologies to ensure their efficient
    use, land conservation measures, and improved social awareness ([Bekunda et al.
    2010](#ch2.xhtml#ref2_2)).


    ## 2.6 Soil Degradation and Environmental Impacts'
