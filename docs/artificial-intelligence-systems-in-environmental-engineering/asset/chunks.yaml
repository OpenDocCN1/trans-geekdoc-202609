    ## 9.3.1.1 Receiving Milk Method


    Milk reception takes place in several stages. Before the tanks are emptied, a
    sample is taken for physicochemical and microbiological analyses in the laboratory,
    as well as rapid tests for acidity, fat content, density and `pH`.


    The acceptance stages are as follows:


    *   **Degassing**: The milk passes through a degasser to eliminate odors and gas
    bubbles present in the milk.

    *   **Filtration**: The milk passes through two cylindrical metal filters with
    pores of increasing diameter to retain unwanted suspended matter such as shavings,
    plumules, etc. It is important to clean these filters regularly to maintain their
    efficiency.

    *   **Cooling**: Before being stored, milk is cooled to `4°C` by passing through
    plate heat exchangers, where it is cooled using chilled water in a counter-current.
    The purpose of this cooling is to stop microbial activity.

    *   **Storage**: Depending on the state of the milk and the company’s activities,
    milk may be stored or directly processed.


    **Thermization or pre-pasteurization**: This is a less intense heat treatment
    applied to raw milk for around 15 seconds at temperatures between 83 and 88°C.
    The aim of this treatment is to destroy the milk’s pathogenic bacteria and a large
    proportion of its common bacterial flora, albeit less intensively than during
    pasteurization. These various stages guarantee the quality and safety of the milk
    prior to storage or further processing.


    ## 9.4 Results and Discussion


    ### 9.4.1 Physical and Chemical Analysis of Milk


    The three [Figures 9.3](#ch9.xhtml#fig9_3), [9.4](#ch9.xhtml#fig9_4) and [9.5](#ch9.xhtml#fig9_5)
    present the results of the analyses for four samples at the three positions determined,
    Raw milk, Thermized milk; Thermized milk after one hour, such as `AC`, `MG`, `TP`,
    `EST`, `T`, `TA`.


    ![Figure 9.3 Results of physicochemical analysis of raw milk.](images/fig9_3_B.jpg)


    [Figure 9.3 Results of physicochemical analysis of raw milk.](#ch9.xhtml#R_fig9_3)


    ![Figure 9.4 Results of physicochemical analysis of thermized milk after one hour.](images/fig9_4_B.jpg)


    [Figure 9.4 Results of physicochemical analysis of thermized milk after one hour.](#ch9.xhtml#R_fig9_4)


    ![Figure 9.5 Number of CFUs present in samples of raw milk and heat-treated milk
    after one hour.](images/fig9_5_B.jpg)


    [Figure 9.5 Number of CFUs present in samples of raw milk and heat-treated milk
    after one hour.](#ch9.xhtml#R_fig9_5)


    The physicochemical analysis of raw milk shows that `SAFILIAT’s raw milk meets
    standards for all the criteria analyzed. All four samples remained stable in terms
    of `AC`, `pH`, `MG`, `TP`, `EST` and `T`. The `P2` sample was unstable in terms
    of `TA`. During the storage phase (thermization after one hour), the `TA` analysis
    value decreases to `76%`, despite the fact that it poses a threat to the stability
    of this `P2` variety, but is within the company’s quality standards.


    ### 9.4.2 Microbiological Analysis of Milk


    The test was carried out on four samples of raw milk thermized at `84°C` for 15
    seconds, with the aim of determining the number of `CFU` present in the samples
    of raw milk and thermized milk after one hour. The results obtained are shown
    in the following table:


    The products analyzed are of satisfactory bacteriological quality (the identification
    threshold is `3 × 104`), and are therefore declared fit for consumption according
    to company standards. The results also show that thermization was effective in
    reducing `FMAT`, with `99.99%` reduction in the original `LES ETABLES` sample,
    `99.98%` reduction in `2 P2` and `P3` samples and even a `99.97%` reduction in
    the `P4` sample.


    ## 9.5 Conclusion


    Thermal processing is a short-term, temporary conservation method that can be
    followed by pasteurization. Its purpose is to destroy undesirable micro-organisms
    while preparing the substrate for the growth of beneficial micro-organisms. The
    values analysed for all samples comply with the company’s standards, with the
    exception of the `P2` sample which slightly exceeds these standards, despite similar
    storage conditions and treatments. To guarantee the stability of raw milk, several
    factors need to be taken into consideration. Internal factors include storage
    conditions, which play a crucial role. Inappropriate storage temperatures, particularly
    warm ones, can encourage the growth of alcohol-producing micro-organisms, leading
    to an increase in the amount of alcohol in the milk. Furthermore, raw milk naturally
    contains lactic acid bacteria, which can cause fermentation. If raw milk is not
    stored correctly, this can lead to contamination and an increase in the alcohol
    content of the milk.


    External factors, such as external contamination, can also influence the alcohol
    content of raw milk. If milk is exposed to environments containing alcohol-producing
    yeasts or bacteria, external contamination can occur, leading to an increase in
    the alcohol content of raw milk.


