    # Chapter 2 Impact of Agricultural Soil Degradation on Water and Food Security


    Ahmed Elshaikh, University of Khartoum, Sudan Jamal Mabrouki, University in Rabat,
    Morocco DOI: [10.1201/97810346218-2](https://dx.doi.org/10.1201/97810346218-2)


    ## 2.1 Introduction


    Soils in good conditions are necessary to support agricultural, biological, and
    environmental systems, and threats to soil resources are considered threats to
    human security (Amund et al. 2015). The rapid population growth and the high consumption
    rates of individuals have led to an increase in demand for agricultural products,
    which places heavy pressure on natural resources, contributing to the disruption
    of ecosystems and their degradation in various forms (FAO 2017). The most important
    aspect of the future population dynamics is the fact that the majority will be
    in developing countries (South Asia and sub-Saharan Africa). In these regions,
    healthy soils are limited, vulnerable to natural and anthropogenic variables,
    and degraded through the increase in demographic pressure and the hazards of climate
    change. Thus, any future increase in food production will have to occur through
    vertical increase through the resources already committed to agriculture production
    per unit area in terms of nutrients, water, etc. (Lal 2008). From many factors
    threatening soils, unsustainable agricultural production is arguably one of the
    largest (Kopittke et al. 2019). Efforts conducted to improve the sustainability
    of agricultural soil must not only incorporate biological and agronomic knowledge,
    but also consider the human dimension in the agricultural production process (Lal
    2008). Recently, there has been a renewed effort to analyze the economic dimensions
    of soil health in the agricultural context and to better integrate insights from
    the social sciences into ongoing policy discussions about soil management (Kik
    et al. 2021; Jesus et al. 2021). These include the exploitation of fragile and
    unstable environments in which the dynamic balance between their components is
    irreversible, or in a way that does not allow for great flexibility in dealing
    and responding to investment methods (FAO 2017).


    ## 2.2 Soil Degradation


    Soil degradation could be defined in broad terms as the functional, physical,
    and biological decline in soil quality. This may appear in terms of loss of soil
    biodiversity, a decline in soil fertility (organic matter and structural condition),
    erosion, adverse changes in salinity, acidity or alkalinity, and the effects of
    toxic chemicals, pollutants, or excessive flooding (Nunes et al. 2020). Moreover,
    soil degradation causes include unsustainable agricultural practices; overgrazing;
    agricultural, industrial, and natural pollution; and long-term impacts of climatic
    change (Maximillian et al. 2019).


