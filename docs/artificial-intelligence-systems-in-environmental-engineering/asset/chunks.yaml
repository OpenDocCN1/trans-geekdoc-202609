    The Issen basin is an important watershed in the Souss catchment, and a tributary
    of the Souss Wadi in the central western part of Morocco ([Ait Haddou et al.,
    2023](#ch1.xhtml#ref1_1)). The study area, the Issen catchment, is a dry zone
    of the downstream section of the Souss that covers about 1300 ha and extends over
    60 km in length and 35 km in width ([Ait Haddou et al., 2022a](#ch1.xhtml#ref1_2)).
    The proposed study basin has a perimeter of 218.17 km, an drainage density of
    0.85km^−ˡ and a 63 km length of the main river through it. Between the following
    latitudes and longitudes, in width and with a NE-SW direction, respectively, are
    30°64 and 31°07 North and 8.72° and 9.31° West ([Figure 1.1](#ch1.xhtml#fig1_1)).
    It is the largest sub-basin of the southern edge of the Western High Atlas (WHA),
    which drains the Southern Atlas furrow. At the outlet of this oued, Abdelmomen
    dam was installed to ensure drinking water supply to about one million persons
    of the Agadir metropolis, which presents several environmental challenges. Geologically,
    the Issen basin can be divided into three different zones. It is bounded to the
    east by the Palaeozoic massif or ancient block of the High Atlas and to the west
    by the Jurassic and Cretaceous plateaus ([Figure 1.2](#ch1.xhtml#fig1_2)). The
    tectonics, lithology, and external geodynamics characteristics of the Issen catchment
    indicate a strongly contrasted morphology ([Ait Haddou et al., 2022b](#ch1.xhtml#ref1_4)).


    ![Figure 1.1 Location of the Issen Wadi in west central Morocco and its landscape
    of the Issen river drainage basin.](images/fig1_1_B.jpg)


    [Figure 1.1 Location of the Issen Wadi in west central Morocco and its landscape
    of the Issen river drainage basin.](#ch1.xhtml#R_fig1_1)


    ![Figure 1.2 Simplified geological map and samples localization of Issen basin,
    extracted from Geological map of Argana corridor (1/100,000) (Tixeront, 1974).](images/fig1_2_B.jpg)


    [Figure 1.2 Simplified geological map and samples localization of Issen basin,
    extracted from Geological map of Argana corridor (1/100,000)](#ch1.xhtml#R_fig1_2)
    ([Tixeront, 1974](#ch1.xhtml#ref1_16)).


    The climate of the study area is warm and dry, with the mean annual temperature
    being approximately 21.85°C, The Issen watershed receives an average annual rainfall
    of 302 mm in the central parts, and the annual evaporation is 2278 mm/year. The
    average rainfall erosivity is about 537.64 MJ.mm/ha.h.yr for the whole basin ([Ait
    Haddou et al., 2020](#ch1.xhtml#ref1_3), [Ait Haddou et al., 2022b](#ch1.xhtml#ref1_4))
    ([Figure 1.3](#ch1.xhtml#fig1_3)). The monthly and seasonal distribution of flows
    is essentially conditioned by the winter rainfall that are dependent on the Mediterranean
    climatic conditions, and by their physical stationary of a torrential nature.
    In addition, the correlation between the calculated interannual means of streamflow
    1981–2013 is approximately 70%. The tributaries of the Issen wadi are ephemeral,
    with an average of several flows per year, mainly in the winter and Automn seasons
    (September–February). Other results emphasize that the groundwater resources are
    very limited in the Argana basin ([Ait Haddou et al., 2023](#ch1.xhtml#ref1_1)).
    Commonly, lithological facies, soil types, climate, and fluvial system are the
    most common parameters impacting the spatial hydrological’ variability.


    ![Figure 1.3 Distribution of the average annual precipitation and rainfall erosivity
    in the Issen basin and the adjacent zones. (data sources: ABH, DREFL; Ait Haddou
    et al., 2020, 2022b.)](images/fig1_3_B.jpg)


    [Figure 1.3 Distribution of the average annual precipitation and rainfall erosivity
    in the Issen basin and the adjacent zones.](#ch1.xhtml#R_fig1_3) (data sources:
    ABH, DREFL; [Ait Haddou et al., 2020](#ch1.xhtml#ref1_3), 2022b.)


    ### 1.2.2 Deposits


    In this study, the main channel of the river Issen was sampled from the confluence
    of the rivers Ait Bkhr and Ait Moussi (Issen) to the Abdelmomen dam. Samples were
    taken over a distance of 3 to 6 km, depending on the location and physical constraints.
    The samples were taken by means of shovel at a depth of 30 cm along the axis of
    the canal. A quantity of approximately 0.5 kg of sediment was taken and placed
    in a plastic bag, which was then labeled and reserved for granulometric and exoscopic
    analyses.


    [Table 1.1](#ch1.xhtml#table_1) shows the location of the samples, their GPS coordinates
    and station characteristics, which are also shown on the map in [Figure 1.2](#ch1.xhtml#fig1_2).


    [Table 1.1 Samples of the Main Course of the Wadi Issen and the Distance Followed
    from the Upstream of Issen Basin to the Downstream Side](#ch1.xhtml#R_table1_1)


    | Samples | Distance in km | Part of the Basin |

    | :--- | --- | :--- |

    | E24 | 12.64 | Upstream part |

    | E22 | 16.71 | |

    | E20 | 22.56 | |

    | E17 | 27.64 | |

    | E14 | 33.10 | Midstream part |

    | E12 | 38.04 | |

    | E25 | 41.65 | |

    | E9 | 43.73 | Downstream part |

    | E7 | 48.37 | |

    | E5 | 54 | |


    ## 1.3 Methods


    The determination of the texture allows the observed material to be given the
    name of a textural class (example: clayey sand, sandy clay, calcareous mud…).
    These textural classes are defined and represented on “texture triangles”. As
    such, the diagram used follows the example of textural description given in [Shepard
    (1954)](ch1.xhtml#ref1_14), while the terminology is taken from [Flemming (2015)](ch1.xhtml#ref1_8).
    The granulometric classifications that have been retained are from [Blott and
    Pye (2001)](ch1.xhtml#ref1_5). Furthermore, [Table 1.2](#ch1.xhtml#table1_2) defines
    all sand classes according to their carbonate content. Scanning electron microscope
    (SEM) analysis is a reference method of morphological and particle size distribution
    ([Lee et al., 2019](#ch1.xhtml#ref1_22); [Bouchriti et al., 2022](#ch1.xhtml#ref1_21)).
    They make it possible to determine the depositional environment of grain, its
    history, and, in some cases, its geographical origin ([Fournier et al., 2012](#ch1.xhtml#ref1_9)).
    The method used is based on exoscoping quartz grains using a scanning electron
    microscope, they were used to determine the morphology (shape, sphericity and
    usur). Sample preparation and SEM imaging are the first, and therefore the most
    important, steps in the study of surface textural observation ([Vos et al., 2014](#ch1.xhtml#ref1_18)).
    In order to carry out this study, four samples of sand were taken along the main
    channel of the Issen, which had already been treated during the granulometric
    study, the majority of grain coatings and adherent particles are removed by a
    sample preparation procedure using a bath of 15% diluted hydrochloric acid (`HCl`)
    and 50 g/l tetrasodium pyrophosphate solutions. They were then rinsed with distilled
    water and dried. The scanning electron microscope used in this study is equipped
    with `SEM-EDS JEOL/EO` manufactured by the Japan Electron Optics Laboratory (JEoL).
    The surface analysis was carried out at the Research Center of the Faculty of
    Science at Ibn Zohr University, Agadir, Morocco. In addition to the surface state,
    we have calculated another parameter describing the shape. This is the sphericity
    of the quartz particles, which allowed us to interpret the evolution of the roundness
    of the particles through the analysis of SEM images.

