  trans: "\n\n在给定的照射下，光伏电池的特性通过电流电压曲线（`I-V`）来描述，该曲线代表了电池可以采取的所有电气配置。三个物理量定义了这条曲线。第一个量是开路电压\
    \ `Vco`；该值代表未连接的受照电池产生的电压。第二个量是短路电流 `Icc`；该值代表自身短路的的受照电池产生的电流。第三个量是在获得最佳电压和电流时得到的最大功率点（`PMPP`）：`Vopt`、`Iopt`（有时也称为\
    \ `Vmpp`、`Impp`）。\n\n我们还可以绘制一条表示功率随电压变化的特性曲线。在这种情况下，可以清楚地观察到电压 `Vmp` 下的最大功率（图\
    \ 4.1）。\n\n![图 4.1 光伏电池的电流电压和功率-电压特性曲线。](img/fig4_1_B.jpg)\n\n图 4.1 光伏电池的电流电压和功率-电压特性曲线。\n\
    \n### 1. 光伏面板的阴影影响\n\n阴影是光伏安装的首要敌人。被遮挡的电池会限制产生的功率。因此，选择一个尽可能不受环境阴影影响的位置至关重要。\n\
    \n当光伏单元的一部分被遮挡时，组件的这部分照射不足区域可能会发生反向极化。这意味着照射不足的部分的行为不像一个发电机，而是一个接收器（电阻）。因此，照射不足的部分将通过耗散某些功率作为热量来充接收器，这将导致照射不足区域温度升高。这就是反自极化效应。这种局部加热可能会导致热点，从而损坏受影响区域并永久性降低光伏组件的性能。\n\
    \n阴影有两种类型：全阴蔽和部分阴蔽。全阴蔽阻隔了所有辐射（直接辐射和间接辐射）到达光伏电池的任何部分（例如鸟粪、电池板上的树枝、覆盖物）。相比之下，部分阴蔽仅阻止直接辐射到达光伏电池的一部分（例如云层）。\n\
    \n通常，光伏组件的电池是串联连接的。因此，最薄弱的电池将决定并限制其他电池的功率。遮挡其中一个电池的一半或一排电池的一半将根据电池阴影面积的百分比按比例降低功率，在本例中降低\
    \ 50%。一排电池的总阴蔽可以将组件的功率降至零。\n\n还有三种不同的阴影配置。第一种配置是单电池阴蔽，采用的程序确保只有组件中的一个太阳能电池被遮挡。电池的隐藏部分代表阴蔽率。第二种配置是垂直阴蔽（对于\
    \ N 个电池）；在这种情况下，阴影与每个被遮挡的电池平行。第三种配置是垂直或水平阴蔽（对于 N 个电池）；在这种模式下，程序由用等于单个电池表面的覆盖物遮挡组件的电池，使得阴影图案垂直于所有电池，从而确保相同的阴蔽率。\n\
    \n### 2. 阴影对最优 PMPP 功率模拟的影响。\n\n为了说明阴影对光伏设备行为的影响，我们选择一个具有 36 个硅多晶电池、峰值功率为 60 W\
    \ 模型。我们将电池温度固定在 30°C。我们假设电池被遮挡了 `p` 百分比。我们通过以 10% 为步长改变阴蔽百分比来确定最大功率 `PMPP`。我们得到的图如下（图\
    \ 4.2）。\n\n![图 4.2 在照度强度为 1000 W/m2 下，电流随电压的变化，阴蔽率分别为 (a) 10%, (b) 20%, (c) 30%,\
    \ (d) 40%, (e) 50%, (f) 60%, (g) 70%, (h) 80 %, (i) 90%。](img/fig4_2a_B.jpg)\n\
    \n图 4.2 在照度强度为 1000 W/m² 下，电流随电压的变化，阴蔽率分别为 (a) 10%, (b) 20%, (c) 30%, (d) 40%,\
    \ (e) 50%, (f) 60%, (g) 70%, (h) 80 %, (i) 90%。\n\n对于每种阴蔽率（图 4.2），在确定了 0% 到 100%\
    \ 之间阴蔽率对应的最大功率后，存在相应的最大功率。然后绘制表示这种变化的曲线。\n\n（图 4.3）显示在没有阴影的情况下，PMPP 等于所用组件的峰值功率（60\
    \ W）。虽然该 PMPP 随着阴蔽率的增加而减少，但在阴蔽率为 100% 时它趋于 0。\n\n![图 4.3 最大功率 (PMPP) 变化。](img/fig4_3_B.jpg)\n\
    \n图 4.3 最大功率 (PMPP) 变化。\n\n`I(V)` 和 `P(V)` 的一般形状显示，由于阴蔽的增加，光伏面板的特性发生了显著畸变。确实，随着阴蔽率的增加，组件的短电流减小（见\
    \ 34）、35）、39 可再生能源的需求。Energy, 2012, vol. 2, pp. 16–18.\n2. Prieto, Pedro A., Hall,\
    \ Charles AS, Melgar, Rigoberto. 西班牙的光伏革命：能量回报率。纽约：Springer, 2013. \n3. Franzitta,\
    \ Vincenzo, Curto, Domenico, Rao, Davide, et al. 用于特拉尼公共交通的替代能源的海波制氢。Energies,\
    \ 2016, vol. 9, no 10, p. 850.\n4. Mekhilef, Saidur, Saidur, Rahman, and Safari,\
    \ Azadeh 工业太阳能利用综述。Renewable and Sustainable Energy Reviews, 2011, vol. 15, no\
    \ 4, pp. 1777–1790.\n5. Kamalapur, G. D. and Udaykumar, R. Y. 印度农村电气和光伏太阳能家庭系统的可行性。International\
    \ Journal of Electrical Power & Energy Systems, 2011, vol. 33, no 3, pp. 594–599.\n\
    \n"
