    ### 10.2.2 Characteristics of the Tested Solar Dryer


    Drying is a way of conserving agricultural produce \[[21](#ch10.xhtml#ref10_21),
    [22](#ch10.xhtml#ref10_22) and [23](#ch10.xhtml#ref10_23)\]. Drying using fossil
    fuels consumes a lot of energy. As the price of oil has been rising in recent
    years and is expected to continue to rise, it is important to develop an energy-free
    drying system: solar drying is one such system. It uses only the energy of the
    Sun, which is free and inexhaustible.


    Solar dryers are generally classified into several categories, depending on the
    heating method or the way they operate. Thus, there are natural dryers, direct
    solar dryers, indirect solar dryers, mixed solar dryers and hybrid solar dryers
    \[[24](#ch10.xhtml#ref10_24), [25](#ch10.xhtml#ref10_25), [26](#ch10.xhtml#ref10_26)
    and [27](#ch10.xhtml#ref10_27)\].


    By definition, natural dryers use the Sun and air directly, whose action is neither
    particularly favoured nor controlled. The product is spread out on racks or placed
    on the ground. These dryers are very cheap, but require regular and sustained
    human intervention: protection or collection of the product in case of rain, frequent
    mixing to avoid overheating of the upper layer and to allow the lower layer to
    dry. This type of dryer is often traditional in farming communities, to address
    the problem of temporary storage of the product while awaiting sale or consumption
    \[[27](#ch10.xhtml#ref10_27), [28](#ch10.xhtml#ref10_28), [29](#ch10.xhtml#ref10_29),
    [30](#ch10.xhtml#ref10_30), [31](#ch10.xhtml#ref10_31) and [32](#ch10.xhtml#ref10_32)\].


    In direct solar dryers, sunlight dries the food directly. This type of dryer requires,
    for example, a wooden or cardboard box with holes at the bottom and top to allow
    cold air to enter from the bottom and hot air to leave from the top. This box
    contains the racks where the food will be dried and is covered with glass to increase
    the greenhouse effect \[[33](#ch10.xhtml#ref10_33), [34](#ch10.xhtml#ref10_34)
    and [35](#ch10.xhtml#ref10_35)\].


    Mixed solar dryers are a combination of direct and indirect dryers. In these dryers,
    the heat required for drying is provided by the action of the Sun’s rays, which
    strike the products in the direct section and heat the air. The heat and water
    vapor transfers are complex and not well known. The mixed solar dryer consists
    of two parts: the lower part is the direct dryer, when the Sun heats the internal
    air of this part, the hot air passes to the drying chamber through holes, that
    is the indirect dryer part. The air, circulating through the fruit and vegetables,
    dehydrates them little by little and comes out of the upper part, loaded with
    water vapor.


    We have chosen the mixed solar dryer because of its advantages and mainly because
    of its characteristic of coupling between direct and indirect solar dryers. This
    coupling will allow us to benefit from the specificity of each of these dryers
    at the same time, namely the conservation of the qualities of the dried agricultural
    product such as its color, flavor, nutritional value (in particular, vitamins
    A and C), as well as reaching high temperatures to dry products that have a high-water
    content such as wood. \[[7](#ch10.xhtml#ref10_7)\]'
