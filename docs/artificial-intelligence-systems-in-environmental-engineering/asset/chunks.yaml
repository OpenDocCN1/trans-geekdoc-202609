    ### 5.3.2 水化学分析


    化学分析结果通过 `Piper` 图和 `Schoeller-Berkaloff` 图进行了说明。后者的结果显示，在大多数采样点水质具有相同的特征，但 `7`、`8`、`10`
    和 `15` 四点除外，这些点在某些化学元素上表现出高值，即点 `7` 的 `Na^+`、`K^+`、`HCO[3]^−`、`CO[3]^−`；点 `8`
    的 `Mg^(2+)`、`Cl^−`；点 `10` 的 `Na^+`、`Cl^−` 以及点 `15` 的 `Mg^(2+)`、`Na^+`、`Cl^−`。`Piper`
    图的结果揭示了两种水地质化学相的出现。其中最重要的是氯硫酸钙镁相，分布在采样点 `1`、`2`、`3`、`4`、`5`、`6`、`8`、`9`、`11`、`12`、`13`、`14`、`15`、`16`、`17`、`18`
    和 `19`，占比 `89.47%`；另一种是氯钠钾相，位于点 `7` 和 `10`，占比 `10.52%`。


    ![图 5.2 Angads 地下 Piper 图](img/fig5_2.jpg)


    ![图 5.3 (a–b): 2020 年 9 月 Angads 地下水的 Schoeller-Berkaloff 图](img/fig5_3.jpg)


    ### 5.4 讨论


    使用 `Piper` 图对分布在 Angads 含水层各采样点的地下水物理化学分析进行表征，揭示了氯硫酸钙镁相的存在，这种相占据了 `89.47%`。这表明了三纪岩化盐岩的渗透和溶解，该结果得到了
    Amrani 研究（Timahdite 和 Almis Guig 摩洛哥中部的地下水化学）以及 Chaoui 研究（北阿尔利亚 Bouchegouf 地区地下水脆弱性，主成分分析
    `PCA`）的证实。`Schoeller-Berkaloff` 图显示，大多数采样点具有相同的特征，但 `7`、`8`、`10` 和 `15` 四点除外。这些点在某些化学参数上具有高值，即点
    `7` 的 `Na^+`、`K^+`、`HCO[3]^−`、`CO[3]^−`；点 `8` 的 `Mg^(2+)`、`Cl^−` 和 `SO[4]^(3−)`；点
    `10` 的 `Na^+`、`Cl^−`以及点 `15` 的 `Mg^(2+)`、`Na^+`、`Cl^−` 和 `SO[4]^(2−)`。这解释了为什么
    Angads 含水层的地下水高度矿化。这些结果也得到了文献 [15] 以及 Jilali 研究（摩洛哥东北部温泉水水化学和地热温度）的证实。


    本研究阐明了我们研究区域地下水的地质化学状况，鉴于这种物质对健康的重要性，确定了该地下水的矿物组成。


    ### 5.5 结论


    在本研究中，我们分析了 Angads 含水层地下水的物理化学参数。通过 `Piper` 图对这些分析进行表征，我们可以推导出氯硫酸钙镁相为主，在采样点 `1`、`2`、`3`、`4`、`5`、`6`、`8`、`9`、`11`、`12`、`13`、`14`、`15`、`16`、`17`、`18`
    和 `19` 占比 `89.47%`；另一种是氯钠钾相，位于 `7` 和 `10` 两个点，占比 `10.52%`。`Schoeller-Berkaloff`
    图的结果显示，大多数采样点具有相同的特征，但 `7`、`8`、`10` 和 `15` 四点除外。这些点在某些化学参数上具有高值，即点 `7` 的 `Na^+`、`K^+`、`HCO[3]^−`、`CO[3]^−`；点
    `8` 的 `Mg^(2+)`、`Cl^−` 和 `SO[4]^(3−)`；点 `10` 的 `Na^+`、`Cl^−`以及点 `15` 的 `Mg^(2+)`、`Na^+`、`Cl^−`
    和 `SO[4]^(2−)`。这项工作证实了我们研究的地下水是矿化的，以便对其进行保护。


