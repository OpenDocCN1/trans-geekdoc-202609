  raw: "The Issen basin is an important watershed in the Souss catchment, and a tributary\
    \ of the Souss Wadi in the central western part of Morocco ([Ait Haddou et al.,\
    \ 2023](#ch1.xhtml#ref1_1)). The study area, the Issen catchment, is a dry zone\
    \ of the downstream section of the Souss that covers about 1300 ha and extends\
    \ over 60 km in length and 35 km in width ([Ait Haddou et al., 2022a](#ch1.xhtml#ref1_2)).\
    \ The proposed study basin has a perimeter of 218.17 km, an drainage density of\
    \ 0.85km^−ˡ and a 63 km length of the main river through it. Between the following\
    \ latitudes and longitudes, in width and with a NE-SW direction, respectively,\
    \ are 30°64 and 31°07 North and 8.72° and 9.31° West ([Figure 1.1](#ch1.xhtml#fig1_1)).\
    \ It is the largest sub-basin of the southern edge of the Western High Atlas (WHA),\
    \ which drains the Southern Atlas furrow. At the outlet of this oued, Abdelmomen\
    \ dam was installed to ensure drinking water supply to about one million persons\
    \ of the Agadir metropolis, which presents several environmental challenges. Geologically,\
    \ the Issen basin can be divided into three different zones. It is bounded to\
    \ the east by the Palaeozoic massif or ancient block of the High Atlas and to\
    \ the west by the Jurassic and Cretaceous plateaus ([Figure 1.2](#ch1.xhtml#fig1_2)).\
    \ The tectonics, lithology, and external geodynamics characteristics of the Issen\
    \ catchment indicate a strongly contrasted morphology ([Ait Haddou et al., 2022b](#ch1.xhtml#ref1_4)).\n\
    \n![Figure 1.1 Location of the Issen Wadi in west central Morocco and its landscape\
    \ of the Issen river drainage basin.](images/fig1_1_B.jpg)\n\n[Figure 1.1 Location\
    \ of the Issen Wadi in west central Morocco and its landscape of the Issen river\
    \ drainage basin.](#ch1.xhtml#R_fig1_1)\n\n![Figure 1.2 Simplified geological\
    \ map and samples localization of Issen basin, extracted from Geological map of\
    \ Argana corridor (1/100,000) (Tixeront, 1974).](images/fig1_2_B.jpg)\n\n[Figure\
    \ 1.2 Simplified geological map and samples localization of Issen basin, extracted\
    \ from Geological map of Argana corridor (1/100,000)](#ch1.xhtml#R_fig1_2) ([Tixeront,\
    \ 1974](#ch1.xhtml#ref1_16)).\n\nThe climate of the study area is warm and dry,\
    \ with the mean annual temperature being approximately 21.85°C, The Issen watershed\
    \ receives an average annual rainfall of 302 mm in the central parts, and the\
    \ annual evaporation is 2278 mm/year. The average rainfall erosivity is about\
    \ 537.64 MJ.mm/ha.h.yr for the whole basin ([Ait Haddou et al., 2020](#ch1.xhtml#ref1_3),\
