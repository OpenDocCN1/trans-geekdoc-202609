    ## 3.1 引言


    使用化肥是一种全球性的做法，旨在提高土壤生产力。然而，过度或不当地使用这些化学品会对人类健康和环境产生有害影响（`Comoretto et al.`, 2007;
    `Nicholls and Altieri`, 2014）。


    事实上，农业工业产生了大量的有机废物，这些废物可以被用作肥料，特别是在土壤通常缺乏有机质的地中海国家（`Martínez-Blanco et al.`, 2011）。其中一个典型的例子是橄榄产业，该行业具有重大的经济和社会意义，并产生大量废物。


    在摩洛哥（全球最大的生产国），农业工业在短的收获季节内产生大量废物，这些废物的逐渐积累或处置不当会对环境产生不利影响。橄榄榨取过程的副产物包括果渣，这是一种通过双相或三相离心获得的湿态材料（`Ameziane
    et al.`, 2018）。


    为了进行适当的堆肥，添加了多种调理剂：

    - 牛粪（`Ameziane et al.`, 2020）

    - 橄榄修剪枝（`Regni et al.`, 2017; `Proietti et al.`, 2015）

    - 葡萄梗（`Baeta-Hall et al.`, 2005）

    - 锯末和杨树皮（`Filippi et al.`, 2002）

    以改善孔隙性。在所有情况下，都获得了含有高有机质和大量营养的最终产品。


    然而，显然，应用生或堆后的果渣对土壤性质和作物产量有益（`López-Pieiro et al.`, 2008; `Nicholls and Altieri`,
    2014）。同样，果渣的使用改善了土壤生物活性（`Innangi et al.`, 2017）。果渣改良剂的应用已从橄榄园扩展到草本作物种植（`Del Buono
    et al.`, 2011; `Alburquerque et al.`, 2007; `Brunetti et al.`, 2005; `Tajada and
    Gonzalez`, 2004）。


    然而，滥用生果渣作为改良剂已显示出与发芽和根发育所需时间的问题，由于其高有机负荷、矿盐、低 pH 值以及植物毒性化合物的存在（`Proietti et al.`,
    2015; `Gigliotti et al.`, 2012; `Del Buono et al.`, 2011）。因此，堆肥是必要的，以稳定高有机负荷，并获得富含腐殖化合物、阳离子交换能力和保水能力的土壤改良剂（`Mekki
    et al.`, 2013）。


