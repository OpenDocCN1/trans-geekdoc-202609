  md: '# OPERATING SYSTEM CLASSIFICATION: A MINIMALIST APPROACH


    KYLE MILLER¹, ADRIEL CHENG¹,², HONG CHUN GEW¹, CHENG-CHEW LIM¹


    ¹School of Electrical and Electronic Engineering, The University of Adelaide,
    Australia

    ²Cyber and Electronic Warfare, Defence Science & Technology Group, Australia

    E-MAIL: <kyle.millar, adriel.cheng, hongchun, cheng.lim>@adelaide.edu.au, adriel.cheng@dst.defence.gov.au


    Abstract:

    Operating system (OS) classification is growing of importance for network administrators
    and for a better quality of device composition of a network to be achieved. Additionally,
    it can be used to identify devices that pose security risk to the network. However,
    the sheer number and diversity of OS that make classification increasingly difficult.
    We leverage social-invariant OS classification technique that is quick to train
    and deploy on various network configurations. We show how an affiliation graph
    can be used as input to a machine learning classifier to predict the OS of a device
    using only social features.


    with the growing number of OS, a comprehensive OS classification technique is
    becoming increasingly difficult in practice.


    Current OS classification techniques have typically relied on a larger number
    of devices to extract features (e.g., Internet protocol (IP) ID monotonicity and
    clock frequency) or a subset of them [7]. The wide variety of present on modern
    networks makes classification ineffective at scale. Additionally, the wide adoption
    of encryption standards has the ability to extract these rich feature sets from
    packet data. It has therefore become necessary for OS classification techniques
    to rely on other features.


    We examine the effectiveness of our approach on an analysis of 499 devices on
    a university wireless network. We show that our method can classify different
    OS families (i.e., Apple, Windows, and Android) with an accuracy of 99.3%. We
    extend this study by: 1) examining different OS (iOS, OS X, and Windows 10); 2)
    investigating the time required to make an accurate prediction; and 3) determining
    the effectiveness of our approach over six months.


    The aim of this paper is to produce an OS classifier that uses only the minimum
    of information that are available to a network administrator. To achieve this,
    we propose the use of affiliation graphs to construct a behavioural profile of
    a device by the IP addresses that the device communicates with. Via this, we create
    an encryption-invariant graph that is quick and requires little sample. An example
    of constructing an affiliation graph from IP addresses is shown in Figure 1.


    Affiliation graphs are a social networking technique that investigates the characteristics
    of an individual (denoted as an actor) through the communities they are affiliated
    with [6]. Social communities form both implicit and explicit communities in their
    membership, such as shared interests, occupation, or genealogy [14]. Through this
    mechanism, a common affinity within a membership set can be revealed. For example,
    Facebook is able to identify the potential affinity of a user based solely on
    the groups the user is affiliated with [11].


    Keywords:

    Cybersecurity; Machine learning; Affiliation graphs; Operating system classification;
    Passive monitoring


