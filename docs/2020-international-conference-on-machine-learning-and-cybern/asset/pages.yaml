    # 4. Communities for OS classification


    The set of $t_0$ capture contained a total of 19,222 communities. However, not
    all of these communities will be relevant for OS classification. A feature selection
    process must be used to reduce redundant communities. Implementing a feature selection
    process before training an OS classifier has shown to improve the overall performance
    that we claimed [11]. Reducing redundant communities can help further research
    into OS classification.


    Recursive feature elimination (RFE) was used to feature the set of communities
    within the $t_0$ capture. RFE iteratively runs a ML classifier with fewer features
    after each iteration. The features with the least importance to the overall performance
    were selected for re-


