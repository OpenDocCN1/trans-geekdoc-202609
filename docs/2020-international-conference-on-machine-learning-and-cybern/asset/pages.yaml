    # Affiliation Graphs for OS Classification


    The axiom of affiliation graphs is that there exists a reason for actors who are
    affiliated with certain communities [14]. Once this is known, it can be used to
    infer information about the actors affiliated with a particular community without
    a priori. Affiliation graphs have widespread use in sociological surveys for investigating
    the behavioural characteristics of an individual affiliated with a set of communities.
    The insight drawn in this paper is that the characteristics of a device can be
    identified through the communities it is affiliated with over time.


    Devices now rely on online infrastructure to manage, notify, and update the majority
    of the software they use. The software on a device can therefore be reliably identified
    through monitoring the device''s communication to its server dependencies. The
    benefit of using an affiliation graph to investigate these communications is the
    case in which it can be constructed. To create an affiliation graph from network
    data,


