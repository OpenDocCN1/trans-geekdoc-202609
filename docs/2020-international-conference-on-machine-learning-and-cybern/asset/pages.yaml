    In work we provide a broader analysis on utilising affiliation graphs for device
    characterisation. In particular, we aim to utilise unpersonalised machine learning
    to identify clusters of devices on a network which exhibit similar behavioural
    characteristics.


    There was large variation between the classification performance of individual
    classes over the six month period. Both Android and iOS showed a relatively small
    decrease in their F1-Scores (5% and 2% respectively). However, a 29% decrease
    in the F1-Score of Windows was seen for the same period. There are multiple factors
    which may have affected the performance of this methodology on Windows. For example,
    updates to Windows were released during the month between t1 and t2. It is therefore
    recommended that this methodology be updated every few months or after a update
    to an OS is released.


