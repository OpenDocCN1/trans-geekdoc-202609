    A device''s OS can be predicted by observing how its network traffic changes over
    time. For example, the frequency with which a device sends packets in network
    can be used to identify the OS [13, 10]. The challenge of such approaches is that
    there can be significant variation in a device''s network characteristics due
    to the relative activity on the device. The optimal results are often observed
    when the device is under a heavy load. Additionally, these techniques are effective
    for large networks without adding processing time required to construct their
    feature set.


