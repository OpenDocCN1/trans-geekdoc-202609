    The aim of this paper is to produce an OS classifier that uses the bare minimum
    of information that would be useful to a network administrator. Restricting our
    analysis to just enough to create an affiliation graph that is widely applicable
    to any TCP/IP network. In previous work [12], we show the feasibility of affiliation
    graphs for OS classification.


    In this paper we present an extension of this work through the utilisation of
    machine learning (ML) to identify relevant features for OS classification. Furthermore,
    we evaluate our firstly by: 1) examining the required length of a heart beat to
    ensure an accurate prediction of OS can be made; and; 2) investigating the longitudinal
    aspects of our proposed method over the course of six months.


    A large and realistic dataset is required to analyse the behavioural characteristics
    of different OS. To provide this data set, captures were taken from one of the
    University of Adelaide''s networks. This was created to allow both staff and students
    to connect their wireless devices into the university''s enterprise network. It
    provides for analysis insight into the realistic behaviour of current OS.


