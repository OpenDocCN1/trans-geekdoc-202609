    # 7. Longitudinal Analysis


    It is expected that the behaviour of an OS will change over time. For example,
    an OS may receive update modifying the online services (and hence community IP
    addresses) it communicates with. Conversely, an online service may modify the
    IP addresses it uses to communicate with its client-side devices. In both cases,
    the classification performance of this methodology will as more modifications
    made to an OS ecosystem.


    ![](img/e8955c6e2e8b572a11371707bfbbdc2e_5_1.png)


    A longitudinal analysis was conducted over the same university network to examine
    the length in which the classification performance of this methodology is effective.
    Two captures were taken (t1 and t2 months) after the to capture. These captures
    allow us to provide an insight into the changes of an OS online environment over
    the course of six months. An RF classifier was trained on 80% of the to and tested
