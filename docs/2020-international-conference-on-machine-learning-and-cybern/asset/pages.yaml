    # 5. OS Classification


    The aim of OS classification is to acquire more information about the OS running
    on a device. Given this, OS classification has been divided into two categories:


    +   1. OS family classification to identify the family of OSes


    for the target OS belongs (i.e., Apple, Windows, or Android). A device''s OS family
    often dictates the managerial and security practices which should be enforced
    for that device. OS classification aims to be beneficial for obtaining a general
    overview of the OS composition on a network.


    +   2. OS classification to identify the distinct OS on a device. OS classification
    allows for a greater level of insight into the specific OS on device. OS classification
    is therefore used when a more analysis of a set of devices is required.


    To examine the performance of our methodology, trials of RF classifier were conducted
    on the $t_0$ capture. For each, 80% training and 20% validation set were randomly
    selected. The result of this processing for both OS family and OS classification
    are given in Figures 4 and 5.


    The average accuracy for OS family and OS classification were 99.3% and 94.6%,
    respectively. This highlights that a prediction of a device OS can be made using
    only an easily obtainable set. This methodology is therefore well suited for large
    networks where the set of devices shares the same package space. The underlying
    assumption is that the host device is not observing its own behaviour. For example,
    a device could use a private network (VPN) to service the communities it affords.
    This observation would reduce the effectiveness of our methodology for OS classification.
    However, the resultant reduction in a device''s community could be used to detect
    which devices are using VPN services.


    # 6. Time Interval


    The popularity of portable devices (e.g., laptops, mobile phones, and tablets)
    has decreased the length of time for which a device is typically connected to
    a given network. It is prudent to investigate how long a device is required to
    be monitored on a network for reliability.


    The results presented in Sections 4 and 5 were conducted on the entire $t_0$ capture.
    Therefore, up to 26 hours of activity for each device could be utilised to perform
    OS classification. However not all devices were active for the entire period.
    Within the $t_0$ capture, the average interval a device was active on the network
    was 5.67 $\pm$ 6.80 hours. The large variation in this time interval indicates
    that the


