    # 操作系统分类：一种极简方法


    KYLE MILLER¹, ADRIEL CHENG¹², HONG CHUN GEW¹, CHENG-CHEW LIM¹


    ¹澳大利亚，阿德莱德大学，电气与电子工程学院

    ²澳大利亚，国防科学与技术集团，网络与电子战部

    邮箱：<kyle.millar, adriel.cheng, hongchun, cheng.lim>@adelaide.edu.au, adriel.cheng@dst.defence.gov.au


    摘要：

    操作系统（OS）分类对于网络管理员以及实现更佳的网络设备组成质量变得越来越重要。此外，它还可用于识别对网络构成安全风险的设备。然而，操作系统的巨大数量和多样性使得分类变得日益困难。我们利用了社会不变性操作系统分类技术，该技术在各种网络配置中均快速训练和部署。我们展示了如何将关联图（affiliation
    graph）作为机器学习分类器的输入，仅通过社交特征即可预测设备的操作系统。


    随着操作系统数量的增加，在实践中实现全面的操作系统分类技术变得日益困难。


    目前的操作系统分类技术通常依赖于大量的设备来提取特征（例如，网协议标识（IP）的单调性和时钟频率）或其子集 [7]。现代网络中存在的多种类型使得在大规模应用时分类失效。此外，加密标准的广泛应用限制了从数据包数据中提取这些丰富特征集的能力。因此，操作系统分类技术依赖其他特征已成为必要。


    我们通过对大学无线网络上的499台设备进行分析，研究了我们方法的有效性。我们证明了该方法可以以 99.3% 的准确率分类不同的操作系统族（即 Apple、Windows
    和 Android）。我们通过以下方面扩展了研究：1) 检查不同的操作系统（iOS、OS X 和 Windows 10）；2) 调查做出准确预测所需的时间；3)
    确定我们的方法在六个月内的有效性。


    本文的目标是产生一种仅使用网络管理员可用的最少信息的分类器。为了实现这一目标，我们建议使用关联图，通过设备通信的 IP 地址来构建设备的行为特征。通过这种方式，我们创建了一个加密不变性图，该图构建快且所需样本少。图
    1 显示了从 IP 地址构建关联图的示例。


    关联图是一种社交网络技术，通过个体所属的社区来研究个体（用“参与者”表示）的特征 [6]。社交社区在成员关系上同时形成隐式和显式社区，例如共同兴趣、职业或血缘
    [14]。通过这种机制，可以揭示成员集内部的共同亲缘关系。例如，Facebook 仅根据用户所属的小组即可识别用户的潜在亲缘关系 [11]。


    关键词：

    网络安全；机器学习；关联图；操作系统分类；被动监控


    # 1. 引言


    操作系统分类允许我们仅通过观察网络流量来识别设备的操作系统（例如 iOS、Android 或 Windows 10）[2]。识别操作系统有助于提供更优的服务质量（QoS），并协助网络安全部门识别易受设备
    [4]。然而，


    关联图的优势在于当观测到参与者与其社区之间的关联关系时 [5]。通过理解为什么产生这些关联，可以在不需要对参与者有先验知识的情况下对参与者做出推断。这一观点的公理是：设备（参与者）的操作系统可以通过该设备所属的
    IP 地址（社区）来确定。例如，设备操作系统的更新可能会揭示其为 Windows 系统 [7]。如果已知参与者将所属的社区，就可以构建出不同操作系统的通用行为特征。我们工作的主要贡献是：


    - 1. 我们证明了关联图上的随机森林（RF）分类器可以对操作系统族（如 Apple、Windows 和 Android）达到 99.3% 的分类准确率。此外，还达到了
    94.6% 的准确率。

    - 2. 我们发现基于 IP 地址构建代表性特征的图大约需要一小时。

    - 3. 我们研究了该方法在六个月后的性能下降。对于 Apple 和 Android 操作系统，分别下降了 3% 和 7%，这种下降可以通过每六个月重新训练分类器来缓解。


    本文的其余部分结构如下：第 2 节简述相关工作并介绍数据集概述；第 4 节介绍特征选择过程；第 5 节介绍操作系统分类；第 6 节调查所需的时间；第 7 节检查方法在六个月后的性能；第
    8 节总结全文并对结果和未来工作提出建议。


    # 相关工作


    由于维护网络安全和功能的紧迫性，对设备管理策略兴趣日益增加。操作系统分类是设备管理的一个主要领域，因此在过去几年受到了广泛关注。


    最常用的操作系统分类技术是数据包检测。数据包检测揭示了不同操作系统数据包创建的差异。例如，数据包的存活时间（TTL）可用于识别操作系统（Windows 的
    TTL 为 128，而 Apple 和 Android 则为 64）。数据包检测还可以提取更显著的特征。例如，HTTP User-Agent 字段可识别操作系统的版本和版本。加密降低了仅依赖载荷细节检测技术的有效性。


    有几种著名的利用数据包检测的工具（例如 Nmap [9]、Probe [2] 和 p0 [16]）。这些技术实现了高分类性能，并能够识别操作系统的版本。Nmap
    和 Probe 要求在分析期间设备连接到网络。此外，这些工具无法对已不在网络的设备进行调查；在有足够数据包数据的情况下，p0 可以对设备的操作系统进行追溯分析；然而，

