    # Related Work


    There has been growing interest in device management strategies due to the urgency
    for maintaining security and functioning network. OS classification is a major
    field of device management and as such has received considerable attention in
    the past few years.


    The most used OS classification technique is packet inspection. Packet inspection
    reveals the idiosyncrasies in the packet creation process of distinct OSs. For
    example, the time-to-live (TTL) of a packet can be used to identify OS. Windows
    OS (TTL=128) for both Apple and Android OSs (TTL=64). Packet inspection can also
    extract more significant signatures of the packet of lead to be achieved. For
    example, the HTTP-User-Agent field can be used to identify the version and edition
    of an OS [2]. Encryption has reduced the effectiveness of techniques that rely
    only on the inspection of payload details.


    There are several well-known OS tools that make use of packet inspection (e.g.,
    Nmap [9], Probe[2], and p0 [16]). These techniques achieve high classification
    performance as well as the ability to identify distinct versions of the OS. Nmap
    and Probe require both the device to be connected to the network during analysis.
    Furthermore, these tools cannot be used to perform an investigation into devices
