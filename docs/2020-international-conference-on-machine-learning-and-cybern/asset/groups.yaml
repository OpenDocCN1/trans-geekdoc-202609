    storage and processing of packet data can lead to security and privacy concerns
    if it is insufficiently sanitised.


    A device''s OS can be predicted by observing how its network traffic changes over
    time. For example, the frequency with which a device sends packets in network
    can be used to identify the OS [13, 10]. The challenge of such approaches is that
    there can be significant variation in a device''s network characteristics due
    to the relative activity on the device. The optimal results are often observed
    when the device is under a heavy load. Additionally, these techniques are effective
    for large networks without adding processing time required to construct their
    feature set.


    only the source and destination IP addresses are required from each network flow¹.
    This results in a technique that is quick to populate and require little storage.
    Additionally, this technique is widely deployable as most network administrators
    have access to flow records.


    An affiliation graph from 26 hours of network traffic is shown in Figure 2. It
    can be seen that the majority of devices that affiliate with the span of 26 hours
    are owned by the manufacturers of their OS.


