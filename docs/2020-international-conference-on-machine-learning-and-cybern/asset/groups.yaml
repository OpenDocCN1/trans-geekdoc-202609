    ![](img/e8955c6e2e8b572a11371707bfbbdc2e_5_0.png)


    **图 5.** OS 分类性能。对 RF（随机森林）分类器进行了十次训练实验。在每次实验中，随机选择捕获数据的 80% 进行训练。结果显示了 20% 验证集中各类别的精确率（Precision）、召回率（Recall）和
    F1 分数的平均值和标准差。


    前几节中的分类并不严重依赖于捕获长度。然而，这些结果对于那些在网络上存在时间较短（例如小于一小时）的设备，并没有提供良好的分类性能指示。


    捕获中设备的网络活动设置了较短的时间间隔，以确保捕获长度对分类性能的影响。对于每个时间间隔，使用 80% 的数据训练 RF 分类器，并使用 20% 的数据验证其性能。结果见图
    6。


    图 6 展示了在一小时或两小时时间间隔内相对稳定的分类性能。捕获数据中的 490 个 (98.4%) 设备超过了这一时间阈值。因此，结果支持分类并不严重依赖于捕获长度。然而，对于小于一小时的时间间隔，分类性能并未表现出下降趋势。因此，我们假设通过仅监控设备通信的
    IP 地址，平均大约需要小时来构建设备的 OS 特征配置文件。


    ## 7. 纵向分析


    预计 OS 的行为会随着时间而变化。例如，OS 可能会接收更新以修改其通信的在线服务（以及相应的社区 IP 地址）。相反，在线服务可能会修改其用于与客户端设备通信的
    IP 地址。在两种情况下，随着对 OS 生态系统修改的增加，该方法的分类性能将会退化。


    ![](img/e8955c6e2e8b572a11371707bfbbdc2e_5_1.png)


    在同一大学网络上进行了纵向分析，以检查该方法的分类性能有效的持续时间。在捕获数据后进行了两次捕获（间隔为 t1 和 t2 个月）。这些捕获使我们能够洞察六个月内
    OS 在线环境的变化。RF 分类器在 80% 的数据上训练，并在 20% 的数据上测试。表 2 总结了所有三次捕获数据的 OS 族和 OS 分类性能。


    **图 6.** 用于分析的时间间隔内的分类性能。针对每个时间间隔都训练了 RF 分类器。对于每个分类器，使用捕获数据的 80% 用于训练，20% 用于验证。图中了每个时间间隔
    20% 验证集的 Micro 和 Macro F1 分数的平均值和标准差。


    表格指示了分类性能以及训练与测试获之间的时间段。这支持了预期：OS 环境随时间变化，从而导致该方法的分类性能退化。然而，六个月后，OS 族和 OS 分类的整体分类性能（Micro
    F1 分数）下降幅度均小于 10%。分类性能的退化对于获取网络上 OS 组成的初步概览仍然是可以接受的。


    在工作中，我们对利用关联图进行设备表征提供了更广泛的分析。特别地，我们的目标是利用非个性化机器学习来识别网络上具有相似行为特征的设备集群。


    在六个月期间，各个类别的分类性能之间存在巨大差异。Android 和 iOS 的 F1 分数下降相对较小（分别为 5% 和 2%）。然而，同一时期 Windows
    的 F1 分数下降了 29%。有多个因素可能影响了该方法在 Windows 上的性能。例如在 t1 和 t2 之间发布了 Windows 更新。


