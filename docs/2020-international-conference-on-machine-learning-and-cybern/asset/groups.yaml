    [2]. Identifying the OS helps provide a better quality of service (QoS) and assists
    cybersecurity in identifying vulnerable devices [4]. However,


    The advantage of an affiliation graph lies in the case where the affiliations
    between an actor and their communities are observed [5]. Through understanding
    why these affiliations are'
