    ## 第1章

    理解大气河并探索其作为气候极端事件的作用


    ### 1.1 陆地河流


    河流象征着水在景观中持续流动，作为塑造我们世界的重要通道 [1]。它们在地形中蜿蜒前行，创造生态系统，支持生物多样性，并维系人类文明。这些流动的水体，无论是缓缓蜿蜒还是湍急奔流，在塑造其途中的自然和社会景观方面发挥着关键作用
    [15]。其影响超越地理边界，沿其流程影响气候、经济和文化。


    ### 1.2 气候极端事件


    气候极端事件是指天气模式中显著偏离典型或平均状况的现象 [40, 56]。这些偏差以多种方式表现出来，如极端温度、异常降水、长期干旱或过多降雨、强烈风暴和热浪
    [6, 10, 13, 32, 44]。它们破坏了通常的气候平衡，对自然系统、人类社会和建成基础设施构成重大挑战。理解这些事件需要深入探究其根本原因，这些原因可能源于自然变率、人为引起的气候变化，或两者兼而有之
    [10, 50]。


    除观察这些异常现象外，研究气候极端事件还需要进行全面分析，以揭示其影响并预测其发生情况 [18, 52]。评估与这些极端天气现象相关的脆弱性和风险，对于制定有效的适应和减缓策略至关重要
    [11, 51]。这些策略旨在最大限度地减少此类事件对社区、基础设施和环境的不利影响 [12, 19, 31, 47]。该研究领域对于


    | 序号 | 气候极端事件 | 解释/研究方法 | 数学解释 |

    | :--- | :--- | :--- | :--- |

    | 1 | 热浪 | 分析异常高温的持续时期 | 特定时期内与平均温度的偏差；例如，使用历史温度数据的异常值或标准差 |

    | 2 | 洪水 | 研究因强降雨导致土地过度和迅速淹没 | 通过频率分析或概率分布等统计方法，分析降雨强度、河流排放量及极端事件的重现期 |

    | 3 | 干旱 | 评估长期水资源短缺或降水赤字期间 | 计算标准化降水指数，或将实际降水与长期平均值进行比较，以确定干旱事件的严重程度和持续时间 |

    | 4 | 风暴 | 评估以强风和大雨为特征的强烈天气事件 | 使用气象数据或如博福特风力等级等公式测量风速、大气压力和降雨强度 |


    以增强应对气候不确定性的韧性，确保准备就绪，并在不断变化的气候背景下促进可持续发展。


