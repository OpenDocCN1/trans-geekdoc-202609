    ## 4.5 结论


    气候涛动对全球天气系统和区域水文产生深远影响，其复杂的动力学与大气河流（AR）密切相互作用。这些相互作用对气候变率、极端天气事件以及水资源管理具有重大意义。特别是，厄尔尼诺-南方涛动（ENSO）、北大西洋涛动（NAO）和北极涛动（AO）等大尺度气候涛动（LSCOs）在塑造这些现象方面起关键作用，并与北美和欧洲等地区的
    AR 行为表现出清晰的联系。例如，厄尔尼诺阶段 AR 频率的变化说明了 LSCOs 如何调制 AR 动态，以不同方式影响不同地区，并凸显了它们关系的复杂性。


    本研究采用统计方法进行了详细分析，比较了平稳和非平稳模型，重点关注 AO、NAO、ENSO 和 PDO 等关键因素。研究结果强调了 PDO（一种持久的 ENSO
    现象）对大规模天气模式的显著影响，尤其是在夏季月份尤为明显。此外，研究还揭示，与其他指数相比，季节性 PDO 指数（特别是 MJJAS 指数）在捕捉极端降水事件变化方面更为有效，表明
    PDO 对特定区域降水模式具有强烈影响。


    更好地了解这些相互联系对于提高不同时间尺度上 AR 预测的准确性以及制定管理气候极端风险的有效策略至关重要。协作努力和科学研究的进步在这项工作中发挥着关键作用，因为它们有助于提升预测能力、水资源管理实践以及在不断变化的气候条件下增强韧性。本研究关于气候涛动、AR
    与降水极值之间复杂相互作用的见解，为完善风险评估方法论并在全球脆弱地区实施有针对性的管理策略提供了宝贵基础。


