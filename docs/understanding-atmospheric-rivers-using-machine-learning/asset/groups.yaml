    ## Chapter 2

    大气河的特征与影响


    ### 2.1 引言


    平均而言，中纬度地区约90%的大气水汽由这些大气河输送 [89]。这些窄幅高水汽走廊在科学上被认可为大气水汽输送带或水汽输送通道 [21]，它们会动态改变路径，通过局部辐合、蒸发，有时也从遥远的热带和副热带源区获取水汽
    [19, 84]。这些载有大量水汽的大气河通过与地形相互作用，创造出有利于诱导降水的条件 [67]。因此，登陆的大气河可能带来显著的水文影响，包括供水、降水极端事件及相关灾害。洪水是最具破坏性的极端天气事件之一，在全球范围内对基础设施、自然环境和人类生命造成了毁灭性打击
    [13, 14, 23, 35, 59, 72]。如果某一年某特定地区缺乏大量大气河，可能会引发干旱。干旱也会对人类、动物、植被等健康造成多种不利影响 [24,
    34, 39, 57, 77, 81]。


    大多数与大气河相关的降水和洪涝事件观测于中纬度沿海地区。大气河对美国西海岸年降水量的贡献约为20–30% [40]，以及东亚温暖季节总降水量的约14–44%
    [36]。全球范围内，每个半球任何给定时间平均存在四到五条大气河，在南北美洲西海岸、南非、欧洲、新西兰、澳大利亚和日本出现频率更高。极地地区也受到影响，大气河对降雪有贡献
    [2, 86]。大气河的社会经济影响遍及全球各西部沿海地区，导致了众多极端降水事件。


    大气河以产生强降水而闻名，常导致极端降雨事件及随后的洪涝 [15, 47, 53]。大气河内集中的水汽输送可能导致短时强降雨，超出排水系统承载能力，引发山洪、河流洪水和滑坡
    [60, 82, 83, 89]。这些影响包括财产损失、基础设施中断以及对人类安全的威胁。在1985年至2020年间印度的十起最致命洪水中，有七起与大气河有关
    [45]。2017年，袭击加州的大气河造成超过10亿美元的经济损失，而2019年，另一条大气河导致加州北部严重洪涝，损失超过1亿美元 [31]。识别易受大气河相关洪涝影响的地区对于有效的减缓和准备工作至关重要。为了在对流层中表征这些大气河，人们已引入多种方法来观察其区域和全球尺度的影响。


    2005年至2017年间，开展了多项野外考察活动，以直接观测东北太平洋上大气河中的水汽运动 [54]。这些活动包括2005年的“Ghost Nets”、2011年的“WISPAR”、2014年和2015年的“CalWater”以及2016年的“AR
    Recon”，涉及从气象侦察机释放落体探空仪，在多个气压层记录各种气象条件 [65]。利用这些测量数据，计算了IWV和IVT，从而了解大气河的宽度、强度和总IVT。考察活动显示，平均大气河宽约1000
    km，输送约5 × 10^8 kg s^-1的水汽，可与大河流量相媲美。落体探空仪剖面观测与再分析数据的合成分析，深入了解了大气河在低对流层中的垂直结构。大气河与锋面相交，并通过WCB中的上升运动引起的降水而减弱
    [61]。绝大部分IVT出现在平均海平面（MSL）3 km以下，较小部分出现在高空急流中。


    ### 2.2 观测与探测


    #### 2.2.1 基于卫星的观测


    卫星观测是研究大气河科学的最初推动力 [27, 52, 66, 67, 62, 88]。卫星提供全球视角，对大气河事件的各种特征（可用性、范围和强度）提供了独特见解。这些观测尤其有价值，因为它们提供了其他现有观测系统或数值模型无法获得的信息。


    两种类型的卫星测量对推进我们对大气河的理解做出了重大贡献：


    - **被动微波辐射成像**：将研究飞机数据与该技术相结合，实现了大气河的首次海外测量。利用被动微波辐射计，IWV检索提供了大气河的清晰详细描绘。尽管仅IWV可能无法提供大气河的所有特征，但当与其他信息（如风数据）相辅相成时，它成为一种强有力的代理指标
    [28, 83].


    - **射电掩星测量**：这些测量在海洋上提供了有用的水汽廓线证据，对大气河的垂直特征提供了独特见解 [87]。


    微波辐射测量（特别是特种传感器微波/成像仪SSM/I）在大气河研究复兴方面发挥了重要作用 [9, 63, 86]。与基于红外的测量不同，微波观测可以穿透常与大气河相关的云层，从而进行准确的IWV测量。SSM/I影像提供了俯视图背景，便于探测和研究大气河的细长特性。这促成了ARDM的发展，该方法利用20
    mm以上的IWV阈值来满足长度和宽度要求，以有效识别大气河 [60, 88]。与研究飞机测量相比，每日SSM/I测量数据的可用性大大增加了可研究的大气河数量。卫星衍生的IWV影像在大气河领域广泛应用，用于识别和表征各地区的大气河、发展气候学、了解水文影响、验证预报模式和再分析，并支持公众宣传活动
    [27, 52]。


    #### 2.2.2 再分析数据


    由于具有广泛的时空覆盖范围和对气候系统的详细表征，这类数据在水文气象学研究中被广泛使用 [7]。再分析涉及通过合并预报和观测数据来创建地球的当前状态，是研究大气河等大尺度天气现象的宝贵工具
    [3, 13, 12, 54]。NCEP–NCAR再分析数据集的引入显著增强了对大气河全球影响和气候学的探索。这些数据集从1948年开始，依赖探空仪数据，已被广泛用于大气河探测
    [3]。利用多种卫星观测的现代再分析产品提供了从1979年开始的水文气象观测，增强了对全球水循环的理解 [41]。再分析产品与飞机测量和卫星记录等观测的比较表明，大气河特征在再分析中通常表现良好，尽管某些特定再分析产品中仍存在不同程度的误差。再分析产品有

