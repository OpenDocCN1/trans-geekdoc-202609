    # # Chapter 4

    # Major Large-Scale Climate Oscillations and Their Interactions with Atmospheric
    Rivers


    # ## 4.1 Introduction


    Climate oscillations play a pivotal role in shaping global weather patterns and
    influencing various aspects of regional hydrology [6, 28]. These oscillations,
    characterized by their intricate dynamics, interact with atmospheric rivers (ARs)
    in ways that have significant implications for climate variability, extreme weather
    events, and water resource management strategies. Large-scale climate oscillations
    (LSCOs) are persistent patterns of atmospheric circulation and sea surface temperature
    (SST) anomalies and can significantly affect weather and climate at different
    spatial and temporal scales [6, 28]. ARs have been observed to be linked to well-known
    LSCOs in regions such as North America and Europe, such as El-Nino Southern Oscillation
    (ENSO), North Atlantic Oscillation (NAO), and Artic Oscillation (AO) [11, 13,
    23]. For example, during the winter of 2010–11, the simultaneous negative phase
    of two LSCOs, the Pacific/North American (PNA) pattern and the AO, was linked
    to the occurrence of an exceptionally high number of ARs in California''s Sierra
    Nevada [10]. A further study conducted in 2015 by Guan and Waliser showed that
    ARs became less common in extratropical and subtropical regions during El Niño
    phases, with notable anomalies found in the North Atlantic and the northeastern
    Pacific. Furthermore, they observed that negative anomalies in AR frequency follow
    positive anomalies during phases 5–8 of the Madden Julian Oscillation (MJO), which
    originate in East Asia and extend south of the Aleutian Islands. Accurately predicting
    ARs on various time frames requires an understanding of these relationships [21,
    27, 29, 30]. To improve our comprehension of the mechanisms influencing AR frequency
    and precipitation at several regions and climates, more investigation is required.


    LSCOs, or atmospheric teleconnection patterns, are long-term patterns of air circulation
    and sea surface temperature anomalies [26, 28]. They significantly influence weather
    patterns and climate conditions. Some widely explored LSCOs include ENSO, NAO,
    PDO, and AO [2, 8, 28, 36]. These LSCOs exhibit characteristic spatial patterns,
    extreme temperature, precipitation, and other climate variables in their'
