  mdcn: "\n\n在AR研究中被证明特别有价值，因为它们能提供关于矢量风、垂直剖面和气候系统状态的全面信息。再分析产品已被应用于各种AR研究应用，包括检查AR登陆的空间模式和垂直结构、评估历史AR活动、开发ARDM以及评估全球天气和气候模型[10,\
    \ 82, 73, 80]。再分析中对卫星和其他观测数据的同化允许这些观测对AR研究做出集体贡献。\n\n## 2.3 AR识别\n\n已出现众多AR识别方法，采用IWV或IVT作为阈值标准[41,\
    \ 47]。这些阈值可能保持不变，也可能根据位置、季节或气候学而变化。AR识别考虑长度、宽度、长宽比和曲率等几何标准。有些方法涉及在空间上（欧拉式）跟踪AR，或将其作为对象进行跟踪（拉格朗日式）[16,\
    \ 71, 90]。时间标准、机器学习技术、滤除非AR现象以及在主观分析或客观算法之间进行选择是其他考虑因素。这种选择阵列导致了多样的排列组合和关于AR识别方法的丰富文献。\n\
    \n最初，AR是基于利用卫星和飞机观测的IWV阈值进行识别的，为评估AR对降水的贡献奠定了基础（图2.1a）。随后，在再分析数据的帮助下，基于IVT的AR表征优于IWV。开发了利用IVT阈值的客观方法，使全球范围内对AR特征的连续检查成为可能（图2.1和2.2）。\n\
    \n最近的努力旨在就AR定义和识别方法达成共识。ARTMIP量化了不同AR检测方法产生的不确定性[68, 72, 78]。ARTMIP内的研究揭示了不同算法之间检测到的AR总数存在差异，强调了检测方法对几何标准的敏感性。尽管如此，在相关AR关键属性（如频率、强度和持续时间）方面，差异相对较小。\n\
    \n## 2.4 全球与局部洞察\n\n最初，AR的影响主要在北美西海岸和欧洲进行了研究[11, 18, 20, 32, 40, 56, 76]。最近的AR研究已扩展到这些地区之外，涵盖极地地区、东部大陆和沿海地区以及其他历史上科学关注较少的地区[36,\
    \ 37, 42, 43, 45, 74, 79]（图2.3）。这些进步，加上对天气和气候模型进行基准测试的必要性，凸显了在全球范围内表征AR的重要性。为实现这一目标，正在开发适用于不同地区的各种ARDM。ARTMIP概述了这些算法的细节，并提供了比较这些不同方法得出结果的机会[50,\
    \ 58, 78]。\n\n![](img/71a0ec63e9052cfd3c03275806bd398d_29_0.png)\n\n图 2.1 集成水汽的物理表示；b\
    \ 用于表征对流层中 AR 的集成水汽输送\n\n![](img/71a0ec63e9052cfd3c03275806bd398d_29_1.png)\n\n\
    图 2.2 2005 年 7 月 26 日 06:00 源自 ERA5（ECMWF）再分析数据的 IVT（kg m⁻¹ s⁻¹）空间分布\n\n![](img/71a0ec63e9052cfd3c03275806bd398d_30_0.png)\n\
    \n![](img/71a0ec63e9052cfd3c03275806bd398d_30_1.png)\n\n图 2.3 a MJJAS 气候学和 b NDJFM\
    \ 气候学中的登陆 AR 频率\n\n### 2.4.1 全球视角\n\n[29]提出的ARDM被应用于跨越1979年至2015年的ERA-Interim\
    \ IVT数据，从而生成了一份全面的全球AR目录。他们的观察显示，全球平均同时存在11个AR。各种研究中提出的不同ARDM在IVT阈值和几何标准方面存在细微差异。对AR的全球分析表明，登陆位置主要位于两个半球中纬度主要大陆的西海岸[30,\
    \ 33, 64]（图2.3）。AR频率较高的沿海地区也表现出较高的登陆频率，强调了预计AR影响将实质性的区域。\n\n### 2.4.2 区域视角\n\n\
    - (a) 北美西海岸\n\n  对北美大陆上AR的研究一直是一个焦点，为其气候学和影响提供了宝贵的见解。Neiman等人[52]率先建立了该地区的AR气候学，将AR定义为具有特定标准的IWV丝状区域。后续研究证实了沿海地区AR的季节性和频率。Gershunov等人[20]采用再分析数据，基于涉及IVT和IWV的标准识别登陆AR。他们的研究结果凸显了AR的季节性进展，频率在不列颠哥伦比亚省9月和10月达到峰值，并在随后几个月向南移动。由于不同的检测方法，AR登陆的季节性出现了差异，基于IWV的方法在温暖季节识别出更多AR，而基于IVT的方法在凉爽季节识别出更多AR。\n\
    \n- (b) 美国西部\n\n  向内陆渗透的AR打破了AR仅局限于沿海地区的传统观念，尤其是在美国西部。这些AR可以对远离海岸的地区产生重大影响，例如2010年1月的AR事件给亚利桑那州带来了极端天气条件并造成了损害[51]。该事件强调了特定定位和地形因素在AR影响中的重要性，包括与上层动力学的垂直耦合、弱静态稳定性、强水汽通量和大尺度动力学。对美国西部利用基于集成水汽输送（IVT）阈值的AR气候学研究揭示，俄勒冈州、华盛顿州和北加利福尼亚州沿海地区的AR频率较高（图2.3）[4,\
    \ 46, 75]。\n\n- (c) 美国东南部\n\n  美国东南部的强降水事件受到不同大气现象的影响，包括气旋和中尺度对流系统（MCSs）[6]。最近的研究揭示了AR或AR相关特征在某些强降水场景中的作用，尤其是在冬季和过渡季节。[44]的一项研究揭示，大约41%的AR与美国东南部的极端降雨事件相关。\n\
    \n- (d) 欧洲\n\n  欧洲观测到的降水趋势受到来自北大西洋和地中海的水汽移动的影响[17, 33]。AR在欧洲的水文循环中发挥着重要作用。冬季，来自北大西洋的水汽显著影响整个欧洲大陆的降水模式，而地中海则全年为影响南欧的水汽来源[11,\
    \ 69]。与北美不同，欧洲的AR通常与温带气旋相关联，并且受到的关注较少。尽管如此，研究已证明了它们在极端降水事件中的重要性，例如挪威的一项研究将AR与强降雨联系起来[48]。\n\
    \n  近年来，对研究北大西洋盆地的AR气候学及其对西欧的影响给予了特别关注[11]。到达西欧的AR的水汽来源主要来自副热带地区，另外还来自热带和中纬度地区。理论认为，AR内部的潜热释放影响温带气旋的增强，导致欧洲发生有影响的天气事件[40]。AR对欧洲降水有显著影响，尤其是在冬季活跃的风暴路径期间。然而，随着对流天气系统在夏季更加普遍，其影响会减弱。尽管如此，伊比利亚半岛、法国、英国和西斯堪的纳维亚等地区继续经历来自欧洲AR的显著影响[55,\
    \ 70]。\n\n- (e) 南美南部\n\n  与北美和欧洲相比，南美洲与AR相关的强降雨影响受到的关注较少。尽管如此，两个大陆中纬度西海岸AR影响之间存在相似之处，其特征是AR直接路径上分布着广阔的山脉。这些地形特征促进地形降水过程，导致强降雨和降雪事件加剧[86]。然而，南美和北美山脉地形的特定局部差异，包括高度、朝向、宽度以及较小沿海山脉的存在，导致与登陆AR相关的地形调制和降水模式各异。\n\
    \n  在南美洲，西海岸会遇到大量的冬季降水事件，这些事件主要与登陆AR相关，对安第斯山脉（具体位于30°S至37°S之间）的年总降雨量和积雪量做出了重大贡献。通常，四到五次强烈的冬季降雨事件贡献了大约70%的年降水量，其中相当一部分事件归因于AR[1]。与登陆AR相关的更强风和更深的气旋往往会导致更高的累积降水量，而由AR引发的极端事件可能导致洪水、滑坡和重大损失，尤其是在中部智利等地区。\n\
    \n- (f) 极地区域的AR\n\n  AR通过向极地输送温暖潮湿的空气，在极地发挥着重要作用。当AR到达格陵兰或南极的冰盖时，由于这些地区的陡坡，会导致地形抬升[22,\
    \ 85]。格陵兰和东南极的高地地形放大了登陆AR对极地降水的影响，类似于它们对加利福尼亚或南美洲等多山地区的影响。除了引发不寻常的降雨外，AR还导致暖平流，引发诸如2012年7月中格陵兰融冰事件等重大事件[85]。\n\
    \n"
