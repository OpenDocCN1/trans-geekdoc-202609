    ## Chapter 4

    Major Large-Scale Climate Oscillations and Their Interactions with Atmospheric
    Rivers


    ### 4.1 Introduction


    Climate oscillations play a pivotal role in shaping global weather patterns and
    influencing various aspects of regional hydrology [6, 28]. These oscillations,
    characterized by their intricate dynamics, interact with atmospheric rivers (ARs)
    in ways that have significant implications for climate variability, extreme weather
    events, and water resource management strategies. Large-scale climate oscillations
    (LSCOs) are persistent patterns of atmospheric circulation and sea surface temperature
    (SST) anomalies and can significantly affect weather and climate at different
    spatial and temporal scales [6, 28]. ARs have been observed to be linked to well-known
    LSCOs in regions such as North America and Europe, such as El Niño Southern Oscillation
    (ENSO), North Atlantic Oscillation (NAO), and Arctic Oscillation (AO) [11, 13,
    23]. For example, during the winter of 2010–11, the simultaneous negative phase
    of two LSCOs, the Pacific/North American (PNA) pattern and the AO, was linked
    to the occurrence of an exceptionally high number of ARs in California''s Sierra
    Nevada [10]. A further study conducted in 2015 by Guan and Waliser showed that
    ARs became less common in extratropical and subtropical regions during El Niño
    phases, with notable anomalies found in the North Atlantic and the northeastern
    Pacific. Furthermore, they observed that negative anomalies in AR frequency follow
    positive anomalies during phases 5–8 of the Madden–Julian Oscillation (MJO), which
    originate in East Asia and extend south of the Aleutian Islands. Accurately predicting
    ARs on various time frames requires an understanding of these relationships [21,
    27, 29, 30]. To improve our comprehension of the mechanisms influencing AR frequency
    and precipitation at several regions and climates, more investigation is required.


    LSCOs, or atmospheric teleconnection patterns, are long-term patterns of air circulation
    and sea surface temperature anomalies [26, 28]. They significantly influence weather
    patterns and climate conditions. Some widely explored LSCOs include ENSO, NAO,
    PDO, and AO [2, 8, 28, 36]. These LSCOs exhibit characteristic spatial patterns,
    extreme temperature, precipitation, and other climate variables in their respective
    regions. Studies have shown significant connections between LSCOs and ARs along
    the west coasts of North America and Europe [11, 13]. Research conducted in Europe
    has revealed links between LSCOs and ARs, such as the Scandinavian pattern and
    the NAO [19]. Global analyses of ARs and LSCOs have shown their influences on
    AR precipitation during elongated season from October to March, which aligns with
    the peak activity of these modes [13, 25].


    During El Niño phases, ARs become less frequent in mid-to-high latitudes, while
    positive anomalies of AR frequency are associated with specific phases of the
    Madden–Julian Oscillation (MJO) [11]. The AO and PNA patterns influence AR frequency
    in various regions, with positive and negative phases leading to different outcomes.
    Given that the modes operate on distinct timeframes, these relationships between
    ARs and LSCOs have consequences for sub-seasonal, seasonal, and long-term prediction
    [9, 12]. The way that AO and PNA affect AR intensity is consistent with how they
    affect AR precipitation [11, 12]. These modes do, however, have a more localized
    effect on AR precipitation, indicating the necessity of taking into account both
    large-scale modes and regional and local-scale variability. To gain a deeper knowledge
    of the mechanisms determining AR frequency and precipitation across various regions,
    seasons, and climate regimes, more research is required.


    Traditional stationary models assume that the underlying statistical properties
    of extreme events remain constant over time [16]. However, in many cases, this
    assumption does not hold due to climate change and other dynamic factors. The
    stationary limitations arise from the inability to capture the temporal evolution
    and variability of extremes [4, 38]. Climate change, land use changes, and other
    anthropogenic factors can significantly alter the distribution and occurrence
    of extremes [14, 20]. By neglecting nonstationary behaviors, stationary models
    may provide inaccurate estimations and predictions. The nonstationary analysis
    addresses this limitation by incorporating physical processes as covariates in
    GEV models [3, 34]. These covariates can capture the influence of changing climate
    conditions on extreme events. By considering the temporal evolution of these covariates,
    nonstationary models can capture the time-varying behavior of extremes and provide
    more accurate estimations of their magnitudes and frequencies [3, 39].


    Modeling nonstationary behavior through GEV has been widely adopted in various
    fields. Researchers have utilized covariates such as anomalies of climate oscillations
    (ENSO, PNA, MJO, etc.) and SST to capture the spatiotemporal variability of climate
    extremes [14, 18, 32, 33]. By incorporating covariates into GEV models, they have
