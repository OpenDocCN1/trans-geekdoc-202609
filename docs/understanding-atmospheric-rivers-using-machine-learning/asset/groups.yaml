    ## 第 4 章

    大规模气候振荡及其与大气河流的相互作用


    ### 4.1 引言


    气候振荡在塑造全球天气模式以及影响区域水文学的各个方面中发挥着关键作用 [6, 28]。这些振荡以其复杂的动力学为特征，与大气河流（ARs）的相互作用对气候变率、极端天气事件和水资源管理策略具有重要意义。大规模气候振荡（LSCOs）是大气环流和海面温度（SST）异常的持续模式，可在不同的空间和时间尺度上显著影响天气和气候
    [6, 28]。观察表明，ARs 与北美和欧洲等地区的知名 LSCOs（如厄尔尼诺-南方涛动（ENSO）、北大西洋涛动（NAO）和北极涛动（AO））相关联
    [11, 13, 23]。例如，在 2010–11 年冬季，两个 LSCO（即太平洋/北美（PNA）模式和北极涛动（AO））同时处于负位相，这与加利福尼亚州内华达山脉出现异常多的
    ARs 相关联 [10]。Guan 和 Waliser 于 2015 年进行的一项进一步研究表明，在厄尔尼诺阶段，ARs 在中纬度和亚热带地区变得较少见，北大西洋和东北太平洋地区出现了显著异常。此外，他们还观察到，在
    Madden–Julian 振荡（MJO）的 5–8 位相期间，AR 频率的负异常紧随正异常之后，MJO 源起东亚并延伸至阿留申群岛以南。在不同的时间尺度上准确预测
    ARs 需要理解这些关系 [21, 27, 29, 30]。为了提高我们对影响多个地区和气候中 AR 频率与降水机制的理解，还需要进一步的研究。


    LSCOs，或大气遥相关模式，是大气环流和海面温度异常的长期模式 [26, 28]。它们显著影响天气模式和气候条件。一些被广泛研究的 LSCOs 包括 ENSO、NAO、PDO
    和 AO [2, 8, 28, 36]。这些 LSCOs 在其各自区域表现出特征性的空间模式、极端温度、降水及其他气候变量。研究表明，北美和欧洲西海岸沿线
    LSCOs 与 ARs 之间存在显著联系 [11, 13]。在欧洲进行的研究揭示了 LSCOs 与 ARs 之间的联系，例如斯堪的那维亚模式和 NAO [19]。对
    ARs 和 LSCOs 的全球分析表明，它们对 10 月至 3 月延长季节期间的 AR 降水具有影响，这与这些模式的峰值活动期一致 [13, 25]。


    在厄尔尼诺阶段，中高纬度地区的 ARs 变得不那么频繁，而 AR 频率的正异常与 Madden–Julian 振荡（MJO）的特定位相相关联 [11]。AO
    和 PNA 模式影响各个地区的 AR 频率，正负位相会导致不同的结果。鉴于这些模式在不同的时间尺度上运作，ARs 与 LSCOs 之间的这些关系对次季节性、季节性和长期预测具有影响
    [9, 12]。AO 和 PNA 影响 AR 强度的方式与它们影响 AR 降水的方式一致 [11, 12]。然而，这些模式对 AR 降水具有更局部化的影响，这表明必须同时考虑大规模模式以及区域和局部尺度的变异性。为了深入了解不同地区、季节和气候条件下决定
    AR 频率与降水的机制，还需要更多的研究。


    传统平稳模型假设极端事件的基本统计特性随时间保持不变 [16]。然而，在许多情况下，由于气候变化和其他动态因素，这一假设并不成立。平稳性的局限性源于无法捕捉极端事件的时间演变和变异性
    [4, 38]。气候变化、土地利用变化和其他人为因素可以显著改变极端事件的分布和发生情况 [14, 20]。忽略非平稳行为可能导致平稳模型提供不准确的估计和预测。非平稳分析通过将物理过程作为协变量纳入
    GEV 模型来解决这一局限性 [3, 34]。这些协变量可以捕捉变化的气候条件对极端事件的影响。通过考虑这些协变量的时间演变，非平稳模型可以捕捉极端事件的时间变化行为，并提供更准确的其幅度和频率估计
    [3, 39]。


    通过 GEV 模拟非平稳行为已在多个领域得到广泛应用。研究人员利用气候振荡异常（ENSO、PNA、MJO 等）和 SST 等协变量来捕捉气候极值的时空变异性
    [14, 18, 32, 33]。通过将协变量纳入 GEV 模型，他们已成功证明在估计极端事件幅度以及理解其与不断变化的环境条件的关系方面取得了改进 [24,
    37]。例如，Katz [16] 讨论了使用统计和物理协变量来改进极端气候应用分析。他们应用了带有厄尔尼诺现象等协变量的最大似然估计来评估极端降水和径流。同样，Sugahara
    等人 [35] 使用广义帕累托分布对巴西圣保罗的非平稳极端降水进行了建模，发现极端程度和发生频率大幅上升。Yilmaz 和 Perera [40] 通过强度–持续时间–频率曲线对非平稳行为进行了建模以分析极端降雨，强调低估问题。


