    # ## 3.3 AR-Associated Precipitation


    The daily gridded total precipitation dataset from ECMWF (ERA5) obtained at 1.5°
    spatial resolution has been tracked with the availability of AR at each grid for
    the same day to explore its connectivity with AR. The precipitation received at
    a location, if found coinciding with the availability of AR condition sustaining
    for at least one time step (6-h), is considered AR-associated precipitation. For
    this, the spatial distribution of detected ARs has been superimposed with the
    total precipitation data obtained from ECMWF at the same timestep, and the fraction
    of total precipitation as AR-associated precipitation has been estimated (Fig.
    3.5).


    In the case of NDJFM seasonal climatology, the AR average daily precipitation
    is concentrated over the west coast of North America and Europe as well as the
    east coast of South America and Australia (Fig. 3.5c). Whereas, in MJJAS seasonal
    climatology, AR precipitation is more evident over central-east Asia, New Zealand,
    southmost of North America, and the southwest region of Australia (Fig. 3.5b)
    Since in some of the cases, even if an AR was present over a region, it may not
    necessarily produce precipitation unless some instability in the flow of the moisture
    (part of an AR) is caused, and if it brings precipitation in certain atmospheric
    situations, it will not be spatially equally distributed just underneath of the
    AR elongation.


