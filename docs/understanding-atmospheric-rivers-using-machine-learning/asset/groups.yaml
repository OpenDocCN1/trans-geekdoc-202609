    pivotal role in generating extreme precipitation. The findings highlighted that
    longer AR durations tended to align with extreme precipitation events, particularly
    in certain mid-latitude regions globally. However, it was noted that extreme precipitation
    along the equator did not exhibit a strong correlation with ARs due to the characteristic
    elongation of ARs from equatorial regions toward mid-latitudes.


    The geographical distribution of longer AR durations and concurrent extreme precipitation
    clustered notably along North America, South America, Europe, Central East Asia,
    and Australia. Moreover, grids with AR durations exceeding 12 h emerged as key
    contributors to precipitation extremes, showcasing importance of prolonged AR
    activity in generating extreme weather conditions (Fig. 4.2).


    Further analysis revealed that areas experiencing longer AR durations and elevated
    extreme precipitation levels often exhibited a similar pattern with IVT magnitudes.
    This parallel distribution pattern indicated a close relationship between AR intensity,
    duration, and the resulting extreme precipitation, underscoring the complex interplay
    between atmospheric moisture transport by ARs and the occurrence of extreme weather
    events.'
  md: "\nof extreme precipitation under stationary assumptions. Mondal and Mujumdar\
    \ [22] modeled extreme precipitation in India, linking physical covariates such\
    \ as climate oscillation and temperature anomaly to intensity, duration, and frequency.\
    \ The advantages of nonstationary analysis using GEV lie in its ability to capture\
    \ dynamics of hydroclimatic extremes and their underlying processes [1, 17]. By\
    \ considering the temporal variations in covariates, we can account for the changing\
    \ climate and other factors influencing extreme events. This leads to more accurate\
    \ assessments of risk and better informed decision-making in various fields, including\
    \ hydrology, climatology, and engineering.\n\n## 4.2 Case Study: Relative Role\
    \ of Climate Oscillations in Precipitation Extremes\n\n### 4.2.1 Extreme Value\
    \ Modeling\n\nExtreme value modeling was conducted to assess the impact of LSCOs\
    \ on precipitation extremes linked with ARs. The choice of nonstationary extreme\
    \ value modeling was made to account for the time-varying pattern of AR precipitation.\
    \ This study incorporated four major LSCOs (AO, NAO, ENSO, and PDO) considering\
    \ them as potential covariates influencing the extreme value distribution of precipitation\
    \ extremes. The role of LSCOs was examined by comparing the stationary and nonstationary\
    \ fit in which stationary case was considered when parameters of GEV distribution\
    \ were comparatively stationary with the time, whereas in nonstationary case,\
    \ the parameters of GEV distributions were fitting best while incorporating the\
    \ temporal variability of either LSCO or the combinations of LSCOs in precipitation\
    \ extremes. Stationarity and nonstationarity induced by these LSCOs over precipitation\
    \ extremes were assessed using several statistical tests and return levels of\
    \ these extremes under the discovered influence of these precipitation extremes\
    \ (PRCPTOT, R95TOT, Rx5day) were examined at 10, 20, 50, and 100 years in two\
    \ seasons MJJAS and NDJFM.\n\n### 4.2.2 Nonstationary Extreme Value Modeling\n\
    \nWe analyzed probabilistic distribution of precipitation extremes, PRCPTOT, R95TOT,\
    \ and Rx5day in GEV as continuous random variables. The CDF of the GEV distribution\
    \ is expressed in Eq. (4.1).\n\n\\[\nF(x, \\mu, \\sigma, \\xi) = \\begin{cases}\
    \ \n\\exp \\left\\{ - \\left[ 1 + \\frac{\\xi(x-\\mu)}{\\sigma} \\right]^{-1/\\\
    xi} \\right\\}, \\sigma > 0, 1 + \\frac{\\xi(x-\\mu)}{\\sigma} > 0, \\xi \\neq\
    \ 0 \\\\ \n\\exp \\left\\{ - \\exp \\left[ - \\frac{(x-\\mu)}{\\sigma} \\right]\
    \ \\right\\}, \\sigma > 0, \\xi = 0 \n\\end{cases}\n\\tag{4.1}\n\\]\n\nIn this\
    \ context, the analysis involves the time sequence of precipitation extremes denoted\
    \ by x, with \\(\\mu\\), \\(\\sigma\\), and \\(\\xi\\) representing the location,\
    \ scale, and shape parameters of the distribution, respectively. The CDF of x,\
    \ denoted as \\(F(x; \\mu, \\sigma, \\xi)\\), is determined by these parameters.\n\
    \nIn stationarity scenario, the GEV distribution parameters are considered constant,\
    \ while in nonstationary setup, these parameters vary over time, influenced by\
    \ either individual or group of multiple LSCOs. However, here nonstationary aspect\
    \ is applied only to the location and scale parameters, as modeling shape parameter\
    \ is complex and thus kept as it is to simplify the model. This approach allows\
    \ for modeling the influence of LSCOs on precipitation extremes using linear combinations\
    \ of covariates. References to previous works by [7, 14, 15, 17, 18, 33] support\
    \ this methodology.\n\n\\[\n\\text{M2} : X \\sim \\text{GEV}[ \\mu_0 + \\mu_2\
    \ C_2, \\sigma, \\xi ] \\tag{4.2}\n\\]\n\n\\[\n\\text{M20} : X \\sim \\text{GEV}[(\\\
    mu_0 + \\mu_3 C_3 + \\mu_4 C_4), (\\sigma_0 + \\sigma_3 C_3 + \\sigma_4 C_4),\
    \ \\xi ] \\tag{4.3}\n\\]\n\nUsing variables as AO, NAO, ENSO, and PDO as C1, C2,\
    \ C3, and C4 correspondingly in the models, a total of 28 such linear combinations\
    \ of covariates as LSCOs have been produced as of Eqs. 4.2 and 4.3 [31].\n\nHere,\
    \ in Eq. (4.2), the temporal variability of particular precipitation extreme is\
    \ being governed by the NAO only at that region which is prominently expressed\
    \ by the change in \\(\\mu\\). Similarly, in the 20th combination or model M20,\
    \ the temporal variability of particular precipitation extreme is being governed\
    \ by AO and NAO combinedly and it is expressed in terms of variation in the location\
    \ and scale parameters of GEV distribution of that individual precipitation extreme\
    \ at that region. In this consideration, 28 such combinations were made in same\
    \ manner [32].\n\n### 4.2.3 Estimation of GEV Parameters\n\nThe significance of\
    \ these models was evaluated using likelihood ratio test (LR test) [5]. This test\
    \ serves to prioritize between stationary and nonstationary cases. The selection\
    \ criterion is made on the statistic derived from Eq. 4.4:\n\n\\[\n2[nllh(S) -\
    \ nllh(NS)] > c_\\alpha \\tag{4.4}\n\\]\n\nIn this instance, nllh(S) and nllh(NS)\
    \ denote the negative log-likelihood of stationary and nonstationary cases, respectively,\
    \ and $c\\alpha$ is the $(1-\\alpha)$ quantile of the Chi-square distribution.\
    \ The level of significance ($\\alpha$) was set at 5%. In a given significance\
    \ level, the difference between the two models was assumed to approximate a chi-squared\
    \ distribution.\n\nIn case nonstationarity is verified, the chi-squared distribution's\
    \ p-value is used to identify the optimal nonstationary model. In case the p-value\
    \ is above 0.05, the stationarity null hypothesis is considered discarded. Every\
    \ combination of the 28 nonstationary models was subjected to the LR test. Maximum\
    \ likelihood estimation approach was adopted to estimate parameters. This method\
    \ is preferred due to its ability to incorporate nonstationarity into the distribution\
    \ parameters effectively [16].\n\n\\[\nL(\\theta) = -n \\log - \\left(1 + \\frac{1}{\\\
    xi}\\right) \\sum_{i=1}^n \\log \\left[1 + \\frac{\\xi(x_i - \\mu)}{\\sigma}\\\
    right] - \\sum_{i=1}^n \\log \\left[1 + \\frac{\\xi(x_i - \\mu)}{\\sigma}\\right]^{-\\\
    left(\\frac{1}{\\xi}\\right)}, \\quad 1 + \\frac{\\xi(x_i - \\mu)}{\\sigma} >\
    \ 0 \\tag{4.5}\n\\]\n\nThe distribution parameters were obtained by minimizing\
    \ the likelihood function $L(\\theta)$, where n denotes size of sample and $\\\
    theta$ denotes parameter vector.\n\n### 4.2.4 Relative Influence of Climate Oscillation\
    \ and Influenced Precipitation Extremes\n\nUsing statistical analysis, we compared\
    \ the GEV fit of precipitation extremes in stationary (assuming GEV parameter\
    \ as constant over time or not at all influenced by LSCOs) and nonstationary cases\
    \ (GEV parameters as function of AO, NAO, ENSO, and PDO). Results revealed that\
    \ PDO (a long-lasting ENSO phenomenon) had the most significant impact on large-scale\
    \ weather patterns. In about 15% to 30% of areas, variations in extreme precipitation\
    \ were linked to seasonal PDO indices, with MJJAS indices capturing these variations\
    \ about 50% better than NDJFM. This suggests that around 30% of the region is\
    \ strongly influenced by PDO during the summer (MJJAS) [32]. Only a small percentage\
    \ (less than 1%) of areas showed a good fit with stationary models for instant\
    \ extreme precipitation (Rx1day and Rx5day), while this increased to about 14%\
    \ for cumulative extreme precipitation (R95pTOT) across both seasons. Stationary\
    \ extremes were mostly observed in areas with very little or no historical precipitation\
    \ data.\n\nReturn levels of extreme precipitation were estimated over different\
    \ time frames to assess vulnerability. Higher magnitudes were observed along the\
    \ equator and in certain extratropical regions, while polar regions and arid areas\
    \ showed near-zero return levels due to minimal rain or ice contributions. North\
    \ America and Europe, parts of South America, Africa, and Australia were identified\
    \ as more vulnerable to extreme precipitation (Fig. 4.1). The extremes expressed\
    \ in terms of return levels varied slightly between seasonal covariate combinations,\
    \ particularly noticeable along equatorial and mid-latitude regions. The high\
    \ magnitude of extremes associated with MJJAS-LSCOs was mainly observed in South\
    \ America, East Asia, and Australia, while along equatorial and mid-latitude regions\
    \ of the southern hemisphere in NDJFM-LSCOs.\n\n## 4.3 Precipitation Extremes\
    \ and AR\n\nThe precipitation extremes were concentrated around the equator or\
    \ in specific mid-latitude zones. As ARs play a significant role in transporting\
    \ moisture poleward and contribute substantially to the total annual water supply\
    \ in mid-latitudes, we analyzed the variability in spatial extent of these precipitation\
    \ extremes with the significant availability of ARs.\n\n### 4.3.1 Precipitation\
    \ Extremes and AR Duration\n\nThe analysis delved into the interplay between extreme\
    \ precipitation occurrences and ARs, focusing on how AR frequency and duration\
    \ relate to significant extreme events. By setting thresholds for extreme precipitation\
    \ levels (Rx1day > 20 mm, Rx5day > 30 mm, R95pTOT > 200 mm), study explored where\
    \ and when ARs played a pivotal role in generating extreme precipitation. The\
    \ findings highlighted that longer AR durations tended to align with extreme precipitation\
    \ events, particularly in certain mid-latitude regions globally. However, it was\
    \ noted that extreme precipitation along the equator did not exhibit a strong\
    \ correlation with ARs due to the characteristic elongation of ARs from equatorial\
    \ regions toward mid-latitudes.\n\nThe geographical distribution of longer AR\
    \ durations and concurrent extreme precipitation clustered notably along North\
    \ America, South America, Europe, Central East Asia, and Australia. Moreover,\
    \ grids with AR durations exceeding 12 h emerged as key contributors to precipitation\
    \ extremes, showcasing importance of prolonged AR activity in generating extreme\
    \ weather conditions (Fig. 4.2).\n\nFurther analysis revealed that areas experiencing\
    \ longer AR durations and elevated extreme precipitation levels often exhibited\
    \ a similar pattern with IVT magnitudes. This parallel distribution pattern indicated\
    \ a close relationship between AR intensity, duration, and the resulting extreme\
    \ precipitation, underscoring the complex interplay between atmospheric moisture\
    \ transport by ARs and the occurrence of extreme weather events.\n"
  mdcn: "\n在平稳假设下的极端降水。Mondal 和 Mujumdar [22] 模拟了印度的极端降水，将气候涛动和温度异常等物理协变量与强度、持续时间和频率相关联。使用\
    \ GEV 进行非平稳分析的优势在于其能够捕捉水文气候极端及其底层过程的动态 [1, 17]。通过考虑协变量的时间变化，我们可以考虑到不断变化的气候以及影响极端事件的其他因素。这导致在包括水文学、气候学和工程在内的各个领域进行更准确的风险评估和更明智的决策。\n\
    \n## 4.2 案例研究：气候涛动在降水极端中的相对作用\n\n### 4.2.1 极值建模\n\n进行了极值建模，以评估 LSCOs 对与 ARs 相关的降水极端的影响。选择非平稳极值建模是为了考虑\
    \ AR 降水的时变模式。本研究纳入了四个主要 LSCOs（AO、NAO、ENSO 和 PDO），并将其视为影响降水极端极值分布的潜在协变量。LSCOs 的作用通过比较平稳和非平稳拟合来考察，当\
    \ GEV 分布的参数随时间大致保持平稳时，认为是平稳情况；而在非平稳情况下，GEV 分布的参数在纳入降水极端中单个 LSCO 或 LSCO 组合的时变性时拟合效果最好。这些\
    \ LSCOs 在降水极端上诱导的平稳性和非平稳性使用多种统计检验进行了评估，并且在发现这些降水极端（PRCPTOT、R95TOT、Rx5day）的影响下，对这些极端在\
    \ 10、20、50 和 100 年重现期以及两个季节 MJJAS 和 NDJFM 中的重现水平进行了考察。\n\n### 4.2.2 非平稳极值建模\n\n\
    我们将降水极端（PRCPTOT、R95TOT 和 Rx5day）在 GEV 中作为连续随机变量进行概率分布分析。GEV 分布的累积分布函数（CDF）如式 (4.1)\
    \ 所示。\n\n\\[\nF(x, \\mu, \\sigma, \\xi) = \\begin{cases} \n\\exp \\left\\{ - \\\
    left[ 1 + \\frac{\\xi(x-\\mu)}{\\sigma} \\right]^{-1/\\xi} \\right\\}, \\sigma\
    \ > 0, 1 + \\frac{\\xi(x-\\mu)}{\\sigma} > 0, \\xi \\neq 0 \\\\ \n\\exp \\left\\\
    { - \\exp \\left[ - \\frac{(x-\\mu)}{\\sigma} \\right] \\right\\}, \\sigma > 0,\
    \ \\xi = 0 \n\\end{cases}\n\\tag{4.1}\n\\]\n\n在此背景下，分析涉及用 x 表示的降水极端时间序列，其中 \\\
    (\\mu\\)、\\(\\sigma\\) 和 \\(\\xi\\) 分别表示分布的位置参数、尺度参数和形状参数。x 的 CDF，记为 \\(F(x; \\\
    mu, \\sigma, \\xi)\\)，由这些参数决定。\n\n在平稳场景下，GEV 分布参数被视为常数，而在非平稳设置中，这些参数随时间变化，受单个或多个\
    \ LSCO 组的影响。但是，此处非平稳特性仅应用于位置参数和尺度参数，因为建模形状参数比较复杂，因此保持不变以简化模型。这种方法允许使用协变量的线性组合来建模\
    \ LSCOs 对降水极端的影响。之前由 [7, 14, 15, 17, 18, 33] 的研究引用支持这一方法。\n\n\\[\n\\text{M2} :\
    \ X \\sim \\text{GEV}[ \\mu_0 + \\mu_2 C_2, \\sigma, \\xi ] \\tag{4.2}\n\\]\n\n\
    \\[\n\\text{M20} : X \\sim \\text{GEV}[(\\mu_0 + \\mu_3 C_3 + \\mu_4 C_4), (\\\
    sigma_0 + \\sigma_3 C_3 + \\sigma_4 C_4), \\xi ] \\tag{4.3}\n\\]\n\n在模型中，将 AO、NAO、ENSO\
    \ 和 PDO 变量分别作为 C1、C2、C3 和 C4 使用，根据式 4.2 和 4.3 生成了总共 28 种此类协变量线性组合作为 LSCOs [31]。\n\
    \n在此，在式 (4.2) 中，特定降水极端的时变性仅在该地区由 NAO 决定，这主要通过 \\(\\mu\\) 的变化来体现。同样，在第 20 种组合或模型\
    \ M20 中，特定降水极端的时变性由 AO 和 NAO 共同决定，并表现为该地区该特定降水极端的 GEV 分布位置参数和尺度参数的变化。在此考虑下，28\
    \ 种此类组合以相同方式制作 [32]。\n\n### 4.2.3 GEV 参数估计\n\n这些模型的显著性使用似然比检验（LR 检验）[5] 进行了评估。该检验用于在平稳和非平稳情况之间进行优先级排序。选择标准基于式\
    \ 4.4 导出的统计量：\n\n\\[\n2[nllh(S) - nllh(NS)] > c_\\alpha \\tag{4.4}\n\\]\n\n在此，nllh(S)\
    \ 和 nllh(NS) 分别表示平稳和非平稳情况的负对数似然，而 $c\\alpha$ 是卡方分布的 $(1-\\alpha)$ 分位数。显著性水平 ($\\\
    alpha$) 设定为 5%。在给定的显著性水平下，假设两个模型之间的差异近似服从卡方分布。\n\n如果验证了非平稳性，则使用卡方分布的 p 值来确定最佳非平稳模型。如果\
    \ p 值高于 0.05，则平稳性原假设被视为舍弃。对 28 种非平稳模型的每种组合都进行了 LR 检验。采用最大似然估计方法来估计参数。由于该方法能有效地将非平稳性纳入分布参数，因此更受青睐\
    \ [16]。\n\n\\[\nL(\\theta) = -n \\log - \\left(1 + \\frac{1}{\\xi}\\right) \\\
    sum_{i=1}^n \\log \\left[1 + \\frac{\\xi(x_i - \\mu)}{\\sigma}\\right] - \\sum_{i=1}^n\
    \ \\log \\left[1 + \\frac{\\xi(x_i - \\mu)}{\\sigma}\\right]^{-\\left(\\frac{1}{\\\
    xi}\\right)}, \\quad 1 + \\frac{\\xi(x_i - \\mu)}{\\sigma} > 0 \\tag{4.5}\n\\\
    ]\n\n分布参数通过最小化似然函数 $L(\\theta)$ 获得，其中 n 表示样本大小，$\\theta$ 表示参数向量。\n\n### 4.2.4\
    \ 气候涛动的相对影响及受影响的降水极端\n\n使用统计分析，我们比较了降水极端在平稳（假设 GEV 参数随时间保持不变或完全不受 LSCOs 影响）和非平稳（GEV\
    \ 参数作为 AO、NAO、ENSO 和 PDO 的函数）情况下的 GEV 拟合。结果显示，PDO（一种持久的 ENSO 现象）对大尺度天气模式影响最显著。在约\
    \ 15% 至 30% 的地区，极端降水的变化与季节性 PDO 指数相关联，MJJAS 指数捕捉这些变化的能力比 NDJFM 强约 50%。这表明，夏季（MJJAS）期间，该地区约\
    \ 30% 的区域受 PDO 强烈影响 [32]。只有极少数地区（不到 1%）的瞬时极端降水（Rx1day 和 Rx5day）与平稳模型拟合良好，而对于累积极端降水（R95pTOT），这一比例在两个季节中增加到约\
    \ 14%。平稳极端主要出现在历史降水数据极少或没有的地区。\n\n## 4.3 降水极端与 AR\n\n降水极端集中在赤道附近或特定的中纬度地区。由于 ARs\
    \ 在向极地输送水分方面发挥重要作用，并对中纬度地区的年总水供应作出重大贡献，我们分析了这些降水极端在空间范围上的变异性，前提是 ARs 的显著可用性。\n\
    \n### 4.3.1 降水极端与 AR 持续时间\n\n分析深入探讨了极端降水发生与 ARs 之间的相互作用，重点关注 AR 频率和持续时间如何与显著极端事件相关联。通过设定极端降水水平阈值（Rx1day\
    \ > 20 mm，Rx5day > 30 mm，R95pTOT > 200 mm），研究探讨了 ARs 在何处和何时在产生极端降水中起关键作用。研究结果表明，较长的\
    \ AR 持续时间倾向于与极端降水事件一致，特别是在全球某些中纬度地区。但是，人们注意到，赤道沿线的极端降水与 ARs 之间并不表现出强烈的相关性，这是由于\
    \ ARs 从赤道地区向中纬度地区延伸的特征所致。\n\n较长 AR 持续时间与同时发生的极端降水的地理分布显著集中在北美洲、南美洲、欧洲、中东亚和澳大利亚沿线。此外，AR\
    \ 持续时间超过 12 h 的网格成为降水极端的关键贡献者，凸显了长时间 AR 活动在产生极端天气条件中的重要性（Fig. 4.2）。\n\n进一步分析表明，经历较长\
    \ AR 持续时间和升高极端降水水平的地区通常表现出与 IVT 幅度相似的模式。这种平行分布模式表明 AR 强度、持续时间及其产生的极端降水之间存在密切关系，强调了\
    \ AR 大气水分输送与极端天气事件发生之间的复杂相互作用。\n"
