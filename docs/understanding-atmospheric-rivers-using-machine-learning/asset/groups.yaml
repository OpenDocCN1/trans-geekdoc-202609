    图 1.5. **a** 2017年5月4日，加拿大魁北克省加蒂诺的被淹住宅街道 [来源 61]；**b** 2017年5月7日，加拿大魁北克省里戈被淹住宅区一名居民从家中搬出财物
    [来源 62]


    2005年7月26日08:30起，在24小时内降雨量达到创纪录的994毫米，导致孟买城市陷入停滞。事件发生后，孟买市辖区内的滑坡和突发洪水造成至少419人丧生，其中包括16,000头动物，另有216人死亡归因于洪水相关疾病
    [59]。后果还包括超过100,000座住宅和商业建筑以及30,000辆车辆受损 [60]。


    洪水还导致巨大的经济损失，企业遭受业务中断以及房产和基础设施损坏。从7月23日起，印度西海岸出现向印度马哈拉施特拉邦移动的显著水汽转移。这些代表潜在大气河的强烈IVT特征持续了数天，跨越了7月最后一周和8月第一周（图
    1.8）。由于这些强烈IVT特征集中在印度半岛，一个高强度的大气河在该地区连续数天被持续识别，如图 1.9 所示。


    自7月23日起的几天内，大量水汽集中于该地区，代表马哈拉施特拉邦沿海城市孟买上空大气河的这种强烈水汽引起的不稳定性将导致极端降水。即使在这场大雨过后，该地区仍在数天内保持强烈水汽，并且西太平洋上游地点的水汽迅速增强（图
    1.8）。


    这些大气河可能带来从主要有益到主要危害的区域影响，具体取决于大气河的强度和取向以及登陆部分的大气河。中纬度大陆每年被观察到会经历大气河的显著影响。这些大气河还对极地地区的降雪作出贡献。观察大气河的全球影响，研究大气河的详细影响和驱动因素变得重要。


