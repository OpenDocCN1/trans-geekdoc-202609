    studies with extreme flooding resulted from heavy precipitation have been analyzed
    in connection with ARs. The case studies were also analyzed to validate the algorithm
    used for the characterization of ARs. We have found that the heavy precipitation
    in Mumbai City of India on July 2005, Quebec Province of Canada on May 2017, and
    Kerala State of India on August 2018 were concurrent with consistent presence
    of AR with high intensity over the region during that time.


