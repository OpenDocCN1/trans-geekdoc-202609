    # ## 4.5 Conclusions


    Climate oscillations exert a profound influence on global weather systems and
    regional hydrology, with their intricate dynamics interacting closely with atmospheric
    rivers (ARs). These interactions have substantial implications for climate variability,
    extreme weather occurrences, and the management of water resources. Notably, Large-Scale
    Climate Oscillations (LSCOs) like ENSO, NAO, and AO are pivotal in shaping these
    phenomena, showing clear connections to AR behavior in regions such as North America
    and Europe. For example, shifts in AR frequency during El Niño phases illustrate
    how LSCOs can modulate AR dynamics, affecting different regions in diverse ways
    and highlighting the complexity of their relationships.


    This study conducted a detailed analysis that compared stationary and nonstationary
    models using statistical techniques, focusing on key factors like AO, NAO, ENSO,
    and PDO. The findings underscored the significant impact of PDO, a long-lasting
    ENSO phenomenon, on large-scale weather patterns, especially evident during the
    summer months. Additionally, the study revealed that seasonal PDO indices, particularly
    those for MJJAS, were more effective in capturing variations in extreme precipitation
    events compared to other indices, indicating a strong influence of PDO on precipitation
    patterns in specific regions.


    A better knowledge of these interconnections is important for improving the accuracy
    of AR predictions across different time scales and for developing effective strategies
    to manage risks related to climate extremes. Collaborative efforts and advancements
    in scientific research play essential roles in this endeavor, as they contribute
    to better forecasting capabilities, water resource management practices, and enhanced
    resilience with evolving climate conditions. The insights of study into the complex
    interplay between climate oscillations, ARs, and precipitation extremes provide
    a valuable foundation for refining risk assessment methodologies and implementing
    targeted management strategies in vulnerable regions worldwide.


    # ## References


    +   1. V. A. Gilan, N.V. Umamahesh, What are the best covariates for developing
    non-stationary rainfall intensity-duration-frequency relationship? Adv. Water
    Resour. **101**, 11–22 (2017). https://doi.org/10.1016/j.advwatres.2016.12.016

    +   2. V. A. Gilan, N.V. Umamahesh, El Niño Southern Oscillation cycle indicator
    for modeling extreme rainfall intensity over India. Ecol. Ind. **84**, 450–458.
    https://doi.org/10.1016/j.ecolind.2017.09.012

    +   3. D. Baldan, E. Coraci, F. Crosato, M. Ferla, A. Bonometto, S. Morucci, Importance
    of non-stationary analysis for assessing extreme sea levels under sea level rise.
    Nat. Hazard. **22**(11), 3663–3677 (2022). https://doi.org/10.5194/nhess-22-3663-2022

    +   4. C. Bracken, K.D. Holman, B. Rajagopalan, H. Moradkhani, A Bayesian hierarchical
