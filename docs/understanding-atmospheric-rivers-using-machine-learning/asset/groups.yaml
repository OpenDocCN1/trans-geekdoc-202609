    ## 1.3.2 ARs形成和增强机制


    关于陆地中纬度地区极端冬季降水事件的研究一直揭示其与温带气旋有很强的关联 [26]。当气旋暖区的温暖湿润空气与高地接触时，如美国西海岸的情况 [55]，这些强降水事件经常发生。这种相互作用会导致降水量大幅增加，取决于AR的大小和形状以及相互作用角度
    [20]。根据Bader和Roach（1977）的说法，这些事件可以通过中尺度和大尺度天气过程在地形降水增强机制（称为“播种-供给”机制）内的相互作用来描述。这种供给云通常覆盖着一座山丘或小山。这一现象导致盖云下方的高地降水比附近平原更明显。重要的是，这种机制并不显著改变与气旋相关的总体降水，而是用于重新分配降水，将其集中在高地区域
    [27, 53]。该过程的有效性取决于是否存在足够强、低层湿润气流，以保持地形供给云中的云水含量，并确保来自播种云的连续降水供应。


    ## 1.3.3 理解ARs的影响


    已开展研究以识别登陆ARs的显著影响。由ARs驱动的降水贡献也可以为识别与洪水相关的AR易受损地区提供洞察。已经分析了一些与极端洪水相关的重大降水个案研究，以关联ARs。这些个案研究也被分析以验证用于AR表征的算法。我们发现，2005年7月印度孟买市、2017年5月加拿大魁北克省和2018年8月印度喀拉拉邦的重大降水与该地区在此期间持续存在的高强度AR同时发生。


    ## 1.4 个案研究


    ### (a) 喀拉拉邦洪灾（2018年8月）


    2018年8月喀拉拉邦洪灾是一场发生在印度南部喀拉拉邦的毁灭性自然灾害。该州在季风季节经历了异常极端的降水，导致该州许多地方出现严重洪灾和滑坡（图1.2和1.3）。洪灾是由西南季风引发的，西南季风于2018年6月初到达喀拉拉邦。然而，它在8月第2周显著升级，导致持续降雨和广泛洪灾。根据印度中央水利委员会（CWC）2018年的报告，该州在2018年6月1日至8月19日期间降雨量为2394.4毫米，超过了预期的1649.5毫米。最显著的降雨发生在8月的头3周，该州在此期间接收到的降水量约为通常量的三倍
    [5]。这种强降水导致众多河流和支流泛滥，造成低洼地区洪灾，并使成千上万居民流离失所。


    倾盆大雨和洪灾对喀拉拉邦的基础设施、农业和经济造成了灾难性影响。该州经历了房屋、建筑物、道路、桥梁和其他关键基础设施的大规模破坏。众多村庄和城镇完全被淹没，通信和交通系统都面临严重中断。喀拉拉邦14个地区中有13个在2018年8月13日至17日期间因强降雨而遭受广泛洪灾
    [24]。根据2018年收入和灾害管理部门的报告，2018年喀拉拉邦洪灾造成500多人死亡，775个乡镇被淹。由于ARs可以携带大量水汽并在较短时间内导致极端降水。为了了解8月13日至17日极端降雨的原因，我们探索了IVT特征和强烈AR条件的可能性（图1.2）。


    这些强烈的IVT特征使用定义的阈值进行了分析，以识别2018年8月12日至20日期间的ARs，并在多个步骤中识别了具有强烈IVT特征的ARs（图1.3）。图1.4展示了2018年8月16日00:00和06:00的两个这样的时间步。


    分析表明，印度喀拉拉邦在2018年8月13日至17日经历的极端降水是由AR驱动的。


    ### (b) 加拿大魁北克洪灾（2017年5月）


    据报道，共有5,371套住宅被淹，约4,066人被迫撤离家园，该地区约261个市镇受到影响（Lin et al. 2019）（图1.5）。加拿大气象与海洋学会将洪灾列为2017年第三大天气事件
    [29]。为应对情况的严重性，蒙特利尔和拉瓦勒两市宣布进入紧急状态。


    2017年5月第一周，具有强烈特征的ARs持续覆盖魁北克省，并可能对该期间的强降水和降雪负责（图1.6）。


    ### (c) 孟买洪灾（2005年7月）


    2005年7月26日，该城市在季风季节经历了异常强降雨，导致严重洪灾和广泛混乱 [17]。倾盆大雨始于7月26日凌晨，持续数小时，导致多条河流和排水系统溢出。洪灾对建筑物、房屋和公共基础设施造成了重大损害（图1.7）。


