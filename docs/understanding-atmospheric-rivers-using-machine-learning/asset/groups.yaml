    respective regions. Studies have shown significant connections between LSCOs and
    ARs along the west coasts of North America and Europe [11, 13]. Research conducted
    in Europe has revealed links between LSCOs and ARs, such as the Scandinavian pattern
    and the NAO [19]. Global analyses of ARs and LSCOs have shown their influences
    on AR precipitation during elongated season from October to March, which aligns
    with the peak activity of these modes [13, 25].


    During El Niño phases, ARs become less frequent in mid-to-high latitudes, while
    positive anomalies of AR frequency are associated with specific phases of the
    Madden–Julian Oscillation (MJO) [11]. The AO and PNA patterns influence AR frequency
    in various regions, with positive and negative phases leading to different outcomes.
    Given that the modes operate on distinct timeframes, these relationships between
    ARs and LSCOs have consequences for sub-seasonal, seasonal, and long-term prediction
    [9, 12]. The way that AO and PNA affect AR intensity is consistent with how they
    affect AR precipitation [11, 12]. These modes do, however, have a more localized
    effect on AR precipitation, indicating the necessity of taking into account both
    large-scale modes and regional and local-scale variability. To gain a deeper knowledge
    of the mechanisms determining AR frequency and precipitation across various regions,
    seasons, and climate regimes, more research is required.


    Traditional stationary models assume that the underlying statistical properties
    of extreme events remain constant over time [16]. However, in many cases, this
    assumption does not hold due to climate change and other dynamic factors. The
    stationary limitations arise from the inability to capture the temporal evolution
    and variability of extremes [4, 38]. Climate change, land use changes, and other
    anthropogenic factors can significantly alter the distribution and occurrence
    of extremes [14, 20]. By neglecting nonstationary behaviors, stationary models
    may provide inaccurate estimations and predictions. The nonstationary analysis
    addresses this limitation by incorporating physical processes as covariates in
    GEV models [3, 34]. These covariates can capture the influence of changing climate
    conditions on extreme events. By considering the temporal evolution of these covariates,
    nonstationary models can capture the time-varying behavior of extremes and provide
    more accurate estimations of their magnitudes and frequencies [3, 39].


    Modeling nonstationary behavior through GEV has been widely adopted in various
    fields. Researchers have utilized covariates such as anomalies of climate oscillations
    (ENSO, PNA, MJO, etc.) and SST to capture the spatiotemporal variability of climate
    extremes [14, 18, 32, 33]. By incorporating covariates into GEV models, they have
    successfully demonstrated improvements in estimating extreme event magnitudes
    and understanding their relationship with changing environmental conditions [24,
    37]. For instance, Katz [16] discussed the use of statistics and physical covariates
