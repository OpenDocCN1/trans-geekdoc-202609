    # 1.3.2 Mechanism Behind Formation and Intensification of ARs


    Research on extreme winter precipitation events in mid-latitude regions over land
    consistently reveals a strong association with extratropical cyclones [26]. These
    episodes of heavy precipitation frequently happen when warm, humid air from a
    cyclone’s warm zone comes into contact with elevated terrain, as is the case along
    the western coasts of the United States [55]. This interaction results in a substantial
    increase in precipitation depending on the size and shape of AR and the angle
    of interaction [20]. According to Bader and Roach (1977), these episodes can be
    described by the interaction of mesoscale and large-scale synoptic processes within
    a particular orographic precipitation enhancement mechanism called as the “seeder-feeder”
    mechanism. This feeder cloud typically caps a hill or a small mountain. This phenomenon
    results in more significant precipitation occurring on the elevated terrain beneath
    the cap cloud compared to nearby flatlands. Importantly, this mechanism does not
    significantly alter the overall precipitation associated with the cyclone but
    serves to redistribute it, concentrating it over regions with elevated terrain
    [27,53]. The efficacy of this process is contingent upon the presence of a sufficiently
    strong, low-level moist airflow to preserve the cloud water content within the
    orographic feeder cloud and ensure a continuous provision of precipitation from
    the seeder cloud.


    # 1.3.3 Understanding the Impact of ARs


    The study has been carried out to identify the significant impacts of landfalling
    ARs. The contributions of precipitation driven by ARs can also provide insights
