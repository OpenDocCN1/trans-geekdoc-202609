    ### 3.1 Introduction


    大气河是地球大气环流中迷人且动态的通道，充当浓缩水汽输送的导管，深刻影响区域降水模式和天气系统 [8, 26, 36]。这些大气现象在塑造水文循环中起着关键作用，并与复杂的大气和海洋过程网络密切相关
    [22, 23, 25]。大气河事件的时空分布与多种因素复杂关联，包括季节性天气变化、诸如厄尔尼诺事件等海洋温度异常以及更广泛的气候变化动态 [9, 15,
    20]。易受大气河影响的地区，如北美西海岸和欧洲的部分地区，这些现象的频率更高 [2, 5–7, 11, 29]。这种高频现象通常在特定季节观测到，当时大气条件有利于大气河的形成和传播
    [4, 18]。来自大气河的显著水汽涌入对这些地区的年降水总量作出重大贡献，在补充水资源和维持生态系统方面发挥着关键作用。然而，与大气河相关的降水的强烈性质也可能导致诸如洪水等挑战，尤其是在基础设施和土地利用做法不足的地区。由诸如水汽输送速率和降水水平等指标衡量的大气河事件强度，是决定相关影响严重程度的关键因素
    [28, 33, 38]。当大气河释放其含水量大的洪流时，易受强降雨和洪水影响的地区变得特别脆弱，面临一系列给基础设施带来压力、使土壤饱和并加剧水文风险的挑战
    [15, 17, 22, 23, 27]。当强大的大气河与当地地形相互作用时，复杂的大气动力学相互作用就会展开，导致强降雨，可在短时间内迅速改变地貌。这种快速转变不仅考验自然生态系统的恢复力，也考验人类的适应能力


