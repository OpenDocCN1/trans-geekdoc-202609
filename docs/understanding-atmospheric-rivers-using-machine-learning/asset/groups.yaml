    ## 第5章

    机器学习在理解和管理大气河流中的作用


    ### 5.1 引言


    认识到大气河流（ARs）在全球和区域气候学中的关键作用，人们已将大量精力投入到监测和预测其登陆时的轨迹及关键特征 [10, 11, 31, 34]。对具有延长前置时间的AR属性进行准确预测非常有价值，尤其是对于有效的洪灾灾害管理和水资源规划。传统上，天气和气候预报高度依赖数值天气预报（NWP）模型
    [20, 28]。这些模型整合了支配大气、海洋和陆地的基本物理过程，融入了源自质量、能量和动量守恒定律的原理 [4, 7, 18, 22, 30, 32,
    35]。然而，源自数值近似、模型初始化条件和固有模型约束的固有不确定性会随着时间的推移而逐渐削弱预测准确性 [3, 8, 15, 16, 29, 37, 38]。对东北太平洋地区集成预报系统的评估研究揭示了模型检测AR存在的能力。然而，这些模型在显著前置时间下准确预测登陆AR的精细细节方面面临挑战
    [23, 24, 39]。同样，Nardi等人 [20] 指出NWP模型中与AR登陆预测相关的重大预报误差。因此，人们已将精力集中在改进数据收集、凸显关键大气结构，并将这些信息无缝整合到NWP模型中以提高预测准确性
    [6, 40]。


    人工智能，计算机科学中快速发展的领域，使机器能够在无需显式编程的情况下学习、分析数据和做出决策 [3, 9, 12]。其应用涵盖多个领域，利用算法、机器学习和神经网络处理大型数据集、识别模式，并得出传统方法可能忽略的洞察
    [1, 14, 36]。AI处理复杂数据的适应性和能力使其成为解决多方面挑战的强大工具 [21, 25, 37]。近年来，AI已成为大气科学领域的变革者，特别是在理解和管理气候极端情况方面
    [17]。AI驱动的模型和算法可以显著提高AR预测准确性，从而更精确地预测AR的发生、轨迹和强度。这些先进的预测能力对于发布及时预警至关重要，从而减轻AR引发的极端天气事件的潜在影响。汲取深度学习（DL）架构理解复杂非线性关系的能力的启示，探索DL算法为把握AR中固有的动力学提供了一种替代方式。与NWP模型不同，这些数据驱动的神经网络可以通过分析给定的大气数据来随时间辨别大气条件，绕过明确建模物理过程的必要性
    [7]。


    ### 5.2 AI在理解AR中的潜在应用


    人工智能（AI）在理解和处理AR方面发挥着关键作用，以多种方式提供创新解决方案：


    - **(a) 模式识别**：最近的研究表明，机器学习（ML）算法在识别大型复杂数据集中的复杂模式方面表现更佳。当应用于大气数据时，AI可以实现与AR相关的复杂特征和相关性的识别。它可以辨别湿度含量、风行为、温度梯度和压力系统等大气变量的细微变化，这些变量表征了AR。通过分析历史数据和实时数据，AI可以帮助识别指示AR形成、演化和行为的特定特征。这种详细的模式识别增强了我们对AR如何发展、增强以及与其他天气现象相互作用的理解，有助于更准确的跟踪和预测。


    - **(b) 预测与建模**：AI驱动的模型，如深度学习算法和神经网络，彻底改变了AR的预测和建模。这些模型处理大量大气数据，学习传统模型可能遗漏的复杂关系和非线性模式。通过从数据中持续学习，AI模型提高了AR预报的精确度，以更高的准确性预测其路径、强度和持续时间。此外，这些基于AI的预测模型会随着时间的推移而适应和改进，纳入新数据并优化其预测，从而增强我们预见和准备AR相关天气事件的能力。


    - **(c) 早期预警系统**：AI驱动的早期预警系统在减轻AR相关极端天气事件影响方面可以发挥关键作用。通过将AI算法与卫星图像、雷达数据和大气传感器等多种数据源相结合，这些系统可以快速识别和跟踪AR的出现和移动。AI算法可以分析演变的大气条件，向相关部门和社区发布及时的警报和预报。这些预警可以提供必要的前置时间，使采取主动措施来减轻与AR相关的风险，例如洪水、强降雨或滑坡。因此，AI驱动的早期预警系统对最大限度地减少损失和增强灾害准备能力做出了重大贡献。


    ### 5.3 案例研究：使用深度学习模型进行AR预测


    受DL模型在解开复杂模式和提供精确预测方面的熟练技巧的启发，本研究深入探讨了采用DL技术来理解大气河流（ARs）的动力学。DL方法在不明确包含物理过程的情况下，优于典型的NWP模型来捕捉大气数据中的时空特征
    [5, 27]。本研究利用欧洲中期天气预报中心（ECMWF）的ERA5再分析数据（比湿、东西向和南北向风速）来表征AR状态。遵循[11]的方法，采用IVT特征来在每个时间步划分AR（图5.1）。本研究采用自编码器DL模型来预测即将到来的时间步中AR的存在。该研究文章的见解为大气研究人员提供了新的视角，强调了DL模型在提高AR预测的精度和可靠性方面的能力。


    ### 5.3.1 AR预测


    利用卷积自编码器捕捉空间和时态模式的能力，我们的方法涉及使用这些模型来表征AR的属性。为了训练我们的DL模型，我们采用了以6小时间隔检测到的AR地图作为输入。这些描绘AR存在的帧构成了我们建模过程的基础。所提出的自编码器架构中的卷积层在从AR帧中提取空间信息方面发挥着重要作用


