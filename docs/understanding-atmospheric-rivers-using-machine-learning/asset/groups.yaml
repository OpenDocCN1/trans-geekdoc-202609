    ### 3.2.1 大气河频率


    已对大气河的频率、持续时间和强度进行了分析，以研究其影响。大气河频率表示每个位置（网格）出现大气河条件的频率，并表示为时间步长的百分比。


    换句话说，网格在 6 小时大气河检测中表示大气河条件的时间步长百分比（1979 至 2018 年 40 年期间），被视为该网格的大气河频率。北美西部和东部、欧洲、东亚、澳大利亚、新西兰、南美洲最南部和非洲每年都会经历大量大气河。如果这些大气河在某个地区持续较长时间，可能会给这些地区带来从有益到灾难性的影响。


    深绿色区域表示 MK z 统计量小于 –1.96，代表显著下降趋势；红色表示“z”大于 1.96，代表


    ![](img/71a0ec63e9052cfd3c03275806bd398d_42_0.png)


    图 3.1 a 每个网格的大气河频率（以时间步长百分比表示）；b Mann–Kendall 趋势检验的“z”统计量；c 5% 显著性水平下 Sen''s 斜率（“s”）


    表示数据中存在显著上升趋势，而浅绿色和黄色代表下降和上升趋势但不显著。我们观察到大气河频率总体呈上升趋势，特别是在频率较高的地区，但除少数地区外并不十分显著（图
    3.1）。Sen''s 斜率统计量的空间分布显示，在具有统计学上显著上升和下降趋势的地区，大气河频率大约增加了 0.05%。


    ### 3.2.2 大气河持续时间


    平均大气河持续时间计算为在大气河检测期间，表示大气河的网格在连续时间步长中的平均时间（图 3.2）。例如，平均大气河持续时间为 20 小时的网格表示，在检测期间的各个时间步长中，该网格平均一直代表大气河的一部分。这种评估使我们能够更好地了解易受大气河影响的地区。美国气象学会将其分为从弱到极端的类别。北美和南美西海岸、欧洲、


    ![](img/71a0ec63e9052cfd3c03275806bd398d_43_0.png)


    图 3.2 a 大气河持续时间（以区域平均持续时间表示）；b Mann–Kendall 趋势检验的“z”统计量和 Sen''s 斜率（“s”），5% 显著性水平


    东南亚和澳大利亚的平均大气河持续时间为 20 至 30 小时，这可能导致该地区从有益到毁灭性的大气河降水。大气河频率表示检测期间大气河的总体空间分布，而大气河持续时间表示表示大气河的网格的平均持续时间，这相对是大气河的离散瞬时行为。


    图 3.2b（z 统计量）显示年度平均大气河持续时间总体呈下降趋势（不显著），同样可以观察到，持续时间分布较高的地区呈上升趋势，但只有少数地区具有统计学上显著的上升趋势。具有上升趋势的地区被记录为大气河持续时间每年增加
    1 小时或更多。


    ### 3.2.3 大气河强度


    大气河强度是衡量大气河水汽携带能力的主要指标之一，由表示大气河的集合网格的 IVT（水汽输送通量）大小的变化来表示。在大气河检测中，任何时间步长被识别为对象的网格的平均
    IVT 大小表示为大气河强度。年度平均大气河强度


    ![](img/71a0ec63e9052cfd3c03275806bd398d_44_0.png)


    图 3.3 大气河强度表示为区域大气河条件时的平均 IVT 大小；Mann–Kendall 趋势检验的“z”统计量和 Sen''s 斜率（“s”），5% 显著性水平


    每个时间步长，如图 3.3 所示，指示检测到的大气河位置平均 IVT 大小的变化。强度值越高，该位置湿度密度的概率越高。与强度大小较高区域相对应的大气河形状在登陆时最有可能带来巨大洪水。大气河强度大小较高的地区（北美和欧洲西海岸、南美洲最南部、亚洲东海岸、澳大利亚最南部等）与大气河频率较高的地区重合，这意味着强度高的地区也更有可能出现高强度。


    研究发现，大气河强度随大气河频率增加而增加，但仅在一些高强度地区如此，且仅在 5% 显著性水平下在部分中纬度地区具有统计学显著性（图 3.3）。


    ### 3.2.4 登陆大气河频率


    由于这些大气河会带来洪水，并且在一些地区可能导致干旱，因此了解登陆大气河的时空特征至关重要。


    这些大气河在几乎所有大陆都有观测到，但登陆大气河的频率在北美东、西海岸、南美洲西南部、欧洲西海岸、南亚、东亚、东南亚、澳大利亚、新西兰等地相对较高。我们观察到，这些大气河在夏季（MJJAS
    气候学）比冬季（NDJFM 气候学）更频繁（图 3.4）。


    此外，发现登陆大气河频率较高的地区在十年尺度上更为一致。北美和南美东西海岸、南美洲最南部以及欧洲西海岸每年在两个季节都会经历大约 11–20 天的大气河（图
    3.4）。而东南亚、澳大利亚、新西兰和格陵兰在两个季节经历 5–10 个大气河。在两个季节中，登陆大气河在北美、南美和欧洲最为频繁。虽然 MJJAS 气候学下大气河更频繁，但亚洲和澳大利亚大陆观测到大气河频率增长最为显著。


    ## 3.3 大气河相关降水


    使用 1.5° 空间分辨率获得的 ECMWF（ERA5）每日分级总降水数据集，与同一天每个网格的大气河可用性进行了跟踪，以探索其与大气河的连通性。如果某位置接收到的降水被发现与至少持续一个时间步长（6
    小时）的大气河条件同时出现，则被视为大气河相关降水。为此，将检测到的大气河空间分布与同一时间步长从 ECMWF 获得的总降水数据进行叠加，并估计了总降水中作为大气河相关降水的比例（图
    3.5）。


    在 NDJFM 季节气候学的情况下，大气河平均日降水集中在北美和欧洲西海岸以及南美洲和澳大利亚东海岸（图 3.5c）。而在 MJJAS 季节气候学中，大气河降水在中东亚、新西兰、北美最南部以及澳大利亚西南地区更为明显（图
    3.5b）。由于在某些情况下，即使某个地区存在大气河，除非水汽（大气河的一部分）的流动出现某种不稳定性，否则不一定会产生降水；并且如果在某些大气条件下带来降水，也不会在大气河延伸正下方均匀分布。


    因此，在许多情况下，即使大气河持续存在，接收到的降水也为零，导致某地区的大气河相关降水量较小。而在某些特定情况下，这些大气河可给某个地点带来高达数百厘米的降水。这些图表可以让人了解全球接收降水的区域，以便进一步探索通过这些大气河在不同季节中降水的详细贡献（图
    3.5）。

