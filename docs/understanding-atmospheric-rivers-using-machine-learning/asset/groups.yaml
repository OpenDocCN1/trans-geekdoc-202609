    ## 4.3.2 **降水极值与 AR 频率**


    分析还利用特定阈值（Rx1day > 20 毫米、Rx5day > 30 毫米和 R95pTOT > 200 毫米）考察了降水极值与 AR 频率之间的关系。网格点被表征为
    AR 的时间步比例（占总时间步数的百分比）被视为 AR 频率。


    研究结果表明，高 AR 频率的空间范围与降水极值的大小相符。具体而言，在北半球，北美和欧洲在 NDJFM 气候学期间观察到了更高的 AR 频率及其相关重现水平。相反，在南半球，南美洲最南部和澳大利亚观察到了更多的
    AR 频率和高重现水平。这一模式表明 AR 频率与降水极值之间存在强相关性。此外，分析表明，极端降水的较高重现水平（当与季节性协变量 NDJFM 和 MJJAS
    结合时）表现出与 AR 频率相似的空间分布。而且，与高 AR 频率相关的降水极值的大小和空间范围随所考虑的更长时期（10 年或 100 年）而增加，凸显了与
    AR 活动相关的极端降水模式随时间演变的特性（图 4.3）。


    ## 4.4 **未来研究与气候适应**


    AR 受气候涛动影响，是全球水循环的关键组成部分，可补充水资源并维持生态系统。然而，极端 AR 事件可能引发水相关灾害，对人类聚居地和基础设施韧性构成挑战。为了平衡
    AR 的有益方面与其潜在危害，集成水资源管理方法、可持续资源利用和适应性生态系统策略至关重要。


    对气候涛动及其与 AR 相互作用的持续研究对于增强预测能力、提高气候建模精度和制定强有力的气候适应策略至关重要。科学家、决策者和利益相关者之间的协作努力对于实施主动措施以应对气候变率、减轻极端天气事件相关风险并在脆弱地区促进气候韧性至关重要。采用气候研究和适应的整体方法是促进不断变化的气候格局中可持续发展和环境管理的关键。


