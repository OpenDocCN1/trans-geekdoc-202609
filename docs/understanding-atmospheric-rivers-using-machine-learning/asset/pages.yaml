  md: '# # Chapter 4

    # Major Large-Scale Climate Oscillations and Their Interactions with Atmospheric
    Rivers


    # ## 4.1 Introduction


    Climate oscillations play a pivotal role in shaping global weather patterns and
    influencing various aspects of regional hydrology [6, 28]. These oscillations,
    characterized by their intricate dynamics, interact with atmospheric rivers (ARs)
    in ways that have significant implications for climate variability, extreme weather
    events, and water resource management strategies. Large-scale climate oscillations
    (LSCOs) are persistent patterns of atmospheric circulation and sea surface temperature
    (SST) anomalies and can significantly affect weather and climate at different
    spatial and temporal scales [6, 28]. ARs have been observed to be linked to well-known
    LSCOs in regions such as North America and Europe, such as El-Nino Southern Oscillation
    (ENSO), North Atlantic Oscillation (NAO), and Artic Oscillation (AO) [11, 13,
    23]. For example, during the winter of 2010–11, the simultaneous negative phase
    of two LSCOs, the Pacific/North American (PNA) pattern and the AO, was linked
    to the occurrence of an exceptionally high number of ARs in California''s Sierra
    Nevada [10]. A further study conducted in 2015 by Guan and Waliser showed that
    ARs became less common in extratropical and subtropical regions during El Niño
    phases, with notable anomalies found in the North Atlantic and the northeastern
    Pacific. Furthermore, they observed that negative anomalies in AR frequency follow
    positive anomalies during phases 5–8 of the Madden Julian Oscillation (MJO), which
    originate in East Asia and extend south of the Aleutian Islands. Accurately predicting
    ARs on various time frames requires an understanding of these relationships [21,
    27, 29, 30]. To improve our comprehension of the mechanisms influencing AR frequency
    and precipitation at several regions and climates, more investigation is required.


    LSCOs, or atmospheric teleconnection patterns, are long-term patterns of air circulation
    and sea surface temperature anomalies [26, 28]. They significantly influence weather
    patterns and climate conditions. Some widely explored LSCOs include ENSO, NAO,
    PDO, and AO [2, 8, 28, 36]. These LSCOs exhibit characteristic spatial patterns,
    extreme temperature, precipitation, and other climate variables in their'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'respective regions. Studies have shown significant connections between LSCOs
    and ARs along the west coasts of North America and Europe [11, 13]. Research conducted
    in Europe has revealed links between LSCOs and ARs, such as the Scandinavian pattern
    and the NAO [19]. Global analyses of ARs and LSCOs have shown their influences
    on AR precipitation during elongated season from October to March, which aligns
    with the peak activity of these modes [13, 25].


    During El Niño phases, ARs become less frequent in mid-to-high latitudes, while
    positive anomalies of AR frequency are associated with specific phases of the
    Madden–Julian Oscillation (MJO) [11]. The AO and PNA patterns influence AR frequency
    in various regions, with positive and negative phases leading to different outcomes.
    Given that the modes operate on distinct timeframes, these relationships between
    ARs and LSCOs have consequences for sub-seasonal, seasonal, and long-term prediction
    [9, 12]. The way that AO and PNA affect AR intensity is consistent with how they
    affect AR precipitation [11, 12]. These modes do, however, have a more localized
    effect on AR precipitation, indicating the necessity of taking into account both
    large-scale modes and regional and local-scale variability. To gain a deeper knowledge
    of the mechanisms determining AR frequency and precipitation across various regions,
    seasons, and climate regimes, more research is required.


    Traditional stationary models assume that the underlying statistical properties
    of extreme events remain constant over time [16]. However, in many cases, this
    assumption does not hold due to climate change and other dynamic factors. The
    stationary limitations arise from the inability to capture the temporal evolution
    and variability of extremes [4, 38]. Climate change, land use changes, and other
    anthropogenic factors can significantly alter the distribution and occurrence
    of extremes [14, 20]. By neglecting nonstationary behaviors, stationary models
    may provide inaccurate estimations and predictions. The nonstationary analysis
    addresses this limitation by incorporating physical processes as covariates in
    GEV models [3, 34]. These covariates can capture the influence of changing climate
    conditions on extreme events. By considering the temporal evolution of these covariates,
    nonstationary models can capture the time-varying behavior of extremes and provide
    more accurate estimations of their magnitudes and frequencies [3, 39].


    Modeling nonstationary behavior through GEV has been widely adopted in various
    fields. Researchers have utilized covariates such as anomalies of climate oscillations
    (ENSO, PNA, MJO, etc.) and SST to capture the spatiotemporal variability of climate
    extremes [14, 18, 32, 33]. By incorporating covariates into GEV models, they have
    successfully demonstrated improvements in estimating extreme event magnitudes
    and understanding their relationship with changing environmental conditions [24,
    37]. For instance, Katz [16] discussed the use of statistics and physical covariates
    to improve the analysis of extreme climatic applications. They applied the maximum
    likelihood estimation with covariates such as El-Niño phenomenon to assess extreme
    precipitation and streamflow. Similarly, Sugahara et al. [35] modeled nonstationary
    extreme precipitation in Sao Paulo, Brazil, using the General Pareto distribution
    and found a substantial rise in the degree and occurrence of extremes. Yilmaz
    and Perera [40] modeled nonstationary through intensity–duration–frequency curves
    for analyzing extreme rainfall, emphasizing underestimation'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'of extreme precipitation under stationary assumptions. Mondal and Mujumdar
    [22] modeled extreme precipitation in India, linking physical covariates such
    as climate oscillation and temperature anomaly to intensity, duration, and frequency.
    The advantages of nonstationary analysis using GEV lie in its ability to capture
    dynamics of hydroclimatic extremes and their underlying processes [1, 17]. By
    considering the temporal variations in covariates, we can account for the changing
    climate and other factors influencing extreme events. This leads to more accurate
    assessments of risk and better informed decision-making in various fields, including
    hydrology, climatology, and engineering.


    # 4.2 Case Study: Relative Role of Climate Oscillations in Precipitation Extremes


    # 4.2.1 Extreme Value Modeling


    Extreme value modeling was conducted to assess the impact of LSCOs on precipitation
    extremes linked with ARs. The choice of nonstationary extreme value modeling was
    made to account for the time-varying pattern of AR precipitation. This study incorporated
    four major LSCOs (AO, NAO, ENSO, and PDO) considering them as potential covariates
    influencing the extreme value distribution of precipitation extremes. The role
    of LSCOs was examined by comparing the stationary and nonstationary fit in which
    stationary case was considered when parameters of GEV distribution were comparatively
    stationary with the time, whereas in nonstationary case, the parameters of GEV
    distributions were fitting best while incorporating the temporal variability of
    either LSCO or the combinations of LSCOs in precipitation extremes. Stationarity
    and nonstationarity induced by these LSCOs over precipitation extremes were assessed
    using several statistical tests and return levels of these extremes under the
    discovered influence of these precipitation extremes (PRCPTOT, R95TOT, Rx5day)
    were examined at 10, 20, 50, and 100 years in two seasons MJJAS and NDJFM.


    # 4.2.2 Nonstationary Extreme Value Modeling


    We analyzed probabilistic distribution of precipitation extremes, PRCPTOT, R95TOT,
    and Rx5day in GEV as continuous random variables. The CDF of the GEV distribution
    is expressed in Eq. (4.1).'
  merge: -1
  img_proc: true
- pgno: 54
  md: '\( F(x, \mu, \sigma, \xi) = \begin{cases} \exp \left\{ - \left[ 1 + \frac{\xi(x-\mu)}{\sigma}
    \right]^{-1/\xi} \right\}, \sigma > 0, 1 + \frac{\xi(x-\mu)}{\sigma} > 0, \xi
    \neq 0 \\ \{n \text{ odd} \\ \exp \left\{ - \exp \left[ - \frac{(x-\mu)}{\sigma}
    \right] \right\}, \sigma > 0, \xi = 0 \end{cases} \) (4.1)


    In this context, the analysis involves the time sequence of precipitation extremes
    denoted by x, with \(\mu\), \(\sigma\), and \(\xi\) representing the location,
    scale, and shape parameters of the distribution, respectively. The CDF of x, denoted
    as \(F(x; \mu, \sigma, \xi)\), is determined by these parameters.


    In stationarity scenario, the GEV distribution parameters are considered constant,
    while in nonstationary setup, these parameters vary over time, influenced by either
    individual or group of multiple LSCOs. However, here nonstationary aspect is applied
    only to the location and scale parameters, as modeling shape parameter is complex
    and thus kept as it is to simplify the model. This approach allows for modeling
    the influence of LSCOs on precipitation extremes using linear combinations of
    covariates. References to previous works by [7, 14, 15, 17, 18, 33] support this
    methodology.


    \(\text{M2} : X \sim \text{GEV}[ \mu_0 + \mu_2 C_2, \sigma, \xi ]\) (4.2)


    \(\text{M20} : X \sim \text{GEV}[(\mu_0 + \mu_3 C_3 + \mu_4 C_4, ), (\sigma_0
    + \sigma_3 C_3 + \sigma_4 C_4), \xi ]\) (4.3)


    Using variables as AO, NAO, ENSO, and PDO as C1, C2, C3, and C4 correspondingly
    in the models, a total of 28 such linear combinations of covariates as LSCOs have
    been produced as of Eqs. 4.2 and 4.3 [31].


    Here, in Eq. (4.2), the temporal variability of particular precipitation extreme
    is being governed by the NAO only at that region which is prominently expressed
    by the change in \(\mu\). Similarly, in the 20th combination or model M20, the
    temporal variability of particular precipitation extreme is being governed by
    AO and NAO combinedly and it is expressed in terms of variation in the location
    and scale parameters of GEV distribution of that individual precipitation extreme
    at that region. In this consideration, 28 such combinations were made in same
    manner [32].


    # ## 4.2.3 Estimation of GEV Parameters


    The significance of these models was evaluated using likelihood ratio test (LR
    test) [5]. This test serves to prioritize between stationary and nonstationary
    cases. The selection criterion is made on the statistic derived from Eq. 4.4:


    \( 2[nllh(S) - nllh(NS)] > c \alpha \) (4.4)'
