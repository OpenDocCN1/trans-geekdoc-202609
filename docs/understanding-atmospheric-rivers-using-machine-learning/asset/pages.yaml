    # 2.4.1 Global Perspectives


    The ARDM proposed by [29] was employed on ERA-Interim IVT data spanning from 1979
    to 2015, resulting in the generation of a comprehensive global AR catalog. Their
    observations revealed an average of 11 ARs globally at a time. Different ARDMs
    proposed in various studies exhibited slight variations in terms of IVT thresholds
    and geometric criteria. Global analyses of ARs indicate that landfall locations
    are predominantly along the west coasts of major continents in mid-latitudes of
    both hemispheres [30, 33, 64] (Fig. 2.3). Coastal areas characterized by higher
    AR frequencies also exhibit higher landfall frequencies, emphasizing regions where
    AR impacts are expected to be substantial.'
