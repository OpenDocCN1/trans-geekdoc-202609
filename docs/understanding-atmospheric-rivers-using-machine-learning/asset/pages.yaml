- pgno: 27
  md: 'Two types of satellite measurements have significantly contributed to advancing
    our understanding of ARs:


    +   - **Passive Microwave Radiometric Imagery**: The integration of research aircraft
    data with this technology enabled the inaugural offshore measurements of ARs.
    Utilizing passive microwave radiometers, retrievals of IWV provide clear and detailed
    depictions of ARs. While IWV only may not provide all the characteristics of ARs,
    it becomes a potent proxy when complemented with other information, such as wind
    data [28, 83].


    +   - **Radio Occultation Measurements**: These measurements have provided useful
    water vapor profile evidence over oceans, offering unique insights into the vertical
    features of ARs [87].


    Microwave radiometry, specifically the Special Sensor Microwave/Imager (SSM/I),
    has been instrumental in revitalizing AR research [9, 63, 86]. In contrast to
    infrared-based measurements, microwave observations can penetrate the clouds often
    associated with ARs, allowing accurate measurements of IWV. SSM/I imagery has
    offered a plan-view context, facilitating the detection and study of the elongated
    nature of ARs. This led to the development of ARDM, utilizing IWV thresholds above
    20 mm for length and width requirements to effectively identify ARs [60, 88].
    The availability of daily SSM/I measurements has significantly increased the number
    of ARs that can be studied compared to research aircraft measurements. IWV imageries
    derived from satellites have been widely employed in AR domain to identify and
    characterize ARs in various regions, develop climatology, understand hydrologic
    impacts, validate forecast models and reanalyses, and support public outreach
    activities [27, 52].


    # ## 2.2.2 Reanalysis Data


    These types of data are widely used in the study of hydrometeorology owing to
    their extensive spatiotemporal coverage and detailed representation of the climate
    system [7]. Reanalysis involves the creation of the present state of the Earth
    by merging forecast and observational data, serving as a valuable tool for investigating
    large-scale weather phenomena like ARs [3, 13, 12, 54]. The introduction of NCEP–NCAR
    reanalysis datasets has significantly enhanced the exploration of the impact and
    climatology of ARs globally. These datasets, spanning from 1948 onward and relying
    on radiosonde data, have been widely employed for AR detection [3]. Modern reanalysis
    products utilizing several satellite observations provide hydro-meteorological
    observations from 1979 onward, enhancing understanding of the global water cycle
    [41]. Comparisons between reanalysis products and observations, such as aircraft
    measurements and satellite records, have indicated that AR features are generally
    well represented in reanalyses, although some errors persist, varying in magnitude
    among specific reanalysis products. Reanalysis products have'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'proven particularly valuable in AR studies due to their capacity to provide
    comprehensive information on vector winds, vertical profiles, and the state of
    the climate system. Reanalysis products have been applied in various AR research
    applications, including the examination of spatial patterns and vertical structures
    of AR landfalls, assessment of historical AR activity, development of ARDMs, and
    evaluation of global weather and climate models [10, 82, 73, 80]. The assimilation
    of satellite and other observational data in reanalysis allows for a collective
    contribution of these observations to AR studies.


    # 2.3 AR Identification


    Numerous AR identification methods have emerged, employing either IWV or IVT as
    thresholding criteria [41, 47]. These threshold values may remain constant or
    vary based on location, season, or climatology. AR identification considers geometric
    criteria like length, width, aspect ratio, and curvature. Some methods involve
    tracking ARs either spatially (Eulerian) or by following them as objects (Lagrangian)
    [16, 71, 90]. Temporal criteria, machine learning techniques, filtering out non-AR
    phenomena, and choosing between subjective analysis or objective algorithms are
    additional considerations. This array of choices has led to diverse permutations
    and a rich literature on AR identification methods.


    Initially, ARs were identified based on IWV thresholds utilizing satellite and
    aircraft observations, laying the groundwork for assessing AR contributions to
    precipitation (Fig. 2.1a). Subsequently, with the aid of reanalysis data, IVT-based
    characterization of ARs gained preference over IWV. Objective methods utilizing
    IVT thresholds were developed, enabling consistent examination of AR characteristics
    globally (Figs. 2.1 and 2.2).


    Recent endeavors have sought to establish a consensus on AR definition and identification
    methods. The ARTMIP quantifies uncertainties arising from different AR detection
    methods [68, 72, 78]. Studies within ARTMIP have revealed differences in the total
    numbers of AR detected between different algorithms, emphasizing the sensitivity
    of detection methods to geometric criteria. Nevertheless, there is relatively
    little difference in pertinent AR key attributes, such as frequency, intensity,
    and duration.


    # 2.4 Global and Local Insights


    Initially, the impacts of ARs were predominantly studied along the west coast
    of North America and Europe [11, 18, 20, 32, 40, 56, 76]. Recent research on ARs
    has expanded beyond these regions to encompass polar areas, eastern continental
    and coastal regions, and other areas historically receiving less scientific attention
    [36, 37, 42, 43, 45, 74, 79] (Fig. 2.3). These advancements, coupled with the
    necessity'
