    # 1.3.1 Historical Background


    The understanding of ARs has evolved over time, with significant contributions
    from researchers in different decades and the integration of various scientific
    disciplines.


    Newell et al. [28] conducted a groundbreaking study on “tropospheric rivers” narrow
    plumes of strong water vapor transport detected in the atmosphere. Although the
    term “Atmospheric Rivers” was not coined until later, their work laid the foundation
    for it. The study by [58] built upon these findings, coining the term “Atmospheric
    River” and establishing objective techniques for identifying them. They found
    that ARs were connected to the cold fronts of mid-latitude cyclones and played
    a major role in global water vapor transport.


    By 1998, notable advancements had been achieved in the emerging field of ARs,
    encompassing the following key developments:


    +   1 Zhu & Newell''s 1998 study significantly contributed to the progression
    of our comprehension of ARs.

    +   2 During the 1997–1998 California Land-Falling Jets (CALJET) field campaign,
    aircraft were used to provide insightful in situ data for understanding ARs.

    +   3 Availability of an adequate number of polar-orbiting SSM/I satellites facilitated
    the creation of a nearly synoptic view of integrated water vapor over global oceans.

    +   4 The release of the reanalysis data by NCEP/NCAR for AR characterization.


    During the 2000s, a groundbreaking advancement in AR research occurred with the
    introduction of satellite-based water vapor imagery utilizing the Special Sensor
    Microwave Imager/Sounder (SSM/I). This technology represented a significant milestone,
    enabling meteorologists and researchers to analyze Integrated Water Vapor (IWV)
    in near real time. The use of this imagery provided visualizations of the'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'distinctive features associated with ARs [35, 57]. This marked a substantial
    improvement over previous methods reliant on the water vapor channel, which only
    offered temperature information without directly revealing the presence and movement
    of water vapor.


    Simultaneously, the CALJET field campaign emerged as another pivotal development.
    Through this campaign, researchers gathered data by flying through extratropical
    cyclones and utilizing dropsondes to measure atmospheric conditions [25, 35, 36].
    This approach significantly enhanced our understanding of the conditions of the
    strongest water vapor transport, particularly near the low-level jet (LLJ) and
    along or ahead of the cold front. The integration of SSM/I observations and aircraft
    data provided a comprehensive view of AR structure, offering insights into the
    heavy coastal orographic precipitation experienced during AR events. The IWV-based
    Atmospheric River Detection Method (ARDM) based on IWV was validated using SSM/I
    data and aircraft observations [34, 57]. This method involved identifying ARs
    by searching for regions with large IWV meeting specific criteria, such as length,
    width, and IWV threshold, aligning with in situ observations and reanalysis data.
    While IWV remained a valuable metric, the focus shifted toward Integrated Water
    Vapor Transport (IVT), which incorporates wind information. IVT has become the
    preferred metric due to the accessibility of in situ data observation systems
    and high-quality atmospheric reanalysis products [8, 21, 22, 27, 47–49].


    During the 2000s, the exploration of ARs experienced a surge in research activity.
    Technological advancements, notably the utilization of the SSM/I, enabled more
    thorough observations and documentation of ARs. Scientists directed their focus
    toward understanding the climatology, influence on precipitation events, and hydroclimate
    impact, particularly in the western United States [3, 41, 42]. It became evident
    that ARs played a significant role in triggering extreme weather events in specific
    regions, posing distinctive challenges. In the following decade, the study of
    ARs expanded its scope, intertwining with diverse disciplines such as hydro-climatology,
    ecology, and atmospheric aerosols [2, 37, 39, 54]. Collaborative efforts across
    different fields contributed to a holistic understanding of ARs.


    At present, the community engaged in studying ARs encompasses contributors from
    various disciplines, spanning meteorology hydro-climatology, civil engineering,
    palaeoclimatology, and polar science [9, 23, 30, 33]. Numerous algorithms have
    been developed to detect and track AR conditions, identifying ARs at both regional
    and global scales. Witnessing the impact of ARs and a growing global interest
    in further exploring these findings, a collaborative initiative, the Atmospheric
    River Tracking Method Intercomparison Project (ARTMIP), was initiated in 2017
    [38, 41, 45]. This project aims to quantify uncertainties arising from different
    AR detection methods. Studies within ARTMIP have revealed variations in AR counts
    between methodologies, underscoring the sensitivity of detection methods to geometric
    criteria.'
