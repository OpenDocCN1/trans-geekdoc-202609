    The input data was prepossessed in a sequence of 11 consecutive images to train
    the proposed DL model for predicting the 11th AR frame using sequences of 10 AR
    frames. The objective was to minimize the training loss and further enhance model
    performance by optimizing the architecture. Additionally, an L2 loss was used
    as a reconstruction loss. The input data was processed in batches of 10 frames
    during training. Despite observing an increase in training loss after 23 epochs,
    we continued training for 30 epochs to ensure comprehensive learning. During the
    training period, the model achieved a minimum mean squared error loss of 0.025,
    taking approximately 61 min to complete 30 epochs.


    To verify the predictability of the model, commonly used metrics such as Structural
    Similarity Index (SSIM) and Peak Signal-to-Noise Ratio (PSNR) were used. PSNR
    assesses picture quality by comparing original and compressed images, while SSIM
    evaluates the similarity between predicted and original images. Reduced MSE and
    RMSE alongside elevated PSNR and SSIM indicate the improved predictive capabilities
    of the proposed model [33].


    An illustrative example in Fig. 5.3 showcases the predictive capabilities of the
    model, depicting the reconstruction of the next from the testing dataset, compared
    to the original. The evaluation yielded on average RMSE and MSE scores of 0.1552
