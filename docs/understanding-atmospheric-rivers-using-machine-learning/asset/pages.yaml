    flood-related illnesses [59]. The consequences also encompassed damage to over
    100,000 residential and commercial structures, along with 30,000 vehicles [60].


    The flooding also led to massive economic losses, as businesses suffered from
    disruptions and damage to property and infrastructure. From July 23 onward, there
    was a noticeable amount of moisture shift on the western coast of India heading
    toward Maharashtra, India. These intense IVT characteristics representing potential
    ARs lasted for several days in the last week of July and the first week of August
    (Fig. 1.8). Due to these intense IVT characteristics concentrated over peninsular
    India, an AR with high intensity was consistently identified over the region for
    a couple of days, as shown in Fig. 1.9.


    The heavy moisture was concentrated over the region in a couple of days starting
    from 23 July, and instability caused by that intense moisture representing as
    an AR over the coastal city of Maharashtra, Mumbai, would have resulted in extreme
    precipitation. Even after this spell of heavy rainfall, it remained consistent
    with intense moisture for some more days over the same region with rapidly intensifying
    the moisture over a location ahead in the western Pacific Ocean (Fig. 1.8).


    These ARs could bring primarily beneficial to primarily hazardous impacts over
    a region depending upon the intensity and orientation of AR and the portion of
    AR making landfall. The continents of mid-latitudes have been noticed to experience
    significant impacts of ARs annually. These ARs also contribute to snowfall in
    polar regions. Observing the global impact of ARs, it becomes important to study
    the detailed impacts, and drivers of ARs.'
