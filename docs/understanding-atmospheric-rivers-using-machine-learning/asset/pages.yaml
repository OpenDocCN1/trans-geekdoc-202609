- pgno: 55
  md: 'In this instance, nllh(S) and nllh(NS) denote the negative log-likelihood of
    stationary and nonstationary cases, respectively, and $c\alpha$ is the $(1-\alpha)$
    quantile of the Chi-square distribution. The level of significance ($\alpha$)
    was set at 5%. In a given significance level, the difference between the two models
    was assumed to approximate a chi-squared distribution.


    In case nonstationarity is verified, the chi-squared distribution''s p-value is
    used to identify the optimal nonstationary model. In case the p-value is above
    0.05, the stationarity null hypothesis is considered discarded. Every combination
    of the 28 nonstationary models was subjected to the LR test. Maximum likelihood
    estimation approach was adopted to estimate parameters. This method is preferred
    due to its ability to incorporate nonstationarity into the distribution parameters
    effectively [16].


    ```

    $L(\theta) = -n \log - \left(1 + \frac{1}{\xi}\right) \sum_{i=1}^n \log \left[1
    + \frac{\xi(xi - \mu)}{\sigma}\right]$


    $- \sum_{i=1}^n \log \left[1 + \frac{\xi(xi - \mu)}{\sigma}\right]^{-\left(\frac{1}{\xi}\right)},
    1 + \frac{\xi(xi - \mu)}{\sigma} > 0$ (4.5)

    ```


    The distribution parameters were obtained by minimizing the likelihood function
    $L(\theta)$, where n denotes size of sample and $\theta$ denotes parameter vector.


    # 4.2.4 Relative Influence of Climate Oscillation and Influenced Precipitation
    Extremes


    Using statistical analysis, we compared the GEV fit of precipitation extremes
    in stationary (assuming GEV parameter as constant over time or not at all influenced
    by LSCOs) and nonstationary cases (GEV parameters as function of AO, NAO, ENSO,
    and PDO). Results revealed that PDO (a long-lasting ENSO phenomenon) had the most
    significant impact on large-scale weather patterns. In about 15% to 30% of areas,
    variations in extreme precipitation were linked to seasonal PDO indices, with
    MJJAS indices capturing these variations about 50% better than NDJFM. This suggests
    that around 30% of the region is strongly influenced by PDO during the summer
    (MJJAS) [32]. Only a small percentage (less than 1%) of areas showed a good fit
    with stationary models for instant extreme precipitation (Rx1day and Rx5day),
    while this increased to about 14% for cumulative extreme precipitation (R95pTOT)
    across both seasons. Stationary extremes were mostly observed in areas with very
    little or no historical precipitation data.


    Return levels of extreme precipitation were estimated over different time frames
    to assess vulnerability. Higher magnitudes were observed along the equator and
    in certain extratropical regions, while polar regions and arid areas showed near-zero
    return levels due to minimal rain or ice contributions. North America and Europe,
    parts of South America, Africa, and Australia were identified as more vulnerable
    to'
