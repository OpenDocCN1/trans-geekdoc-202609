  md: '# # Chapter 2

    Characterization and Impacts

    of Atmospheric Rivers


    # ## 2.1 Introduction


    Approximately 90% of atmospheric moisture in mid-latitudes is conveyed by these
    ARs on average [89]. Scientifically recognized as atmospheric moisture transports
    or moisture conveyor belts [21], these narrow corridors with high moisture content
    dynamically alter their courses, obtaining moisture through local convergence,
    evaporation, and, at times, from distant source regions in the tropics and subtropics
    [19, 84]. Laden with substantial vapor, these moisture-laden ARs create conditions
    conducive to induced precipitation through interactions with topography [67].
    As a result, landfalling ARs can bring about significant hydrological impacts,
    including the supply of water, precipitation extremes, and related hazards. Floods
    are among the most disastrous extreme weather events and have caused devastating
    damage to infrastructure, the natural environment and human life around the world
    [13, 14, 23, 35, 59, 72]. Absence of ARs over a particular region in significant
    numbers in a year could invite drought situations. Droughts also cause several
    adverse impacts on the health of human beings, animals, vegetations, etc. [24,
    34, 39, 57, 77, 81].


    Most AR-associated precipitation and flooding events are observed in coastal regions
    of mid-latitudes. ARs contribute to around 20–30% of annual precipitation on the
    west coast of the U.S. [40], and approximately 14–44% of total precipitation in
    warm season in East Asia [36]. Globally, four to five ARs, on average, exist at
    any given time in each hemisphere, with a higher frequency over the west coasts
    of South and North America, South Africa, Europe, New Zealand, Australia, and
    Japan. The polar regions are also affected, with ARs contributing to snowfall
    [2, 86]. The socio-economic impacts of ARs extend to various western coastal regions
    worldwide, being responsible for numerous extreme precipitation events.


    ARs are renowned for generating heavy precipitation, often resulting in extreme
    rainfall events and subsequent flooding [15, 47, 53]. The concentrated moisture
    transport within ARs can lead to intense rainfall rates over short durations,
    overwhelming drainage systems and causing flash floods, riverine flooding, and
    landslides [60, 82,'
  merge: -1
  img_proc: true
- pgno: 26
  md: '83, 89. These impacts encompass property damage, infrastructure disruption,
    and threats to human safety. Of the ten deadliest floods in India from 1985 to
    2020, seven were linked to ARs [45]. In 2017, an AR hitting California caused
    an economic loss of over $1 billion, while in 2019, another AR led to severe flooding
    in northern California, resulting in damages exceeding $100 million [31]. Identifying
    regions vulnerable to AR-associated flooding is crucial for effective mitigation
    and preparedness efforts. Observing their impacts at regional and global scales
    several approaches have been introduced to characterize these ARs in the troposphere.


    Between 2005 and 2017, several field campaigns were conducted to directly observe
    vapor movement through ARs over the northeast Pacific [54]. These campaigns, such
    as “Ghost Nets” in 2005, “WISPAR” in 2011, “CalWater” in 2014 and 2015, and “AR
    Recon” in 2016, involved releasing dropsondes from weather reconnaissance aircraft
    to record various meteorological conditions at multiple pressure levels [65].
    Using these measurements, IWV and IVT were computed, offering insights into AR
    width, strength, and total IVT. The campaigns disclosed that the average AR is
    approximately 1000 km wide and transports around 5 × 10^8 kg s^-1 of water vapor,
    comparable to substantial river discharges. Observations and composite analysis
    of dropsonde transects and reanalysis data provided an understanding into the
    profile of ARs in lower troposphere. ARs intersect the warm front and undergo
    depletion through precipitation from ascent in the WCB [61]. The majority of IVT
    is found below 3 km mean sea level (MSL), with a smaller portion occurring in
    the upper jet.


    # 2.2 Observation and Detection


    # 2.2.1 Satellite-Based Observations


    Satellite observations were the initial thrust in studying the science of ARs
    [27, 52, 66, 67, 62, 88]. Satellites offer a global perspective, providing unique
    insights into various features (availability, extent, and intensity) of AR events.
    These observations are particularly valuable as they furnish information not attainable
    from other existing observing systems or numerical models.'
