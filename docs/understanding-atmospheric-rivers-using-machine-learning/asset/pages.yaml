  md: '# 1.3.2 Mechanism Behind Formation and Intensification of ARs


    Research on extreme winter precipitation events in mid-latitude regions over land
    consistently reveals a strong association with extratropical cyclones [26]. These
    episodes of heavy precipitation frequently happen when warm, humid air from a
    cyclone’s warm zone comes into contact with elevated terrain, as is the case along
    the western coasts of the United States [55]. This interaction results in a substantial
    increase in precipitation depending on the size and shape of AR and the angle
    of interaction [20]. According to Bader and Roach (1977), these episodes can be
    described by the interaction of mesoscale and large-scale synoptic processes within
    a particular orographic precipitation enhancement mechanism called as the “seeder-feeder”
    mechanism. This feeder cloud typically caps a hill or a small mountain. This phenomenon
    results in more significant precipitation occurring on the elevated terrain beneath
    the cap cloud compared to nearby flatlands. Importantly, this mechanism does not
    significantly alter the overall precipitation associated with the cyclone but
    serves to redistribute it, concentrating it over regions with elevated terrain
    [27,53]. The efficacy of this process is contingent upon the presence of a sufficiently
    strong, low-level moist airflow to preserve the cloud water content within the
    orographic feeder cloud and ensure a continuous provision of precipitation from
    the seeder cloud.


    # 1.3.3 Understanding the Impact of ARs


    The study has been carried out to identify the significant impacts of landfalling
    ARs. The contributions of precipitation driven by ARs can also provide insights
    in recognizing vulnerable regions for AR associated with floodings. Some case
    studies with extreme flooding resulted from heavy precipitation have been analyzed
    in connection with ARs. The case studies were also analyzed to validate the algorithm
    used for the characterization of ARs. We have found that the heavy precipitation
    in Mumbai City of India on July 2005, Quebec Province of Canada on May 2017, and
    Kerala State of India on August 2018 were concurrent with consistent presence
    of AR with high intensity over the region during that time.


    # 1.4 Case Studies


    # (a) Kerala Flood (August 2018)


    The Kerala floods in August 2018 were a devastating natural disaster that occurred
    in the southern Kerala, India. The state experienced unusually extreme precipitation
    during the monsoon season, leading to severe flooding and landslides in many parts
    of'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the state (Figs. 1.2 and 1.3). The floods were triggered by the Southwest Monsoon,
    which arrived in Kerala in early June 2018. However, it significantly escalated
    in the 2nd week of August, resulting in continuous rainfall and extensive flooding.
    According to reports from the Central Water Commission of India (CWC) in 2018,
    the state received 2394.4 mm of rainfall between June 1 and August 19, 2018, exceeding
    the anticipated 1649.5 mm. The most significant rainfall occurred during the first
    3 weeks of August, with the state receiving approximately three times the usual
    precipitation for that period [5]. This intense precipitation led to the overflowing
    of numerous rivers and tributaries, causing flooding in low-lying areas and displacing
    thousands of residents from their homes.


    The torrential rains and flooding had a catastrophic impact on Kerala’s infrastructure,
    agriculture, and economy. The state witnessed massive destruction of homes, buildings,
    roads, bridges, and other critical infrastructure. Numerous villages and towns
    were entirely submerged, and both communication and transportation systems faced
    severe disruptions. Thirteen out of the fourteen districts in Kerala experienced
    extensive flooding due to heavy rainfall from August 13 to 17, 2018 [24]. The
    2018 Kerala flood resulted in over 500 fatalities and the inundation of 775 townships,
    as reported by Revenue and Disaster Management in 2018. Since ARs can carry huge
    amounts of water and lead to extreme precipitation in a shorter span. To understand
    the reason behind the extreme rainfall on 13–17 August, we explored the IVT characteristics
    and possibility of conditions for an intense AR (Fig. 1.2).


    These intense IVT characteristics were analyzed with defined thresholds for identifying
    ARs during this period of August 12–20, 2018, and at multiple steps, ARs were
    identified with intense IVT characteristics (Fig. 1.3). Two such timesteps on
    August 16, 2018 at 00:00 and 06:00 were presented in Fig. 1.4.


    The analysis shows that the extreme precipitation experienced by the Indian state
    of Kerala on August 13–17, 2018 was driven by AR.


    # (b) Quebec, Canada Flood (May 2017)


    According to reports, a total of 5,371 residences were flooded, approximately
    4,066 people were forced to evacuate their homes, and around 261 municipalities
    in the region were got affected (Lin et al. 2019) (Fig. 1.5). The floods were
    ranked as the third major weather event of 2017 by the Canadian Meteorological
    and Oceanographic Society [29]. In response to the severity of the situation,
    a state of emergency was declared in the cities of Montreal and Laval.


    The ARs with intense characteristics were available consistently over the Quebec
    province during the first week of May 2017 and were potentially responsible for
    intense precipitation and snowfall during that period (Fig. 1.6).


    # (c) Mumbai Flood (July 2005)


    On July 26, 2005, the city experienced exceptionally heavy rainfall during the
    monsoon season, leading to severe flooding and widespread chaos [17]. The torrential
    rain began in the early morning of 26 July and continued for several hours, causing
    several rivers and drainage systems to overflow. The flooding caused significant
    damage to buildings, houses, and public infrastructure (Fig. 1.7).'
