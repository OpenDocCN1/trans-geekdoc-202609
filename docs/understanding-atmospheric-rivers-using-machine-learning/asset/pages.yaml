    Analyzing climate extremes involves employing sophisticated techniques, statistical
    tools, and models to scrutinize historical data and patterns [7, 14, 16, 43, 46].
    The primary objective is to comprehend the drivers, frequencies, and impacts of
    these extreme events. Understanding the mechanisms behind these deviations aids
    in formulating predictive models and refining our ability to forecast and prepare
    for extreme weather conditions [4, 16, 43]. By unraveling the complexities of
    these events, we gain insights crucial for adaptation, resilience building, and
    disaster management (Table 1.1).


    # 1.3 Atmospheric Rivers: Rivers in the Sky


    ARs represent narrow and elongated corridors of moisture-laden air moving within
    the atmosphere. These concentrated channels of water vapor transport vast amounts
    of moisture across regions, significantly impacting precipitation patterns (Fig.
    1.1). They are integral to the occurrence of intense precipitation events, contributing
    substantially to the water cycle and precipitation distribution globally.'
