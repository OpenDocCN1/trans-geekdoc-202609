- pgno: 31
  md: '# 2.4.2 Regional Perspectives


    # (a) North American West Coast


    Research on ARs over North American continent has been a focal point, yielding
    valuable insights into their climatology and impacts. Neiman et al. [52] pioneered
    the establishment of AR climatology for the region, defining ARs as filamentary
    regions of IWV with specific criteria. Subsequent studies affirmed the seasonality
    and frequency of ARs along coast. Gershunov et al. [20] employed reanalysis data,
    identifying landfalling ARs based on criteria involving IVT and IWV. Their findings
    highlighted the seasonal progression of ARs, peaking in frequency in September
    and October in British Columbia and shifting southward over subsequent months.
    Variations in the seasonality of AR landfalls emerged due to different detection
    methodologies, with IWV-based methods identifying more ARs in the warm season
    and IVT-based methods identifying more ARs in the cool season.


    # (b) Western United States


    Inland-penetrating ARs have defied conventional belief that ARs are confined to
    coastal regions, notably in western United States. These ARs can exert significant
    impacts on areas far from the coast, exemplified by the January 2010 AR event
    that brought extreme weather conditions and inflicted damage in Arizona [51].
    The event underscored the significance of specific positioning and topographical
    factors in AR impacts, including vertical phasing with upper level dynamics, weak
    static stability, strong water vapor fluxes, and large-scale dynamics. Studies
    on AR climatology in the western US, utilizing Integrated Vapor Transport (IVT)-based
    thresholds, revealed a higher frequency of ARs along the coasts of Oregon, Washington,
    and northern California (Fig. 2.3) [4, 46, 75].


    # (c) Southeastern United States


    Intense rainfall occurrences in the southeastern United States are impacted by
    different atmospheric phenomena, including cyclones, and mesoscale convective
    systems (MCSs) [6]. Recent research has shed light on the role of ARs or AR-related
    features in certain heavy precipitation scenarios, particularly during winter
    and transition seasons. A study by [44] revealed that approximately 41% of ARs
    were associated with extreme rainfall events in the southeastern United States.


    # (d) Europe


    The precipitation trends observed in Europe are impacted by the movement of moisture
    from both the North Atlantic Ocean and the Mediterranean Sea [17, 33]. ARs play
    an important role in Europe''s hydrological cycle. During winter, the moisture
    originating from the North Atlantic Ocean significantly impacts precipitation
    patterns across the entire European continent, whereas the Mediterranean Sea serves
    as a moisture source that influences southern Europe throughout the year [11,
    69]. Unlike North America, ARs in Europe are typically linked with extratropical
    cyclones and'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'have received less attention. Nevertheless, research has demonstrated their
    significance in extreme precipitation events, such as a study in Norway connecting
    an AR to heavy rainfall in [48].


    The North Atlantic Basin has given specific attention to study AR climatology
    and its consequences for Western Europe in recent research [11]. Moisture origins
    for ARs arriving in Western Europe primarily stem from subtropical regions, with
    additional input from tropical and mid-latitude areas. It is theorized that latent
    heat release within ARs influences the intensification of extratropical cyclones,
    leading to impactful weather events in Europe [40]. ARs notably impact European
    precipitation, especially during the active storm track in winter. However, their
    impact lessens during the summer months as convective weather systems become more
    prevalent. Nevertheless, regions such as the Iberian Peninsula, France, the UK,
    and western Scandinavia continue to experience significant effects from ARs in
    Europe [55, 70].


    # (e) Southern South America


    The impact of heavy rainfall linked with ARs has garnered less attention in South
    America in comparison to North America and Europe. Nonetheless, parallels can
    be drawn between the impacts of ARs on the mid-latitude west coasts of both continents,
    characterized by extensive mountain ranges on the direct way of ARs. These topographical
    features facilitate orographic precipitation processes, leading to intensified
    rainfall and snow events [86]. However, specific local variations in the topography
    of mountain ranges in South and North America, including differences in altitude,
    orientation, width, and the presence of smaller coastal ranges, result in varied
    orographic modulation and precipitation patterns linked to landfalling ARs.


    In South America, the west coast encounters substantial wintertime precipitation
    events, primarily linked to landfalling ARs, which significantly contribute to
    the annual total rainfall and snow accumulation in the Andes (specifically between
    30°S and 37°S). Typically, four to five intense wintertime heavy rainfall events
    contribute to approximately 70% of the annual precipitation, with a notable portion
    of these events attributed to ARs [1]. The presence of stronger winds and deeper
    cyclones associated with landfalling ARs tends to result in higher accumulated
    precipitation, and extreme events induced by ARs can lead to floods, landslides,
    and significant damages, particularly in regions like central Chile.


    # (f) ARs in Polar Regions


    ARs govern an important role in the poles by transporting warm, moist air toward
    the poles. When ARs reach the ice sheets of Greenland or Antarctica, they result
    in orographic uplift due to the steep slopes of these regions [22, 85]. The elevated
    terrain of Greenland and East Antarctica amplifies the impact of landfalling ARs
    on polar precipitation, akin to their influence on mountainous regions like California
    or South America. Along with triggering unusual rainfall, ARs also result in warm-air
    advection, giving rise to significant events like the melt event in central Greenland
    in July 2012 [85].'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# ## 2.5 Impacts of Atmospheric Rivers


    ARs exert substantial impacts on the regions they traverse, ranging from advantageous
    to perilous outcomes. These effects are pivotal in the context of flooding and
    water resource management. ARs frequently interact with mountainous terrain and
    WCBs in extratropical cyclones, leading to prolonged and intense precipitation
    [5, 60]. The precipitation they bring, particularly in conjunction with mountainous
    areas, can result in orographic precipitation enhancement. This process involves
    the uplift of moist air by elevated terrain, enhancing precipitation efficiency.
    Various factors, including the stability of the approaching air, wind speed, and
    characteristics of the underlying terrain, influence the interaction between ARs
    and mountains. Near-neutral stability often causes the air to flow over the mountain
    barriers. However, when ARs confront taller mountain ranges like the Sierra Nevada,
    the formation of the Sierra Barrier Jet is common which results in heavy precipitation
    [8, 28, 38].


    The impact of ARs extends beyond floods, encompassing various aspects of water
    resources. ARs play a significant role in snowpacks, landslides, groundwater recharge,
    water quality, ecosystems, and vegetation productivity [5, 60]. The heavy precipitation
    triggered by ARs has implications for these environmental components. Previous
    studies have highlighted connections between ARs and damaging winds, suggesting
    potential effects beyond precipitation extremes.


    # ## 2.6 Conclusions


    The comprehensive exploration of ARs in this article unveils their intricate nature
    and pivotal role in shaping climate extremes across the globe. By leveraging various
    observational techniques, including advanced satellite-based observations and
    reanalysis data, we have significantly enhanced our ability to identify and study
    ARs on both global and regional scales. This technological progress has opened
    new avenues for unraveling the complexities inherent in the behavior of ARs and
    their impacts on climate systems.


    Examining ARs from diverse perspectives, ranging from the North American West
    Coast to Europe, and even polar regions, has underscored their adaptability and
    distinct influence on regional climate patterns. The intricate interplay of ARs
    with large-scale climate oscillations further emphasizes the nuanced nature of
    these atmospheric phenomena. The recognition of ARs as potent drivers of climate
    extremes is a key takeaway from our exploration. From triggering heavy precipitation
    and flooding to inducing drought conditions, ARs wield significant influence on
    the climatic conditions of the regions they impact. As we gain a deeper understanding
    of these dynamics, the information becomes not only crucial for refining climate
    models but also indispensable for fortifying early warning systems and developing
    effective strategies to mitigate the adverse impacts associated with extreme weather
    events.'
