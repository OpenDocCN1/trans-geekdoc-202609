    Also, the regions with a high frequency of landfalling ARs were found to be more
    consistent on a decadal scale. The eastern and western coasts of North and South
    America, southernmost South America, and the west coast of Europe experience ARs
    for around 11–20 days in both seasons in a year (Fig. 3.4). Whereas South-east
    Asia, Australia, New Zealand, and Greenland experience 5–10 ARs in both seasons.
    In both seasons, landfalling ARs were most frequent in North America and South
    America and Europe. Although ARs were more frequent in MJJAS climatology, the
    most significant increase in AR frequency was observed in the Asian and Australian
    continents.


    # ## 3.3 AR-Associated Precipitation


    The daily gridded total precipitation dataset from ECMWF (ERA5) obtained at 1.5°
    spatial resolution has been tracked with the availability of AR at each grid for
    the same day to explore its connectivity with AR. The precipitation received at
    a location, if found coinciding with the availability of AR condition sustaining
    for at least one time step (6-h), is considered AR-associated precipitation. For
    this, the spatial distribution of detected ARs has been superimposed with the
    total precipitation data obtained from ECMWF at the same timestep, and the fraction
    of total precipitation as AR-associated precipitation has been estimated (Fig.
