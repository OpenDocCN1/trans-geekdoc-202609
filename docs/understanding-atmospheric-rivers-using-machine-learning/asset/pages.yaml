    received was null, and it resulted in a lesser magnitude of AR-associated precipitation
    at a region. While these ARs could bring as much as hundreds of centimeters of
    precipitation to a location in some specific situations. These plots could give
    an impression of the regions globally receiving precipitation throughout the globe
    to further explore the detailed contribution of precipitation in different seasons
    through these ARs (Fig. 3.5).'
