    This is probably the earliest multi-class SVM implementation and is one of the
    mostly used multi-class SVM. In this technique, we solve `m` binary SVM problems
    where `m` is the number of classes. Each SVM classifier separates one class from
    the rest of the classes. In this way, multi-class classification problem is reduced
    to binary classification problem. OVR technique is pictorially represented in
    the [Fig. 2.4](#03chap_02.xhtml#f2_4).


    ![FIGURE 2.4 One versus Rest, multi-class classification technique: An example
    of three classes A, B and C in two dimensions.](Images/fig2_4.jpg)


    FIGURE 2.4 One versus Rest, multi-class classification technique: An example of
