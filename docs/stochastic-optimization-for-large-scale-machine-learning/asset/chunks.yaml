- raw: '*Example:* Suppose the training dataset is given by *S* = {1,2,3,....,20}
    and size of mini-batch to be selected is *m* = 5, then four mini-batches can be
    selected/drawn from *S* using different sampling techniques as follows: mini-batches
    selected using random sampling with replacement are – *B*[1] = {15,2,20,2,1},
    *B*[2] = {3,10,20,6,1}, *B*[3] = {5,9,19,2,7} and *B*[4] = {1,11,18,3,16}; mini-batches
    selected using random sampling without replacement are – *B*[1] = {15,2,20,11,6},
    *B*[2] = {3,10,8,14,1}, *B*[3] = {16,4,17,7,19} and *B*[4] = {9,5,12,18,13}; mini-batches
    selected using cyclic sampling are – *B*[1] = {1,2,3,4,5}, *B*[2] = {6,7,8,9,10},
    *B*[3] = {11,12,13,14,15} and *B*[4] = {16,17,18,19,20}; and mini-batches selected
    using systematic sampling are – *B*[1] = {16,17,18,19,20}, *B*[2] = {1,2,3,4,5},
    *B*[3] = {6,7,8,9,10} and *B*[4] = {11,12,13,14,15}. As it is clear from the above
    examples, in random sampling with replacement, points are selected randomly with
    repetition inside the mini-batch or within mini-batches. CS is the simplest and
    non-probabilistic sampling, and selects the points in a sequential manner. For
    systematic sampling, first point is selected randomly then the remaining points
    are selected back to back, here idea of replacement and without replacement can
    be applied between mini-batches but only sampling without replacement within mini-batches
    is demonstrated.


    It is interesting to note that for RS, data points of the mini-batch are dispersed
    over the different sectors of the disk, so every data point needs its own seek
    time and latency time. Since the data is read block-wise and not content-wise
    so it is possible that each data point is present in a different block and thus
    needs its own transfer time also. For CS, only one seek time is needed for one
    mini-batch because it starts with first data point and then moves till end and
    for SS, one seek time is needed per mini-batch because only first element is determined
    randomly but rest points of the mini-batch are stored on contiguous memory locations.
    So, seek time is the least for CS and the most for RS. The transfer time is almost
    equal for CS and SS but less as compared with RS because in RS, generally, each
    data point needs a separate transfer time but for other case it needs as many
    transfer times as the number of blocks required to fit the mini-batch of data
    points. Thus, the overall access time to access one mini-batch of data points
    is minimum for CS and is maximum for RS. It is observed that RS gives the best
    solution as compared with the CS for a given number of epochs but the access time
    of RS is the most. On the other hand for CS the access time is the least for a
    given number of epoch but the convergence is the slowest. So, there is a trade-off
    between reducing the data access time and convergence of learning algorithm. SS
    balances this trade-off since SS has the best of both techniques, like CS the
    data points are stored on the contiguous memory locations and like RS it has some
    randomness as it draws the first point randomly. Overall, methods using CS and
    SS converges faster as compared with methods using RS, as discussed in [Sec. 5.4](#07chap_05.xhtml#sec5_4).


    ### 5.2.2  Learning Using Systematic Sampling


    A general learning algorithm with systematic sampling to solve large-scale problems
    is given by [Algorithm 14](#07chap_05.xhtml#algorithm_14). Similar learning algorithms
    can be obtained for cyclic and random sampling techniques by using the corresponding
    sampling technique for selecting the mini-batch at Step 14 of Algorithm 14. The
    algorithm starts with the initial solution. It divides the dataset into *m* mini-batches
    using systematic sampling for selecting mini-batches. Inside the inner loop, it
    takes one mini-batch *B*[*j*], formulates a subproblem over *B*[*j*] and solves
    the sub-problem thus formed. This process is repeated until all the sub-problems
    over all *m* mini-batches are solved. Then this solution process is repeated for
    the given number of epochs or other stopping criteria can be used in the algorithm.
    At Step 14 of Algorithm 14, different solvers can be used to update the solution,
    like, SAG (Stochastic Average Gradient) \[115\], SAGA \[35\], SVRG (Stochastic
    Variance Reduced Gradient) \[63\], SAAG-II (Stochastic Average Adjusted Gradient)
    \[23\] and MBSGD (Mini-Batch Stochastic Gradient Descent) \[23, [32](#bib.xhtml#refbib_32)\].


    ![](Images/algo14.jpg)


    ## 5.3  Analysis


    The proposed sampling techniques are simple but effective for solving large-scale
    learning problems with different solvers, as discussed in [Section 5.4](#07chap_05.xhtml#sec5_4).
    The convergence proof of learning algorithms have been provided using the simplest
    solver MBSGD (mini-batched Stochastic Gradient Descent) method with constant step
    size, for the simplicity of proofs as the focus of study is only on sampling techniques
    and not on solvers. *l*2-regularized ERM problem has been solved under the following
    assumptions to demonstrate the efficacy of proposed sampling techniques. It is
    assumed that the regularization term is hidden inside the loss function term for
    notational convenience otherwise it needs to write separate gradients for regularization
    term.


    ## 5.4  Experiments


    ### 5.4.1  Experimental Setup


    Experiments have been performed using five methods, namely, SAG, SAGA, SAAG-II,
    SVRG and MBSGD with eight bench marked datasets (details are given in the Table
    1.1). Each method has been run with two mini-batches of size 500 and 1000 data
    points, and two techniques to find step size, namely, constant step size method
    and backtracking line search (LS) method for a predefined number of epochs. Constant
    step size method uses Lipschitz constant *L* and takes step size as 1/*L* for
    all methods. Backtracking line search is performed approximately only using the
    selected mini-batch of data points because performing backtracking line search
    on whole dataset could hurt the convergence of learning algorithm for large-scale
    problems by taking huge time. For one dataset, one method runs for 12 times (3(sampling techniques) × 2(mini-batches) × 2(step size finding techniques)),
    and for one dataset, three sampling techniques are compared on 20 different settings
    (5(methods) × 2(mini-batches) × 2(step size finding techniques)). Thus, 160(20 × 8(datasets))
    settings have been used to compare the results for three sampling techniques.
    As training time depends on the configuration of machine over which experiments
    are performed so this is to be noted that all the experiments have been conducted
    on MacBook Air (8GB 1600 MHz DDR3, 256GB SSD, 1.6 GHz Intel Core i5).


    ### 5.4.2  Implementation Details'
