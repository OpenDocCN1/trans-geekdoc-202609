- raw: 'Big data challenge is one of the major challenge in machine learning and stochastic
    approximation is one of the important approach to deal with large-scale learning
    problems, as discussed in detail in [Chapter 3](#05chap_03.xhtml). Sampling plays
    an important role in the convergence and training time of learning algorithms.
    For selecting one data point or mini-batch of data points from the dataset in
    stochastic approximation approach, random sampling (e.g., \[19, 35, 63, 115, 148\])
    is widely used, and other sampling techniques are importance sampling (e.g., \[34,
    [151](#bib.xhtml#refbib_151)\]), stratified sampling \[[150](#bib.xhtml#refbib_150)\]
    and adaptive sampling \[[48](#bib.xhtml#refbib_48)\]. Importance sampling is a
    non-uniform sampling technique, which uses properties of data for finding probabilities
    of selection of data points in the iterative process, leading to the acceleration
    of training process. Importance sampling involves some overhead in calculating
    the probabilities and the average computational complexity per iteration of importance
    sampling could be more than the computational complexity of the iteration in some
    cases, like, when it is implemented dynamically. Stratified sampling technique
    divides the dataset into clusters of similar data points and then mini-batch of
    data points are selected from the clusters. In adaptive sampling \[48\], information
    about the classes, i.e., data-labels is used for selecting the data points; this
    technique gives good results for problems with large number of classes. Random
    sampling is widely used in mini-batching for large-scale learning problems (e.g.,
    \[19\]), as only \[34\] is known importance sampling technique in mini-batching.
    In this chapter, we have focused on simple sampling techniques which do not involve
    any extra overhead and can be effective for dealing with large-scale learning
    problems. Two simple sampling techniques, namely, systematic sampling and cyclic/sequential
    sampling techniques have been proposed for selecting mini-batches. To the best
    of our knowledge, systematic sampling is not used in machine learning for selecting
    data points. We are the first to introduce systematic sampling in machine learning
    for the selection of mini-batches of data points from the dataset. Before this,
    cyclic sampling was used in coordinate descent and block coordinate descent methods
    (e.g.,\[137\]) for selecting one coordinate or block of coordinates, respectively,
    and to the best of our knowledge, cyclic sampling is not used for selecting mini-batches.
    Both sampling techniques are simple, effective and easy to implement. The proposed
    sampling techniques try to reduce the training time of models by reducing the
    data access time because these are based on contiguous access of data. Before
    this, for reducing the training time of models, the focus is mainly given on reducing
    the processing time, but this chapter has focused on reducing the data access
    time by changing the sampling techniques.


    ### 5.1.3  Contributions


    The contributions of the article are summarized below:


    *   Novel systematic sampling and sequential/cyclic sampling techniques have been
    proposed for selecting mini-batches of data points from the dataset for solving
    large-scale learning problems. The proposed techniques focus on reducing the training
    time of learning algorithms by reducing the data access time, and are based on
    simple observations that data stored on the contiguous memory locations are faster
    to access as compared with data stored on dispersed memory locations. To the best
    of our knowledge, this chapter is the first to focus on reducing data access time
    to reduce the overall training time for machine learning algorithms.


    *   Proposed ideas are independent of problem and method used to solve problem
    as it focuses on data access only. So, it can be extended to other machine learning
    problems.


    *   Experimental results prove the efficacy of systematic sampling and cyclic
    sampling in reducing the training time, and show up to six times faster training.
    The results have been provided using five different methods (SAG, SAGA, SVRG,
    SAAG-II and MBSGD) each using two step determination techniques (constant step
    size and backtracking line search methods) over eight bench marked datasets.


    *   Theoretical results prove similar convergence for learning algorithms using
    cyclic and systematic sampling, as for widely used random sampling technique,
    in expectation.


    ## 5.2  Systematic Sampling


    Sampling is the way of selecting one mini-batch of data points (or one data point)
    from the whole dataset. Iterative approximation methods used for solving the problem
    use sampling again and again during each iteration/epoch. The convergence of learning
    algorithm depends upon the type of sampling used since sampling controls two things:
    data access time and diversity of data. In general, when consecutive data points
    are used they reduce the data access time which reduces the training time but
    selected data points might not be diverse which affects the convergence of learning
    algorithm. On the other hand, when data is used from different locations then
    the data access time is more which increases the training time but selected data
    points might be diverse which can improve the convergence. Thus, sampling has
    a significant role in the learning algorithms. Three sampling techniques, namely,
    random sampling, cyclic sampling and systematic sampling are discussed below and
    used in learning algorithm as they are simple, easy to implement and do not involve
    any extra overhead and thus effective in handling large-scale problems.


    ### 5.2.1  Definitions


    Suppose a mini-batch *B* of *m* data points is to be selected from a training
    dataset {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*l*],*y*[*l*])} of *l* data
    points.


    1.  *Random Sampling:* Random sampling (RS) can be of two types, RS with replacement
    and RS without replacement. RS with replacement first selects one data point randomly
    from the whole dataset where each data point has equal probability of selection,
    then, similarly, second data point is selected randomly from the whole dataset
    where previously selected point has equal probability of selection, and so on
    to select *m* data points. RS without replacement first selects one data point
    randomly from the whole dataset where each data point has equal probability of
    selection, then, similarly, second data point is selected randomly from the remaining
    *l* − 1 points without considering the previously selected point, and so on to
    select *m* data points.


    2.  *Cyclic/Sequential Sampling:* First mini-batch is selected by taking the first
    1 to *m* points. Second mini-batch is selected by taking next *m* + 1 to 2*m*
    points and so on until all data points are covered. Then again start with the
    first data point.


    3.  *Systematic Sampling*: \[93, 94\] It randomly selects the first point and
    then selects the remaining points according to a fixed pattern, e.g., it randomly
    selects a data point, say *i*, and then selects data points as *i*, *i* + *k*, ..., *i* + (*m* − 1)*k*
    as mini-batch where *k* is some positive integer. For simplicity, *k* = 1 can
    be taken.'
