    ![FIGURE 3.2 线搜索方法（左侧）和使用 Lipschitz 常数的常数步长（右侧）在 SUSY 数据集上的相对于训练时间的次优性。](img/fig3_2.jpg)


    FIGURE 3.2 线搜索方法（左侧）和使用 Lipschitz 常数的常数步长（右侧）在 SUSY 数据集上的相对于训练时间的次优性。


    ## 3.5 结论与未来展望


    在本章中，小批量和块坐标设置，即随机近似和坐标下降方法的结合，已被提出作为可扩展优化框架，即 BBOF，与任何求解器无关，用于解决大数据问题。但观察到，随机近似和坐标下降结合在一起时效果不佳，因为优势在实现批量块优化框架的额外开销中丢失了。BBOF
    已与梯度下降作为求解器进行讨论，并提出并使用了两种新的方差减少方法（SAAG-I 和 SAAG-II）来求解强凸和光滑问题。理论结果证明了线性收敛性，基准数据集的实证结果证明了所提方法相对于现有方差减少方法具有更快的收敛性。BBOF
    和 SAAG 可以扩展到并行和分布式设置，以及非凸问题。此外，还有改进所提方差减少方法理论特性的空间。


