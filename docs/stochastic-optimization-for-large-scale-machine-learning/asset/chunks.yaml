  trans: "\n\n# 第 7 章 随机信赖域不精确牛顿方法\n\nDOI: [10.1201/9781003240167-7](http://doi.org/10.1201/9781003240167-7)\n\
    \n如今，随机近似方法是处理大规模机器学习问题的主要研究方向之一。从随机一阶方法开始，现在的焦点正在转向随机二阶方法，因为它们具有更快的收敛速度和可用的计算资源。在本章中，我们提出了一种新的随机信赖域不精确牛顿方法，称为\
    \ STRON，它使用共轭梯度（`CG`）来不精确地求解信赖域子问题。该方法在梯度和海森值的计算中使用渐进子采样，以充分利用随机和全批量两种模式的优势。我们使用现有的方差缩减技术扩展了\
    \ STRON 来处理噪声梯度，并使用预条件共轭梯度（`PCG`）作为子问题求解器，并经验证明，对于大规模学习问题，它们并不像预期那样有效。最后，我们的经验结果证明了所提方法相对于现有方法在基准数据集上的有效性。\n\
    \n## 7.1 引言\n\n机器学习涉及数据密集型优化问题，这些问题包含大量与可用数据量相对应的分量函数。传统/经典方法，如牛顿方法，由于每次迭代的复杂性较大，在处理此类优化问题时表现不佳。因此，如今机器学习领域的主要挑战之一是开发可扩展且高效的算法来处理这些大规模学习问题\
    \ \\[25\\]。\n\n为了解决机器学习问题，梯度下降（`GD`）\\[20\\] 是经典的选择方法，但在处理大规模学习问题时训练速度较慢，因为每次迭代的成本较高。基于随机近似的方法\
    \ \\[113\\] 在此类情况下可能非常有效，但由于梯度的噪声近似，它们收敛速度较慢。因此，出现了各种随机方差缩减技术，例如 \\[39\\]。但这些方法的主要局限性是它们只能收敛到线性速率。\n\
    \n牛顿方法是解决优化问题的另一种经典方法，它可以达到二次收敛速率 \\[17\\]。但同样，（纯）牛顿方法在处理大规模学习问题时不可行，因为每次迭代的计算复杂性极大，并且需要存储一个巨大的海森矩阵。因此，如今机器学习优化领域最重要的开放问题之一是：“我们能否开发出具有二次收敛速率的随机二阶方法，类似于牛顿方法，但每次迭代的复杂性较低，类似于随机近似方法？”。在随机一阶方法取得成功后，研究重点正在转向随机二阶方法，以利用二阶方法的更快收敛速度和可用的计算能力。\n\
    \n不精确牛顿（也称为截断牛顿或海森自由）方法和拟牛顿方法是开发二阶方法的主要研究方向之一 \\[10\\]。不精确牛顿方法试图在不计算和存储海森矩阵的情况下近似求解牛顿方程。另一方面，拟牛顿方法试图近似海森逆矩阵并避免存储海森矩阵的需求。因此，这两种方法都试图解决牛顿方法的问题。不精确牛顿和拟牛顿的随机变体进一步通过使用子采样的梯度和海森计算来降低这些方法的复杂性。在本章中，我们提出了一种新的\
    \ `s`tochastic `t`rust `r`egi`o`n inexact `N`ewton（`STRON`）方法，该方法将子采样引入梯度和海森计算中。它使用渐进子采样来享受两种模式（随机近似和全批量学习）的优势。我们进一步使用现有的方差缩减技术扩展了该方法，以处理由梯度值子采样产生的噪声，并通过提出\
    \ `PCG` 来求解信赖域子问题。\n\n### 7.1.1 优化问题\n\n我们考虑下面给出的无约束凸优化问题，即预期风险：\n\n$$\\\\begin{array}{l}\
    \ {{\\\\min}\\_{w}R(w) = \\\\mathbb{E}\\\\left\\\\lbrack {f\\\\left( {w;\\\\xi}\
    \ \\\\right)} \\\\right\\\\rbrack,} \\\\\\\\ \\\\end{array}$$  \n\n(7.1)\n\n其中\
    \ `f`(`w`;`ξ`) = `f`(`w`;`x`[`i`],`y`[`i`]) = `f`(`h`(`w`;`x`[`i`]),`y`[`i`])\
    \ 是线性预测模型 `h` 和损失函数 `f` 在从未知分布 `P`(`x`[`i`],`y`[`i`]) 中随机选择的数据点（`x`[`i`],`y`[`i`]）上的平滑复合函数，由模型参数\
    \ `w` ∈ ℝ^(`n`) 参数化。由于 `P` 未知，因此无法求解 (7.1)，所以模型通过从未知分布 `P` 中取一组 `N` = {(`x`[1],`y`[1]),...,(`x`[`l`],`y`[`l`])}\
    \ 的 `l` 个数据点，然后求解经验风险最小化问题来近似，如下所示：\n\n$$\\\\begin{array}{l} {{\\\\min}\\_{w}F(w)\
    \ = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}f}(w;x\\_{i},y\\_{i}).} \\\\\
    \\\\ \\\\end{array}$$  \n\n(7.2)\n\n为简单起见，我们取 `f`(`w`;`x`[`i`],`y`[`i`]) = `f``i`\
    \ 的有限和优化问题存在于不同领域，例如信号处理、统计学、运筹学、数据科学和机器学习，例如机器学习中的逻辑回归和 SVM。\n\n### 7.1.2 求解技术\n\
    \n求解 (7.2) 的简单迭代经典方法是梯度下降（`GD`）\\[20\\]，如下所示：\n\n$$\\\\begin{array}{l} {w^{k +\
    \ 1} = w^{k} - \\\\alpha\\_{k}\\\\nabla F\\\\left( w\\_{k} \\\\right),} \\\\\\\
    \\ \\\\end{array}$$  \n\n(7.3)\n\n其中 (`k` + 1) 是迭代次数，`α`[`k`] 称为学习率或步长。该迭代的复杂度为\
    \ *O*(*n**l*)，对于大规模学习问题来说，由于数据点数量较大，该复杂度较高。随机梯度下降（`SGD`）\\[113\\] 非常有效，可以处理此类问题，因为其每次迭代的复杂度较低，如下所示：\n\
    \n$$\\\\begin{array}{l} {w^{k + 1} = w^{k} - \\\\alpha\\_{k}\\\\nabla f\\_{i\\\
    _{k}}\\\\left( w\\_{k} \\\\right),} \\\\\\\\ \\\\end{array}$$  \n\n(7.4)\n\n其中\
    \ `i`[`k`] 是随机选择的数据点。但是，由于梯度值存在噪声，`SGD` 无法保证收敛。\n\n求解 (7.2) 的另一种经典二阶方法是牛顿方法，如下所示：\n\
    \n$$\\\\begin{array}{l} {w^{k + 1} = w^{k} - \\\\alpha\\_{k}\\\\nabla^{2}F\\\\\
    left( w\\_{k} \\\\right)^{- 1}\\\\nabla F\\\\left( w\\_{k} \\\\right).} \\\\\\\
    \\ \\\\end{array}$$  \n\n(7.5)\n\n该迭代的复杂度为 *O*(*n*²*l* + *n*³)，并且需要存储和反转海森矩阵 ∇²*F*(*w*[*k*])，这在计算上非常昂贵，并且分别需要大量内存。这就是为什么在过去十年中，一阶方法及其随机变体被广泛研究以解决大规模学习问题，而不是二阶方法。由于随机一阶方法已达到其极限，并且由于更好的计算能力的可用性，主要焦点开始转向随机二阶方法，如今一个重要的开放问题是寻找具有二次收敛速率的随机二阶方法。\n\
    \n二阶方法有两个主要研究方向：拟牛顿方法和不精确牛顿方法，两者都试图解决与牛顿方法相关的问题。拟牛顿方法试图在每次迭代中近似海森矩阵，如下所示：\n\n\
    $$\\\\begin{array}{l} {w^{k + 1} = w^{k} - \\\\alpha\\_{k}B\\_{k}\\\\nabla F\\\
    \\left( w\\_{k} \\\\right),} \\\\\\\\ \\\\end{array}$$  \n\n(7.6)\n\n"
