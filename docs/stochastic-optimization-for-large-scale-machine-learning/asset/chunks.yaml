    \ is given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {w\\_{k + 1} = w\\\
    _{k} - \\\\alpha\\_{k}\\\\nabla^{2}F{(w\\_{k})}^{- 1}\\\\nabla F(w\\_{k}),} \\\
    \\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(6.2)\n\nwhere *α*[*k*] is\
    \ the learning rate. The per-iteration complexity of this iteration is *O*(*n*²*l* + *n*³)\
    \ which is huge for large-scale learning problems. The major issues with Newton\
    \ method are the need to calculate and store a large Hessian matrix and calculation\
    \ of Hessian inverse."
