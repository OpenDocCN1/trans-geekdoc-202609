    \ decimal places as compared with RS with constant step and backtracking line\
    \ search (LS).\n\n## 5.5  Conclusion\n\nIn this chapter, novel systematic sampling\
    \ and cyclic sampling techniques have been proposed, for solving large-scale learning\
    \ problems, for improving the training time by reducing the data access time.\
    \ Methods have similar convergence in expectation for systematic and cyclic sampling,\
    \ as for widely used random sampling, but with cyclic and systematic sampling\
    \ the training is up to six times faster than widely used random sampling technique,\
    \ at the expense of fractionally small difference in the minimized objective function\
    \ value, for a given number of epochs. Thus, systematic sampling technique is\
    \ suitable for solving large-scale problems with low accuracy solution. Random\
    \ shuffling of data can be used before the data is fed to the learning algorithms\
    \ with systematic and cyclic sampling to improve their results for the cases where\
    \ similar data points are grouped together. These sampling techniques can be extended\
    \ to parallel and distributed learning algorithms because of mini-batching.\n\n\
    # III\\_\\_\\_\\_\\_\\_\\_\\_\\_SECOND ORDER METHODS\n\n# Chapter 6 Mini-batch\
