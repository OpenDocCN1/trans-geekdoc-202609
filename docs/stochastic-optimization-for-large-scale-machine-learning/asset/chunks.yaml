- raw: "### 3.1.2  Batch Block Optimization Framework (BBOF)\n\nSA approach is used\
    \ to solve the optimization problem by considering one or some of data points\
    \ during each iteration which helps to reduce the iteration complexity but affects\
    \ the accuracy of solution. But by considering suitable mini-batches of data points\
    \ \\[81\\] in each iteration or using variance reduction techniques, like, SAG\
    \ \\[74\\], SAGA \\[35\\], S2GD \\[71\\] and SVRG \\[63\\] etc., solutions can\
    \ be improved. On the other hand, CD is used to solve the optimization problem\
    \ by considering one or some of the features/variables to formulate a reduced\
    \ subproblem, which helps to reduce the iteration complexity. By considering,\
    \ a suitable block of coordinates/variables in CD, during each iteration of learning\
    \ algorithm, performance can be improved. Now, combining mini-batch SA approach\
    \ with block CD approach, an optimization framework is formed, which is used to\
    \ solve a subproblem of block of variables over a mini-batch of data points, during\
    \ each iteration of learning algorithm. This framework which can be called Batch\
    \ Block Optimization Framework (BBOF), is an efficient and scalable framework\
    \ and can be used to solve big data problems because of its low iteration complexity.\
    \ BBOF is presented by [Algorithm 7](#05chap_03.xhtml#algorithm_7). Suppose {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*l*],*y*[*l*])}\
    \ is the training set with *l* data points where *x*[*i*] ∈ ℝ^(*p*), *y*[*i*] ∈ {−1,+1} ∀ *i*,\
    \ *X* = (*x*[1],*x*[2],...,*x*[*l*]) and *Y* = (*y*[1],*y*[2],...,*y*[*l*]). Suppose\
    \ *w* ∈ ℝ^(*p*) is partitioned into (*v*[1],*v*[2],...,*v*[*s*]), *s* blocks,\
    \ *v*[*j*] ∈ ℝ^(*p*[*j*]), s.t. ${\\\\sum\\\\limits\\_{j = 1}^{s}p\\_{j}} = p$\
    \ and *X* is partitioned into *m* mini-batches (*B*[1],*B*[2],...,*B*[*m*]) of\
    \ size |*B*[*i*]| each, s.t. $\\\\left. \\\\left. \\\\sum\\\\limits\\_{i = 1}^{m}\
    \ \\\\right|B\\_{i} \\\\middle| = l \\\\right.$.\n\n![](Images/algo7.jpg)\n\n\
    BBOF divides the given training set into *m* mini-batches, divides the features\
    \ into *s* blocks of features and runs for *n* epochs, each of which goes through\
    \ all data points, i.e., it runs over all batches and covers all blocks of features\
    \ for each mini-batch to avoid the overhead of reading data again and again. It\
    \ randomly selects one mini-batch of data points *B*[*i*] without replacement\
    \ and cyclically selects one block of features *v*[*j*]. Other sampling schemes\
    \ can be tried for sampling mini-batches and blocks of features in this framework.\
    \ But cyclic sampling (CS) is used for blocks of features since it would be difficult\
    \ otherwise to use sparse implementations. Moreover, as pointed out in \\[[152](#bib.xhtml#refbib_152)\\\
    ], methods like, SAG, SAGA, SAAG-I, which use stochastic averaging scheme, i.e.,\
    \ maintain full gradient from previous iterations, can't be used with random sampling\
    \ of blocks and mini-batches. A subproblem is formulated by taking selected block\
    \ of coordinates as variables and fixing the values of rest coordinates, over\
    \ the selected mini-batch of data points as given below:\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{w\\_{v\\_{j}}}{min}\\\\quad\\\\frac{1}{\\\\\
    left| B\\_{i} \\\\right|}{\\\\sum\\\\limits\\_{h \\\\in B\\_{i}}L\\_{h}}(w\\_{v\\\
    _{j}},w\\_{/v\\_{j}}),\\\\quad j = 1,2,...,s,\\\\, i = 1,2,...,m,} \\\\\\\\ \\\
    \\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(3.8)\n\nwhere *w*[*v*[*j*]] denotes\
    \ block of coordinates *v*[*j*] and *w*[/*v*[*j*]] denotes coordinates excluding\
    \ *v*[*j*]. The size of mini-batches and blocks is selected in such a way to allow\
    \ iteration complexity that can be handled efficiently by computers on which experiments\
    \ are performed. On solving the subproblem, the selected block of coordinates\
    \ are updated but other coordinates remains unchanged. This runs for predetermined\
    \ number of epochs *n* but other exit criteria can be tried depending up on the\
    \ method used to solve the subproblem and as per requirements. Before this, the\
    \ idea of mini-batches and block coordinates is studied by few researchers like\
    \ \\[[133](#bib.xhtml#refbib_133), 152\\] and \\[140\\] with Gradient/Proximal\
    \ Gradient methods, but we project mini-batch and block coordinates setting as\
    \ an optimization framework (BBOF) independent of any method, as an efficient\
    \ and scalable framework for solving big data problems. BBOF is a tunable framework\
    \ and can be tuned to eight different settings by changing the values of *m* (number\
    \ of mini-batches) and *s* (number of blocks), e.g., using Gradient Descent method\
    \ as a solver in BBOF, following different methods can be tuned:\n\n1.  i) *m* = 1,\
    \ i.e., one batch contains all data points, *s* = 1, i.e., one block contains\
    \ all coordinates, then method is GD.\n\n2.  ii) *m* = *l*, i.e., one batch contains\
    \ only one data point, *s* = 1, then method is SGD.\n\n3.  iii) *m* = 1, *s* = *p*,\
    \ i.e., one block contains only one coordinate, then method is CGD.\n\n4.  iv)\
    \ *m* = *B*, 1 < *B* < *l*, *s* = 1, then method is mini-batch SGD.\n\n5.  v)\
    \ *m* = *B*, 1 < *B* < *l*, *s* = *p*, then method is mini-batch CGD.\n\n6.  vi)\
    \ *m* = 1, *s* = *v*, 1 < *v* < *p*, then method is BCD (Block Coordinate Gradient\
    \ Descent).\n\n7.  vii) *m* = *l*, *s* = *v*, 1 < *v* < *p*, then method is stochastic\
    \ BCD.\n\n8.  viii) *m* = *B*, 1 < *B* < *l*, *s* = *v*, 1 < *v* < *p*, then method\
    \ is mini-batch block-coordinate GD (MBGD).\n\n### 3.1.3  Brief Literature Review\n\
    \nStochastic Approximation (SA) approach \\[113, 67\\] used with GD method gives\
    \ SGD method \\[148\\], which introduces variance in the gradient values because\
    \ of noisy approximations of gradient. This variance can be reduced by using suitable\
    \ mini-batches \\[81\\] instead of using one data point, or by using some variance\
    \ reduction techniques, like, SAG \\[74\\], SAGA \\[35\\], SVRG \\[63\\] and S2GD\
    \ \\[71\\] etc., which have same convergence as GD but have iteration complexity\
    \ nearly equal to SGD method. CD approach along with Block Coordinate Descent\
    \ (BCD) approach have been studied extensively in literature e.g., \\[100, 137,\
    \ 122\\] etc. The combination of BCD and mini-batch SA approach with GD/Proximal\
    \ GD (PGD) method is studied recently in MRBCD \\[152\\], ORBCD \\[133\\] and\
    \ BSG \\[140\\], which are specific cases of BBOF with GD/PGD method, used to\
    \ solve different problems. MRBCD and ORBCD have similar idea and theoretical\
    \ results. BSG solves for convex and non-convex problems and MRBCD solves only\
    \ convex problems. Both the methods use variance reduction techniques. MRBCD and\
    \ BSG use extension of SVRG for variance reduction in mini-batch and block coordinate\
    \ setting. This chapter uses BBOF with GD method, i.e., mini-batch and block coordinate\
    \ setting with GD as a solver, and proposes two new variance reduction methods\
    \ (refer to [Section 3.2](#05chap_03.xhtml#sec3_2)), in addition to extending\
    \ SAG, SAGA and S2GD to this setting.\n\n### 3.1.4  Contributions\n\nThe contributions\
    \ of the chapter are summarized below:\n\n*   Mini-batch and block-coordinate\
    \ setting, i.e., a combination of Stochastic Approximation (SA) and Coordinate\
    \ Descent (CD) approaches, have been projected as an efficient and scalable optimization\
    \ framework, namely, Batch Block Optimization Framework (BBOF), independent of\
    \ any solver, for solving big data problems. BBOF is a tunable framework and can\
    \ generate eight different methods by changing *m* (number of mini-batches) and\
    \ *s* (number of blocks) values (see, [Sub-section 3.1.2](#05chap_03.xhtml#sec3_1_2)).\n\
    \n*   Two novel methods, namely, SAAG-I and SAAG-II (see, [Section 3.2](#05chap_03.xhtml#sec3_2))\
    \ have been proposed as a variance reduction methods, under mini-batch and block\
    \ coordinate setting with GD method and used to solve strongly convex and smooth\
    \ problem. SAAGs can be used in mini-batched stochastic gradient setting also.\
    \ Theoretical analysis proves linear convergence for SAAG-II method.\n\n*   Variance\
    \ reduction methods SAG, SAGA, SVRG and S2GD have been extended to mini-batch\
    \ and block coordinate setting, and compared with the proposed methods.\n\n##\
    \ 3.2  Stochastic Average Adjusted Gradient (SAAG) Methods"
  fmt: '

    ### 3.1.2 Batch Block Optimization Framework (BBOF)


    SA approach is used to solve the optimization problem by considering one or some
    of data points during each iteration which helps to reduce the iteration complexity
    but affects the accuracy of solution. But by considering suitable mini-batches
    of data points [81] in each iteration or using variance reduction techniques,
    like, SAG [74], SAGA [35], S2GD [71] and SVRG [63] etc., solutions can be improved.
    On the other hand, CD is used to solve the optimization problem by considering
    one or some of the features/variables to formulate a reduced subproblem, which
    helps to reduce the iteration complexity. By considering, a suitable block of
    coordinates/variables in CD, during each iteration of learning algorithm, performance
    can be improved. Now, combining mini-batch SA approach with block CD approach,
    an optimization framework is formed, which is used to solve a subproblem of block
    of variables over a mini-batch of data points, during each iteration of learning
    algorithm. This framework which can be called Batch Block Optimization Framework
    (BBOF), is an efficient and scalable framework and can be used to solve big data
    problems because of its low iteration complexity. BBOF is presented by [Algorithm
    7](#05chap_03.xhtml#algorithm_7). Suppose {(`x`[1],`y`[1]),(`x`[2],`y`[2]),...,(`x`[`l`],`y`[`l`])}
    is the training set with `l` data points where `x`[`i`] ∈ ℝ^(`p`), `y`[`i`] ∈
    {−1,+1} ∀ `i`, `X` = (`x`[1],`x`[2],...`x`[`l`]) and `Y` = (`y`[1],`y`[2],...`y`[`l`]).
    Suppose `w` ∈ ℝ^(`p`) is partitioned into (`v`[1],`v`[2],...`v`[`s`]), `s` blocks,
    `v`[`j`] ∈ ℝ^(`p`[`j`]), s.t. ${\\sum\\limits\_{j = 1}^{s}p\_{j}} = p$ and `X`
    is partitioned into `m` mini-batches (`B`[1],`B`[2],...`B`[`m`]) of size |`B`[`i`]|
    each, s.t. $\\left. \\left. \\sum\\limits\_{i = 1}^{m} \\right|B\_{i} \\middle|
    = l \\right.$.


    ![](Images/algo7.jpg)


    BBOF divides the given training set into `m` mini-batches, divides the features
    into `s` blocks of features and runs for `n` epochs, each of which goes through
    all data points, i.e., it runs over all batches and covers all blocks of features
    for each mini-batch to avoid the overhead of reading data again and again. It
    randomly selects one mini-batch of data points `B`[`i`] without replacement and
    cyclically selects one block of features `v`[`j`]. Other sampling schemes can
    be tried for sampling mini-batches and blocks of features in this framework. But
    cyclic sampling (CS) is used for blocks of features since it would be difficult
    otherwise to use sparse implementations. Moreover, as pointed out in [[152](#bib.xhtml#refbib_152)],
    methods like, SAG, SAGA, SAAG-I, which use stochastic averaging scheme, i.e.,
    maintain full gradient from previous iterations, can''t be used with random sampling
    of blocks and mini-batches. A subproblem is formulated by taking selected block
    of coordinates as variables and fixing the values of rest coordinates, over the
    selected mini-batch of data points as given below:


    $$

    \\begin{array}{l} \\begin{array}{l} {\\underset{w\_{v\_{j}}}{min}\\quad\\frac{1}{\\left|
    B\_{i} \\right|}{\\sum\\limits\_{h \\in B\_{i}}L\_{h}}(w\_{v\_{j}},w\_{/v\_{j}}),\\quad
    j = 1,2,...,s,\\, i = 1,2,...,m,} \\\\ \\end{array} \\\\ \\end{array}

    $$


    (3.8)


    where `w`[`v`[`j`]] denotes block of coordinates `v`[`j`] and `w`[/`v`[`j`]] denotes
    coordinates excluding `v`[`j`]. The size of mini-batches and blocks is selected
    in such a way to allow iteration complexity that can be handled efficiently by
    computers on which experiments are performed. On solving the subproblem, the selected
    block of coordinates are updated but other coordinates remains unchanged. This
    runs for predetermined number of epochs `n` but other exit criteria can be tried
    depending up on the method used to solve the subproblem and as per requirements.
    Before this, the idea of mini-batches and block coordinates is studied by few
    researchers like [[133](#bib.xhtml#refbib_133), 152] and [140] with Gradient/Proximal
    Gradient methods, but we project mini-batch and block coordinates setting as an
    optimization framework (BBOF) independent of any method, as an efficient and scalable
    framework for solving big data problems. BBOF is a tunable framework and can be
    tuned to eight different settings by changing the values of `m` (number of mini-batches)
    and `s` (number of blocks), e.g., using Gradient Descent method as a solver in
    BBOF, following different methods can be tuned:


    1. i) `m` = 1, i.e., one batch contains all data points, `s` = 1, i.e., one block
    contains all coordinates, then method is GD.


    2. ii) `m` = `l`, i.e., one batch contains only one data point, `s` = 1, then
    method is SGD.


    3. iii) `m` = 1, `s` = `p`, i.e., one block contains only one coordinate, then
    method is CGD.


    4. iv) `m` = `B`, 1 < `B` < `l`, `s` = 1, then method is mini-batch SGD.


    5. v) `m` = `B`, 1 < `B` < `l`, `s` = `p`, then method is mini-batch CGD.


    6. vi) `m` = 1, `s` = `v`, 1 < `v` < `p`, then method is BCD (Block Coordinate
    Gradient Descent).


    7. vii) `m` = `l`, `s` = `v`, 1 < `v` < `p`, then method is stochastic BCD.


    8. viii) `m` = `B`, 1 < `B` < `l`, `s` = `v`, 1 < `v` < `p`, then method is mini-batch
    block-coordinate GD (MBGD).


    ### 3.1.3 Brief Literature Review


    Stochastic Approximation (SA) approach [113, 67] used with GD method gives SGD
    method [148], which introduces variance in the gradient values because of noisy
    approximations of gradient. This variance can be reduced by using suitable mini-batches
    [81] instead of using one data point, or by using some variance reduction techniques,
    like, SAG [74], SAGA [35], SVRG [63] and S2GD [71] etc., which have same convergence
    as GD but have iteration complexity nearly equal to SGD method. CD approach along
    with Block Coordinate Descent (BCD) approach have been studied extensively in
    literature e.g., [100, 137, 122] etc. The combination of BCD and mini-batch SA
    approach with GD/Proximal GD (PGD) method is studied recently in MRBCD [152],
    ORBCD [133] and BSG [140], which are specific cases of BBOF with GD/PGD method,
    used to solve different problems. MRBCD and ORBCD have similar idea and theoretical
    results. BSG solves for convex and non-convex problems and MRBCD solves only convex
    problems. Both the methods use variance reduction techniques. MRBCD and BSG use
    extension of SVRG for variance reduction in mini-batch and block coordinate setting.
    This chapter uses BBOF with GD method, i.e., mini-batch and block coordinate setting
    with GD as a solver, and proposes two new variance reduction methods (refer to
    [Section 3.2](#05chap_03.xhtml#sec3_2)), in addition to extending SAG, SAGA and
    S2GD to this setting.


    ### 3.1.4 Contributions


    The contributions of the chapter are summarized below:


    * Mini-batch and block-coordinate setting, i.e., a combination of Stochastic Approximation
    (SA) and Coordinate Descent (CD) approaches, have been projected as an efficient
    and scalable optimization framework, namely, Batch Block Optimization Framework
    (BBOF), independent of any solver, for solving big data problems. BBOF is a tunable
    framework and can generate eight different methods by changing `m` (number of
    mini-batches) and `s` (number of blocks) values (see, [Sub-section 3.1.2](#05chap_03.xhtml#sec3_1_2)).


    * Two novel methods, namely, SAAG-I and SAAG-II (see, [Section 3.2](#05chap_03.xhtml#sec3_2))
    have been proposed as a variance reduction methods, under mini-batch and block
    coordinate setting with GD method and used to solve strongly convex and smooth
    problem. SAAGs can be used in mini-batched stochastic gradient setting also. Theoretical
    analysis proves linear convergence for SAAG-II method.


    * Variance reduction methods SAG, SAGA, SVRG and S2GD have been extended to mini-batch
    and block coordinate setting, and compared with the proposed methods.


    ## 3.2 Stochastic Average Adjusted Gradient (SAAG) Methods

