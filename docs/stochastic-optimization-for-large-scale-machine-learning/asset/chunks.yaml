    # 图目录


    1. 1.1 对于给定数据可以绘制无限数量的分类器，但 SVM 找到支持向量之间间隙最大的分类器。圆代表支持向量。


    2. 1.2 左部分表示输入空间中的数据，右部分表示特征空间中的数据。数据已使用核函数从输入空间转换到特征空间。最初输入空间是二维的，数据不可分离。核函数将数据转换到三维空间，其中数据可由超平面分离。


    3. 2.1 线性 SVM 的八种不同问题公式，包括 L1 正则化 (L1R)、L2 正则化 (L2R)、L1 损失和 L2 损失函数。


    4. 2.2 SVM 时间线：OVR – 一对其余，T-SVM – 传导 SVM，OVO – 一对一，WWSVM – Weston 和 Watkins SVM，LSSVM
    – 最小二乘 SVM，DAGSVM – 有向无环图 SVM，LSVM – 拉格朗日 SVM，CSSVM – Crammer Singer SVM，FSVM
    – 模糊 SVM，PSVM – 近似 SVM，FPSVM – 模糊近似 SVM，Strcd SVM – 结构化 SVM，MTSVM – 多任务 SVM，GEPSVM
    – 广义特征值近似 SVM，MVSVM – 多视图 SVM，TW SVM – 孪生 SVM。


    5. 2.3 二维不可分离数据示例。由于数据不是完全可分离的，因此 SVM 允许一些误分类错误以找到分离超平面。


    6. 2.4 一对其余多类分类技术：二维中三个类 A、B 和 C 的示例。


    7. 2.5 一对一多类分类技术：二维中三个类 A、B 和 C 的示例。


    8. 2.6 标准 SVM 与近似 SVM。


    9. 2.7 不同类型的优化问题。


    10. 2.8 第一行：蘑菇 (#实例: 8124, #特征: 112)，第二行：rcv1, (#实例: 20,242, #特征: 47,236.)


    11. 2.9 线性 SVM 分类的改进领域。


    12. 3.1 第一行使用线搜索方法的结果，第二行使用恒定步长。


    13. 3.2 SUSY 数据集上，左侧使用线搜索方法的次优性与训练时间对比，右侧使用利普希茨常数的恒定步长。


    14. 4.1 使用包含 32 个数据点的小批量的 news20 数据集上，SAAG-III、IV、SVRG 和 VR-SGD 在光滑问题上的比较。


    15. 4.2 使用包含 32 个数据点的小批量的 rcv1 数据集上，SAAG-III、IV、SVRG 和 VR-SGD 在非光滑问题上的比较。


    16. 4.3 使用所有特征和块大小为 1000 的 rcv1 (第一) 和 real-sim (第二) 数据集上，BBOF 设置与小批量设置的比较。


    17. 4.4 使用包含 1000 个数据点的小批量的蘑菇 (第一行) 和 gisette (第二行) 数据集上 SVM 的结果。


    18. 5.1 在 SUSY 数据集上，使用包含 500 和 1000 个数据点的小批量，将 RS、CS 和 SS 与 SAG、SAGA 和 SVRG 进行比较，每种都有两种步长确定技术，即恒定步长和回溯线搜索。


    19. 5.2 在 SUSY 数据集上，使用包含 500 和 1000 个数据点的小批量，将 RS、CS 和 SS 与 SAAG-II 和 MBSGD 进行比较，每种都有两种步长确定技术，即恒定步长和回溯线搜索。


    20. 6.1 蘑菇数据集上 MBN、SNewton、TRON、Newton 和 SVRG-SQN 的比较。


    21. 6.2 real-sim 数据集上 MBN、SNewton、TRON、Newton 和 SVRG-SQN 的比较。


    22. 7.1 蘑菇 (第一行) 和 rcv1 (第二行) 数据集上，第一列展示最优性与训练时间（秒），第二列展示准确率与训练时间。


    23. 7.2 news20 数据集上 l2-SVM 的实验。


    24. 7.3 Adult 数据集上 STRON_PCG、STRON 和 TRON 的比较研究。


    25. 7.4 rcv1 数据集上 STRON-SVRG、STRON 和 TRON 的比较研究。


