    ### 3.4.1 Experimental Setup


    In this experimentation, logistic regression problem, given in eq.(3.3) is solved.
    Since BSG and MRBCD use SVRG for variance reduction, thus under our experimental
    settings BSG, MRBCD and extension of SVRG to mini-batch and block-coordinate setting
    become same so only SVRG is mentioned in the experiments. All the methods use
    the same algorithmic structure as given in Algorithm (7) with changes only in
    update rule (variance reduction method) at Step 7. All the methods use averaged
    gradient value for variance reduction, calculated either at start of epochs or
    maintained from previous iterations. To store the full gradient only a vector
    of length `l` is used since it stores only constant value for each data point
    instead of storing the complete gradient vector which will take `l * p` memory
    space. Step size is calculated using two different methods, namely, back tracking
    line search method and constant step size determined using Lipschitz constant.
    It is interesting to note that in backtracking line search using all data points
    for big data problems can be very expensive so backtracking line search is performed
    only on selected mini-batch with parameter values as `β = 0.5` (to decrease the
    step size) and `γ = 0.1` (i.e., allow 10% decrease of objective function) for
    all methods. With Lipschitz constant `L`, step size is taken as `1/L` for all
    the methods. This is to be noted that all experiments have been conducted on *single
    node, MacBook Air (8 GB 1600 MHz DDR3, 1.6 GHz Intel Core i5, 256 SSD)*. For all
    methods, regularization parameter is set as `C = 1/l`.


