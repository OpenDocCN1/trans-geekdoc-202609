    The quadratic model `m[k](p)` obtained using Taylor''s theorem is given below:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {F(w_{k} + p) - F(w_{k}) \approx m_{k}(p) \equiv \nabla F\left( w_{k} \right)^{T}p
    + \frac{1}{2}p^{T}\nabla^{2}F\left( w_{k} \right)p.}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (7.7)


    Taking derivative of `m[k](p)` w.r.t. `p` and equating to zero, we get,


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\nabla^{2}F\left( w_{k} \right)p = - \nabla F\left( w_{k} \right),}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (7.8)


    which is Newton system and its solution gives Newton method, as given below:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w^{k + 1} = w^{k} + p_{k} = w^{k} - \nabla^{2}F\left( w_{k} \right)^{- 1}\nabla
    F\left( w_{k} \right).}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (7.9)


    The computational complexity of this iteration is `O(n²l + n³)` which is very
    expensive. This iteration involves the calculation and inversion of a large Hessian
    matrix which is not only very expensive to calculate but expensive to store also.
    CG method approximately solves the subproblem (7.8) without forming the Hessian
    matrix, which solves the issues related to large computational complexity and
    need to store the large Hessian matrix. Each iteration runs for a given number
    of CG iterations or until the residual condition is satisfied, as given below:


    $$

    \begin{array}{l}

    {\| r_{k}\| \leq \eta_{k}^{{}^{^{\prime}}}\|\nabla F\left( w_{k} \right)\|,}

    \\

    \end{array}

    $$


    (7.10)


    where `r[k] = ∇²F(w[k])p + ∇F(w[k])` and `η[k]^(^′)` is a small positive value,
    known as forcing term [103].


    ### 7.3.2 Trust Region Inexact Newton Method


    Trust region is a region in which the approximate quadratic model of the given
    function gives correct approximation for that function. In trust region methods,
    we don''t need to calculate the step size (also called learning rate) directly
    but they indirectly adjust the step size as per the trust region radius. Trust
    region method solves the following subproblem to get the step direction `p[k]`:


    $$

    \begin{array}{l}

    {{\min}_{p}\ m_{k}\left( p \right)\quad\text{s.t}\quad\| p\| \leq \bigtriangleup_{k},}

    \\

    \end{array}

    $$


    (7.11)


    where `m[k](p)` is a quadratic model of `F(w[k]+p) − F(w[k])`, as given in (7.7)
    and `△[k]` is the trust region radius. This subproblem can be solved similar to
    Newton-CG, except that now we need to take care of the extra constraint of `p`.
    TRON (trust region Newton method) [85] is one of the most famous and widely used
    such method, which is used in LIBLINEAR [38] to solve l[2]-regularized logistic
    regression and l[2]-SVM problems. [52] extends TRON by proposing better trust
    region radius. [51] further extends TRON using PCG subproblem solver which uses
    average of identity matrix and diagonal matrix as preconditioner, to solve the
    trust region subproblem and shows that PCG could be effective to solve ill-conditioned
    problems.


    Then the ratio of actual and predicted reductions of the model is calculated,
    as given below:


    $$

    \begin{array}{l}

    {\rho_{k} = \frac{F(w_{k} + p_{k}) - F(w_{k})}{m_{k}(p_{k})}.}

    \\

    \end{array}

    $$


    (7.12)


    The parameters are updated for the `(k + 1)` th iteration as given below:


    $$

    \begin{array}{l}

    {w_{k + 1} = \left\{ \begin{array}{ll}

    {w_{k} + p_{k},} & {\text{if}\ \rho_{k} > \eta_{0},} \\

    {w_{k},} & {\text{if}\ \rho_{k} \leq \eta_{0},} \\

    \end{array}~ \right.}

    \\

    \end{array}

    $$


    (7.13)


    where `η[0] > 0` is a given constant. Then the trust region radius `△[k]` is updated
    as per the ratio of actual reduction and predicted reduction, and a framework
    for updating `△[k]` as given in [[83](#bib.xhtml#refbib_83)], is given below:


    $$

    \begin{array}{l}

    {\bigtriangleup_{k + 1} \in \left\{ \begin{array}{ll}

    {\left\lbrack {\gamma_{1}\min\left\{ \| p_{k}\|, \bigtriangleup_{k} \right\},\gamma_{2}
    \bigtriangleup_{k}} \right\rbrack,} & {\text{if}\ \rho_{k} \leq \eta_{1},} \\

    {\left\lbrack {\gamma_{1} \bigtriangleup_{k},\gamma_{3} \bigtriangleup_{k}} \right\rbrack,}
    & {\text{if}\ \rho_{k} \in \left( {\eta_{1},\eta_{2}} \right),} \\

    {\left\lbrack {\bigtriangleup_{k},\gamma_{3} \bigtriangleup_{k}} \right\rbrack,}
    & {\text{if}\ \rho_{k} \geq \eta_{2},} \\

    \end{array}~ \right.}

    \\

    \end{array}

    $$


    (7.14)


    where `0 < η[1] < η[2] ≤ 1` and `0 < γ[1] < γ[2] < 1 < γ[3]`. If `ρ[k] ≤ η[1]`
    then the Newton step is considered unsuccessful and the trust region radius is
    shrunk. On the other hand if `ρ[k] ≥ η[2]` then the step is successful and the
    trust region radius is enlarged. We have implemented this framework as given in
    the LIBLINEAR library [38] and chose the following pre-defined values for the
    above constants: `η[0] = 1e − 4`, `η[1] = 0.25`, `η[2] = 0.75`, `γ[1] = 0.25`,
    `γ[2] = 0.5` and `γ[3] = 4`.


    ## 7.4 STRON


    STRON exploits the best of both, stochastic and batch regimes, using progressive
    subsampling. As stochastic gradient descent (SGD) trains faster for large-scale
    learning problems than gradient descent (GD) due to low computations per iteration
    but GD is more accurate than SGD due to batch calculations, similarly STRON takes
    benefit of low computation during initial iterations and as it reaches the solution
    region it uses batch calculations to find accurate solution like TRON. The major
    challenge with STRON is to decide when to switch from stochastic to full-batch
    regime, i.e., to tune the subsampling rate.


    STRON introduces stochasticity into the trust region inexact Newton method and
    calculates subsampled function, gradient and Hessian values to solve the trust
    region subproblem, as given below:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {{\min}_{p}\ m_{k}(p) = \nabla F_{X_{k}}\left( w_{k} \right)^{T}p + \frac{1}{2}p^{T}\nabla^{2}F_{S_{k}}\left(
    w_{k} \right)p,\quad\text{s.t}\quad\| p\| \leq \bigtriangleup_{k},}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (7.15)


    where `∇²F[S[k]](w[k])` and `∇F[X[k]](w[k])` are subsampled Hessian and gradient
    values over the subsamples `S[k]` and `X[k]`, respectively, as defined below:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\nabla^{2}F_{S_{k}}\left( w_{k} \right) = \frac{1}{\left| S_{k} \right|}{\sum\limits_{i
    \in S_{k}}\nabla^{2}}f_{i}\left( w_{k} \right),} \\

    {\nabla F_{X_{k}}\left( w_{k} \right) = \frac{1}{\left| X_{k} \right|}{\sum\limits_{i
    \in X_{k}}\nabla}f_{i}\left( w_{k} \right),} \\

    {F_{X_{k}}\left( w_{k} \right) = \frac{1}{\left| X_{k} \right|}{\sum\limits_{i
    \in X_{k}}f_{i}}\left( w_{k} \right),} \\

    \end{array}

    \\

    \end{array}

    $$


    (7.16)


    where subsamples are increasing, i.e., `|X[k]|<|X[k + 1]|`, `|S[k]|<|S[k + 1]|`
    and `F[X[k]]` is subsampled function value used for calculating `ρ[k]`. STRON
    solves (7.15) approximately for given number of CG iterations or until the following
    residual condition is satisfied:


    $$

    \begin{array}{l}

    {\| r_{k}\| \leq \eta_{k}^{{}^{^{\prime}}}\|\nabla F_{X_{k}}\left( w_{k} \right)\|,}

    \\

    \end{array}

    $$


    (7.17)


    where `r[k] = ∇²F[S[k]](w[k])p + ∇F[X[k]](w[k])`.

