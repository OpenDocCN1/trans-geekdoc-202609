    \\

    \end{array}

    $$


    (2.52)


    where `H = J(w[k])^T J(w[k])` and `g = J(w[k])^T r(w[k])`. `λ` is called the Levenberg-Marquardt
    parameter and is used to make the approximate Hessian (`H + λ > diag(H)`) positive
    definite. This method is robust with respect to larger residual problems and poor
    initial solution. For `λ = 0`, Levenberg-Marquardt method behaves as Gauss-Newton
    method, and for large value of `λ`, it behaves as Steepest Descent method.


    Levenberg-Marquardt (LM) method can be extended as Levenberg-Marquardt Trust Region
    (LMTR, \[24\]) method. In LM method `λ` is arbitrarily changed but in LMTR instead
    of changing the `λ`, trust region radius is changed. Trust Region method or line
    search methods are used to ensure sufficient decrease in the function. Trust Region
    method can be used with any method that uses quadratic model of the function for
    finding the solution.


    ### 2.4.10 Quasi-Newton Method


    Quasi-Newton method\[126\] is an alternative to Newton method. In this method,
    instead of calculating the true Hessian (`∇²f[k]`) an approximation of Hessian
    (`B[k]`) is used and updated at each step. So, the Quasi-Newton search direction
    is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {s_{k}^{Q} = - B_{k}^{- 1}g}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.53)


    Advantage of Quasi-Newton method is that it avoids calculation of second order
    derivatives. It has super-linear rate of convergence. There are many methods to
    update the Hessian value at each step. Two of the most famous formula for updating
    `B[k]` are:


    Symmetric Rank (SR1, \[[103](#bib.xhtml#refbib_103)\]):


    $$

    \begin{array}{l}

    \begin{array}{l}

    {B_{k + 1} = B_{k} + \frac{\left( {y_{k} - B_{k}p_{k}} \right)\left( {y_{k} -
    B_{k}p_{k}} \right)^{T}}{\left( {y_{k} - B_{k}p_{k}} \right)^{T}p_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.54)


    where `y[k] = ∇f[k + 1] − ∇f[k]` and `p[k] = w[k + 1] − w[k]`.


    And BFGS \[126\] is named after its inventors, Broyden, Fletcher, Goldfarb and
    Shanno:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {B_{k + 1} = B_{k} - \frac{B_{k}p_{k}p_{k}^{T}B_{k}}{p_{k}^{T}B_{k}p_{k}} + \frac{y_{k}y_{k}^{T}}{y_{k}^{T}p_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.55)


    ### 2.4.11 Subgradient Method


    Subgradient, subderivative and subdifferential refer to the derivative of a non-differentiable
    convex function. Subgradient methods \[[92](#bib.xhtml#refbib_92), 118, [145](#bib.xhtml#refbib_145)\]
    are optimization methods for solving the non-differentiable convex functions.
    The update rule for Subgradient method is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w_{k + 1} = w_{k} - d_{k}g_{k}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.56)


    where `g[k]` is the subgradient of function `f` at `w[k]` and for step size `d[k]`.


    Step size rule: (1) Fixed step: `d[k]` is taken constant, (2) Fixed length: `d[k]∥g[k]∥[2]`
    is taken constant and (3) Diminishing: `d_k → 0, ∑_{k = 1}^{∞} d_k = ∞`.


    Advantage of Subgradient method is that it leads to a very simple algorithm. Disadvantage
    of Subgradient method are that the convergence can be very slow and there is no
    good stopping criterion for it.


    ### 2.4.12 Conjugate Gradient Method


    Conjugate Gradient (CG) methods\[85\] are the optimization methods which are less
    reliable than Newton method but can be used to solve very large problems. It is
    proposed by \[[50](#bib.xhtml#refbib_50)\] for linear systems in 1950s but has
    been extended to non-linear systems by \[[43](#bib.xhtml#refbib_43)\] in the 1960s.
    Advantage of Conjugate method is that it does not need any matrix storage, it
    needs to calculate only objective function and its derivative which makes it suitable
    for very large problems. It is faster than Steepest Descent method. Inexact and
    Truncated Newton methods use it to approximate the Newton step. Conjugate Gradient
    method can be accelerated using preconditioning.


    According to \[43\], step size is determined by any of the existing methods and
    step direction is found using the following formula and algorithm is given by
    [Algorithm 4](#03chap_02.xhtml#algorithm_4):


    $$

    \begin{array}{l}

    \begin{array}{l}

    {s_{k + 1} = - \nabla f_{k + 1} + \beta_{k + 1}s_{k}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.57)


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\text{where}\quad\beta_{k + 1} = \frac{\nabla f_{k + 1}^{T}\nabla f_{k + 1}}{\nabla
    f_{k}^{T}\nabla f_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.58)


    ![](Images/algo4.jpg)


    FR method has many variations and Polak-Ribiere (PR) method \[[123](#bib.xhtml#refbib_123)\]
    is one of the them. It varies only in updating value of `β[k + 1]`. So, according
    to PR method the update formula is:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\beta_{k + 1} = \frac{\nabla f_{k + 1}^{T}\left( {\nabla f_{k + 1} - \nabla f_{k}}
    \right)}{\nabla f_{k}^{T}\nabla f_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.59)


    ### 2.4.13 Truncated Newton Method


    Truncated Newton (TN) methods are an alternative to Newton method where Newton
    system is approximately solved leading to early termination. TN methods are less
    reliable than Newton method but these can handle very large problems. TN methods
    do not calculate Hessian so also known as Hessian-free optimization. Conjugate
    Gradient method and Preconditioned Conjugate Gradient \[85\] methods are examples
    of Truncated Newton methods.


    ### 2.4.14 Proximal Gradient Method


    Proximal Gradient (PG) method\[140\] is an optimization method for unconstrained
    problem where objective function can be split in two convex components. The proximity
    of a convex function `h(w)` is given as:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {prox_{h}(w) = \underset{u}{argmin}\quad\left( {h(u) + \frac{1}{2}\| u - w\|_{2}^{2}}
    \right)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.60)


    Suppose problem is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\quad f(w) = g(w) + h(w)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.61)


    where `g` is convex, differentiable and `dom > g = ℝ^n`. `h` is convex with inexpensive
    proximity. According to PG method the solution in the `(k + 1)^(th)` iteration
    is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w_{k + 1} = prox_{d_{k}h}\left( {w_{k} - d_{k}\nabla g\left( w_{k} \right)} \right)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.62)


    where `d[k] > 0` is step size, constant or determined by line search. Fast Proximal
    Gradient and Dual Proximal Gradient methods are the variations of PG method.


