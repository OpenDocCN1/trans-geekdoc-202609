    \ & {\\\\underset{\\\\alpha}{\\\\max}\\\\quad\\\\mathbf{1}\\_{2}^{T}\\\\alpha\
    \ - \\\\frac{1}{2}\\\\alpha^{T}G\\\\left( {H^{T}H} \\\\right)^{- 1}G^{T}\\\\alpha}\
    \ \\\\\\\\ {\\\\text{s}\\\\text{.t}\\\\text{.}} & {0 \\\\leq \\\\alpha \\\\leq\
