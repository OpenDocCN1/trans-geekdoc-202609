    方法。在 LM 方法中 `λ` 任意变化，但在 LMTR 中，不改变 `λ`，而是改变信赖区域半径。信赖区域方法或线搜索方法用于确保函数的充分下降。信赖区域方法可以与任何使用函数二次模型来求解的方法一起使用。


    ### 2.4.10 拟牛顿法


    拟牛顿法\[126\] 是牛顿法的一种替代方法。在此方法中，不计算真实的 Hessian (`∇²f[k]`)，而是使用 Hessian 的近似值 (`B[k]`)
    并在每一步进行更新。因此，拟牛顿搜索方向由


    $$

    \begin{array}{l}

    \begin{array}{l}

    {s_{k}^{Q} = - B_{k}^{- 1}g}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.53)


    拟牛顿法的优点是避免了二阶导数的计算。它具有超线性收敛率。有许多方法可以在每一步更新 Hessian 值。更新 `B[k]` 的两个最著名的公式是：


    对称秩一法 (SR1, \[103\])：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {B_{k + 1} = B_{k} + \frac{\left( {y_{k} - B_{k}p_{k}} \right)\left( {y_{k} -
    B_{k}p_{k}} \right)^{T}}{\left( {y_{k} - B_{k}p_{k}} \right)^{T}p_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.54)


    其中 `y[k] = ∇f[k + 1] − ∇f[k]` 和 `p[k] = w[k + 1] − w[k]`。


    BFGS \[126\] 以其发明者 Broyden、Fletcher、Goldfarb 和 Shanno 命名：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {B_{k + 1} = B_{k} - \frac{B_{k}p_{k}p_{k}^{T}B_{k}}{p_{k}^{T}B_{k}p_{k}} + \frac{y_{k}y_{k}^{T}}{y_{k}^{T}p_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.55)


    ### 2.4.11 次梯度法


    次梯度、次导数和次微分指的是不可微凸函数的导数。次梯度方法 \[92, 118, 145\] 是用于求解不可微凸函数的优化方法。次梯度方法的更新规则由


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w_{k + 1} = w_{k} - d_{k}g_{k}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.56)


    其中 `g[k]` 是函数 `f` 在 `w[k]` 处的次梯度，步长为 `d[k]`。


    步长规则：(1) 固定步长：`d[k]` 取常数，(2) 固定长度：`d[k]∥g[k]∥[2]` 取常数，(3) 递减：`d_k → 0, ∑_{k =
    1}^{∞} d_k = ∞`。


    次梯度法的优点是它导致了一个非常简单的算法。次梯度法的缺点是收敛可能非常缓慢，并且没有良好的停止准则。


    ### 2.4.12 共轭梯度法


    共轭梯度 (CG) 方法\[85\] 是比牛顿法可靠性较低但可用于求解非常大规模问题的优化方法。它由 \[50\] 在 1950 年代提出用于线性系统，但随后由
    \[43\] 在 1960 年代扩展到非线性系统。共轭梯度法的优点是不需要任何矩阵存储，只需计算目标函数及其导数，这使其适用于非常大规模的问题。它比最速下降法更快。不精确牛顿法和截断牛顿法使用它来近似牛顿步长。共轭梯度法可以使用预条件化来加速。


    根据 \[43\]，步长由任何现有方法确定，步长方向使用以下公式求出，算法由 Algorithm 4 给出：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {s_{k + 1} = - \nabla f_{k + 1} + \beta_{k + 1}s_{k}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.57)


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\text{where}\quad\beta_{k + 1} = \frac{\nabla f_{k + 1}^{T}\nabla f_{k + 1}}{\nabla
    f_{k}^{T}\nabla f_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.58)


    ![](img/algo4.jpg)


    FR 方法有许多变体，Polak-Ribiere (PR) 方法 \[123\] 是其中之一。它仅在更新 `β[k + 1]` 的值上有所不同。因此，根据
    PR 方法，更新公式为：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\beta_{k + 1} = \frac{\nabla f_{k + 1}^{T}\left( {\nabla f_{k + 1} - \nabla f_{k}}
    \right)}{\nabla f_{k}^{T}\nabla f_{k}}}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.59)


    ### 2.4.13 截断牛顿法


    截断牛顿 (TN) 方法是牛顿法的一种替代方法，其中牛顿系统被近似求解，导致提前终止。TN 方法比牛顿法可靠性较低，但可以处理非常大规模的问题。TN 方法不计算
    Hessian，因此也被称为无 Hessian 优化。共轭梯度法和预条件化共轭梯度 \[85\] 方法是截断牛顿方法的示例。


    ### 2.4.14 近端梯度法


    近端梯度 (PG) 方法\[140\] 是一种用于无约束问题的优化方法，其中目标函数可以分为两个凸分量。凸函数 `h(w)` 的近端算子定义为：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {prox_{h}(w) = \underset{u}{argmin}\quad\left( {h(u) + \frac{1}{2}\| u - w\|_{2}^{2}}
    \right)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.60)


    假设问题由


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\quad f(w) = g(w) + h(w)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.61)


    给出，其中 `g` 是可微凸函数且 `dom > g = ℝ^n`。`h` 是具有廉价近端算子的凸函数。根据 PG 方法，第 `(k + 1)` 次迭代的解由


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w_{k + 1} = prox_{d_{k}h}\left( {w_{k} - d_{k}\nabla g\left( w_{k} \right)} \right)}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (2.62)


    给出，其中 `d[k] > 0` 是步长，可以是常数或由线搜索确定。快速近端梯度法和对偶近端梯度法是 PG 方法的变体。


