- raw: "STRON is presented by [Algorithm 16](#10chap_07.xhtml#algorithm_16). It randomly\
    \ selects subsamples *S*[*k*] and *X*[*k*] for the *k*th iteration (outer iterations).\
    \ *X*[*k*] and *S*[*k*] are used for calculating the gradient and Hessian values,\
    \ respectively. Then it solves the trust region subproblem using CG solver (inner\
    \ iterations) which uses subsampled Hessian in calculating Hessian-vector products.\
    \ CG stops when residual condition, same as (7.17), satisfies, it reaches maximum\
    \ #CG iterations or it reaches the trust region boundary. The ratio of reduction\
    \ in actual and predicted reduction is calculated similar to (7.12) but using\
    \ subsampled function, and is used for updating the parameters as given in (7.13).\
    \ Then trust region radius △[*k*] is updated as per *ρ*[*k*] as given in (7.14)\
    \ and these steps are repeated for a given number of iterations or until convergence.\n\
    \n![](Images/algo16.jpg)![](Images/algo17.jpg)\n\nSTRON uses progressive subsampling,\
    \ i.e., dynamic subsampling to calculate function, gradient and Hessian values,\
    \ and solves the Newton system approximately. It is effective to deal with large-scale\
    \ problems since it uses subsampling and solves the subproblem approximately,\
    \ without forming the Hessian matrix but using only Hessian-vector products. So,\
    \ it handles the complexity issues related with the Newton method.\n\n### 7.4.1 \
    \ Complexity\n\nThe complexity of trust region inexact Newton (TRON) method depends\
    \ on function, gradient and CG subproblem solver. This is dominated by CG subproblem\
    \ solver and is given by *O*(*n**l*) × #CG iterations,  and for sparse data , *O*(#*n**n**z*) × #CG iterations,\
    \ where #*n**n**z* is number of non-zeros values in the dataset. For subsampled\
    \ trust region inexact Newton (STRON) method, the complexity per-iteration is\
    \ given by *O*(*n*|*S*[*k*]|) × #CG iterations,  and for sparse data, *O*(#*n**n**z*[*S*[*k*]]) × #CG iterations,\
    \ where #*n**n**z*[*S*[*k*]] is number of non-zeros values in the subsample *S*[*k*].\
    \ Since #CG iterations taken by TRON and STRON do not differ much so the per-iteration\
    \ complexity of STRON is smaller than TRON in the initial iterations and later\
    \ becomes equal to TRON due to progressive subsampling, i.e., when |*S*[*k*]|=*N*.\n\
    \n### 7.4.2  Analysis\n\nSTRON method uses progressive subsampling with the assumption\
    \ that eventually mini-batch size becomes equal to the whole dataset, i.e., for\
    \ some value of $k \\\\geq \\\\overline{k} > 0$, STRON becomes TRON. So, we can\
    \ follow the theoretical results given in TRON, which itself refers the results\
    \ from \\[83\\]. For $k \\\\geq \\\\overline{k}$, we get different convergence\
    \ depending upon the value of *η*[*k*]^(^′): If *η*[*k*]^(^′) < 1 then STRON converges\
    \ Q-linearly, if *η*[*k*]^(^′)→0 as *k*→∞ then STRON has Q-superlinear convergence\
    \ and when *η*[*k*]^(^′) ≤ *κ*[0]∥∇*F*(*w*[*k*])∥ for *κ*[0] > 0 then STRON converges\
    \ at quadratic rate.\n\n## 7.5  Experimental Results\n\nIn this section, we discuss\
    \ experimental settings and results[⁷](#fn7)\n\n**TRON** \\[51\\]: This is a trust\
    \ region inexact Newton method without any subsampling. It uses preconditioned\
    \ CG method to solve the trust region subproblem and it is present in the current\
    \ version of LIBLINEAR library \\[38\\].\n\n**STRON**: This is the proposed stochastic\
    \ trust region inexact Newton method with progressive subsampling technique for\
    \ gradient and Hessian calculations. It uses CG method to solve the trust region\
    \ subproblem.\n\n**STRON-PCG**: This is an extension of STRON using PCG for solving\
    \ the trust region subproblem, as discussed in the [Subsection 7.6.1](#10chap_07.xhtml#sec7_6_1).\n\
    \n**STRON-SVRG**: This is another extension of STRON using variance reduction\
    \ for subsampled gradient calculations, as discussed in [Subsection 7.6.2](#10chap_07.xhtml#sec7_6_2).\
    \ **Newton-CG** \\[18\\]: This is stochastic inexact Newton method which uses\
    \ CG method to solve the subproblem. It uses progressive subsampling similar to\
    \ STRON.\n\n**SVRG-SQN** \\[99\\]: This is stochastic L-BFGS method with variance\
    \ reduction for gradient calculations.\n\n**SVRG-LBFGS** \\[69\\]: This is another\
    \ stochastic L-BFGS method with variance reduction. It differs from SVRG-SQN method\
    \ in approach by which Hessian information is sampled.\n\n### 7.5.1  Experimental\
    \ Setup\n\nThe datasets have been divided into 80% and 20%, for training and testing\
    \ datasets, respectively to plot the convergence, and 5-fold cross-validation\
    \ has been used to present results in [Table 7.1](#10chap_07.xhtml#t7_1). We have\
    \ used *λ* = 1/*l* for all methods because generally it gives good results and\
    \ at the same time helps to reduce number of tunable hyper-parameters. #CG iterations\
    \ has been set to a sufficiently large value of 25, as all the inexact Newton\
    \ methods use 5–10 iterations and hardly go beyond 20 iterations. Progressive\
    \ batching scheme uses initial batch size of 1% for all datasets except ijcnn\
    \ which uses 10% of dataset and the subsample size is increased linearly for all\
    \ datasets, except covtype where exponential rate is used. Moreover we set the\
    \ rate such that subsample size equals dataset size in 5 epochs because, generally\
    \ second order methods reach the solution region in 4–5 epochs and converge in\
    \ 8–10 epochs. For the sake of simplicity and to avoid extra sampling, we take\
    \ same subsample for Hessian and gradient calculations, i.e, *S*[*k*] = *X*[*k*].\
    \ Quasi-Newton methods (SVRG-SQN and SVRG-LBFGS) use mini-batch size of 10% with\
    \ stochastic backtracking line search to find the step size, and same size mini-batches\
    \ are taken for gradient and Hessian subsampling. Memory of *M* = 5 is used in\
    \ quasi-Newton methods with *L* = 5 as update frequency of Hessian inverse approximation\
    \ for SVRG-SQN method. All the algorithms use similar exit criterion of decrease\
    \ in gradient value where we calculate gradient (∥*g*[0]∥) at *w*[0] and run the\
    \ algorithms until ∥*g*[*k*]∥ ≤ *ϵ*∥*g*[0]∥, where ∥*g*[*k*]∥ is gradient value\
    \ at k^(th)\\-iteration and *ϵ* is the given tolerance level. Moreover all the\
    \ methods are implemented in C++[⁸](#fn8)\n\n### 7.5.2  Comparative Study\n\n\
    The experiments have been performed with strongly convex and smooth l[2]\\-regularized\
    \ logistic regression problem as given below:\n\n$$\\\\begin{array}{l} {\\\\underset{w}{\\\
    \\min}\\\\, F(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}{\\\\log}}\\\\\
    left( {1 + \\\\exp\\\\left( {- y\\_{i}w^{T}x\\_{i}} \\\\right)} \\\\right) + \\\
    \\frac{\\\\lambda}{2}\\\\| w\\\\|^{2}.} \\\\\\\\ \\\\end{array}$$  \n\n(7.18)\n\
    \nThe results have been plotted as optimality (*F*(*w*) − *F*(*w*^(\\*))) versus\
    \ training time (in seconds) and accuracy versus training time for high *ϵ*(=\
    \ 10^( − 10))-accuracy solutions, as given in the [Fig. 7.1](#10chap_07.xhtml#f7_1).\
    \ As it is clear from the results, STRON converges faster than all other methods\
    \ and shows improvement against TRON on accuracy vs. time plots. Moreover, quasi-Newton\
    \ methods converges slower than inexact Newton methods as already established\
    \ in the literature \\[85\\]. As per the intuitions, STRON takes initial advantage\
    \ over TRON due to subsampling and as it reaches the solution region the progressive\
    \ batching scheme reaches the full batching scheme and converges with same rate\
    \ as TRON. That's why, in most of the figures, we can observe STRON and TRON converging\
    \ in parallel lines. Moreover, we observe a horizontal line for accuracy vs. time\
    \ plot with covtype dataset because all methods give 100% accuracy. Generally,\
    \ the models are trained for low *ϵ*(= 10^( − 02))-accuracy solutions. So we present\
    \ the results for such a case using Table 7.1, which reports results using 5-fold\
    \ cross validation. As it is clear from the table, STRON either outperforms other\
    \ solvers or shows results pretty close to the best method.\n\n![FIGURE 7.1 First\
    \ column presents optimality versus training time (in seconds) and second column\
    \ presents accuracy versus training time, on mushroom (first row) and rcv1 (second\
    \ row) datasets.](Images/fig7_1.jpg)"
