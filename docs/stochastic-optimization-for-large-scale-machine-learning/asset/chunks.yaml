    \ given in this section. All these methods calculate one partial gradient over\
    \ selected mini-batch at latest iterate which gives the latest gradient values,\
    \ i.e., step direction to move, calculate one partial gradient over selected mini-batch\
    \ at old iterate and one partial gradient over whole dataset calculated at old\
    \ iterates which might not give correct step direction to move. Old gradient values\
    \ help in reducing the variance in expectation but might lead in wrong direction.\
