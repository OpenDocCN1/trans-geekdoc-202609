- raw: "We have provided solutions to tackle the challenge by focusing on both parts\
    \ of the training time of models, i.e., time to access the data and time to learn\
    \ from the data. To improve the data access time, we have proposed to use the\
    \ systematic sampling and sequential sampling techniques to sample mini-batches\
    \ of data points from the dataset, which are based on contiguous memory access.\
    \ This is a general observation that data access is faster from contiguous memory\
    \ than from the dispersed memory. This solution to the big data challenge is independent\
    \ of problem or solver used, as it is based on the data access. This helped to\
    \ achieve up to six times faster training.\n\nTo improve the learning time from\
    \ the data, we have used stochastic approximation and coordinate descent approaches,\
    \ which are very effective to deal with the big data problems because they make\
    \ each iteration independent of number of data points and number of features,\
    \ respectively. First, we utilize the best of stochastic approximation and coordinate\
    \ descent approaches to propose a batch block optimization framework to solve\
    \ the big data problems. We used batch block optimization framework with first\
    \ and second order methods and proposed SAAG-I and II and MBN, respectively. But\
    \ it is observed that the stochastic approximation and coordinate descent, do\
    \ not work well when combined together because the advantage is lost in extra\
    \ overhead to implement batch block optimization framework. Since a batch block\
    \ optimization framework uses double sampling, i.e., sampling of data points and\
    \ that of features so it also involves data access related issues, due to sparse\
    \ representations of data.\n\nWe have also provided solutions to the big data\
    \ challenge using stochastic approximation because nowadays this is one of the\
    \ most popular approach to solve large scale problems. We have proposed SAAG-III\
    \ and IV, as extensions of SAAG-I and II, respectively. These are stochastic variance\
    \ reduction techniques based on iterate averaging and solve both smooth and non-smooth\
    \ problems with linear convergence. With second order methods, we have utilized\
    \ the best of stochastic and full-batch regimes to propose stochastic trust region\
    \ inexact Newton method based on progressive subsampling. The second order methods\
    \ converge faster than first order methods which are limited to linear convergence\
    \ only. We have also used CG and PCG with STRON to solve the trust region subproblem.\n\
    \nIt is observed that the stochastic approximation and coordinate descent, do\
    \ not work well when combined together because the advantage is lost in extra\
    \ overhead to implement batch block optimization framework due to double sampling,\
    \ i.e., sampling of data points and that of features. Although, stochastic approximation\
    \ based first and second order methods are very effective to solve large-scale\
    \ problems, where later ones can converge faster but need more computations.\n\
    \n## 8.1  Future Scope\n\nOptimization is the backbone of machine learning. Due\
    \ to increasing data set sizes and increasing popularity of deep learning the\
    \ importance of optimization methods have increased even more. The current research\
    \ work to solve large-scale learning problems can be extended, as discussed below:\n\
    \n1.  *Theoretical Insights*\n\n    Although, theory is lagging behind practice\
    \ in most of the areas of machine learning but this is very important as it helps\
    \ to realize the actual potential of a learning algorithm. In current work, the\
    \ main focus was on empirical study but finding convergence rates and theoretical\
    \ properties of a learning algorithm will help to further improve the methods\
    \ and propose new ones.\n\n2.  *Complex (non-convex) Problems*\n\n    Deep learning\
    \ has revolutionized the field of machine learning and opened many opportunities\
    \ to solve challenging real life problems. It involves non-convex large scale\
    \ problems which are complex to solve. So, efficient and scalable optimization\
    \ methods are required to solve deep learning problems. The current work focuses\
    \ only on convex problems so the next hurdle is to extend the current work to\
    \ solve non convex problems.\n\n3.  *Parallel and Distributed Algorithms*\n\n\
    \    Parallel and distributed algorithms are the future of machine learning because\
    \ the increasing data set sizes are difficult to process on single machines. The\
    \ current work deals with the development of optimization techniques to solve\
    \ large-scale problems on single machine. But work has used mini-batching scheme\
    \ in proposed techniques so it has potential to extend the work to parallel and\
    \ distributed setting. The research has already picked up the pace in this direction.\
    \ This is one of the most fascinating research directions, as it offers truly\
    \ scalable solutions to solve the big data challenge.\n\n4.  *Non-linear Models*\n\
    \n    During the last decade, the main focus has been on the linear models. Non-linear\
    \ models are more accurate than the linear models, so another interesting but\
    \ even more complex problem is to extend the work to non-linear models.\n\n# Bibliography\n\
    \n1.  [\\[1\\]](#03chap_02.xhtml#fn_refbib_1) Shigeo Abe. Fuzzy support vector\
    \ machines for multilabel classification. Pattern Recognition, 48(6):2110–2117,\
    \ 2015.\n\n2.  [\\[2\\]](#03chap_02.xhtml#fn_refbib_2) Shigeo Abe and Takuya Inoue.\
    \ Fuzzy support vector machines for multiclass problems. In in European Symposium\
    \ on Artificial Neural Networks, 2002, pages 113–118, 2002.\n\n3.  [\\[3\\]](#10chap_07.xhtml#fn_refbib_3) Naman\
    \ Agarwal, Brian Bullins, and Elad Hazan. Second-order stochastic optimization\
    \ for machine learning in linear time. Journal of Machine Learning Research, 18(116):1–40,\
    \ 2017.\n\n4.  [\\[4\\]](#06chap_04.xhtml#fn_refbib_4) Zeyuan Allen-Zhu. Katyusha:\
    \ The First Direct Acceleration of Stochastic Gradient Methods. Journal of Machine\
    \ Learning Research, 18(1):8194–8244, 2017.\n\n5.  [\\[5\\]](#02chap_01.xhtml#fn_refbib_5) P\
    \ Baldi, P Sadowski, and D Whiteson. Searching for exotic particles in high-energy\
    \ physics with deep learning. Nat. Commun., 5:4308, Jul 2014.\n\n6.  [\\[6\\]](#03chap_02.xhtml#fn_refbib_6) Amir\
    \ Beck and Luba Tetruashvili. On the convergence of block coordinate descent type\
    \ methods. SIAM Journal on Optimization, 23(4):2037–2060, 2013.\n\n7.  [\\[7\\\
    ]](#03chap_02.xhtml#fn_refbib_7) Stephen Becker and Mohamed-Jalal Fadili. A quasi-newton\
    \ proximal splitting method. In *Advances in Neural Information Processing Systems\
    \ 25: 26th Annual Conference on Neural Information Processing Systems 2012. Proceedings\
    \ of a meeting held December 3-6, 2012*, *Lake Tahoe, Nevada, United States*.,\
    \ pages 2627–2635, 2012.\n\n8.  [\\[8\\]](#10chap_07.xhtml#fn_refbib_8) Stefania\
    \ Bellavia, NataÅ¡a Krejic, and NataÅ¡a Krklec Jerinkic. Subsampled inexact newton\
    \ methods for minimizing large sums of convex functions. Optimization Online,\
    \ 2018.\n\n9.  [\\[9\\]](#10chap_07.xhtml#fn_refbib_9) Albert S Berahas, Jorge\
    \ Nocedal, and Martin Takac. A multi-batch l-bfgs method for machine learning.\
    \ In Advances in Neural Information Processing Systems 29, pages 1055–1063. 2016.\n\
    \n10.  [\\[10\\]](#10chap_07.xhtml#fn_refbib_10) R. Bollapragada, R. Byrd, and\
    \ J. Nocedal. Exact and Inexact Subsampled Newton Methods for Optimization. IMA\
    \ Journal of Numerical Analysis, 39(2):545–578, 2019.\n\n11.  [\\[11\\]](#10chap_07.xhtml#fn_refbib_11) Raghu\
    \ Bollapragada, Jorge Nocedal, Dheevatsa Mudigere, Hao-Jun Shi, and Ping Tak Peter\
    \ Tang. A progressive batching l-BFGS method for machine learning. In *Proceedings\
    \ of the 35th International Conference on Machine Learning*, volume 80 of *Proceedings\
    \ of Machine Learning Research*, pages 620–629. PMLR, 2018.\n\n12.  [\\[12\\]](#02chap_01.xhtml#fn_refbib_12) Bernhard\
    \ E. Boser, Isabelle M. Guyon, and Vladimir N. Vapnik. A training algorithm for\
    \ optimal margin classifiers. In *Proceedings of the 5th Annual ACM Workshop on\
    \ Computational Learning Theory*, pages 144–152. ACM Press, 1992.\n\n13.  [\\\
    [13\\]](#03chap_02.xhtml#fn_refbib_13) L Bottou and C J Lin. Support Vector Machine\
    \ Solvers. Science, 3(1)7477:1–27, 2007."
