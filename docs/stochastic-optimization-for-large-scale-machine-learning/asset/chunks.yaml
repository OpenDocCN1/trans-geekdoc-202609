    \ FIRST ORDER METHODS**\n\nThis part has three chapters which provide techniques\
    \ to solve large-scale learning problems using first order methods:\n\n[**Chapter\
    \ 3**](#05chap_03.xhtml): In this chapter, Batch Block Optimization Framework\
    \ has been developed to solve big data problems using the best of stochastic approximation\
    \ as well as the best of coordinate descent approaches, independent of any solver.\
    \ Two novel Stochastic Average Adjusted Gradient methods (SAAG) have been proposed\
    \ to reduce variance in mini-batch and block-coordinate setting of the developed\
    \ framework \\[23\\].\n\n[**Chapter 4**](#06chap_04.xhtml): In this chapter, we\
    \ have proposed novel variants of SAAG-I and II, called SAAG-III and IV, respectively.\
    \ We also extend SAAGs (I, II, III, IV), to solve non-smooth problems and design\
    \ two update rules for smooth and non-smooth problems \\[28\\].\n\n[**Chapter\
    \ 5**](#07chap_05.xhtml): In this chapter, we have proposed simple sampling techniques\
    \ to handle the big data problems in machine learning. The idea is to reduce the\
    \ training time through reducing data access time by proposing systematic sampling\
