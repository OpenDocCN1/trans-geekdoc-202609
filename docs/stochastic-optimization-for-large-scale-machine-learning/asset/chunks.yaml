- raw: "Stochastic approximation is one of the effective approach to deal with the\
    \ large-scale machine learning problems and the recent research has focused on\
    \ reduction of variance, caused by the noisy approximations of the gradients.\
    \ In this chapter, we have proposed novel variants of SAAG-I and II (Stochastic\
    \ Average Adjusted Gradient) Chauhan et el. (2017) \\[23\\], called SAAG-III and\
    \ IV, respectively. Unlike SAAG-I, starting point is set to average of previous\
    \ epoch in SAAG-III, and unlike SAAG-II, the snap point and starting point are\
    \ set to average and last iterate of previous epoch in SAAG-IV, respectively.\
    \ To determine the step size, we use Stochastic Backtracking-Armijo line Search\
    \ (SBAS) which performs line search only on selected mini-batch of data points.\
    \ Since backtracking line search is not suitable for large-scale problems and\
    \ the constants used to find the step size, like Lipschitz constant, are not always\
    \ available so SBAS could be very effective in such cases. We extend SAAGs (I,\
    \ II, III, IV), to solve non-smooth problems and design two update rules for smooth\
    \ and non-smooth problems. Moreover, our theoretical results prove linear convergence\
    \ of SAAG-IV for all the four combinations of smoothness and strong-convexity,\
    \ in expectation. Finally, our experimental studies prove the efficacy of proposed\
    \ methods against the state-of-art techniques.\n\n## 4.1 Introduction\n\nPlease\
    \ refer to [Section 3.1](#05chap_03.xhtml#sec3_1) for discussion on the big data\
    \ challenge and need of efficient and scalable algorithms for tackling the challenge.\n\
    \nVariance is defined as the difference between gradient calculated on the whole\
    \ dataset and on randomly selected data point. This variance could cause divergence\
    \ of the stochastic gradient methods or slow down the convergence of the method.\
    \ There are different approaches for variance reduction like mini-batching, decreasing\
    \ learning rates, importance sampling and variance reduction techniques. Here,\
    \ we have proposed novel variance reduction methods by extending SAAG-I and II\
    \ to solve large-scale learning problems.\n\n### 4.1.1  Optimization Problem\n\
    \nIn this chapter, we consider composite convex optimization problem, as given\
    \ below:\n\n$$\\\\begin{array}{l} {\\\\underset{w \\\\in {\\\\mathbb{R}}^{d}}{\\\
    \\min}\\\\,\\\\,\\\\left\\\\{ {F(w) = f(w) + g(w) = \\\\frac{1}{n}{\\\\sum\\\\\
    limits\\_{i = 1}^{n}f\\_{i}}(w) + g(w),} \\\\right\\\\}} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(4.1)\n\nwhere *f*(*w*) is a finite average of component functions *f*[*i*](*w*):ℝ^(*d*)→ℝ, *i*\\\
    =1,2,...,*n*, are convex and smooth, *g*(*w*):ℝ^(*d*)→ℝ is a relatively simple\
    \ convex but possibly non-differentiable function (also referred to as regularizer\
    \ and sometimes as proximal function). This kind of optimization problems can\
    \ be found in operation research, data science, signal processing, statistics\
    \ and machine learning. For example, regularized Empirical Risk Minimization (ERM)\
    \ problem is a common problem in machine learning, which is average of losses\
    \ on the training dataset. In ERM, component function *f*[*i*](*w*) denotes value\
    \ of loss function at one data point, e.g., in binary classification, it can be\
    \ logistic loss, i.e., *f*[*i*](*w*) = log (1+exp(−*y*[*i*]*w*^(*T*)*x*[*i*])),\
    \ where {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*n*],*y*[*n*])} is collection\
    \ of training data points, and hinge-loss, i.e., *f*[*i*](*w*) = max (0,1−*y*[*i*]*w*^(*T*)*x*[*i*]);\
    \ for regression problem, it can be least squares, i.e., *f*[*i*](*w*) = 1/2(*w*^(*T*)*x*[*i*] − *y*[*i*])².\
    \ The regularizer can be *λ*[1]∥*w*∥[1] (*l*[1]\\-regularizer), *λ*[2]/2∥*w*∥²\
    \ (*l*[2]\\-regularizer) and *λ*[1]∥*w*∥[1] + *λ*[2]/2∥*w*∥² (elastic net regularizer),\
    \ where *λ*[1] and *λ*[2] are regularization coefficients. Thus, problems like\
    \ logistic regression, SVM, ridge regression and lasso etc., fall under ERM.\n\
    \n### 4.1.2  Solution Techniques for Optimization Problem\n\nThe simple first\
    \ order method to solve problem (4.1) is given by Cauchy in his seminal work in\
    \ 1847, known as Gradient Descent (GD) method \\[20\\], is given below for (*k* + 1)^(*t**h*)\
    \ iteration as:\n\n$$\\\\begin{array}{l} {w\\_{k + 1} = w\\_{k} - \\\\eta\\_{k}\\\
    \\left\\\\lbrack {\\\\frac{1}{n}{\\\\sum\\\\limits\\_{i = 1}^{n}\\\\nabla}f\\\
    _{i}(w\\_{k}) + \\\\nabla g(w\\_{k})} \\\\right\\\\rbrack,} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(4.2)\n\nwhere *η*[*k*] is the learning rate (also known as step size in\
    \ optimization). For non-smooth regularizer, i.e., when *g*(*w*) is non-smooth\
    \ then typically, proximal step is calculated after the gradient step, and method\
