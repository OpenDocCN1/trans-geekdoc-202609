    ## 4.5  Analysis


    In general, SAAG-IV gives better results for large-scale learning problems as
    compared to SAAG-III. So, in this section, we provide convergence rates of SAAG-IV
    considering all cases of smoothness with strong convexity. Moreover, analysis
    of SAAG-III represents a typical case due to the biased nature of gradient estimator
    and the fact that the full gradient is incrementally maintained rather than being
    calculated at a fix point, like in SAAG-IV. So, analysis of SAAG-III is left open.
    The convergence rates for all the different combinations of smoothness and strong
    convexity are given below.


    Following assumptions are considered in the chapter:


    We derive our proofs by taking motivation from \[39\] and \[138\]. Before providing
    the proofs, we provide certain lemmas, as given below:


    Following the [Lemma 2](#06chap_04.xhtml#lemma_2) for non-smooth problems, one
    can easily prove the following results for the smooth problems,


    All the proofs given here prove linear convergence (as per definition of convergence)
    of SAAG-IV for all the four combinations of smoothness and strong-convexity with
    some initial errors due to the constant terms in the results. SAAGs are based
    on intuitions from practice \[23\] and they try to give more importance to the
    latest gradient values than the older gradient values, which make them biased
    techniques and results into this extra constant term. This constant term signifies
    that SAAGs converge to a region close to the solution, which is very practical
    because all the machine learning algorithms are used to solve the problems approximately
    and we never find an exact solution for the problem \[[15](#bib.xhtml#refbib_15)\],
    because of computational difficulty. Moreover, the constant term pops up due to
    the mini-batched gradient value at optimal point, i.e., $\\frac{1}{\\left| B\_{k}
    \\right|}{\\sum\\limits\_{i \\in B\_{k}}\\nabla}f\_{i}(w^{\*})$. If the size of
    the mini-batch increases and eventually becomes equal to the dataset then this
    constant becomes equal to full gradient and vanishes, i.e., $\\frac{1}{n}{\\sum\\limits\_{i
    = 1}^{n}\\nabla}f\_{i}(w^{\*}) = 0.$


    The linear convergence for all combinations of strong convexity and smoothness
    of the regularizer, is the maximum rate exhibited by the first order methods without
    curvature information. SAG, SVRG, SAGA and VR-SGD also exhibit linear convergence
    for the strong convexity and smooth problem but except VR-SGD, they don''t cover
    all the cases, e.g., SVRG does not cover the non-strongly convex cases. However,
    the theoretical results provided by VR-SGD, prove linear convergence for strongly
    convex cases, like our results, but VR-SGD provides only *O*(1/*T*) convergence
    for non-strongly convex cases, unlike our linear convergence results.


