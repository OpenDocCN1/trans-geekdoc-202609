- raw: "For large-scale learning problems or big data problems in machine learning,\
    \ number of data points and/or number of features are large, which lead to high\
    \ per-iteration complexity for the iterative algorithms. To deal with the large-scale\
    \ problems or big data problems in machine learning, stochastic approximation\
    \ and coordinate descent are very effective. Stochastic approximation randomly\
    \ samples one or few data points during each iteration and makes each iteration\
    \ independent of number of data points in the dataset. It has been widely and\
    \ successfully used with first and second order methods.\n\nSimilarly, coordinate\
    \ descent (CD) approach samples one or block of features as variables and rest\
    \ as constants, which makes each iteration independent of number of features.\
    \ So, CD is very effective to deal with the high dimensional problems. It is clear\
    \ that SA and CD are very effective to deal with big data problems. Now, it is\
    \ interesting to study these techniques together because they can make each iteration\
    \ independent of *n* and *l* and that can provide an efficient and scalable solution.\
    \ The combination of SA and CD has been studied for first order methods, e.g.,\
    \ \\[133, 140, 146, 152\\], and to the best of our knowledge not studied for second\
    \ order methods. We studied it and proposed BBOF (batch block optimization framework)\
    \ and SAAG-I and II (stochastic average adjusted gradient methods) to work with\
    \ BBOF \\[23\\]. We observed that SA and CD approaches do not work well together\
    \ \\[28\\]. This is because of the extra computational overhead to implement,\
    \ dominates the advantage of using SA and CD together.\n\nIn this chapter, we\
    \ have studied SA and CD together with second order method. We observe similar\
    \ results as observed with first order methods. The advantage of low and controllable\
    \ per-iteration complexity is lost in the extra-overhead to implement the learning\
    \ algorithm due to double sampling, i.e., sampling of data and features, and associated\
