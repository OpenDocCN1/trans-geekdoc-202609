- raw: "In big data problems, high iteration complexity is due to dependency on all\
    \ data points (*l*) and on all features (*p*), during each iteration of the learning\
    \ algorithms. To reduce high iteration complexity, one approach is to use Stochastic\
    \ approximation (SA, \\[113, [67](#bib.xhtml#refbib_67)\\]) which is an iterative\
    \ optimization approach to solve optimization problems which cannot be solved\
    \ directly but using approximations. In machine learning problems, it is computationally\
    \ very expensive, and might be infeasible in some cases, to use all data points\
    \ in each iteration of learning algorithms. So, SA is used which makes each iteration\
    \ independent of *l* by considering one data point or mini-batch of data points,\
    \ i.e., instead of going through all data points, only one data point or mini-batch\
    \ of data points are processed in each iteration which makes a large computational\
    \ difference for large values of *l*. Similarly, remaining data points can be\
    \ used in mini-batches during other iterations. Thus, SA is computationally very\
    \ efficient optimization approach to deal with large-scale problems with large\
    \ number of data points because of using one data point or mini-batch of data\
    \ points instead of using all data, during each iteration of approximation method.\
    \ No doubt that might affect the accuracy of solution, which can be compensated\
    \ by using larger mini-batches and other techniques like SAG \\[[74](#bib.xhtml#refbib_74)\\\
    ] and SAGA \\[35\\] etc. But, SA might not be suitable for problems with large\
    \ number of features (in each data point), because each iteration, in spite of\
    \ being independent of *l*, is still dependent over *p*. Coordinate Descent (CD,\
    \ \\[137\\]) offers another optimization approach to solve large-scale problems\
    \ with large number of features. CD is a recursive approach to solve optimization\
    \ problems by approximate minimization along coordinate directions or coordinate\
    \ hyperplanes, i.e., it recursively solves small subproblems consisting of only\
    \ one or few variables. As SA makes iteration complexity independent of *l*, similarly,\
    \ CD makes iteration complexity independent of *p* by considering one feature\
    \ or block of features as variables, fixing the rest features and solving the\
    \ reduced subproblem thus formed. Then, new one feature or block of features are\
    \ selected as variables while fixing the rest and resulting subproblem is solved.\
    \ This process is repeated until all subproblems covering all features are solved,\
    \ then whole process is repeated until convergence. Thus, CD is a good approach\
    \ to solve large-scale problems with large number of features but again might\
    \ not be sufficient to solve problems with large number of data points. So, it\
    \ is observed that SA makes each iteration independent of *l*, but still, each\
    \ iteration depends on *p* so SA is suitable for problems with large *l* but might\
    \ not be suitable for problems with large values of *p*. On the other hand, CD\
    \ makes each iteration independent of *p*, but still, each iteration depends on\
    \ *l* so CD is suitable for problems with large values of *p* but might not be\
    \ suitable for problems with large values of *l*. Thus, an optimization framework\
    \ (see, [Subsection 3.1.2](#05chap_03.xhtml#sec3_1_2)) can be developed to solve\
    \ big data problems, which makes use of best of SA as well as best of CD. In this\
    \ framework, each iteration is independent of both *l* and *p* by considering\
    \ only one data point or mini-batch of data points with one feature or block of\
    \ features, i.e., each iteration solves a reduced subproblem of one feature or\
    \ block of features over one data point or mini-batch of data points. Thus, whatever\
    \ is the size of the problem, the iteration complexity is very low, making this\
    \ framework efficient and scalable for solving big data problems. By considering\
    \ suitable mini-batch of data points and a block of coordinates during each iteration,\
    \ the framework can be further improved.\n\nLet's apply the above stated ideas\
    \ of SA and CD approaches to Gradient Descent (GD) method to understand how computational\
    \ complexity of a single iteration is reduced to make each iteration simple and\
    \ feasible. For solving problem given in eq.(3.1), the parameter update rule for\
    \ (*k* + 1)^(*t**h*) iteration using GD method is given by\n\n$$\\\\begin{array}{l}\
    \ {w^{k + 1} = w^{k} - \\\\alpha f^{{}^{\\\\prime}}(w^{k}) = w^{k} - \\\\frac{\\\
    \\alpha}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}L\\_{i}^{{}^{\\\\prime}}}(w^{k},x\\\
    _{i},y\\_{i})} \\\\\\\\ \\\\end{array}$$  \n\n(3.4)\n\nwhere *α* is the step size\
    \ and *L*[*i*]^(^′) is gradient of loss function. The computational complexity\
    \ of this iteration is *O*(*l**p*) which is dependent on *l* and *p* both thus\
    \ it would be very expensive and might be even infeasible for large values of\
    \ *l* or *p*, or both. GD exhibits linear convergence rate but at the expense\
    \ of high iteration complexity. Using SA approach with GD method, i.e., Stochastic\
    \ Gradient Descent (SGD) method \\[148\\], taking only one data point during each\
    \ iteration, the subproblem and update rule are given by\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{w}{min}\\\\, L\\_{i\\_{k}}(w,x\\_{i\\_{k}},y\\\
    _{i\\_{k}}),\\\\quad i\\_{k} \\\\in \\\\left\\\\{ 1,2,...,l \\\\right\\\\},} \\\
    \\\\\\ {\\\\quad w^{k + 1} = w^{k} - \\\\alpha L\\_{i\\_{k}}^{{}^{\\\\prime}}(w^{k},x\\\
    _{i\\_{k}},y\\_{i\\_{k}}),\\\\quad i\\_{k} \\\\in \\\\left\\\\{ 1,2,...,l \\\\\
    right\\\\}} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(3.5)\n\nwhere\
    \ *i*[*k*] is randomly selected data point. In SGD, computational complexity of\
    \ iteration is *O*(*p*) which is much smaller than GD method as it considers only\
    \ one data point and it exhibits linear convergence rate \\[[114](#bib.xhtml#refbib_114)\\\
    ] but solution is less accurate as compared to GD due to variance in the gradient\
    \ values of SGD and GD which can be reduced either by using mini-batches of data\
    \ points \\[[81](#bib.xhtml#refbib_81)\\] in each iteration or using variance\
    \ reduction methods, like SAG \\[74\\], SAGA \\[35\\], S2GD \\[71\\] and SVRG\\\
    [63\\] etc.\n\nFor CD approach with GD method, i.e., for Coordinate Gradient Descent\
    \ (CGD) method taking only one coordinate while keeping others fixed following\
    \ subproblem and update rule are obtained:\n\n$$\\\\begin{array}{l} \\\\begin{array}{l}\
    \ {\\\\underset{w\\_{j}}{min}\\\\, f(w\\_{j},w\\_{/j}),\\\\quad j = 1,2,...,p,}\
    \ \\\\\\\\ {w\\_{j}^{k + 1} = w\\_{j}^{k} - \\\\alpha\\\\left\\\\lbrack {f^{{}^{\\\
    \\prime}}(w\\_{< j}^{k + 1},w\\_{\\\\geq j}^{k})} \\\\right\\\\rbrack\\_{j},\\\
    \\quad j = 1,2,...,p,} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n\
    (3.6)\n\nwhere *w*[*j*]^(*k*) means *j*^(*t**h*) coordinate/variable of *w*^(*k*),\
    \ *w*[/*j*]^(*k*) means coordinates of *w*^(*k*) excluding *j*^(*t**h*), \\[*f*^(^′)(.)\\\
    ][*j*] denotes partial derivative w.r.t. *j*^(*t**h*) variable, *w*[ < *j*]^(*k* + 1)\
    \ denotes variables of *w*^(*k* + 1) which are already computed and *w*[ ≥ *j*]^(*k*)\
    \ denotes variables of *w*^(*k*) that have not yet to be advanced to iteration\
    \ (*k* + 1) along with *j*^(*t**h*) variable being updated, i.e., eq.(3.6) updates\
    \ coordinates in Gauss-Seidel-like manner. CGD is dependent on only one variable\
    \ and still exhibits linear convergence rate \\[100, 137\\]. For CGD method computational\
    \ complexity of iteration is *O*(*l*) which is much smaller than GD method. Now,\
    \ by combining SA and CD for GD method, i.e., eqs.(3.5) and (3.6), following subproblem\
    \ and update rule are obtained:\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\
    \\underset{w\\_{j}}{min}\\\\, L\\_{i\\_{k}}(w\\_{j},w\\_{/j},x\\_{i\\_{k}},y\\\
    _{i\\_{k}}),\\\\quad j = 1,2,...,p,\\\\, i\\_{k} \\\\in \\\\left\\\\{ 1,2,...,l\
    \ \\\\right\\\\},} \\\\\\\\ {w\\_{j}^{k + 1} = w\\_{j}^{k} - \\\\alpha\\\\left\\\
    \\lbrack {L\\_{i\\_{k}}^{{}^{\\\\prime}}(w\\_{< j}^{k + 1},w\\_{\\\\geq j}^{k})}\
    \ \\\\right\\\\rbrack\\_{j},\\\\quad j = 1,2,...,p,\\\\, i\\_{k} \\\\in \\\\left\\\
    \\{ 1,2,...,l \\\\right\\\\},} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(3.7)\n\nwhich solves subproblem with one variable over one data point\
    \ and thus have constant computational complexity of iteration as *O*(1). Thus,\
    \ combination of SA and CD provide an efficient and scalable solution to solve\
    \ big data problems of any size."
  fmt: '

    In big data problems, high iteration complexity is due to dependency on all data
    points (`l`) and on all features (`p`), during each iteration of the learning
    algorithms. To reduce high iteration complexity, one approach is to use Stochastic
    approximation (SA, [113, [67](#bib.xhtml#refbib_67)]) which is an iterative optimization
    approach to solve optimization problems which cannot be solved directly but using
    approximations. In machine learning problems, it is computationally very expensive,
    and might be infeasible in some cases, to use all data points in each iteration
    of learning algorithms. So, SA is used which makes each iteration independent
    of `l` by considering one data point or mini-batch of data points, i.e., instead
    of going through all data points, only one data point or mini-batch of data points
    are processed in each iteration which makes a large computational difference for
    large values of `l`. Similarly, remaining data points can be used in mini-batches
    during other iterations. Thus, SA is computationally very efficient optimization
    approach to deal with large-scale problems with large number of data points because
    of using one data point or mini-batch of data points instead of using all data,
    during each iteration of approximation method. No doubt that might affect the
    accuracy of solution, which can be compensated by using larger mini-batches and
    other techniques like SAG [[74](#bib.xhtml#refbib_74)] and SAGA [35] etc. But,
    SA might not be suitable for problems with large number of features (in each data
    point), because each iteration, in spite of being independent of `l`, is still
    dependent over `p`. Coordinate Descent (CD, [137]) offers another optimization
    approach to solve large-scale problems with large number of features. CD is a
    recursive approach to solve optimization problems by approximate minimization
    along coordinate directions or coordinate hyperplanes, i.e., it recursively solves
    small subproblems consisting of only one or few variables. As SA makes iteration
    complexity independent of `l`, similarly, CD makes iteration complexity independent
    of `p` by considering one feature or block of features as variables, fixing the
    rest features and solving the reduced subproblem thus formed. Then, new one feature
    or block of features are selected as variables while fixing the rest and resulting
    subproblem is solved. This process is repeated until all subproblems covering
    all features are solved, then whole process is repeated until convergence. Thus,
    CD is a good approach to solve large-scale problems with large number of features
    but again might not be sufficient to solve problems with large number of data
    points. So, it is observed that SA makes each iteration independent of `l`, but
    still, each iteration depends on `p` so SA is suitable for problems with large
    `l` but might not be suitable for problems with large values of `p`. On the other
    hand, CD makes each iteration independent of `p`, but still, each iteration depends
    on `l` so CD is suitable for problems with large values of `p` but might not be
    suitable for problems with large values of `l`. Thus, an optimization framework
    (see, [Subsection 3.1.2](#05chap_03.xhtml#sec3_1_2)) can be developed to solve
    big data problems, which makes use of best of SA as well as best of CD. In this
    framework, each iteration is independent of both `l` and `p` by considering only
    one data point or mini-batch of data points with one feature or block of features,
    i.e., each iteration solves a reduced subproblem of one feature or block of features
    over one data point or mini-batch of data points. Thus, whatever is the size of
    the problem, the iteration complexity is very low, making this framework efficient
    and scalable for solving big data problems. By considering suitable mini-batch
    of data points and a block of coordinates during each iteration, the framework
    can be further improved.


    Let''s apply the above stated ideas of SA and CD approaches to Gradient Descent
    (GD) method to understand how computational complexity of a single iteration is
    reduced to make each iteration simple and feasible. For solving problem given
    in eq.(3.1), the parameter update rule for (`k` + 1)^(`t`^`h`) iteration using
    GD method is given by


    $$

    \begin{array}{l} {w^{k + 1} = w^{k} - \\alpha f^{{}^{\\prime}}(w^{k}) = w^{k}
    - \\frac{\\alpha}{l}{\\sum\\limits\_{i = 1}^{l}L\_{i}^{{}^{\\prime}}}(w^{k},x\_{i},y\_{i})}
    \\\\ \\end{array}

    $$


    (3.4)


    where `α` is the step size and `L`[*i*]^(^′) is gradient of loss function. The
    computational complexity of this iteration is *O*(*l**p*) which is dependent on
    `l` and `p` both thus it would be very expensive and might be even infeasible
    for large values of `l` or `p`, or both. GD exhibits linear convergence rate but
    at the expense of high iteration complexity. Using SA approach with GD method,
    i.e., Stochastic Gradient Descent (SGD) method [148], taking only one data point
    during each iteration, the subproblem and update rule are given by


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w}{min}\\, L\_{i\_{k}}(w,x\_{i\_{k}},y\_{i\_{k}}),\\quad
    i\_{k} \\in \\left\\{ 1,2,...,l \\right\\},} \\\\ {\\quad w^{k + 1} = w^{k} -
    \\alpha L\_{i\_{k}}^{{}^{\\prime}}(w^{k},x\_{i\_{k}},y\_{i\_{k}}),\\quad i\_{k}
    \\in \\left\\{ 1,2,...,l \\right\\}} \\\\ \\end{array} \\\\ \\end{array}

    $$


    (3.5)


    where `i`[*k*] is randomly selected data point. In SGD, computational complexity
    of iteration is *O*(*p*) which is much smaller than GD method as it considers
    only one data point and it exhibits linear convergence rate [[114](#bib.xhtml#refbib_114)]
    but solution is less accurate as compared to GD due to variance in the gradient
    values of SGD and GD which can be reduced either by using mini-batches of data
    points [[81](#bib.xhtml#refbib_81)] in each iteration or using variance reduction
    methods, like SAG [74], SAGA [35], S2GD [71] and SVRG[63] etc.


    For CD approach with GD method, i.e., for Coordinate Gradient Descent (CGD) method
    taking only one coordinate while keeping others fixed following subproblem and
    update rule are obtained:


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w\_{j}}{min}\\, f(w\_{j},w\_{/j}),\\quad
    j = 1,2,...,p,} \\\\ {w\_{j}^{k + 1} = w\_{j}^{k} - \\alpha\\left\\lbrack {f^{{}^{\\prime}}(w\_{<
    j}^{k + 1},w\_{\\geq j}^{k})} \\right\\rbrack\_{j},\\quad j = 1,2,...,p,} \\\\
    \\end{array} \\\\ \\end{array}

    $$


    (3.6)


    where `w`[*j*]^(`k`) means `j`^(`t`^`h`) coordinate/variable of `w`^(`k`), `w`[/`j`]^(`k`)
    means coordinates of `w`^(`k`) excluding `j`^(`t`^`h`), [`f`^(^′)(.)][`j`] denotes
    partial derivative w.r.t. `j`^(`t`^`h`) variable, `w`[ < `j`]^(`k` + 1) denotes
    variables of `w`^(`k` + 1) which are already computed and `w`[ ≥ `j`]^(`k`) denotes
    variables of `w`^(`k`) that have not yet to be advanced to iteration (`k` + 1)
    along with `j`^(`t`^`h`) variable being updated, i.e., eq.(3.6) updates coordinates
    in Gauss-Seidel-like manner. CGD is dependent on only one variable and still exhibits
    linear convergence rate [100, 137]. For CGD method computational complexity of
    iteration is *O*(*l*) which is much smaller than GD method. Now, by combining
    SA and CD for GD method, i.e., eqs.(3.5) and (3.6), following subproblem and update
    rule are obtained:


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w\_{j}}{min}\\, L\_{i\_{k}}(w\_{j},w\_{/j},x\_{i\_{k}},y\_{i\_{k}}),\\quad
    j = 1,2,...,p,\\, i\_{k} \\in \\left\\{ 1,2,...,l \\right\\},} \\\\ {w\_{j}^{k
    + 1} = w\_{j}^{k} - \\alpha\\left\\lbrack {L\_{i\_{k}}^{{}^{\\prime}}(w\_{< j}^{k
    + 1},w\_{\\geq j}^{k})} \\right\\rbrack\_{j},\\quad j = 1,2,...,p,\\, i\_{k} \\in
    \\left\\{ 1,2,...,l \\right\\},} \\\\ \\end{array} \\\\ \\end{array}

    $$


    (3.7)


    which solves subproblem with one variable over one data point and thus have constant
    computational complexity of iteration as *O*(1). Thus, combination of SA and CD
    provide an efficient and scalable solution to solve big data problems of any size.

    '
  trans: '


    在大数据问题中，高迭代复杂度是由于学习算法每次迭代都依赖于所有数据点（`l`）和所有特征（`p`）所致。为了降低高迭代复杂度，一种方法是使用随机近似（SA，113,
    [67]），这是一种迭代优化方法，用于解决无法直接求解但可通过近似求解的优化问题。在机器学习问题中，在学习算法的每次迭代中使用所有数据点在计算上非常昂贵，在某些情况下甚至可能不可行。因此，使用
    SA，它通过考虑一个数据点或一小批数据点，使每次迭代独立于 `l`，即，不遍历所有数据点，而是在每次迭代中只处理一个数据点或一小批数据点，这对于较大的 `l`
    值会产生巨大的计算差异。同样，剩余的数据点可以在其他迭代中以小批量使用。因此，SA 是一种计算效率非常高的优化方法，用于处理具有大量数据点的大规模问题，因为在近似方法的每次迭代中，它使用一个数据点或一小批数据点，而不是使用所有数据。毫无疑问，这可能会影响解的准确性，这可以通过使用更大的小批量以及
    SAG [74] 和 SAGA [35] 等其他技术来补偿。但是，对于特征数量较多（每个数据点中）的问题，SA 可能不合适，因为每次迭代，尽管独立于 `l`，但仍然依赖于
    `p`。坐标下降（CD，[137]）提供了另一种优化方法，用于解决具有大量特征的大规模问题。CD 是一种递归方法，通过沿坐标方向或坐标超平面进行近似最小化来解决优化问题，即，它递归地求解仅包含一个或几个变量的小子问题。正如
    SA 使迭代复杂度独立于 `l`，同样，CD 通过将一个特征或一组特征作为变量，固定其余特征并求解由此形成的缩小子问题，使迭代复杂度独立于 `p`。然后，选择一个新的特征或一组特征作为变量，固定其余特征，并求解得到的子问题。此过程重复，直到覆盖所有特征的所有子问题都求解完毕，然后重复整个过程直到收敛。因此，CD
    是解决具有大量特征的大规模问题的好方法，但同样可能不足以解决具有大量数据点的问题。因此，观察到 SA 使每次迭代独立于 `l`，但每次迭代仍然依赖于 `p`，因此
    SA 适用于 `l` 较大的问题，但可能不适用于 `p` 值较大的问题。另一方面，CD 使每次迭代独立于 `p`，但每次迭代仍然依赖于 `l`，因此 CD
    适用于 `p` 值较大的问题，但可能不适用于 `l` 值较大的问题。因此，可以开发一个优化框架（参见，Subsection 3.1.2）来解决大数据问题，该框架利用
    SA 和 CD 的优点。在这个框架中，每次迭代都独立于 `l` 和 `p`，通过仅考虑一个数据点或一小批数据点以及一个特征或一组特征，即，每次迭代求解一个数据点或一小批数据点上一个特征或一组特征的缩小子问题。因此，无论问题的大小如何，迭代复杂度都非常低，使该框架在解决大数据问题时高效且可扩展。通过在每次迭代中考虑合适的数据点小批量和一组坐标，该框架可以进一步改进。


    让我们将上述 SA 和 CD 方法的思想应用于梯度下降（GD）方法，以了解单次迭代的计算复杂度是如何降低，从而使每次迭代简单且可行。对于求解 eq.(3.1)
    给出的问题，使用 GD 方法的 (`k` + 1)^(`t`^`h`) 次迭代的参数更新规则如下


    $$

    \begin{array}{l} {w^{k + 1} = w^{k} - \\alpha f^{{}^{\\prime}}(w^{k}) = w^{k}
    - \\frac{\\alpha}{l}{\\sum\\limits\_{i = 1}^{l}L\_{i}^{{}^{\\prime}}}(w^{k},x\_{i},y\_{i})}
    \\\\ \\end{array}

    $$


    (3.4)


    其中 `α` 是步长，`L`[*i*]^(^′) 是损失函数的梯度。此次迭代的计算复杂度为 *O*(*l**p*)，它同时依赖于 `l` 和 `p`，因此对于
    `l` 或 `p` 或两者的较大值，计算成本会非常高，甚至可能不可行。GD 表现出线性收敛率，但代价是高迭代复杂度。将 SA 方法与 GD 方法结合使用，即随机梯度下降（SGD）方法
    [148]，每次迭代只取一个数据点，子问题和更新规则如下


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w}{min}\\, L\_{i\_{k}}(w,x\_{i\_{k}},y\_{i\_{k}}),\\quad
    i\_{k} \\in \\left\\{ 1,2,...,l \\right\\},} \\\\ {\\quad w^{k + 1} = w^{k} -
    \\alpha L\_{i\_{k}}^{{}^{\\prime}}(w^{k},x\_{i\_{k}},y\_{i\_{k}}),\\quad i\_{k}
    \\in \\left\\{ 1,2,...,l \\right\\}} \\\\ \\end{array} \\\\ \\end{array}

    $$


    (3.5)


    其中 `i`[*k*] 是随机选择的数据点。在 SGD 中，迭代的计算复杂度为 *O*(*p*)，这比 GD 方法小得多，因为它只考虑一个数据点，并且表现出线性收敛率
    [114]，但与 GD 相比，解的准确性较低，因为 SGD 和 GD 的梯度值存在方差，这可以通过在每次迭代中使用数据点小批量 [81] 或使用方差减少方法（如
    SAG [74]、SAGA [35]、S2GD [71] 和 SVRG[63] 等）来降低。


    对于 GD 方法的 CD 方法，即坐标梯度下降（CGD）方法，在保持其他坐标固定的情况下只取一个坐标，得到以下子问题和更新规则：


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w\_{j}}{min}\\, f(w\_{j},w\_{/j}),\\quad
    j = 1,2,...,p,} \\\\ {w\_{j}^{k + 1} = w\_{j}^{k} - \\alpha\\left\\lbrack {f^{{}^{\\prime}}(w\_{<
    j}^{k + 1},w\_{\\geq j}^{k})} \\right\\rbrack\_{j},\\quad j = 1,2,...,p,} \\\\
    \\end{array} \\\\ \\end{array}

    $$


    (3.6)


    其中 `w`[*j*]^(`k`) 表示 `w`^(`k`) 的第 `j`^(`t`^`h`) 个坐标/变量，`w`[/`j`]^(`k`) 表示 `w`^(`k`)
    中排除第 `j`^(`t`^`h`) 个坐标的坐标，[`f`^(^′)(.)][`j`] 表示对第 `j`^(`t`^`h`) 个变量的偏导数，`w`[ < `j`]^(`k` + 1)
    表示 `w`^(`k` + 1) 中已计算的变量，`w`[ ≥ `j`]^(`k`) 表示 `w`^(`k`) 中尚未推进到迭代 (`k` + 1) 的变量，与正在更新的第
    `j`^(`t`^`h`) 变量一起，即，eq.(3.6) 以类似高斯-赛德尔的方式更新坐标。CGD 仅依赖于一个变量，并且仍然表现出线性收敛率 [100,
    137]。对于 CGD 方法，迭代的计算复杂度为 *O*(*l*)，这比 GD 方法小得多。现在，通过将 SA 和 CD 结合用于 GD 方法，即 eqs.(3.5)
    和 (3.6)，得到以下子问题和更新规则：


    $$

    \begin{array}{l} \begin{array}{l} {\\underset{w\_{j}}{min}\\, L\_{i\_{k}}(w\_{j},w\_{/j},x\_{i\_{k}},y\_{i\_{k}}),\\quad
    j = 1,2,...,p,\\, i\_{k} \\in \\left\\{ 1,2,...,l \\right\\},} \\\\ {w\_{j}^{k
    + 1} = w\_{j}^{k} - \\alpha\\left\\lbrack {L\_{i\_{k}}^{{}^{\\prime}}(w\_{< j}^{k
    + 1},w\_{\\geq j}^{k})} \\right\\rbrack\_{j},\\quad j = 1,2,...,p,\\, i\_{k} \\in
    \\left\\{ 1,2,...,l \\right\\},} \\\\ \\end{array} \\\\ \\end{array}

    $$


    (3.7)


    它求解一个数据点上一个变量的子问题，因此迭代的计算复杂度为常数 *O*(1)。因此，SA 和 CD 的结合为解决任何规模的大数据问题提供了高效且可扩展的解决方案。


    '
