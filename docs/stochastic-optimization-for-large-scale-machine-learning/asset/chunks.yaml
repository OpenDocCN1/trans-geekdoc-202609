    $$\n\n(2.32)\n\n### 2.3.11 Twin SVM (2007)\n\nTwin SVM (TWSVM, [56]) is an extension\
    \ of PSVM [45] via generalized eigen values. As the name suggests, TWSVM is a\
    \ binary classifier that solves two related small sized SVM problems and gives\
    \ two non-parallel planes. A new test point is classified as per the closest plane.\
    \ TWSVM is faster than standard SVM and gives good generalization results [56].\
    \ It helps in automatically discovering two-dimensional projections of the data.\
    \ Each of the non-parallel planes is closer to one of class and is as far as possible\
    \ from the other class. TWSVM is comprised of two quadratic programming problems\
    \ in which the objective function of one problem is represented by the data points\
    \ of one class and constraints are represented by the data points of other class.\
    \ This leads to two smaller SVM problems given below.\n\n$$\n\\begin{array}{l}\
    \ \n\\begin{array}{ll} \n\\text{(TWSVM~1)} & {\\underset{w^{(1)},b^{(1)},q}{\\\
    min}\\,\\,\\frac{1}{2}\\left( {Aw^{(1)} + \\mathbf{1}_{1}b^{(1)}} \\right)^{T}\\\
    left( {Aw^{(1)} + \\mathbf{1}_{1}b^{(1)}} \\right) + C_{1}\\mathbf{1}_{2}^{T}q}\
    \ \\\\\\\\ \n{\\text{s.t.}} & {- \\left( {Bw^{(1)} + \\mathbf{1}_{2}b^{(1)}} \\\
    right) + q \\geq \\mathbf{1}_{2},\\quad q \\geq 0} \\\\\\\\ \n\\text{(TWSVM~2)}\
    \ & {\\underset{w^{(2)},b^{(2)},q}{\\min}\\,\\,\\frac{1}{2}\\left( {Bw^{(2)} +\
    \ \\mathbf{1}_{2}b^{(2)}} \\right)^{T}\\left( {Bw^{(2)} + \\mathbf{1}_{2}b^{(2)}}\
    \ \\right) + C_{2}\\mathbf{1}_{1}^{T}q} \\\\\\\\ \n{\\text{s.t.}} & {\\left( {Aw^{(2)}\
    \ + \\mathbf{1}_{1}b^{(2)}} \\right) + q \\geq \\mathbf{1}_{1},\\quad q \\geq\
    \ 0} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.33)\n"
  trans: "\n\nwhere `w`, `γ` 是参数，`A` 是 `l × n` 矩阵，表示 `n` 维实空间 `ℝ^(n)` 中的 `l` 个数据点，根据每个点\
    \ `A[i]` 在类别 `A+` 或 `A−` 中的隶属关系，由给定的 `l × l` 对角矩阵 `D` 指定，其对角线上为 `+1` 或 `−1`。`ν\
    \ > 0`，`1` = 单位向量，`y` 表示误差。该问题的解可以直接用问题数据表示。\n\n平面 `x^(T)w − γ = ±1` 不再是边界平面，而是可以看作每个类别的点聚集在其周围的近似平面，并且由目标函数中的项\
    \ `(w^(T)w + γ²)` 将其尽可能推开。Proximal SVM 的决策函数为 `sign(w^(T)x − γ)`。带系数 `u` 的拉格朗日函数为\n\
    \n$$\n\\begin{array}{l} \n\\begin{array}{l} \n{L(w,\\gamma,y,u) = \\frac{\\nu}{2}\\\
    | y\\|^{2} + \\frac{1}{2}\\left\\| \\left\\lbrack \\begin{array}{l} w \\\\\\\\\
    \ \\gamma \\\\\\\\ \\end{array} \\right\\rbrack \\right\\|^{2} - u^{T}\\left(\
    \ {D\\left( {Aw - \\mathbf{1}\\gamma} \\right) + y - \\mathbf{1}} \\right)} \\\
    \\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.24)\n\n使用 Karush–Kuhn–Tucker\
    \ (KKT) 条件求解得到\n\n$$\n\\begin{array}{l} \n{w = A^{T}Du,\\quad\\gamma = - \\mathbf{1}^{T}Du,\\\
    quad y = \\frac{u}{\\nu}} \\\\\\\\ \n\\end{array}\n$$\n\n$$\n\\begin{array}{l}\
    \ \n\\begin{array}{l} \n{u = \\left( {\\frac{I}{\\nu} + D\\left( {AA^{T} + \\\
    mathbf{1}\\mathbf{1}^{T}} \\right)D} \\right)^{- 1}\\mathbf{1} = \\left( {\\frac{I}{\\\
    nu} + HH^{T}} \\right)^{- 1}\\mathbf{1}} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\\
    end{array}\n$$\n\n(2.25)\n\n其中 `H = D[A − 1]`。方程 (2.25) 给出了 eq. (2.23) 的显式解。\n\
    \n### 2.3.9 Crammer Singer SVM (2002)\n\n[33] 提出了一种多类 SVM (CSSVM)，与 OVR [132]\
    \ 和 OVO [72] 不同，它训练一个单一的 SVM 分类器，并计算 `m`（类别数量）个决策函数来对测试数据点进行分类。问题公式为：\n\n$$\n\\\
    begin{array}{l} \n\\begin{array}{ll} \n& {\\underset{w_{k},\\xi_{i}}{\\min}\\\
    quad\\frac{1}{2}{\\sum\\limits_{k = 1}^{m}w_{k}^{T}}w_{k} + C{\\sum\\limits_{i\
    \ = 1}^{l}\\xi_{i}}} \\\\\\\\ \n{\\text{s.t.}} & {w_{y_{i}}^{T}x_{i} - w_{k}^{T}x_{i}\
    \ \\geq e_{i}^{k} - \\xi_{i},\\quad i = 1,...,l,} \\\\\\\\ \n\\end{array} \\\\\
    \\\\ \n\\end{array}\n$$\n\n(2.26)\n\n$$\n\\begin{array}{l} \n{\\text{where}\\\
    quad e_{i}^{k} \\equiv 1 - \\delta_{y_{i},k}\\text{~and~}\\delta_{y_{i},k} = \\\
    left\\{ \\begin{array}{l} {1\\quad\\text{if}\\quad y_{i} = k} \\\\\\\\ {0\\quad\\\
    text{if}\\quad y_{i} \\neq k} \\\\\\\\ \\end{array}~ \\right.} \\\\\\\\ \n\\end{array}\n\
    $$\n\n决策函数为\n\n$$\n\\begin{array}{l} \n\\begin{array}{l} \n{\\underset{k = 1,2,...,m}{argmax}\\\
    quad w_{k}^{T}x.} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.27)\n\
    \nCrammer Singer SVM (CSSVM) 与其他问题的主要区别在于，CSSVM 不需要显式写出约束 `ξ[i] ≥ 0`，因为当 `y[i]\
    \ = k` 时，`e[i]^(k) = 0`，因此 eq. (2.26) 变为 `0 ≥ 0 − ξ[i]`，这正好就是 `ξ[i] ≥ 0`。它只包含\
    \ `ξ[i]`，`i = 1, 2, ..., l`，共 `l` 个松弛变量，而不是使用 `ξ[i]^(k)` 作为每对决策平面之间的间隔。CSSVM 的对偶问题为：\n\
    \n$$\n\\begin{array}{l} \n\\begin{array}{ll} \n& {\\underset{\\alpha}{\\min}\\\
    quad\\frac{1}{2}{\\sum\\limits_{k = 1}^{m}{\\| w_{k}\\|^{2}}} + {\\sum\\limits_{i\
    \ = 1}^{l}{\\sum\\limits_{k = 1}^{m}e_{i}^{k}}}\\alpha_{i}^{k}} \\\\\\\\ \n{\\\
    text{s.t.}} & {{\\sum\\limits_{k = 1}^{m}\\alpha_{i}^{k}} = 0,\\quad i = 1,...,l,}\
    \ \\\\\\\\ \n& {\\alpha_{i}^{k} \\leq C_{y_{i}}^{k},\\quad i = 1,..,l,\\ k = 1,...,m,}\
    \ \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.28)\n\n其中 $w_{k} =\
    \ {\\sum\\limits_{i = 1}^{l}\\alpha_{i}^{k}}x_{i},\\forall k$ 和 $C_{y_{i}}^{k}\
    \ = \\left\\{ \\begin{array}{l} {C\\quad\\text{if}\\quad y_{i} = k} \\\\\\\\ {0\\\
    quad\\text{if}\\quad y_{i} \\neq k} \\\\\\\\ \\end{array}~ \\right.$。\n\n### 2.3.10\
    \ Eν-SVM (2003)\n\n分类用的 `ν`-SVM[116] (`ν`-SVC) 提出了一种求解 SVM 的不同公式，引入了新参数 `ν`。`ν`\
    \ 给出了支持向量数量的上界。`ν` 还移除了 `C`，`C` 是边界大小与训练误差之间权衡的度量。先验选择 `C` 是困难的。`ν` 的值并不总是可以取\
    \ 0 到 1 之间的所有可能值，这限制了可能解的范围。要么是因为训练集不可分，要么是因为类别不平衡。因此，`ν`-SVM [116] 扩展为 `Eν`-SVM\
    \ [109]，其中使用 `ν` 构建了一个新问题，以帮助控制边界、误差和支持向量。在 `Eν`-SVM 中，`ν` 的值不能取 0 到 1 的完整范围。对于\
    \ `l` 个训练点，`ν` 的值可以定义为：\n\n$$\n\\begin{array}{l} \n\\begin{array}{l} \n{\\nu_{*}\
    \ = \\underset{C\\rightarrow\\infty}{lim}\\quad\\frac{1}{lC}{\\sum\\limits_{i\
    \ = 1}^{l}\\alpha_{i}^{C}},\\quad\\nu_{*} = \\underset{C\\rightarrow 0}{lim}\\\
    quad\\frac{1}{lC}{\\sum\\limits_{i = 1}^{l}\\alpha_{i}^{C}}} \\\\\\\\ \n\\end{array}\
    \ \\\\\\\\ \n\\end{array}\n$$\n\n(2.29)\n\n其中 `ν[*]` > 0 且 `ν[*]` ≤ 1。原问题如下：\n\
    \n$$\n\\begin{array}{l} \n\\begin{array}{ll} \n& {\\underset{\\rho,w,b,\\xi_{i}}{\\\
    min}\\quad - l\\nu\\rho + {\\sum\\limits_{i = 1}^{l}\\xi_{i}}} \\\\\\\\ \n{\\\
    text{s.t.}} & {y_{i}\\left( {x_{i}^{T}w + b} \\right) \\geq \\rho - \\xi_{i},\\\
    ,\\,\\,\\xi_{i} \\geq 0,\\,\\,\\forall i} \\\\\\\\ \n& {\\frac{1}{2}\\| w\\|^{2}\
    \ = 1} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.30)\n\n对偶问题为：\n\
    \n$$\n\\begin{array}{l} \n\\begin{array}{l} \n{\\underset{\\alpha_{i},\\lambda}{\\\
    max}\\quad L_{D} = - \\frac{1}{2\\lambda}{\\sum\\limits_{i = 1}^{l}{\\sum\\limits_{j\
    \ = 1}^{l}y_{i}}}y_{j}\\alpha_{i}\\alpha_{j}x_{i}^{T}x_{j} - \\lambda} \\\\\\\\\
    \ \n{\\text{s.t.}\\quad\\nu = - \\frac{1}{l}{\\sum\\limits_{i = 1}^{l}\\alpha_{i}},\\\
    quad{\\sum\\limits_{i = 1}^{l}\\alpha_{i}}y_{i} = 0,\\quad 0 \\leq \\alpha_{i}\
    \ \\leq 1,\\,\\,\\forall i} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n\
    $$\n\n(2.31)\n\n$$\n\\begin{array}{l} \n\\begin{array}{l} \n{\\lambda = + \\sqrt{\\\
    frac{1}{2}{\\sum\\limits_{i = 1}^{l}{\\sum\\limits_{j = 1}^{l}y_{i}}}y_{j}\\alpha_{i}\\\
    alpha_{j}x_{i}^{T}xj}.} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n\
    (2.32)\n\n### 2.3.11 Twin SVM (2007)\n\nTwin SVM (TWSVM, [56]) 是通过广义特征值对 PSVM\
    \ [45] 的扩展。顾名思义，TWSVM 是一个二分类器，它求解两个相关的小规模 SVM 问题，并给出两个非平行平面。新的测试点根据最近的平面进行分类。TWSVM\
    \ 比标准 SVM 更快，并能获得良好的泛化结果 [56]。它有助于自动发现数据的二维投影。每个非平行平面更靠近其中一个类别，并且尽可能远离另一个类别。TWSVM\
    \ 由两个二次规划问题组成，其中一个问题的目标函数由一个类别的数据点表示，约束由另一个类别的数据点表示。这导致了以下两个较小的 SVM 问题。\n\n$$\n\
    \\begin{array}{l} \n\\begin{array}{ll} \n\\text{(TWSVM~1)} & {\\underset{w^{(1)},b^{(1)},q}{\\\
    min}\\,\\,\\frac{1}{2}\\left( {Aw^{(1)} + \\mathbf{1}_{1}b^{(1)}} \\right)^{T}\\\
    left( {Aw^{(1)} + \\mathbf{1}_{1}b^{(1)}} \\right) + C_{1}\\mathbf{1}_{2}^{T}q}\
    \ \\\\\\\\ \n{\\text{s.t.}} & {- \\left( {Bw^{(1)} + \\mathbf{1}_{2}b^{(1)}} \\\
    right) + q \\geq \\mathbf{1}_{2},\\quad q \\geq 0} \\\\\\\\ \n\\text{(TWSVM~2)}\
    \ & {\\underset{w^{(2)},b^{(2)},q}{\\min}\\,\\,\\frac{1}{2}\\left( {Bw^{(2)} +\
    \ \\mathbf{1}_{2}b^{(2)}} \\right)^{T}\\left( {Bw^{(2)} + \\mathbf{1}_{2}b^{(2)}}\
    \ \\right) + C_{2}\\mathbf{1}_{1}^{T}q} \\\\\\\\ \n{\\text{s.t.}} & {\\left( {Aw^{(2)}\
    \ + \\mathbf{1}_{1}b^{(2)}} \\right) + q \\geq \\mathbf{1}_{1},\\quad q \\geq\
    \ 0} \\\\\\\\ \n\\end{array} \\\\\\\\ \n\\end{array}\n$$\n\n(2.33)\n\n"
