  trans: '


    对于机器学习中的大规模学习问题或大数据问题，数据点数量和/或特征数量较大，这会导致迭代算法每次迭代的复杂度较高。为了处理机器学习中的大规模问题或大数据问题，随机近似法和坐标下降法非常有效。随机近似法在每次迭代中随机采样一个或少量数据点，并使每次迭代与数据集中的数据点数量无关。它已被广泛且成功地用于一阶和二阶方法。


    同样，坐标下降法（CD）方法将一个或一组特征作为变量，其余作为常数，这使得每次迭代与特征数量无关。因此，CD 对于处理高维问题非常有效。很明显，SA 和 CD
    对于处理大数据问题非常有效。现在，研究这些技术一起使用很有趣，因为它们可以使每次迭代与 `n` 和 `l` 无关，并能提供高效且可扩展的解决方案。SA 和
    CD 的组合已针对一阶方法进行了研究，例如，\[133, 140, 146, 152\]，据我们所知，尚未针对二阶方法进行研究。我们研究了它，并提出了 BBOF（批量块优化框架）和
    SAAG-I 及 II（随机平均调整梯度方法）以与 BBOF 配合使用 \[23\]。我们观察到 SA 和 CD 方法不能很好地协同工作 \[28\]。这是因为实现所带来的额外计算开销超过了同时使用
    SA 和 CD 的优势。


    在本章中，我们将 SA 和 CD 与二阶方法一起研究。我们观察到与一阶方法观察到的结果相似。低且可控的每次迭代复杂度的优势，由于双重采样（即数据和特征的采样）以及相关的实现问题，在实现学习算法的额外开销中丧失了。


    ### 6.1.1 贡献


    本章的贡献如下：


    *   我们研究了小批量块坐标设置，即与二阶方法配合使用的 BBOF 框架，旨在解决与牛顿方法相关的问题。


    *   实证结果证明，BBOF 对二阶方法没有帮助，即，提出的降低每次迭代复杂度无法在大规模问题的训练中获得整体收益。


    ## 6.2 MBN


    MBN（小批量块坐标牛顿）方法基于 SA 和 CD 方法与牛顿方法的优点，用于求解问题 (6.1)。该方法的思想是通过对数据点和特征进行子采样，以降低每次迭代复杂度并使其可控。从
    MBN 的更新规则可以清楚地看出，这似乎解决了牛顿方法的主要问题。


    $$

    \begin{array}{l}

    \begin{array}{l}

    {w_{k + 1} = w_{k} - \alpha_{k}\left\lbrack {\nabla_{C_{k}}^{2}F_{B_{k}}{(w_{k})}^{-
    1}\nabla_{C_{k}}F_{B_{k}}(w_{k})} \right\rbrack e_{C_{k}},}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (6.3)


    其中


    $$

    \begin{array}{l}

    {e_{C_{k}}[i] = \left\{ \begin{array}{l}

    {1\quad\quad\text{if}\,\, i \in C_{k}} \\

    {0\quad\quad\text{else}} \\

    \end{array}~\right.,}

    \\

    \end{array}

    $$


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\nabla_{C_{k}}^{2}F_{B_{k}}\left( w_{k} \right) = \frac{1}{| B_{k} |}{\sum\limits_{i
    \in B_{k}}\nabla_{C_{k}}^{2}}f_{i}\left( w_{k} \right),} \\

    {\nabla_{C_{k}}F_{B_{k}}\left( w_{k} \right) = \frac{1}{| B_{k} |}{\sum\limits_{i
    \in B_{k}}\nabla_{C_{k}}}f_{i}\left( w_{k} \right),} \\

    \end{array}

    \\

    \end{array}

    $$


    (6.4)


    ∇[*C*[*k*]]*F*[*B*[*k*]](*w*[*k*]) 表示在选定块 *C*[*k*] 上的部分梯度，∇[*C*[*k*]]²*F*[*B*[*k*]](*w*[*k*])
    表示在 *C*[*k*] 上的部分黑塞矩阵，其大小为 |*C*[*k*]|×|*C*[*k*]|。因此，(6.3) 的每次迭代复杂度为 *O*(|*C*[*k*]|[2]|*B*[*k*]|+|*C*[*k*]|[3])，这比牛顿方法的每次迭代复杂度小得多且可控。MBN
    旨在解决与牛顿方法相关的问题，并使用 算法 15 进行展示。当与牛顿方法一起使用时，该算法与 BBOF 类似。该算法在每次迭代中采样一个小批量数据点和一个特征块，并构建一个缩减子问题，然后使用类似于牛顿方法的参数更新规则求解该子问题。由于它使用数据的子样本和特征的子样本，这导致每次迭代复杂度降低。子问题中使用的黑塞矩阵大小为
    |*C*[*k*]|²，这小得多且可控。


    ![](img/algo15.jpg)


    ## 6.3 实验


    在本节中，我们展示实验结果。我们使用了以下数据集：mushroom 和 real-sim，其详细信息见表 1.1，并比较了以下方法：


    **MBN：** 这是所提出的方法。


    **SNewton：** 这是子采样牛顿方法，用于梯度和黑塞矩阵计算的渐进式子采样。


    **Newton：** 这是精确牛顿方法。


    **TRON：** 这是信赖区域牛顿方法，使用 PCG（预条件共轭梯度）方法求解信赖区域子问题。这是解决大规模分类问题的广泛使用的方法之一，可在 LIBLINEAR
    库 \[38\] 中找到。


    **SVRG-SQN：** 这是一种随机拟牛顿方法 \[99\]。


    ### 6.3.1 实验设置


    对于所有方法，正则化参数设置为 *λ* = 1/*l*，学习率通过随机回溯线搜索确定，用于子采样方法，即 MBN、SNewton 和 SVRG-SQN，而牛顿方法使用确定性回溯线搜索。MBN
    和 SNewton 方法使用初始小批量大小为 10% 的渐进式子采样。SVRG-SQN 使用 10% 的样本大小，内存大小（M）和更新频率（L）设置为 10。所有方法均使用
    MATLAB 实现，并在 MacBook Air（8 GB 1600 MHz DDR3，1.6 GHz Intel Core i5 和 256GB SSD）上运行。


    ![FIGURE 6.1 Comparison of MBN, SNewton, TRON, Newton and SVRG-SQN on mushroom
    dataset.](img/fig6_1.jpg)


    FIGURE 6.1 Comparison of MBN, SNewton, TRON, Newton and SVRG-SQN on mushroom dataset.


    ![FIGURE 6.2 Comparison of MBN, SNewton, TRON, Newton and SVRG-SQN on real-sim
    dataset.](img/fig6_2.jpg)


    FIGURE 6.2 Comparison of MBN, SNewton, TRON, Newton and SVRG-SQN on real-sim dataset.


    ### 6.3.2 比较研究


    结果通过绘制成本和测试准确率随训练时间（秒）和 epoch 变化，比较了 MBN、SNewton、Newton、TRON 和 SVRG-SQN。图 6.1–6.2
    描绘了两个不同数据集的结果。对于 mushroom 数据集（图 6.1），MBN 在 epoch 结果上与 Newton 表现相似，并优于所有其他方法，但在训练时间上落后于其他方法。SNewton
    在训练时间方面优于所有方法。对于 real-sim（图 6.2），我们观察到类似的结果，即 Newton 和 MBN 在 epoch 上优于其他方法，但在训练时间上落后。


    ## 6.4 结论


    我们提出将牛顿方法与随机近似法（即小批量）和坐标下降法（即块坐标）的优点相结合，希望降低每次迭代复杂度并开发可扩展且高效的方法。但是观察到，尽管每次迭代复杂度降低且可控，MBN
    由于数据点和特征的双重采样以及相关的实现开销，未能达到预期效果，并且落后于（单次）采样的随机牛顿方法和纯牛顿方法。因此，在找到降低双重采样相关开销的方法之前，不适合将随机近似法和坐标下降法一起使用。


