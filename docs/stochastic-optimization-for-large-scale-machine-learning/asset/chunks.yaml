    ### 4.6.1 实验设置


    实验采用六种不同的标准进行报告，分别绘制次优性（目标值 – 最优值）与迭代次数（其中一个迭代次数指遍历数据集一次）、次优性与梯度 `n`、次优性与时间、准确率与时间、准确率与迭代次数以及准确率与梯度
    `n` 的图表。x 轴和 y 轴的数据分别以线性尺度和对数尺度表示。实验使用以下二进制数据集：rcv1、news20、real-sim 和 Adult（也称为
    a9a），其详细信息见表 1.1。所有数据集均按 80% 和 20% 分为训练数据集和测试数据集。除非另有说明，所有算法的正则化参数均设置为 `λ = 1
    * 10^(-5)`（包括 `λ[1]`、`λ[2]`）。随机回溯-Armijo 线搜索（`SBAS`）的参数设置为：`α = 0.1`、`β = 0.5`，学习率初始化为
    `η = 1.0`。内部迭代次数设置为 `m = n/b`（如文献 [39] 中所用）。此外，在 SBAS 中，算法最多搜索 10 次迭代，之后如果当前学习率降低了目标函数值，则返回该学习率，否则返回
    0.0。这样做是为了避免因随机线搜索而导致算法陷入停滞。所有实验均在 MacBook Air（8 GB 1600 MHz DDR3，1.6 GHz Intel
    Core i5 和 256GB SSD）上使用 MEX 文件进行。


    ### 4.6.2 平滑问题的结果


    结果采用 `l[2]`-正则化的逻辑回归问题报告，如下所示：


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left(
    {1 + \exp\left( {- y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda}{2}\| w\|^{2}.}
    \\\\ \end{array}

    $$


    (4.72)


    图 4.1 报告了使用 news20 数据集的结果。SAAG-III 和 IV 优于 SVRG 和 VR-SGD，但 SAAG-IV 取得了最佳结果。这是因为随着小批量大小或数据集大小的增加，SAAG-II
    和 SAAG-IV 的表现更好（如文献 [23] 所报告）。


    ![FIGURE 4.1 Comparison of SAAG-III, IV, SVRG and VR-SGD on smooth problem using
    news20 dataset with mini-batch of 32 data points.](img/fig4_1.jpg)


    FIGURE 4.1 Comparison of SAAG-III, IV, SVRG and VR-SGD on smooth problem using
    news20 dataset with mini-batch of 32 data points.


    ### 4.6.3 非平滑问题的结果


    结果采用弹性网正则化的逻辑回归问题（非平滑正则化项）报告，如下所示：


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left(
    {1 + \exp\left( {- y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda_{1}}{2}\|
    w\|^{2} + \lambda_{2}\| w\|_{1},} \\\\ \end{array}

    $$


    (4.73)


    其中 $f(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left( {1 + \exp\left( {-
    y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda_{1}}{2}\| w\|^{2}$ 和 `g(w) =
    λ[2]∥w∥[1]`。


    图 4.2 展示了 SAAG-III、IV、SVRG 和 VR-SGD 在 rcv1 数据集上的对比研究。如图所示，对于所有六种标准图表，SAAG-III
    和 IV 优于 SVRG 和 VR-SGD，SAAG-IV 在次优性方面取得最佳结果，但在准确率方面，SAAG-III 和 IV 的表现接近，除了准确率与梯度
    `n` 的图表，SAAG-III 取得更好的结果，因为 SAAG-III 仅在最后一次迭代时计算梯度，而 SAAG-IV 在快照点和最后一次迭代时计算梯度。


    ![FIGURE 4.2 Comparison of SAAG-III, IV, SVRG and VR-SGD on non-smooth problem
    using rcv1 dataset with mini-batch of 32 data points.](img/fig4_2.jpg)


    FIGURE 4.2 Comparison of SAAG-III, IV, SVRG and VR-SGD on non-smooth problem using
    rcv1 dataset with mini-batch of 32 data points.


    ### 4.6.4 小批量块坐标下降与小批量设置


    本小节提供了经验证据，证明小批量块坐标下降设置（`BBOF`），即同时使用随机近似和坐标下降，效果不佳。图 4.3 比较了三种方法，即 SAG、SAAG-I
    和 SAAG-II，不进行特征采样，即使用所有特征和使用 1000 个特征的块，以及 1000 个数据点的小批量。图表绘制了 rcv1 和 real-sim
    数据集上次优性与训练时间的关系，并使用随机回溯线搜索方法来寻找学习率。从图中可以清楚地看出，双重采样方法，即使用 `BBOF` 设置的方法，远远落后于单重采样方法，即仅使用数据采样和所有特征的方法。因此，不适合将随机近似和坐标下降方法结合使用，因为每次迭代复杂度低的优势在双重采样导致的实现开销中丧失了。但是，如果我们能找到降低实现开销的方法，那么
    `BBOF` 可能对解决大数据问题非常有效。


    ![FIGURE 4.3 Comparison of BBOF setting with mini-batch setting on rcv1 (first)
    and real-sim (second) datasets using all features and a block size of 1000.](img/fig4_3.jpg)


    FIGURE 4.3 Comparison of BBOF setting with mini-batch setting on rcv1 (first)
    and real-sim (second) datasets using all features and a block size of 1000.


    ### 4.6.5 SVM 的结果


    本小节将 SAAGs 与 SVRG 和 VR-SGD 在 mushroom 和 gisette 数据集上的 SVM 问题进行比较。方法使用随机回溯线搜索方法来寻找步长。图
    4.4 展示了结果，并比较了次优性与训练时间（秒）的关系。结果与逻辑回归实验相似，但不够平滑。SAAGs 在 mushroom 数据集（第一行）和 gisette
    数据集（第二行）上优于其他方法，在次优性与训练时间以及准确率与时间的关系上表现更好，但在 mushroom 数据集的准确率与训练时间方面，所有方法的结果几乎相似。SAAG-IV
    优于其他方法，SAAG-III 有时会落后于 VR-SGD 方法。还观察到，逻辑回归的结果优于 SVM 问题的结果。SVM 的优化问题如下所示：


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\max}}\left(
    {0,1 - y_{i}w^{T}x_{i}} \right)^{2} + \frac{\lambda}{2}\| w\|^{2},} \\\\ \end{array}

    $$


    (4.74)


    其中 `λ` 是正则化系数（也称为惩罚参数），用于平衡间隔大小和误差之间的权衡 [25]。


    ![FIGURE 4.4 Results with SVM using mini-batch of 1000 data points on mushroom
    (first row) and gisette (second row) datasets.](img/fig4_4.jpg)


    FIGURE 4.4 Results with SVM using mini-batch of 1000 data points on mushroom (first
    row) and gisette (second row) datasets.


    ## 4.7 结论


    我们提出了 SAAG-I 和 II 的新型变体，分别称为 SAAG-III 和 IV，SAAG-III 使用迭代平均值作为起点，SAAG-IV 使用迭代平均值和最后一次迭代值分别作为快照点和起点，用于新的迭代周期，第一个周期除外。SAAGs（I、II、III
    和 IV）也通过使用两种不同的更新规则并为非平滑问题引入近端步，扩展到求解非平滑问题。理论结果证明，在某些初始误差下，SAAG-IV 在平滑性和强凸性的四种组合中均具有线性收敛性（期望意义下）。实验结果证明了所提方法在准确率和次优性方面相对于现有方差降低方法的有效性，针对训练时间、迭代次数和梯度
    `n`。


    # 第 5 章 学习与数据访问


