- raw: "FIGURE 7.1 First column presents optimality versus training time (in seconds)\
    \ and second column presents accuracy versus training time, on mushroom (first\
    \ row) and rcv1 (second row) datasets.\n\n### 7.5.3  Results with SVM\n\nWe extend\
    \ STRON to solve l[2]\\-SVM problem which is a non-smooth problem, as given below:\n\
    \n$$\\\\begin{array}{l} {\\\\underset{w}{\\\\min}\\\\, F(w) = \\\\frac{1}{l}{\\\
    \\sum\\\\limits\\_{i = 1}^{l}{\\\\max}}{(0,1 - y\\_{i}w^{T}x\\_{i})}^{2} + \\\\\
    frac{\\\\lambda}{2}\\\\| w\\\\|^{2}.} \\\\\\\\ \\\\end{array}$$  \n\n(7.19)\n\n\
    ![FIGURE 7.2 Experiments with l2-SVM on news20 dataset.](Images/fig7_2.jpg)\n\n\
    FIGURE 7.2 Experiments with l[2]\\-SVM on news20 dataset.\n\nThe results are reported\
    \ in the [Fig. 7.2](#10chap_07.xhtml#f7_2) with news20 dataset. As it is clear\
    \ from the figure, STRON shows results similar to logistic regression problem\
    \ and outperforms all other methods.\n\n## 7.6  Extensions\n\nIn this section,\
    \ we discuss extensions of the proposed method with PCG for solving the trust\
    \ region subproblem, and with variance reduction technique.\n\n### 7.6.1  PCG\
    \ Subproblem Solver\n\nNumber of iterations required by CG method to solve the\
    \ subproblem depends on the condition number of the Hessian matrix. So, for ill-conditioned\
    \ problems CG method converges slowly. To avoid such situations, generally a non-singular\
    \ matrix *M*, called preconditioner, is used as follow. For the linear system\
    \ ∇²*F*(*w*)*p* =  − ∇*F*(*w*), we solve following system:\n\n$$\\\\begin{array}{l}\
    \ {M^{- 1}\\\\nabla^{2}F(w)p = - M^{- 1}\\\\nabla F(w).} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(7.20)\n\nGenerally, *M*^( − 1) = *L**L*^(*T*) is taken to ensure the symmetry\
    \ and positive definiteness of *M*^( − 1)∇²*F*(*w*). PCG can be useful for solving\
    \ the ill-conditioned problems but it involves extra computational overhead. We\
    \ follow \\[51\\] to use PCG as a weighted average of identity matrix and diagonal\
    \ matrix of Hessian, as given below:\n\n$$\\\\begin{array}{l} {M = \\\\alpha \\\
    \\times diag(H) + (1 - \\\\alpha) \\\\times I,} \\\\\\\\ \\\\end{array}$$  \n\n\
    (7.21)\n\nwhere *H* is a Hessian matrix and 0 ≤ *α* ≤ 1. For *α* = 0, there is\
    \ no preconditioning and for *α* = 1 it is a diagonal preconditioner. In the experiments,\
    \ we have taken *α* = 0.01 for TRON and STRON-PCG \\[51\\]. To apply PCG to trust\
    \ region subproblem, we can use [Algorithm 17](#10chap_07.xhtml#algorithm_17)\
    \ without any modifications, after changing the trust region subproblem (7.11),\
    \ as given below \\[124\\]:\n\n$$\\\\begin{array}{l} {{\\\\min}\\_{\\\\hat{p}}\\\
    \\left( {L^{- 1}\\\\nabla F\\_{X\\_{k}}\\\\left( w\\_{k} \\\\right)} \\\\right)^{T}\\\
    \\hat{p} + \\\\frac{1}{2}{\\\\hat{p}}^{T}\\\\left( {L^{- 1}\\\\nabla^{2}F\\_{S\\\
    _{k}}\\\\left( w\\_{k} \\\\right)L^{- T}} \\\\right)\\\\hat{p},\\\\,\\\\,\\\\\
    text{s}\\\\text{.t}\\\\text{.}\\\\,\\\\,\\\\|\\\\hat{p}\\\\| \\\\leq \\\\bigtriangleup\\\
    _{k},} \\\\\\\\ \\\\end{array}$$  \n\n(7.22)\n\nwhere *p̂* = *L*^(*T*)*p*. STRON\
    \ using PCG as a trust region subproblem solver is denoted by STRON-PCG and the\
    \ results are reported in [Fig. 7.3](#10chap_07.xhtml#f7_3). It compares TRON,\
    \ STRON and STRON-PCG on Adult dataset. As it is clear from the figure, both STRON\
    \ and STRON-PCG outperform TRON.\n\n![FIGURE 7.3 Comparative study of STRON\\\
    _PCG, STRON and TRON on Adult dataset.](Images/fig7_3.jpg)\n\nFIGURE 7.3 Comparative\
    \ study of STRON\\_PCG, STRON and TRON on Adult dataset.\n\nPCG trust region subproblem\
    \ solver involves extra cost for calculating the preconditioner, and for TRON\
    \ the overhead due to preconditioner is given by\n\n$$\\\\begin{array}{l} \\\\\
    begin{array}{ll} & {O\\\\left( n \\\\right) \\\\times \\\\#\\\\text{CG~iterations}\
    \ + O(nl).} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(7.23)\n\n\
    And for STRON-PCG, preconditioner involves extra cost as given below:\n\n$$\\\\\
    begin{array}{l} \\\\begin{array}{ll} & \\\\left. O\\\\left( n \\\\right) \\\\\
    times \\\\#\\\\text{CG~iterations} + O(n \\\\middle| S\\_{k} \\\\middle| ). \\\
    \\right. \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(7.24)\n\n###\
    \ 7.6.2  Stochastic Variance Reduced Trust Region Inexact Newton Method\n\nRecently,\
    \ researchers have proposed stochastic variants of second order methods with variance\
    \ reduction. So, it is an interesting question to know that how will variance\
    \ reduction work with stochastic trust region inexact Newton methods, as this\
    \ is not studied yet. Our empirical results prove that variance reduction does\
    \ not work in this case, even after using progressive subsampling for Hessian\
    \ calculation.\n\n![FIGURE 7.4 Comparative study of STRON-SVRG, STRON and TRON\
    \ rcv1 dataset.](Images/fig7_4.jpg)\n\nFIGURE 7.4 Comparative study of STRON-SVRG,\
    \ STRON and TRON rcv1 dataset.\n\nTo improve the quality of search direction,\
    \ we have used SVRG as variance reduction technique for gradient calculations,\
    \ as given below:\n\n$$\\\\begin{array}{l} {g\\_{k} = \\\\nabla F\\_{S\\_{k}}(w\\\
    _{k}) - \\\\nabla F\\_{S\\_{k}}(\\\\overline{w}) + \\\\nabla F(\\\\overline{w}),}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n(7.25)\n\nwhere $\\\\overline{w}$ is parameter\
    \ value at the start of outer iteration. STRON-SVRG uses variance reduction for\
    \ gradient calculations and progressive batching for Hessian calculations, as\
    \ given in the [Algorithm 18](#10chap_07.xhtml#algorithm_18).\n\n![](Images/algo18.jpg)\n\
    \nThe experimental results are presented in [Fig. 7.4](#10chap_07.xhtml#f7_4)\
    \ with rcv1 datasets. As it is clear from the figures, STRON-SVRG lags behind\
    \ STRON and TRON, i.e., variance reduction in STRON-SVRG is not sufficient to\
    \ beat the progressive batching in gradient calculations of STRON. This is because\
    \ both, STRON-SVRG and STRON, are stochastic/subsampled variants of TRON and to\
    \ compensate for the noisy gradient calculations, former uses well-known variance\
    \ reduction strategy but later uses progressive subsampling strategy. STRON is\
    \ able to beat TRON but STRON-SVRG fails and lags behind both.\n\n## 7.7  Conclusion\n\
    \nWe proposed a novel stochastic trust region inexact Newton method, called as\
    \ STRON. The proposed method used progressive batching scheme to deal with noisy\
    \ approximations of gradient and Hessian, and enjoyed the benefits of both stochastic\
    \ and full batch regimes. STRON has been extended to use preconditioned CG as\
    \ trust region subproblem solver and to use variance reduction for noisy gradient\
    \ calculations. Our empirical results proved the efficacy of STRON against the\
    \ state-of-art techniques with bench marked datasets.\n\n# IV\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_CONCLUSION\n\n# Chapter 8 Conclusion and Future Scope\n\nDOI: [10.1201/9781003240167-8](http://doi.org/10.1201/9781003240167-8)\n\
    \nThe advancements in the technology and the availability of data sources have\
    \ led us to the ‘Big Data’ era. One side, this large data has potential to uncover\
    \ more fine-grained patterns, take timely and accurate decisions, but on the other\
    \ side it creates a lot of challenges to make a sense of it, like, slow training\
    \ and scalability of machine learning models etc. So, one of the major challenges\
    \ in machine learning is to develop efficient and scalable learning algorithms,\
    \ i.e., optimization techniques to solve large-scale learning problems.\n\nWe\
    \ can tackle the challenge by working in following areas: problem formulations,\
    \ problem solvers, optimization strategies to improve the solvers and utilizing\
    \ computing resources, like graphics processing unit (GPUs), parallel and distributed\
    \ computing. But out of these potential areas, recently, researchers have focused\
    \ on stochastic approximation algorithms, coordinate descent algorithms, proximal\
    \ algorithms and parallel and distributed algorithms to tackle the challenge."
