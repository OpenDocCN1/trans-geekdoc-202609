  fmt: '

    ### 4.6.1 Experimental Setup


    The experiments are reported using six different criteria which plot suboptimality
    (objective – best value) versus epochs (where one epoch refers to one pass through
    the dataset), suboptimality versus gradients `n`, suboptimality versus time, accuracy
    versus time, accuracy versus epochs and accuracy versus gradients `n`. The x-axis
    and y-axis data are represented in linear and log scale, respectively. The experiments
    use the following binary datasets: rcv1, news20, real-sim and Adult (also called
    as a9a), whose details are given in the Table 1.1. All the datasets are divided
    into 80% and 20% as training and test dataset, respectively. The value of regularization
    parameter is set as `λ = 1 * 10^(-5)` (including `λ[1]`, `λ[2]`) for all the algorithms,
    unless specified. The parameters for, Stochastic Backtracking-Armijo line Search
    (`SBAS`), are set as: `α = 0.1`, `β = 0.5` and learning rate is initialized as,
    `η = 1.0`. The inner iterations are set as, `m = n/b` (as used in [39]). Moreover,
    in SBAS, algorithms looks for maximum 10 iterations and after that it returns
    the current value of learning rate if it reduces the objective value otherwise
    it returns 0.0. This is done to avoid sticking in the algorithm because of stochastic
    line search. All the experiments have been conducted on MacBook Air (8 GB 1600
    MHz DDR3, 1.6 GHz Intel Core i5 and 256GB SSD) using MEX files.


    ### 4.6.2 Results with Smooth Problem


    The results are reported with `l[2]`-regularized logistic regression problem as
    given below:


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left(
    {1 + \exp\left( {- y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda}{2}\| w\|^{2}.}
    \\\\ \end{array}

    $$


    (4.72)


    [Figure 4.1](#06chap_04.xhtml#f4_1) reports results with news20 dataset. SAAG-III
    and IV perform better than SVRG and VR-SGD, but SAAG-IV gives best results. This
    is because as the mini-batch size or the dataset size increases, SAAG-II and SAAG-IV
    perform better (as reported in [23]).


    ![FIGURE 4.1 Comparison of SAAG-III, IV, SVRG and VR-SGD on smooth problem using
    news20 dataset with mini-batch of 32 data points.](Images/fig4_1.jpg)


    FIGURE 4.1 Comparison of SAAG-III, IV, SVRG and VR-SGD on smooth problem using
    news20 dataset with mini-batch of 32 data points.


    ### 4.6.3 Results with Non-smooth Problem


    The results are reported with elastic-net-regularized logistic regression problem
    (non-smooth regularizer) as given below:


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left(
    {1 + \exp\left( {- y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda_{1}}{2}\|
    w\|^{2} + \lambda_{2}\| w\|_{1},} \\\\ \end{array}

    $$


    (4.73)


    where $f(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\log}}\left( {1 + \exp\left(
    {- y_{i}w^{T}x_{i}} \right)} \right) + \frac{\lambda_{1}}{2}\| w\|^{2}$ and `g(w)
    = λ[2]∥w∥[1]`.


    [Figure 4.2](#06chap_04.xhtml#f4_2) represents the comparative study of SAAG-III,
    IV, SVRG and VR-SGD on rcv1 dataset. As it is clear from the figure, for all the
    six criteria plots, SAAG-III and IV outperform SVRG and VR-SGD, SAAG-IV giving
    best results in terms of suboptimality but in terms of accuracy, SAAG-III and
    IV have close performance except for accuracy versus gradients `n`, where SAAG-III
    gives better results because SAAG-III calculates gradients at last iterate only
    unlike SAAG-IV which calculates gradients at snap point and last iterate.


    ![FIGURE 4.2 Comparison of SAAG-III, IV, SVRG and VR-SGD on non-smooth problem
    using rcv1 dataset with mini-batch of 32 data points.](Images/fig4_2.jpg)


    FIGURE 4.2 Comparison of SAAG-III, IV, SVRG and VR-SGD on non-smooth problem using
    rcv1 dataset with mini-batch of 32 data points.


    ### 4.6.4 Mini-batch Block-coordinate versus Mini-batch setting


    This subsection provides empirical evidence for the observation that mini-batch
    block-coordinate setting (`BBOF`), i.e., using stochastic approximation and coordinate
    together does not work well. [Figure 4.3](#06chap_04.xhtml#f4_3) compares three
    methods, namely, SAG, SAAG-I and SAAG-II without sampling features, i.e., using
    all features and using a block of 1000 features, and mini-batch of 1000 data points.
    Figure plots suboptimality against training time on rcv1 and real-sim datasets
    and uses stochastic backtracking line search method to find the learning rate.
    It is clear from the figure that doubly sampled methods, i.e., methods using `BBOF`
    setting lag far behind the singly sampled methods, i.e., methods using only data
    sampling and all features. Thus, it is not suitable to use stochastic approximation
    and coordinate descent approaches together because the advantage of having low
    per-iteration complexity is lost in the implementation overhead due to double
    sampling. But if we could find ways to reduce the implementation overhead then
    `BBOF` could be very effective to solve big data problems.


    ![FIGURE 4.3 Comparison of BBOF setting with mini-batch setting on rcv1 (first)
    and real-sim (second) datasets using all features and a block size of 1000.](Images/fig4_3.jpg)


    FIGURE 4.3 Comparison of BBOF setting with mini-batch setting on rcv1 (first)
    and real-sim (second) datasets using all features and a block size of 1000.


    ### 4.6.5 Results with SVM


    This subsection compares SAAGs against SVRG and VR-SGD on SVM problem with mushroom
    and gisette datasets. Methods use stochastic backtracking line search method to
    find the step size. [Figure 4.4](#06chap_04.xhtml#f4_4) presents the results and
    compares the suboptimality against the training time (in seconds). Results are
    similar to experiments with logistic regression but are not that smooth. SAAGs
    outperform other methods on mushroom dataset (first row) and gisette dataset (second
    row) for suboptimality against training time and accuracy against time but all
    methods give almost similar results on accuracy versus training time for mushroom
    dataset. SAAG-IV outperforms other method and SAAG-III sometimes lags behind VR-SGD
    method. It is also observed that results with logistic regression are better than
    the results with the SVM problem. The optimization problem for SVM is given below:


    $$

    \begin{array}{l} {\underset{w}{\min}\\, F(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}{\max}}\left(
    {0,1 - y_{i}w^{T}x_{i}} \right)^{2} + \frac{\lambda}{2}\| w\|^{2},} \\\\ \end{array}

    $$


    (4.74)


    where `λ` is the regularization coefficient (also penalty parameter) which balances
    the trade-off between margin size and error [25].


    ![FIGURE 4.4 Results with SVM using mini-batch of 1000 data points on mushroom
    (first row) and gisette (second row) datasets.](Images/fig4_4.jpg)


    FIGURE 4.4 Results with SVM using mini-batch of 1000 data points on mushroom (first
    row) and gisette (second row) datasets.


    ## 4.7 Conclusion


    We have proposed novel variants of SAAG-I and II, called SAAG-III and IV, respectively,
    by using average of iterates for SAAG-III as a starting point, and average of
    iterates and last iterate for SAAG-IV as the snap point and starting point, respectively,
    for new epoch, except the first one. SAAGs (I, II, III and IV) are also extended
    to solve non-smooth problems by using two different update rules and introducing
    proximal step for non-smooth problem. Theoretical results proved linear convergence
    of SAAG-IV for all the four combinations of smoothness and strong-convexity with
    some initial errors, in expectation. The empirical results proved the efficacy
    of proposed methods against existing variance reduction methods in terms of, accuracy
    and suboptimality, against training time, epochs and gradients `n`.


    # Chapter 5 Learning and Data Access


    DOI: [10.1201/9781003240167-5](http://doi.org/10.1201/9781003240167-5)

