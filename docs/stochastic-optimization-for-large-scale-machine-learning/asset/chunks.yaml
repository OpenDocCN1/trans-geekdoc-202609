    The training time of models has two major components time to access the data and
    time to process (learn from) the data. So far, the research has focused only on
    the second part, i.e., learning from the data. In this chapter, we have proposed
    one possible solution to handle the big data problems in machine learning. The
    idea is to reduce the training time through reducing data access time by proposing
    systematic sampling and cyclic/sequential sampling to select mini-batches from
    the dataset. To prove the effectiveness of proposed sampling techniques, we have
    used empirical risk minimization, which is commonly used machine learning problem,
    for strongly convex and smooth case. The problem has been solved using `SAG`,
    `SAGA`, `SVRG`, `SAAG-II` and `MBSGD` (Mini-batched SGD), each using two step
    determination techniques, namely, constant step size and backtracking line search
    method. Theoretical results prove similar convergence for systematic and cyclic
    sampling as the widely used random sampling technique, in expectation. Empirical
    results with benchmarked datasets prove the efficacy of the proposed sampling
    techniques and show up to six times faster training.


    ## 5.1 Introduction


    Nowadays, the major challenge is to develop efficient and scalable learning algorithms
    for dealing with big data problems, as discussed in detail in [Section 3.1](#05chap_03.xhtml#sec3_1).
    The training time of models have two major components \[[144](#bib.xhtml#refbib_144)\]
    as:


    $$

    \begin{array}{l}

    {\text{training~time} = \text{time~to~access~data} + \text{time~to~process~data}.}

    \\

    \end{array}

    $$


    (5.1)


    As it is known that for processing any data or running any program, it should
    be first brought into memory, more precisely into `RAM` (Random Access Memory),
    from hard disk. The time taken in bringing the data or program from hard disk
    into memory is called access time. Access time has, further, three components,
    namely, seek time (it is the time taken by the reading head to move from current
    position up to the track containing the data), rotational latency time (it is
    the time taken by the reading head from the current position to reach up to the
    sector/block containing the data) and transfer time (it is the time taken to transfer
    data from sector/block over the disk to memory). Moreover, data is not read content
    wise rather block-wise, where each block can have multiple sectors. Now, it is
    interesting to note that for data stored on the contiguous memory or in the close
    proximity, has lesser data access time as compared with the data dispersed far
    away from each other. This is due to lesser seek, latency and transfer times.
    In case of `SSD` (Solid State Disk) and `RAM` (Random Access Memory), there are
    no seek and latency times because they do not have moving parts and they are based
    on direct access mechanism, but transfer time still plays its role. Since data
    are read/written block-wise so for contiguous data access, there would be one
    or two transfer times but dispersed data access would require more number of transfer
    times. Moreover, cache memory strategies also favor the contiguous memory access
    and make it faster as compared to dispersed data access. Thus, contiguous data
    access time is faster than dispersed data access, in all the cases whether data
    is stored on `RAM`, `SSD` or `HDD`. But the difference in access time would be
    more prominent for `HDD`.


    The second component of training time is processing (learning) time which is the
    time taken by the `CPU` (Central Processing Unit) to process the data to solve
    for model parameters. Due to mini-batching and iterative learning algorithms,
    the accessing and processing of data is intermixed and occurs quite frequently.
    The data access time is dependent on the sampling technique and processing time
    is dependent on the method used to solve the problem. Till this date, to improve
    the training time, most of the focus is given only to improve the processing time
    by using different methods. The training time is dependent on both data accessing
    time and data processing time, and this is to be noted that, generally, data access
    time is very high as compared to the data processing time. Thus, efforts should
    be equally done to improve the data accessing time. This chapter has tried to
    reduce the training time for big data problems by reducing the data access time
    using systematic sampling technique \[[93](#bib.xhtml#refbib_93), [94](#bib.xhtml#refbib_94)\]
    and cyclic sampling to select mini-batches of data points from the dataset.


    ### 5.1.1 Optimization Problem


    Empirical risk minimization (`ERM`) problem \[[111](#bib.xhtml#refbib_111)\] is
    a commonly used problem in machine learning and statistics, which typically consists
    of a loss function and a regularization term. In this chapter, `l2`-regularized
    `ERM` problem with the assumptions of strong convexity and smoothness, is used
    for demonstrating the effectiveness of proposed sampling techniques. For the training
    data {(`x`[1],`y`[1]),(`x`[2],`y`[2]),...,(`x`[`l`],`y`[`l`])}, where `x`[`i`]
    ∈ ℝ^(`n`), `y`[`i`] ∈ ℝ, and for loss functions `f`[1],`f`[2],...`f`[`l`]: ℝ^(`n`)→ℝ,
    model parameter vector `w` ∈ ℝ^(`n`) and regularization coefficient `C` > 0, `l2`-regularized
    `ERM` problem is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\,\,\ f(w) = \frac{1}{l}{\sum\limits_{i = 1}^{l}f_{i}}(w) +
    \frac{C}{2}\| w\|^{2},}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (5.2)


    where first term is the data fitting term and second term is used for avoiding
    the over-fitting of data. Commonly used loss functions are the square loss (`w`^(`T`)`x`[`i`]−`y`[`i`])²,
    the logistic loss log(1+`e`^`exp`(−`y`[`i`]`w`^(`T`)`x`[`i`])) and the hinge loss
    max(0,1−`y`[`i`]`w`^(`T`)`x`[`i`]). In this chapter, experimentation uses logistic
    loss function. When problem represented by eq.(5.2) is a large-scale or big data
    problem then per iteration complexity of learning algorithms with traditional
    methods like Gradient Descent is `O`(`n`*`l`) which is very high. This is because,
    such problems have large number of data points (`l`) or large number of features
    (`n`), or both, and each iteration updates `n` variables over `l` data points.
    Because of this high computational complexity per iteration it would be very expensive
    or even infeasible for single machine to process a single iteration of learning
    algorithm. Stochastic approximation approach is widely used for handling such
    cases (e.g., \[148, 63, 35, 19, 115, 23\]), which uses one data point or mini-batch
    of data points during each iteration. The reduced subproblem with mini-batch `B`[`j`]
    of data points for `j`^(`t`h) inner iteration is given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\,\,\frac{1}{\left| B_{j} \right|}{\sum\limits_{i \in B_{j}}f_{i}}(w)
    + \frac{C}{2}\| w\|^{2},\quad j = 1,2,...,m.}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (5.3)


    The iteration complexity for solving this reduced subproblem is `O`(`n`) (for
    one data point) or `O`(`n`|`B`[`j`]|) (for mini-batch of data points) where |`B`[`j`]|
    is the size of mini-batch, which is very low and independent of `l`. Since it
    is easier to solve the problem (5.3) and this is widely used approach to handle
    large-scale problems so the chapter uses this reduced subproblem approach.


    ### 5.1.2 Literature Review

    '
  trans: '


    模型的训练时间由两个主要部分组成：访问数据的时间和处理（从数据中学习）的时间。迄今为止，研究只关注了第二部分，即从数据中学习。在本章中，我们提出了一种可能的解决方案来处理机器学习中的大数据问题。其思路是通过提出系统采样和循环/顺序采样来从数据集中选择小批量，从而减少数据访问时间，进而降低训练时间。为了证明所提采样技术的有效性，我们采用了经验风险最小化（这是一种常用的机器学习问题），用于强凸和光滑情况。该问题使用
    `SAG`、`SAGA`、`SVRG`、`SAAG-II` 和 `MBSGD`（小批量 SGD）求解，每种方法都采用两种步长确定技术，即常数步长和回溯直线搜索方法。理论结果表明，系统采样和循环采样的收敛性与广泛使用的随机采样技术相似（在期望意义下）。基准数据集的实证结果证明了所提采样技术的有效性，并表明训练速度最多可提高六倍。


    ## 5.1 引言


    如今，主要挑战是开发高效且可扩展的学习算法来处理大数据问题，如 第 3.1 节 中详细讨论。模型的训练时间有两个主要组成部分 \[144\]，如下所示：


    $$

    \begin{array}{l}

    {\text{训练时间} = \text{访问数据的时间} + \text{处理数据的时间}.}

    \\

    \end{array}

    $$


    (5.1)


    众所周知，在处理任何数据或运行任何程序之前，应首先将其加载到内存中，更准确地说是加载到 `RAM`（随机存取存储器）中，从硬盘加载。将数据或程序从硬盘加载到内存所花费的时间称为访问时间。访问时间进一步包含三个组成部分，即寻道时间（读写头从当前位置移动到包含数据的磁道所需的时间）、旋转延迟时间（读写头从当前位置到达包含数据的扇区/块所需的时间）和传输时间（将数据从扇区/块通过磁盘传输到内存所需的时间）。此外，数据不是按内容读取，而是按块读取，其中每个块可以包含多个扇区。值得注意的是，存储在连续内存或近距离位置的数据，其数据访问时间比相互分散的数据要短。这是因为寻道、延迟和传输时间更少。在
    `SSD`（固态硬盘）和 `RAM`（随机存取存储器）的情况下，没有寻道和延迟时间，因为它们没有移动部件，并且基于直接访问机制，但传输时间仍然发挥作用。由于数据是按块读取/写入的，因此对于连续数据访问，将有一个或两个传输时间，而分散数据访问将需要更多的传输时间。此外，缓存内存策略也有利于连续内存访问，并使其比分散数据访问更快。因此，无论数据存储在
    `RAM`、`SSD` 还是 `HDD` 上，连续数据访问时间都比分散数据访问时间快。但是，对于 `HDD`，访问时间的差异会更加明显。


    训练时间的第二个组成部分是处理（学习）时间，即 `CPU`（中央处理器）处理数据以求解模型参数所需的时间。由于小批量和迭代学习算法，数据的访问和处理是交错进行的，并且发生得非常频繁。数据访问时间取决于采样技术，而处理时间取决于用于求解问题的方法。到目前为止，为了提高训练时间，大部分精力都只集中在通过使用不同方法来提高处理时间上。训练时间取决于数据访问时间和数据处理时间，并且应当注意，通常情况下，数据访问时间远高于数据处理时间。因此，应同样努力来改进数据访问时间。本章试图通过使用系统采样技术
    \[93, 94\] 和循环采样来减少大数据问题的训练时间，以从数据集中选择小批量数据点。


    ### 5.1.1 优化问题


    经验风险最小化（`ERM`）问题 \[111\] 是机器学习和统计学中常用的问题，通常由损失函数和正则化项组成。在本章中，使用带有强凸性和光滑性假设的 `l2`
    正则化 `ERM` 问题来演示所提采样技术的有效性。对于训练数据 {(`x`[1],`y`[1]),(`x`[2],`y`[2]),...,(`x`[`l`],`y`[`l`])}，其中
    `x`[`i`] ∈ ℝ^(`n`)，`y`[`i`] ∈ ℝ，以及损失函数 `f`[1],`f`[2],...`f`[`l`]: ℝ^(`n`)→ℝ，模型参数向量
    `w` ∈ ℝ^(`n`)，正则化系数 `C` > 0，`l2` 正则化 `ERM` 问题给出如下


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\,\,\ f(w) = \frac{1}{l}{\sum\limits_{i = 1}^{l}f_{i}}(w) +
    \frac{C}{2}\| w\|^{2},}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (5.2)


    其中第一项是数据拟合项，第二项用于避免数据过拟合。常用的损失函数包括平方损失 (`w`^(`T`)`x`[`i`]−`y`[`i`])²、逻辑损失 log(1+`e`^`exp`(−`y`[`i`]`w`^(`T`)`x`[`i`]))
    和铰链损失 max(0,1−`y`[`i`]`w`^(`T`)`x`[`i`])。在本章中，实验使用逻辑损失函数。当由等式 (5.2) 表示的问题是大规模或大数据问题时，使用传统方法（如梯度下降）的学习算法每次迭代的复杂度为
    `O`(`n`*`l`)，这非常高。这是因为，此类问题具有大量的数据点（`l`）或大量的特征（`n`），或两者兼而有之，并且每次迭代在 `l` 个数据点上更新
    `n` 个变量。由于每次迭代的计算复杂度很高，单台机器处理学习算法的单次迭代将非常昂贵，甚至不可行。随机逼近方法被广泛用于处理此类情况（例如，\[148,
    63, 35, 19, 115, 23\]），它在每次迭代中使用一个数据点或一小批数据点。对于第 `j`^(`t`h) 次内部迭代的小批量 `B`[`j`]
    数据点，缩减的子问题给出如下


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\,\,\frac{1}{\left| B_{j} \right|}{\sum\limits_{i \in B_{j}}f_{i}}(w)
    + \frac{C}{2}\| w\|^{2},\quad j = 1,2,...,m.}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (5.3)


    求解此缩减子问题的迭代复杂度为 `O`(`n`)（针对一个数据点）或 `O`(`n`|`B`[`j`]|)（针对一小批数据点），其中 |`B`[`j`]|
    是小批量的大小，这非常低且与 `l` 无关。由于求解问题 (5.3) 更容易，并且这是处理大规模问题的广泛使用的方法，因此本章采用这种缩减子问题方法。


    ### 5.1.2 文献综述


    '
