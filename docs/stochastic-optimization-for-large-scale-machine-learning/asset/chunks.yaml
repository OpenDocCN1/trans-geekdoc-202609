    遵循非光滑问题的 Lemma 2，可以轻松证明光滑问题的以下结果，


    此处给出的所有证明都证明了 SAAG-IV 在光滑性和强凸性的四种组合下的线性收敛（根据收敛定义），结果中包含一些由于常数项引起的初始误差。SAAGs 基于实践中的直觉
    \[23\]，它们试图比旧梯度值更重视最新的梯度值，这使得它们成为有偏技术，并导致了这个额外的常数项。这个常数项表明 SAAGs 收敛到靠近解的区域，这非常实际，因为所有机器学习算法都用于近似求解问题，我们永远无法找到问题的精确解
    \[15]，因为计算上的困难。此外，这个常数项是由于最优点处的小批量梯度值引起的，即，$\\frac{1}{\\left| B\_{k} \\right|}{\\sum\\limits\_{i
    \\in B\_{k}}\\nabla}f\_{i}(w^{\*})$。如果小批量的大小增加并最终等于数据集大小，那么这个常数就等于全梯度并消失，即，$\\frac{1}{n}{\\sum\\limits\_{i
    = 1}^{n}\\nabla}f\_{i}(w^{\*}) = 0.$


    正则化器的强凸性和光滑性的所有组合的线性收敛，是一阶方法在没有曲率信息的情况下表现出的最大收敛率。SAG、SVRG、SAGA 和 VR-SGD 也对强凸性和光滑问题表现出线性收敛，但除了
    VR-SGD 之外，它们不涵盖所有情况，例如，SVRG 不涵盖非强凸情况。然而，VR-SGD 提供的理论结果证明了强凸情况下的线性收敛，类似于我们的结果，但
    VR-SGD 对于非强凸情况仅提供 *O*(1/*T*) 收敛，而不像我们的线性收敛结果。


    ## 4.6  实验结果


    在本节中，我们展示了实验结果⁵


