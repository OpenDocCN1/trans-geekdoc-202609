- raw: "The emerging technologies and the availability of different data sources have\
    \ lead to rapid expansion of data in all science and engineering domains. One\
    \ side, this massive data has potential to uncover more fine-grained patterns,\
    \ take timely and accurate decisions, and on other side it creates a lot of challenges\
    \ to make sense of it, like, slow training and scalability of models, because\
    \ of inability of traditional technologies to process this huge data. The term\
    \ ‘Big Data’ was coined to highlight the data explosion and need of new technologies\
    \ to process this massive data. Big data is a vast subject in itself. Big data\
    \ can be characterized using three Vs: Volume, Velocity and Variety, but recently\
    \ a lot of other Vs are also used. When one deal with ‘volume’ aspect of big data\
    \ in machine learning, it is called the large-scale machine learning problem or\
    \ big data problem. The large-scale learning problems have large number of data\
    \ points or large number of features in each data point, or both, which lead to\
    \ large per-iteration complexity of learning algorithms, and ultimately lead to\
    \ slow training of machine learning models. Thus, one of the major challenges\
    \ before machine learning is to develop efficient and scalable learning algorithms\
    \ \\[[23](#bib.xhtml#refbib_23), [25](#bib.xhtml#refbib_25)\\].\n\n## 1.2  Optimization\
    \ Problems\n\nThe problems where we try to find the optimum value, i.e., minimum\
    \ or maximum, are called optimization problems and can be represented in general\
    \ form as:\n\n$$\\\\begin{array}{l} {\\\\underset{w}{\\\\min}\\\\,\\\\, F(w)\\\
    \\quad\\\\text{s}\\\\text{.t}\\\\text{.}\\\\,\\\\, w \\\\in \\\\Omega,} \\\\\\\
    \\ \\\\end{array}$$  \n\n(1.1)\n\nwhere *F* is an objective function which is\
    \ to be minimized, *w* ∈ ℝ^(*n*) is the parameter vector to be found and Ω represent\
    \ the constraint set of *w*.\n\nMachine learning involves data intensive optimization\
    \ problems, as it learns the model from the data and try to minimize the model\
    \ error, i.e., difference in the value predicted by the model and the actual value.\
    \ We consider unconstrained convex optimization problem of expected risk, as given\
    \ below:\n\n$$\\\\begin{array}{l} {{\\\\min}\\_{w}R(w) = \\\\mathbb{E}\\\\left\\\
    \\lbrack {f\\\\left( {w;\\\\xi} \\\\right)} \\\\right\\\\rbrack,} \\\\\\\\ \\\\\
    end{array}$$  \n\n(1.2)\n\nwhere *f*(*w*;*ξ*) = *f*(*w*;*x*[*i*],*y*[*i*]) = *f*(*h*(*w*;*x*[*i*]),*y*[*i*])\
    \ is a composition of linear prediction model *h* and loss function *f* over randomly\
    \ selected data point (*x*[*i*],*y*[*i*]) from the unknown distribution *P*(*x*[*i*],*y*[*i*])\
    \ and targets, parameterized by the model parameter *w* ∈ ℝ^(*n*). Since it is\
    \ not feasible to solve (7.1) as *P* is unknown so the model is approximated by\
    \ taking a set *N* = {(*x*[1],*y*[1]),...,(*x*[*l*],*y*[*l*])} of *l* data points\
    \ from the unknown distribution *P* and then solving the empirical risk minimization\
    \ (ERM) problem, as given below:\n\n$$\\\\begin{array}{l} {{\\\\min}\\_{w}F(w)\
    \ = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}f}(w;x\\_{i},y\\_{i}).} \\\\\
    \\\\ \\\\end{array}$$  \n\n(1.3)\n\nFor simplicity, we take *f*(*w*;*x*[*i*],*y*[*i*]) = *f*[*i*](*w*).\
    \ Finite sum optimization problems of type (1.3) exists across different fields,\
    \ like signal processing, statistics, operations research, data science and machine\
    \ learning.\n\nIn ERM, component function *f*[*i*](*w*) denotes value of loss\
    \ function at one data point, e.g., in binary classification, it can be logistic\
    \ loss, i.e., *f*[*i*](*w*) = log (1+exp(−*y*[*i*]*w*^(*T*)*x*[*i*])) and hinge-loss,\
    \ i.e., *f*[*i*](*w*) = max (0,1−*y*[*i*]*w*^(*T*)*x*[*i*]); for regression problem,\
    \ it can be least squares, i.e., *f*[*i*](*w*) = 1/2(*w*^(*T*)*x*[*i*] − *y*[*i*])².\
    \ The regularizer can be *λ*[1]∥*w*∥[1] (*l*[1]\\-regularizer), *λ*[2]/2∥*w*∥²\
    \ (*l*[2]\\-regularizer) and *λ*[1]∥*w*∥[1] + *λ*[2]/2∥*w*∥² (elastic net regularizer),\
    \ where *λ*[1] and *λ*[2] are regularization coefficients. Thus, problems like\
    \ logistic regression, SVM, ridge regression and lasso etc., fall under ERM.\n\
    \n## 1.3  Linear Classification\n\nClassification is one of the machine learning\
    \ problems which learns to assign labels, i.e., a value from a predefined set\
    \ of values, e.g., label an incoming new mail as ham or spam is a classification\
    \ problem. Classification can be classified into two categories: linear and non-linear,\
    \ and accordingly, we can have linear and non-linear classifiers. Geometrically,\
    \ linear classifier separates the data linearly, unlike non-linear classifier\
    \ which separates the data non-linearly. Mathematically, linear classifiers use\
    \ linear function for the prediction model, unlike non-linear classifiers. For\
    \ high dimensional problems, like document classification, it is observed that\
    \ linear classifiers have similar accuracy as non-linear classifiers but the training\
    \ time of linear classifiers are much faster than non-linear classifiers.\n\n\
    ### 1.3.1  Support Vector Machine (SVM)\n\nSupport Vector Machine (SVM, \\[[12](#bib.xhtml#refbib_12)\\\
    ]) is a binary linear classification technique in machine learning, which separates\
    \ the classes with largest gap (called margin) between the border line instances\
    \ (called support vectors). That's why it is known as optimal margin classifier.\
    \ [Figure 1.1](#02chap_01.xhtml#f1_1). represents the geometrical view of SVM.\
    \ SVM has been extended to multi-class problems using techniques like One-versus-One\
    \ \\[[72](#bib.xhtml#refbib_72)\\], One-versus-Rest \\[[132](#bib.xhtml#refbib_132)\\\
    ], Directed Acyclic Graph SVM \\[[107](#bib.xhtml#refbib_107)\\] etc. For non-linearly\
    \ separable data problems, SVM has been extended using Kernels. Kernels are mathematical\
    \ functions that transform the data from given space (known as input space) to\
    \ a new high dimensional space (known as feature space) where data can be separated\
    \ with a linear surface (called hyperplane). [Figure 1.2](#02chap_01.xhtml#f1_2).\
    \ represents the geometrical view of Kernels. Mathematically, a Kernel is a function\
    \ that takes two arguments, apply a mapping on the arguments and then return the\
    \ value of their dot product. Suppose *x*[1] and *x*[2] are two data points, *ϕ*\
    \ is a mapping and K denotes Kernel which is given by\n\n$$\\\\begin{array}{l}\
    \ {K(x\\_{1},x\\_{2}) = \\\\phi{(x\\_{1})}^{T}\\\\phi(x\\_{2})} \\\\\\\\ \\\\\
    end{array}$$  \n\n(1.4)\n\n![FIGURE 1.1 An infinite number of classifiers can\
    \ be drawn for the given data but SVM finds the classifier with largest gap between\
    \ support vectors. Circles represent the support vectors.](Images/fig1_1.jpg)\n\
    \nFIGURE 1.1 An infinite number of classifiers can be drawn for the given data\
    \ but SVM finds the classifier with largest gap between support vectors. Circles\
    \ represent the support vectors.\n\n![FIGURE 1.2 Left part represents data in\
    \ input space and right part represents data in feature space. Data has been Transformed\
    \ from input space to feature space using Kernels. Initially input space is two\
    \ dimensional and data is inseparable. Kernels transformed the data to three dimensional\
    \ space where data is separable by a hyperplane.](Images/fig1_2.jpg)\n\nFIGURE\
    \ 1.2 Left part represents data in input space and right part represents data\
    \ in feature space. Data has been Transformed from input space to feature space\
    \ using Kernels. Initially input space is two dimensional and data is inseparable.\
    \ Kernels transformed the data to three dimensional space where data is separable\
    \ by a hyperplane.\n\nIn some applications, the input space is rich in features\
    \ and it is sufficient to take the mapping *ϕ* as an identity mapping, i.e., *ϕ*(*x*) = *x*.\
    \ Kernel where mapping is identity mapping, that is, input space and feature space\
    \ are equal, is called linear Kernel and SVM using linear Kernel is called linear\
    \ SVM. Mathematically, linear Kernel is given by\n\n$$\\\\begin{array}{l} \\\\\
    left. K(x\\_{1},x\\_{2}) = x\\_{1}^{T}x\\_{2}\\\\quad\\\\Rightarrow\\\\quad\\\\\
    phi(x) = x \\\\right. \\\\\\\\ \\\\end{array}$$  "
  fmt: "\nThe emerging technologies and the availability of different data sources\
    \ have lead to rapid expansion of data in all science and engineering domains.\
    \ One side, this massive data has potential to uncover more fine-grained patterns,\
    \ take timely and accurate decisions, and on other side it creates a lot of challenges\
    \ to make sense of it, like, slow training and scalability of models, because\
    \ of inability of traditional technologies to process this huge data. The term\
    \ ‘Big Data’ was coined to highlight the data explosion and need of new technologies\
    \ to process this massive data. Big data is a vast subject in itself. Big data\
    \ can be characterized using three Vs: Volume, Velocity and Variety, but recently\
    \ a lot of other Vs are also used. When one deal with ‘volume’ aspect of big data\
    \ in machine learning, it is called the large-scale machine learning problem or\
    \ big data problem. The large-scale learning problems have large number of data\
    \ points or large number of features in each data point, or both, which lead to\
    \ large per-iteration complexity of learning algorithms, and ultimately lead to\
    \ slow training of machine learning models. Thus, one of the major challenges\
    \ before machine learning is to develop efficient and scalable learning algorithms\
    \ \\[[23](#bib.xhtml#refbib_23), [25](#bib.xhtml#refbib_25)\\].\n\n## 1.2 Optimization\
    \ Problems\n\nThe problems where we try to find the optimum value, i.e., minimum\
    \ or maximum, are called optimization problems and can be represented in general\
    \ form as:\n\n$$\n\\begin{array}{l} {\\underset{w}{\\min}\\\\,\\, F(w)\\quad\\\
    text{s.t}\\,\\, w \\\\in \\Omega,} \\\\\\\\ \\end{array}\n$$  \n\n(1.1)\n\nwhere\
    \ `F` is an objective function which is to be minimized, `w` ∈ ℝ^(*n*) is the\
    \ parameter vector to be found and Ω represent the constraint set of `w`.\n\n\
    Machine learning involves data intensive optimization problems, as it learns the\
    \ model from the data and try to minimize the model error, i.e., difference in\
    \ the value predicted by the model and the actual value. We consider unconstrained\
    \ convex optimization problem of expected risk, as given below:\n\n$$\n\\begin{array}{l}\
    \ {{\\min}_{w}R(w) = \\mathbb{E}\\left\\lbrack {f\\left( {w;\\xi} \\\\right)}\
    \ \\right\\rbrack,} \\\\\\\\ \\end{array}\n$$  \n\n(1.2)\n\nwhere `f(w;ξ)` = `f(w;x[i],y[i])`\
    \ = `f(h(w;x[i]),y[i])` is a composition of linear prediction model `h` and loss\
    \ function `f` over randomly selected data point (`x[i]`,`y[i]`) from the unknown\
    \ distribution `P(x[i],y[i])` and targets, parameterized by the model parameter\
    \ `w` ∈ ℝ^(*n*). Since it is not feasible to solve (7.1) as `P` is unknown so\
    \ the model is approximated by taking a set `N` = {(`x[1]`,`y[1]`),...,(`x[l]`,`y[l]`)}\
    \ of `l` data points from the unknown distribution `P` and then solving the empirical\
    \ risk minimization (ERM) problem, as given below:\n\n$$\n\\begin{array}{l} {{\\\
    min}_{w}F(w) = \\frac{1}{l}{\\sum\\limits_{i = 1}^{l}f}(w;x_{i},y_{i}).} \\\\\\\
    \\ \\end{array}\n$$  \n\n(1.3)\n\nFor simplicity, we take `f(w;x[i],y[i])` = `f[i](w)`.\
    \ Finite sum optimization problems of type (1.3) exists across different fields,\
    \ like signal processing, statistics, operations research, data science and machine\
    \ learning.\n\nIn ERM, component function `f[i](w)` denotes value of loss function\
    \ at one data point, e.g., in binary classification, it can be logistic loss,\
    \ i.e., `f[i](w)` = log(1+exp(−`y[i]`*`w`^(*T*)*`x[i]`)) and hinge-loss, i.e.,\
    \ `f[i](w)` = max(0,1−`y[i]`*`w`^(*T*)*`x[i]`); for regression problem, it can\
    \ be least squares, i.e., `f[i](w)` = 1/2(`w`^(*T*)*`x[i]` − `y[i]`)². The regularizer\
    \ can be `λ[1]`∥`w`∥[1] (`l[1]`-regularizer), `λ[2]`/2∥`w`∥² (`l[2]`-regularizer)\
    \ and `λ[1]`∥`w`∥[1] + `λ[2]`/2∥`w`∥² (elastic net regularizer), where `λ[1]`\
    \ and `λ[2]` are regularization coefficients. Thus, problems like logistic regression,\
    \ SVM, ridge regression and lasso etc., fall under ERM.\n\n## 1.3 Linear Classification\n\
    \nClassification is one of the machine learning problems which learns to assign\
    \ labels, i.e., a value from a predefined set of values, e.g., label an incoming\
    \ new mail as ham or spam is a classification problem. Classification can be classified\
    \ into two categories: linear and non-linear, and accordingly, we can have linear\
    \ and non-linear classifiers. Geometrically, linear classifier separates the data\
    \ linearly, unlike non-linear classifier which separates the data non-linearly.\
    \ Mathematically, linear classifiers use linear function for the prediction model,\
    \ unlike non-linear classifiers. For high dimensional problems, like document\
    \ classification, it is observed that linear classifiers have similar accuracy\
    \ as non-linear classifiers but the training time of linear classifiers are much\
    \ faster than non-linear classifiers.\n\n### 1.3.1 Support Vector Machine (SVM)\n\
    \nSupport Vector Machine (SVM, \\[[12](#bib.xhtml#refbib_12)\\]) is a binary linear\
    \ classification technique in machine learning, which separates the classes with\
    \ largest gap (called margin) between the border line instances (called support\
    \ vectors). That's why it is known as optimal margin classifier. [Figure 1.1](#02chap_01.xhtml#f1_1).\
    \ represents the geometrical view of SVM. SVM has been extended to multi-class\
    \ problems using techniques like One-versus-One \\[[72](#bib.xhtml#refbib_72)\\\
    ], One-versus-Rest \\[[132](#bib.xhtml#refbib_132)\\], Directed Acyclic Graph\
    \ SVM \\[[107](#bib.xhtml#refbib_107)\\] etc. For non-linearly separable data\
    \ problems, SVM has been extended using Kernels. Kernels are mathematical functions\
    \ that transform the data from given space (known as input space) to a new high\
    \ dimensional space (known as feature space) where data can be separated with\
    \ a linear surface (called hyperplane). [Figure 1.2](#02chap_01.xhtml#f1_2). represents\
    \ the geometrical view of Kernels. Mathematically, a Kernel is a function that\
    \ takes two arguments, apply a mapping on the arguments and then return the value\
    \ of their dot product. Suppose `x[1]` and `x[2]` are two data points, `ϕ` is\
    \ a mapping and `K` denotes Kernel which is given by\n\n$$\n\\begin{array}{l}\
    \ {K(x_{1},x_{2}) = \\phi{(x_{1})}^{T}\\phi(x_{2})} \\\\\\\\ \\end{array}\n$$\
    \  \n\n(1.4)\n\n![FIGURE 1.1 An infinite number of classifiers can be drawn for\
    \ the given data but SVM finds the classifier with largest gap between support\
    \ vectors. Circles represent the support vectors.](Images/fig1_1.jpg)\n\nFIGURE\
    \ 1.1 An infinite number of classifiers can be drawn for the given data but SVM\
    \ finds the classifier with largest gap between support vectors. Circles represent\
    \ the support vectors.\n\n![FIGURE 1.2 Left part represents data in input space\
    \ and right part represents data in feature space. Data has been Transformed from\
    \ input space to feature space using Kernels. Initially input space is two dimensional\
    \ and data is inseparable. Kernels transformed the data to three dimensional space\
    \ where data is separable by a hyperplane.](Images/fig1_2.jpg)\n\nFIGURE 1.2 Left\
    \ part represents data in input space and right part represents data in feature\
    \ space. Data has been Transformed from input space to feature space using Kernels.\
    \ Initially input space is two dimensional and data is inseparable. Kernels transformed\
    \ the data to three dimensional space where data is separable by a hyperplane.\n\
    \nIn some applications, the input space is rich in features and it is sufficient\
    \ to take the mapping `ϕ` as an identity mapping, i.e., `ϕ(x)` = `x`. Kernel where\
    \ mapping is identity mapping, that is, input space and feature space are equal,\
    \ is called linear Kernel and SVM using linear Kernel is called linear SVM. Mathematically,\
    \ linear Kernel is given by\n\n$$\n\\begin{array}{l} \\left. K(x_{1},x_{2}) =\
    \ x_{1}^{T}x_{2}\\quad\\Rightarrow\\quad\\phi(x) = x \\right. \\\\\\\\ \\end{array}\n\
    $$  \n"
  trans: "\n\n新兴技术和不同数据源的可用性导致所有科学和工程领域的数据迅速扩张。一方面，这些海量数据有潜力发现更细粒度的模式，做出及时和准确的决策；另一方面，它也带来了许多理解数据的挑战，例如，模型训练缓慢和可扩展性问题，原因是传统技术无法处理这些海量数据。“大数据”一词被提出，以强调数据爆炸以及处理这些海量数据所需的新技术。大数据本身是一个庞大的主题。大数据可以用三个\
    \ V 来描述：容量（Volume）、速度（Velocity）和多样性（Variety），但最近也使用了许多其他 V。当在机器学习中处理大数据的“容量”方面时，它被称为大规模机器学习问题或大数据问题。大规模学习问题具有大量的数据点或每个数据点中大量的特征，或两者兼有，这导致学习算法每次迭代的复杂性很高，并最终导致机器学习模型训练缓慢。因此，机器学习面临的主要挑战之一是开发高效且可扩展的学习算法\
    \ \\[23, 25\\]。\n\n## 1.2 优化问题\n\n试图寻找最优值（即最小值或最大值）的问题称为优化问题，可以用一般形式表示为：\n\n$$\n\
    \\begin{array}{l} {\\underset{w}{\\min}\\\\,\\, F(w)\\quad\\text{s.t}\\,\\, w\
    \ \\\\in \\Omega,} \\\\\\\\ \\end{array}\n$$  \n\n(1.1)\n\n其中 `F` 是要最小化的目标函数，`w`\
    \ ∈ ℝ^(*n*) 是要找到的参数向量，Ω 表示 `w` 的约束集。\n\n机器学习涉及数据密集型优化问题，因为它从数据中学习模型并试图最小化模型误差，即模型预测值与实际值之间的差异。我们考虑期望风险的无约束凸优化问题，如下所示：\n\
    \n$$\n\\begin{array}{l} {{\\min}_{w}R(w) = \\mathbb{E}\\left\\lbrack {f\\left(\
    \ {w;\\xi} \\\\right)} \\right\\rbrack,} \\\\\\\\ \\end{array}\n$$  \n\n(1.2)\n\
    \n其中 `f(w;ξ)` = `f(w;x[i],y[i])` = `f(h(w;x[i]),y[i])` 是线性预测模型 `h` 和损失函数 `f` 在从未知分布\
    \ `P(x[i],y[i])` 中随机选择的数据点 (`x[i]`,`y[i]`) 上的复合函数，由模型参数 `w` ∈ ℝ^(*n*) 参数化。由于 `P`\
    \ 未知，因此无法求解 (7.1)，所以模型通过从未知分布 `P` 中取一组 `N` = {(`x[1]`,`y[1]`),...,(`x[l]`,`y[l]`)}\
    \ 的 `l` 个数据点，然后求解经验风险最小化（ERM）问题来近似，如下所示：\n\n$$\n\\begin{array}{l} {{\\min}_{w}F(w)\
    \ = \\frac{1}{l}{\\sum\\limits_{i = 1}^{l}f}(w;x_{i},y_{i}).} \\\\\\\\ \\end{array}\n\
    $$  \n\n(1.3)\n\n为简单起见，我们取 `f(w;x[i],y[i])` = `fi`。类型 (1.3) 的有限和优化问题存在于不同领域，如信号处理、统计学、运筹学、数据科学和机器学习。\n\
    \n在 ERM 中，分量函数 `fi` 表示一个数据点处的损失函数值，例如，在二分类中，它可以是对数损失，即 `fi` = log(1+exp(−`y[i]`*`w`^(*T*)*`x[i]`))\
    \ 和铰链损失，即 `fi` = max(0,1−`y[i]`*`w`^(*T*)*`x[i]`)；对于回归问题，它可以是最小二乘，即 `fi` = 1/2(`w`^(*T*)*`x[i]`\
    \ − `y[i]`)²。正则化项可以是 `λ[1]`∥`w`∥[1]（`l[1]`-正则化项）、`λ[2]`/2∥`w`∥²（`l[2]`-正则化项）和\
    \ `λ[1]`∥`w`∥[1] + `λ[2]`/2∥`w`∥²（弹性网正则化项），其中 `λ[1]` 和 `λ[2]` 是正则化系数。因此，逻辑回归、SVM、岭回归和\
    \ Lasso 等问题都属于 ERM。\n\n## 1.3 线性分类\n\n分类是机器学习问题之一，它学习分配标签，即从预定义的值集合中取一个值，例如，将收到的新邮件标记为正常邮件或垃圾邮件是一个分类问题。分类可以分为两类：线性和非线性，相应地，我们可以拥有线性分类器和非线性分类器。从几何上讲，线性分类器以线性方式分离数据，而非线性分类器则以非线性方式分离数据。从数学上讲，线性分类器对预测模型使用线性函数，而非线性分类器则不然。对于高维问题，如文档分类，观察到线性分类器的准确率与非线性分类器相似，但线性分类器的训练时间比非线性分类器快得多。\n\
    \n### 1.3.1 支持向量机（SVM）\n\n支持向量机（SVM, \\[12\\]）是机器学习中的一种二元线性分类技术，它通过边界实例（称为支持向量）之间最大间隔（称为边距）来分离类别。这就是为什么它被称为最优边距分类器。Figure\
    \ 1.1. 表示 SVM 的几何视图。SVM 已使用诸如一对一 \\[72\\]、一对其余 \\[132\\]、有向无环图 SVM \\[107\\] 等技术扩展到多类问题。对于不可线性分离的数据问题，SVM\
    \ 已使用核函数进行扩展。核函数是将数据从给定空间（称为输入空间）转换到新的高维空间（称为特征空间）的数学函数，在该空间中数据可以用线性超平面分离。Figure\
    \ 1.2. 表示核函数的几何视图。从数学上讲，核函数是一个接受两个参数、对参数应用映射然后返回其点积值的函数。假设 `x[1]` 和 `x[2]` 是两个数据点，`ϕ`\
    \ 是一个映射，`K` 表示由以下公式给出的核函数：\n\n$$\n\\begin{array}{l} {K(x_{1},x_{2}) = \\phi{(x_{1})}^{T}\\\
    phi(x_{2})} \\\\\\\\ \\end{array}\n$$  \n\n(1.4)\n\n![FIGURE 1.1 An infinite number\
    \ of classifiers can be drawn for the given data but SVM finds the classifier\
    \ with largest gap between support vectors. Circles represent the support vectors.](img/fig1_1.jpg)\n\
    \nFIGURE 1.1 对于给定的数据可以绘制无限数量的分类器，但 SVM 找到了支持向量之间间隔最大的分类器。圆代表支持向量。\n\n![FIGURE\
    \ 1.2 Left part represents data in input space and right part represents data\
    \ in feature space. Data has been Transformed from input space to feature space\
    \ using Kernels. Initially input space is two dimensional and data is inseparable.\
    \ Kernels transformed the data to three dimensional space where data is separable\
    \ by a hyperplane.](img/fig1_2.jpg)\n\nFIGURE 1.2 左部分表示输入空间中的数据，右部分表示特征空间中的数据。数据已使用核函数从输入空间转换到特征空间。最初输入空间是二维的，数据不可分离。核函数将数据转换到三维空间，在该空间中数据可以由超平面分离。\n\
    \n在某些应用中，输入空间特征丰富，将映射 `ϕ` 取为恒等映射即可，即 `ϕ(x)` = `x`。映射为恒等映射的核函数，即输入空间和特征空间相等，称为线性核函数，使用线性核函数的\
    \ SVM 称为线性 SVM。从数学上讲，线性核函数由以下公式给出：\n\n$$\n\\begin{array}{l} \\left. K(x_{1},x_{2})\
    \ = x_{1}^{T}x_{2}\\quad\\Rightarrow\\quad\\phi(x) = x \\right. \\\\\\\\ \\end{array}\n\
    $$  \n\n"
