- raw: "\\[[78](#bib.xhtml#refbib_78)\\] introduced a parameter *λ* into the Hessian\
    \ and step direction given by eq. (2.50) changed to\n\n$$\\\\begin{array}{l} \\\
    \\begin{array}{l} {s\\_{k}^{L} = - \\\\left( {J{(w\\_{k})}^{T}J(w\\_{k}) + \\\\\
    lambda I} \\\\right)^{- 1}J{(w\\_{k})}^{T}r(w\\_{k})} \\\\\\\\ \\\\end{array}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n(2.51)\n\nwhere *I* is the identity matrix. Later\
    \ \\[[97](#bib.xhtml#refbib_97)\\] replaced the identity matrix with diagonal\
    \ matrix of Hessian matrix. So, eq. (2.51) gives Levenberg-Marquardt step direction\
    \ as:\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {s\\_{k}^{LM} = - \\\\left(\
    \ {H + \\\\lambda\\\\, > diag(H)} \\\\right)^{- 1}g} \\\\\\\\ \\\\end{array} \\\
    \\\\\\ \\\\end{array}$$  \n\n(2.52)\n\nwhere *H* = *J*(*w*[*k*])^(*T*)*J*(*w*[*k*])\
    \ and *g* = *J*(*w*[*k*])^(*T*)*r*(*w*[*k*]). *λ* is called the Levenberg-Marquardt\
    \ parameter and is used to make the approximate Hessian (*H*+*λ* >*d**i**a**g*(*H*))\
    \ positive definite. This method is robust with respect to larger residual problems\
    \ and poor initial solution. For *λ* = 0, Levenberg-Marquardt method behaves as\
    \ Gauss-Newton method, and for large value of *λ*, it behaves as Steepest Descent\
    \ method.\n\nLevenberg-Marquardt (LM) method can be extended as Levenberg-Marquardt\
    \ Trust Region (LMTR, \\[24\\]) method. In LM method *λ* is arbitrarily changed\
    \ but in LMTR instead of changing the *λ*, trust region radius is changed. Trust\
    \ Region method or line search methods are used to ensure sufficient decrease\
    \ in the function. Trust Region method can be used with any method that uses quadratic\
    \ model of the function for finding the solution.\n\n### 2.4.10  Quasi-Newton\
    \ Method\n\nQuasi-Newton method\\[126\\] is an alternative to Newton method. In\
    \ this method, instead of calculating the true Hessian (∇²*f*[*k*]) an approximation\
    \ of Hessian (*B*[*k*]) is used and updated at each step. So, the Quasi-Newton\
    \ search direction is given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {s\\\
    _{k}^{Q} = - B\\_{k}^{- 1}g} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(2.53)\n\nAdvantage of Quasi-Newton method is that it avoids calculation\
    \ of second order derivatives. It has super-linear rate of convergence. There\
    \ are many methods to update the Hessian value at each step. Two of the most famous\
    \ formula for updating *B*[*k*] are:\n\nSymmetric Rank (SR1, \\[[103](#bib.xhtml#refbib_103)\\\
    ]):\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {B\\_{k + 1} = B\\_{k} + \\\\\
    frac{\\\\left( {y\\_{k} - B\\_{k}p\\_{k}} \\\\right)\\\\left( {y\\_{k} - B\\_{k}p\\\
    _{k}} \\\\right)^{T}}{\\\\left( {y\\_{k} - B\\_{k}p\\_{k}} \\\\right)^{T}p\\_{k}}}\
    \ \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.54)\n\nwhere *y*[*k*] = ∇*f*[*k* + 1] − ∇*f*[*k*]\
    \ and *p*[*k*] = *w*[*k* + 1] − *w*[*k*].\n\nAnd BFGS \\[126\\] is named after\
    \ its inventors, Broyden, Fletcher, Goldfarb and Shanno:\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {B\\_{k + 1} = B\\_{k} - \\\\frac{B\\_{k}p\\_{k}p\\_{k}^{T}B\\\
    _{k}}{p\\_{k}^{T}B\\_{k}p\\_{k}} + \\\\frac{y\\_{k}y\\_{k}^{T}}{y\\_{k}^{T}p\\\
    _{k}}} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.55)\n\n### 2.4.11 \
    \ Subgradient Method\n\nSubgradient, subderivative and subdifferential refer to\
    \ the derivative of a non-differentiable convex function. Subgradient methods\
    \ \\[[92](#bib.xhtml#refbib_92), 118, [145](#bib.xhtml#refbib_145)\\] are optimization\
    \ methods for solving the non-differentiable convex functions. The update rule\
    \ for Subgradient method is given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l}\
    \ {w\\_{k + 1} = w\\_{k} - d\\_{k}g\\_{k}} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\
    \\end{array}$$  \n\n(2.56)\n\nwhere *g*[*k*] is the subgradient of function *f*\
    \ at *w*[*k*] and for step size *d*[*k*].\n\nStep size rule: (1) Fixed step: *d*[*k*]\
    \ is taken constant, (2) Fixed length: *d*[*k*]∥*g*[*k*]∥[2] is taken constant\
    \ and (3) Diminishing: $\\\\left. d\\_{k}\\\\rightarrow 0,\\\\quad{\\\\sum\\\\\
    limits\\_{k = 1}^{\\\\infty}d\\_{k}} = \\\\infty \\\\right.$.\n\nAdvantage of\
    \ Subgradient method is that it leads to a very simple algorithm. Disadvantage\
    \ of Subgradient method are that the convergence can be very slow and there is\
    \ no good stopping criterion for it.\n\n### 2.4.12  Conjugate Gradient Method\n\
    \nConjugate Gradient (CG) methods\\[85\\] are the optimization methods which are\
    \ less reliable than Newton method but can be used to solve very large problems.\
    \ It is proposed by \\[[50](#bib.xhtml#refbib_50)\\] for linear systems in 1950s\
    \ but has been extended to non-linear systems by \\[[43](#bib.xhtml#refbib_43)\\\
    ] in the 1960s. Advantage of Conjugate method is that it does not need any matrix\
    \ storage, it needs to calculate only objective function and its derivative which\
    \ makes it suitable for very large problems. It is faster than Steepest Descent\
    \ method. Inexact and Truncated Newton methods use it to approximate the Newton\
    \ step. Conjugate Gradient method can be accelerated using preconditioning.\n\n\
    According to \\[43\\], step size is determined by any of the existing methods\
    \ and step direction is found using the following formula and algorithm is given\
    \ by [Algorithm 4](#03chap_02.xhtml#algorithm_4):\n\n$$\\\\begin{array}{l} \\\\\
    begin{array}{l} {s\\_{k + 1} = - \\\\nabla f\\_{k + 1} + \\\\beta\\_{k + 1}s\\\
