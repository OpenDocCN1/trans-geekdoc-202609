    \ values to get better step direction. So, we have divided the latest value of\
    \ gradient using mini-batch size but old values using number of data points. SAAGs\
    \ are useful for sufficiently large mini-batches. Our intuitions are followed\
    \ by the empirical results which clearly show the out-performance of SAAGs over\
    \ other methods.\n\nIn this section, two methods are proposed with two training\
    \ algorithms, namely, SAAG-I and SAAG-II, both of which use the mini-batch and\
