    ### 2.3.2 Soft Margin SVM (1995)


    The problem with hard margin SVM is that if the dataset is not linearly separable
    then it becomes impossible to classify the data (that is, no separating hyperplane
    is found) and the presence of noise or outliers greatly affect the margin. [31],
    introduced a slack variable into the hard margin SVM to allow some mis-classification
    errors. This new SVM is known as soft margin SVM. [Figure 2.3](#03chap_02.xhtml#f2_3).
    depicts an example of soft margin SVM. Soft margin SVM solves the following optimization
    problem:


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{w}{\min}\quad\frac{1}{2}\| w\|^{2} + C{\sum\limits_{i = 1}^{l}\xi_{i}}}
    \\

    {\text{s.t.}\quad y_{i}w^{T}x_{i} \geq 1 - \xi_{i},\quad\xi_{i} \geq 0,\,\forall
    i,} \\

    \end{array}

    \\

    \end{array}

    $$


    (2.5)


    where `ξ[i]` is the slack variable to allow some mis-classification and `C` is
    a penalty parameter. `ξ[i]` is replaced by loss functions in SVM. L1 and L2 loss
    are two common loss functions in literature, given by eq. (2.1). The decision
    function is given by


    $$

    \begin{array}{l}

    {h(x) = sign(w^{T}x).} \\

    \end{array}

    $$


    ![FIGURE 2.3 An example of two dimensional inseparable data. Since data is not
    completely separable so SVM allows some mis-classification errors to find the
    separating hyperplane.](Images/fig2_3.jpg)


    FIGURE 2.3 An example of two dimensional inseparable data. Since data is not completely
    separable so SVM allows some mis-classification errors to find the separating
    hyperplane.


    Equation (2.5) represents the primal form, the dual form of soft margin SVM is
    given by


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\underset{\alpha}{\min}\quad f(\alpha) = \frac{1}{2}\alpha^{T}\overline{Q}\alpha
    - \mathbf{1}^{T}\alpha} \\

    {\text{s.t.}\quad 0 \leq \alpha_{i} \leq U,\,\forall i,} \\

    \end{array}

    \\

    \end{array}

    $$


    (2.6)


    where $\overline{Q} = Q + D$, `D` is a diagonal matrix, `Q[i][j] = y[i]*y[j]*x[i]^T*x[j]`,


    $U = \left\{ \begin{array}{l} {C\quad\text{for~L1~loss~SVM}} \\ {\infty\quad\text{for~L2~loss~SVM}}
    \\ \end{array} \right.$ and $D_{ii} = \left\{ \begin{array}{l} {0\quad\text{for~L1~loss~SVM}}
    \\ {\frac{1}{2C}\quad\text{for~L2~loss~SVM}} \\ \end{array} \right.\forall i$.


