    _{i}\\\\alpha\\_{i}$ disappears from objective function in eq. (2.15).\n\n###\
    \ 2.3.7  Smooth SVM (2001)\n\nSmooth SVM\\[77\\] proposes a new smooth formulation\
    \ for SVM, to handle its non-differentiability issue. Smooth SVM is a strongly\
    \ convex and infinitely differentiable. It enjoys globally, quadratically convergent\
    \ solutions using a fast Newton-Armijo algorithm. It uses Newton's method for\
    \ obtaining the step direction and Armijo rule for determining the step size.\n\
    \nSuppose there are *l* training points in *n* dimensional space represented by\
    \ *l* × *n* matrix *A* with membership of each data *A*[*i*] in classes +1 and\
    \ -1 is represented by the diagonal *l* × *l* matrix *D* with values +1 or -1\
    \ on the diagonal. The standard SVM with some *ν* > 0 and linear Kernel *A*^(*T*)*A*,\
    \ is given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\underset{{({w,\\\
    \\gamma,y})} \\\\in {\\\\mathbb{R}}^{n + 1 + l}}{\\\\min}\\\\quad\\\\nu\\\\mathbf{1}^{T}y\
    \ + \\\\frac{1}{2}\\\\left\\\\| w \\\\right\\\\|^{2}} \\\\\\\\ {\\\\text{s}\\\\\
    text{.t}\\\\text{.}\\\\quad D\\\\left( {Aw - \\\\mathbf{1}\\\\gamma} \\\\right)\
    \ + y \\\\geq \\\\mathbf{1},\\\\quad y \\\\geq 0} \\\\\\\\ \\\\end{array} \\\\\
    \\\\ \\\\end{array}$$  \n\n(2.17)\n\nwhere *w*, *γ* are parameters and *y* is\
    \ the slack variable. The standard SVM is first modified to get the following\
