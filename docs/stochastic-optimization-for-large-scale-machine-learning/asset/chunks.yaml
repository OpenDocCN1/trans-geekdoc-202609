  trans: "\n\nFIGURE 7.1 第一列展示了优化性与训练时间（秒）的关系，第二列展示了准确率与训练时间的关系，数据集为 mushroom（第一行）和\
    \ rcv1（第二行）。\n\n### 7.5.3  使用 SVM 的结果\n\n我们扩展 STRON 以求解 `l[2]\\-SVM` 问题，这是一个非光滑问题，如下所示：\n\
    \n```\n$$\\begin{array}{l} {\\\\underset{w}{\\\\min}\\\\, F(w) = \\\\frac{1}{l}{\\\
    \\sum\\\\limits\\_{i = 1}^{l}{\\\\max}}{(0,1 - y\\_{i}w^{T}x\\_{i})}^{2} + \\\\\
    frac{\\\\lambda}{2}\\\\| w\\\\|^{2}.} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.19)\n\
    \n![FIGURE 7.2 在 news20 数据集上进行 l2-SVM 实验。](img/fig7_2.jpg)\n\nFIGURE 7.2 在 news20\
    \ 数据集上进行 `l[2]\\-SVM` 实验。\n\n结果在 图 7.2 中报告，使用 news20 数据集。从图中可以清楚地看出，STRON 显示出与逻辑回归问题相似的结果，并优于所有其他方法。\n\
    \n## 7.6  扩展\n\n在本节中，我们讨论了所提方法的扩展，使用 `PCG` 求解信任域子问题，并使用方差减小技术。\n\n### 7.6.1  PCG\
    \ 子问题求解器\n\n`CG` 方法求解子问题所需的迭代次数取决于海森矩阵的条件数。因此，对于病态问题，`CG` 方法收敛缓慢。为了避免这种情况，通常使用一个非奇异矩阵\
    \ `M`，称为预条件子，如下所示。对于线性系统 `∇²*F*(*w*)*p* =  − ∇*F*(*w*)`，我们求解以下系统：\n\n```\n$$\\\
    begin{array}{l} {M^{- 1}\\\\nabla^{2}F(w)p = - M^{- 1}\\\\nabla F(w).} \\\\\\\\\
    \ \\\\end{array}$$  \n```\n\n(7.20)\n\n通常，`M`^( − 1) = `L**L`^(*T*) 被采用以确保 `M`^( − 1)∇²*F*(*w*)\
    \ 的对称性和正定性。`PCG` 可用于求解病态问题，但它涉及额外的计算开销。我们遵循 \\[51\\] 将 `PCG` 用作单位矩阵和海森矩阵对角矩阵的加权平均，如下所示：\n\
    \n```\n$$\\begin{array}{l} {M = \\\\alpha \\\\times diag(H) + (1 - \\\\alpha)\
    \ \\\\times I,} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.21)\n\n其中 `H` 是海森矩阵，且 0 ≤ `α` ≤ 1。对于\
    \ `α` = 0，没有预条件处理；对于 `α` = 1，它是一个对角预条件子。在实验中，我们对 `TRON` 和 `STRON-PCG` \\[51\\\
    ] 取 `α` = 0.01。要将 `PCG` 应用于信任域子问题，我们可以在更改信任域子问题 (7.11) 后，不做任何修改地使用 算法 17，如下所示\
    \ \\[124\\]：\n\n```\n$$\\begin{array}{l} {{\\\\min}\\_{\\\\hat{p}}\\\\left( {L^{-\
    \ 1}\\\\nabla F\\_{X\\_{k}}\\\\left( w\\_{k} \\\\right)} \\\\right)^{T}\\\\hat{p}\
    \ + \\\\frac{1}{2}{\\\\hat{p}}^{T}\\\\left( {L^{- 1}\\\\nabla^{2}F\\_{S\\_{k}}\\\
    \\left( w\\_{k} \\\\right)L^{- T}} \\\\right)\\\\hat{p},\\\\,\\\\,\\\\text{s}\\\
    \\text{.t}\\\\text{.}\\\\,\\\\,\\\\|\\\\hat{p}\\\\| \\\\leq \\\\bigtriangleup\\\
    _{k},} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.22)\n\n其中 `p̂` = `L`^(*T*)`p`。使用\
    \ `PCG` 作为信任域子问题求解器的 `STRON` 表示为 `STRON-PCG`，结果在 图 7.3 中报告。它在 Adult 数据集上比较了 `TRON`、`STRON`\
    \ 和 `STRON-PCG`。从图中可以清楚地看出，`STRON` 和 `STRON-PCG` 均优于 `TRON`。\n\n![FIGURE 7.3 在\
    \ Adult 数据集上对 `STRON\\_PCG`、`STRON` 和 `TRON` 的比较研究。](img/fig7_3.jpg)\n\nFIGURE\
    \ 7.3 在 Adult 数据集上对 `STRON\\_PCG`、`STRON` 和 `TRON` 的比较研究。\n\n`PCG` 信任域子问题求解器涉及计算预条件子的额外成本，对于\
    \ `TRON`，由于预条件子产生的开销由以下给出：\n\n```\n$$\\begin{array}{l} \\\\begin{array}{ll} &\
    \ {O\\\\left( n \\\\right) \\\\times \\\\#\\\\text{CG~iterations} + O(nl).} \\\
    \\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.23)\n\n对于 `STRON-PCG`，预条件子涉及如下的额外成本：\n\
    \n```\n$$\\begin{array}{l} \\\\begin{array}{ll} & \\\\left. O\\\\left( n \\\\\
    right) \\\\times \\\\#\\\\text{CG~iterations} + O(n \\\\middle| S\\_{k} \\\\middle|\
    \ ). \\\\right. \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.24)\n\
    \n### 7.6.2  随机方差减小信任域不精确牛顿方法\n\n最近，研究人员提出了带有方差减小的二阶方法的随机变体。因此，了解方差减小如何与随机信任域不精确牛顿方法协同工作是一个有趣的问题，因为这尚未被研究。我们的实证结果表明，即使在海森矩阵计算中使用渐进子采样，方差减小在这种情况下也不起作用。\n\
    \n![FIGURE 7.4 在 rcv1 数据集上对 `STRON-SVRG`、`STRON` 和 `TRON` 的比较研究。](img/fig7_4.jpg)\n\
    \nFIGURE 7.4 在 rcv1 数据集上对 `STRON-SVRG`、`STRON` 和 `TRON` 的比较研究。\n\n为了提高搜索方向的质量，我们将\
    \ `SVRG` 用作梯度计算的方差减小技术，如下所示：\n\n```\n$$\\begin{array}{l} {g\\_{k} = \\\\nabla\
    \ F\\_{S\\_{k}}(w\\_{k}) - \\\\nabla F\\_{S\\_{k}}(\\\\overline{w}) + \\\\nabla\
    \ F(\\\\overline{w}),} \\\\\\\\ \\\\end{array}$$  \n```\n\n(7.25)\n\n其中 `\\\\\
    overline{w}` 是外层迭代开始时的参数值。`STRON-SVRG` 对梯度计算使用方差减小，对海森矩阵计算使用渐进批处理，如 算法 18 所示。\n\
    \n![](img/algo18.jpg)\n\n实验结果在 图 7.4 中展示，使用 rcv1 数据集。从图中可以清楚地看出，`STRON-SVRG` 落后于\
    \ `STRON` 和 `TRON`，即，`STRON-SVRG` 中的方差减小不足以击败 `STRON` 梯度计算中的渐进批处理。这是因为 `STRON-SVRG`\
    \ 和 `STRON` 都是 `TRON` 的随机/子采样变体，为了补偿噪声梯度计算，前者使用众所周知的方差减小策略，而后者使用渐进子采样策略。`STRON`\
    \ 能够击败 `TRON`，但 `STRON-SVRG` 失败并落后于两者。\n\n## 7.7  结论\n\n我们提出了一种新的随机信任域不精确牛顿方法，称为\
    \ `STRON`。所提方法使用渐进批处理方案来处理梯度和海森矩阵的噪声近似，并享受随机和全批模式的双重好处。`STRON` 已扩展为使用预条件 `CG`\
    \ 作为信任域子问题求解器，并使用方差减小来处理噪声梯度计算。我们的实证结果证明了 `STRON` 在基准数据集上相对于最先进技术的有效性。\n\n# IV\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_CONCLUSION\n\n# Chapter 8 Conclusion and Future Scope\n\
    \nDOI: [10.1201/9781003240167-8](http://doi.org/10.1201/9781003240167-8)\n\n技术的进步和数据源的可用性使我们进入了“大数据”时代。一方面，这些大数据有潜力发现更精细的模式，做出及时准确的决策；但另一方面，它也带来了许多挑战，例如机器学习模型的训练缓慢和可扩展性等。因此，机器学习的主要挑战之一是开发高效且可扩展的学习算法，即用于解决大规模学习问题的优化技术。\n\
    \n我们可以通过在以下领域工作来应对这一挑战：问题表述、问题求解器、改进求解器的优化策略以及利用计算资源，如图形处理单元 (`GPUs`)、并行和分布式计算。但是，在这些潜在领域中，最近，研究人员专注于随机近似算法、坐标下降算法、近端算法以及并行和分布式算法来应对这一挑战。\n\
    \n"
