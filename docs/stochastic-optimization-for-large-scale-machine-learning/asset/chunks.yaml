- raw: "To solve the big data challenge, we have identified different areas in SVC,\
    \ most of which are also common with other areas in machine learning and these\
    \ are discussed in the next subsection.\n\n### 2.6.2  Areas of Improvement\n\n\
    Classification is one technique in Machine Learning which is used to assign labels\
    \ to test data points from a set of predefined values with the help of a model\
    \ which is trained on labeled data. Mathematically, classification problem is\
    \ an optimization problem where margin between different classes is maximized\
    \ while keeping the classification errors minimum. While solving the classification\
    \ problem, there are two objectives: first, training speed of SVM models on the\
    \ training data set and second, accuracy of prediction of labels on test data\
    \ set. So, speed and accuracy are two goals while solving the classification problems\
    \ but there is a trade-off between the speed and accuracy of algorithms. If simple\
    \ algorithms are used to increase the speed then it does not give good accuracy\
    \ of classification. On the other hand when complex algorithms are used for training\
    \ the model, it increases the accuracy but training speed decreases, e.g., Steepest\
    \ Descent method is fast but its convergence rate is slow as compared with Newton\
    \ method. It depends upon the application, whether to sacrifice speed or accuracy.\
    \ Both training speed and test accuracy of an algorithm depends upon these factors:\
    \ Problem Formulations, Problem Solvers, framework/platform utilization and optimization\
    \ strategies, as depicted in [Fig. 2.9](#03chap_02.xhtml#f2_9). So to make Linear\
    \ SVM classification efficient and scalable, the challenge is to handle these\
    \ factors effectively.\n\n![FIGURE 2.9 Improvement areas for Linear SVM Classification.](Images/fig2_9.jpg)\n\
    \nFIGURE 2.9 Improvement areas for Linear SVM Classification.\n\n#### 2.6.2.1 Problem\
    \ Formulations\n\nProblem formulation is very important in SVM, the solvers to\
    \ be used in an SVM problem also depends on problem formulation to some extent.\
    \ SVM can be formulated as convex \\[77\\] as well as non-convex optimization\
    \ problem \\[126\\]. Generally SVM is formulated as a convex optimization problem\
    \ because there is no problem of local minimum as every local minimum is a global\
    \ minimum. SVC optimization problem has two components: margin and loss functions/errors.\
    \ The trade-off between margin and errors is controlled by parameter *C*.\n\n\
    1.  Margin:\n\n    This component is used to control the distance between separating\
    \ hyperplanes. Larger the margin, better is the generalization of classifier.\
    \ Currently, L1R (∥*w*∥, \\[[153](#bib.xhtml#refbib_153)\\]) and L2R (∥*w*∥²,\
    \ \\[29\\]) are widely used in the literature for representing margin in the SVM\
    \ problem.\n\n2.  Loss Functions:\n\n    This component introduced in soft margin\
    \ SVM as a slack variable. It helps to minimize the mis-classification errors\
    \ of classifier. Commonly, L1 loss \\[118\\] and L2 loss \\[[76](#bib.xhtml#refbib_76)\\\
    ] functions (refer to, eq. 2.1) are widely used in literature. Other loss functions\
    \ (e.g., \\[[88](#bib.xhtml#refbib_88)\\]) can be used, it depends upon the problem\
    \ formulation (refer to \\[[129](#bib.xhtml#refbib_129)\\], for complete list\
    \ of loss functions).\n\n    These two components combined together form the SVM\
    \ problem (see, [Section 2.3](#03chap_02.xhtml#sec2_3) for different problem formulations).\
    \ So, the current challenge is to make appropriate choices for margin and errors\
    \ or propose new ones to have an effective SVM problem. Inappropriate formulations\
    \ can lead to local minimum problems, differentiability issues, slower and less\
    \ accurate methods.\n\n#### 2.6.2.2 Problem Solvers\n\nProblem Solvers, again\
    \ play an important role to get faster and accurate results. There are many methods\
    \ available for solving the optimization problems as discussed in [Section 2.4](#03chap_02.xhtml#sec2_4).\
    \ It depends upon problem formulation (to some extent) as which method is to be\
    \ used for solving it. From literature, it is observed that different researchers\
    \ have solved same problem with different solvers, has lead to different results\
    \ (\\[85, 65\\] solve the same problem). Today challenge is to find efficient\
    \ solvers which could produce accurate and faster results.\n\n#### 2.6.2.3 Problem\
    \ Solving Strategies/Approaches\n\nApproaches play a critical role in solving\
    \ an SVM problem using an SVM solver. The problem formulation may be very good\
    \ and problem solver may be very efficient too but still our algorithm may not\
    \ perform well, due to lack of suitable optimization strategies e.g., suppose\
    \ there is large sparse data problem, if sparsity of problem is not utilized then\
    \ the training of this optimization technique could be very slow. Similarly using\
    \ decomposition methods, stochastic approximation and problem shrinking etc.,\
    \ can make the problem solving process faster. Some of the strategies for machine\
    \ learning (SVM) problems are:\n\n1.  Exploit Problem Structures:\n\n    The problem\
    \ structures like sparsity \\[[125](#bib.xhtml#refbib_125)\\] of the problem can\
    \ be exploited to make learning more efficient. There are many problems like document\
    \ classification where most of the features are zero. So, the problem solver should\
    \ utilize this characteristic, while training the model which can help in faster\
    \ training of the problem. Similarly, handling the data in memory also affects\
    \ the SVM solvers like storing data feature wise \\[38\\] or instance wise.\n\n\
    2.  Decomposition Approaches:\n\n    According to this approach, the problem is\
    \ decomposed into smaller problems and then subproblems are solved using some\
    \ solver to get the solution of original problem \\[[64](#bib.xhtml#refbib_64)\\\
    ], e.g., suppose there are 10,000 parameters in a problem, then it could be solved\
    \ by first taking first 100 parameters, fixing the remaining and solving this\
    \ subproblem, then next 100 parameters can be solved and repeating this process\
    \ until all the parameters are solved. This constitutes one iteration, the process\
    \ can be repeated until convergence. One extreme case of decomposition approach\
    \ is Coordinate Descent approach \\[137\\], according to this approach, problem\
    \ is solved for one variable, keeping all other variables fixed. This approach\
    \ of optimization helps in overcoming implementation issues of memory and CPU.\
    \ No doubt this approach takes more iterations and slower convergence but it makes\
    \ the problem feasible to implement because with large number of features (variables),\
    \ it might not be possible to process the algorithm due to large memory and CPU\
    \ requirements.\n\n    Coordinate descent \\[38, 137\\], SMO \\[[106](#bib.xhtml#refbib_106)\\\
    ] and Block Optimization \\[23\\] are three examples of decomposition approaches.\
    \ This approach helps in solving the large problems. The general algorithm for\
    \ Coordinate Descent approach is given in [Algorithm 6](#03chap_02.xhtml#algorithm_6).\n\
    \n    Advantages of Coordinate Descent approach: Parallel versions are available;\
    \ No extra storage vector needed; No other pesky parameters are required here;\
    \ It works well for very large problems and it's easy to implement. Disadvantages\
    \ of Coordinate Descent approaches: Tricky if single variable optimization is\
    \ hard; Convergence theory could be very complex; It can be slower near optimum.\n\
    \n    ![](Images/algo6.jpg)\n\n3.  Stochastic Approximation Approach:\n\n    Generally\
    \ the parameters are optimized over all the data instances in each iteration but\
    \ in stochastic approximation \\[113\\], the parameters are optimized over one\
    \ instance at a time. Stochastic Approximation approach makes each iteration independent\
    \ of data points and reduces the iteration complexity. Thus, this approach is\
    \ very helpful in solving large-scale problems. This is because instead of going\
    \ through all instances in the dataset, it takes only one instance during each\
    \ iteration. There are other variations of this approach as ‘mini-batch’ approach\
    \ \\[29\\] where instead of taking one instance during each iteration, it takes\
    \ a subset of training instances."
