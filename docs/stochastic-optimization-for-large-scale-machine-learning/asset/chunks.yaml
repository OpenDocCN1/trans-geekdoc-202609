    FIGURE 2.8 First row: mushroom (*#instances: 8124, #features: 112*), second row:\
    \ rcv1, (*#instances: 20,242, #features: 47,236*.)\n\n## 2.6  Current Challenges\
    \ and Research Directions\n\n### 2.6.1  Big Data Challenge\n\nWith the advancements\
    \ in the technology, data has taken the form of ‘Big Data’ and the meaning of\
    \ ‘big’ in big data is continuously changing and will continue to change. Earlier,\
    \ few hundred instances were considered to be a large dataset because of the limited\
    \ computing resources and limited data available at that time. Later, meaning\
    \ of large dataset changed to thousands of instances. Now, large dataset refers\
    \ to millions of instances. In order to make use of this huge data, efficient\
    \ machine learning algorithms are needed to handle these large datasets. Moreover,\
    \ these algorithms are also needed to be scalable to deal with increasing sizes\
    \ of datasets. *Thus, nowadays, the biggest challenge before SVC (which are shared\
    \ with machine learning) is to develop efficient and scalable learning algorithms\
    \ to deal with big data*."
