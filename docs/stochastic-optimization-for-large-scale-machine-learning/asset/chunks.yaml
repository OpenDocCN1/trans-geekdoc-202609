- raw: "*   Different areas have been discussed to solve the big data challeng and\
    \ out of the different research areas, the current research directions have been\
    \ discussed to tackle the challenge.\n\n*   A comparative study of related primal\
    \ SVMs has been presented using mini-batch stochastic gradient descent method\
    \ which has pointed out why soft margin SVM is the most widely used problem formulation\
    \ for SVM.\n\n## 2.2  Literature\n\nSupport Vector Machines (SVMs, \\[12, 31\\\
    ]) is a classification technique in Machine Learning. The concepts used in SVMs,\
    \ like hyperplane, optimal margin and Kernels etc., are several decades old but\
    \ in the current form, SVM developments have started from \\[12\\], namely. ‘A\
    \ Training Algorithm for Optimal Margin Classifiers’ in 1992 in COLT. This SVM\
    \ formulation is also known as ‘Hard Margin SVM’. \\[31\\] improved the hard margin\
    \ SVM. They considered the outliers and noise, and relaxed the margin to mis-classify\
    \ some data points by introducing slack variables. This led to the ‘Soft Margin\
    \ SVM’. Till this time, SVM was used as a binary classifier, when \\[132\\] proposed\
    \ a multi-class SVM using one-versus-rest (OVR) technique. \\[[61](#bib.xhtml#refbib_61)\\\
    ] proposed Transductive SVM for text classification. \\[[127](#bib.xhtml#refbib_127)\\\
    ] proposed least squared version of SVM. Later, \\[72\\] proposed another multi-class\
    \ SVM using one-versus-one (OVO) technique but both, OVR and OVO, were based on\
    \ binary classification problems. \\[[135](#bib.xhtml#refbib_135)\\] proposed\
    \ first multi-class SVM (WWSVM), which solves a single SVM problem and was not\
    \ based on multiple binary classification problems. \\[107\\] proposed Directed\
    \ Acyclic Graph SVM (DAGSVM) for multi-class classification problems, which was\
    \ similar to OVO technique in solving SVM problem but it employs an efficient,\
    \ rooted acyclic binary tree to find the label for the test data. \\[[116](#bib.xhtml#refbib_116)\\\
    ] proposed a new *ν*\\-SVM, which removes parameter *C* and introduces parameter\
    \ *ν* that roughly gives the fraction of support vectors. \\[[45](#bib.xhtml#refbib_45)\\\
    ] proposed Proximal SVM (PSVM) which uses the proximity of data point to the proximal\
    \ planes to classify the data point. PSVM replaces bounding planes of the standard\
    \ SVM with the proximal planes and uses proximal planes for classification instead\
    \ of the separating hyperplane. \\[[77](#bib.xhtml#refbib_77)\\] introduced Smooth\
    \ SVM which handles the non-differentiability issues of the standard SVM. \\[[95](#bib.xhtml#refbib_95)\\\
    ] proposed Lagrangian SVM. \\[33\\] proposed another multi-class classification\
    \ SVM that solves a single SVM problem unlike OVO and OVR techniques. Later \\\
    [[86](#bib.xhtml#refbib_86)\\] proposed a new formulation called Fuzzy SVM (FSVM)\
    \ which was further extended by \\[[2](#bib.xhtml#refbib_2)\\] and \\[[1](#bib.xhtml#refbib_1)\\\
    ]. Fuzzy SVM introduces fuzzy membership of data points to each of the classes\
    \ and contributions of these points are used to find the separating plane. Fuzzy\
    \ SVM is very useful in reducing the effect of outliers and noise. \\[[109](#bib.xhtml#refbib_109)\\\
    ] extended *ν*\\-SVM \\[116\\] to *E**ν* -SVM and helped to control margin, errors\
    \ and consequently support vectors. \\[[57](#bib.xhtml#refbib_57)\\] combined\
    \ the idea of FSVM \\[86\\] and PSVM \\[45\\] and proposed Fuzzy Proximal SVM\
    \ (FPSVM). Here fuzzy membership is assigned to data points and points are classified\
    \ on the basis of proximity to two parallel planes which are kept as far from\
    \ each other as possible. \\[[131](#bib.xhtml#refbib_131)\\] proposed Structured\
    \ SVM which generalizes the multi-class SVM, namely, WWSVM and CSSVM, to a new\
    \ formulation that has structured outputs like sequences, strings, graphs, labeled\
    \ trees or lattices etc. \\[[37](#bib.xhtml#refbib_37)\\] extended the standard\
    \ SVM, i.e., single task learning SVM and proposed a new binary SVM for multi-task\
    \ learning. \\[[49](#bib.xhtml#refbib_49)\\] proposed a parallel SVM known as\
    \ Cascade SVM which deploys a divide and conquer strategy to solve the SVM problem.\
    \ Cascade SVM divides the dataset into subsets and trains multiple SVMs in parallel\
    \ on each subset. \\[[96](#bib.xhtml#refbib_96)\\] proposed Generalized Eigenvalue\
    \ Proximal SVM (GEPSVM) with two non-parallel hyperplanes and the data points\
    \ are classified according to the proximity to one of the two non-parallel planes.\
    \ \\[[40](#bib.xhtml#refbib_40)\\] extended the idea of multi-view learning to\
    \ SVM and proposed Multi-View SVM. \\[[56](#bib.xhtml#refbib_56)\\], extended\
    \ Proximal SVM to Twin SVM which solves two small sized SVM problems and gives\
    \ two non-parallel hyperplanes. \\[[126](#bib.xhtml#refbib_126)\\] proposed SloppySVM\
    \ which can learn from the sloppily labeled data. \\[[102](#bib.xhtml#refbib_102)\\\
    ] have proposed CappedSVM using capped *l*[*p*]\\-norm based loss function, to\
    \ tackle the challenge of data outliers.\n\n![FIGURE 2.2 Time line of SVM: OVR\
    \ – One versus Rest, T-SVM – Transductive SVM, OVO – One-versus-One, WWSVM – Weston\
    \ and Watkins SVM, LSSVM – Least Squares SVM, DAGSVM – Directed Acyclic Graph\
    \ SVM, LSVM – Lagrangian SVM, CSSVM – Crammer Singer SVM, FSVM – Fuzzy SVM, PSVM\
    \ – Proximal SVM, FPSVM – Fuzzy Proximal SVM, Strcd SVM – Structured SVM, MTSVM\
    \ – Multi-Task SVM, GEPSVM – Generalized Eigenvalue Proximal SVM, MVSVM – Multi-View\
    \ SVM, TW SVM – Twin SVM.](Images/fig2_2.jpg)\n\nFIGURE 2.2 Time line of SVM:\
    \ OVR – One versus Rest, T-SVM – Transductive SVM, OVO – One-versus-One, WWSVM\
    \ – Weston and Watkins SVM, LSSVM – Least Squares SVM, DAGSVM – Directed Acyclic\
    \ Graph SVM, LSVM – Lagrangian SVM, CSSVM – Crammer Singer SVM, FSVM – Fuzzy SVM,\
    \ PSVM – Proximal SVM, FPSVM – Fuzzy Proximal SVM, Strcd SVM – Structured SVM,\
    \ MTSVM – Multi-Task SVM, GEPSVM – Generalized Eigenvalue Proximal SVM, MVSVM\
    \ – Multi-View SVM, TW SVM – Twin SVM.\n\n[Figure 2.2](#03chap_02.xhtml#f2_2).\
    \ depicts the year-wise evolution of different SVMs which are not necessarily\
    \ improvements over previous ones. The mathematical formulations and other details\
    \ of different SVM evolution and their solvers are discussed in the coming sections.\
    \ The focus of this chapter is on supervised linear Support Vector Classification\
    \ (SVC), so only those SVM formulations are discussed which are used for classification\
    \ and have major contributions. As far as linear and non-linear SVMs are concerned,\
    \ they have same formulations except the space in which they perform classification.\
    \ Linear SVMs perform in the input space and non-linear SVMs perform in the feature\
    \ space. The chapter discusses only linear SVMs but the mathematical formulations\
    \ for non-linear SVMs can be derived from the linear SVMs by using the following\
    \ replacements:\n\n$$\\\\begin{array}{l} \\\\left. x\\_{1}^{T}x\\_{2}\\\\mapsto\
    \ K\\\\left( {x\\_{1},x\\_{2}} \\\\right), \\\\right. \\\\\\\\ \\\\end{array}$$\
    \  \n\nwhere *x*[1] and *x*[2] denote data points and *K* denotes the Kernel function.\n\
    \n## 2.3  Problem Formulations\n\nProblem formulation is the mathematical representation\
    \ of the problem under study. SVM Classification problem is an optimization problem\
    \ whose mathematical representation consists of an objective function and constraints\
    \ (if any). Researchers have proposed a variety of ideas for SVM classification\
    \ with different problem formulations. The evolution of the SVM is discussed in\
    \ the following subsections[¹](#fn1)\n\n### 2.3.1  Hard Margin SVM (1992)\n\n\
    Although the concepts like hyperplane, optimal margin and Kernels are in use for\
    \ several decades but \\[12\\] are the first to formulate SVM in its current form.\
    \ This SVM is a binary classifier which can work with only linearly separable\
    \ data applications and presence of any noise or outliers strongly affects the\
    \ margin. It does not allow mis-classification errors, that's why it is known\
    \ as hard margin SVM. Hard margin SVM is represented by the Fig. 1.1."
