    which introduce subsampling to gradient and Hessian calculations.


    ### 7.1.3  Contributions


    The contributions of the chapter are listed below:


    *   The chapter highlights the recent shift of stochastic methods from first order
    to second order methods and raises an open question that we need stochastic second
    order methods with quadratic convergence rate to solve large-scale machine learning
    problems.


    *   We have proposed a novel subsampled variant of trust region inexact Newton
    method, which is called STRON and is first stochastic variant of trust region
    inexact Newton methods. STRON uses progressive subsampling scheme for gradient
    and Hessian calculations to enjoy the benefits of both stochastic and full batch
    regimes. STRON can converge up to quadratic rate and answers the raised open question.


    *   STRON has been extended using existing variance reduction techniques to deal
    with the noisy approximations of the gradient calculations. The extended method
    uses stochastic variance reduced gradient (SVRG) for variance reduction with static
    batching for gradient calculations and progressive batching for the Hessian calculations.
    The empirical results prove that this does not work as expected for large-scale
    learning.


    *   We further extend STRON and use PCG, instead of CG method, to solve the Newton
    system inexactly. We have used weighted average of identity matrix and diagonal
    matrix as the preconditioner. But even this fails to work as expected for large-scale
    learning.


    *   Finally, our empirical experiments prove the efficacy of STRON against existing
    techniques with bench marked datasets.


    ## 7.2  Literature Review


    Stochastic approximation methods are very effective to deal with the large-scale
    learning problems due to their low per-iteration cost, e.g., SGD \[113\], but
    they lead to slow convergence rates due to the noisy approximation. To deal with
    the noise issue, a number of techniques have been proposed and some of the important
    techniques (as discussed in \[34\]) are: (a) decreasing learning rates \[118\],
    (b) using mini-batching \[26\], (c) importance sampling \[34\], and (d) variance
    reduction \[115\]. The variance reduction methods can further be classified into
    three categories: primal methods \[115\], dual methods \[120\] and primal-dual
    methods \[149\]. The variance reduction techniques are effective to deal with
    the large-scale learning problems because of low per-iteration complexity, like
    SGD, and have fast linear convergence, like GD. These techniques exploit the best
    of SGD and GD but for these stochastic variants of first order methods the convergence
    is limited to linear rate only, unlike the second order methods which can give
    up to quadratic rate.


    Second order methods utilize the curvature information to guide the step direction
    towards the solution and exhibit faster convergence than the first order methods.
    But huge per-iteration cost due to the huge Hessian matrix and its inversion make
    the training of models slow for large-scale problems. So, certain techniques have
    been developed to deal with the issues related to Hessian matrix, e.g., quasi-Newton
    methods and inexact Newton methods are two major directions to deal with the huge
    computational cost of Newton method. Quasi-Newton methods approximate the Hessian
    matrix during each iteration, e.g., BFGS \[42\] and its limited memory variant,
    called L-BFGS \[[89](#bib.xhtml#refbib_89)\], are examples of the quasi-Newton
    class which use gradient and parameter values from the previous iterations to
    approximate the Hessian inverse. L-BFGS uses only recent information from previous
    *M*\-iterations. On the other hand, inexact Newton methods try to solve the Newton
    system approximately, e.g., Newton-CG \[124\].


    Recently, several stochastic variants of BFGS and L-BFGS have been proposed to
    deal with large-scale problems. \[[117](#bib.xhtml#refbib_117)\] proposed stochastic
    variants of BFGS and L-BFGS for the online setting, known as oBFGS. \[[98](#bib.xhtml#refbib_98)\]
    extended oBFGS by adding regularization which enforces upper bound on the eigen
    values of the approximate Hessian, known as RES (Regularized Stochastic BFGS).
    Stochastic quasi-Newton (SQN) \[19\] is another stochastic variant of L-BFGS which
    collects curvature information at regular intervals, instead of at each iteration.
    Variance-reduced Stochastic Newton (VITE) \[[91](#bib.xhtml#refbib_91)\] extended
    RES and proposed to use variance reduction for the subsampled gradient values
    for solving smoothly strongly convex problems. \[[69](#bib.xhtml#refbib_69)\]
    provided another stochastic L-BFGS method with variance reduction using SVRG (referred
    as SVRG-LBFGS). \[99\] proposed Stochastic L-BFGS (SLBFGS) using SVRG for variance
    reduction and using Hessian-vector product to approximate the gradient differences
    for calculating the Hessian approximations, also referred as SVRG-SQN. SVRG-LBFGS
    and SVRG-SQN differ in how the curvature is approximated (i.e. how Hessian is
    approximated), former collects the curvature information once during each epoch
    (outer iterations) using gradient differences but later collects the curvature
    information after regular intervals inside the inner-iterations using Hessian-vector
    products. \[[9](#bib.xhtml#refbib_9)\] proposed multi-batch scheme into stochastic
    L-BFGS where batch sample changes with some overlaps with previous iteration.
    \[11\] proposed progressive batching, stochastic line search and stable Newton
    updates for L-BFGS. \[10\] studies the conditions on the subsample sizes to get
    the different convergence rates.


    Stochastic inexact Newton methods are also explored extensively. \[18\] proposed
    stochastic variants of Newton-CG along with L-BFGS method. \[10\] studies subsampled
    Newton methods and find conditions on subsample sizes and forcing term (constant
    used with the residual condition), for linear convergence of Newton-CG method.
    \[8\] studies the effect of forcing term and line search to find linear and super-linear
    convergence of Newton-CG method. Newton-SGI (stochastic gradient iteration) is
    another way of solving the linear system approximately and is studied in \[[3](#bib.xhtml#refbib_3)\].


    Trust Region Newton (TRON) method is one of the most efficient solver for solving
    large-scale linear classification problems \[85\]. This is trust region inexact
    Newton method which does not use any subsampling and is present in LIBLINEAR library
    \[38\]. \[[52](#bib.xhtml#refbib_52)\] extends TRON by improving the trust region
    radius value. \[[51](#bib.xhtml#refbib_51)\] further extends TRON and uses preconditioned
    conjugate gradient (PCG) which uses weighted average of identity matrix and diagonal
    matrix as a preconditioner, to solve the trust region subproblem. Since subsampling
    is an effective way to deal with the large-scale problems so in this chapter,
    we have proposed a stochastic variant of trust region inexact Newton method, which
    have not been studied so far to the best of our knowledge.


    ## 7.3  Trust Region Inexact Newton Method


    Inexact Newton methods, also called as Truncated Newton or Hessian free methods,
    solve the Newton equation (linear system) approximately. CG method is a commonly
    used technique to solve the trust region subproblem approximately. In this section,
    we discuss inexact Newton method and its trust region variation.


    ### 7.3.1  Inexact Newton Method'
