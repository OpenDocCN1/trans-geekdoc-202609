    ## 2.3 Problem Formulations


    Problem formulation is the mathematical representation of the problem under study.
    SVM Classification problem is an optimization problem whose mathematical representation
    consists of an objective function and constraints (if any). Researchers have proposed
    a variety of ideas for SVM classification with different problem formulations.
    The evolution of the SVM is discussed in the following subsections[¹](#fn1)


    ### 2.3.1 Hard Margin SVM (1992)


    Although the concepts like hyperplane, optimal margin and Kernels are in use for
    several decades but \[12\] are the first to formulate SVM in its current form.
    This SVM is a binary classifier which can work with only linearly separable data
    applications and presence of any noise or outliers strongly affects the margin.
    It does not allow mis-classification errors, that''s why it is known as hard margin
    SVM. Hard margin SVM is represented by the Fig. 1.1.

