  trans: '


    技术的进步和数据源的可用性导致了数据爆炸。经典技术无法处理如此大量的数据，因此提出了“大数据”这一术语，其主要由三个“V”特征所描述：体量（volume）、速度（velocity）和多样性（variety）。当我们在机器学习中考虑大数据的体量方面时，该问题被称为大规模学习问题或大数据问题，其拥有大量的数据点或大量的特征或两者兼具。一方面，这些大量数据有潜力发现更精细的模式，做出及时且准确的决策；另一方面，它在理解这些数据方面带来了许多挑战，例如模型训练缓慢和可扩展性等。因此，机器学习中的一大挑战是开发高效且可扩展的学习算法来应对大数据挑战，即解决大规模学习问题。


    随机近似和坐标下降方法是应对大数据挑战的非常有效的技术。随机近似通过随机选择一个或一个小批量数据点，使学习算法的每次迭代与数据点数量无关；另一方面，坐标下降方法通过选择一个或一组特征作为变量，其余作为常数，使每次迭代与特征数量无关。为了应对大数据挑战，我们结合了随机近似和坐标下降方法的优点，开发了批量块优化框架（`BBOF`），并将该框架与一阶和二阶方法结合使用。`BBOF`
    采样一个小批量数据点和一组特征，并构建一个可以使用适当方法轻松求解的缩减子问题。


    我们提出了随机平均调整梯度（`SAAG-I` 和 `II`）以及小批量块坐标牛顿（`MBN`）方法来与 `BBOF` 协同工作。`SAAG-I` 和 `II`
    是方差减小技术，用于使用一阶方法求解大规模问题。`MBN` 也旨在通过降低牛顿方法每次迭代的复杂度来求解大规模问题。但需要注意的是，随机近似和坐标下降方法并不适合一起使用。这是因为在
    `BBOF` 下同时使用它们的优势，会被由于对数据和特征进行双重采样而产生的实现开销所抵消。我们进一步将 `SAAG-I` 和 `II` 分别扩展到 `SAAG-III`
    和 `IV`，仅使用随机近似作为方差减小技术来处理大规模学习问题。`SAAG-III` 和 `IV` 基于迭代平均，与 `SAAG-I` 不同，`SAAG-III`
    中的起点设置为上一时代的平均值；与 `SAAG-II` 不同，`SAAG-IV` 中的快照点和起点分别设置为上一时代的平均值和最后一次迭代值。


    模型的训练时间取决于两个因素：访问数据的时间和从数据中学习的时间。在我们的工作之前，很少有人关注数据访问部分，研究的全部重点都放在开发从数据中学习的技术上。我们提出了系统性和顺序性采样技术，用于采样数据的小批量，通过减少数据访问时间来降低模型的训练时间。这些技术基于内存的连续访问，其速度快于随机采样中的分散数据访问。我们能够使模型的训练速度提高多达六倍。该想法基于数据访问，因此与所考虑的问题和用于求解该问题的方法无关。


    基于一阶方法的技术仅限于线性收敛，远远落后于二阶方法（如牛顿法）提供的二次收敛率。因此，我们提出了随机信赖域牛顿方法（`STRON`），它使用共轭梯度法来求解信赖域子问题。它在梯度和海森矩阵计算中引入了子采样，并使用渐进批量采样来同时利用随机模式和批量模式的优势。我们还扩展了
    `STRON`，使用预条件共轭梯度法来求解信赖域子问题。


    因此，本书进行了全面的文献综述以描述大数据挑战，并列出了应对该挑战的领域和当前的研究方向。此外，本书提供了使用一阶和二阶方法解决大数据挑战的方案，并提出了
    `SAAGs`（`I`、`II`、`III` 和 `IV`）、`MBN`、`STRON` 以及简单的采样技术。


    # I______ 背景


    # 第 1 章 简介


    DOI: [10.1201/9781003240167-1](http://doi.org/10.1201/9781003240167-1)


    人工智能（`AI`），有时也称为机器智能，是计算机科学的一个分支，涉及研究和开发像人类一样智能的机器。`AI` 是一个热门词汇，一些关于 `AI` 的流行观点强调了其重要性，例如，“`AI`
    是未来”和“`AI` 是新的电力”等。`AI` 包含多个组件/子领域，如知识表示、推理/推断和模式识别等，机器学习是其中之一，也是一个重要的子领域。


    机器学习是一个非常有趣的领域，机器通过示例（即数据）来学习执行某些任务。这与传统编程不同，传统编程中我们需要为机器要执行的任务编写逻辑。在机器学习中，我们只需要编程学习算法，而不需要编程执行任务的逻辑。因此，机器学习在某些情况下非常重要，例如执行涉及数百万个变量的复杂任务（这对人类来说可能难以编码）以及执行无法得知解决问题的确切算法的任务。从技术上讲，机器学习是一个跨学科领域，汲取了优化、概率、代数、统计学、神经科学和心理学等领域的贡献。


    机器学习是学术界的热门研究课题，也是工业界最常被提及的术语。它已被应用于不同领域来解决复杂和具有挑战性的问题，从医学、物理学、化学、工程到文化问题等。工业界正在大力投资机器学习，如今，无论有意还是无意，我们每个人在日常生活中都在使用机器学习。Gmail
    中的垃圾邮件分类、亚马逊的 Alexa、苹果的 Siri、微软的 Cortana、Google 助手、Facebook 上对自己和朋友面部的自动标记以及在线购物中的产品推荐等，都基于机器学习。最近，Gmail
    引入了一项在撰写邮件时自动补全的新功能，这同样基于机器学习。


    机器学习有不同的类型：监督学习、无监督学习、半监督学习和强化学习。在监督学习中，机器获得输入和输出（目标）值对，例如分类和回归问题。无监督学习仅涉及输入，机器将相似的输入分组，例如聚类。半监督学习是监督学习和无监督学习的结合。在强化学习中，机器与其环境交互，并因其行为获得奖励。机器学习有多种问题，如分类、回归、聚类和排序等。


    从数学上讲，机器学习问题是数据密集型优化问题，在这项工作中，我们提出了几种优化技术来求解大规模线性分类问题。


    接下来，定义本书中使用的主要技术术语。


    ## 1.1 大规模机器学习


