    ```


    其中 `x[1]` 和 `x[2]` 表示数据点，`K` 表示核函数。


    ## 2.3 问题公式


    问题公式是研究问题的数学表示。SVM 分类问题是一个优化问题，其数学表示由目标函数和约束（如果有）组成。研究人员针对具有不同问题公式的 SVM 分类提出了各种想法。SVM
    的演变将在以下小节中讨论¹


    ### 2.3.1 硬间隔 SVM（1992）


    虽然超平面、最优间隔和核等概念已使用数十年，但 \[12] 是第一个以当前形式公式化 SVM 的。这种 SVM 是一个二分类器，只能处理线性可分的数据应用，任何噪声或异常值的存在都会强烈影响间隔。它不允许误分类错误，这就是为什么它被称为硬间隔
    SVM。硬间隔 SVM 由图 1.1 表示。


