    \ from the literature and from our experimental study.\n\n### 2.5.1  Results from\
    \ Literature\n\nAccording to literature, LIBLINEAR \\[38\\], Pegasos \\[118\\\
    ] and SVM^(perf)\\[[62](#bib.xhtml#refbib_62)\\] are the state of the art solvers\
    \ with LIBLINEAR being the most efficient \\[38\\], popular and widely used. LIBLINEAR\
    \ uses TRON (Trust Region Newton method, \\[85\\]) to solve L2 regularized L2\
    \ loss primal SVM, PCD (Primal Coordinate Descent, \\[22\\]) to solve L1 regularized\
    \ L2 loss primal SVM and DCD (Dual Coordinate Descent, \\[53\\]) algorithm to\
    \ solve L2-regularized L1- and L2-loss dual SVM. SVM^(perf) uses cutting plane\
    \ technique to solve L2-regularized L1-loss primal SVM, and Pegasos uses an algorithm\
    \ which alternates between gradient descent steps and projection steps to solve\
    \ L2-regularized L1-loss primal SVM. The comparisons of these state of the art\
    \ solvers have been presented in the Fig. 1 of [Section 4](#11part_04.xhtml) in\
    \ \\[38\\] (refer to latest version), which compares training time against testing\
    \ accuracy for different linear solvers. Recently, \\[101\\] have proposed an\
    \ SVM-ALM (Augmented Lagrange Multipliers) algorithm to solve L2-regularized L1-,\
    \ L2- and L*p* norm loss primal problem with linear computational cost, to tackle\
    \ the big data challenge. SVM-ALM is faster than LIBLINEAR, and experimental results\
    \ are reported in Table 1 and 2 of Section 4 in \\[101\\]. SVM-ALM uses gradient\
    \ descent method for finding step direction and exact line search for finding\
    \ the step size. The beauty of SVM-ALM algorithm is in transforming the L*p* loss\
    \ primal SVM problem using Augmented Lagrange Multipliers into a form which is\
    \ very easy to solve. This highlights the point that it is not only a method but\
    \ many other factors (refer to beginning of [Section 2.4](#03chap_02.xhtml#sec2_4)\
    \ for such factors) which make an algorithm efficient.\n\n### 2.5.2  Results from\
    \ Experimental Study\n\n#### 2.5.2.1 Experimental Setup and Implementation Details\n\
    \nThe experiments have been performed on two datasets, namely, mushroom and rcv1,\
    \ on single node MacBook Air (8 GB 1600 MHz DDR3, 1.6 GHz Intel Core i5, 256 SSD).\
    \ Each dataset has been divided randomly into 80% and 20% for training data and\
    \ test data, respectively. The experiments compare seven prominent variants of\
    \ SVM, named, Soft SVM, Smooth SVM, Least Squares SVM, Twin SVM, E*ν*\\-SVM, Proximal\
    \ SVM and Capped SVM, using two criteria of test accuracy versus epochs (one epoch\
    \ refers to one pass through the dataset) and test accuracy versus training time\
    \ (in seconds). For fair comparison, primal formulation of SVMs have been solved\
    \ using same algorithmic structure/framework with differences only in the problem\
    \ formulations and corresponding gradient values. The training algorithm uses\
    \ mini-batch SGD (Stochastic Gradient Descent) method \\[[148](#bib.xhtml#refbib_148)\\\
    ] to determine the step direction with decreasing step size, determined by *d*[0]/(1 + *d*[0]*C**k*),\
    \ for the *k*^(*t**h*) epoch with initial step size *d*[0] and regularization\
    \ parameter *C*. The training algorithm uses mini-batch size of five randomly\
    \ selected data points. The problem formulations for each SVM uses squared slack\
    \ variable, i.e., squared error for fair comparison, e.g., using L2-loss in Soft\
    \ SVM instead of L1-loss. Further, regularization parameter (*C*) has been set\
    \ to 0.1 for all the C-SVMs, including both subproblems of Twin SVM and parameter\
    \ *ν* has been set to 0.06 (mushroom) and 0.006 (rcv1.binary) for *ν*\\-SVM. For\
    \ Smooth SVM, the smoothing parameter (*α*) has been set to five and for Capped\
    \ l*p* norm SVM, *p* is set to two and capping value *ϵ* is set to one. Since\
    \ Twin SVM has two subproblems so the training time and epochs for Twin SVM has\
    \ been taken as the sum of time and sum of epochs taken by subproblems, respectively.\n\
    \n#### 2.5.2.2 Results and Discussions\n\nFirst, this is to be noted that there\
    \ are several challenges in comparative study of different SVMs and they are:\
    \ (a) different scope and applications areas of different SVMs, e.g., SloppySVM\
    \ is useful for applications where data is sloppily labeled; Transductive SVM\
    \ is specifically proposed for text classification problems; Fuzzy SVM and CappedSVM\
    \ are suitable for applications where data contains noise and data outliers; Structured\
    \ SVM is useful for applications where the output labels are structured like strings;\
    \ MVSVM and MTSVM are used for multi-view learning and multi-task learning, respectively,\
    \ etc.; (b) Direct improvements of one over other, e.g., Soft SVM is an improvement\
    \ over Hard SVM, E*ν*\\-SVM is an improvement over *ν*\\-SVM etc.; (c) Binary\
    \ and multi-class data, e.g., Soft SVM, Least Square SVM and Smooth SVM are mainly\
    \ binary classifiers which have been extended to multi-class data using one-vs-one,\
    \ one-vs-all etc.; and (d) every problem can't be solved using every solver. One\
    \ interesting point about solving a specific SVM problem formulation is that being\
    \ an optimization problem, each problem can be solved using a number of methods.\
    \ Different factors play role in the selection of a solver for a specific SVM,\
    \ as discussed at the beginning of [Section 2.4](#03chap_02.xhtml#sec2_4). Thus,\
    \ only prominent variants of binary primal SVMs have been studied experimentally\
    \ using mini-batch SGD method. For the comparative study of multi-class SVMs,\
    \ refer to Tables V.2 to V.4 of Section V in \\[[55](#bib.xhtml#refbib_55)\\].\
    \ One another interesting point is that from the experimental results, we can't\
    \ generalize that a particular SVM is the best. This is as per the ‘no free lunch’\
    \ theorem, and the point that there are several trade-offs and factors (see, [Section 2.4](#03chap_02.xhtml#sec2_4))\
    \ that we have to be considered while solving SVMs.\n\nThe experimental results[²](#fn2)\
