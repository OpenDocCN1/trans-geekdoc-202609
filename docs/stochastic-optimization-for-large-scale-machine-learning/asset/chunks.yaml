- raw: "[**Chapter 7**](#10chap_07.xhtml): In this chapter, we have proposed a novel\
    \ **s**tochastic **t**rust **r**egi**o**n inexact **N**ewton method, called as\
    \ STRON, which uses conjugate gradient (CG) to solve trust region subproblem.\
    \ The method uses progressive subsampling in the calculation of gradient and Hessian\
    \ values to take the advantage of both stochastic approximation and full batch\
    \ regimes \\[[29](#bib.xhtml#refbib_29)\\].\n\n**[PART IV](#11part_04.xhtml) CONCLUSION**\n\
    \nThis part has one chapter which provides the concluding remarks.\n\n[**Chapter\
    \ 8**](#12chap_08.xhtml): This chapter concludes the research work and provides\
    \ possible future extensions of the current work.\n\n# Chapter 2 Optimization\
    \ Problem, Solvers, Challenges and Research Directions\n\nDOI: [10.1201/9781003240167-2](http://doi.org/10.1201/9781003240167-2)\n\
    \nBehind the scenes, machine learning problems are actually optimization problems.\
    \ So, optimization problem formulation and selection of appropriate solvers are\
    \ very important for the final performance of machine learning models. We take\
    \ the example of SVM to illustrate that how a problem can be formulated in multiple\
    \ ways and how each formulation can be solved using multiple solvers. SVM is a\
    \ binary linear classifier which has been extended to non-linear data using Kernels\
    \ and multi-class data using various techniques like one-versus-one, one-versus-rest\
    \ and Crammer Singer SVM, etc. SVM with a linear Kernel is called linear SVM and\
    \ one with a non-linear Kernel is called non-linear SVM. Linear SVM is an efficient\
    \ technique for high dimensional data applications like document classification,\
    \ word-sense disambiguation, drug design, etc., because under such data applications,\
    \ test accuracy of linear SVM is closer to non-linear SVM while its training is\
    \ much faster than non-linear SVM. SVM is continuously evolving since its inception\
    \ and researchers have proposed many problem formulations, solvers and strategies\
    \ for solving SVM. Moreover, due to advancements in the technology, data has taken\
    \ the form of ‘Big Data’ which have posed a challenge for machine learning to\
    \ train a classifier on this large-scale data. In this chapter, we have presented\
    \ a review on evolution of linear Support Vector Machine classification, its solvers,\
    \ strategies to improve solvers, experimental results, current challenges and\
    \ research directions.\n\n## 2.1 Introduction\n\nPlease refer to [Section 1.3.1](#02chap_01.xhtml#sec1_3_1)\
    \ for basic introduction of SVM. Linear SVM involves problem formulations, solvers\
    \ to solve the problem and optimization strategies to make the solvers efficient.\
    \ Generally, SVM problem is formulated as a convex problem \\[[33](#bib.xhtml#refbib_33),\
    \ [31](#bib.xhtml#refbib_31)\\] because there is no issue of local optimum in\
    \ convex problems as every local optimum is a global optimum. In formulating the\
    \ problem, commonly L1 (∥*w*∥) and L2 regularization (∥*w*∥²), L1 and L2 loss\
    \ functions are used which are given below. So, considering L1 and L2 regularization,\
    \ L1 and L2 loss functions and linear Kernel, there are eight different formulations\
    \ for linear SVM as depicted in [Fig. 2.1](#03chap_02.xhtml#f2_1), which indicates\
    \ the diverse range of possible problem formulations. L1 and L2 loss functions\
    \ for parameter vector *w* and data point (*x*[*i*],*y*[*i*]) are given below:\n\
    \n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\text{L1-loss:}\\\\quad\\\\max(0,1\
    \ - y\\_{i}w^{T}x\\_{i}),\\\\quad\\\\text{L2-loss~:}\\\\quad\\\\left\\\\lbrack\
    \ {\\\\max(0,1 - y\\_{i}w^{T}x\\_{i})} \\\\right\\\\rbrack^{2}} \\\\\\\\ \\\\\
    end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.1)\n\n![FIGURE 2.1 Eight different\
    \ problem formulations for the Linear SVM with L1-regularized (L1R), L2-regularized\
    \ (L2R), L1 loss and L2 loss functions.](Images/fig2_1.jpg)\n\nFIGURE 2.1 Eight\
    \ different problem formulations for the Linear SVM with L1-regularized (L1R),\
    \ L2-regularized (L2R), L1 loss and L2 loss functions.\n\nFor a particular SVM\
    \ either primal or dual problems can be solved. Generally, when number of features\
    \ (*n*) are much less than number of training points (*l*) then primal formulations\
    \ of SVM \\[[85](#bib.xhtml#refbib_85)\\] are solved otherwise dual formulations\
    \ \\[[53](#bib.xhtml#refbib_53)\\] are solved. This is because lesser the number\
    \ of variables in the problem easier is the problem to solve.\n\nNowadays, major\
    \ challenge in SVM (which is shared with machine learning) is to deal with ‘Big\
    \ Data’ problems and to handle such problems researchers are trying to exploit\
    \ the platform/framework structures (like parallel and distributed computing)\
    \ and proposing new problem formulations, solvers, optimization strategies and\
    \ algorithms etc. The current research directions for handling big data problems\
    \ in machine learning are: First, stochastic approximation algorithms \\[[63](#bib.xhtml#refbib_63),\
    \ [71](#bib.xhtml#refbib_71), [35](#bib.xhtml#refbib_35), [115](#bib.xhtml#refbib_115)\\\
    ] which makes the learning algorithm scalable by removing the dependency of algorithm\
    \ over number of data points by using only one data point during each iteration\
    \ of the algorithm. Several variations of stochastic approximation, like mini-batch\
    \ approach \\[[128](#bib.xhtml#refbib_128), [119](#bib.xhtml#refbib_119)\\], have\
    \ been proposed during last five years. Second, coordinate descent algorithms\
    \ \\[[130](#bib.xhtml#refbib_130), [100](#bib.xhtml#refbib_100), [6](#bib.xhtml#refbib_6),\
    \ [112](#bib.xhtml#refbib_112), 137, [90](#bib.xhtml#refbib_90), [122](#bib.xhtml#refbib_122)\\\
    ] which reduce large problem into a smaller subproblem by taking one feature as\
    \ a variable and rest as constants. Extensive research has been done in this direction\
    \ during last few years and researcher have proposed its several variations. Third,\
    \ proximal algorithms \\[[104](#bib.xhtml#refbib_104)\\] which are used with first\
    \ and second order methods. These algorithms are applicable to non-smooth problems\
    \ with separable components. Fourth, parallel and distributed computing \\[[141](#bib.xhtml#refbib_141)\\\
    ] which exploits the computing resources. Nowadays, a lot of research is going\
    \ in parallel and distributed computing since dataset sizes are going beyond the\
    \ capacity of single computer and other approaches seem to be saturated. In addition\
    \ to these research directions, their hybrid versions are also being studied very\
    \ extensively, e.g., \\[[140](#bib.xhtml#refbib_140), 23\\].\n\nChapter Organization:\
    \ [Section 2.2](#03chap_02.xhtml#sec2_2) discusses literature, [Section 2.3](#03chap_02.xhtml#sec2_3)\
    \ discusses evolution of linear SVM problem formulations and [Section 2.4](#03chap_02.xhtml#sec2_4)\
    \ discusses problem solvers for SVM. [Section 2.5](#03chap_02.xhtml#sec2_5) presents\
    \ comparative study, [Section 2.6](#03chap_02.xhtml#sec2_6) presents big data\
    \ challenge, areas of improvement to tackle big data problems and research directions\
    \ for linear SVM and [Section 2.7](#03chap_02.xhtml#sec2_7) presents the concluding\
    \ remarks.\n\nNotations:  < ⋅,⋅> denotes dot product, ∀ means for all, *x*[*i*] ∈ ℝ^(*n*)\
    \ denotes a training instance with *n* features and *i* = 1, 2, ..., *l* where\
    \ *l* denotes the number of training points. *y*[*i*] ∈ {−1,+1} denotes the labels\
    \ of training instances. *m* ∈ ℝ is used to denote the number of classes. *w* ∈ ℝ^(*n*)\
    \ and *b* ∈ ℝ denote the parameters of the objective function. *ξ* denotes the\
    \ slack variable, *C* denotes the penalty parameter, ∥ ⋅ ∥ denotes Euclidean norm,\
    \ **1** denotes a unit vector of arbitrary dimension and *α* denotes vector of\
    \ dual variables.\n\n### 2.1.1  Contributions\n\nThe contributions of the chapter\
    \ are listed below:\n\n*   We have discussed different problem formulations, i.e.,\
    \ optimization problems for SVM and some general solvers for solving the optimization\
    \ problem.\n\n*   The big data challenge in machine learning has been characterized\
    \ which highlights the need to develop efficient and scalable optimization techniques\
    \ to tackle the challenge."
  fmt: "\n# Chapter 2 Optimization Problem, Solvers, Challenges and Research Directions\n\
    \nDOI: [10.1201/9781003240167-2](http://doi.org/10.1201/9781003240167-2)\n\nBehind\
    \ the scenes, machine learning problems are actually optimization problems. So,\
    \ optimization problem formulation and selection of appropriate solvers are very\
    \ important for the final performance of machine learning models. We take the\
    \ example of SVM to illustrate that how a problem can be formulated in multiple\
    \ ways and how each formulation can be solved using multiple solvers. SVM is a\
    \ binary linear classifier which has been extended to non-linear data using Kernels\
    \ and multi-class data using various techniques like one-versus-one, one-versus-rest\
    \ and Crammer Singer SVM, etc. SVM with a linear Kernel is called linear SVM and\
    \ one with a non-linear Kernel is called non-linear SVM. Linear SVM is an efficient\
    \ technique for high dimensional data applications like document classification,\
    \ word-sense disambiguation, drug design, etc., because under such data applications,\
    \ test accuracy of linear SVM is closer to non-linear SVM while its training is\
    \ much faster than non-linear SVM. SVM is continuously evolving since its inception\
    \ and researchers have proposed many problem formulations, solvers and strategies\
    \ for solving SVM. Moreover, due to advancements in the technology, data has taken\
    \ the form of ‘Big Data’ which have posed a challenge for machine learning to\
    \ train a classifier on this large-scale data. In this chapter, we have presented\
    \ a review on evolution of linear Support Vector Machine classification, its solvers,\
    \ strategies to improve solvers, experimental results, current challenges and\
    \ research directions.\n\n## 2.1 Introduction\n\nPlease refer to [Section 1.3.1](#02chap_01.xhtml#sec1_3_1)\
    \ for basic introduction of SVM. Linear SVM involves problem formulations, solvers\
    \ to solve the problem and optimization strategies to make the solvers efficient.\
    \ Generally, SVM problem is formulated as a convex problem \\[[33](#bib.xhtml#refbib_33),\
    \ [31](#bib.xhtml#refbib_31)\\] because there is no issue of local optimum in\
    \ convex problems as every local optimum is a global optimum. In formulating the\
    \ problem, commonly L1 (`∥w∥`) and L2 regularization (`∥w∥²`), L1 and L2 loss\
    \ functions are used which are given below. So, considering L1 and L2 regularization,\
    \ L1 and L2 loss functions and linear Kernel, there are eight different formulations\
    \ for linear SVM as depicted in [Fig. 2.1](#03chap_02.xhtml#f2_1), which indicates\
    \ the diverse range of possible problem formulations. L1 and L2 loss functions\
    \ for parameter vector `w` and data point (`x[i]`, `y[i]`) are given below:\n\n\
    $$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\text{L1-loss:}\\\\quad\\\\max(0,1\
    \ - y\\_{i}w^{T}x\\_{i}),\\\\quad\\\\text{L2-loss~:}\\\\quad\\\\left\\\\lbrack\
    \ {\\\\max(0,1 - y\\_{i}w^{T}x\\_{i})} \\\\right\\\\rbrack^{2}} \\\\\\\\ \\\\\
    end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.1)\n\n![FIGURE 2.1 Eight different\
    \ problem formulations for the Linear SVM with L1-regularized (L1R), L2-regularized\
    \ (L2R), L1 loss and L2 loss functions.](Images/fig2_1.jpg)\n\nFIGURE 2.1 Eight\
    \ different problem formulations for the Linear SVM with L1-regularized (L1R),\
    \ L2-regularized (L2R), L1 loss and L2 loss functions.\n\nFor a particular SVM\
    \ either primal or dual problems can be solved. Generally, when number of features\
    \ (`n`) are much less than number of training points (`l`) then primal formulations\
    \ of SVM \\[[85](#bib.xhtml#refbib_85)\\] are solved otherwise dual formulations\
    \ \\[[53](#bib.xhtml#refbib_53)\\] are solved. This is because lesser the number\
    \ of variables in the problem easier is the problem to solve.\n\nNowadays, major\
    \ challenge in SVM (which is shared with machine learning) is to deal with ‘Big\
    \ Data’ problems and to handle such problems researchers are trying to exploit\
    \ the platform/framework structures (like parallel and distributed computing)\
    \ and proposing new problem formulations, solvers, optimization strategies and\
    \ algorithms etc. The current research directions for handling big data problems\
    \ in machine learning are: First, stochastic approximation algorithms \\[[63](#bib.xhtml#refbib_63),\
    \ [71](#bib.xhtml#refbib_71), [35](#bib.xhtml#refbib_35), [115](#bib.xhtml#refbib_115)\\\
    ] which makes the learning algorithm scalable by removing the dependency of algorithm\
    \ over number of data points by using only one data point during each iteration\
    \ of the algorithm. Several variations of stochastic approximation, like mini-batch\
    \ approach \\[[128](#bib.xhtml#refbib_128), [119](#bib.xhtml#refbib_119)\\], have\
    \ been proposed during last five years. Second, coordinate descent algorithms\
    \ \\[[130](#bib.xhtml#refbib_130), [100](#bib.xhtml#refbib_100), [6](#bib.xhtml#refbib_6),\
    \ [112](#bib.xhtml#refbib_112), 137, [90](#bib.xhtml#refbib_90), [122](#bib.xhtml#refbib_122)\\\
    ] which reduce large problem into a smaller subproblem by taking one feature as\
    \ a variable and rest as constants. Extensive research has been done in this direction\
    \ during last few years and researcher have proposed its several variations. Third,\
    \ proximal algorithms \\[[104](#bib.xhtml#refbib_104)\\] which are used with first\
    \ and second order methods. These algorithms are applicable to non-smooth problems\
    \ with separable components. Fourth, parallel and distributed computing \\[[141](#bib.xhtml#refbib_141)\\\
    ] which exploits the computing resources. Nowadays, a lot of research is going\
    \ in parallel and distributed computing since dataset sizes are going beyond the\
    \ capacity of single computer and other approaches seem to be saturated. In addition\
    \ to these research directions, their hybrid versions are also being studied very\
    \ extensively, e.g., \\[[140](#bib.xhtml#refbib_140), 23\\].\n\nChapter Organization:\
    \ [Section 2.2](#03chap_02.xhtml#sec2_2) discusses literature, [Section 2.3](#03chap_02.xhtml#sec2_3)\
    \ discusses evolution of linear SVM problem formulations and [Section 2.4](#03chap_02.xhtml#sec2_4)\
    \ discusses problem solvers for SVM. [Section 2.5](#03chap_02.xhtml#sec2_5) presents\
    \ comparative study, [Section 2.6](#03chap_02.xhtml#sec2_6) presents big data\
    \ challenge, areas of improvement to tackle big data problems and research directions\
    \ for linear SVM and [Section 2.7](#03chap_02.xhtml#sec2_7) presents the concluding\
    \ remarks.\n\nNotations: `<⋅,⋅>` denotes dot product, ∀ means for all, `x[i] ∈\
    \ ℝ^(n)` denotes a training instance with `n` features and `i = 1, 2, ..., l`\
    \ where `l` denotes the number of training points. `y[i] ∈ {−1,+1}` denotes the\
    \ labels of training instances. `m ∈ ℝ` is used to denote the number of classes.\
    \ `w ∈ ℝ^(n)` and `b ∈ ℝ` denote the parameters of the objective function. `ξ`\
    \ denotes the slack variable, `C` denotes the penalty parameter, `∥⋅∥` denotes\
    \ Euclidean norm, `1` denotes a unit vector of arbitrary dimension and `α` denotes\
    \ vector of dual variables.\n\n### 2.1.1 Contributions\n\nThe contributions of\
    \ the chapter are listed below:\n\n*   We have discussed different problem formulations,\
    \ i.e., optimization problems for SVM and some general solvers for solving the\
    \ optimization problem.\n\n*   The big data challenge in machine learning has\
    \ been characterized which highlights the need to develop efficient and scalable\
    \ optimization techniques to tackle the challenge.\n"
  trans: "\n\n# 第 2 章 优化问题、求解器、挑战与研究方向\n\nDOI: [10.1201/9781003240167-2](http://doi.org/10.1201/9781003240167-2)\n\
    \n幕后，机器学习问题实际上是优化问题。因此，优化问题的表述和选择合适的求解器对于机器学习模型的最终性能至关重要。我们以 SVM 为例，说明一个问题可以以多种方式表述，以及每种表述如何使用多种求解器来求解。SVM\
    \ 是一种二元线性分类器，已通过核函数扩展到非线性数据，并通过一对一、一对其余和 Crammer Singer SVM 等各种技术扩展到多类数据。带有线性核的\
    \ SVM 称为线性 SVM，带有非线性核的 SVM 称为非线性 SVM。线性 SVM 是一种高效的技术，适用于文档分类、词义消歧、药物设计等高维数据应用，因为在这些数据应用中，线性\
    \ SVM 的测试精度接近非线性 SVM，而其训练速度远快于非线性 SVM。自诞生以来，SVM 不断发展，研究人员提出了许多用于求解 SVM 的问题表述、求解器和策略。此外，由于技术的进步，数据已呈现为“大数据”形式，这给机器学习在大规模数据上训练分类器带来了挑战。在本章中，我们对线性支持向量机分类的演进、其求解器、改进求解器的策略、实验结果、当前挑战和研究方向进行了综述。\n\
    \n## 2.1 引言\n\n有关 SVM 的基本介绍，请参阅 第 1.3.1 节。线性 SVM 涉及问题表述、求解问题的求解器以及使求解器高效的优化策略。通常，SVM\
    \ 问题表述为凸问题 \\[33, 31]，因为凸问题中不存在局部最优问题，因为每个局部最优都是全局最优。在表述问题时，通常使用 L1 (`∥w∥`) 和\
    \ L2 正则化 (`∥w∥²`)、L1 和 L2 损失函数，如下所示。因此，考虑 L1 和 L2 正则化、L1 和 L2 损失函数以及线性核，线性 SVM\
    \ 有八种不同的表述，如 图 2.1 所示，这表明了可能的问题表述范围很广。参数向量 `w` 和数据点 (`x[i]`, `y[i]`) 的 L1 和 L2\
    \ 损失函数如下：\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\text{L1-loss:}\\\\\
    quad\\\\max(0,1 - y\\_{i}w^{T}x\\_{i}),\\\\quad\\\\text{L2-loss~:}\\\\quad\\\\\
    left\\\\lbrack {\\\\max(0,1 - y\\_{i}w^{T}x\\_{i})} \\\\right\\\\rbrack^{2}} \\\
    \\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.1)\n\n![FIGURE 2.1 Eight\
    \ different problem formulations for the Linear SVM with L1-regularized (L1R),\
    \ L2-regularized (L2R), L1 loss and L2 loss functions.](img/fig2_1.jpg)\n\nFIGURE\
    \ 2.1 Eight different problem formulations for the Linear SVM with L1-regularized\
    \ (L1R), L2-regularized (L2R), L1 loss and L2 loss functions.\n\n对于特定的 SVM，可以求解原始问题或对偶问题。通常，当特征数量\
    \ (`n`) 远少于训练点数量 (`l`) 时，求解 SVM 的原始表述 \\[85]; 否则，求解对偶表述 \\[53]。这是因为问题中的变量越少，问题越容易求解。\n\
    \n如今，SVM（与机器学习共享）的主要挑战是处理“大数据”问题，为了处理此类问题，研究人员正在尝试利用平台/框架结构（如并行和分布式计算），并提出新的问题表述、求解器、优化策略和算法等。机器学习中处理大数据问题的当前研究方向是：首先，随机近似算法\
    \ \\[63, 71, 35, 115]，它通过在算法的每次迭代中仅使用一个数据点，消除了算法对数据点数量的依赖，从而使学习算法具有可扩展性。在过去五年中，提出了多种随机近似变体，例如小批量方法\
    \ \\[128, 119]。其次，坐标下降算法 \\[130, 100, 6, 112, 137, 90, 122]，它通过将一个特征作为变量，其余作为常数，将大问题减小为较小的子问题。在过去几年中，在这个方向上进行了大量研究，研究人员提出了其多种变体。第三，近端算法\
    \ \\[104]，用于一阶和二阶方法。这些算法适用于具有可分组件的非光滑问题。第四，并行和分布式计算 \\[141]，它利用计算资源。如今，由于数据集大小超出了单台计算机的容量，其他方法似乎已趋于饱和，因此在并行和分布式计算方面进行了大量研究。除了这些研究方向外，它们的混合版本也正在被广泛研究，例如，\\\
    [140, 23]。\n\n章节组织：第 2.2 节 讨论文献，第 2.3 节 讨论线性 SVM 问题表述的演进，第 2.4 节 讨论 SVM 的问题求解器。第\
    \ 2.5 节 提出比较研究，第 2.6 节 提出大数据挑战、解决大数据问题的改进领域以及线性 SVM 的研究方向，第 2.7 节 提出结论性意见。\n\n\
    符号：`<⋅,⋅>` 表示点积，∀ 表示对所有，`x[i] ∈ ℝ^(n)` 表示具有 `n` 个特征的训练实例，其中 `i = 1, 2, ..., l`，`l`\
    \ 表示训练点的数量。`y[i] ∈ {−1,+1}` 表示训练实例的标签。`m ∈ ℝ` 用于表示类别的数量。`w ∈ ℝ^(n)` 和 `b ∈ ℝ`\
    \ 表示目标函数的参数。`ξ` 表示松弛变量，`C` 表示惩罚参数，`∥⋅∥` 表示欧几里得范数，`1` 表示任意维度的单位向量，`α` 表示对偶变量向量。\n\
    \n### 2.1.1 贡献\n\n本章的贡献如下：\n\n*   我们讨论了不同的问题表述，即 SVM 的优化问题以及求解优化问题的一些通用求解器。\n\n\
    *   机器学习中的大数据挑战已得到表征，这突出了开发高效且可扩展的优化技术来应对该挑战的必要性。\n\n"
