    \ 23\\]), which uses one data point or mini-batch of data points during each iteration.\
    \ The reduced subproblem with mini-batch *B*[*j*] of data points for *j*^(*t**h*)\
    \ inner iteration is given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\
    \\underset{w}{\\\\min}\\\\,\\\\,\\\\frac{1}{\\\\left| B\\_{j} \\\\right|}{\\\\\
    sum\\\\limits\\_{i \\\\in B\\_{j}}f\\_{i}}(w) + \\\\frac{C}{2}\\\\| w\\\\|^{2},\\\
    \\quad j = 1,2,...,m.} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n\
    (5.3)\n\nThe iteration complexity for solving this reduced subproblem is *O*(*n*)\
    \ (for one data point) or *O*(*n*|*B*[*j*]|) (for mini-batch of data points) where\
    \ |*B*[*j*]| is the size of mini-batch, which is very low and independent of *l*.\
    \ Since it is easier to solve the problem (5.3) and this is widely used approach\
    \ to handle large-scale problems so the chapter uses this reduced subproblem approach.\n\
