    ## 3.5 Conclusion and Future Scope


    In this chapter, Mini-batch and block-coordinate setting, i.e., a combination
    of stochastic approximation and coordinate descent approaches, has been proposed
    as scalable optimization framework, namely, BBOF, independent of any solver, for
    solving big data problems. But it is observed that the stochastic approximation
    and coordinate descent, do not work well when combined together because the advantage
    is lost in extra overhead to implement batch block optimization framework. BBOF
    has been discussed with Gradient Descent as a solver and two novel variance reduction
    methods (SAAG-I and SAAG-II) have been proposed and used to solve strongly convex
    and smooth problems. Theoretical results prove linear convergence and empirical
    results with bench marked datasets prove faster convergence for the proposed methods
    than existing methods of variance reduction. BBOF and SAAG can be extended to
    parallel and distributed settings, and to non-convex problems. In addition, there
    is scope for improving the theoretical properties of proposed variance reduction
    methods.


