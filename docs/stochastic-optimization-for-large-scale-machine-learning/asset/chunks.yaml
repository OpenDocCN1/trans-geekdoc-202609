- raw: "4.  Problem Shrinking Strategy:\n\n    While optimizing different variables\
    \ (parameters), it is observed that some of the variables does not change or remain\
    \ zero. Such variables can be left from the optimization process until rest of\
    \ the variables reach their approximate optimum values. This is called shrinking\
    \ strategy \\[38, [66](#bib.xhtml#refbib_66)\\]. In this way, the number of variables\
    \ to be minimized during intermediate iterations is reduced. This makes the training\
    \ faster.\n\n    So the challenge is to devise new approaches and use existing\
    \ ones in the problem solvers to make the learning faster and more accurate.\n\
    \n#### 2.6.2.4 Platforms/Frameworks\n\nPlatform/Framework represents the environment\
    \ that supports the execution of the SVM problem. By utilizing this environment,\
    \ SVM problems can be further improved. From Fig. 2.9., it is clear that for large\
    \ problems, speed and accuracy depends upon computing framework/platform also.\
    \ Some examples of using the platform/framework are given below \\[[84](#bib.xhtml#refbib_84)\\\
