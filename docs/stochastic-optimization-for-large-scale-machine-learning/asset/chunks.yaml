    ## 4.2  Notations and Related Work


    This section discusses notations used in the chapter and related work.


    ### 4.2.1  Notations


    The training dataset is represented as {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*n*],*y*[*n*])},
    where *n* is the number of data points and *x*[*i*] ∈ ℝ^(*d*), *d* is the number
    of features. *w* denotes the parameter vector and *λ*[*i*], *i* = 1, 2 denotes
    the regularization parameter. ∥ ⋅ ∥ denotes Euclidean norm, also called *l*[2]\-norm,
    and ∥ ⋅ ∥[1] denotes *l*[1]\-norm. *L* and *μ* are used to denote *L*\-smoothness
    and *μ*\-strong convexity of problem, respectively. *η*[*k*]^(*s*) denotes the
    learning rate, *s* ∈ {1,2,...,*S*} denotes epoch number and *S* is the total number
    of epochs. *b* denotes the mini-batch size, *k* ∈ {1,2,...,*m*} denotes the inner
    iterations, s.t., *n* = *m**b*. The value of loss function at (*x*[*i*], *y*[*i*])
    is denoted by component function *f*[*i*]. *w*^(\*) = arg min[*w*]*F*(*w*) and
    *F*(*w*^(\*)) is the optimal objective function value, sometimes denoted as *F*^(\*).


    ### 4.2.2  Related Work


    To solve problem (4.1) for smooth regularizer, a simple method is GD, given by
    \[20\], and it converges linearly for strongly-convex and smooth problems. For
    non-smooth regularizer, typically, proximal step is applied to GD step, called
    PGD method which converges at a rate of *O*(1/*k*²) for non-strongly convex problems.
    The per-iteration complexity of GD and PGD is *O*(*n**d*) which is very large
    for large-scale learning problems and results in slow training of models. Stochastic
    approximation is one of the approach to tackle this challenge. It was first introduced
    by Robbins and Monro \[113\] and is very effective to deal with problems with
    large number of data points because each iteration uses one (or few) data points,
    like in SGD \[14\]. In SGD, each iteration is *n* times faster than GD, as their
    per-iteration complexities are *O*(*d*) and *O*(*n**d*), respectively. SGD need
    decreasing learning rates, i.e., $\\eta\_{k} \\propto 1/\\sqrt{k}$ for *k*^(*t**h*)
    iteration, because of variance in gradients, so it converges slower than GD, with
    sub-linear convergence rate *O*(1/*T*) even for strongly convex problem \[[110](#bib.xhtml#refbib_110)\].
    There are several approaches to deal with stochastic noise but most important
    of these (as discussed in \[[34](#bib.xhtml#refbib_34)\]) are: (a) using mini-batching
    \[142\], (b) decreasing learning rates\[118\], (c) variance reduction \[74\],
    and (d) importance sampling \[34\].


    Variance reduction techniques, first introduced by \[74\], called SAG, converges
    linearly, like, GD for strongly convex and smooth problems, and uses one randomly
    selected data point, like SGD during each iteration. SAG enjoys benefits of both
    GD and SGD, as it converges linearly for strongly convex and smooth case like,
    GD but it has per-iteration complexity of SGD. Later, a lot of variance reduction
    methods were proposed, like, SVRG \[63\], SAGA \[35\], S2GD \[71\], SDCA \[120\],
    SPDC \[[149](#bib.xhtml#refbib_149)\], Katyusha \[4\], Catalyst \[[87](#bib.xhtml#refbib_87)\],
    SAAG-I, II \[23\], VR-SGD \[39\], etc. These variance reduction methods can use
    constant learning rate and can be divided into three categories (as discussed
    in \[39\]): (a) primal methods which can be applied to primal optimization problem,
    like, SAG, SAGA, SVRG, etc., (b) dual methods which can be applied to dual problems,
    like, SDCA, and (c) primal-dual methods which involve primal and dual variable
    both, like, SPDC, etc.


    In this chapter, we have proposed novel variants of SAAG-I and II, named as SAAG-III
    and SAAG-IV, respectively. Unlike SAAG-I, for SAAG-III the starting point is set
    to the average of iterates of previous epoch except for the first one, $w\_{0}^{s
    + 1} = 1/m{\\sum\\limits\_{i = 1}^{m}w\_{i}^{s}}$, where *m* is number of inner
    iterations. Unlike SAAG-II, for SAAG-IV, the starting point and snap point are
    set to the last iterate and average of previous epoch except for the first one,
    *w*[0]^(*s* + 1) = *w*[*m*]^(*s*) and ${\\widetilde{w}}\_{0}^{s} = 1/m{\\sum\\limits\_{i
    = 1}^{m}w\_{i}^{s}}$. \[23\] proposed Batch Block Optimization Framework (BBOF)
    to tackle the big data (large-scale learning) challenge in machine learning, along
    with two variance reduction methods SAAG-I and II. BBOF is based on best of stochastic
    approximation (SA) and best of coordinate descent (CD) (another approach which
    is very effective to deal with large-scale learning problems especially problems
    with high dimensions). Ideas based on best of SA and CD approaches are also used
    in \[133, 140, [146](#bib.xhtml#refbib_146), 152\], \[146\] calls it doubly stochastic
    since both data points and coordinates are sampled during each iteration. It is
    observed that for ERM, it is difficult to get the advantage of BBOF in practice
    because results with CD or SGD are faster than BBOF setting as BBOF needs extra
    computations while sampling and updating the block of coordinate. When one block
