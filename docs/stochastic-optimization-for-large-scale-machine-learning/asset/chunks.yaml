- raw: "Linear SVM is very efficient in high dimensional data applications. While\
    \ their accuracy on test set is close to the non-linear SVM, it is much faster\
    \ to train for such applications. For example, document classification applications\
    \ have high dimensional input space and there is no need to add more features\
    \ to the input space because it does not make much difference in the performance.\
    \ So, test accuracy of linear SVM is close to that of non-linear SVM (see, \\\
    [[46](#bib.xhtml#refbib_46)\\]) but at the same time, training of linear SVM is\
    \ much faster than non-linear SVM due to the difference in their computational\
    \ complexities.\n\nL2-regularized soft margin SVM is the most commonly used SVM\
    \ formulation and is given below. Different problem formulations of SVM are discussed\
    \ in detail in the [Section 2.3](#03chap_02.xhtml#sec2_3).\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{w}{\\\\min}\\\\, F(w) = \\\\frac{1}{2}\\\\\
    | w\\\\|^{2} + C{\\\\sum\\\\limits\\_{i = 1}^{l}{\\\\max}}{(0,1 - y\\_{i}w^{T}x\\\
    _{i})}^{2},} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(1.5)\n\n\
    where *C* is the regularization coefficient.\n\n### 1.3.2  Logistic Regression\n\
    \nThis is a binary classification technique based on the logistic loss function\
    \ (also called sigmoid function) which gives value between 0 and 1. This is a\
    \ smooth and strongly convex (by adding *l*[2] regularization) problem which has\
    \ nice theoretical properties. It can be represented as given below:\n\n$$\\\\\
    begin{array}{l} {\\\\underset{w}{\\\\min}\\\\, F(w) = \\\\frac{1}{l}{\\\\sum\\\
    \\limits\\_{i = 1}^{l}{\\\\log}}\\\\left( {1 + \\\\exp\\\\left( {- y\\_{i}w^{T}x\\\
    _{i}} \\\\right)} \\\\right) + \\\\frac{\\\\lambda}{2}\\\\| w\\\\|^{2}.} \\\\\\\
    \\ \\\\end{array}$$  \n\n(1.6)\n\n### 1.3.3  First and Second Order Methods\n\n\
    An optimization problem can be solved using analytical methods and numerical methods.\
    \ Analytical methods are suitable to solve the simple problems, have a direct\
    \ formula to calculate the exact solution. On the other hand, numerical methods\
    \ are used to solve complex problems, iteratively and approximately. Since machine\
    \ learning problems are data intensive complex problems so numerical methods are\
    \ used to solve them.\n\nA general iterative method to solve problem (7.2), can\
    \ be written as:\n\n$$\\\\begin{array}{l} {w\\_{k + 1} = w\\_{k} - \\\\alpha\\\
    _{k}s\\_{k},} \\\\\\\\ \\\\end{array}$$  \n\n(1.7)\n\nwhere *k* is the iteration\
    \ number, *α*[*k*] is the learning rate (also known as step size) and *s*[*k*]\
    \ is the step direction.\n\n#### 1.3.3.1 First Order Methods\n\nWhen *s*[*k*] = ∇*F*(*w*[*k*])\
    \ then the method is called gradient descent (GD). GD and its modifications which\
    \ involve only first order derivatives are called first order methods. We have\
    \ proposed SAAGs which are variance reduction techniques to deal with the noise\
    \ introduced due to gradient approximations. These are first order methods which\
    \ will be discussed in [Part II](#04part_02.xhtml).\n\n#### 1.3.3.2 Second Order\
    \ Methods\n\nWhen *s*[*k*] = ∇²*F*(*w*[*k*])^( − 1)∇*F*(*w*[*k*]) then the method\
    \ is called Newton method. Newton method and its modifications which involve second\
    \ order derivatives are called second order methods. These methods use curvature\
    \ information to guide the step direction towards the solution. We have proposed\
    \ MBN and STRON methods which are based on second order information. These are\
    \ subsampled Newton methods which will be discussed in [Part III](#08part_03.xhtml).\n\
    \n## 1.4  Stochastic Approximation Approach\n\nStochastic approximation (SA) \\\
    [[113](#bib.xhtml#refbib_113)\\] is an iterative optimization approach to solve\
    \ optimization problems which cannot be solved directly but using approximations.\
    \ In machine learning problems, it is computationally very expensive, and might\
    \ be infeasible in some cases, to use all data points in each iteration of learning\
    \ algorithms. So, SA is used which makes each iteration independent of number\
    \ of data points (*l*) by considering one data point or mini-batch of data points,\
    \ i.e., instead of going through all data points, only one data point or mini-batch\
    \ of data points are processed in each iteration which makes a large computational\
    \ difference for large values of *l*. Similarly, remaining data points can be\
    \ used in mini-batches during other iterations. Thus, SA is computationally very\
    \ efficient optimization approach to deal with large-scale problems. No doubt\
    \ that might affect the convergence of learning algorithm, which can be compensated\
    \ by using larger mini-batches and other techniques like variance reduction, e.g.,\
    \ SAAGs \\[23, [28](#bib.xhtml#refbib_28)\\].\n\n## 1.5  Coordinate Descent Approach\n\
    \nCoordinate Descent (CD) \\[[137](#bib.xhtml#refbib_137)\\] is a recursive approach\
    \ to solve optimization problems by approximate minimization along coordinate\
    \ directions or coordinate hyperplanes, i.e., it recursively solves small subproblems\
    \ consisting of only one or few variables. As SA makes iteration complexity independent\
    \ of *l*, similarly, CD makes iteration complexity independent of number of features\
    \ (*n*) by considering one feature or block of features as variables, fixing the\
    \ rest features and solving the reduced subproblem thus formed. Then, new one\
    \ feature or block of features are selected as variables while fixing the rest\
    \ and resulting subproblem is solved. This process is repeated until all subproblems\
    \ covering all features are solved, then whole process is repeated until convergence.\
    \ Thus, CD is a good approach to solve large-scale problems with large number\
    \ of features.\n\n## 1.6  Datasets\n\n[Table 1.1](#02chap_01.xhtml#t1_1) lists\
    \ the datasets used in the book, which are available to download at LIBSVM website:\
    \ [https:/​/​www.csie.ntu.edu.tw/​∼cjlin/​libsvmtools/​datasets/​](https://www.csie.ntu.edu.tw).\n\
    \n## 1.7  Organization of Book\n\nBook consists of eight chapters, which are divided\
