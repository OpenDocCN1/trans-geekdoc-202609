- raw: 'The advancements in the technology and the availability of data sources have
    led to the data explosion. The classical techniques are incapable to handle this
    large data so the term ‘Big Data’ is coined, which is mainly characterized by
    three ‘V''s: volume, velocity and variety. When we consider the volume aspect
    of big data in machine learning the problem is called large-scale learning problem
    or big data problem, which have large number of data points or large number of
    features or both. One side, this large data has potential to uncover more fine-grained
    patterns, take timely and accurate decisions, and on other side it creates a lot
    of challenges to make a sense of it, like, slow training and scalability of models
    etc. So, one of the major challenge in machine learning is to develop efficient
    and scalable learning algorithms to deal with the big data challenge, i.e., to
    solve large scale learning problems.


    Stochastic approximation and coordinate descent approaches are very effective
    techniques to deal with the big data challenge. Stochastic approximation makes
    each iteration of a learning algorithm independent of number of data points by
    randomly selecting one or mini-batch of data points, on the other hand, coordinate
    decent approach makes each iteration independent of number of features by selecting
    one or block of features as variables and rest as constants. To tackle the big
    data challenge, we have utilized the best of stochastic approximation and coordinate
    descent approaches to develop batch block optimization framework (BBOF) and used
    the framework with first and second order methods. BBOF samples a mini-batch of
    data points and a block of features, and formulates a reduced subproblem which
    can be easily solved using appropriate methods.


    We have proposed stochastic average adjusted gradient (SAAG-I and II) and mini-batch
    block-coordinate Newton (MBN) methods to work with BBOF. SAAG-I and II are variance
    reduction techniques, used for solving large-scale problems using first order
    methods. MBN also intends to solve large-scale problems by reducing the per-iteration
    complexity of Newton method. But this is noticed that stochastic approximation
    and coordinate descent approaches does not work well together. This is because
    the advantage of using them together under BBOF is over run by the overhead to
    implement them due to double sampling of data and features. We further extend
    SAAG-I and II to SAAG-III and IV, respectively, using stochastic approximation
    only as variance reduction techniques to deal with the large-scale learning problems.
    SAAG-III and IV are based on iterate averaging, unlike SAAG-I, starting point
    is set to average of previous epoch in SAAG-III, and unlike SAAG-II, the snap
    point and starting point are set to average and last iterate of previous epoch
    in SAAG-IV, respectively.


    The training time of models depends on two factors: time to access data and time
    to learn from data. Before our work, a little attention was paid to data access
    part and the whole focus of research was on developing techniques to learn from
    data. We proposed systematic and sequential sampling techniques, to sample mini-batches
    of data, to reduce the training time of models by reducing the data access time.
    These techniques are based on contiguous access of memory, which is faster than
    dispersed data access in random sampling. We were able to get up to six times
    faster training of models. The idea is based on data access so it is independent
    of the problem under consideration and the method used to solve the problem.


    Techniques based on first order methods are limited to linear convergence, far
    away from the quadratic rates offered by the second order methods, like Newton''s
    method. So, we proposed stochastic trust region Newton method (STRON) which uses
    conjugate gradient to solve the trust region subproblem. It introduces subsampling
    to gradient and Hessian calculations and uses progressive batching to take benefit
    of both the stochastic and batch regimes. We also extend STRON to use preconditioned
    conjugate gradient to solve the trust region subproblem.


    Thus, this book performs comprehensive literature review to characterize the big
    data challenge and lists the areas to tackle the challenge and the current research
    directions. Further, this offers solutions to solve big data challenge using first
    and second order methods, and proposes SAAGs (I, II, III and IV), MBN, STRON and
    simple sampling techniques.


    # I\_\_\_\_\_\_\_\_\_BACKGROUND


    # Chapter 1 Introduction


    DOI: [10.1201/9781003240167-1](http://doi.org/10.1201/9781003240167-1)


    Artificial intelligence (AI), sometimes also called as machine intelligence, is
    a branch of computer science, which deals with the study and development of machines
    that are intelligent like human beings. AI is a buzzword and some popular lines
    about AI highlight its importance, such as, ‘AI is the future’ and ‘AI is the
    new electricity’ etc. AI has several components/sub-fields, like knowledge representation,
    reasoning/inferencing and pattern recognition etc., and machine learning is one
    of them and one of the important sub-field.


    Machine learning is one of the very interesting fields where machine learn to
    perform some task from examples, i.e., from data. This is unlike traditional programming
    where we need to code the logic for the task we want the machine to perform. In
    machine learning, we need to program only the learning algorithms and not the
    logic to perform the task. So, machine learning is very important in certain cases,
    like performing complex task with millions of variables which could be difficult
    for human beings to code and performing tasks where the exact algorithm to solve
    the problem is not known. Technically, machine learning is an inter-disciplinary
    field which takes contributions form optimization, probability, algebra, statistics,
    neuroscience and psychology etc.


    Machine learning is one of the hot research topic in academia and one of the most
    exploited term in the industry. It has been used across different fields for solving
    complex and challenging problems, right from medicine, physics, chemistry, engineering
    to cultural problems. Industry is investing heavily on machine learning and nowadays,
    knowingly or unknowingly everyone of us is using machine learning in our day to
    day life. Ham or spam classification in Gmail, Alexa from Amazon, Siri form Apple,
    Cortana from Microsoft, Google assistant, auto tagging of our and our friends’
    faces on Facebook and product recommendations in online shopping etc., all are
    based on machine learning. Recently, Gmail introduced a new feature of auto-completion
    while composing a mail, which is again based on machine learning.


    Machine learning comes in different flavours: supervised learning, unsupervised
    learning, semi-supervised learning and reinforcement learning. In supervised learning,
    machine is provided with the input and output (target) value pairs, e.g., classification
    and regression problems. Unsupervised learning involves only input and machine
    groups the similar inputs, e.g., clustering. Semi-supervised learning is a combination
    of supervised and unsupervised learning. In reinforcement learning, machine interacts
    with its environment and it is rewarded for its actions. Machine learning has
    several problems, like classification, regression, clustering and ranking etc.


    Mathematically, machine learning problems are data intensive optimization problems
    and in this work, we have proposed several optimization techniques to solve large-scale
    linear classification problem.


    Next, main technical terms used in the book are defined.


    ## 1.1  Large-scale Machine Learning'
