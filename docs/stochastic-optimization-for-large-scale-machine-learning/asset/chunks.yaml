    ## 4. Problem Shrinking Strategy


    While optimizing different variables (parameters), it is observed that some of
    the variables does not change or remain zero. Such variables can be left from
    the optimization process until rest of the variables reach their approximate optimum
    values. This is called shrinking strategy \[38, [66](#bib.xhtml#refbib_66)\].
    In this way, the number of variables to be minimized during intermediate iterations
    is reduced. This makes the training faster.


    So the challenge is to devise new approaches and use existing ones in the problem
    solvers to make the learning faster and more accurate.


    ## 2.6.2.4 Platforms/Frameworks


    Platform/Framework represents the environment that supports the execution of the
    SVM problem. By utilizing this environment, SVM problems can be further improved.
    From Fig. 2.9., it is clear that for large problems, speed and accuracy depends
    upon computing framework/platform also. Some examples of using the platform/framework
    are given below \[[84](#bib.xhtml#refbib_84)\]:


    ### 1. Parallel and Distributed Computing


    With the help of parallel computing \[[136](#bib.xhtml#refbib_136)\], some tasks
    can be done in parallel on either multiple cores of a system or on clusters of
    computers. This makes the training process faster, but obviously inter-communication
    between different processing units is a bottleneck here.


    ### 2. In Place Memory Calculations


    Reading and writing data takes more time than the processing of data. So, problems
    which need multi-stage processing, instead of reading and writing the data to
    disk after every stage, if the consecutive calculations are carried out in the
    memory then that could make the process faster while dealing with very large data
    problems. Apache Spark \[84\] uses the concept of in place memory calculations
    which makes it approximately 100 times faster than the Hadoop.


    So nowadays challenge is to exploit the existing frameworks to make algorithms
    more efficient.


    ## 2.6.3 Research Directions


    As per the Fig. 2.9, there are four areas of improvement which can help us in
    tackling big data problems. Our of these areas, the current research directions
    in linear SVM classification (which are shared with machine learning) are:


    ### 2.6.3.1 Stochastic Approximation Algorithms


    For last five years, there have been extensive research in this area (refer to
    [Subsection 2.6.2.3](#03chap_02.xhtml#sec2_6_2_3) for Stochastic Approximation
    Approach). Researchers have come up with a large number of algorithms using stochastic
    approximations (SA), especially with first order methods like gradient descent
    (GD) method \[[120](#bib.xhtml#refbib_120), 115\] as a solver. In addition, SA
    has also been used with second order methods like quasi-Newton \[[19](#bib.xhtml#refbib_19)\].
    SA with GD forms stochastic gradient descent (SGD) method and leads to variance
    problem in the gradient values. So, the research around SGD has been focused around
    reducing variance (e.g., \[23\]). On the other hand, research around SA with second
    order methods has been focused on incorporating curvature information in method
    for faster convergence. This approach is suitable to solve problems with large
    number of data points.


    ### 2.6.3.2 Coordinate Descent Algorithms


    This is one of the decompositional approach (refer to [Subsection 2.6.2.3](#03chap_02.xhtml#sec2_6_2_3))
    for dealing with big data problems. For last few years, there has been good work
    in this area also. Coordinate Descent (CD) approach formulates a subproblem by
    taking one parameter as a variable and rest as constants, which is much smaller
    and thus much easier to solve. A lot of algorithms have been proposed using CD
    approach \[137\] and its variations like block coordinate descent \[90\], with
    first order and seconder methods. This is generally applied to high dimensional
    primal or dual problems.


    ### 2.6.3.3 Proximal Algorithms


    Proximal algorithms (PA) \[104\] are suitable for non-smooth, constrained, large-scale,
    or distributed convex problems and recently, they produced good results with high
    dimensional optimization problems. With PA, the main operation is to calculate
    the proximity operator (refer to [Subsection 2.4.14](#03chap_02.xhtml#sec2_4_14))
    where we solve a small optimization problem. Current research has been involved
    in using PA for first order methods (like proximal gradient method \[28\]), second
    order methods (like quasi-Newton methods \[[7](#bib.xhtml#refbib_7)\]) and their
    accelerated versions \[[147](#bib.xhtml#refbib_147)\].


    ### 2.6.3.4 Parallel/Distributed Algorithms


    Parallel and distributed algorithms \[84\] utilize the computing resources to
    handle the big data problems (like CPU cores of a system and clusters of computers)
    and can work with problems where datasets are extremely large and can''t fit onto
    a single machine. The major bottleneck in these algorithms is the communication
    overhead. Researchers have been working on it for a long but still there is lot
    of scope in this area. This seems to be the hottest area in machine learning to
    handle the big data problems and in the coming time, research will probably focus
    in this direction because of increasing dataset sizes which eventually can go
    beyond the capability of single machine.


    ### 2.6.3.5 Hybrid Algorithms


    Hybrid algorithms combine two or more of the above approaches. It is obvious that
    if we want to develop efficient and scalable algorithms to tackle big data problems,
    all these approaches have to be combined together. A lot of research is already
    going in this direction also, like, combination of stochastic approximation and
    coordinate descent approaches have been studied in \[23\].


    ## 2.7 Conclusion


    Linear SVM is a very good tool in machine learning because this is much faster
    than non-linear Kernel SVM and at the same time, provides similar accuracy for
    high dimensional problems like document classification. Researchers have proposed
    a variety of SVM problem formulations, along with solvers and optimization strategies
    to solve them. Some of them are improvements over the other, like, ‘Soft SVM’
    is an improvement over the ‘Hard SVM’. Some of the SVMs have different contexts
    of application, like, SloppySVM is useful for applications where data is sloppily
    labeled; Transductive SVM is specifically proposed for text classification problems;
    Fuzzy SVM and CappedSVM are suitable for applications where data contains noise
    and data outliers; Structured SVM is useful for applications where the output
    labels are structured like strings; MVSVM and MTSVM are used for multi-view learning
    and multi-task learning, respectively, etc. Some of the SVMs are binary classifiers
    and need techniques like one-versus-one and one-versus-rest etc., to handle the
    multi-class problems, e.g., Soft SVM, Fuzzy SVM and Twin SVM etc. Some SVMs can
    handle the multi-class data using direct formulations like Crammer Singer SVM
    and Weston Watkins SVM. Amongst all the SVMs, Soft margin SVM or Soft SVM is the
    most popular and widely used SVM formulation due to faster training and better
    generalization results. That''s why when one refers to SVM that means the Soft
    SVM. According to literature, SVM-ALM is the fastest primal solver and LIBLINEAR
    is the most popular and widely used tool which provides primal and dual, both
    solvers and uses TRON, PCD (Primal Coordinate Descent) and DCD (Dual Coordinate
    Descent) methods.

