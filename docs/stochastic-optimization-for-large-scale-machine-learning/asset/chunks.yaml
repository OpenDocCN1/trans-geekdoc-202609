  fmt: '

    Stochastic approximation is one of the effective approach to deal with the large-scale
    machine learning problems and the recent research has focused on reduction of
    variance, caused by the noisy approximations of the gradients. In this chapter,
    we have proposed novel variants of `SAAG-I` and `II` (`Stochastic Average Adjusted
    Gradient`) Chauhan et el. (2017) \[23\], called `SAAG-III` and `IV`, respectively.
    Unlike `SAAG-I`, starting point is set to average of previous epoch in `SAAG-III`,
    and unlike `SAAG-II`, the snap point and starting point are set to average and
    last iterate of previous epoch in `SAAG-IV`, respectively. To determine the step
    size, we use `Stochastic Backtracking-Armijo line Search` (`SBAS`) which performs
    line search only on selected mini-batch of data points. Since backtracking line
    search is not suitable for large-scale problems and the constants used to find
    the step size, like `Lipschitz constant`, are not always available so `SBAS` could
    be very effective in such cases. We extend `SAAGs` (`I`, `II`, `III`, `IV`), to
    solve non-smooth problems and design two update rules for smooth and non-smooth
    problems. Moreover, our theoretical results prove linear convergence of `SAAG-IV`
    for all the four combinations of smoothness and strong-convexity, in expectation.
    Finally, our experimental studies prove the efficacy of proposed methods against
    the state-of-art techniques.


    ## 4.1 Introduction


    Please refer to [`Section 3.1`](#05chap_03.xhtml#sec3_1) for discussion on the
    big data challenge and need of efficient and scalable algorithms for tackling
    the challenge.


    Variance is defined as the difference between gradient calculated on the whole
    dataset and on randomly selected data point. This variance could cause divergence
    of the stochastic gradient methods or slow down the convergence of the method.
    There are different approaches for variance reduction like mini-batching, decreasing
    learning rates, importance sampling and variance reduction techniques. Here, we
    have proposed novel variance reduction methods by extending `SAAG-I` and `II`
    to solve large-scale learning problems.


    ### 4.1.1 Optimization Problem


    In this chapter, we consider composite convex optimization problem, as given below:


    ```

    \begin{array}{l} {\underset{w \in {\mathbb{R}}^{d}}{\min}\,\,\,\left\{ {F(w) =
    f(w) + g(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}f_{i}}(w) + g(w),} \right\}}
    \\ \end{array}

    ```


    (4.1)


    where `f(w)` is a finite average of component functions `f[i](w)`:ℝ^(*d*)→ℝ, `i`=1,2,...,*n*,
    are convex and smooth, `g(w)`:ℝ^(*d*)→ℝ is a relatively simple convex but possibly
    non-differentiable function (also referred to as regularizer and sometimes as
    proximal function). This kind of optimization problems can be found in operation
    research, data science, signal processing, statistics and machine learning. For
    example, regularized Empirical Risk Minimization (`ERM`) problem is a common problem
    in machine learning, which is average of losses on the training dataset. In `ERM`,
    component function `f[i](w)` denotes value of loss function at one data point,
    e.g., in binary classification, it can be logistic loss, i.e., `f[i](w)` = log
    (1+exp(−*y*[*i*]*w*^(*T*)*x*[*i*])), where {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*n*],*y*[*n*])}
    is collection of training data points, and hinge-loss, i.e., `f[i](w)` = max (0,1−*y*[*i*]*w*^(*T*)*x*[*i*]);
    for regression problem, it can be least squares, i.e., `f[i](w)` = 1/2(*w*^(*T*)*x*[*i*] − *y*[*i*])².
    The regularizer can be *λ*[1]∥*w*∥[1] (`l[1]`-regularizer), *λ*[2]/2∥*w*∥² (`l[2]`-regularizer)
    and *λ*[1]∥*w*∥[1] + *λ*[2]/2∥*w*∥² (elastic net regularizer), where *λ*[1] and
    *λ*[2] are regularization coefficients. Thus, problems like logistic regression,
    `SVM`, ridge regression and `lasso` etc., fall under `ERM`.


    ### 4.1.2 Solution Techniques for Optimization Problem


    The simple first order method to solve problem (4.1) is given by Cauchy in his
    seminal work in 1847, known as `Gradient Descent` (`GD`) method \[20\], is given
    below for `(*k* + 1)^(*t**h*)` iteration as:


    ```

    \begin{array}{l} {w_{k + 1} = w_{k} - \eta_{k}\left\lbrack {\frac{1}{n}{\sum\limits_{i
    = 1}^{n}\nabla}f_{i}(w_{k}) + \nabla g(w_{k})} \right\rbrack,} \\ \end{array}

    ```


    (4.2)


    where `η[k]` is the learning rate (also known as step size in optimization). For
    non-smooth regularizer, i.e., when `g(w)` is non-smooth then typically, proximal
    step is calculated after the gradient step, and method is called `Proximal Gradient
    Descent` (`PGD`), as given below:


    ```

    \begin{array}{l} {w_{k + 1} = Prox_{\eta_{k}}^{g}\left( z_{k} \right) = \underset{w
    \in {\mathbb{R}}^{d}}{\arg\min}\left\{ {\frac{1}{2\eta_{k}}\| w - z_{k}\|^{2}
    + g(w)} \right\},} \\ \end{array}

    ```


    (4.3)


    where $z_{k} = w_{k} - \eta_{k}/n{\sum\limits_{i = 1}^{n}\nabla}f_{i}(w_{k})$.
    `GD` converges linearly for strongly-convex and smooth problem, and (4.3) converges
    at a rate of `O(1/k²)` for non-strongly convex problems, where `k` is the number
    of iterations. The per-iteration complexity of `GD` and `PGD` methods is `O(nd)`.
    Since for large-scale learning problems, the values of `n` (number of data points)
    and/or `d` (number of features in each data point) is very large, so the per-iteration
    complexity of these methods is very large, each iteration becomes computationally
    expensive and might even be infeasible to process for a limited capacity machine,
    which leads to slow training of models in machine learning. Thus, the challenge
    is to develop efficient algorithms to deal with the large-scale learning problems\[23\].


    To tackle the challenge, stochastic approximation is one of the popular approach,
    first introduced by Robbins and Monro, in their seminal work back in 1951, which
    makes each iteration independent of number of data points \[113\]. Based on this
    approach, we have `Stochastic Gradient Descent` (`SGD`) method \[[14](#bib.xhtml#refbib_14)\],
    as given below, to solve problem (4.1) for the smooth case:


    ```

    \begin{array}{l} {w_{k + 1} = w_{k} - \eta_{k}\left\lbrack {\nabla f_{i_{k}}(w_{k})
    + \nabla g(w_{k})} \right\rbrack,} \\ \end{array}

    ```


    (4.4)


    where `i[k]` is selected uniformly randomly from 1,2, …, n and `η[k] ∝ 1/√k`.
    The per-iteration complexity of `SGD` is `O(d)` and it is very effective to deal
    with problems with large number of data points. Since `E[∇f[i[k]](w[k])]` = `∇f(w[k])`,
    `∇f[i[k]](w[k])` is an unbiased estimator of `∇f(w[k])`, but the variance in these
    two values need decreasing learning rates. This leads to slow convergence of learning
    algorithms. Recently, a lot of research is going to reduce the variance between
    `∇f[i[k]](w[k])` and `∇f(w[k])`. First variance reduction method introduced by
    \[74\], called `SAG` (`Stochastic Average Gradient`), some other common and latest
    methods are `SVRG` (`Stochastic Variance Reduced Gradient`) \[63\], `Prox-SVRG`
    \[[138](#bib.xhtml#refbib_138)\], `S2GD` (`Semi-Stochastic Gradient Descent`)
    \[71, [142](#bib.xhtml#refbib_142)\], `SAGA` \[35\], `Katyusha` \[[4](#bib.xhtml#refbib_4)\],
    `VR-SGD` (`Variance Reduced Gradient Descent`) \[[39](#bib.xhtml#refbib_39)\],
    `SAAG-I`, `II` \[23\] etc. Like, `GD`, these methods utilize full gradient and
    like, `SGD`, these methods calculate gradient for one (or few) data point during
    each iteration. Thus, just like `GD`, these methods converge linearly for strongly
    convex and smooth problems and like, `SGD`, they calculate gradient using one
    (or few) data points and have low per-iteration complexity. Thus, the variance
    reduction methods enjoy best of `GD` and `SGD`. Please refer to, \[16\] for a
    review on optimization methods for solving large-scale machine learning problems.
    In this chapter, we have proposed new variants of `SAAG-I` and `II`, called `SAAG-III`
    and `IV`, as variance reduction techniques.


    ### 4.1.3 Contributions


    The research contributions of the chapter are summarized below:

