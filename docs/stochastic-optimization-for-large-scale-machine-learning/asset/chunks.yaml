    ### 7.3.2 信赖域不精确牛顿方法


    信赖域是指在该区域内，给定函数的近似二次模型能对该函数给出正确近似的区域。在信赖域方法中，我们不需要直接计算步长（也称为学习率），而是根据信赖域半径间接调整步长。信赖域方法求解以下子问题以获取步长方向
    `p[k]`：


    $$

    \begin{array}{l}

    {{\min}_{p}\ m_{k}\left( p \right)\quad\text{s.t}\quad\| p\| \leq \bigtriangleup_{k},}

    \\

    \end{array}

    $$


    (7.11)


    其中 `mk` 是 `F(w[k]+p) − F(w[k])` 的二次模型，如 (7.7) 所示，`△[k]` 是信赖域半径。该子问题可类似于 Newton-CG
    求解，只不过现在需要处理 `p` 的额外约束。TRON（信赖域牛顿方法）[85] 是最著名且应用最广泛的此类方法之一，用于 LIBLINEAR [38] 中求解
    l[2]-正则化逻辑回归和 l[2]-SVM 问题。[52] 通过提出更好的信赖域半径扩展了 TRON。[51] 进一步使用 PCG 子问题求解器扩展了 TRON，该求解器将单位矩阵和对角矩阵的平均值作为预条件子，用于求解信赖域子问题，并表明
    PCG 对求解病态问题可能有效。


    然后计算模型实际减少量与预测减少量的比率，如下所示：


    $$

    \begin{array}{l}

    {\rho_{k} = \frac{F(w_{k} + p_{k}) - F(w_{k})}{m_{k}(p_{k})}.}

    \\

    \end{array}

    $$


    (7.12)


    参数在第 `(k + 1)` 次迭代中按如下方式更新：


    $$

    \begin{array}{l}

    {w_{k + 1} = \left\{ \begin{array}{ll}

    {w_{k} + p_{k},} & {\text{if}\ \rho_{k} > \eta_{0},} \\

    {w_{k},} & {\text{if}\ \rho_{k} \leq \eta_{0},} \\

    \end{array}~ \right.}

    \\

    \end{array}

    $$


    (7.13)


    其中 `η[0] > 0` 是给定常数。然后根据实际减少量与预测减少量的比率更新信赖域半径 `△[k]`，`△[k]` 的更新框架如下（参考 [83]）：


    $$

    \begin{array}{l}

    {\bigtriangleup_{k + 1} \in \left\{ \begin{array}{ll}

    {\left\lbrack {\gamma_{1}\min\left\{ \| p_{k}\|, \bigtriangleup_{k} \right\},\gamma_{2}
    \bigtriangleup_{k}} \right\rbrack,} & {\text{if}\ \rho_{k} \leq \eta_{1},} \\

    {\left\lbrack {\gamma_{1} \bigtriangleup_{k},\gamma_{3} \bigtriangleup_{k}} \right\rbrack,}
    & {\text{if}\ \rho_{k} \in \left( {\eta_{1},\eta_{2}} \right),} \\

    {\left\lbrack {\bigtriangleup_{k},\gamma_{3} \bigtriangleup_{k}} \right\rbrack,}
    & {\text{if}\ \rho_{k} \geq \eta_{2},} \\

    \end{array}~ \right.}

    \\

    \end{array}

    $$


    (7.14)


    其中 `0 < η[1] < η[2] ≤ 1` 且 `0 < γ[1] < γ[2] < 1 < γ[3]`。若 `ρ[k] ≤ η[1]`，则认为牛顿步不成功，信赖域半径被缩小。另一方面，若
    `ρ[k] ≥ η[2]`，则步长成功，信赖域半径被放大。我们按照 LIBLINEAR 库 [38] 实现了该框架，并为上述常数选取了以下预定义值：`η[0]
    = 1e − 4`、`η[1] = 0.25`、`η[2] = 0.75`、`γ[1] = 0.25`、`γ[2] = 0.5` 和 `γ[3] = 4`。


    ## 7.4 STRON


    STRON 利用渐进子采样，结合随机和批量模式的优点。由于随机梯度下降（SGD）在每次迭代计算量较小，因此在大规模学习问题上训练速度比梯度下降（GD）快；但
    GD 由于批量计算更准确。同样，STRON 在初始迭代中利用低计算量的优势，并在接近解区域时使用批量计算来寻找精确解，类似于 TRON。STRON 的主要挑战在于决定何时从随机模式切换到全批量模式，即调整子采样率。


    STRON 将随机性引入信赖域不精确牛顿方法，并计算子采样的函数值、梯度值和海森矩阵值来求解信赖域子问题，如下所示：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {{\min}_{p}\ m_{k}(p) = \nabla F_{X_{k}}\left( w_{k} \right)^{T}p + \frac{1}{2}p^{T}\nabla^{2}F_{S_{k}}\left(
    w_{k} \right)p,\quad\text{s.t}\quad\| p\| \leq \bigtriangleup_{k},}

    \\

    \end{array}

    \\

    \end{array}

    $$


    (7.15)


    其中 `∇²F[S[k]](w[k])` 和 `∇F[X[k]](w[k])` 分别是在子样本 `S[k]` 和 `X[k]` 上的子采样海森矩阵和梯度值，定义如下：


    $$

    \begin{array}{l}

    \begin{array}{l}

    {\nabla^{2}F_{S_{k}}\left( w_{k} \right) = \frac{1}{\left| S_{k} \right|}{\sum\limits_{i
    \in S_{k}}\nabla^{2}}f_{i}\left( w_{k} \right),} \\

    {\nabla F_{X_{k}}\left( w_{k} \right) = \frac{1}{\left| X_{k} \right|}{\sum\limits_{i
    \in X_{k}}\nabla}f_{i}\left( w_{k} \right),} \\

    {F_{X_{k}}\left( w_{k} \right) = \frac{1}{\left| X_{k} \right|}{\sum\limits_{i
    \in X_{k}}f_{i}}\left( w_{k} \right),} \\

    \end{array}

    \\

    \end{array}

    $$


    (7.16)


    其中子样本是递增的，即 `|X[k]|<|X[k + 1]|`、`|S[k]|<|S[k + 1]|`，且 `F[X[k]]` 是用于计算 `ρ[k]` 的子采样函数值。STRON
    对给定次数的 CG 迭代，或直到满足以下残差条件时，近似求解 (7.15)：


    $$

    \begin{array}{l}

    {\| r_{k}\| \leq \eta_{k}^{{}^{^{\prime}}}\|\nabla F_{X_{k}}\left( w_{k} \right)\|,}

    \\

    \end{array}

    $$


    (7.17)


    其中 `r[k] = ∇²F[S[k]](w[k])p + ∇F[X[k]](w[k])`。


    '
