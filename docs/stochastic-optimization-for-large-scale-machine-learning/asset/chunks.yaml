- raw: "# Chapter 7 Stochastic Trust Region Inexact Newton Method\n\nDOI: [10.1201/9781003240167-7](http://doi.org/10.1201/9781003240167-7)\n\
    \nNowadays stochastic approximation methods are one of the major research direction\
    \ to deal with the large-scale machine learning problems. From stochastic first\
    \ order methods, now the focus is shifting to stochastic second order methods\
    \ due to their faster convergence and availability of computing resources. In\
    \ this chapter, we have proposed a novel Stochastic Trust RegiOn Inexact Newton\
    \ method, called as STRON, which uses conjugate gradient (CG) to inexactly solve\
    \ trust region subproblem. The method uses progressive subsampling in the calculation\
    \ of gradient and Hessian values to take the advantage of both, stochastic and\
    \ full-batch regimes. We have extended STRON using existing variance reduction\
    \ techniques to deal with the noisy gradients and using preconditioned conjugate\
    \ gradient (PCG) as subproblem solver, and empirically proved that they do not\
    \ work as expected, for the large-scale learning problems. Finally, our empirical\
    \ results prove efficacy of the proposed method against existing methods with\
    \ bench marked datasets.\n\n## 7.1 Introduction\n\nMachine learning involves data\
    \ intensive optimization problems which have large number of component functions\
    \ corresponding to large amount of data available. Traditional/classical methods,\
    \ like Newton method, fail to perform well on such optimization problems due to\
    \ large per-iteration complexity. So, nowadays one of the major challenge in machine\
    \ learning is to develop scalable and efficient algorithms to deal with these\
    \ large-scale learning problems \\[25\\].\n\nTo solve the machine learning problems,\
    \ gradient descent (GD) \\[20\\] is the classical method of choice but it trains\
    \ slowly while dealing with large-scale learning problems due to high per-iteration\
    \ cost. Stochastic approximation based methods \\[113\\] can be quite effective\
    \ in such situations but they converge slowly due to the noisy approximations\
    \ of gradient. So, a variety of stochastic variance reduction techniques came\
    \ to existence, e.g., \\[39\\]. But the major limitation of these methods is that\
    \ they can converge up to linear rate only.\n\nNewton method is another classical\
    \ method to solve optimization problems, which can give up to quadratic convergence\
    \ rate \\[[17](#bib.xhtml#refbib_17)\\]. But again (pure) Newton method is not\
    \ feasible with large-scale learning problems due to huge per-iteration computational\
    \ complexity and need to store a huge Hessian matrix. So, nowadays one of the\
    \ most significant open question in optimization for machine learning is: ‘Can\
    \ we develop stochastic second order methods with quadratic convergence, like\
    \ Newton method but has low per-iteration complexity, like stochastic approximation\
    \ methods?’. After success in the stochastic first order methods, the research\
    \ is shifting its focus towards the stochastic second order methods to leverage\
    \ the faster convergence of second order methods and the available computing power.\n\
    \nInexact Newton (also called truncated Newton or Hessian free) methods and quasi-Newton\
    \ methods are among the major research directions for developing second order\
    \ methods \\[[10](#bib.xhtml#refbib_10)\\]. Inexact Newton methods try to solve\
    \ the Newton equation approximately without calculating and storing the Hessian\
    \ matrix. On the other hand, quasi-Newton methods try to approximate the Hessian\
    \ inverse and avoid the need to store the Hessian matrix. Thus, both the methods\
    \ try to resolve the issues with Newton method. The stochastic variants of inexact\
    \ Newton and quasi-Newton, further reduce the complexity of these methods by using\
    \ subsampled gradient and Hessian calculations. In this chapter, we have proposed\
    \ a novel **s**tochastic **t**rust **r**egi**o**n inexact **N**ewton (STRON) method\
    \ which introduces subsampling to gradient and Hessian calculations. It uses progressive\
    \ subsampling to enjoy the benefits of both the regimes, stochastic approximation\
    \ and full-batch learning. We further extend the method using existing variance\
    \ reduction techniques to deal with noise produced by subsampling of gradient\
    \ values, and by proposing PCG for solving the trust region subproblem.\n\n###\
    \ 7.1.1  Optimization Problem\n\nWe consider unconstrained convex optimization\
    \ problem of expected risk, as given below:\n\n$$\\\\begin{array}{l} {{\\\\min}\\\
    _{w}R(w) = \\\\mathbb{E}\\\\left\\\\lbrack {f\\\\left( {w;\\\\xi} \\\\right)}\
    \ \\\\right\\\\rbrack,} \\\\\\\\ \\\\end{array}$$  \n\n(7.1)\n\nwhere *f*(*w*;*ξ*) = *f*(*w*;*x*[*i*],*y*[*i*]) = *f*(*h*(*w*;*x*[*i*]),*y*[*i*])\
    \ is a smooth composition of linear prediction model *h* and loss function *f*\
    \ over randomly selected data point (*x*[*i*],*y*[*i*]) from the unknown distribution\
    \ *P*(*x*[*i*],*y*[*i*]), parameterized by the model parameter *w* ∈ ℝ^(*n*).\
    \ Since it is not feasible to solve (7.1) as *P* is unknown so the model is approximated\
    \ by taking a set *N* = {(*x*[1],*y*[1]),...,(*x*[*l*],*y*[*l*])} of *l* data\
    \ points from the unknown distribution *P* and then solving the empirical risk\
    \ minimization problem, as given below:\n\n$$\\\\begin{array}{l} {{\\\\min}\\\
    _{w}F(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}f}(w;x\\_{i},y\\_{i}).}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n(7.2)\n\nFor simplicity, we take *f*(*w*;*x*[*i*],*y*[*i*]) = *f*[*i*](*w*).\
    \ Finite sum optimization problems of type (7.2) exists across different fields,\
    \ like signal processing, statistics, operation research, data science and machine\
    \ learning, e.g., logistic regression and SVM in machine learning.\n\n### 7.1.2 \
    \ Solution Techniques\n\nSimple iterative classical method to solve (7.2) is gradient\
    \ descent (GD) \\[20\\], as given below:\n\n$$\\\\begin{array}{l} {w^{k + 1} =\
    \ w^{k} - \\\\alpha\\_{k}\\\\nabla F\\\\left( w\\_{k} \\\\right),} \\\\\\\\ \\\
    \\end{array}$$  \n\n(7.3)\n\nwhere (*k* + 1) is iteration number and *α*[*k*]\
    \ is called learning rate or step size. The complexity of this iteration is *O*(*n**l*)\
    \ which is large for large-scale learning problems due to large number of data\
    \ points. Stochastic gradient descent (SGD) \\[113\\] is very effective to deal\
    \ with such problems due to its low per-iteration complexity, as given below:\n\
    \n$$\\\\begin{array}{l} {w^{k + 1} = w^{k} - \\\\alpha\\_{k}\\\\nabla f\\_{i\\\
    _{k}}\\\\left( w\\_{k} \\\\right),} \\\\\\\\ \\\\end{array}$$  \n\n(7.4)\n\nwhere\
    \ *i*[*k*] is randomly selected data point. But convergence can't be guaranteed\
    \ in SGD because of noisy gradient values.\n\nAnother classical second order method\
    \ to solve (7.2) is Newton method, as given below:\n\n$$\\\\begin{array}{l} {w^{k\
    \ + 1} = w^{k} - \\\\alpha\\_{k}\\\\nabla^{2}F\\\\left( w\\_{k} \\\\right)^{-\
    \ 1}\\\\nabla F\\\\left( w\\_{k} \\\\right).} \\\\\\\\ \\\\end{array}$$  \n\n\
    (7.5)\n\nThe complexity of this iteration is *O*(*n*²*l* + *n*³) and it needs\
    \ to store and invert the Hessian matrix ∇²*F*(*w*[*k*]), which is computationally\
    \ very expensive and needs large memory, respectively. That's why first order\
    \ methods and their stochastic variants have been studied very extensively, during\
    \ the last decade, to solve large-scale learning problems but not second order\
    \ methods. As stochastic first order methods have hit their limits and due to\
    \ the availability of better computing power, the main focus started shifting\
    \ towards stochastic second order methods, and nowadays one important open question\
    \ is to find stochastic second order methods with quadratic convergence rates.\n\
    \nThere are two major research directions for second order methods: quasi-Newton\
    \ methods and inexact Newton methods, both of which try to resolve the issues\
    \ associated with the Newton method. Quasi-Newton methods try to approximate the\
    \ Hessian matrix during each iteration, as given below:\n\n$$\\\\begin{array}{l}\
    \ {w^{k + 1} = w^{k} - \\\\alpha\\_{k}B\\_{k}\\\\nabla F\\\\left( w\\_{k} \\\\\
    right),} \\\\\\\\ \\\\end{array}$$  \n\n(7.6)"
  fmt: "\n# Chapter 7 Stochastic Trust Region Inexact Newton Method\n\nDOI: [10.1201/9781003240167-7](http://doi.org/10.1201/9781003240167-7)\n\
    \nNowadays stochastic approximation methods are one of the major research direction\
    \ to deal with the large-scale machine learning problems. From stochastic first\
    \ order methods, now the focus is shifting to stochastic second order methods\
    \ due to their faster convergence and availability of computing resources. In\
    \ this chapter, we have proposed a novel Stochastic Trust RegiOn Inexact Newton\
    \ method, called as STRON, which uses conjugate gradient (`CG`) to inexactly solve\
    \ trust region subproblem. The method uses progressive subsampling in the calculation\
    \ of gradient and Hessian values to take the advantage of both, stochastic and\
    \ full-batch regimes. We have extended STRON using existing variance reduction\
    \ techniques to deal with the noisy gradients and using preconditioned conjugate\
    \ gradient (`PCG`) as subproblem solver, and empirically proved that they do not\
    \ work as expected, for the large-scale learning problems. Finally, our empirical\
    \ results prove efficacy of the proposed method against existing methods with\
    \ bench marked datasets.\n\n## 7.1 Introduction\n\nMachine learning involves data\
