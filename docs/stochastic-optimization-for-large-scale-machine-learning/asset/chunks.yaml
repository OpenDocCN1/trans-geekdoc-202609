    \ we get,\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {y = \\\\left( {\\\\mathbf{1}\
    \ - D\\\\left( {Aw - \\\\mathbf{1}\\\\gamma} \\\\right)} \\\\right)\\_{+},} \\\
    \\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.19)\n\nwhere (.)[+] function\
    \ replaces negative components of a vector with zeros. So, substituting the value\
    \ of `y` in eq. (2.18), equivalent SVM is obtained as:\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{w,\\\\gamma}{\\\\min}\\\\quad\\\\frac{\\\\\
    nu}{2}\\\\|\\\\left( {\\\\mathbf{1} - D\\\\left( {Aw - \\\\mathbf{1}\\\\gamma}\
    \ \\\\right)} \\\\right)\\_{+}\\\\|^{2} + \\\\frac{1}{2}\\\\left( {\\\\left\\\\\
    | w \\\\right\\\\|^{2} + \\\\gamma^{2}} \\\\right)} \\\\\\\\ \\\\end{array} \\\
    \\\\\\ \\\\end{array}$$  \n\n(2.20)\n\nThe objective function of this problem\
    \ is not twice differentiable so `x`[+] is replaced with a smooth approximation,\
    \ given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {p(x,\\\\alpha) = x +\
    \ \\\\frac{1}{\\\\alpha}log\\\\left( {1 + e^{- \\\\alpha x}} \\\\right),\\\\quad\\\
    \\alpha > 0,} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.21)\n\n\
    where `α` is the smoothing parameter and `e` is the exponential constant. So,\
    \ using eq. (2.21) in eq. (2.20), it gives the Smooth SVM as:\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{w,\\\\gamma}{\\\\min}\\\\,\\\\frac{\\\\nu}{2}\\\
    \\| p\\\\left( {\\\\mathbf{1} - D\\\\left( {Aw - \\\\mathbf{1}\\\\gamma} \\\\\
    right),\\\\alpha} \\\\right)\\\\|^{2} + \\\\frac{1}{2}\\\\left( {\\\\left\\\\\
    | w \\\\right\\\\|^{2} + \\\\gamma^{2}} \\\\right)} \\\\\\\\ \\\\end{array} \\\
    \\\\\\ \\\\end{array}$$  \n\n(2.22)\n\nThe decision function for Smooth SVM is\
    \ given by `sign(w`^(*T`)*`x − γ)`.\n\n### 2.3.8  Proximal SVM (2001)\n\nProximal\
    \ SVM (PSVM, \\[45\\]) classifies data points on the basis of proximity to the\
    \ two parallel planes (called as proximal planes). Standard SVM classifies points\
    \ using a separating hyperplane which assigns them to one of the half spaces generated\
    \ by it (separating hyperplane). Figure 2.6. depicts the bounding planes in standard\
    \ SVM and proximal planes of PSVM. The performance of PSVM on test dataset, is\
    \ comparable to the standard SVM but its training speed on the training dataset,\
    \ is considerably faster than the Standard SVM \\[45\\]. Primal form of PSVM is\
    \ given by\n\n![FIGURE 2.6 Standard SVM versus Proximal SVM.](img/fig2_6.jpg)\n\
    \nFIGURE 2.6 Standard SVM versus Proximal SVM.\n\n$$\\\\begin{array}{l} \\\\begin{array}{ll}\
    \ & {\\\\underset{(w,\\\\gamma,y)}{\\\\min}\\\\quad\\\\nu\\\\frac{1}{2}\\\\| y\\\
    \\|^{2} + \\\\frac{1}{2}\\\\left( {w^{T}w + \\\\gamma^{2}} \\\\right)} \\\\\\\\\
    \ {\\\\text{s}\\\\text{.t}\\\\text{.}} & {D\\\\left( {Aw - \\\\mathbf{1}\\\\gamma}\
    \ \\\\right) + y = \\\\mathbf{1}} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(2.23)\n\n"
