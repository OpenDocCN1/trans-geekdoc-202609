    SVM 公式。就线性和非线性 SVM 而言，它们具有相同的公式，只是执行分类的空间不同。线性 SVM 在输入空间中执行，非线性 SVM 在特征空间中执行。本章仅讨论线性
    SVM，但非线性 SVM 的数学公式可以通过使用以下替换从线性 SVM 推导出来：


    ```

    \begin{array}{l} \left. x\_{1}^{T}x\_{2}\mapsto K\left( {x\_{1},x\_{2}} \\right),
