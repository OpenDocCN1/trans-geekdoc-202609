- raw: "Nowadays, the biggest challenge before machine learning is to develop efficient\
    \ and scalable learning algorithms to deal with ‘Big Data’. To solve this challenge,\
    \ extensive research is going in four directions: stochastic approximation algorithms,\
    \ coordinate descent algorithms, proximal algorithms and parallel and distributed\
    \ algorithms. First two, stochastic approximation and coordinate descent algorithms,\
    \ try to reduce the problem size and computations by considering fewer parameters\
    \ or fewer instances during each iteration of learning algorithm. Proximal algorithms\
    \ are used for solving large non-smooth convex problems with separable components\
    \ and parallel and distributed algorithms try to exploit the computing resources\
    \ to handle big data problems. Amongst these, parallel and distributed computing\
    \ looks to have a great future scope.\n\n# II\\_\\_\\_\\_\\_\\_\\_\\_\\_FIRST\
    \ ORDER METHODS\n\n# Chapter 3 Mini-batch and Block-coordinate Approach\n\nDOI:\
    \ [10.1201/9781003240167-3](http://doi.org/10.1201/9781003240167-3)\n\nBig Data\
    \ problems in Machine Learning have large number of data points or large number\
    \ of features, or both, which make training of models difficult because of high\
    \ computational complexities of single iteration of learning algorithms. To solve\
    \ such learning problems, Stochastic Approximation offers an optimization approach\
    \ to make complexity of each iteration independent of number of data points by\
    \ taking only one data point or mini-batch of data points during each iteration\
    \ and thereby helping to solve problems with large number of data points. Similarly,\
    \ Coordinate Descent offers another optimization approach to make iteration complexity\
    \ independent of the number of features/coordinates/variables by taking only one\
    \ feature or block of features, instead of all, during an iteration and thereby\
    \ helping to solve problems with large number of features. In this chapter, an\
    \ optimization framework, namely, Batch Block Optimization Framework has been\
    \ developed to solve big data problems using the best of Stochastic Approximation\
    \ as well as the best of Coordinate Descent approaches, independent of any solver.\
    \ This framework is used to solve strongly convex and smooth empirical risk minimization\
    \ problem with gradient descent (as a solver) and two novel Stochastic Average\
    \ Adjusted Gradient methods have been proposed to reduce variance in mini-batch\
    \ and block-coordinate setting of the developed framework. Theoretical analysis\
    \ prove linear convergence of the proposed methods and empirical results with\
    \ bench marked datasets prove the superiority of proposed methods against existing\
    \ methods.\n\n## 3.1 Introduction\n\nBig data problems have multiple aspects and\
    \ one of them is the size/volume of data, i.e., big data problems have large number\
    \ of data points or large number of features for each data point, or both, which\
    \ pose a major challenge to machine learning to train models on the large datasets\
    \ because of high computational cost of each iteration of the learning algorithms.\
    \ This high iteration complexity is because of solving for all the variables (features)\
    \ over all data points during each iteration of the learning algorithms. Since\
    \ every computer has limited capability, each iteration might be very expensive\
    \ or even infeasible to process. One another interesting point about big data\
    \ is that its meaning, i.e., what is big in ‘big data’ is not fixed since dataset\
    \ sizes are continuously growing. So, to solve big data problems, we need not\
    \ only efficient learning algorithms to deal with high iteration complexity but\
    \ also scalable learning algorithms to tackle growing size of datasets.\n\nThis\
    \ chapter solves Empirical Risk Minimization (ERM) problem which consists of average\
    \ of losses over all data points. For training data {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*l*],*y*[*l*])},\
    \ where *x*[*i*] ∈ ℝ^(*p*), *y*[*i*] ∈ {−1,+1}, ∀ *i*, *l* is the number of data\
    \ points, *p* is the number of features in each data point, and *l* or *p*, or\
    \ both are assumed to be large. ERM problem is given below:\n\n$$\\\\begin{array}{l}\
    \ {\\\\underset{w}{min}\\\\, f(w),\\\\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\\
    _{i = 1}^{l}L\\_{i}}(w,x\\_{i},y\\_{i})} \\\\\\\\ \\\\end{array}$$  \n\n(3.1)\n\
    \nwhere *w* ∈ ℝ^(*p*) is parameter vector and *L*[*i*] are loss functions for\
    \ *i* = 1, 2, ..., *l*. We assume strong convexity and smoothness of ERM problem\
    \ so L2 regularization can be used as given below:\n\n$$\\\\begin{array}{l} {f(w)\
    \ = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}L\\_{i}}(w,x\\_{i},y\\_{i})\
    \ + \\\\frac{C}{2}\\\\| w\\\\|^{2},} \\\\\\\\ \\\\end{array}$$  \n\n(3.2)\n\n\
    where *C* is a regularization constant. For example, for logistic regression eq.(3.2)\
    \ can be written as:\n\n$$\\\\begin{array}{l} {\\\\underset{w}{min}\\\\, f(w),\\\
    \\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}l}og(1 + exp( - y\\\
    _{i}w^{T}x\\_{i})) + \\\\frac{C}{2}\\\\| w\\\\|^{2},} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(3.3)\n\nwhere for the sake of simplicity, regularization can be hidden\
    \ inside loss function, as $L\\_{i}(w,x\\_{i},y\\_{i}) = log(1 + exp( - y\\_{i}w^{T}x\\\
    _{i})) + \\\\frac{C}{2}\\\\| w\\\\|^{2},\\\\,\\\\forall\\\\, i$.\n\n### 3.1.1 \
    \ Motivation"
  fmt: "\nNowadays, the biggest challenge before machine learning is to develop efficient\
    \ and scalable learning algorithms to deal with ‘Big Data’. To solve this challenge,\
    \ extensive research is going in four directions: stochastic approximation algorithms,\
    \ coordinate descent algorithms, proximal algorithms and parallel and distributed\
    \ algorithms. First two, stochastic approximation and coordinate descent algorithms,\
    \ try to reduce the problem size and computations by considering fewer parameters\
    \ or fewer instances during each iteration of learning algorithm. Proximal algorithms\
    \ are used for solving large non-smooth convex problems with separable components\
    \ and parallel and distributed algorithms try to exploit the computing resources\
    \ to handle big data problems. Amongst these, parallel and distributed computing\
    \ looks to have a great future scope.\n\n# II\\_\\_\\_\\_\\_\\_\\_\\_\\_FIRST\
    \ ORDER METHODS\n\n# Chapter 3 Mini-batch and Block-coordinate Approach\n\nDOI:\
    \ [10.1201/9781003240167-3](http://doi.org/10.1201/9781003240167-3)\n\nBig Data\
    \ problems in Machine Learning have large number of data points or large number\
    \ of features, or both, which make training of models difficult because of high\
    \ computational complexities of single iteration of learning algorithms. To solve\
    \ such learning problems, Stochastic Approximation offers an optimization approach\
    \ to make complexity of each iteration independent of number of data points by\
    \ taking only one data point or mini-batch of data points during each iteration\
    \ and thereby helping to solve problems with large number of data points. Similarly,\
    \ Coordinate Descent offers another optimization approach to make iteration complexity\
    \ independent of the number of features/coordinates/variables by taking only one\
    \ feature or block of features, instead of all, during an iteration and thereby\
    \ helping to solve problems with large number of features. In this chapter, an\
    \ optimization framework, namely, Batch Block Optimization Framework has been\
    \ developed to solve big data problems using the best of Stochastic Approximation\
    \ as well as the best of Coordinate Descent approaches, independent of any solver.\
    \ This framework is used to solve strongly convex and smooth empirical risk minimization\
    \ problem with gradient descent (as a solver) and two novel Stochastic Average\
    \ Adjusted Gradient methods have been proposed to reduce variance in mini-batch\
    \ and block-coordinate setting of the developed framework. Theoretical analysis\
    \ prove linear convergence of the proposed methods and empirical results with\
    \ bench marked datasets prove the superiority of proposed methods against existing\
    \ methods.\n\n## 3.1 Introduction\n\nBig data problems have multiple aspects and\
    \ one of them is the size/volume of data, i.e., big data problems have large number\
    \ of data points or large number of features for each data point, or both, which\
    \ pose a major challenge to machine learning to train models on the large datasets\
    \ because of high computational cost of each iteration of the learning algorithms.\
    \ This high iteration complexity is because of solving for all the variables (features)\
    \ over all data points during each iteration of the learning algorithms. Since\
    \ every computer has limited capability, each iteration might be very expensive\
    \ or even infeasible to process. One another interesting point about big data\
    \ is that its meaning, i.e., what is big in ‘big data’ is not fixed since dataset\
    \ sizes are continuously growing. So, to solve big data problems, we need not\
    \ only efficient learning algorithms to deal with high iteration complexity but\
    \ also scalable learning algorithms to tackle growing size of datasets.\n\nThis\
    \ chapter solves Empirical Risk Minimization (ERM) problem which consists of average\
    \ of losses over all data points. For training data {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*l*],*y*[*l*])},\
    \ where *x*[*i*] ∈ ℝ^(*p*), *y*[*i*] ∈ {−1,+1}, ∀ *i*, *l* is the number of data\
    \ points, *p* is the number of features in each data point, and *l* or *p*, or\
    \ both are assumed to be large. ERM problem is given below:\n\n$$\\\\begin{array}{l}\
    \ {\\\\underset{w}{min}\\\\, f(w),\\\\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\\
    _{i = 1}^{l}L\\_{i}}(w,x\\_{i},y\\_{i})} \\\\\\\\ \\\\end{array}$$  \n\n(3.1)\n\
    \nwhere *w* ∈ ℝ^(*p*) is parameter vector and *L*[*i*] are loss functions for\
    \ *i* = 1, 2, ..., *l*. We assume strong convexity and smoothness of ERM problem\
    \ so L2 regularization can be used as given below:\n\n$$\\\\begin{array}{l} {f(w)\
    \ = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}L\\_{i}}(w,x\\_{i},y\\_{i})\
    \ + \\\\frac{C}{2}\\\\| w\\\\|^{2},} \\\\\\\\ \\\\end{array}$$  \n\n(3.2)\n\n\
    where *C* is a regularization constant. For example, for logistic regression eq.(3.2)\
    \ can be written as:\n\n$$\\\\begin{array}{l} {\\\\underset{w}{min}\\\\, f(w),\\\
    \\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}l}og(1 + exp( - y\\\
    _{i}w^{T}x\\_{i})) + \\\\frac{C}{2}\\\\| w\\\\|^{2},} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(3.3)\n\nwhere for the sake of simplicity, regularization can be hidden\
    \ inside loss function, as $L\\_{i}(w,x\\_{i},y\\_{i}) = log(1 + exp( - y\\_{i}w^{T}x\\\
    _{i})) + \\\\frac{C}{2}\\\\| w\\\\|^{2},\\\\,\\\\forall\\\\, i$.\n\n### 3.1.1 \
    \ Motivation\n"
  trans: "\n\n如今，机器学习面临的最大挑战是开发高效且可扩展的学习算法来处理“大数据”。为了解决这一挑战，广泛的研究正在四个方向进行：随机近似算法、坐标下降算法、近端算法以及并行和分布式算法。前两者，即随机近似和坐标下降算法，试图通过在学习算法的每次迭代中考虑更少的参数或更少的实例来减少问题规模和计算量。近端算法用于求解具有可分离分量的大型非光滑凸问题，而并行和分布式算法则试图利用计算资源来处理大数据问题。在这些方法中，并行和分布式计算看起来具有巨大的未来前景。\n\
    \n# II\\_\\_\\_\\_\\_\\_\\_\\_\\_FIRST ORDER METHODS\n\n# Chapter 3 Mini-batch\
    \ and Block-coordinate Approach\n\nDOI: [10.1201/9781003240167-3](http://doi.org/10.1201/9781003240167-3)\n\
    \n机器学习中的大数据问题拥有大量的数据点或大量的特征，或者两者兼有，这使得模型训练变得困难，因为学习算法单次迭代的计算复杂度很高。为了解决此类学习问题，随机近似提供了一种优化方法，通过在每次迭代中仅取一个数据点或一小批数据点，使每次迭代的复杂度与数据点数量无关，从而帮助解决数据点数量庞大的问题。同样，坐标下降提供了另一种优化方法，通过在每次迭代中仅取一个特征或一组特征，而不是全部特征，使迭代复杂度与特征/坐标/变量的数量无关，从而帮助解决特征数量庞大的问题。在本章中，开发了一种名为“批量块优化框架”的优化框架，用于利用随机近似和坐标下降方法的优点来解决大数据问题，且不依赖于任何求解器。该框架用于求解具有强凸性和光滑性的经验风险最小化问题（以梯度下降作为求解器），并提出了两种新的随机平均调整梯度方法，以减少所开发框架的小批量和块坐标设置中的方差。理论分析证明了所提方法的线性收敛性，基准数据集的实证结果证明了所提方法相对于现有方法的优越性。\n\
    \n## 3.1 引言\n\n大数据问题有多个方面，其中之一是数据的大小/容量，即大数据问题拥有大量的数据点或每个数据点拥有大量的特征，或者两者兼有，这对机器学习在大型数据集上训练模型构成了重大挑战，因为学习算法每次迭代的计算成本很高。这种高迭代复杂度是因为在学习算法的每次迭代中，需要对所有数据点上的所有变量（特征）求解。由于每台计算机的能力都是有限的，每次迭代可能非常昂贵，甚至无法处理。关于大数据的另一个有趣的观点是，其含义，即“大数据”中的“大”是什么，并不是固定的，因为数据集的规模在不断增长。因此，为了解决大数据问题，我们不仅需要高效的学习算法来处理高迭代复杂度，还需要可扩展的学习算法来应对不断增长的数据集规模。\n\
    \n本章解决经验风险最小化（ERM）问题，该问题由所有数据点上的损失平均值组成。对于训练数据 {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*l*],*y*[*l*])}，其中\
    \ *x*[*i*] ∈ ℝ^(*p*)，*y*[*i*] ∈ {−1,+1}，∀ *i*，*l* 是数据点的数量，*p* 是每个数据点中的特征数量，且假设\
    \ *l* 或 *p*，或两者都很大。ERM 问题如下所示：\n\n$$\\\\begin{array}{l} {\\\\underset{w}{min}\\\
    \\, f(w),\\\\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}L\\_{i}}(w,x\\\
    _{i},y\\_{i})} \\\\\\\\ \\\\end{array}$$  \n\n(3.1)\n\n其中 *w* ∈ ℝ^(*p*) 是参数向量，*L*[*i*]\
    \ 是 *i* = 1, 2, ..., *l* 的损失函数。我们假设 ERM 问题具有强凸性和光滑性，因此可以使用 L2 正则化，如下所示：\n\n$$\\\
    \\begin{array}{l} {f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\_{i = 1}^{l}L\\_{i}}(w,x\\\
    _{i},y\\_{i}) + \\\\frac{C}{2}\\\\| w\\\\|^{2},} \\\\\\\\ \\\\end{array}$$  \n\
    \n(3.2)\n\n其中 *C* 是正则化常数。例如，对于逻辑回归，eq.(3.2) 可以写成：\n\n$$\\\\begin{array}{l} {\\\
    \\underset{w}{min}\\\\, f(w),\\\\quad f(w) = \\\\frac{1}{l}{\\\\sum\\\\limits\\\
    _{i = 1}^{l}l}og(1 + exp( - y\\_{i}w^{T}x\\_{i})) + \\\\frac{C}{2}\\\\| w\\\\\
    |^{2},} \\\\\\\\ \\\\end{array}$$  \n\n(3.3)\n\n其中，为了简单起见，正则化可以隐藏在损失函数内部，即 $L\\\
    _{i}(w,x\\_{i},y\\_{i}) = log(1 + exp( - y\\_{i}w^{T}x\\_{i})) + \\\\frac{C}{2}\\\
    \\| w\\\\|^{2},\\\\,\\\\forall\\\\, i$。\n\n### 3.1.1  动机\n\n"
