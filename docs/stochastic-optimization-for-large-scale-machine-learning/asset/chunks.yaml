  trans: '


    随机近似是处理大规模机器学习问题的有效方法之一，近期研究主要集中在减少由梯度的噪声近似引起的方差。在本章中，我们提出了 `SAAG-I` 和 `II` (`Stochastic
    Average Adjusted Gradient`) Chauhan et el. (2017) \[23\] 的新变体，分别称为 `SAAG-III`
    和 `IV`。与 `SAAG-I` 不同，`SAAG-III` 中的起点设置为上一时代的平均值；与 `SAAG-II` 不同，`SAAG-IV` 中的快照点和起点分别设置为上一时代的平均值和最后一次迭代值。为了确定步长，我们使用
    `Stochastic Backtracking-Armijo line Search` (`SBAS`），它仅在选定的数据点小批量上执行线搜索。由于回溯线搜索不适合大规模问题，且用于寻找步长的常数（如
    `Lipschitz constant`）并不总是可用，因此 `SBAS` 在此类情况下可能非常有效。我们将 `SAAGs` (`I`, `II`, `III`,
    `IV`) 扩展以求解非光滑问题，并为光滑和非光滑问题设计了两个更新规则。此外，我们的理论结果证明了 `SAAG-IV` 在光滑性和强凸性的所有四种组合下具有线性收敛性（期望意义下）。最后，我们的实验研究证明了所提方法相较于最先进技术的有效性。


    ## 4.1 引言


    请参阅 `Section 3.1` 了解关于大数据挑战以及为应对该挑战所需高效且可扩展算法的讨论。


    方差定义为在整个数据集上计算的梯度与在随机选定的数据点上计算的梯度之间的差异。这种方差可能导致随机梯度方法发散或减慢方法的收敛速度。方差减少的不同方法包括小批量、降低学习率、重要性采样和方差减少技术。在此，我们通过扩展
    `SAAG-I` 和 `II` 来求解大规模学习问题，提出了新的方差减少方法。


    ### 4.1.1 优化问题


    在本章中，我们考虑复合凸优化问题，如下所示：


    ```

    \begin{array}{l} {\underset{w \in {\mathbb{R}}^{d}}{\min}\,\,\,\left\{ {F(w) =
    f(w) + g(w) = \frac{1}{n}{\sum\limits_{i = 1}^{n}f_{i}}(w) + g(w),} \right\}}
    \\ \end{array}

    ```


    (4.1)


    其中 `f(w)` 是分量函数 `fi`:ℝ^(*d*)→ℝ 的有限平均，`i`=1,2,...,*n* 为凸且光滑，`g(w)`:ℝ^(*d*)→ℝ 是一个相对简单的凸函数，但可能不可微（也称为正则化项，有时也称为近端函数）。这类优化问题可在运筹学、数据科学、信号处理、统计学和机器学习中找到。例如，正则化经验风险最小化（`ERM`）问题是机器学习中的常见问题，即训练数据集上损失的平均值。在
    `ERM` 中，分量函数 `fi` 表示某个数据点处的损失函数值，例如，在二分类中，它可以是对数损失，即 `fi` = log (1+exp(−*y*[*i*]*w*^(*T*)*x*[*i*]))，其中
    {(*x*[1],*y*[1]),(*x*[2],*y*[2]),...,(*x*[*n*],*y*[*n*])} 是训练数据点的集合；也可以是铰链损失，即
    `fi` = max (0,1−*y*[*i*]*w*^(*T*)*x*[*i*]）；对于回归问题，它可以是最小二乘，即 `fi` = 1/2(*w*^(*T*)*x*[*i*] − *y*[*i*])²。正则化项可以是
    *λ*[1]∥*w*∥[1] (`l[1]`-正则化项)、*λ*[2]/2∥*w*∥² (`l[2]`-正则化项) 和 *λ*[1]∥*w*∥[1] + *λ*[2]/2∥*w*∥²（弹性网正则化项），其中
    *λ*[1] 和 *λ*[2] 是正则化系数。因此，逻辑回归、`SVM`、岭回归和 `lasso` 等问题均属于 `ERM`。


    ### 4.1.2 优化问题的求解技术


    求解问题 (4.1) 的简单一阶方法由柯西在其 1847 年的开创性著作中提出，称为 `Gradient Descent` (`GD`) 方法 \[20\]，对于
    `(*k* + 1)^(*t**h*)` 次迭代，其表达式如下：


    ```

    \begin{array}{l} {w_{k + 1} = w_{k} - \eta_{k}\left\lbrack {\frac{1}{n}{\sum\limits_{i
    = 1}^{n}\nabla}f_{i}(w_{k}) + \nabla g(w_{k})} \right\rbrack,} \\ \end{array}

    ```


    (4.2)


    其中 `η[k]` 是学习率（在优化中也称为步长）。对于非光滑正则化项，即当 `g(w)` 非光滑时，通常在梯度步之后计算近端步，该方法称为 `Proximal
    Gradient Descent` (`PGD`)，表达式如下：


    ```

    \begin{array}{l} {w_{k + 1} = Prox_{\eta_{k}}^{g}\left( z_{k} \right) = \underset{w
    \in {\mathbb{R}}^{d}}{\arg\min}\left\{ {\frac{1}{2\eta_{k}}\| w - z_{k}\|^{2}
    + g(w)} \right\},} \\ \end{array}

    ```


    (4.3)


    其中 $z_{k} = w_{k} - \eta_{k}/n{\sum\limits_{i = 1}^{n}\nabla}f_{i}(w_{k})$。`GD`
    对强凸且光滑的问题具有线性收敛性，而 (4.3) 对非强凸问题的收敛速率为 `O(1/k²)`，其中 `k` 是迭代次数。`GD` 和 `PGD` 方法的每次迭代复杂度为
    `O(nd)`。由于对于大规模学习问题，数据点数量 `n` 和/或每个数据点的特征数量 `d` 非常大，因此这些方法的每次迭代复杂度非常大，每次迭代计算成本高昂，甚至可能对于容量有限的机器来说无法处理，这导致机器学习模型训练缓慢。因此，挑战在于开发高效算法来处理大规模学习问题\[23\]。


    为应对这一挑战，随机近似是一种流行的方法，最初由 Robbins 和 Monro 在其 1951 年的开创性著作中提出，该方法使每次迭代独立于数据点数量 \[113\]。基于这种方法，我们有
    `Stochastic Gradient Descent` (`SGD`) 方法 \[14\]，如下所示，用于求解光滑情况下的问题 (4.1)：


    ```

    \begin{array}{l} {w_{k + 1} = w_{k} - \eta_{k}\left\lbrack {\nabla f_{i_{k}}(w_{k})
    + \nabla g(w_{k})} \right\rbrack,} \\ \end{array}

    ```


    (4.4)


    其中 `i[k]` 从 1,2, …, n 中均匀随机选择，且 `η[k] ∝ 1/√k`。`SGD` 的每次迭代复杂度为 `O(d)`，对于处理数据点数量众多的问题非常有效。由于
    `E[∇f[i[k]](w[k])]` = `∇f(w[k])`，`∇f[i[k]](w[k])` 是 `∇f(w[k])` 的无偏估计量，但这两个值之间的方差需要降低学习率。这导致学习算法收敛缓慢。最近，大量研究致力于减少
    `∇f[i[k]](w[k])` 和 `∇f(w[k])` 之间的方差。第一个方差减少方法由 \[74\] 引入，称为 `SAG` (`Stochastic
    Average Gradient`)，其他一些常见和最新的方法包括 `SVRG` (`Stochastic Variance Reduced Gradient`)
    \[63\]、`Prox-SVRG` \[138\]、`S2GD` (`Semi-Stochastic Gradient Descent`) \71, [142\]、`SAGA`
    \[35\]、`Katyusha` \[4\]、`VR-SGD` (`Variance Reduced Gradient Descent`) \[39\]、`SAAG-I`,
    `II` \[23\] 等。与 `GD` 类似，这些方法利用全梯度；与 `SGD` 类似，这些方法在每次迭代中计算一个（或少数几个）数据点的梯度。因此，就像
    `GD` 一样，这些方法对强凸且光滑的问题具有线性收敛性；就像 `SGD` 一样，它们使用一个（或少数几个）数据点计算梯度，并且具有较低的每次迭代复杂度。因此，方差减少方法兼具
    `GD` 和 `SGD` 的优点。请参阅 \[16\] 了解关于求解大规模机器学习问题的优化方法的综述。在本章中，我们提出了 `SAAG-I` 和 `II`
    的新变体，称为 `SAAG-III` 和 `IV`，作为方差减少技术。


    ### 4.1.3 贡献


    本章的研究贡献总结如下：


