    # III\_\_\_\_\_\_\_\_\_SECOND ORDER METHODS


    # Chapter 6 Mini-batch Block-coordinate Newton Method


    DOI: [`10.1201/9781003240167-6`](http://doi.org/10.1201/9781003240167-6)


    Nowadays, big data challenge is one of the major challenge in machine learning.
    Stochastic approximation and coordinate descent approaches are very effective
    to deal with the challenge, as they make each iteration of the learning algorithm
    independent of number of data points and number of features, respectively. In
    this chapter, we have combined the best of stochastic approximation and coordinate
    descent approaches with second order methods to propose mini-bath block-coordinate
    Newton (MBN) method. We find that MBN does not perform well as per the expectations
    and lags behind even the pure Newton method in term of training time. This is
    due to the double sampling of data points and features, and associated implementation
    overheads.


    ## 6.1 Introduction


    In this chapter, we consider the empirical risk minimization problem (ERM), as
    given below:


    ```

    \begin{array}{l} \begin{array}{l} {\underset{w}{\min}\,\, F(w) = \frac{1}{l}{\sum\limits_{i
    = 1}^{l}f_{i}}(w),} \\ \end{array} \\ \end{array}

    ```


    (6.1)


    The general solution of (6.1), using Newton method is given by


    ```

    \begin{array}{l} \begin{array}{l} {w_{k + 1} = w_{k} - \alpha_{k}\nabla^{2}F{(w_{k})}^{-
    1}\nabla F(w_{k}),} \\ \end{array} \\ \end{array}

    ```


    (6.2)


    where `α[k]` is the learning rate. The per-iteration complexity of this iteration
    is `O(n²l + n³)` which is huge for large-scale learning problems. The major issues
    with Newton method are the need to calculate and store a large Hessian matrix
    and calculation of Hessian inverse.

