    \ \\[102\\]:\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\underset{w,b}{\\\
    \\min}\\\\,{\\\\sum\\\\limits\\_{i = 1}^{l}\\\\xi\\_{ch}}\\\\left( w,b\\\\, \\\
    \\middle| x\\_{i} \\\\right) + \\\\gamma\\\\left\\\\| w \\\\right\\\\|\\_{2}^{2}}\
    \ \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\n(2.35)\n\nHere *γ* is\
    \ regularization parameter and *ξ*[*c**h*](*w*,*b* |*x*[*i*]) is capped *l*[*p*]-norm\
    \ given by\n\n$$\\\\begin{array}{l} \\\\begin{array}{l} {\\\\xi\\_{ch}\\\\left(\
    \ w,b\\\\, \\\\middle| x\\_{i} \\\\right) = \\\\min\\\\left( {\\\\epsilon,max\\\
    \\left( {0,1 - y\\_{i}w^{T}x\\_{i}} \\\\right)^{p}} \\\\right).} \\\\\\\\ \\\\\
    end{array} \\\\\\\\ \\\\end{array}$$  \n\nwhere *ϵ* is capping value and *p* is\
    \ any real value. Multi-class problem for *c* classes is given by\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\underset{W,b,M \\\\geq 0}{\\\\min}\\\\quad{\\\\sum\\\
    \\limits\\_{i = 1}^{l}{\\\\min}}\\\\left( {\\\\| W^{T}x\\_{i} + b - y\\_{i} -\
    \ y\\_{i}{^\\\\circ}m\\_{i}\\\\|\\_{2}^{p},\\\\epsilon} \\\\right) + \\\\gamma\\\
    \\left\\\\| W \\\\right\\\\|\\_{F}^{2}} \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\\
    end{array}$$  \n\n(2.36)\n\nwhere *m*[*i*] is a slack variable to encode the unilateral\
    \ loss of *x*[*i*], *W* ∈ ℝ^(*n* × *c*), *b* ∈ ℝ^(*c* × 1), *m*[*i*] ∈ ℝ^(*c*\
    \ × 1), *M* ∈ ℝ^(*c* × *n*) with the i-th column as *m*[*i*] and\n\n$$\\\\begin{array}{l}\
    \ \\\\begin{array}{l} {\\\\xi\\_{chm}\\\\left( W,b \\\\middle| x\\_{i} \\\\right)\
    \ = \\\\min\\\\left( {\\\\underset{m\\_{i} \\\\geq 0}{\\\\min}\\\\| W^{T}x\\_{i}\
    \ + b - y\\_{i} - y\\_{i}{^\\\\circ}m\\_{i}\\\\|\\_{2}^{p},\\\\epsilon} \\\\right),}\
    \ \\\\\\\\ \\\\end{array} \\\\\\\\ \\\\end{array}$$  \n\nis capped *l*[*p*]-norm\
    \ loss function for multi-class problem. A summary of some of important SVMs is\
    \ given in [Table 2.1](#03chap_02.xhtml#t2_1).\n\n## 2.4 Problem Solvers\n\nOnce\
    \ the SVM problem is formulated, the next task is to solve the problem using certain\
    \ methods called SVM solvers. The method/solver to solve a particular SVM formulation\
    \ depends upon a number of factors and some of them are:\n\n1. Problem formulation\
    \ properties: Convex and non-convex nature, strong convexity, smooth and non-smooth\
    \ nature, primal or dual nature, constrained and unconstrained nature, etc.\n\n\
    2. Dataset properties: #data_points ≫ #features or #features ≫ #data_points, sparsity,\
    \ binary or multi-class data etc.\n\n3. What do we expect: Low or high accuracy\
    \ solution, accuracy is important or time etc.\n\nDifferent types of optimization\
    \ problems, depending upon the nature of objective function and constraints, are\
    \ depicted in [Fig. 2.7](#03chap_02.xhtml#f2_7). SVM problem is an optimization\
    \ problem, which may be convex problem \\[33\\] or non-convex problem \\[126\\\
    ]. It depends upon the problem formulation. It is easy to solve the convex optimization\
    \ problem than non-convex problems because every local optimum is a global optimum\
    \ in a convex optimization problem. Therefore, SVM problem is generally formulated\
    \ as a convex optimization problem. Generally, our problem lies in the category\
    \ of Constrained Convex Optimization problem as per the Fig. 2.7. Convex Optimization\
    \ Problem (COP) can be divided into two types: Unconstrained Convex Optimization\
    \ Problem (UCOP) and Constrained Convex Optimization Problem (CCOP). CCOP can\
    \ be further into three types: Equality Constrained (EC), Inequality Constrained\
    \ (IC) and Hybrid Constrained (HC).\n\nGradient-based methods are generally used\
    \ for solving the UCOP problems. CCOP can be converted to UCOP and then gradient-based\
    \ methods can be applied to them. In literature, generally gradient-based methods\
    \ \\[[30](#bib.xhtml#refbib_30)\\] are used for solving the SVM problem with occasional\
    \ use of other methods like Interior Point Methods \\[[41](#bib.xhtml#refbib_41)\\\
    ]. All these methods are taken from the Mathematics, highlighting the inter-disciplinary\
    \ nature of Machine Learning, so it is beyond the scope of this chapter to discuss\
    \ all methods for solving the optimization problems. This section gives an idea\
    \ about SVM solvers and discusses some methods for solving SVM problems. Review\
    \ of SVM solvers can be found in \\[[13](#bib.xhtml#refbib_13)\\], \\[[121](#bib.xhtml#refbib_121)\\\
    ] and for general discussion of optimization methods for large-scale machine learning,\
    \ refer to \\[[16](#bib.xhtml#refbib_16)\\].\n\n![FIGURE 2.7 Different types of\
    \ Optimization problems.](Images/fig2_7.jpg)\n\nFIGURE 2.7 Different types of\
    \ Optimization problems.\n\nLarge-scale problems (SVMs) are solved using iterative\
    \ methods and there is a trade-off between the computational complexity of each\
    \ iteration and number of iterations required by the method to solve problem up\
    \ to the desired accuracy. Generally, smaller the complexity of each iteration,\
    \ slower is the convergence and larger is the number of iterations taken by the\
    \ method to solve the problem \\[85\\]. For example, first order methods (like\
    \ Gradient Descent method) have low iteration complexity (like in Gradient Descent,\
    \ only gradient is calculated) but they converge very slowly and take large number\
    \ of iterations to reach the desired accuracy \\[[118](#bib.xhtml#refbib_118)\\\
    ]. On the other hand, second order methods have high computational complexity\
    \ (like in Newton method, it requires computing and inverting the Hessian matrix)\
    \ of each iteration but they converge very fast and take lesser number of iterations\
    \ \\[85\\] to reach the same level of accuracy.\n\nFor an iterative method, solution\
    \ in the (*k* + 1)^(*t**h*) iteration is given by\n\n$$\\\\begin{array}{l} {w\\\
    _{k + 1} = w\\_{k} + d\\_{k}s\\_{k},\\\\quad d\\_{k} > 0} \\\\\\\\ \\\\end{array}$$\
    \  \n\n(2.37)\n"
