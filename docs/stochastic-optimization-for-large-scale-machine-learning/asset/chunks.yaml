    (3.15)\n\n**Complexity Analysis** The per-iteration complexity for all the methods\
    \ is *O*(*B**v*) (assuming constant mini-batch size *B* and block size *v*), which\
    \ is controllable as per the machine capability, unlike, complexity *O*(*l**p*)\
    \ of GD method which might be infeasible to process. Using same algorithm structure,\
    \ as given in Algorithm 7, per epoch component gradient evaluations for S2GD,\
    \ SVRG and SAAG-II are *l* (calculation of full gradient at start of epoch) +\
    \ 2*l*(2*B**m*, as *B**m* = *l*), but for SAG, SAGA and SAAG-I are 2*l* since\
    \ they maintain full gradient from previous iterations and don't calculate at\
    \ start of epoch. Technically, later case take only *l* gradient evaluations per\
    \ epoch at the expense of saving gradients which need *O*(*l**p*) extra memory\
    \ in general but only *O*(*l*) memory to solve problem given by eq. (3.3).\n\n\
    ## 3.3  Analysis\n\n## 3.4  Numerical Experiments\n\nIn this section, experimental\
    \ results[³](#fn3)\n\n### 3.4.1  Experimental Setup\n\nIn this experimentation,\
    \ logistic regression problem, given in eq.(3.3) is solved. Since BSG and MRBCD\
    \ use SVRG for variance reduction, thus under our experimental settings BSG, MRBCD\
    \ and extension of SVRG to mini-batch and block-coordinate setting become same\
    \ so only SVRG is mentioned in the experiments. All the methods use the same algorithmic\
    \ structure as given in Algorithm (7) with changes only in update rule (variance\
    \ reduction method) at Step 7. All the methods use averaged gradient value for\
