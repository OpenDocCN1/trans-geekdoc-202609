    ## 3.4 数值实验


    在本节中，实验结果³


    ### 3.4.1 实验设置


    在本实验中，求解等式 (3.3) 给出的逻辑回归问题。由于 BSG 和 MRBCD 使用 SVRG 进行方差减少，因此在我们的实验设置下，BSG、MRBCD
    和 SVRG 扩展到小批量和块坐标设置变得相同，因此实验中仅提及 SVRG。所有方法都使用与算法 (7) 相同的算法结构，仅在第 7 步的更新规则（方差减少方法）上有所不同。所有方法都使用平均梯度值进行方差减少，该值要么在时期开始时计算，要么从之前的迭代中维护。为了存储全梯度，仅使用长度为
    `l` 的向量，因为它为每个数据点仅存储常数值，而不是存储完整的梯度向量（后者将占用 `l * p` 的内存空间）。步长使用两种不同的方法计算，即回溯线搜索方法和使用
    Lipschitz 常数确定的常数步长。值得注意的是，在回溯线搜索中对大数据问题使用所有数据点可能非常昂贵，因此回溯线搜索仅在选定的小批量上执行，所有方法的参数值为
    `β = 0.5`（用于减小步长）和 `γ = 0.1`（即，允许目标函数下降 10%）。使用 Lipschitz 常数 `L` 时，所有方法的步长均取为
    `1/L`。需要注意的是，所有实验均在 *单节点，MacBook Air (8 GB 1600 MHz DDR3, 1.6 GHz Intel Core i5,
    256 SSD)* 上进行。对于所有方法，正则化参数设置为 `C = 1/l`。


    ### 3.4.2 相对于时期的收敛性


    ![FIGURE 3.1 线搜索方法（第一行）和常数步长（第二行）的结果。](img/fig3_1.jpg)


    FIGURE 3.1 线搜索方法（第一行）和常数步长（第二行）的结果。


    图 3.1 展示了使用基准数据集的实验结果（数据集详情见表 1.1），采用了不同的小批量和块大小。图表绘制了目标函数值与最优值之差相对于时期数量的曲线。从实验结果中可以得出以下观察：（i）一般来说，SAAG
    方法，即 SAAG-I 和 SAAG-II，收敛速度快于其他求解器，且 SAAG-II 优于所有其他方法。（ii）一般来说，随着小批量和块大小的增加，SAAG
    方法相对于其他求解器表现更好，但对于较小的大小，例如小批量为一个数据点时，它们表现不佳。（iii）使用线搜索方法和使用 Lipschitz 常数确定步长的结果相似，证明了
    SAAG 方法优于其他方法的优越性。（iv）如不同求解器方程所预期，当块大小等于特征数且小批量大小等于数据点数时，即在 GD 方法设置下，所有方法收敛完全相同（由于空间限制，未包含图表）。（v）相对于时间的次优性图表显示了与相对于时期的次优性相似的结果（有关结果请参阅
    子节 3.4.3）。（vi）线搜索结果比常数步长更平滑。此外，线搜索结果对于 SUSY 优于常数步长，但对于其他数据集，常数步长效果更好。主要原因是使用 Lipschitz
    常数获得的步长较大，有时甚至大于一，而线搜索的最大步长为一且不断减小；另一个可能的原因是线搜索在选定的小批量上执行，而不是在完整数据集上执行。（vii）SUSY
    仅有 18 个特征，因此块大小取为特征数量，此外，对于 webspam 使用了所有特征。这些实验构成小批量随机梯度设置，并证明了 SAAGs 在此设置下的有效性，并且可以通过设置
    `v = p` 为此设置获得算法和公式。


    ### 3.4.3 相对于时间的收敛性


    在描绘于 图 3.2 的实验中，目标函数值与最优值之差相对于不同方法的训练时间进行了绘制。如图所示，SAAGs 优于其他方法，与相对于时期数量的结果相似。SAAG-I
