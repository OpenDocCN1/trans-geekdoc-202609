  fmt: "\n# SAG, SAGA, SVRG, S2GD 和 SAAG 方法简介\n\nSAG, SAGA, SVRG, S2GD 和提出的 SAAG 方法是随机梯度的方差减小技术。非常有趣的是，它们的更新规则有非常小的差异，如本节给出的方程所示。所有这些方法都在最新迭代上计算选定小批量的一个部分梯度，这给出了最新的梯度值，即移动的步进方向；在旧迭代上计算选定小批量的一个部分梯度，以及在旧迭代上计算整个数据集的一个部分梯度，这可能无法给出正确的移动步进方向。旧梯度值有助于在期望中减小方差，但可能导致错误的方向。提出\
    \ SAAG 的直觉是给最新梯度值更多的权重，以获得更好的步进方向。因此，我们使用小批量大小划分最新的梯度值，但使用数据点数量划分旧值。SAAG 对足够大的小批量很有用。我们的直觉得到了经验结果的支持，这些结果清楚地表明\
    \ SAAG 优于其他方法。\n\n# SAAG-I 和 SAAG-II 方法\n\n在本节中，提出了两种带有两种训练算法的方法，即 SAAG-I 和 SAAG-II，两者都使用小批量和块坐标设置，即\
    \ BBOF 框架。第一种方法是 SAAG-I，由 eq.(3.10) 给出，并由 [Algorithm 8](#05chap_03.xhtml#algorithm_8)\
    \ 展示，它以 `m`、`s` 和 `n` 作为输入，并将初始解 `w⁰` 和总梯度 `G` 设置为零向量。它随机选择一个不放回的数据点小批量，并像在 BBOF\
    \ 中一样循环选择一个坐标块，并根据 eq.(3.8) 制定一个缩小的子问题，该子问题使用 eq. (3.9) 求解。迭代复杂度非常低，因为它计算选定变量块相对于选定小批量数据点的两个部分梯度，并通过使用前几次迭代计算的平均梯度值来减小方差。参数仅针对选定的坐标块进行更新，其余坐标保持不变。\n\
    \n![](Images/algo8.jpg)\n\nSAAG-II 方法由 eq.(3.11) 给出，并由 [Algorithm 9](#05chap_03.xhtml#algorithm_9)\
    \ 展示。SAAG-II 算法与 SAAG-I 类似，并使用 BBOF 框架为解决大数据问题提供高效且可扩展的解决方案。与后者类似，它在小批量数据点上计算两个部分梯度，并使用在每个时代开始时计算的所有数据点上的一个梯度来进行方差减小。因此，SAAG-I\
    \ 和 SAAG-II 算法之间的区别仅在于平均梯度计算的值，前者从零向量开始保留前几次迭代的值，而后者在每个时代开始时计算完整梯度。\n\n![](Images/algo9.jpg)\n\
    \n# 其他方差减小方法的扩展\n\nSAG, SAGA, SVRG 和 S2GD 是 SGD 设置中众所周知的方差减小方法。SVRG 已扩展到小批量和块坐标设置，用于方差减小，在\
    \ MRBCD \\[152\\] 和 BSG \\[140\\] 中。在本章中，SAG, SAGA 和 S2GD 也扩展到此设置，以便与 SAAG 方法进行比较。为了密切研究所有这些方法在小批量和块坐标设置中的情况，参数更新规则由\
    \ eqs. (3.10–3.15) 给出，其中 `u[v[j]]^(k,i)` 表示在 `i`^th 小批量 `B[i]` 上 `v[j]` 坐标块的 `k`^th\
