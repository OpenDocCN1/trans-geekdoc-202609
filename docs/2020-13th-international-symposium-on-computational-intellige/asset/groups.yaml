    # IV. 结论


    在本文，我们提出了一种用于拉曼光谱降噪的 DL 模型。由于在拉曼光谱重建过程中无法避免绝对噪声，去噪方法可以有效减少拉曼信号的噪声。在分析中，噪声、SNR、RMSE
    和 MAPE 三个评价指标表明，我们的降噪比小波去噪大了 10.2 dB。RMSE 比小波去噪方法小 29.5，MAPE 为 10.9。我们的 DL 去噪方法成功超越了小波去噪方法。尽管两种方法相似，但小波去噪方法处理后的信号峰值优于原始值。


