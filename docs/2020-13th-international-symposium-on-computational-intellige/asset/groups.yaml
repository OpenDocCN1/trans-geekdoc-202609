    小波变换被广泛应用于信号处理。通过正向变换和逆小波变换，它实现了空间（时间）和频率的局部变换。它可以通过伸缩和平移对函数和信号进行多尺度或多分辨率分析，从而更有效地从信号中提取信息。相比之下，输入信号
    $x(t)$ 的小波变换为：


    ```

    $W_{a,b} = \int_{-\infty}^{\infty} x(t)\psi\left(\frac{t-b}{a}\right)dt, \quad
    (2)$

    ```


    其中 $W_{a,b}$ 是 $x(t)$ 的小波变换，$a$ 是尺度因子，$b$ 是位置参数，$\psi^*(t)$ 是小波变换的复共轭。


    我们的方法基于集成方法、Black-James-Stein 错误发现率、极小极大差值估计、Stein 风险无偏通用阈值法对信号进行去噪。该方法实现在 DL
    网络中用于去噪。这里的 4 是矩阶数。根据小波密度，选择小波、规则和去噪噪声的方法还有许多其他选择，实验也尝试了不同的参数。因此，与 DL 去噪方法相比，有许多改进去噪方法，我们可以使用不同的方法进行去噪过程。


    MAPE 衡量预测结果与真实结果之间的百分比，定义如下：


    ```

    $MAPE = \frac{1}{N}\sum\left|\frac{original-forecast}{original}\right|\times100\%,
    \quad (5)$

    ```


    其中 original 是无噪声信号，forecast 代表拉曼信号。


    # III. 结果与讨论


    在本节中，我们对 DL 模型学习的特征进行了可视化处理，特征图展示了 DL 去噪降噪的效果。其次，在相同噪声信号功率的情况下，使用了评价指标对 DL 网络和基于小波的方法进行了对比和评估。通过将拉曼信号和噪声放在一起，以直观地比较去噪信号与原始信号、以及
    DL 网络去噪结果之间的相似性。


    ## A. 实验结果


    由于卷积核的幅度和大小，池化层的方法会影响回归效果。在拉曼信号输入池化层后，DL 网络将提取噪声特征，然后返回去噪后的信号。由于不同效应对噪声的影响不同，拉曼信号池化后的特征图是不同的，因此我们可以从卷积层到池化层中发现这一点。在池化层的某些通道中，噪声频谱显示出了光谱特征。


    ## B. 评价指标


    在本文中，输入信噪比 (SNR)、均方根误差 (RMSE) 和绝对百分比误差被选择为去噪拉曼信号的评价指标。这些指标具有以下特性：噪声与 SNR 反比，输出
    SNR 高于拉曼信号的噪声。RMSE 和 MAPE 与信号质量成正比。当 RMSE 和 MAPE 较大时，说明拉曼信号质量差，原始信号与噪声信号之间的相似性较低。


    ### 1. SNR


    实验使用输入和输出 SNR 来评估输入噪声的幅度，其中 $P_s$ 是信号功率，$P_n$ 是噪声功率。SNR 定义为：


    ```

    $SNR = 10\log_{10}(\frac{P_s}{P_n}), \quad (3)$

    ```


    ### 2. RMSE


    RMSE 计算预测值与真实值之间平方比与样本数量的平方根。RMSE 定义为：


    ```

    $RMSE = \sqrt{\frac{1}{n}\sum(original-forecast)^2}, \quad (4)$

    ```


    其中 original 是无噪声信号，forecast 代表去噪后的信号。


    ### 3. MAPE


