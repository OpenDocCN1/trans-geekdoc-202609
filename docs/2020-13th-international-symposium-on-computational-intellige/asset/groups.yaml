    tool, the wavelet transform is widely used in signal processing. With forward
    transform and inverse wavelet transform is a local transform of space (time) and
    frequency. It can analyze functions and signals in multi-scale or multi-resolution
    through stretching and translation, so it can extract information from signals
    more effectively. In contrast, the wavelet transform of input signal x(t) is:


    ```

    $W_{a,b} = \int_{-\infty}^{\infty} x(t)\psi\left(\frac{t-b}{a}\right)dt, \quad
    (2)$

    ```


    Where $W_{a,b}$ is the wavelet transform of $x(t)$, $a$ is the scale factor, $b$
    is the location parameter, and $\psi^*(t)$ is the complex conjugate of the wavelet
    transform.


