    # I. INTRODUCTION


    Raman spectroscopy is a method widely used to describe the characteristics of
    materials, including industrial process, planetary exploration, environmental
    safety, life sciences, geological investigations, and material science. In all
    cases the Raman spectrum will be mixed with various noises during the process.
    Raman is a powerful tool for analysis of detecting substances, but it is necessary
    to reduce the noise in process of signal acquisition. From the perspective of
    noise reduction, various noise reduction method, such as wavelet method, empirical
    decomposition method, are used to reduce the noise in the signal. With its unique
    characteristics, Raman spectrum has many overlapping peaks and signals. Different
    peaks have gap between peaks and valleys, representing various properties of substances.


    In the past decade, deep learning neural networks (DNNs) have been achieved for
    signal processing. It has found that the performance of a deep neural network
    can be improved with the depth and structure of the neural network.


