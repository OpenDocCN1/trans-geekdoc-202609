    **摘要**—在正常环境下，拉曼光谱经常受到宇宙噪声的干扰。本文提出使用深度学习（DL）对拉曼光谱进行降噪。利用拉曼光谱开发并训练了深度学习网络。所提技术被应用于降噪方法。我们对比了与不同降噪方法的性能。输出信比（SNR）、均方根误差（RMSE）和平均绝对百分误差（MAPE）是性能指标。结果表明，所提降噪方法的
    SNR 大于其他降噪方法，而 RMSE 和 MAPE 分别为 292.63 和 10.99，优于所提技术。


    神经层数具有最大的已知结构，总层数为数百或上千层 [1], [2]。


    DNN 使用卷积层或 LSTM 单元。卷积神经网络（CNN）和循环神经网络（RNN）是两种 DNN 架构，广泛应用于信号处理任务。CNN [3] 的特点是提取空间特征，而
    RNN 的特点是具有良好的序列单元建模能力。在正常情况下，CNN 是一种具有空间结构的分层架构。在 RNN 中，神经元可以在下一个时间步直接激活自己，这正是当时
    $l+1$ 层神经元的输入，也是该时刻该层的输出。因此，使用 DNN 降低拉曼光谱中的噪声已得到证明。


    *关键词*—深度学习，小波，降噪，CNN。


    # I. 引言


    拉曼光谱是一种广泛用于描述材料特性的方法，包括工业过程、行星探测、环境安全、生命科学、地质调查和材料科学。在所有情况下，拉曼光谱在过程中都会与各种噪声混合。拉曼是分析和检测物质的强大工具，但在信号采集过程中有必要降低噪声。从降噪的角度来看，各种降噪方法（如小波方法、经验分解法）被用于减少信号中的噪声。由于其独特特性，拉曼光谱具有许多重叠的峰和信号。不同的峰之间存在峰谷之间的间隙，代表了物质的不同属性。


    在过去的十年里，深度学习神经网络（DNNs）在信号处理方面取得了进展。研究发现，深度神经网络的性能可以随着其深度和结构而提高。


    基于小波的方法用于拉曼光谱且性能优于其他方法。然而，其他因素如过程、不同的小波以及频率和时间也会影响信号处理的性能。经验模态分解不需要分析和使用若干模态分量；但该方法包含两个部分：整个数据，极值点数量和零均值数量通过多次计算得出。局部最小点处的包络平均值由极大点和下包络形成。即上包络和下包络分量对应于时间尺度。


    为了避免这些方法的限制，本文提出了一种用于拉曼光谱降噪的深度学习（DL）网络。由于神经网络是一种噪声回归，它不仅能降低拉曼光谱的噪声，还能检测信号结构。本文的结构如下：第二部分介绍数据集的收集和分布。第三部分介绍
    DL 模型和评估。第四部分讨论基于 DL、CNN 和小波的方法性能。最后一部分是结论。


    # 数据收集与处理


    拉曼光谱数据集的准备将使所有后续步骤的实施更容易。例如，约 190 种危险化学品的无噪声拉曼光谱，由长度为 2051 个数据点的一维信号组成。拉曼光谱主要由荧光和拉曼噪声引起。噪声将直接影响拉曼光谱的质量。由于
    DL 网络的需求，我们需要收集更多的无噪声数据集。拉曼光谱加入了不同噪声水平的基线。然后在基线噪声统计中加入了加性高斯噪声。添加白噪声后获得了约 80 种危险化学品。在表
    1 中，使用了 1390 个和 500 个噪声拉曼数据集进行训练和测试。


    # 1. 训练与测试结果总结


    | 名称 | 数值 |

    |---|---|

    | 危险材料 | 190 |

    | SNR | 0-80 dB |

    | 训练数据 | 1390 |

    | 测试数据 | 500 |


    ![](img/5e61639b711e33985bc7cf48b7ef1f0f_1_0.png)


    图 2 无噪声与噪声拉曼光谱


    # II. 方法与评估


    ### A. 网络


    DL 模型基于神经网络（CNN）在 MATLAB 中实现。神经网络被用于分类特征。本文的结构如下：第二部分介绍数据集的收集和分布。第三部分介绍 DL 模型和评估。第四部分讨论基于
