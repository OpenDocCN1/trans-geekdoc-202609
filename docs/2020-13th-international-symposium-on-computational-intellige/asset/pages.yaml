    **Abstract**—In a normal environment, Raman spectrum often suffers from cosmic
    noise. This paper proposes using deep learning (DL) for noise reduction in Raman
    spectrum. The DL network is developed and trained using Raman spectrum. The proposed
    technique is applied to reduce noise methods. We compare the performance with
    different noise reduction methods. Output-to-signal ratio (SNR), root mean square
    error (RMSE), and mean absolute error (MAPE) are the performance index. It is
    shown that SNR of the proposed noise reduction method is greater than that of
    other noise reduction method while the RMSE and MAPE are 292.63 and 10.99, which
    are much better than the proposed technique.


