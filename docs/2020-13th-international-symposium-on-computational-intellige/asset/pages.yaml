    # A. Experimental Results


    Due to the magnitude and size of kernels in convolution, the method of pooling
    layer will affect the effect of regression. After the Raman signal is fed to the
    pooling layer, the DL network will extract feature of the noise, and then return
    the denoised signal. Because different effect have different effect of noise,
    the feature map after pooling of Raman signal is different, so we can find that
    the pooling layer from the convolution layer. In some channels of the pooling
    layer, the noise spectra have displayed the spectral characteristics.


    # B. Evaluation Index


    In this paper, input noise ratio (SNR), mean square error (RMSE) and absolute
    percentage error are selected as evaluation index of denoised Raman signal. These
    index have the following characteristics: the noise is inversely proportional
    to the SNR, the output SNR is higher than the noise of Raman signal. The RMSE
    and the MAPE are proportional to the signal quality. When the RMSE and the MAPE
    are large, in the Raman signal is quality, and the similarity between the original
    signal and noise signal is lower.


    # 1.SNR


    The experiment uses input and output SNR to evaluate the magnitude of input noise
    $P_s$ is the signal power and $P_n$ is the noise power. SNR is defined as:


    ```

    $SNR = 10\log_{10}(\frac{P_s}{P_n}), \quad (3)$

    ```


    # 2.RMSE


    RMSE calculates the square root of the ratio of the square between the predicted
    value and the true value and number of sample samples. RMSE is defined by,


    ```

    $RMSE = \sqrt{\frac{1}{n}\sum(original-forecast)^2}, \quad (4)$

    ```


    where original is the noiseless signal and forecast represents the denoised signal.


