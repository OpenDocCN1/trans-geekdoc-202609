    *Keywords*—Deep learning, wavelet, noise reduction, CNN.


    # I. INTRODUCTION


    Raman spectroscopy is a method widely used to describe the characteristics of
    materials, including industrial process, planetary exploration, environmental
    safety, life sciences, geological investigations, and material science. In all
    cases the Raman spectrum will be mixed with various noises during the process.
    Raman is a powerful tool for analysis of detecting substances, but it is necessary
    to reduce the noise in process of signal acquisition. From the perspective of
    noise reduction, various noise reduction method, such as wavelet method, empirical
    decomposition method, are used to reduce the noise in the signal. With its unique
    characteristics, Raman spectrum has many overlapping peaks and signals. Different
    peaks have gap between peaks and valleys, representing various properties of substances.


    In the past decade, deep learning neural networks (DNNs) have been achieved for
    signal processing. It has found that the performance of a deep neural network
    can be improved with the depth and structure of the neural network.


    Wavlet based method used for Raman spectroscopy and the performance is better
    than other methods. However, there are also other factors such as process, different
    wavelet and frequency and time will lead to the performance of signal processing.
    Empirical mode decomposition does not need to analyze and use several mode component(s);
    However, the method has two components: the whole data, the number of extreme
    points and the number of zero-mean points is calculated by more than one. The
    average value of the envelope over the local minimum point is formed by the maximum
    point and the lower envelope. That is, the upper and lower envelope components
    correspond to the time scale.


    To avoid the constraints of these methods, this paper proposes the deep learning
    (DL) network for noise reduction in Raman spectroscopy. Because the neural network
    is a noise regression, it can not only reduce the noise of Raman spectrum but
    also detect the signal structures. The structure of this paper is as follows:
