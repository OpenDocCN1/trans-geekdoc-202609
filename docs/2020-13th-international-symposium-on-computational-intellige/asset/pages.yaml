  md: '# IV. CONCLUSION


    In this paper, we propose a DL model for noise reduction of Raman spectra. Since
    the absolute noise cannot be avoided in the process of Raman spectrum reconstruction,
    denoising method can effectively reduce the noise of Raman signal. In analyzing,
    the three evaluation indicators of noise performance, SNR, RMSE, and MAPE, show
    that our noise reduction is 10.2 dB larger than that of wavelet noise signal.
    RMSE is smaller than wavelet noise denoising method 29.5, and MAPE is 10.9. Our
    DL denoising method has successfully surpassed the wavelet denoising method in
    noise reduction. Although the two methods are similar, the peak values of the
    signal processed by the wavelet denoising method are better than the original
    Raman spectrum.


    # B. Discussion


    The performance of our denoising method is compared with DL based. Because wavelet
    denoising method has a high position in the process of noise signal, and because
    of the better ability of DL to learn the noise and the signal simultaneously.
    Wavelet denoising method is better than DL method in terms of output. In Fig.
    7, of the original Raman spectrum, the DL denoising method is compared with signal
    with the best denoising effect of wavelet. However, we find that DL has better
    noise reduction than other methods. Different sizes of noise are almost entirely
    removed. We find that the signal processed by wavelet denoising still has some
    noise, some noise peaks near those of signal-value peak.


