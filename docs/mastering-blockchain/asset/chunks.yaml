    What technical Skills are needed to become a Blockchain Developer? There are two
    parts of the answer:


    ## Part 1: You need to be a Developer


    If you are a developer, jump to part 2. The developer always (not always) think
    about breaking the problem logically and quantifying the data. Have an understanding
    of fundamental programming including `OOPs`, procedural language, flat and relational
    database. Understanding of Data Structures is a must have skills to learn any
    technу. Understanding of Data Structures including `Stack`, `Queues`, `LinkedList`,
    `Tree`, and `Hedera HashMaps`. You should also understand the time and resource
    complexity of querying a data structure. As blockchain technology is decentralized,
    it also means you should be writing very efficient code, which means not consuming
    processing, memory or network bandwidth. Bad code is just too expensive in the
    decentralized architecture. Understanding of basic architectures like `MVC`, `MVVM`,
    `Document-View Architecture`, `Microservices` could help in deeply understanding
    the differences between convention and Decentralized architecture. Also, learn
    fundamentals of Communication Architecture including but not limited to `Publisher
    subscriber`, a `Message broker`, `Bus architecture` will be useful. Most importantly,
    you should be comfortable with any one of the programming language. It could be
    `C`, `C++`, `JavaScript` or anyone that you can learn. I believe that the programming
    language itself doesn''t matter.


    ## Part 2: Becoming a Blockchain developer


    You don''t need anything specific to learn blockchain. Although having an understanding
    of centralized and distributed network will help you understand what value does
    decentralized architectures as Blockchain brings to the table. To start coding
    an application on the blockchain, in 2019, I will pick a platform like `Hyperledger`,
    `Ethereum`, `EOS` or `Hedera`. Hyperledger has various versions which comes with
    it’ own benefits and use cases. Pick the right one. Also, writing `dApps`, you
    should also understand the difference between Blockchain and `DAG`. As both has
    a different approach to programming. The coding on blockchain is not complicated
    as the underlying technology works of its own, and you are mostly writing your
    business layer in `Java`, `JavaScript`, `Go` most of the time. Most matured blockchain
    platforms has `SDK` for different programming languages.


    ## Steps To Get Started With Blockchain


    Since its first implementation in 2009, we have seen `Bitcoin` adoption spread
    across different countries and become a serious competitor to traditional financial
    transactions, creating new businesses for both corporations and governments. As
    a tech savvy country and one of early adopters of bitcoin, Australia has seen
    considerable interest in blockchain technology that bitcoin and other currencies.
    Just in the past months we have seen Australian startup claiming to have created
    the first local blockchain and Australia Post has begun looking into use in areas
    of identity. And a few days ago, Commonwealth Bank used blockchain as first global
    transaction with Wells Fargo. Although it is still relatively new technology and
    inevitably concerns, financial services in Australia should be investigating the
    potential of blockchain. Here are financial institutions should consider:


    ### Build a team to understand the applications and implications of blockchain

    Blockchain is a data structure enabling the creation of a digital ledger of transactions
    among a distributed network of computers. By using `cryptography`, blockchain
    allows each participant on the network to manipulate the ledger in secure way,
    without need for a central authority. At a time when companies face new challenges
    in data management and security, blockchain has emerged as a way to securely and
    instantly verify transactions on a network. The technology underlying cryptocurrency
    is building undeniable momentum, with the potential for significant impact on
    financial services, businesses, and society at large. Quickly gaining a reputation
    as the “Internet of finance”, blockchain provides the digital ledger that enables
    `Bitcoin`, `BitShares`, `Ethereum`, `Ripple` and hundreds of their currencies
    to transfer assets quickly, reliably and securely. Getting banks and insurance
    providers to share blockchain’s potential within their organisation can uncover
    new approaches, use cases, and ways to transform the way they do business and
    work internally. The first step begins with identifying and involving a core set
    of evangelists and seeding them within the business so they can evaluate each
    project to assess the relevance of blockchain and other innovative technologies.


    ### Understand the impact of blockchain on processes and investments

    When building awareness of blockchain within a financial services institution,
    it is important to acknowledge the opportunities, but also risks and limitations
    of this technology. This is useful for learning how blockchain can improve processes
    by reducing investments. As technology matures, blockchain has potential to impact
    business areas. This is for learning about blockchain and de-risking processes.
    This is useful is for internal.

    Financial services in Australia should be investigating potential of blockchain
    aspects of business.


    ### Find a point of interest

    A good way for spreading word about blockchain to a broader audience. Perform
    a small Proof of Concept (PoC)

    A PoC provides a relatively safe setting to succeed or fail fast and reap learning
    benefits. The lessons from an internal PoC should allow your teams to identify
    precise business requirements before expanding the reach of this technology.


    Working with partners or a consortium

    For organisations already part of a consortium, or those considering one, expectations
    should be defined very carefully. Typically, actively participating in a consortium
    will deliver significantly more value than simply adding an organisation’s brand
    to a list of names.

