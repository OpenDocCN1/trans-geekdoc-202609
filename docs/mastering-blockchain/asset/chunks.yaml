    # 加密货币投资技巧


    作为一名新的加密货币投资者，当你脱下鞋子开始在区块链之路上迈出第一步时，你可能发现自己一直在问以下问题：比特币泡沫真的破灭了吗？现在开始还太晚吗？在这一新兴投资领域获得成功的最佳建议是什么？当你反复问自己这些以及许多其他问题时，你可能已经注意到加密货币在过去一年中面临着长期的熊市，而上个月是比特币自
    2011 年以来表现最糟糕的一个月。从更长的历史视角来看，我们看到这只是最近的一个熊市，在此之前还有很多类似的熊市。同样，每一个熊市之后都有牛市；这是一个永恒平衡的无尽循环，类似于道家的阴阳之道。因此，尽管近期出现了大幅下跌，但加密货币远未到终结，通往加密货币投资涅槃的道路比以往任何时候都更加坚定。事实上，证券平台
    SharesPost 报告说，72% 的加密货币投资者计划在未来几个月内增加持仓。因此，你应该预料旅程中的某些波折，并据此收拾行李。与任何成功的旅行一样，准备得越充分越好。在本文，我们将为你提供必要的八条技巧，以达到理想的加密货币投资启悟状态。


    ## 选择备用的个人电子邮箱


    使用普通的邮箱账户会使投资者面临不必要的数据泄露风险的风险。为了克服这种风险，建议创建一个专门用于交易的独特账户，并增加额外的双重身份验证密码保护。无论如何，请确保对每个提供双重身份验证的服务都使用该功能（例如，你的邮箱账户和交易所账户都应该要求双重验证才能访问）。同样，请确保使用专用的双重验证应用程序（如
    `Google Authenticator` 或 `Auth`），而不是使用短信进行双重验证（短信容易受到社交工程学攻击）。此外，在设置账户时，务必选择唯一的用户名和密码，且不要包含任何让黑客可以追溯到你的个人身份信息。


    ## 避免糟糕的交易或投资策略


    新手加密货币投资者的一个常见错误是加入所谓的“拉高操控”（pump and dump）群体。某些社交社区或导师甚至提供关于特定代币的投资建议。你应该避免这类地方；当旅行者坠落时，他们通常不会回头。问题在于，衍生品交易是零和游戏，总会有赢家，但更重要的是输家。无损交易或投资是虚幻的，请听从这种建议会让你迅速亏钱。如果你对学习更多加密货币交易和算法策略感兴趣，请查看我们关于
    Alpha Predict Model 的系列。


    ## 做好尽职调查


    在现代数字时代，既然通往加密货币启悟的道路存在，就没有理由在对底层原理了解很少的情况下投资。几乎所有的硬币都可以网上轻松获取。就像车里要有地图一样，旅行者必须做好准备。从交易频繁的品种到最小众的品种，All
    Crypto 等资源将帮助任何个人完善对潜在投资的认知。如果无法判断某种硬币如何运作和盈利，那么寻找其他投资是明智的。从最大的代币发行（ICOs`）到最小众的代币，这个网站将为你提供支持。


    ## 忽略“噪音”


    媒体和金融领域的许多唱反对者宣称加密货币仅仅是一种时尚、过度炒作的投机，甚至是金字塔骗。另一方面，越来越多的人拥抱加密货币资产的金融前景和实际应用。双方的声音都很大，并且喜欢制造很多噪音。这种噪音水平预计只会增加，因为
    Stairs 预测个人投资者的加密货币交易活动将在 2019 年增长 50%。要在这一领域成为成功的投资者，最好的办法就是买入并持有你相信的东西，同时忽略周围所有的噪音。不要将所有的加密货币放在一个篮子里。在进行加密货币投资时，常见的投资原则是适用的：多元化是关键。正如财务顾问建议在多种类型的股票和其他投资中建立仓一样，多元化对于任何健康的加密货币组合来说也至关重要。你已经做了研究，现在请抓住机会投资多种硬币。例如，你可以跨越不同领域进行投资。就像车里要有地图一样，旅行者必须做好准备。从交易频繁的品种到最小众的品种，All
    Crypto 等资源将帮助任何个人完善对潜在投资的认知。如果无法判断某种硬币如何运作和盈利，那么寻找其他投资是明智的。


