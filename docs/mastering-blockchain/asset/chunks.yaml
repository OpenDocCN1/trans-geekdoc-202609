    成为区块链开发者需要哪些技术技能？答案包含两个部分：


    ## 第一部分：你首先需要是一名开发者


    如果你是一名开发者，请跳到第 2 部分。开发者总是（并非总是）会考虑从逻辑上拆解问题并对数据进行量化。理解基础编程，包括 `OOPs`、过程化语言、扁平数据库和关系型数据库。理解数据结构是学习任何技术的必修技能。数据结构理解包括
    `Stack`、`Queues`、`LinkedList`、`Tree` 和 `Hedera HashMaps`。你还应该理解查询数据结构的时间和资源复杂度。由于区块链技术是去中心化的，这意味着你必须编写非常高效的代码，意味着不消耗处理器、内存或网络带宽。在去中心化架构中，糟糕代码的成本太高了。理解
    `MVC`、`MVVM`、`文档-视图架构`、`微服务`等基础架构有助于深入理解约定与去中心化架构之间的差异。此外，学习通信架构的基础知识（包括但不限于 `发布者订阅模式`、`消息代理`、`总线架构`）将很有帮助。最重要的是，你应该精通任何一种编程语言。它可以是
    `C`、`C++`、`JavaScript` 或任何你能够学会的语言。我认为编程语言本身并不重要。


    ## 第二部分：成为区块链开发者


    学习区块链不需要任何特定的东西。尽管理解中心化和分布式网络将帮助你理解区块链等去中心化架构带来了什么价值。为了在 2019 年开始在区块链上编写应用程序，我会选择诸如
    `Hyperledger`、`Ethereum`、`EOS` 或 `Hedera` 等平台。Hyperledger 有多个版本，每个版本都有自己的优势和用场景。选择正确的一个。此外，在编写
    `dApps` 时，你应该理解区块链和 `DAG` 之间的区别，因为两者的编程方法不同。区块链上的编码并不复杂，因为底层技术会独立运行，你大部分时间都在使用
    `Java`、`JavaScript` 或 `Go` 编写业务层。大多数成熟的区块链平台都为不同的编程语言提供了 `SDK`。


    ## 开启区块链的步骤


    自 2009 年首次实现以来，我们看到 `Bitcoin` 的采用扩展到不同国家，并成为传统金融交易的有力竞争者，为企业和政府创造了新业务。澳大利亚作为一个技术先进的国家和比特币的早期采用者之一，对区块链技术（包括比特币和其他货币）表现出了极大兴趣。在过去的几个月里，我们看到澳大利亚初创公司声称创建了第一个本地区块链，澳大利亚邮政开始研究在身份识别领域的应用。几天前，联邦银行使用区块链与富国银行（Wells
    Fargo）进行了首笔全球交易。尽管这仍然是一项相对新的技术且不可避免地存在疑虑，澳大利亚的金融服务行业应当调查区块链的潜力。以下是金融机构应该考虑的方面：


    ### 组建团队理解区块链的应用和影响

    区块链是一种数据结构，能够在分布式计算机网络中创建交易的数字账本。通过使用 `cryptography`，区块链允许网络上的每个参与者以安全的方式操纵账本，而无需中央权威。在公司面临数据管理和安全新挑战之际，区块链已成为一种在网络上安全且即时验证交易的方式。加密货币的底层技术正在积累不可忽视的势头，可能对金融服务、业务和整个社会产生重大影响。区块链迅速赢得了“金融互联网”的美誉，提供的数字账本，使得
    `Bitcoin`、`BitShares`、`Ethereum`、`Ripple` 以及数百种货币能够快速、可靠且安全地传输资产。让银行和保险提供者在组织内部共享区块链的潜力，可以发现新的方法、用例以及转变其业务模式和内部工作方式。第一步是从识别并引入一组核心布道者，并将他们播种到业务中，以便他们评估每个项目，并评估区块链及其他创新技术的关联性。


    ### 理解区块链对流程和投资的影响

    在金融服务机构内部建立区块链意识时，承认这项技术的机遇以及潜在的风险和局限性至关重要。这对于学习区块链如何通过减少投资来改进流程很有用。随着技术的成熟，区块链具有影响业务领域的潜力。这有助于了解区块链并进行去风险流程。这对于内部而言非常有用。

    澳大利亚的金融服务行业应该调查业务中区块链的潜力方面。


    ### 找到兴趣点

    向更广泛的受众传播区块链信息的好方法是进行一个小型的概念验证 (PoC)。

    PoC 提供了一个相对安全的环境，以便快速成功或失败，并获得学习益处。内部 PoC 的教训应该让你的团队在扩展该技术范围之前识别出精确的业务需求。


    与合作伙伴或财团合作

    对于已经是财团成员或正在考虑加入加入的组织，应该非常仔细地定义预期。通常，积极参与财团所提供的价值远大于仅仅将组织的品牌添加到名单中。


