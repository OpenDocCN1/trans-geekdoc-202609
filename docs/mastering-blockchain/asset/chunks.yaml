- fmt: '

    # Blockchain Wallet


    Blockchain Wallet is a digital wallet that allows users to manage bitcoin and
    ether. Blockchain Wallet is provided by Blockchain, a software company founded
    by Peter Smith and Nicolas Carey.


    ## Breaking Down Blockchain


    E-wallets allow individuals to store cryptocurrencies. In the case of Blockchain
    Wallet, users can manage their balances of two cryptocurrencies: bitcoin and ether.
    Creating an e-wallet with Blockchain Wallet is free, and the account setup processes
    done online. Individuals must provide an email address and password that will
    be used to manage the account, and the system will send an automated email requesting
    that the account be verified. Once the wallet is created, the user is provided
    with a Wallet ID, which is a unique identifier similar to a bank account number.
    Wallet holders can access their e-wallet by logging into the Blockchain website,
    or by downloading and accessing a mobile application. The Blockchain Wallet interface
    shows the current wallet balance for both bitcoin and ether tokens, and displays
    the user’s most recent transactions. Users can send a request to another party
    for a specific amount of bitcoin or ether, and the system generates a unique address
    that can be sent to a third party or converted into a QR code. A unique address
    is generated each time the user makes a request. Users can also send bitcoin or
    ether when someone provides them with a unique address. The send/receive process
    is similar to sending or receiving funds but with cryptocurrency. Users can also
    sell bitcoin. Users are shown the exchange rate based on how long the user takes.
    Bank transfers do not appear in wallet as it may take several days before bitcoin
    are received. Buy sell services are not available in all locations. To make a
    purchase a user must either transfer from bank or can use credit card. Using credit
    card provides instant access but incurs a larger fee (e.g., 3%).


    ## Security


    Wallet security is an important consideration for users, as having one’s account
    illegally accessed may result in the user losing bitcoin and ether. Blockchain
    Wallet has three levels of security:


    - **Level 1 Security**: Designed to prevent users from losing access. It allows
    users to verify their email address, create a 12-word backup recovery phrase that
    can be used if a password is forgotten, and set up a password hint (Blockchain
    does not store the password).

    - **Level 2 Security**: Designed to prevent others from gaining unauthorized access
    to the wallet, and includes linking a phone number to the account to receive a
    one-time password when the account is logged into, and creating two-step authentication.

    - **Level 3 Security**: Allows users to block Tor requests.

