    # Blockchain And The Future Of Finance


    What if everyone involved in a financial transaction could share the same ledger—and
    it was always up to date? No need for reconstructions, with simultaneous settlements
    immediately available to all participants, and instant visibility into accounts
    receivable, the supply chain and virtually all relevant transactions.


    ## A Finance Windfall


    The potential benefits for CFOs and their finance teams are compelling: New levels
    of data transparency, faster access to information and features like “smart contracts”
    will bring significant changes to financial operations. Among other things, the
    recent report from KPMG analysts identified the following benefits:


    *   **Increased efficiency**: A single ledger that’s continuously synchronized
    throughout a network eliminates the need for reconstructions. KPMG research suggests
    as much as a 40 percent increase in efficiency due to straight-through, “single
    version of the truth” processing.

    *   **Reduced loss and fraud**: Immutable records visible to all participants
    may improve data accuracy and security. This can help reduce the risk of fraud
    and show compliance through an audit trail.

    *   **Improved customer experience**: Using blockchain to share information with
    clients and vendors may allow companies to serve customers more quickly and even
    find new sales opportunities. KPMG research predicts a 25 percent improvement
    in customer experience due to faster processing and use of digital channels.

    *   **Higher availability of capital**: According to KPMG analysis, blockchain
    technology will reduce capital consumption due to quicker settlement of trades,
    straight-through processing, and freed-up capital flows.


    ## A New Future for CFO


    Blockchain is also going to have significant impact on financial operations. The
    KPMG analysts who have been studying the technology anticipate these key trends:


    *   **Work with existing systems**: Blockchain will not replace current ERP systems
    overnight. However, it may take time to fully realize the benefits of blockchain''s
    real-time view of data.

    *   **Go private, then public**: Finance organizations will start with private
    blockchains to retain sensitive data, but could eventually add permissioned blockchains
    for industry partners and even customers.

    *   **Mind the regulation gap**: It''s going to take time for government regulators
    to understand the technology and its decentralization of financial activities.


    ## Evaluating Blockchain for Your Business


    Blockchain will have a big impact on core processes: Quote-to-cash, source-to-pay,
    and acquire-to-retire processes will be affected. But blockchain is not the latest
    new. It’s important for CFOs and executives to add a number of questions about
    how blockchain makes sense for their businesses, including:


    *   What types of transactions are best handled by blockchain?

    *   What kind of infrastructure or new equipment will be required?

    *   Who will manage a blockchain and participants?

    *   How can blockchain technology manage risk?

    *   What are regulations?


    ## Blockchain Business Opportunities


    Understanding how blockchain can be used in businesses is like hitting a moving
    target. The use cases just coming. The blockchain uses include the following:


    *   Banking

    *   Smart Contracts

    *   Connected Car

    *   Healthcare

    *   Internet of Things

    *   Identity

    *   Marriage Certificates

    *   Insurance

    *   Food Safety


    Let’s get started. Banking Nevermind that blockchain — the backbone of Bitcoin
    — was created to circumvent financial institutions. Or that banks originally feared
    if unregulated went mainstream. Blockchain, it seems, now has a new friend, and
    it is none other than global banking system. USC is a digital currency created
    by Switzerland’s UBS bank, in conjunction with UK-based Barclays. By exploiting
    the benefits of blockchain technology, USC expects to make it faster and safer
    for central banks to settle.


    ## Blockchain Brings Banks Together


    In 2017, a consortium of the world’s largest banks joined forces to exploit the
    benefits of blockchain technology. The consortium, known as the Unity Settlement
    Coin (USC), includes the following member banks: Wall Street Getting Chain Up
    While Wall Street has formed its own blockchain consortium, The Wall Street Blockchain
    (WSBA). WSBA is a non-profit trade organization dedicated to helping participants
    adopt distributed ledger technology and smart contracts. By educating financial
    firms on blockchain technology, WSBA helps financial institutions to confidently
    and competently adopt blockchain solutions. The full-court adoption of blockchain
    by major banks and Wall Street firms represents a tremendous opportunity for blockchain
    development in the financial industry. Now that banks have decided that they had
    stop fighting blockchain technology and start adopting it, the door is wide open
    for companies that can provide blockchain solutions to financial institutions
    large and small.


