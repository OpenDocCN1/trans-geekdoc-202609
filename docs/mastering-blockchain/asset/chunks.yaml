  trans: '


    # Hyperledger Sawtooth

    这是一个由英特尔（Intel）开发的模块化区块链套，使用了一种名为时间证明（PoET）的新共识算法。


    # Hyperledger Iroha

    Iroha 是几家日本公司合作的项目，旨在创建一个易于集成的区块链框架。


    # Hyperledger 项目

    Hyperledger 的“伞伞策略”孵化并推广了一系列区块链技术、框架、库、接口和应用程序。目前，Hyperledger 是以下项目的宿主：


    *   **Hyperledger Burrow**: 该项目根据以太坊的规范开发了一个许可级智能合约虚拟机。

    *   **Hyperledger Composer**: 一个用于构建区块链网络的工具。

    *   **Hyperledger Explorer**: Hyperledger Explorer 是一个区块链模块，也是 Linux 基金会托管的 Hyperledger
    项目之一。它旨在创建一个用户友好的 Web 应用程序，可以查看、调用、部署或查询区块、交易及相关数据、网络信息（名称、状态、节点列表）、链码和事务族，以及存储在账本中的任何其他信息。

    *   **Hyperledger Indy**: Hyperledger Indy 是一系列用于基于区块链的数字身份的工具、库及其他组件。

    *   **Hyperledger Cello**: 一种区块链即服务（BaaS）部署模型。


    除了这些框架项目，Hyperledger 还有几个工具项目，旨在让区块链的访问和开发更加简单高效。Hyperledger 显然参与了广泛的非货币区块链领域。但对这些项目的看法必须保持区别，因为这些短描述并未超出关键词。因此，我们来仔细观察两个最著名的项目：Sawtooth
    和 Fabric。这两个项目都由大型公司（英特尔和 IBM）创建，并作为开源代码交给 Hyperledger。通过 Hyperledger，这些项目持续向前推进，欢迎每个人做出贡献。


    ## Sawtooth (英特尔)

    Sawtooth 是英特尔的模块化区块链。它用 `Python` 编写，适用于从物联网到财务等许多领域的用例。Sawtooth 的特点是它同时支持许可和非许可应用程序，并使用了一种名为时间证明（PoET）的新开发算法。`PoET`
    使用了新的 CPU 指令，这些指令在英特尔等新型处理器中可用。通过这些指令，`PoET` 确保安全且随机地选择所谓的“领导者”。这可以与比特币挖矿相比，矿工竞争一次性写入区块链的权限。与比特币的证明算法不同，`PoET`
    不需要特殊的挖矿硬件。要成为领导者，每个“验证者”（等同节点或矿工）都需要使用安全的 CPU 指令来请求等待时间。等待时间最短的验证者将被选为领导者。就像所有优秀的挖矿算法一样，PoET
    的工作原理像彩票，获取区块链权限是代价。除了加密货币外，领导者没有奖励。这只是运行软件的一部分。因此，不会出现像加密货币那样的消耗能量的竞争。每个节点都可以使用其
    CPU —— 只要它是新型号，并且可能来自英特尔 —— 就可以免费参与领导者的选择。比特币中的挖矿仅仅是 Sawtooth Lake 软件中一个非侵入性的部分。


    Sawtooth Lake 的另一个创新是交易的构建和传播。客户端构建交易并提交给验证者。他们将获得的交易封装在一个批次中并共同提交到状态。这与加密货币矿工将交易封装成区块的过程相似但不完全相同。通过这种批处理，Sawtooth
    解决了相互依赖的交易的安全验证问题。


    迄为止，Sawtooth 已在多个应用中通过测试。它被测试用于使用物联网传感器记录海鲜从海洋到餐桌的历程，并在从渔民到超市的整个供应链中跟踪所有权、占和参数。买家可以访问海鲜活链的完整且信任的记录。这种在供应链和产品历史中的用例在区块链领域正被日益讨论。Sawtooth
    还被测试用于简化债券转移流程。开发人员创建了一个用户界面来跟踪和转移债券。通过该界面，用户可以在区块链上管理整个债券组合。目前测试的另一个 Sawtooth
    用例是数字资产。开发人员构建了一个在 Sawtooth 区块链上管理数字资产所有权的平台，该平台能够管理广泛的数字资产。该 Sawtooth 应用连接点似乎是构建在区块链上的任何类型的数字资产市场，并且该市场已经为用户提供了图形界面。


    '
- fmt: '

    # Hyperledger Fabric


    Maybe the most interesting project in the Hyperledger family is IBM’s Fabric.
    Rather than a single blockchain, Fabric is a base for the development of blockchain
    based solutions with a modular architecture. With Fabric different components
    of Blockchains, like consensus and membership services can become plug-and-play.
    Fabric is designed to provide a framework with which enterprises can put together
    their own, individual blockchain network that can quickly scale to more than 1,000
    transactions per second.


    ## What is Fabric and how does it work?


    The framework is implemented in Go. It is made for enabling consortium blockchains
    with different degrees of permission. Fabric heavily relies on a smart contract
    system called `Chaincode`, which every layer of the networks runs in `Docker`
    containers. An overview of Fabric’s technology can be found in the manual. While
    not completely and generally permissioned, Fabric allows enterprises to make parts
    of the blockchain, if not all, permissioned. Participants usually need to register
    to get the permission to join and issue transactions on a Fabric based blockchain.


    To use resources more efficiently, Fabric has fewer nodes than a public chain
    and computes data massively in parallel, which makes Fabric scale much better
    than public blockchains. Also its basic architecture supports confidential data,
    giving its members more privacy as they find on a public blockchain. Maybe most
    important is the separation between so-called “Endorsers” and “Consensus Nodes”.
    If you are familiar with cryptocurrencies like Bitcoin you will recognize the
    separation between miners and nodes. The Endorsers have the state, and build,
    validate and propagate transactions and chaincode, while the Consensus Nodes orders
    the already validated transactions. While this separation has not been a concert
    of the first blockchain concept of Satoshi Nakamoto, but became an undesired reality
    in most cryptocurrencies, Fabric is one of the first to make this separation a
    design principle. This enables Fabric for example to implement a better division
    of labour, so that not every peer of the network has to do every job. While having
    no native currency, Fabric allows the user to define assets from client side and
    use them with the Fabric Composer.


    Fabric’s Chaincode Smart Contracts framework is similar to Ethereum: Chaincode
    defines the business logic of assets, the rules for reading and altering the called
    state of the assets. Like Ethereum Fabric maintains not a set of unspent outputs
    as Bitcoin maintains, but state of the blockchain which is not restricted to transactional
    data. Other than public blockchains of cryptocurrencies Fabric allows participants
    to build a private channel for their assets and segregate transactions and ledger.
    With this method, chaincode needed to read and alter state will only be installed
    on peers involved in this channel. Like good Fabric’s blockchains allow the user
    to participate in both public and private. Beyond this alternative design for
    public blockchains Fabric uses public infrastructure to generate certificates
    tied to organizations and users. So it is possible to restrict data channel access.
    Fabric’s strength seems to be the high grade of flexibility and privacy while
    enabling scalability through more advanced division of network. For IBM Fabric
    serves as flagship project for blockchain development. The IT giant uses Fabric
    for variety of own projects and for collaboration with several partners. In March
    2017 IBM launched IBM Blockchain, a service that enables developers to “quickly
    build and host security-rich production blockchain networks on the IBM Cloud.”
    With this, IBM catches up with Microsoft, which integrated blockchains in its
    Azure Cloud.


    Blockchain foray into the IT industry with Bitcoin changed the way world saw online
    transactions. As Blockchain got popular, people realized that Blockchain can be
    beyond Bitcoin. Over the years, various industries such as Healthcare, Real Estate,
    Politics, etc., have been trying to adopt Blockchain Technology. And because every
    industry works uniquely, Blockchain had to evolve into different types. In this
    book, I will explain different types of Blockchain and their fundamentals.


    ### Bitcoin


    Bitcoin is one of the most popular Cryptocurrencies. Bitcoin is a way of making
    an online monetary transaction without any intermediaries. Suppose you want to
    send some Bitcoin from account to another. You use the `Account ID` of the recipient
    to transfer Bitcoin. The transaction is sent to be validated by Blockchain Mining
    to avoid fraud. After the transaction is validated and verified, the transaction
    is added to the Blockchain block and the recipient receives the Bitcoin. When
    it comes to cryptocurrencies like Bitcoin, anybody should be able to access it,
    make transactions and be a validator. That’s why Bitcoin has no restrictions on
    who can access it.


    ### Multich


    Multich is an application of Blockchain that is used by organizations to enhance
    security. By setting up a Multich, you can prevent unauthorized access to sensitive
    data. Here, the Blockchain is not available to the public, it is restricted only
    to people of the same organization. In case you own organization and decide to
    store data, you wouldn’t want this to be public. In such applications, the nodes
    that join the network are restricted to authorized.

