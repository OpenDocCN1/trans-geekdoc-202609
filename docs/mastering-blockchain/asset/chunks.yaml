    # Ways Banks Can Benefit From Blockchain Technology


    ## Introduction

    A few fintech technologies have disrupted the banking industry more than blockchain.
    Developed as the database platform for Bitcoin, blockchain technology has matured
    into a viable alternative to traditional channels of financial transactions. Once
    banks realized that they could either find ways to utilize blockchain technology
    or else they would be circumvented by it, they began exploring how blockchain
    solutions for banking might allow them to remain relevant.


    Yes, the banking industry has finally succumbed to the blockchain revolution,
    creating a wealth of opportunities for the innovative blockchain developer. In
    this article, we will look at five ways banks can benefit from blockchain technology.
    Where conventional financial transactions are facilitated by centralized financial
    institutions, a blockchain is a decentralized system in which encrypted transactions
    are entered into a ledger that is shared by multiple parties. A greatly simplified
    explanation of how blockchain transactions work is as follows:


    *   The transaction is encrypted and added to a distributed ledger.

    *   Multiple parties with access to the shared ledger verify the details of the
    transaction, without compromising the identity of those involved.

    *   Verified transactions are added as a permanent, irrevocable part of the shared
    ledger.

    *   The transaction is completed.


    Because only verified "blocks" of transactions can be added to the ledger, there
    is no need to re-examine the authenticity of any transaction once it has been
    verified and entered into the ledger. Let us now look at how blockchain is impacting
    the banking industry.


    ## Faster Transactions

    Since blockchain moves assets, such as money, by mere ledger entries, banks can
    use blockchain technology to reduce the time required to settle transactions.
    Rather than taking the traditional 1-3 days to verify fund transfers, customers
    can receive verification in hours or minutes. As the blockchain technology for
    banking applications matures, transactions will occur in real time.


    One of the strengths of blockchain is the elimination of duplicate data. Even
    though multiple parties have copies of the shared ledger, they all have the exact
    same copy. The same data never exists in more than one location — the shared ledger,
    so there is less need for the bank to reconcile accounts. One company that has
    capitalized on blockchain technology to capture a share of the banking industry
    is Ripple, which assists banks with processing international payments. The company’s
    proprietary real-time settlement system (`RTGS`) is built upon a modified blockchain
    model. Ripple is just one example of helping banks bridge the divide between systems
    and distributed ledger.


    ## Improved Security

    Shared ledgers can help banks secure information in a few ways. First, since blockchain
    enables transactions to be completed much faster than possible with centralized
    systems, there is less time to intercept or capture information. Second, in some
    models, two security keys exist for each transaction: a public key that is available
    to every user and a private key that is shared only with parties. The public key
    can be used to view a user’s account balance and history, but it cannot be used
    to identify the owner or to change their record. The private key is linked to
    the user’s account and can only be used once. Even if a hacker could steal the
    private key and decrypt it, it would not enable them to make further transactions.
    Furthermore, each ledger entry, once verified, becomes an immutable and unchangeable
    part of the ledger’s chronicle, which all users have a copy of. The only way to
    change data in a shared ledger would be to somehow access user’s copy at the same
    moment and make the same change in each. And that isn’t going to happen. Several
    banks are already experimenting with blockchain to see how it can reduce fraud
    and keep data secure.


    As more banks become willing to explore shared ledger technology,

    Data quality is a big deal to banks. The problem lies in the fact that so much
    banking information exists in more than one place. Further, some information can
    be changed by multiple parties within one institution, or even by parties across
    institutions. With data residing in duplicate locations and different parties
    having the ability to change the data in their location, there exists an opportunity
    for data that is used to be outdated or incomplete. This is an oversimplified
    explanation; the situation is a bit more complex, and includes regulatory requirements
    that are difficult to meet when data is distributed in an uncontrolled manner.
    Despite an entire industry being devoted to data management for financial institutions,
    challenges persist. This is where blockchain comes in. Modern blockchain technology
    is capable of storing any type data, and allowing that data to be accessed and
    changed only according to predefined rules. This technology, called smart contracts,
    is being used to automatically verify and enforce contracts. By moving any various
    type of banking information into shared ledger, the benefits of blockchain include
    speed, security, and ultimately blockchain will allow banks to reduce costs. In
    terms of cost saving alone, banks save $15-20 billion. Developers who can provide
    blockchain solutions that establish these goals early will capture market share.


    ## Digital Currencies

    Banks’ initial response to Bitcoin was to ignore it. When they saw it was evolving
    from the currency of black markets to serving online markets, they tried to discredit
    it. When Bitcoin started gaining mainstream acceptance by such giants as Microsoft,
    Home Depot, and the Tesla company, banks decided they better get with the program.
    Four banks — UBS, the Swiss bank, Deutsche Bank, Santander, and BNY Mellon have
    joined together to create the first digital currency to be accepted by a group
    of financial institutions. The group believes the new cryptocurrency will help
    them clear and settle trades more securely and faster than is now possible with
    conventional channels. The banks also hope their currency will become the industry
    standard, which industry experts agree is much needed.

