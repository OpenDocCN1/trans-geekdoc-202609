- fmt: "\n# Wow Businesses Can Use Blockchain \n\nBlockchain may have gained notoriety\
    \ as the technology that provides the infrastructure for Bitcoin, but it's playing\
    \ a bigger role in business, including small and midsize businesses (SMBs). At\
    \ its most basic, blockchain is a more efficient way of storing information. What\
    \ makes it more powerful than any other file-sharing service is that data isn’t\
    \ stored from the point of view of any participant, but rather from everyone’s\
    \ point of view in agreement. That means that two parties sharing a document will\
    \ always be looking at the same exact copy of that information, eliminating the\
    \ time-consuming back-and-forth that comes from ensuring everyone has the same\
    \ version of, say, a contract or an invoice. Blockchain creates an audit trail\
    \ that everyone can see in real time. This is especially important for small businesses\
    \ that are constantly looking for ways to streamline their operations, says Bill\
    \ Carmody, CEO of Treoint, a digital marketing firm. Here are some of the ways\
    \ blockchain is enabling entrepreneurs to operate their businesses more efficiently\
    \ and with greater transparency.\n\n## Better supply chain management\n\nWhen\
    \ a small-business owner places an order with a supplier, it’s clear who’s on\
    \ the other end of the transaction. But the business owner may not know who the\
    \ supplier’s suppliers are. By bringing transparency into the supply chain, blockchain\
    \ enables a business owner to see every company that’s had a hand in creating,\
    \ growing, or manufacturing any component of a product it sells or service it\
    \ delivers. This kind of information is vital in the event of a product recall\
    \ or if a company needs to identify ethical sourcing or avoid purchasing counterfeit\
    \ parts, Carmody says. For instance, a bakery that markets itself as using only\
    \ organic ingredients would be able to verify that fact through blockchain technology\
    \ because it could see every company that provided ingredients for its products,\
    \ all the way back to the farm. “Your vendor may promise you everything is organic,\
    \ but without blockchain technology, there’s no way to verify his or her suppliers\
    \ are using organic ingredients,” he says.\n\n## More transparent contracts\n\n\
    How times have you hammered out the details of a contract or agreement with a\
    \ client and then been delayed in starting the project until everyone has read\
    \ and signed the final version of the document? With blockchain, each team member\
    \ always has the most current version. By eliminating version issues, SMBs can\
    \ save time by not having to wait for approvals or signatures.\n\n## Faster payments\n\
    \nThe time needed for reconciling documents like invoices and billing statements\
    \ is eliminated with blockchain, payments can be made instantly. This can have\
    \ a significant impact on SMB’ cash flow, including those that rely on reimbursements.\
    \ For example, a small dental office could submit a claim to insurance. If both\
    \ the patient and insurance are using blockchain, the insurance company would\
    \ know exactly when the visit took place and what was done that day. And because\
    \ the insurance company can update instantly, the patient will know the co-insurance\
    \ before leaving the office.\n\n## Quick background checks\n\nCarmody says he\
    \ can envision day when blockchain technology can verify work history. Rather\
    \ than undertaking the time-consuming task of having HR folks check out candidate’s\
    \ work, blockchain could be used to verify titles, and other important certifications.\
    \ He says this could save small businesses time and prove a potential employee\
    \ has skills and background on a résumé or LinkedIn profile. Blockchain can be\
    \ a game-changer for SMBs, saving time and streamlining operations. It’s time\
    \ for smaller companies to begin exploring the improvements blockchain can make\
    \ in their businesses\n\nWe believe blockchain is a truly disruptive technology\
    \ that can transform business networks. We also believe this innovation has to\
    \ happen in the open, collaborating with other technology companies and industries.\
    \ To this end, IBM continues to contribute code to several active Hyperledger\
    \ projects. From IBM’s perspective, industrial-grade blockchain technologies have\
    \ the following characteristics:\n\n*   A shared, permissioned ledger is the append-only\
    \ system of record (SOR) and single source of truth. It is visible to the authenticated\
    \ members in the business network channels.\n*   A consensus protocol agreed to\
    \ by all participating members of the business network ensures that the ledger\
    \ is updated only with network-verified transactions.\n*   Cryptography ensures\
    \ tamper-proof security, authentication, and integrity of transactions.\n*   Chaincode\
    \ (also called smart contracts) encapsulates participant terms of agreement for\
    \ the business that takes place on the network; chaincode is stored on the validating\
    \ peer nodes in the blockchain\n\nIn addition to these attributes, enterprise\
    \ blockchain needs to verify identity and transact. Hyperledger has been designed\
    \ with a flexible model, allowing businesses to select their network. As an early\
    \ member of the Linux Foundation project, IBM is dedicated to supporting development.\
    \ IBM has worked with over 400 clients across financial services, supply chain,\
    \ IoT, risk management, digital rights management, and healthcare to implement\
    \ blockchain delivered via IBM Cloud. IBM offers a flexible platform and secure\
    \ infrastructure to help you develop, govern, and operate your blockchain network.\
    \ Over 40 active networks with multiple organizations are using the IBM Blockchain\
    \ Platform to exchange assets every day and improve business processes from food\
    \ safety to trade efficiencies. Learn about IBM Blockchain solutions and get started\
    \ today. If you’re a developer, the easiest, most economical way to learn around\
    \ a real business blockchain and start developing blockchain skills and applications\
    \ now is to install the Visual Studio (VS) Code extension. It enables developers\
    \ to create, test, and debug smart contracts, connect to Hyperledger Fabric environments,\
    \ and build applications that transact on your blockchain network.\n"
  raw: "Wауѕ Buѕinеѕѕ Can Use Blockchain Blосkсhаin mау hаvе gained nоtоriеtу as the\
