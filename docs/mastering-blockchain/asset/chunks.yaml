- fmt: "\n# Hyperledger Sawtooth\nThis is a modular blockchain suite developed by\
    \ Intel, which uses a new consensus algorithm called Proof of Elapsed Time (`PoET`).\
    \ \n\n# Hyperledger Iroha\nIroha is a project of a couple of Japanese companies\
    \ to create an easy to incorporate the framework for a blockchain.\n\n# Hyperledger\
    \ Projects\nThe “umbrella strategy” of Hyperledger incubates and promotes a range\
    \ of blockchain technologies, framework, libraries, interfaces, and application.\
    \ Currently, Hyperledger is the host of the following projects:\n\n*   **Hyperledger\
    \ Burrow**: This project develops a permissible smart contract machine along the\
    \ specification of Ethereum.\n*   **Hyperledger Composer**: A tool for building\
    \ blockchain networks.\n*   **Hyperledger Explorer**: Hyperledger Explorer is\
    \ a blockchain module and one of the Hyperledger projects hosted by The Linux\
    \ Foundation. Designed to create a user-friendly Web application, Hyperledger\
    \ Explorer can view, invoke, deploy or query blocks, transactions and associated\
    \ data, network information (name, status, list of nodes), chain codes and transaction\
    \ families, as well as any other relevant information stored in the ledger.\n\
    *   **Hyperledger Indy**: Hyperledger Indy is a collection of tools, libraries\
    \ and further further components for digital identities rooted on blockchains.\n\
    *   **Hyperledger Cello**: A blockchain as-a-service deployment model. \n\nBesides\
    \ these framework projects, Hyperledger has several tool projects aiming to make\
    \ the access to and development of blockchains easier and more effective. Hyperledger\
    \ obviously engages in a wide scope of non-monetary blockchain. But this view\
    \ on these projects must remain distinct, as the short descriptions don’t go beyond\
    \ keywords. So we take a closer look at the two most prominent projects: Sawtooth\
    \ and Fabric. Both projects are created by large companies – Intel and IBM – and\
    \ given to Hyperledger as open code. With Hyperledger the continue pushing their\
    \ projects forward, everyone is invited to contribute.\n\n## Sawtooth (Intel)\n\
    Sawtooth is Intel’s modular blockchain. It is written in `Python` and designed\
    \ for use cases in many fields from IoT to financials. The characteristics of\
    \ Sawtooth are that it supports both permissioned and permission applications\
    \ and that it uses a newly developed algorithm called Proof of Elapsed Time (`PoET`).\
    \ `PoET` uses new CPU instruction which is more and available in new processors\
    \ like Intel. With these instructions, `PoET` ensures a safe and random selection\
    \ of a so-called “leader”. This can be compared with Bitcoin mining, in which\
    \ miners compete for a one-time access to write the blockchain. Other than Bitcoin’s\
    \ proof algorithm, `PoET` doesn’t need specialized mining hardware. To become\
    \ a leader, every “validator” – which equals a node or a miner – needs to use\
    \ the secure CPU instruction to request a wait time. The validator with the shortest\
    \ wait time will be elected as a leader. Like every good mining algorithm PoET\
    \ works like a lottery with the price to get access to the blockchain. Other than\
    \ with cryptocurrencies there is no reward for the leader. It is just part of\
    \ running the software. So there will be no energy-burning competition like in\
    \ cryptocurrencies. Every node simply can use its CPU – as long as it is a new\
    \ model and, maybe, from Intel – to participate in the leader selection for no\
    \ costs. What is mining in Bitcoin, is simply a non-intrusive part of the software\
    \ in Sawtooth Lake.\n\nAnother innovation of Sawtooth Lake is the building and\
    \ propagation of transactions. A client builds transactions and submits it to\
    \ the validators. This wrap the transactions they get inside a batch and commit\
    \ them to the state together. This is a similar, but not identical process as\
    \ when cryptocurrency miners wrap transactions to a block. With this batching\
    \ Sawtooth solves the problem of securely validating transactions which depend\
    \ on each other. \n\nTo date, Sawtooth is tested in several applications. It is\
    \ tested to record the journey of seafood from the ocean to the table, using IoT\
    \ sensors, and track ownership, possession, and parameters through the whole supply\
    \ chain, from the fisherman to the supermarket. The buyer can access a complete\
    \ and trustless record of the live chain of the seafood. This use case in supply\
    \ chain and product history is increasingly discussed for blockchains. Sawtooth\
    \ is also tested to streamline the process of transferring bonds. The developers\
    \ created a user interface to track and transfer bonds. With this users can manage\
    \ a whole portfolio of bonds on the blockchain. Another use case of Sawtooth currently\
    \ tested are digital assets. The developers built a platform for managing digital\
    \ asset ownership on the Sawtooth blockchain, which could be able to manage a\
    \ wide scope of digital assets. The connecting dot between this application of\
    \ Sawtooth seems to be the marketplace for digital assets of any kind which is\
    \ built in the blockchain and already has a graphical interface for users.\n"
