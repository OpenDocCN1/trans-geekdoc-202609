    # 区块链与金融的未来


    如果参与每个金融交易的每个人都能共享同一个账本，并且该账本始终更新，将会怎样？不再需要进行对账，所有参与者都可以立即进行结算，并即时看到应收账、供应链以及几乎所有相关的交易。


    ## 金融领域的意外收获


    对于首席财务官（CFO）及其财务团队而言，潜在收益是极吸引人的：数据透明度的提升、信息获取速度的加快以及“智能合约”等功能将为财务运营带来重大变化。毕马（KPMG）分析师最近的报告确定了以下优势：


    *   **提高效率**：在整个网络中持续同步的单一账本消除了对账的需求。毕马的研究表明，由于直通式处理和“单一事实来源”处理，效率可能提高高达 40%。

    *   **减少损失与欺诈**：所有参与者可见的不可篡改记录可能会提高数据的准确性和安全性。这有助于降低欺诈风险，并通过审计追踪显示合规性。

    *   **改善客户体验**：使用区块链与客户和供应商共享信息，可能允许公司更快速地服务客户，甚至发现新的销售机会。毕马的研究预测，由于处理速度加快和数字渠道的使用，客户体验将提高
    25%。

    *   **更高的资本可用性**：根据毕马的分析，由于交易结算更快、采用了直通式处理以及资金流的释放，区块链技术将减少资本消耗。


    ## CFO 的新未来


    区块链也将对财务运营产生重大影响。研究该技术的毕马分析师预计了这些关键趋势：


    *   **与现有系统协作**：区块链不会一夜之间取代现有的 ERP 系统。然而，要充分实现区块链数据实时视图的优势可能需要时间。

    *   **先私有，后公**：财务机构将从私有区块链开始以保留敏感数据，但最终可以为行业合作伙伴甚至客户添加许可区块链。

    *   **关注监管差距**：政府监管机构需要时间来理解这项技术以及其金融活动的去中心化。


    ## 为您的业务评估区块链


    区块链将对核心流程产生巨大影响：从报价到收款（Quote-to-cash）、从采购到付款（source-to-pay）以及从获取到退休（acquire-to-retire）的流程将受到影响。但区块链并非新鲜事。对于
    CFO 和高管来说，增加关于区块链如何符合其业务需求的问题，包括：


    *   哪些类型的交易最适合区块链处理？

    *   需要什么种基础设施或新设备？

    *   谁来管理区块链和参与者？

    *   区块链技术如何管理风险？

    *   法规是什么？


    ## 区块链业务机会


    理解区块链如何在业务中使用就像追逐一个移动的目标。用例正在不断涌现。区块链的应用包括：


    *   银行业

    *   智能合约

    *   联网汽车

    *   医疗保健

    *   物联网

    *   身份识别

    *   结婚证

    *   保险

    *   食品安全


    让我们开始吧。不要忘记区块链——比特币的骨干——最初是为了规避金融机构而创建的。银行也曾担心它不受监管的情况下走向主流。现在，区块链似乎有了一个新朋友，那正是一个全球银行系统。USC
    是瑞士瑞业银行（UBS）与英国巴克莱（Barclays）合作的数字货币。通过利用区块链技术的优势，USC 期望让央行的结算更快、更安全。


    ## 区块链让银行聚集


    2017 年，全球最大的银行财团联合起来利用区块链技术的优势。该财团被称为统一结算币（USC），包括以下成员银行：华街已经形成了自己的区块链财团——华街区块链（WSBA）。WSBA
    是一个非营利贸易组织，致力于帮助参与者采用分布式账本技术和智能合约。通过对金融公司进行区块链技术教育，WSBA 帮助金融机构自信且胜任地采用区块链解决方案。各大银行和华街公司对区块链的全面采用代表了金融行业区块链发展的巨大机会。既然银行已经决定停止对抗区块链技术并开始采纳它，为能够为中小金融机构提供区块链解决方案的公司敞开了大门。


    ## 智能合约


    当智能合约执行时，区块链如何在业务中使用就像追逐一个移动的目标。用例正在不断涌现。区块链的应用包括：


    *   银行业

    *   智能合约

    *   联网汽车

    *   医疗保健

    *   物联网

    *   身份识别

    *   结婚证

    *   保险

    *   食品安全


    （注：此处删除了原文中重复出现的相同段落）


