    # Challenges Of Blockchain Integration


    Blockchain applications offer solutions that require significant changes to, or
    complete replacement of, existing systems. In order to make the switch, companies
    must strategize the transition.


    ## Cultural Adoption

    Blockchain represents a complete shift to a decentralized network which requires
    the buy-in of its users and operators.


    ## Resolving Challenges

    Resolving challenges such as transaction speed, the verification processes, and
    data limits will be crucial in making blockchain widely applicable.


    ### Control, Security, And Privacy

    While solutions exist, including private or permissioned blockchains and strong
    encryption, there are still security concerns that need to be addressed before
    the general public will trust their personal data to a blockchain solution.


    ### Uncertain Regulatory Status

    Because modern currencies have always been created and regulated by national governments,
    blockchain and Bitcoin face a hurdle in widespread adoption by pre-existing financial
    institutions if its regulation status remains unsettled.


    ### Large Energy Consumption

    The Bitcoin blockchain network’s miners are attempting 450 thousand trillion solutions
    per second in efforts to validate transactions, using substantial amounts of computer
    power.


    ### Cost

    Blockchain offers tremendous savings in transaction costs and time but the high
    initial capital costs could be a deterrent.


    ## How Blockchain Works

    A blockchain is an ever-growing list of records called blocks which are linked
    using cryptography. Cryptography is a process which encrypts and secures communication
    to prevent third-parties from reading private messages. Blockchain technology
    is most commonly used by cryptocurrency. This technology has been adapted by Satoshi
    Nakamoto to create cryptocurrency called Bitcoin. Blockchain is a distributed
    ledger available to everyone. Once the data has been recorded it will not be changed.
    It works just like a digital notary to avoid tampering of information.


    ## Do Need Blockchain?

    While traders fetching speed and million dollar amounts can overlook the underlying
    technology, Blockchain is the technology behind Bitcoin that makes storing possible.
    Blockchain stores data in a distributed ledger prevents fraud. Blockchain will
    soon reach areas beyond digital currency and begin to affect everything from real
    estate to insurance. Even democratic processes and the way countries are governed
    will be impacted by coming blockchain disruption. Voter fraud and election hacking
    is a concern that has been widely discussed in the past years. Blockchain advocates
    assert that a public voting system could provide an unhackable system for governments
    while also counting votes faster. The buzz isn’t just a fad. Businesses are starting
    to adopt blockchain systems more and more because it makes transactions faster,
    cheaper, and more efficient. In addition, with every transaction being visible
    to users worldwide, transparency between businesses and consumers will rise to
    unprecedented levels. Not only does the decentralized ledger aid to prevent corruption
    and corporate fraud, it can also help in the fight against hacking. Hackers would
    be left without big databases of sensitive information to target. Breaches and
    thefts of huge amounts of social security numbers, passwords, or card numbers
    as seen in the past with companies like Equifax or Yahoo would be a thing of the
    past, and consumers and businesses could make transactions with true security.
    With the adoption of blockchain technology, people around the globe can be free
    from the constant dependence on banks and other middlemen, and also not be at
    the mercy of businesses who collect and hold on their sensitive information. Instead
    of submitting to companies who are careless with their information, consumers
    can turn to decentralized options such as Ethereum. In opposition to traditional
    contemporary financial services, Ethereum will allow users to store value and
    trade it without being tied to a centralized system. Decentralized systems will
    never allow for outage. While still in developmental stage, blockchain promises
    to disrupt industries in the coming months.


    ## Difference Between The Banking System and Blockchain

    To portray how blockchain works is Wikipedia is a decentralized encyclopedia which
    is fully open to the public. Anyone can view and update a Wikipedia page with
    all edits being transparently recorded and visible to the public. Similarly to
    Wikipedia, blockchain is also accessible to the public. Anyone who wishes to view
    details of the transaction (e.g amount of funds, sender’s address, destination
    address, etc.). Technology is highly secure as it is almost impossible to hack
    transactions. It provides users with complete transparency on their funds; it
    is a fully authenticated tool which can act as auditing mechanism, recording and
    detailing all transactions that occurred on the relevant chain. Furthermore, transferring
    funds using blockchain takes a matter of minutes. Banking, on the other hand,
    is a centralized institution where a corporation or group of institutions controlled
    by the government or a large entity manages all transactions. In this type of
    system, all data is stored in a centralized data storage available only to the
    entity with a lack of transparent information accessible to the public. Since
    it is controlled by a single entity, it is open to hacking, fraud, internal system
    errors, corruption, and data manipulation. The banking process is also very costly
    and slow. For example, correspondent banks are usually needed so that the beneficiary
    bank can receive the transfer. Correspondent banking works through an agreement
    between a foreign and domestic bank where mutual trust is established to enable
    the domestic bank to make payments or money transfers on behalf of the foreign
    bank. What is actually happening in the background is the payment is being passed
    from one bank to another as it is not feasible for other banks to partner with
    other 1000+ banks worldwide.


    ## What you can do with a blockchain

    If you’ve ever wondered what you can do with a blockchain, here are benefits ideas:


    ### Trade Cryptocurrencies

    Bitcoin is not the only cryptocurrency! Hundreds of other cryptocurrency blockchains
    exist, although the majority of these are either defunct or carry virtually worthless
    tokens. A host of exchanges, some more reputable than others, have sprung up cater
    to those which are worth trading: Bitrex, C-Cex and Poloniex are some of the popular
    options. Check out CoinMarketCap for an exhaustive list. And of course, I can’t
    resist mentioning my own altcoin portfolio tracker, CountCrypto. Since my friend
    Bruce and I launched it nearly three years ago, we’ve seen countless coins and
    exchanges spring up and die, and enough drama to put a soap opera to shame.

