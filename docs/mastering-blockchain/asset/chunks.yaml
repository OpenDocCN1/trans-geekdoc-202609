    # 租汽车

    租车过程通常比所需的要繁琐，需要验证保险文件和身份证明，而且在许多情况下，车辆里程数和损坏报告仍需人工核实。这就是 DocuSign 与 Visa 创新团队合作，描述他们对租车智能合约试点的方式。


    # 顺畅运输流程

    跨境运输产生的文书工作之多，甚至可以用公斤（或如果你偏好英制单位，则用磅）来衡量。当货物运输延迟时，会对整个供应链产生影响，因为工厂在等待组件；在某些情况下（例如易腐货物），它甚至会影响整批货物的可行性。生产提单消耗了大量的时间和巨大的行政成本，因此当航运巨头马士基宣布一项基于区块链的提单概念验证时，引起了广泛关注。


    # 认证供应链

    许多消费者更倾向于对购买的产品做出伦理选择。近期发生的丑闻，如英国将马肉当成牛肉出售，以及有关发展中国服装工人条件恶劣的披露，将这一问题推向了头条。然而，证明产品中每个组件的来源可能是不可能的，即使这些信息由中央机构持有，也可能并不可信。伦敦初创公司
    Provenance 提供了去中心化的供应链认证。


    # 认证运动鞋

    旧金初创公司 Chronicle 因与高端运动鞋制造商 Mache Customs 合作，生产一系列为了纪念侃·西斯的智能标签鞋而闻名。打击假品贸易是他们的明确目标之一。


    # 运营去中心化市场

    Open Bazaar 被广泛视为丝之路的继承者，但它的意义远不止于。丝之路是一个隐藏在 Tor 网络服务器上的网站。FBI 能够追踪它、没收服务器并逮捕相关人员。相比之下，Open
    Bazaar 是类似于 BitTorrent 的点对点网络。你可以下载软件并建立自己的商店。值得注意的是，Open Bazaar 并不明确支持销售非法物品。根据他们的常见问题解答：“Openazaar
    网络上的卖家托管自己的产品，并在列出物品或服务时，直接负责遵守当地法律（以及自己的良知）。参与非法活动的用户无法躲在第三方服务之后。”


    # 向个人借贷

    点对点贷款是金融领域增长最快的领域之一，用户被这种在低利率环境下、不给银行抽成的情况下让存款获得回报的机会所吸引。相反，Zopa 和 Funding Circle
    等竞争对手允许用户使用比特币进行贷款。转账被描述为“区块链的首次用途”，这并非没有理由。自 David Chaum 以来 40 多年来，他一直在寻找数字货币的圣杯，即可以消除双重花费问题并绕过信任未知第三方的问题。当中本著名的白皮书于
    2008 年 10 月发布时，很少有人意识到它的影响。八年后，比特币区块链仍然没有被破解——你必须亲自尝试，才能意识到移动支付（特别是在非洲市场）与加密货币的融合是一个多么值得关注的利基市场……


    # 注册音乐版权

    从创作者艺术家那里获取收入是一项巨大的全球性挑战。通常，接收版税的行政成本超过了金额本身。繁琐流程带来的摩擦意味着，本愿意付费的粉丝最终选择了非法下载内容，仅仅因为这样更方便。歌手兼作家
    Imogen Heap 在各种以太坊人士的帮助下，于 7 月宣布推出 Lycelia，以解决这一问题。Lycelia 被构建为“音乐行业的公平贸易”，旨在提供额外功能，例如允许粉丝支付额外内容，以及定向定价（例如允许慈善机构以较低或零成本使用曲目）。瑞典初创公司
    Zertagram 也在该领域运营。


    # 投票

    在 2016 年我们仍在用笔和纸投票，这是一个反现象。但电子投票——无论是在地方或国家政府层面，还是在公司背景下——都被合理地怀疑，因为如果没有相关的监管，结果似乎很容易被操纵。由于比特币或以太坊等公共区块链提供的透明度，开放政府的支持者积极宣传基于区块链投票的优势。纳斯达克已经宣布在爱沙尼亚的计划，允许公司股东投票，各种初创公司正在开发用于州和国家选举的电子投票机，其工作原理类似。


    # 进行微支付

    使用区块链传输极小金额的能力是一个潜在的游戏规则改变者。无论你是在谈论几分钱的应用内支付，还是转向所有者能够在不产生银行手续费的情况下支付，这都是一个巨大的机会。


    # 注册土地权

    维护国家所有者登记簿是一项昂贵且劳动力密集型操作。此外，在有腐败历史的国家，这些信息可能不可信。据报道，Factom 正在开发一种基于区块链的注册解决方案。事实证明该结果并没有最初报道的那么理想，项目已经停滞，但总有一天会有人实现它。


    # 执行法律合同

    代码不是法律！记住这一点。但一些法律事务所如此坚信某一天将会是如此，以至于他们已经在这一方向上迈出了第一步。伦敦律师事务所 Selach 已经计划推出基于区块链技术的数字协议。

