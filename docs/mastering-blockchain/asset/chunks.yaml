    # Conclusion


    Today, blockchain technology is being used in various industries, though it is
    still mainly used to verify transactions. The appeal is that this technology creates
    an unalterable record whose authenticity can be verified by anyone using the blockchain
    — not just a third-party financial institution like a bank.


    A blockchain begins with a genesis block that births other blocks, or bundles
    of transactions. The parent block is always the previous block. The "tip" or "top"
    is the most recently added. The chain then becomes fossilized under layers of
    children and subsequent generations of grandchildren.


    As mentioned, there are many different uses for blockchain. Unsurprisingly, banking
    is one of them, with other places it has been implemented including the securitization,
    networking, internet of things and online music industries. More applications
    are seen emerging in the future.

