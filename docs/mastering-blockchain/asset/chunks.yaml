    # 结论


    如今，区块链技术已应用于各个行业，尽管它目前仍主要用于验证交易。其吸引力在于这种技术创建了一种不可篡改的记录，任何人都可以使用区块链来验证其真实性——而不仅仅是像银行这样的第三方金融机构。


    区块链始于一个创区块（genesis block），它孕生了其他区块或交易包。父区块始终是前一个区块。“末端”或“顶部”则是最近添加的区块。随后，链条在层层子区块及后续的孙辈区块的覆盖下变得“化石化”。


    如前所述，区块链有许多不同的用途。意不意外的是，银行业是之一，其他应用领域还包括证券化、网络化、物联网和在线音乐行业。未来将会看到更多应用的涌现。

    '
