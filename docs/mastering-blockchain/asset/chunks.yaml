  trans: "\n\n# 市场分析与更新\n\n## Overstock (OSTK)\nOverstock (OSTK) 的股价在宣布公司重塑其业务后飙升，这包括将加密货币作为支付方式并建立加密货币交易所。最近，CEO\
    \ 提到他们甚至考虑出售部分或全部在线零售业务，为加密货币业务提供资金。\n\n## 区块链与加密货币股票\n\n### Riot Blockchain (RIOT)\n\
    Riot Blockchain (RIOT) - 入选我们的名单是因为它为股东提供了独特的风险敞。该公司目前是一家纯粹的加密货币概念股，是纳斯达克上市的极少数（甚至是唯一）此类股票。这解释了高成交量和快速的上涨趋势。通过不同的收购，Riot\
    \ 现在提供了区块链生态系统中许多组件的风险敞：\n\n* 为加密货币社区提供 Veranet 平台财务报告和会计工具。拥有* 比特币矿。\n* 通过 `Tesspay`\
    \ 提供基于区块链的托管结算服务。拥有* 加拿大加密货币交易所。\n\nRIOT 是一项非常高风险的投资，因为公司仍处于区块链行业实验的早期阶段，并正在构建其产品组合。低位入场是生存该股票剧烈价格波动的关键。\n\
    \n### Hive Blockchain (HIVE.V)\nHive Blockchain (HIVE.V) 因其业务的获利性质进入了我们的名单首位。该公司收购了来自\
    \ `Genesis Mining` 的矿场，全球最大的云加密货币矿公司。这使其成为少数已开始产生收益的 IPO 区块链股票之一。\n\n### Square\
    \ (SQ)\nSquare 支付成本远低于金融机构。得益于竞争性的费率和简单直接的模式，他们成功赢得了市场，但现在他们提供区块链解决方案这使其变得有趣。请注意，Square\
    \ 自 2014 年以来一直接受支付。这是我们榜单中少数的纯区块链股票之一。目前它更像是一个金融科技股而非区块链股。Square 有一小部分活动致力于加密货币和区块链。然而，我们看到了它的巨大潜力，这就是为什么我们将\
    \ SQ 纳入考虑范围。Marathon Group (MARA)\nMarathon Group 是一家专利收购上市公司，近期宣布收购 Global Bit\
    \ Ventures 以开始加密货币业务，目前重点关注以太坊，并计划扩展到也开采比特币。\n\n### Analytix (ALY.V)\nAnalytix\
    \ 分析来自公司文件和市场数据的大数据，并将其转化为可操作的见解和专业报告。他们向媒体、财经门户网站和投资者提供研究和内容。2017 年 11 月，他们宣布在其现有的人工智能平台中增加区块链倡议，并在美国\
    \ OTCQB 市场上市。\n\n### Internet of Things Inc (ITT.V)\nInternet of Things Inc (ITT.V)\
    \ 旨在成为物联网与万物区块链融合的早期参与者。这种汇聚应通过使用智能合约来实现，公司目标目标是供应链管理、业务流程和制造业。\n\n### Neptune\
    \ Dash Technologies\nNeptune Dash Nodes Corp. 为 Dash 网络构建并运行节点以便以便 Dash 区块链网络上运行\
    \ InstantSend 和 PrivateSend。公司与 `Crossroad Ventures Inc.` 和 `NEMI Northern Energy\
    \ & Mining Inc.` 签署了合并协议。产生的公司将是 “Neptune Dash Technologies Corp.”\n\n### GMP\
    \ Capital (GMP.TO)\nGMP Capital 将通过反收购总部位于多伦多的比特币矿工公司 `Hut 8 Mining Corp.`，为其股东提供加密货币风险敞。反收购将于\
    \ 1 月完成。他们还与 `Bitfury Group` 建立了独家合作伙伴关系，在北美收购并运营比特币矿业数据中心。\n\n### Mogo Finance\
