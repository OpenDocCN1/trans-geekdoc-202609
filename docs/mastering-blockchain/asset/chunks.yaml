    # Rent a car

    The car rental process is often more cumbersome than it needs to be, with insurance
    documents and identities that need to be verified, and vehicle mileages and damage
    reports that are still manually verified in many cases. This is how DocuSign described
    their smart contracts trial for car rental, in conjunction with Visa’s innovation
    team.


    # Smooth the shipping processes

    Shipping across national borders generates so much paperwork that it can be measured
    in whole kg (or rounds, if you prefer imperial). When shipments are delayed, it
    can cause an impact on the whole supply chain as factories wait for components,
    and in some cases (for example, perishable goods), it can affect the viability
    of the whole shipment. Days of time and huge administration costs are tied up
    in producing bills of lading, so there was plenty of interest when shipping giant
    Maersk announced a blockchain-based bill of lading proof of concept.


    # Certify a supply chain

    Many consumers would prefer to make ethical choices about the products they buy.
    Recent scandals such as the sale of horse meat as beef in the UK, and revelations
    about the poor conditions of garment workers in developing countries have pushed
    this issue into the headlines. However, proving the origin of every component
    in a product can be impossible, and even if this information is held by a centralised
    authority, it may not be trustworthy. London startup Provenance offers decentralized
    supply chain certification.


    # Authenticate sneakers

    San Francisco startup Chronicle hit the headlines when they partnered with high-end
    sneaker manufacturer Mache Customs to produce a range of smart-tag-enabled shoes
    in honour of Kanye West. Busting the counterfeit trade is one of their stated
    aims.


    # Run a decentralized marketplace

    Open Bazaar is widely seen as a successor to Silk Road, but it is far more than
    that. Silk Road was a website on a server hidden by the Tor network. The FBI was
    able to track it down, seize the server, and arrest those involved. In contrast,
    Open Bazaar is a peer-to-peer network like BitTorrent. You can download the software
    and set up your own storefront. It’s worth mentioning that Open Bazaar does not
    explicitly endorse selling illegal items. From their FAQ: “Sellers on the Openazaar
    network host their own products and are directly responsible for complying with
    local laws (and their own conscience) when listing items or services. Users engaged
    in illicit activity cannot hide behind a third party service.”


    # Lend people money

    Peer-to-peer lending is one of the fastest-growing areas in finance, with users
    attracted by opportunity to make a return on their savings in a low-interest environment
    without giving the bank their cut. Instead competitors such as Zopa and Funding
    Circle allows users to all with Bitcoin. Transfer money has been described as
    “blockchain’s first use”, and with good reason. For more than 40 years since David
    Chaum have been seeking the holy grail of digital currency that can eliminate
    the problem of double-spending and circumvent the issue of needing to trust an
    unknown party. When Satoshi’s famous Whitepaper was published in Oct 2008, few
    realised its impact. Eight years on, the Bitcoin blockchain has still not hacked
    — and you needed to try using it yourself to realise how simple the convergence
    of mobile payments, particularly in African market, with cryptocurrency, is a
    niche to watch…


    # Register music copyright

    Channelling income from the artist who created it is a huge global challenge.
    Often, the administrative costs of receiving royalties exceed the amount. Friction
    caused by cumbersome processes mean that fans who would otherwise be prepared
    to pay end up illegally downloading content, just because it’s easier. Singer-songwriter
    Imogen Heap, assisted by various Ethereum people, announced the launch of Lycelia
    in July to address this problem. Built as ‘fair trade for the music industry’,
    it aims to offer extra functionality such as allowing fans to pay for additional
    content, and targeted pricing, such as allowing charities to use tracks at a lower
    or zero cost. Swedish startup Zertagram are also operating in this area.


    # Vote

    The idea that we are still voting with pens and paper in 2016 is an anomaly. But
    electronic voting — whether at local or national government level, or in the context
    of corporations — is justifiably regarded with suspicion as the results seem open
    to manipulation without the relevant oversight. Because of the transparency offered
    by public blockchains such as Bitcoin or Ethereum, proponents of open government
    are vocal about the advantages of blockchain-based voting. Nasdaq has already
    announced plans in Estonia to allow corporate shareholders to vote and various
    startups are developing e-voting machines for state and national elections that
    work in a similar way.


    # Make micropayments

    The ability to use blockchains to transfer minuscule amounts of money is a potential
    game-changer. Whether you’re talking about in-app payments of a fraction of a
    cent, moving towards ownership being able to make payments without incurring bank
    fees is a huge opportunity.


    # Register land rights

    Maintaining a national register of owners is an expensive and labour-intensive
    operation. Additionally, in countries where there is a history of corruption,
    they may not be trustworthy. Factom were widely reported to be working on a solution
    with a blockchain-based registry. This proved to be less than originally reported
    and the project has stalled, but someone will implement this one day.


    # Execute a legal contract

    Code is not law! Remember this. But some legal firms are so convinced that one
    day this will be the case, that they are already making the first moves in this
    direction. London legal firm Selach have already announced plans to launch digital
    agreements based on blockchain technology.

