    # 区块链在医疗保健中的应用


    与医疗记录数据库不同，每一个条目或修改都会成为区块链中一个新的顺序数据块。无论是输入新的患者数据还是更新患者的联系信息，每一次更改都会变成一条具有其自身日期和时间戳的新记录。医疗保健领域的区块链业务案例非常丰富。以下是区块链技术已经在用于维护我们健康的几种方式：


    *   患者医疗记录的存储。

    *   临床试验中的数据追踪。

    *   提供医疗保健提供者目录管理。

    *   自动化保险审批并提供资格信息。

    *   追踪医疗设备、用品和设备的库存。


    医疗保健区块链市场既对创新持开放态度，又充满利润。


    ## 物联网 (IoT)


    物联网（IoT）技术的增长怎么强调都不为过。随着从汽车到连接家居的万物都接入网络，支持物联网技术的市场规模是巨大的。业务区块链中的物联网区块链是一个用于点点交易的共享分布式数据库。该技术的核心是比特币——一种在
    2009 年引入的、用于控制交易和支付系统的数字加密钱包。这种交易管理系统是去中心化的，通常在没有任何中间环节的情况下运行。这些交易由一组网络节点背书，并记录在名为区块链的公共账中。


    物联网（IoT）是一个由互联的计算设备、数字对象和具有唯一系统 ID 的个人组成的网络物理网络。物联网领域的目标是作为一个单一集成点，在不需要人工或计算机干预的情况下在线传输数据。


    区块链与物联网之间存在着错综的关系。提供业务实体的物联网可能会找到使用区块链技术的解决方案。联合系统可以开发并记录一个经过加密安全保护的数据集。只要高度安全并受到恶意软件的保护，此类数据库和记录就能免受篡改和盗窃。两者可以在调节业务发展机制的同时，建立透明度和问责制。区块链本身可以通过其互联的服务器帮助减少工作管理不当、运营开支和业务不可预测性。数字账本可以建立一种成本效益的管理模式，任何内容都可以通过数字方式更新、监控和追踪。这消除了对中央管理的需求。


    物联网赋予了物联网设备参与的能力。业务实体可以使用区块链来管理来自边缘设备的数据，例如 `RFID`（射频识别）、条形码、红外线 (`IR`）。如果集成到物联网中，设备将能够验证区块链合约。例如，如果一个支持物联网并标记了敏感位置的设备移动到另一个点，信息将数字化存储并更新在区块链账本上，如果系统设计当，将采取必要的行动。随着产品移动到不同的位置，系统允许利益相关者获取包裹状态。


    为了享受区块链框架带来的果实，业务组织需要遵循四个基本原则：


    ### 加速数据交换


    区块链支持可以消除在云端、管理员、传感器和设备之间建立网络所需的物联网网关或任何过滤设备。剔除此类“中间人”可以实现点对点合约和数据共享。在这个过程中，数字账本消除了同步设备以及处理和收集信息所需的额外时间。然而，消除物联网网关也为恶意恶意软件和安全漏洞提供了通道。区块链支持的物联网网络可以通过安装恶意软件检测和加密引擎等功能来解决这个问题。


    '
- fmt: '

    Trust Building Through blockchain enabled IoT space, devices and appliances can
    virtually and physically transact and communicate as trusted parties. Unlike a
    conventional business where transactions require endorsement and verification,
    blockchain does not need any central authentication or registry recommendation.
    As long as the network is secured and the trusted parties are technologically
    adept, IoT space does not require further documents. For example, Team A may not
    know Team B, may not have met physically or trust verifiably, but the stamped
    record of online transactions and information sharing within blockchain''s ledger
    confirms the business trustworthiness. This enables the individuals, organizations,
    and devices to earn mutual trust which is vital to establishing revolving business
    setup and eliminating administrative clutter.


    ### Cost Reduction

    The edge devices need to decrease operation processing time and eliminate the
    IoT gateways or internet intermediaries within the system. Since data sharing
    information are communicated within the system, eliminating additional protocol,
    program, hardware, channel, node or communication cuts the overhead costs.


    ### Stepping Up Security for IoT

    IoT Blockchain provides room for decentralized network and technology that promises
    to store, handle and retrieve information from its billions of connected devices.
    This system has to provide heavily safeguarded network that is both encrypted
    and easy to use. The decentralized network has to provide high throughput, permission,
    low latency and querying. Installing blockchain in the IoT network can regulate
    and moderate the data exchange through the edge devices while maintaining the
    same secured transaction and information exchange of the connected devices.


    ### Elimination of Failure Points in IoT Space

    Blockchain enabled IoT can upgrade supply chain network by tracing the tagged
    items as they move along various points in an import or warehouse, while authorizing
    secured and accurate product delivery. Blockchain installation provides precise
    and detailed product confirmation, and solid traceability of relevant data along
    the supply chains. Rather than finding paper trails for identifying country of
    origin (COO), IoT can validate each product''s physical confirmation a virtual
    visa that provides relevant information such as authenticity and origin of product.
    Blockchain makes audit records of product and allows organizations to track history
    of records.


    Blockchain enabled is not confined to enterprise uses. Any business with an IoT
    space can increase productivity by marginalizing costs, eliminating bottlenecks,
    and points of failure in actual processing. It is for such organizations'' own
    interest and and implement their entries.


    ### Identity

    In todays global environment, threats of terrorism require valid validation. Few
    concerns are more than controlling borders.


    ### Blockchain Advantages for Passports

    Of its many security features, the adoption of blockchain for travel passports
    is inevitable. While countries are slow to transition to digitized passports,
    many are considering it. Most will have one. The advantages that blockchain-based
    travel authorization offers are manifold:


    * Processes of receiving a passport can be reduced significantly.

    * The same information is available to all authorized users in real time.

    * Changes that suddenly limit or restrict person’s right to travel become effective.

    * Travel providers can automatically check customer’s travel before selling them.

    * Authorities can track suspected terrorists in real time.


    Don’t toss out your old passport yet. But a digital version is on way. Something
    as simple as a certified marriage certificate can become a major frustration when
    you need one in a hurry. Traditionally, getting yours meant going to a government
    office to make the request. Then there is often a waiting period of up to seven
    days. Clark County, Nevada (USA) has simplified and modernized the process by
    putting marriage certificates on the blockchain. Still, in the pilot phase, the
    county has contracted with a blockchain firm to develop custom blockchain solution
    for them. The digitized process for obtaining a certified marriage certificate
    includes:


    * Placing an order for your certificate by phone or mail.

    * Your certificate is created on the Ethereum blockchain and assigned a cryptographic
    hash.

    * A copy of your certificate is emailed to you as a PDF.

    * The PDF can be shared, and verification credentials are included in the file.


    Blockchain may not make marriage any easier, but at least it makes it more official.


    ### Insurance

    Of the many business applications for blockchain, the insurance industry presents
    one of the best opportunities for disruption. Blockchain can easily organize,
    track, and secure data. It can also execute agreements. All of them can benefit
    from blockchain. Blockchain advantages in insurance include:


    * Processes are simplified.

    * Turnaround times reduced.

    * Improved efficiency and risk management.

    * Fraud detection improved.

    * Information available to authorized parties.


    Regulating the space is what the technology works for. The technology is what
    is needed for the space. The adoption of blockchain is what is essential. Few
    concerns are more than than controlling borders.

