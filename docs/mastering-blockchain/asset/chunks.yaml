  trans: '


    如果你对第一个问题以及至少另一个问题都回答了“是”，那么你的用例将从区块链技术中获益。要让区块链成为正确的解决方案，始终需要一个网络的参与，但网络可以采取多种形式。网络可以存在于组织之间（例如供应链），也可以存在于组织内部。在组织内部，区块链网络可以用于在部门间共享参考数据，或者创建一个审计或合规网络等。网络也可以存在于个人之间，这些个人可能需要在区块链上存储数据、数字资产或合同。


    # 什么是 Hyperledger？


    让我们先从 Hyperledger 不是什么开始：它不是一家公司。不是一种加密货币。不是一种区块链。不是 IBM 的区块链币。Hyperledger 更像是一个开放工业级区块链开发的枢纽。Hyperledger
    在其网站上解释道：“Hyperledger 是一项为了推进跨行业区块链技术而创建的开源协作努力。这是一项全球性的协作，由 Linux 基金会托管，成员包括金融、银行、物联网、供应链、制造业和技术领域的领导者。”
    Hyperledger 不支持比特币或任何其他加密货币。该平台对区块链技术感到非常兴奋。该网站表示，自 Web 本身以来，“没有任何一种技术能像区块链技术这样承诺带来更广泛、更基础的变革。”区块链有潜力“构建新一代交易，以信任、问责和透明为核心，从而简化流程和法律限制。”


    # 成员与治理


    如今，Hyperledger 拥有一份超过 100 名成员的卓越名单。该名单涵盖了广泛的行业领导者。其中包括奥迪（Audi）和戴姆勒（Daimler）等移动巨头，IBM、SAP、华为和三星等
    IT 公司，德意志银行、美国运通、摩根大通、巴黎莱业银行等金融机构，以及以太坊、Litecoin、Fabric 等区块链初创公司。世界上许多最大的科技和金融公司正与一些最热门的初创公司汇聚
    Hyperledger。


    执行治理委员会由领导者组成。它由 10 多名高管组成，大多数人具有开源经验，并与行业有紧密的联系。你会发现 Apache 基金会和 W3C 联盟的领导者，以及来自
    IBM 等公司的工程师。Hyperledger 的某些成员（如 Richard Brown 和 Thomas Blume）已经在区块链领域工作多年。对于其成员来说，Hyperledger
    不仅提供技术知识，还提供了与行业和开发者的各种联系。


    # 战略目标与宪章


    在 Hyperledger 历史的早期，该项目必须做一个重要决定。执行董事 Brian Boehner 被问及是否存在“Hyperledger Coin”（即一种运行在
    Hyperledger 区块链上的货币单位）。Boehner 回答说，Hyperledger 项目本身永远不会构建自己的加密货币。他说：“你永远看不到 Hyperledger
    币，通过不推行货币，我们避免了维护全球一致货币可能面临的许多潜在挑战。”这一决定有力地塑造了 Hyperledger 的战略目标，即构建区块链技术的工业应用，并将其与通常从基于货币的区块链演变出的暴富计划明确隔离开。


    宪章概述了 Hyperledger 的目标，就像使命指南一样。根据宪章，平台旨在“创建一个企业级的开源账本框架和代码库”，并创建、促进和维护开放基础设施。这在某种程度上明确，但也有些模糊。它概述了某种计划，但没有回答那些重大的问题：这些世界领先的公司和领导者在
    Hyperledger 做什么？他们正在推动哪些项目？谁参与了？


    Hyperledger Fabric (Hyperledger IBM)：此项目由 IBM 领导。Fabric 是区块链技术的即插即用实现，旨在作为开发具有灵活权限程度的高扩展性区块链应用的基础。

