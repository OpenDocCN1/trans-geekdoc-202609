    # 区块链是去中心化的。为什么这很重要？


    区块链软件由全球范围内通过互联网连接的各个独立计算机运行。区块链中的每台计算机都运行着相同的软件。如果其中一台计算机断开连接，网络仍然可以保持运行。即使世界上所有的计算机同时关闭，区块链仍然在分布式账本中存储着其数据。如果全球范围内停电，计算机将拥有一最后一次更新时的账本副本。在电力恢复之前，我们无法更新账本，但
    BTC 不会消失。这一特性使得该技术变得极其健壮，能够生存停电和政治动荡。区块链是一种无信任的数字交换方法，跨越多个机器，且所有机器都运行着相同的程序。通过将账本分布在运行该协议的每台计算机上，区块链消除了对中间人、中心化机构和第三方的需求。没有了第三方，用户之间可以直接相互交互，而无需信任或补偿任何中心化公司或政府来开展业务。这是一种点对点（P2P）协作的形式。这本身并不是一个新颖激进的想法；像
    Napster 和 Limewire 这样的服务在 2000 年初就实现了同样的原理。区别在于能够将数字信息（包括交易）存储在承诺不可篡改的分布式账本中。


    # 区块链网络是如何工作的


    区块链网络中的节点不再依赖第三方（如金融机构）来协调交易，而是使用共识协议对账本内容达成一致，并使用密码哈希和数字签名来确保交易的完整性。共识确保了共享账本是完全相同的副本，并降低了欺诈交易的风险，因为篡改必须在同一时间在多个地方进行。


    密码哈希（例如 `SHA256` 算法）确保了对交易输入的任何更改——即使是最微小的变化——都会导致计算出不同的哈希值，这表明交易输入可能已被破坏。数字签名确保交易源自发送者（使用私钥签名）而非冒充者。去中心化的点对点区块链网络防止任何单一参与者或参与者群体控制底层基础设施或破坏整个系统。网络中的参与者都是平等的，遵循相同的协议。他们可以是个人、国家行为者、组织或所有这些者的结合。该系统的核心记录了所有成员的交易顺序，导致交易一旦记录在账本中就无法被更改。


    # 区块链的商业效益


    在商业网络中，参与者受益于速度的提高成本的降低。然而，通过使用区块链账本，企业可以节省时间并减少争议。账本记录了所有成员的交易来源，建立了参与者之间的信任。区块链技术的不可篡改性改进了审计和合规性。由于在区块链上执行的智能合约是最终的，企业可以创建新的收入流与客户进行互动。


    '
- fmt: '

    If you answered yes to the first question and to at least one other, then your
    use case would benefit from blockchain technology. A network always needs to be
    involved for blockchain to be the right solution, but the network can take many
    forms. The network can be between organizations, such as a supply chain, or the
    network can be within an organization. Within an organization, a blockchain network
    could be used to share reference data between divisions or to create an audit
    or compliance network, for example. The network can also exist between individuals,
    who might need to store data, digital assets, or contracts on the blockchain.


    # What is Hyperledger?


    Let’s start with what Hyperledger is not: Not a company. Not a cryptocurrency.
    Not a blockchain. Not an IBM blockchain coin. Hyperledger is rather something
    like a hub for open industrial blockchain development. On its website Hyperledger
    explains: “Hyperledger is an open source collaborative effort created to advance
    cross-industry blockchain technologies. It is a global collaboration, hosted by
    The Linux Foundation, including leaders in finance, banking, Internet of Things,
    supply chains, manufacturing, and Technology.” Hyperledger does not support Bitcoin
    or any other cryptocurrency. But the platform is thrilled by blockchain technology.
    Not since the Web itself, the website tells, “has a technology promised broader
    and more fundamental revolution than blockchain technology.” Blockchains has the
    potential to “build a new generation of transactions that establishes trust, accountability,
    and transparency at their core streamlining processes and legal constraints.”


    # Membership and Governance


    Today Hyperledger has an impressive list of more than 100 members. The list covers
    a wide scope of well industry leaders. It includes mobility giants like Audi and
    Daimler, IT companies like IBM, SAP, Huawei and Samsung, financial institutions
    like Deutsche, American Express, J.P. Morgan, BNP and Wells, as well as blockchain
    startups like Ethereum, Litecoin, Fabric. Many of the world’s largest companies
    in tech and finance meet Hyperledger with some of the hottest startups.


    Something like executive governance is the committee of leaders. It consists of
    more than 10 executives, most with experience in Open Source and tight connections
    to industries. You’ll find leaders of the Apache Foundation and the W3C consortium
    as well as engineers from IBM and more. Some of Hyperledger’s members, like Richard
    Brown and Thomas Blume, already worked with Blockchain for years. For its members,
    Hyperledger does not only provide technical knowledge but also various contacts
    to industries and developers.


    # Strategic Goals and Charter


    Relatively early in the history of Hyperledger, the project had to make an important
    decision. Executive Director Brian Boehner was asked if there will be an “Hyperledger
    Coin”, a monetary unit running on the Hyperledger blockchains. Boehner answered
    that the Hyperledger Project itself will never build its own cryptocurrency. “You’ll
    never see a Hyperledger coin,” he said, “By not pushing a currency, we avoid so
    many potential challenges of having to maintain a globally consistent currency.”
    This decision strongly shaped the strategic goals of Hyperledger to build industrial
    applications of blockchain technology and sharply separating it from the get-rich
    schemes usually evolving from currency-based blockchains.


    A charter outlines the goals of Hyperledger, like a mission guide. According to
    it, the platform aims to “create an enterprise-grade, open source ledger framework
    and code base” and create, promote and maintain an open infrastructure. This is
    somehow telling, but somehow vague. It outlines some kind of program, but doesn’t
    answer the big, important questions: What do all these world-leading companies
    and leaders do at Hyperledger? What projects are they pushing forward? Who participates?


    Hyperledger Fabric (Hyperledger IBM): This project is lead by IBM. Fabric is a
    plug and plays implementation of blockchain technology designed as a foundation
    to develop high-scaling blockchain applications with a flexible degree of permissions.

