    # 2. 加密货币


    如果你正在考虑区块链投资，但股票并不是你的菜，那么次优（也是最常见）的选择就是直接购买加密货币。


    ## 哪些加密货币适合投资？


    今年比特币的价值飙升，甚至超过了一盎司黄金。市场上还出现了新的加密货币，这更令人惊讶，它将加密货币的总价值推向了千亿美元以上。另一方面，长期的加密货币前景在有些模糊。其核心开发人员存在缺乏进展的传言，使其作为长期投资工具和支付系统的吸引力有所下降。


    ### 比特币 (Bitcoin)


    比特币仍然是最受欢迎的加密货币，它是开启一切的加密货币。目前，它的市值最大，约为 410 亿美元，已经存在了 8 年。在全球范围内，比特币被广泛使用，目前为止还没有容易利用其运行机制弱点的方法。作为一种支付系统和价值存储手段，比特币使用户能够轻松地接收和发送比特币。区块链概念是比特币的基础。有必要理解区块链概念才能理解加密货币的本质。简单来说，区块链是一个分布式数据库，将每笔网络交易都存储为名为“区块”的数据块。每个用户都拥有区块链的副本，因此当
    Alice 向 Mark 发送 1 个比特币时，网络上的每人都知道。


    ### 以太坊 (Ethereum)


    超级程序员维塔里克·布特林（Vitalik Buterin）想出了以太坊，它可以完成比特币能的一切。然而，它的目的是作为一个构建应用程序的平台。基本上，比特币的区块链记录的是声明资金已从一个地址转移的合约。然而，以太坊有了巨大的扩展，它拥有更先进的语言和更复杂、更广泛范围。当开发者注意到其更好的特性时，许多项目开始在以太坊之上。通过代币销售，有些项目已经筹了数百万美元，这种情况在今天仍在持续。可以在以太坊平台上构建奇妙的事物，这使其几乎就像互联网本身。这导致了价格的飙升，如果你在今年早些时候购买了价值一百元的以太坊，它现在的价值将接近
    3000 美元。


    ### 门罗 (Monero)


    门罗旨在解决匿名交易问题。即使这种货币被认为是一种洗钱的方法，门罗也旨在改变这一点。虽然没有人完全认可这种方法，但由于某些人出于各种目的喜爱隐私，门罗将一直存在下去。


    '
- fmt: '

    # Zcash

    Zcash unlike Monero, Zcash also aims to solve the issues that Bitcoin has. The
    difference is that rather than being completely transparent, Monero is only partially
    public in its blockchain style. Zcash also aims to solve the problem of anonymous
    transactions. After all, no person loves showing how much money they actually
    spent on memories by Star Wars. Thus, the conclusion is that this type of cryptcoin
    really does have an audience and a demand, although it''s hard to point out which
    cryptocurrency that focuses on privacy will eventually come on top of the pile.


    # Litecoin

    One alternative to Bitcoin, Litecoin attempts to resolve many of the issues that
    hold Bitcoin down. It is not quite as resilient as Ethereum with its value derived
    mostly from adoption of solid users. It pays to note that Charlie Lee, ex-Google,
    leads Litecoin. He is also practicing transparency with what he is doing with
    Litecoin and is quite active on Twitter. Litecoin was Bitcoin''s second fiddle
    for quite some time but things started changing early in the year of 2017. First,
    Litecoin was adopted by Coinbase along with Ethereum and Bitcoin. Next, Litecoin
    fixed the Bitcoin issue by adopting the technology of Segregated Witness. This
    gave it the capacity to lower transaction fees and do more. The deciding factor,
    however, was when Charlie Lee decided to put his sole focus on Litecoin and even
    left Coinbase, where he was the Engineering Director, just for Litecoin. Due to
    this, the price of Litecoin rose in the last couple of months with its strongest
    factor being the fact that it could be a true alternative to Bitcoin.


    # Bancor

    Bancor Also known as a "smart token," Bancor is the new generation standard of
    cryptocurrencies which can hold more than one token on reserve. Basically, Bancor
    attempts to make it easy to trade, manage and create tokens by increasing their
    level of liquidity and letting them have a market price that is automated. At
    the moment, Bancor has a product on the frontend that includes a wallet and the
    creation of a smart token. There are also features in the community such as stats,
    profiles and discussions. In a nutshell, the protocol of Bancor enables the discovery
    of a price built-in as well as a mechanism for liquidity for smart contractual
    tokens through a mechanism of innovative reserve. Through smart contract, you
    can instantly liquidate or purchase any of the tokens within the reserve of Bancor.
    With Bancor, you can create new cryptocurrencies with ease. Now who wouldn''t
    want that?


    # EOS

    Another competitor of Ethereum, EOS promises to solve the scaling issue of Ethereum
    through the provision of a set of tools that are more robust to run and create
    apps on the platform.


    # Tez

    An alternative to Ethereum, Tez can be consensually upgraded without too much
    effort. This new blockchain is decentralized in the sense that it is self-governing
    through the establishment of a digital true commonwealth. It facilitates the mathematical
    technique called formal verification and has security-boosting features of the
    most financially weighted, sensitive smart contract. Definitely a great investment
    in the months to come.


    # Verdict

    It is incredibly hard to predict which in will become the next superstar. However,
    adoption is always a factor both Ethereum and Bitcoin have this and yet they are
    going for months.


    ## Importance of Cryptocurrency

    As a medium, the global economy is just moving towards digital. Cryptocurrency
    is an exchange medium like normal currencies, but it is mainly designed for digital
    information. And here are some reasons why cryptocurrency has become popular lately.


    ## Security

    After authorizing the cryptocurrency transfer, this can''t be reversed like the
    "chargeback" transactions of different credit companies. This can be a hedge against
    the fraud that needs to make particular agreement between sellers and buyers about
    the return policy or a mistake in the transaction.


    ## Adaptability

    There are around 1200 types of altcoins or cryptocurrencies in the present world.
    Some of these are a bit ephemeral, but adequate proportion is used for specific
    cases, which depict the flexibility of this phenomenon.


    ## Transaction Fees

    Transaction fees often take enough bite out of the assets of a person, mainly
    if the person performs loads of financial transactions every month. But as the
    data miners do number crunching that mainly generates different types of cryptocurrencies
    get the compensation from the network involved and therefore here the transaction
    fees never apply. However, one may have to pay a certain amount of external fees
    for engaging the services of any third-party management services to keep up cryptocurrency
    wallet.

    '
