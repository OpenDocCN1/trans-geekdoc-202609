    *   Identifying delays in shipment that could reduce food’s shelf life.

    *   Detecting failed quality checks during food processing.

    *   Reporting a failed sanitation inspection at the restaurant.


    Using smart contracts and IoT technology, blockchain can keep an eye on your berries
    from the tree to the table. If any safety step gets missed along the way, smart
    contracts will not let the berries go any further. Blockchain is already getting
    the attention of major players in the food industry. Walmart and Nestle have joined
    with eight other companies to form the IBM Food Trust. Working with IBM, the consortium
    of 10 companies plans to use blockchain to make food supply chains more accountable,
    and our food safer. How Ignite Can Help The blockchain business potential is beyond
    comprehension. With the power of DLT to benefit nearly every aspect of our professional
    and personal lives, blockchain based business opportunities have only begun to
    be explored.


    ### Largest Public Companies Exploring Blockchain


    There’s more than one way to gain exposure to blockchain innovation. Beyond buying
    over-the-counter products or investing directly in blockchain startups, some of
    the largest public companies in the world are already dabbling in the tech. Here
    are the biggest names on the list have all made their own mark on technology inspired
    by bitcoin.


    *   **Siemens AG [572797]** Location: Germany. Sales: $94.47 billion. Blockchain
    Play: This industrial giant ranked number 51 on the Global 2000 and has invested
    in `LO3`, a blockchain energy startup working to help neighbors buy and sell solar
    power directly from each other.

    *   **Morgan Stanley [MS]** Location: United States. Sales: $45.59 billion. Blockchain
    Play: In spite of clearing bitcoin futures contracts for its customers, the number
    50 company on the Global 2000 also issued a report on the negative impacts of
    bitcoin mining on the environment.

    *   **Intel Corporation [INTC]** Location: United States. Sales: $64.03 billion.
    Blockchain Play: Since contributing blockchain platform `Sawtooth` to the Hyperledger
    consortium, the computer giant ranked number 49 on the Global 2000, has focused
    on how hardware can help blockchain.

    *   **Nestle [712387]** Location: Switzerland. Sales: 91.23 billion. Blockchain
    Play: The Swiss food-giant ranked number 48 on this year’s Global 2000 and is
