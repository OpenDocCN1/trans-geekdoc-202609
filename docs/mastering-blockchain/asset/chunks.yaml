    # 业务企业如何使用区块链


    区块链可能因作为比特币提供基础设施的技术而声名大噪，但它在业务中发挥着更重要的作用，其中包括中小企业（SMB）。从最根本地说，区块链是一种更高效的信息存储方式。让它比任何其他文件共享服务更强大的之处在于，数据不是从任何参与者的视角存储的，而是从所有人的共识视角进行存储的。这意味着共享文档的双方将始终看到该信息的完全相同的副本，从而消除了为了确保每个人都拥有相同版本（例如合同或发票）而进行的耗费时间的反复往来。区块链创建了一个所有人都可以实时查看的审计追踪。数字营销公司
    Treoint 的首席执行官 Bill Carmody 表示，这对于不断寻找简化运营方法的小型企业来说尤为重要。以下是区块链使创业者以更高效、更透明的方式运营其业务的某些方法。


    ## 更好的供应链管理


    当小企业主向供应商下单时，交易的另一端是谁是显而易见的。但企业主可能不知道供应商的供应商又是谁。通过引入供应链的透明度，区块链使企业主能够看到参与了创建、生长或制造其销售产品或提供服务的任何组件的每一个公司。Carmody
    说，在发生产品召回或公司需要识别伦理采购或避免购买假冒零件时，这类信息至关重要。例如，一家自称仅使用有机成分的烘焙坊将能够通过区块链技术验证这一事实，因为它可以看到为其产品提供原料的每一家公司，一直追溯到农场。“你的供应商可能向你承诺一切都是有机的，但如果没有区块链技术，没有办法验证他的供应商是否在使用有机成分，”他说道。


    ## 更透明的合同


    你曾多少次与客户反复敲合同或协议的细节，然后一直等到每个人都阅读并签署了文档最终版本后才延迟启动项目？有了区块链，每个团队成员始终拥有最新版本。通过消除版本问题，中小企业可以由于无需等待审批或签名而节省时间。


    ## 更快的支付


    区块链消除了对发票和账单等文件进行对账的时间，支付可以即时完成。这将对中小企业的现金流产生重大影响，包括那些依赖报销的企业。例如，一家小型牙科诊所可以向保险公司索赔。如果患者和保险公司都使用区块链，保险公司将确切知道就诊的时间以及当天做了什么。由于保险公司可以即时更新，患者在离开诊所之前就会知道共同保险金额。


    ## 快速背景检查


    Carmody 表示，他预见到未来区块链技术可以验证工作经历。与其让人力资源部门的人检查候选人的工作情况这项耗时的任务，不如区块链可以用于验证头衔和其他重要的认证。他说这可以为小企业节省时间，并证明潜在员工在简历或
    LinkedIn 个人资料上具备技能和背景。区块链对中小企业来说可能是游戏规则的改变者，可以节省时间并简化运营。现在是小型公司开始探索区块链为其业务带来的改进的时候了。


    我们相信区块链是一种真正颠覆性的技术，可以改变业务网络。我们还相信这种创新必须在公开进行，与其他技术公司和行业共同合作。为此，IBM 持续向多个活跃的 Hyperledger
    项目贡献代码。从 IBM 的角度来看，工业级区块链技术具有以下特征：


    *   共享的许可型账本是只追加的记录系统 (SOR) 和单一事实来源。它对业务网络通道中经过验证的成员可见。

    *   由业务网络所有参与成员同意的共识协议确保账本仅通过网络验证的交易进行更新。

    *   密码学确保了交易的防篡安全性、身份验证和完整性。

    *   链代码（也称为智能合约）封装了参与者对网络上发生的业务的协议条款；链代码存储在区块链的验证节点节点上。


    除了这些属性外，企业级区块链还需要验证身份并进行交易。Hyperledger 的设计采用了灵活的模型，允许企业选择自己的网络。作为 Linux 基金会项目的早期成员，IBM
    致力于支持开发。IBM 已与金融服务、供应链、物联网 (IoT)、风险管理、数字版权管理和医疗保健领域的 400 多个客户合作，实施通过 IBM Cloud
    交付的区块链。IBM 提供了一个灵活的平台和安全的基础设施，帮助您开发、治理和运营您的区块链网络。有超过 40 个包含多个组织的活跃网络每天使用 IBM Blockchain
    Platform 交换资产，并从食品安全到贸易效率的各个方面改进业务流程。了解 IBM Blockchain 解决方案并从今天开始。如果你是开发者，围绕真实业务区块链进行学习并开始开发区块链技能和应用程序的最简单、最经济的方法是安装
    Visual Studio (VS) Code 扩展。它允许开发者创建、测试和调试智能合约，连接到 Hyperledger Fabric 环境，并在您的区块链网络上构建交易的应用程序。


