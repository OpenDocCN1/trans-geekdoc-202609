    区块链基础（Blockchain Essentials）正在关注区块链的分布式账本技术如何改变组织进行业务交易的方式。让我们来看看区块链网络是如何运作的、你可以如何利用它，以及
    IBM 和其他公司如何合作推动该技术在各个行业的发展。首先，介绍一些背景知识。


    ### 什么是分布式账本

    分布式账本是一种数据库，它在去中心化网络的成员之间共享、复制并同步。分布式账本记录了网络参与者之间的交易，例如资产或数据的交换。网络中的参与者通过共识对账本记录的更新进行治理和达成一致。过程中不涉及任何中央机构或第三方中介（例如金融机构或结算中心）。分布式账本中的每条记录都有时间戳和唯一的加密签名，因此该账本是网络中所有交易的可追溯、不可篡改的历史。


    ### 业务账本的角色

    在当今互联互通的世界中，经济活动发生在跨越国家、地理和司法管辖边界的业务网络中。业务网络通常汇集于市场，参与者（如生产者、消费者、供应商、合作伙伴、市场做市/促进者和其他利益相关者）对被称为“资产”的价值对象拥有所有权、控制权并行使他们的权利、特权和权益。资产可以是实体的（如汽车、房屋或草莓），也可以是无形虚拟的（如契据、专利和股票证书）。资产的所有权转移是在网络中创造价值的交易。交易通常涉及买方、卖方和中介（如银行、审计师），并记录在账本中。企业通常使用多个账本来跟踪各个业务线中参与者之间的所有权和转移。账本是业务活动和利益的记录。


    #### 当前账本的问题

    目前的业务账本效率低下、成本高且容易被误用。缺乏透明度以及腐败导致了这些问题。解决纠纷和可能需要验证交易成本很高。这些风险和不确定性导致了错机会。此外，每个网络中不同步的账本会导致基于临时、错误数据做出错误的决策。在最好的情况下，在对账副本时，做出充分信息决策的能力会被推迟。


    ### 什么是区块链

    区块链是一种防篡改的共享数字账本，记录在公共或私有的点对点网络中的交易。账本分发到网络中的所有成员节点，并在潜在的加密哈希链接区块链中记录了网络中节点之间发生的交换历史。所有已确认和验证的区块从链的开始到最新的区块都链接并成链，因此被称为区块链。区块链因此充当了“单一事实来源”，区块链网络中的成员只能查看与他们相关的交易。


    #### 区块存储在何处

    节点是指托管区块链副本的计算机。与矿工不同，它们没有被激励去寻找序列中的下一个区块，相反，它们负责验证交易并与其他节点及矿工进行通信。你可以将节点想象成中继塔，帮助底层的区块链进行更新并保持准确性。


    新区块是如何构建和验证的？

    区块链中的每个区块都包含一些数据。在比特币的情况下，数据是一系列交易。这些数据被组织在一个单一的数字文件夹中。这个文件夹（在此例中为区块）由矿工确认，矿工将其添加到区块链中的上一个区块。新的交易区块每几分钟写入比特币网络中。这被称为挖矿。此操作将新的与现有的区块链链接起来。但为了被添加到现有的区块链中，新区块需要经过验证。这就是节点的作用。在比特币的情况下，节点负责验证跨越比特币网络发生的交易。


    #### 协议规定了区块链的规则

    每个区块链都基于协议（或“共识算法”）。协议是计算机之间一种约定的交互方法。你可以将其想象为网络中每台机器必须遵循的规则。例如，比特币有一些特定的规则，保持了所有机器上协议的统一：


    - 每 10 分钟添加 1 个区块。这通常取决于每个区块链。

    - 作为矿工奖励的比特币数量每隔 210,000 个区块减少一次。这意味着比特币的总量有限，共 2100 万个。

    - 矿工必须解决一个复杂的数学问题来寻找下一个区块。协议确保寻找下一个区块的难度根据相互竞争的矿工数量增加或减少。

    '
- fmt: '

    # Blockchain Is Decentralized. Why is it Important?


    The blockchain’s software is run by individual computers connected to each other
    via the internet from all over the world. Each computer in a blockchain is running
    the same software. If one is disconnected, the network stays operational. Even
    if every computer in the world shuts down simultaneously, the blockchain is still
    storing its data in distributed ledgers. If all of the world''s power goes out,
    computers will have a copy of the ledger from when it was last updated. We wouldn''t
    be able to update the ledger until power was restored but BTC won''t disappear.
    This characteristic makes the technology incredibly robust, able to survive power
    outages and political turmoil. The blockchain is a method of trustless digital
    exchange, spread across multiple machines, all running the same program. By distributing
    ledgers across every computer running the protocol, blockchains remove the need
    for middlemen, centralized authorities and third parties. Without third parties,
    users can interact with each other directly without needing to trust or compensate
    any centralized corporations or governments to do business. It’s a form of Peer-to-peer
    (P2P) collaboration. This in itself is not a new or a radical idea; Services like
    Napster and Limewire enabled the same principle in the early 2000s. The difference
    lies in the ability to store digital information – including transactions – in
    a distributed ledger that promises immutability.


    # How Blockchain Networks Work


    Instead of relying on a third party, such as a financial institution, to mediate
    transactions, member nodes in a blockchain network use a consensus protocol to
    agree on ledger content, and cryptographic hashes and digital signatures to ensure
    the integrity of transactions. Consensus ensures that the shared ledgers are exact
    copies, and lowers the risk of fraudulent transactions, because tampering would
    have to occur across many places at exactly the same time.


    Cryptographic hashes, such as the `SHA256` algorithm, ensure that any alteration
    to transaction input — even the most minuscule change — results in a different
    hash value being computed, which indicates potentially compromised transaction
    input. Digital signatures ensure that transactions originated from senders (signed
    with private keys) and not imposters. The decentralized peer-to-peer blockchain
    network prevents any single participant or group of participants from controlling
    the underlying infrastructure or undermining the entire system. Participants in
    the network are all equal, adhering to the same protocols. They can be individuals,
    state actors, organizations, or a combination of all these. At its core, the system
    records the order of transactions for all members, resulting in transactions that
    cannot be changed once recorded in the ledger.


    # Business Benefits of Blockchain


    In business networks, participants benefit from increased speed and reduced costs.
    However, by using blockchain ledgers, businesses can save time and reduce disputes.
    The ledger records the origin of transactions for all members, which builds trust
    among participants. Immutability of blockchain technology leads to improved audit
    and compliance. Because smart contracts executed on blockchain are final, businesses
    can create new revenue streams to interact with clients.

    '
