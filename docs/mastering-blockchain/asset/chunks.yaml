    # 2. Cryptocurrencies


    If you’re thinking about blockchain investments, but stocks aren’t your thing,
    the next best (and most common) option would be to simply buy cryptocurrencies.


    ## What Cryptocurrencies Are Good to Invest in?


    This year the value of Bitcoin has soared, even past one gold-ounce. There are
    also new cryptocurrencies on the market, which is even more surprising which brings
    cryptcoins'' worth up to more than one hundred billion. On the other hand, the
    longer term cryptocurrency-outlook is somewhat of a blur. There are subpoenas
    of lack of progress among its core developers which make it less alluring as a
    long term investment and as a system of payment.


    ### Bitcoin


    Still the most popular, Bitcoin is the cryptocurrency that started all of it.
    It is currently the biggest market cap at around $41 billion and has been around
    for the past 8 years. Around the world, Bitcoin has been widely used and so far
    there is no easy to exploit weaknesses in the method it works. Both as a payment
    system and as a stored value, Bitcoin enables users to easily receive and send
    bitcoin. The concept of the blockchain is the basis in which Bitcoin is based.
    It is necessary to understand the blockchain concept to get a sense of what the
    cryptocurrencies are all about. To put it simply, blockchain is a database distribution
    that stores every network transaction as a data-chunk called a "block." Each user
    has blockchain copies so when Alice sends 1 bitcoin to Mark, every person on the
    network knows it.


    ### Ethereum


    Vitalik Buterin, superstar programmer thought up Ethereum, which can do everything
    Bitcoin is able to. Its purpose, however, is to a platform to build applications.
    Basically, the blockchain of Bitcoin records a contract states funds have been
    moved from one address. However, there is significant expansion with Ethereum
    it has a more advanced language and has more complex, broader scope. Projects
    began top of Ethereum when developers began noting its better qualities. Through
    token sales, some have raised dollars by the millions and this is still ongoing
    today. The fact that you can build wonderful things on the Ethereum platform makes
    it almost like the internet itself. This caused a skyrocketing so if you purchased
    a hundred dollars'' worth of Ethereum early this year, it would not be valued
    at almost $3000.


    ### Monero


    Monero aims the issue of anonymous transactions. Even if this currency was received
    to be a method of laundering money, Monero aims to change this. No one is quite
    sold on this method but since some folks love privacy for whatever purpose, Monero
    is here to stay.

