    *   **Facebook, Inc. [FB]** Location: United States. Sales: $44.59 billion. Blockchain
    Play: The CEO of the 77th largest on Forbes Global 2000 list, Mark Zuckerberg,
    has explained plans to explore blockchain in a number of cases.

    *   **Prudent Financial [PRU]** Location: United States. Sales: $61.13 billion.
    Blockchain Play: Largely working behind the scenes, the financial giant ranked
    number 73 on Global 2000 is a back of digital currency.

    *   **Walt Disney Company [DIS]** Location: United States. Sales: $56.83 billion.
    Blockchain Play: After the entertainment giant sold an internal blockchain solution,
    Disney employees spun off their own startup to monetize the platform.

    *   **IBM [IBM]** Location: United States. Sales: $80.06 billion. Blockchain Play:
    The computer giant ranked number 67 on the Global 2000 has open-sourced the widely
    used Hyperledger and is a driving force behind multiple blockchain initiatives.

    *   **Ford Motor Company [F]** Location: United States. Sales: $159.59 billion.
    Blockchain Play: The auto giant ranked number 67 on Global 2000 co-launched a
