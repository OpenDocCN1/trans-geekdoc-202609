    # Hyperledger Fabric


    Hyperledger 系列中最有趣的项目可能首过于 IBM 的 Fabric。Fabric 不是一个单一的区块链，而是一个基于模块化架构的区块链解决方案的开发平台。在
    Fabric 中，区块链的不同组件（如共识和服务和成员服务）可以实现即插即用。Fabric 的设计旨在提供一个框架，企业可以通过该框架构建自己的、独立的区块链网络，且该网络可以快速扩展到每秒
    1000 多次交易。


    ## 什么是 Fabric 以及它是如何工作的？


    该框架使用 Go 语言实现。它旨在实现具有不同权限程度的联盟链区块链。Fabric 高度依赖于名为 `Chaincode` 的智能合约系统，网络的每一层都运行在
    `Docker` 容器中。在手册中可以找到 Fabric 技术的概述。虽然 Fabric 并不是完全且通用的许可链，但它允许企业将区块链的部分（甚至全部）设置为许可性的。参与者通常需要注册，以获得加入基于
    Fabric 的区块链并发布交易的权限。


    为了更有效地利用资源，Fabric 的节点比公链少，并且能够进行大规模并行数据计算，这使得 Fabric 的扩展性远优于公链。此外，它的基础架构支持机密数据，为成员提供了比在公链上更高的隐私保护。最重要的是所谓的“背书节点”（Endorsers）与“共识节点”（Consensus
    Nodes）之间的分离。如果你熟悉比特币等加密货币，你会发现矿工与节点之间的分离。背书节点拥有状态并构建、验证和传播交易及链码，而共识节点对已验证的交易进行排序。虽然这种分离并不是中聪（Satoshi
    Nakamoto）最初区块链概念的内容，但它是大多数加密货币中不愿面对的现实，Fabric 是首批将这种分离作为设计原则的项目之一。这使得 Fabric 能够实现更好的分工，因此网络中的每个节点都需要执行每项工作。虽然没有原生货币，但
    Fabric 允许用户从客户端定义资产并使用 Fabric Composer 使用它们。


    Fabric 的 Chaincode 智能合约框架类似于以太坊：Chaincode 定义了资产的业务逻辑以及读取和修改所调资产状态的规则。与太坊一样，Fabric
    不像比特币那样维护一组未花费输出，而是维护区块链的状态，该状态不仅限于交易数据。除了加密货币公链外，Fabric 还允许参与者为其资产构建私有通道，并隔离交易和账本。通过这种方法，读取和修改状态所需的链码将仅安装在参与该通道的节点上。良好的
    Fabric 区块链允许用户同时参与公链和私有链。除了这种针对公链的替代设计外，Fabric 还利用公共基础设施生成与组织和用户绑定的证书。因此，可以限制数据通道的访问。Fabric
    的优势似乎在于高度的灵活性和隐私性，同时通过更先进的网络分工实现了扩展性。对于 IBM 而言，Fabric 是区块链开发的旗舰项目。这家 IT 巨头将 Fabric
    用于自己的各种项目以及与多个合作伙伴的合作。2017 年 3 月，IBM 启动了 IBM Blockchain，这项服务允许开发者“在 IBM Cloud
    上快速构建和托管具有丰富安全性的生产区块链网络”。借此，IBM 追上了在 Azure 云中集成了区块链的微软。


    区块链随比特币进军 IT 行业改变了世界看待在线交易的方式。随着区块链的流行，人们意识到区块链可以不仅限于比特币。多年来，医疗、房地产、政治等行业一直在尝试采用区块链技术。由于每个行业的运作方式都是独特的，区块链必须演化成不同的类型。在本书中，我将解释不同的区块链类型及其基础知识。


    ### 比特币


    比特币是最受欢迎的加密货币之一。比特币是在无需任何中介的情况下进行在线货币交易的一种。假设你想从一个账户向另一个账户发送比特币。你使用接收者的 `Account
    ID` 来传输比特币。交易被发送到区块链挖掘进行验证以防止欺诈。交易经过验证和确认后，会被添加到区块链区块中，接收者收到比特币。对于像比特币这样的加密货币，任何人都应该能够访问、进行交易并成为验证者。这就是为什么比特币对访问者没有限制。


    ### 多链 (Multich)


    Multich 是区块链的一种应用，被组织用于增强安全性。通过建立 Multich，你可以防止对敏感数据的未经访问。在这里，区块链不对公众开放，仅限制于同一组织的人。如果你拥有一个组织并决定存储数据，你不会希望它是公开的。在此类应用程序中，加入网络的节点被限制在授权范围之内。


    '
- fmt: '

    # Public Blockchain

    As the name suggests, Public Blockchain is accessible and has no restriction on
    who can participate or be a Validator. In Public Blockchains, no one has complete
    control over the network. This ensures data security and helps immutability because
    a single person cannot manipulate the Blockchain. The authority on the Blockchain
    is equally divided among each node in the network, and due to this, Public Blockchains
    are known to be fully distributed. Public Blockchains are mainly used for cryptocurrencies
    like Bitcoin, Ethereum, and Litecoin.


    # Private Blockchain

    Private Blockchain (also known as Permissioned Blockchain) has restrictions on
    who can access it and participate in transaction and validation. Only pre-chosen
    entities have permissions to access the Blockchain. These entities are chosen
    by the respective authority and are given permission by the Blockchain developers
    while building the Blockchain application. Suppose there is a need to give permissions
    to new users or revoke permissions from an existing user, the Network Administrator
    can take care of it. Private Blockchains are mainly used in private organizations
    to store sensitive information that should be available only to certain people
    in the organization. Because Private Blockchain is a Closed Blockchain, the data
    is within the organization and out of reach from any external entities.


    # Consortium Blockchain

    In Consortium Blockchain, some nodes control the consensus process, and some other
    nodes may be allowed to participate in the transactions. Consortium Blockchain
    is like a hybrid of Public and Private Blockchain. It is public because the Blockchain
    is being shared by different nodes, and it is private because the nodes that can
    access the Blockchain is restricted. Hence, it is rarely public and rarely private.
    There are two types of users here: First, the users who have control over the
    Blockchain and decide who should have permission to access the Blockchain and
    second, the users who access the Blockchain. This type of Blockchain can be used
    when organizations need to share the Blockchain but restrict data to themselves
    and keep secure.


    # Benefits of Blockchain

    ## Mobile Apps

    In the mobile industry, the use of blockchain is rapidly growing. In future blockchain
    will give maximum updates and more advanced services for mobile applications.
    It is also available making it more powerful and secure. With this technology
    the time and cost for mobile apps will be reduced and you will get better business.
    If irregularity is detected somewhere along the supply chain, a blockchain system
    can lead you all the way to origin. This makes it easier for businesses to carry
    out investigations and execute transactions. A use-case for this is in the food
    sector, tracking origin, batch information and other important details is crucial
    for assurance and safety.


    ## Simplicity

    Another big advantage of using Blockchain in your mobile apps is simplicity, it
    has an upper hand over the relative cost of performing similar functions. If you
    use complex technology in your mobile apps it will take more effort, time and
    money to integrate and maintain the apps. This simplicity of Blockchain will help
    develop mobile apps more easily and cost-effectively.


    ## Maximum Security to Mobile Apps ownIf you use Blockchain technology in your
    mobile apps it will give maximum security. Blockchain using interlocked blocks
    and high levels of data encryption, so it is not much easy to do decryption of
    these data. Everyone can see the data but no one can edit it.


    ## More Reliable Mobile Apps

    Mobile application which is using Blockchain Technology is more reliable. It is
    mainly because of the Blockchain''s interlocked block structure it will secure
    the mobile apps from any collapse or crash. And decentralized features will block
    any unauthorized alteration.


    ## Increases transparency

    The high-level security of Blockchain will enhance transparency. Records in Blockchain
    technology allow users to track them anywhere. This technology will exclude the
    possibility of any fraudulent transaction or fabricated information. With the
    help of Blockchain technology, we can make the business mobile apps tamper-proof
    and resilient. Blockchain Technology will give more customer''s trust to entrepreneurs
    and users will get more safety to their transaction and assured for the protection
    of their valuable data. Also, this technology facilitates to manage multiple users
    at once.

