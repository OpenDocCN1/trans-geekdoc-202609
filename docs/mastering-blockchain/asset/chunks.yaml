    # 银行从区块链技术中受益的方式


    ## 引言

    很少有金融科技技术对银行业产生的冲击比区块链更大。区块链技术最初作为比特币的数据库平台而开发，如今已成熟为传统金融交易渠道的一种可行替代方案。一旦银行意识到，他们要么能够找到利用区块链技术的方法，要么会被其所绕过，他们开始探索银行区块链解决方案如何帮助他们保持相关地位。


    是的，银行业最终也屈服于区块链革命，这为创新的区块链开发者创造了巨大的机会。在本文中，我们将探讨银行从区块链技术中受益的五种方式。传统的金融交易由中心化金融机构促成，而区块链是一个去中心化的系统，加密交易被输入到多方共享的账本中。区块链交易工作原理的简要解释如下：


    *   交易被加密并添加到分布式账本中。

    *   拥有共享账本访问权限的多个方会验证交易细节，且不会泄露参与者的身份。

    *   经过验证的交易将作为永久、不可撤销的部分添加到共享账本中。

    *   交易完成。


    由于只有经过验证的交易“区块”才能添加到账本中，因此一旦任何交易经过验证并输入账本，就不需要重新检查其真实性。现在让我们来看看区块链是如何影响银行业的。


    ## 更快的交易速度

    由于区块链通过简单的账本分目移动资金等资产，银行可以使用区块链技术来缩短交易结算所需的时间。不再需要花费传统的 1-3 天来验证资金转账，而是可以在几小时或几分钟内收到验证结果。随着用于银行应用的区块链技术成熟，交易将实时发生。


    区块链的优势之一是消除了重复数据。尽管多个方拥有共享账本的副本，但他们都拥有完全相同的副本。相同的数据永远不会存在于共享账本之外的多个位置，因此银行对账对账的需求有所减少。Ripple
    是一家利用区块链技术捕获银行业市场份额的公司，它协助银行处理国际支付。该公司的专有实时结算系统（`RTGS`）构建在改进的区块链模型之上。Ripple 只是帮助银行跨越系统与分布式账本之间鸿沟的一个示例。


    ## 提高安全性

    共享账本可以从几个方面帮助银行保护信息。首先，由于区块链使交易完成的速度远比中心化系统快，因此拦截或捕获信息的时间更短。其次，在某些模型中，每笔交易都有两个安全密钥：一个所有用户可用的公钥和一个仅与参与方共享的私钥。公钥可查看用户的账户余额和历史，但不能用于识别所有者或更改其记录。私钥与用户账户关联，只能使用一次。即使黑客偷取了私钥并解密，也无法让他们进行进一步的交易。此外，每个账本分目一旦通过验证，就会成为账本记录中不可篡改且不可更改的部分，所有用户都有一份副本。更改共享账本中数据的唯一方法是设法同时访问用户的副本并在每份副本中做出相同的更改。而这是不会发生的。几家银行已经在尝试区块链，以查看它如何能够减少欺诈并保持数据安全。


    随着越来越多的银行愿意探索共享账本技术，

    数据质量对银行来说至关重要。问题在于，大量的银行信息存在于多个地方。此外，某些信息可以由一个机构内部的多个方更改，甚至由跨机构的双方更改。由于数据存储在重复的位置，且不同方有能力更改其所在位置的数据，就会导致使用的数据可能过时或不完整。这是一个过于简化的解释；情况要复杂得多，并且包含了当数据以不受控的方式分布时难以满足的监管要求。尽管整个行业都致力于金融机构的数据管理，但挑战依然存在。这就是区块链大显身场。现代区块链技术能够存储任何类型的数据，并允许仅根据预定义的规则对数据进行访问和更改。这种技术被称为智能合约，正被用于自动验证和执行合同。通过将各种类型的银行信息移动到共享账本中，区块链的益处包括速度、安全，最终区块链将允许银行降低成本。仅在成本节约方面，银行就节省了
    150 亿至 200 亿美元。能够早建立这些目标的区块链解决方案的开发者将捕获市场份额。


    ## 数字货币

    银行对比特币的最初反应是忽视它。当他们看到它从黑市货币演变为为在线市场服务时，他们试图贬低它的价值。当比特币开始获得微软、家得和特斯拉公司等巨头的主流认可时，银行决定最好跟上潮流。四家银行——瑞瑞银行（UBS）、德意志银行、桑坦德银行和纽约梅隆（BNY
    Mellon）联手创建了第一种被一组金融机构接受的数字货币。该小组认为，新的加密货币将帮助他们比传统渠道更安全、更快速地清算结算交易。银行还希望他们的货币能成为行业标准，行业专家也认为这是非常切需要的。


