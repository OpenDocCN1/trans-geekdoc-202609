    *   **Tencent Holding [700]** Location: China. Sales: $35.27 billion. Blockchain
    Play: Earlier this year, the 105th largest on Global 2000 partnered with Singapore
    firm StarHub to launch a blockchain.

    *   **IAX Group [BTX]** Location: Hong Kong. Sales: $31.92 billion. Blockchain
    Play: The 93rd largest on Global 2000 has.

    *   **Alibaba Group Ltd. [BABA]** Location: China. Sales: $37.87 billion. Blockchain
    Play: The 81st largest on Global 2000 has spun off its startup to monetize the
