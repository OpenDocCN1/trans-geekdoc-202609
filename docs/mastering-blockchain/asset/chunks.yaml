    Using blockchain for real-time trading will increase transparency, reduce commissions,
    create faster transactions, and curb some of the most dishonest stock market practices.
    This is creating a bright future for the blockchain stocks that can disrupt global
    stock trading.


    ## Blockchain-Related Stocks


    Blockchain technology, despite its young age, has already shown immense potential
    for changing the way global businesses and governments operate. Although primarily
    known as the underlying fabric for cryptocurrencies, such as bitcoin, the practical
    applications for blockchain technology extend far beyond any single use case.
    Core features, such as transparency and immutability, make blockchain especially
    attractive for businesses. Additionally, blockchain technology may be applicable
    for use in a wide range of sectors from finance to healthcare, with applications
    ranging from faster transaction times, fraud prevention, data integration, and
    even food safety. Currently, there are over 80 corporations developing practical
    use cases for blockchain related technology, and according to the World Economic
    Forum, it’s projected that blockchain platforms will store 10% of global GDP within
    the next decade. Measuring Blockchain Innovation Potential Due to developing advantages
    for deploying blockchain-for-business, we believe identifying those companies
    with the largest potential to optimize their business using blockchain technology
    would be helpful for investors. To help navigate this new sector of investing,
    Reality Shares created a proprietary Blockchain Score™ methodology which seeks
    to identify progressive companies on the forefront of blockchain technology. The
    Blockchain Score utilizes seven quality factors that represent important metrics
    for identifying and realizing a company’s blockchain-related potential, visualized
    through a scaled ranking system. As you’ll see, the higher the Blockchain Score
    and subsequent ranking, the more active the company is in adapting and deploying
    blockchain technology throughout its business infrastructure.


    ### ING Groep (Blockchain Score: 53)

    The Dutch banking and financial services firm, ING Groep. In just a short period
    of time, the bank has made tremendous efforts to build a presence with blockchain
    technology. Beginning in 2017, the bank started its association with blockchain
    technology with Easy Trading Connect (ETC), a platform for trade finance in commodities.
    Currently, the company’s blockchain initiatives include 44 proof of concept projects
    and the successful completion of eight live pilots. These initiatives focus on
    client data, lending, and debt transactions. The bank’s utilization of blockchain
    for internal trade has potentially wider applications. With adoption of blockchain,
    the digitization of trade-related paperwork can lead to increasing exports and
    reducing both times and cost. As per United Nations research, such initiatives
    in APAC alone increase exports by as much as $27 billion a year with a 44% reduction
    time and cost savings of 31%. In 2019, ING expects to build upon it and continue
    developing it to help better customers.


    ### Mastercard (Blockchain Score: 69)

    With a Blockchain Score of 69, our fourth blockchain-related stock pick for 2019
    is Mastercard. Ironically, even though the underlying tenet of blockchain is meant
    to make entities like Mastercard obsolete, the company is proactively adopting
    blockchain to increase efficiency, lowering costs, and increasing fraud. The potential
    of blockchain to mitigate fraud in lending and credit industries could potentially
    save billions as losses in 2016 estimated at $28 billion. Mastercard is actively
    exploring the use of blockchain based solutions to help fraudulent losses. Additionally,
    the company has already created APIs which developers can start creating applications.
    Even with the potential for blockchain to disrupt its credit card businesses,
    as well as the greater banking and lending industry, Mastercard is strategically
    positioning itself to adapt to this by incorporating blockchain technology in
    its DNA.


    ### Fujitsu (Blockchain Score: 74)

    With a Blockchain Score of 74, our three blockchain-related stock pick for 2019
    is Fujitsu. Japanese technology firm Fujitsu is the world''s 7th largest IT services
    provider and number one in Japan. It was recently selected as a vendor for the
    development of a transfer settlement system for the Japanese Bankers Association''s
    (JBA) Collaborative Blockchain Platform. Additionally, the company recently opened
    a Blockchain Innovation Center in Brussels, Belgium. The company is also working
    on developing other services including fast track consulting based on Proof of
    Business (PoB) and 360 Degree Use Case Deep-Dive, aimed at helping other companies
    develop successful blockchain solutions quickly.


    ### Alibaba Group (Blockchain Score: 77)

    With a Blockchain Score of 77, our two blockchain-related stock pick for 2019
    is Alibaba, the largest Chinese e-commerce and technology firm. Alibaba is blazing
    the blockchain path with 90 patents filed for blockchain technology as of September
    2018 (compared to the 89 blockchain-related patents filed by IBM in frame). The
    company has already developed several blockchain solutions to optimize and integrate
    their business segments. Lynx, a subsidiary of Alibaba, has successfully implemented
    blockchain in its logistics division. Another Alibaba subsidiary, “Tmall,” uses
    blockchain to facilitate fighting counterfeiting and fraud. The company also partnered
    with the Chinese government using blockchain in health. On the payments front,
    the company''s affiliate “Ant Financial” launched a remit service based on blockchain
    in Hong Kong. After successfully implementing projects in China, the company now
    started extending its cloud blockchain-as-a-service (BaaS) to major regions outside
    China.


    ### IBM (Blockchain Score: 92)

    With a Blockchain Score of 92, IBM is far and leader in blockchain technology
    development, and our number in the group. As a technology leader founding in 1911,
    IBM continues developed new innovations; most in fields of artificial intelligence,
    cloud computing, and blockchain. Currently, IBM’s solution efforts are supported
    by 1,500 experts, with more than 500 projects. On the product front, IBM’s platform
    provides. In 2018, IBM launched several large blockchain initiatives including
    the IBM Trust platform with Walmart - which adopted a platform to improve safety
    through integrated supply-side blockchain. Similarly, two additional projects
    supported by IBM called “we.trade,” a blockchain-based trade finance platform,
    and “CLNET,” a blockchain-based payment service, both launched during 2018.


    BTL Group (BTL.V)

    BTL Group has been our Top Blockchain stock for a long time and for multiple reasons.
    The company was quick to see and act on the disruptive potential of Blockchain
    technology. They have developed and piloted successfully their internet platform
    to introduce the Blockchain capabilities to sectors to cut cost and gain efficiency.
    The company seems to be focusing currently on the energy sector where there is
    a huge need for cutting cost to remain competitive. As said, we tipped this stock
    when it was trading at $3 early 2017. In December it reached $19. This was one
    of the greatest free stocks tip from InvestingHaven’s research team. We like BTL
    for they have a real and solid product that was piloted and currently in the commercialization
    phase. We like the leadership team in place and we believe this is a top contender
    in the Blockchain sector.


    Leonovus (LTV.V)

    Leonovus operates in the cloud storage industry and recently developed the Blockchain
    based Leonovus 3.0 platform and security software. They announced an agreement
    with one of the big 6 Canadian banks to install the Leonovus 3.0 Software to help
    the Bank build a secure blockchain based data storage.


    Novatti (NOV.AX)

    In the payment business since 1996 with an established portfolio of payment solutions
    including mobile payments, remittance services and electronic voucher distribution.
    We like Novatti Group because the Novatti platform can be integrated to blockchain
    and cryptocurrency exchanges to enable payments to and from Bitcoin account holders
    and the conversion between Bitcoin and Fiat currencies.

