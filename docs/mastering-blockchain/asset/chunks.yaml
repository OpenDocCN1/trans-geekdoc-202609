- fmt: '

    Blockchain Essentials is watching how blockchain’s distributed ledger technology
    is revolutionizing the way organizations conduct their business transactions.
    Let’s look at how a blockchain network operates, how you can take advantage of
    it, and how IBM and other companies are collaborating to advance the technology
    across a spectrum of industries. First, a little background in order.


    ### What A Distributed Ledger Is

    A distributed ledger is a type of database that is shared, replicated, and synchronized
    among the members of a decentralized network. The distributed ledger records the
    transactions, such as the exchange of assets or data, among the participants in
    the network. Participants in the network govern and agree by consensus on the
    updates to the records in the ledger. No central authority or third-party mediator,
    such as a financial institution or clearinghouse, is involved. Every record in
    the distributed ledger has a timestamp and unique cryptographic signature, thus
    making the ledger anitable, immutable history of all transactions in the network.


    ### The Role Of Business Ledgers

    In today’s connected and integrated world, economic activity takes place in business
    networks that span national, geographic, and jurisdictional boundaries. Business
    networks typically come together at marketplaces where the participants, such
    as producers, consumers, suppliers, partners, market makers/enlers, and other
    stakeholders own, control, and exercise their rights, privileges, and entitlements
    on objects of value known as assets. Assets can be tangible and physical, such
    as cars, homes, or strawberries, or intangible and virtual, such as deeds, patents,
    and stock certificates. Asset ownership and transfers are transactions that create
    value in a network. Transactions typically involve buyers, sellers, and intermediaries
    (such as banks, auditors) which recorded in ledgers. A business typically uses
    multi-ledger to keep track of ownership and transfers between participants in
    various lines of business. Ledgers are records for business activities and interests.


    #### Problems with current ledgers

    Current business ledgers are inefficient, costly, and subject to misuse. Lack
    of transparency as well as corruption leads to. Having to resolve disputes and
    possibly verify transactions is costly. These risks and uncertainties contribute
    to missed opportunities. Furthermore, out-of-sync ledgers on each network lead
    to faulty decisions on temporary, incorrect data. At best, the ability to make
    a fully informed decision is delayed while copies are reconciled.


    ### What Is Blockchain

    A blockchain is a tamper-evident, shared digital ledger that records transactions
    in a public or private peer-to-peer network. Distributed to all member nodes in
    the network, the ledger records, in a potential chain of cryptographic hash-linked
    blocks, the history of exchanges that take place between the peers in the network.
    All the confirmed and validated blocks are linked and chained from the beginning
    of the chain to the most current block, hence the name blockchain. The blockchain
    thus acts as a single source of truth, and members in a blockchain network can
    view only those transactions that are relevant to them.


    #### Where is the Blockchain Stored

    Nodes refer to computers hosting a copy of the blockchain. Unlike miners, they
    are not incentivized to find the next block in the sequence, instead, they validate
    the transactions and communicate with other nodes and miners. You can think of
    nodes like relay towers, helping the underlying blockchain update itself and stay
    accurate.


    How Are New Blocks Built and Validated?

    Each block within a blockchain holds some data. In the case of Bitcoin, data is
    a series of transactions. That data is organized in a single digital folder. This
    folder—the block in this case—is confirmed by a miner, who adds it to the previous
    block in the blockchain. New blocks of transactions are written into Bitcoin’s
    few minutes. This is called mining. This action links the new to existing chain
    of blocks. But in order to be added to the existing chain of blocks, new blocks
    need to be validated. This is the role of nodes. In the case of Bitcoin, nodes
    are charge validating transactions that occur across Bitcoin’s network.


    #### Protocol Dictates the Rules of the Blockchain

    Every blockchain is based upon protocol (or “consensus algorithm”). A protocol
    is an agreed-upon method of interaction between computers. You can think of this
    like the rules each machine within the network must follow. For example, Bitcoin
    has some specific rules which keep the protocol standard across all machines:


    - 1 block is added every 10 minutes. This usually depends on each blockchain.

    - The amount of Bitcoin given as a reward to miners reduces every 210,000 blocks.
    This translates into Bitcoin having a finite supply, 21 million in total.

    - Miners must solve a complex mathematical problem in order to find the next.
    The protocol ensures the difficulty of finding the next block increases or decreases
    in relation to the number of miners competing against one another.

