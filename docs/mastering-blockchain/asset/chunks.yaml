    # 区块链集成的挑战


    区块链应用提供的解决方案需要对现有系统进行重大更改或完全替换。为了实现这一转变，公司必须制定转型策略。


    ## 文化接纳

    区块链代表了向去中心化网络的彻底转变，这需要用户和操作者的认可。


    ## 解决挑战

    解决交易速度、验证过程和数据限制等挑战，对于使区块链获得广泛应用至关重要。


    ### 控制、安全与隐私

    尽管已经存在包括私有链或许可链区块链以及强加密在内的解决方案，但在普通大众将个人数据信任给区块链解决方案之前，仍有需要解决的安全疑虑。


    ### 不确定的监管状态

    由于现代货币一直是由国家政府创建和监管的，如果区块链的监管状态悬而未决，那么区块链和比特币在被现有金融机构广泛采用方面将面临重障碍。


    ### 高能耗消耗

    比特币区块链网络的矿工正尝试每秒执行 450 万亿次解决方案来验证交易，消耗了大量的计算能力。


    ### 成本

    区块链在交易成本和时间上提供了巨大的节省，但高昂的初始成本可能成为一种阻碍因素。


    ## 区块链如何工作

    区块链是一个不断增长的记录列表，称为“区块”，通过密码学连接起来。密码学是一个加密和保护通信的过程，以防止第三方读取隐私信息。区块链技术最常用于加密货币。这项技术被中本·纳瓦西改进用于创建名为比特币的加密货币。区块链是所有人都可以使用的分布式账本。一旦数据被记录，它将不会被更改。它的工作方式就像数字公证员，以避免信息被篡改。


    ## 我们需要区块链吗？

    虽然追求速度和百万美元金额的交易者可能会忽略底层技术，但区块链是比特币背后的技术，使存储成为。区块链将数据存储在分布式账本中以防止欺诈。区块链很快将进入数字货币之外，并开始影响从房地产到保险的所有领域。即使民主进程和国家的治理方式也将受到到来的区块链变革的影响。选民欺诈和选举黑客攻击是过去广泛讨论的问题。区块链支持者断言，公共投票系统可以为政府提供一个不可破解的系统，同时更快地统计选票。这种热潮不仅仅是一时的时尚。企业开始越来越多地采用区块链系统，因为它让交易更快速、更便宜、更高效。此外，由于每笔交易对全球用户可见，企业与消费者之间的透明度将达到前所未有的水平。去中心化账本不仅有助于防止腐败和企业欺诈，还能帮助对抗黑客攻击。黑客将没有大型敏感信息数据库可以作为目标。过去像
    Equifax 或 Yahoo 等公司发生的大规模社会安全号码、密码或卡号泄露和盗窃将成为过去，消费者和企业可以进行真正的安全交易。随着区块链技术的采用，全球范围内的人可以摆脱对银行和其他中间人的持续依赖，也不再受控于收集并持有其敏感信息的公司。消费者不再屈从于对其信息处理粗心的公司，而是转向以太坊等去中心化选择。与传统的现代金融服务相比，以太坊允许用户存储价值并进行交易，而不受限于中心化系统。去中心化系统永远不会宕机。虽然仍处于开发阶段，区块链承诺在未来几个月内颠覆行业。


    ## 银行系统与区块链的区别

    为了描述区块链如何工作，维基百科是一个向完全开放的去中心化百科。任何人都可以查看和更新维基百科页面，所有的编辑都会透明地记录并公开可见。与维基百科类似，区块链也向公众开放。任何想查看交易细节的人（例如资金金额、发送者地址、目标地址等）都可以做到。该技术非常安全，因为几乎不可能攻击交易。它为用户提供了资金的完全透明度；它是一个完全认证的工具，可以作为审计机制，记录并详细说明相关链上发生的所有交易。此外，使用区块链传输资金只需要几分钟。另一方面，银行是一个中心化机构，由政府或大型实体控制的公司或机构组管理所有交易。在这种系统中，所有数据都存储在只有该实体使用的中心化数据存储中，缺乏公众可见的透明信息。由于由单一实体控制，因此很容易受到攻击、欺诈、内部系统错误、腐败和数据操纵。银行过程也非常昂贵且缓慢。例如，通常需要代理银行，以便受益银行能够接收汇款。代理银行通过外国和国内银行之间的协议运行，建立相互信任，使国内银行代表外国银行进行付款或资金转账。后台实际发生的情况是付款从一家银行传递到另一家银行，因为其他银行与全球范围内
    1000 多家银行建立合作是不可行的。


    ## 你可以用区块链做什么

    如果你曾好奇过可以用区块链做什么，这里是一些收益的想法：


    ### 交易加密货币

    比特币不是唯一的加密货币！存在数百种其他加密货币区块链，尽管其中大多数要么已经废弃，要么带有几乎毫无价值的代币。大量的交易所（其中一些比其他更有声誉）应运而生，以于那些值得交易的对象：Bitrex、C-Cex
    和 Poloniex 是是一些热门选择。查看 CoinMarketCap 获取详尽列表。当然，我无法不提到我自己的山寨币组合追踪器 CountCrypto。自从我的朋友
    Bruce 在几乎三年前推出它以来，我们见证了无数硬币和交易所的兴起与死亡，以及足以让肥皂剧都相形见绌的戏剧。


