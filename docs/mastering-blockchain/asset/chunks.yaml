    # Zcash

    与 Monero 不同，Zcash 同样旨在解决比特币所面临的问题。区别在于，Monero 在区块链风格上仅是部分公开的，而非完全透明。Zcash 也旨在解决匿名交易问题。毕竟，没有人会喜欢展示自己为了那些《星球大战》的纪念品到底花了多少钱。因此，结论是，这种类型的加密货币确实拥有一受众和需求，尽管很难看出哪种专注于隐私的加密货币最终会脱颖而出。


    # Litecoin

    作为比特币的替代方案之一，Litecoin 试图解决许多限制比特币的发展的问题。它并不像以太坊那样具有韧性，其价值主要源于忠实用户的采用。值得注意的是，前谷歌员工李林宏（Charlie
    Lee）领导着 Litecoin。他在处理 Litecoin 方面也保持了透明度，并在 Twitter 上非常活跃。Litecoin 在很长一段时间内都是比特币的二号人物，但情况在
    2017 年初开始发生变化。首先，Litecoin 与以太坊、比特币一起被 Coinbase 。接下来，Litecoin 通过采用隔离见证（Segregated
    Witness）技术解决了比特币的问题。这使其具备了降低交易费并执行更多功能的能力。然而，决定性因素是李林宏决定将全部精力放在 Litecoin 上，甚至为了
    Litecoin 离开了他曾担任工程总监的 Coinbase。正因如此，Litecoin 的价格在过去几个月里上涨，其最强有力的因素是它可以成为比特币的真正替代品。


    # Bancor

    Bancor 也被称为“智能代币”，是加密货币的新一代标准，可以储备超过一种代币。基本上，Bancor 试图通过提高其流动性并让其具有自动化的市场价格，来简化代币的交易、管理和创建。目前，Bancor
    拥有一个前端产品，包括钱包和智能代币创建。社区中还有统计数据、个人资料和讨论等功能。简而言之，Bancor 协议通过创新的储备机制，为智能合约代币提供了内置的价格发现机制和流动性机制。通过智能合约，你可以立即清算或购买
    Bancor 储备中的任何代币。通过 Bancor，你可以轻松创建新的加密货币。现在谁会不想呢？


    # EOS

    作为以太坊的另一个竞争对手，EOS 承诺通过提供一组更健壮的工具来在平台上运行和创建应用，从而解决以太坊的扩展性问题。


    # Tez

    作为以太坊的替代方案，Tez 无需费力即可进行共识升级。这种新的区块链是去中心化的，因为它通过建立数字联邦体来实现自我治理。它促进了被称为形式验证的数学技术，并具有最高财务权重、最敏感智能合约的安全性增强功能。在未来的几个月里，这无疑是一个极佳的投资。


    # 结论

    预测哪一个将成为下一个明星非常困难。然而，采用始终是一个因素，以太坊和比特币都有这一点，而且它们已经坚持了很久。


    ## 加密货币的重要性

    作为一种媒介，全球经济正向数字化转型。加密货币像普通货币一样的交换媒介，但它主要为数字信息设计。以下是加密货币最近流行的一些原因。


    ## 安全性

    授权加密货币传输后，它无法像不同信用公司的“退单”交易那样撤销。这可以作为防止欺诈的对冲，即买卖双方需要就退货政策或交易错误达成特定协议。


    ## 灵活性

    目前世界上大约有 1200 种山寨币或加密货币。其中一些转瞬即逝，但有很大比例被用于特定情况，这描述了这一现象的灵活性。


    ## 交易费

    交易费通常会吞掉个人的大部分资产，特别是当一个人每月执行大量金融交易时。但由于数据矿工进行计算主要产生不同类型的加密货币，他们从相关网络获得补偿，因此这里不收取交易费。然而，为了聘用任何第三方管理服务来维护加密货币钱包，可能需要支付一定数的外部费用。


    '
- fmt: '

    # Asset Transfers


    The financial analysts often define cryptocurrency as the method that on a certain
    level can be used to enforce and execute two-party contracts on commodities like
    real estate and automobiles. Besides, the cryptocurrency ecosystem is also used
    to ease some specialist transfer methods.


    Transactions in the conventional methods of business dealings, legal representatives,
    agents, and brokers can add great cost and enough complication to even straightforward
    transaction. Besides, there are brokerage fees, commissions and other special
    conditions that apply well. On the other hand, cryptocurrency transactions are
    on-chain that mainly take place on the network structure. This results in better
    clarity setting audit trails, greater accountability and making assets to the
    Internet and digital data transfer that ease exchange. Therefore, services are
    available to people with knowledge of cryptocurrency networks, a workable connection
    and immediate action to the wallet. The cryptocurrency system is capable of making
    transactions and asset transfer available to all people after infrastructure is
    present.


    Under the credit systems, the complete transaction history is a reference document
    for the bank involved while making transaction. At the simplest level, this might
    include a check on balance to make the availability of funds. But in the case
    of cryptocurrency, every transaction made between two parties is considered a
    exchange where the terms can be negotiated. Besides, the information exchange
