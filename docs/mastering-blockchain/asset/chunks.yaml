    ## INTRODUCTION

    区块链是一种旨在创建去中心化数据库的软件。该系统完全“开源”，这意味着任何人都可以查看、编辑并对其底层代码库提出更改。尽管由于比特币的发展变得越来越流行，但它实际上从
    2008 年就开始存在了，已有十年历史（在计算机术语中属于“古董”）。“区块链”最重要的一点是，它的设计是为了创建不需要中央数据处理服务的应用程序。这意味着如果你在使用构建在其之上的系统（即`Bitcoin`），你的数据将存储在全球成千上万个“独立”服务器上（而非属于任何中央服务）。该服务的工作方式是创建一个“账本”。该账本允许用户之间创建“交易”——并将`blockchain`的内容存储在“区块”中。


