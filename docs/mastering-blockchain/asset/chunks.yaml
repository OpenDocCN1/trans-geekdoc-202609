  trans: '

    使用区块链进行实时交易将提高透明度、减少佣金、创建更快的交易，并遏制股票市场上一些不诚实的行为。这正为能够颠覆全球股票交易的区块链股票创造一个光明的未来。


    ## 区块链相关股票


    区块链技术尽管年轻，但已经显示出改变全球企业和政府运营方式的巨大潜力。尽管它主要被人们认为是比特币等加密货币的底层架构，但区块链技术的实际应用范围远超任何单一的用例。透明性和不可篡改性等核心特征使区块链对企业具有特别的吸引力。此外，区块链技术可能适用于从金融到医疗保健的广泛领域，应用范围涵盖更快的交易速度、防欺诈、数据集成，甚至食品安全。目前，已有
    80 多家公司正在开发区块链相关技术的实际用例。根据世界经济论坛的预测，在未来十年内，区块链平台将存储全球 GDP 的 10%。由于业务区块链部署的优势日益显现，通过衡量区块链创新潜力，我们认为识别那些具有利用区块链技术优化业务的最大潜力的公司对投资者将非常有帮助。为了帮助开拓这一新的投资领域，Reality
    Shares 创建了一套专有的区块链评分（Blockchain Score™）方法论，旨在识别处于区块链技术前沿的进步。区块链评分利用七个质量因素，这些因素代表了识别和实现公司区块链相关潜力的重要指标，并通过规模排名系统进行视觉化。正如你所看到的，区块链评分及随后的排名越高，公司在整个业务基础设施中适应和部署区块链技术的活动就越活跃。


    ### ING Groep（区块链评分：53）

    荷兰银行和金融服务公司 ING Groep。在短的时间内，该银行在建立区块链技术方面付出了巨大努力。从 2017 年开始，该银行通过 Easy Trading
    Connect (ETC) 开始与区块链技术接触，这是一个大宗商品贸易融资平台。目前，该公司的区块链计划包括 44 个概念验证项目并成功完成了 8 个实地试点。这些计划侧重于客户数据、贷款和债务交易。该银行在内部贸易中使用区块链可能具有更广泛的应用。随着区块链的采用，贸易相关纸质文件的数字化可以增加出口，并缩短时间和降低成本。根据联合国的的研究，仅在亚太地区，此类计划每年就能增加高达
    270 亿美元的出口，时间缩短了 44%，成本节省了 31%。2019 年，ING 预计将在此基础上继续开发，以更好地帮助客户。


    ### Mastercard（区块链评分：69）

    评分 69，我们 2019 年选择第四第四区块链相关股票是万事达（Mastercard）。讽刺的是，尽管区块链的底层原则旨在让像万事达这样的实体过时，但该公司正积极采用区块链来提高效率、降低成本并增加防范能力。区块链在贷款和信贷行业中减少欺诈的潜力可能节省数十亿美元，因为
    2016 年的损失估计为 280 亿美元。万事达正积极探索使用基于区块链的解决方案来帮助欺诈损失。此外，该公司已经创建了开发者可以开始创建应用程序的 API。尽管区块链有潜力颠覆其信用卡业务以及更广泛的银行贷款行业，但万事达正在进行战略性定位，通过将区块链技术融入其
    DNA 来适应这一趋势。


    ### Fujitsu（区块链评分：74）

    评分 74，我们 2019 年选择的第三只区块链相关股票是通电（Fujitsu）。日本科技公司通电是全球第 7 大的 IT 服务提供商，也是日本第一。它最近被选为日本银行协会（JBA）协作区块链平台开发转账结算系统的供应商。此外，该公司最近在比利时布鲁塞尔开设了一家区块链创新中心。该公司还致力于开发其他服务，包括基于业务证明（PoB）的快速通道咨询和
    360 度用例深度剖析，旨在帮助其他公司快速开发出成功的区块链解决方案。


    ### Alibaba Group（区块链评分：77）

    评分 77，我们 2019 年选择的第二只区块链相关股票是阿里巴巴（Alibaba），这是中国最大的电子商务和技术公司。截至 2018 年 9 月，阿里巴巴已申请了
    90 项区块链技术专利（相比之下，IBM 在同一时期申请了 89 项区块链相关专利。*注：原文 "in frame" 疑为笔误，意为“in the same
    period”*）。该公司已开发了多种区块链解决方案以优化和整合其业务板块。阿里巴巴的子公司 Lynx 已在其物流部门成功实施了区块链。阿里巴巴的另一个子公司“天猫”使用区块链来协助打击假货和欺诈。该公司还与中国政府合作在健康领域使用区块链。在支付方面，该公司的关联企业“蚂蚁金”在香港推出了基于区块链的汇款服务。在华成功实施项目后，该公司现在开始将其云区块链即服务（BaaS）扩展到中国以外的主要地区。


    ### IBM（区块链评分：92）

    评分 92，IBM 在区块链技术开发方面遥遥领先，也是我们小组中排名第一的。作为一家成立于 1911 年的技术领导者，IBM 继续开发新的创新；主要集中在人工智能、云计算和区块链领域。目前，IBM
    的解决方案工作得到了 1500 名专家的支持，拥有 500 多个项目。在产品方面，IBM 的平台提供了强大的支持。2018 年，IBM 启动了多项大型区块链计划，包括与沃尔玛合作的
    IBM Trust 平台——沃尔玛采用该平台通过集成供应链区块链来提高安全性。同样，IBM 支持的两个额外项目“we.trade”（一个基于区块链的贸易融资平台）和“CLNET”（一个基于区块链的支付服务）也于
    2018 年发布。


    BTL Group (BTL.V)

    BTL Group 长期以来一直是我们的首选区块链股票，原因有多个。该公司迅速洞察并采取行动应对区块链技术的颠覆潜力。他们成功开发并试点了其互联网平台，将区块链能力引入相关行业，以降低成本并提高效率。该公司目前似乎正关注能源领域，该领域对降低成本以保持竞争力有巨大需求。正如所提到的，我们在
    2017 年初其价格为 3 美元时推荐了这只股票。12 月，它达到了 19 美元。这是 InvestingHaven 研究团队提供的最优秀的免费股票推荐之一。我们喜欢
    BTL 是因为他们拥有真实且可靠的产品，该产品已通过试点并目前处于商业化阶段。我们喜欢现有的领导团队，并认为它是区块链板块的顶级竞争者。


    Leonovus (LTV.V)

    Leonovus 运营于云存储行业，最近开发了基于区块链的 Leonovus 3.0 平台和安全软件。他们宣布与加拿大六大银行之一达成了协议，安装 Leonovus
    3.0 软件以帮助该银行建立基于区块链的安全数据存储。


    Novatti (NOV.AX)

    自 1996 年以来一直从事支付业务，拥有成熟的支付解决方案组合，包括移动支付、汇款服务和电子代金分发。我们喜欢 Novatti 集团是因为 Novatti
    平台可以与区块链和加密货币交易所集成，实现比特币账户持有者之间的支付，以及比特币与法币之间的转换。

