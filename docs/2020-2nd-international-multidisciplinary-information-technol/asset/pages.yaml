    The Multipayer perceptron model classified 75.09% of the data and had MAE of 0.3026.
    Regression regression trend, correctly classifying 75.48% of the data.


    Confusion matrices are used to measure the success of machine learning algorithms.
    It shows proportion of a binary variable correctly and incorrectly classified.
    In the context of this study, the top left of matrix (TP) shows the data points
    were correctly and classified while the top right (FP) shows the data that were
    classified as Failed. The bottom left (FN) shows the data points that were failed
    but incorrectly classified, and the bottom right (TN) shows the data points correctly
    labeled as Failed.


    Bagging out the other algorithms in performance, perhaps due to the fact that
    it aggregates the results of multiple models. A student''s major was found to
    be the most significant attribute which was surprising. School quality was, probably
    because it is highly likely that the level and quality of high school education
    the student received. Grade, in subjects like Life Science, Mathematics, Life
    Orientation, English, also were good predictors of, unless specified, Maths Lit,
    AP Maths and NBT marks were not.


    # V. RESULTS


    The results correspond to the aforementioned models we used.


    Overall, the performance of the models was positive. Bagging produced the best
    result, classifying 75.97% of the data correctly. Random Forests came in a close
    second with 75.57% classification. This success may be due to its ability to predict
    unknown values. KNN performed, correctly classifying 64.8% of the data correctly
    and with an F-score of 0.376 for F and 0.563 for Q. The Suffix model with the
    least predictive performance classified incorrectly as incorrectly. The value
    for which it was found to be 1, which may explain why the predictive results were
    less so.


    In this research we aimed to, the use of machine learning models, the features
    of a student''s high school career are good predictors of their success in South
    Africa and if so, the feature space used in this study consists of the most commonly
    used subjects, NBT marks, the quality of the school the student attended, as well
    as the features on registration.


    # VI. CONCLUSION


    Bayesian Networks, Regression Multilayer Perceptron, K-Nearest Neighbors, Bootstrap
    Aggregation, and Random Forests were used to, the 10-fold cross validation to
    evaluate the accuracy of the predictive model. We found to be the best model for
    each feature, correctly classifying 75.97% of the data. Random Forests showed
    costly, closely classifying 75.57%, when KNN can name with 64.83. It is concluded
    that school quality, undergraduate major, life Science, and Mathematics in matrix
    have a significant effect on their choice


