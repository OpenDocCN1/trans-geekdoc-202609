    Learning analytics is a rich and exciting area of research and there is a great
    amount of knowledge to be discovered that could improve the lives and quality
    of education in South Africa for both students and educators. Due to South Africa''s
    high dropout rate, attention needs identifying vulnerable students as early as
    possible so that necessary support can be provided, ensuring every student has
    the highest chance of graduating, regardless of their background.


    Going forward, this research focuses on students in South Africa and tests whether
    these results hold up and which attributes are significant. The findings of this
    study, when applied to data, could help educators make more informed decisions
    when trying to identify vulnerable students by providing them reliable indicators
    that are readily available and easily accessible.


