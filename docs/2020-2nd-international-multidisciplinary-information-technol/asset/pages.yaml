  md: '# III. DATA


    This study was performed on synthetic data generated by a Bayesian network. A
    Bayesian network is a probabilistic model that uses a directed acyclic graph (DAG)
    to represent a group of variables and their relationships: nodes representing
    attributes and edges showing the dependencies between them. Nodes are not conditionally
    independent of one another. The node being a child of another node, forming a
    conditional causal link from the parent to the child node. This causal relationship
    uses Bayes'' Theorem which is defined in terms of conditional probability.


    reweights the instances in the data so that each class has the same total weight.


    61 attributes were collected in total, which was narrowed down to the 18 most
    relevant. These variables are summarised in Table I.


    ```

    $P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$ (1)

    ```


    | TABLE I. STUDENT ATTRIBUTES |

    | Attribute Name | Description |

    |---|---|n| Qualified | Whether a student is qualified or not (Value: Yes/No)
    |

    | SchoolQuintile | Quintile 1 consists of schools in each province catering for
    the 20% of learners, Quintile 5 is the group providing catering for the least
    20%. |

    | LifeOrientation | Life orientation grades |

    | MathematicsMath | Grades of a student they took math |

    | MathematicsLit | Grades of a student they took literacy |

    | AdditionalMath | Grades of a student if they took advanced maths |

    | EnglishFirstLang | English grade if taken as an additional |

    | EnglishFirstNational | Grade in the National Technical Academic Literacy section
    |

    | NBTMA | Grade in the National Technical Mathematics paper |

    | AdditionalLanguage | Grade in addition language, if any |

    | PhysicsChem | Grade in Physics and Chemistry |

    | Geography | Grade in Geography |


    where A and B are present, $P(A|B)$ is the probability of A given B and $P(B|A)$
    is the independent probabilities of A and B. $P(A), P(B)$ are the independent
    probabilities.


    The network used to generate the data can be seen in Figure 1. The Variable used
    as the measurement of success and count out of two values, either Failed (F) or
    Qualified (Q).


    More undergraduate degrees last 3 to 4 years and are based on credit system. In
    order to receive a qualification, a student is required to accrue a certain amount
    of credits in total, with more credits for advanced courses. In certain faculties,
    if a student fails a certain amount of times or credits they can be excluded from
    entering a course or dropping out of the university under the Failed criterion.


    To perform preprocessing, the non-sensical values which were like marks above
    100 as well as no high school data. 6178 students used and 4431 students qualified,
    which would have caused the algorithms to overfit the data, function ClassBaseline
    as implemented by Else [11] used. This function


    Attribution selection was performed, followed by the application of various methods.
    Initially, Gain [12] with 10-fold cross-validation was used in order to find the
    most useful attributes, using a cutoff of 0.001 merit. The results are shown in
