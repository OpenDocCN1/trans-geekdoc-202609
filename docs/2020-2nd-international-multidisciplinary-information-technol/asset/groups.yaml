    # 使用机器学习技术和高中成绩预测大一学生的毕业成功率


    Nastassia Philippou

    计算机科学与

    应用数学学院

    维特沃斯兰德大学

    南非，约翰内斯堡


    Ritesh Ajoodha

    计算机科学与

    应用数学学院

    维特沃斯兰德大学

    南非，约翰内斯堡


    Ashwini Jadhav

    科学学院

    维特沃斯兰德大学

    南非，约翰内斯堡

    ashwini.jadhav@wits.ac.ca


    **摘要**——教育和传记数据丰富可以帮助大学解决多样化问题，例如识别高风险学生。南非面临着独特的政治历史，这为教育领域带来了新的一系列的挑战。本文研究了学生的哪些属性能最好地预测他们是否毕业，以便识别面临学业风险的学生。文中展示了研究结果。数据是使用贝叶斯网络生成的合成数据，特征包括专业、高中成绩以及
    NBT（国家入学考试）。袋装法（Bagging）产生了最佳结果，正确分类了 75.9% 的数据。


    ## II. 相关工作


    对学生表现的预测已研究多年，最早的研究之一是 Campbell 在 [3] 中通过线性回归研究，发现学术能力测试（SAT）分数和高中成绩是预测成功的最优指标。Butcher
    在 1998 年发表的一篇论文发现了类似的特征，即美国学院测试（ACT）和平均绩点（GPA）是最佳特征，但其预测成功率高得多。1992 年，Smith [5]
    也发现 GPA 和考试成绩是最好的。


    **关键词**——教育；学习分析；机器学习；


    在这些研究的基础上，通过引入更多变量（如课程表现），Goud [6] 构建了一项使用年龄、性别、高中成绩和学校读类型等变量的研究。该研究得出的成功率分别为
    42% 和 65%。在南非，Spark [7] 研究了高中数学成绩和资助水平，发现这些因素与大一级课程学生之间存在某种关系。


    ## I. 引言


    南非面临着大学危机，辍学率极高。尽管由于种族隔离政策，资金已从 1998 年的 500,000 下降到 2011 年的 938,201，但大学仍未准备好应对这一增长，大一辍学率在
    40% 左右。


    近年来，研究人员开始使用人工智能算法来解决这一问题。[8] 使用决策树、随机森林、神经网络对数据进行了分析，包含 375 个不同的变量，比之前的研究有了显著增加。结果各不相同，使用线性判别法的最佳结果达到了
    75.5% 的显著性水平。


    观察一个学生群体，只有 22% 的学生在三年内完成了大三学业。[9] 指出，2000 年至 2005 年期间人数的下降导致国家财政损失了 45 亿拉兰特的高等教育赠款和补贴，而这些投资并没获得回报。不平等、缺乏公平的资助以及政府糟糕的教育使得南非学生变得格外脆弱，并增加了分析数据以提取意义信息的重要性，这些信息可以用于改进学生支持的数量和质量。


    大多数研究在 2009 年，Tsiakami [10] 也对大群体学生使用了一系列机器学习算法。[9] 使用了家庭、学术和个人信息等变量，发现支持向量机算法取得了良好结果，F1
    分数为 0.867。


    本研究旨在识别学生的高中成绩以及判断其是否面临无法完成学位风险的指标。越早识别出高风险学生，大学工作人员就能越早干预并为学生提供所需的支持和资源。


    Tsiakami [10] 使用了先前的研究等科目变量，但学生如何进入系以及学生通过某门课程的次数等变量是新的。随机森林提供了良好的准确率，是本研究中所有算法中表现最好的。


    ## III. 数据


    本研究是基于贝叶斯网络生成的合成数据进行的。贝叶斯网络是一种概率模型，使用有向无环图（DAG）来表示一组变量及其之间的关系：节点表示属性，边显示它们之间的依赖关系。节点之间不是条件独立的。一个节点作为另一个节点的子节点，构成了从父节点到子节点的条件因果链路。这种因果关系使用了根据条件概率定义的贝叶斯定理。


    重新加权数据中的实例，使每个类具有相同的总权重。


    总共收集了 61 个属性，然后缩小到最相关的 18 个。这些变量总结在表 I 中。


    $P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$ (1)


    | 表 I. 学生属性 | |

    | 属性名称 | 描述 |

    |---|---|

    | 是否合格 | 学生是否合格（值：是/否） |

    | 学校分位 | 第 1 分位由每个省份负责服务 20% 学习者的学校组成，第 5 分位是提供服务的群体 |


