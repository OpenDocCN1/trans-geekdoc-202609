    Johannesburg, South Africa

    ashwini.jadhav@wits.ac.ca


    **Abstract**—Educational and biographical data riches could help universities
    and tackle a diverse range of problems, such as identifying at risk students.
    South Africa faces a unique and political history which creates new sets of challenges
    in the education sector. This paper investigates which attributes of a student
    best predict whether they will graduate so as to identify students who face academic
    risk. The results are presented. The data was synt generated using a Bayesian
    network with features such as the major and high school grades well as NFT. Bagging
    produced the best results, correctly classifying 75.9% of the data.


    # II. RELATED WORK


    Prediction of student performance has been studied for many years, with one of
    the earliest, Campbell in [3] by linear regression and finding Scholastic Aptitude
    Test (SAT) scores and high school grades as the best predictors of success. A
    paper published in 1998 by Butcher found similar features, American College Testing
    (ACT) and Grade Point Average (GPA), the best features but much greater predictor
    than success. In 1992, Smith [5] also found that GPA and exam scores were the
    best.


    **Keywords**— education; learning analytics; machine learning;


    Building on these studies by more variables like course performance, Goud [6]
    constructed a study using variables such as age, gender, high school grades and
    schooling type. This study made success of 42% and 65%. In South Africa, Spark
    [7] looked at high school math grades and levels of funding, finding a relationship
    between them and students in a first-year course.


    # I. INTRODUCTION


    South Africa faces university crisis with an extremely high dropout rate. Even
    though funding has declined from 500,000 in 1998 to 938 201 in 2011 due to apartheid,
    universities have been unprepared to handle this increase with first-year dropout
    rate of around 40%.


    In recent years, researchers started Artificial Intelligence algorithms to solve
    the problem. [8] used decision trees, random forest, neural networks, and performed
    analysis on the data, with 375 different variables, a significant increase from
    previous studies. Results were mixed, with the best results using linear discriminant
    reaching significance of 75.5%.


    Looking at a cohort of students, only 22% of them completed their third year within
    three years. [9] indicates that the drop in numbers during the period 2000 to
    2005 cost the National Treasury R4.5 billion in grants and subsidies to higher
    education without their investment. Inequity, a lack of fair funding plus poor
    government education makes South African students especially vulnerable and increases
    the importance of analysing data to extract meaningful information that can be
    used to improve the amount and quality of support to students.


    Most, in 2009 and Tsiakami [10] have also used a range of machine learning algorithms
    on large groups of student. [9] used variables such as family, academic and personal
    information, finding good results with the support vector machine algorithm, with
    an F1 score 0.867.


    The aim of this study is to identify a student''s high school marks and indicators
    of whether they are at risk of not completing their degree. Because the earlier
    an at-risk student can be identified, the university staff can intervene and provide
    the student with the support and resources required in order.


    Tsiakami [10] used subject variables like previous studies, but variables such
    as how the student entered the department and number of times a student failed
    a course were new. Random forests gave a good accuracy and the best of all the
    algorithms in this study.'
