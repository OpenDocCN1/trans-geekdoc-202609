    # 表 IV. 混淆矩阵示例


    | | 正类 | 负类 |

    |--- |--- |--- |

    | **正类** | TP | FP |

    | **负类** | FN | TN |


    多层感知器模型分类了 75.09% 的数据，平均绝对误差（MAE）为 0.3026。回归趋势正确分类了 75.48% 的数据。


    混淆矩阵用于衡量机器学习算法的成功率。它显示了二分类变量被正确分类和错误分类的比例。在本研究背景下，矩阵的左上角（TP）显示被正确分类的数据点，右上角（FP）显示被分类为“失败”的数据。左下角（FN）显示已失败但被错误分类的数据点，右下角（TN）显示被正确标记为“失败”的数据点。


    Bagging 算法在性能上优于其他算法，这可能是因为它聚合了多个模型的结果。发现学生的专业专业是最显著的属性，这令人惊讶。学校质量也是重要的因素，可能是因为学生所接受的高中教育水平和质量差异很大。成绩在生命科学、数学、生活导向、英语等科目中也是良好的预测指标；除非特别说明，数学文学（Maths
    Lit）、AP 数学和 NBT 分数不是。


    # V. 结果


    结果与我们使用的上述模型对应。


    总体而言，模型的性能是积极的。Bagging 产生了最佳结果，正确分类了 75.97% 的数据。随机森林（Random Forests）紧随其后，分类率为
    75.57%。这种成功可能归于其预测未知值的能力。KNN 表现良好，正确分类了 64.8% 的数据，其中 F 的 F 分数为 0.376，Q 为 0.563。预测性能最差的
    Suffix 模型分类错误率最多。其值被发现为 1，这可能解释了为什么预测结果较差。


    在这项研究中，我们旨在通过使用机器学习模型确定学生高中阶段的特征是否是其在南非成功的良好预测指标，如果是的话，本研究使用的特征空间由最常用的科目、NBT 分数、学生就读学校的质量以及注册特征组成。


    # VI. 结论


    使用了贝叶斯网络、回归多层感知器、K-近邻、Bootstrap 聚合和随机森林，并通过 10 折交叉验证来评估预测模型的准确性。我们发现 Bagging 是每个特征的最佳模型，正确分类了
    75.97% 的数据。随机森林紧随其后，分类率为 75.57%，而 KNN 为 64.83%。结论认为，学校质量、本科专业、生命科学和数学对他们的毕业选择有显著影响。


