    The following models were used to learn the predictive functions, with 10-fold
    cross validation:


    +   - Bayesian Network **- A probabilistic model that uses a directed acyclic
    graph (DAG) to represent variables and their conditional dependencies. These models
    work well when the probability of one of several known constants is a causal factor
    in a given event, such as a lawsuit.

    - Regression **- A statistical model that uses regression to estimate the parameters
    of a logistic function with a binary dependent variable. Its relationship the
    relationship between one dependent variable and one or more independent variables
    is ideal for when the dependent variable can only take one of two values, for
    of Q.

    - Multilayer Perceptron (MLP) **- A deep learning model that classifies a directed
    graph of input nodes connected by the input and output layers. It is a feedforward
    neural network that generates a set of outputs from sets of inputs and uses backtracking
    to train the network.

    - K-Nearest Neighbors (KNN) **- A simple algorithm that classifies a point based
    on the classification of the k closest points around it, assuming similar data
    points are close to each other. This scheme of algorithm depends on the k value
    chosen as well as the distance metric, and is very sensitive to outliers, so multiple
    k values are tested to find the one with the best predictive results.

    - Bootstrap Aggregation (Bagging) **- An ensemble machine learning model which
    is composed of two parts: aggregation and bootstrapping. It selects samples with
    replacement and runs the learning algorithms on the selected samples. It aggregates
    the predictions of the multiple weak learning models and chooses the best based
    on minimizing variance-bias tradeoff.

    - Random Forests **- An ensemble machine learning model. It creates multiple different
    decision trees which produce their own prediction and the class is the mode or
    mean of the individual trees used. It means that the whole is greater than the
    sum of its parts. With Random Forests, overfitting is less likely, and it is a
    good model when there are missing values, the case for the dataset used in this
    study, shown in Table III. [18]


    To evaluate your performance, the evaluation metrics were used:


    $Recall = \frac{TP}{TP+FF}$ (2)


    $Precision = \frac{TP}{TP+FP}$ \n$F - score = \frac{1}{\sum_{i=1}^{n} |y_i - \hat{y}_i|}$
    (4)


    TP: True positives


    FN: False negatives


    Precision is defined as the fraction of relevant instances among the retrieved
    instances, while recall is defined as the fraction of the total relevant instances
    that were actually retrieved.


    For instance, if 10 identified students are in a data that contains 14 qualified
    students and failed 8 of the 10 as identified did qualified (TP), the recall is
    8/14 (TP). If did not (FP), the precision is 8/14.


    The F-score measures a model''s accuracy. It is defined as the harmonic mean of
    a test''s precision and recall and provides a more realistic measure of a test''s
    performance than precision or recall individually as it balances the use of both.


    Mean error (MAE) measures the size of the error in a model. It takes an actual
    data point and subtracts the predicted value, which is the error for every data
    point in the set, sums up the absolute of these values and takes the average.'
