    # # Using Machine Learning Techniques and Matric Grades to Predict the Success
    of First Year Students


    Nastassia Philippou

    School of Computer Science and

    Applied Mathematics

    The University of the Witwatersrand

    Johannesburg, South Africa


    Ritesh Ajoodha

    School of Computer Science and

    Applied Mathematics

    The University of the Witwatersrand

    Johannesburg, South Africa


    Ashwini Jadhav

    Faculty of Science

