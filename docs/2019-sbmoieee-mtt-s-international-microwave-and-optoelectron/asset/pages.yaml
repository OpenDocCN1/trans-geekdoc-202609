    # III. SIMULATION


    Samples were designed as the following examples: a sample relative to a faulty
    anchor rod (H1), H2D80 relative to a faulty (D1) two-meter rod (H20) with 20 cm
    length, and a fault which is positioned 50 cm from the center. Sample rod H2D80-20
    (a faulty two-meter rod (D2) with 20 cm length, and the fault is positioned 100
    cm from the center). Sample rod H1D80-10 (a faulty one-meter rod with 10 cm length
    and two faults positioned 80 cm from the eye reference). Table I details the sample


    All faults were made of 10 or 20 mm length and 16.5 mm, the external diameter
    of the rods was 33 mm. The measurements were performed for all 20 samples.


