    The first classifier was trained to separate the signals of the one-meter robots
    from those of the two-meter robots. The two remaining classifiers were trained
    to detect the presence of faults among the one-meter and two-meter robots respectively.
    A vector x was used for training and testing of the classifiers, which were optimized
    by using 101 points of each measured robot signal.


    # VII. CONCLUSIONS


    This paper presents a promising non-destructive methodology to detect fault in
    anchor rods used in towers of power transmission lines, elements electromagnetically
    capable and mechanically robust.


    # VI. RESULTS AND DISCUSSION


    Measurements and simulations were performed on the one-meter and two-meter robots,
    and SI behavior patterns were determined to characterize each.


    The "Mean. Average" results were delivered also shown in Fig. 4 (a) and (b). However,
    the binary classifier performed the analysis using the 130 measurements in the
    database and the subset used to reduce the inherent errors in the precision measurement.
    The visual analysis on Fig. 4 shows slight variations on the faulty and faultless
    results. This suggests that a machine learning structure to determine condition
    accuracy works.


    Binary classifiers were applied to analyze the measurements, which the accuracy
    average over 98.33%. However, an input database with different fault patterns
    on the anchor rod improves the results of reducing the over-fitting issues.


    The three binary classifiers obtained accuracies of 99.28% in the test of the
    identity of the robots, 98.33% on the detection of faults for the one-meter robots,
    and 100.00% on the detection of faults for the two-meter robots. This suggests
    that the logistic regression binary classifiers are able to detect accurately
    the length and the presence of faults on the rods through the analysis of Figure
    5.


    The analysis was performed on 2-meter robots. Anchor rods length can be used for
    this method. For this, classmates must be previously developed. The obtained results
    showed that the proposed methodology may be applied to build a system to detect
    faults on anchor rods used in towers of power transmission lines.


