    range up to 1GHz using the 1001 points resolution. Each sample rod was measured
    10 times to calculate the point-to-point value from the parameter S11 of these
    measurements, and we generate a more reliable result. This new result was calculated
    measurement average, or "Means". The measurements were used for training and testing
    the machine learning structure. As shows the results of the simulation and the
    ''Mean''. For the H1n rod the frequency range was -21.40 db for the measurement
    result, and -22.6 db for the simulation result. These results show a good agreement
    between the simulation model and the measurement setup.


    # V. THE MACHINE LEARNING STRUCTURE


    In order to detect the faults of the one and two-meter rods, three binary classifiers
    were built using the logistic regression algorithm implemented. Logistic regression
    is a classification model for which the output may be expressed as a logistic
    sigmoid acting on the input features. The proposed logistic regression classifier
    is simple to implement and fast to use.


    Its probability is expressed as a function of the feature vector x and the set
    of learned parameters by the expression (1)


    ```

    p(G_k|x) = 1/(1+exp(-w^T x))

    ```


    For the binary case, the fault x is classified as a member of the class C if p(G_k|x)
    > 0.5.


