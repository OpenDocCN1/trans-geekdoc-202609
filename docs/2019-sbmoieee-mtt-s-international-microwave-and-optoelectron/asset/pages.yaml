    # IV. MEASUREMENT AND VALIDATION SYSTEM


    The measurements were carried out and their results were compared with the ones
    obtained by the simulations, which allows to evaluate the error caused by simulations.


    A total of 130 measurements were carried out. Ninety using faulty anchor rods
    and 40 using flawless anchor rods. A set of 20 samples were prepared to measure
    the measurements: 10 one-meter rods (just 1 faulty rod) and 20 two-meter rods
    (just 1 faulty rod). The VNA was calibrated in the frequency


