    *Abstract—This paper presents a new methodology based on a FDR technique and machine
    learning to detect faults on anchor rods used under power of transmission lines.
    Faults are due to material loss in the rods, which may break, and can cause total
    failure. The proposed non-destructive (NDT) method uses frequency domain reflectometry
    (FDR). For detection, high-frequency pulses are inserted into the anchor rod and
    analyzed in the simulated results. A dataset of anchor rods with and without faults
    was simulated, manufactured and classified by a machine learning structure to
    determine the presence or absence of the faults.*


    A new method to detect faults on anchor rods, used to fix in soiled ground of
    transmission lines, was developed. The detection of presence or not of anchor
    rods uses an FDR method [5-9], and S11 parameter analysis by a machine learning
    structure. The experimental setup consists of a vector analyzer (VNA), coupled
    with a Custom-High Frequency Analyzer Filter (CHAAF, in Portuguese), and reflections.
    The VNA is connected to the rods through the CHAAF. Machine learning-based classifiers
    classified the presence and absence of faults on the anchor rods. A machine learning
    structure based on logistic regression was used to implement a classifier for
    the rod condition. The performance was simulated for a frequency range up to 1
    GHz with 1001 data points the input was processed by the classifier.


    *Keywords—anchor rod, transmission lines, frequency domain reflectometry, machine
    learning, non-destructive*


    # I. INTRODUCTION


    The electric power transmission structures that support the cables. The V-type
    cables and anchor rods are the main elements in the assembly and fixation of this
    kind to the soil. In case of failure, the anchor rod may fall to the ground, interrupting
    the power supply.


    The most common method of assessing the anchor rods'' condition is visual inspection,
    however, the soil is corroded and the rod corroded. This technique is effective
    but destructive. Therefore, non-destructive techniques are applied in problems
    like that in [1] where open microwave rectangular waveguides were proposed to
    detect the presence of surface breaking cracks in soil using microwave reflectometry
    (30-300 GHz range) [2] were also objects of study. In [3] a study is presented
    where acoustic waves are inserted in cylindrical rods of 15 mm width and the signal-to-noise
    ratio (SNR) the fault or corrosion is detected.


    # II. METHODOLOGY


    The proposed fault detection system is based on the classification of regard of
    length and condition, with and without faults, by a machine learning algorithm
    that performs the analysis of the S11 signals measured. The. Techniques of propagation
    of electromagnetic waves in high frequencies as well as concepts of interaction
    between the rod and a transmission line by parallel conductors, with different
    diameters, to a system developed in [9]. When the electromagnetic wave reaches
    a discontinuity, a reflection wave is sent back to the source and is analyzed
    on the conductors. Thus, this system is characterized by non-destructive measurement
    and analysis techniques with fast and accurate results. Fig. 1 presents the measurement
    setup.'
