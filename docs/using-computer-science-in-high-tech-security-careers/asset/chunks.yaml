- raw: 'Abusiness owner learns that one of his employees is secretly planning to leave
    the company. He suspects that the employee is going behind his back and trying
    to take several of the company’s clients with him to his new job. How can the
    owner find out if his suspicions are true? He turns to the detectives of the cyber
    world—computer forensic specialists. These cybersecurity professionals look through
    the employee’s actions on company computers, systems, and online to see if they
    can find any incriminating evidence. If they do, the owner can use it to confront
    the employee.


    CYBER DETECTIVES ON THE CASE


    Computer forensics is a branch of forensics, the use of scientific tests or techniques
    in the investigation of a crime. Computer forensic experts collect, analyze, and
    present digital evidence in a crime investigation. They uncover information on
    computer systems, hard drives, CDs, and other storage devices. They comb through
    electronic documents and files such as emails and images. In many cases, digital
    evidence can be extremely difficult to find and gather because it is hidden or
    deleted. To find it, computer forensic experts use various software programs and
    other applications to uncover and extract latent or hidden data in a computer’s
    systems. They work with many types of companies and organizations, including government
    agencies, accounting firms, law firms, banks, and software development companies.
    Any organization with a computer system may need the services of a computer forensic
    specialist.


    ![](Images/page_18-1.jpg)


    A computer forensics expert solders a piece of wire to a motherboard that will
    be attached to a computer to collect digital information for an investigation.


    Alfred Demirjian is the president and chief executive officer of computer forensics
    company TechFusion. Over his thirty years in computer forensics, he has been hired
    for many scenarios. In one case, he uncovered evidence of an employee sabotaging
    a former employer by hijacking an email account. In other cases, he has gathered
    evidence of employees misusing the internet while at work. Using forensic software,
    Demirjian can dig deep into an employee’s social media postings and texts. He
    can sift through company emails during a specific date range to find evidence
    of an employee’s interactions with clients and others. He can even track the employee
    by GPS if he or she has a company-owned smartphone. “Computer forensics will play
    a greater role in exposing the malicious acts of people. As it continues to advance,
    it will make it more difficult for people to hide their wrongful acts and easier
    to have them held responsible,” Demirjian said in an article published in *CSO*
    magazine.


    Every case that uses computer forensics is different. For example, a computer
    forensic specialist may be called in by law enforcement to help with the investigation
    of a person suspected of domestic terrorism. The specialist may be asked to identify
    and analyze all records of communication, internet activity, and data related
    to past or planned criminal activities. In another case, a computer forensic specialist
    may be called when an external hacker gains access to a corporate server that
    holds valuable information. The forensic specialist will determine how the hackers
    gained access to the server, if they accessed or stole data, and whether they
    introduced any malware or other hostile activity against the system.


    WORKING IN COMPUTER FORENSICS


    People working in computer forensics combine a computer science background with
    forensic skills. They assist law enforcement and companies by collecting, analyzing,
    and presenting the digital data they uncover. The primary job of a computer forensic
    specialist is to find and collect the visible and hidden digital information on
    a computer system or other digital device. Sometimes, collection of data occurs
    on-site, at a suspect’s home or office. More frequently, the devices to be examined
    are transported to a computer forensics lab for examination. Once the devices
    reach the lab, computer forensic specialists use a variety of technical tools
    to search for and collect data.


    Computer forensic specialists analyze the data they collect. They explain what
    the data is, where it was recovered from, and what it might mean in a case to
    law enforcement and other investigators. Forensic specialists document each step
    they take during the recovery and analysis of digital data, so that the data can
    be used in court. Sometimes, the analysis of data can uncover new leads in a case
    and point the forensic specialist in a new direction.


    ![](Images/page_21-1.jpg)


    Detective Shannon Geaney of the Los Angeles Police Department demonstrates computer
    forensics in a mobile lab, which is used to help the department investigate cyber
    crimes.


    Once they have collected and analyzed data, computer forensic specialists typically
    prepare a written report of their findings. This report includes all discovered
    data that relates to the investigation. In some cases, computer forensic specialists
    may be called to share their report and findings in meetings or in court. “The
    best examination in the world is useless if you can’t communicate clearly in a
    written report that can be easily understood by an agent, officer, lawyer, or
    jury,” said John Irvine, a vice president at digital forensics and data recovery
    company CyTech, in an interview posted on the Balance Careers website.


    According to Irvine, digital forensics is valuable because it provides information.
    He said in the interview posted on Balance Careers:


    **Whether that information is evidence for a Federal criminal case or knowledge
    of an insider stealing corporate intellectual property for a competitor, digital
    forensics professionals provide data that the customers otherwise do not have
    available. In very simple terms, one could liken the job of a digital forensic
    examiner to that of a photo developer. For example, if I have an undeveloped roll
    of film in my hands, that’s almost useless to me as any kind of evidence. However,
    if someone develops that film into pictures (or recovers data from a hard drive
    in our case), that content can provide everything the prosecutor, HR manager,
    or corporate security officer needs.**


    SUMMER CAMP WITH THE NATIONAL SECURITY AGENCY


    While many teens are swimming, hiking, and toasting marshmallows, students at
    the National Security Agency (NSA)–sponsored summer camp at Marymount University
    learn how to crack encrypted passwords. At the computer, sixteen-year-old Ben
    Winiger typed a command into a software tool designed to help test and break passwords.
    “Now we’re trying a brute-force attack,” said Winiger in an article in the New
    York Times.


    This GenCyber summer camp, and others like it around the country, teach middle
    school and high school students some of the skills they will need for future careers
    in cybersecurity. Each camp receives loose guidelines from the NSA and is free
    to decide which topics and exercises it will offer. According to the Marymount
    camp head Diane Murphy, an IT professor, her camp teaches students how to hack
    so that they can better defend against cyberattackers they might encounter in
    the future. NSA officials hope that camps like GenCyber for students will help
    build the next generation of computer forensics and cybersecurity professionals
    who will be needed to fill thousands of new cybersecurity jobs in the future.


    HOW TO BECOME A COMPUTER FORENSIC SPECIALIST'
