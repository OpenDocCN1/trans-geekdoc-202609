- raw: 'For a career in computer forensics, most candidates earn a four-year degree
    from a college or university in IT, computer science, or a related field. In these
    programs, students learn about computer operating systems, networks, hardware,
    and software applications. Students can also take courses in accounting and criminal
    justice to learn skills they will need in a computer forensics career. High school
    students interested in computer forensics can take classes in computer science,
    programming, and accounting to prepare for this career.


    While a few schools offer computer forensics programs, many forensics professionals
    learn advanced investigative techniques and skills on the job. “Computer Forensics
    is an apprenticeship discipline,” said Irvine in an interview posted on Balance
    Careers. “You really learn the trade once you’re in a seat working on real cases
    alongside a senior examiner.” In entry-level positions, computer forensic professionals
    can gain hands-on experience with hacking and intrusion techniques, security testing,
    and computer system diagnostic testing. In addition to strong technical skills,
    computer forensic professionals should have strong analytical skills, be detail
    oriented, and be able to juggle multiple projects and tasks at the same time.


    ![](Images/page_24-1.jpg)


    College students majoring in computer science listen and take notes during a lecture
    where they learn about different computer operating systems.


    Some employers require computer forensic professionals to be certified. Earning
    a certification demonstrates that the professional has mastered specific skills
    needed for the job. For computer forensic professionals, professional organizations
    such as the International Society of Forensic Computer Examiners and the International
    Association of Computer Investigative Specialists offer a Certified Forensic Computer
    Examiner certification. The certification must be renewed every three years.


    THE JOB OUTLOOK IN COMPUTER FORENSICS


    The job outlook for computer forensics careers is expected to be very good. According
    to the Bureau of Labor Statistics (BLS), employment of information security analysts,
    which includes computer forensic professionals, is projected to grow 28 percent
    from 2016 to 2026. This rate of growth is much faster than the average growth
    rate of all occupations (7 percent). As more crime occurs online and cyberattacks
    increase in frequency, computer forensic professionals will be needed to uncover,
    analyze, and present this digital data for investigators and courts. In addition,
    computer forensic professionals will be needed to help organizations in many industries
    protect their computer systems from hackers.


    Computer forensic professionals with related experience, a computer science degree,
    and a forensics certification will likely have the best chance at landing a good
    job in computer forensics.


    CHAPTER THREE


    PROTECTING COMPUTER NETWORKS


    Every day, more information moves online, including financial records and Social
    Security numbers. As a result, organizations are becoming more vulnerable to data
    breaches, which occur when hackers attempt to break into an organization’s databases
    and systems to steal information. Such break-ins are a growing problem and cost
    companies millions of dollars. According to the Ponemon Institute’s *2017 Cost
    of Cyber Crime* report, security breaches are increasing. These breaches are costing
    organizations an average of $11.7 million per year. One of the most successful
    breaches in recent years occurred in 2017 when 147 million customer records were
    stolen from Equifax, a consumer credit reporting agency. The stolen records included
    customer names, birth dates, Social Security numbers, addresses, and more personal
    information.


    Hackers do several things with the information they steal. They might sell it
    on the black market, use it to commit identity theft, or use it to directly steal
    from or otherwise take advantage of their victims. As a result, protecting the
    information generated by businesses, clients, and consumers has become an enormous
    task for companies across all industries.


    ![](Images/page_27-1.jpg)


    A customer inserts a credit card into a payment machine. Information security
    analysts design solutions to keep customer personal information safe.


    WORKING AS AN INFORMATION SECURITY ANALYST


    Organizations hire information security analysts to guard and protect their information
    systems. These analysts plan security procedures and put security systems into
    effect. Their goal is to protect an organization’s computer systems, networks,
    and data from cyberattacks, data breaches, and other unauthorized access or usage.


    In a typical day, information security analysts will monitor an organization’s
    networks, looking for signs of a breach. Signs include unusual data traffic patterns
    entering or leaving a company’s network or changes in a privileged user’s account
    activity. If analysts suspect a breach has occurred, they will investigate, resolve,
    document, and report the incident. These analysts also install firewalls and use
    data encryption programs to protect a company’s data. They simulate attacks on
    the organization’s networks to identify vulnerabilities that need to be fixed.
    They research the most up-to-date security procedures and products, develop an
    organization’s long-term information security plan, and make recommendations about
    security to senior management. They also help the company’s employees learn to
    use security products and procedures so they can avoid getting fooled by the many
    scams that hackers think up to gain access to confidential information.


    Although all computer science professionals need to stay up-to-date on the latest
    industry trends, doing so is particularly critical for information security analysts.
    As soon as security analysts prevent one type of cyberattack, would-be hackers
    come up with schemes and tricks to launch another one. As a result, information
    security analysts need to know the latest types of attacks cybercriminals are
    launching and what technologies and techniques are being developed to combat them.
    To do this, they may attend conferences, where they meet with other professionals
    to discuss new attacks and protection strategies.


    ![](Images/page_29-1.jpg)


    At a cybersecurity conference, hackers participate in a test to identify security
    weaknesses. This test will help information security professionals develop better
    cyber defenses.


    Part of this job involves creating a disaster recovery plan for an organization’s
    data and computer systems. If a natural disaster strikes, the organization must
    be able to recover and restore operations as quickly as possible. This usually
    involves making regular copies of valuable data and transferring it to a secure,
    offsite location. Analysts also develop plans to restore computers and networks
    after a disaster.


    According to information security professional Andrea Hoy, a typical day for her
    can involve many things. She initiates responses to potential threats, analyzes
    captured digital data for an investigation, and tests new code to ensure that
    it is secure. She also creates reports on her department’s activities, such as
    the number of blocked phishing attacks for the month. Hoy also reviews the company’s
    cybersecurity policies and procedures, evaluates new and existing cybersecurity
    tools, and answers questions about the implementation of new technologies. Her
    job keeps her busy and fulfilled. Hoy said in an article posted on the *U.S. News
    & World Report* website that “it provides great challenges on a daily basis.”


    STEPS TO BECOME AN INFORMATION SECURITY ANALYST'
