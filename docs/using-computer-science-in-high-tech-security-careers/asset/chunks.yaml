  trans: '

    # 信息安全分析师


    大多数信息安全分析师至少拥有四年制学院或大学的计算机科学、计算机编程或相关领域的学士学位。一些学校设有专门面向信息安全专业人员的课程。一些雇主要求应聘者拥有信息系统方向的工商管理硕士学位。


    许多雇主倾向于有相关工作经验的应聘者，例如在 IT 部门担任网络或系统管理员的经验。寻求聘用数据库安全分析师的组织可能更倾向于曾担任过数据库管理员的应聘者，而寻求聘用系统安全分析师的组织则可能更倾向于曾担任过计算机系统分析师的应聘者。


    ![](img/page_31-1.jpg)


    信息安全分析师在控制中心协作，聆听主管汇报针对公司网络的最新入侵尝试情况。


    虽然信息安全分析师没有强制性的认证或执照要求，但一些自愿参加的培训和认证可以提高一个人获得工作或晋升的机会。一些认证是通用的，而另一些则针对特定领域，如渗透测试或系统审计。霍伊在
    *U.S. News & World Report* 网站发布的一篇文章中表示：“虽然我不觉得你应该把所有时间都花在积累名头后缀的字母上，但拥有学士学位和一项入门级认证在寻找第一份工作时真的能让你脱颖而出。”


    除了技术技能，成功的信息安全分析师还应具备强大的分析、批判性思维和解决问题的能力。他们必须能够识别和分析安全风险与问题，识别并评估可能的解决方案，并找出保护组织系统和网络的最佳途径。他们还必须极其注重细节，以便像侦探一样研究系统，寻找网络攻击或数据泄露的蛛丝马迹。这些泄露可能通过网络流量的变化、用户账户活动、地理登录模式或对同一文件的重复请求数量等迹象表现出来。此类分析师必须极其恪守职业道德，因为工作的某些部分可能涉及入侵系统，以凸显需要加固的薄弱环节。


    ## 获取经验：网络安全实习


    实习工作可以帮助学生获得宝贵的实践经验，并建立信息安全职业生涯所需的核心技能。作为一名实习生，蒂芙尼·史密斯曾在网络安全公司 Foreground Security
    工作。每位实习生都会被分配一项任务：史密斯的项目是将一个名为 Opsview 的监控工具安装到 Red Hat 服务器上。史密斯花费了大量时间琢磨如何安装该监控工具。“这对我来说极具挑战性，但我通过记录安装每个阶段所采取的步骤，最终解决了问题，”史密斯在
    Keirsten Brager.tech 的一篇博客文章中说道。“这段经历为我应对第一份全职网络安全工作中等待我的挑战做好了准备。我的项目在实习结束时被选中并投入了公司的生产环境，我当时欣喜若狂！”


    ## 信息安全分析师的就业前景


    信息安全分析师的就业前景非常广阔。根据 BLS 的《职业展望手册》，2016 年至 2026 年期间，信息安全分析师的就业人数预计将增长 28%。霍伊在 U.S.
    News & World Report 网站发布的一篇文章中表示：“这个领域的工作到处都是。我们目前面临网络安全专业人员短缺的问题。”


    随着越来越多的信息以数字形式存储，网络攻击和数据泄露的数量不断增加，对信息安全分析师的需求也将随之增长。面对日益复杂的网络威胁，各行各业的企业都需要加强防护以确保公司信息安全，这将增加对信息安全分析师的需求。特别是医疗保健行业，随着更多医疗公司使用电子病历，保护这些记录的需求也将增长，因此对信息安全分析师将有强劲的需求。据招聘网站
    CareerCast 称：“敏感在线内容的激增，以及云计算日益增长的重要性，正在推动对更多信息安全分析师的需求。”


    # 第四章：道德黑客


    企业越来越多地面临黑客和网络犯罪分子的攻击，且问题日益严重。公司在最新的高科技安全创新上投入数百万美元以保护其网络。他们还聘请渗透测试人员来测试网络到底有多安全。


    作为计算机科学众多职业之一，渗透测试是指测试计算机系统、Web 应用程序或网络以发现安全弱点的实践。渗透测试人员，也称为道德黑客，负责确保客户的计算机网络和系统免受外部入侵者的侵害。为此，渗透测试人员使用现实世界中犯罪黑客的技术，尝试发现客户系统和程序中的弱点。他们对公司的网络、软件和应用程序运行测试。他们尝试访问本不该访问的数据。


    ![](img/page_36-1.jpg)


    尽管公司的服务器机房看似空无一人，但其网络频繁面临黑客试图未经授权访问的攻击。


    渗透测试人员必须极具创造力，并时刻思考“攻击”系统的新方法。在工作过程中，他们会详细记录采取的步骤和发现的任何漏洞。虽然每个客户情况不同，但总体目标是一致的：模拟现实世界中犯罪黑客每天发起的攻击，并向客户报告这些模拟的成败。


    当他们发现问题或漏洞时，渗透测试人员会通知客户。他们与其他 IT 专业人员合作，找出修复弱点和加强数字安全的最佳方案，以防外部黑客有机会入侵系统、造成破坏并窃取信息。为此，他们可能会重写程序代码，或增加额外的安全技术或程序。执行测试时，他们会将结果和发现记录在报告中供公司管理层参考。


    ## 渗透测试工作实况


    亚历山大·戈尔科维恩科和史蒂文·范德巴恩是网络安全咨询公司 7Safe 的渗透测试顾问。他们大部分时间都在尝试闯入公司的计算机系统。每个客户使用不同的技术，带来独特的挑战。有时戈尔科维恩科和范德巴恩会执行
    SQL（结构化查询语言）注入，即将查询语句植入数据库，使黑客能在未经授权的情况下操纵数据库。其他时候，他们会实施网络钓鱼攻击，即黑客通过电话或电子邮件冒充他人，试图诱骗员工泄露安全密钥或密码等信息。无论采用何种方法，渗透测试人员都试图发现客户系统中的任何弱点，以在入侵发生前加以防范。“如果有漏洞，迟早会被发现——如今往往是更早，”戈尔科维恩科在
    *Computerworld UK* 的一篇文章中说道。


    ## 实习生破解密码

