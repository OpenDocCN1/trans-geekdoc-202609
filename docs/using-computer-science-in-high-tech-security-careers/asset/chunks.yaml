    ## 简介


    20 世纪 90 年代，Jeff Williams 成为了一名应用安全工程师，他在大多数人还没听说过这一职业很久之前就担任了这个高科技安全职位。“通用电气找到我的公司说，‘我们喜欢你们的数据中心，但在代码上线前，我们需要对每一行代码进行安全审查，’”他在接受
    CSO Online 采访时说道。“销售团队很快就说‘没问题！’其他人都往后退了一步，而我得到了弄清楚如何交付这项工作的任务。”


    应用安全是指向软件和 Web 应用程序添加功能或特性，以减少漏洞并阻止威胁的做法。威胁包括网络攻击、网络入侵和数据窃取。为了保护应用程序，应用安全工程师使用防火墙、防病毒程序、加密程序和其他防止未经授权访问的功能。


    应用安全是公司整体高科技安全计划的一部分，该计划还包括系统、网络和移动安全。整个安全计划（包括应用安全）的目标是保护组织和软件用户免受黑客攻击和其他恶意入侵。在担任应用安全工程师的职位上，Williams
    学会了如何进行渗透测试和安全代码审查、创建应用安全架构、完成威胁建模等。


    ![](img/page_5-1.jpg)


    一名信息技术工程师正在调整公司服务器室中的线路连接。她是负责保护公司计算机系统的专业人员之一。


    如今，Williams 是 Contrast Security 的首席技术官兼联合创始人，该公司是一家位于加利福尼亚州帕洛阿尔托的应用安全供应商。他表示，要在这个高科技安全职业中取得成功，人们应具备扎实的计算机科学技能和多种编程风格及语言的经验。“但这还不够，”他在接受
    CSO Online 采访时说。“我寻找那些参与开源项目、编写自己的工具、每天都在编码的人——那些对代码充满激情和热情的人。所以，这更多关乎实际经验，而非书本知识。”


    技术正在改变日常生活的许多方面，从人们做生意的方式到沟通的方式。越来越多的组织依赖数字系统来生成、处理和存储有价值的信息。保护组织的数字系统和数据免受未经授权的访问和恶意黑客攻击的需求，催生了网络安全领域的新职业。


    网络安全是指保护联网系统（包括硬件、软件和数据）免受入侵和网络攻击。随着公司越来越需要保护其数字系统和资产，他们需要具备技术技能与编码知识相结合的安全专业人员。计算机取证、安全工程、安全架构和密码学只是受益于计算机科学和编码技能的网络安全领域的几个例子。对具备网络安全和技术技能的信息技术（IT）专业人员的需求，为对计算机科学和高科技安全感兴趣的人创造了新的机会。“每一次新的黑客攻击或数据泄露背后，都有一家公司在忙着灭火。这对拥有网络安全技能的求职者来说是个好消息。雇主招聘他们的速度永远不够快，”记者
    Jeff Kauflin 在为《福布斯》撰写的关于高科技安全职业的文章中写道。


    在高科技安全领域，有许多利用计算机科学的不同职业专长可供学生追求。公司雇佣计算机取证专家、安全工程师、密码学家、信息安全分析师、渗透测试员、安全架构师等。机会如此之多，将高科技安全与计算机科学相结合的职业可以适应许多不同的背景和兴趣。


    ## 第一章


    ### 保护数字资产和信息


    每天，组织都面临着其信息系统和数据受到威胁的局面。复杂的攻击者会搜寻组织系统中的任何弱点，并设法加以利用。一旦得逞，可能只是导致服务的简单中断，也可能引发严重担忧，即敏感数据被篡改并出售。随着越来越多的日常物品连接到互联网，从智能冰箱到健身追踪器，保护数字资产、系统和信息的高科技安全需求比以往任何时候都更加迫切。


    ### 什么是网络安全？


    当人们想保护家中的贵重物品时，会安装物理锁和安防系统以防窃贼进入。需要保护宝贵数字系统和信息的组织则求助于网络安全。网络安全是确保数字信息、网络和系统免遭盗窃、篡改和其他损害的实践。有些损害可能是意外的，例如硬盘故障或自然灾害袭击。然而，越来越多的损害是由恶意实体的蓄意攻击造成的。这包括只是想试试能否闯入系统的个人黑客，以及为牟取经济利益而窃取数据和信息的有组织犯罪集团。


    ![](img/page_9-1.jpg)


    我们正日益成为一个高度互联的社会。智能手机和健身追踪器等联网设备容易受到网络安全攻击。


    多年前，网络安全主要与政府机构和国防承包商相关联。如今，所有组织都需要重视网络安全。医疗保健、制造、金融、零售等行业的公司都雇佣网络安全专业人员来保护宝贵的资产和信息。


    ### 网络安全的类型


