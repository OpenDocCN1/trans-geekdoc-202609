  trans: '


    # 安全工程


    随着企业越来越理解高科技网络安全的重要性，对熟练安全架构师和其他网络安全专业人员的需求将持续上升。此外，网络安全与教育中心的一项研究预测，在未来五年内，职位空缺将多于合格的专业人员，人才缺口将达
    180 万个职位。对于对高科技网络安全感兴趣的人来说，安全架构师的职业生涯可能是完美的选择。


    ## 第六章：安全工程


    随着越来越多的组织将宝贵且敏感的信息存储在计算机系统和网络中，保护这些信息从未像现在这样重要。有缺陷的软件和脆弱的系统会使计算机网络易受恶意恶意软件、间谍软件等的攻击。安全工程师获取安全架构师创建的设计，并构建能够应对恶意网络攻击、意外自然灾害或其他灾难性事件的系统。


    ### 设计防护系统


    安全工程师是网络安全团队中宝贵的一员。他们为各种公司和组织工作，这些专业人员了解如何设计架构以保护组织。他们与其他安全专业人员合作，以在网络攻击期间将损害降至最低。他们测试和筛选安全软件。他们监控计算机网络和系统，并寻找任何未经授权的入侵或活动。安全工程师通常充当组织抵御潜在安全威胁的**第一道防线**。在这个角色中，他们在威胁出现时识别并遏制威胁，但他们也会在威胁发生*之前*规划和准备威胁响应。


    ![](img/page_54-1.jpg)


    *一名安全工程师坐在工作站前，监控组织的系统是否有任何未经授权的入侵或可疑活动的迹象。*


    安全工程师经常构建新系统以帮助保护网络。他们实施和管理安全硬件和软件。他们安装和配置安全软件，如防火墙和数据加密程序。他们安装和处理新的安全产品，如可在未经授权的系统入侵时通知团队的软件。他们开发自动化代码来跟踪和报告安全事件。当组织的硬件和软件发生任何变更时，安全工程师会参与其中，以确保这些变更不会使组织面临新的漏洞。


    安全工程师还是监控网络和系统以防入侵的安全团队的一部分。他们花费大量时间寻找任何系统或网络漏洞并测试安全解决方案。为此，他们可能会进行网络扫描或执行渗透测试。当发生入侵时，安全工程师通常领导组织的响应并调查入侵是如何发生的。利用这些信息，他们安装修复程序以加强安全性。


    Helen Oswell 是技术咨询公司 6point6 的一名安全工程师。在她的角色中，Oswell 构建安全系统，并确定改进和消除公司 IT 基础设施漏洞的方法。在
    Learning People 网站上发布的一次采访中，Oswell 解释道：“在正常的一天里，我致力于工具和设计，并撰写结构文档。我最喜欢这份工作的部分是设计工具并实施它们——例如在云环境中开发漏洞管理工具。”她认为，公司关注其网络防御比以往任何时候都更加重要。虽然在网络安全专业人员身上花钱可能成本高昂，但
    Oswell 指出：“真正的成本在于当你所有的数据被黑客攻击、业务无法运转时。”


    ![](img/page_56-1.jpg)


    *安全工程师共同协作，为组织的安全防火墙和数据加密程序安装更新。*


    ### 如何成为一名安全工程师


    大多数安全工程师至少拥有计算机或信息科学、计算机编程、软件工程或系统工程的学士学位。这些专业的学生通常会学习计算机编程、网络和系统设计课程。一些公司更倾向于安全工程师拥有硕士学位，例如信息系统理学硕士或相关领域的学位。想成为安全工程师的高中生可以选修数学、科学和计算机科学课程。


    ### 合适的认证


    获得认证可以证明一个人掌握了安全工程的重要技能。安全工程师最热门的认证包括 `Certified Ethical Hacker`（认证道德黑客）、`Cisco
    Certified Network Professional Security`（思科认证网络专业安全）和 `Certified Information Systems
    Security Professional`（认证信息系统安全专家）。这些认证项目的学生将学习黑客软件、网络安全、计算机取证、密码学、程序测试、应用数学和信息系统维护。虽然有许多认证可供选择，但获取每个认证的过程是相似的。学生必须具备一定的经验水平并通过考试。


    安全工程师必须具备扎实的技术和计算机技能。他们必须知道如何构建安全网络，包括云系统。他们应该有使用渗透和入侵检测软件、设置防火墙、配置路由器和软件的经验。虽然编码技能不是硬性要求，但当工程师审查代码以查找安全问题时，这些技能很有帮助。Parisa
    Tabriz 在 freeCodeCamp 的一篇博客文章中说道：


    > **我认识的最优秀的安全工程师也都在积极编写代码。这让他们获得了编写软件的第一手经验，包括无意中却不可避免地引入安全漏洞。后者迫使他们对所有开发人员产生真正的共情。毕竟，持续编写安全代码往往比指出不安全代码更难。**


    安全工程师应熟悉 `Windows` 和 `Linux` 等操作系统，以及使用 `MySQL`、`Oracle` 和 `SQL Server` 进行数据库安全管理。他们应该能够使用最新的加密技术和网络安全协议，如
    `TCP/IP` 和 `HTTPS`。他们还应随时了解最新的黑客技术。


    ![](img/page_58-1.jpg)


    *一名安全工程师在笔记本电脑上审查代码，搜索任何可能允许黑客入侵组织软件和系统的代码漏洞或弱点。*


    从事该领域工作的人员需要跟上最新技术和行业发展。为此，他们在整个职业生涯中参加继续教育课程并出席行业会议。


    ### 安全工程师的就业前景


    安全工程师的就业前景非常好。根据 BLS（美国劳工统计局）的数据，信息安全分析师（包括安全工程师）的就业人数预计将从 2016 年到 2026 年增长 28%。虽然对包括安全工程师在内的网络安全专业人员的需求激增，但合格候选人的供给却很低。招聘网站
    Indeed 2017 年的研究发现，尽管组织发布了网络安全职位，但没有足够的候选人来填补这些职位。因此，具有相关工作经验的合格候选人将在安全工程工作中拥有优先选择权。


    ## 第七章：数据加密


    2013 年，计算机软件公司 Adobe 宣布其计算机系统遭到黑客攻击。网络攻击者访问了数百万 Adobe 客户 ID、加密密码以及加密的信用卡或借记卡号码。该公司后来报告称，黑客还窃取了其流行的照片编辑软件
    Photoshop 的源代码。三千八百万客户受到了此次泄露事件的影响。


    '
