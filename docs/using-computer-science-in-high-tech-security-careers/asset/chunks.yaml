    # 对渗透测试职业感兴趣的学生可以通过在安全实习中工作获得宝贵的实践经验。


    2017 年，Tim Welles 在 Sword & Shield Enterprise Security（一家信息安全咨询公司）担任暑期实习生。Welles
    是田纳西大学的学生，主修计算机科学，专注于网络安全。他在一个项目中工作，旨在为办公室内`hashcat`的安装设置一个名为 wrapper 的编程功能，`hashcat`是一款密码破解工具。Welles
    在 Sword & Shield 网站的一篇文章中说道：


    > 分布式哈希破解项目的 hashcat wrapper 非常适合像我这样的实习生。它给了我一些事情做，我觉得这将为公司增加价值，远远超出我的实习期限，并完成他们需要完成的工作。同时，它让我学到了很多关于密码破解和
    Linux 的一般知识，以及一些通用的网络技能。该项目最好的部分是当我完成它时，团队实际上开始在他们的渗透测试服务中使用它。这让我感觉我在为公司产生影响，而不是在做一个不会被充分利用的副项目。


    Welles 计划毕业后从事网络安全职业。


    对于一位客户，van der Baan 发现了一个系统，他可以在其中操纵数据库并读取底层操作系统的文件。他发现的另一个错误让他得到了系统的代码。当他下载代码时，他发现了一个漏洞，允许他执行任意代码——如果被恶意黑客发现，这将是一个非常危险的弱点。“我们发现什么、在哪里发现、最终结果如何，完全取决于系统，”他在
    2016 年 4 月为《Computerworld UK》撰写的文章中说道。通过向客户展示这些漏洞，van der Baan 帮助客户了解需要在哪里加强其网络防御。


    ![](img/page_39-1.jpg)


    恶意黑客有时会冒充他人通过电话获取敏感个人信息，例如用户名和密码。


    # 如何成为一名渗透测试员


    对于那些好奇心强、擅长为网络安全想出独特且复杂的修复方案的人来说，渗透测试职业可能非常适合。大多数渗透测试员拥有数年的相关经验，以及至少计算机科学、信息安全或相关领域的学士学位。这些专业使学生具备编程、网络和网络安全技能。学生将学习计算机取证、灾难恢复、渗透测试等领域的课程。高中生可以通过选修计算机科学和编程课程为渗透测试职业做准备。


    大多数网络安全职业（包括渗透测试）都需要扎实的技术和计算机技能，以便这些专业人员能够入侵计算机系统。一些雇主要求候选人掌握特定的编程语言，如`C`、`C++`、`Java`、`PHP`和`Python`。由于客户运行不同的操作系统，渗透测试员应了解`Windows`、`UNIX`和`Linux`操作系统。他们还应具有基于
    Web 的应用程序、网络服务器和网络工具、安全工具以及安全框架的经验。Contrast Security 的首席技术官兼联合创始人 Jeff Williams
    在 2018 年 4 月为《Forbes》撰写的文章中表示：


    > **你绝对需要深入了解你正在测试的技术。你不必成为专家级程序员，但你应该懂得足够多的知识，以便使用你想要测试的技术构建简单的应用程序，并理解更复杂应用程序的代码。我建议专注于广泛用于构建人们真正关心的应用程序的技术，如
    Java、.NET 和主要的应用程序框架。**


    ![](img/page_41-1.jpg)


    青少年参加计算机研讨会，学习如何编写代码和练习编程技能，这对渗透测试职业很有用。


    候选人还应彻底了解安全防御和漏洞。“理解安全防御（如加密、认证、授权、跨站请求伪造（CSRF）令牌、会话 ID、HTTP 头、编码/转义和日志记录）至关重要，”Williams
    在《Forbes》文章中说道。他还建议候选人获得查找和利用系统漏洞的实践经验。一些雇主还要求渗透测试员获得道德黑客或其他技术安全认证。


    渗透测试员必须了解黑客使用的最新方法和技术，以及新的安全技术。为此，他们可以参加会议，与其他专业人士会面，讨论新的攻击和安全策略。


    # 渗透测试员的就业前景


    渗透测试员的就业前景非常好。根据 BLS 的《职业展望手册》，信息安全分析师（包括渗透测试员）的就业预计将从 2016 年到 2026 年增长 28%。这一增长率远高于所有职业的平均增长率。


    随着网络攻击威胁变得更加频繁和复杂，组织将需要确保其网络防御能胜任应对。“我们需要停止在损害发生后再处理网络攻击。我们需要有远见，首先防止它们发生，”美国众议员
    C. A. Dutch Ruppersberger 在 2014 年 12 月为《U.S. News & World Report》撰写的文章中说道。因此，随着公司聘请渗透测试员在安全漏洞发生前发现并修复安全弱点，对渗透测试员的需求将会增长。Williams
    在《Forbes》的文章中说道：


    > **对熟练渗透测试员的需求将持续上升。如果你是那种通过了解各种不同系统和业务而茁壮成长的人，并且会厌倦多年只钻研单一应用程序，那么渗透测试可能适合你。**


    # 第五章


    ## 开发安全架构


    所有组织都需要保护其技术和计算机网络。为此，他们必须制定一个全面的战略，包括安全系统、政策和程序，这些要素能在组织的不同用户、系统、网络和其他技术之间无缝协同工作。安全架构师承担这一挑战，为组织设计、构建和维护高科技计算机系统安全。


    ## 构建安全的网络系统


    安全架构师负责组织内所有网络安全运营的整体战略。着眼于大局，他们设计组织的安全结构，以阻止恶意软件和黑客试图访问组织计算机网络和系统的行为。为此，安全架构师必须彻底了解公司的技术和信息系统。他或她应像黑客一样思考，以理解和预判黑客可能用来访问计算机系统的战术。了解组织使用的系统和技术有助于安全架构师确定谁拥有访问权限，以及可能存在哪些安全漏洞。


    ![](img/page_45-1.jpg)


    为了设计组织的安全系统和整体安全计划，安全架构师必须了解组织使用的所有硬件和软件。


