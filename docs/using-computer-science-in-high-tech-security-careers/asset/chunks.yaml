- raw: 'Most information security analysts have at least a bachelor’s degree from
    a four-year college or university in computer science, computer programming, or
    a related field. Some schools have specific programs for information security
    professionals. Some employers require candidates to have a master’s in business
    administration in information systems.


    Many employers prefer candidates who have related work experience, such as working
    as a network or systems administrator in an IT department. Organizations looking
    to hire a database security analyst may prefer a candidate who previously worked
    as a database administrator, while those looking to hire a systems security analyst
    may prefer a candidate who worked as a computer systems analyst.


    ![](Images/page_31-1.jpg)


    Information security analysts collaborate in a control center and listen to a
    supervisor give an update on the latest attempts to breach company networks.


    Although there are no required certifications or licenses for information security
    analysts, some voluntary training and certifications can improve a person’s chances
    of landing a job or getting promoted. Some certifications are general, while others
    specify areas such as penetration testing or systems auditing. “While I don’t
    feel you should spend all your time accumulating more letters behind your name,
    having a bachelor’s degree and an entry-level certification can really separate
    you when looking for that first job,” said Hoy in an article posted on the *U.S.
    News & World Report* website.


    In addition to technical skills, successful information security analysts should
    have strong analytical, critical-thinking, and problem-solving skills. They must
    be able to identify and analyze security risks and issues, identify and evaluate
    possible solutions, and figure out the best way to protect an organization’s systems
    and networks. They must also be very detail oriented so they can study systems
    like a detective, looking for the tiniest sign of a cyberattack or data breach.
    These breaches may be indicated by changes in network traffic, user account activity,
    geographical log-in patterns, or numbers of requests for the same file. Such analysts
    must be extremely ethical, since some parts of the job may involve hacking into
    systems to highlight areas of weakness that need to be secured.


    GETTING EXPERIENCE: A CYBERSECURITY INTERNSHIP


    Working in an internship can help students gain valuable hands-on experience and
    build essential skills for information security careers. As an intern, Tiffany
    Smith worked for Foreground Security, a cybersecurity firm. Each intern was given
    an assignment: Smith’s project was installing a monitoring tool called Opsview
    onto a Red Hat server. Smith spent long hours figuring out how to install the
    monitoring tool. “This was extremely challenging to me, but I figured it out by
    keeping track of the steps I took in every phase of installation,” said Smith
    in a blog post on Keirsten Brager.tech. “This experience prepared me for the challenges
    I had waiting for me in my first full time cyber security role. My project was
    selected and placed into production of the company at the end of my internship
    and I was extremely ecstatic!”


    THE JOB OUTLOOK FOR INFORMATION SECURITY ANALYSTS


    The job outlook for information security analysts is very good. According to the
    BLS’s *Occupational Outlook Handbook,* employment of information security analysts
    is projected to grow 28 percent from 2016 to 2026. “Jobs in this field are everywhere,”
    said Hoy in an article posted on the U.S. News & World Report website. “We presently
    have a shortage of cybersecurity professionals.”


    As more information is held digitally and the number of cyberattacks and data
    breaches grow, so, too, will the need for information security analysts. Facing
    increasingly sophisticated cyber threats, corporations in every industry will
    need to increase their protections to keep company information secure, which will
    increase the demand for information security analysts. In particular, the health
    care industry will have strong demand for information security analysts as more
    health care companies use digital medical records, and the need to protect them
    will also grow. According to job website CareerCast, “The proliferation of sensitive
    content stored online, as well as the growing importance of cloud computing is
    fueling the demand for more information security analysts.”


    CHAPTER FOUR


    ETHICAL HACKERS


    Businesses are increasingly under attack from hackers and cyber criminals, and
    the problem is only getting worse. Companies are spending millions of dollars
    on the latest high-tech security innovations to protect their networks. They are
    also hiring penetration testers to test how secure the networks really are.


    One of the many careers in computer science, penetration testing is the practice
    of testing a computer system, web application, or network to find security weaknesses.
    Penetration testers, also known as ethical hackers, are responsible for making
    sure that a client’s computer network and systems are protected from outside intruders.
    To do this, penetration testers use real-world criminal hacking techniques to
    try to find weaknesses in a client’s systems and procedures. They run tests on
    a company’s networks, software, and applications. They try to access data that
    they should not be able to reach.


    ![](Images/page_36-1.jpg)


    Although a company’s server room appears to be empty, its network frequently faces
    attacks from hackers attempting to access it without authorization.


    Penetration testers must be very creative and constantly think of new ways to
    “attack” a system. As they work, they keep careful records of the steps they take
    and any vulnerabilities they discover. While each client is different, the overall
    goal is the same: to simulate the attacks that real-world criminal hackers launch
    daily and report the success or failure of these simulations to the client.


    When they find a problem or vulnerability, penetration testers alert their client.
    They work with other IT professionals to figure out the best way to fix the weaknesses
    and strengthen digital security before an outside hacker has the opportunity to
    breach the system, cause damage, and steal information. To do this, they may rewrite
    program code or add additional security technologies or procedures. When they
    perform testing, they document the results and findings in reports for company
    management.


    WORKING IN PENETRATION TESTING


    Aleksander Gorkowienko and Steven van der Baan are penetration consultants at
    7Safe, a cybersecurity consulting company. They spend most of their time attempting
    to break into companies’ computer systems. Each client uses different technologies
    and presents a unique challenge. Sometimes Gorkowienko and van der Baan perform
    an SQL (Structured Query Language) injection, which places a query into a database
    that allows the hacker to manipulate it without authorization. Other times, they
    perform phishing attacks, which is when a hacker impersonates someone over the
    phone or via email and tries to get an employee to reveal information like security
    keys or passwords. Regardless of the method, the penetration testers try to find
    any weaknesses in their clients’ systems to prevent a breach before it happens.
    “If there’s a hole it will be found sooner or later—these days, sooner,” said
    Gorkowienko in an article for *Computerworld UK.*


