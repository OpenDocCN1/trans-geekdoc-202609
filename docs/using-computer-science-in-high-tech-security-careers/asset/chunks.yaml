  fmt: "\n随着电子商务的持续增长和更多企业转向线上运营，对密码学专业人才的需求将持续强劲。“数据加密与安全是当今一个庞大且不断增长的领域，”Rainer\
    \ Steinwandt 在 Bank Info Security 网站的一篇文章中表示，他是 *Journal of Mathematical Cryptology*\
    \ 的副主编兼联合编辑。“每天都有新公司涌现，它们需要对数据进行加密；这通过密码学家利用数学开发的软件和‘密钥’来实现。”拥有相关经验以及数学或计算机科学硕士或博士学位的密码学专业人士，极有可能在密码学领域获得理想的工作。\n\
    \n![](Images/page_67-1.jpg)\n\n密码学专业人员将数据加密作为整体网络安全计划的一部分，以保护公司和客户数据免遭未经授权的访问和使用。\n\
    \n## 术语表\n\n**algorithm**  \n计算中需遵循的过程或规则集合，通常由计算机执行。\n\n**application**  \n在计算机上运行的软件程序。\n\
    \n**architecture**  \n决定计算机系统如何运行和组织的一套规则和方法。\n\n**certification**  \n证明成就水平的官方文件。\n\
    \n**cryptography**  \n破解或编写代码的实践。\n\n**cyberattack**  \n黑客试图破坏计算机网络或系统的行为。\n\n\
    **cybersecurity**  \n保护互联网连接的计算机系统（包括硬件、软件和数据）的过程。\n\n**database**  \n计算机中存储的一组数据。\n\
    \n**data breach**  \n私人信息有意或无意地泄露给未经授权的用户。\n\n**e-commerce**  \n通过互联网进行的商业交易。\n\
    \n**encrypt**  \n将数据转换为代码以防止未经授权的访问。\n\n**firewall**  \n计算机系统或网络中旨在阻止未经授权访问的部分。\n\
    \n**forensics**  \n用于调查犯罪的科学测试和技术。\n\n**hacker**  \n利用计算机获取数据或系统未经授权访问权限的人。\n\n\
    **identity theft**  \n故意使用他人身份，通常为谋取经济利益。\n\n**internship**  \n学生或实习生在组织中工作（有时无薪）以获取工作经验的项目。\n\
    \n**malicious**  \n意图造成伤害的，或具有伤害意图的。\n\n**malware**  \n旨在破坏或瘫痪计算机系统或网络的软件。\n\n\
    **network**  \n一组相互连接的计算机。\n\n**source code**  \n用于指导软件程序运行的计算机语言。\n\n**threat\
    \ modeling**  \n通过像黑客一样思考来识别安全风险的过程。\n\n**vulnerability**  \n易受攻击或伤害的特性。\n\n##\
