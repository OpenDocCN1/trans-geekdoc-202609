- raw: 'While the breach and loss of data was very bad for Adobe, there was a tiny
    piece of good news. Some of the data stolen from the company was encrypted, including
    the customer passwords and debit and credit card numbers. Encrypting data is a
    method of concealing it with a code or cipher. That way, if unauthorized individuals
    access it, they cannot use or understand it. Because Adobe encrypted some of its
    data, only a portion of the stolen information had any value for the hackers.
    Encryption was one of the tools the company used to secure data stored in its
    systems. Rick Robinson, an industry expert in encryption and cryptography, said:


    ![](Images/page_61-1.jpg)


    Data encryption software is one tool that can be used to protect an organization’s
    data and prevent unauthorized users from accessing and reading it.


    **Today’s enemies are data thieves working to steal your data for profit. If they
    cannot steal your data and profit from it, they will look elsewhere. Encrypted
    data represents an insurmountable challenge from which they cannot profit. Such
    use of encryption to protect your data and keep it from being used by perpetrators
    is a prime example of using cryptography for business.**


    MAKING AND BREAKING CODES


    When organizations need to encrypt and protect important data, they turn to cryptographers.
    Cryptography is a method of protecting information and communications by using
    codes. Only those who are authorized to receive the information can read and process
    it. In today’s digital world, cryptography typically scrambles ordinary text (also
    called plaintext) and turns it into ciphertext through the encryption process.
    Then cryptography turns ciphertext back into plaintext using a process called
    decryption. Businesses, military organizations, and government agencies use encryption
    and cryptography to protect data and networks from hackers and cyberterrorists.
    Professionals called cryptographers develop the algorithms, ciphers, and security
    systems used to encrypt valuable data. These algorithms are used to protect data,
    web browsing on the internet, and confidential communications such as email and
    credit card transactions.


    ![](Images/page_62-1.jpg)


    This illustration shows how a cryptographic algorithm can be used to encrypt and
    decipher data so that it can only be accessed by authorized users.


    While every job in cryptography is different, cryptographers typically protect
    information from being intercepted, copied, modified, or deleted. They use mathematically
    based encryption methods. They write new algorithms to encrypt information like
    bank accounts and credit card information. Cryptographers analyze weaknesses in
    cryptographic security systems and algorithms and develop statistical and mathematical
    models to analyze data. Cryptographers also research and test new cryptography
    methods and applications. They search for vulnerabilities in an organization’s
    communication systems—such as its wireless network, cell phones, and email—and
    ensure that communications are not illegally accessed or altered. In addition
    to encrypting sensitive data, cryptographers who work for military, government,
    and law enforcement agencies may also analyze and decode any hidden information
    in cryptic messages and coding systems.


    Christof Paar has worked in applied cryptography since 1995 and is an affiliated
    professor at the University of Massachusetts—Amherst. According to Paar, cryptography
    is central to cybersecurity. “The cryptographic algorithm is the driving force,
    the heart, of almost every security solution,” he said in an interview for IEEE
    Cyber Security. Paar has been working on applying cryptography to connected cars
    and vehicle-to-everything (V2X) communications, when a vehicle interacts with
    other vehicles (V2V) or with roadside infrastructure (V2I). V2V communication
    helps prevent collisions, while V2I communications can help reduce gridlock and
    pollution. Making sure these communications are secure and not altered in any
    way by hackers is essential. Paar said:


    **Cryptography supports the authentication that allows these applications to trust
    one another, which obviously is key because they involve human lives in tons of
    metal moving at high speeds. Crypto algorithms are also a great way to encrypt
    V2X communications. An example is ensuring that a vehicle’s real-time location
    information has not been manipulated. Without cryptography, it’s possible that
    a hacker could send fake message\[s\] that could cause, for instance, accidents
    by triggering automatic braking at high speeds.**


    TYPES OF CRYPTOGRAPHIC ALGORITHMS


    There are three main categories of cryptographic algorithms:


    • Secret key or symmetric encryption uses a single key for both encryption and
    decryption. It is primarily used to keep data private and confidential.


    • Public key or asymmetric encryption uses one key for encryption and a different
    key for decryption. It is typically used for authentication.


    • A hash function is an algorithm that can be run on data such as a file or password
    and produces a value called a checksum. The hash function can be used to verify
    the authenticity of a file or piece of data. If the checksums generated by two
    files are identical, one can assume the files are identical as well.


    HOW TO BECOME A CRYPTOGRAPHER


    For people who enjoy solving puzzles, advanced mathematics, and computer science,
    a career in cryptography may be appealing. Most cryptographer positions require
    candidates to have a bachelor’s degree in mathematics, computer science, computer
    engineering, or a related field. Many also require a master’s degree or doctorate
    in mathematics or computer science with a focus on cryptography. In addition,
    because they are working with highly sensitive data, some jobs require cryptographers
    to have high-level security clearances. High school students interested in cryptography
    can take classes in mathematics, statistics, computer science, and programming
    to prepare for this career.


    Cryptographers need to have strong technical, mathematics, and computer skills.
    They should be familiar with computer architecture, data structures, and algorithms.
    They must understand linear/matrix algebra and discrete mathematics. Cryptography
    professionals should also be familiar with information theory, computer security,
    and engineering.


    On the job, it is helpful to know several programming languages, such as C, C++,
    Python, and Java. Also essential are technical skills using the principles of
    symmetric and asymmetric cryptography, such as symmetric encryption, hash functions,
    key exchange, digital signatures, and more. “Today, cryptology professionals need
    to be gifted in both mathematical concepts and statistical analysis, coupled with
    a strong background in technology, to be able to make a career in this field,”
    said computer security expert Gary C. Kessler in an article for the Bank Info
    Security website.


    In addition to technical skills, cryptographers must be highly analytical and
    creative. To break complex codes, they must be able to think analytically and
    have a good understanding of mathematical theories so they can decipher coded
    information or create encryption systems that protect data. Even more importantly,
    cryptographers must have high ethical standards and good judgment because they
    are trusted with handling an organization’s most sensitive data.


    THE JOB OUTLOOK FOR CRYPTOGRAPHERS


    The job outlook for cryptography careers is expected to be very good. According
    to the BLS, employment of mathematicians and statisticians, which includes cryptography
    professionals, is projected to grow 33 percent from 2016 to 2026. The growth of
    e-commerce and the need for cryptographers to protect customer data online is
    one factor driving the demand for cryptographers.'
