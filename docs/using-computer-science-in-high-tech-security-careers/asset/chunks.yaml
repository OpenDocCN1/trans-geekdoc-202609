- raw: 'After making a comprehensive assessment of an organization’s systems, the
    security architect plans, designs, and implements a security system using hardware
    and software. He or she researches security systems and protocols and develops
    requirements for networks, routers, firewalls, and other technologies. Often,
    the security architect delegates tasks to a team that will develop the code and
    other elements of the planned security system.


    Once these systems and procedures are in place, architects test and audit the
    entire system for weaknesses. Sometimes, security architects work with penetration
    testers to run a complete test on a system’s security to make sure its defenses
    will protect against outside attacks. If any issues are identified, security architects
    design and implement security fixes to resolve them. When a hacker tries to access
    the organization’s systems, security architects set up countermeasures to protect
    the system and limit the hacker’s ability to damage the system or steal valuable
    information.


    In addition to designing and implementing security systems, security architects
    develop an organization’s policies and procedures related to system security.
    They prepare training for employees to educate them about best practices to keep
    company systems safe.


    Security architects must stay up to date on the latest technologies and security
    strategies so they can evaluate and improve an organization’s security systems
    and keep it secure from threats. Because hackers are always coming up with new
    ways to infiltrate systems, security architects must also be aware of the latest
    hacking tactics so they can design solutions to block them.


    ![](Images/page_47-1.jpg)


    A hacker sits in a dark room and uses the internet to break into a company’s network
    and steal customer credit card information.


    WORKING AS A SECURITY ARCHITECT


    As the security leader for a global organization, Michael Haag was responsible
    for cybersecurity strategy and architecture across many business units. As his
    company acquired new businesses, Haag and his colleagues worked to assess and
    design security programs and procedures for each. Haag said in an article posted
    on the Red Canary website:


    **Our main goal here was understanding the risks we were accepting from the incoming
    organization.** **We needed to understand how much exposure this organization
    had on the perimeter—open ports, vulnerable applications, Citrix gateways, and
    so on. It’s important to identify these items as they are points of entry for
    threat actors … Beyond this, we would also discuss patching strategies for operating
    systems and third-party software.**


    According to Haag, no system is impenetrable. While security architects design
    systems and procedures to prevent hackers from gaining unauthorized access to
    an organization’s networks and information, most organizations will experience
    a breach at some point. Security architects must be able to detect breaches and
    learn from them so they can be better prepared for the next hacker. “Prevention
    only goes so far,” said Haag in the Red Canary article. “It can lead to a false
    sense of security … something will be missed. I am a big believer in ‘prevention
    is ideal; detection is a must.’”


    HOW TO BECOME A SECURITY ARCHITECT


    Becoming a security architect involves a combination of education and experience.
    Most people pursuing a career as a security architect must have at least a bachelor’s
    degree in computer science, IT, cybersecurity, or a related field from a four-year
    university or college. Many security architects also have a master’s degree in
    cybersecurity or computer science with a security focus. High school students
    can prepare for a career in security architecture by taking computer science and
    programming courses.


    Careers in security architecture require strong technical and computer skills.
    Security architects must be skilled in multiple operating systems—Windows, UNIX,
    and Linux. They are knowledgeable about network security and architecture, wired
    and wireless security, and enterprise and security architecture. They should also
    understand cryptography, distributed systems, and software design. They should
    be able to identify and model threats and risks to a system and be able to test
    for vulnerabilities.


    Security architect Dawid Balut recommends that security architects learn to code.
    “Learn how software stacks work and get a handle on web programming languages
    like Java, PHP and their respective frameworks. To break something and improve
    its resiliency afterward, you should understand how it all works,” he said in
    an article posted on the *Forbes* website.


    A security architect is often a senior-level position in many companies. Therefore,
    most employers want to hire security architects who have three to ten years of
    relevant, on-the-job experience in IT and cybersecurity. Often, candidates work
    first in entry-level positions in network administration, security administration,
    and system administration to develop basic skills and knowledge. Then they progress
    to intermediate-level positions as security analysts, security engineers, or security
    consultants, in which they further develop computer security skills and gain hands-on
    experience they will need as a security architect. “I started my adventure in
    IT from the very bottom, working as a computer technician, network admin, web
    programmer, and system administrator,” explained Balut in an article posted on
    the *Forbes* website. “My range of experience allows me to understand the problems
    many employees face, enabling me to make better decisions for the companies and
    teams I work with. I believe the security industry could benefit greatly from
    more diversity.”


    ![](Images/page_50-1.jpg)


    Joe Steward, director of malware research at Dell SecureWorks, speaks with a security
    researcher in front of large monitors as they work to track internet hackers and
    criminals.


    In addition, adding industry certifications to education and work experience can
    make a professional more appealing to employers. The Certified Information Systems
    Security Professional (CISSP) certification is one of the most respected cybersecurity
    certifications and covers access control, cryptography, operations security, and
    more. The Information Systems Security Architecture Professional certification
    is another well-respected certification that focuses on security architecture.
    It combines the core skills of the CISSP with security architect skills such as
    management and big-picture analytical processes. Other common certifications include
    CompTIA Security+ and Certified Ethical Hacker.


    MODELING THREATS


    A company’s first step in cybersecurity is determining what it needs to protect
    and who it is trying to protect it from. To get started, cybersecurity professionals
    create a threat model. Preparing a threat model enables the cybersecurity team
    to think about what data and systems they are worried about getting hacked. These
    need to be protected. A threat model also identifies who the company is worried
    about doing the hacking. For example, a teen may want to protect an email account
    so her meddling brother cannot snoop and read her emails. To do so, she can decide
    to put a password on the email account that she does not share with her brother.
    But if she is worried about others reading her emails, she might need to take
    other precautions. In this way, a threat model depends on the threat and the data
    being protected.


    THE JOB OUTLOOK FOR SECURITY ARCHITECTS


    The job outlook for security architects is very good. According to the BLS, employment
    of information security analysts, which includes security architects, is projected
    to grow 28 percent from 2016 to 2026.'
