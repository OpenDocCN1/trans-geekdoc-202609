    # Cybersecurity


    Cybersecurity includes several types of high-tech security.


    ## Application Security


    Application security involves detecting vulnerabilities and developing tools and
    procedures to protect hackers from using weaknesses in an application to gain
    unauthorized access to company systems.


    ## Information Security


    Information security protects information and data from unauthorized access, breaches,
    manipulation, theft, and more.


    ## Network Security


    Network security involves monitoring an organization’s internal networks to identify
    any weaknesses and prevent unauthorized access. Network security uses both hardware
    and software technologies, such as firewalls and antivirus and antispyware software,
    to keep internal networks secure and reliable.


    ## Disaster Planning


    Cybersecurity also involves planning for a disaster, whether natural or technical.
    This planning involves assessing and analyzing risks, prioritizing assets, and
    creating a disaster response plan. With a disaster plan in place, organizations
    can recover more quickly from a disaster and minimize any losses.


    ## Website Security


    A website is another place where organizations can be vulnerable to attack. In
    recent years, there has been a rise in the number of data breaches on websites.
    These breaches result in identity theft and financial losses for customers and
    companies. When a breach is made public, companies also suffer damage to their
    brand image and reputation. Website security focuses on protecting websites from
    online threats. It uses techniques and tools such as website scanning and malware
    removal, application security testing, website application firewalls, and more.


    ![](Images/page_11-1.jpg)


    *Cybersecurity professionals work in a company server room and monitor a software
    program that detects any unauthorized access to the company’s network.*


    ## Endpoint Security


    Mobile technology and the internet allow people to work from anywhere in the world.
    This flexibility also brings some risk since remote workstations and mobile devices
    are vulnerable to cyberattacks. When mobile devices connect to an organization’s
    network and are interconnected, they create new entry points for hackers to gain
    access to a company’s systems. Endpoint security protects and secures an organization’s
    network by blocking attempts to access it from remote entry points.


    # Common Cyber Threats


    No organization—regardless of its size, industry, or location—is immune to cyberattacks.
    Understanding some of the most common threats can help cybersecurity professionals
    better design an organization’s cyber defenses. Five of the most common threats
    faced by organizations include:


    *   **Socially engineered malware**: This type of attack tricks users into downloading
    harmful software onto a computer; the software can then spread to and disrupt
    a connected system or network.

    *   **Phishing attacks**: Password phishing attacks trick users into revealing
    their passwords and log-in information, which is then used to access an organization’s
    network without permission.

    *   **Unpatched software**: Unpatched software contains vulnerabilities that allow
    hackers a point of access into an organization’s network.

    *   **Social media threats**: Hackers can use social media accounts to gather
    information about a company and its employees, eventually piecing together enough
    information to successfully hack into the company’s network.

    *   **Advanced persistent threats**: These frequently use phishing attacks or
    a Trojan attachment that delivers malware when opened to gain access to an organization’s
    network and steal intellectual property.


    # High-Tech Security and Computer Science


    As more information and systems are connected online, there is a growing need
    for people who are interested in working in high-tech security and also have an
    interest in computer science and coding. According to ISACA, a nonprofit information
    security advocacy group, there is a global shortage of approximately two million
    cybersecurity professionals. In the United States, employers are struggling to
    fill cybersecurity jobs, with thousands remaining open because companies cannot
    find qualified professionals to fill them. There are needs for people to design
