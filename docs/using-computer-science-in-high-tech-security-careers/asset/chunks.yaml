- raw: 'As e-commerce continues to grow and more businesses move online, the demand
    for cryptography professionals will continue to be strong. “Data encryption and
    security is a huge and growing field today,” said Rainer Steinwandt, associate
    director and coeditor of the *Journal of Mathematical Cryptology,* in an article
    for the Bank Info Security website. “New companies pop up daily that need to have
    data encrypted; they do that with software and ‘keys’ developed by cryptologists
    using mathematics.” Cryptography professionals with related experience and a master’s
    or doctoral degree in mathematics or computer science will likely have the best
    chance of landing a good job in the cryptography field.


    ![](Images/page_67-1.jpg)


    Cryptography professionals use data encryption as one part of an overall cybersecurity
    plan to protect company and customer data from unauthorized access and use.


    GLOSSARY


    algorithm A process or set of rules to be followed in calculations, often by a
    computer.


    application A software program that runs on a computer.


    architecture A set of rules and methods that determines how a computer system
    functions and is organized.


    certification An official document that shows a level of achievement.


    cryptography The practice of solving or writing codes.


    cyberattack An attempt by hackers to damage a computer network or system.


    cybersecurity The process of protecting internet-connected computer systems, including
    hardware, software, and data.


    database A set of data held in a computer.


    data breach The intentional or unintentional release of private information to
    unauthorized users.


    e-commerce Commercial transactions that take place over the internet.


    encrypt To convert data into a code to prevent unauthorized access.


    firewall Part of a computer system or network that is designed to block unauthorized
    access.


    forensics Scientific tests and techniques used to investigate a crime.


    hacker A person who uses computers to gain unauthorized access to data or systems.


    identity theft The deliberate use of someone’s identity, often for financial gain.


    internship A program in which a student or trainee works in an organization, sometimes
    without pay, in order to gain work experience.


    malicious Of or having an intent to do harm.


    malware Software that is meant to damage or disable a computer system or network.


    network A set of connected computers.


    source code Computer language designed to direct a software program.


    threat modeling The process identifying security risks by thinking like a hacker.


    vulnerability The ability to be attacked or harmed.


