    \ + \"Z\",\n    \"endTime\": end_time.isoformat() + \"Z\"\n}\n# Send the request\
    \ to the service usage API\nresponse = usage_client.services().get(serviceName=\"\
    compute.googleapis.com\").quota(body=request_body).execute()\n# Access and process\
    \ cost data (modify as needed)\nif \"quotas\" in response:\n    quotas = response[\"\
    quotas\"]\n    for quota in quotas:\n```\n\n```python\nif \"usage\" in quota:\n\
    \    usage = quota[\"usage\"]\n    print(f\"Estimated cost for {machine_type.name}\
    \ (past day): ${usage}\")\nelse:\n    print(\"No cost data available for the specified\
    \ machine type.\")\n```\n\n此示例演示了如何利用 Google Cloud Platform Python 客户端库和 Service\
    \ Usage API 来估算与不同机器类型相关的成本。它检索特定机器类型的详细信息，定义使用期限，并向 API 发送请求以检索估算成本。请将代码中的项目\
    \ ID 和所需机器类型更新为准确估算。\n\n通过利用这些代码示例和提供的指导，你可以有效地探索不同的云计算资源，并选择最适合特定机器学习工作负载需求的实例类型，在项目中平衡性能和成本效益。\n\
