    \ YAML file defining an HPA in Kubernetes:\n\n```yaml\napiVersion: autoscaling/v2beta2\n\
    kind: HorizontalPodAutoscaler\nmetadata:\n  name: my-model-hpa\nspec:\n  scaleTargetRef:\n\
    \    apiVersion: apps/v1\n    kind: Deployment\n    name: my-model-deployment\n\
    \  minReplicas: 1\n  maxReplicas: 5\n  metrics:\n  - type: Resource\n    resource:\n\
