    \        - **合规认证：** 如果你的数据受特定法规约束（例如 HIPAA、GDPR），请选择提供相关合规认证的提供商。\n\n### 1. 了解你的工作负载：\n\
    \n- **训练与推理：** 区分 **训练**（构建模型）和 **推理**（使用模型进行预测）。训练通常需要更强大的实例，具有高 CPU、内存以及可能的\
