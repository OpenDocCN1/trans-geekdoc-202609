    \        \"hardwareProfile\":{\n          \"vmSize\":\"[parameters('newVmSize')]\"\
    \ # 替换为新大小（例如，'Standard_B2s'）\n        },\n        // ... 其他 VM 配置属性\n      }\n\
    \    }\n  ],\n  \"parameters\":{\n    \"vmName\":{\n      \"type\":\"string\"\
    ,\n      \"defaultValue\":\"myVM\"\n    },\n    \"newVmSize\":{\n      \"type\"\
