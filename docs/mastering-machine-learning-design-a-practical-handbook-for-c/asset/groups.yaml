    \ 非常适合需要大量内存的工作负载，例如内存数据库或处理非常大的数据集。这些实例具有高内存容量，可处理内存密集型操作。\n- **GPU 优化型：** 配备强大的图形处理单元（GPU），专门用于加速深度学习工作负载。GPU\
    \ 可以显著提高复杂神经网络的训练时间。\n\n```python\nprint(f\"Machine type: {machine_type.name}\"\
