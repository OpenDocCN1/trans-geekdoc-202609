    此命令使用 aws CLI 工具和 jq 来解析 JSON 输出。它列出你 AWS 区域中的可用实例类型。\n\n### 2. 估算不同实例类型的成本（GCP\
    \ Python 客户端库）：\n\n```python\n# Import necessary libraries\nfrom googleapiclient\
