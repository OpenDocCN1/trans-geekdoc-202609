    \n虽然功能强大的基于 GPU 的实例可能看起来很有吸引力，但它们通常价格昂贵。对于许多机器学习项目，特别是初始阶段，经济高效的基于 CPU 的实例可能就足够了。尝试不同的选项，找到性能与成本之间的最佳平衡点。\n\
    \n以下是更多代码示例，用于说明选择合适的云计算实例类型的概念：\n\n### 1. 列出可用的实例类型（AWS CLI）：\n\n```bash\naws\
