    \n### 1.4. 识别潜在问题：\n\n查找数据中潜在的问题，如缺失值、异常值或不一致。缺失值可以使用 isnull 或 notnull 方法识别：\n\
    \n```python\nprint(data[\"feature_with_missing_values\"].isnull().sum()) # Count\
