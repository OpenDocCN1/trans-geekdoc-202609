    - **AWS CLI 命令：** 此示例展示了如何使用 AWS CLI 命令升级 EC2 实例类型：\n\n```bash\naws ec2 modify-instance-type\
    \ --instance-id i-0123456789abcdef0 --new-instance-type t2.medium\n```\n\n###\
