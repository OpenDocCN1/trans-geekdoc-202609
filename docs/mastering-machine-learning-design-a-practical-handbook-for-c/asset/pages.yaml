  md: 'Feature scaling ensures all features contribute equally to the model''s learning
    process. This is crucial when features have different scales or units. Common
    techniques include:


    +   - **Standardization:** Scales features to have a mean of 0 and a standard
    deviation of 1 (z-score).

    +   - **Normalization:** Scales features to a specific range (e.g., 0-1 or -1
    to 1).


    ```

    ```python

    from sklearn.preprocessing import StandardScaler, MinMaxScaler

    # Sample data

    data = [[100, 1], [50, 2], [20, 3]]

    df = pd.DataFrame(data, columns=["feature1", "feature2"])

    # Standardization (using StandardScaler)

    scaler = StandardScaler()

    df_scaled = scaler.fit_transform(df)

    # Normalization (using MinMaxScaler)

    scaler = MinMaxScaler(feature_range=(0, 1))

    df_normalized = scaler.fit_transform(df)

    print(df_scaled)

    print(df_normalized)

    ```

    ```


