    ![image](d2d_images/chapter_title_below.png)


    `A` in the case of vectors, MATLAB allows the selection of matrix elements using
    the following commands:


    | `A(m,n)` | Defines `(m,n)` of matrix `A` (row `m` and column `n`) | `A=[3 5
