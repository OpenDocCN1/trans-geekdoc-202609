  trans: "\n\n### 图形命令\n\n- `plottyy(X1,Y1,X2,Y2)`\n- `plottyy(X1,Y1,X2,Y2, 'function')`\n\
    - `plottyy(X1,Y1,X2,Y2, 'function1','function2')`\n  在左侧绘制 `X1` 对 `Y1` 的图，在右侧绘制\
    \ `X2` 对 `Y2` 的图。与之前的命令相同，但函数可以是 `plot`、`loglog`、`semilogx`、`semilogy`、`item`\
    \ 或任何 `h=function(x,y)`。与之前的命令相同，但每对 `(XiYi)` 使用每个函数 `fi`。\n\n- `axis([xmin xmax\
    \ ymin ymax zmin zmax])`\n  在指定值处设置轴的变化范围。它还接受 `'ij'`、`'square'`、`'equal'` 等选项，与之前看到的二维选项相同。\n\
    \n- `view([x,y,z])`\n  将图形的视角放置在笛卡尔坐标点 `(x,y,z)`处。\n\n- `view([az, el])`\n  将图形的视角放置在方位角（水平旋转）\
    \ `'az'` 和仰角（垂直仰角） `'el'`处。\n\n- `hidden`\n  控制图表中隐藏线的显示。`hidden on` 显示隐藏线，`hidden\
    \ off` 隐藏。\n\n- `shading`\n  控制用 `surf`、`mesh`、`pcolor`、`fill` 和 `fill3` 命令创建的面的着色类型。`shading\
    \ flat` 选项设置光滑着色，`shading interp` 选项设置密集着色，`shading faceted` 选项（默认选项）设置普通着色。\n\
    \n- `colormap(M)`\n  将矩阵 `M` 作为当前颜色映射。`M` 必须有三列，且包含仅位于 0 到 1 之间的值。它也可以是一个行向量为\
    \ RGB 类型 `[r g b]` 的矩阵。MATLAB 中已经定义了矩阵 `M`，例如：`bone(p)`、`contrast(p)`、`cool(p)`、`copper(p)`、`flag(p)`、`gray(p)`、`hsv(p)`、`hot(p)`、`jet(p)`、`pink(p)`、`prism(p)`\
    \ 和 `white(p)`。所有矩阵都有 3 列和 `p` 行。例如，语法 `colormap(hot(8))` 将 `hot(8)` 矩阵设置为当前颜色映射（当前图形的完整颜色系统）。\n\
    \n- `brighten(p)`\n  调整图形的亮度。如果 `0<p<1`，图形将变亮；如果 `-1<p<0`，图形将变暗。`p` 的范围是 `(-1,1)`，随着\
    \ `p` 的值接近 `-1`，图形变暗，而随着 `p` 的值接近 `1`，图形变亮。\n\n- `image(A)`\n  生成一个二维图像，其亮度与矩阵\
    \ `A` 的元素成正比，用于显示适应矩阵 `A` 中给定亮度的照片和绘图。矩阵 `A` 的每个元素 `(m,n)` 影响图形中的一个单元格。\n\n- `pcolor(A)`\n\
    \  生成一个颜色与矩阵 `A` 的元素成正比的二维图形，用于显示具有不同颜色抽象数学对象。矩阵 `A` 的每个元素 `(m,n)` 影响图形中的一个网格。\n\
    \n- `caxis([cmin cmax])`\n  为图形设置颜色比例（由 `colormap` 定义，并通过网格与轴上的划分相关）的最小值和最大值。因此，它允许图形使用\
    \ `colormap` 定义的颜色子集。\n\n- `figure(h)` 或 `h=figure`\n  创建一个名为 `h` 的图形并将其作为普通图形。`gcf(h)`\
    \ 命令用于引用图形 `h` 的任何属性。`close(h)` 关闭图形 `h`。`whitebg(h)` 命令更改图形 `h` 的背景颜色。`clf` 命令清除当前图形。`graymon`\
    \ 命令设置灰度。`newplot` 命令确定新图形。`refresh` 命令刷新图形。\n\n- `axes(e)` 或 `e=axes`\n  在当前图形创建一个名为\
    \ `e` 的轴。`gca(e)` 命令引用轴 `e` 的任何属性。`cla` 命令清除当前轴。\n\n- `l=line(x,y)` 或 `l=line(x,y,z)`\n\
    \  创建一个名为 `l` 的对象，连接平面 `(X,Y)` 或空间 `(X,Y,Z)` 点。\n\n- `p=patch(X,Y,C)` 或 `patch(X,Y,Z,C)`\n\
    \  由点 `(X,Y)` 或 `(X,Y,Z)` 定义的不多形区域，其颜色由 `C` 指定，作为对象 `p`。\n\n- `s=surface(X,Y,Z,C)`\n\
    \  由 `X`、`Y` 和 `Z` 定义的参数表面，其颜色由 `C` 指定，作为对象 `s`。\n\n- `i=image(C)`\n  通过矩阵 `C`\
    \ 中的给定颜色创建图像 `i`。\n\n- `t=text(x,y,'string')` 或 `t=text(x,y,z,'string')`\n  由字符串定义的文本，位于平面点\
    \ `(x,y)` 或空间点 `(x,y,z)`。\n\n- `set(h, 'property1', 'property2', ...)`\n  在对象\
    \ `h` 上设置指定的属性（`gca` 用于轴，`gcf` 用于图形，`gcbo`, `gcbd` 等）。\n\n- `get(h, 'property')`\n\
    \  返回对象 `h` 给定属性的当前值。\n\n- `object=gco`\n  返回当前图形。\n\n- `rotate(h, [a, e], [p,r])`\n\
    \  沿方位轴 `a` 和仰角 `e` 旋转对象 `h` 角度 `α`，点为 `(p,q)`。\n\n- `reset(h)`\n  更新分配给对象 `h`\
    \ 的属性并设置其默认属性。\n\n- `delete(h)`\n  删除对象 `h`。\n\n### MATLAB 属性\n\n| 对象 | 属性 | 可能值\
    \ |\n| :--- | :--- | :--- |\n| **Figure** | Colour（背景颜色） | `'y'`, `'m'`, `'c'`,\
    \ `'r'`, `'g'`, `'b'`, `'k'` |\n| | ColorMap（颜色映射） | `hot(p)`, `gray(p)`, `pink(p)`,\
    \ .... |\n| | Position（位置） | `[left, bottom, width, height]` |\n| | Name（名称） |\
    \ 带有名称 |\n| | MinColorMap（颜色） | 映射的最小颜色数 |\n| | NextPlot（后续绘图模式） | `new`, `add`,\
    \ `replace` |\n| | NumberTitle（图形内标题） | `on`, `off` |\n| | Units（单位） | `pixels`,\
    \ `inches`, `points` |\n| | Resize（鼠标调整图形大小） | `on`（可以更改），`off`（不更改） |\n| **Axes**\
    \ | Box（图形框） | `on`, `off` |\n| | Colour（轴颜色） | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`,\
    \ `'b'`, `'k'` |\n| | GridLineStyle（网格线样式） | `'-'`, `'—'`, `':'`, `'-.'` |\n|\
    \ | Position（屏幕位置） | `[left, bottom, width, height]` |\n| | TickLength（刻度长度） |\
    \ 数值 |\n| | TickDir（刻度方向） | `in`, `out` |\n| | Units（单位） | `pixels`, `inches`,\
    \ `points` |\n| | View（视角） | `[azimuth, elevation]` [azimuth, elevation] |\n|\
    \ | FontAngle（字体角度） | `normal`, *italic*, *oblique* |\n| | FontName（字体名称） | 带有来源的文本\
    \ |\n| | FontSize（字体大小） | 数值 |\n| | FontWeight（字体粗细） | `light`, `normal`, `demi`,\
    \ **bold** |\n| | DrawMode（绘制模式） | `normal`, `fast` |\n| | Xcolor, Ycolor, Zcolor（轴颜色）\
    \ | `[min, max]` `[min, max]` `[min, max]` `[min, max]` `[min, max]` `[min, max]`\
    \ |\n| | XDir, YDir, ZDir（轴方向） | `normal`（从左到右增长），`reverse`（反向） |\n| | XGrid,\
    \ YGrid, Zgrid（网格） | `on`, `off` |\n| | XLabel, YLabel, Zlabel（标签） | 带有标签内容的字符串\
    \ |\n| | XLim, YLim, Zlim（限制值） | `[min, max]`（变化范围） |\n| | XScale, YScale, ZScale（比例）\
    \ | `linear`（线性），`log`（对数） |\n| | XTick, YTick, ZTick（刻度） | `[m1,m2,...]`（轴上的刻度位置）\
    \ |\n\n"
