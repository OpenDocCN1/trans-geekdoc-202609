    ## Example Nine: Bilinear and Quadratic Forms


    As a ninth example we classify the bilinear form `f:Ux→R` and the quadratic form
    `g:U→R` defined as follows:


    ![Texto generada automáticamente con confianza media](d2d_images/image041.png)


    >> $A=[1,-2,0;0,0,4;-1,0,-3]$


    $A = $

    ```

    1 -2 0

    0 0 4

    -1 0 -3

    ```


    >> `det(A)`


    ans = 8


    Since the determinant of the matrix of `f` is non-zero, the bilinear form is regular
    non-degenerate.


    >> $B=[1,-1,3;-1,1,-3/2;3,-3/2,4]$


    $B = $

    ```

    1 -1 3

    -1 1 -1.5

    3 -1.5 4

    ```


    To classify the quadratic form we calculate its diagonal determinants.


    >> `det(B)`


    ans = -2.2500


    >> `det([1,-1;-1,1])`


    ans = 0


    It turns out that the quadratic form is negative semidefinite. But classification
    can also be done through the eigenvalues of the quadratic form. A quadratic form
    is positive definite if, and only, all its eigenvalues are strictly positive.
    A quadratic form is defined negative if, and only, all its eigenvalues are strictly
    negative. A quadratic form is positive semidefinite if, and only, all its eigenvalues
    are non-negative. A quadratic form is negative semidefinite if, and only, all
    its eigenvalues are non-positive. A quadratic form is indefinite if there are
    positive and negative eigenvalues.


    >> `eig(B)`


    ans =

    ```

    -0.8569

    0.4071

    6.4498

    ```


    There are positive and negative eigenvalues, so the quadratic form is undefined.


