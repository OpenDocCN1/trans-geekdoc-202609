    ## Property Reference Table


    | Category | Property | Description |

    | :--- | :--- | :--- |

    | | `Xdata,Ydata,Zdata` (coordinate.) | set of coordinates of the line |

    | `Text` | `Colour` (text colour) | `''y''`, `''m''`, `''c''`, `''r''`, `''g''`,
    `''b''`, `''w''`, `''k''`. |

    | | `FontAngle` (font angle) | normal, italic, oblique |

    | | `FontName` (font name) | text with the name of the source |

    | | `FontSize` | numerical value |

    | | `FontWeight` (font weight) | light, normal, demi, bold |

    | | `HorizontalAlignment` (hor. adjustment) | left, centre, right |

    | | `VerticalAlignment` (vertical adjustment) | top, cap, middle, baseline, bottom
    |

    | | `Position` (position on screen) | `[x, y, z]` (location point) |

    | | `Rotation` (text orientation) | 0,± 90, ±180, ±270 |

    | | `Units` (units of measurement) | pixels, inches, centimeters, points |

    | | `String` (text string to be placed) | string with the text |

    | `Surface` | `Cdata` (colour of each point) | colour matrix |

    | | `Edgecolor` (grid colour) | `''y''`, `''m''`,..., none, flat, interp |

    | | `Facecolor` (colour of faces) | `''y''`, `''m''`,..., none, flat, interp |

    | | `LineStyle` (line style) | `''-''`, `''—''`, `'':''`, `''-.''`, `''+''`, `''*''`,
    `''.''`, `''x''` |

    | | `LineWidth` (line width) | numerical value |

    | | `MeshStyle` (lines in rows and col.) | row, colum, both |

    | | `Visible` (line visible or not on screen) | on, off |

    | | `Xdata,Ydata,Zdata` (coordinate.) | set of surface coordinates |

    | `Patch` | `Cdata` (colour of each point) | colour matrix |

    | | `Edgecolor` (axle colour) | `''y''`, `''m''`,..., none, flat, interp |

    | | `Facecolor` (colour of faces) | `''y''`, `''m''`,..., none, flat, interp |

    | | `LineWidth` (line width) | numerical value |

    | | `Visible` (visible or not visible line on screen) | on, off |

    | | `Xdata,Ydata,Zdata` (coordinate.) | set of surface coordinates |

    | `Image` | `Cdata` (colour of each point) | colour matrix |

    | | `Xdata,Ydata` (coordinates) | set of image coordinates |


    ## Illustrative Examples


    Let us look at some illustrative examples.


    ```mat

    x=linspace(0,2,30);

    y=sin(x.^2);

    plot(x,y)

    text(1,0.8, ''y=sin(x^2)'')

    hold on

    z=log(sqrt(x));

    plot(x,z)

    text(1,-0.1, ''y=log(x)'')

    xlabel(''X-axis'');

    ylabel(''Y-axis'');

    title(''Sine and logarithmic graph'');

    ```


    ```matlab

    subplot(2,2,1);

    ezplot(''sin(x)'',-2*pi 2*pi);

    subplot(2,2,2);

    ezplot(''cos(x)'',-2*pi 2*pi);

    subplot(2,2,3);

    ezplot(''csc(x)'',-2*pi 2*pi);

    subplot(2,2,4);

    ezplot(''sec(x)'',-2*pi 2*pi);

    ```


    ```matlab

    X,Y=meshgrid(-2:.05:2);

    Z=X.^2-Y.^2;

    subplot(2,2,1);

    surf(X,Y);

    subplot(2,2,2);

    surf(X,Y),view(-90,0);

    subplot(2,2,3);

    surf(X,Y),view(60,30);

    subplot(2,2,4);

    surf(X,Y),view(-10,30);

    ```


    ```matlab

    X,Y=meshgrid(-2:.05:2);

    Z=X.^2-Y.^2;

    surf(X,Y,Z),shading interp,brighten(0.75),colourmap(gray);

    ```


    ### Exercise 1

    Represent the surface defined by the equation:


    ```matlab

    x,y=meshgrid(0:.05:2,-2:.05:2);

    z=y.^2*(x-1).^2./(y.^2+(x-1).^2;

    mesh(x,y,z),view([-23,30]);

    ```


    We could also have represented the surface as follows:


    ```matlab

    ezsurf(''y^2*(x-1)^2/(y^2+(x-1)^2)'')

    ```


    ### Exercise 2

    Let $f:R^2 \to R$ be a function defined by: Represent it graphically in an environment
    of $(0,0)$.


    ```matlab

    x,y=meshgrid(-1/100:0.0009:1/100,-1/100:0.0009:1/100);

    z=(1-cos(x)).*sin(y)./(x.^3+y.^3);

    surf(x,y,z)

    view([50,-15])

    ```


    Plot the polar curves on the same graph adjacent to each other: represent their
    intersection.


    ```matlab

    a=0:.1:2*pi;

    subplot(1,2,1);

    r=sqrt(cos(2*a));

    polar(a,r)

    title('' r = sqrt(Cos(2a))'');

    subplot(1,2,2);

    r=sin(2*a);

    polar(a,r)

    title('' r = Sen(2a)'')

    ```


    To see the intersection of the two curves, we plot them both on the same axes.


    ```matlab

    a=0:.1:2*pi;

    r=sqrt(cos(2*a));

    polar(a,r)

    hold on;

    r=sin(2*a);

    polar(a,r);

    ```


    ### Exercise 4

    Represent the volume generated by rotating the cubic $12x - 9x^2 + 2x^3$ around
    the $OX$ axis, between $x=0$ and $x=5/2$.


    The surface of revolution will have the equation $y^2+z^2 = (12x-9x^2+2x^3)^2$,
    and to graph it can be parametrised as follows:


    ```matlab

    x = t , y = Cos(u)

    t=(0:.1:5/2);

    u=(0:.1:2*pi);

    z=(12*t-9*t^2+2*t^3).*sin(u)

    surf(x,y,z)

    ```


    Represent the volumes generated by rotating the ellipse: around the $OX$ axis
    and the $OY$ axis. We represent the generated figures on the same graph, but only
    the positive half. The final volume will be twice the volume. The equation of
    the figure $y^2+z^2=9$ is parametrised as follows:


    ```matlab

    t=(0:.1:2);

    u=(0:.1:2*pi);

    x=t, y=3*cos(u), z=3*sin(u)

    surf(x,y,z)

    ```


    Wait, the logic above for the ellipse rotation in the text is:

    ```matlab

    t=(0:.1:2);

    u=(0:.1:2*pi);

    x=t, y=3*cos(u), z=3*sin(u)

    surf(x,y,z)

    ```

    Actually, based on the text provided:

    ```matlab

    t=(0:.1:2);

    u=(0:.1:2*pi);

    x=t, y=3*cos(u), z=3*sin(u)

    surf(x,y,z)

    ```


    ### Exercise 6

    Represent the intersection of the paraboloid $x^2+y^2=2$ with the plane $z=x+2$.


    ```matlab

    x,y=meshgrid(-3:.1:3);

    z=x.^2+y.^2;

    mesh(x,y,z)

    hold on;

    z=x+2;

    mesh(x,y,z)

    ```


    Represent the volume bounded by the paraboloid $x^2+4y^2=z$, and laterally by
    the cylinders of equations $y^2=x$ and $x=y^2$.


    ```matlab

    x,y=meshgrid(-1/2:.02:1/2,-1/4:.01:1/4);

    z=x.^2+4*y.^2;

    mesh(x,y,z)

    hold on;

    y=x.^2;

    mesh(x,y,z)

    hold on;

    x=y.^2;

    mesh(x,y,z)

    ```


    Represent on the same axes the parabolas $y^2=x$ and $x^2=y$. Also represent on
    the same axes the parabola $y^2=4x$ and the line $x+y=3$.


    ```matlab

    fplot(''\[x^2,sqrt(x)\]'',\[0,1.2])

    fplot(''\[(4\*x)^(1    /2),3-x\]'',\[0,4,0,4])

