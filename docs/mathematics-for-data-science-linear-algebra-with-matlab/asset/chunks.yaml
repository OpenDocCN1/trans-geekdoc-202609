    # 2.1 COMPLEX NUMBERS


    ![image](d2d_images/chapter_title_below.png)


    MATLAB implements in a simple way the work with complex numbers in binomial form
    by representing the imaginary unit by the symbols `i` or `j`.


    We already know that a complex number in binomial form is represented in the form
    `a+bi` or `a+bj`. It is not necessary to include the product symbol (the asterisk)
    before the imaginary unit, although if it is included, everything works correctly.
    What you do have to bear in mind is that you cannot insert spaces between the
    imaginary part number and the imaginary unit `i`.


    Complex numbers can have symbolic real part or symbolic imaginary part or both,
    with operations being performed in either exact or decimal mode with the precision
    set with the `format` command. Therefore, it will also be possible to work with
    complex numbers in exact rational format through the `format rat` command.


    As for the usual operations (addition, difference, product, division and power)
    with complex numbers, they are performed in the usual way. Figure 2-1 shows examples.


    Obviously, since the real numbers are a subset of the complex numbers, the functions
    of complex variables will also be valid for real variables.


    ![image](d2d_images/image016.png)


