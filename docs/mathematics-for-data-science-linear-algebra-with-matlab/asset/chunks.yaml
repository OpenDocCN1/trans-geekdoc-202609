    # 1.7.1 Elements of vector variables


    ![image](d2d_images/chapter_title_below.png)


    MATLAB allows the selection of elements of vector variables using the following
    commands:


    | `x(n)` | Returns the `n`th element of the vector `x` | `X=(2:8)` `X = 2 3 4
    5 6 7 8` `X(3)` `ans = 4` |

    | --- | --- |

    | `x(a:b)` | Returns the elements of the vector `x` located between the `a`-th
    and the `b`-th, both inclusive. | `X(3:5)` `ans = 4 5 6` |

    | `x(a:p:b)` | Returns the elements of the vector `x` located between the `a`-th
    and the `b`-th, both inclusive, but separated from `p` by `p` units (a>b). | `X(1:2:6)`
    `ans = 2 4 6` |

    | `x(b:-p:a)` | Returns the elements of the vector `x` located between the `b`th
    and the `a`th, both inclusive, but separated from `p` by `p` units and starting
    with the `b`th (b>a). | `X(6:-2:1)` `ans = 7 5 3` |

