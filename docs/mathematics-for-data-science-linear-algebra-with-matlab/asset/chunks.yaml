    # 1.4 NUMBERS, ARITHMETIC OPERATIONS AND FORMATS


    ![image](d2d_images/chapter_title_below.png)


    Numerical work in MATLAB is very extensive. Integers, rational, real and complex
    numbers can be used, which in turn can be arguments of functions giving rise to
    integer, rational, real and complex functions. Therefore, the complex variable
    is a tractable field in MATLAB. Arithmetic operations in MATLAB are defined according
    to standard mathematical conventions. The following table presents the syntax
    of the basic arithmetic operations:


    | Expression | Description |

    | :--- | :--- |

    | `x + y` | Sum `>> 4+8` `ans = 12` |

    | `x - y` | Difference `>> 4-8` `ans = -4` |

    | `x * y` or `x y` | Product `>> 4\*8` `ans = 32` |

    | `x/y` | Division `>> 4/8` `ans = 0.5000` |

    | `x ^y` | Power `>> 4^8` `ans = 65536` |


    MATLAB performs arithmetic operations as if it were a conventional calculator,
    with full computational accuracy. The results of the operations are displayed
    either in exact form or by specifying the degree of precision the user desires.
    But this only affects the presentation, since the precision of the calculation
    is unlimited, which is feature that differentiates MATLAB from other numerical
    programs in which the word length with which the computer determines the precision
    (hardware-dependent). MATLAB can represent the results with the required accuracy,
    although internally it works with exact calculations to avoid rounding errors.
    This is how we have different formats of approximate representation, which sometimes
    facilitate the interpretation of the results. The commands relating to formats
    for the presentation of results are listed below:


    | Command | Description |

    | :--- | :--- |

    | `format short` | It gives the results to 4 decimal places. This is the default
    format of MATLAB. `>> sqrt(23)` `ans = 4.7958` |

    | `format long` | Gives results to 16 decimal places ![image](d2d_images/scene_break.png)
    `>> format long; sqrt(23)` `ans = 4.7958312331279` |

    | `format long e` | Provides results to 16 decimal places plus the required power
    of 10. `>> format long e; sqrt(23)` `ans = 4.7958312331279e+000` |

    | `format short e` | Gives results to 4 decimal places plus the required power
    of 10. `>> format short e; sqrt(23)` `ans = 4.7958e+000` |

    | `format long g` | Delivers in optimal long format `>> format long g; sqrt(23)`
    `ans = 4.795831233172` |

    | `format short g` | Delivers in optimal short format `>> format short g; sqrt(23)`
    `ans = 4.7958` |

    | `format bank` | Gives results to 2 decimal places `>> format bank; sqrt(23)`
    `ans = 4.80` |

    | `format rat` | Gives the results in the form of approximate rational number.
    `>> format rat; sqrt(23)` `ans = 115/24` |

    | `format +` | Gives the sign of the results (+, -) and ignores the imaginary
    part of complex numbers. `>> format +; sqrt(23)` `ans = +` |

    | `format hex` | Gives the results in the hexadecimal system. `>> format hex;
    sqrt(23)` `ans = 4013eee7577016` |

    | `vpa ''operations'' n` | Gives the result of operations to `n` exact digits
    `>> vpa ''sqrt(23)'' 20` `ans = 4.795831233127195416` |

    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # 1.5 INTEGERS AND INTEGER VARIABLE FUNCTIONS


    ![image](d2d_images/chapter_title_below.png)


    MATLAB works with integers and integer variable functions exactly. Regardless
    of the format in which the results are displayed, the calculations are exact.
    However, the `vpa` command allows you to obtain exact outputs with the required
    precision.


    As for the functions with integer variables, the most important ones that MATLAB
    provides are the following (the expressions in inverted commas are in string format):


    | Function | Description |

    | :--- | :--- |

    | `rem(n,m)` | Remainder of the division of `n` by `m` (function valid for real
    `n` and `m`) `>> rem(15,2)` `ans = 1` |

    | `sign(n)` | Sign of `n` (1 if `n>0`, -1 if `n<0`, `n` real) `>> sign(-8)` `ans
    = -1` |

    | `max(n1,n2)` | Maximum of the numbers `n1` and `n2` `>> max(17,12)` `ans = 17`
    |

    | `min(n1,n2)` | Minimum of the numbers `n1` and `n2` `>> min(17,12)` `ans = 12`
    |

    | `gcd(n1,n2)` | Greatest common divisor of `n1` and `n2` `>> gcd(17,12)` `ans
    = 1` |

    | `lcm(n1,n2)` | Least common multiple of `n1` and `n2` `>> lcm(17,12)` `ans =
    204` |

    | `factorial(n)` | Factorial of `n` (`n(n-1)(n-2)...1`) `>> factorial(9)` `ans
    = 362880` |

    | `factor(n)` | Decompose `n` into prime factors `>> factor(51)` `ans = 3 17`
    |

    | `dec2base(decimal,n_base)` | Converts the specified decimal number (base 10)
    to the new given base `n_base` `>> dec2base(2345,7)` `ans = 6560` |

