    In the Command Window, you can work with operations, functions, graphics and MATLAB
    code in general. Simply type an expression with valid MATLAB syntax and it will
    be executed by pressing `Enter`. It is also possible to evaluate previously executed
    operations. To do this, simply select the syntax you wish to evaluate, right-click
    and choose `Evaluate selection` from the resulting pop-up menu (Figures 1-4 and
    1-5). Choosing `Open selection` on a command from the same menu opens in the Editor/Debugger
    an M-file with the code of the command previously selected in the Command Window
    (Figures 1-6 and 1-7). In this way the MATLAB programming code is visible.


    ![image](d2d_images/image039.png) ![image](d2d_images/image090.png)

    Figure 1-4 Figure 1-5


    ![image](d2d_images/image020.png) ![image](d2d_images/image026.png)

    Figure 1-6 Figure 1-7


    MATLAB is case-sensitive, and you can use white space before and after minus signs,
    colons, and parentheses. MATLAB also allows you to type multiple commands on the
    same line, as long as they are separated by semicolons (Figure 1-8). The entries
    are executed sequentially in the order in which they appear on the line. Each
    command that ends with a semicolon will be executed, but will not display its
    output.


    Long entries that do not fit on one line can be continued on a second line by
    placing dots at the end of the first line (Figure 1-9).


    ![image](d2d_images/image027.png) ![image](d2d_images/image014.png)

    Figure 1-8 Figure 1-9


    Below is a list of keys, arrows and combinations that can be used in the Command
    Window.


    | Key | Control key | Operation |

    | :--- | :--- | :--- |

    | ↑ | `CTRL+ p` | Call the last executed entry. |

    | ↓ | `CTRL+ n` | Call up the following line. |

    | ← | `CTRL+ b` | Move one character backwards. |

    | → | `CTRL+ f` | Moves one character forward. |

    | CTRL+ → | `CTRL+ r` | Move one word to the right. |

    | CTRL+ ← | `CTRL+ l` | Move one word to the left. |

    | Home | `CTRL+ a` | Move to the beginning of the line. |

    | End | `CTRL+ e` | Move to the end of the line. |

    | ESC | `CTRL+ u` | Delete the line. |

    | Delete | `CTRL+ d` | Deletes the character where the cursor is. |

    | BACKSPACE | `CTRL+ h` | Deletes the character before the cursor. |

    | | `CTRL+ k` | Deletes all text up to the end of the line. |

    | Shift+ home | | Lightens the text from the beginning of the line. |

    | Shift+ end | | Lightens the text up to the end of the line. |

