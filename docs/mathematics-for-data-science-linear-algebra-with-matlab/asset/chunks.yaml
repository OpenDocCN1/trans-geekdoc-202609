    ## 1.12 Commands that handle variables in the workspace and store them in files


    MATLAB has a set of commands that allow you to define and manage variables, and
    store them in files in MATLAB''s own format (extension `.mat`) or in ASCII format,
    in a very simple way. When performing large calculations, it is convenient to
    give names to intermediate results. These intermediate results are assigned to
    variables to make them easier to use. Remember that the value assigned to a variable
    is permanent, until it is explicitly changed or until you leave the current work
    session. MATLAB incorporates a set of commands for handling variables, including
    the following:


    | `clear` `clear(v1,v2, ..., vn)` | `clear(''v1'', ''v2'', ..., ''vn'')` | Deletes
    all variables from the workspace Deletes specified numeric variables Deletes specified
    string variables |

    | --- | --- |

    | `disp(X)` | Displays an array without its name |

    | `length(X)` | Displays the length of vector `X` and if `X` is a matrix or array,
    displays its highest dimension |

    | `load file` `load file Y Z` `load file -ascii` `load file -mat` `S = load(...)`
    | Reads all variables from `.mat` file Reads all variables from specified `.mat`
    file Read `Y, Z` from the given `.mat` file Reads the file as ASCII Reads the
    file `.mat` whatever extension is Returns |

    | `saveas(h,''f.ext'')` `saveas(h,''format'')` | Save figure or model `h` as the
    file `f.ext` Save figure or model `h` with specified format |

    | `d = size(X)` `m,n = size(X)` `d1,d2,...,dn = size(X)` | Returns sizes of each
    dimension in a vector Returns dimensions of matrix `X` as names `m` and `n` |

    | `who` `whos` `who(''-file'',''file'')` `whos(''-file'',''file'')` `who(''var1'',''var2'',...)`
    `whos(''-file'',''filename'')` `who(''-file'',''var1'',''var2'',...)` `whos(''-file'',''filename
    var1 var2'')` `s = who(...)` `s = whos(...)` | List workspace variables Lists
    variables in given `.mat` file Lists workspace variables with their sizes Lists
    string variables in given `.mat` file Lists numeric variables in given `.mat`
    file Stores in `s` listed variables Lists numeric variables in given `.mat` file
    with their sizes |

    | `workspace` | Displays a browser to manage the |


    The `save` command is the essential tool for saving data in `.mat` files (readable
    only by MATLAB program) and in ASCII files (readable by any application). By default,
    variables are usually saved in `.mat` files. To store variables in ASCII format,
    it is necessary to use the `save` command with the following options:


    | Option | Data storage mode |

    | --- | --- |

    | `-append` | Variables are added at the end of the file |

    | `-ascii` | The variables are stored in a file in 8-digit ASCII format. |

    | `-ascii -double` | Variables are stored in 16-digit ASCII format. |

    | `-ascii -tabs` | Variables are stored in a tab-delimited, 8-digit ASCII format
    |

    | `-ascii -double -tabs` | Variables are stored in 16-digit tab-delimited ASCII
    format. |

    | `-mat` | The variables are stored in a MATLAB-formatted binary .mat file (MAT-file).
    |


