    # 特征值与奇异值函数


    - `eigs(A)`: `A` 的六最大特征值的向量。

    - `eigs(A,B)`: 对于对称 `B` 求解方程 `A*V == B*V*D`。

    - `eigs(A,k)`: `A` 的 `k` 个最大特征值的向量。

    - `eigs(A,B,k)`: 返回 `A*V == B*V*D` 的 `k` 个最大解。

    - `eigs(A,k, σ)`: 基于 `σ` 的 `A` 的 `k` 个最大特征值，其中 `σ` 可以取 `''lm''`（最大幅度）、`''sm''`（最小幅度）、`''lr''`（最大实部）、`''sr''`（最小实部）、`''li''`（最大虚部）和
    `''si''`（最小虚部）。根据 `σ` 提供 `A*V == B*V*D` 的 `k` 个最大解。

    - `eigs(A,...)`: 提供 `A` 的特征值对角矩阵 `D` 以及列为相应特征向量的矩阵 `V`。


