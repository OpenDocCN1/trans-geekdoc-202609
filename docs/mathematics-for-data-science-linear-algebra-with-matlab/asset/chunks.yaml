    | `symmlq(A,b,tol,maxit,M1,M2)` | `symmlq(A,b,tol,maxit,M1,M2,x0)` | `[x,flag]
    = symmlq(A,b,...)` |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | | ![image](img/scene_break.png) |

