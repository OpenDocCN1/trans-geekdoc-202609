    # 1.4 数字、算术运算和格式


    ![image](img/chapter_title_below.png)


    MATLAB 中的数值工作非常广泛。可以使用整数、有理数、实数和复数，这些数反过来可以作为函数的参数，产生整数、有理、实和复函数。因此，复变量是 MATLAB
    中一个易处理的领域。MATLAB 中的算术运算根据标准的数学习惯定义。下表给出了基本算术运算的语法：


    | 表达式 | 描述 |

    | :--- | :--- |

    | `x + y` | 和 `>> 4+8` `ans = 12` |

    | `x - y` | 差 `>> 4-8` `ans = -4` |

    | `x * y` 或 `x y` | 积 `>> 4\*8` `ans = 32` |

    | `x/y` | 除 `>> 4/8` `ans = 0.5000` |

    | `x ^y` | 幂 `>> 4⁸` `ans = 65536` |


    MATLAB 执行算术运算时就像一个普通的计算器一样，具有完全的计算精度。运算结果以精确形式显示，或者通过指定用户所需的精度来显示。但这仅影响呈现，因为计算精度是无限的，这是
    MATLAB 区别于其他数值程序的特征（在其他程序中，计算机确定精度的字长取决于硬件）。MATLAB 可以以所需的精度表示结果，尽管它在内部进行精确计算以避免舍入误差。这就是为什么我们有不同格式的近似表示，这有时有助于对结果的解释。与结果显示格式相关的命令列举如下：


    | 命令 | 描述 |

    | :--- | :--- |

    | `format short` | 将结果保留 4 位小数。这是 MATLAB 的默认格式。`>> sqrt(23)` `ans = 4.7958` |

    | `format long` | 将结果保留 16 位小数 ![image](img/scene_break.png) `>> format long;
    sqrt(23)` `ans = 4.7958312331279` |

    | `format long e` | 提供 16 位小数加上所需的 10 的幂次。`>> format long e; sqrt(23)` `ans =
    4.7958312331279e+000` |

    | `format short e` | 将结果保留 4 位小数加上所需的 10 的幂次。`>> format short e; sqrt(23)` `ans
    = 4.7958e+000` |

    | `format long g` | 以最优的长格式交付 `>> format long g; sqrt(23)` `ans = 4.795831233172`
    |

    | `format short g` | 以最优的短格式交付 `>> format short g; sqrt(23)` `ans = 4.7958` |

    | `format bank` | 将结果保留 2 位小数 `>> format bank; sqrt(23)` `ans = 4.80` |

    | `format rat` | 以有理数形式给出结果 `>> format rat; sqrt(23)` `ans = 23` |

    | `format +` | 以符号 (+) 给出结果并忽略复数部分。`>> format +; sqrt(23)` `ans =` |

    | `format hex` | 以十六进制系统给出结果。`>> format hex; sqrt(23)` `ans = e` |

    | `vpa ''operations'' n` | 以 `n` 位精确数字给出运算结果。`>> vpa ''sqrt(23)'' 20` `ans = 4.7958312331`
    |

