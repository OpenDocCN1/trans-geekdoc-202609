    ![image](d2d_images/chapter_title_above.png)


    # 1.9.3 Relational operators


    ![image](d2d_images/chapter_title_below.png)


    MATLAB also deals with relational operations that perform element-to-element comparisons
    between two arrays and return an array of the same size whose elements are zeros
    if the corresponding relation is true, or ones if the corresponding relation is
    false. Relational operators also allow scalars to be compared with vectors or
    matrices, in which case the scalar is compared with all elements of the matrix.
    The following table shows MATLAB relational operators.


    | `<` | Minor (for complexes only affecting real parts) >> `3<5` ans = 1 |

    | --- | --- |

    | `<=` | Less than or equal to (only affects real parts) >> `4<=6` ans = 0 |

    | `>` | Major (only affects real parts) >> `X=3*ones(3,3)` `X = 3 3 3 3 3 3` >>
    `X>[1 2 3; 4 5 6; 2 3]` ans = 1 1 0 0 0 0 |

    | `>=` | Greater than equal to (only affects real parts) >> `X>=[1 2 3; 4 5 6;
    2 3]` ans = 1 1 1 0 0 1 |

    | `==` | Equality (concerns complex numbers) >> `X==ones(3,3)` ans = 0 0 0 0 0
    0 |

    | `~=` | Inequality (concerns complex numbers) >> `X~=ones(3,3)` ans = 1 1 1 1
    1 1 |

    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

