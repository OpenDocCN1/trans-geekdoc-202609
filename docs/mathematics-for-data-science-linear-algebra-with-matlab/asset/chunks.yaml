    # Eigenvalue and Singular Value Functions


    - `eigs(A)`: Vector with the six largest eigenvalues of `A`.

    - `eigs(A,B)`: Solve the equation `A*V == B*V*D` with symmetrical `B`.

    - `eigs(A,k)`: Vector with the `k` largest eigenvalues of `A`.

    - `eigs(A,B,k)`: Returns the `k` largest solutions of `A*V == B*V*D`.

    - `eigs(A,k, σ)`: Vector with the `k` largest eigenvalues of `A` based on `σ`,
    where `σ` can be worth `''lm''` (largest magnitude), `''sm''` (smallest magnitude),
    `''lr''` (largest real part), `''sr''` (smallest real part), `''li''` (largest
    imaginary part) and `''si''` (smallest imaginary part). Gives the `k` largest
    solutions of `A*V == B*V*D` according to `σ`.

    - `eigs(A,...)`: Gives the diagonal matrix `D` of eigenvalues of `A` and the matrix
    `V` whose columns are the respective eigenvectors.


    >> `[V,D] = eigs(A)`

    ```

    V = -0.6621 0.1745 0.1821 -0.7149 -0.4819 -0.6291 -0.9288 -0.0292 -0.2766 0.5995
    0.3178 0.6972 -0.5029 -0.4630 0.0570 -0.0438

    D = 2.4021 0 0 0 0 -0.7158 0 0 0 0 -0.4400 0 0 0 0 -0.0346

    ```


    - `svds(A)`: Gives the 5 largest singular values of `A`.

    - `svds(A,k)`: Gives the `k` largest singular values of `A`.

    - `svds(A,k,0)`: Gives the `k` largest singular values of `A` using `eigs`.

    - `svds(A,...)`: Gives the matrices `U(m,k)` with orthonormal columns, `S(k,k)`
    diagonal and `V(n,k)` with orthonormal columns.


    >> `[U,S,V] = svds(A)`

