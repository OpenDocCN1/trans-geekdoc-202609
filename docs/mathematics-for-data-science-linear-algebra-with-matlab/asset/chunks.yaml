- fmt: "\n### `meshc(X,Y,Z,C)`\nRepresents the explicit surface $z=f(x,y)$ or the\
    \ parametric $x=x(t,u),y=y(t,u), z=z(t,u)$ together with the corresponding contour\
    \ plot (contour lines projected on the XY plane).\n```\n[X,Y] = meshgrid(-2:.2:2,\
    \ -2:.2:2);\nZ = X .* exp(-X.^2 - Y.^2);\nmeshc(X,Y,Z)\n```\n![image](d2d_images/image075.png)\n\
    \n### `contour(Z)`\nDraw the contour plot (contour lines) for the `Z` matrix.\
    \ The number of contour lines to be used is chosen automatically.\n```\n[X,Y]\
    \ = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.^2 - Y.^2);\ncontour(Z)\n```\n\
    ![image](d2d_images/image085.png)\n\n### `contour(Z,n)`\nDraw the contour plot\
    \ (contour lines) for the `Z` matrix using `n` contour lines.\n```\n[X,Y] = meshgrid(-2:.2:2,\
    \ -2:.2:2);\nZ = X .* exp(-X.^2 - Y.^2);\ncontour(Z)\n```\n![image](d2d_images/image065.png)\n\
    \n### `contour(x,y,Z,n)`\nDraw the contour plot (contour lines) for the `Z` matrix\
    \ using in the `X` and `Y` axes the scaling defined by the `x` and `y` vectors\
    \ (`n` contour lines).\n```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\nX=cos(r)*cos(t);\n\
    Y=sin(r)*sin(t);\nZ=ones(1,size(r))'\\t;\ncontour(X,Y,Z)\n```\n![image](d2d_images/image067.png)\n\
    \n### `contour3(Z)`, `contour3(Z,n)` and `contour3(x,y,Z,n)`\nDraw the contour\
    \ plots in 3 dimensions.\n```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\nX=cos(r)*cos(t);\n\
    Y=sin(r)*sin(t);\nZ=ones(1,size(r))'\\t;\ncontour3(X,Y,Z)\n```\n![image](d2d_images/image156.png)\n\
    \n### `contourf(...)`\nDraw a contour plot and fill in the areas between the isolines.\n\
    ```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\nX=cos(r)*cos(t);\nY=sin(r)*sin(t);\n\
    Z=ones(1,size(r))'\\t;\ncontourf(X,Y,Z)\n```\n![image](d2d_images/image009.png)\n\
    \n### `pcolor(X,Y,Z)`\nDraws a contour plot (contour lines) for the `(X,Y,Z)`\
    \ matrix using a representation based on colour densities. Often referred to as\
    \ a density plot.\n```\n[X,Y] = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.^2\
    \ - Y.^2);\nmeshc(X,Y,Z)\npcolor(X,Y,Z)\n```\n![image](d2d_images/image100.png)\n\
    \n### `trimesh(Tri,X,Y,Z,C)`\nDisplays triangles defined in the `Tri` matrix as\
    \ a mesh. Each row of the `Tri` matrix defines a single triangular face and `C`\
    \ defines the colours as in `surf`. The `C` argument is optional.\n\n### `trisurf(Tri,X,Y,Z,C)`\n\
    Displays triangles defined in the `Tri` matrix as a surface. Each row of the `Tri`\
    \ matrix defines a single triangular face and `C` defines the colours as in `surf`.\
    \ The `C` argument is optional.\n\n# 3.5 THREE-DIMENSIONAL GEOMETRIC SHAPES\n\n\
    With MATLAB it is possible to plot cylinders, spheres, bar charts, sections, stems,\
    \ waterfall and other three-dimensional geometric shapes. The following table\
    \ summarises the commands for this purpose.\n\n### `bar3(Y)`\nBar chart relative\
    \ to the vector of frequencies `Y`. If `Y` is a matrix, the multiple bar chart\
    \ is obtained for each row of `Y`.\n```\nbar3(rand(4,4))\n```\n![image](d2d_images/image029.png)\n\
    \n### `bar3(x,Y)`\nBar chart relative to the vector of frequencies `Y` where `x`\
    \ is a vector defining the spaces on the `X`-axis to place the bars.\n\n### `bar3(...,width)`\n\
    Chart with given width of the bars. By default, the width is `0.8` and `1` causes\
    \ the bars to touch.\n\n### `bar3(...,'style')`\nChart with style for the given\
    \ bars. The styles are `'detached'` (default style), `'grouped'` (style with grouped\
    \ bars) and `'stacked'` (stacked bars).\n\n### `bar3(...,colour)`\nThe bars are\
    \ all of the specified colour (`r=red`, `g=green`, `b=blue`, `c=cyan`, `m=magenta`,\
    \ `k=black` and `w=white`).\n\n### `com3(z)`, `com3(x,y,z)`\nComet graph relative\
    \ to the `z` vector. Parametric kite graph (`x(t)`, `y(t)`, `z(t)`).\n```\nt =\
    \ -pi:pi/500:pi;\ncom3(sin(t),cos(t),t)\n```\n![image](d2d_images/image032.png)\n\
    \n### `cylinder(...)`\nGives the coordinates of the unit cylinder. Gives the coordinates\
    \ of the cylinder generated by the curve `r`. Gives the coordinates of the cylinder\
    \ generated by the curve `r` with `n` points on the circumference horizontal section\
    \ aligned with the `Z` axis (`n=20` by default). Graph the above:\n```\nt = 0:pi/10:pi;\n\
    [X,Y,Z] = cylinder(2+cos(t));\nsurf(X,Y,Z)\n```\n![image](d2d_images/image094.png)\n\
    \n### `sphere`\nPlots the unit sphere using `20x20` faces.\n\n### `sphere(n)`\n\
    Generate a sphere using `nxn` faces. \n```\nsphere(100)\n```\n![image](d2d_images/image125.png)\n\
    \n### `[X,Y,Z] = sphere(n)`\nGives the coordinates of the sphere in matrices `(n+1)x(n+1)`.\n\
    \n### `slice(V,sx,sy,sz)`, `slice(X,Y,Z,V,sx,sy,sz)`, `slice(V,XI,YI,ZI)`, `slice(X,Y,Z,V,XI,YI,ZI)`\n\
    Draw slices\nDraw slices along the `x`, `y`, `z` directions in the volume `V`\
    \ (array `mxnp`) defined by the vectors `sx,sy,sz`. Draw slices by the vectors\
    \ `sx,sy,sz` in the volume `V` defined by the three-dimensional arrays `X,Y,Z`.\
    \ Draw slices in the volume `V` defined by the matrices `XI,YI,ZI` that generate\
    \ a surface. Draw slices defined by the arrays `XI,YI,ZI` that generate a surface\
    \ in the volume `V` defined by the three-dimensional arrays `X,Y,Z`. Draws cuts\
    \ according to the specified interpolation method (`linear` for linear, `cubic`\
    \ for cubic and `nearest` for neighbouring).\n```\n[x,y,z] = meshgrid(-2:.2:2,\
    \ -2:.25:2, -2:.16:2);\nv = x .* exp(-x.^2 - y.^2 - z.^2);\nslice(x,y,z,v,[-1.2\
    \ .8 2],2,[-2 -.2])\n```\n![image](d2d_images/image060.png)\n\n### `stem3(Z)`,\
    \ `stem3(X,Y,Z)`, `stem3(...,'fill')`, `stem3(...,S)`\nDraw the sequence `Z` as\
    \ a stem graph in the `(x,y)` plane. Draws the sequence `Z` at the values specified\
    \ by `X` and `Y`. Fill the circles at the tips of the stems with colour. Make\
    \ the stem chart with `S` specifications (`colour`, ...).\n```\nX = linspace(0,1,10);\n\
    Y = X./2;\nZ = sin(X) + cos(Y);\nstem3(X,Y,Z,'fill')\n```\n![image](d2d_images/image083.png)\n\
    \n# 3.6 SPECIALISED GRAPHICS\n\nATLAB provides commands for plotting area plots,\
    \ box plots, three-dimensional pie charts, Pareto charts and other specialised\
    \ plots. The following table presents the syntax of these commands.\n\n### `area(Y)`,\
    \ `area(X,Y)`, `area(...,ymin)`\nMake the area graph relative to the vector of\
    \ frequencies `Y`. Make the area graph relative to the vector of frequencies `Y`\
    \ whose elements are given through the vector `X`. Specifies the lower boundary\
    \ in the `y`-direction of the fill area.\n```\nY = [1, 5, 3;3, 2, 7;1, 5, 3;2,\
    \ 6, 1];\narea(Y)\n```\n![image](d2d_images/image072.png)\n\n### `box on, box\
    \ off`\nEnables and disables boxes on axes for 2-D and 3-D charts.\n\n### `comet(y)`,\
    \ `comet(x,y)`\nMake the kite plot relative to the vector of frequencies `Y`.\
    \ Make the kite graph relative to the vector of frequencies `Y` whose elements\
    \ are given through the vector `X`.\n```\nt = -pi:pi/200:pi;\ncomet(t,tan(sin(t))-sin(tan(t)))\n\
    ```\n![image](d2d_images/image059.png)\n"
