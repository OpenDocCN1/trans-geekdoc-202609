    # 4.3IAL INTERPOLATION


    `k = polyder(p)`, `k = polyder(a,b)`, `[q,d] = polyder(b,a)`

    Gives the coefficients of the polynomial `k` derived from the polynomial `p`.

    Give the coefficients of the derivative of the product of `a` and `b`.

    Give the numerator `q` and denominator `d` of the derivative of `a/b`.


    ```

    >> polyder([1 -8 17 2 -24])

    ans = 4 -24 34 2

    >> poly2sym([1 -8 17 2 -24])

    ans = x^4 - 8*x^3 + 17*x^2 + 2*x - 24

    >> poly2sym(polyder([1 -8 17 2 -24]))

    ans = 4*x^3 - 24*x^2 + 34*x + 2

    >> u=[3 -1 4 2];v=[2 1 4 4 6 8 3];

    >> k=polyder(u,v)

    k = 48 7 114 110 144 99 82 28

    >> poly2sym(k)

    ans = 48*x^7 + 7*x^6 + 114*x^5 + 110*x^4 + 144*x^3 + 99*x^2 + 82*x + 28

    >> [q,d]=polyder(u,v)

    q = -12 3 -30 -10 8 -29 -30 -4

    d = 4 4 17 32 60 76 106 120 100 48 9

    ```


    `p = polyfit(x,y,n)`, `[p,S] = polyfit(x,y,n)`, `[p,S,u] = polyfit(x,y,n)`

    Polynomial of degree `n` fitting the point cloud `(x,y)`.

    Polynomial of degree `n` fitting the points `(x,y)` with variance `S`.

    Polynomial of degree `n` fitting the `(x,y)` points with variance `S` and mean
    `u` for the error of fit.


    ```

    >> u=[3 -1 4 2];v=[2 1 4 6];

    >> p=poly2sym(polyfit(u,v,3))

    p = (53*x^3)/60 - (99*x^2)/20 + (119*x)/30 + 54/5

    >> [p,S,u]=polyfit(u,v,3)

    p = 8.9050 1.6333 -11.3053 6.0000

    S = A: [4x4 double]. df: 0 normr: 1.2686e-014

    u = 2.0000 2.1602

    ```


    `y = polyval(p,x)`, `y = polyval(p,x,[],u)`, `[y,delta] = polyval(p,x,S)`, `[y,delta]
    = polyval(p,x,S,u)`

    Evaluate the polynomial `p` in `x`.

    Evaluates the polynomial `p` in `x` with mean `u` for the error.

    Evaluate the polynomial `p` in `x` with variance `S` for the error `y` with an
    error `y ±delta` in the result.

    Evaluate the polynomial `p` in `x` with mean `u` and variance `S` for the error
    `y` with an error `y ±delta` in the result.


    ```

