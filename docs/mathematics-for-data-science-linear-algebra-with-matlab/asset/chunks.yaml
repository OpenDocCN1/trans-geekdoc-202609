    # 1.7.2 矩阵元素


    ![image](img/chapter_title_below.png)


    对于矩阵 `A`，MATLAB 允许使用以下命令选择矩阵元素：


    | `A(m,n)` | 定义矩阵 `A` 的第 `m` 行第 `n` 列 | `A=[3 5 7 4;1 6 9;2 6 8]` `A(2,4)` `ans
    = 9` |

    | --- | --- |

    | `A(a:b,c:d)` | 定义矩阵 `A` 中包含从 `a` 行到 `b` 行以及从 `c` 列到 `d` 列的子矩阵 | `A(1:2,2:3)`
    `ans = 5 7 6 8` |

    | `A(a:p:b,c:q:d)` | 定义矩阵 `A` 中包含从 `a` 行到 `b` 行（增量为 `p`）以及从 `c` 列到 `d` 列（增量为 `q`）的子矩阵
    | `A(1:2:3,1:2:4)` `ans = 3 7 2 8` |

    | `A([a b])` | 定义由第 `a` 行、第 `b` 行以及第 `c` 列、第 `d` 列组成的子矩阵 | `A([2 3],[2 4])` `ans
    = 6 9` |

    | `A([a b c],[e g])` | 定义由行 `a`, `b`, `c` 和列 `e`, `f`, `g` 交叉形成的子矩阵 | `A([2 3],[1
    2])` `ans = 1 9 2 6` |

    | `A([:d])` | 定义矩阵 `A` 中包含所有行以及从 `c` 列到 `d` 列的子矩阵 | `A(:,2:4)` `ans = 5 7 4 6
    9 6 8` |

    | `A(:,[c d e])` | 定义矩阵 `A` 中包含所有行和列 `c`, `d`, `e` 的子矩阵 | `A(:,[2, 3])` `ans =
    5 7 6 8` |

    | `A(a:b,:)` | 定义矩阵 `A` 中包含所有列以及从 `a` 行到 `b` 行的子矩阵 | `A(2:3,:)` `ans = 1 6 8 9
    2 6 8` |

    | `A([a b c],:)` | 定义矩阵 `A` 中包含所有列和行 `a`, `b`, `c` 的子矩阵 | `A([1,3],:)` `ans =
    3 5 7 4 2 6 8` |

    | `A(a,:)` | 定义矩阵 `A` 的第 `a` 行 | `A(3,:)` `ans = 2 6` |

    | `A(:,b)` | 定义矩阵 `A` 的第 `b` 列 | `A(:,3)` `ans = 8` |

    | `A(:)` | 定义一个按顺序包含矩阵 `A` 所有元素的列向量 | `A(:)` `ans = 3 1 5 6 7 9 4 8` |

    | `A(:,:)` | 等于整个矩阵 `A` | `A(:,:)` `ans = 3 5 7 4 1 6 8` |

    | `[A,B,C...]` | 由子矩阵 `A`, `B`, `C` 组成的矩阵 | `A1=[2 6;4 1], A2=[3 8;6 9], A2=[3
    8;6 9].` `A1 = 2 6 4 1` `A2 = 3 8 6 9` `[A1,A2] [A1,A2] [A1,A2] [A1,A2] [A1,A2]
    A1,A2` `ans = 2 6 3 8 4 1 6 9` |

