    # 1.9 运算符


    MATLAB 是一门与其他语言相同的方式包含算术、逻辑和关系运算符的语言。以下是 MATLAB 语言范围内引用的运算符列表。


    # 1.9.1 算术运算符


    MATLAB 包含了用于数值处理的常用算术运算符（加、减、乘、除）。同时，它将这些运算符的含义扩展到标量、向量和矩阵，如下所示：


    | 运算符 | 作用 |

    | :--- | :--- |

    | `+` | 标量、向量或矩阵的和 `A=[1 3 -2 6];B=[4 -5 8]; c=3;` `>> V1=A+c` `V1 = 4 6 9` `>>
    V2=A+B` `V2 = 5 -2 8` |

    | `-` | 标量、向量或矩阵的相减 `>> V3=A-c` `V3 = -2 0 -5` `>> V4=A-B` `V4 = -3 8 -10 4` |

    | `\*` | 标量、矩阵或标量与向量的乘积 `>> V3=A\*c` `V3 = 3 9 -6 18` |

    | `.\*` | 标量或逐元素向量的乘积 `>> V4=A.\*B` `V4 = 4 -15 -16 12` |

    | `.^` | 向量的幂（`A.^B = [A(i,j) ^ B(i,j)]`, A 和 B 为向量） `>> V6=A.^B` `V6 = 1.0000
    0.0041 256.0000 36.0000` `>> A.^c` `ans = 1 27 -8 216` `>> c.^A` `ans = 3.0000
    27.0000 0.1111 729.0000` |

    | `./` | `A./B = [A(i,j)/B(i,j)]`，其中 A 和 B 为向量且 `[dim(A)=dim(B)]` `>> V7=A./B`
    `V7 = 0.2500 -0.6000 -0.2500 3.0000` |

    | `.\\` | `A.B = [B(i,j)/A(i,j)]`，其中 A 和 B 为向量且 `[dim(A)=dim(B)]` `>> V8=A.B`
    `V8 = 4.0000 -1.6667 -4.0000 0.3333` |


