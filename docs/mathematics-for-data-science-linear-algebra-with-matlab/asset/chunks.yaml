    以下是 MATLAB 提供的通过对称最小二乘和非负最小二乘法求解方程和系统的命令。我们已经学习了一般的方程和系统。在该领域，可以使用我们目前看到的命令，但
    MATLAB 为这些问题专门提供了特定的命令。


    ## gmres


    | `x = gmres(A,b)` | `gmres(A,b,tol)` | `gmres(A,b,tol,maxit)` | `gmres(A,b,tol,maxit,M)`
    | `gmres(A,b,tol,maxit,M1,M2)` | `gmres(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = gmres(A,b,...)`
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | | ![image](img/scene_break.png) |

    | `[x,f,relres] = gmres(A,b,...)` | `[x,f,relres,iter] = gmres(A,b,...)` | | |
    | | |

    | 尝试通过广义最小残留法求解系统 `Ax=b`。 | 指定容差求解 `Ax=b` | 指定容差和最大迭代次数求解 `Ax=b` | 求解系统 `inv(M)*A*x
    = inv(M)*b` | 使用 `M=M1*M2` 求解系统 `inv(M)*A*x = inv(M)*b` | 使用 `M=M1*M2` 且初值 `x0`
    求解系统 `inv(M)*A*x = inv(M)*b` | 求解系统且 `f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞和 4=极极端数值）。它还返回相对残差范
    `norm(b-A*x)/norm(b)`。同时也返回迭代次数。 |


    ```matlab

    >> A=[pi 2*pi 3*pi-pi; 1 0 -1 2; exp(1) exp(2) exp(4); i 2i 3i -i];

    >> B=[1 2 3 4]'';

    >> [x,f,r,i]=gmres(A,B)

    x = 1.5504 + 0.0085i -0.2019 - 0.2433i -0.2532 + 0.0423i 0.0982 + 0.0169i

    f = 3

    r = 0.6981

    i = 1 4

    ```


    | `x = minres(A,b)` | `minres(A,b,tol)` | `minres(A,b,tol,maxit)` | `minres(A,b,tol,maxit,M)`
    | `minres(A,b,tol,maxit,M1,M2)` | `minres(A,b,tol,maxit,M1,M2,x0)` | `[x,f] =
    minres(A,b,...)` |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | | ![image](img/scene_break.png) |

    | `[x,f,relres] = minres(A,b,...)` | `[x,f,relres,iter] = minres(A,b,...)` | |
    | | | |

    | 尝试通过最小残留法求解系统 `Ax=b`。 | 指定容差求解 `Ax=b` | 指定容差和最大迭代次数求解 `Ax=b` | 求解系统 `inv(M)*A*x
    = inv(M)*b` | 使用 `M=M1*M2` 求解系统 `inv(M)*A*x = inv(M)*b` | 使用 `M=M1*M2` 且初值 `x0`
    求解系统 `inv(M)*A*x = inv(M)*b` | 求解系统且 `f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞和 4=极极端数值）。它还返回相对残差
    `norm(b-A*x)/norm(b)`。同时也返回迭代次数。 |


    ```matlab

    >> A=[pi 2*pi 3*pi-pi; 1 0 -1 2; exp(1) exp(2) exp(3) exp(4); i 2i 3i -i];

    >> B=[1 2 3 4]'';

