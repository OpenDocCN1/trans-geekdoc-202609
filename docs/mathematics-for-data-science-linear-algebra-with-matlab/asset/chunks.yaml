    # 4.3 多项式插值


    `k = polyder(p)`, `k = polyder(a,b)`, `[q,d] = polyder(b,a)`

    给出多项式 `p` 导出的多项式 `k` 的系数。

    给出 `a` 和 `b` 之积导数的系数。

    给出 `a/b` 数的分子 `q` 和分母 `d`。


    ```

    >> polyder([1 -8 17 2 -24])

    ans = 4 -24 34 2

    >> poly2sym([1 -8 17 2 -24])

    ans = x⁴ - 8*x³ + 17*x² + 2*x - 24

    >> poly2sym(polyder([1 -8 17 2 -24]))

    ans = 4*x³ - 24*x² + 34*x + 2

    >> u=[3 -1 4 2];v=[2 1 4 4 6 8 3];

    >> k=polyder(u,v)

    k = 48 7 114 110 144 99 82 28

    >> poly2sym(k)

    ans = 48*x⁷ + 7*x⁶ + 114*x⁵ + 110*x⁴ + 144*x³ + 99*x² + 82*x + 28

    >> [q,d]=polyder(u,v)

    q = -12 3 -30 -10 8 -29 -30 -4

    d = 4 4 17 32 60 76 106 120 100 48 9

    ```


    `p = polyfit(x,y,n)`, `[p,S] = polyfit(x,y,n)`, `[p,S,u] = polyfit(x,y,n)`

    拟合点云 `(x,y)` 的 `n` 次多项式。

    `n` 次多项式拟合点 `(x,y)`，方差为 `S`。

    `n` 次多项式拟合 `(x,y)` 点，拟合误差的方值为 `S`，均值为 `u`。


    ```

    >> u=[3 -1 4 2];v=[2 1 4 6];

    >> p=poly2sym(polyfit(u,v,3))

    p = (53*x³)/60 - (99*x²)/20 + (119*x)/30 + 54/5

    >> [p,S,u]=polyfit(u,v,3)

    p = 8.9050 1.6333 -11.3053 6.0000

    S = A: [4x4 double]. df: 0 normr: 1.2686e-014

    u = 2.0000 2.1602

    ```


    `y = polyval(p,x)`, `y = polyval(p,x,[],u)`, `[y,delta] = polyval(p,x,S)`, `[y,delta]
    = polyval(p,x,S,u)`

    在 `x` 处求多项式 `p`。

    在均值为 `u` 的 `x` 处求多项式 `p`。

    在方差为 `S` 的 `x` 处求多项式 `p`，结果误差为 `y ±delta`。

    在均值为 `u` 且方差为 `S` 的 `x` 处求多项式 `p`，结果误差为 `y ±delta`。


    ```

    >> p=[2 0 -1 7 9]

    p = 2 0 -1 7 9

    >> poly2sym(p)

    ans = 2*x⁴ - x² + 7*x + 9

    >> polyval(p,10)

    ans = 19979

    ```


    `Y = polyvalm(p,X)`

    在矩阵变量 `X` 处求多项式 `p`。


    ```

    >> X=[1 2 3;4 5 6;7 8 9]

    X = 1 2 3 4 5 6 7 8 9

    >> p=[2 0 -1 7 9]

    p = 2 0 -1 7 9

    >> A=polyval(p,X)

    A = 17 51 183 533 1269 2607 4811 8193 13113

    ```


    `[r,p,k] = residue(b,a)`, `[b,a] = residue(r,p,k)`

    给出有理展开 `b/a` 的残数、极点和直接项。

    将有理展开转换为多项式 `b` 和 `a`。


    ```

    >> u=[3 -1 4 2];v=[2 1 4 4 6 8 3];

    >> [r,p,k]=residue(v,u)

    r = 0.4751-0.6032i 0.3705+1.2240i -0.4076

    p = 0.6667 0.5556 0.6296

    >> [v,u]=residue(r,p)

    v = 0.6667 0.3333 1.3333 2.0000 2.6667

    ```


    `r = roots(c)`

    给出系数为 `c` 的多项式根的列向量 `r`。


    ```

    >> v=[0.6667 0.3333 1.3333 2.0000 2.6667];

    >> r=roots(v)

    r = 0.6662+1.4813i 0.6662-1.4813i 0.6662+0.8326i 0.6662-0.8326i -0.5000

    ```


    MATLAB 实现了用于多项式插值的代数和图形命令。下表展示了多项式插值最重要的命令。


    `Yi = interp1(X,Y)`, `Yi = interp1(Y,Xi)`, `Yi = interp1(X,Y,method)`, `Yi = interp1(X,Y,method,ext)`

    给出向量 `Yi`，其中 `(Xi,Yi)` 是通过点集 `(X,Y)` 的一维插值得到的点集。假设 `X=1:N`，其中 `N` 是 `Y` 的长度。使用指定的方法进行插值，方法可以是
    `nearest`（最近邻）、`linear`（线性）、`cubic`（三次）、`v5cubic`（五三次）和 `pchip`（Hermite 三次）。此外，对于插值
    `x` 范围外的值 `ext` 执行外推。

    在下面的示例中，根据函数 `y=sin(x)`，对等间距的 `x` 值对 20 个点 `(x,y)` 进行插值。


    ```

    >> x = 0:10; y = sin(x); xi = 0:.5:10;yi = interp1(x,y,xi); points=[xi'',yi''].

    points =

    0 0

    0.5000 0.4207

    1.0000 0.8415

    1.5000 0.8754

    2.0000 0.9093

    2.5000 0.5252

    3.0000 0.1411

    3.5000 -0.3078

    4.0000 -0.7568

    4.5000 -0.8579

    5.0000 -0.9589

    5.5000 -0.6192

    6.0000 -0.2794

    6.5000 0.1888

    7.0000 0.6570

    7.5000 0.8232

    8.0000 0.9894

    8.5000 0.7007

    9.0000 0.4121

    10.0000 -0.5440

    ```


    `Zi = interp2(X,Y,Z,Xi)`, `Zi = interp2(Z)`, `Zi = interp2(X,Y,Xi,method)`

    给出向量 `Zi`，其中 `(Xi,Yi)` 是通过点集 `(X,Y,Z)` 的二维插值得到的点集。假设 `X=1:n`, `Y=1:m` 且 `(n,m)
    = size(Z)`。进行 `n` 次二维递归插值。使用指定的方法进行插值。在下面的示例中，我们考虑了一组年份和工资，并尝试通过插值找到工作了 15 年的员工在
    1975 年赚取的工资。


    ```

    >> years = 1950:10:1990;

    services = 10:10:30;

    wages = [150,697 199,592 187,625 179,323 203,212 226,767 153,706 249,633 598,243];

    >> w = interp2(services,years,wages,15,1975)

    w = 190.6288

    ```


    `Vi = interp3(X,Y,Z,V,Xi,Yi,Zi)`, `Vi = interp3(V)`, `Vi = interp3(...,method)`

    给出向量 `Vi`，其中 `(Xi,Yi,Zi)` 是对点集 `(X,Y,Z)` 应用三维函数 `V` 后通过三维插值得到的点集。假设 `X=1:n, Y=1:m,
    Z=1:p` 且 `(n,m,p) = size(V)`。进行 `n` 次三维递归插值。使用指定的方法进行插值。在下面的示例中，根据预定义 MATLAB 函数
    `flower` 在 `x` 在 0.1 到 10 之间（间距为 0.5）以及 `y` 和 `z` 在 -3 到 3 之间（间距为 0.5）的取值点 `(x,y,z,t)`
    计算了三维插值的体积点矩阵 `w=f(x,y,z)` 并绘制。


    ```

    >> [x,y,z,v] = flow(10);

    [xi,yi,zi] = meshgrid(.1:.5:10,-3:.5:3,-3:.5:3);

    vi = interp3(x,y,z,v,xi,yi,zi);

    slice(xi,yi,zi,vi,[6 9.5],2,[-2 .2]), shading flat

    ```


