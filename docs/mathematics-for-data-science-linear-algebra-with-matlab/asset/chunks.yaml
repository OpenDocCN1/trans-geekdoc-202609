    # 4.4 SOLVING EQUATIONS AND SYSTEMS


    MATLAB provides multiple commands for solving equations and systems. The following
    sections present the syntax and characteristics of these methods.


    ## 4.4.1 General methods


    The following are the most common commands in MATLAB for solving equations and
    systems.


    `solve(''equation'',''x'')`

    Solve the equation in variable `x`.

    `solve(''sin(x) = r'')`

    `ans = asin(r/p) - asin(r/p)`


    `solve(''equation(x)'',x'')`

    Solve the equation `equation(x)=0` in variable `x`.

    `syms r; solve(''cos(x)=r'', x)`

    `ans = acos(r/p) - acos(r/p)`


    `solve(''ec1,ec2,...,en'',''x1,x2,...,xn'')`

    Solve `n` simultaneous equations `ec1``en` in the variables `x1` to `xn`.

    `syms x,y; solve(''x^2+y+y=3'',''x^2-4x+3=0'')`

    `x = 1/3`, `y = -3/2`


    `syms x1,x2...xn; solve(''ec1,ec2,...,en,x1,x2,...,xn'')`

    Solve `n` simultaneous equations `ec1` to `en` in the variables `x1` to `xn`.

    `syms x,y; solve([x^2+y+y-3, x^2-4x+3])`

    `x = 1/3`, `y = -3/2`


    `X = linsolve(A,B)`

    Solve `A*X=B` for a square matrix `A`, where `B` and `X` are matrices. We solve
    the system:

    `x + y + z + t = 1`

    `x + 2y + z + t = 2`

    `x + y + 2z + t = 3`

    `x + y + z + 2t = 4`

    ```matlab

    A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B=[1,2,3,4];

    linsolve(A,B)

    ans = -1 0 1 2

    ```


    `x = lscov(A,B)`, `x = lscov(A,B,V)`

    Solve `A*x=B` in least squares sense. Solve `A*x=B` in the least squares sense
    with error covariance matrix proportional to `V`. That is, give the vector `x`
    such that `Ax=b+e` with `e→N(0,V)`. Gives `x` (vector) that minimizes `(A*x-B)''*inv(V)*(A*x-B)`.

    ```matlab

    A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B=[1,2,3,4];

    lscov(A,B)

    ans = -1 0 1 2

    ```


    `X = A`

    Solve the system `A*X=B`.

    ```matlab

    A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B=[1,2,3,4];

    A

    ans = -1.0000 -0.0000 1.0000 2.0000

    ```


    `X = A/B`

    Solve the system.

