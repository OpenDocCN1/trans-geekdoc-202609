    # Interpolation Methods


    `Y = interpft(X,n)`, `y = interpft(x,n,dim)`

    Unidimensional interpolation using the FFT method. It gives the vector `Y` containing
    the values of the periodic function `X` sampled at `n` equally spaced points.
    The original vector `X` is transformed to the Fourier frequency domain using the
    fast Fourier transform `FFT`. Operates along the specified dimension. An example
    is presented where the original points are compared with the points interpolated
    through the FFT method.


    ```matlab

    y = [0:.5:2 1.5:-.5:-2 -1.5:.5:0]; % Equally spaced dots

    factor = 5; % Interpolation with a factor of 5

    m = length(y)*factor;

    x = 1:factor:m;

    xi = 1:m;

    yi = interpft(y,m);

    plot(x,y,''o'',xi,yi,''\*'')

    legend(''original data'',''interpolated data'')

    ```

    ![image](d2d_images/image118.png)


    `Vi = interpn(X,Y,Z,...V,Xi,Yi,Zi...)`

    `Vi = interpn(V,Xi,Yi,Zi)`, `Vi = interpn(V,n)`, `Vi = interpn(...,method)`

    Gives the vector `Vi` such that `(Xi,Yi, Zi,...)` is the total set of points found
    by `n`-dimensional interpolation of the set of points resulting from applying
    the three-dimensional function `V` to the points `(X,Y,Z,...)`. Assume `X=1:n`,
    `Y=1:m`, `Z=1:p,...` and `(n,m,p,...) = size of V`. Recursive `n`-dimensional
    interpolation `n` times. Interpolation using the specified methods.

    ![image](d2d_images/scene_break.png)


    `Yi = pchip(X,Y,Xi)`

    `pp = pchip(X,Y)`

    Gives the vector `Yi` such that `(Xi,Yi)` is the total set of points found by
    piecewise Hermite cubic polynomial interpolation (PCHIP) of the given set of points
    `(X,Y)`. Performs interpolation at intermediate points.


    `Yi = spline(X,Y,Xi)`

    `pp = spline(X,Y)`

    Gives the vector `Yi` such that `(Xi,Yi)` is the total set of points found by
    cubic spline interpolation of the given set of points `(X,Y)`. Performs interpolation
    at intermediate points. An example is presented where the original points are
    compared with the points interpolated via `pchip` and `spline` method.


    ```matlab

    x = -3:3;

    y = [-1 -1 -1 0 1 1 1];

    t = -3:.01:3;

    plot(x,y,''o'',t,[pchip(x,y,t); spline(x,y,t)])

    legend(''data'',''pchip'',''spline'',4)

    ```

    ![image](d2d_images/image079.png)


    `Zi = griddata(X,Y,Z,Xi,Yi)`

    `[Xi,Yi,Zi] = griddata(X,Y,Z,Xi,Yi)`, `[...] = griddata(...,method)`

    It fits a surface of the form `Z=f(X,Y)` in the space of vectors `(X,Y,Z)`. The
    vector `Zi` determines the interpolation points `(Xi,Yi,Zi)` between the given
    points `(X,Y,Z)`. An inverse distance method is used for interpolating. In addition
    to `Xi`, gives the row and column vectors `Yi` and `Zi`. Interpolation using the
    specified methods. The following is an example of an interpolation adjustment
    of a surface.


    ```matlab

    x = rand(100,1)*4-2; y = rand(100,1)*4-2;

    z = x.*exp(-x.^2-y.^2);

    ti = -2:.25:2;

    [xi,yi] = meshgrid(ti,ti);

    zi = griddata(x,y,z,xi,yi);

    mesh(xi,yi,zi), hold on, plot3(x,y,z,''o''), hold off

    ```

