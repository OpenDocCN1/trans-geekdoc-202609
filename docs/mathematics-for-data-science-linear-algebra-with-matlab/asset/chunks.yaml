    # 1.9.3 关系运算符


    ![image](img/chapter_title_below.png)


    MATLAB 还处理关系运算，该运算在两个数组之间执行逐元素比较，并返回相同大小的数组，如果相应的关系为真，则元素为 0；如果为假，则为 1。关系运算符还允许标量与向量或矩阵进行比较，在这种情况下，标量将与矩阵的所有元素进行比较。下表显示了
    MATLAB 关系运算符。


    | `<` | 小于（仅影响实部） >> `3<5` ans = 1 |

    | --- | --- |

    | `<=` | 小于等于（仅影响实部） >> `4<=6` ans = 0 |

    | `>` | 大于（仅影响实部） >> `X=3*ones(3,3)` `X = 3 3 3 3 3 3` >> `X>[1 2 3; 4 5 6; 2
    3]` ans = 1 1 0 0 0 0 |

    | `>=` | 大于等于（仅影响实部） >> `X>=[1 2 3; 4 5 6; 2 3]` ans = 1 1 1 0 0 1 |

    | `==` | 等于（涉及复数） >> `X==ones(3,3)` ans = 0 0 0 0 0 0 |

    | `~=` | 不等于（涉及复数） >> `X~=ones(3,3)` ans = 1 1 1 |

