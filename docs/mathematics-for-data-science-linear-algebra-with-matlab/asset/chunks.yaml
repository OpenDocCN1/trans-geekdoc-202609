    # 3.3 扭曲曲线 (WARPED CURVES)


    ![image](img/chapter_title_below.png)


    MATLAB 包含了允许你在三维空间中表示扭曲曲线的命令。其中最重要的命令列在下表中。


    | `plot3(X,Y,Z)` | 绘制点集 `(X,Y,Z)`，其中 `X`、`Y` 和 `Z` 是行向量。`X`、`Y` 和 `Z` 可以是参数坐标或相同维矩阵，在这种情况下，将为每个行三元组在相同坐标轴上绘制一个图。对于
    `X`、`Y` 和 `Z` 的复值，将忽略其虚部。 >>

    ```

    X = [0 1 1 2;1 1 2 2;0 0 1 1];

    Y = [1 1 1 1;1 0 1 0;0 0 0 0];

    Z = [1 1 1 1;1 0 1 0;0 0 0 0];

    plot3(X,Y,Z)

    ```

    ![image](img/image063.png) >>

    ```

    t=0:pi/100:20*pi;plot3 (2*sin(2*t),2*cos(2*t),4*t)

    ```

    ![image](img/image093.png) |

    | --- | --- |

    | `plot3(X,Y,Z,S)` | 使用 `S` 中定义的选项绘制 `(X,Y,Z)`。通常 `S` 由两个单引号内的数字组成，第一个设置绘图线条的颜色，第二个设置绘图时使用的字符。颜色和字符的可能值在解释
    `plot` 命令时已经描述过。 |

    | `plot3(X1,Y1,Z1,S1, X2,Y2,S2, X3,Y3,S3,...)` | 它在相同坐标轴上组合了为三元组 `(Xi,Yi,Zi)`
    定义的图形。这是在同一张图上表示多个函数的方法。 |

    | `fill3(X,Y,Z,C)` | 绘制紧凑的多边形，其顶点为列向量 `X`、`Y` 和 `Z` 的三元组 `(Xi,Yi,Zi)`。`C` 是一个与
    `X` 和 `Y` 维度相同的向量，包含每个点 `(Xi,Yi,Zi)` 的颜色 `Ci`。`Ci` 的值可以是 ''r'',''g'',''b'',''c'',''m'',''y'',''k''。如果
    `C` 是单个字符，多边形的所有点将将涂成该字符对应的颜色。如果 `X` 和 `Y` 维度相同，则将同时表示与每个列向量三元组 `(X.j,Y.j,Z.j)`
    对应的多个多边形。在这种情况下，`C` 可以是一个行向量，其元素 `Cj` 决定了与列向量三元组 `(X.j,Y.j,Z.j)` 对应的每个多边形的唯一颜色。`C`
    也可以是与 `X` 和 `Y` 维度相同的矩阵，在这种情况下，它的元素决定了多边形集合每个点 `(Xijk,Yijk,Zijk)` 的颜色。

    ```

    X = [0 1 1 2;1 1 2 2;0 0 1 1];

    Y = [1 1 1 1;1 0 1 0;0 0 0 0];

    Z = [1 1 1 1;1 0 1 0;0 0 0 0];

    C = [0.5000 1.0000 1.0000 0.5000; 1.0000 0.5000 0.5000 0.1667; 0.3330 0.3330 0.5000
    0.5000];

    fill3(X,Y,Z,C)

    ```

