    -0.5714  0.2857 -0.1667 -0.0476  0.1429 0 0.1429` |


    # 1.8 RANDOM NUMBERS


    MATLAB incorporates functions that make it possible to work with random numbers
    in a simple way. The `rand` and `randn` functions are the basic functions that
    generate uniformly and normally distributed random numbers respectively. The following
    are the most common functions for working with random numbers.


    | `rand` | Returns a random decimal number uniformly distributed over the interval
    `[0,1]` | `>> rand` `ans = 0.8147` |

    | `rand(n)` | Returns a matrix of dimension `n` whose elements are random decimal
    numbers uniformly distributed in the interval `[0,1]` | `>> rand(3)` `ans = 0.9058
    0.6324 0.5469  0.1270 0.0975 0.9575  0.9134 0.2785 0.9649` |

    | `rand(m,n)` | Returns a matrix of dimension `mxn` whose elements are random
    decimal numbers uniformly distributed in the interval `[0,1]` | `>> rand(2,3)`
    `ans = 0.1576 0.9572 0.8003  0.9706 0.4854 0.1419` |

    | `rand(size(A))` | Returns a matrix of the same size as the matrix `A` whose
    elements are random decimal numbers uniformly distributed in the interval `[0,1]`
    | `>> rand(size(3))` `ans = 0.4218 0.9595 0.8491  0.9157 0.6557 0.9340  0.7922
    0.0357 0.6787` |

    | `rand(''seed'')` | Returns the current value of the uniform number generator
    generator | `>> rand(''seed'')` `ans = 93116785` |

    | `rand(''seed'',n)` | Place in quantity `n` the current value of the uniform
    number generator seed | `>> rand(''seed'')` `ans = 93116785` `>> rand(''seed'',1000)`
    `ans = 1000` |

    | `randn` | Returns a random decimal number distributed to a normal distribution
    of mean 0 and variance 1 | `>> randn` `ans = -0.4326` |

    | `randn(n)` | Returns a matrix of dimension `n` whose elements are random decimal
    numbers distributed to a normal of mean 0 and variance 1 | `>> randn(3)` `ans
    = -1.6656 -1.1465 -0.0376  0.1253 1.1909 0.3273  0.2877 1.1892 0.1746` |

    | `randn(m,n)` | Returns a matrix of dimension `mxn` whose elements are random
    decimal numbers distributed to a normal of mean 0 and variance 1 | `>> randn(2,3)`
    `ans = -0.1867 -0.5883 -0.1364  0.7258 2.1832 0.1139` |

    | `randn(size(A))` | Returns a matrix of the same size as the matrix `A` whose
    elements are random decimal numbers distributed to a normal of mean 0 and variance
    1 | `>> randn(size(3))` `ans = 1.0668 -0.8323 0.7143  0.0593 0.2944 1.6236  -0.0956
    -1.3362 -0.6918` |

    | `randn(''seed'')` | Returns the current value of the normal number generator
    seed | `>> randn(''seed'')` `ans = 93116785` |

    | `randn(''seed'',n)` | Place in quantity `n` the current value of the uniform
    number generator seed | `>> randn(''seed'',1000)` `ans = 1000` |


    # 1.9 OPERATORS


    MATLAB is a language that incorporates arithmetic, logical and relational operators
    in the same way as any other language. The following is a list of the types of
    operators cited within the scope of the MATLAB language.


    # 1.9.1 Arithmetic operators


    MATLAB incorporates the usual arithmetic operators (addition, subtraction, multiplication
    and division) for working with numbers. But the same time it extends the meaning
    of these operators to work with scalars, vectors and matrices, as shown below:


    | Operator | Role |

    | :--- | :--- |

    | `+` | Sum of scalars, vectors or matrices `A=[1 3 -2 6];B=[4 -5 8]; c=3;` `>>
    V1=A+c` `V1 = 4 6 9` `>> V2=A+B` `V2 = 5 -2 8` |

    | `-` | Subtraction of scalars, vectors or matrices `>> V3=A-c` `V3 = -2 0 -5`
    `>> V4=A-B` `V4 = -3 8 -10 4` |

    | `\*` | Product of scalars or of matrices or of scalars by vectors `>> V3=A\*c`
    `V3 = 3 9 -6 18` |

    | `.\*` | Product of scalars or element-by-element vectors `>> V4=A.\*B` `V4 =
    4 -15 -16 12` |

    | `.^` | Power of vectors (`A.^B = [A(i,j) ^ B(i,j)]`, A and B vectors) `>> V6=A.^B`
    `V6 = 1.0000 0.0041 256.0000 36.0000` `>> A.^c` `ans = 1 27 -8 216` `>> c.^A`
    `ans = 3.0000 27.0000 0.1111 729.0000` |

    | `./` | `A./B = [A(i,j)/B(i,j)]`, where A and B are vectors `[dim(A)=dim(B)]`
    `>> V7=A./B` `V7 = 0.2500 -0.6000 -0.2500 3.0000` |

    | `.\\` | `A.B = [B(i,j)/A(i,j)]`, where A and B are vectors `[dim(A)=dim(B)]`
    `>> V8=A.B` `V8 = 4.0000 -1.6667 -4.0000 0.3333` |

