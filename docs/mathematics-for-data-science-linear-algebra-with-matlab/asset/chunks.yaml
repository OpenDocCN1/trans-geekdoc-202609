    | | |

    | Try to solve the system `Ax=b` by the generalised minimum residual method. |
    Solve `Ax=b` specifying the tolerance | Solve `Ax=b` specifying tolerance and
    maximum number of iterations | Solve the system `inv(M)*A*x = inv(M)*b` | Solve
