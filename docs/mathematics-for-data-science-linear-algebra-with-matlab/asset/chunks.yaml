    MATLAB 允许你处理向量甚至矩阵复数变量函数。不要忘记，这些函数对于实变量也是有效的，因为实数是虚部为零的复数的特殊情况。下表包含了 MATLAB 的特定的向量复数变量函数。稍后介绍矩阵复数变量函数时，我们将看到它们也适用于向量变量，因为向量是矩阵的特殊情况。


    | 函数 | 描述与示例 |

    | :--- | :--- |

    | `max(V)` | 最大分量（复数计算 `max(abs(V))`） >> `max([1-i 1+i 3-5i 6i]) ans = 0 + 6.0000i`
    >> `max([1, 0, -23, 12, 16]) ans = 16` |

    | `min(V)` | 最小分量（对于复数计算 `min(abs(V))`） >> `min([1-i 1+i 3-5i 6i]) ans = 1. -
    1.0000i` >> `min([1, 0, -23, 12, 16]) ans = -23` |

    | `mean(V)` | V 的分量的平均值 >> `mean([1-i 1+i 3-5i 6i]) ans = 1.2500 + 0.2500i` >>
    `mean([1, 0, -23, 12, 16]) ans = 1.2000` |

    | `median(V)` | V 的分量的位数 >> `median([1-i 1+i 3-5i 6i]) ans = 2.0000 - 2.0000i`
    >> `median([1, 0, -23, 12, 16]) ans = 1` |

    | `std(V)` | V 的分量的标准差 >> `std([1-i 1+i 3-5i 6i]) ans = 4.7434` >> `std([1, 0,
    -23, 12, 16]) ans = 15.1888` |

    | `sort(V)` | 按升序排列 V 的分量。对于复数，根据绝对值排序。 >> `sort([1-i 1+i 3-5i 6i]) ans = Columns
    1 through 2 1.0000 - 1.0000i 1.0000 + 1.0000i Columns 3 through 4 3.0000 - 5.0000i
    0 + 6.0000i` >> `sort([1, 0, -23, 12, 16]) ans = -23 0 1 12 16` |

    | `sum(V)` | V 的分量的和 >> `sum([1-i 1+i 3-5i 6i]) ans = 5.0000 + 1.0000i` >> `sum([1,
    0, -23, 12, 16]) ans = 6` |

    | `prod(V)` | 乘 V 的元素，使得 `n ! != prod(1:n)` >> `prod([1-i 1+i 3-5i 6i]) ans =
    60.0000 +36.0000i` >> `prod([1, 0, -23, 12, 16]) ans = 0` |

    | `cumsum(V)` | 给 V 的累积和向量 >> `cumsum([1-i 1+i 3-5i 6i]) ans = Columns 1 through
    2 1.0000 - 1.0000i 2.0000 Columns 3 through 4 5.0000 - 5.0000i 5.0000 + 1.0000i`
    >> `cumsum([1, 0, -23, 12, 16]) ans = 1 1 -22 -10 6` |

    | `cumprod(V)` | 给 V 的累积积向量 >> `cumprod([1-i 1+i 3-5i 6i]) ans = Columns 1 through
    2 1.0000 - 1.0000i 2.0000 Columns 3 through 4 6.0000 -10.0000i 60.0000 +36.0000i`
    >> `cumprod([1, 0, -23, 12, 16]) ans = 1 0 0 0 0` |

    | `diff(V)` | 给 V 分量的一阶差分向量 (`V t-1`) >> `diff([1-i 1+i 3-5i 6i]) ans = 0 + 2.0000i
    2.0000 - 6.0000i +11.000i` >> `diff([1, 0, -23, 12, 16]) ans = -23 35 4` |

    | `gradient(V)` | 近似 V 的梯度 >> `gradient([1-i 1+i 3-5i 6i]) ans = Columns 1 through
    3 0 + 2.0000i 1.0000 -0.5000 +2.5000i Column 4 -3.0000 +11.000i` >> `gradient([1,
    0, -23, 12, 16]) ans = -1.0000 -12.0000 19.0000 4.0` |

    | `del2(V)` | V 的拉普拉斯（离散点） >> `del2([1-i 1+i 3-5i 6i]) ans = Columns 1 through
    3 2.2500 - 8.2500i 0.5000 - 2.0000i -1.2500 + 4.2500i Column 4 -3.0000 +10.5000i`
    >> `del2([1, 0, -23, 12, 16]) ans = -25.5000 -5.5000 14.5000 -7.7500` |

    | `fft(V)` | V 的离里叶变换 >> `fft([1-i 1+i 3-5i 6i]) ans = Columns 1 through 3 5.0000
    + 1.0000i -7.0000 + 3.0000i 3.0000 -13.0000i Column 4 3.0000 + 5.0000i` >> `fft([1,
    0, -23, 12, 16]) ans = Columns 1 through 3 6.0000 14.8435+35.7894i -15.4435 -23.8824i
    Columns 4 through 5 -15.3435+23.8824i` |

    | `fft2(V)` | V 的二维离里叶变换 >> `fft2([1-i 1+i 3-5i 6i]) ans = Columns 1 through 3
    5.0000 + 1.0000i -7.0000 + 3.0000i 3.0000 -13.0000i Column 4 3.0000 + 5.0000i`
    >> `fft2([1, 0, -23, 12, 16]) ans = Columns 1 through 3 6.0000 14.8435+35.7894i
    -15.4435 -23.8824i Columns 4 through 5 -15.3435+23.8824i` |

    | `ifft(V)` | V 的离散里叶逆变换 >> `ifft([1-i 1+i 3-5i 6i]) ans = Columns 1 through 3
    1.2500 + 0.2500i 0.7500 + 1.2500i 0.7500 - 3.2500i Column 4 -1.7500 + 0.7500i`
