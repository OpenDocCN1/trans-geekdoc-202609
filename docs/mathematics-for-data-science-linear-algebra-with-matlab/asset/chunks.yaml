    # 1.9.2 Logical operators


    ![image](d2d_images/chapter_title_below.png)


    MATLAB also incorporates the usual logical operators using the most common notation
    for them. Typically, the results of the logical operators are 1 if true and 0
    if false. The following table shows these operators.


    | `~A` | `||` | Logical negation (NOT) or complementary of `A` >> `not(2>3)` ans
    = 1 |

    | --- | --- | --- |

    | `A & B` | `||` | Logical conjunction (AND) or intersection of `A` and `B` >>
    `(2>3) & (5>1)` ans = 0 |

    | `A | B` | `||` | Logical disjunction (OR) or union of `A` and `B` >> `(2>3)||(5>1)`
    ans = 1 |

    | `xor(A,B)` | `||` | Exclusive OR (XOR) or symmetrical difference of `A` and
    `B` (worth 1 if either `A` or `B`, but not both, are 1) >> `xor((2>3),(5>1))`
    ans = 1 |

    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |

