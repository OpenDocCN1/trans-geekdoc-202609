    ## BASIC FUNCTIONS WITH ARGUMENT A COMPLEX MATRIX


    The functions in the previous table also admit a complex matrix `Z` as an argument,
    in which case the result is a row vector whose components are the results of applying
    the function to each column of the matrix. Let us not forget that these functions
    are also valid for real variables, since real numbers are a particular case of
    complex numbers with zero imaginary part.


    `max(Z)` Vector with the largest components (for complexes `max(abs(Z))`) of each
    column of the matrix `Z` is calculated. >> `Z=[1-i 3i 5;-1+i 0 2i;6-5i 8i] Z =
    6.0000 - 5.0000i 0 + 8.0000i 5.0000 -12.0000i` >> `Z1=[1 3 5;-1 0 2;6 8 -7] Z1
    = 1 3 5 -1 0 2 6 8 -7 >> max(Z1) ans = 6 8 5`


    `min(Z)` Vector with the smallest components (for complexes `min(abs(Z))`) of
    each column of the matrix `Z` is calculated. >> `min(Z) ans = 1.0000 - 1.0000i
    0 0 0 + 2.0000i` >> `min(Z1) ans = -1 0 -7`


    `mean(Z)` Vector of averages of the column components of Z >> `mean(Z) ans = 2.0000
    - 1.6667i 0 + 3.6667i -0.6667 - 1.3333i` >> `mean(Z1) ans = 2.0000 3.6667 0`


    `median(Z)` Vector of medians of the components of the columns of Z >> `median(Z)
    ans = -1.0000 + 1.0000i 0 + 3.0000i -7.0000 + 6.0000i` >> `median(Z1) ans = 1
    3 2`


    `std(Z)` Vector of standard deviations of the column components of Z >> `std(Z)
    ans = 4.7258 4.0415 11.2101` >> `std(Z1) ans = 3.6056 4.0415 6.2450`


    `sort(Z)` Sorts the components of the columns of Z in ascending order. For complexes
    it sorts according to absolute values. >> `sort(Z) ans = 1.0000 - 1.0000i 0 0
    0 + 2.0000i -1.0000 + 1.0000i 0 + 3.0000i -7.0000 + 6.0000i 6.0000 - 5.0000i 0
    + 8.0000i 5.0000 -12.0000i` >> `sort(Z1) ans = -1 0 -7 1 3 2 6 8 5`


    `sum(Z)` Vector with the sum of the columns of the matrix Z >> `sum(Z) ans = 6.0000
    - 5.0000i 0 +11.0000i -2.0000 - 4.0000i` >> `sum(Z1) ans = 6 11 0`


    `prod(Z)` Vector with the products of the column elements of Z >> `prod(Z) ans
    = 1.0e+02 * 0.1000 + 0.1200i 0 -2.2800 + 0.7400i` >> `prod(Z1) ans = -6 0 -70`


    `cumsum(Z)` Gives the matrix of cumulative sums of the columns of Z >> `cumsum(Z)
    ans = 1.0000 - 1.0000i 0 + 3.0000i 5.0000 -12.0000i 0 0 0 + 3.0000i 5.0000 -10.0000i
    6.0000 - 5.0000i 0 +11.0000i -2.0000 - 4.0000i` >> `cumsum(Z1) ans = 1 3 5 0 3
    7 6 11 0`

