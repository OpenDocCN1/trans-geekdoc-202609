    ```matlab

    >> A=1:9,B=10-A,Y=A>4,Z=B-(A>2)

    A =

    1 2 3 4 5 6 7 8 9

    B =

    9 8 7 6 5 4 3 2 1

    Y =

    0 0 0 0 1 1 1 1 1

    Z =

    9 8 6 5 4 3 2 1 0

    ```


