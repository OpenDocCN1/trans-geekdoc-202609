- fmt: "\n### Graphics Commands\n\n- `plottyy(X1,Y1,X2,Y2)`\n- `plottyy(X1,Y1,X2,Y2,\
    \ 'function')`\n- `plottyy(X1,Y1,X2,Y2, 'function1','function2')`\n  Label the\
    \ graph of `X1` versus `Y1` on the left, and the graph of `X2` versus `Y2` on\
    \ the right. Same as the previous command, but the function can be `plot`, `loglog`,\
    \ `semilogx`, `semilogy`, `item` or any `h=function(x,y)`. Same as the previous\
    \ command, but using each function `fi` for the pair `(XiYi)`.\n\n- `axis([xmin\
    \ xmax ymin ymax zmin zmax])`\n  It places the variation intervals of the axes\
    \ at the indicated values. It also accepts the options `'ij'`, `'square'`, `'equal'`,\
    \ etc, identical to those already seen for two dimensions.\n\n- `view([x,y,z])`\n\
    \  Places the point of view of the figure at the Cartesian coordinate point `(x,y,z)`.\n\
    \n- `view([az, el])`\n  Places the angle of view of the figure at the point of\
    \ azimuth (horizontal rotation) `'az'` and elevation (vertical elevation) `'el'`.\n\
    \n- `hidden`\n  Controls the presence of hidden lines in the chart. Hidden lines\
    \ appear with `hidden on` and disappear with `hidden off`.\n\n- `shading`\n  Controls\
    \ the type of shading of a surface created with the `surf`, `mesh`, `pcolor`,\
    \ `fill` and `fill3` commands. The `shading flat` option sets a smooth shading,\
    \ the `shading interp` option sets a dense shading and the `shading faceted` option\
    \ (default option) sets a normal shading.\n\n- `colormap(M)`\n  It places the\
    \ matrix `M` as the current colour map. `M` must have three columns and contain\
    \ values only between 0 and 1. It can also be a matrix whose rows are RGB vectors\
    \ of the type `[r g b]`. There are already defined matrices `M` in MATLAB, which\
    \ are: `bone(p)`, `contrast(p)`, `cool(p)`, `copper(p)`, `flag(p)`, `gray(p)`,\
    \ `hsv(p)`, `hot(p)`, `jet(p)`, `pink(p)`, `prism(p)` and `white(p)`. All matrices\
    \ have 3 columns and `p` rows. For example, the syntax `colormap(hot(8))` sets\
    \ the `hot(8)` matrix as the current colourmap (the complete colour system of\
    \ the current figure).\n\n- `brighten(p)`\n  Adjusts the illumination of the figure.\
    \ If `0<p<1`, the figure will be bright, and if `-1<p<0`, the figure will be dark.\
    \ The variation of `p` is the interval `(-1,1)`, and as values of `p` approach\
    \ `-1`, the figure becomes darker, while as values of `p` approach `1`, the figure\
    \ becomes brighter.\n\n- `image(A)`\n  It produces a two-dimensional image with\
    \ brightnesses proportional to the elements of the matrix `A`, and is used to\
    \ display photographs and drawings adapted to the brightnesses given in the matrix\
    \ `A`. Each element `(m,n)` of the matrix `A` affects one cell of the drawing.\n\
    \n- `pcolor(A)`\n  It produces a two-dimensional figure with colours proportional\
    \ to the elements of the matrix `A`, and is used to display abstract mathematical\
    \ objects with varying colours. Each element `(m,n)` of the matrix `A` affects\
    \ a grid of the figure.\n\n- `caxis([cmin cmax])`\n  Places the minimum and maximum\
    \ values of the colour scale (defined by `colormap` and intrinsically related\
    \ to the divisions made on the axes, via the grids) for a chart. Therefore, it\
    \ allows to use only a subset of colours of the one defined by `colormap` for\
    \ the figure.\n\n- `figure(h)` or `h=figure`\n  Creates the figure as an object\
    \ of name `h`, and places it as an ordinary figure. The command `gcf(h)` is used\
    \ to refer any property to the figure `h`. The `close(h)` command closes the figure\
    \ `h`. The command `whitebg(h)` changes the background colour of the figure `h`.\
    \ The `clf` command closes the current figure. The `graymon` command sets the\
    \ grayscale. The command `newplot` determines the axes to make a new figure. The\
    \ `refresh` command redraws the figure.\n\n- `axes(e)` or `e=axes`\n  Creates\
    \ the axes as an object with name `e` in the current figure. The command `gca(e)`\
    \ is used to refer any property to the axes `e`. The command `cla` is used to\
    \ delete all objects referring to the current axes.\n\n- `l=line(x,y)` or `l=line(x,y,z)`\n\
    \  Creates, as an object of name `l`, the line joining the points `(X,Y)` in the\
    \ plane or `(X,Y,Z)` in space.\n\n- `p=patch(X,Y,C)` or `patch(X,Y,Z,C)`\n  Creates\
    \ an opaque polygonal area that is defined by the set of points `(X,Y)` in the\
    \ plane or `(X,Y,Z)` in space, and whose colour is given by `C`, as an object\
    \ of name `p`.\n\n- `s=surface(X,Y,Z,C)`\n  Creates the parametric surface defined\
    \ by `X`, `Y` and `Z` and whose colour is given by `C` as an object name `s`.\n\
    \n- `i=image(C)`\n  Creates the image by the given colours in the matrix `C` as\
    \ an object name `i`.\n\n- `t=text(x,y,'string')` or `t=text(x,y,z,'string')`\n\
    \  Creates the text defined by the string, located at point `(x,y)` in the plane,\
    \ or at point `(x,y,z)` in space.\n\n- `set(h, 'property1', 'property2', ...)`\n\
    \  Places the specified properties on the `h` object (`gca` for axis, `gcf` for\
    \ colours, `gcbo`, `gcbd`, etc.).\n\n- `get(h, 'property')`\n  Returns the current\
    \ value of the given property for the object `h`.\n\n- `object=gco`\n  Returns\
    \ the current object of the current figure.\n\n- `rotate(h, [a, e], [p,r])`\n\
    \  Rotate the object `h` an angle `α`, along the azimuthal axes `a` and elevation\
    \ `e`, the origin being the point `(p,q)`.\n\n- `reset(h)`\n  Updates all properties\
    \ assigned to the object `h` and sets its default properties.\n\n- `delete(h)`\n\
    \  Deletes the object `h`.\n\n### MATLAB Properties\n\n| Object | Properties |\
    \ Possible values |\n| :--- | :--- | :--- |\n| **Figure** | Colour (background\
    \ colour) | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`, `'b'`, `'k'` |\n| | ColorMap (map\
    \ colour) | `hot(p)`, `gray(p)`, `pink(p)`, .... |\n| | Position (position on\
    \ screen) | `[left, bottom, width, height]` |\n| | Name | chain with the name\
    \ |\n| | MinColorMap (of colour) | minimum number of colours for the map |\n|\
    \ | NextPlot (next plot mode) | `new`, `add`, `replace` |\n| | NumberTitle (in\
    \ figure) | `on`, `off` |\n| | Units (units of measurement) | `pixels`, `inches`,\
    \ `points` |\n| | Resize (figure size with mouse) | `on` (can be changed), `off`\
    \ (no) |\n| **Axes** | Box (for the graphic) | `on`, `off` |\n| | Colour (colour\
    \ of axles) | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`, `'b'`, `'k'` |\n| | GridLineStyle\
    \ (line for mesh) | `'-'`, `'—'`, `':'`, `'-.'` |\n| | Position (position on screen)\
    \ | `[left, bottom, width, height]` |\n| | TickLength (length between tick marks)\
    \ | a numerical value |\n| | TickDir (tick address) | `in`, `out` |\n| | Units\
    \ (units of measurement) | `pixels`, `inches`, `points` |\n| | View | `[azimuth,\
    \ elevation]` [azimuth, elevation] |\n| | FontAngle (font angle) | `normal`, `italic`,\
    \ `oblique` |\n| | FontName (font name) | text with the name of the source |\n\
    | | FontSize | numerical value |\n| | FontWeight (font weight) | `light`, `normal`,\
    \ `demi`, `bold` |\n| | DrawMode (drawing mode) | `normal`, `fast` |\n| | Xcolor,\
    \ Ycolor, Zcolor (colour axes) | `[min, max]` `[min, max]` `[min, max]` `[min,\
    \ max]` `[min, max]` `[min, max]` |\n| | XDir, YDir, ZDir (axis direction) | `normal`\
    \ (they grow from left to right), `reverse` |\n| | XGrid, YGrid, Zgrid (grids)\
    \ | `on`, `off` |\n| | XLabel, YLabel, Zlabel (labels) | string with the text\
    \ of the tags |\n| | XLim, YLim, Zlim (limit values) | `[min, max]` (range of\
    \ variation) |\n| | XScale, YScale, ZScale (scales) | `linear` (linear), `log`\
    \ (logarithmic) |\n| | XTick, YTick, ZTick (marks) | `[m1,m2,...]` (location of\
    \ marks on axis) |\n| **Line** | Colour (line colour) | `'y'`, `'m'`, `'c'`, `'r'`,\
    \ `'g'`, `'b'`, `'w'`, `'k'` |\n| | LineStyle (line style) | `'-'`, `'—'`, `':'`,\
    \ `'-.'`, `+`, `'*'`, `.` , `'x'` |\n| | LineWidth (line width) | numerical value\
    \ |\n| | Visible (visible or not visible line on screen) | `on`, `off` |\n"
