    # 4.5 Symmetric and non-negative least squares


    The following are commands provided by MATLAB for solving equations and systems
    by symmetric and non-negative least squares methods. We have studied equations
    and systems in general. To work in this field it is possible to use the commands
    we have seen so far, but MATLAB dedicates specific commands for them.


    ## gmres


    | `x = gmres(A,b)` | `gmres(A,b,tol)` | `gmres(A,b,tol,maxit)` | `gmres(A,b,tol,maxit,M)`
    | `gmres(A,b,tol,maxit,M1,M2)` | `gmres(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = gmres(A,b,...)`
