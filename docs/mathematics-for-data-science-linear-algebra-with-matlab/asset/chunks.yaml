    ## 2.2.4 Specific complex variable functions


    ![image](d2d_images/chapter_title_below.png)


    MATLAB incorporates a group of complex variable functions specifically for working
    with modules, arguments, and real and imaginary parts. These functions include
    the following:


    | Function | Meaning |

    | --- | --- |

    | `abs(Z)` | Z-complex module >> `abs(12.425-8.263i)` `ans = 14.9217` |

    | `angle(Z)` | Z-complex argument >> `angle(12.425-8.263i)` `ans = -0.5869` |

    | `conj(Z)` | Z-complex conjugate >> `conj(12.425-8.263i)` `ans = 12.425 + 8.263i`
    |

    | `real(Z)` | Real part of complex Z >> `real(12.425-8.263i)` `ans = 12.425` |

    | `imag(Z)` | Imaginary part of complex Z >> `imag(12.425-8.263i)` `ans = -8.263`
    |

    | `floor(Z)` | Applies the floor function to `real(Z)` and `imag(Z)` >> `floor(12.425-8.263i)`
    `ans = 12.0000 - 9.0000i` |

    | `ceil(Z)` | Applies the ceil function to `real(Z)` and `imag(Z)` >> `ceil(12.425-8.263i)`
    `ans = 13.0000 - 8.0000i` |

    | `round(Z)` | Applies round function to `real(Z)` and `imag(Z)` >> `round(12.425-8.263i)`
    `ans = 12.0000 - 8.0000i` |

    | `fix(Z)` | Applies fix function to `real(Z)` and `imag(Z)` >> `fix(12.425-8.263i)`
    `ans = 12.0000 - 8.0000i` |


