    | `variable=[a:b]` | 定义一个第一个和最后一个元素分别为 `a` 和 `b` 的向量，其之间的元素相差一单位 | `vector1=[2:6]`
    `vector1 = 2 3 4 5 6` |

    | --- | --- |

    | `variable=[a:s:b]` | 定义一个第一个和最后一个元素分别为 `a` 和 `b` 的向量，其之间的元素相差指定的增量 `s` | `vector2=[2:2:8]`
    `vector2 = 2 4 6 8` |

    | `variable=linspace[a,b]` | 定义一个第一个和最后一个元素为 `a` 和 `b` 且共有 `n` 个均匀间隔元素的向量 | `vector3=linspace(10,30,6)`
    `vector3 = 10 14 18 22 26 30` |

