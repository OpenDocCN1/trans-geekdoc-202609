    # 1.8 随机数


    MATLAB 包含了许多使其能够简单地处理随机数的函数。`rand` 和 `randn` 分别是生成均匀分布和正态分布随机数的基础函数。以下是处理随机数最常用的函数。


    | `rand` | 返回一个在 `[0,1]` 间内均匀分布的随机小数 | `>> rand` `ans = 0.8147` |

    | `rand(n)` | 返回一个维度为 `n` 的矩阵，其元素为在 `[0,1]` 间内均匀分布的随机小数 | `>> rand(3)` `ans =
    0.9058 0.6324 0.5469  0.1270 0.0975 0.9575  0.9134 0.2785 0.9649` |

    | `rand(m,n)` | 返回一个 `mxn` 阶矩阵，其元素为在 `[0,1]` 间内均匀分布的随机小数 | `>> rand(2,3)` `ans
    = 0.1576 0.9572 0.8003  0.9706 0.4854 0.1419` |

    | `rand(size(A))` | 返回一个与矩阵 `A` 相同的矩阵，其元素为在 `[0,1]` 间内均匀分布的随机小数 | `>> rand(size(3))`
    `ans = 0.4218 0.9595 0.8491  0.9157 0.6557 0.9340  0.7922 0.0357 0.6787` |

    | `rand(''seed'')` | 返回随机数生成器的当前值 | `>> rand(''seed'')` `ans = 93116785` |

    | `rand(''seed'',n)` | 将随机数生成器的当前值设置为 `n` | `>> rand(''seed'')` `ans = 93116785`
    `>> rand(''seed'',1000)` `ans = 1000` |

    | `randn` | 返回一个符合均值为 0、方差为 1 的正态分布的随机小数 | `>> randn` `ans = -0.4326` |

    | `randn(n)` | 返回一个维度为 `n` 的矩阵，其元素为符合均值为 0、方差为 1 的正态分布的随机小数 | `>> randn(3)` `ans
    = -1.6656 -1.1465 -0.0376  0.1253 1.1909 0.3273  0.2877 1.1892 0.1746` |

    | `randn(m,n)` | 返回一个 `mxn` 阶矩阵，其元素为符合均值为 0、方差为 1 的正态分布的随机小数 | `>> randn(2,3)`
    `ans = -0.1867 -0.5883 -0.1364  0.7258 2.1832 0.1139` |

    | `randn(size(A))` | 返回一个与矩阵 `A` 相同的矩阵，其元素为符合均值为 0、方差为 1 的正态分布的随机小数 | `>> randn(size(3))`
    `ans = 1.0668 -0.8323 0.7143  0.0593 0.2944 1.6236  -0.0956 -1.3362 -0.6918` |

    | `randn(''seed'')` | 返回正态数生成器的当前值 | `>> randn(''seed'')` `ans = 93116785` |

