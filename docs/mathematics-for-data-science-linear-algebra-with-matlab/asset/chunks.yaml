    MATLAB implements specific commands, both algebraic and graphical, for working
    with polynomial interpolation. The following table presents the syntax and examples
    of the most important commands for polynomial interpolation.


    `Yi = interp1(X,Y,Xi)`, `Yi = interp1(Y,Xi)`, `Yi = interp1(X,Y,Xi,method)`, `Yi
    = interp1(X,Y,Xi,method,ext)`

    Gives the vector `Yi` such that `(Xi,Yi)` is the total set of points found by
    one-dimensional interpolation of the given set of points `(X,Y)`.

    Assume that `X=1:N`, where `N` is the length of `Y`.

    Performs interpolation using the given method, which can be `nearest` (nearest
    neighbour), `linear`, `cubic` (Hermite cubic), `v5cubic` (MATLAB 5 cubic), `spline`
    and `pchip` (Hermite cubic). Additionally, it performs extrapolation for the value
    of `x=ext` external to the range of `x` used for interpolation.

    In the following example, 20 points `(x,y)` are interpolated according to the
    function `y=sin(x)` for equally spaced values of `x` between 0 and 10.


    ```

    >> x = 0:10; y = sin(x); xi = 0:.5:10;yi = interp1(x,y,xi); points=[xi'',yi''].

    points =

    0 0

    0.5000 0.4207

    1.0000 0.8415

    1.5000 0.8754

    2.0000 0.9093

    2.5000 0.5252

    3.0000 0.1411

    3.5000 -0.3078

    4.0000 -0.7568

    4.5000 -0.8579

    5.0000 -0.9589

    5.5000 -0.6192

    6.0000 -0.2794

    6.5000 0.1888

    7.0000 0.6570

    7.5000 0.8232

    8.0000 0.9894

    8.5000 0.7007

    9.0000 0.4121

    9.5000 -0.0660

    10.0000 -0.5440

    ```


    `Zi = interp2(X,Y,Z,Xi)`, `Zi = interp2(Z)`, `Zi = interp2(X,Y,Xi,method)`

    Gives the vector `Zi` such that `(Xi,Yi)` is the total set of points found by
    two-dimensional interpolation of the set of points `(X,Y,Z)`.

    Assume that `X=1:n`, `Y=1:m` and `(n,m) = size of Z`.

    Two-dimensional recursive interpolation `n` times. Interpolation using the specified
    methods.

    In the following example we consider a set of years, salaries and try to find
    by interpolation the salary earned in 1975 by an employee with 15 years of service.


    ```

    >> years = 1950:10:1990;

    services = 10:10:30;

    wages = [150,697 199,592 187,625 179,323 203,212 226,767 153,706 249,633 598,243];

    >> w = interp2(services,years,wages,15,1975)

    w = 190.6288

    ```


    `Vi = interp3(X,Y,Z,V,Xi,Yi,Zi)`, `Vi = interp3(V)`, `Vi = interp3(...,method)`

    Gives the vector `Vi` such that `(Xi,Yi,Zi)` is the total set of points found
    by three-dimensional interpolation of the set of points resulting from applying
    the three-dimensional function `V` to the points `(X,Y,Z)`.

    Assume that `X=1:n, Y=1:m, Z=1:p` and `(n,m,p) = size of V`.

    Three-dimensional recursive interpolation `n` times. Interpolation using the specified
    methods.

    In the following example, the volumetric point matrix `w=f(x,y,z)` of three-dimensional
    interpolation between the points `(x,y,z,t)` given by the values taken by the
    predefined MATLAB function `flower` for values of `x` between 0.1 and 10 half
    a point apart and for values of `y` and `z` between -3 and 3 half a point apart
    is calculated and plotted.


    ```

    >> [x,y,z,v] = flow(10);

    [xi,yi,zi] = meshgrid(.1:.5:10,-3:.5:3,-3:.5:3);

    vi = interp3(x,y,z,v,xi,yi,zi);

    slice(xi,yi,zi,vi,[6 9.5],2,[-2 .2]), shading flat

    ```

