    # 5. Vector Spaces, Linear Applications and Quadratic Forms


    The commands presented above allow you to work with vector spaces, linear applications
    and quadratic forms. It will be possible to work with linear dependence and independence,
    bases, changes of basis and vector geometry in two and three dimensions. These
    will be illustrated by examples.


    As a first example, check whether the vectors `{{1,2,-3,4}, {3,-1,2,1}, {1,-5,8,-7},
    {2,3,1,-1}}` are linearly.

    >> `A=[1,2,-3,4;3,-1,2,1;1,-5,8,-7;2,3,1,-1]`

    >> `det(A)`

    ans=0

    Since the determinant of the matrix of their coordinates is zero, the vectors
    are linearly independent.


    As a second example, let us check whether the set of vectors of `R^4 {{1,2,2,1},{3,4,4,3},{1,0,0,1}}`
    are linearly independent.

    >> `B=[1,2,2,1;3,4,4,3;1,0,0,1]`

    >> `rank(B)`

    ans=2

    We have three vectors in `R^4`, they would be independent if the rank of the matrix
    of their coordinates is 3. But we have seen that this rank is 2, which indicates
    that the vectors are linearly dependent.


    As a third example, we are going to obtain the dimension and a basis of the linear
    variety generated by the vectors `{{2,3,4,-1,1},{3,4,7,-2,-1},{1,-3,1,8},{0,5,5,-1,4}}`.
    To find the dimension of the linear variety we calculate the rank of the matrix
    formed by the vectors that generate it. This rank will be the dimension of the
    linear variety.

    >> `A=[2,3,4,-1,1;3,4,7,-2,-1;1,-3,1,8;0,5,5,-1,4]`

    >> `rank(A)`

    ans=3

    We have then that the dimension of the linear variety is 3 and a basis will be
    formed by the vectors containing the components of any non-zero minor of order
    3 of the matrix `A`.

    >> `det([3,4,7;1,3,-1;0,5,5])`

    ans=75

    Then a basis of the linear variety will be formed by the vectors `{{3,4,7,-2,-1},{1,-3,-1,1,8},{0,5,5,-1,4}}`.


    As a fourth example, we will check whether the vectors `{{2,3,-1},{0,0,1},{2,1,0}}`
    form a basis in `R^3` and if so, we will obtain the components of the vector `{3,5,1}`
    in the aforementioned basis. The given vectors are 3 vectors of a 3-dimensional
    space, so the condition for them to be a basis is that their determinant is zero.

    >> `det([2,3,-1;0,0,1;2,1,0])`

    ans=4

    The vectors form a basis. To find the components of the vector `{3,5,1}` in this
    basis, the following operations are carried out:

    >> `inv([2,0,2;3,0,1;-1,1,0])*[3,5,1]`

    ans=

    1.7500

    2.7500

    -0.2500


    As a fifth example, we consider the bases of `R^3` defined as `B={{1,0,0},{-1,1,0},{0,1,-1}}`
    and `B1={{{1,0,-1},{2,1,0},{-1,1,1}}` and find the change of basis matrix from
    `B` to `B1` by additionally calculating the components of the vector `{2,1,3}`
    in basis `B` in basis `B1`. The operation to be carried out would be as follows:

    >> `B=[1,0,0;-1,1,0;0,1,-1]`

    >> `B1=[1,0,-1;2,1,0;-1,1,1]`

    >> `A=inv(B1'')*B''`

    ans=

    -0.5000 1.5000 2.5000

    0.5000 -0.5000 -0.5000

    -0.5000 1.5000 1.5000

