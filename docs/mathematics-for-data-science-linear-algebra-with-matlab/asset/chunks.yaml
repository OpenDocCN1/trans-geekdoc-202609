    ```

    >> solve(''m^3 - 3*m + 2=0'',''m'')

    ```

    `ans = -2; 1; 1`


    The values of $m$ that determine the rank of the matrix are -2 and 1.


    We now consider the extended matrix as a function of $m$:


    ```

    >> B=[m,1,1,1;1,m,1,m;1,1,m,m^2]

    ```


    $B = [m, 1, 1, 1]; [1, m, 1, m]; [1, 1, 1, m, m^2]$


    Let''s study the case $m = -2$:


    ```

    >> rank(subs(A,{m},{-2}))

    ```

    `ans = 2`


    ```

    >> rank(subs(B,{m},{-2}))

    ```

    `ans = 3`


    We see that the rank of the two matrices is different, so the system is incompatible
    (has no solution) for $m=-2$.


    Now study the case $m=1$:


    ```

    >> rank(subs(A,{m},{1}))

    ```

    `ans = 1`


    ```

    >> rank(subs(B,{m},{1}))

    ```

    `ans = 1`


    Now the rank of the two matrices is 1, which is less than the number of unknowns.
    Therefore, the system has infinite solutions (indeterminate compatible). We find
    them by substituting $m=1$ in the initial system:


    ```

    >> [x,y,z]=solve(''x+y+z=1'',''x'',''y'',''z'')

    ```

    Warning: 1 equations in 3 variables. New variables might be introduced.


    $x = 1 - z_2 - z_1$

    $y = z_2$

    $z = z_1$


    Then, the infinite solutions are obtained by varying the parameters $y$ and $z$
    in the real numbers. The subspace of solutions of dimension 2 is:


    $\{1-z_2-z_1,z_2,z_1\} \forall z_1,z_2 \in \mathbb{R}$


    If we consider the case where $m$ is different from -2 and 1, the system has a
    unique solution, which is given by the `solve` command:


    ```

    >> [x,y,z]=solve(''m*x+y+z=1'',''x+m*y+z=m'',''x+y+m*z=m^2'',''x'',''y'',''z'')

    ```


    $x = -(m+1)/(m+2)$

    $y = 1/(m+2)$

    $z = (m^2+2m+1)/(m+2)$


    Study and solve, according to the values of $m$, the system:


    ```

    m y = m (1 + m)

    x - z = m

    y + z = m

    ```


    ```

    >> syms m

    >> A=[0,m,0;m+1,0,-1;0,1,1,1]

    ```


    $A = [0, m, 0]; [m+1, 0, -1]; [0, 1, 1, 1]$


    ```

    >> det(A)

    ```

    `ans = -m^2 - m`


    ```

    >> solve(''-m^2 - m=0'',''m'')

    ```

    `ans = -1; 0`


    We see that the values of $m$ that determine the rank of the coefficient matrix
    of the system are $m=-1$ and $m=0$.


    We now consider the extended matrix:


    ```

    >> B=[0,m,0,m;m+1,0,-1,m;0,1,1,m]

    ```


    $B = [0, m, 0, m]; [m+1, 0, -1, m]; [0, 1, 1, m]$


    ```

    >> rank(subs(A,{m},{-1}))

    ```

    `ans = 2`


    ```

    >> rank(subs(B,{m},{-1}))

    ```

    `ans = 3`


    In the case $m=-1$, we see that the system has no solution (it is incompatible)
    because the rank of the matrix of the coefficients of the system is 2 and that
    of the extended matrix is 3.


    Now, we analyse the case $m=0$:


    When $m$ is zero, the system is homogeneous, since the independent terms are all
    zero. To study it, we analyse the determinant of the matrix of the coefficients
    of the system.


    ```

    >> det(subs(A,{m},{0}))

    ```

    `ans = 0`


    Since the determinant is null, the system has infinitely many solutions:


    ```

    >> [x,y,z]=solve(''x-z=0'',''y+z=0'',''x'',''y'',''z'')

    ```

    Warning: 2 equations in 3 variables. New variables might be introduced.


    $x = z_1$

    $y = -z_1$

    $z = z_1$


    Then, the infinite solutions will be given when the parameter $z$ varies in the
    real numbers. The subspace of solutions of dimension 1 is:


    $\{z_1,-z_1,z_1\} \forall z_1 \in \mathbb{R}$


    If $m$ is different from 0 and different from -1, the system is determinate compatible
    (unique solution), since the ranks of the system matrix and the extended matrix
    coincide. The solution is calculated using the `solve` function.


    ```

    >> [x,y,z]=solve(''m*y=m'',''(1+m)*x-z=m'',''y+z=m'',''x'',''y'',''z'')

    ```


