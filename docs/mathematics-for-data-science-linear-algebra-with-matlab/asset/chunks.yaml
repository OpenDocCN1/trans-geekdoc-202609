    `W = griddata3(X,Y,Z,V,Xi,Yi,Zi)`

    `W = griddata3(...,''method'')`

    It fits a hypersurface of the form `W=f(X,Y,Z)` in the space of vectors `(X,Y,Z,V)`.
    The vector `W` determines the interpolation points `(Xi,Yi,Zi,Vi)` between the
    given points `(X,Y,Z,V)`. An inverse distance method is used for interpolating.
    Interpolation using the specified methods. The following is an example of an interpolation
    adjustment of a hypersurface.


    ```matlab

    x = 2*rand(5000,1)-1; y = 2*rand(5000,1)-1; z = 2*rand(5000,1)-1;

    v = x.^2 + y.^2 + z.^2;

    d = -0.8:0.05:0.8;

    [xi,yi,zi] = meshgrid(d,d,d);

    w = griddata3(x,y,z,v,xi,yi,zi);

    p = isosurface(xi,yi,zi,w,0);

