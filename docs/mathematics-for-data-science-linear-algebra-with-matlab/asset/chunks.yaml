    *pi);  X=cos(r)\\*sin(t);  Y=sin(r)\\*sin(t);  Z=ones(1,size(r))'\\*t;  surfl(X,Y,Z)\
    \  ![image](d2d_images/image045.png) |\n\n|  mesh(X,Y,Z,C)  ––––––––  ![image](d2d_images/scene_break.png)\
    \  ||  Represent the explicit surface z=f(x,y) or the parametric surface x=x(t,u),y=y(t,u),\
