    \ \n\n   M    ATLAB incorporates    commands that allow you to perform basic exploratory\
    \ graphics, such as histograms, bar charts, pie charts, arrow plots, and so on.\
    \   The following table summarises these commands.   For all of them it is necessary\
    \ to previously define the field of variation of the variable. \n\n|  bar(Y) \
    \ ||  Bar chart relative to the vector of frequencies Y.   If Y is a matrix, the\
    \ multiple bar chart is obtained for each row of Y  >> x=\\[1 2 5 8 4 3 4 1 2\
    \ 3 2\\];  >> bar(x)  ![image](d2d_images/image092.png) |\n\n| --- | --- |\n\n\
    |  bar(x,Y)  ||  Bar chart relative to the vector of frequencies Y where x is\
    \ a vector defining the spaces on the X-axis to place the bars.  >> x = -2.9:0.2:2.9;\
    \  >> bar(x,exp(-x.\\*x))  ![image](d2d_images/image122.png) |\n\n|  bar(...,width)\
    \  ||  Chart with given width of the bars.   By default, the width is 0.8 and\
    \ width 1 causes the bars to touch.  |\n\n|  bar(...,'    style    ')  ||  Chart\
    \ with style for the given bars.   The styles are 'group' (default style with\
    \ grouped vertical bars) and 'stack' (stacked bars).   If the matrix Y is (m,n),\
    \ the grouped chart has m groups of n vertical bars.  >> A=\\[1 6 12 5 7; 3 2\
    \ 6 5 3\\];  >> bar(A,'stack')  >> bar(A,'group')  ![image](d2d_images/image010.png)\
    \ ![image](d2d_images/image070.png) |\n\n|  ​    bar(...,colour)   ||  The bars\
    \ are all of the specified colour (r=red, g=green, b=blue, c=cyan, m=magenta y=yellow,\
    \ k=black and w=white).  |\n\n|  ​    barh(...)   ||  Horizontal bar charts  >>\
    \ barh(A,'group')  ![image](d2d_images/image149.png) |\n\n|  ​    hist(Y)   ​\
    \  ||  Draw the histogram relative to the frequency vector Y using 10 equal rectangles\
    \ of equal base.   If Y is a matrix, a histogram is constructed for each of its\
    \ columns.  >> Y=randn(100);  >> hist(Y)  ![image](d2d_images/image131.png) |\n\
    \n|  hist(Y,x)  ||  Draw the histogram relative to the frequency vector Y using\
    \ as many boxes as there are elements in the vector x and centring each box on\
    \ the successive x values.  |\n\n|  ​    hist(Y,k)   ​  ||  Draw the histogram\
    \ relative to the frequency vector Y using as many boxes as indicated by the scalar\
    \ k.  >> hist(Y, 8)  ![image](d2d_images/image047.png) |\n\n|  \\[n,x\\] = hist(...)\
    \  ||  Returns the vectors n and x with the frequencies assigned to each box of\
    \ the histogram and the values at which the boxes are centred.  |\n\n|  foot(X)\
    \  ||  Make the pie chart relative to the vector of frequencies X  >> X=\\[3 5\
    \ 12 4 7 10\\];  >> foot(X)  ![image](d2d_images/image136.png) |\n\n|  ​    foot(X,Y)\
    \   ||  Make the pie chart relative to the vector of frequencies X by shifting\
    \ out the sectors where Yi 0≠  >> pie(X,\\[0 0 1 0 1 1 1\\])  ![image](d2d_images/image061.png)\
    \ |\n\n|  errorbar(x,y,e)  ––––––––  ![image](d2d_images/scene_break.png)  ||\
    \  Graph the vector x against the vector y with the errors specified in the vector\
    \ e.   Passing through each point (xi,yi) draw a vertical line of length 2ei whose\
    \ centre is the point (xi,yi).  >> x = -4:.2:4;  y=(1/sqrt(2\\*pi))\\*exp(-(x.^2)/2);\
    \  e=rand(size(x))/10;  errorbar(x,y,e)  ![image](d2d_images/image113.png) |\n\
