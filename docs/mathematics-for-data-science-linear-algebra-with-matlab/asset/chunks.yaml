    MATLAB allows you to work with vector and even matrix complex variable functions.
    Let us not forget that these functions are also valid for real variables, since
    real numbers are a particular case of complex numbers with zero imaginary part.
    Below is a table with the specific vector complex variable functions that MATLAB
    incorporates. Later, when the matrix complex variable functions are presented,
    we will see that all of them are also valid for vector variables, since a vector
    is a particular case of a matrix.


    | Function | Description and Example |

    | :--- | :--- |

    | `max(V)` | Largest component (`max(abs(V))` is calculated for complexes) >>
    `max([1-i 1+i 3-5i 6i]) ans = 0 + 6.0000i` >> `max([1, 0, -23, 12, 16]) ans =
    16` |

    | `min(V)` | Smallest component (for complexes calculate `min(abs(V))`) >> `min([1-i
    1+i 3-5i 6i]) ans = 1. - 1.0000i` >> `min([1, 0, -23, 12, 16]) ans = -23` |

    | `mean(V)` | Mean of the components of V >> `mean([1-i 1+i 3-5i 6i]) ans = 1.2500
    + 0.2500i` >> `mean([1, 0, -23, 12, 16]) ans = 1.2000` |

    | `median(V)` | Median of the components of V >> `median([1-i 1+i 3-5i 6i]) ans
    = 2.0000 - 2.0000i` >> `median([1, 0, -23, 12, 16]) ans = 1` |

    | `std(V)` | Standard deviation of the components of V >> `std([1-i 1+i 3-5i 6i])
    ans = 4.7434` >> `std([1, 0, -23, 12, 16]) ans = 15.1888` |

    | `sort(V)` | Sort in ascending order the components of V. For complexes, sort
    according to absolute values. >> `sort([1-i 1+i 3-5i 6i]) ans = Columns 1 through
    2 1.0000 - 1.0000i 1.0000 + 1.0000i Columns 3 through 4 3.0000 - 5.0000i 0 + 6.0000i`
    >> `sort([1, 0, -23, 12, 16]) ans = -23 0 1 12 16` |

