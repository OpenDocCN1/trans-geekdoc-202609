    Find the remainder of the division of `2^( 134 )` by `3`. Is the number `2^( 32
    ) - 1` divisible by 17? Find also the number `N` which, when divided by 16, 24,
    30 and 32, gives a remainder of 5.


    The first part of the problem is solved as follows:


    ```

    rem(2^134,3)

    ```

    ans = 0


    It is noted that `2134` is a multiple of 3.


    To see if `2^( 32 ) -1` is divisible by 17, we break it down into prime factors:


    ```

    factor(2^32-1)

    ```

    ans = 3 5 17 257 65537


