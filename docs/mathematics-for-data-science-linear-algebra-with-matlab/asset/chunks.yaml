    # 5.2 DECOMPOSITION OF MATRICES. EIGENVALUES AND EIGENVECTORS


    ![image](d2d_images/chapter_title_below.png)


    MATLAB allows you to work with special care in the field of matrix decomposition.
    It implements commands for most of the known decompositions and for working with
    eigenvalues and eigenvectors. The syntax of the most common commands in this field
    is presented in the following table.


    | `eig(A)` | Find the eigenvalues of the square matrix `A` >> `A=rand(4)` `A =
    0.8147 0.6324 0.9575 0.9572 0.9058 0.0975 0.9649 0.4854 0.1270 0.2785 0.1576 0.8003
    0.9134 0.5469 0.9706 0.1419` >> `B=sym(''[1, a^2;1, -a;0, 0])` `B = [1, a^2; 1,
    -a; 0, 0]` >> `eig(A)` `ans = 2.4021 -0.0346 -0.7158 -0.4400` >> `eig(B)` `ans
    = 0 1+a` |

    | --- | --- |

    | `[V,D] = eig(A)` | Find the diagonal matrix `D` of eigenvalues of `A` and matrix
    `V` whose columns are the corresponding eigenvectors, where `A*V=D` >> `[V,D]=eig(A)`
    `V = -0.6621 -0.7149 0.1745 0.1821 -0.4819 -0.0292 -0.6291 -0.9288 -0.2766 0.9972
    0.5995 0.3178 -0.5029 -0.0438 -0.4630 0.0570` `D = 2.4021 0 0 0 -0.0346 0 0 -0.7158
    0 0 -0.4400` >> `[V1,D1]=eig(B)` `V1 = [-a, a^2, 1; 1, -a, 1; 0, 1, 0]` `D = [0,
    0, 0] [0, 1, 0] [0, 0, a+1]` |

    | `eig(A,B)` | Returns a vector with the generalised eigenvalues of the square
    matrices `A` and `B`. The generalised eigenvalues of `A` and `B` are the roots
    of the polynomial `det(λC-A)` >> `C=randn(4)` `C = -0.1241 0.6715 0.4889 0.2939
    1.4897 -1.2075 1.0347 -0.7873 1.4090 0.7172 0.7269 0.8884 1.4172 1.6302 -0.3034
    -1.1471` >> `eig(A,C)` `ans = 0.6654+0.6533i 0.6654-0.6533i 0.0259 0.1997` |

