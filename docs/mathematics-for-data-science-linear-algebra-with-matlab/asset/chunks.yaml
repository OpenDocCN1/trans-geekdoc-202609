    If we now consider the vector whose elements are the first 9 natural numbers (without
    zero) and the vector with the same elements from largest to smallest, identify
    the values resulting from subtracting from the elements of the second vector the
    quantity 1 if the corresponding element of the first vector is greater than 2,
    or the quantity 0 if it is less than or equal to 2.


    ```matlab

    X=5*ones(3,3); X>= [1 2 3; 4 5 6; 7 8 9].

    ans =

    1 1 1

    1 1 0

    0 0 0

    ```


    The elements of the matrix `X` that are greater than or equal to those of the
    matrix `[1 2 3; 4 5 6; 7 8 9]` correspond to a 1 in the answer matrix. The rest
    of the elements correspond to a 0 (the result of the operation would be the same
    if we compare the scalar `5` with the matrix `[1 2 3; 4 5 6; 7 8 9]`, by means
    of the expression `X=5; X>= [1 2 3; 4 5 6; 7 8 9]`).


    ```matlab

    >> X=5; X>= [1 2 3; 4 5 6; 7 8 9]

    ans =

    1 1 1

    1 1 0

    0 0 0

    ```


