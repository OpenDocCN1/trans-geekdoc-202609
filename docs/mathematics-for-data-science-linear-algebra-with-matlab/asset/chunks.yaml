    # 3.2 显式、隐式、参数和极坐标中的曲线


    ![image](img/chapter_title_below.png)


    下表列出了用于在显式、隐性和极坐标中表示二维曲线最重要的 MATLAB 命令。


    | `plot(X,Y)` | 绘制点集 `(X,Y)`，其中 `X` 和 `Y` 是行向量。要绘制函数 `y=f(x)`，需要知道一组点 `(X,f(X))`，必须预先定义变量
    `x` 的向量变化范围 `X`。`X` 和 `Y` 可以是相同维度的矩阵，在这种情况下，为每对行绘制一张图并在同一轴上显示。对于 `X` 和 `Y` 的复值，忽略其虚部。对于具有给定
    `t` 的 `x = x(t)` 和 `y = y(t)`，绘制指定的参数平面曲线 >>

    ```matlab

    x=0:0.1:6\*pi; y=x.\*sin(x); plot(x,y)

    ```

    ![image](img/image038.png) |

    | --- | --- |

    | `plot(Y)` | 将向量 `Y` 的元素相对于其索引绘图，即给出点集 `(t,y)` `t=1,2,...n (n=length(Y))` 的图形。这对于绘制时间序列非常有用。如果
    `Y` 是矩阵，`plot(Y)` 会为 `Y` 的每一列绘制一张图，并将它们全部显示在同一轴上。如果向量 `Y` 的分量是复数，`plot(Y)` 等于
    `plot(real(Y),imag(Y))` >>

    ```matlab

    Y=[1,3,9,27,81,243]; plot(Y)

    ```

    ![image](img/image143) |

