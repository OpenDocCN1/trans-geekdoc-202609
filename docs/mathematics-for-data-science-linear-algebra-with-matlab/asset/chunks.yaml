    # 3.3 WARPED CURVES


    ![image](d2d_images/chapter_title_below.png)


    MATLAB incorporates commands that allow you to represent warped curves in three
    dimensions. The most important of these are listed in the table below.


    | `plot3(X,Y,Z)` | Plots the set of points `(X,Y,Z)`, where `X`, `Y` and `Z` are
    row vectors. `X`, `Y` and `Z` can be parametric coordinates or matrices of the
    same dimension, in which case one plot is made for each row triplet and on the
    same axes. For complex values of `X`, `Y` and `Z`, the imaginary parts are ignored.
    >>

    ```

    X = [0 1 1 2;1 1 2 2;0 0 1 1];

    Y = [1 1 1 1;1 0 1 0;0 0 0 0];

    Z = [1 1 1 1;1 0 1 0;0 0 0 0];

    plot3(X,Y,Z)

    ```

    ![image](d2d_images/image063.png) >>

    ```

    t=0:pi/100:20*pi;plot3 (2*sin(2*t),2*cos(2*t),4*t)

    ```

    ![image](d2d_images/image093.png) |

    | --- | --- |

    | `plot3(X,Y,Z,S)` | Plot `(X,Y,Z)` with the options defined in `S`. Usually `S`
    consists of two digits in single quotes, the first of which sets the colour of
    the plot line and the second the character to be used in the plot. The possible
    values of colours and characters have already described when explaining `plot`
    command |

    | `plot3(X1,Y1,Z1,S1, X2,Y2,S2, X3,Y3,S3,...)` | It combines, on the same axes,
    the graphs defined for triplets `(Xi,Yi,Zi)`. This is a way of representing several
    functions on the same graph. |

    | `fill3(X,Y,Z,C)` | Draw the compact polygon whose vertices are the triplets
    `(Xi,Yi,Zi)` of the column vectors `X`, `Y` and `Z`. `C` is a vector of the same
    dimension as `X` and `Y`, containing the colours `Ci` of each point `(Xi,Yi,Zi)`.
    The values of `Ci` can be ''r'',''g'',''b'',''c'',''m'',''y'',''k''. If `C` is
    a single character, all the points of the polygon will be painted in the colour
    corresponding to the character. If `X` and `Y` are of the same dimension, several
    polygons corresponding to each triplet of column vectors `(X.j,Y.j,Z.j)` will
    be represented simultaneously. In this case, `C` can be a row vector whose elements
    `Cj` determine the unique colour of each polygon corresponding to the triplet
    of column vectors `(X.j,Y.j,Z.j)`. `C` can also be a matrix of the same dimension
    as `X` and `Y`, in which case its elements determine the colours of each point
    `(Xijk,Yijk,Zijk)` of the set of polygons.

    ```

    X = [0 1 1 2;1 1 2 2;0 0 1 1];

    Y = [1 1 1 1;1 0 1 0;0 0 0 0];

    Z = [1 1 1 1;1 0 1 0;0 0 0 0];

    C = [0.5000 1.0000 1.0000 0.5000; 1.0000 0.5000 0.5000 0.1667; 0.3330 0.3330 0.5000
    0.5000];

    fill3(X,Y,Z,C)

    ```

    ![image](d2d_images/image154.png) |

    | `fill3(X1,Y1,Z1,C1, X2,Y2, Z2,...)` | Draw the compact polygon whose vertices
    are given by the points `(Xi, Yi, Zi, Ci)`. |

    | `ezplot3(x(t),y(t),z(t))` `ezplot3(x(t),y(t),z(t), [tmin,tmax])` | Draw the
    warped curve defined by its three parametric components. Draw the warped curve
    by its three parametric components for a variation field of the given parameter.
    >>

    ```

    ezplot3(''sin(t)'',''cos(t)'',''t'',[0,6*pi])

    ```

    ![image](d2d_images/image112.png) |

    | ![image](d2d_images/chapter_title_corner_decoration_left.png) | | ![image](d2d_images/chapter_title_corner_decoration_right.png)
