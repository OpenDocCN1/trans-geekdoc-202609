    # 1.7 ONE-DIMENSIONAL, VECTOR AND MATRIX VARIABLES


    ![image](d2d_images/chapter_title_below.png)


    MATLAB is a software focused on the matrix language, so it focuses especially
    on working with matrices.


    The initial way to define a variable is very simple. Just use the following syntax:


    `Variable = object`


    Where the object can be a scalar, a vector or a matrix.


    If the variable is a vector, its syntax in terms of its components can be written
    in one of the following two ways:


    `Variable = [v1 v2 v3 ... vn].`


    `Variable = [v1, v2, v3, ..., vn].`


    If the variable is an array, its syntax in terms of its components can be written
    in one of the following two ways:


    `Variable = [v11 v12 v12 v13 ... v1n; v21 v22 v23 ... v2n; ...]`


    `Variable = [v11, v12, v13, ..., v1n; v21, v22, v23, ..., v2n; ...]`


    Writing variables is done in the MATLAB Command Window in a natural way, as shown
    in Figure 1-10.


    –––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image017.png)


    Figure 1-10


    Once a variable is defined, we can operate on it by using it as a regular variable
    in mathematics, keeping in mind that variable names are case sensitive (Figure
    1-11). Figure 1-12 shows some operations with one-dimensional, vector and matrix
    variables. It is important to note that when calculating the logarithm of `V2`
    the error was made of using the variable in lower case.


    In MATLAB, variable names begin with a letter followed by any number of letters,
    digits, or underscores up to 31 characters.


    ![image](d2d_images/image157.png) ![image](d2d_images/image066.png)


    Figure 1-11 Figure 1-12


    There are also specific ways of defining vector variables, including the following:


    | `variable=[a:b]` | Defines the vector whose first and last elements are `a`
    and `b`, respectively, and the elements in between differ by one unit | `vector1=[2:6]`
    `vector1 = 2 3 4 5 6` |

    | --- | --- |

    | `variable=[a:s:b]` | Defines the vector whose first and last elements are `a`
    and `b`, and the elements in between differ by the quantity `s` specified by the
    increment | `vector2=[2:2:8]` `vector2 = 2 4 6 8` |

    | `variable=linspace[a,b,n]` | Defines the vector whose first and last elements
    are `a` and `b`, and which has a total of `n` evenly spaced elements | `vector3=linspace(10,30,6)`
    `vector3 = 10 14 18 22 26 30` |

