- fmt: '

    If the determinant of `M` is zero, the system has infinitely many solutions, so
    that there are rows or columns in `M` that are linearly dependent. In this case,
    the number of redundant equations will be calculated to find out how many variables
    we have to fix to give the infinite solutions. If the matrix `M` is rectangular
    (not square), the system may be indeterminate (number of equations less than the
    number of variables), overdetermined (number of equations greater than the number
    of variables) or non-singular (number of equations equal to number of variables
    and determinant of `M` non-zero). An indeterminate system can have infinitely
    many solutions or none at all, and the same happens to an overdetermined system.
    If there is no solution for a system, it is called inconsistent (incompatible),
    and if at least one solution exists, it is called consistent (compatible). The
    system `M.X = B` is called `homogeneous` when the vector `B` is the null vector.
    The system will be of the form `M.X = 0`. If the determinant of `M` is non-zero,
    the only solution of the system is the null vector (obtained with the command
    `linsolve`). If the determinant of `M` is null, the system has infinite solutions
    (it is indeterminate compatible). The solutions will be found by means of the
    `solve` or `linsolve`, `lsqr` or other commands already seen previously for general
    linear systems.


    A fundamental tool for the analysis and solution of systems of equations is the
    `Rouché Frobenius theorem`. This theorem states that a system of `m` equations
    with `n` unknowns has some solution if, and only if, the rank of the matrix of
    coefficients coincides with the rank of the matrix expanded with the column vector
    of the independent terms of the system. If the two ranks are equal and equal to
    the number of unknowns, the system has a unique solution. If the two ranks are
    equal, but less than the number of unknowns, the system has infinite solutions.
    If they are different, the system has no solution.


    Let `A` be the coefficient matrix of the system and `B` the extended matrix with
    the vector of independent terms.


    - If `range(A) ≠range(B)`, the system is incompatible (unsolvable).

    - If `rank(A)=rank(B) < n`, the system is indeterminate compatible (has infinitely
    many solutions).

    - If `rank(A)=rank(B) = n`, the system is determinate compatible (has a unique
    solution).


    This theorem makes it possible to analyse the solutions of a system of equations
    before solving it.


    We already know that another special type of linear systems are `homogeneous systems`.
    The system `A.X=B` is said to be homogeneous if the vector of independent terms
    `B` is zero, so that any homogeneous system will be of the form `A.X=0`. In a
    homogeneous system, the rank of the coefficient matrix and the rank of the matrix
    extended with the column of independent terms always coincide. If we apply the
    Rouché-Frobenius theorem, a homogeneous system will have a unique solution when
    the determinant of the matrix `A` is non-zero. This unique solution is the null
    vector, since the null solution is always found in homogeneous systems. A homogeneous
    system will have infinitely many solutions when the determinant of the matrix
    `A` is zero. In this case, the infinite solutions are calculated in the same way
    as in general systems (`solve` command), or also using the `null` function `(A)`.


    ### Example 1


    As a first example, we solve the system:

    ```

    2 x + y + z + t = 1

    x + 2 y + z + t = 1

    x + y +2 z + t = 1

    x + y + z +2 t = 1

    ```

    We will find the rank of the system matrix and of the extended matrix with the
    column of independent terms.

    ```

    >> A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];

    >> B=[2,1,1,1,1;1,2,1,1,1;1,1,2,1,1;1,1,1,2,1];

    >> [rank(A), rank(B)] >> [rank(A), rank(B)].

    ans = 4 4

    ```

    We observe that the ranks of the two matrices coincide with the number of unknowns.
    The Rouché-Frobenius theorem then ensures that the system is determinate compatible
    with a unique solution. We can calculate the solution as follows:

    ```

    >> B=[1 1 1 1]'';

    >> linsolve(A,B)

    ans = 0.2000 0.2000 0.2000 0.2000

    ```

    The system could also have been solved with the following commands:

    ```

    >> lscov(A,B)

    ans = 0.2000 0.2000 0.2000 0.2000

    >> bicg(A,B)

    bicg converged at iteration 1 to a solution with relative residual 0

    ans = 0.2000 0.2000 0.2000 0.2000

    >> pcg(A,B)

    pcg converged at iteration 1 to a solution with relative residual 0

    ans = 0.2000 0.2000 0.2000 0.2000

    >> lsqr(A,B)

    lsqr converged at iteration 1 to a solution with relative residual 0

    ans = 0.2000 0.2000 0.2000 0.2000

    >> qmr(A,B)

    qmr converged at iteration 1 to a solution with relative residual 0

    ans = 0.2000 0.2000 0.2000 0.2000

    >> gmres(A,B)

    gmres converged at iteration 1 to a solution with relative residual 1.5e-16

    ans = 0.2000 0.2000 0.2000 0.2000

    >> symmlq(A,B)

    symmlq converged at iteration 1 to a solution with relative residual 0

    ans = 0.2000 0.2000 0.2000

    ```


    ### Example 2


    As a second example, we solve the system:

    ```

    x + 2y + 3z = 6

    x + 3y + 8z = 19

    2x + 3y + z = -1

    5x + 6y + 4z = 5

    ```

    We will find the rank of the system matrix and of the extended matrix with the
    column of independent terms.

    ```

    >> A=[1,2,3;1,3,8;2,3,1;5,6,4];

    >> B=[1,2,3,6;1,3,8,19;2,3,1,-1;5,6,4,5];

    >> [rank(A), rank(B)] >> [rank(A), rank(B)].

    ans = 3 3

    ```

    We observe that the ranks of the two matrices coincide with the number of unknowns.
    The Rouché-Frobenius theorem then ensures that the system is determinate compatible
    with a unique solution. We can calculate the solution as follows:

    ```

    >> A=[1,2,3;1,3,8;2,3,1;5,6,4];

    >> B=[6 19 -1 5]'';

    >> linsolve(A,B)

    ans = 1.0000 -2.0000 3.0000



    ### Example 3


    As a third example, we solve the system:

    ```

    x + 2y - z = 0

    2x - y + z = 0

    3x + y = 0

    ```

    As we are dealing with a homogeneous system, we will calculate the determinant
    of the coefficient matrix of the system.

    ```

    >> A=[1,2,-1;2,-1,1;3,1,0];

    >> det(A)

    ans = 5.5511e-16

    ```

    Since the determinant is practically zero, the homogeneous system will have infinitely
    many solutions, which are calculated with the `solve` command as shown below.

    ```

    >> [x,y,z]=solve(''x+2y-z, 2x-y+z, 3x+y'', ''x,y,z'')

    x = -z1/5

    y = (3*z1)/5

    z = z1

    ```

    It is observed that the infinite solutions depend on the parameter `z1` and can
    be written as follows:

    `{(-z1/5, 3z1/5, z1)}z1`


    ### Exercise 1


    Expand the following algebraic expressions:

    ```

    syms x y z t a b

    pretty(expand((x+1)*(x+2)))

    pretty(expand((x+1)/(x+2)))

    pretty(expand(sin(x+y)))

    pretty(expand(cos(2*x)))

    pretty(expand(exp(a+log(b))))

    pretty(expand(log(x/(1-x)^2))))

    pretty(expand((x+1)*(y+z)))

    ```

    Factor the following algebraic expressions:

    ```

    syms x y

    pretty(factor(6*x^2+18*x-24))

    pretty(factor(x^4-y^4))

    pretty(factor(x^3+y^3))

    pretty(factor((x^3-y^3)/(x^4-y^4))))

    ```

    '
