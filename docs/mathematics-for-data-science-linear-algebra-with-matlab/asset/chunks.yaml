    为了对二次型进行分类，计算它的对角行列式。


    >> G=[1,0,0;0,2,2;0,2,2]


    ```

    G =

    1 0 0

    0 2 2

    0 2 2

    ```


    >> det(G)


    ```

    ans =

    0

    ```


    >> det([1,0;0,2])


    ```

    ans =

    2

    ```


    该二次型是退化的、正半定的。


    为了找到化简方程，我们对其矩阵进行对角化并利用对角矩阵找到表达式。


    >> J=jordan(G)


    ```

    J =

    0 0 0

    0 1 0

    0 0 4

    ```


    该二次型的化简方程将为：


    ![自动生成的包含物体、时钟的图像](img/image152.png) >> rank(J)


    ```

    ans =

    2

    ```


    该二次型的秩为 2，因为其矩阵的秩为 2。符号也为 2，因为对角化矩阵对角线上的正项个数为 2。


