    # 图形


    ATLAB 是一个实现高性能图形的科学软件。它允许绘制二维和三维探索性数据分析图、显式、隐式和参数曲线、表面图、网格和等值线图。还可以选择图形的窗口和位置、选择线条和标记特征、放置坐标轴限制、标记和网格、放置注释、标签和图例，并将图形导出到不同的格式，这些功能将在本章中介绍。


    ## 3.1 探索性数据图


    ATLAB 包含了许多允许你执行基础探索性图形的命令，例如直方图、柱状图、饼图、箭头图等。下表总结了这些命令。对于所有这些命令，都需要预先定义变量的变化范围。


    '
- fmt: '

    | `rose(Y,n)` | Draw the angular histogram of the vector `Y` using `n` equal radii.
    |

    | `rose(X,Y)` | Draw the angular histogram relative to vector `Y` using radii
    measuring as specified in the elements of vector `X`. |

    | `compas(Z)` | ![image](d2d_images/scene_break.png) Draw a diagram of arrows
    leaving the origin and whose magnitude and direction are determined by the modulus
    and argument of the complex component numbers of the vector `Z`. The arrow relative
    to the complex `Zi` joins the origin with the affix of `Zi` >>

    ```mat

    z=eig(randn(20,20)); compass(z)

    ```

    ![image](d2d_images/image128.png) |

    | `compas(X,Y)` | Equivalent to `compas(X+i\*Y)` |

    | `compas(Z,S)` or `compas(X,Y,S)` | Specifies in `S` the type of line to be used
    in the arrows. |

    | `feather(Z)` or `feather(X,Y)` or `feather(Z,S)` or `feather(X,Y,S)` | It is
    the same as `compas`, with the only difference that the origin of the arrows is
    not at the origin of coordinates, but they come from equally spaced points on
    a horizontal line. >>

    ```matlab

    z=eig(randn(20,20)); feather(z)

    ```

