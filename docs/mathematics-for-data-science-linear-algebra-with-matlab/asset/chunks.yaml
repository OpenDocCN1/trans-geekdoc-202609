    ### Exercise 7


    Given the following matrix: ![Texto Descripción generada automáticamente](d2d_images/image012.png)


    Calculate its eigenvalues, its characteristic polynomial, its canonical Jordan
    form and its singular values.


    We begin by defining the matrix `A` as a symbolic matrix:


    ```

    A=sym([1 0 0; 0 cos(a) -sin(a); 0 sin(a) cos(a)]'')

    A =

    [ 1, 0, 0]

    [ 0,cos(a),-sin(a)]

    [ 0,sin(a), cos(a)]

    ```


    ```

    eigensys(A)

    ans =

    [1]

    [cos(a)+1/2*(-4*sin(a)^2)^(1/2)]

    [cos(a)-1/2*(-4*sin(a)^2)^(1/2)]

    ```


    ```

    pretty(simple(poly(A)))

    3  2  2

    x^3 - 2*x^2*cos(a) + x - x + 2*x*cos(a) - 1

    ```


    ```

    jordan(A)

    ans =

    [1, 0, 0]

    [0, cos(a)+1/2*(-4*sin(a)^2)^(1/2), 0]

    [0, 0, cos(a)-1/2*(-4*sin(a)^2)^(1/2)]

    ```


    ```

    simple(svd(A))

    ans =

    [1]

    [1/2*(4*cos(a)-conj(a))+(-2+2*cos(a)-conj(a)))^(1/2)]

    [1/2*(4*cos(a)-conj(a))-(-2+2*cos(a)-conj(a)))^(1/2)]

    ```


    Diagonalise the matrix whose rows are the vectors: `(3,-1,0), (-1,2,-1), (0,-1,3)`.
    Find the step matrix `V`, check the result and see that eigenvalues of initial
    matrix are elements of the diagonal similar to the given one. We calculate a diagonal
    matrix `J` similar to `A`, which will have eigenvalues of `A` on the diagonal
    and step matrix `V`. To do this, we use `[V,J]=jordan(A)`:


    ```

    A=[3,-1,0; -1,2,-1; 0,-1,3]

    A =

    3 -1 0

    -1 2 -1

    0 -1 3

    >> [V,J]=jordan(A)

    V =

    -1 -1 1

    2 0 -1

    1 1 1

    ```


    ![image](d2d_images/scene_break.png)


    ```

    J =

    1 0 0

    0 3 0

    0 0 4

    ```


    Now we check that diagonal matrix `J` similar to `A` has eigenvalues of `A` on
    the diagonal:


    ```

    eig(A)

    ans =

    1.0000

    3.0000

    4.0000

    ```

    The matrices `A` and `J` turn out to be similar, since there exists the step matrix
    `V` that satisfies relation `V^(-1)*A = J`:


    ```

    inv(V)*A

    ans =

    1.0000 0 -0.0000

    0 3.0000 0

    0 0 4.0000

    ```


