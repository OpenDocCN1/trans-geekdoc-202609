    ### 矩阵函数


    #### `[U,T] = schur(A)`

    寻找一个矩阵 `T` 和一个酉矩阵 `U`使得 `A = U*T*U''` 且 `U''*U = eye(U)`。如果 `A` 是复数，`T` 是一个对角线上为
    `A` 特值的上三角矩阵。如果 `A` 是实数，矩阵 `T` 的对角线上是 `A` 的特征值，对应的复特征值对应于矩阵 `T` 中的 2x2 对角线块。


    ```

    [U,T] = schur(A)

    U = -0.6621 -0.5327 0.5206 -0.0825 -0.4819 0.1301 -0.5815 -0.6424 -0.2766 0.8273
    0.4848 -0.0637 -0.5029 0.1217 -0.3947 0.7593

    T = 2.4021 -0.8133 -0.6225 -0.1304 0 -0.0346 -0.1940 0.2110 0 0 -0.7158 0.3496
    0 0 0 -0.4400

    ```


    #### `schur(A)`

    仅返回上一节中的矩阵 `T`。


    ```

    schur(A)

    ans = 2.4021 -0.8133 -0.6225 -0.1304 0 -0.0346 -0.1940 0.2110 0 0 -0.7158 0.3496
    0 0 0 -0.4400

    ```


    #### `[U,T] = rsf2csf(U,T)`

    将 `schur` 命令的输出 `[U,T]` 转换为复数。


    ```

