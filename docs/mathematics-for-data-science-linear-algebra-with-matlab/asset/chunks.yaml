    # 1.6 REAL NUMBERS AND FUNCTIONS OF REAL VARIABLES


    ![image](d2d_images/chapter_title_below.png)


    The real numbers are the disjoint union of the rational numbers and the irrational
    numbers. A rational number is of the form `p/q`, where `p` is an integer and `q`
    is another integer. MATLAB''s treatment of rationals is different from that of
    most calculators. Rational numbers are quotients of integers, and MATLAB can also
    work with them in exact mode, so that the result of expressions involving rational
    numbers is always another rational number or integer. To do this, it is necessary
    to activate the rational format with the `format rat` command. MATLAB also returns
    decimal approximations of the results if the user so desires, by activating any
    other type of format (for example, `format short` or `format long`). Consider
    the following example:


    ```matlab

    >> format rat;

    >> 1/6+1/5-2/10

    ans = 1/6

    ```


    MATLAB is dealing with rationals as quotients of integers and keeps them in this
    form during calculations. In this way, rounding errors are not carried over in
    calculations with fractions, which can be very serious, as shown in Error Theory.
    Once the rational format is enabled, operations with rationals will be exact until
    a different format is enabled. When the rational format is enabled, a floating-point
    number, that is a number with a decimal point, is interpreted as exact and MATLAB
    treats the whole expression as exact rational by representing the result in rational
    numbers. In turn, if there is an irrational number in a rational expression, MATLAB
    matches it to the closest fraction to work in rational format. Consider the following
    examples:


    ```matlab

    >> format rat;

    >> 2.64/25+4/100

    ans = 91/625


    >> 2.64/sqrt(25)+4/100

    ans = 71/125


    >> sqrt(2.64)/25+4/100

    ans = 204/1943

    ```


    MATLAB also works with irrational numbers by representing the results as accurately
    as it can or as precisely as required by the user, keeping in mind the caveat
    that irrationals cannot be represented exactly as the ratio of two integers. An
    example is given below.


    ```matlab

    >> sqrt(235)

    ans = 15.3297

    ```


    There are very typical real constants that MATLAB represents as follows:


    | `pi` | Number π= 3.1415926 >> `2*pi` `ans = 6.2832` |

    | --- | --- |

    | `exp(1)` | Number e = 2.7182818 >> `exp(1)` `ans = 2.7183` |

    | `inf` | Infinity (e.g. `1/0`) >> `1/0` `ans = Inf` |

    | `NaN` | Indeterminacy (e.g. `0/0`) >> `0/0` `ans = NaN` |

    | `realmin` | Smallest positive real number >> `realmin` `ans = 2.2251e-308` |

    | `realmax` | Largest positive real number >> `realmax` `ans = 1.7977e+308` |


    MATLAB has a range of predefined real functions, which will course valid for rational,
    irrational and integer variables. The most important of these are presented in
    the following paragraphs.


