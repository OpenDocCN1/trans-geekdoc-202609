    U = -0.6380 0.3590 0.2155 0.6462 -0.5202 -0.2451 -0.8111 -0.1069 -0.2287 0.7358
    0.0083 -0.6373 -0.5197 -0.5193 0.5436 -0.4059

    S = 2.6201 0 0 0 0 0.8590 0 0 0 0 0.3796 0 0 0

    V = -0.5705 -0.3613 -0.1621 -0.7196 -0.3061 0.1444 0.9401 -0.0416 -0.6310 -0.3268
    -0.1247 0.6924 -0.4274 0.8613 -0.2729 -0.0321

    ```


    - `hadamard(n)`: Matrix with values 1 or -1 such that `H*H = eye(n)`.

    >> `H=hadamard(4)`

