    ## lsqnonneg


    | `x = lsqnonneg(C,d)` | `x = lsqnonneg(C,d,x0)` | `x = lsqnonneg(C,d,x0,opt)`
    | `[x,resnorm] = lsqnonneg(...)` | `[x,resnorm,residual] = lsqnonneg(...)` | `[x,resnorm,residual,f]
    = lsqnonneg(...)` | `[x,resnorm,residual,f,out,lambda] = lsqnonneg(...)` |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | | |

    | 通过最小二乘法（实数 `C` 和 `d`）给出在 `x≥0` 条件下最小 `norm(C*x-d)` 的 `x` | 给出在 `x≥0` 条件下最小 `norm(C*x-d)`
    的 `x`，但使用 `x=x0` 作为初值。 | 给出在 `x≥0` 条件下使用 `x=x0≥0` 作为初值和选项 `opt` 最小 `norm(C*x-d)`
    的 `x`。 | | | |


    以下是 MATLAB 提供的通过对称最小二乘和非负最小二乘法求解方程和系统的命令。


