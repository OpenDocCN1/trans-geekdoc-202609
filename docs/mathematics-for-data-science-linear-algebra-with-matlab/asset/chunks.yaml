    Study and solve, according to the values of $m$, the system:


    ```

    m x + y + z = 1

    x + m y + z = m

    x + y + m z = m^2

    ```


    ```

    >> syms m

    >> A=[m,1,1;1,m,1;1,1,1,m]

    ```


    $A = [m, 1, 1]; [1, m, 1]; [1, 1, m]$


    ```

    >> det(A)

    ```

