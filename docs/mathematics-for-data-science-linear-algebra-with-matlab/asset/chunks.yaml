    ## 示例说明


    让我们来看一些示例说明。


    ```mat

    x=linspace(0,2,30);

    y=sin(x.²);

    plot(x,y)

    text(1,0.8, ''y=sin(x²)'')

    hold on

    z=log(sqrt(x));

    plot(x,z)

    text(1,-0.1, ''y=log(x)'')

    xlabel(''X-axis'');

    ylabel(''Y-axis'');

    title(''Sine and logarithmic graph'');

    ```


    ```matlab

    subplot(2,2,1);

    ezplot(''sin(x)'',-2*pi 2*pi);

    subplot(2,2,2);

    ezplot(''cos(x)'',-2*pi 2*pi);

    subplot(2,2,3);

    ezplot(''csc(x)'',-2*pi 2*pi);

    subplot(2,2,4);

    ezplot(''sec(x)'',-2*pi 2*pi);

    ```


    ```matlab

    X,Y=meshgrid(-2:.05:2);

    Z=X.²-Y.²;

    subplot(2,2,1);

    surf(X,Y);

    subplot(2,2,2);

    surf(X,Y),view(-90,0);

    subplot(2,2,3);

    surf(X,Y),view(60,30);

    subplot(2,2,4);

    surf(X,Y),view(-10,30);

    ```


    ### 练习 1

    表示方程定义的表面：


    ```matlab

    x,y=meshgrid(0:.05:2,-2:.05:2);

    z=y.²*(x-1).²./(y.²+(x-1).²;

    mesh(x,y,z),view([-23,30]);

    ```


    我们也可以以下方式表示表面：


    ```matlab

    ezsurf(''y²*(x-1)²/(y²+(x-1)²)'')

    ```


    ### 练习 2

    设 $f:R² \to R$ 为由定义的函数：在 $(0,0)$ 环境中对其绘图。


    ```matlab

    x,y=meshgrid(-1/100:0.0009:1/100,-1/100:0.0009:1/100);

    z=(1-cos(x)).*sin(y)./(x.³+y.³);

    surf(x,y,z)

    view([50,-15])

    ```


    在同一图中相邻绘制极坐标曲线：表示它们的交点。


    ```matlab

    a=0:.1:2*pi;

    subplot(1,2,1);

    r=sqrt(cos(2*a));

    polar(a,r)

    title('' r = sqrt(Cos(2a))'');

    subplot(1,2,2);

    r=sin(2*a);

    polar(a,r)

    title('' r = Sen(2a)'')

    ```


    为了看到这两条曲线的交点，我们将它们都画在同一个轴上。


    ```matlab

    a=0:.1:2*pi;

    r=sqrt(cos(2*a));

    polar(a,r)

    hold on;

    r=sin(2*a);

    polar(a,r);

    ```


    ### 练习 4

    绕 OX 轴旋转三次曲线 $12x - 9x² + 2x³$ 生成的体积，范围在 $x=0$ 到 $x=5/2$ 之间。


    旋转面具有方程 $y²+z² = (12x-9x²+2x³$，可以通过以下方式参数化绘图：


    ```matlab

    t=(0:.1:5/2);

    u=(0:.1:2*pi);

    z=(12*t-9*t²+2*t³).*sin(u)

    ```


    绕 OX 轴和 OY 轴旋转椭圆生成的体积。我们在同一图中表示生成的图形，但只画正半部分。最终体积是该体积的两倍。图形 $y²+z²=9$ 的方程参数化如下：


    ```matlab

    t=(0:.1:2);

    u=(0:.1:2*pi);

    x=t, y=3*cos(u), z=3*sin(u)

    surf(x,y,z)

    ```


    ### 练习 6

    表示抛物面 $x²+y²=2$ 与平面 $z=x+2$ 的交点。


    ```matlab

    x,y=meshgrid(-3:.1:3);

    z=x.²+y.²;

    mesh(x,y,z)

    hold on;

    z=x+2;

    mesh(x,y,z)

    ```


    表示由抛物面 $x²+4y²=z$ 以及侧面方程 $y²=x$ 和 $x=y²$ 的圆柱面围成的体积。


    ```matlab

    x,y=meshgrid(-1/2:.02:1/2,-1/4:.01:1/4);

    z=x.²+4*y.²;

    mesh(x,y,z)

    hold on;

    y=x.²;

    mesh(x,y,z)

    hold on;

    x=y.²;

    mesh(x,y,z)

    ```


    在同一轴上表示抛物线 $y²=x$ 和 $x²=y$。同样在同一轴上表示抛物线 $y²=4x$ 和直线 $x+y=3$。


    ```matlab

    fplot(''\[x²,sqrt(x)\]'',\[0,1.2])

    fplot(''\[(4\*x)^(1    /2),3-x\]'',\[0,4,0,4])

    ```


