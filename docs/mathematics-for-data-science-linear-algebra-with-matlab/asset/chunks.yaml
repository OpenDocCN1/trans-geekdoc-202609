    \n| --- | --- | --- |\n\n ![image](d2d_images/chapter_title_above.png) \n\n# \
    \ 3.4   EXPLICIT AND PARAMETRIC SURFACES CONTOUR LINES \n\n ![image](d2d_images/chapter_title_below.png)\
    \ \n\n   M    ATLAB incorporates    commands that allow the representation of\
    \ surfaces of equation    z=f(x,y)    .   The first step is to use the    meshgrid\
    \    command, which defines the matrix of points    (X,Y)    on which the function\
    \ is evaluated to represent it. \n\n The    surf    command is then used to perform\
    \ the surface representation. \n\n The    mesh    command is also used to represent\
    \ a mesh graph, which is defined by a function    z=f(x,y)    , such that the\
    \ surface points are represented on a grid, the result of lifting the values of\
    \    z    given by    f(x,y)    over the corresponding points in the    (x,y)\
    \    plane.   The appearance of a mesh graph is like a fishing net, with the surface\
    \ points on the knots of the net.   Actually, it is a surface graph whose graph\
    \ is in the form of a net. \n\n It is also possible to represent the contour lines\
    \ of a surface using the    contour    command.   These curves are characterised\
    \ by the fact that they are points    (x,y)    over which the value of    f(x,y)\
    \    is constant. \n\n The following table shows the MATLAB commands for representing\
    \ meshes, contour lines and surfaces in both explicit and parametric coordinates.\
    \ \n\n|  \\[X,Y\\] = meshgrid(x,y)  ––––––––  ![image](d2d_images/scene_break.png)\
    \  ||  Transforms the given definition field of the x and y variables of the function\
    \ to be represented z=f(x,y) into matrix arguments usable by the surf and mesh\
    \ commands to obtain surface and mesh plots, respectively.  |\n\n| --- | --- |\n\
    \n|  surf(X,Y,Z,C)  ––––––––  ![image](d2d_images/scene_break.png)  ||  Represents\
    \ the explicit surface z=f(x,y) or the parametric x=x(t,u), y=y(t,u), z=z(t,u),\
    \ drawing with the colours specified in C.   The argument C can be ignored.  >>\
    \ \\[X,Y\\] = meshgrid(-2:.2:2, -2:.2:2);  Z = X .\\* exp(-X.^2 - Y.^2);surf(X,Y,Z)\
    \  ![image](d2d_images/image011.png) |\n\n|  surfc(X,Y,Z,C)  ––––––––  ![image](d2d_images/scene_break.png)\
    \  ||  Represents the explicit surface z=f(x,y) or the parametric x=x(t,u), y=y(t,u),\
    \ z=z(t,u), together with the corresponding contour plot (contour lines projected\
