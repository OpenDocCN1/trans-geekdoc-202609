    # 1.7.1 向量元素


    ![image](img/chapter_title_below.png)


    MATLAB 允许使用以下命令选择向量元素：


    | `x(n)` | 返回向量 `x` 的第 `n` 个元素 | `X=(2:8)` `X = 2 3 4 5 6 7 8` `X(3)` `ans = 4`
    |

    | --- | --- |

    | `x(a:b)` | 返回向量 `x` 中从 `a` 到 `b` 之间的元素（包含边界） | `X(3:5)` `ans = 4 5 6` |

    | `x(a:p:b)` | 返回向量 `x` 中从 `a` 到 `b` 之间的元素（包含边界），且元素相差 `p` 单位 | `X(1:2:6)` `ans
    = 2 4 6` |

    | `x(b:-p:a)` | 返回向量 `x` 中从 `b` 到 `a` 之间的元素（包含边界），且元素相差 `p` 单位并从 `b` 开始 | `X(6:-2:1)`
    `ans = 6 4 2` |

