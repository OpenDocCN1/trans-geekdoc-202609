    | | | | | |

    | 尝试通过对称 LQ 方法求解系统 `Ax=b`。 | 指定容差求解 `Ax=b` | 指定容差和最大迭代次数求解 `Ax=b` | 求解系统 `inv(M)*A*x
    = inv(M)*b` | 使用 `M=M1*M2` 求解系统 `inv(M)*A*x = inv(M)*b` | 使用 `M=M1*M2` 且初值 `x0`
    求解系统 `inv(M)*A*x = inv(M)*b` | 求解系统且 `f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞和 4=极极端数值）。它还返回相对残差
    `norm(b-A*x)/norm(b)`。同时也返回迭代次数。 |


    ```matlab

    >> A=[pi 2*pi 3*pi-pi; 1 0 -1 2; exp(1) exp(2) exp(3) exp(4); i 2i 3i -i];

    >> B=[1 2 3 4]'';

    >> [x,f,r,i]=symmlq(A,B, 1e-006,1000)

    x = 0.0121 -0.0004i 0.0035 -0.0001i 0.1467 -0.0061i 0.0001 + 0.0039i

    f = 1

    r = 0.8325

