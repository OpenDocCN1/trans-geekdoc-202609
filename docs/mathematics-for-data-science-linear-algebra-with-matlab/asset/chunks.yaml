    # 1.6 实数与实变数函数


    ![image](img/chapter_title_below.png)


    实数是有理数和无理数的不交并集。有理数的形式为 `p/q`，其中 `p` 是一个整数而 `q` 是另一个整数。MATLAB 对有理数的处理方式与大多数计算器不同。有理数是整数的商，MATLAB
    也可以以精确模式对它们进行处理，使得涉及有理数的表达式的结果始终另一个有理数或整数。为了实现这一点，需要使用 `format rat` 命令激活有理数格式。如果用户需要，MATLAB
    也可以通过激活其他类型的格式（例如 `format short` 或 `format long`）返回结果的十进制近似值。考虑以下示例：


    ```matlab

    >> format rat;

    >> 1/6+1/5-2/10

    ans = 1/6

    ```


    ```MATLAB 将有理数视为整数的商，并在计算过程中保持这种形式。通过这种方式，分式计算中的舍入误差不会累积，这在“误差理论”中显示是非常严重的。一旦启用有理数格式，对有理数的操作将是精确的，直到启用不同的格式。当启用有理数格式时，浮点数（即带有小数点的数）被解释为精确值，MATLAB
    通过用有理数表示结果将整个表达式视为精确有理数。反，如果有理表达式中存在无理数，MATLAB 会将其匹配到最接近的分数以进行有理格式计算。考虑以下示例：


    ```matlab

    >> format rat;

    >> 2.64/25+4/100

    ans = 91/625


    >> 2.64/sqrt(25)+4/100

    ans = 71/125


    >> sqrt(2.64)/25+4/100

    ans = 204/1943

    ```


    MATLAB 也通过尽可能准确或按照用户要求的精度表示结果来处理无理数，同时考虑到无理数无法精确表示为两个整数之比的注意事项。如下所示：


    ```matlab

    >> sqrt(235)

    ans = 15.3297

    ```


    MATLAB 提供了一些非常典型的实常数，其表示方式如下：


    | `pi` | 数字 π= 3.1415926 >> `2*pi` `ans = 6.2832` |

    | --- | --- |

    | `exp(1)` | 数字 e = 2.7182818 >> `exp(1)` `ans = 2.7183` |

    | `inf` | 无穷大（例如 `1/0`） >> `1/0` `ans = Inf` |

    | `NaN` | 不确定（例如 `0/0`） >> `0/0` `ans = NaN` |

    | `realmin` | 最小正实数 >> `realmin` `ans = 2.2251e-308` |

    | `realmax` | 最大正实数 >> `realmax` `ans = 1.7977e+308` |


    MATLAB 有了一系列预定义的实数函数，这些函数适用于有理、无理和整数型变量。其中最重要的函数将在接下来的章节介绍。


