    \ \n\n   T    he real numbers are    the disjoint union of the rational numbers\
    \ and the irrational numbers.   A rational number is of the form    p/q    , where\
    \    p    is an integer and    q is    another integer.   MATLAB's treatment of\
    \ rationals is different from that of most calculators.   Rational numbers are\
    \ quotients of integers, and MATLAB can also work with them in exact mode, so\
    \ that the result of expressions involving rational numbers is always another\
    \ rational number or integer.   To do this, it is necessary to activate the rational\
    \ format with the    format rat    command.   MATLAB also returns decimal approximations\
    \ of the results if the user so desires, by activating any other type of format\
    \ (for example,    format short    or    format long    ).   Consider the following\
    \ example: \n\n > format rat; \n\n >> 1/6+1/5-2/10 \n\n ans = \n\n 1/6 \n\n MATLAB\
    \ is dealing with rationals as quotients of integers and keeps them in this form\
    \ during calculations.   In this way, rounding errors are not carried over in\
    \ calculations with fractions, which can be very serious, as shown in Error Theory.\
    \   Once the rational format is enabled, operations with rationals will be exact\
    \ until a different format is enabled.   When the rational format is enabled,\
    \ a floating-point number, that is, a number with a decimal point, is interpreted\
    \ as exact and MATLAB treats the whole expression as exact rational by representing\
    \ the result in rational numbers.   In turn, if there is an irrational number\
    \ in a rational expression, MATLAB matches it to the closest fraction to work\
    \ in rational format.   Consider the following examples: \n\n >> format rat; \n\
