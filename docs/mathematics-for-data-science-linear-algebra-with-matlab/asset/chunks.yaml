    # 2.1 复数


    ![image](img/chapter_title_below.png)


    MATLAB 通过用符号 `i` 或 `j` 表示虚数单位，简单地实现了对二项式形式复数的操作。


    我们已经知道，二项式形式的复数表示为 `a+bi` 或 `a+bj`。在虚数单位之前没有包含乘法符号（星号），尽管包含了它，一切也能正常工作。你必须记住的是，不能在虚部数字与虚数单位
    `i` 之间插入空格。


    复数可以具有符号实部或符号虚部或两者兼有，其操作可以在精确模式或小数模式下进行，并通过 `format` 命令设置精度。因此，也可以通过 `format rat`
    命令以精确有理数格式处理复数。


    对于复数的常用运算（加、减、乘、除和幂），它们是按照通常的方式执行的。图 2-1 显示了示例。


    显然，由于实数是复数的子集，复变量函数对于实变量也有效。


