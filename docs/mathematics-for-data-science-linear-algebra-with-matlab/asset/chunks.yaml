    # GRAPHICS


    ATLAB is a scientific software that implements high performance graphics. It allows
    simple exploratory data analysis plots in two and three dimensions, curve plots
    in explicit, implicit and polar coordinates, surface plots in explicit, implicit
    and parametric coordinates, mesh and contour plots, volume plots and specialised
    plots.


    It is also possible to choose windows and positions for graphs, to choose line
    and marker characteristics, to place axis limits, marks and meshes, to place annotations,
    labels and legends, to export graphs to different formats and other possibilities
    that will be shown throughout the chapter.


    # 3.1 EXPLORATORY DATA CHARTS


