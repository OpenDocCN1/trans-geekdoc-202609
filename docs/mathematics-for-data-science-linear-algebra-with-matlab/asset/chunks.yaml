    according to the colours $C$ and the area of each marker $S$. It is also possible
    to obtain the filled graph (fill option) and use different types of markers. |
    >> `x=(0:0.1:4); scatter(x,cos(x))` >> `x=(0:0.1:pi); scatter3(x,cos(x),sin(x))`
    !([image](d2d_images/image151.png) |


    ### 3.7 2D AND 3D GRAPH OPTIONS


    MATLAB presents many possibilities for handling graphical options such as titles,
    labels, viewpoint, etc. The following table presents the most important.


    | `title(''text'')` | Adds text as chart title at the top of the chart in 2-D
    and 3D charts |

    | `xlabel(''text'')` | Places text to x-axis in 2-D and 3D graphics |

    | `ylabel(''text'')` | Places the text to the y-axis in 2-D and 3D graphics |

    | `zlabel(''text'')` | Places text to z-axis on a 3-D graphic |

    | `clabel(C,h)` | Rotate labels and place them inside the contour lines |

    | `clabel(C,h,v)` | Creates labels only for the contour levels given by the vector
    $v$ and rotates them inside the contour lines |

    | `datetick(axis)` | Label the marks on the specified axis (''x'', ''y'' or ''z'')
    based on the maximum and minimum of the specified axis |

    | `datetick(axis, date)` | Label the specified axis marks (''x'', ''y'' or ''z'')
    with the given date format (an integer between 1 and 28) |

    | `legend(''string1'', ''string2'',...)` | Places the legends specified by the
    strings in $n$ consecutive graphs |

    | `legend(h, ''string1'', ''string2'',...)` | Places the legends specified by
    the strings in the managed graphics according to the vector $h$ |

    | `legend(''off'')` | Removes legends from current axes |

    | `text(x,y,''text'')` | Places the text at the point $(x,y)$ within the 2-D graphic
    |

    | `text(x,y,z,''text'')` | Places the text at the point $(x,y,z)$ on the 3-D graphic
    |

    | `gtext(''text'')` | Allows text to be positioned at a point selected with the
    mouse within a 2-D graphic |

    | `grid` | Places grids on the axes of a 2-D or 3-D chart. The grid on option
    places the grids and greed off removes them. The grid option toggles between on
    and off |

    | `hold` | Allows you to keep the existing chart with all its properties, so that
    the next chart you make will be on the same axes and overlay the existing one.
    The hold on option activates the option and hold off removes it. The hold option
    switches between on and off. Valid for 2-D and 3-D |

    | `axis([xmin xmax ymin ymax ymax zmin zmax])` | Places the maximum and minimum
    values for the X, Y and Z axes on the current graph |

    | `axis(''auto'')` | Set the axes to the default automatic scale (given by $xmin
    = min(x), xmax = max(x)$ and $y$ free) |

    | `axis(axis)` | Freezes the axis scaling at the current limits, so that when
    another graph is placed on the same axes (with hold on) the scale does not change
    |

    | `V=axis` | Gives the 4-element vector $V$, containing the scale of the current
    graph |

    | `axis(''xy'')` | Places Cartesian coordinates with the origin at the bottom
    left of the graph |

    | `axis(''tight'')` | Places the limits of the axes in the range of the data |

    | `axis(''ij'')` | Places coordinates with the origin at the top left of the graph
    |

    | `axis(''square'')` | Turns the plotting rectangle into a square, so that the
    figures are bulged |

    | `axis(''equal'')` | Set the same scale factor for both axes |

    | `axis(''normal'')` | Remove the square and equal options |

    | `axis(''off'')` | Remove labels and marks from axes and grids, keeping the chart
    title and texts placed on it with text and gtext |

    | `axis(''on'')` | Replace labels, markings and axle grids |

    | `subplot(m,n,p)` | Divide the graph window into $mxn$ subwindows and place the
    current graph in the $p$-th window, starting from the top left and counting from
    left to right until the end of the line, and move on to the next one |

