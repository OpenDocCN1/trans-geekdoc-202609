    # 3.2 CURVES IN EXPLICIT, IMPLICIT, PARAMETRIC AND POLAR CO-ORDINATES


    ![image](d2d_images/chapter_title_below.png)


    The most important MATLAB commands for representing two-dimensional curves in
    explicit, implicit and polar coordinates are presented in the following table.


    | `plot(X,Y)` | Draw the set of points `(X,Y)`, where `X` and `Y` are row vectors.
    To plot a function `y=f(x)` it is necessary to know a set of points `(X,f(X))`,
    for which a vector variation interval `X` for the variable `x` must be defined
    initially. `X` and `Y` can be matrices of the same dimension, in which case a
    graph is made for each pair of rows and on the same axes. For complex values of
    `X` and `Y` the imaginary parts are ignored. For `x = x(t)` and `y = y(t)` with
    the given variation of `t`, graph the specified parametric plane curve >>

    ```matlab

    x=0:0.1:6\*pi; y=x.\*sin(x); plot(x,y)

    ```

    ![image](d2d_images/image038.png) |

    | --- | --- |

    | `plot(Y)` | Plots the elements of the vector `Y` against their indices, i.e.
    it gives the graph of the set of points `(t,y)` `t=1,2,...n (n=length(Y))`. It
    is useful for plotting time series. If `Y` is a matrix, `plot(Y)` plots a graph
    for each column of `Y`, presenting them all on the same axes. If components of
    the vector `Y` are complex, `plot(Y)` is equivalent to `plot(real(Y),imag(Y))`.
    >>

    ```matlab

    Y=[1,3,9,27,81,243]; plot(Y)

    ```

    ![image](d2d_images/image143) |

    | `plot(X,Y,S)` | Plot `X,Y` with the options defined in `S`. Usually `S` consists
    of two digits in single quotes, the first of which sets the colour of the plot
    line and the second the character used in the plot. The possible values of colours
    and characters are, respectively, following: `y` (yellow), `m` (magenta), `c`
    (cyan), `r` (red), `b` (blue), `w` (white), `k` (black), `.` (dots), `o` (circles),
    `x` (x-marks), `+` (plus sign), `-` (solid), `*` (stars), `:` (colon), `--` (dashes)
    and `-.` (semi-solid). >>

    ```matlab

    plot([1,2,3,4,5,6,7,8,9],[1/2,3/4,5/6,7/8,9],''r'')

    ```

    ![image](d2d_images/image102.png) |

    | `plot(X1,Y1,S1,X2,Y2,S2)` | It combines, on the same axes, the graphs defined
    for triplets `(Xi,Yi,Si)`. This is a way of representing several functions on
    the same graph. |

    | `fplot(''f'',xmin,xmax)` | Graph the explicit function `y=f(x)` on the given
    interval of variation of `x`. >>

    ```matlab

    fplot(''x\*sin(1/x)'',[0,pi/16])

    ```

    ![image](d2d_images/image058.png) |

    | `fplot(''f'',xmin,xmax,ymin,ymax)` | Plots the explicit function `y=f(x)` on
    the given `x` and `y` intervals, with the colour and character choices by `S`.
    >>

    ```matlab

    fplot(''x^2/(x+1)'',[-12,12,-8,8])

    ```

    ![image](d2d_images/image133.png) |

    | `fplot(''f'',xmin,xmax,...,t)` | Graph `f` with tolerance `t`. |

    | `fplot(''f'',xmin,xmax,...,n)` | Plot `f` with tolerance `t` as at least `n+1`
    points. |

    | `fplot(''f1,f2,...,fn'',xmin,xmax,ymin,ymax,S)` | Graph the functions `f1, f2,
    ..., fn` on the same axes in the specified ranges of variation of `x` and `y`
    with the specified colour and character defined in `S`. >>

    ```matlab

    fplot(''sin(x), sin(2\*x), sin(3\*x)'',[0,2\*pi])

    ```

    ![image](d2d_images/image036.png) >>

    ```matlab

    fplot(''sin(x), sin(2\*x), sin(3\*x)'',[0,2\*pi],''k'')

    ```

    ![image](d2d_images/image141.png) |

    | `ezplot(''f'',xmin,xmax)` | Plots the explicit function `y=f(x)` or implicit
    function `f(x,y)=k` on the given interval of variation of `x`. The interval of
    variation of the variable may be omitted. >>

    ```matlab

    ezplot(''y\*x^2+x\*y^2=10'',[-10,10])

    ```

    ![image](d2d_images/image095.png) >>

    ```matlab

    ezplot(''x^2/(x^2-1)'')

    ```

    ![image](d2d_images/image023.png) |

    | `ezplot(''f'',xmin,xmax,ymin,ymax)` | Graph the explicit function `y=f(x)` or
    implicit function `f(x,y)=k` on the given (or not given) intervals of variation
    of `x` and `y`. >>

    ```matlab

    ezplot(''x^2+y^3=1/2'',[-10,10,-8,8])

    ```

    ![image](d2d_images/image109.png) >>

    ```matlab

    ezplot(''x^2-y^4=1'')

    ```

    ![image](d2d_images/image007.png) |

    | `ezplot(x,y)` | Graph the plane parametric curve `x=x(t)` and `y=y(t)` over
    the domain `0 < t < 2`. >>

    ```matlab

    ezplot(''4\*cos(t)-cos(4\*t)'', ''4\*sin(t)-sin(4\*t)'')

    ```

    ![image](d2d_images/image105.png) |

    | `ezplot(''f'',xmin,xmax)` | Graph the parametric plane curve `x=x(t)` and `y=y(t)`
    over the domain `xmin < t < xmax`. >>

    ```matlab

    ezplot(''t\*sin(t)'', ''t\*cos(t)'',[-4\*pi,4\*pi])

    ```

    ![image](d2d_images/image117.png) |

    | `ezplot(''f'')` | Plot the curve `f` in implicit coordinates in `[-2, 2]`. >>

    ```matlab

    ezplot(''y^4-x^4-24\*y^2+25\*x^2=0'')

    ```

    ![image](d2d_images/image111.png) |

    | `loglog(X,Y)` | Performs graphs similar to `plot(X,Y)`, but with logarithmic
    scale on both axes. >>

    ```matlab

    x=0:0.1:pi; y=x.\*sin(x); loglog(x,y)

    ```

    ![image](d2d_images/image043.png) |

    | `semilogx(X,Y)` | It makes graphs similar to `plot(X,Y)`, but with logarithmic
    scale on the X-axis and normal scale on the Y-axis. >>

    ```matlab

    x=0:0.1:pi; y=x.\*sin(x); semilog(x,y)

    ```

    ![image](d2d_images/image084.png) |

    | `semilogy(X,Y)` | It makes graphs similar to `plot(X,Y)`, but with logarithmic
    scale on the Y-axis and normal scale on the X-axis. >>

    ```matlab

    x=0:0.1:pi; y=x.\*sin(x); semilogy(x,y)

    ```

    ![image](d2d_images/image078.png) |

    | `polar(α,r)` | Draw the curve in polar coordinates `r=r(α)` >>

    ```matlab

    t=0:0.1:2\*pi; r=sin(t).\*cos(t); polar(t,r)

    ```

    ![image](d2d_images/image021.png) |

    | `polar(α,r,S)` | Draw the curve in polar coordinates `r=r(α)` with the line
    style given by `S`. >>

    ```matlab

    t=0:0.05:2\*pi; r=sin(t).\*cos(t); polar(t,r,''\*r'')

    ```

    ![image](d2d_images/image080.png) |

    | `ezpolar(r)` `ezpolar(r,a,b)` | Draw the curve in polar coordinates `r=r(α)`
    with the field of variation of `α` `[0 2π]` if nothing is specified or between
    `a` and `b` if not specified. >>

    ```matlab

    ezpolar(''1+cos(t)'')

    ```

    ![image](d2d_images/image114.png) |

