    # 1.10 SYMBOLIC VARIABLES


    ![image](d2d_images/chapter_title_below.png)


    Until now, we have always handled numerical variables. However, MATLAB allows
    us to handle symbolic mathematical calculations, to manipulate formulas and algebraic
    expressions easily and quickly and to perform operations with them. However, to
    perform these tasks it is necessary to have MATLAB Symbolic Math Toolbox. For
    an algebraic variable or expression to be symbolic, it must first be declared
    as such with the `sym` command, or by inserting it in inverted commas. The following
    table shows the syntax of commands for conversion to variables and symbolic expressions.


    | `syms x y z...` | Converts the variables `x`, `y`, ..., `t` into symbolic variables.
    >> `syms x y` >> `x+y-6*y` ans = `2*x - 5*y` |

    | --- | --- |

    | `syms x and z...real` | Converts the variables `x`, `y`, ..., `t` to symbolic
    with real values >> `syms a b c real;` >> `A = [a b c; c a b; b c a].` `A = [a,
    b, c] [c, a, b] [b, c, a]` |

    | `syms x and z...unreal` | Converts the variables `x`, `y`, ..., `t` to symbolic
    variables with non-real values |

    | `syms` | List symbolic variables in the workspace >> `syms ''A'' ''a'' ''ans''
    ''b'' ''c'' ''x'' ''y'' ''a'' ''ans'' ''b'' ''c'' ''x'' ''y''` |

    | `y=sym(''x'')` | Converts variable or number `x` to symbolic (equivalent to
    `syms x`) >> `rho = sym(''(1 + sqrt(5))/2'')` `rho = 5^(1/2)/2 + 1/2` |

    | `y=sym(''x'',real)` | Converts `x` to a real symbolic variable |

    | `y=sym(''x'',unreal)` | Converts `x` to a non-real symbolic variable |

    | `S=sym(A)` | Creates a symbolic object from `A`, where `A` can be a string,
    a scalar, a matrix, a numeric expression, etc. >> `S=sym([0.5 0.75 1; 0 0.5 0.1;
    0.2 0.3 0.4])` `S = [1/2, 3/4, 1] [0, 1/2, 1/10] [1/5, 3/10, 2/5]` |

    | `S = sym(A,''option'')` | Converts the matrix, scalar or numeric expression
    `A` to symbolic according to the specified option. The option can be `''f''` for
    floating point, `''r''` for rational, `''e''` for error format and `''d''` for
    decimal. |

    | `numeric(x)` or `double(x)` | Converts the variable or expression `x` to double
    precision numeric |

    | `pretty(expr)` | Converts symbolic expression to mathematical writing >> `pretty(rho)`
    `1/2 5 ——+ 2` |

    | `digits` | Gives current accuracy for symbolic variables >> `digits` `Digits
    = 32` |

    | `digits(d)` | Sets the precision of symbolic variables to `d` decimal >> `digits(25)`
    `Digits = 25` |

    | `vpa(''expr'')` | Numerical result of the expression with the decimal digits
    >> `phi = vpa(''(1+sqrt(5))/2'')` `phi = 1.6180398874989484204587` |

    | `vpa(''expr'', n)` | Numerical result of the expression with `n` decimal digits
    >> `phi = vpa(''(1+sqrt(5))/2'',10)` `phi = 1.618039889` |

    | `vpa(expr, n)` | Numerical result of the expression with `n` decimal digits
    >> `phi = vpa((1+sqrt(5))/2,20)` `phi = 1.6180398874989484204587` |


    # 1.11 SYMBOLIC FUNCTIONS AND FUNCTIONAL OPERATIONS. COMPOSITE AND INVERSE FUNCTIONS


    ![image](d2d_images/chapter_title_below.png)


    In MATLAB it is possible to define custom functions of one and several variables
    using the syntax `f=''function''`. The syntax `f=function` can also be used if
    all variables have been previously defined as symbolic with `syms`. It is then
    possible to make substitutions in their arguments according to the notation presented
    in the following table.


    | `f=''function''` | Defines the function `f` as symbolic >> `f1=''x^3''.` `f1
    = x^3` >> `f2=''z^2+2*2\*t''.` `f2 = z^2+2*t` >> `syms x z t` >> `g1=x^2` `g1
    = x^2` >> `g2=sqrt(x+2*z+exp(t))` `g2 = (x + 2*z + exp(t))^(1/2)` |

    | --- | --- |

    | `subs(f,a)` | Apply the function `f` at point `a` >> `subs(f1,2)` `ans = 8`
