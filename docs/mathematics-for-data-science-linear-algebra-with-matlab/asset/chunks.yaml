    # Chapter 4. ALGEBRAIC EXPRESSIONS, POLYNOMIALS, EQUATIONS AND SYSTEMS


    ## 4.1 EXPANSION, SIMPLIFICATION AND FACTORISATION OF ALGEBRAIC EXPRESSIONS


    MATLAB incorporates a wide range of commands that allow you to work with algebraic
    expressions. It is possible to simplify an expression as much as possible, expand
    it or factor it appropriately. The following table presents the most common commands
    for working with algebraic expressions.


    | Command | Description |

    | --- | --- |

    | `expand(expr)` | Expands an algebraic expression as much as possible, fully
    realising products and powers, until the result is presented as a sum. Applies
    multiple angle rules for trigonometric expressions and formally applies properties
    of logarithmic and exponential functions. Also decomposes algebraic fractions
    into sums. |

    | `factor(expr)` | Writes an expanded algebraic expression as a product of factors
    (inverse of `expand`). The factorisation defaults to the body of the expression.
    For algebraic fractions, factor numerator and denominator and simplify common
    factors. |

    | `simplify(expr)` | Simplifies an algebraic expression as much as possible by
    performing final sums and performs addition of algebraic fractions. |

    | `simple(expr)` | Simplifies the algebraic expression as much as possible by
    showing the rules that are used. |

    | `collect(expr)` | Presents the result of the expression by grouping terms in
    powers of their variables. |

    | `horner(expr)` | Factor the expression in its Horner form. |


    ## 4.2 POLYNOMIAL


    MATLAB implements specific commands for working with polynomials such as finding
    their roots, differentiation and interpolation. The following table presents the
    syntax and examples of the most important commands involving polynomials.


    | Command | Description |

    | --- | --- |

    | `poly2sym(vector)` | Converts the vector into a symbolic polynomial whose coefficients
    are the components of the vector (from highest to lowest power). |

    | `poly2sym(vector,''v'')` | Converts the vector to a symbolic polynomial in the
    variable `v` whose coefficients are the components of the vector. |

    | `sym2poly(polynomial)` | Converts the polynomial to a vector whose components
    are its coefficients. |

    | `q=conv(u,v)` | Give the coefficients of the polynomial product of the two polynomials
    whose coefficients are given by the vectors `u` and `v`. |

    | `[q,r] = deconv(v,u)` | Give the polynomial quotient and remainder of the division
    between the polynomials `u` and `v`. We have `v = conv(u,q)+r`. |

    | `p = poly(r)` | Gives the coefficients of the polynomial `p` whose roots are
    the vector `r`. |

