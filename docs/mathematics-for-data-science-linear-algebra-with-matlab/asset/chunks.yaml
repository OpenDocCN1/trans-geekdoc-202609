    # 插值方法


    `Y = interpft(X,n)`, `y = interpft(x,n,dim)`

    使用 FFT 方法进行一维插值。它给出向量 `Y`，其中包含在 `n` 个等间隔点上采样的周期函数 `X` 的值。原始向量 `X` 使用快速傅里变换 `FFT`
    转换傅里叶频率域。沿指定的维度操作。展示了一个示例，比较了原始点与通过 FFT 方法插值的点。


    ```matlab

    y = [0:.5:2 1.5:-.5:-2 -1.5:.5:0]; % 等间距的点

    factor = 5; % 因子为 5 的插值

    m = length(y)*factor;

    x = 1:factor:m;

    xi = 1:m;

    yi = interpft(y,m);

    plot(x,y,''o'',xi,yi,''\*'')

    legend(''original data'',''interpolated data'')

    ```

    ![image](img/image118.png)


    `Vi = interpn(X,Y,Z,...V,Xi,Yi,Zi...)`

    `Vi = interpn(V,Xi,Yi,Zi)`, `Vi = interpn(V,n)`, `Vi = interpn(...,method)`

    给出向量 `Vi`，使得 `(Xi,Yi, Zi,...)` 是通过对三维函数 `V` 应用于 `(X,Y,Z,...)` 后进行 `n` 维插值得到的点集。假设
    `X=1:n`, `Y=1:m`, `Z=1:p,...` 且 `(n,m,p,...) = size V`。递归进行 `n` 次 `n` 维插值。使用指定的方法进行插值。

    ![image](img/scene_break.png)


    `Yi = pchip(X,Y,Xi)`

    `pp = pchip(X,Y)`

    给出向量 `Yi`，使得 `(Xi,Yi)` 是通过分段埃米三次多项式插值 (PCHIP) 对给定点集 `(X,Y)` 得到的点集。在中间点处执行插值。


    `Yi = spline(X,Y,Xi)`

    `pp = spline(X,Y)`

    给出向量 `Yi`，使得 `(Xi,Yi)` 是通过三次样条插值对给定点集 `(X,Y)` 得到的点集。在中间点处执行插值。展示了一个示例，比较了原始点与通过
    `pchip` 和 `spline` 方法插值的点。


    ```matlab

    x = -3:3;

    y = [-1 -1 -1 0 1 1 1];

    t = -3:.01:3;

    plot(x,y,''o'',t,[pchip(x,y,t); spline(x,y,t)])

    legend(''data'',''pchip'',''spline'',4)

    ```

    ![image](img/image079.png)


    `Zi = griddata(X,Y,Z,Xi,Yi)`

    `[Xi,Yi,Zi] = griddata(X,Y,Z,Xi,Yi)`, `[...] = griddata(...,method)`

    在向量空间 `(X,Y,Z)` 中拟合一个形式为 `Z=f(X,Y)` 的表面。向量 `Zi` 确定给定点 `(X,Y,Z)` 之间的插值点 `(Xi,Yi,Zi)`。使用反距离法进行插值。除了
    `Xi` 之外，还给出行列向量 `Yi` 和 `Zi`。使用指定的方法进行插值。以下是一个表面插值调整的示例。


