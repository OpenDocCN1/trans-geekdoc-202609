  \ a²;1, -a;0, 0])` `B = [1, a²; 1, -a; 0, 0]` >> `eig(A)` `ans = 2.4021 -0.0346\
  \ -0.7158 -0.4400` >> `eig(B)` `ans = 0 1+a` |\n| --- | --- |\n| `[V,D] = eig(A)`\
