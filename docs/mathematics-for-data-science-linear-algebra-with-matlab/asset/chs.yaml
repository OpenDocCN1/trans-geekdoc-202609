  \ !(image |\n\n### 2D 和 3D 图形选项\n\nMATLAB 提供了许多处理标题、标签、视角等图形选项。下表列出了最重要的。\n\n| 命令\
  \ | 说明 |\n| :--- | :--- |\n| `title('text')` | 在 2D 和 3D 图表顶部添加文本作为标题 |\n| `xlabel('text')`\
  \ | 在 2D 和 3D 图形中的 x 轴上放置文本 |\n| `ylabel('text')` | 在 2D 和 3D 图形中的 y 轴上放置文本 |\n\
  | `zlabel('text')` | 在 3D 图形中的 z 轴上放置文本 |\n| `clabel(C,h)` | 旋转标签并置于等高线内部 |\n| `clabel(C,h,v)`\
  \ | 为向量 $v$ 给出的等高线创建标签并置于等高线内部 |\n| `datetick(axis)` | 根据指定轴的最大值最小值标记指定轴 ('x', 'y'\
  \ 或 'z') |\n| `datetick(axis, date)` | 使用给定的日期格式（1 到 28 之间的整数）标记指定轴 ('x', 'y' 或\
  \ 'z') |\n| `legend('string1', 'string2',...)` | 在连续 $n$ 个图中放置字符串指定的图例 |\n| `legend(h,\
  \ 'string1', 'string2',...)` | 根据向量 $h$ 在管理的图中放置字符串指定的图例 |\n| `legend('off')` |\
  \ 移除当前轴的图例 |\n| `text(x,y,'text')` | 在 2D 图形中的点 $(x,y)$ 放置文本 |\n| `text(x,y,z,'text')`\
  \ | 在 3D 图形中的点 $(x,y,z)$ 放置文本 |\n| `gtext('text')` | 在 2D 图形中通过鼠标选择的点放置文本 |\n| `grid`\
  \ | 在 2D 或 3D 图表的轴上放置网格。`grid on` 选项放置网格，`grid off` 移除它们。`grid` 选项在开启和关闭之间切换 |\n\
  | `hold` | 允许你保留现有图形及其所有属性，以便制作的图形位于相同的轴上并覆盖现有图。`hold on` 选项激活该选项，`hold off` 移除。`hold`\
  \ 选项在开启和关闭之间切换。适用于 2D 和 3D |\n| `axis([xmin xmax ymin ymax zmin zmax])` | 在当前图中放置\
  \ X、Y 和 Z 轴的最大值最小值 |\n| `axis('auto')` | 将轴设置为默认自动缩放（由 $xmin = min(x), xmax = max(x)$\
  \ 给出且 $y$ 自由） |\n| `axis(axis)` | 冻结轴缩放为当前限制，以便当另一个图放置在相同轴上（开启 hold）时，缩放不会发生变化 |\n\
  | `V=axis` | 给出一个 4 元素向量 $V$，包含当前图的缩放 |\n| `axis('xy')` | 将笛卡尔坐标原点放在图左下角 |\n| `axis('tight')`\
  \ | 将轴限制放置在数据范围内 |\n| `axis('ij')` | 将坐标原点放在图左上角 |\n| `axis('square')` | 将绘制矩形变为正方形，使图形凸起\
  \ |\n| `axis('equal')` | 为两个轴设置相同的缩放因子 |\n| `axis('normal')` | 移除正方形和相等选项 |\n| `axis('off')`\
  \ | 移除轴和网格上的标签和标记，保留通过 `text` 和 `gtext` 放置在上面的标题和文本 |\n| `axis('on')` | 替换标签、标记和轴网格\
  \ |\n| `subplot(m,n,p)` | 将图形窗口划分为 $mxn$ 子窗口并将当前图放置在第 $p$ 个窗口中，从左上开始从左到右计数直到行尾，然后移动到下一个\
  \ |\n\n\n\n\n\n### 图形命令\n\n- `plottyy(X1,Y1,X2,Y2)`\n- `plottyy(X1,Y1,X2,Y2, 'function')`\n\
  - `plottyy(X1,Y1,X2,Y2, 'function1','function2')`\n  在左侧绘制 `X1` 对 `Y1` 的图，在右侧绘制\
  \ `X2` 对 `Y2` 的图。与之前的命令相同，但函数可以是 `plot`、`loglog`、`semilogx`、`semilogy`、`item` 或任何\
  \ `h=function(x,y)`。与之前的命令相同，但每对 `(XiYi)` 使用每个函数 `fi`。\n\n- `axis([xmin xmax ymin\
  \ ymax zmin zmax])`\n  在指定值处设置轴的变化范围。它还接受 `'ij'`、`'square'`、`'equal'` 等选项，与之前看到的二维选项相同。\n\
  \n- `view([x,y,z])`\n  将图形的视角放置在笛卡尔坐标点 `(x,y,z)`处。\n\n- `view([az, el])`\n  将图形的视角放置在方位角（水平旋转）\
  \ `'az'` 和仰角（垂直仰角） `'el'`处。\n\n- `hidden`\n  控制图表中隐藏线的显示。`hidden on` 显示隐藏线，`hidden\
  \ off` 隐藏。\n\n- `shading`\n  控制用 `surf`、`mesh`、`pcolor`、`fill` 和 `fill3` 命令创建的面的着色类型。`shading\
  \ flat` 选项设置光滑着色，`shading interp` 选项设置密集着色，`shading faceted` 选项（默认选项）设置普通着色。\n\n\
  - `colormap(M)`\n  将矩阵 `M` 作为当前颜色映射。`M` 必须有三列，且包含仅位于 0 到 1 之间的值。它也可以是一个行向量为 RGB\
  \ 类型 `[r g b]` 的矩阵。MATLAB 中已经定义了矩阵 `M`，例如：`bone(p)`、`contrast(p)`、`cool(p)`、`copper(p)`、`flag(p)`、`gray(p)`、`hsv(p)`、`hot(p)`、`jet(p)`、`pink(p)`、`prism(p)`\
  \ 和 `white(p)`。所有矩阵都有 3 列和 `p` 行。例如，语法 `colormap(hot(8))` 将 `hot(8)` 矩阵设置为当前颜色映射（当前图形的完整颜色系统）。\n\
  \n- `brighten(p)`\n  调整图形的亮度。如果 `0<p<1`，图形将变亮；如果 `-1<p<0`，图形将变暗。`p` 的范围是 `(-1,1)`，随着\
  \ `p` 的值接近 `-1`，图形变暗，而随着 `p` 的值接近 `1`，图形变亮。\n\n- `image(A)`\n  生成一个二维图像，其亮度与矩阵 `A`\
  \ 的元素成正比，用于显示适应矩阵 `A` 中给定亮度的照片和绘图。矩阵 `A` 的每个元素 `(m,n)` 影响图形中的一个单元格。\n\n- `pcolor(A)`\n\
  \  生成一个颜色与矩阵 `A` 的元素成正比的二维图形，用于显示具有不同颜色抽象数学对象。矩阵 `A` 的每个元素 `(m,n)` 影响图形中的一个网格。\n\
  \n- `caxis([cmin cmax])`\n  为图形设置颜色比例（由 `colormap` 定义，并通过网格与轴上的划分相关）的最小值和最大值。因此，它允许图形使用\
  \ `colormap` 定义的颜色子集。\n\n- `figure(h)` 或 `h=figure`\n  创建一个名为 `h` 的图形并将其作为普通图形。`gcf(h)`\
  \ 命令用于引用图形 `h` 的任何属性。`close(h)` 关闭图形 `h`。`whitebg(h)` 命令更改图形 `h` 的背景颜色。`clf` 命令清除当前图形。`graymon`\
  \ 命令设置灰度。`newplot` 命令确定新图形。`refresh` 命令刷新图形。\n\n- `axes(e)` 或 `e=axes`\n  在当前图形创建一个名为\
  \ `e` 的轴。`gca(e)` 命令引用轴 `e` 的任何属性。`cla` 命令清除当前轴。\n\n- `l=line(x,y)` 或 `l=line(x,y,z)`\n\
  \  创建一个名为 `l` 的对象，连接平面 `(X,Y)` 或空间 `(X,Y,Z)` 点。\n\n- `p=patch(X,Y,C)` 或 `patch(X,Y,Z,C)`\n\
  \  由点 `(X,Y)` 或 `(X,Y,Z)` 定义的不多形区域，其颜色由 `C` 指定，作为对象 `p`。\n\n- `s=surface(X,Y,Z,C)`\n\
  \  由 `X`、`Y` 和 `Z` 定义的参数表面，其颜色由 `C` 指定，作为对象 `s`。\n\n- `i=image(C)`\n  通过矩阵 `C` 中的给定颜色创建图像\
  \ `i`。\n\n- `t=text(x,y,'string')` 或 `t=text(x,y,z,'string')`\n  由字符串定义的文本，位于平面点\
  \ `(x,y)` 或空间点 `(x,y,z)`。\n\n- `set(h, 'property1', 'property2', ...)`\n  在对象 `h`\
  \ 上设置指定的属性（`gca` 用于轴，`gcf` 用于图形，`gcbo`, `gcbd` 等）。\n\n- `get(h, 'property')`\n \
  \ 返回对象 `h` 给定属性的当前值。\n\n- `object=gco`\n  返回当前图形。\n\n- `rotate(h, [a, e], [p,r])`\n\
  \  沿方位轴 `a` 和仰角 `e` 旋转对象 `h` 角度 `α`，点为 `(p,q)`。\n\n- `reset(h)`\n  更新分配给对象 `h` 的属性并设置其默认属性。\n\
  \n- `delete(h)`\n  删除对象 `h`。\n\n### MATLAB 属性\n\n| 对象 | 属性 | 可能值 |\n| :--- | :---\
  \ | :--- |\n| **Figure** | Colour（背景颜色） | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`, `'b'`,\
  \ `'k'` |\n| | ColorMap（颜色映射） | `hot(p)`, `gray(p)`, `pink(p)`, .... |\n| | Position（位置）\
  \ | `[left, bottom, width, height]` |\n| | Name（名称） | 带有名称 |\n| | MinColorMap（颜色）\
  \ | 映射的最小颜色数 |\n| | NextPlot（后续绘图模式） | `new`, `add`, `replace` |\n| | NumberTitle（图形内标题）\
  \ | `on`, `off` |\n| | Units（单位） | `pixels`, `inches`, `points` |\n| | Resize（鼠标调整图形大小）\
  \ | `on`（可以更改），`off`（不更改） |\n| **Axes** | Box（图形框） | `on`, `off` |\n| | Colour（轴颜色）\
  \ | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`, `'b'`, `'k'` |\n| | GridLineStyle（网格线样式）\
  \ | `'-'`, `'—'`, `':'`, `'-.'` |\n| | Position（屏幕位置） | `[left, bottom, width, height]`\
  \ |\n| | TickLength（刻度长度） | 数值 |\n| | TickDir（刻度方向） | `in`, `out` |\n| | Units（单位）\
  \ | `pixels`, `inches`, `points` |\n| | View（视角） | `[azimuth, elevation]` [azimuth,\
  \ elevation] |\n| | FontAngle（字体角度） | `normal`, *italic*, *oblique* |\n| | FontName（字体名称）\
  \ | 带有来源的文本 |\n| | FontSize（字体大小） | 数值 |\n| | FontWeight（字体粗细） | `light`, `normal`,\
  \ `demi`, **bold** |\n| | DrawMode（绘制模式） | `normal`, `fast` |\n| | Xcolor, Ycolor,\
  \ Zcolor（轴颜色） | `[min, max]` `[min, max]` `[min, max]` `[min, max]` `[min, max]`\
  \ `[min, max]` |\n| | XDir, YDir, ZDir（轴方向） | `normal`（从左到右增长），`reverse`（反向） |\n\
  | | XGrid, YGrid, Zgrid（网格） | `on`, `off` |\n| | XLabel, YLabel, Zlabel（标签） | 带有标签内容的字符串\
  \ |\n| | XLim, YLim, Zlim（限制值） | `[min, max]`（变化范围） |\n| | XScale, YScale, ZScale（比例）\
  \ | `linear`（线性），`log`（对数） |\n| | XTick, YTick, ZTick（刻度） | `[m1,m2,...]`（轴上的刻度位置）\
  \ |\n\n\n\n\n\n### 属性参考表\n\n| 类别 | 属性 | 描述 |\n| :--- | :--- | :--- |\n| | `Xdata,Ydata,Zdata`\
  \ (坐标) | 线的坐标集 |\n| `Text` | `Colour` (文本颜色) | `'y'`, `'m'`, `'c'`, `'r'`, `'g'`,\
  \ `'b'`, `'w'`, `'k'`。 |\n| | `FontAngle` (字体角度) | 正常，斜体，倾斜 |\n| | `FontName` (字体名称)\
  \ | 带有字体名称的文本 |\n| | `FontSize` | 数值 |\n| | `FontWeight` (字体粗细) | 细、正常、半粗、粗体 |\n\
  | | `HorizontalAlignment` (水平对齐) | 左对、居中、右对 |\n| | `VerticalAlignment` (垂直对齐) |\
  \ 顶部、顶端、中间、基线、底部 |\n| | `Position` (屏幕上的位置) | `[x, y, z]` (位置点) |\n| | `Rotation`\
  \ (文本方向) | 0,± 90, ±180, ±270 |\n| | `Units` (测量单位) | 像素、英寸、厘米、点 |\n| | `String`\
  \ (要放置的文本字符串) | 带有文本的字符串 |\n| `Surface` | `Cdata` (每个点的颜色) | 颜色矩阵 |\n| | `Edgecolor`\
  \ (网格颜色) | `'y'`, `'m'`,..., none, flat, interp |\n| | `Facecolor` (面颜色) | `'y'`,\
  \ `'m'`,..., none, flat, interp |\n| | `LineStyle` (线型) | `'-'`, `'—'`, `':'`, `'-.'`,\
  \ `'+'`, `'*'`, `'.'`, `'x'` |\n| | `LineWidth` (线宽) | 数值 |\n| | `MeshStyle` (行和列中的线)\
  \ | 行、列、两者 |\n| | `Visible` (线在屏幕上是否可见) | 显示，关闭 |\n| | `Xdata,Ydata,Zdata` (坐标)\
  \ | 表面坐标集 |\n| `Patch` | `Cdata` (每个点的颜色) | 颜色矩阵 |\n| | `Edgecolor` (轴颜色) | `'y'`,\
  \ `'m'`,..., none, flat, interp |\n| | `Facecolor` (面颜色) | `'y'`, `'m'`,..., none,\
  \ flat, interp |\n| | `LineWidth` (线宽) | 数值 |\n| | `Visible` (线在屏幕上是否可见) | 显示，关闭\
  \ |\n| | `Xdata,Ydata,Zdata` (坐标) | 表面坐标集 |\n| `Image` | `Cdata` (每个点的颜色) | 颜色矩阵\
  \ |\n| | `Xdata,Ydata,Zdata` (坐标) | 图像坐标集 |\n\n### 示例说明\n\n让我们来看一些示例说明。\n\n```mat\n\
  x=linspace(0,2,30);\ny=sin(x.²);\nplot(x,y)\ntext(1,0.8, 'y=sin(x²)')\nhold on\n\
  z=log(sqrt(x));\nplot(x,z)\ntext(1,-0.1, 'y=log(x)')\nxlabel('X-axis');\nylabel('Y-axis');\n\
  title('Sine and logarithmic graph');\n```\n\n```matlab\nsubplot(2,2,1);\nezplot('sin(x)',-2*pi\
  \ 2*pi);\nsubplot(2,2,2);\nezplot('cos(x)',-2*pi 2*pi);\nsubplot(2,2,3);\nezplot('csc(x)',-2*pi\
  \ 2*pi);\nsubplot(2,2,4);\nezplot('sec(x)',-2*pi 2*pi);\n```\n\n```matlab\nX,Y=meshgrid(-2:.05:2);\n\
  Z=X.²-Y.²;\nsubplot(2,2,1);\nsurf(X,Y);\nsubplot(2,2,2);\nsurf(X,Y),view(-90,0);\n\
  subplot(2,2,3);\nsurf(X,Y),view(60,30);\nsubplot(2,2,4);\nsurf(X,Y),view(-10,30);\n\
  ```\n\n### 练习 1\n表示方程定义的表面：\n\n```matlab\nx,y=meshgrid(0:.05:2,-2:.05:2);\nz=y.²*(x-1).²./(y.²+(x-1).²;\n\
  mesh(x,y,z),view([-23,30]);\n```\n\n我们也可以以下方式表示表面：\n\n```matlab\nezsurf('y²*(x-1)²/(y²+(x-1)²)')\n\
  ```\n\n### 练习 2\n设 $f:R² \\to R$ 为由定义的函数：在 $(0,0)$ 环境中对其绘图。\n\n```matlab\nx,y=meshgrid(-1/100:0.0009:1/100,-1/100:0.0009:1/100);\n\
  z=(1-cos(x)).*sin(y)./(x.³+y.³);\nsurf(x,y,z)\nview([50,-15])\n```\n\n在同一图中相邻绘制极坐标曲线：表示它们的交点。\n\
  \n```matlab\na=0:.1:2*pi;\nsubplot(1,2,1);\nr=sqrt(cos(2*a));\npolar(a,r)\ntitle('\
  \ r = sqrt(Cos(2a))');\nsubplot(1,2,2);\nr=sin(2*a);\npolar(a,r)\ntitle(' r = Sen(2a)')\n\
  ```\n\n为了看到这两条曲线的交点，我们将它们都画在同一个轴上。\n\n```matlab\na=0:.1:2*pi;\nr=sqrt(cos(2*a));\n\
  polar(a,r)\nhold on;\nr=sin(2*a);\npolar(a,r);\n```\n\n### 练习 4\n绕 OX 轴旋转三次曲线 $12x\
  \ - 9x² + 2x³$ 生成的体积，范围在 $x=0$ 到 $x=5/2$ 之间。\n\n旋转面具有方程 $y²+z² = (12x-9x²+2x³$，可以通过以下方式参数化绘图：\n\
  \n```matlab\nt=(0:.1:5/2);\nu=(0:.1:2*pi);\nz=(12*t-9*t²+2*t³).*sin(u)\n```\n\n\
  绕 OX 轴和 OY 轴旋转椭圆生成的体积。我们在同一图中表示生成的图形，但只画正半部分。最终体积是该体积的两倍。图形 $y²+z²=9$ 的方程参数化如下：\n\
  \n```matlab\nt=(0:.1:2);\nu=(0:.1:2*pi);\nx=t, y=3*cos(u), z=3*sin(u)\nsurf(x,y,z)\n\
  ```\n\n### 练习 6\n表示抛物面 $x²+y²=2$ 与平面 $z=x+2$ 的交点。\n\n```matlab\nx,y=meshgrid(-3:.1:3);\n\
  z=x.²+y.²;\nmesh(x,y,z)\nhold on;\nz=x+2;\nmesh(x,y,z)\n```\n\n表示由抛物面 $x²+4y²=z$\
  \ 以及侧面方程 $y²=x$ 和 $x=y²$ 的圆柱面围成的体积。\n\n```matlab\nx,y=meshgrid(-1/2:.02:1/2,-1/4:.01:1/4);\n\
  z=x.²+4*y.²;\nmesh(x,y,z)\nhold on;\ny=x.²;\nmesh(x,y,z)\nhold on;\nx=y.²;\nmesh(x,y,z)\n\
  ```\n\n在同一轴上表示抛物线 $y²=x$ 和 $x²=y$。同样在同一轴上表示抛物线 $y²=4x$ 和直线 $x+y=3$。\n\n```matlab\n\
  fplot('\\[x²,sqrt(x)\\]',\\[0,1.2])\nfplot('\\[(4\\*x)^(1    /2),3-x\\]',\\[0,4,0,4])\n\
  ```\n\n\n\n\n\n### 练习 10. 在方程的隐式坐标中表示曲率：\n\n$x⁵ - x²y² + y⁵ = 0$\n\n$x⁴ + x²y -\
  \ y⁵ + y⁴ = 0$\n\n![image](img/scene_break.png)\n\n```\nezplot('x⁵-x²\\*y²+y⁵',\
  \ [-1,1,-1,1])\n```\n\n![image](img/image024.png)\n\n```\nezplot('x⁴+x²\\*y-y³+y⁴',\
  \ [-1/2,1/2,-1/2,3/2])\n```\n\n![image](img/image028.png)\n\n### 练习 11. 用参数坐标表示该曲线：\n\
