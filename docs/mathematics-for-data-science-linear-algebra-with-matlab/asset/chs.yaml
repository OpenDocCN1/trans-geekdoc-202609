  \ >> `ifft([1, 0, -23, 12, 16]) ans = Columns 1 through 3 1.2000 2.9687 -7.1579i\
  \ -3.0687 + 4.7765i Columns 4 through 5 -3.0687 -4.7765i 2.9687 + 7.1579i` |\n|\
  \ `ifft2(V)` | V 的离散二维维里叶变换逆变换 >> `ifft2([1-i 1+i 3-5i 6i]) ans = Columns 1 through\
  \ 3 1.2500 + 0.2500i 0.7500 + 1.2500i 0.7500 - 3.2500i Column 4 -1.7500 + 0.7500i`\
  \ >> `ifft2([1, 0, -23, 12, 16]) ans = Columns 1 through 3 1.2000 2.9687 -7.1579i\
  \ -3.0687 + 4.7765i Columns 4 through 5 -3.0687 -4.7765i2.9687 7.1579i` |\n\n###\
  \ 以复矩阵作为参数的基础函数\n\n上表中的函数也接受复矩阵 `Z` 作为参数，在这种情况下，结果是一个行向量，其分量是该矩阵每一列应用函数的结果。不要忘记这些函数对于实变量也是有效的，因为实数是虚部为零的复数的特殊情况。`max(Z)`\
  \ 矩阵的最大分量（复数计算 `max(abs(Z))`） >> `Z=[1-i 1+i; 3-5i 6i] ans = 6 6`\n\n`min(Z)` 矩阵的最小分量（复数计算\
  \ `min(abs(Z))`） >> `Z=[1-i 1+i; 3-5i 6i] ans = 1-i 1`\n\n`mean(Z)` 矩阵每一列分量的平均值\
  \ >> `mean([1-i 1+i; 3-5i 6i]) ans = 2.0000-2.0000i 3.5000-2.0000i`\n\n`median(Z)`\
  \ 矩阵每一列分量的位数 >> `median([1-i 1+i; 3-5i 6i]) ans = 2.0000-2.0000i 3.5000-2.0000i`\n\
  \n`std(Z)` 矩阵每一列分量的标准差 >> `std([1-i 1+i; 3-5i 6i]) ans = 1.4142 3.5355`\n\n`sort(Z)`\
  \ 按升序排列矩阵每一列的分量。对于复数，根据绝对值排序。 >> `sort([1-i 1+i; 3-5i 6i]) ans = 1-i 1+i; 3-5i 6i`\n\
  \n`sum(Z)` 矩阵每一列分量的和 >> `sum([1-i 1+i; 3-5i 6i]) ans = 4-6i 7+i`\n\n`prod(Z)` 乘积矩阵每一列的元素\
  \ >> `prod([1-i 1+i; 3-5i 6i]) ans = 2+2i 21-3i`\n\n`cumsum(Z)` 给矩阵每一列的累积和矩阵 >>\
  \ `cumsum([1-i 1+i; 3-5i 6i]) ans = 1-i 1+i; 4-6i 7+i`\n\n`cumprod(Z)` 给矩阵每一列的累积积矩阵\
  \ >> `cumprod([1-i 1+i; 3-5i 6i]) ans = 2+2i 21-3i`\n\n`diff(Z)` 给矩阵每一列分量的一阶差分矩阵\
  \ >> `diff([1-i 1+i; 3-5i 6i]) ans = 2-6i 5+5i`\n\n`gradient(Z)` 近似矩阵的梯度 >> `gradient([1-i\
  \ 1+i; 3-5i 6i]) ans = 2-6i 5+5i`\n\n`del2(Z)` 矩阵的拉普拉斯（离散点） >> `del2([1-i 1+i; 3-5i\
  \ 6i]) ans = -2-2i -5i`\n\n`fft(Z)` 矩阵的离里叶变换 >> `fft([1-i 1+i; 3-5i 6i]) ans = 9-3i\
  \ -5+7i`\n\n`fft2(Z)` 矩阵的二维离里叶变换 >> `fft2([1-i 1+i; 3-5i 6i]) ans = 9-3i -5+7i`\n\
  \n`ifft(Z)` 矩阵的离散里叶逆变换 >> `ifft([1-i 1+i; 3-5i 6i]) ans = 1-i 1+i; 3-5i 6i`\n\n\
  `ifft2(Z)` 矩阵的离散二维维里叶变换逆变换 >> `ifft2([1-i 1+i; 3-5i 6i]) ans = 1-i 1+i; 3-5i 6i`\n\
  \n\n\n\n\n## 矩阵操作\n\n- `cumprod(V)`: 输出 `Z` 列的累积积矩阵。\n  ```\n  >> cumprod(Z)\n \
  \ ans = 1.0e+002 * 0.0100 - 0.0100i 0 + 0.0300i 0.0500 - 0.1200i 0 + 0.0200i 0 0.2400\
  \ + 0.1000i 0.1000 + 0.1200i 0 -2.2800 + 0.7400i\n  >> cumprod(Z1)\n  ans = 1 3\
  \ 5  -1 0 10  -6 0 -70\n  ```\n\n- `diff(Z)`: 输出 `Z` 列分的一阶差分矩阵。\n  ```\n  >> diff(Z)\n\
  \  ans = -2.0000 + 2.0000i 0 - 3.0000i -5.0000 +14.0000i 7.0000 - 6.0000i 0 + 8.0000i\
  \ -7.0000 + 4.0000i\n  >> diff(Z1)\n  ans = -2 -3 -3  7 8 -9\n  ```\n\n- `gradient(Z)`:\
  \ 估算 `Z` 列的梯度矩阵。\n  ```\n  >> gradient(Z)\n  ans = -1.0000 + 4.0000i 2.0000 - 5.5000i\
  \ 5.0000 -15.0000i 1.0000 - 1.0000i 0.5000 + 0.5000i 0 + 2.0000i -6.0000 +13.0000i\
  \ -6.5000 + 5.5000i -7.0000 - 2.0000i\n  >> gradient(Z1)\n  ans = 2.0000 2.0000\
  \ 2.0000  1.0000 1.5000 2.0000  2.0000 -6.5000 -15.0000\n  ```\n\n- `del2(V)`: 估算\
  \ `Z` 列的拉普拉斯矩阵。\n  ```\n  >> del2(Z)\n  ans = 3.7500 - 6.7500i 1.5000 - 2.0000i\
  \ 1.0000 - 7.2500i 2.0000 - 1.2500i -0.2500 + 3.5000i -0.7500 - 1.7500i 2.0000 -\
  \ 5.7500i -0.2500 - 1.0000i -0.7500 - 6.2500i\n  >> del2(Z1)\n  ans = 2.2500 2.7500\
  \ -1.5000  2.5000 3.0000 -1.5000\n  ```\n\n- `fft(Z)`: 带有 `Z` 列离散变换的矩阵。\n  ```\n\
  \  >> fft(Z)\n  ans = 6.0000 - 5.0000i 0 +11.0000 -2.0000 - 4.0000i 3.6962 + 7.062i\
  \ -6.9282 - 1.0000i 5.0359 -22.062i -6.9662 - 5.062i 6.9282 - 1.0000i 11.9641 -\
  \ 9.9378\n  >> fft(Z1)\n  ans = 6.0000 11.0000 0  -1.5000 + 6.062i -1.0000 + 6.928i\
  \ 7.5000 - 7.942i -1.5000 - 6.062i -1.0000 + 6.928i 7.5000 + 7.942i\n  ```\n\n-\
  \ `fft2(Z)`: 带有 `Z` 列二维离散变换的矩阵。\n  ```\n  >> fft2(Z)\n  ans = 4.0000 + 2.0000i 19.9904-10.2321i\
  \ -5.9904 - 6.7679i 1.8038 -16.0000i 22.8827+28.9545i -13.5981 + 8.2321i 12.1962\
  \ -16.0000i -8.4019 + 4.7679i -23.8827 - 3.9545i\n  >> fft2(Z1)\n  ans = 17.0000\
  \ 0.5000 - 9.5263i 0.5000 + 9.5263i 5.0000 + 5.1962i 8.0000 +13.8564i -17.5000 -\
  \ 0.8660i 5.0000 - 5.1962i -17.5000 + 0.8660i\n  ```\n\n- `ifft(Z)`: 带有 `Z` 列离散变换逆的矩阵。\n\
  \  ```\n  >> ifft(Z)\n  ans = 2.0000 - 1.6667i 0 + 3.6667i -0.6667 - 1.3333i -2.2321\
  \ - 1.6874i 2.3094 - 0.33333i 3.9880 - 3.3126i 1.2321 + 2.3541i -2.3094 - 0.33333i\
  \ 1.6786 - 7.3541i\n  >> ifft(Z1)\n  ans = 2.0000 3.6667 0  -0.5000 - 2.0007i -0.3333\
  \ - 2.3094i 2.5000 + 2.5981i -0.5000 + 2.0007i -0.3333 + 2.3094i 2.5000 - 2.5981i\n\
  \  ```\n\n- `ifft2(Z)`: 带有 `Z` 列二维离散变换逆的矩阵。\n  ```\n  >> ifft2(Z)\n  ans = 0.4444\
  \ + 0.2222i -0.6656 - 0.7520i 2.2212 - 1.1369i 1.3551 - 1.7778i -2.6536 - 0.4394i\
  \ -0.9335 + 0.5298i 0.2004 - 1.7778i -1.5109 + 0.9147i 2.5425 + 3.2172i\n  >> ifft2(Z1)\n\
  \  ans = 1.8889 0.0556 + 1.0585i 0.5556 - 1.0585i 0.5556 - 0.5774i 0.8889 - 1.5396i\
  \ -1.9444 + 0.0962i 0.5556 + 0.5774i -1.9444 - 0.0962i 0.8889 + 1.5396i\n  ```\n\
  \n## 以复矩阵为参数的函数\n\nMATLAB 包含了大量接受复矩阵作为参数的三角、双曲和对数函数。显然，这些函数也接受复向量作为参数，因为向量是矩阵的一种特例。所有函数按元素应用。\n\
  \n## 复矩阵变量的三角函数\n\nMATLAB 包含了三角函数及其反函数并进行了示例。对于所有函数，均使用 sine 中定义的 `Z` 和 `Z1` 矩阵作为参数。\n\
  \n- `sin(z)`: 正弦函数\n  ```\n  >> Z = [1-i, 1+i, 2i; 3-6i, 2+4i, -i; i, 2i, 3i]\n\
  \  Z = 1.0000 - 1.0000i 1.0000 + 1.0000i 0.0000 + 2.0000i\n      3.0000 - 6.0000i\
  \ 2.0000 + 4.0000i -0.0000 - 1.0000i\n      0.0000 + 1.0000i 0.0000 + 2.0000i 0.0000\
  \ + 3.0000i\n  >> Z1 = [1,1,2; 3,2,-1; 1,2,3]\n  Z1 =\n         1  1  2\n      \
  \   3  2 -1\n         1  2  3\n  >> sin(Z)\n  ans = 1.0e+002 * 0.0130 - 0.0063i\
  \ 0.0130 + 0.0063i 0 + 0.0363i\n      0.2847 + 1.9969i 0.2483 - 0.1136i -0.0118i\
  \ + 0.0118i 0.0363i 0 + 0.1002i\n  >> sin(Z1)\n  ans = 0.8415 0.8415 0.9093  0.1411\
  \ 0.9093 -0.8415 0.8415 0.9093 0.1411\n  ```\n\n- `cos(z)`: 余弦函数\n  ```\n  >> cos(Z)\n\
  \  ans = 1.0e+002 * 0.0083 + 0.0099i 0.0083 - 0.0099i 0.0376\n      -1.9970 + 0.2847i\
  \ -0.1136 + 0.2481i 0.0154 + 0.0376 0.1007\n  >> cos(Z1)\n  ans = 0.5403 0.5403\
  \ -0.4161 -0.9900 -0.4161 0.5403 - -0.4161\n  ```\n\n- `tan(z)`: 正切函数\n  ```\n \
  \ >> tan(Z)\n  ans = 0.2718 - 1.0839i 0.2718 + 1.0839i 0 + 0.9640\n      0.0000\
  \ -  .0004i 0.701i + 0.7610 + 0.7610 + 0.9640 + 0.951i\n  >> tan(Z1)\n  ans = 1.5574\
  \ 1.5574 -2.1850 -0.1425 -2.1554 - ...151  \n  ```\n\n- `csc(z)`: 余 csc 函数\n  ```\n\
  \  >> csc(Z)\n  ans = 0.6215 + 0.3039i 0.6215 - 0.3039i -0.2757 - 0.0007i -0.0049i\
  \ 0.0333 + 0.0152i 0.8509 - 0.8509i -0.2757 - 0.0998i\n  >> csc(Z1)\n  ans = 1.1884\
  \ 1.1884 1.0998 7.0862 1.0998 -1.1884 1.0998 7.0862\n  ```\n\n- `cot(z)`: 余 cot\
  \ 函数\n  ```\n  >> cot(Z)\n  ans = 0.2176 + 0.8680i 0.2176 - 0.8680i 0 - 1.0373i\n\
  \      -0.0000 + 1.0000i -0.0005 - 0.9996i 0 + 1.3130i 0 -1.3130i -0.0373 - 1.0050i\n\
  \  >> cot(Z1)\n  ans = 0.6421 0.6421 -0.4577  -7.0153 -0.4577 -0.6421 0.6421 -7.0153\n\
  \  ```\n\n## 反三角函数\n\n- `asin(z)`: 弧反正函数\n  ```\n  >> asin(Z)\n  ans = 0.6662 -\
  \ 1.0613i 0.6662 + 1.0613i 0 + 1.4436i\n      0.4592 - 2.5998i 0.4539 + 2.1986i\
  \ 0 -0.8814i + 0.8814i 0 + 1.4436i 0 + 1.8184i\n  >> asin(Z1)\n  ans = 1.5708 1.5708\
  \ 1.5708 -1.3170i  1.5708 - 1.7627i 1.5708 - 1.3170i -1.5708  1.5708 1.5708 -1.3170i\
  \ 1.5708 - 1.7627i\n  ```\n\n- `acos(z)`: 弧余弦函数\n  ```\n  >> acos(Z)\n  ans = 0.9046\
  \ + 1.0613i 0.9046 - 1.0613i 1.5708 - 1.4436i\n      1.1115 + 2.5998i 1.1169 - 2.1986i\
  \ 1.5708 + 0.8814i 1.5708 - 0.8814i 1.5708 - 1.4436i 1.5708 - 1.8184i\n  >> acos(Z1)\n\
  \  ans = 0 0 0 + 1.3170i 0 + 1.7627i 0 + 1.3170i 3.1416  0 0 + 1.3170i 0 + 1.7627i\n\
  \  ```\n\n- `atan(z) and atan2(z)`: 反正切函数\n  ```\n  >> atan(Z)\n  Warning: Singularity\
  \ in ATAN. This warning will be removed in a future release. Use DBSTOP when debugging.\n\
