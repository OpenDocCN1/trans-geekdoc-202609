  ```\nezplot('t\\*sin(t)', 't\\*cos(t)')\n```\n\n![image](img/image049.png)\n\n###\
  \ 练习 12. 用极坐标表示该曲线：\n\n$\\rho=1-\\cos(\\theta)$\n\n![image](img/scene_break.png)\n\
