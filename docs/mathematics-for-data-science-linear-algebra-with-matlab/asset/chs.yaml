  \n## 1.4 数字、算术运算和格式\n\n![image](img/chapter_title_below.png)\n\nMATLAB 中的数值工作非常广泛。可以使用整数、有理数、实数和复数，这些数反过来可以作为函数的参数，产生整数、有理、实和复函数。因此，复变量是\
  \ MATLAB 中一个易处理的领域。MATLAB 中的算术运算根据标准的数学习惯定义。下表给出了基本算术运算的语法：\n\n| 表达式 | 描述 |\n| :---\
  \ | :--- |\n| `x + y` | 和 `>> 4+8` `ans = 12` |\n| `x - y` | 差 `>> 4-8` `ans = -4`\
  \ |\n| `x * y` 或 `x y` | 积 `>> 4\\*8` `ans = 32` |\n| `x/y` | 除 `>> 4/8` `ans =\
  \ 0.5000` |\n| `x ^y` | 幂 `>> 4⁸` `ans = 65536` |\n\nMATLAB 执行算术运算时就像一个普通的计算器一样，具有完全的计算精度。运算结果以精确形式显示，或者通过指定用户所需的精度来显示。但这仅影响呈现，因为计算精度是无限的，这是\
  \ MATLAB 区别于其他数值程序的特征（在其他程序中，计算机确定精度的字长取决于硬件）。MATLAB 可以以所需的精度表示结果，尽管它在内部进行精确计算以避免舍入误差。这就是为什么我们有不同格式的近似表示，这有时有助于对结果的解释。与结果显示格式相关的命令列举如下：\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `format short` | 将结果保留 4 位小数。这是 MATLAB 的默认格式。`>>\
  \ sqrt(23)` `ans = 4.7958` |\n| `format long` | 将结果保留 16 位小数 ![image](img/scene_break.png)\
  \ `>> format long; sqrt(23)` `ans = 4.7958312331279` |\n| `format long e` | 提供 16\
  \ 位小数加上所需的 10 的幂次。`>> format long e; sqrt(23)` `ans = 4.7958312331279e+000` |\n\
  | `format short e` | 将结果保留 4 位小数加上所需的 10 的幂次。`>> format short e; sqrt(23)` `ans\
  \ = 4.7958e+000` |\n| `format long g` | 以最优的长格式交付 `>> format long g; sqrt(23)` `ans\
  \ = 4.795831233172` |\n| `format short g` | 以最优的短格式交付 `>> format short g; sqrt(23)`\
  \ `ans = 4.7958` |\n| `format bank` | 将结果保留 2 位小数 `>> format bank; sqrt(23)` `ans\
  \ = 4.80` |\n| `format rat` | 以有理数形式给出结果 `>> format rat; sqrt(23)` `ans = 23` |\n\
  | `format +` | 以符号 (+) 给出结果并忽略复数部分。`>> format +; sqrt(23)` `ans =` |\n| `format\
  \ hex` | 以十六进制系统给出结果。`>> format hex; sqrt(23)` `ans = e` |\n| `vpa 'operations'\
  \ n` | 以 `n` 位精确数字给出运算结果。`>> vpa 'sqrt(23)' 20` `ans = 4.7958312331` |\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n## 1.5 整数和整数变量函数\n\n![image](img/chapter_title_below.png)\n\nMATLAB 精确地处理整数和整数变量函数。无论以什么格式显示，计算都是精确的。然而，`vpa`\
  \ 命令允许你获得精确的输出。\n\n对于整数变量函数，MATLAB 提供的最重要的函数如下（引号内的表达式为字符串格式）：\n\n| 函数 | 描述 |\n\
  | :--- | :--- |\n| `rem(n,m)` | `n` 除以 `m` 的余数（适用于实数 `n` 和 `m`）`>> rem(15,2)` `ans\
  \ = 1` |\n| `sign(n)` | `n` 的符号（`n>0` 为 1，`n<0` 为 -1，`n` 为实数）`>> sign(-8)` `ans\
  \ = -1` |\n| `max(n1,n2)` | `n1` 和 `n2` 的最大值 `>> max(17,12)` `ans = 17` |\n| `min(n1,n2)`\
  \ | `n1` 和 `n2` 的最小值 `>> min(17,12)` `ans = 12` |\n| `gcd(n1,n2)` | `n1` 和 `n2`\
  \ 的最大公约数 `>> gcd(17,12)` `ans = 1` |\n| `lcm(n1,n2)` | `n1` 和 `n2` 的最小公倍数 `>> lcm(17,12)`\
  \ `ans = 204` |\n| `factorial(n)` | `n` 的阶乘 `>> factorial(9)` `ans = 362880` |\n\
  | `factor(n)` | 将 `n` 分解为质因数 `>> factor(51)` `ans = 3 17` |\n| `dec2base(decimal,n_base)`\
  \ | 将指定的十进制（10 进制）转换为给定的进制 `n_base` `>> dec2base(2345,7)` `ans = 6560` |\n\n\n\n\
  \n\n| `base2dec(number,B)` | 将给定的 B 进制数转换为十进制 >> `base2dec('ab12579',12)` `ans =\
  \ 32621997` |\n| `dec2bin(decimal)` | 将指定的十进制数转换为二进制（2 进制） >> `dec2bin(213)` `ans\
  \ = 11010101` |\n| `dec2hex(decimal)` | 将指定的十进制数转换为十六进制（16 进制） >> `dec2hex(213)`\
  \ `ans = D5` |\n| `bin2dec(binary)` | 将指定的二进制数转换为十进制 >> `bin2dec('1110001')` `ans\
  \ = 113` |\n| `hex2dec(hexadecimal)` | 将指定的 16 进制数转换为十进制 >> `hex2dec('FFAA23')`\
  \ `ans = 16755235` |\n| ![image](img/chapter_title_corner_decoration_left.png) |\
  \ ![ ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 1.6 实数与实变数函数\n\n![image](img/chapter_title_below.png)\n\
  \n实数是有理数和无理数的不交并集。有理数的形式为 `p/q`，其中 `p` 是一个整数而 `q` 是另一个整数。MATLAB 对有理数的处理方式与大多数计算器不同。有理数是整数的商，MATLAB\
  \ 也可以以精确模式对它们进行处理，使得涉及有理数的表达式的结果始终另一个有理数或整数。为了实现这一点，需要使用 `format rat` 命令激活有理数格式。如果用户需要，MATLAB\
  \ 也可以通过激活其他类型的格式（例如 `format short` 或 `format long`）返回结果的十进制近似值。考虑以下示例：\n\n```matlab\n\
  >> format rat;\n>> 1/6+1/5-2/10\nans = 1/6\n```\n\n```MATLAB 将有理数视为整数的商，并在计算过程中保持这种形式。通过这种方式，分式计算中的舍入误差不会累积，这在“误差理论”中显示是非常严重的。一旦启用有理数格式，对有理数的操作将是精确的，直到启用不同的格式。当启用有理数格式时，浮点数（即带有小数点的数）被解释为精确值，MATLAB\
  \ 通过用有理数表示结果将整个表达式视为精确有理数。反，如果有理表达式中存在无理数，MATLAB 会将其匹配到最接近的分数以进行有理格式计算。考虑以下示例：\n\
  \n```matlab\n>> format rat;\n>> 2.64/25+4/100\nans = 91/625\n\n>> 2.64/sqrt(25)+4/100\n\
  ans = 71/125\n\n>> sqrt(2.64)/25+4/100\nans = 204/1943\n```\n\nMATLAB 也通过尽可能准确或按照用户要求的精度表示结果来处理无理数，同时考虑到无理数无法精确表示为两个整数之比的注意事项。如下所示：\n\
  \n```matlab\n>> sqrt(235)\nans = 15.3297\n```\n\nMATLAB 提供了一些非常典型的实常数，其表示方式如下：\n\
  \n| `pi` | 数字 π= 3.1415926 >> `2*pi` `ans = 6.2832` |\n| --- | --- |\n| `exp(1)`\
  \ | 数字 e = 2.7182818 >> `exp(1)` `ans = 2.7183` |\n| `inf` | 无穷大（例如 `1/0`） >> `1/0`\
  \ `ans = Inf` |\n| `NaN` | 不确定（例如 `0/0`） >> `0/0` `ans = NaN` |\n| `realmin` | 最小正实数\
  \ >> `realmin` `ans = 2.2251e-308` |\n| `realmax` | 最大正实数 >> `realmax` `ans = 1.7977e+308`\
  \ |\n\nMATLAB 有了一系列预定义的实数函数，这些函数适用于有理、无理和整数型变量。其中最重要的函数将在接下来的章节介绍。\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \ | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n### 1.6.1 三角函数\n\n![image](img/chapter_title_below.png)\n\
  \n下面是 MATLAB 包含的三角函数及其反函数的表，并用示例进行了说明。\n\n| 函数 | 反函数 |\n| --- | --- |\n| `sin(x)`\
  \ 正弦 >> `sin(pi/2)` `ans = 1` | `asin(1)` `ans = 1.5708` |\n| `cos(x)` 余弦 >> `cos(pi)`\
  \ `ans = -1` | `acos(-1)` `ans = 3.1416` |\n| `tan(x)` 正切 >> `tan(pi/4)` `ans =\
  \ 1.0000` | `atan(1)` `ans = 0.7854` |\n| `csc(x)` 割弦 >> `csc(pi/2)` `ans = 1` |\
  \ `acsc(1)` `ans = 1.5708` |\n| `sec(x)` 正割 >> `sec(pi)` `ans = -1` | `asec(-1)`\
  \ `ans = 3.1416` |\n| `cot(x)` 余切 >> `cot(pi/4)` `ans = 1.0000` | `acot(1)` `ans\
  \ = 0.7854` |\n\n![image](img/chapter_title_corner_decoration_left.png) | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 1.6.2 双曲函数\n\n\
