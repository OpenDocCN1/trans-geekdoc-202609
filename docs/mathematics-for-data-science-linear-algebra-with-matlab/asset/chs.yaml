  \ 2 )+x+x^( 3 )+x+x^( 4 )+x^( 5 ) = 0`\nb) `x^( 2 )+(6-i)x+8-4i = 0`\n(c) `tan(Z)\
  \ = 3i/5`\n\n```matlab\n>> solve('1+x+x²+x³+x⁴+x⁵ = 0')\n\nans =\n-1\n- 1/2 - (3^(1/2)*i)/2\n\
  1/2 - (3^(1/2)*i)/2\n- 1/2 + (3^(1/2)*i)/2\n1/2 + (3^(1/2)*i)/2\n```\n\n```matlab\n\
  >> solve('x²+(6-i)*x+8-4*i = 0')\n\nans =\n-4\ni - 2\n```\n\n```matlab\n>> vpa(solve('tan(Z)\
  \ = 3*i/5'))\n\nans =\n0.69314718055994530941723212145818*i\n```\n\n### 练习 10. 执行以下操作：\n\
  \n(a) -1 和 1 的四根\n(b) 2+2i 和 -1+i√3$ 的五根\n(c) `Tan(iLn((a+ib)/(a-ib)))` 的实部\n(d)\
  \ `Z= (2+i)^( Cos(4-i) )` 的虚部\n\n```matlab\n>> solve('x⁴+1=0')\n\nans =\n2^(1/2)*(-\
  \ i/2 - 1/2)\n2^(1/2)*(i/2 - 1/2)\n2^(1/2)*(1/2 - i/2)\n2^(1/2)*(i/2 + 1/2)\n```\n\
  \n```matlab\n>> pretty(solve('x⁴+1=0'))\n\n+- -+\n| 1/2 / i 1 \\\\ |\n| 2 | - -\
  \ - - | |\n| \\ 2 2 / |\n| |\n| 1/2 / i 1 \\\\ |\n| 2 | - - - | |\n| \\ 2 2 / |\n\
  | |\n| 1/2 / 1 i \\\\ |\n| 2 | - - - | |\n| \\ 2 2 / |\n| |\n| 1/2 / i 1 \\\\ |\n\
  | 2 | - + - | |\n| \\ 2 2 / |\n+- -+\n```\n\n```matlab\n>> solve('x⁴-1=0')\n\nans\
  \ =\n-1\n1\n-i\ni\n```\n\n```matlab\n>> vpa(solve('x⁵-2-2*i=0'))\n\nans =\n0.19259341768888084906125263406469*i\
  \ + 1.2159869826496146992458377919696\n- 0.87055056329612413913627001747975*i -\
  \ 0.87055056329612413913627001747975\n0.558927867466009703949859468402*i - 1.096957776924816708625046347308*i\n\
  ```\n\n# 图形\n\nATLAB 是一个实现高性能图形的科学软件。它允许绘制二维和三维探索性数据分析图、显式、隐式和参数曲线、表面图、网格和等值线图。还可以选择图形的窗口和位置、选择线条和标记特征、放置坐标轴限制、标记和网格、放置注释、标签和图例，并将图形导出到不同的格式，这些功能将在本章中介绍。\n\
  \n## 3.1 探索性数据图\n\nATLAB 包含了许多允许你执行基础探索性图形的命令，例如直方图、柱状图、饼图、箭头图等。下表总结了这些命令。对于所有这些命令，都需要预先定义变量的变化范围。\n\
  \n\n\n\n\n| `rose(Y,n)` | 使用 `n` 个等半径绘制向量 `Y` 的角度直方图。 |\n| `rose(X,Y)` | 使用向量 `X`\
  \ 中元素指定的半径，绘制相对于向量 `Y` 的角度直方图。 |\n| `compas(Z)` | ![image](img/scene_break.png)\
  \ 绘制一个从原点出发的箭头图，其幅和方向由向量 `Z` 中复数分量的模和幅角决定。相对于复数 `Zi` 的箭头将原点与 `Zi` 的复数值点连接起来 >>\n\
  ```matlab\nz=eig(randn(20,20)); compass(z)\n```\n![image](img/image128.png) |\n\
  | `compas(X,Y)` | 等于 `compas(X+i\\*Y)` |\n| `compas(Z,S)` 或 `compas(X,Y,S)` | 在\
  \ `S` 中指定箭头使用的线条类型。 |\n| `feather(Z)` 或 `feather(X,Y)` 或 `feather(Z,S)` 或 `feather(X,Y,S)`\
  \ | 与 `compas` 相同，唯一的区别是箭头的起点不在坐标原点，而是来自水平线上的等间距点。 >>\n```matlab\nz=eig(randn(20,20));\
  \ feather(z)\n```\n![image](img/image074.png) |\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png) |\n\n## 3.2 显式、隐式、参数和极坐标中的曲线\n\n![image](img/chapter_title_below.png)\n\
  \n下表列出了用于在显式、隐性和极坐标中表示二维曲线最重要的 MATLAB 命令。\n\n| `plot(X,Y)` | 绘制点集 `(X,Y)`，其中 `X`\
  \ 和 `Y` 是行向量。要绘制函数 `y=f(x)`，需要知道一组点 `(X,f(X))`，必须预先定义变量 `x` 的向量变化范围 `X`。`X` 和 `Y`\
  \ 可以是相同维度的矩阵，在这种情况下，为每对行绘制一张图并在同一轴上显示。对于 `X` 和 `Y` 的复值，忽略其虚部。对于具有给定 `t` 的 `x = x(t)`\
  \ 和 `y = y(t)`，绘制指定的参数平面曲线 >>\n```matlab\nx=0:0.1:6\\*pi; y=x.\\*sin(x); plot(x,y)\n\
  ```\n![image](img/image038.png) |\n| --- | --- |\n| `plot(Y)` | 将向量 `Y` 的元素相对于其索引绘图，即给出点集\
  \ `(t,y)` `t=1,2,...n (n=length(Y))` 的图形。这对于绘制时间序列非常有用。如果 `Y` 是矩阵，`plot(Y)` 会为 `Y`\
  \ 的每一列绘制一张图，并将它们全部显示在同一轴上。如果向量 `Y` 的分量是复数，`plot(Y)` 等于 `plot(real(Y),imag(Y))` >>\n\
  ```matlab\nY=[1,3,9,27,81,243]; plot(Y)\n```\n![image](img/image143) |\n| `plot(X,Y,S)`\
  \ | 使用选项 `S` 绘制 `X,Y`。通常 `S` 由两个引号内的数字组成，第一个设置绘图颜色，第二个设置绘图使用的字符。可能的颜色和字符分别为：`y`（黄色）、`m`（洋红色）、`c`（青色）、`r`（红色）、`b`（蓝色）、`w`（白色）、`k`（黑色）、`.`（点）、`o`（圆）、`x`（标记）、`+`（加号）、`-`（实线）、`*`（星号）、\
  \ `:`（冒号）、`--`（虚线）和 `-.`（点划线）。 >>\n```matlab\nplot([1,2,3,4,5,6,7,8,9],[1/2,3/4,5/6,7/8,9],'r')\n\
  ```\n![image](img/image102.png) |\n| `plot(X1,Y1,S1,X2,Y2,S2)` | 在同一轴上合并由三元组 `(Xi,Yi,Si)`\
  \ 定义的图形。这是在同一图中表示多个函数的方法。 |\n| `fplot('f',xmin,xmax)` | 在给定的 `x` 范围内绘制显式函数 `y=f(x)`\
  \ >>\n```matlab\nfplot('x\\*sin(1/x)',[0,pi/16])\n```\n![image](img/image058.png)\
  \ |\n| `fplot('f',xmin,xmax,ymin,ymax)` | 给指定的 `x` 和 `y` 范围内绘制显式函数 `y=f(x)`，通过 `S`\
  \ 选择颜色和字符。 >>\n```matlab\nfplot('x²/(x+1)',[-12,12,-8,8])\n```\n![image](img/image133.png)\
  \ |\n| `fplot('f',xmin,xmax,...,t)` | 以容差 `t` 绘制 `f`。 |\n| `fplot('f',xmin,xmax,...,n)`\
  \ | 以容差 `t` 以至少 `n+1` 个点绘制 `f`。 |\n| `fplot('f1,f2,...,fn',xmin,xmax,ymin,ymax,S)`\
  \ | 在指定的 `x` 和 `y` 范围内绘制函数 `f1, f2, ..., fn`，使用 `S` 中指定的颜色。 >>\n```matlab\nfplot('sin(x),\
  \ sin(2\\*x), sin(3\\*x)',[0,2\\*pi])\n```\n![image](img/image036.png) >>\n```matlab\n\
  fplot('sin(x), sin(2\\*x), sin(3\\*x)',[0,2\\*pi],'k')\n```\n![image](img/image141.png)\
  \ |\n| `ezplot('f',xmin,xmax)` | 在给定的 `x` 范围内绘制显式函数 `y=f(x)` 或隐式函数 `f(x,y)=k`。变量的变化范围可以省略。\
  \ >>\n```matlab\nezplot('y\\*x²+x\\*y²=10',[-10,10])\n```\n![image](img/image095.png)\
  \ >>\n```matlab\nezplot('x²/(x²-1)')\n```\n![image](img/image023.png) |\n| `ezplot('f',xmin,xmax,ymin,ymax)`\
  \ | 在给定的（或未指定的）`x` 和 `y` 范围内绘制显式函数 `y=f(x)` 或隐式函数 `f(x,y)=k` >>\n```matlab\nezplot('x²+y³=1/2',[-10,10,-8,8])\n\
  ```\n![image](img/image109.png) >>\n```matlab\nezplot('x²-y⁴=1')\n```\n![image](img/image007.png)\
  \ |\n| `ezplot(x,y)` | 在域 `0 < t < 2` 上绘制平面参数曲线 `x=x(t)` 和 `y=y(t)` >>\n```matlab\n\
  ezplot('4\\*cos(t)-cos(4\\*t)', '4\\*sin(t)-sin(4\\*t)')\n```\n![image](img/image105.png)\
  \ |\n| `ezplot('f',xmin,xmax)` | 在域 `xmin < t < xmax` 上绘制参数平面曲线 `x=x(t)` 和 `y=y(t)`\
  \ >>\n```matlab\nezplot('t\\*sin(t)', 't\\*cos(t)',[-4\\*pi,4\\*pi])\n```\n![image](img/image117.png)\
  \ |\n| `ezplot('f')` | 在 `[-2, 2]` 内以隐式坐标绘制曲线 `f` >>\n```matlab\nezplot('y⁴-x⁴-24\\\
  *y²+25\\*x²=0')\n```\n![image](img/image111.png) |\n| `loglog(X,Y)` | 与 `plot(X,Y)`\
  \ 相似，但两个轴都使用对数刻度 >>\n```matlab\nx=0:0.1:pi; y=x.\\*sin(x); loglog(x,y)\n```\n![image](img/image043.png)\
  \ |\n| `semilogx(X,Y)` | 与 `plot(X,Y)` 相似，但 X 轴使用对数刻度，Y 轴使用普通刻度 >>\n```matlab\n\
  x=0:0.1:pi; y=x.\\*sin(x); semilogx(x,y)\n```\n![image](img/image084.png) |\n| `semilogy(X,Y)`\
  \ | 与 `plot(X,Y)` 相似，但 Y 轴使用对数刻度，X 轴使用普通刻度 >>\n```matlab\nx=0:0.1:pi; y=x.\\*sin(x);\
  \ semilogy(x,y)\n```\n![image](img/image078.png) |\n| `polar(α,r)` | 在极坐标下绘制 `r=r(α)`\
  \ >>\n```matlab\nt=0:0.1:2\\*pi; r=sin(t).\\*cos(t); polar(t,r)\n```\n![image](img/image021.png)\
  \ |\n| `polar(α,r,S)` | 在极坐标下绘制 `r=r(α)`，使用由 `S` 指定的线条 >>\n```matlab\nt=0:0.05:2\\\
  *pi; r=sin(t).\\*cos(t); polar(t,r,'\\*r')\n```\n![image](img/image080.png) |\n\
  | `ezpolar(r)` `ezpolar(r,a,b)` | 在极坐标下绘制 `r=r(α)`，若未指定则 `α` 的范围为 `[0 2π]`，若未指定则在\
  \ `a` 和 `b` 之间 >>\n```matlab\nezpolar('1+cos(t)')\n```\n![image](img/image114.png)\
  \ |\n\n\n\n\n\n| `fill(X,Y,C)` | 绘制紧凑的多边形，其顶点为列向量 `X` 和 `Y` 的分量对 `(Xi,Yi)`。`C` 是一个与\
  \ `X` 和 `Y` 维度相同的向量，包含每个点 `(Xi,Yi)` 的颜色 `Ci`。`Ci` 的值可以是：'r', 'g', 'b', 'c', 'm',\
  \ 'y', 'w', 'k'，这些含义我们已经知道。如果 `C` 是单个字符，则多边形的所有点都将涂成该字符对应的颜色。如果 `X` 和 `Y` 是相同维度的矩阵，则将同时表示与每对列向量\
  \ `(X.j,Y.j)` 对应的多个多边形。在这种情况下，`C` 可以是一个行向量，其元素 `Cj` 决定了与列向量对 `(X.j,Y.j)` 对应的每个多边形的唯一颜色。`C`\
  \ 也可以是与 `X` 和 `Y` 维度相同的矩阵，在这种情况下，它的元素决定了多边形集合每个每个点 `(Xij,Yij)` 的颜色。 >>\n```\nt =\
  \ (1/16:1/8:1)'*2*pi;x = sin(t);y = cos(t); fill(x,y,'r')\n```\n![image](img/image150.png)\
  \ |\n| `fill(X1,Y1,C1,...)` | 绘制顶点由点 `(Xi, Yi, Ci)` 给出的紧凑多边形 | |\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 3.3 扭曲曲线 (WARPED CURVES)\n\n\
  ![image](img/chapter_title_below.png)\n\nMATLAB 包含了允许你在三维空间中表示扭曲曲线的命令。其中最重要的命令列在下表中。\n\
  \n| `plot3(X,Y,Z)` | 绘制点集 `(X,Y,Z)`，其中 `X`、`Y` 和 `Z` 是行向量。`X`、`Y` 和 `Z` 可以是参数坐标或相同维矩阵，在这种情况下，将为每个行三元组在相同坐标轴上绘制一个图。对于\
  \ `X`、`Y` 和 `Z` 的复值，将忽略其虚部。 >>\n```\nX = [0 1 1 2;1 1 2 2;0 0 1 1];\nY = [1 1 1\
  \ 1;1 0 1 0;0 0 0 0];\nZ = [1 1 1 1;1 0 1 0;0 0 0 0];\nplot3(X,Y,Z)\n```\n![image](img/image063.png)\
  \ >>\n```\nt=0:pi/100:20*pi;plot3 (2*sin(2*t),2*cos(2*t),4*t)\n```\n![image](img/image093.png)\
  \ |\n| --- | --- |\n| `plot3(X,Y,Z,S)` | 使用 `S` 中定义的选项绘制 `(X,Y,Z)`。通常 `S` 由两个单引号内的数字组成，第一个设置绘图线条的颜色，第二个设置绘图时使用的字符。颜色和字符的可能值在解释\
  \ `plot` 命令时已经描述过。 |\n| `plot3(X1,Y1,Z1,S1, X2,Y2,S2, X3,Y3,S3,...)` | 它在相同坐标轴上组合了为三元组\
  \ `(Xi,Yi,Zi)` 定义的图形。这是在同一张图上表示多个函数的方法。 |\n| `fill3(X,Y,Z,C)` | 绘制紧凑的多边形，其顶点为列向量\
  \ `X`、`Y` 和 `Z` 的三元组 `(Xi,Yi,Zi)`。`C` 是一个与 `X` 和 `Y` 维度相同的向量，包含每个点 `(Xi,Yi,Zi)`\
  \ 的颜色 `Ci`。`Ci` 的值可以是 'r','g','b','c','m','y','k'。如果 `C` 是单个字符，多边形的所有点将将涂成该字符对应的颜色。如果\
  \ `X` 和 `Y` 维度相同，则将同时表示与每个列向量三元组 `(X.j,Y.j,Z.j)` 对应的多个多边形。在这种情况下，`C` 可以是一个行向量，其元素\
  \ `Cj` 决定了与列向量三元组 `(X.j,Y.j,Z.j)` 对应的每个多边形的唯一颜色。`C` 也可以是与 `X` 和 `Y` 维度相同的矩阵，在这种情况下，它的元素决定了多边形集合每个点\
  \ `(Xijk,Yijk,Zijk)` 的颜色。\n```\nX = [0 1 1 2;1 1 2 2;0 0 1 1];\nY = [1 1 1 1;1 0\
  \ 1 0;0 0 0 0];\nZ = [1 1 1 1;1 0 1 0;0 0 0 0];\nC = [0.5000 1.0000 1.0000 0.5000;\
  \ 1.0000 0.5000 0.5000 0.1667; 0.3330 0.3330 0.5000 0.5000];\nfill3(X,Y,Z,C)\n```\n\
  ![image](img/image154.png) |\n| `fill3(X1,Y1,Z1,C1, X2,Y2, Z2,...)` | 绘制顶点由点 `(Xi,\
  \ Yi, Zi, Ci)` 给出的紧凑多边形。 |\n| `ezplot3(x(t),y(t),z(t))` `ezplot3(x(t),y(t),z(t),\
  \ [tmin,tmax])` | 绘制由三个参数组件定义的扭曲曲线。通过其三个参数组件绘制扭曲曲线。 >>\n```\nezplot3('sin(t)','cos(t)','t',[0,6])\n\
  ```\n![image](img/image12.png) |\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 3.4 显式与参数曲面 (EXPLICIT AND SURFACES)\n\
  \n![image](img/chapter_title_below.png)\n\nMATLAB 包含了允许你在三维空间中表示扭曲曲线的 `z=f(x,y)`\
  \ 显式曲面。`surf` 命令用于绘制曲面，`mesh` 命令用于绘制网格。`contour` 命令用于绘制曲面上的等值线。`contour3` 命令用于绘制三维空间中的等值面。`fsurf`\
  \ 命令用于绘制参数曲面。`patch` 和 `fill3` 命令用于绘制多边形。\n\n| `plot(X,Y,Z)` | 绘制点集 `(X,Y,Z)`，其中\
  \ `X`、`Y` 和 `Z` 是行向量。`X`、`Y` 和 `Z` 可以是参数坐标或相同维度的矩阵，在这种情况下，将为每个行三元组在相同坐标轴上绘制一个图。对于\
  \ `X`、`Y` 和 `Z` 的复值，将忽略其虚部。 >>\n```\nX = 0:0.1:1; Y = 0:0.1:1;\nZ = X.² + Y.²;\n\
  plot(X,Y,Z)\n```\n![image](img/image010.png) |\n| `surf(X,Y,Z)` | 使用 `X,Y,Z` 绘制曲面。`X,Y`\
  \ 是矩阵，`Z` 是高度。 >>\n![image](img/image011.png) |\n| `surf(X,Y,Z,C)` | 绘制曲面，`C` 是颜色数据。\
  \ >>\n![image](img/image012.png) |\n| `mesh(X,Y,Z)` | 绘制网格。 >>\n![image](img/image013.png)\
  \ |\n| `mesh(X,Y,Z,C)` | 绘制网格，`C` 是颜色数据。 >>\n![image](img/image014.png) |\n| `contour(X,Y,Z)`\
  \ | 在 `XY` 平面上绘制 `Z` 的等值线。 >>\n![image](img/image015.png) |\n| `contour(X,Y,Z,C)`\
  \ | 在 `XY` 平面上绘制 `Z` 的等值线。 >>\n![image](img/image016.png) |\n| `contour3(X,Y,Z)`\
  \ | 绘制三维空间中的等值面。 >>\n![image](img/image017.png) |\n| `fsurf(f)` | 绘制参数曲面。 |\n| `fsurf(f,u,v)`\
  \ | 绘制参数曲面。 |\n| `patch(V,F,C)` | 绘制多边形。 |\n| `fill3(X,Y,Z,C)` | 绘制多边形。 |\n\n\n\n\
  \n\n### `meshc(X,Y,Z,C)`\n表示显式表面 $z=f(x,y)$ 或参数方程 $x=x(t,u),y=y(t,u), z=z(t,u)$，以及对应的等高图（投影到\
  \ XY 平面的等高线）。\n```\n[X,Y] = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.² - Y.²);\n\
  meshc(X,Y,Z)\n```\n![image](img/image075.png)\n\n### `contour(Z)`\n为矩阵 `Z` 绘制等高图（等高线）。使用的等高线数量将自动选择。\n\
  ```\n[X,Y] = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.² - Y.²);\ncontour(Z)\n\
  ```\n![image](img/image085.png)\n\n### `contour(Z,n)`\n使用 `n` 条等高线为矩阵 `Z` 绘制等高图。\n\
  ```\n[X,Y] = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.² - Y.²);\ncontour(Z)\n\
  ```\n![image](img/image065.png)\n\n### `contour(x,y,Z,n)`\n使用 `x` 和 `y` 向量定义的 X\
  \ 和 Y 轴缩放比例，为矩阵 `Z` 绘制等高图（`n` 条等高线）。\n```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\n\
  X=cos(r)*cos(t);\nY=sin(r)*sin(t);\nZ=ones(1,size(r))'\\t;\ncontour(X,Y,Z)\n```\n\
  ![image](img/image067.png)\n\n### `contour3(Z)`, `contour3(Z,n)` and `contour3(x,y,Z,n)`\n\
  在三维空间中绘制等高图。\n```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\nX=cos(r)*cos(t);\nY=sin(r)*sin(t);\n\
  Z=ones(1,size(r))'\\t;\ncontour3(X,Y,Z)\n```\n![image](img/image156.png)\n\n###\
  \ `contourf(...)`\n绘制等高图并填充等值线之间的区域。\n```\nr=(0:0.1:2*pi)';\nt=(-pi:0.1:2*pi);\n\
  X=cos(r)*cos(t);\nY=sin(r)*sin(t);\nZ=ones(1,size(r))'\\t;\ncontourf(X,Y,Z)\n```\n\
  ![image](img/image009.png)\n\n### `pcolor(X,Y,Z)`\n基于颜色密度的表示法为 `(X,Y,Z)` 矩阵绘制等高图（等高线）。通常被称为密度图。\n\
  ```\n[X,Y] = meshgrid(-2:.2:2, -2:.2:2);\nZ = X .* exp(-X.² - Y.²);\nmeshc(X,Y,Z)\n\
  pcolor(X,Y,Z)\n```\n![image](img/image100.png)\n\n### `trimesh(Tri,X,Y,Z,C)`\n以网格形式显示\
  \ `Tri` 矩阵定义的三角形。`Tri` 矩阵的每一行定义一个三角形面，`C` 定义颜色。`C` 参数可选。\n\n### `trisurf(Tri,X,Y,Z,C)`\n\
  以表面形式显示 `Tri` 矩阵定义的三角形。`Tri` 矩阵的每一行定义一个三角形面，`C` 定义颜色。`C` 参数可选。\n\n## 3.5 三维几何形状\n\
  \n使用 MATLAB 可以绘制圆柱体、球体、柱状图、截面、状图和其他几何形状。下表总结了这些命令。\n\n### `bar3(Y)`\n相对于频率向量 `Y`\
  \ 绘制柱状图。如果 `Y` 是矩阵，则为 `Y` 的每一行获取多个柱状图。\n```\nbar3(rand(4,4))\n```\n![image](img/image029.png)\n\
  \n### `bar3(x,Y)`\n相对于频率向量 `Y` 绘制柱状图，其中 `x` 是定义柱子在 X 轴上位置的向量。\n\n### `bar3(...,width)`\n\
  具有指定宽度的柱状图。默认宽度为 `0.8`，设置为 `1` 会使柱子接触。\n\n### `bar3(...,'style')`\n具有指定样式的柱状图。样式有\
  \ `'detached'`（分离的）、`'grouped'`（分组的）和 `'stacked'`（堆叠的）。\n\n### `bar3(...,colour)`\n\
  柱子均为指定的颜色（`r=red` 红色、`g=green` 绿色、`b=blue` 蓝色、`c=cyan` 青色、`m=magenta` 品红色、`k=black`\
  \ 黑色和 `w=white` 白色）。\n\n### `com3(z)`, `com3(x,y,z)`\n相对于 `z` 向量的彗星图。参数图（`x(t)`,\
  \ `y(t)`, `z(t)`）。\n```\nt = -pi:pi/500:pi;\ncom3(sin(t),cos(t),t)\n```\n![image](img/image032.png)\n\
  \n### `cylinder(...)`\n给出单位圆柱坐标。给出由曲线 `r` 生成的圆柱坐标。给出由曲线 `r` 生成的带有 `Z` 轴对齐的周截面（默认\
  \ `n=20`）。绘制上述图形：\n```\nt = 0:pi/10:pi;\n[X,Y,Z] = cylinder(2+cos(t));\nsurf(X,Y,Z)\n\
  ```\n![image](img/image094.png)\n\n### `sphere`\n使用 `20x20` 面绘制单位球。\n\n### `sphere(n)`\n\
  使用 `nxn` 面生成球体。\n```\nsphere(100)\n```\n![image](img/image125.png)\n\n### `[X,Y,Z]\
  \ = sphere(n)`\n给出 `(n+1)x(n+1)` 矩阵的球体坐标。\n\n### `slice(V,sx,sy,sz)`, `slice(X,Y,Z,V,sx,sy,sz)`,\
  \ `slice(V,XI,YI,ZI)`, `slice(X,Y,Z,V,XI,YI,ZI)`\n绘制切片\n沿向量 `sx,sy,sz` 定义的体积 `V`（数组\
  \ `mxnp`）的 `x, y, z` 方向绘制切片。在由三维数组 `X,Y,Z` 定义的体积 `V` 中通过向量 `sx,sy,sz` 绘制切片。在矩阵 `XI,YI,ZI`\
  \ 定义的体积 `V` 中绘制生成面的切片。在三维数组 `X,Y,Z` 定义的体积 `V` 中通过数组 `XI,YI,ZI` 绘制生成面的切片。根据指定的插值方法绘制（`linear`\
  \ 为线性，`cubic` 为三次，`nearest` 为最近邻）。\n```\n[x,y,z] = meshgrid(-2:.2:2, -2:.25:2, -2:.16:2);\n\
  v = x .* exp(-x.² - y.² - z.²);\nslice(x,y,z,v,[-1.2 .8 2],2,[-2 -.2])\n```\n![image](img/image060.png)\n\
  \n### `stem3(Z)`, `stem3(X,Y,Z)`, `stem3(...,'fill')`, `stem3(...,S)`\n在 `(x,y)`\
  \ 平面上将序列 `Z` 绘制为状图。在 `X` 和 `Y` 指定的值处绘制 `Z`。用颜色填充柱状顶端的圆。使用 `S` 规范制作带状图（`colour`,\
  \ ...）。\n```\nX = linspace(0,1,10);\nY = X./2;\nZ = sin(X) + cos(Y);\nstem3(X,Y,Z,'fill')\n\
  ```\n![image](img/image083.png)\n\n## 3.6 专用图形\n\nATLAB 提供了绘制面积图、箱线图、三维饼图、帕累托图和其他专用图的命令。下表是这些命令的语法。\n\
  \n### `area(Y)`, `area(X,Y)`, `area(...,ymin)`\n相对于频率向量 `Y` 绘制面积图。相对于通过向量 `X` 的频率向量\
  \ `Y` 绘制面积图。指定填充区域在 `y` 方向的下边界。\n```\nY = [1, 5, 3;3, 2, 7;1, 5, 3;2, 6, 1];\narea(Y)\n\
  ```\n![image](img/image072.png)\n\n### `box on, box off`\n启用或关闭二维和三维图的轴框。\n\n###\
  \ `comet(y)`, `comet(x,y)`\n相对于频率向量 `Y` 绘制风筝图。相对于通过向量 `X` 的频率向量 `Y` 绘制风筝图。\n```\n\
  t = -pi:pi/200:pi;\ncomet(t,tan(sin(t))-sin(tan(t)))\n```\n![image](img/image059.png)\n\
