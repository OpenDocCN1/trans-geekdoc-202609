  *x²-x³+cos(x); h=-x+log(x);` >> `f+g` `ans = x + cos(x) + 3\\*x² - x³ + 1` |\n|\
  \ --- | --- |\n| `f+g+h+...` | 执行求和 `f+g+h+....` >> `f+g+h` `ans = cos(x) + log(x)\
  \ + 3\\*x² - x³ + 1` |\n| `f-g` | 实现 `f` 和 `g` 的差 (`f-g`) >> `f-g` `ans = x - cos(x)\
  \ - x² + x³ + 1` |\n| `f-g-h-...` | 实现差 `f-g-h-...` >> `f-g-h` `ans = 2\\*x - cos(x)\
  \ - log(x) - x² + x³ + 1` |\n| `f\\*g` | 执行 `f` 和 `g` 的乘积 (`f\\*g`) >> `f\\*g` `ans\
  \ = (cos(x) + 2\\*x² - x³)\\*(x² + x + 1)` |\n| `f\\*g\\*h\\*...` | 实现乘积 `f\\*g\\\
  *h\\*...` >> `f\\*g\\*h` `ans = -(x - log(x))\\*(cos(x) + 2\\*x² - x³)\\*(x² + x\
  \ + 1)` |\n| `f/g` | 求 `f` 和 `g` 的商 (`f/g`) >> `f/g` `ans = (x² + x + 1)/(cos(x)\
  \ + 2\\*x² - x³)` |\n| `f/g/h/...` | 求商 `f/g/h/....` >> `f/g/h` `ans = -(x² + x\
  \ + 1)/((x - log(x))\\*(cos(x) + 2\\*x² - x³))` |\n| `f^k` | 将 `f` 升为幂 `k` (`k`\
  \ 是标量) >> `f²` `ans = (x² + x + 1)²` |\n| `f^g` | 将一个函数升另一个函数 (`f ^ ( g )`) >> `f^g`\
  \ `ans = (x² + x + 1)^(cos(x) + 2\\*x² - x³)` |\n| `compose(f,g)` | `f` 和 `g` 的复合函数\
  \ (`f°g(x) = f(g(x))`) >> `compose(f,g)` `ans = cos(x) + (cos(x) + 2\\*x² - x³)²\
  \ + 2\\*x² - x³ + 1` |\n| `compose(f,g,u)` | `f` 和 `g` 的复合函数，取表达式 `u` 作为 `f` 和 `g`\
  \ 的域 >> `compose(f,g,h)` `ans = cos(log(x) - x) + 2\\*(x - log(x))² + (x - log(x))³\
  \ + (cos(log(x)` |\n| `g = finverse(f)` | `f` 的反函数 >> `finverse(f)` 警告: `finverse(x²\
  \ + x + 1)` 不是唯一的。`ans = (4\\*x - 3)^(1/2)/2 - 1/2` |\n| `![image](img/chapter_title_corner_decoration_left.png)`\
  \ | | `![image](img/chapter_title_corner_decoration_right.png)` |\n\n## 1.12 在工作区中处理变量并将其存储在文件中命令\n\
  \nMATLAB 有一组命令，允许你以非常简单的方式定义和管理变量，并将它们以 MATLAB 专有的格式（扩展名为 `.mat`）或 ASCII 格式存储在文件中。在进行大型计算时，为中间结果命名非常方便。这些中间结果被赋值给变量以便于使用。请记住，赋值给变量的值是持久的，直到它被显式更改或你离开当前的工作话。MATLAB\
  \ 包含了一组处理变量的命令，包括：\n\n| `clear` `clear(v1,v2, ..., vn)` | `clear('v1', 'v2', ...,\
  \ 'vn')` | 从工作区删除所有变量 删除指定的数值变量 删除指定的字符串变量 |\n| --- | --- |\n| `disp(X)` | | 显示数组\
  \ `X`（不带名称） |\n| `length(X)` | | 显示 `X` 的长度 如果 `X` 是向量 |\n| `load file` `load file\
  \ Z` `load file -ascii` `load file -mat` `S = load(...)` | 从 `.mat` 文件读取所有变量 从 `.mat`\
  \ 文件读取 `Y, Z` |\n| `save(h,'ext')` `save(h,'format')` | 将 `h` 保存为 `.ext` 图像或模型 |\n\
  | `d = size(X)` `m,n = size(X)` `d1,d2 = size(X)` | 返回 `X` 的每个维度 返回矩阵 `X` 的维度 `m`\
  \ 和 `n` |\n| `who` `whos` `who('-file')` `whos('-file')` `who('file')` `whos('file')`\
  \ `whos('var1','var2')` `s = who(...)` `s = whos(...)` | 列出工作区 列出 `.mat` 文件中的变量\
  \ 列出 `.mat` 文件中的字符串 列出 `.mat` 文件中的数值变量 存储在 `s` |\n| `workspace` | | 显示浏览器到 |\n\n\
  `save` 命令是将数据保存到 `.mat` 文件（仅由 MATLAB 读取）和 ASCII 文件（任何应用程序读取）的核心工具。默认情况下，变量通常保存为\
  \ `.mat` 文件。要将变量以 ASCII 格式存储，需要使用带有选项的 `save` 命令：\n\n| 选项 | 数据模式 |\n| --- | ---\
  \ |\n| `-append` | 添加到文件末尾 |\n| `-ascii` | 变量存储为 8 位 ASCII 格式 |\n| `-ascii -double`\
  \ | 变量存储为 16 位 ASCII 格式 |\n| `-ascii -tabs` | 变量存储为 8 位制表 ASCII 格式 |\n| `-ascii\
  \ -double -tabs` | 变量存储为 16 位制表 ASCII 格式 |\n| `-mat` | 变量存储为 MATLAB 格式二进制 .mat 文件\
  \ |\n\n练习 1. 计算 7 的 400 次幂精确到第 500 位小数。\n\n```\nvpa '7⁴⁰⁰' 500\n```\n```\nans =\
