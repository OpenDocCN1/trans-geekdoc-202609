  \ 6i]) ans = Columns 1 through 3 5.0000 + 1.0000i -7.0000 + 3.0000i 3.0000 -13.0000i\
  \ Column 4 3.0000 + 5.0000i` >> `fft2([1, 0, -23, 12, 16]) ans = Columns 1 through\
  \ 3 6.0000 14.8435+35.7894i -15.4435 -23.8824i Columns 4 through 5 -15.3435+23.8824i`\
  \ |\n| `ifft(V)` | V 的离散里叶逆变换 >> `ifft([1-i 1+i 3-5i 6i]) ans = Columns 1 through\
