  \n### 2.2.4 特定复变量函数\n\n![image](img/chapter_title_below.png)\n\nMATLAB 包含了一组专门用于处理模、角以及实部和虚部的复变量函数。这些函数包括：\n\
  \n| 函数 | 意义 |\n| --- | --- |\n| `abs(Z)` | Z 的模 >> `abs(12.425-8.263i)` `ans = 14.9217`\
  \ |\n| `angle(Z)` | Z 的角 >> `angle(12.425-8.263i)` `ans = -0.5869` |\n| `conj(Z)`\
  \ | Z 的共轭 >> `conj(12.425-8.263i)` `ans = 12.425 + 8.263i` |\n| `real(Z)` | 复数 Z\
  \ 的实部 >> `real(12.425-8.263i)` `ans = 12.425` |\n| `imag(Z)` | 复数 Z 的虚部 >> `imag(12.425-8.263i)`\
  \ `ans = -8.263` |\n| `floor(Z)` | 对 Z 的实部和虚部应用取整函数 >> `floor(12.425-8.263i)` `ans\
  \ = 12.0000 - 9.0000i` |\n| `ceil(Z)` | 对 Z 的实部和虚部应用向上取整函数 >> `ceil(12.425-8.263i)`\
  \ `ans = 13.0000 - 8.0000i` |\n| `round(Z)` | 对 Z 的实部和虚部应用四舍五入 >> `round(12.425-8.263i)`\
  \ `ans = 12.0000 - 8.0000i` |\n| `fix(Z)` | 对 Z 的实部和虚部应用向零取整 >> `fix(12.425-8.263i)`\
  \ `ans = 12.0000 - 8.0000i` |\n\n## 2.3 参数为复向量的基础函数\n\n\n\n\n\nMATLAB 允许你处理向量甚至矩阵复数变量函数。不要忘记，这些函数对于实变量也是有效的，因为实数是虚部为零的复数的特殊情况。下表包含了\
  \ MATLAB 的特定的向量复数变量函数。稍后介绍矩阵复数变量函数时，我们将看到它们也适用于向量变量，因为向量是矩阵的特殊情况。\n\n| 函数 | 描述与示例\
  \ |\n| :--- | :--- |\n| `max(V)` | 最大分量（复数计算 `max(abs(V))`） >> `max([1-i 1+i 3-5i\
  \ 6i]) ans = 0 + 6.0000i` >> `max([1, 0, -23, 12, 16]) ans = 16` |\n| `min(V)` |\
  \ 最小分量（对于复数计算 `min(abs(V))`） >> `min([1-i 1+i 3-5i 6i]) ans = 1. - 1.0000i` >> `min([1,\
  \ 0, -23, 12, 16]) ans = -23` |\n| `mean(V)` | V 的分量的平均值 >> `mean([1-i 1+i 3-5i\
  \ 6i]) ans = 1.2500 + 0.2500i` >> `mean([1, 0, -23, 12, 16]) ans = 1.2000` |\n|\
  \ `median(V)` | V 的分量的位数 >> `median([1-i 1+i 3-5i 6i]) ans = 2.0000 - 2.0000i` >>\
  \ `median([1, 0, -23, 12, 16]) ans = 1` |\n| `std(V)` | V 的分量的标准差 >> `std([1-i 1+i\
  \ 3-5i 6i]) ans = 4.7434` >> `std([1, 0, -23, 12, 16]) ans = 15.1888` |\n| `sort(V)`\
  \ | 按升序排列 V 的分量。对于复数，根据绝对值排序。 >> `sort([1-i 1+i 3-5i 6i]) ans = Columns 1 through\
  \ 2 1.0000 - 1.0000i 1.0000 + 1.0000i Columns 3 through 4 3.0000 - 5.0000i 0 + 6.0000i`\
  \ >> `sort([1, 0, -23, 12, 16]) ans = -23 0 1 12 16` |\n| `sum(V)` | V 的分量的和 >>\
  \ `sum([1-i 1+i 3-5i 6i]) ans = 5.0000 + 1.0000i` >> `sum([1, 0, -23, 12, 16]) ans\
  \ = 6` |\n| `prod(V)` | 乘 V 的元素，使得 `n ! != prod(1:n)` >> `prod([1-i 1+i 3-5i 6i])\
  \ ans = 60.0000 +36.0000i` >> `prod([1, 0, -23, 12, 16]) ans = 0` |\n| `cumsum(V)`\
  \ | 给 V 的累积和向量 >> `cumsum([1-i 1+i 3-5i 6i]) ans = Columns 1 through 2 1.0000 -\
  \ 1.0000i 2.0000 Columns 3 through 4 5.0000 - 5.0000i 5.0000 + 1.0000i` >> `cumsum([1,\
  \ 0, -23, 12, 16]) ans = 1 1 -22 -10 6` |\n| `cumprod(V)` | 给 V 的累积积向量 >> `cumprod([1-i\
  \ 1+i 3-5i 6i]) ans = Columns 1 through 2 1.0000 - 1.0000i 2.0000 Columns 3 through\
  \ 4 6.0000 -10.0000i 60.0000 +36.0000i` >> `cumprod([1, 0, -23, 12, 16]) ans = 1\
  \ 0 0 0 0` |\n| `diff(V)` | 给 V 分量的一阶差分向量 (`V t-1`) >> `diff([1-i 1+i 3-5i 6i])\
  \ ans = 0 + 2.0000i 2.0000 - 6.0000i +11.000i` >> `diff([1, 0, -23, 12, 16]) ans\
  \ = -23 35 4` |\n| `gradient(V)` | 近似 V 的梯度 >> `gradient([1-i 1+i 3-5i 6i]) ans\
  \ = Columns 1 through 3 0 + 2.0000i 1.0000 -0.5000 +2.5000i Column 4 -3.0000 +11.000i`\
  \ >> `gradient([1, 0, -23, 12, 16]) ans = -1.0000 -12.0000 19.0000 4.0` |\n| `del2(V)`\
  \ | V 的拉普拉斯（离散点） >> `del2([1-i 1+i 3-5i 6i]) ans = Columns 1 through 3 2.2500 -\
  \ 8.2500i 0.5000 - 2.0000i -1.2500 + 4.2500i Column 4 -3.0000 +10.5000i` >> `del2([1,\
  \ 0, -23, 12, 16]) ans = -25.5000 -5.5000 14.5000 -7.7500` |\n| `fft(V)` | V 的离里叶变换\
  \ >> `fft([1-i 1+i 3-5i 6i]) ans = Columns 1 through 3 5.0000 + 1.0000i -7.0000\
  \ + 3.0000i 3.0000 -13.0000i Column 4 3.0000 + 5.0000i` >> `fft([1, 0, -23, 12,\
  \ 16]) ans = Columns 1 through 3 6.0000 14.8435+35.7894i -15.4435 -23.8824i Columns\
