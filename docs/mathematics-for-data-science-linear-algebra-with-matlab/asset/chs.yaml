  \ |\n\n![image](img/chapter_title_above.png)\n\n## 5.2 矩阵分解。特征值与特征向量\n\n![image](img/chapter_title_below.png)\n\
  \nMATLAB 允许你在矩阵分解领域进行精细操作。它实现了大多数已知分解的命令，以及用于处理特征值和特征向量命令。该领域最常用命令的语法见下表。\n\n| `eig(A)`\
