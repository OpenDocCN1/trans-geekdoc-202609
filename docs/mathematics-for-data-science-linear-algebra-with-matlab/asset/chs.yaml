  \ `x = lsqnonneg(C,d,x0,opt)` | `[x,resnorm] = lsqnonneg(...)` | `[x,resnorm,residual]\
  \ = lsqnonneg(...)` | `[x,resnorm,residual,f] = lsqnonneg(...)` | `[x,resnorm,residual,f,out,lambda]\
  \ = lsqnonneg(...)` |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | |\
  \ | | | | |\n| 通过最小二乘法（实数 `C` 和 `d`）给出在 `x≥0` 条件下最小 `norm(C*x-d)` 的 `x` | 给出在 `x≥0`\
  \ 条件下最小 `norm(C*x-d)` 的 `x`，但使用 `x=x0` 作为初值。 | 给出在 `x≥0` 条件下使用 `x=x0≥0` 作为初值和选项\
  \ `opt` 最小 `norm(C*x-d)` 的 `x`。 | | | |\n\n以下是 MATLAB 提供的通过对称最小二乘和非负最小二乘法求解方程和系统的命令。\n\
  \n\n\n\n如果 `M` 的行列式为零，则方程组有无穷解，这意味着 `M` 中存在线性依赖的行或列。在这种情况下，将计算冗余方程的数量，以确定需要固定多少个变量才能得到无穷解。如果矩阵\
  \ `M` 是矩形的（非方阵），则系统可能是不定的（方程个数少于变量个数）、超定的（方程个数大于变量个数）或非奇异的（方程个数等于变量个数且 `M` 的行列式非零）。不定的系统可能有无穷解，也可能无解，超定系统也是如此。如果一个系统无解，则称为不一致（不兼容），如果至少存在解，则称为相容（兼容）。当向量\
  \ `B` 为零向量时，系统 `M.X = B` 称为`齐`系统。该系统将具有 `M.X = 0` 的形式。如果 `M` 的行列式非零，系统的唯一解是零向量（通过\
  \ `linsolve` 命令获得）。如果 `M` 的行列式为零，则系统有无穷多解（它是不定相容的）。解将通过之前见过的用于通用线性系统的 `solve` 或\
  \ `linsolve`、`lsqr` 等命令找到。\n\n分析和求解方程组的一个基本工具是 `Rouché Frobenius 定理`。该定理指出，一个有 `m`\
  \ 个方程 `n` 个未知数的系统有解，当且仅当系数矩阵的秩与包含系统独立项列向量的扩展矩阵的秩相等。如果两个秩相等且等于未知数，则系统有唯一解。如果两个秩相等但小于未知数，则系统有无穷解。如果它们不等，则系统无解。\n\
  \n令 `A` 为系统的系数矩阵，`B` 为带有独立项向量的扩展矩阵。\n\n- 如果 `range(A) ≠range(B)`，系统是不兼容的（无解的）。\n\
  - 如果 `rank(A)=rank(B) < n`，系统是不定相容（有无穷解）。\n- 如果 `rank(A)=rank(B) = n`，系统是确定相容（有唯一解）。\n\
  \n该定理使得在求解方程组之前分析其解成为可能。\n\n我们已经知道另一种特殊类型的线性方程是`齐次方程组`。如果独立项向量 `B` 为零，则系统 `A.X=B`\
  \ 是齐次的，因此任何齐次系统都具有 `A.X=0` 的形式。在齐次系统中，系数矩阵的秩与带有独立项列的扩展矩阵的秩始终相等。如果应用 Rouché-Frobenius\
  \ 定理，当矩阵 `A` 的行列式非零时，齐次系统有一个唯一解。这个唯一解是零向量，因为齐次系统中总能零解。当矩阵 `A` 的行列式为零时，齐次系统有无穷解。在这种情况下，无穷解的计算方法与通用相同（`solve`\
  \ 命令），也可以使用 `null` 函数 `(A)`。\n\n### 示例 1\n\n作为第一个示例，我们求解方程：\n```\n2 x + y + z +\
  \ t = 1\nx + 2 y + z + t = 1\nx + y +2 z + t = 1\nx + y + z +2 t = 1\n```\n我们将找到系统矩阵以及带有独立项列的扩展矩阵的秩。\n\
  ```\n>> A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\n>> B=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\n\
  >> [rank(A), rank(B)] >> [rank(A), rank(B)].\nans = 4 4\n```\n我们观察到两个矩阵的秩等于未知数的个数。Rouché-Frobenius\
  \ 定理确保了系统是确定相容且具有唯一解。我们可以通过以下方式计算解：\n```\n>> B=[1 1 1 1];\n>> linsolve(A,B)\nans\
  \ = 0.2000 0.2000 0.2000 0.2000\n```\n系统也可以通过以下命令求解：\n```\n>> solve(A,B) # 注意：此处应为\
  \ solve，原文可能误写为 scov，但按原意保留或修正，此处保持代码不翻译\n>> bicg(A,B)\nbicg 在第 1 次迭代收敛到解，残差为 0\n\
  ans = 0.2000 0.2000 0.2000 0.2000\n>> pcg(A,B)\npcg 在第 1 次迭代收敛到解，残差为 0\nans = 0.2000\
  \ 0.2000 0.2000 0.2000\n>> lsqr(A,B)\nlsqr 在第 1 次迭代收敛到解，残差为 0\nans = 0.2000 0.2000\
  \ 0.2000 0.2000\n>> qmr(A,B)\nqmr 在第 1 次迭代收敛到解，残差为 0\nans = 0.2000 0.2000 0.2000\
  \ 0.2000\n>> gmres(A,B)\ngmres 在第 1 次迭代收敛到解，残差为 1.5e-16\nans = 0.2000 0.2000 0.2000\
  \ 0.2000\n>> symmlq(A,B)\nsymmlq 在第 1 次迭代收敛到解，残差为 0\nans = 0.2000 0.2000 0.2000\
  \ 0.2000\n```\n\n### 示例 2\n\n作为第二个示例，我们求解方程：\n```\nx + 2y + 3z = 6\nx + 3y + 8z\
  \ = 19\n2x + 3y + z = -1\n5x + 6y + 4z = 5\n```\n我们将找到系统矩阵以及带有独立项列的扩展矩阵的秩。\n```\n\
  >> A=[1,2,3;1,3,8;2,3,1;5,6,4];\n>> B=[1,2,3,6;1,3,8,19;2,3,1,-1;5,6,4,5];\n>> [rank(A),\
  \ rank(B)] >> [rank(A), rank(B)].\nans = 3 3\n```\n我们观察到两个矩阵的秩等于未知数的个数。Rouché-Frobenius\
  \ 定理确保了系统是确定相容且具有唯一解。我们可以通过以下方式计算解：\n```\n>> A=[1,2,3;1,3,8;2,3,1;5,6,4];\n>> B=[6\
  \ 19 -1 5]';\n>> linsolve(A,B)\nans = 1.0000 -2.0000 3.0000 \n\n### 示例 3\n\n作为第三个示例，我们求解方程：\n\
  ```\nx + 2y - z = 0\n2x - y + z = 0\n3x + y = 0\n```\n由于我们处理的是齐次系统，我们将计算系统系数矩阵的行列式。\n\
  ```\n>> A=[1,2,-1;2,-1,1;3,1,0];\n>> det(A)\nans = 5.5511e-16\n```\n由于行列式实际上为零，齐次系统将有无穷解，如下所示使用\
  \ `solve` 命令计算：\n```\n>> [x,y,z]=solve('x+2y-z, 2x-y+z, 3x+y', 'x,y,z')\nx = -z1/5\n\
  y = (3*z1)/5\nz = z1\n```\n观察到无穷解取决于参数 `z1`，并可以写如下：\n`{(-z1/5, 3z1/5, z1)}z1`\n\n\
