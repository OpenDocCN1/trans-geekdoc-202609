  \n# 第 4 章：代数表达式、多项式、方程和方程组\n\n## 4.1 代数表达式的展开、简化和因式分解\n\nMATLAB 包含了大量的命令，允许你处理代数表达式。你可以对表达式进行尽可能的简化、展开或进行适当的因式分解。下表列了处理代数表达式最常用的命令。\n\
  \n| 命令 | 说明 |\n| --- | --- |\n| `expand(expr)` | 尽可能地展开代数表达式，完全展开乘积和幂，直到结果以求和的形式呈现。对三角表达式应用多个倍角公式，并正式地应用对数和指数函数的性质。还会将代数分式分解为和。\
  \ |\n| `factor(expr)` | 将展开的代数表达式写为因子的乘积（`expand` 的逆操作）。因式分解默认对表达式的主体进行。对于代数分式，对分子和分母进行分解并简化公因子。\
  \ |\n| `simplify(expr)` | 通过执行最终求和以及代数的加法，尽可能地简化代数表达式。 |\n| `simple(expr)` | 通过显示使用的规则尽可能地简化代数表达式。\
  \ |\n| `collect(expr)` | 通过按变量的幂对项分组来展示表达式的结果。 |\n| `horner(expr)` | 以霍纳形式（Horner\
  \ form）对表达式进行因式分解。 |\n\n## 4.2 多项式\n\nMATLAB 实现了用于多项式的特定命令，例如求根、求导和插值。下表给出了涉及多项式的命令的语法和示例。\n\
  \n| 命令 | 说明 |\n| --- | --- |\n| `poly2sym(vector)` | 将向量转换为符号多项式，其系数为向量元素（从高幂到低幂）。\
  \ |\n| `poly2sym(vector,'v')` | 将向量转换为变量 `v` 的符号多项式，其系数为向量元素。 |\n| `sym2poly(polynomial)`\
  \ | 将多项式转换为向量，其元素为系数。 |\n| `q=conv(u,v)` | 给由向量 `u` 和 `v` 指定系数的多项式乘积的系数。 |\n| `[q,r]\
  \ = deconv(v,u)` | 给多项式 `u` 和 `v` 相除的商和余数。我们有 `v = conv(u,q)+r`。 |\n| `p = poly(r)`\
  \ | 给根为向量 `r` 的多项式 `p` 的系数。 |\n\n\n\n\n\n## 4.3 多项式插值\n\n`k = polyder(p)`, `k =\
  \ polyder(a,b)`, `[q,d] = polyder(b,a)`\n给出多项式 `p` 导出的多项式 `k` 的系数。\n给出 `a` 和 `b`\
  \ 之积导数的系数。\n给出 `a/b` 数的分子 `q` 和分母 `d`。\n\n```\n>> polyder([1 -8 17 2 -24])\nans\
  \ = 4 -24 34 2\n>> poly2sym([1 -8 17 2 -24])\nans = x⁴ - 8*x³ + 17*x² + 2*x - 24\n\
  >> poly2sym(polyder([1 -8 17 2 -24]))\nans = 4*x³ - 24*x² + 34*x + 2\n>> u=[3 -1\
  \ 4 2];v=[2 1 4 4 6 8 3];\n>> k=polyder(u,v)\nk = 48 7 114 110 144 99 82 28\n>>\
  \ poly2sym(k)\nans = 48*x⁷ + 7*x⁶ + 114*x⁵ + 110*x⁴ + 144*x³ + 99*x² + 82*x + 28\n\
  >> [q,d]=polyder(u,v)\nq = -12 3 -30 -10 8 -29 -30 -4\nd = 4 4 17 32 60 76 106 120\
  \ 100 48 9\n```\n\n`p = polyfit(x,y,n)`, `[p,S] = polyfit(x,y,n)`, `[p,S,u] = polyfit(x,y,n)`\n\
  拟合点云 `(x,y)` 的 `n` 次多项式。\n`n` 次多项式拟合点 `(x,y)`，方差为 `S`。\n`n` 次多项式拟合 `(x,y)` 点，拟合误差的方值为\
  \ `S`，均值为 `u`。\n\n```\n>> u=[3 -1 4 2];v=[2 1 4 6];\n>> p=poly2sym(polyfit(u,v,3))\n\
  p = (53*x³)/60 - (99*x²)/20 + (119*x)/30 + 54/5\n>> [p,S,u]=polyfit(u,v,3)\np =\
  \ 8.9050 1.6333 -11.3053 6.0000\nS = A: [4x4 double]. df: 0 normr: 1.2686e-014\n\
  u = 2.0000 2.1602\n```\n\n`y = polyval(p,x)`, `y = polyval(p,x,[],u)`, `[y,delta]\
  \ = polyval(p,x,S)`, `[y,delta] = polyval(p,x,S,u)`\n在 `x` 处求多项式 `p`。\n在均值为 `u`\
  \ 的 `x` 处求多项式 `p`。\n在方差为 `S` 的 `x` 处求多项式 `p`，结果误差为 `y ±delta`。\n在均值为 `u` 且方差为 `S`\
  \ 的 `x` 处求多项式 `p`，结果误差为 `y ±delta`。\n\n```\n>> p=[2 0 -1 7 9]\np = 2 0 -1 7 9\n\
  >> poly2sym(p)\nans = 2*x⁴ - x² + 7*x + 9\n>> polyval(p,10)\nans = 19979\n```\n\n\
  `Y = polyvalm(p,X)`\n在矩阵变量 `X` 处求多项式 `p`。\n\n```\n>> X=[1 2 3;4 5 6;7 8 9]\nX =\
  \ 1 2 3 4 5 6 7 8 9\n>> p=[2 0 -1 7 9]\np = 2 0 -1 7 9\n>> A=polyval(p,X)\nA = 17\
  \ 51 183 533 1269 2607 4811 8193 13113\n```\n\n`[r,p,k] = residue(b,a)`, `[b,a]\
  \ = residue(r,p,k)`\n给出有理展开 `b/a` 的残数、极点和直接项。\n将有理展开转换为多项式 `b` 和 `a`。\n\n```\n>>\
  \ u=[3 -1 4 2];v=[2 1 4 4 6 8 3];\n>> [r,p,k]=residue(v,u)\nr = 0.4751-0.6032i 0.3705+1.2240i\
  \ -0.4076\np = 0.6667 0.5556 0.6296\n>> [v,u]=residue(r,p)\nv = 0.6667 0.3333 1.3333\
  \ 2.0000 2.6667\n```\n\n`r = roots(c)`\n给出系数为 `c` 的多项式根的列向量 `r`。\n\n```\n>> v=[0.6667\
  \ 0.3333 1.3333 2.0000 2.6667];\n>> r=roots(v)\nr = 0.6662+1.4813i 0.6662-1.4813i\
  \ 0.6662+0.8326i 0.6662-0.8326i -0.5000\n```\n\nMATLAB 实现了用于多项式插值的代数和图形命令。下表展示了多项式插值最重要的命令。\n\
  \n`Yi = interp1(X,Y)`, `Yi = interp1(Y,Xi)`, `Yi = interp1(X,Y,method)`, `Yi = interp1(X,Y,method,ext)`\n\
  给出向量 `Yi`，其中 `(Xi,Yi)` 是通过点集 `(X,Y)` 的一维插值得到的点集。假设 `X=1:N`，其中 `N` 是 `Y` 的长度。使用指定的方法进行插值，方法可以是\
  \ `nearest`（最近邻）、`linear`（线性）、`cubic`（三次）、`v5cubic`（五三次）和 `pchip`（Hermite 三次）。此外，对于插值\
  \ `x` 范围外的值 `ext` 执行外推。\n在下面的示例中，根据函数 `y=sin(x)`，对等间距的 `x` 值对 20 个点 `(x,y)` 进行插值。\n\
  \n```\n>> x = 0:10; y = sin(x); xi = 0:.5:10;yi = interp1(x,y,xi); points=[xi',yi'].\n\
  points =\n0 0\n0.5000 0.4207\n1.0000 0.8415\n1.5000 0.8754\n2.0000 0.9093\n2.5000\
  \ 0.5252\n3.0000 0.1411\n3.5000 -0.3078\n4.0000 -0.7568\n4.5000 -0.8579\n5.0000\
  \ -0.9589\n5.5000 -0.6192\n6.0000 -0.2794\n6.5000 0.1888\n7.0000 0.6570\n7.5000\
  \ 0.8232\n8.0000 0.9894\n8.5000 0.7007\n9.0000 0.4121\n10.0000 -0.5440\n```\n\n\
  `Zi = interp2(X,Y,Z,Xi)`, `Zi = interp2(Z)`, `Zi = interp2(X,Y,Xi,method)`\n给出向量\
  \ `Zi`，其中 `(Xi,Yi)` 是通过点集 `(X,Y,Z)` 的二维插值得到的点集。假设 `X=1:n`, `Y=1:m` 且 `(n,m) = size(Z)`。进行\
  \ `n` 次二维递归插值。使用指定的方法进行插值。在下面的示例中，我们考虑了一组年份和工资，并尝试通过插值找到工作了 15 年的员工在 1975 年赚取的工资。\n\
  \n```\n>> years = 1950:10:1990;\nservices = 10:10:30;\nwages = [150,697 199,592\
  \ 187,625 179,323 203,212 226,767 153,706 249,633 598,243];\n>> w = interp2(services,years,wages,15,1975)\n\
  w = 190.6288\n```\n\n`Vi = interp3(X,Y,Z,V,Xi,Yi,Zi)`, `Vi = interp3(V)`, `Vi =\
  \ interp3(...,method)`\n给出向量 `Vi`，其中 `(Xi,Yi,Zi)` 是对点集 `(X,Y,Z)` 应用三维函数 `V` 后通过三维插值得到的点集。假设\
  \ `X=1:n, Y=1:m, Z=1:p` 且 `(n,m,p) = size(V)`。进行 `n` 次三维递归插值。使用指定的方法进行插值。在下面的示例中，根据预定义\
  \ MATLAB 函数 `flower` 在 `x` 在 0.1 到 10 之间（间距为 0.5）以及 `y` 和 `z` 在 -3 到 3 之间（间距为 0.5）的取值点\
  \ `(x,y,z,t)` 计算了三维插值的体积点矩阵 `w=f(x,y,z)` 并绘制。\n\n```\n>> [x,y,z,v] = flow(10);\n\
  [xi,yi,zi] = meshgrid(.1:.5:10,-3:.5:3,-3:.5:3);\nvi = interp3(x,y,z,v,xi,yi,zi);\n\
  slice(xi,yi,zi,vi,[6 9.5],2,[-2 .2]), shading flat\n```\n\n\n\n\n\n### 插值方法\n\n\
  `Y = interpft(X,n)`, `y = interpft(x,n,dim)`\n使用 FFT 方法进行一维插值。它给出向量 `Y`，其中包含在 `n`\
  \ 个等间隔点上采样的周期函数 `X` 的值。原始向量 `X` 使用快速傅里变换 `FFT` 转换傅里叶频率域。沿指定的维度操作。展示了一个示例，比较了原始点与通过\
  \ FFT 方法插值的点。\n\n```matlab\ny = [0:.5:2 1.5:-.5:-2 -1.5:.5:0]; % 等间距的点\nfactor =\
  \ 5; % 因子为 5 的插值\nm = length(y)*factor;\nx = 1:factor:m;\nxi = 1:m;\nyi = interpft(y,m);\n\
  plot(x,y,'o',xi,yi,'\\*')\nlegend('original data','interpolated data')\n```\n![image](img/image118.png)\n\
  \n`Vi = interpn(X,Y,Z,...V,Xi,Yi,Zi...)`\n`Vi = interpn(V,Xi,Yi,Zi)`, `Vi = interpn(V,n)`,\
  \ `Vi = interpn(...,method)`\n给出向量 `Vi`，使得 `(Xi,Yi, Zi,...)` 是通过对三维函数 `V` 应用于 `(X,Y,Z,...)`\
  \ 后进行 `n` 维插值得到的点集。假设 `X=1:n`, `Y=1:m`, `Z=1:p,...` 且 `(n,m,p,...) = size V`。递归进行\
  \ `n` 次 `n` 维插值。使用指定的方法进行插值。\n![image](img/scene_break.png)\n\n`Yi = pchip(X,Y,Xi)`\n\
  `pp = pchip(X,Y)`\n给出向量 `Yi`，使得 `(Xi,Yi)` 是通过分段埃米三次多项式插值 (PCHIP) 对给定点集 `(X,Y)` 得到的点集。在中间点处执行插值。\n\
  \n`Yi = spline(X,Y,Xi)`\n`pp = spline(X,Y)`\n给出向量 `Yi`，使得 `(Xi,Yi)` 是通过三次样条插值对给定点集\
  \ `(X,Y)` 得到的点集。在中间点处执行插值。展示了一个示例，比较了原始点与通过 `pchip` 和 `spline` 方法插值的点。\n\n```matlab\n\
  x = -3:3;\ny = [-1 -1 -1 0 1 1 1];\nt = -3:.01:3;\nplot(x,y,'o',t,[pchip(x,y,t);\
  \ spline(x,y,t)])\nlegend('data','pchip','spline',4)\n```\n![image](img/image079.png)\n\
  \n`Zi = griddata(X,Y,Z,Xi,Yi)`\n`[Xi,Yi,Zi] = griddata(X,Y,Z,Xi,Yi)`, `[...] = griddata(...,method)`\n\
  在向量空间 `(X,Y,Z)` 中拟合一个形式为 `Z=f(X,Y)` 的表面。向量 `Zi` 确定给定点 `(X,Y,Z)` 之间的插值点 `(Xi,Yi,Zi)`。使用反距离法进行插值。除了\
  \ `Xi` 之外，还给出行列向量 `Yi` 和 `Zi`。使用指定的方法进行插值。以下是一个表面插值调整的示例。\n\n```matlab\nx = rand(100,1)*4-2;\
  \ y = rand(100,1)*4-2;\nz = x.*exp(-y.²);\nti = -2:.25:2;\n[xi,yi] = meshgrid(ti,ti);\n\
  zi = griddata(x,y,z,xi,yi);\nmesh(xi,yi,zi), hold on, plot3(x,y,z,'o'), hold off\n\
  ```\n![image](img/image082.png)\n\n`W = griddata3(X,Y,Z,V,Xi,Yi,Zi)`\n`W = griddata3(...,method)`\n\
  在在向量空间 `(X,Y,Z)` 中拟合一个形式为 `W=f(X,Y,Z)` 的表面。向量 `W` 确定给定点 `(X,Y,Z)` 之间的插值点 `(Xi,Yi,Zi)`。使用反距离法进行插值。使用指定的方法进行插值。以下是一个表面插值调整的示例。\n\
  \n```matlab\nx = 2*rand(5000,1)-1; y = 2*rand(5000,1)-1; z = 2*rand(5000,1)-1;\n\
  v = x.² + y.² + z.²;\nd = -0.8:.05:0.8;\n[xi,yi,zi] = meshgrid(d,d,d);\nw = griddata3(x,y,z,v,xi,yi,zi);\n\
  p = isosurface(xi,yi,zi,w,0);\npatch(p,'FaceColor','blue','EdgeColor','none');\n\
  view(3), axis equal, axis off, camlight, lighting gouraud\n```\n![image](img/image44.png)\n\
  \n# 4.4 求解方程和组\n\nMATLAB 提供了多个求解方程和组的命令。后续章节介绍了这些方法的语法和特性。\n\n### 4.4.1 通用方法\n\n\
  以下是 MATLAB 中求解方程和组的最常用命令。\n\n`solve('equation','x')`\n求解变量 `x` 的方程。\n`solve('sin(x)\
  \ = r')`\n`ans = asin(r/p)`\n\n`solve('equation(x)','x')`\n求解变量 `x` 的方程 `equation(x)=0`。\n\
  `sym r; solve('cos(x)=r', x)`\n`ans = acos(r/p)`\n\n`solve('ec1,ec2,...,en','x1,x2,...,xn')`\n\
  在变量 `x1` 到 `xn` 上求解 `n` 个联立方程 `ec1` 到 `en`。\n`sym x,y; solve([x²+y+y-3, x²-4x+3=0])`\n\
  `x = 1/3`, `y = -3/2`\n\n`sym x1,x2...xn; solve('ec1,ec2,...,en,x1,x2,...,xn')`\n\
  在变量 `x1` 到 `xn` 上求解 `n` 个联立方程 `ec1` 到 `en`。\n`sym x,y; solve([x²+y+y-3, x²-4x+3])`\n\
  `x = 1/3`, `y = -3/2`\n\n`X = linsolve(A,B)`\n对方方矩阵 `A` 求解 `A*X=B`，其中 `B` 和 `X`\
  \ 是矩阵。我们求解组：\n`x + y + z + t = 1`\n`x + 2y + z + t = 2`\n`x + y + 2z + t = 3`\n\
  `x + y + z + 2t = 4`\n```matlab\nA=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B=[1,2,3,4];\n\
  linsolve(A,B)\nans = -1 0 1 2\n```\n\n`x = lscov(A,B)`, `x = lscov(A,B,V)`\n以最小二乘法求解\
  \ `A*x=B`。以误差协方差正比于 `V` 的最小二乘法求解 `A*x=B`。即，给出向量 `x` 使得 `Ax=b+e` 且 `e→N(0,V)`。给出使\
  \ `(A*x-B)'*inv(V)*(A*x-B)` 的 `x`（向量）。\n```matlab\nA=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\
  \ B=[1,2,3,4];\nlscov(A,B)\nans = -1 0 1 2\n```\n\n`X = A`\n求解组 `A*X=B`。\n```matlab\n\
  A=[2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B=[1,2,3,4];\nA\nans = -1.0000 -0.0000 1.0000\
  \ 2.0000\n```\n\n`X = A/B`\n求解组。\n\n\n\n\n\n# 双共轭梯度法 \n\n| `x = bicg(A,b)` | `bicg(A,b,tol)`\
  \ | `bicg(A,b,tol,maxit)` | `bicg(A,b,tol,maxit,M)` | `bicg(A,b,tol,maxit,M1,M2)`\
  \ | `bicg(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = bicg(A,b,...)` |\n| --- | --- | ---\
  \ | --- | --- | --- | --- |\n\n尝试使用双共轭梯度法求解方程 `Ax=b`。\n\n```matlab\nA=[pi 2*pi 3*pi\
  \ -pi; 1 0 -1 2; exp(1) exp(2) exp(3) exp(4); i 2i 3i -i];\nB=[1 2 3 4]';\nbicg(A,B)\n\
  ```\nbicg 在第 4 次迭代时停止，未达到期望的容差 1e-006，因为达到了最大迭代次数。返回的迭代值（次数 0）的相对残差为 1。\n`ans =\
  \ 0 0 0 0`\n\n指定容差求解 `Ax=b`\n指定容差和最大迭代次数求解 `Ax=b`\n```matlab\nbicg(A,B, 1e-009,100)\n\
  ```\n`ans = 1.0e+016 * 4.1449 - 0.7033i -7.1997 + 1.2216i 3.2729 - 0.5553i -0.4360\
  \ + 0.0740i`\n\n求解方程 `inv(M)*A*x = inv(M)*b`\n使用 `M=M1*M2` 求解方程 `inv(M)*A*x = inv(M)*b`\n\
  使用 `M=M1*M2` 和初始值 `x0` 求解方程 `inv(M)*A*x = inv(M)*b`\n求解方程，`f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞，4=极值数值）。\n\
  \n```matlab\n[x,f]=bicg(A,B, 1e-009,100)\n```\n`x = 1.0e+016 * 4.1449 - 0.7033i\
  \ -7.1997 + 1.2216i 3.2729 - 0.5553i -0.4360 + 0.0740i`\n`f = 3`\n\n# 稳定双共轭梯度法\n\
  \n| `x = bicgstab(A,b)` | `bicgstab(A,b,tol)` | `bicgstab(A,b,tol,maxit)` | `bicgstab(A,b,tol,maxit,M)`\
  \ | `bicgstab(A,b,tol,maxit,M1,M2)` | `bicgstab(A,b,tol,maxit,M1,M2,x0)` | `[x,f]\
  \ = bicgstab(A,b,...)` |\n| --- | --- | --- | --- | --- | --- | --- |\n\n`[x,f,relres]\
  \ = bicgstab(A,b,...)`, `[x,f,relres,iter] = bicgstab(A,b,...)`\n\n使用稳定双共轭梯度法求解方程\
  \ `Ax=b`。\n\n```matlab\nbicgstab(A,B)\n```\nbicgstab 在第 4 次迭代时停止，未达到期望的容差 1e-006，因为达到了最大迭代次数。返回的迭代值（次数\
  \ 4）的相对残差为 0.88。\n`ans = 1.0e+011 * 0.6696 - 0.4857i -1.1631 + 0.8437i 0.5287 -\
  \ 0.3835i -0.0704 + 0.0511i`\n\n指定容差求解 `Ax=b`\n指定容差和最大迭代次数求解 `Ax=b`\n```matlab\n\
  bicg(A,B, 1e-009,100)\n```\n`ans = 1.0e+016 * 4.1449 - 0.7033i -7.1997 + 1.2216i\
  \ 3.2729 - 0.5553i -0.4360 + 0.0740i`\n\n求解方程 `inv(M)*A*x = inv(M)*b`\n使用 `M=M1*M2`\
  \ 求解方程 `inv(M)*A*x = inv(M)*b`\n使用 `M=M1*M2` 和初始值 `x0` 求解方程 `inv(M)*A*x = inv(M)*b`\n\
  求解方程，`f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞，4=极值数值）。它还返回相对残差 `norm(b-A*x)/norm(b)`。同时返回迭代次数。\n\
  \n```matlab\n[x,f,r,i]=bicg(A,B, 1e-006,100)\n```\n`x = 1.0e+016 * 4.1449 - 0.7033i\
  \ -7.1997 + 1.2216i 3.2729 - 0.5553i -0.4360 + 0.0740i`\n`f = 3, r = 0415, i = 18`\n\
  \n### 共轭梯度法\n\n| `x = pcg(A,b)` | `pcg(A,b,tol)` | `pcg(A,b,tol,maxit)` | `pcg(A,b,tol,maxit,M)`\
  \ | `pcg(A,b,tol,maxit,M1,M2)` | `pcg(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = pcg(A,b,...)`\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n以下是 MATLAB 用于通过共轭法求解方程的命令。\n\n\
  | `x = pcg(A,b)` | `pcg(A,b,tol)` | `pcg(A,b,tol,maxit)` | `pcg(A,b,tol,maxit,M)`\
  \ | `pcg(A,b,tol,maxit,M1,M2)` | `pcg(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = pcg(A,b,...)`\
  \ |\n`[x,f,relres] = pcg(A,b,...)`, `[x,f,relres,iter] = pcg(A,b,...)`\n\n使用预条件共轭梯度法求解方程\
  \ `Ax=b`。\n指定容差求解 `Ax=b`\n指定容差和最大迭代次数求解 `Ax=b`\n求解方程 `inv(M)*A*x = inv(M)*b`\n使用\
  \ `M=M1*M2` 求解方程 `inv(M)*A*x = inv(M)*b`\n使用 `M=M1*M2` 和初始值 `x0` 求解方程 `inv(M)*A*x\
  \ = inv(M)*b`\n求解方程，`f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞，4=极值数值）。它还返回相对残差 `norm(b-A*x)/norm(b)`。同时返回迭代次数。\n\
  \n```matlab\nA=[pi 2*pi 3*pi -pi; 1 0 -1 2; exp(1) exp(2) exp(3) exp(4); i 2i 3i\
