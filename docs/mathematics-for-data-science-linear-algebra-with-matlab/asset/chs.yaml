  \ `ans = 8` |\n| `pow2(x)` | 以 2 为底的幂 >> `pow2(log2(8))` `ans = 8` |\n| `sqrt(x)`\
  \ | 平根函数 >> `sqrt(2⁸)` `ans = 16` |\n\n### 1.6.4 数值变量特定函数\n\nMATLAB 包含了一组数值变量特定函数，其目的是获取近似运算结果、舍入、处理符号等。这些函数包括：\n\
  \n| 函数 | 含义 |\n| --- | --- |\n| `abs(x)` | 实数 x 的绝对值 >> `abs(-8)` `ans = 8` |\n\
  | `floor(x)` | 小于或等于实数 x 的最大整数 >> `floor(-23.557)` `ans = -24` |\n\n\n\n\n\n[content]\n\
  \n| `ceil(x)` | 大于或等于实数 x 的最小整数 | `ceil(-23.557)` `ans = -23` |\n| `round(x)` |\
  \ 接近实数 x 的最近整数 | `round(-23.557)` `ans = -24` |\n| `fix(x)` | 去除实数 x 的小数部分 | `fix(-23.557)`\
  \ `ans = -23` |\n| `rem(a,b)` | 得实数 `a` 除以 `b` 的余数 | `rem(7,3)` `ans = 1` |\n| `sign(x)`\
  \ | 实数 `x` 的符号（如果 `x>0` 为 1，如果 `x<0` 为 -1） | `sign(-23.557)` `ans = -1` |\n| ![image](img/chapter_title_corner_decoration_left.png)\
