  \ 19.5999, i = 11`\n\n\n\n\n\n# 4.5 对称和非负最小二乘\n\n以下是 MATLAB 提供的通过对称最小二乘和非负最小二乘法求解方程和系统的命令。我们已经学习了一般的方程和系统。在该领域，可以使用我们目前看到的命令，但\
  \ MATLAB 为这些问题专门提供了特定的命令。\n\n### gmres\n\n| `x = gmres(A,b)` | `gmres(A,b,tol)`\
  \ | `gmres(A,b,tol,maxit)` | `gmres(A,b,tol,maxit,M)` | `gmres(A,b,tol,maxit,M1,M2)`\
  \ | `gmres(A,b,tol,maxit,M1,M2,x0)` | `[x,f] = gmres(A,b,...)` |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| | | | | | | ![image](img/scene_break.png)\
  \ |\n| `[x,f,relres] = gmres(A,b,...)` | `[x,f,relres,iter] = gmres(A,b,...)` |\
  \ | | | | |\n| 尝试通过广义最小残留法求解系统 `Ax=b`。 | 指定容差求解 `Ax=b` | 指定容差和最大迭代次数求解 `Ax=b` |\
  \ 求解系统 `inv(M)*A*x = inv(M)*b` | 使用 `M=M1*M2` 求解系统 `inv(M)*A*x = inv(M)*b` | 使用\
  \ `M=M1*M2` 且初值 `x0` 求解系统 `inv(M)*A*x = inv(M)*b` | 求解系统且 `f` 表示结果（0=收敛，1=不收敛，2=条件收敛，3=停滞和\
  \ 4=极极端数值）。它还返回相对残差范 `norm(b-A*x)/norm(b)`。同时也返回迭代次数。 |\n\n```matlab\n>> A=[pi 2*pi\
  \ 3*pi-pi; 1 0 -1 2; exp(1) exp(2) exp(4); i 2i 3i -i];\n>> B=[1 2 3 4]';\n>> [x,f,r,i]=gmres(A,B)\n\
