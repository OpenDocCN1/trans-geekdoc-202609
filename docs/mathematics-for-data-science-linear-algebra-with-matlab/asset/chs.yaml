  \ |\n\n![image](img/chapter_title_above.png)\n\n### 1.9.2 逻辑运算符\n\n![image](img/chapter_title_below.png)\n\
  \nMATLAB 还使用最常用的符号包含了常用的逻辑运算符。通常情况下，逻辑运算符的结果为真为 1，为假为 0。下表显示了这些运算符。\n\n| `~A` |\
  \ `||` | 逻辑取非 (NOT) 或 `A` 的补集 >> `not(2>3)` ans = 1 |\n| --- | --- | --- |\n| `A\
  \ & B` | `||` | 逻辑与 (AND) 或 `A` 和 `B` 的交集 >> `(2>3) & (5>1)` ans = 0 |\n| `A | B`\
  \ | `||` | 逻辑或 (OR) 或 `A` 和 `B` 的并集 >> `(2>3)||(5>1)` ans = 1 |\n| `xor(A,B)` |\
  \ `||` | 异或 (XOR) 或 `A` 和 `B` 的对称差（当 `A` 或 `B` 为 1 但不同不同均为为 1 时，值为 1） >> `xor((2>3),(5>1))`\
  \ ans = 1 |\n| ![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 1.9.3 关系运算符\n\
  \n![image](img/chapter_title_below.png)\n\nMATLAB 还处理关系运算，该运算在两个数组之间执行逐元素比较，并返回相同大小的数组，如果相应的关系为真，则元素为\
  \ 0；如果为假，则为 1。关系运算符还允许标量与向量或矩阵进行比较，在这种情况下，标量将与矩阵的所有元素进行比较。下表显示了 MATLAB 关系运算符。\n\n\
  | `<` | 小于（仅影响实部） >> `3<5` ans = 1 |\n| --- | --- |\n| `<=` | 小于等于（仅影响实部） >> `4<=6`\
  \ ans = 0 |\n| `>` | 大于（仅影响实部） >> `X=3*ones(3,3)` `X = 3 3 3 3 3 3` >> `X>[1 2 3;\
  \ 4 5 6; 2 3]` ans = 1 1 0 0 0 0 |\n| `>=` | 大于等于（仅影响实部） >> `X>=[1 2 3; 4 5 6; 2\
  \ 3]` ans = 1 1 1 0 0 1 |\n| `==` | 等于（涉及复数） >> `X==ones(3,3)` ans = 0 0 0 0 0 0\
  \ |\n| `~=` | 不等于（涉及复数） >> `X~=ones(3,3)` ans = 1 1 1 |\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 1.10 符号变量\n\n![image](img/chapter_title_below.png)\n\
  \n直到目前，我们一直处理数值计算。然而，MATLAB 允许处理符号表达式，方便地处理公式并进行符号运算。为了执行这些任务，需要将变量声明为符号。\n\n| `sym`\
