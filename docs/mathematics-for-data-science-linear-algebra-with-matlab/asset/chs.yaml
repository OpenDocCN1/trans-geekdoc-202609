  \n![image](img/chapter_title_below.png)\n\n下面是 MATLAB 包含的指数和对数函数表，并带有示例说明。\n\n|\
  \ 函数 | 含义 |\n| --- | --- |\n| `exp(x)` | 以 e 为底的指数函数 >> `exp(log(7))` `ans = 7`\
  \ |\n| `log(x)` | 以 e 为底的对数函数 >> `log(exp(7))` `ans = 7` |\n| `log10(x)` | 以 10\
