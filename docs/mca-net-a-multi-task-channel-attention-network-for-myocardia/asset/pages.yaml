    # 5.4. Experimental results on the PTB dataset


    Unlike the intra-patient schemes which are often used in previous studies, the
    inter-patient schemes are of greater clinical significance to prove the model
    generalization.

    Therefore, we perform 5-fold cross validation experiments on the PTB dataset under
    an inter-patient scheme to verify the effectiveness and generalizability of our
    approach, the mean sensitivity, specificity, and accuracy of our model are shown
    in Table 5 where the optimal solution is highlighted. We can see that MCA-net
    achieves the best performance for all tasks. In the detection task, the sensitivity,
    specificity, and accuracy of MCA-net are improved compared with other comparative
    methods, reaching 98.01%, 89.01%, and 95.57%, respectively, while the improvement
    in specificity is extremely obvious. The classification performance of MCA-net
    is also improved in the Location-5 task, achieving 55.35%, 67.96%, and 68.90%,
    respectively. For the Location-7 task, the MCA-net is achieving 41.80%, 49.01%,
    and 49.18%, with an improvement of more than 6% on accuracy.


    We can also observe that MFB-CBRNN performs slightly worse in all tasks compared
    to the other methods. And ML-ResNet achieves good classification accuracy on both
    detection and location tasks. And ML-Net performs a little better than ML-ResNet
    on both the Detection and Location-5 tasks, but slightly worse on the Location-7
    task. This indicates that they lack adaptability to different tasks. In contrast,
    our method has not only superior performance but also high generalizability. This
    is mainly because we use multiple convolutional layers with different convolutional
    kernel sizes and SE module to learn important features at different granularities.
    On the other hand, it also benefits from the multi-task framework which can effectively
    share underlying parameters and complementary information between different tasks.


    In addition to the mean result of the evaluation metrics, we also calculate their
    ranges of variance to compare the stability between methods. As can be seen in
    Table 5, the range of variance fluctuation of our method is smaller than that
    of the comparison method for most of the evaluation indicators, which proves that
    our method ensures reliable stability while maintaining superior performance.
    Moreover, a T-test at a 0.05 significance level was used to analyze whether the
    MCA-net was significantly better than other comparative methods for each evaluation
    metric. As can be seen, our method has some performance advantages on the Detection
    and Location-7 tasks, especially in terms of sensitivity. However, in the Location-5
    task, which may be influenced by the label imbalance and distribution, a higher
    demand is placed on the model''s ability to differentiate.


    # 5.5. Experimental results on the PTBXL dataset


    Different from the PTB dataset, the PTBXL dataset involves a larger number and
    wider range of patients, and each patient can provide one to more ECG records,
    allowing for richer sample information and longer ECG sequences. In addition,
    the PTBXL dataset is closer to the actual clinical situation than the PTB dataset
    because its ECG records usually contain multiple labels. We extract HC and MI
    records from the PTBXL dataset for MI detection and location experiments to validate
    the performance of the MCA-net. Longer duration ECG records are used as input
    units to validate the effectiveness of the MCA-net in learning long time series
    features. To more closely resemble the real-world data distribution, the PTBXL
    dataset is divided by its publisher into ten folds of the inter-patient paradigm
    [41] which represents that there is no overlap of patient origin for ECG records
    in all folds. Therefore, we perform 10-fold cross validation based on these sets
    to obtain more reliable results. As shown in Table 6, our method still outperforms
    other comparative methods, achieving a sensitivity of 88.59%, specificity of 96.55%,
    and accuracy of 93.65% on the detection task. Meanwhile, MCA-net also performs
    better than other methods on the Location-5 and Location-7 tasks, achieving 84.03%
    and 81.47% accuracy as well as 78.76% and 74.05% AUROC, respectively. This demonstrates
    the effectiveness and generalizability of our method across the different datasets.


    We also can see that in contrast to the results on the PTB dataset, ML-Net performs
    the worst on the PTBXL dataset. The possible reason is that the length of data
    provided by the PTBXL dataset is much longer (typically more than several thousand
    sampling points), while the lightweight framework adopted by ML-Net cannot effectively
    learn long-term dependencies from such long ECG sequences. And MFB-CBRNN performs
    relatively well on both datasets, which demonstrates the stability of the convolutional
    layer. In addition, the average performance of ML-ResNet performs better than
    the other two comparison methods, which proves the effectiveness of the residual
    module. Our approach not only combines the stability of the convolutional layer
    with the effectiveness of the residual module but is also better able to learn
    the long-term dependence of ECG sequences thus achieving better performance.


    Again, the reliable stability of the MCA-net is further verified by the range
    of variance fluctuations of the experimental results. In addition to this, we
    still use the T-test to verify the significance of MCA-net on the PTBXL dataset.
    As can be seen in Table 6, MCA-net achieves significant improvements in most tasks
    relative to the comparison method, especially the Location-5 and Location-7 tasks.


    # 6. Discussion


    In this paper, we design a multi-task channel attention network named MCA-net
    for MI detection and location tasks. Our approach shows an improvement in its
    overall performance compared to other methods. To further evaluate the effectiveness
    of the various components within the MCA-net, we first discuss the gains brought
    by the multi-task framework to the MCA-net. Then, ablation experiments are performed
    for the main modules of the channel attention network inside the MCA-net. Finally,
    a further analysis was carried out.'
