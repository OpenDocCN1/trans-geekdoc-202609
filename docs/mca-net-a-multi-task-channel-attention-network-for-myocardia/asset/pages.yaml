    # 6.3. Further analysis


    +   * **Time and Resource**: To demonstrate that our method is relatively economical
    in terms of time and resources compared to other methods. We first count the average
    time overhead for each method to complete one epoch and one fold for each task.
    For the MCA-net multi-task model, each task would complete at the same time. For
    the comparison methods, we execute three tasks in parallel and choose the training
    time of the last finished one as the benchmark for comparison. Then, we further
    compare the resource overheads of the models by considering the sum of trainable
    params required for each task. From Tables 8 and 9, we can see that MFB-CBRNN
    requires the least trainable params, but has a relatively long training time,
    especially the time overhead of one fold on the PTB dataset. In contrast, ML-Net
    has a relatively low time overhead on both datasets but requires far more trainable
    params than the other methods. Both ML-ResNet and our method, in relative terms,
    balance the time and resource overheads better, but our method achieves better
    classification performance on each task than ML-ResNet. In the future, we will
    further optimize our model to reduce the overhead of the model while ensuring
