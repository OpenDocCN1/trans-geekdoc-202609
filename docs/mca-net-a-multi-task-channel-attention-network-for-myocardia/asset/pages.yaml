  md: 'However, the traditional manual analysis of ECG is extremely time-consuming
    and laborious and needs the professional knowledge and experience of doctors.
    Therefore, researchers have explored and developed many automatic MI diagnosis
    algorithms to reduce the burden on cardiologists.


    Early automatic MI diagnosis algorithms focused on the MI detection task that
    classified MI and HC (Healthy Control) populations. Researchers typically use
    biosignal processing methods combined with classic machine learning methods. These
    methods usually required many tedious manual data processing steps before classification,
    such as denoising, normalization, feature extraction, and selection. Commonly
    used methods include WT, frequency domain analysis (FDA) [27], hidden markov model
    (HMM) [28] and SVM, etc.


    For example, to perform automatic detection of MI based on ECGs, Sun et al. [29]
    proposed a multi-instance learning (MIL) approach named latent topic MIL. This
    method used the unlabeled heartbeats in the training set to create a topic space
    and mapped the ECGs to this space. Then, the ECG-level topic vectors are fed into
    the SVM for the final classification. Nidhyananthan et al. [30] presented a wavelet-based
    method to detect MI and user identity. This model first used Daubechies wavelet
    transform to decompose the multi-layer ECG signals and then employed an SVM classifier
    to classify the normal and abnormal cases in the signals. Benameur et al. [31]
    based on three parametric imaging techniques for cardiac MRI to quantify areas
    of infarct-related systolic impairment to detect MI. The parametric images generated
    from the monogenic signal achieved the best performance. Pereira et al. [32] designed
    a method combined with wavelet decomposition and eigenspace analysis to detect
    MI. The wavelet decomposition is used to extract waveforms of different frequencies
    in the ECGs and separate them. The eigenspace analysis provided the eigenvalues
    calculated from covariance matrices. Therefore, these training features can help
    to classify HC and MI patients. Liu et al. [33] used the tunable Q-factor wavelet
    transform (TQWT) to design a novel ECG signal processing method to extract high-quality
    ECGs and perform MI detection. In this proposed method, the authors decomposed
    the 12-lead ECG signal into high and low Q-factor components, and then manually
    extracted a large number of features, which were finally fed into KNN to obtain
    better performance. Wah et al. [34] used SVM and KNN as classifiers to classify
    cardiac conditions in ECG signals based on extracting relevant waveforms or features
    from the ECG signal and analyzing certain specific regions of the peaks and their
    temporal frequencies. Fatimah et al. [13] developed two models to automatically
    detect MI called primary and modified methods based on single-lead ECGs, respectively.
    The primary algorithm applied the Fourier decomposition method (FDM) on the heartbeats
    obtained after the segmentation operation based on R-peaks and used a modified
    algorithm to calculate its efficiency. Features obtained by these two methods
    were fed into a variety of conventional machine learning classifiers and achieved
    the best performance in KNN. Han et al. [16] proposed a new method to detect MI
    by fusing energy entropy and morphological features based on 12-lead ECGs. In
    detail, the ECGs were first decomposed and then calculated the decomposed coefficients
    to get the energy entropy, finally fused with local morphological features as
    global features for more accurate classification. Sahu et al. [35] designed a
    novel MI detection and location method using variational mode decomposition (VMD)
    and regularized neighborhood component analysis (RNCA). It constructed a feature
    set from statistical and non-linear features computed by the intrinsic mode function
    of the VMD and ranked using RNCA, then fed into a KNN and AdaBoost classifier
    for classification. Unfortunately, these traditional methods based on feature
    engineering rely excessively on professional medical experience and require a
    long feature extraction process and a rigorous feature selection process. As a
    result, they are susceptible to limitations in terms of convenience and stability
    and are difficult to meet clinical standards.


    However, as deep learning methods have shown great advantages in the fields of
    computer vision, biosignal analysis, and machine translation, their powerful automatic
    feature extraction ability has been


    demonstrated. Therefore, more and more deep learning-based methods for automatic
    MI detection have been proposed. For instance, Liu et al. [36] developed a novel
    algorithm based on a multi-lead CNN (ML-CNN) for MI detection via four-lead ECGs.
    In this method, the lead asymmetric pooling (LAP) layers and sub-two-dimensional
    (2-D) convolutional layers were applied to learn multi-scale feature representations
    of different leads which performed 96.00% accuracy. Li et al. [37] proposed an
    automatic MI detection model to synthesize single-lead ECGs with high morphological
    similarity by generative adversarial networks (GANs). It automatically detected
    MI using CNNs for both the original ECG and the synthetic ECG from GANs and achieved
    99.06% accuracy. Moreover, Liu et al. [23] presented a multiple-feature-branch
    convolutional bidirectional recurrent neural network (MFB-CBRNN) to effectively
    perform MI automatic detection based on the 12-lead ECGs which consisted of 12
    multi-feature branches. Specifically, MFB-CBRNN utilized multiple stacked multi-scale
    convolutional layers combined with pooling operations to fully extract the features
    within the ECG leads. Then, it used bidirectional LSTM to fuse features from each
    multi-feature branch and achieved 99.54% and 86.29% accuracy under inter-patient
    and intra-patient paradigms, respectively.


    And as automatic MI detection methods continue to improve, researchers are gradually
    shifting their research focus to the more challenging and clinically valuable
    task of MI location. For example, Liu et al. [38] proposed a new multiple-feature
    branch CNN (MFB-CNN) to automatically detect and locate MI based on 12-lead ECGs
    which learned features of leads by corresponding feature branches. Thus, this
    model obtained 98.79% and 94.82% mean accuracies on MI detection and location
    tasks, respectively. Cao et al. [39] proposed a multi-scale deep learning model
    based on a combination of residual network and attention mechanism for 12-lead
    ECG recordings. It mainly used the SENet model and the Grad-CAM algorithm to calculate
    the weights of each lead and detected and located MI based on the weighted features,
    and both achieved over 99% accuracy. Han et al. [22] designed a multi-lead residual
    neural network (ML-ResNet) for MI detection and location tasks using 12-lead ECG
    records. It extracted local features from different leads to construct the global
    feature representation and achieved 95.49% and 55.74% accuracy under the inter-patient
    paradigm on MI detection and location tasks, respectively. Cao et al. [24] proposed
    a novel multichannel lightweight model (ML-Net) to provide algorithmic support
    for automatic MI detection and location on portable devices. In detail, ML-Net
    utilized a multi-lead framework enabling features within each lead to be learned
    independently, thus preserving the unique features of different angles represented
    by different leads, and finally performed 96.00% and 66.85% classification accuracy
    in MI detection and location tasks, respectively. However, most methods are designed
    for specific tasks and are difficult to extend to other downstream tasks, limiting
    their use in clinical practice. In contrast, methods that consider both MI detection
    and location tasks usually treat MI detection and location as two separate tasks.
    They do not consider the correlation between the tasks and do not enable effective
    information sharing and complementarity between the tasks during training, which
    may limit their overall performance.


    To tackle the limitations of existing methods, we design a multitask channel attention
    network named MCA-net. In our model, we use a channel attention network to learn
    and fuse the features of each lead and employ a multi-task framework to efficiently
    combine shared and complementary information between MI detection and location
    tasks. Experiments show that MCA-net can automatically perform MI detection and
    location tasks and has a high application value.


    # 3. Data description and preprocessing


    The ECG data used in this paper are from the PTB [40] and PTBXL datasets [41],
    respectively.'
