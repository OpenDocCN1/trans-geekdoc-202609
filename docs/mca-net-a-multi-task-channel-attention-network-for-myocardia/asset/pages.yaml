    ECG features such as ST-segment elevation and Q-wave abnormalities [7,8] by wavelet
    transform (WT) [9], principal component analysis (PCA) [10], or empirical mode
    decomposition (EMD) [11], etc. Then, traditional machine learning methods such
    as K-nearest neighbors (KNN) [12,13], random forests (RF) [14], or support vector
    machines (SVM) [15,16] are used for classification. However, the feature selection
    process of these methods often relies on human intervention and requires extensive
    medical expertise and experience. On top of that, the classification performance
    of these conventional MI detection and location methods can be greatly reduced
    if the morphological characteristics of the selected ECG waveforms are not accurate
    enough. Therefore, to solve the above problems, a more stable method for end-to-end
    MI automatic detection and location is needed.


    As deep learning methods achieve remarkable results in many fields, they also
    show their advantages in CVD classification based on ECG signals [17,18], such
    as Convolutional Neural Network (CNN) and Long Short-Term Memory (LSTM). They
    are not only able to perform feature extraction and classification process simultaneously,
    but also usually achieved higher accuracy compared to traditional methods. Therefore,
    researchers have proposed many methods based on deep learning methods to detect
    and locate MI which achieved promising results. For example, Strodthoff et al.
    [19] proposed an MI detection and interpretation algorithm based on a full CNN
    using eight-lead ECGs, which extracted features directly from the raw ECG data
    and achieved 93.3% sensitivity and 89.7% specificity. Acharya et al. [20] proposed
    a novel approach that used a CNN with eleven layers to automatically detect MI
    using single-lead ECGs. This approach needed no manual feature extraction or selection
    so that even in the presence of noise it can also make accurate detection of MI.
    As a result, it obtained 93.53% and 95.22% accuracy in the presence and absence
    of noise, respectively. He et al. [21] developed a novel 12-lead ECG-based deep
    active semi-supervised learning framework for MI location which was named multibranch
    densely connected convolutional network (MB-DenseNet). It first employed active
    learning (AL) to improve the classification performance of the initial model and
    then designed a new semi-supervised learning method named self-training with spatial
    matching (STSM) to update the model. MB-DenseNet obtained 99.87% and 96.09% accuracy
    under the intra-patient and patient-specific scheme, respectively.


    The above-mentioned methods have brought some impressive improvements in the automatic
    detection and location of MI. However, there are still many challenges that need
    to be solved. First, MI episodes in different heart locations usually cause abnormal
    ECG waveforms in different combinations of leads. For example, we can see from
    Fig. 1 that AMI may cause ST-segment elevation in leads V3 and V4, whereas ALMI
    may cause ST-segment elevation in different leads (II, III, and AVF). Therefore,
    incomplete lead information may lead to a lack of


    location features, thus affecting the accuracy of identification. Unlike most
    existing methods that use only single-lead or partial-lead ECGs, we fully used
    12-lead ECGs to introduce more data information to enhance the performance of
    our method. Second, although some studies have also considered 12-lead ECGs, they
    tend to treat the MI detection and location tasks as two independent tasks and
    did not consider the correlation between them [22–25], which may severely limit
    the performance and improvement space of the existing methods.


    Therefore, to address the above problems, we propose a multi-task channel attention
    network (MCA-net) for MI detection and location tasks. The contributions of this
    paper can be summarized as the following points:


    +   1. We propose a novel channel attention network for feature learning from
    12-lead ECGs, which employs multiple independent channels network to extract features
    from individual leads. In each channel network, the features are efficiently extracted
    and integrated with different stages using the squeeze-and-excitation (SE) [26]
    attention mechanism and skip connections.

    +   2. According to the relevance of MI detection and location tasks, we introduce
    a multi-task framework in MCA-net. This multi-task framework can improve the performance
    and generality of MCA-net by exploiting the shared and complementary information
    among the tasks in a joint optimization loss manner. Therefore, MCA-net can be
    easily extended to different tasks.

    +   3. In the experimental part, we use two public datasets to fully validate
    the performance and generalizability of MCA-net. We use the multi-fold cross validation
    strategy for a more rigorous evaluation of the model performance. We also conduct
    many ablation experiments to compare and analyze the impacts of the multi-task
    framework and the role of each module in the channel attention network. The experimental
    results indicate that MCA-net is superior both in performance and generality compared
    to other studies.


    The rest of this paper is organized as follows: The related works about MI detection
    and location methods are discussed in Section 2. Section 3 describes the dataset
    and preprocessing methods we used. The details of our proposed method are described
    in Section 4. In Section 5, we present the details of experimental implementation
    and discuss the results. In Section 6, ablation experiments and further analysis
    of our model are presented. Finally, we conclude our work in Section 7.


    # 2. Related works


    Because of its easy accessibility and noninvasive nature, ECG is often used as
    a critical means for clinical MI detection and location.'
