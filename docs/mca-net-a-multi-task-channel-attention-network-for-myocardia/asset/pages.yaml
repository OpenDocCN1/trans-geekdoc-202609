  md: '# MCA-net: A multi-task channel attention network for Myocardial infarction
    detection and location using 12-lead ECGs


    Weibai Pan a,b,1, Ying An c,1, Yuxia Guan a,b, Jianxin Wang a,b,*


    a School of Computer Science and Engineering, Central South University, Changsha,
    410083, China b Hunan Provincial Key Lab on Bioinformatics, Central South University,
    Changsha, 410083, China c School of Big Data Institute, Central South University,
    Changsha Hunan, China


    # ARTICLE INFO


    +   Keywords:

    +   - Electrocardiogram

    +   - Deep neural network

    +   - Multi-task learning

    +   - Myocardial infarction


    # ABSTRACT


    Problem: Myocardial infarction (MI) is a classic cardiovascular disease (CVD)
    that requires prompt diagnosis. However, due to the complexity of its pathology,
    it is difficult for cardiologists to make an accurate diagnosis in a short period.
    Aim: In the clinical, MI can be detected and located by the morphological changes
    on a 12-lead electrocardiogram (ECG). Therefore, we need to develop an automatic,
    high-performance, and easily scalable algorithm for MI detection and location
    using 12-lead ECGs to effectively reduce the burden on cardiologists. Methods:
    This paper proposes a multi-task channel attention network (MCA-net) for MI detection
    and location using 12-lead ECGs. It employs a channel attention network based
    on a residual structure to efficiently capture and integrate features from different
    leads. On top of this, a multi-task framework is used to additionally introduce
    the shared and complementary information between MI detection and location tasks
    to further enhance the model performance. Results: Our model is evaluated on two
    datasets (The PTB and PTBXL datasets). It achieved more than 90% accuracy for
    MI detection task on both datasets. For MI location tasks, we achieved 68.90%
    and 49.18% accuracy on the PTB dataset, respectively. And on the PTBXL dataset,
    we achieved more than 80% accuracy. Conclusion: Numerous comparison experiments
    demonstrate that MCA-net outperforms the state-of-the-art methods and has a better
    generalization. Therefore, it can effectively assist cardiologists to detect and
    locate MI and has important implications for the early diagnosis of MI and patient
    prognosis.


    # 1. Introduction


    Cardiovascular disease (CVD) is a global health problem, and its occurrence in
    developing countries is continuing to rise. Myocardial infarction (MI) is a typical
    CVD, which is caused by coronary artery obstruction, and these obstructions result
    in a severe decrease in blood flow to the heart muscle [1]. Since MI is difficult
    to detect and occurs rapidly, it has also been described as a silent heart attack.
    According to statistics from the American Heart Association (AHA), each year,
    approximately 605,000 people have an episode of MI, and 200,000 MI patients have
    a relapse [2]. Moreover, the locations of MI are numerous and proximate to each
    other, involving different criminal vessels and varying degrees of criticality,
    which can seriously affect the patient’s prognosis. As shown in Fig. 1, they can
    be broadly classified as anterior MI (AMI), anteroseptal MI (ASMI), anterolateral
    MI (ALMI), inferior MI (IMI), inferolateral MI (ILMI), and others [3]. Therefore,
    early detection


    and location of MI are essential for prolonging the life expectancy of patients
    and improving the life quality of patients.


    Continuous acquisition and recording of dynamic changes in the subject’s ECG waveform
    can often provide critical information to the physician making the diagnosis of
    MI in the clinical [4,5]. Therefore, ECG is a necessary tool for the diagnosis
    of MI and should be obtained and interpreted promptly after the first medical
    contact. However, due to the complex and diverse ECG manifestations of MI, using
    12-lead ECGs to detect and locate MI are extremely time-consuming and laborious
    for cardiologists, and even prone to misdiagnosis. Therefore, automatic ECG-based
    diagnosis of MI has become a research hotspot in the field of medical artificial
    intelligence.


    The traditional methods for MI detection and location usually include three steps:
    feature extraction, feature selection, and classification [6]. Early feature extraction
    methods usually extracted relevant


