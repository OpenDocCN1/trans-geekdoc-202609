    ### 4.1.1. 二维卷积层


    首先，每个导联的原始一维信号被转换为二维矩阵（如表 3 中第 I 部分所示），并输入到二维卷积层进行特征提取。二维卷积层可描述为：


    ```

    $$x_j^l = f \left( \sum_{i \in M_j} x_i^{l-1} * w_{ij}^l + b_j^l \right)$$

    ```


    其中 \(x_i^{l-1}\) 是 \((l-1)\) 层中第 \(j\) 个卷积核的输出，用于输入到 \(l\) 层。它在 \(M_j\) 的感受野下，与该层的偏置系数
    \(w_{ij}^l\) 和相应的偏置 \(b_j^l\) 进行运算。其中 * 指二维卷积操作。然后，将修正线性单元 (ReLU) 应用为激活函数 \(f(\cdot)\)
    以输出 \(x_j^l\)。随后，使用批量归一化层和 LeakyReLU 激活函数来缓解梯度消失问题并加速收敛。


    ### 4.1.2. 二维残差块层


    二维卷积层之后，我们将学习到的特征输入到二维残差块层。如图 3 和表 4 所示，该二维残差块层主要由三个具有不同卷积核大小的二维卷积层组成。在这三个堆叠的二维卷积层之后，我们使用
    SE 模块来处理和融合学习到的特征图，以获得更高效的特征表示。然后，我们将 SE 模块和跳跃连接（包含一个二维卷积层）中的特征相结合，以避免重要信息的丢失。最后，将特征输入到
    LeakyReLU 层。


    ### 4.1.3. 一维残差块层


    为了进一步学习每个通道中更精细的特征，我们设计了一个一维残差块层，该层在二维残差块层之后包含三个堆叠的一维残差块。在此之前，从二维残差块层提取的特征表示被重塑为一维张量。一维残差块层的结构与图
    3 中的二维残差块类似。不同之处在于，二维残差块中的二维卷积层被一维卷积层取代，并且在 LeakyReLU 激活函数之后添加了一个额外的平均池化层，以降低特征的维度并提供更好的泛化能力。一维平均池化的操作如下：


    ```

    $$x_j^r(k) = Avg_{a \in A} \left[ x_j^{l-1}(k \times s + a) \right]$$

    ```


    其中，特征表示 \(x_j^r(k)\) 使用 \(k\) 作为采样点索引。\(s\) 表示池化操作的步长，在本文中全部设置为 1。\(R\) 表示整个池化区域，被分为
    \(r\) 个部分。最后，我们使用 \(Avg (\bullet)\) 获取池化窗口的平均值。


    ### 4.1.4. 全局平均池化层


    在执行多导联特征融合之前，我们使用全局平均池化层来降低特征维度，并为每个通道提供更具体的内部表示。


    ### 4.1.5. 特征融合层


    最后，我们将每个通道学习到的特征拼接，并将其输入到 dropout 层，然后使用 flatten 层获取特征表示。随后将该特征表示输入到不同的全连接层，以获得
    MI 检测和定位任务的相应分类结果。


