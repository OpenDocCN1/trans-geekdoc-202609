    involved in each fold is limited. In contrast, the results are relatively stable
    across folds on the PTBXL dataset. This demonstrates the good adaptability and
    stability of the MCA-net.


    - **Limitations**: Although our method demonstrates some advantages for each task,
    it still has some limitations. Firstly, the model suffers from under-learning
    on some of the labels due to data imbalance, leading to a performance bottleneck
    in the model. For example, as shown in Fig. 8 (Since the PTBXL dataset is a multi-label
    dataset, we only give the confusion matrix for each task on the PTB dataset),
    the classification accuracy of ALMI was significantly lower than that of the other
    labels in MI location task. Secondly, on the MI location task, we can find that
    ALMI and AMI as well as IMI and ILMI are easily confused. This may be because
    the proximity of infarct locations usually leads to similar ECG waveform abnormalities,
    thus making it more difficult for our model to distinguish them which indicates
    that our method needs further improvement in its ability to identify the location
    of adjacent infarcts.


    ![](img/f388c2b45effa8060f11503a8d7012e8_10_0.png)

    ![](img/f388c2b45effa8060f11503a8d7012e8_10_1.png)

    ![](img/f388c2b45effa8060f11503a8d7012e8_10_2.png)


    Fig. 8. Confusion matrices of MI detection and location tasks on the PTB dataset.


    ## 7. Conclusion


    In clinical practice, cardiologists can make a preliminary diagnosis of MI by
    analyzing abnormal ECG signals, but it is very difficult to give a rapid and accurate
    diagnosis. Therefore, providing an automatic computer-aided method can effectively
    reduce the burden on healthcare professionals while providing reliable support
    for the prognostic assessment of patients.


    In this paper, we design a multi-task channel attention network named MCA-net.
    It uses multiple independent channels to more comprehensively extract valid features
    from each lead. Each channel includes multiple stacked convolutional layers which
    contain SE modules to better assign feature weights. We also add a multi-task
    framework to additionally take into account the shared and complementary information
    between the MI detection and location tasks to further improve the MCA-net performance.
    The experimental results show that our model has state-of-the-art performance.


    Although our method demonstrates some advantages for each task, it still has some
    limitations. Firstly, the model suffers from under-learning on some of the labels
    due to data imbalance. Secondly, MCA-net is prone to confusion when differentiating
    the relevant labels. To address the above issues, in the future, we will consider
    collecting more clinical data while further improving our MCA-net with the help
    of data augmentation such as contrastive learning. Moreover, considering the multi-view
    nature of the 12-lead ECGs, more effective lead fusion methods can be considered
    from a multi-view fusion perspective to obtain a richer feature representation.


