    Specifically, the multi-task framework shares parameters and feature representations
    among the three tasks in the channel attention network, which is represented as
    a function **C**. While _n_=1_,_2_,_3 for each task, respectively. Then we get
    each task output _y^n_ after passing through the corresponding fully connected
    layer _F^n_.


    The losses of these tasks in the multi-task framework are combined in the form
