    # 3.1. The PTB dataset


    The PTB dataset is commonly used to train and evaluate different MI detection
    and location methods. It contains 549 12-lead ECG records, of which 368 ECG records
    from 52 HC patients and 148 MI patients are used in this paper. All ECG data in
    this dataset are available online. Each ECG record consists of 12 standard leads
    (as shown in Fig. 1) and 3 Frank leads (VX, VY, and VZ), sampled at 1000 Hz. Moreover,
    these ECG records are all annotated by cardiologists, a subject may provide more
    than one ECG record, but each ECG record has only one label. Most of these ECG
    records last approximately 2 min and at least 30 s. The statistics of the used
    12-lead ECGs on the PTB dataset are shown in Table 1.


    # 3.2. The PTBXL dataset


    The PTBXL dataset is a large publicly available ECG dataset that is newly published
    in April 2020 [41] which has 18,885 subjects and provides approximately 21,837
    ECG records. Among them, there are 5486 MI records and 9528 HC records. Similar
    to the PTB dataset, there are 12 standard leads in each record, and two sampling
    frequency versions of 100 Hz and 200 Hz are available. Each record lasts 10 s.
    Each subject in this dataset provides one to multiple annotated ECG records, and
    most records contain multiple annotations. The statistics for the 12-lead ECGs
    used in the PTBXL dataset are shown in Table 2.


    # 4. Method


    As illustrated in Fig. 2, the overall structure of the MCA-net is composed of
    a channel attention network based on a multi-task framework. In detail, we input
    the 12-lead ECGs to a channel attention network with 12 channels, each channel
    is assigned to a lead. For each lead of the ECG signal, we first format the data
    into a 2-D matrix by adding an extra dimension. The 2-D matrix is then fed into
    a 2-D convolutional layer to capture important information in the early stages
    of feature extraction. Then, to extract multi-scale features, we employ 2-D residual
    blocks with different kernel sizes. Immediately afterward, we reshape the features
    into 1-D features before feeding them into three 1-D residual blocks to further
    extract finer-grained features. After the three 1-D residual blocks, a global
    average pooling layer is used to extract key features and improve generalization.
    Finally, we concatenate the features from different channels, use dropout to avoid
    overfitting, and input the flattened global features into three fully connected
    layers. All the convolutions we use in MCA-net are the Same Convolution which
    is one of the Standard Convolutions (both 1-D and 2-D). The details of each part
    are shown in Table 3 and described below.


