    Multi-task frameworks have been shown to play a gainful role in similar tasks
    by learning shared and complementary information between multiple tasks to optimize
    the performance of all tasks [42–44]. And we use the most classical multi-task
    framework, a shared-bottom model [42]. This model achieves improved classification
    performance by sharing the bottom representation across multiple tasks and performing
    loss optimization within multiple tasks. Thus, MCA-net based on this multi-task
    framework can more effectively combine MI detection and location tasks. The framework
    can be expressed by :


    ```

    y^n = F^n(\boldsymbol{C}(\boldsymbol{x}))

    ```


    In this paper, we design three related tasks: (1) a two-category MI detection
    task (Detection), which aims to identify whether people are MI or HC; (2) a five-category
    MI location task (Location-5), whose goal is to distinguish AMI, ASMI, ALMI, other
    and HC populations; (3) a seven-category MI location task (Location-7), whose
    objective is to distinguish AMI, ASMI, ALMI, IMI, ILMI, other and HC populations.
