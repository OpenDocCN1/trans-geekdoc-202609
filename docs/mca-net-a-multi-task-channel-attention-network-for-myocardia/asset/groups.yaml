    # ## 5. Experiments and results


    In this section, we fully evaluate MCA-net on the PTB and PTBXL datasets and compare
    it with state-of-the-art methods for automatic MI detection and location. In addition,
    we perform a significance test of the results of our experiments to show the improvements
    in our approach.


    # ### 5.1. Comparison methods


    For a comprehensive assessment, we conduct comparative experiments on our method
    and other three state-of-the-art MI classification methods, i.e., MFB-CBRNN [23],
    ML-ResNet [22], and ML-Net [24] on both the PTB and PTBXL datasets.


    +   * **MFB-CBRNN**: MFB-CBRNN used a multi-lead framework for MI detection based
    on the 12-lead ECGs. To fully utilize the ECG waveform information contained in
    all 12 leads. 12 multiple-feature-branch was employed to extract features within
    each lead which was mainly composed of convolutional layers. For effective feature
    fusion, MFB-CBRNN also used a bidirectional LSTM to integrate all the features
    output from each lead branch.


    +   * **ML-ResNet**: ML-ResNet also employed a multi-lead framework for MI detection
    and location, but it used a residual-based network structure in designing multi-feature
    branches. Each multi-feature branch mainly consisted of three stacked residual
    blocks, each of which included three convolutional layers and a skip connection.
    Thus, ML-ResNet can be layered to learn feature representations within the leads
    and perform feature fusion.


    +   * **ML-Net**: ML-Net also had a novel channel branch structure based on a
    multi-lead framework. The branch structure is designed as three parallel convolutional
    networks which used setting different convolutional kernel sizes to integrate
    multi-scale features within the leads. However, unlike the above two approaches,
    ML-Net only used four leads ECG data to accommodate the lightweight needs of portable
    devices.


    Unlike these methods, our approach combines 2-D and 1-D residual blocks for extracting
    early significant features and finer-grained features. And we also used the SE
    module and skip connections in the MCA-net for feature weighting and to prevent
    loss of valid information. Finally, by introducing a multi-task framework, the
    inter-task correlation and complementarity are fully exploited to extend the MCA-net
    to individual tasks and improve the overall classification performance. Because
    MFB-CBRNN, ML-ResNet, and ML-Net are all originally designed for different MI
    classification tasks, using different amounts of data and different means of data
    processing. We extend them to our task by unifying the data inputs and modifying
    their corresponding classification layers for a fair comparison.


    # ### 5.2. Implementation details


    All methods involved in this paper were developed based on Keras and the TensorFlow
    framework [45] which are trained and tested using python 3.6. The relevant experiments
    were performed on a server with an Intel(R) Xeon(R) Gold 6230 CPU @ 2.10 GHz and
    251 GB memory. We set the initial learning rate of the model to 0.001 and optimized
    it during the training process using the callback function ReduceLROnPlateau.
    The number of epochs and batch sizes were set to 100 and 64, respectively. Moreover,
    we also deploy the Adam and early stop strategies to speed up the learning process
    and prevent overfitting.


    # ### 5.3. Evaluation metrics


    In this work, the model performances on the PTB dataset are evaluated by three
    metrics, namely, sensitivity (Sen), specificity (Spe), and accuracy (Acc). The
    Sen, also called recall, represents the percentage of positive samples correctly
    predicted by the model over the overall positive samples. Conversely, Spe represents
    the percentage of negative samples correctly predicted by the model over the overall
    negative samples. While, the accuracy rate (Acc) is the percentage of all correctly
    identified samples over the total samples. These three evaluation metrics can
    be calculated by the following equation:


    ```

    Sen = \frac{TP}{TP + FN}

    ```


    ```

    Spe = \frac{TN}{TN + FP}

    ```


    ```

    Acc = \frac{TP + TN}{TP + TN + FP + FN}

    ```


    Where TP (True Positive) and TN (True Negative) refer to the number of samples
    where both the true categories and the predicted categories are positive or negative.
    While FP (False Positive) and FN (False Negative) refer to the number of samples
    where the true categories and the predicted categories are positive and negative,
    or negative and positive, respectively. For the multi-label dataset PTBXL, we
    use the same metrics to evaluate the model performances on the MI detection task.
    But for the MI location task, we select the accuracy and the area under the roc'
