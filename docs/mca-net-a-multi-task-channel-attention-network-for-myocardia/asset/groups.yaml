    ## 4. 方法


    如图 2 所示，MCA-net 的整体结构由基于多任务框架的通道注意力网络组成。具体而言，我们将 12 导联心电图输入到一个具有 12 个通道的通道注意力网络中，每个通道对应一个导联。对于心电图信号的每个导联，我们首先通过增加额外维度将数据格式化为二维矩阵。然后将二维矩阵输入到二维卷积层，以捕获特征提取早期阶段的重要信息。接着，为了提取多尺度特征，我们采用具有不同卷积核大小的二维残差块。紧接着，我们将特征重塑为一维特征，然后输入到三个一维残差块中，以进一步提取更精细的特征。三个一维残差块之后，使用全局平均池化层来提取关键特征并提高泛化能力。最后，我们将不同通道的特征拼接，使用
    dropout 避免过拟合，并将展平的全局特征输入到三个全连接层。MCA-net 中使用的所有卷积均为 Same Convolution，它是标准卷积（一维和二维）的一种。各部分的详细信息如表
    3 所示，并在下文描述。


