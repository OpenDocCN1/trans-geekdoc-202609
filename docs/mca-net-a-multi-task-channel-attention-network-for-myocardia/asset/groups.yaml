  mdcn: "\n\n## MCA-net: 用于12导联心电图的心肌梗死检测与定位的多任务通道注意力网络\n\nWeibai Pan a,b,1, Ying\
    \ An c,1, Yuxia Guan a,b, Jianxin Wang a,b,*\n\na School of Computer Science and\
    \ Engineering, Central South University, Changsha, 410083, China b Hunan Provincial\
    \ Key Lab on Bioinformatics, Central South University, Changsha, 410083, China\
    \ c School of Big Data Institute, Central South University, Changsha Hunan, China\n\
    \n* Corresponding author at: School of Computer Science and Engineering, Central\
    \ South University, Changsha, 410083, China.\nE-mail addresses: pwb0531@csu.edu.cn\
    \ (W. Pan), anying@csu.edu.cn (Y. An), guanyx1997@csu.edu.cn (Y. Guan), jxwang@csu.edu.cn\
    \ (J. Wang).\n1 Both authors contributed equally to this research.\n\n## ARTICLE\
    \ INFO\n\n- Keywords:\n  - 心电图\n  - 深度神经网络\n  - 多任务学习\n  - 心肌梗死\n\n## ABSTRACT\n\
    \n问题：心肌梗死（MI）是一种经典的心血管疾病（CVD），需要及时诊断。然而，由于其病理的复杂性，心脏病专家在短时间内做出准确诊断很困难。\n\n目的：在临床上，MI可以通过12导联心电图（ECG）上的形态学变化进行检测和定位。因此，我们需要开发一种基于12导联心电图的自动、高性能且易于扩展的算法，用于MI检测和定位，以有效减轻心脏病专家的负担。\n\
    \n方法：本文提出了一种用于12导联心电图的MI检测和定位的多任务通道注意力网络（MCA-net）。它采用基于残差结构的通道注意力网络，以高效捕获和整合不同导联的特征。在此基础上，使用多任务框架来额外引入MI检测和定位任务之间的共享和互补信息，以进一步提升模型性能。\n\
    \n结果：我们的模型在两个数据集（PTB和PTBXL数据集）上进行了评估。它在两个数据集上的MI检测任务中均达到了90%以上的准确率。对于MI定位任务，我们在PTB数据集上分别达到了68.90%和49.18%的准确率。在PTBXL数据集上，我们达到了80%以上的准确率。\n\
    \n结论：大量对比实验表明，MCA-net优于最先进的方法，并具有更好的泛化能力。因此，它可以有效协助心脏病专家检测和定位MI，对MI早期诊断和患者预后具有重要意义。\n\
    \n## 1. 引言\n\n心血管疾病（CVD）是全球健康问题，且在发展中国家的发生率持续上升。心肌梗死（MI）是一种典型的CVD，由冠状动脉阻塞引起，这些阻塞会导致心肌血流显著减少\
    \ [1]。由于MI难以检测且发作迅速，它也被称为沉默的心脏病发作。根据美国心脏协会（AHA）的统计数据，每年约有605,000人发作MI，200,000名MI患者复发\
    \ [2]。此外，MI的定位众多且相互邻近，涉及不同的冠状动脉和不同程度的严重性，可能严重影响患者的预后。如图1所示，它们大致可分为前壁MI（AMI）、前间隔MI（ASMI）、前外侧MI（ALMI）、下壁MI（IMI）、下外侧MI（ILMI）及其他\
    \ [3]。因此，早期检测和定位MI对于延长患者预期寿命和改善患者生活质量至关重要。\n\n持续采集和记录受试者心电图波形的动态变化，通常可以为临床医生做出MI诊断提供关键信息\
    \ [4,5]。因此，心电图是MI诊断的必要工具，应在首次医疗接触后及时获取和解读。然而，由于MI的心电图表现复杂多样，使用12导联心电图检测和定位MI对心脏病专家来说极其耗时且费力，甚至容易误诊。因此，基于心电图的自动MI诊断已成为医学人工智能领域的研究热点。\n\
    \n传统的MI检测和定位方法通常包括三个步骤：特征提取、特征选择和分类 [6]。早期的特征提取方法通常通过小波变换（WT）[9]、主成分分析（PCA）[10]或经验模态分解（EMD）[11]等方法提取相关\n\
    ![](img/f388c2b45effa8060f11503a8d7012e8_1_0.png)\n心电图特征，如ST段抬高和Q波异常 [7,8]。然后，使用K近邻（KNN）[12,13]、随机森林（RF）[14]或支持向量机（SVM）[15,16]等传统机器学习方法进行分类。然而，这些方法的特征选择过程通常依赖人工干预，需要广泛的医学专业知识和经验。此外，如果所选心电图波形的形态特征不够准确，这些常规MI检测和定位方法的分类性能会大幅下降。因此，为了解决上述问题，需要一种更稳定的MI端到端自动检测和定位方法。\n\
    \n由于深度学习方法在许多领域取得了显著成果，它们也在基于心电信号的CVD分类中展现出优势 [17,18]，例如卷积神经网络（CNN）和长短期记忆网络（LSTM）。它们不仅能够同时执行特征提取和分类过程，而且通常比传统方法获得更高的准确率。因此，研究人员提出了许多基于深度学习的方法来检测和定位MI，取得了有希望的结果。例如，Strodthoff等人\
    \ [19] 提出了一种基于全卷积网络并使用八导联心电图的MI检测与解释算法，该算法直接从原始心电图数据中提取特征，达到了93.3%的灵敏度和89.7%的特异度。Acharya等人\
    \ [20] 提出了一种新方法，使用11层CNN基于单导联心电图自动检测MI。该方法无需人工特征提取或选择，因此即使在存在噪声的情况下也能对MI进行准确检测。结果，在存在和不存在噪声的情况下，分别获得了93.53%和95.22%的准确率。He等人\
    \ [21] 开发了一种新的基于12导联心电图的深度主动半监督学习框架，用于MI定位，名为多分支密集连接卷积网络（MB-DenseNet）。它首先采用主动学习（AL）来提高初始模型的分类性能，然后设计了一种名为空间匹配自训练（STSM）的新半监督学习方法来更新模型。MB-DenseNet在患者内方案和特定患者方案下分别获得了99.87%和96.09%的准确率。\n\
    \n上述方法在MI自动检测和定位方面带来了一些显著改进。然而，仍有许多挑战需要解决。首先，不同心脏部位的MI发作通常会导致不同导联组合中的异常心电图波形。例如，从图1可以看出，AMI可能导致V3和V4导联出现ST段抬高，而ALMI可能导致不同导联（II、III和AVF）出现ST段抬高。因此，导联信息不完整可能导致定位特征缺失，从而影响识别准确性。与大多数仅使用单导联或部分导联心电图的现有方法不同，我们充分使用了12导联心电图以引入更多数据信息，增强我们方法的性能。其次，虽然一些研究也考虑了12导联心电图，但它们倾向于将MI检测和定位任务视为两个独立任务，未考虑两者之间的相关性\
    \ [22–25]，这可能严重限制现有方法的性能和改进空间。\n\n因此，为了解决上述问题，我们提出了一种用于MI检测和定位任务的多任务通道注意力网络（MCA-net）。本文的贡献可归纳如下：\n\
    \n- 1. 我们提出了一种新的通道注意力网络，用于从12导联心电图中进行特征学习，该网络采用多个独立通道网络从单个导联中提取特征。在每个通道网络中，利用挤压-激励（SE）[26]注意力机制和跳跃连接，在不同阶段高效提取和整合特征。\n\
    - 2. 根据MI检测和定位任务的相关性，我们在MCA-net中引入多任务框架。该多任务框架通过联合优化损失方式利用任务之间的共享和互补信息，提高MCA-net的性能和通用性。因此，MCA-net可以轻松扩展到不同任务。\n\
    - 3. 在实验部分，我们使用两个公共数据集来充分验证MCA-net的性能和泛化能力。我们采用多折交叉验证策略对模型性能进行更严格的评估。我们还进行了许多消融实验，以比较和分析多任务框架的影响以及通道注意力网络中各模块的作用。实验结果表明，与其他研究相比，MCA-net在性能和通用性方面均表现出色。\n\
    \n本文其余部分组织如下：第2节讨论了关于MI检测和定位方法的相关工作。第3节描述了我们使用的数据集和预处理方法。第4节详细介绍了我们提出的方法。在第5节，我们介绍了实验实施的细节并讨论了结果。在第6节，介绍了我们模型的消融实验和进一步分析。最后，在第7节总结了我们的工作。\n\
    \n## 2. 相关工作\n\n由于其易于获取和无创的特性，心电图常被用作临床MI检测和定位的关键手段。\n\n"
