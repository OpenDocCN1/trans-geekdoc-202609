    # 3.3. Preprocessing


    For each record in the PTB dataset, we first resample it to 500 Hz. Then, we split
    the resampled record into some fixed-length heartbeats, heartbeats smaller than
    that length are discarded. There is no overlap between each heartbeat. Since the
    duration of a complete ECG waveform is about 0.6 s, to ensure that each heartbeat
    contains at least one complete ECG waveform, the fixed length of each heartbeat
    is set to 1.2 s (600 sampling points) in this paper. As shown in Table 1, we end
    up with a total of 40,144 heartbeats.


    For the PTBXL dataset, we directly select the 500 Hz sampling frequency version
    to maintain uniformity with the PTB dataset. Considering that each record in the
    PTBXL dataset may contain more than one annotation, we do not segment it to ensure
    the integrity of the multi-label information.


    Based on the above preprocessing, we obtain a single-labeled dataset with heartbeats
    as the basic unit and a multi-labeled dataset with ECG records as the basic unit,
    respectively, to fully validate the effectiveness of our method.


