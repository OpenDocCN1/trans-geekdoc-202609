    # 6.3. Further analysis


    +   * **Time and Resource**: To demonstrate that our method is relatively economical
    in terms of time and resources compared to other methods. We first count the average
    time overhead for each method to complete one epoch and one fold for each task.
    For the MCA-net multi-task model, each task would complete at the same time. For
    the comparison methods, we execute three tasks in parallel and choose the training
    time of the last finished one as the benchmark for comparison. Then, we further
    compare the resource overheads of the models by considering the sum of trainable
    params required for each task. From Tables 8 and 9, we can see that MFB-CBRNN
    requires the least trainable params, but has a relatively long training time,
    especially the time overhead of one fold on the PTB dataset. In contrast, ML-Net
    has a relatively low time overhead on both datasets but requires far more trainable
    params than the other methods. Both ML-ResNet and our method, in relative terms,
    balance the time and resource overheads better, but our method achieves better
    classification performance on each task than ML-ResNet. In the future, we will
    further optimize our model to reduce the overhead of the model while ensuring
    high classification accuracy.


    +   * **Convergence**: We perform a convergence analysis of the MCA-net based
    on the learning curve on the PTB and PTBXL datasets. Due to space constraints,
    we only randomly give part of the learning curve of the PTBXL dataset, as shown
    in Fig. 5. It shows the


    +   * **Qualitative results**: We use 5-fold and 10-fold cross validation on the
    PTB and PTBXL datasets to obtain more reliable results, respectively. In this
    case, each fold is used in turn as the test set and the remaining data as the
    training set. Therefore, for further qualitative analysis of the experimental
    results, we detail the performance results and the corresponding number of records
    and patients for each fold, as shown in Figs. 6 and 7. We can see that MCA-net
    achieves good overall performance on the MI detection task, with an accuracy of
    over 95% in most folds. On the PTB dataset, there is some variation in the results
    across folds, which may be influenced by patient specificity, as the number of
    patients involved in each fold is limited. In contrast, the results are relatively
    stable across folds on the PTBXL dataset. This demonstrates the good adaptability
    and stability of the MCA-net.


    +   * **Limitations**: Although our method demonstrates some advantages for each
    task, it still has some limitations. Firstly, the model suffers from under-learning
    on some of the labels due to data imbalance, leading to a performance bottleneck
    in the model. For example, as shown in Fig. 8 (Since the PTBXL dataset is a multi-label
    dataset, we only give the confusion matrix for each task on the PTB dataset),
    the classification accuracy of ALMI was significantly lower than that of the other
    labels in MI location task. Secondly, on the MI location task, we can find that
    ALMI and AMI as well as IMI and ILMI are easily confused. This may be because
    the proximity of infarct locations usually leads to similar ECG waveform abnormalities,
    thus making it more difficult for our model to distinguish them which indicates
    that our method needs further improvement in its ability to identify the location
    of adjacent infarcts.'
