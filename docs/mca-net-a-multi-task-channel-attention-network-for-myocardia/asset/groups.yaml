    ## 6.1. The benefits of the multi-task framework


    To validate the impact of the multi-task framework in MCA-net, we design a single-task
    model and two dual-task models to perform the same experiments as our model on
    the PTB and PTBXL datasets. The results of the ablation experiments can be seen
    in Table 7. Here, Cnet refers to the single-task model, MCA-net<sub>5</sub> refers
    to the dual-task model for the Detection and Location-5 tasks, MCA-net<sub>7</sub>
    refers to the dual-task model for Detection and Location-7 tasks.


    We can find that the single-task model Cnet performs well on different fine-grained
    tasks based on Table 7, especially the MI detection task. Meanwhile, we can also
    find that the results of the experiments are continuously optimized as the number
    of tasks increases and the granularity of the tasks refines. In particular, our
    model achieves the best results, not only on different datasets but also on different
    tasks. On the PTB dataset, the improvement rates for MI detection and location
    tasks are 1.05%, 2.45%, and 2.77%, respectively. On the PTBXL dataset, we improve
    the AUROC by 0.08%, 1.77%, and 0.62% respectively, while maintaining the high
    accuracy. This proves that the multi-task learning framework we adopt can effectively
    capture common information and task-specific features related to different tasks,
    and enhance the final feature representation through information complementation
    between tasks. We can also observe that increasing the number of tasks enables
    more aggregation of features learned from different tasks and enhances the final
    learned representations. And the increased number of classification categories
    leads the model to learn more accurate features, which affects the final decision.


    By the way, combine with Tables 5 and 6, we can also observe that the single-task
    model Cnet still has higher classification accuracy than all the comparison methods,
    which further demonstrates that the channel attention network structure can capture
    the relevant features in the 12-lead ECGs more effectively.


    ## 6.2. The benefits of the channel attention network


    In this subsection, to further understand the impacts of each module on the final
    classification performance, we remove the different modules of the channel attention
    network and conduct experiments in the same configuration, respectively. We compare
    the classification accuracy between our model MCA-net and MCA-net variants, i.e.,
    MCA-net without the 2-D residual block, MCA-net without the 1-D residual blocks,
    and MCA-net without the SE modules. The ablation experimental results on the PTB
    and PTBXL datasets are shown in Fig. 4.


    - **No 2-D Residual Block**: We can see from Fig. 4 that the model without the
    2-D residual block exhibits a decrease in accuracy compared to MCA-net. This demonstrates
    that the 2-D residual block can help the model learn the morphological features
    of the ECG waveforms inside the leads in the early feature extraction stage of
    the model. In addition, we can see that the 2-D residual block has a better impact
    on model performance in the PTB dataset, which suggests that the 2-D residual
    block may be more effective in extracting short ECG sequences.


    - **No 1-D Residual Blocks**: And we can also see that the model without the stacked
    1-D residual blocks also shows a degradation in performance. However, the impact
    of the 1-D residual block on the model shows noticeable differences across the
    datasets. As shown in Fig. 4a, the 1-D residual block brings less than 2% improvement
    in accuracy per task on the PTB dataset, while on the PTBXL dataset (shown in
    Fig. 4b), it is more effective than the other modules, with gains of 3.77%, 5.36%,
    and 7.18%, respectively. This proves that the stacked 1-D residual blocks can
    more effectively enhance the model''s ability to capture fine-grained features
    from long ECG sequences, and are more suitable for processing relatively complex
    learning tasks.


    - **No SE**: To explore the benefits brought by the SE modules, we remove the
    SE modules from the 2-D residual block and the 1-D residual blocks and then conduct
    experiments. We can see from Fig. 4 that the classification performance of MCA-net
    decreases after removing the SE modules. This is particularly evident on the PTB
    dataset, where the accuracy drops on the three classification tasks reach 2.83%,
    4.62%, and 6.63%, respectively. This shows that the SE modules can strengthen
    the important features and weaken the non-important features on the ECG classification
    task, thus achieving the purpose of improving classification performance.


