    ### 6.3. 进一步分析


    - **时间和资源**：为了证明与其他方法相比，我们的方法在时间和资源方面相对经济。我们首先统计每种方法完成每个任务一个 epoch 和一个 fold 所需的平均时间开销。对于
    MCA-net 多任务模型，每个任务将同时完成。对于对比方法，我们并行执行三个任务，并选择最后完成任务的训练时间作为比较基准。然后，我们通过考虑每个任务所需的可训练参数总和，进一步比较模型的资源开销。从表
    8 和表 9 可以看出，MFB-CBRNN 所需的可训练参数最少，但训练时间相对较长，尤其是在 PTB 数据集上一个 fold 的时间开销。相比之下，ML-Net
    在两个数据集上的时间开销相对较低，但所需的可训练参数远多于其他方法。相对而言，ML-ResNet 和我们的方法在时间和资源开销之间取得了更好的平衡，但我们的方法在每个任务上的分类性能优于
    ML-ResNet。未来，我们将在确保高分类准确率的同时，进一步优化模型以减少模型开销。


    - **收敛性**：我们基于 PTB 和 PTBXL 数据集上的学习曲线对 MCA-net 进行了收敛性分析。由于篇幅限制，我们仅随机给出了 PTBXL 数据集部分学习曲线，如图
    5 所示。它显示了


    - **定性结果**：我们分别在 PTB 和 PTBXL 数据集上使用 5 折和 10 折交叉验证，以获得更可靠的结果。在此情况下，每个 fold 依次用作测试集，其余数据用作训练集。因此，为了对实验结果进行进一步的定性分析，我们详细列出了每个
    fold 的性能结果以及相应的记录数和患者数，如图 6 和图 7 所示。可以看到，MCA-net 在 MI 检测任务上取得了良好的整体性能，大多数 fold
    的准确率超过 95%。在 PTB 数据集上，不同 fold 之间的结果存在一定差异，这可能受患者特异性的影响，因为每个 fold 中涉及的患者数量有限。相比之下，PTBXL
    数据集上不同 fold 之间的结果相对稳定。这表明 MCA-net 具有良好的适应性和稳定性。


    - **局限性**：虽然我们的方法在每个任务上都显示出一些优势，但仍存在一些局限性。首先，由于数据不平衡，模型在某些标签上存在欠学习问题，导致模型性能出现瓶颈。例如，如图
    8 所示（由于 PTBXL 数据集是多标签数据集，我们仅给出了 PTB 数据集上每个任务的混淆矩阵），在 MI 位置任务中，ALMI 的分类准确率明显低于其他标签。其次，在
    MI 位置任务中，我们发现 ALMI 与 AMI 以及 IMI 与 ILMI 容易混淆。这可能是因为梗死位置的邻近性通常会导致类似的心电图波形异常，从而使我们的模型更难以区分它们，这表明我们的方法在识别相邻梗死位置的能力上仍需进一步改进。


