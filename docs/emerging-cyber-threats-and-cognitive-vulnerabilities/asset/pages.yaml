  md: '# Central concepts


    # Situational awareness


    According to Endsley (1988), a general definition of situational awareness (SA)
    is ''the perception of the elements in the environment within a volume of time
    and space, the comprehension of their meaning and the projection of their status
    in the near future''. From a technical viewpoint, SA comes down to compiling,
    processing and fusing data, as such data processing includes the need to assess
    data fragments as well as fused information and provide a rational estimate of
    information quality (Franke & Brynielsson, 2014). The cognitive side of SA concerns
    the human capacity of being able to comprehend the technical implications and
    draw conclusions in order to come up with informed decisions (Franke & Brynielsson,
    2014). According to Endsley (1988,2015) humans are not as good at processing large
    volumes of data, quickly and consistently, nor of sustaining attention for long
    periods of time. The level of autonomy increases as the capability of the system
    increases for performing various components of any given function. Flexible autonomy
    should provide smooth, simple, seamless transitions between functions between
    a human and the system (Endsley, 2015).


    # Cyber situational awareness


    According to Franke & Brynielsson (2014), cyber SA is a subset of SA, that cyber
    SA is the part of SA that concerns the ''cyber'' environment. Such SA can be reached,
    for example, by the use of data from IT sensors (intrusion detection systems,
    etc.) that can be fed to a data fusion process or be interpreted directly by the
    decision-maker. SA is a prerequisite for CPS is to be resilient. According to
    Franke and Brynielsson (2014), cyber SA cannot be treated in isolation, but it
    is intertwined with a part of the overall SA. Cyber SA concerns awareness regarding
    cyber issues but these need to be combined with other information to obtain full
    understanding regarding the current situation.


    # Public protection and disaster relief functions


    The term PPDR or public safety organization implies those groups that are responsible
    for the prevention of and protection from events that could endanger the safety
    of the general public (Baldini, 2010). According to Baldini (2010), the main public
    safety functions include law enforcement, emergency medical services, border security,
    protection of the'
