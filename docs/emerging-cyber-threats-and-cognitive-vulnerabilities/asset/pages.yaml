  md: '# Composition of an attack


    Grant, Venter, and Eloff (2007) identified nine stages of an attack. They are
    Footprinting, Reconnaissance, Vulnerability Identification, Penetration, Control,
    Embedding, Data extraction, Attack relay and Attack dissemination. Brummel (2010)
    classified the high-level stages as Footprinting, Reconnaissance, Enumeration
    and System Hacking. van Herden, Irwin, and Burke (2012) proposed the stages of
    an attack as Target Identification, Reconnaissance, Attack Phase, Ramp-up, Residue
    and Post-attack reconnaissance. To simplify the most relevant phases will be expanded
    upon to show their application in a cyberterrorism scenario.


    +   * Target Identification — selection of the target and in this case motivated
    by religious, political or ideological standpoint. A specific device or entity
    (company, organization, state or governmental institution) is chosen as the target.
    For example, a terrorist organization could identify what to infiltrate a critical
    service like the water sanitation system.

    * Reconnaissance — information gathering and footprinting the target in order
    to identify potential weaknesses and how the system can be attacked. This would
    typically entail the terrorist organization gathering information about the water
    sanitation system and identifying a backdoor through which it will plant the exploit.
    Technical elements will be investigated in order to develop and ascertain how
    an exploit can be launched.

    * Vulnerability Exploitation — the actual penetration of the system and execution
    of attack. A terrorist group may say posing as an employee and plant a virus into
    the systems. Once the device has been deployed onto the systems the cyberattack
    will be executed. This may result in the water being tainted and contaminated
    being distributed to the public. The perpetrators may want to create media coverage
    about their attack and claim responsibility. The attack may cause sickness and
    even death in the affected area due to the interference of the water checks.


    The description of the attack composition indicates how a terrorist organization
    may go about pinpointing and executing a cyberattack with the goal of advancing
    their underlying objectives. A fundamental aspect of the attack is the creation
    of fear. Terrorist organizations operate on the basis of driving fear into the
    minds of the public. In the next section, the principle of fear generation by
    terrorists is discussed.'
  merge: -1
  img_proc: true
