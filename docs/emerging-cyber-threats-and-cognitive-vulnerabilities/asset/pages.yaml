    can similarly used to support police investigations. He further explains the use
    of ''text mining'' to create investigative opportunities from these data.


    Text mining is described as information extraction in linguistic processing, semantic
    models are defined according to the user requirements, allowing the user to extract
    the principal topics that are of interest to them. For example, the extraction
    of organization names, people''s names, email addresses, phone details and bank
    accounts can be done using text mining techniques from social media which lends
    itself to the use of text mining for the gathering of evidence (Zander, Nguyen,
    & Armitage, 2005).


    Furthermore, Tokunaga (2015) argues that social networking sites can be used as
    a tool for interpersonal surveillance not by the police by using the social networking
    sites to gain an awareness of their partners, friends and business associates
