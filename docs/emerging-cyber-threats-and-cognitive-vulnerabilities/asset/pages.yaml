    # Management of situational awareness in Finland


    The Ministry of Finance of Finland is responsible for the steering and development
    of the state''s information security (Ministry of Defence, 2010). The Government
    Situation Centre ensures that the state leaders and central government authorities
    are informed continuously in Finland. The Government Situation Centre was set
    up in 2007, and it has the duty to alert the government, permanent secretaries
    and heads of preparedness and to call them councils, meetings and negotiations
    at exceptional times required by a disruption or a crisis. The ministries have
    the duty to submit the situational picture for their entire administrative branch
    to the Government Situation Centre and notify the centre of any security incidents
    in their field of activity. In urgent situations, the Government Situation Centre
    also receives reports of security incidents directly from the authorities. In
    addition, the Government Situation Centre follows public sources and receives
    SA information in its role as the national focal point for certain institutions
    of the EU and other international organizations.


