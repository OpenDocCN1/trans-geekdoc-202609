    # Cyber-physical systems


    The term cyber-physical systems (CPS) was coined by Helen Gill at the National
    Science Foundation in the United States to refer to the integration of computation
    with physical processes. In CPS, embedded computers and networks may monitor and
    control the physical processes with feedback loops whereas physical processes
    affect computations and vice versa. CPS are enabling the next generation of ‘smart
    systems’ like robotics, computer-controlled processes and real-time integrated
    systems (Lee & Seshia, 2017).


    Modern infrastructures include not only physical components but also hardware
    and software. These integrated systems are examples of CPS that integrate computing
    and communication capabilities with monitoring and control of entities in the
    physical world. Fig. 10.3 presents a CPS that consists of two physical layers
    (platform layer and human layer) and a cyber layer between them. The current trend
    is expanding.


    Many CPS applications are safety-critical which means that their failure can cause
    irreparable harm to the physical system under control and the people who depend
    on it. In particular, the protection of CIs that'
