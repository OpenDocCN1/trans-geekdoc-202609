- pgno: 81
  md: '# Russian segment of the Internet


    inside and outside necessitated the control of information space

    (Doktrina, 2000). Later, the strategy for development of information society (2008)
    connected information security to the military security and declared that the
    formation of ‘unified information space’ would help to solve issues of national
    security (Strategia, 2008). When the Russian state again regained control of the
    RuNet after the 2012–13 demonstrations against President Putin (Svoboda internet,
    2017), the idea of a secure-controlled national segment of Internet was already
    formulated (Programma, 2014).


    This idea is now being put into reality. If the current programs and plans of
    the Russian government materialize, the technological or material side of RuNet
    will become a vertically and horizontally integrated information space (Doktrina
    2000, 2006; Napravleneie, 2018; Programma 2014, 2017; Strategia, 2015, 2017).
    In this vision, the Russian state can control the substance of Internet through
    censorship laws. Its security services are able to conduct targeted and mass surveillance.
    The infrastructure of Russian Internet will be based on Russian hardware, software
    and cryptographic solutions. The state will win through state companies major
    parts of the infrastructure of the Russian Internet and control through laws the
    private sector operating critical information infrastructure. Moreover, the security
    services are able to monitor public and strategic industrial networks through
    national SIEM (Security Incident and Event Management) systems. Ultimately, the
    national segment of Internet can be disconnected from the global Internet by state-controlled
    routing and addressing protocols (Kukkola, 2018c). This system of systems of security
    reflects sociocultural understanding of security and extinguishes the freedom
    and anarchy that were present in the early phases of RuNet’s development.


    Arguably, in a world of claimed unknown and unpredictable information (cyber)
    this state of the ‘national segment of Internet’ provides security. If private
    citizens and corporations are unable to protect themselves or the information
    as a whole, the state has to intervene. This intervention is based on the sociocultural
    understanding of security. The material basis of RuNet changed through the national
    segment of Internet to something that belongs to the state and is protected from
    outside threats by technological means. It forms the material component of ‘the
    unified information space’ and produces a feeling of security that is particularly
    Russian. This is not to say that there is no resistance. There is always conflict
    in dialectics and synthesis is not about one ‘winning all.’ What is produced as
    the material component of ‘the unified information space’ is always situational
    and contextual – something evolving and undetermined.'
