  md: '# Cyber personalities as a target audience


    suggest that as air war could not be appropriately described by the concepts of
    land or naval warfare, conducting operations in the digital age requires fresh
    approaches and concepts. Our approach is an attempt to enable the emerging digital
    powers of the cyber domain to be utilized in a more effective way. Given the possibilities
    of Artificial Intelligence and deep fake technologies, however, we can only assume
    even what we examine in this chapter will fall short of the future realities of
    influence activities.


    # Cyber personalities as a target audience


    # Five-layer model


    When conducting TAA in cyber domain, we need to know what to look for and where
    to look for it. Whether a TAA is based on a traditional model, as presented in
    US field manual (FM3-005, 1), on a more detailed model proposed by Taylor et al.
    (2014), or on a cyber-specific one, such as proposed by Suler (2016) (which will
    be discussed later) or one thing remains: the sources of information. As mentioned
    earlier, cyber domain is vast, boundless and constantly changing. Therefore, we
    need a cyber domain-specific framework for data collection and utilization. Libicki’s
    (2007) five-layer model as presented in Sartenon et al. (2016) provides a useful
    framework for data collection and utilization.


    One important feature of the five-layer model is that communication between humans
    in the cyber domain will typically pass through all the layers, meaning that communication
    leaves residue to be collected and analyzed in all layers and provides means of
    influence. It has to be pointed out that in addition to easily acknowledge means,
    such as sending direct influence messages, there are multiple, subtle ways of
    altering one’s interpretation of his or her surroundings. As an example, instead
    of trying to alter the content in all the relevant web pages a user typically
    visits, an alternative way could be to gain access to user’s browser to change
    the search engine’s parameters, distorting results and thus affecting the interpretation
    of user’s reality.


    # Cyber personalities


    To understand cyber personalities and their possible use as a TA, we need to understand
    how individuals present themselves in cyberspace as psychological entities. As
    Suler (2016) points out, cyberspace is a psychological space; ‘It is an extension
    of our individual and collective minds. It is a space “out there” where the minds
    of self and other converge’ (Suler, 2016). To'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 182

    9. Cyber personalities in adaptive target audiences


    conceptual this space and its psychological aspects, Suler has proposed

    eight dimensions of cyber psychology. These dimensions are (1) Identity;

    (2) Social; (3) Interactive; (4) Text; (5) Sensory; (6) Reality; (7) Temporal

    (8) Physical dimension. Identity dimension includes self-presentation

    in particular online environment, whereas Social dimension includes the

    relationships with individuals and groups. Interactive dimension entails

    how well a person can understand, navigate and control a digital envi-

    ron (human–computer interaction). Text dimension includes all

    text-based communication and the psychological effects of communi-

    cating text. Sensory dimension ensures that the cyberspace activates

    senses (mainly auditory and visual). Temporal dimension is the use and

    time of time. Reality dimension ensures how much of the experience

    in cyberspace is grounded in everyday life and reality and how much of it

    is mere fantasy (such as presenting oneself via exotic avatar in massive

    multiplayer online role-playing game). Physical dimension involves the

    physical existence, including bodily sensations and movements.


    Through these dimensions, it is possible both to understand and

    anticipate behaviour of individuals in cyberspace, and they can serve as

    a useful framework when we have enough information of or when we

    can interact with these individuals (for instance, ask questions from

    them). The challenge is that conducting TAA in the cyber domain,

    it is not often possible to have close interaction with TAs. There are,

    however, numerous studies on behavioural residue leave

    behind when they operate in the cyber domain. Studies show

    various correlations between data collectable from interactions within

    the cyber domain and behaviour. Such data includes, but is not limited

    to digital pictures, audio and video files, social media posts, social

    media activity (such as liking, linking or commenting), browsing and

    data history and topographic analysis of both physical and

    virtual networks. The idea of a cyber personality in the form we propose

    in this chapter is to combine this data collected from various sources. In

    other words, it is an attempt to conceptualize a theoretical model for

    utilizing data from the five layers of the cyber domain. While

    single sources of data predict behaviour to a certain extent,

    combining the data of multiple sources into a single entity can provide

    a more complete (possibly conflicting) picture and therefore

    provide information necessary for conducting TAA in cyberspace. A

    cyber personality also helps to overcome the limitation of not being able

    to identify actors, as it encompasses the idea of meaningful (in the

    viewpoint of the military objective) behavioural factors above identi-

    f actors for its own sake.


    A cyber personality can, of course, consist of nonhuman actors (such

    as bots or AI) as well, as their activities leave behavioural residue in

    the wake as well. An additional benefit of the concept of a cyber'
