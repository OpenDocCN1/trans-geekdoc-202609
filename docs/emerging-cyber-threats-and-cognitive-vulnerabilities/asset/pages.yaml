  md: '# 36

    2. Cyberterrorism — the spectre that is the convergence


    and destruction of systems and loss of availability are all effects that cyberterrorism
    would focus their efforts toward. Cyberterrorists want to expose weaknesses in
    the systems of their target in order to create disarray, outage and disruption.
    A virus that opens up popup pop boxes would not be considered cyberterrorism as
    its effect is not as wide-scale as bringing down the water system in a community.
    The threat of a small amount of data does not compare to a full-blown attack that
    cripples the airport announcement system. Cyberterrorism has a far wider range
    of attack and effects than simple nuisance, annoyance or inconvenience.


    A cyberterrorist could create a virus to start infiltrating the network and mask
    itself for a short period and reappear once more to cause more damage to computers
    and networks. Stuxnet operated on this approach whereby small changes were made
    to the centrifuges to degrade over time. A digital weapon, like a virus, is programmed
    to go off at a certain time or if a certain condition is met (Matsuki, 2008).
    This differs with analog weapons which normally only be activated — a gas attack
    or a bomb that can be triggered and will unlikely to be reset or exploded in again.
    Conventional weapons operate in linearity where there is an attack that progresses
    from one stage to another. Cyberterror attacks not necessarily have a linear sequential
    order. This also makes cyberattacks more difficult to detect as they may not have
    a defined start and end point. Cyberattacks may also become viral or propagate
    in a network and cause further damage. Thus, an attack could be targeted at a
    specific victim but eventually reach a wider audience or affect other entities
    and parties.


    Cyberterrorism sees a shift from ‘spatialization’ whereby space and time are challenged.
    There are no restrictive time constraints or spatial limitations for perpetrators.
    Time and space in the cyber world are infinite, invisible and unclear. Building
    terrorists can engage, delve and scour the world for potential exploits without
    consideration of their physical location or boundaries at any time of day or night.
    Targets and weapons are accessible and can be acquired freely through research
    and information gathering in the digital world. In the underworld of the dark
    web, and even the open Internet, various tools are accessible that can be used
    to launch cyberattacks. Cyberterrorism as an attack vector may become more viable
    as the real and virtual worlds become more intertwined.


    A further effect of cyberterrorism is the cascading failures that occur as a result
    of a cyberattack on critical infrastructure. A cascading failure refers to a failure
    in a network or a system of interconnected parts (Matusitz, 2008). Once a vital
    node in a link is taken down, other key nodes can also be affected. The damage
    to a critical node can cause other key nodes to fail. Cyberterrorism has the potential
    to trigger serious'
