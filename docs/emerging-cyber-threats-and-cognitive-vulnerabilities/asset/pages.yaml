    One area to be debated is whether computer hacking for political activism should
    be considered cyberterrorism. Hacktivism and Internet vandalism may not directly
    threaten the lives and livelihoods of victims and may incorrectly be labelled
    as cyberterrorism. The defacement of websites may be considered as a form of digital
    vandalism and initially was carried out to boost the ego of the attacker. Thus,
    the effect of the ''Internet anarchy'' plays an influential role in whether a
    digital attack can be considered as an act of cyberterrorism. Cyberterrorism may
    incorrectly be confused with hacktivism and ECD and thus would be good to consider
    the context of cyberterrorism.


    Davis (2016) differentiates between hacking and hacktivism in the domain of health
    care as follows:


    Hackivists are politically-motivated, targeting institutions with opposing political
    views to their area. They most commonly attack with a Dos method, overloading
    a server until it crashes. When it comes to healthcare, hacktivists are looking
    for specific patient data, intellectual property or they''re trying to embarrass
    the institution.


    Cyberterrorists target systems to disrupt or destroy critical services and infrastructure
    of a specific nation, sector or organization. Attacks on the healthcare sector
    are designed to frame a lesser hacking group to cause turmoil or cause panic.


    Hacktivists may hack to show support for a particular cause or issue and do so
    by interfering with services. Sites may be shut down or corporate information
    is disclosed. Thus, serious damage is not typically carried out. Cyberterrorism
    goes further by targeting critical infrastructure and services, causing wide-scale
    damage and shock.


    Hacktivism includes ECD and can consist of operations like virtual sites and inblocks,
    automated email bombs, web hacks and computer break-ins (Denning, 2001). Moreover,
