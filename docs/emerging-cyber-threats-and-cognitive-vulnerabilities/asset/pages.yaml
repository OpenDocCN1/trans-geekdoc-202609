- pgno: 100
  md: '# WannaCry ransomware attack in 2017


    WannaCry was a computer worm responsible for one of the most devastating cyberattacks
    in recent history. In addition to spreading across computer networks using the
    Windows operating system, WannaCry (also known as WannaCrypt WannaCryptor) encrypted
    files of the computer and only allowed access to those files after a bitcoin payment
    was made. While ransomware itself was not new, WannaCry was particularly successful
    because it targeted a computer vulnerability that many organizations and individuals
    did not install security patches (i.e., software updates) to date.


    Reflecting on the social impact of the attack, WannaCry infected over 200,000
    victims in at least 150 countries (Reuters, 2017). These included members of the
    public, but also healthcare organizations, manufacturers, telecoms, delivery services
    and the education sector. Due to the nature of the attack, the disruption it caused
    at the social level was quite significant. Organizations closed (causing people
    to be sent home), production stopped (resulting in product backlogs), and many
    businesses were unaware of how to restore services. Overall, people felt a loss
    of control (Ajzen, 2002) as the threat was so pervasive and the only option for
    recovery—assuming no backups were made—to pay the ransom. In total, these disruptions
    led to an estimated $8 billion in economic costs (Barly, 2017).


    In the United Kingdom, critical infrastructure such as the National Health Service
    (NHS) was also impacted. A total of 48 NHS trusts were infected in England and
    13 in Scotland (BBC, 2017). This resulted in disruption to people''s lives in
    the context of their health. Specifically, there were cancelled operations, certain
    scans and treatments were postponed and ambulances were diverted. This is a particularly
    worry situation given long patients often have to wait for some treatments. WannaCry
    also prompted government response—in the United Kingdom a Cobra meeting (i.e.,
    an emergency response government committee) was called, and in the United States,
    the homeland security advisor was ordered to coordinate the government''s response
    and help to organize the search for the responsible parties (Sanger, Chan, & Scott,
    2017). This level of response from governments emphasized the threat in the eyes
    of the public.


    An interesting point to note here is the government''s comments on the attack.
    In particular, there was an emphasis on the fact that the attack had not targeted
    the NHS and that it was international. According to The Independent, the UK''s
    Home Secretary stated: “If you look at who''s been impacted by this virus, it''s
    a huge variety across different industries and international governments. ...
    This is a virus that attacked Windows platforms. The fact is the NHS has fallen
    victim to this... I don''t think it''s to with'
  merge: -1
  img_proc: true
