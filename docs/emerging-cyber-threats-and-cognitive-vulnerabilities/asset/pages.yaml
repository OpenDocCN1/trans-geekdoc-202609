  md: '# Cybersecurity 95


    most cases, issues of cybersecurity lead to the disruption of operations, which
    can lead to considerable reputational and financial damage to an organization.
    According to Deibert (2012), an organization can lose clients, business, reputation
    and assets in case of a cyberattack. Additionally, it causes regulatory litigation
    and fines. Cybersecurity can be enhanced through the development of a solid foundation
    where the cybersecurity technology is grown.


    The advancement of technology in today''s evolving world means that people can
    store large volumes of information in cyberspace, which makes it easier for various
    individuals globally to access it. It becomes more comfortable and fast to obtain
    information over the internet than it was decades ago. The sensitivity of data
    stored in the cyberspace requires the implementation of sound cybersecurity strategies
    to avoid unauthorized access to sensitive information relating to finances, government
    data and personal information. The following write-up presents a review of various
    literature materials dealing with the issue of cybersecurity.


    The advancement of security means that every transaction or activity conducted
    on online platform faces several risks from hackers, spyware and malware. According
    to Deibert (2012), organizations have been forced to employ reliable and effective
    cybersecurity strategies to deal with emerging cyber threats including warfare,
    espionage and cybercrime. The risks have led to the transformation of the domain
    into an issue of national security, which has become a critical force that influenced
    global communication today. The threat has also led to policymakers developing
    strategies to deal with the ever-developing range of cyber threats due to the
    advancement of technology with innovations coming with new threats.


    Bada and Sasse (2014) state that the increase in the application of technology
    has led to an increase in cybercrimes while also enhancing cybersecurity. The
    enhancement of cybersecurity is through the data protection methods such as the
    use of one-password protection, detection of malicious attacks and server virtualisation.
    Cybersecurity is a complicated issue that cannot be reduced merely into an approach
    of individual security and network security. It relates to the broader point of
    the economy, nation, society and state. Technology has become part of our everyday
    life, which further emphasizes the needs for cybersecurity. Cybersecurity lies
    in the interlink between the threatened party, the threat itself and the source.
    The aspect of technology in different areas has become critical because of the
    increase in the integration of technology such as finance, banking, entertainment,
    national defence, communications, e-commerce and government departments (Deibert,
    2011). The application of technology has made it possible to increase work efficiency,
    simplify work and solve problems. However, it has also exposed firms to the risk
    of losing their information due to cyber threats. Thus, protection of data becomes
    a critical aspect in the process of integrating technology in an organization.'
