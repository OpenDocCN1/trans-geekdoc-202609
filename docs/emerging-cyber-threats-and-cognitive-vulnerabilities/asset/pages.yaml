    # Conclusion


    The risk of a cyberspace conflict escalating between these three major cyber powers
    is still high. The United States, China and Russia fully understand the cost of
    a potential cyber war, but their strategic and political postures regarding cyberspace
    confrontations differ significantly.


    Each of the three states invests large amounts of resources into maintaining competitive
    cyber capabilities. The United States and China clearly distinguish between offensive
    and defensive cybersecurity capabilities in their strategic demands and practical
    arrangements. This establishes, at least theoretically, grounds for a rational
    calculation of whether to pursue a cooperative strategy or engage in deliberate
    confrontation. Of of the three states, the United States possesses the most powerful
    cyberspace forces, but its extensive cyber infrastructure is also the most vulnerable
    to cyber-attacks. The United States has relied on a deterrence strategy in cyberspace
    and has signaled clearly that it is for negative cooperation and would like to
    forge agreements to avoid offensive attacks.


    The United States'' strategy demonstrates a defensive posture toward its cyber-infrastructure
    and toward the security of China''s information space. Following Obama and Xi''s
    meeting in September 2015, during which the two countries agreed they would not
    knowingly support or conduct cyber crimes targeting trade secrets, analytical
    institutions reported a dramatic drop in the cyber-espionage of 72 suspected cybercrime
    groups in China (Fireye, 2016). This improvement, even if temporary, establishes
    a precedent for bilateral cooperation to restrict offensive actions. From a defensive
    realism perspective, the United States and China''s relations exhibit the necessary
    theoretical components to attain negative cooperation in cyberspace and avoid
    a large-scale conflict.


    However, on the contrary, the United States'' deterrence strategy did not work
    with Russia. Instead, it provoked large-scale and complex intrusions of the United
    States'' cyberspace before the 2016 presidential election. President Obama''s
    refusal to respond with coercive cyber measures against Russia, despite having
    evidence of Russia''s breaches, illustrates the'
