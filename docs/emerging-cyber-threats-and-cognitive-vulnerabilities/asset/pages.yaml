    # Introduction


    The emergence of digital technologies has seen the proliferation of new online
    communications, providing opportunities for increased social interaction in an
    accessible manner. This availability to communicate online is an embedded feature
    of society, particularly predominant'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 1. Factors leading to cyber victimization


    amongst young people (Ofcom, 2016). While the Internet affords many social and
    recreational benefits, it also offers numerous positive implications across a
    variety of industry sectors (Finkelhor, 2014). Despite this, the increased access
    to online communication can increase vulnerability to a variety of online risks
    including harassment, cyberbullying, and other cyber threats on privacy or online
    data (Livingstone, Haddon, Görsiz, & Olafsson, 2011). Although experiences online
    including pornography, contact with strangers, sharing personal information, exchanging
    personal photographs (i.e. sexting) and hacking may not lead to harm, their existence
    could increase the probability of harm. While with these cyber threats can not
    all result in actual harm (Livingstone & Smith, 2014). Livingstone and Smith (2014)
    outlined different categories of online risks, including content, context, and
    conduct risks. Content risks involve the user being recipient of age-inappropriate
    content, for example, young users accessing pornography. Contact risks are where
    the user is the recipient of an initiated online communication from another individual,
    where they intend to bully, groom or manipulate the user. Conduct risks consider
    the digital footprint and the online behaviour of the user as part of a larger
    network of interactions (Livingstone & Smith, 2014; Smith & Livingstone, 2017).
    These threats and result in cyber victimization in the virtual community. ‘Cyber
    victimization’ has been used broadly (Law, Shapka, & Olson, 2010) to define other
    cyberattacks including cyber aggression, cyber bullying and cyber threats, while
    others use ‘online harassment’ to define online attacks (Hinduja & Patchin, 2010).
    This chapter will discuss cyber victimization across perspectives of cyber aggression,
    cyberbullying and cyber threats and crimes.


    Aggression is defined as any behaviour that involves intent to cause harm to the
    targeted individual (Baron & Richardson, 1994). While aggression has predominantly
    been a concern in the offline environment, the development of digital technologies
    has seen the rise of aggressive acts in the virtual community. While there are
    many forms of aggressive acts or threats, cyberbullying is more specifically defined
    through a set of recognized criteria. Cyberbullying is defined as ‘an aggressive
    intentional act carried out by a group or individual, using electronic forms of
    contact, repeatedly and over time against a victim who cannot easily defend him
    or herself’ (Smith et al., 2008, p. 376). Bullying in the offline environment,
    cyberbullying consists of three distinct criteria: which makes the victim feel
    defenseless (Olweus, 1993; Smith et al., 2008; Vandebosch & Van Cleemput, 2008).
    Despite this, definitional issues arise with repetition and power imbalance in
    the online environment. While bullying in the real world can be identified as
    an ongoing incident, with the imbalance of power portrayed through'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction


    physical strength or peer group status, the extent to which this is applicable
    in the virtual world is more ambiguous. For example, a single incident in the
    online setting can be repeated through the number of likes and shares on social
    networks, increasing the audience and consequences for the victim [Slonje, Smith,
    & FriN, 2013; Smith et al., 2008]. In terms of power imbalance, users with increased
    digital literacy and knowledge can cyberattacks through sophisticated mediums,
    with the targeted victim unaware of the attack due to anonymity the online environment
    [Smith et al., 2019]. Findings from a recent review 159 students found the frequency
    of cyberbullying ranged from 1.6% to 56.9%, with reports between 1.9% and 79.3%
    [Brochado, Soares, & Fraga, 2017]. While some cyberbullying should be addressed
    as a standalone issue [Grigg, 2012], others propose the broader term of cyber
    aggression should be used due to difficulty identifying in the online environment
    [Corcoran, Mc Guckin, & Pritence, 2015].


    While cyberbullying is defined under criteria, other acts of online abuse and
    cyber threats can occur, defined under cyber aggression is the intentional harm
    delivered by electronic means to a person or group of people irrespective of their
    age, who perceive(s) such acts as derogatory, harmful or unwanted [Grigg, 2010,
    p. 152]. Cyber aggression involves more aggressive acts in the online environment
    that do not constitute cyberbullying. These cyberattacks can be one-off or repeated
    instances, with the intent to cause harm to the targeted recipient. Cyber aggressive
    acts are those that do not necessarily focus on power imbalance or repetition,
    rather the violent behaviour itself such as harassment, stalking or abuse [Smith,
    2012].


    Forms of cyber victimization arise from sophisticated attacks through cyber threats
    and crimes. Cybercrime is an act of intentional violation using digital technologies
    and communications to manipulate or sabotage stored information and knowledge
    on social networks and systems [Saini, Rao, & Panda, 2012]. While the availability
    of online communications provides connectivity on a larger scale, an established
    feature in society [Hassan, 2008], this connectivity to online communications
    has also seen the emergence of cybercrimes and threats. For example, some cyberimes
    centered in the financial or business sector with users seeking financial profit
    [Leukfeldt, Lavorgna, & Kleemans, 2017]. Social Network Sites (SNS) store a large
    amount of personal information and data, and therefore users expect appropriate
    security safeguards to store and keep these data safe. However, the large amount
    of data stored in these sites are also vulnerable to cyberattacks through users
    with malicious intentions, and therefore it is important leading industry experts
    work to ensure this information is kept safe [Balduzzi et al., 2010]. For example,
    social engineering has emerged as an'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1. Factors leading to cyber victimization


    escalating cyberthreat which attacks virtual communities and systems (Kromholz,
    Hobel, Huber, & Weipp, 2015). This involves a user manipulating a targeted individual,
    group or community to sharing private information or knowledge. This type of cyberthreat
    can create large vulnerabilities across a variety of social networks. The fact
    the attack can be performed with relative ease means these social engineers can
    attack on a larger scale, creating a larger impact for those involved (Kromholz
    et al., 2015).


    Willard (2007) created a typology of cyber aggressive acts and cyberthreats, distinguishing
    across seven recognized forms including flaming; harassment; denigration; outing
    and trickery; impersonation; exclusion and cybersecurity. Others include hacking,
    data privacy and stalking (Hasebrink, Görgüz, Haddon, Kalmus, & Livingstone, 2011).
    These cyberthreats can be perpetrated through emails, mobile phones and the many
    online communications or networks the Internet offers (Rivers & Noret, 2010),
    which can lead to detrimental consequences to the target and/industry. For example,
    these cyberthreats can lead to depression (Olenik-Shemesh, Heiman, & Eden, 2012),
    and in worst cases, victims of online are more likely to experience suicidal thoughts
    compared to users who perpetrate these cyberattacks (Hinduja & Patchin, 2010).
    Implications of these research suggest online companies should work together to
    manage the negative repercussions for those who are victimized.


    The development and accessibility of the Internet has evolved social communication.
    The nature of online communication and networks mean users can post private or
    sensitive information online that can accessible to a wider audience (Kromholz
    et al., 2015). However, young people do show a desire to maintain privacy in the
    online environment, even if there is an expectation to be socially in the online
    community (Betts & Spencer, 2017). This suggests social media companies need to
    implement strategies to make young feel safer online. Online users who perceive
    they have a good awareness of controlling their information and privacy on SNS
    are likely to be victims of cybercrime than those who do not (Saridakis, Benson,
    Eizingarde, & Tennakoon, 2016). This illustrates how digital literacy and knowledge
    of Information and Communication Technologies (ICTs) can influence vulnerability
    to cyber threats and attacks. While some responsibility is down to each user on
    the social network, providers can focus to ensure any information published by
    the user is only visible to the intended audience through security settings.


    The Internet is an evolving space so it is important governing bodies take a greater
    responsibility to put mechanisms and precautions in place to reduce online risks
    and cyberthreats for those who use it. For example,'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Features of cyber victimization 5


    the education sector can encourage young people to use strategies to reduce vulnerability
    to these online risks. This digital awareness and training incorporated into leading
    industry platforms can help those who use the Internet have the appropriate tools
    to stay safe online. Research has outlined several risk factors leading to vulnerability
    for online risks and dangers, for example, individual characteristics, peer relationships,
    time spent online and wider community factors, which will be discussed later in
    the chapter. This chapter will now explore features of cyber victimization and
    the predictive factors that can lead to vulnerability to cyber aggressive attacks,
    cyberbullying and/or cyber threats.


    # Features of cyber victimization


    This section will explore specific features of cyber victimization, which can
    contribute to the vulnerability of cyberbullying, cyber aggression and cybercrimes
    or threats. In particular, topics as efficiency of technology, roles of anonymity
    and bystanders, by a brief consideration of the bully–victim cycle will be discussed.


    # Efficiency of information and communication technologies


    Since the mid-1990s, commercialization of the Internet has led to extraordinary
    global development and growth. ICTs provide platforms for education, businesses,
    finance, social communication and information sharing. Advancement in technology
    is a continuing evolution of efficiency, improvement and invention. The Internet
    has become more accessible via fourth generation (4G) smartphones and the worldwide
    distribution of broadband Internet infrastructure. More users can become connected,
    for infinite amounts of time and as such, larger volumes of data can be transmitted.
    Household Internet access in the United Kingdom has increased from 25% in the
    year 2000 to 90% in 2017 (Prescott, 2017). Global Internet usage has been reported
    to 3.58 billion Internet users, which is approximately 47% of the world’s population
    (Biggs & Lozanova, 2017). Inescapably, this number will continue to increase and
    those who Internet access will eventually become the majority population. As amount
    of users increase and ICT enhances, civil activity can take place in the digital
    world where there allows its existence to thrive.


    Cybercrime can encompass various different sinister activities, all of which will
    utilize the opportunities and efficacy of ICTs. One of the most prominent elements
    to state is the global connection of ICTs, providing no restriction to physical
    locality. Digital offenders can pursue their victims from any position where there
    is connectivity to the Internet. It is'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1. Factors leading to cyber victimization


    important to note the difficulty this aspect presents itself to law enforcement
    and policy makers of different countries. Equally as prominent is the factor of
    time. ICTs and the Internet are constantly active 24/7, and so the constraints
    of time are non-existent and acts are instantaneous. While targeted users use
    simple strategies (i.e. power off on a computer or smartphone), this does not
    stop the asynchronous transmiss of messages and interactions. Together, global
    communication and non-existent time work alongside the amount of information that
    can be received, transmitted and gained using ICT. All perpetrated cyber activity
    exploits the advantages of ICT, increasing traditional crimes such as fraud or
    theft, or creating new crimes which are dependent on ICT, such as hacking or distributing
    viruses.


    The efficiency of ICT can be clearly portrayed within the context of cyberbullying,
    as a victims'' perspective. Acts of cyberbullying can occur both within and outside
    the school environment, illustrating its fluidity to occur at any time (24/7 notion).
    Furthermore, targets of cyberbullying experience abusive online communication
    and humiliation in front of an infinite audience via wide dissemination (Shariff
    & Hoff, 2007). The audience extends beyond close friends and peers, but can be
    aided by wider social groups increasing the popularity of the incident, deemed
    regrettable the impact on the victim. Removal of an online act, even deemed by
    a perpetrator cannot easily be saved or for instance, an original published photo
    online can be shared numerous amounts of time, by users beyond the intended audience.
    These factors are believed to possibly exacerbate the negative impact experienced
    by those who are cyber bullied (Bonanno & Hymel, 2013; Gualdo, Hunter, Durkin,
    Arnaiz, & Maquilon, 2015). Although the efficiency of ICTs can positively extend
    the boundaries of traditional social interaction, it can be easily exploited by
    those with negative intentions.


    # Anonymity


    The digital world provides an opportunity for immunity and freedom to those who
    wish to communicate anonymously on a much greater scale than the physical world
    (Hinduja & Patchin, 2008). Between 9% and 69% of victims of cyber-aggressive attacks
    are targeted by anonymous perpetrators (Kowalski & Limber, 2007; Wright & Li,
    2013; Ybarra & Mitchell, 2004). Technology has provided a way of hiding ''true''
    identity. Mobile phone numbers are freely available and Internet users can create
    multiple email addresses or user accounts, making it difficult to ascertain the
    true identity of another individual. For example, a user could impersonate somebody
    else unknowingly to a targeted individual. In addition, a user is easily able
    to hide their age and is vulnerable to content risks through age-restricted material,
    readily available online.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Features of cyber victimization


    Although victimization in online and offline environments can occur anonymously,
    there are a number of unique characteristics which distinctly separate the concept
    of anonymous victimization in the cyber world. Firstly, personal information can
    be efficiently obtained from those users who are more vulnerable due to poor online
    settings. Anonymous perpetrators are able to build relationships with their victims
    in order to gain further information for theft purposes or for those with malicious
    intent (Sodhi & Sharma, 2012). Second, the application of technology enables aggressive
    acts to be transmitted and received between plethora of media (i.e. texting, smartphone
    apps, SNS, chat rooms and email) (Willard, 2011). The variety of media applications
    available highlights the extent to which perpetrators can choose to target other
    users. Thirdly, the cyber world is widely populated and not restricted by time
    or space (Sabella, Patchin, & Hinduja, 2013). In cyberspace, victims and offenders
    are united effortlessly and with little obstruction, allowing victimization prevalence
    to be much greater than the physical world (Reyns, Henson, & Fisher, 2011). Knowledgeable
    offenders are able to easily manipulate an infinite number of victims using their
    own personal information, different methods and without disclosing their own identity.


    How an anonymous act also changes the digital world. In terms of cyberbullying,
    Sticca and Perren (2013) found anonymous acts to be the most severe form of bullying
    compared to traditional forms, with distribution of photos/video clips seen as
    the strongest negative impact for the victim (Smith et al., 2008). Participants
    commented that victims are usually alone, helpless and no no support experiencing
    the attack, which links with research indicating that a victim’s experience of
    fear (Mishna, Saini, & Solomon, 2009), frustration, insecurity and powerlessness
    is augmented if a cyberattack is anonymous (Dooley, Pyzalski, & Cross, 2009; Nocentini
    et al., 2010).


    The reasoning as why perpetrators choose to remain anonymous is due to the reduced
    perception of being caught, which creates an imbalance of power (Smith, del Barrio,
    & Tokunaga, 2013; Olweber & Limber, 2018). A victim is blind to who is targeting
    and therefore reporting an anonymous aggressor becomes troublesome (Vandebosch
    & Van Cleemput, 2008). Anonymity in face environment would usually refrain from
    behaving aggressively (Betts & Spenser, 2017; Lenhart, Purcell, Smith, & Zichur,
    2010). Having anonymity and freedom in the digital world creates a space where
    social restrictions and inhibitions can be loosened (Herring, 2001). The sense
    of power and anonymity can work together enabling a skewed perception of our own
    behaviour.'
