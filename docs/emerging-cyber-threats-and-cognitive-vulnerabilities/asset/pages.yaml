    2016a). The regulation introduces stronger citizens'' transparency requirements.
    It strengthens the rights of information, access and the right to be forgotten.
    Regulation gives all data protection authorities the right to impose fines up
    to EUR 20 million or 4% of the worldwide annual turnover on companies (European
    Commission, 2016a).


