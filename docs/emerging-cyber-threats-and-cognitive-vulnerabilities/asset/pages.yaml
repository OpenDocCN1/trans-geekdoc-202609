    public confidence in technology. To consider the 2015 attack, NatWest tweeted:
    “Can not log in #natwest again to check up on some transactions ... and they want
    me to opt out of paper statements?! No chance” (Collinson, 2015). This is poignant
    as it relates to how individuals perceive technology and risk, and how attacks
    can result in less trust in technology.


    Analyzing the psychological impact of Lloyds DDoS attack, it caused customers
    to be upset and frustrated—that was therefore mainly an emotional response. As
    reported by the BBC, one customer expressed: “Haven’t been able to access the
    site or app for over 6 hours now—is anything being done about this?” (Peachey,
    2017). This was one of many complaints made on social media about the ongoing
    issue. Here we see one of the prime uses of social media (e.g., Twitter, Facebook
    and blogging platforms) today—that is, allowing members of the public to directly
    reach out to companies (particularly for complaints) and they have their voice
    heard proudly.


    While it is difficult to know the full extent of the psychological impact, we
    assume that lack of access to bank accounts and potentially personal'
