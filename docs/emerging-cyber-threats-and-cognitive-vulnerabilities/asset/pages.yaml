  md: '84


    4. The social and psychological impact of cyberattacks


    # Learnt helplessness


    Findings show that less than 1 in 10 people (9%) claim that they feel ‘very’ safe
    online. Also, only half (51%) of adults aware, would change the way they behave
    online if they became a victim (Symantec, 2010). This provides an interesting
    comparison to earlier discussions. People might accept a situation, even if it
    feels unpleasant just because they cannot understand it or not know enough about
    it. Following this point, one may argue that people accept cyberattacks because
    of a sense of ‘learnt helplessness’.


    Due to a sense of learned helplessness (for more on the term, see: Seligman, 1975;
    Hirtz, 1998) and a lack of knowledge about online attacks and ways to resolve
    an incident, users may simply accept the possibility of being victims. Indirectly,
    a key question becomes, whether they also accept the reality of impacts and how
    the severity is low. The anonymous nature of cybercrime can lead to an acceptance
    that one (e.g., an individual, industry, government) will become a victim of cybercrime
    at some point. Moreover, the sense of learned helplessness can potentially also
    result in a low uptake of protective security behaviours.


    Users are called upon to make many security-related decisions every day which
    can cause anxiety. These behaviour include: (a) not opening an email from a sender
    they do not recognize, (b) not accessing attachments, (c) not downloading and
    running programs from trustworthy sources, (d) the use of antivirus software and
    security software (e.g., firewall) and creating regular backups. Some of these
    decisions can also cause the user feelings of anxiety due to a lack of knowledge
    about the possible implications of making incorrect decisions.


    Members of the public have often reported a lack of knowledge about a number of
    key areas within the cybersecurity domain. A few examples are lack of knowledge
    about how to use security packages, how to secure their technology devices and
    the threats online. When these individuals are aware of the threats, they may
    report that they do not understand them (Gross, Canetti, & Vashi, 2017). These
    low levels of public understanding of cyber threats and security practices could
    lead to a lack of public engagement with security issues and a general loss of
    confidence in cyber and/technology. This also has been seen in the domain of information
    privacy in the context of new forms of technology, where some users now consider
    privacy ‘the boring bit’ (Williams, Nurse, & Creese, 2017). These issues characterize
    the broad social impacts.


    # Cyberattack-related variables


    The public response to a cyberattack is informed by a number of cyber-specific
    variables such as the attacker identity, the target identity, the scale'
