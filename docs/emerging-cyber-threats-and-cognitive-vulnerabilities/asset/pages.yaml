  md: '# Summary, conclusions, and future work


    The absence of clearly defined techniques, effective policies, legislation and
    best practice add up to make investigation and the gathering of evidence of such
    offences as online child exploitation, fraud, and organized crime very difficult.
    This review has been the first steps in proposing a new standard operating procedure
    for investigating cybercrime. This systematic literature review was undertaken
    in which initial results and discussions were undertaken around the themes of
    investigative techniques, legislation, policy/strategy and best practice/training.


    Initial results show traditional policing techniques can lend themselves to cybercrime
    investigations, but for them to be used effectively, legislation must be in place
    to support online surveillance, data mining and interception.


    While there are strategies in place that promote the international sharing of
    information, training of officers and the classification of recording for cybercrime,
    these need to be implemented. There also need to recognition that to investigate
    cybercrime need to be effective partnerships between the police, private industry
    and academia supported by the correct legislation.


    This was highlighted by Chung, Chen, Chang, and Chou (2006). Their research concluded
    that the following needed to be in the future for effective in combating cybercrime:


    +   - update and continually reviewing laws,

    - enhance specialized tasks,,

    - utilize civic resources,

    - promoting cybercrime research.


    The systematic literature review also investigated best practices and training.
    It was established that training is well established for traditional investigations
    but identified that a lot of work still needs to be done for the investigation
    of cybercrime and the up skilling of existing police officers and new police recruits.
    There is clearly a change required in the dynamics of policing of online activities
    to monitor, control, deter, deflect, prevent or preempt malicious actors. At the
    cost of any new policing system are proactive tactics of policing. Instead of
    waiting for a crime to be committed and reacting to it, online policing will need
    to shift the initiative from the criminal to the constabulary.


