    invasion. On the other hand, Mekovec and Hutinski (2012) stated that online privacy
    perception referred to online shopping and e-banking service users'' anxiety about
    how an online company or bank (which provides the e-service) will handle information
    they collect about users during their online interaction.


    Some researchers do metaanalyses on the information privacy to locate where other
    researchers focused on or miss (e.g., Bélanger & Crossler, 2011; Smith, Dinev
    & Xu, 2011). In Smith, Dinev and Xu undertook a metadata analysis of 320 articles
    and 128 books on information privacy. They classify the literature in two ways,
    using an ethical-based nomenclature and based on their level of analyses. As a
    result of this classification, they identify three areas that researcher locates:
    the first one is the conceptualization of information privacy; second, the relationship
    between information privacy and other constructs; and third, contextual nature
    of this. They found that there are many theoretical developments in the body of
    normative and descriptive studies that have not been addressed in empirical research
    on privacy. They also found that some analyses receive less attention and researchers
    should focus on concerns and its outcomes.


    Similarly, Belangar and Crossler (2011) performed metadata analyses on 142 journals
    and 102 conference papers. They assert that information privacy is a multilevel
    concept, but rarely studied as such. The researchers mainly focus on explaining
    and predicting theoretical contributions with less attention to the action contributions.
    The paper also finds that information privacy research has been heavily reliant
    on student-based and US-centric samples, which results in findings of limited
    generalizability. Finally, information privacy can be studied at multilevel levels.


    Information system researchers have studied information privacy from different
