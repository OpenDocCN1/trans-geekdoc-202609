    # Discussion


    Both the European and American regulations aim at achieving cyber resilience,
    enhancing cooperation between public and private sectors in order to improve capacities,
    resources and processes to handle cyber-physical threats in CI. But that is not
    enough; there is a need for common cyber ecosystem to control तेव्हा threats.


    In Europe there should be clearer common rules concerning which privacy issues
    need to be abandoned when getting around in public places and what kind of data
    should be considered private. Combining data from different sources can create
    opportunities, but also many threats at personal profiling level in CI. The collected
    data cannot be used for their unauthorized use. Data must also be used for permitted
    purpose. There are some problems in creating a monitoring system when considering
    political and technological aspects.


    In Finland, the importance of privacy has risen to the surface of the social welfare
    and health care (SOTE) reform. The Finnish government''s concept of human disease
    classification system based on patient records has raised protests. There is a
    clear trend for the creation of different classification systems in Europe, but
    the problem arises when people are classified on the basis of information and
    data management is given to a third party. In Finland, one of the focal points
    of the SOTE reform is related to the integration of patient registers and the
    creation of one information system.


    Traditional thought within Finnish decision-makers has been that the commercial
    operators keep separate from regulatory activities. In the United Kingdom Home-led
    Emergency Services Network (ESN) will be replacing the existing airway radio system.
    The police communications network enables officers to access databases, to take
    electronic fingerprints and witness statements and to stream live video while
    on the move (Nasir, 2016; Travis, 2015).


    People have been irritated by the fact that their behaviour has been collected
    more widely than what has been told and for uses that are not known. Therefore,
    it is important to look at the big picture of protecting the CI. What kind of
    elements can be included in the framework which protects the vital functions of
    society. When all the things we leave some data to tracking systems, people have
    the right to know what information is collected and for what purpose it has collected.'
