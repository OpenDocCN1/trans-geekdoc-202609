  md: '# 168


    # 8. Information and communication technologies


    sector experiences 19% of all cyberattacks and the business and professional service
    sector experiences 10%, thus making them the second and third most attacked sectors
    by cyber-based crimes (NTT Security, 2018). Furthermore, their study also found
    that there was an increase in the percentage of cyber-based crimes at the financial
    sector from 15% in 2016 to 43% in 2017. In the Americas, however, there was a
    decrease from 46% to 26% in the Asian Pacific region. Therefore, this shows firms
    that operate in a specific sector will experience different probabilities of being
    a victim of a cyber-based crime depending on which region they operate their business.


    # The costs of cybercrime to firms’ financial performance and reputation


    Cyberattacks have been found to affect firms in significant ways. For instance,
    a study by Saridakis, Mohammed, and Sookram (2015) find that the losses which
    firms encounter due to crime have both immediate and long-term negative effects
    on the firms’ innovative activities. Additionally, the Information Security Breaches
    Survey commissioned by the Department of Business, Innovation and Skills (BIS,
    2013), in the United Kingdom, showed that 87% of participant firms in all sectors
    had experienced at least one attack or breach in the previous year (Hayes & Bodhani,
    2013). On the other hand, the recent Cyber Security Breaches survey (2018), commissioned
    by the Department for Digital, Culture, Media and Sport (2018), showed 42% of
    micro and small firms in the United Kingdom experienced at least one attack or
    breach in the previous years. A recent study by Romanovsky (2016) showed that
    the total cost from cyberattacks was 8.5 billion USD yearly. In addition, their
    results showed that firms experience lower annual revenues (by 0.4%) as a result
    of these cyberattacks. According to Campbell, Gordon, Loeb, and Zhou (2003), a
    firm’s performance is significantly and negatively affected by cyber-based crimes
    due to the market reaction when there is a security breach that allows unauthorized
    individuals to access confidential information. A study by Cavusoglu, Mishra,
    and Raghunathan (2004) found that firms had information breaches on average 2.1%
    of market value within 2 days of the announcement. Another study by Acquisti,
    Friedman, and Telang (2006) found that on the day of a data breach announcement,
    the firms’ market value is significantly and negatively impacted. Furthermore,
    a recent study by Arcuri, Brogi, and Gandolfi (2017) found that negative market
    returns always follow the announcement of a cyberattack.


    When firms are victims of cyber-based crimes, the reputational risk associated
    with these crimes extends beyond monetary damages'
  merge: -1
  img_proc: true
