    # Self-efficacy


    Self-efficacy is considered not as skills themselves, but the evaluation of what
    one can do with skills. It considers a person''s belief in themselves and their
    abilities (Bandura, 1991). This concerns such as cyberattacks because it is important
    that individuals believe they can stand a chance of protecting themselves and
    responding successfully to an attack''s occurrence.


    Ajzen (2002) introduced a new concept about the relationship between self-efficacy
    and perceived behavioural control. He argued that “the concept of perceived behavioural
    control consists of two factors: self-efficacy (about the ease/difficulty of performing
    a behavior) and the ability to control (the extent to which performance depends
    exclusively on the individual)”. When individuals are able to determine or influence
    what is happening to them or what will happen individuals are considered to be
    “under control”. Control is a central construction in psychology, and being under
    control is a worldwide desirable state of being for most people. The same reality
    holds in the online world, generally and in the face of a spate of emerging cyberattacks.


    # Protection motivation theory


    According to Protection Motivation Theory (PMT) (Rogers, 1975; Rogers and Prentice-Dunn,
    1997), environmental and personal factors are combined to pose a potential threat.
    The threat initiates two cognitive processes: threat appraisal and coping appraisal.
    The threat appraisal process evaluates the'
