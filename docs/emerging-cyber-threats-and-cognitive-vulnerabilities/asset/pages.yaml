  md: '# Introduction


    Over the last few decades, there has been an increase in the development of computing
    and telecommunication technologies, which has enabled, in a significant way, the
    development of an advanced global business and commerce (Andrijcicic & Horowitz,
    2006). The continuous advancement of information technology (IT) impacts all sectors
    of the economy, both positively and negatively. The implementation of the Internet
    into business operations creates a paradigm shift from the traditional ways in
    which firms operated and interacted with customers and employees. However, it
    also increases the vulnerability to information security breaches (Arcuri, Brogi,
    & Gandolfi, 2017). The Internet, coupled with advancement in IT, makes virtual
    management of business possible and allows for quicker and more efficient transactions.
    It also allows for online databases, which significantly reduce the time it takes
    to retrieve information while creating the possibility for linkages across them.
    With the escalating globalization forces and the added pressure of competition
    around the world, companies are increasingly applying the Internet as a strategic
    tool (Ching & Ellis, 2004; Pezderka & Sinkovics, 2011). The proliferation of information
    and communication technology (ICT) applications acts as a source for competitiveness
    and allows firms to grow their processes (Jean, Sinkovics, & Causvig, 2010) and
    also allows them to expand their international activities (Sinkovics & Lenz, 2005).
    Because small- and medium-sized enterprises (SMEs) play an important role in the
    economy, through their contribution to job creation and stimulating innovation,
    it is anticipated that SMEs adopt new technologies to create more innovative products,
    compete in more effective ways and enhance their growth and survival (Bruque &
    Moyano, 2007; Higón, 2011; Nguyen, 2009; Smith, 2008; Steinfield, LaRose, Chew,
    & Tong, 2012).


    This chapter discusses some performance aspects of the growing use of information
    and communication technologies by firms, especially SMEs, but also to highlight
    potential security threats that affect the life of the firm through, for example,
    financial losses and damage of the firms'' reputation. The role of information
    and communication technologies on performance and internationalization activities
    of SMEs section discusses the effect of ICT on firms'' performance and international
    expansion. SME security challenges and cybercrime risks associated with the use
    of information and communication technologies reviews the security risk associated
    with the increasing adoption and reliance of the ICT Section. The costs of cybercrime
    to firms'' financial performance and reputation provides some'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# The role of information and communication technologies


    aspects related to the costs of cyberimes to firms and customers. Finally, the
    last section concludes this chapter and provides recommendations for building
    a safer online environment.


    # The role of information and communication technologies on performance and internationalization
    activities of SMEs


    The advantages of adopting ICT in SMEs have been widely explored in the current
    literature (Afolayan, Plant, White, Jones, & Beynon-Davies, 2015). For instance,
    integration of IT enables firms to reduce their cost (e.g., Oluwatwayo, 2014;
    Singh, 2011), apply more efficient methods of communication (e.g., Ajayi & Olaybung,
    2014; Pickernel et al., 2013), respond to their business partners and customers''
    requirements (e.g., Raymond, Bergen, & Bili, reduce delivery time, improve decision-making
    (Beheshti, 2004) and allow engaging in entering multiple foreign markets (Pezderka
    & Sinkovics, 2011). However, by adopting the Internet into business operations,
    this allows for the employees to use the Internet for personal purposes, which
    causes them to postpone their duties and reduce their productivity (Sharma, Marimuthu,
    2016). The contribution of ICT to firm performance has been documented in previous
    literature at the macro-(e.g., Oiner & Schechel, 2000) and the microlevels, (e.g.,
    Brynolfsson & Hitt, 2003, Smith (1999)), for instance, provides statistical evidence
    showing that when firms adopt a greater use of IT, their performance is higher
    for a sample of new and small firms. Baldwin and Lin (2002), on the other hand,
    show that highly productive SMEs in Canada are more likely to adopt advanced technologies,
    while de facto find that the effect of adopting ICT can have a positive relationship
    on firms'' productivity in direct and indirect ways. These effects also depend
    the sector in which the firm operates (Tarutea & Gatautis, 2014).


    Moreover, the development of IT and the digital age is changing the way in which
    international business activities are being conducted (Alcacer, Cantwell, & Pisciteli,
    2016). Undoubtedly, the use of ICT and the Internet provides small firms with
    new methods to connect their businesses, exchange ideas, gain information and
    communicate with their customers and suppliers in more efficient ways (Loane,
    2006; OECD, 2001; Weill & Vitale, 2001). Many researchers have argued that the
    Internet enables small firms to expand their businesses and reach customers through
    the use of websites (Hamill, 1999). The acquisition of foreign market knowledge
    is needed for internationalization and which is also the foundation of different
    internationalization theories such as Uppsala Internationalization Model (Johansson
    & Vahlne, 1992; Johansson & Wiedersheim-Paul,'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 8. Information and communication technologies


    1975) can be obtained through the application of these technologies and thus the
    Internet can enhance firms’ internationalization opportunities. For instance,
    formal and informal Internet collaborations enable firms to develop new products
    and enhance their innovative activities (Loane, 2006). In more words, Internet
    and ICT may enable firms to obtain a specific set of knowledge, collaborate with
    different types of customers and suppliers which may enable the acquisition of
    the foreign market knowledge needed for internationalization.


    It is strongly suggested that the use of e-commerce, emails and social media networks
    have generated positive effects on firms by enabling a better and more efficient
    way in sending mails, conducting transactions, buying products and advertising
    (Manochetti, Al-Esmail, & Ashrafi, 2012, Wang, Pauline, and Zhang (2016) argue
    that the application of social media such as Facebook, Whatsapp, witnessed increased
    adoption by companies recently. Companies are using social media applications
    to achieve different business objectives such as communicating with their customers
    and suppliers, establishing relationships and identifying potential partners (Nash,
    Seth, & Iyer, 2010; Shih, 2009; Wang et al., 2016). For example, it can be argued
    that firms’ interaction allows customers to extract information about their existing
    products and services (e.g., through monitoring customers’ data and online feedback)
    and potential ways of improvement (Castriotta, Floredddu, Di Guardo, 2013; Fernandes,
    Belo, & Castela, 2016; Floredddu, Cabiddu, & Evaristo, 2014; Manyika, Roberts,
    & Sprague, 2008; Schniederjans, Cao, & Schniederjans, 2013) as well to identify
    that the introduction of tablets and smart mobile phones is also changing the
    way small firms conduct their businesses and compete by identifying new and cross-border
    opportunities. (Harris & Patten, 2014). For instance, employees in small firms
    increase their individual performance at a lower cost of services by using smartphones
    to engage with their customers through social media platforms.


    # SME security challenges and cybercrime risks associated with the use of information
    and communication technologies


    With the advancement of the Internet and ICT system enabling firms to improve
    their performance, growth and entrance into foreign markets, the same period of
    advancement has witnessed an increased number of cyber-based crimes. These have
    resulted in an increase in different types of cyberattacks that are disrupting
    businesses, breaching data and causing various types of business problems which
    result in economic losses to both businesses and the national economy as a whole
    (Andrijcic & Horowitz1, 2006; PricewaterhouseCoopers, 2018). Firms may experience'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# SME security challenges


    greater expenses, reduction in future profits and dividends, decreases in sales
    revenue, deteriorating reputation and reduction in the market value of these firms
    as a result of cybercrimes (Gordon, Loeh, & Lucynch, 2003). The risk that cyber-based
    crimes pose the profitability and performance of a firm grows steadily with the
    increasing reliance on technology for efficiency and reliability. According to
    Hamilton Place Strategies (2015), the median cost of a cyberattack tripled between
    2010 and 2015. Firms incur these increasing losses due to cyber-based breaches
    and as a result the global cost of cyber-based crimes is approximately 600 billion
    USD (Mcaffee, 2018).


    Just with large firms, SMEs are also aware to cyberattacks and security breaches.
    However, there is the implication that SMEs are vulnerable to such attacks due
    to the fact that they have limited financial resources and expertise to implement
    an inclusive information security system (Gupta & Hammond, 2005). It is also implied
    that a cyberattack can affect the business in a negative way may especially financially
    through the loss of account details and customers'' data (Ponemon, 2005; Valli,
    Martinus, & Johnstone, 2014). Security attacks and threats can cost significant
    amounts of money each year (Gordon, Loeh, Lucynch, & Richardson, 2004); therefore;
    SMEs are required to protect their data from such attacks (Romano & Fjermestad,
    2007). However, earlier studies argued that owner-managers of SMEs were not aware
    of the security risks associated with their IT applications (Bradbrad, Norris,
    & Kahai, 1990) and did not minimize these risks (Harris & Patten, 2014). It is
    inferred that owner-managers of SMEs do not perceive that their firms are targets
    for cyber-based crimes (Sani & Vijayakumar, 2012). Gupta and Hammond''s (2005)
    study show that small firms are less likely to experience cyberattacks, and this
    can be attributed to the value of the information stored by these firms as might
    not be of great value for hackers. However, a cyber-based crime embodies a ''ricochet
    effect'' whereby a business can be impacted by merely sharing the same industry
    sector with a victim (Hamilton Place Strategies, 2015). Therefore, no industry
    is immune or invulnerable to cyber-based crimes or the impact of cyber-based crimes
    (Benson, 2017; Hamilton Place Strategies, 2015).


    The probability of being a victim of a cyber-based crime varies depending on the
    size and the sector under which it operates. The financial sector is the most
    attacked sector globally (Benson, Mcalaney, & Frankel, 2018). A study by NTT Security
    (2018) found that 26% of all cyberattacks were aimed at the financial sector,
    where these criminals were motivated by financial gains or espionage. Therefore,
    firms in the financial sector experience the highest occurrence of cyber-based
    crimes and hence must invest heavily on cyber security to reduce the cost and
    damages associated with a cyberattack. The technology'
  merge: -1
  img_proc: true
