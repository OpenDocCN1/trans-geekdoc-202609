    To win this nationwide award symbolized a patriotic/heroic act, i.e. it motivates
    individuals and companies to consider their ideas and knowledge to a common project
    that promotes the sense of nationalism and political legitimacy of ‘unified information
    space’. Here the Russian sense of security is established by celebrating the ‘Russian
    way’ of doing things. Participation in the ritualistic events links people to
    the community’s worldview and perception of its own history.


