  md: '42 2. Cyberterrorism – the spectre that is the convergence


    # Query 4: When terrorists groups use cyberspace to communicate, recruit or publish
    their vision, mission and activities in a digital domain, can this be considered
    cyberterrorism?


    Talihäm (2010) states that the list of Internet-based terrorist actions includes
    propaganda, public relations, sharing information through instructions/manuals,
    fundraising, and recruitment. Such activities actually help terrorist in general
    and are not to be considered as acts of cyberterrorism. Cyberterrorism is the
    actual attack of information and communication infrastructure motivated by political,
    religious and philosophical objectives. Cyberterrorism entails a co-ordinated
    attack against a computer system or network to disrupt the equilibrium or operations
    in order to promote a political, religious or social cause.


    Terrorist groups use the Internet to communicate via websites, chat rooms and
    email to raise funds and to covertly gather intelligence on future targets (Wilson,
    2005). Today, social media and the Internet are being used to radicalize, transform,
    and recruit members into terrorist organizations. Such activities may support
    terrorist in general but do not constitute cyberterrorism. Use of the Internet
    to assist with terrorist activities is incorrectly labelled as cyberterrorism
    instead of considering such activities as support functions to terrorism.


    # Query 5: Do cyberterrorists aim to steal money?


    Terrorists may try to raise funds for their organization through auctions, fake
    drugs, casinos, donations and financial laundering through use of the digital
    world. However, this is not their primary goal. Driven by political, ideological
    or religious reasoning, cyberterrorists would pursue opportunities to cause disturbances
    to critical infrastructure. Terrorists groups may run phishing schemes or commit
    crimes of credit card theft or online banking theft for financial support to their
    group. A terrorist who hacks into a personal bank account to steal credit card
    information is not a cyberterrorist, even if the funds are used to support terrorism
    — this is simply a case of hacking or cybercrime committed by a terrorist (Parker
    in Center 2009).


    The raising of funds can assist terrorist groups in their operations but the primary
    practice of cyberterrorism is not merely to steal money. The purpose of interfering
    with a bank or foreign exchange facility would be to cause wide-scale panic and
    create public publicity for their cause.


    Terrorists mainly aim to look for ways to interfere in the way we live — the manner
    in which we eat, drink, communicate, move around and get help. Thus, while financial
    support is required to fund terrorist'
