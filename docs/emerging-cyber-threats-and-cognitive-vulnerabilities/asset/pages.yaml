    # Query 1: If there is a cyberattack it should be labelled as cyberterrorism?


    Any cyberattack could be cyberterrorism in the media. Cyberattacks occur on networks
    all the time and are typically carried out through weaknesses and exploits in
    the systems. Malicious hackers may want to prevent systems from being available,
    choose to destroy data or interfere with the proper operation of ICT Infrastructure.
    In order to carry out a cyberattack, the perpetrator, motive, target, aim, and
    effect need to be evaluated. Attacks stemming from terrorist groups aiming to
    interfere/disrupt critical systems with the goal of promoting philosophical ideal
    related to religion, political or socio-political uses may be termed cyberterrorism.
    However, an attacker trying to expose a company''s password may not be hacking
    to protect the government.


    All acts of ‘Internet anarchy’ do not necessarily constitute cyberterrorism. Cybercriminals
    hack for different purposes than cyberterrorists. The goal in terrorism is to
    inflict pain, suffering and fear on their victims. Cybercriminals, however, hack
    for financial benefits, fraud, boosting their ego, challenging themselves or revenge.
    Cyberterrorists aim to destroy and damage critical infrastructure in order to
    promote their cause, gain publicity and overall to cause fear.


    While crime is often motivated by economic gain, and hacking or Internet vandalism,
    is often done to satisfy the hacker’s ego, cyberterrorism is fuelled by an ideology
    (Curran, 2016).'
