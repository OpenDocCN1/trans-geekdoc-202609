  md: '# Convergence of physical and digital worlds


    The physical world and digital world have converged into devices and systems that
    now operate on the concept of being ''smart'' (Fig. 2.3). The Internet of Things
    has opened up the possibility of using fridges that track grocery stores, homes
    that have its lighting, heating and entertainment controlled by smartphones and
    garage doors opened on the location of your car. Critical infrastructure like
    power plants and water systems use SCADA which is the foundation of envisaged
    ''smart cities'' and modern military equipment. Targeting these smart systems,
    terrorists could destroy and influence critical systems that affect the daily
    lives of society. Terrorists could cripple economic-, military- and civilian-dependent
    systems by attacking core ICT infrastructure. Due to the development of smart
    devices, systems and cities, this has opened up an avenue for digital exploitation.


    In recent years, there has been an increase in the number of Advanced Persistent
    Attacks (APIs) that threaten governmental and civilian infrastructure (Fig. 2.3).
    A prime example is the Stuxnet virus that infected the nuclear facilities in Iran.
    It showed the possibility of causing large-scale damage from computer equipment.
    and ''world''s first digital weapon''. Also, an energy provider in Ukraine was
    attacked resulting in large blackouts in 2015. A small dam in Rye Brook, New York,
    was reportedly attacked by an Iranian group in 2013. Hackers were able to access
    the core command and control system. In 2012, the Flame malware was able to render
    computers in the Iranian energy sector useless was also considered as a huge cyber
    weapon. These are just a few of the many threatening attacks that have occurred
    on critical systems and demonstrate the negative outcomes from cyberattacks driven
    by terrorist objectives.


    ![](img/9024c4b0c894c51a53cadc2892f2dfc2_58_0.png)


    FIGURE 2.3 Spectre convergence of the physical and digital worlds. Credit: Own
    Compilation.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Convergence of physical and digital worlds 45


    A cyberterrorist attack may not be restricted to industrial systems. A cyberterror
    attack vector could also include common hacking techniques like cross-site scripting,
    vulnerability exploitation and SQL injection to a critical server or website.
    However, severe phishing, data theft, online casinos and gambling could also be
    used to find and store monetary resources to support real-world terrorism. These
    are more supportive functions that the digital domain plays in the world of terrorism.


    The jihadist insurgents in Syria and Iraq use all manner of social media apps
    and file-sharing platforms, most prominently Ask.fm, Facebook, Instagram, WhatsApp,
    Paltik, Viber, JustPaste and Tumblr (Klausen, 2015). Terrorist recruitment, fundraising,
    propaganda, and influence campaigns are also carried out in the digital world.
    However, support capabilities aided the activities of terrorist groups in general
    and are thus not cyberterrorist activities. Computer technology in this way can
    facilitate terrorism by providing ideal mediums through their organizational message,
    motive and activities are promoted. Digital technologies provide for mechanisms
    through which terrorists groups coordinate, and perform influence on their targets.
    Fleming and Stohl (2000) mentions that computer technology can help support structures
    to further terrorist tactical and strategic goals through the utilization of political
    propaganda (including disinformation programs), recruitment, financing, and inter-group
    gathering. Thus, there exists a differentiation between how terrorists acts and
    cyberterrorism. Such practices serve as propaganda, publicity and recruitment
    into terrorist groups which eventually may lead to terrorism in general.


    Overall, certain technological capabilities are also enhancing terrorism. Encryption
    software like TOR is used in communications with journalists to obscure locational
    information (Klausen, 2015). Encryption can hide terrorist groups and conceal
    their true intentions. With the use of anonymizing technologies and even the use
    of the dark web, terrorist groups are finding ingenious ways to mask their actual
    communications and harmful plans. Thus, computer technologies are providing innovative
    methods that terrorists can use to their advantage. Such technological capabilities
    are aiding the terrorist groups in general in their operations but do not necessarily
    constitute cyberterrorism. Therefore, it is important to differentiate between
    terrorism itself and support functions of ICT that aid terrorism.'
