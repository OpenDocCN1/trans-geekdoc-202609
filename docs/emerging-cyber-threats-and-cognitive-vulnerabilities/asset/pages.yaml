    (Hempehill & Heerde, 2014) and low self-esteem (Brewer & Kersklake, 2015; Mobin,
    Feng, & Neudorf, 2017) are more likely to be victimized by cyberbullying. Festl
    and Quandt (2013) reported personality factors such as conscientiousness and openness
    to experiences of cyberbullying. Identifying vulnerable individual characteristics
    enables intervention to target areas of development. However, there is a need
    for more longitudinal research to consider direction of the association between
    individual characteristics of victims of cyberspace.


    It is important to take into account additional risk factors beyond an individual''s
    characteristics for targeted individuals, groups, companies and the wider community.
    In particular, how these risk factors impact across different settings including
