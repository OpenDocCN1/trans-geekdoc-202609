- pgno: 162
  md: '# 7. Standard operating procedures for cybercrime


    images, seek to recover any potential DNA and fingerprints and potentially recover
    an image to the public of the suspect they wish to interview. This collectively
    increases the likelihood of the offender being identified, arrested and prosecuted.


    However, if we take the same example as cyberspace, we find that cybercrime tends
    to involve a number of intricate connections that makes the investigation more
    complicated (Broadhurst, Grabosky, Mamoun, & Chron, 2014). Thus, using the same
    example, if the victim attends their bank to withdraw a sum of money and finds
    that it has been emptied by an online attack, the victim is likely to be informed
    to report this matter to action fraud unit and is not likely to even see a police
    officer. Therefore, the likelihood of any suspect identified arrested and prosecuted
    is very low.


    As shown by the two examples despite the efforts involving the victim, bank and
    money, the levels of service provided vary vastly. This is compounded by a lack
    of standard operating procedures for officers to follow in investigating the online
    example, as well as lack of knowledge as to what data are available and how data
    can be used. This is further exacerbated by the government''s comprehensive spending
    review and the extensive cuts to police budgets which have resulted in fewer police
    officers (Millie & Bullock, 2012). Furthermore, any additional officers that the
    police seek to combat cybercrime will require training not only in the field of
    cybercrime but the basics of UK law and the traditional police investigation processes.
    When training is made available, the legislation needs to be in place to support
    the investigation techniques and the evidence-gathering processes.


    Effective cyber investigations are usually undertaken using best practice approaches
    as evidence-based policing. In an evidence-based policing approach, officers and
    staff create, review and use the best available evidence to inform and change
    policies, practices and decisions. Such best practices help in effective and efficient
    investigations and evidence gathering. For traditional policing, the training
    and sharing of best practice is managed through the College of Policing. Training
    for new recruits is controlled through the IPLDP. Additional training for detectives
    is provided through the Initial Initial Crime Investigators Development Programme
    and for experienced managers through the Senior Investigating Officers programme
    (College of Policing, 2015). The courses are designed to instruct officers in
    the investigation of traditional crime types. Recently, the College of Policing
    have started to develop the following training for cybercrime:


    +   Level 1 ‘Cyber Awareness’ – Target audience being all police employees who
