  md: '# Controlled digital harmony


    This chapter has shown how ‘RuNet’ forms a ‘sociocultural basis’ of ‘the Russian
    segment of the Internet and how both of the concepts are situated, historically
    and institutionally in the Russian ‘unified information space’. The given examples
    demonstrate development of the Russian sense of information security and how it
    is produced in the historical fear-template for isolation rhetoric, by celebrating
    and awarding the ‘Russian way’ of doing things, by cleaning they for safer information
    environment and by the state project to control of ‘the-national segment of Internet’.


    It can be argued that the ‘unified information space’ presents a kind of controlled
    digital harmony. It is the synthesis of freedom, and perhaps anarchy and fear,
    and security. It is a particular Russian sociocultural product where the spirit
    (psychology and information) and the land (technological infrastructure of Internet)
    are secured and bought under control the benevolent of the tsar (the state and
    security services). It orders the people (private citizens and corporations) to
    take part in creating security by inviting them to create that security on the
    conditions that the state sets for them. Security through harmony is created by
    closing off the Russian digital society from male influences


