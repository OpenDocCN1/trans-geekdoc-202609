    # The online disinhibition effect


    Regarding the impact of cyberattacks on online behaviour, there are different
    aspects of cyberspace that need to be considered. One of these aspects surrounds
    the reality that individuals say and do things in cyberspace that would not ordinarily
    say and in the offline (face-to-face world. For instance, they may loosen up,
    feel less restrained, and present themselves more openly. So pervasive is this
    phenomenon that a term has surfaced for it, namely the online disinhibition effect
    (Suler, 2004).


    This disinhibition is empowered by several factors. Consider the fact that people
    can form a different identity online and they may feel less vulnerable in the
    way they express themselves or behave, in comparison to how they would act offline.
    Moreover, people can feel less visible online and therefore might engage in activities
    that they otherwise would not. This factor affects our discussions on impacts
    as the consequence of some online actions or activities may not be fully tangible
    to people in the offline world. This has also been discussed in other areas as
    it relates to cybercrime (Nurse, 2018).


    # Understanding public reactions to malicious cyber incidents


    # Emotional reactions to cybercrime


    Research indicates that current forms of cyberattacks can cause psychological
    impact (Gandhi et al., 2011; Dallaway, 2016; Modic & Anderson, 2015). Depending
    on who the attackers and the victims are, the psychological effects of cyber threats
    may even rival those of traditional terrorism (Gross, Caneti, & Vasidhi, 2016).
    Victims of online attacks and crime can suffer emotional trauma which can lead
    to depression. There is also some evidence of limited symptoms of acute stress
    disorder (ASD) in victims of crime in online virtual worlds, as some anecdotal
    accounts of intrusive memories, emotional numbing and upset from victims of virtual
    sexual assault (Lynn, 2007).'
