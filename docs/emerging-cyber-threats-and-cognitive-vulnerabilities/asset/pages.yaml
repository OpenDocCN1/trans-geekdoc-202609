    # Bystanders


    In the digital world, bystanders observe acts of cyber aggression in situations
    where a perpetrator openly victimizes a target or group of people in sight of
    an audience. Therefore, bystanders bystander will witness a cyberbullying episode
    by viewing a shared message or piece of information. In a sample of 799 12–17
    years old, 67% report to have observed others participating in cyberbullying on
    SNS and 91% report they ignore the harassment they witnessed (Lenhart et al.,
    2011). Traditional bullying tends to be observed by a limited number of bystanders
    who play key roles (Craig & Pepler, 2007). In the cyber world, the potential number
    of bystanders of one episode of aggression is increased when shared or between
    individuals and peer groups, essentially repeating the act (Kowalski, Giumetti,
    Schroeder, & Lattanner, 2014; Slonje et al., 2013). With an audience see in the
    cyber world, the role of a bystander is not only meaningful for our understanding,
    but crucial for potential preventative measures (Holfeld, 2014).


    Desmet et al. (2014) divides bystander behaviour into active and passive practices,
    which includes negative and positive intentions. Negative examples of behaviour
    include reinforcing the act, participating or encouraging the aggressive behaviour
    by sharing the information. Positive behaviour includes directly defending or
    supporting the victim or reporting the incident to an adult. Passive bystander
    behaviours involve ignoring the incident, with no positive or negative response
    toward the perpetrator or victim. Passive bystanders attribute their behaviour
    to fear of being victims themselves (Desmet et al., 2012), foreseen the potential
    to further embarrass the victim (Thornberg, 2007),'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'fear of not being able to achieve the desired result (Thornberg & Jungert,
    2013) and also not feeling responsible (Olenik-Shemesh, Heiman, Eden, 2015). Bystanders
    have previously been a research focus in terms of the bystander effect (Fischer
    et al., 2011; Latané & Darley, 1970) which states that a bystander is more likely
    not to help a victim due to a larger amount of bystanders present. It is therefore
    suggested the more bystanders who witness an act of cyberbullying, the more likely
    it will encourage responses (Máčáčová, Dedkova, & Mezululanikova, 2015; Olenik-Shemesh
    et al., 2015). The responsibility to positively becomes diluted amongst the audience,
    with bystanders believing that others will defend the victim, through diffusion
    of responsibility. This could be attributed to passive behaviour, which is the
    most common bystander behaviour to be reported across the literature (Brody &
    Vangelisti, 2016; Lenhart et al., 2011).


    One method to tackle perceptions of the bystander is to be anonymous. Bystanders
    are able to hide their active or passive responses online and can choose to respond
    privately to the perpetrator or victim both (Bastaens et al., 2014). Anonymity
    has been described as being empowering for bystanders, to reinforce perpetrators
    and to be fearless of accountability (Barinska, Szuster, & Winiewski, 2013; Druck
    & Pavlovitz, 2005). If a bystander needs to decide on a particular response, perceptions
    of what an audience’s response are important and may be suppressed when there
    are limited observers within more private settings (Schedl, & Tkalic, 2014). This
    is supported by research indicating that adolescents are more likely to respond
    negatively as a bystander when there are limited observers (Barlińska et al.,
    2013).


    Although more severe acts of aggression predict more supportive bystander behaviour
    (Bastaens et al., 2014), bystander perceptions would be adjusted with education
    and clarity around the realistic gravity of the cyberbullying they witness. Furthermore,
    if bystanders could alter their view perceive acquaintances as being worth of
    a supportive response and not just their close friends (Bastaens et al., 2014;
    Brody & Vangelisti, 2016) the implication could be phenomenally meaningful. In
    instance, for rationale can be drawn from the results of a study by Beaman, Barnes,
    Klentz, and McQuirk (1978) who found participants who educated in the bystander
    effect being more likely to intervene in an emergency. Empowering more bystanders
    to behave with morality needs to be at the forefront of any attempt to promote
    positive bystander behaviour.


