    # Policy/strategy


    To support the investigation techniques and legislation to work effective in combating
    cybercrime, there need to be effective policy and strategy. The Cabinet Office
    (2014) reports on the UK government progress on delivery of its 2011 Cyber Security
    Strategy. The document focuses on the progress with small business, the critical
    infrastructure and the funds that have been allocated to the setting up of the
    National Cyber Crime Unit, Regional Cyber Units and the Metropolitan police Falcon
    team. These units contain a small number of specialist officers and there is no
    acknowledgement in this document of any strategy to support the mainstream investigation
    of cybercrime. The Home Office Strategy on Cybercrime (2010) highlights the need
    of a classification for the recording of cybercrimes, but where five years later
    enforcement still does not have classification codes so remains remains central
    collation of any statistics. The strategy does not focus on the generic police
    investigators, their training and any required legislation changes.


    Furthermore, strategy needs to be shared to be effective. In the United States
    Department of Defence Cyber Strategy (2015), it states as a matter of first principle,
    cyber security is a team effort within the US government and Defence Department
    operates in partnership with other Agencies, international allies, states and
    local governments, and most importantly, the private sector. The document outlines
    its five strategic aims as follows:


    +   - Build and maintain ready forces and capabilities to conduct cyberspace operations;

