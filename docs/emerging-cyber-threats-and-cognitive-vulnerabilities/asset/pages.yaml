    # Lloyds Banking Group Denial-of-Service attack in 2017


    In 2017, the Lloyds Banking Group and other banks in the United Kingdom fell victim
    to a DoS attack that persisted over a 2-day period. DoS describes an attack where
    systems are bombarded with illegitimate requests or data and become unable to
    respond to legitimate requests (e.g., for a webpage or service access) in a timely
    manner (Nurse, 2018). In this instance, the financial institutions were attacked
    by a distributed (DDoS) originating from multiple, dynamically changing locations.
    The Lloyds group were one of the most significantly targeted banks during this
    attack, and attack impacts included system unavailability and limited online service
    access for its customers.'
