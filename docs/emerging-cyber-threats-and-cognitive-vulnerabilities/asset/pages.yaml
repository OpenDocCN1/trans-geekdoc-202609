    any initial inconvenience. These are all important concerns because they could
    each incite a change in how the public views cyberattacks and whether they believe
    they have any control or skills to protect themselves or their families.


    # Conclusions


    As online threats and cyberattacks continue to permeate the Internet, it is essential
    that we as a community develop a better understanding of these issues and how
    they can impact our lives. This chapter took a significant step towards that by
    exploring how members of the public perceive and engage with risk and how they
    can be impacted by a cyberattack taken place. We focused on the social and psychological
    impacts of attacks as these are often overlooked in research and practice. There
    are, crucial factors in enhancing our understanding of the broader side of attack
    impacts. To ground our work, we identified two well-known cyberattacks and considered
    them in the context of others. It is expected that this research will motivate
    others to further investigate this area and the interaction between cybersecurity
    and cognitive factors.


