  md: '# Synthesis from ''RuNet'' 55


    process the Russian sense of security is developing, merging and fulfilling the
    people’s and state’s security needs. On the other hand, cross-cultural research
    and sociological perspectives are required to understand different national security
    solutions, human behaviour and decision-making in the field of cybersecurity.
    A sociocultural perspective is applied to describe the historical, social and
    cultural factors surrounding Russian cyber/information space and to show examples
    how the Russian sense of information security is constructed. Cross-cultural research
    requires conceptual synchronization and understanding the cultural variation of
    the ‘sense of security’. Thus, the key concepts are introduced and a dialectic
    method is used to explain their differences. Secondly, a sociocultural review
    and analysis as a theoretical framework and methodology is described. Thirdly,
    in the analytical part of this chapter it is shown how the Russian information
    security is provided through historical fear-based template for the isolation
    rhetoric, awarding and celebrating the ‘Russian way’ of doing things and by cleaning
    together for a safer environment. Fourth, the Russian understanding of information
    security is examined through the state project to control of ‘the national segment
    of Internet’. And finally, this chapter discusses how the Russian sense of information
    security is verified by the state.


    # Synthesis from ‘RuNet’ through the ‘Russian segment of the Internet’ through
    the ‘unified information space’


    Cyber concepts are constantly being developed and their definitions vary greatly
    in different languages. Thus, in this chapter, when speaking about Russia the
    concept of ‘information security’ is used instead of ‘cybersecurity’. The Russian
    understanding of cyberspace is more comprehensive than in the West, which may
    explain why the reasons for cyberspace are ‘information space’ (informatsionnaia
    sfera). Russian information space includes all media, not only information and
    computer technology platforms. Information space emphasizes the role of information
    flows, their content and value, and it stresses societal, psychological and cultural
    substances (Strategia, 2008). Alternatively, framing cyber could be considered
    one of Russia’s lines of effort when attempting to control the cyber domain (Kukkola
    et al., 2017, pp. 54–55). With its own peculiar concepts, Russia is, on the one
    hand, able to use cyber operations without sanctions sanctions, and on the other
    hand, able to legitimize a nationally governed network approach (Kukkola & Ristolainen,
    2017). Additionally, an explanation for the Russian use of'
