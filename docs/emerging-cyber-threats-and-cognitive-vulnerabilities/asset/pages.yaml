  md: '# 16 Factors leading to cyber victimization


    From a theoretical perspective, scholars have applied Routine Activity Theory
    (RAT) (Cohen & Nelson, 1979) to explain cyber victimization in the online domain.
    Using components from RAT, for cybercrime or attack to occur there needs to be
    (a) suitable target, (b) motivated offender and (c) absence or lack of guardianship.
    In terms of the online setting, guardianship would portray an absence or lack
    of security settings/measures, and physical authority presence. The widespread
    nature of online communications has presented numerous opportunities for motivated
    offenders to target victims at any time and under different settings. Motivated
    offenders could be deterred by increasing online safety awareness for individuals
    and companies, providing additional security to the target (Ryns, 2013; Yar, 2005).
    While the application of the theory can be suitable to explain behaviours in the
    online domain, notable differences between the real world and virtual world exist,
    challenging the suitability of the theory to explain such behaviours.


    One of the keys across online communications, making people vulnerable to the
    risk of social engineering attacks. The notion of social engineering is recognized
    as an escalating information security problem. Most recently, these exploits are
    becoming more sophisticated, creating additional impact on the targeted victim(Krombholz
    et al., 2015). In particular, the evolution of digital devices and new online
    media create new platforms for users to engage in social engineer attacks across
    virtual communities. These attacks manipulate a victim or multiple victims to
    exploit personal andor private information (Conteh & Schmnick, 2016; Heartfield
    & Loukas, 2016). These attacks can take a number of approaches, including physical,
    social and technical aspects, through different channels and can be perpetrated
    through software- or human-based operators (Krombholz et al, 2015). Such attacks
    include phishing, baiting, tailgating, file masquerading and pop-ups through sophisticated
    systems to attack virtual communities for desired information (Conteh & Schmnick,
    2016).


    A coherent example of online social engineering is the fake anti-virus cyberattack
    (Sosph, 2011). A perpetrator of fake anti-virus may use several avenues to reach
    their target. A user may receive an email, a popup, unintentionally to a compromised
    website, or a link which has been planted within search results. From these different
    sources, a user is informed that they have an infected computer system, which
    does not really exist. Essentially, an individual is scared into believing something
    that is not true. The fake anti-virus will continually send alerts informing the
    user of the danger of the bogus until they install the software which then proceeds
    to administer a fake system scan where many non-existent threats are reported.
    Registration and payment of the software (malware) is pushed onto the'
