  md: '# 4. The social and psychological impact of cyberattacks


    Camp, 2012. Also, the general culture of fear related to crime and cyber events
    (Furedi, 2002) can prompt people to change their behaviour. In this section, the
    factors influencing perceptions of risk to cyber events and reactions to risk
    are discussed. Moreover, different theories and theoretical models are presented
    as related to conduct online.


    # Perception of risk


    Research in public perception of risk (Slovic, 1988, 2000; Sjöberg, 2000; Dickert,
    Västfjäll, Mauro, & Slovic, 2015) demonstrates that potential factors which can
    influence the public levels of perceived risk as whether or not the risk is perceived
    to be: (1) voluntary (accepting increased risk through risky online activities)
    or involuntary (as opposed to knowingly accepted), (2) familiar (due to the frequency
    of appearance in the media) or unfamiliar (i.e., lack of understanding of the
    causes and consequences), (3) controllable (due to safeguards that can put in
    place) or uncontrollable (as opposed to feeling in control), (4) fair (i.e., random)
    or unfair (i.e., targeted) and (5) whether or not the risk causes ''dread.


    Also, it is suggested that, risk sensitivity and specific fear can be used as
    explanatory variables for risk perception (Sjöberg, 2000). Nurse et al. (2011)
    further evidence in considering that people use four dimensions in judging online
    risks, ability to control or avoid the risk, dread of consequences, unfamiliarity
    of risks and immediacy of consequences/impact. Members of the public acknowledge
    the threat of cyberattacks, but the steps that they take to address this threat
    vary. People react to risk in different ways based on dual information processing.
    Some react on logic, analyzing the risk, and others react instinctual on feelings
    about the risk (Dickert et al., 2015).


    Emotions can also serve as a spotlight for directing our attention but also motivating
    individuals to act. For example, people can decide on acting on risks related
    to technologies based on their feelings towards specific outcomes (Nurse, 2018).


    Other authors propose that experts and members of the public might confuse facts
    with their individual interpretation because perceptions of risk are often based
    on the interpretation of facts, which are fed by individual judgement, values,
    beliefs and attitudes (Beck, 1999). Blythe and Camp (2012) argued that overall,
    a user''s motivation to acquire security mechanisms depends on their beliefs about
