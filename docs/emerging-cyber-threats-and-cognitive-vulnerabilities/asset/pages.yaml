    This chapter presents a systematic literature review to identify techniques, policies,
    legislation and best practice for the investigation and gathering of evidence
    for cybercrime.


    # The problem of investigating cybercrime


    The UK police are trained and competent in the investigation and gathering of
    evidence of traditional crimes. Initial police training is coordinated by the
    College of Policing through the Initial Police Learning and Development Programme
    (IPLDP) (Police.uk, 2015). During this training, they are instructed in basic
    investigation techniques that follow the traditional police investigation process.


    For example, the standard process for a case in which a member of the public leaves
    a bank with cash and is robbed on the street is for police officers to attend
    the scene and make a statement of evidence from the victim and any witnesses and
    search for an offender using dogs, others and possibly a helicopter. They will
    locate and review CCTV'
