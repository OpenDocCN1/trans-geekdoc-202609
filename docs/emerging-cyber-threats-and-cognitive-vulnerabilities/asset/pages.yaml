    # Conclusion


    In summary, the chapter has provided an overview of immoral and unlawful behaviours
    that can be perpetrated through the use of ICTs. In particular, key features and
    factors have been reviewed that can lead to cyber victimization, across cyberbullying,
    cyber aggression and cyberimes. Whilst it is clear ICT can be exploited for various
    unethical gains, which can lead to detrimental consequences to the targeted user,
    the extent of the issue has not yet been acknowledged. For example, due to inconsistencies
    in the measurement and definition of these cyberattacks, precautions should be
    taken when addressing intervention efforts and policy recommendations. Moreover,
    there is a lack of consensus concerning subjectivity regarding guidelines from
    the Crown Prosecution Service in the United Kingdom on cyber aggressive attacks,
    which creates continued opportunities for those who operate online to target users
    (Bliss, 2017).


    While there are many predictors of cyber victimization, the future of ICT security
    development needs to address some of the strongest predictors outlined in this
    chapter. For example, lifestyle and time spent online are becoming synonymous,
    future developments need to incorporate security measures to adequately keep users
    safe from cyberthreats and attacks. In addition, future research and policy'
