  md: '# Central concepts


    environment, firefighting, search and rescue (SAR) and crisis management. PPDR
    describes critical public services that have been created to provide primary law
    enforcement, firefighting, emergency medical services and disaster recovery services
    for the citizens of the political sub-division of each country. These individuals
    help to ensure the protection and preservation of life and property. Public safety
    organizations are responsible for the prevention and protection from events that
    could endanger the safety of the general public. Such events could be natural
    or man-made.


    One major challenge in defining a classification of public safety organizations
    at the European level is, due to the non-homogenous topographical development
    of public safety, similar organizations have different roles in different countries
    (Baldini, 2010).


    # Structural and organizational changes in Finnish PPDR


    Structural changes within the public sector, such as the regional administration
    reform, the Emergency Response Centre (ERC) reform and so-called social and health-care
    reform have influenced the public sector employee''s work processes over the past
    10 years. Addition, technological development has occurred rapidly (Hanni, 2013).
    Changes in PPDR organizations due to legislation have developed a need to create
    special operational working methods (Aine et al., 2011). The Finnish Security
    Intelligence Service (Supo) is an operational security authority engaged in close
    cooperation with international security and intelligence services. Supo moved
    directly under the Ministry of the Interior in 2016. Earlier the Finnish Security
    Intelligence Service operated under the National Police Board (The Finnish Security
    Intelligence Service, 2015).


    # Command and control system


    A command centre is any place that is used to provide centralized command for
    some purpose. An Incident Command Centre would be located or near an incident
    to provide localized-scene command and support of the Incident Commander. Mobile
    command centres may be used to enhance emergency preparedness and back fixed command
    centres. Command centres may include emergency operations centres (EOCs) or transportation
    management centres (TMCs) as well.


    Supervisory Control and Data Acquisition (SCADA) systems are basically process
    control systems (PCS) that are used for monitoring, gathering and analyzing real-time
    environmental data from a simple office building or a complex nuclear power plant.
    PCSs are designed to automate electronic systems based on a predetermined set
    of conditions, such as traffic control or power grid management (Gervasi, 2010).'
