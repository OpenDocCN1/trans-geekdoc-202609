  md: '# Conclusions and future directions for research


    (Hamilton Place Strategies, 2015). For example, if a firm in the financial sector,
    such as a bank, experiences a cyberattack where their clients'' sensitive and
    personal information were to be obtained by unauthorized individuals, these clients
    will lose trust in bank and therefore transfer to a more secure bank. It can also
    expose these clients to other types of crimes because their home addresses, job
    addresses and account details are no longer confidential, giving criminals criminal
    motivation to commit a crime. The direct cost of a cyberattack can be substantial
    depending on the type of data acquired by the attackers as well as the firm size
    and reputation. Although the reputational risk by a cyberattack some times far
    exceed the direct cost of a cyberattack. For example, the damage of target''s
    data breach of 2013 cost the company 252 million USD in data breach—related expenses.
    However, only 90 million USD of that was offset by insurance recoveries (Hamilton
    Place Strategies, 2015).


    # Conclusions and future directions for research


    The use of information and communication technologies is increasingly adopted
    by new entrepreneurial ventures and engaging SMEs (Alam & Noor, 2009). The use
    of new technologies has made the establishment of a firm easier at a low-cost
    startup, moving from the traditional physical firm to firms operating entirely
    on Internet or hybrid business models (Teece, 2018). Additionally, new technologies
    have improved communication across business owners, employees and customers (Chen
    & Popov, 2003), efficiency, enhanced collaboration at regional, national and international
    levels, and increased firms'' international activities (Santarelli & D''Altri,
    2003). With all these benefits emerging from the use of technology, information
    security becomes a crucial aspect of firms and individuals (Saridakis et al.,
    2015; Smith, Graboski, & Urbas, 2004). The increase in cybercrime and the cost
    associated with it to build a secure environment in which they can protect themselves
    and their customers from potential cyberattacks. frequently increases the demand
    for cyber security by firms; therefore, it opens a market for cyber insurance
    and security services. Companies demand cyber insurance to protect their businesses
    against network interruption and data breaches (PricewaterhouseCoopers, 2018).
    In a survey by PricewaterhouseCoopers (2018), it was found that 61% of the companies
    in Singapore had cyber insurance, with 62% in the Asian Pacific region and 58%
    globally claiming to have cyber insurance. In addition to continuous updating
    of cyber security and ensuring that'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 170


    # 8. Information and communication technologies


    employees are adequately trained to prevent or minimize cyberattacks, another
    strategy put forward by Hamilton Place Strategies (2015) is for firms to have
    a prepared contingency plan of action for potential cyber-attacks which can save
    the company millions in damages.


    As cyberattacks become more sophisticated and more collaboration will be needed
    between institutions (e.g., business, governments, insurance and academia) to
    combat cyber-based crimes and prevent major cyber incidents such as those that
    occurred in the recent past (e.g., WannaCry and Petya) (Choo, 2011). Currently,
    69% of firms globally confirm that they are collaborating with other firms and
    institutions for the improvement of their security in an attempt to reduce the
    risk of future cyberattacks (PricewaterhouseCoopers, 2018).


    We suggest that the academic community should address the process of cyber insurance
    support for SMEs. The governance, risk and compliance processes become more complex
    and the liabilities for falling a victim of cybercrime (such as with the recent
    introduction of the GDPR), SMEs are more prone to cyberattacks and more susceptible
    to their consequences. We propose for the future research agenda to look into
    formulating a structured governance framework for SMEs. The framework will align
    their cyber insurance needs to their circumstances, aspirations for growth, small
    business ecosystems and ultimately promote engagement with other SMEs and government
    agencies in standing up to cybercrime.


