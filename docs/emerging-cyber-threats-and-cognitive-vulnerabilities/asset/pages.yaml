    # Query 3: Can I become a victim of cyberterrorism (Are cyberterrorists out to
    target me personally?)


    Aterrorist would typically attack a critical national target or systems that support
    the government, state or core services. Cybersecurity is the use of computer networks
    for the purpose of posing harm to human life or to destroy most of the important
    and national critical infrastructure in a way that will paralyze the nation and
    all its citizens (Ahmad, Yunos, & Sahib, 2012) Cyberterrorists are mainly driven
    by political, religious or philosophical reasoning and would pick a random person
    to attack. The focus of their attack is to cause a wide-scale disaster and create
    publicity for their cause. Thus, it is very unlikely that targeted civilian would
    be attacked by cyber-. Cyberterrorists aim for destruction on a far bigger scale
    with more devastating consequences. Supervisory Control and Data Acquisition (SCADA)
    system may be especially vulnerable, and due to their importance for controlling
    infrastructure, they may become an attractive target for cyberterrorists (Wilson,
    2005).


    However, ordinary people can fall victim to other common hacks like phishing,
    identity theft and social engineering. Everyday criminals are on the prow looking
    for victims that can be tricked into revealing sensitive passwords and credit
    card information. Therefore, while the risk of a cyberterror attack on an individual
    is very unlikely, there are still risks in falling victims to ordinary cybercriminals.


    The effects of cyberterrorism, however, affect individuals in a personal capacity.
    For example, if a bank system is taken offline by a political group protesting
    the government, an individual may not be able to access funds. Another example
    would be if a hospital system is hacked and tampered by a religious extremist;
    this could have a direct effect on a person. Cyberterrorists may target a specific
    individual but the effects have far-reaching consequences as the goals are mainly
    to cause fear, panic and aggravate the wider population.'
