  md: '# Case studies of cyberattacks 85


    of the attack as well as the government communication of a cyberattack and the
    time of revelation of a malicious event.


    Public reactions may differ according to the disclosed identity of a given attacker.
    The principal categories of an actor are terrorist, hacktivist and criminal—all
    of whom are capable of launching attacks that could qualify as issues of serious
    public concern (Nurse & Bada, 2018). Criminals are, on average, less likely to
    publicly reveal their identity (assuming any identity, pseudonym or otherwise)
    because anonymity facilitates them. Moreover, the target identity can impact the
    public response. For example, if a series of fraud incidents impacts individuals
    at random, it may expected that it will cause panic or outrage compared to a targeted
    attack towards a national financial, utility or health institution.


    Additionally, the scale of an attack will influence its impact. The full extent
    of attack might not become apparent immediately, particularly if second- and third-order
    systems fail. Finally, the way that the government will cyberattack and the time
    of revelation of a malicious event will impact the direction and dynamics of public
    response. The ways in which members of the public are likely to find out about
    a cyberattack is also an important variable. Different levels of public response
    can be caused due to loss of service, public announcements from the attacker or
    from government announcements, as will be seen in the next section of this chapter.


    Lawson (2013) draws upon the history of technology and failures of large sociocultural
    systems, military history and—most pertinent here—disaster sociology to suggest
    that ''fear and panic'' may not be the defining features of public reactions to
    future cyberattacks. As mentioned above, members of the public are more likely
    to respond to the event (e.g., loss of service), rather than the cyberattack itself.


    # Case studies of cyberattacks


    Thus far in this chapter, we have reflected upon the literature pertinent to understanding
    the impact of cyberattacks at the psychological and social levels. We now extend
    this discussion to real-world cases of such threats that have occurred over recent
    years. In particular, this work focuses on two cyberattacks in 2017, namely the
    WannaCry attack and the cyberattack on the Lloyds Banking Group. Our aim is to
    examine these attacks and the impacts they have had from a social and psychological
    perspective, while drawing on insights presented earlier in this chapter.'
