  md: '# Celebrating and awarding the ‘Russian way''


    development of RuNet can be illuminated through the lens of ‘RuNet award’. The
    ‘RuNet award’, i.e. ‘a national award for the contribution to the development
    of the Russian segment of the Internet’ is an annual award for the best initiatives,
    companies and applications issued by the Federal Agency on Press and Mass Communication
    (Rospechat) starting from 2004.


    In 2004 RuNet celebrated its 10th anniversary as, in 1994, the domain.ru was registered
    and the official history of the Russian Internet had begun. (Schmidt et al., 2006,
    51–52) have described the 10th anniversary celebrations as aimed at integrating
    the Internet into an official cultural context and making the use of Internet
    as a national pride. In the first ‘RuNet show’ 15 companies and projects contributing
    to the development of ‘the Russian segment of the Internet’ were awarded. The
    show was featured by a prima ballerina of the Bolshoi Ballet and blessed by the
    Patriarch of Moscow Alexei II (Schmidt et al., 2006).


    The ‘RuNet award’ can be seen as one of the first events where state takes over
    ‘RuNet-thinking’. State-organized competitions are a Soviet phenomenon. Under
    Socialism everything was different and different competitions supported the ideology.
    The guiding principle was to get better, compete, to improve and then compete
    again. Competitions, their calls and instructions and award categories indicate
    what is considered valuable and influencing by familiarizing and personalizing.
    Issues that are excluded eliminate the ‘not meaningful’ issues from broad-based
    debate and contestation. In the RuNet case the award categories what is needed
    for the development of Russian ‘unified information space’ and for ensuring safety.


    In 2004 RuNet awards were given in three different categories:

    1) RuNet Technologies (provider, equipment, software and developer);

    2) Business RuNet (communication with RuNet consumers, e-Commerce in RuNet, business
    solutions in RuNet, and financial tool in RuNet)

    3) RuNet for users (search engine, e-mail, free service of the RuNet, content,
    entertainment project and community-resource).

    Generally, the winners were companies and software providing services in Russian
    (Yandex, Rambler, mail.ru). Others, a special nomination contribution for the
    formation and development of the domain.ru was given to A. P. Platonov, Director
    of the Russian Research Institute for the development of public networks (RosNIIROS).


    Next year, the award categories developed and increased from four to nine. New
    categories were Government and Society, Culture and Mass


    > A complete list of the winners starting from 2004 till 2017 can be found at:
    https://ru.wikipedia.org/wiki/Премия_Рунета.'
