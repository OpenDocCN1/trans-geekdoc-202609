    # Motivation


    Various factors can influence the development of a cyberterrorist. The reasoning
    to carry out online slaughters can occur as a result of a deeper motivation. In
    order to understand what drives cyberterrorism, it is important to look at the
    motivating factors of terrorist groups in general. Individuals who commit cyber
    crimes are personally motivated, but cyberterrorists have much deeper motivations,
    be it political, religious or social (Parker in Canter, 2009). The main types
    of terrorism are (Armisad, 2004; Flemming & Stohl, 2000; Nelson, Choi, Mitchell,
    and Gagnon, 1999; Weimann, 2004):


    +   * Nationalist/Ethnic: aim to create a new political order, established based
    on view of ethnic dominance (e.g., Liberation Tigers of Tamil Eelam (LTTE), Provisional
    Wing of the Irish Republican Army (PIRA)

    * Religious belief in strong theological views and values (e.g., Aum Shinrinho
    (AUM), ISIS)

    * Political: left wing (revolutionary) and right wing (far-right extremists) intend
    to capture political power, sometimes based on belief of superiority (e.g. Japanese
    Red Army, German National Underground)

    * Single issue (New Age) tend to promote a specific contentious issue (e.g. Earth
    Liberation Front, People, for the Ethical Treatment of Animals (PETA))


    One find that terrorists mainly have an affiliation to specific group, organization
    or cause. Their malicious actions may aim to create a spectacle (theatrical and
    public incidents) so as to advance their groups'' ideologies.


    Overall, terrorist groups may choose the virtual domain in order to launch a digital
    attack in order to promote their ideological viewpoints.'
