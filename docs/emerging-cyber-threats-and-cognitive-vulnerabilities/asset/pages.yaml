- pgno: 72
  md: '# 58 3. Closed, safe and secure — the Russian sense


    ‘Sociocultural’ refers to the Soviet roots of the social constructivist epistemology,
    e.g Lev Vygotsky and the role of social context in the production of knowledge
    (John-Steiner & Hahn, 1996; Vygotsky 1962, 1978), i.e. all human functioning is
    sociurally, historically and institutionally situated (cf. Daniels, 2017). Sociocultural
    gives an approximate theoretical framework for the production of information security
    (cf. Sjosted, 2010; Wagoner, 2014) in the Russian ‘unified information space’.
    In this, the sociocultural approach is used to illustrate how a space influences
    and shapes peoples’ experiences. This approach has been chosen as it emphasizes
    the role of the society and represents an original Soviet and Russian way of comprehending
    the production of knowledge.


    In a sociocultural review and analysis are presented examples of the social, cultural
    and institutional features that can play a significant role in the production
    of knowledge (Cole, 1994; John-Steiner & Hahn, 1996). The aim is to show relation
    between individuals and the society as well as culturally created aspects in understanding
    the development of the sense of information as a collective phenomenon. In this
    chapter we have identified four examples of sociocultural production that provide
    a sense of security in the Russian ‘information space’. These examples include
    the historical fear-based template for the isolation rhetoric, celebrating and
    adapting ‘Russian way’ of doing things, cleaning together for safer information
    environment and the state project to control of ‘the national segment of Internet’.


    In the sociocultural approach language as a system of expressions plays a fundamental
    role in the production of knowledge (John-Steiner & Hahn, 1996, p. 192). Language
    is used as a tool for thinking collectively. This could be applied into cyberspace
    as well as one of the main reasons why RuNet started to develop the language and
    the feeling of being left outside. Cyrill script in a world of Latin alphabets
    creates significant obstacles, especially if the person does not know any other
    language than Russian.


    According to sources, Russian is the second most used language in the Internet
    and the amount of users of RuNet is considered the largest in Europe (Zinovieva,
    2016, p. 22). Years have been demanding ICANN (The Internet Corporation for Assigned
    Names and Numbers) to break the English language dominance of the Internet. The
    Cyrillic domain battle was aimed at raising the status of Russian as a global
    language, and it was hoped to expand Internet among Russian speakers unfamiliar
    with Latin characters. Finally, using Cyrillic was approved by ICANN following
    a request by Dmitry Medvedev in 2008 (Gorham, Lunde, & Paulsen, 2014, p. 190).
    The first Internet domains using the Cyrillic script were launched on May 13,
    2010 after Russia was officially assigned the .рф (.rf, for ‘Russian Federation’)
    domain.'
