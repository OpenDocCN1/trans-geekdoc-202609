    Broadhurst (2006) acknowledges that cybercrime is often traditional crimes (frauds,
    child pornography, etc.) executed swiftly and to vast numbers of potential victims
    across the world. Furthermore, cyberspace is a world without borders. Traditional
    crime tends to be committed with the victim and offender being in the same location.
    Cybercrimes can be committed across vast divides with the victim and offender
    borne. Brenner, Lee, Cox, & Siber, 2006 state with crimes being committed across
    international borders, it is not always possible to determine the locus commissi
    delict (the place where the offences were committed). This creates difficulty
    in deciding who has primacy in any investigation. There is a need for a process
    for information sharing, deciding jurisdiction and the ability to rapidly secure
    evidence and identify offenders. In seeking solutions for the global law enforcement
    of cybercrime, the paper identifies current conventions from the Council of Europe
    and the United Nations that may be of assistance.


    The United Nations convention against transnational organized crime was introduced
    in 2000 and although not specific to cyber crime it can be a useful instrument
    in this process. The convention enables mutual legal assistance between states
    and establishes offence categories; participation in an organized criminal group;
    money laundering; trafficking of people and methods for combating computer misuse.


    The Council of Europe Cybercrime Convention lays down three objectives:


    +   - To lay down definitions of certain criminal offences

    - To define common types of investigative powers better suited to the information
    technology environment

    - To determine both traditional and new types of international cooperation.


    While the went encourages cooperation to investigate these offences, the difficulty
    remains when attacks occur across multiple jurisdictions having their own laws
