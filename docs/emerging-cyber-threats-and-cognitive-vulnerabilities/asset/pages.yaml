    However, there are several approaches beyond this point. The most arduous solution
    is to work out the identities between various aliases and identity obfuscation
    to ensure only approved TAs are the recipients of influence messages. Quite obviously,
    this method may cause more legal issues than it solves. In addition, the interconnected
    nature of the cyber domain means that one cannot control the streams of information,
    making the idea of reaching only approved audiences unviable.


    Another approach is to use the data already available, for example, from other
    branches of government or from a third party. Using this type of data for military
    intelligence has its own legal and practical challenges. The relevant question
    in these cases is how to define military activity in the cyber domain, or at what
    stage does an intelligence gathering activity change its colour and become a military
    activity, in essence to be governed by rules of military conflict. The given plethora
    of opinions concerning the nature of information war and whether it''s activities
    be treated as an act of armed conflict, different actors can orchestrate various
    influence operations in the cyber domain in a relative safety of not being accused
    of using military force. It has been pointed out that it is exactly these difficulties
    of attribution that encourage the use of the cyber domain for influence purposes
    as an alternative for using force in the physical domains.


    The third option is to ignore the requirement for positive identification of individuals
    within a TA. It is not the option for the legally restricted, has to be observed,
    nevertheless, we argue, for two reasons: (1) It presents a theoretical understanding
    of how military TAA process can be performed in the cyber domain, helping to further
    understand the role of cyber domain in the military operations. (2) As there will
    eventually be militaries not concerned with the individual privacy, this approach
    will help to understand these influence attack vectors and how to defend against
    such attacks and their influence-gathering methods. It has to be remembered that
    soldiers are also citizens and thus provide relevant data for those digitally
    and legally agile, even when not wearing their uniform.


    It is for the aforementioned reasons we look beyond what is currently feasible,
    for the theoretical possibilities of military TAA in the cyber domain, and propose
    a way of looking at influence operations'' TAs.'
