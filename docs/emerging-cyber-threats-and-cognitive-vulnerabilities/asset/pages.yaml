    factors associated with the behaviour that potentially creates danger, including
    the intrinsic and extrinsic rewards accompanying the actions, the severity of
    the danger and one''s vulnerability to the threat. The coping appraisal process
    evaluates one''s ability to cope with, and avert, the threatened danger (self-efficacy
    and response efficacy), balanced with the costs (or efforts) associated with protective
    behaviour (response cost).


    Threat appraisal refers to how susceptible or suspicious a threat appears. For
    example, how vulnerable is an individual by the possibility of becoming a victim
    of a cyberattack such as phishing; naturally, susceptibility to phishing attacks
    is influenced by a range of other aspects (Iuga, Nurse & Erola, 2016; Williams,
    Hinds, & Jonson, 2018). Coping appraisal evaluates the various factors that are
    likely to ensure that one engages in a recommended response is preventive in nature.
    For instance, not opening emails being sent by an unknown sender, or untrustworthy
    or suspicious email address.


    The theory says that in order for an individual to adopt a safe behaviour, they
    need to believe that there is a severe threat that is likely to occur and by adopting
    such actions, they can effectively reduce the threat. The individual should also
    be convinced that they are capable of engaging in the behaviour and that it would
    cost only expected amounts in terms of effort expended. Measuring the ''intention''
    to engage in the recommended preventive activity is the most common indication
    of protection motivation.


    Another key aspect of understanding the public response to malicious cyberattacks
    centres upon the fact that members of the public do not appear to perceive such
    attacks as a threat to themselves, and, if they do, they believe that there is
