    # Introduction


    Cyber domain is today used in many ways as a platform for military operations.
    The digital battlespace has emerged from the fringes of science fiction to the
    frontline of modern military conflict. From a historical point of view, cyber
    is a relative newcomer within the domains in which the militaries operate. Although
    in recent years there has been an awakening to the advancing cyber threats, the
    wider understanding of those threats that emerge from using the cyber domain as
    a platform for other technically means of war is a relatively new phenomenon in
    the Western hemisphere. The obvious use of cyber weapons to destroy, disable or
    deceit digital systems is already being tackled in various ways. However, the
    digital environment has less obvious threats that are now beginning to emerge.
    As the digital world has transformed from a curiosity to hard reality, it is now
    being understood that digitalization produces many new military problems, in addition
    to the solutions it provides.


    Militaries perform both functions — use technology and drive it. Many technological
    innovations (including the Internet itself) have been introduced to find a solution
    to a military threat. The global cyber domain allows, among its other uses, new
    means of influence for militaries that are willing and capable of using them.
    Such means include the global reach of digital communications, new intelligence
    gathering capabilities and the reciprocal nature of social media, allowing for
    obfuscation of truth and transforming the role of gatekeepers.


    The information that people and organizations give away in their daily business,
    both directly and indirectly, can be valuable to anyone with the means of obtaining
    it. It is now possible to gather mission-relevant data in real time, often with
    the help of the subjects themselves. On the other hand, both individuals and organizations
    obtain much of their information from the Internet meaning anyone with means of
    either directly or indirectly influencing that has a global reach of operations.
    Thus, the fast and reciprocal nature of the Internet provides real-time opportunities
    for both data mining and message dissemination in support of influence operations.
    Von Clausewitz’s famous statement, of war being a continuation of politics with
    the admixture of other means, finds new relevance with these opportunities provided
    by the digital'
