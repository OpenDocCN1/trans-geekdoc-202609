    # Cyber personalities in adaptive target audiences


    Once an artificial construct of combined behavioural indicators, a cyber personality,
    has been built, a new question arises. How to build a TA'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Cyber personalities in adaptive target audiences 189


    based on abstract indicators of behaviour? Traditionally, as in FM3-05-301, the
    TA is basically a target of influence messages and retaining the same composition
    once approved by a proper authority. We argue that in the fast-paced cyber domain,
    this approach is not optimal. Combining fast and even real-time feedback from
    the digital personalities'' observed behaviour with the insights provided by the
    sheer amount of information mined from extensive data requires rethinking the
    concept of TAS suggest a certain need of and/or predictive behaviour. An adaptive
    TA will ultimately consist of nonconflicting behavioural indicators which when
    combined can be assumed as means of altering the overall behaviour of a target
    population. A single cyber personality can belong to multiple TAs, as long as
    the influence aspects of these different audiences are coherent with each other.


    In addition to how TAs are comprised, successful influence operations in the cyber
    domain may need more than just the composition of the TA to be adjusted. The rhizomatic
    nature of this environment means that the information and the integrity of data
    cannot be controlled. A message, once sent, may or not end up being read by the
    intended TA in the form it was written. In addition, other messages may suddenly
    gain wide audiences and approval, possibly colliding with existing themes and
    creating something entirely new. This leads to, abrupt changes in how matters
    are viewed and thus may lead to friendly parts of TA becoming hostile and vice
    versa (Sartonon et al., 2016). Thus it is allowed to change in volume and in some
    of the aspects, as long as the additional behavioural indicators of a cyber personality
    do not conflict with the elementary factors that define the TA. This enables the
    influence operation to adapt quickly to the fast-paced nature of the cyber domain.
    In turn, demands a constant and effective feedback loop that can provide accurate
    information to the process. The requirement for speed also means that the whole
    operational process has to be redefined with information gathering, decision-making,
    influence actions and feedback following each other in a constant loop.


    Reacting (preferably faster than adversaries) to these changes in global digital
    moods requires changing the messages and their recipients, in other words, changing
    the TAs. This cannot, however, be done without a feedback mechanism, i.e., without
    knowing how to change messages and which members to include or exclude in a TA.
    For this purpose alone, the authors of this chapter argue that the input – feedback
    loop has to be constant and very fast. Constancy requires supervision, which means
    that authority for making decisions about the composition of a TA and thus the
    targets of a psychological operation has to be very low hierarchically.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 190 9. Cyber personalities in adaptive target audiences


    Typically, any psychological operation has to begin with predefined initial TAs
    as the base of operations. There are, however, two ways of applying adaptive TAs
    to these initial groups. One would be to allow new adaptive TAs to be created
    outside the initial groups and let them be populated by new cyber personalities
    in addition to those already inside an initial TA. Another would also be allowing
    the initial TAs to become dynamic in nature (and possibly nonexistent in the long
    run), but this would mean greater risk of losing the scope of the operation. However,
    as cyber personalities are transient by definition, a static TA is an oxymoron
    to begin with. Maybe, the initial TA should reflect the preferred initial state
    of cyber personalities to be included in the TA, whereas the actual personalities
    included are even and expected to change. Indeed, it is the change in the TA,
    caused by the ongoing psychological operations as well as external factors, that
    becomes its most important characteristic.


    In summary, the concept of adaptive TA needs to take into consideration three
    entities: the initial state of individuals to be included, the actual cyber personalities
    adhering to that initial state, and the direction towards which the cyber personalities
    are desired to be moved, in accordance to the psychological operations targets.


    The nudges or changes required in the TA to first change their perception and,
    consequently, their actions would be executed by way of controlling or influencing
    the information flows to the cyber personalities included in the adaptive TA.
    As controlling the information flows on each of the five layers of cyber personalities
    is very demanding, one of the first operational targets should be to nudge the
    personalities into reflective control of their information environment, voluntarily
    preferring information sources in agreement with the final targets of the operation.
    The operation itself, individual-shots per TA, rather than static, becomes an
    ongoing, dynamic process of nudges towards a target state, with the adherence
    of the cyber personalities constantly measured and the nudges adjusted accordingly.
    Fig. 9.3 further illustrates the concept of an adaptive TA in relation to a psychological
    operation.


    In essence, we propose the following definition for an adaptive TA:


    An adaptive TA, corresponding to an ongoing psychological operation, is composed
    of 1) an initial collection of behavioural indicators, signifying vulnerability
    to the psychological operation, and manifested as a feature vector in the space
    of behavioural indicators; 2) a desired collection of behavioural indicators,
    signifying compliance to the next step in the ongoing psychological operation,
    and manifested as another feature vector in the space of behavioural indicators
    and 3) a collection of cyber personalities adhering to the indicators signifying
    vulnerability, manifested by close proximity of their individual behavioural features
    vector to the initial one.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Conclusion


    # Adaptive TA Operation


    ![](img/9024c4b0c894c51a53cadc2892f2dfc2_205_0.png)


    FIGURE 9.3 Adaptive target audience (TA) in relation to a psychological operation.


    The abovementioned concept means that many such TAs would be temporal in nature,
    utilized as long as the requirement of supporting the PSYOPS objectives met. The
    concept would also require the influence channels linked to the TA to be flexible,
    allowing for messages to be sent by the means that are currently the most effective.
    The usability and effectiveness of different channels would be a constantly changing
    variable, updated either through the same feedback loop as the TA or by external
    analysis.


    # Conclusion


    Many digital tools are capable of providing specific information on different
    subjects of interest. The five-layer model used in this chapter is just one framework,
    and many services and digital platforms combine many layers. Our main point is
    that the remarkable combination of information from all the five layers of the
    cyber domain makes it possible to conduct a more effective TAA. Therefore, focus
    should not be in one layer or one feature but collecting the behavioural indicators
    that manifest themselves in different forms in all the layers. As noted above,
    combining information allows gathering data about digital TAs’ geographic information,
    demographics, personality, behaviour and conditions, all of which are required
    for an effective TAA.


    The type of TAA we suggest here is an attempt to utilize the emerging possibilities
    provided by a global, digital environment. It serves also as a warning of emerging
    cyber threats that do not come in the purely technical form that cyber threats
    are often perceived. Although ever typically adapt to any new environment eventually,
    we believe that'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 192 9. Cyber personalities in adaptive target audiences


    influence operations or ‘information war’ is a phenomenon whose importance is
    not yet fully appreciated. One of the reasons may be that militaries are very
    aware of the obfuscate lines of authority in the cyber domain. Militaries typically
    operate within very strict legal guidance and are careful not to cross any lines
    of authority. It is our suggestion,


    ever it is also important for militaries to explore all the emerging possibilities
    of the cyber domain. The possibilities are there, and eventually, some actors
    will use them. It is always unfortunate if militaries have to learn new technologies
    ‘the hard way’, fighting enemies with superior understanding of the environment.


    Attaching cyber personalities to adaptive TAs, as suggested in this chapter, would
    require the mindset of accepting the rhizomatic nature of the cyber domain as
    an undeniable part of operations. In order words, all the messages in the cyber
    domain that shape the information environment would be accepted as an environmental
    factor, rather than a possible disruption of ongoing operations. Thus, our concept
    includes the mindset of influencing, instead of controlling, the information environment.
    This means that instead of seeking controlled and evaluated cause–effect changes,
    a more holistic approach should be applied, with only the end result in mind.
    For a western military thinker this might sound haphazard in its uncontrollability,
    but the authors of this chapter argue that the cyber domain has a level of chaos
    built in as a feature.


    # Discussion


    This chapter joins the debate on the cyber domain as a platform for influence
    operations. The authors argue that although advances in understanding human psychology
    take place in a relatively careful pace, changes in the digital environment are
    rapid and revolutionary. Stepping from the industrial to the information age may
    require entirely new approaches, instead of trying to adjust current processes
    to work in a new environment. Perhaps, the concept of war itself needs to be defined.
    Or rather, there has to be new concepts and definitions to describe the new types
    of war fighting the emerging technologies will enable.


    Using personal data in the form described in this chapter may breach many concerns
    privacy. It is our intent, however, to examine the potential threats and opportunities
    in what we see as a new front or warfare, driven by advances in technology. If
    one truly wishes to understand the evolving digital battlespace, it is impossible
    to stay away from the shades of grey. Then again, whether dealing with activities
    described in this chapter is a military matter or not is a decision each nation
    will make individually. Nevertheless, we suggest that the roles of'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Discussion


    the military and civilian authorities within the legally cyber domains be defined
    clearly, if there is intention to keep the military and civilian activities separate
    in the digital battlespace as well as the idea that military only engage hostilities
    is to prevail, there must be techniques of separation, instead of keeping militaries
    out of the cyber domain entirely.


    An obvious challenge in combining different types of data from various sources
    is that commensurating the indicators of behaviour. This, we assess, can only
    be done by further research on the combined effects that different selections
    of data have on the result, the overall behavioural change of the TA. This, we
    suggest, is one special field of further research on this subject. Although single
    studies could provide correlation between data collectable from the cyber domain
    and actual behaviour, testing conflicting results against each other requires
    a large body of studies. Ultimately, these types of studies could yield information
    on what are the most predictive sources of information concerning behaviour. In
    turn, it most probably would be within these subjects that most effective influence
    operations could be performed. Although it can be argued that marketing studies
    most probably are ahead in such, it should be understood that there are crucial
    differences in the approach between civilian and military influence approaches.
    By law, militaries have to prepare for adversaries not following national laws
    and thus must prepare defending against far sinister attempts that their civilian
    counterparts. It is against this background that militaries should prepare for
    what is possible, not against what is legal.


    Another challenge to the operations described in this chapter is that the usability
    of TAs consisting entirely of cyber personalities depends on their representation
    of the overall target group in the real world. In other words, the critical question
    is whether the TAs have the capability of conveying the desired behavioural change
    in the overall population. This probability depends on many factors, such as the
    percentage of Internet users in the target population and cultural differences
    in the use and importance of the digital environment. These factors may be difficult
    to estimate reliably in advance. Further studies are needed to assess the real
    world usefulness of the theoretical approach presented here.


    To verify the theoretical approach presented in this chapter, the authors suggest
    three methods. The first would simply test the ability of this approach to deliver
    the desired behavioural changes in a TA. However, with any other psychological
    operation''s evaluation, the problem with this approach is that the causalities
    behind observed behavioural changes are very difficult to prove.


    The second approach would be to compare the results from two influence operations,
    performed on similar audiences but with different'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 194 9. Cyber personalities in adaptive target audiences


    TAA methods. The first method would be the more traditional model of seeking out
    identities through the cyber interface, while the other would suffice with the
    cyber personalities only. Comparing the results and the overall practicality (such
    as time consumed) of these methods would show whether or not human identification
    is necessary for satisfactory results. Conducting several tests with various percentages
    of internet access would yield additional information on the application of different
    methods. To have reliable results, the properties of the TAS would have to be
    known, which may present the greatest challenges of this approach. To make the
    test in laboratory conditions avoid the real world complexity of TAS, while tests
    with real audiences seem have clear cause and effect correlations.


    The third method would be to access data from an already conducted TAA and perform
    the TAA with cyber personality on the same TA. The challenge with this approach
    is that the conditions of the TA may have changed and the social networks may
    not be comparable.


    Disseminating and analyzing a cyber personality through the five layers in the
    way presented in this chapter may also include the benefit of recognizing bots
    and other algorithms. One suggestion for further studies would be to look at what
    features artificial personalities in comparison to humans in the five cyber layers
    and whether these are platform-specific. The lack of human qualities would ensure
    the identification of entities.


