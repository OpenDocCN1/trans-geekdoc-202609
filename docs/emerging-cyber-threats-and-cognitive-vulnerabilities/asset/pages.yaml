  md: '# Sociocultural approach to the Russian sense


    existence of a distinct object or space or a collective ''we'' (Schmidt, Teubener
    & Konradova, 2006, p. 14). Information is produced in Russian language and controlled
    within the ''RuNet community'' that provides a sense of belonging and has a significant
