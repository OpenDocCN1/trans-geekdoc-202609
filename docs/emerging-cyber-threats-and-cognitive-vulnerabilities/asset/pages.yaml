    # Information privacy


    With the rapid growth of ICT, accessing information became easy and available
    to almost everyone. This task especially with every security incident that happens
    in any part of the world; new regulation or governmental demands on accessing
    private information occur now and then.


    According to Westin (1968), information privacy is the ability to control the
    individual private information in which they have the full power on their information,
    to share it or not. It is considered one of the top ethical, legal, social and
    political issues of the information era Cho and Hichang (2010). Lauer and Wolfe
    (1977) stated that to understand privacy we must understand the concept of privacy
    from the individual view and also consider the social historical perspective.
    Four dimensions of information privacy have been identified by Smith et al. (1996),
    which are a collection, unauthorized use, improper access and errors. On the other
    hand, Solove (2005) found different dimensions which are information collection,
    information processing, information dissemination and'
