    # Reliosity


    Religion is a system of symbols which creates strong, extensive and permanent
    attitudes and motivation in people (Geertz, 1973). The attitudes and motivation
    lead to a diverse level of commitment to follow any religious teachings, which
    are called religiosity. Religiosity has no impact on individuals and results in
    a different effect on them. Accordingly, religiosity cannot be used as a measure
    by itself, but religiosity, which is the degree of commitment, practice, belief
    and acceptance, can be used as a measurement tool (Mukhtar & Butt, 2012), Khrain
    (2010) argued that religiosity is one of the powerful tools that can predict consumer
    behaviour.


    By looking at the literature, the focus shifts from religion to religiosity because
    of the ability of religiosity to measure individual''s commitment to a religion,
    which conveys with behaviour (McDaniel & Burnett, 1990); Schneider, Krieger &
    Bayraktar, 2011; Swimmerberghe, Flurry & Parker, 2011; Vitell, 2009; Wilkes, Burnett
    & Howell, 1986).


    McDaniel & Burnett (1990, p. 103) define religiosity as a belief in a God with
    a commitment to the set of principles for religion. Alongside, Worthingtonton
    et al. (2003, p. 85) claimed that religiosity is the degree of individual commitment
    and compliance to a certain religion value, practice and belief. These two definitions
    clarify the difference between religiosity and spirituality because spirituality
    engages in the exploration of ‘meaning, unity, connectedness to nature, humanity
    and the transcendent (Vitell, 2009, p. 156). Religiosity, on the other hand, grants
    faith, focusing on beliefs, attitudes and behaviours (Emmons, 2005; Vitell, 2009).
    Any person may carry a certain degree of religiosity, which makes it unique. However,
    it cannot be easily considered as a measurable variable (Abou-Youssef et al.,
    2011; Wilkes et al., 1986). Being a highly practiced person for a certain religion
    does not mean being a highly religious one because the practice sometimes gets
    mixed with the daily routine (Khrain, 2010). Researchers because there is no standardized
    scale to measure religiosity (Khrain, 2010).'
