    2013; Lasher & Baker, 2015) which have found equal victimization prevalence rates
    for males and females (Hinduja & Patchin, 2008; Tokunaga, 2010). Fewer studies
    have considered cyberbullying in adulthood or the workplace; a metaanalysis of
    victimization literature concluded no substantial evidence for gender differentiation
    (Lund & Ross, 2017). A multi-national study of 3500 participants aged 15–30 years
    found no age bias results were statistically more likely to be male and the most
    experience to be defamation of character and threats of violence (Nasi, Oksanen,
    Keipi, & Räsänen, 2015). Cyber-victimization has been demonstrated by Kowalski,
    Toth, and Morgan (2018) to continue after adolescence. Compelling results indicate
