    In a society where the limits of public and private players have become obscured,
    the risks are also increasing. Citizens should be able to trust decision-makers,
    authorities and so that they do not have to constantly think about what kind of
    digital footprints they have left behind in any department store control unit.
    As a single datum, separate information of human life is not significant, but
    if data are combined from different sources, the position of a citizen as a person
    of her or own life and knowledge may change significantly.


    # Conclusions


    As discussed above, digitalization and location-based technologies create opportunities
    but also threats to citizen''s privacy life. If political power relations change
    in a democratic society, public power may centralize, for example on the communist
    regime or for a dictator. How would the privacy-related information be used in
    different political environments? It is essential because the world order is in
    a turbulent state. Different types of extremism have increased their support.


    The need for a new type of standardized hybrid emergency response model reflects
    the following factors. It is necessary for confidence that citizens accept automated
    functions in public places. Legislation concerning privacy issues does not cause
    permanent obstacles to use sensing elements in hybrid emergency response model.
    It is necessary to rationalize organizational responsibilities for development
    of cybersecurity. A human is an individual with limited observation capability,
    and overlapping data transmission limits the the cooperation between PPDR authorities.
    Limited data transmission capacity prevents communication between the authorities.
    Preventive functions against cyberthreats in the emergency response model are
    an essential part of the overall security in situation awareness management and
    CIP.


    It is also important for the continuity management to create a confidential base
    between citizens and authorities. Confidential data cannot be leaked to outsiders,
    for example to the press. At present, the values of those Western worlds have
    been contrasted with the protection of overall'
