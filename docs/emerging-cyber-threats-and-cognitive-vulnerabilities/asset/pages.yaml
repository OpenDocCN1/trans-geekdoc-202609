    locus of control) or whether they have to rely on external forces (external locus
    of control). The locus of control appears to affect learning, motivation and behaviour.


    Persons with an internal locus of control feel that success or failure is due
    to their efforts or abilities. Alternately, individuals with an external locus
    of control are likely to believe that other factors such as luck or the difficulty
    of the task or the actions of others are the cause of success or failure. For
    example, users with external locus of control might not often take protective
    measures against cyberattacks due to their beliefs that Internet providers or
    the government is responsible for ensuring a safe Internet.


    Lack of control over a situation that is perceived as threatening or dangerous
    can give rise to emotional distress, fear and insecurity. Strong emotions on occasion
    lead to irrational behaviour (Sutherland, 2007) or equally strong reactions. These
    are all aspects that can influence how members of the public (psychological) and
    society generally (social) are impacted by an attack.


