    given the speed and complexity of these attacks, traditional methods of law enforcement
    in the securing and preserving of evidence are no longer adequate.


    Furthermore, Marion states in Marion (2010), because the Convention is largely
    symbolic, its long-term effectiveness must be brought into question. There are
