    # Method


    This study took place in Saudi Arabia and used the privacy concern model by Xu,
    Dinev, Smith & Hart (2011) and ROS as Essoo and Dbib (2010). Privacy concerns
    have been found to have an impact on behavioural intentions of users. Furthermore,
    other risks play a role in determining usage intentions shown by Xu et al. (2011).
    They used communication privacy management (CPM) to explain individual privacy
    concerns formation through a cognitive process involving privacy risk, privacy
    control and their disposition to value privacy. Individuals'' perceptions of institutional
    assurances affect the risk control assessment from information disclosure, thus
    being an essential component of privacy concerns. There is a dearth of studies
    linking privacy concerns and beliefs to self-disclosure, system adoption and use.
    To explore whether religiosity affects privacy concerns, and links to self-disclosure,
    we put forward the model as you see in Fig. 5.1 and came with 13 hypotheses (Table
    5.1).


    The initial questionnaire section with for eligibility was followed by the measurement
    scale of the two constructs, which are intrinsic ROS and CPM. The questionnaire
    scales have been adopted from previous studies to fit the research context. CPM
    was adopted from Xu et al. (2011), and intrinsic ROS was adopted from Essoo and
    Dbib (2010). The scales used seven-point Lik scale where 1 is ''strongly disagree''
    and 7 is ''strongly agree''. The participant ranged from 18 years to 60 years
    old. From the 509 participants, there were 279 males (54.6%) and 232 females (45.4),
    belonging to Muslim Sunni and being active social media users.


    To reach out a large number of participants, the data collected from questionnaires
    electronically distributed to active users in Saudi Arabia. The questionnaire
    was constructed following two groups with Islamic religion experts and consisted
