    # Findings


    Regional situation centres use different systems and therefore the same system
    can be used in two situations without cooperation with each other. None of the
    regional situation centres have direct contact with the Government Situation Centre,
    but the connections are handled through intermediaries. For rapidly evolving situations,
    access to the Government Situation Centres’, data connection should be arranged
    to the essential situation centres.


    As recent accidents have indicated, lack of human resources affects disaster recovery.
    PPDR actors cannot start operations if there is a human factor preventing the
    flow of information. Preventing domino effect after the disaster may be delayed.
    Recent violent acts at local and state level (from local to national level) have
    shown this to be a reality. The communication activities of Intermediaries have
    been one of the major problems in recent accidents. In Brussels, Belgium, federal
    police requested to close the metro, and the main railway stations did not reach
    the responsible chief of the railway police because phone networks were down.
    A request to close the railway station was sent to the responsible authority’s
    personal email instead of work mail. The responsible authority did not see the
    message until after the attacks (McLaughlin, Haddad, & Hume, 2016). The November
