- pgno: 191
  md: '# Military influence operations 177


    revolution. If military objectives can be achieved without use of force or accountability,
    the threshold for clandestine military influence operations is lowered. In this
    chapter, we argue that the emergence of the cyber domain within the information
    battles allows for intelligence gathering that may seem illegal, unethical or
    unimaginable today. It is, however, the duty of both the scientist and the soldier
    to look at the possible futures to prepare for them.


    In this chapter, we present the idea of cyber personalities as the target audience
    (TA) in addition to the concept of adaptive TAs. Following the introduction, the
    second section looks at cyber personalities from the viewpoint of influence operations
    and how cyber personalities can be found in Libicki’s five-layer framework (Libicki,
    2007) as presented by Sarteronen, Huhtinen, and Lehto (2016). The third section
    presents an idea of adaptive TAs for cyber personalities, followed by conclusion
    and discussion in sections fourth and fifth.


    # Military influence operations


    # Cyber domain as a battlespace


    The concept of influencing others is probably as old as the human nature. Similarly,
    militaries have always sought ways of influencing opponent behaviour to even the
    odds at the physical battlefield. New technologies and domains have always been
    adapted for military use, with the cyber domain being no exception. As was the
    case with the introduction of flight in the early 20th century, it can be expected
    that adapting to this new domain of military activity requires a review of the
    other domains as well. Thinking of how the introduction of the air domain transformed
    naval or ground war, one understands how thorough and long lasting the effects
    of digitalization in the future battlefields will be.


    As is typical with new phenomena, familiar terminology and concepts are used to
    understand the changing battlefield. Very often, however, old concepts eventually
    lack the explanatory power needed to understand the changing battlefield and will
    be replaced by new ones. The same goes for rules and laws used to govern human
    behaviour in conflict, both in domestic and international framework. Typically
    in the Western hemisphere, influence operations have been held in a supportive
    role, subordinate to the activities of the physical battlefields. War, even information
    war, is still mostly conceptualized by the realities of the physical battlefield,
    with the exception of emerging rules concerning cyberattacks and defence.


    The idea of militaries wielding weapons of information within the cyber domain,
    among the billions of daily civilian activities, is a frightening one. One argument
    is that militaries have no role in the cyber'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'domain at all, that the only role for a military is to remain as the ultimate
    watchdog in the physical world. This is, however, a choice every nation will make
    on their own, meaning that there will be a varying degree of military involvement
    in the goings-on of the cyber domain. The global reach of this interconnected
    domain means that within this operational theatre, there will be different national
    solutions, different roles for militaries and as there will be variation within
    the level of engagement and rules of engagement between various nation'' armed
    forces. The fact remains, that the various cyber threats need to be confronted
    by some appropriate means. It should be pointed out that the line between what
    is military and what is in the cyber domain is not always clear. As such, it can
    be concluded that unless there be a new Tallinn Manual concerning military influence
    operations in the cyber, for the time being the restrictions concerning military
    operations in the cyber are obfuscated at best.


    Ultimately, if advancing technologies will allow military operations’ targets
    to be achieved in the cyber domain alone, it is plausible to expect militaries
    to operate in the cyber domain much in the way they control the skies today, with
    technologies of intelligence, attack and defense. Although this idea may appear
    far-reaching, it can be argued that any technology that we can weaponized typically
    ends up being such, and thus the militaries should not prepare for today’s but
    for tomorrow’s wars. In the end, it only takes one actor to claim dominance in
    a military domain, forcing others to admit defeat or to engage in new frontiers
    and new weapons.


    # Target audience analysis in influence operations’ framework


    To look at the plausibility of military influence operations within the cyber
    domain, we examine the intelligence part of such operations, namely the investigation
    and selection of suitable audiences. This procedure is often called target audience
    analysis (TAA), within the framework of psychological operations (PSYOPS). As
    a reference for conduction of psychological operations, we use U.S. Field Manual
    3-001, Psychological Operations Tactics, Techniques and Procedures, which provides
    one example of the TAA process.


    According to FM3-05-301, TAA is a detailed and systematic process of selecting
    the most viable TAs that can be reached and influenced and whose behavioural change
    will effectively produce results that support the overall military operation (FM3-05-301,
    5-1).


    According to FM3-05-301, TAA seeks to answer five key questions:


    +   * What TAs will be most effective in accomplishing the Psychological Operations
    objectives

    * What are the reasons for the TA’s current behaviour?'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   * What are the best means of communication to reach the TA?


    +   * How can the TA be influenced to achieve the desired behaviour?


    +   * What are the appropriate criteria to assess changes in behaviour?


    As pointed out in FM3-05-301, for a set of messages to be effective, a TA typically
    needs to consist of a homogenous group of people with similar conditions and vulnerabilities.
    There are various ways of building these homogenous groups, such as looking for
    demographic or geographic features. Centres of gravity (people or small groups
    that have large degree of power over others) or key communicators or other high-value
    individuals (HVIs) are also desirable, although such TAs are typically small (FM3-05-301,
    5–3–54). These TAs can be most effective, regardless of their size size. In these
    situations, TAA should be more detailed than what is described in FM3-05-301.
    To understand and influence it is possible to gather far detailed information
    than it is from larger TAs, which are always more general in nature. When dealing
    with HVIs or small groups, the requirements for information can be very detailed.
    Taylor, Furnham, and Breeze (2014) have proposed six key dimensions for understanding
    and influencing a single individual. These elements are (1) culture, clan; (2)
    biography, family; (3) intelligence; (4) personality; (5) dark side of personality
    and (6) motivation. Most of the information in these dimensions can be extracted
    from the cyber domain.


    Once initial TAs have been selected, a more detailed scrutiny is applied, beginning
    with the conditions that the TA has to cope with. Conditions, according to FM3,
    are the life-affecting elements over which the TA has little or no control. In
    an ideal TAA, common conditions within the group lead to similar needs. These
    unfulfilled or perceived needs are manifested as vulnerabilities, as the TA''s
    desired to fulfil, alleviate or eliminate the needs as motivation to change behaviour.
    A successful TAA provides the most effective means of satisfying the TAs in ways
    that allow the psychological operation''s objectives to be reached (FM3-05-301,
    5–4–9).


    The TAA desired is built for a military purpose and requires the TAs to be approved
    by an appropriate command structure before executing the influence activities.
    Thus, a requirement of identifying the members of the TA is built into this process.
    This, in turn, is required to ensure only legal targets are engaged by the military
    to streamline the influence activities with other, typically kinetic activities.
    A feedback loop is also included in the process, in the process of setting impact
    indicators that are monitored to find out whether or not the objectives are being
    achieved (FM3-05-301, 5–18).


    As pointed out in Sartenen et al. (2016), the cyber domain is vast, fast and reciprocal.
    In a complex and constantly changing environment,'
