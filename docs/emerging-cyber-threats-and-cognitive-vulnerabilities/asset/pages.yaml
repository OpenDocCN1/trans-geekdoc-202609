    # Information exchange


    The exchange of information between the EU and the United States has been regulated,
    among other things, as follows: The European Commiss- sion and the US government
    reached a political agreement on a new framework for transatlantic exchanges of
    personal data for commercial purposes named the EU–US Privacy Shield. The European
    Commission adopted the EU–US Privacy Shield by July 2016 (European Commission,
    2016).


    The framework protects the fundamental rights of anyone in the EU whose personal
    data are transferred to the United States as well as bringing legal clarity for
    businesses relying on transatlantic data transfers.


    The EU–US Privacy Shield is based on the principles like obligations on companies
    which handle data. (a) The US Department of Commerce will conduct regular updates
    and reviews of participating companies to ensure that companies follow the rules
    they submitted to themselves. (b) Clear safeguards and transparency obligations
    on US government ac- cess: The United States has the EU assurance that the access
    of public authorities for law enforcement and national security is subject to
    clear oversight mechanisms. (c) Effective protection of individual rights: citizens
    who collected data have been missed under the Privacy Shield scheme will benefit
    from several accessible dispute res-olution mechanisms. It is possible for a company
    to resolve the complaint by itself or give it to the alternative dispute resolution
    (ADR) to be resolved for free. Citizens can go to their national pro- tection
    authorities, who will work with the Federal Trade Commission to ensure that complaints
    by EU citizens are investigated and resolved. The Ombuderson mechanism means that
    an independent senior official within the US Department of State will ensure that
    companies are properly investigated and addressed in a timely manner (European
    Commission, 2016c).


