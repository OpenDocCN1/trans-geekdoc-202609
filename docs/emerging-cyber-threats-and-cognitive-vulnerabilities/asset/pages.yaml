    # From location-based services to location-based intelligence


    A citizen’s smart device is quite easy to locate. International Mobile Equipment
    Identity (IMEI) number and SIM card with international mobile subscriber identity
    (IMSI) helps to track a mobile. Mobile phones transmit these numbers each time
    a call is made and when they ‘check in’ to the local base stations (Pettit, 2018).


    Police may use IMSI-catcher to encrypt a call. At that point the call is transmitted
    through an IMSI-catcher. It works like a fake base station. Law enforcement teams
    in the United States and Europe have used this technology to locate people etc.,
    nowadays criminals are deploying them (Langston, 2017). According to Shaik, Bgaonakar,
    Asokan, Niemi, and Seifert (2016), it has been shown that the vulnerabilities
    in LTE access network protocols lead to new privacy and availability threats to
    LTE subscribers.


    Customers are concerned about their privacy because location-based technologies
    allow mobile advertising networks to accurately send advertisements to maximize
    the effect of advertisement (Kini & Suomi, 2018).


    Retailers may use indoor/or outdoor navigation technologies to provide location-based
    services, using mobile ‘push’ notifications to provide appropriate advertisements.
    With this technology it is possible to provide appropriate, personalized marketing
    based on the consumer’s location. If customers or mobile users give permission
    (opt-in) to their trusted companies who brand, products and services they like,
    they send personalized advertisements when they are shopping (Yiu, Jensen, Møller,
    & Lu, 2011).


    Technologies are currently available to not locate the customers; they are also
    able to establish a history of a path by a typical customer during the day. Consumer-oriented
    organizations are concerned about how advertisement networks are able to locate
    and custom-deliver an advertisement to a customer or without the customer’s permission
    (Kini & Suomi, 2018; Metz, 2013). According to Nakashima (2018), AP investigation
    found that Google stored location data when ‘location history’ is turned off.


    New smartphone technologies combine markets and application providers to get their
    strategies to a new marketing area. As Kini and Suomi (2018) write, the big data
