- pgno: 133
  md: '# Theoretical concept: defensive realism


    nuclear disarmments, which may be unfolding in the current cybersecurity domain.
    International relations theories, particularly defensive realism, explain how
    and why security needs prompt cooperation between adversaries. Cooperation sought
    under these conditions, negative cooperation, is based on the need to minimize
    the risk of a direct conflict. Therefore, it is important to examine the United
    States, China and Russia''s cyberspace interactions. Are these states moving toward
    a global conflict, which could become a world war? Or are they restraining themselves
    and regulating the weaponization of cyberspace?


    This chapter explores the motives and conditions under which the United States,
    China and Russia are likely to cooperate on qualitative arms control in cyberspace
    to improve both their national and international security. The analysis focuses
    on the 20-year period spanning from 1998 to 2018. The premises of defensive realism
    serve as the theoretical background for the analysis... This analysis is based
    on Charles Glaser''s *theory* (1995, 2010), which explains the conditions leading
    to negative cooperation among potential adversaries.


    # Theoretical concept: defensive realism and cooperation in the cyberspace


    # Incentives for cooperation among rivals


    Security cooperation poses a challenge for international relations theorists.
    Harald Müller (2013) writes, ‘States opting for security cooperation one security
    asset to gain after which they believe helps them to provide better for their
    security: the collaboration with their potential enemies and the pursuant agreements
    and organizations.’ Cooperation among states with a common enemy is explained
    in classic or structural realism. The formation of alliances is addressed comprehensively
    by Glen Snyder (1984, pp. 461–95, 1997), Stephen Walt (1987) and Randall Schweller
    (1994, pp. 72–107). According to the constructivist approach, with shared values
    and interests tend to increase their cooperation efforts and security communities
    (Adler and Barnett, 1998). Robert Jervis (1985, 1999) has also explored in incentives
    for cooperation among states from the theoretical perspectives of realism and
    neoliberalism. Yet, neither these nor theorists can explain how potential adversaries''
    interests and perceptions prompt them to enter into security cooperation and self-reflection.


    Structural and offensive realist believe that as states compete among themselves
    for power, cooperation among states lacks meaning (Mersheimer, 2013; Waltz, 1979).
    During and after the Cold War, most'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 120 6. Avoiding a world war: rational motives


    realists ignored obvious displays of cooperation among adversaries. These displays,
    as the treaties on disarmament and the limitation of nuclear weapons between the
    United States and the USSR, reveal that cooperation between competing states is
    not only possible but also occurs frequently.


    Glaser challenges classical neorealistic assumptions on cross-border cooperation
    and even terms them ''unwarranted'' (Glaser, 2014, p.157). In his 2010 book Rational
    Theory of International Politics: The Logic of Competition and Cooperation, Glaser
    presents his own version of rational choice theory. His normative theory provides
    models of rational behavior and strategy, which he argues states should adopt
    (Glaser, 2010, p. 2). Unlike offensive realists, who claim the costs of cooperation
    are too high, Glaser asserts that the costs of confrontation are much higher and
    offers a theory of rational security based on policies of disarmament and cooperation.


    According to Glaser, the logic of the security dilemma does not suppose the confrontational
    natural nature of the international system (Glaser, 2010). When Wendt (1992),
    Glaser (1992) discusses the confrontational logic of anarchy (1992) which is irrational
    as it forces states to use their resources inefficiently, (e.g., by engaging in
    an arms race), increases the possibility of military conflict and reduces security.
    Therefore, Glaser proposes three theoretical additions to neorealism.


    First, he argues that confrontation is not natural in the international anarchic
    system. Glaser concedes that states are prone to compete to increase their military
    power, ''If military advantages are extremely valuable, then military disadvantages
    can be extremely dangerous'' (Glaser, 1995, p. 59). Yet, he adds that the fear
    of losing such cooperation could lead to:


    > Cooperation is valuable if it reduces the adversary''s insecurity by reducing
    the military threat it faces. Moreover, cooperation is valuable if it can reduce
    the adversary''s uncertainty, convincing that the first state is motivated by
    insecurity rather than greed.(Glaser 1995, p. 60).


    Second, Glaser writes that states are more motivated to strengthen security and
    military capabilities to seek power. Therefore, it is important to differentiate
    between defensive and offensive capabilities Defensive realism offers two considerations
    to states as they choose either a confrontational or a cooperative security strategy:


    First, which will contribute to its military capabilities for deterring attack,
    and for defending if defence fails? Second, appreciating the pressures created
    by anarchy and insecurity, the state should ask which approach is best for avoiding
    capabilities that threaten others'' abilities to defend and deter, while not undermining
    its military capabilities?(Glaser 1995, p. 60)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Theoretical concept: defensive realism 121


    While explaining possible cooperation, Glaser turns to the theory based on military
    capabilities and strategy. The balance between offensive and defensive capabilities
    is of great importance to strategic choice. Glaser asserts ''The defender''s power
    multiplied by the offensive-defence balance tells us much more about the defender''s
    prospects for maintaining effective capabilities than considering power alone''
    (1995, p. 62).


    The possibility of distinguishing offensive and defensive capabilities is very
    important to Glaser''s explanation:


    When offensive and defence are completely distinguishable, the forces that support
    offensive missions do not support defensive missions, and vice versa; when offensive
    and defence are not at all distinguishable, the forces that support offensive
    missions can be used effectively in defensive missions. Therefore, the extent
    to which military power can be disregarded, aggregating offensive and defence
    distinguishable, is important for answering a key question — whether defenders
    can avoid offensive-mission capabilities while maintaining defensive ones. (Glaser
    1995, p. 62)


    Third, a potential adversary should be informed about the motives and goals of
    security policy. Realists note that uncertainty increases uncertainty among states.
    A state seeking its adversary''s motives and goals should inform its adversary
    of its security goals. However, the international structure limits states'' abilities
    to communicate. An information vacuum further increases uncertainty about goals
    and tensions among states (Wendt, 1992). Glaser tackles this dilemma with an important
    variable: information. Glaser''s information variable is probable to rational
    international relations theory (Dingly, 2012). Information is defined as an awareness
    of an adversary''s motives that includes an understanding of how the adversary''s
    motives and goals are perceived.


    Glaser (1995) states that communication regarding nonaggressive motives is possible
    if states execute one of the three security policy forms: arms control, unilateral
    defense or unilateral restraint. These forms of security policy enable states
    to differentiate between states seeking military power.


    Glaser''s theory, however, lacks clarity concerning how states become informed.
    Does choosing strategic restraint contain enough information to an adversary?
    Schweller and Dingly note that the information variable does not evaluate changes
    in international politics due to the digital information revolution, media and
    online information leak scandals.


    Every day the National Security Agency alone intercepts and stores nearly two
    billion e-mails, phone calls, and other communications. In Rational Theory, however,
    information has nothing to do with the information age. Instead, it refers to
    beliefs about others'' intentions (Schweller, 2012, pp. 461–462).'
