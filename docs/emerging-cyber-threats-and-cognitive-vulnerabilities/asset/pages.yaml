  md: '# Cyber-physical systems


    # Tracking in the everyday life of citizens


    From location-based services to location-based intelligence


    # Research method and process


    # Findings


    Emergency situations


    # Discussion


    # Conclusions


    # References


    # Introduction


    European Public Protection and Disaster Relief (PPDR) services such as law enforcement,
    firefighting, emergency medical and disaster recovery services have recognized
    the lack of interoperability of technical systems limit the cooperation between
    the PPDR authorities. The military (MIL) and critical infrastructure protection
    (CIP) face similar challenges. Cyberattacks have increased in spite of formal
    integration in Europe and the world. Therefore, authorities need to respond to
    growing challenges. As major terror attacks, hybrid warfare and major accidents,
    for example in Belgium, France, Ukraine and the United States have shown, preparation
    for different kind of threats is challenging. Recent major accidents have indicated
    that lack of human resources affects disaster recovery.


    Due to the terrorist attacks that have occurred, public safety authorities are
    convinced that network traffic control is a good way to prevent acts that threaten
    peace of society, but it is only one way to protect the citizens or control the
    situation.


    There is an issue concerning privacy because most mobile user/users of web-based
    services or applications do not know where and to whom personal information is
    transmitted and how social media behaviour is analyzed for different purposes.
    It has been seen that data, which are collected from social media, are tradable
    goods that may violate an individual''s privacy.


