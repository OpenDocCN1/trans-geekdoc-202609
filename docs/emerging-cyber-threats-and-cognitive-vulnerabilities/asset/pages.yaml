- pgno: 49
  md: '# Effects 35


    With the growth and development of cyber arsenal, we could soon see technological
    weapons become the norm for terrorist groups. Cyberterrorism may present certain
    advantages over traditional terrorist terrorist tactics. The benefits of cyberterrorism
    over conventional terrorism approaches are discussed next.


    # Advantage


    The execution of attacks on information technology instead of traditional methods
    on real-world physical targets offers certain benefits. Electronic attacks, hacking,
    viruses and digital threats can be favoured by their affordability, remote accessibility
    and anonymity. According to Denning (2000), the advantage of cyberterrorism is
    that it can be conducted remotely, anonymously, as well less extensively as it
    does not require the purchase of explosives or sacrificing one''s life in a suicide
    mission.


    Gorge (2007) talks of the usefulness of cyberspace having no borders with physical
    control, the ''legal confusion'' making it easier for attackers, great impact
    and ability for target identification in cyberspace. It is often very difficult
    to determine which laws apply when cyberattacks span several jurisdictions. Furthermore,
    there is no singular controlling body that legislates in cyberspace which makes
    it quite difficult to monitor and enforce control. This makes the appeal of cyber
    hacking and exploits alluring to terrorists as their identity can be hidden and
    they have the ability to reach a wide audience remotely. Automation and the ability
    to reach a large number of targets are other advantages of using cyberspace as
    a platform to launch attacks. The dependence and widespread use of ICT has also
    become arsenal for adversaries to target and infiltrate.


    Another critical aspect to consider in how terrorism differs from cybercrime is
    to look at the effects and outcomes of the attack. The next section addresses
    the main effects of cyberterrorism.


    # Effects


    Another essential characteristic of cyberterrorism is the effect of the attack.
    Affecting crucial services may have a major impact on the civilian population.
    Disrupting core competences like air travel, manufacturing, health care and emergency
    facilities could have a detrimental effect on the lives of the public. Terrorist
    organizations seek to create publicity and cause devastation with their attacks.
    Similarly, cyberterrorists will target critical infrastructure of vital community
    services in order to create the biggest effect. Disruption of sectors, data theft
    and disclosure, infiltration'
