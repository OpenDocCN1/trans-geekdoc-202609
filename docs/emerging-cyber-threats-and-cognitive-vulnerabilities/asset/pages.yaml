    and statistics reveal the United States''s offensive–defense balance in cyberspace.


    The stated goals of the US Department of Defense demonstrate that the development
    of offensive and defensive cyberspace remains a top security priority. Consistent
    increases in the cybersecurity budget since 2015 confirm this priority. According
    to Admiral Rogers, former director of both the National Security Agency (NSA)
    and the US Cyber Command, the United States''s commitment to bolstering its offensive
    and defensive capabilities was encouraged by increases in activity and aggressive
    behavior in Russia, China, Iran and North Korea''s digital spaces (Gerden, 2016).


    In 2017, spending on offensive and defensive operations in the general defense
    budget increased by 6.7 million dollars. In 2017, the cybersecurity budget reached
    900 million dollars. Despite reductions to some defense budgets in 2018, cybersecurity
    remained a budgeted priority with an allocation of 971 million dollars (Office
    of the Under Secretary of Defense, 2017).


    The United States Cyber Command, the United States''s official cybersecurity force,
    was established in 2009. In 2017, the US Department of Defense assigned 133 units
    (approximately 5000 armed force members) to the Cyber Command. By the end of 2018,
    the Cyber Command is expected to have 6200 service members (DoD, 2017). A reform
    of the United States''s cyberforces in 2017 to distinguish between the functions
    of the Cyber Command and the NSA. The US Cyber Command is a military formation.
    Therefore, it requires isolated infrastructure to collect intelligence on (and
