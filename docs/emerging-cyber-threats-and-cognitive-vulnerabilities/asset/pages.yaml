- pgno: 11
  md: '# Preface


    Humans are adaptive creatures. Daily, we navigate a complex and changing social
    world. We have developed strategies to process information to allow us to identify
    what is important and what must be acted upon. This is not, however, something
    we do so flawlessly. In the face of vast amounts of information, we often rely
    on cognitive shortcuts and biases to make to quick decisions. We do so to meet
    our desires and as part of this interact with others who have their own agendas
    and biases. Technology both enhances and potentially changes these interactions
    in ways that we still do not fully comprehend. Fundamentally alters the ways in
    which we establish trust with others and creates new ways in which this trust
    can be exploited by malicious actors. Yet it also provides new techniques that
    can be used to empower individuals and organizations to protect themselves and
    their assets.


    This book explores the opportunities for cooperation in human interactions that
    arise in the cybersecurity space. The discussions contains range from individual
    factors that may predict cyber victimization to wider social determinants of cyber
    behaviour investigating religion, culture and nationality. It evaluates the challenges
    specific to investigating and altering behaviour and attitudes online, as fluid
    and dynamic identities that individuals may present in cyber space. It further
    investigates the link between online actions and offline impacts, including the
    social and psychological consequences of cyber attack and how evidence can be
    collected to in the prosecution of cyber offenders.


    Cybersecurity is a complex topic that requires interdisciplinary and transdisciplinary
    solutions, achieved through collaboration between stakeholders from different
    backgrounds. This publication contributes towards this approach through the inclusion
    of chapters from academics and nonacademics from a range of disciplines and professional
    contexts.


    Chapter 1. Factors leading to cyber victimization investigates the unique characteristics
    of online spaces that may increase the risk of victimization, including the individual
    and social factors that cyber aggressors focus on when selecting targets. Suggestions
    are made as to to promote policy changes and best practice to protect individuals
    from this growing cyber threat.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'xii


    Chapter 2. Cyberterrorism - the spectre that is the convergence of the physical
    and virtual worlds describes how technological advancements are used by individuals
    and groups to commit acts of cyberterrorism. In doing so it discusses the varying
    definitions of cyberterrorism and how this can be differentiated from other acts
    including cybercrime and hacking.


    Chapter 3. Closed, safe and secure – the Russian sense of information security
    provides an insight into the Russian sense of information security. Through use
    of examples it explores the use of historical, fear-based templates that promote
    the isolation rhetoric and celebrate the Russian approach to the Internet.


    Chapter 4. The social and psychological impact of cyberattacks beyond the technological
    and financial consequences of cyberattack to the social and psychological impacts
    that these can have. It evaluates how cognitive processes relate to public relations
    to malicious cyber events, focusing on incidents such as the WannaCry attack of
    2017.


    Chapter 5. The relationship between user religiosity and preserved privacy in
    the context of social media and cybersecurity outlines user behaviour is influenced
    by religious belief, examined through the examples of online privacy and the use
    of social platforms. A proposed model is presented and evaluated, with the findings
    discussed in relation to policy and practice implications.


    Chapter 6. Avoiding a world war: rational motives for negative cooperation among
    the United States, China and Russia analyse cooperation and conflict in cyberspace
    between the three potential adversaries of the United States, China and Russia.
    It examines the motivations of states, its material and the information that the
    state has the capabilities and intentions of other actors. A discussion is put
    forward on why cooperation between states is both possible and desirable.


    Chapter 7. Standard operating procedures for cybercrime investigation: a systematic
    literature review provides the overt and covert collection of evidence in order
    to secure successful prosecution of cyber offenders. It explores the differences
    between cyber and more traditional forms of crime, putting forward recommendations
    for new procedures that can be used to aid in the gathering of evidence in online
    and digital spaces.


    Chapter 8. Information and communication technologies: a curse or blessing for
    SMEs? examines the risk and compliance challenges for small to medium-sized enterprises
    that arise from information and communication technologies. It explores how, in
    order to make business transactions quicker and more efficient, SMEs may be exposed
    to new and serious cybersecurity threats.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Chapter 9. Cyber personalities in adaptive target audiences discusses the role
    of target audience analysis in influence operations, and the challenges that are
    encountered when applying this approach to cyber-space. It suggests how through
    the use of cyber personalities influence operations can be made more effective.


    Chapter 10. Privacy issues and critical infrastructure protection examines how
    the development of smart technology is changing the nature of critical infrastructure.
