    cyberterrorism, it would have to be sufficiently serious to incite terror that
    caused by violent physical attacks. Furthermore, Weimann (2004) asserts that the
    potential and the actual damage caused by cyberterrorism have been ignored. Various
    scenarios have been proposed to depict the potential chaos that could be if critical
    infrastructure were to be attacked (Squitieri, 2002). Terrorism has metamorphamorph
    from the traditional form to the cyber form of technology-aided terrorism as cyberterrorism
    (Samuel & Osman, 2014).


    Hacking tools are growing in sophistication and agitated terrorist groups may
    look for an innovative outlet for their political, religious or philosophical
    ideals. For cyberterrorists there is no shortage of new tools and technologies
    that have allowed them to commit their criminal acts virtually anywhere and from
    anywhere in the world (Subramanian, Liu, & Winterdy, 2016). Denning has stated
