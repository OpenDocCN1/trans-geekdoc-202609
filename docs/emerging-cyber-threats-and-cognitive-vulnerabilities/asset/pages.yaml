    traditional means of conducting TAA may not be fast and comprehensive enough to
    utilize the full potential of global reach, advanced automatic analysis methods
    and the potential of unleashing the power of masses of content producers. In addition,
    the anonymity by current application of digitalization is another challenge to
    the abovementioned process. TAs are not present as such presented by various aliases
    or avatars, behavioural patterns and behavioural effects. The requirement of influencing
