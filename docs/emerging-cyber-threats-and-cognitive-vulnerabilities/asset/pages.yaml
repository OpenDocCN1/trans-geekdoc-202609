    of the Minkomsvyaz in December 2012. ''Clean Internet'' aims to develop mechanisms
    for self-regulation of RuNet controlling the distribution of illegal content and
    creating a safe internet environment (positionania internet-sreda).


    Within the ''Clean Internet'' project a voluntary association ''Safe Internet
    League'' was established (Soldatov & Borogan, 2015, p. 298). According to its
    website, Safe Internet League is the largest and most reputable Russian organization
    fighting dangerous web content. It is a voluntary association of citizens devoted
    to helping law enforcement organizations. Its volunteers monitor the Internet
    for violations on behalf of law enforcement. The site posts detailed information
    on MVD Directorate K18 — the MVD component responsible for Internet crime and
    provides a direct email link for reporting violations. In the league''s view,
    violations include child pornography, pornography accessible to children, promotion
    of drug and alcohol abuse as well as violent or ''extremist'' content. Despite
    the prominent role actual social media. The league''s website audits its members
    based on the social networking sites they identify that contain malicious content.
    In many opinions, the league is actually law enforcement''s monitoring attempt
    to match social media’s expansion (Carr, 2011, p. 240–241; Gorham et al., 2014,
    pp. 189–190; Soldatov & Borogan, 2015, p. 202.).


