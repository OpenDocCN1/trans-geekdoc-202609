    # Introduction


    The concern over cyberterrorism could actually materialize has grown in recent
    years. Cyberterrorism refers to the convergence of cyberspace and acts of terrorism.
    This type of threat overlaps the physical and virtual domain with the risk of
    terrorists acting in the digital world of cyberspace. ''Since terrorists can use
    cyber tools as a tactic to advance their agenda, then cyber terrorism can exist.
    Unfortunately some scoff at the notion that terrorists can use cyber techniques
    to accomplish violent aims, let.'' (Paulose, 2013). There is little to suggest
    that terrorist groups have the inclination, let alone the capability, to launch
    a major cyberattack (Hardy, 2017). While, the concept is not new, may debate whether
    cyberterrorism is a real threat and what the label of cybersecurity actually refers
    to. This chapter aims to provide some background to where the term originates,
    what it denotes and its significance in this digital world we are living in.


    The world of terrorism is expanding. New weapons are emerging with cyberattacks
    having the ability to gain publicity, exposure and damage. As a spectre, cyberterrorism
    serves as a worrying threat about an imminent attack on a critical system, network
    or infrastructure that could cause wide-scale damage or affect numerous lives.


    The term cyberterrorism was coined over 20 years ago but continues to be a debatable
    topic due to its likelihood and impact. One camp asserts that terrorists will
    not use cyber techniques to carry out violent acts. The other camp tries to show
    that critical information and communications technology (ICT) systems are vulnerable'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Terrorism


    attack could have devastating consequences if targeted. Thus, the concept of cyberterrorism
    has mixed concerns.


    The first definition stemmed from Barry C Collin in the late 1980s in reference
    to the confluence of cyberspace and terrorism (Samuel & Osman, 2014). Over the
    years, the terms has grown in response to the risk of cyberthreats and the increased
    use of the digital domain. There had been growing concern that terrorists change
    their tactics, targets and weapons to the digital environment and this initiated
    the concept of cyberterrorism. Terrorist organisations have invaded cyberspace
    and made it a battleground. They no longer rely on military force such as weapons,
    armour and bombs only. Instead, they become more and more savvy, their strategies
    and tactics have technological orientation (Zerri, 2017). The possibility that
    terrorists use cyber tools as part of their arsenal has grown over the years.
    This chapter looks at clarifying the threat of cyberterrorism so as to analyze
    the underlying threat.


    In order to understand the concept of cyberterrorism, it is important to place
    in context of terrorism in general. A discussion follows on the concept of terrorism.


    # Terrorism


    Firstly, we look at unfolding the idea of terrorism to see how cyberterrorism
    fits it as a possible paradigm. Definitions of terrorism stem from the early 1970s
    and are still relevant and applicable today. In this section, various definitions
    of terrorism are discussed in order to place the concept of cyberterrorism in
    context.


    The United States still utilizes the definition provided in the US Code Title
    22 Section 2656f (d) since 1983 (United States Government, 1983). It states that
    terrorism refers to premeditated political violence carried out against non-combatant
    groups by sub-national or clandestine organizations or with the intention of creating
    an influence on their target. This definition emphasizes the use of pre-meditated
    violence stemming from political motivations that aims to influence a target group.


    Furthermore, the term international terrorism has also surfaced. With international
    terrorism, it targets citizens or territorial regions in more than one country.
    Terrorist groups operate in international terrorism when they have subgroups practicing
    across countries.


    Moreover, the key statutory concepts defined in the United Kingdom Terrorism Act
    of 2000 (United Kingdom Government, 2000) state that:


    +   (1) ‘Terrorism’ means the use or threat of action where:

    a. The action falls within subsection (2)

    b. The use or threat is designed to influence the government or to intimidate
    the public or a section of the public and'
