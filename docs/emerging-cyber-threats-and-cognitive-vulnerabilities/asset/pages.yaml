- pgno: 200
  md: '# Service layer


    The service layer consists of public and commercial digital services, with various
    social media platforms as the main point of psycho-logical operations (Sartonen
    et al., 2016). In the past few years, an increasing amount of studies have focused
    on understanding how actions in social media reflect our personality and behaviour
    in the physical world. There is evidence showing that personality traits relate
    to the content of status updates and choice of profile pictures on Facebook (Winter
    et., 2014; Wu, Chang, & Yuan, 2014), showing that people, adding a particular
    post or picture, also reveal more than they anticipate. Ikeda, Hattori, Asoh,
    and Higashino (2013) proposed a method for demographic estimation of Twitter users.
    Demographics such as gender, age, hobby, occupation and marital status were estimated
    by tracking the tweet history and clustering of followers/followees. Although
    the proposed model failed to recognize gender, it provides a good baseline for
    future research. Most of the content extracted from different social media platforms
    and digital services fails under semantic layer, there are unique and useful information
    from user alone. When analyzing service layer, it is beneficial to ask questions
    such as why this service exists, what does it do and what is its value proposition?
    Each public and commercial digital service exists for certain reason, and that
    reveal useful information about customers using that service.


    Furthermore, social networks may be analyzed to find and target fraudulent, artificial
    (such as social bots) or ''toll'' networks. A natural social network follows the
    shape of a certain type of random graph. Divergences from this shape indicate
    nonnaturalness: the greater the divergence, the higher the probability of fraud
    (Zhang, Lü, Wang, Zhu, & Zhou, 2013).


    It has to be noted that concerning social media, the semantic and service layers
    are often intertwined. What someone says, how it is said and to whom, what links
    are used, the overall behavioural pattern of the writer, etc., fall under different
    categories of semantic, network, demographic and other analysis types. The main
    difference, however, is the digital tools used for analyzing different aspects
    of a cyber personality.


    # Cognitive layer


    The cognitive layer is the ultimate target of influence operations in the cyber
    domain. This cognitive layer consists of rational and emotional human processes
    that direct the information flow through all the layers of the cyber domain (Sartonen
    et al., 2016). Successful influence affects this'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Cyber personalities as a target audience


    layer, producing a change in behaviour that can be observed through the data obtained
    from the other layers.


    Although we interact with digital representations of personalities on the Internet,
    behind social media account, there is typically still a person (although the number
    of bots and other algorithms is increasing). This person exists in the physical
    world and interacts with other entities in the physical world and the cyber domain
    — he or she is not just bits in cyberspace. This person has a unique personality,
    motivations and desires that directs her behaviour to keep and interaction with
    others. We may be overly extrovert or want to keep to oneself (McCraee & John,
    1992); similarly, one may be motivated by gaining power and dominance anything
    else or maintaining positive social relations at the expense of one’s owns needs
    (McCelland, 1988). To understand a personality we must understand the behaviour
    that he or she lives in and the personality and motivations that mediate behaviour
    in environment (Funder, 2006, 2009).


    Once the necessary characteristics of personality have been identified, this information
    can be used to create approach vectors and strategies for influence operation,
    which may include basic elements of influence psychology (Cialdini, 1984). For
    example, if we identify individuals as extroverts, we can use methods that exploit
    the principles of liking, reciprocity, social proof and scarcity (Alkuş & Temiz,
    2015; Uebelacker & Queriel, 2014). Similarly, agreeable individuals, in other
    words individuals who are amicable, compassionate and trust others (McCraee &
    John, 1992), are the most vulnerable to influencing attempts such as punishing
    and liking (Parrish, Bailey, Courtney, 2009). They are also the most vulnerable
    to influence methods using the principles of authority, reciprocity and liking
    (Alkuş & Temiz, 2015).


    On the other hand, individuals who are identified as highly conscientious tend
    to follow safety and security regulations (Darwish, Zarka, & Aloul, 2012; Parrish
    et al., 2009) and as such are less likely to react to influence attempts that
    try to make break these regulations. However, it has been suggested that conscientious
    individuals by reciprocity, vulnerable to influence methods using principles of
    authority, commitment, and consistency (Alkuş & Temiz, 2015; Uebelacker & Queriel,
    2014).


    Cultural aspects, identified through demographic and geographic data in addition
    to behavioural information, can also indicate successful means of influence. For
    an example, Orji (2016) demonstrated that collectivists and individualists vary
    with respect to their responsiveness to influence. For individuals living in a
    collective culture authority, reciprocity, consensus and liking-based influence
    seems to be somewhat more effective than individuals living in individualistic
    cultures (Orji, 2016).


    Although correlations between data from cyber domain and individual aspects such
    as personality have been confirmed,'
  merge: -1
  img_proc: true
