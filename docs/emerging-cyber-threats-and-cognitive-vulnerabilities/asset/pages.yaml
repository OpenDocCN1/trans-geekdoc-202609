  md: '# Introduction


    Humans always need to develop friendships, intimate relationships and the ability
    to argue or engage in sexual activity in private (Rachels, 2017). If this information
    is leaked, it might affect the individual well-being, dignity or cost them more
    than that (Etzioni, 2017).


    Online privacy is one of the major problems for internet users (LaRose & Rifin,
    2006, Lwin & Williams, 2003). It has attracted much of research attention, particularly
    in the online and e-commerce settings The past studies mainly focus on the technological
    aspects of privacy issues, with minimal light shed on the individual behaviours
    or views of privacy.


    Although privacy is a right that all should protect, have yet individual interpretation
    of the scope and extent of privacy made it difficult to investigate the issues.
    In addition, information and communication technologies (ICTs) change the nature
    of privacy. With the excessive use of search engines and the access to, individual
    privacy concerns have increased mainly in improper access, use and manipulation
    of personal information (Moor, 1997; Wilford, 2004).


    Studies into information privacy have been conducted in corporate and commercial
    environments (Dinev & Hart, 2006; Smith, Milberg & Burke, 1996), while in recent
    years the focus has shifted to individual privacy levels (Saridakis et al., 2016).
    Surveys showed that online privacy concerns are the main reason for not using
    the internet or e-commerce (Metzger & Doctor, 2003). In the information society,
    online privacy became an international human rights issue (Smith et al., 1996).
    This chapter will look at the literature of online information privacy and its
    relation to five constructs, technical, behaviour, companies, social network and
    religion, which affect the cybersecurity. Also, it will explain how the individual
    religiosity affects the user privacy, which in return has impact on the cybersecurity
    in general.


    # Cybersecurity


    Cybersecurity entails the activities of protecting data and information systems
    such as applications, data centres, databases, computers and networks. Cybersecurity
    should be undertaken using the appropriate technological and procedural security
    measures. Organizations use technological solutions, antivirus software and firewalls
    to protect computer network systems and personal data (Wall, 2008). However, this
    is insufficient because cyberterrorists keep despite multiple ways to commit the
    crime that superside the ability of these security measures. Besides implementing
    cybersecurity infrastructure, it is vital to educate the population on how to
    use it appropriately. There is a need to integrate cyber safety and cyber ethics
    in the educational process right from the start.


    Most cyberattacks are indiscriminate and automated and tend to exploit the vulnerabilities
    instead of targeting certain organizations. In'
