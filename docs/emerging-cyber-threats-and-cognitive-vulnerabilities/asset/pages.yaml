  md: '# 10 1. Factors leading to cyber victimization


    unique characteristics which are generally under researched in the digital world
    are unprecedented. In traditional and cyberbullying research, there are four categories
    of involvement; the victim, the perpetrator, the non-involved and the bully-victim
    (Kowalski, Limber, & Agatston, 2012; Olweus, 1993; Wong, Chan, & Cheng, 2014).
    The latter category entails a victim who also engages in perpetrator activity
    and is generally the minority group with reported low prevalence rates (Lovegrove
    & Cornell, 2014; Nansel et al., 2001). However, in cyberbullying the prevalence
    for cyberbullies who are also victims of cyberbullying is much higher (Mishna,
    Khoury-Kassabri, Gadalla, & Daciuk, 2012; Schultze-Krumholz, Schultz, Zagorsc,
    Wölfer, & Scheithauer, 2006), with strong evidence to suggest the bully-victim
    role is the majority group in comparison to the perpetrator and victim groups
    (Brack & Caltiano, 2014). Moreover, a meta-analysis of 131 studies by Kowalski
    et al. (2014) highly depicts cyberbullying perpetation as a leading factor for
    cyber victimization, clearly framing the impression that individuals who bully
    others are also victimied themselves. Unfortunately, despite the clear importance
    of the role, yet there are few, empirically tested assumptions around the cyber-victim
    role.


    The volume of reported bully-victims within cyberbullying has been attributed
    to the impulse to retaliate, as for defence of (Jacobs, Goossens, Dehue, Volink,
    & Lerner, 2015; Kowalski & Limber, 2007). By responding to an act of cyberbullying,
    a victim attempts to reduce the negative experiences caused by the original perpetrator
    and regulate their emotions (Frey, Pearson, & Cohen, 2015). Research also indicates
    that victims of traditional bullying are more likely to see revenge within the
    online environment and become a cyber (Smith et al., 2008). Mishna et al. (2012)
    propose a combination of two characteristics which contribute to the ease of being
    a bully-victim, the efficiencies and accessibility of ICTs, occurs that facial
    expressions, body language or tone heard in speech (Ang & Goh, 2010; Suler, 2004).
    It may be easier to retaliate online in comparison to face to face, so more if
    the perpetrator is larger in size and strength. This explanation could be applicable
    for cybervictims who are not retaliating but are perpetrating for other, unknown
    reasons. However, what is known that the online world can influence individuals
    to behave in a manner that is different to their behaviour in the online (Suler,
