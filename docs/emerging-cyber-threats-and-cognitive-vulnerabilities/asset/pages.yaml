    # Factors leading to cyber victimization


    The purpose of this section is to consider what a victim of cybercrime or cyberthreat
    may look like in terms of susceptibility. By doing so, vital insight and understanding
    of cyber victimization can be developed whilst considering potential profiles
    of victims of cybercrime. The concept of cybercrime is vast and there are various
    different forms of cyber victimization. A crime data report by the City of London
    Police (2016) identifies that victims of cyber-dependent crimes such as spreading
    of viruses, malware or hacking having no gender bias are more likely to occur
    to victims within the age bracket of 40–49 years. The data report also outlines
    the age group of 60–69 years being more likely to be victims of cyber-enabled
    fraud, with no gender bias. Analysis of the British Crime Survey by Reynolds (2013)
    upholds the older generations being more susceptible to online fraud, finding
    miles be more vulnerable. Alternative findings from research results, authority
    reports and surveys conducted by ICT companies such as Norton or Microsoft are
    common. However inconsistencies have been attributed to lack of reporting unlawful
    crimes, disparate perceptions by the public of cybercrime and reports to alternative
    bodies such as Internet service providers or website administrators (McGuire &
    Dowling, 2013; van der Wejer, Leukfeldt, & Bernasco, 2018).


    There is a great deal of literature concerning victims of online sexual harassment.
    Current research suggests women are far more likely to experience sexual harassment
    in chat rooms, and online sexual harassment, which includes requests for images
    and pornographic material (Henry & Powell, 2018). The approximate age group of
    18–24-old females has been suggested to be the most likely to be harassed online
    (Lindsay & Krysik, 2012; Pew Research Centre, 2014). An extensive qualitative
    and quantitative collaborative project across Hungary, Denmark and the UK found
    that females aged 11–17 years were more likely to experience sexualized online
    bullying and unwanted sexualization, increasing the probability of a negative
    outcome for young and older females (ProjectShame, 2017).'
