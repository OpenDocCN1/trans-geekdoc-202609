- pgno: 73
  md: '# Fear-based template for the isolation rhetoric


    Currently Russia has three different domains types:.ru,su, and .pdf (stands for
    Soviet Union). In the Russian press, Cyrillic domain was celebrated as ‘the end
    of the Latin script’s domination of the internet’ (Nocetti, 2015, pp. 121–122).
    Western commentators saw this leading towards segregated, heteric Russian Web
    that undermines the global spirit (Singer & Friedman, 2014, pp. 252–253; Vargas-Leon,
    2016, pp. 175–177).


    Consequently, the original meaning of RuNet is that the content of websites is
    available in Russian, i.e. it the Russian language community on the Internet (Schmidt
    et al., 2006, p. 15). A sense of security is created by looking at what is common
    to the group, how one can find the best way to relate to others. The Russian sense
    of information security begins in the linguistic therefore offered by RuNet, in
    sharing an understanding of the world with other Russian speakers.


    Togetherness brings safety but it also offers a solid ground for self-attained
    isolation, especially if there is a shared historical experience that reinforces
    the ‘withdrawness’. In the following we present the historical contextualization
    of the Russian sense of information security.


    # Fear-based template for the isolation rhetoric


    As noted earlier, in the Russian approach, information space is used by ‘other
    countries’ and hostile forces for the destabilization of Russia. This kind ‘besieged
    fortress’ (osazhdanna krepost) mentality characterizes Russian thinking for decades
    (sees, for example, Heller, 1988, pp. 108–109; Trenin, 2016, pp. 19, 36–39). It
    follows the very same fear-based template – the enemy is plotting to circle Russia,
    invade and overthrow the Russian political system – on land, sea, air, and now
    in the cyber/information space.


    Fear cannot exist without a cause to be frightened of (cf. Heller, 1988, pp. 99).
    After the Russian Revolution of 1917, the Soviet people were deliberately to think
    of themselves as being surrounded by enemies, the ‘imperialists’, who would crush
    them if they could. The perception of ‘enemy’ has been repeatedly deployed, to
    mobilize against actual external danger, and also to justify the struggle against
    a supposed enemy on domestic ground (Fateev, 1999, pp. 102–104; Solomesch, 2001;
    Gudkov, 2005, pp. 14–15).


    Lev Gudkov (2005) has developed a so-called ‘theory of an enemy’ where the main
    function of enemy is that the enemy represents a threat to the very existence
    of the group, e.g. to a society or an organization, to any kind of group that
    identifies itself as a subject (Gudkov, 2005, p. 13). The group can either defend
    or hide itself from the enemy, escape or defeat the enemy. In any case, the enemy
    mobilizes all the members of the group,'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'creates solidarity and unity inside the group that guarantees security and
    saves the group from destruction (Gudkov, 2005, p. 14). According to Gudkov (2005,
    p. 42), ‘enemies’ were one of the key factors in the formation of Soviet identity.
    The totalitarian propaganda focussed on producing two metaphors – ‘the construction
    of a new society’ and ‘the formation of frontline’ (Gudkov, 2005; p. 42).


    In the contemporary Russian information thinking can be seen reflections of the
    Soviet type ‘enemy discourse’ – ‘the construction of a new society’ and ‘the formation
    of frontline’. As noted earlier, the Russian Information Security Doctrine implies
    that the traditional Russian spirit and moral values are in danger (Doktrina,
    2016). The content of websites is a threat to the Russian people and must be tightly
    controlled for their own protection. Moreover, there exists a big concern of the
    Russian network’s dependence on the global infrastructure and how the Internet
    ‘can be switched off’ from outside of Russia’s borders. The Ministry of Digital
    Development, Communications and Mass Media (Minkomsvyaz) has claimed that Russia
    owns its own systems should its Internet segment cut off from the world if, for
    instance, Russia could face a national emergency, such as military action or serious
    protests (Golitsya & Protokenko, 2016; Minkomsvyaz, 2016; 2017; Vargas-Leon, 2016,
    p. 175). Furthermore, there is a persistent ‘rumour’ in the Russian ‘information
    space’ that if Russia would occupy, for instance, any European country, all Russian
    Internet connections would be disconnected in 24 h (Nazarov, 2016; Rozhkov, 2016).


    Here both the psychological and technical lack of control is represented as the
    origin of threat and a source of insecurity and disorder. The authorized rhetoric
    emphasis that the Russian ‘unified information space’ is controlled outside of
    Russia. Russia could end up in the state of not knowing, but Russia cannot be
    in the state of not knowing. As a result, this perceived lack of control leads
    to rhetoric where everything needs to be controlled, i.e. Russian does not manage
    to the outcomes of future events without being able to control, and if needed,
    to close its own network. ‘unified information space’ and the development of domestic
    technical solutions independent of the hostile world outside of Russia.


    # Celebrating and awarding the ‘Russian way’ of doing things


    As noted earlier, RuNet is a relatively closed online environment that is based
    on the Russian language. Nevertheless, RuNet refers not only to the language but
    also to the ‘Russian way’ of doing things.


