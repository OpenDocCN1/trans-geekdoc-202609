    with friends, associate and the wider world and thereby impart a wealth of information
    through social networking sites, e.g., Twitter, Facebook, blogs, etc. Whilst this
    chapter considered this methodology as a means of keeping watch on those you know,
    a similar process can be adopted by the police to identify the locations, associates
    and activities of those involved in organized crime. For example, Ali (2014) proposes
    an experimental framework to discover and predict suspicious messages that are
    sent via social networking sites as a means of identifying the threat activity
    and the offender''s details. This framework is based on ontology-based information
