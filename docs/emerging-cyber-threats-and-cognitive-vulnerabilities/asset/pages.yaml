    This chapter presents an approach for conducting a systematic literature review
    for investigating and gathering evidence for cybercrimes that is based on utilizing
    traditional policing techniques. The aim is to identify any shortcoming in existing
    techniques and identify new opportunities that can be used in the investigation
    of cyberimes.


    Therefore, the following questions are sought to be answered in relation to the
    covert and overt methods used to investigate cybercrime:


    +   - Techniques – What traditional techniques can be adopted to investigate cybercrime?
    What new techniques need to be adopted?

    - Policy/strategy – What are the existing policies/strategies for tackling cybercrime?
    What are their shortcomings?

    - Legislation – What legislation exists for traditional surveillance? Can this
    legislation be used for cybercrime investigations and prosecutions?

    - Best practice – What best practice exists in the investigation of cybercrime?
