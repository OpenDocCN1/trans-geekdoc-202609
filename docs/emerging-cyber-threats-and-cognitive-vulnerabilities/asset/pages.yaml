  md: '# Introduction


    Over recent years, there has been a large increase in the use of computers, tablets
    and mobile phones with their users being much more active in buying and selling
    items online and for the use of social networks (Laudon, Traver, & Elizondo, 2007).
    According to the Office for National Statistics (2014), 38 million adults (76%)
    in Great Britain accessed the Internet every day, 21 million more than in 2006,
    when directly comparable records began. Access to the Internet using a mobile
    phone more than doubled between 2010 and 2014, from 24% to 58% and 74% of all
    adults bought goods or services online, up from 53% in 2008 with clothes (49%)
    being the most popular online. This massive increase in the use of the Internet
    and the growth of the digital economy led to advancements for society but has
    also created new areas of threat and risk. Increasingly, the Internet is being
    used to facilitate a new avenue for crime (McGuire, 2013). Cybercrimes are generally
    considered falling into one of two categories (Home Office, 2010):


    +   (i) new offences committed using new technologies, such as hacking or breaking
    into computer systems to alter data, offences against computer systems as dealt
    with the Computer Misuse Act 1990 (Legislation.gov.uk, 1990),

    (ii) old offences committed using new technology, as the transfer of illegal images
    or fraud where networked computers and other devices are used to facilitate the
    commission of an offence.


    Irrespective of the category of the cyber offences, the proliferation of mobile
    devices and computers has not only resulted in an increase in the number of cyber-related
    crimes but most traditional crime scenes now have having some form of digital
    evidence (McGuire, 2013). This growth of offences and increase in devices has
    afforded an opportunity for the police to access large amounts of new data which
    can assist in the investigation process (Bell, 2002). However, this large volume
    of data has not been matched by the reporting of cyber offences. Companies are
    often reluctant to report breaches or attacks for reputational and economic reasons
    (Richards, 2009). The large volume of data and the lack of reporting having led
    to an illusion that those involved in cybercrime are unlikely to be identified
    and prosecuted. The National Crime Agency believes this applies to those involved
    in organized crime as they perceive this to be a low-risk, high-yield activity
    (National Crime Agency, 2015).


    Various techniques and policies have been introduced by police and government
    agencies across the world to combat this growing cybercrime trend. For instance,
    the UK Government produced its contest paper: the'
