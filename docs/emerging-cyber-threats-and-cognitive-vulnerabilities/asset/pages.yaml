    of view of data exploitation in Internet marketing. Advertisers try to focus on
    services and products more efficiently for the right target audience. Location-based
    services rely on a combination of technologies to pinpoint the location of a user
    with contextual data to provide more value to a mobile user. Geo-targeting or
    Geo-fencing with Wi-Fi, cell towers and beacons create a privacy-restricting advertisement
    circuit that aims to influence consumer behaviour. How can the need for CIP to
    be understood in this context? The question is not simple because every person
    abandons their privacy using smart devices. It does not always seem to matter
    whether or not a smartphone user is aware of the data ''leakage''. For example,
    when introducing a smartphone a user accepts many things that are required to
    make the smartphone work properly. If you do not give permission to provide privacy
