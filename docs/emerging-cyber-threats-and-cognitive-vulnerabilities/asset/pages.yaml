- pgno: 253
  md: '# # Emerging Cyber Threats\sand Cognitive Vulnerabilities


    Edited by Vladlena Benson and John McAlaney


    Humans are adaptive creatures. Daily, we navigate a complex and changing social
    world. We have developed strategies to process information to allow us to identify
    what is important and what must be acted upon. Technology fundamentally alters
    the ways in which we establish trust with others and creates new ways in which
    this trust can be exploited by malicious actors. Yet it also provides new techniques
    that can be used to empower individuals and organisations to better protect themselves
    and their assets. This book explores the opportunities for conflict and cooperation
    in human interactions that arise in the cybersecurity space.


    *Emerging Cyber Threats and Cognitive Vulnerabilities* contributes to this dynamic
    and fluid topic using contributions from academics and non-academics from a range
    of disciplines and professional contexts.


    # Key Features


    +   - Explains the individual and social factors that predict the actions of actors
    within the cybersecurity space

    - Explores the risks and benefits of information and communication technology
    for organisations and SMEs

    - Discusses the growth of interconnectedness and the conflict this creates between
    the desire for privacy and the need for security

    - Investigates how data can be used to both predict cybersecurity incidents and
    to provide the evidence need to bring about prosecution of malicious cyber actors


