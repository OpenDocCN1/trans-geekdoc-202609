  md: '# 30 2. Cyberterrorism – the spectre that is the convergence


    +   c. The use or threat is for the purpose of advancing a political, religious
    or ideological cause


    +   Action falls within this subsection if it:

    a. Involves serious violence against a person

    b. Involves serious damage to property

    c. Endangers a person''s life, other than that of the person committing the action

    d. Creates a serious risk to the health or safety of the public or a section of
    the public or ne. Is designed to seriously interfere with or seriously to disrupt
    an electronic system


    +   (3) The use or threat of action falling within subsection (2) which involves
    the use of firearms or explosives is terrorism whether or not subsection (1) (b)
    is satisfied


    Furthermore, Ruby (2002) has emphasized three critical aspects in the definition
    of terrorism and will be discussed next. Ruby looks at the motivation and the
    source of the attacks to indicate reasoning and operation of terrorists.


    The first aspect that Ruby (2002) looks is that terrorism must have a political
    motivation. In this way, violent acts like robbery, homicide or kidnapping that
    are carried out for personal or criminal goals do not constitute terrorism. The
    social and psychological reasoning behind such personal and criminal acts differ
    from terrorist goals.


    Secondly, Ruby (2002) indicates that the focus of terrorist acts is non-combatants.
    Non-combatants denote civilians who do not belong to the military services or
    are involved in hostile military operations. However peacetime (For example, On
    June 116, the US Air Force housing complex in Khobar Towers in Dhahran, Saudi
    Arabia, was struck by a terrorist truck bomb.)


    Thirdly, Ruby (2002) states that sub-national groups or clandestine agents execute
    terrorism. Therefore, political violence caused by nation-states is not considered
    terrorism. Ruby expands this point by explaining that during declared war or announced
    conflict there is an expectation of attacks, which will most likely be on industrial
    or military complexes. However, violent attacks from clandestine groups are usually
    random and have a crippling effect on non-combatants.


    In addition, terrorism results in fear not only the victim but also the audience
    unrelated to the victim. Furthermore, terrorism can also occur through the threat
    of violence, with any actual act of violence as it creates fear of a possible
    attack. This generation of fear is a key aspect in the concept of terrorism.'
