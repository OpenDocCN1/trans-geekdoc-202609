    # Examples of cyberattacks


    Cyber threats include denial of service (DoS), unauthorized vulnerability, botnet
    command and control, data exfiltration, data destruction and physical destruction
    via alternation of critical software/data. These attacks can be initiated and
    maintained by a mixture of malware, social engineering or highly sophisticated
    advanced persistent threats (APTs) that are targeted and continue for long periods
    of time. Channel jamming is one of the most efficient ways to launch physical-layer
    DoS attacks, especially for wireless communications (National Institute of Standards
    and Technology, 2014).


