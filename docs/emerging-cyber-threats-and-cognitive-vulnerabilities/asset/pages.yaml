- pgno: 198
  md: '# Physical layer


    The physical layer includes all the physical devices and networks of the cyber
    domain (Sartenon et al., 2016). For example, mobile devices with location services
    double as surveillance assets, and combined with the information provided by digital
    maps, they can provide constant information about the location of a physical identity.
    The same applies to network topologies and switching diagrams generated by the
    virtual identity of a cyber personalità. With a long enough surveillance time,
    and that the user keeps the location services on, this reveals geographic information,
    behavioural patterns and even lifestyle choices. Where a cyber personality lives
    and works, how many hours, which stores are visited daily or weekly, which recreational
    locations the cyber personality visits, etc. can be established with information
    from the physical layer.


    Conversely, when provided a physical trajectory of a cyber persona as well as
    the corresponding service or semantic level activities, it is possible to analyze
    whether there are any discrepancies, omissions or conflicts between the levels.
    This could point to possible fabrication or a fraud-ulent personality belonging
    to an artificial construct. For the cyber personality to be convincing, the location
    information needs to correlate with the personality''s activities.


    # Syntactic layer


    The syntactic layer consists of the software that operates the devices of the
    physical layer (Sartenon et al., 2016). The corresponding cyber personality aspect
    is a virtual identity: a local user account on a computer or device. In other
    words, once a cyber personality starts using a new device (computer, mobile phone),
    a virtual identity has been created in the syntactic layer. A single virtual identity
    can access to multiple network identities, such as e-mail addresses or cloud-based
    user IDs, and can thus be the means of connecting multiple network identities
    to a single cyber personality. Linking a physical device, such as a computer on
    a campus or in a working place, to a virtual identity also provides demographic
    about the physical identity of a cyber personality. The browser used by the cyber
    personality is also a good source of information. It can leave traces of past
    browsing and other information (such as user agent and operating system) (Wang,
    Lee, & Lu, 2016).


    Again, conversely, supposing we have established a possible connection between
    the physical as well as the virtual identities of a cyber personality, we can
    assess the likelihood of the connection being real by comparing the information
    on both levels. The network usage pattern as expected and does it correspond with
    the physical trajectory? If there are'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Cyber personalities as a target audience


    discrepancies, it is possible that the cyber personality is fraudulent, such as
    an automated social media bot that not utilizing a browser and is only focusing
    on application programming interface (Chu, Ganievchio, Wang, & Jajodia, 2012).
    Discrepancies can also occur if a cyber personality uses different techniques,
    such as encryption (Gupta, Gupta, & Singhal, 2014) and TOR network (Haraty & Zantout,
    2014), to avoid detection.


    # Semantic layer


    The semantic layer consists of data and information provided by the cyber personalities
    (Sartenon et al., 2016). This information includes, text and audio files that
    people use to communicate and share their views of the world. The semantic layer
    in many cases is the most useful in our behaviour and interaction with others
    (Mehl, Gosling, & Pennebaker, 2006). Along with Facebook, other social media platforms
    such as Twitter, VKontakte, Renren and Weibo updates provide a great deal of information
    about individuals and their personalities. To illustrate this, Qiu and colleagues
    named their article ‘you are what you tweet’, as they also showed that some of
    the content that they analyzed was more specifically related to gender and age
    than personality (Qiu, Ramsay, & Yang, 2012). More recently, Pandya, Oussalah,
    Monachesi, Kostakos, & Lovén (2018) further studied Twitter user age prediction
    by also previously overlooked contextual information.


    A significant portion of behaviour research in the past years has focused on personality
    (namely Five Factor Model). Personality-related information can be extracted from
    text-based and online social media information (Tskhay & Rule, 2014). For example,
    extroverted people use positive words more often, whereas the use of positive
    words is negatively correlated with neuroticism (Pennebacker & King, 1999: Yorkoni).
    In addition to personality traits, factors such as ethnicity, religion and political
    views, intelligence, happiness, use of substances, parental separation, age and
    gender have been assessed from social media inputs (Kosinski, Kholi, Stillwell,
    & Graepel, 2013), as well as dysfunctional dispositions and stress (Akhtar, Winsborough,
    Ort, Johnson, & Chamorro-Premuzic, 2018; Kandias, Grizalis, Stavrou, & Nikolous,
    2017). In a similar manner, criminals behind digital personas can be tracked using
    vast amounts of data sets from social media feeds by using a natural language
    processing system and combined with risk assessment (Symonenko et al., 2004).
    It is also possible to perform sentiment analysis on Twitter feeds. Along with
    this analysis, devices and other entities can be extracted from the data set (Saif,
    He, & Alani, 2012).'
