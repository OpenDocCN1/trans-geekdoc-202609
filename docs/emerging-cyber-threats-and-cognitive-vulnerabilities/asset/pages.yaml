  md: '# 74


    # 4. The social and psychological impact of cyberattacks


    Conclusions 89


    References 89


    Further reading 92


    # Introduction


    The impact of cyberspace is undeniable. It has provided a platform for instantaneous
    communication, commerce and interaction between individuals and organizations
    across the globe. Cyberspace has grown in prominence, however, unfortunately so
    too the number and variety of cyberattacks (Verizon, 2018). Cyberattacks are defined
    here as events which compromise the integrity, confidentiality or availability
    of a system (technical or sociotechnical). These attacks range from hacking and
    denial-of-services (DoS) to ransomware and spyware infections and can affect everyone
    from the public to the critical national infrastructure of a country (Norse, 2018).
    In this article, we will examine this topic of cyberattacks from a more of social
    and behavioural science perspective, with the aim of exploring the social and
    psychological factors and impacts associated with these attacks.


    Research has shown that members of the public are more likely to respond to the
    effects of a cyberattack than the attack itself (Gandhi et al., 2011; Minei and
    Matsuzi, 2011). One example of this is a cyberattack where malware affects a national
    power station causing the hundreds of thousands of citizens to be power. Here,
    the attack, that is, the malware infection, may not worry individuals (the public);
    they will be more concerned about the effect, that is, being without power, thereby
    having no heating, ability to prepare food and so on. There are two key areas
    of impact that we aim to consider and provide an overview of the current research
    and thinking; these are the social and psychological (emotional and behavioural)
    impacts. The social impact of a cyberattack refers to people''s daily lives and
    widespread issues such as anxiety or loss of confidence in cyber or technology.
    Psychological impact can be informed by social impact and can include more personal
    aspects such as an individual''s anxiety, worry, outrage, depression and so on.


    To inform our research, the chapter begins by first reflecting on some of the
    key issues relevant to understanding public reactions to malicious cyber events.
    We examine topics such as risk perception (Norse, Creese, Goldsmith, & Lamberts,
    2011; Rogers, Amlöt, Rubin, Wessely, & Krieger,'
