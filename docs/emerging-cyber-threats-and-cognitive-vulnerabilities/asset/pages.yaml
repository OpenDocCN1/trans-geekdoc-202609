  img_proc: true
- pgno: 136
  md: '# 122 6. Avoiding a cyber war: rational motives


    Despite this critique, it would be interesting to test whether or not Glaser''s
    rational conditions, which should lead to negative cooperation, could exist in
    cyberspace. If the United States, China and Russia demonstrate the ability to
    cooperate in cyberspace, global cyberspace conflict would be unlikely. Yet, if
    the states demonstrate that Glaser''s theoretical conditions are unattainable
    in cyberspace, it would be reasonable to expect an increase in cyberspace confrontations
    among these powers.


    # Cyberspace as a playground for cooperation and conflicts


    To ensure their cybersecurity, states often invoke traditional military strategies,
    such as deterrence or restraint. However, the typical types of military strategies
    valid in cyberspace is questionable. The specifics of cyberspace could pose an
    obstacle to cooperation. Cyberspace is characterized by a different perception
    of time; cyberattacks can be carried out ''here and now'' simultaneously in many
    places. Moreover, there is a different perception of space. In the cyber domain,
    the boundaries of a state''s legal jurisdiction are extended and cyberattacks
    have a transboundary effect in which they are not bound to physical borders. Cyberspace
    also poses accountability and assessment problems. It is difficult to discern
    who should be held liable for a cyberattack or even how much damage it caused.
    Applying traditional security strategies as deterrence in cyberspace, the differences
    between kinetic and cyber scenarios, yields serious issues. Lan et al. (2010)
    stress that the anonymous nature, global reach, scattered quality and interconnectedness
    of information networks greatly reduce the efficacy of traditional security strategies.
    Yet, the opposite view holds that deterrence or security cooperation could play
    a crucial role in de-escalating or averting cyber conflicts. For example, many
    existing rules of law are applicable in cyberspace. Despite the specifies of cyberspace,
    this chapter follows the state-centric principle, which implies that only states
    can agree to common rules of conduct in cyberspace. The transfer of military logic
    to the cyber domain is justified for several reasons. First, cybersecurity is
    already perceived as an integral part of military security. Although cyberforces
    are acknowledged as a separate kind of military force, most countries'' security
    strategies emphasize cybersecurity as a key component of national security. Second,
    cybersecurity already plays a role in cross-border relations between states and
    bilateral agendas. Indeed, cybersecurity is as important as traditional military
    or economic cooperation. Third, multilateral cooperation (e.g., the UN) has led
    to agreements on cybersecurity and the limitations of cyber capacities These agreements
    classify trust building in cyberspace as disarmament. Cybersecurity first appeared
    on the UN''s agenda in 1998, when Russia proposed a resolution'
