- pgno: 102
  md: '# 88 4. The social and psychological impact of cyberattacks


    At the broad social and societal levels, the attack affected millions of bank
    customers. According to reports, perpetrators attempted to block access to the
    bank''s 20 million accounts (Collinson, 2017). The result was an impact on individuals
    and businesses, particularly their ability to login to online systems. As, some
    customers would have been unable to view balances, make payments (e.g., for rent
    and bills), and conduct bank transfers (e.g., for necessary one-off transactions).
    Another pertinent factor was here that this type of DDoS attack targeting the
    banking sector occurred in the past.


    In 2015, a similar cyberattack occurred compromised the services of UK banks,
    RBS and NatWest (Collinson, 2015). A particularly worrying reality of that the
    attack was the time in which occurred, that is, near to payday; this resulted
    in a maximum impact on some individuals and widespread panic. One noteworthy difference
    and a key factor in the more recent attack was the number of days across which
    it took place. This extended period of 2 days (with some reports suggesting it
    was longer for some customers) meant that not only the reputation of the bank
    damaged, but also customers'' lives may have been seriously disrupted during the
    time.


    To consider the response from government, one MP made the point that the cyberattack
    was worrying and that matter needed to be done. According to The Guardian, the
    then-MP stated: “The attack on Lloyds was deeply troubling. Thousands of customers
    were affected by this, the latest in a long list of failures and breaches of banking
    IT systems... As I already pointed out, it is time to consider whether a single
