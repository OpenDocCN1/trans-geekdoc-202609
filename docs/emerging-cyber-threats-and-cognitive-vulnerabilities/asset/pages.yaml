    the long-term wider ramifications (Betts & Spenser, 2017). While children, young
    people and adults use online communications on a daily basis, adolescence is a
    period of development that has been associated with increased online communication
    and interaction (Marcum, Higgins, Roberts, 2010; Ybarra & Mitchell, 2007). The
    time spent interacting with others has been shown to be a significant risk factor
    for cyber victimization, as increased time online increases exposure to a potential
    victim. For example, adolescents who spend more time for non-school work were
    more likely to engage in perpetration/or victimization involvement (Ávarez-García,
    Núñez, García, & BarreiroCollazo, 2018). In addition, online users who spend more
