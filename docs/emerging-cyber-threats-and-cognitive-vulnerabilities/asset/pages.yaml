- pgno: 70
  md: '# 56 3. Closed, safe and secure — the Russian soviet


    information instead of cyber could be replaced by the Soviet kibernetik thinking
    (Gerovitch, 2002; Peters, 2016) and the historical associations that ‘RuNuet’
    evokes in Russian (cf. Kukkola, 2018a).


    In contradiction to the previous studies (e.g. Kukkola et al. 2017; Ristolainen,
    2017), in this chapter the two entities ‘RuNuet’ and the ‘Russian segment of the
    Internet’ are considered separately. In order to deepen the understanding of the
    Russian cyber/information security, it is argued that ‘RuNuet’ represents the
    ‘sociocultural basis’ for the ‘Russian segment of the Internet’. At the beginning,
    ‘RuNuet’ developed largely free from state influence (Gorny, 2009), therefore
    the Russian segment of the Internet is the materialization of the increased state
    control of an organization under control of a free preset. Consequently, ‘RuNuet’
    as a concept has evolved from an alternative social universe to a state-controlled
    ‘Russian segment of the Internet’’


    Furthermore, in the spirit of dialectic method, it could be claimed that together
    ‘RuNuet’ and the ‘Russian segment of the Internet’ create what in Russian is called
    ‘unified information space’ (edino informatsionnoe prostranstvo). Here the Hegelian
    triadic idea ‘thesis-anthesis-synthesis’ could be used as a formula for explaining
    the change from ‘RuNuet’ through the ‘Russian segment of the Internet’ to the
    ‘Unified information space’ and back. According to Kukkola (2018a), the unified
    information space should be understood as a concept of control that encompasses
    information infrastructure (technical aspect) as well as information itself (psychological
    aspect). The originally Cold War period of ‘unified information space’ is a collection
    of all resources, methods and control of consciousness, it is a horizontally integrated
    and centrally controlled information network. In practice, this was known as the
    OGAS (the State-wide Automated Management System for Collection and Processing
    of Information for the Accounting, Planning, and Management of the National Economy)
    in Soviet times and it meant to manage the whole Soviet economy — and as the Soviet
    state and society according to kibernetik visions (cf. Gerovitch, 2008; Kukkola,
    2018a; Peters, 2016).


    ‘RuNuet’ is a relatively closed, online environment that is based on the Russian
    language. RuNuet has been generally defined as ‘a totality of information, communications
    and activities which occur on the internet, mostly in the Russian language, no
    matter where resources and users are physically located, and which are somehow
    linked to Russian culture and Russian cultural identity’ (Gorny, 2009, p. 27).


    > ² Kibernetika — cybernetics is a science studying the processes of control and
    information transfer in various systems (machines, living organisms, society etc.)
    (cf. Gerovitch, 2002; Peters, 2016).'
