  md: '# 3. Closed, safe and secure — the Russian sense


    government has compared some websites it opposes to suicide bombers and tells
    citizens its response would be to Internet control and censorship to create a
    ‘Bulletproof vest for the Russian society’.(Nisbet et al., 2017)


    Cleaning together’ calls for the responsibility of every citizen to take in the
    creation of Russian information security. At the same time, these initiatives
    produce a feeling that everybody’s input is important – the state insists to its
    citizens even though it knows it is best for them. Furthermore, self-censorship
    guarantees public safety and reduces the fear of ‘cringe’ while the Russian sense
    of information security is created. The increasing ‘closed, safe and secure’ rhetoric
    encourages Russian users to stay within the framework of the Russian segment of
    the Internet and their synthesis in the ‘unified information space’ gives rise
    to a natural and self-attained isolation. Consequently, the Russian perception
    of information security is fundamentally related to territoriality and sovereignty
    that is offered to the people in the in-dependent ‘Russian segment of the Internet’.


    # Russian segment of the Internet — a state-controlled project for protecting
    information security


    The sociocultural production of security transforms the material and technological
    side of RuNet through the concept of the Russian or national segment of the Internet.
    If the three cases discussed above have been examples of the dialectics in psychological,
    informational or spiritual side of the Russian information space, it is argued
    that taking control of the free, boundless and open infrastructure of RuNet the
    Russian state shapes it towards order, exclusion and control. This process, of
    course, feeds back to the psychological side and ideological material cannot be
    fully separated. They are two sides of the same coin in examining how the Russian
    understanding of information security is constructed.


    The idea of creating ‘unified information space’ on a technological level was
    already present when the Russian Federation emerged from the ashes of the Soviet
    Union. At the time, this space was still to be connected to the global information
    network and was seen as a way to enhance economic development (Kontseptsiia, 1995).
    This openness subsided at the end of the 1990s when the Russian government presented
    its first concept for the development of information society. This society was
    proposed to be achieved in a ‘Russian way’ (Kontseptsiia, 1999). Concurrently,
    in 1999 Russia adopted its first information security doctrine which clearly stated
    that the information threats emanating from the'
