  md: '# Fear


    # Fear


    Ghosh, Prelas, Viswanath, and Loyalka (2010) state that cyberterrorism is the
    abuse of information technology to create violence, damage and fear. With terrorism,
    an underlying goal is the creation of fear in the minds of the victims. To extend
    this to the digital realm, for a cyberattack to be labelled as cyberterrorism,
    the incident should instill shock and panic due to the malfunction or unavailability
    of critical services. The term “cyberterrorism” occurs two significant markers:
    fear of and of terrorism (Conway, 2008). The potential for an airline system to
    be hacked with planes crashing or the water purification plant to be infected
    with a dangerous chemical are examples of fear-causing threats. A virus that pops
    up a drawing game does not elicit the same level of fear as a threat against critical
    life-dependent systems like hospitals or emergency services. Attacks on ICT infrastructure
    of critical services would have a stronger impact than a small business in an
    obscure location. The act is intended to produce effects beyond the immediate
    physical damage (Embar-Seddon, 2002).


    Stohl (2006) has defined cyberterrorism as a purposeful act or the threat of violence
    to create fear and/or behaviour in a victim and/or audience of the act or threat.
    A critical aspect of this is the definition of violence with the intent of creating
    fear. In some cases, an attacker does not even have to cause a system malfunction.
    the airport system has been hacked or the food manufacturing plant has been contaminated
    can cause wide-spread panic. Then, terrorists can utilize a digital platform to
    present the front of a potential attack without executing any system change. Due
    to the abstract nature of ICT, an attacker can heighten fear levels through public
    announcements and disinformation campaigns. Malicious parties could create extensive
    anxiety with warnings of disruptions or infections of critical systems. Through
    the generation of fear and publicity, the underlying goals of perpetrators have
    been achieved. This is indicative of the movement of traditional terrorism into
    the Digital Age, whereby the principles of violence, fear and publicity still
    remain.


    In postmodern era, cyberterrorism also brings with it the idea of hyperreal (the
    blurring of distinctions between the real and the unreal (Matsutsch, 2008). Face-to-face
    interaction and engagement have been largely replaced with digital communication.
    Within this context, we are faced with simulated situations which are experienced
    as hyperreal encounters. With the hyperreal experience, physical dimensions and
    boundaries are no longer relevant. Occurrences that are not observable or controllable
    are now a reality. For example, previously, only a physical attack on a water
    plant would result in contamination. With the'
