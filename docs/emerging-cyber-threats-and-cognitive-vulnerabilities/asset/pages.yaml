  md: '# Cleaning together for safer information environment 65


    Also in 2012, the United Russia party’s youth launched a ‘MediaGuard’ project
    that will automatically block the maximum number of websites with ‘illegal content’.^9
    According to its website^10, ‘MediaGuard’ is a Federal project aimed at utilizing
    the efforts of Internet users to jointly identify Internet sites, communities
    and groups in social networks specializing in the distribution of illegal content.
    MediaGuard’s Register of banned sites has been created to combat drugs, child
    pornography and suicide on the Internet. Their promotion speech includes the following:
    ‘Thousands of sites are blocked, but if you now score in the search engine any
    of these areas, you can find the necessary resources, not to mention those that
    are created for indexing. We offer just a few clicks to make the Internet cleaner
    and safer. To do this, you must register on the site and send a request if you
    encounter on the Internet with prohibited information! As noted earlier, ‘MediaGuard’
    won the popular vote for the best Internet project’ and was also awarded in the
    ‘Internet without extremism’ category in 2014.


    All the joint cleaning projects reflect the Russian turn towards traditional values,
    creation of ‘morally safe environment’ and the isolation of the Russian ‘unified
    information space’. The black and white lists made by the volunteers are used
    in several applications^11 i.e the cleaning together for safer information environment
    is considered productive. ‘Safe Internet League’ and ‘MediaGuard’ are presented
    as existing without government intervention. They resemble a Soviet subbotnik
    that means a free labour performed at leisure time for the benefit of society.
    Besides, ‘MediaGuard’ is opened by United Russia Party’s project and it could
    be used for politically motivated censorship.


    Furthermore, Nisbet, Kamenchuk, and Dal (2017) call the process developing in
    Russia as a creation of ‘psychological firewall’, i.e. people report they do not
    go to certain websites because the government says it is bad for them. ‘Authoritarian
    regimes censorship framing the Internet as a threat to these citizens that may
    be tightly controlled for their own protection. This rhetoric underpins government
    censorship and creates a ‘psychological firewall’ driving public support for a
    censored Internet.’(Nisbet et al., 2017). The


