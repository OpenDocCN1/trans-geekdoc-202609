  md: '# Introduction


    Security is a feeling that varies from culture and it is some-times specific to
    each individual society (cf. Gupta & Sharna 2009). Likewise, cybersecurity experienced
    within one state can radically differ from the cybersecurity experienced within
    another. In the Russian approach, other countries’ and hostile forces for the
    destabilization of Russia. The Internet is a by-product of the dominant American
    culture and, therefore, poses a threat to Russian cultural integrity and independence.
    (cf. Doktrina, 2000; Doktrina, 2016; Rlistainen, 2017.) ‘RuNet’ (from words ‘Russian
    Internet’ as an alternative and familiar Russian language platform has been gradually
    developing from the bottom up to change the English language-dominated Internet.
    Later, the Russian government began to plan top-to-bottom approach for technical
    disconnecting of the ‘Russian segment of the Internet’ from the global Internet.
    In 2014, a series of ex-ercises were conducted to test ‘national segment’s feasibility
    (Nikiforov, 2014; Demidov & Makhukova, 2016). During summer 2016, Russia declared
    that its ‘national segment’ would be disconnected from the global Internet by
    2020 in order to protect the critical Russian infrastructure (Minkomsviaz 2016;
    Programma, 2014). Furthermore, a ‘road-map’ that Russia will be ‘digitively sovereign’
    by 2020 was presented in 2017 (Programma, 2017). During the past years, Russia
    has launched strategies (Strategia 2015, 2017), doctrines (Doktrina, 2000, 2016),
    state programs (Programma, 2014, 2017) and action plans (Napravlenija, 2018) demonstrate
    clearly how the Russian Federation is preparing the infrastructural basis for
    national control of the Internet (cf. Kukkola, 2018a, 2018b; Kukkola & Rolistainen,
    2018; Kukkola, Rolistainen, & Nikila, 2017). It is clear that the Russian approach
    to cybersecurity differs fundamentally from the ‘Western’ understanding of cybersecurity
    that is based on global and the open Internet (Ristolainen, 2017, pp. 113–114).


    The methodology of this chapter draws on an integrated approach. On the one hand,
    a dialectic method is applied to demonstrate the duality between ‘RuNet’ and the
    ‘Russian segment of the Internet and to investigate the synthesis of these two
    approaches and how in this


