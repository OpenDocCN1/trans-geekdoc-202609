    Perhaps even more important is to know who the holder (controller or processor)
    is of the privacy data and what is the storage time of the data.


    According to Waterfield (2018), the navigator manufacturer TOMTOM reported in
    2011 that it has sold data stored by the navigators'' movements to the Danish
