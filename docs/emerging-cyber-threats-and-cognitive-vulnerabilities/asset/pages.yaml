- pgno: 154
  md: '# 140 6. Avoiding a cyber war: rational motives


    United States'' cyber deterrence failure. Russia, like China, is using offensive
    cyber instruments to gain a competitive advantage over the United States. While
    China is deploying its cyber capabilities to conduct commercial and military espionage,
    Russia is using its cyber capabilities to provoke a political confrontation with
    the United States and impact politics within the United States. By choosing not
    to differentiate between offensive and defensive capabilities and by sending confrontational
    messages, Russia is refusing to establish grounds for cooperation. It elevates
    the risk for the escalation of a cyber conflict between the United States and
    Russia, should the United States decide to respond with cyberattacks against Russia.


    Despite some dangerous cyber conflict escalation developments, logic and rational
    motives suggest that the desire to minimize potential destruction should lead
    to de-escalation attempts, especially following a crisis. Examples from history,
    as the Cuban crisis of 1962, indicate that a critical clash can initiate cooperation,
    even between the bitter of enemies.


