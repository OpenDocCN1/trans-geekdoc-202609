    \ Engineering College, Pondicherry, India\n\n# 7.1 Introduction\n\nChronic respiratory\
    \ disorders are a genre of long-term illness influencing the air passage and the\
    \ anatomy of the respiratory system. Lung disorders are graded as the biggest\
    \ donor to the global effect of diseases in the world. Some of the respiratory\
    \ disorders include chronic obstructive pulmonary diseases (COPD), asthma, occupational\
    \ lung illness, chronic bronchitis, pneumonia, etc. The diagnostic studies of\
    \ the World Health Organization (WHO) and Healthy People 2020 revealed that currently\
    \ over 25 million people in the United States (US) have been diagnosed with asthma\
    \ and roughly 14.8 million adults have been identified with COPD [1]. In addition,\
    \ the Forum of International Respiratory Societies (FIRS) has anticipated that\
    \ more than millions of people live along with increased pressure in the pulmonary\
    \ system and more than 50 million individuals suffer from occupation-related lung\
    \ infections, thereby figuring out that more than one billion people are being\
    \ affected from chronic respiratory conditions [2].\n\nThe causes of COPD include\
    \ deficiency of alpha-1-antitrypsin protein, long-term exposure to air pollution,\
    \ chemicals, fumes, and dust inhalation in the workplace. This deficiency causes\
    \ the lungs to deteriorate and also can affect the liver. The common monitoring\
    \ and diagnostic techniques for pulmonary diseases are spirometry, CT scans, arterial\
    \ blood gas tests, and auscultation of the lungs. Respiratory auscultation is\
    \ the most preferred diagnostic tool for the examination of pulmonary disorders\
    \ and it provides the physiological and pathological information for the medical\
    \ experts to proceed with the therapeutic procedure [3]. The respiratory sound\
    \ (RS) is one of the most significant bio-signals used to diagnose certain respiratory\
    \ abnormalities. RS detected from the chest wall and mouth may be classified as\
    \ normal (vesicular) and adventitious sounds. Some of the abnormal sounds include\
    \ wheezing, rhonchus (low-pitched wheezes), stridor, and"
