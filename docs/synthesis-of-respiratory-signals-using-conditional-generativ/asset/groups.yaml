    From the tables, it is observed that the class-wise accuracy is found to be high
    for all classes almost more than 98% for the case of classification with augmentation,
    whereas it is comparatively low for the case of without augmentation. In addition,
    the F1 score is high for all classes in Table 7.8 which reveals that the validation
