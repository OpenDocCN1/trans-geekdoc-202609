    In 2019, Bhattacharya D et al. [11] suggested deep convolutional generative adversarial
    network (DCGAN) and experimented on NIH chest X-ray image open database to enhance
    the efficiency of CNN model using GAN and yielded 65.3% accuracy. With the aid
    of structure correcting GAN, Dai et al. [12] carried out segmentation between
    lungs and heart regions in chest X-ray images. In that work, the authors introduced
    a critic network in order to figure out the higher-level structures to acquire
    practical segmentation findings to achieve realistic segmentation outcomes. Several
    comprehensive attempts with this method resulted in real segmentation with high
    precision. Onishi et al. [13] explored deep CNN (DCNN) and GAN to create the sufficient
    number of images in order to differentiate malicious and benign lung nodules.
    In that work, the images were generated using the pixel value distribution present
    in the mid-portion of the pulmonary nodule. This approach of pretraining and fine-tuning
    process using DCNN enables to discriminate almost 66.7% of benign nodules and
    93.9% of malicious pulmonary nodules and proved with the classification accuracy
    of 20% more than original images.


    Apart from CT and PET images, Chaudhari et al. [14] have trialed the augmentation
    approach on gene expression dataset using modified generator GAN (MG-GAN) and
    compared the performance with basic GAN and KNN classifier. The results proved
    that MG-GAN improved the accuracy by 18.8% and 11.9% and further the loss value
    of the error function was found to be reduced very drastically from the value
    0.6978 to 0.0082 making it suitable for applications with sensitive data. Luo
    et al. [15] explored the progressive growth of GAN-based augmentation on electroluminescence
    images for the classification of faulty photovoltaic component cells and improved
    the performance to the maximum of 14% using an enlarged dataset. Apart from this,
    Li et al. [16] focused the research on gear safety in the transmission industry
    for reliability classification using GAN wherein, the authors introduced bounded-GAN
    to create gear data with different settings and trained the model using ADAM optimizer.
    The research findings show that the proposed bounded-GAN excels other approaches
    on operational measures. GAN also finds its application in diverse fields such
    as magnetic resonance imaging scans, video surveillance, clinical informatics,
    computational biology, automotive fields, etc.


    Furthermore, GAN-based methods strengthen and show the possible gains in the audio
    synthesis field as well with reference to analysis, processing, and classification
    of signals. In spite of the latest developments in the field of artificial intelligence
