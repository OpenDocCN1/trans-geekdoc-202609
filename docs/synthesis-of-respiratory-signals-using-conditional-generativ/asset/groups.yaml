    \ thereby figuring out that more than one billion people are being affected by\
    \ chronic respiratory conditions [2].\n\nThe causes of COPD include deficiency\
    \ of alpha-1-antitrypsin protein, long-term exposure to air pollution, chemicals,\
    \ fumes, and dust inhalation in the workplace. This deficiency causes the lungs\
