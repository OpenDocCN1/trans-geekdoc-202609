  mdcn: "\n\n## 第7章\n\n## 基于尺度图表示的呼吸信号条件生成对抗网络合成\n\n**S. Jayalakshmy**<sup>a</sup>、**Lakshmi\
    \ Priya**<sup>b</sup>和**Gnanou Florence Sudha**<sup>c</sup>  \n<sup>a</sup>IFET工程学院，维卢布勒姆，印度\
    \  \n<sup>b</sup>马纳库拉·维纳亚加技术学院，本地治里，印度  \n<sup>c</sup>本地治里工程学院，本地治里，印度\n\n###\
    \ 7.1 引言\n\n慢性呼吸系统疾病是一组影响气道和呼吸系统解剖结构的长期性疾病。肺部疾病被认为是全球疾病负担的最大贡献因素。一些呼吸系统疾病包括慢性阻塞性肺疾病（COPD）、哮喘、职业性肺病、慢性支气管炎、肺炎等。世界卫生组织（WHO）和\"\
    健康人民2020\"计划的诊断研究显示，目前美国有超过2500万人被诊断患有哮喘，约1480万成年人被确诊为COPD[1]。此外，国际呼吸学会论坛（FIRS）预测，超过数百万人生活在肺动脉压力升高的状态下，超过5000万人患有与职业相关的肺部感染，由此可以推断，超过10亿人正受到慢性呼吸系统疾病的影响[2]。\n\
    \nCOPD的病因包括α-1抗胰蛋白酶蛋白缺乏、长期暴露于空气污染、化学品、烟雾以及工作场所的粉尘吸入。这种缺乏会导致肺部恶化，还可能影响肝脏。肺部疾病的常用监测和诊断技术包括肺活量测定法、CT扫描、动脉血气分析和肺部听诊。呼吸听诊是检查肺部疾病最常用的诊断工具，它为医学专家提供生理和病理信息，以便继续进行治疗方案[3]。呼吸音（RS）是用于诊断某些呼吸系统异常的最重要的生物信号之一。从胸壁和口腔检测到的呼吸音可分为正常（肺泡性）音和附加音。一些异常声音包括喘息、鼾音（低音调喘息）、喘鸣和爆裂音，这些声音的频率各不相同。\n\
    \n使用传统听诊器聆听肺部声音使肺部听诊技术简单、易用，并且是最受欢迎的无创诊断方法。\n\n为了进一步协助医疗从业者进行诊断，基于深度学习的计算机辅助诊断（CAD）系统在过去几年中得到了广泛应用。然而，为了使这些深度学习算法能够精确区分即使是微弱的异常呼吸模式，需要大量的训练数据。另一方面，公开可用的正常和异常呼吸音数据集数量非常有限。在这些资源不足的情况下，深度学习模型往往会面临一些限制，如过拟合——模型仅在训练数据上表现良好，而在其他未见过的数据上表现不佳。这可以被视为传统基于深度学习的CAD系统面临的最大挑战。尽管研究中已经采用了多种训练模式和架构设计，但在数据稀缺的情况下训练模型仍是一项艰巨的任务。因此，为了获取更多样本，数据增强是合理的解决方案。\n\
    \n为了扩大数据集的规模，传统的增强方法会在给定图像中产生普通的变异，以获得原始图像的不同方面。一些修改包括旋转变化、平移、反射和缩小图像尺寸[4]。从呼吸信号的角度来看，使用传统的增强方法将音频信号转换为二维表示并不合适。具体而言，围绕时间轴的随机翻转意味着信号在时间上被反转，而随机的Y轴翻转将完全改变对频率的理解。同样，X方向的随机平移意味着仅存在时间偏移，Y方向的平移则表示频谱被修改，这可能并非原始信号的真实表示。为了模拟较慢或较快的呼吸而在X方向进行随机缩放，同时不改变频率特性，这在物理上是有意义的，但这反过来又会在信号表示中添加随机噪声。\n\
    \n为了解决这些问题，本研究旨在借助生成对抗网络（GAN）人工改善数据集。本研究提出利用时频表示（即信号的图像表示）通过GAN架构合成呼吸信号。尺度图是通过连续小波变换获得的信号能量密度的可视化表示，已被发现能够很好地区分不同类别的呼吸信号[5]。连续小波变换的可逆性使得利用GAN架构间接合成信号成为可能。\n\
    \nGAN是一类深度学习框架，能够从称为潜空间的已知数据表示中成功生成图像。GAN由两个深度神经网络组成，称为生成器和判别器，它们相互竞争以学习已知训练集图像的概率分布函数，因此称为\"\
    对抗\"。本研究的结果无疑将解决这一挑战。\n\n研究发现准确率提高至85.7%的敏感性和92.4%的特异性。此外，在2018年，Salehinejad等人[10]也通过实现GAN生成人工图像用于胸部X射线图像的病变分类，见证了数据集样本的扩展。作者利用深度卷积神经网络（DCNN）识别五类不同的胸部X射线疾病，性能结果得到了改善。\n\
    \n2019年，Bhattacharya D.等人[11]提出了深度卷积生成对抗网络（DCGAN），并在NIH胸部X射线图像开放数据库上进行实验，以利用GAN提高CNN模型的效率，取得了65.3%的准确率。借助结构校正GAN，Dai等人[12]在胸部X射线图像中进行了肺部和心脏区域之间的分割。在该研究中，作者引入了一个批评网络，以识别更高层次的结构，从而获得实用的分割结果，实现真实的分割效果。通过该方法的多次综合尝试，最终获得了高精度的真实分割结果。\n\
    \nOnishi等人[13]探索了深度CNN（DCNN）和GAN，以生成足够数量的图像来区分恶性和良性肺结节。在该研究中，利用肺结节中部的像素值分布生成图像。这种使用DCNN进行预训练和微调的方法能够区分约66.7%的良性结节和93.9%的恶性肺结节，并将分类准确率相比原始图像提高了20%。\n\
    \n除了CT和PET图像之外，Chaudhari等人[14]还尝试了在基因表达数据集上使用改进生成器GAN（MG-GAN）的增强方法，并与基础GAN和KNN分类器的性能进行了比较。结果表明，MG-GAN将准确率提高了18.8%和11.9%，此外误差函数的损失值从0.6978急剧下降至0.0082，使其适用于包含敏感数据的应用。Luo等人[15]探索了基于GAN的渐进式增强在电致发光图像上的应用，用于光伏电池组件的故障分类，并通过扩大的数据集将性能最大提升了14%。此外，Li等人[16]将研究重点放在传动行业中齿轮安全性的可靠性分类上，使用GAN技术，其中作者引入了有界GAN来生成不同设置的齿轮数据，并使用ADAM优化器训练模型。研究结果表明，所提出的有界GAN在操作指标上优于其他方法。GAN还广泛应用于磁共振成像扫描、视频监控、临床信息学、计算生物学、汽车领域等多个领域。\n\
    \n此外，基于GAN的方法在音频合成领域也增强了信号的分析、处理和分类能力，并显示出潜在收益。尽管人工智能和生成模型领域取得了最新进展，但通过神经网络从固有声音中编译信息\n\
    \n"
