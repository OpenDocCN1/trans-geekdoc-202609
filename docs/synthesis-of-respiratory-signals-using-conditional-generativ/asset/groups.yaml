    accuracy was found to be improved to 85.7% sensitivity and 92.4% specificity.
    Furthermore, in 2018, Salehinajad et al. [10] have also witnessed the expansion
    in dataset samples by implementing GAN to produce artificial images for the classification
    of the lesion in chest X-ray images. The authors utilized a deep convolutional
    neural network (DCNN) to identify disorders with five different classes of chest
