    ## 7.4 Results and discussion


    To demonstrate the performance of the proposed data augmentation technique using
    conditional GAN, the original scalogram images extracted through continuous wavelet
    transform and generated scalogram images through cGAN are input to different pretrained
    models. The classification performance is compared for all the classes of respiratory
    sounds with and without augmentation.


    ### 7.4.1 Dataset


    The dataset used in this proposed study was acquired from various sources, namely
    RALE (Respiratory Acoustics Laboratory Environment) repository [29], Think Labs
    Lung Sound Library [30], and ICBHI [31] benchmark, publicly available databank.
    These archives comprise gender-based normal and abnormal lung sounds of several
    kinds. For the training and testing phase, the entire lung sound database has
    been arbitrarily split into 70% and 30%. By and large, the database has 73 normal
    files, 281 crackle sound files, 33 rhonchi files, and 122 wheeze files.


    ### 7.4.2 Data augmentation using conditional GAN


    The training phase of the data augmentation process using cGAN is explained in
    this section. For the process of experimentation,


    - (i) The number of latent inputs for the generator network are considered to
    be 100. Typically the generator produces RGB noise as scalograms at random.

    - (ii) From the modeled convolutional filters, the discriminator network attempts
    to figure out the difference between random noise scalograms and real-scalogram
    images of respiratory sounds.

    - (iii) To mystify the discriminator network, the generator learns from the transposed
    convolution filters.

    - (iv) The process is continued endlessly, as long as the discriminator is confused
    to the greatest extent.


    In the proposed approach, the network is trained for four different epochs namely
    500, 1000, 1500, and 2000 and the cost function is observed for all cases. The
    visual representation of the progress of training with scores of both the networks
    are shown in Fig. 7.6.


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_14_0.png)


    **Fig. 7.6** Training plots of generator and discriminator for different epochs.


    To check for the convergence of the network during the process of training, the
    scores are plotted on a scale from 0 to 1. The score of the generator network
    is defined as the average of the likelihood images analogous to the discriminator
    output for the generated images. In case 1 of Fig. 7.6, i.e., 500 epochs, the
    concept of mode collapse happens which indicates that the generator is incapable
    of learning the scalogram representation corresponding to diverse inputs. Therefore,
    in order to increase the ability of the generator to produce more outputs, the
    number of epochs is increased. The training plots of cases (2, 3, 4) indicate
    that the generator score reaches the value 0 and the score of discriminator extends
    to almost one which signifies that the discriminator network is dominating the
    generator network and therefore classifies most of the images correctly. Since
    the plots are almost stable in cases 3 and 4, the training phase is stopped with
    1500 epochs. Further increasing the number of iterations, increases the computational
    time of the network.


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_16_0.png)


    **Fig. 7.8** Sample of normal synthesis from scalogram using ICWT.


    ### 7.4.5 Performance results


    To evaluate the performance of data augmentation using conditional GAN, pretrained
    deep learning models such as AlexNet, GoogLeNet, and ResNet 50 are used for classification.
    The classification is performed for all the classes of respiratory sounds without
    augmentation and with augmentation and the results are compared for all the deep
    learning models. For classifying the data set without augmentation, the number
