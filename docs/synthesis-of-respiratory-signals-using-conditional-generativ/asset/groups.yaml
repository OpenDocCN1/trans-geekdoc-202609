  mdcn: '


    **第6步：** 将通过连续小波变换提取的原始尺度图图像和通过cGAN生成的尺度图图像提供给预训练模型AlexNet CNN [5]、GoogLeNet [28]和ResNet
    50，以量化性能。


    ## 7.4 结果与讨论


    为了验证所提出的使用条件GAN的数据增强技术的性能，将通过连续小波变换提取的原始尺度图图像和通过cGAN生成的尺度图图像输入到不同的预训练模型中。对所有类别的呼吸音在有增强和无增强两种情况下的分类性能进行了比较。


    ### 7.4.1 数据集


    本研究使用的数据集来自多个来源，即RALE（呼吸声学实验室环境）数据库[29]、Think Labs肺音库[30]和ICBHI [31]基准（公有可用的数据库）。这些档案包含基于性别的多种正常和异常肺音。在训练和测试阶段，整个肺音数据库被任意分割为70%和30%。总体而言，该数据库包含73个正常文件、281个爆裂音文件、33个鼾音文件和122个喘息文件。


    ### 7.4.2 使用条件GAN进行数据增强


    本节解释了使用cGAN进行数据增强过程的训练阶段。在实验过程中：


    - (i) 生成器网络的潜在输入数量设为100。通常，生成器随机生成作为尺度图的RGB噪声。

    - (ii) 鉴别器网络通过建模的卷积滤波器，试图找出随机噪声尺度图与呼吸音真实尺度图图像之间的差异。

    - (iii) 为了使鉴别器网络困惑，生成器从转置卷积滤波器中学习。

    - (iv) 只要鉴别器处于最大程度的困惑状态，该过程就无尽地持续下去。


    在所提出的方法中，网络分别以500、1000、1500和2000四个不同的轮次进行训练，并观察所有情况下的代价函数。训练进展及其两个网络分数的可视化表示如图7.6所示。


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_14_0.png)


    **图7.6** 不同轮次下生成器和鉴别器的训练曲线。


    为了检查网络在训练过程中的收敛情况，分数被绘制在0到1的尺度上。生成器网络的分数被定义为生成图像对应鉴别器输出的平均似然值。在图7.6的情况1中，即500轮次时，发生了模式崩溃现象，这表明生成器无法学习与不同输入相对应的尺度图表示。因此，为了增强生成器产生更多输出的能力，增加了轮次数。情况(2、3、4)的训练曲线表明，生成器的分数达到0，而鉴别器的分数几乎延伸至1，这意味着鉴别器网络正在主导生成器网络，因此能够正确分类大多数图像。由于情况3和4的曲线几乎稳定，训练阶段在1500轮次时停止。进一步增加迭代次数会增加网络的计算时间。


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_16_0.png)


    **图7.8** 使用ICWT从尺度图生成的正常声音样本。


    ### 7.4.5 性能结果


    为了评估使用条件GAN进行数据增强的性能，使用AlexNet、GoogLeNet和ResNet 50等预训练深度学习模型进行分类。对所有类别的呼吸音在无增强和有增强两种情况下进行分类，并比较所有深度学习模型的结果。对于无增强的数据集分类，训练图像数量为357张，测试图像为153张。同样，对于有增强的分类，使用cGAN为每个类别的呼吸音生成200张图像。其中，500张图像用于训练，300张用于测试。用于建模网络的实验设置列于表7.3中。


    **表7.3** 训练网络模型的参数设置。


    | 序号 | 超参数 | 值 |

    |---:|---|---|

    | 1 | 动量 | 0.9 |

    | 2 | 初始学习率 | 0.0001 |

    | 3 | 学习率下降因子 | 0.2 |

    | 4 | 学习率下降周期 | 5 |

    | 5 | 轮次数 | 20 |

    | 6 | 批量大小 | 10 |

    | 7 | 优化器 | SGDM |


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_18_0.png)


    **图7.9** ResNet 50网络在真实图像（无增强）情况下的训练进度。


    从表中可以看出，在有增强分类的情况下，所有类别的分类准确率几乎都高于98%，而在无增强情况下则相对较低。此外，在表7.8中，所有类别的F1分数都很高，这表明在增强数据的各种情况下，验证准确率都更好。


    ### 7.4.6 分析


    本章提出的方法演示了通过使用条件生成对抗网络生成合成尺度图图像，作为数据增强的替代方法来训练CNN。所提出的方法使用三种预训练模型进行实验，即AlexNet、GoogLeNet和ResNet
    50分类器。具有五个卷积层和三个全连接层的预训练AlexNet模型，在原始尺度图图像的情况下准确率为68.63%，而使用cGAN数据增强方法以1500轮次训练的网络准确率则达到96.38%。相同数量的图像使用具有22层深度的GoogLeNet分类器训练时，无增强情况下的准确率为73.86%，有数据增强时为96.88%。第三个模型ResNet
    50包含49个卷积层和一个全连接层。该网络在训练后，无增强情况下的准确率为81.37%，有增强情况下为98.75%。这表明更深的网络在计算和参数数量方面都被证明是高效的。此外，在有无增强情况下都具有良好准确率的模型，即ResNet-50，使用多种指标进行评估，包括准确率、精确率、召回率和F1分数。


    ![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_19_0.png)


    **图7.10** ResNet 50网络在增强情况下的训练进度。


    **表7.5** ResNet 50网络在无增强情况下的混淆矩阵。


    |  | 爆裂音 | 正常 | 鼾音 | 喘息 |

    |---|---:|---:|---:|---:|

    | 爆裂音 | 71 | 9 | 1 | 3 |

    | 正常 | 3 | 18 | 0 | 1 |

    | 鼾音 | 0 | 0 | 10 | 0 |

    | 喘息 | 3 | 4 | 5 | 25 |


    **表7.6** ResNet 50网络在有增强情况下的混淆矩阵。


    |  | 爆裂音 | 正常 | 鼾音 | 喘息 |

    |---|---:|---:|---:|---:|

    | 爆裂音 | 72 | 3 | 0 | 0 |

    | 正常 | 0 | 75 | 0 | 0 |

    | 鼾音 | 0 | 0 | 75 | 0 |

    | 喘息 | 0 | 1 | 0 | 74 |


    **表7.7** ResNet 50模型在无增强情况下的精确率和召回率。


    | 类别 | 准确率（%） | 精确率 | 召回率 | F1分数 |

    |---|---:|---:|---:|---:|

    | 爆裂音 | 87.58 | 0.85 | 0.92 | 0.88 |

    | 正常 | 88.89 | 0.82 | 0.58 | 0.68 |

    | 鼾音 | 96.08 | 1 | 0.63 | 0.77 |

    | 喘息 | 89.54 | 0.68 | 0.86 | 0.76 |


    **表7.8** ResNet 50模型在有增强情况下的精确率和召回率。


    | 类别 | 准确率（%） | 精确率 | 召回率 | F1分数 |

    |---|---:|---:|---:|---:|

    | 爆裂音 | 99 | 0.96 | 1 | 0.98 |

    | 正常 | 98.67 | 1 | 0.95 | 0.97 |

    | 鼾音 | 100 | 1 | 1 | 1 |

    | 喘息 | 99.67 | 0.99 | 1 | 0.99 |


    根据表7.8的结果，精确率、召回率和F1分数的高值表明，在增强数据的情况下，所有类别的呼吸音的验证准确率都更好。


    ## 7.5 结论与未来展望


    由于将传统数据增强技术应用于信号的时频表示存在挑战，本研究针对所研究的信号实验了一种新颖的数据增强方法。在本章中，利用无监督学习结构的GAN来为不同类别的呼吸音生成合成图像。为了更精准地针对图像生成，将条件信息施加于基础GAN。条件GAN的矛盾学习行为使得生成的尺度图图像非常接近呼吸音的原始尺度图图像。研究还发现，所建模的鉴别器网络的性能优于生成器网络，因此能够准确地对大多数图像进行分类。此外，使用不同的预训练深度学习分类器评估了数据增强方法的性能，并与无增强的原始图像进行了比较。结果表明，与不使用cGAN的情况相比，数据增强方法中所有模型的分类准确率都有显著提高。此外，ResNet
    50模型的测试准确率提高到98.75%，所有类别的精确率、召回率和F1分数均较高。


