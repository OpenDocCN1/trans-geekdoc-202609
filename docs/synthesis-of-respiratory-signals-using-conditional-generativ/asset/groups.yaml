    \ to precisely differentiate even the feeble abnormal breathing patterns, a huge\
    \ volume of training data is required. On the other hand, a very limited number\
    \ of both normal and abnormal respiratory sound datasets are publicly available.\
    \ Working with these insufficient resources, deep learning models tend to struggle\
    \ with a few limitations such as overfitting, which performs well only on the\
    \ training data but not on other unobserved data. This can be considered as the\
    \ greatest challenge in conventional deep learning-based CAD systems. Although\
    \ several patterns of training and architectural designs have been deployed in\
    \ research findings, training a model with a scarce amount of data is a demanding\
    \ task. Therefore to acquire more samples, data augmentation is the sensible solution.\n\
    \nFor scaling up of datasets, the conventional augmentation approach produces\
    \ ordinary variations in the given images in order to gain a different facet of\
    \ the original images. A few modifications involve rotational changes, translation,\
    \ reflection, and diminishing the size of images [4]. From the respiratory signal\
    \ perspective, transforming the audio signal to the 2D representation using conventional\
    \ augmentation approaches is not appropriate. In explicit terms, random flipping\
    \ around the time axis indicates that the signal is reversed in time and random\
    \ Y flipping will completely change the understanding of frequency. In the same\
    \ way, random X translation implies that there is only a time shift and translation\
    \ in Y signifies that the frequency spectrum is being modified, which may not\
    \ really be a true representation of the original signal itself. Scaling randomly\
    \ in the X direction in order to simulate slower breathing or faster breathing,\
    \ while not changing the frequency characteristics, would be physically meaningful\
    \ but this in turn adds random noise to the signal representation.\n\nTo resolve\
    \ these issues, this study aims at improving the dataset artificially with the\
    \ help of a generative adversarial network (GAN). In this study, it is proposed\
    \ to synthesize a respiratory signal using GAN architecture by virtue of the time-frequency\
    \ representation which gives a picture of the signal. Scalogram, the visual representation\
    \ of the energy density of the signal obtained through the continuous wavelet\
    \ transform, is found to differentiate well the different classes of respiratory\
    \ signals [5]. The fact that the continuous wavelet transform is invertible enables\
    \ the use of GAN architecture to indirectly synthesize signals.\n\nGAN is a class\
    \ of deep learning frameworks which successfully generates images from a known\
    \ representation of data called latent space. GAN comprises two deep neural networks\
    \ called generator and discriminator, competing one against the other in order\
    \ to learn the probability distribution function of the known training set images\
    \ and hence the term adversarial. The outcome of this study will undoubtedly address\
    \ the challenge\n\nAccuracy was found to be improved to 85.7% sensitivity and\
