    # 7.5 Conclusion and future scope


    Owing to the challenges in incorporating the conventional data augmentation techniques
    for time-frequency representation of the signal, a novel data augmentation approach
    has experimented for the signal under study. In this chapter, GAN an unsupervised
    learning structure is utilized to generate the synthetic images for the different
    classes of respiratory sounds. For improved targeting on the image generation,
    the conditional information is imposed to basic GAN. The contradictory learning
    behavior of conditional GAN gives rise to the generation of scalogram images really
    close to original scalogram images of respiratory sounds. It is also found that
    the performance of modeled discriminator network predominates the generator network
    and therefore categorizes the majority of the images accurately. In addition,
    the performance of the data augmentation approach is evaluated with different
    pretrained deep learning classifiers and compared with original images without
    augmentation. The results show that there is a significant improvement in the
    classification accuracy of all models in the data augmentation approach in comparison
    with without cGAN. Furthermore, the testing accuracy of ResNet 50 model produces
    an increased accuracy of 98.75% with high values of precision, recall, and F1
    score for all'
