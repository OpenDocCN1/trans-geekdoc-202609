    # 7.4.6 Analysis


    The proposed method in this chapter demonstrates the training of CNNs with an
    alternative method for data augmentation by way of generating synthetic scalogram
    images by using conditional generative adversarial networks. The proposed method
    is experimented with three pretrained models namely Alexnet, GoogLeNet, and ResNet50
    classifiers. The pretrained Alexnet model with five convolutional and three fully
    connected layers produces an accuracy of 68.63% for the case of original scalogram
    images whereas the network trained with 1500 epochs using cGAN data augmentation
    approach yields an accuracy of 96.38%. The same number of images when trained
    with GoogLeNet classifier with 22 layers deep yields an accuracy of 73.86% without
    augmentation and 96.88% with data augmentation. The third model ResNet 50 comprises
    49 convolutional layers and a fully connected layer. This network when trained,
    yields an accuracy of 81.37%'
