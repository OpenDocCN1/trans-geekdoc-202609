    \n# ### 7.4 Results and discussion\n\nTo demonstrate the performance of the proposed\
    \ data augmentation technique using conditional GAN, the original scalogram images\
    \ extracted through continuous wavelet transform and generated scalogram images\
    \ through cGAN are input to different pretrained models. The classification performance\
    \ is compared for all the classes of respiratory sounds with and without augmentation.\n\
    \n# ### 7.4.1 Dataset\n\nThe dataset used in this proposed study was acquired\
    \ from various sources namely RALE (Respiration acoustics Laboratory Environment)\
    \ repository [29], Think labs Lung sound library [30], and ICBHI [31] benchmark\
    \ publicly available databank. These archives comprise gender-based normal and\
    \ abnormal lung sounds of several kinds. For the training and testing phase, the\
    \ entire lung sound database has been arbitrarily split into 70% and 30%. By and\
    \ large, the database has 73 normal files, 281 crackle sound files, 33 rhonchi\
    \ files, and 122 wheeze files.\n\n# ### 7.4.2 Data augmentation using conditional\
    \ GAN\n\nThe training phase of the data augmentation process using cGAN is explained\
    \ in this section. For the process of experimentation,\n\n+   (i) The number of\
    \ latent inputs for the generator network are considered to be 100. Typically\
    \ the generator produces RGB noise as scalograms at random.\n+   \n+   (ii) From\
    \ the modeled convolutional filters, the discriminator network attempts to figure\
    \ out the difference between random noise scalograms and real-scalogram images\
    \ of respiratory sounds.\n+   \n+   (iii) To mystify the discriminator network,\
    \ the generator learns from the transposed convolution filters.\n+   \n+   (iv)\
    \ The process is continued endlessly, as long as the discriminator is confused\
    \ to the greatest extent.\n\nIn the proposed approach, the network is trained\
    \ for four different epochs namely 500, 1000, 1500, and 2000 and the cost function\
