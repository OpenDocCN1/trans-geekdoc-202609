    some of the technical gaps observed in the existing study are quality of generated
    data samples, distortion, and its distribution in the data set, which were not
    good enough resulting in poor classification accuracy as the accuracy is significantly
    dependent on both the qualitative and quantitative terms. In addition, the speed
    of the image generation process is very slow specifically in the field of speech
    synthesis. This poses limitations on high-dimensional data due to the nature of
    autoregressive modeling. Furthermore, in certain instances, network models trained
    with artificial generated sample data fail to perform well when fed with real
    images. All these gaps can be resolved in the proposed study with the help of
    conditional GAN. Inspired by the performance improvement by conditional GANs in
    Ref. [24], the proposed study employs the scalogram method of TF representation
    combined with cGAN for improved targeting and for synthesizing respiratory sounds
    in order to discriminate the normal and abnormal lung sounds.


    # 7.3 GAN for signal synthesis


    In this section, the architectures of simple GAN and conditional GAN and the proposed
    system model using the conditional GAN to synthesize respiratory sound signals
    from the wavelet-based time-frequency representation are explained in detail.
    The conditional GAN is utilized in this proposed study to artificially generate
    more number of scalogram images. With this proposed model as a data augmentation
    technique, better prediction accuracy through computer-aided diagnosis is expected.


    # 7.3.1 Simple GAN


    A simple GAN comprises two networks named generator and discriminator that are
    trained concurrently. The generator learns to generate a new image mimicking the
    data in the latent space by estimating its underlying probability distribution
    and the discriminator plays the role of binary classifier by mapping the input
    image either to the real-image dataset or to the generated set of images. The
    generator model has to be trained such that the generated image very closely resembles
    the images used for training thereby making the discriminator difficult to distinguish
    between the original and generated set of images. The discriminator in turn learns
    to make sure that its performance is better than that of the generator. This adversarial
    learning behavior of the GAN results in the generation of images which are very
    close to the real training set images. Fig. 7.1 shows the architecture of simple
    GAN [25].


    # 7.3.2 Conditional generative adversarial networks


    In contrast to basic GAN, cGAN utilizes a supervised method where both the generator
    and discriminator neural networks are adapted to meet the condition during the
    training'
