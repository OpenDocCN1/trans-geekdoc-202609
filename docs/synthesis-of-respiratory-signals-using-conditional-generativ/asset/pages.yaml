  md: '![](img/8bbf09e1d4a9c5e5be54b13d04ce8261_8_0.png)


    **Fig. 7.4** Generator network architecture.


    generator network comprises sequential transposed convolutional layers with batch
    normalization for scaling up the arrays of different dimensions. The small-scale
    noise vector given to the fully connected section transforms the input to 1024
    high-scaled image features which is further reshaped to 4 × 4 × 1025 for feeding
    to the convolution module. Several successive stages of transposed convolution
    layers transform the interim features to produce an output image equal to the
    dimension (64 × 64 × 3). This generator network generates synthetic scalograms
    for all classes of respiratory sounds individually to attain the wider class population.


    On the other hand, the discriminator network is modeled using multiple convolutional
    layers with leaky ReLU to produce prediction values. From the given input image
    to the discriminator block, which has a dimension of (64 × 64 × 3), the high-scaled
    features with the dimension (4 × 4 × 512) are extracted by the series of convolution
    layers. Further, these features are evened and are given as input to the fully
    connected network. This network gradually assigns the features to a low scale
    for classification.'
