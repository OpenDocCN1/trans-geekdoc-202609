- pgno: 72
  md: '# Approaches


    +   Template-based


    +   Using known structure of proteins that have high sequence similarity with
    target protein as the initial structure template.


    +   From the the initial structure, protein fragments are inserted or deleted
    to minimize the global free energy.


    +   An effective method if the target protein sequence has at least 30% sequence
    identity with the template protein.


    +   Template-free


    +   Without using solved protein structure


    +   Main goal is to find a conformation that has minimum free energy


    +   Require a vast computational resource such as powerful super computer or distributed
    computing projects (Rosetta@Home, Folding@Home)'
  merge: -1
  img_proc: true
