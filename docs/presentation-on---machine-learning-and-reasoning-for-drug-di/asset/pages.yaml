- pgno: 146
  md: '# GTPN: Synthesis via reaction prediction as neural graph morphism


    Input: A set of graphs = a single big graph with disconnected components


    Output: A new set of graphs. Same nodes, different edges.


    Model: Graph morphism


    Method: Graph transformation policy network (GTPN)


    Figure 1: A sample reaction represented as a set of graph transformations from
    reactants (leftmost) to products (rightmost). Atoms are labeled with their type
    (Carbon, Oxygen,...) and their index (1, 2,...) in the molecular graph. The atom
    pairs that change connectivity and their new bonds (if existed) are highlighted
    in green. There are two bond changes in this case: 1) The double bond between
    O:1 and C:2 becomes single. 2) A new single bond between C:2 and C:10 is added.


    ![](img/becaa13a45abf256713c782a26b8b29d_146_0.png)


    > Kien Do, Truyen Tran, and Svetha Venkatesh. "Graph Transformation Policy Network
    for Chemical Reaction Prediction." KDD''19.'
