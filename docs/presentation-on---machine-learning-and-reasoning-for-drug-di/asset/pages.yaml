- pgno: 139
  md: '# Repurposing as drug-target prediction in biomedical knowledge graphs


    A knowledge graph is a set of triplets (head, tail, relation), where head and
    tail are node / entity, and relation is link type. E.g., head = protein, tail
    = drug, relation = drug-protein-binding.


    Typically a knowledge graph is incomplete, e.g., missing relations between any
    pair (head, tail).


    Repurposing is finding new links for existing nodes (drugs).


    The search typically starts from a target (e.g., a protein) to locate suitable
    drugs for further development (e.g., trials or optimization).'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# TransE: Translational embedding of relations (link types)


    Head, tail and relation are typically embedded as vectors in the same space.


    > E(h, r, t) = ||h + r - t||_{1/2}


    TransE assumes a triplet has small translation distance from head to tail via
    relation, captured as an triplet energy.


    Loss function in TransF: minimize energy of the known triplets, separate it from
    energies of corrupted triplets by a margin.


    > L = \sum \sum [E(h, r, t) + \gamma - E(h'', r'', t'')]_+'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# TransF: Translation in the relation-projected space


    ```

    M_{r,h} = \sum_{i=1}^s \alpha_r^{(i)} \mathbf{U}^{(i)} + \mathbf{I}

    ```


    ```

    M_{r,t} = \sum_{i=1}^s \beta_r^{(i)} \mathbf{V}^{(i)} + \mathbf{I}

    ```


    TransF utitlises relation-specific projection of head and tail.


    ```

    h_{\perp} = M_{r,h}h, t_{\perp} = M_{r,t}t

    ```


    Triplet energy between projected head/tail is small w.r.t to relation.


    ```

    E(h, r, t) = ||h_{\perp} + r - t_{\perp}||_{\ell_1/2}

    ```


    ![](img/becaa13a45abf256713c782a26b8b29d_141_0.png)


    > Do, Kien, Truyen Tran, and Svetha Venkatesh. "Knowledge graph embedding with
    multiple relation projections." 2018 24th International Conference on Pattern
    Recognition (ICPR). IEEE, 2018.'
  merge: -1
  img_proc: true
