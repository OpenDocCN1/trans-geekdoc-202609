- pgno: 27
  md: '# DeepWalk


    # Algorithm 1 DEEPWALK(G, w, d, γ, t)


    Input: graph G(V, E)

    window size w

    embedding size d

    walks per vertex γ

    walk length t


    Output: matrix of vertex representations Φ ∈ ℝ|V|×d


    +   1: Initialization: Sample Φ from U|V|×d

    2: Build a binary Tree T from V ← For Hierarchical Softmax

    3: for i = 0 to γ do

    4: O = Shuffle(V)

    5: for each vi ∈ O do ← Finding neighbours of each node

    6: Wi = RandomWalk(G, vi, t)

    7: SkipGram(Φ, Wi, w) ← Update embedding of this node

    8: end for

    9: end for'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Similar to DeepWalk in using Skip-gram model for unsupervised learning.


    Only modifies the search for neighboring nodes that balance between BFS and DFS.


    Defines edge embedding based on node embedding


    +   Can solve link prediction problem


    > Grover, Aditya, and Jure Leskovec. "node2vec: Scalable feature learning for
    networks." Proceedings of the 22nd ACM SIGKDD international conference on Knowledge
    discovery and data mining. 2016.


    # 2nd order Random Walk


    ![](img/becaa13a45abf256713c782a26b8b29d_28_0.png)


    Consider random walk that just travelled edge (t, v). The walk will decide which
    is the next node x that it should go from v by computing π_vx


    π_vx = α_pq(t, x) · w_vx


    α_pq(t, x) = { 1/p if d_tx = 0

    1 if d_tx = 1

    1/q if d_tx = 2 }'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Graph convolutional nets


    # Data graph


    ![](img/becaa13a45abf256713c782a26b8b29d_29_0.png)


    # GCN update rule, vector form


    ```

    h_{v_i}^{(l+1)} = σ\left(\sum_j \frac{1}{c_{ij}} h_{v_j}^{(l)} W^{(l)}\right)

    ```


    # GCN update rule, matrix form


    ```

    f(H^{(l)}, A) = σ\left(\hat{D}^{-\frac{1}{2}} \hat{A} \hat{D}^{-\frac{1}{2}} H^{(l)}
    W^{(l)}\right)

    ```'
