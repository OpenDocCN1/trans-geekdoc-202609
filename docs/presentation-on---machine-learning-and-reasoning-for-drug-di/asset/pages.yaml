  md: '# Prelim: Skip-gram


    # Loss function


    \frac{1}{T} \sum_{t=1}^T \sum_{-c\leq j\leq c, j\neq 0} \log p(w_{t+j}|w_t)


    # Negative sampling


    \log \sigma(v''_{wO}^\top v_{wI}) + \sum_{i=1}^k \mathbb{E}_{w_i \sim P_n(w)}
    \left[ \log \sigma(-v''_{w_i}^\top v_{wI}) \right]


    p(w_O|w_I) = \frac{exp\left(v''_{w_O}^\top v_{w_I}\right)}{\sum_{w=1}^W exp\left(v''_w^\top
    v_{w_I}\right)}


