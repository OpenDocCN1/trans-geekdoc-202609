- pgno: 42
  md: '# The three basic questions in drug discovery


    > Given a molecule, is this drug? Aka properties/targets/effects prediction.

    • Drug-likeness

    • Targets it can modulate and how much

    • Its dynamics/kinetics/effects/metabolism if administered orally or via injection


    # Given a target, what are molecules?


    +   If the list of molecules is given, pick the good one. If evaluation is expensive,
    need to search, e.g., using Bayesian Optimization.


    +   If no molecule is found, need to generate from scratch → generative models
    + Bayesian Optimization, or Reinforcement Learning.


    +   How does the drug-like space look like?


    # Given a molecular graph, what are the steps to make the molecule?


    +   Synthetic tractability


    +   Reaction planning, or retrosynthesis'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Quantum chemistry


    In chemistry we mostly need to know about electronic structure (e.g., electron
    density and electronic energy).


    The density can be inferred from the wave function. But solving wave equation
    is very difficult.


    Density Functional Theory (DFT): electron density is a function of space and time.


    +   - Hohenburg-Kohn theorem: the density of any system determines its ground-state
    properties.

    - Electron density functional → total energy of our system.


    ![](img/becaa13a45abf256713c782a26b8b29d_43_0.png)


    > Aspuru-Guzik, Alán, Roland Lindh, and Markus Reiher. "The matter simulation
    (r) evolution." ACS central science 4.2 (2018): 144-152.'
  merge: -1
  img_proc: true
