- pgno: 21
  md: '# (Circular) fingerprints can be learnt


    ```

    1: Input: molecule, radius R, fingerprint length S

    2: Initialize: fingerprint vector f ← 0_S

    3: for each atom a in molecule

    4: r_a ← g(a) ▷ lookup atom features

    5: for L = 1 to R ▷ for each layer

    6: for each atom a in molecule

    7: r₁ ... r_N = neighbors(a)

    8: v ← [r_a, r₁, ..., r_N] ▷ concatenate

    9: r_a ← hash(v) ▷ hash function

    10: i ← mod(r_a, S) ▷ convert to index

    11: f_i ← 1 ▷ Write 1 at index

    12: Return: binary vector f

    ```


    ```

    1: Input: molecule, radius R, hidden weights H₁¹ ... H_R⁵, output weights W₁ ...
    W_R

    2: Initialize: fingerprint vector f ← 0_S

    3: for each atom a in molecule

    4: r_a ← g(a) ▷ lookup atom features

    5: for L = 1 to R ▷ for each layer

    6: for each atom a in molecule

    7: r₁ ... r_N = neighbors(a)

    8: v ← r_a + Σᵢ₌₁ᴺ r_i ▷ sum

    9: r_a ← σ(vH_L^N) ▷ smooth function

    10: i ← softmax(r_aW_L) ▷ sparsify

    11: f ← f + i ▷ add to fingerprint

    12: Return: real-valued vector f

    ```


    ![](img/becaa13a45abf256713c782a26b8b29d_21_0.png)


    #REF: Duvenaud, David K., et al. "Convolutional networks on graphs for learning
    molecular fingerprints." Advances in neural information processing systems. 2015.'
  merge: -1
  img_proc: true
