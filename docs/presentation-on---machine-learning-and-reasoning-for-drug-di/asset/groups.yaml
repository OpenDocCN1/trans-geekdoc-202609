    ## 药物发现的三个基本问题


    > 给定分子，它是药物吗？即属性/目标/效应预测。


    - 药物相似性

    - 它能调节的目标及程度

    - 口服或注射后的动力学、效应和代谢


    ## 给定目标，什么是分子？


    - 如果给出分子列表，挑选合适的一个。如果评估费用高，需要搜索，例如使用贝叶斯优化。


    - 如果未找到分子，需要从头生成 → 生成模型 + 贝叶斯优化，或强化学习。


    - 药物相似空间呈现怎样的形态？


