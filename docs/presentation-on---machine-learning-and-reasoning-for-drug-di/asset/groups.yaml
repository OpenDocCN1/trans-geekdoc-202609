  - '[PAGE 136]


    # Drug repurposing


    De novo drug discovery is costly, takes long time without guarantee of success


    Market for rare diseases is too small to warrant commercial development


    Urgent, new diseases like COVID-19 can’t wait


    Drug repurposing (aka drug repositioning, reprofiling or re-tasking) is one of
    the best ways to go.


    +   Finding new uses for approved or investigational drugs designed for other
    purposes.


    Reduced time and cost, Quicker to enter clinical trials compared to de novo drug
    discovery


    > Lee, Wing-Hin, et al. "The potential to treat lung cancer via inhalation of
    repurposed drugs." Advanced drug delivery reviews 133 (2018): 107-130.'
  - '[PAGE 137]


    # Approaches


    +   Signature matching, similarity-based (drug-disease, drug-drug, adverse effect
    profile)

    Detailed drug-protein binding prediction

    Pathway/network mapping → Knowledge graph inference, e.g., link prediction

    Retrospective clinical analysis from electronic health records


    > The general genomic layout and the general replication kinetics and the biology
    of the MERS, SARS and [SARS-CoV-2] viruses are very similar, so testing drugs
    which target relatively generic parts of these coronaviruses is a logical step.

    (Vincent Munster, Chief o US National Institutes of Health Viral Ecology Unit,
    as of Feb 2020)


    Pushpakom, Sudeep, et al. "Drug repurposing: progress, challenges and recommendations."
    Nature reviews Drug discovery 18.1 (2019): 41-58.'
  - '[PAGE 138]


    # Repurposing as multi-target prediction over molecular graph


    (a) A input graph with 4 nodes and 3 labels


    (b) Input node update


    (c) Label node update


    #REF: Do, Kien, et al. "Attentional Multilabel Learning over Graphs-A message
    passing approach." Machine Learning, 2019.'
  - '[PAGE 139]


    # Repurposing as drug-target prediction in biomedical knowledge graphs


    A knowledge graph is a set of triplets (head, tail, relation), where head and
    tail are node / entity, and relation is link type. E.g., head = protein, tail
    = drug, relation = drug-protein-binding.


    Typically a knowledge graph is incomplete, e.g., missing relations between any
    pair (head, tail).


    Repurposing is finding new links for existing nodes (drugs).


    The search typically starts from a target (e.g., a protein) to locate suitable
    drugs for further development (e.g., trials or optimization).'
