  - '[PAGE 19]


    # Neural representation of the world


    +   Vector → Embedding, MLP

    Sequence & Tree → RNN (LSTM, GRU), Tree-RNN

    Unordered set → Word2vec, Attention, Transformer

    Graph → GNN (node2vec, DeepWalk, GCN, Graph Attention Net, Column Net, MPNN etc)

    Grid is a special case → CNN (AlexNet, VGG, ResNet, EfficientNet, etc)

    Transformer is a special case of GNN on fully connected graph.'
  - '[PAGE 20]


    # Molecule → fingerprints


    ![](img/becaa13a45abf256713c782a26b8b29d_20_0.png)


    > Kadurin, Artur, et al. "The cornucopia of meaningful leads: Applying deep adversarial
    autoencoders for new molecule development in oncology." Oncotarget 8.7 (2017):
    10883.


    ![](img/becaa13a45abf256713c782a26b8b29d_20_1.png)


    > Molecular Descriptors. (2019, October 26). Retrieved September 14, 2021, from
    https://chem.libretexts.org/@go/page/192626


    Graph → hashing → vector. Mostly discrete. Substructures coded.


    Vectors are easy to retrieve & manipulate.


    +   Ready for use in classical ML algorithms (e.g., SVM, RF, kNN)


    Very difficult to reconstruct the graphs from fingerprints.'
  - '[PAGE 21]


    # (Circular) fingerprints can be learnt


    ```

    1: Input: molecule, radius R, fingerprint length S

    2: Initialize: fingerprint vector f ← 0_S

    3: for each atom a in molecule

    4: r_a ← g(a) ▷ lookup atom features

    5: for L = 1 to R ▷ for each layer

    6: for each atom a in molecule

    7: r₁ ... r_N = neighbors(a)

    8: v ← [r_a, r₁, ..., r_N] ▷ concatenate

    9: r_a ← hash(v) ▷ hash function

    10: i ← mod(r_a, S) ▷ convert to index

    11: f_i ← 1 ▷ Write 1 at index

    12: Return: binary vector f

    ```


    ```

    1: Input: molecule, radius R, hidden weights H₁¹ ... H_R⁵, output weights W₁ ...
    W_R

    2: Initialize: fingerprint vector f ← 0_S

    3: for each atom a in molecule

    4: r_a ← g(a) ▷ lookup atom features

    5: for L = 1 to R ▷ for each layer

    6: for each atom a in molecule

    7: r₁ ... r_N = neighbors(a)

    8: v ← r_a + Σᵢ₌₁ᴺ r_i ▷ sum

    9: r_a ← σ(vH_L^N) ▷ smooth function

    10: i ← softmax(r_aW_L) ▷ sparsify

    11: f ← f + i ▷ add to fingerprint

    12: Return: real-valued vector f

    ```


    ![](img/becaa13a45abf256713c782a26b8b29d_21_0.png)


    #REF: Duvenaud, David K., et al. "Convolutional networks on graphs for learning
    molecular fingerprints." Advances in neural information processing systems. 2015.'
  - '[PAGE 22]


    # Molecule → string


    SMILES = Simplified Molecular-Input Line-Entry System


    Ready for encoding/decoding with sequential models (seq2seq, MANN, RL).


    BUT ...


    +   - String → graphs is not unique!

    - Lots of string are invalid

    - Precise 3D information is lost

    - Short range dependencies in graph may become long range in string


    ![](img/becaa13a45abf256713c782a26b8b29d_22_0.png)


    ![](img/becaa13a45abf256713c782a26b8b29d_22_1.png)


    ![](img/becaa13a45abf256713c782a26b8b29d_22_2.png)


    ![](img/becaa13a45abf256713c782a26b8b29d_22_3.png)'
  - '[PAGE 23]


    # Molecule → graphs


    # No regular, fixed-size structures


    Graphs are permutation invariant:


    +   • #permutations are exponential function of #nodes

    • The probability of a generated graph G need to be marginalized over all possible
    permutations


    # Multiple objectives:


    +   • Diversity of generated graphs

    • Smoothness of latent space

    • Agreement with or optimization of multiple “drug-like” objectives'
  - '[PAGE 24]


    # Graphs are natural representation


    Molecule as graph: atoms as nodes, chemical bonds as edges


    Computing molecular properties as graph classification/regression


    Drug-target binding as graph-in-graph interaction


    Chemical-chemical interaction as graph-graph relation


    Molecular optimisation as graph edit/translation


    Chemical reaction as graph morphism'
  - '[PAGE 25]


    # Graph filtering: Refining node embedding


    ![](img/becaa13a45abf256713c782a26b8b29d_25_0.png)


    A ∈ {0,1}^{n×n}, X ∈ R^{n×d}


    Graph Filtering


    ![](img/becaa13a45abf256713c782a26b8b29d_25_1.png)


    A ∈ {0,1}^{n×n}, X_f ∈ R^{n×d_new}'
  - '[PAGE 26]


    # Prelim: Skip-gram


    # Loss function


    \frac{1}{T} \sum_{t=1}^T \sum_{-c\leq j\leq c, j\neq 0} \log p(w_{t+j}|w_t)


    # Negative sampling


    \log \sigma(v''_{wO}^\top v_{wI}) + \sum_{i=1}^k \mathbb{E}_{w_i \sim P_n(w)}
    \left[ \log \sigma(-v''_{w_i}^\top v_{wI}) \right]


    p(w_O|w_I) = \frac{exp\left(v''_{w_O}^\top v_{w_I}\right)}{\sum_{w=1}^W exp\left(v''_w^\top
    v_{w_I}\right)}


    ![](img/becaa13a45abf256713c782a26b8b29d_26_0.png)


    Predicting neighbors'
  - '[PAGE 27]


    # DeepWalk


    # Algorithm 1 DEEPWALK(G, w, d, γ, t)


    Input: graph G(V, E)

    window size w

    embedding size d

    walks per vertex γ

    walk length t


    Output: matrix of vertex representations Φ ∈ ℝ|V|×d


    +   1: Initialization: Sample Φ from U|V|×d

    2: Build a binary Tree T from V ← For Hierarchical Softmax

    3: for i = 0 to γ do

    4: O = Shuffle(V)

    5: for each vi ∈ O do ← Finding neighbours of each node

    6: Wi = RandomWalk(G, vi, t)

    7: SkipGram(Φ, Wi, w) ← Update embedding of this node

    8: end for

    9: end for'
  - '[PAGE 28]


    Similar to DeepWalk in using Skip-gram model for unsupervised learning.


    Only modifies the search for neighboring nodes that balance between BFS and DFS.


    Defines edge embedding based on node embedding


    +   Can solve link prediction problem


    > Grover, Aditya, and Jure Leskovec. "node2vec: Scalable feature learning for
    networks." Proceedings of the 22nd ACM SIGKDD international conference on Knowledge
    discovery and data mining. 2016.


    # 2nd order Random Walk


    ![](img/becaa13a45abf256713c782a26b8b29d_28_0.png)


    Consider random walk that just travelled edge (t, v). The walk will decide which
    is the next node x that it should go from v by computing π_vx


    π_vx = α_pq(t, x) · w_vx


    α_pq(t, x) = { 1/p if d_tx = 0

    1 if d_tx = 1

    1/q if d_tx = 2 }'
  - '[PAGE 29]


    # Graph convolutional nets


    # Data graph


    ![](img/becaa13a45abf256713c782a26b8b29d_29_0.png)


    # GCN update rule, vector form


    ```

    h_{v_i}^{(l+1)} = σ\left(\sum_j \frac{1}{c_{ij}} h_{v_j}^{(l)} W^{(l)}\right)

    ```


    # GCN update rule, matrix form


    ```

    f(H^{(l)}, A) = σ\left(\hat{D}^{-\frac{1}{2}} \hat{A} \hat{D}^{-\frac{1}{2}} H^{(l)}
    W^{(l)}\right)

    ```'
  - '[PAGE 30]


    # Graph attention networks


    ![](img/becaa13a45abf256713c782a26b8b29d_30_0.png)


    Figure 1: Left: The attention mechanism a(Wh_i, Wh_j) employed by our model, parametrized
    by a weight vector ā ∈ R^{2F''}. Right: An illustration of multi-head attention
    (with K = 3 heads) by node 1 on its neighborhood. Different arrow styles and colors
    denote independent attention computations. The aggregated features from each head
    are concatenated or average to obtain h̃''_1.


    Do, Kien, Truyen Tran, and Svetha Venkatesh. "Learning deep matrix representations."
    arXiv preprint arXiv:1703.01454 (2017).


    Veličković, Petar, et al. "Graph Attention Networks." International Conference
    on Learning Representations. 2018.'
  - '[PAGE 31]


    # Message passing GNN


    Relation graph


    ![](img/becaa13a45abf256713c782a26b8b29d_31_0.png)


    # Collecting messages


    m_i^{(k+1)} = \sum_{v_j \in N(v_i)} M_k (h_i^{(k)}, h_j^{(k)}, e_{ij})


    # Refining node embedding


    h_i^{(k+1)} = U_k (h_i^{(k)}, m_i^{(k+1)})


    ![](img/becaa13a45abf256713c782a26b8b29d_31_1.png)


    #REF: Pham, Trang, et al. "Column Networks for Collective Classification." AAAI.
    2017.


    Gilmer, Justin, et al. "Neural message passing for quantum chemistry." arXiv preprint
    arXiv:1704.01212 (2017)32'
  - '[PAGE 32]


    # Graph pooling & readout


    Graph pooling generates a smaller graph


    A ∈ {0,1}^{n×n}, X ∈ R^{n×d}


    A_p ∈ {0,1}^{n_p×n_p}, X_p ∈ R^{n_p×d_new}, n_p < n


    ![](img/becaa13a45abf256713c782a26b8b29d_32_0.png)'
  - '[PAGE 33]


    # RDMN: A graph processing machine


    ![](img/becaa13a45abf256713c782a26b8b29d_33_0.png)


    > #REF: Pham, T., Tran, T., & Venkatesh, S. (2018). Relational dynamic memory
    networks. arXiv preprint arXiv:1808.04247.'
  - '[PAGE 34]


    # Self-supervised representation learning for drugs


    Early works for node embedding: DeepWalk Node2vec


    BERT-like through masking and reconstruction of parts:


    +   - SMILES sequence: ChemBERTa

    - Molecule graph: GROVER


    Contrastive learning (local manifold smoothness):


    +   - Graph contrastive learning: GCC


    ![](img/becaa13a45abf256713c782a26b8b29d_34_0.png)


    > Le-Khac, Phuc H., Graham Healy, and Alan F. Smeaton. "Contrastive Representation
    Learning: A Framework and Review." arXiv preprint arXiv:2010.05113 (2020).'
