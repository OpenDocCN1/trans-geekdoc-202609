    机器学习与药物发现中的推理


    Truyen Tran, Thin Nguyen, and Tri Nguyen


    {truyen.tran, thin.nguyen, minhtri}@deakin.edu.au


    https://bit.ly/3Edqgz4


    ### 物流


    ![](img/becaa13a45abf256713c782a26b8b29d_1_0.png)


    Truyen Tran


    ![](img/becaa13a45abf256713c782a26b8b29d_1_1.png)


    Thin Nguyen


    ![](img/becaa13a45abf256713c782a26b8b29d_1_2.png)


    Tri Nguyen


    https://bit.ly/3Edqgz4


    ### 议程


    - A: 药物发现流程与机器学习任务的介绍

    - B1: 分子表示与性质预测

    - B2: 蛋白表示与蛋白-药物结合

    - C1: 分子优化与生成

    - C2: 知识图推理与药物合成


    ### Part A


    ### 药物发现流程与机器学习任务介绍


    ### 3 个 AI 行业转向药物发现，全球投资因疫情而激增。


    ### 按焦点领域划分的 AI 私人投资，2019 与 2020 对比


    ![](img/becaa13a45abf256713c782a26b8b29d_4_0.png)


    ### Eroom''s 法则（摩尔定律的倒数）


    ![](img/becaa13a45abf256713c782a26b8b29d_5_0.png)


    ### 药物发现与开发


    ![](img/becaa13a45abf256713c782a26b8b29d_6_0.png)


    ### 科学的第四范式


    ![](img/becaa13a45abf256713c782a26b8b29d_7_0.png)


    ![](img/becaa13a45abf256713c782a26b8b29d_7_1.png)


    Jim Gray, Turing Award 1998 (1944-2007) Honoured as father of The 4th Paradigm
    Image source: Wikipedia


    Agrawal, A., & Choudhary, A. (2016). Perspective: Materials informatics and big
    data: Realization of the “fourth paradigm” of science in materials science. Apl
    Materials, 4(5), 053208.


    ### 药物发现与开发


    ![](img/becaa13a45abf256713c782a26b8b29d_8_0.png)


    Drug is a small molecule that binds to a bio target (e.g., protein) and modifies
    its functions to produce useful physiological or mental effects.


    Proteins are large biomolecules consisting of chains of amino acid residues.


    ### 药物相似性


    - 水溶性和脂溶性，例如通过 LogP 测量。大多数药物口服 → 通过膜。

    - 对生物靶标的效力 → 靶向特异性结合。

    - 配体效率（低能耗结合）和脂溶性效率。

    - 分子量小 → 影响扩散


    1. 氢键供体不超过 5 个（氮-氢和氧-氢键的总数）

    2. 氢键受体不超过 10 个（所有氮或氧原子）

    3. 分子质量小于 500 道尔顿

    4. 辛醇-水分配系数（log P）不超过 5


    https://en.wikipedia.org/wiki/Lipinski%27s_rule_of_five


    Lipinski, Christopher A., et al. "Experimental and computational approaches to
    estimate solubility and permeability in drug discovery and development settings."
    Advanced drug delivery reviews 23.1-3 (1997): 3-25.


    ### IND: 研究新药; BLA: 生物制剂许可申请; NDA: 新药申请


    ![](img/becaa13a45abf256713c782a26b8b29d_10_0.png)


    - 识别疾病的致病因素或靶点

    - 识别药物兴趣（平均持续时间：5 年）


    Phase 0:

    - 药物性质评估（ADMET）

    - 体外试验（细胞模型）

    - 体内试验（动物模型或人体受试者）持续时间：1-3 年（平均：18 个月）


    Phase I：剂量毒性、药物安全性和动力学

    Phase II：药物疗效及联合药物测试

    Phase III：与标准疗法或安慰剂比较的药物（确认性临床试验）持续时间：2-10 年（平均：5 年）


    监测长期副作用


    > Réda, Clémence, Emilie Kaufmann, and Andrée Delahaye-Duriez. "Machine learning
    applications in drug development." Computational and structural biotechnology
    journal 18 (2020): 241-252.


    ### 药物发现中的推理


    推理是从已获知识在响应查询（或线索）时推导新知识。


    实用场景：(查询, 数据库, 答案) 三元组


    - 分类：查询 = 这是否为药物？数据库 = 药物的原子结构。

    - 回归：查询 = 该药物有多毒？数据库 = 药物。

    - QA：查询 = 自然语言问题。数据库 = 上下文/图像/文本。

    - 多任务学习：查询 = 任务 ID。数据库 = 药物/蛋白。

    - 零样本学习：查询 = 任务描述。数据库 = 数据。

    - 药物-蛋白结合：查询 = 药物。数据库 = 蛋白。

    - 推荐系统：查询 = 靶向（药物）。数据库 = {CCI, PPI, Drug-target, gene-diseases};


    ### 药物发现作为推理学习


    学习是通过经验自我改进，获取知识和技能。


    推理学习是提升知识库蕴含谓词的能力。


    例如，给定疾病和知识库，判断该药物是否具有治疗效果。


    请参阅我们 IJCAI''21 教程以获取更多细节：


    https://neuralreasoning.github.io


    ![](img/becaa13a45abf256713c782a26b8b29d_12_0.png)


    > (Dan Roth; ACM Fellow; IJCAI John McCarthy Award)


    Khardon, Roni, and Dan Roth. "Learning to reason." Journal of the ACM (JACM) 44.5
    (1997): 697-725.


    ### 药物发现的三个基本问题


    给定分子，它是药物吗？即性质/靶点/效应预测。


    - 药物相似性

    - 它能调节的靶点及其程度

    - 如果口服或注射，其动力学/动力学/效应/代谢


    给定靶点，什么分子？


    - 如果给出分子列表，挑选合适的一个。如果评估昂贵，需要搜索，例如使用贝叶斯优化。

    - 如果未找到分子，需要从头生成 → 生成模型 + 贝叶斯优化，或强化学习。

    - 药物相似空间呈现什么样？


    ### 我们需要强大的机器学习用于药物发现


    ### 表现能力


    - 能够表示生物医学世界的复杂性

    - 理想情况下，能够表示全部化学空间

    - 能计算任何可计算的内容


    ### 可学性


    - 具备从训练信号（或缺失信号）中学习的机制


    ### 一般化能力


    - 在未见过的数据上工作


    ### Part B1


    ### 分子表示学习


    - 指纹

    - 字符串表示

    - 图形表示

    - 自监督学习


    ### 分子性质预测


    - 近似量子化学计算

    - 图回归和分类

    - 图多任务学习

    - 解释

    - 数据高效学习

    '
