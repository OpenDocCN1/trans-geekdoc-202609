    # Repurposing as drug-target prediction in biomedical knowledge graphs


    A knowledge graph is a set of triplets (head, tail, relation), where head and
    tail are node / entity, and relation is link type. E.g., head = protein, tail
    = drug, relation = drug-protein-binding.


    Typically a knowledge graph is incomplete, e.g., missing relations between any
    pair (head, tail).


    Repurposing is finding new links for existing nodes (drugs).


    The search typically starts from a target (e.g., a protein) to locate suitable
    drugs for further development (e.g., trials or optimization).

