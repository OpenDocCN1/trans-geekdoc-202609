  - '[PAGE 102]


    # Exploring the space of drugs


    The space of drugs is estimated to be 1e+23 to 1e+60


    +   Only 1e+8 substances synthesized thus far.


    +   It is impossible to model this space fully.


    The current technologies for graph generations are constantly refined.


    +   Search-based: Start from somewhere, search for better graphs (need no data,
    but need reliable graph evaluator)


    +   Generative models: Build an ambitious model of the chemical space (needs lot
    of data).


    +   Combination of both.'
