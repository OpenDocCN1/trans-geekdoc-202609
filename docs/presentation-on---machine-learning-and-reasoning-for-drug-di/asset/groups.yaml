    - 例如虚拟筛选和先导化合物优化

    - 分子属性

    - 结合亲和力

    - 对细胞表达有影响

    - 毒性、ADME 性质（吸收、分布、代谢和排泄）

    - 与其他分子相互作用

    - 易于合成


    ## 分子活性预测


    Collecting messages


    m_i^{(k+1)} = \sum_{v_j \in N(v_i)} M_k \left( h_i^{(k)}, h_j^{(k)}, e_{ij} \right)


    Refining node embedding


    h_i^{(k+1)} = U_k \left( h_i^{(k)}, m_i^{(k+1)} \right)


