  - '[PAGE 8]


    Drug discovery is the process through which potential new medicines are identified.
    It involves a wide range of scientific disciplines, including biology, chemistry
    and pharmacology (Nature, 2019).


    ![](img/becaa13a45abf256713c782a26b8b29d_8_0.png)


    Drug is a small molecule that binds to a bio target (e.g., protein) and modifies
    its functions to produce useful physiological or mental effects.


    Proteins are large biomolecules consisting of chains of amino acid residues.'
  - '[PAGE 9]


    # Drug-likeness


    +   - Solubility in water and fat, e.g., measured by LogP. Most drugs are admitted
    orally → pass through membrane.

    - Potency at the bio target → target-specific binding.

    - Ligand efficiency (low energy binding) and lipophilic efficiency.

    - Small molecular weight → affect diffusion


    +   1. No more than 5 hydrogen bond donors (the total number of nitrogen– hydrogen
    and oxygen–hydrogen bonds)

    2. No more than 10 hydrogen bond acceptors (all nitrogen or oxygen atoms)

    3. A molecular mass less than 500 daltons

    4. An octanol-water partition coefficient (log P) that does not exceed 5


    https://en.wikipedia.org/wiki/Lipinski%27s rule of five


    Lipinski, Christopher A., et al. "Experimental and computational approaches to
    estimate solubility and permeability in drug discovery and development settings."
    Advanced drug delivery reviews 23.1-3 (1997): 3-25.'
  - '[PAGE 10]


    # IND: Investigational New Drug BLA: Biologics License Application NDA: New Drug
    Application


    ![](img/becaa13a45abf256713c782a26b8b29d_10_0.png)


    +   - Identification of disease causal factors or targets

    - Identification of drug of interest (average duration: 5 yrs)


    +   Phase 0:

    - Assessment of drug properties (ADMET)

    - In Vitro Trials (cellular models)

    - In Vivo Trials (animal models or human subjects) duration: 1-3 years (average:
    18 mo.)


    +   Phase I dose-toxicity & drug safety and kinetics

    Phase II drug efficacy & testing drug combinations

    Phase III drug comparison with standard-of-care drug or placebo (confirmatory
    clinical trial) duration: 2-10 years (average: 5 yrs)


    # monitoring long-lasting side effects


    > Réda, Clémence, Emilie Kaufmann, and Andrée Delahaye-Duriez. "Machine learning
    applications in drug development." Computational and structural biotechnology
    journal 18 (2020): 241-252.'
  - '[PAGE 11]


    # Drug discovery as reasoning


    Reasoning is to deduce new knowledge from previously acquired knowledge in response
    to a query (or a cues)


    Practical setting: (query, database, answer) triplets


    +   Classification: Query = Is this a drug? Database = atomic structure of drug.

    Regression: Query = how toxic is this drug? Database = drug.

    QA: Query = NLP question. Database = context/image/text.

    Multi-task learning: Query = task ID. Database = drug/protein.

    Zero-shot learning: Query = task description. Database = data.

    Drug-protein binding: Query = drug. Database = protein.

    Recommender system: Query = Target (drug). Database = {CCI, PPI, Drug-target,
    gene-diseases};'
  - '[PAGE 12]


    # Drug discovery as learning to reason


    Learning is to improve itself by experiencing ~ acquiring knowledge & skills


    Learning to reason is to improve the ability to decide if a knowledge base entails
    a predicate.


    E.g., given a disease and a knowledge base, determines if a drug will have treatment
    effect.


    See our IJCAI''21 tutorial for more detail:


    https://neuralreasoning.github.io


    ![](img/becaa13a45abf256713c782a26b8b29d_12_0.png)


    > (Dan Roth; ACM Fellow; IJCAI John McCarthy Award)


    Khardon, Roni, and Dan Roth. "Learning to reason." Journal of the ACM (JACM) 44.5
    (1997): 697-725.'
  - '[PAGE 13]


    # The three basic questions in drug discovery


    Given a molecule, is this drug? Aka properties/targets/effects prediction.


    +   - Drug-likeness

    - Targets it can modulate and how much

    - Its dynamics/kinetics/effects/metabolism if administered orally or via injection


    # Given a target, what are molecules?


    +   - If the list of molecules is given, pick the good one. If evaluation is expensive,
    need to search, e.g., using Bayesian Optimization.

    - If no molecule is found, need to generate from scratch → generative models +
    Bayesian Optimization, or Reinforcement Learning.

    - How does the drug-like space look like?


    # Given a molecular graph, what are the steps to make the molecule?


    +   - Synthetic tractability

    - Reaction planning, or retrosynthesis'
  - '[PAGE 14]


    # We need powerful machine learning for drug discovery


    # Expressiveness


    +   Can represent the complexity of the biomedical world


    +   Ideally, can represent all the chemical space


    +   Can compute anything computable


    # Learnability


    +   Have mechanism to learn from the training signals (or lack of)


    # Generalizability


    +   Work on unseen data'
  - '[PAGE 15]


    # Will neural networks be suitable for drug-discovery reasoning?


    Reasoning is not necessarily achieved by making logical inferences


    There is a continuity between [algebraically rich inference] and [connecting together
    trainable learning systems]


    Central to reasoning is composition rules to guide the combinations of modules
    to address new tasks


    > When we observe a visual scene, when we hear a complex sentence, we are able
    to explain in formal terms the relation of the objects in the scene, or the precise
    meaning of the sentence components. However, there is no evidence that such a
    formal analysis necessarily takes place: we see a scene, we hear a sentence, and
    we just know what they mean. This suggests the existence of a middle layer, already
    a form of reasoning, but not yet formal or logical.


    ![](img/becaa13a45abf256713c782a26b8b29d_15_0.png)'
  - '[PAGE 16]


    # On suitability of deep learning for drug discovery


    # Theoretical


    +   Expressiveness: Neural nets can approximate any function.


    +   Learnability: Neural nets are trained easily.


    +   Generalisability: Neural nets generalize surprisingly well to unseen data.


    # Practical


    +   Generality: Applicable to many domains.


    +   Competitive: DL is hard to beat as long as there are data to train.


    +   Scalability: DL is better with more data, and it is very scalable.'
