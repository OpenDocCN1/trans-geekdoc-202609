    Graphs are expressive but difficult. Strings are easier, but can model invalid
    molecules.


    Junction tree is a way to build a "thick-tree" out of a graph


    # Cluster vocab:


    +   - rings

    - bonds

    - atoms


    > Jin, W., Barzilay, R., & Jaakkola, T. (2018). Junction Tree Variational Autoencoder
    for Molecular Graph Generation. ICML''18.


    ![](img/becaa13a45abf256713c782a26b8b29d_116_0.png)


    Page 117:


    [PAGE 117]


    # Algorithm 2 Tree decomposition of molecule G = (V, E)


    V1 ← the set of bonds (u, v) ∈ E that do not belong to any rings.


    V2 ← the set of simple rings of G.


    for r1, r2 in V2 do


    Merge rings r1, r2 into one ring if they share more than two atoms (bridged rings).


    end for


    V0 ← atoms being the intersection of three or more clusters in V1 ∪ V2.


    V ← V0 ∪ V1 ∪ V2


    E ← {(i, j, c) ∈ V × V × ℝ | |i ∩ j| > 0}. Set c = ∞ if i ∈ V0 or j ∈ V0, and
    c = 1 otherwise.


    Return The maximum spanning tree over cluster graph (V, E).


    | Method | Reconstruction | Validity |

    | CVAE | 44.6% | 0.7% |

    | GVAE | 53.7% | 7.2% |

    | SD-VAE² | 76.2% | 43.5% |

    | GraphVAE | - | 13.5% |

    | JT-VAE | 76.7% | 100.0% |


    > Jin, W., Barzilay, R., & Jaakkola, T. (2018). Junction Tree Variational Autoencoder
    for Molecular Graph Generation. ICML''18.


    Page 118:


    [PAGE 118]


    # GraphRNN


    A case of graph dynamics: nodes and edges are added sequentially.


    Solve tractability using BFS


    > You, Jiaxuan, et al. "GraphRNN: Generating realistic graphs with deep auto-regressive
    models." ICML (2018).


    ![](img/becaa13a45abf256713c782a26b8b29d_118_0.png)


    Figure 1. GraphRNN at inference time. Green arrows denote the graph-level RNN
    that encodes the "graph state" vector h_i in its hidden state, updated by the
    predicted adjacency vector S_i^π for node π(v_i). Blue arrows represent the edge-level
    RNN, whose hidden state is initialized by the graph-level RNN, that is used to
    predict the adjacency vector S_i^π for node π(v_i).


    Page 119:


    [PAGE 119]


    # Problems with VAE + BO style


    It is still an interpolation problem


    Searching beyond the high density region in the training data will result really
    bad generation.


    We need a more intrinsic exploration strategy


    +   Compositionality


    +   Grammar/syntax


    +   Network that generates generative networks (on going)


    Page 120:


    [PAGE 120]


    # Grammar VAE


    Proposed method


    +   1) Define a grammar

    2) Take a valid sequence and parse it into a sequence of production rules

    3) Learn a VAE that produces sequences of grammar production rules

    4) Use this VAE to generate valid sequences of production rules

    5) Applying these rules in order will yield the original sequence


    > Kusner, Matt J., Brooks Paige, and José Miguel Hernández-Lobato. "Grammar variational
    autoencoder." International Conference on Machine Learning. PMLR, 2017.


    Page 121:


    [PAGE 121]


    # Encoding


    # Grammar VAE (2)


    [PAGE 122]


    # Decoding


    # Grammar VAE (3)


    ![](img/becaa13a45abf256713c782a26b8b29d_122_0.png)


    Page 123:


    [PAGE 123]


    # Other works


    Shi, Chence, et al. "GraphAF: a Flow-based Autoregressive Model for Molecular
    Graph Generation." International Conference on Learning Representations. 2019.


    Mahmood, Omar, et al. "Masked graph modeling for molecule generation." Nature
    communications 12.1 (2021): 1-12.


