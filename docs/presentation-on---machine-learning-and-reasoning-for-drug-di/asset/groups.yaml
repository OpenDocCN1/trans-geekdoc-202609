    clinical trial) duration: 2-10 years (average: 5 yrs)


    monitoring long-lasting side effects


    > Réda, Clémence, Emilie Kaufmann, and Andrée Delahaye-Duriez. "Machine learning
    applications in drug development." Computational and structural biotechnology
    journal 18 (2020): 241-252.


    ### Drug discovery as reasoning


    Reasoning is to deduce new knowledge from previously acquired knowledge in response
    to a query (or a clues)


    Practical setting: (query, database, answer) triplets


    - Classification: Query = Is this a drug? Database = atomic structure of drug.

    - Regression: Query = how toxic is this drug? Database = drug.

    - QA: Query = NLP question. Database = context/image/text.

    - Multi-task learning: Query = task ID. Database = drug/protein.

    - Zero-shot learning: Query = task description. Database = data.

    - Drug-protein binding: Query = drug. Database = protein.

    - Recommender system: Query = Target (drug). Database = {CCI, PPI, Drug-target,
    gene-diseases};


    ### Drug discovery as learning to reason


    Learning is to improve itself by experiencing ~ acquiring knowledge & skills


    Learning to reason is to improve the ability to decide if a knowledge base entails
    a predicate.


    E.g., given a disease and a knowledge base, determines if a drug will have treatment
