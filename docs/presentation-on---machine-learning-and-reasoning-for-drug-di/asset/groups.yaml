  - '[PAGE 43]


    # Quantum chemistry


    In chemistry we mostly need to know about electronic structure (e.g., electron
    density and electronic energy).


    The density can be inferred from the wave function. But solving wave equation
    is very difficult.


    Density Functional Theory (DFT): electron density is a function of space and time.


    +   - Hohenburg-Kohn theorem: the density of any system determines its ground-state
    properties.

    - Electron density functional → total energy of our system.


    ![](img/becaa13a45abf256713c782a26b8b29d_43_0.png)


    > Aspuru-Guzik, Alán, Roland Lindh, and Markus Reiher. "The matter simulation
