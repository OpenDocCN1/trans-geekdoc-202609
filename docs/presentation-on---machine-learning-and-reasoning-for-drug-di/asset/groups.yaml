    # TransE: Translational embedding of relations (link types)


    Head, tail and relation are typically embedded as vectors in the same space.


    > E(h, r, t) = ||h + r - t||_{1/2}


    TransE assumes a triplet has small translation distance from head to tail via
    relation, captured as an triplet energy.


    Loss function in TransF: minimize energy of the known triplets, separate it from
    energies of corrupted triplets by a margin.


    > L = \sum \sum [E(h, r, t) + \gamma - E(h'', r'', t'')]_+'
  - '[PAGE 141]


    # TransF: Translation in the relation-projected space


    ```

    M_{r,h} = \sum_{i=1}^s \alpha_r^{(i)} \mathbf{U}^{(i)} + \mathbf{I}

    ```


    ```

    M_{r,t} = \sum_{i=1}^s \beta_r^{(i)} \mathbf{V}^{(i)} + \mathbf{I}

    ```


    TransF utitlises relation-specific projection of head and tail.


    ```

