  - '[PAGE 71]


    # Protein 3D structure prediction


    +   • Input: protein amino acid sequence X = (x₁ x₂ ... x_L) where L is protein
    sequence length, x_i is residue type at position i.


    +   Output: the 3D coordinate of residues in protein sequence.


    ![](img/becaa13a45abf256713c782a26b8b29d_71_0.png)


    ![](img/becaa13a45abf256713c782a26b8b29d_71_1.png)


    > "#REF: "Hemoglobin", En.wikipedia.org, 2020. [Online]. Available: https://en.wikipedia.org/wiki/Hemoglobin."'
  - '[PAGE 72]


    # Approaches


    +   Template-based


    +   Using known structure of proteins that have high sequence similarity with
    target protein as the initial structure template.


    +   From the the initial structure, protein fragments are inserted or deleted
    to minimize the global free energy.


    +   An effective method if the target protein sequence has at least 30% sequence
    identity with the template protein.


    +   Template-free


    +   Without using solved protein structure


    +   Main goal is to find a conformation that has minimum free energy


    +   Require a vast computational resource such as powerful super computer or distributed
    computing projects (Rosetta@Home, Folding@Home)'
  - '[PAGE 73]


    # AlphaFold


    +   State-of-the-art in protein structure prediction


    +   Template-free approach


    +   Construct a potential mean force which can accurately describe the protein
    3D structure


    ![](img/becaa13a45abf256713c782a26b8b29d_73_0.png)


    The pipeline of AlphaFold to predict the 3D structure of a protein sequence'
