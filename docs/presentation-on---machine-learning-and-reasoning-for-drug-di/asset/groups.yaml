    ## 量子化学


    在化学中，我们主要需要了解电子结构（例如电子密度和电子能量）。


    密度可以从波函数推断。但求解波方程非常困难。


    密度泛函理论 (DFT)：电子密度是空间和时间的函数。


    [Image placeholder omitted]


    > Aspuru-Guzik, Alán, Roland Lindh, and Markus Reiher. "物质模拟 (r) 的演变". ACS central
    science 4.2 (2018): 144-152.


