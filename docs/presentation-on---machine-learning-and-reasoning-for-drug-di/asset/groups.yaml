    # Background on protein


    Proteins are large biomolecules.


    Long chains of amino acids (residue). There are 20 types of amino acids.


    Residues are attracted to each other by physical and chemical forces.


    Residue chain folds to form the 3D structure.


    Proteins 3D structure determine their function.


    Performing many different functions in the organisms such as transportation (hemoglobin),
    hormonal (insulin), protection (immunoglobulin), etc.


