    # 3.5. Task transfer learning


    The core symptom of general anxiety disorder is chronic, excessive, and uncontrolled
    worry (Rowa and Antony, 2008), which is reflected in individuals'' behavioural
    patterns. Previous studies have shown the positive impact of regular activity
    on patients'' anxiety-related outcomes (Anderson and Shivakumar, 2013; Aylett
    et al., 2018). Therefore, it is reasonable to expect that we can apply the above-defined
    pipeline to predict GAD-7 outcomes from the same behavioural biomarkers. However,
    in this case, we are facing a significantly smaller labelled sample size, which
    makes it difficult for such complex models to learn to generalise well to unseen
    OOD data instead of simply overfitting the training set. Therefore, we propose
    fine-tuning the model trained on the WHODAS 2.0 outcome prediction task to predict
    the GAD-7 scores. This way, the new task can be learned by transferring knowledge
    from a related task that has already been learned (Olivás et al., 2009).


    # 4. Results


    # 4.1. Finding the model architectures


    After analysing the elbow points of both the AIC and BIC information criteria,
    we found that five hidden components best captured the data''s underlying patterns.
    Therefore, we used that HMM in the following experiments to infer the most probable
    state sequence for each daily data sequence and impute the missing observations
    from samples generated from the corresponding state each time a mini-batch is
    loaded, as described in 2.4.1.


    The hyper-parameter tuning resulted in the following architecture:


    +   - Time2Vec with embedding dimension 4 and sine activation

    +   - 2-layer uni-directional LSTM blocks with 64 recurrent units each, incorporating
    0.1 recurrent dropout rate in each block


    # 4.2. Baseline, ablation and temporal pre-training


