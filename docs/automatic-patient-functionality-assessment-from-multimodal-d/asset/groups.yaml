    ## 基于深度学习技术的多模态数据自动患者功能评估——开发与可行性评估


    Emese Süke, Santiago de Leon-Martinez, Pablo M. Olmos, Antonio Artés


    a 信号理论与通信系，卡洛斯三世马德里大学，马德里大学大道30号，莱加内斯28911，马德里，西班牙

    b 信息技术学院，布尔诺理工大学，布尔诺，捷克共和国

    c Kempelen智能技术研究所，布拉提斯拉瓦，斯洛伐克

    d Gregorio Marañón健康研究所，马德里28009，西班牙

    e eB2 - 基于证据的行为，莱加内斯28919，西班牙


    ## 文章信息


    **关键词：**

    - 原位患者监测

    - 数字表型

    - 生态瞬时评估

    - 时间序列建模

    - 注意力模型

    - 迁移学习


    ## 摘要


    可穿戴设备和移动传感器可以不显眼地实时收集丰富的生理和行为数据来源。与传统面对面评估或基于问卷的生态瞬时评估（EMA）方法不同，这些数据来源为远程患者监测开辟了许多可能性。然而，由于数据噪声大且观测值经常缺失，定义稳健模型具有挑战性。


    本文提出了一种基于注意力的长短期记忆（LSTM）神经网络流水线，用于基于此类数字生物标志物的WHODAS 2.0评估预测行动能力障碍。此外，我们利用隐马尔可夫模型解决了缺失观测问题，并通过迁移学习包含未标记样本信息的可能性。我们利用在野外收集的两个可穿戴/移动传感器数据集以及患者的人口社会学信息验证了我们的方法。


    我们的结果表明，在WHODAS 2.0行动能力障碍预测任务中，所提流水线优于先前的基线，并且通过注意力热图还提供了可解释性。此外，通过任务迁移学习使用更小的队列，相同的模型可以学习根据GAD-7评分准确预测广泛性焦虑障碍严重程度。


    ## 1. 引言


    ### 1.1. 背景


    移动设备及其先进传感器的普及，允许实时被动收集生理和行为数据，例如步数、位置、睡眠和手机使用情况，这为心理健康研究开辟了新途径（Froehlich et al.,
    2007; Cornelius et al., 2008; Kukkonen et al., 2009）。通过监测身体活动、社交互动和心理健康生物标志物，移动感应能够对患者的功能和福祉进行连续、不显眼的评估，提供改善护理及时性、治疗依从性和健康结局的机会，同时尽量减少参与者负担和回顾偏差（Noah
    et al., 2018）。为了建立收集、处理和分析行为传感器数据的可靠框架，近期研究专注于监测和诊断数据来源，并开发用于准确有效预测的稳健模型（Jara
    et al., 2013; Mohr et al., 2014; Sakr and Elgammal, 2016）。基于移动感应和可穿戴数据来源，可以构建各种健康监测系统，例如人体活动和姿态监测、总体福祉、老年人跌倒监测和帕金森病管理等（Miranda
    et al., 2022）。基于手机的干预措施也被提出作为早期预防方法，以减轻精神疾病相关的疾病负担（Goldberg et al., 2022）。此类框架对于患者行动能力障碍演变的被动随访将非常有价值。行动能力障碍是指一个人独立移动和进行身体活动能力的限制。它可能由多种因素引起，例如老龄化、慢性疾病和损伤。行动能力障碍会对个人的日常生活产生显著影响，导致身心健康下降、社交互动减少和医疗费用增加。文献中可以找到使用机器学习、统计建模和临床评估等各种方法预测行动能力障碍的研究。然而，主要关注群体通常是老年人（Demiris
    et al., 2004; Van Grootven et al., 2020）。此外，现有方法是从智能家居环境中收集的数据获得的。


    我们之前的工作（Süke et al., 2022）考察了基于世界卫生组织残疾评估量表（WHODAS 2.0）预测患者功能结局的可行性，利用被动收集的数字生物标志物作为回归模型的输入。我们通过从30天长的时间序列数据序列中提取统计指标（最小值、最大值、均值、中位数、标准差、IQR）进行特征工程，随后采用简单的线性回归，以保持生物标志物特征作为预测因素的简单性和可解释性。深度学习模型在许多预测任务中已被证明成功（LeCun
    et al., 2015），包括移动感应（Servia-Rodríguez et al., 2017; Yao et al., 2017; Bahador
    et al., 2021），并可用于心理健康结局预测。


    ### 1.2. 目标


    我们的目标是开发一个综合的深度学习框架，通过整合数字生物标志物和人口社会学数据来预测功能性行动能力障碍。由于移动感应数据的噪声和缺失特性，我们将采用适当的时间序列模型和插补技术来捕捉数据中的底层模式。此外，纳入人口社会学数据可以显著提高模型性能，因为它能提供与个人功能强相关的信息。基于患者群体的共享行为模式，此类数据可以有效捕捉人类移动的复杂性。


    此外，我们建议采用一种简单的任务迁移学习方法，对模型进行微调以预测焦虑结局。焦虑会显著影响个人的行为、情绪和思维，进而影响其日常活动（Al-Lawati et
    al., 2000; Roemer and Orsillo, 2002）。它还会降低动机，阻止个人参与身体活动（Otto and Smits, 2011;
    W. H. Organization, 2022）。因此，我们假设移动描述变量可以有效预测焦虑结局。


    我们的贡献包括以下内容：

    - 一种基于隐马尔可夫模型（HMM）的方法，用于在不采用经典插补技术的情况下处理缺失观测，

    - 一种结合自注意力方法与长短期记忆（LSTM）网络的深度神经网络模型，用于获取随时间变化的患者嵌入，

    - 以及一个可使用迁移学习技术进行训练的通用多模态流水线，用于建模问卷结局


    ## 2. 材料与方法


    ### 2.1. 数据集


    #### 2.1.1. 研究参与者


    本研究使用的数据收集自两项正在进行的研究（Barrigón et al., 2017; Berrouiguet et al., 2018），涉及对临床门诊患者的被动智能手机监测。这些研究已获得希门尼斯·迪亚斯基金会医院精神科机构审查委员会的批准。所有参与者均提供了书面知情同意。


    #### 2.1.2. 纳入标准


    本研究招募了年龄至少18岁且为上述机构的精神障碍临床门诊患者或正在参加治疗组的患者。为参与，患者必须拥有运行Android或iOS操作系统的智能手机，并至少每周使用一次该手机连接Wi-Fi网络。仅纳入提供书面知情同意的患者，且他们未参与获得报酬。


    #### 2.1.3. 数据来源


    参与者的被动数据使用eB2 Mindcare（eb2 evidence-based behaviour, n.d.; Bonilla-Escribano et
    al., 2019; Carretero et al., 2020）收集，这是一个经过临床用途验证的电子健康平台。该应用在个人智能手机后台运行，提供心理健康电子日记。数据包括四个被动收集的观测值的48份每日半小时汇总，即步数、行进距离、在家时间和运动时间。本工作所用数据收集于2016年1月至2022年4月的2348名个体，共516,604条记录，其中31.5
    %收集于2019年。然而，最终数据集存在大量缺失观测值，每个变量的总体缺失率均超过60 %（详情见补充图A.1和A.2）。缺失可能由传感器采样频率不同，或由于技术和行为因素（例如忘记给手机充电、禁用GPS或卸载研究应用）导致传感器未收集数据所致。


    在患者入组时，使用*MeMind*工具（Barrigón et al., 2017; Muñoz-Navarro et al., 2017）记录了人口社会学信息（如年龄、性别、同居状况和就业状况）以及*功能评估*问卷的初始完成情况和相应得分。随访得分在面对面预约或电话访问中每半年记录一次（Fig.
    1.A）。我们关注的两个健康结局是世界卫生组织残疾评估量表2.0（*WHODAS 2.0*）（McKibbin et al., 2004）和*广泛性焦虑障碍7项量表（*GAD-7*）*（Spitzer
    et al., 2006）得分。


    WHODAS 2.0问卷包含36个条目，用于评估6个领域的残疾：认知、行动能力、自我照料、人际交往、生活活动和参与。要求患者报告过去30天内在各领域执行任务时遇到的困难，并评定困难程度。得分范围为0至100
    %，数值越高表示残疾程度越高。功能障碍类别可在不同截断点定义，如（de Pedro-Cuesta et al., 2013）所述。GAD-7筛查工具是一个7条目的问卷，用于评估广泛性焦虑障碍的严重程度，得分范围为0至21。轻度、中度和重度焦虑的截断点分别为5、10和15，得分10或以上表明需要进一步评估（Spitzer
    et al., 2006）；因此，我们考虑使用此截断值对GAD-7结局进行二分法分类。


    来自两项研究的2011名患者子组接受了感兴趣结局的临床评估。Table 1概述了两组研究中基线时人口社会学信息的分布以及心理健康结局得分。


    在A组研究中，417名患者有两条或更多记录，161名患者得分变化一次，2名患者在研究期间得分变化两次。在二分法情况下，这对应于54名患者仅有一次变化。


    ### 2.2. 数据预处理


    #### 2.2.1. 输入数据


    为构建分类任务的输入数据集，我们为每个目标标签条目裁剪了30天窗口的数据序列（Fig. 1.B）。对于基线得分，由于其在研究入组时登记，我们考虑接下来30天的观测，因为之前未收集移动感应数据。对于随访得分（通常每半年收集一次），我们将30天窗口中心放在围绕得分囊括最完整观测序列的位置。


    就人口社会学协变量而言，分类数据采用了独热编码。同时，患者年龄被分为十个类别，然后进行独热编码。我们引入了一个额外类别，以指示未报告协变量的缺失情况。


