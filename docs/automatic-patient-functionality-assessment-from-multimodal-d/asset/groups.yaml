    ## 2.3. 拟议流水线


    本节介绍了我们拟议的流水线，用于在功能性估计中利用被动感知的时间序列序列和社会人口统计数据。图 2 展示了我们方法的框架，包括用于数据插值的 HMM、基于
    LSTM 和自注意的时序编码器，以及与静态协变量拼接的时序嵌入上充当逻辑回归器的稠密层。用于生成本文中所展示结果的代码可在以下 GitHub 仓库中获得：https://github.com/mlfpm/functionality_prediction。


    ### 2.3.1. 处理缺失数据


    缺失观测是可穿戴设备和智能手机收集的数据中常见的问题。它们可能由于不同程度的依从性行为、传感器故障或未收集而发生 (Kiang et al., 2021)。鉴于缺失数据的高比例，使用均值、中位数甚至插值等统计量进行插值是不足的，因为它们低估了方差并忽略了变量之间的关系
    (Jäger et al., 2021)。插值后的值无法推广到可穿戴设备特征或参与者行为，可能会减少数据集的变异性并引入偏差。概率生成模型，如隐马尔可夫模型
    (HMMs) (Rabiner, 1989) 可以通过调整模型参数以最好地解释数据来最大化证据，从而学习数据集中的潜在分布，即使存在缺失数据 (Speekenbrink
    and Visser, 2021)。


    被假定为由一阶马尔可夫链过程生成。HMM 的可学习参数包括初始状态概率分布、状态转移概率分布和符号发射概率分布。它们可以使用期望-最大化 (EM) (Moon,
    1996) 算法和边缘化进行无监督训练，以处理缺失数据。


    仅将至少有 80% 观测值的 48 槽位每日患者序列视为 HMM 训练对象。需要注意的是，顺序数据被充分用于 HMM，我们并不将序列仅限制于 30 天窗口。经过这一筛选过程，91,047
    个序列被用于训练具有不同隐藏状态数量 n = {2, 3, ... 23} 的 HMM。最佳模型是使用贝叶斯和赤池信息准则 (Dridi and Hadzic,
    2018) 在随机选择的包含不同缺失情况的 10,000 个序列子集上选定。基于该模型，我们在小批量随机梯度下降过程中重复插值缺失观测值。每次生成新的数据批次时，序列都会使用维特比算法
    (Forney, 1973) 进行解码，缺失观测值则由相应最可能状态生成的样本进行插值。


    ### 2.3.2. 预测模型


    我们的拟议流水线如图 2 所示。它通过应用 Time2Vec (Kazemi et al., 2019) 对每日信息进行特征编码，接着是两个带有自注意 (Vaswani
    et al., 2017) 的 LSTM (Hochreiter and Schmidhuber, 1997) 编码器，用于 30 天输入序列。然后，在第二个注意层的输出上叠加前馈层，并与社会人口统计数据拼接，以获得预测。


    Time2Vec 为时间提供了与模型无关的向量表示。它由周期性激活函数和线性项组成，可以捕捉时间序列信号的周期性以及依赖于时间的非周期性模式。在数学上，对于给定的时间标量标记
    τ，表示为 t2v(τ) 的 τ 的 Time2Vec 是大小为 k + 1 的向量，定义为：如果 i = 0，则 t2v(τ)[i] = ω_i τ +
    φ_i；如果 1 ≤ i ≤ k，则 t2v(τ)[i] = F(ω_i τ + φ_i)。这里 t2v(τ)[i] 是 t2v(τ) 的第 i 个元素，F
    是周期性激活函数，而 ω_i 和 φ_i 参数是可学习的。


    LSTM 层将输入序列编码为固定长度的内部表示。相比之下，注意层学习进行选择性关注，并将其与输出中的项目相关联。虽然这增加了模型的计算负担，但它会产生一个更具针对性且性能更好的模型。此外，模型还可以展示在预测输出时如何对输入序列进行关注。


    理解输入与输出之间的关系，即一天中的哪些时段模式和一个月中的哪些时段模式有助于模型做出正确预测，由于涉及大量非线性操作而变得复杂。因此，我们使用自注意权重来解释输入信号在功能性评估任务中的重要性。我们将自注意可视化为热图，以了解特征和时间的总体重要性。除了理解哪些时段模式有助于结果之外，这些自注意权重还可以提供关于随时间变化的相关变化的见解，这对于判断患者状态的恶化至关重要。


