    # 2.3.1. Dealing with missing data


    Missing observations form a common problem with data collected from wearable devices
    and smartphones. They can occur due to varying degrees of compliance behavior,
    sensor failure, or non-collection (Kiang et al., 2021). Given the high percentage
    of missing data, imputation using statistical measures such as the mean, median,
    or even interpolation is insufficient, as they underestimate the variance and
    ignore the relationship between variables (Jäger et al., 2021). The imputed values
    would not generalise to wearable characteristics or participant behavior, can
    reduce variability in the data set, and introduce bias. Probabilistic generative
    models, such as hidden Markov models (HMMs) (Rabiner, 1989) can learn the underlying
    distributions in a data set by adjusting the model parameters to best account
    for the data to maximise the evidence, even in the presence of missing data (Speekenbrink
    and Visser, 2021).


    are assumed to have been generated by a first-order Markov chain process. The
    learnable parameters of an HMM comprise an initial state probability distribution,
    a state transition probability distribution, and a symbol emission probability
    distribution. They can be trained unsupervised using the expectation-maximisation
    (EM) (Moon, 1996) algorithm and marginalisation to deal with the missing data.


    Only those 48-slot daily patient sequences with at least 80 % of observations
    were considered for HMM training. It is important to note that the sequential
    data is fully leveraged for the HMM, and we do not just restrict the sequences
    to the 30-day windows. After this elimination process, 91,047 sequences were used
    to train the HMMs with different numbers of hidden states n = {2, 3, ... 23}.
    The best model was selected using the Bayesian and Akaike information criteria
    (Dridi and Hadzic, 2018) on a randomly selected subset of 10,000 sequences with
    varying missingness. Given this model, we imputed the missing observations repeatedly
    during the mini-batch stochastic gradient descent. Every time a new batch of data
    was generated, the sequences were decoded using the Viterbi algorithm (Forney,
    1973), and the missing observations were imputed by samples generated from the
    corresponding most probable state.


