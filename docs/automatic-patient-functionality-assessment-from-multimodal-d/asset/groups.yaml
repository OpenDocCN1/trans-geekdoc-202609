    # 5. Discussion


    # 5.1. Principal results


    This work tackled common problems in modelling mental health outcomes from passively
    sensed digital biomarkers. In this case, the data was passively collected with
    mobile phones, which have inherent limitations in sensor technology (they are
    not designed for research quality), leading to noisy and missing data. However,
    they are the ideal device for data collection, as most people carry a mobile phone
    throughout their day. Thus, if these limitations can be overcome, it provides
    a promising way to passively collect data without any subject interaction, which
    is better for retention and provides more ecological data (i.e.'
  - '[PAGE 7]


    representative of real life). We present a method to overcome this limitation
    by gathering large amounts of data (data mining) and then applying machine learning
    techniques to fill in missing values and capture the relevant information for
    predicting the desired task, in this case, psychiatric target prediction.


    One of the main difficulties we faced was dealing with the large amounts of missing
    data meaningfully. We used HMMs trained on the 48-half-hour time slot sequences
    describing patients'' daily activities, which were then used for imputation. This
    allowed for marginalising the missingness by repeated imputations from the distributions
    best describing each feature in the sense of likelihood.


    Deep learning techniques automatically learned the underlying patterns in the
    monthly patient sequences to predict mobility difficulty and generalised anxiety
    outcomes. We showed that the proposed transfer learning methods could improve
    the performance of target outcome estimation, especially in the case of data sets
    with few samples. Our results proved that even though the binary classification
    performance varies on each split, which is expected partly due to the non-uniform
    representation of certain socio-demographic features in the data set, the variance
    was not especially significant; hence the models are quite robust to the data
    shifts.


    Applying a pre-training/transfer learning step for the temporal encoder block
    of the model helped with a more meaningful initialisation of the model weights
    for the classification task of GAD7. However, it was unhelpful in the case of
    predicting WHODAS 2.0 mobility impairment. Pre-training can be viewed as beginning
    gradient descent from a different initialisation on the objective space, and thus
    improvements are due to reaching better optima that minimise the loss. In the
    case of the WHODAS 2.0 mobility scores, it was clear that this initialisation
    led to a finding of poorer optima, while in GAD-7 prediction, it led to significantly
    better optima. Finding a worse optimum is primarily due to either being stuck
    in a worse local optimum or descending the objective space slower. The pre-training
    initialisation is based on predicting the average next-day mobility markers, and
    this can be generally helpful when there is a lack of data. However, with more
    data, the optimisation problem solved in the predictive task strays further and
    further away from the one defined in the pre-training. Moreover, as the data set
    from study A covered a more comprehensive range of socio-demographic representations,
    that might have helped to avoid covariate shifts between training and test sets
    in the task transfer set-up on the much smaller data set of study B.


    The self-attention heatmaps showed different general within-day and within-month
    patterns emerging in the healthy versus mobility-impaired cohorts. Additionally,
    when paired with a relevant time-point, the heatmaps can be used to analyse the
    different emerging patterns concerning certain events, for example, the beginning
    or discontinuation of a prescribed treatment or comparing patterns between visits.
    These simple visualisations provide a helpful tool for clinicians to gain insights
    into the individuals'' activity patterns and what led to an improvement, and even
    more importantly, what led to a decline. This can provide invaluable information
    when deciding to trigger proper interventions to help slow down or reverse the
    decline.


    # 5.2. Strengths and limitations


    The strength of this work lies in the novelty of a pipeline for passively determining
    patient functionality scores. We focus on psychiatric targets, but this idea could
    be extended to many areas. Not only is the idea and implementation novel to the
    domain of passive mobile psychiatric evaluation but also this work presents a
    way to deal with the limitations of passively sensed mobile data in any domain
    to achieve reasonable results. Despite high percentages of missing values and
    low variability in labels, the model captured patient outcomes.


    This study shows that it is feasible to set up machine learning pipelines for
    passive patient evaluation, and there are ways to address problems in mobile sensed
    data. With the work presented here and


    future improvements, the limitations of passive data collection from mobile phones
    can be mitigated, leaving researchers and clinicians with a data collection tool
    that is almost always carried by subjects, collects data in real-time, requires
    no patient interaction, and can gather multiple data per day across modalities.


    Although our approach showed promising results, it faces additional challenges
    and leaves room for improvement in future work. A common limitation in health
    applications is the relatively small labelled sample size. A larger patient cohort
    and multiple different valued labels per patient could help train more robust
    models and even allow for a data-driven personalisation, thus accounting for inter-
    and intra-individual differences in behavioural patterns. Secondly, to help address
    the missingness problem, we introduce another limitation in finding the least
    missing containing a 30-day window for each label, which can include days after
    questionnaire completion. However, it is not an unreasonable assumption that the
    patient''s state would not change within a few days or weeks of questionnaire
    completion. This assumption is further supported by the data''s lack of within-individual
    label differences.


    Moreover, we interpreted the temporal patterns found significant by the model
    via visualising the self-attentions; however, such interpretation only explains
    the variation of the behavioural patterns regarding the outcome of interest. This
    work could further be extended to bring more interpretability to the decision-making,
    providing better insights for clinicians.


    # 6. Conclusion


    Previous work on the topic used manually extracted features from the mobile sensed
    sequences, avoiding the missingness and intra-day variations. In this work, we
    investigated using a deep learning model with multimodal inputs, complemented
    by a hidden Markov model for missing value imputation, for the prediction tasks.
    This pipeline results in better predictions and interpretability of intra-day
    and intra-month variations concerning the outcome of interest, thanks to the self-attention
    layers. Moreover, our transfer learning approach shows promising results in efficiently
    diversifying the prediction tasks, even to smaller data sets.


