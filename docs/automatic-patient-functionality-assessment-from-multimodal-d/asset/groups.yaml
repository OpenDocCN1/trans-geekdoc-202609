    # 3.2. Nested cross-validation


    We first performed model hyper-parameter optimisation and model selection using
    a nested cross-validation approach (Krstajic et al., 2014). As such, a k-fold
    cross-validation procedure for model hyper-parameter optimisation is nested inside
    a k-fold cross-validation procedure for model evaluation and model selection for
    testing on the OOD dataset. This way, the risk of the search procedure overfitting
    the original data set is reduced, and we gain insight into the average model performance.
    By randomly sampling possible model architecture candidates from a pre-defined
    search space of possible hyper-parameter values (Bergstra and Bengio, 2012), we
    try to discover a set of hyper-parameters that perform well on the data set in
    the sense of the AUPRC score.


    We used k = 5 for the hyper-parameter search and tested 10 random combinations
    of model hyper-parameters from a pre-defined search space (see Table 2). Nested
    cross-validation with k = 5 folds in the outer loop would fit and evaluate 250
    models. We trained the models for 50 epochs. The final model is configured by
    applying the outer loop to the entire data set. This model trained on the complete
    in-distribution data is then used to predict on the unseen OOD data.


    # 3.3. Ablation study


    When creating a complex machine learning model, it is helpful to understand the
    impact of each component separately (Meyes et al., 2019). Therefore, we defined
    an ablation study, systematically eliminating parts of the model, and analysed
    its effect on overall model performance. We used 3-fold cross-validation to estimate
    how the models are expected to perform when used to make predictions on data not
    seen during training and to find the optimal number of epochs to train the model
    to avoid overfitting. The models were then trained on the entire Study A data
    set for the found number of epochs and evaluated on the held-out test set (Study
    B) in each case.


    # 3.4. Temporal encoder pre-training


    Given the limited labelled sample size, we propose using a transfer learning approach
    for the temporal encoder. First, we pre-train the temporal encoder weights to
    perform a generic task, such as predicting the average mobility biomarkers of
    the next day based on the previous 30 days. Then we use the model fit on this
    auto-regressive task as the starting point for a model in the functionality prediction
    setting, such that it would lead to better general embedding of the time series
    sequences regardless of the target label of interest. We extracted 20,272 30-day
    sequences with 7-day overlap, for which observations were collected for all the
    features. The pre-training was run for five epochs.


    We compare two pre-training approaches: feature extraction and fine-tuning. In
    the first setting, we freeze the weights of the temporal encoder part; hence we
    solely use it for temporal feature extraction, and


