    ## 3.2. 嵌套交叉验证


    我们首先使用嵌套交叉验证方法（Krstajic 等人，2014）进行了模型超参数优化和模型选择。具体来说，用于模型超参数优化的 k 折交叉验证过程嵌套在用于模型评估和模型选择（以便在
    OOD 数据集上进行测试）的 k 折交叉验证过程之内。这样一来，搜索过程对原始数据集过拟合的风险降低，并且我们能够了解平均模型性能。通过从预定义的超参数值搜索空间中随机采样可能的模型架构候选项（Bergstra
    and Bengio, 2012），我们试图发现一组在 AUPRC 分数意义上在数据集上表现良好的超参数。


    我们使用 k = 5 进行超参数搜索，并从预定义搜索空间中测试了 10 个随机模型超参数组合（参见表 2）。外层循环中 k = 5 折的嵌套交叉验证将拟合和评估
    250 个模型。我们训练模型 50 个 epoch。最终模型是通过将外层循环应用于整个数据集来配置的。在完整的分布内数据上训练的该模型随后用于对不可见的 OOD
    数据进行预测。


    ## 3.3. 消融研究


    在构建复杂机器学习模型时，单独了解每个组件的影响很有帮助（Meyes 等人，2019）。因此，我们定义了一项消融研究，系统地消除模型的部分组件，并分析其对整体模型性能的影响。我们使用
    3 折交叉验证来估计模型在用于对训练期间未见过的数据进行预测时的预期表现，并找到训练模型的最佳 epoch 数以避免过拟合。然后，我们在研究 A 的完整数据集上训练模型，训练所找到的
    epoch 数，并在每种情况下对留出测试集（研究 B）进行评估。


    ## 3.4. 时序编码器预训练


