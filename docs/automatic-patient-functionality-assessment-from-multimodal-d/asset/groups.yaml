    along with the ablation and transfer learning experiments. The DL pipeline outperformed
    the baseline approach in the in-distribution AUPRC score but achieved slightly
    worse performance in AUPRC scores. On the OOD test set, the DL model outperformed
    the baseline in AUPRC.


    We will now examine the results of the ablation study in reference to the entire
    DL pipeline. Removing the attention layer but keeping the Time2Vec layer led to
    a significant performance decrease on the in-distribution test, with an increase
    only in AUROC in the OOD test. Removing the Time2Vec block led to lower AUROC
    and slightly higher AUPRC for the in-distribution test, while in OOD test provided
    the best performance. The model without the Time2Vec and self-attention layer
    provided the best AUROC of the ablation variants and the best overall AUPRC in-distribution;
    however, while OOD did improve upon the entire model, it performed worse than
    the former model. Ablation, in general, led to lower AUROC in-distribution, but
    this trade-off could be desirable, particularly in the case of the removal of
    Time2Vec. Removing Time2Vec from the pipeline allowed for a more stable model
    with lower in-distribution standard deviation and relevant improvements in all
    areas except the formerly mentioned.


