    ## 3. 实验


    除了第 3.5 节中描述的实验外，所有实验均使用研究 A 的数据进行交叉验证和测试。我们将研究 B 的数据保留为留出测试集。因此，我们将在同一数据集上训练和评估的模型结果称为分布内，将在不同数据集上测试的模型结果称为分布外（OOD）。所有模型均使用学习率为
    1e-3、批量大小为 64 的 Adam 优化器进行训练。


    我们使用准确率、受试者工作特征曲线下面积（AUROC）和精确率-召回率曲线下面积（AUPRC）评分 (Saito and Rehmsmeier, 2015)
    来评估预测性能，以便对不平衡问题的分类性能获得有价值的见解。除非另有说明，我们报告所有评估的交叉验证平均分及其相应的标准差。此外，我们报告未见 OOD 数据集上的性能，但第
    3.5 节中描述的实验除外。


