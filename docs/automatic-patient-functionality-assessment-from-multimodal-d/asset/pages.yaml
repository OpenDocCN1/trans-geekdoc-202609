    # 5. Discussion


    # 5.1. Principal results


    This work tackled common problems in modelling mental health outcomes from passively
    sensed digital biomarkers. In this case, the data was passively collected with
    mobile phones, which have inherent limitations in sensor technology (they are
    not designed for research quality), leading to noisy and missing data. However,
    they are the ideal device for data collection, as most people carry a mobile phone
    throughout their day. Thus, if these limitations can be overcome, it provides
    a promising way to passively collect data without any subject interaction, which
    is better for retention and provides more ecological data (i.e.'
