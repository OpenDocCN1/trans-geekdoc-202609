    # 2.2.2. Output data


    We dichotomise the WHODAS 2.0 mobility and GAD-7 scores to create the target outcomes.
    For the WHODAS 2.0 mobility scores, the cut-off for the negative label is set
    at 25 % of the overall domain score. In contrast, for the GAD-7 score, a cut-off
    at 10 is considered. In both cases, there is an imbalanced distribution between
    the two categories: for the WHODAS 2.0 mobility impairment outcome, in Study A,
    there are 1394/ 2233 0-labels, while in Study B, 165/283, and for the GAD-7 score
    176/ 283, respectively (see the distributions in Supplementary Fig. A.3).


    # 2.3. Proposed pipeline


    This section introduces our proposed pipeline for leveraging the passively sensed
    time-series sequences and the socio-demographic data in functionality estimation.
    Fig. 2 shows the framework of our approach, consisting of an HMM for data imputation,
    the LSTM- and self-attention-based temporal encoder, coupled with a dense layer
    acting as a logistic regressor on the temporal embeddings concatenated with the
    static covariates. The code used to produce the results presented in this paper
    is available at the following GitHub repository: https://github.com/mlfpm/functionality_prediction.


    # 2.3.1. Dealing with missing data


    Missing observations form a common problem with data collected from wearable devices
    and smartphones. They can occur due to varying degrees of compliance behavior,
    sensor failure, or non-collection (Kiang et al., 2021). Given the high percentage
    of missing data, imputation using statistical measures such as the mean, median,
    or even interpolation is insufficient, as they underestimate the variance and
    ignore the relationship between variables (Jäger et al., 2021). The imputed values
    would not generalise to wearable characteristics or participant behavior, can
    reduce variability in the data set, and introduce bias. Probabilistic generative
    models, such as hidden Markov models (HMMs) (Rabiner, 1989) can learn the underlying
    distributions in a data set by adjusting the model parameters to best account
    for the data to maximise the evidence, even in the presence of missing data (Speekenbrink
    and Visser, 2021).


    are assumed to have been generated by a first-order Markov chain process. The
    learnable parameters of an HMM comprise an initial state probability distribution,
    a state transition probability distribution, and a symbol emission probability
    distribution. They can be trained unsupervised using the expectation-maximisation
    (EM) (Moon, 1996) algorithm and marginalisation to deal with the missing data.


    Only those 48-slot daily patient sequences with at least 80 % of observations
    were considered for HMM training. It is important to note that the sequential
    data is fully leveraged for the HMM, and we do not just restrict the sequences
    to the 30-day windows. After this elimination process, 91,047 sequences were used
    to train the HMMs with different numbers of hidden states n = {2, 3, ... 23}.
    The best model was selected using the Bayesian and Akaike information criteria
    (Dridi and Hadzic, 2018) on a randomly selected subset of 10,000 sequences with
    varying missingness. Given this model, we imputed the missing observations repeatedly
    during the mini-batch stochastic gradient descent. Every time a new batch of data
    was generated, the sequences were decoded using the Viterbi algorithm (Forney,
    1973), and the missing observations were imputed by samples generated from the
    corresponding most probable state.


    # 2.3.2. Predictive model


    Our proposed pipeline is illustrated in Fig. 2. It performs feature encoding for
    the daily information by applying Time2Vec (Kazemi et al., 2019), followed by
    two LSTM (Hochreiter and Schmidhuber, 1997) encoders with self-attention (Vaswani
    et al., 2017) for the 30-day input sequence. A feed-forward layer on top of the
    second attention layer’s outputs concatenated with the socio-demographic data
    is then used to get the predictions.


    Time2Vec gives a model-agnostic vector representation for time. Consisting of
    a periodic activation function and a linear term, it can capture the periodicity
    of time series signals and the non-periodic patterns that depend on time. Mathematically,
    for a given scalar notation of time τ, Time2Vec of τ, denoted as t2v(τ), is a
    vector of size k + 1 defined as t2v(τ)[i] = ω_i τ + φ_i if i = 0, and t2v(τ)[i]
    = F(ω_i τ + φ_i) if 1 ≤ i ≤ k. Here t2v(τ)[i] is the i^th element of t2v(τ), F
    is a periodic activation function and the ω_i and φ_i parameters are learnable.


    The LSTM layers encode the input sequences into a fixed-length internal representation.
    In contrast, the attention layers learn to pay'
