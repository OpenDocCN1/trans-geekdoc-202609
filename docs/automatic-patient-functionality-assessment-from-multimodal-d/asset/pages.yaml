    # ## 3. Experiments


    The data from Study A was used for cross-validation and testing in all experiments
    except the one described in Section 3.5. We kept the data from Study B as a held-out
    test set. Therefore we refer to the results of models trained and evaluated on
    the same dataset as in-distribution and those tested on a different dataset as
    out-of-distribution (OOD). All models were trained using an Adam optimiser with
    a learning rate of 1e – 3 and batch size of 64.


    We evaluated prediction performance using accuracy, area under the receiver operating
    characteristic curve (AUROC), and area under the precision-recall curve (AUPRC)
    scores (Saito and Rehmsmeier, 2015) to gain valuable insights into the classification
    performance on the imbalanced problems. We report the average score and the corresponding
    standard deviation from the cross-validation for all evaluations unless mentioned
    otherwise. Furthermore, we report the performance on the unseen OOD data set,
    except for the experiment described in Section 3.5.


    # ### 3.1. Defining the baseline


    We started by re-using the pipeline defined in (Sikkeei et al., 2022) as a baseline
    for prediction performance. We applied sequential forward selection (SFS) and
    logistic regression with L2-regularisation on the manually extracted statistical
    summary features (count, minimum, maximum, mean, standard deviation, IQR) from
    the sequences for each variable and combined them with the socio-demographic information.
    After the feature extraction, there were ~ 20 % missing values in the dataset
    (24.49 % in the step count, 11.13 % in the distance travelled, 52.58 % in the
