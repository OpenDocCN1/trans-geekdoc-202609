    # Ethics approval and consent to participate


    All procedures contributing to this work comply with the ethical standards of
    the relevant national and institutional committees on human experimentation and
    with the Helsinki Declaration of 1975, as revised in 2008. The Ethics Committee
    of the University Hospital Fundación Jiménez Díaz approved all procedures involving
    human patients. All participants provided written informed consent to participate
    in the study.


