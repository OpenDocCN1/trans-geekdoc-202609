  md: 'found in the literature. However, the main focus group is usually the elderly
    (Demiris et al., 2004; Van Grootven et al., 2020). Moreover, the existing methods
    are obtained from data collected in a smart home environment.


    Our prior work (Sükei et al., 2022) examined the feasibility of predicting patient
    functionality outcomes based on the World Health Organisation Disability Assessment
    Schedule (WHODAS 2.0), utilising passively collected digital biomarkers as model
    inputs to regression models. We performed feature engineering by extracting statistical
    measures (minimum, maximum, mean, median, standard deviation, IQR) from 30-day
    long time-series data sequences, followed by a simple linear regression for simplicity
    and interpretability of the biomarker features as predictors. Deep learning models
    have proven successful in many prediction tasks (LeCun et al., 2015), including
    mobile sensing (Servia-Rodríguez et al., 2017; Yao et al., 2017; Bahador et al.,
    2021), and could be employed for mental health outcome prediction.


    # 1.2. Aims


    Our objective is to develop a comprehensive deep-learning framework that predicts
    functional mobility impairment by integrating digital biomarkers and socio-demographic
    data. Due to the noisy and missing nature of mobile sensed data, we will employ
    appropriate time-series models and imputation techniques to capture underlying
    patterns in the data. Furthermore, including socio-demographic data can significantly
    enhance the model’s performance by providing information strongly correlated to
    the individuals’ functionality. Based on the shared behavioural patterns of patient
    groups, this data can effectively capture the complexity of human mobility.


    Additionally, we suggest a simple task transfer learning approach that fine-tunes
    the model for predicting anxiety outcomes. Anxiety can significantly impact an
    individual’s behavior, emotions, and thoughts, affecting their daily activities
    (Al-Lawati et al., 2000; Roemer and Orsillo, 2002). It can also lower motivation
    and prevent individuals from participating in physical activities (Otto and Smits,
    2011; W. H. Organization, 2022). Therefore, we hypothesise that mobility descriptor
    variables can effectively predict anxiety outcomes.


    Our contributions consist of the following:


    +   - a hidden Markov model (HMM)-based method for handling the missing observations
    without resorting to classical imputation techniques,

    +   - a deep neural network model that combines the self-attention method with
    long short-term memory (LSTM) networks to obtain patient embeddings over time,

    +   - and a general multimodal pipeline to model questionnaire outcomes that can
    be trained using transfer learning techniques


    # 2. Materials & methods


    # 2.1. Data set


    # 2.1.1. Study participants


    The data used in this study were collected from two ongoing studies (Barrigón
    et al., 2017; Berrouiguet et al., 2018) involving passive smartphone monitoring
    of clinical outpatients. The studies received approval from the Institutional
    Review Board at the Psychiatry Department of Fundación Jimenez Diaz Hospital.
    All participants provided written informed consent.


    # 2.1.2. Eligibility criteria


    The study recruited patients who were at least 18 years old and were clinical
    outpatients diagnosed with mental disorders or attending therapy groups at the
    institutions mentioned above. To participate, patients had to own a smartphone
    with either Android or iOS operating systems, which they used to connect to a
    Wi-Fi network at least once a week. Only


    patients who provided written informed consent were included, and they did not
    receive payment for their participation.


    # 2.1.3. Data sources


    Passive data of participants was collected using eB2 Mindcare (eb2 evidence-based
    behaviour, n.d.; Bonilla-Escribano et al., 2019; Carretero et al., 2020), an eHealth
    platform validated for clinical use. The app runs in the background of the individual’s
    smartphone, providing an e-diary for mental health. The data consisted of 48 half-hour
    daily summaries of four observations collected passively, namely step count, distance
    travelled, time spent at home, and exercise time. The data used in this work was
    collected from January 2016 to April 2022 from 2348 individuals, resulting in
    516,604 entries, of which 31.5 % were collected in 2019. However, the final dataset
    had many missing observations, with overall missingness percentages of over 60
    % for each variable (see Supplementary Figs. A.1 and A.2 for details). Missingness
    can be caused by varying sampling frequencies of sensors or sensor non-collection
    due to technological and behavioural factors, such as forgetting to charge the
    phone, disabling GPS, or uninstalling the study application.


    On patient enrolment, socio-demographic information, such as age, gender, cohabitation
    status, and employment status, and initial completion of the *functionality evaluation*
    questionnaires and resulting scores were recorded using the *MeMind* tool (Barrigón
    et al., 2017; Muñoz-Navarro et al., 2017). The follow-up scores were recorded
    biannually at an in-person appointment or via a phone call (Fig. 1.A). The two
    health outcomes that we focus on are the World Health Organisation Disability
    Assessment Schedule 2.0 (*WHODAS 2.0*) (McKibbin et al., 2004) and the *Generalised
    Anxiety Disorder Assessment 7-item* (*GAD-7*) (Spitzer et al., 2006) scores.


    The WHODAS 2.0 questionnaire consists of 36 items that assess disability in 6
    domains: cognition, mobility, self-care, getting along, life activities, and participation.
    Patients are asked to report difficulties experienced in the past 30 days while
    performing tasks in each domain and rate the difficulty level. Scores range from
    0 to 100 %, with higher values indicating higher disability levels. Functional
    impairment categories can be defined at different cut-offs, as explained in (de
    Pedro-Cuesta et al., 2013). The GAD-7 screening tool is a 7-item questionnaire
    that assesses the severity of generalised anxiety disorder, with scores ranging
    from 0 to 21. The cut-off points for mild, moderate, and severe anxiety are 5,
    10, and 15, respectively, and a score of 10 or greater indicates a need for further
    evaluation (Spitzer et al., 2006); therefore, we consider this cut-off value to
    dichotomise the GAD-7 outcome.


    A subgroup of 2011 patients from the two studies had clinical evaluations for
    the outcomes of interest. Table 1 provides an overview of the distribution of
    socio-demographic information at baseline and the mental health outcome scores
    in the two study groups.


    In Study group A, 417 patients have two or more entries, 161 have one change in
    the score, and 2 have two changes over the study period. In the dichotomised case,
    this translates to 54 patients having a single change.


    # 2.2. Data preprocessing


    # 2.2.1. Input data


    To build the input data set for the classification task, we cropped a 30-day window
    of the data sequences for each target label entry (Fig. 1.B). For the baseline
    score, due to it being registered at enrolling in the study, we consider the next
    30 days of observations because no previous mobile sensed data was collected.
    For follow-up scores, usually collected bi-annually, we centred a 30-day window
    on encapsulating the most complete observation sequence around the score.


    In the case of the socio-demographic covariates, the categorical data were one
    hot encoded. At the same time, the patient age was binned into ten categories,
    then one hot encoded. We introduced an additional category to indicate missingness
    for covariates that were not reported.'
