    only reaches 0.545 average AUPRC after training with the feature extraction approach.
    Nonetheless, the feature extraction approach reaches a slightly higher AUPRC on
    the OOD test.


    As Fig. 3 shows, more attention is paid on average to the activity in the evening
    hours (slots 36–47), very low attention weights are associated with late-night
    activity, and varying patterns can be seen during the day in both cohorts. As
    for the monthly sequences, the attention weights are fairly uniform over the 30-day
    interval in both groups, with occasionally more attention being assigned to the
    last days of the period.


    When analysing the attention weights at the patient level (Fig. 4), we can see
    different patterns arise based on mobility impairment and possibly individual-level
    differences. In the case of the healthy patient, the larger daily attention weights
    consistently appear in the second half of the day. In contrast, some days, more
    attention is paid to the late night hours for the patient with mobility difficulty.
    Finally, we also analysed but did not find a clear correlation between the data
    missingness and the attention weights, which indicates that the weights are assigned
    in the function of the observation values rather than driven by the missingness
    factor.


