    # ## ARTICLE INFO


    +   **Keywords:**

    +   - In-situ patient monitoring

    +   - Digital phenotyping

    +   - Ecological momentary assessment

    +   - Time-series modelling

    +   - Attention models

    +   - Transfer learning


    # ## ABSTRACT


    Wearable devices and mobile sensors enable the real-time collection of an abundant
    source of physiological and behavioural data unobtrusively. Unlike traditional
    in-person evaluation or ecological momentary assessment (EMA) questionnaire-based
    approaches, these data sources open many possibilities in remote patient monitoring.
    However, defining robust models is challenging due to the data’s noisy and frequently
    missing observations.


    This work proposes an attention-based Long Short-Term Memory (LSTM) neural network-based
    pipeline for predicting mobility impairment based on WHODAS 2.0 evaluation from
    such digital biomarkers. Furthermore, we addressed the missing observation problem
    by utilising hidden Markov models and the possibility of including information
    from unlabelled samples via transfer learning. We validated our approach using
    two wearable/mobile sensor data sets collected in the wild and socio-demographic
    information about the patients.


    Our results showed that in the WHODAS 2.0 mobility impairment prediction task,
    the proposed pipeline outperformed a prior baseline while additionally providing
    interpretability with attention heatmaps. Moreover, using a much smaller cohort
    via task transfer learning, the same model could learn to predict generalised
    anxiety severity accurately based on GAD-7 scores.


    # ## 1. Introduction


    # ### 1.1. Background


    The ubiquity of mobile devices and their advanced sensors have allowed the passive
    collection of physiological and behavioural data in real-time, such as step count,
    location, sleep, and phone usage, which has opened new avenues for mental health
    research (Froehlich et al., 2007; Cornelius et al., 2008; Kukkonen et al., 2009).
    By monitoring physical activity, social interactions, and mental health biomarkers,
    mobile sensing enables continuous, unobtrusive evaluation of patients’ functions
    and well-being, providing opportunities to improve care timeliness, treatment
    adherence, and health outcomes while minimising participant burden and recall
    bias (Noah et al., 2018). To establish reliable frameworks for collecting, processing,
    and analysing behavioural sensor data, recent research has focused on monitoring
    and diagnosing data sources and developing robust models


    for accurate and effective predictions (Jara et al., 2013; Mohr et al., 2014;
    Sakr and Elgammal, 2016). Various health monitoring systems can be built based
    on mobile sensing and wearable data sources, such as human activity and posture
    monitoring, general well-being, fall monitoring in the elderly, and Parkinson’s
    disease management, to name a few (Miranda et al., 2022). Mobile phone-based interventions
    have also been proposed as early-prevention approaches for reducing the disease
    burden associated with mental illness (Goldberg et al., 2022). Such frameworks
    would be extremely valuable for passive follow-up of the evolution of patients’
    mobility impairment. Mobility impairment is a limitation in a person’s ability
    to move and perform physical activities independently. It can be caused by various
    factors, such as ageing, chronic illnesses, and injuries. Mobility impairment
    can significantly impact an individual’s daily life, leading to a decline in physical
    and mental health, reduced social interaction, and increased healthcare costs.
    Predicting mobility impairment using various approaches such as machine learning,
    statistical modelling, and clinical assessments can be'
