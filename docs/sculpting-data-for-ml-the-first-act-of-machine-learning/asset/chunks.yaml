    \ Microsoft\n\n# Preface\n\nIn the contemporary world of Artificial Intelligence\
    \ and Machine Learning, data is the new oil. Rightly so, giant leaps in this domain\
    \ can be attributed to access to large-scale data. Despite this fact, most of\
    \ the focus often lies in the methodological aspect of Machine Learning, which\
    \ is excellent for a start but can limit our advancement. Upon reaching a certain\
