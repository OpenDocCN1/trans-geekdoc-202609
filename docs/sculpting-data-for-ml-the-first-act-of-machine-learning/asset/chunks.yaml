  trans: "\n\n# 第 3 章：数据集准备\n\n在完成上一章的数据提取阶段后，我们现在已以结构化格式获得了所需数据。这标志着我们创建有意义数据集旅程中的一个重要里程碑，但在达到最终目标之前还有更多工作要做。我们必须处理提取出的数据，以消除在输入机器学习模型之前可能混入的杂质。在本章中，我们将探讨数据准备阶段的几个方面。\n\
    \n## 1. 数据修剪\n\n回顾我们之前关于识别相关数据源时对关键数据信号的讨论。如前所述，如果缺少关键数据信号，无论模型多么复杂，我们的数据都无法帮助机器学习模型。关于在线零售商\
    \ ModCloth，该网站允许客户提供详细的版型反馈，这对解决尺码推荐问题至关重要。然而，我们注意到并非所有客户评论都提及版型（如下例所示）。\n\n![ModCloth\
    \ 上缺少关键版型反馈组件的评论示例](img/Image00022.jpg)\n\n显而易见，我们收集的数据可能包含一定比例的无版型反馈评论。由于这些评论缺少关键数据信号，因此对我们毫无用处。因此，我们需要从数据中移除这些交易，或利用现有信息找到一种生成关键数据信号的方法。在技术术语中，由于数据的不相关性、冗余性或极端性而将特定值从数据集中排除的过程称为**数据修剪**。认为更多训练数据能产生更好的机器学习算法泛化能力，是该领域众多误解之一。训练样本的质量在很大程度上至关重要。实验已证明，丢弃部分训练样本（尤其是有噪声的样本）后，模型表现会更好。**数据修剪**在许多关于该主题的资料中与**数据剪枝**同义。\n\
    \n让我们回顾一下之前从 ModCloth 抓取的原始数据的一些具体场景：\n\n1.  许多评论不包含版型反馈，也不提供任何关于产品尺码的信息，如前所述。这些不太符合我们尺码推荐问题的目的。\n\
    \n    ![ModCloth 上缺少关键版型反馈组件的评论示例](img/Image00023.jpg)\n\n2.  如果我们回想一下，我们是以字典的形式收集每条评论的。该字典还包含\
    \ `fit` 和 `size` 作为键，分别表示关于产品版型的反馈和购买的产品尺码。由于这些是关键数据信号，我们可以消除这些键缺失值的记录，如下所示：\n\
    \n    ```\n    trimmed_data = []\n    for record in scraped_data:\n        if\
    \ 'fit' in record.keys() and 'size' in record.keys():\n            trimmed_data.append(record)\n\
    \    ```\n\n3.  购买产品并在网站上留下评论的客户/用户信息也很有价值。ModCloth 为每个产品分配了一个唯一标识符；但是，它没有为评论者分配唯一\
    \ ID。相反，网站仅提及每位评论者的姓名，这极有可能不唯一。由于我们将 `UserID` 确定为尺码推荐问题的关键数据信号（连同 `ProductID`、`购买尺码`\
    \ 和 `版型反馈`），缺乏独特标识符颇具挑战性。\n\n    ![ModCloth 上的评论似乎不与唯一 UserID 关联](img/Image00024.jpg)\n\
    \    ![网站上的许多评论包含关于用户的重要详细信息](img/Image00025.jpg)\n\n    网站上的许多评论包含关于用户的重要详细信息，如身体测量数据，这些数据与购买尺码和随之而来的版型反馈高度相关。由于用户的身体测量数据是可识别细节且在很大程度上是唯一的，我们可以将这些数据与评论者姓名结合使用来构建个体身份。为了创建唯一标识符并确保没有两个用户被分配相同的标识符（仅凭姓名这很有可能），我们考虑身体测量属性。我们从八种不同的测量值集合中使用三个或更多身体测量值，即\
    \ `height`（身高）、`bust`（胸围）、`bra size`（胸罩尺码）、`cup size`（罩杯尺码）、`hips`（臀围）、`waist`（腰围）、`shoe\
    \ size`（鞋码）和 `shoe width`（鞋宽），将它们与用户名组合来创建唯一标识符。此过程确保提供了至少三项身体测量值的用户获得标识符。因此，我们可以从数据集中移除未关联标识符的记录。\n\
    \n    ```\n    trimmed_data = []\n    unique_users = set()\n    user_measurement_attributes\
    \ = {\n        'height',\n        'bra size',\n        'cup size',\n        'bust',\n\
    \        'hips',\n        'waist',\n        'shoe size',\n        'shoe width'\n\
    \    }\n    for record in scraped_data:\n        attributes_present = len(set(record.keys())\
    \ & user_measurement_attributes)\n        if attributes_present < 3:\n       \
    \     # Since the user can not be uniquely identified,\n            # we skip\
    \ that review/record\n            continue\n        unique_user_name = record['user_name'].lower()\n\
    \        unique_user_name = unique_user_name \\\n            + (record['height']\
    \ if 'height' in record else '') \\\n            + (record['bra size'] if 'bra\
    \ size' in record else '') \\\n            + (record['cup size'] if 'cup size'\
    \ in record else '') \\\n            + (record['bust'] if 'bust' in record else\
    \ '') \\\n            + (record['hips'] if 'hips' in record else '') \\\n    \
    \        + (record['waist'] if 'waist' in record else '') \\\n            + (record['shoe\
    \ size'] if 'shoe size' in record else '') \\\n            + (record['shoe width']\
    \ if 'shoe width' in record else '')\n        record['unique_user_name'] = unique_user_name\n\
    \        if unique_user_name not in unique_users:\n            unique_users.add(unique_user_name)\n\
    \    ```\n\n"
