- raw: "will I buy this again??? well Ye$$$” The above example uses Python’s PySpellChecker\
    \ library to correct the spell errors. If required, we can go one step further\
    \ by using libraries like NLPre to do more sophisticated checks to smooth some\
    \ of the more tricky inconsistencies found in real-world data. 6•  Data Balancing\
    \ We can segregate the records into different groups or classes based on their\
    \ label value in a dataset. For example, each category in the News Category dataset,\
    \ like sports , politics , entertainment , and community , can have multiple records.\
    \ Similarly, in the Sarcasm Detection dataset, we can classify the records as\
    \ either sarcastic or non-sarcastic . Typically, the volume of different classes\
    \ is not the same. The learning algorithms can handle some differences in class\
    \ distribution (say 2:3 ); however, the problem arises when the differences become\
    \ extreme (say 1:99 ). We refer to datasets with extremely skewed class distribution\
    \ as an Imbalanced Dataset  . Let us try to understand how the learning algorithm\
    \ works under class imbalance for a binary classification scenario, where the\
    \ model assigns a weight to each class. The class with a sizable record volume\
    \ in the dataset is known as the majority class , whereas the other is the minority\
    \ class . The abundance of majority class could impact the model’s predictive\
    \ capability if not handled correctly. In extreme cases, the model learns to completely\
    \ ignore the minority class by not giving them any weight. We can detect this\
    \ skewed behavior of the classification model by an evaluation metric called the\
    \ Confusion Matrix . There are different ways to handle imbalanced datasets; let\
    \ us walk through them. I•  Eliminating Infrequent Data Records This technique\
    \ is only applicable to cases where the dataset has multiple classes, and no particular\
    \ class has to be necessarily present to solve the problem at hand. For example,\
    \ the Clothing Fit dataset has only three classes: small , fit , and large , and\
    \ all of them are essential to address the Size Recommendation problem. Whereas\
    \ in the News Category dataset, we have many available classes like sports , politics\
    \ , entertainment , fashion , medicine , and community . We do not have strict\
    \ requirements for any particular class’s presence to address the News Category\
    \ Detection problem. A straightforward way to tackle the extreme skewness is to\
    \ remove records of very infrequent classes from the dataset. We can also consider\
    \ going the other route of dropping the records of frequent classes to match the\
    \ proportion of infrequent classes; however, it may significantly slash down the\
    \ dataset’s size. The former approach looks more reasonable here as it maintains\
    \ the data volume and would help the model classify reliably. In the News Category\
    \ dataset extracted from HuffPost , we  performed preliminary Exploratory Data\
    \ Analysis (EDA) . We found that there were a few categories with less than 500\
    \ articles listed under them. To balance the dataset, we merely removed them and\
    \ saw an increase in the classification model’s performance. import json  \n\n\
    from collections import defaultdict  \n\ncategory\\_count = defaultdict(int) \
    \ \n\nfor record in data:  \n\n  category\\_count\\[record\\[‘category’\\]\\]\
    \ += 1  \n\nfiltered\\_data = \\[\\]  \n\nfor record in data:  \n\n  if category\\\
    _count\\[record\\[‘category’\\]\\] >= 500:  \n\n    filtered\\_data.append(record)\
    \  \n\n   output\\_file = open(‘./News\\_Category\\_Dataset.json’,’w’,encoding=’utf-8’)\
    \  \n\nfor record in filtered\\_data:  \n\n  output\\_file.write(json.dumps(record)\
    \ + ‘\\\\n’)  \n\noutput\\_file.close() II•  Randomly Sampling Data Records Sampling\
    \ is an extensively popular and uncomplicated approach to deal with imbalanced\
    \ datasets. This technique entails randomly sampling records from the abundant\
    \ classes in the dataset to remove the skewness, a process often called Random\
    \ Undersampling . As an alternate, we can also randomly sample with replacement\
    \ to increase the records for infrequent classes, also known as Random Oversampling\
    \  . In the Sarcasm Detection dataset, we extracted sarcastic headlines from TheOnion\
    \ and real-world news headlines from HuffPost . The statistics show that non-sarcastic\
    \ news headlines (~200k) are a lot more than the sarcastic headlines (~11k). To\
    \ remove the skewness in this case, we use the undersampling technique: we randomly\
    \ sampled ~15k headlines from non-sarcastic data. It is important to note that\
    \ we do not always aim to have a 1:1 ratio for the classes; as discussed previously\
