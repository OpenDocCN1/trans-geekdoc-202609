    正如我们从这个示例中所观察到的，它使得操控任何给定的 HTML 文档变得容易。


    ### Selenium


    Selenium 是一种广泛使用的可移植框架，用于通过程序控制 Web 浏览器。我们主要将其用于自动化 Web 应用程序以进行测试，而使用 Selenium
    进行自动化的极限是无穷的。它允许我们执行诸如启动 Web 浏览器、点击特定按钮、在表单中输入信息、使用搜索引擎等任务。使用 Selenium 类人的动作执行日常任务在从网站收集数据时非常有用，尤其是当内容不是静态的时候。某些网站的内容可能会随着按钮的点击或从菜单中选择一个选项而改变。结合
    Chrome Driver，Selenium 允许我们自动化打开网站、浏览页面、模拟按钮点击动作等等。


    ### 基本规则


    一旦我们缩小了用于数据集策划的网络来源范围，并掌握了所需工具的知识，立即开始抓取内容的诱惑力非常大。尽管如此，请稍等！我们需要遵循游戏规则以确保公平竞争。因此我们必须遵守以下指令：


    1.  在开始抓取过程之前，仔细阅读所选网络来源的“条款与条件”至关重要。仔细阅读关于该来源发布数据合法使用的声明。从根本上说，我们不应将从网络来源收集的数据用于任何商业目的。

    2.  由于我们使用的是自动化工具，我们需要合理控制我们的工具在任何给定时间向网络来源请求数据的次数。激进地扫取数据可能被视为垃圾邮件行为，甚至可能导致来源站点崩溃。通常，一种安全的做法是每秒请求一次，这也模拟了人类操作的速度。


    ### 分步流程


    让我们使用一个实际示例来讲解这一部分，因为没有它很难理解该过程。我们将以 Clothing Fit（服装版型）数据集的抓取脚本为例来解释各个要点。


    #### 数据源结构理解


    首要任务是浏览网站，熟悉网站的结构。作为一个持续的示例，让我们考虑 ModCloth 网站。探索该网站，我们看到顶栏有各种产品类别，如 `dresses`（连衣裙）、`tops`（上装）、`bottoms`（下装）、`swim`（泳装）、`outerwear`（外套）、`shoes`（鞋类）、`accessories`（配饰）和
    `home`（家居）。点击任意一个类别，例如 `tops`，我们会看到产品以网格格式显示。默认情况下，页面显示前 100 个结果，我们可以通过位于产品列表上方右侧的滚动按钮查看剩余产品。


    ![](img/Image00010.jpg)

    *ModCloth 网站上装类别页面的视图。*


    进一步点击任意一个产品，我们通过截图了解产品页面的样子。在产品页面上，顶部是产品元数据，底部是评论。


    ![](img/Image00011.jpg)

    *ModCloth 产品详情页面示例。*


    ![](img/Image00012.jpg)

    *ModCloth 上典型的产品评论。*


    在探索其他产品列表时，我们注意到每个页面最多只包含 10 条评论。如果超过 10 条评论，网站会将它们分成不同的页面，我们可以使用右下角的 `NEXT`（下一页）按钮进行导航。


    ![](img/Image00013.jpg) ![](img/Image00014.jpg)

    *产品页面上 PREVIOUS（上一页）和 NEXT（下一页）导航按钮的快照。*


    一个重要的现象是，当我们点击 `NEXT` 按钮时，会获得接下来的 10 条评论，但 URL 并不会改变。这一特殊性引出了我们将在下一节讨论的静态与动态内容的概念。尽管如此，简单来说，除了点击
    `NEXT` 按钮外，没有其他方式访问后续评论。同样，`PREVIOUS` 按钮会开始出现，用于访问之前的评论。在规划提取时，跟踪这些微小但至关重要的细节至关重要。此时，我们建议深入探索选定的网络来源。我们应该记录关键方面，直到对网站结构有相当好的了解。我们应该牢记最终目标：从每个产品类别的每个产品中提取评论。


    #### 静态与动态内容提取


    网站通常包含两类不同的内容：静态和动态。网站的固定内容称为静态部分。无论其他因素如何，它都向每个用户显示相同的内容，通常纯粹用 HTML 编写。另一方面，动态部分是即时生成的。在我们的案例中，它取决于哪个用户登录及其交互，利用
    `PHP`、`ASP`、`JSP` 等高级编程脚本。如何渲染动态内容超出了本书的范围；然而，知道它的存在对于我们简化抓取工作至关重要。


    考虑到以上因素，可以想象从静态网页提取内容比从动态网页更直接。通过指向静态页面的固定 URL，该 URL 不受任何用户操作影响，像 Python Request
    Library 这样的简单工具就可以提取内容。例如，下面展示将静态页面的 URL 传递给 `requests` 对象将以 `<Element html at
    0x211954a0c28>` 的形式返回 HTML 页面内容。我们可以像前面章节演示的那样，使用 `BeautifulSoup` 轻松抓取此内容：


    ```

    import requests


    from lxml import html


    html_page = requests.get(''https://en.wikipedia.org/wiki/Static_web_page'')


    print(html_page)


    >>> <Response [200]>


    html_code = tree = html.fromstring(html_page.content)


    print(html_code)


    >>> <Element html at 0x211954a0c28>

    ```


    尽管如此，我们不能使用相同的过程来提取动态内容。显示的内容不绑定到 URL，并且会随着用户操作不断变化。这就是 `Selenium` 派上用场的地方，因为它可以模拟用户操作，如点击按钮、填写表单等，并返回相应的
    HTML 页面。由于如今大多数网站依赖服务端和客户端脚本，学习如何抓取内容并实现自动化至关重要。在下一节中，我们将学习如何提取此类动态内容。


