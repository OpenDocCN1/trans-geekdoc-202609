    \n**Jigyasa Grover & Rishabh Misra**\n"
  trans: "\n\n# 前言\n\n## Julian McAuley 撰\n\n机器学习领域的许多最新突破，包括自然语言处理、计算机视觉等，既得益于更好的模型，也得益于更好的数据。很自然地，现代机器学习数据集应当具备大规模特性，以便模型能够捕捉其复杂的底层语义。然而，拥有足够的数据只是问题的一小部分：数据还必须经过处理、适当表示、妥善采样，并解决平衡性与偏见等问题，更别提从中提取有意义的预测信息的挑战了。机器学习从业者的共同经验是，这种“数据清洗整理”工作占用的时间和精力比建模还要多；但它也极具回报，因为新数据集的收集与整理往往能催生最新颖、最激动人心的研究，并能为研究社区做出重大贡献。很高兴看到一本涵盖了收集和整理数据这一未被充分探索却至关重要技能的书籍。我期待这本书将对开始收集自有数据集、或好奇热门数据集通常如何收集的从业者大有裨益。此类主题在机器学习的学术论述中通常缺失，因为数据收集和准备这一庞大任务常被一笔带过。得知\
    \ Jigyasa 和 Rishabh 正在撰写此书，我欣喜不已：两人都拥有在学术和工业界收集、整理和建模大规模数据集的经验。我预计读会发现关于数据提取和数据准备的章节特别有用，因为这些是我在自己的职业生涯中发现最实用的技能。\n\
    \n**Julian McAuley**  \n加州大学圣地亚哥分校 副教授\n\n## Laurence Moroney 撰\n\n这是一本重要的书！数据是任何机器学习或\
    \ AI 解决方案的命脉，仅靠公开可用的数据集只能走这么远。让我对这本书感到兴奋的是，Jigyasa 和 Rishabh 超越了这些范畴，教你如何有效地创建、整理和管理数据。他们将通过多个场景带你了解如何从在线零售和新闻聚合网站等多样化来源获取真实世界的数据，但他们不会止步于粗糙的复制粘贴，而是会演示使数据集极具可用性的完整流程。本书第\
    \ 3 章尤为强大，你将看到如何从第一性原理出发，经历数据修剪、匿名化、标准化、转换和平衡的过程。第 4 章将带你完成特征工程这一重要任务，你不再只是将原始数据扔给问题，而是可以通过裁剪、缩放、分桶等更多手段对其进行细化和改进。所有这些都将为你使用自己采集、清洗和管理的、为实现最佳模型创建而优化的自定义数据进行机器学习做好准备。我对这个领域真的很兴奋，也很高兴存在这么一本书。拿起它，阅读，学习，享受吧！\n\
    \n**Laurence Moroney**  \nGoogle 首席人工智能布道师\n\n## Mengting Wan 撰\n\n这些年来，随着机器学习和数据科学的快速发展，数据始终是几乎所有下游研究、分析或智能产品功能开发的关键基石。人们很容易注意到，如今存在大量关于帮助人们掌握“消费数据”技能的书籍和课程；然而，鲜有资源探讨如何仔细收集、处理和整理高质量数据集。我曾在加州大学圣地亚哥分校与\
    \ Rishabh Misra 合作过多个研究项目，并从他那里学到了许多实用的数据收集和处理技能。因此，得知 Jigyasa 和 Rishabh 愿意分享他们在该领域的知识，我感到万分兴奋，并真心感谢他们为这本书付出的努力。本书介绍了关键的数据收集、提取、准备和处理技能。它还提供了多个机器学习应用示例，并从面向应用的角度切入数据问题。我个人认为，这本书对研究人员和从业者非常有帮助，能帮他们消除数据可用性障碍，主动且负责任地收集所需数据，并理解其数据集的优势和局限性。在这方面，我认为对于愿意从零开始学习数据集收集流程的数据爱好者来说，这本书将是理想的起点。\n\
    \n**Mengting Wan**  \nMicrosoft 高级应用科学家\n\n# 序言\n\n在当代人工智能和机器学习的世界里，数据是新石油。理所当然，该领域的巨大飞跃归功于大规模数据的获取。尽管事实如此，关注点往往仍集中在机器学习的方法论层面，这虽利于入门，却可能限制我们的进步。当我们对时髦的方法论达到一定的舒适度后，仅去解决那些已有现成完善数据集的问题，会遏制我们的潜力。因此，要让机器学习算法施展魔力，必须通过掌握整理高质量数据集的知识来奠定坚实基础。随着社交网络、在线零售商、流媒体平台以及知识和经验分享平台的现代繁荣，任何形式的数据——无论是文本、音频还是视觉——都不再短缺。因此，海量的原始数据触手可及。我们所需要的，只是识别有价值信息并提取有意义数据集的技能，以打造更精准的模型。\n\
    \n《Sculpting Data for ML》（为 ML 雕琢数据）是机器学习这出大戏的第一幕。它旨在启迪机器学习和人工智能爱好者、从业者及数据科学家，让他们了解这一领域的基本面向之一——**数据集整理**。这一阶段往往得不到应有的聚光灯，却在学术界和工业界都具有高度相关性。本书的显著特点在于，它提供了一份从零构建高质量数据集的分步指南。书中内嵌的实操教程使用\
    \ Python 及 `BeautifulSoup` 和 `Selenium` 等工具，指导如何从各类网络来源合乎道德地收集数据。整个流程建立在这样一个事实之上：预测模型需要访问相关的、结构化的和独特的数据才能有效运作。总体而言，本书涵盖了数据集构建、预处理和工程化有影响力特征的不同技术，从而凸显了数据表示对机器学习模型的重要性。除了将数据塑造成其应有的格式，本书还讨论了处理嘈杂和不可靠数据的方法。向后部分，它阐述了各种机器学习范式及其数据需求，展示了如何识别合适的学习算法以有效解决棘手问题。本书邀请读者踏上数据集整理的务实之旅。其目标是确立数据的重要性，尤其是其应有的格式，并认识到其对提升机器学习系统能力的影响。\n\
    \n**Jigyasa Grover & Rishabh Misra**\n\n"
