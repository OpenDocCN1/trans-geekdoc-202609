    \ The above discussion and examples help us understand how noisy data could be\
    \ detrimental to a learning algorithm and how we can use simple techniques to\
    \ remove sub-optimal records from a dataset. This data trimming stage significantly\
    \ reduces the dataset’s size and gives us a clean version of the data. Using this\
    \ clean data in training the model, we might boost its generalization capability.\
    \ 2•  Data Anonymization Nowadays, government agencies around the world are strictly\
    \ enforcing user privacy and data protection laws. For giant multinational corporations,\
    \ user data is like a gold mine. In the absence of appropriate checks, the corporations\
    \ can easily use and abuse it to their advantage. Acknowledging this sensitive\
    \ issue, it is our responsibility to satisfy the data privacy requirements while\
    \ building a dataset so that it is safe to release it publicly. The process of\
    \ safeguarding private and sensitive information by deleting or encrypting personally\
    \ identifiable information from a dataset is called Data Anonymization . Full\
    \ name, social security number, driver’s license number, bank account number,\
    \  passport number, and email address are some examples of Personally Identifiable\
    \ Information (PII) that someone can use to identify a particular person. Data\
    \ Anonymization enables safe data usage for various purposes with a reduced risk\
    \ of unintentional disclosure of sensitive data. There are multiple techniques\
    \ for anonymization of the data, some of them are as follows: 1. Masking: This\
    \ technique involves concealing data with altered values. A simple example could\
    \ be character substitution, like replacing “X” with “\\*” , “4” with “&” , “H”\
    \ with “#” , and so on. It is necessary to map the symbols without a particular\
    \ pattern to avoid de-anonymization risk. 2. Pseudonymization: This method demands\
    \ substituting specific identifiers with fakely fabricated identifiers, thus preserving\
    \ statistical accuracy and maintaining data integrity. For instance, one could\
    \ replace the full name “Raquel Murillo” with “Lisbon” (Money Heist fans would\
    \ understand this better!) 3. Generalization: In this approach, we deliberately\
    \ discard some information from our set to make it less identifiable while still\
    \ maintaining data accuracy. A simple example could be that we remove the house\
    \ numbers in a set of user addresses but retain the street names. 4. Shuffling:\
    \ This is a very widely used method where we shuffle one of the data columns containing\
    \ PII so that the new value and the attributes of the remaining record do not\
    \ help in unique identification. 5. Perturbation: This technique involves altering\
    \ the numbers by rounding them off using a base number and adding noise. Using\
    \ small numbers as a base leads to weak anonymization, whereas large numbers might\
    \ disrupt data accuracy. Hence the range of values needs to be in proportion to\
    \ the perturbation. For example, we can round off users’ age using a base of 4\
    \ because we still retain the proportionality,  whereas using 14 would seem fake\
    \ at first glance itself. 6. Synthesis: In this method, we fabricate synthetic\
    \ data with no connection to the real situation using patterns found in the dataset.\
    \ This process leads to artificially creating the data and replacing PII for protecting\
    \ data. In our case, the data scraped from ModCloth contains sensitive information\
    \ for a user, which includes the body measurements like height , bust , bra size\
    \ , cup size , hips , waist , shoe size , and shoe width . Following the acceptable\
    \ practices of building a quality dataset, we must remove any information from\
    \ the dataset that could assist an ill-intentioned person in tracing the exact\
    \ review for a product by that user and exploiting them. We can achieve this by\
    \ applying the synthesis technique discussed above to artificially generate synthetic\
    \ data of random numbers and replace the original UserID and ProductID . Further,\
    \ we can remove the links to the product and mask product names to minimize the\
    \ risk of tracing back to the exact review. This practice is all the more essential\
    \ if we extracted the data from a source that is not public and requires proper\
    \ authentication for data access, i.e., logging-in before accessing the website\
    \ and reading reviews. import numpy as np  \n\nuser\\_index = {}  \n\nproduct\\\
    _index = {}  \n\nbase\\_user = np.random.randint(0,10000)  \n\nbase\\_product\
    \ = np.random.randint(0,10000)  \n\nfor record in trimmed\\_data:  \n\n  if record\\\
    [‘unique\\_user\\_name’\\] not in user\\_index:  \n\n    user\\_index\\[record\\\
    [‘unique\\_user\\_name’\\]\\] = base\\_user + np.random.randint(0,200)  \n\n    base\\\
    _user += 200  \n\n     record\\[‘user\\_id’\\] = str(user\\_index\\[record\\[‘unique\\\
    _user\\_name’\\]\\])  \n\nif record\\[‘product\\_id’\\] not in product\\_index:\
    \  \n\n    product\\_index\\[record\\[‘product\\_id’\\]\\] = base\\_product +\
    \ np.random.randint(0,200)  \n\n    base\\_product += 200  "
  fmt: "\n# 数据清洗与匿名化处理\n\n## 数据修剪\n\n`trimmed_data.append(record)`\n\n值得注意的是，这里我们为每个用户分配了一个标识符，该标识符是用户姓名与其身体测量数据的组合。在后续的**数据匿名化**章节中，我们将讨论如何利用这一点为每个用户分配唯一的\
    \ `UserID`。\n\n### 处理缺失尺码数据\n\n进一步分析数据时，我们发现部分评论中客户报告的尺码不在对应产品的尺码目录中。缺失尺码可能源于报告错误，导致数据差异。必须从记录集中移除这些数据，以防止模型在训练时学习到这些错误信息。\n\
    \n为净化数据，首先需要收集特定产品的所有可用尺码，并交叉核对评论中购买产品报告的尺码是否属于该集合。\n\n![检查特定产品的可用目录尺码](Image00026.jpg)\n\
    \n例如，针对上装类产品，我们首先检查 ModCloth 产品页面的尺码部分。尺码位于一个 class 名为 `swatches size` 的无序 HTML\
    \ 列表（`<ul>`）属性中。利用此信息，操作如下：\n\n```python\nproduct_sizes = {}\n\nfor iterr in range(len(top_links)):\n\
    \    init = 0\n    flag = 0\n    count = 0\n    url = tops_links[iterr]\n    try:\n\
    \        browser.get(url)\n        time.sleep(4)\n    except WebDriverException:\n\
    \        print('invalid url', iterr)\n        continue\n    content = browser.page_source\n\
    \    soup = BeautifulSoup(content, \"lxml\")\n    product_id = soup.find(\"div\"\
    , {\"class\": \"product-number\"}).find(\"span\").text\n    try:\n        product_sizes[product_id]\
    \ = [i.text.strip() for i in soup.find(\"ul\", {\"class\": \"swatches size\"}).find_all(\"\
    li\")]\n    except AttributeError:\n        print('sizes not available for ',\
    \ product_id)\n    time.sleep(10 + random.randint(0,10))\n```\n\n随后可按如下方式修剪数据记录：\n\
    \n```python\ntrimmed_data = []\n\nfor record in scraped_data:\n    if record['size']\
    \ in product_sizes[record[product_id]]:\n        trimmed_data.append(record)\n\
    ```\n\n上述讨论与示例有助于理解噪声数据如何损害学习算法，以及如何使用简单技术从数据集中移除劣质记录。此数据修剪阶段显著缩减了数据集规模，提供了干净的数据版本。使用该干净数据训练模型，可能提升其泛化能力。\n\
    \n## 数据匿名化\n\n当今，各国政府机构严格执行用户隐私与数据保护法规。对于跨国巨头而言，用户数据如金矿。若缺乏适当制衡，企业极易利用并滥用数据谋利。鉴于此敏感问题，我们在构建数据集时有责任满足数据隐私要求，确保数据可安全公开发布。\n\
    \n通过删除或加密数据集中的个人可识别信息（PII）来保护私密敏感信息的过程，称为**数据匿名化**。全名、社会安全号、驾照号、银行账号、护照号、电子邮箱地址等均为\
    \ PII 示例，可用于识别特定个人。数据匿名化可在降低敏感数据无意泄露风险的前提下，支持数据的多用途安全使用。\n\n常见匿名化技术包括：\n\n1. \
    \ **掩码**：用改动后的值隐藏数据。例如字符替换，如将 `X` 替换为 `*`，`4` 替换为 `&`，`H` 替换为 `#` 等。符号映射需无规律，以防去匿名化风险。\n\
    2.  **假名化**：用虚构标识符替换特定标识符，从而保持统计准确性与数据完整性。例如将全名 `Raquel Murillo` 替换为 `Lisbon`（纸钞屋粉丝会秒懂！）。\n\
    3.  **泛化**：刻意丢弃部分信息以降低可识别性，同时保持数据准确性。例如在用户地址集中移除门牌号但保留街道名。\n4.  **打乱**：将包含 PII\
    \ 的数据列打乱，使新值与其余记录属性无法辅助唯一识别。此法应用极广。\n5.  **扰动**：以基数四舍五入并加噪声修改数值。基数过小导致弱匿名化，过大则破坏数据准确性。因此取值范围需与扰动程度成比例。例如以\
    \ `4` 为基数四舍五入用户年龄可保留比例关系，而基数 `14` 乍看即显虚假。\n6.  **合成**：利用数据集中发现的模式制造与真实情况无关的合成数据，人工创建数据并替换\
    \ PII 以保护数据。\n\n在本案例中，从 ModCloth 爬取的数据包含用户敏感信息，涉及 `height`、`bust`、`bra size`、`cup\
    \ size`、`hips`、`waist`、`shoe size`、`shoe width` 等身体测量数据。遵循优质数据集构建惯例，必须移除任何可能协助恶意人员追溯用户具体产品评论并实施剥削的信息。\n\
    \n可采用上述合成技术，生成随机数字合成数据替换原始 `UserID` 与 `ProductID`。进一步可移除产品链接并掩码产品名称，最大程度降低追溯至具体评论的风险。若数据源非公开、需认证访问（如登录后方可阅读评论），此实践愈发关键。\n\
    \n```python\nimport numpy as np\n\nuser_index = {}\nproduct_index = {}\nbase_user\
    \ = np.random.randint(0,10000)\nbase_product = np.random.randint(0,10000)\n\n\
    for record in trimmed_data:\n    if record['unique_user_name'] not in user_index:\n\
    \        user_index[record['unique_user_name']] = base_user + np.random.randint(0,200)\n\
    \        base_user += 200\n        record['user_id'] = str(user_index[record['unique_user_name']])\n\
    \n    if record['product_id'] not in product_index:\n        product_index[record['product_id']]\
    \ = base_product + np.random.randint(0,200)\n        base_product += 200\n```\n"
