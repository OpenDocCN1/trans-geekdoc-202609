    \ language as .xml files are in a format easily readable by both humans and machines.\
    \ XML is used mostly for textual data for its strong support of multiple languages\
    \ via Unicode . Though XML might be easy to use and generalize, it is very verbose,\
    \ thus bloating up the volume, and is not used widely for exporting datasets.\
    \ <?xml version=”1.0” encoding=”UTF-8”?>  \n\n<root>  \n\n  <row>  \n\n    < username>heylaura</username>\
    \  \n\n    <pin>1234</pin>  \n\n    <first\\_name>Laura</first\\_name>  \n\n    <last\\\
    _name>Wu</last\\_name>  \n\n  </row>  \n\n  <row>  \n\n    <username>iampc</username>\
    \  \n\n    <pin>999</pin>  \n\n    <first\\_name>Paige</first\\_name>  \n\n    <last\\\
    _name>Carter</last\\_name>  \n\n  </row>  \n\n  ... ... ...  \n\n</root> There\
    \ are other formats in which datasets are seldom exported like HTML (.html ),\
    \ Spreadsheets (.xls , .ods , or .gsheet ), Statistical Product and Service Solutions\
    \ (SPSS) (.dat or . sps ), and so on. However, CSV and JSON are the two most popular\
    \ formats for exporting and importing datasets because of all their positive points.\
    \ If we recall, we have been dealing with hierarchical data structure throughout\
    \ with data extracted from ModCloth . For simplicity, we can export all of that\
    \ into a JSON format. import json  \n\noutput\\_file = open(‘./ModCloth\\_scraped\\\
    _data.json’, ‘w’,encoding=’utf-8’)  \n\nfor r in scraped\\_data:  \n\n  output\\\
    _file.write(json.dumps(r) + ‘\\\\n’)  \n\noutput\\_file.close( ) The exported\
    \ dataset can then be imported into a learning framework as follows: def parseJson(fname):\
    \  \n\n  for line in open(fname, ‘r’):  \n\n    yield eval(line)  \n\nscraped\\\
    _data = list(parseJson(‘./ModCloth\\_scraped\\_data.json’)) "
  fmt: "\n### Extensible Markup Language (XML)\n\n以此标记语言导出的数据集作为 `.xml` 文件，其格式既易于人类阅读，也易于机器解析。XML\
    \ 主要用于文本数据，因为它通过 Unicode 提供了对多语言的强力支持。尽管 XML 可能易于使用和推广，但它非常冗长，会导致数据量膨胀，因此不广泛用于导出数据集。\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<root>\n  <row>\n    <username>heylaura</username>\n\
    \    <pin>1234</pin>\n    <first_name>Laura</first_name>\n    <last_name>Wu</last_name>\n\
    \  </row>\n  <row>\n    <username>iampc</username>\n    <pin>999</pin>\n    <first_name>Paige</first_name>\n\
    \    <last_name>Carter</last_name>\n  </row>\n  ...\n</root>\n```\n\n还有其他极少用于导出数据集的格式，如\
    \ HTML (`.html`)、电子表格 (`.xls`、`.ods` 或 `.gsheet`)、统计产品与服务解决方案 SPSS (`.dat` 或 `.sps`)\
    \ 等。然而，鉴于其诸多优点，CSV 和 JSON 是导出和导入数据集的两种最流行格式。\n\n回顾一下，我们一直在处理从 ModCloth 提取的层级数据结构。为简单起见，我们可以将所有数据导出为\
    \ JSON 格式。\n\n```\nimport json\n\noutput_file = open('./ModCloth_scraped_data.json',\
    \ 'w', encoding='utf-8')\n\nfor r in scraped_data:\n    output_file.write(json.dumps(r)\
    \ + '\\n')\n\noutput_file.close()\n```\n\n导出的数据集随后可以按如下方式导入学习框架：\n\n```\ndef parseJson(fname):\n\
    \    for line in open(fname, 'r'):\n        yield eval(line)\n\nscraped_data =\
    \ list(parseJson('./ModCloth_scraped_data.json'))\n```\n"
