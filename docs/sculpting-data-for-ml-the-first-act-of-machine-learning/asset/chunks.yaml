    # Chapter 2: DATASET EXTRACTION


    ## The Planning Phase


    Before we start this journey of Dataset Extraction, here is a word of caution:
    **Be Patient**. To build a dataset belonging to the superlative category, we would
    have to scout the web extensively for a start and then knead it accordingly, which
    is a cumbersome task. Worry Not! We have laid out a straightforward step-by-step
    process from our past experiences in academia and industry to help make the exploration
    systematic and efficient.


    ### 1. Where is the Data? Overview of the Data Sources


    According to David McCandless, a famous journalist and founder of the visual blog
    Information Is Beautiful, “in today’s complex information jungle, data is the
    new soil”. McCandless celebrates data as a ubiquitous resource providing a fertile
    and creative medium from which new ideas and understanding can grow. In this modern
    world, all of us are inundated by information at all times. To think of data as
    a table filled with numbers would be an obsolete concept. There is data at more
    places than what we can even count. Countless things are happening every second
    on digital platforms: e-mails are sent and received, phrases searched in a variety
    of search engines, content posted on social networks, products reviewed, added
    to cart for online shopping, apps downloaded on different handheld and wearable
    devices, blogs posted, restaurants checked-in and food reviewed, stocks traded,
    currencies converted, and so on. The data streams are infinite, but the trick
    is not to let this information overwhelm; instead, hone the skills to pull out
    valuable insights for the social and corporate good.


    ### 2. Sample Datasets


    In simple terms, a dataset is a collection of related sets of information constituting
    separate knowledgeable elements. This book will be using a handful of datasets
    curated by the authors to walk through the entire data sculpting process.


    #### Clothing Fit Dataset for Size Recommendation [[1]](#text00011.html#page_50)


    To improve customers’ online shopping experiences and to reduce product return
    rates, it is vital to have a nifty clothing size recommendation framework in place.
    We used **ModCloth**, an online retailer of indie and vintage-inspired women’s
    clothing, to create datasets for this use case. This dataset contains fit feedback
    from customers on their purchased clothing items and other information like ratings,
    reviews, category information, customer measurements, etc. This dataset helps
    identify critical features that determine the fit of a particular clothing product
    size for a specific customer.


    #### News Category Dataset [[2]](#text00011.html#a1K6)


    We fabricated this dataset from **HuffPost**, an American news aggregator and
    blog. It contains around 200,000 news headlines from 2012 to 2018, having details
    like news category, news headlines, a short description of news stories, publication
    date, and so on. The dataset could be used for multiple purposes, for instance,
    identifying tags of untracked news articles or identifying the type of language
    used in different news categories.


    #### Sarcasm Detection Dataset [[3]](#text00011.html#a1JH)


    Past studies for sarcasm detection tasks have mostly used data from **Twitter**,
    a microblogging and social networking service. The data from it is collected using
    hashtag based supervision. However, such datasets are noisy, especially in terms
    of label assignments and language used. To overcome these limitations, we used
    **TheOnion** and **HuffPost** to create a custom dataset for our purpose. **TheOnion**
    is an American satirical digital media company that publishes sarcastic articles
    on international, national, and local news, whereas **HuffPost** reports the corresponding
    real news.


    ### 3. Situational Analysis


    Depending on why we want to collect data, there are different ways to approach
    building good quality datasets. Considering the situation where we have a specific
    problem we want to address with the help of data, we have a north star, and we
    follow the **Guided Search** approach. If we are just curious and want some interesting
    data points, **Unguided Search** should be enough to fuel that wanderlust. Both
    these situations have their challenges, and in the following sections, we shall
    learn how to overcome them.


    #### I. Guided Search


    As discussed above, when we have a specific problem in mind and have to build
    a dataset to address that, we go along with the **Guided Search** approach. Among
    the sample datasets mentioned earlier, we curated **Clothing Fit** and **Sarcasm
    Detection** to address specific problems, and hence these are good candidates
    to discuss this approach in detail.


    ##### A. Challenge


    The biggest challenge of the **Guided Search** of datasets is understanding the
    problem statement in and out. It also includes listing the essential data signals
    required by the **Machine Learning** models to address the problem completely.


    ##### B. Relevant Data Identification


    ###### Formal Problem Definition


    Before we can identify the essential data signals, we must try to define the problem
    formally. Let us dry run this exercise for the **Clothing Fit** and **Sarcasm
    Detection** datasets.


    The idea behind the **Size Recommendation** problem is that we want to develop
    a **Machine Learning** model that can accurately predict a size that would fit
    the customer best, given product catalog sizes. So, formally we could define this
    problem as:


    > “Given past transactions of customers where they have reported the size purchased
    and their fit feedback, develop a **Machine Learning** model that takes in a future
    transaction and reports whether the purchase would be a fit or not.”


    The idea behind **Sarcasm Detection** is that we should identify whether a particular
    text snippet is sarcastic or not. So we can formally define the problem as:


    > “Given a set of sentences where we know which ones are sarcastic and which are
    not, build a **Machine Learning** model that can take any random sentence as input
    and output whether it is sarcastic or not.”


    ###### Essential Data Signal Determination


    In layperson’s terms, we can define a **data signal** as a piece of information
    transmitted by a particular data point. In the **Size Recommendation** problem,
    we want to recommend clothing sizes to customers. Based on the formal definition,
    we can identify the following as the essential data signals for a particular purchase:


    `UserID`, `ProductID`, `size purchased`, and `fit feedback`.


    The ID features form a vital function of tying the required information and making
    the data point unique. Undoubtedly, we can collect other data signals for a transaction,
    like `product category` or `user age`; however, they are not of absolute necessity.
    The skill of identifying essential data signals comes from problem understanding
    and domain knowledge, and the following ways could assist in that task.


    **Searching the web for a legitimate source with all the required signals:** This
    is where our Googling skills would come in handy. We put our web surfing expertise
    to use by exploring different websites and checking whether they provide all the
    required essential data signals or not. For example, consider **Zappos**, an online
    shoe and clothing retailer, for creating the **Clothing Fit** dataset. It seems
    promising as **Zappos** provides `UserID`, `ProductID`, `fit review`, and many
    other data signals. However, the missing `size purchased` signal throws a red
    flag. On the other hand, exploring online retailers like **ModCloth** leads us
    to all the above-identified essential data signals (though it might need additional
    tweaking; more on this later).


    ![A typical product review page on Zappos](Image00007.jpg)


    **Combining signals from multiple sources:** The signal combination technique
    comes in handy when we cannot find a single source that provides all the essential
    data signals. The **Sarcasm Detection** dataset is a perfect example of combining
    data from multiple sources to fabricate a practical dataset. Since we know the
    problem (i.e., to detect the use of sarcastic tone) and the type of data we want
    (i.e., both sarcastic and non-sarcastic text snippets to learn the difference),
    we do not necessarily have to stick to one source to provide all the information.
    Upon a quick web search, we identified **TheOnion** as a source to get sarcastic
    text, and for non-sarcastic snippets, we relied on a real news reporting website
    like **HuffPost**.


    ![A classic example of a sarcastic article from TheOnion](Image00008.jpg)


    ###### Data Volume Requirement


    Another consideration while selecting a data source is if the source contains
    enough historical data to construct a sufficiently large dataset. Non-supportive
    instances could be when the online retailer does not have enough customer reviews
    reporting fit feedback, or the news source does not have an archive of old posts.
    The corresponding **Machine Learning** model might not learn suitable model parameters
    to capture patterns in such an underpowered dataset. In cases like these, it would
    be wise to combine data from multiple small sources or find a singular source
    to provide a large enough dataset.


    At this point, there might be a question as to what is a large enough dataset.
    The data volume requirement is usually tied to the use case or the problem type
    (we shall soon discuss the different types of **Machine Learning** problems).
    For regression problems, we can come up with intervals based on the target variable
    range and reckon if most intervals have at least a few data points. For classification
    problems, we can see if the ratio of the number of data points to the number of
    classes is large enough. For example, 20,000 data points might be enough for 2
    classes, but not for 10,000 classes.


    ###### Data Integration from multiple sources


    This step is very open-ended and can be considered based on one’s personal preference.
    Once we have shortlisted a data source that provides all the essential data signals
    and has sufficient volume, there could be different ways to further improve the
    dataset. An idea in that direction is to get more metadata by combining multiple
    sources, which might provide more data signals to our **Machine Learning** model.
    While doing that, we should always think if it would lead to better feature engineering
    (we shall talk more about this later) or solve a broader problem.


    #### II. Unguided Search


    For creative souls who are planning to fashion an exciting, distinctive yet worthwhile
    dataset, **Unguided Search** is what they should follow. We will refer to the
    **News Category** dataset to further explain the challenges and various data search
    problems. Since we collected the dataset without having a specific problem at
    hand, it is an excellent example of this approach.


    ##### A. Challenge


    The biggest challenge for **Unguided Search** of datasets is that it involves
    uncertainty to a vast extent. Since we are not sure what data signals we require
    in our dataset, there is no proper structure for the consequent search operation.


    ##### B. General Data Search


    Although not knowing the problem makes things difficult in this case, the following
    dimensions try to bring some structure to our search for good quality datasets.


    ###### Interesting Problem Recognition


    **Does the source contain data signal(s) worth estimating?** While analyzing a
    website as a potential data source, we should contemplate if it provides any exciting
    information that is unique and worth working on with an estimation motive. It
    does not have to be completely out-of-the-box; it could be straightforward as
    the following example. While browsing **HuffPost**, a popular American news website,
    we observed that each story has tags with categories (like `sports`, `politics`,
    `entertainment`, `shopping`). We thought it would be a worthy idea to predict
    the category given the text of the story. Contrastingly, for a not-so-straightforward
    case, we collected headlines from **TheOnion** and **HuffPost** as sarcastic and
    non-sarcastic text snippets, respectively, and accounted for the indirect data
    signal of predicting whether a text snippet was sarcastic or not.


    ![The different categories of news articles as available on the HuffPost](Image00009.jpg)


    **Does estimating the said data signal lead to fascinating results?** One of the
    signs of a competent dataset is that its signals can address some contemporary
    practical problems. Or, it could also have the ability to help us lead to fascinating
    insights into some phenomenon. For example, training a classifier on the **News
    Category** dataset could help identify any prose’s writing style, whether it is
    `political`, has a `humorous tone`, is a `criminal report`, or is based on the
    `latest fashion trends`. It can also help tag untracked news articles or understand
    how writing styles differ for different news types.


    ###### Side-Information or Metadata Association


    According to the research publication *Patterns for Learning with Side Information*
    by Rico Jonschkowski, Sebastian Höfer, and Oliver Brock, “Generalization of the
    learned function to unseen data can be improved by incorporating side information
    into learning. Side-Information are data that are neither from the input space
    nor from the output space of the function, but include useful information for
    learning it.” Hence our dataset must have data about the data itself, which would
    help predict the outcome.


    Once a data signal is considered worth estimating, it is necessary to ensure that
    the web source provides enough side-information for the prediction task. If not,
    then we should be able to join some other data sources to make that possible.
    For example, predicting a product’s price from just the essential data signals
    might not go very well if we don’t have metadata around, let’s say, the `brand`,
    or the `fabric` of the product. Thus, including a sufficient amount of side-information
    in the dataset helps the **Machine Learning** model decipher patterns better.


    ###### Data Volume Requirement


    The majority of the pointers in the corresponding **Guided Search** section apply
    here as well. Although, with a relaxed constraint that there does not exist a
    specific problem definition that binds us. Based on the data availability, we
    could modify potential problem statements. However, we have to make sure that
    the resulting problem is still an interesting one to solve. For example, in the
    **News Category** dataset, we had many categories with less than 100 headlines.
    Since we do not have a problem definition necessitating the prediction of infrequent
    classes, we can remove the corresponding records from the dataset. This way, the
    learning algorithm can determine better parameters for the remaining classes.


    ###### Dataset Uniqueness Check


    This step is essential to ascertain that we contribute something unique and worthwhile
    to the community and not just repeat something that already exists on the internet.
    To do a quick check, we can do simple Google searches for this purpose. If we
    find that some datasets already exist from a particular source, a refined way
    to contribute is to figure out the shortcomings of the prevailing datasets. It
    would be fruitful to ask questions like:


    > “Does the existing dataset come from a noisy source (i.e., are the labels not
    reliable)? What is the quality and quantity of side-information in the dataset?
    What is the size of the dataset, and can the **Machine Learning** model benefit
    from larger-scale data? Can we combine this dataset with data from a different
    source to create something better? How recent is the dataset?”


    It is essential to address novelty, as replicating something that already exists
    might not be a fair use of our time and efforts.


    ## The Extraction Phase


    After carefully finalizing the web source, we will collect data. Let us now move
    on to the **Extraction Phase**, which is where the actual work gets done.


