- raw: 'This algorithm has the term regression in its name since the output value
    is derived using a linear function of the input variables (i.e., features), just
    like linear regression (more on this later in this section). The difference here
    is that we further pass this linear function of features through a logit function
    that squishes its value in the 0 to 1 range, representing the probability of occurrence
    of a class. The algorithm learns the weights or the regression equation’s coefficient
    by maximizing the likelihood of the observed classes’ occurrence. ![](Image00043.jpg)Sigmoid
    Activation Function. One of the most significant advantages of this technique
    is its ease of implementation and training efficiency with decent model performance.
    Along with the actual label’s probabilities, we also get conditional probabilities
    to use for other purposes. However, being a linear model, it does  not work well
    when the classification boundaries are non-linear. Logistic regression algorithms
    are also known to not work with imbalanced classes and data with outliers. Hence,
    it is necessary to explore and balance the data well before proceeding with this
    algorithm’s application. B•  Decision Trees Decision Trees use a flowchart-like
    structure to help visualize decision points and their outcomes effectively. Each
    node in the tree represents a decision taken on a particular feature based on
    some thresholds, which splits the data into two or more homogeneous sets. Growing
    this tree involves deciding on which features to choose and what conditions to
    use for splitting. This process is repeated until we reach the desired stop criterion.
    Then, the leaves of the tree can be used to make accurate classifications. Upon
    completion, the entire path from the root to any of the leaf nodes indicates the
    different classification rules. The decision tree’s objective is to learn what
    features to split on and decide the respective thresholds. After this, when an
    unseen data record (from the test dataset) is observed, it is passed through the
    tree’s different decision points. The  final class membership is decided based
    on the majority vote from the data points associated with the leaf node where
    the unseen data record ends up. Simple examples where a decision tree can be useful
    could be: • Given a pet’s picture, we need to classify whether it is a cat or
    a dog . • Based on a questionnaire about a person’s characteristics, we need to
    classify them as a gamer or non-gamer . ![](Image00044.jpg)A simple decision tree
    for the Size Recommendation problem in action. Decision Trees are intuitive and
    interpretable owing to their strong visualization aspect. They yield decent classification
    performance with not many high-end computational requirements. They also work
    effectively for non-linear classification boundaries. Decision Trees have proven
    to address class imbalance and outliers fittingly.  However, they tend to overfit
    if they grow without proper supervision and are not pruned carefully. Furthermore,
    this approach only produces the class prediction and not the probability score
    that is often used for ranking purposes. Regardless, Decision Tree classifiers’
    inductive approach for classification makes them a popular tool for Machine Learning
    and operations research for strategic decision analysis. C•  K-Nearest Neighbour
    (KNN) k-Nearest Neighbour is a simple and easy to implement Supervised Classification
    technique. Like the saying “birds of a feather, flock together” , kNN works on
    the principle of proximity and assumes that data points closer to each other are
    similar. This classification technique finds k data points in the training data
    closest to the unseen data point during inference time and assigns it to the class
    shared by the majority of those k data points. To define the closeness, we could
    choose any distance metric quantifying the proximity of two data points. For categorical
    variables, we can use the Hamming Distance , which computes the number of positions
    at which the two variables of equal dimensions differ at corresponding positions.
    In the case of continuous variables, here are some standard distance measures:
    • Euclidean Distance : It is a measure that computes the length of a straight
    line between two points in Euclidean space. Mathematically, it is the square root
    of the sum of the squares of the differences of  the coordinates. ![](Image00045.jpg)•
    Manhattan Distance : It is the distance between two points measured along the
    axes at right angles. Mathematically, it is the sum of the absolute values of
    the differences of the coordinates. ![](Image00046.jpg)• Minkowski Distance :
    We can consider this distance as a generalization of both the Euclidean distance
    and the Manhattan distance in the normed vector space. The case where z = 1 is
    equivalent to the Manhattan distance, and the case where z = 2 is equivalent to
    the Euclidean distance. ![](Image00047.jpg)k-Nearest Neighbor is a non-parametric
    method. It does not make any assumptions regarding the training data’s underlying
    data distribution, i.e., whether their classification boundaries are linear, quadratic,
    etc. The performance of kNN depends on the data representation and the distance
    measure described above. The value of k also plays a vital role. Choosing the
    optimal value is best done by experimentation, a process referred to as parameter
    tuning . Computing many neighbors for each data point is computationally expensive,
    whereas having fewer neighbors makes the model very noisy. Ideally, we choose
    the value of k via cross-validation by using an independent dataset other than
    train and test ones. One of the plus points of kNN is its robustness to the labels’
    noise since the k nearest neighbors influence its decision, thereby averaging
    out the noise (if any). kNN does not have an explicit training phase and computes
    the neighbors by iterating over the test data points; hence it is aptly termed
    a lazy algorithm . But this characteristic, however, leads to longer prediction
    times. Another drawback of kNN is its inability to perform well on imbalanced
    data. In that case,  it would compute neighbors closer to the majority classes
    only, leaving out the minority classes as outliers. kNN also suffers from the
    curse of dimensionality, a concept we discussed previously. As the data points’
    dimensions increase, we would require more data for kNN to have a decent performance.
    Considering all the positives and the negatives of this easy-to-understand approach,
    kNN is widely used for economic forecasting, data compression, and genetic studies.
    II•  Regression Regression is a Supervised Learning approach where we predict
    a real output value based on the input features. The regression technique learns
    a function to model the relationship between the target value, which is continuous,
    and the features from training data. It then uses this knowledge to predict the
    output value of the unseen data points. A simple example of where a regression
    algorithm is useful would be predicting a taxi ride’s fare where the price depends
    on inputs like origin, destination, duration, time, traffic, city, car type, passenger
    count, and so on. Let us discuss some popular Regression Algorithms. A•  Linear
    Regression Linear Regression is one of the most effortless regression techniques.
    We model the relationship between the scalar output (or the target variable denoted
    by y ) and the input predictor variables (referred to as features and denoted
    by X ) by fitting a linear function on the training dataset: y = f(X) = b + mX
    . The term b incorporates the degree of freedom and is called the bias term or
    intercept . It allows the straight line to be moved up or down in the coordinate  space.
    Linear Regression is also referred to as the Ordinary Least-Squares Regression
    because of the way the model parameters, b and m , are learned. We minimize the
    sum of the squares of the vertical deviations from each data point to the straight
    line that best fits all the train data points. Additionally, the learned model
    parameters m can also explain the strength of the relationship between the target
    variable and the features. This process is known as Regression Analysis , and
    we also discussed it as one of the methods for computing Feature Importance .
    That is to say, the feature with a higher model parameter value has more predictive
    power than the one with a lower value. We can safely remove a feature with a zero
    coefficient since it would not influence the model’s prediction. This concept
    is often used in the different regularization methods , which puts pressure on
    the large values of coefficients to reduce the model’s complexity. The two most
    common methods of regularization are: 1. Lasso Regularization : This method not
    only focuses on minimizing the mean squared error but also on minimizing the absolute
    sum of the coefficients. It is also referred to as the L1 Regularization . 2.
    Ridge Regularization : Apart from minimizing the mean squared error, this also
    minimizes the squared sum of the coefficients. It is also referred to as the L2
    Regularization . Linear Regression is a powerful statistical model and has wide
    adoption in business as it helps to find trends in customer behavior, forecasting
    sales, risk analysis, and so on. Based on our use case, we could have a different
    number of features or requirements of the regression equation, which leads us
    to the following types of Linear Regressions: 1 . Simple Linear Regression : This
    is the type of approach which contains only one feature. It uses the linear equation’s
    traditional slope-intercept form. It is denoted as the following in mathematical
    terms: y = mx + b . 2. Multivariate Linear Regression : When we have more than
    one feature, which is usually the case, we use this approach. In this situation,
    we will have multiple model parameters or the coefficient corresponding to the
    features. It is denoted as: y = b + m 1 x 1 \+ m 2 x 2 \+ … + m n x n . 3. Polynomial
    Linear Regression : A slightly more complex regression, it is used when we have
    multiple features. The relationship between the target and the input variables
    is modeled as the q th degree polynomial, where q could be any number. For example:
    y = b + m 1 x 1 2 \+ m 2 x 2 4 \+ … + m n x n q . It remains a linear regression
    in the sense that the values for different features (despite being in a polynomial
    form) are combined linearly. The main reason for the popularity of various Linear
    Regression approaches is the ease to understand and implement. The space complexity
    is low since saving the coefficients (also called weights ) at the end of the
    training phase is the only place we use memory. With the help of regularization
    techniques discussed above, linear regression can perform the feature selection
    tasks well. This capability results in reduced dimensionality and thus helps in
    avoiding overfitting. There are certain limitations of Linear Regression, which
    we should be mindful of when selecting this algorithm. Linear Regression works
    on the assumption that the data we are working with follows a Gaussian Distribution
    (or a Normal Distribution ), which might not always be accurate. It also assumes
    that the relationship between the features  and the target is linear. Furthermore,
    since linear regression tries to fit data to a single straight line, it is susceptible
    to noise and does not work well with outliers. We can mitigate some of these limitations
    by performing necessary data transformations, as discussed in the previous chapter.
    B•  Neural Network Neural Networks are modeled loosely on the working of a human
    brain. These biologically inspired Machine Learning models are designed to recognize
    patterns just like a human brain does by interpreting sensory data. A Neural Network
    consists of thousands of simple interconnected processing units referred to as
    the neurons . Usually, these neurons are arranged in different layers , and each
    layer feeds the data forward to the other layers. Additionally, each layer applies
    non-linear transformations on the data, which allow neural networks to model non-linear
    relationships between the features and the target variable. These transformations
    are applied using activation functions , which normalize neurons’ output to a
    range, usually in (-1, 1) or (0,1). Some examples of activation functions include
    Sinusoid , Gaussian , Rectified Linear Unit (ReLU), Exponential Linear Unit (ELU),
    and so on. Once we reach the last layer of the Neural Network, the transformed
    data is responsible for giving the output of our prediction problem. ![](Image00048.jpg)A
    typical Deep Neural Network (DNN) architecture. The learning aspects in Neural
    Networks come from parameters called weights that denote the strength of connections
    between different neurons. We randomly initialize these weights since we have
    limited or no knowledge at the beginning. During the training phase, we do one
    full pass of the Neural Network for each input from the training data. In that
    pass, we fuse the input data with corresponding weights, usually by multiplying,
    and pass them through a non-linear activation function . The output  from this
    is then carried further into the Neural Network until we reach the last layer
    responsible for prediction. If the predicted outcome is not accurate, each neuron’s
    weight is tuned based on a technique called Backpropagation . Backpropagation
    is a technique that allows us to effectively attribute the inaccuracy of a Neural
    Network’s output to each neuron. Once that is done, we optimize these weights
    by applying iterative optimization algorithms like Gradient Descent , AdaGrad
    , Adam , etc. One of the main advantages of Neural Networks is learning complex
    relationships on their own given input features and target variables. This learning
    is possible due to the application of non-linear transformations to the data.
    Research has consistently shown that simply providing more data to the network,
    whether new or augmented original data, rapidly improves the model performance
    . However, along with more data, they also require powerful resources to train
    and tune the model parameters, which becomes a challenging aspect of using this
    technique. Hence, simpler Machine Learning algorithms outperform the intensive
    Neural Networks for tasks with relatively smaller available datasets. Furthermore,
    with an increased number of neurons and interconnections, model parameters sometimes
    become difficult to interpret and understand. The primitive category of Neural
    Networks was shallow , i.e., only had an input layer and an output layer, or seldom
    had a single hidden layer. However, newer Neural Networks are complex and deep
    , containing multiple hidden layers of varying sizes. The application of deep
    Neural Networks is referred to as Deep Learning in today’s times. Owing to Neural
    Networks’ capability to accurately model non-linear processes, they have found
    applications in many disciplines, including medical diagnosis, face recognition,
    game playing, etc. 3•  Deep Dive: Unsupervised Learning Techniques & their Applications
    Based on our previous discussions, Unsupervised Learning algorithms infer patterns
    in the data without any prior knowledge of labels or outcomes. These algorithms
    help understand the data’s structure by extracting patterns. In the following
    sections, we would be discussing the two fundamental techniques of Unsupervised
    Learning: Clustering and Association  . I•  Clustering Clustering is one of the
    most popular Unsupervised Learning techniques and involves automatically discovering
    natural grouping in data. This approach involves grouping data points so that
    objects in a group (or cluster ) are similar, while those not in the same cluster
    are distinctly dissimilar. The similarity and dissimilarity can be gauged based
    on the features associated with each data point using some metric. This statistical
    data analysis technique is also referred to as Cluster Analysis . Clustering finds
    application in multiple domains involving Pattern Recognition, Information Retrieval,
    Image Analysis, and of course, Machine Learning (primarily Feature Engineering
    and Anomaly Detection). Since cluster analysis helps learn more about the problem
    domain, it is also a vital knowledge discovery tool. There are different types
    of clustering algorithms, and they are defined mostly on the way they discover
    these dense regions of similar data points, a.k.a. the clusters . The identification
    of clusters is subjective and might require domain experience. Typically, clustering
    is an iterative process, where we work on the evaluation repeatedly to update
    the algorithm configuration until we achieve the appropriate results. Let us quickly
    look at some standard clustering algorithms available to us. A•  K-Means Clustering
    k-Means Clustering is a centroid-based clustering algorithm that aims to partition
    the data points into exactly k clusters. These k clusters are defined such that
    each data point belongs to the cluster with the nearest centroid (or the center
    of the cluster, which is the cluster’s mean). k-Means Clustering  tends to minimize
    the variance within the cluster based on a certain distance measure. Similar to
    what we discussed in the k-Nearest Neighbours technique, the distance measure
    for continuous variables could be Euclidean, Manhattan, or Minkowski, while for
    categorical, Hamming works the best. In k-Means Clustering, we start by randomly
    choosing k different data points to serve as centroids. Considering the dataset
    has n points, we decide the remaining n-k data points’ membership based on the
    distance between them and the centroids and assign them to the closest one. Once
    the memberships are assigned, we compute new centroids by taking the associated
    points’ mean and repeating the cluster assignment process. This process is repeated
    until the centroids stabilize, and the assignments do not change much. k-Means
    Clustering is just a heuristic for an NP-hard problem and does not guarantee a
    globally optimum solution. Furthermore, since this algorithm starts with a random
    choice of centroids, different runs could yield different results; therefore,
    disrupting the algorithm’s robustness. In any case, the accuracy and speed of
    k-Means Clustering depend on the data representation, the distance measure, and
    the value of k . Choosing the optimal value of k is best done by experimentation.
    k-Means Clustering algorithm is easy to understand and implement. It is usually
    very fast in execution and finds its applications in computer vision, vocabulary
    learning, image segmentation, and astronomy. This technique’s spin-off is the
    k-Medians Clustering , which uses the cluster’s median as the centroid instead
    of the mean. This technique is more robust to outliers because of the median statistical
    metric but slower in execution for more massive datasets since finding the median
    requires  sorting. B•  Gaussian Mixture Models (GMMs) Though k-Means Clustering
    is one of the easiest ways to group a set of data points, it uses the naive method
    of assigning a cluster’s centroid based on the mean value. If the mean values
    of two clusters are very close to each other, it becomes challenging for the k-Means
    Clustering to handle it, and it keeps on oscillating between the two, thus never
    reaching stability. The k-Means Clustering approach also fails when the shape
    of the clusters is not circular. Hence, to overcome the k-Means Clustering method’s
    drawbacks, a clustering approach based on the Expectation-Maximization (EM) technique
    via Gaussian Mixture Models (GMMs) was fabricated. Clustering via GMMs provides
    a higher level of flexibility than k-Means Clustering. It assumes the underlying
    data is generated from a blend of Gaussian distributions, each corresponding to
    a particular cluster. This assumption characterizes each cluster by a mean and
    a standard deviation. Thus, if we consider this in a simple 2-D coordinate space,
    the cluster can be elliptical and not just circular. Apart from mean and standard
    deviation, each cluster also has a weight parameter that determines how the corresponding
    Gaussian distribution is mixed with the others. The above-mentioned assumption
    also means that GMMs use a soft clustering approach to assign the points to different
    clusters. This property results in hybrid membership of each data point, which
    means that a data point can belong to different clusters with varying probabilities.
    Initially, this degree of membership is unknown (or latent ) and is one more element
    to learn to compute model parameters . We compute various clusters’ parameters
    using a technique called Expectation-Maximization (EM) . Broadly, the EM algorithm
    has the following steps: 1. Initialize the model parameters viz. each cluster’s
    mean, standard deviation, and weight randomly since we have limited or no knowledge
    regarding the distribution. 2. E-Step: For each data point, using the current
    model parameters, estimate the degree of membership to each cluster. 3. M-Step:
    Based on the new cluster assignments as estimated in the above E-Step , update
    the model parameters. 4. Repeat the above E-Step and M-Step in order until we
    reach convergence. To summarize, we are increasingly improving how much each data
    point belongs to each cluster at every E-Step and using this estimate in the M-Step
    to calculate GMM’s parameters to maximize the observed data’s likelihood. For
    computational reasons, GMMs usually fail to work if the dimensionality of the
    feature space is high. They also require initial knowledge about the number of
    mixture models that the algorithm must try before coming to a halt. Regardless,
    GMMs come across as a powerful clustering technique and are more effective than
    the traditional clustering approaches. As an efficient tool for data analysis,
    GMMs have been widely applied in signal and information processing . C•  Hierarchical
    Clustering Hierarchical Clustering is a technique that seeks to build a social
    pyramid-like structure of clusters and works well for hierarchical data like taxonomies.
    Strategies for Hierarchical Clustering are usually of the following two types:
    Divisive Hierarchical Clustering It is a top-down approach where we start with
    one giant cluster containing all the data points. We then keep splitting the cluster
    into two clusters (generally based on a greedy heuristic) till each data point
    is its own cluster. Agglomerative Hierarchical Clustering It is a bottom-up approach
    where each data point starts as an individual cluster. We then keep merging the
    closest clusters (with respect to the chosen distance measure) in pairs as we
    move up in the hierarchy. This process stops when we reach one giant cluster encompassing
    all the data points. The results of Hierarchical Clustering are dendrograms with
    different levels of the tree representing the clusters. For instance, in Agglomerative
    Hierarchical Clustering, there is one root node containing all the data points,
    and the leaves at the bottom are data points as clusters. Hierarchical Clustering
    does not require us to specify the number of clusters needed; instead, we can
    stop the aggregation (or division) of clusters anytime we feel we have reached
    the desired number of clusters. This approach is not sensitive to the distance
    metric we might  be choosing, unlike other clustering algorithms. However, these
    algorithms are computationally intensive and also have large storage requirements.
    Despite its disadvantages, Hierarchical Clustering is an effective way of segmentation
    and is used in interesting cases like tracking viral outbreaks and charting evolution.
    ![](Image00049.jpg)A dendrogram example of the two types of Hierarchical Clustering
    approaches. II•  Association Another interesting approach to finding patterns
    without supervision involves discovering relationships between different attributes
    hidden in an extensive unlabeled dataset. This rule-based technique is intended
    to identify robust relationships in the dataset based on a well-defined measure
    of their interestingness and significance . For example, by analyzing customer’s
    shopping behavior on ModCloth , we can pinpoint a particular set of products that
    a customer is highly likely to buy together. It is worth understanding that this
    type of association uncovers the probability of  co-occurrence and does not imply
    causality. The order of transactions or the order of products purchased within
    a single transaction does not play a role in determining the rules, thus making
    this technique significantly different from sequence mining . This associative
    information can be used to cash in on a customer by strategically placing the
    distinguished products. It also helps in other marketing activities, like pricing
    and promotions. Apart from the above example of market-basket analysis , association
    rule learning also finds usage in malicious intrusion detection in security systems,
    continuous flow detection in manufacturing, and medical diagnosis via bioinformatics.
    A•  Association Rule Representation Relationships between various attributes in
    a dataset, as referred to above, are represented as association rules. An association
    rule is defined as an implication expression of the form: X => Y , where X and
    Y are disjoint sets. The set on the left-hand side is the antecedent . The right-hand
    side set is the consequent or the resultant . A simple example of an association
    rule in the market-basket analysis could be {beanie, boots, gloves} => {sweater}
    , which indicates that if the customer’s cart has a beanie , boots , and gloves
    , they also tend to buy a sweater . This small example is one of the many more
    intricate association rules that we can uncover from the broad set of ModCloth’s
    transaction records. To put forward strong rules, we need to select the top ones
    from the possibilities using the following measures: 1. Support  '
  fmt: "\n# 算法概述\n\n## 逻辑回归\n\n该算法名称中包含“回归”一词，因为输出值是通过输入变量（即特征）的线性函数得出的，这与线性回归类似（本节后文将详述）。不同之处在于，我们进一步将这个特征的线性函数通过一个\
    \ Logit 函数，将其值压缩在 0 到 1 的范围内，表示某个类别发生的概率。算法通过最大化观测到的类别出现的似然性来学习权重或回归方程的系数。\n\n\
    ![](Image00043.jpg)\n\n**Sigmoid 激活函数**\n\n该技术最显著的优势之一是其易于实现、训练效率高，且模型性能不错。除了实际标签的概率外，我们还能获得用于其他目的的条件概率。然而，作为一种线性模型，当分类边界是非线性时，它的效果不佳。逻辑回归算法也不适用于不平衡类别和包含异常值的数据。因此，在应用该算法之前，有必要充分探索和平衡数据。\n\
    \n## 决策树\n\n决策树使用流程图般的结构，帮助有效地可视化决策点及其结果。树中的每个节点代表基于某些阈值对特定特征做出的决策，将数据分割成两个或多个同质集合。生成这棵树涉及决定选择哪些特征以及使用什么条件进行分割。此过程重复进行，直到达到预期的停止准则。然后，树的叶子节点可用于进行准确分类。完成后，从根节点到任意叶子节点的整条路径代表不同的分类规则。\n\
    \n决策树的目标是学习在哪些特征上分割并决定相应的阈值。之后，当观察到一条未见过的数据记录（来自测试数据集）时，它会通过树的不同决策点。最终的类别归属取决于未见数据记录所到达的叶子节点相关联的数据点的多数投票。\n\
    \n决策树有用的简单示例：\n- 给定宠物的图片，我们需要将其分类为猫或狗。\n- 基于关于一个人特征的问卷，我们需要将其分类为玩家或非玩家。\n\n![](Image00044.jpg)\n\
    \n**尺寸推荐问题中一个简单的决策树示例**\n\n决策树因其强大的可视化特性而直观且易于解释。它们在没有太多高端计算需求的情况下产生不错的分类性能。它们也能有效处理非线性分类边界。决策树已被证明能妥善处理类别不平衡和异常值。\n\
    \n然而，如果在没有适当监督和仔细剪枝的情况下生长，它们倾向于过拟合。此外，这种方法仅产生类别预测，而不产生常用于排序目的的概率分数。尽管如此，决策树分类器用于分类的归纳方法使其成为机器学习和运筹学中战略决策分析的流行工具。\n\
    \n## K-近邻算法 (KNN)\n\n`k-Nearest Neighbour` 是一种简单且易于实现的监督分类技术。正如谚语“物以类聚”所述，`kNN`\
    \ 基于邻近性原理工作，假设彼此更近的数据点是相似的。这种分类技术在推理时找到训练数据中最接近未见数据点的 `k` 个数据点，并将其分配给这 `k` 个数据点中大多数共享的类别。\n\
    \n为了定义“接近程度”，我们可以选择任何量化两个数据点邻近度的距离度量。\n- 对于分类变量，可以使用 `Hamming Distance`（汉明距离），它计算两个维度相等的变量在对应位置上不同的位置数量。\n\
    - 对于连续变量，以下是一些标准距离度量：\n  - **欧几里得距离**：计算欧几里得空间中两点之间直线长度的度量。数学上，它是坐标差的平方和的平方根。\n\
    \  \n  ![](Image00045.jpg)\n  \n  - **曼哈顿距离**：沿直角轴测量的两点之间的距离。数学上，它是坐标差绝对值的和。\n\
    \  \n  ![](Image00046.jpg)\n  \n  - **闵可夫斯基距离**：可视为向量范数空间中欧几里得距离和曼哈顿距离的推广。`z =\
    \ 1` 的情况等同于曼哈顿距离，`z = 2` 的情况等同于欧几里得距离。\n  \n  ![](Image00047.jpg)\n\n`k-Nearest\
    \ Neighbor` 是一种非参数方法。它不对训练数据的潜在数据分布做任何假设，即不管其分类边界是线性、二次等。`kNN` 的性能取决于上述的数据表示和距离度量。`k`\
    \ 的值也起着至关重要的作用。通过实验选择最优值最好，这个过程称为**参数调优**。\n\n为每个数据点计算许多邻居在计算上很昂贵，而邻居太少会使模型非常嘈杂。理想情况下，我们通过交叉验证使用独立于训练集和测试集的数据集来选择\
    \ `k` 的值。\n\n`kNN` 的一个优点是其对标签噪声的鲁棒性，因为 `k` 个最近邻影响其决策，从而平均掉噪声（如果有）。`kNN` 没有显式的训练阶段，而是通过迭代测试数据点来计算邻居；因此它被恰当地称为**懒惰算法**。但这一特性导致预测时间较长。\n\
    \n`kNN` 的另一个缺点是无法在不平衡数据上表现良好。在这种情况下，它只会计算靠近多数类的邻居，将少数类作为异常值排除在外。`kNN` 还受维度灾难影响，这是我们之前讨论过的概念。随着数据点维度的增加，`kNN`\
    \ 需要更多数据才能获得不错的性能。\n\n考虑到这种易于理解的方法的所有优缺点，`kNN` 广泛用于经济预测、数据压缩和遗传学研究。\n\n# 回归\n\n\
    回归是一种监督学习方法，我们根据输入特征预测真实的输出值。回归技术学习一个函数来建模目标值（连续的）与训练数据特征之间的关系。然后利用这些知识预测未见数据点的输出值。\n\
    \n回归算法有用的一个简单示例是预测出租车车费，价格取决于起点、终点、时长、时间、交通、城市、车型、乘客数量等输入。\n\n让我们讨论一些流行的回归算法。\n\
    \n## 线性回归\n\n线性回归是最简单的回归技术之一。我们通过在训练数据集上拟合一个线性函数，来建模标量输出（或目标变量，用 `y` 表示）和输入预测变量（称为特征，用\
    \ `X` 表示）之间的关系：`y = f(X) = b + mX`。\n\n项 `b` 包含自由度，称为**偏置项**或**截距**。它允许直线在坐标空间中上下移动。线性回归也称为**普通最小二乘回归**，因为模型参数\
    \ `b` 和 `m` 的学习方式。我们最小化每个数据点到最佳拟合所有训练数据点的直线的垂直偏差平方和。\n\n此外，学习到的模型参数 `m` 还可以解释目标变量与特征之间关系的强度。这个过程称为**回归分析**，我们也将其作为计算**特征重要性**的方法之一进行了讨论。也就是说，模型参数值较高的特征比数值较低的特征具有更强的预测能力。我们可以安全地移除系数为零的特征，因为它不会影响模型的预测。这个概念常用于不同的**正则化方法**中，这些方法对系数的大值施加压力以减少模型的复杂性。\n\
    \n两种最常见的正则化方法是：\n1. **Lasso 正则化**：此方法不仅关注最小化均方误差，还关注最小化系数绝对值之和。也称为 `L1 Regularization`。\n\
    2. **Ridge 正则化**：除了最小化均方误差外，还最小化系数平方和。也称为 `L2 Regularization`。\n\n线性回归是一个强大的统计模型，在商业中广泛采用，因为它有助于发现客户行为趋势、销售预测、风险分析等。根据用例，我们可能有不同数量的特征或回归方程要求，这引出了以下类型的线性回归：\n\
    \n1. **简单线性回归**：仅包含一个特征的方法。使用线性方程的传统斜截式。数学上表示为：`y = mx + b`。\n2. **多元线性回归**：当我们有多个特征时（通常是这种情况），使用此方法。在这种情况下，我们将有对应特征的多个模型参数或系数。表示为：`y\
    \ = b + m1*x1 + m2*x2 + … + mn*xn`。\n3. **多项式线性回归**：一种稍复杂的回归，用于有多个特征的情况。目标与输入变量之间的关系建模为\
    \ `q` 次多项式，其中 `q` 可以是任意数字。例如：`y = b + m1*x1^2 + m2*x2^4 + … + mn*xn^q`。它之所以仍是线性回归，是因为不同特征的值（尽管以多项式形式）是线性组合的。\n\
    \n各种线性回归方法流行的主要原因是易于理解和实现。空间复杂度低，因为训练阶段结束时仅保存系数（也称为**权重**）是我们唯一使用内存的地方。借助上述讨论的正则化技术，线性回归可以很好地执行特征选择任务。这种能力导致维度降低，从而有助于避免过拟合。\n\
    \n选择该算法时，我们应注意线性回归的某些局限性。线性回归假设我们处理的数据遵循**高斯分布**（或**正态分布**），这可能并不总是准确。它还假设特征与目标之间的关系是线性的。此外，由于线性回归试图将数据拟合到一条直线，它容易受噪声影响，且不适用于包含异常值的数据。我们可以通过执行必要的数据转换来缓解其中一些限制，正如上一章所讨论的。\n\
    \n## 神经网络\n\n神经网络松散地模仿人脑的工作原理。这些受生物学启发的机器学习模型旨在通过解释感官数据来识别模式，就像人脑一样。神经网络由数千个简单的相互连接的处理单元组成，称为**神经元**。通常，这些神经元排列在不同的**层**中，每一层将数据前馈到其他层。此外，每一层对数据应用非线性变换，这使得神经网络能够建模特征与目标变量之间的非线性关系。这些变换使用**激活函数**应用，将神经元的输出归一化到一个范围，通常在\
    \ `(-1, 1)` 或 `(0,1)` 之间。激活函数的示例包括 `Sinusoid`、`Gaussian`、`Rectified Linear Unit\
    \ (ReLU)`、`Exponential Linear Unit (ELU)` 等。一旦到达神经网络的最后一层，变换后的数据负责给出我们预测问题的输出。\n\
    \n![](Image00048.jpg)\n\n**典型深度神经网络 (DNN) 架构**\n\n神经网络的学习方面来自称为**权重**的参数，表示不同神经元之间连接的强度。我们随机初始化这些权重，因为一开始知识有限或没有知识。在训练阶段，我们对训练数据中的每个输入进行一次神经网络的完整前向传递。在此传递中，我们将输入数据与相应的权重融合（通常通过乘法），并通过非线性激活函数。此输出进一步传入神经网络，直到到达负责预测的最后一层。\n\
    \n如果预测结果不准确，则基于一种称为**反向传播**的技术调整每个神经元的权重。**反向传播**是一种允许我们将神经网络输出的不准确性有效归因于每个神经元的技术。完成后，我们通过应用迭代优化算法（如\
    \ `Gradient Descent`、`AdaGrad`、`Adam` 等）来优化这些权重。\n\n神经网络的主要优势之一是，给定输入特征和目标变量，它们能自行学习复杂的关系。这种学习得益于对数据应用非线性变换。研究一致表明，仅向网络提供更多数据（无论是新数据还是增强的原始数据）都能迅速提高模型性能。然而，除了更多数据，它们还需要强大的资源来训练和调整模型参数，这成为使用该技术的一个挑战。因此，对于可用数据集相对较小的任务，更简单的机器学习算法优于密集型神经网络。此外，随着神经元和互连数量的增加，模型参数有时变得难以解释和理解。\n\
    \n原始类别的神经网络是**浅层**的，即只有输入层和输出层，或很少有一个隐藏层。然而，较新的神经网络复杂且**深层**，包含多个不同大小的隐藏层。深度神经网络的应用在今天被称为**深度学习**。由于神经网络能准确建模非线性过程，它们已在医学诊断、人脸识别、游戏对弈等许多学科中找到应用。\n\
    \n# 深度解析：无监督学习技术及其应用\n\n基于之前的讨论，无监督学习算法在没有任何标签或结果先验知识的情况下推断数据中的模式。这些算法通过提取模式帮助理解数据的结构。在以下章节中，我们将讨论无监督学习的两种基本技术：**聚类**和**关联规则**。\n\
    \n## 聚类\n\n聚类是最流行的无监督学习技术之一，涉及自动发现数据中的自然分组。这种方法将数据点分组，使同一组（或**簇**）中的对象相似，而不在同一簇中的对象截然不同。相似性和差异性可以基于与每个数据点关联的特征使用某些度量来衡量。这种统计数据分析技术也称为**簇分析**。\n\
    \n聚类在涉及模式识别、信息检索、图像分析的多个领域以及机器学习（主要是特征工程和异常检测）中都有应用。由于簇分析有助于了解更多关于问题领域的信息，它也是一个重要的知识发现工具。\n\
    \n存在不同类型的聚类算法，它们主要根据发现这些相似数据点密集区域（即**簇**）的方式来定义。簇的识别是主观的，可能需要领域经验。通常，聚类是一个迭代过程，我们反复进行评估以更新算法配置，直到获得适当的结果。\n\
    \n让我们快速了解一些可用的标准聚类算法。\n\n### K-Means 聚类\n\n`k-Means Clustering` 是一种基于质心的聚类算法，旨在将数据点精确划分为\
    \ `k` 个簇。这 `k` 个簇的定义使得每个数据点属于具有最近质心（或簇的中心，即簇的均值）的簇。`k-Means Clustering` 倾向于根据特定距离度量最小化簇内方差。类似于我们在\
    \ `k-Nearest Neighbours` 技术中讨论的，连续变量的距离度量可以是欧几里得、曼哈顿或闵可夫斯基，而对于分类变量，汉明距离效果最好。\n\
    \n在 `k-Means Clustering` 中，我们首先随机选择 `k` 个不同的数据点作为质心。假设数据集有 `n` 个点，我们根据剩余 `n-k`\
    \ 个数据点与质心之间的距离决定它们的归属，并将它们分配给最近的一个。一旦分配了归属，我们通过计算相关点的均值来计算新的质心，并重复簇分配过程。此过程重复直到质心稳定，分配不再发生太大变化。\n\
    \n`k-Means Clustering` 只是一个 NP-hard 问题的启发式算法，不保证全局最优解。此外，由于该算法从随机选择质心开始，不同的运行可能产生不同的结果，从而破坏算法的鲁棒性。无论如何，`k-Means\
    \ Clustering` 的准确性和速度取决于数据表示、距离度量和 `k` 的值。通过实验选择最优 `k` 值最好。\n\n`k-Means Clustering`\
    \ 算法易于理解和实现。通常执行速度非常快，应用于计算机视觉、词汇学习、图像分割和天文学。该技术的衍生版是 `k-Medians Clustering`，它使用簇的中位数作为质心而不是均值。由于中位数统计指标，该技术对异常值更鲁棒，但对于大规模数据集执行较慢，因为寻找中位数需要排序。\n\
    \n### 高斯混合模型 (GMMs)\n\n虽然 `k-Means Clustering` 是对一组数据点进行分组的最简单方法之一，但它使用基于均值的朴素方法分配簇的质心。如果两个簇的均值非常接近，`k-Means\
    \ Clustering` 就难以处理，并在两者之间不断震荡，从未达到稳定。当簇的形状不是圆形时，`k-Means Clustering` 方法也会失效。因此，为了克服\
    \ `k-Means Clustering` 方法的缺点，基于**期望最大化 (EM)** 技术的**高斯混合模型 (GMMs)** 聚类方法被开发出来。\n\
    \n`GMMs` 聚类提供比 `k-Means Clustering` 更高的灵活性。它假设底层数据是由高斯分布的混合生成的，每个分布对应一个特定的簇。这一假设用均值和标准差来表征每个簇。因此，如果我们在简单的二维坐标空间中考虑这一点，簇可以是椭圆形的，而不仅仅是圆形的。除了均值和标准差，每个簇还有一个权重参数，决定相应的高斯分布如何与其他分布混合。\n\
    \n上述假设也意味着 `GMMs` 使用**软聚类**方法将点分配给不同的簇。这一特性导致每个数据点的混合归属，即一个数据点可以以不同的概率属于不同的簇。最初，这种归属程度是未知的（或**潜在**的），是计算模型参数时需要学习的另一个要素。\n\
    \n我们使用一种称为**期望最大化 (EM)** 的技术计算各个簇的参数。广义上，`EM` 算法包含以下步骤：\n1. **初始化模型参数**：即每个簇的均值、标准差和权重，随机初始化，因为我们对分布了解有限或一无所知。\n\
    2. **E-Step**：对于每个数据点，使用当前模型参数，估计其对每个簇的归属程度。\n3. **M-Step**：基于上述 `E-Step` 中估计的新簇分配，更新模型参数。\n\
    4. **重复上述 `E-Step` 和 `M-Step`**，直到达到收敛。\n\n总结来说，我们在每个 `E-Step` 中不断改进每个数据点对每个簇的归属程度，并在\
    \ `M-Step` 中利用此估计计算 `GMM` 的参数，以最大化观测数据的似然性。\n\n出于计算原因，如果特征空间的维度高，`GMMs` 通常无法工作。它们还要求对算法停止前必须尝试的混合模型数量有初步了解。无论如何，`GMMs`\
    \ 作为一种强大的聚类技术出现，比传统聚类方法更有效。作为高效的数据分析工具，`GMMs` 已广泛应用于信号和信息处理。\n\n### 层次聚类\n\n层次聚类是一种寻求构建簇的类金字塔结构的技术，适用于分类学等层次数据。层次聚类的策略通常分为以下两类：\n\
    \n**分裂层次聚类**\n这是一种自顶向下的方法，从一个包含所有数据点的巨大簇开始。然后我们不断将簇分裂成两个簇（通常基于贪心启发式），直到每个数据点成为自己的簇。\n\
    \n**凝聚层次聚类**\n这是一种自底向上的方法，每个数据点开始作为一个单独的簇。然后我们根据所选距离度量，成对合并最近的簇，随着层级向上移动。当我们达到一个包含所有数据点的巨大簇时，此过程停止。\n\
    \n层次聚类的结果是**树状图**，树的不同层级代表簇。例如，在凝聚层次聚类中，有一个包含所有数据点的根节点，底部的叶子节点是作为簇的数据点。\n\n层次聚类不要求我们指定所需的簇的数量；相反，我们可以在感觉达到所需簇数量时随时停止簇的聚合（或分裂）。这种方法对我们可能选择的距离度量不敏感，这与其他聚类算法不同。然而，这些算法计算密集且存储需求大。尽管有缺点，层次聚类是一种有效的分割方式，用于追踪病毒爆发和绘制进化图等有趣案例。\n\
    \n![](Image00049.jpg)\n\n**两种层次聚类方法的树状图示例**\n\n## 关联规则\n\n另一种无监督寻找模式的有趣方法涉及在大量未标记数据集中发现不同属性之间隐藏的关系。这种基于规则的技术旨在根据其有趣性和显著性的明确定义度量，识别数据集中的稳健关系。例如，通过分析客户在\
    \ `ModCloth` 上的购物行为，我们可以确定一组特定产品，客户极有可能一起购买。值得理解的是，这种关联揭示了**共现**的概率，并不意味着因果关系。交易顺序或单笔交易内产品购买顺序在确定规则时不起作用，这使得该技术与**序列挖掘**有显著不同。\n\
    \n这种关联信息可用于通过战略性摆放差异化产品来挖掘客户价值。它还有助于其他营销活动，如定价和促销。除了上述**市场篮子分析**示例外，关联规则学习还用于安全系统中的恶意入侵检测、制造业中的连续流检测以及生物信息学中的医学诊断。\n\
    \n### 关联规则表示\n\n数据集中各属性之间的关系（如上所述）表示为关联规则。关联规则定义为形式为 `X => Y` 的蕴含表达式，其中 `X` 和\
    \ `Y` 是不相交的集合。左侧的集合称为**前件**。右侧的集合称为**后件**或**结果**。\n\n市场篮子分析中关联规则的一个简单示例可能是 `{beanie,\
    \ boots, gloves} => {sweater}`，表明如果客户的购物车有 `beanie`、`boots` 和 `gloves`，他们也倾向于购买\
    \ `sweater`。这个小例子只是我们可以从 `ModCloth` 广泛的交易记录中发现的许多更复杂的关联规则之一。\n\n为了提出强有力的规则，我们需要使用以下度量从可能性中选择顶级规则：\n\
    \n1. **Support**\n"
  trans: "\n\n# 算法概述\n\n## 逻辑回归\n\n该算法名称中包含“回归”一词，因为输出值是通过输入变量（即特征）的线性函数得出的，这与线性回归类似（本节后文将详述）。不同之处在于，我们进一步将这个特征的线性函数通过一个\
    \ Logit 函数，将其值压缩在 0 到 1 的范围内，表示某个类别发生的概率。算法通过最大化观测到的类别出现的似然性来学习权重或回归方程的系数。\n\n\
    ![](img/Image00043.jpg)\n\n**Sigmoid 激活函数**\n\n该技术最显著的优势之一是其易于实现、训练效率高，且模型性能不错。除了实际标签的概率外，我们还能获得用于其他目的的条件概率。然而，作为一种线性模型，当分类边界是非线性时，它的效果不佳。逻辑回归算法也不适用于不平衡类别和包含异常值的数据。因此，在应用该算法之前，有必要充分探索和平衡数据。\n\
    \n## 决策树\n\n决策树使用流程图般的结构，帮助有效地可视化决策点及其结果。树中的每个节点代表基于某些阈值对特定特征做出的决策，将数据分割成两个或多个同质集合。生成这棵树涉及决定选择哪些特征以及使用什么条件进行分割。此过程重复进行，直到达到预期的停止准则。然后，树的叶子节点可用于进行准确分类。完成后，从根节点到任意叶子节点的整条路径代表不同的分类规则。\n\
    \n决策树的目标是学习在哪些特征上分割并决定相应的阈值。之后，当观察到一条未见过的数据记录（来自测试数据集）时，它会通过树的不同决策点。最终的类别归属取决于未见数据记录所到达的叶子节点相关联的数据点的多数投票。\n\
    \n决策树有用的简单示例：\n- 给定宠物的图片，我们需要将其分类为猫或狗。\n- 基于关于一个人特征的问卷，我们需要将其分类为玩家或非玩家。\n\n![](img/Image00044.jpg)\n\
    \n**尺寸推荐问题中一个简单的决策树示例**\n\n决策树因其强大的可视化特性而直观且易于解释。它们在没有太多高端计算需求的情况下产生不错的分类性能。它们也能有效处理非线性分类边界。决策树已被证明能妥善处理类别不平衡和异常值。\n\
    \n然而，如果在没有适当监督和仔细剪枝的情况下生长，它们倾向于过拟合。此外，这种方法仅产生类别预测，而不产生常用于排序目的的概率分数。尽管如此，决策树分类器用于分类的归纳方法使其成为机器学习和运筹学中战略决策分析的流行工具。\n\
    \n## K-近邻算法 (KNN)\n\n`k-Nearest Neighbour` 是一种简单且易于实现的监督分类技术。正如谚语“物以类聚”所述，`kNN`\
    \ 基于邻近性原理工作，假设彼此更近的数据点是相似的。这种分类技术在推理时找到训练数据中最接近未见数据点的 `k` 个数据点，并将其分配给这 `k` 个数据点中大多数共享的类别。\n\
    \n为了定义“接近程度”，我们可以选择任何量化两个数据点邻近度的距离度量。\n- 对于分类变量，可以使用 `Hamming Distance`（汉明距离），它计算两个维度相等的变量在对应位置上不同的位置数量。\n\
    - 对于连续变量，以下是一些标准距离度量：\n  - **欧几里得距离**：计算欧几里得空间中两点之间直线长度的度量。数学上，它是坐标差的平方和的平方根。\n\
    \  \n  ![](img/Image00045.jpg)\n  \n  - **曼哈顿距离**：沿直角轴测量的两点之间的距离。数学上，它是坐标差绝对值的和。\n\
    \  \n  ![](img/Image00046.jpg)\n  \n  - **闵可夫斯基距离**：可视为向量范数空间中欧几里得距离和曼哈顿距离的推广。`z\
    \ = 1` 的情况等同于曼哈顿距离，`z = 2` 的情况等同于欧几里得距离。\n  \n  ![](img/Image00047.jpg)\n\n`k-Nearest\
    \ Neighbor` 是一种非参数方法。它不对训练数据的潜在数据分布做任何假设，即不管其分类边界是线性、二次等。`kNN` 的性能取决于上述的数据表示和距离度量。`k`\
    \ 的值也起着至关重要的作用。通过实验选择最优值最好，这个过程称为**参数调优**。\n\n为每个数据点计算许多邻居在计算上很昂贵，而邻居太少会使模型非常嘈杂。理想情况下，我们通过交叉验证使用独立于训练集和测试集的数据集来选择\
    \ `k` 的值。\n\n`kNN` 的一个优点是其对标签噪声的鲁棒性，因为 `k` 个最近邻影响其决策，从而平均掉噪声（如果有）。`kNN` 没有显式的训练阶段，而是通过迭代测试数据点来计算邻居；因此它被恰当地称为**懒惰算法**。但这一特性导致预测时间较长。\n\
    \n`kNN` 的另一个缺点是无法在不平衡数据上表现良好。在这种情况下，它只会计算靠近多数类的邻居，将少数类作为异常值排除在外。`kNN` 还受维度灾难影响，这是我们之前讨论过的概念。随着数据点维度的增加，`kNN`\
    \ 需要更多数据才能获得不错的性能。\n\n考虑到这种易于理解的方法的所有优缺点，`kNN` 广泛用于经济预测、数据压缩和遗传学研究。\n\n# 回归\n\n\
    回归是一种监督学习方法，我们根据输入特征预测真实的输出值。回归技术学习一个函数来建模目标值（连续的）与训练数据特征之间的关系。然后利用这些知识预测未见数据点的输出值。\n\
    \n回归算法有用的一个简单示例是预测出租车车费，价格取决于起点、终点、时长、时间、交通、城市、车型、乘客数量等输入。\n\n让我们讨论一些流行的回归算法。\n\
    \n## 线性回归\n\n线性回归是最简单的回归技术之一。我们通过在训练数据集上拟合一个线性函数，来建模标量输出（或目标变量，用 `y` 表示）和输入预测变量（称为特征，用\
    \ `X` 表示）之间的关系：`y = f(X) = b + mX`。\n\n项 `b` 包含自由度，称为**偏置项**或**截距**。它允许直线在坐标空间中上下移动。线性回归也称为**普通最小二乘回归**，因为模型参数\
    \ `b` 和 `m` 的学习方式。我们最小化每个数据点到最佳拟合所有训练数据点的直线的垂直偏差平方和。\n\n此外，学习到的模型参数 `m` 还可以解释目标变量与特征之间关系的强度。这个过程称为**回归分析**，我们也将其作为计算**特征重要性**的方法之一进行了讨论。也就是说，模型参数值较高的特征比数值较低的特征具有更强的预测能力。我们可以安全地移除系数为零的特征，因为它不会影响模型的预测。这个概念常用于不同的**正则化方法**中，这些方法对系数的大值施加压力以减少模型的复杂性。\n\
    \n两种最常见的正则化方法是：\n1. **Lasso 正则化**：此方法不仅关注最小化均方误差，还关注最小化系数绝对值之和。也称为 `L1 Regularization`。\n\
    2. **Ridge 正则化**：除了最小化均方误差外，还最小化系数平方和。也称为 `L2 Regularization`。\n\n线性回归是一个强大的统计模型，在商业中广泛采用，因为它有助于发现客户行为趋势、销售预测、风险分析等。根据用例，我们可能有不同数量的特征或回归方程要求，这引出了以下类型的线性回归：\n\
    \n1. **简单线性回归**：仅包含一个特征的方法。使用线性方程的传统斜截式。数学上表示为：`y = mx + b`。\n2. **多元线性回归**：当我们有多个特征时（通常是这种情况），使用此方法。在这种情况下，我们将有对应特征的多个模型参数或系数。表示为：`y\
    \ = b + m1*x1 + m2*x2 + … + mn*xn`。\n3. **多项式线性回归**：一种稍复杂的回归，用于有多个特征的情况。目标与输入变量之间的关系建模为\
    \ `q` 次多项式，其中 `q` 可以是任意数字。例如：`y = b + m1*x1² + m2*x2⁴ + … + mn*xn^q`。它之所以仍是线性回归，是因为不同特征的值（尽管以多项式形式）是线性组合的。\n\
    \n各种线性回归方法流行的主要原因是易于理解和实现。空间复杂度低，因为训练阶段结束时仅保存系数（也称为**权重**）是我们唯一使用内存的地方。借助上述讨论的正则化技术，线性回归可以很好地执行特征选择任务。这种能力导致维度降低，从而有助于避免过拟合。\n\
    \n选择该算法时，我们应注意线性回归的某些局限性。线性回归假设我们处理的数据遵循**高斯分布**（或**正态分布**），这可能并不总是准确。它还假设特征与目标之间的关系是线性的。此外，由于线性回归试图将数据拟合到一条直线，它容易受噪声影响，且不适用于包含异常值的数据。我们可以通过执行必要的数据转换来缓解其中一些限制，正如上一章所讨论的。\n\
    \n## 神经网络\n\n神经网络松散地模仿人脑的工作原理。这些受生物学启发的机器学习模型旨在通过解释感官数据来识别模式，就像人脑一样。神经网络由数千个简单的相互连接的处理单元组成，称为**神经元**。通常，这些神经元排列在不同的**层**中，每一层将数据前馈到其他层。此外，每一层对数据应用非线性变换，这使得神经网络能够建模特征与目标变量之间的非线性关系。这些变换使用**激活函数**应用，将神经元的输出归一化到一个范围，通常在\
    \ `(-1, 1)` 或 `(0,1)` 之间。激活函数的示例包括 `Sinusoid`、`Gaussian`、`Rectified Linear Unit\
    \ (ReLU)`、`Exponential Linear Unit (ELU)` 等。一旦到达神经网络的最后一层，变换后的数据负责给出我们预测问题的输出。\n\
    \n![](img/Image00048.jpg)\n\n**典型深度神经网络 (DNN) 架构**\n\n神经网络的学习方面来自称为**权重**的参数，表示不同神经元之间连接的强度。我们随机初始化这些权重，因为一开始知识有限或没有知识。在训练阶段，我们对训练数据中的每个输入进行一次神经网络的完整前向传递。在此传递中，我们将输入数据与相应的权重融合（通常通过乘法），并通过非线性激活函数。此输出进一步传入神经网络，直到到达负责预测的最后一层。\n\
    \n如果预测结果不准确，则基于一种称为**反向传播**的技术调整每个神经元的权重。**反向传播**是一种允许我们将神经网络输出的不准确性有效归因于每个神经元的技术。完成后，我们通过应用迭代优化算法（如\
    \ `Gradient Descent`、`AdaGrad`、`Adam` 等）来优化这些权重。\n\n神经网络的主要优势之一是，给定输入特征和目标变量，它们能自行学习复杂的关系。这种学习得益于对数据应用非线性变换。研究一致表明，仅向网络提供更多数据（无论是新数据还是增强的原始数据）都能迅速提高模型性能。然而，除了更多数据，它们还需要强大的资源来训练和调整模型参数，这成为使用该技术的一个挑战。因此，对于可用数据集相对较小的任务，更简单的机器学习算法优于密集型神经网络。此外，随着神经元和互连数量的增加，模型参数有时变得难以解释和理解。\n\
    \n原始类别的神经网络是**浅层**的，即只有输入层和输出层，或很少有一个隐藏层。然而，较新的神经网络复杂且**深层**，包含多个不同大小的隐藏层。深度神经网络的应用在今天被称为**深度学习**。由于神经网络能准确建模非线性过程，它们已在医学诊断、人脸识别、游戏对弈等许多学科中找到应用。\n\
    \n# 深度解析：无监督学习技术及其应用\n\n基于之前的讨论，无监督学习算法在没有任何标签或结果先验知识的情况下推断数据中的模式。这些算法通过提取模式帮助理解数据的结构。在以下章节中，我们将讨论无监督学习的两种基本技术：**聚类**和**关联规则**。\n\
    \n## 聚类\n\n聚类是最流行的无监督学习技术之一，涉及自动发现数据中的自然分组。这种方法将数据点分组，使同一组（或**簇**）中的对象相似，而不在同一簇中的对象截然不同。相似性和差异性可以基于与每个数据点关联的特征使用某些度量来衡量。这种统计数据分析技术也称为**簇分析**。\n\
    \n聚类在涉及模式识别、信息检索、图像分析的多个领域以及机器学习（主要是特征工程和异常检测）中都有应用。由于簇分析有助于了解更多关于问题领域的信息，它也是一个重要的知识发现工具。\n\
    \n存在不同类型的聚类算法，它们主要根据发现这些相似数据点密集区域（即**簇**）的方式来定义。簇的识别是主观的，可能需要领域经验。通常，聚类是一个迭代过程，我们反复进行评估以更新算法配置，直到获得适当的结果。\n\
    \n让我们快速了解一些可用的标准聚类算法。\n\n### K-Means 聚类\n\n`k-Means Clustering` 是一种基于质心的聚类算法，旨在将数据点精确划分为\
    \ `k` 个簇。这 `k` 个簇的定义使得每个数据点属于具有最近质心（或簇的中心，即簇的均值）的簇。`k-Means Clustering` 倾向于根据特定距离度量最小化簇内方差。类似于我们在\
    \ `k-Nearest Neighbours` 技术中讨论的，连续变量的距离度量可以是欧几里得、曼哈顿或闵可夫斯基，而对于分类变量，汉明距离效果最好。\n\
    \n在 `k-Means Clustering` 中，我们首先随机选择 `k` 个不同的数据点作为质心。假设数据集有 `n` 个点，我们根据剩余 `n-k`\
    \ 个数据点与质心之间的距离决定它们的归属，并将它们分配给最近的一个。一旦分配了归属，我们通过计算相关点的均值来计算新的质心，并重复簇分配过程。此过程重复直到质心稳定，分配不再发生太大变化。\n\
    \n`k-Means Clustering` 只是一个 NP-hard 问题的启发式算法，不保证全局最优解。此外，由于该算法从随机选择质心开始，不同的运行可能产生不同的结果，从而破坏算法的鲁棒性。无论如何，`k-Means\
    \ Clustering` 的准确性和速度取决于数据表示、距离度量和 `k` 的值。通过实验选择最优 `k` 值最好。\n\n`k-Means Clustering`\
    \ 算法易于理解和实现。通常执行速度非常快，应用于计算机视觉、词汇学习、图像分割和天文学。该技术的衍生版是 `k-Medians Clustering`，它使用簇的中位数作为质心而不是均值。由于中位数统计指标，该技术对异常值更鲁棒，但对于大规模数据集执行较慢，因为寻找中位数需要排序。\n\
    \n### 高斯混合模型 (GMMs)\n\n虽然 `k-Means Clustering` 是对一组数据点进行分组的最简单方法之一，但它使用基于均值的朴素方法分配簇的质心。如果两个簇的均值非常接近，`k-Means\
    \ Clustering` 就难以处理，并在两者之间不断震荡，从未达到稳定。当簇的形状不是圆形时，`k-Means Clustering` 方法也会失效。因此，为了克服\
    \ `k-Means Clustering` 方法的缺点，基于**期望最大化 (EM)** 技术的**高斯混合模型 (GMMs)** 聚类方法被开发出来。\n\
    \n`GMMs` 聚类提供比 `k-Means Clustering` 更高的灵活性。它假设底层数据是由高斯分布的混合生成的，每个分布对应一个特定的簇。这一假设用均值和标准差来表征每个簇。因此，如果我们在简单的二维坐标空间中考虑这一点，簇可以是椭圆形的，而不仅仅是圆形的。除了均值和标准差，每个簇还有一个权重参数，决定相应的高斯分布如何与其他分布混合。\n\
    \n上述假设也意味着 `GMMs` 使用**软聚类**方法将点分配给不同的簇。这一特性导致每个数据点的混合归属，即一个数据点可以以不同的概率属于不同的簇。最初，这种归属程度是未知的（或**潜在**的），是计算模型参数时需要学习的另一个要素。\n\
    \n我们使用一种称为**期望最大化 (EM)** 的技术计算各个簇的参数。广义上，`EM` 算法包含以下步骤：\n1. **初始化模型参数**：即每个簇的均值、标准差和权重，随机初始化，因为我们对分布了解有限或一无所知。\n\
    2. **E-Step**：对于每个数据点，使用当前模型参数，估计其对每个簇的归属程度。\n3. **M-Step**：基于上述 `E-Step` 中估计的新簇分配，更新模型参数。\n\
    4. **重复上述 `E-Step` 和 `M-Step`**，直到达到收敛。\n\n总结来说，我们在每个 `E-Step` 中不断改进每个数据点对每个簇的归属程度，并在\
    \ `M-Step` 中利用此估计计算 `GMM` 的参数，以最大化观测数据的似然性。\n\n出于计算原因，如果特征空间的维度高，`GMMs` 通常无法工作。它们还要求对算法停止前必须尝试的混合模型数量有初步了解。无论如何，`GMMs`\
    \ 作为一种强大的聚类技术出现，比传统聚类方法更有效。作为高效的数据分析工具，`GMMs` 已广泛应用于信号和信息处理。\n\n### 层次聚类\n\n层次聚类是一种寻求构建簇的类金字塔结构的技术，适用于分类学等层次数据。层次聚类的策略通常分为以下两类：\n\
    \n**分裂层次聚类**\n这是一种自顶向下的方法，从一个包含所有数据点的巨大簇开始。然后我们不断将簇分裂成两个簇（通常基于贪心启发式），直到每个数据点成为自己的簇。\n\
    \n**凝聚层次聚类**\n这是一种自底向上的方法，每个数据点开始作为一个单独的簇。然后我们根据所选距离度量，成对合并最近的簇，随着层级向上移动。当我们达到一个包含所有数据点的巨大簇时，此过程停止。\n\
    \n层次聚类的结果是**树状图**，树的不同层级代表簇。例如，在凝聚层次聚类中，有一个包含所有数据点的根节点，底部的叶子节点是作为簇的数据点。\n\n层次聚类不要求我们指定所需的簇的数量；相反，我们可以在感觉达到所需簇数量时随时停止簇的聚合（或分裂）。这种方法对我们可能选择的距离度量不敏感，这与其他聚类算法不同。然而，这些算法计算密集且存储需求大。尽管有缺点，层次聚类是一种有效的分割方式，用于追踪病毒爆发和绘制进化图等有趣案例。\n\
    \n![](img/Image00049.jpg)\n\n**两种层次聚类方法的树状图示例**\n\n## 关联规则\n\n另一种无监督寻找模式的有趣方法涉及在大量未标记数据集中发现不同属性之间隐藏的关系。这种基于规则的技术旨在根据其有趣性和显著性的明确定义度量，识别数据集中的稳健关系。例如，通过分析客户在\
    \ `ModCloth` 上的购物行为，我们可以确定一组特定产品，客户极有可能一起购买。值得理解的是，这种关联揭示了**共现**的概率，并不意味着因果关系。交易顺序或单笔交易内产品购买顺序在确定规则时不起作用，这使得该技术与**序列挖掘**有显著不同。\n\
    \n这种关联信息可用于通过战略性摆放差异化产品来挖掘客户价值。它还有助于其他营销活动，如定价和促销。除了上述**市场篮子分析**示例外，关联规则学习还用于安全系统中的恶意入侵检测、制造业中的连续流检测以及生物信息学中的医学诊断。\n\
    \n### 关联规则表示\n\n数据集中各属性之间的关系（如上所述）表示为关联规则。关联规则定义为形式为 `X => Y` 的蕴含表达式，其中 `X` 和\
    \ `Y` 是不相交的集合。左侧的集合称为**前件**。右侧的集合称为**后件**或**结果**。\n\n市场篮子分析中关联规则的一个简单示例可能是 `{beanie,\
    \ boots, gloves} => {sweater}`，表明如果客户的购物车有 `beanie`、`boots` 和 `gloves`，他们也倾向于购买\
    \ `sweater`。这个小例子只是我们可以从 `ModCloth` 广泛的交易记录中发现的许多更复杂的关联规则之一。\n\n为了提出强有力的规则，我们需要使用以下度量从可能性中选择顶级规则：\n\
    \n1. **Support**\n\n"
