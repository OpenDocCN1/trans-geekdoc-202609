    >>> `<a href="http://example.com/horses" class="noun" id="link3">horses</a>`


    As we can observe from this example, it makes it easy to maneuver any given HTML
    document.


    ### Selenium


    Selenium is a widely used portable framework for controlling web browsers through
    programs. We primarily use it for automating web applications for testing purposes,
    and the limits of automation are endless with Selenium. It allows us to perform
    tasks like: launch a web browser, click on specific buttons, enter information
    in forms, use a search engine, etc. Performing the day-to-day tasks using Selenium’s
    human-like actions comes in handy when collecting data from a website, especially
    when the content is not static. Some websites’ content may change with a click
    of a button or select an option from the menu. When combined with Chrome Driver,
    Selenium allows us to automate opening websites, navigating through the pages,
    mimicking button click actions, and much more.


    ### Basic Rules


    Once we have narrowed down the web source to use for dataset curation and acquired
    the knowledge of the tools we need, it is very tempting to start scraping the
    content right away. Nevertheless, Hold On! There are always rules of a game we
    need to follow to ensure fair play. Hence we must follow the directives mentioned
    below:


    1.  It is crucial to read the selected web source’s ‘Terms & Conditions’ before
    starting the scraping process. Carefully read the statements regarding the legal
    use of data published on that source. Essentially, we should not use the data
    we gather from a web source for any commercial purpose.

    2.  Since we are using an automated tool, we need to reasonably control the number
    of times our tool requests data from the web source at any given time. Aggressively
    sweeping data could be termed as spamming and may break the source itself. Usually,
    a safe practice is to do it every second, which also mimics a human action speed.


    ### Step-By-Step Process


    Let us use an actual example to go over this section since it would be hard to
    understand the process without it. We will refer to the Clothing Fit dataset’s
    scraping script as an example to explain various points.


    #### Structure Understanding of the Data Source


    The foremost thing is to navigate through the website and familiarize ourselves
    with the structure of the site. For a running example, let us consider the ModCloth
    website. Exploring the website, we see that the top bar has various product categories
    like `dresses`, `tops`, `bottoms`, `swim`, `outerwear`, `shoes`, `accessories`,
    and `home`. Clicking on any one of the categories, say `tops`, we see that the
    products are displayed in a grid format. By default, the page shows the first
    100 results, and we can see the remaining by using the scroll buttons located
    on the right side above the product listings.


    ![](Image00010.jpg)

    *A view of the tops category page on ModCloth’s website.*


    Further clicking on any of the products, we know what the page looks like in the
    screenshot. On the product page, we have the product metadata on the top and reviews
    at the bottom.


    ![](Image00011.jpg)

    *An example of the product details page on ModCloth.*


    ![](Image00012.jpg)

    *A typical product review on ModCloth.*


    On exploring other product listings, we notice that each page contains up to 10
    reviews only. If there are more than 10 reviews, the website sections them into
    different pages, which we can navigate using the `NEXT` button on the bottom right.


    ![](Image00013.jpg) ![](Image00014.jpg)

    *A snapshot of the PREVIOUS and NEXT navigation buttons on a product page.*


    One important thing to notice is that when we click the `NEXT` button, we get
    the next 10 reviews, but the URL does not change. This peculiarity brings us to
    the concept we shall be discussing in the next section about static and dynamic
    content. Nevertheless, to say simply, there is no other way to access the subsequent
    reviews apart from clicking the `NEXT` button. Similarly, a `PREVIOUS` button
    starts appearing to access preceding reviews. It is vital to keep track of these
    small yet crucial things while planning the extraction. At this point, we would
    urge one to go ahead and explore the chosen web source in depth. We should note
    key aspects until we have a reasonably good idea of the website’s structure. We
    should be doing this, keeping in mind the end goal of extracting reviews for each
    product from each of the product categories.


    #### Static & Dynamic Content Extraction


    Websites usually comprise two different categories of content: static and dynamic.
    The fixed content of a website is called the static part. It displays the same
    content for every user regardless of anything else and is usually written purely
    in HTML. On the other hand, the dynamic part is curated on the fly. In our case,
    it depends on which user has logged in and their interactions, making use of advanced
    programming scripts like `PHP`, `ASP`, `JSP`, and so on. How to render dynamic
    content is beyond this book’s scope; however, knowing it exists is essential for
    us to streamline our scraping efforts.


    Considering the above, one can imagine that extracting content from a static webpage
    is more straightforward than a dynamic webpage. With a fixed URL pointing to a
    static page that remains unaffected by any user actions, simple tools like Python
    Request Library can extract the content. For example, following we show passing
    a URL of a static page to the `requests` object will return HTML page contents
    in the form of `<Element html at 0x211954a0c28>`. We can scrape this content easily
    using `BeautifulSoup` as demonstrated in one of the previous sections:


    ```

    import requests


    from lxml import html


    html_page = requests.get(''https://en.wikipedia.org/wiki/Static_web_page'')


    print(html_page)


    >>> <Response [200]>


    html_code = tree = html.fromstring(html_page.content)


    print(html_code)


    >>> <Element html at 0x211954a0c28>

    ```


    Nonetheless, we can not use the same process for extracting dynamic content. The
    contents displayed are not tied to a URL, and they keep changing with the user
    actions. That is where `Selenium` comes in handy, as it can mimic user actions
    like a click of a button, filling of the form, etc., and also return the corresponding
    HTML page. Since most websites rely on server-side and client-side scripts these
    days, it is vital to learn how to scrape the content and automate it. In the following
    section, we will learn how to extract such dynamic content.


    #### Key Information Acquisition


    Keeping in mind the goal of extracting reviews for each product from each of the
    ModCloth product categories, we identify the critical pieces of information as
    product details and reviews. Let us go through each of these separately to understand
    better.


