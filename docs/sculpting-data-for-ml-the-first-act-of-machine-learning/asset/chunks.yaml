  fmt: "\n# Data Balancing\n\nWe can segregate the records into different groups or\
    \ classes based on their label value in a dataset. For example, each category\
    \ in the News Category dataset, like `sports`, `politics`, `entertainment`, and\
    \ `community`, can have multiple records. Similarly, in the Sarcasm Detection\
    \ dataset, we can classify the records as either `sarcastic` or `non-sarcastic`.\
    \ Typically, the volume of different classes is not the same. The learning algorithms\
    \ can handle some differences in class distribution (say 2:3); however, the problem\
    \ arises when the differences become extreme (say 1:99). We refer to datasets\
    \ with extremely skewed class distribution as an **Imbalanced Dataset**.\n\nLet\
    \ us try to understand how the learning algorithm works under class imbalance\
    \ for a binary classification scenario, where the model assigns a weight to each\
    \ class. The class with a sizable record volume in the dataset is known as the\
    \ **majority class**, whereas the other is the **minority class**. The abundance\
    \ of majority class could impact the model’s predictive capability if not handled\
    \ correctly. In extreme cases, the model learns to completely ignore the minority\
    \ class by not giving them any weight. We can detect this skewed behavior of the\
    \ classification model by an evaluation metric called the **Confusion Matrix**.\
    \ There are different ways to handle imbalanced datasets; let us walk through\
    \ them.\n\n## I. Eliminating Infrequent Data Records\n\nThis technique is only\
    \ applicable to cases where the dataset has multiple classes, and no particular\
    \ class has to be necessarily present to solve the problem at hand. For example,\
    \ the Clothing Fit dataset has only three classes: `small`, `fit`, and `large`,\
    \ and all of them are essential to address the Size Recommendation problem. Whereas\
    \ in the News Category dataset, we have many available classes like `sports`,\
    \ `politics`, `entertainment`, `fashion`, `medicine`, and `community`. We do not\
    \ have strict requirements for any particular class’s presence to address the\
    \ News Category Detection problem.\n\nA straightforward way to tackle the extreme\
    \ skewness is to remove records of very infrequent classes from the dataset. We\
    \ can also consider going the other route of dropping the records of frequent\
    \ classes to match the proportion of infrequent classes; however, it may significantly\
    \ slash down the dataset’s size. The former approach looks more reasonable here\
    \ as it maintains the data volume and would help the model classify reliably.\n\
    \nIn the News Category dataset extracted from HuffPost, we performed preliminary\
    \ **Exploratory Data Analysis (EDA)**. We found that there were a few categories\
    \ with less than 500 articles listed under them. To balance the dataset, we merely\
    \ removed them and saw an increase in the classification model’s performance.\n\
    \n```python\nimport json\nfrom collections import defaultdict\n\ncategory_count\
    \ = defaultdict(int)\n\nfor record in data:\n    category_count[record['category']]\
    \ += 1\n\nfiltered_data = []\n\nfor record in data:\n    if category_count[record['category']]\
    \ >= 500:\n        filtered_data.append(record)\n\noutput_file = open('./News_Category_Dataset.json',\
    \ 'w', encoding='utf-8')\n\nfor record in filtered_data:\n    output_file.write(json.dumps(record)\
    \ + '\\n')\n\noutput_file.close()\n```\n\n## II. Randomly Sampling Data Records\n\
    \nSampling is an extensively popular and uncomplicated approach to deal with imbalanced\
    \ datasets. This technique entails randomly sampling records from the abundant\
    \ classes in the dataset to remove the skewness, a process often called **Random\
    \ Undersampling**. As an alternate, we can also randomly sample with replacement\
    \ to increase the records for infrequent classes, also known as **Random Oversampling**.\n\
    \nIn the Sarcasm Detection dataset, we extracted sarcastic headlines from TheOnion\
    \ and real-world news headlines from HuffPost. The statistics show that non-sarcastic\
    \ news headlines (~200k) are a lot more than the sarcastic headlines (~11k). To\
    \ remove the skewness in this case, we use the undersampling technique: we randomly\
    \ sampled ~15k headlines from non-sarcastic data. It is important to note that\
    \ we do not always aim to have a 1:1 ratio for the classes; as discussed previously\
    \ slight skewness, like 2:3, can be handled effectively by learning algorithms.\n\
    \n```python\ndata = deepcopy(sarcastic_data)\n\nrandom.shuffle(non_sarcastic_data)\n\
    \nfor i in range(0, 15000):\n    hh = preprocess_headline(non_sarcastic_data[i]['headline'])\n\
    \    if len(hh.split()) > 1:\n        temp = dict()\n        temp['is_sarcastic']\
    \ = 0\n        temp['headline'] = hh\n        temp['article_link'] = non_sarcastic_data[i]['link']\n\
    ```\n"
  trans: "\n\n# 数据平衡\n\n我们可以根据数据集中记录的标签值，将其划分为不同的组或类别。例如，新闻类别数据集中的每个类别（如 `sports`、`politics`、`entertainment`\
    \ 和 `community`）都可能包含多条记录。同样，在讽刺检测数据集中，我们可以将记录分类为 `sarcastic`（讽刺）或 `non-sarcastic`（非讽刺）。通常，不同类别的数量并不相同。学习算法可以处理一定程度的类别分布差异（例如\
    \ 2:3）；然而，当差异变得极端时（例如 1:99），问题就出现了。我们将具有极度偏斜类别分布的数据集称为**不平衡数据集**。\n\n让我们尝试理解在二分类场景下，学习算法在类别不平衡条件下是如何工作的，此时模型会为每个类别分配一个权重。数据集中拥有大量记录的类别被称为**多数类**，而另一个则是**少数类**。如果处理不当，多数类的大量样本可能会影响模型的预测能力。在极端情况下，模型会通过不给少数类分配任何权重，从而学会完全忽略少数类。我们可以通过一种称为**混淆矩阵**的评估指标来检测分类模型的这种偏斜行为。处理不平衡数据集有多种方法；让我们逐一了解。\n\
    \n## I. 移除低频数据记录\n\n此技术仅适用于数据集包含多个类别，且无需特定类别必须存在即可解决手头问题的情况。例如，服装合身度数据集只有三个类别：`small`、`fit`\
    \ 和 `large`，它们对于解决尺码推荐问题都是必不可少的。而在新闻类别数据集中，我们有许多可用的类别，如 `sports`、`politics`、`entertainment`、`fashion`、`medicine`\
    \ 和 `community`。解决新闻类别检测问题并不严格要求某个特定类别必须存在。\n\n应对极端偏斜的一个直接方法是从数据集中移除极低频类别的记录。我们也可以考虑采取另一种途径，即丢弃高频类别的记录以匹配低频类别的比例；然而，这可能会大幅缩减数据集的规模。前一种方法在此处显得更合理，因为它保持了数据量，并有助于模型可靠地进行分类。\n\
    \n在从 HuffPost 提取的新闻类别数据集中，我们进行了初步的**探索性数据分析 (EDA)**。我们发现有几个类别下列出的文章少于 500 篇。为了平衡数据集，我们仅移除了它们，并观察到分类模型的性能有所提升。\n\
    \n```python\nimport json\nfrom collections import defaultdict\n\ncategory_count\
    \ = defaultdict(int)\n\nfor record in data:\n    category_count[record['category']]\
    \ += 1\n\nfiltered_data = []\n\nfor record in data:\n    if category_count[record['category']]\
    \ >= 500:\n        filtered_data.append(record)\n\noutput_file = open('./News_Category_Dataset.json',\
    \ 'w', encoding='utf-8')\n\nfor record in filtered_data:\n    output_file.write(json.dumps(record)\
    \ + '\\n')\n\noutput_file.close()\n```\n\n## II. 随机采样数据记录\n\n采样是处理不平衡数据集的一种广泛流行且简单的方法。该技术涉及从数据集中的丰富类别中随机采样记录以消除偏斜，这一过程通常称为**随机欠采样**。作为替代方案，我们也可以通过有放回地随机采样来增加低频类别的记录，这被称为**随机过采样**。\n\
    \n在讽刺检测数据集中，我们从 TheOnion 提取了讽刺标题，从 HuffPost 提取了真实新闻标题。统计数据显示，非讽刺新闻标题（约 20 万条）远多于讽刺标题（约\
    \ 1.1 万条）。为了消除这种偏斜，我们使用了欠采样技术：从非讽刺数据中随机采样了约 1.5 万条标题。重要的是要注意，我们并不总是旨在让类别达到 1:1\
    \ 的比例；如前所述，轻微的偏斜（如 2:3）可以被学习算法有效处理。\n\n```python\ndata = deepcopy(sarcastic_data)\n\
    \nrandom.shuffle(non_sarcastic_data)\n\nfor i in range(0, 15000):\n    hh = preprocess_headline(non_sarcastic_data[i]['headline'])\n\
    \    if len(hh.split()) > 1:\n        temp = dict()\n        temp['is_sarcastic']\
    \ = 0\n        temp['headline'] = hh\n        temp['article_link'] = non_sarcastic_data[i]['link']\n\
    ```\n\n"
