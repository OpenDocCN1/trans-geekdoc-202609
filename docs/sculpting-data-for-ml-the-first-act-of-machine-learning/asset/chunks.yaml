    # ACKNOWLEDGMENT


    The world witnessed unprecedented times in 2020, especially with the worldwide
    pandemic, human tragedies, and economic disruptions galore. The unfortunate series
    of events left earthlings in a perpetual state of fear, worry, stress, and uncertainty
    for an entire year, and perhaps more. Having lost all privilege of being outdoors
    and interacting with other human beings, we suddenly had ample time on our hands.
    That is when we decided to gather our thoughts, knowledge, and experiences related
    to the use of data in Machine Learning in the form of a book. Writing a book was
    indeed in both of our bucket lists, albeit never charted out. Hence, this opportunity
    of curating a book together on the topic we both are passionate about was the
    silver lining of the year for which we are eternally grateful. The values of discipline
    and hard work instilled in us by our beloved families proved worthwhile, especially
    in this journey of writing the book and sharing with the world, all on our own.
    We are so thankful for their immense love, unwavering support, and steadfast encouragement
    to follow our dreams. The contents of the book stem from our time at the University
    of California, San Diego, where we pursued our graduate studies in Computer Science
    specializing in Machine Learning and Artificial Intelligence. Notably, the skills
    demonstrated in the book are owed to the learning from the collaborative research
    with Dr. Julian McAuley, Dr. Mengting Wan, and Dr. Ndapa Nakashole as it was during
    that time the datasets mentioned were collected. A hat tip to the faculty and
    fellow graduate students with whom we had meaningful discussions and all those
    who supported us throughout our time at the graduate school. While we write this,
    we also do not want to forget each other. To us, each being the pillar of strength
    and having faith in this book. We both believe in a strong force that guides each
    one of us to our final destination. The said feat is propped up with each connection
    and relationship we establish in this world, which imparts us knowledge of a certain
    degree. With that, a heartfelt thank you to each and everyone with whom we have
    interacted, studied, worked, and grown up with. This one’s for you!


    Jigyasa Grover & Rishabh Misra


    # About The Author


    ## JIGYASA GROVER


    Jigyasa Grover is a Machine Learning Engineer, currently at Twitter, Inc. She
    has a myriad of experiences from her brief stints at Facebook, Inc., National
    Research Council of Canada, and Institute of Research & Development France involving
    Data Science, mathematical modeling, and software engineering. Having graduated
    from the University of California, San Diego, with a Master’s degree in Computer
    Science with an Artificial Intelligence specialization, she is presently plying
    her past experiences and knowledge towards Applied Machine Learning in the online
    advertisements prediction and ranking domain. Red Hat ‘Women in Open Source’ Academic
    Award Winner and Google Summer of Code alumna, Jigyasa is an ardent open-source
    contributor as well. She served as the Director of Women Who Code and Lead of
    Women Techmakers for a handful of years to help bridge the gender gap in technology.
    In her quest to build a powerful community of girls and boys alike, and believing
    in “we rise by lifting others,” she mentors aspiring developers and Machine Learning
    enthusiasts in various global programs. She also has many international conference
    keynotes, technical talks, panels, workshops, blogs, and podcasts to her name.
    Apart from her technological ventures, she enjoys exploring new places, hanging
    out with friends and family, and has been recently having fun with baking. You
    can visit her online at `jigyasa-grover.github.io` or on Twitter (`@jigyasa_grover`).


    ## RISHABH MISRA


    Rishabh Misra is a Machine Learning Engineer, currently at Twitter, Inc. He developed
    a passion for identifying and tackling novel and practical problems using Machine
    Learning during his research internships at the Indian Institute of Technology
    Madras, which he further explored during his Master’s in Computer Science from
    the University of California San Diego. He combines his past engineering experiences
    in designing large-scale systems, working at Amazon and Arcesium (a D.E. Shaw
    company), and research experiences in Applied Machine Learning to develop distributed
    Machine Learning relevance systems. His explorations have led to several research
    publications in competitive ML conferences like RecSys, ACL, and WSDM. The ML
    community has well received the datasets collected (also used in this book) as
    part of his research. Kaggle recently ranked him as one of the top 20 dataset
    contributors, and Deeplearning.ai’s “Natural Language Processing in TensorFlow”
    course on Coursera used his Sarcasm Detection dataset for teaching purposes. In
    his downtime, he enjoys watching sci-fi shows, gaming, and spending time with
    his family. He presently lives in San Francisco, California, and you can visit
    him online at `rishabhmisra.github.io` or on Twitter (`@rishabh_misra_`).


    # Feedback is a Gift


    ## LEAVE A REVIEW


    A lot of thoughtful efforts were put in the composition of the book. We would
    appreciate your take on it. Please share your thoughts with us and the potential
    readers, especially on the platform you used to access this book. In case of any
    other questions regarding the content of the book, feel free to reach us at `@dataforml`
    on Twitter or Instagram.

