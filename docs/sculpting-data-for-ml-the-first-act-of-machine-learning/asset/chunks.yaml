    \ data signals. Therefore, we need to either remove these transactions from our\
    \ data or find a way to produce the essential data signals with the information\
    \ we have. In technical terms, this process of excluding specific values due to\
    \ their irrelevance, redundancy, or extremity from a dataset is known as **Data\
    \ Trimming**. Believing that more training data yields a better generalization\
    \ of the Machine Learning algorithm is one of the many misconceptions in this\
    \ domain. The quality of training examples matters to quite an extent. It has\
    \ been experimentally proven that a model performs better when discarding some,\
    \ especially noisy, training examples. **Data Trimming** is synonymous with **Data\
    \ Pruning**, in many other materials available on this subject.\n\nLet us review\
    \ some specific scenarios with respect to the raw data scraped from ModCloth previously:\n\
    \n1.  Many reviews do not contain fit feedback or provide any information regarding\
    \ the product sizing, as discussed above. These do not align well for the purpose\
    \ of our Size Recommendation problem.\n\n    ![A few examples of reviews missing\
