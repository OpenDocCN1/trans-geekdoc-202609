    # 致谢


    2020 年，世界见证了前所未有的时代，尤其是全球大流行、人类悲剧和经济动荡接踵而至。这一连串不幸事件让地球人在整整一年，甚至更长的时间里，都处于持续的恐惧、担忧、压力和不确定性之中。失去了户外活动和与他人面对面交流的所有特权后，我们突然拥有了大量空闲时间。就在那时，我们决定将与机器学习中数据使用相关的想法、知识和经验汇集成书。写书确实在我们俩的“愿望清单”上，只是从未付诸行动。因此，能借此机会共同策划一本我们都充满热情的主题的书，是那一年难得的慰藉，我们对此永怀感激。我们挚爱的家人灌输给我们的纪律和勤奋的价值观被证明是值得的，尤其是在我们独立完成写书并与世界分享的这段旅程中。我们衷心感谢他们给予的巨大爱意、坚定不移的支持和坚定的鼓励，让我们追逐梦想。本书的内容源于我们在加州大学圣地亚哥分校的时光，当时我们在那里攻读计算机科学研究生学位，专攻机器学习和人工智能。值得注意的是，书中展示的技能得益于与
    Julian McAuley 博士、Mengting Wan 博士和 Ndapa Nakashole 博士的合作研究，因为正是在那段时间收集了书中提到的数据集。向师长和同门研究生致敬，感谢与我们进行过有意义讨论并在研究生阶段一直支持我们的所有人。在写下这些文字时，我们也不想忘记彼此。对我们而言，彼此都是力量的支柱，并对这本书充满信心。我们都相信有一种强大的力量指引着我们每个人走向最终的归宿。这一壮举因我们在世界上建立的每一种联系和关系而得以支撑，这些关系赋予了我们一定程度的知识。为此，衷心感谢每一位与我们互动、学习、共事、共同成长的人。这本书献给你们！


    Jigyasa Grover & Rishabh Misra


    # 作者简介


    ## JIGYASA GROVER


    Jigyasa Grover 是一名机器学习工程师，现就职于 Twitter, Inc.。她拥有丰富的经验，曾短暂就职于 Facebook, Inc.、加拿大国家研究委员会和法国研究与发展学院，涉及数据科学、数学建模和软件工程等领域。她毕业于加州大学圣地亚哥分校，获得计算机科学硕士学位，专攻人工智能方向，目前正将其过往经验和知识应用于在线广告预测和排序领域的应用机器学习中。她是红帽“开源领域女性”学术奖得主和
    Google Summer of Code 校友，也是一位热衷于开源贡献的开发者。她曾担任 Women Who Code 总监和 Women Techmakers
    负责人多年，致力于缩小科技领域的性别差距。在她建立强大的女孩和男孩社区的探索中，秉持“成就他人，成就自我”的信念，她在各种全球性项目中指导有抱负的开发者和机器学习爱好者。她还发表过许多国际会议主题演讲、技术演讲、参与小组讨论、举办研讨会，并撰写过博客和播客。除了技术事业，她喜欢探索新地方、与亲朋好友聚会，最近还沉迷于烘焙。您可以访问
    `jigyasa-grover.github.io` 或在 Twitter 上关注她（`@jigyasa_grover`）。


    ## RISHABH MISRA


    Rishabh Misra 是一名机器学习工程师，现就职于 Twitter, Inc.。他在印度理工学院马德拉斯分校的研究实习期间，萌发了利用机器学习识别和解决新颖且实用问题的热情，并在加州大学圣地亚哥分校攻读计算机科学硕士期间进一步探索了这一领域。他将在
    Amazon 和 Arcesium（D.E. Shaw 旗下公司）设计大规模系统的过往工程经验，与应用机器学习的研究经验相结合，开发分布式机器学习相关性系统。他的探索促成了多篇研究论文在
    RecSys、ACL 和 WSDM 等极具竞争力的机器学习会议上发表。作为其研究的一部分收集的数据集（也用于本书）深受机器学习社区欢迎。Kaggle 最近将他评为前
    20 名数据集贡献者之一，Deeplearning.ai 在 Coursera 上的“TensorFlow 自然语言处理”课程使用了他的讽刺检测数据集进行教学。闲暇时，他喜欢看科幻剧、玩游戏和陪伴家人。他目前居住在加利福尼亚州旧金山，您可以访问
    `rishabhmisra.github.io` 或在 Twitter 上关注他（`@rishabh_misra_`）。


    # 反馈是礼物


    ## 留下评价


    本书的编写倾注了大量深思熟虑的努力。我们非常期待您的意见。请与我们和潜在读者分享您的想法，特别是在您用来获取本书的平台上。如果您对本书内容有任何其他问题，请随时通过
    Twitter 或 Instagram 上的 `@dataforml` 联系我们。


    '
