    # Support, Confidence, Lift, and Conviction


    ## Support


    Support measures the occurrence frequency of an attribute set, also called an
    itemset (in this case, `X` or `Y`), in the entire dataset. In mathematical terms,
    if itemset `X` occurs in `t` transactions out of total `T`, support can be represented
    as:


    ```

    support(X) = t / T

    ```


    ## Confidence


    Confidence measures the prospect of `X => Y` holding true, i.e., the probability
    of occurrence of `Y` given the occurrence of `X`. With respect to transactions
    `T`, the confidence value `X => Y` is the proportion of transactions containing
    `X` that also include `Y`. Mathematically, it can be expressed as:


    ```

    confidence(X => Y) = support(X ∪ Y) / support(X)

    ```


    ## Lift


    The ratio of the observed confidence of a rule (`X => Y`) to the support of its
    consequent in a dataset is referred to as the **Lift**. We can also understand
    lift as essentially the rise in the probability of `Y`’s occurrence in the cart
    given `X`’s occurrence over the likelihood of `Y`’s occurrence without any knowledge
    of `X`’s occurrence. Having a greater value of the lift implies a stronger association
    rule. Mathematically, it can be represented as:


    ```

    lift(X => Y) = confidence(X => Y) / support(Y)

    ```


    ## Conviction


    Conviction quantifies the ratio of the expected frequency of `X`’s occurrence
    without `Y` (i.e., an incorrect prediction), assuming they are independent, and
    the observed frequency of incorrect predictions. A high conviction value means
    that the consequent is highly dependent on the antecedent. Having a greater value
    of the conviction implies a stronger association rule. Mathematically, it is expressed
    as:


    ```

    conviction(X => Y) = (1 - support(Y)) / (1 - confidence(X => Y))

    ```


    Generally, the strength of an association rule is measured in terms of support
    and confidence values. However, other less popular measures like `leverage`, `collective
    strength`, and `all-confidence` can also be used to quantify interestingness and
    can be applied on a use case basis.


    # Mining Association Rules


    As discussed, we create a broad set of possibilities of association rules from
    the given data, which are then ranked to select the robust ones based on the metrics
    defined above. Generating the initial set of rules and picking the top ones is
    referred to as **mining association rules**. Association rule generation is usually
    a two-step process:


    1.  **Frequent Itemsets Discovery**

    2.  **Rule Formation**


    Usually, the step involving shortlisting of the rules is straightforward, compared
    to efficiently creating itemsets from a large dataset and selecting the frequent
    ones. Let us discuss this process in detail to understand better.


    ## Frequent Itemsets Discovery


    The first step of mining association rules involves creating all the frequently
    occurring itemsets and partitioning them to form corresponding antecedents and
    consequents, a process referred to as **Frequent Itemsets Discovery**. Considering
    there are `n` items in a dataset, we would find all `2^n - 1` combinations via
    the brute force approach since there is no limit on the size of an itemset. The
    process would also involve computing the support values of all the possible combinations.
    We would then select the itemsets with the support value above the minimum threshold
    as **frequent itemsets**.


    There are many efficient ways of searching the desired itemsets from the power
    set, exploiting the **downward closure property of support**. It ensures that
    for a frequent itemset, all its subsets are also frequent. Thus no infrequent
    itemset can be a subset of a frequent itemset. For example, this property implies
    that the frequency of purchase transactions of `{beanie, boots}` is greater than
    or equal to `{beanie, boots, gloves}`, i.e., the support value of a subset of
    an itemset obtained by removing one (or more) items is always greater than or
    equal to the original itemset. This property is also called **anti-monotonicity**
    and is utilized by various algorithms like `Apriori Algorithm` and `Equivalence
    Class Transformation (ECLAT) Algorithm`.


    ### Apriori Algorithm


    `Apriori Algorithm` is one of the most popular algorithms used for frequent itemset
    mining. It uses a **breadth-first search (BFS)** strategy to compute the `Support`
    values of itemsets. It then generates a candidate itemset exploiting the downward
    closure property of support defined above. The following are the steps involved
    in this algorithm:


    1.  Determine a threshold for the support value; we could do this via experimentation
    or eyeballing the requirements. This threshold value, or the `minimum_support`,
    would help prune the itemsets having the lower support value.

    2.  Generate all the itemsets containing only a single item where the support
    value is greater than or equal to the threshold.

    3.  Generate itemsets of size two, using combinations of the items picked in the
    previous steps. Then **prune** all the itemsets having a support value lower than
    the threshold.

    4.  Continue this process of creating itemsets of incrementally increasing sizes
    from the previous steps’ results, pruning them, and so on, till we reach the step
    that aims to build itemsets of size `n`.


    Based on the anti-monotonicity property of support, the pruning at each step reduces
    the search space by a significant fraction. As the number of possible items (`n`)
    increases, this algorithm becomes computationally more efficient. The proportion
    is also dependent on the `minimum_support` value, which is entirely reliant on
    the use case. However, the `Apriori Algorithm` has its limitations as it requires
    multiple scans of the dataset at each step, thus having a high time and space
    complexity.


    ## Rule Formation


    Once the frequent itemsets are discovered, identifying association rules is a
    comparatively more straightforward task. The rules are formed by partitioning
    the frequent itemsets in a binary fashion. For instance, if `{beanie, boots, gloves,
    sweater}` is a frequent itemset, then the possible rules could include:


    *   `{beanie, boots, gloves} => {sweater}`

    *   `{beanie, boots, sweater} => {gloves}`

    *   `{beanie, gloves, sweater} => {boots}`

    *   `{boots, gloves, sweater} => {beanie}`

    *   `{beanie, boots} => {gloves, sweater}`

    *   `{beanie, gloves} => {boots, sweater}`

    *   `{beanie, sweater} => {boots, gloves}`

    *   `{boots, gloves} => {beanie, sweater}`

    *   `{boots, sweater} => {beanie, gloves}`

    *   `{gloves, sweater} => {beanie, boots}`

    *   `{beanie} => {boots, gloves, sweater}`

    *   `{boots} => {beanie, gloves, sweater}`

    *   `{gloves} => {beanie, boots, sweater}`

    *   `{sweater} => {beanie, boots, gloves}`


    Out of all the possibilities, we need to pick the association rules which robustly
    represent a relationship. We could do this by selecting the association rules
    having a value of confidence above a determined threshold. Based on the anti-monotonicity
    property of confidence, the confidence value of rules derived from the same itemset
    with a larger antecedent size has a higher value than those with a larger consequent
    size. The reason is as the antecedent size increases, the support value decreases,
    and the confidence increases. To put it simply:


    ```

    confidence({beanie,boots,gloves}=>{sweater}) ≥ confidence({boots,gloves}=>{sweater,beanie})
    ≥ confidence({beanie}=>{sweater,boots,gloves})

    ```


    Exploiting the above property, we can limit the number of rules generated and
    pick only the desired ones following the steps below:


    1.  Determine a threshold for the confidence value; we could do this via experimentation
    or eyeballing the requirements. This threshold value, or the `minimum_confidence`,
    would be used to select the rules with a higher confidence value.

    2.  Starting with a frequent itemset, we shall form rules with a single consequent
    and remove those having a confidence value lower than the threshold.

    3.  Using the rules from the previous step, we will now form rules by incrementing
    the number of consequents by one and applying the threshold to discard the unsatisfactory
    ones.

    4.  We repeat these steps until we have tried multiple combinations of consequents,
    and the number of antecedents is one.

