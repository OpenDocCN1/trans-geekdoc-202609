    a source to get sarcastic text, and for non-sarcastic snippets, we relied on a
    real news reporting website like HuffPost . ![](Image00008.jpg)A classic example
    of a sarcastic article from TheOnion . Data Volume Requirement Another consideration
    while selecting a data source is if the source contains enough historical data
    to construct a sufficiently large dataset. Non-supportive instances could be when
    the online retailer does not have enough customer reviews reporting fit feedback,
    or the news source does not have an archive of old posts. The corresponding Machine
    Learning model might not learn suitable model parameters to capture patterns in
    such an underpowered dataset. In cases like these, it would be wise to combine
    data from multiple small sources or find a singular source to provide a large
    enough dataset . At this point, there might be a question as to what is a large
    enough dataset. The data volume requirement is usually tied to the use case or
    the problem type (we shall soon discuss the different types of Machine Learning
    problems). For regression problems, we can come up with intervals based on the
    target variable range and reckon if most intervals have at least a few data points.
    For classification problems, we can see if the ratio of the number of data points
    to the number of classes is large enough. For example, 20,000 data points might
