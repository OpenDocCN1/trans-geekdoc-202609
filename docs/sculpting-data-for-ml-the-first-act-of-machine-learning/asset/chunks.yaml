- raw: 'Chapter 2 DATASET EXTRACTION The Planning Phase Before we start this journey
    of Dataset Extraction , here is a word of caution: Be Patient . To build a dataset
    belonging to the superlative category, we would have to scout the web extensively
    for a start and then knead it accordingly, which is a cumbersome task. Worry Not!
    We have laid out a straightforward step-by-step process from our past experiences
    in academia and industry to help make the exploration systematic and efficient.
    1•   Where is the Data? Overview of the Data Sources According to David McCandless,
    a famous journalist and founder of the visual blog Information Is Beautiful ,
    “in today’s complex information jungle , data is the new soil”. McCandless celebrates
    data as a ubiquitous resource providing a fertile and creative medium from which
    new ideas and understanding can grow. In this modern world, all of us are inundated
    by information at all times. To think of data as a table filled with numbers would
    be an obsolete concept. There is data at more places than what we can even count.
    Countless things are happening every second on digital platforms: e-mails are
    sent and received, phrases searched in a variety of search engines, content posted
    on social networks, products reviewed, added to cart for online shopping, apps
    downloaded on different handheld and wearable devices, blogs posted, restaurants
    checked-in and food reviewed, stocks traded, currencies converted, and so on.
    The data streams are infinite, but the trick is not to let this information overwhelm;
    instead, hone the skills to pull out valuable insights for the social and corporate
    good. 2•  Sample Datasets In simple terms, a dataset is a collection of related
    sets of information constituting separate knowledgeable elements. This book will
    be using a handful of datasets curated by the authors to walk through the entire
    data sculpting process. Clothing Fit Dataset for Size Recommendation  [\[ 1 \]](#text00011.html#page_50)
    To improve customers’ online shopping experiences and to  reduce product return
    rates, it is vital to have a nifty clothing size recommendation framework in place.
    We used ModCloth , an online retailer of indie and vintage-inspired women’s clothing,
    to create datasets for this use case. This dataset contains fit feedback from
    customers on their purchased clothing items and other information like ratings,
    reviews, category information, customer measurements, etc. This dataset helps
    identify critical features that determine the fit of a particular clothing product
    size for a specific customer. News Category Dataset  [\[ 2 \]](#text00011.html#a1K6)
    We fabricated this dataset from HuffPost , an American news aggregator and blog.
    It contains around 200,000 news headlines from 2012 to 2018, having details like
    news category, news headlines, a short description of news stories, publication
    date, and so on. The dataset could be used for multiple purposes, for instance,
    identifying tags of untracked news articles or identifying the type of language
    used in different news categories. Sarcasm Detection Dataset  [\[ 3 \]](#text00011.html#a1JH)
    Past studies for sarcasm detection tasks have mostly used data from Twitter ,
    a microblogging and social networking service. The data from it is collected using
    hashtag based supervision. However, such datasets are noisy, especially in terms
    of label assignments and language used. To overcome these limitations, we used
    TheOnion and HuffPost to create a custom dataset for our purpose. TheOnion is
    an American satirical digital media company that publishes sarcastic articles
    on international, national, and local news, whereas HuffPost reports the corresponding
    real news. 3•  Situational Analysi s Depending on why we want to collect data,
    there are different ways to approach building good quality datasets. Considering
    the situation where we have a specific problem we want to address with the help
    of data, we have a north star, and we follow the Guided Search approach. If we
    are just curious and want some interesting data points, Unguided Search should
    be enough to fuel that wanderlust. Both these situations have their challenges,
    and in the following sections, we shall learn how to overcome them. I•  Guided
    Search As discussed above, when we have a specific problem in mind and have to
    build a dataset to address that, we go along with the Guided Search approach.
    Among the sample datasets mentioned earlier, we curated Clothing Fit and Sarcasm
    Detection to address specific problems, and hence these are good candidates to
    discuss this approach in detail. A•  Challenge The biggest challenge of the Guided
    Search of datasets is understanding the problem statement in and out. It also
    includes listing the essential data signals required by the Machine Learning models
    to address the problem completely. B•  Relevant Data Identificatio n Formal Problem
    Defintion Before we can identify the essential data signals, we must try to define
    the problem formally. Let us dry run this exercise for the Clothing Fit and Sarcasm
    Detection datasets. The idea behind the Size Recommendation problem is that we
    want to develop a Machine Learning model that can accurately predict a size that
    would fit the customer best, given product catalog sizes. So, formally we could
    define this problem as: “Given past transactions of customers where they have
    reported the size purchased and their fit feedback, develop a Machine Learning
    model that takes in a future transaction and reports whether the purchase would
    be a fit or not.” The idea behind Sarcasm Detection is that we should identify
    whether a particular text snippet is sarcastic or not. So we can formally define
    the problem as: “Given a set of sentences where we know which ones are sarcastic
    and which are not, build a Machine Learning model that can take any random sentence
    as input and output whether it is sarcastic or not.” Essential Data Signal Determination
    In layperson’s terms, we can define a data signal as a piece of information transmitted
