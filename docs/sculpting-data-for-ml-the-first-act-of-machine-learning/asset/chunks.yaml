    \nUsing the information we have gathered above, we can write the following code\
    \ to extract all the products’ links in the tops category.\n\n```python\nimport\
    \ time\nfrom bs4 import BeautifulSoup\nfrom selenium import webdriver\n\n# download\
    \ driver from chromedriver.chromium.org/downloads\npath_to_chromedriver = './chromedriver.exe'\n\
    browser = webdriver.Chrome(executable_path=path_to_chromedriver)\n\nurls = []\n\
    counter = 0\ntops_link = []\n\n# since the tops category has 7 pages, where link\
    \ to each follows a specific pattern identified above, we can create links to\
    \ them as following:\nfor i in range(7):\n    urls.append('https://www.modcloth.com/shop/tops?sz=102&start='\
    \ + str(counter))\n    counter += 102\n\n# extracting links for products in each\
    \ page\nfor url in urls:\n    # open the url\n    browser.get(url)\n    # purposeful\
    \ wait time to allow the website to get fully loaded\n    time.sleep(4)\n    #\
    \ get page content\n    content = browser.page_source\n\n    soup = BeautifulSoup(content,\
    \ \"lxml\")\n    product_links = []\n\n    # extract all the anchor i.e., <a>\
    \ elements with \"thumb-link\" class from the page\n    data_links = soup.find_all(\"\
    a\", {\"class\": \"thumb-link\"})\n\n    # from each <a> element, extract the\
    \ URL\n    for i in data_links:\n        product_links.append('https://www.modcloth.com'\
    \ + i['href'])\n\n    tops_link.extend(product_links)\n\n    # purposeful wait\
    \ time to avoid sending requests in quick succession\n    time.sleep(10)\n```\n\
    \nNote the purposeful wait times included in the script above. We do this to ensure\
    \ the website loads properly before extracting the content and wait before sending\
