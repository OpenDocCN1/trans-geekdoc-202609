    # Chapter 5 MACHINE LEARNING ALGORITHMIC APPLICATION


    So far, we have secured the ability to create datasets from multiple web sources
    and learned various techniques to process the data to construct features for fueling
    the machine learning models. To strengthen our knowledge more, we shall now study
    different paradigms of Machine Learning. This chapter focuses on identifying well-suited
    algorithms for solving challenging problems with respect to the dataset we created.
    The aim is to provide a basic understanding of algorithms in terms of their data
    requirement and not discuss nitty-gritty details that are already available from
    other sources.


    ## 1• Machine Learning Paradigm Identification


    Despite having diverse realms of Machine Learning applications, the high-level
    overview of the workflow remains the same. The standard steps include the following:


    ![](Image00042.jpg)

    *A high-level workflow of Machine Learning application.*


    Comprehensively understanding this workflow points out that the ideation and problem
    definition steps are separated from the actual Machine Learning application and
    deployment steps by the ones encompassing data sourcing and preprocessing. This
    flow indicates that applying a specific algorithm to learn the Machine Learning
    model’s parameters leans on the nature and volume of data we possess. By learning,
    we refer to a model’s capability to retain knowledge from past experiences (via
    the training data provided) and put that to use for new unseen experiences (i.e.,
    test data).


    We will begin this section by examining the three Machine Learning paradigms:
    `Supervised Learning`, `Unsupervised Learning`, and `Reinforcement Learning`.
    These three paradigms are a high-level categorization of the various techniques
    we have at our disposal today. We would also illustrate how we can map the quality
    datasets we collected to each of the paradigms to address the prediction problems.


    ### I• Supervised Learning


    `Supervised Learning` is one of the most widely applied Machine Learning paradigms.
    In the `Supervised Learning` paradigm, we have a set of input-output pairs (in
    the form of a labeled training dataset), and the task is to learn a mapping function
    to predict the output of the unseen input (i.e., the ones not present in the training
    dataset) as accurately as possible. It is aptly named, as the algorithm has the
    labeled training dataset to observe and learn the mapping function from, just
    as a supervisor.


    In simple mathematical terms, let us assume we have a labeled training dataset
    that represents the input variables by `X` and the label by `Y`. We have a function
    `f` that provides a mapping between the two, i.e., `f(X) = Y`. Our goal is to
    learn the mapping function `f`, such that on any given unseen example `X’` we
    can compute its label `Y’` with utmost accuracy.


    There are primarily two different techniques of `Supervised Learning` viz. `Classification`
    and `Regression`, and we will be discussing them later in this chapter. This type
    of learning paradigm gels well with our Guided Dataset Search philosophy, which
    we discussed previously while learning how to gather data for a defined problem.
    In that instance, we had a north-star in terms of the problem statement and the
    essential data signals. The search consisted of finding relevant input-output
    pairs where we could easily apply a `Supervised Learning` technique.


    Let us consider the Clothing Fit dataset we have been working with for the Size
    Recommendation problem. We have the input as to what sizes of products customers
    have purchased, how it fits, and other details of products and customers’ measurements.
    Our task is to learn the mapping function such that in the future, we can recommend
    the sizes of a product a user should purchase for a good fit. However, we need
    to make a mental note that the dataset we have gathered from external sources
    will not directly address the `Supervised Learning` problem. For instance, in
    the Size Recommendation problem, the ideal dataset should have information about
    what size of a product best fits the user compared to all the different sizes
    available. But in reality, the customers only try 1-2 sizes of a given product.
    They cannot review the whole catalog of sizes available. In cases like these,
    we need to alter our problem definition. The updated statement should approximate
    the original problem and gel well with the dataset gathered. Applying this principle
    to the Size Recommendation problem, we can calibrate it as a Size Fit problem
    instead. We have an input pair of user profile (i.e., `UserID` and body measurements)
    and product size purchased. The goal is to learn which size of the product would
    best fit that potential customer. Once we can reliably and accurately predict
    the fit of the catalog sizes of products on the users, we can infer the perfect
    size to recommend to the customers. In actuality, we recommend the catalog size
    having the highest probability of being the best fit for a particular user.


    ### II• Unsupervised Learning


    `Unsupervised Learning` is the type of Machine Learning paradigm that does not
    require labeled data points. Theory projects them to be intelligent enough to
    look for patterns without human supervision in the provided data with no labels.
    `Unsupervised Learning` usually tends to be a goal in itself, where finding patterns
    in the data is the objective. Since we give no hints regarding the patterns we
    are looking for, the algorithm methodizes itself. It comes up with rules to marshal
    the data and discover patterns.


    There are primarily two different techniques of `Unsupervised Learning` viz. `Clustering`
    and `Association`, and we will be discussing them later in this chapter. This
    type of learning paradigm gels well with our Unguided Dataset Search philosophy,
    which we discussed previously while learning how to gather data without any objective
    in mind. Since the intuition about what problems these datasets serve well is
    sufficient, we focus on gathering as much information as possible to help the
    algorithm detect patterns efficiently.


    Let us consider the News Category dataset. It contains details like news category,
    news headlines, a short description of news stories, publication date, author,
    etc. From a first glance, we can use this dataset to predict news categories given
    the headlines, serving a simple example for `Supervised Learning`. This dataset’s
    more exciting use would be to identify news-worthy themes within each category,
    like `entertainment`, `politics`, `fashion`, etc. If we observe, we do not have
    any labels about news-worthiness or common themes across the headlines. Hence,
    discovering those patterns from the data is the `Unsupervised Learning` algorithm’s
    job.


    An elementary approach to detect common themes across headlines would be to use
    Topic Modeling on each category’s headline text. `Topic Modeling` is a popular
    learning technique, especially in natural language processing tasks. It scans
    the set of text documents provided, extracts similar word and phrase patterns
    within them, and then automatically learns to cluster word groupings and similar
    expressions that best characterize the given set of text documents. Using this
    statistical model to discover abstract themes in our data furthers our understanding
    of what makes it to the news article, thus identifying newsworthy stories in the
    future.


    #### Semi-Supervised Learning


    In contemporary times, there are cases where a small quota of labeled data is
    integrated with a large quantity of unlabeled data to increase the learning accuracy.
    This type of learning is often referred to as `Semi-Supervised Learning` since
    it falls between `Supervised Learning` and `Unsupervised Learning`.


    A simple example could be where we have a large set of articles, imagine all the
    content present on the internet, and we need to categorize them without actually
    providing the categories. We could start with a minimal quantity of labeled articles
    and let the algorithm learn to categorize the rest. This method works since manually
    categorizing all the data could be very expensive, but unlabeled data is inexpensive
    to source. The algorithm can be free to construct new categories in some cases.
    This technique of self-training comes in handy to categorize and also rank those
    articles.


    Another typical example of `Semi-Supervised Learning` is speech analysis since
    labeling every part of multiple audio files is too cumbersome. Since this learning
    paradigm is a combination of both `Supervised` and `Unsupervised Learning`, it
    has characteristics of both under the following assumptions:


    *   **Continuity Assumption**: Amongst the data points provided, the ones closer
    to each other map to a similar label.

    *   **Cluster Assumption**: We can group all the data points provided on specific
    criteria and the ones in the same group map to the same label.


    ### III• Reinforcement Learning


    `Reinforcement Learning` is the type of Machine Learning paradigm where the algorithm
    learns how to take a sequence of decisions in an uncertain environment. The objective
    is to maximize the cumulative reward gained by making a series of decisions.


    Imagine facing a game-like situation where each action either gets us a reward
    or a penalty, but we are not aware of them beforehand. The goal of the game is
    to maximize the total reward at the end. Since we do not have any hint regarding
    optimally playing the game, we would initially play via a trial-and-error approach
    and gather information about the reward policy. Then we would use that information
    to guide our following decisions, trying to maximize the rewards.


    Similarly, a `Reinforcement Learning` model learns how to perform the task, starting
    with simple random trials and tuning its parameters based on the received reward.
    As the model parameters converge, the model gets more sophisticated and can perform
    the said task more optimally. We compare this paradigm to how human intelligence
    works, and if provided enough computational resources, `Reinforcement Learning`
    can consolidate experiences from a multitude of parallel gameplays. It can leverage
    the power of search and come up with a trailblazing algorithm within a short period.


    This paradigm is different from `Supervised Learning` because it does not require
    a labeled dataset of input-output pairs. Instead, it uses function approximation
    to tie the current state with the next action. It strikes a balance between exploring
    the uncharted territories and exploiting the knowledge gained so far to develop
    a strategy that maximizes rewards in the long term.


    A simple example of this learning paradigm could be `Autonomous Driving`. Since
    we can not know of every situation that could occur on the road while driving,
    we can not provide a labeled dataset. Based on the external factors of road condition,
    traffic, or weather, our goal is to minimize ride time, maximize speed within
    the limit, and reach the destination safely without causing an accident.


    `Reinforcement Learning` might seem more intuitive than other paradigms, yet there
    are some striking caveats attached to it:


    *   **Data collection** for this paradigm is not straightforward; we have to rely
    on running simulations for that.

    *   **Designing the reward** is a challenge in itself, and it can have unseen
    consequences if done frivolously. For example, the reward of minimizing the traveling
    time for autonomous vehicles could be very dangerous without appropriate constraints
    like speed limit, direction, and so on.

    *   `Reinforcement Learning` can maximize long-term rewards efficiently; however,
    the algorithm’s immediate decision might not be intuitive.

    *   It could be challenging to measure worst-case performance since collecting
    data in a standard form for such scenarios might not be possible.


    ## 2• Deep Dive: Supervised Learning Techniques & their Applications


    As discussed previously, `Supervised Learning` techniques are designed to learn
    by example. Typically, new Machine Learning practitioners kick off their journey
    by experimenting with different varieties of `Supervised Learning` techniques.
    Let us dive deep into the two fundamental techniques of `Supervised Learning`
    viz. `Classification` and `Regression`.


    ### I• Classification


    `Classification` is a popular `Supervised Learning` approach where the machine
    learns to map data to one of the `N` defined labels from the training dataset.
    It then uses this knowledge to classify the new unseen data points (referred to
    as the test dataset) as accurately as possible. Usually, the `N` categories defined
    in the training dataset are independent of each other. The algorithm is not expected
    to categorize the test data in categories other than the `N` defined ones.


    A simple example could be classifying a tumor in the human body as `malignant`
    or `benign` using the body scan images and other features like size, color, growth
    speed, etc. This predictive modeling technique is further broadly classified as
    follows:


    1.  **Binary Classification**: These tasks require the algorithm to categorize
    a data record into one of the two classes, like `yes`/`no`, `malignant`/`benign`,
    `spam`/`not spam`, `sarcastic`/`non-sarcastic`, etc.

    2.  **Multi-Class Classification**: These tasks train and expect the algorithm
    to classify into one of the many possible classes, for example, primary colors:
    `red`/`blue`/`yellow`, fruits: `orange`/`apple`/`peach`/`guava`, and so on.


    It is noteworthy that modeling techniques designed for binary classification tasks
    can also be applied to multi-class classification problems. There are simple heuristics
    that split the multi-class classification problem into multiple binary classification
    tasks. Two such heuristics are:


    *   **One-Vs-Rest (OVR)**: `OVR` is also referred to as the One-Vs-All (`OVA`)
    approach. This heuristic picks up a class and trains a model to differentiate
    the picked class from all the remaining classes. We do this repeatedly until we
    have multiple models that learn to assign a probability score to each class. For
    example, let us consider a task to classify a color swatch into one of the colors
    `Red`/`Blue`/`Yellow`/`Green`. We will be training four binary classification
    models viz. `Model 1`: `Red` vs. (`Blue` or `Yellow` or `Green`), `Model 2`: `Blue`
    vs. (`Yellow` or `Green` or `Red`), `Model 3`: `Yellow` vs. (`Green` or `Red`
    or `Blue`), and `Model 4`: `Green` vs. (`Red` or `Blue` or `Yellow`). Undoubtedly,
    this becomes cumbersome when we have many categories, a large dataset, or when
    the model is too complex to train multiple times.

    *   **One-vs-One (OVO)**: This heuristic picks up different pairs of classes and
    trains a binary classification model for each till we learn how to assign a probability
    score for each category. Using the same example as above, except, in this case,
    we will have six different models, viz. `Model 1`: `Red` vs. `Blue`, `Model 2`:
    `Red` vs. `Yellow`, `Model 3`: `Red` vs. `Green`, `Model 4`: `Blue` vs. `Yellow`,
    `Model 5`: `Blue` vs. `Green`, `Model 6`: `Yellow` vs. `Green`.


    Now, let us discuss some popular classification techniques, specifically for binary
    classification tasks.


    #### A• Logistic Regression


    `Logistic Regression` is based on the statistical logit model used to model a
    particular event’s probability using prior experiences. It is the go-to algorithm
    for binary classification to model the relationship between the binary response
    variable (i.e., either of the two outcome classes) and the set of predictor variables,
    i.e., features from the data. During the inference time, the algorithm calculates
    the data record’s probability of being associated with each class and assigns
    it to the class with the highest probability of occurrence. If the likelihood
    of one of the two classes is `p`, where `p` lies between `0` and `1`, the likelihood
    of the other class would be `1-p`.


