    # The algorithms mature from the iterative process of experimenting and validating
    hypotheses


    Furthermore, efficient computation requires optimizing the algorithm using distributed
    processing to run on a large scale. These are absolutely the essential aspects
    to consider; however, laying the foundation of the process with the perfect quality
    and quantity of data is the secret sauce that makes Machine Learning effective.


    ![](Image00006.jpg)


    ## The AI Hierarchy of Needs


    Since we have progressed from the primeval rule-based approach to a more data-driven
    approach, it goes without saying that we train Machine Learning algorithms to
    capture implicit patterns in the data provided. The type of data fed into the
    algorithm thus has a profound effect on the algorithm’s success. Worthy data collection
    forms the foundation of the pyramid of the AI Hierarchy of Needs drawn parallel
    to Maslow’s Hierarchy of Human Needs by Monica Rogati, a renowned Data Scientist
    and AI Advisor. Rogati puts forward that data literacy, data collection, and data
    flow form the basic needs that must be satisfied to achieve self-actualization,
    which would be the attainment of AI. With the desire to climb the Data Science
    ladder and contribute to the fabrication of successful Machine Learning algorithms,
    one should also focus on dealing with data. Before we can employ a Machine Learning
    solution, it is crucial to understand the problem and the data requirements, followed
    by researching and accumulating data from the right source. In most cases, we
    cannot use the collected data as-is. It might need some massaging with appropriate
    tools and techniques. Once that is done, we can bring into play suitable learning
    algorithms to address the problem at hand. At this point, it is good to note and
    understand that no quantum of algorithmic sophistication and efficient computation
    can make up for the low quality and quantity of data. Current times are witnessing
    accelerated advancement in intelligent systems. Just about every Machine Learning
    and Data Science enthusiast, conventional developer, and corporate organization
    is attempting to hop on the bandwagon. In that act of haste, it is widespread
    to skip the modus operandi of sculpting the data before training and evaluating
    the Machine Learning model, and eventually running into a wall. Hence, to avoid
    the misspending of time, money, and efforts in the race of building the perfect
    artificially intelligent archetype, it is pivotal to follow the process systematically.


    ## 3• Honing Dataset Curation Skills


    As we discussed above, well-calibrated data is what fuels the Machine Learning
    engines. There are various sources from which one can pick an already preprocessed
    dataset that might not require further trimming, anonymizing, standardizing, normalizing,
    and so on. This data can directly be fed into a model without any changes, thus
    providing us an easy way to get up to speed with the experimentation of sundry
    Machine Learning techniques. Using a preprocessed dataset also comes in handy
    when one just wants to check the working of the end-to-end Machine Learning pipeline;
    however, it might not guarantee excellent performance. There could be cases when
    the datasets available do not precisely match our problem’s wavelength or are
    not present in enough quantity required by our use case. At times like these,
    it is convenient to synthesize our dataset and pack it up with information potentially
    valuable to the use case in the desired quantity. The contemporary world has volumes
    of all kinds of crude data available on the web. Equipped with a Machine Learning
    mallet, we can hammer all the nails in this data-oriented world with an added
    skill of identifying and extracting meaningful datasets.


    ### I• Importance in Academia


    World over, the scientific community engaged in higher education and research
    has been hustling quite a lot with Machine Learning and Data Science these days.
    Core Machine Learning and Data Science research groups in academia are oriented
    more towards novelty and advancing the field, many times weighing it higher than
    money-making logic or performance scaling. In this attempt to work on the new
    problems, finding collaborators from pertinent domains, and seeking funding for
    the research projects are not the only obstacles they face. They also have to
    look for relevant data sources in the absence of in-house data, contrary to the
    corporate giants who usually have access. One way to lay hands on the relevant
    data is to collaborate with industry researchers; however, that is not always
    feasible. In that scenario, the only way to overcome this hurdle is to collect
    a reasonable dataset by themselves. Although challenging, many renowned academic
    researchers have been finding creative ways to achieve that lately. Conquering
    this barrier allows them to be self-sufficient and gives them a chance to lead
    research in new domains. Another reason curating datasets is becoming a highly
    regarded skill within the research community is that it fosters transparency and
    encourages reproducibility of the results.


    ### II• Importance in Industry


    Globally business-oriented corporations are increasingly investing in Machine
    Learning as they realize the value technology adds to their product and business.
    In contrast to academia, the industry prioritizes profit-generating logic and
    high scale performance higher than novelty and advancement of theoretical knowledge.
    Therefore, most use cases involve utilizing learning algorithms’ performance on
    a large scale to improve the user experience or revenue generation. Established
    organizations seldom have obstacles in obtaining computation power, hiring folks
    with expertise in corresponding domains, or accessing relevant data. The challenge,
    however, comes in scaling up their solutions to their massive user base. Any organization
    would have a lot of unstructured data available on its hands as raw logs; however,
    developing an efficient data processing pipeline remains a task. For creating
    such resilient pipelines, apart from the relevant technological knowledge, we
    also require the skills to identify and curate meaningful and unbiased datasets
    from a sea of unstructured data.


    ## 4• What Will This Book Teach?


    There is a modern bloom of social networks, online shopping portals, blogs, video
    streaming platforms, and so many other knowledge and experience sharing platforms
    enabled with all kinds of media, be it textual, visual, or audio. Consequently,
    a vast magnitude of raw data is available via numerous sources nowadays. This
    book aims to provide us an in-depth guide about one of the most rudimentary aspects
    of Machine Learning - Dataset Curation. Dataset Curation often does not get its
    due limelight but has high relevance in academia and industry. We shall walk through
    the process of constructing robust datasets from scratch using `Python` [[1]](#text00010.html#a1KF)
    with tools like `BeautifulSoup` and `Selenium`. So turn the page, and start curating
    datasets suited to cater to all the needs!


    ---

