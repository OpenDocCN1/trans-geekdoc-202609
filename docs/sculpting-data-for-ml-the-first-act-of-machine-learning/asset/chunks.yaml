    ]/footer/div/aside/button'\n    )\n)\n```\n"
  trans: "\n\n# 抓取产品链接和评论\n\n对于每个页面，我们现在需要提取每个产品的链接。让我们利用网页浏览器的**检查**功能。此功能可让我们查看特定元素的幕后信息，包括源代码、图片、CSS、字体和图标、驱动动画的\
    \ JavaScript 代码等。要使用此功能，请右键单击该元素并选择**检查**选项。接下来，确定包含产品链接的锚元素，即 `<a>`，并记下其 CSS\
    \ 类。在下面的示例中，我们看到 CSS 类为 `thumb-link`。通常，所有产品链接都会使用相同的类，但最好进行验证。\n\n![使用 Google\
    \ Chrome 检查 ModCloth 上产品的链接](img/Image00015.jpg)\n\n利用我们收集到的上述信息，可以编写以下代码来提取上衣类别中所有产品的链接。\n\
    \n```python\nimport time\nfrom bs4 import BeautifulSoup\nfrom selenium import\
    \ webdriver\n\n# 从 chromedriver.chromium.org/downloads 下载驱动程序\npath_to_chromedriver\
    \ = './chromedriver.exe'\nbrowser = webdriver.Chrome(executable_path=path_to_chromedriver)\n\
    \nurls = []\ncounter = 0\ntops_link = []\n\n# 由于上衣类别有 7 页，每页链接遵循上述确定的特定模式，我们可以按如下方式创建指向它们的链接：\n\
    for i in range(7):\n    urls.append('https://www.modcloth.com/shop/tops?sz=102&start='\
    \ + str(counter))\n    counter += 102\n\n# 提取每页中产品的链接\nfor url in urls:\n    #\
    \ 打开 URL\n    browser.get(url)\n    # 故意等待一段时间，以便网站完全加载\n    time.sleep(4)\n \
    \   # 获取页面内容\n    content = browser.page_source\n\n    soup = BeautifulSoup(content,\
    \ \"lxml\")\n    product_links = []\n\n    # 从页面中提取所有 class 为 \"thumb-link\" 的锚元素即\
    \ <a> 元素\n    data_links = soup.find_all(\"a\", {\"class\": \"thumb-link\"})\n\
    \n    # 从每个 <a> 元素中提取 URL\n    for i in data_links:\n        product_links.append('https://www.modcloth.com'\
    \ + i['href'])\n\n    tops_link.extend(product_links)\n\n    # 故意等待一段时间，以避免在短时间内发送请求\n\
    \    time.sleep(10)\n```\n\n请注意脚本中包含的故意等待时间。我们这样做是为了确保在提取内容之前网站正确加载，并在发送另一个请求之前等待，以避免过载。回顾我们之前讨论的基本规则，每秒发送一个请求以模拟人类行为是不错的做法。然而，考虑到\
    \ ModCloth 是一个相对较小的网站（如果将其规模与亚马逊相比），我们可能需要更长的等待时间。在这方面可以自行判断，但我们应保持谨慎。\n\n## 产品评论的提取\n\
    \n现在我们有了上衣类别中每个产品的链接，可以深入提取每个产品的评论。让我们检查每个评论实体的 HTML 代码是什么样的。我们注意到每个评论都包含在一个 class\
    \ 为 `pr-review` 的 `<article>` 元素中。\n\n![检查客户评论](img/Image00016.jpg)\n\n让我们通过点击左侧的小箭头按钮来展开一个\
    \ `<article>` 元素内部的内容。当我们将鼠标悬停在 `<article>` 标签内的各个组件上时，网页上对应的视图会被高亮显示。\n\n![检查客户评论的结构化组件](img/Image00017.jpg)\n\
    \n如上图所示，有一个 class 为 `pr-rd-content-block pr-accordion pr-accordion-collapsed`\
    \ 的 `<section>` 元素。它对应产品合身度的反馈以及客户的尺寸数据。同样，评论的其他部分位于不同的 `<section>` 元素下。深入 `<section>`\
    \ 元素，我们注意到它们进一步嵌套在一个 class 为 `pr-accordion-content` 的 `<div>` 元素内。\n\n![检查客户评论的合身反馈组件](img/Image00018.jpg)\n\
    \n里面有一个定义列表，即 class 为 `pr-rd-def-list` 的 `<dl>` 元素，其中每个元素对应一个合身反馈信号或一项客户测量数据。`<dt>`\
    \ 元素包含字段名称的原始文本，`<dd>` 标签包含字段值。这种键值结构可能会让我们联想到 Python 中的字典数据结构。我们的最终目标是以字典格式提取这些反馈信号。\n\
    \n掌握了上述知识，我们现在从上衣类别产品的评论中提取合身反馈信号：\n\n### 使用 Selenium 设置自动化浏览器\n\n```python\n\
    from bs4 import BeautifulSoup\nfrom selenium import webdriver\n\n# 从 http://chromedriver.chromium.org/downloads\
    \ 下载驱动程序\npath_to_chromedriver = './chromedriver.exe'\nbrowser = webdriver.Chrome(executable_path=path_to_chromedriver)\n\
    ```\n\n### 对于上衣类别中的每个产品页面，提取着陆页上的评论内容\n\n```python\nscraped_data = []\n\nfor i\
    \ in range(0, len(tops_link)):\n    url = tops_link[i]\n\n    # 打开产品的着陆页\n   \
    \ browser.get(url)\n\n    # 获取网页内容\n    content = browser.page_source\n    soup\
    \ = BeautifulSoup(content, \"lxml\")\n```\n\n### 提取所有评论的原始内容\n\n```python\nreview_data\
    \ = soup.find_all(\"article\", {\"class\": \"pr-review\"})\n```\n\n### 对于每条评论，我们提取合身反馈和客户尺寸数据\n\
    \n```python\nreview_metadata_raw = []\n\nfor i in range(len(review_data)):\n \
    \   review_metadata_raw.append(review_data[i].find(\"div\", {\"class\": \"pr-accordion-content\"\
    }))\n```\n\n### 从原始评论数据中制作列表的列表\n\n```python\nreview_metadata_elements = [review_metadata_raw[i].find_all(\"\
    dl\", {\"class\", \"pr-rd-def-list\"}) for i in range(len(review_metadata_raw))]\n\
    ```\n\n### 最后，以字典格式提取详细信息\n\n```python\nreview_metadata = []\n\nfor element in\
    \ review_metadata_elements:\n    # <dt> 元素包含元数据字段名称，如 \"fit\"、\"length\" 等。\n\
    \    # <dd> 元素包含评论者对这些元数据字段的回答，如 \"small\"、\"just right\" 等。\n    review_metadata.append(\n\
    \        {\n            element[i].find(\"dt\").text.lower(),\n            element[i].find(\"\
    dd\").text.lower()\n        } for i in range(len(element))\n    )\n\nscraped_data.extend(review_metadata)\n\
    ```\n\n## 流程自动化\n\n在上一节中，我们成功编写了脚本，从网站上衣类别中每个产品的着陆页提取评论。太棒了！然而，我们距离从整个网站创建数据集的最终目标还很远。本节将帮助我们在无需太多人工协助的情况下，对每个产品类别重复相同的任务。为了实现脚本自动化，我们必须弄清楚如何通过点击“下一页”按钮或使用\
    \ Selenium 模拟该操作，自动导航到其他评论页面。\n\n![产品页面上“下一页”导航按钮的快照](img/Image00019.jpg)\n\n\
    ```python\nbrowser.execute_script(\n    \"arguments[0].click();\",\n    browser.find_element_by_xpath(<BUTTON_XPATH>)\n\
    )\n```\n\n理解上述片段可能还需要了解 XPath 到底是什么。为了方便理解，可以将 XPath 视为一种在 HTML 文档中浏览元素和属性的方式。它就像\
    \ HTML 文档中每个组件的唯一地址，在上面的示例中，该地址位于 `BUTTON_XPATH` 占位符中。要确定元素的 XPath，我们再次使用检查功能，如下所示：\n\
    \n![在 Google Chrome 上查找“下一页”按钮 XPath 的方法](img/Image00020.jpg)\n\n例如，在示例片段中填入所需“下一页”按钮的\
    \ XPath 将得到类似以下的内容：\n\n```python\nbrowser.execute_script(\n    \"arguments[0].click();\"\
    ,\n    browser.find_element_by_xpath(\n        '//*[@id=\"pr-review-display\"\
    ]/footer/div/aside/button'\n    )\n)\n```\n\n"
