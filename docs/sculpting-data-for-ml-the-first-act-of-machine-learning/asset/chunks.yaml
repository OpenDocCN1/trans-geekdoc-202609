    \ in record else ‘’)  \n\n    + (record\\[‘cup size’\\] if ‘cup size’ in record\
    \ else ‘’)  \n\n    + (record\\[‘bust’\\] if ‘bust’ in record else ‘’)  \n\n    +\
    \ (record\\[‘hips’\\] if ‘hips’ in record else ‘’)  \n\n    + (record\\[‘waist’\\\
    ] if ‘waist’ in record else ‘’)  \n\n    + (record\\[‘shoe size’\\] if ‘shoe size’\
    \ in  record else ‘’)  \n\n    + (record\\[‘shoe width’\\] if ‘shoe width’ in\
