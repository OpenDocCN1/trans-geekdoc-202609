- raw: "    data.append(temp) III•  Assigning Class Weights Weighing parameters is\
    \ a fundamental concept in Machine Learning, which depicts how much significance\
    \ a particular entity holds. Weights could be related to a specific feature, a\
    \ specific data record, or a neuron in an artificial neural network. In imbalanced\
    \ datasets, we can assign the records of infrequent classes more weight than records\
    \ from frequent  classes. This step makes the learning algorithm penalize the\
    \ misprediction on infrequent classes more, which compensates for the limited\
    \ signal they provide due to less quantity. For example, consider a dataset of\
    \ 1M loan records, where the label indicates if the loanee repaid it on time or\
    \ not. Assuming only 0.01 % of people do not pay off loans on time, we have 999k\
    \ records of timely payments (say, label = 1) as the majority class and the rest\
    \ 1k as the minority class (say, label = 0). In this case, we can use the rudimentary\
    \ method of assigning the class weights inversely proportional to their respective\
    \ frequencies, i.e., w i \\= N/(C\\*n i ) . Here, w i is the i th class’s weight,\
    \ N is the total number of records in the dataset, C is the total number of classes,\
    \ and n i is the number of records in the dataset belonging to the i th class.\
    \ Using this technique, we find that the records with timely payments are assigned\
    \ a weight of 0.5 owing to their higher frequency, whereas the other class gets\
    \ assigned a value of 500 ! This would mean that the misclassification of the\
    \ latter class would be penalized 1000 times more than the former. IV•  Picking\
    \ Correct Evaluation Metric When working with even slightly disproportionate datasets,\
    \ it is necessary to pick a relevant evaluation metric to assess the model’s performance\
    \ effectively. Accuracy may not always be the best metric. Consider the model\
    \ which predicts if an alien would land on earth in the next 24 hours . Undoubtedly\
    \ the model would forecast ‘no ’ as the answer with an accuracy rate of 99.99%,\
    \ indicating that the model is highly accurate. However, in actuality, the model\
    \ might not be usable if it cannot accurately predict records with ‘yes ’ as an\
    \ answer. In cases like these, the F1 Score might be a more relevant metric which\
    \ we could consider. In the statistical analysis of classification problems, the\
    \ F1 Score is the harmonic mean  of the model’s precision and recall values. It\
    \ ranges from 0 to 1 and denotes perfect precision and recall at the value 1.\
    \ However, the drawback is that it is defined only for a particular classification\
    \ threshold (often 0.5 is the default value for a binary classification scenario).\
    \ This threshold usually needs some tuning, specifically in cases where we have\
    \ a data imbalance issue. A better metric for such cases is the Precision-Recall\
    \ Area Under the Curve (PR-AUC) , which is the area under the precision-recall\
    \ curve produced by varying the classification thresholds. PR-AUC can also be\
    \ thought of as the average of the precision scores calculated for each recall\
    \ threshold. V•  Alter Problem Definition This approach is one of the most interesting\
    \ to deal with highly imbalanced datasets (where the minority class may occur\
    \ only 1 in 1000 records). So far, we have been viewing the problems as simple\
    \ classification where we train the model to intelligently categorize data records\
    \ into groups, be it in majority class or minority class. We observed that simple\
    \ classification learning algorithms have trouble by skewed datasets as majority\
    \ classes cloud the characteristics of minority classes and disrupt the model’s\
    \ predictive capability. Hence, it would be smart to alter the problem definition\
    \ and view it from an angle of Anomaly Detection . Anomaly Detection is the type\
    \ of problem where the task is to identify unusual points in the dataset, i.e.,\
    \ occurrences that are different (here they could be minority class) from the\
    \ regular (majority class in our case) ones. This technique is often called Outlier\
    \ Detection . Modifying our problem interpretation, in this case, helps us use\
    \ the imbalanced datasets without amending their composition. 7•   Data Exporting\
    \ After we have done all the tedious tasks of scrubbing, trimming, and balancing\
    \ the data, the final task is to export and release it to the public. It is crucial\
    \ to choose an appropriate structure and a suitable format to export the datasets.\
    \ A dataset is more likely to be accessed, used, and shared by more people if\
    \ it has an uncomplicated structure and is in an easy-to-use format to import\
    \ in different learning frameworks. The manageability of the dataset is another\
    \ essential characteristic. It assists in the trouble-free existence of the data\
    \ in the system for extended periods and fuels innovation. We can consider different\
    \ structures to express a dataset appropriately, the key ones being the following:\
    \ • Tabular : This is the most common structure where we organize data into rows\
    \ of data records and columns listing records’ attributes. It is best suited for\
    \ independent records of data and can be effectively exported in CSV formats.\
    \ • Hierarchical : These data structures support sets where data records are linked\
    \ to other data records in a vertical tree composition. That is, the attributes\
    \ themselves might be key-value pairs. Hierarchical data structures are functionally\
    \ exported in JSON formats. • Network : In this data structure, multiple associations\
    \ exist between the different data records, just like a spider web or a social\
    \ network. We can also quickly discuss different formats we can use to export\
    \ a dataset into: • Comma-Separated Values (CSV) : As discussed previously, this\
    \ format is highly effective for tabular datasets, to put simply, rows and columns.\
    \ A new line separates each data record, and a comma (, ) separates the attributes\
    \ in a single  data record. The first row should always be the header row, which\
    \ indicates the names of the attributes that follow. It looks something like the\
    \ following: username,pin,first\\_name,last\\_name  \n\nheylaura,1234,Laura,Wu\
    \  \n\niampc,999,Paige,Carter  \n\n... ... ... CSV files are saved with a .csv\
    \ extension. CSV files have a handful of advantages as they are easy to skim by\
    \ the human eye and simple to implement and parse. They are trouble-free to import\
    \ and manipulate the data. The data is faster to handle and offers a compact version.\
    \ However, it supports only basic types and creates a parsing ruckus if the attributes’\
    \ values contain commas themselves. It does not support special characters and\
    \ has no universal standard. • Tab-Separated Values (TSV): This format is pretty\
    \ similar to CSV but instead of commas uses tabs (or \\\\t ) to separate attribute\
    \ values in a single record. TSV is an alternative to the common CSV, mainly because\
    \ having commas in attribute values (say textual data) is very common, causing\
    \ issues during parsing, but tabs are unusual. The files are then saved with a\
    \ .tsv extension and look something like the following: username    pin    first\\\
    _name    last\\_name  \n\nheylaura    1234    Laura    Wu  \n\niampc    999    Paige    Carter\
    \  \n\n...    ...    ... • JavaScript Object Notation (JSON) : Previously, we\
    \ discussed how hierarchical data is best suited for JSON format as it allows\
    \ the transmission of tree-like data in a  human-readable format. It nests multiple\
    \ key-value pairs as a dictionary and is independent of the data type or the programming\
    \ language used. JSON syntax is both easy and fast to read and parse. It supports\
    \ nested schema and makes manipulation of data structure effortless in comparison\
    \ to other formats. The corresponding files are saved with a .json extension and\
    \ look something like the following. \\[  \n\n  {  \n\n    “username”: “heylaura”,\
    \  \n\n    “pin”: 1234,  \n\n    “first\\_name”: “Laura”,  \n\n    “last\\_name”:\
    \ “Wu”  \n\n  },  \n\n  {  \n\n    “username”: “iampc”,  \n\n    “pin”: 999, \
    \ \n\n    “first\\_name”: “Paige”,  \n\n    “last\\_name”: “Carter”  \n\n  },\
    \  \n\n  ... ... ...  "
