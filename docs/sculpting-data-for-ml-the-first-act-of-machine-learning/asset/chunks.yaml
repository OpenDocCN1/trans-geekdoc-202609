  trans: "\n\n# 分配类别权重\n\n加权参数是机器学习中的一个基本概念，它描述了特定实体具有多大的重要性。权重可能与特定特征、特定数据记录或人工神经网络中的神经元有关。在不平衡数据集中，我们可以给不频繁类别的记录分配比频繁类别记录更高的权重。这一步使得学习算法对不频繁类别的误预测施加更大的惩罚，从而弥补了因数量较少而提供的有限信号。\n\
    \n例如，考虑一个包含 100 万条贷款记录的数据集，其中标签指示借款人是否按时还款。假设只有 0.01% 的人未按时还款，我们有 99.9 万条按时还款记录（例如\
    \ `label = 1`）作为多数类，其余 1 千条作为少数类（例如 `label = 0`）。在这种情况下，我们可以使用一种基本方法，即分配与其各自频率成反比的类别权重，即\
    \ `w_i = N / (C * n_i)`。这里，`w_i` 是第 i 个类别的权重，`N` 是数据集中的总记录数，`C` 是类别总数，`n_i` 是属于第\
    \ i 个类别的数据集记录数。使用这种技术，我们发现由于频率较高，按时还款的记录被分配了 0.5 的权重，而另一类则被分配了 500 的值！这意味着对后一类的误分类将比前一类受到\
    \ 1000 倍的惩罚。\n\n# 选择正确的评估指标\n\n在处理即使轻微不平衡的数据集时，选择一个相关的评估指标以有效评估模型性能是必要的。准确率并不总是最佳指标。考虑一个预测外星人是否会在未来\
    \ 24 小时内登陆地球的模型。毫无疑问，该模型会以 99.99% 的准确率预测答案为“否”，表明该模型非常准确。然而，实际上，如果模型无法准确预测答案为“是”的记录，则该模型可能不可用。在这样的情况下，F1\
    \ 分数可能是我们可以考虑的更相关的指标。\n\n在分类问题的统计分析中，F1 分数是模型精确率和召回率的调和平均数。其范围从 0 到 1，值为 1 表示完美的精确率和召回率。然而，其缺点是它仅针对特定的分类阈值定义（通常二分类场景的默认值为\
    \ 0.5）。该阈值通常需要一些调整，特别是在我们存在数据不平衡问题的情况下。此类情况下更好的指标是精确率-召回率曲线下面积（PR-AUC），即通过改变分类阈值产生的精确率-召回率曲线下的面积。PR-AUC\
    \ 也可以被视为针对每个召回阈值计算的精确率分数的平均值。\n\n# 改变问题定义\n\n这种方法是处理高度不平衡数据集（少数类可能仅在 1000 条记录中出现\
    \ 1 次）最有趣的方法之一。到目前为止，我们一直将问题视为简单分类，即训练模型将数据记录智能地分类为不同组别，无论是多数类还是少数类。我们观察到，简单的分类学习算法在处理倾斜数据集时会遇到困难，因为多数类掩盖了少数类的特征，并破坏了模型的预测能力。因此，改变问题定义并从异常检测的角度来看待它会很明智。异常检测是一类识别数据集中异常点的问题，即识别那些与常规（在我们的例子中是多数类）不同的发生情况（这里可能是少数类）。这种技术通常被称为离群点检测。在这种情况下修改我们的问题解释，有助于我们在不改变数据集组成的情况下使用不平衡数据集。\n\
    \n# 数据导出\n\n在我们完成了清洗、修剪和平衡数据的所有繁琐任务后，最后的任务是导出并发布数据供公众使用。选择合适的结构和适当的格式来导出数据集至关重要。如果数据集结构简单且采用易于在不同学习框架中导入的易用格式，则更有可能被更多人访问、使用和共享。数据集的可管理性是另一个基本特征。它有助于数据在系统中长期无故障地存在，并推动创新。\n\
    \n我们可以考虑不同的结构来适当表达数据集，关键结构如下：\n\n- **表格型**：这是最常见的结构，我们将数据组织为数据记录的行和列出记录属性的列。它最适合独立的数据记录，并可以有效地以\
    \ CSV 格式导出。\n- **层次型**：这些数据结构支持数据记录在垂直树状组合中链接到其他数据记录的集合。也就是说，属性本身可能是键值对。层次型数据结构可以功能性地以\
    \ JSON 格式导出。\n- **网络型**：在这种数据结构中，不同数据记录之间存在多重关联，就像蜘蛛网或社交网络一样。\n\n我们也可以快速讨论一下可以用来导出数据集的不同格式：\n\
    \n## 逗号分隔值 (CSV)\n\n如前所述，这种格式对于表格型数据集非常有效，简单来说就是行和列。每条数据记录由新行分隔，单条数据记录中的属性由逗号\
    \ (`,`) 分隔。第一行应始终为表头行，指示后续属性的名称。它看起来类似于以下内容：\n\n```\nusername,pin,first_name,last_name\n\
    heylaura,1234,Laura,Wu\niampc,999,Paige,Carter\n...\n```\n\nCSV 文件以 `.csv` 扩展名保存。CSV\
    \ 文件有许多优点：它们易于人眼浏览，简单易于实现和解析。导入和操作数据毫无麻烦。数据处理速度更快，并提供紧凑的版本。然而，它仅支持基本类型，如果属性值本身包含逗号，会造成解析混乱。它不支持特殊字符，且没有通用标准。\n\
    \n## 制表符分隔值 (TSV)\n\n这种格式与 CSV 非常相似，但使用制表符（或 `\\t`）代替逗号来分隔单条记录中的属性值。TSV 是常见 CSV\
    \ 的一种替代方案，主要是因为属性值中包含逗号（例如文本数据）的情况非常普遍，会导致解析时出现问题，而制表符则不常见。文件以 `.tsv` 扩展名保存，看起来类似于以下内容：\n\
    \n```\nusername    pin    first_name    last_name\nheylaura    1234    Laura \
    \   Wu\niampc    999    Paige    Carter\n...    ...    ...\n```\n\n## JavaScript\
    \ 对象表示法 (JSON)\n\n如前所述，层次型数据最适合 JSON 格式，因为它允许以人类可读的格式传输树状数据。它将多个键值对嵌套为字典，且独立于所使用的数据类型或编程语言。JSON\
    \ 语法既易读又解析快。它支持嵌套模式，与其他格式相比，使数据结构的操作变得轻而易举。相应的文件以 `.json` 扩展名保存，看起来类似于以下内容：\n\n\
    ```json\n[\n  {\n    \"username\": \"heylaura\",\n    \"pin\": 1234,\n    \"first_name\"\
    : \"Laura\",\n    \"last_name\": \"Wu\"\n  },\n  {\n    \"username\": \"iampc\"\
    ,\n    \"pin\": 999,\n    \"first_name\": \"Paige\",\n    \"last_name\": \"Carter\"\
    \n  },\n  ...\n]\n```\n\n"
