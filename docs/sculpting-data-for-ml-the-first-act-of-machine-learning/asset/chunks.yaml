  fmt: "\n# Web Scraping Product Links and Reviews\n\nFor each page, we now need to\
    \ extract the links to each of the products. Let us make use of the inspect functionality\
    \ of a web browser. This functionality would let us see behind the scenes of that\
    \ particular element, including the source code, images, CSS, fonts and icons,\
    \ Javascript code that powers animations, and much more. To use this feature,\
    \ right-click on the element and go to the inspect option. Next, identify the\
    \ anchor element, i.e., `<a>`, that contains the product’s link and note its CSS\
    \ class specifically. In the following example, we see that the CSS class is `thumb-link`.\
    \ Usually, all the product links would be using the same class, but it is better\
