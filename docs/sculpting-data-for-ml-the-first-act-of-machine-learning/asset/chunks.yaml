    # 支持度、置信度、提升度和确信度


    ## 支持度


    支持度衡量属性集（也称为项集，此处为 `X` 或 `Y`）在整个数据集中的出现频率。用数学术语表示，如果项集 `X` 在总共 `T` 笔交易中的 `t` 笔中出现，则支持度可表示为：


    ```

    support(X) = t / T

    ```


    ## 置信度


    置信度衡量 `X => Y` 成立的可能性，即在 `X` 出现的条件下 `Y` 出现的概率。相对于交易集 `T`，置信度值 `X => Y` 是包含 `X`
    的交易中同时也包含 `Y` 的比例。用数学公式表示为：


    ```

    confidence(X => Y) = support(X ∪ Y) / support(X)

    ```


    ## 提升度


    规则 (`X => Y`) 的观测置信度与其后件在数据集中的支持度之比称为 **提升度**。我们也可以将提升度理解为：在已知 `X` 出现的情况下 `Y`
    出现的概率，相对于在不知 `X` 是否出现的情况下 `Y` 出现的可能性，其上升的程度。提升度值越大意味着关联规则越强。用数学公式表示为：


    ```

    lift(X => Y) = confidence(X => Y) / support(Y)

    ```


    ## 确信度


    确信度量化了假设 `X` 和 `Y` 独立时 `X` 出现而 `Y` 不出现的预期频率（即错误预测）与观测到的错误预测频率之比。较高的确信度值意味着后件高度依赖于前件。确信度值越大意味着关联规则越强。用数学公式表示为：


    ```

    conviction(X => Y) = (1 - support(Y)) / (1 - confidence(X => Y))

    ```


    通常，关联规则的强度是通过支持度和置信度值来衡量的。然而，其他不太常用的度量指标，如 `leverage`（杠杆值/增益）、`collective strength`（集体强度）和
    `all-confidence`（全置信度），也可用于量化有趣度，并可根据具体用例应用。


    # 挖掘关联规则


    如前所述，我们从给定数据中创建一组广泛的关联规则可能性，然后根据上述定义的指标对其进行排序，以筛选出稳健的规则。生成初始规则集并选出顶级规则的过程称为 **挖掘关联规则**。关联规则生成通常是一个两步过程：


    1.  **频繁项集发现**

    2.  **规则生成**


    通常，筛选规则的步骤相对简单，而从大型数据集中高效创建项集并选择频繁项集则较为复杂。让我们详细讨论这一过程以便更好地理解。


    ## 频繁项集发现


    挖掘关联规则的第一步涉及创建所有频繁出现的项集，并将它们划分以形成相应的前件和后件，这一过程称为 **频繁项集发现**。假设数据集中有 `n` 个项，由于项集大小无限制，暴力法将会找出所有
    `2^n - 1` 种组合。该过程还将涉及计算所有可能组合的支持度值。然后，我们选择支持度值高于最小阈值的项集作为 **频繁项集**。


    有许多从幂集中高效搜索所需项集的方法，它们利用了支持度的 **下闭包性质**。该性质确保对于一个频繁项集，其所有子集也是频繁的。因此，非频繁项集不能是频繁项集的子集。例如，这一性质意味着购买
    `{beanie, boots}`（帽子，靴子）的交易频率大于或等于 `{beanie, boots, gloves}`（帽子，靴子，手套），即通过移除一个（或多个）项从项集获得的子集的支持度值总是大于或等于原项集。该性质也称为
    **反单调性**，并被 `Apriori Algorithm`（先验算法）和 `Equivalence Class Transformation (ECLAT)
    Algorithm`（等价类变换算法）等各种算法所利用。


    ### Apriori 算法


    `Apriori Algorithm` 是用于频繁项集挖掘的最流行算法之一。它使用 **广度优先搜索 (BFS)** 策略来计算项集的 `Support`
    值。然后利用上述定义的支持度下闭包性质生成候选项集。该算法涉及以下步骤：


    1.  确定支持度值的阈值；我们可以通过实验或根据需求目测来确定。该阈值，即 `minimum_support`（最小支持度），将有助于剪枝支持度值较低的项集。

    2.  生成所有仅包含单个项且支持度值大于或等于阈值的项集。

    3.  利用上一步选出的项的组合生成大小为二的项集。然后 **剪枝** 所有支持度值低于阈值的项集。

    4.  继续这一过程，基于上一步的结果创建大小逐步增加的项集，对其进行剪枝，以此类推，直到达到旨在构建大小为 `n` 的项集的步骤。


    基于支持度的反单调性质，每一步的剪枝都会显著减少搜索空间。随着可能项的数量 (`n`) 增加，该算法在计算上变得更加高效。这种比例也取决于 `minimum_support`
    值，该值完全取决于具体用例。然而，`Apriori Algorithm` 也有其局限性，因为它在每一步都需要对数据集进行多次扫描，因此具有较高的时间和空间复杂度。


    ## 规则生成


    一旦发现了频繁项集，识别关联规则就是一个相对更直接的任务。规则是通过以二元方式划分频繁项集来形成的。例如，如果 `{beanie, boots, gloves,
    sweater}`（帽子，靴子，手套，毛衣）是一个频繁项集，则可能的规则包括：


    *   `{beanie, boots, gloves} => {sweater}`

    *   `{beanie, boots, sweater} => {gloves}`

    *   `{beanie, gloves, sweater} => {boots}`

    *   `{boots, gloves, sweater} => {beanie}`

    *   `{beanie, boots} => {gloves, sweater}`

    *   `{beanie, gloves} => {boots, sweater}`

    *   `{beanie, sweater} => {boots, gloves}`

    *   `{boots, gloves} => {beanie, sweater}`

    *   `{boots, sweater} => {beanie, gloves}`

    *   `{gloves, sweater} => {beanie, boots}`

    *   `{beanie} => {boots, gloves, sweater}`

    *   `{boots} => {beanie, gloves, sweater}`

    *   `{gloves} => {beanie, boots, sweater}`

    *   `{sweater} => {beanie, boots, gloves}`


    在所有可能性中，我们需要选出能稳健表达关系的关联规则。我们可以通过选择置信度值高于确定阈值的关联规则来实现。基于置信度的反单调性质，源自同一项集且前件规模较大的规则，其置信度值高于后件规模较大的规则。原因在于随着前件规模增加，支持度值降低，而置信度升高。简单来说：


    ```

    confidence({beanie,boots,gloves}=>{sweater}) ≥ confidence({boots,gloves}=>{sweater,beanie})
    ≥ confidence({beanie}=>{sweater,boots,gloves})

    ```


    利用上述性质，我们可以限制生成的规则数量，并按照以下步骤仅选取所需的规则：


    1.  确定置信度值的阈值；我们可以通过实验或根据需求目测来确定。该阈值，即 `minimum_confidence`（最小置信度），将用于选择置信度值较高的规则。

    2.  从一个频繁项集开始，我们将形成仅包含单个后件的规则，并移除置信度值低于阈值的规则。

    3.  利用上一步的规则，我们将通过将后件数量增加一来形成新规则，并应用阈值丢弃不满意的规则。

    4.  我们重复这些步骤，直到尝试了多种后件组合，且前件数量为一。


