    `Python` 库。众所周知，浏览器基于 `HTML` 代码渲染每个网页。**Beautiful Soup** 解锁了快速导航和修改 `HTML` 树结构的能力，为我们节省数小时甚至数天的工作。此外，它还允许我们编写自动化脚本从网络抓取数据。为更好理解，让我们看一个例子。假设我们有一个编码如下的
    `HTML` 页面：


    ```

    html_doc = """

