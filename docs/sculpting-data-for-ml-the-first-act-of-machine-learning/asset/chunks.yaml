- raw: "Chapter 1 INTRODUCTION 1•  The Modern Bloom The last couple of years have\
    \ seen immense growth in the application and adoption of Machine Learning across\
    \ diverse domains. There are various reasons behind this explosive growth: information\
    \ overload, the need to automate mundane tasks, advancing the current state of\
    \ technology, and sometimes just curiosity about the extent of possibilities.\
    \ Following are some of the applications of Machine Learning in each of the abovementioned\
    \ dimensions: • Information Overload: Machine Learning tackles information overload\
    \ by providing recommendations based on people’s liking, like suggesting what\
    \ products to buy, whom to connect with, what song to listen to, and what type\
    \ of content to view, all based on their past engagements and inferred interests.\
    \ •  Automation of mundane tasks: Machine Learning automates many everyday tasks\
    \ like shortlisting resumes for a job posting, identifying grammatical mistakes\
    \ in a text, transcribing audio in a video or a podcast, suggesting appropriate\
    \ text responses, and so on. Not having to do such mundane tasks saves much human\
    \ time and effort, which could be spent on more critical tasks. • Advancement\
    \ of technology: Academic institutions and business corporations are also plying\
    \ Machine Learning to further the present state of scientific know-how. Instances\
    \ of these include developing self-driving cars, improving healthcare quality\
    \ by advancing the technology to diagnose ailments in their early stages, and\
    \ enhancing agriculture produce using computer vision technology to monitor crops.\
    \ • Testing the limits: Creative use cases of Machine Learning include creating\
    \ music or meaningful lyrics without human interference, synthesizing pictures\
    \ and videos of non-existent people, automatically generating food recipes, and\
    \ detecting sarcasm or spoilers in a text snippet. Unquestionably, Machine Learning\
    \ is the most used and abused sub-domain of Artificial Intelligence presently.\
    \ Regardless of our fascination or loathe for it, it heavily influences our decision-making\
    \ power and dominates our lives presently. To describe, enabling computers to\
    \ learn on their own is what encompasses Machine Learning. The power of spotting\
    \ patterns without programming is the most prominent edge these decision-making\
    \ systems have over the others. Researchers keep traversing unexplored territories\
    \ of Machine Learning, whereas, according to experts, the businesses have just\
    \ seen the tip of the algorithmic iceberg. According to finances online, US$28.5B\
    \ was allocated to Machine Learning worldwide in just the first quarter of 2019,\
    \ which is staggering since the figure was only US$1.3B in 2016. Almost 50% of\
    \ companies have either started exploring or are planning to incorporate Machine\
    \ Learning soon. The number of startups focusing on just Machine  Learning services\
    \ are having a 14x rate of increase currently. 97% of mobile users use Machine\
    \ Learning trained voice assistants on their devices, with a 40% search now powered\
    \ just by voice. Advancement in the software aspect has also led to the projected\
    \ growth of US$120B in global sales of AI-powered hardware by the end of 2025.\
    \ Enterprise domains like security, analytics, and marketing are reaching new\
    \ heights with Machine Learning with a 25%, 33%, and 16% increase in adoption\
    \ rates, respectively.  \n\nDominant leaps leave the scientists, investors, policymakers,\
    \ business leaders, and the audience enthralled, hinting that human-like intelligence\
    \ in machines might be just around the corner. Nonetheless, progress in Machine\
    \ Learning has been impressive, but there is a lot of pending explanation and\
    \ examination, which keeps the research going on. 2•  Significance Of Data For\
    \ the state-of-the-art Machine Learning algorithms to work their magic, it is\
    \ essential to focus on the three key dimensions: \n\n| 1\\.  |\n\n| --- |\n\n\
    | 2\\.  |\n\n| 3\\.  |"
