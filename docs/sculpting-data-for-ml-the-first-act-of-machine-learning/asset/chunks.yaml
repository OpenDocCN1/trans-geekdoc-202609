    \                )\n            )\n        except NoSuchElementException:\n  \
    \          # No NEXT button, no more pages left\n            break\n```\n\n`NoSuchElementException`\
    \ 广泛用于在选择器未返回 `WebElement` 时抛出异常。我们可以按如下方式导入该 `Selenium` 异常：\n\n```python\nfrom\
    \ selenium.common.exceptions import NoSuchElementException\n```\n\n至此，脚本已完全准备好从顶级类别的产品中跨多页提取所有评论。在理想世界中，这将是结束。然而，在当前形式下运行脚本时，可能会遇到一些干扰数据收集过程的错误。下一节将帮助我们优雅地处理这些错误。\n\
    \n## V· 错误处理\n\n我们需要学会识别故障点，尤其是希望脚本平稳运行时。然而，正如生活中大多数情况一样，我们不知道自己不知道什么！开始错误处理流程，首先对脚本进行**空跑**。我们将识别潜在故障点并相应更新脚本。以下描述了我们在试运行中遇到的一些实例及处理方式。\n\
    \n### 1. 无效 URL\n\n尝试从网页获取产品详情时，发现 URL 无效。潜在原因可能是网站维护不善或近期更新，导致新旧 URL 不再兼容。我们使用\
    \ `Selenium` 的 `WebDriverException` 处理此情况，当所需会话不存在或格式无效时会抛出错误。\n\n```python\n\
    from selenium.common.exceptions import WebDriverException\n\n......\n......\n\n\
    # Open the URL in browser\ntry:\n    browser.get(url)\nexcept WebDriverException:\n\
    \    # If the extracted URL is invalid\n    print('invalid url', iterr)\n    continue\n\
    \n......\n......\n```\n\n### 2. 评论元数据缺失\n\n有时提取评论元数据时其不存在，导致整个脚本失败。我们通过在提取数据前的多处添加有效性检查来应对。\n\
    \n```python\nreview_metadata_elements = [\n    review_metadata_raw[i].find_all(\n\
    \        \"dl\", {\"class\", \"pr-rd-def-list\"}\n    )\n    if review_metadata_raw[i]\
    \ is not None\n    else None\n    for i in range(len(review_metadata_raw))\n]\n\
    \nreview_metadata = []\nfor element in review_metadata_elements:\n    if element\
    \ is None:\n        review_metadata.append(None)\n        continue\n    review_metadata.append([\n\
    \        (\n            element[i].find(\"dt\").text.lower(),\n            element[i].find(\"\
    dd\").text.lower()\n        ) for i in range(len(element))\n    ])\n```\n\n###\
    \ 3. 页面加载延迟导致内容为空\n\n有时尽管页面包含所有信息，提取的内容却为 `null`。这主要是因为网站加载内容需要时间，而提取代码已提前运行。我们引入睡眠时间，让网页加载完成后再开始提取。\n\
    \n```python\nbrowser.get(url)\ntime.sleep(4)\ncontent = browser.page_source\n\
    soup = BeautifulSoup(content, \"lxml\")\n```\n\n### 4. 进度丢失与断点续传\n\n认为脚本万无一失时，端到端运行不同案例仍遇到问题：断网、笔记本电量耗尽等。多种场景可能导致进度丢失。记录进程中断时的迭代次数，有助于从中断点恢复而非重头开始。例如，可按如下方式保存\
    \ `NumPy` 数组：\n\n```python\nnp.save('./scraped_data_tops.npy', scraped_data)\n\
    ```\n\n## VI· 请求速率限制\n\n简单来说，网站的请求速率是指单位时间内其能处理并返回有效响应而不超载的次数。我们必须通过合理控制请求数量来尊重网站的速率限制。失控的行为可能拖垮网站。此外，许多网站有故障保护设计，会自动屏蔽发送异常高流量的\
    \ IP。为避免被屏蔽或干扰正常流量，两次网页加载请求之间必须有不可避免的延迟。\n\n例如，每次模拟点击 **NEXT** 按钮访问评论页时，都在发起加载请求。因此需在两个动作点之间引入等待时间，具体做法如下：\n\
    \n```python\n# If the current page is the initial one, it contains only NEXT button\
    \ (PREVIOUS is missing)\nif init == 0:\n    try:\n        init = 1\n        browser.execute_script(\n\
    \            \"arguments[0].click();\",\n            browser.find_element_by_xpath(\n\
    \                '//*[@id=\"pr-review-display\"]/footer/div/aside/button'\n  \
    \          )\n        )\n        time.sleep(10 + random.randint(0, 5))\n    except\
    \ NoSuchElementException:\n        # No NEXT button present, that is less than\
    \ 10 reviews\n        time.sleep(15 + random.randint(0, 10))\n        break\n\
    else:\n    try:\n        # Execute click on NEXT by utilizing the XPath of NEXT\n\
    \        # XPath of NEXT is different here since PREVIOUS is also present\n  \
    \      browser.execute_script(\n            \"arguments[0].click();\",\n     \
    \       browser.find_element_by_xpath(\n                '//*[@id=\"pr-review-display\"\
    ]/footer/div/aside/button[2]'\n            )\n        )\n        time.sleep(10\
    \ + random.randint(0, 5))\n    except NoSuchElementException:\n        # No NEXT\
    \ button present, that is less than 10 reviews\n        time.sleep(15 + random.randint(0,\
    \ 10))\n```\n\n"
