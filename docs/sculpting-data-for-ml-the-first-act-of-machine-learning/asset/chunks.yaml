- raw: 'Stemming is a crude method for cataloging words related to each other and
    is usually done by chopping off from the end until we reach the word’s stem. For
    example, stemming the following words: ‘fit ’, ‘fitter ’, ‘fitted ’, ‘fitting
    ’, ‘fittable ’, ‘fittest ’ to their stem word ‘fit ’ helps convey almost the same
    meaning but with a reduced vocabulary. Though this chopping off approach  works
    well in many cases, it leads to many exceptions, especially in a language like
    English. For this, we have other sophisticated techniques like Porter Algorithm,
    Snowball Algorithm, and so on. 3. We can continue with the above process of shrinking
    the vocabulary size by reducing the derived words to their base form, where the
    base form is the word’s morphological root, a process known as Lemmatization .
    Lemmatization looks beyond just chopping off the word and relies on the lexical
    meaning to obtain the correct base form, thus giving a much more informative view.
    For example, lemmatization would reduce the following words ‘be ’, ‘been ’, ‘being
    ’, ‘was ’ with its lemma, i.e., ‘be ’. 4. We can count the occurrences of a sequence
    of words rather than individual words. This technique is more useful than counting
    individual words since the meaning of a word depends heavily on the context in
    which it is being used. In statistical language models, a sequence of n words
    is called an n-gram . N-grams find their applications in areas like auto-completion
    of sentences and spell-check. The above count-based approaches help generate a
    sturdy embedding for text vectorization; however, they do not capture the text’s
    exact semantic meaning with utmost sophistication. Hence, it is worthwhile to
    explore advanced techniques using Recurrent Neural Networks (RNN) to fabricate
    complex contextual text embeddings. II•  Image Vectorization Playing around with
    images, we start to see individual pixels (as below) when we zoom in on an image.
    These pixels are nothing but individual elements of a picture, a basic unit of
    programmable color for a digital image. Hence, an image  represents pixels in
    a grid form, each having its color. ![](Image00029.jpg)As we zoom in on the image,
    we begin to see the individual pixels. In the rainbow world, each pixel gets its
    color through a combination of the three primary colors: Red (R), Green (G), and
    Blue (B). Therefore, in mathematical terms, each pixel in the image can be represented
    by three different numbers, indicating each of RGB pigments’ intensity with 256
    levels each. For example, a crimson pixel can be represented as RGB(220,20,60)
    . We can apply the above knowledge to convert a pixel-based image into a vector-based
    image containing only numbers for the model to comprehend. A high-resolution colored
    PNG image of dimensions say 1028\*768 px can be an input to the model as a 3-dimensional
    vector of size 1028\*768\*3 . For a grayscale image, we can represent each pixel
    with a single value, indicating the white color intensity. 0 denotes black pixel
    value, 255 denotes white , and the numbers between denoting different gray shades.
    The grayscale image can thus be vectorized as a 2-dimensional vector of size 1028\*768
    instead. This pixel-based approach is one of the most straightforward techniques
    to vectorize an image. There are other ways like Color Histogram Vectorization
    that we could experiment with depending on the use case and our problem’s complexity.
    III•   Categorical Vectorization When we look into the Clothing Fit dataset’s
    product sizing column, we observe that the values always belong to a specific
    set, viz. XXS , XS , S , M , L , XL , and XXL . We would need to vectorize these
    categories and encode them as numeric values before feeding it to a model. Let
    us talk about the different ways we can encode this categorical column of our
    dataset. A•  Integer Encoding One of the easiest methods would be to assign each
    category (or product size in this case) a unique numeric value, something as below.
    ![](Image00030.jpg)The integer assignments follow a natural ordering similar to
    their corresponding sizes. This encoding aids the model to understand that size
    XXS is close to S compared to size XL (since 1 is closer to 3 than 6 ). One fine
    print with this method is that it only works when there is a natural ordering
    between the categorical values. If we have an encoding like {S:1, M:2, L:3, XS:4,
    XL:5, XXS:6, XXL:7} , it might not work. Hence, it is essential to wisely encode
    categorical values, as incorrect assignments could lead to unexpected results
    . B•  One-Hot Encoding For categorical features, where no ordinal relationship
    exists, the above-defined Integer Encoding might be overkill or not work at all.
    In situations like these, we use a widely popular and creative way to encode the
    categories in a binary form called the One-Hot Encoding . It represents each value
    as a binary vector of a size equivalent to the number of possible categorical
    values. Only the value assumed in the respective data records is turned on or
    assigned 1 , and the rest are turned off or assigned 0 . For example, if all the
    product sizes are {XXS, XS, S, M, L, XL, XXL} , then we can do the encoding of
    the different product sizes like the following: ![](Image00031.jpg)This way of
    encoding could be easily adapted to new possible inputs. For example, let us say
    ModCloth introduces new product sizes as PS , PM , and PL for petite body types.
    In this case, we can extend the existing vectors by appending three additional
    zeros and introduce encodings for the new sizes by using these additional 3 bits,
    which looks something like the following: ![](Image00032.jpg)2•  Normalizatio
    n Recall the example of the World Cities dataset we discussed in the previous
    chapter, which had an attribute indicating each city’s population. Logically,
    the values in this column could range anything in between 1 (Monowi, Nebraska
    boasts of having only a single resident! Unbelievable, right? ) to a couple of
    millions. Training on this dataset could lead to getting stuck with NaNs as the
    gradient update becomes too large to handle owing to the vast range in values.
    Now consider the average age of the population as an attribute. The values of
    this column would mainly lie between 0 and 100. This range is quite different
    from that of the population . Training a Machine Learning model with these two
    attributes in the dataset would make the gradient bounce rapidly because of the
    two different scales, thus slowing down the convergence process. Many times, optimizers
    like AdaGrad or Adam are used to guard against this problem by creating a different
    learning rate per feature. However, optimizers may not always save us from all
    problems, especially when each feature has a wide range of values. To combat the
    above problems, we should transform the values of the features belonging to varied
    scales and bring them on a similar scale without changing their original behavior,
    a process referred to as Normalization . In more complex scenarios, normalization
    also refers to sophisticated adjustments to shepherd the entire probability distributions
    of adjusted values into alignment. Normalization helps improve the numeric stability
    of the model by aiding the gradient to ascent (or descent) with a decent speed
    rather than taking too large (thus bouncing back and forth) or too small (thus
    never converging) jumps. This behavior further helps in speeding up the training
    speed of the model. There are multiple ways to calibrate the feature distributions;  let
    us discuss the four most common ones. I•  Feature Clipping If we plot the population
    of all the cities in the world from the World Cities dataset, we would observe
    the graph has long tails on both sides probably. The cities with significantly
    less population (imagine the number of cities with only a single resident or less
    than ten even!) and those with a vast population would practically be outliers.
    In such cases, we can set a minimum and maximum population (say set a range from
    2,000 to 20,000,000) and clip the outliers. We set values less than the minimum
    to the minimum value and values greater than the maximum to the maximum value.
    This technique is called Feature Clipping . ![](Image00033.jpg)A probability density
    plot of the population of different cities. Conceptually, the extremes ends can
    be clipped off. A sophisticated way to find the minimum and maximum of the feature
    values is to use the measure of standard deviation, for example, clipping the
    values beyond the range  of (\-nσ , +nσ ). Feature Clipping is a simple yet effective
    way of normalizing the data. The most significant advantage is that it can be
    applied before or after other normalization techniques. II•  Range Scaling Consider
    the age feature in the World Cities dataset that can have a definite range from
    0 to 100 years after clipping. Each age value has a substantial number of people.
    We can fix the upper, and the lower bounds of the feature distribution as the
    probability of outliers is low (only 0.0173% of Americans live to 100! ). In such
    cases, Range Scaling is an effective way of normalization. This technique mutates
    the feature values from their existing range, here \[0, 100\] , to a standard
    range, which is usually \[0, 1\] or \[-1, 1\] . This approach is also known as
    the Min-Max Scaling because of the way we transform the ranges. The following
    defines the formula to rescale to a range of \[0, 1\] , where x’ represents the
    transformed value, and x is the feature’s original value. min(x) and max(x) represent
    the lower and the upper bounds of the original range. ![](Image00034.jpg)The following
    is a generalized formula that can be used to rescale to an arbitrary range \[p,
    q\] : ![](Image00035.jpg)III•  Log Scaling Observe the number of languages spoken
    feature in the World Citie s dataset; we see that it follows a power-law distribution
    . To put it in simpler words, a handful of languages cover most cities, while
    the rest cover only the remaining few. Though this distribution represents the
    data accurately, it does not gel well with the model training process.  To work
    with skewed distributions like these, we use Log Scaling , which transforms the
    distribution into a normal distribution. Log Scaling narrows down the original
    range of the feature values by performing a log transform over all the values,
    something like below (where x is the original value and x’ is the transformed
    value): ![](Image00036.jpg)Log Scaling compresses a wide range to a narrow range
    and reduces the variability of the data generically. This transformation helps
    in improving the performance of the learning algorithm. The outliers might cause
    the log-transformed distributions to be still a bit skewed and not entirely normal.
    However, they are closer to being normally distributed as compared to the original
    distribution. ![](Image00037.jpg)A probability density plot of the number of languages
    spoken in different cities (left ). Noticeably, the plot with log scaling (right
    ) helps in reducing the skewness of data. IV•  Z-Score Scaling When a feature
    value distribution contains only a few outliers where feature clipping might not
    yield drastic changes, we tend to use the Z-Score Scaling technique. This normalization  method
    transforms the data by converting the values to a common scale with a mean value
    of 0 and a standard deviation value of 1. In statistics, Z-Score is a metric that
    quantifies a value’s relationship to the mean ( μ ) of the entire group in terms
    of the number of standard deviations ( σ ) . For instance, if the value is equal
    to the mean of the group, Z-Score would be 0. The following is used to compute
    the transformed value (or the Z-Score) denoted by x’ from the original value x
    : ![](Image00038.jpg)The above described the four widely popular techniques to
    normalize the data. However, it is up to us to choose the appropriate approach
    based on the use case, learning algorithm, and data distribution. Regardless of
    the technique we use, our data should have the following characteristics for the
    model to perform well: • Slender Range: This indicates that the range of the feature
    values should be barely sufficient to accurately represent the distribution. As
    a standard, many data practitioners like to rescale feature values in the range
    \[0,1\] or \[-1,1\] . • Homogeneity: This requires different feature columns in
    the dataset to follow near-calibrated ranges or lie in similar feature value ranges.
    3•  Bucketization When a dataset constitutes observations from a survey or an
    experiment, it ought to have some discrepancies. Hence to reduce the effects of
    those minor observation errors, we use a technique called Bucketization . This
    approach involves replacing the original values with the value of the respective
    bin. Mapping  of feature values to bins can be done by defining small intervals
    on a continuous scale (based on some thresholds), and the process is called Data
    Binning . Aggregating numeric values is associated with loss of information at
    times; however, it reduces the amount of data to be processed. It thereby eases
    the model’s training without any drastic performance changes. It also reduces
    the impact of noise, for example, in Image Processing problems. I•  Symmetric
    Bucketization In this approach of Symmetric Bucketization , we divide the entire
    feature value range into equal-sized intervals. The thresholds are identically
    spaced, with fixed boundaries for each interval. This type of binning is useful
    when the feature values are uniformly distributed across the entire range. However,
    suppose the feature values are not uniformly distributed. In that case, certain
    buckets might have an extremely high number of points, and others may have very
    few or even none, thus leading to an imbalance. Therefore, it is essential to
    ensure the uniform distributions of the feature values before applying this technique
    as it might hinder the learning. II•  Quantile Bucketization Quantile Bucketization
    aims to cover the shortcomings of the above-defined Symmetric Bucketization. It
    smartly creates buckets, or bins, having an equal number of points within them.
    In statistics, quantiles are cut points that divide the entire distribution into
    groups such that they contain the same fraction of the total population. Based
    on this concept, the thresholds are not equally-spaced through the whole range
    of the feature values. Instead, they are governed by the number of data points
    lying between any two, which should  be equal for all. By this logic, there would
    be more bins (with smaller size) in the area with higher data density, and less
    bins (with larger size) in the areas where data is more spread out. Therefore,
    Quantile Bucketization is preferred when the data distribution is skewed since
    it is adaptive and mimics the original distribution closely. ![](Image00039.jpg)A
    side-by-side comparison of the symmetric and quantile style of binning. Feature
    Engineering After data preprocessing, we can use the data to train a Machine Learning
    model and deploy it in production to work on unseen data. This simple model has
    the obvious set of features, usually mirroring the dataset’s attributes, and could
    perform reasonably well in addressing the problem at hand. To further improve
    the model’s performance, we have two choices: 1. Model Iteration: One approach
    is to iterate on building sophisticated Machine Learning models, for instance,
    by increasing the number of hidden layers in a neural network or taking an ensemble
    of different types of models with the hope to learn more effectively. Using multiple
    Machine  Learning models in conjugation to obtain better predictive performance
    is referred to as Ensemble Learning . This action plan might yield the desired
    results; however, it requires much time and effort to develop and comes with a
    risk of not working entirely despite all the efforts. It also necessitates a larger
    volume of training data that comes with another risk of models not scaling to
    production traffic. 2. Feature Iteration : The other course of action is to engineer
    new and better features. The features mirror the structure of the data, which
    are identifiable even by the sub-optimal models. Thus, having a better representation
    of data influences the predictive models’ performance. The process of Feature
    Engineering identifies features that might provide additional signals to our existing
    model to improve its performance. Constructing features is an exciting aspect
    where all the intuition, creativity, and black art happens. Andrew Ng says that
    “Coming up with features is difficult, time-consuming, and requires expert knowledge.
    Applied machine learning is basically feature engineering in itself” . With this
    approach, we can keep the simple model in production, which further reduces the
    risk of failure in terms of scalability and performance. As we start our journey
    to address a real-world problem with Machine Learning, it makes sense to aim for
    low hanging fruits. Weighing the pros and cons of the two approaches, we should
    first focus on engineering better features to quickly boost the performance before
    moving on to more challenging and risky tasks. With innovative features in our
    basket, we can avert from using complex ensemble learning techniques or spend
    eternities searching for the best model parameters, a process known as Hyperparameter
    Tuning . Furthermore, experimenting with new features improves our understanding
    of how the model reacts to new information and addresses our problem more aptly.
    However, this only works within a limit until we have explored all possibilities.
    We would not like to go overboard with ‘feature over-engineering’, thus  ending
    up with unwieldy dimensions (which we shall discuss later in this chapter). What
    is not Feature Engineering? Before we dive deep into the different subtasks of
    Feature Engineering, which will help us in creating an exhaustive list of features
    for model training, it is necessary to paint a clearer picture by pausing and
    highlighting what is not feature engineering: • It does not include identifying
    the data signals present in the dataset while gathering data from a source. •
    It does not subsume spotting the target variable or the label of each data record
    in the train or test set. • It does not cover the process of data cleansing, with
    tasks like removing punctuations and stop words or curating word embeddings. •
    It also does not encompass processing the data by scaling the values to a particular
    range, normalizing the values, encoding categorical values, and so on. The Iterative
    Process Understanding the process of feature engineering as an applied Machine
    Learning task highlights that it does not stand-alone. It is an iterative process
    with a well-defined problem that oscillates between feature ideation and model
    evaluation till we hit a plateau. Once that happens, we can then play around with
    complex model architecture or hyperparameter tuning. The step-by-step process
    followed in a formal setting for feature engineering usually looks like this:
    1. Understanding the problem statement and the domain to brainstorm ideas for
    new features by analyzing recent trends  and discussing with experts. 2. Extracting
    the feature values for offline statistical analysis after some transformations.
    3. Training the existing model on data including new features and analyzing the
    model performance metrics . 4. In case the feature does not give a performance
    boost, we can try different transformation ideas or simply go back to brainstorming
    other features. Otherwise, we further work on getting the feature productionized
    , thereby integrating it with the model serving pipeline. For more context, model
    serving is an approach of exposing the trained model as an endpoint to which we
    simply feed our data and get prediction results. Feature Types Modern Machine
    Learning models are data-hungry, but the fundamental aspect is feeding the data
    in the right format. Passing on raw features in the data might make the model
    training slower. They impede the generalization power of the model and impact
    the performance negatively. It is essential to understand that the features’ data
    type significantly influences the processing approach. Following we give a brief
    overview of the four types of commonly used features: 1. Continuous Features:
    A continuous feature can assume any real number, including floats. There is no
    definite boundary between any two feature values, i.e., there could be infinitely
    many possible values lying between those two. These feature values are essentially
    numeric and hence can be performed mathematical operations on. For example, the
    products on ModCloth have prices like US$14.99 , US$25.00 , US$99.99 , and so
    on. Moreover, there is no strict distinction between partitions (unlike other
    types we shall study below), i.e., a product could even be listed for US$15.10
    , and that would work too! 2 . Binary Features: These are one of the simplest
    types of features and can only have one of the two possible values: 1 or 0 , true
    or false , on or off , yes or no , and so on. These kinds of dichotomous features
    are easy to experiment with, as they do not require fancy transformations. For
    instance, we can denote if a user on ModCloth is verified or not verified . A
    potential scenario would be that the model learns to assign more weight to reviews
    of verified users than their counterparts. 3. String Features: The values of a
    string feature can assume any block of text, be it alphabets, symbols, or emojis.
    As we discussed previously, these string features need processing and should be
    converted to a vector of numeric values. The obvious example of this would be
    the review text of any product as left by the user, like “I love this dress, it
    is my favorite. The size first me perfectly and flatters my curves!” 4. Discrete
    Features: These features are also commonly referred to as Categorical Features
    . The discrete feature values can assume only one of the N possible values and
    have definite boundaries between them. In simpler terms, there could be no other
    value in between the pre-defined N values to which they can be assigned. A point
    to be noted is that there should be a minimum of 3 categories and can extend to
    infinity. They can further be of two types: • Nominal Categorical Features: These
    features’ values have no relationship with each other and do not follow any specific
    order. For instance, encoding the types of jackets like {bomber:1, biker:2, trucker:3,
    denim:4, track:5, parka:6} is a great example where the discrete values are independent
    of each other. • Ordinal Categorical Features: The values of these categorical
    features have an order to them. An example would be encoding product sizing as
    {XXS:1, XS:2, S:3, M:4, L:5, XL:6, XXL:7} where the discrete values follow the
    same order as that of the product sizing, i.e., S<M following 3<4 and so on .
    Features versus Worthy Features Assembling meaningful features worthy enough to
    contribute significant predictive power to a learning algorithm requires much
    effort and time. Before we dive into the different techniques like Feature Extraction,
    Feature Selection, and so on in the upcoming sections, it is necessary to understand
    the distinction between features and worthy features. The following pointers might
    help: • We should avoid discrete features that rarely occur in the dataset. As
    a rule of thumb, we can say that a good feature value has an appearance rate of
    at least 1% . Checking the distribution of feature values enables a model to learn
    the relationship between the feature and the label. Conversely, a rare feature
    adds no significant value, and the model can not make any predictions based on
    that feature. For instance, if there are only 0.05% of the products having the
    size XXXS , it is better to discard those examples. • It is preferred to have
    feature names such that they convey their meaning concisely. For example, if we
    record a user’s body weight, a feature like weight\_lb or weight\_kg makes much
    more sense than a feature named weight . • While doing feature engineering, it
    is essential to deal with discontinuities in the feature values very carefully.
    A meaningful floating-point feature should not contain peculiar out-of-range values.
    Take the ratings of a product; in that case, user\_rating=3.2 makes sense while
    user\_rating=-0.5 does not. The best way to overcome it would be to mark the valid
    values using a custom boolean flag, like is\_user\_rating\_defined . • To maintain
    feature stability, we should avoid using mappings from an external source as feature
    values. For example, it is better to have the feature user\_language= ‘ en’ and
    use this as an input to the model (after creating a vocabulary and transforming
    it), rather than using  an external source that maps ‘en’ to say 8 and using user\_language=8
    as an input to the model. 1•  Feature Selection As we progress on solving complex
    problems, we try to build advanced models and have informative features. And as
    the number of features increases, the amount of data required for the model to
    be generalizable enough for good performance also grows exponentially. This requirement
    increases the storage space and the processing time for the model. In this sense,
    the value added by an additional feature might become minuscule compared to the
    overhead it adds at some point. This phenomenon is referred to as the Curse of
    Dimensionality . Even if we have sufficient data to cater to the additional dimensionality
    to avoid overfitting the model, extra features make the model heavier by requiring
    additional time and resources for training and serving. Therefore it is always
    good to keep a minimal feature space by retaining only the most impactful features.
    This process of selecting a subset of relevant features for use in our model is
    called Feature Selection . The key premise of opting for feature selection is
    that the data contains many redundant or irrelevant features that can be discarded
    without any information loss. Peter Norvig, a celebrated ML Scientist, has put
    forward the power of data and features in a compelling way: “More data beats clever
    algorithms, but better data beats more data.” Thus, feature selection helps avoid
    the curse of dimensionality and paves the way for shorter training and serving
    times, which ultimately translates to a better end-user experience. The resultant
    models are easier to interpret and reason with. We could also reason this idea
    with Occam’s Razor or The Law of Parsimony , that we lose explainability when
    we have many features. By reducing the number of learnable parameters, we  can
    also observe a reduction in the model overfitting. On the contrary, if the ratio
    of learnable parameters and the available data is high, the models might memorize
    the training data, thus hurting its generalization capability. The selection of
    optimum features can be divided into two phases: a search technique that proposes
    new features and an evaluation measure that gauges the usefulness of those features.
    Usually, there are three main categories of feature selection algorithms: 1. The
    filter method uses a statistical measure to score a feature and evaluate the relationship
    between the feature and the label, like mutual information or correlation coefficient.
    Based on the measure’s value, we filter out the features we need to select for
    our model. 2. The wrapper method considers the selection of a set of features
    as a search problem. Using the technique of Recursive Feature Elimination (RFE)
    , for example, this method evaluates multiple models by adding or removing features
    until we find an optimal combination that maximizes model performance. 3. The
    embedded method uses algorithms that have built-in feature selection routines
    as part of the model’s learning. These algorithms select only those features which
    contribute to the performance maximally. Some examples of such algorithms are
    LASSO Regression and Random Forest. Let us go through a handful of feature selection
    techniques commonly used in the industry and academia that provide the best results
    in majority use cases . I•  LASSO Regression Analysis Least Absolute Shrinkage
    and Selection Operator (LASSO) is a regression analysis method that selects an
    optimal subset of features to increase the model’s performance. It uses the L1
    Regularization , which penalizes the absolute values of the objective function’s
    coefficients, to restrict their values to grow too large and overfit on the data.
    As a result, essential features’ coefficients increase in value, and irrelevant
    ones become zero to reduce the coefficients’ absolute sum, automatically selecting
    essential features. II•  Principal Component Analysis Principal Component Analysis
    (PCA) is a statistical approach that reduces dimensionality to increase the model’s
    interpretability without incurring information loss. PCA transforms the data containing
    possibly correlated features into data with linearly uncorrelated features (also
    called principal components ). The transformation is defined in such a way that
    the first principal component captures the maximum possible variance. Each succeeding
    component captures variance in decreasing order while maintaining no correlation
    with other components. PCA is an adaptive data analysis technique that can be
    easily tailored to various domains, data structures, and algorithms. It is instrumental
    in fighting the curse of dimensionality by selecting only those features that
    capture the maximum variance in the data. III•  Feature Importance Ranking Feature
    Importance Ranking is a statistical approach of quantifying every feature’s predictive
    power with respect to the label and ranking them based on the relative importance
    score . As a general rule, features that positively influence  the model performance
    or have a high predictive power are considered more important than the rest. Understanding
    the features’ contributions improves model interpretability and explainability.
    Assessing real-world scenarios, we often have a budget for the number of features
    that we can not exceed due to scaling concerns. In such cases, it becomes essential
    to select the subset of features, from all the possible ones, that would contribute
    the most in delivering the best performance. Following are the three popular methods
    for computing feature importance scores for the features, which can then be used
    for feature selection: A•  Regression Analysis Regression Analysis is a statistical
    approach to estimate the relationship between the features and the target variable.
    Using the regression model’s parameters, we can identify which features have a
    relatively high impact on predicting the target variable accurately. Apart from
    crudely computing the importance of individual features, this method can also
    reveal how the features interact with each other while predicting the target variable
    or to say if there is a synergic effect. In cases where we only have one feature,
    we can use a linear regression model to learn a straight line that best approximates
    the data. For instance, consider y = b + mx where y is the target variable, x
    is the feature, and b and m are constant terms learned by the algorithm. In such
    cases, the value of m can quantify the strength of the relationship between y
    and x . We can extend this concept to multiple features, viz. y = b + ∑m i x i
    , where the coefficient m i of each feature x i represents the importance score
    of that feature in terms of its predictive power assuming that features have  been
    normalized. However, the linear regression model is only useful when the feature
    and the target variable are linearly related. A vital adage “correlation is not
    causation” should be kept in mind while performing regression analysis since regression
    analysis can not effectively convey the cause-and-effect relationship between
    the features and the target. B•  Decision Trees As a Machine Learning model, Decision
    Trees are sensitive to change in data since the computation is ultimately a sequence
    of branching operations based on comparisons of feature values with their respective
    thresholds. They are susceptible to high variance in predicting the target variable
    with even small data changes since they tend to overfit. For this reason, ensemble
    learning methods like Random Forest are preferred as they construct multiple decision
    trees on different splits of data, thus reducing the variance by averaging various
    deep decision trees. Random Forest further reduces the variance by randomly selecting
    subsets of features for each decision tree within. The relative rank (or the depth)
    of a decision node in a tree can be used to assess the relative importance of
    the feature associated with the node. Since features used towards the top of the
    tree influence decisions for a larger fraction of the input samples, they could
    be considered more critical. When we split the data into two parts based on a
    feature value in the decision tree, the resulting splits are more uniform and
    have less data impurity. The relative decrease in impurity combined with the fraction
    of samples handled by the decision node can act as a normalized estimate of that
    feature’s predictive power. By averaging the estimates  of predictive ability
    over several randomized trees, we can reduce the variance of such a measure, commonly
    known as the Mean Decrease in Impurity (MDI) , and use it for feature selection.
    C•  Permutation Testing Permutation Feature Importance is a model-agnostic methodology
    of computing the relative importance scores. The value is quantified as the decrease
    in a model’s performance metric (accuracy, cross-entropy, etc.) when a single
    feature value is shuffled randomly. Randomly shuffling the feature values (or
    dropping them altogether) disrupts the relationship between that particular feature
    and the target value. The decrease in the model performance can be attributed
    to that feature’s predictive power and indicates how much the model depends on
    it. We repeat the process for every feature and compare the differences in the
    model performance. Conceptually an important feature leads to a more considerable
    decrease in model performance than other less important ones. Permutation testing
    can be computationally costly, especially if the feature set is substantially
    huge. However, it is preferable over other model-specific techniques, like decision
    trees, as it can be applied to any model and focuses on the performance measure
    of interest. 2•  Feature Correlation While discussing feature importance ranking
    techniques like regression analysis, we mentioned how they helped understand the
    correlation between the features and the target variables. Building on that concept,
    Feature Correlation is a statistical approach to determine the correlation amongst
    the features  themselves. It establishes the statistical association between a
    feature pair and the degree to which the input variables are linearly related.
    A feature correlation study helps in understanding the data better. Features with
    high correlation do not provide added signals to the model in predicting the target
    variable. So, keeping only one of all the correlated features would minimally
    impact the model performance. This aids feature selection and eventually reduces
    the dimensionality of the feature space. Furthermore, a feature correlation study
    can help in predicting the values of features that might be missing. For instance,
    we can treat the feature whose value is missing as the target variable and train
    a separate model to predict its value from the other correlated features. This
    trick has been known to boost the model performance if the missing feature is
    an important one. The numerical measure of correlation that determines the strength
    of the input variables’ relationship is known as the Correlation Coefficient .
    There are multiple ways of calculating correlation coefficients, and the most
    popular one is Pearson’s Product-Moment Correlation Coefficient (PPMCC) . It quantifies
    the linear correlation between the two features X and Y as ρ(X,Y) = cov(X,Y) ÷
    σ X σ Y where cov(X,Y) is the covariance between the two input variables and σ
    X , σ Y denote their standard deviations, respectively. The value of PPMCC ranges
    between +1 and \-1 , where +1 is a total positive linear correlation, 0 is no
    linear correlation, and \-1 is a total negative linear correlation. It should
    be noted that PPMCC does not reflect anything about the non-linear relationship.
    In a pair of features, the two can be correlated in one of the following ways:
    1. Positive Correlation: When both the features move in tandem, i.e., in the same
    direction of change, they are both positively correlated. The linear relationship
    between them is such that if one increases, the other increases too, and vice  versa.
    The coefficient’s value indicates the degree to which one of the features changes
    in value relative to the other in the pair. For a positive correlation, the coefficient
    is greater than zero. 2. Negative Correlation: In this case, both features move
    in tandem as well, albeit in opposite directions. When one increases, the other
    decreases, and hence it is also known as inverse correlation . A coefficient value
    of less than zero represents a negative correlation between the feature pair.
    3. No Correlation: A coefficient of zero indicates that there exists no linear
    relationship between the features. An increase or decrease in one of them does
    not affect the other, and hence the two are unrelated features. 3•  Feature Imputation
    There is no denying the fact that the data available for modeling, especially
    from real-world sources, is noisy by nature. Missing values of attributes (or
    features) are prevalent forms of noise. These missing values introduce a substantial
    amount of bias and lead to complicated data analysis. Hence, we attempt to fill
    in the data gaps before we proceed with analysis or modeling. This process of
    replacing missing values with their substitutes to achieve a sense of completeness
    in the data is known as Feature Imputation . The missing values are often encoded
    as none , null , blank , not a number (NaN) , or some predefined placeholder.
    As discussed, these missing values dramatically affect the data quality and thwart
    the model’s performance. One might believe that eliminating the records with missing
    values would be the easiest way out. However, it leads to the loss of valuable
    information and also reduces the volume of the dataset. A sophisticated strategy
    would be to fill in the cracks using estimation techniques such that it does not
    disturb the inherent  data representation or distribution. Before we proceed to
    talk about the different imputation techniques, it is worthwhile to put forward
    the three types of missing values: 1. Missing Completely At Random (MCAR): There
    is no discernable pattern in an attribute’s missing values. Neither the missing
    values are related to some other attribute in the dataset. The probability of
    missing a particular data point is the same throughout the dataset, or to say,
    the absence of values is entirely random. An example would be a user forgetting
    to mention the size purchased while reviewing a product. 2. Missing At Random
    (MAR): The missing values have a pattern or relate to other observed attributes’
    values. The probability of missing a particular data point is the same only within
    groups defined by the non-missing or observed data. For example, it is highly
    probable for women users to skip adding body weight in a product review or their
    profile compared to their male counterparts. 3. Missing Not At Random (MNAR):
    The probability of missing a particular data point can not be determined or remains
    unknown. It is one of the most complex of all since it could be due to an external
    glitch or be time-sensitive in nature. Consider a technical error that led to
    the user rating field not rendering in the UI. For that reason, all the product
    reviews had no ratings associated with them for quite some time. These chunks
    of missing values, all belonging to a particular product or gathered in the same
    week perhaps, can not be attributed as random missing data. Now let us discuss
    some imputation techniques to improve the quality of input data: • Statistical
    Imputation: This method involves computing  statistical measures like the mean
    or the median of the observed values and then using these to substitute the missing
    values. It is essential to compute these statistical measures separately for each
    attribute since the values’ scales or ranges might differ. Though it is a straightforward
    and clean way to impute missing values, it can only be used for numerical data.
    It gives poor results when used on categorical or binary features values for obvious
    reasons. Since it does not take into account data correlation, it does not lead
    to high accuracy imputation. Another variation of this technique is to use the
    most frequently occurring value to substitute. This trick works better for categorical
    features though it introduces a bias in the data and disrupts data distribution.
    For numerical data, this can also be done by simply substituting with a zero or
    a predefined constant value, which might or might not be the most-frequent occurring.
    • Hot-Deck Imputation: This is a common imputation method that randomly selects
    a similar data record closest to the current record and replaces the missing values
    with the observed values in the selected record. • Cold-Deck Imputation: This
    method uses an entirely different dataset closest to the current one in essence
    and uses its attributes to fill in the missing values. This method is not at all
    preferred since it leads to erroneous results. • Regression Imputation: A regression
    model is deployed treating the attribute with missing values as target variables
    and remaining attributes as features. Using the non-missing values for training,
    we can use the predicted values to fill in the gaps. This method has an added
    advantage over statistical imputation since it considers feature correlation.
    The simple regression method tries to follow the general trend and fits the best
    line but does not introduce an error term in the imputed values. For this reason,
    Stochastic Regression Imputation is used, which adds the average regression variance
    to the regression imputations to introduce error in the imputed value. •  k-Nearest
    Neighbours (k-NN) Imputation: This method uses the feature similarity concept
    to predict the missing values using the non-missing data records. It finds k nearest
    neighbors to the data record in consideration and imputes the value based on the
    k-NN methodology. It is usually more accurate than the statistical imputation
    technique but is computationally expensive. It also does not react well to data
    with outliers. • Deep Neural Network (DNN) Imputation: One of the most precise
    techniques, which works well for both categorical and numerical features, uses
    deep neural networks. A DNN is trained on non-missing values, and the predicted
    values are served as imputation values for missing attributes. It is very accurate
    compared to other techniques discussed above but can be computationally expensive
    for massive datasets. Despite discussing multiple imputation techniques, we can
    not determine the best one. Each methodology is suitably crafted for different
    requirements. Based on the use case, missing attributes’ data types, and the dataset
    in question, we often have to experiment until we find the best-suited strategy.
    4•  Feature Interaction Feature Interaction is an effective process that provides
    a quick way to engineer features on top of the existing ones. To understand this
    clearly, consider a dataset that primitively has only two features F1 and F2 .
    We can decompose the prediction function into the following terms: the bias, F1
    ’s coefficient, F2 ’s coefficient, and ( F1 x F2 ) ’s coefficient. The last one
    represents the interaction quotient between the two features. The interaction
    between two features can be defined as the change in the prediction function’s
    result by varying the features after considering the individual feature effects.
    If the prediction function can be decomposed as the aggregate of the two individual
    features, we can assume the interaction between  them to be null . The concept
    can be generalized to a dataset with n different features, where the interaction
    could occur between all n features or less. In such cases, we can produce n C
    2 interaction features of degree 2 , n C 3 interaction features of degree 3 ,
    and so on. Though this process helps generate more features in the dataset with
    low effort, we have to choose the maximum degree of interaction carefully. A higher
    degree of interaction would probably lead to significantly more features, which
    could lead to overfitting of the model if the data is not enough, viz. the curse
    of dimensionality . Friedman’s H-Statistic is a popular measure to compute the
    strength of the interaction. This statistic is essentially dimensionless and typically
    takes on values between 0 to 1 . Friedman’s H-Statistic value of 0 signifies that
    the interaction term has no predictive power, whereas value of 1 means the interaction
    term is solely responsible for predicting. Having a value greater than one is
    also possible and very difficult to interpret. It happens when the interaction
    term’s variance is much larger than the variance of the two features’ individual
    effects. We can use Friedman’s H-Statistic to our advantage by employing it to
    avoid the curse of dimensionality. To craftily select features from a large set,
    we can pick only the ones with high impact interaction levels and drop the ones
    below a threshold. However, calculating Friedman’s H-Statistic is a computationally
    expensive process since it involves estimating individual features’ marginal distributions
    without the interaction term. Since these estimates come with their variance as
    well, the results are highly unstable. Furthermore, this statistic methodology
    functions well under the assumption that the features can all be shuffled independently,
    or there is no correlation. Thus in the case where the correlation coefficient
    is high, the assumption gets violated, and Friedman’s H-Statistic  leads to invalid
    results. It is worth noting that this technique does not gel well with pixels
    as inputs, so we should avoid this in problems involving images as data. Alternatives
    to Friedman’s H-Statistic for quantifying feature interactions include Variable
    Interaction Networks (VIN) and Greenwell Partial Dependence Functions . 5•  Feature
    Visualization So far, it is crystal clear that features play an influential part
    in Machine Learning model’s performance. Thus, it is valuable to comprehend how
    input features influence the model’s outcome to enhance model interpretability
    and guide future iterations for model improvement and scaling. Computing feature
    importances and interaction scores help identify crucial features; however, if
    we want to dive deeper into how those features impact the model outcomes, we can
    use visualization methodologies. Feature Visualization is an approach that we
    apply to emphasize the learning path of features in a model and make it more interpretable.
    Feature Visualization techniques are typically used with neural networks to understand
    their working better. Deep Neural Networks (DNNs) are known to have the ability
    to learn high-level features in the hidden layers, which reduces the feature engineering
    load quite a lot. However, their opacity reduces the model’s explainability. The
    numerous transformations in that black box of hidden layers are a secret until
    we get an output. Thus, feature visualization aims to discover key inputs that
    relate to specific outcomes and visually inspect them. For a unit of a DNN, feature
    visualization can be performed by detecting the input that maximizes the activation
    of a unit. The unit could be a neuron, a complete layer, or even the final prediction.
    There could be millions of neurons in a DNN; therefore, visualizing for each one
    of them is cumbersome and  a time-consuming process. To optimize that, we instead
    use bigger units for visualization, for instance, activation maps. In specific
    cases, like Convolutional Neural Networks (CNNs or ConvNets) , which are majorly
    used in image recognition tasks, the unit could even refer to a feature map extracted
    from the raw image. After training the ConvNet, we can feed it specific images
    to predict and visualize the feature mapping’s heatmap. The heatmap might indicate
    what type of features each particular unit is learning, thus providing more insights
    into the network’s decision. ![](Image00040.jpg)A visualization of a 5x5 filter
    convolving around a 16x16 input and producing a 12x12 activation (or feature)
    map. Another exciting way to visualize the features, specifically the ones that
    improve the neural network’s predictive performance, is to introduce an attention
    layer in the network. The idea is similar to computing importance scores of the
    features. However, unlike feature importance ranking, which generically ranks
    the features for the entire prediction task, the attention layer captures the
    contextual importance. Essentially, attention layers highlight (or give more weight)
    to the features that would positively influence a particular output’s prediction.
    By further visualizing the outputs of these attention layers, we better understand
    the neural network’s working. The addition of attention layers has proven useful
    for Recurrent Neural Networks (RNNs) the most. The structure of RNNs allows it
    to capture temporal dynamic context for tasks like speech recognition. The  attention
    layers help it focus on storing the essential parts, thus improving its performance.
    ![](Image00041.jpg)Based on a sequence-to-sequence model for Spanish to English
    translation, this heat map shows which parts of the input sentence have the model’s
    attention while translating. There is currently active research in the domain
    of neural feature visualization with various optimization and attribution objectives.
    It has become one of the most promising techniques for understanding neuron interactions,
    activation mechanisms, thus enhancing interpretability. As a stand-alone process,
    it might not yield satisfactory explanations; however, if used as a building block
    synergistically with other model interpretability tools, it empowers humans to
    uncover these complex networks’ functioning. 6•   Feature Automation So far, we
    discussed varied processes involved in engineering features for a model to improve
    its performance and interpretability. This study has made it clear that typically
    feature engineering is a drawn-out manual affair. It relies heavily on domain
    knowledge, intuitive exploration, data analysis, and manipulation. With multiple
    such components, this process can be too cumbersome and time-consuming, despite
    which the eventual feature set is limited by individual subjectivity, imagination,
    and time. We can overcome this manual process by opting for automated feature
    engineering techniques to accelerate feature generation and experimentation. Feature
    Automation is a technique that generates all the possible candidate features from
    the given dataset from which the best could be filtered out and used for model
    training. The automatically generated feature set might be huge and not always
    optimal, but it provides us with an input feature set that generates good baseline
    metrics. Using domain knowledge, intuitive exploration, and the techniques discussed
    in this chapter for feature selection, we can improve this feature set further.
    As the volume of datasets increase, it is becoming crucial to extract as much
    information as possible to create an effective solution. In one of their well-liked
    articles titled A Few Useful Things to Know about Machine Learning , Pedro Domingos
    has stated an exciting take on feature automation: “One of the holy grails of
    machine learning is to automate more and more of the feature engineering process.”
    A popular tool in use these days for feature automation is Featuretools . It is
    an open-source Python framework that automatically creates features, even from
    temporal and relational datasets. It works on the principle of Deep Feature Synthesis
    (DFS) that stacks the primitives on the feature directly  extracted from the dataset
    to fabricate complex ones. Primitives can be considered the fundamental units
    of Featuretools, defined as the individual computations that can be applied singularly
    or in conjugation with others. Examples of primitives could be aggregates like
    mean, sum, average, or transforms. Applying combined primitives leads to a more
    descriptive feature. These descriptive features have more ‘depth ’, which increases
    each time we clamp an additional primitive. These complex descriptive features
    have proven to extract intricate patterns from the data more effectively and assist
    in model training. Despite being recently developed, automated feature engineering
    is gaining much traction these days. It has helped improve the standard error-prone
    workflow by cutting down the time spent on brainstorming and experimentation,
    delivering interpretable feature sets, and fixing data leakage issues up to quite
    an extent by filtering time-dependent data. Despite still being developed, this
    methodology is already providing significant gains, thus enabling Machine Learning
    modelers in multiple domains to use the baked-in knowledge regarding the data
    without expending a sizable quota of time, effort, and money. '
  fmt: "\n# Stemming\n\nStemming is a crude method for cataloging words related to\
    \ each other and is usually done by chopping off from the end until we reach the\
    \ word’s stem. For example, stemming the following words: ‘fit ’, ‘fitter ’, ‘fitted\
    \ ’, ‘fitting ’, ‘fittable ’, ‘fittest ’ to their stem word ‘fit ’ helps convey\
    \ almost the same meaning but with a reduced vocabulary. Though this chopping\
    \ off approach works well in many cases, it leads to many exceptions, especially\
    \ in a language like English. For this, we have other sophisticated techniques\
    \ like `Porter Algorithm`, `Snowball Algorithm`, and so on.\n\n# Lemmatization\n\
    \nWe can continue with the above process of shrinking the vocabulary size by reducing\
    \ the derived words to their base form, where the base form is the word’s morphological\
    \ root, a process known as **Lemmatization**. Lemmatization looks beyond just\
    \ chopping off the word and relies on the lexical meaning to obtain the correct\
    \ base form, thus giving a much more informative view. For example, lemmatization\
    \ would reduce the following words ‘be ’, ‘been ’, ‘being ’, ‘was ’ with its lemma,\
    \ i.e., ‘be ’.\n\n# N-grams\n\nWe can count the occurrences of a sequence of words\
    \ rather than individual words. This technique is more useful than counting individual\
    \ words since the meaning of a word depends heavily on the context in which it\
    \ is being used. In statistical language models, a sequence of n words is called\
    \ an **n-gram**. N-grams find their applications in areas like auto-completion\
    \ of sentences and spell-check. The above count-based approaches help generate\
    \ a sturdy embedding for text vectorization; however, they do not capture the\
    \ text’s exact semantic meaning with utmost sophistication. Hence, it is worthwhile\
    \ to explore advanced techniques using `Recurrent Neural Networks (RNN)` to fabricate\
    \ complex contextual text embeddings.\n\n# Image Vectorization\n\nPlaying around\
    \ with images, we start to see individual pixels (as below) when we zoom in on\
    \ an image. These pixels are nothing but individual elements of a picture, a basic\
    \ unit of programmable color for a digital image. Hence, an image represents pixels\
    \ in a grid form, each having its color.\n\n![](Image00029.jpg)\n\nAs we zoom\
    \ in on the image, we begin to see the individual pixels. In the rainbow world,\
    \ each pixel gets its color through a combination of the three primary colors:\
    \ Red (R), Green (G), and Blue (B). Therefore, in mathematical terms, each pixel\
    \ in the image can be represented by three different numbers, indicating each\
    \ of RGB pigments’ intensity with 256 levels each. For example, a crimson pixel\
    \ can be represented as `RGB(220,20,60)`.\n\nWe can apply the above knowledge\
    \ to convert a pixel-based image into a vector-based image containing only numbers\
    \ for the model to comprehend. A high-resolution colored PNG image of dimensions\
    \ say `1028*768 px` can be an input to the model as a 3-dimensional vector of\
    \ size `1028*768*3`. For a grayscale image, we can represent each pixel with a\
    \ single value, indicating the white color intensity. `0` denotes black pixel\
    \ value, `255` denotes white, and the numbers between denoting different gray\
    \ shades. The grayscale image can thus be vectorized as a 2-dimensional vector\
    \ of size `1028*768` instead. This pixel-based approach is one of the most straightforward\
    \ techniques to vectorize an image. There are other ways like `Color Histogram\
    \ Vectorization` that we could experiment with depending on the use case and our\
    \ problem’s complexity.\n\n# Categorical Vectorization\n\nWhen we look into the\
    \ Clothing Fit dataset’s product sizing column, we observe that the values always\
    \ belong to a specific set, viz. `XXS`, `XS`, `S`, `M`, `L`, `XL`, and `XXL`.\
    \ We would need to vectorize these categories and encode them as numeric values\
    \ before feeding it to a model. Let us talk about the different ways we can encode\
    \ this categorical column of our dataset.\n\n## Integer Encoding\n\nOne of the\
    \ easiest methods would be to assign each category (or product size in this case)\
    \ a unique numeric value, something as below.\n\n![](Image00030.jpg)\n\nThe integer\
    \ assignments follow a natural ordering similar to their corresponding sizes.\
    \ This encoding aids the model to understand that size `XXS` is close to `S` compared\
    \ to size `XL` (since `1` is closer to `3` than `6`). One fine print with this\
    \ method is that it only works when there is a natural ordering between the categorical\
    \ values. If we have an encoding like `{S:1, M:2, L:3, XS:4, XL:5, XXS:6, XXL:7}`,\
    \ it might not work. Hence, it is essential to wisely encode categorical values,\
    \ as incorrect assignments could lead to unexpected results.\n\n## One-Hot Encoding\n\
    \nFor categorical features, where no ordinal relationship exists, the above-defined\
    \ Integer Encoding might be overkill or not work at all. In situations like these,\
    \ we use a widely popular and creative way to encode the categories in a binary\
    \ form called the **One-Hot Encoding**. It represents each value as a binary vector\
    \ of a size equivalent to the number of possible categorical values. Only the\
    \ value assumed in the respective data records is turned on or assigned `1`, and\
    \ the rest are turned off or assigned `0`. For example, if all the product sizes\
    \ are `{XXS, XS, S, M, L, XL, XXL}`, then we can do the encoding of the different\
    \ product sizes like the following:\n\n![](Image00031.jpg)\n\nThis way of encoding\
    \ could be easily adapted to new possible inputs. For example, let us say ModCloth\
    \ introduces new product sizes as `PS`, `PM`, and `PL` for petite body types.\
    \ In this case, we can extend the existing vectors by appending three additional\
    \ zeros and introduce encodings for the new sizes by using these additional 3\
    \ bits, which looks something like the following:\n\n![](Image00032.jpg)\n\n#\
    \ Normalization\n\nRecall the example of the World Cities dataset we discussed\
    \ in the previous chapter, which had an attribute indicating each city’s population.\
    \ Logically, the values in this column could range anything in between `1` (Monowi,\
    \ Nebraska boasts of having only a single resident! Unbelievable, right?) to a\
    \ couple of millions. Training on this dataset could lead to getting stuck with\
    \ `NaNs` as the gradient update becomes too large to handle owing to the vast\
    \ range in values. Now consider the average age of the population as an attribute.\
    \ The values of this column would mainly lie between `0` and `100`. This range\
    \ is quite different from that of the population. Training a Machine Learning\
    \ model with these two attributes in the dataset would make the gradient bounce\
    \ rapidly because of the two different scales, thus slowing down the convergence\
    \ process. Many times, optimizers like `AdaGrad` or `Adam` are used to guard against\
    \ this problem by creating a different learning rate per feature. However, optimizers\
    \ may not always save us from all problems, especially when each feature has a\
    \ wide range of values. To combat the above problems, we should transform the\
    \ values of the features belonging to varied scales and bring them on a similar\
    \ scale without changing their original behavior, a process referred to as **Normalization**.\
    \ In more complex scenarios, normalization also refers to sophisticated adjustments\
    \ to shepherd the entire probability distributions of adjusted values into alignment.\
    \ Normalization helps improve the numeric stability of the model by aiding the\
    \ gradient to ascent (or descent) with a decent speed rather than taking too large\
    \ (thus bouncing back and forth) or too small (thus never converging) jumps. This\
    \ behavior further helps in speeding up the training speed of the model. There\
    \ are multiple ways to calibrate the feature distributions; let us discuss the\
    \ four most common ones.\n\n## Feature Clipping\n\nIf we plot the population of\
    \ all the cities in the world from the World Cities dataset, we would observe\
    \ the graph has long tails on both sides probably. The cities with significantly\
    \ less population (imagine the number of cities with only a single resident or\
    \ less than ten even!) and those with a vast population would practically be outliers.\
    \ In such cases, we can set a minimum and maximum population (say set a range\
    \ from `2,000` to `20,000,000`) and clip the outliers. We set values less than\
    \ the minimum to the minimum value and values greater than the maximum to the\
    \ maximum value. This technique is called **Feature Clipping**.\n\n![](Image00033.jpg)\n\
    \nA probability density plot of the population of different cities. Conceptually,\
    \ the extremes ends can be clipped off. A sophisticated way to find the minimum\
    \ and maximum of the feature values is to use the measure of standard deviation,\
    \ for example, clipping the values beyond the range of `(-nσ, +nσ)`. Feature Clipping\
    \ is a simple yet effective way of normalizing the data. The most significant\
    \ advantage is that it can be applied before or after other normalization techniques.\n\
    \n## Range Scaling\n\nConsider the age feature in the World Cities dataset that\
    \ can have a definite range from `0` to `100` years after clipping. Each age value\
    \ has a substantial number of people. We can fix the upper, and the lower bounds\
    \ of the feature distribution as the probability of outliers is low (only `0.0173%`\
    \ of Americans live to `100`!). In such cases, Range Scaling is an effective way\
    \ of normalization. This technique mutates the feature values from their existing\
    \ range, here `[0, 100]`, to a standard range, which is usually `[0, 1]` or `[-1,\
    \ 1]`. This approach is also known as the **Min-Max Scaling** because of the way\
    \ we transform the ranges. The following defines the formula to rescale to a range\
    \ of `[0, 1]`, where `x’` represents the transformed value, and `x` is the feature’s\
    \ original value. `min(x)` and `max(x)` represent the lower and the upper bounds\
    \ of the original range.\n\n![](Image00034.jpg)\n\nThe following is a generalized\
    \ formula that can be used to rescale to an arbitrary range `[p, q]`:\n\n![](Image00035.jpg)\n\
    \n## Log Scaling\n\nObserve the number of languages spoken feature in the World\
    \ Cities dataset; we see that it follows a **power-law distribution**. To put\
    \ it in simpler words, a handful of languages cover most cities, while the rest\
    \ cover only the remaining few. Though this distribution represents the data accurately,\
    \ it does not gel well with the model training process. To work with skewed distributions\
    \ like these, we use **Log Scaling**, which transforms the distribution into a\
    \ normal distribution. Log Scaling narrows down the original range of the feature\
    \ values by performing a log transform over all the values, something like below\
    \ (where `x` is the original value and `x’` is the transformed value):\n\n![](Image00036.jpg)\n\
    \nLog Scaling compresses a wide range to a narrow range and reduces the variability\
    \ of the data generically. This transformation helps in improving the performance\
    \ of the learning algorithm. The outliers might cause the log-transformed distributions\
    \ to be still a bit skewed and not entirely normal. However, they are closer to\
    \ being normally distributed as compared to the original distribution.\n\n![](Image00037.jpg)\n\
    \nA probability density plot of the number of languages spoken in different cities\
    \ (left). Noticeably, the plot with log scaling (right) helps in reducing the\
    \ skewness of data.\n\n## Z-Score Scaling\n\nWhen a feature value distribution\
    \ contains only a few outliers where feature clipping might not yield drastic\
    \ changes, we tend to use the **Z-Score Scaling** technique. This normalization\
    \ method transforms the data by converting the values to a common scale with a\
    \ mean value of `0` and a standard deviation value of `1`. In statistics, **Z-Score**\
    \ is a metric that quantifies a value’s relationship to the mean (`μ`) of the\
    \ entire group in terms of the number of standard deviations (`σ`). For instance,\
    \ if the value is equal to the mean of the group, Z-Score would be `0`. The following\
    \ is used to compute the transformed value (or the Z-Score) denoted by `x’` from\
    \ the original value `x`:\n\n![](Image00038.jpg)\n\nThe above described the four\
    \ widely popular techniques to normalize the data. However, it is up to us to\
    \ choose the appropriate approach based on the use case, learning algorithm, and\
    \ data distribution. Regardless of the technique we use, our data should have\
    \ the following characteristics for the model to perform well:\n\n- **Slender\
    \ Range**: This indicates that the range of the feature values should be barely\
    \ sufficient to accurately represent the distribution. As a standard, many data\
    \ practitioners like to rescale feature values in the range `[0,1]` or `[-1,1]`.\n\
    - **Homogeneity**: This requires different feature columns in the dataset to follow\
    \ near-calibrated ranges or lie in similar feature value ranges.\n\n# Bucketization\n\
    \nWhen a dataset constitutes observations from a survey or an experiment, it ought\
    \ to have some discrepancies. Hence to reduce the effects of those minor observation\
    \ errors, we use a technique called **Bucketization**. This approach involves\
    \ replacing the original values with the value of the respective bin. Mapping\
    \ of feature values to bins can be done by defining small intervals on a continuous\
    \ scale (based on some thresholds), and the process is called **Data Binning**.\
    \ Aggregating numeric values is associated with loss of information at times;\
    \ however, it reduces the amount of data to be processed. It thereby eases the\
    \ model’s training without any drastic performance changes. It also reduces the\
    \ impact of noise, for example, in Image Processing problems.\n\n## Symmetric\
    \ Bucketization\n\nIn this approach of **Symmetric Bucketization**, we divide\
    \ the entire feature value range into equal-sized intervals. The thresholds are\
    \ identically spaced, with fixed boundaries for each interval. This type of binning\
    \ is useful when the feature values are uniformly distributed across the entire\
    \ range. However, suppose the feature values are not uniformly distributed. In\
    \ that case, certain buckets might have an extremely high number of points, and\
    \ others may have very few or even none, thus leading to an imbalance. Therefore,\
    \ it is essential to ensure the uniform distributions of the feature values before\
    \ applying this technique as it might hinder the learning.\n\n## Quantile Bucketization\n\
    \n**Quantile Bucketization** aims to cover the shortcomings of the above-defined\
    \ Symmetric Bucketization. It smartly creates buckets, or bins, having an equal\
    \ number of points within them. In statistics, quantiles are cut points that divide\
    \ the entire distribution into groups such that they contain the same fraction\
    \ of the total population. Based on this concept, the thresholds are not equally-spaced\
    \ through the whole range of the feature values. Instead, they are governed by\
    \ the number of data points lying between any two, which should be equal for all.\
    \ By this logic, there would be more bins (with smaller size) in the area with\
    \ higher data density, and less bins (with larger size) in the areas where data\
    \ is more spread out. Therefore, Quantile Bucketization is preferred when the\
    \ data distribution is skewed since it is adaptive and mimics the original distribution\
    \ closely.\n\n![](Image00039.jpg)\n\nA side-by-side comparison of the symmetric\
    \ and quantile style of binning.\n\n# Feature Engineering\n\nAfter data preprocessing,\
    \ we can use the data to train a Machine Learning model and deploy it in production\
    \ to work on unseen data. This simple model has the obvious set of features, usually\
    \ mirroring the dataset’s attributes, and could perform reasonably well in addressing\
    \ the problem at hand. To further improve the model’s performance, we have two\
    \ choices:\n\n1.  **Model Iteration**: One approach is to iterate on building\
    \ sophisticated Machine Learning models, for instance, by increasing the number\
    \ of hidden layers in a neural network or taking an ensemble of different types\
    \ of models with the hope to learn more effectively. Using multiple Machine Learning\
    \ models in conjugation to obtain better predictive performance is referred to\
    \ as **Ensemble Learning**. This action plan might yield the desired results;\
    \ however, it requires much time and effort to develop and comes with a risk of\
    \ not working entirely despite all the efforts. It also necessitates a larger\
    \ volume of training data that comes with another risk of models not scaling to\
    \ production traffic.\n2.  **Feature Iteration**: The other course of action is\
    \ to engineer new and better features. The features mirror the structure of the\
    \ data, which are identifiable even by the sub-optimal models. Thus, having a\
    \ better representation of data influences the predictive models’ performance.\
    \ The process of **Feature Engineering** identifies features that might provide\
    \ additional signals to our existing model to improve its performance. Constructing\
    \ features is an exciting aspect where all the intuition, creativity, and black\
    \ art happens. Andrew Ng says that “Coming up with features is difficult, time-consuming,\
    \ and requires expert knowledge. Applied machine learning is basically feature\
    \ engineering in itself”. With this approach, we can keep the simple model in\
    \ production, which further reduces the risk of failure in terms of scalability\
    \ and performance.\n\nAs we start our journey to address a real-world problem\
    \ with Machine Learning, it makes sense to aim for low hanging fruits. Weighing\
    \ the pros and cons of the two approaches, we should first focus on engineering\
    \ better features to quickly boost the performance before moving on to more challenging\
    \ and risky tasks. With innovative features in our basket, we can avert from using\
    \ complex ensemble learning techniques or spend eternities searching for the best\
    \ model parameters, a process known as **Hyperparameter Tuning**. Furthermore,\
    \ experimenting with new features improves our understanding of how the model\
    \ reacts to new information and addresses our problem more aptly. However, this\
    \ only works within a limit until we have explored all possibilities. We would\
    \ not like to go overboard with ‘feature over-engineering’, thus ending up with\
    \ unwieldy dimensions (which we shall discuss later in this chapter).\n\n## What\
    \ is not Feature Engineering?\n\nBefore we dive deep into the different subtasks\
    \ of Feature Engineering, which will help us in creating an exhaustive list of\
    \ features for model training, it is necessary to paint a clearer picture by pausing\
    \ and highlighting what is not feature engineering:\n\n-   It does not include\
    \ identifying the data signals present in the dataset while gathering data from\
    \ a source.\n-   It does not subsume spotting the target variable or the label\
    \ of each data record in the train or test set.\n-   It does not cover the process\
    \ of data cleansing, with tasks like removing punctuations and stop words or curating\
    \ word embeddings.\n-   It also does not encompass processing the data by scaling\
    \ the values to a particular range, normalizing the values, encoding categorical\
    \ values, and so on.\n\n## The Iterative Process\n\nUnderstanding the process\
    \ of feature engineering as an applied Machine Learning task highlights that it\
    \ does not stand-alone. It is an iterative process with a well-defined problem\
    \ that oscillates between feature ideation and model evaluation till we hit a\
    \ plateau. Once that happens, we can then play around with complex model architecture\
    \ or hyperparameter tuning. The step-by-step process followed in a formal setting\
    \ for feature engineering usually looks like this:\n\n1.  Understanding the problem\
    \ statement and the domain to brainstorm ideas for new features by analyzing recent\
    \ trends and discussing with experts.\n2.  Extracting the feature values for offline\
    \ statistical analysis after some transformations.\n3.  Training the existing\
    \ model on data including new features and analyzing the model performance metrics.\n\
    4.  In case the feature does not give a performance boost, we can try different\
    \ transformation ideas or simply go back to brainstorming other features. Otherwise,\
    \ we further work on getting the feature productionized, thereby integrating it\
    \ with the model serving pipeline. For more context, model serving is an approach\
    \ of exposing the trained model as an endpoint to which we simply feed our data\
    \ and get prediction results.\n\n## Feature Types\n\nModern Machine Learning models\
    \ are data-hungry, but the fundamental aspect is feeding the data in the right\
    \ format. Passing on raw features in the data might make the model training slower.\
    \ They impede the generalization power of the model and impact the performance\
    \ negatively. It is essential to understand that the features’ data type significantly\
    \ influences the processing approach. Following we give a brief overview of the\
    \ four types of commonly used features:\n\n1.  **Continuous Features**: A continuous\
    \ feature can assume any real number, including floats. There is no definite boundary\
    \ between any two feature values, i.e., there could be infinitely many possible\
    \ values lying between those two. These feature values are essentially numeric\
    \ and hence can be performed mathematical operations on. For example, the products\
    \ on ModCloth have prices like `US$14.99`, `US$25.00`, `US$99.99`, and so on.\
    \ Moreover, there is no strict distinction between partitions (unlike other types\
    \ we shall study below), i.e., a product could even be listed for `US$15.10`,\
    \ and that would work too!\n2.  **Binary Features**: These are one of the simplest\
    \ types of features and can only have one of the two possible values: `1` or `0`,\
    \ `true` or `false`, `on` or `off`, `yes` or `no`, and so on. These kinds of dichotomous\
    \ features are easy to experiment with, as they do not require fancy transformations.\
    \ For instance, we can denote if a user on ModCloth is verified or not verified.\
    \ A potential scenario would be that the model learns to assign more weight to\
    \ reviews of verified users than their counterparts.\n3.  **String Features**:\
    \ The values of a string feature can assume any block of text, be it alphabets,\
    \ symbols, or emojis. As we discussed previously, these string features need processing\
    \ and should be converted to a vector of numeric values. The obvious example of\
    \ this would be the review text of any product as left by the user, like “I love\
    \ this dress, it is my favorite. The size first me perfectly and flatters my curves!”\n\
    4.  **Discrete Features**: These features are also commonly referred to as **Categorical\
    \ Features**. The discrete feature values can assume only one of the N possible\
    \ values and have definite boundaries between them. In simpler terms, there could\
    \ be no other value in between the pre-defined N values to which they can be assigned.\
    \ A point to be noted is that there should be a minimum of 3 categories and can\
    \ extend to infinity. They can further be of two types:\n    -   **Nominal Categorical\
    \ Features**: These features’ values have no relationship with each other and\
    \ do not follow any specific order. For instance, encoding the types of jackets\
    \ like `{bomber:1, biker:2, trucker:3, denim:4, track:5, parka:6}` is a great\
    \ example where the discrete values are independent of each other.\n    -   **Ordinal\
    \ Categorical Features**: The values of these categorical features have an order\
    \ to them. An example would be encoding product sizing as `{XXS:1, XS:2, S:3,\
    \ M:4, L:5, XL:6, XXL:7}` where the discrete values follow the same order as that\
    \ of the product sizing, i.e., `S<M` following `3<4` and so on.\n\n## Features\
    \ versus Worthy Features\n\nAssembling meaningful features worthy enough to contribute\
    \ significant predictive power to a learning algorithm requires much effort and\
    \ time. Before we dive into the different techniques like Feature Extraction,\
    \ Feature Selection, and so on in the upcoming sections, it is necessary to understand\
    \ the distinction between features and worthy features. The following pointers\
    \ might help:\n\n-   We should avoid discrete features that rarely occur in the\
    \ dataset. As a rule of thumb, we can say that a good feature value has an appearance\
    \ rate of at least `1%`. Checking the distribution of feature values enables a\
    \ model to learn the relationship between the feature and the label. Conversely,\
    \ a rare feature adds no significant value, and the model can not make any predictions\
    \ based on that feature. For instance, if there are only `0.05%` of the products\
    \ having the size `XXXS`, it is better to discard those examples.\n-   It is preferred\
    \ to have feature names such that they convey their meaning concisely. For example,\
    \ if we record a user’s body weight, a feature like `weight_lb` or `weight_kg`\
    \ makes much more sense than a feature named `weight`.\n-   While doing feature\
    \ engineering, it is essential to deal with discontinuities in the feature values\
    \ very carefully. A meaningful floating-point feature should not contain peculiar\
    \ out-of-range values. Take the ratings of a product; in that case, `user_rating=3.2`\
    \ makes sense while `user_rating=-0.5` does not. The best way to overcome it would\
    \ be to mark the valid values using a custom boolean flag, like `is_user_rating_defined`.\n\
    -   To maintain feature stability, we should avoid using mappings from an external\
    \ source as feature values. For example, it is better to have the feature `user_language=\
    \ ‘en’` and use this as an input to the model (after creating a vocabulary and\
    \ transforming it), rather than using an external source that maps ‘en’ to say\
    \ `8` and using `user_language=8` as an input to the model.\n\n# Feature Selection\n\
    \nAs we progress on solving complex problems, we try to build advanced models\
    \ and have informative features. And as the number of features increases, the\
    \ amount of data required for the model to be generalizable enough for good performance\
    \ also grows exponentially. This requirement increases the storage space and the\
    \ processing time for the model. In this sense, the value added by an additional\
    \ feature might become minuscule compared to the overhead it adds at some point.\
    \ This phenomenon is referred to as the **Curse of Dimensionality**. Even if we\
    \ have sufficient data to cater to the additional dimensionality to avoid overfitting\
    \ the model, extra features make the model heavier by requiring additional time\
    \ and resources for training and serving. Therefore it is always good to keep\
    \ a minimal feature space by retaining only the most impactful features. This\
    \ process of selecting a subset of relevant features for use in our model is called\
    \ **Feature Selection**. The key premise of opting for feature selection is that\
    \ the data contains many redundant or irrelevant features that can be discarded\
    \ without any information loss. Peter Norvig, a celebrated ML Scientist, has put\
    \ forward the power of data and features in a compelling way: “More data beats\
    \ clever algorithms, but better data beats more data.” Thus, feature selection\
    \ helps avoid the curse of dimensionality and paves the way for shorter training\
    \ and serving times, which ultimately translates to a better end-user experience.\
    \ The resultant models are easier to interpret and reason with. We could also\
    \ reason this idea with **Occam’s Razor** or **The Law of Parsimony**, that we\
    \ lose explainability when we have many features. By reducing the number of learnable\
    \ parameters, we can also observe a reduction in the model overfitting. On the\
    \ contrary, if the ratio of learnable parameters and the available data is high,\
    \ the models might memorize the training data, thus hurting its generalization\
    \ capability. The selection of optimum features can be divided into two phases:\
    \ a search technique that proposes new features and an evaluation measure that\
    \ gauges the usefulness of those features. Usually, there are three main categories\
    \ of feature selection algorithms:\n\n1.  **The filter method** uses a statistical\
    \ measure to score a feature and evaluate the relationship between the feature\
    \ and the label, like mutual information or correlation coefficient. Based on\
    \ the measure’s value, we filter out the features we need to select for our model.\n\
    2.  **The wrapper method** considers the selection of a set of features as a search\
    \ problem. Using the technique of **Recursive Feature Elimination (RFE)**, for\
    \ example, this method evaluates multiple models by adding or removing features\
    \ until we find an optimal combination that maximizes model performance.\n3. \
    \ **The embedded method** uses algorithms that have built-in feature selection\
    \ routines as part of the model’s learning. These algorithms select only those\
    \ features which contribute to the performance maximally. Some examples of such\
    \ algorithms are `LASSO Regression` and `Random Forest`.\n\nLet us go through\
    \ a handful of feature selection techniques commonly used in the industry and\
    \ academia that provide the best results in majority use cases.\n\n## LASSO Regression\
    \ Analysis\n\n**Least Absolute Shrinkage and Selection Operator (LASSO)** is a\
    \ regression analysis method that selects an optimal subset of features to increase\
    \ the model’s performance. It uses the **L1 Regularization**, which penalizes\
    \ the absolute values of the objective function’s coefficients, to restrict their\
    \ values to grow too large and overfit on the data. As a result, essential features’\
    \ coefficients increase in value, and irrelevant ones become zero to reduce the\
    \ coefficients’ absolute sum, automatically selecting essential features.\n\n\
    ## Principal Component Analysis\n\n**Principal Component Analysis (PCA)** is a\
    \ statistical approach that reduces dimensionality to increase the model’s interpretability\
    \ without incurring information loss. PCA transforms the data containing possibly\
    \ correlated features into data with linearly uncorrelated features (also called\
    \ **principal components**). The transformation is defined in such a way that\
    \ the first principal component captures the maximum possible variance. Each succeeding\
    \ component captures variance in decreasing order while maintaining no correlation\
    \ with other components. PCA is an adaptive data analysis technique that can be\
    \ easily tailored to various domains, data structures, and algorithms. It is instrumental\
    \ in fighting the curse of dimensionality by selecting only those features that\
    \ capture the maximum variance in the data.\n\n## Feature Importance Ranking\n\
    \n**Feature Importance Ranking** is a statistical approach of quantifying every\
    \ feature’s predictive power with respect to the label and ranking them based\
    \ on the relative importance score. As a general rule, features that positively\
    \ influence the model performance or have a high predictive power are considered\
    \ more important than the rest. Understanding the features’ contributions improves\
    \ model interpretability and explainability. Assessing real-world scenarios, we\
    \ often have a budget for the number of features that we can not exceed due to\
    \ scaling concerns. In such cases, it becomes essential to select the subset of\
    \ features, from all the possible ones, that would contribute the most in delivering\
    \ the best performance. Following are the three popular methods for computing\
    \ feature importance scores for the features, which can then be used for feature\
    \ selection:\n\n### Regression Analysis\n\n**Regression Analysis** is a statistical\
    \ approach to estimate the relationship between the features and the target variable.\
    \ Using the regression model’s parameters, we can identify which features have\
    \ a relatively high impact on predicting the target variable accurately. Apart\
    \ from crudely computing the importance of individual features, this method can\
    \ also reveal how the features interact with each other while predicting the target\
    \ variable or to say if there is a synergic effect. In cases where we only have\
    \ one feature, we can use a linear regression model to learn a straight line that\
    \ best approximates the data. For instance, consider `y = b + mx` where `y` is\
    \ the target variable, `x` is the feature, and `b` and `m` are constant terms\
    \ learned by the algorithm. In such cases, the value of `m` can quantify the strength\
    \ of the relationship between `y` and `x`. We can extend this concept to multiple\
    \ features, viz. `y = b + ∑mᵢxᵢ`, where the coefficient `mᵢ` of each feature `xᵢ`\
    \ represents the importance score of that feature in terms of its predictive power\
    \ assuming that features have been normalized. However, the linear regression\
    \ model is only useful when the feature and the target variable are linearly related.\
    \ A vital adage “correlation is not causation” should be kept in mind while performing\
    \ regression analysis since regression analysis can not effectively convey the\
    \ cause-and-effect relationship between the features and the target.\n\n### Decision\
    \ Trees\n\nAs a Machine Learning model, **Decision Trees** are sensitive to change\
    \ in data since the computation is ultimately a sequence of branching operations\
    \ based on comparisons of feature values with their respective thresholds. They\
    \ are susceptible to high variance in predicting the target variable with even\
    \ small data changes since they tend to overfit. For this reason, ensemble learning\
    \ methods like `Random Forest` are preferred as they construct multiple decision\
    \ trees on different splits of data, thus reducing the variance by averaging various\
    \ deep decision trees. `Random Forest` further reduces the variance by randomly\
    \ selecting subsets of features for each decision tree within. The relative rank\
    \ (or the depth) of a decision node in a tree can be used to assess the relative\
    \ importance of the feature associated with the node. Since features used towards\
    \ the top of the tree influence decisions for a larger fraction of the input samples,\
    \ they could be considered more critical. When we split the data into two parts\
    \ based on a feature value in the decision tree, the resulting splits are more\
    \ uniform and have less data impurity. The relative decrease in impurity combined\
    \ with the fraction of samples handled by the decision node can act as a normalized\
    \ estimate of that feature’s predictive power. By averaging the estimates of predictive\
    \ ability over several randomized trees, we can reduce the variance of such a\
    \ measure, commonly known as the **Mean Decrease in Impurity (MDI)**, and use\
    \ it for feature selection.\n\n### Permutation Testing\n\n**Permutation Feature\
    \ Importance** is a model-agnostic methodology of computing the relative importance\
    \ scores. The value is quantified as the decrease in a model’s performance metric\
    \ (accuracy, cross-entropy, etc.) when a single feature value is shuffled randomly.\
    \ Randomly shuffling the feature values (or dropping them altogether) disrupts\
    \ the relationship between that particular feature and the target value. The decrease\
    \ in the model performance can be attributed to that feature’s predictive power\
    \ and indicates how much the model depends on it. We repeat the process for every\
    \ feature and compare the differences in the model performance. Conceptually an\
    \ important feature leads to a more considerable decrease in model performance\
    \ than other less important ones. Permutation testing can be computationally costly,\
    \ especially if the feature set is substantially huge. However, it is preferable\
    \ over other model-specific techniques, like decision trees, as it can be applied\
    \ to any model and focuses on the performance measure of interest.\n\n# Feature\
    \ Correlation\n\nWhile discussing feature importance ranking techniques like regression\
    \ analysis, we mentioned how they helped understand the correlation between the\
    \ features and the target variables. Building on that concept, **Feature Correlation**\
    \ is a statistical approach to determine the correlation amongst the features\
    \ themselves. It establishes the statistical association between a feature pair\
    \ and the degree to which the input variables are linearly related. A feature\
    \ correlation study helps in understanding the data better. Features with high\
    \ correlation do not provide added signals to the model in predicting the target\
    \ variable. So, keeping only one of all the correlated features would minimally\
    \ impact the model performance. This aids feature selection and eventually reduces\
    \ the dimensionality of the feature space. Furthermore, a feature correlation\
    \ study can help in predicting the values of features that might be missing. For\
    \ instance, we can treat the feature whose value is missing as the target variable\
    \ and train a separate model to predict its value from the other correlated features.\
    \ This trick has been known to boost the model performance if the missing feature\
    \ is an important one. The numerical measure of correlation that determines the\
    \ strength of the input variables’ relationship is known as the **Correlation\
    \ Coefficient**. There are multiple ways of calculating correlation coefficients,\
    \ and the most popular one is **Pearson’s Product-Moment Correlation Coefficient\
    \ (PPMCC)**. It quantifies the linear correlation between the two features `X`\
    \ and `Y` as `ρ(X,Y) = cov(X,Y) ÷ σₓσᵧ` where `cov(X,Y)` is the covariance between\
    \ the two input variables and `σₓ`, `σᵧ` denote their standard deviations, respectively.\
    \ The value of PPMCC ranges between `+1` and `-1`, where `+1` is a total positive\
    \ linear correlation, `0` is no linear correlation, and `-1` is a total negative\
    \ linear correlation. It should be noted that PPMCC does not reflect anything\
    \ about the non-linear relationship. In a pair of features, the two can be correlated\
    \ in one of the following ways:\n\n1.  **Positive Correlation**: When both the\
    \ features move in tandem, i.e., in the same direction of change, they are both\
    \ positively correlated. The linear relationship between them is such that if\
    \ one increases, the other increases too, and vice versa. The coefficient’s value\
    \ indicates the degree to which one of the features changes in value relative\
    \ to the other in the pair. For a positive correlation, the coefficient is greater\
    \ than zero.\n2.  **Negative Correlation**: In this case, both features move in\
    \ tandem as well, albeit in opposite directions. When one increases, the other\
    \ decreases, and hence it is also known as **inverse correlation**. A coefficient\
    \ value of less than zero represents a negative correlation between the feature\
    \ pair.\n3.  **No Correlation**: A coefficient of zero indicates that there exists\
    \ no linear relationship between the features. An increase or decrease in one\
    \ of them does not affect the other, and hence the two are unrelated features.\n\
    \n# Feature Imputation\n\nThere is no denying the fact that the data available\
    \ for modeling, especially from real-world sources, is noisy by nature. Missing\
    \ values of attributes (or features) are prevalent forms of noise. These missing\
    \ values introduce a substantial amount of bias and lead to complicated data analysis.\
    \ Hence, we attempt to fill in the data gaps before we proceed with analysis or\
    \ modeling. This process of replacing missing values with their substitutes to\
    \ achieve a sense of completeness in the data is known as **Feature Imputation**.\
    \ The missing values are often encoded as `none`, `null`, `blank`, `not a number\
    \ (NaN)`, or some predefined placeholder. As discussed, these missing values dramatically\
    \ affect the data quality and thwart the model’s performance. One might believe\
    \ that eliminating the records with missing values would be the easiest way out.\
    \ However, it leads to the loss of valuable information and also reduces the volume\
    \ of the dataset. A sophisticated strategy would be to fill in the cracks using\
    \ estimation techniques such that it does not disturb the inherent data representation\
    \ or distribution. Before we proceed to talk about the different imputation techniques,\
    \ it is worthwhile to put forward the three types of missing values:\n\n1.  **Missing\
    \ Completely At Random (MCAR)**: There is no discernable pattern in an attribute’s\
    \ missing values. Neither the missing values are related to some other attribute\
    \ in the dataset. The probability of missing a particular data point is the same\
    \ throughout the dataset, or to say, the absence of values is entirely random.\
    \ An example would be a user forgetting to mention the size purchased while reviewing\
    \ a product.\n2.  **Missing At Random (MAR)**: The missing values have a pattern\
    \ or relate to other observed attributes’ values. The probability of missing a\
    \ particular data point is the same only within groups defined by the non-missing\
    \ or observed data. For example, it is highly probable for women users to skip\
    \ adding body weight in a product review or their profile compared to their male\
    \ counterparts.\n3.  **Missing Not At Random (MNAR)**: The probability of missing\
    \ a particular data point can not be determined or remains unknown. It is one\
    \ of the most complex of all since it could be due to an external glitch or be\
    \ time-sensitive in nature. Consider a technical error that led to the user rating\
    \ field not rendering in the UI. For that reason, all the product reviews had\
    \ no ratings associated with them for quite some time. These chunks of missing\
    \ values, all belonging to a particular product or gathered in the same week perhaps,\
    \ can not be attributed as random missing data.\n\nNow let us discuss some imputation\
    \ techniques to improve the quality of input data:\n\n-   **Statistical Imputation**:\
    \ This method involves computing statistical measures like the mean or the median\
    \ of the observed values and then using these to substitute the missing values.\
    \ It is essential to compute these statistical measures separately for each attribute\
    \ since the values’ scales or ranges might differ. Though it is a straightforward\
    \ and clean way to impute missing values, it can only be used for numerical data.\
    \ It gives poor results when used on categorical or binary features values for\
    \ obvious reasons. Since it does not take into account data correlation, it does\
    \ not lead to high accuracy imputation. Another variation of this technique is\
    \ to use the most frequently occurring value to substitute. This trick works better\
    \ for categorical features though it introduces a bias in the data and disrupts\
    \ data distribution. For numerical data, this can also be done by simply substituting\
    \ with a `0` or a predefined constant value, which might or might not be the most-frequent\
    \ occurring.\n-   **Hot-Deck Imputation**: This is a common imputation method\
    \ that randomly selects a similar data record closest to the current record and\
    \ replaces the missing values with the observed values in the selected record.\n\
    -   **Cold-Deck Imputation**: This method uses an entirely different dataset closest\
    \ to the current one in essence and uses its attributes to fill in the missing\
    \ values. This method is not at all preferred since it leads to erroneous results.\n\
    -   **Regression Imputation**: A regression model is deployed treating the attribute\
    \ with missing values as target variables and remaining attributes as features.\
    \ Using the non-missing values for training, we can use the predicted values to\
    \ fill in the gaps. This method has an added advantage over statistical imputation\
    \ since it considers feature correlation. The simple regression method tries to\
    \ follow the general trend and fits the best line but does not introduce an error\
    \ term in the imputed values. For this reason, **Stochastic Regression Imputation**\
    \ is used, which adds the average regression variance to the regression imputations\
    \ to introduce error in the imputed value.\n-   **k-Nearest Neighbours (k-NN)\
    \ Imputation**: This method uses the feature similarity concept to predict the\
    \ missing values using the non-missing data records. It finds `k` nearest neighbors\
    \ to the data record in consideration and imputes the value based on the `k-NN`\
    \ methodology. It is usually more accurate than the statistical imputation technique\
    \ but is computationally expensive. It also does not react well to data with outliers.\n\
    -   **Deep Neural Network (DNN) Imputation**: One of the most precise techniques,\
    \ which works well for both categorical and numerical features, uses deep neural\
    \ networks. A `DNN` is trained on non-missing values, and the predicted values\
    \ are served as imputation values for missing attributes. It is very accurate\
    \ compared to other techniques discussed above but can be computationally expensive\
    \ for massive datasets.\n\nDespite discussing multiple imputation techniques,\
    \ we can not determine the best one. Each methodology is suitably crafted for\
    \ different requirements. Based on the use case, missing attributes’ data types,\
    \ and the dataset in question, we often have to experiment until we find the best-suited\
    \ strategy.\n\n# Feature Interaction\n\n**Feature Interaction** is an effective\
    \ process that provides a quick way to engineer features on top of the existing\
    \ ones. To understand this clearly, consider a dataset that primitively has only\
    \ two features `F1` and `F2`. We can decompose the prediction function into the\
    \ following terms: the bias, `F1`’s coefficient, `F2`’s coefficient, and (`F1\
    \ x F2`)’s coefficient. The last one represents the interaction quotient between\
    \ the two features. The interaction between two features can be defined as the\
    \ change in the prediction function’s result by varying the features after considering\
    \ the individual feature effects. If the prediction function can be decomposed\
    \ as the aggregate of the two individual features, we can assume the interaction\
    \ between them to be null. The concept can be generalized to a dataset with `n`\
    \ different features, where the interaction could occur between all `n` features\
    \ or less. In such cases, we can produce `nC2` interaction features of degree\
    \ 2, `nC3` interaction features of degree 3, and so on. Though this process helps\
    \ generate more features in the dataset with low effort, we have to choose the\
    \ maximum degree of interaction carefully. A higher degree of interaction would\
    \ probably lead to significantly more features, which could lead to overfitting\
    \ of the model if the data is not enough, viz. the curse of dimensionality.\n\n\
    **Friedman’s H-Statistic** is a popular measure to compute the strength of the\
    \ interaction. This statistic is essentially dimensionless and typically takes\
    \ on values between `0` to `1`. Friedman’s H-Statistic value of `0` signifies\
    \ that the interaction term has no predictive power, whereas value of `1` means\
    \ the interaction term is solely responsible for predicting. Having a value greater\
    \ than one is also possible and very difficult to interpret. It happens when the\
    \ interaction term’s variance is much larger than the variance of the two features’\
    \ individual effects. We can use Friedman’s H-Statistic to our advantage by employing\
    \ it to avoid the curse of dimensionality. To craftily select features from a\
    \ large set, we can pick only the ones with high impact interaction levels and\
    \ drop the ones below a threshold. However, calculating Friedman’s H-Statistic\
    \ is a computationally expensive process since it involves estimating individual\
    \ features’ marginal distributions without the interaction term. Since these estimates\
    \ come with their variance as well, the results are highly unstable. Furthermore,\
    \ this statistic methodology functions well under the assumption that the features\
    \ can all be shuffled independently, or there is no correlation. Thus in the case\
    \ where the correlation coefficient is high, the assumption gets violated, and\
    \ Friedman’s H-Statistic leads to invalid results. It is worth noting that this\
    \ technique does not gel well with pixels as inputs, so we should avoid this in\
    \ problems involving images as data. Alternatives to Friedman’s H-Statistic for\
    \ quantifying feature interactions include **Variable Interaction Networks (VIN)**\
    \ and **Greenwell Partial Dependence Functions**.\n\n# Feature Visualization\n\
    \nSo far, it is crystal clear that features play an influential part in Machine\
    \ Learning model’s performance. Thus, it is valuable to comprehend how input features\
    \ influence the model’s outcome to enhance model interpretability and guide future\
    \ iterations for model improvement and scaling. Computing feature importances\
    \ and interaction scores help identify crucial features; however, if we want to\
    \ dive deeper into how those features impact the model outcomes, we can use visualization\
    \ methodologies. **Feature Visualization** is an approach that we apply to emphasize\
    \ the learning path of features in a model and make it more interpretable. Feature\
    \ Visualization techniques are typically used with neural networks to understand\
    \ their working better. **Deep Neural Networks (DNNs)** are known to have the\
    \ ability to learn high-level features in the hidden layers, which reduces the\
    \ feature engineering load quite a lot. However, their opacity reduces the model’s\
    \ explainability. The numerous transformations in that black box of hidden layers\
    \ are a secret until we get an output. Thus, feature visualization aims to discover\
    \ key inputs that relate to specific outcomes and visually inspect them. For a\
    \ unit of a `DNN`, feature visualization can be performed by detecting the input\
    \ that maximizes the activation of a unit. The unit could be a neuron, a complete\
    \ layer, or even the final prediction. There could be millions of neurons in a\
    \ `DNN`; therefore, visualizing for each one of them is cumbersome and a time-consuming\
    \ process. To optimize that, we instead use bigger units for visualization, for\
    \ instance, activation maps. In specific cases, like **Convolutional Neural Networks\
    \ (CNNs or ConvNets)**, which are majorly used in image recognition tasks, the\
    \ unit could even refer to a feature map extracted from the raw image. After training\
    \ the `ConvNet`, we can feed it specific images to predict and visualize the feature\
    \ mapping’s heatmap. The heatmap might indicate what type of features each particular\
    \ unit is learning, thus providing more insights into the network’s decision.\n\
    \n![](Image00040.jpg)\n\nA visualization of a `5x5` filter convolving around a\
    \ `16x16` input and producing a `12x12` activation (or feature) map.\n\nAnother\
    \ exciting way to visualize the features, specifically the ones that improve the\
    \ neural network’s predictive performance, is to introduce an **attention layer**\
    \ in the network. The idea is similar to computing importance scores of the features.\
    \ However, unlike feature importance ranking, which generically ranks the features\
    \ for the entire prediction task, the attention layer captures the contextual\
    \ importance. Essentially, attention layers highlight (or give more weight) to\
    \ the features that would positively influence a particular output’s prediction.\
    \ By further visualizing the outputs of these attention layers, we better understand\
    \ the neural network’s working. The addition of attention layers has proven useful\
    \ for **Recurrent Neural Networks (RNNs)** the most. The structure of `RNNs` allows\
    \ it to capture temporal dynamic context for tasks like speech recognition. The\
    \ attention layers help it focus on storing the essential parts, thus improving\
    \ its performance.\n\n![](Image00041.jpg)\n\nBased on a sequence-to-sequence model\
    \ for Spanish to English translation, this heat map shows which parts of the input\
    \ sentence have the model’s attention while translating. There is currently active\
    \ research in the domain of neural feature visualization with various optimization\
    \ and attribution objectives. It has become one of the most promising techniques\
    \ for understanding neuron interactions, activation mechanisms, thus enhancing\
    \ interpretability. As a stand-alone process, it might not yield satisfactory\
    \ explanations; however, if used as a building block synergistically with other\
    \ model interpretability tools, it empowers humans to uncover these complex networks’\
    \ functioning.\n\n# Feature Automation\n\nSo far, we discussed varied processes\
    \ involved in engineering features for a model to improve its performance and\
    \ interpretability. This study has made it clear that typically feature engineering\
    \ is a drawn-out manual affair. It relies heavily on domain knowledge, intuitive\
    \ exploration, data analysis, and manipulation. With multiple such components,\
    \ this process can be too cumbersome and time-consuming, despite which the eventual\
    \ feature set is limited by individual subjectivity, imagination, and time. We\
    \ can overcome this manual process by opting for automated feature engineering\
    \ techniques to accelerate feature generation and experimentation. **Feature Automation**\
    \ is a technique that generates all the possible candidate features from the given\
    \ dataset from which the best could be filtered out and used for model training.\
    \ The automatically generated feature set might be huge and not always optimal,\
    \ but it provides us with an input feature set that generates good baseline metrics.\
    \ Using domain knowledge, intuitive exploration, and the techniques discussed\
    \ in this chapter for feature selection, we can improve this feature set further.\
    \ As the volume of datasets increase, it is becoming crucial to extract as much\
    \ information as possible to create an effective solution. In one of their well-liked\
    \ articles titled *A Few Useful Things to Know about Machine Learning*, Pedro\
    \ Domingos has stated an exciting take on feature automation: “One of the holy\
    \ grails of machine learning is to automate more and more of the feature engineering\
    \ process.” A popular tool in use these days for feature automation is **Featuretools**.\
    \ It is an open-source Python framework that automatically creates features, even\
    \ from temporal and relational datasets. It works on the principle of **Deep Feature\
    \ Synthesis (DFS)** that stacks the primitives on the feature directly extracted\
    \ from the dataset to fabricate complex ones. **Primitives** can be considered\
    \ the fundamental units of `Featuretools`, defined as the individual computations\
    \ that can be applied singularly or in conjugation with others. Examples of primitives\
    \ could be aggregates like `mean`, `sum`, `average`, or transforms. Applying combined\
    \ primitives leads to a more descriptive feature. These descriptive features have\
    \ more ‘depth’, which increases each time we clamp an additional primitive. These\
    \ complex descriptive features have proven to extract intricate patterns from\
    \ the data more effectively and assist in model training. Despite being recently\
    \ developed, automated feature engineering is gaining much traction these days.\
    \ It has helped improve the standard error-prone workflow by cutting down the\
    \ time spent on brainstorming and experimentation, delivering interpretable feature\
    \ sets, and fixing data leakage issues up to quite an extent by filtering time-dependent\
    \ data. Despite still being developed, this methodology is already providing significant\
    \ gains, thus enabling Machine Learning modelers in multiple domains to use the\
    \ baked-in knowledge regarding the data without expending a sizable quota of time,\
    \ effort, and money.\n"
  trans: "\n\n# 词干提取\n\n词干提取是一种将相关词汇归类的粗略方法，通常通过从词尾切除字符直到到达词的词干来完成。例如，将以下单词：‘fit’、‘fitter’、‘fitted’、‘fitting’、‘fittable’、‘fittest’\
    \ 提取到其词干 ‘fit’ 有助于用更少的词汇量传达几乎相同的含义。虽然这种切除词尾的方法在许多情况下效果很好，但会导致许多例外情况，尤其是在英语这类语言中。为此，我们有其他复杂的技术，如\
    \ `Porter Algorithm`、`Snowball Algorithm` 等。\n\n# 词形还原\n\n我们可以继续通过将派生词还原为其基本形式来缩减词汇量，其中基本形式是单词的形态学词根，这一过程称为**词形还原**。词形还原不仅仅是简单地切除单词，而是依赖词汇含义来获取正确的基本形式，从而提供更丰富的信息视角。例如，词形还原会将以下单词\
    \ ‘be’、‘been’、‘being’、‘was’ 还原为其词元，即 ‘be’。\n\n# N-gram\n\n我们可以统计一系列单词的出现次数，而非单个单词。由于单词的含义在很大程度上取决于其使用的上下文，因此这种技术比统计单个单词更有用。在统计语言模型中，n\
    \ 个单词的序列称为**n-gram**。N-gram 应用于句子自动补全和拼写检查等领域。上述基于计数的方法有助于为文本向量化生成稳健的嵌入；然而，它们无法以最高精度捕捉文本的确切语义含义。因此，探索使用\
    \ `Recurrent Neural Networks (RNN)` 等高级技术来构建复杂的上下文文本嵌入是值得的。\n\n# 图像向量化\n\n在处理图像时，当我们放大图像，会开始看到单个像素（如下图）。这些像素无非是图片的单个元素，是数字图像可编程颜色的基本单位。因此，图像以网格形式表示像素，每个像素都有其颜色。\n\
    \n![](img/Image00029.jpg)\n\n随着我们放大图像，开始看到单个像素。在彩色世界中，每个像素通过三原色的组合获得颜色：红色 (R)、绿色\
    \ (G) 和蓝色 (B)。因此，在数学术语中，图像中的每个像素可以用三个不同的数字表示，分别表示 RGB 三种颜料的强度，每种有 256 个等级。例如，深红色像素可以表示为\
    \ `RGB(220,20,60)`。\n\n我们可以应用上述知识将基于像素的图像转换为仅包含数字的基于向量的图像，以便模型理解。例如，尺寸为 `1028*768\
    \ px` 的高分辨率彩色 PNG 图像可以作为大小为 `1028*768*3` 的三维向量输入模型。对于灰度图像，我们可以用单个值表示每个像素，指示白色强度。`0`\
    \ 表示黑色像素值，`255` 表示白色，中间的数字表示不同的灰度。因此，灰度图像可以向量化为大小为 `1028*768` 的二维向量。这种基于像素的方法是向量化图像最直接的技术之一。根据用例和问题复杂度，我们还可以尝试其他方法，如\
    \ `Color Histogram Vectorization`。\n\n# 分类向量化\n\n当我们查看服装合身度数据集的产品尺码列时，会发现数值始终属于一个特定集合，即\
    \ `XXS`、`XS`、`S`、`M`、`L`、`XL` 和 `XXL`。在将数据输入模型之前，我们需要将这些类别向量化并编码为数值。让我们讨论一下编码数据集中该分类列的不同方法。\n\
    \n## 整数编码\n\n最简单的方法之一是为每个类别（本例中为产品尺码）分配一个唯一的数值，如下所示。\n\n![](img/Image00030.jpg)\n\
    \n整数分配遵循与其对应尺码相似的自然顺序。这种编码有助于模型理解尺码 `XXS` 比 `XL` 更接近 `S`（因为 `1` 比 `6` 更接近 `3`）。该方法的一个细节是：仅当分类值之间存在自然顺序时才有效。如果编码为\
    \ `{S:1, M:2, L:3, XS:4, XL:5, XXS:6, XXL:7}`，可能就不起作用。因此，明智地编码分类值至关重要，因为错误的分配可能导致意外结果。\n\
    \n## 独热编码\n\n对于不存在序数关系的分类特征，上述整数编码可能大材小用或完全无效。在这种情况下，我们使用一种广泛流行且富有创意的方法，以二进制形式对类别进行编码，称为**独热编码**。它将每个值表示为一个二进制向量，其大小等于可能的分类值数量。仅相应数据记录中假设的值被置为\
    \ `1`，其余均置为 `0`。例如，如果所有产品尺码为 `{XXS, XS, S, M, L, XL, XXL}`，则可以对不同产品尺码进行如下编码：\n\
    \n![](img/Image00031.jpg)\n\n这种编码方式可轻松适应新的可能输入。例如，假设 ModCloth 为娇小体型推出了新尺码 `PS`、`PM`\
    \ 和 `PL`。在这种情况下，我们可以通过在现有向量后追加三个额外的零来扩展向量，并利用这额外的 3 位为新尺码引入编码，如下所示：\n\n![](img/Image00032.jpg)\n\
    \n# 归一化\n\n回顾上一章讨论的世界城市数据集示例，其中包含一个指示每个城市人口的属性。逻辑上，该列的值范围可能从 `1`（内布拉斯加州莫诺维仅拥有\
    \ 1 位居民！难以置信，对吧？）到几百万。在该数据集上训练可能导致陷入 `NaN`，因为梯度更新因数值范围过大而变得太大而无法处理。现在考虑平均年龄作为一个属性。该列的值主要位于\
    \ `0` 到 `100` 之间。这个范围与人口范围截然不同。使用包含这两个属性的数据集训练机器学习模型会导致梯度因两种不同的尺度而剧烈震荡，从而减缓收敛过程。很多时候，会使用\
    \ `AdaGrad` 或 `Adam` 等优化器通过为每个特征创建不同的学习率来防范此问题。然而，优化器并不总能拯救我们免受所有问题困扰，特别是当每个特征都有很宽的取值范围时。为了解决上述问题，我们应该转换属于不同尺度的特征值，将它们带到相似的尺度上，同时不改变其原始行为，这一过程称为**归一化**。在更复杂的场景中，归一化也指复杂的调整，以引导调整后值的整个概率分布对齐。归一化通过帮助梯度以适当的速度上升（或下降），而不是跳跃过大（导致来回震荡）或过小（导致永不收敛），从而提高模型的数值稳定性。这种行为进一步有助于加快模型训练速度。有多种方法校准特征分布；让我们讨论最常见的四种。\n\
    \n## 特征裁剪\n\n如果我们绘制世界城市数据集中所有城市的人口分布图，可能会观察到图表两侧都有长尾。人口极少的城市（想象一下只有单个居民或不足十人的城市有多少！）和人口极多的城市实际上都是异常值。在这种情况下，我们可以设定最小和最大人口（例如设定范围从\
    \ `2,000` 到 `20,000,000`）并裁剪异常值。我们将小于最小值的值设为最小值，将大于最大值的值设为最大值。这种技术称为**特征裁剪**。\n\
    \n![](img/Image00033.jpg)\n\n不同城市人口的概率密度图。概念上，两端的极值可以被裁剪。寻找特征值最小值和最大值的一种复杂方法是使用标准差度量，例如裁剪超出\
    \ `(-nσ, +nσ)` 范围的值。特征裁剪是一种简单而有效的数据归一化方法。最大的优势是它可以在其他归一化技术之前或之后应用。\n\n## 范围缩放\n\
    \n考虑世界城市数据集中的年龄特征，裁剪后其范围明确为 `0` 到 `100` 岁。每个年龄值对应大量人口。我们可以固定特征分布的上下界，因为异常值的概率很低（只有\
    \ `0.0173%` 的美国人活到 `100` 岁！）。在这种情况下，范围缩放是一种有效的归一化方法。该技术将特征值从现有范围（此处为 `[0, 100]`）变换到标准范围，通常为\
    \ `[0, 1]` 或 `[-1, 1]`。由于变换范围的方式，这种方法也称为**最小-最大缩放**。以下定义了重缩放到 `[0, 1]` 范围的公式，其中\
    \ `x’` 表示变换后的值，`x` 是特征的原始值。`min(x)` 和 `max(x)` 分别表示原始范围的下界和上界。\n\n![](img/Image00034.jpg)\n\
    \n以下是可用于重缩放到任意范围 `[p, q]` 的通用公式：\n\n![](img/Image00035.jpg)\n\n## 对数缩放\n\n观察世界城市数据集中的“使用语言数量”特征，我们发现它遵循**幂律分布**。简单来说，少数语言覆盖了大多数城市，其余语言仅覆盖剩下的极少数城市。虽然这种分布准确地代表了数据，但不利于模型训练过程。为了处理此类偏态分布，我们使用**对数缩放**，它将分布转换为正态分布。对数缩放通过对所有值执行对数变换来缩小特征值的原始范围，如下所示（其中\
    \ `x` 为原始值，`x’` 为变换后的值）：\n\n![](img/Image00036.jpg)\n\n对数缩放将宽范围压缩为窄范围，并普遍降低数据的变异性。这种变换有助于提高学习算法的性能。异常值可能导致对数变换后的分布仍有轻微偏斜，并不完全正态。然而，与原始分布相比，它们更接近正态分布。\n\
    \n![](img/Image00037.jpg)\n\n不同城市使用语言数量的概率密度图（左）。明显地，对数缩放后的图（右）有助于减少数据的偏度。\n\n\
    ## Z-Score 缩放\n\n当特征值分布仅包含少量异常值且特征裁剪可能不会产生显著变化时，我们倾向于使用**Z-Score 缩放**技术。这种归一化方法通过将值转换为均值为\
    \ `0`、标准差为 `1` 的通用尺度来转换数据。在统计学中，**Z-Score** 是一个指标，它以标准差 (`σ`) 的数量来量化某个值与整个群体均值\
    \ (`μ`) 的关系。例如，如果该值等于群体的均值，Z-Score 为 `0`。以下公式用于从原始值 `x` 计算变换后的值（或 Z-Score），记为\
    \ `x’`：\n\n![](img/Image00038.jpg)\n\n上述描述了归一化数据的四种广泛流行技术。然而，选择基于用例、学习算法和数据分布的适当方法取决于我们。无论使用哪种技术，为了使模型表现良好，我们的数据应具有以下特征：\n\
    \n- **狭窄范围**：这意味着特征值的范围应刚好足以准确表示分布。作为标准，许多数据从业者喜欢将特征值重缩放到 `[0,1]` 或 `[-1,1]` 范围内。\n\
    - **同质性**：这要求数据集中的不同特征列遵循近似校准的范围，或位于相似的特征值范围内。\n\n# 分桶\n\n当数据集包含来自调查或实验的观测值时，必然存在一些差异。因此，为了减少这些微小观测误差的影响，我们使用一种称为**分桶**的技术。这种方法涉及用相应箱体的值替换原始值。特征值到箱体的映射可以通过在连续尺度上定义小区间（基于某些阈值）来完成，这一过程称为**数据分箱**。聚合数值有时伴随着信息损失；然而，它减少了待处理的数据量。从而减轻了模型训练负担，且不会造成剧烈的性能变化。它还能减少噪声的影响，例如在图像处理问题中。\n\
    \n## 对称分桶\n\n在**对称分桶**方法中，我们将整个特征值范围划分为等大小的区间。阈值等距分布，每个区间具有固定边界。当特征值在整个范围内均匀分布时，这种分箱类型很有用。然而，假设特征值不是均匀分布的。在这种情况下，某些箱体可能包含极高数量的点，而其他箱体可能非常少甚至没有，从而导致不平衡。因此，在应用此技术前确保特征值的均匀分布至关重要，因为它可能阻碍学习。\n\
    \n## 分位数分桶\n\n**分位数分桶**旨在弥补上述对称分桶的不足。它巧妙地创建包含相同数量数据点的箱体。在统计学中，分位数是将整个分布划分为多组的切点，使得每组包含总体相同比例的数据。基于此概念，阈值并非在整个特征值范围内等距分布。相反，它们由任意两个阈值之间的数据点数量决定，该数量对所有区间应相等。根据这种逻辑，数据密度较高的区域会有更多箱体（尺寸较小），而数据较分散的区域箱体较少（尺寸较大）。因此，当数据分布偏态时，分位数分桶更受青睐，因为它具有自适应性并紧密模拟原始分布。\n\
    \n![](img/Image00039.jpg)\n\n对称分箱与分位数分箱风格的并排对比。\n\n# 特征工程\n\n数据预处理后，我们可以使用数据训练机器学习模型并将其部署到生产环境处理未见数据。这个简单模型拥有显而易见的特征集，通常镜像数据集的属性，在解决手头问题时可能表现尚可。为了进一步提升模型性能，我们有两种选择：\n\
    \n1.  **模型迭代**：一种方法是迭代构建复杂的机器学习模型，例如增加神经网络的隐藏层数量，或集成不同类型的模型，希望能更有效地学习。结合使用多个机器学习模型以获得更好的预测性能称为**集成学习**。这一行动计划可能产生预期结果；然而，它需要大量时间和精力开发，且尽管付出所有努力，仍存在无法完全奏效的风险。它还需要更大体量的训练数据，这带来另一个风险：模型可能无法扩展到生产流量。\n\
    2.  **特征迭代**：另一种途径是构建新的、更好的特征。特征镜像数据的结构，即使是次优模型也能识别。因此，拥有更好的数据表示会影响预测模型的性能。**特征工程**的过程识别可能为现有模型提供额外信号以提升性能的特征。构建特征是一个令人兴奋的方面，所有的直觉、创造性和“黑魔法”都发生在这里。Andrew\
    \ Ng 说：“构思特征很困难、耗时，且需要专家知识。应用机器学习基本上就是特征工程本身。”采用这种方法，我们可以保持简单模型在生产环境运行，进一步降低在可扩展性和性能方面失败的风险。\n\
    \n当我们开始用机器学习解决现实问题时，瞄准“触手可及的果实”很有意义。权衡两种方法的利弊，我们应首先专注于构建更好的特征以快速提升性能，然后再转向更具挑战性和风险的任务。有了创新特征，我们可以避免使用复杂的集成学习技术，或花费永恒的时间寻找最佳模型参数，这一过程称为**超参数调优**。此外，尝试新特征能改善我们对模型如何对新信息做出反应的理解，并更贴切地解决问题。然而，这仅在探索完所有可能性的范围内有效。我们不希望过度“特征过度工程”，最终导致难以驾驭的维度（我们将在本章后面讨论）。\n\
    \n## 什么不是特征工程？\n\n在深入探讨有助于为模型训练创建详尽特征列表的特征工程各个子任务之前，有必要暂停并强调什么**不是**特征工程，以描绘更清晰的图景：\n\
    \n-   不包括从数据源收集数据时识别数据集中存在的数据信号。\n-   不包含在训练集或测试集中发现目标变量或每条数据记录的标签。\n-   不涵盖数据清洗过程，如移除标点符号和停用词或整理词嵌入等任务。\n\
    -   也不包含通过将值缩放到特定范围、归一化值、编码分类值等方式处理数据的过程。\n\n## 迭代过程\n\n将特征工程理解为一项应用机器学习任务，凸显了它不是孤立存在的。它是一个迭代过程，伴随着一个明确定义的问题，在特征构思和模型评估之间振荡，直到达到瓶颈。一旦发生这种情况，我们便可以尝试复杂的模型架构或超参数调优。正式场合下特征工程遵循的逐步过程通常如下：\n\
    \n1.  理解问题陈述和领域，通过分析近期趋势和与专家讨论来头脑风暴新特征想法。\n2.  经过一些变换后，提取特征值进行离线统计分析。\n3.  在包含新特征的数据上训练现有模型，并分析模型性能指标。\n\
    4.  如果特征未带来性能提升，我们可以尝试不同的变换想法，或直接回到头脑风暴其他特征。否则，我们进一步致力于使特征生产化，将其集成到模型服务管道中。补充背景：模型服务是一种将训练好的模型作为端点暴露的方法，我们只需输入数据即可获得预测结果。\n\
    \n## 特征类型\n\n现代机器学习模型贪婪地需要数据，但根本方面是以正确的格式提供数据。直接传递数据中的原始特征可能会使模型训练变慢。它们阻碍模型的泛化能力并对性能产生负面影响。必须理解特征的数据类型显著影响处理方法。以下简要概述四种常用特征类型：\n\
    \n1.  **连续特征**：连续特征可以取任意实数，包括浮点数。任意两个特征值之间没有明确边界，即在这两者之间可能存在无限多个可能的值。这些特征值本质上是数值型的，因此可以进行数学运算。例如，ModCloth\
    \ 上的产品价格如 `US$14.99`、`US$25.00`、`US$99.99` 等。此外，分区之间没有严格区分（不像我们将在下面学习的其他类型），即产品甚至可以标价\
    \ `US$15.10`，这也完全可行！\n2.  **二元特征**：这是最简单的特征类型之一，只能取两个可能值之一：`1` 或 `0`、`true` 或\
    \ `false`、`on` 或 `off`、`yes` 或 `no` 等。这类二分特征易于实验，因为不需要花哨的变换。例如，我们可以标记 ModCloth\
    \ 上的用户是否已验证。一个潜在场景是模型学会给已验证用户的评论分配比未验证用户更高的权重。\n3.  **字符串特征**：字符串特征的值可以是任意文本块，无论是字母、符号还是表情符号。如前所述，这些字符串特征需要处理，并应转换为数值向量。明显的例子是用户留下的任何产品评论文本，如\
    \ “I love this dress, it is my favorite. The size first me perfectly and flatters\
    \ my curves!”\n4.  **离散特征**：这些特征通常也称为**分类特征**。离散特征的值只能取 N 个可能值之一，且它们之间有明确边界。简单来说，在预定义的\
    \ N 个可赋值的值之间不存在其他值。值得注意的是，类别至少应有 3 个，最多可延伸至无限。它们可进一步分为两类：\n    -   **名义分类特征**：这些特征的值之间没有关系，也不遵循任何特定顺序。例如，将夹克类型编码为\
    \ `{bomber:1, biker:2, trucker:3, denim:4, track:5, parka:6}` 就是离散值相互独立的绝佳例子。\n\
    \    -   **序数分类特征**：这些分类特征的值有顺序。例如，将产品尺码编码为 `{XXS:1, XS:2, S:3, M:4, L:5, XL:6,\
    \ XXL:7}`，其中离散值遵循与产品尺码相同的顺序，即 `S<M` 对应 `3<4` 等。\n\n## 特征与有价值特征\n\n组装足以对学习算法产生显著预测力的有意义特征需要大量精力和时间。在深入探讨后续章节中的特征提取、特征选择等不同技术之前，有必要理解特征与有价值特征的区别。以下要点可能有所帮助：\n\
    \n-   我们应避免在数据集中极少出现的离散特征。根据经验法则，一个好的特征值出现率至少应为 `1%`。检查特征值的分布使模型能够学习特征与标签之间的关系。反之，罕见特征不增加显著价值，模型无法基于该特征做出任何预测。例如，如果只有\
    \ `0.05%` 的产品具有 `XXXS` 尺码，最好丢弃这些样本。\n-   最好拥有能简洁传达其含义的特征名称。例如，如果记录用户体重，`weight_lb`\
    \ 或 `weight_kg` 这样的特征比 `weight` 更有意义。\n-   在进行特征工程时，必须非常小心地处理特征值中的不连续性。有意义的浮点特征不应包含奇特的超范围值。以产品评分为例，`user_rating=3.2`\
    \ 有意义，而 `user_rating=-0.5` 则没有。克服它的最佳方法是使用自定义布尔标志标记有效值，如 `is_user_rating_defined`。\n\
    -   为保持特征稳定性，我们应避免使用来自外部源的映射作为特征值。例如，最好拥有特征 `user_language= ‘en’` 并将其作为模型输入（创建词汇表并转换后），而不是使用将\
    \ ‘en’ 映射为 `8` 的外部源，并用 `user_language=8` 作为模型输入。\n\n# 特征选择\n\n随着我们解决复杂问题的进展，我们尝试构建先进模型并拥有信息丰富的特征。随着特征数量增加，模型为了具备足够的泛化能力以获得良好性能所需的数据量也呈指数级增长。这增加了存储空间和模型处理时间。从这个意义上说，额外特征增加的价值可能变得微不足道，相比之下它增加的开销却很大。这种现象称为**维度灾难**。即使我们有足够数据来应对额外的维度以避免模型过拟合，额外特征也会使模型变重，因为训练和服务需要额外的时间和资源。因此，通过仅保留最有影响力的特征来保持最小特征空间总是好的。这一为模型选择相关特征子集的过程称为**特征选择**。选择特征选择的关键前提是数据包含许多冗余或无关特征，可以在不丢失信息的情况下丢弃。著名机器学习科学家\
    \ Peter Norvig 以引人入胜的方式阐述了数据和特征的力量：“更多数据胜过聪明算法，但更好的数据胜过更多数据。”因此，特征选择有助于避免维度灾难，并为更短的训练和服务时间铺平道路，最终转化为更好的最终用户体验。生成的模型更易于解释和推理。我们也可以用**奥卡姆剃刀**或**简约法则**来推论这一观点：特征过多会失去可解释性。通过减少可学习参数的数量，我们也可以观察到模型过拟合的减少。相反，如果可学习参数与可用数据的比率很高，模型可能会记住训练数据，从而损害其泛化能力。最优特征的选择可分为两个阶段：提出新特征的搜索技术和衡量这些特征有用性的评估度量。通常有三大类特征选择算法：\n\
    \n1.  **过滤法** 使用统计度量对特征评分，并评估特征与标签之间的关系，如互信息或相关系数。根据度量值，我们筛选出模型所需的特征。\n2.  **包装法**\
    \ 将特征子集的选择视为一个搜索问题。例如使用**递归特征消除 (RFE)** 技术，该方法通过添加或移除特征来评估多个模型，直到找到最大化模型性能的最佳组合。\n\
    3.  **嵌入法** 使用具有内置特征选择例程的算法，作为模型学习过程的一部分。这些算法仅选择对性能贡献最大的特征。此类算法的例子包括 `LASSO Regression`\
    \ 和 `Random Forest`。\n\n让我们浏览一些业界和学术界常用的特征选择技术，它们在大多数用例中提供最佳结果。\n\n## LASSO 回归分析\n\
    \n**最小绝对收缩和选择算子 (LASSO)** 是一种回归分析方法，它选择最优特征子集以提高模型性能。它使用**L1 正则化**，惩罚目标函数系数的绝对值，以限制其值过大导致过拟合。结果是，重要特征的系数增大，无关特征的系数变为零以减少系数绝对值之和，从而自动选择重要特征。\n\
    \n## 主成分分析\n\n**主成分分析 (PCA)** 是一种统计方法，它在不损失信息的情况下降低维度以提高模型的可解释性。PCA 将包含可能相关特征的数据转换为具有线性不相关特征（也称为**主成分**）的数据。变换的定义方式使得第一主成分捕获最大可能方差。每个后续成分在与其他成分保持零相关的同时，按递减顺序捕获方差。PCA\
    \ 是一种自适应数据分析技术，可轻松针对各种领域、数据结构和算法进行定制。它通过仅选择捕获数据中最大方差的特征，在对抗维度灾难方面发挥了重要作用。\n\n\
    ## 特征重要性排序\n\n**特征重要性排序** 是一种统计方法，量化每个特征相对于标签的预测能力，并根据相对重要性得分对其进行排序。一般来说，对模型性能有正面影响或具有高预测能力的特征被认为比其他特征更重要。理解特征的贡献提高了模型的可解释性和可说明性。评估现实场景，我们通常有特征数量预算，因扩展担忧而无法超支。在这种情况下，从所有可能特征中选择贡献最大的子集以提供最佳性能变得至关重要。以下是计算特征重要性得分的三种流行方法，随后可用于特征选择：\n\
    \n### 回归分析\n\n**回归分析** 是一种估计特征与目标变量之间关系的统计方法。利用回归模型的参数，我们可以识别哪些特征对准确预测目标变量有相对较高的影响。除了粗略计算单个特征的重要性外，该方法还能揭示特征在预测目标变量时如何相互作用，即是否存在协同效应。在只有一个特征的情况下，我们可以使用线性回归模型学习一条最佳拟合数据的直线。例如，考虑\
    \ `y = b + mx`，其中 `y` 是目标变量，`x` 是特征，`b` 和 `m` 是算法学到的常数项。在这种情况下，`m` 的值可以量化 `y`\
    \ 和 `x` 之间关系的强度。我们可以将此概念扩展到多个特征，即 `y = b + ∑mᵢxᵢ`，其中每个特征 `xᵢ` 的系数 `mᵢ` 代表该特征的重要性得分（假设特征已归一化）。然而，线性回归模型仅在特征与目标变量线性相关时有用。在进行回归分析时，应牢记“相关不代表因果”这一重要格言，因为回归分析无法有效传达特征与目标之间的因果关系。\n\
    \n### 决策树\n\n作为一种机器学习模型，**决策树** 对数据变化敏感，因为计算最终是基于特征值与其各自阈值比较的分支操作序列。由于它们倾向于过拟合，即使数据发生微小变化，它们也容易在预测目标变量时表现出高方差。因此，首选\
    \ `Random Forest` 等集成学习方法，因为它们在不同数据分割上构建多棵决策树，通过平均各种深度决策树来降低方差。`Random Forest`\
    \ 通过在每棵树内随机选择特征子集进一步降低方差。决策树中决策节点的相对秩（或深度）可用于评估与该节点关联特征的相对重要性。由于靠近树顶部的特征影响更大比例输入样本的决策，它们可被视为更关键。当我们在决策树中基于特征值将数据分成两部分时，生成的分割更均匀，数据不纯度更低。相对不纯度减少量结合决策节点处理的样本比例，可作为该特征预测能力的归一化估计。通过对多棵随机树的预测能力估计进行平均，我们可以降低此类度量的方差，通常称为**平均不纯度减少\
    \ (MDI)**，并用于特征选择。\n\n### 排列测试\n\n**排列特征重要性** 是一种计算相对重要性得分的模型无关方法。其值量化为当单个特征值被随机打乱时，模型性能指标（准确率、交叉熵等）的下降程度。随机打乱特征值（或完全丢弃）会破坏该特定特征与目标值之间的关系。模型性能的下降可归因于该特征的预测能力，表明模型对其依赖程度。我们对每个特征重复此过程并比较模型性能的差异。概念上，重要特征导致的模型性能下降比其他不重要特征更大。排列测试计算成本可能很高，特别是当特征集非常大时。然而，它优于决策树等模型特定技术，因为它可应用于任何模型，且关注感兴趣的性能指标。\n\
    \n# 特征相关性\n\n在讨论回归分析等特征重要性排序技术时，我们提到它们如何帮助理解特征与目标变量之间的相关性。基于这一概念，**特征相关性** 是一种确定特征之间相关性的统计方法。它建立特征对之间的统计关联，以及输入变量线性相关的程度。特征相关性研究有助于更好地理解数据。高度相关的特征在预测目标变量时不提供额外信号。因此，在所有相关特征中仅保留一个对模型性能影响极小。这有助于特征选择，并最终减少特征空间的维度。此外，特征相关性研究有助于预测可能缺失的特征值。例如，我们可以将缺失值的特征视为目标变量，训练单独模型从其他相关特征预测其值。如果缺失特征很重要，这一技巧已知能提升模型性能。决定输入变量关系强度的相关性数值度量称为**相关系数**。计算相关系数有多种方法，最流行的是**皮尔逊积矩相关系数\
    \ (PPMCC)**。它将两个特征 `X` 和 `Y` 之间的线性相关量化为 `ρ(X,Y) = cov(X,Y) ÷ σₓσᵧ`，其中 `cov(X,Y)`\
    \ 是两个输入变量的协方差，`σₓ`、`σᵧ` 分别表示它们的标准差。PPMCC 的值介于 `+1` 和 `-1` 之间，`+1` 表示完全正线性相关，`0`\
    \ 表示无线性相关，`-1` 表示完全负线性相关。应注意 PPMCC 不反映非线性关系。在一对特征中，两者可能以以下方式之一相关：\n\n1.  **正相关**：当两个特征同步变动，即朝同一方向变化时，它们呈正相关。它们之间的线性关系使得如果一个增加，另一个也增加，反之亦然。对于正相关，系数大于零。\n\
    2.  **负相关**：在这种情况下，两个特征也同步变动，但方向相反。当一个增加时，另一个减少，因此也称为**反相关**。系数值小于零表示特征对之间存在负相关。\n\
    3.  **无相关**：系数为零表示特征之间不存在线性关系。其中一个的增加或减少不影响另一个，因此两者是无关特征。\n\n# 特征插补\n\n毋庸置疑，可用于建模的数据，尤其是来自现实世界来源的数据，本质上是嘈杂的。属性（或特征）的缺失值是常见的噪声形式。这些缺失值引入大量偏差，导致复杂的数据分析。因此，在进行分析或建模前，我们尝试填补数据空白。这一用替代值替换缺失值以实现数据完整性的过程称为**特征插补**。缺失值通常编码为\
    \ `none`、`null`、`blank`、`not a number (NaN)` 或某些预定义占位符。如前所述，这些缺失值显著影响数据质量并阻碍模型性能。有人可能认为删除缺失值记录是最简单的出路。然而，这会导致有价值信息的丢失，也会减少数据集体量。一种复杂的策略是使用估计技术填补裂缝，使其不扰乱固有的数据表示或分布。在讨论不同插补技术前，值得先提出三种缺失值类型：\n\
    \n1.  **完全随机缺失 (MCAR)**：属性缺失值无可辨别模式。缺失值也不与数据集中其他属性相关。特定数据点缺失的概率在整个数据集中相同，即值的缺失完全随机。例如，用户评价产品时忘记提及购买尺码。\n\
    2.  **随机缺失 (MAR)**：缺失值有模式或与其他观测属性的值相关。特定数据点缺失的概率仅在由非缺失或观测数据定义的组内相同。例如，女性用户在产品评价或个人资料中跳过添加体重的概率极高，远高于男性用户。\n\
    3.  **非随机缺失 (MNAR)**：特定数据点缺失的概率无法确定或未知。这是最复杂的类型之一，因为它可能源于外部故障或具有时效性。考虑一个技术错误导致用户评分字段在\
    \ UI 中未渲染。因此，相当一段时间内所有产品评价都没有关联评分。这些缺失值块，可能都属于特定产品或聚集在同一周，不能归因为随机缺失数据。\n\n现在让我们讨论一些提高输入数据质量的插补技术：\n\
    \n-   **统计插补**：此方法涉及计算观测值的均值或中位数等统计量，然后用这些值替代缺失值。必须分别为每个属性计算这些统计量，因为值的尺度或范围可能不同。虽然这是一种直接且干净的插补缺失值方法，但仅适用于数值数据。显而易见，用于分类或二元特征值时效果不佳。因为它不考虑数据相关性，所以不能带来高精度插补。该技术的另一种变体是使用最高频值替代。这对分类特征效果较好，尽管会引入偏差并扰乱数据分布。对于数值数据，也可以简单地用\
    \ `0` 或预定义常数值替代，这可能是也可能不是最高频值。\n-   **热平台插补**：这是一种常用插补方法，随机选择一个与当前记录最相似的数据记录，并用所选记录中的观测值替换缺失值。\n\
    -   **冷平台插补**：此方法使用本质上最接近当前数据集的完全不同数据集，并用其属性填补缺失值。此方法完全不推荐，因为它会导致错误结果。\n-   **回归插补**：部署回归模型，将有缺失值的属性视为目标变量，其余属性作为特征。利用非缺失值训练，我们可以用预测值填补空白。此方法相对于统计插补有额外优势，因为它考虑了特征相关性。简单回归方法试图遵循总体趋势并拟合最佳直线，但不在插补值中引入误差项。因此，使用**随机回归插补**，它向回归插补值添加平均回归方差，以在插补值中引入误差。\n\
    -   **k-近邻 (k-NN) 插补**：此方法利用特征相似性概念，使用非缺失数据记录预测缺失值。它找到待考虑数据记录的 `k` 个最近邻，并基于 `k-NN`\
    \ 方法插补值。它通常比统计插补技术更准确，但计算成本高。它对包含异常值的数据反应也不佳。\n-   **深度神经网络 (DNN) 插补**：最精确的技术之一，适用于分类和数值特征，使用深度神经网络。在非缺失值上训练\
    \ `DNN`，预测值作为缺失属性的插补值。与上述其他技术相比非常准确，但对于海量数据集计算成本可能很高。\n\n尽管讨论了多种插补技术，我们无法确定最佳技术。每种方法都针对不同需求精心设计。基于用例、缺失属性的数据类型和相关数据集，我们通常必须实验直到找到最适合的策略。\n\
    \n# 特征交互\n\n**特征交互** 是一种在现有特征之上构建特征的有效快速过程。为清晰理解，考虑一个原始仅有两个特征 `F1` 和 `F2` 的数据集。我们可以将预测函数分解为以下项：偏置项、`F1`\
    \ 的系数、`F2` 的系数，以及 (`F1 x F2`) 的系数。最后一项代表两个特征之间的交互商。两个特征之间的交互可定义为：在考虑了单个特征效应后，通过改变特征而导致的预测函数结果的变化。如果预测函数可分解为两个单独特征的聚合，我们可以假设它们之间的交互为空。该概念可推广到具有\
    \ `n` 个不同特征的数据集，其中交互可能发生在所有 `n` 个特征之间或更少。在这种情况下，我们可以生成 `nC2` 个二度交互特征、`nC3` 个三度交互特征，以此类推。虽然此过程有助于以低成本生成更多特征，但我们必须谨慎选择最大交互度。较高的交互度可能导致显著更多特征，如果数据不足，可能导致模型过拟合，即维度灾难。\n\
    \n**Friedman H 统计量** 是计算交互强度的常用度量。该统计量本质上无量纲，通常取 `0` 到 `1` 之间的值。Friedman H 统计量为\
    \ `0` 表示交互项无预测能力，值为 `1` 表示交互项单独负责预测。值大于 1 也是可能的，但很难解释。当交互项的方差远大于两个特征单独效应的方差时会发生这种情况。我们可以利用\
    \ Friedman H 统计量，通过仅挑选高影响交互水平的特征并丢弃低于阈值的特征，从大量特征中巧妙地选择特征，以避免维度灾难。然而，计算 Friedman\
    \ H 统计量是一个计算成本高昂的过程，因为它涉及在没有交互项的情况下估计单个特征的边际分布。由于这些估计本身也带有方差，结果高度不稳定。此外，该统计方法假设特征可以全部独立打乱，或不存在相关性。因此，在相关系数高的情况下，假设被违反，Friedman\
    \ H 统计量会导致无效结果。值得注意的是，此技术不适合以像素为输入，因此在涉及图像数据的问题中应避免使用。量化特征交互的替代方法包括 **Variable\
    \ Interaction Networks (VIN)** 和 **Greenwell Partial Dependence Functions**。\n\
    \n# 特征可视化\n\n到目前为止，很明显特征在机器学习模型性能中起着重要作用。因此，理解输入特征如何影响模型结果以增强模型可解释性并指导未来的模型改进和扩展迭代是有价值的。计算特征重要性和交互得分有助于识别关键特征；然而，如果我们想更深入地了解这些特征如何影响模型结果，可以使用可视化方法。**特征可视化**\
    \ 是一种应用于强调模型中特征学习路径并使其更具可解释性的方法。特征可视化技术通常与神经网络一起使用，以更好地理解其工作原理。**深度神经网络 (DNN)**\
    \ 以其在隐藏层学习高级特征的能力而闻名，这大大减轻了特征工程负担。然而，它们的不透明性降低了模型的可解释性。那个隐藏层黑盒中的无数变换一直是个秘密，直到我们得到输出。因此，特征可视化旨在发现与特定结果相关的关键输入并进行可视化检查。对于\
    \ `DNN` 的一个单元，特征可视化可通过检测最大化该单元激活的输入来执行。该单元可以是一个神经元、一整层，甚至是最终预测。`DNN` 中可能有数百万个神经元；因此为每个神经元可视化既繁琐又耗时。为优化这一点，我们改用更大的单元进行可视化，例如激活图。在特定情况下，如主要用于图像识别任务的**卷积神经网络\
    \ (CNN 或 ConvNet)**，单元甚至可以指从原始图像提取的特征图。训练 `ConvNet` 后，我们可以输入特定图像进行预测，并可视化特征映射的热力图。热力图可能指示每个特定单元正在学习什么类型的特征，从而提供对网络决策的更多洞察。\n\
    \n![](img/Image00040.jpg)\n\n一个 `5x5` 卷积核在 `16x16` 输入上卷积并产生 `12x12` 激活（或特征）图的可视化。\n\
    \n另一种可视化特征的精彩方式，特别是那些提高神经网络预测性能的特征，是在网络中引入**注意力层**。其思想类似于计算特征重要性得分。然而，与为整个预测任务通用地排序特征的特征重要性排序不同，注意力层捕捉上下文重要性。本质上，注意力层高亮（或赋予更高权重）那些会积极影响特定输出预测的特征。通过进一步可视化这些注意力层的输出，我们能更好地理解神经网络的工作原理。注意力层的添加对**循环神经网络\
    \ (RNN)** 最为有用。`RNN` 的结构使其能捕捉语音识别等任务的时序动态上下文。注意力层帮助其专注于存储关键部分，从而提高性能。\n\n![](img/Image00041.jpg)\n\
    \n基于西班牙语到英语翻译的序列到序列模型，这张热力图显示模型在翻译时关注输入句子的哪些部分。目前，神经特征可视化领域正在进行活跃研究，具有各种优化和归因目标。它已成为理解神经元交互、激活机制最有前景的技术之一，从而增强可解释性。作为一个独立过程，它可能无法产生令人满意的解释；然而，如果作为协同构建块与其他模型可解释性工具结合使用，它能赋能人类揭示这些复杂网络的运作。\n\
    \n# 特征自动化\n\n到目前为止，我们讨论了为提高模型性能和可解释性而构建特征的各种过程。这项研究清楚地表明，特征工程通常是一项漫长的手工工作。它严重依赖领域知识、直觉探索、数据分析和操作。包含多个此类组件，尽管最终特征集受限于个人主观性、想象力和时间，但这一过程可能过于繁琐和耗时。我们可以通过选择自动化特征工程技术来克服这一手工过程，以加速特征生成和实验。**特征自动化**\
    \ 是一种从给定数据集生成所有可能候选特征的技术，从中筛选出最佳特征用于模型训练。自动生成的特征集可能巨大且不总是最优，但它提供了一个能产生良好基线指标的输入特征集。利用领域知识、直觉探索和本章讨论的特征选择技术，我们可以进一步改进这一特征集。随着数据集体量增加，提取尽可能多的信息以创建有效解决方案变得至关重要。Pedro\
    \ Domingos 在其广受欢迎的文章《A Few Useful Things to Know about Machine Learning》中对特征自动化提出了一个令人兴奋的观点：“机器学习的圣杯之一是自动化越来越多的特征工程过程。”目前用于特征自动化的流行工具是\
    \ **Featuretools**。它是一个开源 Python 框架，可自动创建特征，甚至来自时间和关系数据集。它基于**深度特征合成 (DFS)** 原理工作，将基元堆叠在直接从数据集提取的特征上以构建复杂特征。**基元**\
    \ 可视为 `Featuretools` 的基本单元，定义为可单独或结合应用的单个计算。基元示例可以是聚合操作，如 `mean`、`sum`、`average`，或变换操作。应用组合基元可产生更具描述性的特征。这些描述性特征具有更多“深度”，每次我们夹紧一个额外基元时深度都会增加。这些复杂描述性特征已被证明能更有效地从数据中提取复杂模式并辅助模型训练。尽管是最近开发的，自动化特征工程正获得巨大关注。它通过减少头脑风暴和实验时间、提供可解释的特征集、通过过滤时间依赖数据在一定程度上修复数据泄露问题，改善了标准的易错工作流。尽管仍在开发中，这种方法已提供显著收益，使多个领域的机器学习建模者能够利用关于数据的内置知识，而无需花费大量时间、精力和金钱。\n\
    \n"
