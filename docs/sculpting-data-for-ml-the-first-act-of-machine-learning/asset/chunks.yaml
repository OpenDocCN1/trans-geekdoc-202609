    # 第 5 章 机器学习算法应用


    到目前为止，我们已经掌握了从多个网络来源创建数据集的能力，并学习了各种处理数据以构建特征来为机器学习模型提供动力的技术。为了进一步巩固我们的知识，我们现在将学习机器学习的不同范式。本章重点在于针对我们创建的数据集，识别适合解决具有挑战性问题的算法。其目的是从数据需求的角度提供对算法的基本理解，而不讨论其他来源已有的枯燥细节。


    ## 1• 机器学习范式识别


    尽管机器学习应用领域多样，但工作流的高层概览保持不变。标准步骤包括以下内容：


    ![](img/Image00042.jpg)

    *机器学习应用的高层工作流。*


    全面理解该工作流表明，构思和问题定义步骤通过包含数据获取和预处理的步骤，与实际的机器学习应用和部署步骤分离开来。这一流程表明，应用特定算法来学习机器学习模型的参数，取决于我们拥有的数据的性质和数量。所谓学习，是指模型从过去的经验（通过提供的训练数据）中保留知识，并将其用于新的未见经验（即测试数据）的能力。


    我们将通过考察三种机器学习范式：`Supervised Learning`（监督学习）、`Unsupervised Learning`（无监督学习）和 `Reinforcement
    Learning`（强化学习）来开始本节。这三种范式是我们今天可用的各种技术的高层分类。我们还将说明如何将我们收集的高质量数据集映射到每种范式，以解决预测问题。


    ### I• 监督学习


    `Supervised Learning`（监督学习）是应用最广泛的机器学习范式之一。在 `Supervised Learning`（监督学习）范式中，我们拥有一组输入-输出对（以标记训练数据集的形式），任务是学习一个映射函数，以尽可能准确地预测未见输入的输出（即训练数据集中不存在的输入）。其命名贴切，因为算法拥有标记的训练数据集来观察并学习映射函数，就像有一位监督者一样。


    用简单的数学术语来说，假设我们有一个标记的训练数据集，用 `X` 表示输入变量，用 `Y` 表示标签。我们有一个函数 `f` 在两者之间提供映射，即 `f(X)
    = Y`。我们的目标是学习映射函数 `f`，以便在给定任何未见样本 `X’` 时，能以最高的准确性计算出其标签 `Y’`。


    `Supervised Learning`（监督学习）主要有两种不同的技术，即 `Classification`（分类）和 `Regression`（回归），我们将在本章后面讨论它们。这种学习范式与我们之前讨论的指导性数据集搜索理念非常契合，当时我们学习了如何为已定义的问题收集数据。在那个例子中，我们有问题陈述和关键数据信号作为指路明灯。搜索过程在于寻找相关的输入-输出对，以便轻松应用
    `Supervised Learning`（监督学习）技术。


    让我们考虑一下我们一直在用于尺码推荐问题的服装合身度数据集。我们拥有的输入包括：客户购买的产品尺码、合身情况，以及产品和客户身体测量的其他详细信息。我们的任务是学习映射函数，以便将来能推荐用户应购买的产品尺码以获得良好的合身度。然而，我们需要注意一点：我们从外部来源收集的数据集不会直接解决
    `Supervised Learning`（监督学习）问题。例如，在尺码推荐问题中，理想的数据集应该包含信息，说明在所有可用的不同尺码中，哪个尺码最适合该用户。但在现实中，客户只会试穿给定产品的
    1-2 个尺码。他们无法评测所有可用尺码的完整目录。在这样的情况下，我们需要修改问题定义。更新后的陈述应近似原始问题，并与收集到的数据集良好契合。将这一原则应用于尺码推荐问题，我们可以将其校准为尺码合身度问题。我们拥有用户画像（即
    `UserID` 和身体测量数据）和购买的产品尺码这一输入对。目标是学习该产品的哪个尺码最适合那位潜在客户。一旦我们能可靠且准确地预测产品目录尺码在用户身上的合身度，就能推断出向客户推荐的完美尺码。实际上，我们推荐的是对于特定用户而言，成为最佳合身度概率最高的目录尺码。


    ### II• 无监督学习


    `Unsupervised Learning`（无监督学习）是一种不需要标记数据点的机器学习范式。理论认为它们足够智能，能在没有人工监督的情况下，在提供的无标签数据中寻找模式。`Unsupervised
    Learning`（无监督学习）通常本身就是一个目标，即在数据中发现模式就是目的。既然我们不提供关于要寻找什么模式的任何提示，算法就会自我组织。它会制定规则来整理数据并发现模式。


    `Unsupervised Learning`（无监督学习）主要有两种不同的技术，即 `Clustering`（聚类）和 `Association`（关联），我们将在本章后面讨论它们。这种学习范式与我们之前讨论的非指导性数据集搜索理念非常契合，当时我们学习了如何在没有任何目标的情况下收集数据。既然对这些数据集适合解决什么问题的直觉已足够，我们就专注于收集尽可能多的信息，以帮助算法高效地检测模式。


    让我们考虑一下新闻类别数据集。它包含新闻类别、新闻标题、新闻故事的简短描述、发布日期、作者等详细信息。乍一看，我们可以利用该数据集根据标题预测新闻类别，作为
    `Supervised Learning`（监督学习）的一个简单示例。该数据集更令人兴奋的用途是识别每个类别中值得报道的主题，如 `entertainment`（娱乐）、`politics`（政治）、`fashion`（时尚）等。如果我们观察一下，数据中没有关于新闻价值或标题间共同主题的标签。因此，从数据中发现这些模式就是
    `Unsupervised Learning`（无监督学习）算法的工作。


    检测标题间共同主题的一种基本方法是对每个类别的标题文本使用主题建模。`Topic Modeling`（主题建模）是一种流行的学习技术，尤其适用于自然语言处理任务。它扫描提供的文本文档集合，提取其中相似的词语和短语模式，然后自动学习聚类词语分组和相似表达，以最好地表征给定的文本文档集合。使用这种统计模型来发现数据中的抽象主题，能加深我们对什么能成为新闻文章的理解，从而在未来识别有新闻价值的故事。


    #### 半监督学习


    在当代，存在一些将少量标记数据与大量未标记数据相结合以提高学习准确性的情况。这种学习类型通常被称为 `Semi-Supervised Learning`（半监督学习），因为它介于
    `Supervised Learning`（监督学习）和 `Unsupervised Learning`（无监督学习）之间。


    一个简单的例子是：我们有一大组文章，想象一下互联网上所有的内容，我们需要在不实际提供类别的情况下对它们进行分类。我们可以从极少量的标记文章开始，让算法学习对其余文章进行分类。这种方法之所以有效，是因为手动对所有数据进行分类可能非常昂贵，但未标记数据获取成本低廉。在某些情况下，算法可以自由构建新类别。这种自我训练技术对于对文章进行分类和排序非常有用。


    `Semi-Supervised Learning`（半监督学习）的另一个典型例子是语音分析，因为给多个音频文件的每一部分打标签太繁琐了。由于这种学习范式结合了
    `Supervised`（监督）和 `Unsupervised Learning`（无监督学习），它在以下假设下具有两者的特征：


    *   **Continuity Assumption（连续性假设）**：在提供的数据点中，彼此更接近的数据点映射到相似的标签。

    *   **Cluster Assumption（聚类假设）**：我们可以根据特定标准对所有提供的数据点进行分组，同一组中的数据点映射到相同的标签。


    ### III• 强化学习


    `Reinforcement Learning`（强化学习）是一种机器学习范式，其中算法学习如何在不确定的环境中做出一系列决策。目标是通过做出一系列决策来最大化获得的累积奖励。


    想象面临一个类似游戏的情境，每个动作要么获得奖励，要么受到惩罚，但我们事先不知道它们是什么。游戏的目标是在最后最大化总奖励。既然我们没有关于如何最优地玩游戏的任何提示，我们最初会通过试错方法来玩，并收集关于奖励策略的信息。然后我们利用这些信息指导后续决策，试图最大化奖励。


    同样，`Reinforcement Learning`（强化学习）模型从简单的随机试验开始学习如何执行任务，并根据接收到的奖励调整其参数。随着模型参数收敛，模型变得更加复杂，能更优地执行所述任务。我们将这一范式与人类智能的工作方式进行比较，如果提供足够的计算资源，`Reinforcement
    Learning`（强化学习）可以整合来自多个并行游戏过程的经验。它可以利用搜索的力量，在短时间内想出开创性的算法。


    这一范式不同于 `Supervised Learning`（监督学习），因为它不需要输入-输出对的标记数据集。相反，它使用函数逼近将当前状态与下一个动作联系起来。它在探索未知领域和利用迄今获得的知识之间取得平衡，以制定一种在长期内最大化奖励的策略。


    这种学习范式的一个简单例子是 `Autonomous Driving`（自动驾驶）。既然我们无法知晓驾驶过程中可能发生的每一种路况，我们就无法提供标记数据集。基于路况、交通或天气等外部因素，我们的目标是在不超速、不违章、安全到达目的地且不引发事故的前提下，最小化乘车时间。


    `Reinforcement Learning`（强化学习）可能比其他范式更直观，但它也有一些显著的警示：


    *   **Data collection（数据收集）** 对于这一范式并不简单；我们必须依赖运行模拟来进行。

    *   **Designing the reward（设计奖励）** 本身就是一个挑战，如果草率行事，可能会产生不可预见的后果。例如，如果没有速度限制、方向等适当约束，以最小化行驶时间作为自动驾驶汽车的奖励可能会非常危险。

    *   `Reinforcement Learning`（强化学习）能高效地最大化长期奖励；然而，算法的即时决策可能不符合直觉。

    *   衡量最坏情况性能可能具有挑战性，因为可能无法以标准形式收集此类场景的数据。


    ## 2• 深度解析：监督学习技术及其应用


    如前所述，`Supervised Learning`（监督学习）技术旨在通过示例进行学习。通常，新的机器学习从业者通过尝试各种 `Supervised Learning`（监督学习）技术来开启他们的旅程。让我们深入探讨
    `Supervised Learning`（监督学习）的两种基本技术，即 `Classification`（分类）和 `Regression`（回归）。


    ### I• 分类


    `Classification`（分类）是一种流行的 `Supervised Learning`（监督学习）方法，机器学习将数据映射到训练数据集中定义的 `N`
    个标签之一。然后利用这些知识，尽可能准确地对新的未见数据点（称为测试数据集）进行分类。通常，训练数据集中定义的 `N` 个类别相互独立。算法不应将测试数据分类到定义的
    `N` 个类别之外。


    一个简单的例子是利用身体扫描图像和大小、颜色、生长速度等其他特征，将人体内的肿瘤分类为 `malignant`（恶性）或 `benign`（良性）。这种预测建模技术大致可进一步分类如下：


    1.  **Binary Classification（二元分类）**：这些任务要求算法将数据记录分类到两个类别之一，如 `yes`/`no`（是/否）、`malignant`/`benign`（恶性/良性）、`spam`/`not
    spam`（垃圾/非垃圾）、`sarcastic`/`non-sarcastic`（讽刺/非讽刺）等。

    2.  **Multi-Class Classification（多类分类）**：这些任务训练并期望算法分类到多个可能的类别之一，例如原色：`red`/`blue`/`yellow`（红/蓝/黄），水果：`orange`/`apple`/`peach`/`guava`（橙子/苹果/桃子/番石榴）等。


    值得注意的是，为二元分类任务设计的建模技术也可应用于多类分类问题。有一些简单的启发式方法将多类分类问题拆分为多个二元分类任务。两种这样的启发式方法是：


    *   **One-Vs-Rest (OVR)**：`OVR` 也称为 One-Vs-All (`OVA`) 方法。这种启发式方法选取一个类别，训练一个模型将该选取的类别与所有剩余类别区分开。我们重复此过程，直到拥有多个模型，它们学会为每个类别分配概率分数。例如，考虑一个将色板分类为
    `Red`/`Blue`/`Yellow`/`Green`（红/蓝/黄/绿）之一的任务。我们将训练四个二元分类模型，即 `Model 1`：`Red` vs.
    (`Blue` or `Yellow` or `Green`)，`Model 2`：`Blue` vs. (`Yellow` or `Green` or `Red`)，`Model
    3`：`Yellow` vs. (`Green` or `Red` or `Blue`)，以及 `Model 4`：`Green` vs. (`Red` or
    `Blue` or `Yellow`)。毫无疑问，当我们有许多类别、大型数据集或模型过于复杂而需多次训练时，这会变得繁琐。

    *   **One-vs-One (OVO)**：这种启发式方法选取不同的类别对，为每一对训练一个二元分类模型，直到我们学会如何为每个类别分配概率分数。使用上面相同的例子，只不过在这种情况下，我们将有六个不同的模型，即
    `Model 1`：`Red` vs. `Blue`，`Model 2`：`Red` vs. `Yellow`，`Model 3`：`Red` vs. `Green`，`Model
    4`：`Blue` vs. `Yellow`，`Model 5`：`Blue` vs. `Green`，`Model 6`：`Yellow` vs. `Green`。


    现在，让我们讨论一些流行的分类技术，专门针对二元分类任务。


    #### A• 逻辑回归


    `Logistic Regression`（逻辑回归）基于统计对数几率模型，利用先验经验对特定事件的概率进行建模。它是用于二元分类的首选算法，用于建模二元响应变量（即两个结果类别之一）与一组预测变量（即数据特征）之间的关系。在推理阶段，算法计算数据记录与每个类别相关联的概率，并将其分配给发生概率最高的类别。如果两个类别中一个的似然为
    `p`，其中 `p` 介于 `0` 和 `1` 之间，则另一个类别的似然为 `1-p`。


    逻辑回归算法派上用场的一些常见示例包括：

