    \ and the size of the product purchased, respectively. Since these are essential\
    \ data signals, we can eliminate the records that have missing  values for these\
    \ keys, as follows: trimmed\\_data = \\[\\]  \n\nfor record in scraped\\_data:\
    \  \n\n  if ‘fit’ in record.keys() and ‘size’ in record.keys():  \n\n    trimmed\\\
    _data.append(record) 3. Information about the customer/user who purchased a product\
    \ and left a review on the website is also valuable. ModCloth assigns each product\
    \ a unique identifier; however, it does not have a unique ID for the reviewers.\
    \ Instead, the website only mentions the name of each reviewer, which has a high\
    \ chance of not being unique. The absence of distinctive identifiers is challenging\
    \ since we identified UserID as an essential data signal for the Size Recommendation\
    \ problem along with ProductID , size purchased , and fit feedback . ![](Image00024.jpg)![](Image00025.jpg)The\
    \ reviews on ModCloth do not seem to be associated with unique UserID s. Many\
    \ reviews on the website include vital details regarding a user, like body measurements,\
    \ which are highly correlated to the size purchased and the consequential fit\
    \ feedback. Since the user’s body measurements are identifiable details and unique\
    \ to a great degree, we can use those in conjunction with the reviewer name to\
    \ build individual identities. To create a unique identifier and ensure that no\
