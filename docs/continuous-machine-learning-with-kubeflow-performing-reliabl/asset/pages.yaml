  md: '# 6.4.5 Training model (using Weights & Biases) with LightGBM Framework


    In this section, let’s see how we will build our LightGBM framework with Weights
    & Biases.


    How does LightGBM work?


    LightGBM uses the histogram-based algorithm, which buckets the continuous feature
    (attribute) values into discrete bins. This speeds up the training and reduces
    the memory usage.


    ![](img/8f8a671916d96b455297952d0f37b96c_388_0.png)


    Figure 6.22: LightGBM Architecture


    LightGBM grows its trees in a leaf-wise manner for the best-first. Next, it takes
    the leaf with the maximum delta loss for growing. The leaf-wise algorithms tend
    to achieve lower loss than the level-wise algorithms by holding the leaf fixed.'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'The leaf-wise algorithm may cause over-fitting with a small set of data, so
    LightGBM includes a parameter to limit the tree depth which is However, the leaf-wise
    trees still grow even when the **max_depth** is specified.


    The advantages of the histogram-based algorithms include the following:


    +   - Reduced cost of calculating the gain for each split.

    +   - Uses histogram subtraction for further speedup.

    +   - Reduces memory usage.

    +   - Reduces communication cost for parallel learning.


    For further reading, please go to the following link:


    [https://lightgbm.readthedocs.io/en/latest/Features.html](https://lightgbm.readthedocs.io/en/latest/Features.html)


