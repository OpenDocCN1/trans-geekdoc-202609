- pgno: 529
  md: 'Kubernetes is an open-source system for managing the containerized applications
    in a clustered environment.


    Google Kubernetes Engine is an implementation of the open source Kubernetes framework
    on the Google Cloud Platform.


    Let’s build the Docker image with everything being the same from earlier, just
    remove the last two lines from the earlier Heroku Dockerfile and add one line
    of CMD to run the Streamlit Python script:


    ```

    FROM ubuntu:18.04

    ENV LC_ALL=C.UTF-8

    ENV LANG=C.UTF-8

    RUN mkdir -p /root/.streamlit


    RUN bash -c ''echo -e "\

    [general]\n\

    email = \"\"\n\

    " > /root/.streamlit/credentials.toml''


    RUN bash -c ''echo -e "\

    [server]\n\

    enableCORS = false\n\

    " > /root/.streamlit/config.toml''


    RUN apt-get update && \

    apt-get install -y \

    python3.7 python3-pip \

    ```'
