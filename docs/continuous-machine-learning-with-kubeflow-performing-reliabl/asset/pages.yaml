  md: '# 1.6.1 Install and Set Up kubectl


    Now, let’s first install kubectl gcloud sdk, which will be used for connecting
    Kubernetes.


    Install with Homebrew on macOS:


    If you are on macOS and using the Homebrew package manager, you can install kubectl
    with Homebrew:


    Run the installation command:


    ```

    $ brew install kubectl

    ```


    Test to ensure the version you installed is up-to-date:


    ```

