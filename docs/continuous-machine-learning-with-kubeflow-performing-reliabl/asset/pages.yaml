  md: '# Figure 6.33: Folder Structure


    In previous chapters, we have covered the KF Serving Architecture; so you can
    refer


    Let''s see how we will build the serving component **lightgbm_wandb.py** file:


    ```

    ```python

    import os

    import sys

    import json

    import numpy as np

    import kfserving

    import lightgbm as lgb

    from typing import List, Dict

    class KF ServingSampleModel(kfserving.KFModel):

    def __init__(self, name: str):

    super().__init__(name)

    self.name = name

    self.ready = False

    self.model_output_base_path = "lgb_classifier.txt"

    def load(self):

    model = lgb.Booster(model_file=self.model_output_base_path)

    self.model = model

    self.ready = True

    def predict(self, request: Dict) -> Dict:

    inputs = np.array(request["instances"])

    reshaped_to_2d = np.reshape(inputs, (-1, len(inputs)))

    results = self.model.predict(reshaped_to_2d)

    result = (results > 0.5)*1

    ```

