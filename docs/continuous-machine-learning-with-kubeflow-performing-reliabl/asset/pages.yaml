- pgno: 235
  md: '# Figure 3.23: Auto-scaling Working Concept


    # ALGORITHM


    Knative Serving autoscaling is based on the average number of in-flight requests
    per pod (concurrency). The system has a default target concurrency of 100 (search
    for the container-concurrency-target-default), but we used 10 for our service.


    We loaded the service with 100 concurrent requests, so the autoscaler created
    5 pods.


    (100 concurrent requests / target of 10 = 10 pods)


    # PANIC


    The autoscaler calculates the average concurrency over a 60-second window, so
    it takes a minute for the system to stabilize at the desired level of concurrency.
    However, the autoscaler also calculates a 6-second panic window and will enter
    the panic mode if that window reached 2x the target concurrency. In the panic
    mode, the autoscaler operates on the shorter, more sensitive panic window. Once
    the panic conditions are no longer met for 60 seconds, the autoscaler will return
    to the initial 60 second stable window.'
  merge: -1
  img_proc: true
