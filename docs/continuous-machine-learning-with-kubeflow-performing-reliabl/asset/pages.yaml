  md: '# 6.4.4 Utility Metrics Function


    We will evaluate our training LightGBM Regressor with the following three metrics:


    **Spearman** Statistically, this method will quantify the degree to rank the variables
    which are associated by a monotonic function, that represents as an increasing
    or decreasing relationship behaviour. The method does a hypothesis test, and tells
    that the samples are uncorrelated (fail to reject Ho). The function next takes
    the two real-valued data as args and returns both the correlation coefficient
    in the range between -1 and 1, and also the p-value which will interpret the coefficient
    significance.


    For a sample of size n, the n raw scores X_i, Y_i are converted to ranks rg_Xi,
    rg_Yi, and r_s is computed as


    r_s = ρ_{rgX, rgY} = cov(rg_X, rg_Y) / (σ_{rgX} σ_{rgY}),


    where

    ρ denotes the usual Pearson correlation coefficient, but applied to the rank variables,

    cov(rg_X, rg_Y) is the covariance of the rank variables,

    σ_{rgX} and σ_{rgY} are the standard deviations of the rank variables.


    Only if all n ranks are distinct integers, it can be computed using the popular
    formula


    r_s = 1 - 6 Σ d_i² / [n(n² - 1)],


    where

    d_i = rg(X_i) - rg(Y_i) is the difference between the two ranks of each observation,

    n is the number of observations.


    Figure 6.21: Spearman Correlation (Source Credit: Wiki)'
  merge: -1
  img_proc: true
- pgno: 387
  md: '**Mean Absolute** The average of the absolute differences between the actual
    and predictions values. It tells how wrong the predictions were. It also measures
    the magnitude error, and gives an idea direction, so a value of o indicates no
    error or perfect predictions.


    **Root Mean Square** The R^2 (or R Squared) metric talks about an indication of
    the goodness of fit for our predictions with respect to the original values. In
    statistical terminology, it is also known as the coefficient of determination.
    Its value lies in between o and 1 for no-fit and perfect fit respectively.


    ```

    def evaluate(df: pd.DataFrame) -> tuple:

    def _score(sub_df: pd.DataFrame) -> np.float32:

    """Calculates Spearman correlation"""

    return spearmanr(sub_df["target"], sub_df["prediction"])[o]


    mae = mean_absolute_error(df["target"], df["prediction"]).round(4)

    RMSE=mean_squared_error(df["target"], df["prediction"])** o.5

    spearman=spearmanr(df["target"], df["prediction"])[o]

    # Display metrics

    print(f"Spearman Correlation: {spearman}")

    print(f"RMSE Score: {RMSE}")

    print(f"Mean Absolute Error (MAE): {mae}")

    return spearman,RMSE, mae

    ```


