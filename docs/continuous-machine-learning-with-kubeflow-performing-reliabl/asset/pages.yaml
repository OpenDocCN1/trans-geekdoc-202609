- pgno: 140
  md: '# Figure 2.13: KF – Serving Component Folder Structure


    # Architecture of KF-Serving:


    The InferenceService Data Plane architecture consists of a static graph of components
    which coordinates the requests for a single model.


    ![](img/8f8a671916d96b455297952d0f37b96c_140_0.png)


    # Figure 2.14: KF – Serving Architecture


    **Endpoint:** InferenceServers are divided into two endpoints – "default" and
    "canary". The endpoints allow the users to safely make the changes using the Pinned
    and Canary rollout strategies. Canarying is completely optional, enabling the
    users to simply deploy with a BlueGreen deployment strategy on the "default" endpoint.


    **Component:** Each endpoint is composed of multiple components – "predictor",
    "explainer", and "transformer". The only required'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'component is the predictor, which is the core of the system. As KFServing evolves,
    we plan to increase the number of supported components to enable the use cases
    like Outlier Detection.


    **Predictor:** The predictor component is the workhorse of the InferenceService.
    It is simply a model and a model server that makes it available at a network endpoint.


    **Explainer:** It enables an optional alternate data plane that provides our model
    explanations, in addition to the predictions. So the users may also define their
    own explanation container, which KFServing will configure with the relevant environment
    variables like prediction endpoint. For the common scenario, KFServing provides
    out-of-the-box explainers like Alibi.


    **Transformer:** The transformer enables the users to define a pre and post processing
    step before the prediction and explanation workflows. Like the explainer, it also
    configures with the relevant environment variables. For the common use cases,
    KFServing provides the out-of-the-box transformers like Feast.


    Here, we will use the custom image serving because of the following reason:


    The goal of the custom image support is to allow the users to bring their own
    wrapped model inside a container and serve it with KFServing. Here, in this example,
    located in the model-server directory extends the kfserving. KFModel uses the
    tornado web server.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'You can use KFServing to do the following:


    Provide a Kubernetes Custom Resource Definition for serving the ML models on the
    arbitrary frameworks.


    Encapsulate the complexity of autoscaling, networking, health checking, and server
    configuration to bring cutting edge serving features like GPU autoscaling, scale
    to zero, and canary rollouts to your ML deployments.


    Enable a simple, pluggable, and complete story for your production ML inference
    server by providing prediction, pre-processing, post-processing and explainability
    out of the box.


    Let’s see how we will build the serving component **Transformer.py** file.


    ```

    Transformer.py:

    import tensorflow as tf

    import sys,os,json,kfserving

    import numpyas np

    import kfserving

    from typing import List, Dict


    os.environ[''GOOGLE_APPLICATION_CREDENTIALS''] = "service_account_iam.json"

    ```'
  merge: -1
  img_proc: true
- pgno: 143
  md: '```

    class KFServingSampleModel(kfserving.KFModel):


    def __init__(self, name: str):

    super().__init__(name)

    self.name = name

    self.ready = False

    self.model_output_base_path =

    "gs://kubeflowusecases/breast/model/"


    def load(self):

    model = tf.keras.models.load_model(self.model_output_base_path)

    self.model = model

    self.ready = True


    def predict(self, request: Dict) ->Dict:

    inputs = np.array(request["instances"])

    reshaped_to_2d = np.reshape(inputs, (-1, len(inputs)))

    results = self.model.predict(reshaped_to_2d)

    result = (results >0.5)*1

    if result==1:


    result="malignant"

    else:

    result="Benign"

    print("result : {0}".format(result))

    return {"predictions": result}


    if__name__ == "__main__":

    model = KFServingSampleModel("kfserving-breast-model")

    model.load()

    kfserving.KFServer(workers=1).start([model])

    ```'
