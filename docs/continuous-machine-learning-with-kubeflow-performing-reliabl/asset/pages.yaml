    **Step** Importing the Features from the Python file.


    **Step** tf.transform''s callback function for preprocessing inputs of the artifacts
    data for training.


    **Step** TensorFlow Transform expects the transformation outputs to be dense,
    therefore we are using the following helper function to convert the sparse to
    dense features:


