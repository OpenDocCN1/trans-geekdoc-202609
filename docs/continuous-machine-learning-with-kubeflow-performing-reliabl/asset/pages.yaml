- pgno: 9
  md: '# Preface


    This book focuses on the DevOps and MLOps of deploying and productionising machine
    learning projects with Kubeflow in Google Cloud platform. The authors feel that
    in this era of machine learning, lot of companies failed to make production of
    AI/ML projects in real time which was also a study from Forbes. It is compelling
    and relevant content for today’s practicing DevOps/MLOps teams as this sector
    is still changing. So, many machine learning platforms today take different approaches
    to the architecture and solution space of managing machine learning workflows.
    The core concepts of Kubernetes and Kubeflow and its architecture alongside teaches
    us how to approach and make your AI/ML projects from training to serving with
    scale in production with Kubeflow.


    This book starts by taking you through today’s machine learning infrastructure
    of Kubernetes and Kubeflow architecture. We then go on to outline the core principles
    of deploying various AI/ML use cases with TensorFlow training serving with Kubeflow
    and explain how Kubernetes solves some of the issues that arise. We further show
    how to use TFX with Kubeflow alongside Explainable AI for determining fairness
    and biasness with What-if Tool. We learn various serving techniques framework
    for different use cases with Kubeflow KF serving. After that we look at building
    sample computer vision based UI in streamlit and deploying that in Google cloud
    platform Kubernetes and Heroku deployment.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'This book is divided into 8 chapters. They cover Kubernetes, Kubeflow basics,
    advance deployment projects with Kubeflow, AWS Sagemaker deployment and explainable
    AI with real time examples for deployment and container creation with Docker and
    building pipeline in Kubeflow. More interest will arise among learners in Machine
    learning deployment with Kubeflow.


    The details are listed as follows:


    # Chapter 1:


    In this chapter, we will learn about the complete features of Kubeflow, how it
    works and its need. We will also learn about the architecture functionality of
    Kubernetes such as service, pod, Ingress, and so on. We will learn to build the
    docker image and learn it’s working. Here, we will see the components of Kubeflow
    advantage, which we will be using in the upcoming chapters. Then, we will proceed
    towards the complete setup of Kubeflow in the Google Cloud platform and Jupyter
    notebook setup. We have an optional item – how to create the persistent volume
    claim and attach it to the file store to save your codes and data.


    # Chapter 2:


    In this chapter, we will build an end-to-end TensorFlow classification model deployment
    with Kubeflow orchestration which includes deploying Kubeflow in Kubernetes Cluster
    in GCP, building the pipeline components for the model with Docker and Kubeflow
    SDK, and then serving the model with KF serving to have an endpoint for prediction.
    We will also track the monitoring and performance for our serving traffic endpoint
    in Grafana dashboard.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Chapter 3: In this chapter, we will build an end-to-end TensorFlow computer
    vision model with OpenCV operation and deploy that with the Kubeflow orchestration,
    which includes deploying Kubeflow in Kubernetes cluster in GCP, building the pipeline
    components for the model with Docker and Kubeflow SDK and then serving the model
    with KF serving to have an endpoint for prediction. We will then track the monitoring
    and performance in Grafana dashboard.


    Chapter 4: In this chapter, we will build an end-to-end structured data classification
    model and make it ready for production with the help of TFX, and serve the model
    outputs with TF serving to get the prediction. We will also be building the TensorFlow
    ecosystem model and visualizing the evaluation with Tensorboard and Fairness.
    Then, we will learn about the various TFX components like TFT, TFMA, TFDV, and
    so on. Later on, we will create a Kubeflow Pipeline on Google Cloud.


    Chapter 5: In this chapter, we will work on a classification model with the hotel
    booking dataset, train the TensorFlow and boosting models, and visualize the advanced
    explanation of our model results with Tensorboard, Shap, and What-if products.


    Chapter 6: In this chapter, we will build an end-to-end Light Model framework
    and will monitor the model performance in the Weights and Biases (Wandb) tool.
    Within Weights and Biases, we will see the live model RMSE graphs and parallel
    coordinates’ hyper parameter performance graphs for each iteration. Next, we will
    deploy the model with the KF serving in our Kubernetes Cluster inside Google Cloud
    platform. We will be serving model endpoint which will be used for prediction
    and monitored in the'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Grafana Dashboard, such as model rate request with respect to the time and
    CPU and GPU consumption.


    Chapter 7: In this chapter, we will work on the Housing Price Sales dataset project,
    where we will completely run, evaluate, and deploy the model in the Amazon SageMaker
    Cloud environment and use S3 for data storage. We will also be using the in-built
    container algorithm XG-Boost for model building so that we are able to understand
    the architecture of SageMaker model building framework end to end.


    Chapter 8: In this chapter, we will build an end-to-end web application for the
    computer vision models, and build the UI with Streamlit. We will be learning about
    many Open CV models for image like cropping, changing pixels, and so on. Next,
    we will host the web application with the Heroku Container Registry or Kubernetes
    Cluster as a service application in Google Cloud.'
  merge: -1
  img_proc: true
