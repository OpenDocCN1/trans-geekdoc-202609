  md: 'Now, let’s create the Docker file for the Heroku Deployment.


    Dockerfile:


    ```

    FROM ubuntu:18.04

    # streamlit-specific commands for config

    ENV LC_ALL=C.UTF-8

    ENV LANG=C.UTF-8

    RUN mkdir -p /root/.streamlit


    RUN bash -c ''echo -e "\

    [general]\n\

    email = \"\"\n\

    " > /root/.streamlit/credentials.toml''

    RUN bash -c ''echo -e "\

    [server]\n\

    enableCORS = false\n\

    " > /root/.streamlit/config.toml''


    RUN apt-get update && \

    apt-get install -y \

    python3.7 python3-pip \

    libsm6 libxext6 libxrender-dev

    EXPOSE 8501

    # make app directiry

    WORKDIR /streamlit-docker

    ```'
