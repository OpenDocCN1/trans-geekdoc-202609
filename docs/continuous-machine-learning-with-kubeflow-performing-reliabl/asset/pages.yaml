    ![](img/8f8a671916d96b455297952d0f37b96c_518_1.png)


    The build stage is a transform which converts a code repo into an executable bundle
    known as a slug by fetching and vendoring dependencies and compiling binaries
    and assets.


    The release stage then takes the build and combines it with the deploy''s current
    config. The resulting release contains both the build and the config and is ready
    for immediate execution.


    # Figure 8.18: Heroku Architecture


    Now, create the Python Script for your application, containerize your whole Framework
    with Docker, release the build to App inside Heroku, and then host the application
    inside and deploy it there, which will generate a host URL.


    Now, we will build the Docker image; for that, make sure you start the Docker,
    after which you will see the Docker is activated on the top. In the following
    screenshot, we can see that the first icon Docker is started. You can stop or
    restart from that icon.'
