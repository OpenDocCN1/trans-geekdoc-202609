  md: '# 8.7 Summary


    In this chapter, we learned how to build a web application with the Streamlit
    tool in Python without having prior knowledge to any other language. Then, we
    hosted the application in the Heroku Platform and Google Kubernetes Engine.


    Next, we learned about the various Streamlit components for how to display the
    text, image, charts, and so on. Also, we built the framework for our web application
    for the various computer vision OpenCV models like Sharpening, Cropping Image,
    and so on. After that, we saw the architecture to build the Heroku deployment
    which is a common skeleton to be used for all Skelton Machine Learning web application
    deployment alongside Google Kubernetes Engine.


    In this chapter, we have gained knowledge on how to leverage the power of Google
    Cloud Platform and how to use your Devops knowledge with Machine Learning to become
    an MLops. Also, we also learned how to use Streamlit to build Skelton Web application
    in just a few hours in Heroku and Cloud.'
