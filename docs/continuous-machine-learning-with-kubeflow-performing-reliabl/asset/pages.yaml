- pgno: 33
  md: '# 1.2.1 What is Kubernetes?


    Kubernetes is an open-source container management system used in large-scale enterprises
    in several dynamic industries to perform a mission-critical task or any orchestration
    task. Some of its capabilities include the following:


    +   - It manages the containers inside cluster.

    +   - It deploys applications to which it provides tools.

    +   - It scales the applications as per requirement.

    +   - It manages the existing containerized application changes.

    +   - It optimizes the use of the underlying hardware complexity beneath our container.

    +   - It enables an application component to restart and move across multiple
    systems as per need.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.2.2 Why do we need Kubernetes?


    We need Kubernetes to manage the containers when we run our production grade environments
    using a pattern of microservice with many containers. We need to track features
    such as health check, version control, scaling, and rollback mechanism among other
    things. It can be quite challenging and frustrating to make sure that all of these
    things are running alright. Kubernetes gives us the orchestration and management
    capabilities required to deploy the containers at scale. To build the application
    services with the Kubernetes orchestration allows us to span multiple containers
    and timely schedule those containers across a cluster, scale those containers
    when it''s not in use, and manage the health of those containers from time to
    time. In a nutshell, Kubernetes is more like a Master manager that has many subordinates
    (containers). What a manager does is maintain what the subordinates need to do.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 1.2.3 What are the Advantages of Kubernetes?


    The following are the advantages of Kubernetes:


    # Portable and Open-Source:


    Kubernetes can run the containers on one or more public cloud environments, virtual
    machines, or bare metal, which means it can be deployed on any infrastructure.
    Moreover, Kubernetes is compatible across multiple platforms, making a multi-cloud
    strategy a highly flexible and usable component.


    # Workload Scalability:


    Kubernetes course offers the following useful features for scaling purpose:


    **Horizontal Infrastructure** Operates on the individual server level to implement
    horizontal scaling. New servers can be added or removed easily.


    We can alter the number of containers running, based on the usage of CPU resources
    or other application-metrics.


    **Manual** The number of running containers through a command or the interface
    can be manually scaled.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '**Replication** The replication controller makes sure that the cluster has
    a specified number of equivalent pods in a running condition. If there are too
    many pods, the replication controller can remove the extra pods or vice-versa.


    # High Availability:


    Kubernetes can handle the availability of both the applications and the infrastructure.
    It tackles the following:


    **Health** The application doesn’t fail by constantly checking with the health
    of modes and containers. Kubernetes offers self-healing and auto replacement if
    a pod crashes due to an error.


    **Traffic Routing and Load** Kubernetes’ load balancer distributes the load across
    multiple loads, enabling us to balance the resources quickly during incidental
    traffic or batch processing.


    # Designed for Deployment:


    Containerization has an ability to speed up the process of building, testing,
    and releasing the software, and the useful features include the following:


    **Automated Rollouts and** It can handle the new version and update our app without
    any downtime, while we monitor the health'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'during the roll-out process. If any failure occurs during the process, it can
    automatically roll back to the previous version.


    # Canary


    So, the production of the new deployment and the previous version can be tested
    in parallel, that is, before scaling up the new deployment and parallelly scaling
    down the previous deployment.


    # Programming Language and Framework


    Most of the programming languages and frameworks like Java, Python, and so on,
    are supported by Kubernetes. If an application has the ability to run in a container,
    it can run in Kubernetes as well.


    # Kubernetes and Stateful Containers:


    Kubernetes’ Stateful Sets provides resources like volumes, stable network ids,
    and ordinal indexes from o to N, and so on, to deal with the stateful containers.
    Volume is one such key feature that enables us to run the stateful application.
    The two main types of volume supported are as follows:


    # Ephemeral Storage


    Ephemeral data storage is different from Docker. In Kubernetes, the volume is
    taken into account in any containers that run within the pod, and the data is
    stored across the container. But, if the pods get killed, the volume is automatically
    removed.


    # Persistent


    The data remains for the lifetime. So, when the pod dies or it is moved to another
    node, that data will still remain'
