- pgno: 175
  md: '# 3.3 Analytics behind the problem statement


    The main purpose of this project was to build a CNN model that would classify
    if the subject has a tumor or not, based on an MRI scan. We used the **VGG-16**
    model architecture and weights to train the model for this binary problem. We
    used accuracy as a metric to justify the model performance which can be defined
    as follows:


    # WHAT IS BRAIN TUMOR?


    A cancerous or non-cancerous mass or growth of abnormal cells in the brain. Tumors
    can start in the brain, or the cancer from elsewhere in the body can spread to
    the brain. These symptoms may include headaches, seizures, problems with vision,
    vomiting, and mental changes. The headache is classically worse in the morning
    and goes away with vomiting. Other symptoms may include difficulty in walking,
    speaking or difficulty with other sensations. As the disease progresses, unconsciousness
    may occur.


    Here, our goal is to compute the extreme points along the contour of the brain
    scan in the image; find the extreme north, south, east, and west (x, y)-coordinates
    along a given contour. This method can be used on both raw contours and rotated
    bounding boxes.


    Let’s import the required libraries.'
  merge: -1
  img_proc: true
