  md: '# Figure 8.12: Streamlit st.file_uploader()


    STEP 4: Now, let’s build the first model for OpenCV Pencil Sketch. If we gave
    the condition that if you want to select the model from Step 2 here, it will be
    the pencil sketch, and the dodgeV2() and pencilsketch() function will do the necessary
    pre-processing like transforming and scaling the image, and returning the output.
    The st.image() function will show the input and output image in the browser. The
    st.write() function shows the text you want in your browser. The st.file_uploader()
    function will return a BytesIO object. However, Image.open() accepts a string
    to read an image.


    ```

    def dodgeV2(x, y):

    return cv2.divide(x, 255 - y, scale=256)

    def pencilsketch(inp_img):

    img_gray = cv2.cvtColor(inp_img, cv2.COLOR_BGR2GRAY)

    img_invert = cv2.bitwise_not(img_gray)

    img_smoothing = cv2.GaussianBlur(img_invert, (21, 21),sigmaX=0,

    sigmaY=0)

    final_img = dodgeV2(img_gray, img_smoothing)

    return(final_img)

    if model == "Pencil Sketch":

    st.subheader("PencilSketcher app to Cartoon Image")

    if file_image is None:

    st.write("You haven''t uploaded any image file")

    else:

    input_img = Image.open(file_image)

    final_sketch = pencilsketch(np.array(input_img))

    st.write("**Input Photo**")

    ```'
