- pgno: 110
  md: '# 2.3 Breakdown technique to build production pipeline


    In this section, we will see how to frame your business problem, so that we can
    break down the Machine learning life cycle components, and build each component,
    so that we can build the Kubeflow pipeline.


    The following is the high level framework from the Jupyter Notebook code to the
    Pipeline components, and serving and hosting that in Cloud.


