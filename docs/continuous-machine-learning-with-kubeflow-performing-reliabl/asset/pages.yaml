  md: '# 1.2.4 How do Kubernetes work?


    A cluster is the foundation of **Google Kubernetes Engine** the Kubernetes objects
    that represent your containerized applications all run on top of a cluster. In
    GKE, a cluster consists of at least one control plane and multiple worker machines,
    called nodes. These control plane and node machines run the Kubernetes cluster
    orchestration system.


    ![](img/8f8a671916d96b455297952d0f37b96c_39_0.png)


    Figure 1.5: Kubernetes Architecture'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Master:


    The master is the controlling element of the cluster. The master has the following
    three parts:


    **API** The application that serves Kubernetes’ functionality through a RESTful
    interface and stores the state of the cluster.


    The scheduler watches the API server for the new Pod requests. It communicates
    with the Nodes to create the new pods and assign work to the nodes while allocating
    the resources or imposing constraints.


    **Controller** The component on the master runs the controllers. It includes the
    Node controller, Endpoint Controller, Namespace Controller, and so on.


    # Slave (Nodes):


    These machines perform the requested, assigned tasks. The Kubernetes master controls
    them. There are the following four components inside the Nodes:


    All containers will run in a pod. Pods abstract the network and storage away from
    the underlying containers. Your app will run here.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The Kubectl registering the nodes with the cluster, watches for work assignments
    from the scheduler, instantiates new Pods, and reports back to the master.


    **Container** It is responsible for managing the containers, image pulling, stopping
    the container, starting the container, destroying the container, and so on.


    **Kube** It is responsible for forwarding the app user requests to the right pod.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 1.3 Kubernetes components


    In this section, let’s understand the deep concept behind the functionality of
    Kubernetes’ each and every important components.


    # NODE:


    A node is the smallest unit of the computing hardware in Kubernetes. It is a representation
    of a single machine in your cluster. In most production systems, a node will likely
    be either a physical machine in a datacenter, or a virtual machine hosted on a
    cloud provider, like the Google Cloud Platform. Don’t let conventions limit you;
    however, in theory, you can make a node out of almost anything.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/8f8a671916d96b455297952d0f37b96c_43_0.png)


    Figure 1.6: Node Concept


    Thinking of a machine as a “node” allows us to insert a layer of abstraction.
    Now, instead of worrying about the unique characteristics of any individual machine,
    we can instead simply view each machine as a set of CPU and RAM resources that
    can be utilized. In this way, any machine can substitute any other machine in
    a Kubernetes cluster.


    # CLUSTER:'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Although working with the individual nodes can be useful, it’s not the Kubernetes
    way. In general, you should think about the cluster as a whole, instead of worrying
    about the state of individual nodes.


    ![](img/8f8a671916d96b455297952d0f37b96c_44_0.png)


    Kube-Cluster

    CPU: 50000

    RAM: 360 GB


    Figure 1.7: Cluster Concept


    # POD:


    Unlike the other systems that you may have used in the past, Kubernetes doesn’t
    run the containers directly; instead it wraps one or more containers into a higher-level
    structure called a Any containers in the same pod will share the same resources
    and local network. The containers can easily communicate with the'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'other containers in the same pod, as though they were on the same machine while
    maintaining a degree of isolation from the others.


    Pods are used as the unit of replication in Kubernetes. If your application becomes
    too popular and a single pod instance can’t carry the load, Kubernetes can be
    configured to deploy the new replicas of your pod to the cluster as necessary.
    Even when not under the heavy load, it is standard to have multiple copies of
    a pod running at any time in a production system to allow the load balancing and
    failure resistance.


    ![](img/8f8a671916d96b455297952d0f37b96c_45_0.png)


    Figure 1.8: Pod Concept


    The Pods contain one or more containers, such as the Docker containers. When a
    Pod runs multiple containers, the containers are managed as a single entity, and
    share the Pod''s resources. Generally, running multiple containers in a single
    Pod is an advanced use case.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "Pods also contain shared networking and storage resources for their containers:\n\
    \nPods are automatically assigned unique IP addresses. Pod containers share the\
    \ same network namespace, including the IP address and network ports. Containers\
    \ in a Pod communicate with each other inside the Pod on localhost.\n\nPods can\
    \ specify a set of shared storage volumes that can be shared among the containers.\n\
    \n```\n```yaml\n! pod.yaml\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name:\
    \ hello\nspec:\n  template:\n    # This is the pod template\n    spec:\n     \
    \ containers:\n      - name: hello\n        image: busybox:v1\n        command:\
