- pgno: 242
  md: '# 4.2 Architecture of TFX components


    The machine learning pipelines can become very complicated and consume a lot of
    overhead to manage the task dependencies. At the same time, the machine learning
    pipelines can include a variety of tasks, including the tasks for data validation,
    pre-processing, model training, and any post-training tasks. The connections between
    the tasks are often brittle, and can cause the pipelines to fail. Having brittle
    connections ultimately means that the production models will be updated infrequently;
    the data scientists or machine learning engineers loathe updating the stale models.
    Pipelines also require well-managed distributed processing, which is why the TFX
    leverages Apache Beam. This is especially true for large workloads.


    ![](img/8f8a671916d96b455297952d0f37b96c_242_0.png)


    Figure 4.1: TFX Architecture'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'A TFX pipeline is a sequence of components that implement a machine learning
    pipeline, which is specifically designed for scalable, high-performance machine
    learning tasks.


    **ExampleGen** is the initial input component of a pipeline that ingests and optionally
    splits the input dataset.


    **StatisticsGen** calculates the statistics for the dataset.


    **SchemaGen** examines the statistics and creates a data schema.


    **ExampleValidator** looks for the anomalies and missing values in the dataset.


    **Transform** performs feature engineering on the dataset.


    **Trainer** trains the model.


    **Tuner** tunes the hyper parameters of the model.


    **Evaluator** performs deep analysis of the training results and helps you validate
    your exported models, ensuring that they are to be pushed to production.


    **Pusher** deploys the model on a serving infrastructure.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '**Brief of TFX Components:** A component handles a more complex process than
    just the execution of a single task. All machine learning pipeline components
    read from a Channel to get the input artifacts from the metadata store. The data
    is then loaded from the path provided by the metadata store and processed. The
    output of the component, the processed data, is then provided to the next pipeline
    components. The generic internals of a component are always as follows:


    +   - Receive some inputs

    +   - Perform an action

    +   - Store the final result


    TFX COMPONENT FUNCTIONALITY


    ![](img/8f8a671916d96b455297952d0f37b96c_244_0.png)


    *Figure 4.2:* TFX Component Functionality'
  merge: -1
  img_proc: true
- pgno: 245
  md: In TFX terms, the three internal parts of the component are called Driver, Executor,
    and Publisher. The driver handles the querying of the metadata store; the executor
    performs the actions of the components; and the publisher manages the saving of
    the output metadata in the MetadataStore. The driver and the publisher aren’t
    moving any data, but instead, they read and write the references from the MetadataStore.
  merge: -1
  img_proc: true
