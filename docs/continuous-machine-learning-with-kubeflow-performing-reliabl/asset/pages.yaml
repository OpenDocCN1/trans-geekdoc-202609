  md: '# 5.2 General idea and concept behind Shap


    The goal of SHAP is to explain the prediction of an instance x by computing the
    contribution of each feature to the prediction. From the coalitional game theory,
    the shapely values were computed from the SHAP explanation methods. Each feature
    value instance acts as players in a coalition. How to fairly distribute the prediction
    among the features, Shapley values tells us that. A player is an individual feature
    value, for example, from a tabular data. A group of feature values can also be
    a player.


    For example, the prediction distribution among the image pixels can also be grouped
    to super pixels. One of the innovation that SHAP brought to the table is an additive
    feature attribution method, a linear model that explain the Shapley value.


    SHAP specifies the explanation as follows:


    g(z'') = ∅ₒ + ∑_{j=0}^{M} ∅_j Z''_j


    SHAP describes the following three desirable properties:


    # Local accuracy'
