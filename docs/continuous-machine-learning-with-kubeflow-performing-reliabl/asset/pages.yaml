  md: '# 5.6.1 Basic decision plot features


    Refer to the following decision plot of the 20 test observations; note that this
    plot isn''t informative by itself; we use it only to illustrate the primary concepts:


    The x-axis represents the model''s output. In this case, the units are log odds.


    The plot is centered on the x-axis at All the SHAP values are relative to the
    model''s expected value, like a linear model''s effects are relative to the intercept.


    The y-axis lists the model''s features. By default, the features are ordered by
    its descending importance. The importance is calculated over the observations
    plotted. This is usually different from the importance ordering for the entire
    dataset. In addition to the feature importance ordering, the decision plot also
    supports the hierarchical cluster feature ordering and the user-defined feature
    ordering.


    Each observation''s prediction is represented by a colored line. At the top of
    the plot, each line strikes the x-axis at its corresponding observation''s predicted
    value. This value determines the color of the line on a spectrum.'
  merge: -1
  img_proc: true
