- pgno: 26
  md: '# 1.1 Docker understanding


    Docker is a platform for the developers and system admins to build, run, and share
    the applications with the containers. The containers used to deploy the applications
    is called containerization. To deploy the applications, the containers are making
    things easier and flexible.


    Containerization is increasingly becoming popular because the containers have
    the following features:


    We can containerize the most complex applications as well.


    We can distribute the container replica’s process across a data center automatically.


    The containers make things more efficient than the Virtual machines by sharing
    and leveraging the host kernel.


    Due it’s portable nature, we can build them locally, deploy to the cloud, and
    run it from anywhere.


    **Loosely** They are highly independent and encapsulated, which allows us to replace
    or upgrade anyone without disrupting others.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Without any required configuration on the part of the user, it applies aggressive
    isolations and constraints to the processes.


    # Images and containers:


    Logically, a container is a running process, with some added encapsulated features
    which applies for the Host to be isolated from it and from the other containers.
    The most important aspects is that each container interacts with its own private
    file system, which is called container isolation; the Docker image provides this
    file system. So, an image includes most of the things which are needed to run
    an application – the code, runtimes, dependencies, and any other file system objects
    required.


    ![](img/8f8a671916d96b455297952d0f37b96c_27_0.png)


    Figure 1.1: Docker Architecture


    The Docker has two concepts which are almost the same with its VM containers as
    the idea of an image and a container. An'
  merge: -1
  img_proc: true
- pgno: 28
  md: image, which is the definition of that will be executed, just like an operating
    system image, and for a given image, the container is the running instance.
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.1.1 Dockerfile


    To get our Python or any language code running in a container is to warp it in
    a package as a Docker image, after that run a container based on it. The steps
    are sketched as follows:


    ![](img/8f8a671916d96b455297952d0f37b96c_29_0.png)


    Figure 1.2: Docker file process


    Next, for generating a Docker image, we need to create a Dockerfile which contains
    some set of instructions needed to build the image. The Dockerfile is then processed
    by the Docker builder which generates the Docker image. At last, with a simple
    Docker run command, we can create and run a container with the Python service.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '```

    # set base image (host OS)

    FROM python:3.8


    # set the working directory in the container

    WORKDIR /app


    # copy the dependencies file to the working directory

    COPY requirements.txt .


    # install dependencies

    RUN pip install -r requirements.txt


    # copy the content of the local src directory to the working directory

    COPY src/ .


    # command to run on container start

    CMD [ "python", "./server.py" ]

    ```


    ![](img/8f8a671916d96b455297952d0f37b96c_30_0.png)


    ![](img/8f8a671916d96b455297952d0f37b96c_30_1.png)


    ![](img/8f8a671916d96b455297952d0f37b96c_30_2.png)


    Figure 1.3: Dockerfile code


    Let’s split this file into the following lines:


    It uses the Python base image with the tag Python:3.8, which is a specific version
    of Python.


    Then, it creates a working directory, where we will copy our local files to that
    directory; here we have created an app folder and copied the requirements file
    which contains the Python library.


    Then, we have installed all the Python libraries with the pip command.


    Next, we use CMD, which is a command to run the Python file whenever the container
    gets started.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/8f8a671916d96b455297952d0f37b96c_31_0.png)


    ```

    docker build -t imagename:tag .

    ```


    Image Name


    Image tag version


    Current location of Dockerfile


    ![](img/8f8a671916d96b455297952d0f37b96c_31_1.png)


    ```

    docker run imagename:tag

