    it was the format for each container deployment.


    # Service:


    A service in Kubernetes is a REST object, similar to a Pod. Like all of the REST
    objects, you can POST a Service definition to the API server to create a new instance.
    The name of a Service object must be a valid DNS label name.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/8f8a671916d96b455297952d0f37b96c_49_0.png)


    # Figure 1.12: Service Concept


    For example, suppose you have a set of Pods that each listen on TCP port 9376
    and carry a label app=MyApp – this specification creates a new Service object
    named "my-service", which targets the TCP port 9376 on any Pod with the app=MyApp
    label.


    Kubernetes assigns this Service an IP address (sometimes called the "cluster IP"),
    which is used by the Service proxies. Port definitions in Pods have names, and
    you can reference these names in the targetPort attribute of a Service.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# WHY USE A SERVICE?


    In a Kubernetes cluster, each Pod has an internal IP address. But the Pods in
    a Deployment come and go, and their IP addresses change. So, it doesn''t make
    sense to use the Pod IP addresses directly. With a Service, you get a stable IP
    address that lasts for the life of the Service, even as the IP addresses of the
    member Pods change.


    A Service also provides load balancing. Clients call a single, stable IP address,
    and their requests are balanced across the Pods that are members of the Service.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 1.3.1 Types of Services


    There are the following five types of Services:


    **ClusterIP (default):** Internal clients send requests to a stable internal IP
    address.


    **NodePort:** Clients send requests to the IP address of a node on one or more
    nodePort values that are specified by the Service.


    **LoadBalancer:** Clients send requests to the IP address of a network load balancer.


    **ExternalName:** Internal clients use the DNS name of a Service as an alias for
    an external DNS name.


    **Headless:** You can use a headless service in situations where you want a Pod
    grouping, but don''t need a stable IP address.'
  merge: -1
  img_proc: true
