  md: '# 1.4 Introduction on Kubeflow Orchestration for ML Deployment


    Kubeflow is an open source Kubernetes-native platform for developing, orchestrating,
    deploying, and running scalable and portable ML workloads. It helps support the
    reproducibility and collaboration in ML workflow lifecycles, allowing you to manage
    the end-to-end orchestration of ML pipelines, to run your workflow in multiple
    or hybrid environments, and to help you reuse the building blocks across different
    workflows.


    ![](img/8f8a671916d96b455297952d0f37b96c_58_0.png)


    Figure 1.17: Kubeflow Architecture


    Kubeflow also provides support for the visualisation and collaboration in your
    ML workflow.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '**Kubernetes** The Pipeline Service calls the Kubernetes API server to create
    the necessary Kubernetes resources (CRDs) to run the pipeline.


    **Python** You create the components or specify a pipeline using the Kubeflow
    Pipelines **domain-specific language**


    **DSL** The DSL compiler transforms your pipeline’s Python code into a static
    configuration (YAML).


    **Pipeline** You call the Pipeline Service to create a pipeline run from the static
    configuration.


    **Orchestration** A set of orchestration controllers execute the containers needed
    to complete the pipeline. The containers execute within the Kubernetes Pods on
    virtual machines. An example controller is the **Argo Workflow** controller, which
    orchestrates the task-driven workflows.


    **Pipeline web** The Pipeline web server gathers data from various services to
    display relevant views – the list of pipelines currently running, the history
    of pipeline execution, the list of data artifacts, debugging information about
    individual pipeline runs, and execution status about individual pipeline runs.


    **Pipeline** You call the Pipeline Service to create a pipeline run from the static
    configuration.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '**Persistence agent and ML** The Pipeline Persistence Agent watches the Kubernetes
    resources created by the Pipeline Service and persists the state of these resources
    in the ML Metadata Service.


    **Artifact** The Pods store the following two kinds of data:


    Experiments, jobs, pipeline runs, and single scalar metrics. Metric data is aggregated
    for the purpose of sorting and filtering. Kubeflow Pipelines store the metadata
    in a MySQL database.


    Pipeline packages, views, and large-scale metrics (time series). Use large-scale
    metrics to debug a pipeline run or investigate an individual run’s performance.
    Kubeflow Pipelines stores the artifacts in an artifact store like Minio server
