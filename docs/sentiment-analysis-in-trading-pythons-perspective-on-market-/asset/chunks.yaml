    \ -0.016807  # Log returns for the second day\n2  0.009852  0.020001  0.033336\
    \  # Log returns for the third day\n3  0.009756 -0.004963  0.016261  # Log returns\
    \ for the fourth day\n```\n\n### 2. Transformation with map\n\n* We created a\
    \ `Series` of stock tickers.\n* We then defined a dictionary that maps stock tickers\
    \ to their full company names.\n* Using the `map` function, we transformed each\
    \ ticker in the `Series` to its corresponding full company name.\n\nThe result\
    \ is a `Series` with the full company names:\n\n```text\n0           Apple Inc.\n\
    1    Microsoft Corporation\n2           Alphabet Inc.\n```\n\nThese transformation\
