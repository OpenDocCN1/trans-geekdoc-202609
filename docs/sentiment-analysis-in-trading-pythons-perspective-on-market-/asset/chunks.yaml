    \   0.000  # 0.0% 平均收益率\n```\n\n这表明在我们数据集所代表的时间范围内，“医疗保健”板块股票的平均收益为 1.5%，而“科技”板块股票的平均收益为\
    \ 0%。这种总结对于分析市场趋势和做出明智的投资决策至关重要。\n\n# 为了说明如何使用 Pandas 进行分组和总结，让我们创建一个新数据集\n# 这次我们将包含多个板块的若干只股票以及它们在多天内的收益\n\
    \n```python\ndata = {\n    'Date': pd.to_datetime(['2023-01-01', '2023-01-01',\
    \ '2023-01-02', '2023-01-02',\n    '2023-01-03', '2023-01-03', '2023-01-04', '2023-01-04']),\n\
    \    'Stock': ['Stock_A', 'Stock_B', 'Stock_A', 'Stock_B',\n    'Stock_A', 'Stock_B',\
    \ 'Stock_A', 'Stock_B'],\n    'Sector': ['Tech', 'Healthcare', 'Tech', 'Healthcare',\n\
    \    'Tech', 'Healthcare', 'Tech', 'Healthcare'],\n    'Return': [0.02, 0.03,\
    \ -0.01, 0.02, -0.01, 0.00, -0.02, 0.01]\n}\n\ndf = pd.DataFrame(data)\n\n# 按\
    \ 'Sector' 分组并计算每个板块的平均收益\nsector_grouped = df.groupby('Sector')['Return'].mean()\n\
    print(sector_grouped)\n```\n\n# 处理缺失数据：清洗与转换\n\n现实世界的金融数据很少是整洁的。缺失或损坏的数据会偏差分析并导致不准确的结论。通过\
    \ Pandas，通过检测、删除或填充缺失数据，可以更容易处理此类缺陷。\n\n例如，`isnull()` 可以识别数据点缺失的位置，`fillna()`\
    \ 可以用适当的值填充这些空隙。以下是使用 Pandas 的示例：\n\n1. **检测缺失值**：我们使用 `isnull()` 来识别值所在的地方。\n\
    2. **删除包含缺失值的行**：使用 `dropna()` 删除了含有缺失值的行。\n3. **用均值填充缺失值**：我们使用 `fillna(df.mean())`\
    \ 用列的平均值填充缺失值。\n4. **前向填充缺失值**：`fillna(method='ffill')` 方法将最后一个有效观测值向前传播。\n5.\
    \ **后向填充缺失值**：相反，`fillna(method='bfill')` 将下一个有效观测值向传播。\n\n以下是每次操作后 DataFrame\
    \ 的状态：\n\n- **原始 DataFrame**：股票 A 和 B 的某些价格缺失。\n- **检测到的缺失值**：`True` 表示缺失值，`False`\
    \ 表示非缺失值。\n- **已删除缺失值的 DataFrame**：仅保留了没有缺失值的行。\n- **已填充缺失值（均值）的 DataFrame**：NaN\
    \ 值已用可用值的平均值替换。\n- **前向填充缺失值的 DataFrame**：缺失值被它们之前的上一个值替换。\n- **后向填充缺失值的 DataFrame**：缺失值被它们之后的下一个已知值替换。\n\
    \n```python\nimport numpy as np\n\n# 创建一个包含一些缺失值的 DataFrame\ndata = {\n    'Date':\
    \ pd.date_range(start='2023-01-01', periods=4, freq='D'),\n    'Stock_A_Price':\
    \ [100, 101, np.nan, 103],\n    'Stock_B_Price': [np.nan, 198, 202, 201],\n}\n\
    df = pd.DataFrame(data)\n\n# 检测缺失值\nmissing_values = df.isnull()\n\n# 删除包含缺失值的行\n\
    df_dropped = df.dropna()\n\n# 用指定的值填充缺失值，例如列的均值\ndf_filled_mean = df.fillna(df.mean())\n\
    \n# 使用前向填充方法填充缺失值，将最后一个有效值向前传播\ndf_filled_ffill = df.fillna(method='ffill')\n\n\
    # 使用后向填充方法填充缺失值，将下一个有效值向后传播\ndf_filled_bfill = df.fillna(method='bfill')\n\n#\
    \ 显示原始 DataFrame、检测缺失值的 DataFrame、\n# 删除缺失值的 DataFrame 以及填充缺失值的 DataFrame\ndf,\
    \ missing_values, df_dropped, df_filled_mean, df_filled_ffill, df_filled_bfill\n\
    ```\n\n"
