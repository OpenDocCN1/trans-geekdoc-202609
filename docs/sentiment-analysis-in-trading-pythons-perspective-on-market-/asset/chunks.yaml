    ### 1. Transformation with apply\n\n* We defined a function `log_return` to calculate\
    \ the logarithmic returns of stock prices, which is a common transformation in\
    \ financial analysis. own* We then used the `apply` function to apply this transformation\
    \ across each column in the `DataFrame`. This operation calculates the log returns\
    \ for each stock across time.\n\nHere are the calculated logarithmic returns for\
