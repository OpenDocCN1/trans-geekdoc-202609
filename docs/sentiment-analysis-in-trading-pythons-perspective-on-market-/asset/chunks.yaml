    \ 1. 使用 apply 进行转换\n\n* 我们定义了一个函数 `log_return`，用于计算股票价格的对数收益率，这是金融分析中常见的转换方法。\n\
    * 随后使用 `apply` 函数在 `DataFrame` 的每一列上应用此转换。该操作计算了每只股票随时间变化的对数收益率。\n\n以下是计算出的股票对数收益率：\n\
    \n```text\nStock_A   Stock_B   Stock_C\n0       NaN       NaN       NaN  # NaN\
    \ 是因为没有之前的价格进行比较\n1  0.009950 -0.010050 -0.016807  # 第二天的对数收益率\n2  0.009852  0.020001\
    \  0.033336  # 第三天的对数收益率\n3  0.009756 -0.004963  0.016261  # 第四天的对数收益率\n```\n\n\
    ### 2. 使用 map 进行转换\n\n* 我们创建了一个股票代码的 `Series`。\n* 随后我们定义了一个字典，将股票代码映射到完整的公司名称。\n\
    * 使用 `map` 函数，将 `Series` 中的每个代码转换为相应的完整公司名称。\n\n结果是一个包含完整公司名称的 `Series`：\n\n```text\n\
    0           Apple Inc.\n1    Microsoft Corporation\n2           Alphabet Inc.\n\
    ```\n\n这些转换操作被广泛应用于数据预处理，以便为分析或机器学习模型准备数据集。`apply` 函数非常强大，可以与任何你想应用于整个 `DataFrame`\
    \ 轴的函数配合使用，而 `map` 通常用于 `Series` 的逐元素转换。\n\n# 继续以金融数据为主题，创建一个包含股票价格的 DataFrame\n\
    \n```python\nstock_data = {\n    'Stock_A': [100, 101, 102, 103],\n    'Stock_B':\
    \ [200, 198, 202, 201],\n    'Stock_C': [300, 295, 305, 310]\n}\ndf_stocks = pd.DataFrame(stock_data)\n\
    \n# 定义一个简单的转换函数来计算股票价格的对数收益率\ndef log_return(prices):\n    return np.log(prices\
    \ / prices.shift(1))\n\n# 使用 apply 在 DataFrame 上应用 log_return 函数（按列）\nlog_returns\
    \ = df_stocks.apply(log_return)\n\n# 假设我们有一个股票代码 Series，并想将其映射到完整的公司名称\nstock_tickers\
    \ = pd.Series(['AAPL', 'MSFT', 'GOOGL'])\ncompany_names = {\n    'AAPL': 'Apple\
