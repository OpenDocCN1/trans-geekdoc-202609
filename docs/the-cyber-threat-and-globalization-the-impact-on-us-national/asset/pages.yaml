- pgno: 47
  md: '# Box 2.1 Internet Freedom Program


    The Internet Freedom program is a program run by the U.S. Department of State''s
    Bureau of Democracy, Human Rights, and Labor. The aim of the program is to promote
    fundamental freedoms, human rights, and the free flow of online information through
    collaboration for anti-censorship and secure communications technology. advocacy.
    digital safety. and research.


    While the ability to spoof an individual''s or entity''s location is a critical
    element of cybercrime, espionage, and sabotage, tools are currently being developed
    by the U.S. Department of State that utilize the vulnerability in IP protocol
    and network design to promote freedom of speech in closed regimes via the Internet.
    Such efforts complicate the attribution of cyberattacks as people are being actively
    trained to anonymize their Internet activities. It also inhibits prospects of
    international cooperation since some closed regimes view breaching of censors
    as a form of cyberwarfare and thereby withhold information during investigation.


    As part of its Internet Freedom Agenda, the State Department in cooperation with
    Internet companies is distributing tools and running seminars on how to mask identities
    in cyberspace. While the goal is the free flow of information, the tools and tactics
    can be used to attack U.S.-based information systems as well. This, unfortunately,
    does not contribute to a safe cyber ecosystem.


    # The Onion Router (TOR)


    One powerful method for achieving anonymity is the use of technology such as “the
    Onion Router,” a technology first developed by the U.S. Naval Research Laboratory
    to protect data packets on open networks. The Onion Router system is a distributed
    anonymous network of proxy servers connected by virtual encrypted tunnels.


    In 1995, employees at the U.S. Naval Research Laboratory began work to develop
    an anonymous network system to shelter and secure online U.S. intelligence communications.
    The Onion Router system, more commonly referred to as TOR, was first developed
    by mathematician Paul Syverson and computer scientists Michael G. Reed and David
    Goldschlag. After turning the project over to DARPA, the venture eventually became
    operational in 2003. By 2004, the government released the TOR code under a free
    license, and since 2006, the project has been maintained and developed as a Massachusetts-based
    501(c)(3) nonprofit. TOR Project Inc., and its staff of about thirty people, receives
    financial support from private donors and organizations as well as public sources.
    Its sponsors include the Bureau of Democracy, Human Rights, and Labor of the U.S.
    Department of State; DARPA; and the National Science Foundation, to name a few.14


    The TOR system draws its anonymity from two foundational elements. One is the
    TOR enabling software, which users can download freely. The other is a'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'network of volunteers who maintain their computers as relays for TOR traffic.
    Data is encrypted in multiple layers, like an onion, which are peeled away one
    layer at a time as it passes through a computer, or node, on the TOR network.
    Across the globe, approximately six thousand computers¹⁵ supported by three thousand
    volunteers¹⁶ maintain the TOR anonymity system.


    A computer linked to a TOR network transmitting data sends the data through a
    series of randomly selected proxy servers that strip away one layer of encryption
    along with the IP identification information. As communication snakes along its
    path, the information is encrypted between relays.¹⁷ The onion servers replace
    the IP identification information with new IP information and direct it to another
    proxy server to repeat the same process before connecting to the final server
    to distribute the information being sent from the point of origin. In this scheme,
    each relay decrypts a layer of encryption to reveal only the next relay address
    in the circuit. From that point, the relay passes on to the subsequent node the
    remaining encrypted data. The final relay, referred to as the “exit relay,” decrypts
    the innermost layer of encryption and sends the data of the original source to
    its destination without revealing, or even knowing, the source IP address or intermediate
    addresses. The effect of this is that if someone is observing the network traffic
    on any of the proxy servers, the observer will not be able to discern the true
    location of point A, nor will the observer be able to tell what the destination
    of the data is, unless he or she is observing the final transmission point.


    Because the routing of the communication is partly concealed at every hop in the
    TOR circuit, this method eliminates the possibility of revealing the identity
    of all communicating peers at any single point. Each node in the path records
    the preceding node and the immediate destination node, but the other nodes along
    the path remain concealed. An observer at point B will not know where the data
    is really coming from, as he will only be able to detect the location of the proxy
    server from which the data arrived at point B. Hence, no single part of the system
    can be used to establish traffic links with communication partners. In this way,
    a network address is masked, and there is no direct link between point A and the
    final destination of the data packet.


    A revision and enhancement to the TOR protocol included untraceable websites hosted
    on TOR nodes. These sites are only accessible via the TOR network and are known
    as “TOR hidden services” (THS). Referred to as rendezvous nodes, specific nodes
    within the network store contact information needed to reach a TOR hidden service
    site. In addition to acting as intermediary points, they also function as encryption
    keys in a distributed hash table (DHT) that resolve normal DNS addresses such
    as .com, .org, .gov, .ca, and .uk to .onion—the TOR hidden services URL address
    format.¹⁸ The THS protocol has the ability to thwart any third party effort to
    investigate or obstruct the traffic. However, for users with fewer privacy concerns,
    there is a software project called Tor2web. Tor2web allows TOR hidden services
    to be accessed from a standard browser without being connected to the TOR network,
    but it does not anonymize activity.


    Within the TOR network, THS real locations are concealed from each other, making
    the system more cryptic.¹⁹ There is also no indexing by common search'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'engines such as Google and Yahoo!. Although some directories are found on the
    “dark web,”20 there is no central record of all existing THSs, and some THS addresses
    are not published. (Yet THS search engines such as ahmia.fi are emerging and allow
    users to identify THS related to specific content.)21


    Since its beginning as a government research project, the TOR network has grown.
    Studies estimate that there are about forty-five thousand .onion addresses populating
    the TOR hidden service on any day.22 These sites are random and temporary, and
    therefore no accurate accounting of them exists. Nor are they restricted to lawful
    activity. According to a study sponsored by the UK Parliament in 2015, “Almost
    half of them were not accessible at the time of the analysis and about a third
    linked to sites generated automatically by computers infested with a botnet malware.”23
    Criminal activity accounts for almost half the traffic flowing over the THS network.
    Drugs, weapons, counterfeit products, and illegal pornography are the most common
    illicit items available for sale.


    The black market site Silk Road was the most notorious TOR hidden service. Between
    February 2011 and July 2013, the site processed over $1.2 billion worth of sales
    and supported 4,000 vendors and 150,000 customers.24 After the authorities terminated
    its operations, others quickly filled its position in the hidden marketplace.
    Silk Road 2.0 was up and running within one month (although that site was also
    taken down once authorities uncovered flaws in its computer code). When Silk Road’s
    founder, Ross William Ulbricht (aka Dread Pirate Roberts) was arrested, the cyber
    black market drew public attention around the world. Successor sites populated
    the TOR system and began offering vendors such value-added features as feedback
    metrics from customers. Customer satisfaction ratings included product quality
    and time to delivery scores.25


    Not all traffic along TOR is malicious. TOR hidden sites also offer a haven for
    whistleblowers and dissidents. The New Yorker magazine maintains a THS known as
    Strongbox that allows informants to share messages and files anonymously with
    the publication.26 Similarly, the Washington Post’s SecureDrop and the Hermes
    Center’s GlobalLeaks are tools for journalists to share files while protecting
    their sources.27 In another THS example, Italian citizens banded together to form
    MafiaLeaks. The developers established this site to subvert the Mafia code of
    silence (omertà) that protects gang members from prosecution. By providing citizens
    with the means to submit information about Mafia activity anonymously, the site
    helps to weaken the ability of Italian organized crime to honor their “code” and
    operate freely.28


    Nonetheless, despite the extra anonymity offered by the TOR hidden services platform,
    the vast volume of TOR traffic moves through the surface web. According to TOR
    Project Inc., over 98 percent of TOR users access the network in order to reach
    public sites and social media but want or need the anonymity to protect their
    privacy and maintain free speech.29 Dissident movements during the Arab Spring
    and in Iran and China were aided by TOR, which helped to conceal the communications
    and locations of activists. Both businesses and individuals rely on the TOR protocol
    to safeguard sensitive information. Firms can shield information on projects and
    corporate strategies from competitors and spies.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Forums and chat rooms for discussing private issues related to abuse, illness,
    or crime victimization can use TOR to assure confidentiality among chat group
    members.30 Law enforcement agencies have found TOR to be an effective tool for
    surveillance operations directed at criminal websites. Online and undercover,
    authorities can track the movements and activities of not only criminal organizations
    but also terrorist groups. To these ends, TOR Project Inc. works with law enforcement
    and counterterrorist efforts across the world to develop tools for pursuing and
    prosecuting perpetrators.


    Data on the scope and stripe of the users and usage of anonymous networks such
    as TOR are sparse and nonspecific. Movements are random, and the sites themselves
    are evanescent. Consequently, as encryption technology advances, the challenges
    of attribution remain. Meanwhile, the friction between the imperatives of security
    and the rights of privacy and freedom of speech also creates tensions. Many private
    citizens, businesses, government authorities, and media organizations depend on
    the anonymity of networks like TOR to communicate sensitive information. Unfortunately,
    so do criminals and terrorists.


    TOR, despite the original intentions of the U.S. government, is the primary network
    for underground illegal marketplaces.31 The technology to create an anonymity
    network in order to veil intelligence communications and protect contact between
    military command and control centers and field operations may have extended benefits
    to law enforcement, commerce, political activism, and advocates of free speech
    and privacy rights, but it has also facilitated the rise of privately maintained
    sites that traffic in illegal goods and services. Contraband drugs, weapons, hired
    assassins, exotic animals, child pornography, stolen or counterfeit documents,
    etc., can be found either on underground message boards, with prices and contact
    information, or on sites offering full e-commerce solutions, including purchase/checkout,
    payment management systems, and escort services.32 Moreover, the shadows of the
    dark web, where TOR users navigate, not only allow criminals, state sponsored
    spies, and terrorists to conduct business transactions, but they offer them an
    opaque platform to participate in untraceable forums to deploy malware and botnet
    attacks, coordinate operations, and recruit.


    The multifaceted implications for anonymizing technology, together with the hidden
    environment, challenge the imagination of researchers, policy makers, security
    experts, and even popular culture. Despite the interest and fascination by authorities
    and the public, progress in policy and legal codes still lags behind the technological
    advances. The transnationality of these networks and the challenges they create
    for traditional law enforcement make these anonymity networks problematic. Furthermore,
    the unindexed environments below the surface web where they maneuver are another
    frustration for authorities who are more accustomed to conventional investigative
    and prosecutorial techniques.


    TrendMicro studied the private sites available on the TOR system and compiled
    a table of offerings that can be purchased with a credit card. Table 2.1 gives
    only a partial list of goods, prices, and addresses. The more antisocial services
    such as botnet rentals, malware services, weapon purchases, assassinations, and
    the like are omitted for obvious reasons.'
