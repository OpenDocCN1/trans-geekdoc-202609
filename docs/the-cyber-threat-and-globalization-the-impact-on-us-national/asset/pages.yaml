  md: 'Moscow was moving to strengthen its relationship with Tehran.79 At that time,
    as now, U.S. calls for “regime change” in places like Syria and other flashpoints
    aroused the authoritarian governments in both Russia and Iran to view such utterings
    as veiled threats to their own legitimacy. Russia and Iran prefer a multipolar
    world order united against U.S. unilateralism. In such a system, both countries
    see themselves as major influencers in the region, and in Russia’s case, a global
    role.80 Cybercriminals and hacker patriots can be critical in helping to alter
    the power relationship in the Gulf region, the “near abroad,” and beyond. Therefore,
    Kremlin encouragement, sponsorship, and assistance will only grow with the weaponization
    of information in both the cognitive domain and technical domain. Currently, European
    intelligence officials estimate that as many as twenty to thirty crime groups
    inside Russia already have “nation-state-level” capacity to overcome virtually
    any cyber defense mechanism. In addition to being a force within the government’s
    cyberwarfare arsenal, they conduct financial crimes on an “industrial scale”81
    with a blind eye from Russian law enforcement.


    Energetic Bear/Crouching Yeti is a cyber threat actor that uses specialized malware
    focusing on strategic industrial sectors of nation-states that are politically
    opposed to Russia’s interests. Industrial control manufacturers and energy and
    defense sectors are the main targets. From 2011 to 2013, the group launched a
    coordinated spam and malware campaign against the defense industry in the United
    States and Canada and the petroleum sector in the United States and Europe.82
    Cyber experts observe that the primary objective of their exploit is for espionage
    purposes. However, analysis of exploit kit features reveals that sabotage is another
    option for its highly specialized malware. Therefore, damage or disruption in
    critical infrastructure sectors that depend on ICS and SCADA systems is an overhanging
    yet heretofore uninvestigated threat.83 Restraint has tactical advantages. If
    hackers finally decide to launch a strike, their mark may be caught off guard
    as it struggles to diagnose the problem and its source. In the absence of any
    incident history, the perpetrators’ previous self-imposed restriction might fool
    targets into believing they are victims of a system failure rather than the prey
    of a cyberattack. According to the Institute for Critical Infrastructure Technology,
    “Energetic Bear is uniquely positioned to assist in a combination of Digital and
    Physical warfare for military or political purposes. Similar to Russia’s Georgian
    campaign in the 2008 conflict.”84 Energetic Bear has been performing massive surveillance
    campaigns at least since 2010, and their list of victims is in the thousands.85
    By remaining inactive as a sabotage agent, its effectiveness and destructiveness
    are heightened by its stealth.


    In 2016, APT28 became a subject of the U.S. presidential campaign and reports
    in the media. APT28 (also referred to as Fancy Bear, Sofacy, and the above-mentioned
    Pawn Storm) is the exploit credited with penetrating the computers of the Democratic
    Congressional Campaign Committee. The same exploit moved to the Democratic National
    Committee (DNC). Russian military intelligence, the Chief Intelligence Directorate
    (GRU—Главное разведывательное управление), directed the operation.86 Unheard of
    prior to 2016, APT28 has been active since 2007.87 APT28 is not related to economic
    crimes. Rather than obtaining financial information for financial fraud purposes
    or resale, it'
