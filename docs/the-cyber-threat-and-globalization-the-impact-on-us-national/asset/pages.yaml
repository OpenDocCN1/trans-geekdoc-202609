  md: '# # The Mutable Domain 2


    # ## What Is Cryptology?


    Cryptology has been a science for at least four thousand years. The Egyptians
    and later Assyrians, Hebrews, Greeks, and Romans all used some form of encryption
    to secure communication in government and commerce. Codes employed systems of
    secret symbols, word scrambling, and intaglios (flat stone imprints) to transmit
    messages in secret. In modern times, cryptology relies on math theory to transfer
    data. Mathematical algorithms are the core of cryptology. Three types of cryptography
    algorithms exist: hash functions, private key, and public key.


    A hash function maps data of arbitrary size to data of fixed size by taking a
    group of characters and creating a string of numbers or a “key,” which is normally
    smaller than the original string of numbers. Essentially, the contents of a file
    are processed through a cryptographic algorithm to produce a unique numerical
    value—the hash value—that identifies the contents of the file. Called keys or
    simply “hashes,” these numeric values are commonly used for indexing and rapid
    data retrieval from databases. The hash value is representative of the original
    string of characters, but its compressed size makes locating data faster and more
    efficient. Hashes can also be thought of as fingerprints for files.1


    Sometimes referred to as one way encryptions, hash functions can turn text messages
    into strings of large fixed numbers to verify that input data (the message) maps
    to a specific hash value. These types of abbreviated hash values are also called
    message digests in encryption terminology. The hash function similarly transforms
    a digital signature into a small block of data that authenticates digital messages
    or documents. The digital signature and the message digest transmit to the receiver.
    The message digest and the signature are sent in sepa rate transmissions. The
    addressee then uses the same hash function to reproduce the message digest and
    compares it to the one they also derived from the digital signature. If the hash
    values/keys are the same, it is likely that the message was transmitted without
    errors and is authentic, because they are linked by the same hash function. The
    “one-way” prefix to the one-way encryption term refers to the'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'fact that it is extremely difficult to invert the large fixed string of numbers
    back into the text message.


    A second type of algorithmic key is called a private or secret key. A private
    key is an encryption/decryption method where the algorithm is known to the parties
    that exchange the coded message. The communicators share the key so that each
    is able to encrypt and decrypt messages. Because each trusted party shares the
    same key, the method is known as symmetric encryption. The security risk is the
    threat of someone outside the system or exchange loop gaining access to the key.


    The solution to the security dilemma of private key schemes took a radical turn
    in 1976 when two Stanford cryptologists, Whitfield Diffie and Martin Hellman,
    publish a paper titled “New Directions in Cryptology.” Until that time, a fundamental
    problem of the field involved methods of distributing cryptographic keys. The
    new solution, which became known as the Diffie-Hellman key exchange, proposed
    a protocol in which the transfer cannot be seen by observing the communication.
    This is explained by the fact that rather than sharing information, correspondents
    are actually creating a key together. This is done by creating two mathematically
    linked numbers and using them as separate keys—referred to as a private key and
    a public key. The public key in the pair can be shared with everyone; the private
    key is kept secret. Either of the keys can be used to encrypt a message; the opposite
    key from the one used to encrypt the message is used for decryption. In other
    words, what one key encrypts only the other can decrypt. A crude example would
    be the semi prime number 15 as the public key, with the private keys being prime
    number factors (3 x 5), which are used to encrypt/decrypt. In reality, the numbers
    in the key exchange are very large, and though paired together, they are not identical
    and hence are asymmetric.


    The communication exchange between two correspondents is thus: Each party of a
    communication has a pair of public and private keys. Each shares their public
    key with the other while maintaining control of their private key. Only the recipient’s
    private key can decrypt the sender’s message, which the sender encrypts with the
    recipient’s public key. If this seems confusing, try thinking of asymmetric cryptography
    in terms of these five steps:


    +   1. Alice and Bob establish communication by making available their public
    keys and keeping their private keys secret and secure.

    +   2. Alice puts a secret (encrypted with Bob’s public key) in a box and locks
    it with a padlock, which is a digital signature she created with her private key.

    +   3. She then ships the box to Bob.

    +   4. Bob receives the box and decrypts the message with his private key that
    corresponds with his public key, which Alice used to encrypt her message.

    +   5. He then uses Alice’s public key to verify her signature (padlock), which
    she encrypted with her private key.


    Hence, Bob can decipher the message and also be assured it came from Alice. To
    communicate back to Alice, Bob repeats the process. Since the box has always had
    at least one lock on while in transit, the opportunity to see what’s inside and
    steal the secret does not exist.2 In cryptographic terms this means that even
    if'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'someone intercepted and recorded the traffic in order to analyze it later,
    it would be impossible to decipher the public/private key. Having possession of
    only one of the keys is not enough information to allow an infiltrator to deduce
    the value of the complementary key. Despite the fact that exchanges may have been
    visible, the entire public/private key was never saved, never transmitted, and
    never itself made visible.


    Since the encryption/decryption of public and private keys is interchangeable,
    the private key also encrypted a digital signature. The shared public key decrypts
    and verifies the signature, which the recipient generates from the message or
    document.


    How then are the keys, which are large numbers, linked? There are several ways
    of pairing numbers. In cryptology, the dominant standard is the RSA algorithm.
    RSA stands for the Massachusetts Institute of Technology researchers who created
    the math scheme, Ron Rivest, Adi Shamir, and Leonard Adleman. A year after Diffie
    and Hellman published their article, Rivest, Shamir, and Adleman published a piece
    in Scientific American called “A New Kind of Cypher That Would Take a Million
    Years to Break.” The cypher draws its security from the complexity of factoring
    large whole numbers that are the product of two large prime numbers. These semi-prime
    numbers, as they are known, are easy to create but almost impossible to factor
    back to arrive at the original prime numbers. Furthermore, the larger the semi-prime,
    the more difficult the factoring. The largest prime number known has 17.5 million
    digits. It is infeasible to determine the original primes of the RSA algorithm
    owing to the time it takes, even using today’s supercomputers. According to James
    Lyne, global head of security research at the security firm Sophos, “It would
    take thousands of computers millions of years” to calculate the numbers that could
    have been multiplied together to form the semi prime to get back to the original
    values.³ For this reason, the RSA algorithm is essentially still the prevailing
    standard for encryption over the Internet. It is built into many software products,
    including Netscape Navigator and Microsoft Internet Explorer. The technology is
    so powerful and resilient that the U.S. government restricts exporting it to foreign
    countries.⁴


    Despite the impressive statistical probability surrounding RSA, the search for
    more complex integers continues. In fact, RSA may be on the verge of being superseded
    by alternative approaches to factoring. Elliptic curve cryptology (ECC) is gaining
    support, with many researchers seeing it as an alternative to RSA. ECC is a public
    key encryption technique based on elliptic curve theory. Its attraction for many
    security experts is that it can generate faster, smaller, and more efficient cryptographic
    keys. The elliptic curve discrete logarithm presents a considerably more challenging
    code-breaking problem for would be hackers than factoring. Furthermore, ECC key
    sizes can be significantly smaller than those required by RSA and yet provide
    equivalent security with lower computing power and battery resource usage. The
    result is that ECC becomes a more efficient encryption method for mobile applications.⁵
    This feature is particularly attractive as we consider the approaching explosion
    in IoT usage.


    The entire arrangement of key exchanges, distribution, and verification is known
    as the **public key infrastructure** (PKI). The topography of PKI consists of
    hardware, software, and policies and standards to manage the creation,'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'administration, distribution, and revocation of keys and digital certificates.
    A digital certificate is sometimes referred to as a public key certificate and
    is central to PKI. These units of data are in the form of attachments to the electronic
    message. They confirm the identity of the certificate holder and tie that identity
    to the public key, which is also contained in the digital certificate. Digital
    signatures are issued by organizations called CAs. CA stands for “certificate
    authority” or “certification authority,” which are “trusted third parties” that
    produce signed digital certificates. VeriSign and DigiCert are examples. In some
    cases, companies and organizations create their own in-house CAs.


    Digital certificates usually contain the owner’s public key (used for encrypting
    messages and digital signatures), the expiration date of the certificate, the
    owner’s name, and other pertinent data about the public key owner. The system
    relies on CAs to create a trusted chain of information exchange for Internet traffic.


    However, while a reliable CA can ensure the security of data traffic, the security
    of the CA itself is not always a guarantee. In 2011, several CAs were victims
    of hacks. Hackers compromised user accounts and fraudulently exploited digital
    signatures. In a noted case, someone (or some entity) stole a Dutch CA’s signing
    keys. The thieves used the keys to intercept Iranian users’ access to Google’s
    Gmail. The prime suspect was the U.S. National Security Agency. Within weeks of
    the discovery, DigiNotar, a privately owned Dutch certificate authority, had its
    operational management transferred over to the government and shortly thereafter
    declared bankruptcy.6 The same year, the Stuxnet operation also used stolen certificates
    to infiltrate the computer system at Natanz.7


    Criminals and governments can and have used stolen certificates to launch man-in-the-middle
    attacks. These techniques intercept or redirect traffic to counterfeit sites as
    they deceive users into thinking their communication is confidential. Malware
    imbedded with stolen digital signatures, as was used in Stuxnet, escapes detection
    by installers and opens systems to manipulation and possible ruin. Malware, or
    malicious software, varies according to technique, purpose, and sophistication.
    They are the weapons in the cyber arsenal of information age warfare. Their complexity
    intensifies and their dispersion advances hourly.


    # Exploiting the System


    As covered in chapter 1, computer networks are dependent on the use of internationally
    standardized communications protocols (TCP/IP) to send and receive data packets
    and information. TCP/IP allows for the flow of data packets and information across
    computer networks, including the Internet. The way machines identify each other
    on the Internet is through Internet Protocol (IP) and media access control (MAC)
    addresses. MAC is a hardware address that uniquely identifies each node on a network.
    Recalling the previous discussion, IP was not intended to function as the backbone
    of the global project that became the Internet. Designed and deployed for military
    and research purposes in the late 1960s, the ability to track and trace user behavior
    in a highly untrustworthy computing environment was not embedded into the design
    of communications'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'protocols.8 It is this foundational protocol on which the Internet runs that
    is too weak to provide reliable security mechanisms.9 According to Internet expert
    Tom Leighton, the DNS, ports, and IP address systems are plagued by flaws that
    “imperil more than individuals and commercial institutions. Secure installations
    in the government and military can be compromised as well.”10


    Consequently, the current flaws in the network architecture of the Internet are
    a result of relying on the protocols that were built thirty five years ago when
    the Internet was not a global entity but a closed research network. When it did
    become global, there was no shift to create stronger security mechanisms. To better
    understand the functioning of TCP/IP, a brief recount and description of how information
    is sent across networks is necessary.


    Data packets are the basic units of network traffic. They are the standard way
    of dividing information into smaller units when sending information over a network.
    A significant component of computer networks is the IP header, which contains
    information pertaining to the source and destination addresses. Machines require
    these strings of numbers to connect with other computers on the Internet or other
    networks.11 All networked hardware must have a valid IP and MAC address to function
    on the network. Data packets are re-created by the receiving machine based on
    information within the header of each packet that tells the receiving computer
    how to re-create the information from the packet data. Without international standards,
    such as TCP/IP, there would be no assurance that packets could be read by a receiving
    machine.12


    Manipulating TCP/IP to spoof identities (when an unknown source sends a communication
    while disguising itself as a source known to the receiver) has become a norm in
    cyberspace. In the past, a significant understanding of networking was required
    to spoof one’s IP address. However, over the past fifteen years, there has been
    a proliferation of tools for the layman to anonymize his Internet activities.
    “Onion routing” networks (discussed below) are one example that allows for the
    masking of a data packet’s point of origin. Activists may enter the Internet from
    unsecured WiFi networks or cyber cafés or dial into ISPs across the planet to
    hide their identity from the prying eyes of government censors. Most malicious
    actors may propagate zombies to serve as proxies for cyberattack. Actors may spoof
    IP addresses to inject malicious data into critical infrastructures, commit fraud,
    or bypass authoritarian censors.


    These spoofing attacks are the foundation of the attribution challenge. Masking
    one’s location on the Internet strikes at the root of trust in identity and security
    in cyberspace. An individual may manipulate various layers of the TCP/IP protocol
    in order to create a false appearance of a user, device, or website. Given the
    global nature of the Internet, it is possible for a malicious actor to exploit
    software vulnerabilities in such a way that makes computers appear is if they
    are located elsewhere in the world. This technique gives skilled attackers the
    ability to evade cybercrime investigations. Dorothy Denning aptly points out that
    in order to “trace an intruder, the investigator must get the cooperation of every
    system administrator and network service provider on the path.”13 This is the
    root of the attribution problem, but not an impossible challenge to surmount with
    the appropriate global policies in place.'
