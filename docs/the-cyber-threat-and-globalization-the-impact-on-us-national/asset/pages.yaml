    # Conclusion


    Many terrorist organizations are advancing their use of cyberspace to meet their
    tactical, operational, and strategic objectives. This is evidence that cyber power
    is becoming increasingly important as a strategic environment for nation states
    and violent nonstate actors alike. The intention of this chapter was to conduct
    an investigation into the role that cyberspace plays in shaping terrorist operations.
    By examining what is observed in the terrorist use of the domain, this discussion
    offers a belief that the use of cyberspace by terrorist organizations and the
    ability to cause physical effects via cyber are mutually exclusive. Illustrations
    of the difference between a spectrum of cyber-enabled operations and cyber operations
    confirmed this difference. The ability of Al-Shabab to recruit U.S. citizens for
    operations abroad, and Anwar al-Awlaki to radicalize a U.S. service member, has
    drawn attention to the reality of e-recruiters being able to identify, appeal
    to, and radicalize vulnerable individuals. The “always on” two-way transfer of
    information via the Internet gives terrorist organizations the ability to direct
    information across the globe instantaneously, encrypted and anonymously. We have
    seen that terrorist planning and execution are increasingly migrating toward cyber
    space. Both the political and technical aspects of the Internet complicate policy
    responses to this emergent threat. The practical importance of all this is to
    craft appropriate counterterrorist policies that have the right balance between
    security and privacy.


    Further, we are not at the point in time where terrorists can cause malicious
    effects of national significance against critical infrastructure. Their human
    capital and financing, given the complexity of the target set, is not sufficient
    to cause the overhyped “cyber 9/11.” However, overlooked is the potential for
    psyber warfare. In the near term, this is the more likely use of cyber to create
    physical effects. When all these elements are blended together, we get the extreme
    example of a hypothetical strategic use of cyberspace by a terrorist organization.


