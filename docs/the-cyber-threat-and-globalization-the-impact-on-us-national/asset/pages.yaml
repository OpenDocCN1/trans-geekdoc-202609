  md: "> >Jack Jarmon and Pano Yannakogeorgos unpack the complex nature of ever-evolving\
    \ cyber threats and provide an easy-to-read yet deeply informative interpretation\
    \ of how our modern way of life—from national security to commerce to communication—is\
    \ threatened by cyber insecurity. This book provides a foundational understanding\
    \ of how cyberspace has transformed the nature of national security, global conflict,\
    \ and international relations and will be relevant for years to come.\n> \n> —MELISSA\
    \ HATHAWAY, president, Hathaway Global Strategies, and former cyber advisor to\
    \ Presidents George W. Bush and Barack Obama\n\n> >“This book creates a vitally\
    \ important context for linking and learning about cyber threats and globalization.\
    \ The clarity and ingenuity of the book’s presentation make it appropriate for\
    \ undergraduates and general readers alike.”\n> \n> —RICHARD LANGHORNE, director,\
    \ Centre for Global Studies, University of Buckingham\n\nIN THE POSTINDUSTRIAL\
    \ AGE, INFORMATION IS MORE VALUABLE THAN territory and has become the main commodity\
    \ influencing geopolitics today. The reliance of societies on cyberspace and information\
    \ and communication technologies for economic prosperity and national security\
    \ represents a new domain of human activity and conflict. Their potential as tools\
    \ of social disruption and the low cost of entry to asymmetric conflict have forced\
    \ a paradigm shift.\n\nThe Cyber Threat and Globalization is designed for students\
    \ of security studies and international relations, as well as security professionals\
    \ who want a better grasp of the nature and existential threat of today’s information\
    \ wars. It explains policies and concepts and describes the threats posed to the\
    \ United States by disgruntled employees, hacktivists, criminals, terrorists,\
    \ and hostile governments.\n\n# FEATURES\n\n+   - Special textboxes provide vignettes\
    \ and case studies to illustrate key concepts.\n+   - Opinion pieces, essays,\
    \ and extended quotes from noted subject matter experts underscore the main ideas.\n\
    +   - Written to be accessible to students and the general public; concepts are\
    \ clear, engaging, and highly practical.\n\nJACK A. JARMON has taught international\
    \ relations courses at the University of Pennsylvania, the John C. Whitehead School\
    \ of Diplomacy and International Relations at Seton Hall University, and Rutgers\
    \ University, where he was also associate director of the Command, Control and\
    \ Interoperability Center for Advanced Data Analysis—a Center of Excellence of\
    \ the Department of Homeland Security, Science and Technology Division.\n\nPANO\
    \ YANNAKOGEORGOS is dean of the Air University Cyber College. Previously, taught\
    \ at Rutgers University Division of Global Affairs and served as an adviser within\
    \ the Unit Nations Security Council.\n\n. ROWMAN & LITTLEFIELD\n800-462-6420\n\
    WWW.ROWMAN.COM"
