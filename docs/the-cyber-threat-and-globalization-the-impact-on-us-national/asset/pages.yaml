  md: 'objective of the 2014 SPE attack was to deter Sony from releasing The Interview
    and barring that, deter theaters from showing the film. While Pyongyang initially
    succeeded in coercing SPE to cancel the release, its triumph turned into failure
    once the U.S. government stepped in.


    Despite its eventual failure and relative ineffectiveness, the 2014 SPE attack
    demonstrates the potential value of cyber as a coercive tool when dealing with
    entities below the state level. SPE executives were quick to cave to hackers''
    demands just three weeks after the initial breaches of the company''s networks
    and one day after being threatened with 9/11-style attacks on theaters showing
    the film. As mentioned, the attacks by the GOP appear to have ended after Sony''s
    announcement of postponement. This can be viewed as successful use of cyber means
    for deterrence.


    Two additional characteristics of the 2014 SPE hack are worth noting. First, the
    pairing of other forms of statecraft with the SPE cyberattack is present. The
    SPE cyberattacks contained elements of diplomacy (e.g., statements by the Ministry
    of Foreign Affairs), information (e.g., statements through official DPRK media),
    and economic (e.g., the publishing of unreleased movie scripts online in attempts
    to affect SPE income). Each would have been more effective if carried out with
    the initial knowledge that the acts were supported and perpetuated by the North
    Korean government. For example, by confusing attribution at the outset, North
    Korea limited potential use of military or economic provocations to threaten escalation
    and elicit potential concessions from SPE or other involved governments. Obscuring
    attribution also arguably limited any future attempts to halt the film''s release
    through diplomacy, though the June 2014 attempts had already failed. Instead of
    blunting retaliation by the victim, attribution issues limited the options of
    the attacking government.


    Second, the 2014 SPE cyberattack represented another example of North Korea ignoring
    norms of international


    behavior. In this instance, Pyongyang violated U.S. law as well as U.S. territorial
    sovereignty by conducting a cyberattack that resulted in theft and damage to a
    computer network resident within the U.S. These violations fall into what have
    been deemed “internationally wrongful acts,” as decided by the UN Group of Governmental
    Experts recommendations.29


    Finally, while the GOP attacks appear to have ceased after SPE announced the postponement
    of The Interview’s release, the exact cause for this termination is debatable.
    The cessation of North Korean cyber hostilities can just as easily be linked to
    President Obama’s escalation through his 19 December announcement naming North
    Korea as responsible for the attacks and promising a U.S. response. The fact that
    there was no reported retaliation by Pyongyang after the 21 December announcement
    by SPE that The Interview would indeed be released supports the argument that
    cyber is not as effective a tool of coercion if the attacker does not maintain
    escalation dominance. The declaration by the president represented an escalation
    in the conflict; and the U.S. maintains escalation dominance over North Korea
    in all elements of statecraft. North Korea, having been blamed by the U.S. for
    the SPE attack risked further escalation were it to have continued cyberattacks.


    North Korea provides U.S. policy makers useful insight on how to deal with weaker
    nations for whom norms and international law mean little. As a weak nation, North
    Korea has been mostly unsuccessful when using cyber for deterrence and coercion
    primarily because it does not maintain escalation dominance against the state
    actors it is targeting. In instances where it did maintain escalation dominance
    (e.g., in the SPE hack, before U.S. government intervention) it achieved some
    success. Other weak states are likely to find similar results when using cyber
    as a form of statecraft. While reinforcing state action in cyberspace with other
    forms of statecraft may enhance a deterrence campaign’s effectiveness, the use
    of cyber will remain'
