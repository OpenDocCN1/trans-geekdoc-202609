- pgno: 61
  md: 'Having gained entry, the malware beacons out to command-and-control (C2 or
    CC) servers requesting additional instructions or malicious code. The malware
    then updates code and distributes the malware payload to other machines. Firmly
    implanted, the exploit gathers data, including account names and passwords for
    decryption. The attacker identifies and accesses information from the penetrated
    system and collects it on a staging server. Once the network falls under the control
    of the attackers and they begin receiving data, the co-opted network is considered
    breached.


    Carbanak—in 2013 an APT attack targeted over one hundred banks in Ukraine, Russia,
    Germany, China, and the United States. By the time it was uncovered, experts estimate
    that over one billion U.S. dollars had been stolen. Cybercriminals drained the
    financial system by either transferring funds into false accounts or dispensing
    cash via ATMs where affiliates, or “mules,” waited to make the collection. The
    mules would collect the money and transfer it over SWIFT (Society for Worldwide
    Interbank Financial Telecommunications) to accounts belonging to other affiliates.⁵⁷
    The name Carbanak refers to the cyber criminal group credited with the attack
    and the malware used in the scam. As of 2016, many security experts believe that
    not only is the scam still active, but it is now targeting the hospitality industry.⁵⁸


    The opening attack used spearphishing e-mails sent to employees of the target
    banks. The e-mails appeared as legitimate banking communications from a co-worker,
    often containing a news clip as an attachment. Once the attachments were clicked
    on, the malware downloaded. Sometimes e-mail recipients were redirected to websites
    containing exploit kit software. These exploit kits ran on web servers and identified
    vulnerabilities in targeted machines, with which they eventually communicated,
    uploading and executing malicious code. Once that code was uploaded, attackers
    began trawling the bank’s network to identify employees who administered cash
    transfer systems or could remotely connect to ATMs. These accounts then became
    compromised.⁵⁹


    The reconnaissance component to Carbanak also allowed attackers to take of video
    capabilities on the target systems. Remote access tools captured video and screenshots
    of system administrators and other employees’ computers and thereby allowed attackers
    to conduct long-term surveillance. Gradually the cyberthieves gained insight into
    their victims’ operational picture. As an understanding of the protocols, workflow,
    practices, and tools of their targets came to light, exploitation methodologies
    and mechanisms were developed and tailored to each victim. Cybercriminals impersonated
    legitimate users with the permissions to perform actions, which were later used
    to process fraudulent transactions.⁶⁰ Unfortunately, even when evidence of an
    APT attack has been removed, often the network remains compromised. As a result,
    the hackers can return at any time to continue exploiting the breach. The exploit
    is long term in its implementation and execution.


    APTs represent an evolving weaponry of the cyber conflict arena. In the new virtual
    warscape, actors are bound by electronic connections rather than regional jurisdictions
    and state borders. These circumstances benefit those outside the law and create
    obstacles for law enforcement, who generally are rooted territorially. The “de-bordering”
    of the world map as a result of globalization pertains to'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'commerce in far more practical terms than it does to governance. As technology
    blurs the contours of previously established boundaries and norms, policies and
    legal codes scramble, as do authorities, in order to keep pace with events.


    Whether associated by cultural and traditional ties or motivated by unem bellished
    economic self-interest, the new order of battle is an alternating pat tern of
    states, corporations, terrorists, criminals, and social activists. These actors
    attack, interact, and often secretly affiliate in a domain that remains ungovernable.
    Adding further disorder to the attempt to maintain order are the clashes between
    the requirements of security versus the rights of privacy and civil liberty. In
    these affairs, solutions have been elusive and comprise a delicate balancing act.


    # # Box 2.3 Defending against APTs


    # Tom Kellermann


    On May 10, 1940, the French realized the ineffectiveness of the Maginot Line against
    Nazi Germany''s invasion. We must accept the reality that perimeter defense is
    ineffective against the exploit kits, RATs [Remote Access Trojans], and application-based
    attacks of today. Our traditional architectures and controls for cybersecurity
    are inadequate. As the recent Verizon Data Breach Report noted, most breaches
    are not discovered for at least one hundred days. This damning reality necessitates
    a paradigm shift. Given the fact that the cybercriminal has a footprint within
    a company network for an extended period, organizations must alter their security
    posture accordingly; the metric by which we should assess the potency of a cyber
    countermeasure is how effectively it can decrease an adversary''s dwell time.
    Decreasing dwell time is the measurable metric by which we can value a return
    on investment for an enterprise. Diving down into what decreasing dwell time affords
    the enterprise requires an examination of what the costs are to the enterprise
    when exfiltration of their data occurs. The proper strategy for your organization
    is to build a structure that inhibits the free movement of the adversary once
    they penetrate your system. We


    must transform our castles into prisons via intrusion suppression. Intrusion suppression
    requires clandestine detection, deception, diversion, and eventual containment
    of a cyber adversary. It involves three steps that aim to detect cybercriminals
    by decreasing their dwell time and lateral movements.


    +   - A. Deploy a deception grid to enhance situational awareness per the latest
    techniques to deceive and divert the adversary unbeknownst to them.


    +   - B. Deploy adaptive authentication with contextual verification to eliminate
    an access adversary has to your network.


    +   - C. Deploy user entity behavior analytics, which provides contextual analysis
    on the activity and lateral movement of the adversary.


    We must spin the chessboard. In order to combat the cyber spy of tomorrow, the
    intrusion suppression architecture must be embraced.


    Tom Kellermann is CEO of Strategic Cyber Ventures, a Wilson Center fellow, and
    a former member of the Commission on Cyber Security for the 44th president of
    the United States.'
